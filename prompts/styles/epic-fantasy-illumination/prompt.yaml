schema_version: 1
id: epic-fantasy-illumination
display_name: Epic Fantasy Illumination
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 史诗奇幻彩绘
    visual_treatment:
      medium: 电影感水粉绘画，融合泥金装饰手稿的几何结构与细密墨线
      texture: 层叠矿物颜料、旧羊皮纸纹理与通透的氛围罩染
      shapes: 壮阔景观、清晰剪影与精细原创建筑
      palette: 青金石蓝、氧化铜色、余烬金、深紫与月光银
      lighting: 宏大的天光与温暖的人物尺度视觉焦点
      composition: 以辽阔的纵向纵深平衡亲密人物和可循的视觉路径

visual_treatment:
  medium: cinematic gouache painting with illuminated-manuscript geometry and fine ink detail
  texture: layered mineral pigment, worn parchment grain, and luminous atmospheric glazing
  shapes: monumental landscapes, readable silhouettes, and intricate original architecture
  palette: lapis blue, oxidized copper, ember gold, deep violet, and moonlit silver
  lighting: sweeping celestial light with warm human-scale focal points
  composition: expansive vertical depth balanced by intimate figures and navigable visual paths

continuity:
  preserve: [character silhouettes, clothing colors, tool designs, island geography, architectural motifs]
  avoid: [recognizable franchise imagery, copied heraldry, existing fantasy characters, embedded text, runes, logos, watermarks]

prompt: |-
  Render an original epic-fantasy narrative illustration as cinematic gouache
  with illuminated-manuscript geometry, mineral-pigment color, fine ink detail,
  and immense atmospheric depth. Keep people visually readable against
  monumental landscapes and preserve all declared continuity. Invent every
  costume, creature, structure, emblem, and tool for HaiLibrary. Include no
  text, letters, numbers, runes, maps with labels, logos, captions, or watermark.
