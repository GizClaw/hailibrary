schema_version: 1
id: watercolor-gouache
display_name: Watercolor Gouache
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 水彩与水粉
    visual_treatment:
      medium: 手绘水彩，辅以柔和的水粉点染
      texture: 细腻的冷压水彩纸纹理
      shapes: 清晰易读的剪影与柔和自然的边缘
      palette: 温暖自然的色彩，突出一个鲜明的故事物件
      lighting: 温馨柔和的漫射日光
      composition: 简洁不拥挤的绘本场景，突出一个明确动作

visual_treatment:
  medium: hand-painted watercolor with soft gouache accents
  texture: gentle cold-press paper grain
  shapes: clean readable silhouettes with soft organic edges
  palette: warm natural colors with one vivid story object
  lighting: diffuse daylight with welcoming warmth
  composition: uncluttered picture-book scenes with a clear focal action

continuity:
  preserve: [character proportions, clothing colors, recurring objects, landmark shapes]
  avoid: [embedded text, logos, watermarks, photoreal skin, visual clutter, harsh horror lighting]

prompt: |-
  Render a polished narrative illustration using hand-painted
  watercolor and soft gouache, subtle paper texture, warm natural light, clean
  readable silhouettes, and one clear focal action. Preserve every declared
  character and object invariant. Include no text, symbols, logos, or watermark.
