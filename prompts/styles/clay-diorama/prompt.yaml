schema_version: 1
id: clay-diorama
display_name: Clay Diorama
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 黏土微缩景观
    visual_treatment:
      medium: 手工塑形的黏土角色与微缩实景布置
      texture: 柔和指纹、卷制黏土边缘、毛毡草地与彩绘卡纸背景
      shapes: 圆润可触的造型，带有玩具般的比例
      palette: 温暖的大地色黏土，配以明亮的故事物件色彩
      lighting: 柔和的微缩摄影棚灯光与可信的接触阴影
      composition: 浅景深的立体布景，以接近角色视线的高度拍摄

visual_treatment:
  medium: handcrafted modeling-clay figures in a miniature practical set
  texture: soft fingerprints, rolled clay edges, felt grass, and painted-card scenery
  shapes: rounded tactile forms with toy-like proportions
  palette: warm earthy clay colors with bright story-object accents
  lighting: soft miniature studio lighting with believable contact shadows
  composition: shallow diorama depth photographed near subject eye level

continuity:
  preserve: [model proportions, clay colors, costume pieces, miniature scale]
  avoid: [slick CGI surfaces, human skin realism, deep uncanny shadows, embedded text, logos, watermarks]

prompt: |-
  Create the scene as a photographed handmade clay diorama with rounded modeling-
  clay figures, subtle fingerprints, felt and card scenery, and soft contact
  shadows. Keep it tactile, warm, friendly, and consistent with declared model
  details. Include no text, letters, numbers, symbols, logos, captions, or watermark.
