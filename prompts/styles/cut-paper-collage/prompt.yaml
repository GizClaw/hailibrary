schema_version: 1
id: cut-paper-collage
display_name: Cut-Paper Collage
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 剪纸拼贴
    visual_treatment:
      medium: 手工剪裁与撕制的彩纸拼贴
      texture: 纸张纤维、毛边、轻微折痕与浅浅的投影
      shapes: 由不同纸片叠合而成的简洁剪影
      palette: 愉快的哑光色彩，辅以克制的花纹纸点缀
      lighting: 柔和桌面光线，清楚呈现纸层厚度
      composition: 舞台般的层叠空间，突出一个明确动作

visual_treatment:
  medium: hand-cut and torn colored-paper collage
  texture: fibrous paper, deckled edges, subtle folds, and shallow cast shadows
  shapes: simplified overlapping silhouettes assembled from distinct paper pieces
  palette: cheerful matte colors with restrained patterned-paper accents
  lighting: soft tabletop light that reveals physical layers
  composition: layered stage-like depth with a clear focal action

continuity:
  preserve: [paper color assignments, silhouette cut patterns, clothing, recurring props]
  avoid: [painted brushwork, glossy plastic, photographic cutouts, embedded text, logos, watermarks]

prompt: |-
  Build the scene as an original handmade cut-paper collage. Every object should
  be assembled from layered matte paper with visible fibers, cut or torn edges,
  and gentle physical shadows. Use simplified readable silhouettes and preserve
  all declared character and prop colors. Include no text, letters, numbers,
  symbols, logos, captions, or watermark.
