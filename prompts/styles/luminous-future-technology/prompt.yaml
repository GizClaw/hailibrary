schema_version: 1
id: luminous-future-technology
display_name: Luminous Future Technology
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 明亮未来科技
    visual_treatment:
      medium: 干净细致、亲切易懂的近未来科技数码插画
      texture: 哑光陶瓷复合材料、透明玻璃、织物、绿植与柔光
      shapes: 模块化圆润建筑、结构清晰的机械、低调机器人与开放公共空间
      palette: 暖白、石墨色、青色、鲜绿色与少量珊瑚色点缀
      lighting: 明亮的漫射日光与柔和的发光引导灯
      composition: 通过有目的的日常使用，分层展示井然有序的系统

visual_treatment:
  medium: clean high-detail digital illustration of approachable near-future technology
  texture: matte ceramic composites, transparent glass, woven fabric, greenery, and soft light
  shapes: modular rounded architecture, legible mechanisms, unobtrusive robotics, and open public space
  palette: warm white, graphite, cyan, fresh green, and small coral accents
  lighting: bright diffuse daylight with subtle emissive guidance lights
  composition: orderly layered systems shown through purposeful everyday use

continuity:
  preserve: [device construction, interface color logic, architecture modules, mobility pathways]
  avoid: [dark cyberpunk alleys, dystopian surveillance, floating nonsense UI, brand resemblance, embedded text, logos, watermarks]

prompt: |-
  Render an original optimistic near-future technology scene with clean modular
  architecture, understandable devices, quiet robotics, integrated greenery,
  and bright natural light. Show technology through purposeful use rather than
  decorative interface clutter. Preserve system logic across scenes. Include no
  text, letters, numbers, brand marks, logos, or watermark.
