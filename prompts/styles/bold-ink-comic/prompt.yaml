schema_version: 1
id: bold-ink-comic
display_name: Bold Ink Comic
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 粗墨漫画
    visual_treatment:
      medium: 富有表现力的黑色墨线，搭配平涂数码色彩与少量网点纹理
      texture: 粗细多变的笔触、干刷细节与克制的点状纹理
      shapes: 以鲜明轮廓层次塑造具有图形感的剪影
      palette: 高饱和青色、红色、黄色与深墨黑
      lighting: 以富有戏剧性的块面阴影表现光线
      composition: 采用动感斜线构图，画面如同一格无边框漫画

visual_treatment:
  medium: expressive black ink with flat digital color and sparse halftone texture
  texture: variable brush lines, dry-brush accents, and controlled dot fields
  shapes: graphic silhouettes with strong contour hierarchy
  palette: saturated cyan, red, yellow, and deep ink black
  lighting: dramatic graphic shadow shapes
  composition: dynamic diagonal action framed as one borderless panel

continuity:
  preserve: [recognizable silhouette, costume details, prop geometry, directional continuity]
  avoid: [speech bubbles, captions, panel borders, sound-effect lettering, gore, logos, watermarks]

prompt: |-
  Render one energetic borderless comic illustration using bold
  variable black-ink contours, flat saturated colors, dynamic diagonals, and
  sparse halftone texture. Keep expressions friendly and action immediately
  readable. Do not include speech bubbles, captions, letters, numbers, symbols,
  logos, sound effects, panel borders, or watermark.
