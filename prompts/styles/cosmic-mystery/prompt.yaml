schema_version: 1
id: cosmic-mystery
display_name: Cosmic Mystery
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 宇宙谜境
    visual_treatment:
      medium: 带有雕刻式天文纹理的氛围数码绘画
      texture: 古老石材、薄雾、星野、深水与微妙的虹彩表面
      shapes: 以渺小而踏实的人物衬托巨大的弧形轮廓与不可能几何
      palette: 午夜蓝、氧化青、低饱和紫、黑色与少量琥珀光
      lighting: 低调月光与远处的生物荧光点缀
      composition: 强调敬畏感的尺度、层叠纵深与若隐若现的未知形体

visual_treatment:
  medium: atmospheric digital painting with engraved astronomical textures
  texture: ancient stone, mist, star fields, deep water, and subtle iridescent surfaces
  shapes: tiny grounded figures contrasted with immense curved silhouettes and impossible geometry
  palette: midnight blue, oxidized teal, muted violet, black, and sparse amber light
  lighting: low-key moonlight with distant bioluminescent accents
  composition: awe-driven scale, layered depth, and partially obscured unknown forms

continuity:
  preserve: [celestial geometry, landmark silhouettes, costume lights, scale relationships]
  avoid: [gore, body horror, cult symbols, named mythos creatures, protected characters, jump-scare faces, embedded text, logos, watermarks]

prompt: |-
  Render an original cosmic-mystery narrative scene centered on wonder, scale,
  and the unsettling unknown. Use ancient astronomical textures, impossible but
  coherent geometry, deep mist, immense partially hidden forms, and tiny pools
  of warm light. Keep it suitable for a broad learning audience: no gore, body
  horror, cult imagery, named mythos entities, copied designs, text, or watermark.
