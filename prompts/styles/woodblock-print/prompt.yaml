schema_version: 1
id: woodblock-print
display_name: Woodblock Print
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 木刻版画
    visual_treatment:
      medium: 在纤维感米色纸张上呈现手工雕刻的凸版印刷效果
      texture: 可见刻痕、漏墨、木纹与轻微套色偏差
      shapes: 以雕刻线纹塑造平面而富有节奏的剪影
      palette: 限定使用靛蓝、铁锈红、芥末黄、森林绿与纸张米色
      lighting: 通过排线方向与未着墨的留白表现光线
      composition: 装饰性的平面纵深，兼具强烈动势与平衡

visual_treatment:
  medium: hand-carved relief-print appearance on fibrous cream paper
  texture: visible carved channels, ink skips, grain, and imperfect registration
  shapes: flattened rhythmic silhouettes defined by carved line patterns
  palette: limited indigo, rust red, mustard, forest green, and paper cream
  lighting: represented through hatch direction and unprinted negative space
  composition: decorative flattened depth with strong movement and balance

continuity:
  preserve: [silhouette motifs, limited-color assignment, clothing patterns, recurring landmarks]
  avoid: [smooth gradients, photographic depth, excessive tiny detail, embedded text, speech bubbles, seals, logos, watermarks]

prompt: |-
  Render an original accessible relief-print illustration on fibrous cream
  paper, using carved directional lines, flattened rhythmic silhouettes,
  imperfect ink texture, and a tightly limited indigo-rust-mustard-green palette.
  Preserve declared visual invariants. Include no text, letters, numbers,
  calligraphy, seals, symbols, logos, captions, speech bubbles, or watermark.
