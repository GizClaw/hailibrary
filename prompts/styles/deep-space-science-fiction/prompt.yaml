schema_version: 1
id: deep-space-science-fiction
display_name: Deep-Space Science Fiction
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 深空科幻
    visual_treatment:
      medium: 以可信工程为基础的电影感科幻概念绘画
      texture: 拉丝航天金属、多层隔热材料、玻璃、尘土、岩石与离子辉光
      shapes: 功能明确的载具、加压舱体、轨道结构与易读的宇航服
      palette: 深黑、矿物灰、信号橙、冷白与克制的电光蓝
      lighting: 强烈恒星光、行星反射色与设备工作灯
      composition: 以全景尺度呈现人物或角色在太空环境中的清晰活动

visual_treatment:
  medium: cinematic science-fiction concept painting grounded in plausible engineering
  texture: brushed spacecraft metal, layered insulation, glass, dust, rock, and ion glow
  shapes: functional vehicles, pressure habitats, orbital structures, and readable spacesuits
  palette: deep black, mineral gray, signal orange, cool white, and restrained electric blue
  lighting: hard stellar light, reflected planetary color, and practical equipment lamps
  composition: panoramic scale with clear human or character activity against space

continuity:
  preserve: [vehicle geometry, suit markings without text, planetary conditions, equipment function]
  avoid: [franchise designs, fantasy machinery without purpose, random glowing panels, embedded text, logos, watermarks]

prompt: |-
  Render an original cinematic deep-space science-fiction scene with plausible
  engineering, functional equipment, convincing materials, harsh stellar light,
  and immense planetary scale. Every device should suggest a purpose and remain
  consistent across scenes. Avoid recognizable franchise designs, meaningless
  interface clutter, text, letters, numbers, logos, and watermark.
