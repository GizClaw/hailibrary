schema_version: 1
id: wax-crayon
display_name: Wax Crayon
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 蜡笔画
    visual_treatment:
      medium: 在暖色绘图纸上层层叠画的蜡笔作品
      texture: 可见纸纹、断续蜡痕与富有活力的用笔力度
      shapes: 厚实醒目的造型，配以不完美的彩色轮廓
      palette: 明亮的三原色和间色，让暖色纸面自然透出
      lighting: 用简化色块表现光线，不使用写实渐变
      composition: 大胆的前景主体与充足留白

visual_treatment:
  medium: layered wax crayon on warm drawing paper
  texture: visible grain, broken wax edges, and energetic hand pressure
  shapes: chunky immediately readable forms with imperfect colored outlines
  palette: bright primary and secondary colors with warm paper showing through
  lighting: simplified color-based light without realistic gradients
  composition: bold foreground subjects and generous breathing room

continuity:
  preserve: [signature colors, silhouette, clothing, recurring object proportions]
  avoid: [smooth vector gradients, photorealism, muddy blending, embedded text, logos, watermarks]

prompt: |-
  Render a polished narrative illustration entirely with layered
  wax crayon marks on visible warm paper. Use chunky readable shapes, lively
  imperfect outlines, bold color blocks, and tactile broken edges. Keep the
  composition simple and preserve declared character invariants. Include no
  text, letters, numbers, symbols, logos, captions, or watermark.
