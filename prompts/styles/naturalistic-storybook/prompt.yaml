schema_version: 1
id: naturalistic-storybook
display_name: Naturalistic Storybook
thumbnail: thumbnail.webp
localizations:
  zh-CN:
    display_name: 自然写实绘本
    visual_treatment:
      medium: 建立在自然观察之上的细致数码绘画
      texture: 可信的毛发、植物、布料、云层与空气透视
      shapes: 解剖结构可信，表情清晰而克制
      palette: 自然的季节性色彩，搭配克制的电影感对比
      lighting: 符合物理规律的日光与柔和轮廓光
      composition: 沉浸式环境取景，聚焦一个准确明确的动作

visual_treatment:
  medium: detailed digital painting grounded in natural observation
  texture: believable fur, foliage, cloth, clouds, and atmospheric depth
  shapes: anatomically convincing subjects with readable, restrained expression
  palette: natural seasonal color with restrained cinematic contrast
  lighting: physically plausible daylight and gentle rim light
  composition: immersive environmental framing with a precise focal action

continuity:
  preserve: [anatomy, markings, costume construction, environment geography, time of day]
  avoid: [cartoon distortion, uncanny human features, photographic branding, embedded text, logos, watermarks]

prompt: |-
  Render a naturalistic storybook digital painting grounded in
  believable animal anatomy, materials, landscape, and daylight. Preserve warm,
  readable emotion without cartoon distortion, and maintain every declared
  marking, costume, and location invariant. Include no text, letters, numbers,
  symbols, logos, captions, or watermark.
