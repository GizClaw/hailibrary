schema_version: 1
id: t
external_reference:
  reading_a_z_label: T
  age_band: 10-11
  en_grade_reference: 5
  en_lexile_reference: 830L-1010L
reading_goal: compare perspectives and revise a model or judgment from evidence
prompt: Write at HaiLibrary Level T to compare perspectives and revise a model or judgment from evidence. Compare perspectives and revise a model through sustained, natural discourse. Keep technical explanation in the appropriate narrative register and preserve human conversational texture.
text_contract:
  structure: perspective counterexample revision
  syntax: qualification and rhetorical emphasis
  vocabulary: abstract evaluative and discipline-entry
  knowledge: incomplete information among actors
  illustration_reliance: enriching
  inference: reliability and uncertainty
complexity_floor:
  - a credible counterexample changes the conclusion
  - uncertainty remains bounded
pages:
  min: 20
  max: 28
questions:
  min: 8
  max: 11
  types:
    - short-answer
    - main-idea
    - evidence
    - compare
    - evaluate
    - synthesis
    - source-analysis
  required:
    - evaluate
    - source-analysis
languages:
  en:
    mean_sentence_units_typical:
      - 12
      - 18
    sentences_per_page_max: 10
    units_per_sentence_max: 27
    units_per_page_typical:
