schema_version: 1
id: o
external_reference:
  reading_a_z_label: O
  age_band: 8-9
  en_grade_reference: 3
  en_lexile_reference: 520L-820L
reading_goal: integrate a main arc with one causally relevant subordinate thread
prompt: Write at HaiLibrary Level O to integrate a main arc with one causally relevant subordinate thread. Interweave the main and subordinate threads in cohesive prose. Give characters partial knowledge and individual voices instead of using them as explanatory mouthpieces.
text_contract:
  structure: interacting main and secondary thread
  syntax: sustained variety with condition and contrast
  vocabulary: precise academic emotional and domain terms
  knowledge: multiple distributed constraints
  illustration_reliance: complementary
  inference: motive and outcome across chapters
complexity_floor:
  - the subordinate thread changes the outcome
  - one inference uses three scenes
pages:
  min: 16
  max: 24
questions:
  min: 6
  max: 9
  types:
    - cause-effect
    - short-answer
    - character-motive
    - main-idea
    - evidence
    - compare
    - evaluate
  required:
    - compare
    - evidence
languages:
  en:
    mean_sentence_units_typical:
      - 10
      - 15
    sentences_per_page_max: 8
    units_per_sentence_max: 22
    units_per_page_typical:
      - 30
      - 55
    units_per_page_max: 78
    units_total_min: 650
    units_total_max: 1100
    new_words_per_page_max: 5
  zh:
    mean_sentence_units_typical:
      - 16
      - 28
    sentences_per_page_max: 8
    units_per_sentence_max: 36
    units_per_page_typical:
      - 45
      - 80
    units_per_page_max: 113
    units_total_min: 900
    units_total_max: 1600
    new_words_per_page_max: 5
