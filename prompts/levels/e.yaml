schema_version: 1
id: e
external_reference:
  reading_a_z_label: E
  age_band: 6-7
  en_grade_reference: 1
  en_lexile_reference: 190L-530L
reading_goal: retell a beginning-middle-end arc and explain one character response
prompt: Write at HaiLibrary Level E to retell a beginning-middle-end arc and explain one character response. Build a natural beginning-middle-end rhythm with a character response readers can understand. Let action and emotion carry the lesson without a concluding slogan.
text_contract:
  structure: plan change resolution
  syntax: varied simple sentences and short coordination
  vocabulary: controlled description and emotion
  knowledge: one embedded explanation
  illustration_reliance: high
  inference: simple feeling or reason
complexity_floor:
  - the middle event changes the plan
  - the resolution recalls earlier information
pages:
  min: 10
  max: 14
questions:
  min: 3
  max: 4
  types:
    - explicit-choice
    - sequence
    - cause-effect
    - short-answer
  required:
    - sequence
    - cause-effect
languages:
  en:
    mean_sentence_units_typical:
      - 5
      - 9
    sentences_per_page_max: 3
    units_per_sentence_max: 11
    units_per_page_typical:
      - 8
      - 17
    units_per_page_max: 24
    units_total_min: 70
    units_total_max: 180
    new_words_per_page_max: 2
  zh:
    mean_sentence_units_typical:
      - 8
      - 15
    sentences_per_page_max: 3
    units_per_sentence_max: 18
    units_per_page_typical:
      - 12
      - 24
    units_per_page_max: 34
    units_total_min: 110
    units_total_max: 270
    new_words_per_page_max: 2
