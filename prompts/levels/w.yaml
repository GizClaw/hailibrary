reading_goal: synthesize perspectives, mechanisms, and uncertainties into a qualified conclusion
prompt: Write at HaiLibrary Level W to synthesize perspectives, mechanisms, and uncertainties into a qualified conclusion. Develop a qualified conclusion from perspectives, mechanisms, and uncertainty. Use complex but natural prose, reserving formal analytical language for contexts where a person would genuinely use it.
text_contract:
  structure: parallel evidence strands converge
  syntax: dense varied and explicitly qualified
  vocabulary: precise abstract disciplinary and register-sensitive
  knowledge: multi-factor system
  illustration_reliance: optional
  inference: second-order consequences
complexity_floor:
  - two evidence strands interact
  - the conclusion distinguishes confidence from uncertainty
