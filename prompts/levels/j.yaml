schema_version: 1
id: j
external_reference:
  reading_a_z_label: J
  age_band: 6-7
  en_grade_reference: 1
  en_lexile_reference: 190L-530L
reading_goal: support a main idea or motive with distributed evidence
prompt: Write at HaiLibrary Level J to support a main idea or motive with distributed evidence. Distribute evidence across a complete, readable arc. Dialogue must express immediate intent, uncertainty, humor, or response rather than summarize the evidence rubric.
text_contract:
  structure: complete arc with later consequence
  syntax: reason condition relative description or reported thought
  vocabulary: mixed-frequency with controlled abstraction
  knowledge: one independently readable unfamiliar context
  illustration_reliance: medium-supporting
  inference: two separated clues
complexity_floor:
  - a decision has a later consequence
  - one answer cites separated pages
pages:
  min: 12
  max: 18
questions:
  min: 4
  max: 6
  types:
    - sequence
    - cause-effect
    - short-answer
    - character-motive
    - main-idea
    - evidence
  required:
    - main-idea
    - evidence
languages:
  en:
    mean_sentence_units_typical:
      - 8
      - 12
    sentences_per_page_max: 5
    units_per_sentence_max: 16
    units_per_page_typical:
      - 15
      - 30
    units_per_page_max: 43
    units_total_min: 200
    units_total_max: 440
    new_words_per_page_max: 3
  zh:
    mean_sentence_units_typical:
      - 13
      - 22
    sentences_per_page_max: 5
    units_per_sentence_max: 28
    units_per_page_typical:
      - 24
      - 45
    units_per_page_max: 64
    units_total_min: 320
    units_total_max: 650
    new_words_per_page_max: 3
