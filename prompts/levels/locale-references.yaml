schema_version: 1
status: calibrated-draft
level_order: [aa, a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q, r, s, t, u, v, w, x, y, z, z1, z2]

purpose: age-aligned multilingual difficulty references spanning pre-primary through higher education while retaining the familiar Reading A-Z label sequence

rules:
  - AA through Z2 are HaiLibrary age-progression levels. Their labels follow the Reading A-Z sequence, but levels above the primary-school range deliberately extend beyond Reading A-Z's official grade meanings.
  - en-US uses age and school grade as the primary reference, with Lexile grade bands as a secondary quantitative reference. Z1 and Z2 are HaiLibrary higher-education extensions, not official Reading A-Z correlations.
  - zh-CN uses the same age band and comparable reading task with Chinese curriculum, textbook, character, word, syntax, and discourse evidence instead of transferring English Lexile values.
  - Locale grade and semester labels are editorial calibration checkpoints, not reader-age restrictions or official cross-framework certifications.
  - A curriculum cumulative character count cannot prove that a particular character or complete word has been taught; exact vocabulary claims still require the pinned textbook appendix or page.
  - Equivalent cross-locale difficulty means comparable independence, inference, evidence span, and response demand, not matching word counts or sentence boundaries.

en-US:
  authority: HaiLibrary age-aligned progression informed by Learning A-Z labels and MetaMetrics grade bands
  alignment_type: internal age and grade crosswalk; Reading A-Z labels are retained but Z1 and Z2 are redefined as higher-education extensions
  lexile_scope: English text only
  sources:
    - { title: Learning A-Z Level Correlation Chart, url: "https://www.readinga-z.com/correlation-tool/" }
    - { title: 2019 Learning A-Z Correlation Chart, url: "https://www.readinga-z.com/updates/raz_correlation_chart.pdf" }
    - { title: Evaluating Text Complexity, url: "https://www.readinga-z.com/learninga-z-levels/text-leveling-system/" }
    - { title: Lexile Career Ranges by Grade Level, url: "https://hub.lexile.com/lexile-quantile-measures-supporting-student-college-and-career-readiness/" }
    - { title: Lexile Map of Advanced Texts, url: "https://lexile.com/wp-content/uploads/2021/04/11x17-Lexile-Map_ADA.pdf" }

zh-CN:
  authority: HaiLibrary editorial calibration from Ministry of Education curriculum and pinned PEP textbook evidence
  alignment_type: internal crosswalk; not an official Reading A-Z or Lexile correlation
  lexile_scope: prohibited
  curriculum_checkpoints:
    pre_primary:
      label: 学前阶段
      reading_focus: 口语词汇、图像匹配、语音意识、重复句式和亲子共读
    entry:
      label: 幼小衔接与一年级上册起步
      reading_focus: 口语到书面语、看图识词、拼音辅助、重复句式和直接信息
    g1s1_2024:
      label: 2024修订版统编语文一年级上册
      recognize: 280
      write: 100
      evidence_status: verified totals only; exact characters and words require appendix or page evidence
    grade_1:
      label: 一年级完成参考
      reading_focus: 拼音辅助到初步独立阅读、直接信息、简单顺序、明确因果和短篇复述
    stage_1:
      label: 第一学段完成（1—2年级）
      recognize_cumulative_about: 1600
      write_cumulative_about: 800
      reading_focus: 联系上下文和生活经验理解词句、简单推断、提取信息、起因经过结果、复述和表达简单感受
    grade_3_pep:
      label: 2024修订体系三年级完成参考
      recognize_cumulative: 2100
      write_cumulative: 1300
      evidence_status: PEP instructional research table; exact term exposure still requires textbook evidence
    stage_2:
      label: 第二学段完成（3—4年级）
      recognize_cumulative_about: 2500
      write_cumulative_about: 1600
      reading_focus: 把握主要内容、概括、解释、比较、依据文本作出判断并表达理由
    stage_3:
      label: 第三学段完成（5—6年级）
      recognize_cumulative_about: 3000
      write_cumulative_about: 2500
      reading_focus: 体会表达效果、辨析观点与事实、跨段整合证据、评价、综合及初步来源意识
    stage_4:
      label: 第四学段（7—9年级）
      reading_focus: 阅读复杂叙事与说明论证文本，比较多来源，分析观点、论据、结构、语言效果和隐含信息
    high_school:
      label: 普通高中语文
      reading_focus: 整本书与专题研讨、跨媒介与多来源阅读、论证评价、文学审美、学术性表达和独立研究
    undergraduate:
      label: 大学本科通识与专业入门阅读
      reading_focus: 阅读教材、论文、长篇作品和多来源材料，评估方法、论证、证据质量、学科语域与不确定性
    advanced_academic:
      label: 高阶本科至研究生与专业阅读
      reading_focus: 处理高密度专业文献、竞争理论、方法限制、跨学科综合、原创论证和真实学术争议
  sources:
    - { title: 义务教育语文课程标准（2022年版）, url: "https://www.moe.gov.cn/srcsite/A26/s8001/202204/t20220420_619921.html" }
    - { title: 统编小学语文教材识字写字内容的修订思路, url: "https://www.pep.com.cn/bks/xxyw/jzjd/202505/t20250525_2000348.shtml" }
    - { title: 修订版统编小学语文一年级教材识字写字说明, url: "https://www.pep.com.cn/bks/xxyw/jzjd/202505/W020250531413572751916.pdf" }
    - { title: 二年级修订教科书语文要素, url: "https://www.pep.com.cn/bks/xxyw/jzjd/202507/W020250716532280620290.pdf" }
    - { title: 统编教材识字数量研究表, url: "https://www.pep.com.cn/bks/xxyw/jzjd/202512/W020251202575246044880.pdf" }
    - { title: 普通高中语文课程标准（2017年版2020年修订）, url: "https://jsj.moe.gov.cn/news/2/1507.shtml" }

