  age_band: 8-9
  en_grade_reference: 3
  en_lexile_reference: 520L-820L
reading_goal: reconcile competing goals and evaluate which response best fits the evidence
prompt: Write at HaiLibrary Level P to reconcile competing goals and evaluate which response best fits the evidence. Present defensible competing goals through behavior, consequence, and situated conversation. Resolve the tradeoff without a slogan or artificial consensus speech.
text_contract:
  structure: defensible goals and real tradeoff
  syntax: flexible subordination and purposeful pacing
  vocabulary: precise academic and domain language
  knowledge: several interacting constraints
  illustration_reliance: complementary
  inference: compare motives and consequences
complexity_floor:
  - two characters have defensible goals
  - the resolution addresses a real tradeoff
