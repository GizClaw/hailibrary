schema_version: 1
id: z1
external_reference:
  reading_a_z_label: Z1
  age_band: 18-22
  en_grade_reference: Undergraduate
  en_lexile_reference: 1300L-1500L
reading_goal: analyze layered systems, rhetoric, and competing evidence over a sustained work
prompt: Write at HaiLibrary Level Z1 to analyze layered systems, rhetoric, and competing evidence over a sustained work. Use natural undergraduate long-form or introductory academic prose with definitions, cohesion, and source discipline. Include dialogue only when the genre needs it, and keep it authentic to the setting.
text_contract:
  structure: long-range strands and competing frameworks
  syntax: advanced register-aware compression and qualification
  vocabulary: sophisticated academic and indispensable specialist
  knowledge: systems across domains or scales
  illustration_reliance: optional
  inference: models assumptions and second-order effects
complexity_floor:
  - frameworks yield different defensible readings
  - the work tests its central model
pages:
  min: 28
  max: 60
questions:
  min: 11
  max: 15
  types:
    - short-answer
    - evidence
    - compare
    - evaluate
    - synthesis
    - source-analysis
    - research-response
  required:
    - source-analysis
    - research-response
languages:
  en:
    mean_sentence_units_typical:
      - 17
      - 27
    sentences_per_page_max: 12
    units_per_sentence_max: 42
    units_per_page_typical:
