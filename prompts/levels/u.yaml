schema_version: 1
id: u
external_reference:
  reading_a_z_label: U
  age_band: 11-12
  en_grade_reference: 6
  en_lexile_reference: 925L-1070L
reading_goal: integrate narrative evidence with researched context or competing explanations
prompt: Write at HaiLibrary Level U to integrate narrative evidence with researched context or competing explanations. Integrate researched context with narrative evidence in fluent, audience-appropriate prose. Avoid staged Socratic dialogue and let disagreement arise from genuine goals.
text_contract:
  structure: narrative plus explanatory evidence
  syntax: flexible complex and disciplinary phrasing
  vocabulary: polysemy and nominalization
  knowledge: retained system or history
  illustration_reliance: enriching-optional
  inference: cross-mode synthesis
complexity_floor:
  - context changes interpretation
  - a conclusion names evidence and limitation
pages:
  min: 20
  max: 30
questions:
  min: 8
  max: 12
  types:
    - short-answer
    - main-idea
    - evidence
    - compare
    - evaluate
    - synthesis
    - source-analysis
    - research-response
  required:
    - synthesis
    - source-analysis
languages:
  en:
    mean_sentence_units_typical:
      - 12
      - 19
    sentences_per_page_max: 11
    units_per_sentence_max: 28
    units_per_page_typical:
      - 54
      - 96
    units_per_page_max: 137
    units_total_min: 1600
    units_total_max: 2500
    new_words_per_page_max: 7
  zh:
    mean_sentence_units_typical:
      - 20
      - 35
    sentences_per_page_max: 11
    units_per_sentence_max: 48
    units_per_page_typical:
      - 81
      - 138
    units_per_page_max: 195
    units_total_min: 2000
    units_total_max: 3200
    new_words_per_page_max: 7
