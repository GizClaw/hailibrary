schema_version: 1
id: x
external_reference:
  reading_a_z_label: X
  age_band: 14-15
  en_grade_reference: 9
  en_lexile_reference: 1050L-1260L
reading_goal: analyze how structure, source position, and evidence shape interpretation
prompt: Write at HaiLibrary Level X to analyze how structure, source position, and evidence shape interpretation. Analyze structure, source position, and evidence through sustained, controlled prose. Maintain rhetorical and character voice; do not replace complexity with jargon or abstract speeches.
text_contract:
  structure: thematic causal and evidentiary strands
  syntax: sophisticated without gratuitous opacity
  vocabulary: advanced academic and necessary specialist
  knowledge: interacting domains or scales
  illustration_reliance: optional
  inference: mechanisms positions and second-order effects
complexity_floor:
  - structure affects interpretation
  - a defensible alternative reading remains
pages:
  min: 24
  max: 40
questions:
  min: 10
  max: 13
  types:
    - short-answer
    - evidence
    - compare
    - evaluate
    - synthesis
    - source-analysis
    - research-response
  required:
    - evaluate
    - synthesis
