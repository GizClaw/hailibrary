      zh: { mean_sentence_units_typical: [14, 24], sentences_per_page_max: 6, units_per_sentence_max: 31, units_per_page_typical: [29, 55], units_per_page_max: 78, units_total_min: 470, units_total_max: 950, new_words_per_page_max: 4 }

