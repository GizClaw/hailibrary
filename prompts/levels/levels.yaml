schema_version: 2
status: calibrated-draft

level_order: [aa, a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q, r, s, t, u, v, w, x, y, z, z1, z2]

principles:
  - HaiLibrary retains the 29 Reading A-Z labels as an ordered naming sequence, but defines its own age-aligned progression from pre-primary through higher education.
  - Directory keys are lowercase aa, a through z, z1, and z2; display labels are AA, A through Z, Z1, and Z2.
  - Age and school stage are alignment anchors, while final placement is determined by sustained language and reading-task difficulty rather than genre, format, or narrative ambition.
  - Locales preserve page events, evidence, and learning goals while adapting vocabulary and syntax independently.
  - Quantitative limits are HaiLibrary editorial guardrails informed by Reading A-Z dimensions, MetaMetrics grade bands, and representative texts; they are not official Reading A-Z specifications.
  - Lexile ranges are English cross-references only. Z1 and Z2 use internal higher-education targets, not certified college Lexile bands.
  - Every level has a complexity floor and a mechanical ceiling. Length alone cannot raise a level, and sophistication cannot excuse an oversized work.

unit_definition:
  en: whitespace-delimited words
  zh: Han characters, excluding punctuation

vocabulary_standard:
  source_index: prompts/vocabulary/index.yaml
  grading_criteria: prompts/vocabulary/ranges.yaml
  rule: every locale edition and marked target must satisfy the exact directory level's locale-specific range

locale_reference_contract:
  file: prompts/levels/locale-references.yaml
  rule: use the exact age band and locale-specific school-stage reference; Reading A-Z is a retained label and early calibration source, while Lexile applies only to English and must never be transferred to Chinese

research_basis:
  learning_a_z:
    role: label sequence and early-reading calibration source; HaiLibrary deliberately extends later labels beyond official Reading A-Z grade meanings and is not certified or endorsed by Learning A-Z
    official_scale_note: official Reading A-Z correlations place Z1 and Z2 at Grade 5+; HaiLibrary redefines them as higher-education extensions
    quantitative_dimensions: [total word count, different word count, lexical diversity, high-frequency word ratio, low-frequency word ratio, sentence length, sentence complexity]
    qualitative_dimensions: [predictability, text structure, illustration and infographic support, knowledge demand, concept load, topic familiarity, themes, intertextual dependence]
    sources:
      - https://www.learninga-z.com/user_area/content_media/raw/text-leveling-learning-a-z.pdf
      - https://www.readinga-z.com/correlation-tool/
      - https://www.readinga-z.com/updates/raz_correlation_chart.pdf
  lexile:
    role: English grade-band quantitative cross-reference only; higher-education ranges are internal editorial targets
    limitations: Lexile does not measure theme, purpose, organization, background knowledge, picture reliance, motivation, or task complexity; do not generate a Lexile claim for zh-CN
    source: https://lexile.com/educators/understanding-lexile-measures/

calibration:
  range_status: provisional internal guardrails; recalibrate from a documented representative-book corpus rather than silently changing one level
  representative_anchor:
    title: "It's About Time"
    reading_a_z_level: K
    published_word_count: 401
    published_lexile: 550L
    source: https://www.raz-plus.com/books/books-by-grade-level/book/?id=708&langId=1
  decision_rule: all quantitative ceilings, qualitative dimensions, vocabulary scope, and question demands must pass

level_bands:
  emergent: [aa, a, b, c]
  elementary_early: [d, e, f, g, h, i, j]
  elementary_middle: [k, l, m, n, o, p]
  elementary_upper: [q, r, s, t, u, v]
  secondary: [w, x, y, z]
  higher_education: [z1, z2]

levels:
  aa:
    external_reference: { reading_a_z_label: aa, age_band: 4-5, en_grade_reference: Pre-K, en_lexile_reference: BR70L-10L }
    reading_goal: match one repeated spoken frame to a familiar pictured object or action
    text_contract: { structure: exact repetition with one meaningful change, syntax: labels fragments or one short clause, vocabulary: oral concrete and very-high-frequency, knowledge: immediate familiar concepts, illustration_reliance: essential, inference: none }
    complexity_floor: [the frame changes one meaningful item, the reader can point to the answer]
    pages: { min: 6, max: 10 }
    questions: { min: 1, max: 2, types: [picture, explicit-choice], required: [picture] }
    languages:
      en: { mean_sentence_units_typical: [1, 4], sentences_per_page_max: 1, units_per_sentence_max: 5, units_per_page_typical: [1, 5], units_per_page_max: 6, units_total_min: 8, units_total_max: 30, new_words_per_page_max: 1 }
      zh: { mean_sentence_units_typical: [2, 6], sentences_per_page_max: 1, units_per_sentence_max: 7, units_per_page_typical: [2, 7], units_per_page_max: 8, units_total_min: 12, units_total_max: 45, new_words_per_page_max: 1 }

  a:
    external_reference: { reading_a_z_label: A, age_band: 5-6, en_grade_reference: K, en_lexile_reference: BR70L-10L }
    reading_goal: recognize familiar words and follow one visible action through a predictable sequence
    text_contract: { structure: ordered visible actions, syntax: short simple clauses with explicit subjects, vocabulary: concrete high-frequency and readily decodable, knowledge: familiar objects actions and routines, illustration_reliance: essential, inference: none }
    complexity_floor: [visible actions form an order, the repeated frame changes meaningfully]
    pages: { min: 6, max: 12 }
    questions: { min: 2, max: 3, types: [picture, explicit-choice], required: [picture] }
    languages:
      en: { mean_sentence_units_typical: [2, 5], sentences_per_page_max: 2, units_per_sentence_max: 6, units_per_page_typical: [3, 7], units_per_page_max: 9, units_total_min: 16, units_total_max: 50, new_words_per_page_max: 1 }
      zh: { mean_sentence_units_typical: [4, 8], sentences_per_page_max: 2, units_per_sentence_max: 10, units_per_page_typical: [4, 10], units_per_page_max: 13, units_total_min: 25, units_total_max: 80, new_words_per_page_max: 1 }

  b:
    external_reference: { reading_a_z_label: B, age_band: 5-6, en_grade_reference: K, en_lexile_reference: BR40L-160L }
    reading_goal: follow a highly patterned action sequence with one stated change
    text_contract: { structure: repeated action then changed result, syntax: simple clauses and common inflections, vocabulary: high-frequency everyday words, knowledge: familiar routine plus one concrete detail, illustration_reliance: very-high, inference: one obvious result }
    complexity_floor: [one page changes the pattern, the ending answers the visible problem]
    pages: { min: 8, max: 12 }
    questions: { min: 2, max: 3, types: [picture, explicit-choice, sequence], required: [sequence] }
    languages:
      en: { mean_sentence_units_typical: [3, 6], sentences_per_page_max: 2, units_per_sentence_max: 7, units_per_page_typical: [4, 9], units_per_page_max: 12, units_total_min: 25, units_total_max: 70, new_words_per_page_max: 1 }
      zh: { mean_sentence_units_typical: [5, 9], sentences_per_page_max: 2, units_per_sentence_max: 11, units_per_page_typical: [6, 13], units_per_page_max: 17, units_total_min: 40, units_total_max: 110, new_words_per_page_max: 1 }

  c:
    external_reference: { reading_a_z_label: C, age_band: 5-6, en_grade_reference: K, en_lexile_reference: BR40L-160L }
    reading_goal: follow a simple problem and solution and order two or three events
    text_contract: { structure: problem action solution, syntax: simple sentences with basic additive or temporal links, vocabulary: high-frequency plus pictured concrete words, knowledge: familiar settings, illustration_reliance: high, inference: one direct local inference }
    complexity_floor: [the problem changes the action, the resolution follows from that action]
    pages: { min: 8, max: 12 }
    questions: { min: 2, max: 4, types: [picture, explicit-choice, sequence, cause-effect], required: [sequence] }
    languages:
      en: { mean_sentence_units_typical: [4, 7], sentences_per_page_max: 2, units_per_sentence_max: 8, units_per_page_typical: [5, 11], units_per_page_max: 15, units_total_min: 35, units_total_max: 100, new_words_per_page_max: 2 }
      zh: { mean_sentence_units_typical: [6, 11], sentences_per_page_max: 2, units_per_sentence_max: 13, units_per_page_typical: [8, 16], units_per_page_max: 21, units_total_min: 55, units_total_max: 150, new_words_per_page_max: 2 }

  d:
    external_reference: { reading_a_z_label: D, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: connect one stated cause with a visible result across adjacent pages
    text_contract: { structure: short beginning middle end, syntax: simple sentences with common time and cause connectors, vocabulary: everyday plus simple descriptive relations, knowledge: one familiar process, illustration_reliance: high, inference: one supported cause or feeling }
    complexity_floor: [two events are causally linked, prose states the essential cause]
    pages: { min: 10, max: 14 }
    questions: { min: 3, max: 4, types: [picture, explicit-choice, sequence, cause-effect], required: [cause-effect] }
    languages:
      en: { mean_sentence_units_typical: [5, 8], sentences_per_page_max: 3, units_per_sentence_max: 10, units_per_page_typical: [7, 14], units_per_page_max: 20, units_total_min: 50, units_total_max: 140, new_words_per_page_max: 2 }
      zh: { mean_sentence_units_typical: [8, 13], sentences_per_page_max: 3, units_per_sentence_max: 16, units_per_page_typical: [10, 20], units_per_page_max: 28, units_total_min: 80, units_total_max: 210, new_words_per_page_max: 2 }

  e:
    external_reference: { reading_a_z_label: E, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: retell a beginning-middle-end arc and explain one character response
    text_contract: { structure: plan change resolution, syntax: varied simple sentences and short coordination, vocabulary: controlled description and emotion, knowledge: one embedded explanation, illustration_reliance: high, inference: simple feeling or reason }
    complexity_floor: [the middle event changes the plan, the resolution recalls earlier information]
    pages: { min: 10, max: 14 }
    questions: { min: 3, max: 4, types: [explicit-choice, sequence, cause-effect, short-answer], required: [sequence, cause-effect] }
    languages:
      en: { mean_sentence_units_typical: [5, 9], sentences_per_page_max: 3, units_per_sentence_max: 11, units_per_page_typical: [8, 17], units_per_page_max: 24, units_total_min: 70, units_total_max: 180, new_words_per_page_max: 2 }
      zh: { mean_sentence_units_typical: [8, 15], sentences_per_page_max: 3, units_per_sentence_max: 18, units_per_page_typical: [12, 24], units_per_page_max: 34, units_total_min: 110, units_total_max: 270, new_words_per_page_max: 2 }

  f:
    external_reference: { reading_a_z_label: F, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: explain a two-step process or a character's goal and setback
    text_contract: { structure: goal setback changed action, syntax: coordination plus short time reason or condition clauses, vocabulary: context-supported action description and process terms, knowledge: one modest concept, illustration_reliance: medium-high, inference: one local motive or link }
    complexity_floor: [the setback requires a changed action, two steps must be retained]
    pages: { min: 10, max: 16 }
    questions: { min: 3, max: 5, types: [explicit-choice, sequence, cause-effect, short-answer, character-motive], required: [cause-effect] }
    languages:
      en: { mean_sentence_units_typical: [6, 9], sentences_per_page_max: 3, units_per_sentence_max: 12, units_per_page_typical: [9, 19], units_per_page_max: 28, units_total_min: 90, units_total_max: 220, new_words_per_page_max: 2 }
      zh: { mean_sentence_units_typical: [9, 16], sentences_per_page_max: 3, units_per_sentence_max: 20, units_per_page_typical: [14, 28], units_per_page_max: 40, units_total_min: 140, units_total_max: 330, new_words_per_page_max: 2 }

  g:
    external_reference: { reading_a_z_label: G, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: track a goal, obstacle, revised attempt, and outcome across the whole book
    text_contract: { structure: failed attempt revision outcome, syntax: simple and compound sentences with controlled subordination, vocabulary: broader everyday and transparent new terms, knowledge: one unfamiliar detail explained in text, illustration_reliance: medium-high, inference: several local inferences }
    complexity_floor: [the revision responds to failure, the ending depends on an earlier clue]
    pages: { min: 10, max: 16 }
    questions: { min: 4, max: 5, types: [explicit-choice, sequence, cause-effect, short-answer, character-motive], required: [cause-effect, short-answer] }
    languages:
      en: { mean_sentence_units_typical: [6, 10], sentences_per_page_max: 4, units_per_sentence_max: 13, units_per_page_typical: [10, 21], units_per_page_max: 31, units_total_min: 110, units_total_max: 260, new_words_per_page_max: 2 }
      zh: { mean_sentence_units_typical: [10, 17], sentences_per_page_max: 4, units_per_sentence_max: 22, units_per_page_typical: [16, 31], units_per_page_max: 44, units_total_min: 170, units_total_max: 390, new_words_per_page_max: 2 }

  h:
    external_reference: { reading_a_z_label: H, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: integrate description and dialogue to explain motive and consequence
    text_contract: { structure: two connected scenes, syntax: compound and short complex sentences, vocabulary: mixed everyday frequency with emotion and relation words, knowledge: modest social or factual context, illustration_reliance: medium, inference: motive from two nearby clues }
    complexity_floor: [dialogue changes the action, two scenes contribute to the solution]
    pages: { min: 12, max: 16 }
    questions: { min: 4, max: 6, types: [explicit-choice, sequence, cause-effect, short-answer, character-motive], required: [character-motive] }
    languages:
      en: { mean_sentence_units_typical: [7, 11], sentences_per_page_max: 4, units_per_sentence_max: 14, units_per_page_typical: [12, 24], units_per_page_max: 35, units_total_min: 140, units_total_max: 320, new_words_per_page_max: 3 }
      zh: { mean_sentence_units_typical: [11, 19], sentences_per_page_max: 4, units_per_sentence_max: 24, units_per_page_typical: [18, 35], units_per_page_max: 50, units_total_min: 220, units_total_max: 470, new_words_per_page_max: 3 }

  i:
    external_reference: { reading_a_z_label: I, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: connect a sequence of causes and identify a simple central idea
    text_contract: { structure: multi-cause short arc, syntax: varied simple compound and controlled complex sentences, vocabulary: relational and introductory academic terms, knowledge: one retained process or setting, illustration_reliance: medium, inference: evidence across two pages }
    complexity_floor: [one result has multiple causes, the central idea needs more than one page]
    pages: { min: 12, max: 16 }
    questions: { min: 4, max: 6, types: [sequence, cause-effect, short-answer, character-motive, main-idea, evidence], required: [main-idea] }
    languages:
      en: { mean_sentence_units_typical: [7, 12], sentences_per_page_max: 5, units_per_sentence_max: 15, units_per_page_typical: [14, 27], units_per_page_max: 39, units_total_min: 170, units_total_max: 380, new_words_per_page_max: 3 }
      zh: { mean_sentence_units_typical: [12, 20], sentences_per_page_max: 5, units_per_sentence_max: 26, units_per_page_typical: [21, 40], units_per_page_max: 57, units_total_min: 260, units_total_max: 550, new_words_per_page_max: 3 }

  j:
    external_reference: { reading_a_z_label: J, age_band: 6-7, en_grade_reference: 1, en_lexile_reference: 190L-530L }
    reading_goal: support a main idea or motive with distributed evidence
    text_contract: { structure: complete arc with later consequence, syntax: reason condition relative description or reported thought, vocabulary: mixed-frequency with controlled abstraction, knowledge: one independently readable unfamiliar context, illustration_reliance: medium-supporting, inference: two separated clues }
    complexity_floor: [a decision has a later consequence, one answer cites separated pages]
    pages: { min: 12, max: 18 }
    questions: { min: 4, max: 6, types: [sequence, cause-effect, short-answer, character-motive, main-idea, evidence], required: [main-idea, evidence] }
    languages:
      en: { mean_sentence_units_typical: [8, 12], sentences_per_page_max: 5, units_per_sentence_max: 16, units_per_page_typical: [15, 30], units_per_page_max: 43, units_total_min: 200, units_total_max: 440, new_words_per_page_max: 3 }
      zh: { mean_sentence_units_typical: [13, 22], sentences_per_page_max: 5, units_per_sentence_max: 28, units_per_page_typical: [24, 45], units_per_page_max: 64, units_total_min: 320, units_total_max: 650, new_words_per_page_max: 3 }

  k:
    external_reference: { reading_a_z_label: K, age_band: 7-8, en_grade_reference: 2, en_lexile_reference: 420L-650L }
    reading_goal: connect motive, evidence, and consequence across a compact multi-scene work
    text_contract: { structure: evidence changes a plan, syntax: controlled simple compound and complex variety, vocabulary: general plus supported academic or domain terms, knowledge: one concept explained and applied, illustration_reliance: supporting, inference: combine two or three clues }
    complexity_floor: [a plan changes because of evidence, the resolution depends on an earlier scene]
    pages: { min: 14, max: 20 }
    questions: { min: 5, max: 7, types: [sequence, cause-effect, short-answer, character-motive, main-idea, evidence], required: [character-motive, evidence] }
    languages:
