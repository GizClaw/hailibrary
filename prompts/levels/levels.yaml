    reading_goal: compare alternatives and follow evidence across chapters or clear sections
    text_contract: { structure: two choices with different results, syntax: varied subordination and discourse modes, vocabulary: academic plus supported domain terms, knowledge: retained and reused concept, illustration_reliance: supporting, inference: comparison from distributed evidence }
    complexity_floor: [two plausible choices have different consequences, a conclusion uses three linked steps]
    pages: { min: 16, max: 22 }
    questions: { min: 5, max: 8, types: [cause-effect, short-answer, character-motive, main-idea, evidence, compare], required: [compare] }
    languages:
      en: { mean_sentence_units_typical: [9, 14], sentences_per_page_max: 7, units_per_sentence_max: 20, units_per_page_typical: [22, 42], units_per_page_max: 60, units_total_min: 400, units_total_max: 750, new_words_per_page_max: 4 }
      zh: { mean_sentence_units_typical: [15, 25], sentences_per_page_max: 7, units_per_sentence_max: 33, units_per_page_typical: [33, 62], units_per_page_max: 88, units_total_min: 600, units_total_max: 1150, new_words_per_page_max: 4 }

  n:
    external_reference: { reading_a_z_label: N, age_band: 8-9, en_grade_reference: 3, en_lexile_reference: 520L-820L }
    reading_goal: sustain a multi-step chain and distinguish evidence from an initial guess
    text_contract: { structure: assumption evidence revision, syntax: varied complex sentences with controlled embedding, vocabulary: recurring academic and domain terms, knowledge: small interacting system, illustration_reliance: supporting-complementary, inference: revise a prediction }
    complexity_floor: [new information overturns an assumption, the resolution uses three linked facts]
    pages: { min: 16, max: 22 }
    questions: { min: 6, max: 8, types: [cause-effect, short-answer, character-motive, main-idea, evidence, compare, evaluate], required: [evidence, compare] }
    languages:
      en: { mean_sentence_units_typical: [10, 14], sentences_per_page_max: 7, units_per_sentence_max: 21, units_per_page_typical: [26, 48], units_per_page_max: 68, units_total_min: 500, units_total_max: 900, new_words_per_page_max: 4 }
      zh: { mean_sentence_units_typical: [16, 26], sentences_per_page_max: 7, units_per_sentence_max: 34, units_per_page_typical: [39, 70], units_per_page_max: 99, units_total_min: 750, units_total_max: 1350, new_words_per_page_max: 4 }

