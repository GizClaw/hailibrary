      zh: { mean_sentence_units_typical: [13, 23], sentences_per_page_max: 6, units_per_sentence_max: 30, units_per_page_typical: [25, 48], units_per_page_max: 69, units_total_min: 380, units_total_max: 800, new_words_per_page_max: 3 }
    guidance: K is early transitional, not advanced; keep the complete work compact

  l:
    external_reference: { reading_a_z_label: L, age_band: 7-8, en_grade_reference: 2, en_lexile_reference: 420L-650L }
    reading_goal: explain how evidence changes a response across a complete arc
    text_contract: { structure: complication strategy change resolution, syntax: flexible compound and complex sentences, vocabulary: mixed-frequency and transparent word families, knowledge: one concept applied twice, illustration_reliance: supporting, inference: distributed motive and cause }
