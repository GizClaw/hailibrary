    reading_goal: reconcile competing goals and evaluate which response best fits the evidence
    text_contract: { structure: defensible goals and real tradeoff, syntax: flexible subordination and purposeful pacing, vocabulary: precise academic and domain language, knowledge: several interacting constraints, illustration_reliance: complementary, inference: compare motives and consequences }
    complexity_floor: [two characters have defensible goals, the resolution addresses a real tradeoff]
    pages: { min: 18, max: 24 }
    questions: { min: 6, max: 9, types: [cause-effect, short-answer, character-motive, main-idea, evidence, compare, evaluate], required: [compare, evaluate] }
    languages:
      en: { mean_sentence_units_typical: [10, 16], sentences_per_page_max: 8, units_per_sentence_max: 23, units_per_page_typical: [34, 62], units_per_page_max: 88, units_total_min: 800, units_total_max: 1300, new_words_per_page_max: 5 }
      zh: { mean_sentence_units_typical: [17, 29], sentences_per_page_max: 8, units_per_sentence_max: 38, units_per_page_typical: [51, 90], units_per_page_max: 127, units_total_min: 1050, units_total_max: 1850, new_words_per_page_max: 5 }

  q:
    external_reference: { reading_a_z_label: Q, age_band: 9-10, en_grade_reference: 4, en_lexile_reference: 740L-940L }
    reading_goal: synthesize motives, evidence, and consequences across chapters
    text_contract: { structure: decision and long-range consequence, syntax: sustained complex syntax with clear logic, vocabulary: low-frequency general and domain terms, knowledge: interacting factors, illustration_reliance: complementary, inference: implicit motive and long-range result }
    complexity_floor: [three scenes support one conclusion, internal change affects the resolution]
    pages: { min: 18, max: 26 }
    questions: { min: 7, max: 10, types: [short-answer, character-motive, main-idea, evidence, compare, evaluate, synthesis], required: [evaluate] }
