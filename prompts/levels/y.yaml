reading_goal: reconcile competing models or values and defend a qualified synthesis
prompt: Write at HaiLibrary Level Y to reconcile competing models or values and defend a qualified synthesis. Reconcile competing models or values with counterevidence and a qualified synthesis. Keep dialogue socially and emotionally credible even when the ideas are demanding.
text_contract:
  structure: competing models with limitations
  syntax: sustained rhetoric and purposeful register shifts
  vocabulary: nuanced connotation polysemy and disciplinary terms
  knowledge: layered system history or ethics
  illustration_reliance: optional
  inference: evidence quality and model limits
complexity_floor:
  - no model explains all evidence
  - the synthesis states tradeoffs and limitations
