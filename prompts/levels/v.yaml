schema_version: 1
id: v
external_reference:
  reading_a_z_label: V
  age_band: 11-12
  en_grade_reference: 6
  en_lexile_reference: 925L-1070L
reading_goal: evaluate source position, causal explanation, and limitations
prompt: Write at HaiLibrary Level V to evaluate source position, causal explanation, and limitations. Evaluate position, causality, and limitations with purposeful register and coherent paragraphs. Spoken language must remain character-specific rather than becoming miniature essays.
text_contract:
  structure: claim example counterexample
  syntax: purposeful register shifts and rhetoric
  vocabulary: disciplinary and source-aware
  knowledge: interacting historical social or technical context
  illustration_reliance: optional-enriching
  inference: source reliability and causality
complexity_floor:
  - a viewpoint has a meaningful limitation
  - a counterexample changes the synthesis
pages:
  min: 20
  max: 30
questions:
  min: 9
  max: 12
  types:
    - short-answer
    - main-idea
    - evidence
    - compare
    - evaluate
    - synthesis
    - source-analysis
    - research-response
  required:
    - source-analysis
languages:
  en:
    mean_sentence_units_typical:
      - 13
      - 19
    sentences_per_page_max: 11
    units_per_sentence_max: 29
    units_per_page_typical:
      - 58
      - 103
    units_per_page_max: 147
    units_total_min: 1800
    units_total_max: 2800
    new_words_per_page_max: 7
  zh:
    mean_sentence_units_typical:
      - 21
      - 36
    sentences_per_page_max: 11
    units_per_sentence_max: 50
    units_per_page_typical:
      - 87
      - 148
    units_per_page_max: 209
    units_total_min: 2200
    units_total_max: 3500
    new_words_per_page_max: 7
