bio: 露西·莫德·蒙哥马利是加拿大作家。她以主要以爱德华王子岛为背景的《绿山墙的安妮》系列闻名。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Lucy Maud Montgomery in her mid-thirties, at the height of her early career. Show the author in a 1910s high-necked ivory blouse and soft blue jacket, with wavy dark hair swept into a full Gibson-style updo and bright oval features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small slate-gray notebook beside a sprig of red maple leaves. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
