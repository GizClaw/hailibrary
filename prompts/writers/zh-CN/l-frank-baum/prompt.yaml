bio: 莱曼·弗兰克·鲍姆是美国作家和剧作家。他以创造奥兹国并写作《绿野仙踪》闻名。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of L. Frank Baum in his late forties, at the height of his career. Show the author in an early-1900s dark three-piece suit, white shirt, and bow tie, with a receding hairline, brushed-back hair, and a full pale moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a single small silver shoe beside an emerald-green glass marble. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
