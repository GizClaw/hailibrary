bio: "荷马是传统上被视为《伊利亚特》和《奥德赛》作者的古希腊诗人。这两部史诗植根于口头讲述传统；他的具体生平及生卒年份尚无法确定。"
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of
  Homer as an imagined elderly ancient Greek epic singer, without claiming a
  documented historical likeness. Show a thoughtful weathered face, gently
  resting eyelids, silver wavy hair and a full soft silver beard. He wears a
  plain cream chiton with a muted blue-grey wool cloak, and the curved upper
  arm of a small wooden lyre is visible beside one shoulder. Frame the head
  and shoulders at a slight three-quarter angle, with a calm welcoming
  expression. Use soft brush texture, a warm peach and cream background and
  quiet abstract teal and coral shapes, matching HaiLibrary's classic-author
  portrait family. Make a square composition with the face centered in the
  upper half. Create an original illustration, without copying a sculpture,
  painting, photograph, or modern character design. No text, letters, numbers,
  signatures, logos, inscriptions, captions, or watermarks.
