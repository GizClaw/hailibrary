bio: 马克·吐温是美国作家、幽默大师塞缪尔·兰亨·克莱门斯的笔名。他以《汤姆·索亚历险记》和《哈克贝利·费恩历险记》等小说闻名。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Mark Twain in his late sixties, at the height of his international fame. Show the author in a turn-of-the-century cream suit, white shirt, and dark bow tie, with a great sweep of unruly white hair, bushy eyebrows, and a full white moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small model Mississippi steamboat with blank paddlewheel panels. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
