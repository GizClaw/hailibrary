bio: 雅各布·格林和威廉·格林是德国学者、语言学家和民间故事搜集者。他们共同以《儿童与家庭童话集》，即通常所称的《格林童话》，闻名于世。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Jacob and Wilhelm Grimm in their mid-forties, at the height of their shared collecting and scholarly career. Show the two brothers side by side in 1830s dark coats, waistcoats, white shirts, and cravats, with center-parted wavy hair, Jacob clean-shaven with a longer face and Wilhelm with softer features and light side-whiskers, consistent with well-known historical portraits. Pose them head-and-shoulders, facing the viewer at slight three-quarter angles with gentle friendly expressions, with a small open book with blank pages and an oak leaf, shared between them. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with both faces centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
