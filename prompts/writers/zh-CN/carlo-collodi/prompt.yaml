avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Carlo Collodi in his mid-fifties, at the height of his literary career. Show the author in an 1880s dark Italian frock coat, white shirt, and black bow tie, with a receding hairline, brushed-back gray hair, strong brows, and a full gray moustache and beard, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, holding a quill pen, with a small plain block of pale wood and a woodcarver's chisel resting beside him. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
