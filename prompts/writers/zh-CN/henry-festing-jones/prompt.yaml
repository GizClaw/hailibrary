avatar_prompt: |-
  Create an original warm hand-painted gouache and watercolor editorial
  portrait of the historical writer and editor Henry Festing Jones as an
  elderly early-twentieth-century man with neatly brushed silver hair, a
  short grey beard and moustache, and a composed friendly expression. This
  is a stylized illustration, not a documentary reproduction of a specific
  portrait. Dress him in a muted dark teal wool jacket, dark waistcoat, white
  collar and simple dark tie. Place a small stack of completely blank folded
  proof sheets beside him to suggest editing. Frame the head and shoulders
  at a slight three-quarter angle. Use soft brush texture, a warm peach and
  cream background and quiet abstract teal and coral shapes, matching
  HaiLibrary's classic-author portrait family. Make a square composition
  with the face centered in the upper half. Do not reproduce an existing
  painting or photograph. No text, letters, numbers, signatures, logos,
  handwriting, captions, or watermarks.
