avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Louisa May Alcott in her late thirties, at the height of her literary career. Show the author in a late-1860s dark green dress with a white collar and simple cameo brooch, her thick dark hair center-parted and gathered into a low braided bun, with strong brows and thoughtful oval features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small ink bottle beside four differently colored ribbons tied together. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
