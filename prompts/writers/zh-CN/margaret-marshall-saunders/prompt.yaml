bio: 玛格丽特·马歇尔·桑德斯是加拿大作家和动物福利倡导者。她以小说《美丽的乔》闻名，这部作品由一只狗自述，并受到一只真实动物经历的启发。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Margaret Marshall Saunders in her mid-thirties, at the height of her early literary career. Show the author in a late-Victorian high-necked cream dress with modest lace trim, with dark center-parted hair swept into a neat bun, composed eyes, and refined features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small brown dog wearing a plain collar beside her. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
