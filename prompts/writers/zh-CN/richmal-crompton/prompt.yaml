bio: 里奇玛尔·克朗普顿是英国作家和教师。她以长期出版的儿童故事系列《淘气包威廉》闻名。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Richmal Crompton in her late thirties, at the height of her early writing career. Show the author in a 1920s high-necked cream blouse and dark tailored jacket, with short softly waved hair parted to one side and clear composed features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small well-used slingshot tied with a neat red necktie. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
