avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Clement Clarke Moore in his mid-forties, at the height of his writing and scholarly career. Show the author in an 1820s black coat, high white collar, and dark cravat, with brushed-forward brown hair, a broad forehead, and clean-shaven reserved features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with one small silver sleigh bell tied with a red ribbon. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
