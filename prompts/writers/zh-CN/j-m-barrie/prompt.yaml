avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of J. M. Barrie in his mid-forties, at the height of his theatrical career. Show the author in an Edwardian dark suit, waistcoat, high white collar, and narrow tie, with neatly side-parted dark hair, a high forehead, and a thick dark moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small silver thimble beside a single green leaf. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
