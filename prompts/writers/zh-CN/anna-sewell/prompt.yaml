bio: 安娜·休厄尔是英国小说家。她以唯一出版的小说《黑骏马》闻名，这部作品对人们如何对待马匹产生了深远影响。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Anna Sewell in her mid-fifties, when her celebrated novel was completed. Show the author in a modest 1870s dark dress with a white lace collar and small brooch, her dark hair center-parted and smoothly gathered beneath a simple lace cap, with calm oval features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small polished horseshoe and a sprig of hay to evoke her compassionate horse story. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
