bio: 安徒生是丹麦作家和诗人。他以《海的女儿》《丑小鸭》和《冰雪女王》等文学童话享誉世界。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Hans Christian Andersen in his late forties, at the height of his international career. Show the author in an 1850s dark frock coat, waistcoat, high white collar, and black cravat, with lank side-parted brown hair, a long narrow face, prominent nose, and clean-shaven features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a delicate white paper-cut swan. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
