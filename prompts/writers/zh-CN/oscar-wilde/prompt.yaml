bio: 奥斯卡·王尔德是爱尔兰诗人、剧作家和作家。他以戏剧、小说《道林·格雷的画像》以及《快乐王子》等文学童话闻名。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Oscar Wilde in his mid-thirties, at the height of his literary career. Show the author in an 1890s dark velvet jacket, patterned waistcoat, white shirt, and broad silk cravat, with long wavy brown hair swept back, a broad face, and clean-shaven features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a single golden swallow ornament beside a small red rose. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
