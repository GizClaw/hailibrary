bio: 刘易斯·卡罗尔是英国作家、数学家和摄影家查尔斯·路特维奇·道奇森的笔名。他以《爱丽丝漫游奇境》和《镜中奇遇》闻名。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Lewis Carroll in his early forties, at the height of his literary career. Show the author in an 1870s black clerical-style coat, waistcoat, high white collar, and dark cravat, with neatly side-parted dark hair, a high forehead, and clean-shaven angular features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small brass pocket watch resting beside a patterned teacup. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
