bio: 亨利·沃兹沃思·朗费罗是美国诗人和教育家。他是十九世纪读者最广泛的美国诗人之一，叙事诗作品包括《伊凡吉林》。
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Henry Wadsworth Longfellow in his late fifties, at the height of his poetic career. Show the author in an 1860s black coat, waistcoat, white shirt, and dark cravat, with swept-back silver hair and a full flowing white beard without a moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small brass ship’s lantern with a sprig of evergreen beside it. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
