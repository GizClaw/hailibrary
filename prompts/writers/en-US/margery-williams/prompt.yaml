bio: Margery Williams was a British-American author of children's books. She is best known for The Velveteen Rabbit, a story about a toy becoming real through love.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Margery Williams in her early forties, at the height of her children’s-book career. Show the author in a 1920s cream blouse and soft brown cardigan, with gently waved bobbed hair tucked behind the ears and calm kind features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small worn velveteen rabbit with plain clothing and no branding. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
