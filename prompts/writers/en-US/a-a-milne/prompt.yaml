bio: A. A. Milne was an English author, playwright, and poet. He is best known for the Winnie-the-Pooh stories and poetry for children.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of A. A. Milne in his early forties, at the height of his career. Show the author in a 1920s brown tweed jacket, waistcoat, white shirt, and tie, with neatly side-parted dark hair, a high forehead, and a small tidy moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small honey pot and a single golden leaf as quiet symbols of his best-known woodland stories. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
