bio: Frances Hodgson Burnett was a British-American novelist and playwright. She is best known for children's novels including Little Lord Fauntleroy, A Little Princess, and The Secret Garden.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Frances Hodgson Burnett in her early sixties, at the height of her later career. Show the author in an Edwardian dark velvet dress with a lace-trimmed neckline and a small floral brooch, with softly waved gray hair gathered high and a broad kindly face, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with an old-fashioned garden key entwined with one fresh rose. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
