bio: Robert Louis Stevenson was a Scottish novelist, essayist, poet, and travel writer. He is known for works including Treasure Island, Strange Case of Dr Jekyll and Mr Hyde, and A Child's Garden of Verses.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Robert Louis Stevenson in his mid-thirties, at the height of his literary career. Show the author in an 1880s dark velvet jacket, soft white shirt, and loose black tie, with long swept-back brown hair, a narrow face, and a light moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small rolled treasure map tied with cord beside a brass compass. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
