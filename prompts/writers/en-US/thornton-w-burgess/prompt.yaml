bio: Thornton W. Burgess was an American naturalist, conservationist, and author of children's stories. He is best known for the Old Mother West Wind and Adventures books, whose animal characters introduced young readers to the natural world.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Thornton W. Burgess in his mid-forties, at the height of his children's writing career. Show the author in an early-twentieth-century brown tweed jacket, white shirt, and dark tie, with short receding hair, round spectacles, kind eyes, and a neat moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small wild rabbit resting beside a sprig of meadow grass. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
