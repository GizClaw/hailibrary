bio: Andrew Lang was a Scottish poet, novelist, literary critic, and scholar. He is especially known for editing the twelve colored Fairy Books and for work in folklore and mythology.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Andrew Lang in his late forties, at the height of his career. Show the author in a late-Victorian dark frock coat, high white collar, and subdued tie, with short side-parted hair, thoughtful eyes, and a full neatly trimmed moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small fan of jewel-colored fairy-tale books with blank covers. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
