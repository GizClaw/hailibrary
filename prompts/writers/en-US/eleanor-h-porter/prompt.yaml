bio: Eleanor H. Porter was an American novelist and children's author. She is best known for Pollyanna and its optimistic title character.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Eleanor H. Porter in her mid-forties, at the height of her career. Show the author in a 1910s high-necked cream blouse and soft mauve jacket, with dark hair center-parted and pinned into a full low updo, and bright composed features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small crystal prism that casts a subtle rainbow glow. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
