author:
  name: Aesop
  born: "c. 620 BC"
  died: "c. 560 BC"
  countries: [GR]
bio: Aesop was an ancient Greek storyteller traditionally associated with a large body of fables. The details of his life are uncertain, and the tales attributed to him were transmitted and collected over centuries.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Aesop as a stylized ancient Greek storyteller of about fifty, without claiming a real historical likeness. Show the storyteller in a simple cream chiton and muted rust cloak, with weathered kind features, dark wavy hair, and a short curly beard suited to an imagined figure of antiquity. Pose him head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, beside a tiny carved tortoise and hare motif that evokes the fables. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
