bio: Beatrix Potter was an English author, illustrator, natural scientist, and conservationist. She is best known for illustrated children's tales including The Tale of Peter Rabbit.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Beatrix Potter in her late thirties, at the height of her early publishing career. Show the author in an Edwardian high-necked cream blouse and practical brown jacket, with softly waved brown hair swept into a low bun and composed rounded features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small storybook rabbit in a blue jacket sitting beside her as the single symbolic companion. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
