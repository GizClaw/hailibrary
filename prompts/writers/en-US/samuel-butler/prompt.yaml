bio: "Samuel Butler was a British writer, artist and translator. His prose translation of the Odyssey first appeared in 1900; its preface and notes present his own interpretations of the epic."
avatar_prompt: |-
  Create an original warm hand-painted gouache and watercolor editorial
  portrait of the historical writer Samuel Butler, born in 1835, shown as an
  older Victorian man with a high forehead, swept-back greying hair, a full
  grey beard and an attentive thoughtful expression. This is a stylized
  illustration, not a documentary reproduction of a particular portrait.
  Dress him in a dark brown wool jacket, charcoal waistcoat and plain cream
  shirt, with a closed unlettered book beside him. Frame the head and
  shoulders at a slight three-quarter angle. Use soft brush texture, a warm
  peach and cream background and quiet abstract teal and coral shapes,
  matching HaiLibrary's classic-author portrait family. Make a square
  composition with the face centered in the upper half. Do not reproduce an
  existing painting or photograph. No text, letters, numbers, signatures,
  logos, book titles, captions, or watermarks.
