bio: George MacDonald was a Scottish author, poet, and minister. He was an influential writer of fantasy and fairy tales, including The Princess and the Goblin.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of George MacDonald in his late fifties, at the height of his literary career. Show the author in a late-Victorian dark coat, waistcoat, white collar, and narrow tie, with swept-back gray hair and a long flowing gray beard, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small silver lantern shaped like a castle tower. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
