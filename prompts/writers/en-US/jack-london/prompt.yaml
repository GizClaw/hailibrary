bio: Jack London was an American novelist, journalist, and short-story writer. He is best known for adventure novels including The Call of the Wild and White Fang, both set in the North during the Klondike era.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Jack London in his early thirties, at the height of his literary career. Show the author in an early-twentieth-century dark wool jacket, white shirt, and loosely knotted tie, with swept-back hair, alert eyes, and a compact moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle confident expression, with a small husky dog and a pine sprig dusted with snow. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
