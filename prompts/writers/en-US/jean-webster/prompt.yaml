bio: Jean Webster was an American author. She is best known for the epistolary novel Daddy-Long-Legs and its sequel Dear Enemy.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Jean Webster in her mid-thirties, at the height of her career. Show the author in a 1910s high-necked white blouse and tailored navy jacket, with wavy dark hair swept into a loose updo and an open intelligent face, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a long cream envelope sealed with a tiny spider-shaped wax mark but no writing. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
