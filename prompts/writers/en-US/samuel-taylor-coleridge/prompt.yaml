bio: Samuel Taylor Coleridge was an English poet, critic, and philosopher. A major figure of English Romanticism, he wrote The Rime of the Ancient Mariner and Kubla Khan.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Samuel Taylor Coleridge in his mid-thirties, at the height of his poetic career. Show the author in an early-1800s dark coat, cream waistcoat, high white collar, and loosely tied cravat, with thick wavy brown hair falling over a broad forehead and a clean-shaven round face, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small model sailing ship with a white seabird feather beside it. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
