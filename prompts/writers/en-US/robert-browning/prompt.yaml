bio: Robert Browning was an English poet and playwright. He became one of the leading Victorian poets and is particularly known for dramatic monologues.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Robert Browning in his early sixties, at the height of his later career. Show the author in an 1870s dark frock coat, waistcoat, white shirt, and black bow tie, with thick wavy gray hair, strong brows, prominent side-whiskers, and a trimmed moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small bronze bell beside a folded theatrical mask. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
