bio: William Cowper was an English poet and hymnwriter. One of the most popular poets of his time, he wrote works ranging from conversational verse to the comic ballad John Gilpin.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of William Cowper in his early fifties, at the height of his poetic career. Show the author in a 1780s dark coat, cream waistcoat, white shirt, and folded cravat, with a powdered gray wig rolled softly at the sides and a long clean-shaven face, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, beside a small wooden hobby horse and a sprig of lavender. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
