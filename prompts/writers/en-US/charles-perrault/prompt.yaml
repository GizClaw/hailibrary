bio: Charles Perrault was a French author and member of the Académie Française. He is known for a landmark collection of literary fairy tales, including Cinderella and Sleeping Beauty.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Charles Perrault in his late sixties, at the height of his fairy-tale publishing career. Show the author in an elegant late-seventeenth-century black coat with a white lace cravat and long curled gray wig, with an oval face and composed clean-shaven features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a single tiny glass slipper on a velvet cushion. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
