bio: Yei Theodora Ozaki was a British-born Japanese writer and translator. She is best known for presenting Japanese folktales in English in The Japanese Fairy Book.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Yei Theodora Ozaki in her early thirties, at the height of her fairy-tale writing career. Show the author in an elegant early-Edwardian high-necked cream blouse and dark jacket, with dark hair swept up neatly, calm eyes, and refined features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small folded paper crane beside a closed book with a blank cover. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
