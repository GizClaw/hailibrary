bio: Kate Greenaway was an English illustrator and writer. Her delicately illustrated children's books, including Under the Window and Marigold Garden, were highly influential.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Kate Greenaway in her early forties, at the height of her illustration career. Show the author in an 1880s high-necked sage dress with softly puffed sleeves and a white lace collar, her brown hair center-parted and coiled into a neat low bun, with delicate oval features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a tiny posy of daisies tied with a pale ribbon. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
