bio: Rudyard Kipling was an English author and poet born in British India. He is known for The Jungle Book, Just So Stories, and a wide range of poems and short stories.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Rudyard Kipling in his late forties, at the height of his literary career. Show the author in an early-1900s dark suit, waistcoat, white shirt, and tie, with a receding hairline, round wire spectacles, and a thick dark moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small carved elephant and one broad jungle leaf. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
