author:
  name: Peter Christen Asbjørnsen and Jørgen Moe
  born: "1812 and 1813"
  died: "1885 and 1882"
  countries: [NO]
bio: Peter Christen Asbjørnsen and Jørgen Moe were Norwegian folklorists who collected and published traditional Norwegian tales. Their jointly credited Norwegian Folktales became widely known in English through George Webbe Dasent's translation.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Peter Christen Asbjørnsen and Jørgen Moe in their early forties, at the height of their shared folklore career. Show the two men side by side in 1850s dark coats, waistcoats, white shirts, and cravats, with Asbjørnsen wearing round spectacles and a full beard and Moe with swept-back hair and a neatly trimmed beard, consistent with well-known historical portraits. Pose them head-and-shoulders, facing the viewer at slight three-quarter angles with gentle friendly expressions, with a small open book with blank pages and a tiny pine sprig shared between them. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with both faces centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
