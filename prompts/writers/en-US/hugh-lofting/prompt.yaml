bio: Hugh Lofting was an English-American author trained as a civil engineer. He created the Doctor Dolittle series, first developing the character in illustrated letters written during the First World War.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Hugh Lofting in his late thirties, at the height of his early children’s-book career. Show the author in a 1920s brown tweed jacket, waistcoat, pale shirt, and tie, with short neatly side-parted hair, a broad forehead, and a small trimmed moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small green parrot perched beside a plain doctor’s satchel. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
