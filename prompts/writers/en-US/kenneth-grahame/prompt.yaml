avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Kenneth Grahame in his late forties, at the height of his literary career. Show the author in an Edwardian brown tweed suit, waistcoat, white collar, and muted tie, with thinning side-parted hair and a full neatly groomed moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small wooden riverboat with one willow leaf beside it. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
