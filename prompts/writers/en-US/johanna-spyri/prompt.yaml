bio: Johanna Spyri was a Swiss author of children's stories. She is best known for Heidi, a novel set in the Swiss Alps.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Johanna Spyri in her mid-fifties, at the height of her career. Show the author in an 1880s dark Swiss dress with a high white lace collar and small brooch, her dark hair center-parted and gathered beneath a modest lace cap, with serene rounded features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small carved wooden goat and one alpine flower. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
