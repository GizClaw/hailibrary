bio: Edith Nesbit was an English author and poet who published as E. Nesbit. She is known for children's novels that combine everyday family life with fantasy and adventure.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of E. Nesbit in her late forties, at the height of her children’s-fiction career. Show the author in an early-1900s high-necked ivory blouse with a soft green scarf, her abundant dark hair swept loosely into an upswept bun, with strong brows and lively rounded features, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small brass amulet shaped like a curled sand creature. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
