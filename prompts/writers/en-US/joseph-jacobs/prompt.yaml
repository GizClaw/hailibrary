  countries: [AU, GB]
bio: Joseph Jacobs was an Australian-born folklorist, literary critic, and historian who spent much of his career in Britain. He is best known for compiling and retelling English, Celtic, and Indian fairy tales.
avatar_prompt: |-
  Create a warm hand-painted gouache and watercolor storybook portrait of Joseph Jacobs in his mid-forties, at the height of his folklore career. Show the author in a late-Victorian dark suit, high white collar, and dark tie, with short neatly combed hair, thoughtful eyes, and a full moustache, consistent with well-known historical portraits. Pose the author head-and-shoulders, facing the viewer at a slight three-quarter angle with a gentle friendly expression, with a small open fairy-tale book with blank pages and a single bean vine curling beside it. Use soft brush texture, a warm peach and cream background with soft abstract teal and coral rounded shapes, and a square composition with the face centered in the upper half. No text, letters, numbers, signatures, logos, or watermarks.
