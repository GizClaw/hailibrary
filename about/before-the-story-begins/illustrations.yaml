schema_version: 1
purpose: Dedicated wordless illustrations created for the Chinese and English essays in this directory.
workflow: Codex built-in image generation
shared_by_locales: [zh-CN, en-US]

visual_direction:
  medium: refined hand-painted editorial illustration combining watercolor, gouache, subtle cut-paper layers, and natural paper grain
  mood: warm, humane, culturally open, contemplative, and hopeful
  palette: deep indigo, warm amber, moss green, muted coral, and cream paper
  continuity:
    preserve: [handmade texture, restrained luminosity, generous visual breathing room, human responsibility]
    avoid: [text, letters, numbers, logos, captions, speech bubbles, watermarks, humanoid robots, corporate AI imagery, cultural caricatures, imitation of a named artist]

assets:
  - id: story-garden
    file: artwork/story-garden.webp
    role: hero
    scene: People of different ages gather around a gentle fire while wordless stories rise like seeds and become a garden of books, leaves, paths, and stars.
    meaning: Human storytelling is the beginning of communication and shared learning.
    prompt: |-
      A wide, poetic editorial illustration of people of different ages gathered
      around gentle firelight at twilight. Wordless story-shapes rise like seeds
      and become a garden of books, leaves, paths, and distant stars. Suggest
      communication across cultures without flags or stereotypes.

  - id: writers-compass
    file: artwork/writers-compass.webp
    role: writers-section
    scene: A brass compass on a blank notebook branches toward a rain-washed street, an animal observing a town, a family journey, and a naturalist studying stars and leaves.
    meaning: Writers are original creative viewpoints and ethical directions, not copies of real authors.
    prompt: |-
      A wide, poetic editorial illustration with a handmade brass compass on an
      open blank notebook. Branching paths lead toward a rain-washed street, an
      animal observing a town, a family journey, and a naturalist studying stars
      and leaves, all held in one coherent imaginative world.

  - id: styles-landscape
    file: artwork/styles-landscape.webp
    role: styles-section
    scene: One traveler crosses a continuous landscape that changes through watercolor, crayon, torn paper, clay, and woodblock-like materials.
    meaning: Visual materials and atmosphere change how the same world is perceived.
    prompt: |-
      A wide panoramic landscape in which one small traveler crosses a coherent
      world that transforms from watercolor clouds to wax-crayon meadow marks,
      layered torn-paper trees, a tactile clay bridge, and woodblock-like waves.

  - id: ai-gardener
    file: artwork/ai-gardener.webp
    role: closing
    scene: Human gardeners and learners care for plants and open books connected by subtle light under a sky of distinct stars.
    meaning: AI may help connect and cultivate, while human judgment and care remain central.
    prompt: |-
      A wide, hopeful night garden cared for by human gardeners and learners.
      Plants and wordless open books grow from shared roots, joined by subtle
      threads of light beneath distinct stars. Represent AI only as quiet light
      and connection, never as a robot; keep human responsibility central.
