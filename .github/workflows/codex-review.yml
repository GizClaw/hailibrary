name: Codex review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open internal pull request to review.
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association
        )
        && (
          github.event.comment.body == '@codex'
          || github.event.comment.body == '@codex review'
          || startsWith(github.event.comment.body, '@codex review ')
        )
      )
    uses: GizClaw/github-workflows/.github/workflows/codex-openai-review.yml@cff6ec446b57dff4cd682dd8539bc6de79f516c4
    with:
      model: gpt-5.6-terra
      effort: medium
      max-diff-bytes: 5000000
      review-instructions: >-
        Follow the trusted-base AGENTS.md and use each applicable creation skill's
        author self-reflection checklist as the review standard. Treat YAML under
        works/ as production content. For changed series, review article.yaml,
        research.yaml when present, each locale's independently written article.md,
        and its story-faithful, listening-first audio_script.yaml for literary and
        read-aloud quality, complete scene/event/fact/causal coverage, safety,
        continuity, no invented story content, and correct speakers. For derived
        aa-n picture books, review every volume as a
        complete beginning-development-turn-resolution arc, faithful exact-level
        adaptation, aligned locale page events, page IDs, illustration IDs and
        chapter coverage, answerable non-duplicated questions with correct page
        evidence and question type, resolved vocabulary, and artwork scene/prompt
        agreement with page text and every visible fixed character's visual_identity.
        Review changed Writers, Styles, and vocabulary by their own self-reflection
        criteria. Require imagegen-generated cover/page/card/avatar/thumbnail files,
        matching imagegen-state.yaml, and Git LFS coverage. Binary diffs do not
        provide pixel evidence: review prompt contracts and file presence, and do
        not claim that pixels were visually inspected.
      issue-review-instructions: >-
        Review linked Issues against the repository content model in AGENTS.md.
        Require the source series path and every volume path, exact level, category
        and subcategory, Chinese and English Writer IDs, Style ID, learning goals,
        per-volume page and illustration counts, and measurable acceptance criteria
        for check-work, generated images and imagegen-state, Git LFS, and question
        evidence.
      pr-readiness-instructions: >-
        Require valid PR metadata and native closing-Issue linkage, complete
        implementation of the linked series article, audiobook script, picture-book,
        image generation, or platform scope, all required YAML, imagegen-state files,
        and Git LFS pointers, successful deterministic checks, and no actionable
        literary, factual, safety, schema, adaptation, localization, artwork-contract,
        question-evidence, vocabulary, Writer, Style, correctness, or security findings.
      pull_request_number: ${{ inputs.pull_request_number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
