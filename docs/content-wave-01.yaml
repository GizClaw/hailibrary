# Content wave 01 — 50 new bilingual works (en-US + zh-CN).
# Planning manifest only. Every work is still created and reviewed under AGENTS.md.
# Writers default to prompts/writers/index.yaml for the directory level.
# Premises are research directions, not verified facts; research.yaml must verify every checkable claim.
schema_version: 1
wave: 1

series:
  lantern-street:
    names: {en-US: Lantern Street, zh-CN: 灯笼街}
    style: watercolor-gouache
    setting: An old pedestrian lane in a Chinese city, strings of red paper lanterns overhead, small family shops, a shared courtyard with a camphor tree.
    characters:
      - id: mei
        names: {en-US: Mei, zh-CN: 梅梅}
        visual_identity: Chinese girl about 7-9, chin-length black bob with one yellow hair clip, red-and-white striped T-shirt, denim overalls, white sneakers
        voice_identity: quick, curious, a little impatient
      - id: grandpa-lu
        names: {en-US: Grandpa Lu, zh-CN: 卢爷爷}
        visual_identity: Chinese man about 70, short gray crew cut, round wire glasses, navy canvas apron with many pockets, green metal toolbox
        voice_identity: slow, warm, dry humor
      - id: amara
        names: {en-US: Amara, zh-CN: 阿玛拉}
        visual_identity: Nigerian girl about 7-9, many small braids with orange beads, green hoodie, yellow backpack
        voice_identity: bright, direct, fond of questions
      - id: bean
        names: {en-US: Bean, zh-CN: 豆豆}
        visual_identity: small tan mixed-breed dog with one white ear and a red collar
        voice_identity: none (barks are described by the narrator, never scripted as speech)
    order: [lantern-street-new-neighbor, the-repair-stall-on-lantern-street, the-missing-mooncake-mold]

  field-notebook:
    names: {en-US: Field Notebook, zh-CN: 野外笔记}
    style: naturalistic-storybook
    setting: A small river town in eastern China at the edge of rice fields, a levee path, an old weather-observation garden behind Grandma Ruan's house.
    characters:
      - id: lili
        names: {en-US: Lili, zh-CN: 林莉莉}
        visual_identity: Chinese girl about 9-11, long black ponytail, olive field vest with pockets, orange-covered notebook, pencil behind one ear
        voice_identity: careful, precise, secretly excited
      - id: yan
        names: {en-US: Yan, zh-CN: 阿岩}
        visual_identity: Chinese boy about 7-9, short spiky hair, blue raincoat, magnifying glass on a cord
        voice_identity: loud, fast, full of guesses
      - id: grandma-ruan
        names: {en-US: Grandma Ruan, zh-CN: 阮奶奶}
        visual_identity: Chinese woman about 68, short silver hair, wide straw hat, gray cardigan, binoculars
        voice_identity: calm, asks questions instead of giving answers
    order: [when-the-swallows-return, the-cloud-diary, how-bees-choose-a-home]

  moonwell-goodnight:
    names: {en-US: Moonwell Goodnight, zh-CN: 月井晚安}
    style: watercolor-gouache
    setting: A mossy stone well beside an old pear tree at night; the moon is reflected in the well water; soft dark-blue and warm-lamp palette.
    characters:
      - id: pip
        names: {en-US: Pip, zh-CN: 小咕}
        visual_identity: small round brown little owl with cream belly, big amber eyes, one tuft of fluffy feathers on the head
        voice_identity: soft, sleepy, gentle
    order: [moonwell-goodnight-stars, moonwell-goodnight-rain, moonwell-goodnight-wind]

works:
  # ---- emergent and early elementary (aa-f) ----
  - {path: works/aa/fiction/verse/moonwell-goodnight-stars, titles: {en-US: "Moonwell Goodnight: Stars", zh-CN: 月井晚安·星星}, series: moonwell-goodnight, pages: 8, research: false,
     premise: "Bedtime verse. Pip the owl counts stars one by one in the well water until sleepy. Each locale writes its own original rhyme and refrain; calm mood; must be fully understandable by ear."}
  - {path: works/aa/fiction/verse/moonwell-goodnight-rain, titles: {en-US: "Moonwell Goodnight: Rain", zh-CN: 月井晚安·雨}, series: moonwell-goodnight, pages: 8, research: false,
     premise: "Bedtime verse. Rain taps the well, the leaves, and Pip's tree hollow; Pip listens and falls asleep. Onomatopoeia must work by ear in each language."}
  - {path: works/aa/fiction/animals/who-says-hello, titles: {en-US: Who Says Hello?, zh-CN: 谁在打招呼}, style: wax-crayon, pages: 8, research: false,
     premise: "Farm animals greet a child with their sounds using one repeated spoken frame. The animal is named in the text so the book works without pictures."}
  - {path: works/aa/fiction/everyday-life/my-red-cup, titles: {en-US: My Red Cup, zh-CN: 我的红杯子}, style: cut-paper-collage, pages: 6, research: false,
     premise: "A toddler uses one red cup for milk, water, bath play, and finally a flower. One repeated frame, one familiar object."}
  - {path: works/a/fiction/verse/moonwell-goodnight-wind, titles: {en-US: "Moonwell Goodnight: Wind", zh-CN: 月井晚安·风}, series: moonwell-goodnight, pages: 8, research: false,
     premise: "Bedtime verse. The night wind rocks the pear tree; Pip holds on, then the wind softens into a lullaby. Calm resolution."}
  - {path: works/b/fiction/animals/the-ants-and-the-crumb, titles: {en-US: The Ants Move the Bread, zh-CN: 蚂蚁搬面包}, style: woodblock-print, pages: 8, research: true,
     premise: "Original story (not a retelling). One ant pulls a big bread crumb and it does not move; a second ant helps and it still does not move; more ants join and the crumb moves home. Repeated pull frame with one stated change. Verify that some ant species carry large food together."}
  - {path: works/b/nonfiction/how-things-work/what-floats, titles: {en-US: What Floats?, zh-CN: 浮起来了}, style: clay-diorama, pages: 8, research: true,
     premise: "A child tests a leaf, a stone, a toy boat, and a key in a tub. Simple observed outcome per page; no false generalization about weight."}
  - {path: works/c/nonfiction/how-things-work/what-the-panda-eats, titles: {en-US: What Does the Panda Eat?, zh-CN: 熊猫吃什么}, style: naturalistic-storybook, pages: 10, research: true,
     premise: "A giant panda's day of eating bamboo shoots, stems, and leaves. Verify diet share and daily feeding time with authoritative sources."}
  - {path: works/d/fiction/folktale/the-tortoise-and-the-hare, titles: {en-US: The Tortoise and the Hare, zh-CN: 龟兔赛跑}, style: bold-ink-comic, pages: 10, research: true,
     premise: "Original retelling of the public-domain Aesop fable with one clear cause (the hare naps) and result (the tortoise wins)."}
  - {path: works/d/nonfiction/natural-science/the-moon-changes-shape, titles: {en-US: The Moon Changes Shape, zh-CN: 月亮变了样子}, style: watercolor-gouache, pages: 10, research: true,
     premise: "A child draws the moon from a window over one month. Phases are named simply; the moon itself does not change, sunlight on it does. Verify the cycle length."}
  - {path: works/e/nonfiction/how-things-work/from-silkworm-to-silk, titles: {en-US: From Silkworm to Silk, zh-CN: 从蚕到丝}, style: naturalistic-storybook, pages: 12, research: true,
     premise: "A class raises silkworms on mulberry leaves: egg, larva, molting, cocoon, moth, and how silk thread comes from a cocoon. Handle the cocoon-boiling fact honestly and gently."}
  - {path: works/e/fiction/animals/the-heron-who-waited, titles: {en-US: The Heron Who Waited, zh-CN: 小苍鹭不扑腾了}, style: watercolor-gouache, pages: 12, research: true,
     premise: "A young heron splashes and scares the fish away; watching an older heron stand still, it learns to wait. Verify heron hunting behavior."}
  - {path: works/f/nonfiction/culture/the-first-day-of-spring-festival, titles: {en-US: The First Day of Lunar New Year, zh-CN: 大年初一}, style: cut-paper-collage, pages: 12, research: true,
     premise: "A family's first day of the Lunar New Year: greetings, red envelopes, dumplings or tangyuan by region, visiting relatives. Note regional variation; avoid presenting one custom as universal."}
  - {path: works/f/fiction/everyday-life/lantern-street-new-neighbor, titles: {en-US: A New Neighbor on Lantern Street, zh-CN: 灯笼街来了新邻居}, series: lantern-street, pages: 12, research: false,
     premise: "Series opener. Amara's family moves into Lantern Street. Mei wants to be friends but they have no shared words yet; Bean the dog and Grandpa Lu's broken bell help them play together."}

  # ---- elementary (g-o) ----
  - {path: works/g/fiction/everyday-life/the-repair-stall-on-lantern-street, titles: {en-US: The Repair Stall on Lantern Street, zh-CN: 灯笼街的修理摊}, series: lantern-street, pages: 12, research: false,
     premise: "Mei tries to fix a neighbor's radio alone to prove herself; the first attempt fails; with Amara she learns to look for the cause first (a loose battery spring) and succeeds."}
  - {path: works/g/nonfiction/how-things-work/where-the-rain-goes, titles: {en-US: Where Does the Rain Go?, zh-CN: 雨水去哪儿了}, style: clay-diorama, pages: 12, research: true,
     premise: "After a storm, a class follows rainwater on the school grounds: soaking into soil, running into a drain, collecting in a puddle that dries in the sun."}
  - {path: works/h/fiction/animals/the-magpie-and-the-bright-key, titles: {en-US: The Magpie and the Bright Key, zh-CN: 喜鹊和亮钥匙}, style: cut-paper-collage, pages: 12, research: true,
     premise: "A shiny key goes missing and everyone blames the magpie; a child finds the key elsewhere. Research the study finding that magpies are wary of, not attracted to, shiny objects."}
  - {path: works/h/nonfiction/culture/the-drum-on-the-dragon-boat, titles: {en-US: The Drum on the Dragon Boat, zh-CN: 龙舟上的鼓声}, style: woodblock-print, pages: 12, research: true,
     premise: "Dragon Boat Festival: why the drummer's beat keeps every paddler in time. Include the festival's customs with regional variation and attribute legends as legends."}
  - {path: works/i/fiction/folktale/stone-soup, titles: {en-US: Stone Soup, zh-CN: 石头汤}, style: wax-crayon, pages: 12, research: true,
     premise: "Original retelling of the public-domain European folktale: a traveler's pot of 'stone soup' leads wary villagers to share one ingredient each."}
  - {path: works/i/nonfiction/natural-science/when-the-swallows-return, titles: {en-US: When the Swallows Return, zh-CN: 燕子回来了}, series: field-notebook, pages: 12, research: true,
     premise: "Field Notebook 1. Around the spring equinox, Lili and her younger cousin Yan watch barn swallows return and build a mud nest under the eaves. Verify migration and nesting facts and the solar-term reference."}
  - {path: works/j/nonfiction/culture/the-kites-of-weifang, titles: {en-US: The Kites of Weifang, zh-CN: 潍坊的风筝}, style: cut-paper-collage, pages: 14, research: true,
     premise: "A child visits a kite workshop in Weifang: bamboo frame, silk or paper, painting, balance testing, and the international kite festival. Verify festival and craft facts."}
  - {path: works/k/fiction/mystery/the-missing-mooncake-mold, titles: {en-US: The Missing Mooncake Mold, zh-CN: 月饼模子不见了}, series: lantern-street, pages: 14, research: true,
     premise: "Days before Mid-Autumn, Grandpa Lu's old wooden mooncake mold disappears. Mei and Amara follow three clues and find it was borrowed, not stolen. Research mooncake-mold and festival customs."}
  - {path: works/l/nonfiction/biography/the-girl-who-read-the-cliffs, titles: {en-US: The Girl Who Read the Cliffs, zh-CN: 读懂悬崖的女孩}, style: naturalistic-storybook, pages: 14, research: true,
     premise: "Mary Anning at Lyme Regis: fossil hunting after landslides, the ichthyosaur and plesiosaur finds, and why scientists of her time rarely credited her. Verify dates and attributions; mark uncertain anecdotes."}
  - {path: works/m/fiction/folktale/the-old-man-who-moved-mountains, titles: {en-US: The Old Man Who Moved the Mountains, zh-CN: 愚公移山}, style: woodblock-print, pages: 16, research: true,
     premise: "Original retelling of the Liezi fable. Give the skeptic's objection a fair voice so readers compare two choices across chapters. Do not reuse textbook wording."}
  - {path: works/n/nonfiction/natural-science/the-cloud-diary, titles: {en-US: The Cloud Diary, zh-CN: 七天云日记}, series: field-notebook, pages: 16, research: true,
     premise: "Field Notebook 2. Lili keeps a week-long cloud diary; Yan keeps guessing rain from dark clouds; they learn which cloud types and changes are real evidence. Verify cloud classification."}

  # ---- upper elementary (p-v) ----
  - {path: works/p/fiction/historical-fiction/the-tea-horse-road, titles: {en-US: The Tea Horse Road, zh-CN: 茶马古道}, style: woodblock-print, pages: 18, research: true,
     premise: "A caravan youth on the Tea Horse Road must choose between arriving on time and protecting the mule team on a dangerous pass. Verify route, trade goods, and era details."}
  - {path: works/p/nonfiction/history/the-printer-who-moved-characters, titles: {en-US: The Printer Who Moved Characters, zh-CN: 毕昇与活字}, style: clay-diorama, pages: 18, research: true,
     premise: "Bi Sheng's clay movable type as recorded by Shen Kuo in Mengxi Bitan; trade-offs of clay, wood, and later metal type; contrast with woodblock printing. Mark what the single source does and does not tell us."}
  - {path: works/q/nonfiction/natural-science/how-bees-choose-a-home, titles: {en-US: How Bees Choose a Home, zh-CN: 蜜蜂怎样选新家}, series: field-notebook, pages: 18, research: true,
     premise: "Field Notebook 3. A honeybee swarm hangs from Grandma Ruan's pear tree; the cousins observe scouts, waggle dances, and the quorum decision. Base mechanisms on Seeley's research."}
  - {path: works/q/fiction/fantasy/the-cartographer-of-small-winds, titles: {en-US: The Cartographer of Small Winds, zh-CN: 小风的地图师}, style: epic-fantasy-illumination, pages: 18, research: false,
     premise: "An apprentice mapmaker in a hill town where each small wind has a character; her maps must serve farmers and kite-fliers whose needs conflict; consequences unfold over chapters."}
  - {path: works/r/fiction/everyday-life/the-last-place-on-the-team, titles: {en-US: The Last Place on the Team, zh-CN: 最后一个名额}, style: bold-ink-comic, pages: 18, research: false,
     premise: "A school basketball team has one place left; the captain weighs fairness, friendship, and winning, using distributed evidence from practices."}
  - {path: works/r/nonfiction/biography/the-railway-that-zigzagged, titles: {en-US: The Railway That Zigzagged, zh-CN: 之字形的铁路}, style: naturalistic-storybook, pages: 18, research: true,
     premise: "Zhan Tianyou and the Beijing-Zhangjiakou Railway: steep grades at Qinglongqiao, the switchback line, and the Badaling tunnel under constraints of money, time, and terrain. Fact-check the common myth that he invented the automatic coupler."}
  - {path: works/s/nonfiction/history/the-mold-nobody-used, titles: {en-US: The Mold Nobody Used, zh-CN: 被搁置的霉菌}, style: naturalistic-storybook, pages: 20, research: true,
     premise: "Penicillin from Fleming's 1928 observation to Florey, Chain, Heatley and wartime production. Separate observation, interpretation, and assumption; correct popular myths."}
  - {path: works/s/fiction/science-fiction/the-rover-that-saw-blue, titles: {en-US: The Rover That Saw Blue, zh-CN: 看见蓝色的探测车}, style: deep-space-science-fiction, pages: 20, research: true,
     premise: "A student team operating a Mars rover simulation sees an unexpected blue patch; they must separate what the camera recorded from what they want it to mean. Ground Mars facts in NASA sources."}
  - {path: works/t/fiction/mystery/two-maps-of-one-island, titles: {en-US: Two Maps of One Island, zh-CN: 同一座岛的两张地图}, style: cut-paper-collage, pages: 20, research: false,
     premise: "Two surveyors a generation apart made contradictory maps of the same island; a teen compares their perspectives and revises her judgment from evidence (erosion, tides, a moved lighthouse)."}
  - {path: works/t/nonfiction/natural-science/the-stones-that-sailed, titles: {en-US: The Stones That Sailed, zh-CN: 会走路的石头}, style: naturalistic-storybook, pages: 20, research: true,
     premise: "The sailing stones of Racetrack Playa: decades of competing hypotheses and the 2013-2014 GPS and time-lapse study that revised them. Cite the primary study."}
  - {path: works/u/fiction/historical-fiction/the-weir-that-does-not-block, titles: {en-US: The Weir That Does Not Block the River, zh-CN: 不拦河的堰}, style: woodblock-print, pages: 20, research: true,
     premise: "Historical fiction around Dujiangyan under Li Bing: the Fish Mouth divider, Flying Sand Weir, and Bottle-Neck Channel. Integrate narrative with researched engineering context and label legend versus record."}
  - {path: works/u/nonfiction/culture/the-calendar-of-twenty-four-turns, titles: {en-US: The Calendar of Twenty-Four Turns, zh-CN: 二十四节气}, style: watercolor-gouache, pages: 20, research: true,
     premise: "The 24 solar terms: their basis in the sun's apparent path, their farming origins in the Yellow River basin, their 2016 UNESCO inscription, and the limits of applying them everywhere."}
  - {path: works/v/nonfiction/history/the-voyages-and-their-records, titles: {en-US: The Voyages and Their Records, zh-CN: 宝船与记录}, style: cut-paper-collage, pages: 20, research: true,
     premise: "Zheng He's voyages (1405-1433) through their sources: official histories, the Mao Kun map, stone inscriptions, Ma Huan's account, and why claims such as '1421' are rejected by historians. Evaluate source position."}
  - {path: works/v/fiction/mystery/the-lighthouse-logbooks, titles: {en-US: The Lighthouse Logbooks, zh-CN: 灯塔日志}, style: bold-ink-comic, pages: 20, research: false,
     premise: "Two keepers' logbooks disagree about the night a ship ran aground; a teen weighs each writer's position, motives, and limits to explain what happened."}

  # ---- secondary (w-z) ----
  - {path: works/w/nonfiction/natural-science/the-hole-in-the-sky, titles: {en-US: The Hole in the Sky, zh-CN: 天空中的洞}, style: naturalistic-storybook, pages: 22, research: true,
     premise: "The ozone hole: Molina and Rowland's 1974 mechanism, Farman's 1985 Antarctic data, the Montreal Protocol, and current recovery projections with their uncertainty."}
  - {path: works/w/fiction/science-fiction/the-town-that-voted-on-the-river, titles: {en-US: The Town That Voted on the River, zh-CN: 为河流投票的小镇}, style: luminous-future-technology, pages: 22, research: true,
     premise: "A near-future town must vote on removing an old dam; farmers, anglers, a hydrologist, and elders bring competing mechanisms and values; the ending is a qualified decision."}
  - {path: works/x/nonfiction/natural-science/did-the-wolves-change-the-rivers, titles: {en-US: Did the Wolves Change the Rivers?, zh-CN: 狼改变了河流吗}, style: naturalistic-storybook, pages: 24, research: true,
     premise: "Yellowstone wolf reintroduction (1995-1996) and the trophic-cascade debate: which studies support strong effects, which challenge them, and how structure and source shape the popular story."}
  - {path: works/x/fiction/everyday-life/the-interpreter, titles: {en-US: The Interpreter, zh-CN: 两种语言之间}, style: watercolor-gouache, pages: 24, research: true,
     premise: "A teenager interprets for her immigrant parents at a clinic, a landlord meeting, and a school conference; alternating narration shows how each side hears her. Research language-brokering evidence."}
  - {path: works/y/nonfiction/natural-science/the-planet-that-was-redefined, titles: {en-US: The Planet That Was Redefined, zh-CN: 被重新定义的行星}, style: cosmic-mystery, pages: 26, research: true,
     premise: "Pluto and the 2006 IAU definition: competing classification models (dynamical vs geophysical), Eris, New Horizons, and why a definition is a scientific choice with trade-offs."}
  - {path: works/y/fiction/everyday-life/the-archivists-dilemma, titles: {en-US: The Archivist's Dilemma, zh-CN: 档案员的两难}, style: clay-diorama, pages: 26, research: true,
     premise: "Floodwater reaches a small city archive; a young archivist has hours to decide what to save under competing values (legal records, family letters, a rare map). Ground conservation practice in real archival guidance."}
  - {path: works/z/fiction/science-fiction/the-last-printing-house, titles: {en-US: The Last Printing House, zh-CN: 最后一家印刷厂}, style: luminous-future-technology, pages: 28, research: true,
     premise: "In a future where text is generated on demand, the last printing house keeps fixed editions; a debate over what memory owes to permanence. Source-aware structure with documents embedded in the narrative."}
  - {path: works/z/nonfiction/history/the-skull-that-fooled-science, titles: {en-US: The Skull That Fooled Science, zh-CN: 骗过科学界的头骨}, style: bold-ink-comic, pages: 28, research: true,
     premise: "The Piltdown forgery (1912-1953): why it was believed, which evidence exposed it, and the unresolved question of who made it. Separate proven facts from suspicion."}

  # ---- higher education (z1-z2) ----
  - {path: works/z1/nonfiction/history/the-ledger-of-the-green-revolution, titles: {en-US: The Ledger of the Green Revolution, zh-CN: 绿色革命的账本}, style: naturalistic-storybook, pages: 28, research: true,
     premise: "High-yield wheat and rice (Borlaug, IR8): famine averted, and second-order effects on water, soil, inequality, and diversity. Weigh competing evidence and methodological limits."}
  - {path: works/z2/nonfiction/natural-science/the-experiments-that-did-not-repeat, titles: {en-US: The Experiments That Did Not Repeat, zh-CN: 无法重复的实验}, style: cut-paper-collage, pages: 32, research: true,
     premise: "The replication crisis: the 2015 Open Science Collaboration results, p-hacking, preregistration, and what non-replication does and does not show. Represent real academic disagreement."}
  - {path: works/z2/fiction/science-fiction/the-last-speaker, titles: {en-US: The Last Speaker, zh-CN: 最后的说话人}, style: watercolor-gouache, pages: 32, research: true,
     premise: "A linguist records the last fluent speaker of an invented endangered language while a speech model promises to 'preserve' it; a mature exploration of what a language is. Ground endangerment facts in UNESCO and linguistic sources; the language itself is invented."}
