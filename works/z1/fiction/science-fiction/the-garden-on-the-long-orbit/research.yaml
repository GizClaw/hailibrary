    publisher: NASA Johnson Space Center
    claims: [On the International Space Station, internal heat loads are transported through cooling loops and rejected to space by external radiators.]
  - url: https://science.nasa.gov/mission/advanced-plant-habitat/
    publisher: NASA Science
    claims: [Space plant-growth chambers use controlled LED lighting, water, nutrients, oxygen, and environmental conditions; crop response therefore depends on more than one thermal observation.]
  - url: https://www.nasa.gov/missions/station/iss-research/space-gardens/
    publisher: NASA International Space Station Research Communications Team
    claims: [Space-station plant studies show that lighting conditions can affect crop yield and nutritional outcomes, supporting the story's caution about short tests and projected harvest tradeoffs.]
notes: The Long Orbit mission, planet, habitats, crops, characters, computer, measurements, and control strategy are fictional. The story accurately uses the high-level principle that generated heat must be managed and ultimately rejected, but presents no real mission design or operating procedure.
