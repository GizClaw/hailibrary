---
schema_version: 1
language: zh-CN
writer: 穹宇工程师
title: 远航中的太空花园
summary: 一艘靠泊货运器让太空花园的热余量不断缩小。袁、阿洛、伊沃和系统“种子”把它当成一项工程案例：他们分开测量与预测，用可回退的小规模试验检验模型，并同时衡量食物、货运、船员工时和安全。一次成功试验不能证明整个模型，但能帮助船队保留更多选择。
cast:
  narrator:
    display_name: 旁白
    tts:
      delivery: 开阔而克制
      timbre: 清晰的成年声音
      pace: 中慢速
      pitch: 中音
  yuan:
    display_name: 袁
    tts:
      delivery: 耐心而有系统观
      timbre: 稳定的成年声音
      pace: 中速
      pitch: 中音
  aro:
    display_name: 阿洛
    tts:
      delivery: 精确谨慎
      timbre: 坚实的成年声音
      pace: 中慢速
      pitch: 中低音
  ivo:
    display_name: 伊沃
    tts:
      delivery: 外交而坚定
      timbre: 温厚的年长声音
      pace: 中速
      pitch: 中低音
  seed:
    display_name: 种子
    tts:
      delivery: 中性并明确表达不确定性
      timbre: 平滑的合成声音
      pace: 匀速
      pitch: 中音
pages:
- id: p01
  illustration: p01
  lines:
  - speaker: narrator
    text: 船队进入蓝行星外侧的漫长转移轨道，距离下次补给还有三十七轮明暗。三座居住舱、一艘货运器和花园暂时连成一套耦合系统。
  - speaker: seed
    text: 任务状态：正常。正常只表示受监测数值仍在运行限制内，不表示每项余量、趋势或尚未观测的情况都无害。
  - speaker: yuan
    text: 花园经历过发射、组装和两次靠泊改变。它在过去构型中稳定，是有关过去的证据，不是给新构型的保证书。
- id: p02
  illustration: p02
  lines:
  - speaker: yuan
    text: 花园提供鲜食，保存多样种苗，回收部分水分，也维持船员日常节奏。峰值产量只是最容易计数的一个功能。
  - speaker: narrator
    text: 十二个作物区包含不同品种和生长阶段；种子按生物种类分开，却存放在同一个环境柜里，第一批替补幼苗还共用同一灯光计划。
  - speaker: ivo
    text: 食物储备可以承受收成稍减。若一种环境故障同时毁掉全部替补批次，损失会在航程结束后继续威胁定居阶段。
- id: p03
  illustration: p03
  lines:
  - speaker: aro
    content:
    - text: 灯、泵、电子设备、人的活动和外部吸收能量都会加热。冷却回路把许多热带到舱外
    - vocabulary:
        id: radiator
        text: 热辐射器
    - text: "，再由表面向更冷的视野发出热辐射。"
  - speaker: aro
    text: 稳态热量收支可写成产生与吸收的热，减去排出的热；温度正在变化时，还要计入结构和内容物储存的能量。每一项都带测量或模型不确定性。
  - speaker: seed
    text: 花园平均每个任务间隔使用八十四个本船热单位，运行范围为上下六个。泵和船员贡献来自分系统日志，不是在叶片旁直接测得。
- id: p04
  illustration: p04
  lines:
  - speaker: narrator
    text: 伊沃的货运器靠在花园舱旁，缩短了受保护的货物转移路线；同一位置却让一片暖船壳占据R2热辐射翼原本朝向深空的部分角度。
  - speaker: ivo
    text: 货舱没有碰到热辐射器，间距也符合靠泊规则。中间明明是空的，为什么还算遮挡？
  - speaker: aro
    text: 辐射换热不需要接触。表面之间交换多少能量由几何关系决定，物体即使隔开，也会降低有效排热。
- id: p05
  illustration: p05
  lines:
  - speaker: seed
    text: 温度仍在允许范围。四轮相配明暗周期里，最小热余量却从十八单位依次降到十一、八和六；最后一次估计范围为四至八。
  - speaker: aro
    text: 余量是当前或预测状态到限制之间的距离，还须留出不确定性和控制需要。正值也可能要求行动，尤其当趋势与误差都朝不利方向发展。
  - speaker: ivo
    text: 只有四轮数据。连续下降可能来自靠泊、灯光变化、传感器偏差、环境变化，也可能只是控制器暂时适应得慢。
- id: p06
  illustration: p06
  lines:
  - speaker: narrator
    text: 两个上层作物区的叶缘开始卷曲；水分、灯光、气流、根区电导和品种年龄也同时变化，足以提出几种竞争解释。
  - speaker: yuan
    text: 热胁迫合理，却不是唯一原因。叶片反应由多种因素共享，必须看空间分布、发生时刻、对照与恢复，不能把生物当成简单温度计。
  - speaker: aro
    text: G7升温而共用供水的G8保持接近原状。G7刚换过灯具驱动器，电气日志还显示它偶尔额外耗能。
- id: p07
  illustration: p07
  lines:
  - speaker: aro
    text: 回流冷却液路径上三个传感器在靠泊后同时上升，热辐射器进出口差也同向改变；转折发生在一个有日志的构型间隔内。
  - speaker: seed
    text: 相对于短记录，关联较强；独立性却有限，因为传感器共用校准程序、数据采集、冷却液流动和外部环境。
  - speaker: ivo
    text: 它们会不会因为共同参考电子设备变化而一起漂移？
- id: p08
  illustration: p08
  lines:
  - speaker: aro
    text: 热模型分为四块：源产生或吸收热，回路搬运，结构与内容物储存，舱外表面排出。传感器只观察这条链中的少数状态。
  - speaker: seed
    text: 几何模型预测货舱壳温越高，R2相对其他区越热；负荷模型预测余量跟随内部用电，不受视野影响。
  - speaker: yuan
    text: 测量模型预测共同参考偏差，却不会同时出现便携仪、实际用电和植物反应。控制迟滞模型则预测系统会在无干预时逐步自行恢复。
- id: p09
  illustration: p09
  lines:
  - speaker: ivo
    text: 解开靠泊会恢复更好的冷视野，也能切断几条共同故障路径；代价是延误药品、维修件和水设备，还要消耗机动储备。
  - speaker: aro
    text: 继续靠泊保留快速转运，也省下眼前一次机动，却维持不确定热耦合，并让多项控制依赖同一个接口。
  - speaker: yuan
    text: 第三条路是局部重构：分阶段改变姿态，降低可控热量，调整取货时段，并试验绝不遮住热辐射器的隔热遮光板。
- id: p10
  illustration: p10
  lines:
  - speaker: yuan
    text: 比较三类构型，而不是两个口号：甲保持姿态与靠泊，乙解开货舱，丙则分阶段调整负荷、姿态和取货，并设置明确门槛。
  - speaker: aro
    text: 每类都计算近期热余量、不确定性增长、可用电力、作物光照偏差、机动储备、取货延误，以及一次故障会切断多少关键功能。
  - speaker: ivo
    text: 这些量不能随便相加。失去急救药与少收生菜没有天然共同单位，必须先保护约束，再讨论偏好。
- id: p11
  illustration: p11
  lines:
  - speaker: aro
    text: 甲维持光照和随时取货。中位假设下，第十二轮最小余量只剩三；不利视野与负荷同时出现时，预测范围在第九轮就越过限制。
  - speaker: seed
    text: 越线是模型结果，不是预约好的故障。它说明合理输入中包含补给前的不安全状态，尤其当没有额外控制时。
  - speaker: ivo
    text: 甲的优点是操作简单。下一维修窗口前不机动、不暂停转运，也不引入新硬件故障。
- id: p12
  illustration: p12
  lines:
  - speaker: yuan
    text: 乙解开靠泊并大幅转向有利散热姿态。预测排热改善，可作物照明改变，两阶段太阳能下降，货物访问也暂停。
  - speaker: seed
    text: 热余量中位值升到二十一，范围仍宽，因为地面试验支持这种姿态，当前组装船队的在轨证据却有限。
  - speaker: ivo
    text: 水处理备件可以提前移动，一包药却不能过早离开控温储存。临床窗口前解开，会产生概率低而后果高的访问缺口。
- id: p13
  illustration: p13
  lines:
  - speaker: seed
    text: 丙先降低负荷、错开灯光，只有满足测量门槛后才小幅转向。第十五轮后预测范围扩大，因为这套分阶段策略从未完整运行。
  - speaker: aro
    text: 第一门槛要求保守余量高于八、冷却流量稳定、安全照明不减，任何作物区都不超过规定黑暗时长。
  - speaker: yuan
    text: 第二门槛允许转两度，但R2响应要符合几何模型容差，太阳能也必须高于必要负荷储备。
- id: p14
  illustration: p14
  lines:
  - speaker: yuan
    text: 先做可回退的负荷试验：降低非必要走廊灯，错开高功率工作，部分作物灯轮换，并留下不改变的作物区作比较。
  - speaker: aro
    text: 试验持续两个完整光周期。安全照明不足、保守余量低于七、冷却异常、作物黑暗超限或控制故障，任何一项都立即停止。
  - speaker: seed
    text: 负荷模型预测余量快速响应；几何模型预测只部分改善而R2仍异常；测量模型预测固定探头与独立参考无法一致。
- id: p15
  illustration: p15
  lines:
  - speaker: narrator
    text: 舱内走廊降到认证安全照度，维修队错开消毒、泵送和制造；应急路线、作业灯与医疗区仍由独立电源保持。
  - speaker: ivo
    text: 第一版班表把两组维修人员的休息撞在一起。我们不提高总负荷，只改人员安排，同时保住热试验与疲劳约束。
  - speaker: aro
    text: 调整改变运行背景，却没有改变电气目标。日志要分别记录命令负荷、实测负荷、延后工作和人的后果。
- id: p16
  illustration: p16
  lines:
  - speaker: narrator
    text: 花园按品种、年龄、灌溉支路和既往长势组成配对区；一边改变光照，另一边在两轮内保留基线。
  - speaker: yuan
    text: 成对植物不是复制品。我们观察叶姿、水分需求、生长和恢复，并报告生物差异，不能把对照区当成完美副本。
  - speaker: aro
    text: 电气日志确认轮换时命令减少十四单位，其中两单位又以泵需求出现，净降低其实是十二。
- id: p17
  illustration: p17
  lines:
  - speaker: aro
    content:
    - text: 净热负荷下降后，冷却液温度稳定，保守余量停止缩小；在相近负荷下，R2仍比其他
    - vocabulary:
        id: radiator
        text: 热辐射器
    - text: 分区更暖，几何路径的证据仍在。
  - speaker: seed
    text: 便携参考与固定探头在预定容差内一致，共同测量偏差变得不太可能；参考仪自身也有误差，所以不能宣告概率为零。
  - speaker: yuan
    text: 结果支持负荷模型，也支持几何模型的一部分：负荷确实重要，几何差异仍未消失；任何单一模型都解释不了全部。
- id: p18
  illustration: p18
  lines:
  - speaker: yuan
    text: 作物区仍在短期范围内。两个品种叶片展开较慢，但水分和恢复迹象不支持这次短试验已造成即时损伤。
  - speaker: seed
    text: 样本只有两轮且品种有限，不能证明最终产量、营养、病害反应或余下全航程表现。
  - speaker: ivo
    text: 改班以后，休息安排符合规定了，两项维修却积累了延误。人的负担属于结果，不能被留在热分析之外。
- id: p19
  illustration: p19
  lines:
  - speaker: ivo
    text: 靠泊争论暴露第二项弱点：药品、吸收器滤芯、水泵件和种苗柜备件都集中在货运器里，只因正常转运最快。
  - speaker: yuan
    text: 正常效率制造了单点依赖。货舱一旦隔离，几项必要功能会同时失去访问；热耦合只是让这层关系显形。
  - speaker: aro
    text: 冗余不是随便多买一份。复制品若同处一舱、同一电源、同一舱门或同一控制故障下，仍会一起失效。
- id: p20
  illustration: p20
  lines:
  - speaker: narrator
    text: 余下航程被拆成六个阶段，每段声明灯光、姿态范围、取货窗口、维修、电力储备、复审时刻和升级条件。
  - speaker: yuan
    text: 不再同时把作物光照、随时取货、固定姿态和每项工作推到最大；不同目标轮流让步，硬约束始终保护。
  - speaker: ivo
    text: 窗口关闭前只前置近期任务与应急真正需要的物资。全部搬出会制造拥挤、搬运风险和假冗余。
- id: p21
  illustration: p21
  lines:
  - speaker: aro
    content:
    - text: 船队先转两度，改善R2
    - vocabulary:
        id: radiator
        text: 热辐射器
    - text: 朝向冷空间的估算视野，同时让太阳能和航行储备保持在门槛以上。
  - speaker: seed
    text: R2实测响应落在几何模型预先声明的范围内；其他分区变化较小，冷却流量和内部负荷也在比较容差内。
  - speaker: yuan
    text: 目标输入改变、预定分区响应，使几何机制更可信，却不能确认每个视野系数或更大机动。
- id: p22
  illustration: p22
  lines:
  - speaker: yuan
    text: 作物按品种和阶段错开光照。相对原峰值计划，可食产量预测下降百分之十四，范围为百分之九至二十一。
  - speaker: seed
    text: 范围包含生物响应、灯具表现、延后工作和未来有利姿态可能恢复光照；它不是概率保证。
  - speaker: ivo
    text: 食物储备能承担短缺，但鲜食品种和船员期待会变。营养并不是唯一人的后果。
- id: p23
  illustration: p23
  lines:
  - speaker: aro
    text: 新遮光板减少货舱侧结构吸收的多余外热，绝不能替代热辐射器，也不能遮住其视野、展开、检查或应急运动。
  - speaker: seed
    text: 地面光学资料输入模型，污染、老化、接缝和展开角使范围扩大；遮光板只是补充控制，不是主要排热。
  - speaker: ivo
    text: 若展开失败，装置可能半开。设计要默认锁在不遮挡的位置，并能从舱内安全收回，不让人员暴露舱外。
- id: p24
  illustration: p24
  lines:
  - speaker: narrator
    text: 分阶段运行后的第一茬收成低于原计划，却在已测指标中健康。质量数字仍不能代表味道、营养变化、劳动、水回收或种苗活力。
  - speaker: yuan
    text: 我们抽样检查品质并保留不确定性，不凭绿叶宣布成功；替补植物按批次、柜体、灯光阶段和冷却支路尽可能分开。
  - speaker: seed
    text: 任何分布都去不掉全部共同原因。所有批次仍依赖全船压力、核心电力、航行和人工维护，韧性结论只适用于已分析故障。
- id: p25
  illustration: p25
  lines:
  - speaker: ivo
    text: 关键物资按功能、共同故障、储存条件、访问时间和恢复服务所需最小套装，分到三座居住舱。
  - speaker: seed
    text: 库存系统保留同步本地副本并定期对账；中央服务失效时，还有纸面位置卡和封存应急清单。
  - speaker: yuan
    text: 药品仍需合适环境，所以冗余不是随处乱放。部分风险通过替代访问路线降低，不一定每样都复制。
  - speaker: aro
    text: 演练隔离货舱与中央库存，两舱独立取到水回路修理套装；第三舱因接头标签错误延误，迫使流程修订。
- id: p26
  illustration: p26
  lines:
  - speaker: seed
    text: 修订展望：峰值可食产量中位下降百分之十四；已验证时段内保守热余量高于九；必要供应在测试的单节点隔离后仍可恢复。
  - speaker: seed
    text: 更远期因作物成长、表面老化、未来机动、维修和复合故障而扩大；现有资料不能给所有组合可靠概率。
  - speaker: yuan
    text: 较低峰值、较大余量和较强已测试冗余是不同维度，不能用三支箭头冒充结论。
- id: p27
  illustration: p27
  lines:
  - speaker: narrator
    text: 抵达补给点时，船队交付蔬菜、活种苗、热记录、构型历史、排除项、失败检查、船员报告、依赖图和每版决策模型。
  - speaker: yuan
    text: 定居点不能把我们的数字抄成普遍常数。重力、环境、车辆形状、作物、散热器、维修能力和可接受风险都不同。
  - speaker: aro
    text: 可迁移的是方法：定义边界与物理量，追踪热路径，比较因果模型，保留不确定性，预设门槛，开展可回退试验，并观察原系统以外的后果。
- id: p28
  illustration: p28
  lines:
  - speaker: yuan
    text: 长程设计不承诺永不失败。它让证据可见，保留可恢复选择，也阻止一个漂亮最优值吃光所有余量。
  - speaker: aro
    text: 负荷与几何共同管理后，花园保持较低温度；这项认识比以前更强，却只适用于测试范围和构型。
  - speaker: ivo
    text: 货物更难管理，也更难一次全部失去。这是一项有可测成本的权衡，不是免费改善。
