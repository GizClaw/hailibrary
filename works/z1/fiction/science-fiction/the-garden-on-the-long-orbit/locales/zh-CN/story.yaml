questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据支持耦合热问题，同时又没有把卷叶或靠泊时刻当作证明？
    answer: 多项冷却与散热测量在靠泊后改变，独立参考削弱传感器偏差，降负荷稳定余量，目标转向产生预期分区响应；生物证据和时间证据仍有限。
    page_refs:
      - p04
      - p05
      - p06
      - p07
      - p17
      - p21
  - id: q02
    type: source-analysis
    speaker: narrator
    prompt: NASA热控制原则怎样支持虚构热量收支，又不能提供什么？
    answer: 它支持从产生、吸收、搬运、储存、辐射、表面、传感器、隔热、遮光和运行来管理热；它不提供本船单位、几何、限制、作物反应或安全命令。
    page_refs:
      - p03
      - p04
      - p08
      - p23
      - p27
  - id: q03
    type: compare
    speaker: narrator
    prompt: 从余量、不确定性和热系统外后果比较甲、乙、丙三类构型。
    answer: 甲保光照和取货却可能继续失去余量；乙热收益最大，却消耗机动并扰动货运、电力和作物；丙分阶段获得信息和选择，但接受较低产量与远期范围扩大。
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: 负荷试验为何比只看靠泊后趋势更有力，又为何仍非定论？
    answer: 它主动改变因果输入，预设特征和门槛，使用比较区与独立参考，并观察预测响应；但时间短、运行仍耦合、生物样本有限、几何误差还在。
    page_refs:
      - p07
      - p08
      - p14
      - p15
      - p16
      - p17
      - p18
  - id: q05
    type: synthesis
    speaker: narrator
    prompt: 结果怎样修订几何、负荷、传感器和控制迟滞的简单模型？
    answer: 降负荷支持负荷机制，R2差异与转向响应支持几何机制，便携仪削弱共同偏差；没有单一模型解释全部，修订版结合负荷与几何并保留测量误差。
    page_refs:
      - p07
      - p08
      - p14
      - p16
      - p17
      - p21
  - id: q06
    type: source-analysis
    speaker: narrator
    prompt: 为什么必须区分命令负荷、实测负荷、模型视野和观测温度？
    answer: 它们来自不同方法：命令不等于实际热，视野是几何估计，稀疏探头只观察部分状态；混在一起会让假设冒充独立测量。
    page_refs:
      - p03
      - p04
      - p08
      - p15
      - p16
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 预测减产百分之十四，为什么仍可能构成更强任务方案？
    answer: 预测有范围和代价，但分阶段光照保留热余量、分散作物批次与故障暴露，食物储备也能承担；目标从峰值变为可恢复的食物与定居选择。
    page_refs:
      - p02
      - p18
      - p22
      - p24
      - p26
  - id: q08
    type: synthesis
    speaker: narrator
    prompt: 热问题怎样暴露并改造了货运系统的韧性？
    answer: 靠泊揭示集中访问和共同依赖；按功能与故障分布、库存本地副本、替代访问和隔离演练改善连续性，同时增加工作并暴露标签风险。
    page_refs:
      - p09
      - p19
      - p20
      - p25
      - p26
  - id: q09
    type: research-response
    speaker: narrator
    prompt: 把遮光板决定连接到热模型和外部来源限制。
    answer: 遮光板减少吸收热路径，却不能代替排热或遮住热辐射器；地面材料关系只进入有限模型，展开、老化、污染、反射、失效位置和本地测量决定是否接受。
    page_refs:
      - p03
      - p08
      - p23
      - p26
  - id: q10
    type: research-response
    speaker: narrator
    prompt: 某定居温室有充足冷视野，但电力稀缺且无货运限制。船队方法哪些可迁移，哪些优先或模型项要改变？
    answer: 边界、热路径、来源区分、不确定性、预设门槛、可回退试验和后果监测可以迁移；电力成为更强约束，货运耦合减弱，当地环境和几何需要新模型，也要重新授权优先次序。
    page_refs:
      - p03
      - p09
      - p10
      - p20
      - p27
  - id: q11
    type: research-response
    speaker: narrator
    prompt: 把冗余论证用于同一带电柜里的三台备用泵：还剩哪些共同故障，什么证据能显示系统韧性改善？
    answer: 柜体、供电、访问、环境、控制器和维修都可能让三台泵同时失效；分开电源或访问、建立功能恢复路径、分析依赖并开展隔离演练，比只数副本更能检验系统韧性。
