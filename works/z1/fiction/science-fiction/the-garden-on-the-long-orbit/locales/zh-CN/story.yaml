  - id: q14
    type: research-response
    speaker: narrator
    prompt: 船员是在牺牲最优来换取系统韧性，还是重新定义应当优化什么？结合产量、热余量、取货、恢复路径和人的决策权加以论证。
    answer: 可以强调牺牲、多目标重定义或两者并存，但必须承认可测成本、有限改善、硬约束、剩余不确定性，以及模型不能替人决定任务价值。
