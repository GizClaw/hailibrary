    type: research-response
    speaker: narrator
    prompt: 在第26页以后选择下一阶段，说明规则、最强证据、一项反例、停止条件和会使你反转选择的证据。
    answer: 可以继续分阶段、部分解泊、缩减作物或提出其他有限方案，但必须保护硬约束，区分观测与模型，考虑不确定性和跨系统后果，并给出真正会触发反转的证据。
