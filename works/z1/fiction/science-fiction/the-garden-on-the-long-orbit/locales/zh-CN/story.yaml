        - id: p04-b01
          speaker: narrator
          text: 货运器停在花园舱旁，药箱送来只需七分钟；一片温暖船壳也占住了R2热辐射翼原本朝向深空的部分角度。
        - id: p04-b02
          speaker: ivo
          text: 没碰到，也算挡？
        - id: p04-b03
          speaker: aro
          text: 热辐射器不需要被碰到才会受影响。它看见什么，比中间是不是空的更要紧。
        - id: p04-b04
          speaker: narrator
          text: 伊沃把取药时间写在图边。
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          text: 四轮相似周期里，最小热余量从十八降到十一，再到八和六；最后一个六考虑误差后可能在四到八之间。
        - id: p05-b02
          speaker: ivo
          text: 四轮也可能骗人。靠泊、灯光、传感器，或者控制器适应得慢，都能画出这条线。
        - id: p05-b03
          speaker: narrator
          text: 阿洛把货舱遮挡从结论栏移回候选解释。趋势足以要求行动，还不足以指定原因。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: G7上层叶缘向内卷起。袁检查水分、气流、根区电导和灯具记录；共用供水的G8接近原状，G7却刚换过驱动器。
        - id: p06-b02
          speaker: yuan
          text: 可能是热，也可能是灯、水或驱动器。先查它什么时候开始、只出现在哪里，再看能不能恢复。
        - id: p06-b03
          speaker: narrator
          text: 电气日志很快翻出一笔偶发耗能。
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          text: 回流路径上的三个温度传感器都在靠泊后上升，热辐射器进出口温差也随之改变。
        - id: p07-b02
          speaker: seed
          text: 三个探头共用校准程序、采集设备、冷却液和外部环境，不能算作三份完全独立的证据。
        - id: p07-b03
          speaker: ivo
          text: 如果它们用的参考电子设备一起偏了呢？
        - id: p07-b04
          speaker: narrator
          text: 便携参考仪被列入下一轮测量。
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: 阿洛把模型拆成热源、搬运、储存和排出四段。传感器只守在这条长路的几个路口。
        - id: p08-b02
          speaker: seed
          text: 几何视野、内部负荷、测量偏差与控制迟滞，应各自留下不同的可检验痕迹。
        - id: p08-b03
          speaker: yuan
          text: 先写什么能推翻它。
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: 解开靠泊能恢复冷视野，也会让药品、维修件和水设备隔着一次机动。继续靠泊保住转运，却保留热耦合和接口依赖。
        - id: p09-b02
          speaker: yuan
          text: 不用一次把选择押完。先错开高功率工作，再小角度转向，最后才试不遮挡热辐射器的遮光板。
        - id: p09-b03
          speaker: narrator
          text: 她把三步分别锁在三个检查点后面。任何一步出现停止条件，系统都退回前一个构型。
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          text: 甲、乙、丙三种构型的表格塞满热余量、电力、黑暗时长、机动储备和取货延误。有人准备给每列打分，伊沃盖住总分格。
        - id: p10-b02
          speaker: ivo
          text: 急救药晚到和少收一筐菜，不能加成一个总分。
        - id: p10-b03
          speaker: narrator
          text: 总分栏清空以后，每项后果都得单独回答。他们先划出安全照明、医疗访问、最低电力和作物黑暗上限。
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: 甲方案最省事。中位假设下，第十二轮仍有三单位最小余量；不利视野与高负荷同时出现时，第九轮便可能越过限制。
        - id: p11-b02
          speaker: seed
          text: 这只是预测，不代表第九轮一定发生故障。
        - id: p11-b03
          speaker: ivo
          text: 甲仍有一个真优点：不用机动，不停转运，也不引入新硬件故障。
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: 乙方案解开货舱并大幅转向。热余量中位值升到二十一，预测阴影仍很宽，作物光照和太阳能也会改变。
        - id: p12-b02
          speaker: ivo
          text: 水处理备件可以先搬。那包药不行。离开控温柜太早会报废，留在那里又可能拿不到。
        - id: p12-b03
          speaker: narrator
          text: 乙方案没有被热模型否决，却被一只不能移动的药箱拦住。
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: 丙方案先降负荷，满足门槛才转两度，再根据响应决定下一步。整套策略未曾运行，第十五轮后的预测反而更散。
        - id: p13-b02
          speaker: seed
          text: 第一门槛要求保守余量高于八、冷却流量稳定、安全照明不减，作物黑暗不超限。第二门槛检查R2响应、太阳能和必要负荷储备。
        - id: p13-b03
          speaker: yuan
          text: 每一步做完，我们都重新看数据。系统不能自己接着往下跑。
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: 负荷试验只做两个光周期。走廊灯降低，高功率工作错开，部分作物灯轮换，另一些作物区保留原计划。
        - id: p14-b02
          speaker: aro
          text: 保守余量低于七、冷却异常、安全照明不足、作物黑暗超限，或任何控制故障，出现一项便停。
        - id: p14-b03
          speaker: yuan
          text: 预测先放在这里。结果出来以后再改，就不算检验。
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: 试验开始四十分钟后，两组维修人员被同时排进休息期，下一班将缺少合格泵检人员。
        - id: p15-b02
          speaker: ivo
          text: 总负荷不能涨，也不能把两组人都挤进同一个休息时段。
        - id: p15-b03
          speaker: narrator
          text: 走廊暗下来，有人认错过一次工具柜，随即打开作业灯。班表重新排过，日志也把命令负荷、实测负荷、延后工作和人员影响分开记录。
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: 袁按品种、年龄、灌溉支路和既往长势给作物配对。植物不是复制品，各有旧伤、位置和生长速度。
        - id: p16-b02
          speaker: aro
          text: 轮换命令减少十四单位，泵却多用了两单位。净降低只有十二。
        - id: p16-b03
          speaker: yuan
          text: 泵多用的两单位也单独记上，不能还写十四。
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          content:
            - text: 负荷降下去后，冷却液温度稳住，保守余量不再缩小；在相近负荷下，R2仍比其他
            - vocabulary:
                id: radiator
                text: 热辐射器
            - text: 分区更暖。便携参考仪与固定探头一致，共同偏差的可能性下降，却没有归零。
        - id: p17-b02
          speaker: yuan
          text: 降负荷把余量稳住了，R2却还是偏热。下一阶段，两边都得管。
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: 两个光周期结束，作物仍在短期范围内。样本太少、时间太短，营养、病害反应和最终产量都还看不出来。
        - id: p18-b02
          speaker: ivo
          text: 休息时间合规了，可这两项维修晚了。把延误也记进试验。
        - id: p18-b03
          speaker: narrator
          text: 袁没有调淡那两格。
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: 药品、滤芯、水泵件和种苗柜备件全在货运器里，只因为从同一扇舱门取货最快。
        - id: p19-b02
          speaker: aro
          text: 复制一份也不够。若它们还共用电源、舱门或错误标签，会一起留在门后。
        - id: p19-b03
          speaker: narrator
          text: 他们于是把问题从有几套备件，改成货舱隔离后谁还能从哪里拿到一套能用的维修件。
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: 余下航程被切成六段，各有灯光、姿态、取货、维修和复审安排。
        - id: p20-b02
          speaker: narrator
          text: 伊沃只搬出近期任务和可信应急情况真正会用到的物资；全搬出来，通道会被箱子堵住，关键接头反而更难找到。
        - id: p20-b03
          speaker: narrator
          text: 第一只水泵箱扣进居住舱地板。以后即使货运舱暂时隔离，维修人员也能立刻拿到一套能接上本舱回路的水泵件。
    - id: p21
      illustration: p21
      blocks:
        - id: p21-b01
          speaker: narrator
          text: 船队转动两度。舷窗边的蓝光偏了一线，太阳能、冷却流量和内部负荷仍在门槛内。
        - id: p21-b02
          speaker: seed
          text: R2响应落入几何模型的预定范围，其他分区变化较小。
        - id: p21-b03
          speaker: yuan
          text: 这让几何解释更可信。只到这两度为止。
    - id: p22
      illustration: p22
      blocks:
        - id: p22-b01
          speaker: narrator
          text: 作物灯按品种和阶段错开。可食产量预计下降百分之十四，范围为百分之九到二十一；储粮能填上缺口。
        - id: p22-b02
          speaker: ivo
          text: 储粮能补热量，可补不了轮休时大家从这里摘的那一把。
        - id: p22-b03
          speaker: narrator
          text: 那盆香草的辛辣气味原本能飘过半条餐廊。现在船员吃得饱，餐盘却比往常安静。袁把鲜食品种加入后续评估。
    - id: p23
      illustration: p23
      blocks:
        - id: p23-b01
          speaker: narrator
          text: 遮光板只减少货舱侧结构吸收的额外热量，不替代热辐射器，也不得闯入它的视野和运动范围。
        - id: p23-b02
          speaker: ivo
          text: 坏的时候别指望它懂礼貌。
        - id: p23-b03
          speaker: narrator
          text: 装置因此默认锁在不遮挡的位置，并能从舱内安全收回。
    - id: p24
      illustration: p24
      blocks:
        - id: p24-b01
          speaker: narrator
          text: 第一茬收成比原计划少，叶菜在已经测过的指标中仍然健康。这次收成还不能说明味道、水回收成本、劳动量和种苗的长期活力。
        - id: p24-b02
          speaker: seed
          text: 所有批次仍共用全船压力、核心电力、航行与人工维护。
        - id: p24-b03
          speaker: yuan
          text: 我知道。韧性只适用于已经分析过的故障。
    - id: p25
      illustration: p25
      blocks:
        - id: p25-b01
          speaker: narrator
          text: 关键物资分到三座居住舱，库存各留本地副本，中央服务失效时还可查纸面位置卡。
        - id: p25-b02
          speaker: narrator
          text: 隔离演练中，第三座舱被错误接头标签拖延了十二分钟。
        - id: p25-b03
          speaker: ivo
          text: 舱门没锁，是标签把人带错了。
        - id: p25-b04
          speaker: narrator
          text: 他们换掉标签，也把失败留在交付记录中。
    - id: p26
      illustration: p26
      blocks:
        - id: p26-b01
          speaker: seed
          text: 峰值可食产量中位下降百分之十四；已验证时段内，保守热余量高于九；测试过的单节点隔离后，必要供应仍可恢复。
        - id: p26-b02
          speaker: narrator
          text: 更远处，作物成长、表面老化、机动、维修和复合故障让不确定性逐渐扩大。
        - id: p26-b03
          speaker: narrator
          text: 袁关掉绿色上箭头，屏幕上只留下三条末端张开的曲线。
    - id: p27
      illustration: p27
      blocks:
        - id: p27-b01
          speaker: narrator
          text: 他们交出蔬菜、种苗、热记录、构型历史、失败检查，以及每一版曾经指导决策的模型。
        - id: p27-b02
          speaker: aro
          text: 这些数别直接抄。换一艘船，外形、热负荷和维修条件全会变。
        - id: p27-b03
          speaker: narrator
          text: 可以带走的是做事的顺序：先画清热从哪里来、到哪里去，再让几种解释接受同一组证据；动手前写好停止条件，动手后继续检查别的系统受了什么影响。
    - id: p28
      illustration: p28
      blocks:
        - id: p28-b01
          speaker: narrator
          text: 花园再次与货运器相连。R2旁的遮光板锁在不遮挡的位置，袁只记录已验证构型、仍在扩大的误差和下一次测量条件。
        - id: p28-b02
          speaker: seed
          text: 下一阶段状态：可接受。适用于当前构型与已测试的单节点故障；不包含未经观测的组合。
        - id: p28-b03
          speaker: narrator
          text: 舷窗外的蓝行星已经退成一枚小而亮的圆片。伊沃扣好最后一只分散存放的货箱。花园的灯熄灭一排，又在远处亮起另一排。
