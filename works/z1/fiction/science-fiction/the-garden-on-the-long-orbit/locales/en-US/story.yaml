schema_version: 1
language: en-US
writer: cosmic-engineer
title: The Garden on the Long Orbit
summary: 'A cargo module is casting the orbital garden''s thermal future into doubt. Yuan, Aro, Ivo, and Seed investigate the shrinking margin as an engineering case: they separate measurements from predictions, test reversible controls, and weigh food, cargo, crew time, and safety without pretending that one successful trial proves the whole model.'
