questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: Which evidence supports a coupled thermal problem without treating curled leaves or docking time as proof?
    answer: Several coolant and radiator measurements shift after docking, independent references weaken the sensor-bias alternative, load reduction stabilizes margin, and a targeted attitude change produces the predicted sector response; biological and timing evidence remain limited.
    page_refs:
      - p04
      - p05
      - p06
      - p07
      - p17
      - p21
  - id: q02
    type: source-analysis
    speaker: narrator
    prompt: How do the NASA thermal-control principles support the fictional heat-budget model, and what do they not supply?
    answer: They support managing generated and absorbed heat through transport, storage, radiation, surfaces, sensors, insulation, shading, and operations; they do not supply this convoy's units, geometry, limits, crop response, view factors, or safe commands.
    page_refs:
      - p03
      - p04
      - p08
      - p23
      - p27
  - id: q03
    type: compare
    speaker: narrator
    prompt: Compare configuration families A, B, and C in margin, uncertainty, and consequences outside the thermal system.
    answer: A preserves light and access but risks declining margin; B gives the largest modeled thermal gain while consuming maneuver reserve and disrupting cargo, power, and crops; C gains evidence and options through phases but accepts lower yield and widening future uncertainty.
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: Why is the load trial stronger than simply observing the post-docking trend, and why is it still not definitive?
    answer: It deliberately changes a causal input, predeclares signatures and gates, uses comparison zones and independent references, and observes predicted response; it is short, operationally coupled, biologically limited, and leaves geometry uncertainty.
    page_refs:
      - p07
      - p08
      - p14
      - p15
      - p16
      - p17
      - p18
  - id: q05
    type: synthesis
    speaker: narrator
    prompt: How do the results change the simplest versions of Models G, L, and S?
    answer: Load reduction supports L, persistent R2 difference and attitude response support G, and portable agreement weakens S; because no single model explains all evidence, the revision combines load and geometry while retaining measurement uncertainty.
    page_refs:
      - p08
      - p14
      - p16
      - p17
      - p21
  - id: q06
    type: source-analysis
    speaker: narrator
    prompt: Why must the story distinguish measured load, commanded load, model-derived view, and observed temperature?
    answer: "They are produced by different methods and uncertainties: commands do not equal actual heat, view is estimated geometry, and sparse sensors observe selected states; merging them would make assumptions look like independent measurements."
    page_refs:
      - p03
      - p04
      - p08
      - p15
      - p16
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: Why can a fourteen-percent projected yield reduction coexist with a stronger mission plan?
    answer: The projection has an interval and costs, but phased light preserves thermal margin, separates crop batches and failure exposures, and remains within food reserves; the goal shifts from peak output to recoverable food and settlement options.
    page_refs:
      - p02
      - p18
      - p22
      - p24
      - p26
  - id: q08
    type: synthesis
    speaker: narrator
    prompt: How does the thermal problem expose and reshape cargo resilience?
    answer: Docking reveals concentrated access and common dependencies; distribution by function and failure exposure, local inventory copies, alternative access, and an isolation drill improve tested continuity while increasing workload and introducing labeling risk.
    page_refs:
      - p09
      - p19
      - p20
      - p25
      - p26
  - id: q09
    type: research-response
    speaker: narrator
    prompt: Connect the shade decision to the broader thermal model and source limits.
    answer: The shade reduces an absorbed-energy pathway but cannot replace heat rejection or obstruct radiators; borrowed surface behavior informs a bounded model, while deployment, aging, contamination, reflection, failure position, and local measurements govern acceptance.
    page_refs:
      - p03
      - p08
      - p23
      - p26
  - id: q10
    type: research-response
    speaker: narrator
    prompt: A settlement greenhouse has abundant cold radiator view but scarce electrical power and no cargo-access constraint. Which parts of the convoy method transfer, and which priorities or model terms should change?
    answer: System boundaries, heat-path accounting, source separation, uncertainty, gates, reversible tests, and consequence monitoring transfer; power becomes a stronger constraint, cargo coupling weakens, local atmosphere/gravity/geometry require new models, and priorities must be reauthorized.
    page_refs:
      - p03
      - p09
      - p10
      - p20
      - p27
  - id: q11
    type: research-response
    speaker: narrator
    prompt: Apply the redundancy argument to three backup pumps stored in one powered cabinet. What common failures remain, and what evidence would show improved resilience?
    answer: Shared cabinet, power, access, environment, controller, and maintenance can defeat all pumps; separated power/access or functional restoration paths, dependency analysis, and an isolation drill would test resilience rather than merely counting copies.
    page_refs:
      - p19
      - p25
      - p26
      - p27
  - id: q12
    type: research-response
    speaker: narrator
    prompt: Choose the next phase after p26. State your decision rule, strongest supporting evidence, one counterexample, a stop condition, and evidence that would reverse your choice.
    answer: Answers may continue phasing, partially undock, reduce crops, or choose another bounded option, but must respect hard constraints, distinguish observations from model outputs, use uncertainty and cross-system consequences, and name a genuine reversal trigger.
    page_refs:
      - p10
      - p13
      - p18
      - p20
      - p21
      - p22
      - p26
      - p28
  - id: q13
    type: evaluate
    speaker: narrator
    prompt: Why does Seed say acceptable rather than safe forever at the end?
    answer: Evidence covers only declared ranges and horizons; crop development, aging, maneuvers, compound failures, and future configurations remain uncertain, so authorization applies to the next monitored phase rather than every possible state.
    page_refs:
      - p18
      - p23
      - p24
      - p26
      - p28
  - id: q14
    type: research-response
    speaker: narrator
    prompt: Does the crew sacrifice optimization for resilience, or redefine what should be optimized? Defend a position using yield, thermal margin, cargo access, recovery paths, and human authority.
    answer: A defensible answer may emphasize sacrifice, multi-objective redefinition, or both, but must acknowledge measurable costs, bounded improvements, hard constraints, residual uncertainty, and the fact that models do not choose mission values.
    page_refs:
      - p02
      - p10
      - p19
      - p22
      - p25
      - p26
      - p28
