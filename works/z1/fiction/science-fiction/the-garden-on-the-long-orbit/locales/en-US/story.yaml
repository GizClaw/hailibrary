          text: R2 moved when we changed its view, but we changed it by only two degrees. Do not approve a larger turn from this result.
    - id: p22
      illustration: p22
      blocks:
        - id: p22-b01
          speaker: narrator
          text: Crop lighting shifted by variety and growth stage. The median projection placed edible yield fourteen percent below the original peak plan, with a range from nine to twenty-one percent. Stored food could cover the calories.
        - id: p22-b02
          speaker: ivo
          text: Reserves can replace the calories. They cannot replace what people pick from that herb pot.
        - id: p22-b03
          speaker: narrator
          text: Its peppery scent once crossed half the dining corridor. Yuan added fresh-food variety to the next review.
    - id: p23
      illustration: p23
      blocks:
        - id: p23-b01
          speaker: narrator
          text: Aro designed a shade that reduced absorbed energy on the carrier-facing structure without entering the radiator's view or motion path. The shade remained a supplement rather than a replacement for heat rejection.
        - id: p23-b02
          speaker: ivo
          text: A panel stuck halfway open is the position that worries me. It must latch clear when unpowered and retract from inside.
        - id: p23-b03
          speaker: narrator
          text: No crew member would have to leave the hull to rescue it.
    - id: p24
      illustration: p24
      blocks:
        - id: p24-b01
          speaker: narrator
          text: The first phased harvest was smaller than planned, and the leaves remained healthy by the measurements already taken. One harvest could not settle questions about flavor, water recovery, labor, nutrition, or long-term seedling condition.
        - id: p24-b02
          speaker: seed
          text: Every crop batch still shares convoy pressure, core power, navigation, and human maintenance.
        - id: p24-b03
          speaker: yuan
          text: I know. The resilience claim applies only to failures we have actually analyzed.
    - id: p25
      illustration: p25
      blocks:
        - id: p25-b01
          speaker: narrator
          text: Critical cargo was divided among three habitats by function, storage need, access time, and common failure exposure. Each habitat kept a local inventory copy, and paper location cards remained available if the central service failed.
        - id: p25-b02
          speaker: narrator
          text: During an isolation drill, two crews retrieved complete water-loop repair sets. A wrong adapter label delayed the third by twelve minutes.
        - id: p25-b03
          speaker: ivo
          text: The hatch opened. The label sent them to the wrong fitting.
        - id: p25-b04
          speaker: narrator
          text: They replaced the label and kept the delay in the handover record.
    - id: p26
      illustration: p26
      blocks:
        - id: p26-b01
          speaker: seed
          text: Median peak edible yield is fourteen percent lower. Conservative thermal margin stays above nine units over the validated horizon. Essential supplies remain recoverable after the tested single-node isolation.
        - id: p26-b02
          speaker: narrator
          text: Farther ahead, crop development, surface aging, maneuvers, maintenance, and compound failures widened the uncertainty.
        - id: p26-b03
          speaker: narrator
          text: Yuan turned off the green success arrows. Three curves remained, each opening into a broader band at its far end.
    - id: p27
      illustration: p27
      blocks:
        - id: p27-b01
          speaker: narrator
          text: At resupply, the convoy handed over vegetables, viable seedlings, thermal records, configuration histories, failed checks, and every model version that had guided a decision.
        - id: p27-b02
          speaker: aro
          text: Do not carry these numbers into another vehicle. Its shape, load, and maintenance conditions will be different.
        - id: p27-b03
          speaker: narrator
          text: "The method could travel: trace where heat entered and left, make competing explanations face the same evidence, declare stop conditions before changing the system, and keep watching consequences outside the original subsystem."
    - id: p28
      illustration: p28
      blocks:
        - id: p28-b01
          speaker: narrator
          text: The garden docked with the carrier again. Beside R2, the new shade remained locked in its clear position. Yuan recorded the tested configuration, the widening uncertainty, and the conditions for the next measurement.
        - id: p28-b02
          speaker: seed
          text: Next phase acceptable. This judgment covers the current configuration and the tested single-node failures. It does not cover unobserved combinations.
        - id: p28-b03
          speaker: narrator
          text: Outside the window, the blue planet had narrowed to a bright disk. Ivo fastened the last distributed cargo case. One row of garden lamps went dark; another came on farther down the habitat.
