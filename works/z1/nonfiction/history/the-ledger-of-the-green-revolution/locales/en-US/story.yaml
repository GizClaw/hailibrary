questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: "Why were semidwarf wheat and IR8 productive only as parts of managed systems?"
    answer: "Their architecture reduced lodging and responded to nutrients, but realized yields also depended on water, fertilizer, timing, pest management, institutions, and markets."
    page_refs: [p03, p06, p07, p10]
  - id: q02
    type: compare
    speaker: narrator
    prompt: "How did the wheat and IR8 histories resemble and differ from each other?"
    answer: "Both used semidwarf architecture and international research, but they involved different crosses, ecologies, institutions, tests, and adoption paths."
    page_refs: [p03, p04, p07, p09]
  - id: q03
    type: source-analysis
    speaker: narrator
    prompt: "What limitation should a reader attach to IR8's 10.13-tonne experimental result?"
    answer: "It was a managed IRRI trial showing yield potential, not a universal farm average under ordinary water, fertilizer, weather, and management."
    page_refs: [p08]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: "Why does the book reject a seed-only explanation of rising cereal production?"
    answer: "The record shows that irrigation, fertilizer, credit, extension, prices, procurement, transport, storage, and farmer adaptation enabled genetic potential."
    page_refs: [p05, p06, p10]
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: "Why is an exact count of lives saved methodologically difficult?"
    answer: "The no-revolution world is unobserved, and simultaneous changes in war, trade, rainfall, distribution, sanitation, policy, and income affect estimates."
    page_refs: [p11, p12, p13]
  - id: q06
    type: source-analysis
    speaker: narrator
    prompt: "How does Borlaug's own 1970 account complicate a triumph-only narrative?"
    answer: "He celebrated major gains but warned that the label overstated crop coverage, geography, and uniform farmer benefit, while stressing dependence on irrigated areas and supporting inputs."
    page_refs: [p02, p06, p14]
  - id: q07
    type: compare
    speaker: narrator
    prompt: "Why can studies reasonably report different inequality effects?"
    answer: "They may examine different places, periods, assets, groups, and outcomes; income, wealth, land, wages, and consumption need not move together."
    page_refs: [p14, p15, p16, p17]
  - id: q08
    type: synthesis
    speaker: narrator
    prompt: "Trace one second-order pathway from a yield strategy to a water or soil consequence."
    answer: "Reliable irrigation and multiple cropping can raise withdrawals; combined with local aquifers, energy prices, and drainage, that can intensify depletion, waterlogging, salinity, or nutrient loss."
    page_refs: [p18, p19]
  - id: q09
    type: evaluate
    speaker: narrator
    prompt: "Does widespread planting of modern varieties prove that all agricultural diversity disappeared?"
    answer: "No. Some field diversity declined, but breeders created successors and seed banks conserved samples; conclusions differ by names, planted area, genes, and on-farm evolution."
    page_refs: [p21, p22]
  - id: q10
    type: synthesis
    speaker: narrator
    prompt: "Why are higher cereal output and better nutrition related but not identical outcomes?"
    answer: "Staple abundance supports calories and prices, while diet quality also depends on pulses, vegetables, other foods, micronutrients, health, care, and income."
    page_refs: [p11, p23]
  - id: q11
    type: research-response
    speaker: narrator
    prompt: "Design evidence for testing a land-sparing claim in one region."
    answer: "Compare yields, crop area, habitat conversion, prices, policy, demand, and a credible no-yield-growth scenario, then test whether supposedly spared habitat remained protected."
    page_refs: [p24, p26]
  - id: q12
    type: research-response
    speaker: narrator
    prompt: "Using the four-ledger framework, propose one criterion for a future crop program."
    answer: "A defensible criterion must join production with at least one distributional and one ecological measure, identify evidence and affected groups, and state uncertainty and a revision rule."
    page_refs: [p25, p27, p28]
