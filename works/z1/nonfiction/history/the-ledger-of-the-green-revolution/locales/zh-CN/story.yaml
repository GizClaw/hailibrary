questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: "为什么半矮秆小麦和 IR8 只有进入受管理的系统后才能发挥高产潜力？"
    answer: "矮壮株型能减少倒伏并响应养分，但实际产量还取决于水、肥料、农时、病虫管理、制度和市场。"
    page_refs: [p03, p06, p07, p10]
  - id: q02
    type: compare
    speaker: narrator
    prompt: "小麦与 IR8 的历史有哪些相似与不同？"
    answer: "两者都利用半矮秆株型和国际研究网络，却有不同的杂交材料、生态条件、机构、试验和采用路径。"
    page_refs: [p03, p04, p07, p09]
  - id: q03
    type: source-analysis
    speaker: narrator
    prompt: "阅读 IR8 每公顷十点一三吨的纪录时，必须附加什么限制？"
    answer: "它来自管理严格的国际水稻研究所试验，说明产量潜力，不代表普通农田在一般水肥、天气和管理下必然达到。"
    page_refs: [p08]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: "本书为何拒绝用“种子单独造成增产”来解释历史？"
    answer: "记录表明，灌溉、化肥、信贷、推广、价格、收购、运输、仓储和农民调整共同让遗传潜力得以兑现。"
    page_refs: [p05, p06, p10]
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: "为什么很难精确计算绿色革命挽救了多少人？"
    answer: "没有绿色革命的世界无法观察，而战争、贸易、降雨、配给、卫生、政策与收入又在同时变化。"
    page_refs: [p11, p12, p13]
  - id: q06
    type: source-analysis
    speaker: narrator
    prompt: "博洛格一九七〇年的演讲怎样使“纯胜利叙事”变得复杂？"
    answer: "他肯定重大增产，也警告名称夸大了作物范围、地区覆盖和农户普遍受益，并强调灌溉区与配套投入。"
    page_refs: [p02, p06, p14]
  - id: q07
    type: compare
    speaker: narrator
    prompt: "为什么不同研究可能合理地得到不同的不平等结论？"
    answer: "研究地点、时期、资产、群体和指标不同；收入、财富、土地、工资与消费不必同向变化。"
    page_refs: [p14, p15, p16, p17]
  - id: q08
    type: synthesis
    speaker: narrator
    prompt: "说明一条从增产策略通向水或土壤后果的二阶路径。"
    answer: "可靠灌溉和复种会提高取水量，再与当地含水层、能源价格和排水条件结合，可能加剧地下水下降、积水、盐碱化或养分流失。"
    page_refs: [p18, p19]
  - id: q09
    type: evaluate
    speaker: narrator
    prompt: "现代品种广泛种植，是否证明农业多样性全部消失？"
    answer: "不能。一些田间多样性下降，但育种者创造后继品种，种质库保存样本；按名称、面积、基因和农场演化衡量会得出不同结论。"
    page_refs: [p21, p22]
  - id: q10
    type: synthesis
    speaker: narrator
    prompt: "为什么谷物增产与营养改善有关，却不是同一个结果？"
    answer: "主粮充足支持热量与价格稳定；膳食质量还取决于豆类、蔬菜、其他食物、微量营养素、健康照护和收入。"
    page_refs: [p11, p23]
  - id: q11
    type: research-response
    speaker: narrator
    prompt: "请为某一地区的“节省土地”主张设计一套检验办法。"
    answer: "比较单产、作物面积、生境转化、价格、政策、需求和可信的无增产情景，并检验所谓保留生境是否真正受到保护。"
    page_refs: [p24, p26]
  - id: q12
    type: research-response
    speaker: narrator
    prompt: "用“四本账”框架，为未来作物计划提出一项评价标准。"
    answer: "合格标准应把产量同至少一个分配指标和一个生态指标结合，说明证据与受影响群体，并写出不确定性和修正规则。"
    page_refs: [p25, p27, p28]
