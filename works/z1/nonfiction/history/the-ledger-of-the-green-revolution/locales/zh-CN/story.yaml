        - id: p01-b01
          speaker: narrator
          text: "木桌上摊着一本旧账簿，空白纸页旁放着麦粒、稻谷、土块和饭碗。它先留下一个问题：一种作物技术改变粮食系统时，究竟该记哪些账？一九六三年，诺曼·博洛格与 M. S. 斯瓦米纳坦走访印度麦区，察看土壤、拜访农民，为墨西哥矮秆小麦选择试验地点。当时粮食储备紧张，高秆小麦多施肥又容易倒伏。要判断新品种是否可用，不能只看种子，还得看水肥条件、当地试验和农民能否承担一季风险。"
    - id: p02
      illustration: p02
      blocks:
        - id: p02-b01
          speaker: narrator
          text: "研究所围墙之外，拥挤的粮食市场把问题摆得更直白：试验田里的高产，必须变成稳定的粮食供应才有意义。斯瓦米纳坦团队在印度农业研究所先用两公顷土地试种进口矮秆小麦；灌足水、施足肥以后，产量远高于传统品种。不过，一次成功还不足以支持全国推广。材料随后被送往不同麦区，接受抗病性、生理性状、籽粒成分和栽培方式等检验。只有跨过土壤与季节的考验，扩大繁种和进口才站得住脚。"
    - id: p03
      illustration: p03
      blocks:
        - id: p03-b01
          speaker: narrator
          text: "这场印度试验的技术源头，要追到墨西哥。博洛格团队把抗秆锈病能力与矮秆性状结合，重穗遇到风雨或大量施肥时便不那么容易倒伏。矮并不等于天然高产；只有水分和养分足够，植株才可能把更多生长量用于结籽，同时保持直立。育种改变的是株型，至于潜力能否成为收成，还要由农民和农艺人员在田里回答。"
    - id: p04
      illustration: p04
      blocks:
        - id: p04-b01
          speaker: narrator
          text: "在墨西哥，育种材料要往返于气候不同的试验地，一年经历不止一轮种植与选择。这样筛出的株系能适应不同日长，抗秆锈病性状也在连续杂交中与产量性状结合。当时有人认为异地往返违背育种惯例，接连几季的收获才逐渐改变这种看法。博洛格后来成为最醒目的名字，但让计划运转起来的，还有田间工人、墨西哥研究机构、国际基金会、各国科学家与农民。"
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          text: "六十年代中期，连续试验已足以让斯瓦米纳坦等印度科学家支持扩大繁种。进口种子能争取时间，墨西哥的栽培办法却不能原样搬来；播期和施肥量要重新确定，抗病性与食用品质也要在当地检验。与此同时，政府调配外汇，组织运输与仓储，并用信贷、保护价和收购制度托住推广。到了旁遮普，农技人员教的是具体种法；是否采用、如何管理，则由农民在自己的田里作决定。"
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: "旁遮普农民拿到矮秆种子以后，先得保证田里按时有水，还要备好化肥、安排农忙用工、申请贷款，并找到愿意收粮的买家。少了其中一环，换种也可能失败，所以农技人员必须把栽培办法一同带到田间。博洛格在一九七〇年的诺贝尔演讲中肯定增产，却也说明成果主要集中在有灌溉条件的地区，并依赖机器、信贷、价格和公共推广。他还警告，“绿色革命”这个名称容易遮住作物范围、地区覆盖和受益分配上的差别。"
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          text: "水稻育种走的是另一条路。国际水稻研究所将高秆的印度尼西亚品种 Peta 与来自中国台湾地区的矮秆品种低脚乌尖杂交，再从连续世代中筛出后来命名为 IR8 的株系。它矮而结实，增施氮肥后也不像许多高秆热带稻那样容易倒伏。小麦与水稻共享半矮秆这一思路，却使用不同材料，面对不同生态环境，也由不同机构完成试验与推广。"
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: "经过多国试验，IR8 于一九六六年发布。旱季试验受到严格管理，若干地块的产量超过每公顷九吨，国际水稻研究所还有一次十点一三吨的记录。这个数字测到的是品种在特定条件下的潜力，并非普通农田的平均水平。试验人员能够控制水肥和农时，还能持续观察田况。账上既应记下产量上限被大幅推高，也应注明这个上限是在什么条件下出现的。"
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: "IR8 通过繁种、示范田和农技推广来到农民面前，筛选却没有就此结束。农户关心成熟早晚，也要比较口味、病害、稻草用途、用工成本、售价与风险；育种者则陆续推出改良品种。采用过程有快有慢，选择也会改变。把 IR8 简化成“奇迹稻”，便看不见田间判断和后续修正。它真正留下的，一是得到验证的株型，二是一套能够持续育种的研究体系。"
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          text: "七十年代初，亚洲若干人口大国的谷物产量已经明显上升。然而，从研究所试验到旁遮普收获，任何一步都不只由遗传改良推动。水肥供应、病虫管理和播收时机决定田里的表现，农技知识、道路、市场与政策又决定这种表现能否扩大。抽走其中一个环节，结果就可能变样。所谓绿色革命，更像一套由研究者、政府、农技人员和农民共同搭建的技术与制度系统，而不是一粒自动生效的种子。"
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: "收获进入粮仓，影响便越过田界。国家粮食供应增加，主粮价格可能下降或少涨；即使没有土地，主要从市场买粮的人也可能得到实惠。更多粮食还会带动运输、碾磨和贸易，并创造一部分乡村工作。后来的研究据此把绿色革命与饥饿、贫困的缓解联系起来。不过，这些相互交织的路径，并不能直接换算成某一项发明究竟“挽救了多少人”。"
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          content:
            - text: "“避免了饥荒”是一种特殊的历史判断：它要求我们把真实世界同一个从未发生的世界作比较。这个缺席的比较对象叫作"
            - vocabulary: {id: counterfactual, text: 反事实}
            - text: "。有人比较各地采用新品种的先后，有人模拟没有改良品种时的粮食供给，也有人借作物适宜度追踪长期差异。方法不同，倚赖的假设也不同；同一时期，战争、贸易、降雨、公共配给、卫生条件与收入都在变化。因此，证据可以支持“贡献重大”，却无法提供一个直接观察到的获救人数。"
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: "研究结论之所以不同，往往是因为问题本来就不同。新增了多少粮食、少开垦了多少土地、农业生产率是否影响贫困或儿童死亡率，并不是同一项测量。研究年代、地区和对照组一换，所得数字自然会变。统计控制无法补回全部缺失事实，回溯模型又取决于研究者选用的参数。面对分歧，先别急着判定谁对谁错；应先弄清各自测量什么、覆盖何时何地，又假定了怎样的对照世界。"
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: "把国家总产量曲线放大到地区，另一幅图景会出现。早期增产多集中在灌区，因为道路、电力、农技服务和市场能够承接整套方案。雨养农业区与生态脆弱地带采用得更晚，拿到的品种和措施也未必合适。于是，总体短缺得到缓解时，运河灌区和干旱高地的差距仍可能加深。一个国家层面的成功，并不保证每个地区同步受益；评价随着观察尺度而变。"
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: "采用新品种之前，农户需要的条件并不相等。土地较多的人往往自有水井和机器，也较容易用资产作抵押取得贷款，并更早接触农技信息。随着种子普及、灌溉范围扩大和价格变化，小农也可能通过增产或受雇获得收益；另一些人却因贷款而负债，承受不起一次歉收。印度村庄研究没有给出统一的不平等结论，原因正在于收入、财富、土地、工资与消费可能各走各的方向。"
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: "复种次数增加、收获量变大以后，播种和除草需要更多人手，收割、运输与加工环节的用工也可能增加。机器进入农田，有时减轻重体力劳动，有时取代岗位，还可能改变雇主与劳动者谈工资的力量。农忙季多干几周，并不等于全年收入稳定。因此，劳动这本账不能只写就业总数；新增了什么工作、哪些工序消失、工资怎样变化、谁操作机器，都要分开核算。"
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: "田间和收获后的许多工作由妇女承担：插秧、除草、选种、晾晒和整理谷物，都可能落在她们身上。可是，土地证常不在她们名下，贷款与农技培训也更难获得，机器通常由男性控制。各地分工不同，这些差距也早于绿色革命存在；新技术却可能沿着既有的土地和财产权继续分配机会。家庭总产量上升以后，仍需追问劳动由谁承担、收入归谁支配、生产决定又由谁作出。"
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: "粮食增产并不自动等于每生产一单位粮食就要多用水；水分生产率会随作物、管理、环境和核算尺度而变。与此同时，整套方案推动了稳定灌溉、频繁复种和需水较多的生产。运河与水泵降低了降雨不稳带来的风险，却让取水量和用水竞争上升。地下水最终如何变化，还要看含水层、能源价格、排水条件与管理制度。把下降全怪给种子过于简单，把整套方案带来的新增需求排除在外，同样站不住脚。"
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: "肥料是许多增产方案的重要条件，但配比失当或施用过量可能损害水质和土壤。灌溉带来另一组风险：灌水过多、排水不畅会造成积水，还可能让盐分在根区聚集。不过，具体后果取决于土壤与管理。一块田表面泛起白色盐霜，是启动调查的线索，不足以替整个绿色革命作诊断。长期土壤记录必须回到当地解读。"
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: "大片农田连续种植遗传背景相近的品种，病虫害面临的环境也会改变。农药能保护收成，但同一种作用机制反复施用，会让更耐受的害虫留下后代；药剂选择、用量、防护装备或施用时机不当，又会带来健康和生态风险。田间控制因而不能一劳永逸。农民与农技人员要持续监测并调整防治方法，育种者也须把抗性加入后继品种。每次干预，都会改变下一次决策所面对的种群。"
    - id: p21
      illustration: p21
      blocks:
        - id: p21-b01
          speaker: narrator
          text: "绿色革命之前，农民保存的地方品种各有所长：有的口味好，有的成熟早，有的秸秆适合其他用途，还有的能忍受特定逆境。现代品种大面积种植后，部分田间多样性随之减少；与此同时，育种者推出许多后继品种，种质库也收入旧材料。用名称、种植面积或遗传差异来计算，得到的变化幅度不会相同。多样性既承载地方知识，也保存未来育种可能需要的性状，并非只供怀旧。"
    - id: p22
      illustration: p22
      blocks:
        - id: p22-b01
          speaker: narrator
          text: "把种子与资料收入种质库，可以避免材料在短期内彻底消失，却不能让它继续适应农田中的害虫、气候和饮食偏好。农民年复一年在田里留种，品种仍会受到现实环境的选择。前一种办法便于长期保存和调用，后一种办法让品种在农田中继续演化，两者无法互相替代。绿色革命一面证明全球种质资源对育种至关重要，一面又使某些地区实际种植的品种趋于集中；这两面必须写进同一段历史。"
    - id: p23
      illustration: p23
      blocks:
        - id: p23-b01
          speaker: narrator
          text: "饭碗装得更满，首先说明主粮与热量供应有所改善，却不能单独证明营养更好。豆类和蔬菜是否充足，能否获得适量动物性食物，微量营养素、健康照护与家庭收入怎样，都会影响膳食质量。有些地区把更多耕地和政策支持投向小麦、水稻，豆类生产相对落后。谷物增产不应为所有饮食问题负责，但粮食吨数也不能代替营养指标。"
    - id: p24
      illustration: p24
      blocks:
        - id: p24-b01
          speaker: narrator
          text: "单产提高以后，耕地会不会真的少扩张？跨国资料没有给出同一个答案：一些地方在集约化后稳住甚至缩小了耕地，另一些地方仍继续开垦。原因不只在农田里。粮食变便宜可能扩大需求，新修道路降低运输成本，补贴或出口机会也会吸引更多生产。即便模型算出“省下”一片土地，那里若未获得保护，生境仍可能消失。只有需求等其他条件大体不变时，高产才可能减轻开垦压力；土地节约必须用实际变化检验。"
    - id: p25
      illustration: p25
      blocks:
        - id: p25-b01
          speaker: narrator
          text: "开头那本空账簿，如今应当展开成四本账。生产账记录小麦和水稻多收了多少；民生账查看粮价、收入、工资，以及不同人获得机会的差别。生态账追踪水、土壤、病虫害、排放与生境；多样性账则保存品种、基因、膳食和地方知识的变化。四本账各问一件事，采用的尺度与证据也不相同。一本账上的收益，既不能抵消另一本账的代价，也不能替它作答。"
    - id: p26
      illustration: p26
      blocks:
        - id: p26-b01
          speaker: narrator
          text: "四本账需要不同材料来填写。试验报告与国家统计能显示规模，却可能漏掉家庭内部分配；家庭调查、价格记录和口述史贴近生活，抽样与记忆又各有限制。土地资料、土壤和水的测量、种质收藏回答的则是另外一些问题。试验小区常高估普通农田可以达到的产量，模型也观察不到它设想的另一个世界。所谓交叉核对，不是把记录强行合成一个数字，而是查明它们在哪里互相支持，在哪里冲突，以及为什么。"
    - id: p27
      illustration: p27
      blocks:
        - id: p27-b01
          speaker: narrator
          text: "今天的育种者仍在使用半矮秆株型，也继承了跨国研究网络；摆在试验田前的问题却已改变。高温、缺水、土壤压力、病虫变化、营养需求和减排目标需要同时考虑。精准灌溉可以与多样化轮作配合，农民参与选育也能与改良作物互相补充。新试验若只问亩产增加多少，便会重演旧账的缺页；谁用得起、资源怎样消耗、生态代价出现后如何调整，都应在设计之初成为评价指标。"
    - id: p28
      illustration: p28
      blocks:
        - id: p28-b01
          speaker: narrator
          text: "回到木桌前，那本账簿仍然不能合上。绿色革命确实缓解了严重粮食短缺，重塑了谷物生产；这份成就来自公共机构、研究者、农技人员和数百万农民。它的代价则在不同水土条件与不平等结构中逐渐显现，无法用一个总产量冲销。下一条记录不应只写一块田收了多少粮食，还要注明粮食为谁生产、用了哪些资源、判断含有多少不确定性，以及新后果出现时怎样修正方案。"
