schema_version: 1
required: true
sources:
  - url: https://www.cimmyt.org/about/our-history/
    publisher: International Maize and Wheat Improvement Center (CIMMYT)
    claims: [The Mexico program developed higher-yielding disease-resistant wheat under Norman Borlaug; Mexico reached wheat self-sufficiency in the 1950s; related varieties helped India and Pakistan raise harvests in the 1960s and 1970s.]
  - url: https://www.nobelprize.org/prizes/peace/1970/borlaug/lecture/
    publisher: Nobel Prize Outreach
    claims: [Borlaug described rapid wheat and rice gains as concentrated in irrigated areas and dependent on seed, fertilizer, water, credit, prices, machinery, research, and policy; he explicitly warned that the phrase Green Revolution could imply wider and more uniform benefits than the evidence showed.]
  - url: https://ricetoday.irri.org/changing-the-world-with-seeds-the-breeding-history-of-ir8/
    publisher: International Rice Research Institute (IRRI)
    claims: [IR8 came from a Peta and Dee-geo-woo-gen cross, was selected through successive generations, and was officially released in 1966 after multi-country trials.]
  - url: https://ricetoday.irri.org/in-retrospect-irri-annual-report-1966/
    publisher: International Rice Research Institute (IRRI)
    claims: [IR8 experimental dry-season yields exceeded nine tonnes per hectare in several trials and reached 10.13 tonnes per hectare at IRRI; results depended on irrigation, fertilizer, season, and experimental management and were not ordinary farm averages.]
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3411969/
    publisher: Proceedings of the National Academy of Sciences
    claims: [A scholarly synthesis attributes large production and poverty benefits to Green Revolution technologies while emphasizing slower diffusion in rainfed regions, regional inequality, environmental costs, and the difficulty of isolating technology from policy and infrastructure; it also reports model-based estimates of food production, prices, calorie availability, and cultivated land without crop-germplasm improvement.]
  - url: https://www.nber.org/papers/w24744
    publisher: National Bureau of Economic Research
    claims: [Two Blades of Grass identifies effects using differences in the timing and diffusion of high-yielding varieties across crops and countries together with spatial variation in agroclimatic suitability; it links adoption to crop yields, income, structural transformation, fertility, and mortality.]
  - url: https://onlinelibrary.wiley.com/doi/10.18278/wfp.1.1.6
    publisher: World Food Policy
    claims: [Agricultural Productivity and Child Mortality conducts two counterfactual simulations for 1970-2000, one holding 1970 crop genetic improvements constant and another assuming the international agricultural research-center system had not been built; it estimates effects on crop productivity and child mortality.]
  - url: https://onlinelibrary.wiley.com/doi/10.1111/agec.12734
    publisher: Agricultural Economics
    claims: [A historical synthesis links Asian agricultural transformation to reduced hunger and poverty but also identifies nutrition, resource, and regional consequences; causal interpretation must account for simultaneous structural change.]
  - url: https://www.fao.org/4/ac483e/ac483e03.htm
    publisher: Food and Agriculture Organization of the United Nations
    claims: [The Asia-Pacific Green Revolution joined improved seed with irrigation, fertilizer, policy, and institutions; intensification was accompanied by degradation of land, water, biodiversity, and other environmental features and often bypassed marginal rainfed areas.]
  - url: https://documents1.worldbank.org/curated/en/736171468768278797/pdf/multi0page.pdf
    publisher: World Bank
    claims: [Village evidence does not support one universal inequality result; expanded irrigation could equalize income access while wealth distributions could still widen, depending on place, asset ownership, and the outcome measured.]
  - url: https://www.fao.org/plant-treaty/areas-of-work/conservation-and-sustainable-use/
    publisher: Food and Agriculture Organization of the United Nations
    claims: [Crop genetic diversity is important for resilience and future breeding; conservation requires both on-farm and ex situ approaches.]
  - url: https://www.fao.org/3/i1688e/i1688e.pdf
    publisher: Food and Agriculture Organization of the United Nations
    claims: [Agricultural production depends heavily on freshwater withdrawals, and irrigation efficiency and water governance shape environmental outcomes.]
  - url: https://www.fao.org/4/y4525e/y4525e06.htm
    publisher: Food and Agriculture Organization of the United Nations
    claims: [Agricultural water productivity measures product, including grain, per unit of water; reported values vary widely with environment, crop management, measurement scale, and the choice of water denominator, so greater output does not by itself establish greater water use per unit of grain.]
  - url: https://www.fao.org/4/w4347e/w4347e10.htm
    publisher: Food and Agriculture Organization of the United Nations
    claims: [FAO identifies waterlogging and salinization as common surface-irrigation problems; waterlogging arises primarily from inadequate drainage and over-irrigation, can concentrate salts in the root zone, and may be reduced through adequate drainage and more precise water application.]
  - url: https://www.who.int/news-room/fact-sheets/detail/pesticide-residues-in-food
    publisher: World Health Organization
    claims: [Pesticides can protect yields but are potentially toxic; risks depend on substance, dose, and exposure route, and workers applying them require appropriate protection.]
  - url: https://www.fao.org/family-farming/detail/en/c/1714672/
    publisher: Food and Agriculture Organization of the United Nations
    claims: [Women in agrifood systems can face added constraints in finance because land ownership, collateral, and property titles are unequally distributed; household-level output does not establish equal control of benefits.]
  - url: https://repository.cimmyt.org/server/api/core/bitstreams/67599e42-50b7-40f8-8f7f-6ecfc2df6379/content
    publisher: International Maize and Wheat Improvement Center (CIMMYT)
    claims: [Historical accounts of Borlaug's wheat program describe shuttle breeding, repeated selection, and the combination of stem-rust resistance with broad adaptation.]
  - url: https://www.presidentofindia.gov.in/dr-apj-abdul-kalam/speeches/address-presentation-first-dr-ms-swaminathan-award
    publisher: President of India
    claims: [In March 1963 Borlaug and M. S. Swaminathan inspected Indian soils and proposed experimental sites with farmers; a two-hectare dwarf-wheat trial responded to fertilizer and irrigation, after which testing continued across locations and conditions.]
  - url: https://ejournals.ncert.gov.in/index.php/SS/article/view/5277
    publisher: National Council of Educational Research and Training
    claims: [Swaminathan's account documents coordinated testing of Mexican dwarf wheats across Indian wheat-growing states in 1963-64 and 1964-65, including physiological, pathological, chemical, and agronomic evaluation at IARI.]
  - url: https://d2pw3korzs7tbl.cloudfront.net/media/1724151500_Agricultur7%20%28E%29.pdf
    publisher: Government of Punjab, India
    claims: [Punjab Agricultural University trained extension workers and farmers in new cultivation practices; farmers' work and research-extension links helped turn experimental varieties into regional production.]
  - url: https://www.fao.org/4/x0249e/x0249e02.htm
    publisher: Food and Agriculture Organization of the United Nations
    claims: [Women perform substantial and location-specific agricultural and post-harvest labor, while barriers involving land tenure, tools, credit, mobility, education, and extension contact can limit their control over technology and benefits; mechanization can reduce drudgery or remove paid work depending on context.]
  - url: https://www.fao.org/pest-and-pesticide-management/ipm/integrated-pest-management/en/
    publisher: Food and Agriculture Organization of the United Nations
    claims: [Integrated pest management combines available control methods while minimizing pesticide risks; pest control must be monitored and revised rather than treated as a permanent one-input solution. Repeated pesticide use can select resistant pest populations.]
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5877987/
    publisher: Proceedings of the National Academy of Sciences
    claims: [Cross-country evidence includes both intensification with stable or falling cropped area and intensification with expansion; higher yields do not guarantee land sparing because demand may respond and nominally spared land may not remain conserved.]
notes: The work treats the Green Revolution as a bundle of crop genetics, water, fertilizer, credit, extension, procurement, and policy rather than a seed-only event. Statements about famine averted are presented as counterfactual judgments supported by several methods, not as directly observed totals. Environmental and distributional outcomes are explicitly scoped by place, period, crop, and method.
