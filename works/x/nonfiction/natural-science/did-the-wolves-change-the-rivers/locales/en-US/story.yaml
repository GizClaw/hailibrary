writer: inkstone-observer
title: Did the Wolves Change the Rivers?
summary: A famous Yellowstone story links restored wolves to elk, trees, beavers, and rivers. Competing studies reveal where that chain is supported, where methods change its strength, and why a more qualified answer is also more accurate.
