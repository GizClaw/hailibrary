questions:
- id: q01
  type: source-analysis
  speaker: narrator
  prompt: 开头的画面顺序为什么会让级联显得比证据更确定？
  answer: 画面把狼、马鹿、植物、河狸和河流顺次相连，却还没有分别检验每条因果连线。
  page_refs:
  - p01
  - p04
- id: q02
  type: evidence
  speaker: narrator
  prompt: 黄石为什么适合研究，却不是一次受控的“重新启动”？
  answer: 狼回归的时间明确并受到监测，但狩猎、气候、其他捕食者、野牛和水文也同时变化。
  page_refs:
  - p03
  - p05
- id: q03
  type: compare
  speaker: narrator
  prompt: 数量路线与行为路线有什么不同？
  answer: 数量路线依靠马鹿减少来降低总啃食量；行为路线依靠捕食风险改变马鹿进食的地点和时长。
  page_refs:
  - p06
- id: q04
  type: evaluate
  speaker: narrator
  prompt: 为什么成对照片只能支持较窄的结论？
  answer: 照片能记录所选地点的变化，但取景和选点不能证明这些地点代表整个公园。
  page_refs:
  - p08
- id: q05
  type: evidence
  speaker: narrator
  prompt: 随机抽样的山杨研究得出了什么结果？
  answer: 它仍发现较弱的级联信号，同时发现只选最高幼株会把恢复幅度放大四到七倍。
  page_refs:
  - p09
- id: q06
  type: source-analysis
  speaker: narrator
  prompt: 2025年的柳树论文与后来的评论为何对级联强度判断不同？
  answer: 双方对树冠体积模型、样地能否匹配、效应指标、照片选择和因果归因存在分歧。
  page_refs:
  - p10
  - p11
- id: q07
  type: synthesis
  speaker: narrator
  prompt: 围栏与人工坝实验怎样修改了简单的自上而下模型？
  answer: 实验表明啃食压力和地下水位共同影响柳树，捕食者回归后，水文条件仍可能限制恢复。
  page_refs:
  - p12
  - p13
- id: q08
  type: short-answer
  speaker: narrator
  prompt: 河狸为什么既可能是恢复结果，也可能是恢复机制？
  answer: 高大柳树支持河狸，而河狸坝抬高水位，又能帮助更多柳树生长。
  page_refs:
  - p14
- id: q09
  type: evaluate
  speaker: narrator
  prompt: 2006年的加拉廷河研究能否证明重新引狼改变了黄石河流？为什么？
  answer: 不能。它重建的是狼消失后若干河段的变化，并未测量重新引狼后的全园反向改变。
  page_refs:
  - p15
  - p16
- id: q10
  type: compare
  speaker: narrator
  prompt: 空间尺度与时间窗口分别怎样改变解释？
  answer: 空间尺度决定结果代表哪些物种和地点；时间窗口决定趋势中哪些阶段、延迟和反复会被看见。
  page_refs:
  - p17
  - p18
- id: q11
  type: research-response
  speaker: narrator
  prompt: 设计一项能加强“狼影响某条小溪”结论的研究。
  answer: 合理方案应先说明小溪与机制，反复进行有代表性的测量，同时记录捕食者、食草动物、植物、河狸、洪水和地下水，并长期比较其他解释。
  page_refs:
  - p12
  - p13
  - p14
  - p16
  - p23
- id: q12
  type: synthesis
  speaker: narrator
  prompt: 本书对题目最有依据的回答是什么？
  answer: 狼很可能通过作用网络为部分河岸变化作出贡献，但证据不足以证明狼单独造成黄石全园河流的普遍改变。
  page_refs:
  - p21
  - p22
  - p24
article:
  pages:
  - id: p01
    illustration: p01
    paragraphs:
    - text: 雪地里，一只狼走近鹿群；接着，马鹿离开河边，柳树长高，河狸筑坝，河道也变得稳定。把这些画面连在一起，“狼改变河流”的故事便像一串自然落下的多米诺骨牌。那部广为传播的短片正是这样讲述黄石公园：捕食者回归，生态系统随之修复。然而，先后出现的画面并不能自动组成因果证据。要回答题目中的问题，我们得把顺滑的故事拆开，逐段核对每个箭头，也要问清来源究竟观察了什么。
  - id: p02
    illustration: p02
    paragraphs:
    - text: "“改变”这个词很有力量，却藏住了尺度。它可以指狼间接帮助某片河边的柳树生长，也可以指河狸改变一条小溪的蓄水；还可能被听成整个黄石公园的主要河流都因狼而改道。三种说法需要的证据完全不同。许多重要研究只涉及北部草原、某个流域或若干样地。因此，本书不把流行说法当作一个整体来接受或推翻，而是把它画成因果图：狼、马鹿、木本植物、河狸和河道之间，每条连线都要单独接受检验。"
  - id: p03
    illustration: p03
    paragraphs:
    - text: 历史起点相当明确。二十世纪初，狼在黄石公园内被消灭。1995年1月，管理人员从加拿大引入十四只狼，让它们先在围栏中适应；1996年又引入十七只。狼的回归恢复了大型食肉动物群落中一个曾经缺失的环节，当时美洲狮和熊也在增加。如此清楚的时间点很适合长期研究，却不能把公园变成重新启动的实验室。同一时期，狩猎政策、旱情、严冬、野牛数量和其他捕食者也在变化。只看“之前”和“之后”，能确认变化发生过，不能把全部变化都归给狼。
  - id: p04
    illustration: p04
    paragraphs:
    - content:
      - text: 研究者提出的核心机制叫
      - vocabulary:
          id: trophic-cascade
          text: 营养级联
      - text: "：食物网高层发生变化，影响沿着取食关系间接传到低层。狼可能捕食马鹿，帮助降低其数量；捕食风险也可能改变马鹿停留和进食的地点。啃食压力减轻后，柳树、山杨和杨树幼株可能长高，为河狸提供食物与筑坝材料；河狸坝又可能抬高地下水位，影响小河道。这个模型由多段机制组成，不是一件不可分割的事实。前一段证据充分，并不能替后一段自动作证。"
  - id: p05
    illustration: p05
    paragraphs:
    - text: 狼回归后，黄石北部马鹿数量下降，这是明确的记录；狼也逐渐成为重要死亡来源。不过，美国国家公园管理局提醒读者，最初十年里，人类狩猎与气候是马鹿下降的主要驱动因素。严冬会影响存活，熊和美洲狮也捕食马鹿，迁出公园的鹿还会进入不同管理区域。后来，狼和完整的食肉动物群落发挥了更大的调节作用。说“狼回来后马鹿减少”是在描述顺序；说“马鹿种群完全是被狼压缩的”则删掉了必须估计的其他力量。
  - id: p06
    illustration: p06
    paragraphs:
    - text: 从马鹿到植物，至少有两条路线。第一条依靠数量：马鹿少了，总啃食量可能下降。第二条依靠行为：即使马鹿数量没有立刻大变，它们也可能因风险而少去某些地方进食。后一条被概括成很有画面的“恐惧景观”，仿佛河谷一危险，柳树就得到喘息。马鹿确实会躲避捕食者，但反应还受时段、地形、群体大小和眼前风险影响。2010年的大尺度研究没有发现狼的空间风险足以解释山杨更新。恐惧能改变一只鹿的选择，却未必安排整片森林。
  - id: p07
    illustration: p07
    paragraphs:
    - text: 支持强级联的研究也发现了重要现象。2012年的综合研究报告说，从1998年到2010年，样地中最高的幼小山杨受到啃食的比例明显下降，更多幼小山杨植株的主梢长过常见的取食高度。另一些地点出现了更高的柳树或新的杨树幼株。这些变化符合一个预测：马鹿压力减轻后，木本植物有机会恢复。跨越十多年的观察尤其珍贵，因为树木反应很慢。不过，不同研究选择的植物、地点和样本并不相同。现象与模型相符，只是论证的起点；排除其他解释后，因果判断才会更强。
  - id: p08
    illustration: p08
    paragraphs:
    - text: 成对照片会让这种证据格外有冲击力：旧照片里，柳树低矮稀疏；新照片里，同一片河边枝叶浓密。照片能保存真实变化，但镜头总有边界。拍摄者选定地点、方向、季节和时刻，一幅图能证明某处变了，却不能说明它是否代表全部区域。连续测量固定植株比照片更精确，仍要说明如何选样。传播材料常把最强烈的对照放在前面，读者先看到“恢复”，很久以后才遇到“这个地点有多典型”的问题。
  - id: p09
    illustration: p09
    paragraphs:
    - content:
      - text: 2022年，一项研究专门检验了山杨调查的选样方法。早期一些调查会在每个林分里测量最高的五株幼树，因为它们能显示是否已有树逃过马鹿啃食。随机抽样问的是另一个问题：整个林分和全部幼株大体如何？比较结果显示，两种方法都发现了级联信号，但只挑最高植株，会把恢复幅度放大四到七倍。这就是
      - vocabulary:
          id: sampling-bias
          text: 抽样偏差
      - text: "：样本的选取方式持续偏向某类对象，使结果不能代表总体。它削弱的是“级联很强”的结论，不等于否认所有恢复。"
  - id: p10
    illustration: p10
    paragraphs:
    - text: 到了2025年，争论再次集中在“有多强”。一组研究者使用北部二十五个河边样地从2001年到2020年的柳树高度记录，再用高度估算树冠体积，也就是枝、叶和茎占据的三维空间。模型给出的平均树冠体积增幅约为百分之一千五百，因此论文把它归为较强的营养级联。这个数字针对的是北部已建立的柳树样地，不是全园所有植物，更不是河道本身。若标题省去“估算”“二十五处”和“2001年至2020年”，植物指标很容易被听成整个生态系统的直接测量。
  - id: p11
    illustration: p11
    paragraphs:
    - text: 同年发表的同行评议评论反对这个强度算法。评论者认为，树冠体积主要由原有的高度数据推算，结果在很大程度上重新表达了“树变高”。不同年份还比较了并不完全匹配的样地，并把适用于平衡状态的指标用于持续变化的系统。他们也质疑照片选择和因果归因。双方并非在争论“柳树有没有长”，而是在争论同一批数据能否证明“世界上最强的一类级联”。这提醒我们：数字很大，不代表解释范围也能无限扩大。
  - id: p12
    illustration: p12
    paragraphs:
    - text: 另一组研究没有只看时间线，而是直接操纵两种条件。2001年起，研究者在河边设置不同样地：有的用围栏挡住大型食草动物，有的用人工坝抬高水位，有的同时采用两种处理。十九年后，减少啃食与提高地下水位都促进了柳树生长；两者合用的效果最明显。某些只有围栏或只有坝的地点反应较弱，而且样地之间差异很大。实验没有证明狼无关，而是说明：即使啃食减少，若河床已经下切、地下水仍然过低，柳树也未必迅速恢复。
  - id: p13
    illustration: p13
    paragraphs:
    - content:
      - text: 这些实验发生在
      - vocabulary:
          id: riparian-zone
          text: 河岸带
      - text: "，也就是紧邻河流、既影响水又受水影响的陆地区域。柳树根系需要合适的水分，地上枝条又会遭到马鹿和野牛啃食。河床向下切深后，附近地下水可能随之降低，根系更难接近稳定水源。围栏改变“谁来吃”，人工坝改变“植物在哪里生长”。两个处理揭示了直线模型容易忽略的限制：捕食者能从上往下改变取食压力，土壤、水位和河道形态也会从下往上限制植物。"
  - id: p14
    illustration: p14
    paragraphs:
    - text: 河狸又把单向箭头变成了循环。高大的柳树为河狸提供食物和筑坝材料；河狸坝抬高水位、扩展湿地，又帮助更多柳树生长。如果长期啃食和河道下切同时带走高柳与旧坝，即使马鹿压力下降，系统也可能停留在另一种状态。河狸因此不只是级联末端得到的“奖励”，还可能是恢复过程缺少的工程力量。把柳树、河狸、河流排成三个先后画面，讲述很顺；实验显示，它们更像彼此推动、也彼此限制的反馈环。
  - id: p15
    illustration: p15
    paragraphs:
    - text: 那么，“河流改变”最直接的依据是什么？2006年的一项研究重建了狼消失以后，加拉廷河若干河段的长期变化。历史照片、植被迹象和河道测量支持这样的解释：持续啃食削弱河边柳树，洪泛区功能随之下降，部分河道变宽或不稳定。它讨论的是二十世纪狼被消灭之后的损害，并提出捕食者缺失到河道变化的级联。它没有在1995年前后测量黄石所有河流，也没有证明狼回归后这些河流按相反方向恢复。关于“失去狼”的证据能支持恢复假设，却不能替代“重新引狼”的反向实测。
  - id: p16
    illustration: p16
    paragraphs:
    - text: 河道还受洪水、泥沙、坡度、倒木、岸坡材料、植物和河狸活动共同影响。1996年与1997年的大洪水恰好接近狼回归时间，使时间顺序更难解释。某条河道移动时，研究者需要判断植被、洪峰、河狸坝或多种力量各占多大作用。在一些小溪旁，植物恢复和河狸活动确实可能稳固岸坡、增加蓄水。但“小溪”“某段洪泛区”和“主要河流”不是同一尺度。若只说“河流改变了”，听众很难知道研究真正测到哪里。
  - id: p17
    illustration: p17
    paragraphs:
    - text: 地点不同，看似冲突的结果可以同时成立。二十五个湿润样地里的柳树可能明显长高，而更广范围内随机选择的山杨林分只显示较弱恢复。柳树与山杨的生长条件不同，各地地下水也不同。黄石北部不等于整个公园，一条支流也不能代表北部全部河谷。每当摘要把“某些河岸柳树”写成“黄石植被”，结论就悄悄扩大了一次。阅读生态研究时，物种、地点和抽样范围不是脚注，而是结论的一部分，必须跟着结果一起转述。
  - id: p18
    illustration: p18
    paragraphs:
    - text: 起止年份也能改变故事。以2001年为开端，会略去狼回归后的前六年；以2020年为终点，能等到慢慢长高的植物，却可能还看不到之后野牛增多带来的啃食。只选择相隔很远的两张照片，会突出净变化，把中间的停顿、反复和局部退化压平。长期研究的重要性，正在于生态系统不会平滑走向一个终点。“狼回来了，于是植物恢复”只用一个连接词，就压缩了捕食者、猎物、气候、水位与测量方法二十多年的变化。
  - id: p19
    illustration: p19
    paragraphs:
    - text: 来源的立场、用途和受众，会影响作者如何取舍材料。面向公众、倡导再野化的演讲需要展示生态修复的可能，因此往往选择一条主角明确、结局可见的因果链。公园介绍既要讲公共历史，也要承认研究仍在继续。论文把结论收窄到物种、样地、变量和年份；方法评论则专门寻找抽样与模型的弱点。不同目的不会自动决定谁诚实、谁有偏见。它们会影响哪些细节获得篇幅、哪些不确定性先被说出，以及作者希望读者拿证据去做什么。
  - id: p20
    illustration: p20
    paragraphs:
    - content:
      - text: 文章结构本身也有说服力。流行版本沿食物网一路向下，再向外扩展到地貌：狼、马鹿、植物、河狸、河流。前一段一旦顺利，下一段便借到它的气势，最后形成完整的修复结局。科学论文却常被方法打断：围栏、地下水井、随机样本、无法匹配的样地，都要求读者停下来检查箭头。这样的停顿不够精彩，却正是
      - vocabulary:
          id: causal-inference
          text: 因果推断
      - text: 发生的地方：研究者借助证据判断一个因素是否造成变化，而不只是在变化之前出现。
  - id: p21
    illustration: p21
    paragraphs:
    - text: 审慎阅读也要防止把神话简单倒过来。流行说法有缺口，不等于狼的回归毫无作用。狼捕食马鹿，为食腐动物留下食物，也会与其他捕食者相互影响，使曾被简化的食物网重新增加一条重要关系。随机抽样的山杨研究依然测到了较弱的级联信号。国家公园的总结同样认为，狼对马鹿和部分植被的影响真实存在，只是与其他力量交织。否定“唯一原因”，不等于否定“有所贡献”；另一种可辩护的解释，是强度随地点和年份变化的作用网络。
  - id: p22
    illustration: p22
    paragraphs:
    - text: 现在可以有限定地回答题目。狼很可能通过影响马鹿，并作为完整食肉动物群落的一员，为某些河边植物恢复创造了条件。高大植物和河狸又能影响岸坡、水位与小河道。不过，现有证据不足以证明少量被引入的狼单独造成了全园河流的普遍改变。水文、洪水、气候、狩猎、熊和美洲狮、野牛、河狸以及过去遗留的河道损伤，都进入同一解释。结论没有流行标题那样整齐，却与研究真正覆盖的边界一致。
  - id: p23
    illustration: p23
    paragraphs:
    - text: 这个回答反复使用“某些地点”“黄石北部”“有所贡献”“可能”等限定词，听来不够果断。其实，它们保存了证据的形状。删掉限定，局部测量便变成普遍事件；保留限定，读者才看见研究如何成立。黄石公园叠加了许多近似自然实验，却没有另一个完全相同、只缺少狼的公园陪它走过同样年代。研究者只能把样地、围栏、水位处理、种群记录、历史照片和不同模型拼在一起，逐步缩小不确定性。
  - id: p24
    illustration: p24
    paragraphs:
    - text: "“狼改变河流”的故事流传至今，是因为结构有力，而且其中若干机制确实合理。问题出在它把仍待检验的多层假设讲成已经闭合的链条。更诚实的版本仍让狼留在画面中央，同时允许水、河狸、野牛、猎人、其他捕食者、天气与历史共同作用；每引用一个结论，先问它抽取了什么样本。最后的画面不是河流服从一只狼，而是一条小溪经过高低不齐的柳丛，岸边留着多种动物足迹，水位井和测量标记仍在记录变化。证据改写了故事，调查还没有结束。"
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 耐心而严谨，清楚读出限定与不确定性
        timbre: 温暖的成年声线，带轻微纪录片质感
        pace: 中速偏稳，在证据转折处短暂停顿
        pitch: 中低音区
  pages:
  - id: p01
    illustration: p01
    blocks:
    - id: p01-b01
      speaker: narrator
      text: 雪地里，一只狼走近鹿群；接着，马鹿离开河边，柳树长高，河狸筑坝，河道也变得稳定。把这些画面连在一起，“狼改变河流”的故事便像一串自然落下的多米诺骨牌。那部广为传播的短片正是这样讲述黄石公园：捕食者回归，生态系统随之修复。然而，先后出现的画面并不能自动组成因果证据。要回答题目中的问题，我们得把顺滑的故事拆开，逐段核对每个箭头，也要问清来源究竟观察了什么。
  - id: p02
    illustration: p02
    blocks:
    - id: p02-b01
      speaker: narrator
      text: "“改变”这个词很有力量，却藏住了尺度。它可以指狼间接帮助某片河边的柳树生长，也可以指河狸改变一条小溪的蓄水；还可能被听成整个黄石公园的主要河流都因狼而改道。三种说法需要的证据完全不同。许多重要研究只涉及北部草原、某个流域或若干样地。因此，本书不把流行说法当作一个整体来接受或推翻，而是把它画成因果图：狼、马鹿、木本植物、河狸和河道之间，每条连线都要单独接受检验。"
  - id: p03
    illustration: p03
    blocks:
    - id: p03-b01
      speaker: narrator
      text: 历史起点相当明确。二十世纪初，狼在黄石公园内被消灭。1995年1月，管理人员从加拿大引入十四只狼，让它们先在围栏中适应；1996年又引入十七只。狼的回归恢复了大型食肉动物群落中一个曾经缺失的环节，当时美洲狮和熊也在增加。如此清楚的时间点很适合长期研究，却不能把公园变成重新启动的实验室。同一时期，狩猎政策、旱情、严冬、野牛数量和其他捕食者也在变化。只看“之前”和“之后”，能确认变化发生过，不能把全部变化都归给狼。
  - id: p04
    illustration: p04
    blocks:
    - id: p04-b01
      speaker: narrator
      content:
      - text: 研究者提出的核心机制叫
      - vocabulary:
          id: trophic-cascade
          text: 营养级联
      - text: "：食物网高层发生变化，影响沿着取食关系间接传到低层。狼可能捕食马鹿，帮助降低其数量；捕食风险也可能改变马鹿停留和进食的地点。啃食压力减轻后，柳树、山杨和杨树幼株可能长高，为河狸提供食物与筑坝材料；河狸坝又可能抬高地下水位，影响小河道。这个模型由多段机制组成，不是一件不可分割的事实。前一段证据充分，并不能替后一段自动作证。"
  - id: p05
    illustration: p05
    blocks:
    - id: p05-b01
      speaker: narrator
      text: 狼回归后，黄石北部马鹿数量下降，这是明确的记录；狼也逐渐成为重要死亡来源。不过，美国国家公园管理局提醒读者，最初十年里，人类狩猎与气候是马鹿下降的主要驱动因素。严冬会影响存活，熊和美洲狮也捕食马鹿，迁出公园的鹿还会进入不同管理区域。后来，狼和完整的食肉动物群落发挥了更大的调节作用。说“狼回来后马鹿减少”是在描述顺序；说“马鹿种群完全是被狼压缩的”则删掉了必须估计的其他力量。
  - id: p06
    illustration: p06
    blocks:
    - id: p06-b01
      speaker: narrator
      text: 从马鹿到植物，至少有两条路线。第一条依靠数量：马鹿少了，总啃食量可能下降。第二条依靠行为：即使马鹿数量没有立刻大变，它们也可能因风险而少去某些地方进食。后一条被概括成很有画面的“恐惧景观”，仿佛河谷一危险，柳树就得到喘息。马鹿确实会躲避捕食者，但反应还受时段、地形、群体大小和眼前风险影响。2010年的大尺度研究没有发现狼的空间风险足以解释山杨更新。恐惧能改变一只鹿的选择，却未必安排整片森林。
  - id: p07
    illustration: p07
    blocks:
    - id: p07-b01
      speaker: narrator
      text: 支持强级联的研究也发现了重要现象。2012年的综合研究报告说，从1998年到2010年，样地中最高的幼小山杨受到啃食的比例明显下降，更多幼小山杨植株的主梢长过常见的取食高度。另一些地点出现了更高的柳树或新的杨树幼株。这些变化符合一个预测：马鹿压力减轻后，木本植物有机会恢复。跨越十多年的观察尤其珍贵，因为树木反应很慢。不过，不同研究选择的植物、地点和样本并不相同。现象与模型相符，只是论证的起点；排除其他解释后，因果判断才会更强。
  - id: p08
    illustration: p08
    blocks:
    - id: p08-b01
      speaker: narrator
      text: 成对照片会让这种证据格外有冲击力：旧照片里，柳树低矮稀疏；新照片里，同一片河边枝叶浓密。照片能保存真实变化，但镜头总有边界。拍摄者选定地点、方向、季节和时刻，一幅图能证明某处变了，却不能说明它是否代表全部区域。连续测量固定植株比照片更精确，仍要说明如何选样。传播材料常把最强烈的对照放在前面，读者先看到“恢复”，很久以后才遇到“这个地点有多典型”的问题。
  - id: p09
    illustration: p09
    blocks:
    - id: p09-b01
      speaker: narrator
      content:
      - text: 2022年，一项研究专门检验了山杨调查的选样方法。早期一些调查会在每个林分里测量最高的五株幼树，因为它们能显示是否已有树逃过马鹿啃食。随机抽样问的是另一个问题：整个林分和全部幼株大体如何？比较结果显示，两种方法都发现了级联信号，但只挑最高植株，会把恢复幅度放大四到七倍。这就是
      - vocabulary:
          id: sampling-bias
          text: 抽样偏差
      - text: "：样本的选取方式持续偏向某类对象，使结果不能代表总体。它削弱的是“级联很强”的结论，不等于否认所有恢复。"
  - id: p10
    illustration: p10
    blocks:
    - id: p10-b01
      speaker: narrator
      text: 到了2025年，争论再次集中在“有多强”。一组研究者使用北部二十五个河边样地从2001年到2020年的柳树高度记录，再用高度估算树冠体积，也就是枝、叶和茎占据的三维空间。模型给出的平均树冠体积增幅约为百分之一千五百，因此论文把它归为较强的营养级联。这个数字针对的是北部已建立的柳树样地，不是全园所有植物，更不是河道本身。若标题省去“估算”“二十五处”和“2001年至2020年”，植物指标很容易被听成整个生态系统的直接测量。
  - id: p11
    illustration: p11
    blocks:
    - id: p11-b01
      speaker: narrator
      text: 同年发表的同行评议评论反对这个强度算法。评论者认为，树冠体积主要由原有的高度数据推算，结果在很大程度上重新表达了“树变高”。不同年份还比较了并不完全匹配的样地，并把适用于平衡状态的指标用于持续变化的系统。他们也质疑照片选择和因果归因。双方并非在争论“柳树有没有长”，而是在争论同一批数据能否证明“世界上最强的一类级联”。这提醒我们：数字很大，不代表解释范围也能无限扩大。
  - id: p12
    illustration: p12
    blocks:
    - id: p12-b01
      speaker: narrator
      text: 另一组研究没有只看时间线，而是直接操纵两种条件。2001年起，研究者在河边设置不同样地：有的用围栏挡住大型食草动物，有的用人工坝抬高水位，有的同时采用两种处理。十九年后，减少啃食与提高地下水位都促进了柳树生长；两者合用的效果最明显。某些只有围栏或只有坝的地点反应较弱，而且样地之间差异很大。实验没有证明狼无关，而是说明：即使啃食减少，若河床已经下切、地下水仍然过低，柳树也未必迅速恢复。
  - id: p13
    illustration: p13
    blocks:
    - id: p13-b01
      speaker: narrator
      content:
      - text: 这些实验发生在
      - vocabulary:
          id: riparian-zone
          text: 河岸带
      - text: "，也就是紧邻河流、既影响水又受水影响的陆地区域。柳树根系需要合适的水分，地上枝条又会遭到马鹿和野牛啃食。河床向下切深后，附近地下水可能随之降低，根系更难接近稳定水源。围栏改变“谁来吃”，人工坝改变“植物在哪里生长”。两个处理揭示了直线模型容易忽略的限制：捕食者能从上往下改变取食压力，土壤、水位和河道形态也会从下往上限制植物。"
  - id: p14
    illustration: p14
    blocks:
    - id: p14-b01
      speaker: narrator
      text: 河狸又把单向箭头变成了循环。高大的柳树为河狸提供食物和筑坝材料；河狸坝抬高水位、扩展湿地，又帮助更多柳树生长。如果长期啃食和河道下切同时带走高柳与旧坝，即使马鹿压力下降，系统也可能停留在另一种状态。河狸因此不只是级联末端得到的“奖励”，还可能是恢复过程缺少的工程力量。把柳树、河狸、河流排成三个先后画面，讲述很顺；实验显示，它们更像彼此推动、也彼此限制的反馈环。
  - id: p15
    illustration: p15
    blocks:
    - id: p15-b01
      speaker: narrator
      text: 那么，“河流改变”最直接的依据是什么？2006年的一项研究重建了狼消失以后，加拉廷河若干河段的长期变化。历史照片、植被迹象和河道测量支持这样的解释：持续啃食削弱河边柳树，洪泛区功能随之下降，部分河道变宽或不稳定。它讨论的是二十世纪狼被消灭之后的损害，并提出捕食者缺失到河道变化的级联。它没有在1995年前后测量黄石所有河流，也没有证明狼回归后这些河流按相反方向恢复。关于“失去狼”的证据能支持恢复假设，却不能替代“重新引狼”的反向实测。
  - id: p16
    illustration: p16
    blocks:
    - id: p16-b01
      speaker: narrator
      text: 河道还受洪水、泥沙、坡度、倒木、岸坡材料、植物和河狸活动共同影响。1996年与1997年的大洪水恰好接近狼回归时间，使时间顺序更难解释。某条河道移动时，研究者需要判断植被、洪峰、河狸坝或多种力量各占多大作用。在一些小溪旁，植物恢复和河狸活动确实可能稳固岸坡、增加蓄水。但“小溪”“某段洪泛区”和“主要河流”不是同一尺度。若只说“河流改变了”，听众很难知道研究真正测到哪里。
  - id: p17
    illustration: p17
    blocks:
    - id: p17-b01
      speaker: narrator
      text: 地点不同，看似冲突的结果可以同时成立。二十五个湿润样地里的柳树可能明显长高，而更广范围内随机选择的山杨林分只显示较弱恢复。柳树与山杨的生长条件不同，各地地下水也不同。黄石北部不等于整个公园，一条支流也不能代表北部全部河谷。每当摘要把“某些河岸柳树”写成“黄石植被”，结论就悄悄扩大了一次。阅读生态研究时，物种、地点和抽样范围不是脚注，而是结论的一部分，必须跟着结果一起转述。
  - id: p18
    illustration: p18
    blocks:
    - id: p18-b01
      speaker: narrator
      text: 起止年份也能改变故事。以2001年为开端，会略去狼回归后的前六年；以2020年为终点，能等到慢慢长高的植物，却可能还看不到之后野牛增多带来的啃食。只选择相隔很远的两张照片，会突出净变化，把中间的停顿、反复和局部退化压平。长期研究的重要性，正在于生态系统不会平滑走向一个终点。“狼回来了，于是植物恢复”只用一个连接词，就压缩了捕食者、猎物、气候、水位与测量方法二十多年的变化。
  - id: p19
    illustration: p19
    blocks:
    - id: p19-b01
      speaker: narrator
      text: 来源的立场、用途和受众，会影响作者如何取舍材料。面向公众、倡导再野化的演讲需要展示生态修复的可能，因此往往选择一条主角明确、结局可见的因果链。公园介绍既要讲公共历史，也要承认研究仍在继续。论文把结论收窄到物种、样地、变量和年份；方法评论则专门寻找抽样与模型的弱点。不同目的不会自动决定谁诚实、谁有偏见。它们会影响哪些细节获得篇幅、哪些不确定性先被说出，以及作者希望读者拿证据去做什么。
  - id: p20
    illustration: p20
    blocks:
    - id: p20-b01
      speaker: narrator
      content:
      - text: 文章结构本身也有说服力。流行版本沿食物网一路向下，再向外扩展到地貌：狼、马鹿、植物、河狸、河流。前一段一旦顺利，下一段便借到它的气势，最后形成完整的修复结局。科学论文却常被方法打断：围栏、地下水井、随机样本、无法匹配的样地，都要求读者停下来检查箭头。这样的停顿不够精彩，却正是
      - vocabulary:
          id: causal-inference
          text: 因果推断
      - text: 发生的地方：研究者借助证据判断一个因素是否造成变化，而不只是在变化之前出现。
  - id: p21
    illustration: p21
    blocks:
    - id: p21-b01
      speaker: narrator
      text: 审慎阅读也要防止把神话简单倒过来。流行说法有缺口，不等于狼的回归毫无作用。狼捕食马鹿，为食腐动物留下食物，也会与其他捕食者相互影响，使曾被简化的食物网重新增加一条重要关系。随机抽样的山杨研究依然测到了较弱的级联信号。国家公园的总结同样认为，狼对马鹿和部分植被的影响真实存在，只是与其他力量交织。否定“唯一原因”，不等于否定“有所贡献”；另一种可辩护的解释，是强度随地点和年份变化的作用网络。
  - id: p22
    illustration: p22
    blocks:
    - id: p22-b01
      speaker: narrator
      text: 现在可以有限定地回答题目。狼很可能通过影响马鹿，并作为完整食肉动物群落的一员，为某些河边植物恢复创造了条件。高大植物和河狸又能影响岸坡、水位与小河道。不过，现有证据不足以证明少量被引入的狼单独造成了全园河流的普遍改变。水文、洪水、气候、狩猎、熊和美洲狮、野牛、河狸以及过去遗留的河道损伤，都进入同一解释。结论没有流行标题那样整齐，却与研究真正覆盖的边界一致。
  - id: p23
    illustration: p23
    blocks:
    - id: p23-b01
      speaker: narrator
      text: 这个回答反复使用“某些地点”“黄石北部”“有所贡献”“可能”等限定词，听来不够果断。其实，它们保存了证据的形状。删掉限定，局部测量便变成普遍事件；保留限定，读者才看见研究如何成立。黄石公园叠加了许多近似自然实验，却没有另一个完全相同、只缺少狼的公园陪它走过同样年代。研究者只能把样地、围栏、水位处理、种群记录、历史照片和不同模型拼在一起，逐步缩小不确定性。
  - id: p24
    illustration: p24
    blocks:
    - id: p24-b01
      speaker: narrator
      text: "“狼改变河流”的故事流传至今，是因为结构有力，而且其中若干机制确实合理。问题出在它把仍待检验的多层假设讲成已经闭合的链条。更诚实的版本仍让狼留在画面中央，同时允许水、河狸、野牛、猎人、其他捕食者、天气与历史共同作用；每引用一个结论，先问它抽取了什么样本。最后的画面不是河流服从一只狼，而是一条小溪经过高低不齐的柳丛，岸边留着多种动物足迹，水位井和测量标记仍在记录变化。证据改写了故事，调查还没有结束。"
