schema_version: 2
language: zh-CN
writer: 砚舟
title: 狼改变了河流吗
summary: 一个著名的黄石故事把狼、马鹿、树木、河狸与河流连成因果链。相互争论的研究显示哪些环节证据较强，哪些结论受方法影响，也解释了为什么有限定的回答更准确。
