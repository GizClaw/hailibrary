learning:
  goals:
  - Explain the proposed wolf-elk-woody plant-beaver-stream trophic cascade and identify which links have direct support.
  - Compare studies that report strong vegetation recovery with experiments and sampling analyses that qualify its size or cause.
  - Analyze how spatial scale, time window, measurement choice, and source purpose shape the popular river-changing story.
  - Form a qualified conclusion that separates wolves' documented ecological importance from an exclusive causal claim about rivers.
  concepts:
  - trophic cascades and indirect effects
  - density-mediated and behavior-mediated pathways
  - sampling design and causal inference
  - riparian hydrology and beaver feedbacks
  - media structure and source position
