schema_version: 1
required: true
historical_scope: >-
  Wolf removal and restoration, northern-range elk dynamics, woody-plant responses,
  stream hydrology, beaver feedbacks, river-channel claims, research methods, and
  media framing are researched nonfiction. The work does not claim that wolves
  alone caused any park-wide change, that every Yellowstone river changed, or
  that correlation establishes the complete causal chain.
sources:
  - url: https://www.nps.gov/yell/learn/historyculture/wolf-management.htm
    title: History of Wolf Management
    publisher: U.S. National Park Service
    supports: >-
      Fourteen Canadian wolves were brought to Yellowstone in 1995 and seventeen
      more in 1996; wolf contributions to northern-range elk decline and related
      willow and aspen recovery remain active research questions.
  - url: https://www.nps.gov/yell/learn/nature/cyclesprocesses.htm
    title: Cycles and Processes - Trophic Cascade
    publisher: U.S. National Park Service
    supports: >-
      The definition of a trophic cascade; evidence and debate about wolf, elk,
      willow, and aspen pathways; the simultaneous roles of hunting, climate,
      bears, cougars, bison, and groundwater; and the difference between
      correlation and a settled causal claim.
  - url: https://www.sciencedirect.com/science/article/pii/S0006320711004046
    title: 'Trophic cascades in Yellowstone: The first 15 years after wolf reintroduction'
    publisher: Biological Conservation
    supports: >-
      Ripple and Beschta's 2012 synthesis and field survey reported reduced
      browsing and increased heights of selected young aspen and argued that a
      tri-trophic cascade was in an early stage of recovery.
  - url: https://pubs.usgs.gov/publication/70006050
    title: 'Are wolves saving Yellowstone''s aspen? A landscape-level test of a behaviorally mediated trophic cascade'
    publisher: U.S. Geological Survey publication record for Ecology
    supports: >-
      Kauffman, Brodie, and Jules tested whether spatial variation in wolf risk
      explained aspen browsing and recruitment and found inadequate support for
      the proposed behaviorally mediated mechanism at landscape scale.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9298920/
    title: Sampling bias exaggerates a textbook example of a trophic cascade
    publisher: Ecology Letters via PubMed Central
    supports: >-
      Random sampling still detected an aspen cascade signal, but it was much
      weaker than estimates based on selecting the five tallest young stems;
      sampling design can change the apparent strength of recovery.
  - url: https://esajournals.onlinelibrary.wiley.com/doi/10.1002/ecm.1598
    title: Does restoring apex predators to food webs restore ecosystems? Large carnivores in Yellowstone as a model system
    publisher: Ecological Monographs
    supports: >-
      A twenty-year factorial experiment found that both reduced browsing and
      raised water tables affected willow growth; restoring carnivores alone did
      not simply recreate the former beaver-willow state.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3574379/
    title: Stream hydrology limits recovery of riparian ecosystems after wolf reintroduction
    publisher: Proceedings of the Royal Society B via PubMed Central
    supports: >-
      Willow recovery depended on browsing pressure and hydrological conditions;
      low water tables left a legacy that predator restoration alone could not
      reverse in the experiment.
  - url: https://www.nps.gov/yell/learn/upload/YS_13_1_sm.pdf
    title: Ten Years of Yellowstone Wolves, 1995-2005
    publisher: Yellowstone Science, U.S. National Park Service
    supports: >-
      Near-record floods in 1996 and 1997 changed stream courses close to the
      time of wolf restoration, complicating attribution of early willow and
      channel changes to a single driver.
  - url: https://trophiccascades.forestry.oregonstate.edu/sites/default/files/gallatin_river_channels_bescheta_ripple_2006.pdf
    title: River channel dynamics following extirpation of wolves in northwestern Yellowstone National Park, USA
    publisher: Earth Surface Processes and Landforms
    supports: >-
      Beschta and Ripple reconstructed twentieth-century vegetation and channel
      changes along selected Gallatin River reaches after wolf extirpation and
      proposed a cascade from heavy browsing to weakened floodplain vegetation
      and altered channel morphology; it did not test post-reintroduction river
      change across Yellowstone.
  - url: https://www.sciencedirect.com/science/article/pii/S2351989425000290
    title: The strength of the Yellowstone trophic cascade after wolf reintroduction
    publisher: Global Ecology and Conservation
    supports: >-
      A 2025 paper transformed 2001-2020 willow-height data into estimated crown
      volume and reported an increase of about fifteen hundred percent,
      interpreting it as a
      relatively strong large-carnivore trophic cascade.
  - url: https://doi.org/10.1016/j.gecco.2025.e03899
    title: 'Flawed analysis invalidates claim of a strong Yellowstone trophic cascade after wolf reintroduction: A comment on Ripple et al. (2025)'
    publisher: Global Ecology and Conservation
    supports: >-
      A peer-reviewed comment challenged the crown-volume model, comparisons
      among unmatched plots, equilibrium assumptions, photographic selection,
      and causal attribution, while distinguishing those criticisms from a claim
      that predators have no ecological effects.
  - url: https://academic.oup.com/book/26688/chapter-abstract/195480918
    title: 'A good story: Media bias in trophic cascade research in Yellowstone National Park'
    publisher: Oxford University Press
    supports: >-
      A literature review and newspaper sample found that popular coverage more
      often repeated a simple cascade than the scientifically unresolved and
      method-dependent account.
  - url: https://www.ted.com/talks/george_monbiot_for_more_wonder_rewild_the_world
    title: For more wonder, rewild the world
    publisher: TED
    supports: >-
      The 2013 talk provides the source narration later used in the viral
      short film and presents a compressed wolf-to-vegetation-to-beaver-to-river
      sequence as a persuasive rewilding story.
notes: >-
  The central editorial distinction is between evidence that wolves contributed
  to ecological change and the much stronger statement that wolves alone changed
  Yellowstone's rivers. The work identifies the spatial scope, time window,
  measurement choice, competing drivers, and source purpose behind each claim.
