schema_version: 1
style: naturalistic-storybook
aspect_ratio: '3:2'
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  wolves: Anatomically accurate Yellowstone gray wolves with mixed charcoal, gray-brown, and cream coats; restrained wild behavior, no collars visible.
  elk: Rocky Mountain elk with natural tawny coats, dark necks, and realistic seasonal antlers only where appropriate.
  landscape: Yellowstone northern-range valleys with sage grassland, glacial terraces, willow-lined small streams, distant volcanic plateaus and mountains; natural geography, no invented monuments.
  research_equipment: Plain field fences, wooden plot stakes, metal groundwater wells, measuring poles, cameras, and notebooks with no readable markings.
  palette: Winter blue-gray, sage green, willow gold, dark conifer green, river steel-blue, warm earth brown, and restrained dawn amber.
assets:
- id: cover
  file: artwork/cover.webp
  scene: A gray wolf on a snowy ridge overlooks a winding Yellowstone valley where elk, uneven willow stands, a beaver pond, and a braided stream occupy distinct depths of one landscape; no single magical transformation.
- id: p01
  file: artwork/p01.webp
  scene: A sequence-like landscape composition shows a wolf, alert elk, young willows, a beaver dam, and a stream, separated by natural distance rather than arrows or symbols.
- id: p02
  file: artwork/p02.webp
  scene: A vast Yellowstone aerial valley with several rivers and distant mountain ranges emphasizes scale and varied habitats, with a tiny wolf pack far below.
- id: p03
  file: artwork/p03.webp
  scene: Wildlife managers in period-accurate plain winter field gear observe wolves inside a large acclimation pen in snowy Yellowstone in the mid-1990s; all crates and equipment blank.
- id: p04
  file: artwork/p04.webp
  scene: A natural food-web tableau with wolves watching elk, browsed willow shoots, beaver pond, and stream bank in one believable valley, without diagrams or symbols.
- id: p05
  file: artwork/p05.webp
  scene: Northern-range elk move between park grassland and distant foothills during changing winter weather while wolves, a cougar, and a bear occupy separate realistic parts of the broad scene.
- id: p06
  file: artwork/p06.webp
  scene: Elk feed cautiously among open aspen and dense willow patches at dusk while distant wolves cross a ridge, showing varied terrain and no theatrical panic.
- id: p07
  file: artwork/p07.webp
  scene: Researchers measure young aspen and willow with plain unmarked poles at several separated streamside plots under changing seasonal light.
- id: p08
  file: artwork/p08.webp
  scene: A matched viewpoint of one streamside willow patch across early and later years appears as two natural framed field-photo scenes with no captions or labels.
- id: p09
  file: artwork/p09.webp
  scene: Ecologists sample a full aspen stand using evenly scattered plain stakes while a small cluster of exceptionally tall stems stands apart, illustrating representative versus selective sampling without symbols.
- id: p10
  file: artwork/p10.webp
  scene: Researchers measure established willows at multiple streamside sites, carefully estimating height and broad crown dimensions with unmarked tools.
- id: p11
  file: artwork/p11.webp
  scene: Two field teams reexamine the same willow measurements and photographs at a plain outdoor table, pointing to different plots without papers showing text.
- id: p12
  file: artwork/p12.webp
  scene: 'A long-term stream experiment shows adjacent plots: an herbivore fence, a low natural-looking artificial dam, both together, and an untreated reach, all without signs.'
- id: p13
  file: artwork/p13.webp
  scene: Close natural view of willow roots beside a cut stream bank, moist and dry soil layers, a groundwater well with no markings, and elk tracks above.
- id: p14
  file: artwork/p14.webp
  scene: Beavers work among tall willows and a pond behind a dam while a nearby incised, drier reach lacks both dam and tall shrubs, presented as two connected habitats.
- id: p15
  file: artwork/p15.webp
  scene: A historically grounded Gallatin River reach with heavily browsed willows, eroding bank, broad floodplain, and field researchers comparing the channel to a blank archival photograph.
- id: p16
  file: artwork/p16.webp
  scene: A powerful spring flood moves sediment and fallen wood through a channel as willow roots, bank material, and a beaver dam interact in different parts of the reach.
- id: p17
  file: artwork/p17.webp
  scene: A panoramic northern-range mosaic shows wet willow sites, dry aspen stands, a small creek, and a major river at visibly different scales.
- id: p18
  file: artwork/p18.webp
  scene: The same streamside plot passes through several seasons and years in a seamless landscape, with willows growing unevenly and bison arriving later.
- id: p19
  file: artwork/p19.webp
  scene: A rewilding speaker silhouette, a park interpreter, field scientists, and a methods reviewer each observe the same distant Yellowstone valley from separate natural vantage points; no stage, screen, or text.
- id: p20
  file: artwork/p20.webp
  scene: A field research scene places a fence, groundwater well, randomly distributed plot stakes, wildlife tracks, and a camera frame along one stream, each interrupting an otherwise smooth visual path.
- id: p21
  file: artwork/p21.webp
  scene: Wolves, elk, scavenging ravens, a cougar, bison, uneven willows, and a beaver pond coexist across a broad realistic food-web landscape.
- id: p22
  file: artwork/p22.webp
  scene: A stream bordered by recovering willow in some patches and low browsed shrubs in others, with beaver work, flood debris, bison tracks, and wolf tracks all visible.
- id: p23
  file: artwork/p23.webp
  scene: Researchers quietly continue measurements beside an uneven willow-lined creek at dawn; plain stakes and groundwater wells show an inquiry continuing, no charts or writing.
- id: p24
  file: artwork/p24.webp
  scene: Final broad view of a Yellowstone creek through uneven willows with tracks of wolves, elk, bison, and beaver near unmarked measuring stakes and a groundwater well, open valley beyond.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: complete
    checks:
    - cover and all twenty-four page illustrations inspected after WebP conversion
    - all four new vocabulary cards inspected after WebP conversion
    - no visible words, letters, numbers, logos, captions, speech bubbles, signatures, or watermarks found
    - every asset matches its declared scene and maintains the shared Yellowstone landscape, animal anatomy, palette, and field-equipment constraints
