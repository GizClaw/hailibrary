schema_version: 1
id: the-interpreter
type: [reading, illustrated-novella]
style: watercolor-gouache
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [everyday-life, culture]
  themes: [identity, responsibility, empathy, fairness, cooperation]
  moods: [reflective, hopeful, warm]
characters:
  - id: narrator
    kind: narrator
    description: A rotating close-third narrator who follows what each listener believes Lina's words mean without declaring one perspective complete.
    voice_identity: observant, restrained, and precise about what was said, softened, or left out
  - id: lina
    kind: character
    description: A fifteen-year-old Chinese American student who has long interpreted informal English conversations for her parents and is learning to distinguish helping from speaking for them.
    visual_identity: A fifteen-year-old Chinese American girl with an oval face, warm beige skin, dark brown eyes, and straight black hair in a low ponytail; mustard-yellow cardigan over a cream T-shirt, deep teal ankle-length pants, white canvas shoes, and a coral-red spiral notebook with completely blank pages.
    voice_identity: quick and observant, fluent in English and Mandarin, confident in ordinary speech but hesitant when a choice may affect someone else's rights or health
  - id: mei
    kind: character
    description: Lina's mother, who speaks Mandarin confidently and limited English, notices tone and relationships that Lina sometimes compresses.
    visual_identity: A Chinese woman in her early forties with a softly square face, warm beige skin, dark brown eyes, and chin-length wavy black hair; dusty-rose blouse, navy trousers, tan flats, and a moss-green cloth handbag.
    voice_identity: measured, socially attentive, and capable of stating a firm concern without raising her voice
  - id: wei
    kind: character
    description: Lina's father, who speaks Mandarin confidently and limited English, wants practical answers but dislikes hearing his uncertainty polished away.
    visual_identity: A Chinese man in his mid-forties with a rectangular face, warm beige skin, dark brown eyes, short black hair graying at the temples, and thin round glasses; slate-blue overshirt over a pale gray shirt, charcoal trousers, and brown shoes.
    voice_identity: deliberate, concrete, and dryly humorous when he is comfortable
  - id: dr-patel
    kind: character
    description: A South Asian woman physician who notices that Lina is filtering a sensitive clinic conversation and changes the communication setup.
    visual_identity: A South Asian woman in her late thirties with medium-brown skin, dark eyes, and black hair in a neat low bun; white clinical coat over a forest-green blouse, dark trousers, and a plain silver stethoscope with no branding.
    voice_identity: calm, direct, and careful to return questions and decisions to the patient
  - id: mr-brooks
    kind: character
    description: The family's landlord, who initially hears Lina's compressed directness as accusation and later responds to a specific, documented repair request.
    visual_identity: A white man in his early fifties with fair freckled skin, sandy hair receding at the temples, and a short ginger-brown beard; rust-brown work jacket over a pale blue shirt, khaki trousers, dark boots, and a plain metal flashlight.
    voice_identity: brisk and defensive under vague criticism, more cooperative when dates and actions are explicit
  - id: ms-alvarez
    kind: character
    description: Lina's school counselor, who first mistakes polished family interpreting for effortless confidence and then arranges a school interpreter so Lina can speak as a student.
    visual_identity: A Latina woman in her forties with medium olive skin, dark eyes, and shoulder-length curly dark brown hair; plum cardigan over a cream blouse, gray skirt, and simple black flats.
    voice_identity: warm and organized, with a tendency to move quickly until a missing perspective is named
  - id: interpreter
    kind: character
    description: A qualified Mandarin-English interpreter who appears by secure video at the clinic and in person at school, representing a professional role rather than a family relationship.
    visual_identity: A Chinese woman in her thirties with a round face, light warm skin, dark eyes, and a short black bob; cobalt-blue blazer over a light gray top, shown on a plain tablet screen at the clinic and wearing the same clothes in person at school, with no visible interface text.
    voice_identity: accurate, impartial, and transparent about clarification, with steady pacing and no added advice
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Analyze how a speaker's role, pressure, and assumptions influence what is selected, softened, or heard in an interpreted exchange.
    - Distinguish informal family language brokering from qualified interpreting in high-stakes medical and school settings.
    - Evaluate how preserving uncertainty, tone, and speaker ownership can change an interaction without requiring literal word-for-word substitution.
  concepts:
    - language brokering and mixed outcomes
    - speaker ownership and institutional responsibility
    - linguistic register, omission, and impartiality
    - evidence-based requests and qualified interpretation
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
