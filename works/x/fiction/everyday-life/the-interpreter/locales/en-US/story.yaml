        - {id: p04-b02, speaker: narrator, text: "She said she was glad Lina could interpret and handed her a form."}
        - {id: p04-b03, speaker: narrator, text: "To the clerk, Lina's fluency solved a scheduling problem. To Wei, the same exchange made him feel as though the appointment had been transferred into his daughter's name. He pointed to a question and asked what it meant. Lina explained, but she could not tell whether the form was asking about a condition, a diagnosis, or a symptom. She chose the broadest Mandarin word and marked the box Wei indicated. When the family entered the exam room, Wei repeated his description with both hands: pressure, release, pressure again. Lina watched Dr. Patel watch her. The physician had asked Wei a question, yet Lina was already shaping the answer before he finished speaking."}
    - id: p05
      illustration: p05
      blocks:
        - {id: p05-b01, speaker: narrator, text: "Dr. Patel began with ordinary questions about location, duration, food, and sleep. Lina answered rapidly, sometimes before Wei completed a sentence. She was trying to keep the visit from spreading into the school day, but speed changed the conversation. Wei said the pressure had awakened him twice in the past month; Lina reported that it sometimes happened at night. Mei added that he had stopped taking long evening walks. Lina left that out because she did not know whether it mattered. Then Dr. Patel asked Wei whether stress at work affected the pain. He hesitated and looked at his daughter. Lina lowered the coral notebook. She could hear two possible questions inside the doctor's sentence: one about symptoms and one about matters her father might not want to discuss with her."}
        - {id: p05-b02, speaker: lina, text: "I can translate it, but I don't know if I should be here for the answer."}
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          content:
            - text: 'Dr. Patel stopped typing. She explained that the clinic could bring in a '
            - vocabulary: {id: qualified-interpreter, text: qualified interpreter}
            - text: ', someone trained to interpret accurately in a medical conversation rather than simply someone who spoke both languages. The service would not cost the family. Lina expected Wei to refuse because waiting might make him feel troublesome. Instead, he asked how long it would take. When the doctor said a video interpreter was available now, his shoulders lowered. Lina moved her chair away from the center of the triangle.'
        - {id: p06-b02, speaker: dr-patel, text: "You haven't done anything wrong. I should have arranged this before we began."}
        - {id: p06-b03, speaker: narrator, text: "To Lina, the sentence sounded like relief and rebuke at once. An adult had removed the task, but only after Lina admitted its weight."}
    - id: p07
      illustration: p07
      blocks:
        - {id: p07-b01, speaker: narrator, text: "The interpreter appeared on the tablet in a cobalt jacket and introduced her role. She would interpret everything said, keep it confidential, and ask for clarification rather than guess. Wei spoke toward the screen, but Dr. Patel kept her eyes on him. His first answer described several recent nights without establishing a precise frequency. The interpreter paused and asked him to count them rather than choosing often or occasionally for him. Wei counted: two nights last week and one this week. The answer was less smooth than Lina's version and more useful."}
        - id: p07-b02
          speaker: narrator
          content:
            - text: 'The interpreter remained '
            - vocabulary: {id: impartial, text: impartial}
            - text: "; she did not comfort Wei, advise the doctor, or make either person's words more persuasive. Her restraint initially felt cold to Lina. Then Lina recognized what it protected: the uncertainty, embarrassment, and emphasis still belonged to the people who had expressed them."
    - id: p08
      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: "After examining Wei, Dr. Patel said several common causes were possible and explained the next steps without naming a diagnosis the evidence did not support. The interpreter carried the uncertainty intact. Wei asked his own questions, including one Lina would have softened because it sounded fearful. Outside, he sat beside her on a bench and apologized for the missed quiz. Lina almost said it was fine. Instead, she told him she liked helping with bus routes and grocery calls, but medical questions felt different because a shortened answer could matter."}
        - {id: p08-b02, speaker: wei, text: "I thought your fast English meant the visit was easy for you."}
        - {id: p08-b03, speaker: narrator, text: "Lina answered that fast was not the same as easy. Mei did not turn the exchange into a rule. She asked which kinds of help Lina still wanted to give, and they began a list."}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: "Three evenings later, rain darkened one corner of the kitchen ceiling. A stain that had been the size of Mei's palm reached the light fixture's edge, and a drop fell into a metal bowl. Wei photographed it from the doorway, careful not to claim what he could not see above the plaster. He had sent two repair messages through the building portal, but the replies said only that the request was open. Once water reached the fixture, Mei called the building's emergency maintenance line and requested a qualified electrician. Lina arrived home to find her parents keeping everyone out of the kitchen."}
        - {id: p09-b02, speaker: mei, text: "Stay back. Nobody touches the light or anything near it."}
        - {id: p09-b03, speaker: narrator, text: "The breaker panel stood dry in the hall, so Wei switched off the kitchen circuit without entering the wet area. Had the panel been wet or reachable only through water, they would have left it alone for the electrician. Emergency maintenance sent an electrician before Mr. Brooks's inspection. The electrician isolated the affected fixture and cleared the rest of the room for entry, but left that circuit off until repairs could be completed. Only then did the family arrange their dates and photographs on the table."}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: "Wei built his account in the order that made sense to him. First came the respect due to a person entering their home. Then came the two earlier messages, the dry days between storms, the stain's growth, and his uncertainty about whether the pipe or roof was responsible. He wanted an inspection date, not an argument about blame. Lina wrote the facts as short English bullets. The courteous opening occupied three lines in Mandarin and one in her notes. She told herself that English business conversations were simply more direct. Mei tapped the omitted lines."}
        - {id: p10-b02, speaker: mei, text: "Your father isn't decorating the request. He is showing that he expects cooperation."}
        - {id: p10-b03, speaker: narrator, text: "Lina thought of the clinic interpreter, who had carried every hesitation without improving it. Yet Mr. Brooks was already climbing the stairs, and Lina wanted a sentence he could not evade."}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: "Mr. Brooks entered with a flashlight, greeted Lina first, and asked what the problem was. He had received several maintenance calls after the storm and expected another vague complaint. When Wei began with thanks for coming, Mr. Brooks heard the Mandarin cadence but waited for Lina's English. Lina skipped the greeting."}
        - {id: p11-b02, speaker: lina, text: "We've reported this twice, and nothing has been done."}
        - {id: p11-b03, speaker: narrator, text: "Her sentence was factually defensible. It also moved the sharpest fact to the front and removed Wei's stated uncertainty about the cause. Mr. Brooks's jaw tightened. To him, Lina sounded like the household's spokesperson accusing him of neglect. To Wei, she was still his daughter carrying a carefully balanced request. Neither man knew that the message had changed its posture between them. Lina knew, but the landlord was already answering."}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: mr-brooks, text: "I can't repair what hasn't been diagnosed."}
        - id: p12-b02
          speaker: narrator
          content:
            - text: "Lina heard an excuse; Wei heard only the speed and guessed from Mr. Brooks's face that courtesy had failed. Lina shifted into the brisk "
            - vocabulary: {id: linguistic-register, text: register}
            - text: ' she used with school offices, a variety of language shaped by purpose, audience, and setting.'
        - {id: p12-b03, speaker: lina, text: "The stain expanded after each rain, so we need a documented inspection."}
        - {id: p12-b04, speaker: narrator, text: "The formal words gave the request authority, but they also made Lina sound older and more certain than she was. Mr. Brooks looked at her notebook rather than at Wei. He asked whether they were saying the roof was leaking. Lina could have said yes and forced a response. She looked at her father's photographs. They established a sequence, not a cause."}
        - {id: p12-b05, speaker: lina, text: "No. My father is saying we need someone qualified to find out."}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: "Mr. Brooks heard the correction as a retreat, and some of his defensiveness eased. He examined the stain, then said the upstairs bathroom might be responsible. Wei asked a longer question about the timing of the rain, the empty apartment above them, and whether moisture could remain hidden after the surface dried. Lina reduced it to whether it could still be the roof. Mr. Brooks answered no and turned off his flashlight. Wei looked puzzled. He had not asked for a yes-or-no verdict; he had asked how the competing explanations would be tested. Lina felt the meeting slide toward a quick ending. Her shortened question had made the answer easy, which was exactly the problem. She asked Mr. Brooks to wait, then told her father in Mandarin what she had actually said. Wei's eyebrows rose."}
        - {id: p13-b02, speaker: wei, text: "That was one piece of my question. Where did the rest go?"}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: "Mei raised one hand before Lina could defend herself. She reconstructed the evidence aloud: the stain first appeared after Saturday's rain; the upstairs unit had been empty since Friday; the plaster felt dry on Sunday afternoon; the edge darkened again during Tuesday's storm. None of this proved where the water originated. Together, the details showed why a single glance could not settle the matter. Mei then asked Lina to preserve the sequence rather than compress it into a conclusion."}
        - {id: p14-b02, speaker: mei, text: "And please keep the part where we say we don't know."}
        - {id: p14-b03, speaker: narrator, text: "To Mr. Brooks, uncertainty might sound weak. To Mei, it was the reason inspection was necessary. Lina translated the timeline, named the empty apartment, and finished with her mother's exact limit."}
        - {id: p14-b04, speaker: lina, text: "We cannot identify the source from inside this room."}
        - {id: p14-b05, speaker: narrator, text: "Mr. Brooks turned his flashlight back on."}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: "The conversation slowed enough for Wei to direct it. He showed each photograph and waited while Lina interpreted before moving to the next. Mr. Brooks noticed that the stain's edge shifted between storms, then checked the wall near the upstairs plumbing line. He still thought the bathroom was more likely than the roof, but now he described that judgment as a starting theory. He proposed a moisture reading that evening and an exterior inspection the next morning if the wall remained damp. Lina resisted the urge to promise that her parents accepted the plan. She interpreted it, then waited. Wei asked who would come, what area would be checked, and when they would hear the result. Those questions sounded demanding in Lina's school-office English, so she carried Wei's calm pace with them. Mr. Brooks answered each one and entered the appointment on his phone."}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: "The moisture meter indicated damp material behind the ceiling, but it could not identify the route the water had taken. Mr. Brooks scheduled both the plumbing and exterior checks. No repair was completed that night, and the family did not pretend otherwise. What changed was the claim: the meeting moved from nothing has been done to a dated record of observations, competing explanations, named checks, and a time for the next decision."}
        - id: p16-b02
          speaker: narrator
          content:
            - text: 'In the coral notebook, Lina circled the word '
            - vocabulary: {id: omission, text: omission}
            - text: ". An omission was not always a lie; it was something left out, sometimes for speed, politeness, or fear. Yet a missing detail could rearrange responsibility. Lina added the parts she had cut from Wei's question. Beside them, she wrote no apology and no rule. She wrote the next inspection time so the unfinished matter would not vanish again."
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "The following week, Lina waited outside the school conference room with a portfolio against her chest. She had revised a history essay after tracing how two newspapers described the same strike. She wanted Ms. Alvarez to notice the source comparison, not merely the high grade. Mei and Wei arrived directly from work, proud and slightly out of breath. The appointment email had offered language assistance, but Lina had clicked past the line while confirming the time. She could interpret a school conference; she had done it since middle school. This meeting also belonged to her. That fact felt obvious in the hallway and strangely difficult to protect once they sat down. Lina placed the coral notebook beside her portfolio. One held everyone else's questions. The other held work she had chosen and revised herself."}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "Ms. Alvarez opened by praising Lina's grades, debate-team work, and help welcoming new families. She spoke warmly and quickly. Lina interpreted the main points, turning three examples into one statement that the school considered her responsible. Ms. Alvarez heard Lina's polished English and saw leadership. Mei heard a list of duties and wondered how many had followed Lina home. Wei asked about the history essay, but Lina answered him before interpreting the question to the counselor."}
        - {id: p18-b02, speaker: lina, text: "She says you compare sources unusually well."}
        - {id: p18-b03, speaker: narrator, text: "Ms. Alvarez had not yet discussed the essay. The prediction was probably correct; it also filled a silence before anyone else could shape it. Ms. Alvarez smiled at Lina's confidence. Mei did not."}
        - {id: p18-b04, speaker: mei, text: "When do you get to be the student in this conversation?"}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: "Lina first treated Mei's question as private and did not interpret it. Ms. Alvarez moved toward course planning. Mei asked again, this time adding that Lina had missed a quiz for the clinic and often left homework until late after family calls. She was not accusing Lina of poor performance. She wanted to know whether the school's praise for helpfulness concealed a cost."}
        - {id: p19-b02, speaker: lina, text: "My mother worries I am too busy."}
        - {id: p19-b03, speaker: narrator, text: "The sentence made Mei sound generally anxious and erased the school-specific question. Ms. Alvarez offered time-management advice. Mei's mouth tightened; Lina felt the wrong answer land between them. She stopped the counselor and explained what she had omitted. Ms. Alvarez looked at the portfolio, the family notebook, and Lina's parents."}
        - {id: p19-b04, speaker: ms-alvarez, text: "I invited you to discuss Lina, and then I let Lina carry the whole meeting."}
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          content:
            - text: "Ms. Alvarez called the district's language-services office. An interpreter who had finished another conference nearby joined them ten minutes later. She sat slightly aside so the family and counselor could face one another. Before they resumed, she explained that she would preserve each speaker's meaning and tone, remain "
            - vocabulary: {id: impartial, text: impartial}
            - text: ', and signal any need for clarification. Her role was not to advise the family or make the counselor sound more convincing.'
        - {id: p20-b02, speaker: narrator, text: "Lina noticed the resemblance to the clinic interpreter's introduction, but the room felt different because the subject was Lina herself. She closed the coral notebook. When Ms. Alvarez asked about the missed quiz, Wei answered as a parent, Mei asked about school demands, and Lina did not need to decide which concern deserved softer words."}
    - id: p21
      illustration: p21
      blocks:
        - {id: p21-b01, speaker: narrator, text: "With the interpreting task removed, Lina described her history essay. She had compared two reports of the same strike: one called workers disruptive, while the other emphasized unsafe conditions. Neither article invented every fact, but each selected a different beginning and gave different people room to speak. Ms. Alvarez asked how Lina recognized the framing. Lina pointed to verbs, quoted sources, and details that appeared in one report but not the other. Mei listened through the interpreter and then laughed softly."}
        - {id: p21-b02, speaker: mei, text: "So you have been studying the thing we keep asking you to do at home."}
        - {id: p21-b03, speaker: narrator, text: "Lina heard affection, concern, and a little embarrassment in the sentence. She answered for herself."}
        - {id: p21-b04, speaker: lina, text: "At school, I can revise after I see what I changed. In a live conversation, people answer the version I make before I can check it."}
        - {id: p21-b05, speaker: narrator, text: "The interpreter carried the comparison without improving it."}
    - id: p22
      illustration: p22
      blocks:
        - {id: p22-b01, speaker: narrator, text: "On the walk home, Wei carried the coral notebook. The family reviewed the three meetings without arranging them into one verdict. At the clinic, Lina's speed had hidden details, but her hesitation had helped the doctor change the process. At the apartment, no language professional appeared, and Lina's knowledge helped produce a specific inspection plan. At school, her competence had made it easy for adults to overlook that she was also the person being discussed. Helping had not meant the same thing in every room."}
        - {id: p22-b02, speaker: lina, text: "I don't want to stop being useful."}
        - {id: p22-b03, speaker: narrator, text: "Mei replied that usefulness should not be assigned without asking. Wei added that he did not want his careful sentences polished into courage he did not feel. They agreed to decide by the stakes, the available support, and Lina's own choice, not by whether she could answer fastest."}
    - id: p23
      illustration: p23
      blocks:
        - {id: p23-b01, speaker: narrator, text: "Their agreement became practical at the kitchen table. For casual errands, Lina could volunteer, decline, or ask for time. For medical visits and school conferences, her parents would request the language services available to them. When Lina did help elsewhere, she would tell both sides when a phrase was unclear instead of selecting the most convenient meaning. Mei and Wei would pause after short sections, address the other adult directly, and keep their own questions in order. Wei practiced asking for a Mandarin interpreter on the clinic phone line. Mei made a separate list for the ceiling inspection. Lina corrected one English phrase, then returned to chemistry. No one announced that the new system was perfect. A professional might be delayed, a language might be unavailable, and an ordinary conversation could become serious without warning. The plan gave them a way to notice that change together."}
    - id: p24
      illustration: p24
      blocks:
        - {id: p24-b01, speaker: narrator, text: "Two weeks later, Mei called the clinic to arrange Wei's follow-up. When the receptionist answered, Mei used the sentence she had practiced, then waited while a Mandarin interpreter joined the call. Wei sat beside her with his question list. Lina worked at the other end of the table, close enough to help if the call failed but no longer positioned between every voice. She heard her mother describe the appointment purpose, heard the interpreter carry it, and heard the receptionist respond to Mei. The coral notebook lay open between the family's papers, its pages divided by three plain tabs. Lina finished a chemistry problem while her father added a question to his own list. When Mei ended the call, she checked the appointment details with Wei first. Only then did she turn to Lina and ask whether the timing conflicted with school. Lina looked at her calendar and answered as their daughter."}
