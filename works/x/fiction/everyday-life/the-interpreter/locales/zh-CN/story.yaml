schema_version: 2
language: zh-CN
writer: 砚舟
title: 两种语言之间
summary: >-
  十五岁的陈琳娜常替父母在普通话和英语之间传话。她说得越流利，大人越容易忘记：
  她每一次省略、缓和或加强语气，都可能改变别人听见的意思。一次看病、一次房屋维修
  沟通和一场家长会，让全家和几位成年人重新安排谁来提问、谁来回答，也让琳娜得以
  在需要的时候只做女儿和学生。
chapters:
  - {id: ch01, title: 随身带着的话, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 诊室里的另一把声音, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: 天花板没有说完的事, page_refs: [p09, p10, p11, p12]}
  - {id: ch04, title: 被剪短的问题, page_refs: [p13, p14, p15, p16]}
  - {id: ch05, title: 这也是她的家长会, page_refs: [p17, p18, p19, p20]}
  - {id: ch06, title: 各自坐回自己的位置, page_refs: [p21, p22, p23, p24]}
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些细节说明琳娜的父母并没有把所有决定都交给她？
    answer: 妈妈会核对琳娜准备怎么说，爸爸会追问被缩短的问题；后来父母还自己列清单、主动提出需要口译服务。
    page_refs: [p02, p04, p13, p14, p22, p23, p24]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 前台工作人员和帕特尔医生怎样不同地理解琳娜的流利？
    answer: 前台把流利当成省事的办法，医生却发现琳娜正在替病人筛选内容，于是改变了沟通方式。
    page_refs: [p04, p05, p06]
  - id: q03
    type: evaluate
    speaker: narrator
    prompt: 为什么专业口译员停下来追问具体次数，并不表示她能力不足？
    answer: 她没有猜测一个概括说法代表什么频率，而是请爸爸说清具体次数，使病人的经历仍由本人表达，医生也得到更准确的信息。
    page_refs: [p07]
  - id: q04
    type: source-analysis
    speaker: narrator
    prompt: 布鲁克斯先生为什么把琳娜最初的维修要求听成了指责？
    answer: 他以为琳娜简短直接的话完整保留了爸爸的语气和目的，却不知道她删掉了礼貌铺垫与对漏水原因的不确定。
    page_refs: [p11, p12, p13]
  - id: q05
    type: evidence
    speaker: narrator
    prompt: 修改后的维修要求为什么更容易落实？
    answer: 琳娜说明了下雨日期、湿痕变化和楼上无人等事实，并要求约定检查日期，而没有断定看不见的漏水来源。
    page_refs: [p14, p15, p16]
  - id: q06
    type: compare
    speaker: narrator
    prompt: 妈妈和阿尔瓦雷斯老师最初怎样看待琳娜在学校里的能干？
    answer: 老师从中看到自信与领导力，妈妈却想到这些帮助占用了琳娜多少学习时间和注意力。
    page_refs: [p18, p19]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: 在诊所和学校换成专业口译员以后，三方关系发生了什么变化？
    answer: 父母能直接对工作人员说话，工作人员必须听原说话人，琳娜也能以女儿或学生的身份参加谈话，不再同时控制两边的信息。
    page_refs: [p06, p07, p20, p21]
  - id: q08
    type: evaluate
    speaker: narrator
    prompt: 故事是否把琳娜过去替家里传话写成了完全有害的事？为什么？
    answer: 没有。她愿意处理部分日常小事，也确实帮助了房屋检查；故事只是把这些帮助与医疗、教育等高压力场景区分开。
    page_refs: [p01, p08, p15, p22]
  - id: q09
    type: short-answer
    speaker: narrator
    prompt: 家长会后，一家人定下了什么具体做法？
    answer: 他们会按事情的重要程度、现有服务和琳娜自己的意愿，决定何时由她帮忙、何时保留原话、何时请专业口译员。
    page_refs: [p22, p23]
  - id: q10
    type: synthesis
    speaker: narrator
    prompt: 结尾怎样改变了红色笔记本在故事里的作用？
    answer: 它不再只是琳娜替所有人携带信息的工具，而成为全家共同准备问题的东西；琳娜同时可以继续做自己的功课。
    page_refs: [p01, p05, p12, p22, p24]
  - id: q11
    type: research-response
    speaker: narrator
    prompt: 学校要判断家长能否真正使用语言服务，还应收集哪些证据？
    answer: 合理回答可考察申请方式、等待时间、语种覆盖、口译员训练和保密要求、家长是否理解，以及学生是否仍被要求替家长口译。
    page_refs: [p18, p19, p20, p21]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            周二早上六点四十分，琳娜合上历史书，把红色螺旋笔记本推到面前。这本子没有名字，却像家里的第二张嘴：买菜时少算的钱、公交换乘的问法、电话套餐里的附加费用，都曾从这些纸页上经过。平常，她喜欢看父母听懂答案后松一口气，也喜欢自己能迅速把两边接起来。今天，爸爸陈伟用手按着上腹，把一张诊所预约卡压在书角。四十分钟后要看医生，而琳娜第二节有化学测验。
        - text: >-
            “跟学校说，家里有事。”爸爸故意说得轻松，手却一直没有移开。琳娜写下请假理由，笔尖停在纸上。她还没有问清楚，要替爸爸说到什么程度。
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            梅看见女儿收书包时，心里先是一沉。琳娜没有抱怨，动作熟练得像这件事本来就该落在她身上。陈伟昨晚说，那种不舒服有时像压着一块东西，吃完饭会来，心里着急时也会来。琳娜准备告诉医生“饭后胃疼”。这句话不能算错，却把几个“有时”和一个“像”全剪掉了。梅让女儿把准备说的话先用普通话讲一遍。
        - text: >-
            琳娜看了眼钟：“我明白爸爸的意思。”梅回答：“我不是问你明不明白。我想知道，医生最后会听见什么。”陈伟也抬起头。于是琳娜重新翻开本子，把夜里醒过几次、什么时候更明显，一项项补回来。
    - id: p03
      illustration: p03
      paragraphs:
        - text: >-
            公交车晃过三个路口，琳娜在心里来回换词。爸爸说“压着”，英文若用 pressure，听来可能太重；若只说 discomfort，又像可以忽略。她一直以为，会两种语言就像知道河两岸的路，只要找到桥便能过去。可爸爸的玩笑、妈妈的停顿、医生可能追问的方向，都在改变桥该落在哪里。陈伟说也许只是昨晚油饼吃多了，还笑了一声。琳娜本想把笑话也带过去，抬头却发现妈妈没有笑。
        - text: >-
            爸爸拿玩笑挡住的，也许正是担心。琳娜在纸上写了两个版本，又都划掉。每一个版本都能传达一部分；问题在于，被留在原地的那部分属于谁。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            诊所前台听见琳娜流畅回答，立刻把表格递给她，还说幸好琳娜能帮忙翻译。工作人员看到的是排队的人和节省下来的时间。陈伟感到的却是另一回事：仿佛护士还没叫号，这次看病就已经登记在女儿名下。他指着病史表上的一个词问意思。琳娜分不清它在这里指已经确认的疾病，还是这次出现的症状，只能选一个范围较大的说法，再按爸爸的意思勾选。
        - text: >-
            进诊室后，陈伟用两只手比出疼痛一阵收紧、一阵松开的样子。帕特尔医生在看病人，也在看琳娜。她的问题还没问完，琳娜已经准备接过回答。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            开始只是常规询问：哪里不舒服、持续多久、饭前还是饭后、会不会影响睡觉。陈伟每说半句，琳娜就接半句，想赶在第二节课前回学校。爸爸说这个月有两个晚上被疼醒，琳娜说成“偶尔夜里不舒服”；妈妈补充他最近不再散步，琳娜觉得不一定相关，没有传过去。速度让谈话顺畅，也悄悄替医生筛掉了信息。
        - text: >-
            医生问工作压力会不会使症状更明显。陈伟停住，看向女儿。琳娜这才意识到，同一个问题既关乎身体，也可能涉及爸爸不愿当着她讲的事。她把笔记本合到一半：“这句话我能说，但他的回答也许不该由我听。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 帕特尔医生把手离开键盘。她说，诊所可以马上接入一位
            - vocabulary: {id: qualified-interpreter, text: 合格口译员}
            - text: ，对方不仅会两种语言，还受过训练，能准确处理医疗谈话。服务不向病人收费。琳娜以为爸爸会怕添麻烦，没想到陈伟先问要等多久。医生把平板转向他，屏幕上出现一位穿蓝外套的口译员。陈伟肩膀放松了一点，琳娜也把椅子从三个人正中挪开。
        - text: >-
            医生对琳娜说：“你没有做错，是我们一开始就该安排好。”琳娜听见两层意思：有人终于把担子接走了；可在她开口以前，大人都把她的能干当成了同意。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            屏幕里的口译员先说明规则：双方说什么，她就译什么；内容保密；遇到含糊处，她会停下来确认，不自行猜测。陈伟朝屏幕说话，帕特尔医生的目光却留在陈伟脸上。爸爸最初只说最近有几个晚上疼，实际频率并不清楚。口译员没有擅自译成“经常”或“偶尔”，而是请他数清楚。陈伟想了想：上周两晚，这周一晚。这个答案不够漂亮，却更准确。
        - content:
            - text: 口译员保持
            - vocabulary: {id: impartial, text: 公正}
            - text: ：不替陈伟安慰医生，也不替医生劝服病人。起初，琳娜觉得这种克制有点冷。继续听下去，她才明白，正因为口译员不抢着完善任何人的话，犹豫、害怕和强调才仍属于原来的说话人。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            检查后，医生说有几种常见可能，需要再做检查才能判断。她没有把猜测说成诊断，口译员也保留了这些限制。陈伟自己追问，其中一句听上去很担心；若是琳娜，她大概会先替爸爸把语气放轻。走出诊所，陈伟在长椅上向女儿道歉，说害她错过测验。琳娜差点照旧回答“没关系”，最后却说，公交路线和超市电话她愿意帮，可医疗问题不同，少说一个细节也可能影响下一步。
        - text: >-
            “我以为你答得快，就是不费力。”陈伟低声说。琳娜摇头：“快只是别人等得短，不代表我心里轻松。”梅没有立刻订下家规，只问琳娜哪些忙愿意继续帮。一家人第一次把这件事当作需要共同商量的选择。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            三天后又下雨，厨房天花板角落的湿痕从巴掌大扩到灯边，一滴水落进金属碗。陈伟站在门口拍下照片。他知道看不见墙里和屋顶，便只记录湿痕变化，没有断言水从哪里来。此前两次报修，系统都只回复“已受理”。水一到灯边，梅马上打给大楼的紧急维修值班，请他们派合格电工处理。琳娜进门时，父母正拦着所有人，不让谁走进厨房。
        - text: >-
            梅说：“别靠近，谁也不要碰灯和旁边的东西。”配电箱在干燥的走廊里，不必经过积水，陈伟才关掉厨房电路；如果配电箱沾了水，或必须涉水才能靠近，他们就会留给电工处理。紧急维修先派电工赶来。电工隔离了受潮灯具，确认房间其余位置可以进入，但维修完成前仍让这条电路断电。直到这时，一家人才把日期和照片摆上桌，等房东检查漏水原因。
    - id: p10
      illustration: p10
      paragraphs:
        - text: >-
            陈伟按自己的顺序准备：先谢谢对方上门，再说两次报修、几段晴天、三场雨和湿痕扩大，最后说明不确定是楼上水管还是屋顶。他要的是检查日期，不是先争谁该负责。琳娜把这些内容压成几条英文要点。爸爸那段客气话，在中文里不只是礼貌，也是在表明愿意合作；到了她的纸上，只剩一句“谢谢你来”。
        - text: >-
            梅敲了敲被删短的地方：“你爸不是绕圈子，他是在告诉对方，我们想一起解决。”楼梯上传来脚步声。琳娜想到诊所口译员一字一句保留停顿的样子，又担心房东借客气含糊过去。她想说一句让人无法回避的话。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            布鲁克斯先生提着手电进门，先朝琳娜问：“到底出了什么问题？”暴雨后，他已经接到几户报修，预想这里也是一场说不清的抱怨。陈伟先感谢他赶来，再开始说明日期。房东听不懂普通话，只等琳娜开口。琳娜跳过前半段，直接说：“我们报了两次，到现在什么都没处理。”事实并没有凭空改变，位置和口气却变了。
        - text: >-
            房东听见的是住户代表在追究失职，脸立刻绷紧。陈伟以为女儿仍在转达那份有礼而谨慎的要求，不明白对方为何突然防备。两个人都看着琳娜，只有她知道，话从爸爸那里走到房东面前时，已经换了站姿。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 房东说：“没查出原因，我怎么修？”琳娜把这听成推脱，陈伟只听见很快的英语，从表情猜测自己的礼貌不起作用。琳娜随即换成她和学校办公室交涉时常用的
            - vocabulary: {id: linguistic-register, text: 语体}
            - text: ：说话会因场合、目的和听者而改变用词与句式。她要求“留下正式检查记录”，那几个词给请求增加了分量，也让她显得比实际年龄更大、更肯定。
        - text: >-
            房东问：“你们认定是屋顶漏水吗？”琳娜本可以顺势回答是。她看着爸爸的照片，明白照片只能证明下雨后湿痕变化，不能证明墙外的原因。“没有，”她说，“我爸爸的意思是，请懂行的人检查后再判断。”
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            布鲁克斯先生把这次纠正当成了退让，神色稍微缓和。他照了照湿痕，判断楼上浴室更可疑。陈伟的问题很长：这几场雨的时间和湿痕变化是否对应，楼上住户不在时水管还会不会漏，表面干了以后墙内是否仍可能有水。琳娜只问：“还可能是屋顶吗？”房东说不可能，收起手电。爸爸愣住了。他问的不是一道只能答“是”或“不是”的题，而是两种解释准备怎样排查。
        - text: >-
            琳娜眼看会面要匆匆结束，终于请房东等一下。她用普通话告诉爸爸，自己刚才实际问了什么。陈伟皱起眉：“那只是我问题中的一小块。剩下的呢？”
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            梅抬手拦住女儿的解释，先把顺序重新摆好：湿痕在周六下雨后出现，楼上住户周五已经离开。周日下午表面摸着干了，周二再下雨时边缘又变深。这些现象不能单独指出漏水来源，却能说明只看一眼不够。她让琳娜不要急着替全家得出结论，而要把观察过的过程留给房东。
        - text: >-
            “还有，我们说不知道，也要照样说出去。”梅补充道。不确定在房东耳里也许显得没有力量，在她看来却正是必须检查的理由。琳娜把时间线完整译完，又明确说：“我们在这个房间里看不出水从哪儿来。”布鲁克斯先生重新打开手电。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            谈话慢下来以后，陈伟终于能自己掌握顺序。他出示一张照片，等琳娜译完，再换下一张。房东发现几场雨后湿痕的边缘位置不同，便检查靠近楼上水管的一侧墙面。他仍认为浴室漏水的可能性较大，但不再把判断当成已经证实的结果。他提出当晚先测墙内湿度；如果数值仍高，第二天上午再查外墙和屋顶。
        - text: >-
            琳娜没有替父母立刻说“可以”。她译完方案，安静等着。陈伟逐项问谁来检查、查哪些地方、什么时候通知结果。琳娜把问题译得直接，却保留了爸爸平稳的口气。布鲁克斯先生逐一回答，并在手机上约好时间。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            仪器显示天花板后面仍有潮湿材料，却不能指出水走过的路线。房东因此同时安排了水管和屋顶检查。当晚没有完成维修，谁也没有把约定说成结果。真正改变的是下一步：一句“什么都没处理”，变成了有日期的观察、两种待查原因、明确的检查项目和再次联系的时间。
        - content:
            - text: 琳娜在红本子上圈出
            - vocabulary: {id: omission, text: 遗漏}
            - text: 两个字。遗漏不一定是说谎，它可能来自赶时间、顾面子或害怕麻烦；但少掉的内容会重新分配责任。她把刚才剪掉的问题补全，没有写一句自我批评，也没有总结道理，只记下第二天的检查时间，免得未完成的事再次消失。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            又过一周，琳娜抱着学习档案等在学校会议室外。历史课要求比较两家报纸怎样报道同一场罢工，她根据老师批注重写了两遍。她希望阿尔瓦雷斯老师看到的是自己怎样处理来源，而不只是最后的高分。父母下班后匆匆赶来，脸上有掩不住的骄傲。预约邮件里其实提供了语言协助选项，琳娜确认时间时直接跳了过去。家长会她从初中起就会译，似乎没有必要再麻烦别人。
        - text: >-
            可这场会谈说的是她。这个事实在门外很清楚，一坐到桌边却容易被忘掉。琳娜把红本子放在学习档案旁边：一本装着全家的问题，另一本保存她自己选择、修改过的文章。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            阿尔瓦雷斯老师先谈成绩、辩论队和琳娜帮助新生家庭的表现，语气亲切，节奏很快。琳娜把三个例子合成一句：“学校觉得我很负责。”老师从流利回答中看见自信和带领别人的能力；梅听到的却是一项又一项额外事务，心里计算这些事有多少跟着女儿回了家。陈伟想问历史文章，琳娜还没把问题译给老师，就先替老师回答起来。
        - text: >-
            “她说我比较资料的方法很好。”其实老师还没说到那篇文章。这个猜测多半不会错，却抢先填满了别人本可使用的停顿。老师欣赏琳娜的从容，梅却问：“在这场会上，你什么时候才是学生？”
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            琳娜起初把妈妈的问题留在普通话里，阿尔瓦雷斯老师已经转向下学期选课。梅再次开口，说女儿因为陪爸爸看病错过测验，平时还常替家里打电话，作业只能拖到很晚。她不是说琳娜成绩差，而是怀疑学校一面赞扬她帮助别人，一面没有看见这份“能干”占去的时间。琳娜最后只译成：“我妈妈担心我太忙。”
        - text: >-
            老师立刻建议怎样安排时间。梅抿紧嘴，琳娜知道回答落错了地方。她叫停谈话，把自己刚才没有译出的部分补上。老师看了看学习档案、红本子和琳娜父母，慢慢说：“我请你们来谈琳娜，却让琳娜一个人扛起了整场会谈。”
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: 阿尔瓦雷斯老师联系学区语言服务部门。十分钟后，一位刚结束附近会议的口译员走进来。她没有坐在桌子正中，而是稍稍侧开，让家长、学生和老师能彼此面对。开始前，她说明自己会完整传达原话，保留意思与语气，遇到含糊之处就明说，并保持
            - vocabulary: {id: impartial, text: 公正}
            - text: 。她不替家长提建议，也不替老师把理由说得更有说服力。
        - text: >-
            这些话和诊所里的介绍相似，这次谈论的主角却是琳娜本人。她合上红本子。老师问起错过的测验，陈伟以父亲身份回答，梅直接追问学校安排，琳娜不必再判断哪一种担心应该被说轻一点。
    - id: p21
      illustration: p21
      paragraphs:
        - text: >-
            不用承担口译以后，琳娜终于讲起自己的历史文章。两篇报道都写同一场罢工，一篇先写交通中断，把工人称为“制造混乱的人”；另一篇先写工作场所的安全隐患，让工人自己说明理由。它们并非每句话都互相矛盾，却通过不同开头、动词和引语位置，引导读者先同情不同的人。老师问她怎样发现这些选择，琳娜翻开档案，逐一指出证据。
        - text: >-
            梅听完口译，轻轻笑了：“原来你在学校研究的，就是我们天天请你做的事。”琳娜从这句话里听见亲近，也听见担心和一点难为情。她回答：“文章改完还能回头检查；现场说出去以后，别人已经在回应我做出的那个版本。”口译员原样传过去，没有把比较说得更漂亮。
    - id: p22
      illustration: p22
      paragraphs:
        - text: >-
            回家路上，红本子拿在陈伟手里。一家人回想三场会面，却没有硬把它们归成一个结论。诊所里，琳娜的速度藏掉了细节，她的迟疑也促使医生改变流程。厨房里没有语言专业人员来接手沟通，琳娜的双语能力确实帮助大家约到检查。学校里，正因为她表现得太可靠，大人才更容易忘记她也是被讨论的学生。同样是帮忙，在不同房间里并不是同一件事。
        - text: >-
            琳娜说：“我不想从此什么都不帮。”梅回答，愿意帮和默认该帮不能混为一谈。陈伟也不希望自己的犹豫被修成并不存在的勇敢。他们决定以后先看事情有多重要、能否获得服务，也要问琳娜是否愿意，而不是只看谁答得最快。
    - id: p23
      illustration: p23
      paragraphs:
        - text: >-
            这项约定回到厨房后变得很具体。买东西、问路线之类的日常小事，琳娜可以答应，也可以拒绝或要求多一点准备时间。看病和家长会，父母主动申请现有的语言服务。其他场合若仍由琳娜帮忙，她遇到不清楚的说法就公开追问，不再偷偷选一个最省事的解释。父母会每说一小段便停下来，望着真正的谈话对象，也把自己的问题按顺序记好。
        - text: >-
            陈伟对着诊所电话练习怎样申请普通话口译，梅另列了一张房屋检查清单。琳娜帮爸爸改了一个英语说法，便回去复习化学。专业人员可能迟到，某些语种也可能一时找不到；普通小事还会突然变得重要。新办法不能消除所有麻烦，只让他们能一起发现变化发生在什么时候。
    - id: p24
      illustration: p24
      paragraphs:
        - text: >-
            两周后，梅给诊所打电话，替陈伟约复诊。前台接听时，她说出练过的那句话，随后等普通话口译接入。陈伟坐在旁边，手里是自己的问题单。琳娜在桌子另一头做作业，距离近得足以在电话中断时帮忙，却不再夹在每一把声音之间。她听见妈妈说明预约目的，听见口译员传达，也听见前台直接回应妈妈。
        - text: >-
            红本子摊在几份资料之间，三个标签分别夹着诊所、住房和学校记录。琳娜算完一道化学题，陈伟又往自己的纸上添了一个问题。通话结束后，梅先同丈夫核对时间，最后才转向女儿，问那天会不会耽误上课。琳娜看了看自己的日程，以女儿的身份回答了她。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 贴近不同人物的克制叙述，清楚区分观察、猜测与事实, timbre: 温润偏低的女中音, pace: 从容，关键停顿留出思考空间, pitch: 中低且稳定}
    lina:
      display_name: 琳娜
      tts: {delivery: 当代少女的利落口语，遇到不确定处会明显放慢, timbre: 清亮的少女音, pace: 日常交流偏快，承认压力时沉稳, pitch: 中高，紧张时略收紧}
    mei:
      display_name: 梅
      tts: {delivery: 不夸张的普通话家庭语气，温和但能明确叫停, timbre: 圆润的女中音, pace: 不急，句间停顿有分量, pitch: 中低而坚定}
    wei:
      display_name: 陈伟
      tts: {delivery: 重事实、会斟酌，放松时带一点干幽默, timbre: 有质感的男中音, pace: 稍慢，谈私人担忧时会停顿, pitch: 偏低且自然起伏}
    dr-patel:
      display_name: 帕特尔医生
      tts: {delivery: 清楚直接，把提问与决定始终交还病人, timbre: 平稳柔和的女低音, pace: 均匀而专注, pitch: 中低，问句有轻微上扬}
    mr-brooks:
      display_name: 布鲁克斯先生
      tts: {delivery: 务实简短，防备时偏硬，面对具体证据后放慢, timbre: 略干的男中音, pace: 起初短促，检查时趋于平稳, pitch: 中低，开头重音较强}
    ms-alvarez:
      display_name: 阿尔瓦雷斯老师
      tts: {delivery: 热情有条理，被提醒后转为认真倾听, timbre: 明亮饱满的女中音, pace: 开场较快，修正后有意放慢, pitch: 中音，提问时开放}
    interpreter:
      display_name: 口译员
      tts: {delivery: 准确完整传达，遇到含糊内容公开澄清, timbre: 清晰平衡的女中音, pace: 稳定，按意思分段, pitch: 居中，少作情绪加工}
  pages:
    - id: p01
      illustration: p01
      blocks:
        - {id: p01-b01, speaker: narrator, text: 周二早上六点四十分，琳娜合上历史书，把红色螺旋笔记本推到面前。这本子没有名字，却像家里的第二张嘴：买菜时少算的钱、公交换乘的问法、电话套餐里的附加费用，都曾从这些纸页上经过。平常，她喜欢看父母听懂答案后松一口气，也喜欢自己能迅速把两边接起来。今天，爸爸陈伟用手按着上腹，把一张诊所预约卡压在书角。四十分钟后要看医生，而琳娜第二节有化学测验。}
        - {id: p01-b02, speaker: wei, text: 跟学校说，家里有事。}
        - {id: p01-b03, speaker: narrator, text: 爸爸故意说得轻松，手却一直没有移开。琳娜写下请假理由，笔尖停在纸上。她还没有问清楚，要替爸爸说到什么程度。}
    - id: p02
      illustration: p02
      blocks:
        - {id: p02-b01, speaker: narrator, text: 梅看见女儿收书包时，心里先是一沉。琳娜没有抱怨，动作熟练得像这件事本来就该落在她身上。陈伟昨晚说，那种不舒服有时像压着一块东西，吃完饭会来，心里着急时也会来。琳娜准备告诉医生饭后胃疼。这句话不能算错，却把几个有时和一个像全剪掉了。梅让女儿把准备说的话先用普通话讲一遍。}
        - {id: p02-b02, speaker: lina, text: 我明白爸爸的意思。}
        - {id: p02-b03, speaker: mei, text: 我不是问你明不明白。我想知道，医生最后会听见什么。}
        - {id: p02-b04, speaker: narrator, text: 陈伟也抬起头。于是琳娜重新翻开本子，把夜里醒过几次、什么时候更明显，一项项补回来。}
    - id: p03
      illustration: p03
      blocks:
        - {id: p03-b01, speaker: narrator, text: 公交车晃过三个路口，琳娜在心里来回换词。爸爸说压着，英文若用 pressure，听来可能太重；若只说 discomfort，又像可以忽略。她一直以为，会两种语言就像知道河两岸的路，只要找到桥便能过去。可爸爸的玩笑、妈妈的停顿、医生可能追问的方向，都在改变桥该落在哪里。陈伟说也许只是昨晚油饼吃多了，还笑了一声。琳娜本想把笑话也带过去，抬头却发现妈妈没有笑。爸爸拿玩笑挡住的，也许正是担心。琳娜在纸上写了两个版本，又都划掉。每一个版本都能传达一部分；问题在于，被留在原地的那部分属于谁。}
    - id: p04
      illustration: p04
      blocks:
        - {id: p04-b01, speaker: narrator, text: 诊所前台听见琳娜流畅回答，立刻把表格递给她。}
        - {id: p04-b02, speaker: narrator, text: 她还说，幸好琳娜能帮忙翻译。}
        - {id: p04-b03, speaker: narrator, text: 工作人员看到的是排队的人和节省下来的时间。陈伟感到的却是另一回事：仿佛护士还没叫号，这次看病就已经登记在女儿名下。他指着病史表上的一个词问意思。琳娜分不清它在这里指已经确认的疾病，还是这次出现的症状，只能选一个范围较大的说法，再按爸爸的意思勾选。进诊室后，陈伟用两只手比出疼痛一阵收紧、一阵松开的样子。帕特尔医生在看病人，也在看琳娜。她的问题还没问完，琳娜已经准备接过回答。}
    - id: p05
      illustration: p05
      blocks:
        - {id: p05-b01, speaker: narrator, text: 开始只是常规询问：哪里不舒服、持续多久、饭前还是饭后、会不会影响睡觉。陈伟每说半句，琳娜就接半句，想赶在第二节课前回学校。爸爸说这个月有两个晚上被疼醒，琳娜说成偶尔夜里不舒服；妈妈补充他最近不再散步，琳娜觉得不一定相关，没有传过去。速度让谈话顺畅，也悄悄替医生筛掉了信息。医生问工作压力会不会使症状更明显。陈伟停住，看向女儿。琳娜这才意识到，同一个问题既关乎身体，也可能涉及爸爸不愿当着她讲的事。}
        - {id: p05-b02, speaker: lina, text: 这句话我能说，但他的回答也许不该由我听。}
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          content:
            - text: 帕特尔医生把手离开键盘。她说，诊所可以马上接入一位
            - vocabulary: {id: qualified-interpreter, text: 合格口译员}
            - text: ，对方不仅会两种语言，还受过训练，能准确处理医疗谈话。服务不向病人收费。琳娜以为爸爸会怕添麻烦，没想到陈伟先问要等多久。医生把平板转向他，屏幕上出现一位穿蓝外套的口译员。陈伟肩膀放松了一点，琳娜也把椅子从三个人正中挪开。
        - {id: p06-b02, speaker: dr-patel, text: 你没有做错，是我们一开始就该安排好。}
        - {id: p06-b03, speaker: narrator, text: 琳娜听见两层意思：有人终于把担子接走了；可在她开口以前，大人都把她的能干当成了同意。}
    - id: p07
      illustration: p07
      blocks:
        - {id: p07-b01, speaker: narrator, text: 屏幕里的口译员先说明规则：双方说什么，她就译什么；内容保密；遇到含糊处，她会停下来确认，不自行猜测。陈伟朝屏幕说话，帕特尔医生的目光却留在陈伟脸上。爸爸最初只说最近有几个晚上疼，实际频率并不清楚。口译员没有擅自译成经常或偶尔，而是请他数清楚。陈伟想了想：上周两晚，这周一晚。这个答案不够漂亮，却更准确。}
        - id: p07-b02
          speaker: narrator
          content:
            - text: 口译员保持
            - vocabulary: {id: impartial, text: 公正}
            - text: ：不替陈伟安慰医生，也不替医生劝服病人。起初，琳娜觉得这种克制有点冷。继续听下去，她才明白，正因为口译员不抢着完善任何人的话，犹豫、害怕和强调才仍属于原来的说话人。
    - id: p08
      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: 检查后，医生说有几种常见可能，需要再做检查才能判断。她没有把猜测说成诊断，口译员也保留了这些限制。陈伟自己追问，其中一句听上去很担心；若是琳娜，她大概会先替爸爸把语气放轻。走出诊所，陈伟在长椅上向女儿道歉，说害她错过测验。琳娜差点照旧回答没关系，最后却说，公交路线和超市电话她愿意帮，可医疗问题不同，少说一个细节也可能影响下一步。}
        - {id: p08-b02, speaker: wei, text: 我以为你答得快，就是不费力。}
        - {id: p08-b03, speaker: lina, text: 快只是别人等得短，不代表我心里轻松。}
        - {id: p08-b04, speaker: narrator, text: 梅没有立刻订下家规，只问琳娜哪些忙愿意继续帮。一家人第一次把这件事当作需要共同商量的选择。}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: 三天后又下雨，厨房天花板角落的湿痕从巴掌大扩到灯边，一滴水落进金属碗。陈伟站在门口拍下照片。他知道看不见墙里和屋顶，便只记录湿痕变化，没有断言水从哪里来。此前两次报修，系统都只回复已受理。水一到灯边，梅马上打给大楼的紧急维修值班，请他们派合格电工处理。琳娜进门时，父母正拦着所有人，不让谁走进厨房。}
        - {id: p09-b02, speaker: mei, text: 别靠近，谁也不要碰灯和旁边的东西。}
        - {id: p09-b03, speaker: narrator, text: 配电箱在干燥的走廊里，不必经过积水，陈伟才关掉厨房电路；如果配电箱沾了水，或必须涉水才能靠近，他们就会留给电工处理。紧急维修先派电工赶来。电工隔离了受潮灯具，确认房间其余位置可以进入，但维修完成前仍让这条电路断电。直到这时，一家人才把日期和照片摆上桌，等房东检查漏水原因。}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: 陈伟按自己的顺序准备：先谢谢对方上门，再说两次报修、几段晴天、三场雨和湿痕扩大，最后说明不确定是楼上水管还是屋顶。他要的是检查日期，不是先争谁该负责。琳娜把这些内容压成几条英文要点。爸爸那段客气话，在中文里不只是礼貌，也是在表明愿意合作；到了她的纸上，只剩一句谢谢你来。梅敲了敲被删短的地方。}
        - {id: p10-b02, speaker: mei, text: 你爸不是绕圈子，他是在告诉对方，我们想一起解决。}
        - {id: p10-b03, speaker: narrator, text: 楼梯上传来脚步声。琳娜想到诊所口译员一字一句保留停顿的样子，又担心房东借客气含糊过去。她想说一句让人无法回避的话。}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: 布鲁克斯先生提着手电进门，先朝琳娜问到底出了什么问题。暴雨后，他已经接到几户报修，预想这里也是一场说不清的抱怨。陈伟先感谢他赶来，再开始说明日期。房东听不懂普通话，只等琳娜开口。琳娜跳过前半段，直接说。}
        - {id: p11-b02, speaker: lina, text: 我们报了两次，到现在什么都没处理。}
        - {id: p11-b03, speaker: narrator, text: 事实并没有凭空改变，位置和口气却变了。房东听见的是住户代表在追究失职，脸立刻绷紧。陈伟以为女儿仍在转达那份有礼而谨慎的要求，不明白对方为何突然防备。两个人都看着琳娜，只有她知道，话从爸爸那里走到房东面前时，已经换了站姿。}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: mr-brooks, text: 没查出原因，我怎么修？}
        - id: p12-b02
          speaker: narrator
          content:
            - text: 琳娜把这听成推脱，陈伟只听见很快的英语，从表情猜测自己的礼貌不起作用。琳娜随即换成她和学校办公室交涉时常用的
            - vocabulary: {id: linguistic-register, text: 语体}
            - text: ：说话会因场合、目的和听者而改变用词与句式。
        - {id: p12-b03, speaker: lina, text: 我们需要留下正式检查记录。}
        - {id: p12-b04, speaker: narrator, text: 那几个词给请求增加了分量，也让琳娜显得比实际年龄更大、更肯定。房东问他们是否认定是屋顶漏水。琳娜本可以顺势回答是。她看着爸爸的照片，明白照片只能证明下雨后湿痕变化，不能证明墙外的原因。}
        - {id: p12-b05, speaker: lina, text: 没有。我爸爸的意思是，请懂行的人检查后再判断。}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: 布鲁克斯先生把这次纠正当成了退让，神色稍微缓和。他照了照湿痕，判断楼上浴室更可疑。陈伟的问题很长：这几场雨的时间和湿痕变化是否对应，楼上住户不在时水管还会不会漏，表面干了以后墙内是否仍可能有水。琳娜只问还可能是屋顶吗。房东说不可能，收起手电。爸爸愣住了。他问的不是一道只能答是或不是的题，而是两种解释准备怎样排查。琳娜眼看会面要匆匆结束，终于请房东等一下。她用普通话告诉爸爸，自己刚才实际问了什么。陈伟皱起眉。}
        - {id: p13-b02, speaker: wei, text: 那只是我问题中的一小块。剩下的呢？}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: 梅抬手拦住女儿的解释，先把顺序重新摆好：湿痕在周六下雨后出现，楼上住户周五已经离开；周日下午表面摸着干了，周二再下雨时边缘又变深。这些现象不能单独指出漏水来源，却能说明只看一眼不够。她让琳娜不要急着替全家得出结论，而要把观察过的过程留给房东。}
        - {id: p14-b02, speaker: mei, text: 还有，我们说不知道，也要照样说出去。}
        - {id: p14-b03, speaker: narrator, text: 不确定在房东耳里也许显得没有力量，在她看来却正是必须检查的理由。琳娜把时间线完整译完，又明确说。}
        - {id: p14-b04, speaker: lina, text: 我们在这个房间里看不出水从哪儿来。}
        - {id: p14-b05, speaker: narrator, text: 布鲁克斯先生重新打开手电。}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: 谈话慢下来以后，陈伟终于能自己掌握顺序。他出示一张照片，等琳娜译完，再换下一张。房东发现几场雨后湿痕的边缘位置不同，便检查靠近楼上水管的一侧墙面。他仍认为浴室漏水的可能性较大，但不再把判断当成已经证实的结果。他提出当晚先测墙内湿度；如果数值仍高，第二天上午再查外墙和屋顶。琳娜没有替父母立刻说可以。她译完方案，安静等着。陈伟逐项问谁来检查、查哪些地方、什么时候通知结果。琳娜把问题译得直接，却保留了爸爸平稳的口气。布鲁克斯先生逐一回答，并在手机上约好时间。}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: 仪器显示天花板后面仍有潮湿材料，却不能指出水走过的路线。房东因此同时安排了水管和屋顶检查。当晚没有完成维修，谁也没有把约定说成结果。真正改变的是下一步：一句什么都没处理，变成了有日期的观察、两种待查原因、明确的检查项目和再次联系的时间。}
        - id: p16-b02
          speaker: narrator
          content:
            - text: 琳娜在红本子上圈出
            - vocabulary: {id: omission, text: 遗漏}
            - text: 两个字。遗漏不一定是说谎，它可能来自赶时间、顾面子或害怕麻烦；但少掉的内容会重新分配责任。她把刚才剪掉的问题补全，没有写一句自我批评，也没有总结道理，只记下第二天的检查时间，免得未完成的事再次消失。
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: 又过一周，琳娜抱着学习档案等在学校会议室外。历史课要求比较两家报纸怎样报道同一场罢工，她根据老师批注重写了两遍。她希望阿尔瓦雷斯老师看到的是自己怎样处理来源，而不只是最后的高分。父母下班后匆匆赶来，脸上有掩不住的骄傲。预约邮件里其实提供了语言协助选项，琳娜确认时间时直接跳了过去。家长会她从初中起就会译，似乎没有必要再麻烦别人。可这场会谈说的是她。这个事实在门外很清楚，一坐到桌边却容易被忘掉。琳娜把红本子放在学习档案旁边：一本装着全家的问题，另一本保存她自己选择、修改过的文章。}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: 阿尔瓦雷斯老师先谈成绩、辩论队和琳娜帮助新生家庭的表现，语气亲切，节奏很快。琳娜把三个例子合成一句学校觉得她很负责。老师从流利回答中看见自信和带领别人的能力；梅听到的却是一项又一项额外事务，心里计算这些事有多少跟着女儿回了家。陈伟想问历史文章，琳娜还没把问题译给老师，就先替老师回答起来。}
        - {id: p18-b02, speaker: lina, text: 她说我比较资料的方法很好。}
        - {id: p18-b03, speaker: narrator, text: 其实老师还没说到那篇文章。这个猜测多半不会错，却抢先填满了别人本可使用的停顿。老师欣赏琳娜的从容，梅却问。}
        - {id: p18-b04, speaker: mei, text: 在这场会上，你什么时候才是学生？}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: 琳娜起初把妈妈的问题留在普通话里，阿尔瓦雷斯老师已经转向下学期选课。梅再次开口，说女儿因为陪爸爸看病错过测验，平时还常替家里打电话，作业只能拖到很晚。她不是说琳娜成绩差，而是怀疑学校一面赞扬她帮助别人，一面没有看见这份能干占去的时间。}
        - {id: p19-b02, speaker: lina, text: 我妈妈担心我太忙。}
        - {id: p19-b03, speaker: narrator, text: 老师立刻建议怎样安排时间。梅抿紧嘴，琳娜知道回答落错了地方。她叫停谈话，把自己刚才没有译出的部分补上。老师看了看学习档案、红本子和琳娜父母，慢慢说。}
        - {id: p19-b04, speaker: ms-alvarez, text: 我请你们来谈琳娜，却让琳娜一个人扛起了整场会谈。}
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          content:
            - text: 阿尔瓦雷斯老师联系学区语言服务部门。十分钟后，一位刚结束附近会议的口译员走进来。她没有坐在桌子正中，而是稍稍侧开，让家长、学生和老师能彼此面对。开始前，她说明自己会完整传达原话，保留意思与语气，遇到含糊之处就明说，并保持
            - vocabulary: {id: impartial, text: 公正}
            - text: 。她不替家长提建议，也不替老师把理由说得更有说服力。
        - {id: p20-b02, speaker: narrator, text: 这些话和诊所里的介绍相似，这次谈论的主角却是琳娜本人。她合上红本子。老师问起错过的测验，陈伟以父亲身份回答，梅直接追问学校安排，琳娜不必再判断哪一种担心应该被说轻一点。}
    - id: p21
      illustration: p21
      blocks:
        - {id: p21-b01, speaker: narrator, text: 不用承担口译以后，琳娜终于讲起自己的历史文章。两篇报道都写同一场罢工，一篇先写交通中断，把工人称为制造混乱的人；另一篇先写工作场所的安全隐患，让工人自己说明理由。它们并非每句话都互相矛盾，却通过不同开头、动词和引语位置，引导读者先同情不同的人。老师问她怎样发现这些选择，琳娜翻开档案，逐一指出证据。梅听完口译，轻轻笑了。}
        - {id: p21-b02, speaker: mei, text: 原来你在学校研究的，就是我们天天请你做的事。}
        - {id: p21-b03, speaker: narrator, text: 琳娜从这句话里听见亲近，也听见担心和一点难为情。她回答。}
        - {id: p21-b04, speaker: lina, text: 文章改完还能回头检查；现场说出去以后，别人已经在回应我做出的那个版本。}
        - {id: p21-b05, speaker: narrator, text: 口译员原样传过去，没有把比较说得更漂亮。}
    - id: p22
      illustration: p22
      blocks:
        - {id: p22-b01, speaker: narrator, text: 回家路上，红本子拿在陈伟手里。一家人回想三场会面，却没有硬把它们归成一个结论。诊所里，琳娜的速度藏掉了细节，她的迟疑也促使医生改变流程；厨房里，没有语言专业人员来接手沟通，琳娜的双语能力确实帮助大家约到检查；学校里，正因为她表现得太可靠，大人才更容易忘记她也是被讨论的学生。同样是帮忙，在不同房间里并不是同一件事。}
        - {id: p22-b02, speaker: lina, text: 我不想从此什么都不帮。}
        - {id: p22-b03, speaker: narrator, text: 梅回答，愿意帮和默认该帮不能混为一谈。陈伟也不希望自己的犹豫被修成并不存在的勇敢。他们决定以后先看事情有多重要、能否获得服务，也要问琳娜是否愿意，而不是只看谁答得最快。}
    - id: p23
      illustration: p23
      blocks:
        - {id: p23-b01, speaker: narrator, text: 这项约定回到厨房后变得很具体。买东西、问路线之类的日常小事，琳娜可以答应，也可以拒绝或要求多一点准备时间。看病和家长会，父母主动申请现有的语言服务。其他场合若仍由琳娜帮忙，她遇到不清楚的说法就公开追问，不再偷偷选一个最省事的解释。父母会每说一小段便停下来，望着真正的谈话对象，也把自己的问题按顺序记好。陈伟对着诊所电话练习怎样申请普通话口译，梅另列了一张房屋检查清单。琳娜帮爸爸改了一个英语说法，便回去复习化学。专业人员可能迟到，某些语种也可能一时找不到；普通小事还会突然变得重要。新办法不能消除所有麻烦，只让他们能一起发现变化发生在什么时候。}
    - id: p24
      illustration: p24
      blocks:
        - {id: p24-b01, speaker: narrator, text: 两周后，梅给诊所打电话，替陈伟约复诊。前台接听时，她说出练过的那句话，随后等普通话口译接入。陈伟坐在旁边，手里是自己的问题单。琳娜在桌子另一头做作业，距离近得足以在电话中断时帮忙，却不再夹在每一把声音之间。她听见妈妈说明预约目的，听见口译员传达，也听见前台直接回应妈妈。红本子摊在几份资料之间，三个标签分别夹着诊所、住房和学校记录。琳娜算完一道化学题，陈伟又往自己的纸上添了一个问题。通话结束后，梅先同丈夫核对时间，最后才转向女儿，问那天会不会耽误上课。琳娜看了看自己的日程，以女儿的身份回答了她。}
