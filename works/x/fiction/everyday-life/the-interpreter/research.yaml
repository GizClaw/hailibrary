schema_version: 1
required: true
fictional_scope: >-
  Lina Chen, her family, every professional, the clinic visit, apartment leak,
  school conference, dialogue, dates, symptoms, repair response, and outcome are
  invented. The story is set in the United States but does not identify a state
  or claim that every clinic, landlord, or school follows one identical process.
  The landlord scene makes no claim that private landlords universally owe the
  same language services as covered health programs or public schools.
sources:
  - url: https://www.hhs.gov/sites/default/files/ocr-dcl-section-1557-language-access.pdf
    title: Language Access Provisions of the Final Rule Implementing Section 1557 of the Affordable Care Act
    publisher: U.S. Department of Health and Human Services, Office for Civil Rights
    supports: >-
      Covered health entities must provide timely, free language assistance when
      required; qualified interpreters must interpret effectively, accurately,
      and impartially using necessary specialized vocabulary; covered entities
      generally may not rely on minor children to interpret except temporarily
      in a narrowly defined emergency while a qualified interpreter is found.
  - url: https://www.ed.gov/sites/ed/files/about/offices/list/ocr/docs/dcl-factsheet-lep-parents-201501.pdf
    title: Information for Limited English Proficient Parents and Guardians and for Schools and School Districts that Communicate with Them
    publisher: U.S. Department of Justice Civil Rights Division and U.S. Department of Education Office for Civil Rights
    supports: >-
      Schools must communicate important school information, including
      parent-teacher conferences, in a language parents can understand; they
      must provide free assistance from appropriate and competent people and may
      not rely on students, siblings, friends, or untrained staff to interpret.
  - url: https://pubmed.ncbi.nlm.nih.gov/36190758/
    title: 'Language brokering and immigrant-origin youth''s well-being: A meta-analytic review'
    publisher: American Psychologist record in PubMed, U.S. National Library of Medicine
    supports: >-
      A meta-analysis of 65 studies found mixed and generally small associations
      between brokering frequency and youth outcomes, while positive or negative
      feelings about brokering were stronger predictors. The story therefore
      avoids treating family interpreting as inherently empowering or harmful.
  - url: https://pubmed.ncbi.nlm.nih.gov/28929398/
    title: 'Language Brokering among Latino Immigrant Families: Moderating Variables and Youth Outcomes'
    publisher: Journal of Youth and Adolescence record in PubMed, U.S. National Library of Medicine
    supports: >-
      In one study of 362 adolescents, brokering in high-stakes situations was
      associated with more perceived stress and lower academic achievement,
      whereas everyday brokering was associated with academic benefits and not
      with stress. The story uses this as a reason to distinguish casual errands
      from consequential health and school conversations, not as a causal rule
      about any individual teenager.
  - url: https://pubmed.ncbi.nlm.nih.gov/28144769/
    title: The Adolescent Health Care Broker-Adolescents Interpreting for Family Members and Themselves in Health Care
    publisher: Journal of Community Health record in PubMed, U.S. National Library of Medicine
    supports: >-
      Adolescent health-care brokering includes interpreting spoken medical
      information and tasks such as discussing prescriptions; reported tasks
      and emotions vary widely, and access to interpreting support can be
      inconsistent. The fictional clinic scene does not reproduce study cases.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4041685/
    title: Measurement Equivalence of the Language Brokering Scale for Chinese American Adolescents and their Parents
    publisher: Journal of Family Psychology via PubMed Central
    supports: >-
      Chinese American adolescents and parents may perceive language-brokering
      experiences differently, including feelings of efficacy and burden. This
      supports rotating perspective rather than assigning one authoritative
      emotional interpretation to the family.
  - url: https://www.merriam-webster.com/dictionary/register
    title: Register Definition and Meaning
    publisher: Merriam-Webster
    supports: >-
      In its linguistic sense, register is a variety of language used in a
      particular social context; it supports the target term and its story use.
  - url: https://dictionary.cambridge.org/grammar/british-grammar/register
    title: Register
    publisher: Cambridge Dictionary
    supports: >-
      Register varies with purpose, context, and audience and can be recognized
      through vocabulary and grammar; this corroborates the linguistic sense.
  - url: https://www.merriam-webster.com/dictionary/omission
    title: Omission Definition and Meaning
    publisher: Merriam-Webster
    supports: >-
      Omission means something left out or the act or state of leaving something
      out, supporting the target term's precise narrative sense.
  - url: https://www.merriam-webster.com/dictionary/impartial
    title: Impartial Definition and Meaning
    publisher: Merriam-Webster
    supports: >-
      Impartial means not biased or partial, supporting the target adjective and
      the professional interpreter's obligation not to favor one speaker.
  - url: https://dictionary.cambridge.org/us/dictionary/english/interpreter
    title: Interpreter
    publisher: Cambridge Dictionary
    supports: >-
      An interpreter changes what someone is saying into another language; the
      entry supplies the contemporary sense and U.S. pronunciation.
  - url: https://zdic.net/hans/%E8%AF%AD%E4%BD%93
    title: 语体词语解释
    publisher: 汉典
    supports: 语体读作yǔ tǐ；其语言学用法指随交际领域、对象和环境而形成的语言运用特点。
  - url: https://zdic.net/hans/%E9%81%97%E6%BC%8F
    title: 遗漏词语解释
    publisher: 汉典
    supports: 遗漏读作yí lòu，可指应当包含的内容被漏掉，符合故事中的信息缺失义。
  - url: https://zdic.net/hans/%E5%85%AC%E6%AD%A3
    title: 公正词语解释
    publisher: 汉典
    supports: 公正读作gōng zhèng，指公平正直、没有偏私，符合口译不偏向任一方的语境。
  - url: https://www.zdic.net/hans/%E5%8F%A3%E8%AF%91
    title: 口译词语解释
    publisher: 汉典
    supports: 口译指把一种语言的口头表达转成另一种语言的口头表达，支持合格口译员词条的核心职业概念。
  - url: https://www.cdc.gov/natural-disasters/response/what-to-do-protect-yourself-from-electrical-hazards.html
    title: What to Do to Protect Yourself From Electrical Hazards
    publisher: U.S. Centers for Disease Control and Prevention
    supports: >-
      When circuits or electrical equipment are wet or near water, occupants should
      turn off power at the breaker only when they can reach it without entering
      water, call an electrician otherwise, and keep power off until a qualified
      electrician has inspected the equipment.
  - url: https://www.sandwell.gov.uk/tenanthandbook/tenant-handbook/step-step-guide-common-repairs
    title: Your step by step guide to the most common repairs
    publisher: Sandwell Metropolitan Borough Council
    supports: >-
      Water near electrical fittings calls for switching off the electricity at
      the mains, leaving affected items off until repair, and reporting serious
      electrical risks immediately for urgent assistance.
notes: >-
  Research supports institutional responsibilities, safe isolation of wet
  electrical equipment, and the mixed, contextual
  experience of youth language brokering. It does not prove what Lina feels or
  cause any fictional outcome. The story marks Lina's interpretations as choices
  under pressure and lets each participant revise a mistaken assumption through
  concrete interaction rather than through a general moral. The clinic's frequency
  clarification is a fictional example of asking for a precise count; it does not
  claim that a particular Mandarin expression has two established lexical senses.
  The school scene describes accuracy, tone, impartiality, and transparent
  clarification without prescribing first-person interpreting as a universal
  procedure.
