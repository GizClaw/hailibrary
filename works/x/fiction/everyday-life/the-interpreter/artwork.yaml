schema_version: 1
style: watercolor-gouache
aspect_ratio: '3:2'
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  lina: Fifteen-year-old Chinese American girl, oval warm-beige face, dark brown eyes, straight black low ponytail, mustard-yellow cardigan, cream T-shirt, deep teal ankle pants, white canvas shoes, coral-red spiral notebook with blank pages.
  mei: Chinese woman early forties, softly square warm-beige face, chin-length wavy black hair, dusty-rose blouse, navy trousers, tan flats, moss-green cloth handbag.
  wei: Chinese man mid-forties, rectangular warm-beige face, short black hair graying at temples, thin round glasses, slate-blue overshirt, pale gray shirt, charcoal trousers, brown shoes.
  dr_patel: South Asian woman late thirties, medium-brown skin, black hair in neat low bun, white clinical coat, forest-green blouse, dark trousers, plain silver stethoscope.
  mr_brooks: White man early fifties, fair freckled skin, receding sandy hair, short ginger-brown beard, rust-brown work jacket, pale blue shirt, khaki trousers, dark boots, plain metal flashlight.
  ms_alvarez: Latina woman forties, medium olive skin, shoulder-length curly dark brown hair, plum cardigan, cream blouse, gray skirt, black flats.
  interpreter: Chinese woman thirties, round light-warm face, short black bob, cobalt-blue blazer, light gray top; same identity on tablet and at school.
  recurring_objects: Coral-red spiral notebook with entirely blank pages; plain dark tablet with no interface text; moss-green handbag; apartment ceiling stain with no signage.
  palette: Warm ochre and coral for family, deep teal and cobalt for language-support moments, soft gray-blue institutional rooms, muted moss and rust at the apartment.
assets:
  - {id: cover, file: artwork/cover.webp, scene: "Lina stands in the center of one continuous room that opens into a clinic, an apartment kitchen, and a school office; her parents face her from one side while three adults listen from the other, and her blank coral notebook rests open in her hands without readable marks."}
  - {id: p01, file: artwork/p01.webp, scene: "Early morning at the Chen kitchen table; Lina closes her schoolbook while Wei slides a clinic appointment card turned face-down toward her and touches his upper abdomen, as Mei watches, with all printed surfaces blank or hidden."}
  - {id: p02, file: artwork/p02.webp, scene: "Mei watches Lina pack the coral notebook into her backpack beside untouched breakfast bowls, seeing both daughter and family helper in the same quiet domestic moment."}
  - {id: p03, file: artwork/p03.webp, scene: "Lina sits between her parents on a city bus, rehearsing with a blank notebook while buildings pass outside; no route numbers, advertisements, or signs are visible."}
  - {id: p04, file: artwork/p04.webp, scene: "In a clinic waiting room, Wei fills the space between his hands to describe discomfort while Lina listens and Mei watches his expression; all forms and wall displays are blank."}
  - {id: p05, file: artwork/p05.webp, scene: "In the exam room, Dr Patel addresses Wei while Lina leans forward to interpret and Mei sits close, with Lina's coral notebook open to blank pages."}
  - {id: p06, file: artwork/p06.webp, scene: Dr Patel gently turns a plain tablet toward Wei; the professional interpreter appears on the blank-interface screen while Lina eases back in her chair.}
  - {id: p07, file: artwork/p07.webp, scene: Wei speaks directly toward the tablet interpreter while Dr Patel listens and Lina watches her father use fuller gestures than before.}
  - {id: p08, file: artwork/p08.webp, scene: "Outside the clinic in soft daylight, the family pauses on a bench; Lina holds the closed coral notebook while her parents speak to her rather than handing her another task."}
  - {id: p09, file: artwork/p09.webp, scene: "After rain, the family studies a spreading damp patch near their apartment kitchen light from the doorway; Wei photographs it from a safe distance while everyone keeps away from the affected fixture, and the phone screen shows only the abstract stain with no interface text."}
  - {id: p10, file: artwork/p10.webp, scene: "At the kitchen table, Wei arranges a blank calendar, a bowl catching drips, and several blank repair receipts while explaining the sequence to Lina and Mei."}
  - {id: p11, file: artwork/p11.webp, scene: "Mr Brooks enters the apartment with a metal flashlight and glances from the ceiling stain to Lina, assuming she will lead the conversation while her parents stand beside her."}
  - {id: p12, file: artwork/p12.webp, scene: "Lina pauses between her father's careful gestures and Mr Brooks's impatient stance, selecting how to carry the father's formal tone into direct English; the blank coral notebook anchors the scene."}
  - {id: p13, file: artwork/p13.webp, scene: "Mr Brooks's defensive posture begins to ease as he examines the stain, while Wei looks puzzled after Lina reduces his layered question and Mei studies both men's reactions beneath the damp ceiling."}
  - {id: p14, file: artwork/p14.webp, scene: "Mei quietly stops Lina with one open hand, then points to the bowl, the rain-dark window, and the ceiling patch to restore the sequence of events."}
  - {id: p15, file: artwork/p15.webp, scene: "Wei presents his photographs one at a time while Lina interprets beside him; Mr Brooks compares the changing edges of the damp stain and examines the wall with his flashlight, with all notebook pages remaining blank."}
  - {id: p16, file: artwork/p16.webp, scene: "Mr Brooks places an unmarked inspection tool beside the bowl and uses his phone to schedule a visit while the family watches, the repair outcome still pending."}
  - {id: p17, file: artwork/p17.webp, scene: "Lina waits outside the school conference room holding a portfolio folder to her chest, eager to discuss her own work while her parents arrive together."}
  - {id: p18, file: artwork/p18.webp, scene: "In the school office, Ms Alvarez warmly praises Lina across a round table as Lina begins interpreting for her parents; portfolios and wall displays contain no visible writing."}
  - {id: p19, file: artwork/p19.webp, scene: Mei turns toward Lina with a serious question about missed study time while Lina looks down at her portfolio and Ms Alvarez realizes the conversation concerns Lina herself.}
  - {id: p20, file: artwork/p20.webp, scene: "The professional interpreter in cobalt blue joins the school table in person and sits slightly aside so Mei, Wei, Ms Alvarez, and Lina can face one another directly."}
  - {id: p21, file: artwork/p21.webp, scene: "With the interpreter working, Lina presents a blank-page portfolio image while her parents listen as parents and Ms Alvarez listens as counselor, each person's gaze directed to Lina."}
  - {id: p22, file: artwork/p22.webp, scene: "Walking home at dusk, Lina and her parents share the coral notebook; three blank page tabs divide clinic, apartment, and school memories without any symbols or writing."}
  - {id: p23, file: artwork/p23.webp, scene: "At home, Wei practices a question into a phone set for an interpreter call while Mei makes her own blank list and Lina studies at the other end of the table."}
  - {id: p24, file: artwork/p24.webp, scene: "Final warm kitchen scene; Mei completes a clinic call using speakerphone language support, Wei checks the blank question list, and Lina remains nearby doing homework rather than interpreting."}
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - Opened the final compressed cover and every page WebP; no readable text, letters, numbers, logos, captions, speech bubbles, or watermarks were visible.
      - Compared every image with its declared scene and recurring character identities; the cover landlord was regenerated to remove an inconsistent cap.
      - Confirmed the watercolor-gouache treatment, 3:2 landscape framing, shared palette, and recurring family clothing across the sequence.
