schema_version: 2
language: zh-CN
writer: 明日镜
title: 天空中的洞
summary: >-
  一条来自大气化学的预警、一份出乎意料的南极观测记录和一套不断调整的国际规则，构成了持续半个多世纪的调查。臭氧层已经出现恢复迹象，但不同地区的回归年份仍是带有条件和范围的预测，不能理解为臭氧洞会按期消失的保证。
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            每到南极春季，观测图上常会出现一大片深色区域，人们把它叫作“臭氧洞”。这个名字很醒目，却容易带来误解：天空没有裂开，那里也不是完全没有臭氧，而是这片区域上空的臭氧总量降得特别低。
        - text: >-
            真正的问题比“一个洞”复杂得多。科学家需要说明，地面附近使用的化学物质怎样到达高空，为什么南极的损耗最强。停产以后，旧物质为何还能影响几十年？各国采取行动后，又怎样判断变化是否确实来自各国共同采取的行动？
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            臭氧分子由三个氧原子组成。大气中的臭氧大多集中在平流层，主要分布在距地面约十五到三十五千米的高度。它吸收太阳发出的许多中波紫外线，使这些能伤害生物的辐射不至于全部到达地面。
        - text: >-
            臭氧减少，地面接收到的中波紫外线就会增加，人的皮肤和眼睛、农作物以及水中的微小生物都可能受到影响。不过，臭氧层并不是一面固定的墙。臭氧一直在生成、分解和流动，研究者测到的是这些过程共同留下的结果。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: >-
                二十世纪的冰箱、空调、泡沫材料和喷雾产品曾广泛使用一类稳定的化合物，其中重要的一类叫作
            - vocabulary: {id: chlorofluorocarbon, text: 氯氟烃}
            - text: >-
                ，英文缩写是 CFC。这些物质含有氯、氟和碳，在地面附近不易燃，也不容易与别的物质反应。
        - text: >-
            当年的优点后来成了麻烦。许多氯氟烃不会轻易被雨水和低层大气中的反应清除，能随空气缓慢上升。制冷设备泄漏的氯氟烃不会只停留在机器旁，也不会停在排放国的上空。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            二十世纪七十年代初，马里奥·莫利纳来到加利福尼亚大学欧文分校，加入舍伍德·罗兰的实验室。两人追问一个当时并不起眼的问题：这些稳定的化合物最后会到哪里去？
        - text: >-
            地面条件下的“稳定”，并不保证它到了高空仍然不变。莫利纳和罗兰把化合物的长寿命、大气输送和平流层中的强紫外线联系起来。他们没有等到全球性损害真的出现，而是依据已知的化学反应，推演这些物质进入高空后会发生什么。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            一九七四年六月，两人在《自然》发表论文，提出氯氟烃最终会在平流层分解。高空的强紫外线能够拆开氯氟烃分子，释放出有反应能力的氯原子，而那里恰好也是臭氧发挥保护作用的区域。
        - text: >-
            氯原子能同臭氧反应，生成普通氧气和一氧化氯；后续反应又会放出氯。关键不在于氯只破坏一个臭氧分子，而在于它可以重新回到有反应能力的状态，继续参与下一轮反应。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: >-
                化学家把这种反复进行、并让催化物质重新出现的反应路径称为
            - vocabulary: {id: catalytic-cycle, text: 催化循环}
            - text: >-
                。一个氯原子在变成较稳定的储存形态以前，可以影响许多臭氧分子，因此少量活性氯也可能造成大范围的臭氧损耗。
        - text: >-
            这套机制还解释了时间上的延迟。长寿命氯氟烃要经过多年才进入平流层，含氯物质也不会在工厂停产那天从大气中消失。减少新的排放十分必要，却不能把过去几十年放出的分子一下子收回来。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            莫利纳和罗兰在一九七四年并没有发现南极臭氧洞。他们说明的是一条可能发生的机制：持续增加的氯氟烃会把氯送入平流层，并加快臭氧损耗。早期计算还无法涵盖真实大气中的每一层高度、每一种风和全部化学反应。
        - text: >-
            模型有限，不等于预警没有根据。若一种物质能停留几十年，机制证据足以让人提前担心；但损耗会在何处最强、规模有多大，仍需观测检验。此时，化学推理和环境测量是两条相关却不能互相代替的证据线。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            英国科学家从一九五七年起就在南极哈雷站测量臭氧总量。多布森臭氧分光光度计比较阳光中几段被臭氧不同程度吸收的紫外线，据此算出仪器上方整层大气中的臭氧总量。
        - text: >-
            长期观测也许多年都不会出现惊人结果，因此很容易被看成例行工作。可是，只有同一地点、同一季节和相近方法留下足够长的记录，后来出现的低值才有可靠的参照。没有早年的数据，一次异常读数也许只像仪器出了故障。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            到二十世纪八十年代初，哈雷站的春季臭氧读数已经远低于过去。乔·法尔曼、布赖恩·加德纳和乔纳森·尚克林没有看到一个低值就断言原因。他们检查仪器和观测流程，也继续把新数据同旧记录比较。
        - text: >-
            严格检查很重要，因为异常读数可能来自设备损坏、方法改变、特殊天气，也可能来自真实的环境变化。团队发现，低值随季节反复出现，而且连续多年加深。最初需要怀疑的数据，逐渐变成必须解释的趋势。
    - id: p10
      illustration: p10
      paragraphs:
        - text: >-
            一九八五年五月，法尔曼、加德纳和尚克林在《自然》发表南极观测结果。哈雷站的长记录表明，春季臭氧总量与早年相比已经大幅下降；另一座南极站的测量也说明，这不是一台仪器、一个地点才有的现象。
        - text: >-
            论文同时暴露了旧预期的缺口。当时常用于评估的模型偏重北纬三十度附近的条件，推算近期臭氧总量只会小幅变化。一个地区的计算不知不觉被当成全球答案，模型没有充分体现南极的特殊条件。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            南极数据并不符合那幅看似合理的图景。法尔曼团队没有找到足以解释全部变化的简单环流改变，于是把目光转向化学原因。他们讨论了含氯物质、严寒和南极春季特殊光照可能产生的共同作用。
        - text: >-
            不过，一九八五年的论文也没有完成整套解释。它确定了损耗的规模和季节规律，并提出需要检验的化学解释。随后，研究者开展实验室反应研究和高空采样，并结合卫星观测与更完整的模型，继续解释南极为何会加剧臭氧损耗。
    - id: p12
      illustration: p12
      paragraphs:
        - text: >-
            不同团队后来在臭氧迅速减少的空气中测到活性含氯物质。实验还发现，极地平流层云的微小粒子表面能促使较稳定的“氯储存库”转化为容易参加反应的形态。加入这些过程后，模型也能再现南极春季损耗的主要特点。
        - text: >-
            没有一种方法能够单独得出完整结论。地面仪器记录特定地点多年的变化，卫星显示影响范围，气球和飞机测量不同高度的成分，实验室则检验具体反应。这些结果共同把臭氧洞与人造含氯、含溴物质联系起来。
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: >-
                南极冬季像一间条件特殊的大气实验室。环绕极区的高空风系叫作
            - vocabulary: {id: polar-vortex, text: 极地涡旋}
            - text: >-
                ，它把南极平流层空气围在内部，减少同中纬度空气的交换。极夜期间，里面会冷到形成极地平流层云。
        - text: >-
            这种云不是人们头顶常见的雨雪云，而是形成于平流层，远高于产生日常天气的低层大气。云粒子表面提供了特殊反应场所，使原本不活跃的含氯物质转成更容易被阳光启动的形态。低温、隔离、云粒子和氯缺一不可。
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            南极春季阳光返回时，会拆开某些含氯分子，放出活性氯。此时涡旋内部依旧寒冷，催化反应便快速破坏臭氧，溴也参与其中。损耗速度超过阳光和大气输送补充臭氧的速度，观测图上的低值区于是扩大。
        - text: >-
            春季后段，平流层升温，极地涡旋逐渐减弱，南极空气开始同周围空气混合。活性氯被分散或回到较稳定的形态，臭氧总量随之上升。但季节结束后，大气中的含氯物质仍然存在，来年仍可能重新引发损耗。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            到这里，三类证据分别回答了不同问题，并共同支持这套解释。莫利纳和罗兰解释氯氟烃怎样把氯送到平流层。法尔曼团队记录出乎预料的季节性大幅下降。后续研究再说明南极云、严寒、隔离和春季阳光怎样放大反应。
        - text: >-
            因此，两个省事的说法都不准确。一九七四年的论文没有提前算出南极臭氧洞的全部特征；一九八五年的地面记录也没有独自证明今天所知的每一步机制。结论变得可靠，是因为不同证据分别补上了问题的一部分。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            各国并不是等到所有疑问消失才开始合作。一九八五年通过的《保护臭氧层维也纳公约》先建立研究、监测和信息交换的框架，当时还没有后来那套具体而有约束力的减排安排。
        - text: >-
            这个时间顺序反映了实际的权衡。若一直等待，长寿命物质会继续积累；若只按早期估计设计管控措施，并让它们长期不变，新证据又可能很快表明力度不足。即将形成的制度既要允许预防性行动，也要能根据新证据调整规则。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            一九八七年九月，各国达成《蒙特利尔议定书》，对指定氯氟烃和哈龙的生产与消费设置控制。协议还安排了贸易、数据报告、科学评估和定期审查，并在一九八九年生效。
        - text: >-
            最初的管控措施后来还要继续完善。随着证据加强，各方收紧时间表，也把更多消耗臭氧层物质纳入管理。各国原有的设备、产业条件和替代技术并不一样，所需的资金和时间也有差别。合作必须改变工业系统，不能只停在表态上。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            议定书通过持续评估、修正和调整逐步增强。控制范围扩大，淘汰时间提前，多边援助帮助发展中国家采用替代技术。对非缔约方的贸易限制也让绕开共同规则变得无利可图。后来，世界所有国家都加入了臭氧层保护条约。
        - text: >-
            这段历史常被概括成一个一帆风顺的故事：科学家发现洞，各国禁用化学品，天空就恢复了。实际过程更曲折。预警早于臭氧洞的公布，规则在谈判中演进，产业寻找替代品。长期监测既能显示治理成效，也曾检出未被申报的异常排放。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            现在的测量显示，多种受控消耗臭氧层物质在大气中的含量正在下降，来自长寿命受控物质的平流层氯和溴也已经减少。模型表明，如果没有议定书，极地臭氧损害会严重得多。
        - text: >-
            恢复信号并非处处相同。上层平流层臭氧正在增加，南极春季臭氧也出现了恢复迹象，可是每年的臭氧洞仍会形成。二〇二二年评估认为，南极以外地区自二十世纪九十年代中期以来的臭氧总量恢复证据仍有限，可信度较低。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            某一年的臭氧洞可能格外大，也可能格外小，因为温度、风、极地涡旋持续时间、火山颗粒和野火烟尘都会变化。一个大洞不能单独证明国际控制失效，一个小洞也不能证明恢复已经完成。
        - text: >-
            要从剧烈的年际变化中找出缓慢趋势，研究者必须依靠长记录，并让模型同时处理化学反应和大气环流。他们比较多个季节、高度和地区，还要检验受控物质下降能否解释长期变化趋势，而不是挑选最醒目的一张年度图。
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: >-
                根据模型和已知条件推算未来，得到的是
            - vocabulary: {id: projection, text: 预测结果}
            - text: >-
                ，并不保证在某个确定日期实现。二〇二二年国际评估分别估计了各地回到一九八〇年水平的时间。南纬六十度到北纬六十度的近全球平均约在二〇四〇年，北极约在二〇四五年，南极约在二〇六六年。
        - text: >-
            这些年份对应不同地区，也以一九八〇年作为比较点。南极九月的二〇六六年估计以各国完全履约和一条基准温室气体路径为前提，不同模型给出的范围约为二〇四九年至二〇七七年。排放、环流、火灾和火山活动都可能改变进程。
    - id: p22
      illustration: p22
      paragraphs:
        - text: >-
            因而，现有证据支持一个有限定的结论。削减受控物质已经减轻臭氧层承受的化学压力，并推动恢复。但旧化学品仍留在空气和设备中。继续履约、妥善处理存量、保持监测和更新评估，都会影响实际恢复轨迹是否落在预测范围内。
        - text: >-
            南极图上的深色区域最初是一项惊人的观测结果，并不表示天空真的受了伤。这段历史把危机出现前提出的机制、推翻旧预期的测量和不断根据证据调整的规则联系起来。如今，哈雷站和世界各地的仪器仍在观测天空，检验臭氧层是否继续恢复。
