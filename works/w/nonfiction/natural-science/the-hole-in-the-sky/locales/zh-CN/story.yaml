      illustration: p04
      blocks:
        - {id: p04-b01, speaker: narrator, text: "二十世纪七十年代初，马里奥·莫利纳来到加利福尼亚大学欧文分校，加入舍伍德·罗兰的实验室。两人追问一个当时并不起眼的问题：这些稳定的化合物最后会到哪里去？"}
        - {id: p04-b02, speaker: narrator, text: "地面条件下的“稳定”，并不保证它到了高空仍然不变。莫利纳和罗兰把化合物的长寿命、大气输送和平流层中的强紫外线联系起来。他们没有等到全球性损害真的出现，而是依据已知的化学反应，推演这些物质进入高空后会发生什么。"}
    - id: p05
      illustration: p05
      blocks:
        - {id: p05-b01, speaker: narrator, text: "一九七四年六月，两人在《自然》发表论文，提出氯氟烃最终会在平流层分解。高空的强紫外线能够拆开氯氟烃分子，释放出有反应能力的氯原子，而那里恰好也是臭氧发挥保护作用的区域。"}
        - {id: p05-b02, speaker: narrator, text: "氯原子能同臭氧反应，生成普通氧气和一氧化氯；后续反应又会放出氯。关键不在于氯只破坏一个臭氧分子，而在于它可以重新回到有反应能力的状态，继续参与下一轮反应。"}
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          content:
            - text: "化学家把这种反复进行、并让催化物质重新出现的反应路径称为"
            - vocabulary: {id: catalytic-cycle, text: 催化循环}
            - text: "。一个氯原子在变成较稳定的储存形态以前，可以影响许多臭氧分子，因此少量活性氯也可能造成大范围的臭氧损耗。"
        - {id: p06-b02, speaker: narrator, text: "这套机制还解释了时间上的延迟。长寿命氯氟烃要经过多年才进入平流层，含氯物质也不会在工厂停产那天从大气中消失。减少新的排放十分必要，却不能把过去几十年放出的分子一下子收回来。"}
    - id: p07
      illustration: p07
      blocks:
        - {id: p07-b01, speaker: narrator, text: "莫利纳和罗兰在一九七四年并没有发现南极臭氧洞。他们说明的是一条可能发生的机制：持续增加的氯氟烃会把氯送入平流层，并加快臭氧损耗。早期计算还无法涵盖真实大气中的每一层高度、每一种风和全部化学反应。"}
        - {id: p07-b02, speaker: narrator, text: "模型有限，不等于预警没有根据。若一种物质能停留几十年，机制证据足以让人提前担心；但损耗会在何处最强、规模有多大，仍需观测检验。此时，化学推理和环境测量是两条相关却不能互相代替的证据线。"}
    - id: p08
      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: "英国科学家从一九五七年起就在南极哈雷站测量臭氧总量。多布森臭氧分光光度计比较阳光中几段被臭氧不同程度吸收的紫外线，据此算出仪器上方整层大气中的臭氧总量。"}
        - {id: p08-b02, speaker: narrator, text: "长期观测也许多年都不会出现惊人结果，因此很容易被看成例行工作。可是，只有同一地点、同一季节和相近方法留下足够长的记录，后来出现的低值才有可靠的参照。没有早年的数据，一次异常读数也许只像仪器出了故障。"}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: "到二十世纪八十年代初，哈雷站的春季臭氧读数已经远低于过去。乔·法尔曼、布赖恩·加德纳和乔纳森·尚克林没有看到一个低值就断言原因。他们检查仪器和观测流程，也继续把新数据同旧记录比较。"}
        - {id: p09-b02, speaker: narrator, text: "严格检查很重要，因为异常读数可能来自设备损坏、方法改变、特殊天气，也可能来自真实的环境变化。团队发现，低值随季节反复出现，而且连续多年加深。最初需要怀疑的数据，逐渐变成必须解释的趋势。"}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: "一九八五年五月，法尔曼、加德纳和尚克林在《自然》发表南极观测结果。哈雷站的长记录表明，春季臭氧总量与早年相比已经大幅下降；另一座南极站的测量也说明，这不是一台仪器、一个地点才有的现象。"}
        - {id: p10-b02, speaker: narrator, text: "论文同时暴露了旧预期的缺口。当时常用于评估的模型偏重北纬三十度附近的条件，推算近期臭氧总量只会小幅变化。一个地区的计算不知不觉被当成全球答案，模型没有充分体现南极的特殊条件。"}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: "南极数据并不符合那幅看似合理的图景。法尔曼团队没有找到足以解释全部变化的简单环流改变，于是把目光转向化学原因。他们讨论了含氯物质、严寒和南极春季特殊光照可能产生的共同作用。"}
        - {id: p11-b02, speaker: narrator, text: "不过，一九八五年的论文也没有完成整套解释。它确定了损耗的规模和季节规律，并提出需要检验的化学解释。随后，研究者开展实验室反应研究和高空采样，并结合卫星观测与更完整的模型，继续解释南极为何会加剧臭氧损耗。"}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: "不同团队后来在臭氧迅速减少的空气中测到活性含氯物质。实验还发现，极地平流层云的微小粒子表面能促使较稳定的“氯储存库”转化为容易参加反应的形态。加入这些过程后，模型也能再现南极春季损耗的主要特点。"}
        - {id: p12-b02, speaker: narrator, text: "没有一种方法能够单独得出完整结论。地面仪器记录特定地点多年的变化，卫星显示影响范围，气球和飞机测量不同高度的成分，实验室则检验具体反应。这些结果共同把臭氧洞与人造含氯、含溴物质联系起来。"}
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          content:
            - text: "南极冬季像一间条件特殊的大气实验室。环绕极区的高空风系叫作"
            - vocabulary: {id: polar-vortex, text: 极地涡旋}
            - text: "，它把南极平流层空气围在内部，减少同中纬度空气的交换。极夜期间，里面会冷到形成极地平流层云。"
        - {id: p13-b02, speaker: narrator, text: "这种云不是人们头顶常见的雨雪云，而是形成于平流层，远高于产生日常天气的低层大气。云粒子表面提供了特殊反应场所，使原本不活跃的含氯物质转成更容易被阳光启动的形态。低温、隔离、云粒子和氯缺一不可。"}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: "南极春季阳光返回时，会拆开某些含氯分子，放出活性氯。此时涡旋内部依旧寒冷，催化反应便快速破坏臭氧，溴也参与其中。损耗速度超过阳光和大气输送补充臭氧的速度，观测图上的低值区于是扩大。"}
        - {id: p14-b02, speaker: narrator, text: "春季后段，平流层升温，极地涡旋逐渐减弱，南极空气开始同周围空气混合。活性氯被分散或回到较稳定的形态，臭氧总量随之上升。但季节结束后，大气中的含氯物质仍然存在，来年仍可能重新引发损耗。"}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: "到这里，三类证据分别回答了不同问题，并共同支持这套解释。莫利纳和罗兰解释氯氟烃怎样把氯送到平流层。法尔曼团队记录出乎预料的季节性大幅下降。后续研究再说明南极云、严寒、隔离和春季阳光怎样放大反应。"}
        - {id: p15-b02, speaker: narrator, text: "因此，两个省事的说法都不准确。一九七四年的论文没有提前算出南极臭氧洞的全部特征；一九八五年的地面记录也没有独自证明今天所知的每一步机制。结论变得可靠，是因为不同证据分别补上了问题的一部分。"}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: "各国并不是等到所有疑问消失才开始合作。一九八五年通过的《保护臭氧层维也纳公约》先建立研究、监测和信息交换的框架，当时还没有后来那套具体而有约束力的减排安排。"}
        - {id: p16-b02, speaker: narrator, text: "这个时间顺序反映了实际的权衡。若一直等待，长寿命物质会继续积累；若只按早期估计设计管控措施，并让它们长期不变，新证据又可能很快表明力度不足。即将形成的制度既要允许预防性行动，也要能根据新证据调整规则。"}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "一九八七年九月，各国达成《蒙特利尔议定书》，对指定氯氟烃和哈龙的生产与消费设置控制。协议还安排了贸易、数据报告、科学评估和定期审查，并在一九八九年生效。"}
        - {id: p17-b02, speaker: narrator, text: "最初的管控措施后来还要继续完善。随着证据加强，各方收紧时间表，也把更多消耗臭氧层物质纳入管理。各国原有的设备、产业条件和替代技术并不一样，所需的资金和时间也有差别。合作必须改变工业系统，不能只停在表态上。"}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "议定书通过持续评估、修正和调整逐步增强。控制范围扩大，淘汰时间提前，多边援助帮助发展中国家采用替代技术。对非缔约方的贸易限制也让绕开共同规则变得无利可图。后来，世界所有国家都加入了臭氧层保护条约。"}
        - {id: p18-b02, speaker: narrator, text: "这段历史常被概括成一个一帆风顺的故事：科学家发现洞，各国禁用化学品，天空就恢复了。实际过程更曲折。预警早于臭氧洞的公布，规则在谈判中演进，产业寻找替代品。长期监测既能显示治理成效，也曾检出未被申报的异常排放。"}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: "现在的测量显示，多种受控消耗臭氧层物质在大气中的含量正在下降，来自长寿命受控物质的平流层氯和溴也已经减少。模型表明，如果没有议定书，极地臭氧损害会严重得多。"}
        - {id: p19-b02, speaker: narrator, text: "恢复信号并非处处相同。上层平流层臭氧正在增加，南极春季臭氧也出现了恢复迹象，可是每年的臭氧洞仍会形成。二〇二二年评估认为，南极以外地区自二十世纪九十年代中期以来的臭氧总量恢复证据仍有限，可信度较低。"}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: "某一年的臭氧洞可能格外大，也可能格外小，因为温度、风、极地涡旋持续时间、火山颗粒和野火烟尘都会变化。一个大洞不能单独证明国际控制失效，一个小洞也不能证明恢复已经完成。"}
        - {id: p20-b02, speaker: narrator, text: "要从剧烈的年际变化中找出缓慢趋势，研究者必须依靠长记录，并让模型同时处理化学反应和大气环流。他们比较多个季节、高度和地区，还要检验受控物质下降能否解释长期变化趋势，而不是挑选最醒目的一张年度图。"}
    - id: p21
      illustration: p21
      blocks:
        - id: p21-b01
          speaker: narrator
          content:
            - text: "根据模型和已知条件推算未来，得到的是"
            - vocabulary: {id: projection, text: 预测结果}
            - text: "，并不保证在某个确定日期实现。二〇二二年国际评估分别估计了各地回到一九八〇年水平的时间。南纬六十度到北纬六十度的近全球平均约在二〇四〇年，北极约在二〇四五年，南极约在二〇六六年。"
        - {id: p21-b02, speaker: narrator, text: "这些年份对应不同地区，也以一九八〇年作为比较点。南极九月的二〇六六年估计以各国完全履约和一条基准温室气体路径为前提，不同模型给出的范围约为二〇四九年至二〇七七年。排放、环流、火灾和火山活动都可能改变进程。"}
    - id: p22
      illustration: p22
      blocks:
        - {id: p22-b01, speaker: narrator, text: "因而，现有证据支持一个有限定的结论。削减受控物质已经减轻臭氧层承受的化学压力，并推动恢复。但旧化学品仍留在空气和设备中。继续履约、妥善处理存量、保持监测和更新评估，都会影响实际恢复轨迹是否落在预测范围内。"}
        - {id: p22-b02, speaker: narrator, text: "南极图上的深色区域最初是一项惊人的观测结果，并不表示天空真的受了伤。这段历史把危机出现前提出的机制、推翻旧预期的测量和不断根据证据调整的规则联系起来。如今，哈雷站和世界各地的仪器仍在观测天空，检验臭氧层是否继续恢复。"}
chapters:
  - {id: ch01, title: 流动空气组成的屏障, page_refs: [p01, p02, p03]}
  - {id: ch02, title: 臭氧洞出现以前的机制, page_refs: [p04, p05, p06, p07]}
  - {id: ch03, title: 南极记录推翻旧预期, page_refs: [p08, p09, p10, p11]}
  - {id: ch04, title: 春季阳光怎样启动活性氯, page_refs: [p12, p13, p14, p15]}
  - {id: ch05, title: 一套能够随证据改变的规则, page_refs: [p16, p17, p18]}
  - {id: ch06, title: 恢复没有统一日期, page_refs: [p19, p20, p21, p22]}
questions:
  - {id: q01, type: short-answer, speaker: narrator, prompt: “臭氧洞”表示什么，又不表示什么？, answer: 它表示南极广大区域上空的臭氧在特定季节严重减少，不表示大气中出现了一个完全空的洞。, page_refs: [p01]}
  - {id: q02, type: evidence, speaker: narrator, prompt: 氯氟烃的哪种性质既带来用途，也造成长期危险？, answer: 它们很稳定，因此适合一些工业用途，却也能在低层大气中长期存在、向上输送，最后在平流层释放氯。, page_refs: [p03, p04, p05]}
  - {id: q03, type: compare, speaker: narrator, prompt: 一九七四年论文与一九八五年论文分别提供了什么证据？, answer: 前者提出氯氟烃导致臭氧损耗的化学机制，后者用长期测量记录了南极春季大幅而反复的臭氧下降。, page_refs: [p07, p10, p15]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: 法尔曼团队为什么要先检查仪器和观测流程？, answer: 这样能排除设备损坏和方法变化等可能原因；随后反复出现的季节性低值才更能说明真实环境趋势。, page_refs: [p08, p09]}
  - {id: q05, type: source-analysis, speaker: narrator, prompt: 早期评估模型的什么做法使它难以解释南极观测？, answer: 它偏重北纬三十度附近的条件，却被当成全球估计，没有充分体现南极严寒、隔离和季节光照共同构成的特殊条件。, page_refs: [p10, p11, p13]}
  - {id: q06, type: synthesis, speaker: narrator, prompt: 极地涡旋、平流层云、含氯物质和春季阳光怎样共同造成快速损耗？, answer: 涡旋隔离严寒空气，云粒子表面把储存形态的氯转成容易启动的形态，春季阳光再释放活性氯，使催化反应迅速破坏臭氧。, page_refs: [p13, p14]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: 为什么能够定期修改的国际规则适合处理臭氧问题？, answer: 长寿命物质让等待变得危险，而科学证据和替代技术会变化，所以规则既要尽早行动，也要通过评估扩大范围和收紧时间表。, page_refs: [p16, p17, p18]}
  - {id: q08, type: evidence, speaker: narrator, prompt: 哪些迹象支持正在恢复，哪些现象仍要求谨慎？, answer: 受控物质及平流层氯溴下降、上层平流层臭氧增加支持恢复；但南极臭氧洞仍每年出现，其他地区臭氧总量的恢复证据有限且年际变化很大。, page_refs: [p19, p20]}
  - {id: q09, type: source-analysis, speaker: narrator, prompt: 解读“南极臭氧总量约在二〇六六年恢复到一九八〇年水平”这一时间估计时，需要同时说明哪些前提？, answer: 这个模型估计假定各国完全履约，并采用基准温室气体路径；比较标准是回到一九八〇年的臭氧总量，模型给出的范围约为二〇四九年至二〇七七年。, page_refs: [p21]}
  - {id: q10, type: research-response, speaker: narrator, prompt: 一则报道用某年较小的臭氧洞证明问题已经解决，研究者还应寻找什么证据？, answer: 应查看多年的分地区和分高度观测、当年温度与涡旋状况、消耗臭氧层物质的长期变化，并用同时处理化学和环流的模型区分年际波动与恢复趋势。, page_refs: [p19, p20, p21]}
