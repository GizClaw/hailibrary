questions:
  - id: q01
    type: short-answer
    speaker: narrator
    prompt: "What does the term ozone hole describe, and what does it not describe?"
    answer: "It describes a severe seasonal drop in ozone over a wide Antarctic region, not a literal empty opening through the atmosphere."
    page_refs: [p01]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which property made many CFCs useful near the ground but dangerous over long periods?
    answer: "Their chemical stability made them useful but also allowed them to persist, travel upward, and later release chlorine in the stratosphere."
    page_refs: [p03, p04, p05]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How did the nineteen seventy-four paper and the nineteen eighty-five paper contribute different evidence?
    answer: "Molina and Rowland proposed a chemical mechanism linking CFCs to ozone destruction, while Farman, Gardiner, and Shanklin documented a large recurring Antarctic spring ozone loss."
    page_refs: [p07, p10, p15]
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: Why did checking the Halley instrument strengthen the team's conclusion?
    answer: "It reduced the chance that the low readings came from damaged equipment or a changed method, while repeated seasonal measurements showed a continuing pattern."
    page_refs: [p08, p09]
  - id: q05
    type: source-analysis
    speaker: narrator
    prompt: What assumption made the earlier assessment models inadequate for the Antarctic evidence?
    answer: "Conditions modeled near thirty degrees north had been treated as though they represented the whole atmosphere, leaving out Antarctica's special cold, isolated seasonal system."
    page_refs: [p10, p11, p13]
  - id: q06
    type: synthesis
    speaker: narrator
    prompt: "How do the polar vortex, polar stratospheric clouds, chlorine, and returning sunlight interact?"
    answer: "The vortex isolates very cold air, cloud surfaces activate stored chlorine, and returning sunlight releases reactive chlorine that destroys ozone through catalytic reactions."
    page_refs: [p13, p14]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: Why was a treaty that could be revised suitable for this problem?
    answer: "Long-lived chemicals made delay risky, while changing science and technology meant controls needed regular assessment, expansion, and tighter schedules."
    page_refs: [p16, p17, p18]
  - id: q08
    type: evidence
    speaker: narrator
    prompt: "What evidence supports recovery, and what evidence requires caution?"
    answer: "Controlled substances and stratospheric chlorine and bromine are declining and upper-stratospheric ozone is rising, but the Antarctic hole still forms and total-column recovery outside Antarctica has limited evidence and large variability."
    page_refs: [p19, p20]
  - id: q09
    type: source-analysis
    speaker: narrator
    prompt: What assumptions must accompany the Antarctic return estimate near twenty sixty-six?
    answer: "It assumes full Montreal Protocol compliance, a baseline greenhouse-gas scenario, return to nineteen eighty total ozone values, and a model range affected by circulation and other emissions or events."
    page_refs: [p21]
  - id: q10
    type: research-response
    speaker: narrator
    prompt: A news report calls one unusually small annual hole proof that the ozone problem is solved. What evidence should a researcher seek before accepting that claim?
    answer: "The researcher should examine many years of regional and altitude-specific ozone observations, weather and vortex conditions, ozone-depleting substance trends, and models that separate annual variability from long-term recovery."
    page_refs: [p19, p20, p21]
