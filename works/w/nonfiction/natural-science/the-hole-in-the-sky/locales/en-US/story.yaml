        - {id: p19-b01, speaker: narrator, text: "Measurements now show that the atmospheric abundance of many controlled ozone-depleting substances is declining. Chlorine and bromine from long-lived controlled substances have also begun to fall in the stratosphere. Models indicate that without the Protocol, polar ozone damage would have become much worse."}
        - {id: p19-b02, speaker: narrator, text: "Signs of recovery do not look the same everywhere. Upper-stratospheric ozone is increasing, and Antarctic spring ozone shows signs of recovery, yet the annual hole still forms. Outside Antarctica, evidence for recovery in total column ozone since the mid-nineteen nineties remained limited and was judged with low confidence in the twenty twenty-two assessment."}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: "One year's ozone hole can be unusually large or small because temperature, winds, the strength and duration of the vortex, volcanic particles, and wildfire smoke vary. A large hole in one year does not prove that international controls have failed. A small hole does not prove that recovery is complete."}
        - {id: p20-b02, speaker: narrator, text: "Detecting a slow trend beneath large yearly changes requires long observations and models that represent chemistry and circulation together. Researchers compare many seasons, altitudes, and regions. They also test whether declining ozone-depleting substances can explain the direction of change rather than choosing the most dramatic annual map."}
    - id: p21
      illustration: p21
      blocks:
        - id: p21-b01
          speaker: narrator
          content:
            - text: "Scientists use a special term for a future result calculated by a model: "
            - vocabulary: {id: projection, text: projection}
            - text: ". It is conditional, not a dated promise. The twenty twenty-two international assessment estimated returns to nineteen eighty total ozone values around twenty forty for the near-global average, twenty forty-five for the Arctic, and twenty sixty-six for Antarctica."
        - {id: p21-b02, speaker: narrator, text: "Those dates describe different regions and a particular comparison point. The Antarctic September estimate was about twenty sixty-six under full compliance and a baseline greenhouse-gas scenario, with models spanning roughly twenty forty-nine to twenty seventy-seven. Different greenhouse-gas paths, atmospheric circulation, uncontrolled emissions, fires, or eruptions can shift the result."}
    - id: p22
      illustration: p22
      blocks:
        - {id: p22-b01, speaker: narrator, text: "The strongest conclusion is therefore qualified. Cutting controlled ozone-depleting substances has reduced the chemical pressure on the ozone layer and set recovery in motion. Because old chemicals remain in the air and stored equipment, continued compliance, safe handling, measurement, and updated assessment still affect how closely the future follows the projections."}
        - {id: p22-b02, speaker: narrator, text: "The dark Antarctic map began as an alarming observation, not a literal wound. Its history links a mechanism proposed before the crisis was visible, measurements that overturned earlier expectations, and controls repeatedly updated as evidence changed. At Halley and stations around the world, instruments continue measuring ozone to test whether recovery continues."}
