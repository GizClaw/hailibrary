schema_version: 1
required: true
scientific_scope: >-
  The work follows the evidence chain from the 1974 Molina-Rowland CFC mechanism
  through the 1985 British Antarctic Survey observations, the later explanation
  of Antarctic polar chemistry, the Montreal Protocol's evolving controls, and
  the 2022 international assessment's conditional regional recovery projections.
  It treats the ozone hole as severe seasonal thinning, not a literal opening,
  and treats model return dates as scenario-dependent estimates rather than promises.
sources:
  - url: https://www.nature.com/articles/249810a0
    title: "Stratospheric sink for chlorofluoromethanes: chlorine atom-catalysed destruction of ozone"
    publisher: Nature
    supports: >-
      Mario Molina and F. Sherwood Rowland's paper was published on 28 June 1974;
      it argued that stable chlorofluoromethanes could persist for decades, reach
      the stratosphere, be broken by ultraviolet light, release chlorine atoms,
      and destroy atmospheric ozone.
  - url: https://www.nobelprize.org/prizes/chemistry/1995/9060-the-nobel-prize-in-chemistry-1995-1995-2/
    title: The Nobel Prize in Chemistry 1995 - Ozone background
    publisher: Nobel Prize Outreach
    supports: >-
      Stratospheric ozone absorbs much harmful ultraviolet radiation; Molina,
      Rowland, and Crutzen clarified chemical formation and decomposition mechanisms,
      and the ozone layer is thin even when expressed as an equivalent surface layer.
  - url: https://www.nature.com/articles/315207a0
    title: Large losses of total ozone in Antarctica reveal seasonal ClOx-NOx interaction
    publisher: Nature
    supports: >-
      Farman, Gardiner, and Shanklin reported in 1985 that Antarctic spring total
      ozone had fallen greatly, showed a long Halley record, rejected a simple
      circulation change as an adequate explanation, and called for chemical causes.
  - url: https://www.bas.ac.uk/about/history/ozone-hole-discovery/
    title: The ozone hole discovery
    publisher: British Antarctic Survey
    supports: >-
      Joe Farman, Brian Gardiner, and Jonathan Shanklin used the long-running Halley
      observations, checked their instrument and methods, and published the seasonal
      Antarctic ozone loss in 1985; the monitoring program had begun in 1957.
  - url: https://ndacc.larc.nasa.gov/about/protocols/appendix-i-dobson-brewer
    title: Appendix I - Dobson/Brewer Spectrophotometers
    publisher: NASA Network for the Detection of Atmospheric Composition Change
    supports: >-
      A Dobson spectrophotometer derives total-column ozone by comparing solar
      ultraviolet wavelengths that ozone absorbs strongly and weakly; calibration
      and cross-instrument comparison are required to maintain a reliable record.
  - url: https://csl.noaa.gov/projects/aaoe/overview.html
    title: AAOE 1987 Research Overview
    publisher: NOAA Chemical Sciences Laboratory
    supports: >-
      The 1987 Airborne Antarctic Ozone Experiment sampled the air inside the ozone
      hole and measured a strong inverse relationship between ozone and chlorine
      monoxide after sunlight returned. The large chlorine monoxide concentrations
      directly implicated chlorine released from human-made CFCs in Antarctic ozone loss.
  - url: https://www.jpl.nasa.gov/news/chemical-reactions-may-cause-ozone-depletion/
    title: Chemical Reactions May Cause Ozone Depletion
    publisher: NASA Jet Propulsion Laboratory
    supports: >-
      JPL laboratory experiments demonstrated reactions on Antarctic stratospheric
      ice particles that convert the chlorine reservoirs hydrochloric acid and
      chlorine nitrate into molecular chlorine, which sunlight can split into
      ozone-destroying chlorine radicals. The proposed reaction chain fit evidence
      from the 1987 Antarctic expeditions.
  - url: https://csl.noaa.gov/assessments/ozone/2002/executivesummary.html
    title: Scientific Assessment of Ozone Depletion 2002 - Executive Summary
    publisher: NOAA Chemical Sciences Laboratory and World Meteorological Organization
    supports: >-
      Chemistry-climate simulations that include changes in halogen loading and
      greenhouse gases broadly reproduce observed past trends in Antarctic total
      column ozone. This model agreement adds a distinct line of support to the
      field measurements and laboratory evidence for halogen-driven ozone loss.
  - url: https://ozonewatch.gsfc.nasa.gov/facts/hole_SH.html
    title: Ozone hole facts
    publisher: NASA Goddard Space Flight Center
    supports: >-
      The Antarctic polar vortex isolates very cold winter air; reactions on polar
      stratospheric cloud particles activate chlorine, and returning spring sunlight
      drives catalytic ozone destruction until warming and mixing weaken the vortex.
  - url: https://science.nasa.gov/earth/explore/nasa-knows-the-ozone-hole/
    title: NASA Knows - The Ozone Hole
    publisher: NASA Science
    supports: >-
      The ozone layer spans the stratosphere and is not uniform; the ozone hole is
      recurring severe seasonal depletion over Antarctica rather than a permanent
      empty opening, and ozone formation, destruction, transport, cold, and sunlight interact.
  - url: https://www.epa.gov/ozone-layer-protection/information-ozone-and-ozone-depletion
    title: Information on Ozone and Ozone Depletion
    publisher: United States Environmental Protection Agency
    supports: >-
      Ozone consists of three oxygen atoms; most atmospheric ozone is concentrated
      roughly 15 to 35 kilometres above the surface, absorbs harmful UV-B radiation,
      and can be depleted by chlorine- and bromine-containing human-made chemicals.
  - url: https://www.epa.gov/snap/refrigerant-safety
    title: Refrigerant Safety
    publisher: United States Environmental Protection Agency
    supports: >-
      CFC refrigerants were historically valued as relatively nontoxic,
      nonflammable, stable compounds; their high atmospheric stability also lets
      them persist and carry ozone-depleting chlorine to the stratosphere.
  - url: https://www.epa.gov/ozone-layer-protection/health-and-environmental-effects-ozone-layer-depletion
    title: Health and Environmental Effects of Ozone Layer Depletion
    publisher: United States Environmental Protection Agency
    supports: >-
      Less stratospheric ozone allows more UV-B to reach the surface, increasing
      risks to human skin and eyes and harming plants and aquatic ecosystems.
  - url: https://ozone.unep.org/treaties/1987-montreal-protocol-substances-deplete-ozone-layer
    title: The 1987 Montreal Protocol on Substances that Deplete the Ozone Layer
    publisher: United Nations Environment Programme Ozone Secretariat
    supports: >-
      The original treaty established definitions, calculated control levels,
      control measures, trade provisions, reporting, assessment and review,
      technical assistance, and institutional processes.
  - url: https://ozone.unep.org/treaties/montreal-protocol
    title: The Montreal Protocol on Substances that Deplete the Ozone Layer
    publisher: United Nations Environment Programme Ozone Secretariat
    supports: >-
      The global agreement was signed in 1987 and entered into force in 1989;
      it phases out production and consumption of ozone-depleting chemicals and
      has been adjusted and amended as science and technology developed.
  - url: https://ozone.unep.org/ozone-treaties
    title: Ozone Treaties
    publisher: United Nations Environment Programme Ozone Secretariat
    supports: >-
      The 1985 Vienna Convention and 1987 Montreal Protocol created a continuing
      system linking research, monitoring, technical information, and decisions;
      participation became universal and continued commitment remains necessary.
  - url: https://www.nature.com/articles/s41586-018-0106-2
    title: An unexpected and persistent increase in global emissions of ozone-depleting CFC-11
    publisher: Nature
    supports: >-
      Measurements of atmospheric CFC-11 at remote sites showed that its decline
      slowed after 2012. The researchers compared emissions inferred from those
      observations with projected emissions based on reported production and
      estimated CFC-11 banks; the excess implied emissions not accounted for by
      those inventories and suggested renewed, unreported production inconsistent
      with the Montreal Protocol.
  - url: https://www.multilateralfund.org/about/governance
    title: Governance of the Multilateral Fund
    publisher: Multilateral Fund for the Implementation of the Montreal Protocol
    supports: >-
      The Protocol's financial mechanism provides grants and technical assistance
      to developing countries through UNEP, UNDP, UNIDO, the World Bank, and
      approved bilateral cooperation.
  - url: https://csl.noaa.gov/assessments/ozone/2022/executivesummary/
    title: Scientific Assessment of Ozone Depletion 2022 - Executive Summary
    publisher: NOAA Chemical Sciences Laboratory and World Meteorological Organization
    supports: >-
      Controlled ozone-depleting substances and stratospheric chlorine and bromine
      have declined, upper-stratospheric recovery is progressing, Antarctic total
      ozone shows recovery amid large year-to-year variability, and baseline models
      project return to 1980 values around 2040 near-globally, 2045 in the Arctic,
      and 2066 in Antarctica, with large regional ranges and scenario assumptions.
  - url: https://csl.noaa.gov/assessments/ozone/2022/twentyquestions/
    title: Scientific Assessment of Ozone Depletion 2022 - Twenty Questions and Answers
    publisher: NOAA Chemical Sciences Laboratory and World Meteorological Organization
    supports: >-
      Long-lived ozone-depleting substances persist after emissions fall; compliance,
      remaining chemical banks, unexpected emissions, greenhouse gases, volcanic
      aerosols, wildfire smoke, and atmospheric circulation can affect the pace and
      detection of recovery.
notes: >-
  The work avoids claiming that the 1974 paper predicted the Antarctic hole's
  special seasonal chemistry or that the 1985 ground record alone established
  its complete mechanism. It also avoids describing one year's hole size as the
  recovery trend. Dates refer to modeled returns of total column ozone to 1980
  values under stated assumptions, not to a permanently closed literal hole.
