schema_version: 1
id: the-hole-in-the-sky
type: [reading, illustrated-nonfiction]
style: naturalistic-storybook
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [science, nature, history]
  themes: [discovery, responsibility, cooperation]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A source-aware science narrator who connects chemistry, Antarctic observations, international decisions, and model projections while marking uncertainty.
    voice_identity: calm, exact, curious about evidence, and careful not to turn a forecast into a promise
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how long-lived CFCs can release chlorine in the stratosphere and begin repeated ozone-destroying reactions.
    - Distinguish Molina and Rowland's 1974 mechanism from Farman, Gardiner, and Shanklin's 1985 Antarctic observations and from the later explanation of polar chemistry.
    - Evaluate how scientific evidence and international policy changed together before and after the Montreal Protocol.
    - Interpret ozone recovery dates as conditional model projections with regional differences and uncertainty ranges.
  concepts:
    - stratospheric ozone and ultraviolet radiation
    - long-lived ozone-depleting substances
    - catalytic chlorine chemistry
    - Antarctic polar vortex and polar stratospheric clouds
    - long-term observation and instrument checking
    - adaptive international controls
    - recovery evidence, variability, and conditional projections
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
