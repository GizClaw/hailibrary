schema_version: 1
style: naturalistic-storybook
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  people:
    molina: Mexican scientist in his early thirties, thoughtful oval face, short wavy black hair, dark brown eyes, cream 1970s shirt, rust-brown knit tie, charcoal trousers, no lab coat.
    rowland: White American scientist in his late forties, tall lean build, long angular face, receding sandy-brown hair, pale blue 1970s shirt, dark olive tie, brown trousers, no lab coat.
    farman: White British scientist in his mid-fifties, weathered square face, swept-back gray hair, short gray mustache, navy Antarctic parka with orange lining, heavy gray gloves.
    gardiner: White British scientist around forty, narrow face, short dark-brown hair, clean-shaven, mustard Antarctic parka, dark gloves.
    shanklin: White British scientist in his early thirties, round face, thick brown hair, short brown beard, deep-red Antarctic parka, dark gloves.
  instruments: A historically plausible white Dobson ozone spectrophotometer with a compact rectangular body, twin upward-looking optical tubes, plain knobs, and absolutely no letters or numbers.
  science_motif: Earth shown naturalistically from the edge of space with a thin luminous blue-violet atmospheric band; ozone as small three-sphere blue clusters, CFCs as larger muted green gray and black molecular clusters, chlorine as a small green sphere, with no labels, formulas, arrows, or symbols.
  palette: Antarctic blue-white, stratospheric indigo and violet, muted 1970s cream olive and rust, treaty-hall warm wood, and restrained green accents for chlorine.
assets:
  - {id: cover, file: artwork/cover.webp, scene: "Earth curves across the lower frame beneath a thin blue-violet ozone band; above Antarctica the band becomes visibly thin but not empty, while a small Halley station instrument and two scientists stand in the foreground under a vast polar sky, with no text or symbols."}
  - {id: p01, file: artwork/p01.webp, scene: "A naturalistic edge-of-space view of Antarctica beneath a continuous but strongly thinned blue-violet ozone band, making clear that the hole is not an open tear."}
  - {id: p02, file: artwork/p02.webp, scene: "Sunlight meets Earth's thin upper-atmosphere band; most harsh violet rays fade within the band while gentler daylight reaches forests, ocean, and a coastal town below, with no diagram labels or arrows."}
  - {id: p03, file: artwork/p03.webp, scene: "A restrained 1960s domestic and industrial still life of an old refrigerator coil, foam insulation, and a plain aerosol can releasing stable molecular clusters into open air, with no brands or text."}
  - {id: p04, file: artwork/p04.webp, scene: "Molina and Rowland in their consistent 1970s clothing work at adjoining desks, comparing blank molecular models and atmospheric sketches without visible writing."}
  - {id: p05, file: artwork/p05.webp, scene: "A vertical atmospheric cutaway without labels shows stable CFC molecular clusters drifting from city level into the high stratosphere, where intense ultraviolet light begins to split one cluster."}
  - {id: p06, file: artwork/p06.webp, scene: "A close naturalistic molecular scene shows one green chlorine sphere repeatedly entering a circular sequence that breaks several blue ozone clusters while the chlorine emerges unchanged, with no arrows, formulas, or symbols."}
  - {id: p07, file: artwork/p07.webp, scene: "Molina and Rowland stand before two contrasting blank panels, one showing an intact blue-violet atmospheric band and the other a subtly thinner future band, their expressions serious but measured."}
  - {id: p08, file: artwork/p08.webp, scene: "Halley Research Station in the late 1950s to early 1980s under low Antarctic sunlight, with the same plain white Dobson instrument aimed at the sky across layered seasons."}
  - {id: p09, file: artwork/p09.webp, scene: "Farman, Gardiner, and Shanklin in their consistent parkas carefully inspect the Dobson instrument indoors, checking optics and comparing blank paper traces without visible marks."}
  - {id: p10, file: artwork/p10.webp, scene: "The three BAS scientists gather around a long row of blank record sheets whose descending paper edges suggest a sustained change, while the Antarctic window beyond shows spring light."}
  - {id: p11, file: artwork/p11.webp, scene: "A broad globe view contrasts a small mid-latitude model box over the Northern Hemisphere with the vast isolated Antarctic atmosphere, showing why one regional model could miss polar conditions, without labels or symbols."}
  - {id: p12, file: artwork/p12.webp, scene: "Scientists from several teams launch a balloon, examine laboratory glassware, and observe satellite imagery represented only by colored atmospheric shapes, combining different kinds of evidence without text."}
  - {id: p13, file: artwork/p13.webp, scene: "In polar night, a circular wall of high winds surrounds Antarctica while delicate pearly polar stratospheric clouds form inside the cold isolated air, with no arrows or symbols."}
  - {id: p14, file: artwork/p14.webp, scene: "Returning Antarctic spring sunlight illuminates pearly clouds and releases green chlorine spheres that break many blue ozone clusters inside the still-cold vortex, wordless and scientifically restrained."}
  - {id: p15, file: artwork/p15.webp, scene: "Four evidence objects converge on one table: Molina and Rowland's blank molecular model, the Halley instrument, a pearly cloud sample chamber, and an Earth observation image with no writing."}
  - {id: p16, file: artwork/p16.webp, scene: "A 1985 international meeting room shows delegates exchanging blank scientific folders beneath a globe and a thin atmospheric motif, suggesting research cooperation before binding controls."}
  - {id: p17, file: artwork/p17.webp, scene: "A 1987 Montreal conference hall shows diverse delegates raising hands over an unsigned blank treaty document, with refrigeration equipment and fire-safety equipment represented as small unbranded models."}
  - {id: p18, file: artwork/p18.webp, scene: "The treaty table extends through time as delegates replace old cooling equipment, support technicians, inspect sealed chemical cylinders, and tighten a series of plain mechanical valves, with no text or numbers."}
  - {id: p19, file: artwork/p19.webp, scene: "Atmospheric monitoring instruments on ground stations, a balloon, aircraft, and satellite observe a slowly strengthening blue-violet upper atmospheric band while old chemical cylinders remain stored below."}
  - {id: p20, file: artwork/p20.webp, scene: "Three Antarctic spring seasons appear as adjacent natural landscapes with different vortex shapes and ozone-band thicknesses, showing strong year-to-year variation without charts, labels, or numbers."}
  - {id: p21, file: artwork/p21.webp, scene: "A scientist studies several translucent future Earth layers that converge imperfectly toward stronger ozone bands at different times in global, Arctic, and Antarctic regions, without clocks, dates, labels, or symbols."}
  - {id: p22, file: artwork/p22.webp, scene: "At a modern Antarctic station, researchers service the same kind of ozone instrument under a recovering but still variable blue-violet atmospheric band, while sealed old equipment waits for safe handling."}
