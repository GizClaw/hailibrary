schema_version: 1
id: the-town-that-voted-on-the-river
type: [reading, illustrated-novella]
style: luminous-future-technology
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [science, technology, nature, everyday-life]
  themes: [fairness, responsibility, tradition, problem-solving, cooperation]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close near-future narrator who follows Mira through a public decision without pretending that one vote removes uncertainty.
    voice_identity: observant, even-handed, and concrete about evidence limits
  - id: mira
    kind: character
    description: A fifteen-year-old student helping archive the town's river records, initially impatient for one decisive answer.
    visual_identity: A fifteen-year-old East Asian girl with a round face, chin-length straight black hair tucked behind one ear, teal rain jacket with a coral zipper, graphite trousers, white boots, and a transparent cyan field tablet with no visible writing.
    voice_identity: quick, questioning, and increasingly precise
  - id: elena
    kind: character
    description: A middle-aged farmer whose family and neighboring farms use the dam pond's gravity-fed irrigation canal.
    visual_identity: A sturdy middle-aged Latina woman with warm brown skin, dark curly hair in a low bun, moss-green work shirt, cream utility vest, graphite pants, brown field boots, and a coil of cyan irrigation hose.
    voice_identity: practical, dryly humorous, and alert to unequal risk
  - id: jonah
    kind: character
    description: A young adult angler and river guide who wants migratory fish to regain access above the dam.
    visual_identity: A lean Black man in his late twenties with deep brown skin, short twists, coral windbreaker over a charcoal shirt, teal waders, and a simple graphite fishing rod without markings.
    voice_identity: energetic, candid, and willing to test his hopes
  - id: nia
    kind: character
    description: The town hydrologist, responsible for explaining models, field measurements, and uncertainty without deciding the town's values.
    visual_identity: A tall Black woman in her forties with dark skin, close-cropped hair, warm-white field coat with cyan seams, graphite trousers, white boots, and a compact transparent sampling case with unmarked vials.
    voice_identity: calm, exact, and resistant to false certainty
  - id: samir
    kind: character
    description: A seventy-year-old town elder who remembers the reservoir cove as a community place and also remembers years when the old machinery failed.
    visual_identity: A slender South Asian man aged seventy with medium-brown skin, swept silver hair, a short silver beard, mustard cardigan over a cream shirt, dark teal trousers, brown shoes, and a small plain wooden photo box with no visible pictures or text.
    voice_identity: warm, deliberate, and unsentimental about memory
  - id: rowan
    kind: character
    description: The town council chair who keeps the hearing and ballot conditions understandable.
    visual_identity: A white nonbinary adult in their fifties with fair skin, short auburn hair graying at the temples, a graphite jacket with a narrow cyan collar, cream trousers, and a coral wooden gavel without markings.
    voice_identity: measured, procedural, and plainspoken
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how dam removal can affect fish passage, stored sediment, and an irrigation intake through interacting mechanisms.
    - Compare observations, models, memories, and value judgments without treating them as interchangeable evidence.
    - Evaluate a staged decision that contains measurable conditions, pause points, and unresolved uncertainty.
  concepts:
    - river connectivity and fish passage
    - sediment release and site-specific risk
    - irrigation continuity and unequal consequences
    - baseline monitoring and adaptive public decisions
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
