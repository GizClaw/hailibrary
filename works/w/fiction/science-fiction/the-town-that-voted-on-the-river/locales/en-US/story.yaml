        - {id: p09-b03, speaker: narrator, text: "His claim became narrower: removing the barrier would create physical passage, while monitoring would test whether fish used it. A bypass channel might also provide passage without full removal, but the steep bank and nearby road left little space."}
        - {id: p09-b04, speaker: narrator, text: "The bypass deserved an engineering estimate rather than dismissal. Jonah added it to the comparison even though it weakened his simplest argument."}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: "Elena walked the canal with Mira and two engineers. Their level showed that the intake lip sat above the free-flowing river predicted after removal. Lowering the dam without another supply would interrupt gravity delivery."}
        - {id: p10-b02, speaker: narrator, text: "One proposal used a solar-assisted pump to fill a smaller off-channel pond during adequate flows. The pond would store less water than Graystep, so farms would also need lined channels, soil-moisture scheduling, and an agreed order during shortages."}
        - {id: p10-b03, speaker: narrator, text: "None of those measures created water during drought. They could reduce losses and move available water when needed. Elena asked who would own the pump, pay for repairs, and receive water first if it failed."}
        - {id: p10-b04, speaker: narrator, text: "The engineering sketch had pipes and batteries. It had no answer about responsibility. Mira added Elena's questions to the hearing file."}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: "In the silent gatehouse, Samir arranged objects from the archive: a mill bearing, a child's swim float, a farmer's wooden gate handle, and a flood volunteer's lamp. Together they contradicted the claim that Graystep had only one purpose."}
        - {id: p11-b02, speaker: narrator, text: "Its uses had changed, and some had ended before others. Samir described the year the turbine closed. Residents had expected the town to abandon the structure, but farmers reorganized the pond around irrigation. Later, the cove closed while the walking path remained."}
        - {id: p11-b03, speaker: mira, text: "We keep talking about the dam as if it has one biography."}
        - {id: p11-b04, speaker: samir, text: "Then your archive has failed."}
        - {id: p11-b05, speaker: narrator, text: "He wanted any removal plan to preserve stories and selected objects, but he did not ask the river to remain a monument."}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: "Nia combined the evidence in a public river lab. One layer displayed inspection photographs, while another mapped sediment cores and laboratory results; no tested contaminant exceeded the project's screening values, though untested pockets could remain."}
        - {id: p12-b02, speaker: narrator, text: "Camera records showed fish below the barrier, while canal gauges showed how much water farms received by gravity during the previous two dry seasons. The future channel appeared as several translucent bands because models disagreed about its exact position."}
        - {id: p12-b03, speaker: narrator, text: "Residents kept asking which layer proved the correct vote. Nia refused the premise. Measurements described present conditions and past variation; models estimated possible changes. Memories identified valued uses. Budgets exposed limits."}
        - {id: p12-b04, speaker: narrator, text: "None could decide how the town should distribute risk. Mira saw that disagreement did not always mean someone had ignored the evidence. People could accept the same mechanism and still judge its consequences differently."}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: "Elena's farm group returned with a condition rather than a refusal. Build and test the off-channel pond before lowering Graystep. For one full growing season, the pump had to deliver the farms' agreed weekly water allocation during dry periods, with a backup power connection and a repair fund."}
        - {id: p13-b02, speaker: narrator, text: "Jonah objected to waiting another year. Elena turned the canal valve until its flow stopped."}
        - {id: p13-b03, speaker: elena, text: "This is what an untested promise sounds like in my field."}
        - {id: p13-b04, speaker: narrator, text: "She was not demanding that the pond match every historic delivery. Farmers had already accepted conservation rules. She was demanding proof that smaller farms would not become the experiment."}
        - {id: p13-b05, speaker: narrator, text: "Jonah asked whether the test could begin while fish and sediment baseline work proceeded. Elena said yes. Their schedules could overlap, although dam construction would wait."}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: "Jonah's group returned with its own concession. If the town chose repair, the design should include a professionally assessed passage route instead of sealing Graystep for another generation. If the town chose removal, fish access should be measured rather than advertised as instant recovery."}
        - {id: p14-b02, speaker: narrator, text: "He and Nia walked the proposed bypass. The channel would need a gentler slope, stable entrances across changing flows, and protection for the nearby bridge. That work could cost less than removal or more; the survey was incomplete."}
        - {id: p14-b03, speaker: narrator, text: "Jonah disliked spending money to keep the barrier, but he stopped calling the bypass fake."}
        - {id: p14-b04, speaker: jonah, text: "I still prefer an open river. Preference is not the same as proof that every alternative fails."}
        - {id: p14-b05, speaker: narrator, text: "His argument became less dramatic and more useful."}
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          content:
            - text: "Before comparing future change, Nia wanted a "
            - vocabulary: {id: baseline, text: baseline}
            - text: ": a set of measurements taken before the project for later comparison."
        - {id: p15-b02, speaker: narrator, text: "Crews would map the channel, measure canal delivery, sample temperature and suspended material, and record fish movement through several seasons. Mira asked why one month of data was not enough."}
        - {id: p15-b03, speaker: narrator, text: "A wet month might hide an irrigation shortage; a cold month might change fish activity; one storm might move more sediment than weeks of ordinary flow. Longer monitoring still could not capture every possible year."}
        - {id: p15-b04, speaker: narrator, text: "It could reveal seasonal patterns and keep the town from comparing an unusual afternoon with an average future month. The first useful result, Mira realized, would not be a claim that the river had improved. It would be a fair description of the river before anyone changed it."}
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          content:
            - text: "At the second hearing, Rowan asked residents to name the "
            - vocabulary: {id: tradeoff, text: tradeoff}
            - text: " in each option: what benefit it pursued and what competing benefit or risk it accepted."
        - {id: p16-b02, speaker: narrator, text: "Repair preserved gravity irrigation soonest, but spent heavily on a barrier that would still need maintenance and fish passage work. Immediate removal opened the channel soonest, but concentrated construction, sediment movement, and water-supply disruption before replacements were proven."}
        - {id: p16-b03, speaker: narrator, text: "Staged removal reduced the size of the first irreversible step, but extended cost, supervision, and uncertainty. No column was empty. Samir asked that the archive and cove history appear under every option, not as decoration under repair."}
        - {id: p16-b04, speaker: narrator, text: "Rowan agreed. Cultural loss could be addressed through documentation and design, though never erased by a display case."}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "Nia then presented a staged plan with explicit stop points. First, the town would build and test replacement irrigation while collecting baseline data. Next, crews would lower the pond slowly and cut a small notch during a planned flow window."}
        - {id: p17-b02, speaker: narrator, text: "Downstream instruments would track suspended sediment, channel change, temperature, and canal supply. If laboratory checks found contamination, or if sediment and water measures crossed limits set during permitting, work would pause for independent review."}
        - {id: p17-b03, speaker: narrator, text: "Only after that review could the notch widen. Nia called the plan adaptive because later steps could change in response to measured results."}
        - {id: p17-b04, speaker: narrator, text: "She also named its weakness: once the first notch altered the pond, some effects could not be perfectly reversed. A pause limited exposure. It did not restore yesterday."}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "The farm test began before the vote. Elena and Jonah watched the solar-assisted pump fill the small pond while Mira measured delivery at the farthest tenant field. On the first hot afternoon, algae clogged an intake screen and flow fell."}
        - {id: p18-b02, speaker: narrator, text: "Jonah helped clear it while Elena called the manufacturer. The fault did not condemn the design, but it exposed maintenance work missing from the budget; a second screen and remote alarm improved the next trial."}
        - {id: p18-b03, speaker: elena, text: "If we had discovered that only after Graystep was lowered and the old gravity canal lost flow, I would have blamed your fish."}
        - {id: p18-b04, speaker: jonah, text: "Fairly?"}
        - {id: p18-b05, speaker: elena, text: "No. Predictably."}
        - {id: p18-b06, speaker: narrator, text: "He laughed once, then added the cleaning schedule to the plan. Their test did not settle the river question. It changed one hidden risk into a visible job with an owner."}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: "On the night before voting, Samir brought his cove stone to the archive. Mira offered to seal it beside the old photographs, but he kept it in his palm. A preserved object could carry a story; it could also make change look safely finished."}
        - {id: p19-b02, speaker: narrator, text: "The future riverbank might become a trail, a wet meadow, a rough construction zone, or some mixture over time. No rendering could promise which memory children would make there. Samir finally placed the stone beside a model whose river channel could be rearranged."}
        - {id: p19-b03, speaker: samir, text: "Do not label the last scene."}
        - {id: p19-b04, speaker: narrator, text: "Mira understood that he was not asking for silence. He wanted the archive to record forecasts as forecasts and later add what actually happened. She left an empty compartment beside the stone."}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: "Alder Bend voted privately the next morning. The ballot offered repair with a fish-passage study, immediate removal with emergency irrigation support, and staged removal with funded prerequisites and stop points."}
        - {id: p20-b02, speaker: narrator, text: "It also stated that no option guaranteed fish recovery, permanent farm supply, or a stable future channel. Mira was fifteen and could not cast a ballot. She helped Samir at the accessible booth, then stepped away before he chose."}
        - {id: p20-b03, speaker: narrator, text: "Through the translucent screens, she saw only hands and plain glowing spheres. The process looked quieter than the hearings because a vote did not require anyone to perform certainty."}
        - {id: p20-b04, speaker: narrator, text: "When the slots closed, Rowan and two observers checked the encrypted count. Residents waited beside the three models without knowing which kind of loss the town had accepted."}
    - id: p21
      illustration: p21
      blocks:
        - {id: p21-b01, speaker: narrator, text: "Staged removal received a majority, but Rowan did not announce that Alder Bend had voted to free the river."}
        - {id: p21-b02, speaker: rowan, text: "The town has authorized a sequence."}
        - {id: p21-b03, speaker: narrator, text: "Funds would first go to irrigation testing, baseline monitoring, design review, permits, and sediment safeguards. After the first notch, an independent panel could pause the project if public thresholds were crossed. Continuing would require a published review, not another townwide vote, unless costs exceeded the approved ceiling."}
        - {id: p21-b04, speaker: narrator, text: "Repair supporters had lost their preferred option, yet several had shaped the conditions. Immediate-removal supporters had gained a route toward an open channel, but not their preferred speed. Mira felt no clean triumph. The decision was more demanding than a slogan because it assigned work before it assigned credit."}
    - id: p22
      illustration: p22
      blocks:
        - {id: p22-b01, speaker: narrator, text: "Months later, Graystep still crossed the Lumen. Baseline sensors stood along the banks, the gravity canal carried spring water, and excavators shaped the off-channel pond far from the river. No fish had passed through concrete. No sediment pulse had moved."}
        - {id: p22-b02, speaker: narrator, text: "At dawn, Mira joined Elena, Jonah, Nia, and Samir above the worksite. The pump test had months to run, and new core results were due next week. Mira opened the archive record."}
        - {id: p22-b03, speaker: narrator, text: "She did not write that the town had chosen the river, because farmers, fish, memories, budgets, and safety all belonged to that claim."}
        - {id: p22-b04, speaker: narrator, text: "She wrote that Alder Bend had chosen what to test first, what limits would stop the work, and who would report the result. Then she left space for the river's reply."}
