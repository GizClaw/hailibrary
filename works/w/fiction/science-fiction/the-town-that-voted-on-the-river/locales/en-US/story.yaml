      tts: {delivery: quick and curious becoming more exact under pressure, timbre: bright teenage voice with crisp articulation, pace: slightly quick medium pace, pitch: medium-high}
    elena:
      display_name: Elena Ruiz
      tts: {delivery: practical and direct with restrained dry humor, timbre: grounded adult contralto, pace: steady medium pace, pitch: low-medium}
