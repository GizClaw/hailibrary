schema_version: 2
language: zh-CN
writer: 明日镜
title: 为河流投票的小镇
summary: >-
  灰阶坝老化以后，岚湾镇必须在修坝、立即拆坝和分阶段拆坝之间作出选择。十五岁的陈弥拉协助整理河流档案，跟随农户、钓手、水文学家和老人核对各自的证据。投票最终批准的不是一句口号，而是一套带前置条件、暂停线和后续复核的行动顺序。
chapters:
  - id: ch01
    title: 一条河，几笔旧账
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 证据能说到哪里
    page_refs: [p06, p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 条件不是保证
    page_refs: [p13, p14, p15, p16, p17, p18]
  - id: ch04
    title: 投票以后还要等
    page_refs: [p19, p20, p21, p22]
questions:
  - id: q01
    type: compare
    speaker: narrator
    prompt: 同一座灰阶坝，在乔纳和埃琳娜的叙述中分别产生了什么影响？
    answer: 乔纳看到大坝阻断鱼类洄游，埃琳娜则依靠坝前抬高的水面向农田自流供水。
    page_refs: [p03, p04]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪些证据说明不能只凭坝龄判断泥沙风险？
    answer: 钻芯显示泥沙分层和位置不同，模型还表明颗粒大小、河道坡度、未来流量与拆除顺序都会影响泥沙移动。
    page_refs: [p07, p08]
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: 为什么立即拆坝会使现有灌溉中断？
    answer: 拆坝后的自然河面可能低于原来的自流取水口，而替代泵站和塘池尚未经过完整试用。
    page_refs: [p10, p13]
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: 为什么萨米尔的记忆重要，却不能代替工程检查？
    answer: 记忆能证明水湾和大坝曾承载哪些生活与感情，却不能测出混凝土现状，也不能预测拆坝后的河道。
    page_refs: [p05, p11]
  - id: q05
    type: source-analysis
    speaker: narrator
    prompt: 公共实验室里的哪类信息主要属于预测，而不是本地直接观察？
    answer: 未来河槽的多条半透明带主要来自模型预测；检查照片、泥芯、鱼类影像和渠水记录属于本地观察与测量。
    page_refs: [p08, p12]
  - id: q06
    type: synthesis
    speaker: narrator
    prompt: 分阶段方案怎样同时回应鱼类通行、泥沙风险和农田用水？
    answer: 它先建成并试用替代灌溉系统，再在合适流量期切开小缺口，同时监测泥沙、河道和供水；一旦越过许可设定的界线，后续拆除便暂停复核。
    page_refs: [p13, p15, p17, p18]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 乔纳为什么接受比自己原先主张更慢的方案？
    answer: 他承认偏爱开放河道不等于其他方案都失败，又把进水滤网的清理周期和负责人写进方案。
    page_refs: [p14, p18]
  - id: q08
    type: evidence
    speaker: narrator
    prompt: 最终选票为什么不只是简单询问“拆不拆”？
    answer: 选项写明了资金保障、前置试验、公开监测线、独立复核和暂停权，也明确说明没有哪种方案能保证全部结果。
    page_refs: [p16, p17, p20, p21]
  - id: q09
    type: synthesis
    speaker: narrator
    prompt: 弥拉最后怎样理解“不确定”？
    answer: 她不再把不确定当成拖延的借口，而是把未知项目、先做的测量、早期行动的范围和暂停责任写进决策。
    page_refs: [p01, p15, p17, p21, p22]
  - id: q10
    type: research-response
    speaker: narrator
    prompt: 如果要把岚湾镇的方案用于一座真实大坝，还必须补查哪些资料？
    answer: 可补查当地许可与水权、坝体结构、泥沙数量和污染、目标鱼类、下游河道、替代供水能力、费用、施工时序及应急预案等现场资料。
    page_refs: [p07, p08, p10, p12, p17]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            站在档案馆的露台上，陈弥拉能同时看见岚湾镇争论的两端。北坡下，灰阶坝托起一片平静的水面；取水渠从坝前伸向农田，像一根银线。坝下却是另一副样子，路明河绕过裸露的石滩，水面比上游低了许多。弥拉十五岁，负责把旧维修单扫进新的河流档案。可这些纸没有给她一个干脆的答案：检查报告说坝体正在老化，农户记录说塘水仍在供田，鱼类调查则画出一道无法通过的横线。六周后，全镇投票。弥拉原以为事实会替人作决定，很快却发现，不同事实正把人推向不同方向。
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            水文学家妮娅带弥拉登上有护栏的溢洪道。一个坝孔出现细裂缝，小闸门启动时不断发抖，维修机器人随即将它停下。妮娅说：“检查能告诉我们哪里弱、哪台设备不可靠，却不能替全镇选择修还是拆。”彻底加固并更换闸门，需要动用大半应急储备；拆坝同样要施工，也会带来新的风险。弥拉问，一座八十三岁的坝是否必然危险。妮娅没有顺着问题点头：“年龄只是一项。还要看结构、维护、下游会受什么影响，以及这座坝今天还承担什么作用。”如果连保留的目的都没说清，比较费用就只是把两串数字摆在一起。
    - id: p03
      illustration: p03
      paragraphs:
        - text: >-
            坝下深潭边，乔纳把水下摄像头固定在石缝上。他靠带人钓鱼为生，却在鱼群洄游的这段时间主动关闭了这片钓场。影像里，几条鱼一次次游到混凝土前，又退回深水。乔纳对弥拉说：“我能证明它们到了这里，不能保证拆坝以后会回来多少。”恢复连续河道，可以让鱼自行进入上游较冷的水域和产卵地；但鱼群是否增加，还受水温、流量、栖息地、捕捞以及镇外河段影响。有人想把一条跃过坝顶的大鱼印在宣传图上，乔纳拒绝了。那幅图会把机会画成结果，而摄像头此刻只记录了一处障碍。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            天刚亮，农户埃琳娜打开取水渠的闸口。坝前水位较高，不用抽水就能流向十一户农户。她家种豆和留种谷物，邻居中有人管果园，也有人只租到一小块地。“有人说旧水轮早停了，所以这座坝已经没用。”她把缠好的蓝色水管扛上肩，“可庄稼不是靠旧水轮喝水。”水塘不能让旱期凭空多出水，却能把丰水时留下的一部分水移到作物需要的时段。若先拆坝，河面可能降到取水口以下。大农场也许买得起泵，两户租地农户却未必。埃琳娜并不否认河流生态，她追问的是：过渡期的损失会先落到谁身上？
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            萨米尔约弥拉到旧水湾见面。浅岸已经长出成片湿地植物，几年前闸门故障后，镇里禁止人们下水。他从没有文字的木盒里取出一块圆石，说自己十二岁时在这里学会游泳。后来冬天变暖，结冰少了；磨坊停工，正午汽笛也消失了。可他还记得两次洪水，镇民整夜守着溢洪道。弥拉问，保存水湾是不是保存记忆。萨米尔把石头握紧：“记忆能证明这里对人有过意义，不能拿来做坝体受力试验。”他反对把水塘说成毫无价值，也不愿为了复原旧照片里的风景而修坝。他要大家诚实说出，改变会带走什么。
    - id: p06
      illustration: p06
      paragraphs:
        - text: >-
            第一次听证会上，议事主持人罗文把三件无字模型放上圆桌：加固保留、一个施工季内拆除、分阶段降低水位。第三件模型故意缺了几块，因为监测界线和供水条件还没定。起初，人们只把声音抛向对面。钓手说鱼被堵住，农户就问水渠干了怎么办；老人讲水湾，年轻人马上报出修坝预算。罗文敲了一下橙红色小锤：“传感器量不到的价值，不等于虚假；会发光的预测，也不会因此变成事实。”他们要求每一方下次只带来三样东西：一个起作用的机制，一个尚未解决的问题，以及本群体之外某个人可能承担的后果。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: >-
                妮娅的团队把透明取样管压进塘底，抽出的泥芯一层深、一层浅。河流带来并沉下的泥、沙、砾石等固体颗粒，统称为
            - vocabulary: {id: sediment, text: 泥沙}
            - text: >-
                。靠近入水处的颗粒较粗，坝前多是细泥，说明八十三年里堆积并不均匀。旧机器房旁的样本被送进实验室，因为过去的生产活动可能留下污染物。弥拉指着一层黑泥问：“颜色这么深，是不是有毒？”妮娅答得很短：“颜色回答不了。”检测结果出来以前，“安全”和“有毒”都只是猜测。即使样本都没有超过筛查值，泥沙的总量、颗粒大小和分布位置，仍会影响拆坝时怎样处理。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            在透明河槽中，妮娅向两条模型河道倒入等量净沙。坡陡、水急的一条很快把沙带走；另一条在弯道内侧留下小沙洲。这个实验只解释“为什么可能不同”，并不预测路明河一定变成哪一种。真实结果还取决于颗粒大小、河道坡度、岸线形状、未来流量和拆除顺序。计算模型显示，突然打开大缺口可能造成较集中的早期泥沙脉冲；分段开口或许能把移动过程拉长，却也延长了施工和看护时间。妮娅提醒弥拉：“模型能让我们先试假设，不能把假设变成现场观察。”弥拉于是把“最可能”与“已经测到”分开记在两栏。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            乔纳请弥拉一起看一个月的水下影像。凉爽的傍晚，来到坝下的鱼更多，但镜头无法认出每一条鱼，也看不见障碍移除后它们会去哪里。他提议在施工前给少量鱼装声学标记，并在几段上游河道设置接收器。妮娅指出，被标记的鱼只代表选中的个体和季节。乔纳接受了这个限制，把自己的主张改得更窄：拆除障碍会提供物理通道，后续监测才能说明鱼是否使用。有人提出绕坝修一条缓坡鱼道，但陡岸和公路之间空间很小。乔纳没有再说那是“假办法”，而是要求先完成勘测和报价，即使这会削弱他原先最简单的说法。
    - id: p10
      illustration: p10
      paragraphs:
        - text: >-
            埃琳娜带弥拉和工程师沿水渠走到取水口。水平测量说明，拆坝后的预测河面会低于渠口，原来的自流供水将中断。替代方案是在河外先挖一口较小的塘，用太阳能辅助泵在水量合适时补水。新塘蓄水少，农户还得修补漏水渠，按土壤含水情况安排灌溉，并提前约定缺水时的次序。这些办法只能减少损耗、调整供水时段，不能在旱天制造新水。埃琳娜连续问了三个具体问题：泵归谁维护，维修费从哪里出，停电或堵塞时谁先得水？工程草图已经画了管线和电池，却没有画出责任。弥拉把这三个问题原样写进听证材料。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            萨米尔在安静的旧闸房里摆出几件档案物：磨坊轴承、儿童浮具、农田木闸把手和防洪志愿者用过的灯。它们放在一起，正好反驳“灰阶坝只有一种用途”的说法。水轮停转后，农户重新组织了灌溉；水湾关闭后，岸边步道仍有人走。用途并非同时出现，也没有同时消失。弥拉听完说：“我们总像在给大坝写唯一的一份传记。”萨米尔笑了：“那是档案没做好，不是大坝一辈子只做一件事。”他希望未来设计保留部分物件和口述记录，却没有要求河流永远充当纪念碑。对他而言，保存故事不等于冻结现场。
    - id: p12
      illustration: p12
      paragraphs:
        - text: >-
            公共河流实验室开放那天，妮娅把不同证据叠在同一片透明空间里。结构照片显示裂缝和旧闸门；泥芯地图标出取样位置，已检样本没有超过项目筛查值，但这不代表每个角落都测过。水下影像证明鱼来到坝下，水渠计量记录则说明过去两个旱季农田得到多少自流水。只有未来河槽被画成几条半透明带，因为不同模型给出的位置并不完全一致。居民不断问哪一层能证明哪张选票“正确”。妮娅没有选一层：测量描述已经发生的变化，模型估计可能发生的变化，记忆说明人珍惜什么，预算暴露能承担多少。证据不能独自决定风险该怎样分配。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            农户小组第二次来到圆桌时，没有再说“绝不能拆”，而是提出前置条件：先建河外塘，并让泵站完整运行一个生长季。泵站必须按约定的旱季每周供水配额，把水送到最远的租地，还要有备用电源、维修资金和公开记录。乔纳嫌一年太久。埃琳娜把渠口阀门慢慢关上，流水声随即消失：“一个没试过的承诺，到了我田里就是这种声音。”她并未要求新系统复制历年全部供水，农户已经同意节水和轮灌。她要求的是，不能让资金最少的两户先替全镇试错。乔纳问，泵站试运行能否与鱼类、泥沙调查同时进行。埃琳娜说可以，只有动坝要等。
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            乔纳的小组也修改了主张。若选择修坝，设计中必须加入由专业团队评估的通鱼路线，不能又把灰阶坝原样封上几十年。若选择拆坝，也不能把“打通河道”宣传成“鱼群马上恢复”。他和妮娅实地走过备选鱼道。要让鱼自行通过，坡度必须合适，入口在不同水位下都要能找到，还不能危及邻近桥基。勘测尚未完成，费用可能低于拆坝，也可能更高。乔纳仍偏爱开放河道，却不再把鱼道称作骗局。他对弥拉说：“偏爱一个结果，不等于我已经证明其他办法都失败。”少了最响亮的句子，他的意见反而更便于比较。
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: >-
                妮娅要求先建立
            - vocabulary: {id: baseline, text: 基线}
            - text: >-
                ，也就是工程开始前的一组测量，供以后比较。团队将记录河槽形状、渠水量、水温、悬浮物和鱼类活动，并让记录跨过几个季节。弥拉问，一个月难道还不够长？妮娅举了几个会误导人的情况：多雨时可能掩盖供水紧张，低温会改变鱼的活动，一场暴雨移动的泥沙也许超过许多平常日。更长的记录仍无法包含所有年份，却能让人看见季节变化，避免拿一个反常下午与未来整月平均状况相比。弥拉这才明白，第一份有用的结论不是“河变好了”，而是准确说明改变之前的河是什么样。
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: >-
                第二次听证会上，罗文要求每个方案说明其中怎样
            - vocabulary: {id: tradeoff, text: 权衡}
            - text: >-
                ：为了争取哪项好处，又接受哪项损失或风险。修坝能最快保住自流灌溉，却要把大笔资金投向仍需维护、仍要解决鱼类通行的障碍。立即拆坝最快打开河道，却会在替代供水未经验证时集中承受施工、泥沙和断水风险。分阶段拆坝把第一次不可逆行动做小，却延长管理、费用与等待。没有一个选项能把“代价”一栏留空。萨米尔要求，水湾历史不能只写在修坝方案下面。罗文同意：拆除以后可以用档案、步道和部分旧物继续讲述，但这些安排只能回应损失，不能假装损失从未发生。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            妮娅接着展示带暂停点的分阶段方案。第一步只做替代灌溉和基线监测；第二步在许可规定的流量时段缓慢降低塘水，并切开一个小缺口。下游仪器持续记录悬浮泥沙、河槽变化、水温和渠水量。如果后续样本检出需要处理的污染，或泥沙、供水指标越过许可阶段设定的界线，施工必须停下，由独立小组复核。只有复核通过，缺口才能扩大。妮娅把这种做法称为可调整的管理，因为下一步会随着实测结果改变。她也明确指出局限：第一个缺口一旦改变水塘，有些影响无法完全倒回。暂停可以限制风险范围，却不能把昨天原样装回来。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            投票前，河外塘试验启动了。埃琳娜和乔纳看着泵站注水，弥拉在最远的租地测渠水流量。第一个炎热下午，水藻堵住进水滤网，远端流量下降。乔纳帮忙清理，埃琳娜联系设备商。故障未否定设计，却暴露了预算遗漏的维护工作。加装一道滤网和远程报警后，第二轮试验恢复正常。埃琳娜说：“要是等拆除部分坝体、旧自流渠因落差不足而减流后才发现，我准会怪你那些鱼。”乔纳问：“怪得有道理吗？”她摇头：“没道理，但很容易发生。”乔纳把清理周期和负责人补进方案。争议未解，他们只让隐蔽风险成了有人负责的任务。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            投票前夜，萨米尔把水湾圆石带到档案馆。弥拉想把它封存在老照片旁边，他却一直没有松手。保存下来的物件能承载故事，也容易让后来的人误以为变化已经被妥善收好。未来岸边可能成为步道、湿草地、施工后的乱石坡，也可能几种样子先后出现，没有一幅效果图能保证孩子将来会记住哪一幕。萨米尔最后把圆石放到一件可以改变河槽形状的模型旁。“别急着给最后一格写说明。”他说。弥拉明白，他不是反对记录，而是要求档案把预测标成预测，等真实结果出现以后再补。她在圆石旁留出一个空位。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            第二天上午，岚湾镇采用不记名投票。选票列出三项：修坝并完成鱼道研究；立即拆坝并提供临时灌溉；分阶段拆坝，同时落实资金、前置试验和暂停点。说明中还写明，没有任何选项能保证鱼群恢复、农田永久有水或未来河槽固定不变。弥拉未到投票年龄，只负责引导行动不便的萨米尔进入无障碍投票间，随后退开。半透明隔板后只看得见手和没有字符的发光球。听证会上每个人都要解释立场，投票时却没有人需要表演确定。投票口关闭后，罗文和两名观察员核验加密计票，居民站在三件模型旁，等着知道全镇接受了哪一种代价。
    - id: p21
      illustration: p21
      paragraphs:
        - text: >-
            分阶段方案获得过半支持。罗文没有宣布“岚湾镇投票解放了河流”，只说：“全镇授权的是一套行动顺序。”首批资金必须用于替代灌溉、基线监测、设计复核、许可和泥沙防护。切开首个缺口以后，公开指标一旦越线，独立小组有权暂停。继续施工需要发布复核报告；除非费用突破选票批准的上限，否则不再举行全镇投票。支持修坝的人没有赢，却把供水和审查条件写进了结果；主张立即拆除的人得到通向开放河道的路径，却没有得到原先要求的速度。弥拉没有感到胜利般轻松。这项决定先分配了工作和责任，功劳还无从谈起。
    - id: p22
      illustration: p22
      paragraphs:
        - text: >-
            几个月后，灰阶坝仍横在路明河上。基线传感器沿岸立起，自流渠输送春水，挖掘机在远离主河道的地方修整河外塘。鱼还不能通过，拆坝泥沙也未移动。弥拉与埃琳娜、乔纳、妮娅、萨米尔站在施工区上方。泵站还要试几个月，新泥芯结果下周才到。弥拉打开河流档案，没有写“全镇选择了河流”，因为农田、鱼、记忆、预算和安全都挤在这句话里。她写下岚湾镇决定先测什么、哪条界线会叫停工程、由谁公开结果。随后，她在记录末尾空出一段，留给河流回答。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 冷静观察，不替任何一方抢先下结论, timbre: 清楚而略带温度的成年声音, pace: 从容的中速, pitch: 中低音}
    mira:
      display_name: 陈弥拉
      tts: {delivery: 反应快、爱追问，后段表达更精确, timbre: 清亮且咬字利落的少女声音, pace: 稍快的中速, pitch: 中高音}
    elena:
      display_name: 埃琳娜
      tts: {delivery: 务实直接，偶尔带收住的冷幽默, timbre: 稳厚的成年女低音, pace: 稳定的中速, pitch: 中低音}
    jonah:
      display_name: 乔纳
      tts: {delivery: 有冲劲但肯在证据面前改口, timbre: 明亮而有共鸣的青年男声, pace: 较活跃的中速, pitch: 中音}
    nia:
      display_name: 妮娅
      tts: {delivery: 准确克制，解释限制时仍亲切, timbre: 清晰坚定的成年女中音, pace: 略慢的中速, pitch: 中低音}
    samir:
      display_name: 萨米尔
      tts: {delivery: 温暖从容，不把回忆说成训诫, timbre: 略带沙感的老年男声, pace: 有自然停顿的慢速, pitch: 中音}
    rowan:
      display_name: 罗文
      tts: {delivery: 程序清楚、用词平实而有分寸, timbre: 平衡沉稳的中性成年声音, pace: 克制的中速, pitch: 中音}
  pages:
    - id: p01
      illustration: p01
      blocks:
        - {id: p01-b01, speaker: narrator, text: "站在档案馆的露台上，陈弥拉能同时看见岚湾镇争论的两端。北坡下，灰阶坝托起一片平静的水面；取水渠从坝前伸向农田，像一根银线。坝下却是另一副样子，路明河绕过裸露的石滩，水面比上游低了许多。"}
        - {id: p01-b02, speaker: narrator, text: "弥拉十五岁，负责把旧维修单扫进新的河流档案。可这些纸没有给她一个干脆的答案：检查报告说坝体正在老化，农户记录说塘水仍在供田，鱼类调查则画出一道无法通过的横线。"}
        - {id: p01-b03, speaker: narrator, text: "六周后，全镇投票。弥拉原以为事实会替人作决定，很快却发现，不同事实正把人推向不同方向。"}
    - id: p02
      illustration: p02
      blocks:
        - {id: p02-b01, speaker: narrator, text: "水文学家妮娅带弥拉登上有护栏的溢洪道。一个坝孔出现细裂缝，小闸门启动时不断发抖，维修机器人随即将它停下。"}
        - {id: p02-b02, speaker: nia, text: "检查能告诉我们哪里弱、哪台设备不可靠，却不能替全镇选择修还是拆。"}
        - {id: p02-b03, speaker: narrator, text: "彻底加固并更换闸门，需要动用大半应急储备；拆坝同样要施工，也会带来新的风险。弥拉问，一座八十三岁的坝是否必然危险。"}
        - {id: p02-b04, speaker: nia, text: "年龄只是一项。还要看结构、维护、下游会受什么影响，以及这座坝今天还承担什么作用。"}
        - {id: p02-b05, speaker: narrator, text: "如果连保留的目的都没说清，比较费用就只是把两串数字摆在一起。"}
    - id: p03
      illustration: p03
      blocks:
        - {id: p03-b01, speaker: narrator, text: "坝下深潭边，乔纳把水下摄像头固定在石缝上。他靠带人钓鱼为生，却在鱼群洄游的这段时间主动关闭了这片钓场。影像里，几条鱼一次次游到混凝土前，又退回深水。"}
        - {id: p03-b02, speaker: jonah, text: "我能证明它们到了这里，不能保证拆坝以后会回来多少。"}
        - {id: p03-b03, speaker: narrator, text: "恢复连续河道，可以让鱼自行进入上游较冷的水域和产卵地；但鱼群是否增加，还受水温、流量、栖息地、捕捞以及镇外河段影响。"}
        - {id: p03-b04, speaker: narrator, text: "有人想把一条跃过坝顶的大鱼印在宣传图上，乔纳拒绝了。那幅图会把机会画成结果，而摄像头此刻只记录了一处障碍。"}
    - id: p04
      illustration: p04
      blocks:
        - {id: p04-b01, speaker: narrator, text: "天刚亮，农户埃琳娜打开取水渠的闸口。坝前水位较高，不用抽水就能流向十一户农户。她家种豆和留种谷物，邻居中有人管果园，也有人只租到一小块地。"}
        - {id: p04-b02, speaker: elena, text: "有人说旧水轮早停了，所以这座坝已经没用。可庄稼不是靠旧水轮喝水。"}
        - {id: p04-b03, speaker: narrator, text: "水塘不能让旱期凭空多出水，却能把丰水时留下的一部分水移到作物需要的时段。若先拆坝，河面可能降到取水口以下。大农场也许买得起泵，两户租地农户却未必。"}
        - {id: p04-b04, speaker: narrator, text: "埃琳娜并不否认河流生态，她追问的是：过渡期的损失会先落到谁身上？"}
    - id: p05
      illustration: p05
      blocks:
        - {id: p05-b01, speaker: narrator, text: "萨米尔约弥拉到旧水湾见面。浅岸已经长出成片湿地植物，几年前闸门故障后，镇里禁止人们下水。他从没有文字的木盒里取出一块圆石，说自己十二岁时在这里学会游泳。"}
        - {id: p05-b02, speaker: narrator, text: "后来冬天变暖，结冰少了；磨坊停工，正午汽笛也消失了。可他还记得两次洪水，镇民整夜守着溢洪道。弥拉问，保存水湾是不是保存记忆。"}
        - {id: p05-b03, speaker: samir, text: "记忆能证明这里对人有过意义，不能拿来做坝体受力试验。"}
        - {id: p05-b04, speaker: narrator, text: "他反对把水塘说成毫无价值，也不愿为了复原旧照片里的风景而修坝。他要大家诚实说出，改变会带走什么。"}
    - id: p06
      illustration: p06
      blocks:
        - {id: p06-b01, speaker: narrator, text: "第一次听证会上，议事主持人罗文把三件无字模型放上圆桌：加固保留、一个施工季内拆除、分阶段降低水位。第三件模型故意缺了几块，因为监测界线和供水条件还没定。"}
        - {id: p06-b02, speaker: narrator, text: "起初，人们只把声音抛向对面。钓手说鱼被堵住，农户就问水渠干了怎么办；老人讲水湾，年轻人马上报出修坝预算。罗文敲了一下橙红色小锤。"}
        - {id: p06-b03, speaker: rowan, text: "传感器量不到的价值，不等于虚假；会发光的预测，也不会因此变成事实。"}
        - {id: p06-b04, speaker: narrator, text: "他们要求每一方下次只带来三样东西：一个起作用的机制，一个尚未解决的问题，以及本群体之外某个人可能承担的后果。"}
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          content:
            - text: "妮娅的团队把透明取样管压进塘底，抽出的泥芯一层深、一层浅。河流带来并沉下的泥、沙、砾石等固体颗粒，统称为"
            - vocabulary: {id: sediment, text: 泥沙}
            - text: "。"
        - {id: p07-b02, speaker: narrator, text: "靠近入水处的颗粒较粗，坝前多是细泥，说明八十三年里堆积并不均匀。旧机器房旁的样本被送进实验室，因为过去的生产活动可能留下污染物。弥拉指着一层黑泥问，颜色这么深，是不是有毒。"}
        - {id: p07-b03, speaker: nia, text: "颜色回答不了。"}
        - {id: p07-b04, speaker: narrator, text: "检测结果出来以前，安全和有毒都只是猜测。即使样本都没有超过筛查值，泥沙的总量、颗粒大小和分布位置，仍会影响拆坝时怎样处理。"}
    - id: p08
      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: "在透明河槽中，妮娅向两条模型河道倒入等量净沙。坡陡、水急的一条很快把沙带走；另一条在弯道内侧留下小沙洲。这个实验只解释为什么可能不同，并不预测路明河一定变成哪一种。"}
        - {id: p08-b02, speaker: narrator, text: "真实结果还取决于颗粒大小、河道坡度、岸线形状、未来流量和拆除顺序。计算模型显示，突然打开大缺口可能造成较集中的早期泥沙脉冲；分段开口或许能把移动过程拉长，却也延长了施工和看护时间。"}
        - {id: p08-b03, speaker: nia, text: "模型能让我们先试假设，不能把假设变成现场观察。"}
        - {id: p08-b04, speaker: narrator, text: "弥拉于是把最可能与已经测到分开记在两栏。"}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: "乔纳请弥拉一起看一个月的水下影像。凉爽的傍晚，来到坝下的鱼更多，但镜头无法认出每一条鱼，也看不见障碍移除后它们会去哪里。"}
        - {id: p09-b02, speaker: narrator, text: "他提议在施工前给少量鱼装声学标记，并在几段上游河道设置接收器。妮娅指出，被标记的鱼只代表选中的个体和季节。乔纳接受了这个限制，把自己的主张改得更窄：拆除障碍会提供物理通道，后续监测才能说明鱼是否使用。"}
        - {id: p09-b03, speaker: narrator, text: "有人提出绕坝修一条缓坡鱼道，但陡岸和公路之间空间很小。乔纳没有再说那是假办法，而是要求先完成勘测和报价，即使这会削弱他原先最简单的说法。"}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: "埃琳娜带弥拉和工程师沿水渠走到取水口。水平测量说明，拆坝后的预测河面会低于渠口，原来的自流供水将中断。替代方案是在河外先挖一口较小的塘，用太阳能辅助泵在水量合适时补水。"}
        - {id: p10-b02, speaker: narrator, text: "新塘蓄水少，农户还得修补漏水渠，按土壤含水情况安排灌溉，并提前约定缺水时的次序。这些办法只能减少损耗、调整供水时段，不能在旱天制造新水。"}
        - {id: p10-b03, speaker: narrator, text: "埃琳娜连续问了三个具体问题：泵归谁维护，维修费从哪里出，停电或堵塞时谁先得水？工程草图已经画了管线和电池，却没有画出责任。弥拉把这三个问题原样写进听证材料。"}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: "萨米尔在安静的旧闸房里摆出几件档案物：磨坊轴承、儿童浮具、农田木闸把手和防洪志愿者用过的灯。它们放在一起，正好反驳灰阶坝只有一种用途的说法。"}
        - {id: p11-b02, speaker: narrator, text: "水轮停转后，农户重新组织了灌溉；水湾关闭后，岸边步道仍有人走。用途并非同时出现，也没有同时消失。"}
        - {id: p11-b03, speaker: mira, text: "我们总像在给大坝写唯一的一份传记。"}
        - {id: p11-b04, speaker: samir, text: "那是档案没做好，不是大坝一辈子只做一件事。"}
        - {id: p11-b05, speaker: narrator, text: "他希望未来设计保留部分物件和口述记录，却没有要求河流永远充当纪念碑。对他而言，保存故事不等于冻结现场。"}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: "公共河流实验室开放那天，妮娅把不同证据叠在同一片透明空间里。结构照片显示裂缝和旧闸门；泥芯地图标出取样位置，已检样本没有超过项目筛查值，但这不代表每个角落都测过。"}
        - {id: p12-b02, speaker: narrator, text: "水下影像证明鱼来到坝下，水渠计量记录则说明过去两个旱季农田得到多少自流水。只有未来河槽被画成几条半透明带，因为不同模型给出的位置并不完全一致。"}
        - {id: p12-b03, speaker: narrator, text: "居民不断问哪一层能证明哪张选票正确。妮娅没有选一层：测量描述已经发生的变化，模型估计可能发生的变化，记忆说明人珍惜什么，预算暴露能承担多少。证据不能独自决定风险该怎样分配。"}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: "农户小组第二次来到圆桌时，没有再说绝不能拆，而是提出前置条件：先建河外塘，并让泵站完整运行一个生长季。泵站必须按约定的旱季每周供水配额，把水送到最远的租地，还要有备用电源、维修资金和公开记录。"}
        - {id: p13-b02, speaker: narrator, text: "乔纳嫌一年太久。埃琳娜把渠口阀门慢慢关上，流水声随即消失。"}
        - {id: p13-b03, speaker: elena, text: "一个没试过的承诺，到了我田里就是这种声音。"}
        - {id: p13-b04, speaker: narrator, text: "她并未要求新系统复制历年全部供水，农户已经同意节水和轮灌；她要求的是，不能让资金最少的两户先替全镇试错。乔纳问，泵站试运行能否与鱼类、泥沙调查同时进行。埃琳娜说可以，只有动坝要等。"}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: "乔纳的小组也修改了主张。若选择修坝，设计中必须加入由专业团队评估的通鱼路线，不能又把灰阶坝原样封上几十年。若选择拆坝，也不能把打通河道宣传成鱼群马上恢复。"}
        - {id: p14-b02, speaker: narrator, text: "他和妮娅实地走过备选鱼道。要让鱼自行通过，坡度必须合适，入口在不同水位下都要能找到，还不能危及邻近桥基。勘测尚未完成，费用可能低于拆坝，也可能更高。"}
        - {id: p14-b03, speaker: jonah, text: "我仍偏爱开放河道。可偏爱一个结果，不等于我已经证明其他办法都失败。"}
        - {id: p14-b04, speaker: narrator, text: "少了最响亮的句子，他的意见反而更便于比较。"}
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          content:
            - text: "妮娅要求先建立"
            - vocabulary: {id: baseline, text: 基线}
            - text: "，也就是工程开始前的一组测量，供以后比较。"
        - {id: p15-b02, speaker: narrator, text: "团队将记录河槽形状、渠水量、水温、悬浮物和鱼类活动，并让记录跨过几个季节。弥拉问，一个月难道还不够长？"}
        - {id: p15-b03, speaker: narrator, text: "妮娅举了几个会误导人的情况：多雨时可能掩盖供水紧张，低温会改变鱼的活动，一场暴雨移动的泥沙也许超过许多平常日。更长的记录仍无法包含所有年份，却能让人看见季节变化，避免拿一个反常下午与未来整月平均状况相比。"}
        - {id: p15-b04, speaker: narrator, text: "弥拉这才明白，第一份有用的结论不是河变好了，而是准确说明改变之前的河是什么样。"}
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          content:
            - text: "第二次听证会上，罗文要求每个方案说明其中怎样"
            - vocabulary: {id: tradeoff, text: 权衡}
            - text: "：为了争取哪项好处，又接受哪项损失或风险。"
        - {id: p16-b02, speaker: narrator, text: "修坝能最快保住自流灌溉，却要把大笔资金投向仍需维护、仍要解决鱼类通行的障碍。立即拆坝最快打开河道，却会在替代供水未经验证时集中承受施工、泥沙和断水风险。"}
        - {id: p16-b03, speaker: narrator, text: "分阶段拆坝把第一次不可逆行动做小，却延长管理、费用与等待。没有一个选项能把代价一栏留空。萨米尔要求，水湾历史不能只写在修坝方案下面。"}
        - {id: p16-b04, speaker: narrator, text: "罗文同意：拆除以后可以用档案、步道和部分旧物继续讲述，但这些安排只能回应损失，不能假装损失从未发生。"}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "妮娅接着展示带暂停点的分阶段方案。第一步只做替代灌溉和基线监测；第二步在许可规定的流量时段缓慢降低塘水，并切开一个小缺口。"}
        - {id: p17-b02, speaker: narrator, text: "下游仪器持续记录悬浮泥沙、河槽变化、水温和渠水量。如果后续样本检出需要处理的污染，或泥沙、供水指标越过许可阶段设定的界线，施工必须停下，由独立小组复核。"}
        - {id: p17-b03, speaker: narrator, text: "只有复核通过，缺口才能扩大。妮娅把这种做法称为可调整的管理，因为下一步会随着实测结果改变。"}
        - {id: p17-b04, speaker: narrator, text: "她也明确指出局限：第一个缺口一旦改变水塘，有些影响无法完全倒回。暂停可以限制风险范围，却不能把昨天原样装回来。"}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "投票前，河外塘试验启动了。埃琳娜和乔纳看着泵站注水，弥拉在最远的租地测渠水流量。第一个炎热下午，水藻堵住进水滤网，远端流量下降。"}
        - {id: p18-b02, speaker: narrator, text: "乔纳帮忙清理，埃琳娜联系设备商。故障未否定设计，却暴露了预算遗漏的维护工作。加装一道滤网和远程报警后，第二轮试验恢复正常。"}
        - {id: p18-b03, speaker: elena, text: "要是等拆除部分坝体、旧自流渠因落差不足而减流后才发现，我准会怪你那些鱼。"}
        - {id: p18-b04, speaker: jonah, text: "怪得有道理吗？"}
        - {id: p18-b05, speaker: elena, text: "没道理，但很容易发生。"}
        - {id: p18-b06, speaker: narrator, text: "乔纳把清理周期和负责人补进方案。争议未解，他们只让隐蔽风险成了有人负责的任务。"}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: "投票前夜，萨米尔把水湾圆石带到档案馆。弥拉想把它封存在老照片旁边，他却一直没有松手。保存下来的物件能承载故事，也容易让后来的人误以为变化已经被妥善收好。"}
        - {id: p19-b02, speaker: narrator, text: "未来岸边可能成为步道、湿草地、施工后的乱石坡，也可能几种样子先后出现，没有一幅效果图能保证孩子将来会记住哪一幕。萨米尔最后把圆石放到一件可以改变河槽形状的模型旁。"}
        - {id: p19-b03, speaker: samir, text: "别急着给最后一格写说明。"}
        - {id: p19-b04, speaker: narrator, text: "弥拉明白，他不是反对记录，而是要求档案把预测标成预测，等真实结果出现以后再补。她在圆石旁留出一个空位。"}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: "第二天上午，岚湾镇采用不记名投票。选票列出三项：修坝并完成鱼道研究；立即拆坝并提供临时灌溉；分阶段拆坝，同时落实资金、前置试验和暂停点。"}
        - {id: p20-b02, speaker: narrator, text: "说明中还写明，没有任何选项能保证鱼群恢复、农田永久有水或未来河槽固定不变。弥拉未到投票年龄，只负责引导行动不便的萨米尔进入无障碍投票间，随后退开。"}
        - {id: p20-b03, speaker: narrator, text: "半透明隔板后只看得见手和没有字符的发光球。听证会上每个人都要解释立场，投票时却没有人需要表演确定。"}
        - {id: p20-b04, speaker: narrator, text: "投票口关闭后，罗文和两名观察员核验加密计票，居民站在三件模型旁，等着知道全镇接受了哪一种代价。"}
    - id: p21
      illustration: p21
      blocks:
        - {id: p21-b01, speaker: narrator, text: "分阶段方案获得过半支持。罗文没有宣布岚湾镇投票解放了河流。"}
        - {id: p21-b02, speaker: rowan, text: "全镇授权的是一套行动顺序。"}
        - {id: p21-b03, speaker: narrator, text: "首批资金必须用于替代灌溉、基线监测、设计复核、许可和泥沙防护。切开首个缺口以后，公开指标一旦越线，独立小组有权暂停。继续施工需要发布复核报告；除非费用突破选票批准的上限，否则不再举行全镇投票。"}
        - {id: p21-b04, speaker: narrator, text: "支持修坝的人没有赢，却把供水和审查条件写进了结果；主张立即拆除的人得到通向开放河道的路径，却没有得到原先要求的速度。弥拉没有感到胜利般轻松。这项决定先分配了工作和责任，功劳还无从谈起。"}
    - id: p22
      illustration: p22
      blocks:
        - {id: p22-b01, speaker: narrator, text: "几个月后，灰阶坝仍横在路明河上。基线传感器沿岸立起，自流渠输送春水，挖掘机在远离主河道的地方修整河外塘。鱼还不能通过，拆坝泥沙也未移动。"}
        - {id: p22-b02, speaker: narrator, text: "弥拉与埃琳娜、乔纳、妮娅、萨米尔站在施工区上方。泵站还要试几个月，新泥芯结果下周才到。弥拉打开河流档案。"}
        - {id: p22-b03, speaker: narrator, text: "她没有写全镇选择了河流，因为农田、鱼、记忆、预算和安全都挤在这句话里。"}
        - {id: p22-b04, speaker: narrator, text: "她写下岚湾镇决定先测什么、哪条界线会叫停工程、由谁公开结果。随后，她在记录末尾空出一段，留给河流回答。"}
