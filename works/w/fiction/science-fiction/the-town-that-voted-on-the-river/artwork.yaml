schema_version: 1
style: luminous-future-technology
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  mira: Fifteen-year-old East Asian girl, round face, chin-length straight black hair tucked behind one ear, teal rain jacket with coral zipper, graphite trousers, white boots, transparent cyan field tablet with no visible writing.
  elena: Sturdy middle-aged Latina woman, warm brown skin, dark curly hair in a low bun, moss-green work shirt, cream utility vest, graphite pants, brown field boots, coil of cyan irrigation hose.
  jonah: Lean Black man in his late twenties, deep brown skin, short twists, coral windbreaker, charcoal shirt, teal waders, plain graphite fishing rod.
  nia: Tall Black woman in her forties, dark skin, close-cropped hair, warm-white field coat with cyan seams, graphite trousers, white boots, compact transparent sampling case with unmarked vials.
  samir: Slender seventy-year-old South Asian man, medium-brown skin, swept silver hair, short silver beard, mustard cardigan, cream shirt, dark teal trousers, brown shoes, plain wooden photo box.
  rowan: White nonbinary adult in their fifties, fair skin, short auburn hair graying at temples, graphite jacket with narrow cyan collar, cream trousers, coral wooden gavel.
  dam: Graystep is a weathered low concrete dam with three rounded spillway bays, one small rusted mechanical gate, a narrow gravity canal leaving the upstream pond, and no signage or lettering.
  town: Alder Bend uses rounded warm-white buildings, glass roofs, cyan path lights, fresh greenery, small solar canopies, and no visible screens containing glyphs.
  palette: Warm white, graphite, cyan, fresh green, river blue, earthy brown, and small coral accents in bright diffuse daylight.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Wide elevated view of all six townspeople on a river overlook between the old low Graystep Dam, irrigated fields, and a free-flowing upstream reach, with a luminous wordless civic voting sphere at the center and no outcome implied.
  - id: p01
    file: artwork/p01.webp
    scene: Mira on the town archive balcony sees Graystep Dam, the quiet pond, downstream river, gravity canal, fields, and near-future Alder Bend in one coherent landscape.
  - id: p02
    file: artwork/p02.webp
    scene: Nia and Mira inspect weathered spillway concrete and a rusted gate mechanism from a safe railed platform while maintenance robots scan without visible text.
  - id: p03
    file: artwork/p03.webp
    scene: Jonah stands downstream in teal waders beside the dam while several migratory fish circle below the barrier and the upstream river is visible beyond.
  - id: p04
    file: artwork/p04.webp
    scene: Elena opens the plain gate of the gravity irrigation canal above the dam and water flows through cyan-lined channels toward green crop rows.
  - id: p05
    file: artwork/p05.webp
    scene: Samir and Mira sit at the former swimming cove beside the pond; Samir holds his smooth cove stone while a closed plain wooden photo box rests beside him and new wetland plants edge the shore.
  - id: p06
    file: artwork/p06.webp
    scene: In a bright circular civic hall, Rowan moderates as residents examine three abstract physical models of repair, immediate removal, and staged removal, all completely wordless.
  - id: p07
    file: artwork/p07.webp
    scene: Nia lowers unmarked sampling tubes into layers of mud, sand, and gravel behind the dam while Mira records on a blank-glowing tablet.
  - id: p08
    file: artwork/p08.webp
    scene: A transparent tabletop river model shows stored sediment moving differently through two channels of different slope while Nia and Mira observe.
  - id: p09
    file: artwork/p09.webp
    scene: Jonah and Mira use a small underwater camera below the dam and watch fish approach the barrier, with the camera display showing only silhouettes and no symbols.
  - id: p10
    file: artwork/p10.webp
    scene: Elena and neighboring farmers trace the gravity canal to an intake that would stand above a lower free-flowing river, using an unmarked scale model.
  - id: p11
    file: artwork/p11.webp
    scene: Mira interviews Samir beside the silent old gatehouse while he lays plain unlabeled objects from several decades on a bench.
  - id: p12
    file: artwork/p12.webp
    scene: At a public river lab, Nia projects layered wordless maps of fish movement, sediment zones, irrigation flow, and structural condition; residents stand in distinct groups rather than reaching agreement.
  - id: p13
    file: artwork/p13.webp
    scene: Elena demonstrates a proposed small off-channel storage pond and solar-assisted pump beside fields, while engineers inspect pipe levels and Jonah watches.
  - id: p14
    file: artwork/p14.webp
    scene: Jonah walks a rocky bypass route with Nia; flags without marks show that a fish passage alternative would require space near a road bridge.
  - id: p15
    file: artwork/p15.webp
    scene: Mira arranges paired baseline instruments along the river to measure water, riverbed, fish movement, and canal flow before any construction.
  - id: p16
    file: artwork/p16.webp
    scene: In the second hearing, residents place colored glass tokens beside wordless threshold models for sediment, irrigation supply, and fish passage while Rowan listens.
  - id: p17
    file: artwork/p17.webp
    scene: Nia reveals a staged engineering model with a small first notch, downstream sediment traps, an off-channel pond, and a clear physical pause gate, all without text.
  - id: p18
    file: artwork/p18.webp
    scene: Elena and Jonah test the proposed irrigation pump together at the off-channel pond while Mira measures canal flow and neither appears fully convinced.
  - id: p19
    file: artwork/p19.webp
    scene: Samir places one smooth stone from the old cove into a transparent community archive case beside a model of the changing river, with no labels.
  - id: p20
    file: artwork/p20.webp
    scene: Town residents cast private votes by placing plain glowing spheres into three curved slots behind translucent screens, with no letters, numbers, or result display.
  - id: p21
    file: artwork/p21.webp
    scene: Rowan announces the qualified decision through gesture as the staged model lights up; residents study the conditions and pause mechanism rather than celebrate unanimously.
  - id: p22
    file: artwork/p22.webp
    scene: At dawn months later, baseline sensors stand beside a functioning gravity canal and the still-intact dam while Mira, Elena, Jonah, Nia, and Samir watch technicians begin the off-channel pond; no removal has begun.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - all 23 work images visually inspected at final WebP resolution
      - scenes match the declared page actions and qualified ending
      - recurring characters and Graystep Dam remain identifiable across scenes
      - no visible text, letters, numbers, logos, captions, or watermarks
