schema_version: 1
required: true
fictional_scope: >-
  Alder Bend, Graystep Dam, the Lumen River, the town charter, every character,
  all measurements, the digital model, the ballot design, and the final staged
  plan are invented. The story uses real, broadly documented mechanisms of dam
  removal but does not claim that its fictional engineering plan would be safe
  or lawful at another site. Exact removal design, permits, sediment handling,
  fish response, irrigation replacement, and monitoring must be site-specific.
sources:
  - url: https://www.fisheries.noaa.gov/feature-story/how-removing-dams-changes-river-channels
    title: How Removing Dams Changes River Channels
    publisher: NOAA Fisheries
    supports: >-
      Dams create impoundments that trap gravel, sand, silt, and clay; removal
      can release stored material, and downstream response depends on local
      channel slope and flow. Clean sediment may be allowed to move, while
      contaminated sediment generally requires removal or other management.
  - url: https://www.fisheries.noaa.gov/feature-story/what-happens-after-dam-removals
    title: What Happens After Dam Removals
    publisher: NOAA Fisheries
    supports: >-
      Before-and-after monitoring can cover channel form, bed material, water
      quality, fish passage, fish communities, wetlands, and riverbank plants;
      outcomes at sites with little stored sediment need not match other sites.
  - url: https://www.usgs.gov/centers/california-water-science-center/science/klamath-dam-removal-studies
    title: Klamath Dam Removal Studies
    publisher: U.S. Geological Survey
    supports: >-
      Large removals can produce a pulse of fine suspended sediment; timing and
      sequencing may be planned to reduce downstream effects, and repeated
      sampling and channel mapping are used to measure change.
  - url: https://www.fisheries.noaa.gov/west-coast/science-data/dam-removals-elwha-river
    title: Dam Removals on the Elwha River
    publisher: NOAA Fisheries
    supports: >-
      Dams can block migratory fish and interrupt downstream movement of
      sediment and wood. Reopening a river can restore access while active
      removal may temporarily raise suspended sediment and depress some
      downstream organisms.
  - url: https://www.fisheries.noaa.gov/national/habitat-conservation/reopening-rivers-migratory-fish
    title: Reopening Rivers for Migratory Fish
    publisher: NOAA Fisheries
    supports: >-
      Barrier removal is one method used to reopen habitat for migratory fish;
      fish passage goals concern access through connected river reaches rather
      than a promise of immediate population recovery.
  - url: https://www.fisheries.noaa.gov/feature-story/how-do-scientists-know-where-fish-go
    title: How Do Scientists Know Where Fish Go?
    publisher: NOAA Fisheries
    supports: >-
      In acoustic telemetry, researchers attach individually identifiable
      electronic tags to fish and place data-logging receivers in locations of
      interest. A receiver records when a tagged fish swims within detection
      range, allowing researchers to study the movements of sampled individuals,
      including migration through different reaches.
  - url: https://media.fisheries.noaa.gov/2023-02/anadromous-salmonid-passage-design.pdf
    title: Anadromous Salmonid Passage Facility Design
    publisher: NOAA Fisheries, National Marine Fisheries Service
    supports: >-
      Fish-passage design must match channel slope and roughness to suitable
      hydraulic conditions. Fishway entrances should be located where fish can
      find and enter attraction flow, and entrance configuration may need to
      accommodate different streamflows and tailwater levels.
  - url: https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P100QIDX.TXT
    title: Applicability of EPA Regulations and Funding to the Removal of Obsolete Dams - Frequently Asked Questions
    publisher: U.S. Environmental Protection Agency
    supports: >-
      Monitoring and testing requirements are site-specific. Baseline and
      post-project monitoring may include sediment volume and texture,
      temperature, dissolved oxygen, metals, fish, mussels, and other measures;
      historical land use can create reason to test impounded sediment.
  - url: https://pubs.usgs.gov/circ/circ1139/htdocs/effects_of_human_activities_on_t.htm
    title: Effects of Human Activities on the Interaction of Ground Water and Surface Water
    publisher: U.S. Geological Survey
    supports: >-
      Reservoirs store water for uses including irrigation because river flow
      varies and the time of abundant flow may not match the time of demand.
      Reservoirs also alter nearby surface-water and groundwater relations.
  - url: https://www.usbr.gov/lc/yuma/facilities/dams/yao_dams_map.html
    title: Dams Along the Lower Colorado River
    publisher: U.S. Bureau of Reclamation
    supports: >-
      Real storage and diversion dams can provide or help divert irrigation
      water, supporting the story's general mechanism that a raised pond can
      feed an agricultural intake. The fictional replacement system is not
      taken from this example.
  - url: https://usbr.gov/research/projects/detail.cfm?id=845
    title: Improved Water Delivery through Modern Canal Materials
    publisher: U.S. Bureau of Reclamation
    supports: >-
      Canal linings can substantially reduce irrigation-water seepage, although
      effectiveness, cost, durability, and suitable materials vary by canal and
      site. This supports lining as one possible loss-reduction measure in the
      fictional proposal, not its suitability or expected savings at Alder Bend.
  - url: https://www.ars.usda.gov/research/publications/publication/?seqNo115=261396
    title: Irrigation Scheduling for Humid Environments
    publisher: U.S. Department of Agriculture, Agricultural Research Service
    supports: >-
      Irrigation scheduling can use crop demand, weather, soil conditions, and
      available soil moisture to determine when irrigation is needed and better
      match application timing to crop water use. This supports the fictional
      scheduling measure, not a site-specific schedule for Alder Bend.
  - url: https://www.fema.gov/sites/default/files/documents/fema_factsheet_cobrand_damremovals_june2024.pdf
    title: High Hazard Potential Dams - When Removal Benefits Outweigh Repair
    publisher: Federal Emergency Management Agency
    supports: >-
      Decisions about aging dams can compare structural condition, remaining
      purpose, maintenance, repair, reconstruction, and removal. Removal may be
      appropriate in some cases but follows assessment rather than age alone.
  - url: https://www.epa.gov/superfund/how-superfund-cleans-sediment-sites
    title: How Superfund Cleans Up Sediment Sites
    publisher: U.S. Environmental Protection Agency
    supports: >-
      Sediment sampling and analysis determine the nature and extent of
      contamination; contaminated material may require controlled removal,
      treatment, and disposal rather than uncontrolled release.
  - url: https://www.wcc.nrcs.usda.gov/ftpref/wntsc/waterMgt/irrigation/NEH15/ch7.pdf
    title: National Engineering Handbook, Part 623, Chapter 7 - Microirrigation
    publisher: U.S. Department of Agriculture, Natural Resources Conservation Service
    supports: >-
      Moderate algae loads can quickly block irrigation screen filters; filter
      design, cleaning, and scheduled maintenance affect pressure and delivery.
      This supports the fictional pump-test failure and its maintenance response,
      not the specific equipment or trial outcome invented for Alder Bend.
  - url: https://pubs.usgs.gov/publication/70244062
    title: A decision-support framework for dam removal planning and its application in northern California
    publisher: U.S. Geological Survey
    supports: >-
      Dam-removal planning can integrate hydro-ecological, social, cultural,
      cost, and data-availability factors; prioritization is only a first step,
      with detailed feasibility work and stakeholder engagement still required.
  - url: https://pubs.usgs.gov/publication/70099125
    title: Guidelines for monitoring and adaptively managing restoration of Chinook salmon and steelhead on the Elwha River
    publisher: U.S. Geological Survey
    supports: >-
      Uncertain sediment and fish responses can justify explicit goals,
      monitoring, and adaptive management that preserves flexibility as measured
      outcomes arrive. It does not establish Alder Bend's fictional thresholds.
notes: >-
  The sources establish mechanisms and decision factors, not the outcome of a
  universal pro-removal rule. The story therefore separates modeled forecasts
  from observed baseline data, makes fish recovery uncertain, gives irrigation
  replacement a condition of the vote, and requires a pause if sediment or
  water-supply thresholds are not met.
