schema_version: 3
language: en-US
writer: rain-song
title: The Acorns Hazel Could Not Count
summary: "Hazel counts every acorn she hides because she remembers being hungry last winter. Wind, rain, and other animals ruin her marks, so she learns to search by roots, rocks, scent, and memory. In deep snow, a cache whose number she lost feeds her and Rook. Spring reveals that some unrecovered acorns have become seedlings. After saving one small oak, Hazel stores the next autumn's first acorn without giving it a number."
chapters:
  - id: ch01
    title: A Number for Winter
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: The Moving Map
    page_refs: [p05, p06, p07, p08]
  - id: ch03
    title: Under the Snow
    page_refs: [p09, p10, p11, p12]
  - id: ch04
    title: What Grew
    page_refs: [p13, p14, p15, p16]
questions:
  - id: q01
    type: character-motive
    prompt: Why does Hazel want a number for all her acorns?
    answer: "She remembers going hungry when snow covered her empty holes, so counting makes her feel prepared for winter."
    page_refs: [p01, p02]
  - id: q02
    type: cause-effect
    prompt: Why can Hazel no longer trust her map and white stone?
    answer: "Wind scatters her twig arrows, rain changes the scratches, and other animals move or take acorns."
    page_refs: [p05, p06]
  - id: q03
    type: sequence
    prompt: What does Hazel do after she stops returning to the stone?
    answer: She learns the shapes of roots and rocks and uses the smell of disturbed earth.
    page_refs: [p07]
  - id: q04
    type: evidence
    prompt: Which clues help Hazel find food in the deepest snow?
    answer: "She remembers the hawk's shadow, silver-backed leaves, low brush, and a rock shelf."
    page_refs: [p08, p10]
  - id: q05
    type: cause-effect
    prompt: How do the scattered hiding places help Hazel survive winter?
    answer: "Some caches are empty or lost, but one missing cache does not empty all the others."
    page_refs: [p09, p11, p12]
  - id: q06
    type: main-idea
    prompt: What shows that Hazel's idea about a forgotten acorn has changed?
    answer: "She protects a seedling that may have grown from a forgotten cache, then stores a new acorn without counting it."
    page_refs: [p13, p14, p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "An acorn drops beside Hazel. She remembers last winter, when snow covered three empty holes and hunger drove her to bitter bark."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "This year Hazel will count every sound acorn. She hides them in many small caches, so one thief cannot take them all."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Rook hears Hazel count forty-one twice. Hazel finds a white stone and scratches one line for every ten acorns."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Soon Hazel cannot find one numbered cache. Leaves have moved since she buried it, and the empty soil makes her belly tighten."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "Hazel builds a better map with bark notches and twig arrows. A gust turns one arrow while Rook watches."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Night rain scatters the arrows and changes the stone's marks. A mouse takes two acorns, and another squirrel moves one."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Hazel keeps storing, but she stops visiting the stone. She learns bent roots and split rocks, and smells for freshly moved earth."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "A hawk's shadow sends Hazel under low brush. She buries one acorn beside a rock shelf, then cannot tell which silver-backed leaves covered it."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "Snow comes. Hazel finds more caches than she misses. Mouse tracks mark one empty hole, and another search ends at a stone."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "In deep winter, Hazel's nest holds only shells. She remembers the hawk, the flashing leaves, the low brush, and the rock shelf."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "Under the third clump, her claw taps shell. There are two acorns. Hazel cannot know who buried the second one."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "Hazel shares one with Rook. After that, she searches by memory, scent, roots, and any leaf the wind uncovers."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "Spring softens the ground. Beside the fallen log, Hazel finds a green shoot wearing a split acorn shell. More shoots rise nearby."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Some may be Hazel's forgotten stores. When a dead branch pins the smallest seedling, Hazel turns back and drags it away."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "By summer, some seedlings are gone. The little oak beside the log grows dark green leaves, and Hazel sometimes guards it from caterpillars."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "Autumn drops another sound acorn. Hazel buries it beyond the white stone. Rook asks for its number. 'I remember this one,' she says."
