schema_version: 3
language: zh-CN
writer: 雨歌
title: 数到春天的橡果
summary: 榛榛想起去年冬天挨饿的滋味，于是给每颗藏好的橡果计数。风雨和别的动物弄乱了记号，她便改用树根、岩石、气味和记忆寻找食物。深雪里，一处记不准数目的贮藏让她和黑羽吃到了橡果。春天，一些没被找回的橡果长成幼苗。榛榛救下一株小橡树，第二年秋天再藏橡果时，不再给它编号。
chapters:
  - id: ch01
    title: 给冬天一个数
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 会动的地图
    page_refs: [p05, p06, p07, p08]
  - id: ch03
    title: 雪下的橡果
    page_refs: [p09, p10, p11, p12]
  - id: ch04
    title: 没找回来的
    page_refs: [p13, p14, p15, p16]
questions:
  - id: q01
    type: character-motive
    prompt: 榛榛为什么想数清所有橡果？
    answer: 她记得去年大雪盖住空洞，自己饿得啃树皮，所以数清橡果让她觉得自己能为过冬做好准备。
    page_refs: [p01, p02]
  - id: q02
    type: cause-effect
    prompt: 榛榛为什么不能再相信地图和白石？
    answer: 风吹散树枝箭头，雨改变石上的划痕，别的动物还会拿走或搬动橡果。
    page_refs: [p05, p06]
  - id: q03
    type: sequence
    prompt: 不再回白石画线后，榛榛怎样记藏果地点？
    answer: 她记住弯曲的树根和裂开的岩石，还靠气味寻找刚被翻动的土。
    page_refs: [p07]
  - id: q04
    type: evidence
    prompt: 哪些线索帮榛榛在深雪里找到食物？
    answer: 她想起鹰影、背面银白的叶子、矮灌木和石台。
    page_refs: [p08, p10]
  - id: q05
    type: cause-effect
    prompt: 分散的小坑怎样帮助榛榛过冬？
    answer: 有些贮藏空了或找不到，但一处空洞不会让所有食物都消失。
    page_refs: [p09, p11, p12]
  - id: q06
    type: main-idea
    prompt: 哪些行动说明榛榛对遗忘橡果的看法变了？
    answer: 她保护了可能由遗忘橡果长成的幼苗，后来又藏下一颗不编号的橡果。
    page_refs: [p13, p14, p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 橡果落在榛榛身边。她想起去年冬天，大雪盖住三个空洞，她饿得只好啃苦树皮。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 今年，榛榛要数清每颗好橡果。她把它们分开藏进小坑，这样一处被偷，别处还在。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 黑羽听见榛榛数到四十一时，把“四十一”念了两遍。她找来一块白石，每藏十颗，就在石上画一道。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 不久，榛榛找不到其中一个编过号的小坑。落叶早已换了位置，空空的泥土让她心里发紧。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 榛榛用树皮缺口和树枝箭头做了新地图。一阵风吹来，黑羽看着一根箭头转了方向。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 夜雨冲散箭头，也改变了白石上的划痕。田鼠拿走两颗橡果，陌生松鼠又搬走一颗。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 榛榛继续藏果，却不再跑回白石。她记住弯曲的树根和裂开的岩石，还靠气味寻找刚翻动过的泥土。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 鹰影掠过，榛榛钻进矮灌木。她把一颗橡果埋在石台边，却分不清哪片背面银白的叶子盖着它。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 下雪了。榛榛找到的藏果点比没找到的多。可一个空洞旁有鼠脚印，另一个坑里只有圆石。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 深冬里，窝中只剩空壳。榛榛想起鹰影、闪动的银背叶、矮灌木，还有那座石台。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 挖到第三簇灌木时，她的爪尖碰到硬壳。土里有两颗橡果，第二颗是谁埋的，她不知道。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 榛榛分给黑羽一颗。以后，她靠记忆、气味和树根寻找食物，也查看被风吹开的落叶缝隙。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 春天把泥土变软。倒木旁，一根绿芽顶着裂开的橡果壳，附近还有几株小芽。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 有些也许从榛榛忘掉的贮藏点长了出来。枯枝压住最小的幼苗时，她转身回来，用力把树枝拖开。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 到了夏天，有些幼苗不见了。倒木旁的小橡树长出深绿叶子，榛榛偶尔替它赶走毛虫。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 秋天又落下一颗好橡果。榛榛越过白石，把它埋好。黑羽问它的编号，她说：“这一颗，我记得。”
