schema_version: 3
language: en-US
writer: rain-song
title: The Open Stone
summary: "Mina waits for swifts to return to an old tower that is about to be repaired. She and the keeper map seven entrances, but she must erase guesses and record only what they truly see. Her evidence helps a repair team protect active nests until heavy rain shifts a dangerous stone above one nest. The team braces the stone without blocking the entrance, and Mina confirms a fledgling's safe departure before the wall is repaired around the open nesting spaces. In autumn, she accepts that no map can promise the birds' return, while the tower keeps their doors open."
chapters:
  - id: ch01
    title: The Returning Birds
    page_refs: [p01, p02, p03, p04, p05, p06, p07]
  - id: ch02
    title: A Plan from Evidence
    page_refs: [p08, p09, p10, p11]
  - id: ch03
    title: Nest Four in the Rain
    page_refs: [p12, p13, p14, p15, p16]
  - id: ch04
    title: The Doors Left Open
    page_refs: [p17, p18, p19, p20]
questions:
  - id: q01
    type: evidence
    prompt: "What evidence made Mina keep a red circle on her map?"
    answer: "She kept a circle only after she saw a swift use the same entrance on different days."
    page_refs: [p04, p06]
  - id: q02
    type: evidence
    prompt: "What showed that Mina became a more careful observer?"
    answer: "At first she made four marks without knowing which entrances the birds used. Later she followed a fledgling's tail and recorded one fledgling only after confirming it was the same bird returning."
    page_refs: [p05, p17]
  - id: q03
    type: cause-effect
    prompt: "Why did the team change the repair schedule?"
    answer: "Mina's map showed active entrances, and the experts confirmed the birds' flight paths, so the team began on the west wall and delayed occupied areas."
    page_refs: [p08, p09, p10]
  - id: q04
    type: character-motive
    prompt: "Why did the foreman choose the narrow brace during the storm?"
    answer: "She wanted to keep the loose stone from falling without opening the nest chamber or blocking the parent swift from entering."
    page_refs: [p12, p13, p14]
  - id: q05
    type: short-answer
    prompt: "What three signs showed that the repair around Nest Four could continue?"
    answer: "The brace survived more rain, Mina confirmed one fledgling had flown, and the bird specialist confirmed the young had left that section."
    page_refs: [p16, p17, p18]
  - id: q06
    type: main-idea
    prompt: "What did Mina learn that a careful record can and cannot do?"
    answer: "A careful record can help people protect real nesting places, but it cannot guarantee where the swifts will fly or whether they will return."
    page_refs: [p06, p18, p19, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "On April eighteenth, Mina watched an empty sky above the old tower. The keeper's ledger showed different return dates each spring."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Scaffolding poles waited by the wall. Loose mortar had fallen near the gate. Workers planned to seal gaps where Mina had seen swifts vanish."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "At dusk, eleven swifts swept around the roof. One slipped beneath a loose stone at the east corner. Mina brought a red pencil the next day."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Mina and the keeper watched from the ground. She marked an entrance only after seeing a bird enter it. They never climbed toward nests."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "Two swifts crossed near the bell opening. Mina made four marks but could not identify four entrances. Guesses did not belong in a record of sightings."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Mina erased the extra marks. After twelve afternoons, they had repeatedly seen swifts use seven marked entrances. Three uncertain spots remained as faint dots beside question marks."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Adults returned with insects, so Mina guessed chicks had hatched. A map showed tracked Beijing swifts traveling to southern Africa and back."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "At the repair meeting, the foreman showed a dangerous crack. Mina laid down her map. The keeper added twenty-three years of records."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "The foreman believed Mina, but circles could not prove the stones were safe. A bird specialist and engineer checked the flight paths and inspected the wall."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "The experts watched behind a safety line. Their findings changed the plan. Work began on the unused west wall, while the occupied areas were left for later."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "Scaffolding covered much of the tower, but the east approach stayed open. Workers put down their drills as swifts entered seven shadowed openings."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "After three rainy days, fresh dust appeared below Nest Four. Its crack had widened. The stone could break the nest and hurt someone below."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "Removing the stone would open the nest. Leaving it in place might let it fall. The engineer proposed a narrow brace that kept the entrance clear."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "The brace could fail, and the courtyard must stay closed. The foreman chose it and asked for approval. Her plan had to account for every risk."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "A parent swift carrying insects veered away from the lift, circled, and tried again. The foreman and engineer froze until it entered the old opening."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "The brace held through the next rain, and the entrance stayed clear. Mina added no circle. She recorded only that Nest Four remained in use."
    - id: p17
      illustration: p17
      paragraphs:
        - text: "In July, a young swift launched from Nest Four. Mina thought she saw two. She followed its tail and recorded only one fledgling after it circled back."
    - id: p18
      illustration: p18
      paragraphs:
        - text: "A specialist confirmed the young birds had left. Workers repaired the east wall, kept known entrances, and added safe nesting spaces. Birds might not choose them."
    - id: p19
      illustration: p19
      paragraphs:
        - text: "In September, the last swifts scattered northwest. Tracked Beijing swifts often began migration that way. Mina could not know each bird's next stop."
    - id: p20
      illustration: p20
      paragraphs:
        - text: "Would the swifts return? The keeper did not know. Seven openings stayed unsealed while they recorded the year's last confirmed sighting."
