schema_version: 3
language: zh-CN
writer: 雨歌
title: 老城楼的雨燕
summary: "城楼即将修缮，小禾却迟迟等不到每年归来的雨燕。她和老沈确认了七个巢洞，也在老沈的提醒下擦去没有证据的红圈。她的记录帮助施工团队调整方案，但连日大雨让第四号洞上方的松砖突然变得危险。大家用窄支撑保住砖墙和洞口，小禾又等到幼鸟安全离巢，修缮才继续。秋天，她明白记录能帮助人们留下真正的巢洞，却不能保证每只鸟的路线和归期。"
chapters:
  - id: ch01
    title: 归来的雨燕
    page_refs: [p01, p02, p03, p04, p05, p06, p07]
  - id: ch02
    title: 证据变成方案
    page_refs: [p08, p09, p10, p11]
  - id: ch03
    title: 雨里的第四号洞
    page_refs: [p12, p13, p14, p15, p16]
  - id: ch04
    title: 留下来的门
    page_refs: [p17, p18, p19, p20]
questions:
  - id: q01
    type: evidence
    prompt: 小禾凭什么把一个红圈留在图上？
    answer: 她要在不同日子看见雨燕使用同一个入口，才会保留并描深那个红圈。
    page_refs: [p04, p06]
  - id: q02
    type: evidence
    prompt: 哪些表现说明小禾观察得比以前认真了？
    answer: 第一次她没有看清入口就画了四个圈；后来她用望远镜追着尾羽看，确认是同一只幼鸟绕回来，才记下一只。
    page_refs: [p05, p17]
  - id: q03
    type: cause-effect
    prompt: 施工团队为什么改变了修缮顺序？
    answer: 小禾的图标出了正在使用的入口，专家又确认了飞行路线，所以团队先修没有巢的西墙，把有巢的区域延后。
    page_refs: [p08, p09, p10]
  - id: q04
    type: character-motive
    prompt: 下雨时，梁岚为什么选择安装窄支撑？
    answer: 她想托住可能掉落的松砖，同时不打开巢腔，也不挡住亲鸟进入第四号洞。
    page_refs: [p12, p13, p14]
  - id: q05
    type: short-answer
    prompt: 哪三个迹象说明第四号洞附近可以继续修了？
    answer: 支撑撑过了后来的雨，小禾确认一只幼鸟已经飞出，保护人员也确认那一带的幼鸟都已离巢。
    page_refs: [p16, p17, p18]
  - id: q06
    type: main-idea
    prompt: 小禾明白了，认真记录能做什么，又不能做什么？
    answer: 记录能帮助人们保护真正的巢洞，却不能决定雨燕飞去哪里，也不能保证它们明年回来。
    page_refs: [p06, p18, p19, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 四月十八日，小禾望着老城楼上空。老沈的记录本记下了二十三个春天的归期，每年都不一样。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 墙边堆着脚手架。松动的灰浆曾掉在检票口旁，工人准备封闭墙缝。小禾却见过雨燕从那里消失。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 傍晚，十一只雨燕绕着屋顶疾飞。一只收起长翅，钻进东角的松砖下。第二天，小禾带来红铅笔。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 小禾和老沈站在地面观察。只有亲眼看见雨燕钻进洞里，她才标出入口。他们从不爬近巢洞。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 两只雨燕在钟洞前交叉，小禾却画了四个圈。她说不出是哪四个洞。老沈提醒她，猜测不能算目击。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 小禾擦掉多画的圈。十二个下午后，他们在七个洞口都多次看见雨燕进出。三个不能确定的浅点旁仍留着问号。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 成鸟带着小虫回来，小禾猜幼鸟孵化了。追踪地图显示，被追踪的北京雨燕会飞到非洲南部再返回。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 修缮会上，梁岚展示危险的裂缝。小禾铺开标着七个红圈的地图，老沈在旁边放下二十三年的记录。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 梁岚相信小禾，可红圈不能证明砖是否安全。鸟类保护人员和工程师来检查飞行路线与墙体。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 专家站在安全线后观察。结果改变了方案：先修没有巢的西墙，有巢的区域暂时不动工。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 脚手架围住城楼大半，东侧仍然敞开。雨燕贴着防护网飞来时，工人会放下电钻。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 六月连下三天雨，第四号洞下方落了新灰。裂缝变宽了。松砖可能扯开巢腔，也可能砸到人。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 拆砖会打开巢，不碰又可能让砖掉下。工程师提出放入窄支撑，既不碰巢腔，也不堵入口。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 支撑仍可能失败，东院也要关闭。梁岚选择这个办法，请陈老师立刻报批。每一种危险都要算进去。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 亲鸟叼着食团飞来，却被升降台挡回。它绕一圈再来。梁岚和工程师停手，等它钻进旧洞。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 支撑撑过下一场雨，入口也没有被挡住。小禾没有加红圈，只写下：“第四号洞仍在使用。”
    - id: p17
      illustration: p17
      paragraphs:
        - text: 七月，一只幼鸟冲出第四号洞。小禾以为还有一只，便追着尾羽看。原来是同一只绕了回来。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 保护人员确认幼鸟已经离开。工人修好东墙，保留已确认的入口，还补建安全巢腔。雨燕不一定选择它们。
    - id: p19
      illustration: p19
      paragraphs:
        - text: 九月，最后一群雨燕向西北散去。被追踪的北京雨燕常从这里开始迁徙，小禾却不知道它们今晚停在哪里。
    - id: p20
      illustration: p20
      paragraphs:
        - text: 雨燕明年会回来吗？老沈不知道。七道暗口没有被封住。他们在新页上写下今年最后一次目击。
