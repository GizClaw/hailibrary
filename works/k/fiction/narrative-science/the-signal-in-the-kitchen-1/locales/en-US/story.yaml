article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: In January 2015, Mara worked at the Parkes radio telescope in Australia. The huge white dish turned toward the sky.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Before lunch, a short curve jumped onto her screen. It looked like a radio pulse slowed during a trip through space.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Mara leaned close. The signal appeared in all thirteen receiver beams. Excited, she called the senior technician, Tom.
    - id: p04
      illustration: p04
      paragraphs:
        - text: “A distant point usually does not light every beam,” Tom said. “Strong nearby interference can.”
    - id: p05
      illustration: p05
      paragraphs:
        - text: Mara still wanted to keep the sky idea. She saved the data, antenna direction, and equipment records.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Three days later, the curve returned. Another monitor caught strong activity at a higher frequency at the same time.
    - id: p07
      illustration: p07
      paragraphs:
        - text: A third signal also came by day. Mara checked clocks and cables, but she could not make it return.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Ruth, the operations lead, asked, “What result would prove your next guess wrong?” Mara had no answer yet.
    - id: p09
      illustration: p09
      paragraphs:
        - text: She sorted old events by time. Most strange signals came on workdays, with many close to noon.
    - id: p10
      illustration: p10
      paragraphs:
        - text: The universe did not follow lunch hours. Machines at the observatory often started when people arrived.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Mara predicted that human equipment would make more high-frequency activity by day and less at night.
    - id: p12
      illustration: p12
      paragraphs:
        - text: The monitor supported her prediction. Many daytime spikes appeared, but only a few matched the strange curve.
    - id: p13
      illustration: p13
      paragraphs:
        - text: A common machine needed one more special condition. Tom circled the staff kitchen on the site map.
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Mara wrote a new candidate: microwave oven. She stopped looking only upward and began listening nearby."
