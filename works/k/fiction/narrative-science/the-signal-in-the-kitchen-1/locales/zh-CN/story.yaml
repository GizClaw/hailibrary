schema_version: 3
language: zh-CN
writer: 雨歌
title: 十三路都亮了
summary: 林遥发现一串像星光的信号。十三路波束和午餐时间的线索，使她改变了寻找方向。
chapters:
  - id: ch01
    title: 最初的猜测
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 改变方向
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 林遥先发现了什么？
    answer: 十三路波束同时出现短促扫频。
    page_refs:
      - p02
      - p03
  - id: q02
    type: cause-effect
    prompt: 为什么汤姆怀疑附近干扰？
    answer: 因为远处点源通常不会同时照亮全部波束。
    page_refs:
      - p03
      - p04
  - id: q03
    type: character-motive
    prompt: 露丝为什么要求能失败的预测？
    answer: 她想让测试有边界，不浪费观测时间。
    page_refs:
      - p08
  - id: q04
    type: evidence
    prompt: 哪两条线索让团队看向厨房？
    answer: 信号多在正午附近出现，高频活动也在白天更多。
    page_refs:
      - p09
      - p11
      - p12
  - id: q05
    type: main-idea
    prompt: 林遥的计划怎样改变？
    answer: 她从只查天空和设备，改为先查午餐时常用的微波炉。
    page_refs:
      - p10
      - p13
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 2015年1月，林遥在澳大利亚帕克斯望远镜值班。巨大的白色碟面，正慢慢转向天空。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 午饭前，一道短促的弧线跳上屏幕。它很像穿过太空后变慢的无线电脉冲。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林遥靠近屏幕。十三路波束里都有信号。她兴奋地叫来老技师汤姆。
    - id: p04
      illustration: p04
      paragraphs:
        - text: “远处的点源通常不会照亮全部波束。”汤姆说，“附近的强干扰却可能做到。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 林遥仍想保留天空的解释。她保存数据，也写下天线方向和每台设备的状态。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 三天后，弧线再次出现。另一个监测器同时在更高的频段看见强烈活动。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 第三次信号仍在白天出现。林遥检查电缆和时钟，却无法让它马上重来。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 运行负责人露丝问：“你的下一次测试，怎样才算猜错？”林遥一时答不出来。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 她把旧记录按时间排好。多数怪信号出现在工作日，正午附近特别多。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 宇宙不按午餐时间活动。台站里的机器，却常在人来上班后才被打开。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 林遥预测：如果人类设备是源头，高频活动白天会多，夜里会少。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 监测记录支持这个预测。白天有许多高频尖峰，但只有少数伴随怪信号。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 这说明一台常用设备还需要特别条件。汤姆在台站地图上圈出厨房。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 林遥写下新的候选：微波炉。她划掉“只查天空”，决定先检查身边的声音。
