  - id: q02
    type: cause-effect
    prompt: 'Why did the plan change?'
    answer: 'She learns the hardware truck returns empty on Thursdays. The school has sound drums with fitted lids.'
    page_refs: [p06]
  - id: q03
    type: character-motive
    prompt: 'Why did the elder admit uncertainty?'
    answer: 'He wanted the plan to follow evidence.'
    page_refs: [p08]
