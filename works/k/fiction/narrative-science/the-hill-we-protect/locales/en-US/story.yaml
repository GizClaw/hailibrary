    prompt: 'What is the main idea?'
    answer: 'Careful evidence can guide practical protection.'
    page_refs: [p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'An oily smell stops Nora above the well. Leaking drums lie beside gravel cut by old rain.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'Mr. Rusk carries gray wash water from his shop. Mr. Vale asks him to keep it off the ground.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Mr. Rusk demands proof that this hill supplies the well. Mr. Vale refuses to pretend he has it.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Nora''s map shows possible paths, not certainty. Still, nobody wants to gamble with drinking water.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'Closing the wash area costs Mr. Rusk customers. Nora sees that protection also needs a workable plan.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'She learns the hardware truck returns empty on Thursdays. The school has sound drums with fitted lids.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'Adults seal and load the oily waste. Children stay uphill and collect only clean litter.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'The hydrologist''s first samples do not show oil in the well. One test cannot promise permanent safety.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Mr. Rusk decides the covered containers should stay. He offers to share the hauling cost.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'The village avoids drawing a magical boundary. It removes leaks and repairs the eroded clean slope.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'Local grass slows muddy runoff. The suspected recharge ground stays cleaner while measurements continue.'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Later evidence outlines a priority protection area crossing one corner of Mr. Rusk''s yard.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'He moves his wash bench to a roofed hard pad that can capture spills. Nora gathers loose bolts.'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'At the seep, Mr. Rusk admits he still doubts some dotted paths. Nora hands him a bottle to measure.'

