schema_version: 3
language: zh-CN
writer: 雨歌
title: '保护井水的山坡'
summary: '村民在证据尚未完整时，找到保护可能补给地的实际办法。'
chapters:
  - id: ch01
    title: '坡上的油味'
    page_refs: [p01, p02, p03, p04, p05, p06, p07]
  - id: ch02
    title: '能做成的办法'
    page_refs: [p08, p09, p10, p11, p12, p13, p14]
questions:
  - id: q01
    type: sequence
    prompt: '最先发现了什么线索？'
    answer: '井上方传来油味，阿满停住脚。旧雨沟旁倒着几只漏桶。'
    page_refs: [p01]
  - id: q02
    type: cause-effect
    prompt: '为什么计划发生变化？'
    answer: '他发现五金车每周四空车回村，学校又有带严实盖子的好桶。'
    page_refs: [p06]
  - id: q03
    type: character-motive
    prompt: '长辈为什么承认还不确定？'
    answer: '他希望计划服从证据。'
    page_refs: [p08]
  - id: q04
    type: evidence
    prompt: '哪两处细节支持了新的想法？'
    answer: '暂停清洗让周叔丢了顾客。阿满看见，保护水源也要有能做成的办法。 本地草让浑水慢下来。大家继续测量，也让可能的补给地保持干净。'
    page_refs: [p05]
  - id: q05
    type: main-idea
    prompt: '故事的中心意思是什么？'
    answer: '细心观察的证据能帮助大家采取实际行动。'
    page_refs: [p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '井上方传来油味，阿满停住脚。旧雨沟旁倒着几只漏桶。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '周叔从修理棚端出灰水。石伯请他别倒在地上。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '周叔要证据，证明这座坡给老井供水。石伯不肯装作已经知道。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '阿满的图只画可能的水路。即便如此，谁也不愿拿饮水冒险。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '暂停清洗让周叔丢了顾客。阿满看见，保护水源也要有能做成的办法。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '他发现五金车每周四空车回村，学校又有带严实盖子的好桶。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '大人封桶装车。孩子留在上坡，只收拾没有油污的垃圾。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '技术员首次取样没发现井里有油。一次检测也不能保证永远安全。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '周叔决定留下有盖的桶，还提出分担运送费用。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '村里没有乱画一条神奇边界。他们先清走漏桶，修好干净坡地的冲沟。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '本地草让浑水慢下来。大家继续测量，也让可能的补给地保持干净。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '后来，多次资料圈出优先保护地，其中穿过周叔院后的一角。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '他把清洗台搬上有顶的硬地，那里能接住泄漏。阿满收好散落的螺帽。'
        - text: '周叔重新检查。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '渗水边，周叔说仍不信所有虚线。阿满递去瓶子，请他一起测量。'
        - text: '他们蹲在湿沙旁，看清水从石粒间慢慢聚进瓶口。随后，他们把时间和地点记进本子。'
