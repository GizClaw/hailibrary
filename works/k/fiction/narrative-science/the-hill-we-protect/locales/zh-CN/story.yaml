schema_version: 3
language: zh-CN
writer: 雨歌
title: '保护井水的山坡'
summary: '村民在证据尚未完整时，找到保护可能补给地的实际办法。'
chapters:
  - id: ch01
    title: '坡上的油味'
    page_refs: [p01, p02, p03, p04, p05, p06, p07]
  - id: ch02
    title: '能做成的办法'
    page_refs: [p08, p09, p10, p11, p12, p13, p14]
questions:
  - id: q01
    type: sequence
    prompt: '阿满发现漏桶以后，石伯请周叔怎么处理灰水？'
    answer: '石伯请周叔别把灰水倒在地上。'
    page_refs: [p01, p02]
  - id: q02
    type: cause-effect
    prompt: '阿满为什么不用简单停工，而改用有盖的桶和返程货车？'
    answer: '暂停清洗让周叔丢了顾客，所以保护水源也需要能做成的办法。'
    page_refs: [p05, p06]
  - id: q03
    type: character-motive
    prompt: '周叔为什么愿意分担运送费用？'
    answer: '他决定把有盖的桶长期留下。'
    page_refs: [p09]
  - id: q04
    type: evidence
    prompt: '哪些证据说明首次检测没发现油以后，村里仍该保护山坡？'
    answer: '阿满的图只画出可能的水路，而且一次检测不能保证以后永远安全。'
    page_refs: [p04, p08]
  - id: q05
    type: main-idea
    prompt: '村里保护山坡这件事的中心意思是什么？'
    answer: '大家可以一边继续收集证据，一边用实际办法减少风险。'
    page_refs: [p01, p06, p12, p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '井上方传来油味，阿满停住脚。旧雨沟旁倒着几只漏桶。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '周叔从修理棚端出灰水。石伯请他别倒在地上。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '周叔要证据，证明这座坡给老井供水。石伯不肯装作已经知道。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '阿满的图只画可能的水路。即便如此，谁也不愿拿饮水冒险。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '暂停清洗让周叔丢了顾客。阿满看见，保护水源也要有能做成的办法。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '他发现五金车每周四空车回村，学校又有带严实盖子的好桶。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '大人封桶装车。孩子留在上坡，只收拾没有油污的垃圾。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '技术员首次取样没发现井里有油。一次检测也不能保证永远安全。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '周叔决定留下有盖的桶，还提出分担运送费用。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '村里没有凭猜想乱画一条神奇边界。他们先清走漏桶，再认真修好干净坡地上被雨冲出的沟。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '种下的本地草让浑水慢下来。大家继续耐心测量，也让可能的补给地一直保持干净。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '后来，大家继续多次收集资料。资料圈出一片优先保护地，其中穿过周叔院子后面的一角。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '他把清洗台搬上有顶的硬地，那里能接住泄漏。阿满收好散落的螺帽。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '回到渗水边，周叔说自己仍不相信图上的所有虚线。阿满递去瓶子，请他一起继续测量。'
