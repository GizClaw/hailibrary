article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Several microwave ovens stood near Parkes. While heating food, they produced energy near 2.45 gigahertz.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Mara and Tom put a mug of water in one oven. They let its timer finish. No strange signal appeared.
    - id: p03
      illustration: p03
      paragraphs:
        - text: They changed power and machines. The high-frequency monitor brightened, but the thirteen beams stayed quiet.
    - id: p04
      illustration: p04
      paragraphs:
        - text: One signal appeared while two ovens were in use. Mara labeled the result “unclear” instead of claiming success.
    - id: p05
      illustration: p05
      paragraphs:
        - text: A second planned test also failed. Ruth prepared to end it and return observing time to another team.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Mara asked for one last chance. She would not repeat old steps. She would study ordinary kitchen use.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Tom turned the cold mug. “People do not always wait. Sometimes they pull the door open early.”
    - id: p08
      illustration: p08
      paragraphs:
        - text: Mara predicted that an early opening and a favorable telescope angle were both needed while the magnetron worked.
    - id: p09
      illustration: p09
      paragraphs:
        - text: On March 17, Tom placed water in the old kitchen microwave. Mara watched from the control room.
    - id: p10
      illustration: p10
      paragraphs:
        - text: After several seconds, Tom opened the door early. At that exact moment, all thirteen beams lit.
    - id: p11
      illustration: p11
      paragraphs:
        - text: They changed the delay and tried twice more. Each opening matched a curve and high-frequency activity.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Then they changed the telescope direction. When the dish blocked the kitchen, the same action made no peryton.
    - id: p13
      illustration: p13
      paragraphs:
        - text: "The evidence formed a chain: working magnetron, early-opened door, escaping energy, and favorable receiver position."
    - id: p14
      illustration: p14
      paragraphs:
        - text: Mara admitted she had favored the sky idea. That evening, she waited for the lunch timer to reach zero.
