schema_version: 3
language: zh-CN
writer: 雨歌
title: 门打开的时候
summary: 微波炉似乎是嫌疑人，但重复试验失败了。林遥找到被忽略的动作，终于重现信号。
chapters:
  - id: ch01
    title: 最初的猜测
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 改变方向
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 团队在提前开门之前，先怎样测试微波炉？
    answer: 他们放入一杯水，让计时自然结束，还更换功率和机器。
    page_refs:
      - p02
      - p03
  - id: q02
    type: cause-effect
    prompt: 为什么林遥不能把偶然出现的信号算作成功？
    answer: 因为当时两台微波炉都在使用，无法判断是哪一个动作造成信号。
    page_refs:
      - p04
  - id: q03
    type: character-motive
    prompt: 林遥为什么还要争取最后一次测试？
    answer: 她想寻找日常使用与原来测试之间不同的动作，而不是重复失败步骤。
    page_refs:
      - p05
      - p06
  - id: q04
    type: evidence
    prompt: 哪些结果证明提前开门是关键条件之一？
    answer: 每次提前开门，弧线与高频活动都同时出现；碟面挡住厨房后，同样动作不再产生信号。
    page_refs:
      - p10
      - p11
      - p12
  - id: q05
    type: main-idea
    prompt: 团队怎样把失败测试变成一条完整证据链？
    answer: 他们从正常运行没有信号出发，找到提前开门这个动作，再用望远镜方向检验接收条件。
    page_refs:
      - p02
      - p03
      - p10
      - p12
      - p13
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 帕克斯台站附近有几台微波炉。它们加热食物时，会在约2.45吉赫兹附近产生能量。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 林遥和汤姆把一杯水放进微波炉。他们让计时器自然结束，屏幕上没有怪信号。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 他们换功率、换机器，又试了许多次。高频监测器变亮，十三路波束却很安静。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 一个信号突然出现，可当时两台微波炉都在使用。林遥把结果写成“无法判断”。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 第二次正式测试仍然失败。露丝准备结束实验，把观测时间还给下一组人。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 林遥请求最后一次机会。她不想重复旧步骤，而要寻找日常使用中的不同动作。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 汤姆转着冷水杯说：“有人不会等计时结束。他们会提前拉开门。”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 林遥提出预测：磁控管工作时开门，信号才可能出现。天线角度也必须合适。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 3月17日，汤姆把水杯放进厨房的旧微波炉。林遥守在控制室里。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 机器工作几秒后，汤姆提前开门。十三路波束在同一时刻全部亮了。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 他们改变等待时间，又做两次。每次开门时，弧线都和高频活动一起出现。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 他们再改变望远镜方向。碟面挡住厨房时，同样开门却没有收到怪信号。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 证据连成一条链：机器正在工作、门被提前打开、接收位置也正合适。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 林遥承认自己最初偏爱天空的解释。晚上，她让午饭计时归零，才打开微波炉门。
