language: en-US
writer: rain-song
title: 'Reading the Hidden Water'
summary: 'A child follows clues to learn how groundwater reaches a village well.'
chapters:
  - id: ch01
    title: 'The Low Well'
    page_refs: [p01, p02, p03, p04, p05, p06, p07]
  - id: ch02
    title: 'Patient Evidence'
    page_refs: [p08, p09, p10, p11, p12, p13, p14]
questions:
  - id: q01
    type: sequence
    prompt: 'Which clue came first?'
    answer: 'Nora hears the bucket strike the old well''s bottom. The village water level has fallen again.'
    page_refs: [p01]
  - id: q02
    type: cause-effect
    prompt: 'Why did the plan change?'
    answer: 'Mr. Vale explains that an aquifer stores and carries water through connected pores or cracks.'
    page_refs: [p06]
  - id: q03
    type: character-motive
    prompt: 'Why did the elder admit uncertainty?'
    answer: 'He wanted the plan to follow evidence.'
    page_refs: [p08]
  - id: q04
    type: evidence
    prompt: 'What two details support the new idea?'
    answer: 'Nora pours equal cups into gravel, sand, and clay. The water moves at three different speeds. A hydrologist measures the seep and well. One sensible idea still needs repeated evidence.'
    page_refs: [p05]
  - id: q05
    type: main-idea
    prompt: 'What is the main idea?'
    answer: 'Careful evidence can guide practical protection.'
    page_refs: [p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'Nora hears the bucket strike the old well''s bottom. The village water level has fallen again.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'At home, her mother measures every cup. Fewer jars of beans will reach the market.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Mr. Vale shows Nora a week of deeper readings. A well is an opening into groundwater, not a buried tank.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'They follow the dry creek uphill. Beneath a fallen log, clear water gathers in wet sand.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'Nora pours equal cups into gravel, sand, and clay. The water moves at three different speeds.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'Mr. Vale explains that an aquifer stores and carries water through connected pores or cracks.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'A road cut shows gravel above a hard clay band. Nora thinks the clay may turn water sideways.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'She draws a bold arrow from the hill to the well. Mr. Vale changes it to dotted possible paths.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Some rain runs away, some feeds plants, and some seeps downward. Not all recharge reaches their well.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'Mr. Vale admits that he cannot map every hidden crack. Nora sketches what they can actually see.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'A hydrologist measures the seep and well. One sensible idea still needs repeated evidence.'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Rain finally drums on the roofs. Grass-lined dips slow muddy water on the bare slope.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'The well reading barely changes that night. Groundwater does not follow the village clock.'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'Eleven days later, the level rises a little. Nora records it without claiming which rain arrived.'
        - text: 'She leaves room for later measurements.'
