schema_version: 3
language: zh-CN
writer: 雨歌
title: '读懂看不见的水'
summary: '孩子跟随线索，寻找地下水到达老井的路径。'
chapters:
  - id: ch01
    title: '井水低了'
    page_refs: [p01, p02, p03, p04, p05, p06, p07]
  - id: ch02
    title: '慢慢来的证据'
    page_refs: [p08, p09, p10, p11, p12, p13, p14]
questions:
  - id: q01
    type: sequence
    prompt: '在比较砂砾、细沙和黏土以前，阿满在倒木下发现了什么？'
    answer: '他发现清水从湿沙中慢慢聚起。'
    page_refs: [p04, p05]
  - id: q02
    type: cause-effect
    prompt: '阿满为什么把直通老井的粗箭头改成表示可能的虚线？'
    answer: '石伯看不清每道地下岩缝，所以水的准确路线还不能确定。'
    page_refs: [p08, p10]
  - id: q03
    type: character-motive
    prompt: '石伯为什么承认自己看不清每道岩缝？'
    answer: '他希望阿满只画下真正观察到的东西。'
    page_refs: [p10]
  - id: q04
    type: evidence
    prompt: '哪两处观察支持了“黏土可能让水转向”这个想法？'
    answer: '水通过砂砾、细沙和黏土的速度不同，路边剖面还显示砂砾下面有一层硬黏土。'
    page_refs: [p05, p07]
  - id: q05
    type: main-idea
    prompt: '阿满在画地下水路线时明白了什么？'
    answer: '细心观察的证据能帮助大家采取实际行动。'
    page_refs: [p03, p08, p11, p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '井桶撞上老井底，阿满听见一声闷响。村里的水位又降了。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '母亲在家一杯杯量水。这个集市能卖的豆腐又少了。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '石伯给阿满看一周的刻度。井是通向地下水的口，不是埋在地下的水缸。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '他们沿干河床上行。倒木下面，清水从湿沙中慢慢聚起。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '阿满把同样多的水倒进砂砾、细沙和黏土。水流得快慢不同。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '石伯说，含水层能在相连的孔隙或岩缝里储水、送水。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '路边剖面露出砂砾和下面的硬黏土。阿满猜水会沿黏土上方转向。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '他画粗箭头直通老井。石伯把它改成几条表示可能的虚线。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '雨水有的流走，有的被植物利用，有的向下渗。补给水不一定都到这口井。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '石伯承认自己看不清每道岩缝。阿满只把真正观察到的东西画下来。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '技术员测量渗水和井位。一个合理想法仍要靠多次证据检验。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '雨终于敲响屋瓦。草沟让裸坡上的浑水慢下来。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '雨夜里，阿满量过井水，发现水位仍旧几乎没有变化。地下水不会照着村里人的钟表赶路。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '十一天后，井里的水位终于抬高一点。阿满如实记下这个读数，却不急着认定到达井里的就是哪一场雨。'
        - text: '他还在本子上留出空白，耐心等待后面的测量。'
