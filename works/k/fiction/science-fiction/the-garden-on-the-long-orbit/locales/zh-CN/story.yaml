schema_version: 1
language: zh-CN
writer: 北辰
title: 远航中的太空花园
summary: 漫长航程中，太空花园越来越热。袁和同伴不能只保住眼前的菜，还得为整支船队留下一条能改、能退的路。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 开阔而克制, timbre: 清晰的成年声音, pace: 中慢速, pitch: 中音}}
  yuan: {display_name: 袁, tts: {delivery: 耐心而有系统观, timbre: 稳定的成年声音, pace: 中速, pitch: 中音}}
  aro: {display_name: 阿洛, tts: {delivery: 精确谨慎, timbre: 坚实的成年声音, pace: 中慢速, pitch: 中低音}}
  ivo: {display_name: 伊沃, tts: {delivery: 外交而坚定, timbre: 温厚的年长声音, pace: 中速, pitch: 中低音}}
  seed: {display_name: 种子, tts: {delivery: 中性并明确表达不确定性, timbre: 平滑的合成声音, pace: 匀速, pitch: 中音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 船队绕上蓝行星的长轨道时，离下一座补给站还远。前面，是一轮又一轮的日照和阴影。}]}
  - {id: p02, illustration: p02, lines: [{speaker: yuan, text: 这可不是摆着好看的。一路上的鲜菜靠它，到了新家，头一批秧苗也得从这里带下去。}]}
  - {id: p03, illustration: p03, lines: [{speaker: aro, content: [{text: 灯一亮、机器一转、人一活动，热就积起来。太空里没有风，最后还得靠}, {vocabulary: {id: radiator, text: 热辐射器}}, {text: 把热送出去。}]}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 伊沃的货舱靠上来以后，一部分热辐射器正对的不再是空荡荡的深空。}]}
  - {id: p05, illustration: p05, lines: [{speaker: seed, text: 当前温度仍在限制内，但余量连续缩小。模型置信度：中等。}]}
  - {id: p06, illustration: p06, lines: [{speaker: yuan, text: 叶边卷起来了。也许是热，也许是水和灯光变了。先别让一片叶子替我们下结论。}]}
  - {id: p07, illustration: p07, lines: [{speaker: aro, text: 好几个探头一起升温；货舱一接上，曲线也拐了。关系很明显，但原因还没坐实。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 阿洛把模型拆成三段：热从哪儿来，怎么走，最后从哪里出去。只说“变热了”，还远远不够。}]}
  - {id: p09, illustration: p09, lines: [{speaker: ivo, text: 把货舱解开，热辐射器能重新朝向深空。可药品、维修件和水循环设备，要用的时候怎么办？}]}
  - {id: p10, illustration: p10, lines: [{speaker: yuan, text: 别急着把它说成“保菜还是保货”。不管动哪一头，后面都跟着一串麻烦。}]}
  - {id: p11, illustration: p11, lines: [{speaker: aro, text: 船不转，菜照常见光，可散热余量还会往下掉。}]}
  - {id: p12, illustration: p12, lines: [{speaker: yuan, text: 一口气转过去，散热是好办了，菜的明暗节奏和太阳能输入又全乱了。}]}
  - {id: p13, illustration: p13, lines: [{speaker: seed, text: 预测范围正在变宽，因为我们没有这套靠泊构型的长期数据。}]}
  - {id: p14, illustration: p14, lines: [{speaker: yuan, text: 那就从能改回来的小事试起。先关掉不急用的灯，再让几排作物灯轮着亮。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: 走廊暗了些，该亮的安全灯还亮着。耗能大的工作，也不再挤在同一时段。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 花园没有一下全暗。灯光分区轮换，旁边总留着一块作比较。}]}
  - {id: p17, illustration: p17, lines: [{speaker: aro, text: 热负荷一降，余量就不再往下掉。模型对了一步，可朝向这件事还没解决。}]}
  - {id: p18, illustration: p18, lines: [{speaker: yuan, text: 菜暂时稳住了。记住，只是多了一条证据，不是一张永远有效的保票。}]}
  - {id: p19, illustration: p19, lines: [{speaker: ivo, text: 货舱接着靠在这里有好处。可要紧的东西全堆在一处，整支船队就只剩这一个命门。}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: 三个人把余下航程一段段拆开。灯怎么亮、船朝哪边、什么时候取货，不必在每一段航程里都同时追求最大值。}]}
  - {id: p21, illustration: p21, lines: [{speaker: aro, text: 每一段只转一点，让热辐射器多朝向些深空。下一步转不转，交给新数据。}]}
  - {id: p22, illustration: p22, lines: [{speaker: yuan, text: 花园分成几区，错开见光。长得会慢一点，可不能让所有幼苗一起赌同一种条件。}]}
  - {id: p23, illustration: p23, lines: [{speaker: aro, text: 新遮光板只挡不该来的热。它既不能顶替热辐射器，也绝不能把热辐射器遮住。}]}
  - {id: p24, illustration: p24, lines: [{speaker: narrator, text: 第一茬菜的产量比计划少，却长得结实。备用幼苗也拆成几批，不再挤在同一个篮子里。}]}
  - {id: p25, illustration: p25, lines: [{speaker: ivo, text: 要紧的物资分到三座舱里了。拿起来麻烦一点，总好过一处出故障，大家什么都拿不到。}]}
  - {id: p26, illustration: p26, lines: [{speaker: seed, text: 修订模型显示：峰值产量下降，热余量和供应冗余提高。长期结果仍含不确定性。}]}
  - {id: p27, illustration: p27, lines: [{speaker: narrator, text: 到达补给站时，船队带来的不只是一批新菜和沿途积下的热数据。更要紧的，是一套谁都可以追问、试验、再修正的办法。}]}
  - {id: p28, illustration: p28, lines: [{speaker: yuan, text: 走这么远，谁也不敢保证永远不出错。我们能做的，是在小错变成大祸以前，手里还有证据，系统还有余量，人也还有改方向的权利。}]}
chapters:
  - {id: ch01, title: 缩小的余量, page_refs: [p01, p02, p03, p04, p05, p06, p07]}
  - {id: ch02, title: 多条后果链, page_refs: [p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: 可撤回的试验, page_refs: [p15, p16, p17, p18, p19, p20, p21]}
  - {id: ch04, title: 不只追求峰值, page_refs: [p22, p23, p24, p25, p26, p27, p28]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: 哪些证据让团队怀疑散热问题，而不是只把卷叶当作结论？, answer: 多处温度传感器同时变化、趋势在货舱靠泊后改变，且降低热负荷后余量停止缩小。, page_refs: [p04, p05, p06, p07, p17]}
  - {id: q02, type: compare, speaker: narrator, prompt: 保持原朝向与大幅转向各有什么代价？, answer: 保持朝向维护作物光照却压缩散热余量；大幅转向改善散热却扰动作物光周期和能源输入。, page_refs: [p11, p12]}
  - {id: q03, type: evaluate, speaker: narrator, prompt: 为什么袁主张先做小规模可撤回试验？, answer: 因为长期数据不足，小试验能在风险较低时检验模型，并保留恢复原状或调整方案的可能。, page_refs: [p13, p14, p15, p16, p18]}
  - {id: q04, type: synthesis, speaker: narrator, prompt: 试验结果支持了什么，又没有证明什么？, answer: 它支持热负荷影响散热余量的模型，但没有证明当前朝向或灯光安排能永久安全运行。, page_refs: [p17, p18]}
  - {id: q05, type: compare, speaker: narrator, prompt: 初始计划和分阶段计划，对“什么都做到最多”这件事有何不同？, answer: 初始计划想同时维持光照、取用货物和固定朝向；分阶段计划允许各项目标轮流让步，为系统保留余量。, page_refs: [p09, p10, p20, p21, p22]}
  - {id: q06, type: evaluate, speaker: narrator, prompt: 收成减少为什么不一定代表任务失败？, answer: 较小但健康的收成，换来了更充足的热余量、分批保存的幼苗和分散存放的物资，让船队更有能力长期生存并从故障中恢复。, page_refs: [p22, p24, p25, p26]}
  - {id: q07, type: research-connection, speaker: narrator, prompt: NASA 资料中的哪些原则支撑故事模型？, answer: 航天器需要管理内部热负荷，并通过热辐射器、隔热、遮光、传感器和运行调整维持温度范围；故事把这些原则用于虚构船队。, page_refs: [p03, p08, p17, p21, p23]}
  - {id: q08, type: synthesis, speaker: narrator, prompt: 花园问题如何暴露了货运系统的第二个脆弱点？, answer: 为散热而讨论货舱时，团队发现关键物资集中在一个节点，任何单点故障都可能切断供应。, page_refs: [p09, p19, p25]}
  - {id: q09, type: open-response, speaker: narrator, prompt: 如果后续数据让预测范围再次扩大，团队应依据哪些原则行动？, answer: 明确模型的限度，保护运行余量，优先做可以撤回的试验，让受影响的人共同权衡后果，并根据新证据修订计划。, page_refs: [p05, p10, p13, p14, p18, p20, p26, p28]}
