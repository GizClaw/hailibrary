schema_version: 2
language: zh-CN
writer: 雨歌
title: 雾中的灯车
summary: 皮帕用灯车去帮助困在雾中的朋友，积水却让旧地图上的近路变得危险。她和罗安先停下机器，征得妮玛同意后再穿过私人果园，并亲手选择安全的干路。这次救援也改变了灯车的设计。
chapters:
  - id: ch01
    title: 过期的地图
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
  - id: ch02
    title: 得到许可的路
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
      - p16
  - id: ch03
    title: 救援后的改造
    page_refs:
      - p17
      - p18
      - p19
      - p20
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 车轮陷进泥边后，皮帕改变了哪些做法？
    answer: 她先请求穿过果园，再改用手动模式，和大家一起比较干路。
    page_refs:
      - p08
      - p09
      - p10
      - p14
      - p15
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 灯车指向的近路为什么不安全？
    answer: 地图画好后下了雨，流动的积水淹过低处的踏脚石。
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 妮玛为什么在树枝前叫停皮帕？
    answer: 继续开车可能伤到湿土和幼苗，也会走出她允许的范围。
    page_refs:
      - p10
      - p11
      - p12
      - p13
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 哪些线索支持选择陶拱下的路？
    answer: 那里地势高而干燥，形状符合路线模型，还能避开洪水和苗床。
    page_refs:
      - p05
      - p10
      - p13
      - p14
      - p15
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 皮帕对好机器有了什么新认识？
    answer: 机器可以提供信息，但人还要暂停、检查眼前情况、尊重许可并共同选择。
    page_refs:
      - p05
      - p07
      - p10
      - p13
      - p14
      - p20
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: 救援怎样改变了灯车？
    answer: 皮帕增加暂停杆和路线标记，用来比较道路并记录许可。
    page_refs:
      - p19
      - p20
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "雨停了，浓雾却遮住港口的山路。 "
            - text: 远处传来瞭望塔的铃声。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 皮帕竖起耳朵：“那是布兰的铃声。”罗安望着昏暗的塔灯：“他可能需要帮助。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 皮帕推出自己做的四轮灯车。 皮帕说：“
            - text: 我把最近路线存进地图了。”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "灯车驶向低处的芦苇路。 "
            - text: 皮帕跟在后面，罗安留意湿地。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 罗安指着漫过踏脚石的流水：“地图画好以后又下了雨，上面没有这片积水。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 灯车仍把光束指向最短的路。 皮帕说：“
            - text: 地图说这边最快。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: “旧路线图上没有今天的积水。”罗安拦住皮帕，没让她踩进水里。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "一个车轮陷进泥边。 "
            - text: 大家留在干地上，把灯车拉回来。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 高路从妮玛的果园门口开始。 皮帕说：“
            - text: 我们能穿过果园去帮助布兰吗？”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 妮玛打开门：“我
            - vocabulary:
                id: consent
                text: 同意
            - text: 你们走这条干路。跟着我，别让车碰到苗床。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "倒下的树枝挡住了果园小路。 "
            - text: 雾里的塔灯还是很暗。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "皮帕伸手去推驱动杆。 "
            - text: 车轮顶着树枝，怎么也推不动。
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 妮玛抬起一只前爪：“停。我只同意走干路，没同意压过苗床。湿土也撑不住车。”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "皮帕把灯车换成手动模式。 "
            - text: 三个朋友在干地上比较路线模型。
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 罗安说：“
            - text: "废弃的陶拱下有一条干燥高路。” "
            - text: 皮帕拿起模型，弧形正好和陶拱相同。
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "妮玛带大家穿过侧门。 "
            - text: 罗安照看队伍，皮帕推着调暗的灯车。
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "接近瞭望塔时，雾变薄了。 "
            - text: 布兰在有屋顶的门口摇响铜铃。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 布兰说：“低路被淹以后，我一直留在塔里。”皮帕挨近他：“幸好你在里面等。”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "四只狗沿着干燥的高路一起返回。 "
            - text: 这一次，灯车走在大家中间，不再带头。
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: "回到工坊，皮帕装上醒目的暂停杆。 "
            - text: 她还增加路线标记，让大家比较选择并记录许可。
