schema_version: 2
language: en-US
writer: rain-song
title: The Lantern Cart in the Fog
summary: Pippa sends her lantern cart toward a friend stranded in fog, but floodwater makes its stored route unsafe. With Roan and Nima, she pauses the machine, asks before crossing private ground, and chooses a dry route by hand. The rescue changes how she designs the cart.
chapters:
  - id: ch01
    title: The Old Map
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
  - id: ch02
    title: A Path with Permission
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
      - p16
  - id: ch03
    title: Rescue and Redesign
    page_refs:
      - p17
      - p18
      - p19
      - p20
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What changes after the cart wheel sinks?
    answer: Pippa asks to use Nima's orchard, switches to manual mode, and helps compare dry routes.
    page_refs:
      - p08
      - p09
      - p10
      - p14
      - p15
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why is the cart's shortest route unsafe?
    answer: Rain sent moving water across the low stepping stones after the stored map was made.
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Nima stop Pippa at the fallen branch?
    answer: Driving forward could damage wet soil and young plants beyond the path Nima allowed.
    page_refs:
      - p10
      - p11
      - p12
      - p13
  - id: q04
    type: evidence
    speaker: narrator
    prompt: Which clues support choosing the pottery-arch passage?
    answer: It is on upper dry ground, matches the route models, avoids the flooded stones, and keeps the cart away from seed beds.
    page_refs:
      - p05
      - p10
      - p13
      - p14
      - p15
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What does Pippa learn about useful machines?
    answer: A machine can offer information, but people must pause, check current conditions, respect permission, and choose together.
    page_refs:
      - p05
      - p07
      - p10
      - p13
      - p14
      - p20
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: How does the rescue change the lantern cart?
    answer: Pippa adds a pause lever and route-choice tokens for comparing paths and recording permission.
    page_refs:
      - p19
      - p20
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "Rain ends over the harbor, but thick fog hides the hill road. "
            - text: A watchtower bell sounds far away.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Pippa lifts her ears. “That is Bramble’s bell.” Roan watches the faint tower light. “Bramble may need help.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Pippa rolls out her homemade lantern cart. Pippa says, “
            - text: I saved the shortest road in its map.”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "The cart starts toward the low reed road. "
            - text: Pippa follows, while Roan studies the wet ground.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Roan points to water moving across the stepping stones. “The rain came after your map. This flood is not on it.”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: The cart still shines its beam toward the shortest route. Pippa says, “
            - text: Its map says this way is fastest.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: “The old route does not show today’s flood,” Roan says. He stops Pippa before she reaches the water.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "One cart wheel sinks at the muddy edge. "
            - text: Pippa pulls the cart back while everyone stays on dry ground.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: The upper path begins at Nima's orchard gate. Pippa says, “
            - text: May we cross your orchard to reach Bramble?”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Nima opens the gate. “You have my "
            - vocabulary:
                id: consent
                text: consent
            - text: " to use this dry strip. Stay beside me, and keep the cart away from the seed beds.”"
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "Fallen branches block the orchard lane. "
            - text: The tower light is still dim beyond them.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "Pippa reaches for the drive lever. "
            - text: A wheel presses against a branch without moving it.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Nima raises one paw. “Stop. I allowed the dry strip, not the seed beds. The wet soil will not bear that cart.”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "Pippa switches the cart to manual mode. "
            - text: The three friends compare small route models on dry ground.
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: Roan says, “
            - text: "These old pottery arches make a dry upper passage.” "
            - text: Pippa matches the arches to one of their route models.
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "Nima leads through the side gate. "
            - text: Roan keeps the group together, and Pippa guides the dim cart.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "The fog thins near the watchtower. "
            - text: Bramble rings a brass bell from the sheltered doorway.
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: “I stayed inside when the low road flooded,” Bramble says. Pippa presses close to him. “I’m glad you waited here.”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "All four dogs return along the dry upper route. "
            - text: The lantern cart rolls between them instead of leading them.
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: "Back at the workshop, Pippa adds a large pause lever. "
            - text: She also adds route tokens so travelers can compare choices and record permission.
