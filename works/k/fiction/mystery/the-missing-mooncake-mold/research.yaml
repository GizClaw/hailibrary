schema_version: 1
required: true
sources:
  - url: https://www.beijing.gov.cn/fwcj/calendar/bwgzl/663b49d6ed718351470de71c.html
    title: 我们的文化遗产——中秋味道
    publisher: 北京市人民政府门户网站（来源：北京市文物局）
    supports: 月饼模是制作月饼的工具；流传下来的模子有不同材质、形状和丰富图案，木制月饼模确有实物传统。
  - url: https://www.roots.gov.sg/Collection-Landing/listing/1135663
    title: Mooncake mould
    publisher: National Heritage Board, Singapore; National Museum of Singapore collection
    supports: A documented wooden mould was used to make mooncakes, and mooncakes are commonly associated with the Mid-Autumn festival.
  - url: https://www.edb.gov.hk/attachment/en/curriculum-development/kla/eng-edu/Chi_Fest/Mid-AutumnFestival/PartB.html
    title: Mid-Autumn Festival Part B
    publisher: The Government of the Hong Kong Special Administrative Region
    supports: Eating mooncakes and gathering with family are documented Mid-Autumn customs; the story narrows this to one fictional neighborhood's shared batch.
  - url: https://lzhbwg.mofcom.gov.cn/edi_ecms_web_front/thb/detail/d7d04cc2803b4e00a59f765446d93624
    title: 莲香楼-老字号数字博物馆
    publisher: 中华人民共和国商务部老字号数字博物馆
    supports: 传统月饼制作会在模具中撒少量面粉，把包好馅的面团压紧压平，再把模具在白布上方轻轻一敲，扣出带清晰花纹的月饼；这支持故事中的压模、轻敲和脱模过程。
  - url: https://www.bjft.gov.cn/ftq/jxdt/202509/c70b13b8de2243c1bce1a47f22b689f5.shtml
    title: 新村街道同心共筑中国梦 邻里欢聚怡海情——怡海花园社区乐庆双节
    publisher: 北京市丰台区人民政府网站（来源：新村街道办事处）
    supports: 社区居民在中秋活动中亲手制作并赠送月饼，活动增进邻里情谊；这支持把送月饼写成陈阿姨欢迎新邻居的温暖行动，而不是宣称全国各地都有同一种做法。
notes: The missing-object mystery, Auntie Chen's permitted loan, the windblown note, the flower carving, and the exact flour trail belong to this fictional Lantern Street event. In the story, the flour marks come specifically from Auntie Chen's floury hands after she has worked with dough; they do not come from the unused hanging mold or Grandpa Lu's own flour bag. The story does not claim that every family makes mooncakes or uses wooden molds.
