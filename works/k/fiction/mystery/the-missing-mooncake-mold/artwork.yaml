  - id: p01
    file: artwork/p01.webp
    scene: A few days before Mid-Autumn, red paper lanterns sway above Lantern Street as Grandpa Lu sets a plain flour bag on his repair-stall workbench and Mei waits beside him.
  - id: p02
    file: artwork/p02.webp
    scene: Mei reaches toward the empty brass peg beside Grandpa Lu's green toolbox where the flower-carved wooden mooncake mold usually hangs.
  - id: p03
    file: artwork/p03.webp
    scene: Mei searches beneath the bench and through the green toolbox pockets with impatient energy while Amara arrives and sets down her yellow backpack; Bean watches.
  - id: p04
    file: artwork/p04.webp
    scene: Mei and Amara closely inspect the straight brass peg and the smooth unscratched wood around it, recognizing that the mold was lifted carefully.
  - id: p05
    file: artwork/p05.webp
    scene: A pale curved flour mark rests on the workbench and small white flour spots cross the gray courtyard stones; the girls and Bean begin following the trail.
  - id: p06
    file: artwork/p06.webp
    scene: Under the camphor tree where the flour spots end, wind moves the red lanterns while Bean nudges his metal water bowl and reveals the blank folded back of a paper note beneath it.
  - id: p07
    file: artwork/p07.webp
    scene: Mei and Amara read a small unfolded note held with its blank back facing the viewer; Mei's alarm changes to surprise as Amara points toward Auntie Chen's kitchen.
  - id: p08
    file: artwork/p08.webp
    scene: Grandpa Lu cleans his round wire glasses and smiles after reading the note held with no writing visible, standing beside the empty peg and green toolbox.
  - id: p09
    file: artwork/p09.webp
    scene: The girls enter Auntie Chen's clean small courtyard kitchen, where the flower-carved wooden mold sits safely beside a row of round dough pieces on a flour-dusted table.
  - id: p10
