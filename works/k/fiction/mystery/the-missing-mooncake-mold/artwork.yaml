    scene: Auntie Chen gestures warmly toward the first tray of flower-pattern mooncakes intended for Amara's family while Amara looks touched and Mei smiles.
  - id: p12
    file: artwork/p12.webp
    scene: Mei laughs at her mistaken thief idea while Amara gives her a knowing smile; Auntie Chen stands by the mold and Bean waits beneath the table.
  - id: p13
    file: artwork/p13.webp
