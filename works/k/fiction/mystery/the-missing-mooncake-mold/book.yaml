schema_version: 1
id: the-missing-mooncake-mold
type:
  - reading
  - illustrated-short-story
style: watercolor-gouache
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - mystery
    - culture
    - food
    - everyday-life
  themes:
    - lost-and-found
    - cooperation
    - tradition
  moods:
    - mysterious
    - warm
    - playful
characters:
  - id: narrator
    kind: narrator
    description: An attentive guide who follows the children's changing ideas across Lantern Street.
    voice_identity: clear, measured adult storyteller
  - id: mei
    kind: character
    description: Mei / 梅梅, a Chinese girl about 7–9 who is quick to act when Grandpa Lu's old mooncake mold disappears.
    visual_identity: Chin-length black bob with one yellow hair clip, red-and-white striped T-shirt,
      denim overalls, white sneakers.
    voice_identity: quick, curious, a little impatient
  - id: grandpa-lu
    kind: character
    description: Grandpa Lu / 卢爷爷, a Chinese man about 70 who keeps the old wooden mold beside his repair tools.
    visual_identity: Short gray crew cut, round wire glasses, navy canvas apron with many pockets,
      gray shirt, brown trousers, brown shoes, green metal toolbox.
    voice_identity: slow, warm, dry humor
  - id: amara
    kind: character
    description: Amara / 阿玛拉, a Nigerian girl about 7–9 and Mei's friend, who asks questions before drawing conclusions.
    visual_identity: Dark brown skin, many small black braids with orange beads, green hoodie, yellow
      backpack, charcoal trousers, pale yellow sneakers.
    voice_identity: bright, direct, fond of questions
  - id: bean
    kind: character
    description: Bean / 豆豆, Mei's small family dog. Never speaks; any bark is described by the narrator.
    visual_identity: Small tan mixed-breed dog with one white left ear, tan right ear and red collar.
    voice_identity: none; never assign a spoken block
  - id: auntie-chen
    kind: character
    description: Auntie Chen / 陈阿姨, a Lantern Street neighbor who borrowed the mold with permission to make a welcome batch of mooncakes.
    visual_identity: Chinese woman about 50, wavy shoulder-length black hair, coral cardigan, cream
      blouse, dark green trousers, black cloth shoes.
    voice_identity: friendly adult voice with brisk, practical warmth
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Combine three clues before deciding what happened.
    - Explain how new evidence changes Mei's plan.
  concepts:
    - mold
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
