schema_version: 2
language: en-US
writer: rain-song
title: The Missing Mooncake Mold
summary: Grandpa Lu's old wooden mooncake mold is gone. Mei and Amara follow three clues across Lantern Street and learn that the mold was borrowed, not stolen.
chapters:
  - id: ch01
    title: The Empty Peg
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: Flour and a Note
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: The Flower Returns
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What do Mei and Amara examine before they follow the flour spots?
    answer: They examine the straight peg and the wood around it.
    page_refs:
      - p04
      - p05
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which three clues help the girls learn what happened to the mold?
    answer: The mold was lifted carefully, flour spots point toward Auntie Chen's kitchen, and a note with a blurred signature says the mold was borrowed.
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Auntie Chen borrow Grandpa Lu's flower mold?
    answer: She wants to give Amara's family flower-pattern mooncakes for their first Mid-Autumn on Lantern Street.
    page_refs:
      - p10
      - p11
  - id: q04
    type: cause-effect
    speaker: narrator
    prompt: How does the note change Mei's plan?
    answer: The note says the mold was borrowed, so Mei drops her plan to question every shop. Grandpa Lu then confirms Auntie Chen had permission.
    page_refs:
      - p03
      - p07
      - p08
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: What does the wooden mold do to the soft dough?
    answer: It gives the dough its shape and flower pattern.
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Mid-Autumn was only a few days away. Red lanterns moved above Lantern Street while Grandpa Lu set his flour bag on the workbench.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "Grandpa Lu planned to make mooncakes in the shared courtyard. “Please bring my old wooden mooncake "
            - vocabulary:
                id: mold
                text: mold
            - text: ". It has a flower carved in it,” he told Mei. The mold usually hung next to his green toolbox, but the peg was empty."
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Mei checked under the bench and in every section of the toolbox. “Someone took it!” she said. “I’ll ask every shop on the street.” Amara arrived and set down her backpack.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: In the months since they met, Amara had learned enough everyday Chinese to chat with Mei. She studied the peg. “It’s still straight, and the wood has no fresh scratches.” Mei saw that someone had lifted the mold with care. That was their first clue.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Mei heard her dog Bean snuffling. He sniffed a curved flour mark on the bench. White spots crossed the stones toward Auntie Chen’s kitchen. Grandpa Lu’s flour bag sat apart, with no spill nearby.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: The spots seemed to stop under the camphor tree. Water from Bean’s bowl had washed them off the stones. Wind tugged the lanterns. Bean nudged his bowl and revealed a damp note that the wind had blown beneath it.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Mei read: “Borrowed the flower mold. Back by sunset. Thanks, Grandpa Lu.” “Borrowed” changed her plan, but she still could not read the blurred name. “The flour leads there, so maybe she borrowed it,” Amara said, pointing toward the kitchen. They hurried back to Grandpa Lu."
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Grandpa Lu cleaned his glasses and read the note. Then he smiled. “Auntie Chen asked me yesterday, and I said yes. Looks like my memory needs fixing.”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Beyond the wet stones, Amara found the flour spots again. They led into Auntie Chen’s kitchen. The missing mold rested beside round pieces of dough.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Auntie Chen pressed soft dough into the carved mold. She turned it over and tapped it on a folded cloth. A round cake dropped out with a raised flower. The mold gave the dough its round shape and flower pattern.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: Mei showed Auntie Chen the damp note and said they found it by Bean’s bowl. Auntie Chen nodded, then showed Amara the first tray. “The wind carried it there. My floury hands left the spots. I made these mooncakes for your family’s first Mid-Autumn here.”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Mei held the damp note near Bean’s nose and laughed. “Next time your bowl hides a clue, give us one bark.” Amara grinned. Bean wagged his tail under the table.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Auntie Chen helped Grandpa Lu complete his batch. Afterward, the girls wrapped the clean mold in cloth. Mei hung it on the peg beside his toolbox.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: At sunset, Auntie Chen brought warm mooncakes to the courtyard. Their raised flowers matched the mold’s carving. Grandpa Lu picked one up. “Good. The mold is home, and the mooncakes are ready before the festival moon is full.”
