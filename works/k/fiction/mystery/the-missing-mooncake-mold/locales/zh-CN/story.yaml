schema_version: 2
language: zh-CN
writer: 雨歌
title: 月饼模子不见了
summary: 卢爷爷的老木模子突然不见了。梅梅和阿玛拉沿着灯笼街找到三条线索，终于知道模子是被借走的，不是被偷走的。
chapters:
  - id: ch01
    title: 钉子上的模子呢？
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 面粉白点和纸条
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: 花纹回来了
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 顺着面粉白点走以前，梅梅和阿玛拉先查看了什么？
    answer: 她们先看了笔直的钉子和周围没有新划痕的木板。
    page_refs:
      - p04
      - p05
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪三条线索让她们知道模子去了哪里？
    answer: 模子被人小心取下，面粉白点朝陈阿姨家的小厨房延伸，纸条说明模子是借走的，可最后的名字看不清。
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 陈阿姨为什么要借花模子？
    answer: 她想把花纹月饼送给阿玛拉一家，陪他们过搬来灯笼街后的第一个中秋。
    page_refs:
      - p10
      - p11
  - id: q04
    type: cause-effect
    speaker: narrator
    prompt: 纸条怎样改变了梅梅的打算？
    answer: 纸条说明模子是借走的，所以梅梅不打算一家家店去问了。卢爷爷随后确认，自己答应过陈阿姨。
    page_refs:
      - p03
      - p07
      - p08
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: 木模子对软面团有什么作用？
    answer: 它让面团变成固定的形状，还在上面压出花纹。
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 离中秋还有几天。灯笼街挂起一串串红灯笼，在风里轻轻摇。卢爷爷把面粉袋放到小摊的桌子上，准备在院子里做月饼。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 卢爷爷说：“梅梅，把那个刻着花朵的老木
            - vocabulary:
                id: mold
                text: 模子
            - text: 拿来。”月饼模子平时挂在绿色工具箱旁边，可今天，钉子上空空的。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 梅梅找遍桌子底下，又翻遍工具箱的小格，急得说：“一定有人拿走了！我要一家家店去问。”阿玛拉来到小摊前，放下书包。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 阿玛拉搬来几个月，已经能用中文和梅梅聊天了。她看着钉子说：“钉子还是直的，木板上也没有新划痕。”梅梅明白，有人小心取下了模子。这是第一条线索。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 梅梅听见吸鼻子的声音。原来是她家的小狗豆豆在桌边闻。桌上有一道弯弯的面粉印。白点越过石板，朝陈阿姨家的小厨房延伸。卢爷爷的面粉袋放在一旁，周围没有白点。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 树下的白点像是忽然断了。水碗洒出的水冲淡了石板上的白点。风扯动灯笼。豆豆一碰水碗，便露出碗底的湿纸条。风把它吹到碗边，纸角滑到了碗底下。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 梅梅念出纸条：“借花模子一用，日落前送回。谢谢您。”看到“借”字，她不再打算挨家问。纸条最后的名字被水弄花了，看不清。阿玛拉指着厨房：“白点通向那里，也许是陈阿姨借走了。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 她们跑回小摊，把纸条给卢爷爷看。卢爷爷擦擦眼镜，看完才想起来：“陈阿姨昨天问过我，我答应了。看来我的记性也该修修了。”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 走过那片湿石板，阿玛拉又找到面粉白点。白点直通陈阿姨的小厨房。木模子安稳地放在桌上，旁边是一排圆圆的面团。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 陈阿姨把软面团压进刻花的模子，再把模子倒扣在叠好的布上。她轻轻一敲，一个圆饼落了下来，顶上凸起一朵花。木模子让面团成了圆饼，还在上面压出花纹。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 梅梅递上湿纸条，说在水碗旁找到的。陈阿姨点点头，把月饼推过去：“是风吹过去的。白点是我手上的面粉留下的。这些月饼送给你们，陪你们过搬来灯笼街后的第一个中秋。”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 梅梅摸摸豆豆，笑着举起湿纸条：“下回水碗压住纸条，你要汪一声。”阿玛拉弯起眼睛。豆豆在桌下摇起尾巴。
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 陈阿姨先帮卢爷爷做完他本来要做的那批月饼。忙完后，女孩们用干净的布包好木模子，送回小摊。梅梅把模子挂回铜钉上。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 太阳快落山时，陈阿姨端来一盘温热的月饼。月饼上凸起的花纹和模子里的完全一样。卢爷爷拿起一个，慢慢说：“模子回来了，月饼也赶在中秋月圆前做好了。”
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚地讲述，留意人物的小动作
        timbre: 平滑柔和的成年中低音
        pace: 平稳适中
        pitch: 中低
    mei:
      display_name: 梅梅
      tts:
        delivery: 好奇，反应快，带一点急切
        timbre: 清亮纤细的童声，吐字利落
        pace: 稍快
        pitch: 高
    grandpa-lu:
      display_name: 卢爷爷
      tts:
        delivery: 温和，带一点不动声色的幽默
        timbre: 略有沙感的老年男声
        pace: 缓慢
        pitch: 低
    amara:
      display_name: 阿玛拉
      tts:
        delivery: 明快直接，问句带自然上扬
        timbre: 饱满圆润的童声
        pace: 活泼，问话时稍作停顿
        pitch: 中高
    bean:
      display_name: 豆豆
      tts:
        delivery: 不发言；叫声只由旁白描述
        timbre: 不合成角色声音
        pace: 无口语输出
        pitch: 无声
    auntie-chen:
      display_name: 陈阿姨
      tts:
        delivery: 亲切利落，带着邻里间的熟稔
        timbre: 清楚圆润的成年女中音
        pace: 明快但不催促
        pitch: 中
