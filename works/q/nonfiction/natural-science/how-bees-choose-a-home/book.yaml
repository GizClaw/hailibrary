characters:
  - id: narrator
    kind: narrator
    description: A warm field narrator who distinguishes what the children observe from what bee research has established.
    voice_identity: clear, attentive, quietly warm
  - id: lili
    kind: character
    description: An older child who wants an early answer but learns to wait until evidence from several places agrees.
    visual_identity: Chinese girl about 9-11, long black ponytail, olive field vest with pockets, orange-covered notebook, pencil behind one ear.
    voice_identity: careful, precise, secretly excited
  - id: yan
    kind: character
    description: Lili's younger cousin, whose quick guesses press the group to separate a lively clue from a completed decision.
    visual_identity: Chinese boy about 7-9, short spiky hair, blue raincoat, magnifying glass on a cord.
    voice_identity: loud, fast, full of guesses
  - id: grandma-ruan
    kind: character
    description: An experienced observer who keeps the children at a safe distance and asks what each piece of evidence can prove.
    visual_identity: Chinese woman about 68, short silver hair, wide straw hat, gray cardigan, binoculars.
    voice_identity: calm, asks questions instead of giving answers
  - id: beekeeper-wu
    kind: character
    description: A local beekeeper who establishes a safe viewing area and gives brief research-based explanations without claiming to know more than the evidence shows.
    visual_identity: Chinese woman about 42, round face, dark hair in a low bun, moss-green beekeeping jacket, pale canvas trousers, tan protective veil folded behind her shoulders, small brown field case.
    voice_identity: steady, practical, concise
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how independent scout bees advertise and compare possible nest sites.
    - Distinguish dance activity on the swarm from a quorum of scouts at a candidate site.
    - Combine observations from the cluster, the candidate cavity, and the final flight before drawing a conclusion.
  concepts:
    - honeybee swarming
    - scout recruitment by waggle dance
    - quorum decision making
    - field observation and uncertainty
    - bee safety
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
