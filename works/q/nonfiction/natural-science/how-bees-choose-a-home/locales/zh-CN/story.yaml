schema_version: 2
language: zh-CN
writer: 江笑
title: 蜜蜂怎样选新家
summary: 阮奶奶家的梨树上来了一群蜜蜂。林莉莉和阿岩站在安全处，记录侦察蜂的来去、摇摆舞的变化和老柳树洞口的访问量。他们发现，舞蹈只是招来更多考察者；一个地点聚集了法定人数，蜂群才开始搬家。
chapters:
  - id: ch01
    title: 梨树枝上的嗡嗡声
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 指向各处的舞
    page_refs: [p05, p06, p07, p08, p09, p10]
  - id: ch03
    title: 一个地点来了足够多的蜂
    page_refs: [p11, p12, p13, p14]
  - id: ch04
    title: 飞向老柳树
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据说明梨树枝只是蜂群临时停留的地方？
    answer: 蜜蜂只在露天抱成一团，没有筑巢；侦察蜂不断外出；后来整个蜂群离开梨树，飞进了柳树洞。
    page_refs: [p01, p03, p05, p15, p17]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 莉莉前后两次记录的舞蹈情况有什么不同？
    answer: 第一次有好几个方向的舞都很活跃；后来，指向河堤的舞越来越多，另一个方向的舞慢慢少了。
    page_refs: [p07, p08, p09]
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 莉莉为什么划掉“梨树上的新家”？
    answer: 她发现那只是根据眼前蜂团作出的猜想。侦察蜂还在寻找，她需要等不同地点的证据连起来。
    page_refs: [p04, p05]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 侦察蜂要在哪里达到法定人数？
    answer: 要在一个候选巢址达到法定人数，例如老柳树的树洞，而不是在梨树上的蜂团中。
    page_refs: [p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 许多侦察蜂怎样把不同地点的信息合成一个选择？
    answer: 它们各自考察地点，再用舞蹈招来别的侦察蜂复查。较强的支持继续增加，较弱的支持减少；一个地点达到法定人数后，蜂群准备起飞。
    page_refs: [p05, p06, p07, p08, p09, p10, p13, p14]
  - id: q06
    type: synthesis
    speaker: narrator
    prompt: 哪三类证据把指向河堤的舞和老柳树这个选择连了起来？
    answer: 指向河堤的舞增加了，柳树洞口的侦察蜂也增加了，最后蜂群朝那个方向飞去并进入树洞。
    page_refs: [p09, p12, p13, p16, p17]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 第十一页时，阿岩说“已经选好了”有足够证据吗？请用后面的事情判断。
    answer: 还没有。舞蹈活跃只说明支持在增加。后来，柳树洞口聚集了许多侦察蜂，蜂团开始准备起飞，整个蜂群又真的进入了那个树洞，证据才完整。
    page_refs: [p11, p13, p14, p17]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "清晨，阮奶奶屋后的老观测园忽然响起一阵低沉的嗡嗡声。林莉莉刚跨进园门，就拉住了跟在身后的阿岩。梨树上垂着一个不断起伏的褐色蜂团。那是离开原来蜂巢、围着蜂王暂时聚在一起的"
            - vocabulary: {id: swarm, text: 蜂群}
            - text: "。阿岩压低声音问：“梨树长胡子了吗？”"
    - id: p02
      illustration: p02
      paragraphs:
        - text: "阮奶奶让两个孩子退回屋里，关好纱门，又打电话请吴师傅来。她问：“站在这里，我们能看清什么？”莉莉听见连续的蜂声，也看出蜂团像一只倒挂的梨。阿岩发现，仍有蜜蜂在枝条周围飞。阮奶奶请邻居先绕开园边小路。"
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "吴师傅是镇上的养蜂人。她赶来后，在远离梨树的地方拉起一道素色绳子。她告诉孩子们，"
            - vocabulary: {id: swarm, text: 蜂群}
            - text: "可能在树枝上停几个小时，也可能停几天。蜂王多半藏在蜂团内部，外面看不见；大部分蜜蜂留在原处，少数"
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: "则飞出去寻找巢址。"
    - id: p04
      illustration: p04
      paragraphs:
        - text: "“蜂王肯定会告诉大家，哪棵树最好。”阿岩猜。莉莉的本子上已经写好“梨树上的新家”。阮奶奶没有反驳，只问：“你们亲眼看到了哪一步？”莉莉想了想，划掉原来的标题，改记两条事实：蜂团挂在树枝上；没有看见蜂王。"
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "隔着安全线，莉莉用望远镜守着蜂团。单只蜜蜂时而飞走，过一阵又有蜜蜂落回蜂团表面。她无法认出前后是不是同一只。吴师傅解释，一只"
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: "会先考察某个地点，再回来传递消息。眼前的来去说明寻找正在进行，却没有告诉他们目的地在哪里。"
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "午后，一只归来的蜂挤进同伴中间。它先摆动身体，直走一小段，再从旁边绕回起点，接着重复同样的路线。这个动作叫"
            - vocabulary: {id: waggle-dance, text: 摇摆舞}
            - text: "。研究发现，直行的角度和持续时间能传递方向与距离。放大的录像让莉莉看清了动作，但她没有把自己猜的方向当成解码结果。"
    - id: p07
      illustration: p07
      paragraphs:
        - text: "不久，蜂团表面同时出现好几只舞蜂。它们直行时朝向不同，像在报告几个互不相同的地方。阿岩犯了难：“地图这么多，听谁的？”吴师傅说：“一只蜂只能报告自己考察过的地点。跟舞的侦察蜂还要亲自飞去复查，不是谁跳一次就算定了。”"
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "莉莉每隔一段时间观察五分钟。第一轮中，有些舞只转了几圈便停下；另一些"
            - vocabulary: {id: waggle-dance, text: 摇摆舞}
            - text: "持续得更久，周围也聚来更多跟随者。西利等人的实验表明，侦察蜂认为地点条件较好时，舞通常更有力。更多同伴因此被招去考察那个地点。"
    - id: p09
      illustration: p09
      paragraphs:
        - text: "太阳移到屋顶另一边时，第二轮记录有了明显变化。指向河堤方向的舞增加了，另一个方向的舞却渐渐减少。阿岩马上说：“河堤那边要赢了。”莉莉只在旁边画了一个问号。舞多说明支持变强，可园里的人还没找到这些舞所指的地方。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "放大录像中，一只蜂用头碰了正在跳舞的另一只蜂，同时发出很短的振动。孩子们看见了相碰，却听不见那样细小的信号。相关实验发现，这种停止信号能使宣传另一个地点的舞缩短。一个选择逐渐形成，既因为支持增加，也因为别的支持退去。"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "第二天，指向河堤的舞最活跃。阿岩拍着口袋说：“这回已经选好了！”阮奶奶问：“真正决定搬家的数量，要在哪里出现？”吴师傅提醒他们，蜂团上的舞有多少，并不是最后一步。研究人员发现，必须有足够多的侦察蜂同时出现在同一个候选巢址。"
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "吴师傅带大家来到河堤上一个较远的观察点。老柳树上有个小洞，几只"
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: "正在洞口进进出出，有的还会绕一圈再返回。孩子们始终站在远处，也不把手伸向洞口。他们能数来访的蜂，却无法从外面量出隐藏在树干里的"
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: "有多大。"
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "最初，柳树洞口同时只有两只蜂。后来，几只蜂接连赶到。科学家把一个地点必须聚集的最低数量叫作"
            - vocabulary: {id: quorum, text: 法定人数}
            - text: "。在一些实验里，大约十五只侦察蜂到达同一地点后，蜂群开始准备起飞。不过，柳叶挡住了部分洞口，莉莉没有给野外这群蜂写下一个假装准确的数字。"
    - id: p14
      illustration: p14
      paragraphs:
        - text: "回到屋里不久，梨树那边的嗡嗡声变高了。许多蜜蜂在蜂团表面快速奔走，原来紧密的外形也开始松动。研究表明，侦察蜂会带动同伴活动，使飞行肌肉逐渐暖起来。“柳树洞口变热闹以后，梨树这边也变了。”莉莉说完，仍没有急着写结论。"
    - id: p15
      illustration: p15
      paragraphs:
        - text: "蜂团下沿突然散开。成千上万只蜜蜂离开枝条，园中的空气像装满了褐色火星。纱门后的阿岩又退了一步。树叶之间，原来被遮住的梨树枝重新露了出来。“这里果然不是它们的家。”他说。莉莉翻回那行被划掉的标题。"
    - id: p16
      illustration: p16
      paragraphs:
        - text: "起初，飞起的蜂铺满观测园上空，随后收成一股移动的蜂云，越过矮墙，朝河堤流去。有些侦察蜂在蜂群外侧快速穿行，为同伴带路。阮奶奶和孩子们一直留在屋里。他们能看出飞行方向，却很快被树木挡住了视线。"
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "吴师傅从安全距离查看了老柳树。蜂云已经聚在洞口，许多蜜蜂正陆续进入"
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: "。莉莉把几段记录连在一起：“飞行方向、洞口的蜂和先前的舞，现在对上了。”这次搬入说明蜂群选了哪个地点，却不能保证它以后每个季节都会顺利。"
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "傍晚，梨树枝一直空着，柳树洞口仍有稳定的蜜蜂来往。莉莉按顺序读出证据：外出寻找、多个方向的舞、洞口来访增加、达到"
            - vocabulary: {id: quorum, text: 法定人数}
            - text: "，最后共同起飞。没有哪只蜂王站出来指路。阿岩说：“下次，我要等它们在地点上聚够数再下结论。”莉莉合上了第三本《野外笔记》。"
