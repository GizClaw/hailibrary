      blocks:
        - {id: p11-b01, speaker: narrator, text: 第二天，指向河堤的舞最活跃。}
        - {id: p11-b02, speaker: yan, text: 这回已经选好了！}
        - {id: p11-b03, speaker: grandma-ruan, text: 真正决定搬家的数量，要在哪里出现？}
        - {id: p11-b04, speaker: beekeeper-wu, text: 蜂团上的舞有多少，并不是最后一步。研究人员发现，必须有足够多的侦察蜂同时出现在同一个候选巢址。}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: 吴师傅带大家来到河堤上一个较远的观察点。老柳树上有个小洞。}
        - id: p12-b02
          speaker: narrator
          content:
            - text: 几只
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: 正在洞口进进出出，有的还会绕一圈再返回。孩子们始终站在远处，也不把手伸向洞口。
        - id: p12-b03
          speaker: narrator
          content:
            - text: 他们能数来访的蜂，却无法从外面量出隐藏在树干里的
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: 有多大。
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: 最初，柳树洞口同时只有两只蜂。后来，几只蜂接连赶到。}
        - id: p13-b02
          speaker: narrator
          content:
            - text: 科学家把一个地点必须聚集的最低数量叫作
            - vocabulary: {id: quorum, text: 法定人数}
            - text: 。在一些实验里，大约十五只侦察蜂到达同一地点后，蜂群开始准备起飞。
        - {id: p13-b03, speaker: narrator, text: 不过，柳叶挡住了部分洞口，莉莉没有给野外这群蜂写下一个假装准确的数字。}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: 回到屋里不久，梨树那边的嗡嗡声变高了。许多蜜蜂在蜂团表面快速奔走，原来紧密的外形也开始松动。}
        - {id: p14-b02, speaker: narrator, text: 研究表明，侦察蜂会带动同伴活动，使飞行肌肉逐渐暖起来。}
        - {id: p14-b03, speaker: lili, text: 柳树洞口变热闹以后，梨树这边也变了。}
        - {id: p14-b04, speaker: narrator, text: 莉莉说完，仍没有急着写结论。}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: 蜂团下沿突然散开。成千上万只蜜蜂离开枝条，园中的空气像装满了褐色火星。}
        - {id: p15-b02, speaker: narrator, text: 纱门后的阿岩又退了一步。树叶之间，原来被遮住的梨树枝重新露了出来。}
        - {id: p15-b03, speaker: yan, text: 这里果然不是它们的家。}
        - {id: p15-b04, speaker: narrator, text: 莉莉翻回那行被划掉的标题。}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: 起初，飞起的蜂铺满观测园上空，随后收成一股移动的蜂云，越过矮墙，朝河堤流去。}
        - {id: p16-b02, speaker: narrator, text: 有些侦察蜂在蜂群外侧快速穿行，为同伴带路。阮奶奶和孩子们一直留在屋里。}
        - {id: p16-b03, speaker: narrator, text: 他们能看出飞行方向，却很快被树木挡住了视线。}
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          content:
            - text: 吴师傅从安全距离查看了老柳树。蜂云已经聚在洞口，许多蜜蜂正陆续进入
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: 。
        - {id: p17-b02, speaker: lili, text: 飞行方向、洞口的蜂和先前的舞，现在对上了。}
        - {id: p17-b03, speaker: narrator, text: 这次搬入说明蜂群选了哪个地点，却不能保证它以后每个季节都会顺利。}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: 傍晚，梨树枝一直空着，柳树洞口仍有稳定的蜜蜂来往。}
        - id: p18-b02
          speaker: narrator
          content:
            - text: 莉莉按顺序读出证据：外出寻找、多个方向的舞、洞口来访增加、达到
            - vocabulary: {id: quorum, text: 法定人数}
            - text: ，最后共同起飞。没有哪只蜂王站出来指路。
        - {id: p18-b03, speaker: yan, text: 下次，我要等它们在地点上聚够数再下结论。}
        - {id: p18-b04, speaker: narrator, text: 莉莉合上了第三本《野外笔记》。}
