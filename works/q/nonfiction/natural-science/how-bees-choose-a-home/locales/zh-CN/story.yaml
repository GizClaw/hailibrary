schema_version: 2
language: zh-CN
writer: 江笑
title: 蜜蜂怎样选新家
summary: 阮奶奶家的梨树上来了一群蜜蜂。林莉莉和阿岩站在安全处，记录侦察蜂的来去、摇摆舞的变化和老柳树洞口的访问量。他们发现，舞蹈只是招来更多考察者；一个地点的侦察蜂达到数量门槛后，它们转而发出管鸣信号，蜂群才开始为搬家作准备。
chapters:
  - id: ch01
    title: 梨树枝上的嗡嗡声
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 指向各处的舞
    page_refs: [p05, p06, p07, p08, p09, p10]
  - id: ch03
    title: 一个地点来了足够多的蜂
    page_refs: [p11, p12, p13, p14]
  - id: ch04
    title: 飞向老柳树
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据说明梨树枝只是蜂群临时停留的地方？
    answer: 蜜蜂在露天树枝上抱成一团时，寻找仍在继续；后来整个蜂群离开梨树，飞进了柳树洞，梨树枝重新露了出来。
    page_refs: [p01, p03, p05, p15, p17]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 莉莉前后两次记录的舞蹈情况有什么不同？
    answer: 第一轮，莉莉按看得见的角度给舞蜂分组，还数了各组的舞蜂和跟随者。每轮都由吴师傅把角度同太阳位置比较。到第二轮时，表示河堤方向的一组舞蜂多了，另一组少了。
    page_refs: [p07, p08, p09]
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 莉莉为什么划掉“梨树上的新家”？
    answer: 她当时只看见树枝上的蜂团，没有看见蜂王，而侦察蜂还在寻找。这些事实都不能说明梨树就是新家。
    page_refs: [p03, p04]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 侦察蜂要在哪里达到数量门槛？
    answer: 要在一个候选巢址达到数量门槛，例如老柳树的树洞。这里看的是同一时间出现在那里的侦察蜂数量，不是梨树蜂团上的舞蜂数量。
    page_refs: [p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 许多侦察蜂怎样把不同地点的信息合成一个选择？
    answer: 它们各自考察地点，再用舞蹈招来别的侦察蜂复查。较强的支持继续增加，较弱的支持减少；一个地点的侦察蜂达到数量门槛后，它们转而发出管鸣信号，蜂群开始准备起飞。
    page_refs: [p05, p06, p07, p08, p09, p10, p13, p14]
  - id: q06
    type: synthesis
    speaker: narrator
    prompt: 哪三类证据把指向河堤的舞和老柳树这个选择连了起来？
    answer: 吴师傅把舞的角度同太阳位置比较，判断出河堤方向。接着，柳树洞口的侦察蜂增多，最后蜂群朝那个方向飞去并进入树洞。
    page_refs: [p08, p09, p12, p13, p16, p17]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 第二天早上，阿岩说“这回已经选好了”，当时证据够吗？请用后面的事情判断。
    answer: 还没有。舞蹈活跃只说明支持在增加。后来，侦察蜂在柳树洞口聚集，蜂团开始准备起飞，整个蜂群又真的进入了那个树洞，证据才完整。
    page_refs: [p11, p13, p14, p17]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "清晨，阮奶奶屋后的老观测园忽然响起一阵低沉的嗡嗡声。林莉莉刚跨进园门，就拉住了跟在身后的小表弟阿岩。梨树上垂着一个不断起伏的褐色蜂团。那是离开原来蜂巢、围着蜂王暂时聚在一起的"
            - vocabulary: {id: swarm, text: 蜂群}
            - text: "。阿岩压低声音问：“梨树长胡子了吗？”"
    - id: p02
      illustration: p02
      paragraphs:
        - text: "阮奶奶让两个孩子退回屋里，关好纱门，又打电话请吴师傅来。阮奶奶问：“站在这里，我们能看清什么？”莉莉听见连续的蜂声，也看出蜂团像一只倒挂的梨。阿岩发现，仍有蜜蜂在枝条周围飞。阮奶奶请邻居先绕开园边小路。"
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "吴师傅是镇上的养蜂人。她赶来后，在远离梨树的地方拉起一根绳子，围出安全线。她先提醒大家，成团的蜜蜂通常很温和，可被打扰时仍可能蜇人，所有人都要站在线后。"
            - vocabulary: {id: swarm, text: 蜂群}
            - text: "可能在树枝上停几个小时，也可能停几天。蜂王多半藏在蜂团内部，外面看不见；大部分蜜蜂留在原处，少数"
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: "飞出去寻找巢址。"
    - id: p04
      illustration: p04
      paragraphs:
        - text: "“蜂王肯定会告诉大家，哪棵树最好。”阿岩猜。莉莉的本子上已经写好“梨树上的新家”。阮奶奶没有反驳，只问：“你们刚才亲眼看见了什么？”莉莉想了想，划掉原来的标题，改记两条事实：蜂团挂在树枝上；没有看见蜂王。"
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "吴师傅在安全线后架起长焦相机，莉莉则用望远镜守着蜂团。单只蜜蜂时而飞走，过一阵又有蜜蜂落回蜂团表面。她们无法认出前后是不是同一只。吴师傅指着相机屏幕解释，一只"
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: "会先考察某个地点，再回来传递消息。眼前的来去说明寻找正在进行，却没有告诉他们目的地在哪里。"
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "午后，一只归来的蜂挤进同伴中间。它先摆动身体，直走一小段，再从旁边绕回起点，接着重复同样的路线。这个动作叫"
            - vocabulary: {id: waggle-dance, text: 摇摆舞}
            - text: "。研究发现，直行角度要同太阳的位置比较，才能表示方向；持续时间则能传递距离。吴师傅把录像放大后，莉莉照着画下可见的角度，又数了舞蜂重复路线的次数。她自己还看不出某个角度究竟指向哪里。"
    - id: p07
      illustration: p07
      paragraphs:
        - text: "不久，蜂团表面同时出现好几只舞蜂。它们直行时朝向不同，像在报告几个互不相同的地方。阿岩犯了难：“地图这么多，听谁的？”吴师傅说：“一只蜂只能报告自己考察过的地点。跟舞的侦察蜂还要亲自飞去复查，不是谁跳一次就算定了。”"
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "莉莉每隔一段时间观察五分钟。第一轮中，有些舞只转几圈便停下，另一些持续更久，跟随者也更多。吴师傅把直行角度同太阳位置比较，读出各组方向。莉莉只按所见角度给舞蜂分组，记下每组舞蜂和跟随者的数量。西利等人的实验表明，侦察蜂认为地点条件较好时，"
            - vocabulary: {id: waggle-dance, text: 摇摆舞}
            - text: "通常更有力。这样的舞也会招来更多同伴考察。"
    - id: p09
      illustration: p09
      paragraphs:
        - text: "太阳移到屋顶另一边时，吴师傅再次把舞的角度同太阳位置比较。吴师傅判断其中一组指向河堤。莉莉数出这组舞蜂多了，另一组少了。阿岩马上说：“河堤那边要赢了。”莉莉只在旁边画了一个问号。舞蜂增多说明支持变强，可园里的人还没看见那个地点。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "放大录像中，一只蜂用头碰了正在跳舞的另一只蜂，同时发出很短的振动。孩子们看见两只蜂碰了一下，却听不见那样细小的信号。相关实验发现，这种停止信号能使支持另一个地点的舞缩短。接下来的画面里，那只舞蜂停了下来。莉莉把相碰和停舞分成两条记录，并在两条旁边记下同一段录像的时间。"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "第二天，指向河堤的舞最活跃。阿岩指着蜂团说：“这回已经选好了！”阮奶奶问：“要知道它们已经选好，我们得去哪里看？”吴师傅回答：“去候选巢址。只看蜂团上有多少舞，还不能知道选择是否完成。研究人员发现，必须有足够多的侦察蜂同时出现在同一个候选巢址。”"
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "吴师傅根据舞蹈的指向，朝河堤方向寻找。她知道那里有棵中空的老柳树，便在离树很远的地方定下观察点。老柳树上有个小洞，几只"
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: "正在洞口进进出出，有的还会绕一圈再返回。孩子们始终站在远处，也不把手伸向洞口。他们能数来访的蜂，却无法从外面量出隐藏在树干里的"
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: "有多大。"
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "大家在观察点最初只看见洞口同时有两只蜂，后来几只蜂接连赶到。科学家把同一候选地同时出现的侦察蜂数量下限叫作"
            - vocabulary: {id: quorum, text: 数量门槛}
            - text: "。侦察蜂不会投票或有意数数；同伴多到门槛时，它们便转而发出管鸣信号，蜂群开始准备起飞。有的实验门槛约为十五只。柳叶挡住部分洞口，莉莉没有硬写准确数字。"
    - id: p14
      illustration: p14
      paragraphs:
        - text: "回到屋里不久，梨树那边的嗡嗡声变高了。许多蜜蜂在蜂团表面快速奔走，原来紧密的外形也开始松动。渐高的蜂声里混着侦察蜂发出的管鸣信号，孩子们无法把它单独听出来。研究表明，这种信号会促使等待的蜜蜂活动飞行肌肉，自己完成起飞前的热身。“柳树洞口变热闹以后，梨树这边也变了。”莉莉说完，把“蜂声变高”记在柳树洞口的计数旁。"
    - id: p15
      illustration: p15
      paragraphs:
        - text: "蜂团下沿突然散开。成千上万只蜜蜂离开枝条，园中的空气像装满了褐色火星。纱门后的阿岩又退了一步。树叶之间，原来被遮住的梨树枝重新露了出来。“这里果然不是它们的家。”他说。莉莉一直望着梨树枝，直到最后几只蜂也飞走了。"
    - id: p16
      illustration: p16
      paragraphs:
        - text: "起初，飞起的蜂铺满观测园上空，随后聚成一股移动的蜂云，越过矮墙，朝河堤流去。阮奶奶和孩子们一直留在屋里，看着蜂群飞过观测园。他们能看出飞行方向，却很快被树木挡住了视线。"
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "吴师傅带大家在安全距离外查看老柳树。蜂云已经聚在洞口，许多蜜蜂正陆续进入"
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: "。莉莉把几段记录连在一起：“飞行方向、洞口的蜂和先前的舞，现在对上了。”蜂群搬入树洞，说明它们选了这个地点。天色渐暗，吴师傅带大家回到园里。"
    - id: p18
      illustration: p18
      paragraphs:
        - text: "傍晚，梨树枝一直空着，柳树洞口仍有稳定的蜜蜂来往。莉莉翻回被划掉的标题，在下面补了一条观察：侦察蜂先在柳树洞口聚集，蜂群后来才搬进去。根据这些记录和已有研究，莉莉得出结论：并不是蜂王在树枝上指挥大家选新家。阿岩盯着柳树洞口说：“又进去一只。”莉莉合上橙色笔记本。"
