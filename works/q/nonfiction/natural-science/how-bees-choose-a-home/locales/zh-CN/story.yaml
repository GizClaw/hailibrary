        - {id: p07-b01, speaker: narrator, text: 不久，蜂团表面同时出现好几只舞蜂。它们直行时朝向不同，像在报告几个互不相同的地方。}
        - {id: p07-b02, speaker: narrator, text: 阿岩犯了难。}
        - {id: p07-b03, speaker: yan, text: 地图这么多，听谁的？}
        - {id: p07-b04, speaker: beekeeper-wu, text: 一只蜂只能报告自己考察过的地点。跟舞的侦察蜂还要亲自飞去复查，不是谁跳一次就算定了。}
    - id: p08
      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: 莉莉每隔一段时间观察五分钟。第一轮中，有些舞只转几圈便停下，另一些持续更久，跟随者也更多。吴师傅把直行角度同太阳位置比较，读出各组方向。莉莉只按所见角度给舞蜂分组，记下每组舞蜂和跟随者的数量。}
        - id: p08-b02
          speaker: narrator
          content:
            - text: 西利等人的实验表明，侦察蜂认为地点条件较好时，
            - vocabulary: {id: waggle-dance, text: 摇摆舞}
            - text: 通常更有力。
        - {id: p08-b03, speaker: narrator, text: 这样的舞也会招来更多同伴考察。}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: 太阳移到屋顶另一边时，吴师傅再次把舞的角度同太阳位置比较。吴师傅判断其中一组指向河堤。莉莉数出这组舞蜂多了，另一组少了。}
        - {id: p09-b02, speaker: narrator, text: 阿岩马上说。}
        - {id: p09-b03, speaker: yan, text: 河堤那边要赢了。}
        - {id: p09-b04, speaker: narrator, text: 莉莉只在旁边画了一个问号。舞蜂增多说明支持变强，可园里的人还没看见那个地点。}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: 放大录像中，一只蜂用头碰了正在跳舞的另一只蜂，同时发出很短的振动。孩子们看见两只蜂碰了一下，却听不见那样细小的信号。}
        - {id: p10-b02, speaker: narrator, text: 相关实验发现，这种停止信号能使支持另一个地点的舞缩短。接下来的画面里，那只舞蜂停了下来。莉莉把相碰和停舞分成两条记录，并在两条旁边记下同一段录像的时间。}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: 第二天，指向河堤的舞最活跃。阿岩指着蜂团。}
        - {id: p11-b02, speaker: yan, text: 这回已经选好了！}
        - {id: p11-b03, speaker: grandma-ruan, text: 要知道它们已经选好，我们得去哪里看？}
        - {id: p11-b04, speaker: beekeeper-wu, text: 去候选巢址。只看蜂团上有多少舞，还不能知道选择是否完成。研究人员发现，必须有足够多的侦察蜂同时出现在同一个候选巢址。}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: 吴师傅根据舞蹈的指向，朝河堤方向寻找。她知道那里有棵中空的老柳树，便在离树很远的地方定下观察点。老柳树上有个小洞。}
        - id: p12-b02
          speaker: narrator
          content:
            - text: 几只
            - vocabulary: {id: scout-bee, text: 侦察蜂}
            - text: 正在洞口进进出出，有的还会绕一圈再返回。孩子们始终站在远处，也不把手伸向洞口。
        - id: p12-b03
          speaker: narrator
          content:
            - text: 他们能数来访的蜂，却无法从外面量出隐藏在树干里的
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: 有多大。
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: 大家在观察点最初只看见洞口同时有两只蜂，后来几只蜂接连赶到。}
        - id: p13-b02
          speaker: narrator
          content:
            - text: 科学家把同一候选地同时出现的侦察蜂数量下限叫作
            - vocabulary: {id: quorum, text: 数量门槛}
            - text: 。侦察蜂不会投票或有意数数；同伴多到门槛时，它们便转而发出管鸣信号，蜂群开始准备起飞。有的实验门槛约为十五只。
        - {id: p13-b03, speaker: narrator, text: 柳叶挡住部分洞口，莉莉没有硬写准确数字。}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: 回到屋里不久，梨树那边的嗡嗡声变高了。许多蜜蜂在蜂团表面快速奔走，原来紧密的外形也开始松动。}
        - {id: p14-b02, speaker: narrator, text: 渐高的蜂声里混着侦察蜂发出的管鸣信号，孩子们无法把它单独听出来。研究表明，这种信号会促使等待的蜜蜂活动飞行肌肉，自己完成起飞前的热身。}
        - {id: p14-b03, speaker: lili, text: 柳树洞口变热闹以后，梨树这边也变了。}
        - {id: p14-b04, speaker: narrator, text: 莉莉说完，把“蜂声变高”记在柳树洞口的计数旁。}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: 蜂团下沿突然散开。成千上万只蜜蜂离开枝条，园中的空气像装满了褐色火星。}
        - {id: p15-b02, speaker: narrator, text: 纱门后的阿岩又退了一步。树叶之间，原来被遮住的梨树枝重新露了出来。}
        - {id: p15-b03, speaker: yan, text: 这里果然不是它们的家。}
        - {id: p15-b04, speaker: narrator, text: 莉莉一直望着梨树枝，直到最后几只蜂也飞走了。}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: 起初，飞起的蜂铺满观测园上空，随后聚成一股移动的蜂云，越过矮墙，朝河堤流去。}
        - {id: p16-b02, speaker: narrator, text: 阮奶奶和孩子们一直留在屋里，看着蜂群飞过观测园。}
        - {id: p16-b03, speaker: narrator, text: 他们能看出飞行方向，却很快被树木挡住了视线。}
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          content:
            - text: 吴师傅带大家在安全距离外查看老柳树。蜂云已经聚在洞口，许多蜜蜂正陆续进入
            - vocabulary: {id: tree-cavity, text: 树洞}
            - text: 。
        - {id: p17-b02, speaker: narrator, text: 莉莉把几段记录连在一起。}
        - {id: p17-b03, speaker: lili, text: 飞行方向、洞口的蜂和先前的舞，现在对上了。}
        - {id: p17-b04, speaker: narrator, text: 蜂群搬入树洞，说明它们选了这个地点。天色渐暗，吴师傅带大家回到园里。}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: 傍晚，梨树枝一直空着，柳树洞口仍有稳定的蜜蜂来往。}
        - {id: p18-b02, speaker: narrator, text: 莉莉翻回被划掉的标题，在下面补了一条观察：侦察蜂先在柳树洞口聚集，蜂群后来才搬进去。根据这些记录和已有研究，莉莉得出结论：并不是蜂王在树枝上指挥大家选新家。阿岩盯着柳树洞口。}
        - {id: p18-b03, speaker: yan, text: 又进去一只。}
        - {id: p18-b04, speaker: narrator, text: 莉莉合上橙色笔记本。}
