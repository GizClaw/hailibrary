schema_version: 2
language: en-US
writer: river-wink
title: How Bees Choose a Home
summary: A honeybee swarm settles in Grandma Ruan's pear tree. From a safe distance, Lili and Yan follow scouts, changing waggle dances, and visits to a hollow willow. The evidence shows how a quorum at one candidate site prepares the whole swarm to move.
chapters:
  - id: ch01
    title: The Branch That Buzzed
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: Dances in Several Directions
    page_refs: [p05, p06, p07, p08, p09, p10]
  - id: ch03
    title: Enough Scouts at One Place
    page_refs: [p11, p12, p13, p14]
  - id: ch04
    title: The Flight to the Willow
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: What evidence showed that the pear branch was a temporary stop rather than the chosen home?
    answer: The bees hung in an exposed cluster without comb, scout bees kept leaving and returning, and the entire swarm later flew to the willow cavity.
    page_refs: [p01, p03, p05, p15, p17]
  - id: q02
    type: compare
    speaker: narrator
    prompt: How did the dance activity change between the first and second notebook samples?
    answer: The first sample included strong dances in several directions. Later, dances toward the levee had increased while dances for another direction had faded.
    page_refs: [p07, p08, p09]
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why did Lili cross out her early heading instead of calling the pear tree the bees' new home?
    answer: She realized that a guess about the cluster was not enough; scouts were still searching and she needed evidence from several places.
    page_refs: [p04, p05]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: Where did the scouts have to reach a quorum?
    answer: They had to reach a quorum at a candidate nest site, such as the willow cavity, rather than on the swarm cluster.
    page_refs: [p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: How did information about different sites lead the swarm toward one home?
    answer: Independent scouts inspected sites and advertised them. Stronger support recruited more inspectors, rival support decreased, and a quorum at one site started departure preparations.
    page_refs: [p05, p06, p07, p08, p09, p10, p13, p14]
  - id: q06
    type: synthesis
    speaker: narrator
    prompt: Which three kinds of evidence connected the levee dances with the chosen willow?
    answer: Dances toward the levee became more common, more scouts visited the willow opening, and the departing swarm flew in that direction and entered the cavity.
    page_refs: [p09, p12, p13, p16, p17]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: Was Yan justified in declaring a winner on page eleven? Explain using later evidence.
    answer: No. Busy dances showed growing support but not a completed choice. Later, many scouts gathered at the willow, the cluster prepared to fly, and the swarm entered that cavity.
    page_refs: [p11, p13, p14, p17]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "A deep hum rolled across Grandma Ruan's old weather garden. Lili stopped at the gate and pulled Yan back beside her. On a pear branch hung a brown, moving mass of honeybees. It was a "
            - vocabulary: {id: swarm, text: swarm}
            - text: ", a traveling part of a colony gathered around its queen. “Did the tree grow a beard?” Yan whispered."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Grandma Ruan called the children into the house and shut the screen door. “What can we observe without going closer?” she asked. Lili could hear the hum and see the cluster's pear shape. Yan could see bees circling the branch. Grandma Ruan phoned Beekeeper Wu and asked neighbors to avoid the garden path."
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Beekeeper Wu arrived and tied a plain rope well beyond the tree. She said a "
            - vocabulary: {id: swarm, text: swarm}
            - text: " may rest on a branch for hours or days while workers seek a nest. The queen was probably inside, but nobody could see her. A few "
            - vocabulary: {id: scout-bee, text: scout bees}
            - text: " would search while most bees waited."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Yan announced, “The queen will point them to the best tree.” Lili had already written a heading: New Home in the Pear Tree. Grandma Ruan asked, “Which part did we actually see?” Lili crossed out the heading but saved the page. She wrote two lines instead: Cluster on branch. Queen not seen."
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "Through binoculars, Lili watched single bees leave the cluster and later return. She could not tell whether each return belonged to the same insect. Beekeeper Wu explained that a "
            - vocabulary: {id: scout-bee, text: scout bee}
            - text: " explores a possible home, then comes back with information. The visible trips supported searching, but they did not reveal any destination."
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "One returning bee pushed through the crowd, wagged along a short straight path, and looped back. Then she repeated the pattern. This was a "
            - vocabulary: {id: waggle-dance, text: waggle dance}
            - text: ". Research shows that its angle and timing carry direction and distance. Lili could see the pattern through magnified video, but she could not decode it accurately."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Soon, several dancers worked on different parts of the cluster. Their straight runs did not all point the same way. “Three maps at once,” Yan said. “So which map is right?” Lili asked. Beekeeper Wu answered, “Each dance reports one scout's site. Other scouts still have to inspect those places for themselves.”"
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "Lili sampled the dances for five minutes, then waited before counting again. Some dancers stopped after a few circuits. Others kept repeating the "
            - vocabulary: {id: waggle-dance, text: waggle dance}
            - text: " and gained followers. In Seeley's experiments, scouts danced more strongly for sites they judged better. That difference recruited more bees to inspect a promising place."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "By late afternoon, Lili's second sample no longer matched the first. Dances angled toward the levee had become common. Dances in another direction had faded. “The levee side is winning,” Yan said. Lili drew a question mark. More advertising meant support was growing, yet nobody in the garden had seen the proposed home."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "On the magnified recording, one scout briefly butted a rival dancer and made a short buzz. The children could see contact, although they could not hear that tiny signal. Experiments show that such stop signals can shorten dances for competing sites. The swarm's choice developed through both growing support and support that fell away."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "The next morning, the levee dances looked busiest. Yan slapped his pockets. “Now they have voted!” Grandma Ruan asked, “Where would the deciding count happen?” Beekeeper Wu said that dance numbers alone did not finish the choice. Researchers found that enough scouts had to gather together at one candidate nest site."
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "From a distant place on the levee, Beekeeper Wu showed them a small opening in an old willow. Several "
            - vocabulary: {id: scout-bee, text: scout bees}
            - text: " entered, came out, and circled back. The children stayed far away and never reached toward the hole. They could count visits, but the hidden "
            - vocabulary: {id: tree-cavity, text: tree cavity}
            - text: " could not be measured from outside."
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "At first, only two bees were near the willow opening at once. Later, several arrived close together. Scientists call the minimum group at a site a "
            - vocabulary: {id: quorum, text: quorum}
            - text: ". In particular experiments, departure preparations began when roughly fifteen scouts had gathered. Lili wrote no exact count for this wild swarm because leaves hid part of the entrance."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Back inside the house, the children heard the pear-tree hum rise. Bees rushed over the cluster, and the tight surface began to loosen. Research has shown that scouts help prepare the waiting bees for flight by stirring activity and warming flight muscles. “Something changed after the willow grew busy,” Lili said, keeping her conclusion open."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "The lower edge of the cluster broke apart. Thousands of bees lifted from the branch until the garden air seemed full of brown sparks. Yan stepped back from the screen. The pear branch appeared again, bare except for leaves. “It really wasn't their house,” he said. Lili turned to the crossed-out heading."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "At first the flying bees filled a wide space above the garden. Then the cloud narrowed and streamed over the low wall toward the levee. Scouts moved rapidly along its outer edge, helping guide the group. The family watched from the house. They could follow the direction, but trees soon hid the destination."
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "Beekeeper Wu checked the willow from a safe distance. The moving cloud had gathered around its opening, and bees were flowing into the "
            - vocabulary: {id: tree-cavity, text: tree cavity}
            - text: ". “The flight and the entrance traffic finally agree with the dances,” Lili said. The move showed which site the swarm chose, though it could not guarantee what would happen in every future season."
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "Near sunset, steady bee traffic continued at the willow, while the pear branch stayed empty. Lili read her evidence in order: searching flights, competing dances, rising visits, a "
            - vocabulary: {id: quorum, text: quorum}
            - text: ", and one shared departure. No queen had pointed from the branch. Yan said, “Next time, I'll wait for the count at the place.” Lili closed Field Notebook Three."
