schema_version: 1
required: true
sources:
  - url: https://nbb.cornell.edu/thomas-seeley
    publisher: Cornell University, Department of Neurobiology and Behavior
    claims:
      - When a honeybee colony reproduces, the old queen and many workers leave, settle in a temporary cluster, and search for a new home site.
      - Options compete by accumulating scout visits, and the winning option reaches a critical level or quorum of support.
      - Diversity of information, independent evaluation, and open sharing contribute to collective decision making.
  - url: https://news.cornell.edu/stories/2006/04/honeybee-decision-making-ability-rivals-any-department-committee
    publisher: Cornell Chronicle
    claims:
      - Several hundred scouts may inspect alternative nest sites while most of the swarm waits in a temporary cluster.
      - The reported swarms contained thousands of bees, supporting the story's framed description of thousands lifting from the branch without implying that the children counted them.
      - Scouts advertise sites by waggle dancing, and better sites tend to elicit stronger dances that recruit more inspectors.
      - Experimental swarms began preparing to depart after roughly fifteen scouts had gathered at one candidate site; this is an experimental scale, not a universal fixed count.
      - Before departure, scouts stimulate the clustered bees to warm their flight muscles, and the swarm then flies together to the selected site.
  - url: https://pubmed.ncbi.nlm.nih.gov/11763965/
    publisher: U.S. National Library of Medicine record for Seeley and Tautz (2001)
    claims:
      - Nest-site scouts produce worker piping signals as a swarm prepares to lift off.
      - Worker piping stimulates waiting non-scout bees to warm themselves to a flight-ready temperature, and the rise in piping matches the swarm's warming before departure.
  - url: https://doi.org/10.1007/s002650000299
    publisher: Behavioral Ecology and Sociobiology
    claims:
      - Seeley and Buhrman's experiments found that scouts adjusted dance strength to perceived site quality.
      - A scout advertising a high-quality site performed more waggle runs than one advertising a medium-quality site, helping stronger recruitment build at better sites.
      - Swarms can compare several alternatives even though individual scouts have limited information.
  - url: https://doi.org/10.1007/s00265-004-0814-5
    publisher: Behavioral Ecology and Sociobiology
    claims:
      - Seeley and Visscher's experiments support the quorum-sensing hypothesis: departure preparation begins after enough scouts are present at a candidate site.
      - The relevant quorum is detected at the candidate nest site, not by simply counting dances on the swarm cluster.
  - url: https://news.cornell.edu/stories/2011/12/decision-making-bee-swarms-mimics-brains
    publisher: Cornell Chronicle
    claims:
      - Scouts that inspect an advertised site may return and advertise it themselves if they approve it.
      - Scouts supporting different sites can deliver stop signals that reduce rival dances, helping one option emerge when choices are close.
  - url: https://www.nobelprize.org/prizes/medicine/1973/press-release/
    publisher: The Nobel Prize
    claims:
      - A waggle dance contains a repeated straight waggle run and return loops.
      - The angle of the straight run communicates direction relative to the sun, and dance features communicate distance.
  - url: https://extension.umn.edu/garden-and-home/yard-and-garden/yard-and-garden-insects/wasps-and-bees
    publisher: University of Minnesota Extension
    claims:
      - A honeybee swarm may cluster on a branch or other object for an hour to a few days while scouts find a nest site.
      - Honeybee swarming commonly occurs during the spring season, making the late-spring setting biologically plausible.
      - People should stay back and keep others away; an experienced beekeeper may relocate a swarm when its location creates a problem.
  - url: https://fieldreport.caes.uga.edu/publications/C824/honey-bee-swarms-and-bees-in-walls/
    publisher: University of Georgia Cooperative Extension, Circular 824
    claims:
      - Honeybee swarms in the clustered stage are relatively gentle and present a low sting risk, but they should still be treated with caution.
      - People should not disturb a swarm and should keep pedestrians, children, and pets away from it.
  - url: https://www.ars.usda.gov/pacific-west-area/tucson-az/carl-hayden-bee-research-center/docs/bee-safety/bee-safety/
    publisher: United States Department of Agriculture, Agricultural Research Service
    claims:
      - People should leave honeybee colonies alone, keep others away, and avoid disturbing or trying to remove bees themselves.
      - Buzzing colonies and regular traffic at an entrance should be observed without reaching into unseen cavities.
notes: >-
  The river town, Grandma Ruan's pear tree, the old willow beside the levee,
  Beekeeper Wu, the timing of the observed dances, the children's notebook
  counts, Beekeeper Wu's long-lens camera, and her marked viewing point on the
  levee are fictional but biologically plausible. The children never touch,
  mark, decode, or remove bees. They watch from indoors or behind a boundary
  set by an experienced beekeeper. The narrative distinguishes visible events
  from mechanisms established by Seeley and colleagues. Lili's final statement
  about the queen is explicitly a conclusion from observed scout evidence and
  published research, not a direct observation. The story does not claim that
  the children identify individual scouts, know the queen's actions, measure
  the hidden cavity, or see the exact instant a quorum forms. The experimental
  figure of roughly fifteen scouts is framed as a finding from particular trials,
  while the story uses only the general idea that a minimum local group must be
  present. A final move into the willow shows the decision's immediate outcome;
  it does not guarantee the colony's long-term survival.
