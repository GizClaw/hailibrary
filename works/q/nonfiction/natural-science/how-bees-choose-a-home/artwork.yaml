schema_version: 1
style: naturalistic-storybook
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: A small river town in eastern China in late spring, beside green rice fields, a levee path, and the old weather-observation garden behind Grandma Ruan's whitewashed gray-tiled house; one mature pear tree grows inside the garden and one old hollow willow stands beyond the low stone wall beside the levee.
  lili: Chinese girl about 10, same face as Field Notebook 1 and 2, long black ponytail, olive field vest with pockets over a cream shirt, dark trousers, plain orange-covered notebook with blank-looking pages, pencil behind one ear.
  yan: Chinese boy about 8, same face as Field Notebook 1 and 2, short spiky black hair, bright blue raincoat, dark trousers, magnifying glass on a brown cord.
  grandma-ruan: Chinese woman about 68, same face as Field Notebook 1 and 2, short silver hair, wide woven straw hat, gray cardigan, black binoculars.
  beekeeper-wu: Chinese woman about 42, round face, dark hair in a low bun, moss-green beekeeping jacket, pale canvas trousers, tan protective veil folded behind her shoulders, small brown field case.
  honeybees: Anatomically believable western honeybees with amber-brown and dark banded abdomens; the swarm is a dense living cluster, never an exposed comb or a cartoon cloud.
  props: The orange notebook has no visible marks; the garden repeats the white instrument shelter, metal rain gauge, stone paths, low wall, flowers, and gray roof tiles from the earlier books; a thin plain rope marks the viewing boundary without signs or writing.
  palette: Late-spring greens, pear-leaf green, willow gray-brown, weathered white walls and gray tiles, with olive, blue, orange, moss, and warm amber accents under natural daylight.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Lili, Yan, Grandma Ruan, and Beekeeper Wu watch from behind a plain rope in the old observation garden; a large honeybee swarm hangs from the pear tree, several scouts fly between it and the distant hollow willow by the levee, and the river town and rice fields establish the setting.
  - id: p01
    file: artwork/p01.webp
    scene: Late-spring morning; Lili and Yan stop at the garden gate as a dense pear-shaped cluster of honeybees settles on a low but unreachable pear branch, with Grandma Ruan approaching from the house.
  - id: p02
    file: artwork/p02.webp
    scene: From safely inside the open house doorway behind a screen, Grandma Ruan keeps the children back while she makes a phone call; the swarm remains outside on the pear branch.
  - id: p03
    file: artwork/p03.webp
    scene: Beekeeper Wu has arrived and set a plain rope boundary; from behind it, the four observe the quiet hanging swarm without touching it, and the queen remains hidden inside the cluster.
  - id: p04
    file: artwork/p04.webp
    scene: Yan gestures as if making a quick guess while Lili writes in her orange notebook and Grandma Ruan questions them; the hanging cluster is visible beyond the rope.
  - id: p05
    file: artwork/p05.webp
    scene: Through Grandma Ruan's binoculars and a long-lens camera view, a few individual honeybees leave and return to the outer surface of the stable cluster while the observers remain far behind the rope.
  - id: p06
    file: artwork/p06.webp
    scene: Naturalistic close view of one scout bee performing a figure-eight waggle dance on the living surface of the swarm while nearby bees face and touch her with antennae; no diagrams, arrows, or symbols.
  - id: p07
    file: artwork/p07.webp
    scene: Several scout bees dance in different orientations on separate parts of the swarm surface, while a distant environmental view suggests the tiled houses, levee, and fields in several directions without graphic arrows.
  - id: p08
    file: artwork/p08.webp
    scene: Lili uses a simple watch and blank-looking notebook to sample dance activity from behind the rope; one group of dancers has more attentive follower bees than another, and Yan watches with restrained excitement.
  - id: p09
    file: artwork/p09.webp
    scene: Later in the day, Lili compares two blank-looking notebook pages while the number of dances oriented toward the levee has visibly grown and the rival dance group has thinned.
  - id: p10
    file: artwork/p10.webp
    scene: One scout delivers a brief stop signal by touching a rival dancer on the swarm surface; the behavior is shown as a subtle close natural interaction, while the children observe only through magnified camera playback at a distance.
  - id: p11
    file: artwork/p11.webp
    scene: Yan points toward the busy dancers as if declaring a winner; Grandma Ruan raises a questioning hand and Lili pauses over her notebook instead of writing a conclusion.
  - id: p12
    file: artwork/p12.webp
    scene: From a distant safe place on the levee path with Beekeeper Wu, Lili and Yan watch several scout bees enter and leave a small opening in the old hollow willow; the pear-tree swarm is visible far back in the garden.
  - id: p13
    file: artwork/p13.webp
    scene: More scout bees gather around the willow opening at once while Beekeeper Wu and the children count from well behind the boundary; the hidden interior remains unseen.
  - id: p14
    file: artwork/p14.webp
    scene: Back at the house doorway, the pear-tree cluster has loosened and many bees vibrate and move across its surface; the children and Grandma Ruan watch safely from indoors.
  - id: p15
    file: artwork/p15.webp
    scene: The swarm lifts from the pear branch into a dense airborne cloud as Lili, Yan, and Grandma Ruan remain behind the screened doorway; the branch is becoming bare.
  - id: p16
    file: artwork/p16.webp
    scene: The cohesive bee cloud streams above the low stone wall toward the levee and the old willow, while a few faster scout bees move along the outside of the group; people remain distant.
  - id: p17
    file: artwork/p17.webp
    scene: At the old willow, the swarm gathers around and flows into the small cavity opening; Beekeeper Wu and the family observe from far down the levee path without approaching.
  - id: p18
    file: artwork/p18.webp
    scene: Near sunset, the pear branch is empty and steady honeybee traffic enters the distant willow opening; Lili closes her plain orange notebook beside Yan and Grandma Ruan in the quiet garden.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pending
    checks:
      - no-visible-text
      - honeybee-anatomy-and-scale
      - character-continuity
      - clothing-and-prop-continuity
      - cluster-dance-quorum-flight-sequence
      - scene-and-setting-continuity
      - safe-observation-distance
