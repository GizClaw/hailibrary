  setting: Bellweather, an original hill town of circular stone towers, copper roofs, blue cloth field screens, terraced silver seed-sail fields, an upper kite meadow, and a round map house with a relief table; no readable signs or symbols.
  mara: Brown-skinned girl, age twelve, oval face, dark auburn hair in one thick side braid tied with a copper clasp, lapis-blue knee-length coat with ember-gold piping over a cream tunic, deep-violet trousers, brown boots, copper compass at belt, cylindrical map case.
  master-orren: Older dark-skinned man, close-cropped silver hair and short square silver beard, long oxidized-copper green robe with gold-edged sleeves, dark leather apron, brass spectacles, carved wooden map staff.
  sela: Strong middle-aged East Asian woman, broad face, black hair in a low coil, russet work coat over moss-green dress, dark boots, woven seed basket, plain wooden field rake.
  niko: Light-brown-skinned boy, age ten, round face, short black curls, saffron vest over a moon-silver shirt, teal trousers, soft boots, carries a wordless copper-and-violet diamond kite with a long plain ribbon tail.
  winds: Furrow Friend is a low soft gold ribbon, Ridge Runner a broad moon-silver arc, Coppercross a lively oxidized-copper spiral, Buttonwind a small violet puff; they are airy forces with expressive motion but no faces, limbs, or text.
  props: Mara’s copper compass, cylindrical map case, brass spectacles, wooden map staff, blue cloth field screens, woven seed basket, and Niko’s copper-and-violet diamond kite remain consistent. Maps show only abstract unlabeled terrain color and lines, never letters, numbers, runes, arrows, or readable marks.
  palette: Lapis blue, oxidized copper, ember gold, deep violet, moonlit silver, russet, moss green, and warm parchment.
