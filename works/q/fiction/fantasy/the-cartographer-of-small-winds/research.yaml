notes: >-
  Bellweather, the named and personified small winds, magical wind paths,
  seed-sail plants and silver pods, and the story events are fictional. The
  sources support only the real map terms, the directional meaning of
  crosswind, and the ordinary kite-line actions used in the practice scene.
