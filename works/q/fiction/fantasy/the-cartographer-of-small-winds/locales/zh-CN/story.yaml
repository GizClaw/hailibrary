        pace: 平稳中速，场景转换处稍停
        pitch: 中音
    mara:
      display_name: 米拉
      tts:
        delivery: 起初准确又急切，辩解时略快，反思后坦然沉稳
        timbre: 清亮利落的少女声音
        pace: 先快后稳
        pitch: 中高音
    master-orren:
      display_name: 奥伦师傅
      tts:
        delivery: 耐心克制，带干幽默，提问后留出空白
        timbre: 低沉温厚、略带沙哑的老年男声
        pace: 从容缓慢
        pitch: 低音
    sela:
      display_name: 赛拉
      tts:
        delivery: 务实直接，情绪藏在简短的话里
        timbre: 结实沉着的成年女声
        pace: 清楚的中慢速
        pitch: 中低音
    niko:
      display_name: 尼科
      tts:
        delivery: 活泼坦率，着急时加快但保持清楚
        timbre: 明亮轻快的男孩声音
        pace: 轻快多变
        pitch: 高音
