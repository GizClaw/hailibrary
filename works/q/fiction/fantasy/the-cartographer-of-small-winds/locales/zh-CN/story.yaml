    - id: p12-b03
      speaker: mara
      text: 我看见那条交叉的风路，还亲手把它擦掉了。
  - id: p13
    illustration: p13
    blocks:
    - id: p13-b01
      speaker: master-orren
      text: 哪些是你看见的，哪些只是你希望如此？
    - id: p13-b02
      speaker: narrator
      text: 米拉清晨去梯田，中午上草场，傍晚守在集市口。田沟风一直贴着低处走；过了中午，走脊风才铺满草场；挡风屏封住旧缺口，铜旋风就改道。
    - id: p13-b03
      speaker: narrator
      text: '她原先把三个时段压成了一张图，可山坡从没答应这样省事。 '
  - id: p14
    illustration: p14
    blocks:
    - id: p14-b01
      speaker: narrator
      text: 米拉请赛拉和尼科一起试一面挡风屏。试验地点离风筝线很远。赛拉把布屏转开一点，尼科只在空草场边放一只风筝。三人看着金、银、铜三条风路慢慢调整，又等同样的变化出现一次。
    - id: p14-b02
      speaker: sela
      text: 这要多花一个小时。
    - id: p14-b03
      speaker: niko
      text: 总比再解一街棚绳快。
  - id: p15
    illustration: p15
    blocks:
    - id: p15-b01
      speaker: narrator
      text: 米拉用三张薄薄的透明羊皮纸重画镇图，分别记录早晨、中午和傍晚。她补回所有看见过的风路，也保留那些能帮助判断风在哪里减慢的等高线。
    - id: p15-b02
      speaker: narrator
      content: *3
  - id: p16
    illustration: p16
    blocks:
    - id: p16-b01
      speaker: narrator
      text: 第二次镇民会上，米拉没有带来一个永远正确的答案。她把三层图依次铺在山形桌上。赛拉把两排挡风屏错开，给午后的铜旋风留路；尼科把试飞地移到铜色路线以上。
    - id: p16-b02
      speaker: mara
      text: 谁改了布屏或场地，都要记下小风的新走法，再改下一层图。
  - id: p17
    illustration: p17
    blocks:
    - id: p17-b01
      speaker: narrator
      text: 风筝节那天，田沟风贴着苗行缓缓走，银帆苗平稳地立着。走脊风托住草场上空的风筝。铜旋风穿过两处错开的挡风屏，又来到草场边，让尼科完成了一个谨慎的转弯。
    - id: p17-b02
      speaker: narrator
      text: '农人在中午检查布屏，放风筝的人等银色风带铺开才起飞。两边没有得到全部的风，却都知道何时该让出一条路。 '
  - id: p18
    illustration: p18
    blocks:
    - id: p18-b01
      speaker: narrator
      text: 日落后，米拉把三层地图挂进圆形大厅。尼科送回补好的风筝尾，赛拉把一颗银色种荚放在铜罗盘旁。
    - id: p18-b02
      speaker: master-orren
      text: 这张图能比好看的清晨活得久吗？
    - id: p18-b03
      speaker: mara
      text: 只要我们一直留意它什么时候错了。
