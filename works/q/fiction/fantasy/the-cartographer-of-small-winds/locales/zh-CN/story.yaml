schema_version: 2
language: zh-CN
writer: 江笑
title: 小风的地图师
summary: 见习地图师米拉想用一张整齐的地图同时满足农人与放风筝的人。她擦掉的一条风路却把铜旋风送进集市。面对这份迟来的后果，米拉重新观察不同时间与地点，让地图能够记录试验、疑问和下一次修改。
