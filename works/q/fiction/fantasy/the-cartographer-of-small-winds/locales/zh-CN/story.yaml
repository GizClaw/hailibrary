questions:
- id: q01
  type: character-motive
  speaker: narrator
  prompt: 米拉为什么擦掉第一张公开地图上的铜色风路？
  answer: 她怕交叉的风路让图显得麻烦，也怕赛拉因此拒绝整个挡风屏计划。
  page_refs:
  - p06
  - p07
- id: q02
  type: compare
  speaker: narrator
  prompt: 挡风屏给农人和放风筝的人带来了哪些不同结果？
  answer: 挡风屏让田沟风在苗行里安稳下来，却把草场上的风分成几段，还让铜旋风在窄谷里积聚。
  page_refs:
  - p08
  - p09
- id: q03
  type: evidence
  speaker: narrator
  prompt: 哪些事情让米拉明白，人们使用地图也会改变小风的路？
  answer: 农人按图立起挡风屏后，铜旋风离开田边，在窄谷积聚，后来又冲进集市。
  page_refs:
  - p08
  - p09
  - p10
- id: q04
  type: short-answer
  speaker: narrator
  prompt: 米拉的新地图为什么分成早晨、中午和傍晚三层？
  answer: 因为不同小风在三个时段的走法不同，压在一张图上会藏起重要变化。
  page_refs:
  - p13
  - p15
- id: q05
  type: main-idea
  speaker: narrator
  prompt: 米拉对“能用的地图”的认识发生了什么变化？
  answer: 她不再把整齐的单张地图当成最后答案，而是记录时间、没把握的地方、试验结果和以后需要修改的内容。
  page_refs:
  - p04
  - p07
  - p13
  - p15
  - p16
  - p18
- id: q06
  type: synthesis
  speaker: narrator
  prompt: 梯田、草场和集市的观察怎样一起形成了风筝节计划？
  answer: 梯田说明田沟风在哪里安稳，草场说明走脊风何时铺开，集市说明铜旋风被挡后会去哪里。大家因此错开布屏，并移动试飞地。
  page_refs:
  - p13
  - p14
  - p16
  - p17
- id: q07
  type: evaluate
  speaker: narrator
  prompt: 第九页中，米拉说“地图只负责画风”。后来的事情支持这句话吗？请说明。
  answer: 不支持。人们按图放置挡风屏，挡风屏改变了魔法小风的路线，结果集市和试飞场都受到了影响。
  page_refs:
  - p09
  - p10
  - p11
  - p12
article:
  pages:
  - id: p01
    illustration: p01
    paragraphs:
    - text: 钟风镇的学徒都想画大风：越过山顶的风，推动云船的风，能把钟楼吹得齐声歌唱的风。米拉偏爱小风。它们钻门缝，追烟圈，还会卷走地图没压好的角。
    - text: "“好看的清晨很短，能用的地图得活得久。” 奥伦师傅提醒她。米拉满口答应。 "
  - id: p02
    illustration: p02
    paragraphs:
    - text: 早饭前，农人赛拉带米拉下到东坡。低低的“田沟风”本该顺着一排排银帆苗走，这天却总从断墙口挤进来，把快熟的种荚摇落。
    - text: "“让田里安稳到收获，我就不叫你们地图师‘屋里种地的人’。” 赛拉说。米拉听出了她的着急。 "
  - id: p03
    illustration: p03
    paragraphs:
    - text: 中午，山顶草场上传来线轮转动的声音。尼科的铜紫风筝乘着“走脊风”升高，“铜旋风”却一次次从侧面推歪长尾。尼科拉回风筝，又笑着放线。
    - text: "“别把它管得太乖。没有意外的风筝，像挂在线上的床单。” 他说。 "
  - id: p04
    illustration: p04
    paragraphs:
    - text: 傍晚，农人要求在梯田边多设蓝布挡风屏；放风筝的人却要保住所有开阔风路。两边都等着米拉的第一张公开地图替他们作决定。
    - text: 米拉给每股风只画一条整齐路线。线条拼得严丝合缝，连奥伦师傅扬起的眉毛都显得多余。
    - text: "“一张图，一个答案。” 她宣布。 "
  - id: p05
    illustration: p05
    paragraphs:
    - content: &1
      - text: 清晨，米拉沿山坡寻找同样高的地方，再把这些点连成一条
      - vocabulary:
          id: contour-line
          text: 等高线
      - text: "。田沟风爱贴着这些平缓的线走。线突然转弯的地方，它就慢下来，一遍遍碰那里的石墙。"
  - id: p06
    illustration: p06
    paragraphs:
    - text: 到了正午，米拉登上草场。铜旋风没有顺着风筝前进的方向吹，而是斜着从旁边推来。
    - content: &2
      - text: 这种横过前进方向的风叫
      - vocabulary:
          id: crosswind
          text: 侧风
      - text: "。它在田墙边惹麻烦，尼科却借那一下横推，让风筝绕出宽宽的圆。"
    - text: "“同一股风，换个地方就换了用处。” 尼科说。米拉记下这句话，又给它画了一个很小的框。 "
  - id: p07
    illustration: p07
    paragraphs:
    - text: 夜里，米拉把白天的记录誊到镇图上。铜色路线穿过农人计划放挡风屏的位置，把整洁的图面切成两半。她怕赛拉看到以后，连整个办法都不要了。
    - text: '米拉擦掉田边那段铜线，心想小风总能另找一条路。窗外有什么轻轻敲了两下窗扣。她没有起身。 '
  - id: p08
    illustration: p08
    paragraphs:
    - text: 第二天，农人照图在梯田边立起低矮的蓝布屏，金色风路仍然敞开。田沟风安静地走进苗行，银帆苗不再互相碰撞。
    - text: "“你的纸总算肯沾泥了。” 赛拉难得笑了。米拉把这句话当成了好成绩。 "
  - id: p09
    illustration: p09
    paragraphs:
    - text: 山顶草场却出了问题。尼科的风筝升起，又软软落下；新挡风屏把走脊风分成了断断续续的几段。铜旋风不在田边了，一团铜色气流却在镇下方的窄谷里越积越紧。
    - text: "“是你的图让它去了那里吗？” 尼科问。米拉说地图只负责画风，可这句话连她自己也没有说稳。 "
  - id: p10
    illustration: p10
    paragraphs:
    - text: 次日早市刚开，铜旋风猛地冲出窄谷。它掀翻空篮，把彩带吹上屋檐，还把三根棚绳拧成了一个大结。没人受伤，可店主们只好封住小街，慢慢解绳。
    - text: '米拉在每一道旋风里都看见了被擦掉的路线。钟风镇的地图一旦被人照着使用，就会给小风开出真实的路。 '
  - id: p11
    illustration: p11
    paragraphs:
    - text: 集市还没收拾好，风筝节的试飞已经开始。一股突然转向的风把两只风筝拉向一起。尼科喊大家松线，孩子们及时把风筝降到草地上。
    - text: "“铜旋风以前把力气分在田边，现在全挤到这里来了。” 尼科对赶来的米拉说。他没有像往常那样开玩笑。 "
  - id: p12
    illustration: p12
    paragraphs:
    - text: 赛拉也来到了草场。集市上的风从背后撞歪了几面挡风屏，她忙了一上午才重新立好。尼科手里还拿着一条扯破的风筝尾。
    - text: "“你的图让田里安稳了一天，却把麻烦推下了山。” 赛拉说。"
    - text: "“我看见那条交叉的风路，还亲手把它擦掉了。” 米拉承认。她等着奥伦师傅收回铜罗盘，他却只把罗盘推回她面前。 "
  - id: p13
    illustration: p13
    paragraphs:
    - text: "“哪些是你看见的，哪些只是你希望如此？” 奥伦师傅问。"
    - text: 米拉清晨去梯田，中午上草场，傍晚守在集市口。田沟风一直贴着低处走；过了中午，走脊风才铺满草场；挡风屏封住旧缺口，铜旋风就改道。
    - text: '她原先把三个时段压成了一张图，可山坡从没答应这样省事。 '
  - id: p14
    illustration: p14
    paragraphs:
    - text: 米拉请赛拉和尼科一起试一面挡风屏。试验地点离风筝线很远。赛拉把布屏转开一点，尼科只在空草场边放一只风筝。三人看着金、银、铜三条风路慢慢调整，又等同样的变化出现一次。
    - text: "“这要多花一个小时。” 赛拉说。"
    - text: "“总比再解一街棚绳快。” 尼科回答。 "
  - id: p15
    illustration: p15
    paragraphs:
    - text: 米拉用三张薄薄的透明羊皮纸重画镇图，分别记录早晨、中午和傍晚。她补回所有看见过的风路，也保留那些能帮助判断风在哪里减慢的等高线。
    - content: &3
      - text: 图角的
      - vocabulary:
          id: map-legend
          text: 图例
      - text: 说明每种颜色和符号代表什么，还标出哪些观察需要再试一次。她故意留下了几处空白。
  - id: p16
    illustration: p16
    paragraphs:
    - text: 第二次镇民会上，米拉没有带来一个永远正确的答案。她把三层图依次铺在山形桌上。赛拉把两排挡风屏错开，给午后的铜旋风留路；尼科把试飞地移到铜色路线以上。
    - text: "“谁改了布屏或场地，都要记下小风的新走法，再改下一层图。” 米拉说。赛拉点头，尼科先问哪里能试飞。 "
  - id: p17
    illustration: p17
    paragraphs:
    - text: 风筝节那天，田沟风贴着苗行缓缓走，银帆苗平稳地立着。走脊风托住草场上空的风筝。铜旋风穿过两处错开的挡风屏，又来到草场边，让尼科完成了一个谨慎的转弯。
    - text: '农人在中午检查布屏，放风筝的人等银色风带铺开才起飞。两边没有得到全部的风，却都知道何时该让出一条路。 '
  - id: p18
    illustration: p18
    paragraphs:
    - text: 日落后，米拉把三层地图挂进圆形大厅。尼科送回补好的风筝尾，赛拉把一颗银色种荚放在铜罗盘旁。
    - text: "“这张图能比好看的清晨活得久吗？” 奥伦师傅问。"
    - text: "“只要我们一直留意它什么时候错了。” 米拉回答。她挂上一枚新的铜片，准备记录明天；小小的扣子风立刻来抢，逗得大家追了半圈。 "
