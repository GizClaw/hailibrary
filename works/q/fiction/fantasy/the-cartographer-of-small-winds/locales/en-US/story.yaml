questions:
- id: q01
  type: character-motive
  speaker: narrator
  prompt: Why did Mara erase Coppercross from her first public map?
  answer: She feared that Sela would reject the screen plan if the crossing wind made the design look troublesome and untidy.
  page_refs:
  - p06
  - p07
- id: q02
  type: compare
  speaker: narrator
  prompt: How did the farmers’ screens help one group but create problems for another?
  answer: The screens calmed Furrow Friend among the seed-sails, but they broke the meadow wind into weak patches and pushed Coppercross toward the ravine.
  page_refs:
  - p08
  - p09
- id: q03
  type: evidence
  speaker: narrator
  prompt: What evidence showed Mara that a trusted map could change a small wind’s road?
  answer: People placed screens from her map, Coppercross disappeared from its usual field route, gathered in the ravine, and then burst through the market.
  page_refs:
  - p08
  - p09
  - p10
- id: q04
  type: short-answer
  speaker: narrator
  prompt: What did the map legend explain on Mara’s revised map?
  answer: It explained the colors and symbols and marked observations that still needed another test.
  page_refs:
  - p15
- id: q05
  type: main-idea
  speaker: narrator
  prompt: What changed in Mara’s idea of a useful map?
  answer: She stopped treating one neat map as a final answer and made a layered map that recorded time, uncertainty, tests, and later revisions.
  page_refs:
  - p04
  - p07
  - p13
  - p15
  - p16
  - p18
- id: q06
  type: synthesis
  speaker: narrator
  prompt: How did observations from three places lead to the final festival plan?
  answer: The terraces showed where Furrow Friend stayed low, the meadow showed when Ridge Runner widened, and the market revealed where blocked Coppercross went. The town then staggered screens and moved kite practice.
  page_refs:
  - p13
  - p14
  - p16
  - p17
- id: q07
  type: evaluate
  speaker: narrator
  prompt: Was Mara right to say that maps only showed winds on page nine? Evaluate her claim using later events.
  answer: No. In Bellweather, people acted on the map, their screens redirected the magical winds, and the changed route caused trouble in the market and at practice.
  page_refs:
  - p09
  - p10
  - p11
  - p12
article:
  pages:
  - id: p01
    illustration: p01
    paragraphs:
    - text: Every apprentice in Bellweather longed to map a grand wind. Mara preferred the small ones. They slipped under doors, argued with chimney smoke, and stole the corners of unfinished maps.
    - text: "“A useful map must outlive a pretty morning.” Master Orren reminded her. Mara promised that hers would."
  - id: p02
    illustration: p02
    paragraphs:
    - text: Before breakfast, Farmer Sela led Mara down the east terraces. Furrow Friend, a low golden breeze, usually followed the planting rows. That morning it kept bumping through a broken wall and shaking silver seed-sails loose.
    - text: "“Give us a calm path until harvest, and I’ll stop calling mapmakers indoor gardeners.” Sela said."
  - id: p03
    illustration: p03
    paragraphs:
    - text: At midday, Niko waited on the upper meadow with a copper-and-violet kite. Ridge Runner lifted it smoothly, but Coppercross kept nudging its tail from the side. Niko laughed each time he recovered.
    - text: "“Don’t tame that one. A kite without a surprise is laundry on a string.” he told Mara."
  - id: p04
    illustration: p04
    paragraphs:
    - text: That evening, farmers asked for more cloth screens along the terraces. Kite fliers wanted every open wind left alone. Both groups expected Mara’s first public map to settle the matter.
    - text: She drew one neat path for each wind. The lines fit so well that even Master Orren’s raised eyebrow looked untidy.
    - text: "“One map, one answer.” Mara said."
  - id: p05
    illustration: p05
    paragraphs:
    - content: &1
      - text: 'At dawn, Mara traced a '
      - vocabulary:
          id: contour-line
          text: contour line
      - text: ", a line joining places of equal height, around each terrace. Furrow Friend liked to travel along those level curves. Wherever the line bent sharply, the breeze slowed and worried at the stone."
  - id: p06
    illustration: p06
    paragraphs:
    - content: &2
      - text: 'At noon, Mara climbed to the meadow. Coppercross was a '
      - vocabulary:
          id: crosswind
          text: crosswind
      - text: ", blowing across the kite’s forward path instead of along it. It was troublesome near the field wall, yet Niko used the sideways push to turn his kite in a wide circle."
    - text: "“Same wind, different job.” he said. Mara wrote the words, then boxed them so tightly they seemed less important."
  - id: p07
    illustration: p07
    paragraphs:
    - text: By lamplight, Mara copied her observations onto the town map. The copper route crossed the farmers’ blue screen marks and spoiled the clean design. If she showed it, Sela might reject the whole plan.
    - text: Mara erased Coppercross from the field edge. She told herself that a small wind could find another way. Outside, something tapped the window latch twice.
  - id: p08
    illustration: p08
    paragraphs:
    - text: The farmers followed Mara’s map the next morning. They set low blue screens beside the marked terraces, leaving the golden paths open. Furrow Friend settled between the rows, and the loose seed-sails stopped knocking together.
    - text: "“Your paper has finally earned dirt on its corners.” Sela said, pleased."
  - id: p09
    illustration: p09
    paragraphs:
    - text: On the meadow, Niko’s kite rose, sagged, and rose again. The new screens had broken Ridge Runner into weak patches. Coppercross had vanished from the field edge, but a copper-colored coil now gathered in the narrow ravine below town.
    - text: "“Did your map send it there?” Niko asked. Mara answered that maps only showed winds. She was no longer sure."
  - id: p10
    illustration: p10
    paragraphs:
    - text: At breakfast the next day, Coppercross sprang out of the ravine. It raced through the market lane, flipped empty baskets, and tied three awning ropes into one astonishing knot. No one was hurt, but the lane closed while shopkeepers untangled it.
    - text: Mara saw the erased route in every loop. In Bellweather, a map did not merely describe a small wind. Once trusted, it gave the wind a road.
  - id: p11
    illustration: p11
    paragraphs:
    - text: Festival practice began before the market reopened. A sudden sideways gust pulled two kites together. Niko called for slack, and the children lowered both kites before the lines crossed.
    - text: "“Coppercross used to spend that push beside the fields. Now it arrives all at once.” he told Mara. The joke had gone from his voice."
  - id: p12
    illustration: p12
    paragraphs:
    - text: Sela found them carrying the torn tail of a practice kite. She had also spent the morning resetting screens where the market gust had struck them from behind.
    - text: "“Your map kept my rows calm for one day and moved the trouble downhill.” she said."
    - text: "“I saw the crossing path and erased it.” Mara admitted. She expected Master Orren to take back her compass. He did not."
  - id: p13
    illustration: p13
    paragraphs:
    - text: "“What did you observe, and what did you only hope?” Master Orren asked."
    - text: Mara returned to the terraces at dawn, the meadow at noon, and the market at evening. Furrow Friend stayed low. Ridge Runner widened after midday. Coppercross changed route whenever screens closed its usual gap.
    - text: Her first map had folded three times into one. The hill had not agreed to that fold.
  - id: p14
    illustration: p14
    paragraphs:
    - text: Mara asked Sela and Niko to test one screen, far from the festival lines. Sela turned it a little. Niko flew one kite at the meadow’s empty edge. Mara watched the golden, silver, and copper paths adjust, then waited until the same pattern returned.
    - text: "“That costs us an hour.” Sela said."
    - text: "“Less than another market knot.” Niko replied."
  - id: p15
    illustration: p15
    paragraphs:
    - text: 'Mara built a new map from three thin sheets: morning, noon, and evening. She restored every observed path, including Coppercross. Around the hill she kept the height lines that had helped her predict where each breeze would slow.'
    - content: &3
      - text: 'In the corner, her '
      - vocabulary:
          id: map-legend
          text: map legend
      - text: " explained the map’s colors and symbols. It also marked observations that still needed another test."
  - id: p16
    illustration: p16
    paragraphs:
    - text: At the second meeting, Mara did not promise one answer. She slid the three sheets across the relief table. Sela moved two screens apart for the afternoon. Niko shifted the practice area above the copper route.
    - text: "“If either plan changes the wind, we record the result and revise the next sheet.” Mara said. This time, nobody mistook neatness for certainty."
  - id: p17
    illustration: p17
    paragraphs:
    - text: On festival day, Furrow Friend moved quietly between the seed-sails. Ridge Runner held the kites above the open meadow. Coppercross curled through the gap between them, where Niko used its sideways push for one careful turn.
    - text: Sela’s screens stood in staggered rows instead of a solid wall. Farmers checked them at noon, and kite fliers waited for the meadow ribbon before launching.
  - id: p18
    illustration: p18
    paragraphs:
    - text: At sunset, Mara hung the layered map in the map house. Niko returned the repaired kite tail, and Sela left one silver seed pod beside the compass.
    - text: "“Will this map outlive a pretty morning?” Master Orren asked."
    - text: "“Only if we keep noticing when it is wrong.” Mara said. Then she added a fresh copper tag for tomorrow’s observations while Buttonwind tried to steal it."
audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and warmly amused, letting consequences land without a lesson speech
        timbre: clear adult alto with a soft grain
        pace: steady medium pace with room at scene changes
        pitch: centered mid pitch
    mara:
      display_name: Mara
      tts:
        delivery: exact and eager at first, clipped when defensive, open and grounded after reflection
        timbre: bright young alto with crisp consonants
        pace: brisk, easing to measured
        pitch: mid-high pitch
    master-orren:
      display_name: Master Orren
      tts:
        delivery: dry, patient, and deliberate, with questions that leave space
        timbre: deep warm baritone with a light rasp
        pace: unhurried
        pitch: low pitch
    sela:
      display_name: Sela
      tts:
        delivery: firm and practical, with emotion held behind plain words
        timbre: strong mature contralto
        pace: measured medium-slow pace
        pitch: low-mid pitch
    niko:
      display_name: Niko
      tts:
        delivery: playful and candid, becoming breathless under pressure without losing clarity
        timbre: light clear boyish voice
        pace: quick with lively changes
        pitch: high pitch
