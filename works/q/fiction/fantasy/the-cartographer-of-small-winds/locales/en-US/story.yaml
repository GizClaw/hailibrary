schema_version: 2
language: en-US
writer: river-wink
title: The Cartographer of Small Winds
summary: Apprentice mapmaker Mara draws one elegant wind map for Bellweather’s farmers and kite fliers. When people follow the map, their screens redirect an omitted wind into the market. Mara must face the delayed cost of a useful-looking answer and rebuild the map around time, testing, and revision.
