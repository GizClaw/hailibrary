questions:
- id: q01
  type: character-motive
  speaker: narrator
  prompt: Why did Mara erase Coppercross from her first public map?
  answer: She feared that Sela would reject the screen plan if the crossing wind made the design look troublesome and untidy.
  page_refs:
  - p06
  - p07
- id: q02
  type: compare
  speaker: narrator
  prompt: How did the farmers’ screens help one group but create problems for another?
  answer: The screens calmed Furrow Friend among the seed-sail plants, but they broke the meadow wind into weak patches and pushed Coppercross toward the ravine.
  page_refs:
  - p08
  - p09
- id: q03
  type: evidence
  speaker: narrator
  prompt: What evidence showed Mara that people following her map had redirected Coppercross?
  answer: Farmers placed screens where the map directed, across Coppercross’s omitted field route. The wind left its usual gap, gathered in the ravine, and then burst through the market.
  page_refs:
  - p08
  - p09
  - p10
- id: q04
  type: short-answer
  speaker: narrator
  prompt: What did the map legend explain on Mara’s revised map?
  answer: It explained the colors and symbols and marked observations that still needed another test.
  page_refs:
  - p15
- id: q05
  type: main-idea
  speaker: narrator
  prompt: What changed in Mara’s idea of a useful map?
  answer: She stopped treating one neat map as a final answer and made a layered map that recorded time, uncertainty, tests, and later revisions.
  page_refs:
  - p04
  - p07
  - p13
  - p15
  - p16
  - p18
- id: q06
  type: synthesis
  speaker: narrator
  prompt: How did observations from three places lead to the final festival plan?
  answer: The terraces showed where Furrow Friend stayed low, the meadow showed when Ridge Runner widened, and the market showed where the screens redirected Coppercross. The town then staggered screens and moved kite practice.
  page_refs:
  - p13
  - p14
  - p16
  - p17
- id: q07
  type: evaluate
  speaker: narrator
  prompt: Was Mara right when she said, “Maps only show winds”? Evaluate her claim using later events.
  answer: She was only partly right. The map itself moved no wind, but people trusted it and placed screens that redirected Coppercross, causing trouble in the market and at practice.
  page_refs:
  - p09
  - p10
  - p11
  - p12
article:
  pages:
  - id: p01
    illustration: p01
    paragraphs:
    - text: Every apprentice in Bellweather longed to map a grand wind. Mara preferred the small ones. They slipped under doors and argued with chimney smoke. Buttonwind, the smallest, was already tugging at the corner of her unfinished map. Master Orren watched from the stair.
    - text: "“A useful map must outlive a pretty morning,” he reminded her."
    - text: Mara promised that hers would.
  - id: p02
    illustration: p02
    paragraphs:
    - text: Before breakfast, Farmer Sela led Mara down the east terraces. Furrow Friend, a low golden breeze, usually followed the planting rows. That morning it kept bumping through a broken wall, bending the silver seed-sail plants and shaking loose their ripe pods.
    - text: "“Give us a calm path until harvest, and I’ll stop calling mapmakers indoor gardeners,” Sela said."
  - id: p03
    illustration: p03
    paragraphs:
    - text: At midday, Niko waited on the upper meadow with a copper-and-violet kite. Ridge Runner lifted it smoothly, but Coppercross kept nudging its tail from the side. Niko laughed each time he recovered.
    - text: "“Don’t tame that one. A kite without a surprise is laundry on a string,” he told Mara."
  - id: p04
    illustration: p04
    paragraphs:
    - text: That evening, farmers asked for more cloth screens along the terraces. Kite fliers wanted every open wind left alone. Both groups expected Mara’s first public map to settle the matter.
    - text: She drew one neat path for each wind. The lines fit so well that even Master Orren’s raised eyebrow looked untidy.
    - text: "“One map, one answer,” Mara said."
  - id: p05
    illustration: p05
    paragraphs:
    - content: &1
      - text: 'At dawn, Mara traced a '
      - vocabulary:
          id: contour-line
          text: contour line
      - text: ", a line joining places of equal height, around each terrace. Furrow Friend liked to travel along those level curves. Wherever the line bent sharply, the breeze slowed and rubbed against the stone."
  - id: p06
    illustration: p06
    paragraphs:
    - content: &2
      - text: 'At noon, Mara climbed to the meadow. Coppercross cut across Ridge Runner, the wind lifting Niko’s kite. Mara marked it as a '
      - vocabulary:
          id: crosswind
          text: crosswind
      - text: ", a wind blowing across the direction Ridge Runner carried the kite. Near the field wall, its sideways push caused trouble. Here Niko used that push to turn his kite in a wide circle."
    - text: "“Same wind, different job,” he said."
    - text: Mara wrote the words, then squeezed them into a tiny box in the margin.
  - id: p07
    illustration: p07
    paragraphs:
    - text: By lamplight, Mara copied her observations onto the town map. The copper route crossed the farmers’ blue screen marks and spoiled the clean design. If she showed it, Sela might reject the whole plan.
    - text: Mara erased Coppercross from the field edge. She told herself that a small wind could find another way. Outside, something tapped the window latch twice.
  - id: p08
    illustration: p08
    paragraphs:
    - text: The farmers followed Mara’s map the next morning. They set low blue screens beside the marked terraces, leaving the golden paths open. Furrow Friend settled between the rows. The seed-sail plants stood steady, and their silver pods stopped knocking together.
    - text: Sela rubbed a muddy thumb across one corner. “Your paper has finally earned some dirt,” she said with a rare smile.
  - id: p09
    illustration: p09
    paragraphs:
    - text: On the meadow, Sela stood beside Mara with her seed basket still on her arm. Niko’s kite sagged between broken bands of Ridge Runner. The new screens had split Ridge Runner into weak patches. Coppercross had vanished from the field edge, but a copper-colored coil now gathered in the narrow ravine below town.
    - text: "“Did your map send it there?” Niko asked."
    - text: "“Maps only show winds,” Mara answered."
    - text: She watched the coil tighten and wished her answer sounded truer.
  - id: p10
    illustration: p10
    paragraphs:
    - text: At breakfast the next day, Coppercross sprang out of the ravine. It raced through the market lane, flipped empty baskets, and tied three awning ropes into one astonishing knot. No one was hurt, but the lane closed while shopkeepers untangled it.
    - text: Mara traced the gust backward from the market to the ravine, then to the blue screens set along the route she had erased. Farmers had put those screens where her map directed, closing Coppercross’s usual gap. She ran uphill to see what else had changed.
  - id: p11
    illustration: p11
    paragraphs:
    - text: Festival practice began before the market reopened. As Mara reached the meadow, a sudden sideways gust pulled two kites together. Niko called for slack. The children fed out line so the kites dipped apart, then brought them down one at a time. After they landed, the leftover gust dragged one ribbon tail onto a wooden practice frame and tore it.
    - text: Niko stared at the torn ribbon. “That push used to spill out beside Sela’s fields,” he told Mara. “It never hit us like this.”
    - text: He wrapped the tail around his spool without making a joke.
  - id: p12
    illustration: p12
    paragraphs:
    - text: Back in the map house, Niko laid the torn tail among Mara’s scattered maps. Sela set a tilted model screen upright on the relief table. Master Orren was already there, leaning on his staff.
    - text: "“We put up the screens where your map told us,” Sela said. “They calmed the rows for one day, but the gust burst through the market and swept across the practice field.”"
    - text: "“I saw the crossing path and erased it,” Mara admitted."
    - text: Mara slid her compass toward Master Orren. He pushed it back and waited.
  - id: p13
    illustration: p13
    paragraphs:
    - text: "“What did you observe, and what did you only hope?” Master Orren asked."
    - text: Mara watched Furrow Friend cling to the low terraces at dawn. After midday, she returned to find Ridge Runner spread across the meadow. At dusk, she followed Coppercross through the screen gaps and down to the market lane.
    - text: Her first map had stacked those changing routes until they looked like one. She opened a clean notebook page for each time of day.
  - id: p14
    illustration: p14
    paragraphs:
    - text: Mara asked Sela and Niko to test one screen on a clear patch below the meadow. Sela turned it a little while Niko flew one kite from the empty upper edge. Mara watched the golden, silver, and copper paths shift. They reset the screen and kept watching until the change happened again.
    - text: "“That costs us an hour,” Sela said."
    - text: "“Less than another market knot,” Niko replied."
  - id: p15
    illustration: p15
    paragraphs:
    - text: 'In the map house, Master Orren held a brass frame while Mara fitted three translucent sheets inside it: morning, noon, and evening. Sela and Niko watched her restore every observed path, including Coppercross. Around the hill, Mara kept the height lines that had helped her predict where Furrow Friend would slow.'
    - content: &3
      - text: 'In the corner, her '
      - vocabulary:
          id: map-legend
          text: map legend
      - text: " explained the map’s colors and symbols. It also marked observations that still needed another test."
  - id: p16
    illustration: p16
    paragraphs:
    - text: At the second meeting, Mara spread the three sheets over the relief table. She gave Sela and Niko each a blank copper tag.
    - text: "“If you move a screen or shift the practice area, set a tag here,” Mara said. “I’ll map what the wind does next.”"
    - text: Sela opened a gap between two model screens. Niko shifted the practice marker above the copper route. When Mara lowered the afternoon sheet, both choices fit without covering Coppercross’s path.
  - id: p17
    illustration: p17
    paragraphs:
    - text: On festival day, Furrow Friend moved quietly between the seed-sail plants, and their silver pods stayed in place. After midday, Ridge Runner widened across the meadow and held the kites high. Coppercross curled through the planned gap, where Niko used its sideways push for one careful turn.
    - text: Sela’s screens stood in staggered rows instead of a solid wall. Farmers checked them at noon, and kite fliers waited for Ridge Runner to spread before launching.
  - id: p18
    illustration: p18
    paragraphs:
    - text: At sunset, Mara hung the layered map in the map house. Niko held his repaired kite tail beside it, and Sela left one silver seed pod beside the compass.
    - text: "“Will this map outlive a pretty morning?” Master Orren asked."
    - text: "“Only if we keep noticing when it is wrong,” Mara said."
    - text: Then she added a fresh copper tag for tomorrow’s observations while Buttonwind tried to steal it.
