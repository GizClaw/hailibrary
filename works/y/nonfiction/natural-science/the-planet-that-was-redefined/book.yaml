characters:
  - id: narrator
    kind: narrator
    description: A source-aware astronomy narrator who separates observation, classification, institutional choice, and continuing scientific disagreement.
    voice_identity: precise, patient, quietly curious, and careful with contested conclusions
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Reconstruct why the discovery of Eris forced astronomers to make an explicit choice about the boundary of planet.
    - Explain the three tests in the 2006 IAU Solar System definition and why orbital clearing concerns dynamical dominance rather than literal emptiness.
    - Compare a dynamical classification with a geophysical classification by identifying the question, strength, and limitation of each.
    - Evaluate what New Horizons observations changed about knowledge of Pluto and what they did not logically settle about terminology.
    - Defend a qualified synthesis in which classifications are judged by purpose, operational clarity, and acknowledged exclusions.
  concepts:
    - scientific classification and operational definitions
    - Eris and the expanding population beyond Neptune
    - hydrostatic equilibrium and orbital dominance
    - the 2006 IAU resolutions
    - dynamical and geophysical models
    - New Horizons evidence about Pluto
    - trade-offs, institutional authority, and revisable terminology
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
