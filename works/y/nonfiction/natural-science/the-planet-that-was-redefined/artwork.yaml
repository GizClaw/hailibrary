schema_version: 1
style: cosmic-mystery
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  celestial_bodies:
    pluto: A small spherical world with pale tan and rose ice, charcoal equatorial areas, a bright heart-shaped basin, blue atmospheric haze, and no face or anthropomorphic features.
    eris: A distant smooth pale-gray icy sphere, slightly brighter and more neutral than Pluto, with one tiny moon when the scene requires it.
  spacecraft: New Horizons as a compact gold-foil probe with a large plain white dish antenna and dark instrument body, with no insignia, letters, or numbers.
  visual_motifs: Orbital relations appear as luminous curves without arrows or labels; geophysical interiors appear as wordless cutaways; classification groups appear as spatial clusters rather than charts.
  palette: Midnight blue, oxidized teal, muted violet, black, pale Pluto rose, ice white, and sparse amber instrument light.
assets:
  - {id: cover, file: artwork/cover.webp, scene: "Pluto fills the lower center with its bright heart-shaped basin and blue haze; two immense translucent celestial arcs suggest rival ways of grouping it, while tiny New Horizons passes above, no text or symbols."}
  - {id: p01, file: artwork/p01.webp, scene: "New Horizons looks toward Pluto's water-ice mountains, smooth nitrogen-ice plain, and layered atmospheric haze in one coherent wide view."}
  - {id: p02, file: artwork/p02.webp, scene: "Ancient wandering lights over a dark horizon dissolve into modern spherical worlds and luminous orbital paths, showing the changing content of the word planet without labels."}
  - {id: p03, file: artwork/p03.webp, scene: "A 1930 observatory interior with paired glass photographic plates in a blink comparator and a moving point of light implied by two adjacent views, no visible writing or numbers."}
  - {id: p04, file: artwork/p04.webp, scene: "Pluto sits among the crowded icy bodies of the Kuiper Belt, while similarly scaled Eris appears much farther away in the spatially distinct scattered disk on a highly inclined orbit beyond Neptune."}
  - {id: p05, file: artwork/p05.webp, scene: "The same Pluto sphere appears at the crossing of three wordless groupings represented by ice composition, orbital paths, and rounded shapes."}
  - {id: p06, file: artwork/p06.webp, scene: "Eight dominant planets occupy clean orbital zones while Pluto remains amid a distant belt of icy bodies, rendered as an atmospheric wordless classification tableau."}
  - {id: p07, file: artwork/p07.webp, scene: "Earth with a few nearby asteroids and Jupiter with Trojan clusters contrast with Pluto embedded in the Kuiper Belt, making clear that cleared does not mean empty."}
  - {id: p08, file: artwork/p08.webp, scene: "A brass scientific balance motif compares a massive body and a wide orbital zone against a threshold of amber light, with eight bright worlds separated from Pluto and Ceres, no numerals."}
  - {id: p09, file: artwork/p09.webp, scene: Four rocky inner planets and four giant outer planets dominate spacious lanes while smaller populations form belts between and beyond them.}
  - {id: p10, file: artwork/p10.webp, scene: "Two physically identical rounded icy worlds occupy different environments, one alone in a compact orbit and one among a broad crowded belt."}
  - {id: p11, file: artwork/p11.webp, scene: "Wordless cutaway of Pluto shows layered ice, rock, atmosphere, mountains, and internal structure under its own spherical gravity."}
  - {id: p12, file: artwork/p12.webp, scene: "Pluto, Ceres, Earth's Moon, Titan, and Europa form a family of rounded complex worlds, each recognizable by broad physical features and shown without labels."}
  - {id: p13, file: artwork/p13.webp, scene: "A cosmic balance holds a compact set of eight orbital rulers on one side and a large diverse family of rounded worlds on the other, neither side presented as victorious."}
  - {id: p14, file: artwork/p14.webp, scene: "Several borderline bodies of rock and ice show slightly different imperfect spherical shapes, rotations, and internal layers under soft amber measuring light."}
  - {id: p15, file: artwork/p15.webp, scene: "An international astronomy assembly in a grand dark hall considers blank circular models and orbital displays, with no flags, signage, papers, letters, or numbers."}
  - {id: p16, file: artwork/p16.webp, scene: "Raised hands in a 2006 astronomy meeting face several changing wordless planet arrangements projected as simple glowing spheres, emphasizing procedure without depicting a winner."}
  - {id: p17, file: artwork/p17.webp, scene: "New Horizons flies above Pluto's bright basin, mountains, flowing nitrogen ice, and layered blue haze at closest approach."}
  - {id: p18, file: artwork/p18.webp, scene: "A split but connected view contrasts Pluto's rich surface geology below with its crowded resonant orbital environment above, without text or arrows."}
  - {id: p19, file: artwork/p19.webp, scene: Uncrewed New Horizons flies above Pluto's immense varied landscape while researchers study its data in a remote Earth-based mission-control vignette spatially separated by deep space; no humans stand on Pluto.}
  - {id: p20, file: artwork/p20.webp, scene: "Pluto in the Kuiper Belt and Eris in the spatially distinct scattered disk receive equal visual emphasis, with human memory suggested only by a distant old telescope glow near Pluto, not by labels."}
  - {id: p21, file: artwork/p21.webp, scene: "Multiple distant star systems show planets and crowded belts connected by measurable luminous orbital curves, with no equations, text, or numbers."}
  - {id: p22, file: artwork/p22.webp, scene: "Pluto is centered within several transparent nested spatial groupings—orbital belt, rounded icy worlds, atmospheric worlds—without chart labels."}
  - {id: p23, file: artwork/p23.webp, scene: A researcher silhouette compares several wordless celestial maps whose boundaries reveal different patterns and different difficult edge cases.}
  - {id: p24, file: artwork/p24.webp, scene: "Students in silhouette explore a layered solar-system installation with eight principal orbits, belts, moons, and many rounded worlds, no classroom text."}
  - {id: p25, file: artwork/p25.webp, scene: Pluto continues unchanged through space while two translucent classification frameworks shift around it like movable lenses.}
  - {id: p26, file: artwork/p26.webp, scene: "New Horizons recedes into the Kuiper Belt as Pluto, Eris, distant stars, and future unknown worlds remain connected by several complementary luminous maps."}
