schema_version: 1
required: true
scientific_scope: >-
  This work traces Pluto's changing classification from discovery through Eris,
  the IAU's 2006 resolutions, quantitative interpretations of orbital clearing,
  a published geophysical alternative, and New Horizons observations. It treats
  definitions as purpose-dependent scientific tools without implying that every
  proposed definition has equal institutional status or that new geology alone
  decides a terminological boundary.
sources:
  - url: https://www.iau.org/static/resolutions/Resolution_GA26-5-6.pdf
    title: Resolutions B5 and B6, Definition of a Planet in the Solar System and Pluto
    publisher: International Astronomical Union
    supports: >-
      In 2006 the IAU defined a Solar System planet as orbiting the Sun, being
      nearly round through self-gravity, and having cleared its orbital
      neighbourhood; a dwarf planet meets the first two conditions, has not
      cleared the neighbourhood, and is not a satellite. Pluto was designated a
      dwarf planet and prototype of a trans-Neptunian category.
  - url: https://iau.org/Iau/Publications/List-of-Resolutions
    title: IAU List of Resolutions
    publisher: International Astronomical Union
    supports: The adopted B5 and B6 texts are the IAU's official 2006 resolutions.
  - url: https://science.nasa.gov/dwarf-planets/eris/
    title: Eris
    publisher: NASA Science
    supports: >-
      Eris was found in 2005 in observations made in 2003, is comparable in size
      to Pluto, and helped trigger the debate that led to the 2006 definition.
  - url: https://www.loc.gov/everyday-mysteries/item/why-is-pluto-no-longer-a-planet
    title: Why is Pluto no longer a planet?
    publisher: Library of Congress
    supports: >-
      Clyde Tombaugh discovered Pluto at Lowell Observatory in 1930 by comparing
      photographic plates, and clearing an orbital neighbourhood means becoming
      gravitationally dominant rather than removing every small object.
  - url: https://science.nasa.gov/solar-system/planet-x/
    title: Planet X
    publisher: NASA Science
    supports: >-
      Percival Lowell's search for a predicted Planet X was based on apparent
      irregularities in Uranus's orbit that later proved to be measurement errors;
      Pluto did not have enough mass to cause them, so its discovery did not confirm
      Lowell's prediction even though the search program led indirectly to it.
  - url: https://lowell.edu/wp-content/uploads/2014/08/13-inch-Pluto-Telescope.pdf
    title: The 13-inch Pluto Discovery Telescope
    publisher: Lowell Observatory
    supports: >-
      Lowell Observatory built and used the 13-inch astrograph for Clyde Tombaugh's
      photographic search for Planet X, and that systematic search produced the
      plates on which Tombaugh discovered Pluto in 1930.
  - url: https://www.eso.org/public/unitedkingdom/news/eso8610/
    title: First Accurate Determination of the Sizes of Pluto and its Moon
    publisher: European Southern Observatory
    supports: >-
      Early estimates placed Pluto's diameter near 6,600 kilometres, later
      estimates put it between 2,600 and 4,000 kilometres, and observations of
      mutual Pluto-Charon eclipses yielded a still smaller determination; the
      accurately known orbit of Charon made it possible to derive the sizes of
      both bodies and refine physical estimates for the system.
  - url: https://science.nasa.gov/resource/charon-discovery-image/
    title: Charon Discovery Image
    publisher: NASA Science
    supports: >-
      James Christy identified Pluto's previously unknown moon in 1978 from
      repeated elongations on photographic plates. Subsequent observations
      established Charon's orbit and the Pluto-Charon common-center-of-mass
      motion, providing the orbital basis for measuring the system.
  - url: https://ntrs.nasa.gov/citations/19930056212
    title: Masses and Densities of Pluto and Charon
    publisher: NASA Technical Reports Server; The Astronomical Journal
    supports: >-
      Measurements of Charon's orbit and Pluto's barycentric motion produced
      improved values for the total mass of the Pluto system and separate mass
      estimates for Pluto and Charon, showing how the moon enabled refinement
      of the system's physical properties.
  - url: https://escholarship.org/uc/item/2p11349j
    title: A Quantitative Criterion for Defining Planets
    publisher: University of California eScholarship; The Astronomical Journal
    supports: >-
      Jean-Luc Margot proposed a measurable orbital-clearing test based on star
      mass, body mass, orbital period, and a characteristic time; it separates
      the eight planets from Solar System dwarf planets and can extend to most
      known exoplanets.
  - url: https://www.hou.usra.edu/meetings/lpsc2017/pdf/1448.pdf
    title: A Geophysical Planet Definition
    publisher: Lunar and Planetary Institute
    supports: >-
      Runyon and colleagues proposed classifying sub-stellar, never-fusing,
      self-gravitating round bodies as planets regardless of orbit. They argued
      that intrinsic physics better serves planetary geoscience while accepting
      that the resulting category would contain at least about 110 known worlds.
  - url: https://science.nasa.gov/mission/new-horizons/
    title: New Horizons
    publisher: NASA Science
    supports: >-
      New Horizons launched in January 2006 and made the first close exploration
      of Pluto and its moons on 14 July 2015, revealing a complex, active system
      and returning data that revised models of its surface and atmosphere.
  - url: https://www.nasa.gov/solar-system/new-horizons-discovers-flowing-ices-on-pluto/
    title: New Horizons Discovers Flowing Ices on Pluto
    publisher: NASA
    supports: >-
      Images and composition data showed evidence of flowing nitrogen-rich ices,
      young terrain, and mountains on Pluto, supporting the description of Pluto
      as a geologically complex world.
  - url: https://ntrs.nasa.gov/citations/20180004731
    title: The Geology of the Pluto System
    publisher: NASA Technical Reports Server
    supports: >-
      Scientific synthesis of New Horizons data describes glacial flow,
      tectonics, volatile transport, varied terrain ages, and possible
      cryovolcanic features while distinguishing observations from hypotheses.
  - url: https://science.nasa.gov/dwarf-planets/pluto/facts/
    title: Pluto Facts
    publisher: NASA Science
    supports: >-
      Pluto is a complex Kuiper Belt world with a roughly 248-year orbit, five
      known moons, a thin atmosphere, mountains, valleys, plains, craters, and
      glaciers; it remains scientifically valuable under dwarf-planet terminology.
  - url: https://science.nasa.gov/solar-system/kuiper-belt/facts/
    title: Kuiper Belt Facts
    publisher: NASA Science
    supports: >-
      Pluto belongs to a populous region beyond Neptune and occupies a stable
      three-to-two orbital resonance, circling the Sun twice for Neptune's three
      circuits.
  - url: https://science.nasa.gov/saturn/moons/titan/facts/
    title: Titan Facts
    publisher: NASA Science
    supports: >-
      Titan is a large moon with a dense nitrogen-rich atmosphere, methane weather
      and surface liquids, and evidence consistent with an underground ocean.
  - url: https://science.nasa.gov/mission/europa-clipper/why-europa-overview/
    title: Why Europa
    publisher: NASA Science
    supports: >-
      Multiple spacecraft observations strongly support describing Europa as an
      ocean world with liquid water hidden beneath an icy surface.
  - url: https://www.sciencedirect.com/science/article/abs/pii/S0019103597957766
    title: Gravitational Deformation in Shaping Asteroids and Small Satellites
    publisher: Icarus
    supports: >-
      The transition toward a gravity-controlled equilibrium shape depends on
      material strength, composition, size, and the stresses retained by a body,
      so no single visual diameter settles every borderline case.
  - url: https://exoplanetarchive.ipac.caltech.edu/
    title: NASA Exoplanet Archive
    publisher: NASA Exoplanet Science Institute
    supports: >-
      Astronomers maintain a large and growing inventory of confirmed planets
      orbiting stars other than the Sun, requiring working definitions beyond the
      Solar-System-only wording of Resolution B5.
  - url: https://www.iau.org/static/public_press/iau_po_report.pdf
    title: IAU Planet Definition Process Report
    publisher: International Astronomical Union
    supports: >-
      The 2006 definition developed through committee drafts, General Assembly
      discussion, revised resolutions, votes, public communication, and later
      protest, supporting a distinction between institutional procedure and the
      physical evidence evaluated by a criterion.
  - url: https://astrogeology.usgs.gov/search/map/pluto_nomenclature
    title: Pluto Nomenclature
    publisher: U.S. Geological Survey Astrogeology Science Center
    supports: >-
      Planetary nomenclature remains a practical system for locating and
      discussing surface features, including on Pluto, and is maintained for the
      IAU by the USGS Astrogeology Science Center.
  - url: https://science.nasa.gov/lunar-science/focus-areas/planetary-processes/
    title: Planetary Processes Recorded by the Moon
    publisher: NASA Science
    supports: >-
      The Moon preserves evidence of differentiation, magmatic activity,
      volcanism, tectonism, space weathering, and impact cratering, making it a
      complex planetary body for comparative geoscience.
notes: >-
  The text does not equate an institutional vote with proof about Pluto's
  physical nature. It also does not claim that the geophysical proposal replaced
  the IAU definition, that orbital clearing means an empty orbit, or that New
  Horizons observations alone determine which definition all scientists must use.
