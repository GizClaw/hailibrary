questions:
- id: q01
  type: short-answer
  speaker: narrator
  prompt: 二〇〇六年改变了什么，又没有改变什么？
  answer: 国际天文学联合会改变了冥王星的正式类别，冥王星自身的物理性质与轨道没有改变。
  page_refs:
  - p01
  - p25
- id: q02
  type: evidence
  speaker: narrator
  prompt: 阋神星为什么让九大行星旧名单难以继续保持含糊？
  answer: 阋神星大小与冥王星相近；若接纳冥王星却排除阋神星，就必须提出一条一致而公开的新边界。
  page_refs:
  - p04
  - p20
- id: q03
  type: short-answer
  speaker: narrator
  prompt: B5号决议规定太阳系行星必须满足哪三项条件？
  answer: 绕太阳运行、在自身引力下形成近似球形、清空轨道附近区域。
  page_refs:
  - p06
- id: q04
  type: evidence
  speaker: narrator
  prompt: 为什么“清空轨道”不能理解为轨道上一块石头也没有？
  answer: 地球附近仍有小行星，木星也与特洛伊小行星共享区域；这里指长期支配和组织轨道区域。
  page_refs:
  - p07
- id: q05
  type: source-analysis
  speaker: narrator
  prompt: 马戈的量化方案为B5号决议补充了什么？
  answer: 它利用天体与恒星质量、轨道周期和规定时间，把定性的清空条件变成可重复计算的门槛。
  page_refs:
  - p08
  - p21
- id: q06
  type: compare
  speaker: narrator
  prompt: 动力学定义和地球物理学定义分别优先选择哪类证据？
  answer: 前者关注天体与轨道环境的关系，后者关注质量、形状和天体自身的物理性质。
  page_refs:
  - p09
  - p10
  - p11
  - p12
- id: q07
  type: evaluate
  speaker: narrator
  prompt: 地球物理学定义带来的一项收获和一项代价是什么？
  answer: 它能比较包括大型卫星在内的球状世界，但会使太阳系行星数量增加到至少约一百一十颗。
  page_refs:
  - p11
  - p12
  - p13
- id: q08
  type: evaluate
  speaker: narrator
  prompt: 国际天文学联合会的正式地位为什么不能结束所有科学争论？
  answer: 它可以协调正式用语，但研究者仍可检验其标准，并为不同研究问题建立其他分析类别。
  page_refs:
  - p15
  - p16
- id: q09
  type: evidence
  speaker: narrator
  prompt: "“新视野号”揭示了冥王星的哪些性质？"
  answer: 它发现水冰山、氮冰平原、分层薄雾、不同年龄的地貌和挥发性冰流动等复杂现象。
  page_refs:
  - p17
- id: q10
  type: source-analysis
  speaker: narrator
  prompt: 为什么“新视野号”的地质发现不能单独推翻B5号决议？
  answer: 有争议的条件是轨道支配，而地质观测没有改变冥王星在柯伊伯带中的动力学角色。
  page_refs:
  - p18
  - p19
- id: q11
  type: synthesis
  speaker: narrator
  prompt: 怎样用分层名称同时保存两种模型的有效信息？
  answer: 按动力学称冥王星为矮行星、海王星外天体和柯伊伯带成员，同时在地球物理比较中把它视为球状的行星世界。
  page_refs:
  - p22
  - p23
  - p25
- id: q12
  type: research-response
  speaker: narrator
  prompt: 若在海王星外发现一个新的球状天体，用两种模型分类前应收集哪些证据？
  answer: 应测量轨道、质量、中心恒星环境及轨道支配能力，并研究形状、成分与自身引力塑形的证据，同时标明不确定性和适用范围。
  page_refs:
  - p14
  - p21
  - p23
  - p26
