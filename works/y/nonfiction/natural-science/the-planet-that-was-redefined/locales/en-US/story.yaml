  - id: p07
    illustration: p07
    blocks:
    - id: p07-b01
      speaker: narrator
      text: "“Cleared” is easily misunderstood. Earth still encounters asteroids,
        and Jupiter shares its orbit with Trojan asteroids. The condition cannot mean
        that a planet's path is perfectly empty. The intended distinction is dynamical
        dominance: over the Solar System's history, a sufficiently massive body controls,
        scatters, captures, or organizes most other objects near its orbital zone.
        Pluto has not become similarly dominant within the Kuiper Belt. Its motion
        is also locked in a stable resonance with Neptune, completing two orbits while
        Neptune completes three. A useful dynamical test therefore asks how strongly
        a body shapes the architecture around its path, not whether a telescope can
        find one stray rock nearby. Without this explanation, the everyday verb “clear”
        makes the resolution sound either impossible or selectively enforced."
  - id: p08
    illustration: p08
    blocks:
    - id: p08-b01
      speaker: narrator
      text: 'The resolution left “cleared the neighbourhood” qualitative, but later
        work showed how to make the idea measurable. Jean-Luc Margot proposed calculating
        whether a body could clear a defined orbital zone within a characteristic
        time. The calculation uses quantities such as the body''s mass, the star''s
        mass, and the orbital period. Applied to the Solar System, the eight planets
        fall far above the threshold, while Pluto and Ceres fall below it. This wide
        separation answers an important criticism: the category need not depend on
        taste alone. A dynamical criterion can generate a reproducible result from
        measured properties. It also connects classification to planet formation,
        because dominant bodies record a different relationship with the material
        in their orbital zones than members of crowded belts do. A stated calculation
        also exposes its assumptions, allowing another scientist to challenge the
        chosen zone or time.'
  - id: p09
    illustration: p09
    blocks:
    - id: p09-b01
      speaker: narrator
      text: 'Dynamical classification has practical strengths. It keeps the principal
        architecture of the Solar System compact: four terrestrial planets, four giant
        planets, and populations of smaller bodies. It explains why Earth and Jupiter
        belong together despite their physical differences; each dominates its orbital
        zone. It also avoids making every large moon a planet, because moons orbit
        planets rather than the Sun under the IAU wording. For questions about how
        a planetary system formed and which bodies organize its long-term motion,
        environment is not an accidental detail. A body''s mass matters partly through
        what that mass can do at a particular distance over a particular time. The
        same object moved far outward could exert less control over a much larger
        orbital region. To a dynamicist, that dependence is information rather than
        a defect. This model treats the system-wide consequences of mass as central
        evidence instead of background information.'
  - id: p10
    illustration: p10
    blocks:
    - id: p10-b01
      speaker: narrator
      text: The same strengths create limitations. Resolution B5 explicitly applies
        to bodies orbiting our Sun, so its wording does not directly classify planets
        around other stars. “Nearly round” and “cleared” also require interpretation
        at difficult boundaries. More deeply, orbital dominance describes a relationship,
        not simply the object. Imagine two physically identical worlds placed in different
        orbits. One might dominate a tight inner zone, while the other could remain
        one member of a broad distant belt. Under a dynamical rule, their labels could
        differ even though their rocks, ice, atmosphere, and internal history matched.
        That result may be appropriate for a catalog of system architecture. It may
        be distracting for a geologist comparing landscapes. A definition can be consistent
        and still foreground the wrong variable for a particular investigation. The
        limitation appears only after the user asks a question that the relationship-based
        label was not built to answer.
  - id: p11
    illustration: p11
    blocks:
    - id: p11-b01
      speaker: narrator
      text: A geophysical alternative begins from the body itself. In a 2017 conference
        proposal, Kirby Runyon, Alan Stern, and colleagues defined a planet as a sub-stellar-mass
        body that never underwent nuclear fusion and whose self-gravity made it spheroidal,
        regardless of its orbital parameters. In simpler terms, the boundary emphasizes
        worlds rounded by their own gravity rather than the paths they occupy. Pluto
        qualifies. So do Ceres and several large moons, including Earth's Moon, under
        the proposal's logic. Supporters argue that this grouping fits the work of
        planetary geoscience. A researcher comparing crusts, atmospheres, oceans,
        volcanoes, or internal layers may learn more from the physics of a rounded
        body than from whether it circles a star or another planet. Its boundary is
        therefore intrinsic in purpose, even though deciding whether a body is spheroidal
        still requires observations.
  - id: p12
    illustration: p12
    blocks:
    - id: p12-b01
      speaker: narrator
      text: 'The geophysical model makes another value visible: a moon can be both
        dynamically subordinate and geologically complex. Titan has an atmosphere
        and methane weather; Europa may conceal an ocean; Earth''s Moon records differentiation,
        volcanism, and impacts. Calling such bodies “satellite planets” would permit
        comparisons that the IAU''s top-level categories separate. The model also
        extends naturally to free-floating worlds and bodies around other stars because
        it does not require orbiting our Sun. Yet its inclusiveness is not a free
        victory. Runyon and colleagues estimated that their definition would yield
        at least about 110 known planets in the Solar System, with the number rising
        as discoveries continue. A large category can reveal physical kinship, but
        it cannot preserve the familiar role of “planet” as a short list of dominant
        system members. The proposal changes the hierarchy: moon describes an orbit,
        while planet describes the kind of rounded body.'
  - id: p13
    illustration: p13
    blocks:
    - id: p13-b01
      speaker: narrator
      content:
      - text: 'The choice presents a scientific '
      - vocabulary:
          id: tradeoff
          text: tradeoff
      - text: " between a compact map of orbital architecture and a broad comparison
          of geophysically similar worlds. A narrow dynamical definition compresses the Solar System's architecture
          but separates bodies with comparable geophysics. A broad geophysical definition
          joins rounded worlds but produces a long inventory and treats some moons
          as planets. Neither consequence is a hidden mistake; each follows from the
          question selected. Trouble arises when compactness is treated as a law of
          nature, or when geological richness is treated as sufficient proof that
          one familiar noun must apply. Scientific categories often do more than report
          resemblance. They coordinate measurement, communication, education, and
          research. Those purposes can pull in different directions. The honest comparison
          therefore asks not only “Which definition includes Pluto?” but “What work
          should this definition perform, and what distinction will it sacrifice?”
          Vocabulary cannot erase that choice, but careful modifiers can prevent either
          model from pretending to be complete."
  - id: p14
    illustration: p14
    blocks:
    - id: p14-b01
      speaker: narrator
      text: Roundness seems like common ground, yet it also carries uncertainty. Self-gravity
        can overcome a body's material strength and move it toward equilibrium, but
        composition, temperature, rotation, and past collisions affect the resulting
        shape. Icy bodies can become rounded at lower masses than rocky ones, and
        a body may retain departures from an ideal equilibrium figure. Observers cannot
        always inspect the interior directly. The IAU anticipated borderline cases
        rather than supplying a universal numerical cutoff. The geophysical proposal
        uses spheroidal shape as its central observable sign, but it too must decide
        how round is round enough and how to treat bodies whose histories froze imperfect
        shapes in place. Shared criteria do not remove judgment; they relocate it
        to measurement and threshold choices. A borderline case is not an embarrassment;
        it shows exactly where measurement and definition must meet.
  - id: p15
    illustration: p15
    blocks:
    - id: p15-b01
      speaker: narrator
      text: Institutional authority adds a second layer. The IAU is internationally
        recognized for astronomical nomenclature and adopted the 2006 Solar System
        definition through its General Assembly. That fact gives the resolution official
        standing within the organization. It does not transform a chosen criterion
        into an observation like Pluto's mass. Critics may use another definition
        in research or teaching, and planetary scientists sometimes use “world” or
        even “planet” informally for bodies outside the IAU category. Conversely,
        disagreement does not erase the value of a common standard. Shared names allow
        catalogs, textbooks, and public communication to remain interoperable. The
        relevant distinction is between authority to standardize usage and authority
        to forbid alternative analytical groupings. Science needs conventions, but
        conventions remain open to criticism about scope and purpose. Official terminology
        gains value through coordination, while alternative terms gain value by revealing
        neglected comparisons.
  - id: p16
    illustration: p16
    blocks:
    - id: p16-b01
      speaker: narrator
      text: 'The 2006 decision is sometimes reduced to a dramatic head count: Pluto
        lost, eight planets won. That frame hides the sequence of proposals and revisions
        during the meeting, as well as later objections. It also encourages a weak
        argument from participation—if only a fraction of eligible members voted,
        perhaps the physical conclusion is false. Voting procedures can be criticized
        as institutional design, but the number of voters does not determine Pluto''s
        orbit or geology. Likewise, a large petition cannot by itself settle which
        criterion best serves a research question. Procedural legitimacy and scientific
        utility are connected but distinct. A stronger critique examines whether the
        adopted words are operational, generalizable, and aligned with the tasks for
        which people use them. The history of the meeting is relevant to governance,
        whereas the performance of the criterion requires separate evidence.'
  - id: p17
    illustration: p17
    blocks:
    - id: p17-b01
      speaker: narrator
      text: New Horizons complicates the argument without acting as a referee. The
        spacecraft launched in January 2006, before the August vote, and flew past
        Pluto on 14 July 2015. Its instruments mapped terrain, studied composition
        and temperature, searched for activity, and examined Pluto's atmosphere and
        moons. The images replaced a blurred disk with a world of towering water-ice
        mountains, broad nitrogen-ice plains, layered haze, and surfaces of strikingly
        different ages. Scientists found evidence that volatile ices flow and that
        parts of Sputnik Planitia are geologically young. These observations made
        Pluto far more physically varied than many people had imagined. They also
        strengthened the case for comparing Pluto with active planetary bodies rather
        than treating it as mere debris. The flyby converted distant hints into measurements
        detailed enough to support new geological and atmospheric models.
  - id: p18
    illustration: p18
    blocks:
    - id: p18-b01
      speaker: narrator
      text: 'But geological complexity is not one of Resolution B5''s disputed conditions.
        The IAU definition already accepts that Pluto is nearly round; the disagreement
        concerns its orbital neighbourhood and the role of satellites. New Horizons
        did not make Pluto dynamically dominant in the Kuiper Belt. Therefore the
        mission cannot logically refute the adopted criterion simply by revealing
        glaciers or haze. Nor does the criterion make the discoveries irrelevant.
        It answers a different question. This is a useful test of reasoning: evidence
        may transform our understanding of an object without bearing directly on every
        label attached to it. To decide whether new evidence changes a classification,
        one must identify which property the classification uses and whether the evidence
        changes that property. The relevant question is not whether the pictures feel
        planetary, but whether they measure the selected boundary property.'
  - id: p19
    illustration: p19
    blocks:
    - id: p19-b01
      speaker: narrator
      text: The reverse error is equally tempting. Because Pluto fails a dynamical
        threshold, one might assume its geology is less planet-like or its exploration
        less important. No such conclusion follows. Classification can guide attention,
        but it can also distort it when a top-level label is mistaken for a ranking
        of worth. The Kuiper Belt preserves evidence about the early Solar System,
        and Pluto offers accessible examples of volatile transport, atmosphere–surface
        exchange, tectonics, and glacial flow under conditions unlike Earth's. A dwarf
        planet is not a failed planet in every scientific sense. It is a member of
        a category defined by particular criteria. The adjective describes placement
        within a scheme; it does not measure how many questions the world can answer.
        Mission value can even increase because an unusual category marks conditions
        not represented among the eight dominant planets.
  - id: p20
    illustration: p20
    blocks:
    - id: p20-b01
      speaker: narrator
      text: 'Eris provides another check against reasoning by affection. Many people
        knew Pluto from childhood and experienced reclassification as a loss. Eris
        lacked that cultural history. Yet a rule designed only to keep Pluto while
        excluding a comparable newcomer would be difficult to defend. The discovery
        forced symmetry: either the boundary had to expand according to stated physical
        properties, or it had to distinguish orbital roles in a consistent way. The
        IAU chose the second path. A geophysical definition chooses the first and
        accepts a much larger family. Both responses are more coherent than preserving
        a list because its length is familiar. Emotional attachment explains why the
        debate mattered publicly, but it cannot substitute for a criterion. Eris removes
        a special exception and makes each framework accept the full consequence of
        its own stated principle.'
  - id: p21
    illustration: p21
    blocks:
    - id: p21-b01
      speaker: narrator
      text: 'Exoplanets expose the IAU wording''s restricted scope. Many confirmed
        worlds are known around other stars, yet Resolution B5 begins with orbit around
        “the Sun.” Astronomers routinely call those bodies planets under other working
        definitions. Margot''s quantitative dynamical approach offers one route outward:
        with estimates of stellar mass, body mass, and orbital period, researchers
        can ask whether a body can clear its zone within a defined time. This preserves
        the architectural insight while replacing a Solar-System-only phrase with
        measurable variables. Still, many exoplanet measurements remain incomplete,
        and formation history can be uncertain. Generalization requires more than
        exchanging one noun. It requires stating the time scale, threshold, data needs,
        and objects to which the rule applies. The revised method is an example of
        scientific criticism improving operational clarity without simply restoring
        the old list.'
  - id: p22
    illustration: p22
    blocks:
    - id: p22-b01
      speaker: narrator
      text: 'A layered taxonomy can retain both insights. At one level, researchers
        may distinguish bodies that dominate star-centered orbital zones from bodies
        embedded in belts. A second level can group rounded worlds by composition
        and atmosphere. It can also compare internal structure or geological activity.
        Moons can keep their dynamical identity while joining geophysical comparisons.
        Under such a system, Pluto does not need one label to carry every fact: it
        can be a dwarf planet in the IAU scheme. By location it is a trans-Neptunian
        object and Kuiper Belt member. In a geophysical discussion it can be a planetary
        world. Multiple labels become confusing only when their criteria are hidden
        or their scopes are treated as interchangeable. Each label remains informative
        when a reader knows its criterion, scale, and intended comparison.'
  - id: p23
    illustration: p23
    blocks:
    - id: p23-b01
      speaker: narrator
      text: 'Layering does not make every definition equally good. A useful scientific
        category should produce reasonably consistent decisions, connect to significant
        patterns, and disclose difficult edge cases. It should also be economical
        enough for its purpose. A rule that changes whenever a beloved object approaches
        the boundary is unstable. A rule so broad that it erases the contrast under
        study is unhelpful. A rule that cannot be measured hides disagreement behind
        formal language. Evaluating a definition therefore resembles evaluating a
        model: ask what observations it organizes, what predictions or comparisons
        it enables, where it breaks down, and what additional categories repair the
        loss. The answer may differ between orbital dynamics, comparative geology,
        mission planning, and introductory education. Edge cases should prompt better
        measurements or explicit uncertainty rather than a hidden exception for convenience.'
  - id: p24
    illustration: p24
    blocks:
    - id: p24-b01
      speaker: narrator
      text: 'Education makes the choice visible. An eight-planet sequence is memorable
        and gives students a first map of the Solar System''s large-scale architecture.
        If that sequence becomes the whole lesson, however, students may miss belts,
        dwarf planets, and physically complex moons. A list of more than one hundred
        rounded worlds avoids that exclusion but overwhelms memorization and blurs
        major dynamical roles. The better response is not to demand a single perfect
        list. Students can learn a small architectural backbone, then examine families
        that cross it: rocky bodies, giant planets, icy worlds, satellites, belt members,
        and geologically active surfaces. Pluto becomes a case for asking how categories
        are built, not a trivia question with a wounded hero and a villainous committee.
        This approach replaces memorizing every member with understanding several
        structures that overlap without becoming identical.'
  - id: p25
    illustration: p25
    blocks:
    - id: p25-b01
      speaker: narrator
      text: 'What, then, was redefined? Pluto''s mass, orbit, ice, and moons continued
        as before. The IAU redefined the boundary of an institutional category, responding
        to a larger inventory of known bodies. The choice produced a compact dynamical
        architecture and a repeatable contrast that later quantitative work sharpened.
        In exchange, it sacrificed some alignment with the object-centered comparisons central to planetary
        geoscience and left its Solar-System-only wording difficult to export. The
        geophysical alternative restores that alignment and wider scope, but accepts
        many planets and weaker emphasis on orbital organization. A qualified judgment
        can recognize all of these consequences without pretending that the models
        are identical or that one must govern every scientific sentence. The synthesis
        is functional, not evasive: it assigns different jobs to distinctions supported
        by different evidence.'
  - id: p26
    illustration: p26
    blocks:
    - id: p26-b01
      speaker: narrator
      text: 'New Horizons is now far beyond Pluto, but its archive continues to test
        explanations of that world. Meanwhile, surveys keep enlarging the census beyond
        Neptune and around other stars. Future evidence may refine thresholds, reveal
        new borderline bodies, or motivate a revised standard. The durable lesson
        is methodological rather than ceremonial: before arguing over a label, identify
        the selected property, the intended task, and the excluded cases. For Solar
        System architecture, the IAU''s dynamical boundary remains an official and
        useful convention. For comparing the intrinsic physics of rounded worlds,
        a geophysical category can reveal relationships that boundary obscures. Pluto
        did not become less real in 2006 or more real in 2015. It became a clearer
        demonstration that scientific definitions are instruments, and instruments
        must be matched to the work they are asked to do. As the inventory grows,
        transparent definitions will matter more than preserving any historically
        comfortable total.'
