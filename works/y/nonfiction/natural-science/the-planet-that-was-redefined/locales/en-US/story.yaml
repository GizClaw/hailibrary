questions:
- id: q01
  type: short-answer
  speaker: narrator
  prompt: What changed in 2006, and what did not change?
  answer: The IAU changed Pluto's institutional classification; Pluto's physical properties
    and orbit did not change.
  page_refs:
  - p01
  - p25
- id: q02
  type: evidence
  speaker: narrator
  prompt: Why did Eris make the inherited nine-planet list difficult to defend?
  answer: Eris was comparable in size to Pluto, so including Pluto while excluding
    Eris required an unstated or inconsistent boundary.
  page_refs:
  - p04
  - p20
- id: q03
  type: short-answer
  speaker: narrator
  prompt: What three conditions does Resolution B5 give for a Solar System planet?
  answer: It must orbit the Sun, be nearly round through self-gravity, and have cleared
    its orbital neighbourhood.
  page_refs:
  - p06
- id: q04
  type: evidence
  speaker: narrator
  prompt: Why does orbital clearing not mean a perfectly empty path?
  answer: Earth still meets asteroids and Jupiter shares its orbit with Trojans; clearing
    means long-term dynamical dominance over an orbital zone.
  page_refs:
  - p07
- id: q05
  type: source-analysis
  speaker: narrator
  prompt: What does Margot's quantitative criterion add to the IAU wording?
  answer: It turns orbital clearing into a reproducible calculation using measured
    mass, orbit, stellar mass, and a stated time scale.
  page_refs:
  - p08
  - p21
- id: q06
  type: compare
  speaker: narrator
  prompt: How do dynamical and geophysical definitions select different evidence?
  answer: The dynamical definition emphasizes a body's relationship with its orbital
    zone; the geophysical definition emphasizes intrinsic mass, shape, and physical
    character.
  page_refs:
  - p09
  - p10
  - p11
  - p12
- id: q07
  type: evaluate
  speaker: narrator
  prompt: What is one gain and one cost of the geophysical definition?
  answer: It groups physically comparable rounded worlds, including complex moons,
    but creates a category of at least about one hundred ten known Solar System planets.
  page_refs:
  - p11
  - p12
  - p13
- id: q08
  type: evaluate
  speaker: narrator
  prompt: Why does the IAU's authority not end scientific disagreement?
  answer: The IAU can standardize official usage, while researchers may still criticize
    the criterion or use other analytical groupings for different questions.
  page_refs:
  - p15
  - p16
- id: q09
  type: evidence
  speaker: narrator
  prompt: What did New Horizons reveal about Pluto?
  answer: It revealed mountains, flowing nitrogen-rich ice, layered haze, varied terrain
    ages, and other evidence of a complex active world.
  page_refs:
  - p17
- id: q10
  type: source-analysis
  speaker: narrator
  prompt: Why do New Horizons discoveries not by themselves refute Resolution B5?
  answer: The disputed IAU condition concerns orbital dominance, and the mission's
    geological observations did not change Pluto's dynamical role in the Kuiper Belt.
  page_refs:
  - p18
  - p19
- id: q11
  type: synthesis
  speaker: narrator
  prompt: Design a layered description of Pluto that preserves both models' useful
    distinctions.
  answer: Describe Pluto as an IAU dwarf planet and trans-Neptunian Kuiper Belt member
    for orbital architecture, while also treating it as a rounded planetary world
    for geophysical comparison.
  page_refs:
  - p22
  - p23
  - p25
- id: q12
  type: research-response
  speaker: narrator
  prompt: A newly found round body orbits far beyond Neptune. What evidence would
    you gather before classifying it under both models?
  answer: Measure its orbit, mass, stellar context, and capacity for orbital dominance,
    then investigate its shape, composition, and evidence that self-gravity controls
    its form; state uncertainties and the scope of each result.
  page_refs:
  - p14
  - p21
  - p23
  - p26
language: en-US
