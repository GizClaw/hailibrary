shared_by_all_locales: true
assets:
  - {id: cover, file: artwork/cover.webp, scene: In a rain-dark municipal archive lobby, Lena stands between a gray crate of legal ledgers, a red basket of bundled family letters, and a wide flat drawer holding an old painted river map while shallow water glints beyond the basement door; Inez, Malik, and Rosa wait behind her.}
  - {id: p01, file: artwork/p01.webp, scene: Lena in the basement notices gritty water and a leaf sliding under the loading door while she lifts a plain archive box onto a cart; three shelving bays and a flat map cabinet stand nearby.}
  - {id: p02, file: artwork/p02.webp, scene: Lena retreats up the east stairs from shallow water and a glowing red electrical hazard light, looking back toward the flat map cabinet without approaching it.}
  - {id: p03, file: artwork/p03.webp, scene: In the dry lobby, Inez leads Lena, Malik, and Rosa around a folding table while firefighters work beyond the safely closed basement doorway.}
  - {id: p04, file: artwork/p04.webp, scene: The team opens a disaster-supply cabinet containing plain crates, blank tags, absorbent sheets, gloves, and battery lamps while Lena begins an unmarked movement register.}
  - {id: p05, file: artwork/p05.webp, scene: From the dry basement threshold, Lena assesses damp permit ledgers, water-stained letter boxes, and a dripping seam above the flat map cabinet without touching wet paper.}
  - {id: p06, file: artwork/p06.webp, scene: Lena faces a blank grid on a white board while Malik watches the gray legal crate, Rosa watches bundled letters in her red basket, and Inez studies the whole arrangement.}
  - {id: p07, file: artwork/p07.webp, scene: Malik opens a plain reference binder and points to one gray appeal box while explaining its immediate importance to Lena.}
  - {id: p08, file: artwork/p08.webp, scene: Rosa shows Lena an ordered chain of wordless envelopes from her woven red basket, keeping the bundles and envelopes in sequence.}
  - {id: p09, file: artwork/p09.webp, scene: Lena opens the flat cabinet only slightly and observes a wet curling corner of the old painted river map with raised seal and cloth backing.}
  - {id: p10, file: artwork/p10.webp, scene: Inez draws one decisive line through a blank score column on the white board as Lena, Malik, and Rosa confront the rising water mark on letter boxes nearby.}
  - {id: p11, file: artwork/p11.webp, scene: Lena erases three ranking arrows and redraws a broader blank decision grid while the wide map tray, gray permit crate, and many letter boxes reveal different handling demands.}
  - {id: p12, file: artwork/p12.webp, scene: Lena holds a phone for a remote conservator while comparing ordinary wet paper prepared for crates with the layered map kept flat and untouched.}
  - {id: p13, file: artwork/p13.webp, scene: Inez and Lena examine the blank decision grid beside examples of duplicate film, donor agreements, damp boxes, and limited drying tables.}
  - {id: p14, file: artwork/p14.webp, scene: Malik returns with reels of duplicate microfilm and points out one distinct gray box of recent signed appeal papers to Lena.}
  - {id: p15, file: artwork/p15.webp, scene: Malik and Lena carry the gray appeal box and two index volumes toward the upstairs route while other damp permit boxes wait in organized freezer crates.}
  - {id: p16, file: artwork/p16.webp, scene: Rosa sorts letter boxes into groups beside a plain donor binder while Lena speaks by phone and keeps each bundle attached to its box.}
  - {id: p17, file: artwork/p17.webp, scene: Lena and Inez carefully raise the entire flat map cabinet on stable blocks beneath a drip shield while the map stays supported inside its level drawer.}
  - {id: p18, file: artwork/p18.webp, scene: Rosa demonstrates the relationship among ordered bundles, envelopes, and donor notes while Lena records folder ranges on separate blank tags.}
  - {id: p19, file: artwork/p19.webp, scene: Rosa calmly moves duplicate typed letters toward a freezer crate and protects a unique bundle of handwritten replies with forwarding marks kept in order.}
  - {id: p20, file: artwork/p20.webp, scene: The expanded team forms a safe work line from basement assessment to stairway logging, lobby packing, and a bright classroom filled with drying screens.}
  - {id: p21, file: artwork/p21.webp, scene: Lena presents a branching blank decision grid to Inez, with separate visual routes toward the appeal box, specialist map tray, freezer crates, and drying screens.}
  - {id: p22, file: artwork/p22.webp, scene: Malik escorts legal files, Rosa supervises ordered letters, Lena checks crate tags, and Inez coordinates the workflow while the map remains flat under its drip shield.}
  - {id: p23, file: artwork/p23.webp, scene: At a partly filled freezer truck, Lena explains the last crate choices to the driver while damp glossy newsletters and ordinary wet paper remain in separate labeled-looking but wordless crates.}
  - {id: p24, file: artwork/p24.webp, scene: A conservator examines the flat map corner with a magnifier as Lena photographs its condition and Inez prepares a rigid level transport tray.}
  - {id: p25, file: artwork/p25.webp, scene: In late-afternoon light, Lena records warped edges and one blurred-ink letter among organized drying screens while empty lower basement shelves show the flood line.}
  - {id: p26, file: artwork/p26.webp, scene: Three weeks later upstairs, Lena shelves the dry gray appeal box beside a blank revised form while Rosa checks ordered letters and the preserved old decision sheet remains in a plain folder.}
