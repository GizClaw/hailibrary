schema_version: 1
required: true
reason: The fictional emergency and characters rely on real archival disaster-response, wet-paper stabilization, vital-records, documentation, and salvage-priority practices.
sources:
  - id: nara-wet-records
    title: Wet Records
    organization: National Archives and Records Administration
    url: https://www.archives.gov/preservation/holdings-maintenance/wet-records
    accessed: 2026-09-13
    supports:
      - Small quantities of wet paper may be air dried in a cool, dry place with air circulation.
      - Quantities that cannot be handled within the first forty-eight hours may be frozen or referred to a preservation professional.
      - High heat and harsh sunlight can permanently damage records, and some materials are exceptions to ordinary freezing guidance.
  - id: loc-response
    title: Response - Collection Emergency Management for Preservation
    organization: Library of Congress
    url: https://guides.loc.gov/collection_emergency_management/response
    accessed: 2026-09-13
    supports:
      - Human and facility safety precede collection salvage, and reentry must wait for clearance.
      - Initial response proceeds through assessment, an incident-specific plan, triage, and stabilization.
      - Mold can begin within roughly forty-eight to ninety-six hours after collections become wet.
      - Tracking item identity and movement is part of a methodical response.
  - id: loc-freezing
    title: How to Freeze Collections
    organization: Library of Congress
    url: https://guides.loc.gov/wet-collections/freezing
    accessed: 2026-09-13
    supports:
      - Freezing can halt continuing water damage and mold growth while resources for drying are arranged.
      - Ordinary paper and books can often be frozen, but layered or mixed-media objects such as varnished or mounted maps require different judgment.
  - id: nara-vital-records
    title: Essential Records Guide
    organization: National Archives and Records Administration
    url: https://www.archives.gov/records-mgmt/essential-records/essential-records-guide
    accessed: 2026-09-13
    supports:
      - Essential records include records needed to protect the legal and financial rights of government and people affected by government activities.
      - Records disaster mitigation and recovery plans assign responsibility, assess and document damage, identify salvage options, consult recovery specialists, and expedite stabilization.
      - Duplication, dispersal, and off-site storage can protect essential records, so legal importance does not by itself prove that one physical copy is irreplaceable.
  - id: cci-salvage-priorities
    title: Worksheet 7 - Salvage Priorities Questionnaire
    organization: Canadian Conservation Institute
    url: https://www.canada.ca/en/conservation-institute/services/preventive-conservation/response-planning-heritage-institutions/emergency-response-planning-worksheets/ws-7.html
    accessed: 2026-09-13
    supports:
      - Salvage priorities may consider historic, artistic, scientific, social, cultural, spiritual, research, legal, and institutional significance.
      - Provenance, context, rarity, replaceability, condition, ownership, and difficulty of salvage can change an object's priority.
      - A scored tool structures judgment but does not eliminate context-dependent decisions.
  - id: ica-disaster-plan
    title: Developing a Disaster Recovery Plan
    organization: International Council on Archives
    url: https://www.ica.org/app/uploads/2024/01/guideline22-developingadisasterrecoveryplan_tcm50-103143.pdf
    accessed: 2026-09-13
    supports:
      - Recovery teams should classify damaged materials by urgency, treatment needs, stability, and salvageability.
      - Time, money, resources, collection priorities, and specialist needs affect salvage decisions.
      - Documentation of item movement, treatment, and position is a critical recovery task.
  - id: nara-family-papers
    title: Emergency Salvage of Flood-Damaged Family Papers
    organization: National Archives and Records Administration
    url: https://www.archives.gov/preservation/conservation/flood-damage.html
    accessed: 2026-09-13
    supports:
      - Wet family documents that cannot be air dried promptly may be frozen to inhibit mold, subject to media-specific exceptions.
      - Clean absorbent material and circulating air support air drying; direct harsh airflow is avoided.
      - Highly valued or technically uncertain photographs and documents should be referred to a conservator.
