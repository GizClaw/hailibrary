  - id: p16
    illustration: p16
    blocks:
    - id: p16-b01
      speaker: narrator
      text: 'Rosa’s donor index produced a second revision. Twelve Vale boxes held
        photocopies of letters whose originals belonged to another library. Seven
        contained newsletters duplicated in local collections. The remaining boxes
        held original correspondence, but their agreements differed: some were gifts,
        some long-term deposits, and one family retained approval rights for major
        treatment. Usage statistics had flattened these distinctions. An unopened
        box requested zero times might contain the only evidence of a relationship
        not yet described. Conversely, rarity alone could not authorize the archive
        to ignore an owner’s conditions. Lena called the family contact while Rosa
        grouped boxes by agreement and condition. Permission arrived to freeze the
        deposited ordinary papers if air-drying capacity ran out, provided the archive
        recorded each box’s movement. The family did not ask to move its papers ahead
        of everyone else. It asked that the papers remain connected to their writers’
        identities and original order.'
  - id: p17
    illustration: p17
    blocks:
    - id: p17-b01
      speaker: narrator
      content:
      - text: 'The map demanded a different kind of '
      - vocabulary:
