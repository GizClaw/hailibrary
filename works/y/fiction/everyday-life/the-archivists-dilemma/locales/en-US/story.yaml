          corner and asked whether the colors were bleeding. Lena saw no moving pigment,
          only a dark tide line. The specialist instructed them to leave the map supported
          in its drawer, raise the entire cabinet on stable blocks, reduce the drip
          above it, and keep the room cool until a trained team arrived. Its celebrity
          did not justify an improvised treatment. Nor did waiting mean neglect. The
          cabinet could be made safer in place while four people worked elsewhere.
          Lena recorded the uncertainty about the varnish instead of guessing its
          composition from appearance."
  - id: p18
    illustration: p18
