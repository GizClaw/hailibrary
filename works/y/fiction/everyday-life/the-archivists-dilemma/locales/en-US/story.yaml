        with a next action, not an excuse to call everything priceless."
  - id: p20
    illustration: p20
    blocks:
    - id: p20-b01
      speaker: narrator
      text: 'At ten fifteen, a school custodian offered another classroom and six
        drying screens. That practical change altered the ethical calculation. The
        team could now air-dry more unique letters without abandoning the freezer
        schedule for the bulk boxes. Inez called two trained volunteers from the museum,
        while Lena redesigned the work line: assessment at the basement door, logging
        on the stairs landing, packing in the lobby, and drying uphill. Clean hands
        handled dry labels; gloved hands handled wet boxes. Nobody worked alone. The
        arrangement was less dramatic than selecting a single winner, yet it created
        capacity where the first list had assumed scarcity was fixed. Lena realized
        that triage did not merely distribute loss. Sometimes it asked whether a constraint
        could be changed safely. The answer depended on real tables, people, transport,
        and time—not optimism.'
  - id: p21
    illustration: p21
    blocks:
    - id: p21-b01
      speaker: narrator
      content:
      - text: 'Lena replaced the ranked list with a decision grid. First came human
          safety and control of the water source. Next came records whose delay threatened
          immediate rights and whose information had no usable copy. A separate route
          covered materially vulnerable objects needing specialist care. Another route
          covered bulk wet paper suitable for freezing when prompt drying was impossible.
          Within each route, uniqueness, ownership, condition, context, and available
          labor shaped the order. The word '
      - vocabulary:
          id: irreplaceable
          text: irreplaceable
      - text: " remained, but Lena stopped treating it as self-explanatory. The map
          was physically irreplaceable; the appeal statements were functionally irreplaceable
          for current hearings; the ordered letters were evidentially irreplaceable
          where no duplicates survived. These were related claims, not identical ones.
          Inez approved the grid and wrote the review time at the top: eleven o’clock,
          after the next condition report."
  - id: p22
    illustration: p22
    blocks:
    - id: p22-b01
      speaker: narrator
      text: The work accelerated because each person knew both the action and its
        reason. Malik escorted the appeal records and indexes uphill, preserving custody
        and access. Rosa supervised the letter sequence and donor conditions. Lena
        checked wetness, crate numbers, and treatment routes. Inez coordinated the
        freezer truck, facilities crew, and conservator. They did not separate stuck
        sheets, scrub mud from wet fibers, or aim hot air at the paper. Slightly damp
        originals occupied the drying screens with space for circulation. Saturated
        ordinary paper drained briefly, stayed in small labeled groups, and went into
        lined crates for freezing. The mounted map remained flat in its raised cabinet
        beneath a temporary shield that redirected the remaining drip without touching
        the surface. Every movement entered the register before the next crate left
        the lobby.
  - id: p23
    illustration: p23
    blocks:
    - id: p23-b01
      speaker: narrator
      text: At noon, the freezer driver reported room for forty crates, ten fewer
        than promised. The old ranked list would have forced an argument over collections
        again. The grid exposed narrower choices. They reserved space for saturated
        permit volumes and duplicate letter files that could not be air-dried within
        the available time. Unique, slightly damp letter bundles stayed on screens.
        A wet box containing glossy neighborhood newsletters moved ahead of drier
        originals because coated pages could stick together as they dried. The driver
        questioned why “duplicates” deserved scarce freezer space. Lena explained
        that replaceability affected significance, while wetness and material affected
        the immediate treatment. A lower long-term priority could still require faster
        stabilization. The distinction sounded technical, but it prevented the team
        from using one moral ranking for two different decisions.
  - id: p24
    illustration: p24
    blocks:
    - id: p24-b01
      speaker: narrator
      text: An off-site appointment was canceled that morning, so the conservator
        arrived at one thirty and found the map cabinet stable.
        Under magnification, she could not yet identify the varnish with confidence.
        She praised the team for not freezing, rolling, or blotting the layered object.
        The wet corner might flatten after controlled treatment, or the old adhesive
        might fail further; neither outcome was guaranteed. She and Inez prepared
        the tray for level transport to a conservation lab. Before it left, Lena photographed
        its condition and recorded every handler. The map received expert attention,
        but it did not consume the morning’s entire labor. Nearby, more than fifty
        boxes of letters and permit records had already entered the drying rooms or
        the freezer route appropriate to their condition and material. The successful
        choice was not “save the map.” It was to match one vulnerable object with
        one qualified response without blocking the other records’ treatment.
  - id: p25
    illustration: p25
    blocks:
    - id: p25-b01
      speaker: narrator
      text: 'By late afternoon, the basement shelves stood empty below the new flood
        line. Some paper edges had warped. One letter’s ink had feathered before the
        team reached it, and nobody knew whether later treatment would recover the
        obscured words. The off-site permit images still needed comparison with their
        originals. The map’s backing remained uncertain. Lena entered these losses
        and risks instead of writing “saved.” She also recorded what the plan had
        not resolved: how the city should weigh private memory against public administration
        before the next disaster, who should fund duplicate storage, and which donors
        should help design priorities. Emergency action had produced a defensible
        temporary order, not a universal scale of value. Inez scheduled a public review
        of the plan, including residents whose records and histories were represented.'
  - id: p26
    illustration: p26
    blocks:
    - id: p26-b01
      speaker: narrator
      text: 'Three weeks later, Lena returned the dried appeal box to a clean shelf
        upstairs. The shelf stood well above the basement flood line, but Lena still
        checked the new room’s drainage route before setting down the box. Malik had
        used one statement at a rescheduled hearing. Rosa was checking the order of
        the Vale bundles against donor notes, and the conservator reported that the
        map was stable enough for further examination. None of those results proved
        that Lena’s first ranking had been foolish; it had captured real values with
        incomplete evidence. The danger lay in mistaking it for a final answer. Lena
        slid the old score sheet into the emergency-plan file beside the revised grid
        and the movement register. She did not destroy the sheet, because future staff
        needed to see why the method changed. At the public review, residents could
        challenge the questions, supply missing knowledge, and identify consequences
        the staff had overlooked. Their participation would not make later choices
        painless, but it would widen the evidence and distribute responsibility before
        the next alarm. Then Lena placed three empty columns on the next review form:
        evidence missing, person to consult, and time to reconsider. The river had
        receded, but the archive’s decisions would remain open to correction.'
