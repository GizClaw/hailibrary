    - id: p19-b03
      speaker: narrator
      text: " She moved the folder into the freezer group and pointed to a bundle
        of handwritten replies whose envelopes carried forwarding marks from three
        cities. No copies appeared in either catalog. Lena appreciated the concession
        because it strengthened, rather than weakened, Rosa’s wider argument. Community
