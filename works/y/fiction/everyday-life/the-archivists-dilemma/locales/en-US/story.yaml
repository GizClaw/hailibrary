  - id: p11
    illustration: p11
    blocks:
    - id: p11-b01
      speaker: narrator
      text: 'Lena proposed moving the map first, then the permit books, then as many
        letters as time allowed. Her reasoning sounded defensible: uniqueness first,
        active legal use second, lower use last. Rosa asked what “as many” meant.
        Four volunteers could carry perhaps sixty small boxes before noon, but the
        Vale papers filled ninety-two. Choosing the map’s wide tray required two people
        and blocked the narrow stairs for several trips. Malik asked whether the plan
        treated the permit series as a single object even though recent appeals mattered
        differently from century-old duplicates. Inez asked what treatment awaited
        each item upstairs. Lena had ranked significance without ranking feasible
        actions. A thing could be precious and still be harmed by the rescue method
        chosen for it. She erased the arrows and began a second chart: condition,
        material, volume, duplicate, owner, treatment, time.'
  - id: p12
    illustration: p12
    blocks:
    - id: p12-b01
      speaker: narrator
      text: 'The emergency guidance offered useful verbs—drain, air-dry, pack, freeze,
        isolate—but each verb came with conditions. Small amounts of ordinary damp
        paper could be spread on absorbent surfaces in cool moving air. Large quantities
        that could not be dried promptly could often be frozen to pause further damage
        and buy time. The conservator warned that freezing was stabilization, not
        a cure. She also stopped Lena from applying the rule to everything. The map
        combined paper, varnish, cloth, and an old adhesive. Layers might separate
        or react differently. '
    - id: p12-b02
      speaker: conservator
      text: Keep the drawer level, do not stack anything on it, and wait for a specialist
        plan,
    - id: p12-b03
      speaker: narrator
      text: " she said. Lena wrote MAP—NO GENERAL FREEZER in her notebook, then read
        the instruction back to confirm it. A broad rule had saved time only until
        the material stopped being ordinary."
  - id: p13
    illustration: p13
    blocks:
    - id: p13-b01
      speaker: narrator
      text: Inez asked the team to test the old list against four questions. What
        harm would delay cause? What information or physical evidence existed elsewhere?
        Who had authority or responsibility for the material? What treatment could
        they actually provide today? The list changed before anyone lifted another
        box. Wetness pushed some low-use letters upward because mold risk did not
        wait for popularity. A digital image lowered the urgency of information access
        but did not replace seals, paper, order, or annotations. Ownership mattered
        because several letter groups were deposits, not gifts; the archive had promised
        to consult their families about destructive treatment. Available space mattered
        because opening a wet box without somewhere to spread its contents could increase
        disorder and damage. The questions did not merge the competing values. They
        forced each value to meet the same emergency.
  - id: p14
    illustration: p14
    blocks:
    - id: p14-b01
      speaker: narrator
      text: 'Malik returned from city hall with unexpected evidence. Most permit ledgers
        had been microfilmed years earlier, and the films were stored in another county.
        Recent scans also existed on an off-site server. The copies were imperfect:
        some marginal notes were pale, and physical bindings could show when pages
        had been inserted. Still, the information required for ordinary claims was
        not confined to the wet basement. One gray appeal box remained different.
        It contained signed statements received during the previous month, including
        records for six families whose hearings had been postponed by the storm. No
        duplicate existed. Lena separated that box from the series in the movement
        register. Legal value had not disappeared; it had become more precise. The
        right question was no longer “permits or letters?” but “which records protect
        rights that no surviving copy can presently protect?”'
  - id: p15
    illustration: p15
