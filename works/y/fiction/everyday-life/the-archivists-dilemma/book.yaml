schema_version: 1
id: the-archivists-dilemma
type: [reading, illustrated-short-story]
style: clay-diorama
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [everyday-life, history]
  themes: [responsibility, cooperation, problem-solving]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close third-person narrator who follows Lena's changing evidence without resolving the ethical conflict for the reader.
    voice_identity: observant, measured, and alert to uncertainty
  - id: lena
    kind: character
    description: A twenty-four-year-old junior municipal archivist facing her first major collections emergency.
    visual_identity: Young Chinese American woman with an oval clay face, short straight black bob, mustard raincoat over a forest-green sweater, navy trousers, red rubber boots, pale blue nitrile gloves, and a small silver key on a cord.
    voice_identity: precise and contained at first, then candid when evidence unsettles her plan
  - id: inez
    kind: character
    description: The archive director, experienced in public records and careful not to confuse authority with certainty.
    visual_identity: Afro-Latina woman in her late fifties with a rounded clay face, silver-streaked dark curls tied low, burgundy waterproof jacket, charcoal trousers, black rubber boots, amber safety glasses, and violet nitrile gloves.
    voice_identity: low, economical, and calm under pressure
  - id: malik
    kind: character
    description: A city clerk who understands how residents use property and hearing records to defend legal and financial rights.
    visual_identity: Black man in his early forties with a narrow clay face, close-cropped hair and beard, cobalt rain shell, tan trousers, green rubber boots, orange work gloves, and a plain gray document crate.
    voice_identity: direct, urgent, and concrete about consequences
  - id: rosa
    kind: character
    description: A retired teacher and volunteer who helped collect neighborhood family papers and knows their donors.
    visual_identity: Elderly Mexican American woman with a round clay face, white braid over one shoulder, teal cardigan beneath a clear rain poncho, plum skirt, yellow rubber boots, cream cotton gloves, and a woven red basket.
    voice_identity: warm and conversational, becoming firm when private lives are treated as decoration
  - id: conservator
    kind: character
    description: A regional paper conservator who advises remotely and later takes responsibility for the layered map.
    visual_identity: White woman in her forties with a long clay face, auburn hair in a low bun, slate-gray work coat, olive trousers, dark blue shoes, clear safety glasses, white nitrile gloves, and a brass-rimmed magnifier.
    voice_identity: technically exact, cautious, and explicit about what remains unknown
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Evaluate archival emergency choices under competing legal, cultural, evidential, and practical values.
    - Distinguish immediate stabilization from a final judgment about long-term importance.
    - Synthesize condition, uniqueness, replaceability, ownership, context, and available treatment into a qualified plan.
  concepts:
    - archival triage
    - vital records and legal rights
    - provenance and original order
    - material-specific stabilization
    - irreplaceability and community value
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
