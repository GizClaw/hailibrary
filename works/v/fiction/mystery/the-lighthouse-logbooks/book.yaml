schema_version: 1
id: the-lighthouse-logbooks
type: [reading, illustrated-short-story]
style: bold-ink-comic
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [mystery, everyday-life]
  themes: [curiosity, fairness, problem-solving, responsibility]
  moods: [mysterious, reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close third-person narrator who follows Nia's archival investigation and carefully separates observation from explanation.
    voice_identity: exact, alert, and quietly suspenseful
  - id: nia
    kind: character
    description: A fifteen-year-old museum volunteer who records audio guides and refuses to repeat a simple accusation once the evidence becomes complicated.
    visual_identity: A fifteen-year-old girl with warm brown skin, a round face, dark eyes, and thick black hair in a high braided ponytail; cyan hooded raincoat over a mustard-yellow sweater, deep-red trousers, black lace-up boots, and a small yellow audio recorder on a plain black strap.
    voice_identity: observant, quick, candid, and increasingly deliberate when evidence resists her
  - id: curator
    kind: character
    description: Mr. Bell, the middle-aged curator of the Beacon Island museum, who gives Nia access to the records without supplying her conclusion.
    visual_identity: A lean middle-aged man with light-brown skin, short salt-and-pepper curls, a narrow mustache, round glasses, a dark teal vest over a cream shirt, charcoal trousers, and red canvas shoes.
    voice_identity: dryly warm, patient, and economical
  - id: orrin
    kind: character
    description: Orrin Hale, the former head keeper whose official red log centers the lamp room and his authority.
    visual_identity: A sturdy older man with deep-brown skin, a square gray beard, close-cropped gray hair, a long mustard oilskin coat, dark teal trousers, black sea boots, and a brass key ring.
    voice_identity: formal, controlled, and defensive of procedure
  - id: maia
    kind: character
    description: Maia Venn, the former assistant keeper whose blue duty book centers the warning signals visible and tangible from the lower bell platform.
    visual_identity: A wiry young woman with pale freckled skin, an angular face, copper hair in a low bun, a deep-red wool coat, cyan scarf, dark skirt over leggings, brown boots, and red work gloves.
    voice_identity: urgent, concrete, and protective of her work
  - id: visitor
    kind: character
    description: A young museum visitor who asks Nia for the clearest possible answer after hearing the new audio guide.
    visual_identity: A ten-year-old boy with tan skin, short wavy dark hair, a mustard-yellow sweatshirt, teal shorts, red sneakers, and a plain cyan backpack.
    voice_identity: curious, direct, and eager for a definite answer
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Compare two first-person sources by position, motive, and limits of observation.
    - Use independent records and physical clues to build and challenge a causal explanation.
    - State a best-supported conclusion without claiming that it proves more than the evidence allows.
  concepts:
    - source position and motive
    - corroboration across independent records
    - counterexamples and competing explanations
    - qualified causal conclusions
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
