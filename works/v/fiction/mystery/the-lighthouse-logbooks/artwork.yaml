schema_version: 1
style: bold-ink-comic
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  nia: A fifteen-year-old girl with warm brown skin, round face, dark eyes, thick black hair in a high braided ponytail, cyan hooded raincoat, mustard-yellow sweater, deep-red trousers, black lace-up boots, and a small yellow audio recorder on a plain black strap.
  curator: A lean middle-aged man with light-brown skin, short salt-and-pepper curls, narrow mustache, round glasses, dark teal vest, cream shirt, charcoal trousers, and red canvas shoes.
  orrin: A sturdy older man with deep-brown skin, square gray beard, close-cropped gray hair, long mustard oilskin coat, dark teal trousers, black sea boots, and a brass key ring.
  maia: A wiry young woman with pale freckled skin, angular face, copper hair in a low bun, deep-red wool coat, cyan scarf, dark skirt over leggings, brown boots, and red work gloves.
  visitor: A ten-year-old boy with tan skin, short wavy dark hair, mustard-yellow sweatshirt, teal shorts, red sneakers, and a plain cyan backpack.
  lighthouse: A fictional cylindrical cream stone tower with a black lantern roof, cyan-tinted outer windows, a red gallery rail, a separate low bell platform, and a dark rocky shore facing a triangular north sandbar.
  records: Orrin's log is a thick closed red leather book with brass corners; Maia's is a smaller closed blue leather book with water-warped edges. Whenever open, pages show only abstract ink-like marks with no legible letters, numbers, or symbols.
  props: Yellow audio recorder, cutaway lighthouse model, heavy mustard canvas rain guard with three plain rope loops and one diagonal tear, bent brass hook, thick tan bell rope with a hidden splice, small red test sandbag, and blank cream exhibit cards.
  palette: Saturated cyan, deep red, mustard yellow, cream, dark teal, and deep ink black, with sparse pale-gray halftone texture.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Nia stands between two large wordless open logbooks on a museum table while the lighthouse rises behind her; Orrin appears inside the glowing lantern room and Maia stands at the lower bell platform, separated by a sweeping diagonal beam and storm clouds.
  - id: p01
    file: artwork/p01.webp
    scene: In the dim museum lighthouse room, Nia holds her yellow recorder near an old blank brass wall plaque while Mr. Bell points toward a low cabinet he has just opened.
  - id: p02
    file: artwork/p02.webp
    scene: Nia places the thick red official log and smaller water-warped blue duty book side by side on a display table, microphone set aside, with the lighthouse model behind them.
  - id: p03
    file: artwork/p03.webp
    scene: Nia studies the open red log as a wordless past-scene silhouette shows Orrin inside the lantern room beside the bright central lamp and rotating glass lens.
  - id: p04
    file: artwork/p04.webp
    scene: Nia studies the open blue log as a wordless past-scene silhouette shows Maia pulling the bell rope on the lower outdoor platform while loose canvas hits the red gallery rail above.
  - id: p05
    file: artwork/p05.webp
    scene: Nia makes a large evidence chart from blank colored cards while a cutaway tower view places Orrin high inside and Maia lower outside, their sight lines blocked by solid tower walls.
  - id: p06
    file: artwork/p06.webp
    scene: Overhead museum-table composition of the two wordless open logs, two clock faces without hands or markings, hail shapes striking a lighthouse model, and Nia linking matching event images with a plain thread.
  - id: p07
    file: artwork/p07.webp
    scene: Nia aligns four repeated clock-check cards and shifts one transparent timeline strip beside the two logs, making matching hail, bell, dark beam, and turning ship icons line up without any text or numbers.
  - id: p08
    file: artwork/p08.webp
    scene: Mr. Bell hands Nia a narrow blank incident slip while a stormy harbor reconstruction shows a distant rescue watcher across the water, two visual bell swings, an absent beam, and a ship beginning to turn.
  - id: p09
    file: artwork/p09.webp
    scene: Nia removes the back of the cutaway lighthouse model and traces the path from a central lamp through the rotating lens toward outer cyan windows as Mr. Bell watches.
  - id: p10
    file: artwork/p10.webp
    scene: Nia compares the red log with a model of the tower's cracked landward outer pane, where a heavy mustard canvas rain guard hangs from two brass hooks and three rope loops.
  - id: p11
    file: artwork/p11.webp
    scene: Split-depth scene with Maia looking up from the stormy bell platform as loose mustard canvas crosses the white beam and strikes the seaward red rail, while Orrin remains behind thick glass inside.
  - id: p12
    file: artwork/p12.webp
    scene: On a museum examination table, Nia studies the salt-stiff mustard canvas with three loops and a diagonal tear beside a brass hook bent toward the sea, using gloved hands.
  - id: p13
    file: artwork/p13.webp
    scene: Nia tests a paper rain-guard shape on the unlit cutaway model; one torn corner swings across the outer seaward windows while leaving the central lamp untouched.
  - id: p14
    file: artwork/p14.webp
    scene: The preserved tan rope remains protected on a padded support in its display while Nia uses a separate full-size replica with a small red sandbag; the replica separates at a hidden old splice behind a wooden guide, with the lower end still in her hand.
  - id: p15
    file: artwork/p15.webp
    scene: Nia kneels within a floor-sized wordless evidence sequence of hail, tower shudder, torn canvas, two bell swings, three blocked beam passes, turning ship, and north sandbar, connected by plain colored strips.
  - id: p16
    file: artwork/p16.webp
    scene: Nia tests three competing wordless models on the table—a dark central lamp, an abandoned bell rope, and a wind-blown canvas—while weighing their matching physical clues with attentive uncertainty.
  - id: p17
    file: artwork/p17.webp
    scene: Nia places plain motive and observation cards beside portrait silhouettes of Orrin and Maia, with each keeper's limited sight line shown through the cutaway tower rather than any written labels.
  - id: p18
    file: artwork/p18.webp
    scene: Nia assembles a clear museum display linking the torn canvas and broken rope to the two logbooks, while a separate empty ship-shaped space shows what the surviving evidence cannot reveal.
  - id: p19
    file: artwork/p19.webp
    scene: Mr. Bell removes the old blank brass plaque from the museum wall while Nia installs a larger blank cream evidence panel between the red and blue logbook cases.
  - id: p20
    file: artwork/p20.webp
    scene: At the reopened exhibit, Nia turns the lighthouse model's paper guard as the young visitor pulls its bell rope; the rope stops at the hidden splice and both wordless logbooks lie open in equal light.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - cover_and_all_twenty_page_images_inspected
      - every_scene_is_wordless_and_matches_the_story
      - recurring_characters_and_palette_are_consistent
      - all_assets_are_compressed_webp_at_required_dimensions
