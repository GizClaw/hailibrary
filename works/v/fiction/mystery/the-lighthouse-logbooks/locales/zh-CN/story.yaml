        - {id: p01-b01, speaker: narrator, text: 灯塔展厅重新开放前，尼娅负责录制语音导览。}
        - {id: p01-b02, speaker: narrator, text: 墙上的铜牌把“多利安星号”搁浅写成了一个简单故事：船靠近北沙洲时，副守塔人玛雅擅离雾钟岗位；主任守塔人奥林虽然保住了灯火，仍没能阻止事故。}
        - {id: p01-b03, speaker: narrator, text: 馆长贝尔先生递给尼娅一块擦布，又指了指铜牌下方的柜子。}
        - {id: p01-b04, speaker: curator, text: 录音以前，把柜子里的材料都读完。}
        - {id: p01-b05, speaker: narrator, text: 尼娅原以为那只是工作提醒，直到她拉开铜牌下方的旧柜门。}
    - id: p02
      illustration: p02
      blocks:
        - {id: p02-b01, speaker: narrator, text: 柜里并排放着两本皮面日志。红色硬皮本属于奥林，页码齐全；蓝色小本属于玛雅，边角被潮气泡得发皱。}
        - {id: p02-b02, speaker: narrator, text: 两人记录的是同一场风暴，却把责任推向不同方向：奥林说雾钟停了，玛雅却说海上的人看不见灯光。}
        - {id: p02-b03, speaker: narrator, text: 更麻烦的是，他们当时守在灯塔的不同位置，谁也无法看清整套警示装置。}
        - {id: p02-b04, speaker: narrator, text: 尼娅收起麦克风，决定先弄明白两份记录为何会冲突。}
    - id: p03
      illustration: p03
      blocks:
        - {id: p03-b01, speaker: narrator, text: 她先把奥林的记录念给贝尔先生听。}
        - {id: p03-b02, speaker: nia, text: 灯火始终稳定，透镜照常转动。玛雅敲钟两下，随后离开岗位。船只改变方向，在北沙洲搁浅。}
        - {id: p03-b03, speaker: narrator, text: 这一页下方还写着，检查员本周刚确认灯室设备合格。奥林的字端正，语气没有迟疑，几乎每句话都围绕自己负责的灯室。}
        - {id: p03-b04, speaker: narrator, text: 他能看见灯芯与透镜，却没有说明光是否顺利穿过外层窗户，照到海上。}
    - id: p04
      illustration: p04
      blocks:
        - {id: p04-b01, speaker: narrator, text: 玛雅的小本写得急促，尼娅继续念。}
        - {id: p04-b02, speaker: nia, text: 白色信号连续三次没有出现。我拉了两下钟绳，绳子突然松掉。一块松开的布拍打外侧栏杆。我跑上楼时，那艘船已经转向。}
        - {id: p04-b03, speaker: narrator, text: 她还提到，自己曾因一次交班迟到受到奥林警告。玛雅想保住工作，奥林想维护刚通过检查的灯室，两人都有为自己辩护的理由。}
        - {id: p04-b04, speaker: narrator, text: 不过，有动机不等于说了谎，尼娅还得分开判断每一条说法。}
    - id: p05
      illustration: p05
      blocks:
        - {id: p05-b01, speaker: narrator, text: 尼娅在纸上画了两栏，又把“真”和“假”两个标题划掉，换成“位置、动机、看不到的地方”。}
        - {id: p05-b02, speaker: narrator, text: 奥林守在内层灯火旁，站得高，却被墙体挡住了朝海一面的外窗。}
        - {id: p05-b03, speaker: narrator, text: 玛雅在下方的雾钟平台工作，能看见射向海面的光，也能感到钟绳的变化，却看不到灯火本身。}
        - {id: p05-b04, speaker: narrator, text: 两人的立场来自各自的位置和职责。正因为如此，每本日志既有别人无法代替的观察，也有明显的空白。}
    - id: p06
      illustration: p06
      blocks:
        - {id: p06-b01, speaker: narrator, text: 两本日志写下的时间相差六分钟，起初像是无法跨过的裂缝。奥林说猛烈的冰雹出现在十一点四十七分，玛雅却写十一点四十一分。}
        - {id: p06-b02, speaker: narrator, text: 尼娅没有急着选一只钟。两本日志都记下了同一组少见的动静：冰雹先打在北窗上，接着塔身一震，楼下储物门随即砰地关上。}
        - {id: p06-b03, speaker: narrator, text: 顺序完全相同，这更像同一件事，而不是两场恰好相似的风暴。}
    - id: p07
      illustration: p07
      blocks:
        - {id: p07-b01, speaker: narrator, text: 她向前翻了几页，找到了时间差的来历。连续四晚，奥林都把灯室钟与港口钟对过一次，并写明灯室钟快六分钟。}
        - {id: p07-b02, speaker: narrator, text: 每一页后面还有同一句安排：等风暴值守结束后再校准。玛雅一直按港口钟记时。}
        - {id: p07-b03, speaker: narrator, text: 尼娅把奥林的时间减去六分钟后，冰雹、两声钟响、三次暗掉的信号和船只转向终于排进同一条时间线。}
        - {id: p07-b04, speaker: narrator, text: 早先的对钟记录与两本日志相互印证，但它只能确定先后，不能解释原因。}
    - id: p08
      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: 贝尔先生又取来救援站当夜的事故单。记录人站在港口另一侧，既不属于灯室，也不属于雾钟平台。}
        - {id: p08-b02, speaker: narrator, text: 他听见两声钟响，随后只剩风声；按平常节奏本该扫过海面的三次白光也没有出现，之后船才转向。}
        - {id: p08-b03, speaker: narrator, text: 这份独立观察支持玛雅所写的现象，却无法证明她提出的解释。距离太远，记录人看不见钟绳是否断开，更看不见灯芯是否熄灭。}
        - {id: p08-b04, speaker: narrator, text: 尼娅开始相信事件的顺序，却仍不急着接受任何一位守塔人对原因的解释。}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: 展柜里有一座可以打开背板的灯塔模型。中央的小灯被转动透镜围住，透镜外面还有一圈外窗。}
        - id: p09-b02
          speaker: narrator
          content:
            - text: 尼娅沿着光线可能经过的方向比画，很快发现奥林的观察存在
            - vocabulary: {id: limitation, text: 局限}
            - text: ：灯芯稳定燃烧，并不保证光能穿过每一扇外窗。
        - {id: p09-b03, speaker: nia, text: 奥林回答的是灯有没有亮，玛雅看到的是朝海的信号有没有出现。}
        - {id: p09-b04, speaker: narrator, text: 馆长点点头，却没有替她决定哪个答案更接近事故原因。}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: 尼娅回到奥林日志，仔细读事故前一页。午后的风暴把一小块石头吹到塔上，朝陆地的一扇外窗因此裂开。}
        - {id: p10-b02, speaker: narrator, text: 新玻璃送到以前，奥林临时在外侧系了一块厚帆布挡雨。他记下两个铜钩和三道绳圈，却没有画图。}
        - {id: p10-b03, speaker: narrator, text: 那块帆布挂在灯室外面，不在他平时检查灯芯时的视线内。}
        - {id: p10-b04, speaker: narrator, text: 因此，后来“灯火稳定”的记录即使准确，也不能说明临时挡雨布始终固定不动。}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: 现在，玛雅所写的“松开的布”有了具体来处。冰雹敲响北窗时，她正好能从雾钟平台抬头看见外廊。}
        - {id: p11-b02, speaker: narrator, text: 小本里说，布边突然抽响，越过白光，撞上朝海一侧的栏杆。雨夜太暗，她未必看得清那是不是奥林系的帆布。}
        - {id: p11-b03, speaker: narrator, text: 灯室里的奥林隔着厚玻璃，又有风声和转动装置的声音，也可能听不见布拍栏杆。}
        - {id: p11-b04, speaker: narrator, text: 两份记录并非在描述两场风暴，而是各自抓住了同一座塔的一部分。}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: 博物馆还保存着一块从旧外廊取下的硬帆布。盐分让它几乎折不动，一角保留三道绳圈，另一边却斜着裂开。}
        - {id: p12-b02, speaker: narrator, text: 旁边的小托盘中放着一只铜钩，钩头朝海的方向弯曲。}
        - id: p12-b03
          speaker: narrator
          content:
            - text: 这些物件无法把风暴重新演一遍，却容许一种有限的
            - vocabulary: {id: inference, text: 推断}
            - text: ：靠陆地的绳圈也许没有松，朝海的一边却可能被风扯开，使帆布扫过外窗，暂时挡住几次转来的光。
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: 尼娅没有在真灯上试验，而是在不亮的模型上放了一张纸片。她把三处固定点留在原位，只移动代表裂口的那个纸角。}
        - {id: p13-b02, speaker: narrator, text: 纸片果然能越过朝海的外窗，却碰不到中央的小灯。透镜每转一圈，向外的光路都会被挡住一段时间。}
        - {id: p13-b03, speaker: narrator, text: 这个小试验不能复制当夜风力，所以不是事故证明；它只说明奥林的“灯火没灭”和玛雅的“信号消失”可以同时成立。}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: 剩下的问题是雾钟。保存下来的钟绳平放在带软垫的托板上。露在外面的下端看起来完好，但旧接头原先藏在木制导向槽后。}
        - {id: p14-b02, speaker: narrator, text: 事故次日的清理记录写明，人们在导向槽下分别找到绳子的两端。文物保护人员没有拉扯原绳，只用放大检查确认旧接头两边留有彼此吻合的磨损纤维。尼娅改用按记录尺寸制作的复制品演示，拉到第二下时，复制接头断开。}
        - id: p14-b03
          speaker: narrator
          content:
            - text: 这个结果构成了一个
            - vocabulary: {id: counterexample, text: 反例}
            - text: ：两声钟响后突然安静，不一定表示玛雅主动停手；藏起来的接头断开，也会造成完全相同的声响顺序。
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: 尼娅把各份记录的复制件按时间顺序铺在地板上。校正快钟以后，所有材料拼出这样的过程：冰雹打来，塔身震动。}
        - {id: p15-b02, speaker: narrator, text: 挡雨布朝海的一边可能脱钩，扫过外窗；玛雅连续看不到三次白光，便去拉钟绳。}
        - {id: p15-b03, speaker: narrator, text: 她的小本、救援站事故单和次日清理记录共同表明，旧接头很可能在两声钟响后断开。最后，“多利安星号”改变方向，撞上北沙洲。}
        - {id: p15-b04, speaker: narrator, text: 没有哪一份记录能单独确定整个过程，每个环节都需要其他线索印证。}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: 她又故意从最薄弱的地方攻击自己的解释。灯芯也许真的短暂熄灭过，正如玛雅所猜；可是奥林近看灯火，两本日志却都没有火焰重燃、玻璃积灰或透镜停转的记录。}
        - {id: p16-b02, speaker: narrator, text: 这些缺失仍不能排除极短的故障。玛雅也许真的擅自离开，可断开的旧接头，以及她马上跑上楼报告的行动，都让这种说法变弱。}
        - {id: p16-b03, speaker: narrator, text: 帆布移位和钟绳断裂能解释更多线索，却仍只能算“最可能”，不能写成“已经证明”。}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: 回头看两位守塔人，尼娅发现动机与观察局限并不是一回事。奥林要维护检查结果，也要维护主任守塔人的权威，所以他可能很快把钟声停止理解成不服从。}
        - {id: p17-b02, speaker: narrator, text: 玛雅担心失去工作，因此她强调海上的信号消失，却没有承认自己其实无法判断灯芯状态。}
        - {id: p17-b03, speaker: narrator, text: 压力会影响两人怎样解释所见，却不会自动抹掉准确的部分。真正需要警惕的是，他们都把局部观察推到了自己看不见的地方。}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: 尼娅为新展签写下带有限定的结论：关键几分钟里，两套警示装置很可能同时失去作用。}
        - {id: p18-b02, speaker: narrator, text: 撕裂的挡雨布大概遮住了朝海的灯光；保存的钟绳与三份记录则表明，旧接头很可能在两声钟响后断开。两种故障共同增加了搁浅的可能。}
        - {id: p18-b03, speaker: narrator, text: 不过，现有材料无法还原甲板上的视野，也不能确定船员为什么转向，更无法算出风暴本身影响了多少。}
        - {id: p18-b04, speaker: narrator, text: 如果船上的航行日志仍然存在，它会是检验这些问题的重要新来源。}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: 贝尔先生站在旧铜牌旁读完草稿。他看到“玛雅擅离雾钟岗位”那一句，转身取来工具，把铜牌从墙上卸了下来。}
        - {id: p19-b02, speaker: curator, text: 镇上一直重复奥林的结论，因为他的红本是正式日志。你的文字让读者查验两本记录，也没有假装它们同样完整。}
        - {id: p19-b03, speaker: narrator, text: 尼娅又删掉一句过于肯定的话。新展签分别写出奥林看见什么、玛雅看见什么、物件能支持什么，以及博物馆仍不知道什么。}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: 展厅开放那天，一名男孩听完语音导览，又在两个展柜之间来回看，最后转向尼娅。}
        - {id: p20-b02, speaker: visitor, text: 到底谁写对了？}
        - {id: p20-b03, speaker: narrator, text: 尼娅转动灯塔模型，让代表帆布的纸片越过朝海的外窗。}
        - {id: p20-b04, speaker: nia, text: 奥林说灯火还亮着，这件事很可能没错；玛雅说海上的警示消失，也很可能没错。可是只看一本日志，谁都解释不了整场事故。}
        - {id: p20-b05, speaker: narrator, text: 男孩拉动模型的钟绳。铃声响了两下，绳子停在隐藏的旧接头处，两本日志则在旁边同时摊开。}
