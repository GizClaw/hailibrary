schema_version: 2
language: zh-CN
writer: 明日镜
title: 灯塔日志
summary: >-
  两位守塔人对“多利安星号”搁浅留下了相互冲突的记录。十五岁的尼娅为博物馆录制语音导览时，把两人的位置、动机和观察空白与独立记录、受损物件逐一对照。她提出了更能解释线索的答案，也保留了现有证据无法回答的问题。
chapters:
  - id: ch01
    title: 铜牌上的指控
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 同一场风暴
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: 物件留下的话
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: 判断停在哪里
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: short-answer
    speaker: narrator
    prompt: 旧铜牌怎样指控玛雅？
    answer: 铜牌说玛雅擅离雾钟岗位，而奥林一直保住了灯火。
    page_refs: [p01]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 两本日志对灯塔警示中断提出了哪些不同说法？
    answer: 奥林说灯火稳定，是玛雅停下雾钟；玛雅说海上的灯光消失，钟绳也突然失效。
    page_refs: [p03, p04]
  - id: q03
    type: source-analysis
    speaker: narrator
    prompt: 两位守塔人的位置和动机为什么使任何一本日志都不能单独成为完整答案？
    answer: 奥林能看见内层灯火却看不见朝海外窗，并想维护检查与权威；玛雅能看见外部信号并感到钟绳变化，却看不见灯芯，还担心失去工作。
    page_refs: [p03, p04, p05]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 哪些证据说明两本日志记录的是同一个六分钟时段？
    answer: 两本日志都写到冰雹、塔身震动和储物门关闭的特殊顺序；奥林此前的对钟记录还说明灯室钟快六分钟。
    page_refs: [p06, p07]
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: 为什么救援站事故单能加强事件顺序，却不能证明玛雅的解释？
    answer: 独立记录人也听到两声钟响并看到三次信号缺失，但距离太远，无法判断钟绳是否断开或灯芯是否熄灭。
    page_refs: [p08]
  - id: q06
    type: evidence
    speaker: narrator
    prompt: 哪些线索支持挡雨布曾扫过朝海外窗？
    answer: 奥林记录了临时帆布和固定物；玛雅看见布越过光线；保存下来的帆布有斜裂口，铜钩也朝海弯曲。
    page_refs: [p10, p11, p12]
  - id: q07
    type: evidence
    speaker: narrator
    prompt: 钟绳为什么能构成反驳奥林指控的反例？
    answer: 次日清理记录说明钟绳已从旧接头处分开，复制品演示则表明这种断裂可以造成两声钟响后突然安静。
    page_refs: [p14]
  - id: q08
    type: synthesis
    speaker: narrator
    prompt: 哪种解释最符合时间线与物件线索？
    answer: 冰雹和塔身震动很可能使破损挡雨布扫过外窗，同时钟绳旧接头在拉动两次后断开，造成两种警示一起中断。
    page_refs: [p12, p13, p14, p15]
  - id: q09
    type: main-idea
    speaker: narrator
    prompt: 尼娅为什么在新展签中写“最可能”，而不写“已经证明”？
    answer: 她的解释符合最多证据，但材料无法还原船员视野、转向原因和风暴作用的大小。
    page_refs: [p16, p18]
  - id: q10
    type: research-response
    speaker: narrator
    prompt: 尼娅认为哪一种新资料可以继续检验未解决的问题？
    answer: 如果能找到船上的航行日志，就可能了解船员当时看到什么以及为何转向。
    page_refs: [p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            灯塔展厅重新开放前，尼娅负责录制语音导览。墙上的铜牌把“多利安星号”搁浅写成了一个简单故事。铜牌说，船靠近北沙洲时，副守塔人玛雅擅离雾钟岗位；主任守塔人奥林虽然保住了灯火，仍没能阻止事故。馆长贝尔先生递给尼娅一块擦布，说：“录音以前，把柜子里的材料都读完。”尼娅原以为那只是工作提醒，直到她拉开铜牌下方的旧柜门。
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            柜里并排放着两本皮面日志。红色硬皮本属于奥林，页码齐全；蓝色小本属于玛雅，边角被潮气泡得发皱。两人记录的是同一场风暴，却把责任推向不同方向：奥林说雾钟停了，玛雅却说海上的人看不见灯光。更麻烦的是，他们当时守在灯塔的不同位置，谁也无法看清整套警示装置。尼娅收起麦克风，决定先弄明白两份记录为何会冲突。
    - id: p03
      illustration: p03
      paragraphs:
        - text: >-
            她先把奥林的记录念给贝尔先生听：“灯火始终稳定，透镜照常转动。玛雅敲钟两下，随后离开岗位。船只改变方向，在北沙洲搁浅。”这一页下方还写着，检查员本周刚确认灯室设备合格。奥林的字端正，语气没有迟疑，几乎每句话都围绕自己负责的灯室。他能看见灯芯与透镜，却没有说明光是否顺利穿过外层窗户，照到海上。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            玛雅的小本写得急促：“白色信号连续三次没有出现。我拉了两下钟绳，绳子突然松掉。一块松开的布拍打外侧栏杆。我跑上楼时，那艘船已经转向。”她还提到，自己曾因一次交班迟到受到奥林警告。玛雅想保住工作，奥林想维护刚通过检查的灯室，两人都有为自己辩护的理由。不过，有动机不等于说了谎，尼娅还得分开判断每一条说法。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            尼娅在纸上画了两栏，又把“真”和“假”两个标题划掉，换成“位置、动机、看不到的地方”。奥林守在内层灯火旁，站得高，却被墙体挡住了朝海一面的外窗。玛雅在下方的雾钟平台工作，能看见射向海面的光，也能感到钟绳的变化，却看不到灯火本身。两人的立场来自各自的位置和职责。正因为如此，每本日志既有别人无法代替的观察，也有明显的空白。
    - id: p06
      illustration: p06
      paragraphs:
        - text: >-
            两本日志写下的时间相差六分钟，起初像是无法跨过的裂缝。奥林说猛烈的冰雹出现在十一点四十七分，玛雅却写十一点四十一分。尼娅没有急着选一只钟。两本日志都记下了同一组少见的动静：冰雹先打在北窗上，接着塔身一震，楼下储物门随即砰地关上。顺序完全相同，这更像同一件事，而不是两场恰好相似的风暴。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            她向前翻了几页，找到了时间差的来历。连续四晚，奥林都把灯室钟与港口钟对过一次，并写明灯室钟快六分钟。每一页后面还有同一句安排：等风暴值守结束后再校准。玛雅一直按港口钟记时。尼娅把奥林的时间减去六分钟后，冰雹、两声钟响、三次暗掉的信号和船只转向终于排进同一条时间线。早先的对钟记录与两本日志相互印证，但它只能确定先后，不能解释原因。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            贝尔先生又取来救援站当夜的事故单。记录人站在港口另一侧，既不属于灯室，也不属于雾钟平台。他听见两声钟响，随后只剩风声；按平常节奏本该扫过海面的三次白光也没有出现，之后船才转向。这份独立观察支持玛雅所写的现象，却无法证明她提出的解释。距离太远，记录人看不见钟绳是否断开，更看不见灯芯是否熄灭。尼娅开始相信事件的顺序，却仍不急着接受任何一位守塔人对原因的解释。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: >-
                展柜里有一座可以打开背板的灯塔模型。中央的小灯被转动透镜围住，透镜外面还有一圈外窗。尼娅沿着光线可能经过的方向比画，很快发现奥林的观察存在
            - vocabulary: {id: limitation, text: 局限}
            - text: >-
                ：灯芯稳定燃烧，并不保证光能穿过每一扇外窗。她对贝尔先生说：“奥林回答的是灯有没有亮，玛雅看到的是朝海的信号有没有出现。”馆长点点头，却没有替她决定哪个答案更接近事故原因。
    - id: p10
      illustration: p10
      paragraphs:
        - text: >-
            尼娅回到奥林日志，仔细读事故前一页。午后的风暴把一小块石头吹到塔上，朝陆地的一扇外窗因此裂开。新玻璃送到以前，奥林临时在外侧系了一块厚帆布挡雨。他记下两个铜钩和三道绳圈，却没有画图。那块帆布挂在灯室外面，不在他平时检查灯芯时的视线内。因此，后来“灯火稳定”的记录即使准确，也不能说明临时挡雨布始终固定不动。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            现在，玛雅所写的“松开的布”有了具体来处。冰雹敲响北窗时，她正好能从雾钟平台抬头看见外廊。小本里说，布边突然抽响，越过白光，撞上朝海一侧的栏杆。雨夜太暗，她未必看得清那是不是奥林系的帆布。灯室里的奥林隔着厚玻璃，又有风声和转动装置的声音，也可能听不见布拍栏杆。两份记录并非在描述两场风暴，而是各自抓住了同一座塔的一部分。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: >-
                博物馆还保存着一块从旧外廊取下的硬帆布。盐分让它几乎折不动，一角保留三道绳圈，另一边却斜着裂开。旁边的小托盘中放着一只铜钩，钩头朝海的方向弯曲。这些物件无法把风暴重新演一遍。它们只容许一种有限的
            - vocabulary: {id: inference, text: 推断}
            - text: >-
                ：靠陆地的绳圈也许没有松，朝海的一边却可能被风扯开。帆布随后扫过外窗，暂时挡住几次转来的光。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            尼娅没有在真灯上试验，而是在不亮的模型上放了一张纸片。她把三处固定点留在原位，只移动代表裂口的那个纸角。纸片果然能越过朝海的外窗，却碰不到中央的小灯。透镜每转一圈，向外的光路都会被挡住一段时间。这个小试验不能复制当夜风力，所以不是事故证明；它只说明奥林的“灯火没灭”和玛雅的“信号消失”可以同时成立。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: >-
                剩下的问题是雾钟。保存下来的钟绳平放在带软垫的托板上。露在外面的下端看起来完好，但旧接头原先藏在木制导向槽后。事故次日的清理记录写明，人们在导向槽下分别找到绳子的两端。文物保护人员没有拉扯原绳，只用放大检查确认旧接头两边留有彼此吻合的磨损纤维。尼娅改用按记录尺寸制作的复制品演示，拉到第二下时，复制接头断开。历史断口构成了一个
            - vocabulary: {id: counterexample, text: 反例}
            - text: >-
                ：两声钟响后突然安静，不一定表示玛雅主动停手。藏起来的接头断开，也会造成完全相同的声响顺序。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            尼娅把各份记录的复制件按时间顺序铺在地板上。校正快钟以后，所有材料拼出这样的过程。冰雹打来，塔身震动。挡雨布朝海的一边可能脱钩，随后扫过外窗。玛雅连续看不到三次白光，便去拉钟绳。她的小本、救援站事故单和次日清理记录共同表明，旧接头很可能在两声钟响后断开。最后，“多利安星号”改变方向，撞上北沙洲。没有哪一份记录能单独确定整个过程，每个环节都需要其他线索印证。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            她又故意从最薄弱的地方攻击自己的解释。灯芯也许真的短暂熄灭过，正如玛雅所猜；可是奥林近看灯火，两本日志却都没有火焰重燃、玻璃积灰或透镜停转的记录。这些缺失仍不能排除极短的故障。玛雅也许真的擅自离开，可断开的旧接头，以及她马上跑上楼报告的行动，都让这种说法变弱。帆布移位和钟绳断裂能解释更多线索，却仍只能算“最可能”，不能写成“已经证明”。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            回头看两位守塔人，尼娅发现动机与观察局限并不是一回事。奥林要维护检查结果，也要维护主任守塔人的权威，所以他可能很快把钟声停止理解成不服从。玛雅担心失去工作，因此她强调海上的信号消失，却没有承认自己其实无法判断灯芯状态。压力会影响两人怎样解释所见，却不会自动抹掉准确的部分。真正需要警惕的是，他们都把局部观察推到了自己看不见的地方。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            尼娅为新展签写下带有限定的结论：关键几分钟里，两套警示装置很可能同时失去作用。撕裂的挡雨布大概遮住了朝海的灯光；保存的钟绳与三份记录则表明，旧接头很可能在两声钟响后断开。两种故障共同增加了搁浅的可能。不过，现有材料无法还原甲板上的视野，也不能确定船员为什么转向，更无法算出风暴本身影响了多少。如果船上的航行日志仍然存在，它会是检验这些问题的重要新来源。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            贝尔先生站在旧铜牌旁读完草稿。他看到“玛雅擅离雾钟岗位”那一句，转身取来工具，把铜牌从墙上卸了下来。“镇上一直重复奥林的结论，因为他的红本是正式日志。”他说，“你的文字让读者查验两本记录，也没有假装它们同样完整。”尼娅又删掉一句过于肯定的话。新展签分别写出奥林看见什么、玛雅看见什么、物件能支持什么，以及博物馆仍不知道什么。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            展厅开放那天，一名男孩听完语音导览，又在两个展柜之间来回看。他问尼娅：“到底谁写对了？”尼娅转动灯塔模型，让代表帆布的纸片越过朝海的外窗。“奥林说灯火还亮着，这件事很可能没错；玛雅说海上的警示消失，也很可能没错。可是只看一本日志，谁都解释不了整场事故。”男孩拉动模型的钟绳。铃声响了两下，绳子停在隐藏的旧接头处，两本日志则在旁边同时摊开。
