        - {id: p16-b01, speaker: narrator, text: "She tried to defeat her own explanation. Perhaps the lamp went out briefly, as Maia believed. Orrin's close view argued against that, and neither log described relighting, smoke, or a stopped lens."}
        - {id: p16-b02, speaker: narrator, text: "Those absences could not rule out every brief failure. Perhaps Maia simply left the bell, as Orrin believed."}
        - {id: p16-b03, speaker: narrator, text: "The separated splice and her immediate run upstairs made that less likely."}
        - {id: p16-b04, speaker: narrator, text: "The moving rain guard and broken rope explained more evidence with fewer unsupported assumptions, but most likely was still not certain."}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "The keepers' motives now looked different from their limitations. Orrin had protected a recent inspection and his authority as head keeper."}
        - {id: p17-b02, speaker: narrator, text: "That pressure may explain why he treated Maia's silence as disobedience. Maia had protected a job already at risk."}
        - {id: p17-b03, speaker: narrator, text: "That pressure may explain why she named the missing signal but did not admit how little she knew about the lamp."}
        - {id: p17-b04, speaker: narrator, text: "Neither motive erased the accurate parts of a log. Those differing pressures warned Nia where each writer's inference moved beyond direct observation."}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "Nia wrote a qualified conclusion for the new exhibit. The evidence supported two warning failures during the critical minutes."}
        - {id: p18-b02, speaker: narrator, text: "The outward light was probably blocked by the torn rain guard. The recovered rope and three records indicated that its old splice separated after two strokes. Together, those failures likely contributed to the grounding."}
        - {id: p18-b03, speaker: narrator, text: "The records could not show what the ship's crew saw from the deck, why the ship changed course, or how much the storm itself mattered."}
        - {id: p18-b04, speaker: narrator, text: "A shipboard log, if one survived, could test those remaining questions."}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: "Mr. Bell read Nia's draft beside the old brass plaque. He paused at the claim that Maia Venn abandoned the fog bell, then unscrewed the plaque from the wall."}
        - {id: p19-b02, speaker: curator, text: "The town repeated Orrin's conclusion because his book was official. Your version makes room for both records without pretending they are equally complete."}
        - {id: p19-b03, speaker: narrator, text: "Nia shortened one sentence that sounded too certain. The replacement label named Orrin's observation, Maia's observation, the physical clues, and the limits of the museum's conclusion."}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: "At the reopening, a visitor listened to Nia's audio guide and studied the two logbooks in separate cases. He asked Nia a question."}
        - {id: p20-b02, speaker: visitor, text: "So which keeper was right?"}
        - {id: p20-b03, speaker: narrator, text: "Nia turned the lighthouse model until the paper rain guard crossed the seaward windows."}
        - {id: p20-b04, speaker: nia, text: "Orrin was probably right that the flame stayed lit. Maia was probably right that the warning disappeared. Neither could see enough to explain the wreck alone."}
        - {id: p20-b05, speaker: narrator, text: "The visitor pulled the model's bell rope. The bell rang twice; then the hidden splice separated and the rope went slack, while both books remained open beside it."}
