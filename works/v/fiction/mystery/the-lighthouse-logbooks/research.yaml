schema_version: 1
required: true
reason: >-
  Beacon Island, the Dorian Star, the keepers, the museum, the logbooks, the
  warning failure, and the wreck are entirely invented, but the story uses
  checkable lighthouse technology and museum-handling practices. It does not
  claim to reconstruct a named lighthouse, shipwreck, law, date, or community
  history.
sources:
  - url: https://www.nps.gov/pore/learn/photosmultimedia/photogallery_thenandnow_pointreyeslighthouse.htm
    authority: U.S. National Park Service
    supports: >-
      Generic background used in p03, p09, p10, and p16: historical keepers tended
      an oil lamp and clockwork mechanism that rotated a lens to create a flash.
      The fictional station design, damaged pane, canvas guard, times, and failure
      sequence are inventions rather than claims about Point Reyes.
    verified_at: 2026-09-13
  - url: https://www.history.uscg.mil/Browse-by-Topic/Assets/Land/All/Article/1926716/fort-point-light-tx/
    authority: United States Coast Guard Historian's Office
    supports: >-
      Generic background used in p02, p04, p08, and p14: fog bells were historical
      sound signals at light stations and some early bells were struck by hand.
      The Fort Point station record identifies a hand-struck bell as its fog horn.
      The fictional rope, two strokes, break, and ship response are not attributed
      to Fort Point or presented as documented maritime history.
    verified_at: 2026-09-13
  - url: https://www.nps.gov/subjects/museums/upload/MHI_AppK_TextilesObjects.pdf
    authority: U.S. National Park Service
    supports: >-
      Museum-handling practice used in p14: fragile historic fiber objects should
      receive preventive care, adequate support, and minimal handling. Nia never
      load-tests the original rope; a non-destructive examination documents it,
      and a replica is used for the working demonstration.
    verified_at: 2026-09-13
notes: >-
  The authoritative sources support only ordinary lighthouse background and
  responsible museum handling. They do not make any fictional person, object,
  or causal conclusion historical.
