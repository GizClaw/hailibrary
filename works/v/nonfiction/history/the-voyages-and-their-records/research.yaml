schema_version: 1
required: true
historical_scope: >-
  Zheng He's seven state-sponsored voyages, their 1405-1433 chronology, their
  documented Indian Ocean reach, and the surviving source types are researched
  nonfiction. The work evaluates the position and limits of Ming court records,
  the Liujiagang, Changle, and Galle inscriptions, Ma Huan's Yingyai Shenglan,
  and the Mao Kun map. It presents the 1421 global-voyage claim only as a modern
  rejected hypothesis and does not treat absence alone as proof.
sources:
  - url: https://asia-archive.si.edu/learn/for-educators/teaching-china-with-the-smithsonian/interactives/timelines/timeline-of-chinese-history-art-and-culture/
    title: Timeline of Chinese History, Art, and Culture
    publisher: Smithsonian National Museum of Asian Art
    supports: >-
      Zheng He led seven naval expeditions from 1405 through 1433 through
      Southeast Asia and the Indian Ocean as far as the east coast of Africa.
  - url: https://www.si.edu/object/siris_sil_843382
    title: "Zheng He: China and the Oceans in the Early Ming Dynasty, 1405-1433"
    publisher: Smithsonian Libraries and Archives catalog record for Edward L. Dreyer's scholarly study
    supports: >-
      The standard scholarly chronology separates seven voyages; the study uses
      Ming official sources, the Liujiagang and Changle inscriptions, ship and
      personnel evidence, and a dedicated note on sources.
  - url: https://www.epress.nus.edu.sg/msl/users-guide
    title: A User's Guide to Southeast Asia in the Ming Shi-lu
    publisher: Asia Research Institute and Singapore E-Press, National University of Singapore
    supports: >-
      The database translates Southeast Asian references in the Ming emperors'
      reign records from the Academia Sinica edition and warns that expert
      knowledge is required to interpret their political, geographic, and
      linguistic context.
  - url: https://www.epress.nus.edu.sg/msl/ming-shi-lu-source-study-southeast-asian-history
    title: The Ming Shi-lu as a Source for the Study of Southeast Asian History
    publisher: National University of Singapore
    supports: >-
      The Ming Shi-lu are court-compiled records with strong chronological value
      but institutional selection and terminology that require source criticism.
  - url: https://epress.nus.edu.sg/msl/reign/yong-le/year-3-month-10-day-20
    title: Ming Shi-lu entry for 11 November 1405
    publisher: National University of Singapore, translated by Geoff Wade
    supports: >-
      A court text presents overseas relations through imperial hierarchy,
      ceremony, loyalty, and adoption of Chinese ways, revealing the court's
      political position rather than a neutral foreign viewpoint.
  - url: https://epress.nus.edu.sg/msl/reign/xuan-de/year-5-month-6-day-9
    title: Ming Shi-lu entry for 29 June 1430
    publisher: National University of Singapore, translated by Geoff Wade
    supports: >-
      The Xuande court sent Zheng He and Wang Jinghong with a proclamation and
      gifts to rulers across twenty named destinations from Southeast Asia to
      the Indian Ocean, Persian Gulf, and East Africa.
  - url: https://chssp.ucdavis.edu/sites/g/files/dgvnsk8426/files/inline-files/Calicut.pdf
    title: Sites of Encounter lesson, Zheng He's Liujiagang Inscription of 1431
    publisher: University of California, Davis, California History-Social Science Project
    supports: >-
      The translated inscription says the envoys were commissioned seven times,
      describes large fleets and distant travel, credits divine aid, and boasts
      of punishing resistance. Its celebratory language exposes position and bias.
  - url: https://www.fzcl.gov.cn/xjwz/zjcl/rwls/202208/t20220818_4419025.htm
    title: 中国航海日，一起看郑和七下西洋中的长乐印记
    publisher: 福州市长乐区人民政府
    supports: >-
      The 1431 Changle inscription records voyage times, destinations, and events,
      praises Tianfei, and is an important surviving material record that can
      supplement errors or gaps in later historical writing.
  - url: https://www.unesco.org/en/memory-world/trilingual-inscription-tribhashasellipiya
    title: Trilingual Inscription (TribhashaSellipiya)
    publisher: UNESCO
    supports: >-
      The Galle tablet is dated 15 February 1409, was inscribed in Nanjing and
      brought to Sri Lanka during the third voyage, and bears Chinese, Persian,
      and Tamil texts addressing Buddhist, Islamic, and Hindu sacred traditions.
      This date belongs to the inscription and does not by itself settle when
      the stone was transported or installed.
  - url: https://pure.uva.nl/ws/files/44561338/the_persianate_world..pdf
    title: The Persianate World - The Frontiers of a Eurasian Lingua Franca
    publisher: University of Amsterdam repository; University of California Press academic volume
    supports: >-
      An academic account says the Galle stone's text, translations, calligraphy,
      and carving were completed at the Ming court in Nanjing in 1409, while the
      stele was carried to Ceylon and erected there in 1411. This differs from a
      simple reading that treats the inscribed date as the arrival date, so the
      work leaves the transport and installation chronology qualified.
  - url: https://www.cambridge.org/us/download_file/163995
    title: Ma Huan, Overall Survey of the Ocean's Shores, 1451
    publisher: Cambridge University Press primary-source teaching excerpt
    supports: >-
      Ma Huan accompanied three of the seven voyages as an Arabic interpreter,
      kept accounts, and described places including Calicut and Hormuz.
  - url: https://www.cambridge.org/core/journals/journal-of-chinese-history/article/communications-and-communicators-in-the-yuan-and-early-ming/DCC3269CD58F4FE7FF9EC0F2505214EC
    title: Communications and Communicators in the Yuan and Early Ming
    publisher: Cambridge University Press, Journal of Chinese History
    supports: >-
      Ma Huan learned Arabic or Persian and served as a translator; his access to
      local information depended partly on linguistic and intermediary networks,
      which shaped both the reach and limits of his account.
  - url: https://www.loc.gov/item/2004633695/
    title: Wu bei zhi map collection
    publisher: Library of Congress
    supports: >-
      Juan 240 preserves the route associated with Zheng He's voyages from
      Nanjing through Southeast Asia and the Indian Ocean toward the Red Sea and
      Persian Gulf; the surviving object belongs to a later military compilation.
  - url: https://www.journals.uchicago.edu/doi/full/10.1086/713564
    title: Shallow Water at China's Coast - Depicting Dangers on Early Modern Chinese Maps
    publisher: University of Chicago Press, Isis
    supports: >-
      The so-called Zheng He Map survives in early seventeenth-century books,
      while a lost earlier version probably arose from the voyages. It includes
      routes, compass directions, sailing time, star positions, and some water
      depths, yet could not serve as a complete stand-alone navigation guide.
  - url: https://biblioasia.nlb.gov.sg/all-sections/stacks/
    title: Stories from the Stacks - The Mao Kun Map
    publisher: National Library Board Singapore
    supports: >-
      The Mao Kun map is a linear route-centered chart based on early
      fifteenth-century expeditions, first preserved in the late-Ming Wubei Zhi;
      scholars differ on the exact date of its original formation.
  - url: https://historycooperative.org/journal/how-not-to-rewrite-world-history-gavin-menzies-and-the-chinese-discovery-of-america/
    title: How Not to Rewrite World History - Gavin Menzies and the Chinese Discovery of America
    publisher: Journal of World History review by Robert Finlay, hosted by History Cooperative
    supports: >-
      The 1421 claim misuses sources and ignores the documented chronology. The
      sixth voyage's movements and returns are accounted for within the Indian
      Ocean network, and no positive evidence supports the proposed voyages to
      the Americas or a circumnavigation.
  - url: https://www.tandfonline.com/doi/abs/10.2104/ha080077
    title: Better Than the Da Vinci Code - The Theological Edifice that is Gavin Menzies' 1421
    publisher: History Australia
    supports: >-
      Independent scholarly criticism identifies factual inconsistencies and a
      method that shifts claims and absorbs contrary evidence rather than testing
      a stable proposition.
  - url: https://ari.nus.edu.sg/wp-content/uploads/2018/10/wps04_031.pdf
    title: The Zheng He Voyages - A Reassessment
    publisher: Asia Research Institute, National University of Singapore
    supports: >-
      A revisionist scholarly interpretation stresses Ming power, control of
      ports and trade, and episodes of force, showing why celebratory accounts of
      purely peaceful exchange do not exhaust the evidence.
notes: >-
  The work treats source agreement as stronger than any one source while keeping
  provenance and institutional purpose visible. It avoids uncertain treasure-ship
  dimensions and precise fleet totals, which vary by source. It also avoids the
  claim that all records were destroyed; substantial court, inscriptional,
  cartographic, and travel-account evidence survives. The conclusion is bounded:
  the sources support extensive voyages through Southeast Asia and the Indian
  Ocean to East Africa, not a documented crossing to the Americas or a global
  circumnavigation.
