      blocks:
        - {id: p11-b01, speaker: narrator, text: 马欢的记录让我们看到随行者的视角。他曾参加三次远航，能够借助阿拉伯语或波斯语从事翻译。瀛涯胜览记下印度洋沿岸的港口、统治者、货物、信仰、法律、饮食、服饰和买卖方式。}
        - {id: p11-b02, speaker: narrator, text: 旅行者会注意到宫廷记录不在意的生活细节，译者也有机会向不同语言的人询问。亲历航程使他的材料更有价值，但记录者仍会取舍，也可能误听，并按自身的文化标准作出判断。}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: 瀛涯胜览不是某一次航行的逐日值班记录。马欢把几次旅程中的观察汇集起来，也写入了从别人那里得知的地方情况，后来还继续整理修订。}
        - {id: p12-b02, speaker: narrator, text: 因此，不能拿它当分秒不差的路线表；它更像一幅范围广阔的见闻长卷。阅读时要分清哪些内容来自亲眼所见，哪些经过转述，哪些又带着作者熟悉的价值尺度。}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: 把马欢的书和实录对照，便能看出它们各自回答什么。实录可以确定使团何时奉命出发，并写明朝廷给出的理由；马欢则可能补上港口市场、当地规矩和货物流动。}
        - {id: p13-b02, speaker: narrator, text: 更具体的反例会改变初步判断。宫廷礼仪容易让人以为远航主要是和平外交，刘家港碑却夸耀擒获反抗者、击败武装力量。因此，综合结论必须在外交、贸易和祭祀之外，加入强制与武力。}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: 茅坤图把另一类材料放上桌面。今天能看到的版本收入武备志，成书时间距离首次远航约有两百年。研究者认为，它很可能保存了十五世纪航海知识形成的早期底本，但那个底本已经失传。}
        - {id: p14-b02, speaker: narrator, text: 这条传递链不能省略。现存地图不是从郑和船上原样取下的一卷纸，而是古老航海材料经过抄写、编排和可能修订后的样子。}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: 图上的路线像长卷一样，从南京沿东南方向铺开，再通往印度、阿拉伯和东非。海岸没有服从现代地图的固定比例，而是围着航路伸展。针路记录罗盘方向和航行时间，过洋牵星图表示星体高度，部分地点还有水深信息。}
        - {id: p15-b02, speaker: narrator, text: 这些细节显出水手的观察角度：他们关心的不是俯看世界，而是下一段怎样走、会先遇见哪座山或哪处岛。地图的形状本身就在说明它的用途。}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: 现存茅坤图仍不足以单独带领一艘船安全远航。哪里有浅滩，水流怎样变化，陌生港口何时可以进入，还需要更细的地方经验。许多知识可能靠口授，也可能写在已经散失的针路簿中。}
        - {id: p16-b02, speaker: narrator, text: 更关键的是，图上的航路位于中国通向印度洋和东非的网络。若把它硬套在现代世界地图上，就会替原图增加固定比例、统一方向和从未标出的目的地。}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: 四类材料终于可以同时比较。实录提供出发、奉命和归来的日期；港口石碑回顾七次使命；马欢描写印度洋社会；茅坤图保存通往东非的航线与航海方法。}
        - {id: p17-b02, speaker: narrator, text: 多种材料共同指向相近海域，因此七次远航的基本路线框架得到有力支持。把材料放在一起，缺口也清楚可见：普通水手的声音很少，外国一方的记录零散，许多港口居民的感受已难以恢复。}
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          content:
            - text: 现代流行的“一四二一”
            - vocabulary: {id: hypothesis, text: 假说}
            - text: 认为第六次远航的一部分船只横渡太平洋，到达美洲并绕行世界。假说支持者把所谓的记录空白和年代更晚的地图，解释为这次秘密大航程仍有可能发生的余地。
        - {id: p18-b02, speaker: narrator, text: 然而，空白不是航线。判断这个主张，先要检查时间是否容得下，早期材料是否指向那些海域。还要查看不同地区是否存在能够互相支持的登陆证据。}
    - id: p19
      illustration: p19
      blocks:
        - {id: p19-b01, speaker: narrator, text: 第六次远航的已知时间并没有留下足够长的失踪年代。记录让各支船队经过东南亚和印度洋多处港口，随后又写下它们返回中国的日期。马欢广泛记录海外见闻，却没有提到美洲或澳大利亚航程。}
        - {id: p19-b02, speaker: narrator, text: 茅坤图向西进入印度洋，也没有跨太平洋到美洲。学者进一步检查“一四二一”假说的论据，发现其中常有误读地图、转借他人说法，以及面对反证便改变解释的问题，始终缺少可靠实物。}
    - id: p20
      illustration: p20
      blocks:
        - {id: p20-b01, speaker: narrator, text: 没找到证据，不能单独证明一件事绝不可能发生；任何时代都会失去文件和人的声音。但是，一条与现存时间和地理记录冲突的环球路线，必须拿出直接而独立的证据，不能只住在档案空隙里。}
        - {id: p20-b02, speaker: narrator, text: 在可信边界内，郑和远航依然惊人。宫廷的权力、碑刻的纪念目的、旅行者的好奇、水手的经验和后世抄本的痕迹，都留在材料里。辨明每份材料的立场和处境，不会缩小航程，反而让真正有记录的辽阔海面不被后来画出的线遮住。}
chapters:
  - {id: ch01, title: 一条航线与一桌材料, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 宫廷文字与港口石碑, page_refs: [p06, p07, p08, p09, p10]}
  - {id: ch03, title: 译者的见闻与水手的地图, page_refs: [p11, p12, p13, p14, p15]}
  - {id: ch04, title: 检验环游世界的说法, page_refs: [p16, p17, p18, p19, p20]}
questions:
  - {id: q01, type: main-idea, speaker: narrator, prompt: 本文用什么主要方法认识郑和远航？, answer: 把多种来源放在一起，分别判断制作者、用途、优势和遗漏，再比较它们是否互相支持。, page_refs: [p03, p17, p20]}
  - {id: q02, type: short-answer, speaker: narrator, prompt: 现存材料共同支持的航程范围是什么？, answer: 七次船队从中国经东南亚进入印度洋，到达阿拉伯地区和东非海岸。, page_refs: [p02, p15, p17]}
  - {id: q03, type: source-analysis, speaker: narrator, prompt: 刘家港石刻为什么既珍贵又有局限？, answer: 它由远航将领在接近事件的年代立下，保存了任务和冲突；但它是夸耀功业的公共纪念物，没有留下对手和普通人的声音。, page_refs: [p07, p08]}
  - {id: q04, type: compare, speaker: narrator, prompt: 实录与马欢的记录能怎样说明同一次往来？, answer: 实录可以确定出使日期和官方理由，马欢的记录则能补充港口生活、规矩与货物流动。, page_refs: [p04, p11, p13]}
  - {id: q05, type: evidence, speaker: narrator, prompt: 茅坤图中哪些内容显示它保存了实际航海知识？, answer: 图中有航路次序、罗盘方向、航行时间、星体高度和部分水深。, page_refs: [p15]}
  - {id: q06, type: evaluate, speaker: narrator, prompt: 长乐碑与实录日期吻合，为什么仍不能证明两者的每句话？, answer: 两种材料能加强共同的时间框架，但都属于明朝国家记录，可能共享消息来源和观念。, page_refs: [p09]}
  - {id: q07, type: synthesis, speaker: narrator, prompt: 加勒三语碑与马欢的译者身份合在一起，说明远航面对怎样的交流环境？, answer: 船队面对多种语言与宗教群体，需要借助不同文字、礼仪和翻译来传达信息。, page_refs: [p10, p11]}
  - {id: q08, type: source-analysis, speaker: narrator, prompt: 为什么不能把现存茅坤图当作郑和船上原样保存的地图？, answer: 它保存在约两百年后的武备志中，较早底本已经失传，现存形式经过抄写、编排和可能的修订。, page_refs: [p14]}
  - {id: q09, type: evaluate, speaker: narrator, prompt: “1421”假说没有通过本文提出的哪两项关键检验？, answer: 环球航程与现存时间记录不合，也没有同时代航路或不同地区登陆实物提供独立支持。, page_refs: [p18, p19]}
  - {id: q10, type: research-response, speaker: narrator, prompt: 如果发现一块写有陌生港口名的石碑，研究者在改画航线前应查什么？, answer: 应先确认石碑的年代和来历，判断谁为何立碑，考释地名，并寻找能印证这条路线的独立材料。, page_refs: [p03, p07, p09, p20]}
