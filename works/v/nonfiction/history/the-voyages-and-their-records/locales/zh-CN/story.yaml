schema_version: 2
language: zh-CN
writer: 明日镜
title: 宝船与记录
summary: 郑和船队的航程并没有留下一份完整答案。宫廷实录、港口碑刻、马欢的见闻和后世保存的茅坤图，各自记录了不同的部分，也带着不同的立场。把这些材料放在一起，既能看清七次远航的广阔范围，也能判断“1421 年环游世界”为什么缺少史学证据。
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 一条醒目的航线绕着现代地球仪画了一圈，从中国出发，经过美洲，又从另一边回来。旁边写着一个吸引人的说法：明代船队在 1421 年已经环游世界。
        - text: 图画得完整，不等于事情有证据。六百年前的人究竟留下了什么？这些记录各自能证明到哪里？只有先回答这两个问题，那条航线才值得保留。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 从 1405 年到 1433 年，明朝皇帝先后派出七次大型远航，郑和与其他将领负责统领船队。现存材料支持的航程穿过东南亚，进入印度洋，到过波斯湾、阿拉伯半岛和东非海岸。
        - text: 这已经是极为辽阔的海上行动，并不需要再添一段环球故事。可是，就连这条基本路线也不是抄自一份完整航海日志，而是由多种残缺材料共同拼成的。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 想象一张长桌：一边是按日期编排的宫廷记录，一边是港口留下的石碑；桌上还有旅行见闻和狭长的航海图。它们材质不同，写作目的不同，能够保存到今天的原因也不同。
        - text: 没有哪一件材料记下所有命令、争论、转向和甲板上的见闻。研究者只好反复追问：谁制作了它？准备给谁看？哪些事情必须写，哪些声音又很容易消失？
    - id: p04
      illustration: p04
      paragraphs:
        - text: 《明实录》按皇帝在位的次序记录朝廷事务。下令出使、赏赐外国使者、接待来访者、处理冲突和迎接船队回国，都可能留下日期。研究者据此搭出远航的时间骨架。
        - text: 编修者能够看到普通人接触不到的诏令和奏报，这是宫廷位置带来的优势。不过，他们首先关心的仍是朝廷认为重要的事情。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 宫廷文字把皇帝放在叙事中心。1405 年的一则记录赞扬外国统治者忠顺、愿意遵从明朝礼仪；1430 年的诏书则把郑和写成传达皇命、向各地首领赐礼的使者。
        - text: 这些句子能说明明朝如何宣布出使目的，却不能替马六甲、古里或木骨都束的居民回答。他们怎样理解来访的船队，宫廷笔下往往看不见。因此，实录的准确日期总和朝廷立场连在一起。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 一次船队出发，实录也许只用几行便记完。水手怎样值守，港口商人怎样议价，当地统治者怎样权衡礼物与压力，都可能被“出使”“朝贡”这样的词压缩掉。
        - text: 后来的编修者还可能沿用早先的错误。因此，“官方”并不等于“完整”或“没有偏向”。它只说明材料来自一个掌握许多信息、同时也有明确秩序和目标的机构。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 第七次出航前，郑和、王景弘等人在刘家港和长乐立石，回顾此前的航程。刻在石碑上、用来记事或表达观点的文字叫作
            - vocabulary: {id: inscription, text: 碑文}
            - text: 。这两块碑形成于亲历者仍能指出明显错误的年代。
        - text: 它们所列的时间和地点格外珍贵。不过，石碑不是随手写给自己的便条，而是准备让后来者看见的公共纪念物。谁决定刻什么，也决定了哪些内容更容易留下。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 刘家港的石刻反复写到奉命远行、海浪险恶、所到之处遥远，并把成功归于天妃护佑。文字还夸耀船队擒获反抗者、击败武装力量。这不是失败者或码头劳工的叙述，而是出使将领对功业的公开说明。
        - text: 自豪的口气本身也是证据：它让人看见明朝使命中的权力和信仰。与此同时，这种口气可能遮住冲突的代价，以及遭遇船队的人怎样看待同一件事。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 长乐石碑列出多次远航的时间与目的地。若其中的次序能和实录日期
            - vocabulary: {id: corroborate, text: 印证}
            - text: ，共同的航程框架就更可信，因为两种材料在不同形态中保住了相同信息。
        - text: 不过，石碑和实录都属于明朝国家记录，也可能共享消息来源和观念。它们互相吻合，不代表每句话都获得了独立证明。研究者仍要寻找其他地点、其他身份的人留下的材料。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 加勒石碑落款为 1409 年 2 月 15 日。石上同时刻有中文、波斯文和泰米尔文，分别向佛教、伊斯兰教和印度教相关的神圣对象表达敬意与奉献。
        - text: 资料都认为石碑在南京刻好，并由第三次远航带往当地，但对立碑时间说法不一。碑上的日期不一定就是运抵或立碑日期。这件实物证明明朝使团到过当地，却无法代替所有当地人的反应。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 马欢的记录让我们看到随行者的视角。他曾参加三次远航，能够借助阿拉伯语或波斯语从事翻译。《瀛涯胜览》记下印度洋沿岸的港口、统治者、货物、信仰、法律、饮食、服饰和买卖方式。
        - text: 旅行者会注意到宫廷记录不在意的生活细节，译者也有机会向不同语言的人询问。亲历航程使他的材料更有价值，但记录者仍会取舍，也可能误听，并按自身的文化标准作出判断。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 《瀛涯胜览》不是某一次航行的逐日值班记录。马欢把几次旅程中的观察汇集起来，也写入了从别人那里得知的地方情况，后来还继续整理修订。
        - text: 因此，不能拿它当分秒不差的路线表；它更像一幅范围广阔的见闻长卷。阅读时要分清哪些内容来自亲眼所见，哪些经过转述，哪些又带着作者熟悉的价值尺度。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 把马欢的书和实录对照，便能看出它们各自回答什么。实录可以确定使团何时奉命出发，并写明朝廷给出的理由；马欢则可能补上港口市场、当地规矩和货物流动。
        - text: 更具体的反例会改变初步判断。宫廷礼仪容易让人以为远航主要是和平外交，刘家港碑却夸耀擒获反抗者、击败武装力量。因此，综合结论必须在外交、贸易和祭祀之外，加入强制与武力。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 茅坤图把另一类材料放上桌面。今天能看到的版本收入《武备志》，成书时间距离首次远航约有两百年。研究者认为，它很可能保存了十五世纪航海知识形成的早期底本，但那个底本已经失传。
        - text: 这条传递链不能省略。现存地图不是从郑和船上原样取下的一卷纸，而是古老航海材料经过抄写、编排和可能修订后的样子。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 图上的路线像长卷一样，从南京沿东南方向铺开，再通往印度、阿拉伯和东非。海岸没有服从现代地图的固定比例，而是围着航路伸展。针路记录罗盘方向和航行时间，过洋牵星图表示星体高度，部分地点还有水深信息。
        - text: 这些细节显出水手的观察角度：他们关心的不是俯看世界，而是下一段怎样走、会先遇见哪座山或哪处岛。地图的形状本身就在说明它的用途。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 现存茅坤图仍不足以单独带领一艘船安全远航。哪里有浅滩，水流怎样变化，陌生港口何时可以进入，还需要更细的地方经验。许多知识可能靠口授，也可能写在已经散失的针路簿中。
        - text: 更关键的是，图上的航路位于中国通向印度洋和东非的网络。若把它硬套在现代世界地图上，就会替原图增加固定比例、统一方向和从未标出的目的地。
    - id: p17
      illustration: p17
      paragraphs:
        - text: 四类材料终于可以同时比较。实录提供出发、奉命和归来的日期；港口石碑回顾七次使命；马欢描写印度洋社会；茅坤图保存通往东非的航线与航海方法。
        - text: 多种材料共同指向相近海域，因此七次远航的基本路线框架得到有力支持。把材料放在一起，缺口也清楚可见：普通水手的声音很少，外国一方的记录零散，许多港口居民的感受已难以恢复。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 现代流行的“1421”
            - vocabulary: {id: hypothesis, text: 假说}
            - text: 认为第六次远航的一部分船只横渡太平洋，到达美洲并绕行世界。假说支持者把所谓的记录空白和年代更晚的地图，解释为这次秘密大航程仍有可能发生的余地。
        - text: 然而，空白不是航线。判断这个主张，先要检查时间是否容得下，早期材料是否指向那些海域。还要查看不同地区是否存在能够互相支持的登陆证据。
    - id: p19
      illustration: p19
      paragraphs:
        - text: 第六次远航的已知时间并没有留下足够长的“失踪年代”。记录让各支船队经过东南亚和印度洋多处港口，随后又写下它们返回中国的日期。马欢广泛记录海外见闻，却没有提到美洲或澳大利亚航程。
        - text: 茅坤图向西进入印度洋，也没有跨太平洋到美洲。学者进一步检查“1421”的论据，发现其中常有误读地图、转借他人说法，以及面对反证便改变解释的问题，始终缺少可靠实物。
    - id: p20
      illustration: p20
      paragraphs:
        - text: 没找到证据，不能单独证明一件事绝不可能发生；任何时代都会失去文件和人的声音。但是，一条与现存时间和地理记录冲突的环球路线，必须拿出直接而独立的证据，不能只住在档案空隙里。
        - text: 在可信边界内，郑和远航依然惊人。宫廷的权力、碑刻的纪念目的、旅行者的好奇、水手的经验和后世抄本的痕迹，都留在材料里。辨明每份材料的立场和处境，不会缩小航程，反而让真正有记录的辽阔海面不被后来画出的线遮住。
