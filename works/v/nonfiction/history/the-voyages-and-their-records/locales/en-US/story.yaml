---
schema_version: 2
language: en-US
writer: tomorrow-lens
title: The Voyages and Their Records
summary: Zheng He's fleets crossed the seas from 1405 to 1433, but no single surviving record tells their whole story. By comparing court histories, stone inscriptions, Ma Huan's account, and the Mao Kun map, readers can test both celebrated achievements and the unsupported claim that the fleets circled the globe in 1421.
article:
  pages:
  - id: p01
    illustration: p01
    paragraphs:
    - text: 'A bright line circles a modern globe. It leaves China, crosses oceans, touches the Americas, and returns from the other side. Beside it stands an exciting claim: Chinese fleets sailed around the world in 1421.'
    - text: The line looks complete, but a line drawn today is not evidence from six centuries ago. To judge the claim, we need a harder question. What records did Zheng He's voyages actually leave, and what can each record prove?
    - text: A historical claim becomes useful when it produces questions that surviving evidence can answer, not when its route merely looks possible.
  - id: p02
    illustration: p02
    paragraphs:
    - text: Between 1405 and 1433, Ming emperors sent seven major naval expeditions under Zheng He and other commanders. The fleets traveled through Southeast Asia and across the Indian Ocean. Their documented routes reached the Persian Gulf, the Arabian Peninsula, and East Africa.
    - text: That achievement needs no invented ocean crossing to make it remarkable. Yet even the basic outline comes from several records, not from one complete ship's log. History begins here with agreement among incomplete sources.
    - text: The issue is not whether Ming ships could cross open water, but where contemporary evidence places the fleets during particular years.
  - id: p03
    illustration: p03
    paragraphs:
    - text: The evidence resembles a table covered with different objects. There are court entries arranged by date, stone texts set up near departure ports, a travel account, and a long route map. Each object survived for a different reason.
    - text: 'None gives us every order, conversation, course change, or view from the deck. A historian therefore asks three questions repeatedly: Who made this source? What did its maker need to record? What was easy to leave out?'
    - text: This relationship between a source maker and an event is its position, and position shapes both access and blind spots.
  - id: p04
    illustration: p04
    paragraphs:
    - text: The Ming Shi-lu, or Veritable Records, preserve court business from each emperor's reign. Entries note commands, envoys, gifts, visiting rulers, conflicts, and returns. Because they attach events to reign dates, they help build a voyage chronology.
    - text: The records were compiled for the government from official material. That position gave compilers access to orders and reports unavailable to most observers. It also directed their attention toward matters the court considered important.
    - text: A dated court entry may therefore be strong evidence for an official sequence while revealing little about work below deck.
  - id: p05
    illustration: p05
    paragraphs:
    - text: Court language placed the Ming emperor at the center of the world it described. A 1405 text praised a foreign ruler for loyalty and willingness to follow Chinese ceremony. A 1430 proclamation presented Zheng He as the carrier of imperial instruction and gifts.
    - text: Such entries show what the government announced and how it framed relationships. They do not automatically show how a ruler in Melaka, Calicut, or Mogadishu understood the same meeting. Official precision and official viewpoint arrive together.
    - text: Words such as loyalty describe the court's desired hierarchy; they cannot by themselves prove that every visitor accepted that description.
  - id: p06
    illustration: p06
    paragraphs:
    - text: Court records can be exact about a dispatch while remaining silent about an ordinary sailor's work or a port resident's response. Their categories may compress negotiation, trade, ceremony, and pressure into a few formal lines.
    - text: Later compilers could also copy an earlier mistake. For that reason, “official” does not mean “complete” or “neutral.” It means the source came from an institution whose access and purpose must both be examined.
    - text: Silence becomes meaningful only after we ask whether this institution would normally have recorded the missing kind of event.
  - id: p07
    illustration: p07
    paragraphs:
    - content:
      - text: 'Before the seventh expedition, Zheng He and fellow commanders set up stone texts at Liujiagang and Changle. An '
      - vocabulary:
          id: inscription
          text: inscription
      - text: " is writing cut into a lasting surface. These two inscriptions listed earlier journeys while people connected to the voyages could still challenge an obvious error."
    - text: Their dates and route lists are valuable because the stones stand close to the events. Unlike a private note, however, a public monument was designed to be seen and remembered.
    - text: Stone may outlast paper, but damage, restoration, and translation can still affect what later readers recover from its surface.
  - id: p08
    illustration: p08
    paragraphs:
    - text: The Liujiagang text celebrates repeated imperial missions, dangerous seas, distant travel, and the commanders' success. It credits the goddess Tianfei for protection. It also boasts that forces captured rulers who resisted and defeated armed opponents.
    - text: This is not the voice of a defeated ruler or a dock worker. The inscription preserves achievements that commanders chose for a sacred public monument. Its pride is evidence about Ming aims, yet pride can also hide costs and opposing views.
    - text: Even praise can supply evidence when readers distinguish the events being claimed from the monument's judgment about those events.
  - id: p09
    illustration: p09
    paragraphs:
    - content:
      - text: 'The Changle stone names destinations and gives a sequence of voyages. When its sequence agrees with dated court entries, the sources '
      - vocabulary:
          id: corroborate
          text: corroborate
      - text: " one another: separate evidence makes the shared outline stronger."
    - text: Agreement does not make every phrase equally trustworthy. The court record and the monument both belonged to the Ming state, so they could share assumptions and information. Historians still seek evidence made in other places and for other audiences.
    - text: Corroboration is strongest when sources reached the same detail through genuinely different routes rather than by copying one report.
  - id: p10
    illustration: p10
    paragraphs:
    - text: One such object was set up far from the Chinese court. The Galle stone bears a date of February 15, 1409, and texts in Chinese, Persian, and Tamil. The three sections honor sacred traditions associated with Buddhism, Islam, and Hinduism.
    - text: The Galle inscription confirms a Ming presence in Sri Lanka and shows that the mission addressed more than one religious community. It cannot tell us how every local reader reacted. Even a multilingual monument mainly preserves the message its sponsors intended.
    - text: Sources agree it was inscribed in Nanjing and taken on the third voyage, but accounts place its installation differently. The date on a monument is not automatically its arrival date.
  - id: p11
    illustration: p11
    paragraphs:
    - text: Ma Huan offers another position. He traveled on three expeditions and worked with Arabic or Persian as an interpreter. His Yingyai Shenglan describes ports, rulers, products, beliefs, laws, food, clothing, trade, and daily practices around the Indian Ocean.
    - text: A traveler could notice details too small for a court entry. An interpreter might ask questions across languages. Ma's presence makes his account close to many events, but closeness alone does not remove selection or misunderstanding.
    - text: His account opens windows beyond the palace archive, although each window remains framed by one educated traveler's interests and categories.
  - id: p12
    illustration: p12
    paragraphs:
    - text: Ma Huan did not write a minute-by-minute diary of one voyage. He combined observations gathered across several journeys and also included information about places he may not have visited himself. He revised the work before its later publication.
    - text: Those features make the book useful in a different way. It gathers a wide survey rather than preserving a perfect route log. Readers must separate firsthand description, information learned through others, and the author's own cultural judgments.
    - text: Revision can organize scattered memories into a readable survey, but it may also blur which observation belongs to which journey.
  - id: p13
    illustration: p13
    paragraphs:
    - text: Put Ma Huan beside the court records. A court entry may date an embassy and name its official purpose. Ma Huan may describe the harbor market, local rules, or goods exchanged. The sources answer different questions.
    - text: They can also overturn a first conclusion. Court ceremony can suggest mainly peaceful diplomacy, but the Liujiagang inscription boasts of capturing resistant rulers and defeating armed opponents. The synthesis must therefore include coercion and force alongside diplomacy, trade, and worship.
    - text: Where sources overlap, historians compare names, places, order, and timing before deciding whether the details truly agree.
  - id: p14
    illustration: p14
    paragraphs:
    - text: The Mao Kun map adds a visual kind of record. Its surviving form appears in the Wubei Zhi, a military work compiled about two centuries after the first voyage. Scholars think a lost earlier version probably grew from fifteenth-century sailing knowledge.
    - text: This chain matters. The map is not a sheet carried home untouched from Zheng He's deck. It is later evidence that preserves older material after copying, arranging, and possible revision.
    - text: 'Its chain of custody is therefore a historical question: which features came from voyage-era practice, and which may reflect later editors?'
  - id: p15
    illustration: p15
    paragraphs:
    - text: The route runs like a long strip from Nanjing toward Southeast Asia, India, Arabia, and East Africa. Coastlines bend to serve the journey rather than a modern scale. Sailing notes record compass directions, travel time, stars above the horizon, and some water depths.
    - text: These details reveal a working seafarer's view. Landmarks appear in the order a crew might meet them. The map's shape therefore tells us about its purpose as well as geography.
    - text: Distorted coastlines are not simply mistakes; they may be useful choices that place route order above measured shape.
  - id: p16
    illustration: p16
    paragraphs:
    - text: Yet the surviving map could not guide a voyage by itself. It lacks much of the local knowledge needed to avoid every shoal, read changing conditions, or enter unfamiliar harbors safely. Some information may have remained oral or in lost sailing directions.
    - text: Its route also ends within the known Indian Ocean network. Turning the strip into a modern world map adds a scale, orientation, and destinations that the source does not contain.
    - text: A map's limit is evidence too, because it shows what the object was designed to do and what other knowledge sailors needed.
  - id: p17
    illustration: p17
    paragraphs:
    - text: Now place all four source types together. Court dates establish departures, orders, and returns. Harbor inscriptions summarize seven missions. Ma Huan describes Indian Ocean societies. The map preserves a route from China to East Africa with practical sailing information.
    - text: The basic route framework is well supported because several kinds of evidence preserve it. Their disagreements and silences also remain visible. Foreign accounts, sailors' voices, and many local responses are much harder to recover.
    - text: 'Together, the sources create boundaries: confidence rises where they converge and falls where every surviving trail disappears.'
  - id: p18
    illustration: p18
    paragraphs:
    - content:
      - text: 'The modern 1421 '
      - vocabulary:
          id: hypothesis
          text: hypothesis
      - text: " claims that parts of the sixth expedition crossed the Pacific, reached the Americas, and circled the globe. Its argument treats supposed gaps in the record and later maps as room for an enormous hidden journey."
    - text: But a gap is not a route. Before accepting the claim, historians ask whether its timeline works, whether contemporary sources point toward those oceans, and whether independent evidence confirms landfalls.
    - text: A serious hypothesis should also predict traces that investigators can seek, rather than treating every missing record as support.
  - id: p19
    illustration: p19
    paragraphs:
    - text: The documented sixth voyage leaves no empty years large enough for the proposed global circuit. Records trace ships through Southeast Asia and the Indian Ocean, then record their returns. Ma Huan's wide survey does not mention an American or Australian expedition.
    - text: The Mao Kun map points west through the Indian Ocean, not across the Pacific to the Americas. Scholars have also shown that evidence offered for 1421 depends on misread maps, borrowed claims, and changing explanations rather than secure finds.
    - text: The absence matters because several record types describe the sixth voyage in detail where the hidden circuit would need to fit.
  - id: p20
    illustration: p20
    paragraphs:
    - text: Missing evidence does not prove that an event was impossible. Many voices and documents vanish from every century. Still, a vast new route needs positive evidence, especially when it conflicts with the chronology and geography of surviving records.
    - text: Zheng He's voyages remain extraordinary within the limits the sources support. The records carry court ambition, religious gratitude, travelers' curiosity, navigators' practice, and the marks of later copying. Reading each source from its own position does not shrink the voyages; it lets their documented scale stand without a line invented afterward.
    - text: 'The most reliable conclusion is therefore proportional: strong where sources converge, cautious where they conflict, and open where evidence is truly absent.'
