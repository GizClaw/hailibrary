learning:
  goals:
    - Reconstruct the documented scope of Zheng He's seven voyages from several kinds of surviving evidence.
    - Evaluate how the position and purpose of court records, inscriptions, travel accounts, and navigation maps shape what they preserve.
    - Explain why agreement among independent sources strengthens a claim without making every detail certain.
    - Test the 1421 global-voyage hypothesis against chronology, route evidence, source provenance, and missing corroboration.
  concepts:
    - source position and intended audience
    - official histories and contemporary inscriptions
    - Ma Huan's travel account
    - the Mao Kun map and navigational knowledge
    - corroboration, absence, and burden of proof
