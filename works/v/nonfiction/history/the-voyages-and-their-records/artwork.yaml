schema_version: 1
style: cut-paper-collage
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  characters:
    zheng_he: Mature early-Ming Chinese admiral with a broad oval face, arched black brows, short trimmed mustache and goatee, black winged official cap without insignia, deep teal robe with wide sleeves, muted rust sash, and black cloth boots.
    ma_huan: Early-Ming Chinese interpreter in his thirties with a narrow face, short mustache, black cloth cap, warm ochre scholar's robe, dark blue sash, plain brown shoulder satchel, and rolled blank cream paper.
    ming_clerks: Early-Ming Chinese court clerks in muted indigo and brown robes with plain black caps, handling blank cream paper slips and unmarked scrolls.
  vessels: Large early-Ming wooden ocean-going ships with high sterns, multiple tan battened sails, dark wood hulls, muted red rail accents, and no flags, writing, emblems, or decorative dragons.
  source_objects: Cream folded court papers tied with indigo cord, gray-green stone steles with completely blank faces, a long tan route-scroll showing only coast-shaped paper edges, and a dark wooden compass bowl with an unmarked needle.
  palette: Deep teal, indigo, muted rust, warm ochre, cream, gray-green stone, dark brown wood, pale sea blue, and small coral-red accents.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Zheng He stands beside layered early-Ming ships on an Indian Ocean route, surrounded by a blank stone stele, folded court papers, Ma Huan's blank scroll, and a long coast-shaped route map, presenting records rather than a modern world conquest.
  - id: p01
    file: artwork/p01.webp
    scene: A modern globe made from layered paper sits on a research table while an unsupported bright ribbon loops around it and fades into loose scraps above the Pacific; no labels, borders, arrows, or writing.
  - id: p02
    file: artwork/p02.webp
    scene: Zheng He in his consistent deep-teal robe watches a fleet of early-Ming ships cross layered seas toward Southeast Asian, Arabian, and East African coastal silhouettes without a world-circle route.
  - id: p03
    file: artwork/p03.webp
    scene: "A top-down evidence table holds four separate wordless source objects: tied court papers, a blank stone stele, Ma Huan's rolled paper and satchel, and a long coast-shaped route scroll."
  - id: p04
    file: artwork/p04.webp
    scene: Ming clerks in consistent indigo and brown robes sort stacks of blank dated-looking paper slips by shape and cord color inside an early-Ming archive with no visible characters or numbers.
  - id: p05
    file: artwork/p05.webp
    scene: A Ming court audience places an enthroned emperor at the visual center while a foreign envoy and gift bearers stand below, showing the court's hierarchical viewpoint without symbols or written proclamations.
  - id: p06
    file: artwork/p06.webp
    scene: Court clerks view a departing fleet through a narrow palace window while layered paper silhouettes of sailors, merchants, and port residents remain outside the frame's edges, suggesting institutional selection.
  - id: p07
    file: artwork/p07.webp
    scene: At an early-Ming departure harbor, Zheng He and another commander oversee workers raising two gray-green stone steles with blank faces beside moored ships and temple roofs.
  - id: p08
    file: artwork/p08.webp
    scene: Zheng He stands before a blank public stele as layered scenes behind him show storm waves, a Tianfei temple roof, formal envoys, and guarded defeated fighters without active violence.
  - id: p09
    file: artwork/p09.webp
    scene: A blank stone stele and tied court papers sit side by side while matching colored harbor and ship shapes align across them; their shared Ming palette also shows that the sources are institutionally related.
  - id: p10
    file: artwork/p10.webp
    scene: On a Sri Lankan coastal terrace, a gray-green stone with three completely blank panels stands near three respectful community groups and distinct Buddhist, Islamic, and Hindu architectural silhouettes, with Zheng He's ship offshore.
  - id: p11
    file: artwork/p11.webp
    scene: Ma Huan in his consistent ochre robe interprets between Chinese sailors and Indian Ocean merchants at a busy harbor market, holding blank paper while foods, fabrics, and trade goods provide concrete detail.
  - id: p12
    file: artwork/p12.webp
    scene: Ma Huan arranges observation tokens from several voyages into one long blank scroll, with separate harbor miniatures and information passed through another traveler's hands.
  - id: p13
    file: artwork/p13.webp
    scene: A split but connected table pairs Ming court papers and a palace audience on one side with Ma Huan's harbor market observations on the other, joined by the same arriving ship.
  - id: p14
    file: artwork/p14.webp
    scene: In a later Ming study, a seventeenth-century compiler in a dark maroon robe assembles worn older route-scroll fragments into a bound military volume, all pages free of writing.
  - id: p15
    file: artwork/p15.webp
    scene: A long horizontal coast-shaped paper scroll winds past model mountains, islands, ships, an unmarked compass bowl, a sand timer, star cutouts, and a depth line, with no letters, numbers, arrows, or map labels.
  - id: p16
    file: artwork/p16.webp
    scene: The route scroll ends near an East African coastal silhouette while a pilot gestures toward real shoals, currents, and a harbor beyond the scroll's simplified shapes, showing knowledge the map alone lacks.
  - id: p17
    file: artwork/p17.webp
    scene: Four source objects converge around one layered Indian Ocean basin from China to East Africa, while empty spaces around ordinary sailors and foreign residents remain visibly open.
  - id: p18
    file: artwork/p18.webp
    scene: The documented Indian Ocean route-scroll rests on a table while ghostlike paper ship silhouettes and a loose modern globe ribbon fade over the Pacific, clearly separating the later hypothesis from surviving evidence.
  - id: p19
    file: artwork/p19.webp
    scene: A careful evidence balance holds dated-looking blank court slips, Ma Huan's scroll, and the Mao Kun route on one side, while unsupported loose map scraps toward the Americas lift away on the other.
  - id: p20
    file: artwork/p20.webp
    scene: Zheng He and Ma Huan stand apart within a broad layered Indian Ocean panorama as court papers, blank steles, and the route scroll frame the documented sea, while the speculative globe ribbon lies loose on the table.
