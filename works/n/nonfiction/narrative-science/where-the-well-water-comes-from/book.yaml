characters:
  - id: child
    kind: person
    description: A curious ten-year-old who measures carefully and learns to revise a first explanation.
    visual_identity: 'Ten-year-old Chinese child with warm tan skin, short straight black hair, faded teal short-sleeve shirt, rust-red knee-length shorts, off-white canvas shoes, and a small red field notebook with blank pages.'
  - id: well-keeper
    kind: person
    description: An experienced elderly well repairer who acts cautiously and admits what evidence cannot yet show.
    visual_identity: 'Lean elderly Chinese man with weathered tan skin, short cropped gray hair, woven straw hat, indigo long-sleeve work shirt with rolled cuffs, loose brown trousers, black cloth shoes, and a coiled metal measuring tape.'
  - id: mechanic
    kind: person
    description: A village mechanic who worries about his livelihood and then helps protect the water.
    visual_identity: 'Stocky middle-aged Chinese man with sun-browned skin, short coarse black hair graying at the temples, olive work jacket over a cream undershirt, dark charcoal trousers, sturdy brown boots, and thick gray work gloves.'
  - id: technician
    kind: person
    description: A town water technician who measures the site and keeps conclusions within the evidence.
    visual_identity: 'Chinese woman in her early forties with light tan skin, black hair in a low bun, pale yellow field jacket, navy trousers, mud-brown hiking shoes, clear safety glasses, and a dark green sampling case.'
