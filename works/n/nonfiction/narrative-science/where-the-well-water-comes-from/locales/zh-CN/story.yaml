schema_version: 3
language: zh-CN
writer: 北辰
title: 井水从哪里来
summary: '旱天里，阿满以为老井像一只被喝空的大缸。石伯带他沿河观察渗水、砂砾和黏土，说明地下水藏在土石空隙里，路径却不能只靠猜。发现坡上的漏油桶后，村民先采取不会后悔的保护行动，再请技术员测量。雨后井水没有立刻上涨，持续记录才让阿满看到迟来的变化，也学会在证据不足时给答案留白。'
chapters:
  - id: ch01
    title: 井桶触底
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 坡上的黑迹
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 雨后的记录
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: compare
    prompt: 阿满最初想象的井水和后来观察到的地下水有什么不同？
    answer: '他最初以为井下有一只大缸或一条地下河，后来发现水能存在砂砾和岩石的空隙里，并沿不同路径缓慢移动。'
    page_refs: [p02, p05, p06]
  - id: q02
    type: evidence
    prompt: 哪三条证据让阿满不再把地下水想成一条清楚的大河？
    answer: '湿沙能存水，黏土会减慢水向下渗，河床低处的砂粒之间会慢慢聚水。'
    page_refs: [p04, p05, p06]
  - id: q03
    type: character-motive
    prompt: 石伯还不知道坡地是否连着老井，为什么仍阻止倒灰水？
    answer: '因为油污一旦随地下水移动，可能危及全村的井；在查清以前，不该拿井水冒险。'
    page_refs: [p07, p08]
  - id: q04
    type: cause-effect
    prompt: 村民为什么既搬走漏桶，又请技术员测量？
    answer: '搬走漏桶能先减少污染风险，测量和取样则能帮助判断坡地、渗水和井之间究竟怎样相连。'
    page_refs: [p09, p10, p11]
  - id: q05
    type: evidence
    prompt: 哪些记录说明一场雨不会立刻把井灌满？
    answer: '雨夜和第二天的水位几乎没有变化，连续测到第十一天才出现小幅上升，而且这一次上升仍不能证明只来自那场雨。'
    page_refs: [p13, p14, p15]
  - id: q06
    type: evaluate
    prompt: 为什么阿满最后没有在记录本上画一条确定的箭头？
    answer: '测量显示地下水会缓慢变化，却还不能证明每滴水走过哪条路；留下空白比把可能路径当成事实更诚实。'
    page_refs: [p15, p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '旱天清晨，井桶没有“扑通”入水，反而“咚”地撞上井底。阿满只提起浅浅一层浑水，排队的人都握紧了空桶。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '第二天，石伯用带铁坠的细绳量水位。连续几天的刻度越来越深。阿满问：“井下的大缸被我们喝空了吗？”'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '“井只是伸到地下水里的一个口。”石伯合上井盖，“地下没有整齐的大缸。先去看看地面告诉我们什么。”'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '干河床上，一丛芦苇旁的湿沙闪着水光。石伯舀开浮泥，清水又从砂粒之间慢慢聚拢。这里是一处渗水。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '阿满把同样多的水倒进砂砾和黏土。水穿过砂砾，却在黏土上摊开。湿沙没有小河，空隙里仍存着水。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '石伯说，能储存并传送地下水的土石层叫含水层。雨水有的流走，有的被植物用掉，只有一部分渗入地下，路径还可能绕弯。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '回村时，一股柴油味从旧砖窑旁飘来。破桶倒在坡脚，黑迹停在砂砾边，周叔正要把一盆灰水泼下去。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '石伯拦住他：“我不知道这里是否连着老井，所以更不能拿全村的水试。先把灰水留住，再请人查。”周叔终于端回了盆。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '村民担心井，也担心修理棚停工。大家凑车费，周叔找来有盖的大桶。孩子只捡干净垃圾，沾油的东西留给戴手套的成年人。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '他们把漏桶移到托盘里，将废液装好送走，又在干净的裸坡挖浅草沟。下雨时，草沟能让急水慢下来，少带走泥土。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '镇里的技术员测量坡地和水位，又从渗水处与井里取样。她说这里可能接受雨水补给，但还不能断定哪些地下路径通向老井。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '阿满把图上的粗箭头改成虚线。已经量到的水位用实线表示，雨水在地面流过的路线则画成弯线。不同的线，表示不同把握。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '第七天夜里，大雨终于落下。坡上的新桶关得严实，雨水在草沟里铺开。阿满和石伯冒雨到井边，记下新的刻度。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '第二天，井水位几乎没有变化。石伯提醒阿满，雨水渗进地下需要时间，也可能流向别处。一场雨不是立刻装满井的水壶。'
    - id: p15
      illustration: p15
      paragraphs:
        - text: '他们每天同一时辰测量。第十一天，水位才稍稍升高。两人复测后记录下来，却没有说这一定是那场雨送来的水。'
    - id: p16
      illustration: p16
      paragraphs:
        - text: '初步水样没有显示坡上的油已经进入井里。周叔仍把废液桶留在棚下：“为什么非要等井水有油，才肯小心？”'
    - id: p17
      illustration: p17
      paragraphs:
        - text: '入秋后，草根抓住坡土，河床的渗水也变宽了一掌。新的地形和水位资料帮助技术员圈出一片需要优先保护、继续调查的坡地。'
    - id: p18
      illustration: p18
      paragraphs:
        - text: '春雨后，阿满独自量井水。他记下刻度，看见远处雨水进入草沟。地下的路还没有全弄清，他没有急着画箭头，只在本上留了半页空白。'
