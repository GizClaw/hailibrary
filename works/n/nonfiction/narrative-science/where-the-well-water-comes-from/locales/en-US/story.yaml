schema_version: 3
language: en-US
writer: north-star-map
title: Where the Well Water Comes From
summary: 'During a drought, Nora imagines that the village well is a drained underground tank. Mr. Vale leads her to observe a seep, gravel, and clay, showing that groundwater occupies spaces in earth and rock but does not follow a simple visible route. When they find leaking oil drums uphill, the village takes practical precautions while a hydrologist gathers evidence. A storm fails to raise the well at once, and patient measurements teach Nora to revise her map without pretending the remaining uncertainty is solved.'
chapters:
  - id: ch01
    title: The Bucket Hits Bottom
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: The Dark Streak
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: Records After Rain
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: compare
    prompt: How did Nora's first picture of groundwater differ from what she later observed?
    answer: 'She first imagined a drained underground tank or hidden river. She later observed water held in spaces among sand, gravel, and rock, moving slowly along more than one possible path.'
    page_refs: [p02, p05, p06]
  - id: q02
    type: evidence
    prompt: Which three observations challenged the idea of one clear underground river?
    answer: 'Wet sand held water, clay slowed water moving downward, and water slowly gathered between grains at the seep.'
    page_refs: [p04, p05, p06]
  - id: q03
    type: character-motive
    prompt: Why did Mr. Vale stop the wash water before knowing whether the hill supplied the well?
    answer: 'Oil might move with groundwater and threaten the village well. He would not risk the water while the underground connection was still uncertain.'
    page_refs: [p07, p08]
  - id: q04
    type: cause-effect
    prompt: Why did the villagers both remove the leaking drums and ask for measurements?
    answer: 'Removing the drums reduced an immediate pollution risk. Measurements and samples could help reveal how the hill, seep, and well were connected.'
    page_refs: [p09, p10, p11]
  - id: q05
    type: evidence
    prompt: Which records showed that one storm would not fill the well immediately?
    answer: 'The level barely changed during the storm or the next morning. A small rise appeared only on the eleventh day, and that single rise could not prove the storm was its only source.'
    page_refs: [p13, p14, p15]
  - id: q06
    type: evaluate
    prompt: Why did Nora leave her final map unfinished instead of drawing one certain arrow?
    answer: 'Measurements showed slow change but could not prove the route taken by each drop. Leaving space was more accurate than turning a possible path into a fact.'
    page_refs: [p15, p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'One dry morning, the bucket struck the well bottom instead of splashing. Nora pulled up only a shallow layer of cloudy water. Every person in line tightened a hand around an empty can.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'The next day, Mr. Vale lowered a weighted tape. The water surface had dropped each day. “Did we empty a giant tank under the village?” Nora asked.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '“A well is only an opening into groundwater,” Mr. Vale said. “The ground is not one tidy tank. Let us see what the surface can tell us.”'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'In the dry creek, damp sand glimmered beside a clump of reeds. Mr. Vale cleared away leaves. Water slowly gathered again between the grains. This was a seep.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'Nora poured equal cups onto gravel and clay. Water slipped through the gravel but spread across the clay. No stream crossed the damp sand, yet spaces inside it held water.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'Earth or rock that can store and carry groundwater is called an aquifer. Some rain runs away or feeds plants. Only part sinks underground, and its route may bend.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'On the walk home, diesel fumes drifted from an old shed. Dented drums lay uphill. A dark stain ended beside gravel while Mr. Rusk lifted a basin of gray wash water.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Mr. Vale stopped him. “I do not know whether this ground supplies our well. That is why we should not test it with the village water. Save the wash water while we investigate.”'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Villagers worried about the well and the repair shop. They shared hauling costs, and Mr. Rusk found sealed containers. Children gathered only clean litter; adults in gloves handled oily waste.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'They set leaking drums in trays and shipped the waste away. On clean bare soil, they dug shallow grassy dips. During rain, the dips would slow runoff and reduce muddy erosion.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'A county hydrologist measured the slope and water levels, then sampled the seep and well. Rain might recharge groundwater here, she said, but the routes to the well remained uncertain.'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Nora replaced the bold arrow on her map with dashes. Solid lines showed measured water levels. Curves followed rain across the surface. Each kind of line showed a different degree of certainty.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'Rain finally arrived on the seventh night. New containers stayed closed under cover, and runoff spread through the grassy dips. Nora and Mr. Vale measured the well in the storm.'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'The level barely changed by morning. Rain needs time to enter the ground, Mr. Vale explained, and it may travel elsewhere. A storm does not pour straight into a well.'
    - id: p15
      illustration: p15
      paragraphs:
        - text: 'They measured at the same hour each day. On day eleven, the level rose slightly. They checked twice before recording it, but did not claim that the storm was its only source.'
    - id: p16
      illustration: p16
      paragraphs:
        - text: 'Early samples did not show oil from the hill in the well. Mr. Rusk still kept the waste containers covered. “Why wait until oil reaches our tap before being careful?” he asked.'
    - id: p17
      illustration: p17
      paragraphs:
        - text: 'By autumn, grass roots held the slope and the seep had widened. New land and water-level evidence helped the hydrologist mark an area for protection and further study.'
    - id: p18
      illustration: p18
      paragraphs:
        - text: 'After a spring rain, Nora measured alone. She recorded the depth and watched runoff enter the grassy dips. The underground routes were still unfinished, so she left half a page blank.'
