schema_version: 1
required: true
sources:
  - url: https://cloudatlas.wmo.int/en/definitions-of-clouds.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - The WMO recognizes ten cloud genera, including Cirrus, Nimbostratus, Cumulus, and Cumulonimbus.
      - Cloud genera are distinguished by typical form and other essential characteristics rather than by color alone.
  - url: https://cloudatlas.wmo.int/en/clouds-genera-cumulus.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - Cumulus clouds are detached and generally dense, with sharp outlines, rounded or tower-like tops, and relatively dark, nearly horizontal bases.
      - A gray or dark-looking base can therefore occur on cumulus and does not by itself prove that rain will fall.
  - url: https://cloudatlas.wmo.int/en/clouds-genera-cirrus.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - Cirrus appears as detached white, delicate, fibrous filaments, patches, or narrow bands.
  - url: https://cloudatlas.wmo.int/en/clouds-genera-nimbostratus.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - Nimbostratus is a gray, often dark, thick cloud layer whose appearance is made diffuse by more or less continuous rain or snow.
      - Nimbostratus is thick enough to hide the Sun.
  - url: https://cloudatlas.wmo.int/en/clouds-genera-cumulonimbus.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - Cumulonimbus is a heavy, dense cloud with great vertical extent, often resembling a mountain or huge tower.
      - Its upper portion commonly spreads into an anvil or broad plume, and its base is often very dark.
  - url: https://cloudatlas.wmo.int/en/Associated-cloud-forms-table.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - Rain is usual with nimbostratus, showers are possible from cumulus, and showers are usual with cumulonimbus.
      - Cloud genus indicates an association with precipitation, not a guarantee that a particular observed cloud will rain at one location.
  - url: https://cloudatlas.wmo.int/conditions-coding-of-clouds.html
    publisher: World Meteorological Organization, International Cloud Atlas
    claims:
      - Correct cloud observation may require watching the whole sky and following how clouds evolve over time.
      - Transitional cloud forms can be difficult to identify from a single moment.
  - url: https://www.weather.gov/lmk/cloud_classification
    publisher: National Weather Service, National Oceanic and Atmospheric Administration
    claims:
      - Cirrus clouds are often the first sign of an approaching warm front; as the front approaches, they may thicken into cirrostratus and then thicken and lower through altostratus or stratus into nimbostratus.
      - Scattered cumulus with little vertical growth may occur in fair weather.
      - Nimbostratus produces steady rain or snow.
      - Cumulus that develops strongly upward can become cumulonimbus when moisture, lift, and instability are sufficient, bringing a thunderstorm and heavy rain.
  - url: https://www.cma.gov.cn/zfxxgk/gknr/flfgbz/bz/202209/P020220921697063935195.pdf
    publisher: China Meteorological Administration
    claims:
      - Chinese meteorological standard QX/T 427-2018 lists 卷云, 雨层云, 积云, and 积雨云 as cloud-type names corresponding to Ci, Ns, Cu, and Cb.
      - The official Chinese terms used in the locale match the internationally recognized cloud genera.
  - url: https://www.weather.gov/safety/lightning-safety
    publisher: National Weather Service, National Oceanic and Atmospheric Administration
    claims:
      - If thunder is heard, people outdoors should move to safe indoor shelter rather than wait for rain.
      - There is no safe outdoor place while a thunderstorm is in the area.
  - url: https://www.weather.gov/mlb/lightning_rules
    publisher: National Weather Service, National Oceanic and Atmospheric Administration
    claims:
      - Before outdoor recreation, people should check the latest thunderstorm forecast and continue to monitor weather information.
      - Once indoors during a thunderstorm, people should move away from windows and doors.
notes: >-
  The river town, seven-day diary, individual cloud observations, and exact
  sequence of dry periods and showers are fictional but meteorologically
  plausible. The story never treats darkness as a cause of rain or any cloud
  sighting as a certain forecast. Tuesday's cirrus, Wednesday's spreading,
  thickening, and apparently lowering layer, and the later steady rain form an
  observed sequence that may fit an approaching warm front, but the characters
  use it only as a clue rather than identifying a front or promising rain. Lili
  and Yan also compare shape, vertical growth, sky coverage, thunder, and the
  weather that followed. Nimbostratus is named only after continuous rain
  begins, while the rapidly growing tower is identified as cumulonimbus after
  thunder and an anvil-like top provide additional evidence. The children go
  indoors at the first thunder. Readers are reminded that field clues do not
  replace an official weather forecast.
