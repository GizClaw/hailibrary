schema_version: 2
language: en-US
writer: north-star-map
title: The Cloud Diary
summary: Lili records one week of clouds in Grandma Ruan's weather garden. Yan expects every dark cloud to bring rain, but dry days and two different rain clouds challenge his rule. Together they learn to compare cloud shape, growth, and later weather before revising a prediction.
chapters:
  - id: ch01
    title: A Dark Cloud Base
    page_refs: [p01, p02, p03]
  - id: ch02
    title: Threads and a Gray Sheet
    page_refs: [p04, p05, p06, p07, p08]
  - id: ch03
    title: The Growing Tower
    page_refs: [p09, p10, p11, p12]
  - id: ch04
    title: Seven Days of Evidence
    page_refs: [p13, p14, p15, p16]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: What evidence showed that Yan's first rule did not always work?
    answer: Monday's cumulus clouds had gray, dark-looking bases, but they did not grow taller and no rain fell.
    page_refs: [p02, p03]
  - id: q02
    type: compare
    speaker: narrator
    prompt: How did Wednesday's rain cloud differ from Monday's clouds?
    answer: Wednesday's cloud formed a thick, wide layer that hid the sun and brought steady rain. Monday's clouds were separate and dry.
    page_refs: [p02, p03, p06, p07]
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why did Grandma Ruan lead the children indoors before the heavy shower began?
    answer: They heard thunder, so she took them to safe shelter without waiting for the rain.
    page_refs: [p11, p12]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why did Lili leave the cloud name blank on Wednesday morning?
    answer: She wanted to record what she could see before deciding which cloud type matched all the evidence.
    page_refs: [p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: Which signs made Thursday's shower prediction stronger?
    answer: The cloud grew upward quickly into a deep tower, and thunder followed.
    page_refs: [p10, p11, p12]
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What did the seven-day diary help the children understand?
    answer: Cloud color alone was weak evidence. High, thin clouds were followed by a spreading sheet that thickened and looked lower before rain, offering a clue but no promise. Shape, growth, sky coverage, thunder, and later weather made predictions more useful.
    page_refs: [p03, p04, p06, p08, p10, p11, p13, p16]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: Why was Yan's final prediction stronger than his first one?
    answer: He said rain was only possible, named continued upward growth as evidence to watch, and waited for the observed result.
    page_refs: [p01, p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "On Monday morning, Lili brought her orange notebook to Grandma Ruan's old weather garden. She planned to watch the sky there for seven days. Her younger cousin Yan arrived in his blue raincoat and announced, “Dark clouds mean rain. I can predict the whole week.” Grandma Ruan said, “Then record what happens after each guess.”"
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "Above the levee, separate white clouds had rounded tops and flat, gray bases. While Lili checked Grandma Ruan's cloud guide, Yan studied their darker parts. “These are "
            - vocabulary: {id: cumulus, text: cumulus}
            - text: " clouds,” she said. Yan pointed to one gray base and predicted rain before lunch."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Although the clouds crossed the town, they never grew taller, and the rice-field paths were still dry by evening. Lili wrote the result beside Yan's guess. Grandma Ruan asked, “Was the base dark?” “Yes,” Yan said. “Did it rain?” “No,” he answered, folding down his unused hood."
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "On Tuesday, thin white threads curved high above the tiled roofs. Lili said, “These are "
            - vocabulary: {id: cirrus, text: cirrus}
            - text: " clouds, not the low rounded clouds from yesterday.” Such high, thin clouds can be an early clue that weather is changing, but they don't promise rain. Yan searched for a dark base, found none, and kept watching."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "As the white threads spread farther across the sky, no rain reached the garden that day. Lili recorded their shape, height, and the dry path so she could compare them with what came next. Yan said, “I won't write the ending before it happens.”"
    - id: p06
      illustration: p06
      paragraphs:
        - text: "By Wednesday, the high thin clouds had given way to a gray sheet spreading across the sky. It thickened, hid the sun, and seemed to lower toward the hills. Lili said, “I'll leave the cloud name blank for now,” while recording its shape, coverage, and the time."
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Before noon, fine rain crossed the river and kept falling. In the guide, "
            - vocabulary: {id: nimbostratus, text: nimbostratus}
            - text: " was shown as a thick, broad layer linked with steady rain. The picture and words matched the sky. Yan said, “This dark cloud did bring rain.” Grandma Ruan asked, “How was it different from Monday's clouds?”"
    - id: p08
      illustration: p08
      paragraphs:
        - text: "Yan traced the change through the diary. “First the high, thin clouds spread. Then the sheet grew thicker, looked lower, and hid the sun before steady rain began.” Lili marked the sequence as a useful clue, not a promise. By Thursday morning, the layer had broken into patches, and sunlight reached the wet fields."
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "After lunch on Thursday, small "
            - vocabulary: {id: cumulus, text: cumulus}
            - text: " clouds appeared again. At first, they looked much like Monday's clouds. Lili drew one cloud's low, rounded outline, then closed the notebook until the next check."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Between two checks, that cloud grew much taller as its bright top rose in large folds and its base widened. Lili drew the new outline beside the first. Yan didn't predict rain right away. “It's getting taller fast. Maybe it'll bring a shower,” he said."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "A low roll of thunder came from beyond the river. Grandma Ruan did not wait for rain. “Inside, both of you,” she said. She led Lili and Yan away from the open garden and kept them back from the windows."
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "From deep inside the room, they saw the tall cloud spread a flat top. Lili checked the guide. “The tower has become a "
            - vocabulary: {id: cumulonimbus, text: cumulonimbus}
            - text: " cloud,” she said. A heavy shower fell on the garden for a short time, then stopped."
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "On Friday, puddles shone beside the weather instruments. Lili placed Monday's "
            - vocabulary: {id: cumulus, text: cumulus}
            - text: " sketch beside Thursday's tower. Both clouds had dark bases, but only one had grown quickly and brought a heavy shower. Yan pointed to the tower sketch. “It grew so much taller,” he said."
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "Saturday's sky held high "
            - vocabulary: {id: cirrus, text: cirrus}
            - text: " clouds and small "
            - vocabulary: {id: cumulus, text: cumulus}
            - text: " clouds. After Yan compared them with the earlier pages, he said, “I can't tell yet if it'll rain.” They carried coats because the weather could still change. As they walked, the high clouds stayed thin, the low clouds stayed small, and the afternoon remained dry."
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: "On Sunday, a row of "
            - vocabulary: {id: cumulus, text: cumulus}
            - text: " clouds appeared over the warm fields. Yan made one last prediction. “Maybe there will be a shower if those clouds keep growing.” Lili said, “Let's wait and see. We can check the official weather forecast too.”"
    - id: p16
      illustration: p16
      paragraphs:
        - text: "By sunset, the clouds had stopped growing, and no rain had fallen. After Lili wrote the week's last result and closed the diary, Yan studied one cloud with a gray base. Instead of announcing rain, he asked, “How is it changing?”"
