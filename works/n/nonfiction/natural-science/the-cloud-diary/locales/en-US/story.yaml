        timbre: clear young voice with a light, focused tone
        pace: measured medium-slow
        pitch: middle-high
    yan:
      display_name: Yan
      tts:
        delivery: loud, quick, and full of guesses
        timbre: bright young voice with a lively edge
        pace: fast
        pitch: high
    grandma-ruan:
      display_name: Grandma Ruan
      tts:
        delivery: calm and gently questioning
        timbre: mellow older voice with a dry warmth
        pace: unhurried
        pitch: middle-low
