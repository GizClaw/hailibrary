schema_version: 2
language: zh-CN
writer: 北辰
title: 七天云日记
summary: 莉莉在阮奶奶家的观测园里连续七天记云。阿岩起初认定黑云一定带雨，可几个没有下雨的日子和两种不同的雨云改变了他的想法。他们学会把云的形状、变化和后来发生的天气放在一起比较。
chapters:
  - id: ch01
    title: 灰暗的云底
    page_refs: [p01, p02, p03]
  - id: ch02
    title: 白丝与灰幕
    page_refs: [p04, p05, p06, p07, p08]
  - id: ch03
    title: 长高的云塔
    page_refs: [p09, p10, p11, p12]
  - id: ch04
    title: 七天的证据
    page_refs: [p13, p14, p15, p16]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据说明阿岩最初的说法并不总是对？
    answer: 星期一的积云有灰暗的底部，却没有继续长高，后来也没有下雨。
    page_refs: [p02, p03]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 星期三的雨云和星期一的云有什么不同？
    answer: 星期三的云连成厚厚的一大片，挡住太阳，还带来连续的雨；星期一的云一朵朵分开，没有下雨。
    page_refs: [p02, p03, p06, p07]
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 大雨还没来，阮奶奶为什么就带孩子们进屋？
    answer: 他们已经听见雷声，阮奶奶没有等下雨就带大家进了安全的室内。
    page_refs: [p11, p12]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 星期三早上，莉莉为什么先空着云名？
    answer: 她想先记下亲眼看到的样子，再等更多证据来判断云的种类。
    page_refs: [p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: 星期四出现了哪些信号，让阵雨的猜想更有根据？
    answer: 云在两次观察之间很快向上长高，后来又传来了雷声。
    page_refs: [p10, p11, p12]
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: 七天的记录让孩子们明白了什么？
    answer: 只看云的颜色不够。高处的薄云先铺开，云层再变厚，看起来更低，后来下起了雨，这是一条线索，却不能保证下雨。还要比较云形、生长、云遮住了多少天空、雷声和后来发生的天气。
    page_refs: [p03, p04, p06, p08, p10, p11, p13, p16]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 阿岩最后的猜想为什么比第一天更可靠？
    answer: 他只说也许有雨，还指出要继续看云会不会长高，并等着核对真正的结果。
    page_refs: [p01, p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "星期一一早，林莉莉拿着橙色笔记本，来到阮奶奶屋后的老观测园。她准备在这里连续记七天的云。小表弟阿岩套着蓝雨衣跑来，开口就说：“云一变黑，雨就要来。”阮奶奶扶扶草帽，提醒他：“那就把后来发生的事也记上吧。”"
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "河堤上空飘着一朵朵白云，顶部鼓起，底部平平的，带一点灰。莉莉查过云图，说：“这种云叫"
            - vocabulary: {id: cumulus, text: 积云}
            - text: "。”阿岩盯住灰暗的云底，猜午饭前一定下雨。"
    - id: p03
      illustration: p03
      paragraphs:
        - text: "云朵没有继续长高，慢慢飘过小镇，彼此越飘越远。傍晚，稻田边的小路还是干的。莉莉把结果写在猜想旁边。阮奶奶问：“云底暗不暗？”阿岩点头。“下雨了吗？”阿岩摇头，把没用上的雨帽放了下来。"
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "星期二，瓦屋顶上方出现几缕白丝，位置很高。莉莉认出它们：“这是"
            - vocabulary: {id: cirrus, text: 卷云}
            - text: "，和昨天低低的云不一样。”这种又高又薄的云有时是天气将变的早期线索，却不能保证会下雨。阿岩找了找灰暗的云底，没找到，便继续观察。"
    - id: p05
      illustration: p05
      paragraphs:
        - text: "两人跟着阮奶奶看了几次。高处的白丝越铺越开，可一整天都没有雨落到园里。莉莉记下云的形状、位置和干燥的小路，好和接下来的变化比较。阿岩说：“这回我不抢着写结果了。”"
    - id: p06
      illustration: p06
      paragraphs:
        - text: "到了星期三，高处的薄云不见了，灰色云层已经铺满天空。它渐渐变厚，遮住太阳，看起来比前一天低，贴近了山头。莉莉说：“云名先空着。”等待时，她只记下形状、云遮住了多少天空和时间。"
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "中午前，细雨越过河面，一直下着。云图上的"
            - vocabulary: {id: nimbostratus, text: 雨层云}
            - text: "正是厚厚的一大片，常带来连续的雨。阿岩看着屋外说：“这片黑云真的下雨了。”阮奶奶问：“它和星期一的云，还有哪里不同？”"
    - id: p08
      illustration: p08
      paragraphs:
        - text: "阿岩顺着日记想了想，说：“先是高高的薄云越铺越开。后来云层变厚，看起来更低，还挡住太阳，接着才下起连绵的雨。”莉莉把这段变化记作一条线索，而不是下雨的保证。星期四早上，云层散成一片片，阳光重新落到湿亮的稻田里。"
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "星期四午后，小片"
            - vocabulary: {id: cumulus, text: 积云}
            - text: "又出现在田野上空。刚开始，它们很像星期一的云。莉莉画下一朵云低低的圆顶，合上本子，等着下一次观察。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "两次观察之间，那朵云向上长高了许多。明亮的云顶一层层鼓起，云底也变宽了。莉莉把新的轮廓画在旧图旁边。阿岩没有马上喊下雨，只说：“它长得真快，也许会带来一阵雨。”"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "河对岸传来低低的雷声。雨还没下，阮奶奶就说：“你们两个，马上进屋。”她带着莉莉和阿岩离开空旷的观测园，进屋后也不让他们靠在窗边。"
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "三个人站在屋里离窗很远的地方，看见高大的云顶向一边铺开。莉莉查了云图，说：“云塔已经变成"
            - vocabulary: {id: cumulonimbus, text: 积雨云}
            - text: "。”观测园里很快下起一阵大雨，没过多久就停了。"
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "星期五，观测仪器旁留着几个亮亮的水洼。莉莉把星期一的"
            - vocabulary: {id: cumulus, text: 积云}
            - text: "图和星期四的高塔图放在一起。两朵云的底部都暗，可只有一朵很快长高，还带来了大雨。阿岩指着高塔图说：“它长高了这么多。”"
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "星期六，高处有"
            - vocabulary: {id: cirrus, text: 卷云}
            - text: "，低处也有小片"
            - vocabulary: {id: cumulus, text: 积云}
            - text: "。阿岩翻回前几页，说：“我还不能说一定会下雨。”他们带着雨衣走上河堤。那天下午，高云仍旧很薄，低云也没有长高，园里一直是干的。"
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: "星期日，田野上空又出现一排"
            - vocabulary: {id: cumulus, text: 积云}
            - text: "。阿岩写下最后一次猜想：“如果它们接着长高，也许会有阵雨。”莉莉说：“先等等看，我们也可以查查官方天气预报。”"
    - id: p16
      illustration: p16
      paragraphs:
        - text: "日落前，云没有再长高，雨也没来。莉莉写完最后一条记录，合上本子。阿岩望着一朵灰底白云，这次没有宣布要下雨，而是问：“它接下来会怎么变？”"
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 专注观察，语气温暖克制
        timbre: 清晰柔和的成年声音
        pace: 平稳中速
        pitch: 中音
    lili:
      display_name: 林莉莉
      tts:
        delivery: 说得小心又准确，语气里藏着兴奋
        timbre: 清亮而专注的女孩声音
        pace: 稍慢而有分寸
        pitch: 中高音
    yan:
      display_name: 阿岩
      tts:
        delivery: 声音响亮，说得很快，猜想一个接一个
        timbre: 明亮有冲劲的男孩声音
        pace: 快速
        pitch: 高音
    grandma-ruan:
      display_name: 阮奶奶
      tts:
        delivery: 平静亲切，常用问题引着孩子想
        timbre: 温厚略带沙哑的老年女声
        pace: 从容缓慢
        pitch: 中低音
