schema_version: 1
id: the-cloud-diary
type:
  - reading
  - narrative-nonfiction
style: naturalistic-storybook
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - nature
    - science
  themes:
    - curiosity
    - discovery
    - problem-solving
  moods:
    - calm
    - reflective
    - hopeful
series:
  id: field-notebook
  sequence: 2
  localizations:
    en-US: Field Notebook
    zh-CN: 野外笔记
characters:
  - id: narrator
    kind: narrator
    description: A warm field narrator who separates observation, prediction, and result.
    voice_identity: clear, attentive, quietly warm
  - id: lili
    kind: character
    description: An older child who records cloud shapes and tests each weather guess against what happens next.
    visual_identity: Chinese girl about 9-11, long black ponytail, olive field vest with pockets, orange-covered notebook, pencil behind one ear.
    voice_identity: careful, precise, secretly excited
  - id: yan
    kind: character
    description: Lili's younger cousin, whose quick rain predictions give the week-long cloud study its first question.
    visual_identity: Chinese boy about 7-9, short spiky hair, blue raincoat, magnifying glass on a cord.
    voice_identity: loud, fast, full of guesses
  - id: grandma-ruan
    kind: character
    description: An experienced observer who guides the children by asking which details support each prediction.
    visual_identity: Chinese woman about 68, short silver hair, wide straw hat, gray cardigan, binoculars.
    voice_identity: calm, asks questions instead of giving answers
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Identify four cloud genera from visible form and change over time.
    - Compare a weather prediction with the observed result and revise an unreliable rule.
    - Combine cloud shape, cloud change, and later weather as evidence without claiming certainty.
  concepts:
    - cloud classification
    - weather observation
    - prediction and evidence
    - thunderstorm safety
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
