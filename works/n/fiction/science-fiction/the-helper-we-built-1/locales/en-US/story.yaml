  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "On Saturday morning, Helper sorted an empty cup correctly. Dev cheered, while Nora first checked that the stop button cut the motor. They had assumed accurate sorting would prove the whole design successful."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "Helper could only compare shape, material, and weight. When uncertain, it was supposed to turn amber and wait for a person. Stopping safely mattered as much as choosing the correct material category."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Mr. Lewis opened an old tin filled with carefully placed screws. He asked, “How can a machine know whether an object is still wanted?” The answer had seemed obvious to Dev, so he never examined it."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "During the first trial, Helper waited two minutes beside a greasy carton. Neighbors applauded, but Dev saw only the showcase word efficiency. He treated the machine’s careful pause as his own public failure."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "While Nora bought connectors, Dev shortened the wait to twenty seconds and allowed Helper to choose its closest match. The change increased speed while quietly removing an important protection."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Nora knew restoring the setting took two clicks. She disliked the change but did not stop the trial; she only required the remote. Fear of losing their shared work kept her objection inside the notebook."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "The next day, Helper grabbed Mrs. Patel’s broken umbrella. Its motor pulled until Nora pressed the emergency stop. The motor current climbed as the owner fought to keep her property."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "The umbrella cloth was meant for kite tails. Dev added “only collect objects on the ground,” but the umbrella had been on the ground. A distance sensor could not understand what someone planned to keep."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "He added a six-foot distance. Nora asked whether distance proved an owner was finished, yet Dev continued the trial. The clear measurement was still only the young makers’ unsupported guess."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "Before the outdoor movie, wind carried Milo’s planet drawing across the courtyard. Helper caught it and dropped it into the blue bin. The planet drawing stayed the same; only the machine’s category changed."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "Dev could not find the remote. When Helper grabbed a small blanket, he crossed the crowd and pulled the main battery connector. The promised safety tool was now sitting uselessly inside the workshop."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "Without power, the claw stayed locked. The two makers loosened its joint with a wrench as the neighbors watched in silence. Mechanical failures were visible, but a mistaken goal could run normally."
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "Lemonade had blurred blue Saturn. The bin also held a denture case, cat food, and Mr. Lewis’s old tin of screws. The objects looked different, yet each had an owner the camera missed."
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "Dev offered to buy replacements, but the slots inside the tin fit Mr. Lewis’s habits. A price could not restore every object. Repair had to begin by admitting what replacement could never restore."
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "Nora showed everyone the test notebook. She admitted that she had seen the risk and had failed to stop it. Her silence had shaped the design, so she could not stand outside its failure."
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "They canceled the showcase and pushed Helper home. Popcorn on one wheel made a soft tap with every turn. They finally placed repairing harm ahead of proving that the invention worked."
          }
        ]
      }
    ]
  }
}
