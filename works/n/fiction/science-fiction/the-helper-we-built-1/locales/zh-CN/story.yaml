  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "周六早上，小丁把空杯准确投进回收箱。周屿欢呼，许安却先检查急停能否切断电机。两个人原以为分类准确就等于设计成功。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "小丁只会比较形状、材质和重量。拿不准时，它本该亮黄灯，等人处理。这种停下来的能力和分拣一样重要。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "梁叔打开旧铁盒，里面全是分好位置的螺丝。他问：“机器怎么知道东西还要不要？”周屿当时觉得答案显而易见，却没有说出口。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "第一次试运行，小丁在脏纸盒前等了两分钟。邻居鼓掌，周屿却只看到评审表上的“效率”。他把机器的犹豫看成了自己的失败。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "许安去买插头时，周屿把等待改成二十秒，并允许小丁选择最接近的类别。这个改变提高速度，也删掉了重要的保护。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "许安知道恢复设置只需点两下。她没有同意改动，却也没有按下停止，只要求周屿带好遥控器。她担心失去共同成果，因此把反对留在纸上。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
      "text": "第二天，小丁捡起赵奶奶的断伞。她抓住伞柄，电机仍然用力，直到许安按下急停。夹爪松开后，赵奶奶把断伞抱回怀里。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
      "text": "断伞的布要做风筝尾巴。周屿加上“只捡地上的东西”，却无法回答地上的伞为什么例外。测量距离也不能理解物品背后的打算。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "他又设定物品离人两米才捡。许安追问距离是否能证明主人不要它，周屿仍决定继续。这个数字看似清楚，实际只是孩子们的猜测。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "露天电影前，风把林豆的行星画吹出三米。小丁追上去，把它投进蓝箱。纸上的行星没有变化，改变的是机器给它的类别。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "周屿摸不到遥控器。小丁又夹住薄毯，他只好穿过人群，拔掉主电池。他答应随身携带的保护工具，此刻却不在手边。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
      "text": "断电后，夹爪仍然锁着。两个孩子用扳手松开连接轴，邻居们沉默地围在旁边。电机停了，薄毯却还没有从夹爪里松开。"
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "蓝色土星被饮料泡坏了。箱里还有假牙盒、猫粮，以及梁叔那只装满螺丝的旧铁盒。这些东西外表不同，却都有机器看不见的主人。"
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
      "text": "周屿答应买新的，梁叔却让他先归还还能归还的原物。价钱不能还原每一件东西，那张泡坏的土星画也无法变回原样。"
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "许安拿出测试本，承认自己看见风险却没有停止。她不再把错误只算在周屿身上。她的沉默也是一次设计选择，并非站在错误之外。"
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "他们取消评审，把小丁推回棚里。粘着爆米花的轮子每转一圈，都发出一声轻响。他们终于把展示成功放在了修复损害之后。"
          }
        ]
      }
    ]
  }
}
