schema_version: 1
language: zh-CN
writer: 北辰
title: 借来安静的小镇
summary: 索尔设计的全镇天幕减弱了刺耳噪声，也遮住了有用的车铃、音乐和车辆警告。居民证明声音在不同地方有不同意义，于是用局部选择和多种警报替代了单一的自动设置。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 冷静并关注社会细节, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  sol: {display_name: 索尔, tts: {delivery: 起初自信后来认真反思, timbre: 平稳的成年声音, pace: 中速, pitch: 中音}}
  neri: {display_name: 内里, tts: {delivery: 务实而坦率, timbre: 沉稳的成年声音, pace: 中速, pitch: 中低音}}
  yun: {display_name: 云, tts: {delivery: 通过翻译表达得从容温暖, timbre: 温暖的年长声音, pace: 中慢, pitch: 中音}}
  ama: {display_name: 阿玛, tts: {delivery: 有节奏并直截了当, timbre: 明亮的少年声音, pace: 中快, pitch: 中高音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "施工、车辆、音乐和谈话一起挤进小镇广场。"}, {speaker: narrator, text: "有些居民难以休息，也听不清身边的人。"}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "索尔展示一块透明的声音天幕。"}, {speaker: sol, text: "它会识别反复出现的机器声，在声音扩散前把它减弱。"}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "刺耳的钻孔声在天幕下淡去。"}, {speaker: narrator, text: "邻居放松下来，附近的谈话也更容易听清。"}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "镇议会批准在整个广场安装天幕。"}, {speaker: sol, text: "很快，小镇需要休息时就能借来安静。"}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "内里骑进过滤区，按响自行车铃。"}, {speaker: neri, text: "声音太轻，前面的行人根本没有回头。"}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "阿玛在手鼓上敲出轻快节奏。"}, {speaker: ama, text: "天幕削掉了清脆的鼓点，我的音乐散架了。"}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "索尔调整控制器，却把两种损失叫作小问题。"}, {speaker: sol, text: "系统消除的不需要声音，还是比需要的声音多。"}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "云在花园风铃旁用手语表达，翻译员说出他的意思。"}, {speaker: yun, text: "不要以为安静对每个人都有相同含义。"}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "居民把代表声音的物品放进“需要”和“不需要”的篮子。"}, {speaker: narrator, text: "索尔以为每种声音只会进入一个篮子。"}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "结果，同一面鼓、同一个铃和喷泉都出现在两边。"}, {speaker: neri, text: "声音的意义取决于地点、时间和用途。"}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "索尔看着互相冲突的选择。"}, {speaker: ama, text: "统计一次喜好，不能替大家永远决定公共问题。"}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "一辆维修车向广场驶来。"}, {speaker: narrator, text: "它的警告声和其他机械声一起被削弱了。"}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "内里看到车灯闪烁，及时把一个孩子带到旁边。"}, {speaker: neri, text: "这种警告本该得到更可靠的保护。"}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "索尔关闭全镇天幕，并如实说明故障。"}, {speaker: sol, text: "一种设置会遮住安全信息，就不能只用便利替它辩护。"}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "大家比较能听见的铃、明亮的灯和会振动的长椅。"}, {speaker: yun, text: "重要警报应该通过不止一种方式到达。"}]}
  - {id: p16, illustration: p16, lines: [{speaker: yun, text: "建立由使用者自己控制的小型安静区。"}, {speaker: narrator, text: "这个方案用多个局部选择替代了全镇唯一的选择。"}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "阿玛在安静阅读花园旁测试音乐区。"}, {speaker: narrator, text: "一边的节奏保持清楚，却没有强烈闯进另一边。"}]}
  - id: p18
    illustration: p18
    lines:
      - speaker: narrator
        content: [{text: "内里测试一条保留警告声的自行车"}, {vocabulary: {id: route, text: 路线}}, {text: "。"}]
      - {speaker: narrator, text: "她还没骑到身边，行人就能听见铃声。"}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "索尔把实体控制器装在几种都容易够到的高度。"}, {speaker: sol, text: "局部设置必须容易理解、修改和关闭。"}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "居民在各个空间共同选择设置。"}, {speaker: narrator, text: "任何一篮喜好都不能控制整个小镇。"}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "第一次紧急演练同时使用灯光、声音和振动长椅。"}, {speaker: narrator, text: "云、内里、阿玛和索尔都清楚注意到至少两种信号。"}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "经过共同测试，广场现在容得下音乐、谈话、安全通行和人们主动选择的安静花园。"}, {speaker: sol, text: "只有人们能决定安静放在哪里，它才真正有帮助。"}]}
chapters:
  - {id: ch01, title: 一种安静设置, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 意义不同的声音, page_refs: [p07, p08, p09, p10, p11]}
  - {id: ch03, title: 被遮住的警告, page_refs: [p12, p13, p14, p15]}
  - {id: ch04, title: 各地自己的选择, page_refs: [p16, p17, p18, p19, p20, p21, p22]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "哪些证据推翻了索尔所说的“只有小问题”？", answer: "车铃和鼓点失去作用，居民对声音分类不同，维修车警告也被削弱了。", page_refs: [p05, p06, p10, p12, p13]}
  - {id: q02, type: compare, speaker: narrator, prompt: "云的局部方案与原来的天幕方案有什么不同？", answer: "原方案用一种设置控制全镇；新方案让不同空间拥有可够到的控制器，并保护警告路线。", page_refs: [p04, p16, p18, p19, p20]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "同一种声音为什么会出现在两个篮子里？", answer: "人们会根据地点、时间、用途和自己的需要判断，所以一种声音既可能有用，也可能造成打扰。", page_refs: [p08, p09, p10]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "维修车靠近后，索尔为什么关闭天幕？", answer: "他发现系统会遮住安全信息，继续让它控制全镇是不负责任的。", page_refs: [p12, p13, p14]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "三种紧急信号为什么比只有声音更可靠？", answer: "不同的人可以注意不同方式，即使一种信号被错过，整个警告也不会消失。", page_refs: [p13, p15, p21]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "小镇从安静区的设计中学到了什么？", answer: "声音选择需要考虑具体环境、局部控制、持续同意和安全警报，不能只靠一种固定噪声定义。", page_refs: [p08, p10, p14, p16, p19, p20, p22]}
