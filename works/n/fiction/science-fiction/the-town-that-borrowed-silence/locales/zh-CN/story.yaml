schema_version: 2
language: zh-CN
writer: 北辰
title: 借来安静的小镇
summary: 索尔设计的全镇天幕减弱了刺耳噪声，也遮住了有用的车铃、音乐和车辆警告。居民证明声音在不同地方有不同意义，于是用局部选择和多种警报替代了单一的自动设置。
chapters:
  - id: ch01
    title: 一种安静设置
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 意义不同的声音
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
  - id: ch03
    title: 被遮住的警告
    page_refs:
      - p12
      - p13
      - p14
      - p15
  - id: ch04
    title: 各地自己的选择
    page_refs:
      - p16
      - p17
      - p18
      - p19
      - p20
      - p21
      - p22
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据推翻了索尔所说的“只有小问题”？
    answer: 车铃和鼓点失去作用，居民对声音分类不同，维修车警告也被削弱了。
    page_refs:
      - p05
      - p06
      - p10
      - p12
      - p13
  - id: q02
    type: compare
    speaker: narrator
    prompt: 云的局部方案与原来的天幕方案有什么不同？
    answer: 原方案用一种设置控制全镇；新方案让不同空间拥有可够到的控制器，并保护警告路线。
    page_refs:
      - p04
      - p16
      - p18
      - p19
      - p20
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 同一种声音为什么会出现在两个篮子里？
    answer: 人们会根据地点、时间、用途和自己的需要判断，所以一种声音既可能有用，也可能造成打扰。
    page_refs:
      - p08
      - p09
      - p10
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 维修车靠近后，索尔为什么关闭天幕？
    answer: 他发现系统会遮住安全信息，继续让它控制全镇是不负责任的。
    page_refs:
      - p12
      - p13
      - p14
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: 三种紧急信号为什么比只有声音更可靠？
    answer: 不同的人可以注意不同方式，即使一种信号被错过，整个警告也不会消失。
    page_refs:
      - p13
      - p15
      - p21
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: 小镇从安静区的设计中学到了什么？
    answer: 声音选择需要考虑具体环境、局部控制、持续同意和安全警报，不能只靠一种固定噪声定义。
    page_refs:
      - p08
      - p10
      - p14
      - p16
      - p19
      - p20
      - p22
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "施工、车辆、音乐和谈话一起挤进小镇广场。 "
            - text: 有些居民难以休息，也听不清身边的人。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 索尔展示一块透明的声音天幕。 索尔说：“
            - text: 它会识别反复出现的机器声，在声音扩散前把它减弱。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "刺耳的钻孔声在天幕下淡去。 "
            - text: 邻居放松下来，附近的谈话也更容易听清。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 镇议会批准在整个广场安装天幕。 索尔说：“
            - text: 很快，小镇需要休息时就能借来安静。”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 内里骑进过滤区，按响自行车铃。 内里说：“
            - text: 声音太轻，前面的行人根本没有回头。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 阿玛在手鼓上敲出轻快节奏。 阿玛说：“
            - text: 天幕削掉了清脆的鼓点，我的音乐散架了。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 索尔调了几下控制器，便让大家先散开：“钻孔声已经小了。车铃和鼓的事，我以后再改。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 云在花园风铃旁打着手语。翻译员替他说：“
            - text: 不要以为安静对每个人都有相同含义。”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "居民把代表声音的物品放进“需要”和“不需要”的篮子。 "
            - text: 索尔以为每种声音只会进入一个篮子。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 同一面鼓、同一个车铃和喷泉都出现在两个篮子里。内里点点车铃圆片：“骑车时我需要它，阅读花园里的人未必需要。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 索尔看着互相冲突的选择。阿玛抱起双臂：“今天装好的篮子，明天广场变了怎么办？”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "一辆维修车向广场驶来。 "
            - text: 它的警告声和其他机械声一起被削弱了。
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 内里看到车灯闪烁，及时把一个孩子带到旁边。 内里说：“
            - text: 这种警告声不能跟着钻孔声一起消失。”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 索尔关闭全镇天幕，转身面对居民：“维修车的警告声没有恢复以前，我不会重开天幕。”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 大家比较铃声、闪灯和会振动的长椅。云打着手语，翻译员说：“有人没听见铃，灯或长椅也要提醒到他。”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 云说：“
            - text: "让每个小安静区都由里面的人自己控制。” "
            - text: 于是，他们不再让一套设置管完整座小镇。
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "阿玛在安静阅读花园旁测试音乐区。 "
            - text: 一边的节奏保持清楚，却没有强烈闯进另一边。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 内里测试一条保留警告声的自行车
            - vocabulary:
                id: route
                text: 路线
            - text: "。 "
            - text: 她还没骑到身边，行人就能听见铃声。
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: 索尔把控制器装在不同高度。他说：“每个区域都用相同形状，关闭键也要容易找到。”
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: 居民在各个空间一起测试设置。
            - text: 音乐区、车道和阅读花园不再共用一种设置。
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: "第一次紧急演练同时使用灯光、声音和振动长椅。 "
            - text: 云、内里、阿玛和索尔每个人都接收到了至少两种提醒。
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: 经过几次测试，阿玛在音乐区敲鼓，内里在自行车
            - vocabulary:
                id: route
                text: 路线
            - text: 上按铃。云为阅读花园放下天幕，开放广场上的谈话仍在继续。
