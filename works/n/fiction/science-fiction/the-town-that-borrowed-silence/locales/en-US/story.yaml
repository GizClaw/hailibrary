questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: What evidence overturns Sol's belief that the canopy only causes minor losses?
    answer: The bicycle bell and drum lose useful detail, residents classify sounds differently, and a vehicle warning becomes dangerously faint.
    page_refs:
      - p05
      - p06
      - p10
      - p12
      - p13
  - id: q02
    type: compare
    speaker: narrator
    prompt: How does Yun's local-space plan differ from the original canopy plan?
    answer: The original applies one automatic setting townwide; the new plan gives distinct spaces reachable controls and protects warning routes.
    page_refs:
      - p04
      - p16
      - p18
      - p19
      - p20
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why do the same sounds appear in both preference baskets?
    answer: People judge a sound by its place, time, purpose, and their own needs, so one sound can be useful or disruptive.
    page_refs:
      - p08
      - p09
      - p10
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Sol shut down the canopy after the vehicle approaches?
    answer: He sees that the system can hide safety information, making continued townwide use irresponsible.
    page_refs:
      - p12
      - p13
      - p14
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: Why are three kinds of emergency signals stronger than sound alone?
    answer: Different people can notice different channels, and one missed or blocked signal does not remove the entire warning.
    page_refs:
      - p13
      - p15
      - p21
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What does the town learn about designing quiet spaces?
    answer: Sound choices require context, local control, continuing agreement, and protected safety signals rather than one fixed definition of noise.
    page_refs:
      - p08
      - p10
      - p14
      - p16
      - p19
      - p20
      - p22
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "Construction, traffic, street music, and many conversations crowd the town plaza from morning onward. "
            - text: Some residents struggle to rest, work, or hear one another clearly.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Sol demonstrates a transparent canopy module. Sol says, “
            - text: It identifies repeating machine noise and softens it before it spreads.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "The harsh repeating drilling fades beneath the newly opened canopy. "
            - text: Neighbors relax their shoulders, and nearby conversations become much easier to follow.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: After the successful demonstration, the council quickly approves linked modules for the entire public plaza. Sol says, “
            - text: Soon the town will borrow silence whenever it needs relief from mechanical noise.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Neri rides into the filtered area and rings her bicycle bell. Neri says, “
            - text: The sound is so faint that walkers do not turn.”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Ama taps a lively rhythm on her hand drum. Ama says, “
            - text: The canopy removes the sharp beats that hold my music together.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Sol adjusts several controls, then waves the others aside. “The drill is quiet now. I can fix the bell and drum later.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Yun signs by the garden chimes. The interpreter says, “
            - text: Do not assume quiet means the same thing to every person.”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "Residents place colored objects into separate baskets for wanted and unwanted sounds. "
            - text: Sol expects each familiar sound to enter only one basket and reveal a simple rule.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: The same drum, bicycle bell, and fountain appear in both baskets. Neri taps the bell token. “I need this on the bicycle route. The reading garden may not.”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: Sol studies the conflicting choices. Ama folds her arms. “We filled these baskets today. What happens when the plaza changes tomorrow?”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "During their discussion, a slow maintenance vehicle approaches the busy plaza. "
            - text: Its repeating warning sound is softened with the other mechanical noise before people recognize it.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Neri notices the vehicle's flashing light and guides a child aside. Neri says, “
            - text: That warning cannot disappear with the drilling.”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Sol shuts down the townwide canopy and faces the gathered residents. “I will not restart it until the vehicle warning stays clear.”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: The group compares bells, flashing lights, and vibrating benches. Yun signs, and the interpreter says, “If someone misses the bell, the light or bench must still reach them.”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: Yun says, “
            - text: "Give each quiet space controls that the people inside can use.” "
            - text: Instead of one setting for the town, they begin planning several local zones.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "Ama tests a lively music area beside a quiet garden where neighbors read. "
            - text: The drum remains clear in one space without spilling strongly into the other.
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "Neri tests a bicycle "
            - vocabulary:
                id: route
                text: route
            - text: " where warning sounds remain unfiltered. "
            - text: Walkers can hear the bell before she reaches them.
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: Sol installs physical controls at several reachable heights. “Use the same shapes in every zone, and keep the off control easy to find.”
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: Residents carefully test settings together in each public space.
            - text: The music area, bike route, and reading garden each use their own setting.
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: "The town's first emergency drill uses light, sound, and vibrating benches at once. "
            - text: Yun, Neri, Ama, and Sol each receive at least two alerts.
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: "After several tests, Ama drums in the music area while Neri rings her bell on the bicycle "
            - vocabulary:
                id: route
                text: route
            - text: . Yun lowers the canopy over the reading garden, and conversation continues in the open plaza.
