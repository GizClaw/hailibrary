schema_version: 3
language: zh-CN
writer: 北辰
title: 小丁不明白“还要”
summary: '周屿和许安造出分拣机器人小丁，却把“不确定就停”改成了快速猜测。小丁收走居民仍想保留的物品，还毁坏了林豆的画。两个孩子承担后果，从记录中发现机器只能判断物品像不像垃圾，不能判断主人要不要它。他们把小丁改成只提供分类建议、由人作最后决定的助手。'
chapters:
  - id: ch01
    title: 更快的帮手
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 谁说不要
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: 谁能决定
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: 学会停下
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: cause-effect
    prompt: 周屿为什么把等待时间缩短到二十秒？
    answer: 他想让小丁在评审前显得更快，不愿它遇到不确定物品就停两分钟。
    page_refs: [p04, p05]
  - id: q02
    type: evidence
    prompt: 哪些证据说明小丁没有故障，而是规则错了？
    answer: 小丁按设定收走了离人较远、外表像垃圾、二十秒内没人确认的物品；断伞、画和毯子都符合这些条件，却仍有主人。
    page_refs: [p06, p08, p12]
  - id: q03
    type: compare
    prompt: 改造前后，小丁对物品做决定的方式有什么不同？
    answer: 改造前，它会自己巡行、猜测并把物品投入箱中；改造后，主人先把物品放上托盘，小丁只建议分类，最后由人决定。
    page_refs: [p03, p05, p15, p16]
  - id: q04
    type: character-motive
    prompt: 许安为什么说后果有她的一半？
    answer: 她看见周屿改了危险的设置，却没有恢复旧设置，也没有结束试验。
    page_refs: [p05, p10]
  - id: q05
    type: evidence
    prompt: 哪三条发现帮助他们重新设计小丁？
    answer: 外表像垃圾不等于主人不要；居民可以主动交出确定不要的物品；梁叔真正需要帮助的是辨认类别和打开沉重箱盖。
    page_refs: [p12, p13, p14]
  - id: q06
    type: compare
    prompt: 两次蓝色土星画来到小丁附近时，结果为什么不同？
    answer: 第一次小丁会自动巡行和拾取，所以把画扔进箱中；第二次它只有在主人放上托盘并按按钮后才工作，因此没有碰画。
    page_refs: [p08, p15, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 周六早上，小丁夹起空酸奶杯，准确投进蓝色回收箱。周屿高兴得撞上工作棚的顶板。
        - text: 许安却先按下红色急停按钮。她说：“会停下来，也算成功。”
    - id: p02
      illustration: p02
      paragraphs:
        - text: 他们用旧送货车和台灯支架造了小丁。它不会说话，只会比较形状、材料和污渍，再按他们设定的规则分类。
        - text: 遇到拿不准的东西，它应该亮黄灯，停下来等人处理。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 梁叔每天都要重新检查社区的垃圾箱。他拿起装满螺丝的旧铁盒问：“你们能教小丁怎么分类，可谁教它判断主人还要不要？”
        - text: 周屿认为，要紧的东西不会被放在垃圾箱附近。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 试运行时，小丁捡对了瓶子和纸，却在一个油腻纸盒前等了两分钟。邻居们鼓掌，周屿只担心评审觉得它太慢。
        - text: 他想让大家看见，十四岁的孩子也能造出有用的机器。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 周屿把等待时间缩短到二十秒，还让小丁在不确定时选择最像的一类。许安要求恢复原来的设置，他却保证会拿着遥控器跟随。
        - text: 许安不放心，却只把新设置写进测试本。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 第二天，小丁抓住赵奶奶放在花坛边的断伞。她拉住伞柄说，伞骨还要做风筝尾巴。
        - text: 许安按下急停。周屿又加规则：只捡地上、离人两米以上的东西。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 傍晚，居民们搬来椅子，准备看露天电影。许安确认遥控器在周屿口袋里，才同意小丁在广场外围再走半小时。
        - text: 可是补电以后，周屿把遥控器忘在了工作棚。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 一阵风吹走林豆画的蓝色土星。画纸滚出几米，小丁立刻追上去，把它投进回收箱。
        - text: 风又卷走一条薄毯。小丁夹住毯角，主人却抓着另一头不放。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 周屿冲过人群，拉下小丁背后的断电柄。轮子停了，夹爪却卡在毯子上。
        - text: 他和许安用扳手拆开连接轴。四周没有掌声，只有被损坏的画、毯子和一箱混乱的物品。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 周屿想买新的东西赔给大家，梁叔却让他先归还还能归还的物品。许安也承认：“我看见设置变了，却没有让试验停下。”
        - text: 他们取消评审，把断电的小丁推回工作棚。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 他们挨家道歉、清洗薄毯，又补上螺丝和猫粮。林豆的旧画却无法恢复。
        - text: 周屿带来新纸和颜料。林豆自己重画，只让他远远举着吹风机，免得风又推开颜料。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 许安打印了小丁的判断记录。摄像头没有坏，小丁也没有自己改变程序。
        - text: '它只是照着规则行动：离人较远、外表像垃圾、二十秒没人确认，就收走。这个错误规则把断伞、画和毯子都判成了该收走的东西。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: “放在地上”不等于“被丢掉”，脏、破、旧也不等于没有主人。许安在白板上写下一个问题：“谁能决定？”
        - text: 周屿终于回答：“物品的主人。如果不知道主人是谁，小丁就不能动。”
    - id: p14
      illustration: p14
      paragraphs:
        - text: 他们跟着梁叔观察分类站。居民已经决定丢掉什么。
        - text: 梁叔再检查容器是否空了、指出类别，并一次次打开沉重的箱盖。
        - text: 周屿明白了：“小丁可以建议，但不能替人扔。”
    - id: p15
      illustration: p15
      paragraphs:
        - text: 他们拆掉自动巡行程序，把小丁固定在分类站。只有主人把物品放上托盘并按下按钮，它才开始判断。
        - text: 不确定时亮黄灯；即使亮绿灯，最后一步也必须由人完成。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 许安另接了一条独立断电线路。梁叔拿到一把能切断电机的实体钥匙。
        - text: 周屿拔掉控制电脑，连续测试十二次。赵奶奶用软垫挡住托盘，确认受阻时电机会松开。
    - id: p17
      illustration: p17
      paragraphs:
        - text: 改造用了三周。测试桌上的泥玩具、空饭盒和断线耳机看起来都可能被丢掉，却各有主人伸手拿回。
        - text: 谁觉得不对，谁就能停下试验。周屿和许安都同意这条规则。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 重新开放时，没有人鼓掌。有人嫌多按一次按钮麻烦，小丁还把透明饭盒分错了。
        - text: 许安保留了错误记录，没有为了多亮几次绿灯就立刻改设置。他们先继续测试。
    - id: p19
      illustration: p19
      paragraphs:
        - text: 第三天，梁叔发现自己少开了四十多次箱盖。赵奶奶把六个空瓶逐个放上托盘，小丁都亮了绿灯。
        - text: 第七件是伞骨。黄灯亮起，赵奶奶笑了：“总算会犹豫了。”
    - id: p20
      illustration: p20
      paragraphs:
        - text: 秋风再次吹起林豆的蓝色土星画。纸落在小丁轮边，可没人把它放上托盘，也没人按按钮。小丁一动不动。
        - text: 林豆捡回画，又把空颜料盒放上托盘。黄灯亮起，他自己决定留下盒盖，只把盒身推进回收箱。
