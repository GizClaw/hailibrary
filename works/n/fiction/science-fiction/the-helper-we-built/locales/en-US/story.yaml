schema_version: 3
language: en-US
writer: north-star-map
title: What Helper Couldn’t Know
summary: 'Dev and Nora build Helper to sort waste, but replace its stop-on-uncertainty rule with a quick guess. The robot takes objects that neighbors still want and damages Milo’s painting. Its records show that the machine can judge what resembles trash, but cannot know whether an owner has discarded it. The builders redesign Helper to offer sorting advice while leaving the final choice to people.'
chapters:
  - id: ch01
    title: A Faster Helper
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: Who Said It Was Trash?
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: Who Decides?
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: Learning to Stop
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: cause-effect
    prompt: Why did Dev shorten Helper’s waiting time to twenty seconds?
    answer: He wanted Helper to look fast before the showcase and disliked seeing it wait two minutes over an uncertain object.
    page_refs: [p04, p05]
  - id: q02
    type: evidence
    prompt: Which evidence shows that Helper followed a bad rule rather than suffering a malfunction?
    answer: 'Helper took objects that were far from people, looked like waste, and received no answer within twenty seconds. The umbrella, painting, and blanket met those conditions but still had owners.'
    page_refs: [p06, p08, p12]
  - id: q03
    type: compare
    prompt: How did Helper make decisions before and after the redesign?
    answer: 'Before, it patrolled, guessed, and dropped objects into bins. Afterward, an owner offered an object, Helper only suggested a bin, and a person made the final choice.'
    page_refs: [p03, p05, p15, p16]
  - id: q04
    type: character-motive
    prompt: Why did Nora say that half the harm belonged to her?
    answer: She saw Dev change the unsafe setting but neither restored it nor stopped the trial.
    page_refs: [p05, p10]
  - id: q05
    type: evidence
    prompt: Which three findings guided the builders’ new design?
    answer: Looking like trash did not prove an owner was finished with an object. Residents could offer objects they had chosen to discard. Mr. Lewis needed help identifying categories and lifting heavy lids.
    page_refs: [p12, p13, p14]
  - id: q06
    type: compare
    prompt: Why did the two blue-Saturn paintings near Helper have different outcomes?
    answer: 'During the first event, Helper patrolled and collected by itself. After the redesign, it worked only when an owner placed an object on the tray and pressed the button, so it left the painting alone.'
    page_refs: [p08, p15, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'On Saturday morning, Helper lifted an empty yogurt cup and dropped it into the blue recycling bin. Dev jumped so high that he struck the workshop roof.'
        - text: Nora pressed the red emergency stop first. “Stopping has to work too.”
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'They had built Helper from an old delivery cart and a desk-lamp arm. It could not speak. It only compared shape, material, and stains before following their sorting rules.'
        - text: 'When uncertain, it was supposed to shine amber, stop, and wait for a person.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Mr. Lewis checked the courtyard bins and corrected sorting mistakes every day. Holding up his dented tin of screws, he asked, “You can teach Helper which bin to use. Who teaches it whether the owner is finished with an object?”'
        - text: Dev assumed nobody would leave anything important near the bins.
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'During the public trial, Helper sorted bottles and paper correctly but waited two minutes beside a greasy box. Neighbors applauded its caution. Dev only imagined the showcase judges calling it slow.'
        - text: He wanted to prove that fourteen-year-olds could build something useful.
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'Dev shortened the wait to twenty seconds and told Helper to choose the closest match when uncertain. Nora wanted the old setting restored, but he promised to follow with the remote.'
        - text: 'Worried, Nora recorded the change instead of stopping the test.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'The next day, Helper grabbed a broken umbrella beside Mrs. Patel’s repair table. She pulled it back because she planned to use its ribs as kite tails.'
        - text: 'Nora hit stop. Dev added another rule: collect only objects on the ground and far from people.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'That evening, neighbors carried chairs into the courtyard for a movie. Nora checked the remote in Dev’s pocket before allowing one last patrol.'
        - text: 'After recharging Helper, however, Dev left the remote inside the workshop.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Wind swept away Milo’s blue-Saturn painting. It rolled several feet, and Helper chased it down and dropped it into the recycling bin.'
        - text: Another gust carried off a blanket. Helper gripped one corner while its owner held the other.
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Dev pushed through the crowd and pulled Helper’s rear cutoff handle. The wheels stopped, but the claw stayed locked around the blanket.'
        - text: 'He and Nora loosened the joint with a wrench. Nobody applauded the ruined painting, marked blanket, or mixed-up belongings.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'Dev offered to buy replacements. Mr. Lewis told him to return what could still be returned. Nora admitted, “I saw the changed setting, but I didn’t stop the trial.”'
        - text: They canceled the showcase and pushed the powerless robot home.
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'They apologized door to door, washed the blanket, and replaced screws and cat food. Milo’s old painting could not be restored.'
        - text: 'Milo painted another himself. He allowed Dev only to hold a hair dryer far away, where its breeze could not move the wet color.'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Nora printed Helper’s decision record. Its camera had not failed, and its program had not changed itself.'
        - text: 'It had followed their rule: take an object far from people that looked like waste.'
        - text: 'If nobody answered within twenty seconds, Helper collected it.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'Resting on the ground did not mean discarded. Dirty, broken, or old did not mean ownerless. Nora wrote one question on the board: WHO DECIDES?'
        - text: 'Dev answered, “The owner. If Helper does not know the owner, it cannot move the object.”'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'They watched Mr. Lewis at the sorting station. Residents brought objects they had already chosen to discard. He checked containers, suggested bins, and lifted heavy lids again and again.'
        - text: Dev understood. “Helper can suggest. It cannot throw anything away.”
    - id: p15
      illustration: p15
      paragraphs:
        - text: They removed automatic patrol and installed Helper at the station. It started only after an owner placed an object on its tray and pressed a button.
        - text: Amber meant uncertain. Even green was only advice; human hands made the final move.
    - id: p16
      illustration: p16
      paragraphs:
        - text: 'Nora wired a separate power cutoff, and Mr. Lewis received its physical key. Dev unplugged the computer and tested the cutoff twelve times.'
        - text: Mrs. Patel blocked the tray with a padded object. The motor disengaged instead of pushing harder.
    - id: p17
      illustration: p17
      paragraphs:
        - text: 'Rebuilding took three weeks. A muddy toy, an empty lunch box, and broken headphones all looked disposable, yet owners reached for each one.'
        - text: Dev and Nora agreed that either builder could stop a test whenever something seemed wrong.
    - id: p18
      illustration: p18
      paragraphs:
        - text: 'Nobody applauded on reopening day. Someone disliked the extra button, and Helper misclassified a clear lunch box.'
        - text: Nora saved the error record instead of changing settings merely to produce more green lights. They kept testing first.
    - id: p19
      illustration: p19
      paragraphs:
        - text: 'On the third day, Mr. Lewis counted more than forty heavy lids he had not lifted. Mrs. Patel offered six empty bottles, and Helper shone green each time.'
        - text: 'Her seventh object was an umbrella frame. The amber light came on. “Finally learned to hesitate,” she said.'
    - id: p20
      illustration: p20
      paragraphs:
        - text: Autumn wind rolled Milo’s blue-Saturn painting beside Helper’s wheel. Nobody put it on the tray or pressed the button. Helper stayed still.
        - text: 'Milo retrieved it, then offered an empty paint box. At the amber light, he kept the painted lid and recycled the box himself.'
