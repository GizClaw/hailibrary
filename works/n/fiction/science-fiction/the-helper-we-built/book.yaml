characters:
  - id: maker-a
    kind: person
    description: A gifted fourteen-year-old maker who wants to prove the robot works and must learn to face the harm caused by his choices.
    visual_identity: 'Slim fourteen-year-old East Asian boy with warm beige skin, short tousled black hair, coral-red hooded jacket over a warm-white shirt, graphite work pants, teal sneakers, and a small graphite remote control.'
  - id: maker-b
    kind: person
    description: A careful fourteen-year-old builder who recognizes danger but must learn to stop a test instead of only recording concern.
    visual_identity: 'Slim fourteen-year-old East Asian girl with warm beige skin, straight chin-length black bob, cyan utility overshirt over a pale yellow shirt, dark navy pants, white sneakers, and a dark teal test notebook.'
  - id: robot
    kind: robot
    description: 'A waist-high homemade sorting robot that senses, classifies, and follows preset rules but cannot understand ownership.'
    visual_identity: 'Waist-high homemade sorting robot with a rounded warm-white recycled delivery-cart body, four small graphite wheels, one jointed old-lamp arm ending in a padded two-prong claw, one rectangular camera eye, a large red emergency-stop button on top, and three circular status lights in green, amber, and off-white with no symbols.'
  - id: caretaker
    kind: person
    description: The practical courtyard caretaker who knows that an object's value and destination cannot be judged by appearance.
    visual_identity: 'Lean East Asian man in his late fifties with sun-warmed skin, short salt-and-pepper hair, olive work jacket over a gray shirt, brown work trousers, sturdy black shoes, thick gray gloves, and a dented taped metal cookie tin.'
  - id: repairer
    kind: person
    description: 'A direct, resourceful repair-stall owner who saves broken objects for new uses.'
    visual_identity: 'Sturdy South Asian woman in her late sixties with medium-brown skin, silver hair in a low bun, plum cardigan over a saffron shirt, loose charcoal trousers, black cloth shoes, and a canvas tool apron.'
  - id: child
    kind: person
    description: A young child whose damaged planet drawing shows that replacement cannot erase every consequence.
    visual_identity: 'Small seven-year-old East Asian boy with warm beige skin, straight black bowl-cut hair, grass-green sweatshirt with a completely blank front, tan shorts over navy leggings, orange sneakers, and a stiff blue portfolio holding planet paintings.'
