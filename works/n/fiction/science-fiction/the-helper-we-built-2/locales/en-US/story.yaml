  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "Showcase day became apology day. Dev and Nora cleaned the blanket, replaced cat food, and returned every object they could recover. They first listened as each owner explained which damage could still be repaired."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "Milo’s Saturn picture could not be restored. Dev brought paper and paint, then reached to copy the old picture, but Milo stopped him. This time, Dev could not choose the method of repair by himself."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Milo mixed two blues and painted uneven rings. Dev was allowed only to hold a hair dryer far above the wet page. Waiting slowly gave the younger artist control of his picture again."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "Milo kept the new picture and the damaged old one. Dev learned that replacing a price did not replace an object. Keeping both pictures also preserved an honest trace of the accident."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "Nora printed Helper’s decisions. Neither the camera nor the program was broken; the machine had followed their instructions exactly. A normally operating machine could faithfully complete the wrong goal."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Six feet away, waste-like appearance, and no answer in twenty seconds had turned owned objects into “trash.” Each condition was true alone, but together they produced a false judgment."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "Nora wrote WHO GETS TO DECIDE on the board. Dev first answered “a person,” then changed it to “the owner.” This revision returned authority to the person who understood the object’s meaning."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "If an owner was unknown, Helper should not touch the object. But how could it still reduce Mr. Lewis’s work? They needed to keep useful abilities without pretending Helper could know everything."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "They watched the sorting station. Residents already brought unwanted objects. Mr. Lewis spent his effort identifying materials and lifting lids. Watching real work revealed which tiring steps were worth automating."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "The makers removed patrol mode and fixed Helper inside the station. An owner had to place an item on a tray and press a raised button. The limit reduced speed, but it prevented a much larger kind of harm."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "Helper could suggest a bin. Even with a green light, human hands made the final move; Mr. Lewis held a separate power key. Because the key bypassed the computer, it still protected people during software failure."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "Their test table held a muddy toy, empty lunch box, broken headphones, and old pill case. Appearance could not prove intention. Every counterexample forced the makers to revisit their original assumption."
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "When Dev tried to skip a check, Nora closed the notebook. They would change rules together, and either person could stop a test. Nora also promised to act on danger instead of merely recording it."
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "No judges attended reopening. Helper misread a clear lunch box, and Nora saved the error instead of chasing more green lights. Keeping the error helped them test honestly rather than appear perfect."
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "By day three, Mr. Lewis had lifted forty-two fewer lids. Six bottles turned green, while Mrs. Patel’s umbrella frame turned amber. Amber no longer meant failure; it meant a person needed to judge."
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "Wind carried blue Saturn away once more. Nobody offered it on the tray, so Helper stayed still while Milo retrieved it. The robot did not chase, proving the new boundary existed in its design."
          }
        ]
      }
    ]
  }
}
