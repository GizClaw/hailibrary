  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "评审日变成了道歉日。周屿和许安清洗薄毯、补买猫粮，再把找到的物品逐件送回。他们先听每位物主说明哪些损害可以补救。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "林豆的土星画无法恢复。周屿带去新纸和颜料，想照着旧画重画，却被林豆拦住。这一次，修复的办法不能再由周屿单独决定。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "林豆自己调出两种蓝，画了不太圆的光环。周屿只负责把吹风机举得远远的。慢慢等待让孩子重新拿回画画的主动权。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
      "text": "林豆留下新画，也留下泡坏的旧画。周屿明白，新东西能赔价钱，却不能还回失去的原物。新画也不能让旧画恢复原样。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "许安打印小丁的记录。摄像头和程序都没有坏，机器准确执行了他们写下的规则。正常运行的机器也可能忠实完成一个错误目标。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
      "text": "物品离人两米，外表像废物，二十秒无人确认。三个条件把许多有主人的东西变成了“垃圾”。小丁准确执行了它们，却不知道物主是否还要。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
      "text": "许安在白板写下“谁能决定”。周屿先答“人”，又修正为“物品的主人”。如果小丁找不到主人，它就不能移动物品。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "如果主人不明，小丁就不该碰。可是这样一来，它还能怎样减轻梁叔的工作？他们需要保留有用部分，而不是让小丁变得万能。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "他们观察分类站：居民本来就会带来不要的东西。梁叔最累的是辨认类别和反复开箱盖。观察真实工作后，他们才找到值得自动化的步骤。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "孩子们拆掉巡行程序，把小丁固定在站里。主人必须先把物品放上托盘并按下圆钮。这项限制减少了效率，却挡住了更大的损害。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "小丁只能建议箱子。即使亮绿灯，也要等人的手完成最后一步；梁叔还有独立断电钥匙。钥匙不依赖电脑，所以程序失灵时仍能保护人。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
      "text": "测试桌上摆着要带回家的泥玩具车、空饭盒和等待修理的断线耳机。每样东西看着都像废物，主人却会拿回去。外表无法说明主人是否还要。"
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "周屿想跳过一次检查，许安合上测试本。规则要共同修改，任何一人都可以停止测试。许安也承诺发现危险时立刻行动，不再只做记录。"
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "重新开放时没有评审。小丁认错了透明饭盒，许安留下错误，没有偷偷追求更多绿灯。保留错误能够帮助他们继续测试，而不是装作完美。"
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "第三天，梁叔少开了四十多次箱盖。赵奶奶的六个空瓶亮绿灯，伞骨则亮黄灯。黄灯不再代表失败，而是需要人作出最后判断。"
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
      "text": "又一阵风吹走蓝色土星。没人把画放上托盘，小丁保持不动，林豆自己把它捡回。接着，他把空颜料盒放上托盘，并亲手作出最后选择。"
          }
        ]
      }
    ]
  }
}
