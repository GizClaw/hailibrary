characters:
  - id: emile
    kind: person
    description: A fictional young Belgian museum assistant who must admit that a reconstruction he trusted was wrong.
    visual_identity: 'a slim young Belgian man with fair skin, wavy chestnut hair, gray-blue eyes, rolled white shirt sleeves, moss-green waistcoat, brown trousers, scuffed dark boots, and a tan leather work apron'
  - id: depauw
    kind: person
    description: 'Louis De Pauw, the experienced preparator who leads careful excavation and mounting work.'
    visual_identity: 'a sturdy middle-aged Belgian man with fair weathered skin, a full dark beard, short dark hair, charcoal work coat, ochre canvas apron, dark trousers, and heavy brown work boots'
  - id: dollo
    kind: person
    description: 'Louis Dollo, the young scientist who compares the Bernissart skeletons and studies their joints.'
    visual_identity: 'a slender young Belgian man with fair skin, neatly parted dark hair, a short mustache, dark navy frock coat, copper waistcoat, high-collared white shirt, dark trousers, and polished black shoes'
  - id: jules
    kind: person
    description: A fictional composite miner who guides and protects the museum team underground.
    visual_identity: 'a compact adult Belgian coal miner with soot-darkened fair skin, cropped brown hair, a short brown beard, faded blue work shirt, dark suspenders, rough black trousers, heavy boots, and a brass oil safety lamp'
