schema_version: 3
language: zh-CN
writer: 北辰
title: 鼻尖上的拇指
summary: '1878年，博物馆助手埃米尔带着“禽龙尖骨是鼻角”的旧印象前往贝尼沙尔煤矿。尖骨在手边的出土位置、左右成对的标本和头骨上无处连接的事实，让旧复原越来越站不住脚。回到布鲁塞尔后，多具骨架和吻合的连接面共同证明尖骨属于第一指，也就是拇指。埃米尔最终把证据画在结论之前，并保留旧图，让参观者看见科学认识为何会改变。埃米尔、朱尔及其对话属于虚构，化石发现、博物馆工作和复原变化依据史实。'
chapters:
  - id: ch01
    title: 旧图里的角
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 尖骨的位置
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 四幅新图
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    prompt: 埃米尔为什么会在矿下第一幅速写中给鼻角留位置？
    answer: 因为他早已相信旧复原图把尖骨放在禽龙鼻端的解释。
    page_refs: [p02, p05]
  - id: q02
    type: compare
    prompt: 矿下骨架提供的证据与旧鼻角图依据的材料有什么不同？
    answer: 旧图依据的是零散材料，矿下却保存了许多仍靠近原位的骨头。
    page_refs: [p02, p04]
  - id: q03
    type: evidence
    prompt: 哪三条线索共同说明尖骨属于拇指？
    answer: 尖骨反复出现在前肢旁，头骨上没有连接位置，尖骨底面又与手的第一指吻合。
    page_refs: [p08, p09, p11, p12]
  - id: q04
    type: character-motive
    prompt: 埃米尔为什么想推迟写出新结论？
    answer: 他害怕公开承认自己曾经相信并临摹的复原图错了。
    page_refs: [p13]
  - id: q05
    type: short-answer
    prompt: 埃米尔为什么保留旧图？
    answer: 旧图能让人看见早先为何会猜错，以及新证据为何改变了复原。
    page_refs: [p14, p15]
  - id: q06
    type: compare
    prompt: 研究者能确定尖骨的什么，又不能确定什么？
    answer: 他们能确定尖骨是特化的拇指，却不能只凭形状确定它的用途。
    page_refs: [p12, p16]
  - id: q07
    type: main-idea
    prompt: 埃米尔帮助男孩怎样重新看待科学中的错误？
    answer: 根据零散材料提出的猜测，在更完整的证据出现后应当修正。
    page_refs: [p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '1878年的一个雨天，十九岁的埃米尔正在布鲁塞尔皇家自然史博物馆给洞熊骨头编号。德波拿来一封电报：贝尼沙尔煤矿深处发现了大批巨骨。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 埃米尔熟悉禽龙的旧复原图。这种植食爬行动物最初由牙齿和零散骨头得到命名。一枚孤立尖骨则被放在鼻端，成了醒目的角。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 埃米尔曾认真临摹那只有鼻角的禽龙，也相信它。他请求跟随德波去矿井。第二天清早，石膏、麻布和木板旁多了一盏给他的矿灯。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 在三百多米深的地下，矿工朱尔用灯照出彼此相连的肋骨、脊椎和四肢。与孤零零的骨头不同，这具接近完整的骨架限制了随意想象。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 埃米尔画下前肢，却发现自己不知不觉给头骨旁的鼻角留了空位。朱尔问他画的是眼前的骨头，还是博物馆里的旧图。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 工人把黏土和骨头分块，用湿纸、麻布、石膏和木箱保护起来。顶板掉下碎屑时，德波坚持先加固通道，哪怕暴露的化石可能继续开裂。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 支撑加好以后，一枚粗大的尖骨出现在腕骨旁。它很像旧图里的鼻角，但埃米尔没有立刻下结论，而是先画下它准确的出土位置。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 另一侧腕骨旁也出现了相同的尖骨。“两只角？”朱尔问。“也可能一只角都不是。”埃米尔回答，可改变旧答案仍让他害怕。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 木箱分批运回布鲁塞尔。埃米尔按矿下速写整理标本，发现尖骨总在前肢附近出现。清理出的两具头骨上，却没有适合尖骨连接的位置。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 埃米尔按出土记录摆好三只手。每只手都有三根粗壮的中指和一根细长的外指。第一指的位置空着，旁边正好放着尖骨。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 他没有把骨头硬按进去。德波托住腕部，埃米尔把尖骨宽阔的底面靠近第一指。两处连接面顺着同样的弧度自然合拢。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 多洛又检查了另一只手和第二具骨架。尖骨在前肢旁成对出现，头骨上没有连接处，底面又与第一指吻合。三条线索共同指向同一解释。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 尖骨不是鼻角，而是特化的拇指。埃米尔望着自己珍藏的旧临摹，提议先装别的部分。德波提醒他，记录不会替他写出结论。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 那天晚上，埃米尔在旧图旁铺开新纸。他先画孤立尖骨，再画它在多具骨架中的位置。接着是左右手和连接面，最后才是修改后的禽龙。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 埃米尔把四幅图交给多洛，承认自己从前把答案画在证据前面。多洛让他保留旧图，好让别人看懂过去为何会错，后来为何改变。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 研究者把尖骨装在两只手的拇指位置。埃米尔仍写下“用途尚不确定”。只凭形状，无法断定它用于防御、争斗，还是处理植物。
    - id: p17
      illustration: p17
      paragraphs:
        - text: 骨架公开展出后，一个男孩笑旧图把拇指装到了鼻子上。埃米尔只给他看那枚孤立尖骨，问他会放在哪里。男孩想了想，说不知道。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 埃米尔告诉他，早先的人缺少的不是聪明，而是更多骨头。男孩看完四幅图，举起自己的拇指。闭馆后，那块磨旧的橡皮留在新图旁。
