schema_version: 3
language: en-US
writer: north-star-map
title: The Thumb on the Nose
summary: 'In 1878, young museum assistant Emile travels to the Bernissart coal mine believing an Iguanodon spike belonged on its nose. Its recorded position beside a hand, its paired match, and the lack of any place on the skull challenge that familiar picture. In Brussels, repeated skeletons and matching joint surfaces show that the spikes were modified thumbs. Emile chooses to display the evidence beside his old mistaken drawing, while leaving the spikes’ purpose uncertain. Emile, Jules, and their conversations are fictional; the discovery, museum work, and changed reconstruction follow the historical record.'
chapters:
  - id: ch01
    title: The Old Picture
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: Where the Bone Lay
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: Four Drawings
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    prompt: Why did Emile leave space for a horn in his first mine sketch?
    answer: He already trusted the old reconstruction that placed the pointed bone on the Iguanodon’s nose.
    page_refs: [p02, p05]
  - id: q02
    type: compare
    prompt: How was the evidence from the mine different from the evidence behind the old nose-horn picture?
    answer: 'The old picture used scattered remains, but the mine preserved many bones close to their original positions.'
    page_refs: [p02, p04]
  - id: q03
    type: evidence
    prompt: Which three clues showed that the spike belonged to the thumb?
    answer: 'Spikes repeatedly appeared beside forelimbs, neither skull had a place for one, and each broad base matched the first digit of a hand.'
    page_refs: [p08, p09, p11, p12]
  - id: q04
    type: character-motive
    prompt: Why did Emile delay writing the new conclusion?
    answer: He feared admitting in public that the admired reconstruction he had copied was wrong.
    page_refs: [p13]
  - id: q05
    type: short-answer
    prompt: Why did Emile keep the old drawing?
    answer: It showed why the earlier mistake was possible and why later evidence changed the reconstruction.
    page_refs: [p14, p15]
  - id: q06
    type: compare
    prompt: 'What could the team conclude about the spike, and what remained uncertain?'
    answer: 'They could conclude that it was a modified thumb, but they could not determine its exact purpose from its shape alone.'
    page_refs: [p12, p16]
  - id: q07
    type: main-idea
    prompt: What does Emile help the boy understand about scientific mistakes?
    answer: A reasonable guess based on fragments should change when more complete evidence appears.
    page_refs: [p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'In rainy Brussels in 1878, nineteen-year-old Emile numbered cave-bear bones at the Royal Museum of Natural History. De Pauw arrived with a telegram from the Bernissart coal mine: many huge bones lay deep underground.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'Emile knew the famous picture of Iguanodon, a giant plant-eating reptile named from its teeth. Because only scattered remains had been known, a pointed bone had been placed on its nose like a horn.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Emile had carefully copied that horned animal and believed the picture. He asked to join De Pauw. The next morning, a miner’s lamp waited beside the plaster, cloth, and boards.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Far below ground, Jules showed them ribs, vertebrae, and limbs still lying near one another. Unlike a loose bone, this nearly complete skeleton left less room for imagination.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'Emile sketched the forelimb, then noticed he had left space near the skull for the horn. Jules asked whether he was drawing the bones before him or the picture in the museum.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'The workers wrapped sections of clay and bone in paper, cloth, plaster, and wood. When grit fell from the roof, De Pauw stopped the work until the passage was safe, although exposed fossils might crack.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'After the supports were strengthened, a thick pointed bone appeared beside the wrist. It resembled the supposed horn, but Emile drew its exact position before anyone moved it.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'A matching pointed bone lay beside the other wrist. “Two horns?” Jules asked. “Or no horns,” Emile replied, though changing the answer frightened him.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Crates reached Brussels over many months. As Emile matched each block to his mine sketches, more spikes appeared near forelimbs. Two cleaned skulls offered no convincing place where a spike could attach.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'Emile arranged three hands by their recorded positions. Each had three sturdy middle fingers, one slender outer finger, and an open first-digit position beside a pointed bone.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: He did not force the parts together. De Pauw supported one wrist while Emile brought the spike’s broad base toward the first digit. The matching surfaces settled together without pressure.
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Dollo checked another hand and a second skeleton. Paired spikes lay by the forelimbs, the skulls had no sockets, and the bases matched the first digits. Together, the three clues supported the same explanation.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'The spike was a modified thumb, not a nose horn. Emile looked at his admired old drawing and suggested mounting other bones first. De Pauw reminded him that the records could not write the conclusion for him.'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'That night, Emile placed clean paper beside the old picture. He drew the isolated spike and its repeated position beside hands. Next came the matching left and right bones. Only then did he draw the revised animal.'
    - id: p15
      illustration: p15
      paragraphs:
        - text: Emile gave all four drawings to Dollo and admitted that he had once put the answer before the evidence. Dollo told him to preserve the mistake so others could understand why the picture changed.
    - id: p16
      illustration: p16
      paragraphs:
        - text: 'The team mounted a spike at each thumb position. Emile wrote that their purpose remained uncertain. Shape alone could not decide whether they were used for defense, contests, or handling plants.'
    - id: p17
      illustration: p17
      paragraphs:
        - text: 'When the finished skeleton went on display, a boy laughed at the old horned picture. Emile showed him the pointed bone alone and asked where he would place it. “I don’t know,” the boy said.'
    - id: p18
      illustration: p18
      paragraphs:
        - text: 'Emile explained that the earlier scientists had needed more bones, not more intelligence. The boy compared the drawings and raised his own thumb. Later, Emile left his worn eraser beside the new reconstruction.'
