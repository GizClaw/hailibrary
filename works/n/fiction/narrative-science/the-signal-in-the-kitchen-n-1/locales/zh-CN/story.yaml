schema_version: 3
language: zh-CN
writer: 北辰
title: 像星光的模仿者
summary: '一个像天文脉冲的信号让林遥激动。多波束、频率和时间分布的证据，迫使她把目光转回台站。'
chapters:
  - id: ch01
    title: 最初的猜测
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
  - id: ch02
    title: 改变方向
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: cause-effect
    prompt: '十三路波束同时变亮，为什么削弱了天空来源的猜想？'
    answer: '这个信号同时照亮十三路波束，而真正的远处点源通常只集中在其中一小片。附近的强干扰可以从侧面进入全部波束。'
    page_refs:
      - p03
      - p04
  - id: q02
    type: evidence
    prompt: 哪两类观察把排查方向从天空推向了台站内部？
    answer: 宽带监测器同时在2.3到2.5吉赫兹看到强活动。正午附近的记录最密。
    page_refs:
      - p06
      - p11
      - p12
  - id: q03
    type: compare
    prompt: peryton与真正经过冷等离子体的脉冲有什么差别？
    answer: '与真正经过冷等离子体的脉冲不同，这些弧线没有严格服从色散规律。'
    page_refs:
      - p02
      - p07
      - p08
  - id: q04
    type: character-motive
    prompt: 露丝为什么坚持要一个可能失败的预测？
    answer: '如果任何结果都能被解释成支持猜想，整个台站都会成为嫌疑人。'
    page_refs:
      - p09
      - p10
  - id: q05
    type: evidence
    prompt: 哪些记录支持“信号跟着人的作息”这一判断？
    answer: '这些像天文脉冲的地面信号，大多出现在工作日和办公时间。正午附近的记录最密。林遥预测人类设备会让高频尖峰白天多、夜间少，而且多数尖峰不会伴随peryton。'
    page_refs:
      - p11
      - p12
      - p13
  - id: q06
    type: evaluate
    prompt: 为什么微波炉比“新的宇宙现象”更值得先测试？
    answer: '微波炉常在2.45吉赫兹附近工作，而且午餐时最忙。她终于给下一次实验写出了明确失败条件。'
    page_refs:
      - p14
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '2015年1月19日清晨，林遥开始在帕克斯射电望远镜值班。六十四米的白色碟面越过桉树林，缓慢转向新的天空。'
        - text: 控制室的冷风让她握紧咖啡杯。
    - id: p02
      illustration: p02
      paragraphs:
        - text: '午饭前，搜索屏幕闪出一道短促弧线。高频先到，低频稍后，很像遥远脉冲穿过稀薄等离子体后的扫频。'
        - text: '那条弧只持续极短一瞬，却十分清楚。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '林遥的兴奋只维持了几秒。这个信号同时照亮十三路波束，而真正的远处点源通常只集中在其中一小片。'
        - text: '十三个窗口像一起举手，破坏了她的第一种猜想。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '老技师汤姆提醒她，附近的强干扰可以从侧面进入全部波束。林遥仍认为接收机故障也可能铺开真实天文信号。'
        - text: '两种解释都可能成立，必须由后面的测试来淘汰。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '她保存原始数据、天线方向和设备日志。露丝只把它称为“候选信号”，因为谁也不能让它再次出现。'
        - text: '林遥不愿把愿望写进结果，因此保留了未知。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '1月22日，第二个扫频到来。宽带监测器同时在2.3到2.5吉赫兹看到强活动。'
        - text: '两套仪器同时变化，使本地干扰变得更值得追查。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 主系统在约1.4吉赫兹收到弧线。第二天出现的第三个事件有相似却不完全相同的扫频。
        - text: '林遥把三次波形叠放，细小差别便显了出来。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '与真正经过冷等离子体的脉冲不同，这些弧线没有严格服从色散规律。林遥偏爱的天空解释因此变弱。'
        - text: '她第一次意识到，相似的外形不等于相同的来源。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '林遥检查时钟、更换线缆、开关设备，却没有一项操作能重现信号。每次尝试还占用宝贵的观测时间。'
        - text: '她期待屏幕回应，却只听见设备稳定的风声。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '露丝要求一个“可能失败的预测”。如果任何结果都能被解释成支持猜想，整个台站都会成为嫌疑人。'
        - text: 这项要求把漫无边际的排除变成了可以检验的计划。
    - id: p11
      illustration: p11
      paragraphs:
        - text: '林遥把档案里的peryton按本地时间排列。这些像天文脉冲的地面信号，大多出现在工作日和办公时间。'
        - text: '时间分布像人的脚步，而不像随机到来的天文事件。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '正午附近的记录最密。宇宙不会等人吃午饭，台站设备却会跟着人们的作息启动。'
        - text: '她把磕坏的苹果从图纸下拿出，重新看正午那一格。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '林遥预测人类设备会让高频尖峰白天多、夜间少，而且多数尖峰不会伴随peryton。监测记录支持了她。'
        - text: '几百次白天尖峰中只有少数伴随扫频，这又暴露出缺少的第二个条件。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '汤姆在地图上圈出工作人员厨房。微波炉常在2.45吉赫兹附近工作，而且午餐时最忙。'
        - text: '这个普通地点，第一次比遥远天空更像答案。'
    - id: p15
      illustration: p15
      paragraphs:
        - text: '林遥把“宇宙新现象”移到后面，把微波炉列为先测对象。她终于给下一次实验写出了明确失败条件。'
        - text: '若中午仍没有高频尖峰，这个新猜测就应当被放弃。'
    - id: p16
      illustration: p16
      paragraphs:
        - text: '窗外，巨碟仍朝着星空。林遥却转身看向那扇普通的厨房门，新的问题正藏在日常动作里。'
        - text: '她没有得到答案，却终于知道下一步怎样可能失败。'
