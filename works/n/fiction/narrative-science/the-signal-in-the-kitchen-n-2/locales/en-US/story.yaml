article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'Several microwave ovens stood near Parkes. Their magnetrons produced energy near 2.45 gigahertz, while metal cases and door mesh contained most of it.'
        - text: An ordinary kitchen machine had become an experiment requiring careful control.
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'That frequency explained the monitor spikes, but not the brief sweep in the main system. If ovens ran daily, why were perytons rare?'
        - text: The team needed the missing difference between daily operation and rare signals.
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'During maintenance on February 27, the team placed a mug of water in different ovens. They changed power and run time.'
        - text: Water absorbed the energy safely and kept each trial reasonably similar.
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Each timer ended normally. The monitor repeatedly brightened near 2.4 gigahertz, while all thirteen receiver beams remained quiet.'
        - text: This result rejected the simple claim that normal operation alone was enough.
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'One peryton appeared late that day. However, a tower test and someone’s Woolshed lunch overlapped, so neither action could be isolated.'
        - text: 'A beautiful coincidence was tempting, but it could not isolate one changed condition.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: Mara labeled the beautiful waveform “confounded.” Choosing the answer she liked would hide the condition they had missed.
        - text: She preferred one fewer conclusion to evidence that mixed two possible causes.
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'On March 12, they aimed the telescope toward directions linked to older perytons and repeated every normal test. Nothing appeared.'
        - text: 'Failure weakened the oven idea, yet suggested their test action was incomplete.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Ruth prepared to stop. Mara requested one final maintenance window, promising to compare real kitchen behavior instead of repeating failed steps.'
        - text: Ruth agreed because the new plan clearly stated when testing should stop.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Tom turned the cold mug and remembered that some adults pulled the door open before the final beep. The missing variable was an action.
        - text: Opening early shut down an operating magnetron differently from a normal ending. This was not an action for children or ordinary kitchen users to copy.
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Mara wrote three conditions: an operating magnetron, an early-opened door, and favorable geometry between kitchen and receiver. Any missing condition could prevent detection."
        - text: Only trained staff would perform the controlled test during approved maintenance.
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'On March 17, trained technician Tom started the old Woolshed microwave for the controlled test. After several seconds, he followed the approved safety plan and pulled the door open while Mara watched the control room.'
        - text: Ruth used a radio to match the distant kitchen action with receiver time.
    - id: p12
      illustration: p12
      paragraphs:
        - text: All thirteen beams lit together. They changed the delay and reproduced two more perytons exactly when the door opened.
        - text: 'Repetition made chance unlikely, although Mara still refused to celebrate early.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: The broadband monitor also recorded simultaneous activity. Next they turned the telescope so the dish blocked the kitchen from the receiver cabin.
        - text: This trial changed only the geometry while keeping every other condition similar.
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'The same early opening then produced no main-system peryton. Escaping energy mattered, but the receiver also needed the right position.'
        - text: The oven alone was therefore insufficient for the main receiver to record a peryton.
    - id: p15
      illustration: p15
      paragraphs:
        - text: The team still could not explain every detail of the sweep’s shape. They separated what the tests proved from what remained unknown.
        - text: They left the unknown part visible instead of filling it with a neat story.
    - id: p16
      illustration: p16
      paragraphs:
        - text: 'Mara admitted she had favored the sky explanation. That evening, she waited for her lunch timer to reach zero before opening the door.'
        - text: The ordinary final beep had become another condition worth recording carefully.
