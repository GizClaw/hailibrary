schema_version: 3
language: zh-CN
writer: 北辰
title: 最后几秒的线索
summary: '多次微波炉试验没有重现信号。林遥区分机器与人的动作，用可控制的条件找到peryton的来源。'
chapters:
  - id: ch01
    title: 最初的猜测
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
  - id: ch02
    title: 改变方向
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: cause-effect
    prompt: 正常运行为什么不能证明微波炉制造了peryton？
    answer: '监测器一次次在2.4吉赫兹附近变亮，十三路波束却没有弧线。'
    page_refs:
      - p03
      - p04
  - id: q02
    type: evidence
    prompt: 为什么第一次出现的波形只能算混杂结果？
    answer: '然而塔楼测试刚结束，厨房里也有人热饭，两个动作重叠，无法判断来源。'
    page_refs:
      - p05
      - p06
  - id: q03
    type: compare
    prompt: 最后一次测试与早先测试有什么关键不同？
    answer: '提前开门使磁控管在工作中突然关断，这与自然结束不同。'
    page_refs:
      - p07
      - p09
      - p11
  - id: q04
    type: character-motive
    prompt: 林遥为什么要求最后一个维护窗口？
    answer: '林遥请求最后一个维护窗口，但保证不再重复同样步骤，而要比较真实使用方式。'
    page_refs:
      - p08
      - p09
  - id: q05
    type: evidence
    prompt: 哪三条事实连成了来源证据？
    answer: 十三路波束同时亮起。高频监测器也同时记录到活动。同样的开门动作没有产生主系统信号。
    page_refs:
      - p11
      - p12
      - p13
      - p14
  - id: q06
    type: evaluate
    prompt: '团队找到来源后，为什么仍保留未知问题？'
    answer: 团队承认仍不知道扫频形状形成的全部细节。
    page_refs:
      - p14
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '帕克斯附近有几台微波炉。磁控管在约2.45吉赫兹产生能量加热食物，金属外壳和门网会挡住大部分能量。'
        - text: '厨房里最普通的机器，成了一个需要认真控制的实验对象。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '这个频率能解释监测器的高频尖峰，却解释不了主系统的短促扫频。若微波炉天天使用，peryton为何如此少见？'
        - text: '团队必须找出，少见信号与每天操作之间究竟差了什么。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '2月27日维护期间，团队把装水的陶瓷杯放进不同微波炉。他们改变功率和运行时间，再让计时自然结束。'
        - text: '水可以安全吸收能量，也让每次测试的条件保持相近。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '监测器一次次在2.4吉赫兹附近变亮，十三路波束却没有弧线。机器种类显然不是完整答案。'
        - text: 这项结果排除了“只要运行就会出现”的简单解释。
    - id: p05
      illustration: p05
      paragraphs:
        - text: '午后，一个peryton突然出现。然而塔楼测试刚结束，厨房里也有人热饭，两个动作重叠，无法判断来源。'
        - text: '漂亮的巧合很诱人，但它不能代替单独改变一个条件。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '林遥把漂亮波形记为“混杂结果”。如果她挑选最喜欢的解释，这次成功反而会遮住真正条件。'
        - text: '她宁愿少一个结论，也不愿把无法分开的事件当作证据。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '3月12日，他们让望远镜朝向过去容易接收peryton的方向，重复测试。所有计时结束后，屏幕仍然空白。'
        - text: '失败让微波炉假设动摇，却也说明原来的测试动作可能不完整。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '露丝准备终止实验。林遥请求最后一个维护窗口，但保证不再重复同样步骤，而要比较真实使用方式。'
        - text: '露丝同意，是因为新方案明确说明了测试何时应当停止。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '汤姆看着冷水杯，想起有些成人会在提示音前拉门。被忽略的变量不是机器，而是动作。'
        - text: '提前开门使磁控管在工作中突然关断，这与自然结束不同。儿童和普通使用者绝不能照着做。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '林遥写下三个条件：磁控管正在工作、门被提前打开、接收机与厨房的相对角度合适。少一项都可能失败。'
        - text: 只有受过训练的工作人员能在批准的维护时段进行受控测试。
    - id: p11
      illustration: p11
      paragraphs:
        - text: '3月17日，受过训练的技师汤姆为受控测试启动羊毛棚厨房的旧微波炉。几秒后，他按批准的安全方案拉开门。'
        - text: '厨房和控制室相隔一段距离，露丝用对讲机核对开门时刻。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 十三路波束同时亮起。他们改变等待时间，又重现两次。三个peryton都与开门时刻重合。
        - text: '重复结果使偶然巧合变得很不可能，林遥仍没有提前庆祝。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '高频监测器也同时记录到活动。接着他们转动望远镜，让碟面挡住厨房与焦点舱之间的视线。'
        - text: '这个改变只动了几何位置，其他条件保持相同。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '同样的开门动作没有产生主系统信号。证据把条件连起来：磁控管关断时能量逸出，接收机也要处在合适位置。'
        - text: '由此可见，微波炉工作本身并不足以让主接收机记录信号。'
    - id: p15
      illustration: p15
      paragraphs:
        - text: '团队承认仍不知道扫频形状形成的全部细节。找到来源没有消灭问题，它只是分开了已证明与尚未知。'
        - text: '未知部分被清楚留下，没有被一个完整故事悄悄填满。'
    - id: p16
      illustration: p16
      paragraphs:
        - text: '林遥在简报中承认自己曾偏爱天空解释。晚上，她让午饭计时归零；普通提示音响起后，她才开门。'
        - text: '那声普通提示音，如今也成了她认真记录过的一个条件。'
