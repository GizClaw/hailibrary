article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: At dawn on January 19, 2015, Mara began a shift at the Parkes radio telescope. Its sixty-four-meter dish turned above eucalyptus trees.
        - text: Cold control-room air made her tighten both hands around her coffee cup.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Before lunch, a brief curve crossed the search display. High frequencies arrived first, resembling a distant pulse dispersed by thin plasma in space.
        - text: The curve lasted only a moment, yet its shape was remarkably clear.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Mara’s excitement lasted seconds. The event lit all thirteen receiver beams, while a distant point in the sky usually favors a small group.
        - text: Thirteen bright panels challenged her first guess before she could celebrate.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Tom explained that strong nearby interference could enter every beam from the side. Mara argued that a receiver fault might spread a real sky event.
        - text: Both explanations remained possible and needed tests that could remove one.
    - id: p05
      illustration: p05
      paragraphs:
        - text: She saved raw data, antenna direction, and equipment logs. Ruth called it only a candidate because nobody could reproduce it.
        - text: Mara refused to turn hope into a result, so uncertainty stayed recorded.
    - id: p06
      illustration: p06
      paragraphs:
        - text: On January 22, a second sweep arrived. A broadband monitor simultaneously caught strong activity between 2.3 and 2.5 gigahertz.
        - text: The simultaneous frequency changes made local interference much harder to ignore.
    - id: p07
      illustration: p07
      paragraphs:
        - text: The main system saw its curve near 1.4 gigahertz. A third event came the next day with a similar but imperfect sweep.
        - text: Mara layered the three curves and noticed small differences among their shapes.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Unlike a genuine pulse dispersed by cold plasma, these curves did not follow the physical rule precisely. That weakened Mara’s favorite explanation.
        - text: She learned that a similar appearance did not guarantee a similar cause.
    - id: p09
      illustration: p09
      paragraphs:
        - text: She checked clocks, changed cables, and switched equipment. Nothing reproduced the event, while every test consumed valuable observing time.
        - text: She expected the display to answer, but heard only steady equipment fans.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Ruth demanded a prediction that could fail. If every result fit the idea, endless testing would make the entire observatory suspicious.
        - text: That demand changed endless exclusion into a plan with a clear boundary.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Mara sorted archived perytons by local time. These ground-based signals resembled sky pulses, yet most occurred on weekdays during working hours.
        - text: The timing followed human footsteps more closely than random events from space.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Records crowded around noon. The universe did not wait for lunch, but observatory equipment often followed the hours people kept.
        - text: She pulled her bruised apple from the plans and studied noon again.
    - id: p13
      illustration: p13
      paragraphs:
        - text: Mara predicted that human equipment would create more high-frequency spikes by day, with most spikes lacking a 1.4-gigahertz peryton.
        - text: Quiet nighttime records became evidence, rather than merely an absence of events.
    - id: p14
      illustration: p14
      paragraphs:
        - text: The monitor showed hundreds of daytime spikes and only a few matching sweeps. Her prediction worked but revealed a missing second condition.
        - text: For the first time, this ordinary room looked more promising than deep space.
    - id: p15
      illustration: p15
      paragraphs:
        - text: Tom circled the staff kitchen. Microwave ovens operate near 2.45 gigahertz, and this one worked hardest around lunch.
        - text: If noon brought no extra spikes, the new human-schedule idea would fail.
    - id: p16
      illustration: p16
      paragraphs:
        - text: Mara moved “new sky event” behind microwave oven on her list. Beyond the great dish, an ordinary kitchen door held the next question.
        - text: She still lacked an answer, but now knew how her next idea could fail.
