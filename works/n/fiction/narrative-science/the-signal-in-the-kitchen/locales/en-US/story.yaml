schema_version: 3
language: en-US
writer: north-star-map
title: The Signal in the Kitchen
summary: "A sky-like signal appears in all thirteen beams of the Parkes radio telescope, making new engineer Mara wonder whether it came from space. Technician Tom challenges that guess, while operations lead Ruth insists on a prediction that can fail. Clues in the signal's beam pattern, frequency, and lunchtime schedule instead point toward the observatory. Ordinary microwave tests fail until Tom identifies a missing action: real users sometimes open the door before the timer ends. A controlled test repeats the signal, and changing the telescope angle reveals the final condition. Mara corrects her first claim while keeping one part of the signal's strange sweep honestly unsolved."
chapters:
  - id: ch01
    title: Thirteen Beams
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: The Lunchtime Clue
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: The Missing Action
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: When the Door Opened
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: cause-effect
    prompt: Why did the thirteen bright beams make a source in the sky less likely?
    answer: "A distant point in the sky usually reaches one beam or a few neighboring beams, while nearby interference can enter all thirteen from the side."
    page_refs: [p03, p04]
  - id: q02
    type: evidence
    prompt: What evidence connected the strange sweeps with human activity at the observatory?
    answer: "The high-frequency spikes were common by day, rare at night, and crowded around lunchtime, although only a few came with a strange sweep."
    page_refs: [p07, p08, p09]
  - id: q03
    type: compare
    prompt: How did the first microwave tests differ from ordinary lunchtime use?
    answer: "During the first tests, every oven finished its cycle normally. In ordinary use, someone might open the door before the timer ended."
    page_refs: [p13, p14]
  - id: q04
    type: character-motive
    prompt: Why did Mara label the overlapping oven result confused instead of calling it proof?
    answer: "Two ovens had been used at nearly the same time, so she could not tell which action caused the signal."
    page_refs: [p12]
  - id: q05
    type: short-answer
    prompt: Which three conditions made a strange sweep more likely in the final test?
    answer: "The magnetron had to be operating, the door had to open before the timer ended, and the telescope had to face a favorable direction."
    page_refs: [p15, p16, p18]
  - id: q06
    type: main-idea
    prompt: What did Mara learn about solving a signal mystery?
    answer: "A convincing answer must explain all the clues, survive controlled changes, and still admit what the evidence has not explained."
    page_refs: [p17, p18, p19, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "On January 19, 2015, Mara began a dawn shift at the Parkes radio telescope. Beyond the glass, its huge white dish turned above the eucalyptus trees."
        - text: "She checked every receiver twice. It was her first week, and she wanted to notice anything unusual."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Just before lunch, a bright curve flashed across her screen. Its high frequencies arrived first and its low frequencies followed."
        - text: "The curve looked like a radio pulse changed by its long trip through space. Mara leaned closer."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Then she saw the same event in all thirteen receiver beams. A distant point in the sky usually reaches one beam or a few neighbors."
        - text: "Nearby interference, however, can enter every beam from the side. The first clue challenged Mara's favorite guess."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Tom, the senior technician, studied the glowing panels. 'All thirteen? Then it did not come politely through the front of the dish.'"
        - text: "Mara still wondered whether the receiver had spread a real sky event. Tom told her to keep both explanations in line."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "Mara saved the raw data, the dish direction, and the equipment logs. Ruth, the operations lead, asked whether they could make the event happen again."
        - text: "They could not. Mara recorded it as an unknown candidate, not a discovery."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Three days later, the sweep returned. A new monitor caught strong activity at a higher frequency at exactly the same moment."
        - text: "A third event appeared the next afternoon. Now a nearby source was harder to ignore."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Mara and Tom changed cables, checked clocks, and switched equipment on and off. Nothing brought the curve back."
        - text: "Each failed test used observing time. Ruth asked for a prediction that could truly fail."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "That evening, Mara sorted earlier events by local time. Most had appeared on working days, and the darkest group gathered around noon."
        - text: "The universe did not take lunch breaks. Machines used by people often did follow human schedules."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "Mara predicted that the monitor's high-frequency spikes would be common by day and rare at night. She also expected many spikes without the strange sweep."
        - text: "The records matched both predictions. Human activity was involved, but one more condition was missing."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Tom circled the staff kitchen on a site map. A microwave oven works near the frequency seen by the monitor, and ovens are busiest at lunch."
        - text: "Mara looked from the kitchen square to her bruised apple. The next suspect was surprisingly ordinary."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "During approved maintenance, Tom put a mug of water into each nearby oven. They tested different settings while Mara watched all thirteen beams."
        - text: "The monitor saw normal microwave activity, but the telescope saw no curved sweep."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "Once, a sweep did appear just after a tower test ended. But someone was also heating lunch in the staff kitchen."
        - text: "Two actions had overlapped, so Mara marked the result confused rather than proved. A beautiful curve could not replace a fair test."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "They repeated the tests on another day, with the dish facing promising directions. Every oven finished its cycle normally."
        - text: "Again, no sweep appeared. Mara began to fear that lunchtime had only fooled her."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Ruth was ready to stop. Mara asked for one last test that would copy ordinary use instead of repeating the same plan."
        - text: "Tom supplied the missing action: some people opened the oven door before the timer ended. Only trained staff would test it under the approved plan."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "Mara wrote a sharper prediction. The magnetron must still be running, the door must open early, and the telescope must face a useful direction."
        - text: "Ruth gave them twenty minutes. They would keep water in the mug and change one condition at a time."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "On March 17, Tom started the old kitchen microwave. After several seconds, he opened its door before the timer ended."
        - text: "All thirteen beams lit at once. Two more careful runs produced two more curves."
    - id: p17
      illustration: p17
      paragraphs:
        - text: "Mara did not cheer yet. Each curve matched the door-opening time, and the second monitor caught the higher-frequency activity too."
        - text: "The repeated timing tied the new test to the archived mystery. Now the evidence was strong."
    - id: p18
      illustration: p18
      paragraphs:
        - text: "Next they changed the telescope's direction. When the great dish blocked the path from kitchen to receiver, opening the door produced no sweep."
        - text: "At a favorable angle, the receiver could catch one. The answer required all three linked conditions."
    - id: p19
      illustration: p19
      paragraphs:
        - text: "The team had found the source, but one question remained. They still did not know exactly why the shutting magnetron made a curve that copied a space signal."
        - text: "Mara crossed out 'sky candidate' and wrote 'local interference.' She left the smaller mystery open."
    - id: p20
      illustration: p20
      paragraphs:
        - text: "That evening, observing began again. Mara heated her late lunch, waited for the beep, and only then opened the microwave door."
        - text: "Outside, the great dish turned under the stars. Back at her desk, Mara added lunchtime to the new observing log."
