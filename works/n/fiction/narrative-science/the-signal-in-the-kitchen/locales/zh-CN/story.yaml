schema_version: 3
language: zh-CN
writer: 北辰
title: 厨房里的星信号
summary: "帕克斯射电望远镜的十三路波束同时收到一道像天文脉冲的信号，新人工程师林遥起初希望它来自太空。老技师汤姆质疑这个猜想，运行负责人露丝则要求她提出可能失败的预测。波束分布、频率和午餐时间三条线索，把调查方向推回台站内部。微波炉正常运行的测试接连失败，汤姆才指出计时结束前开门这个漏测的日常动作。受控实验成功重现信号，改变望远镜方向又找出了最后一个条件。林遥修正了最初的判断，也诚实保留了扫频形成细节这个未解问题。"
chapters:
  - id: ch01
    title: 十三路波束
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 午餐时间的线索
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: 漏掉的动作
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: 门打开时
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: cause-effect
    prompt: 十三路波束同时变亮，为什么让天空来源变得不太可能？
    answer: "天空里的远处点源通常只进入一路或相邻几路波束，附近的强干扰却能从侧面进入全部十三路。"
    page_refs: [p03, p04]
  - id: q02
    type: evidence
    prompt: 哪些证据把怪信号和台站里的人类活动联系起来？
    answer: "高频尖峰在白天多、夜里少，而且集中在午餐前后，不过其中只有少数伴随怪扫频。"
    page_refs: [p08, p09]
  - id: q03
    type: compare
    prompt: 最初的微波炉测试与平常午餐时的使用方式有什么不同？
    answer: "最初测试时，所有微波炉都正常完成计时；平常使用时，有人可能在计时结束前拉开炉门。"
    page_refs: [p13, p14]
  - id: q04
    type: character-motive
    prompt: 林遥为什么把两台炉子重叠的结果记为混杂，而不是证据？
    answer: "因为两处动作时间重叠，她无法判断究竟是哪台炉子的哪个动作产生了信号。"
    page_refs: [p12]
  - id: q05
    type: short-answer
    prompt: 最终测试中，哪三个条件同时成立时更容易出现怪扫频？
    answer: "磁控管仍在工作、炉门在计时结束前打开、望远镜处在有利方向。"
    page_refs: [p15, p16, p18]
  - id: q06
    type: main-idea
    prompt: 林遥怎样才确认自己找到了可信的答案？
    answer: "她让答案解释已有线索，用重复测试和改变望远镜方向来检验它，同时承认扫频形成细节仍未解决。"
    page_refs: [p17, p18, p19]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "2015年1月19日，林遥在帕克斯射电望远镜值早班。玻璃窗外，六十四米的白色巨碟正从桉树林上方缓缓转过。"
        - text: "她把接收机状态检查了两遍。这是她工作的第一周，她不想漏掉任何异常。"
    - id: p02
      illustration: p02
      paragraphs:
        - text: "午饭前，屏幕闪出一道明亮的弧线。信号的高频先到，低频随后到达。"
        - text: "它很像穿过遥远太空后发生变化的射电脉冲。林遥把椅子拉近了一些。"
    - id: p03
      illustration: p03
      paragraphs:
        - text: "接着，她发现十三路波束里都有这个信号。天空里的远处点源，通常只进入一路或相邻几路波束。"
        - text: "附近的强干扰却可能从侧面闯进全部波束。第一条线索已经在反对她最喜欢的猜想。"
    - id: p04
      illustration: p04
      paragraphs:
        - text: "老技师汤姆盯着十三个亮起的窗口。‘全都看见了？那它不像从巨碟正面来的。’"
        - text: "林遥仍怀疑，接收机也许把真正的天空信号铺开了。汤姆提醒她，两种解释都要等待检验。"
    - id: p05
      illustration: p05
      paragraphs:
        - text: "林遥保存了原始数据、天线方向和设备日志。运行负责人露丝问，他们能不能让信号再次出现。"
        - text: "答案是不能。林遥只把它记成来源未知的候选信号，没有写成发现。"
    - id: p06
      illustration: p06
      paragraphs:
        - text: "三天后，扫频再次出现。就在同一时刻，新监测器还在更高的一段频率里看到强烈活动。"
        - text: "第二天下午，第三个事件又来了。信号来自附近的可能性更大了。"
    - id: p07
      illustration: p07
      paragraphs:
        - text: "林遥和汤姆更换线缆、检查时钟，还开关了不同设备，弧线始终没有回来。"
        - text: "每次失败都占用观测时间。露丝要求林遥提出一个真正可能失败的预测。"
    - id: p08
      illustration: p08
      paragraphs:
        - text: "那天晚上，林遥把过去的事件按本地时间排好。它们大多出现在工作日，正午前后的记录最密。"
        - text: "宇宙不会停下来吃午饭，台站里的机器却常跟着人的作息运转。"
    - id: p09
      illustration: p09
      paragraphs:
        - text: "林遥预测，高频尖峰应该白天多、夜里少，而且多数尖峰不会伴随怪扫频。"
        - text: "记录支持了这两点。人的活动参与了进来，但产生扫频还缺少一个条件。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "汤姆在台站地图上圈出工作人员厨房。微波炉工作的频率接近监测器看到的频率，午餐时又最常使用。"
        - text: "林遥看看厨房的位置，又看看桌下磕坏的苹果。新的嫌疑来自一个再普通不过的房间。"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "维护期间，汤姆往杯子里装水，再放进附近每台微波炉。他们改变功率和时间，林遥守着十三路数据。"
        - text: "监测器看到了正常的微波活动，望远镜却没有收到那道弧。"
    - id: p12
      illustration: p12
      paragraphs:
        - text: "有一次，塔楼测试刚结束，屏幕上真的出现了扫频。可是当时厨房里也有人在热午饭。"
        - text: "两个动作时间重叠，林遥把结果记为混杂。漂亮的弧线不能代替公平的测试。"
    - id: p13
      illustration: p13
      paragraphs:
        - text: "另一天，他们让巨碟朝向以前容易收到怪信号的方向，再次测试。每台炉子都正常完成了计时。"
        - text: "扫频依然没有出现。林遥开始担心，午餐时间只是一个巧合。"
    - id: p14
      illustration: p14
      paragraphs:
        - text: "露丝准备停止调查。林遥请求最后一次机会，她要模仿平常的使用动作，不再重复原来的计划。"
        - text: "汤姆想起，有人会在计时结束前拉开炉门。这个动作只能由受过训练的工作人员按批准方案测试。"
    - id: p15
      illustration: p15
      paragraphs:
        - text: "林遥写下更明确的预测：磁控管仍在工作，炉门提前打开，望远镜也处在有利方向。"
        - text: "露丝给他们二十分钟。他们必须在杯中放水，而且一次只改变一个条件。"
    - id: p16
      illustration: p16
      paragraphs:
        - text: "3月17日，汤姆启动厨房里的旧微波炉。几秒后，他在计时结束前拉开炉门。"
        - text: "十三路波束同时亮了。接下来的两次受控操作，又产生了两道弧线。"
    - id: p17
      illustration: p17
      paragraphs:
        - text: "林遥没有立刻欢呼。每道弧线都和开门时刻重合，高频监测器也同时亮起。"
        - text: "重复出现的时间关系，把新测试和过去的怪信号连在了一起。证据终于足够强了。"
    - id: p18
      illustration: p18
      paragraphs:
        - text: "接着，他们改变望远镜方向。当巨碟挡住厨房到接收机的路径时，同样开门也没有扫频。"
        - text: "换到有利角度，接收机才可能抓住它。答案需要三个条件一起成立。"
    - id: p19
      illustration: p19
      paragraphs:
        - text: "团队找到了信号来源，却还留下一个问题。他们仍不知道，正在关断的磁控管为何会制造出酷似太空信号的弧线。"
        - text: "林遥划掉‘天空候选’，写下‘本地干扰’，把这个更小的谜留在旁边。"
    - id: p20
      illustration: p20
      paragraphs:
        - text: "傍晚，观测重新开始。林遥去热迟到的午饭，等提示音响完才打开炉门。"
        - text: "外面，白色巨碟在星空下转动。回到控制室，她把午餐时间补进新的观测日志。"
