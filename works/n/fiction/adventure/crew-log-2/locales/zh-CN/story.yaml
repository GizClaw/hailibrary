questions:
  - id: q01
    type: evidence
    prompt: 哪些证据让林舟把“被耽误”改成“等待下一闸”？
    answer: 他观察了前船的宽度、系缆位置和调度信号，发现看似空着的位置并不安全，因此修正了自己的解释。
    page_refs:
      - p10
  - id: q02
    type: compare
    prompt: 林舟最初的“知道了”和后来的任务回答有什么不同？
    answer: 最初他只口头答应，却没有搬箱子。后来他会重复具体任务和需要的时间，并在核对完三个时间来源后才说完成。
    page_refs:
      - p01
      - p09
      - p14
  - id: q03
    type: cause-effect
    prompt: 林舟一句没有兑现的“知道了”，怎样一步步变成了险情？
    answer: 姑姑听见回答后以为箱子已有人处理，林舟却继续剪视频。风来时箱子滑动，他又越过黄线去抓，结果船员除了处理箱子和松绳，还要保护他。
    page_refs:
      - p01
      - p02
      - p03
      - p06
  - id: q04
    type: character-motive
    prompt: 林舟为什么把自己夸口的镜头和雨前的空甲板都留在影片里？
    answer: 两个镜头放在一起，正好显出他嘴上说懂责任，实际上却没有搬走箱子。他决定保留这种难堪，不用剪辑掩盖错误。
    page_refs:
      - p07
      - p08
  - id: q05
    type: main-idea
    prompt: 记录册里的雨痕为什么一直留到航程结束？
    answer: 雨痕记着林舟没完成的承诺和造成的后果。他没有撕掉那一页，而是在后面继续写下核对过的记录，说明承认错误和继续负责可以同时存在。
    page_refs:
      - p07
      - p16
  - id: q06
    type: evaluate
    prompt: 林舟后来的哪个行动最能证明他的“做完了”可以信任？
    answer: 姑姑要他核对交货时间时，他查看码头时钟、驾驶台和记录册，确认三个来源一致后才回答。
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 灰云压近时，姑姑叫林舟把蓝工具箱搬进篷里。他答应了，却继续剪视频。他嘴上接受任务，姑姑便把注意力转向别处的安全检查。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 第一阵风吹鼓篷布。工具箱在甲板上滑动，林舟才发现自己的“知道了”什么也没完成。影片里的闸门准时打开，现实中的工具箱却无人照管。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 他越过黄线想抓箱子。松绳突然抽在栏杆上，姑姑命令他立刻退回。那一步没有救回任何东西，反而让船员多了一个要保护的人。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 姑姑减速稳舵。老周穿好救生衣，从背风一侧用长钩拉回箱子，再固定松绳。老周先处理箱子，再控制松绳，顺序减少了新的危险。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 林舟只能站在安全区递备用绳。他手抖得解不开绳团，第一次没有递过去。老周等他重新理顺绳子，才接到备用绳。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 雨停后，姑姑指出：她听见回答，就按任务已经完成来安排。空着的不是一句话，而是船员不知道的危险。如果林舟直接说还没做，姑姑就会重新安排；沉默让危险继续。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 林舟承认自己只想剪完视频。他把阵风、减速和延误写进被雨洇湿的记录册。记录没有替他辩解，只留下事情发生的先后和真实后果。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 他保留了影片里夸口懂责任的片段，又接上雨前无人搬走的箱子，不用音乐遮掩。前后两个镜头互相冲突，他决定把这种难堪也保留下来。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 进入江苏后，煤船和建材船在晨雾里排队。林舟开始先复述任务，再说明自己需要多少时间。明确复述让姑姑知道任务是否开始，也让他自己不能含糊。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 另一次过闸，林舟以为空位被浪费。船宽、系缆点和信号却证明那不是安全位置。他把“被耽误”改成“等待下一闸”，因为证据改变了解释。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 靠近老桥时，周阿婆送来热面。她问林舟说的“古运河”究竟是桥、水、码头，还是今天跑船的人。她没有给出标准答案，而是把水边不同的人和物都放回问题里。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 对岸吊机在卸货，白鹭在桥边觅食。旧石桥和新港口同时出现在镜头里，林舟删不掉任何一边。活着的运河把过去的痕迹、今天的运输和水边生活放在了一起。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 目的地开始卸建材。林舟先询问，才拍外公的旧木斗，并说明它不属于某次虚构的漕粮航行。他先说明证据的范围，免得一个道具变成虚假的历史证明。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 姑姑要他核对交货时间。林舟查看码头时钟、驾驶台和记录册，确认完成后才回答。三个时间来源一致，他才把结果写下并交给姑姑。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 返航夜里，青禾号随闸室排水而下降。林舟收起手机，连续读出水尺并复核。闸室与下游相平后，闸门开启；这一次他没有漏掉读数。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 记录册里保留着歪线和雨痕，新写的线继续向前。林舟把影片改名为《水尺上的北方》。雨痕没有消失，却不再让他躲开那一页，也没有挡住后面的记录。
