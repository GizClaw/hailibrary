questions:
  - id: q01
    type: evidence
    prompt: What evidence made Daniel replace “delay” with “next chamber” in his note?
    answer: "Vessel width, line positions, and the lock signal showed that the open-looking space was not safe, so he revised his explanation."
    page_refs:
      - p10
  - id: q02
    type: compare
    prompt: How did Daniel’s first “Got it” differ from his later task reports?
    answer: "At first he agreed but left the case unmoved. Later he repeated the exact task and time needed, and he said the delivery-time check was finished only after three sources agreed."
    page_refs:
      - p01
      - p09
      - p14
  - id: q03
    type: cause-effect
    prompt: How did Daniel’s unfinished “Got it” grow into a dangerous situation?
    answer: "Aunt May believed the case was handled, but Daniel kept editing. When the case slid in the wind, he crossed the yellow line to grab it, so the crew had to protect him as well as secure the case and rope."
    page_refs:
      - p01
      - p02
      - p03
      - p06
  - id: q04
    type: character-motive
    prompt: Why did Daniel keep both his boastful clip and the shot of the unmoved case?
    answer: "Together, the clips showed the difference between claiming to understand responsibility and leaving the job undone. He chose to preserve that discomfort instead of hiding his mistake through editing."
    page_refs:
      - p07
      - p08
  - id: q05
    type: main-idea
    prompt: Why did the rain marks remain in the log through the end of the voyage?
    answer: "They recorded Daniel’s unfinished promise and its consequences. He kept that page and added later verified entries, showing that admitting the mistake and continuing to act responsibly could share the same record."
    page_refs:
      - p07
      - p16
  - id: q06
    type: evaluate
    prompt: Which later action best proves that Daniel’s word “finished” could be trusted?
    answer: "When Aunt May asked for the delivery time, he compared the terminal clock, wheelhouse, and log. He answered only after all three sources agreed."
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "As gray clouds approached, Aunt May told Daniel to shelter the blue tool case. He agreed, then kept editing. His answer let Aunt May turn her attention to another safety check."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "The first gust filled the tarpaulin. The case slid across the deck, and Daniel saw that “Got it” had completed nothing. The gate opened on time in his video, while the real case remained unattended."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "He crossed the yellow line to grab it. A loose rope struck the rail, and Aunt May ordered him back. Crossing the line saved nothing and gave the crew another person to protect."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Aunt May slowed and steadied the boat. Wearing his life vest, Mr. Wu came from the sheltered side with a boat hook. Mr. Wu handled the case before the rope, choosing an order that reduced danger."
    - id: p05
      illustration: p05
      paragraphs:
        - text: Daniel could only pass a spare line from the safe area. His shaking hands trapped the end inside the coil, so the first handoff failed. Mr. Wu waited until Daniel sorted it and passed the line again.
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Afterward, Aunt May explained that his answer made her count the job as finished. His empty promise had hidden a danger. If he had reported the delay, Aunt May could have changed the plan."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Daniel admitted he wanted to finish the video. He logged the gust, reduced speed, and delay on the rain-spotted page. The log offered no excuse; it preserved the sequence and consequences."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "He kept the clip where he claimed to understand responsibility, then added the unmoved case before the storm without music. The two clips contradicted each other, and he decided to keep that discomfort."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "In Jiangsu, coal and building-material boats queued in morning mist. Daniel began repeating each task and stating the time he needed. Repeating tasks told the crew what had begun and kept him from hiding uncertainty."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "At another lock, he guessed that open chamber space was wasted. Vessel width, line positions, and the signal proved it unsafe. He changed his note from delay to next chamber because evidence changed the explanation."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "Near an old bridge, Mrs. Zhou brought noodles. She asked whether his “old canal” meant the bridge, water, port, or working families. She gave no final answer; she returned several real parts of canal life to his question."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "A crane unloaded across from an egret hunting by the bridge. The old stone bridge and the new port shared Daniel’s frame. The living canal held traces of the past, present transport, and waterside life together."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "At the terminal, Daniel asked before filming Grandpa’s wooden measure. He explained that it belonged to no invented grain voyage. He limited his claim so one object could not become false historical proof."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Aunt May asked him to verify delivery time. He checked the terminal clock, wheelhouse, and log before saying it was finished. Only when all three sources agreed did he record the delivery time."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "In a night lock, the River Lark fell as water emptied downstream. Daniel put away his phone and checked every reading. The gate opened after chamber and downstream reach matched, and he missed no reading."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "The log kept its crooked line and rain marks, while new lines continued. Daniel titled his film North by the Water Gauge. The rain marks remained, but they no longer stopped him from using the page."
