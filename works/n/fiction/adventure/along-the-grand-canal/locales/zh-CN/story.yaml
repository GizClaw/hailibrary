schema_version: 3
language: zh-CN
writer: 北辰
title: 水尺上的北方
summary: 林舟想把大运河拍成一条漂亮又古老的水路，却在真实航程中不断遇见不合想象的证据。一次没有完成的任务造成险情后，他开始学会准确回应、认真记录，也重新理解了这条仍在工作的运河。
chapters:
  - id: ch01
    title: 太细的蓝线
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 没有搬走的箱子
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 雨痕之后
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: evidence
    prompt: 哪两处证据让林舟发现自己画的蓝线太简单？
    answer: 姑姑说明他们十二天只能走一小段，而河岸的仓库、柳树、吊机、旧桥和支流又证明运河不是单一不变的古老水道。
    page_refs: [p02, p03]
  - id: q02
    type: compare
    prompt: 林舟第一次和返航时过船闸，有哪些不同？
    answer: 第一次他忙着拍摄，差点漏记水尺；返航时他把手机收好，读出并复核每个读数，还耐心等水位相平。
    page_refs: [p05, p17]
  - id: q03
    type: cause-effect
    prompt: 林舟没有搬工具箱，怎样一步步变成了险情？
    answer: 姑姑听见他答应后以为任务已完成，他却继续剪片。风雨来时箱子滑动、篷布松开，他又越过黄线去抓，结果松绳差点打中他。
    page_refs: [p07, p08, p09]
  - id: q04
    type: character-motive
    prompt: 林舟为什么把自己夸口的旧镜头留在影片里？
    answer: 他不想用删除来躲避错误，于是让夸口的镜头和雨前未搬的箱子相接，诚实说明自己答应了却没有做到。
    page_refs: [p12]
  - id: q05
    type: evidence
    prompt: 哪些行动证明林舟后来对“完成任务”的理解改变了？
    answer: 他会复述任务并说明需要的时间，交货时又核对三个时间来源，确认无误后才说“做完了”。
    page_refs: [p13, p16]
  - id: q06
    type: compare
    prompt: 林舟最初想拍的运河和最后影片里的运河有什么不同？
    answer: 最初他只想拍一条漂亮、古老的蓝线；最后他保留了旧桥、吊机、货船、船闸、错误和雨痕，呈现一条有过去也仍在工作的真实运河。
    page_refs: [p01, p02, p14, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林舟第一次跟姑姑跑货船。他站在黄线内举起手机，想把拱宸桥的三孔全装进镜头。他还想沿着地图上的蓝线一路拍到北京。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 姑姑林岚提醒他，十二天只能走其中一小段。青禾号装着建材去江苏，岸边既有柳树和旧屋，也有仓库、吊机和高架桥。这和林舟想象的古老静水不同。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林岚拿出外公留下的旧木斗。她说，大运河由一段段水道连接而成，过去运过漕粮，如今仍有货船来往。窗外一条支流汇入，林舟发现自己的蓝线确实太细。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 第二天，许多货船在引航道排队。调度员按船的大小和货物安排进闸次序。林舟以为门边有空位就能先走，却看见一条小船靠近后又退了回来。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 青禾号进入闸室，身后的门关闭。高处的水流进来，船和水面一起升高。林舟一会儿看手机，一会儿抄水尺，差点漏掉第二个读数。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 水位与上游相平，前门才打开。林舟忙着等适合配乐的画面，反而忘了录像。午后，老周叫他检查碰垫，他放下手机，虽然没发现故障，却完成了一次真正的检查。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 第三天下午，灰云压近。林岚叫林舟把蓝工具箱搬进篷里。他答应“马上”，手指却仍在调整船闸视频，让闸门正好跟着音乐打开。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 大风吹鼓蓝篷布，工具箱在雨中滑动。林舟这才冲向船尾。松开的绳子抽打栏杆，他却跨出黄线，伸手去抓箱子。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 林岚立刻减速稳舵，命令林舟退回。松绳从他面前甩过。老周穿好救生衣，从背风一侧用长钩拉回箱子，再踩住松绳固定篷布。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 林舟只能站在安全区递备用绳。他的手一直抖，第一次递绳时还把绳头攥在手里，老周等他重新理顺才接过去。风雨过去后，箱子和货物都保住了。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 林岚问：“我第一次让你做什么？”林舟终于明白，他答应后，船员就会当作任务有人完成。那句“马上”留下的空缺，别人根本看不见。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 林舟把阵风、减速和延误写进被雨洇湿的记录册。晚上，他保留自己夸口懂责任的旧镜头，又接上雨前无人搬走的箱子。他承认：“我说搬，却没有搬。”他没有配音乐。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 进入江苏后，林舟把手机留在舱里。他先复述任务，再说明需要多久。如果正在抄水尺，他会问：“还要两分钟，来得及吗？”姑姑听清后再安排下一件事。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 靠近老石桥时，周阿婆送来热面。对岸吊机正在卸货，白鹭在芦苇边觅食。林舟问哪一个才是古运河，她反问：“桥、水、码头，还是今天跑船的人？”
    - id: p15
      illustration: p15
      paragraphs:
        - text: 林舟看着旧桥、新吊机和来往货船，无法再删掉其中一边。他放大最初的地图，看见蓝线分成桥、船闸、支流和港口。他开始修改影片，不再让运河假装从未变化。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 在淮安附近卸货时，林舟先问姑姑，才拍外公的木斗，并说明它不属于某次古代航行。核对交货时间时，他看过码头时钟、驾驶台显示屏和记录册，才说：“做完了。”
    - id: p17
      illustration: p17
      paragraphs:
        - text: 返航的夜里，青禾号在闸室中随水面下降。林舟收起手机，依次读出水尺，再复读确认。他等闸室与下游水位相平，才看见前门缓缓打开。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 林舟把最后一个读数写在旧雨痕旁，没有撕掉那一页。他把影片改名为《水尺上的北方》。镜头里的记录线经过桥、船闸和雨痕，又继续向前。
