schema_version: 3
language: en-US
writer: north-star-map
title: North by the Water Gauge
summary: "Daniel expects to film the Grand Canal as one beautiful, ancient line, but the working waterway keeps challenging his picture. After an unfinished task creates danger, he learns to report clearly, record carefully, and let evidence reshape both his film and his idea of the canal."
chapters:
  - id: ch01
    title: A Line Too Thin
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: The Unmoved Case
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: Beyond the Rain Mark
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: evidence
    prompt: What two pieces of evidence showed Daniel that his blue route line was too simple?
    answer: "Aunt May explained that twelve days covered only a small section, while the warehouses, willows, cranes, old bridges, and side channel showed that the canal was not one unchanged ancient waterway."
    page_refs: [p02, p03]
  - id: q02
    type: compare
    prompt: How did Daniel behave differently at the first lock and the return lock?
    answer: "At the first lock, filming almost made him miss a gauge reading. On the return, he put away his phone, read and repeated every measurement, and waited for the water levels to match."
    page_refs: [p05, p17]
  - id: q03
    type: cause-effect
    prompt: How did Daniel’s failure to move the tool case grow into danger?
    answer: "Aunt May heard his promise and believed the task was handled, but Daniel kept editing. When wind moved the case and loosened the tarp, he crossed the yellow line to grab it, and a rope nearly struck him."
    page_refs: [p07, p08, p09]
  - id: q04
    type: character-motive
    prompt: Why did Daniel keep the old clip in which he claimed to understand responsibility?
    answer: "He did not want deletion to hide his mistake, so he placed the boast beside the unmoved case and plainly admitted that he had promised but had not acted."
    page_refs: [p12]
  - id: q05
    type: evidence
    prompt: Which actions prove that Daniel’s idea of a finished task changed?
    answer: "He began repeating each task and reporting the time he needed. At delivery, he checked three time sources before saying, “Finished.”"
    page_refs: [p13, p16]
  - id: q06
    type: compare
    prompt: How did the canal in Daniel’s first plan differ from the canal in his final film?
    answer: "At first, he wanted one beautiful, ancient blue line. His final film kept old bridges, cranes, cargo boats, locks, his mistake, and the rain-marked log, showing a canal with a past that still works today."
    page_refs: [p01, p02, p14, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "Daniel was joining his aunt’s cargo boat for the first time. From inside the yellow safety line, he raised his phone toward Gongchen Bridge. He planned to follow the blue route on his map and film all the way to Beijing."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Aunt May reminded him that twelve days would cover only a small section. The River Lark carried building material toward Jiangsu. Willows and tiled roofs stood beside warehouses, cranes, and a railway, unlike Daniel’s picture of a quiet ancient canal."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Aunt May showed him Grandpa’s worn wooden grain measure. She explained that separate waterways became a great transport system, once carrying grain and now serving working boats. As a side channel joined the canal, Daniel saw that his blue line was too thin."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "The next morning, cargo boats queued in the lock approach. Operators arranged them by size and load. Daniel thought any gap meant a boat could go first. Then he watched a small vessel approach the gate and back away."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "The River Lark entered the chamber, and the rear gates closed. Water from the higher reach flowed in, lifting the boat with the surface. Daniel shifted between his phone and the wall gauge, nearly missing the second reading."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Only when the chamber matched the upper level did the front gates open. Daniel had waited for a perfect video moment, yet forgot to record it. Later, he lowered his phone to inspect a fender; finding no fault still completed a real check."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "On the third afternoon, gray clouds approached. Aunt May told Daniel to shelter the blue tool case. He promised to do it, but kept adjusting his lock video so the gate would open with the music."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "Wind filled the blue tarpaulin, and the case slid across the rainy deck. Daniel finally ran aft. A loose rope struck the rail as he stepped beyond the yellow line and reached for the case."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "Aunt May slowed and steadied the boat, ordering Daniel back. The rope whipped past him. Wearing his life vest, Mr. Wu approached from the sheltered side, pulled the case back with a boat hook, and pinned the loose line."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Daniel could only pass a spare line from the safe area. His hands shook, and on his first try, he clutched the rope end instead of letting it run free. Mr. Wu waited while he sorted it. After the storm, both the tools and cargo were safe."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "“What did I ask you to do?” Aunt May said. Daniel understood at last: once he accepted a task, the crew planned as if it were finished. No one else could see the gap hidden inside his promise."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "Daniel wrote the gust, slower speed, and delay in the rain-marked log. That night, he kept an old clip where he boasted about responsibility, then showed the unmoved case. “I said I would move it, and I didn’t.” He added no music."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "In Jiangsu, Daniel left his phone in the cabin. He repeated each job and said how long he needed. If he was recording the gauge, he asked, “I need two more minutes. Is that soon enough?” Then Aunt May could plan."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Near an old stone bridge, Mrs. Zhou brought hot noodles. A crane unloaded across the water while an egret hunted in the reeds. Daniel asked which part was the old canal. She replied, “The bridge, the water, the port, or today’s boat crews?”"
    - id: p15
      illustration: p15
      paragraphs:
        - text: "Daniel could no longer cut either the old bridge or new crane from the scene. He enlarged his first map until the blue line divided into bridges, locks, side channels, and ports. His revised film would not pretend that the canal had never changed."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "During unloading near Huai’an, Daniel asked before filming Grandpa’s measure. He explained that it belonged to no ancient grain voyage. To verify delivery time, he compared the terminal clock, wheelhouse display, and log before saying, “Finished.”"
    - id: p17
      illustration: p17
      paragraphs:
        - text: "On the return trip, the River Lark descended as water drained from the lock at night. Daniel put away his phone, read every gauge mark, and repeated each result. He waited until the chamber matched the lower reach before the front gates opened."
    - id: p18
      illustration: p18
      paragraphs:
        - text: "Daniel wrote the last reading beside the old rain mark and did not tear out the page. He renamed his film North by the Water Gauge. In its final shot, lines in the open log traveled past bridges, locks, and rain, then continued north."
