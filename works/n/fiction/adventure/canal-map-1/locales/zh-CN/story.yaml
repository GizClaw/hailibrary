      - p12
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: evidence
    prompt: 哪些细节证明运河不是一条安静、从未改变的直线？
    answer: 青禾号只走全程中的一小段；两岸同时有仓库、柳树、旧屋和高架桥；历代还不断修建、改变河道。
    page_refs:
      - p03
      - p04
      - p06
      - p07
  - id: q02
    type: compare
    prompt: 林舟的蓝线地图和眼前的送货航程有什么不同？
    answer: 地图是从杭州到北京的一条笔直蓝线，眼前的送货船却只去江苏，沿岸还挤着仓库、柳树、旧屋和高架桥。
    page_refs:
      - p01
      - p03
      - p04
  - id: q03
    type: cause-effect
    prompt: 为什么闸室和上游水位相平前，前方闸门不能打开？
    answer: 高处的水流入闸室后，闸室水位才不断上升。如果两边还没相平，闸门两边的水压不同；只有水位匹配后，闸门才能安全打开。
    page_refs:
      - p11
      - p12
      - p13
  - id: q04
    type: character-motive
    prompt: 林舟为什么错过闸门打开的录像？
    answer: 他把注意力放在水尺和进闸、出闸的读数上，先完成了姑姑交给他的记录任务，所以忘了录像。
    page_refs:
      - p14
  - id: q05
    type: main-idea
    prompt: 为什么林舟最初的一条蓝线不足以表示他看到的运河？
    answer: 真实的运河两岸有旧景和现代设施，水上还有送货、调度、过闸和检查等实际工作，这些都不是一条笔直蓝线能够表示的。
    page_refs:
      - p01
      - p03
      - p04
      - p08
      - p16
  - id: q06
    type: evaluate
    prompt: 检查碰垫没发现问题，为什么老周仍说这不是白检查？
    answer: 林舟放下手机完成了船上真正需要的工作；只有检查后，他们才知道碰垫的绳子没有松。
    page_refs:
      - p15
      - p16
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林舟登上青禾号，想拍一部从杭州到北京的影片。他的地图上只有一条笔直蓝线。他还没问清航程，就先给影片起了一个很大的名字。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 船从拱宸桥下经过。姑姑让他退回黄线内，因为鞋后就是一圈粗缆绳。桥洞放大了发动机声，天光又在船头突然亮开。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 青禾号只到江苏送建材。十二天的航程，不可能走完北京到浙江的整个运河系统。地图上的全程和眼前这趟送货，尺度完全不同。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 仓库、柳树、旧屋和高架桥挤在两岸。林舟原先想象的安静古河并不存在。每过一座桥，旧景和新景就换一次位置。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 姑姑拿出外公留下的木升斗。过去，大运河运送漕粮和其他重要物资。木斗的边角已经磨圆，林舟不敢替它编造年代。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 她告诉林舟，水道很早就分段开凿，隋代形成南北交通系统，后来又不断改变。这段历史解释了河道的联系，却不能把所有地方说成一样。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 到了元代，人工水道超过两千公里，连接五大水系。这不是一条从未改变的沟。地图上的直线因此显得过分简单，也遮住了变化。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 第二天，货船在船闸外依次等待。船名、大小、吨位和货种通过无线电报告。调度不是让一条船最快，而是安排一批船安全进闸。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 林舟认为前面有空位就能进去。姑姑让他观察船宽、系缆位置和调度信号。看似空着的位置不一定安全，不能只凭一条船的视角判断。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 青禾号终于进入闸室。闸门关上，高墙上的湿痕远在船顶上方。林舟仰头时，第一次感到上下游真的不在同一高度。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 高处的水靠重力流入，闸室水位上升。林舟看见船和漂叶一起升高。没有钢索吊船，变化来自不断升高的整个水面。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 他以为泵在推船。水尺的连续变化证明，是水面托着整条船向上。漂叶始终贴着水面，这个细节推翻了他的猜测。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 前方闸门仍关闭，因为闸室和上游水位不同。两边相平后，门才打开。水压不同的时候强开闸门，并不是可以争取的快捷办法。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 林舟忘了录像，却记下进闸和出闸读数。他第一次觉得记录不是假差事。歪斜的笔迹记录了船身移动，也记录了他的分心。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 下午，一座七孔石桥滑过镜头。老周叫他检查碰垫，他放下手机，错过了桥影。他失去一个好镜头，却完成了一件船上真正需要的工作。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 碰垫的绳子没有松。老周说，没出事不等于白检查。林舟没有把这句话录进手机；桥已经留在身后，他完成的检查却没有因此变得多余。
