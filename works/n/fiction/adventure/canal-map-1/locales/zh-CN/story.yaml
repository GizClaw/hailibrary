questions:
  - id: q01
    type: evidence
    prompt: 什么证据改变了林舟最初的判断？
    answer: 高处的水靠重力流入，闸室水位上升。林舟看见船和漂叶一起升高。没有钢索吊船，变化来自不断升高的整个水面。
    page_refs:
      - p10
      - p11
      - p12
  - id: q02
    type: compare
    prompt: 林舟前后的做法有什么不同？
    answer: 下午，一座七孔石桥滑过镜头。老周叫他检查碰垫，他放下手机，错过了桥影。他失去一个好镜头，却完成了一件船上真正需要的工作。
    page_refs:
      - p02
      - p15
  - id: q03
    type: cause-effect
    prompt: 一个选择怎样带来后面的结果？
    answer: 仓库、柳树、旧屋和高架桥挤在两岸。林舟原先想象的安静古河并不存在。每过一座桥，旧景和新景就换一次位置。
