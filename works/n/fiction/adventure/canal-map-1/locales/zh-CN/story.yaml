schema_version: 3
language: zh-CN
writer: 北辰
title: 蓝线之外
summary: 林舟以为运河是一条古老直线，真实的桥、货船和船闸不断改写他的判断。
chapters:
  - id: ch01
    title: 出发
    page_refs:
