questions:
  - id: q01
    type: evidence
    prompt: "Which details show that the canal is not one quiet, unchanged line?"
    answer: "The River Lark traveled only one part of the route. Warehouses, willows, old roofs, and modern structures shared the banks, and people had rebuilt and changed canal sections over time."
    page_refs:
      - p03
      - p04
      - p06
      - p07
  - id: q02
    type: compare
    prompt: How did Daniel’s blue-line map differ from the delivery voyage?
    answer: "The map showed one straight route from Hangzhou to Beijing, while the delivery boat went only to Jiangsu past banks crowded with warehouses, willows, old roofs, and a railway."
    page_refs:
      - p01
      - p03
      - p04
  - id: q03
    type: cause-effect
    prompt: Why could the upper gate not open before the chamber matched the upper water level?
    answer: "Water from the higher reach first had to raise the chamber. Until the levels matched, unequal pressure remained across the gate; matching the levels made a safe opening possible."
    page_refs:
      - p11
      - p12
      - p13
  - id: q04
    type: character-motive
    prompt: Why did Daniel miss filming the lock gate as it opened?
    answer: "He focused on the gauge and recorded the entry and exit readings first, so he forgot to start the video."
    page_refs:
      - p14
  - id: q05
    type: main-idea
    prompt: Why was Daniel’s first blue line too small for the canal he observed?
    answer: "The real canal had old and modern structures along its banks, as well as deliveries, dispatch, locks, and inspections that one straight blue line could not show."
    page_refs:
      - p01
      - p03
      - p04
      - p08
      - p16
  - id: q06
    type: evaluate
    prompt: Why did Mr. Wu say the fender inspection was not pointless when nothing was wrong?
    answer: "Daniel put down his phone and completed work the crew truly needed. Only the inspection showed that the fender was secure."
    page_refs:
      - p15
      - p16
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Daniel boarded the River Lark to film a journey from Hangzhou to Beijing. His map showed one straight blue line. He named the film before asking how far the boat would actually travel.
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Under Gongchen Bridge, Aunt May sent him behind the yellow boundary. A coil of heavy rope lay behind his shoe. The arch enlarged the engine sound, then released the boat into bright morning."
    - id: p03
      illustration: p03
      paragraphs:
        - text: Their cargo of building material was bound only for Jiangsu. A twelve-day trip could not cover the whole canal system. The full route on his map and this delivery voyage belonged to very different scales.
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Warehouses, willows, old roofs, and a railway crowded the banks. The quiet antique river Daniel expected did not exist. At each bend, old structures and modern work changed places in his frame."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "Aunt May showed him Grandpa’s wooden grain measure. The canal once carried tax grain and other important goods. Its worn corners suggested use, but they did not prove a date or a famous voyage."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "She explained that waterways were dug in sections, joined as a north-south system in the Sui dynasty, and changed later. That history explained connections without making every canal section identical."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "By the thirteenth century, over two thousand kilometers of artificial waterways linked five river basins. It was never one unchanged ditch. His straight line now seemed too simple because it hid those changes."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "The next day, cargo boats waited outside a lock. Radios reported vessel names, sizes, tonnage, and cargo. Dispatch aimed to arrange a safe chamber, not simply reward the fastest boat."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "Daniel thought every open space should be filled. Aunt May told him to study vessel width, line positions, and signals. A place that looked open from one boat was not necessarily safe."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "At last, the River Lark entered the chamber. Gates closed, and old wet marks stood high above the roof. Looking upward, Daniel finally felt that the two reaches stood at different heights."
    - id: p11
      illustration: p11
      paragraphs:
        - text: Water from the higher reach flowed in by gravity. Daniel watched the boat rise with a leaf beside the wall. No cable lifted the hull; the whole supporting surface moved upward.
    - id: p12
      illustration: p12
      paragraphs:
        - text: "He had guessed that pumps lifted the boat. The changing gauge showed that the rising water carried the whole vessel. The leaf stayed on the surface, and that observation overturned his guess."
    - id: p13
      illustration: p13
      paragraphs:
        - text: The upper gate stayed shut while chamber and upper reach had different levels. It opened only after they matched. Opening against unequal water pressure was not a shortcut the crew could demand.
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Daniel missed the video, but he recorded both gauge readings. The log no longer felt like a pretend assignment. His crooked pencil mark recorded both the moving hull and his divided attention."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "That afternoon, a seven-arch bridge entered his frame. Mr. Wu asked him to inspect a fender, so he missed the reflection. He lost a beautiful shot but completed work the crew truly needed."
    - id: p16
      illustration: p16
      paragraphs:
        - text: "The fender was secure. Mr. Wu said that finding nothing wrong was not the same as checking for nothing. Daniel did not record the sentence; the bridge was behind him, but that did not make the completed inspection pointless."
