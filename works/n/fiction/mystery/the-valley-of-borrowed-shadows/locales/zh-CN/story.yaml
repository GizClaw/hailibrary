schema_version: 1
language: zh-CN
writer: 北辰
title: 借来影子的山谷
summary: 山谷钟楼明明只照到一个太阳，却投下两道影子。李和塔玛检验不同解释，查出浅影来自山脊上的反光镜，并帮助两地居民重新引导有用的光，使它不再干扰时钟。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 耐心而准确, timbre: 低沉的成年声音, pace: 中慢, pitch: 中低音}}
  li: {display_name: 李, tts: {delivery: 善于分析并保持开放, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  oren: {display_name: 奥伦, tts: {delivery: 起初谨慎后来愿意合作, timbre: 浑厚的年长声音, pace: 中慢, pitch: 低音}}
  tama: {display_name: 塔玛, tts: {delivery: 机敏而爱追问, timbre: 明亮的青年声音, pace: 中快, pitch: 中高音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "黎明时，李带着一枚琥珀色棱镜走进深谷。"}, {speaker: narrator, text: "她要调查镇上那座越来越不可靠的日影钟。"}]}
  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content: [{text: "石钟楼在空广场上投下两道很长的"}, {vocabulary: {id: shadow, text: 影子}}, {text: "。"}]
      - {speaker: li, text: "两个暗形状，可能说明这里有不止一个光源。"}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "塔玛用不同颜色的绳子标出两道边缘。"}, {speaker: tama, text: "深影指向西边，浅影却指向另一个方向。"}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "有人猜天上出现了第二个太阳，有人指向山脊。"}, {speaker: li, text: "一种说法要能预告我们接下来会看到什么，才值得检验。"}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "李仔细比较两道影子。"}, {speaker: narrator, text: "一道边缘清楚、呈灰色，另一道较浅，还带着一点绿色。"}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "带绿色的浅影迅速缩短。"}, {speaker: narrator, text: "同一段时间里，太阳形成的深影只移动了一点。"}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "李把棱镜放进横穿广场的带尘光束。"}, {speaker: narrator, text: "散开的颜色表明，这只是被反射过的普通阳光。"}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "光束向上延伸，通向山脊上一道巨大的弧形轮廓。"}, {speaker: tama, text: "第二束光可能来自高处，而不是第二个太阳。"}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "塔玛给李看古老的圆形钟面。"}, {speaker: narrator, text: "两道指针影子互不重合，居民无法可靠地判断时间。"}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "李和塔玛沿维护良好的石阶上山，没有穿越陡坡。"}, {speaker: narrator, text: "那束反光始终悬在他们上方。"}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "山脊上，奥伦守着一面被布遮住一半的巨镜。"}, {speaker: oren, text: "山谷很少追问冬天的光从哪里来。"}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "一排排弧形旧镜面朝山谷展开。"}, {speaker: narrator, text: "原来的水槽装置能让它们随着太阳一起转动。"}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "奥伦轻轻转动其中一面镜子。"}, {speaker: narrator, text: "一道温暖的反光随即滑过下方广场。"}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "远处的浅影在完全相同的时刻移动了。"}, {speaker: li, text: "这种同步变化支持反光镜的解释。"}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "奥伦揭开旧机构旁开裂的水槽。"}, {speaker: oren, text: "为了让山脊温室保持温暖，我只好用手调整镜面。"}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "他的模型显示，阳光被送进背阴的温室。"}, {speaker: narrator, text: "少了这份能量，幼苗在冬季会生长得更慢。"}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "塔玛从错乱的时钟望向远处温室。"}, {speaker: tama, text: "同一束光帮助了一个地方，却干扰了另一个地方。"}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "李在山脊和山谷模型之间放下两枚光线圆片。"}, {speaker: li, text: "我们需要一个避开时钟、又能服务温室的接收点。"}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "两地居民围着共同的模型比较方案。"}, {speaker: narrator, text: "他们没有关闭所有镜面，而是选择另设接收器。"}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "大家共同调整角度。反光镜转离钟楼广场，把光送向接入山脊系统的浅色石头接收器。"}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "钟楼终于重新只投下一道清楚的影子。"}, {speaker: narrator, text: "山脊接收器仍在发亮，温室也保留了需要的光。"}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "日出时李离开了，奥伦和塔玛正在共同检查修好的控制装置。"}, {speaker: tama, text: "以后一个山谷影响另一个山谷，双方都来查看证据。"}]}
chapters:
  - {id: ch01, title: 两道影子, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 来自山脊的光, page_refs: [p07, p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: 一束光的两种影响, page_refs: [p15, p16, p17, p18]}
  - {id: ch04, title: 共同的接收点, page_refs: [p19, p20, p21, p22]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "哪些证据把浅影和山脊反光镜联系起来？", answer: "绿色光束指向山脊，而且奥伦转动镜面时，浅影在同一时刻移动。", page_refs: [p05, p07, p08, p13, p14]}
  - {id: q02, type: compare, speaker: narrator, prompt: "两道影子的变化有什么不同？", answer: "太阳形成的深影边缘清楚、变化慢；反射形成的浅影带绿色，并会随镜面迅速变化。", page_refs: [p05, p06, p13, p14]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "奥伦为什么一直用手调整反光镜？", answer: "旧水槽已经开裂，他又希望把阳光送进背阴的温室。", page_refs: [p12, p15, p16]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "两地居民为什么没有关掉所有镜面？", answer: "那样虽能修正时钟，却会夺走帮助山脊温室的光。", page_refs: [p16, p17, p18, p19]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "为什么另设接收器是更好的方案？", answer: "它让反光离开钟楼，同时把有用能量留给温室，兼顾了两种影响。", page_refs: [p18, p19, p20, p21]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "李的调查说明了怎样的中心思想？", answer: "检验预测并追踪同步变化，能用证据替代猜测，也能帮助受影响的人共同决定。", page_refs: [p04, p06, p08, p13, p14, p19]}
