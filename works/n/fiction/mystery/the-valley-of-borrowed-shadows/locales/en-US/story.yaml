schema_version: 1
language: en-US
writer: north-star-map
title: The Valley of Borrowed Shadows
summary: A valley clock tower casts two shadows although only one sun is visible. Li and Tama test several explanations, trace the faint shadow to a ridge mirror, and help two communities redirect useful light without confusing the clock.
cast:
  narrator: {display_name: Narrator, tts: {delivery: patient and precise, timbre: low adult voice, pace: medium-slow, pitch: medium-low}}
  li: {display_name: Li, tts: {delivery: analytical and open-minded, timbre: clear adult voice, pace: medium, pitch: medium}}
  oren: {display_name: Oren, tts: {delivery: guarded then cooperative, timbre: resonant older-adult voice, pace: medium-slow, pitch: low}}
  tama: {display_name: Tama, tts: {delivery: skeptical and quick, timbre: bright young-adult voice, pace: medium-fast, pitch: medium-high}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Li enters the deep valley at dawn with an amber prism and a field case."}, {speaker: narrator, text: "She has come to examine the town's increasingly unreliable shadow clock."}]}
  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content: [{text: "The stone tower casts two long "}, {vocabulary: {id: shadow, text: shadows}}, {text: " across the empty plaza."}]
      - {speaker: li, text: "Two dark shapes suggest more than one source of light."}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Tama carefully marks both moving edges with separate colored cords."}, {speaker: tama, text: "The stronger shadow points west. The faint one points elsewhere across the plaza."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Some worried residents blame a second sun; others point toward the hidden ridge machinery."}, {speaker: li, text: "A claim becomes useful only when it predicts what we should observe next."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Li compares the shadows closely."}, {speaker: narrator, text: "One has a sharp gray edge, while the other is faint and slightly green."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "The greenish shadow shortens quickly across Tama's marked cords."}, {speaker: narrator, text: "During the same measured minutes, the natural sun shadow changes only a little."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Li holds her prism in a dusty beam crossing the plaza."}, {speaker: narrator, text: "The split colors show that the beam carries ordinary reflected sunlight."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "The beam rises toward an immense curved shape on the ridge."}, {speaker: tama, text: "Then the second light may come from above, not from another sun."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Tama shows Li the old circular clock face in the center of town."}, {speaker: narrator, text: "Its two pointer shadows disagree, so residents cannot read the hour reliably or plan shared work."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Li and Tama climb a maintained stone stair instead of crossing the steep slope."}, {speaker: narrator, text: "The reflected beam remains visible above them."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "At the ridge, Oren guards a vast mirror partly covered by cloth."}, {speaker: oren, text: "The valley rarely asks where its winter light comes from."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Rows of enormous curved mirrors face different parts of the valley."}, {speaker: narrator, text: "Their original water channels once turned them together as the sun moved through the winter sky."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Oren rotates one mirror by a small amount."}, {speaker: narrator, text: "A warm reflected beam slides across the lower plaza."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Far below, the faint shadow moves at exactly the same moment."}, {speaker: li, text: "That linked change supports the mirror explanation."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Oren reveals cracked water channels beside the old mechanism."}, {speaker: oren, text: "I adjusted mirrors by hand to keep the ridge greenhouse warm."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "His physical model shows sunlight redirected around a rock wall toward a shaded greenhouse."}, {speaker: narrator, text: "Without that added energy, young food plants develop more slowly during the coldest winter weeks."}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "Tama looks from the confused clock toward the distant greenhouse."}, {speaker: tama, text: "The same beam helps one place and disrupts another."}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "Li places two light tokens between the ridge and valley models."}, {speaker: li, text: "We need a receiver that serves the greenhouse without crossing the clock."}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "Residents from both communities gather and compare the shared physical model."}, {speaker: narrator, text: "They reject turning every mirror off and choose a separate receiver beyond the clock plaza."}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "The mirrors rotate away from the clock plaza."}, {speaker: narrator, text: "Their light now reaches a pale stone receiver connected to the ridge system."}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "The clock tower casts one clear shadow again."}, {speaker: narrator, text: "Above it, the ridge receiver glows and the greenhouse keeps its useful light."}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "As Li departs at sunrise, Oren and Tama inspect the repaired controls together."}, {speaker: tama, text: "Next time one valley changes another, both will examine the evidence."}]}
chapters:
  - {id: ch01, title: Two Shadows, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: A Light from the Ridge, page_refs: [p07, p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: One Beam, Two Effects, page_refs: [p15, p16, p17, p18]}
  - {id: ch04, title: A Shared Receiver, page_refs: [p19, p20, p21, p22]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "What evidence connects the faint shadow to the ridge mirror?", answer: "The greenish beam points toward the ridge, and the faint shadow moves at the exact moment Oren rotates a mirror.", page_refs: [p05, p07, p08, p13, p14]}
  - {id: q02, type: compare, speaker: narrator, prompt: "How do the two shadows behave differently?", answer: "The natural shadow is sharp and changes slowly, while the reflected shadow is faint, greenish, and changes quickly with the mirror.", page_refs: [p05, p06, p13, p14]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why has Oren been adjusting the mirrors by hand?", answer: "Cracked water channels no longer move them correctly, and he wants reflected sunlight to warm the shaded greenhouse.", page_refs: [p12, p15, p16]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why do the communities reject turning every mirror off?", answer: "That would fix the clock but remove light that supports the ridge greenhouse.", page_refs: [p16, p17, p18, p19]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "Why is the separate receiver a stronger solution?", answer: "It removes reflected light from the clock while preserving useful energy for the greenhouse, so it addresses both effects.", page_refs: [p18, p19, p20, p21]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "What central lesson does Li's investigation show?", answer: "Testing predictions and tracing linked changes can replace competing guesses with an explanation that supports a shared decision.", page_refs: [p04, p06, p08, p13, p14, p19]}
