schema_version: 2
language: en-US
writer: north-star-map
title: The Valley of Borrowed Shadows
summary: A valley clock tower casts two shadows although only one sun is visible. Li and Tama test several explanations, trace the faint shadow to a ridge mirror, and help two communities redirect useful light without confusing the clock.
chapters:
  - id: ch01
    title: Two Shadows
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: A Light from the Ridge
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
  - id: ch03
    title: "One Beam: Two Effects"
    page_refs:
      - p15
      - p16
      - p17
      - p18
  - id: ch04
    title: A Shared Receiver
    page_refs:
      - p19
      - p20
      - p21
      - p22
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: What evidence connects the faint shadow to the ridge mirror?
    answer: The greenish beam points toward the ridge, and the faint shadow moves at the exact moment Oren rotates a mirror.
    page_refs:
      - p05
      - p07
      - p08
      - p13
      - p14
  - id: q02
    type: compare
    speaker: narrator
    prompt: How do the two shadows behave differently?
    answer: The natural shadow is sharp and changes slowly, while the reflected shadow is faint, greenish, and changes quickly with the mirror.
    page_refs:
      - p05
      - p06
      - p13
      - p14
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why has Oren been adjusting the mirrors by hand?
    answer: Cracked water channels no longer move them correctly, and he wants reflected sunlight to warm the shaded greenhouse.
    page_refs:
      - p12
      - p15
      - p16
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why do the communities reject turning every mirror off?
    answer: That would fix the clock but remove light that supports the ridge greenhouse.
    page_refs:
      - p16
      - p17
      - p18
      - p19
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: Why is the separate receiver a stronger solution?
    answer: It removes reflected light from the clock while preserving useful energy for the greenhouse, so it addresses both effects.
    page_refs:
      - p18
      - p19
      - p20
      - p21
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What central lesson does Li's investigation show?
    answer: Testing predictions and tracing linked changes can replace competing guesses with an explanation that supports a shared decision.
    page_refs:
      - p04
      - p06
      - p08
      - p13
      - p14
      - p19
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "Li enters the deep valley at dawn with an amber prism and a field case. "
            - text: She has come to examine the town's increasingly unreliable shadow clock.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "The stone tower casts two long "
            - vocabulary:
                id: shadow
                text: shadows
            - text: " across the empty plaza. Li says, “"
            - text: Two shadows mean there may be a second light source.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Tama carefully marks both moving edges with separate colored cords. Tama says, “
            - text: The stronger shadow points west. The faint one points elsewhere across the plaza.”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Some residents blame a second sun; others point toward the ridge machinery. Li raises her prism. “If either guess is right, it should tell us what to look for next.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "Li compares the shadows closely. "
            - text: One has a sharp gray edge, while the other is faint and slightly green.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "The greenish shadow shortens quickly across Tama's marked cords. "
            - text: During the same measured minutes, the natural sun shadow changes only a little.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Li holds her prism in a dusty beam crossing the plaza. "
            - text: The split colors show that the beam carries ordinary reflected sunlight.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: The beam rises toward an immense curved shape on the ridge. Tama says, “
            - text: Then the second light may come from above, not from another sun.”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "Tama shows Li the old circular clock face in the center of town. "
            - text: Its two pointer shadows disagree, so residents cannot read the hour reliably or plan shared work.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Li and Tama climb a maintained stone stair instead of crossing the steep slope. "
            - text: The reflected beam remains visible above them.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: At the ridge, Oren guards a vast mirror partly covered by cloth. Oren says, “
            - text: People here are used to winter light. They stopped asking where it came from.”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "Rows of enormous curved mirrors face different parts of the valley. "
            - text: Their original water channels once turned them together as the sun moved through the winter sky.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "Oren rotates one mirror by a small amount. "
            - text: A warm reflected beam slides across the lower plaza.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Far below, the faint shadow moves at the same moment. Li calls to Tama, “Mark the time. The shadow moved when Oren moved the mirror.”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: Oren reveals cracked water channels beside the old mechanism. Oren says, “
            - text: I adjusted mirrors by hand to keep the ridge greenhouse warm.”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "His physical model shows sunlight redirected around a rock wall toward a shaded greenhouse. "
            - text: Without that added energy, young food plants develop more slowly during the coldest winter weeks.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: Tama looks from the confused clock toward the distant greenhouse. “If we turn the beam off, the greenhouse loses heat. If we leave it here, the clock stays wrong.”
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: Li places two light tokens between the ridge and valley models. Li says, “
            - text: We need to send light to the greenhouse without letting it cross the clock.”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "Residents from both communities gather and compare the shared physical model. "
            - text: They reject turning every mirror off and choose a separate receiver beyond the clock plaza.
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: "The mirrors rotate away from the clock plaza. "
            - text: Their light now reaches a pale stone receiver connected to the ridge system.
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: "The clock tower casts one clear shadow again. "
            - text: Above it, the ridge receiver glows and the greenhouse still receives the light it needs.
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: Li departs at sunrise while Oren and Tama inspect the repaired controls. Tama hands Oren the two-shadow model. “At noon, we check the clock and receiver together.”
