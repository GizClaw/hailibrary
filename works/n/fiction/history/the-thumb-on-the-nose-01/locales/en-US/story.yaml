  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "In April 1878, rain darkened the steps of the Brussels museum. De Pauw arrived with a telegram: large bones had been found deep in the Bernissart coal mine. The message named danger as well as discovery."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "Émile looked toward an Iguanodon tooth cast. Mantell had described the animal in 1825 from teeth and scattered remains. An old reconstruction placed a pointed bone on its nose. The tooth was strong evidence, but it was not a whole body."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Émile had copied that horned animal with firm black lines. He wanted to see the new evidence, so he asked De Pauw to take him underground. He also feared learning that his careful copy was wrong."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "De Pauw called the mine dangerous and refused to praise Émile’s courage. Still, before dawn, a second safety lamp waited beside the field supplies. The lamp meant he would work, not merely watch."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "The lift cage descended more than three hundred meters. Water flashed on the walls. The circle of daylight above them shrank and disappeared. Cold air rose past the cage through the shaft."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Jules, a miner, guided them through timbered passages. Coal grit filled Émile’s mouth, and the supports groaned as pressure shifted in the rock. Every turn made the route back harder to remember."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "Jules raised his lamp over a clay pocket. Ribs, backbones, a pelvis, and a hind limb still lay in order. The animal had not become a heap. Their order preserved a record no one had planned to leave."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "A connected skeleton could reject arrangements that a loose bone allowed. Émile noticed that his first sketch left an empty horn space beside the skull. That difference made the mine itself part of the evidence."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "He tore out that page and drew only what the lamp revealed. Jules asked whether he was copying the mine or the museum cabinet. Émile chose the mine. His second page kept the skull and hand exactly where they lay."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "The team could not lift the giant skeleton whole. De Pauw divided it into clay blocks, but each position had to be recorded before workers cut around it. The map would later let separate blocks become neighbors again."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "They wrapped the blocks in wet paper, cloth, and plaster. Pyrite glittered in the fossils, yet air and moisture could help crack the bones after exposure. Émile drew each bright grain before the surface was covered."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "When grit fell from the roof, Émile wanted to continue. De Pauw stopped everyone. Saving one surface did not justify placing a worker beneath weak rock. The unfinished hand remained safely inside the clay."
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "Only after new beams were installed did the team return. Beside the wrist, they uncovered a thick pointed bone shaped like the famous nose horn. Waiting protected the crew and the evidence they hoped to save."
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "Émile measured its broad base and marked the neighboring fingers. Its position did not prove a hand spike, but it was evidence the old picture lacked. Shape suggested the old answer while location challenged it."
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "Near the opposite wrist, another pointed bone appeared. Two matching pieces beside two hands made the nose explanation less likely. He marked what he knew and left the meaning open."
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "Back in Brussels, Émile matched every crate to his field drawings. On the wall, the old reconstruction faced a new note: “Position unresolved.” For the first time, uncertainty felt like an accurate result."
          }
        ]
      }
    ]
  }
}
