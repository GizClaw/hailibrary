      ]
    }
  ],
  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "1878年4月，雨水打黑了布鲁塞尔博物馆的台阶。德波带来电报：贝尼沙尔煤矿深处发现了大批巨骨。电报同时写着危险与发现。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "埃米尔望向一颗禽龙牙模型。曼特尔在1825年根据牙齿和零散遗骨描述禽龙，旧复原却把一枚尖骨装在鼻上。牙齿很重要，却不是完整身体。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "埃米尔曾用又黑又稳的线条临摹那头带角巨兽。为了亲眼看新证据，他请求德波带自己下矿。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "德波说矿井危险，也没有夸奖他的勇气。不过天亮前，野外用品旁还是多放了一盏安全灯。矿灯表示他要工作，不只旁观。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "升降笼下降三百多米，井壁的水光一层层闪过。头顶的白昼缩成圆点，最后完全消失。冷风沿井筒从笼边升起。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "矿工朱尔带他们穿过木梁支撑的巷道。煤尘钻进埃米尔嘴里，岩层压力让木梁发出呻吟。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "朱尔举灯照向黏土。肋骨、椎骨、骨盆和后肢仍保持次序，这只动物没有散成一堆。这种次序保留了天然记录。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "完整骨架能排除零散骨头允许的某些拼法。埃米尔发现，第一张速写又在头骨旁给鼻角留了空位。因此矿层位置也是证据。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "他撕下那页，只画灯光照见的东西。朱尔问他在画矿井还是博物馆，埃米尔选择了矿井。第二张图忠实保留头骨与手。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "巨型骨架不能整件吊走。德波把它分成黏土块，但工人动刀前，必须先记下每块的位置。方格图能让分块以后重新相邻。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "大家用湿纸、麻布和石膏包住黏土。黄铁矿在骨中发亮，可空气和潮气会让出土化石开裂。每处暴露表面都要先记录，再被盖住。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "顶板落下碎屑时，埃米尔还想继续。德波命令所有人后退；抢救一处骨面，不值得让工人站在松岩下。未挖完的手仍安全留在土中。"
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "新木梁架好以后，他们才回来。腕骨旁露出一枚粗大尖骨，形状很像那只著名鼻角。等待同时保护工人和证据。"
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "埃米尔测量宽大的底面，也标出相邻手指。这个位置还不能证明它是手刺，却是旧图从未拥有的证据。形状支持旧说，位置却挑战它。"
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "另一侧手腕旁也出现了尖骨。两块相似骨头靠着两只手，让鼻角的解释变得更不可能。他记下所知，也留下未知。"
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "回到布鲁塞尔，埃米尔用矿下图核对每只木箱。墙上，旧复原面对一行新记录：“位置未定。”这一次，不确定也是准确结果。"
          }
        ]
      }
    ]
  }
}
