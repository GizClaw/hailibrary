  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "In Brussels, each new crate added bones and risk. Émile checked every number against his mine sketches because one copying error could separate matching parts. Careful records kept the growing collection connected."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "He pinned his field drawing of the pointed bone beside the old horned picture. One placed the spike by a hand; the other placed it on the nose. Instead of agreeing on an answer, the two sheets formed a question."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Pointed bones repeatedly appeared near those forelimbs. Meanwhile, cleaned skulls provided no convincing joint where a large nose horn could attach. Absence mattered because a horn required a place to join."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "A visitor said the new fossils would prove Mantell’s picture. Émile answered that Mantell had proposed a horn, then noticed how different proposed sounded from proved. His new wording left room for the fossils to answer."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "Mantell’s 1825 conclusion about a giant plant-eating reptile rested on distinctive teeth. His achievement remained important even if one later placement changed. Changing one claim did not turn the earlier work into failure."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Émile arranged three hands by their recorded positions. Each had three strong middle fingers, a narrow outer finger, and space for a first digit beside the wrist. Repeated anatomy made the open position a specific question."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "By 1882, assembly began in the former Saint George chapel. Scaffolding reached toward the vault, and ropes held fossil sections before iron supports were fitted. Each suspended section could be adjusted before final support."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "De Pauw considered how fragile bones could carry weight. Dollo compared the pelvis, spine, and limbs to decide how the whole animal might stand. Their different questions met in the same reconstructed body."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "For the hand, Dollo demanded repeated tests. Émile brought the spike toward the first digit, but he did not force two familiar-looking surfaces together. A smooth-looking fit still needed comparison with other specimens."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "The broad base followed the joint’s curve. A second hand showed the same fit. Paired spikes, repeated positions, and skulls without sockets formed a linked case. No single clue carried the conclusion by itself."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "The evidence overturned the nose horn. Yet Émile hesitated, because the elegant horned reconstruction on the wall was his own praised apprenticeship drawing. His reluctance came from pride, not from competing evidence."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "At night he made four drawings: the isolated spike, its mine position, the matching hands, and the corrected reconstruction. The steps showed why his answer changed. The sequence made his reasoning visible to another observer."
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "Dollo told him to keep the old sheet. Without it, visitors might imagine the correct answer had always been obvious instead of earned through comparison. Revision became part of the display rather than a hidden repair."
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "Before the mount opened, a support rope slipped. Émile secured the plaster cradle with a wedge while De Pauw braced it and Dollo shortened the upper rope. They protected the recorded position while saving the actual bone."
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "A boy later laughed at the old nose horn. Émile hid the final drawings and showed him only the isolated bone. The boy could not place it either. Émile let the boy experience the same uncertainty first."
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "After following all four drawings, the boy raised his thumb toward the fossil hand. Émile left his worn eraser beside the new picture, ready for later evidence. The empty space beside the eraser no longer looked like defeat."
          }
        ]
      }
    ]
  }
}
