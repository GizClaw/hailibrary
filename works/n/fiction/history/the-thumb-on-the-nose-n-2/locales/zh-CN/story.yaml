  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "在布鲁塞尔，每只新木箱都带来骨头和风险。埃米尔把编号逐一对照矿下速写，因为一个抄错的数字就会拆散相邻部分。细致记录让整个收藏仍有联系。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "他把尖骨的野外图钉在旧鼻角图旁。一幅把尖骨记在手边，另一幅却把它放在鼻上。两张纸没有给出同一答案，反而组成了一个问题。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "尖骨不断出现在这些前肢附近。与此同时，清理好的头骨上没有能让巨大鼻角连接的可靠骨面。鼻角若存在，头骨就该有接口。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "参观者说新化石会证明曼特尔的图。埃米尔回答，曼特尔只是“提出”鼻角，并听见这个词与“证明”的分量不同。新的说法给化石留下回答余地。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "曼特尔在1825年凭独特牙齿判断那是巨大的植食性爬行动物。后来改动一个位置，并不会抹掉这项重要发现。修改一处不会抹掉过去的贡献。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "埃米尔按出土位置摆好三只手。每只都有三根粗壮中指、一根细长外指，腕旁还空着第一指的位置。重复结构让空位成为具体问题。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "到1882年，装架在圣乔治礼拜堂开始。脚手架伸向拱顶，铁架装好前，绳索先吊住各段化石。每段骨架都能先调整再固定。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "德波考虑脆弱骨头怎样承重。多洛比较骨盆、脊柱和四肢，判断整个动物可能采取的姿势。两种问题在同一副身体上相遇。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "检查手部时，多洛要求重复验证。埃米尔把尖骨靠近第一指，却不肯因为形状相似就强行拼上。看似顺利的拼合仍需别的标本。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "宽大底面顺着关节弧度合拢，第二只手也有相同结果。成对尖骨、重复位置和没有接口的头骨连成证据链。没有一条线索能独自定案。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "这些证据推翻了鼻角。埃米尔却犹豫，因为墙上那幅漂亮的带角复原，正是自己受过夸奖的学徒作品。阻碍他的只是自尊，不是反证。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "夜里，他画出四步：孤立尖骨、矿下位置、相同的手和修正后的复原。这些步骤说明答案为何改变。图序让别人也能检查他的推理。"
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "多洛让他保留旧图。否则参观者会以为正确答案一直很明显，而不会看见比较证据的过程。修正成了展览内容，不再被藏起。"
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "开放前，一根托绳松滑。埃米尔用木楔垫住石膏托，德波用肩支撑，多洛收短上方绳索。他们同时保住骨头和原始位置。"
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "后来，一个男孩嘲笑旧鼻角。埃米尔藏起最后几张图，只给他看孤立尖骨，男孩也无法确定位置。埃米尔让男孩先经历同样疑问。"
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "看完四幅图后，男孩举起拇指对着化石。埃米尔把磨旧的橡皮留在新图旁，等以后出现的证据。橡皮旁的空位不再像失败。"
          }
        ]
      }
    ]
  }
}
