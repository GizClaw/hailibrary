schema_version: 1
id: the-first-day-of-spring-festival
type:
  - reading
  - narrative-nonfiction
style: cut-paper-collage
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - culture
    - everyday-life
    - food
  themes:
    - tradition
    - discovery
  moods:
    - warm
    - playful
characters:
  - id: narrator
    kind: narrator
    description: A clear guide who follows one family visit and marks cultural variation carefully.
    voice_identity: warm, observant adult voice with a steady rhythm
  - id: xiaoyu
    kind: character
    description: Xiaoyu / 小雨, a curious seven-year-old Chinese girl who wants one clear answer about New Year food.
    visual_identity: Warm beige skin, round brown eyes, black hair in two low braids tied with plain gold bands, coral-red padded jacket with round cream toggles, mustard scarf, navy trousers, and black cloth shoes.
    voice_identity: bright child voice, quick and openly curious
  - id: mom
    kind: character
    description: Xiaoyu's mother, who takes her to visit family and answers only the question Xiaoyu asks.
    visual_identity: Chinese woman in her thirties with a chin-length black bob, teal wool coat, cream sweater, burgundy trousers, and dark brown ankle boots.
    voice_identity: calm adult voice, practical and lightly amused
  - id: grandma
    kind: character
    description: Xiaoyu's grandmother, whose home serves dumplings on the first day of the new year.
    visual_identity: Chinese woman in her late sixties with a short silver bob, round brown glasses, plum quilted vest over a beige shirt, dark green trousers, and soft gray shoes.
    voice_identity: low warm older voice with an easy smile
  - id: aunt-mei
    kind: character
    description: Xiaoyu's maternal aunt and Mom's sister, whose childhood family often ate tangyuan for the new year.
    visual_identity: Chinese woman in her thirties with long black hair tied low, mustard cardigan over a brick-red dress, charcoal leggings, and brown flats.
    voice_identity: lively adult voice with a gentle upward lift
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Follow Xiaoyu's question, mistaken answer, and changed way of asking.
    - Retain the two steps Xiaoyu tries with her relatives.
    - Notice that Spring Festival foods vary by place and family.
  concepts:
    - red-envelope
    - New Year greetings
    - regional food customs
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
