schema_version: 1
required: true
scope: A fictional Chinese family's first-day visits are used to show documented Spring Festival greetings, red-envelope gifts, and regional food variation without claiming that every family follows the same custom.
sources:
  - id: unesco-spring-festival
    title: Spring festival, social practices of the Chinese people in celebration of traditional new year
    publisher: UNESCO Intangible Cultural Heritage
    url: https://ich.unesco.org/en/RL/spring-festival-social-practices-of-the-chinese-people-in-celebration-of-traditional-new-year-02126
    verified_at: 2026-09-13
    supports:
      - Spring Festival begins on the first day of the first month of the Chinese calendar.
      - Festival practices include family reunion and greetings to elders, relatives, friends, and neighbors.
  - id: huairou-first-day
    title: 年俗丨正月初一 · 拜大年 吃饺子
    publisher: 北京市怀柔区人民政府
    url: https://www.bjhr.gov.cn/zt/2026gdn/ns/202602/t20260222_4533441.html
    verified_at: 2026-09-13
    supports:
      - On the first morning, people may visit relatives and friends and give New Year greetings.
      - Younger family members may greet elders, who may give them lucky money.
      - Eating dumplings on the first day is identified as a northern custom, not a universal one.
  - id: tongren-tangyuan
    title: 春节美食：汤圆
    publisher: 铜仁市人民政府网站
    url: https://www.tongren.gov.cn/2023/0116/293337.shtml
    verified_at: 2026-09-13
    supports:
      - New Year foods vary by region; dumplings are widespread in the north and tangyuan in the south.
      - In the described Sichuan custom, tangyuan are eaten on the first morning as well as at the Lantern Festival.
  - id: sipac-first-day-tangyuan
    title: 第五编（居民）第三章（风俗）
    publisher: 苏州工业园区档案管理中心
    url: https://www.sipac.gov.cn/szdaglzx/yqfzxtzz/202102/1921896c90fe4de0b9e84d6103c7aa0c.shtml
    verified_at: 2026-09-13
    supports:
      - A documented local southern custom includes eating tangyuan at breakfast on the first day and exchanging New Year greetings.
  - id: smithsonian-lunar-new-year
    title: "Lunar New Year: Then and Now"
    publisher: Smithsonian National Museum of Asian Art
    url: https://asia.si.edu/whats-on/blog/posts/lunar-new-year-then-now/
    verified_at: 2026-09-13
    supports:
      - One first-person family account records red envelopes from older relatives and a table with several New Year foods.
      - The account supports family-level variation and is not used to claim a universal menu.
  - id: moe-spring-festival-customs
    title: 春节习俗
    publisher: 中华人民共和国教育部
    url: https://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/jyzt_2015nztzl/2015_zt01/15zt01_xgxx/201502/t20150205_185672.html
    verified_at: 2026-09-13
    supports:
      - Spring Festival foods are not limited to dumplings or tangyuan; some southern places eat nian gao.
  - id: cambridge-envelope
    title: envelope
    publisher: Cambridge Dictionary
    url: https://dictionary.cambridge.org/us/dictionary/english/envelope
    verified_at: 2026-09-13
    supports:
      - Envelope is a countable noun pronounced /ˈen.və.loʊp/ in American English.
      - The usage examples include giving money in a red envelope at New Year.
  - id: cambridge-red
    title: How to pronounce red
    publisher: Cambridge Dictionary
    url: https://dictionary.cambridge.org/us/pronunciation/english/red
    verified_at: 2026-09-13
    supports:
      - Red is pronounced /red/ in American English.
  - id: handian-hongbao
    title: 红包
    publisher: 汉典
    url: https://www.zdic.net/hans/%E7%BA%A2%E5%8C%85
    verified_at: 2026-09-13
    supports:
      - 红包 is pronounced hóng bāo and can mean a red paper wrapping holding a monetary gift, including lucky money for children at Spring Festival.
claims:
  - claim: Spring Festival begins on the first day of the first lunar month, and greetings to elders and relatives are among its social practices.
    source_ids: [unesco-spring-festival, huairou-first-day]
    pages: [p01, p02, p09, p12]
  - claim: An older relative may give a child a red envelope containing a monetary gift during the New Year celebration.
    source_ids: [huairou-first-day, smithsonian-lunar-new-year, cambridge-envelope, handian-hongbao]
    pages: [p03]
  - claim: Some northern families eat dumplings for the New Year, including on the first day in some places.
    source_ids: [huairou-first-day, tongren-tangyuan]
    pages: [p04, p05, p08, p11]
  - claim: Some southern families eat tangyuan for the New Year, including on the first morning in some places.
    source_ids: [tongren-tangyuan, sipac-first-day-tangyuan]
    pages: [p06, p08, p10, p11]
  - claim: New Year food customs vary by place and family, so neither dumplings nor tangyuan are presented as the single correct food for everyone.
    source_ids: [tongren-tangyuan, huairou-first-day, sipac-first-day-tangyuan, smithsonian-lunar-new-year, moe-spring-festival-customs]
    pages: [p07, p08, p09, p10, p11]
  - claim: Some families eat other Spring Festival foods, including nian gao.
    source_ids: [moe-spring-festival-customs]
    pages: [p08]
  - claim: The target terms red envelope and 红包 refer here to a red paper holder containing a monetary gift.
    source_ids: [cambridge-envelope, cambridge-red, handian-hongbao]
    pages: [p03]
limitations:
  - Xiaoyu, Mom, Grandma, Aunt Mei, their homes, dialogue, route, meal, and choices are fictional.
  - The words some, many, often, and family keep the food claims scoped; no custom is assigned to every northern, southern, or Chinese household.
  - The story does not state a single historical origin or symbolic meaning for dumplings, tangyuan, greetings, or red envelopes.
  - No exact amount of money, travel distance, meal time, or number of visits is claimed.
