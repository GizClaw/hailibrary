schema_version: 1
style: cut-paper-collage
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: A contemporary Chinese city on a calm winter morning, moving from Xiaoyu's home to Grandma's warm apartment, a pedestrian lane, and Aunt Mei's warm apartment. Decorations are plain red paper shapes only, with no characters, writing, signs, numerals, or logos.
  xiaoyu: Warm beige skin, round brown eyes, black hair in two low braids tied with plain gold bands, coral-red padded jacket with round cream toggles, mustard scarf, navy trousers, and black cloth shoes.
  mom: Chin-length black bob, teal wool coat, cream sweater, burgundy trousers, and dark brown ankle boots.
  grandma: Short silver bob, round brown glasses, plum quilted vest over a beige shirt, dark green trousers, and soft gray shoes.
  aunt-mei: Long black hair tied low, mustard cardigan over a brick-red dress, charcoal leggings, and brown flats.
  props: One plain red envelope with no marks; white ceramic bowls; crescent-shaped pale dumplings; round white tangyuan in clear soup; adults handle and serve hot dishes.
  palette: Coral red, teal, mustard, plum, dark green, warm cream, and navy in matte fibrous paper, with restrained dot and wave patterns that never resemble writing.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Xiaoyu stands between Grandma and Aunt Mei at a shared low table, happily comparing a plate of crescent dumplings and a bowl of round tangyuan while Mom smiles behind her; a plain red envelope rests near Grandma.
  - id: p01
    file: artwork/p01.webp
    scene: At home on New Year's morning, Xiaoyu finishes tying her mustard scarf while asking Mom a question; a simple red paper circle and branch decoration hangs on the wall without writing.
  - id: p02
    file: artwork/p02.webp
    scene: Xiaoyu and Mom enter Grandma's apartment; Xiaoyu greets Grandma with clasped hands while Grandma welcomes her.
  - id: p03
    file: artwork/p03.webp
    scene: Grandma smiles and places one plain unmarked red envelope into Xiaoyu's open hands as Mom watches.
  - id: p04
    file: artwork/p04.webp
    scene: Grandma sets a steaming plate of crescent-shaped dumplings on the table; Xiaoyu and Mom sit nearby, and the child does not touch the hot plate.
  - id: p05
    file: artwork/p05.webp
    scene: Xiaoyu leans toward Mom to whisper with a pleased, certain face while Grandma packs a small covered dish for the next family visit.
  - id: p06
    file: artwork/p06.webp
    scene: At Aunt Mei's apartment, Aunt Mei safely sets bowls of round white tangyuan in clear soup on the table; Xiaoyu pauses in surprise as Mom and Grandma arrive behind her.
  - id: p07
    file: artwork/p07.webp
    scene: Xiaoyu waits before eating and asks her question with an unsure face; the dumpling dish and tangyuan bowls remain clearly distinct on Aunt Mei's table.
  - id: p08
    file: artwork/p08.webp
    scene: Mom answers Xiaoyu at the table, gently indicating the two different dishes with open hands while Grandma and Aunt Mei listen.
  - id: p09
    file: artwork/p09.webp
    scene: Xiaoyu brightens and practices her changed two-step plan with a greeting gesture followed by a curious question to the gathered relatives.
  - id: p10
    file: artwork/p10.webp
    scene: Xiaoyu asks Aunt Mei about childhood food; Aunt Mei smiles and points naturally toward her bowl of tangyuan.
  - id: p11
    file: artwork/p11.webp
    scene: The four family members share the table; Grandma tastes tangyuan and Aunt Mei takes another dumpling while Xiaoyu and Mom enjoy both dishes.
  - id: p12
    file: artwork/p12.webp
    scene: On the quiet walk home, Xiaoyu holds Mom's hand and looks up with a new question while Grandma and Aunt Mei wave from the apartment doorway behind them.
generation:
  workflow: Codex built-in image generation; cwebp compression
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - no-visible-text
      - character-face-hair-and-clothing-continuity
      - food-and-envelope-continuity
      - scene-alignment
      - safe-hot-food-handling
      - cut-paper-collage-style
