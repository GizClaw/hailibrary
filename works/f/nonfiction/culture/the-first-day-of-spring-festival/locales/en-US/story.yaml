      display_name: Narrator
      tts:
        delivery: warm and observant, with careful emphasis on differences
        timbre: smooth adult alto with a clear center
        pace: measured medium
        pitch: middle-low
    xiaoyu:
      display_name: Xiaoyu
      tts:
        delivery: open, curious, and quick to revise a thought
        timbre: light bright child voice with crisp consonants
        pace: lively with short thinking pauses
        pitch: high
    mom:
      display_name: Mom
      tts:
        delivery: calm, practical, and lightly amused
        timbre: rounded adult voice with soft resonance
        pace: unhurried
        pitch: middle
    grandma:
      display_name: Grandma
      tts:
        delivery: warm and welcoming with an easy smile
        timbre: low, gently grainy older voice
        pace: slow and flowing
        pitch: low
    aunt-mei:
      display_name: Aunt Mei
      tts:
        delivery: lively and affectionate, answering from memory
        timbre: clear adult soprano with a mellow edge
        pace: medium-fast
        pitch: middle-high
