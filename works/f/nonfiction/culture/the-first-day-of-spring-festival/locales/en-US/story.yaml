schema_version: 2
language: en-US
writer: brass-compass
title: The First Day of Lunar New Year
summary: Xiaoyu expects every family to eat the same New Year food. Two visits give her two answers, so she changes the question she asks.
chapters:
  - id: ch01
    title: A Morning Question
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: Two Answers
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: A Better Question
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Xiaoyu change her question?
    answer: Grandma's family eats dumplings, but Aunt Mei's family eats tangyuan.
    page_refs:
      - p04
      - p06
      - p07
      - p09
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What two steps are in Xiaoyu's plan?
    answer: First she gives a New Year greeting. Then she asks about each family's food.
    page_refs:
      - p09
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: What does Aunt Mei's family often eat on the first day of Lunar New Year?
    choices:
      - Dumplings
      - Tangyuan
      - Both foods at every meal
    answer: Tangyuan
    page_refs:
      - p06
      - p10
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: What gift does Grandma give Xiaoyu?
    answer: A red envelope.
    page_refs:
      - p03
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: On the first day of Lunar New Year, Xiaoyu had one question. What food did every family eat?
    - id: p02
      illustration: p02
      paragraphs:
        - text: Xiaoyu and Mom visited Grandma first. “Happy New Year!” Xiaoyu said.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Grandma smiled and gave Xiaoyu a "
            - vocabulary:
                id: red-envelope
                text: red envelope
            - text: " with money inside. “I have a New Year gift for you,” Grandma said."
    - id: p04
      illustration: p04
      paragraphs:
        - text: Grandma set hot dumplings on the table. “Our family often eats dumplings on New Year's Day,” she said.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Grandma packed dumplings and joined Xiaoyu and Mom. Xiaoyu whispered, “I found the answer—it must be dumplings.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: Next, they visited Aunt Mei, Mom's sister. Bowls of tangyuan were ready. Her family often eats them on New Year's Day.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Xiaoyu waited to eat. “Which food is right?” she asked.
    - id: p08
      illustration: p08
      paragraphs:
        - text: “Both,” Mom answered. “Some northern families eat dumplings, and some southern families eat tangyuan. Other families eat rice cakes.”
    - id: p09
      illustration: p09
      paragraphs:
        - text: Xiaoyu made a two-step plan. First, she would give a New Year greeting. Then she would ask what each family ate for New Year.
    - id: p10
      illustration: p10
      paragraphs:
        - text: After her greeting, Xiaoyu turned to Aunt Mei. “What did your family eat at New Year when you were young?” “We often had tangyuan,” Aunt Mei said.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Everyone shared both foods. Grandma chose tangyuan, and Aunt Mei took another dumpling.
    - id: p12
      illustration: p12
      paragraphs:
        - text: On the way home, Xiaoyu held Mom's hand. She asked about next year. “Who can we ask about New Year food?”
audio_script:
  cast:
