      Wordless narrative scene in a dry rural village: after measuring the low water, a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook walks beside a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape. They leave the circular gray-stone well behind and head toward the dry creek and gravel hill. Show only the child and elder. Wide eye-level composition focused on their departure, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
  - id: p04
    file: artwork/p04.webp
    scene: 'A wet patch shines under a log. Water seeps between grains.'
