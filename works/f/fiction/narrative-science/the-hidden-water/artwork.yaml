      Wordless narrative scene during steady rain at the circular gray-stone well: a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook stands safely beside a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape. They look into the still-low well while rain darkens the stone rim; the bucket hangs far above the low water and the well is clearly not full. Show only the child and elder on firm ground, well clear of any flooded ditch or rushing runoff. Clear eye-level composition focused on the contrast between falling rain and low water, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
