      Wordless narrative scene in the dry creek: clear water slowly gathers between sand and gravel beneath a fallen log. A ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook crouches beside a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape; both point toward the small wet patch without touching or drinking the water. Show only the child and elder. Close eye-level composition focused on the seep and visible grains, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
  - id: p05
    file: artwork/p05.webp
    scene: 'Water runs through gravel, but it rests on clay.'
    prompt: >-
      Wordless hands-on observation beside the dry creek: a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook pours equal water from a plain cup into two cracked, unlabelled flowerpots while a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape watches. Water drains visibly through gravel in one pot while water pools on packed reddish clay in the other. Show only the child and elder. Close eye-level composition centered on the contrasting pots, not a cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
