      Wordless narrative scene beside the dry creek: a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook gently squeezes a handful of wet sand and studies the damp grains and tiny spaces while a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape watches. The fallen-log seep glistens nearby. Show only the child and elder. Close eye-level composition focused on wet sand held safely above the ground, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
