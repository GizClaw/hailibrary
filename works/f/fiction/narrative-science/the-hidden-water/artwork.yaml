      Wordless narrative scene beside the circular gray-stone well: a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook holds the notebook open while a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape gently gestures from the straight sketch toward the uneven gravel hill and winding dry creek, showing that the unseen route may bend. Show only the child and elder. Clear eye-level two-character composition focused on comparing the simple sketch with the irregular land, no cutaway diagram. Apart from the simple line already inside the notebook, no visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
  - id: p09
