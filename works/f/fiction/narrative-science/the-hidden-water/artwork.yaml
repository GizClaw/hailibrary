schema_version: 2
style: watercolor-gouache
aspect_ratio: '3:2'
shared_by_all_locales: true
embedded_text: prohibited
assets:
  - id: cover
    file: artwork/cover.webp
    scene: 'Child and elder begin a groundwater investigation at the low old well.'
    prompt: >-
      Wordless narrative scene in a dry rural village: beside a circular gray-stone well with a visibly low water level, a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook watches a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape lower a weighted line into the well. Keep the child and elder as the only people. Place the dry creek, gravel hill, and fallen-log seep in the background, with the repair shed distant and empty. Clear eye-level picture-book composition focused on the careful measurement, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
  - id: p01
    file: artwork/p01.webp
    scene: 'The child''s bucket hits the well bottom. The village needs water.'
    prompt: >-
      Wordless narrative scene in a dry rural village: a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook leans safely over the circular gray-stone well and looks down. A slack rope reaches a metal bucket resting on the dry bottom beside only a shallow muddy puddle. Show the child alone; do not show the elder or repair-shop owner, and do not show the bucket floating in ample water. Wide eye-level composition with the child and empty well as the single focus, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
  - id: p02
    file: artwork/p02.webp
    scene: 'The child asks the elder where well water comes from.'
    prompt: >-
      Wordless narrative scene in a dry rural village: at the circular gray-stone well, a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook looks up and questions a lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape. The elder listens and gestures toward the low well. Show only the child and elder; the repair shed remains empty in the background. Clear eye-level two-character composition focused on their exchange, no cutaway diagram. No visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
  - id: p03
    file: artwork/p03.webp
    scene: 'They measure the low water and walk toward the dry creek.'
