      Wordless narrative scene after rain at the circular gray-stone well: a ten-year-old child with short black hair, faded teal shirt, rust-red shorts, beige canvas shoes, and a small red notebook carefully records the measurement on one part of an open notebook page while leaving the facing page visibly blank. A lean elderly well repairer with weathered face, cropped gray hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape holds the weighted line steady over the still-low water. Show only the child and elder. Clear eye-level composition focused on patient measuring and the blank space reserved for a later observation, no cutaway diagram. Do not render legible notebook marks; no visible text, letters, numbers, signs, labels, logos, captions, speech bubbles, signature, or watermark.
