schema_version: 3
language: zh-CN
writer: 铜罗盘
title: '我们保护的山坡'
summary: '村民在证据尚未完整时，找到保护可能补给地的实际办法。'
chapters:
  - id: ch01
    title: '坡上的油味'
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: '能做成的办法'
    page_refs: [p06, p07, p08, p09, p10]
questions:
  - id: q01
    type: sequence
    prompt: '孩子先做了什么？'
    answer: '阿满在井上方的砂砾坡闻到油味。'
    page_refs: [p01]
  - id: q02
    type: cause-effect
    prompt: '为什么计划改变了？'
    answer: '大人封好废液。孩子只捡干净垃圾。'
    page_refs: [p06]
  - id: q03
    type: short-answer
    prompt: '结尾发生了什么？'
    answer: '渗水边，阿满递给他瓶子。他们一起测量。'
    page_refs: [p10]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '阿满在井上方的砂砾坡闻到油味。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '漏桶倒在沟边。周叔端着一盆脏水。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '石伯请他别把脏水倒在地上。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '周叔要干活。阿满也不能保证地下水往哪走。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '他找来有盖的桶，又联系了去镇里的车。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '大人封好废液。孩子只捡干净垃圾。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '大家在干净的裸坡种草，让雨水慢下来。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '检测没证明油进了井。大家仍继续保护坡地。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '周叔把清洗台搬到有遮棚、能接废水的硬地。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '渗水边，阿满递给他瓶子。他们一起测量。'

