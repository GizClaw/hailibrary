schema_version: 3
language: en-US
writer: brass-compass
title: 'The Hill We Protect'
summary: 'A village finds a practical way to protect possible groundwater recharge land.'
chapters:
  - id: ch01
    title: 'The Oily Slope'
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 'A Plan That Works'
    page_refs: [p06, p07, p08, p09, p10]
questions:
  - id: q01
    type: sequence
    prompt: 'After Nora smelled oil, what did Mr. Vale ask Mr. Rusk to do?'
    answer: 'He asked Mr. Rusk not to pour dirty water on the ground.'
    page_refs: [p01, p03]
  - id: q02
    type: cause-effect
    prompt: 'Why did Nora look for covered drums and a truck?'
    answer: 'Mr. Rusk needed to keep working, but nobody could promise where the groundwater flowed.'
    page_refs: [p04, p05]
  - id: q03
    type: short-answer
    prompt: 'Who measured the seep together at the end?'
    answer: 'Nora and Mr. Rusk measured it together.'
    page_refs: [p10]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'Nora smells oil near the gravel hill above the well.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'Leaking drums sit beside a ditch. Mr. Rusk holds dirty water.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Mr. Vale asks him not to pour it on the ground.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Mr. Rusk needs to work. Nora cannot promise where the water flows.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'She finds covered drums and a truck going to the county.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'Adults seal the waste. Children pick up only clean litter.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'The village plants grass where clean rain cuts the bare slope.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Tests do not prove the oil reached the well. They keep protecting it.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Mr. Rusk moves his wash bench onto a safe, covered pad.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'At the seep, Nora gives him a bottle. They measure together.'
