schema_version: 3
language: en-US
writer: brass-compass
title: 'The Hidden Water'
summary: 'A child follows clues to learn how groundwater reaches a village well.'
chapters:
  - id: ch01
    title: 'The Low Well'
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 'Patient Evidence'
    page_refs: [p06, p07, p08, p09, p10]
questions:
  - id: q01
    type: sequence
    prompt: 'After the bucket hit bottom, where did Nora and Mr. Vale go to look for clues?'
    answer: 'They measure the low water and walk toward the dry creek.'
    page_refs: [p01, p03]
  - id: q02
    type: cause-effect
    prompt: 'Why did Nora and Mr. Vale need more clues after she drew a straight path?'
    answer: 'Mr. Vale says the real path may bend. They need more clues.'
    page_refs: [p07, p08]
  - id: q03
    type: short-answer
    prompt: 'What does Nora do after recording the level?'
    answer: 'Nora records the level and leaves room for tomorrow.'
    page_refs: [p10]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'Nora''s bucket hits the well bottom. The village needs water.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'She asks Mr. Vale where well water comes from.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'They measure the low water and walk toward the dry creek.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'A wet patch shines under a log. Water seeps between grains.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'Water runs through gravel, but it rests on clay.'
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'Nora learns that ground water moves through small spaces.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'She draws one bold path from the hill to the well.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Mr. Vale says the real path may bend. They need more clues.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Rain comes, but the well does not fill at once.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'Nora records the level and leaves room for tomorrow.'
