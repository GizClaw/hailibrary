schema_version: 1
required: true
reason: The people, lane and game are invented, but the story names Yoruba and
  English as languages spoken by Amara's Nigerian family. Sources below support
  that language premise and record the independent review of ordinary action,
  safety and physical assumptions.
sources:
  - url: https://nico.gov.ng/languages-in-nigeria/
    supports: "p02-p03: Nigeria's National Institute for Cultural Orientation
      identifies English as the country's official lingua franca and Yoruba as
      a Nigerian language. Amara's bilingual family is a fictional individual
      family, not a claim about every Nigerian child."
  - url: https://www.akc.org/expert-advice/training/soccer-ball-roll/
    supports: "p04: a dog can push a ball with its nose; this is an individual
      action, not a claim about all dogs."
  - url: https://www.dogstrust.org.uk/dog-advice/life-with-your-dog/at-home/dog-and-child-safety
    supports: "Artwork p04–p12: adult supervision and room for the dog to move away."
  - url: https://www.rspca.org.uk/adviceandwelfare/pets/dogs/company/children
    supports: "Artwork: supervised child–dog contact without grabbing or crowding
      the dog."
  - url: https://www.merriam-webster.com/dictionary/take%20turns
    supports: "p11 and vocabulary: shared opportunities in succession."
  - url: https://www.zdic.net/hans/轮流
    supports: "p11 and vocabulary: 轮流 denotes doing something in succession."
  - url: https://www.unicef.org/lac/en/parenting-lac/nurturing-care/how-communicate-effectively-young-child
    supports: "p08–p10: gestures can communicate intent; the particular
      bell-and-ball game is invented, not a universal sign system."
  - url: https://www.bodet-campanaire.com/solutions/bell-maintenance/headstock-and-clappers.html
    supports: "p05–p12 physical plausibility: sound requires a strike inside a bell;
      movement alone need not produce a ring. The cause of this fictional bell’s
      fault is deliberately unspecified."
