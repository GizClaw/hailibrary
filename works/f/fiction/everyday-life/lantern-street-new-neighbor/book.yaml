schema_version: 1
id: lantern-street-new-neighbor
type:
  - reading
  - illustrated-short-story
style: watercolor-gouache
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - everyday-life
    - animals
  themes:
    - friendship
    - adaptation
    - cooperation
  moods:
    - warm
    - playful
characters:
  - id: narrator
    kind: narrator
    description: An attentive guide to the girls’ shared discovery.
    voice_identity: clear, measured adult storyteller
  - id: mei
    kind: character
    description: Mei / 梅梅, a Chinese girl about 7–9 living on Lantern Street; Bean is her family dog.
    visual_identity: Chin-length black bob with one yellow hair clip, red-and-white striped T-shirt,
      denim overalls, white sneakers.
    voice_identity: quick, curious, a little impatient
  - id: grandpa-lu
    kind: character
    description: Grandpa Lu / 卢爷爷, a Chinese man about 70 who watches the children in the courtyard.
    visual_identity: Short gray crew cut, round wire glasses, navy canvas apron with many pockets, gray
      shirt, brown trousers, brown shoes, green metal toolbox.
    voice_identity: slow, warm, dry humor
  - id: amara
    kind: character
    description: Amara / 阿玛拉, a Nigerian girl about 7–9 whose family has just moved into Lantern Street;
      she and Mei do not yet understand one another’s language.
    visual_identity: Dark brown skin, many small black braids with orange beads, green hoodie, yellow
      backpack, charcoal trousers, pale yellow sneakers.
    voice_identity: bright, direct, fond of questions
  - id: bean
    kind: character
    description: Bean / 豆豆, Mei’s small family dog. Never speaks; any bark is described by the narrator.
    visual_identity: Small tan mixed-breed dog with one white left ear, tan right ear and red collar.
    voice_identity: none; never assign a spoken block
  - id: amara-mother
    kind: character
    description: Amara’s mother / 阿玛拉妈妈, moving the family’s boxes inside; no spoken lines.
    visual_identity: Nigerian woman with dark brown skin, black hair in a bun, plum blouse, beige trousers.
    voice_identity: gentle, steady adult voice; silent in this book
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Follow a goal, setback, and changed action.
    - Retain the two steps of a shared game.
  concepts:
    - take-turns
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
