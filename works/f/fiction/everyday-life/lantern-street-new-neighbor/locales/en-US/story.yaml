schema_version: 2
language: en-US
writer: brass-compass
title: A New Neighbor on Lantern Street
summary: Mei wants to play with her new neighbor Amara. Bean’s ball and Grandpa Lu’s silent bell
  help them find a game.
chapters:
  - id: ch01
    title: A New Neighbor
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: The Quiet Bell
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: A Game for Two
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Mei stop asking Amara to play?
    answer: Amara did not understand Mei’s Chinese, and Mei knew almost no English.
    page_refs:
      - p02
      - p03
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Amara do with the bell and ball?
    answer: She raises the bell, then rolls the ball back.
    page_refs:
      - p10
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Mei offer Amara the bell?
    answer: She wants Amara to have a turn at the game.
    page_refs:
      - p08
      - p09
      - p10
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: Does the bell make a sound at the end?
    answer: No. The bell is still quiet.
    page_refs:
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Amara’s family moved to Lantern Street. Mei wanted someone to play with.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: “Want to play?” Mei asked in Chinese. Mei spoke Chinese and knew almost no English.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Amara’s family spoke Yoruba and English. Mei tried again in Chinese, but Amara did not
                understand. Mei let her hands drop.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Bean, Mei’s dog, rolled a blue ball with his nose. Amara smiled and rolled it back. It
                was a start.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Under the courtyard tree, Grandpa Lu shook his little bell. It made no sound.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: “Still broken,” he told Mei. She watched his hand go up and down.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: “Can I borrow the bell?” Mei asked him. Grandpa Lu held it out.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Mei raised the bell, then rolled the ball to Amara. Both girls could see the bell. It
                showed whose turn it was without words.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Amara caught the ball and waited. Mei held out the bell to her.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Amara pointed to herself, then to the bell. Mei nodded and gave it to her. Amara raised
                the bell and rolled the ball back.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "They "
            - vocabulary:
                id: take-turns
                text: took turns
            - text: " with the bell and ball. Bean followed the ball from girl to girl."
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: The bell was still quiet, but the girls were laughing. Grandpa Lu moved his feet to let the
                ball pass.
audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and clear
        timbre: smooth adult alto
        pace: measured medium
        pitch: middle-low
    mei:
      display_name: Mei
      tts:
        delivery: quick, curious, a little impatient
        timbre: light child voice with crisp consonants
        pace: brisk
        pitch: high
    grandpa-lu:
      display_name: Grandpa Lu
      tts:
        delivery: warm with dry understatement
        timbre: soft grainy elderly baritone
        pace: slow
        pitch: low
    amara:
      display_name: Amara
      tts:
        delivery: bright and direct, with questioning lift
        timbre: full rounded child voice
        pace: lively with deliberate questions
        pitch: middle-high
    bean:
      display_name: Bean
      tts:
        delivery: silent; narrator describes any bark
        timbre: no synthesized voice
        pace: no spoken delivery
        pitch: unvoiced
    amara-mother:
      display_name: Amara’s mother
      tts:
        delivery: gentle and reassuring
        timbre: soft resonant adult voice
        pace: unhurried
        pitch: middle
