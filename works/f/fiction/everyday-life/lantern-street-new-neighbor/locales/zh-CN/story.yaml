schema_version: 2
language: zh-CN
writer: 铜罗盘
title: 灯笼街来了新邻居
summary: 梅梅想和新搬来的阿玛拉一起玩，可她们还听不懂对方的话。豆豆推来的球和卢爷爷不响的小铃帮了忙。
chapters:
  - id: ch01
    title: 新邻居来了
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 不响的小铃
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: 一起玩起来
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 梅梅为什么不再问阿玛拉要不要一起玩？
    answer: 阿玛拉没听懂梅梅的中文，梅梅又几乎不会说英语。
    page_refs:
      - p02
      - p03
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 阿玛拉接过小铃以后，先做什么，再做什么？
    answer: 先举起小铃，再把球滚回去。
    page_refs:
      - p10
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 梅梅把小铃递给阿玛拉，是想让她做什么？
    answer: 也来举铃、滚球，轮到她玩。
    page_refs:
      - p08
      - p09
      - p10
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 最后，小铃响了吗？
    answer: 没有，小铃还是不响。
    page_refs:
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 灯笼街搬来了阿玛拉一家。梅梅想找新邻居一起玩。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 梅梅用中文问阿玛拉：“要不要一起玩？”梅梅几乎不会说英语。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 阿玛拉一家会说约鲁巴语和英语。梅梅又用中文问，阿玛拉还是没听懂。梅梅只好放下手。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 梅梅的小狗豆豆用鼻子推来一个蓝色的球。阿玛拉笑了，把球滚回去。这只是个开始。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 院子里的大树下，卢爷爷摇了摇小铃。小铃一点儿也不响。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: “还没修好呢。”卢爷爷对梅梅说。梅梅看着他把手举起又放下。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 梅梅问卢爷爷：“小铃能借我玩吗？”卢爷爷把小铃递给她。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 梅梅举起小铃，再把球滚向阿玛拉。她们都能看见小铃。不用说话，谁举起小铃，就轮到谁滚球。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 阿玛拉接住球。她没急着滚球，看着梅梅。梅梅把小铃举到阿玛拉面前。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 阿玛拉指指自己，又指指小铃。梅梅点头，把小铃递给她。阿玛拉举铃，再把球滚回去。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 两人
            - vocabulary:
                id: take-turns
                text: 轮流
            - text: 举铃、滚球。豆豆跟着球，在两人之间跑来跑去。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 小铃还是不响，两个女孩却笑个不停。卢爷爷收起脚，让球滚过去。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚地讲述，留意人物的小动作
        timbre: 平滑柔和的成年中低音
        pace: 平稳适中
        pitch: 中低
    mei:
      display_name: 梅梅
      tts:
        delivery: 好奇，反应快，带一点急切
        timbre: 清亮纤细的童声，吐字利落
        pace: 稍快
        pitch: 高
    grandpa-lu:
      display_name: 卢爷爷
      tts:
        delivery: 温和，带一点不动声色的幽默
        timbre: 略有沙感的老年男声
        pace: 缓慢
        pitch: 低
    amara:
      display_name: 阿玛拉
      tts:
        delivery: 明快直接，问句带自然上扬
        timbre: 饱满圆润的童声
        pace: 活泼，问话时稍作停顿
        pitch: 中高
    bean:
      display_name: 豆豆
      tts:
        delivery: 不发言；叫声只由旁白描述
        timbre: 不合成角色声音
        pace: 无口语输出
        pitch: 无声
    amara-mother:
      display_name: 阿玛拉妈妈
      tts:
        delivery: 温柔安定
        timbre: 柔和有共鸣的成年女声
        pace: 从容
        pitch: 中
