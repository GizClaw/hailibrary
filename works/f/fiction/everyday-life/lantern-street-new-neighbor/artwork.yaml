schema_version: 1
style: watercolor-gouache
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
setting: Lantern Street / 灯笼街, book 1 of a planned three-book series. Fictional old pedestrian lane
  in a Chinese city, red paper lantern strings, small family shops, shared stone courtyard with a
  camphor tree. No motor traffic, signs or writing.
continuity: Use cover as character reference for later books. Brass bell with dark wooden handle
  remains externally intact and silent throughout; no repair is performed. Soft blue ball large
  enough not to fit in Bean’s mouth; closed green toolbox; adult supervision. Clothing and palettes
  remain fixed.
