schema_version: 1
language: en-US
writer: river-wink
title: The Office of Lost Reasons
summary: Late with a delivery, Noa visits an office where excuses vanish but honest causes remain useful.
cast:
  narrator: {display_name: Narrator, tts: {delivery: dry and humane, timbre: clear adult voice, pace: medium, pitch: medium}}
  noa: {display_name: Noa, tts: {delivery: quick then thoughtful, timbre: bright young voice, pace: medium-fast, pitch: medium-high}}
  clerk: {display_name: The Clerk, tts: {delivery: quiet and exact, timbre: papery older voice, pace: slow, pitch: medium-low}}
  auntie: {display_name: Auntie Sela, tts: {delivery: warm and direct, timbre: full older voice, pace: medium, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Noa was late with flour for Auntie Sela's bakery."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "While hunting for a shortcut, Noa found a door that had not been there yesterday."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Beyond it, bottles held storms, broken clocks, crowds, and other excellent explanations."}]}
  - {id: p04, illustration: p04, lines: [{speaker: clerk, text: "Welcome to the Office of Lost Reasons. Which one have you misplaced?"}]}
  - {id: p05, illustration: p05, lines: [{speaker: noa, text: "Rain slowed me."}]}
  - {id: p06, illustration: p06, lines: [{speaker: clerk, text: "An impressive storm. Your coat seems disappointed that it missed it."}]}
  - {id: p07, illustration: p07, lines: [{speaker: noa, text: "Then the market clock was wrong."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "The Clerk's pocket watch and the market bell agreed perfectly."}]}
  - {id: p09, illustration: p09, lines: [{speaker: noa, text: "A crowd blocked me."}, {speaker: clerk, text: "Near the pastry window?"}]}
  - {id: p10, illustration: p10, lines: [{speaker: noa, text: "The flour was heavy. I stopped often, then pretended the stops belonged to everyone else."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "The storm, clock, and crowd bottles burst into polite curls of smoke."}]}
  - {id: p12, illustration: p12, lines: [{speaker: clerk, text: "That last reason stayed. A cause can help if you tell the truth about it."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Noa borrowed a handcart and placed the heavy satchel on it."}]}
  - {id: p14, illustration: p14, lines: [{speaker: noa, text: "I am late because I planned badly and hid the real problem."}]}
  - {id: p15, illustration: p15, lines: [{speaker: auntie, text: "Next time, ask for the cart before the flour starts inventing weather."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "They unloaded together. Behind them, the Office closed for lack of business."}]}
chapters:
  - {id: ch01, title: Shelves of Reasons, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Three Excellent Excuses, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: ch03, title: One Useful Cause, page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: "Which excuse does Noa offer first?", answer: "Noa first blames the rain.", page_refs: [p05]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: "Why does the storm excuse fail?", answer: "Noa's dry coat shows that there was no storm.", page_refs: [p05, p06]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: "What was the real delivery problem?", answer: "The flour was heavy, and Noa had not planned how to carry it.", page_refs: [p10]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why does Noa blame other things?", answer: "Noa is embarrassed about poor planning and wants to avoid responsibility.", page_refs: [p09, p10, p14]}
  - {id: q05, type: evidence, speaker: narrator, prompt: "What shows that honesty changes Noa's actions?", answer: "Noa names the real problem, borrows a cart, and tells Auntie the truth.", page_refs: [p10, p13, p14]}
