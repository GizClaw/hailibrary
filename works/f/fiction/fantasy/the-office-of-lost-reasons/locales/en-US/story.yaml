schema_version: 2
language: en-US
writer: brass-compass
title: The Office of Lost Reasons
summary: Noa is late with a bag of flour and searches an office full of bottled excuses. When none of them fits, Noa admits the bag was too heavy and chooses a cart instead.
chapters:
  - id: ch01
    title: Three Bottled Excuses
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
  - id: ch02
    title: The True Reason
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does the rain excuse fail?
    answer: Noa's coat is dry.
    page_refs:
      - p05
      - p06
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Noa do after admitting the true reason?
    answer: Noa puts the satchel on a handcart and finishes the delivery.
    page_refs:
      - p10
      - p11
      - p12
      - p13
      - p14
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why did Noa keep delaying?
    answer: The flour bag felt heavy, and Noa did not ask for help.
    page_refs:
      - p01
      - p09
      - p10
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: How does the true reason change Noa's action?
    answer: It leads Noa to use a cart and speak honestly to Auntie.
    page_refs:
      - p12
      - p13
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Noa hurries through the damp market. A heavy flour bag pulls at the satchel.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Noa looks for a shortcut. Under an arch, a tiny door appears.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Inside, glass bottles hold storms, clocks, and knotted ropes.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: The Clerk waits beside a blank ledger. “What made you late?”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: “Heavy rain,” Noa says, choosing a storm bottle.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: The Clerk touches Noa's dry sleeve. “The rain missed your coat.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Noa reaches for a clock bottle. “Then that crooked clock fooled me.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: The Clerk holds up a working watch. Noa puts the bottle back.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: A third bottle shows a crowded lane. Noa remembers stopping at the pastry window.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Noa lowers the satchel. “The flour was heavy. I kept stopping because I did not want to carry it.”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: The three excuse bottles burst into curls of colored smoke.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: A plain bottle with a clear stone remains. The Clerk points toward the door. “There is a cart outside.”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Noa sets the heavy satchel on the handcart and grips its handles.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: The cart rolls quickly to Auntie's bakery.
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: Noa faces Auntie. “The bag was too heavy. I should have asked for a cart.”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: Auntie takes one end of the flour bag. “Next time, borrow a cart before your arms hurt.” Together, they unload it.
