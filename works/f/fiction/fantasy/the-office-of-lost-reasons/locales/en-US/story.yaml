schema_version: 1
language: en-US
writer: brass-compass
title: The Office of Lost Reasons
summary: Noa is late delivering flour and enters an office that stores lost reasons. Three excuses fail when the Clerk checks them. Noa finally admits the heavy bag caused delay, borrows a handcart, and tells Auntie the truth.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and wry, timbre: clear adult voice, pace: medium, pitch: medium}}
  noa: {display_name: Noa, tts: {delivery: quick but thoughtful, timbre: bright young voice, pace: medium, pitch: medium-high}}
  clerk: {display_name: Clerk, tts: {delivery: quiet and exact, timbre: soft older voice, pace: slow, pitch: medium-low}}
  auntie: {display_name: Auntie, tts: {delivery: warm and direct, timbre: mellow older voice, pace: medium-slow, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Noa hurries through the damp market."}, {speaker: narrator, text: "A heavy flour bag fills the satchel."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Noa searches for a shortcut."}, {speaker: narrator, text: "A tiny door appears beneath an arch."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Inside, bottles hold storms, clocks, and tangled ropes."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "The Clerk waits beside an empty ledger."}, {speaker: clerk, text: "Which reason made you late?"}]}
  - {id: p05, illustration: p05, lines: [{speaker: noa, text: "Heavy rain slowed me."}, {speaker: narrator, text: "Noa offers a tiny storm bottle."}]}
  - {id: p06, illustration: p06, lines: [{speaker: clerk, text: "Your coat is dry."}, {speaker: narrator, text: "The first bottle gives no true answer."}]}
  - {id: p07, illustration: p07, lines: [{speaker: noa, text: "Then a crooked clock fooled me."}, {speaker: narrator, text: "Noa offers a clock bottle."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "The Clerk shows a working pocket watch."}, {speaker: narrator, text: "Noa grows less certain."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "A third bottle shows a crowded lane."}, {speaker: narrator, text: "Noa remembers stopping at a pastry window."}]}
  - {id: p10, illustration: p10, lines: [{speaker: noa, text: "The flour felt heavy."}, {speaker: noa, text: "I kept delaying the walk."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "The false bottles pop into harmless colored smoke."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "One plain bottle with a clear stone remains."}, {speaker: clerk, text: "A true reason can guide a better action."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Noa chooses a handcart beside the door."}, {speaker: narrator, text: "The heavy satchel rides on it."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Noa reaches Auntie's bakery at last."}]}
  - {id: p15, illustration: p15, lines: [{speaker: noa, text: "I was late because the bag felt heavy."}, {speaker: noa, text: "I should have asked for a cart."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "Auntie helps unload the flour."}, {speaker: auntie, text: "Next time, ask before you struggle alone."}]}
chapters:
  - {id: ch01, title: Three Bottled Excuses, page_refs: [p01, p02, p03, p04, p05, p06, p07, p08]}
  - {id: ch02, title: The True Reason, page_refs: [p09, p10, p11, p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: "Why does the rain excuse fail?", answer: "Noa's coat is dry.", page_refs: [p05, p06]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What does Noa do after admitting the true reason?", answer: "Noa puts the satchel on a handcart and finishes the delivery.", page_refs: [p10, p11, p12, p13, p14]}
  - {id: q03, type: character-motive, speaker: narrator, prompt: "Why did Noa keep delaying?", answer: "The flour bag felt heavy, and Noa did not ask for help.", page_refs: [p01, p09, p10]}
  - {id: q04, type: short-answer, speaker: narrator, prompt: "How does the true reason change Noa's action?", answer: "It leads Noa to use a cart and speak honestly to Auntie.", page_refs: [p12, p13, p15]}
