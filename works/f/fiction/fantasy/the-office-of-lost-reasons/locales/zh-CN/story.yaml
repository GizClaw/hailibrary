      tts:
        delivery: 机灵后沉思
        timbre: 明亮的年轻声音
        pace: 中速
        pitch: 中高音
    clerk:
      display_name: 管理员
      tts:
        delivery: 安静精确
        timbre: 柔和的年长声音
        pace: 慢速
        pitch: 中低音
    auntie:
      display_name: 姨妈
      tts:
        delivery: 温暖直接
        timbre: 温厚的年长声音
        pace: 中慢速
        pitch: 中低音
