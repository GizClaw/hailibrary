schema_version: 2
language: zh-CN
writer: 铜罗盘
title: 丢失理由办事处
summary: 诺亚背着面粉迟到了，便到收藏借口的办事处寻找理由。瓶子里的借口一个也对不上，诺亚只好承认袋子太重，并改用手推车。
chapters:
  - id: ch01
    title: 三个瓶装借口
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
  - id: ch02
    title: 真正的理由
    page_refs:
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 大雨的借口为什么不成立？
    answer: 诺亚的外套是干的。
    page_refs:
      - p05
      - p06
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 承认真理由后，诺亚做了什么？
    answer: 把挎包放上手推车，继续完成送货。
    page_refs:
      - p10
      - p11
      - p12
      - p13
      - p14
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 诺亚为什么一直拖延？
    answer: 面粉袋太重，而诺亚没有开口求助。
    page_refs:
      - p01
      - p09
      - p10
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 真理由怎样改变了诺亚的做法？
    answer: 诺亚改用手推车，还向姨妈诚实说明原因。
    page_refs:
      - p12
      - p13
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 诺亚匆匆穿过湿漉漉的集市。沉重的面粉袋坠着挎包。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 诺亚四处找近路。拱门下面忽然多出一扇小门。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 门里的玻璃瓶装着暴雨、时钟和打结的绳子。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 管理员坐在空册子旁，问：“什么事让你迟到了？”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 诺亚挑出一只暴雨瓶：“下大雨，路不好走。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 管理员摸摸诺亚的干袖子：“这场雨没淋到你。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 诺亚又拿起时钟瓶：“那就是歪时钟骗了我。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 管理员举起走得很准的怀表。诺亚默默放回瓶子。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 第三只瓶里挤满人群。诺亚却想起，自己在点心窗前停了很久。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 诺亚放下挎包：“面粉太重。我不想背，就走走停停。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 三只借口瓶砰地炸开，变成一团团彩色烟雾。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 柜台上只剩装着透明石头的素瓶。管理员指指门外：“那里有辆手推车。”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 诺亚把沉重的挎包放上手推车，握紧车把。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 小车轻快地滚到姨妈的面包房门口。
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 诺亚看着姨妈说：“袋子太重了。我早该来借车。”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 姨妈接住面粉袋：“下次先借车，别等胳膊酸。”两人一起卸下面粉。
