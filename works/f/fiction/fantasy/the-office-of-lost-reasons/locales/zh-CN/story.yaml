schema_version: 1
language: zh-CN
writer: 江笑
title: 借口招领处
summary: 诺亚送面粉迟到了，却一连找出三个借口。走进借口招领处后，只有真正的难处没有消失。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 克制幽默, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  noa: {display_name: 诺亚, tts: {delivery: 先快后稳, timbre: 明亮的少年声音, pace: 中快速, pitch: 中高音}}
  clerk: {display_name: 管事人, tts: {delivery: 轻声准确, timbre: 略显沙哑的年长声音, pace: 慢速, pitch: 中低音}}
  auntie: {display_name: 塞拉姨, tts: {delivery: 温暖直接, timbre: 饱满的年长声音, pace: 中速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 诺亚给塞拉姨的面包房送面粉，已经迟到了。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 诺亚忙着找近路，撞见一扇昨天还没有的小门。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 门后摆满瓶子，暴雨、坏钟、人群都装在里面——样样都像迟到的好理由。}]}
  - {id: p04, illustration: p04, lines: [{speaker: clerk, text: 欢迎光临借口招领处。你丢的是哪一个？}]}
  - {id: p05, illustration: p05, lines: [{speaker: noa, text: 大雨把我拦住了。}]}
  - {id: p06, illustration: p06, lines: [{speaker: clerk, text: 这场雨可真大，偏偏一滴也没落在你的外套上。}]}
  - {id: p07, illustration: p07, lines: [{speaker: noa, text: 那就是市场的钟走错了。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 管事人掏出怀表。滴答声和市场的钟声正好对上。}]}
  - {id: p09, illustration: p09, lines: [{speaker: noa, text: 人群挡住了我。}, {speaker: clerk, text: 是糕点橱窗前的人群吗？}]}
  - {id: p10, illustration: p10, lines: [{speaker: noa, text: 面粉太重，我停了好多次，却把耽搁全怪到别人头上。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 装着暴雨、坏钟和人群的瓶子噗噗冒烟，转眼就空了。}]}
  - {id: p12, illustration: p12, lines: [{speaker: clerk, text: “东西太重”没有消失。真的难处，说出来才有办法。}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 诺亚借来手推车，把沉甸甸的袋子放上去。}]}
  - {id: p14, illustration: p14, lines: [{speaker: noa, text: 我没安排好，还藏起了真正的问题，所以迟到了。}]}
  - {id: p15, illustration: p15, lines: [{speaker: auntie, text: 下次早点借车，别等面粉开始编天气。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 两人一起卸完面粉。身后那扇小门见诺亚没了借口，悄悄躲回墙里。}]}
chapters:
  - {id: ch01, title: 瓶子里的借口, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 三个好借口, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: ch03, title: 说出真正的难处, page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 诺亚先用了什么借口？, answer: 诺亚先怪下雨。, page_refs: [p05]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: 暴雨这个借口为什么站不住？, answer: 诺亚的外套是干的，说明并没有暴雨。, page_refs: [p05, p06]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: 诺亚送货时真正遇到的难处是什么？, answer: 面粉太重，诺亚又没有提前借车或找人帮忙。, page_refs: [p10]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: 诺亚为什么怪别的东西？, answer: 诺亚不愿承认自己没安排好，想躲开责任。, page_refs: [p09, p10, p14]}
  - {id: q05, type: evidence, speaker: narrator, prompt: 什么说明诚实改变了诺亚的行动？, answer: 诺亚说出真正的问题，借来手推车，还向塞拉姨讲了实话。, page_refs: [p10, p13, p14]}
