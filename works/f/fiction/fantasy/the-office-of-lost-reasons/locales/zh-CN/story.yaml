schema_version: 1
language: zh-CN
writer: 铜罗盘
title: 丢失理由办事处
summary: 诺亚送面粉迟到了，误入一间收藏理由的办事处。三个借口都经不起查验。诺亚终于承认面粉太重，改用手推车完成送货，并向姨妈说出实情。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 从容带笑, timbre: 清楚的成年声音, pace: 中速, pitch: 中音}}
  noa: {display_name: 诺亚, tts: {delivery: 机灵后沉思, timbre: 明亮的年轻声音, pace: 中速, pitch: 中高音}}
  clerk: {display_name: 管理员, tts: {delivery: 安静精确, timbre: 柔和的年长声音, pace: 慢速, pitch: 中低音}}
  auntie: {display_name: 姨妈, tts: {delivery: 温暖直接, timbre: 温厚的年长声音, pace: 中慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 诺亚匆匆穿过湿漉漉的集市。}, {speaker: narrator, text: 挎包里装着一袋沉重的面粉。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 诺亚想找一条近路。}, {speaker: narrator, text: 拱门下忽然出现一扇小门。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 门内的瓶子装着暴雨、时钟和乱绳。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 管理员守着一本空册子。}, {speaker: clerk, text: 什么理由让你迟到了？}]}
  - {id: p05, illustration: p05, lines: [{speaker: noa, text: 大雨拖慢了我。}, {speaker: narrator, text: 诺亚递出一只暴雨瓶。}]}
  - {id: p06, illustration: p06, lines: [{speaker: clerk, text: 可是你的外套是干的。}, {speaker: narrator, text: 第一个瓶子答不上来。}]}
  - {id: p07, illustration: p07, lines: [{speaker: noa, text: 那就是歪时钟骗了我。}, {speaker: narrator, text: 诺亚又递出一只时钟瓶。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 管理员拿出走得很准的怀表。}, {speaker: narrator, text: 诺亚没那么肯定了。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 第三个瓶子里挤满人群。}, {speaker: narrator, text: 诺亚却想起自己在点心窗前停过。}]}
  - {id: p10, illustration: p10, lines: [{speaker: noa, text: 其实面粉太重。}, {speaker: noa, text: 我一次次拖着不肯走。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 假理由变成彩色烟雾，轻轻散开。}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: 柜台上只剩装着透明石头的素瓶。}, {speaker: clerk, text: 真理由能带你找到新办法。}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 诺亚选择门边的手推车。}, {speaker: narrator, text: 沉重的挎包坐上了车。}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: 诺亚终于到了姨妈的面包房。}]}
  - {id: p15, illustration: p15, lines: [{speaker: noa, text: 我迟到是因为面粉太重。}, {speaker: noa, text: 我应该早点借一辆车。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 姨妈和诺亚一起卸下面粉。}, {speaker: auntie, text: 下次别一个人硬撑，先来问我。}]}
chapters:
  - {id: ch01, title: 三个瓶装借口, page_refs: [p01, p02, p03, p04, p05, p06, p07, p08]}
  - {id: ch02, title: 真正的理由, page_refs: [p09, p10, p11, p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: 大雨的借口为什么不成立？, answer: 诺亚的外套是干的。, page_refs: [p05, p06]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 承认真理由后，诺亚做了什么？, answer: 把挎包放上手推车，继续完成送货。, page_refs: [p10, p11, p12, p13, p14]}
  - {id: q03, type: character-motive, speaker: narrator, prompt: 诺亚为什么一直拖延？, answer: 面粉袋太重，而诺亚没有开口求助。, page_refs: [p01, p09, p10]}
  - {id: q04, type: short-answer, speaker: narrator, prompt: 真理由怎样改变了诺亚的做法？, answer: 诺亚改用手推车，还向姨妈诚实说明原因。, page_refs: [p12, p13, p15]}
