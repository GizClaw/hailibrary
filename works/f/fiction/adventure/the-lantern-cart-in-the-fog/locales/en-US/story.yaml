schema_version: 1
language: en-US
writer: kind-spark
title: The Lantern Cart in the Fog
summary: When Bramble is stranded beyond a flooded road, Pippa must stop treating her clever lantern cart as the only voice in the rescue.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and warm, timbre: clear adult voice, pace: medium, pitch: medium}}
  pippa: {display_name: Pippa, tts: {delivery: quick and determined, timbre: wiry young voice, pace: medium-fast, pitch: medium-high}}
  roan: {display_name: Roan, tts: {delivery: steady and direct, timbre: grounded adult voice, pace: medium, pitch: medium-low}}
  nima: {display_name: Nima, tts: {delivery: dryly humorous and firm, timbre: lean older voice, pace: medium-slow, pitch: medium}}
  bramble: {display_name: Bramble, tts: {delivery: bright but tired, timbre: small young voice, pace: medium, pitch: high}}
pages:
  - id: p01
    illustration: p01
    lines:
      - {speaker: narrator, text: "Rain drummed on the harbor roofs all night. By morning it had stopped, but fog pressed against every window and hid the hill road."}
      - {speaker: narrator, text: "From somewhere above the gray water came one small bell, then silence."}
  - id: p02
    illustration: p02
    lines:
      - {speaker: roan, text: "Bramble went to inspect the watchtower before the storm. He should have returned at dawn."}
      - {speaker: pippa, text: "That faint bell is his. He may be asking for help."}
      - {speaker: narrator, text: "Neither dog could see the tower, yet both knew that waiting without a plan could leave Bramble cold and alone."}
  - id: p03
    illustration: p03
    lines:
      - {speaker: narrator, text: "Pippa opened her workshop and rolled out a lantern cart she had built from brass, glass, and four wide wheels."}
      - {speaker: pippa, text: "It remembers every harbor road. Its lamp can lead us through fog, and its motor can carry blankets and tea."}
      - {speaker: roan, text: "A useful invention still needs someone to watch the road."}
  - id: p04
    illustration: p04
    lines:
      - {speaker: narrator, text: "The cart compared its stored routes and turned toward the low reed road, the shortest way around the hill."}
      - {speaker: pippa, text: "See? It chose in a breath what would take us several minutes."}
      - {speaker: narrator, text: "Roan followed, but he studied the ditch, the bent grass, and the fresh lines of mud."}
  - id: p05
    illustration: p05
    lines:
      - {speaker: roan, text: "Stop. Water is moving across the stepping stones, and the reeds are lying in the direction of the current."}
      - {speaker: narrator, text: "The first stone was visible. The next two appeared and vanished beneath brown water."}
      - {speaker: pippa, text: "The cart crossed here yesterday. Its wheels are wider than our paws."}
  - id: p06
    illustration: p06
    lines:
      - {speaker: narrator, text: "A bright beam stretched from the cart toward the flooded path. The machine still treated distance as the most important fact."}
      - {speaker: pippa, text: "Its map calls this the fastest road. If we turn back now, Bramble waits longer."}
      - {speaker: roan, text: "Fast is not useful when the road cannot carry us home."}
  - id: p07
    illustration: p07
    lines:
      - {speaker: narrator, text: "Pippa stepped toward the first stone, but Roan placed one boot on the dry bank before her."}
      - {speaker: roan, text: "Yesterday's map cannot measure today's water. We can help Bramble without adding two more dogs to the rescue."}
      - {speaker: narrator, text: "Pippa disliked losing time, although she could not answer what the moving water would do to the cart."}
  - id: p08
    illustration: p08
    lines:
      - {speaker: narrator, text: "She pulled the cart back from the path. At the muddy edge, one wheel sank to its axle and the lantern tilted."}
      - {speaker: pippa, text: "It was only the edge."}
      - {speaker: roan, text: "The edge is evidence. The middle would not become firmer because we wished it so."}
      - {speaker: narrator, text: "Together they freed the wheel without entering the water."}
  - id: p09
    illustration: p09
    lines:
      - {speaker: narrator, text: "The only higher road crossed Nima's orchard. Pippa had drawn it on her private map after seeing the gate open last summer."}
      - speaker: nima
        content: [{text: "A route through my home needs my "}, {vocabulary: {id: consent, text: consent}}, {text: ", even during an urgent journey."}]
      - {speaker: pippa, text: "Bramble may be stranded. May we pass if we protect your trees and beds?"}
  - id: p10
    illustration: p10
    lines:
      - {speaker: nima, text: "Yes, under three conditions: use the upper strip, keep the wheels away from the seedlings, and let me guide you."}
      - {speaker: pippa, text: "I agree. I also should not have placed your home on the cart's map without asking."}
      - {speaker: narrator, text: "Nima opened the gate, not because the machine had selected her land, but because she had chosen to help."}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "Beyond the gate, storm-broken branches blocked the orchard lane. Wet leaves covered the narrow spaces between them."}
      - {speaker: roan, text: "We cannot drag a loaded cart across those seed beds."}
      - {speaker: nima, text: "And cutting the young trees would destroy years of work. We need another way through."}
  - id: p12
    illustration: p12
    lines:
      - {speaker: pippa, text: "The motor can push harder. It was built to move heavy loads."}
      - {speaker: roan, text: "More force may break the cart, tear the branches, or throw a wheel into the garden."}
      - {speaker: narrator, text: "Pippa held the drive lever. The invention could obey her immediately, which made the choice feel easier than it was."}
  - id: p13
    illustration: p13
    lines:
      - {speaker: nima, text: "Your machine knows distance and power. It does not know which ground is fragile, who owns a garden, or what you promised at my gate."}
      - {speaker: narrator, text: "Pippa looked from the lever to the seedlings. Saving time for Bramble mattered, but so did keeping the conditions she had accepted."}
      - {speaker: pippa, text: "Then the cart's answer is incomplete."}
  - id: p14
    illustration: p14
    lines:
      - {speaker: narrator, text: "Pippa switched off automatic guidance. On a dry crate, the three dogs shaped small clay models of the hill paths."}
      - {speaker: pippa, text: "The cart can carry light and supplies. It should not make a decision that depends on safety, permission, and damage."}
      - {speaker: roan, text: "Good. Now we can compare what each route costs."}
  - id: p15
    illustration: p15
    lines:
      - {speaker: nima, text: "Behind the old kiln is a pottery passage. It bends twice and adds distance, but its stone floor stands above the wet ground."}
      - {speaker: roan, text: "The arches may shelter us from wind, and the cart is narrow enough to pass."}
      - {speaker: narrator, text: "The longer route used more time, yet it protected the group, the orchard, and the supplies."}
  - id: p16
    illustration: p16
    lines:
      - {speaker: narrator, text: "Nima led through a side gate. Roan counted the group at every bend while Pippa guided the dimmed cart by hand."}
      - {speaker: pippa, text: "I thought control meant making the machine decide quickly."}
      - {speaker: roan, text: "Sometimes control means knowing when to stop it."}
      - {speaker: narrator, text: "Their slower pace kept every wheel on the dry stone."}
  - id: p17
    illustration: p17
    lines:
      - {speaker: narrator, text: "Near the watchtower, the fog thinned enough to show a red coat in the sheltered doorway."}
      - {speaker: bramble, text: "I heard your cart and rang again. I stayed under the roof because the low road filled before I could return."}
      - {speaker: pippa, text: "We brought blankets, tea, and three different kinds of good advice."}
  - id: p18
    illustration: p18
    lines:
      - {speaker: bramble, text: "I nearly tried the stones when only the first one was covered. Then the current hid the next two."}
      - {speaker: roan, text: "You made the safer choice before you knew when help would arrive."}
      - {speaker: pippa, text: "We made the same choice later. The shortest road was not the quickest road that could bring everyone back."}
  - id: p19
    illustration: p19
    lines:
      - {speaker: narrator, text: "They returned together through the pottery passage. Bramble carried the empty cups, and Nima checked each gate behind them."}
      - {speaker: narrator, text: "The lantern cart rolled in the middle of the group. Its light was valuable, although nobody mistook its glowing path for an order."}
      - {speaker: pippa, text: "A good tool should make room for the knowledge around it."}
  - id: p20
    illustration: p20
    lines:
      - {speaker: narrator, text: "Back in the workshop, Pippa added a large pause lever and blank route tokens that different guides could place by hand."}
      - {speaker: pippa, text: "Next time, the cart will show when its map is old, wait for permission on private ground, and let any traveler pause it."}
      - {speaker: nima, text: "Then it will remember more than roads. It will remember that roads belong to changing places and living neighbors."}
chapters:
  - {id: ch01, title: Yesterday's Fastest Road, page_refs: [p01, p02, p03, p04, p05, p06, p07]}
  - {id: ch02, title: The Gate That Could Say No, page_refs: [p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: Light Without Command, page_refs: [p15, p16, p17, p18, p19, p20]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "Which details show that the low road should not be used?", answer: "Water moves over the stones, a wheel sinks at the edge, and Bramble says the road filled quickly.", page_refs: [p05, p08, p18]}
  - {id: q02, type: character-motive, speaker: narrator, prompt: "Why does Pippa keep trusting the lantern cart at first?", answer: "She is proud that it remembers the roads and believes the shortest saved route will still be best.", page_refs: [p03, p04, p06]}
  - {id: q03, type: compare, speaker: narrator, prompt: "What can Nima and Roan notice that the cart cannot?", answer: "They notice current conditions, property boundaries, possible damage, and the need for permission.", page_refs: [p05, p09, p12, p13]}
  - {id: q04, type: cause-effect, speaker: narrator, prompt: "What could happen if Pippa made the cart push harder at the blocked lane?", answer: "More force could damage the cart, trees, and garden without opening a safe route.", page_refs: [p11, p12]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: "How does Pippa's idea of a helpful invention change?", answer: "She learns that a tool should reveal limits and support shared decisions rather than command them.", page_refs: [p03, p13, p14, p20]}
  - {id: q06, type: evidence, speaker: narrator, prompt: "Which results show that the longer upper route still made the rescue succeed?", answer: "The group reaches Bramble safely while respecting Nima's conditions and avoiding the flooded road.", page_refs: [p10, p15, p18, p19]}
