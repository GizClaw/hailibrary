schema_version: 1
language: zh-CN
writer: 星火
title: 雾中灯车
summary: 小荆被困在积水路对面的瞭望塔里。皮帕这才明白，聪明的灯车可以帮忙，却不能替大家拿主意。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 从容温暖, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  pippa: {display_name: 皮帕, tts: {delivery: 急切果断, timbre: 清亮的年轻声音, pace: 中快速, pitch: 中高音}}
  roan: {display_name: 罗安, tts: {delivery: 沉稳直接, timbre: 厚实的成年声音, pace: 中速, pitch: 中低音}}
  nima: {display_name: 妮玛, tts: {delivery: 带一点幽默但很坚定, timbre: 清瘦的年长声音, pace: 中慢速, pitch: 中音}}
  bramble: {display_name: 小荆, tts: {delivery: 明亮中带着疲惫, timbre: 稚嫩的少年声音, pace: 中速, pitch: 高音}}
pages:
  - id: p01
    illustration: p01
    lines:
      - {speaker: narrator, text: "暴雨敲了一夜的屋顶。天亮后，雨声停了，浓雾却贴满港口，把通往山上的路遮得严严实实。"}
      - {speaker: narrator, text: "灰蒙蒙的水面上方，忽然传来一声细小的铃响，随即又安静下来。"}
  - id: p02
    illustration: p02
    lines:
      - {speaker: roan, text: "小荆昨晚去瞭望塔查看风雨，照理天一亮就该回来。"}
      - {speaker: pippa, text: "刚才一定是他在摇铃。他也许被困住了。"}
      - {speaker: narrator, text: "他们看不见塔，也不能只是干等。可要去接小荆，首先得找到一条能平安往返的路。"}
  - id: p03
    illustration: p03
    lines:
      - {speaker: narrator, text: "皮帕推开工坊大门，拉出一辆铜皮包边的四轮灯车。这是她刚刚完成的新发明。"}
      - {speaker: pippa, text: "港口的每条路，它都记得。车上能装毛毯和热茶，灯也能在雾里引路。"}
      - {speaker: roan, text: "有本事的工具，也得有人替它看着脚下。"}
  - id: p04
    illustration: p04
    lines:
      - {speaker: narrator, text: "灯车把记住的道路比了一遍，转向山脚的芦苇路。绕过山丘，这条路最短。"}
      - {speaker: pippa, text: "瞧，它眨眼间就选好了。换成我们，光商量也要好一会儿。"}
      - {speaker: narrator, text: "罗安跟在旁边，目光却没有离开水沟、倒伏的草叶和刚冲出来的泥痕。"}
  - id: p05
    illustration: p05
    lines:
      - {speaker: roan, text: "先停下。水正越过踏脚石，芦苇也全朝水流的方向倒着。"}
      - {speaker: narrator, text: "第一块石头还露在外面，后面两块却在黄水里时隐时现。"}
      - {speaker: pippa, text: "昨天灯车才从这里走过。它的轮子比我们的脚掌宽。"}
  - id: p06
    illustration: p06
    lines:
      - {speaker: narrator, text: "一道亮光从车头伸出去，仍旧指向积水深处。灯车只会比较远近，并不知道昨夜下过多大的雨。"}
      - {speaker: pippa, text: "地图说这里最快。现在回头，小荆就要多等很久。"}
      - {speaker: roan, text: "如果过得去却回不来，再快也帮不了谁。"}
  - id: p07
    illustration: p07
    lines:
      - {speaker: narrator, text: "皮帕刚要迈向第一块石头，罗安便稳稳挡在干地边上。"}
      - {speaker: roan, text: "昨天的地图量不出今天的水。我们是去救小荆，不能让等待救援的再多两只狗。"}
      - {speaker: narrator, text: "皮帕急着赶路，却也说不准水流会把灯车推向哪里。"}
  - id: p08
    illustration: p08
    lines:
      - {speaker: narrator, text: "她把灯车往回拉。车轮只碰到泥地边缘，便一下陷到轮轴，连车灯都歪向一旁。"}
      - {speaker: pippa, text: "这里只是岸边。"}
      - {speaker: roan, text: "岸边已经告诉我们答案。路中央不会因为我们着急，就忽然变结实。"}
      - {speaker: narrator, text: "两人站在干地上合力，总算把车轮拔了出来。"}
  - id: p09
    illustration: p09
    lines:
      - {speaker: narrator, text: "剩下的高处通道要横穿妮玛的果园。去年夏天，皮帕见大门开着，就悄悄把这条小路画进了自己的地图。"}
      - speaker: nima
        content: [{text: "这里是我的家。就算事情紧急，要从门里经过，也得先征得我的"}, {vocabulary: {id: consent, text: 同意}}, {text: "。"}]
      - {speaker: pippa, text: "小荆可能被困在塔里。只要不伤果树和苗床，你愿意让我们过去吗？"}
  - id: p10
    illustration: p10
    lines:
      - {speaker: nima, text: "可以，但有三个条件：走上面的窄道，车轮不能碰苗床，还要由我带路。"}
      - {speaker: pippa, text: "我答应。还有，没先问你就把你家画进地图，是我做错了。"}
      - {speaker: narrator, text: "妮玛打开门，不是因为灯车替她选好了，而是因为她自己愿意帮忙。"}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "进门不远，暴风折断的树枝便堵满小路。湿叶铺在枝杈之间，几乎找不到落脚处。"}
      - {speaker: roan, text: "装满东西的车不能从苗床上拖过去。"}
      - {speaker: nima, text: "这些小树也种了好几年，不能为了省时间就把它们砍掉。"}
  - id: p12
    illustration: p12
    lines:
      - {speaker: pippa, text: "灯车本来就能拉重物。把马力开大，也许能把树枝顶开。"}
      - {speaker: roan, text: "更大的力气也可能撞坏车、折断活枝，或者让轮子滑进苗床。"}
      - {speaker: narrator, text: "皮帕握住操纵杆。机器会立刻照她的话做，反倒让这个并不简单的决定显得很容易。"}
  - id: p13
    illustration: p13
    lines:
      - {speaker: nima, text: "灯车会算距离和力气，却不知道哪块土经不起压，也不知道一座果园属于谁，更记不得你在门口答应过什么。"}
      - {speaker: narrator, text: "早点接到小荆很重要，守住刚才的承诺也同样重要。皮帕终于把手从操纵杆上挪开。"}
      - {speaker: pippa, text: "看来，灯车给的答案少算了好几件事。"}
  - id: p14
    illustration: p14
    lines:
      - {speaker: narrator, text: "皮帕关掉自动引路。三只狗在干燥的木箱上捏出几条小小的泥塑路线，一条条重新比较。"}
      - {speaker: pippa, text: "车可以运东西、照亮路，却不能替我们决定安全、许可和损失。"}
      - {speaker: roan, text: "这就对了。现在来看看，每条路各要付出什么。"}
  - id: p15
    illustration: p15
    lines:
      - {speaker: nima, text: "旧陶窑后面还有一条通道。它拐两个弯，路程远些，不过石头地面高过积水。"}
      - {speaker: roan, text: "拱顶还能挡风，灯车的宽度也刚好过得去。"}
      - {speaker: narrator, text: "远路会多花时间，却能同时保住大家、果园和车上的救援物品。"}
  - id: p16
    illustration: p16
    lines:
      - {speaker: narrator, text: "妮玛从侧门领路。每过一个弯，罗安都要数一遍人数，皮帕则用手扶着调暗的灯车。"}
      - {speaker: pippa, text: "我原先以为，控制机器就是让它快点作决定。"}
      - {speaker: roan, text: "有时候，真正的控制是知道什么时候该让它停。"}
      - {speaker: narrator, text: "他们走得不快，却没有一只车轮离开干燥的石面。"}
  - id: p17
    illustration: p17
    lines:
      - {speaker: narrator, text: "快到瞭望塔时，雾薄了些，屋檐下露出一件红色雨衣。"}
      - {speaker: bramble, text: "我听见灯车了，就赶紧又摇了一次铃。山脚涨水后，我一直躲在塔里。"}
      - {speaker: pippa, text: "我们带来了毛毯、热茶，还有三种不同的好主意。"}
  - id: p18
    illustration: p18
    lines:
      - {speaker: bramble, text: "起初只有第一块石头进了水，我差点就往回走。紧接着，后面两块也不见了。"}
      - {speaker: roan, text: "你不知道救援什么时候来，还是先替自己作了安全的选择。"}
      - {speaker: pippa, text: "我们后来也一样。最短的路，不一定是能把所有人带回家的最快办法。"}
  - id: p19
    illustration: p19
    lines:
      - {speaker: narrator, text: "四只狗沿陶窑通道一起返回。小荆拿空茶杯，妮玛走在最后，关好每一道门。"}
      - {speaker: narrator, text: "灯车亮着暖光，稳稳走在队伍中间。它依然很有用，却再也没有谁把那束光当成命令。"}
      - {speaker: pippa, text: "好工具应该给周围的知识留出位置。"}
  - id: p20
    illustration: p20
    lines:
      - {speaker: narrator, text: "回到工坊，皮帕装上一根醒目的暂停杆，又做了几块空白路线牌，让熟悉道路的人可以亲手摆放。"}
      - {speaker: pippa, text: "以后地图过期了，灯车会说出来；进入别人的地方，它会等待允许；任何同行者都能叫它停下。"}
      - {speaker: nima, text: "这样，它记住的就不只是道路，还会记得道路长在变化的土地上，也连着许多人的生活。"}
chapters:
  - {id: ch01, title: 昨天的近路, page_refs: [p01, p02, p03, p04, p05, p06, p07]}
  - {id: ch02, title: 可以说不的门, page_refs: [p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: 灯只管照亮, page_refs: [p15, p16, p17, p18, p19, p20]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "哪些细节说明下面那条路不能走？", answer: "水漫过石头，车轮在路边陷进泥里，小荆也说那条路涨水很快。", page_refs: [p05, p08, p18]}
  - {id: q02, type: character-motive, speaker: narrator, prompt: "皮帕起初为什么一直相信灯车？", answer: "她为自己的发明得意，以为机器记下的近路仍是最好的选择。", page_refs: [p03, p04, p06]}
  - {id: q03, type: compare, speaker: narrator, prompt: "妮玛和罗安看见了哪些灯车看不见的事？", answer: "他们看见当天的水势、果园的边界、可能造成的损坏，也知道进门前要征得同意。", page_refs: [p05, p09, p12, p13]}
  - {id: q04, type: cause-effect, speaker: narrator, prompt: "如果皮帕让灯车加大马力硬推，可能造成什么后果？", answer: "硬推不一定能通路，反而可能撞坏灯车、树木和果园。", page_refs: [p11, p12]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: "皮帕后来怎样理解“有用的发明”？", answer: "工具应该说清自己的局限，帮助大家商量，而不是替所有人下命令。", page_refs: [p03, p13, p14, p20]}
  - {id: q06, type: evidence, speaker: narrator, prompt: "哪些结果说明走更远的山路仍然完成了救援？", answer: "大家避开积水，也遵守妮玛的条件，最后平安找到了小荆。", page_refs: [p10, p15, p18, p19]}
