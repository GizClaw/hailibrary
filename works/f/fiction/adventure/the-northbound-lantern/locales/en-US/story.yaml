schema_version: 2
language: en-US
writer: brass-compass
title: The Northbound Lantern
summary: Lia and Ren carry a signal lantern toward a dark northern beacon. A storm and a stranded glider force them to spend the lantern's core, so the settlement finds another way to make enough light.
chapters:
  - id: ch01
    title: Pushed Off Course
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: Power for Two
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
  - id: ch03
    title: Many Small Lights
    page_refs:
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does the signal lantern become dim?
    answer: Its glowing core is moved to the stranded glider.
    page_refs:
      - p10
      - p11
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What do Lia and Ren do after the tow slows them?
    answer: They move the lantern core to Sena's glider.
    page_refs:
      - p09
      - p10
      - p11
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Lia turn away from the direct route?
    answer: She will not leave the stranded pilot in the storm.
    page_refs:
      - p05
      - p06
      - p07
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: How do residents solve the missing-core problem?
    answer: They combine many small lamps to ignite the beacon.
    page_refs:
      - p13
      - p14
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "Lia locks a bright "
            - vocabulary:
                id: lantern
                text: signal lantern
            - text: " into the airship. It must relight the northern beacon."
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Ren points at the clouds. “A storm crosses our route.” Lia checks the fuel and says, “Watch wind and fuel.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: The orange airship climbs toward the floating settlements.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: A crosswind shoves them away from the beacon marks. Ren says, “We are drifting east.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Below them, a mail glider rocks in the wind. Its pilot waves for help.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Ren checks their low fuel. “A long tow could stop both craft.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Lia turns the wheel toward the glider. “We are not leaving her here.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Wind shakes both craft while Ren clips on a tow cable.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: The glider drags behind them. Their airship slows as dark clouds close in.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Lia opens the lantern housing. “Its core can start the glider.”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "Ren connects the glowing core to the glider. Their "
            - vocabulary:
                id: lantern
                text: signal lantern
            - text: " fades to a dull glow."
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: The two craft enter a calm gap in the clouds. Sena calls, “I can fly beside you now.”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: The settlement appears. Without the core, its beacon stays dark.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Residents bring small lamps. They circle the dim lantern.
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: One by one, their flames feed the beacon. A large light blooms above the roofs.
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: Both craft leave under the steady light. Ren looks up. “The north route is lit.”
