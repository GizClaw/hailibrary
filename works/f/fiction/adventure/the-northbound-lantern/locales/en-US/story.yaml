schema_version: 1
language: en-US
writer: north-star-map
title: The Northbound Lantern
summary: Lia risks a vital delivery to rescue another craft, then finds a shared solution.
cast:
  narrator: {display_name: Narrator, tts: {delivery: brisk and vivid, timbre: clear adult voice, pace: medium, pitch: medium}}
  lia: {display_name: Lia, tts: {delivery: decisive and warm, timbre: strong adult voice, pace: medium-fast, pitch: medium}}
  ren: {display_name: Ren, tts: {delivery: analytical with dry humor, timbre: calm adult voice, pace: medium, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, content: [{text: "Lia strapped down the northbound "}, {vocabulary: {id: lantern, text: lantern}}, {text: ". It would restart a distant beacon."}]}]}
  - {id: p02, illustration: p02, lines: [{speaker: ren, text: "The storm is coming. We have fuel for one straight flight."}]}
  - {id: p03, illustration: p03, lines: [{speaker: lia, text: "Then keep it steady. We cannot waste time."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "A crosswind blew their airship off the beacon route."}]}
  - {id: p05, illustration: p05, lines: [{speaker: lia, text: "There is a stranded mail glider below us."}]}
  - {id: p06, illustration: p06, lines: [{speaker: ren, text: "If we rescue it, we will not have enough fuel for the delivery."}]}
  - {id: p07, illustration: p07, lines: [{speaker: lia, text: "What good is this lantern if we leave someone in danger?"}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Ren fastened a tow cable while Lia held both craft steady."}]}
  - {id: p09, illustration: p09, lines: [{speaker: ren, text: "We are too slow. The storm will reach us first."}]}
  - {id: p10, illustration: p10, lines: [{speaker: lia, text: "The lantern core can power an engine too."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "They fitted the core into the glider. The lantern went dim."}]}
  - {id: p12, illustration: p12, lines: [{speaker: ren, text: "Now both craft can fly. Stay close through that gap in the clouds."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "They broke through the storm and saw the northern settlement. Its beacon was still dark."}]}
  - {id: p14, illustration: p14, lines: [{speaker: lia, text: "Bring every lamp you have! We can give the core a little light."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Small lamps gathered around the core. It brightened, and the beacon blazed to life."}]}
  - {id: p16, illustration: p16, lines: [{speaker: ren, text: "Well, our detour gave us another crew."}]}
chapters:
  - {id: ch01, title: One Direct Route, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: The Cost of Rescue, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: ch03, title: Many Small Lights, page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: "What interrupts the direct flight?", answer: "They find a stranded mail glider.", page_refs: [p04, p05]}
  - {id: q02, type: character-motive, speaker: narrator, prompt: "Why does Lia choose the rescue?", answer: "She refuses to leave someone in danger just to finish the delivery.", page_refs: [p06, p07]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "How does lending the core change the journey?", answer: "It powers the glider so both craft can fly through the gap in the clouds.", page_refs: [p10, p11, p12]}
  - {id: q04, type: evidence, speaker: narrator, prompt: "What proves the settlement can help complete the mission?", answer: "Residents combine their small lamps to restore the core.", page_refs: [p14, p15]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: "Why does Ren call the glider crew a gift from the detour?", answer: "The rescued crew later helps them complete the delivery.", page_refs: [p12, p16]}
