schema_version: 1
language: en-US
writer: brass-compass
title: The Northbound Lantern
summary: Lia and Ren carry a signal lantern toward a dark northern beacon. A storm pushes them off course, and helping a stranded glider uses their glowing power core. At the settlement, many small lamps replace the missing light.
cast:
  narrator: {display_name: Narrator, tts: {delivery: energetic and clear, timbre: brisk adult voice, pace: medium, pitch: medium}}
  lia: {display_name: Lia, tts: {delivery: decisive and warm, timbre: clear adult voice, pace: medium, pitch: medium-high}}
  ren: {display_name: Ren, tts: {delivery: analytical and dry, timbre: steady adult voice, pace: medium-slow, pitch: medium-low}}
  sena: {display_name: Sena, tts: {delivery: calm and resourceful, timbre: warm adult voice, pace: medium, pitch: medium}}
pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content: [{text: "Lia secures a bright "}, {vocabulary: {id: lantern, text: signal lantern}}, {text: " in the airship."}]
      - {speaker: narrator, text: "It will restart a northern beacon."}
  - {id: p02, illustration: p02, lines: [{speaker: ren, text: "Storm clouds are crossing our route."}, {speaker: lia, text: "We will watch the wind and fuel."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "The orange airship rises toward floating settlements."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "A crosswind pushes them away from the beacon marks."}, {speaker: ren, text: "We are drifting east."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Lia sees a mail glider below."}, {speaker: narrator, text: "Its pilot signals for help."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Ren checks the low fuel gauge and distant goal."}, {speaker: ren, text: "A long tow may stop both ships."}]}
  - {id: p07, illustration: p07, lines: [{speaker: lia, text: "We cannot leave the pilot here."}, {speaker: narrator, text: "She turns toward the glider."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Ren clips on a tow cable while wind shakes both craft."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "The tow slows their airship."}, {speaker: narrator, text: "Dark clouds move closer."}]}
  - {id: p10, illustration: p10, lines: [{speaker: lia, text: "The lantern core can power the glider."}, {speaker: narrator, text: "She opens its protected housing."}]}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "Ren connects the glowing core to Sena's glider."}
      - speaker: narrator
        content: [{text: "The "}, {vocabulary: {id: lantern, text: signal lantern}}, {text: " becomes dim."}]
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Both craft enter a narrow calm channel."}, {speaker: sena, text: "My glider can fly beside you now."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "The settlement appears, but its beacon is dark."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Residents bring many small lamps."}, {speaker: narrator, text: "They place them around the dim lantern."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Together, the small lights ignite the large beacon."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "Two repaired airships leave under its steady light."}, {speaker: lia, text: "Helping changed our plan, not our purpose."}]}
chapters:
  - {id: ch01, title: Pushed Off Course, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Power for Two, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: Many Small Lights, page_refs: [p13, p14, p15, p16]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: "Why does the signal lantern become dim?", answer: "Its glowing core is moved to the stranded glider.", page_refs: [p10, p11]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What do Lia and Ren do after the tow slows them?", answer: "They move the lantern core to Sena's glider.", page_refs: [p09, p10, p11]}
  - {id: q03, type: character-motive, speaker: narrator, prompt: "Why does Lia turn away from the direct route?", answer: "She will not leave the stranded pilot in the storm.", page_refs: [p05, p06, p07]}
  - {id: q04, type: short-answer, speaker: narrator, prompt: "How do residents solve the missing-core problem?", answer: "They combine many small lamps to ignite the beacon.", page_refs: [p13, p14, p15]}
