schema_version: 2
language: zh-CN
writer: 铜罗盘
title: 向北的信号灯
summary: 莉娅和任带着信号灯前往北方灯塔。暴风和一架受困的滑翔机迫使他们用掉灯芯，聚落里的居民只好另想办法凑出足够的光。
chapters:
  - id: ch01
    title: 被风吹离航线
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 一份动力，两架船
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
  - id: ch03
    title: 许多盏小灯
    page_refs:
      - p13
      - p14
      - p15
      - p16
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 信号灯为什么暗了？
    answer: 发光灯芯被接到受困的滑翔机上。
    page_refs:
      - p10
      - p11
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 拖行变慢后，莉娅和任怎样做？
    answer: 把信号灯的灯芯接到塞娜的滑翔机上。
    page_refs:
      - p09
      - p10
      - p11
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 莉娅为什么离开直达航线？
    answer: 她不愿把受困的驾驶员留在暴风里。
    page_refs:
      - p05
      - p06
      - p07
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 居民怎样解决缺少灯芯的问题？
    answer: 把许多小灯的光合起来点亮灯塔。
    page_refs:
      - p13
      - p14
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 莉娅把明亮的
            - vocabulary:
                id: lantern
                text: 信号灯
            - text: 锁在飞艇上。它要重新点亮北方灯塔。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 任指着乌云说：“暴风正横穿航线。”莉娅看看燃料：“风向和燃料都盯紧。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 橙色飞艇升向远处的空中聚落。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 侧风把飞艇推离信标航线。任说：“我们正往东偏。”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 下方的邮政滑翔机在风里摇晃。驾驶员朝他们挥手求救。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 任看看不多的燃料：“拖得太久，两架船都可能停下。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 莉娅调头飞向滑翔机：“不能把她留在暴风里。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 两架船被风吹得直晃，任伸手扣上拖绳。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 滑翔机拖在后面，飞艇越来越慢。乌云已经追了上来。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 莉娅打开灯壳：“灯芯能让滑翔机重新起飞。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 任把发光灯芯接到滑翔机上。他们的
            - vocabulary:
                id: lantern
                text: 信号灯
            - text: 只剩一点暗光。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 两架船飞进云间的平静通道。塞娜喊道：“我能跟着你们飞了！”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 聚落终于出现。灯芯不在，灯塔还是黑的。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 居民们提来一盏盏小灯，围在暗下来的信号灯旁。
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 小火苗一盏接一盏亮起。屋顶上方的大灯也亮了。
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 两架飞行器在灯光下再次出发。任抬头说：“现在看得见北边的航线了。”
