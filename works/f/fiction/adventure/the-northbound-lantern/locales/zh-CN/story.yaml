schema_version: 1
language: zh-CN
writer: 铜罗盘
title: 向北的信号灯
summary: 莉娅和任要把信号灯送去点亮北方灯塔。暴风把飞艇吹离航线，他们又遇到受困的邮政滑翔机。救援用掉了灯芯，居民便用许多小灯补足光亮。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 明快清楚, timbre: 利落的成年声音, pace: 中速, pitch: 中音}}
  lia: {display_name: 莉娅, tts: {delivery: 果断温暖, timbre: 清楚的成年声音, pace: 中速, pitch: 中高音}}
  ren: {display_name: 任, tts: {delivery: 理性冷静, timbre: 稳重的成年声音, pace: 中慢速, pitch: 中低音}}
  sena: {display_name: 塞娜, tts: {delivery: 平静机敏, timbre: 温暖的成年声音, pace: 中速, pitch: 中音}}
pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content: [{text: 莉娅把明亮的}, {vocabulary: {id: lantern, text: 信号灯}}, {text: 固定在飞艇上。}]
      - {speaker: narrator, text: 它要重新点亮北方灯塔。}
  - {id: p02, illustration: p02, lines: [{speaker: ren, text: 暴风云正在横穿航线。}, {speaker: lia, text: 我们要留意风向和燃料。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 橙色飞艇飞向远处的空中聚落。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 侧风把飞艇推离信标航线。}, {speaker: ren, text: 我们正在向东偏。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 莉娅看见下方停着一架邮政滑翔机。}, {speaker: narrator, text: 驾驶员正在发出求救信号。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 任看看不多的燃料，又看看远方。}, {speaker: ren, text: 拖得太久，两架船都可能停下。}]}
  - {id: p07, illustration: p07, lines: [{speaker: lia, text: 不能把驾驶员留在暴风里。}, {speaker: narrator, text: 她调头飞向滑翔机。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 风摇晃着两架船，任扣上拖绳。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 拖行让飞艇慢下来。}, {speaker: narrator, text: 乌云却越来越近。}]}
  - {id: p10, illustration: p10, lines: [{speaker: lia, text: 灯芯能给滑翔机提供动力。}, {speaker: narrator, text: 她打开保护外壳。}]}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: 任把发光灯芯接到塞娜的滑翔机上。}
      - speaker: narrator
        content: [{vocabulary: {id: lantern, text: 信号灯}}, {text: 暗了下来。}]
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: 两架船进入狭窄的平静云道。}, {speaker: sena, text: 我的船现在能跟着你们飞。}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 聚落终于出现，灯塔却还是黑的。}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: 居民们带来许多小灯。}, {speaker: narrator, text: 大家把灯围在暗下来的信号灯旁。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: 小小的光合在一起，点亮了大灯塔。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 两架修好的飞艇在灯塔下出发。}, {speaker: lia, text: 帮助别人改变了计划，没有改变目标。}]}
chapters:
  - {id: ch01, title: 被风吹离航线, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 一份动力，两架船, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 许多盏小灯, page_refs: [p13, p14, p15, p16]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: 信号灯为什么暗了？, answer: 发光灯芯被接到受困的滑翔机上。, page_refs: [p10, p11]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 拖行变慢后，莉娅和任怎样做？, answer: 把信号灯的灯芯接到塞娜的滑翔机上。, page_refs: [p09, p10, p11]}
  - {id: q03, type: character-motive, speaker: narrator, prompt: 莉娅为什么离开直达航线？, answer: 她不愿把受困的驾驶员留在暴风里。, page_refs: [p05, p06, p07]}
  - {id: q04, type: short-answer, speaker: narrator, prompt: 居民怎样解决缺少灯芯的问题？, answer: 把许多小灯的光合起来点亮灯塔。, page_refs: [p13, p14, p15]}
