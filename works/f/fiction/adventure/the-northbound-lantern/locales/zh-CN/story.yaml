schema_version: 1
language: zh-CN
writer: 北辰
title: 风暴前送灯
summary: 莉娅赶着把信号灯送往北方，却在风暴前遇见一架受困的滑翔机。救人还是赶路，她必须马上决定。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 明快生动, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  lia: {display_name: 莉娅, tts: {delivery: 果断温暖, timbre: 坚定的成年声音, pace: 中快速, pitch: 中音}}
  ren: {display_name: 任, tts: {delivery: 理性略带冷幽默, timbre: 平静的成年声音, pace: 中速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, content: [{text: 莉娅固定好要送往北方的}, {vocabulary: {id: lantern, text: 信号灯}}, {text: 。它要重启远方的信标。}]}]}
  - {id: p02, illustration: p02, lines: [{speaker: ren, text: 风暴就要来了。这点油，只够我们直飞。}]}
  - {id: p03, illustration: p03, lines: [{speaker: lia, text: 那就稳着飞，别耽搁。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 侧风把飞艇吹出了航标指引的安全航线。}]}
  - {id: p05, illustration: p05, lines: [{speaker: lia, text: 下面有架邮政滑翔机！它动不了了。}]}
  - {id: p06, illustration: p06, lines: [{speaker: ren, text: 绕过去救人，送灯的油就不够了。}]}
  - {id: p07, illustration: p07, lines: [{speaker: lia, text: 要是见死不救，这盏灯送到了又能照亮什么？}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 任安装拖缆，莉娅在风中稳住两架飞行器。}]}
  - {id: p09, illustration: p09, lines: [{speaker: ren, text: 拖着它，风暴迟早会追上来。}]}
  - {id: p10, illustration: p10, lines: [{speaker: lia, text: 信号灯的能量芯也能给引擎供能。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 能量芯装进滑翔机，信号灯顿时暗了。}]}
  - {id: p12, illustration: p12, lines: [{speaker: ren, text: 现在两架都有动力。跟紧我，穿过那道云缝！}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 两架飞行器冲出风暴，北方聚落就在眼前。可信标还是一片漆黑。}]}
  - {id: p14, illustration: p14, lines: [{speaker: lia, text: 大家把灯都拿来！先给它续上一点光。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: 一盏盏小灯围过来。能量芯亮了，信标也亮了。}]}
  - {id: p16, illustration: p16, lines: [{speaker: ren, text: 这趟绕路，倒给咱们添了个帮手。}]}
chapters:
  - {id: ch01, title: 风暴前直飞, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 救援的代价, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: ch03, title: 许多小灯, page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 什么事让他们离开了直飞航线？, answer: 他们发现一架受困的邮政滑翔机。, page_refs: [p04, p05]}
  - {id: q02, type: character-motive, speaker: narrator, prompt: 莉娅明知燃料不够，为什么还要救人？, answer: 她觉得不能为了送灯，就把眼前遇险的人丢下。, page_refs: [p06, p07]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 装上能量芯以后，滑翔机发生了什么变化？, answer: 滑翔机重新有了动力，能和飞艇一起穿过云缝。, page_refs: [p10, p11, p12]}
  - {id: q04, type: evidence, speaker: narrator, prompt: 聚落里的人怎样帮忙点亮信标？, answer: 大家拿来小灯，为能量芯补充了光。, page_refs: [p14, p15]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: 任为什么会说“绕路添了个帮手”？, answer: 被救的滑翔机后来和他们一起完成了送灯任务。, page_refs: [p12, p16]}
