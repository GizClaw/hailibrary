        - id: p05-b03
          speaker: narrator
          text: 平行痕迹让冰的解释有了根据，却没有说明冰到底多厚，也没有证明石头曾离开湖底。旧痕迹只能显示运动方向，无法保存当时冰面的样子。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 后来，夏普和凯里用围桩试验检验简单的厚冰模型。他们在几块石头周围打下一圈钢筋桩，想挡住可能存在的整片冰。
        - id: p06-b02
          speaker: narrator
          text: 接下来的冬天，一块石头越过围桩，另一块仍留在里面。如果这些石头牢牢冻在同一张冰面中，这个结果就很难解释。
        - id: p06-b03
          speaker: narrator
          text: 由于移动仍没人看见，当时的冰也可能已经破裂、融化，或从较低的石头上方越过。
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          text: 一九五五年，斯坦利记录了相距很远却一同转弯的石头路线。一九九五年，里德等人的研究还发现，最远相隔约八百三十米的石头也会留下平行路线。
        - id: p07-b02
          speaker: narrator
          text: 第二年，研究者用精确定位技术绘制一百六十二块石头及其路线，又发现不少方向偏差。这些偏差说明石头常会各自移动。
        - id: p07-b03
          speaker: narrator
          text: 新的解释必须兼顾两种现象：远处的石头为何同步转弯，近处的石头又为何走出不同路线？
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: 难点渐渐集中在“什么时候测量”。痕迹和地图都来自事后，拖动试验又是人为安排的条件。
        - id: p08-b02
          speaker: narrator
          text: 真正的移动十分少见，石头可能几年都不动。雨雪要先形成浅水，夜里还要足够冷，白天的风与阳光也得恰好接上。
        - id: p08-b03
          speaker: narrator
          text: 即使条件齐全，移动也可能只持续几分钟。研究者若想看到过程，就需要能在荒凉湖床上长期等待的仪器。
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: 二〇一一年冬天，一支团队得到国家公园许可，开始布置观测。为了保护当地石头，他们从别处带来相似的石灰岩，在十五块石头内部装入全球定位系统记录器。
        - id: p09-b02
          speaker: narrator
          text: 石头一离开埋在泥中的磁性开关，记录器就会连续记下位置。湖边还有气象站，远处架起几台相机。
        - id: p09-b03
          speaker: narrator
          text: 位置、时间、风、温度、雨水和图像从此可以互相对照。
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          content:
            - text: "相机采用"
            - vocabulary: {id: time-lapse-photography, text: 延时摄影}
            - text: "，每隔一段时间拍下一张照片，让人回头比较缓慢变化。"
        - id: p10-b02
          speaker: narrator
          text: 每年十一月至第二年三月，它们每小时记录一次湖床状况。气象站则每秒测风，还记录温度、阳光和降雨。研究者一年去五到八次，更换电池并取回资料。
        - id: p10-b03
          speaker: narrator
          text: 他们本来以为要等五年甚至十年。即使某个冬天没有石头移动，资料也能指出那一季缺少哪项条件。
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: 等到两年后的冬天，关键的天气终于出现。二〇一三年十一月下旬，一场冬季风暴带来雨雪，南部湖床形成浅水池。
        - id: p11-b02
          speaker: narrator
          text: 许多夜晚气温降到冰点以下，水面反复结冰。以往有些雪天没有留下足够积水，有次长时间积水又很少结冰。
        - id: p11-b03
          speaker: narrator
          text: 这回，水池持续了两个多月，结冰条件也反复出现，而仪器已经就位。
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: 寒夜之后，薄冰盖住浅水。第二天临近中午，阳光使冰面开始融化，石头周围先露出水。
        - id: p12-b02
          speaker: narrator
          text: 完整冰面裂成几十米宽的浮冰板，南风推动冰板和水向北，移向水池较浅的缓坡边缘。途中，冰板碰到仍压在湖底的石头，把力量传给它们。
        - id: p12-b03
          speaker: narrator
          text: 北岸水浅，深色泥地吸收热量，那里的冰可能先融化，为浮冰板腾出移动空间。
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: 装有记录器的石头在二〇一三年十二月四日和二十日移动了。十二月四日，两块相距约一百五十三米的石头在六秒内先后起步，各自走了十六分钟。
        - id: p13-b02
          speaker: narrator
          text: 二十日，另一块石头移动了十二分多钟。整个水池存在期间，有些仪器石头经过多次移动，累计最远约二百二十四米。
        - id: p13-b03
          speaker: narrator
          text: 定位数据给出了时间、路线和速度，却还不能单独说明碰到石头的是什么。
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: 十二月二十日至二十一日，以及二〇一四年一月九日，研究者恰好守在湖边。他们听见薄冰轻轻爆裂，看见石头在浑水下缓慢滑行。
        - id: p14-b02
          speaker: narrator
          text: 一月九日，一组连续照片记录下一块石头约十八秒的移动；迎着水流的一侧堆着碎冰。旁边不动的石头成了参照，人眼才辨认出那一点点位移。
        - id: p14-b03
          speaker: narrator
          text: 现场观察、新痕迹、天气资料、照片和定位记录终于能相互印证。
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          content:
            - text: "研究者直接观察到一种"
            - vocabulary: {id: mechanism, text: 机制}
            - text: "：三到六毫米厚的浮冰板抵住石块，推动它沿着湖底滑行。冰层太薄，无法把大石头浮离泥地。"
        - id: p15-b02
          speaker: narrator
          text: 石块始终贴着水下的饱和湿泥，风和流水则带动冰板。湿泥降低石头下方的阻力。
        - id: p15-b03
          speaker: narrator
          text: 几块碎冰在迎风面叠起时，还能把更大范围受到的力量传给石头。这些观察修正了厚冰托起石头的旧模型。
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: 仪器石头的速度通常是每分钟二到五米，记录到的移动最长为十六分钟。其中一次移动由一组连续照片记录，前后只有约十八秒。站在坚硬地面上远望时，如果视野里没有固定参照物，人很难察觉这样的速度。
        - id: p16-b02
          speaker: narrator
          text: 浑水和薄冰还会挡住新痕迹，直到风把水推开，泥上的路线才显出来。
        - id: p16-b03
          speaker: narrator
          text: 湖床潮湿时，游客应留在干地上，也不要搬动石头，以免破坏脆弱的泥面和路线。
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: 会破裂的薄冰还解释了看似矛盾的路线。大冰板可以让许多石头朝相近方向前进。
        - id: p17-b02
          speaker: narrator
          text: 已有的裂缝或一根钢筋桩，都可能把移动的冰板分开；水的深浅则会改变冰板碰到哪些石头。冰会越过一块低石，却抵住旁边较高的石头。于是，两块石头能同时出发，又在不同地方停下。
        - id: p17-b03
          speaker: narrator
          text: 围桩里没动的那块石头也许正说明冰在途中碎了，不能用来否定所有冰的作用。
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: 旧研究留下了几条重要线索。强风试验估计了空气直接推动石头所需的力量。路线研究既记录了共同运动，也记录了各自运动。
        - id: p18-b02
          speaker: narrator
          text: 早期冰模型则把冬季冰面与平行路线联系起来。
        - id: p18-b03
          speaker: narrator
          text: 二〇一三至二〇一四年的观察进一步明确了过程。轻风带动浅水和薄浮冰，冰板再把仍贴在湿泥上的石头向前推。
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: 这项研究也有明确限制。团队只在一个形成水池的冬季直接观察到这种过程，也只有部分装有仪器的石头留下了完整数据。
        - id: p19-b02
          speaker: narrator
          text: 最大的天然石块没有在他们眼前移动，几十年前的每一道旧痕迹也无法重演。薄冰机制很有力地解释了那一季的事件和许多相似路线。
        - id: p19-b03
          speaker: narrator
          text: 现有证据还不能证明所有年代、所有石头都以完全相同的方式移动。
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: 水池在二〇一四年二月干了，新路线留在更旧的痕迹旁。它们外形相似，但这次，仪器石头的路线可以同逐秒风速、定位记录和延时图像一一对照。
        - id: p20-b02
          speaker: narrator
          text: 研究者还亲眼看见碎冰怎样抵住石头。
        - id: p20-b03
          speaker: narrator
          text: 对这些新路线，人们已经知道它们何时形成，也知道当时的水和冰怎样移动。
