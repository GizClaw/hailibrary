schema_version: 2
language: zh-CN
writer: 星火
title: 会走路的石头
summary: >-
  跑马场干湖上的石头留下长长痕迹，却多年没人见过它们移动。风、水和冰的不同解释各有证据，也各有缺口。二〇一三至二〇一四年的仪器记录和现场观察记录了薄冰推动石头的过程，也说明这项结论适用于哪些现象。
chapters:
  - id: ch01
    title: 泥地留下的问题
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 证据为什么不够
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: 石头移动的冬天
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: 证据支持的范围
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: main-idea
    speaker: narrator
    prompt: 为什么石头痕迹能证明发生过移动，却不能独自说明原因？
    answer: 痕迹保存了石头换过位置的结果，却没有保存移动时间、现场条件和推动石头的力量。
    page_refs: [p01, p02]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 强风解释和早期冰面解释分别依据了什么证据？
    answer: 强气流试验证明湿泥上的石头可以被直接推动，相似路线则说明大片冰面也许能同时影响多块石头。
    page_refs: [p04, p05]
  - id: q03
    type: evidence
    speaker: narrator
    prompt: 新解释需要同时说明哪两类路线现象？
    answer: 早期研究发现相距很远的石头会留下同步转弯的路线，一九九六年的定位地图则发现路线偏差，说明石头也会各自移动。
    page_refs: [p05, p07]
  - id: q04
    type: source-analysis
    speaker: narrator
    prompt: 与只看旧痕迹相比，二〇一一年布置的仪器为什么能提供更直接的来源证据？
    answer: 仪器能把石头的位置和时间与同一事件中的风、温度、水、冰和照片互相对照。
    page_refs: [p08, p09, p10]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: 研究者看到的浮冰板按什么顺序形成并开始移动？
    answer: 浅水先在寒夜结冰，第二天阳光使冰融化破裂，随后轻风和流水推动浮冰板。
    page_refs: [p11, p12]
  - id: q06
    type: evidence
    speaker: narrator
    prompt: 现场观察为定位记录补上了什么信息？
    answer: 定位记录给出时间、路线和速度，现场观察与照片则显示薄薄的碎冰正在抵住并推动石头。
    page_refs: [p13, p14]
  - id: q07
    type: compare
    speaker: narrator
    prompt: 实际观察到的薄冰机制与早期厚冰模型有什么不同？
    answer: 薄冰板推动仍贴在湖底的石头，并没有把石头冻住后托离泥地。
    page_refs: [p15, p17]
  - id: q08
    type: evaluate
    speaker: narrator
    prompt: “薄冰有力地解释了研究者观察到的事件”和“所有石头一直都由薄冰推动”，哪一句更可靠？为什么？
    answer: 第一句更可靠，因为研究只直接观察了一个形成水池的冬季，只有部分仪器石头留下完整资料，最大的天然石块也没有被看到移动。
    page_refs: [p18, p19]
  - id: q09
    type: synthesis
    speaker: narrator
    prompt: 研究结束后，同样一条泥地痕迹为什么有了不同意义？
    answer: 它不再只是事后的线索，还能与逐秒风速、定位路线、延时图像和现场观察互相印证。
    page_refs: [p01, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            美国死亡谷国家公园深处，有一片跑马场干湖。浅色湖床上散着许多石头，石后却拖着长长的痕迹。有的笔直，有的转了弯，仿佛石头曾经自己出发。几十年间，研究者一次次赶到这里，却总在移动结束后才看见结果。痕迹证明石头换过位置，却没有留下最关键的一幕：是谁在什么时候推了它们？
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            这片干湖床四周是山。岩石从山坡落下，来到几乎水平的湖底。大多数时候，地面又硬又干；少数雨雪天气过后，低处才会积起一层浅水。水很快蒸发，湿泥重新变硬，一条新痕迹却能保存很久。后来到访的人只能看见干泥上的路线，很难知道石头移动时的水面、冰层和风力是什么情况。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "二十世纪四十年代起，这些痕迹引出好几种"
            - vocabulary: {id: hypothesis, text: 假说}
            - text: >-
                。所谓假说，是可以用证据检验的暂时解释。许多路线大致顺着可能的风向，所以有人把风当作主角；当地面湿滑时，石头更容易被推动，水也不能缺席。可是，风是直接吹动石头，还是先推动冰和水？同一条痕迹可以支持几种解释。仅凭“说得通”，还不能判断哪一种更接近实际情况。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            为了检验强风解释，有人让飞机螺旋桨吹出的气流扫过湿泥。自然石块确实动了，但风速超过了每秒二十米。另一些拖动试验和计算还得出了更高的数值。这些研究说明，强风可能直接推动湿泥上的石头。至于跑马场干湖的旧痕迹是否由这种强风造成，还需要石头移动时的气象记录。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: >-
                另一批研究者注意到，相距很远的石头有时会留下相似路线。他们猜想，大片冰面也许能同时带动多块石头。有些模型认为，石头冻进厚冰后被稍稍托起，泥地造成的
            - vocabulary: {id: friction, text: 摩擦力}
            - text: >-
                便会减小。平行痕迹让冰的解释有了根据，却没有说明冰到底多厚，也没有证明石头曾离开湖底。旧痕迹只能显示运动方向，无法保存当时冰面的样子。
    - id: p06
      illustration: p06
      paragraphs:
        - text: >-
            后来，夏普和凯里用围桩试验检验简单的厚冰模型。他们在几块石头周围打下一圈钢筋桩，想挡住可能存在的整片冰。接下来的冬天，一块石头越过围桩，另一块仍留在里面。如果这些石头牢牢冻在同一张冰面中，这个结果就很难解释。由于移动仍没人看见，当时的冰也可能已经破裂、融化，或从较低的石头上方越过。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            一九五五年，斯坦利记录了相距很远却一同转弯的石头路线。一九九五年，里德等人的研究还发现，最远相隔约八百三十米的石头也会留下平行路线。第二年，研究者用精确定位技术绘制一百六十二块石头及其路线，又发现不少方向偏差。这些偏差说明石头常会各自移动。新的解释必须兼顾两种现象：远处的石头为何同步转弯，近处的石头又为何走出不同路线？
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            难点渐渐集中在“什么时候测量”。痕迹和地图都来自事后，拖动试验又是人为安排的条件。真正的移动十分少见，石头可能几年都不动。雨雪要先形成浅水，夜里还要足够冷，白天的风与阳光也得恰好接上。即使条件齐全，移动也可能只持续几分钟。研究者若想看到过程，就需要能在荒凉湖床上长期等待的仪器。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            二〇一一年冬天，一支团队得到国家公园许可，开始布置观测。为了保护当地石头，他们从别处带来相似的石灰岩，在十五块石头内部装入全球定位系统记录器。石头一离开埋在泥中的磁性开关，记录器就会连续记下位置。湖边还有气象站，远处架起几台相机。位置、时间、风、温度、雨水和图像从此可以互相对照。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "相机采用"
            - vocabulary: {id: time-lapse-photography, text: 延时摄影}
            - text: >-
                ，每隔一段时间拍下一张照片，让人回头比较缓慢变化。每年十一月至第二年三月，它们每小时记录一次湖床状况。气象站则每秒测风，还记录温度、阳光和降雨。研究者一年去五到八次，更换电池并取回资料。他们本来以为要等五年甚至十年。即使某个冬天没有石头移动，资料也能指出那一季缺少哪项条件。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            等到两年后的冬天，关键的天气终于出现。二〇一三年十一月下旬，一场冬季风暴带来雨雪，南部湖床形成浅水池。许多夜晚气温降到冰点以下，水面反复结冰。以往有些雪天没有留下足够积水，有次长时间积水又很少结冰。这回，水池持续了两个多月，结冰条件也反复出现，而仪器已经就位。
    - id: p12
      illustration: p12
      paragraphs:
        - text: >-
            寒夜之后，薄冰盖住浅水。第二天临近中午，阳光使冰面开始融化，石头周围先露出水。完整冰面裂成几十米宽的浮冰板，南风推动冰板和水向北，移向水池较浅的缓坡边缘。途中，冰板碰到仍压在湖底的石头，把力量传给它们。北岸水浅，深色泥地吸收热量，那里的冰可能先融化，为浮冰板腾出移动空间。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            装有记录器的石头在二〇一三年十二月四日和二十日移动了。十二月四日，两块相距约一百五十三米的石头在六秒内先后起步，各自走了十六分钟。二十日，另一块石头移动了十二分多钟。整个水池存在期间，有些仪器石头经过多次移动，累计最远约二百二十四米。定位数据给出了时间、路线和速度，却还不能单独说明碰到石头的是什么。
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            十二月二十日至二十一日，以及二〇一四年一月九日，研究者恰好守在湖边。他们听见薄冰轻轻爆裂，看见石头在浑水下缓慢滑行。一月九日，一组连续照片记录下一块石头约十八秒的移动；迎着水流的一侧堆着碎冰。旁边不动的石头成了参照，人眼才辨认出那一点点位移。现场观察、新痕迹、天气资料、照片和定位记录终于能相互印证。
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: "研究者直接观察到一种"
            - vocabulary: {id: mechanism, text: 机制}
            - text: >-
                ：三到六毫米厚的浮冰板抵住石块，推动它沿着湖底滑行。冰层太薄，无法把大石头浮离泥地。石块始终贴着水下的饱和湿泥，风和流水则带动冰板。湿泥降低石头下方的阻力；几块碎冰在迎风面叠起时，还能把更大范围受到的力量传给石头。这些观察修正了厚冰托起石头的旧模型。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            仪器石头的速度通常是每分钟二到五米，记录到的移动最长为十六分钟。其中一次移动由一组连续照片记录，前后只有约十八秒。站在坚硬地面上远望时，如果视野里没有固定参照物，人很难察觉这样的速度。浑水和薄冰还会挡住新痕迹，直到风把水推开，泥上的路线才显出来。湖床潮湿时，游客应留在干地上，也不要搬动石头，以免破坏脆弱的泥面和路线。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            会破裂的薄冰还解释了看似矛盾的路线。大冰板可以让许多石头朝相近方向前进。已有的裂缝或一根钢筋桩，都可能把移动的冰板分开；水的深浅则会改变冰板碰到哪些石头。冰会越过一块低石，却抵住旁边较高的石头。于是，两块石头能同时出发，又在不同地方停下。围桩里没动的那块石头也许正说明冰在途中碎了，不能用来否定所有冰的作用。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            旧研究留下了几条重要线索。强风试验估计了空气直接推动石头所需的力量。路线研究既记录了共同运动，也记录了各自运动。早期冰模型则把冬季冰面与平行路线联系起来。二〇一三至二〇一四年的观察进一步明确了过程。轻风带动浅水和薄浮冰，冰板再把仍贴在湿泥上的石头向前推。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            这项研究也有明确限制。团队只在一个形成水池的冬季直接观察到这种过程，也只有部分装有仪器的石头留下了完整数据。最大的天然石块没有在他们眼前移动，几十年前的每一道旧痕迹也无法重演。因此，薄冰机制很有力地解释了那一季的事件和许多相似路线。现有证据还不能证明所有年代、所有石头都以完全相同的方式移动。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            水池在二〇一四年二月干了，新路线留在更旧的痕迹旁。它们外形相似，但这次，仪器石头的路线可以同逐秒风速、定位记录和延时图像一一对照。研究者还亲眼看见碎冰怎样抵住石头。对这些新路线，人们已经知道它们何时形成，也知道当时的水和冰怎样移动。
