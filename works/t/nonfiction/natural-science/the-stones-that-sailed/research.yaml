sources:
  - url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0105948
    publisher: PLOS ONE
    claims:
      - Norris and colleagues published the primary 2014 study reporting the first direct scientific observations of rocks moving at Racetrack Playa.
      - Earlier proposed mechanisms included strong wind on wet mud, algal films, and ice models; trail and enclosure evidence had supported and challenged different versions.
      - An aircraft-propeller test moved natural rocks only above twenty meters per second, while towing tests and calculations produced still higher wind requirements; these trials established possibility under arranged conditions rather than the cause of a particular old trail.
      - Stanley's 1955 study and Reid et al.'s 1995 observations used nearly identical distant tracks as evidence for shared motion; Reid et al. documented parallel movements between rocks up to 830 meters apart.
      - Sharp and Carey's corral experiment used steel reinforcing rods around several stones and produced a counterexample in which one rock moved out while another stayed inside.
      - The study used a weather station, time-lapse cameras, and fifteen GPS-instrumented limestone rocks installed under National Park Service permits.
      - The team visited five to eight times per year; cameras recorded hourly from November through March, the weather station sampled wind each second, and GPS loggers switched to continuous one-second recording after moving away from buried magnetic triggers.
      - Flooding damaged some instrument packages, so only three GPS rocks fully recorded their initial positions and velocities even though other rocks left new start-to-end trails.
      - Instrumented rocks moved in December 2013, and direct observations were made in December 2013 and January 2014 during the same pond season.
      - Two rocks about 153 meters apart began within six seconds and moved for sixteen minutes on December 4; another moved for 12.3 minutes on December 20, and one photographed January 9 movement lasted about eighteen seconds.
      - The winter storm, repeated freezing, and long-lived shallow pond contrasted with earlier snowy but unflooded periods and an earlier flooded period with little freezing; the 2013–2014 pond dried by the second week of February.
      - Observed motion occurred after freezing nights, as sun broke thin ice into floating panels that light wind and flowing water drove against rocks resting on saturated mud.
      - During the December 20 event, light southerly wind transferred pond water and ice northward toward the low-gradient, upslope northern shore.
      - The observed ice was about three to six millimeters thick, the rocks moved roughly two to five meters per minute for up to sixteen minutes, and some instrumented rocks traveled up to 224 meters across multiple events.
      - The shallow northern pond edge likely lost its ice first as sunlight warmed the water over dark mud, creating open water into which floating panels could move.
      - Thin ice could break, pile up, pass over low rocks, or engage taller rocks, explaining both related trails and different behavior among nearby stones.
      - The observations did not include movement of the largest natural stones and do not establish that every historical trail formed by precisely the same process.
  - url: https://scripps.ucsd.edu/news/mystery-solved-sailing-stones-death-valley-seen-action-first-time
    publisher: Scripps Institution of Oceanography, University of California San Diego
    claims:
      - The field experiment began in winter 2011, and researchers used similar imported rocks because the National Park Service did not permit drilling into native rocks.
      - The rare sequence required shallow standing water, freezing nights, morning sun, floating ice, and light wind.
      - Researchers expected to wait five or ten years but encountered the moving-rock conditions in December 2013.
      - Slow motion, short events, moving reference points, and water over the trails help explain why casual observers could miss the movement.
      - The team explicitly noted that it had not observed the largest rocks moving and left that question open.
  - url: https://www.usgs.gov/publications/terrain-analysis-racetrack-basin-and-sliding-rocks-death-valley
    publisher: United States Geological Survey Publications Warehouse
    claims:
      - A 2000 study described a half-century debate and a 1996 differential-GPS map of 162 rocks and associated trails.
      - The 1996 mapping found broad similarities as well as trail deviations that suggested individual rocks often moved independently, while leaving the overall causal mechanism unresolved.
      - Follow-up surveys showed that stone movement was episodic rather than continuous.
  - url: https://www.nps.gov/deva/planyourvisit/the-racetrack.htm
    publisher: United States National Park Service, Death Valley National Park
    claims:
      - Racetrack Playa is a remote dry lakebed surrounded by mountains and is known for rocks that leave trails across its level surface.
      - Rocks reach the playa floor from the surrounding mountains, and the tracks remain as records of movement.
      - Access is remote, off-road driving is prohibited, visitors should avoid muddy areas when the playa is wet, and rocks must not be moved or removed.
  - url: https://www.nps.gov/deva/learn/management/special-use-permits-sup.htm
    publisher: United States National Park Service, Death Valley National Park
    claims:
      - Walking on soft playa areas after rain can leave lasting damage, supporting the story's decision not to encourage close approach during wet conditions.
notes: >-
  The article distinguishes evidence that a mechanism is physically possible from evidence that it occurred during a documented Racetrack event. The primary study directly supports the 2013–2014 conditions and observations. Older hypotheses are described as competing, partly supported models rather than foolish guesses. The conclusion is deliberately bounded: thin floating ice strongly explains the observed winter events and many similar tracks, but the study did not witness every historical movement or the largest natural stones.
