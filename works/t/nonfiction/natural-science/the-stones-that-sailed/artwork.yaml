schema_version: 1
style: naturalistic-storybook
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  racetrack-playa: A broad nearly level beige clay lakebed enclosed by the dark Cottonwood and Last Chance mountain ranges, with the Grandstand-like rocky outcrop distant toward the north and no roads, signs, or buildings visible.
  stones: Irregular tan, gray, and brown dolomite and granite stones resting upright on the playa, with believable scale and shallow grooves rather than rolling tracks.
  instrument-rocks: Natural-looking pale limestone blocks with a small flush dark circular logger cap in the top, never labeled and never shown as native stones being drilled.
  field-equipment: Unbranded weather station, blank-faced sensors, and compact cameras on plain metal tripods; no screens, labels, digits, or writing visible.
  winter-water: Shallow muddy water only a few centimeters deep, clear-edged thin ice panels, and saturated beige mud; stones remain on the bottom rather than floating.
  palette: Mineral beige, muted ocher, slate gray, cold blue, pale winter gold, and restrained rust, with physically plausible desert daylight.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: A wordless winter panorama of Racetrack Playa where broad translucent thin-ice panels press gently against several grounded stones in shallow water, while newly exposed winding trails lead across wet beige mud toward the distant mountains.
  - id: p01
    file: artwork/p01.webp
    scene: A dry, empty Racetrack Playa at low morning light, with several irregular stones at the ends of long straight and bending tracks and no moving object or person visible.
  - id: p02
    file: artwork/p02.webp
    scene: A high wide view of the mountain-ringed playa after rare weather, with most hard beige mud dry and a shallow reflective pond occupying the lower basin.
  - id: p03
    file: artwork/p03.webp
    scene: One grounded stone on wet clay surrounded by three plausible natural forces in the same unsettled field scene—windblown dust, shallow water, and a thin margin of ice—without visually selecting a winner.
  - id: p04
    file: artwork/p04.webp
    scene: A historically plausible unmarked mid-century propeller aircraft held stationary near wet playa mud, its propeller wash moving a small test stone while larger stones remain still, with no people or readable markings.
  - id: p05
    file: artwork/p05.webp
    scene: Several distant stones with strikingly parallel tracks across damp mud, while a broad natural ice sheet occupies the foreground without lifting any stone, presenting the visual clue behind early ice models.
  - id: p06
    file: artwork/p06.webp
    scene: A circle of thin, ribbed steel reinforcing rods surrounds one grounded stone while a fresh track passes between the rods to another stone outside, with broken thin ice nearby.
  - id: p07
    file: artwork/p07.webp
    scene: An unbranded survey tripod and prism stand among many mapped-looking stone trails that agree in some turns and diverge in others, with no map labels or people visible.
  - id: p08
    file: artwork/p08.webp
    scene: A vast empty playa under changing winter clouds, old trails in the foreground but no motion, emphasizing the long unobserved wait and the scale of the field site.
  - id: p09
    file: artwork/p09.webp
    scene: Many of the fifteen instrumented limestone rocks are arranged across the southeastern playa near an unbranded weather station and several compact tripod cameras, all equipment blank and text-free.
  - id: p10
    file: artwork/p10.webp
    scene: A close unbranded time-lapse camera and weather station patiently facing an unchanged dry playa through cold angled light, with fresh battery packs in a plain open case and no text.
  - id: p11
    file: artwork/p11.webp
    scene: Racetrack Playa after a late-2013 winter storm, a shallow pond spreading across the southern basin beneath snow-dusted mountains and clearing clouds.
  - id: p12
    file: artwork/p12.webp
    scene: Late-morning sun on a shallow frozen pond as a continuous thin clear sheet melts around grounded stones and separates into wide floating panels under a light breeze.
  - id: p13
    file: artwork/p13.webp
    scene: Two distant instrumented limestone rocks beginning related slow movements beneath shallow water, their small blank logger caps visible and narrow grooves forming in saturated mud.
  - id: p14
    file: artwork/p14.webp
    scene: A tripod camera records a grounded stone creeping through shallow water as broken ice gathers on its upstream face and stationary stones provide clear visual reference points.
  - id: p15
    file: artwork/p15.webp
    scene: A close water-level view of several millimeter-thin translucent ice panels pressing against the side of a stone that remains grounded in soft saturated mud, with no suggestion of lifting.
  - id: p16
    file: artwork/p16.webp
    scene: A quiet wide view of barely moving stones under rippled shallow water and thin ice, with one fixed stone sharp in the foreground and a fresh submerged trail only partly visible.
  - id: p17
    file: artwork/p17.webp
    scene: A large thin ice panel has fractured around a narrow ribbed steel reinforcing rod and passed over a low stone while broken edges press against a taller neighboring stone, explaining different nearby paths.
  - id: p18
    file: artwork/p18.webp
    scene: A coherent wordless field still life of a wind sensor, survey prism, thin ice sample, wet-mud stone track, and blank data logger, each connected by the same desert light rather than diagram symbols.
  - id: p19
    file: artwork/p19.webp
    scene: A small instrumented limestone rock with a fresh trail rests near a much larger untouched natural boulder, making the observed evidence and its scale limit visible without labels.
  - id: p20
    file: artwork/p20.webp
    scene: The pond has dried under clear February light; fresh tracks cross older tracks toward silent blank instruments at the playa edge, preserving the once-missing moment without people or text.
