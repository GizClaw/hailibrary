schema_version: 1
style: cut-paper-collage
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  mira: A fifteen-year-old girl with medium-brown skin, oval face, chin-length curly black bob, mustard-yellow rain jacket, deep-teal sweater, plum trousers, dark ankle boots, and coral-red field satchel.
  tessa: An older woman with warm-brown skin, long silver braid, round glasses, navy coat, berry-red dress, and tan walking shoes.
  visitor: A young boy with tan skin, short dark hair, sky-blue sweatshirt, charcoal shorts, and a leaf-green backpack without markings.
  island: Bellweather Island has a slate-blue sea, ochre-and-gray cliffs, dark evergreen shrubs, a west tidal cove, a broken northern rock shelf, and an inland white cylindrical lighthouse with a brick-red conical roof.
  maps: Two cream handmade-paper island maps show the same central ridge, spring, harbor wall, and winding road but have different wordless coastline shapes and lighthouse positions; no writing, letters, numbers, compass labels, or symbols.
  palette: Slate blue, sea green, ochre, cream, mustard yellow, deep teal, plum, coral red, navy, berry red, white, and brick red.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mira and Tessa stand at a museum table over two overlapping wordless paper maps of one island, with two different coastline cutouts and old and new lighthouse positions suggested by plain miniature shapes.
  - id: p01
    file: artwork/p01.webp
    scene: In a warm island museum archive, Mira opens a shallow flat drawer as Tessa reveals a second cream paper map beneath the first, while an empty glass exhibit case waits nearby.
  - id: p02
    file: artwork/p02.webp
    scene: Mira frowns over the two contradictory wordless maps and holds a blank dark exhibit card, while Tessa watches with one calm raised eyebrow.
  - id: p03
    file: artwork/p03.webp
    scene: Overhead view of the two maps showing three large visual differences—the west cove, northern rock shelf, and lighthouse position—while the same ridge, spring pool, harbor wall, and stone steps align.
  - id: p04
    file: artwork/p04.webp
    scene: Mira aligns translucent paper copies with three plain brass pins through matching fixed landmarks; the pinholes and winding uphill road overlap closely.
  - id: p05
    file: artwork/p05.webp
    scene: Mira and Tessa pack map copies, a camera without markings, coiled measuring cord, and a round blank-faced tide clock into the coral field satchel before leaving the archive.
  - id: p06
    file: artwork/p06.webp
    scene: At low tide in the west cove, Mira measures a wide exposed floor of hard sand and dark pools from the marked public path while Tessa records the observation on a blank card.
  - id: p07
    file: artwork/p07.webp
    scene: From safe high stone steps after lunch, Mira and Tessa watch returning water cover the sand flat and reach a dark band of stones near the hill.
  - id: p08
    file: artwork/p08.webp
    scene: Mira kneels beside a low circular foundation of fitted stone with rust-stained bolt holes around its empty center and red roof-tile chips, while the present white lighthouse stands farther inland on the hill.
  - id: p09
    file: artwork/p09.webp
    scene: Back in the archive, three wordless photographs show the lighthouse first by the sea, then its intact stone tower braced on heavy timbers with the lantern room removed, and finally the same tower on a new inland foundation with the lantern room reattached.
  - id: p10
    file: artwork/p10.webp
    scene: Behind a sturdy safety fence at the northern overlook, Mira and Tessa study a long seam in the cliff and angular matching rock blocks in the water below.
  - id: p11
    file: artwork/p11.webp
    scene: Four wordless archive photographs laid in sequence show a northern rock shelf intact, then cracked, then partly gone after a storm, and finally matching the shorter modern point.
  - id: p12
    file: artwork/p12.webp
    scene: Mira arranges one continuous torn-paper coastal model whose intact, cracked, and shortened cliff sections stand above layered waves and fallen angular rock pieces.
  - id: p13
    file: artwork/p13.webp
    scene: Mira reads aloud from Ward's completely blank-looking cream job sheet beside his high-water route map, with safe upland paths and the ridge spring emphasized only through colored paper shapes.
  - id: p14
    file: artwork/p14.webp
    scene: Mira reads Reed's completely blank-looking pale-blue job sheet beside the low-tide harbor map, with a foot-and-cart crossing over exposed sand and a separate boat approach on the harbor side emphasized through wordless layered shapes.
  - id: p15
    file: artwork/p15.webp
    scene: On a glowing museum light table, the two maps overlap at fixed landmarks while blue tide edges, a broken northern shelf, and two lighthouse positions remain visibly distinct.
  - id: p16
    file: artwork/p16.webp
    scene: Mira checks Ward's map against small physical models of the spring, harbor wall, high-water stones, and old lighthouse base, then places a plain question token beside one unexplained path.
  - id: p17
    file: artwork/p17.webp
    scene: Mira points to a plain red marker on the newer island map while the older map remains visible below it and the real relocated lighthouse stands inland beyond the archive window.
  - id: p18
    file: artwork/p18.webp
    scene: Mira builds a clear layered exhibit with fixed island landmarks, two blue tide boundaries, a torn gray former rock shelf, and small old and new lighthouse shapes, all entirely wordless.
  - id: p19
    file: artwork/p19.webp
    scene: Tessa reads blank exhibit cards aloud while Mira checks them against maps and photographs, and a discarded blank dark card rests in a recycling box.
  - id: p20
    file: artwork/p20.webp
    scene: On opening day, Mira gives a young visitor a combined transparent route map as the tide rises outside; both old maps remain visible side by side in the exhibit case.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - cover and all 20 page WebP files inspected at local pixels
      - no visible letters numbers signs captions speech bubbles logos or watermarks
      - Mira Tessa and visitor identities and clothing checked for continuity
      - map lighthouse shoreline evidence scenes and safe observation behavior checked
