schema_version: 1
id: two-maps-of-one-island
type: [reading, illustrated-short-story]
style: cut-paper-collage
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [mystery, nature]
  themes: [curiosity, discovery, problem-solving, responsibility]
  moods: [mysterious, reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close third-person narrator who follows Mira's investigation and distinguishes observation from judgment.
    voice_identity: attentive, exact, and quietly suspenseful
  - id: mira
    kind: character
    description: A fifteen-year-old museum volunteer who is building an island-map exhibit and learns to test her first judgment.
    visual_identity: A fifteen-year-old girl with medium-brown skin, an oval face, and a chin-length curly black bob; mustard-yellow rain jacket over a deep-teal sweater, plum trousers, dark ankle boots, and a coral-red field satchel.
    voice_identity: quick, curious, candid, and increasingly careful
  - id: tessa
    kind: character
    description: Mira's grandmother and the keeper of the island archive, who asks precise questions without giving away conclusions.
    visual_identity: An older woman with warm-brown skin, a long silver braid, round glasses, and a navy coat over a berry-red dress with tan walking shoes.
    voice_identity: dryly warm, patient, and economical
  - id: visitor
    kind: character
    description: A young museum visitor who needs a practical route to the lighthouse on opening day.
    visual_identity: A young boy with tan skin, short dark hair, a sky-blue sweatshirt, charcoal shorts, and a leaf-green backpack without markings.
    voice_identity: eager, direct, and clear
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Compare two sources made at different times and for different purposes.
    - Revise an initial judgment when a counterexample and later evidence do not fit it.
    - State what evidence supports while preserving uncertainty about what it cannot establish.
  concepts:
    - map purpose and perspective
    - tide-dependent coastlines
    - erosion and change over time
    - source reliability and limits
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
