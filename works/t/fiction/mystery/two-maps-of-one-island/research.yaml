schema_version: 1
required: true
reason: >-
  Bellweather Island, its surveyors, archive, maps, dates, storm, lighthouse move,
  and every character are invented. The plot nevertheless depends on checkable
  facts about tidal shorelines, tidal timing, coastal erosion, and moving a tall
  masonry lighthouse intact, so those mechanisms were independently researched.
sources:
  - url: https://geodesy.noaa.gov/RSD/cmp.shtml
    authority: National Oceanic and Atmospheric Administration, National Geodetic Survey
    supports: >-
      p03, p06-p07, and p18: NOAA nautical-chart shoreline approximates where Mean
      High Water meets the coast, while coastal mapping also provides a separate
      Mean Lower Low Water line. A map can therefore distinguish a usual high-water
      shoreline from the ground exposed toward low water.
    verified_at: 2026-09-13
  - url: https://oceanservice.noaa.gov/education/tutorial_tides/tides05_lunarday.html
    authority: National Oceanic and Atmospheric Administration, National Ocean Service
    supports: >-
      p06-p07 and p20: at most semidiurnal coasts, low water to high water takes
      about six hours and twelve and a half minutes; the lunar day is about fifty
      minutes longer than a solar day, so tide times shift later from day to day.
      Bellweather's tide clock supplies the local prediction for the story date.
    verified_at: 2026-09-13
  - url: https://oceanservice.noaa.gov/education/tutorial_tides/tides01_intro.html
    authority: National Oceanic and Atmospheric Administration, National Ocean Service
    supports: >-
      p06-p07 and p20: tides appear at coastlines as a regular rise and fall of the sea
      surface, with water moving toward shore during a rising tide and away during a
      falling tide. The fictional tide timing and island geometry are not sourced claims.
    verified_at: 2026-09-13
  - url: https://www.usgs.gov/centers/spcmsc/science/storm-induced-coastal-change
    authority: U.S. Geological Survey
    supports: >-
      p10-p12 and p15: storm surge and large waves can erode and reshape coastal
      landscapes, including coastal cliffs. The story therefore names several possible
      forces and does not claim that one storm caused every crack or all of the
      fictional shelf loss.
    verified_at: 2026-09-13
  - url: https://www.nps.gov/caha/learn/historyculture/movingthelighthouse.htm
    authority: U.S. National Park Service
    supports: >-
      p08-p09 and p15: a tall masonry lighthouse can be lifted intact from its old
      foundation, supported on a transport system, moved inland, and installed on
      a new foundation. Cape Hatteras Lighthouse was moved this way in 1999;
      Bellweather's tower, timber supports, lantern-room handling, dates, and
      photographs remain fictional.
    verified_at: 2026-09-13
notes: >-
  These official sources establish only the real-world plausibility and mapping
  concepts used by the mystery. They do not turn Bellweather Island or any of its
  survey records into historical claims, and the local tide clock remains the
  authority for the fictional walk's exact timing.
