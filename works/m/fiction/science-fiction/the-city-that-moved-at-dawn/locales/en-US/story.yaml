schema_version: 2
language: en-US
writer: north-star-map
title: The City That Moved at Dawn
summary: Sen's routing system moves city blocks to save energy, but it sends the market away from the people who use it. Sen and Lu compare efficiency with access, then rebuild the process around public consent and a shared pause control.
chapters:
  - id: ch01
    title: The Efficient Plan
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: A Cost the Model Missed
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
  - id: ch03
    title: Rules People Can Change
    page_refs:
      - p13
      - p14
      - p15
      - p16
      - p17
  - id: ch04
    title: Moving Together
    page_refs:
      - p18
      - p19
      - p20
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Node move the market away from the plaza?
    answer: It selects the arrangement with the lowest energy use and does not count access or public approval.
    page_refs:
      - p03
      - p06
      - p08
      - p09
      - p10
  - id: q02
    type: evidence
    speaker: narrator
    prompt: What evidence shows that the first plan harms access?
    answer: Work stops, people must walk farther, and an older vendor must rest with a heavy basket.
    page_refs:
      - p07
      - p10
      - p11
  - id: q03
    type: compare
    speaker: narrator
    prompt: How do the two market routes compare?
    answer: The short route saves more energy but separates the market from transport; the curved route uses more energy but preserves access.
    page_refs:
      - p09
      - p10
      - p14
      - p18
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Sen disable automatic movement?
    answer: She recognizes that open rails do not equal permission and pauses the system until residents can choose new rules.
    page_refs:
      - p08
      - p12
      - p13
      - p15
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What makes the repaired routing process responsible?
    answer: It compares several needs, requires informed agreement, keeps a pause control available, and waits when approval is missing.
    page_refs:
      - p13
      - p15
      - p16
      - p17
      - p19
      - p20
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: Which needs do residents add to the energy calculation?
    answer: They add shade, walking distance, deliveries, transport access, and accessible paths.
    page_refs:
      - p13
      - p14
      - p18
      - p19
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "At dawn, rounded city blocks begin gliding quietly along broad ground rails. "
            - text: Gardens, homes, and public rooms can trade places as needs and seasons change.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Sen watches a physical model of the moving city. “Node should reduce energy use while keeping every route open,” she tells Lu.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Node projects several colored paths across the model and reports, “Lowest-energy arrangement selected.”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: A home block enters cool morning shade while the public garden receives warm sunlight for its plants. Sen says, “
            - text: The first exchange works.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "The city completes its early moves in an orderly pattern. "
            - text: Sen records the energy lights and smiles at the calm streets below.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Then the crowded market begins sliding away from its plaza. Lu turns to Sen. “Nobody here asked the market to leave.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Vendors steady fruit, tools, and heavy baskets while customers wait on a safe platform. "
            - text: The movement causes no crash, yet trade and daily work stop.
    - id: p08
      illustration: p08
      paragraphs:
        - text: “Your system counted power, but not the people carrying goods,” Lu says. Sen looks at the quiet rail gate. “I treated an open rail as permission to move.”
    - id: p09
      illustration: p09
      paragraphs:
        - text: Node displays a short route and a longer curved route. “Short route uses less power,” it reports.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Sen points to the model's lower energy lights. "
            - text: Lu points to workers carrying goods farther from the transport stop.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: An older vendor rests beside a heavy basket. Lu points toward her. “Node saved some power. She must carry that basket much farther.”
    - id: p12
      illustration: p12
      paragraphs:
        - text: Sen closes the automatic route control. “Until we agree on better rules, Node will not move another block.”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "Residents, vendors, and neighbors arrange colored block models around a wide table. "
            - text: They compare shade, walking distance, deliveries, public transport, and energy together.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "A child places the market model beside the busy transport stop. "
            - text: Vendors add a wide unloading space for carts and baskets.
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: "Lu places a bright "
            - vocabulary:
                id: consent
                text: consent
            - text: " token beside one proposed route. “Before the market moves, vendors must know where it goes and agree. They must also be able to stop it.”"
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: Sen adds a large tactile pause button to Node. “Put this where anyone beside the rail can stop the move.”
    - id: p17
      illustration: p17
      paragraphs:
        - text: Node waits with an amber light while people discuss the next move. At last it reports, “No shared approval detected. Holding position.”
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "The market finally takes the longer curved route. "
            - text: It stays beside transport and uses slightly more energy.
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: Homes settle into shade, gardens face the sun, and the market stays beside transport. People cross the connected paths while deliveries continue.
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: At the next dawn, the market stays still. Node waits beside Sen and Lu. Sen asks, “Shall we call the vendors?” Lu opens the route model. “Yes. We ask them before anything moves.”
