schema_version: 1
language: en-US
writer: north-star-map
title: The Route Under New Snow
summary: Fresh snow hides the evidence behind a route projector's eastern recommendation. Nara, Timo, and Vale compare two paths, test competing explanations, and choose the longer route that fits the entire team and its battery cart.
cast:
  narrator: {display_name: Narrator, tts: {delivery: observant and spacious, timbre: clear adult voice, pace: medium, pitch: medium}}
  nara: {display_name: Nara, tts: {delivery: analytical and calm, timbre: steady young-adult voice, pace: medium, pitch: medium}}
  timo: {display_name: Timo, tts: {delivery: brisk and inventive, timbre: bright young-adult voice, pace: medium-fast, pitch: medium-high}}
  vale: {display_name: Vale, tts: {delivery: deliberate and grounded, timbre: resonant adult voice, pace: medium-slow, pitch: low}}
  ora: {display_name: Ora, tts: {delivery: composed and relieved, timbre: warm adult voice, pace: medium, pitch: medium-low}}
  loom: {display_name: Trail Loom, tts: {delivery: neutral and concise, timbre: soft synthetic voice, pace: medium, pitch: medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "After a night of snow, the ridge relay station falls silent."}, {speaker: narrator, text: "The village can no longer receive weather reports from beyond the mountain."}]}
  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content: [{text: "The Trail Loom projects an eastern "}, {vocabulary: {id: route, text: route}}, {text: " for Nara and Timo."}]
      - {speaker: loom, text: "Eastern path: shortest stored journey."}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Vale studies fresh drifts where trail markers once stood."}, {speaker: vale, text: "The ground changed last night. Old observations may not describe it now."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Timo checks the projector and the battery cart."}, {speaker: timo, text: "The Loom learned from many trips. Its choice deserves a fair test."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Nara finds two blue stakes disappearing beneath an overhanging shelf."}, {speaker: nara, text: "The markers remain, but the path around them may not."}]}
  - {id: p06, illustration: p06, lines: [{speaker: loom, text: "Eastern confidence: high. Many travelers used this path."}, {speaker: narrator, text: "Its evidence comes from pawprints buried under the new snow."}]}
  - {id: p07, illustration: p07, lines: [{speaker: vale, text: "The drifts broke the old path."}, {speaker: timo, text: "Or they only covered it."}, {speaker: narrator, text: "Nara keeps both explanations open."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "From a stable rocky lookout, they compare the short eastern shelf with a broad western ledge."}, {speaker: nara, text: "We need present evidence, not a guess from below."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Low sunlight casts a dark line beneath a thin bridge of snow."}, {speaker: vale, text: "That shadow reveals an open gap."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "A route stake stands beyond the gap."}, {speaker: timo, text: "So the Loom recognized the marker but missed the changed approach."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Nara switches off the eastern projection and places a caution token by its model."}, {speaker: nara, text: "A confident answer can still depend on outdated evidence."}]}
  - {id: p12, illustration: p12, lines: [{speaker: vale, text: "The western shelf is longer, but stone supports it."}, {speaker: narrator, text: "Its broad turns also leave room for the battery cart."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Timo checks the partly drained battery."}, {speaker: timo, text: "The longer path uses more power. We must travel steadily and save the projector."}]}
  - {id: p14, illustration: p14, lines: [{speaker: timo, text: "Vale could go west while we search east."}, {speaker: nara, text: "Splitting up adds another risk. We need one plan for the whole team."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "They dim the Loom and use it only to check nearby junctions."}, {speaker: loom, text: "Local guidance active. Distant recommendation paused."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "Vale leads along the western rock."}, {speaker: narrator, text: "Nara walks beside the cart, while Timo watches its wheels and battery."}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "At a steep bend, everyone slows so the cart stays level."}, {speaker: nara, text: "A useful route must fit the slowest part of the group."}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "Ora waves a silver lantern from the stone relay shelter."}, {speaker: ora, text: "You arrived together. The storm loosened one connection inside."}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "Timo clears frost from the loose relay contact and secures it."}, {speaker: narrator, text: "The signal returns before the wind strengthens again."}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "Snow thickens outside, so all four dogs wait inside the shelter."}, {speaker: vale, text: "Reaching the station does not make every moment safe for travel."}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "After the wind eases, Nara builds wordless models of both paths."}, {speaker: nara, text: "One records the eastern gap. The other records the cart-friendly western ledge."}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "They return together on the broad route."}, {speaker: narrator, text: "The Loom now follows their current observations instead of commanding the journey."}]}
chapters:
  - {id: ch01, title: A Confident Line, page_refs: [p01, p02, p03, p04, p05, p06, p07]}
  - {id: ch02, title: Competing Explanations, page_refs: [p08, p09, p10, p11, p12, p13, p14, p15]}
  - {id: ch03, title: A Route for Everyone, page_refs: [p16, p17, p18, p19, p20, p21, p22]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: "Why does the Loom recommend the eastern path even though it is unsafe now?", answer: "It relies on many earlier trips and a remaining stake, but fresh snow has hidden a new gap in the approach.", page_refs: [p02, p05, p06, p09, p10]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "Which observations support Vale's explanation that the eastern path changed?", answer: "Buried stakes, the overhanging shelf, the shadow under the snow bridge, and the open gap all support it.", page_refs: [p03, p05, p08, p09, p10]}
  - {id: q03, type: compare, speaker: narrator, prompt: "How do the eastern and western routes differ for this journey?", answer: "The east is shorter but has a hidden gap; the west is longer and uses more battery, yet its rock shelf is broad enough for the whole team and cart.", page_refs: [p08, p09, p12, p13, p17]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why does Nara reject Timo's suggestion to split the group?", answer: "She believes separation adds risk and wants one route that works for every traveler and the cart.", page_refs: [p12, p13, p14, p17]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: "What does the team learn about route recommendations?", answer: "Stored guidance is useful, but travelers must compare it with current conditions and practical limits before deciding.", page_refs: [p03, p06, p08, p10, p11, p15, p21, p22]}
  - {id: q06, type: short-answer, speaker: narrator, prompt: "How does the team conserve power without giving up the Loom?", answer: "They dim it and use it only for nearby junctions rather than following its distant recommendation.", page_refs: [p13, p15]}
