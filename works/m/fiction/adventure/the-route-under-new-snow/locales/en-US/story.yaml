questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does the Loom recommend the eastern path even though it is unsafe now?
    answer: It relies on many earlier trips and a remaining stake, but fresh snow has hidden a new gap in the approach.
    page_refs:
      - p02
      - p05
      - p06
      - p09
      - p10
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which observations support Vale's explanation that the eastern path changed?
    answer: Buried stakes, the overhanging shelf, the shadow under the snow bridge, and the open gap all support it.
    page_refs:
      - p03
      - p05
      - p08
      - p09
      - p10
  - id: q03
    type: compare
    speaker: narrator
    prompt: How do the eastern and western routes differ for this journey?
    answer: The east is shorter but has a hidden gap; the west is longer and uses more battery, yet its rock shelf is broad enough for the whole team and cart.
    page_refs:
      - p08
      - p09
      - p12
      - p13
      - p17
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Nara reject Timo's suggestion to split the group?
    answer: She believes separation adds risk and wants one route that works for every traveler and the cart.
    page_refs:
      - p12
      - p13
      - p14
      - p17
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What does the team learn about route recommendations?
    answer: Stored guidance is useful, but travelers must compare it with current conditions and practical limits before deciding.
    page_refs:
      - p03
      - p06
      - p08
      - p10
      - p11
      - p15
      - p21
      - p22
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: How does the team conserve power without giving up the Loom?
    answer: They dim it and use it only for nearby junctions rather than following its distant recommendation.
    page_refs:
      - p13
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "After a night of snow, the ridge relay station falls silent. "
            - text: The village can no longer receive weather reports from beyond the mountain.
    - id: p02
      illustration: p02
      paragraphs:
        - text: "The Trail Loom projects an eastern route for Nara and Timo. Its calm voice reports, “Eastern path: shortest stored journey.”"
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Vale studies fresh drifts where trail markers once stood. “Snow buried the markers last night. The eastern path may have changed too.”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Timo checks the projector and battery cart. “The Loom learned from many trips. Let’s check its choice before we reject it.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Nara finds two blue stakes disappearing beneath an overhanging shelf. Nara says, “
            - text: The markers remain, but the path around them may not.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: "The Loom reports, “Eastern confidence: high. Many travelers used this path.” Those journeys left the pawprints now buried under new snow."
    - id: p07
      illustration: p07
      paragraphs:
        - text: “The drifts broke the old path,” Vale says. “Or they only covered it,” Timo replies. Nara studies the ridge without choosing an explanation yet.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: From a stable rocky lookout, they compare the short eastern shelf with the broad western ledge. Nara says, “From here, we can check both paths.”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Low sunlight casts a dark line beneath a thin bridge of snow. Vale says, “
            - text: That shadow reveals an open gap.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: A route stake stands beyond the gap. Timo says, “
            - text: So the Loom recognized the marker but missed the changed approach.”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: Nara switches off the eastern projection and places a caution token by its model. “The Loom found the stake, but its trip records are buried under new snow.”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Vale says, “
            - text: "The western shelf is longer, but stone supports it.” "
            - text: Its broad turns also leave room for the battery cart.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Timo checks the partly drained battery. Timo says, “
            - text: The longer path uses more power. We must travel steadily and save the projector.”
    - id: p14
      illustration: p14
      paragraphs:
        - text: “Vale could go west while we search east,” Timo suggests. Nara shakes her head. “Splitting up adds another risk. We need one plan for the whole team.”
    - id: p15
      illustration: p15
      paragraphs:
        - text: They dim the Loom and use it only at nearby junctions. The machine reports, “Local guidance active. Distant recommendation paused.”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "Vale leads along the western rock. "
            - text: Nara walks beside the cart, while Timo watches its wheels and battery.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: At a steep bend, everyone pauses to keep the cart level. Nara says, “One at a time. Keep the cart between us.”
    - id: p18
      illustration: p18
      paragraphs:
        - text: Ora waves a silver lantern from the stone relay shelter. “You arrived together,” she says. “The storm loosened one connection inside.”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "Timo clears frost from the loose relay contact and secures it. "
            - text: The signal returns before the wind strengthens again.
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: Snow thickens outside, so all four dogs remain in the stone shelter. Vale looks through the window. “The wind is rising. We wait here.”
    - id: p21
      illustration: p21
      paragraphs:
        - text: After the wind eases, Nara builds wordless models of both paths. She points to each in turn. “This one records the eastern gap. This one shows the western ledge that fits our cart.”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: "They return together on the broad route. "
            - text: The Loom now follows their current observations instead of commanding the journey.
