schema_version: 2
language: zh-CN
writer: 北辰
title: 新雪下的路线
summary: 一场新雪遮住了路线仪推荐东路时所依据的旧线索。奈拉、提莫和维尔比较两条山路，检验不同解释，最后选择了虽远一些、却适合全队和电池车的路线。
chapters:
  - id: ch01
    title: 一条肯定的线
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 两种解释
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
      - p15
  - id: ch03
    title: 适合全队的路
    page_refs:
      - p16
      - p17
      - p18
      - p19
      - p20
      - p21
      - p22
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 东路现在并不安全，寻路仪为什么仍然推荐它？
    answer: 它依据许多次旧行程和仍在的路桩，却没有掌握新雪遮住的空隙。
    page_refs:
      - p02
      - p05
      - p06
      - p09
      - p10
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪些观察支持维尔所说的“东路已经改变”？
    answer: 被埋的路桩、新雪檐、雪桥下的影子和敞开的空隙都支持这一解释。
    page_refs:
      - p03
      - p05
      - p08
      - p09
      - p10
  - id: q03
    type: compare
    speaker: narrator
    prompt: 这次行程中，东路和西路各有什么条件？
    answer: 东路较短，却出现隐藏空隙；西路较远、耗电更多，但宽阔的岩石台适合全队和电池车。
    page_refs:
      - p08
      - p09
      - p12
      - p13
      - p17
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 奈拉为什么拒绝提莫分头行动的建议？
    answer: 她认为分开会增加风险，希望选择一条能让每位成员和车辆共同通过的路。
    page_refs:
      - p12
      - p13
      - p14
      - p17
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 大家从这次路线选择中学到了什么？
    answer: 已有的导航可以参考，但决定前还要比较当前情况、证据和队伍的实际限制。
    page_refs:
      - p03
      - p06
      - p08
      - p10
      - p11
      - p15
      - p21
      - p22
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: 大家怎样既节省电量，又没有完全放弃寻路仪？
    answer: 他们调暗投影，只在附近岔口使用它，不再照搬远程推荐。
    page_refs:
      - p13
      - p15
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "一夜大雪过后，山脊上的中继站突然沉默了。 "
            - text: 村子收不到山那边的天气消息，必须派人前去检查。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 寻路仪为奈拉和提莫投出东路线，报告：“东路：历史记录中距离最短。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 维尔看着吞没路标的新雪：“昨夜雪埋了路标，东路也可能已经变了。”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 提莫检查寻路仪和电池车：“它参考过许多次行程。我们先查清楚，再决定要不要放弃东路。”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 奈拉发现两根蓝色路桩正在新形成的雪檐下消失。 奈拉说：“
            - text: 路标还在，通向路标的地面却可能变了。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 寻路仪报告：“东路可信度较高，许多旅行者曾经通过。”那些行程留下的脚印，如今全埋在新雪下面。
    - id: p07
      illustration: p07
      paragraphs:
        - text: “积雪已经破坏了旧路。”维尔说。“也可能只是把路盖住了。”提莫马上反驳。奈拉望着山脊，暂时没有选定哪种解释。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 他们站上稳固的岩石观察点，比较东侧雪台和西侧石台。奈拉说：“从这里能把两条路都看清。”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 低低的阳光在一座薄雪桥下投出黑线。 维尔说：“
            - text: 这道影子说明下面有一道空隙。”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 一根路桩立在空隙另一边。 提莫说：“
            - text: 寻路仪认出了路标，却没有发现靠近路标的地面已经改变。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 奈拉关掉投影，把警示块放在模型旁。她说：“寻路仪认出了路桩，可旧脚印都埋在新雪下。”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 维尔说：“
            - text: "西侧石台更远，却有岩石支撑。” "
            - text: 那里的弯道也够宽，电池车能够通过。
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 提莫查看只剩部分电量的电池。 提莫说：“
            - text: 远路更耗电，我们得平稳前进，还要少开投影。”
    - id: p14
      illustration: p14
      paragraphs:
        - text: “维尔走西边，我们继续探东边。”提莫提出分头行动。奈拉摇头：“分开会增加新的风险。我们需要适合全队的同一个计划。”
    - id: p15
      illustration: p15
      paragraphs:
        - text: 他们调暗寻路仪，只在附近岔口使用。机器报告：“近处导航开启，远程推荐暂停。”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "维尔沿着西侧岩石领路。 "
            - text: 奈拉守在车旁，提莫留意车轮和电量。
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: 到了陡弯，大家停下来稳住电池车。奈拉说：“一个一个走，把车护在中间。”
    - id: p18
      illustration: p18
      paragraphs:
        - text: 奥拉在石头中继站前挥动银色提灯：“你们一起到了。暴风雪让屋里的一处接头松开了。”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "提莫清掉松动接头上的霜，把它重新固定。 "
            - text: 风再次增强以前，中继信号恢复了。
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: 屋外的雪越来越密，四只狗都留在石屋里。维尔看着窗外说：“风又大了，我们在这里等。”
    - id: p21
      illustration: p21
      paragraphs:
        - text: 风势减弱后，奈拉做出两条路的无字模型。她逐个指给大家看：“这个记下东路的空隙，另一个画出能过车的西侧石台。”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: "大家沿着宽路一起返回。 "
            - text: 这一次，寻路仪依据他们刚刚获得的观察安静跟随，不再替他们决定方向。
