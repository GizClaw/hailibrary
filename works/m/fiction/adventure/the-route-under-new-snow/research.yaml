sources:
  - url: https://www.nps.gov/articles/000/winterhikingtips.htm
    title: Winter Hiking Tips
    publisher: U.S. National Park Service
    supports: Snow can hide or change familiar routes, conditions can change quickly, and travelers should not rely on other tracks alone.
  - url: https://www.nps.gov/seki/planyourvisit/backpacking-safety.htm
    title: Backpacking Safety
    publisher: U.S. National Park Service
    supports: Groups should stay together, reconsider dangerous crossings, and plan around the abilities of the whole party.
notes: The Trail Loom and canine mountain settlement are fictional. The work presents route projections as fallible stored observations and avoids giving procedural avalanche or ice-crossing instruction.
