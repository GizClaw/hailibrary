schema_version: 3
language: en-US
writer: manypath-lantern
title: The Hammer Sounded Deeper Each Year
summary: "Zhi compares a short human life with an endless task, while the mountain guardian sees a different result in the workers who follow Yu."
chapters:
  - {id: c01, title: "Who Can Wait for the End?", page_refs: [p01, p02, p03, p04, p05]}
  - {id: c02, title: "The Guardian Hears", page_refs: [p06, p07, p08, p09, p10]}
  - {id: c03, title: "After the Mountains Leave", page_refs: [p11, p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: compare, prompt: "How did Zhi and Yu view Yu's remaining years?", answer: "Zhi thought a short life should not be spent on a task without an ending, while Yu believed later workers could continue from existing results.", page_refs: [p02, p03, p04]}
  - {id: q02, type: evidence, prompt: "Which three linked changes convinced the guardian that the blows might reach the center?", answer: "After winter the blows returned from deeper places, the child grew as the old man bent lower, and unfamiliar faces appeared.", page_refs: [p07, p08]}
  - {id: q03, type: character-motive, prompt: "Why did the guardian admit that the opening was still small?", answer: "Its present size mattered less than the fact that the work could continue through new workers.", page_refs: [p08, p09]}
  - {id: q04, type: cause-effect, prompt: "What did the Ruler of Heaven do after the report?", answer: "He ordered the two mighty sons of Kua'e to carry Taihang and Wangwu far away.", page_refs: [p09, p10]}
  - {id: q05, type: evidence, prompt: "What showed that the detour had disappeared?", answer: "Light entered the gate, people went straight to the fields, and Zhi's cart no longer bumped over rocks.", page_refs: [p12, p13, p14]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "Spring followed winter, and hammer blows returned among cicadas and falling leaves. Yu swung less often, but younger workers followed the seams he marked and moved deeper into the rock."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "Zhi finally chose a clear day to move south. At the worksite, Yu bent over his hoe and waited for breath. Zhi asked how many years he could remain."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "To Zhi, moving was painful but ended after several journeys. The mountain road had no visible deadline, so Yu should not spend his few remaining years upon it."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "Yu admitted that his days would end, then pointed toward a young worker taking the hammer. Removed stone would not return, and tomorrow's workers could begin after today's progress."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "Jun asked Zhi to move his cart, whose wheels settled firmly on the villagers' gravel. He studied the road, then continued with his belongings along the old detour."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "The ancient legend says a guardian lived within the mountains. At first he ignored human hammers because lightning, floods, and earthquakes had never driven the mountains away."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "After each winter, however, the blows returned from a deeper place. The old man bent lower, the child grew taller, and unfamiliar faces appeared beside the rock."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "Comparing these changes, the guardian became afraid. One person could tire, age, or leave, but this labor passed from one pair of hands to another."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "He rose through clouds and gave the Ruler of Heaven an honest report. The opening was small, yet the road lengthened, the sound deepened, and someone always accepted the tools."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "The ruler watched the land below, then called the two mighty sons of Kua'e. He ordered them to carry Taihang and Wangwu to distant places."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "No villager saw the powerful brothers arrive. At night Jun heard spring thunder beneath the floor, water trembled in Lian's bowl, and Yu sat up to listen."}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "At sunrise, unblocked southern light covered the well and rooftops. Where the mountains had met, broad level ground led straight toward the fields."}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "Villagers rolled carts down the road and happily returned. Jun searched for the old notch, finding only their short gravel section and a green shoot between its stones."}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "Zhi came back from the south with belongings loaded again. He used the new direct road. His pot stayed still, and his wheels crossed no mud pits."}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "Lian asked why he had returned. Zhi said the road was short now. He examined his wheels while she tightened a loose rope."}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "Yu did not tease him. He took the other cart shaft. The two old men pushed home while Jun's empty basket swung beside them."}]}
