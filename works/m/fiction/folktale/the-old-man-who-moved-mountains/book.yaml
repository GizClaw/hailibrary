characters:
  - id: yugong
    kind: person
    description: An elderly villager who wants to open a road that the whole village can use.
    visual_identity: 'Elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff; he uses a short iron hammer and iron chisel while working.'
  - id: lian
    kind: person
    description: "Yugong's wife, who tests every plan against strength, distance, and daily work."
    visual_identity: 'Elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket with a padded shoulder strap.'
  - id: zhisou
    kind: person
    description: A practical elderly neighbor who believes moving one household is more realistic than cutting a road.
    visual_identity: 'Elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled wooden handcart carrying two plain chests, a rolled sleeping mat, and a bronze cooking pot.'
  - id: jun
    kind: person
    description: A village girl who joins safely by carrying stones already broken loose.
    visual_identity: 'Chinese village girl about eight years old with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket.'
  - id: guardian
    kind: spirit
    description: The mountain guardian who realizes that the labor can pass from one generation to another.
    visual_identity: 'Tall mountain guardian spirit with a weathered stone-gray face, long cloudlike white brows, an indigo layered robe edged in forest green, and a crooked pine-wood staff; his lower robe dissolves into pale mountain cloud.'
