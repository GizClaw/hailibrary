schema_version: 1
id: the-old-man-who-moved-mountains
type: [reading, illustrated-short-story]
style: woodblock-print
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [culture, fantasy, travel]
  themes: [perseverance, responsibility, tradition]
  moods: [hopeful, reflective]
characters:
  - id: narrator
    kind: narrator
    description: A clear village storyteller who treats the supernatural ending as part of an old fable and lets actions carry the comparison.
    voice_identity: steady, observant, and warm
  - id: yugong
    kind: character
    description: The elderly villager known as Old Man Yu, who wants a direct public road through the mountains.
    visual_identity: Elderly Chinese man with a lined round face, white hair in a high knot, short white beard, indigo robe, rust-red sash, mustard cloth leggings, and a plain wooden-handled digging tool.
    voice_identity: patient, practical, and quietly determined
  - id: lian
    kind: character
    description: Yu's wife, who tests every plan against the work, distance, and needs of the household.
    visual_identity: Elderly Chinese woman with a broad kind face, silver hair in a low bun, forest-green robe, rust-red apron, indigo trousers, and a round woven basket.
    voice_identity: direct, measured, and caring
  - id: zhisou
    kind: character
    description: Old Man Zhi, a skeptical neighbor who argues that moving a household is faster than moving mountains.
    visual_identity: Lean elderly Chinese man with sharp eyebrows, gray-black hair in a low knot, long narrow gray beard, rust-red robe, indigo belt, mustard shoulder bag, and a plain wooden walking staff.
    voice_identity: brisk, skeptical, and candid
  - id: jun
    kind: character
    description: A neighbor's young child who joins the work after seeing a usable foothold cut into the rock.
    visual_identity: Chinese child with a round face, black hair in two small side knots, mustard tunic, forest-green trousers, rust-red shoes, and a child-sized woven basket.
    voice_identity: bright, eager, and concrete
  - id: guardian
    kind: character
    description: The mountain guardian in the fable, who hears the tools return season after season and carries the news to Heaven.
    visual_identity: Tall forest-green mountain spirit with a calm stone-like face, carved cloud-shaped hair, indigo cloud scarf, rust-red wrist bands, and no writing or symbols.
    voice_identity: low, watchful, and increasingly uneasy
  - id: emperor
    kind: character
    description: The ruler of Heaven in the old fable, who hears the mountain guardian's report and sends help without appearing in the village scenes.
    visual_identity: Regal elder with a calm face, high dark hair knot, forest-green outer robe, indigo inner robe, rust-red sash, and plain cream cloud ribbons without writing or symbols.
    voice_identity: serene, formal, and decisive
  - id: bearers
    kind: character
    description: The two sons of Kua'e, legendary beings who lift the mountains away at Heaven's command in the supernatural ending recorded in Liezi.
    visual_identity: Twin giant spirits with broad faces and dark topknots, one in an indigo robe with mustard sash and one in a mustard robe with rust-red sash, both surrounded by cream cloud ribbons without symbols.
    voice_identity: deep, calm, and united
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals: [compare a quick private solution with a slow shared solution, follow evidence across chapters, explain how repeated work changes the choices]
  concepts: [obstacle, alternative, shared road, long-term effort]
rights: {text: project-original-retelling, artwork: project-generated, writer_persona: project-original}
