  - {id: p02, file: artwork/p02.webp, scene: "Old Man Yu watches a tired traveler arrive at dusk, then studies the rock wall with his hoe in hand."}
  - {id: p03, file: artwork/p03.webp, scene: "Inside a simple home, Old Man Yu proposes cutting a pass while Lian points toward the mountain after setting an empty stone basket at her feet."}
  - {id: p04, file: artwork/p04.webp, scene: "At the mountain wall, Yu scratches a small mark at its lowest place while Lian tests the weight of a basket filled with loose stone and a long path recedes toward the distant shore."}
  - {id: p05, file: artwork/p05.webp, scene: "Old Man Zhi arrives with walking staff and shoulder bag, pointing toward a loaded handcart and the long road around the mountains."}
  - {id: p06, file: artwork/p06.webp, scene: In morning light Zhi pulls and steers his partly loaded handcart from the front while Yu and Lian push from behind on the climbing outer road.}
