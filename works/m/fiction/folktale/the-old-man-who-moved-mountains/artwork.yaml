  - {id: p02, file: artwork/p02.webp, scene: Old Man Yu watches a tired traveler arrive at dusk, then studies the rock wall with his hoe in hand.}
  - {id: p03, file: artwork/p03.webp, scene: Inside a simple home, Old Man Yu proposes cutting a pass while Lian points toward the mountain and an empty stone basket.}
  - {id: p04, file: artwork/p04.webp, scene: Yu marks a low notch in the mountain, Lian tests the weight of a stone basket, and family members face the distant shore path.}
  - {id: p05, file: artwork/p05.webp, scene: Old Man Zhi arrives with walking staff and shoulder bag, pointing toward a loaded handcart and the long road around the mountains.}
  - {id: p06, file: artwork/p06.webp, scene: Yu, Lian, and Zhi push and pull a lightly loaded handcart up the winding outer road in morning light.}
  - {id: p07, file: artwork/p07.webp, scene: At sunset the tired group reaches open land south of the mountains, with the handcart beside them and the peaks behind.}
  - {id: p08, file: artwork/p08.webp, scene: From the south side, Yu points back toward the hidden northern village while Lian and Zhi weigh the tested moving plan beside the cart.}
  - {id: p09, file: artwork/p09.webp, scene: After one full day of digging, Yu and Lian stand beside a very small fresh notch and a modest pile of stone while Zhi observes.}
  - {id: p10, file: artwork/p10.webp, scene: Across changing seasons, villagers carry small baskets from the growing pass; Jun joins Yu and Lian with a child-sized basket.}
  - {id: p11, file: artwork/p11.webp, scene: During winter Yu's family repairs hoes and baskets indoors; in spring the same tools return to a visibly wider mountain cut.}
