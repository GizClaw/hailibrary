  - {id: p13, file: artwork/p13.webp, scene: The forest-green mountain guardian listens above the pass as tool blows rise from below in several seasons.}
  - {id: p14, file: artwork/p14.webp, scene: Two giant sky bearers descend among cream cloud ribbons and lift the two mountains, one mountain on each back.}
  - {id: p15, file: artwork/p15.webp, scene: On the newly open level road, Zhi stands beside his loaded handcart while Yu points south and villagers travel between the village and distant fields.}
  - {id: p16, file: artwork/p16.webp, scene: Yu and Zhi walk side by side on the open road at dawn, smiling as travelers pass between distant relocated mountains.}
