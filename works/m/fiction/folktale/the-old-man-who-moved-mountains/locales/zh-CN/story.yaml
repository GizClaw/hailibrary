schema_version: 2
language: zh-CN
writer: 百径灯
title: 愚公和山前的两条路
summary: 古代中国的传说里，两座山挡在村南。智叟主张搬家，愚公想挖出全村都能走的路。他们先推车绕山，再看着石壁上的缺口一年年变宽。两个办法解决的难题并不相同。
chapters:
  - {id: ch01, title: 大山挡住了什么, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 智叟算过的路, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: 留在石壁上的变化, page_refs: [p09, p10, p11, p12]}
  - {id: ch04, title: 传说里的结局, page_refs: [p13, p14, p15, p16]}
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 智叟为什么认为愚公一家能搬完家，却不一定能挖通山路？
    answer: 搬家只要多走几趟，愚公一家就能搬完；智叟认为愚公一辈子也看不到山路挖通。
    page_refs: [p05]
  - id: q02
    type: compare
    speaker: narrator
    prompt: 搬到山南和从山间开路，会分别帮助哪些人？
    answer: 搬家能让愚公一家很快不用再绕山；开路若成功，全村人都能少绕路。
    page_refs: [p07, p08, p16]
  - id: q03
    type: evidence
    speaker: narrator
    prompt: 哪三处变化说明挖山没有停在第一天？
    answer: 缺口后来能站下两只脚，更多村民带来工具，第二年春天旧缺口又变宽了。
    page_refs: [p09, p10, p11]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 愚公为什么先和智叟一起试走绕山的路？
    answer: 他想亲自看一趟绕山路有多难，再决定选哪个办法。
    page_refs: [p05, p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: 读者从哪里知道最后移山的情节属于传说，而不是历史记录？
    answer: 旁白先说明故事走进传说里神奇的一段，接着才写守山的神、天帝和夸娥氏二子出现。
    page_refs: [p13, p14]
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: 从两种办法和智叟最后的选择中，可以看出什么主要意思？
    answer: 搬家较快，却只帮一家；开路很慢，若大家一起做，最后能让更多人少绕路。
    page_refs: [p07, p08, p12, p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 这是一个古代中国的传说。山北有座村子，村南立着太行、王屋两座大山。要去南边的田地和集市，人们得沿山路绕过两座山，常常天不亮就出门。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 一天傍晚，愚公碰见一位刚回村的邻居。那人的车已经空了，走路时还直喘气。愚公望向山间，心想，大山成了每次南行的
            - vocabulary: {id: obstacle, text: 障碍}
            - text: 。他指着两山之间问：“能不能从那里开一条路？”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 回到家，愚公把想法说给家人听。妻子阿莲把一只空筐放在脚边，没有马上同意。“你的力气一天比一天少，”她问，“挖下来的土石又往哪里送？”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 第二天，他们来到山前。愚公在石壁较低处做了个记号，阿莲往筐里装满碎石，提起来试了试。村外的水边可以放土石，可是从山口到那里，每一趟都不近。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 智叟拄着木杖来了，身旁停着他自己的车，上面已经捆着几件准备搬家的东西。“还有一个办法，”他说，“你们可以搬到山南。多走几趟，家总能搬完；照你的办法，恐怕一辈子也看不到挖通的那一天。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 愚公没有说不行。他说：“先走一趟，才知道这个办法能不能做成。”天刚亮，智叟在前面拉着自己那辆还没装满的车，愚公和阿莲在后面推。车轮沿着绕山的路上坡，又拐进山谷，山峰把南边挡得严严实实。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 快到天黑，他们才站在山南的开阔地上。三个人肩膀酸得厉害，车上的东西却全都带到了。智叟扶着车把说：“再按今天这样走几趟，一家人就能搬完。”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 愚公回头，只看见高高的山，看不见村子。搬到这里，自家不用再绕山，邻居的长路却一点没短。阿莲问他：“你一开始想帮的，只有咱们一家吗？”
    - id: p09
      illustration: p09
      paragraphs:
        - text: 三个人又把车推回山北。愚公和阿莲照着记号挖了一整天，石壁上只留下浅浅的缺口。智叟用木杖比了比：“照今天这个样子，我还是算不出哪年能挖通。”愚公收起工具：“我也算不出。不过，明天还从这个缺口往下挖。”
    - id: p10
      illustration: p10
      paragraphs:
        - text: 缺口慢慢宽到能站下两只脚。邻家孩子小君带着小筐，来捡松动的石块。几个村民看见山壁上能落脚的地方，也拿来了工具。挖山的人多了，找位置、敲石、运土都有了帮手。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 冬天，大家停下来。愚公在屋里给锄头换上新木把，阿莲补好破了的筐。春天一到，村民自己回到山前。旧缺口比去年更宽，大家也不用愚公再告诉他们怎么做。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 智叟看见愚公拄着锄头歇口气，小君和村民仍在身后搬石。“你越来越老了，”他说，“以后谁来搬开这个
            - vocabulary: {id: obstacle, text: 障碍}
            - text: ？”愚公抬手指向来回的人：“你问问他们吧。”当天晚上，智叟把剩下的东西也装上那辆车。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 讲到这里，故事走进传说里神奇的一段。守山神站在高处，听着山下的动静。冷风来了，山下安静一阵；来年暖风一吹，敲石声又响起来，从更深的山腹传来。他渐渐坐不住了，穿过云层，把这些年山下的变化讲给天帝听。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 传说里，天帝听完，叫来夸娥氏的两个儿子。两位神人踏着云落下，各把一座山扛在背上。村民第二天醒来，只见平路伸向南边；昨夜遮住天边的山，已经立在遥远的地方。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 清晨，智叟推着装满东西的那辆车上了新路。没有陡坡，也不用绕弯，他很快到了南边，又转回村里。愚公见到他时，车上仍装着行李，车头已经转向自家。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 两位老人顺着新路并肩往前。智叟看看路上的车轮印：“我原来打算绕山走的那几趟，一趟也不用走了。”愚公侧身让路，小君提着空筐从他们身旁跑过。远处也有人正朝村子走来。
