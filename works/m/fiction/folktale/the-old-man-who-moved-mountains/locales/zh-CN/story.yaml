schema_version: 3
language: zh-CN
writer: 百径灯
title: 一条大家都能走的路
summary: >-
  在一个古老的中国传说里，两座大山让全村人只能走危险的绕路。愚公试过智叟的搬家办法，却发现搬走一家并不能帮助留下的人。于是他和阿莲安排好劳作，孩子与村民也在他老去时不断接手。守山神明白这场劳动会一代代延续，便上报天帝，最终两山被移走，村前出现了一条人人可走的大路。
chapters:
  - id: ch01
    title: 两个办法
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 接着往前凿
    page_refs: [p07, p08, p09, p10, p11, p12, p13]
  - id: ch03
    title: 山后的光
    page_refs: [p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    prompt: 愚公为什么开始寻找一条更短的路？
    answer: 一个发烧的孩子必须沿泥泞的绕路走很久，直到夜里才能到达山南的医者那里。
    page_refs: [p01, p02]
  - id: q02
    type: compare
    prompt: 智叟的办法和愚公的办法，分别能帮助哪些人？
    answer: 智叟的办法能把一户人家搬到山南，愚公的办法是为全村开出一条人人能走的路。
    page_refs: [p04, p05, p06]
  - id: q03
    type: evidence
    prompt: 两山移走以前，哪些证据说明开路已经有了用处？
    answer: 凿下的石头垫住泥路后，车轮不再下陷，智叟的小车也稳稳停在碎石路上。
    page_refs: [p07, p09, p12]
  - id: q04
    type: character-motive
    prompt: 阿莲为什么限制每筐石头的重量，还决定愚公何时休息？
    answer: 她担心过重的劳动会先累倒大家，所以要让开路的办法安全而且能够长久继续。
    page_refs: [p03, p06, p08, p10]
  - id: q05
    type: evidence
    prompt: 哪些变化使守山神不再认为人的力量不值得担心？
    answer: 山中缺口一年年加深，愚公慢了下来，小君却长高了，还有新的双手不断接过旧工具。
    page_refs: [p10, p11, p14]
  - id: q06
    type: main-idea
    prompt: 结尾的场面怎样回应了愚公和智叟之前的争论？
    answer: 新路让所有人受益，两个老人也不再争论谁对谁错，而是一起把智叟的小车推回家。
    page_refs: [p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '在一个古老的中国传说里，太行、王屋两座山并排挡在村子南面。村民要去南边的田地，只能先向东绕，穿过乱石坡和山谷，再折回南方。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '秋雨过后，愚公帮邻居抬起陷在泥里的车。车上躺着发烧的孩子，漫长的绕路使他们直到夜里才能赶到山南找医者。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '第二天，愚公在两山之间画出一条直线。晚饭时，他提出从那里开路，阿莲却问：石头放到哪里，田地和家里的活又由谁来做？'
        - text: 他们决定先把需要的力气算清楚。
    - id: p04
      illustration: p04
      paragraphs:
        - text: '邻居智叟提出一个小些的办法：把家搬到山南，每次运一车。愚公和阿莲没有马上反对，而是和他装上锅、席子与衣物，一起试走一趟。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '车轮不断卡在乱石中，绳子也松了。过了中午，三人还在山影里。等他们终于到达有阳光的田边，智叟认为再走几趟就能搬完。'
    - id: p06
      illustration: p06
      paragraphs:
        - text: '阿莲指出，小君母女和走不了远路的老人仍会被留下。愚公因此选择开路，阿莲则要求大家分好家务、控制每筐重量，并按时休息。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '第一锤只敲下一粒豆大的石屑。一家人把土填进荒洼，把平石铺上村里的泥路。到了傍晚，石壁仍只少了一个小角。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '小君也想帮忙。她远离铁锤，只捡已经落地的碎石。小筐装得太满时，阿莲拿掉一半，教她安全地多走几趟。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '村民们发现，铺过碎石的泥路不再让车轮下陷。有人带来铁锤，有人制作木楔，还有人做完家里的活再来帮一会儿。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '冬天使锤声停了。愚公修理工具时，右手抖得系不紧绳子。阿莲替他打好结，劝他开春后把更多敲石的活交给别人。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '雪一融化，已经有人等在石壁前。小君长高了，年轻的手接过愚公的锤子，每个新的季节都把缺口向山里推进一段。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '智叟推着装满行李的小车，在年老的愚公身旁停下。他说一个老人不可能永远守着这个缺口。小车的轮子却稳稳停在大家铺成的碎石路上。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '愚公回答，已经凿下的石头不会长回去，明天来的人可以接着今天的最后一锤。小君从两位老人之间穿过，另一位村民正敲向愚公标出的石缝。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '古老传说还说，山中住着一位守山神。他起初觉得几声敲打不值一提。可声音年年深入山腹，老去的人慢了下来，年轻人却接过他们的工具。'
    - id: p15
      illustration: p15
      paragraphs:
        - text: '守山神终于明白，这条路不需要由某一个人完成。看到劳动能从一双手传到另一双手，他担心起来，便乘着云去禀告天帝。'
    - id: p16
      illustration: p16
      paragraphs:
        - text: '传说中，天帝命力大无穷的夸娥氏二子背走两座山。那天夜里，小君听见地下传来春雷般的闷响，阿莲碗里的水轻轻晃动。'
    - id: p17
      illustration: p17
      paragraphs:
        - text: '太阳升起时，南方的光照进村子。一条平坦的路直通田野，两座山已经到了远方，再也不能用阴影盖住村口。'
    - id: p18
      illustration: p18
      paragraphs:
        - text: '小君看见村边那段碎石路还在，石缝里长出一株绿芽。智叟沿新路回来，他和愚公没有再争论，而是一起把小车推回家。'
