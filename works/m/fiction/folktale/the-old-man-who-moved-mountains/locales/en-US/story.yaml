schema_version: 3
language: en-US
writer: manypath-lantern
title: A Road for Everyone
summary: >-
  In an old Chinese legend, two mountains force a village to take a dangerous detour. Yugong considers moving south, but a trial journey shows that moving one family would leave everyone else behind. He and Lian organize careful work, and children and neighbors carry it forward as he ages. When a guardian realizes that the shared labor will outlast any one worker, heaven moves the mountains and the villagers finally have an open road.
chapters:
  - id: ch01
    title: Two Plans
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: The Work Continues
    page_refs: [p07, p08, p09, p10, p11, p12, p13]
  - id: ch03
    title: The Open Road
    page_refs: [p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    prompt: Why did Yugong begin searching for a shorter road?
    answer: 'A sick child had to travel the long, muddy route around the mountains before reaching the healer.'
    page_refs: [p01, p02]
  - id: q02
    type: compare
    prompt: How would Zhisou's plan and Yugong's plan help different people?
    answer: "Zhisou's plan could move one household south, while Yugong wanted to make a road that the whole village could use."
    page_refs: [p04, p05, p06]
  - id: q03
    type: evidence
    prompt: What evidence showed that the work had already helped before the mountains moved?
    answer: "Stones from the cut kept cart wheels from sinking into the muddy village road, and Zhisou's cart stood firmly on that gravel."
    page_refs: [p07, p09, p12]
  - id: q04
    type: character-motive
    prompt: Why did Lian limit loads and decide when Yugong should rest?
    answer: 'She feared that heavy work would wear people out before the work could continue, so she made the plan safer and sustainable.'
    page_refs: [p03, p06, p08, p10]
  - id: q05
    type: evidence
    prompt: Which changes made the guardian revise his belief that human effort posed no threat?
    answer: 'The opening deepened each year, Yugong slowed, Jun grew, and new hands kept taking up the old tools.'
    page_refs: [p10, p11, p14]
  - id: q06
    type: main-idea
    prompt: How does the final scene answer the disagreement between Yugong and Zhisou?
    answer: "The short road serves everyone, and the two old men push Zhisou's cart home together instead of arguing about which man was right."
    page_refs: [p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'In an old Chinese legend, the Taihang and Wangwu Mountains stood shoulder to shoulder south of a village. To reach the southern fields, people followed a rough trail east, crossed a ravine, and doubled back.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'After autumn rain, Yugong helped free a cart stuck in mud. A feverish child lay inside. The long trip around the mountains meant they could not reach the healer until night.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'The next morning, Yugong marked a line between the mountains. At supper he proposed opening a road.'
        - text: Lian asked where the stone would go and who would do the farm and household work.
        - text: They agreed to calculate how much work the road would take before beginning.
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Their neighbor Zhisou offered a smaller plan: move his household south, one cartload at a time. Yugong, Lian, and Zhisou loaded a pot, a mat, and clothes, then tested the journey together.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: "Wheels jammed among loose rocks, ropes slipped, and the three travelers remained in the mountains' shadow past noon. When they finally reached the sunny fields, Zhisou said a few more trips would finish his move."
    - id: p06
      illustration: p06
      paragraphs:
        - text: 'Lian pointed out that Jun, her mother, and neighbors who could not walk the route would still be left behind. Yugong chose the road, while Lian set weight limits for each load, divided the chores, and scheduled regular breaks.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: 'The first hammer blow freed a chip no bigger than a bean. The family filled hollows with soil.'
        - text: 'They laid flat stones on the muddy village road, but by sunset the cliff had lost only one corner.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Jun wanted to help, so she stayed away from the hammers and gathered only loose pieces. She filled her tiny basket too full. Lian removed half and showed her how to make several safe trips instead.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Other villagers noticed that cart wheels no longer sank where broken stone covered the mud. Some brought hammers, some shaped wooden wedges, and others came to help after finishing their chores at home.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Winter stopped the hammering. Yugong's right hand trembled as he repaired a handle."
        - text: Lian tied the cord and told him to let other people do more of the hammering in spring.
    - id: p11
      illustration: p11
      paragraphs:
        - text: "When the snow melted, workers were already waiting at the cliff. Jun had grown, and young hands lifted Yugong's hammer. With each new season, the opening reached farther into the rock."
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Zhisou stopped his loaded cart beside the aging Yugong. He argued that one old man could not keep working at the cut forever.'
        - text: 'His cart wheels, however, rested firmly on the gravel road everyone had built.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: "Yugong answered that removed stone would not grow back. A worker arriving tomorrow could continue where today's workers left off."
        - text: Jun squeezed past as another villager struck the crack Yugong had marked.
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'The old legend says a guardian spirit lived inside the mountains. He once dismissed the tapping as harmless.'
        - text: 'Year after year, however, the tapping came from deeper inside the mountains. Old workers slowed while younger ones took their tools.'
    - id: p15
      illustration: p15
      paragraphs:
        - text: 'The guardian realized that no single person had to finish the road. Labor could pass from hand to hand.'
        - text: 'Alarmed, he rose through the clouds and reported what he had seen to the Ruler of Heaven.'
    - id: p16
      illustration: p16
      paragraphs:
        - text: "In the legend, the Ruler sent the two mighty sons of Kua’e to carry the mountains away. That night, Jun heard thunder under the floor, and water trembled in Lian's bowl."
    - id: p17
      illustration: p17
      paragraphs:
        - text: 'At sunrise, southern light reached the village. A level road ran toward the fields.'
        - text: 'The two mountains had been moved far away, and their shadows could no longer cover the village.'
    - id: p18
      illustration: p18
      paragraphs:
        - text: 'Jun found that the stretch of gravel road still lay beside the village, with a green shoot between its stones. Zhisou returned on the new road, and he and Yugong pushed his cart home together.'
