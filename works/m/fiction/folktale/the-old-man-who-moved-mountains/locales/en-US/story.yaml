schema_version: 2
language: en-US
writer: manypath-lantern
title: Old Man Yu and the Two Roads
summary: An old Chinese legend tells of a village blocked to the south by two mountains. Old Man Zhi offers a move that could help one household quickly. Old Man Yu chooses a slower plan for everyone. A trial trip and a changing work site reveal what each choice can do.
chapters:
  - {id: ch01, title: What the Mountains Cost, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: The Road Zhi Chose, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: Marks That Remained, page_refs: [p09, p10, p11, p12]}
  - {id: ch04, title: The Legend's Answer, page_refs: [p13, p14, p15, p16]}
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Old Man Zhi think Yu's family could finish moving but might not finish cutting the passage?
    answer: A few difficult trips could finish a move, but the mountain might remain longer than either old man lived.
    page_refs: [p05]
  - id: q02
    type: compare
    speaker: narrator
    prompt: How would moving and opening a passage help different groups of people?
    answer: Moving could quickly shorten one household's trips, while a passage could shorten the trip for the whole village.
    page_refs: [p07, p08, p16]
  - id: q03
    type: evidence
    speaker: narrator
    prompt: Which three changes show that the digging continues beyond one day's work?
    answer: The first cut becomes a place for two feet, neighbors bring tools, and people return to a wider cut in spring.
    page_refs: [p09, p10, p11]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Yu test Zhi's moving plan before returning to his own plan?
    answer: He wants to learn how hard one moving trip would be before deciding.
    page_refs: [p05, p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: How does the narrator show that the final mountain-moving event belongs to a legend?
    answer: The narrator announces a turn away from ordinary village life before the mountain guardian and helpers from Heaven enter.
    page_refs: [p13, p14]
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What main idea do the two plans and Zhi's final trip show?
    answer: A quick plan may help one family, while harder shared work can change the road for everyone.
    page_refs: [p07, p08, p12, p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: An old Chinese legend begins in a village north of two enormous mountains, Taihang and Wangwu. The villagers' fields and market town lay south of the peaks. Reaching them meant climbing a road that curved around both mountains.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "Toward evening, a neighbor dragged an empty cart home, too tired to stand straight. An elder everyone called Old Man Yu studied the dark mountains. They made every trip south harder, an "
            - vocabulary: {id: obstacle, text: obstacle}
            - text: " the villagers could not avoid. “Could we open a passage between the peaks?” he wondered aloud."
    - id: p03
      illustration: p03
      paragraphs:
        - text: At home, Yu asked his family to consider the idea. His wife, Lian, set an empty stone basket between them. “Your strength is not endless,” she said. “Where would we put everything we cut loose?”
    - id: p04
      illustration: p04
      paragraphs:
        - text: The next morning, Yu chose the lowest place on the mountain wall. Lian filled a basket and lifted it once. They could carry the stone to a distant shore. Every trip from the mountain would take time.
    - id: p05
      illustration: p05
      paragraphs:
        - text: A second elder, Old Man Zhi, arrived with his own handcart. Some of his household goods were tied to it. “There is another way,” he told Yu. “Move your family to the southern side. After a few hard trips, the move would be done. We may not live long enough to cut through a mountain.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: Yu did not push the suggestion aside. “I want to see how hard one trip is before I choose,” he said. In the early light, Zhi steered his partly loaded cart while Yu and Lian pushed. The road climbed and dropped while the peaks hid the south.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Near sunset, the three reached open ground beyond the mountains. Their aching shoulders showed how hard the safe trip had been. Zhi touched the cart. “If each trip goes like this, one household can finish moving.”
    - id: p08
      illustration: p08
      paragraphs:
        - text: From that side, Yu could no longer see the northern village. He imagined his family living nearby. Their own trips would become shorter. His neighbors would still use the winding road. Lian asked, “Which problem did you mean to solve?”
    - id: p09
      illustration: p09
      paragraphs:
        - text: They returned north and tried Yu's choice for one day. At dusk, their cut was only deep enough to hold the toe of one shoe. Zhi measured it with his staff. “At this rate, I still can't see when you'll finish,” he said. Yu put away his tool. “Tomorrow, we'll start from this cut.”
    - id: p10
      illustration: p10
      paragraphs:
        - text: The cut slowly widened until someone could stand there with both feet. A child named Jun brought a small basket for loose pieces. Everyone could see the small new foothold. Several neighbors arrived with their own tools.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Winter snow covered the mountain path. Yu replaced a broken handle while Lian fixed baskets. In spring, neighbors returned to a cut wider than before. They knew where to begin without new directions.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "Zhi found Yu resting while Jun and the neighbors carried stone behind him. “You are losing strength,” Zhi said. “Who will face this "
            - vocabulary: {id: obstacle, text: obstacle}
            - text: " when you cannot?” Yu pointed to the busy path. “Ask the people already here.” That night, Zhi finished loading that same cart."
    - id: p13
      illustration: p13
      paragraphs:
        - text: At this point, the old legend leaves ordinary village life. A guardian spirit listened above the mountain as the sound of tools returned each season. The spirit went to the Ruler of Heaven. “They rest,” he reported, “but the work does not end.”
    - id: p14
      illustration: p14
      paragraphs:
        - text: The legend says the Ruler of Heaven sent the two sons of Kua'e, beings famous for their great strength. Each son lifted one mountain onto his back. Before morning, they carried both peaks far from the village road.
    - id: p15
      illustration: p15
      paragraphs:
        - text: At dawn, Zhi rolled that loaded cart onto the level road where a mountain had stood. He reached the southern fields quickly, then turned home. When Yu saw him again, Zhi was bringing the same load back instead of leaving.
    - id: p16
      illustration: p16
      paragraphs:
        - text: The two old men walked among travelers heading both ways. Zhi looked at his cart's straight tracks. “On this road, even this loaded trip was easy,” he said. Yu moved aside as Jun hurried past with an empty basket.
