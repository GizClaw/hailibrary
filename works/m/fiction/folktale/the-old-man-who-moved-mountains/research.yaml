schema_version: 1
required: true
reason: This work newly retells the traditional Chinese tale of Yugong moving the mountains, so its legendary status, exact source text, retained plot, and catalogue check must be explicit.
tale:
  traditional_name:
    zh-CN: 愚公移山
    en-US: The Foolish Old Man Moves the Mountains
  cultural_origin: An ancient Chinese fable and legend preserved in the received text of Liezi, chapter 5, Tang Wen. It is not presented as history, and the date and authorship of the received Liezi remain disputed.
  genre: fable and legend, not a historical account
  catalogue:
    system: Aarne-Thompson-Uther tale-type index
    number: none identified
    note: No matching ATU type was identified in the complete 890-type index consulted on 2026-09-13, so this work does not invent a catalogue number.
  consulted_version:
    title: 愚公移山, in 《列子·汤问》
    edition: Chinese Text Project electronic transcription, Simplified Chinese display, URN ctp:ws409846
    url: https://ctext.org/wiki.pl?chapter=409846&if=gb&remap=gb
    accessed: 2026-09-13
    public_domain_basis: The consulted underlying Chinese source is an ancient text. No modern translation, annotation, textbook wording, or website prose is reproduced.
  retained_plot_beats:
    - The Taihang and Wangwu mountains obstruct travel from the north side, and Old Man Yu proposes opening a way through them.
    - Yu's wife questions both his strength and where the removed earth and stone can go.
    - Old Man Zhi doubts that Yu can finish, while the work continues through younger helpers and later seasons.
    - A guardian spirit fears that the work will not stop and reports it to the Ruler of Heaven.
    - In the legendary ending, the Ruler of Heaven commands the two sons of Kua'e to carry the two mountains away.
  hai_library_inventions:
    - Yu, Lian, and Zhi test a household move by pushing a light cart around the mountains.
    - The story compares that bounded private move with a shared passage through visible results rather than a closing moral.
    - Lian and Jun receive new names, dialogue, and actions; Zhi packs a cart and later returns with it on the open road.
    - The guardian hears the work draw nearer across warm and cold seasons before carrying those observations to Heaven.
    - Villagers discover the change the next morning through the level southern road and the mountains now standing far away.
sources:
  - id: ctp-yugong-409846
    title: 愚公移山
    work: 《列子·汤问》
    publisher: Chinese Text Project
    edition: Simplified Chinese display of the electronic transcription; URN ctp:ws409846
    url: https://ctext.org/wiki.pl?chapter=409846&if=gb&remap=gb
    supports:
      - The mountains block travel and Yu gathers his household to propose leveling the difficult ground.
      - Yu's wife asks about his strength and the destination of the earth and stone.
      - Old Man Zhi objects, Yu invokes continuing generations, a guardian reports the work, and the two sons of Kua'e move the mountains by heavenly command.
  - id: iep-liezi
    title: Liezi
    publisher: Internet Encyclopedia of Philosophy
    url: https://iep.utm.edu/liezi/
    supports:
      - Tang Wen is chapter 5 of the received Liezi.
      - The received eight-chapter text contains myths, folk tales, and philosophical stories, and scholarship disputes its date and authorship.
      - The mountain-moving story belongs to the chapter's exploration of great results arising from continued small actions.
  - id: atu-complete-index
