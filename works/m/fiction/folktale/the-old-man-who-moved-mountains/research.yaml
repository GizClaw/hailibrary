    publisher: Folklore Database
    url: https://www.folkloredatabase.com/db_atu.php
    accessed: 2026-09-13
    supports:
      - The consulted index describes 890 international folktale types and their type numbers.
      - Searches of the complete index for this tale's title and defining mountain-moving plot found no matching type, so no ATU number is claimed.
  - id: scio-yugong
    title: The Old Man Yu Gong Moving the Mountains
    publisher: State Council Information Office of the People's Republic of China
    url: https://english.scio.gov.cn/featured/chinakeywords/2025-06/12/content_117925464.htm
    supports:
      - The tale is currently identified as a well-known Chinese fable associated with Liezi.
      - Its recognized plot includes Old Man Yu, Old Man Zhi, and a supernatural ending in which two immortals remove the mountains.
notes:
  - The source's regional destinations and ancient measurements are omitted from the learner text because they are not needed for the comparison task.
  - The guardian, the Ruler of Heaven, and the sons of Kua'e are explicitly introduced inside the legend rather than asserted as historical beings.
  - The SCIO page calls the helpers two immortals without naming Kua'e; the sons-of-Kua'e detail is attributed only to the Chinese Text Project source.
  - Both locale articles were drafted independently from the retained beats and fixed illustration scenes. No textbook lesson, picture book, modern translation, film, or famous modern retelling was used as a prose model.
