schema_version: 3
language: zh-CN
writer: 百径灯
title: 小筐接上石路
summary: 小君用安全的小筐加入，眼前可见的石路变化让更多村民接过工具，也改变了愚公的做法。
chapters:
  - {id: c01, title: 第一角石壁, page_refs: [p01, p02, p03, p04, p05]}
  - {id: c02, title: 小筐与车轮, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: c03, title: 接过来的工作, page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: character-motive, prompt: 智叟为什么仍劝愚公停下？, answer: 他担心老人用掉剩余年月，石壁却只减少很小一角。, page_refs: [p03, p04]}
  - {id: q02, type: cause-effect, prompt: 阿莲为什么拿掉小君筐里一半石头？, answer: 她要小君保存力气，能够安全地多走几趟。, page_refs: [p07, p08]}
  - {id: q03, type: compare, prompt: 村民起初怎样看整座山，又怎样看铺好的短路？, answer: 他们不相信山会很快消失，却能看见短路让车轮不再陷进泥里。, page_refs: [p10]}
  - {id: q04, type: evidence, prompt: 哪些变化说明工作已经不只属于愚公？, answer: 村民带来工具和食物，孩子计划接路，春天大家还在愚公到达前开工。, page_refs: [p11, p14, p15]}
  - {id: q05, type: main-idea, prompt: 这一册中，施工方法发生了什么变化？, answer: 它从愚公一家轮换劳动，变成按能力分工、让许多人接续的共同工作。, page_refs: [p01, p08, p10, p12, p15]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: 第一声锤响以后，愚公一家轮换着打凿、挖土和运石。平整石块铺进泥路，细碎石子则送往远处的荒洼。}]}
    - {id: p02, illustration: p02, paragraphs: [{text: 忙到日落，石壁只少了一小角。这个结果远小于整座山，却让他们看清硬石怎样裂开，也看清每筐能够装多少。}]}
    - {id: p03, illustration: p03, paragraphs: [{text: 智叟用杖头量过缺口，劝愚公别把晚年全用在这里。他没有嘲笑，只是不相信老人拥有足够多的秋天。}]}
    - {id: p04, illustration: p04, paragraphs: [{text: 愚公揉着发痛的手腕，说来年可以从第二角继续。智叟的行李车仍停在院中，他自己也没有轻易离开旧屋。}]}
    - {id: p05, illustration: p05, paragraphs: [{text: 邻家孩子小君常在远处观看。母亲只准她送水，因为锤旁会飞出碎屑，而滚动的大石也可能伤人。}]}
    - {id: p06, illustration: p06, paragraphs: [{text: 一块松石滚到小君脚边，她没有伸手去碰。第二天，她带来一只小筐，答应只捡大人已经敲下的小石头。}]}
    - {id: p07, illustration: p07, paragraphs: [{text: 母亲缩短筐绳，又在小君肩上垫布。小君先装三块，沿新铺的路慢慢走完一趟，一步也没有跑。}]}
    - {id: p08, illustration: p08, paragraphs: [{text: 第二趟，小君想把筐装满。阿莲取出一半，提醒她比较两种方法：一趟压坏肩膀，还是保留力气走十趟。}]}
    - {id: p09, illustration: p09, paragraphs: [{text: 小君走到半路就懂了。她换一边肩膀继续走，隔天又来。石子倒进荒洼的声音虽短，路上的小脚印却没有断。}]}
    - {id: p10, illustration: p10, paragraphs: [{text: 村民未必相信山很快会消失，但他们发现碎石路在雨后不再吞掉车轮。眼前的结果，使遥远的计划有了用处。}]}
    - {id: p11, illustration: p11, paragraphs: [{text: 有人带铁锤，有人削木楔，有人多煮一份午饭。大家来得并不整齐，有的干半天，有的过十天才回来。}]}
    - {id: p12, illustration: p12, paragraphs: [{text: 愚公不要求他们许下长久保证，只指出哪条石缝已经松动。每个人按照自己的力气和时间，接走一小段工作。}]}
    - {id: p13, illustration: p13, paragraphs: [{text: 冬雪封住山口，锤声停了。愚公在火边修工具，右手抖得系不紧麻绳，阿莲便让他开春少抡几下。}]}
    - {id: p14, illustration: p14, paragraphs: [{text: 窗外，小君和孩子们正用树枝扫开石路上的雪。他们争着计划解冻以后把哪一段路继续向前铺。}]}
    - {id: p15, illustration: p15, paragraphs: [{text: 春天，愚公走到山脚时，别人已经开始干活。年轻人接过重锤，小君长高了，原来的小筐显得更小。}]}
    - {id: p16, illustration: p16, paragraphs: [{text: 愚公扶着木杖站在新露出的石面前。这次他没有急着夺回锤子，只指出下一条裂缝，让年轻的手落下新一击。}]}
