schema_version: 3
language: en-US
writer: manypath-lantern
title: A Small Basket Extends the Road
summary: "Jun joins with a safe load, and visible changes in the gravel road persuade more villagers to take up the work."
chapters:
  - {id: c01, title: "One Corner of Stone", page_refs: [p01, p02, p03, p04, p05]}
  - {id: c02, title: "Basket and Wheel", page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: c03, title: "Work Passed Along", page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: character-motive, prompt: "Why did Zhi still urge Yu to stop?", answer: "He feared Yu would spend his remaining years while removing only a tiny corner.", page_refs: [p03, p04]}
  - {id: q02, type: cause-effect, prompt: "Why did Lian remove half of Jun's stones?", answer: "She wanted Jun to save her strength and make many safe trips.", page_refs: [p07, p08]}
  - {id: q03, type: compare, prompt: "How did villagers view the whole mountain and the short gravel road differently?", answer: "They doubted the mountains would vanish soon but saw that the short road kept wheels out of mud.", page_refs: [p10]}
  - {id: q04, type: evidence, prompt: "What evidence shows that the work no longer belonged only to Yu?", answer: "Villagers brought supplies, children planned extensions, and workers began before Yu arrived.", page_refs: [p11, p14, p15]}
  - {id: q05, type: main-idea, prompt: "How did the method of working change?", answer: "Yu's family rotated through the work before many people began sharing safe tasks over time.", page_refs: [p01, p08, p10, p12, p15]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "After the first ringing blow, Yu's family rotated among chiseling, digging, and carrying. Broad stones strengthened the muddy road, while smaller rubble filled distant hollows."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "By sunset the rock face had lost only one corner. The result looked tiny beside the mountains. It revealed how stone split and how much each basket held."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "Zhi measured the notch with his cane and urged Yu not to spend his final years there. He was not mocking Yu; he doubted one old man owned enough autumns."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "Rubbing his sore wrist, Yu said they could continue from the second corner next year. Yet Zhi's loaded cart remained at home because he could not easily abandon his old house."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "Jun often watched from a distance. Her mother allowed her to bring water, but chips flew near the hammers and rolling rocks could injure a child."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "When one loose stone rolled to Jun's feet, she left it alone. Next morning she brought a tiny basket and promised to gather only pieces that adults had already broken."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "Her mother shortened the strap and padded Jun's shoulder. Jun began with three stones and walked slowly along the new road without running once."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "On her second trip, Jun filled the basket high. Lian removed half and asked her to compare one crushing load with ten loads that left strength for another walk."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "Jun understood halfway there. She shifted the strap to her other shoulder and returned the next day. Each brief shower of stones was followed by another set of footprints."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "Villagers did not expect the mountains to vanish soon. However, the gravel no longer swallowed wheels after rain. The distant plan now gave an immediate result."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "One person brought a hammer, another shaped wedges, and another cooked extra food. Some worked half a day; others returned only after ten days."}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "Yu demanded no lasting promise. He showed which cracks were loose, and each neighbor accepted one task that matched available time and strength."}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "Winter snow closed the cut and silenced the hammers. By the fire Yu repaired handles, but his right hand shook until Lian tied the slipping cord."}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "Outside, Jun and other children brushed snow from the first gravel section. They debated which end they would extend after the ground softened."}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "In spring, work had begun before Yu reached the mountain. Young people lifted the heavy hammers, and Jun had grown enough to make her old basket look smaller."}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "Yu stood before the newly exposed stone with his wooden staff. Instead of reclaiming the hammer, he pointed out the next seam and watched younger hands strike."}]}
