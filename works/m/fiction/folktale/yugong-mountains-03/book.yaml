  - {id: guardian, kind: spirit, description: 发现工作可以代代接续而感到不安的守山神。, visual_identity: "A tall mountain guardian spirit with a weathered stone-gray face, long cloudlike white brows, an indigo layered robe edged in forest green, and a crooked pine-wood staff."}
