  - {id: yugong, kind: human, description: 看见后来人接手开路的年迈村民。, visual_identity: "An elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff."}
  - {id: lian, kind: human, description: 陪伴愚公并继续照料人与工具的妻子。, visual_identity: "An elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket."}
  - {id: zhisou, kind: human, description: 搬到山南后又沿新路返回的邻居。, visual_identity: "An elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart."}
