schema_version: 3
language: zh-CN
writer: 百径灯
title: 年年深入的锤声
summary: 智叟比较有限的人生与漫长工程，守山神却从年年接手的人群中看见另一种结果。
chapters:
  - {id: c01, title: 谁能等到终点, page_refs: [p01, p02, p03, p04, p05]}
  - {id: c02, title: 守山神听见了, page_refs: [p06, p07, p08, p09, p10]}
  - {id: c03, title: 山走以后, page_refs: [p11, p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: compare, prompt: 智叟和愚公怎样看待剩余的年月？, answer: 智叟认为有限年月不该投进看不见终点的工程，愚公认为后来人能从已有成果继续。, page_refs: [p02, p03, p04]}
  - {id: q02, type: evidence, prompt: 哪三步让守山神相信锤声可能到达山心？, answer: 缺口每年加深，老人慢下时年轻人接手，冬天以后施工总会恢复。, page_refs: [p06, p07, p08]}
  - {id: q03, type: character-motive, prompt: 守山神为什么如实说明缺口仍小？, answer: 他担心的不是眼前大小，而是工作能够持续并传给后来人。, page_refs: [p08, p09]}
  - {id: q04, type: cause-effect, prompt: 天帝听完禀告后做了什么？, answer: 他命夸娥氏二子把太行和王屋背到远方。, page_refs: [p09, p10, p11]}
  - {id: q05, type: evidence, prompt: 哪些景象证明绕路已经消失？, answer: 阳光直入村口，人们能直达田野，智叟的车也不再颠簸。, page_refs: [p12, p13, p14, p15]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: 春去秋来，锤声伴着蝉鸣和落叶一次次响起。愚公抡锤越来越少，年轻人却沿着他指出的裂缝继续向山腹开进。}]}
    - {id: p02, illustration: p02, paragraphs: [{text: 智叟终于选了晴天搬家。他的车经过工地时，看见愚公扶着锄头喘气，便问老人还能在这里守多少年。}]}
    - {id: p03, illustration: p03, paragraphs: [{text: 在智叟看来，搬家虽然艰苦，几趟以后就能结束。开山没有可见期限，不该耗掉愚公剩下的年月。}]}
    - {id: p04, illustration: p04, paragraphs: [{text: 愚公承认自己的日子会用完，却指向接锤的年轻人。石头不会长回去，明天来的人可以从今天的缺口继续。}]}
    - {id: p05, illustration: p05, paragraphs: [{text: 小君请智叟把车挪开，车轮稳稳落在众人铺的石路上。智叟看了一会儿，仍推着行李绕山去了南面。}]}
    - {id: p06, illustration: p06, paragraphs: [{text: 古老传说里，山中住着守山神。起初他不在意凡人的锤子，因为雷雨和地动都没能使两座山离开。}]}
    - {id: p07, illustration: p07, paragraphs: [{text: 可是寒冬过后，敲击总会恢复，而且比去年更深。老人渐渐弯腰，原来的孩子长高，新面孔又站到石壁前。}]}
    - {id: p08, illustration: p08, paragraphs: [{text: 守山神比较以后终于害怕了。单个人会疲倦、衰老或离开，这份工作却能从前一双手传到后一双手。}]}
    - {id: p09, illustration: p09, paragraphs: [{text: 他乘云禀告天帝，没有夸大眼前的缺口。他只说明三件事：路年年加长，锤声年年深入，工具总有人接过。}]}
    - {id: p10, illustration: p10, paragraphs: [{text: 天帝久久望着云下，随后召来夸娥氏二子。两位神人力大无穷，奉命把太行、王屋背到远方。}]}
    - {id: p11, illustration: p11, paragraphs: [{text: 村民没有看见神人到来。夜里，小君听见地底滚过一声春雷；阿莲碗里的水晃动，愚公坐起细听。}]}
    - {id: p12, illustration: p12, paragraphs: [{text: 清晨，南方阳光无遮无拦地照亮井台和屋檐。原先两山相接的地方，只剩平坦开阔的道路通向田野。}]}
    - {id: p13, illustration: p13, paragraphs: [{text: 人们推车走上新路，又高兴地折回来。小君寻找从前的小缺口，却只看见村边留下的碎石路和石缝细草。}]}
    - {id: p14, illustration: p14, paragraphs: [{text: 智叟从山南回来，车上又装着行李。他走的是刚出现的直路，锅和箱笼没有撞石，车轮也不必越过泥坑。}]}
    - {id: p15, illustration: p15, paragraphs: [{text: 阿莲问他为何回来。智叟只说路已经变短，随后低头查看碎石路上的车轮。松开的绳结仍由阿莲替他系紧。}]}
    - {id: p16, illustration: p16, paragraphs: [{text: 愚公没有取笑他，而是扶住另一边车辕。两个老人并肩推车回村，小君的空筐在他们身旁轻轻摇动。}]}
