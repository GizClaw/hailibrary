schema_version: 3
language: zh-CN
writer: 百径灯
title: 山前的两种选择
summary: 一次艰难的绕山试走，让愚公、阿莲和智叟看见搬家与开路各自会带来什么。
chapters:
  - {id: c01, title: 一条被挡住的路, page_refs: [p01, p02, p03, p04, p05]}
  - {id: c02, title: 推车去山南, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: c03, title: 算过以后, page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: cause-effect, prompt: 病童的车为什么很晚才到医者那里？, answer: 大山挡住直路，车又陷在泥泞的绕山路上。, page_refs: [p01, p02]}
  - {id: q02, type: character-motive, prompt: 阿莲为什么要求先去山脚查看？, answer: 她要知道石头多硬、土石多重，以及计划会占用多少家务时间。, page_refs: [p04, p05]}
  - {id: q03, type: compare, prompt: 搬家和开路分别能帮助谁？, answer: 搬家能较快解决一户的绕路，开路很慢却可能帮助留在村里的所有人。, page_refs: [p10, p11, p12, p13]}
  - {id: q04, type: evidence, prompt: 哪些细节说明搬家并不轻松？, answer: 车轮反复卡住，三个人到傍晚才到山南，而且手脚都磨出了泡。, page_refs: [p08, p09]}
  - {id: q05, type: short-answer, prompt: 阿莲怎样使开山计划更实际？, answer: 她要求量好每一筐，安排每天的劳动和休息，还分配家务。, page_refs: [p14, p15]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: 很久以前的传说里，太行、王屋并排挡在村子南面。去田地、集市或医者家的人，都得先向东绕，再穿过狭窄谷口。}]}
    - {id: p02, illustration: p02, paragraphs: [{text: 一个雨夜，邻居送发烧的孩子去山南，车轮却陷进泥坑。愚公和村民抬出车子时，山后的月亮已经升高。}]}
    - {id: p03, illustration: p03, paragraphs: [{text: 第二天，愚公用木棍从村口向南画了一条直线。绕路耗掉的时辰太多，他想从两山相接处开出一条路。}]}
    - {id: p04, illustration: p04, paragraphs: [{text: 晚饭时，阿莲没有马上赞成。她问硬石怎样凿，土石送到哪里，愚公上山时谁来准备柴火和冬粮。}]}
    - {id: p05, illustration: p05, paragraphs: [{text: 愚公没有说困难自然会消失。他答应先去查看。山脚薄土下面全是青灰硬石，半筐碎石已经把阿莲的手勒痛。}]}
    - {id: p06, illustration: p06, paragraphs: [{text: 智叟推来一辆装着锅、席子和衣物的小车。他准备搬到山南，因为那里靠近集市，冬天也能多晒一会儿太阳。}]}
    - {id: p07, illustration: p07, paragraphs: [{text: “先试我的办法。”智叟请他们同行。三人卸下沉箱，只带较轻的家当，想看看搬一户人家究竟需要多少力气。}]}
    - {id: p08, illustration: p08, paragraphs: [{text: 到了乱石坡，车轮一会儿悬空，一会儿卡死。智叟拉车，愚公用肩推，阿莲不断搬开轮前的石块。}]}
    - {id: p09, illustration: p09, paragraphs: [{text: 中午过去，他们仍在山影里。锅一摇晃就要停下绑紧。直到傍晚，三人才带着磨痛的手脚走到南面田野。}]}
    - {id: p10, illustration: p10, paragraphs: [{text: 智叟认为再走几趟就能搬完，辛苦虽然大，却有明确的终点。愚公回头时，山脊已经遮住整个旧村。}]}
    - {id: p11, illustration: p11, paragraphs: [{text: 阿莲想到不能远行的老人，也想到只有一个大人的邻家。若各户都搬，谁先帮谁，旧屋、水井和田地又怎么办？}]}
    - {id: p12, illustration: p12, paragraphs: [{text: 智叟承认每家只能自己决定。他也提醒愚公，开山可能用掉一生，最后仍只是石壁上的一个浅坑。}]}
    - {id: p13, illustration: p13, paragraphs: [{text: 三人摸黑推车回村。搬家能让一户较快结束绕行，却不能替别人选择。开路能留下共同通道，却慢得看不见终点。}]}
    - {id: p14, illustration: p14, paragraphs: [{text: 阿莲处理好脚上的水泡，又补完耽误的家务。她修起破筐，对愚公说：“要做，就得先量每一筐，也要算每天的活。”}]}
    - {id: p15, illustration: p15, paragraphs: [{text: 她要求轮流运石、留下人守家，还要愚公按时休息。愚公把钝凿子放在灯下，答应让她决定何时停手。}]}
    - {id: p16, illustration: p16, paragraphs: [{text: 霜降前，第一声铁响沿山壁滚开。石上只掉下一粒小石屑，但这一次，他们是在算清困难以后才挥下锤子。}]}
