schema_version: 3
language: en-US
writer: manypath-lantern
title: Two Choices Before the Mountain
summary: "A difficult trial journey shows Yu, Lian, and Zhi what moving away and opening a road would each require."
chapters:
  - {id: c01, title: "The Blocked Way", page_refs: [p01, p02, p03, p04, p05]}
  - {id: c02, title: "Pushing South", page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: c03, title: "After Counting the Cost", page_refs: [p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: cause-effect, prompt: "Why did the sick child's cart reach the healer so late?", answer: "The mountains blocked the direct way and the cart became stuck on the muddy detour.", page_refs: [p01, p02]}
  - {id: q02, type: character-motive, prompt: "Why did Lian insist on examining the slope?", answer: "She wanted evidence about the hard rock, heavy loads, and work the plan would interrupt.", page_refs: [p04, p05]}
  - {id: q03, type: compare, prompt: "Who could benefit from moving and from opening a road?", answer: "Moving could quickly help one household, while a road might eventually help everyone who remained.", page_refs: [p10, p11, p12, p13]}
  - {id: q04, type: evidence, prompt: "What evidence showed that moving was difficult?", answer: "The wheels repeatedly stuck, the trip lasted until evening, and the travelers had blisters.", page_refs: [p08, p09]}
  - {id: q05, type: short-answer, prompt: "How did Lian make the road plan more practical?", answer: "She measured every load, divided work and chores, and required Yu to rest.", page_refs: [p14, p15]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "In the old legend, Taihang and Wangwu stood together south of a village. Travelers heading to fields, markets, or a healer had to detour east and return through a narrow ravine."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "One rainy night, a neighbor carried his feverish child toward the south. The cart sank in mud, and the moon was high before Yu and others freed its wheel."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "At dawn Yu drew a straight line from the village gate toward the hidden fields. The detour consumed too many hours, so he imagined a road between the mountains."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "At supper Lian did not agree at once. She asked how they would break hard rock, carry it away, cut winter wood, and protect their grain."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "Yu promised to inspect the slope instead of dismissing her questions. Thin soil covered solid blue-gray stone, and half a basket of rubble already hurt Lian's hands."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "Zhi arrived with a cart holding a pot, mat, and clothes. He planned to move south, where the market was close and winter sunlight lasted longer."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "“Test my smaller plan first,” Zhi urged. They removed the heavy chest and carried only lighter belongings, hoping to measure what moving one household would truly demand."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "On the loose-stone slope, one wheel hung in the air while the other jammed. Zhi pulled, Yu pushed with his shoulder, and Lian cleared each new obstacle."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "Noon passed while they remained in mountain shadow. They stopped whenever the pot shook loose, and reached the southern fields near sunset with blistered hands and feet."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "Zhi argued that several more trips would finish the move. The labor was painful but had a clear ending. Behind them, the ridge hid every village roof."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "Lian remembered an elder who could not walk far and Jun's household with only one adult. If everyone moved, who would help first, and what would happen to wells and fields?"}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "Zhi admitted that each family must choose for itself. He also warned that Yu might spend his whole life opening no more than a shallow dent."}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "They guided the cart home after dark. Moving could end one family's detour soon, but not another's. A shared road could help many people, but its ending could not be seen."}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "Lian treated their blisters and completed the chores they had missed. While repairing the basket, she told Yu to measure every load and every working day."}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "She required workers to rotate, someone to remain home, and Yu to rest on time. He placed his dull chisel beneath the lamp and accepted her conditions."}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "Before the first frost, iron rang across the rock face. Only a tiny chip fell, but this blow came after they had tested both choices and counted the difficulties."}]}
