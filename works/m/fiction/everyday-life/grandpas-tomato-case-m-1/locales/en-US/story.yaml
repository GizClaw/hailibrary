schema_version: 3
language: en-US
writer: north-star-map
title: "The Tomato Case, Part One: A Cat on Trial"
summary: Grandpa builds a case against Mittens, while Maya tests whether each clue supports his confident answer.
chapters:
  - {id: ch01, title: A Valuable Crop, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: The First Suspect, page_refs: [p05, p06, p07, p08, p09, p10]}
  - {id: ch03, title: A Better Test, page_refs: [p11, p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: character-motive, prompt: "Why do the missing tomatoes matter so much to Grandpa?", answer: "He grew them for a lunch with old friends after bringing nothing to their last meal.", page_refs: [p01, p02]}
  - {id: q02, type: evidence, prompt: "Which clue shows that Mittens visited but does not prove he stole?", answer: "His paw prints lead to the crate and stop far from the tomato bed.", page_refs: [p07, p09]}
  - {id: q03, type: compare, prompt: "How do Grandpa and Maya use the white fur differently?", answer: "Grandpa treats it as proof, while Maya considers how brushing could place it there.", page_refs: [p03, p04]}
  - {id: q04, type: cause-effect, prompt: "Why does Grandpa's fence test weaken his first answer?", answer: "The blocked gap stays untouched even though another tomato is bitten.", page_refs: [p12, p13]}
  - {id: q05, type: main-idea, prompt: "What changes in the investigation by the last page?", answer: "They stop trying only to catch Mittens and begin following evidence of another animal.", page_refs: [p13, p16]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "Grandpa was salting cold noodles when he saw the third empty stem. His hand stopped, but the salt kept falling. Another tomato had vanished before Saturday's lunch."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "Grandpa had tended the vines all summer. He wanted to serve the first ripe crop to old railroad friends. He had brought nothing to their last meal."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "He named Mittens, the white cat next door. Maya asked whether he had watched Mittens take anything. Grandpa had not, so she recorded only the missing fruit."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "White hairs under the fence looked suspicious. Yet Mrs. Alvarez had brushed Mittens nearby, and loose fur had blown across both yards. The clue allowed two explanations."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "Grandpa propped enamel basins on sticks and tied them to strings. During his test, both basins crashed down and captured only his battered straw hat."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "While they waited, Maya made columns for time, sightings, and traces. Grandpa wanted a quick capture; she wanted a record they could examine afterward."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "At last Mittens crossed the wall. Instead of watching the tomatoes, he froze and stared at an overturned crate beside the ivy-covered drain. Something rustled there."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "Grandpa pulled too early. An empty basin struck the soil, Mittens fled, and Mrs. Alvarez looked over the wall. Maya said only that a basin had fallen."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "A wet paw print pleased Grandpa. However, Maya followed the whole trail. The prints ran from Mrs. Alvarez's yard to the crate, never reaching the tomato bed."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "That evening Mrs. Alvarez shared fresh fritters. Grandpa hid the basins and did not offer his usual tomato. Maya realized his accusation could hurt a real neighbor."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "Grandpa's next choice was a flour ring. Rain turned it into paste, leaving no useful tracks. They rescued two snails and recorded another failed result."}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "For a cleaner test, Grandpa blocked the fence gap and set three pebbles before it. If Mittens entered there, the pebbles should move."}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "The pebbles stayed still, but a green tomato gained tiny bite marks. Grandpa could no longer use the white fur to explain every missing or damaged fruit."}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "He placed a soft tomato under a tilted basket and spread dry bean pods as an alarm. Maya brought a camera and warned him not to rush."}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "In the dark shed, Grandpa's peppermint clicked louder than the bean pods. Then Mittens arrived, ignored the bait, and stalked toward the old crate."}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "Mittens chased a gray-brown blur through squash leaves. The bait vanished along a separate drag mark. Two events happened together, but another creature connected them."}]}
