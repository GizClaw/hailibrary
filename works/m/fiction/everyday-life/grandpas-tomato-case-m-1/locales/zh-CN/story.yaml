schema_version: 3
language: zh-CN
writer: 北辰
title: 番茄疑案（一）：猫的证词
summary: 爷爷一心证明黑耳朵有罪，小满却逐项检验每条线索能说明什么。
chapters:
  - {id: ch01, title: 要紧的番茄, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 第一个嫌疑者, page_refs: [p05, p06, p07, p08, p09, p10]}
  - {id: ch03, title: 换一种检验, page_refs: [p11, p12, p13, p14, p15, p16]}
questions:
  - {id: q01, type: character-motive, prompt: "爷爷为什么格外在意这批番茄？", answer: "他想用亲手种的番茄招待老朋友，补上次空手赴约的遗憾。", page_refs: [p01, p02]}
  - {id: q02, type: evidence, prompt: "哪条线索只能证明黑耳朵来过？", answer: "猫脚印通向木箱，却没有走到番茄架。", page_refs: [p07, p09]}
  - {id: q03, type: compare, prompt: "爷爷和小满怎样解释围栏边的白毛？", answer: "爷爷把白毛当成猫偷番茄的证据，小满认为白毛也可能是梳毛时被风吹来的。", page_refs: [p03, p04]}
  - {id: q04, type: cause-effect, prompt: "围栏试验为什么削弱了爷爷的判断？", answer: "围栏没有被碰过，青番茄却仍被咬了。", page_refs: [p12, p13]}
  - {id: q05, type: main-idea, prompt: "调查到最后发生了什么变化？", answer: "他们不再只想抓猫，而是开始寻找另一只动物的痕迹。", page_refs: [p13, p16]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "爷爷正往凉面里撒盐，忽然看见第三根空梗。他的手停了，盐却没有停。星期六聚餐前，又少了一个番茄。"}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "爷爷照料了菜架整整一个夏天。上次与老伙伴聚会，他因膝盖治疗空手赴约，这次想端出自己种的第一批番茄。"}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "他认定小偷是隔壁的黑耳朵。小满问他是否亲眼看见猫摘番茄。爷爷没有看见，她便只记下“番茄少了”。"}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "围栏下的白毛很可疑。可是陈姨曾在旁边给猫梳毛，风又把毛吹得到处都是。同一条线索有两种解释。"}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "爷爷用木棍支起搪瓷盆，再系上细绳。他试着一拉，两只盆哐当落下，只扣住了自己的旧草帽。"}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "蹲守时，小满画出时间、看见的东西和痕迹三栏。爷爷想马上抓到猫，她却想留下能反复核对的记录。"}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "黑耳朵终于走上墙头。它没有盯着番茄，反而望向常春藤旁的倒木箱。箱后还有什么东西发出轻响。"}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "爷爷过早拉绳。空盆砸在土上，猫逃了，陈姨也从墙外探头。小满只回答说，有一只盆掉了。"}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "一枚湿猫印让爷爷很得意。小满却沿着整串脚印查看：它们从隔壁通向木箱，离番茄架还有一段距离。"}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "晚饭时，陈姨仍送来刚炸的藕盒。爷爷藏起搪瓷盆，也没有像平常那样送她番茄。小满看出，猜疑已经伤到邻里。"}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "爷爷又在菜架边撒了一圈面粉。夜雨把它变成白泥，没有留下有用脚印。他们救出蜗牛，记下又一次失败。"}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "为了做一次更清楚的检验，爷爷堵住围栏缺口，并在木板前摆好三颗石子。猫若经过，石子应该移动。"}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "石子一颗没动，青番茄却多了细小牙印。爷爷终于明白，围栏边的白毛不能解释后来发生的每件事。"}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "他把软番茄放在斜支的竹筛下，又铺开干豆荚当警报。小满带好相机，提醒他这回不要抢先下结论。"}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "黑暗的工具棚里，爷爷的薄荷糖比豆荚还响。黑耳朵出现后绕开诱饵，悄悄逼近墙边的旧木箱。"}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "猫追着灰褐色影子钻入南瓜叶，番茄却沿另一道拖痕消失。两件事同时发生，中间还藏着一只没看清的动物。"}]}
