schema_version: 3
language: en-US
writer: north-star-map
title: "The Tomato Case, Part Two: What the Tracks Connected"
summary: Three linked clues reveal the night visitor, and Grandpa chooses a costly, honest way to repair his mistake.
chapters:
  - {id: ch01, title: A Different Trail, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: The Visitor's Route, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: Repairing More Than a Basket, page_refs: [p09, p10, p11, p12, p13]}
  - {id: ch04, title: After the Case, page_refs: [p14, p15, p16]}
questions:
  - {id: q01, type: evidence, prompt: "Which three clues connect the civet to the missing tomatoes?", answer: "The long-toed tracks match the sand trail, the civet carries a split tomato, and it takes the fruit toward the drain.", page_refs: [p01, p06, p07]}
  - {id: q02, type: compare, prompt: "How is Maya's sand plan different from Grandpa's basket plan?", answer: "Maya protects the crop and watches an undisturbed route, while Grandpa used food to lure and catch a suspect.", page_refs: [p03, p06]}
  - {id: q03, type: character-motive, prompt: "Why does Grandpa repair the basket before morning?", answer: "He has decided to bring a serious apology and wants the gift to show care.", page_refs: [p09, p10]}
  - {id: q04, type: cause-effect, prompt: "How does giving away six tomatoes affect Grandpa's lunch?", answer: "He has fewer tomatoes for his friends, so the final noodle bowl is less red.", page_refs: [p10, p15]}
  - {id: q05, type: main-idea, prompt: "What does Grandpa repair after solving the mystery?", answer: "He repairs the neighborly trust damaged by his unsupported accusation.", page_refs: [p11, p12, p13]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "Beneath a squash leaf, Maya found long-toed prints beside a tomato drag mark. Mittens's round paw prints crossed sideways, suggesting he had chased rather than carried the fruit."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "Maya showed the photographs to her science teacher. Instead of naming an animal, the teacher asked which nearby night visitor could hold food and enter a narrow drain."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "Grandpa wanted another baited trap. Maya chose a different test. She covered the ripe tomatoes and smoothed fine sand near the crate without offering extra food."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "They also recorded sounds they might cause themselves. The shed hinge squeaked, and Grandpa's peppermint clicked. Their own noise should not become evidence against an animal."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "Near nine, a pointed nose and masked eyes appeared beside the crate. A small Asian palm civet entered the garden while Mittens stayed away."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "The civet ignored every mesh-covered tomato. She found half a fruit that had split below the vines and held it between her front paws."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "After several bites, she carried the rest toward the broken drain. Her route crossed the fine sand, leaving the same slender toes Maya had photographed."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "Tiny squeaks came from inside. Grandpa kept the flashlight outside the opening. The tracks, carried fruit, and hidden young now formed one connected explanation."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "That night Grandpa compared two choices. He could quietly cross out Mittens's name, or he could face Mrs. Alvarez. He repaired a basket handle."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "In the morning he picked his six finest tomatoes. Those fruits had been meant for old friends, so the apology cost something he truly valued."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "At Mrs. Alvarez's door, Grandpa admitted that he had pulled the basin and repeated claims he could not prove. He offered no excuse before saying sorry."}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "Mrs. Alvarez said his words had made her angry. She also said she heard his apology. Grandpa waited until she chose to accept the basket."}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "When Mrs. Alvarez held a tomato near Mittens, he leaned away in disgust. Their shared laughter did not erase the mistake, but it reopened the friendship."}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "A wildlife officer later checked the drain. The neighbors waited for the family to leave, secured trash, removed the crate, and only then closed the opening."}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "Grandpa's friends still came on Saturday. The noodle bowl held fewer tomatoes, so he told them where six had gone. They answered with mistakes of their own."}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "Grandpa hung a plain tomato picture beside the vines to slow down the detective. When Mittens returned to inspect it, Maya's notebook fell into the grass as she laughed."}]}
