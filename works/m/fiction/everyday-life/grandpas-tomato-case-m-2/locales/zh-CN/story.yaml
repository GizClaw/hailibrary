schema_version: 3
language: zh-CN
writer: 北辰
title: 番茄疑案（二）：脚印连起的真相
summary: 四条相连的证据揭开夜客身份，爷爷也用有分量的行动修补自己的错误。
chapters:
  - {id: ch01, title: 另一条路, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 夜客的路线, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: 不只修篮子, page_refs: [p09, p10, p11, p12, p13]}
  - {id: ch04, title: 结案以后, page_refs: [p14, p15, p16]}
questions:
  - {id: q01, type: evidence, prompt: "哪四条证据说明果子狸选择了什么、走向哪里，以及洞里有什么？", answer: "果子狸没有碰任何网袋。它从藤下找到半个自然裂开的番茄，用两只前爪抱住，安静地吃了几口。经过细沙时，它留下长趾脚印，正和小满拍到的痕迹一样。洞里响起幼崽的细叫。", page_refs: [p06, p07, p08]}
  - {id: q02, type: compare, prompt: "小满的细沙办法和爷爷的目标有什么不同？", answer: "爷爷想用检验抓住访客。她给熟番茄套上网袋，只在木箱旁铺细沙，不再额外摆食物。", page_refs: [p03]}
  - {id: q03, type: character-motive, prompt: "爷爷为什么深夜修好竹篮？", answer: "当晚，爷爷面对两种选择：悄悄划掉黑耳朵的名字，或亲自去见陈姨。他坐在厨房里，把松掉的篮把重新缠紧。", page_refs: [p09]}
  - {id: q04, type: cause-effect, prompt: "送出六个番茄怎样影响了聚餐？", answer: "爷爷仍用较少的番茄做了拌面，也告诉老伙伴六个番茄去了哪里。", page_refs: [p10, p15]}
  - {id: q05, type: short-answer, prompt: "查清真相以后，爷爷还修补了什么？", answer: "笑声没有抹掉错误，却重新打开了来往。", page_refs: [p13]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "南瓜叶下，长趾脚印贴着碎豆荚。猫的圆脚印横着穿过小路，没有靠近叶子。分开的路线说明，两只动物始终保持着距离。"}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "小满把照片带给自然课老师。老师没有公布答案。他只问哪种夜行动物能用前爪拿食物，还能钻进狭窄的排水沟。"}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "爷爷想用检验抓住访客。小满换了目标：只观察它的路线。她给熟番茄套上网袋，只在木箱旁铺细沙，不再额外摆食物。"}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "他们还记录自己可能弄出的声音。门轴会吱响，薄荷糖会轻敲牙齿。人的动静不能再被算到动物头上。"}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "九点左右，木箱旁先露出尖鼻子，接着是圆耳朵和花脸。一只小果子狸走进菜园，黑耳朵却没有出现。"}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "果子狸没有碰任何网袋。它从藤下找到半个自然裂开的番茄，用两只前爪抱住，安静地吃了几口。"}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "它叼起剩下的果肉走向破排水沟。经过细沙时，它留下长趾脚印，正和小满拍到的痕迹一样。"}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "洞里响起幼崽的细叫。爷爷只把手电照在洞外。脚印、被带走的食物和幼崽终于连成一个完整解释。"}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "当晚，爷爷面对两种选择：悄悄划掉黑耳朵的名字，或亲自去见陈姨。他坐在厨房里，把松掉的篮把重新缠紧。"}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "清晨，他摘下六个最大最红的番茄。这些果子原本要招待老伙伴，因此这次道歉用上了他真正舍不得的东西。"}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "爷爷到陈姨门口承认，是自己过早拉下搪瓷盆，还在墙边说了没有根据的话。他没有先解释，只认真说了对不起。"}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "爷爷道歉后，陈姨才接过篮子。她拿起一个番茄送到黑耳朵鼻边，爷爷没有为自己解释。"}]}
    - {id: p13, illustration: p13, paragraphs: [{text: "黑耳朵立刻嫌弃地后仰，三个人一起笑了。笑完以后，陈姨说那些指责确实让人生气，不过今天的道歉她也听清了。笑声没有抹掉错误，却重新打开了来往。"}]}
    - {id: p14, illustration: p14, paragraphs: [{text: "救助人员检查了排水沟。邻居们等果子狸一家离开，再收好垃圾、搬走木箱，最后封住已经空下来的破口。"}]}
    - {id: p15, illustration: p15, paragraphs: [{text: "星期六，爷爷仍用较少的番茄做了拌面，也告诉老伙伴六个番茄去了哪里。大家没有取笑他，反而讲起各自认错人的往事。"}]}
    - {id: p16, illustration: p16, paragraphs: [{text: "爷爷在菜架边挂了一块只画番茄的木牌，提醒侦探慢一点。黑耳朵又来闻木牌时，小满笑得把本子掉进草里。"}]}
