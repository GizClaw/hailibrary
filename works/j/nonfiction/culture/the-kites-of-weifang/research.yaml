schema_version: 1
required: true
sources:
  - url: https://www.sport.gov.cn/n20001280/n20745751/n20767274/c22230699/content.html
    publisher: General Administration of Sport of China
    claims:
      - A Weifang maker summarizes the craft as forming the bamboo structure, attaching a covering, painting it, and preparing it to fly.
      - Bamboo strips are used for the supporting structure, and a covering is glued to it before the design is painted.
  - url: https://www.sdxc.gov.cn/whql/whcc/202005/t20200513_11585750.htm
    publisher: Publicity Department of the CPC Shandong Provincial Committee
    claims:
      - Traditional Weifang kite work includes shaping and tying bamboo, covering the structure, painting, attaching line, and test flying.
      - Frame symmetry, covering thickness and tightness, and bamboo stiffness can affect flight.
  - url: https://www.sdxc.gov.cn/whql/whcc/202009/t20200907_11617486.htm
    publisher: Publicity Department of the CPC Shandong Provincial Committee
    claims:
      - Weifang kites may use a bamboo structure, a silk covering, and hand painting.
      - Weifang kite styles are known for careful construction, bright painting, and agile flight.
  - url: https://www.mct.gov.cn/whzx/qgwhxxlb/sd/202009/t20200914_875076.htm
    publisher: Ministry of Culture and Tourism of the People's Republic of China
    claims:
      - The first Weifang International Kite Festival was founded in 1984 and the event became annual.
      - The festival began with kite teams from multiple countries and regions and supports international kite exchange.
      - Weifang kite-making craftsmanship entered China's first national intangible cultural heritage list in 2006.
  - url: https://www.grc.nasa.gov/WWW/k-12/VirtualAero/BottleRocket/airplane/kitepart.html
    publisher: NASA Glenn Research Center
    claims:
      - A kite has a supporting structure and a thin covering that may be paper or cloth.
      - Bamboo can provide a light, strong structural material, and the bridle point can be adjusted to change flight behavior.
  - url: https://www.grc.nasa.gov/www/k-12/airplane/kitestab.html
    publisher: NASA Glenn Research Center
    claims:
      - The control line joins the bridle at a bridle point, and a kite rotates around that point in flight.
      - A balanced and stable design can return toward its balanced condition after a small change.
  - url: https://www.nasa.gov/wp-content/uploads/2023/06/kites-k4.pdf
    publisher: NASA
    claims:
      - Children's kite guidance says never to fly a kite near a power line or in a thunderstorm.
  - url: https://www.sdxc.gov.cn/sy/tp/202504/t20250419_15819309.htm
    publisher: Publicity Department of the CPC Shandong Provincial Committee
    claims:
      - The 2025 world kite championship in Weifang gathered teams and participants from many countries and regions.
  - url: https://www.sdxc.gov.cn/fzgg/whzh/202503/t20250326_15709776.htm
    publisher: Publicity Department of the CPC Shandong Provincial Committee
    claims:
      - The 2025 Weifang International Kite Festival opened in April, in spring.
      - Festival events included traditional and modern kite displays by teams from China and other countries and regions.
  - url: https://www.sport.gov.cn/n20001280/n20001265/n20067706/c29523504/content.html
    publisher: General Administration of Sport of China
    claims:
      - Kites flown in Weifang in spring include dragon, bird, butterfly, and fish shapes.
notes: Xiaoman, Master Gao, their workshop visit, and their particular kite are fictional. The text presents paper and silk as possible traditional coverings rather than claiming that both are used on every kite. The low indoor lift and outdoor launch are described as tests, not as proof that one adjustment alone caused the final flight.
