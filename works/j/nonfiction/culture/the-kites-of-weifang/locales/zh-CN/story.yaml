schema_version: 2
language: zh-CN
writer: 雨歌
title: 潍坊的风筝
summary: 小满走进潍坊的风筝作坊，跟着高师傅用竹条和纸做了一只小风筝。两次检查让他们及时改好骨架和提线。在国际风筝会上，小满发现，风筝不只要画得好看，还要做得仔细、试得认真。
chapters:
  - id: ch01
    title: 先看竹条
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 糊纸以后再试试
    page_refs: [p06, p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 风筝飞进春风
    page_refs: [p13, p14]
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 竹骨架改好以后，小满又做了哪些事？
    answer: 她选纸、糊纸、画图案，还提起风筝检查平衡。
    page_refs: [p05, p06, p07, p08, p09, p10]
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 高师傅为什么移动提线上的结？
    answer: 第一次提起风筝时，一边翅膀偏低，所以他移动了线结，再让小满检查。
    page_refs: [p10, p11]
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 小满为什么想在糊纸前检查骨架？
    answer: 她想趁竹条还露在外面，早点找出两边不一样的地方。
    page_refs: [p04, p05]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 哪些事说明风筝需要多次检查？
    answer: 没糊纸的骨架一边偏长，糊纸后的风筝又有一边偏低，他们改好以后才去空地试飞。
    page_refs: [p05, p10, p11, p12]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 小满做了风筝，又参加风筝会，她明白了什么？
    answer: 风筝不只要画得好看，还要把骨架、纸面和提线做好，并认真试飞。
    page_refs: [p03, p05, p07, p08, p11, p12, p13, p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 春风吹进潍坊的小巷。小满走进高师傅的风筝作坊，想亲手做一只风筝，带到国际风筝会上。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 墙上挂满了风筝，高师傅却先拿出一长一短两根竹条。小满看到一只没上色的燕子风筝，问：“我能做燕子风筝吗？”高师傅笑着说：“能，不过得先把它的翅膀做平。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 高师傅慢慢弯竹条，再用线扎成轻巧的
            - vocabulary: {id: frame, text: 骨架}
            - text: 。小满扶稳一头，看着另一头弯出弧形。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 两边翅膀上的竹条本该一样长，可右边多出了一点。小满说：“先试一试吧，糊上纸就不容易看清了。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 她捏住中间的线结，提起没糊纸的骨架，长的一边马上向下落。高师傅修短竹条，再提起来，两边齐了。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 传统潍坊风筝有的糊纸，有的糊丝绢。小满选了浅色纸，纸轻，画上颜色也看得清。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 高师傅沿竹条刷上胶水。小满从中间向两边轻轻抚平纸面。纸没有皱起来。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 纸干了，小满画出红翅膀。她又添上青色和金色的羽毛。高师傅在一旁调颜料，小满自己选颜色。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 接着，高师傅给风筝拴上提线，放飞线要接在提线的一个点上。这个点换了位置，风筝飞起来可能会往一边斜。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 小满从接线点提起风筝，检查它的
            - vocabulary: {id: balance, text: 平衡}
            - text: 。左边翅膀低了下来。她笑着说：“画完了，还没有试完呢。”
    - id: p11
      illustration: p11
      paragraphs:
        - text: 高师傅把提线上的结移了一点，小满再提，两边翅膀一样高了。不过，风筝在外面的风里会怎样，还得去空地试。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 他们来到没有电线的空地，只让风筝低低飞了一小段。风筝先向一边偏，他们停下来又调了一次。第二次试飞稳多了。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 风筝会那天，许多国家和地区的风筝队来到潍坊。小满看见长长的龙、彩色的鸟，还有没见过的新样子。它们一起飞进春风。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 小满的红燕子也稳稳升起。她看见两边翅膀一直齐平，手里的线也没有忽松忽紧。
