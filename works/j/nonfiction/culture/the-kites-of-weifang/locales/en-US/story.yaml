schema_version: 2
language: en-US
writer: rain-song
title: The Kites of Weifang
summary: In a Weifang workshop, Xiaoman helps Master Gao build a small kite from bamboo and paper. Checks of the frame and painted kite reveal problems before the field test. At the international kite festival, the steady kite shows why each careful step mattered.
chapters:
  - id: ch01
    title: A Shape from Bamboo
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: Paper, Paint, and a Test
    page_refs: [p06, p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: Kites from Many Places
    page_refs: [p13, p14]
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What does Xiaoman do after the bamboo frame is even?
    answer: She chooses paper, helps attach it, paints the kite, and then tests its balance.
    page_refs: [p05, p06, p07, p08, p09, p10]
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why does Master Gao move the string knot?
    answer: One wing hangs low during the first test, so he adjusts the knot before another test.
    page_refs: [p10, p11]
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Xiaoman ask to test the frame before covering and painting it?
    answer: She wants to find an uneven bamboo end before the paper hides it.
    page_refs: [p04, p05]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: Which details show that checking the kite more than once is useful?
    answer: The frame first falls lower on one side, the painted kite later hangs low at one wing, and both problems are adjusted before the festival flight.
    page_refs: [p05, p10, p11, p14]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What main idea does Xiaoman learn in the workshop and at the festival?
    answer: Careful building and testing help a kite fly; colorful painting alone does not.
    page_refs: [p03, p05, p07, p08, p11, p12, p14]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: On a spring morning, Xiaoman enters Master Gao's kite workshop in Weifang. She hopes to make a kite for the city's international festival.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Finished kites fill the room, but Master Gao begins with two thin pieces of bamboo. Xiaoman sees a swallow kite with no color. “Can mine be a swallow?” she asks. He nods and places the pieces across each other.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Master Gao shapes the bamboo with care and ties it into a light "
            - vocabulary: {id: frame, text: frame}
            - text: ". Xiaoman holds one end steady while he works on the other."
    - id: p04
      illustration: p04
      paragraphs:
        - text: The two wings should match, yet one bamboo end sticks out. “Let's check it now,” Xiaoman says. “The paper may hide the small difference.”
    - id: p05
      illustration: p05
      paragraphs:
        - text: She lifts the frame from the middle. One side falls lower. Master Gao cuts a little from the long end, and the next lift looks even.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Some Weifang kites use paper over bamboo. Others use silk. Xiaoman chooses plain paper that feels light in her hands.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Master Gao spreads paste along the bamboo. Xiaoman presses the paper from the center toward each wing, so the cover lies flat.
    - id: p08
      illustration: p08
      paragraphs:
        - text: When the paper dries, Xiaoman paints red wings and blue and gold feathers on the swallow. Master Gao mixes paint in plain bowls while she works.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Next Master Gao ties a short string to the frame. He ties the flying line to it with a knot. Moving the knot can change how the kite flies.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Xiaoman lifts the kite by the knot to test its "
            - vocabulary: {id: balance, text: balance}
            - text: ". The left wing hangs low. “I finished painting, but we aren't done checking,” she says."
    - id: p11
      illustration: p11
      paragraphs:
        - text: Master Gao moves the knot a little. Xiaoman lifts the kite again, and both wings stay level. Only a field test can show what it does in wind.
    - id: p12
      illustration: p12
      paragraphs:
        - text: They try a low launch in a clear field away from power lines. The kite pulls to one side, so they stop and make one more small change. The next short flight is steadier.
    - id: p13
      illustration: p13
      paragraphs:
        - text: On festival day, people come from China and many other countries. Xiaoman sees long dragons, bright birds, and new shapes, each made to meet the wind.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Her swallow rises above the field without turning over. Xiaoman feels a steady pull on the line. “The kite is staying level,” she tells Master Gao. “The line pulls steadily now.”
