schema_version: 1
style: cut-paper-collage
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  characters:
    xiaoman: Chinese girl age seven, round face, black hair in two low buns with teal bands, mustard-yellow jacket, teal trousers, red canvas shoes, blue cloth shoulder bag
    master_gao: Chinese man in his late fifties, kind lined face, short salt-and-pepper hair, round glasses, indigo work jacket, clay-red apron, dark trousers, rolled sleeves
  kite: small swallow-shaped kite with pale cream paper, vermilion wings, teal and warm-gold painted feather shapes, slim natural bamboo frame, plain white bridle line, and no written marks
  workshop: warm wooden worktable, bamboo strips, plain bowls of paste and paint, hanging wordless kites, latticed window without symbols or signage
  palette: mustard yellow, indigo, clay red, teal, pale cream, bamboo tan, and small warm-gold accents
assets:
