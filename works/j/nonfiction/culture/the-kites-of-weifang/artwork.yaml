  - id: p01
    file: artwork/p01.webp
    scene: Xiaoman enters Master Gao's warm Weifang workshop and looks up at him beside a bundle of bamboo strips, with several finished wordless kites hanging behind them.
  - id: p02
    file: artwork/p02.webp
    scene: Master Gao lays one long bamboo strip and one shorter strip on the worktable while Xiaoman notices a hanging unpainted swallow-shaped kite silhouette without marks and asks about it.
  - id: p03
    file: artwork/p03.webp
    scene: Master Gao gently bends a thin bamboo strip over the table as Xiaoman carefully holds the other end; spare bamboo rests safely to one side.
  - id: p04
    file: artwork/p04.webp
    scene: Xiaoman compares the left and right sides of the tied bamboo kite frame while Master Gao watches her alignment check.
  - id: p05
