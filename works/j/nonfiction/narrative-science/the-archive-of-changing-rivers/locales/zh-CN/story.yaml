schema_version: 1
language: zh-CN
writer: 北辰
title: 河流改道档案
summary: 文来到芦湾替新桥选址。翻过旧地图、走过河滩以后，她发现大家也许把问题问早了。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 准确沉静, timbre: 清晰的成年声音, pace: 中慢速, pitch: 中音}}
  wen: {display_name: 文, tts: {delivery: 严谨谦逊, timbre: 稳定的成年声音, pace: 中速, pitch: 中音}}
  mara: {display_name: 玛拉, tts: {delivery: 果断务实, timbre: 有力的成年声音, pace: 中速, pitch: 中低音}}
  sola: {display_name: 索拉, tts: {delivery: 耐心略带机锋, timbre: 沙哑的年长声音, pace: 慢速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 文刚到芦湾，就接到一个听上去再清楚不过的任务：替新桥选址。}]}
  - {id: p02, illustration: p02, lines: [{speaker: mara, text: 学校和诊所在对岸。我们需要比等待一班渡船更稳定的连接。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 码头前排着长队。大家确实等不起了；至于该造什么，队伍可没有开口。}]}
  - {id: p04, illustration: p04, lines: [{speaker: mara, text: 最窄处在这里，桥模型正好跨过去。}]}
  - {id: p05, illustration: p05, lines: [{speaker: wen, text: 先让我看看这条河以前在哪里。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, content: [{text: 三张旧图一叠，}, {vocabulary: {id: channel, text: 河道}}, {text: 就分成了三条丝带，彼此挨着，却怎么也合不到一起。}]}]}
  - {id: p07, illustration: p07, lines: [{speaker: sola, text: 我年轻时，渡船曾从那片草地出发。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 文拨开草根，下面尽是被水磨圆的石子。索拉记得没错，河确实来过这里。}]}
  - {id: p09, illustration: p09, lines: [{speaker: mara, text: 可今天的河在这里，而且新沙洲让最窄处更窄。}]}
  - {id: p10, illustration: p10, lines: [{speaker: wen, text: 先别急着把沙洲当桥墩。它也许正在告诉我们：河还在动。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 图上的旧河弯、草地下的圆石、眼前的新沙洲，三样线索慢慢对上了。河道从来没有钉死在一个地方。}]}
  - {id: p12, illustration: p12, lines: [{speaker: mara, text: 看来，我们一开始就问“桥放哪里”，确实问早了。}]}
  - {id: p13, illustration: p13, lines: [{speaker: sola, text: 我这把年纪，哪一年未必记得准。不过，去哪儿找找看，我还记得。}]}
  - {id: p14, illustration: p14, lines: [{speaker: wen, text: 那就分开记：哪些是您记得的，哪些是旧图留下的，哪些是我们今天亲眼看见的。最后再把它们对一对。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: 上游一场大雨后，裹着泥沙的河水绕过河弯。大家只在高处观察。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 水退后，沙洲的尖端移了位置，最窄处也随之改变。}]}
  - {id: p17, illustration: p17, lines: [{speaker: mara, text: 只看这一次，还猜不出河以后往哪儿走。不过，“河道不会变”这句话，已经站不住了。}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: 大家把三种模型摆上桌：固定桥、能挪的浮码头，还有更多渡船。}]}
  - {id: p19, illustration: p19, lines: [{speaker: mara, text: 先别把答案浇进地基里。等勘测做完以前，用能挪、也能撤的办法。}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: 第二艘小渡船和两座浮码头先缓解了等待。}]}
  - {id: p21, illustration: p21, lines: [{speaker: wen, text: 这回，档案不能只收一张“河是什么样”的图，还得一页页记下它怎么变。}]}
  - {id: p22, illustration: p22, lines: [{speaker: sola, text: 我的故事也放进去，但要清楚写明它是记忆，不是测量。}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: 玛拉与勘测团队继续检查两岸，渡船则维持眼前的连接。}]}
  - {id: p24, illustration: p24, lines: [{speaker: wen, text: 档案留不住一条河，也不该假装能留住。它能做的，是提醒我们：别让决定追不上河流的变化和人的需要。}]}
chapters:
  - {id: ch01, title: 先问过去, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 三种证据, page_refs: [p07, p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: 一次可见的改变, page_refs: [p15, p16, p17, p18]}
  - {id: ch04, title: 可调整的连接, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: main-idea, speaker: narrator, prompt: 文一开始要回答什么问题，后来又改问了什么？, answer: 她一开始要决定桥建在哪里；后来改为思考，在河道仍会变化、证据也有限的情况下，眼下该用什么方式连接两岸。, page_refs: [p01, p04, p11, p12, p19]}
  - {id: q02, type: evidence, speaker: narrator, prompt: 哪三类证据支持河道曾经移动？, answer: 不同年代的河形图、草地下的河流圆石，以及当前新形成并变化的沙洲。, page_refs: [p06, p08, p09, p16]}
  - {id: q03, type: compare, speaker: narrator, prompt: 索拉的记忆与现场测量各有什么作用？, answer: 记忆指出可能寻找证据的地点，现场观察则能独立检验其中的具体说法。, page_refs: [p07, p08, p13, p14]}
  - {id: q04, type: evidence, speaker: narrator, prompt: 大雨后的观察推翻了哪个假设？, answer: 它显示沙洲和最窄河段会改变，因此推翻了河床固定不动的假设。, page_refs: [p15, p16, p17]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: 为什么长队不能直接证明必须建固定桥？, answer: 长队证明连接需求，却不比较桥、渡船和浮码头在变化河道中的风险与可调整性。, page_refs: [p03, p18, p19, p20]}
  - {id: q06, type: synthesis, speaker: narrator, prompt: 临时方案如何同时回应紧迫需求和长期不确定性？, answer: 增加渡船与可调浮码头立即改善通行，同时保留等待专业勘测后再做永久决定的空间。, page_refs: [p18, p19, p20, p23]}
  - {id: q07, type: research-connection, speaker: narrator, prompt: 研究来源与芦湾观察之间是什么关系？, answer: 来源说明流量与泥沙变化会影响河道形态，芦湾的旧图、沙洲与高水后变化是这个一般机制的虚构案例。, page_refs: [p06, p10, p15, p16]}
  - {id: q08, type: evaluate, speaker: narrator, prompt: 为什么档案要标明“记忆”而不是把所有记录混在一起？, answer: 因为不同证据的来源与局限不同，标明类型才能判断它们如何互相支持，而不把回忆误当测量。, page_refs: [p13, p14, p21, p22]}
