schema_version: 1
language: en-US
writer: inkstone-observer
title: The Archive of Changing Rivers
summary: Wen arrives to choose a bridge site, but maps, stones, and memories transform the question before any foundation is laid.
cast:
  narrator: {display_name: Narrator, tts: {delivery: exact and contemplative, timbre: clear adult voice, pace: medium-slow, pitch: medium}}
  wen: {display_name: Wen, tts: {delivery: precise and humble, timbre: steady adult voice, pace: medium, pitch: medium}}
  mara: {display_name: Mara, tts: {delivery: decisive and practical, timbre: strong adult voice, pace: medium, pitch: low-medium}}
  sola: {display_name: Sola, tts: {delivery: patient and wry, timbre: textured older voice, pace: slow, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Wen reached Reed Bend with a task that sounded precise: select a bridge site."}]}
  - {id: p02, illustration: p02, lines: [{speaker: mara, text: "The clinic and school sit across the water. We need a steadier connection than one crowded ferry."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "The dock queue proved a real need, but could not by itself prove which answer was best."}]}
  - {id: p04, illustration: p04, lines: [{speaker: mara, text: "The narrowest crossing is here. My bridge model fits."}]}
  - {id: p05, illustration: p05, lines: [{speaker: wen, text: "First, show me where this river used to be."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, content: [{text: "Overlaid maps made the "}, {vocabulary: {id: channel, text: channel}}, {text: " resemble three ribbons that almost, but never fully, matched."}]}]}
  - {id: p07, illustration: p07, lines: [{speaker: sola, text: "When I was young, the ferry departed from that meadow."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Rounded stones under the meadow soil supported Sola's memory: water had occupied this ground."}]}
  - {id: p09, illustration: p09, lines: [{speaker: mara, text: "Today the river is here, and a fresh gravel bar makes the crossing narrower."}]}
  - {id: p10, illustration: p10, lines: [{speaker: wen, text: "That bar may record a channel in motion, not offer us a cheap pier."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Old maps, meadow stones, and new gravel converged on one conclusion: the channel was not fixed."}]}
  - {id: p12, illustration: p12, lines: [{speaker: mara, text: "Then we asked where to put the bridge too soon."}]}
  - {id: p13, illustration: p13, lines: [{speaker: sola, text: "Memory drops dates, but it can tell an archivist where to seek evidence."}]}
  - {id: p14, illustration: p14, lines: [{speaker: wen, text: "I will preserve memory, records, and field observations separately, then note where they support one another."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "After heavy rain upstream, sediment-darkened water rounded the bend while everyone observed from high ground."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "When the water fell, the gravel point had shifted, changing the narrowest span."}]}
  - {id: p17, illustration: p17, lines: [{speaker: mara, text: "One event cannot predict the future, but it can overturn our fixed-bed assumption."}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "The community compared a fixed bridge, adjustable floating docks, and expanded ferry service."}]}
  - {id: p19, illustration: p19, lines: [{speaker: mara, text: "Until specialists finish a survey, we should choose something adjustable and reversible."}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "A second small ferry and two floating docks reduced the immediate wait."}]}
  - {id: p21, illustration: p21, lines: [{speaker: wen, text: "The new archive will preserve not only what the river looks like, but how it changes."}]}
  - {id: p22, illustration: p22, lines: [{speaker: sola, text: "Include my account, but identify it as memory rather than measurement."}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: "Mara continued surveying both banks with specialists while the ferries maintained the present link."}]}
  - {id: p24, illustration: p24, lines: [{speaker: wen, text: "A good archive does not freeze a river. It helps decisions move with both water and people."}]}
chapters:
  - {id: ch01, title: Ask the Past First, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Three Kinds of Evidence, page_refs: [p07, p08, p09, p10, p11, p12, p13, p14]}
  - {id: ch03, title: One Visible Change, page_refs: [p15, p16, p17, p18]}
  - {id: ch04, title: An Adjustable Link, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: main-idea, speaker: narrator, prompt: "How does Wen's original question change?", answer: "It changes from where to place a bridge to which connection should come first while the channel and evidence remain uncertain.", page_refs: [p01, p04, p11, p12, p19]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "Which three kinds of evidence indicate channel movement?", answer: "Maps from different times, river stones beneath meadow soil, and a new gravel bar that visibly changes.", page_refs: [p06, p08, p09, p16]}
  - {id: q03, type: compare, speaker: narrator, prompt: "How do Sola's memory and field observation contribute differently?", answer: "Memory directs the search, while physical observation independently tests its specific claim.", page_refs: [p07, p08, p13, p14]}
  - {id: q04, type: evidence, speaker: narrator, prompt: "Which assumption does the post-rain observation overturn?", answer: "The shifted bar and span show that the bed cannot be treated as fixed.", page_refs: [p15, p16, p17]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "Why does the queue not prove that a fixed bridge is necessary?", answer: "It proves a need for access but does not compare the adaptability and risk of bridges, ferries, and floating docks.", page_refs: [p03, p18, p19, p20]}
  - {id: q06, type: synthesis, speaker: narrator, prompt: "How does the interim choice address urgency and long-term uncertainty?", answer: "More ferry capacity improves access now while adjustable docks preserve options until specialist surveys are complete.", page_refs: [p18, p19, p20, p23]}
  - {id: q07, type: research-connection, speaker: narrator, prompt: "How do the cited studies relate to Reed Bend?", answer: "The sources explain that flow and sediment affect channel form; Reed Bend's maps and shifting bar provide a fictional case of that general process.", page_refs: [p06, p10, p15, p16]}
  - {id: q08, type: evaluate, speaker: narrator, prompt: "Why label memory instead of mixing every record together?", answer: "Evidence types have different sources and limits; labels allow comparison without treating recollection as measurement.", page_refs: [p13, p14, p21, p22]}
