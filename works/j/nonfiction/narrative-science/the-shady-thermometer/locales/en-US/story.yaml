schema_version: 1
language: en-US
writer: river-wink
title: The Shady Thermometer
summary: Lin sets out to find one hottest street, but careful measurements and residents' experience divide that simple question into two better ones.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and documentary, timbre: clear adult voice, pace: medium, pitch: medium}}
  lin: {display_name: Lin, tts: {delivery: exact then reflective, timbre: focused teen voice, pace: medium-fast, pitch: medium-high}}
  rosa: {display_name: Rosa, tts: {delivery: warm and challenging, timbre: resonant adult voice, pace: medium, pitch: medium-low}}
  dev: {display_name: Dev, tts: {delivery: patient and technical, timbre: textured older voice, pace: medium-slow, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: lin, text: "By sunset, we will know the neighborhood's hottest street."}]}
  - {id: p02, illustration: p02, lines: [{speaker: rosa, text: "Start where the bus is late and the shade is missing. People already know that heat."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Lin raised a thermometer in direct sunlight beside the dark pavement."}]}
  - {id: p04, illustration: p04, lines: [{speaker: dev, text: "Sunlight is heating the thermometer itself. We cannot compare that reading with shaded air."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "They shielded every sensor, kept air moving around it, and matched the measurement height."}]}
  - {id: p06, illustration: p06, lines: [{speaker: dev, text: "Now differences are less likely to come from how we held the instruments."}]}
  - {id: p07, illustration: p07, lines: [{speaker: rosa, text: "Good air measurements. The bench still feels hot enough to chase passengers away."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "The sun-baked bench and pavement raised another question: what heat did people actually have to endure?"}]}
  - {id: p09, illustration: p09, lines: [{speaker: lin, text: "We will record air temperature separately from shade, surfaces, and waiting conditions."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "They repeated observations at consistent times instead of trusting one dramatic reading."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Tree shade changed abruptly where one planted block met an exposed block."}]}
  - {id: p12, illustration: p12, lines: [{speaker: rosa, text: "A map of heat should include how long people remain in it and whether they can leave."}]}
  - {id: p13, illustration: p13, lines: [{speaker: dev, text: "This sensor is trapped against a warm wall. Its site is not comparable."}]}
  - {id: p14, illustration: p14, lines: [{speaker: lin, text: "We keep the observation as a lesson, but exclude it from the matched air comparison."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Residents added long waits, broken shade, steep detours, and crowded crossings to the field map."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "The map no longer crowned one street in red. It showed several different kinds of hardship."}]}
  - {id: p17, illustration: p17, lines: [{speaker: lin, text: "The highest comparable air reading is here."}, {speaker: rosa, text: "Yet the hardest wait is there."}]}
  - {id: p18, illustration: p18, lines: [{speaker: lin, text: "Then we need two questions: where is air hottest, and where are people most exposed?"}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "A temporary shade test cooled the waiting experience without pretending to change the whole district."}]}
  - {id: p20, illustration: p20, lines: [{speaker: dev, text: "Trees can provide shade and cooling, but placement, care, utilities, and time all matter."}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "The first permanent change was a shaded stop with a clear path and safer seating."}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "Suitable parts of the route also received young street trees and a maintenance plan."}]}
  - {id: p23, illustration: p23, lines: [{speaker: rosa, text: "Measure again. A good intervention should survive both instruments and daily life."}]}
  - {id: p24, illustration: p24, lines: [{speaker: lin, text: "We did not find one hottest street. We found where to act first—and what to measure when we return."}]}
chapters:
  - {id: ch01, title: One Hottest Street, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: More Than One Kind of Heat, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: Comparable and Lived Evidence, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: The Next Fair Step, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: main-idea, speaker: narrator, prompt: "Why is the first direct-sun reading unsuitable for comparing air temperature?", answer: "Solar radiation can heat the instrument itself, so comparable air measurements require shielding and ventilation.", page_refs: [p03, p04, p05]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "Which practices make the air observations more comparable?", answer: "The team uses shields, airflow, matched height, consistent timing, and reviews surrounding heat sources.", page_refs: [p05, p06, p10, p13]}
  - {id: q03, type: compare, speaker: narrator, prompt: "How do Lin's measurements and Rosa's route knowledge differ?", answer: "Lin compares standardized air observations; Rosa identifies duration, surfaces, shade, mobility, and people's ability to avoid exposure.", page_refs: [p07, p09, p12, p15]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: "Was Lin right to discard the wall-adjacent observation completely?", answer: "No. Lin rightly excludes it from the matched comparison but keeps it as evidence about siting and local exposure.", page_refs: [p13, p14]}
  - {id: q05, type: synthesis, speaker: narrator, prompt: "Why does the map stop naming one 'winner'?", answer: "Comparable air temperature, surface conditions, shade, waiting time, and ability to leave reveal different kinds of heat burden.", page_refs: [p09, p12, p15, p16]}
  - {id: q06, type: research-connection, speaker: narrator, prompt: "How does the project reflect weather-observation guidance?", answer: "It shields and ventilates sensors, standardizes height and timing, and treats nearby walls and pavement as siting concerns.", page_refs: [p04, p05, p10, p13]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: "Why does the team test temporary shade before claiming success?", answer: "A limited test can reveal practical effects and problems without overstating a district-wide change.", page_refs: [p19, p23]}
  - {id: q08, type: synthesis, speaker: narrator, prompt: "How is the central question transformed?", answer: "The search for one hottest street becomes a combined study of physical temperature patterns and unequal human exposure, followed by monitored action.", page_refs: [p01, p18, p23, p24]}
