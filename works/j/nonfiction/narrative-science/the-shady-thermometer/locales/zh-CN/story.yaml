schema_version: 1
language: zh-CN
writer: 江笑
title: 树荫下的温度计
summary: 小林想找出附近最热的街道。测量越认真，问题反而越多：空气哪里最热，人在什么地方又最难躲开暑气？
cast:
  narrator: {display_name: 旁白, tts: {delivery: 准确如实地记录, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  lin: {display_name: 小林, tts: {delivery: 先急切后审慎, timbre: 专注的青年声音, pace: 中快速, pitch: 中高音}}
  rosa: {display_name: 罗莎, tts: {delivery: 温暖而善于追问, timbre: 洪亮的成年声音, pace: 中速, pitch: 中低音}}
  dev: {display_name: 德夫, tts: {delivery: 耐心严谨, timbre: 有质感的年长声音, pace: 中慢速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: lin, text: 日落以前，我们一定能找出附近最热的那条街。}]}
  - {id: p02, illustration: p02, lines: [{speaker: rosa, text: 先去公交最难等、最缺树荫的地方。天天等车的人，早就领教过那里的热了。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 小林在深色路面旁，把温度计直接举进阳光。}]}
  - {id: p04, illustration: p04, lines: [{speaker: dev, text: 阳光会先把温度计晒热。这样读到的，不是能拿来比较的空气温度。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 大家给传感器装上能通风的遮罩，又把它们架到同样的高度。}]}
  - {id: p06, illustration: p06, lines: [{speaker: dev, text: 这样一来，读数不同就不太可能是我们测法不同造成的。}]}
  - {id: p07, illustration: p07, lines: [{speaker: rosa, text: 空气温度测得再准，长椅照样烫得没人敢坐。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 被太阳晒烫的长椅和路面提醒大家：只量空气，还说不清人在这里有多难受。}]}
  - {id: p09, illustration: p09, lines: [{speaker: lin, text: 那就分开记。空气温度是一项，树荫、地面和等车情况是另一项。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 他们按约定的时间一遍遍重测，不让某一次特别高的读数替所有时候作主。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 有行道树的街段一结束，树荫也突然断了。}]}
  - {id: p12, illustration: p12, lines: [{speaker: rosa, text: 热地图还得记下人要待多久，以及能不能离开。}]}
  - {id: p13, illustration: p13, lines: [{speaker: dev, text: 这只传感器离热墙太近，不能和其他测点直接比较。}]}
  - {id: p14, illustration: p14, lines: [{speaker: lin, text: 那就把它移出这组比较，不过这次记录得留下——测点选在哪儿，本身就是教训。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: 居民也来补地图：哪里等车久，哪里没树荫，哪里得绕远路，哪里过街最挤。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 地图上不再只有一个“最热地点”，而是标出了好几种不同的难熬。}]}
  - {id: p17, illustration: p17, lines: [{speaker: lin, text: 按同样方法测，空气温度最高的是这里。}, {speaker: rosa, text: 可大家等车最难受的，是那边。}]}
  - {id: p18, illustration: p18, lines: [{speaker: lin, text: 那就问两个问题：哪里的空气最热？人又在哪里最难躲开暑气？}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: 临时遮阳棚让等车舒服了一些。大家只说这个站有了改善，没有夸口说整片街区都凉了。}]}
  - {id: p20, illustration: p20, lines: [{speaker: dev, text: 树能遮阳降温，但位置、养护、地下设施和生长时间都得考虑。}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: 最先完成的长久改造，是一座有遮阳顶棚的新车站；通道够宽，座椅也不容易被晒烫。}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: 路线上合适的位置也种下幼树，并安排了长期养护。}]}
  - {id: p23, illustration: p23, lines: [{speaker: rosa, text: 继续测。好办法得同时经得住仪器和日常生活。}]}
  - {id: p24, illustration: p24, lines: [{speaker: lin, text: 我们没找到唯一最热的街，却弄清了下一步该先改哪里，也知道以后还要回来再测。}]}
chapters:
  - {id: ch01, title: 唯一最热的街, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 不止一种热, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 仪器之外的线索, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: 先从哪里改起, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: main-idea, speaker: narrator, prompt: 为什么不能拿第一次阳光直射下的读数来比较空气温度？, answer: 阳光会把仪器本身晒热。要比较空气温度，传感器需要挡住辐射，同时保持通风。, page_refs: [p03, p04, p05]}
  - {id: q02, type: evidence, speaker: narrator, prompt: 哪些做法让各处的空气温度读数更适合互相比较？, answer: 给传感器安装通风遮罩，在相同高度和时段测量，并检查附近有没有墙面、路面等额外热源。, page_refs: [p05, p06, p10, p13]}
  - {id: q03, type: compare, speaker: narrator, prompt: 小林的测量和罗莎熟悉的路线经验，各自提供了什么线索？, answer: 小林按同样方法比较各处空气温度；罗莎则指出人要热多久、接触什么表面、有没有树荫、能不能及时离开。, page_refs: [p07, p09, p12, p15]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: 贴墙测得的读数还有没有保留价值？为什么？, answer: 有。它不能放进同条件的空气温度比较，却能提醒大家：测点位置会影响结果，也能反映墙边的局部感受。, page_refs: [p13, p14]}
  - {id: q05, type: synthesis, speaker: narrator, prompt: 地图为什么不再选出一个“最热冠军”？, answer: 空气温度、被晒烫的路面和座椅、树荫、等待时间，以及人能不能离开，指向的难受并不是同一回事。, page_refs: [p09, p12, p15, p16]}
  - {id: q06, type: research-connection, speaker: narrator, prompt: 这个项目采用了哪些规范的气温测量方法？, answer: 团队给传感器遮挡阳光并保持通风，在相同高度和时段测量，还记录了测点附近的墙面和路面。, page_refs: [p04, p05, p10, p13]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: 团队为什么先试临时遮阳，而不直接宣布成功？, answer: 小范围试验能发现实际效果和问题，又不会把结果夸大成整个街区的变化。, page_refs: [p19, p23]}
  - {id: q08, type: synthesis, speaker: narrator, prompt: 调查到最后，大家要回答的问题发生了什么变化？, answer: 一开始只想找出最热的街；后来不仅比较空气温度，还要找出人最难躲开暑气的地方，并在改造后继续测量。, page_refs: [p01, p18, p23, p24]}
