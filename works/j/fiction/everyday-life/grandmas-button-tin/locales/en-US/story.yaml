schema_version: 3
language: en-US
writer: rain-song
title: The Button from Today
summary: "Nora wants a button tied to a memory of her own. By helping Grandma June make a safe jacket for her newborn cousin, she creates a story she will remember."
chapters:
  - id: ch01
    title: Old Buttons
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: A Jacket Together
    page_refs: [p07, p08, p09, p10, p11, p12, p13]
  - id: ch03
    title: Today's Story
    page_refs: [p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: sequence
    prompt: What did Nora do after she found the tin and before the baby came home?
    answer: She heard Grandma's button stories, decided not to take the bear button, and helped make a jacket.
    page_refs: [p01, p05, p08]
  - id: q02
    type: cause-effect
    prompt: Why did Nora pull out the crooked stitches?
    answer: She knew she would notice them even if the folded cuff hid them.
    page_refs: [p10, p11]
  - id: q03
    type: character-motive
    prompt: Why did Nora choose the green button for the keepsake instead of the baby's jacket?
    answer: The safe fabric strips belonged on the jacket, while the button could stay away from the baby and remember the day Nora helped.
    page_refs: [p12, p16, p17, p18]
  - id: q04
    type: evidence
    prompt: Which two moments show that Nora wanted a memory she could call her own?
    answer: She did not take the bear button because she could not remember wearing it, and later called the green button one she remembered.
    page_refs: [p05, p18]
  - id: q05
    type: main-idea
    prompt: How did working with Grandma change what the green button meant to Nora?
    answer: At first it held her mother's old story. After Nora helped finish the baby's jacket, it also marked a new story that Nora had lived herself.
    page_refs: [p13, p16, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Nora reached under Grandma June's guest-room bed for her charging cable. A faded turquoise tin rattled in the dark.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Grandma opened it. Buttons filled the tin, and a large green one seemed to look up at Nora.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Grandma lifted a pearl button. Nora's mother had pulled it from her blouse before her first solo. She held it through the song.
    - id: p04
      illustration: p04
      paragraphs:
        - text: A red button, a blue glass button, and a wooden toggle each carried another family story. Nora wanted one that carried hers.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Grandma found a bear button from Nora's old overalls. "I don't remember them," Nora said. "That is your story about me."
    - id: p06
      illustration: p06
      paragraphs:
        - text: Grandma returned it to the tin. "Then we'll wait for one you remember." Nora pressed the lid shut.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Nora had planned to buy her newborn cousin a rabbit jacket, but they were sold out. Grandma spread cream cloth across the table.
    - id: p08
      illustration: p08
      paragraphs:
        - text: '"Can we finish a jacket in time?" Nora asked. Grandma handed her the ruler. Together, they might manage it.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: Nora held the pattern and cut the cloth. When her first cut wandered, Grandma redrew that short section instead of taking the scissors.
    - id: p10
      illustration: p10
      paragraphs:
        - text: At the sewing machine, Nora made a crooked row of stitches. Grandma said the folded cuff could hide it. "I will see it," Nora replied.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Pulling out stitches was slow. Nora remembered the pearl button in her mother's damp hand, changed her grip, and kept going.
    - id: p12
      illustration: p12
      paragraphs:
        - text: By night, the jacket had pale-blue edging and soft sleeves. Two broad fabric strips would close it safely, without a loose button.
    - id: p13
      illustration: p13
      paragraphs:
        - text: Nora chose the green button for a cream keepsake scrap. Then she learned it came from her mother's childhood sweater and set it down.
    - id: p14
      illustration: p14
      paragraphs:
        - text: The baby came home early and cried. Aunt May asked for less light, so Nora pulled the curtain halfway. The cries grew shorter.
    - id: p15
      illustration: p15
      paragraphs:
        - text: Aunt May noticed the jacket. Grandma laid it over the baby, but the unfinished front slipped open.
    - id: p16
      illustration: p16
      paragraphs:
        - text: The baby gripped Nora's smallest finger. Nora looked at the unfinished jacket and knew she was helping make today's story.
    - id: p17
      illustration: p17
      paragraphs:
        - text: Nora chose the safe strips for the jacket. She kept the green button away from the baby. She and Grandma stitched the front closed.
    - id: p18
      illustration: p18
      paragraphs:
        - text: Nora sewed the green button onto the keepsake scrap and placed it in the tin. "Whose button is that?" Grandma asked. "One I remember."
