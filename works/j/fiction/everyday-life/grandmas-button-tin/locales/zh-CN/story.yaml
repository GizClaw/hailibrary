schema_version: 3
language: zh-CN
writer: 雨歌
title: 今天的纽扣
summary: 林澄想要一颗装着自己记忆的纽扣。她和外婆一起给新生的小表妹做了一件安全的小外套，也为自己留下了一个记得住的故事。
chapters:
  - id: ch01
    title: 旧纽扣
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 一起做外套
    page_refs: [p07, p08, p09, p10, p11, p12, p13]
  - id: ch03
    title: 今天的故事
    page_refs: [p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: sequence
    prompt: 林澄发现铁盒以后、宝宝回家以前，依次做了哪些事？
    answer: 她先听外婆讲纽扣的故事，再拒绝小熊扣，后来和外婆一起做小外套。
    page_refs: [p01, p05, p08]
  - id: q02
    type: cause-effect
    prompt: 林澄为什么要拆掉歪针脚？
    answer: 因为即使袖口能把歪针脚藏起来，她自己还是知道它在那里。
    page_refs: [p10, p11]
  - id: q03
    type: character-motive
    prompt: 林澄为什么把绿纽扣留给纪念布片，而不用在宝宝的外套上？
    answer: 软粘扣带用在外套上更安全，绿纽扣则可以远离宝宝，记住她参与做外套的这一天。
    page_refs: [p12, p16, p17, p18]
  - id: q04
    type: evidence
    prompt: 哪两处可以看出林澄想要一段属于自己的记忆？
    answer: 她先因记不得小时候的背带裤而拒绝小熊扣，最后又说绿纽扣是“一颗我记得的”。
    page_refs: [p05, p18]
  - id: q05
    type: main-idea
    prompt: 和外婆一起做外套以后，绿纽扣对林澄有了什么新的意义？
    answer: 它原来只装着妈妈小时候的故事；林澄参与做完外套后，它也记下了她亲身经历的新故事。
    page_refs: [p13, p16, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林澄伸手到外婆家的床底找充电线。黑暗里，一个褪色的蓝绿色铁盒哗啦响起来。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 外婆打开铁盒。里面挤满了纽扣，一颗深绿色的大纽扣像在抬头看林澄。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 外婆拿起一颗珍珠扣。妈妈第一次上台唱歌前，把它从衬衫上揪下来，攥着它唱完整首歌。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 红扣子、蓝玻璃扣和木头长扣子，也各有一段家里的旧故事。林澄却想要一颗装着自己记忆的纽扣。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 外婆找出林澄小时候的小熊扣。林澄说：“我不记得那条背带裤。那是你们讲给我的故事。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 外婆把小熊扣放回去。“那就等一颗你记得的。”林澄自己按紧了盒盖。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 林澄原想给新生的小表妹买兔子外套，可店里缺货了。外婆把一块奶油色的软布铺上桌。
    - id: p08
      illustration: p08
      paragraphs:
        - text: “我们来得及做一件吗？”林澄问。外婆把尺子递给她。两个人一起，也许能行。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 林澄按住纸样，又沿线剪布。第一刀剪歪了，外婆没有拿走剪刀，只把那一小段线重新画好。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 林澄用缝纫机踩出一排歪针脚。外婆说袖口能把它藏住。林澄摇头：“我看得见。”
    - id: p11
      illustration: p11
      paragraphs:
        - text: 拆线很慢。林澄想起妈妈手心里那颗珍珠扣，换了一个握法，继续挑出细线。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 夜里，小外套有了淡蓝色包边和软袖子。两片宽粘扣带能安全合上衣襟，不留下松动的小扣子。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 林澄为纪念布片选了绿纽扣。听说它来自妈妈小时候的毛衣，她又把纽扣放下了。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 宝宝提前回家，哭得满脸通红。小姨请人拉暗窗帘，林澄先跑过去。哭声慢慢变短了。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 小姨看见了外套。外婆把它轻轻披在宝宝身上，可没缝好的衣襟立刻滑开了。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 宝宝握住林澄的小指。林澄看着没做完的外套，明白自己正在帮忙做出今天的故事。
    - id: p17
      illustration: p17
      paragraphs:
        - text: 林澄决定给外套用安全的粘扣带，让绿纽扣远离宝宝。她和外婆一起把衣襟缝好。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 林澄把绿纽扣缝在纪念布片上，再放进铁盒。外婆问：“这颗是谁的？”她说：“一颗我记得的。”
