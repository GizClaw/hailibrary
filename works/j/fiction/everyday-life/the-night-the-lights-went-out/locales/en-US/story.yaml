schema_version: 3
language: en-US
writer: rain-song
title: One More Star
summary: "A blackout frightens June and hides the box city she was building. A safe jar candle and the voices of her family and neighbors help her step onto the balcony. As she listens and looks up, she learns that darkness has not taken everyone away and notices stars usually hidden by city light. When the power returns, June asks for the lamp to be switched off once more so she can choose one last star."
chapters:
  - id: ch01
    title: When the Lights Stop
    page_refs: [p01, p02, p03, p04, p05, p06, p07, p08]
  - id: ch02
    title: What June Finds
    page_refs: [p09, p10, p11, p12, p13, p14, p15, p16]
questions:
  - id: q01
    type: sequence
    prompt: What happens after June knocks down her box city and before she reaches the balcony stool?
    answer: "Mom finds June, Dad makes her almost laugh with his phone light, and the family lights a candle safely inside a glass jar. Then June hears the neighbors and walks to the stool."
    page_refs: [p03, p04, p05, p06, p07, p08, p09]
  - id: q02
    type: cause-effect
    prompt: Why can June see more stars during the blackout?
    answer: "The building and nearby city lights are off, so their glow does not hide as many stars."
    page_refs: [p13, p14]
  - id: q03
    type: character-motive
    prompt: Why does June correct Milo's counting from inside the doorway?
    answer: "Listening to the familiar neighbors has made her curious and less alone, so she joins their activity even before she notices that she has moved outside."
    page_refs: [p07, p08, p09]
  - id: q04
    type: main-idea
    prompt: How does June's idea about darkness change across the story?
    answer: "At first she thinks darkness means everything and everyone are gone. Later, voices, touch, moving lights, and stars show her that familiar people and places are still there."
    page_refs: [p02, p03, p07, p11, p14]
  - id: q05
    type: evidence
    prompt: Which two actions show that June is still a little afraid but has become braver?
    answer: "She honestly tells Mrs. Wu that she is still a little afraid, and later she asks her parents to turn off the lamp again so she can look for one more star."
    page_refs: [p10, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: June was adding one paper window to her box city. The fan blew it away, and she reached for it.
    - id: p02
      illustration: p02
      paragraphs:
        - text: The room went dark. The fan slowed, the air conditioner stopped, and even the refrigerator became quiet.
    - id: p03
      illustration: p03
      paragraphs:
        - text: June could not see her city or even her knees. She reached across the rug, knocked the boxes down, and called for Mom.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Mom called for June to stay there. Her hand found June's shoulder before June could see her face.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Dad turned on his phone light under his chin. His giant nose shadows made June almost laugh.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Mom put a short candle inside a clean glass jar. Dad lit it on a balcony stool far from the curtain.
    - id: p07
      illustration: p07
      paragraphs:
        - text: June held the doorframe while the courtyard beyond looked like a deep bowl. Mom waited beside a slice of melon.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Voices floated from dark balconies. Neighbors asked about the elevator and laughed about melting ice cream.
    - id: p09
      illustration: p09
      paragraphs:
        - text: When Milo counted phone lights from upstairs, June corrected him. Then she noticed she had walked to the stool.
    - id: p10
      illustration: p10
      paragraphs:
        - text: When Mrs. Wu asked, June admitted that she was still a little afraid. Mrs. Wu nodded and said that she was too.
    - id: p11
      illustration: p11
      paragraphs:
        - text: A breeze bent the small flame. Mom said, “If it goes out, we will still be here.”
    - id: p12
      illustration: p12
      paragraphs:
        - text: June stepped closer to the railing. Phone lights moved below, and car lights slid across the walls.
    - id: p13
      illustration: p13
      paragraphs:
        - text: “Look up,” Dad said. Above the roof, the deep blue sky held more stars than June usually saw.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Mom and Dad switched off their phones. As June's eyes adjusted, faces returned and more stars appeared.
    - id: p15
      illustration: p15
      paragraphs:
        - text: The elevator hummed. Windows flashed on, and the living-room lamp filled the balcony. The stars began to fade.
    - id: p16
      illustration: p16
      paragraphs:
        - text: “One more star,” June said. Dad switched off the lamp. June leaned against Mom and chose the faintest one.
