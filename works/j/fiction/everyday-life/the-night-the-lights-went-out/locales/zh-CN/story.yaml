schema_version: 3
language: zh-CN
writer: 雨歌
title: 再看一颗星
summary: 林林正在搭纸板城，整栋楼忽然停电，黑暗让她碰倒了小楼。家人把短蜡烛安全地放进玻璃罐，邻居们的说笑声也引着她走到阳台。她听见熟悉的人仍在身边，又发现城市灯光变少后，屋顶上露出了更多星星。来电以后，林林主动请爸爸再关一次灯，好让她选中最后一颗星。
chapters:
  - id: ch01
    title: 灯停了
    page_refs: [p01, p02, p03, p04, p05, p06, p07, p08]
  - id: ch02
    title: 林林看见了
    page_refs: [p09, p10, p11, p12, p13, p14, p15, p16]
questions:
  - id: q01
    type: sequence
    prompt: 林林碰倒纸板城以后，到她走到阳台小凳旁边以前，发生了哪些事？
    answer: 妈妈摸到林林，爸爸用手机灯逗得她差点笑出来，家人又把蜡烛安全地点在玻璃罐里。接着，林林听见邻居们说话，走到了小凳旁。
    page_refs: [p03, p04, p05, p06, p07, p08, p09]
  - id: q02
    type: cause-effect
    prompt: 停电时，林林为什么能看见更多星星？
    answer: 楼里和附近的灯光熄灭了，它们的亮光不再遮住那么多星星。
    page_refs: [p13, p14]
  - id: q03
    type: character-motive
    prompt: 林林为什么还站在门边时，就忍不住纠正阿俊数灯？
    answer: 熟悉的邻居声音让她觉得自己并不孤单，她也对大家正在做的事有了兴趣，所以主动加入了。
    page_refs: [p07, p08, p09]
  - id: q04
    type: main-idea
    prompt: 林林对黑暗的想法在故事中发生了什么变化？
    answer: 起初，她以为黑暗把东西和人都带走了。后来，声音、触摸、移动的光和星星让她知道，熟悉的人和地方仍然都在。
    page_refs: [p02, p03, p07, p11, p14]
  - id: q05
    type: evidence
    prompt: 哪两个动作说明林林还有一点害怕，却已经更勇敢了？
    answer: 她坦白告诉吴奶奶自己还有一点怕；后来，她又请爸爸关灯，好让自己再看一颗星。
    page_refs: [p10, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林林正给纸板城贴最后一扇窗。风扇把小纸片吹跑了，她伸手去够。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 屋里忽然黑了。风扇慢下来，空调停了，连冰箱也不响了。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林林看不见纸板城，也看不见自己的膝盖。她往前一摸，碰倒小楼，马上喊起妈妈。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 妈妈叫林林别动，自己马上过来。林林还没看清她的脸，肩膀上先落下一只手。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 爸爸把手机灯照在下巴上。鼻子下面冒出两个大影子，林林差点笑出来。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 妈妈把短蜡烛放进干净的玻璃罐。爸爸在远离窗帘的阳台小凳上点亮它。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 林林抓着门框。外面的院子像一口深井，妈妈拿着一块西瓜，坐在旁边等她。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 黑阳台上传来一层层说话声。邻居们问起电梯，又笑着商量快化掉的冰棍。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 楼上的阿俊在数手机灯，林林忍不住纠正他。说完，她才发现自己已经走到小凳旁。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 吴奶奶问林林怕不怕，林林承认还有一点。吴奶奶点点头，说她也怕一点。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 夜风压低了小火苗，妈妈告诉林林，就算火灭了，大家也还在这里。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 林林往栏杆边走了两步。树下有手机灯移动，远处的车灯慢慢滑过楼墙。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 爸爸叫林林往上看。屋顶上方是一片深蓝，里面露出许多平时看不见的星星。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 爸爸妈妈关掉手机灯。林林的眼睛慢慢习惯了，家人的脸回来了，星星也变多了。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 电梯响起来，窗户一格格亮了。客厅灯照满阳台，星星开始变淡。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 林林请爸爸再关一次灯，她要再看一颗星。她靠着妈妈，选中最暗的那一颗。
