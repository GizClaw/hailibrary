  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "周屿和许安造了小丁。它会看物品，也会伸出夹爪。他们第一次把机器带到院里。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "小丁把空杯放进蓝箱。周屿跳起来，许安却先按下急停。梁叔在旁边看着全过程。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "拿不准时，小丁会亮黄灯等人。周屿嫌它等得太久。孩子们本来把等待当成缺点。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "评审后天就来。周屿把等待时间从两分钟改成二十秒。这个改动没有经过完整测试。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "许安看见了改动。她要求周屿一直带着遥控器。她仍希望共同作品可以成功。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "第二天，小丁很快捡走瓶子和易拉罐。周屿高兴地拍视频。它的速度让周屿忘了风险。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "花坛边有一把断伞。小丁看见泥污，便亮起绿灯。机器只认得物品的外表。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "赵奶奶抓住伞柄。小丁还在拉，许安马上按下急停。伞骨发出细响，大家都紧张。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "赵奶奶要用伞布做风筝尾巴。她从来没有丢掉这把伞。破旧物品也可能有新的用处。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "周屿说，小丁以后只捡地上的东西。许安指着地上的断伞。新规则没有解决真正的问题。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "周屿又说，物品离人两米才捡。许安问：“两米外就没人要吗？”一个数字无法说明人的想法。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "他们带小丁回棚里重测。一次成功不够，安全规则也不能靠猜。他们决定先听取物主的意见。"
          }
        ]
      }
    ]
  }
}
