  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "Dev and Nora built Helper. It could look at an object and move it with a claw. It was their first public test."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "Helper dropped an empty cup into the blue bin. Dev cheered, but Nora tested the emergency stop first. Mr. Lewis watched the whole process."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "When Helper was unsure, it showed an amber light and waited. Dev thought it waited too long. The children had mistaken waiting for failure."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "The showcase was two days away. Dev changed the wait from two minutes to twenty seconds. They had not tested this change fully."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "Nora saw the change. She made Dev promise to keep the remote in his pocket. She still wanted their shared project to succeed."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "The next day, Helper quickly collected bottles and cans. Dev filmed every green light. Its speed made Dev forget the risk."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "A broken, muddy umbrella lay beside the garden. Helper saw it and turned green. The machine knew only an object’s appearance."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "Mrs. Patel grabbed the handle. Helper kept pulling until Nora hit the stop button. The umbrella ribs creaked under the strain."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "Mrs. Patel needed the cloth for kite tails. She had never thrown the umbrella away. A worn object could still have another use."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "Dev said Helper would collect only things on the ground. Nora pointed to the umbrella. The new rule missed the real problem."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "Then Dev chose a distance of six feet. Nora asked, “Does distance make an owner disappear?” One measurement could not reveal human intention."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "They took Helper back to the workshop for more tests. One success could not prove a rule was safe. They decided to ask owners before continuing."
          }
        ]
      }
    ]
  }
}
