  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "露天电影前，风吹走林豆画的蓝色土星。小丁把画当成废纸。林豆看着机器追上自己的画。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "周屿去摸遥控器，口袋却是空的。小丁又转向一条薄毯。谁也没有想到风会变大。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "许安大喊拔电池。周屿冲过去，关掉了小丁。电机停下了，夹爪却仍然卡住。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "他们从箱里找回湿掉的画、假牙盒、猫粮和螺丝盒。每一件失物都带着主人的生活。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "周屿想买新的东西赔给大家。梁叔让他先把原物还回去。新的物品不能代替旧的心意。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "许安也承认，她看见危险设置，却没有让测试停止。她不再把沉默当成没有做选择。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "林豆不让周屿重画。他自己画新土星，也留下湿掉的旧画。周屿第一次只在旁边耐心等待。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "小丁没有坏。它只是照着孩子们写下的规则做事。错误来自目标，而不是损坏的零件。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "地上的东西不一定是垃圾。脏、破、旧，也不等于没人要。孩子们终于问起物品主人的想法。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "他们拆掉自动拾取。主人要先把物品放到托盘上。机器只有得到邀请才能开始工作。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "小丁只建议放进哪一箱。最后一步永远由人完成。这样既能帮忙，也不会夺走选择。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "风再次吹走蓝色土星。小丁没有动，林豆自己跑来捡起它。同一张画，这次安全回到主人手中。"
          }
        ]
      }
    ]
  }
}
