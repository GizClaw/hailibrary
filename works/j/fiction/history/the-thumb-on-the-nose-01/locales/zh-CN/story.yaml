      ]
    },
    {
      "id": "q02",
      "type": "cause-effect",
      "prompt": "德波为什么在顶板落屑时停工？",
      "answer": "松动岩石会埋住工人，人的安全比抢救一处骨面更重要。",
      "page_refs": [
