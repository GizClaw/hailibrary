  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "1878年4月，一封电报送到布鲁塞尔博物馆。贝尼沙尔煤矿深处发现了许多巨骨，德波必须马上出发。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "埃米尔从牙齿和零散骨头认识禽龙。曼特尔在1825年给它命名，旧图却把尖骨装在禽龙鼻上。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "埃米尔曾把那幅图画得又黑又稳。如今他要求同行。德波提醒他矿井不是画室，可天亮前，野外用品旁还是多了一盏矿灯。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "升降笼下降三百多米，白昼在头顶合上。煤尘钻进牙缝，矿工朱尔带他们走进黑暗。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "朱尔举灯照出肋骨和一长排椎骨。许多骨头仍靠在一起，这不是一块孤零零的化石。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "埃米尔照着黏土里的前肢画。第一张图却在头骨旁留了鼻角的位置，他撕掉重画。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "工人沿化石切出黏土块，再用湿纸、麻布和石膏包好。德波要求先记清每块的位置。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "顶板落下碎屑。埃米尔想继续挖，德波却停工：“骨头等得起，被埋的人等不起。”"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "通道加固后，一枚粗大尖骨露出来。它很像旧图上的鼻角，却躺在腕骨旁边。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "另一侧手腕旁也有一枚尖骨。朱尔问：“两只角？”埃米尔看看两只手：“也许根本不是角。”"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "回到布鲁塞尔，木箱堆满工作间。埃米尔用矿下图逐一核对，不让相邻骨头被分开。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "埃米尔把旧图放在新证据旁，写下：“尖骨——位置未定。”那只著名的鼻角不再是确定答案，而是一个问题。"
          }
        ]
      }
    ]
  }
}
