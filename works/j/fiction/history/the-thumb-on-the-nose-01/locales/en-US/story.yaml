  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "In April 1878, a telegram reached the Brussels museum. Many large bones had appeared deep inside the Bernissart coal mine. De Pauw had to leave at once."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "Émile knew Iguanodon from teeth and scattered bones. Mantell had named it in 1825. An old picture gave the animal a sharp horn on its nose."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Émile had copied that picture with dark, certain lines. Now he asked to join De Pauw. “A mine is not a drawing room,” De Pauw warned."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "Before dawn, Émile found a lamp waiting beside the plaster and boards. De Pauw had not said yes, but the extra lamp was an answer."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "The lift dropped more than three hundred meters. Daylight closed above them. Coal grit reached Émile’s teeth as Jules led them through the dark."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Jules shone his lamp across ribs and a long row of backbones. The bones still lay near one another. This was not one loose piece."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "Émile drew the forelimb as it appeared in the clay. His first sketch left room near the skull for a horn. He tore it out and began again."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "Workers cut blocks of clay around the fossils. They wrapped each block before lifting it. De Pauw made Émile record every position first."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "Dust fell from the roof. Émile wanted to keep digging, but De Pauw stopped the work. “A bone can wait. A buried worker cannot.”"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "After the tunnel was made safe, a thick pointed bone appeared. It looked like the old nose horn, yet it lay beside the wrist."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "A matching spike appeared near the other wrist. “Two horns?” Jules asked. Émile looked at both hands. “Or no horns.”"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "Back in Brussels, crates filled the workroom. Émile matched each block to his mine drawings so neighboring bones would not be separated. He placed the old picture beside evidence. Then he wrote, “Pointed bone—position unresolved.” The famous horn was now a question."
          }
        ]
      }
    ]
  }
}
