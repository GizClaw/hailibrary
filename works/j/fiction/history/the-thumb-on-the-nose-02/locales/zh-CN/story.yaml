      ]
    }
  ],
  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "更多木箱在布鲁塞尔打开，尖骨总在前肢旁出现。几个头骨上，却找不到能接住鼻角的位置。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "参观者指着旧模型问：“新骨头会证明鼻角吗？”埃米尔回答：“它们也可能改变这幅图。”"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "曼特尔从牙齿得出的发现很重要，可尖骨当时孤零零的。把它放在鼻上，只是一种合理猜测。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "埃米尔摆出三只手。每只手都有三根粗指和一根细指，手腕旁的第一指位置还空着。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "1882年，装架工作搬进高大礼拜堂。绳索从脚手架垂下，德波开始吊起巨大骨架。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "多洛从不同角度比较关节。一次顺利拼合还不够，他叫埃米尔再拿一只手来。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "尖骨宽大的底面正好接上第一指。德波叫埃米尔别用力。“我没用力。”“你呼吸都在用力。”"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "另一只手也相同。尖刺成对长在第一指，两个头骨却没有它的位置，三条线索互相支持。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "埃米尔看见墙上的旧图。把尖骨移到手上，就等于让所有人看见那幅得意作品错了。那晚，他画了四步：孤立尖骨、矿下位置、成对的手，以及新的复原。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "多洛说：“旧图也留下。人们该看见猜测为何可能，也该看见证据为何让它改变。”"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "一根托绳突然松滑。埃米尔没有抓化石，而是垫稳石膏底座。三个人一起稳住那只手。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "后来，一个男孩笑旧鼻角。埃米尔只给他看孤立尖骨，问放在哪里。男孩也答不出。男孩看完四幅图，举起拇指对着化石。埃米尔把磨旧的橡皮留在新图旁。"
          }
        ]
      }
    ]
  }
}
