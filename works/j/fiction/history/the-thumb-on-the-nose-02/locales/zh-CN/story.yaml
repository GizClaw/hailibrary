    {
      "id": "q01",
      "type": "sequence",
      "prompt": "研究者怎样从尖骨走到拇指复原？",
      "answer": "他们比较多只手、试接第一指，再用另一只手和头骨核对。",
      "page_refs": [
        "p04",
        "p06",
        "p07"
      ]
    },
    {
      "id": "q02",
      "type": "cause-effect",
      "prompt": "为什么旧图必须改变？",
      "answer": "成对尖骨都接在第一指，而头骨没有能接住它们的位置。",
      "page_refs": [
        "p01",
        "p07",
        "p08"
      ]
    },
    {
      "id": "q03",
      "type": "character-motive",
      "prompt": "埃米尔为什么想先装别的部分？",
      "answer": "他害怕别人看见自己得意的旧图错了。",
      "page_refs": [
        "p08",
        "p09"
      ]
    },
    {
      "id": "q04",
      "type": "evidence",
      "prompt": "哪些分开的证据共同支持拇指尖刺？",
      "answer": "多只手留下相同空位，尖骨底面吻合，左右手相同，头骨又没有接口。",
      "page_refs": [
        "p01",
        "p04",
        "p06",
        "p07"
      ]
    },
    {
      "id": "q05",
      "type": "main-idea",
      "prompt": "保留旧图有什么作用？",
      "answer": "它让人看见旧猜测的理由，以及新证据怎样改变答案。",
      "page_refs": [
        "p09",
