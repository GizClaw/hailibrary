  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "More crates opened in Brussels. Pointed bones kept appearing beside forelimbs. The skulls had no clear place where such a horn could join."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "A visitor pointed at the old model. “The new bones will prove its horn, right?” Émile answered, “They may change the picture.”"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Mantell had made a strong discovery from the teeth in 1825. Yet the spike was once an isolated bone. Its place had been a reasonable guess."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "Émile arranged three hands. Each had three stout middle fingers and one narrow outer finger. The open first position waited beside the wrist."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "In 1882, the work moved into a tall chapel. Ropes hung from scaffolds while De Pauw began lifting the largest skeleton."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Louis Dollo compared each joint from several angles. A quick fit did not satisfy him. He asked Émile to bring a second hand."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "The spike’s broad base met the first finger smoothly. De Pauw warned Émile not to press. “I’m not pressing.” “You are pressing with your breath.”"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "The other hand matched. Paired spikes stood at the first fingers, while both skulls lacked a place for them. Three clues agreed."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "Émile saw his proud old drawing. Moving the spike would make it wrong in public. That night he drew four steps. They showed the loose spike, its mine position, the matching hands, and a corrected reconstruction."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "“Keep the old drawing,” Dollo said. “People should see why the guess was possible and why the evidence changed it.”"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "A support rope suddenly slipped. Émile secured the plaster base instead of grabbing the fossil. Together, the three men steadied the hand."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "A boy laughed at the nose horn. Émile showed him the isolated spike and asked where it belonged. The boy could not decide. After studying four drawings, he raised his thumb toward the fossil hand. Émile left his eraser beside the new picture."
          }
        ]
      }
    ]
  }
}
