        delivery: 机敏而认真
        timbre: 明亮的少年声音
        pace: 中快
        pitch: 中高音
    tala:
      display_name: 塔拉
      tts:
        delivery: 务实并带一点幽默
        timbre: 温暖的年长声音
        pace: 中慢
        pitch: 中低音
    pebble:
      display_name: 卵石
      tts:
        delivery: 友好而一板一眼
        timbre: 柔和的合成声音
        pace: 中速
        pitch: 中音
