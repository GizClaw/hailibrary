questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Pebble put the toy ball with the oranges?
    answer: It uses color and shape, so the round red toy seems like round fruit.
    page_refs:
      - p02
      - p03
      - p07
  - id: q02
    type: evidence
    speaker: narrator
    prompt: What evidence shows that appearance is not enough for sorting?
    answer: The toy ball and soap go to unsafe groups, and three similar shapes have different uses.
    page_refs:
      - p03
      - p05
      - p06
      - p08
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Tala bring unusual objects to the counter?
    answer: She wants to test the rules with difficult cases before people depend on them.
    page_refs:
      - p08
      - p11
      - p12
  - id: q04
    type: main-idea
    speaker: narrator
    prompt: What makes the improved sorting system more reliable?
    answer: It uses clearer features, pauses uncertain choices, includes human review, and makes the review area accessible.
    page_refs:
      - p10
      - p13
      - p14
      - p15
      - p16
      - p17
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: How does Em respond to each new problem?
    answer: She studies the cause, changes the system, and tests the change with other people.
    page_refs:
      - p07
      - p10
      - p13
      - p16
      - p17
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Em unveils Pebble at the market return counter. “It can sort every object in a blink.”
    - id: p02
      illustration: p02
      paragraphs:
        - text: Pebble sorts round oranges into the produce tray and announces, “Round and orange. Match found.”
    - id: p03
      illustration: p03
      paragraphs:
        - text: Then Pebble drops a red toy ball beside the oranges. “That is one very bouncy fruit,” Em jokes.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "Em laughs and removes the ball. "
            - text: She expects the next choice to be better.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Pebble sends a smooth green soap bar toward the vegetables. “Green and smooth. Match found.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: Tala stops the belt before the soap reaches the food. “A wrong match can make a real mess.”
    - id: p07
      illustration: p07
      paragraphs:
        - text: Em checks Pebble’s sensors. “It notices color and shape, but not use or material.”
    - id: p08
      illustration: p08
      paragraphs:
        - text: Tala holds up a cup, a planter, and a broken lampshade. “These shapes look alike, but they belong in different places.”
    - id: p09
      illustration: p09
      paragraphs:
        - text: Pebble pauses between the three objects. “One shape. Three possible groups.”
    - id: p10
      illustration: p10
      paragraphs:
        - text: Em adds trays with different openings and surfaces. “Now material and use matter too.”
    - id: p11
      illustration: p11
      paragraphs:
        - text: Tala calls the market workers over. “Bring the objects that are hardest to sort.”
    - id: p12
      illustration: p12
      paragraphs:
        - text: A child offers a wooden toy shaped like fruit. Pebble scans it. “Its shape says food. Its material says toy.”
    - id: p13
      illustration: p13
      paragraphs:
        - text: Em adds a coral paddle that pauses the belt. “Anyone can stop a doubtful choice.”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "Pebble sends ordinary items onward. "
            - text: It places uncertain objects on a review table.
    - id: p15
      illustration: p15
      paragraphs:
        - text: Tala reaches toward the review table, but it sits too high beside her cane. “I cannot reach that pile,” she tells Em.
    - id: p16
      illustration: p16
      paragraphs:
        - text: Em lowers the table and clears a wide path around it. “I tested Pebble, but I forgot this work area.”
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "Workers examine the unusual objects together. "
            - text: Their explanations help Em improve the rules.
    - id: p18
      illustration: p18
      paragraphs:
        - text: By evening, the food is safe and the review pile is small. Pebble sets down one strange object. “Human review, please.”
