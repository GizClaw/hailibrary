schema_version: 2
language: en-US
writer: rain-song
title: The Helpful Wrong Machine
summary: Em builds Pebble to sort market returns, but the robot mistakes look-alike objects for one another. Tala helps Em replace blind confidence with clearer rules, human review, and an accessible work area.
chapters:
  - id: ch01
    title: Quick Matches
    page_refs:
      - p01
