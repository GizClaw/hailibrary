audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: Calm and vivid like a folktale told aloud, timbre: Warm and resonant, pace: Measured with room for images to land, pitch: Low to mid}
    yugong:
      display_name: Yu
      tts: {delivery: Plainspoken patient and quietly certain, timbre: Weathered and grounded, pace: Deliberate, pitch: Low}
    lian:
      display_name: Lian
      tts: {delivery: Practical and perceptive with warmth beneath her firmness, timbre: Clear and mature, pace: Natural, pitch: Mid}
    zhisou:
      display_name: Old Zhi
      tts: {delivery: Direct and reasonable with dry humor and later hesitation, timbre: Lightly gravelled, pace: Moderate, pitch: Low to mid}
    jun:
      display_name: Jun
      tts: {delivery: Bright earnest and brisk, timbre: Clear and youthful, pace: Lively, pitch: Mid to high}
    neighbor_father:
      display_name: The Girl’s Father
      tts: {delivery: Urgent and breathless with worry, timbre: Strained adult voice, pace: Quick, pitch: Mid}
  chapters:
    - id: ch01
      title: The Mountains in the Way
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The old legend begins with two mountains standing shoulder to shoulder, just south of a village. Their peaks vanished into the weather. Their shadows came early and stayed late. And if you needed to reach the southern fields, you had to go east along a stony trail, squeeze through a ravine, and double back.

            One rainy autumn evening, Yu heard a cart before he saw it. A wheel was spinning in the mud outside his gate. The neighbor’s daughter lay under a quilt, shaking with fever, while her mother pulled and her father pushed.
        - id: ch01-b02
          speaker: neighbor_father
          text: The healer’s across the mountains!
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: |-
            Her father could barely get the words out. Yu and three others heaved the wheel free. Mud filled Yu’s sandals. Long after dark covered the village, he could still hear the cart knocking over stones on that long road around.

            At dawn, Yu walked to the place where Taihang and Wangwu met. He took a straight stick and drew a line in the ground, from the village road toward the hidden south. Wind poured down the rock face and lifted his white hair.

            That evening, he laid the stick beside the supper bowls.
        - id: ch01-b04
          speaker: yugong
          text: I want to open a road between the mountains.
        - id: ch01-b05
          speaker: narrator
          text: His sons stared. His grandchildren stopped chewing. Lian, his wife, set down the soup and started with the practical questions.
        - id: ch01-b06
          speaker: lian
          text: You rested three times just climbing the lower slope yesterday. A hoe hits that rock and throws sparks. Say you do break some loose. Where will you put it?
        - id: ch01-b07
          speaker: yugong
          text: The soil can fill the hollows. Flat stones can go on the road. We’ll carry the rest toward the distant water.
        - id: ch01-b08
          speaker: narrator
          text: Lian held up an old basket. Two strips had split along the rim.
        - id: ch01-b09
          speaker: lian
          text: How far can you carry this when it’s full? Who cuts the winter wood while you’re walking? Who looks after the grain?
        - id: ch01-b10
          speaker: narrator
          text: Yu took a sip of soup. It was already cooling.
        - id: ch01-b11
          speaker: yugong
          text: Tomorrow, we count all of that.
        - id: ch01-b12
          speaker: narrator
          text: The next morning, they were measuring the lowest rock face when Old Zhi appeared with a handcart. He’d tied on a sleeping mat, two chests, and a cooking pot.
        - id: ch01-b13
          speaker: zhisou
          text: Before you attack a mountain, try my smaller plan. Move south. The market’s close, there’s more winter sun, and you can carry a household one load at a time.
        - id: ch01-b14
          speaker: narrator
          text: |-
            Lian wanted to know what a move would really cost. Yu lifted the heavier chest off Zhi’s cart. They left the pot, the mat, and some clothes, then started out in the cool morning air.

            At the loose-stone slope, the cart lurched from one hole to the next. Zhi hauled the shafts. Yu pushed with his shoulder. Lian kept crouching to clear rocks from the wheels. At noon, they were still inside Taihang’s shadow. Whenever the pot started knocking, Zhi stopped to tighten the rope.

            They finally reached the southern fields near sunset. The warm air smelled of grain drying on mats. Zhi opened his blistered hands and smiled anyway.
        - id: ch01-b15
          speaker: zhisou
          text: There. A few more trips, and it’s done.
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: Yu looked back. The ridge hid every roof in the village. Lian rubbed her aching shoulder.
        - id: ch01-b17
          speaker: lian
          text: If we move here, what happens to Jun and her mother? Old Zhou’s mother can’t walk this road. Who moves first? Who goes back to help the next family?
        - id: ch01-b18
          speaker: narrator
          text: Zhi steadied the pot.
        - id: ch01-b19
          speaker: zhisou
          text: Every family has to choose for itself. Your road could take your whole life and still be nothing but a dent.
        - id: ch01-b20
          speaker: yugong
          text: Then we should find out if the dent is worth making.
        - id: ch01-b21
          speaker: narrator
          text: They came home by moonlight. Lian tended the blisters on Yu’s feet, finished the chores they’d missed, and replaced the broken strips on the basket.
        - id: ch01-b22
          speaker: lian
          text: I’m not afraid people will laugh. I’m afraid the mountain will still be standing, and you won’t. If we do this, we measure the loads. We divide the days. And I decide when you rest.
          emotion: fearful
        - id: ch01-b23
          speaker: yugong
          text: And if I refuse?
        - id: ch01-b24
          speaker: lian
          text: I hide the baskets.
        - id: ch01-b25
          speaker: yugong
          text: You wouldn’t.
        - id: ch01-b26
          speaker: lian
          text: The hammers too.
    - id: ch02
      title: The First Blow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Before the first frost, iron rang against stone. Yu’s first blow numbed his fingers and knocked loose a chip no bigger than a bean.

            His family dug earth, drove wooden wedges, and carried rubble. Lian sorted every piece. Broad stones went into the muddy village road. Small ones went into baskets. By dusk, the mountain had lost one tiny corner.

            Zhi measured it with the end of his cane.
        - id: ch02-b02
          speaker: zhisou
          text: At this pace, Wangwu will get tired of waiting before you finish Taihang.
        - id: ch02-b03
          speaker: yugong
          text: If it walks away from boredom, that saves us some work.
        - id: ch02-b04
          speaker: narrator
          text: Zhi laughed. Then his face turned serious.
        - id: ch02-b05
          speaker: zhisou
          text: I don’t want to watch you ruin your last years. Tomorrow you remove another corner. How many tomorrows do you own?
        - id: ch02-b06
          speaker: yugong
          text: I only need the next one.
        - id: ch02-b07
          speaker: narrator
          text: Zhi’s loaded cart stayed in his yard. He covered it when it rained and uncovered it in the sun. He didn’t want to leave his old home. And he didn’t want to admit that one hard trip had failed to answer every question.
    - id: ch03
      title: More Hands at the Mountain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Jun, the neighbor’s child, watched from a safe distance. Her mother let her carry water, but not go near the hammers.

            One afternoon, a loosened rock rolled right up to Jun’s feet. She didn’t touch it. The next morning, she came back with a basket barely bigger than a soup bowl.
        - id: ch03-b02
          speaker: jun
          text: I’ll pick up only the pieces that are already broken.
        - id: ch03-b03
          speaker: narrator
          text: |-
            Jun put three stones in the basket and walked the new stretch of road without running. When she returned, her mother shortened the strap and folded a cloth beneath it.

            The first time Jun emptied her basket into a hollow, the stones sounded like a quick burst of rain. On the second trip, she piled the basket high. Lian took half of them out.
        - id: ch03-b04
          speaker: lian
          text: Better a load you can carry ten times than one that carries you down.
        - id: ch03-b05
          speaker: narrator
          text: |-
            Jun scowled—at least until she got halfway there. Then she shifted the strap to her other shoulder. The next day, she came back.

            Other villagers came too. Not because they thought the mountains would disappear anytime soon. They came because the stone-covered road no longer swallowed wheels after rain.

            One person brought a hammer. Another shaped wedges. Some stayed an hour. Some came back every ten days. Yu never asked them to promise anything. He just showed them which cracks had opened.
    - id: ch04
      title: Season After Season
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Winter silenced the hammers. Yu repaired handles beside the fire, but his right hand shook, and the cord kept slipping from his fingers. Lian took it and tied the knot for him.
        - id: ch04-b02
          speaker: lian
          text: Less hammering when spring comes.
        - id: ch04-b03
          speaker: yugong
          text: Then someone else will have to do more.
        - id: ch04-b04
          speaker: lian
          text: Let them. A road doesn’t remember whose arm struck it.
        - id: ch04-b05
          speaker: narrator
          text: |-
            Outside, Jun and the other children used branches to scrape snow off the first paved stretch. Yu could hear them deciding where to extend it once the ground softened.

            In spring, workers were already at the mountain when Yu arrived. Jun’s basket looked smaller because she’d grown. And when Yu ran short of breath, younger hands lifted the hammer.

            The seasons kept turning. In summer, hammer blows mixed with cicadas. In autumn, baskets whispered over dry leaves. Snow filled the cut, then melted, and the ringing began again, a little deeper inside.

            At last, Zhi picked a clear morning to move south. He stopped his cart beside Yu, who was leaning on a hoe, waiting for his breath to settle.
        - id: ch04-b06
          speaker: zhisou
          text: Look at your hands. Look at your back. How many more years can you guard this hole?
        - id: ch04-b07
          speaker: narrator
          text: A young man took the hammer from Yu and struck the seam Yu had marked. Jun passed with an empty basket. Farther down the road, two women pressed gravel into the roadbed.
        - id: ch04-b08
          speaker: yugong
          text: When I was young, one trip around the mountains seemed cheap. I thought I had all the time in the world for detours. Now my time is short, and I can see that this detour outlives everyone.
        - id: ch04-b09
          speaker: zhisou
          text: That’s exactly why you shouldn’t throw the years you have left into it.
        - id: ch04-b10
          speaker: yugong
          text: My years will end. But the stone we took out won’t grow back. Whoever comes tomorrow starts after our last blow, not before our first.
        - id: ch04-b11
          speaker: narrator
          text: Zhi opened his mouth. Maybe he meant to say that children make different choices, or storms destroy roads, or no sensible person bets on people who haven’t been born yet. But just then, Jun squeezed between the two old men.
        - id: ch04-b12
          speaker: jun
          text: Grandfather Zhi, your cart’s blocking the baskets!
        - id: ch04-b13
          speaker: narrator
          text: Zhi rolled the cart aside. Its wheels settled firmly onto the gravel the workers had laid. He looked down at them for a moment. Then he started along the long road south.
    - id: ch05
      title: The Guardian’s Report
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            The old tale says a guardian spirit lived inside the mountains.

            At first, he ignored the faint tapping below. Mountains had survived lightning, floods, and earthquakes. A few iron hammers felt lighter than woodpeckers.

            But after every winter, the sound came back. Little by little, it crept inward. The old man slowed down while the child grew taller. Some faces disappeared. New ones took their places. No one could say when the road would be finished. But no one filled in the opening they’d already made.

            For the first time, the guardian was afraid. One human being could grow tired, grow old, or change his mind. But this work had learned to pass from one pair of hands to the next.

            So the guardian rose through the clouds and reported to the Ruler of Heaven. He didn’t pretend the opening was larger than it was. He only said it grew deeper every year. And he didn’t claim Yu would live forever. He only said that younger hands had already taken up the old man’s tools.

            In the legend, the Ruler of Heaven summoned the two mighty sons of Kua’e and ordered them to carry Taihang and Wangwu away.
    - id: ch06
      title: Southern Light
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            No one in the village saw them arrive.

            That night, Jun woke to a low rumble, like spring thunder rolling under the floor. Water trembled in Lian’s bowl. Yu sat up in the darkness and listened.

            At sunrise, the first person through the village gate stopped cold.

            Southern light spread across the well, the rooftops, and all the faces gathering in the road. Where the mountains had met, level ground now ran straight to the fields. Taihang stood impossibly far away in the east. Wangwu rested on the distant southern horizon. Their shadows could no longer reach the village.

            People rolled carts down the open road. Some walked halfway to the fields just so they could turn around and walk back. Jun ran farthest. She looked for the first notch, the one that had been wide enough for her foot. But it had gone with the mountains.

            The short gravel road beside the village was still there. A thin green shoot had risen between its stones.

            Late that morning, Zhi came from the south with part of his household loaded on his cart. Lian looked over the chests.
        - id: ch06-b02
          speaker: lian
          text: Bringing everything back?
        - id: ch06-b03
          speaker: narrator
          text: Zhi answered quickly, as though he didn’t want another question.
        - id: ch06-b04
          speaker: zhisou
          text: The road’s short now. Why should I live away?
        - id: ch06-b05
          speaker: narrator
          text: |-
            At the gravel road, one rope came loose. Lian tightened it. Yu took hold of the cart shaft without smiling. Zhi offered no more explanations.

            Jun passed them with her little basket swinging empty from one shoulder. The two old men turned the cart toward home. Then, side by side, they pushed it together along the new road.
