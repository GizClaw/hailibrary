audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 像围炉讲古一样沉静自然，画面清楚, timbre: 温厚沉稳, pace: 舒缓，关键处稍作停顿, pitch: 中低音}
    yugong:
      display_name: 愚公
      tts: {delivery: 朴实从容，话不多但拿得定主意, timbre: 苍老厚实, pace: 偏慢, pitch: 低音}
    lian:
      display_name: 阿莲
      tts: {delivery: 务实利落，关心里带着分寸, timbre: 温暖清亮, pace: 自然适中, pitch: 中音}
    zhisou:
      display_name: 智叟
      tts: {delivery: 直率讲理，偶有玩笑，后来多些迟疑, timbre: 略带沙哑, pace: 适中, pitch: 中低音}
    jun:
      display_name: 小君
      tts: {delivery: 真诚活泼，说话干脆, timbre: 清脆明亮, pace: 轻快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 山前的打算
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            很久以前，有个村子，南面挡着太行、王屋两座山。那山高得望不见顶。顺着山脚走一整天，人还在山影底下。村民去南边种田、赶集、走亲戚，都不能直走。他们得先向东绕，爬过乱石坡，再从窄谷口拐回来。

            所以，天还黑着，路上往往已经响起车轮。等人们回来，山顶的最后一点亮光也早就灭了。

            有一年秋天，雨连下了好几场。愚公站在家门前，看见邻居的车陷在泥里。车上躺着一个发烧的孩子。母亲在前面拉，父亲弯腰在后面推，泥水溅了他们一背。几个人帮忙把车抬出来。等他们绕到山南找到医者，月亮已经越过山肩。

            第二天一早，愚公带着直木棍去了两山相接的地方。他在泥地上划出一条线，一头朝村口，一头指向山后的南方。风吹乱了他的白发。他眯起眼，对着石壁看了很久。

            到了晚饭时，他把那根木棍横放在桌边。
        - id: ch01-b02
          speaker: yugong
          text: 我想从山中间开一条路。
        - id: ch01-b03
          speaker: narrator
          text: 屋里忽然没了声音。儿孙们看看山，又看看愚公，以为他在说笑。可他的手指贴着桌面，沿着一条看不见的路，慢慢往南划。阿莲端来热汤，没有跟着大家兴奋，先问起眼前的难处。
        - id: ch01-b04
          speaker: lian
          text: 你今天爬个坡，中间还歇了三次。那是硬石头，不是松土，锄头砸上去只能冒火星。就算把石头凿下来了，又往哪儿运？
        - id: ch01-b05
          speaker: yugong
          text: 山外远些的地方有水边，也有荒洼。土可以填洼地，碎石正好铺路。
        - id: ch01-b06
          speaker: narrator
          text: 阿莲掀开墙边的旧筐，叫他看磨断的篾条。
        - id: ch01-b07
          speaker: lian
          text: 你说起来倒容易。一筐石头有多沉？走到水边又有多远？你们都去开山，家里谁劈柴，谁看着过冬的粮？
        - id: ch01-b08
          speaker: narrator
          text: 愚公喝了一口凉汤，没有说以后自然会有办法。
        - id: ch01-b09
          speaker: yugong
          text: 这些都得算。明早一起去看。
        - id: ch01-b10
          speaker: narrator
          text: |-
            清早，一家人到了山脚。愚公找了一面较低的石壁，用炭做了记号。阿莲抓起一把土搓散，青灰色的硬石很快露了出来。她又装上半筐碎石，才走十几步，筐绳就勒进手掌。

            身后有人开了口，说先别急着砸山，他有个省力的法子。

            来的是河曲智叟。他拄着木杖，身旁停着小车。车上绑着两只箱笼、一卷席子和一口锅。他早想搬去山南。那边离集市近，冬天也少受山影里的寒气。他拍了拍车辕。
        - id: ch01-b11
          speaker: zhisou
          text: 就这么一家人的东西，分开多运几次，总能运完。搬到山南，哪里还用开路？你们要是想试，我先带你们走一趟。
        - id: ch01-b12
          speaker: narrator
          text: 阿莲望向愚公。搬家要花多少力气，又能换来什么，她也想试试。愚公便卸下一只沉箱，只留锅、席子和几包衣服。
        - id: ch01-b13
          speaker: yugong
          text: 那就少装些。咱们先把车送到山南，回来再决定。
        - id: ch01-b14
          speaker: narrator
          text: |-
            三个人趁早凉上了路。智叟拉车，愚公和阿莲在后面推。头一段还算平整，一到乱石坡，车轮不是悬空，就是卡死。愚公用肩顶车，脚底在湿土上直打滑。阿莲一次次蹲下搬石头，每回起身，腰都疼得发紧。智叟怕锅颠破，走一阵就得重新绑绳。

            太阳已经过了头顶，他们还是没走出太行山的阴影。一直到傍晚，三人才绕过谷口。南面的田野铺在夕阳下，风里飘着晒谷子的气味。智叟放开车绳，手心磨起两个水泡。他却笑了起来。
        - id: ch01-b15
          speaker: zhisou
          text: 看，这不是到了吗？再来几趟，床、柜子、农具，全能搬过来。是累，可总有搬完的时候。
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 愚公回头望去，山脊压着半边天。山北的炊烟、屋顶和那条陷过车的泥路，全都看不见。阿莲揉着酸麻的肩膀。
        - id: ch01-b17
          speaker: lian
          text: 我们搬来，那村里其他人怎么办？老周的母亲走不了这么远。小君家里，也只有她母亲一个大人。要是大家都搬，先由谁来帮谁？旧屋、井和田，也都不要了吗？
        - id: ch01-b18
          speaker: narrator
          text: 智叟伸手扶正车里的锅。
        - id: ch01-b19
          speaker: zhisou
          text: 每家自己拿主意。愿意来的人，也可以搬过来。
        - id: ch01-b20
          speaker: narrator
          text: 他不笑了，只盯着箱笼。沉默一阵，又说。
        - id: ch01-b21
          speaker: zhisou
          text: 可你们真去开山，忙完一辈子，没准眼前还只是一个坑。
        - id: ch01-b22
          speaker: yugong
          text: 那也得先看这个坑该不该挖。
        - id: ch01-b23
          speaker: narrator
          text: |-
            回去时，天很快黑透了。三个人轮流扶车，摸着石壁绕回村子。智叟把车停在门前，没有卸行李。愚公和阿莲到家，也没马上谈山。阿莲烧水挑破两人脚上的血泡，又补完白天耽搁的活。夜深以后，她才剪下新麻绳，穿进旧筐的筐沿。

            她低着头打结，告诉愚公，她并不是怕别人笑话他。
        - id: ch01-b24
          speaker: lian
          text: 我怕的是，山还没动，你先倒下。真要开山，不能只靠这一口气。早晨做多少，午后做多少，谁留下顾家，谁出去运石，都要先讲明白。
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: 愚公把已经磨钝的凿子放到灯下。
        - id: ch01-b26
          speaker: yugong
          text: 那什么时候该歇，由你来定。
        - id: ch01-b27
          speaker: lian
          text: 要是你不肯听呢？
        - id: ch01-b28
          speaker: yugong
          text: 你就把筐藏起来。
        - id: ch01-b29
          speaker: narrator
          text: 阿莲听了，终于笑了一声。
        - id: ch01-b30
          speaker: lian
          text: 锄头也得藏。
          emotion: happy
    - id: ch02
      title: 第一凿和小筐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            霜降还没到，他们就在山上敲下了第一凿。铁器撞上石头，发出清亮的一声，贴着山壁传开，把草丛里的鸟全惊飞了。愚公的手震得发麻。再敲一下，落下来的石屑却只有豆子那么大。

            儿孙们轮换着凿石、刨土。阿莲把石块分好。平整的拿去铺泥路，细碎的装筐送到荒洼和水边。每一趟都很慢。扁担吱呀作响，汗水落进灰土，点出深色的小印。

            第一天结束，石壁上不过少了一个小角。智叟拄杖过来看，还用杖头量了量缺口。
        - id: ch02-b02
          speaker: zhisou
          text: 按你们这个凿法，太行还没穿，王屋恐怕已经等烦了。
        - id: ch02-b03
          speaker: narrator
          text: 愚公坐在一块石头上，一面揉手腕，一面回答。
        - id: ch02-b04
          speaker: yugong
          text: 它要是真能等烦，自己走开，倒替我们省力了。
        - id: ch02-b05
          speaker: narrator
          text: 智叟本来还想劝他，听完忍不住笑了。可笑声一停，他的神色又认真起来。
        - id: ch02-b06
          speaker: zhisou
          text: 我不是专程来看你出丑。你比我岁数还大，一个人能过多少个秋天？今天少这一角，到了明年，也无非再少一角。
        - id: ch02-b07
          speaker: yugong
          text: 那明年就从第二角往下凿。
        - id: ch02-b08
          speaker: narrator
          text: 愚公没有叫智叟留下，智叟也没再劝。行李车还停在智叟院里，下雨盖席，放晴揭开。他舍不得丢下旧屋，也不愿承认那次试走没解决所有难处。他只等路再干些，好独自推车去山南。
        - id: ch02-b09
          speaker: narrator
          text: |-
            邻家的小君常常蹲在远处看。她想上前帮忙，母亲怕飞来的碎石伤到她，只准她送水。

            有一天，愚公他们刚撬松一块石头，那石头就滚下来，停在小君脚边。小君没有伸手碰，掉头跑回了家。第二天，她带来一只小筐，筐口只比饭盆大一点。
        - id: ch02-b10
          speaker: jun
          text: 我不往凿子跟前去。我只捡地上那些已经敲下来的石头。
        - id: ch02-b11
          speaker: narrator
          text: |-
            母亲仍然皱着眉。小君就往筐里放了三块小石头，顺着刚铺的路走了一趟，一步也没有跑。等她回来，母亲替她把筐绳收短，又在她肩头垫上一块布。

            小君头一回把石子倒进荒洼，听起来就像下了一小阵雨。她觉得这声音还不够响，第二趟便多装了一些。阿莲走过来，拿掉了一半。
        - id: ch02-b12
          speaker: lian
          text: 一只筐要能背着走十趟，不能头一趟就把人压坏。
        - id: ch02-b13
          speaker: narrator
          text: |-
            小君心里不大服气。可走到半路，她自己就明白了。她把筐挪到另一边肩上，回头看见石壁上的缺口已经大得能放进一只脚。第三天，她照样来了。

            那道缺口一天比一天宽。最早来帮忙的，是平日常去泥坑抬车的几个村民。他们并不觉得山很快就会没了。他们只是看到，铺了碎石的那段路，雨后再也不会一脚踩进一个泥坑。

            有人带来锤子，有人削好木楔，还有人做午饭时多添一份。有人干上半天，便赶回家照料田地。也有人过十天才来一次。愚公从来不问他们能来多久。他只把工具交到对方手里，再指出哪块石头已经松动。
    - id: ch03
      title: 一双手接一双手
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 冬天一来，山路被封，凿石的声音也停下了。风把雪末送进缺口，薄冰结满石缝。愚公坐在屋里换锄头把。他的手指冻得僵硬，麻绳绕了两圈，还是打不好结。阿莲接过去，才发现他的右手比上一年抖得更厉害。
        - id: ch03-b02
          speaker: lian
          text: 等开了春，你少抡几下锤子。
        - id: ch03-b03
          speaker: yugong
          text: 我要是少抡，别人不就得多抡吗？
        - id: ch03-b04
          speaker: lian
          text: 那就让别人多抡几下。路又不认是谁凿的。
        - id: ch03-b05
          speaker: narrator
          text: |-
            愚公抬起头。窗外，小君正和几个孩子拿树枝拨开积雪，让他们最早铺下的那段石路重新露出来。几个孩子你一句我一句，都说等到开春，还要把路往前接。

            雪化了。愚公再到山脚时，已经有人在忙。小君长高了些，原来的筐显得更小。她母亲在修独轮车，老周家的两个儿子正把冻裂的石片扫开。没有人等愚公开口。锤子落在石上，木楔打进裂缝。阳光照着刚露出的石面，亮得叫人睁不开眼。

            日子就这么从春走到秋。草青了又黄，鸟在崖缝里筑巢，又带着小鸟飞走。山路也有四季的声音。夏日，锤声混着蝉鸣。秋天，筐底擦过枯叶。冬天，空缺口里只剩风。第二年春暖，一下，又一下，敲石声从山里更深处重新响起。

            后来，智叟总算挑了一个晴天，把车绳全部勒紧，动身往山南搬。他推车走过工地，看见愚公扶着锄头大口喘气，过了好一会儿还直不起腰。小君和几个年轻人从愚公身后经过，一筐接一筐地把石头运出去。智叟停下了车。
        - id: ch03-b06
          speaker: zhisou
          text: 你自己看看，手也抖了，腰也弯了。就算你还能往前凿几步，又能在这个坑边守几年？
        - id: ch03-b07
          speaker: narrator
          text: 愚公没有立刻开口。他先等呼吸慢慢平下来。小君把空筐重新套上肩，催同伴让一让路。一个年轻人拿过愚公的锤子，对准他刚才指过的石缝砸下去。远一些的地方，还有人正在把碎石压进路基。
        - id: ch03-b08
          speaker: yugong
          text: 我年轻时总觉得，往后的日子还多着呢。所以该绕路就绕路，绕一次也不觉得怎样。现在留给我的日子短了，我才明白，这条绕路比哪一个人的日子都长。
        - id: ch03-b09
          speaker: zhisou
          text: 正因为这样，我才劝你，别把剩下的年月全丢在山里。
        - id: ch03-b10
          speaker: narrator
          text: 愚公望了望小君，又看着那些握住工具的年轻人。
        - id: ch03-b11
          speaker: yugong
          text: 我知道，我的年月总会用完。可他们还要继续生活，以后也会有自己的孩子。今天落下来的石头，不会明天又长回山上。后来的人到了这里，也不用再敲第一凿。山只会少，不会添。人却会一代一代走到这里来。
        - id: ch03-b12
          speaker: narrator
          text: 智叟张开嘴，又没有出声。他本想说，后人不一定愿意继续，风雨也可能毁掉这条路，更不能把世上的事全交给还没见过的人。这时，小君正好从两个老人中间挤了过去，回头喊他。
        - id: ch03-b13
          speaker: jun
          text: 智爷爷，快把车挪开呀！你挡着我们送空筐了！
        - id: ch03-b14
          speaker: narrator
          text: 智叟把车推到旁边。车轮落在大家铺的碎石路上，稳稳的，没有下陷。他低头看了一阵，什么也没说，推着行李继续绕山。后来他又走了几趟，终于住到山南。只是每次经过坡口，他都要回头望一眼。
    - id: ch04
      title: 守山神不安了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            这个古老的传说还讲到，两座山中住着一位守山神。

            起初，山脚下那几声脆响，他根本没放在心上。大山连雷劈、洪水和地动都见过。凡人的锤子落在山上，比啄木鸟还轻。

            可一个暖和的季节过去，声音虽然停了，寒风离开后，它又响了。第二年，那声音往山腹靠近了一点。到了第三年，守山神歇息的石座上，也能感觉到一丝轻轻的震动。

            他走遍两座山，看见旧缺口后添着新缺口，上一年的路连着今年的路。挥锤的老人越来越慢，运石的孩子却长高了。有些熟面孔不再出现，另一些新面孔来到石壁前。谁也没说哪天一定做完，可也没人肯把打开的路重新填上。

            守山神头一次不安了。他从来不怕某一个凡人。人会衰老，会疲倦，也会改变心意。可山脚下延续着的，并不是哪一个人的力气。前一双手停下时，已经给后一双手留下了接着干的位置。要是一直这样下去，就算寒来暑往千百回，那锤声也可能敲到山心。

            守山神乘云上天，把这些年所见所闻禀告天帝。他没有夸大缺口，只说它一年深过一年。他也没说愚公不会死，只说老人身后已经有人接过锤子。

            天帝听完，长久地望着云层下面。后来，他召来力大无穷的夸娥氏二子，叫他们背走太行和王屋。
    - id: ch05
      title: 山后的光
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            那天夜里，村里没有一个人看见神人来到。睡梦中的小君只听见一声闷响，好像很远的春雷从屋顶滚过去。阿莲醒来，发现碗里的水正在轻轻晃动。愚公在黑暗里坐起身，侧耳听着，可山脚下一点落石的声响都没有。

            第二天清早，第一个走出家门的人来到村口，忽然站住不动了。

            南方的光无遮无拦地照进村里。井台亮了，屋檐亮了，一张张惊讶的脸也亮了。从前两山相接的地方，如今只有一条平坦又开阔的路，一直伸到田野。太行和王屋已经退到遥远的天边。一座在很远的东面，一座在很远的南方。它们的山影再也落不到村口。

            村民们涌上新路。有人提水桶，有人推空车。还有人走出很远又折回来，只想试试这条不用爬坡、不用绕弯的路。小君跑在最前面，却在半路忽然停下，低头寻找从前那个能放进一只脚的缺口。

            那个缺口已经跟着大山去了远处。可村边还有一段碎石小路，是他们亲手铺下的。石头缝里，甚至长出了一株细细的草。
    - id: ch06
      title: 一起回家
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 日头升得老高时，智叟从山南回来了。他又往小车上放了几件行李，沿着清早才出现的新路，回旧村看一看。车轮滚得又快又轻，车上的锅和箱笼连颠都没有颠一下。阿莲瞧见他，便问。
        - id: ch06-b02
          speaker: lian
          text: 你怎么又把这些东西带回来了？
        - id: ch06-b03
          speaker: narrator
          text: 智叟抬手擦掉额头上的汗。
        - id: ch06-b04
          speaker: zhisou
          text: 路短了，我还搬什么？
        - id: ch06-b05
          speaker: narrator
          text: |-
            他答得又急又硬，像是怕旁人再问下去。可小车走到那段碎石路时，他还是停了下来，低头看着稳稳落在路上的车轮。

            愚公就在路旁，却没有拿这件事笑他。阿莲也没多说，只走上前，把车上松掉的绳结重新勒紧。小君提着空筐从三个人身边跑过去。筐底一下一下跳着，轻得几乎听不见声音。

            站在这条新路上，从南面来的人已经能远远望见村口，从村里出发的人也能望见南方。智叟把车头转了过来，愚公伸手替他扶住车辕。两个老人并肩推着小车，沿着这条清晨才露出来的路，慢慢地往家走去。
