schema_version: 1
required: true
sources:
  - authority: "Petroff et al., Identifying the source of perytons at the Parkes radio telescope, Monthly Notices of the Royal Astronomical Society (2015)"
    url: "https://arxiv.org/abs/1504.02165"
    claims:
      - Parkes perytons were terrestrial millisecond-duration swept-frequency signals that resembled cold-plasma dispersion.
      - Three new events were detected on 19, 22, and 23 January 2015 and were bright across the multibeam receiver.
      - A broadband interference monitor found simultaneous 2.3 to 2.5 GHz emission at Parkes, while the peryton appeared near 1.4 GHz.
      - Events clustered in office hours and particularly around lunchtime.
      - The decisive 17 March 2015 test reproduced three perytons when the staff-kitchen microwave door was opened before its cycle ended.
      - Detection depended on telescope orientation and a line of sight to the focus cabin; opening a door did not reproduce an event every time.
      - The responsible emission was associated with the magnetron shutdown phase, and the exact physical process producing the swept chirp remained unclear.
      - The microwave explanation did not invalidate FRB 010724; beam pattern, timing, pointing, and other properties distinguished genuine FRBs from perytons.
  - authority: "Keane et al., SUrvey for Pulsars and Extragalactic Radio Bursts I - Survey description and overview, Monthly Notices of the Royal Astronomical Society (2017)"
    url: "https://academic.oup.com/mnras/article/473/1/116/4083641"
    claims:
      - Real-time SUPERB searches and the interference monitor installed in December 2014 enabled rapid correlation of January 2015 events with local 2.4 to 2.5 GHz activity.
      - Local events appeared in most or all 13 receiver beams, unlike a typical sky-localized astrophysical event.
  - authority: "CSIRO, Parkes radio telescope"
    url: "https://www.csiro.au/en/about/facilities-collections/atnf/parkes-radio-telescope"
    claims:
      - The Parkes instrument is a 64-metre radio telescope in New South Wales, Australia.
  - authority: "U.S. Food and Drug Administration, Microwave Ovens"
    url: "https://www.fda.gov/radiation-emitting-products/resources-you-radiation-emitting-products/microwave-ovens"
    claims:
      - Modern compliant microwave ovens use independent door interlocks that stop microwave production when the latch is released or the door opens.
      - Users should follow the manufacturer's operating instructions and stop using an oven whose door is damaged or that continues operating with the door open.
notes:
  - "Factual boundary: the setting, dates, telescope, and detection mechanism follow the published Parkes investigation. Lin Yao, Tom Baird, Ruth Marlow, their dialogue, and the compressed day-to-day sequence are fictional. The story does not claim that the fictional team were the historical discoverers."
  - The narrative calls the signals candidates and interference before proof, not confirmed extraterrestrial discoveries.
  - The story describes the sweep as resembling dispersion rather than being true propagation through interstellar plasma.
  - The kitchen test establishes the source class under the reported geometry; it does not imply every microwave use creates a peryton.
  - The early-door-opening test is presented only as a historical controlled-maintenance action by trained staff, never as a child or household experiment.
  - The fictional fixed-lunchtime pattern compresses the published office-hour and lunchtime clustering for narrative clarity.
