audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 亲切细腻，像在身边讲故事, timbre: 温暖清晰, pace: 舒缓自然, pitch: 中}
    lin:
      display_name: 林澄
      tts: {delivery: 敏锐直率，带一点十岁孩子的倔强, timbre: 清亮女孩声线, pace: 自然偏快, pitch: 中高}
    grandma:
      display_name: 外婆
      tts: {delivery: 务实从容，偶尔带一点干脆的幽默, timbre: 柔和年长女声, pace: 不疾不徐, pitch: 中低}
    mom:
      display_name: 妈妈
      tts: {delivery: 忙碌亲切, timbre: 明亮成年女声, pace: 自然, pitch: 中}
    aunt_mei:
      display_name: 小姨
      tts: {delivery: 疲惫温柔, timbre: 轻柔成年女声, pace: 舒缓, pitch: 中}
  chapters:
    - id: ch01
      title: 会响的铁盒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            林澄在外婆家听见的第一场雨，不在窗外，在床底下。

            她趴在地上找充电线。手伸进床底那片凉凉的黑，摸到一个圆东西。往外一拖，里面立刻哗啦一响，像有一把硬糖滚过铁皮。林澄吓得缩回手。外婆听见声音，抱着半干的床单从阳台走来，眼镜上还沾着几点雨。
        - id: ch01-b02
          speaker: grandma
          text: 你在找什么呀？
        - id: ch01-b03
          speaker: lin
          text: 找我的充电线，昨天掉到床底了。这个盒子可不是我塞进去的。
        - id: ch01-b04
          speaker: grandma
          text: 它来这儿的时候，你还没来呢，早了好多年。
        - id: ch01-b05
          speaker: narrator
          text: 她们一起拖出铁盒。盒盖原来可能是蓝绿色的，如今褪得像阴天的河。上面有一圈模糊的小白花，边上还锈了一块。外婆用围裙擦掉灰，没有马上开盖。
        - id: ch01-b06
          speaker: narrator
          text: 林澄十岁了。最近，大人老说她就要当姐姐了，好像表妹一出生，她马上就会抱孩子，也知道怎么让孩子不哭。“你大了”这句话，她有点喜欢，又有点烦。面前这个不肯开口的铁盒，反而更让她好奇。
        - id: ch01-b07
          speaker: lin
          text: 盒子里装的是什么？既然还没用完，干吗塞在床底？
        - id: ch01-b08
          speaker: grandma
          text: 都是些没用完的东西。那你的充电线也没用完，怎么跑床底下去了？
        - id: ch01-b09
          speaker: narrator
          text: 林澄笑了。外婆用拇指顶开盒盖。几十颗纽扣挤在里面，有贝壳白、蜜糖黄、墨水蓝。有的闪亮，有的磨花。两孔、四孔的都有，还有一颗木头长扣。最上面那颗深绿大纽扣，四个孔像四只安静的眼睛。林澄伸手要拿，外婆先盖住了盒子。
        - id: ch01-b10
          speaker: grandma
          text: 你的手上有灰。
        - id: ch01-b11
          speaker: lin
          text: 纽扣也怕弄脏吗？
        - id: ch01-b12
          speaker: grandma
          text: 这里头有一颗怕。
        - id: ch01-b13
          speaker: narrator
          text: 外婆从盒底摸出一颗小珍珠扣，搁在手心里。它只比绿豆大一点，光软软地贴在上面。
        - id: ch01-b14
          speaker: grandma
          text: 你妈妈小时候有一件白衬衫，领口上缝的就是这种扣子。她头一回登台唱歌，紧张得把最上面那颗扯了下来。她就那么攥着纽扣，把整首歌唱完了。等她下台，我从她手心里找出纽扣，一摸，全是汗。
        - id: ch01-b15
          speaker: lin
          text: 妈妈也会紧张？
          emotion: surprised
        - id: ch01-b16
          speaker: grandma
          text: 可她那天还说，一点儿都不紧张。
        - id: ch01-b17
          speaker: lin
          text: 那她干吗把纽扣扯下来？
        - id: ch01-b18
          speaker: grandma
          text: 下次见到她，你自己问吧。
        - id: ch01-b19
          speaker: narrator
          text: 外婆放回珍珠扣，嘴角轻轻动了一下。林澄再看那些纽扣，它们已经不是一堆备用零件了。每一颗都像刚被人按住，才没有滚到故事外面去。
    - id: ch02
      title: 三颗留下来的纽扣
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雨更大了，阳台的铁栏杆嗒嗒地响。外婆把床单搭上椅背。林澄早忘了充电线，盘腿坐在地毯上，一颗颗地挑。她先举起一颗扁红扣。
        - id: ch02-b02
          speaker: lin
          text: 那这颗呢？
        - id: ch02-b03
          speaker: grandma
          text: 你舅舅七岁的时候，有一件红雨衣。他嫌帽子挡眼睛，淋着雨跑回来。到家一看，雨衣少了一颗扣，鞋里倒多了两条小鱼。
        - id: ch02-b04
          speaker: lin
          text: 鱼怎么会跑进他鞋里？
        - id: ch02-b05
          speaker: grandma
          text: 他一脚踩进沟里，先忙着捞鱼，把纽扣给忘了。
        - id: ch02-b06
          speaker: narrator
          text: 林澄笑得手一抖，红纽扣差点掉进暖气缝。外婆伸手一接，快得一点儿也不像七十岁的人。
        - id: ch02-b07
          speaker: narrator
          text: 蓝玻璃扣来自外公的旧毛衣。拍全家福那天，外公偏要反穿毛衣。他说，正面的补丁就该躲到相机看不见的地方。照片洗出来，领子歪歪的，蓝扣子倒亮得像一小滴水。
        - id: ch02-b08
          speaker: narrator
          text: 木头长扣是外婆自己的。许多年前，她坐长途车去另一座城学缝衣。车窗漏风，她把大衣一颗颗扣紧。可到了站，长扣只剩一根线挂着。她舍不得剪掉，就用手护着，一路走到裁缝铺，才把它重新缝牢。
        - id: ch02-b09
          speaker: lin
          text: 既然缝好了，后来为什么又把它剪下来？
        - id: ch02-b10
          speaker: grandma
          text: 因为大衣穿破了。
        - id: ch02-b11
          speaker: lin
          text: 可这颗纽扣你还留着呀。
        - id: ch02-b12
          speaker: grandma
          text: 木头没破。
        - id: ch02-b13
          speaker: narrator
          text: 外婆答得很快，好像这就够了。林澄把红、蓝、木头三颗扣子摆在膝盖上。她喜欢这些故事，心里却有点不服气。纽扣全都见过大人小时候，只有她像个最后进门的客人。
        - id: ch02-b14
          speaker: lin
          text: 这里有没有我的纽扣？
        - id: ch02-b15
          speaker: narrator
          text: 外婆翻了半天，拿出一颗淡黄的小熊扣。林澄认得，它来自自己三岁时的背带裤。裤子她早忘了，只记得照片里那个圆脸孩子，妈妈总爱拿给亲戚看。
        - id: ch02-b16
          speaker: lin
          text: 这颗我不要。
        - id: ch02-b17
          speaker: narrator
          text: 外婆的手停在半空。
        - id: ch02-b18
          speaker: grandma
          text: 为什么不想要？
        - id: ch02-b19
          speaker: lin
          text: 我连那时候的事都不记得。这是你们讲给我的，不算我的故事。
        - id: ch02-b20
          speaker: narrator
          text: 屋里只听得见雨声。外婆没有说她小时候有多可爱，也没有劝她留下。她把小熊扣放回去，盒盖却没合严，留下一道窄窄的缝。
        - id: ch02-b21
          speaker: grandma
          text: 那就等一颗你记得的。
        - id: ch02-b22
          speaker: narrator
          text: 林澄从缝里又看了看小熊扣，然后按紧盒盖。她想要一颗自己记得的纽扣，不想借走别人的故事。至少这个决定，是她自己做的。
    - id: ch03
      title: 一件来不及买的衣服
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 傍晚，妈妈打来视频。屏幕那边，小姨梅梅靠着医院的白枕头，怀里露出一张皱皱的红脸。刚出生的小表妹闭着眼睛，小嘴一动一动，像在梦里尝什么味道。
        - id: ch03-b02
          speaker: mom
          text: 宝宝，姐姐来看你了。
        - id: ch03-b03
          speaker: narrator
          text: 妈妈把手机往宝宝面前凑。林澄下意识地退了半步。
        - id: ch03-b04
          speaker: lin
          text: 她现在看不见我吧？
        - id: ch03-b05
          speaker: mom
          text: 再过两天，她就回外婆家住了。你不是说，要送妹妹一件礼物吗？
        - id: ch03-b06
          speaker: narrator
          text: 林澄的确说过。她本想用攒的钱买一件小兔子外套，图片都存好了。可那家店缺货，别的款式怎么看都像临时替代品。她也不想让大人替她挑一件，再说反正宝宝都能穿。
        - id: ch03-b07
          speaker: narrator
          text: 视频结束，林澄闷闷地回到铁盒旁。桌上已经铺着一块奶油色的软布，旁边还有纸样、尺子和线轴。
        - id: ch03-b08
          speaker: lin
          text: 外婆，这些是做什么的？
        - id: ch03-b09
          speaker: narrator
          text: 外婆用手背碰了碰那块布。
        - id: ch03-b10
          speaker: grandma
          text: 我原来想拿它做条小毯子。现在再量量，应该够做一件小外套。
        - id: ch03-b11
          speaker: lin
          text: 可这上面没有小兔子。
        - id: ch03-b12
          speaker: grandma
          text: 那你也可以接着等，等那家店有货。
        - id: ch03-b13
          speaker: narrator
          text: 外婆语气平平的，林澄却听出了挑战。她放大手机图片。兔耳朵帽子、粉色拉链、胸口的笑脸，的确很可爱。可屏幕暗下去，桌上只剩这块摸得到的布。
        - id: ch03-b14
          speaker: lin
          text: 要是现在开始，我们来得及做完吗？
        - id: ch03-b15
          speaker: grandma
          text: 我一个人，今晚做不完。两个人，也不一定。
        - id: ch03-b16
          speaker: narrator
          text: 外婆把尺子递了过去。林澄接住了。
        - id: ch03-b17
          speaker: narrator
          text: 林澄按住纸样，外婆沿边画线。第一刀剪得太靠里，外婆没有拿走剪刀，只把那一小段线重新画宽。剪刀咔嚓咔嚓地往前走，雨声渐渐远了。前片、后片和袖子排在桌上，像一只还不会动的小动物。
        - id: ch03-b18
          speaker: narrator
          text: 缝纫机也搬了出来。外婆踩下踏板，针飞快地上下闪。林澄不敢靠太近，只在布边快歪时提醒。缝袖口时，她试着踩了几下。机器忽然蹿快，针脚歪出一截。她赶紧松脚。
        - id: ch03-b19
          speaker: lin
          text: 这段拆了吧，我重新缝。
        - id: ch03-b20
          speaker: grandma
          text: 袖口还要往里折，歪的地方会藏起来，别人看不见。
        - id: ch03-b21
          speaker: lin
          text: 我看得见。
        - id: ch03-b22
          speaker: narrator
          text: 外婆就把拆线器交给了她。细线得一截一截挑出来，拆起来比缝上去慢得多。拆到一半，林澄手心都出汗了，差点就想说算了。可她想起了那颗被妈妈攥在汗手里的珍珠扣。她换了个握法，接着往下拆。
        - id: ch03-b23
          speaker: narrator
          text: 夜里十点，小外套总算有了模样。奶油色衣身，淡蓝色包边，两只小袖子软软垂着。外婆拿出两片宽软粘扣带。它们会沿四边缝牢，藏在交叠的衣襟内侧，不留能被宝宝扯下的小零件。
        - id: ch03-b24
          speaker: grandma
          text: 衣襟就用这个合上，剩下的明天再缝。你还可以挑一颗纽扣，缝在纪念布片上。
        - id: ch03-b25
          speaker: narrator
          text: 林澄一眼就挑中了那颗深绿色的大纽扣。奶油色的布衬着它，特别显眼，像雨后的一片叶子。她把纽扣拿起来，才发现外婆这回没有拦她。
        - id: ch03-b26
          speaker: lin
          text: 这颗纽扣以前是谁的？
        - id: ch03-b27
          speaker: narrator
          text: 外婆用手指捻着一小截线头。
        - id: ch03-b28
          speaker: grandma
          text: 你妈妈五岁的时候，邻居送了她一件绿毛衣。她喜欢得不得了，袖子短了一大截都不肯脱。后来毛衣拆掉了，别的扣子也用到了别处，就剩下这一颗。
        - id: ch03-b29
          speaker: narrator
          text: 林澄捏着绿纽扣。她真的很喜欢，可这颗纽扣里装的，还是别人的故事。她把它放在一小块奶油色布上，没有马上去拿针。
    - id: ch04
      title: 还没缝好的粘扣带
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天下午，小姨和宝宝提前回来了。门一开，屋里挤满了声音。塑料袋响，保温壶响。妈妈说鞋别挡路，舅舅嘴上说只待五分钟，却提着三袋东西。宝宝裹在浅灰色毯子里，脸比视频里还小。
        - id: ch04-b02
          speaker: narrator
          text: 外套还差最后两片软粘扣带，没有缝牢。林澄把它藏在身后，原本想等所有线头都收拾干净，再好好地拿出来。可是外婆忙着扶小姨坐下，妈妈忙着给宝宝换尿布，谁也没顾上看她。
        - id: ch04-b03
          speaker: narrator
          text: 宝宝突然哭了。不是视频里那种细细的一声。她的脸一下涨红了，两只拳头举到耳朵边，像是在抗议屋里所有的灯光和手。林澄抱着外套站在客厅中间，不知道自己该走近一点，还是赶紧让开。
        - id: ch04-b04
          speaker: aunt_mei
          text: 窗帘拉上一点吧。
        - id: ch04-b05
          speaker: narrator
          text: 小姨说话很轻。林澄马上过去拉窗帘。屋里暗了一些，宝宝的哭声也慢慢变短了。这时，小姨看见了她手里的小衣服。
        - id: ch04-b06
          speaker: aunt_mei
          text: 这件外套是你做的吗？
        - id: ch04-b07
          speaker: lin
          text: 是我和外婆一起做的，不过还差一点才好。
        - id: ch04-b08
          speaker: narrator
          text: 小姨摸了摸淡蓝色的边，眼睛弯了起来。
        - id: ch04-b09
          speaker: aunt_mei
          text: 她也还没长好呀。没关系，先给她试一下吧。
        - id: ch04-b10
          speaker: narrator
          text: 外婆把衣服轻轻披在宝宝身上。大小正合适，可两边的衣襟总往外滑，像两扇不肯关的小门。
        - id: ch04-b11
          speaker: mom
          text: 看来还得先把粘扣带缝好。
        - id: ch04-b12
          speaker: narrator
          text: 桌上放着两片宽宽的软粘扣带，旁边就是绿纽扣和那块奶油色的布。
        - id: ch04-b13
          speaker: narrator
          text: 宝宝抓住了林澄的小指。那只手小得惊人，抓得却很认真。林澄不敢动。她看着外套胸前空着的地方，忽然懂了。她不用再去铁盒里找一个过去的位置。就在桌边、窗帘旁和这只小手里，她正在留下今天。她没有把这些话说出来。
        - id: ch04-b14
          speaker: lin
          text: 外套用软粘扣带。绿扣子留给布片。
        - id: ch04-b15
          speaker: grandma
          text: 你舍得把它收起来？
        - id: ch04-b16
          speaker: lin
          text: 它会收在铁盒里，不让宝宝碰到。
        - id: ch04-b17
          speaker: narrator
          text: 林澄在窗边坐下，把线穿进针眼。外婆没有替她动手，只帮她在线尾打了个结。第一针从布背后穿出来，有点偏。林澄把针退回去，又来了一次。
        - id: ch04-b18
          speaker: narrator
          text: 妈妈举起手机，正想拍照。林澄摇了摇头。
        - id: ch04-b19
          speaker: lin
          text: 先别拍，等我把它缝好。
        - id: ch04-b20
          speaker: narrator
          text: 林澄沿着四条边，把一片宽粘扣带缝平。外婆把另一片固定在另一边衣襟上。两片软布轻轻一压，外套就合上了，没有一颗会松脱的小扣子。宝宝在淡蓝色的衣领上面，轻轻动了动下巴。
        - id: ch04-b21
          speaker: lin
          text: 那现在，这就是她的故事了吗？
        - id: ch04-b22
          speaker: narrator
          text: 外婆把铁盒放到林澄身边。
        - id: ch04-b23
          speaker: grandma
          text: 衣服是她的。故事是你们一起开始的。
    - id: ch05
      title: 今天的纽扣
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 宝宝睡着后，屋里终于安静了。小姨靠在沙发上喝汤。妈妈和舅舅在厨房压低声音，争谁洗碗。林澄把针线收进木盒，照外婆的规矩数了两遍针。
        - id: ch05-b02
          speaker: narrator
          text: 她拿回绿纽扣和那块奶油色的布。先在碎布上练了三次，到了第四次，终于把绿纽扣缝稳了。布片背后的线结，像一小撮乱草。林澄看了看，没有拆。她把布片放进铁盒，四周都是那些旧纽扣。
        - id: ch05-b03
          speaker: grandma
          text: 这一颗，是谁的纽扣？
        - id: ch05-b04
          speaker: narrator
          text: 林澄学着外婆先前说话的样子，答得又快又干脆。
        - id: ch05-b05
          speaker: lin
          text: 一颗我记得的。
        - id: ch05-b06
          speaker: narrator
          text: 外婆笑出了声，把盒盖合上。哗啦一响，旧纽扣碰着新布片。
        - id: ch05-b07
          speaker: narrator
          text: 卧室里，宝宝轻轻哼了一声。林澄站起来，过去看她。宝宝睡在小姨怀里。那件奶油色的小外套叠好了，放在椅子上。软粘扣带安安全全地藏在衣襟内侧。
        - id: ch05-b08
          speaker: narrator
          text: 身后，外婆挪了挪铁盒，盒里轻轻响了一下。
