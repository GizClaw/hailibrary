audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: intimate and observant, timbre: warm and clear, pace: relaxed, pitch: medium}
    lin:
      display_name: Nora
      tts: {delivery: alert and candid with a stubborn edge, timbre: clear young girl voice, pace: naturally brisk, pitch: medium-high}
    grandma:
      display_name: Grandma June
      tts: {delivery: practical and dryly funny, timbre: soft older woman voice, pace: unhurried, pitch: medium-low}
    mom:
      display_name: Mom
      tts: {delivery: busy and affectionate, timbre: bright adult woman voice, pace: natural, pitch: medium}
    aunt_mei:
      display_name: Aunt May
      tts: {delivery: tired and gentle, timbre: soft adult woman voice, pace: relaxed, pitch: medium}
  chapters:
    - id: ch01
      title: Weather Under the Bed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The first storm Nora heard at Grandma June's apartment wasn't outside. It was under the guest-room bed.

            Nora had one cheek on the floor and one arm in the cool dark, searching for her charging cable. Her fingers hit something round. She pulled, and it answered with a sharp metal rattle, like hard candy tumbling down a fire escape. Nora jumped back. Grandma appeared in the doorway with damp sheets in her arms and three raindrops shining on her glasses.
        - id: ch01-b02
          speaker: grandma
          text: What are you hunting?
        - id: ch01-b03
          speaker: lin
          text: My cable. It fell back there last night. And I didn't put that thing there.
        - id: ch01-b04
          speaker: grandma
          text: That thing was here before you were.
        - id: ch01-b05
          speaker: narrator
          text: |-
            Together they tugged out a round tin. It had once been turquoise. Now it was the color of a cloudy pond, with faded cream flowers and a thumbprint of rust near one hinge. Grandma wiped it with her apron but didn't open it.

            Nora was ten, which meant adults kept telling her she was old enough. Her new cousin was coming home from the hospital, and everyone said Nora would be the big girl now. That sounded nice for half a second. Then it pinched. Apparently she was supposed to know how to hold a baby and stop one crying without anyone showing her. The silent tin was much more interesting.
        - id: ch01-b06
          speaker: lin
          text: What's inside? And if you didn't finish using it, why hide it under the bed?
        - id: ch01-b07
          speaker: grandma
          text: Things I didn't finish using. So why is your unfinished charging cable under there?
        - id: ch01-b08
          speaker: narrator
          text: |-
            Nora laughed. Grandma pressed her thumb to the lid, and it popped open. Buttons crowded inside: shell white, honey yellow, ink blue. Some shone; some were scratched cloudy. There were two-hole buttons, four-hole buttons, a wooden toggle, and one large green button staring up with four quiet eyes. Nora reached for it, but Grandma covered the tin first.
        - id: ch01-b09
          speaker: grandma
          text: Dusty fingers.
        - id: ch01-b10
          speaker: lin
          text: Buttons don't mind dust.
        - id: ch01-b11
          speaker: grandma
          text: One of them might.
        - id: ch01-b12
          speaker: narrator
          text: Grandma dug near the bottom and lifted a pearl button no bigger than a lentil. Light rested softly on its curved face.
        - id: ch01-b13
          speaker: grandma
          text: This came from your mother's white concert blouse. At her first solo, she worried the top button loose and held it in her fist through the whole song. I found it in her wet palm afterward.
        - id: ch01-b14
          speaker: lin
          text: Mom got scared?
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: Nora sat up.
        - id: ch01-b16
          speaker: grandma
          text: She claimed she wasn't.
        - id: ch01-b17
          speaker: lin
          text: Then why did she pull off her button?
        - id: ch01-b18
          speaker: grandma
          text: You can ask her.
        - id: ch01-b19
          speaker: narrator
          text: One corner of Grandma's mouth lifted. When Nora looked into the tin again, she didn't see spare parts. Each button seemed to have been caught just before it rolled out of a story.
    - id: ch02
      title: Three That Stayed
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Rain ticked against the balcony rail. Grandma draped the damp sheets over chair backs. Nora forgot her cable, sat cross-legged on the rug, and picked up a flat red button.
        - id: ch02-b02
          speaker: lin
          text: What about this one?
        - id: ch02-b03
          speaker: grandma
          text: Your uncle's raincoat. He was seven, and the hood kept falling over his eyes. He came home with one button missing and two minnows in his boots.
        - id: ch02-b04
          speaker: lin
          text: How did fish get into his boots?
        - id: ch02-b05
          speaker: grandma
          text: He stepped in the creek. He remembered to rescue the fish and forgot to rescue the button.
        - id: ch02-b06
          speaker: narrator
          text: |-
            Nora laughed so hard the button nearly fell through the heating grate. Grandma caught it with a hand far too quick for anyone's idea of an old lady.

            A blue glass button came from Grandpa's favorite sweater. For a family photograph, he wore the sweater backward so its patched elbow would face away from the camera. His collar leaned sideways in the picture, but that blue button shone like a bead of water.

            The wooden toggle was Grandma's. Years ago, she rode a bus to another city to learn dressmaking. Cold air leaked through the window, so she fastened her coat right to the throat. When she arrived, the toggle hung by one thread. She guarded it in her fist all the way to the tailor shop and sewed it back on before she even took off her coat.
        - id: ch02-b07
          speaker: lin
          text: Then why did you cut it off later?
        - id: ch02-b08
          speaker: grandma
          text: The coat wore out.
        - id: ch02-b09
          speaker: lin
          text: But you kept the button.
        - id: ch02-b10
          speaker: grandma
          text: The wood didn't wear out.
        - id: ch02-b11
          speaker: narrator
          text: Grandma said it as if that settled everything. Nora lined up the red, blue, and brown buttons on her knee. She loved their stories, but something in her tightened. Every button knew the adults before they were adults. Nora felt like a guest who'd arrived after all the good chairs were taken.
        - id: ch02-b12
          speaker: lin
          text: Is there one from me?
        - id: ch02-b13
          speaker: narrator
          text: Grandma found a pale yellow bear button from the overalls Nora had worn at three. Nora didn't remember the overalls. She only remembered the picture of her round toddler face that Mom loved showing relatives.
        - id: ch02-b14
          speaker: lin
          text: I don't want that one.
        - id: ch02-b15
          speaker: narrator
          text: Grandma's hand stopped between them.
        - id: ch02-b16
          speaker: grandma
          text: Why not?
        - id: ch02-b17
          speaker: lin
          text: Because I don't remember it. That's your story about me.
          emotion: sad
        - id: ch02-b18
          speaker: narrator
          text: For a moment, only the rain spoke. Grandma didn't call her adorable or tell her to be grateful. She put the bear back and left the lid open just a crack.
        - id: ch02-b19
          speaker: grandma
          text: Then we'll wait for one you remember.
        - id: ch02-b20
          speaker: narrator
          text: Nora looked through the crack, then pressed the lid shut herself. She still wanted a button with a story she could remember, but she wouldn't borrow someone else's. At least that choice belonged to her.
    - id: ch03
      title: The Coat They Could Touch
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That evening, Mom called from the hospital. On the screen, Aunt May rested against a white pillow with a wrinkled red face tucked beside her. The baby's eyes were closed, and her mouth moved as if she were tasting a secret in her sleep.
        - id: ch03-b02
          speaker: mom
          text: Your cousin is meeting you.
        - id: ch03-b03
          speaker: narrator
          text: Mom brought the phone closer. Nora leaned away without meaning to.
        - id: ch03-b04
          speaker: lin
          text: She can't see me, can she?
        - id: ch03-b05
          speaker: mom
          text: She'll be at Grandma's in two days. Didn't you say you had a present?
        - id: ch03-b06
          speaker: narrator
          text: |-
            Nora had said she had a present. She'd saved enough allowance for a jacket with rabbit ears on the hood. The picture was still on her phone, but the store had sold out. Every other jacket felt like a last-minute substitute, and she didn't want an adult choosing one and saying babies could wear anything.

            After the call, Grandma spread cream-colored cloth over the table. A paper pattern, ruler, chalk, and spools of thread waited beside it.
        - id: ch03-b07
          speaker: lin
          text: What's that for?
        - id: ch03-b08
          speaker: narrator
          text: Grandma rubbed the cloth between two fingers.
        - id: ch03-b09
          speaker: grandma
          text: I planned to make a small blanket. There's enough for a coat.
        - id: ch03-b10
          speaker: lin
          text: It won't have rabbit ears.
        - id: ch03-b11
          speaker: grandma
          text: You can keep waiting for the store.
        - id: ch03-b12
          speaker: narrator
          text: Grandma's voice was flat, but Nora heard the dare. She enlarged the saved picture. The rabbit-ear hood, pink zipper, and smiling face looked perfect while her screen glowed. When it went dark, the real cloth was still under her hand.
        - id: ch03-b13
          speaker: lin
          text: Can we finish in time?
        - id: ch03-b14
          speaker: grandma
          text: I can't finish tonight alone. Together, we still might not.
        - id: ch03-b15
          speaker: narrator
          text: |-
            Grandma held out the ruler, and Nora took it.

            Nora held the paper pattern while Grandma traced it. Nora's first cut wandered inside the chalk line. Grandma didn't grab the scissors. She simply redrew that short edge a little narrower, and Nora kept going. Snip by snip, the storm moved farther away. They laid out two front pieces, one back, and two sleeves. Together, the pieces looked like a little animal that hadn't learned to stand.

            Grandma lifted the sewing machine from the cabinet and pressed the pedal. The needle flashed. Nora stayed clear and watched the cloth edge, tapping the table whenever it started to drift. At the cuff, Grandma let her try. The machine leaped, and the stitches shot crooked across the cloth. Nora pulled her foot away.
        - id: ch03-b16
          speaker: lin
          text: Take it out.
        - id: ch03-b17
          speaker: grandma
          text: The cuff folds over it. No one will see.
        - id: ch03-b18
          speaker: lin
          text: I will.
        - id: ch03-b19
          speaker: narrator
          text: |-
            Grandma handed her the seam ripper. Taking the stitches out was much slower than putting them in. Halfway through, Nora's palm grew damp and she wanted to quit. Then she remembered Mom's pearl button in that sweaty fist. She changed her grip and picked out the next stitch.

            At ten that night, the coat finally had a shape: a cream body, pale blue edging, and two soft sleeves. Grandma set down two broad pieces of soft hook-and-loop tape. They would be sewn flat inside the overlapping fronts, with no small loose piece for the baby to pull free.
        - id: ch03-b20
          speaker: grandma
          text: These will close the coat. We can finish them tomorrow. You can still pick a button for the keepsake scrap.
        - id: ch03-b21
          speaker: narrator
          text: Nora reached at once for the big green button. Against the cream cloth, it looked like a leaf after rain. She lifted it, then noticed Grandma hadn't moved.
        - id: ch03-b22
          speaker: lin
          text: Whose was this?
        - id: ch03-b23
          speaker: narrator
          text: Grandma rolled a thread end between her fingers.
        - id: ch03-b24
          speaker: grandma
          text: Your mother had a green sweater when she was five. A neighbor gave it to her. She wore it until the sleeves stopped halfway down her arms. When I unraveled it, I used the other buttons. This one stayed.
        - id: ch03-b25
          speaker: narrator
          text: Nora closed her fingers around the green button. She loved it, but it still carried someone else's story. She set it on a scrap of cream cloth and didn't ask for the needle yet.
    - id: ch04
      title: The Unfinished Fastening
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            Aunt May and the baby came home a day early. Suddenly the apartment was full of crackling bags, a thermos knocking against the wall, Mom warning everyone about the shoes, and Uncle Rob claiming he'd stay five minutes while carrying in three bags. The baby was wrapped in a pale gray blanket, and her face looked much smaller than it had on the phone.

            The coat still needed its soft fastening. Nora hid it behind her back. She'd planned to trim every thread and present it properly. But Grandma was helping Aunt May sit down, Mom was changing the baby, and no one noticed Nora in the middle of the room. Then the baby cried. It wasn't the thin sound she'd made on the phone. Her whole face turned red, and her fists rose beside her ears as if she objected to every lamp and hand in the room. Nora stood there with the coat, unsure whether to step closer or move aside.
        - id: ch04-b02
          speaker: aunt_mei
          text: Could someone close the curtain halfway?
        - id: ch04-b03
          speaker: narrator
          text: Aunt May's voice was almost lost under the crying. Nora moved first. The room softened, and the cries grew shorter. Then Aunt May noticed the coat.
        - id: ch04-b04
          speaker: aunt_mei
          text: Did you make that?
        - id: ch04-b05
          speaker: lin
          text: Grandma and I did. It isn't finished.
        - id: ch04-b06
          speaker: aunt_mei
          text: Neither is she. Let's try it.
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: |-
            Aunt May touched the pale blue edge, and her tired eyes curved. Grandma laid the coat lightly over the baby. It fit, but the fronts slipped apart like doors that wouldn't stay closed.
        - id: ch04-b08
          speaker: mom
          text: It needs its fastening.
        - id: ch04-b09
          speaker: narrator
          text: |-
            The broad fabric strips waited on the table beside the green button and cream scrap.

            Then the baby caught Nora's smallest finger. Such a tiny hand, but such a serious grip. Nora didn't move. Looking at the empty place on the coat, she understood she didn't need the tin to give her a piece of the past. She was right here at the table, beside the curtain, inside that little hand's grasp. She was making today. She didn't say any of that out loud.
        - id: ch04-b10
          speaker: lin
          text: Use the soft strips for her coat. I want the green button for the scrap.
        - id: ch04-b11
          speaker: grandma
          text: Sure?
        - id: ch04-b12
          speaker: lin
          text: It'll stay in the tin, away from the baby.
        - id: ch04-b13
          speaker: narrator
          text: Nora sat by the window and pushed the thread toward the needle's eye. Grandma didn't take it from her. She only knotted the end once Nora got it through. The first stitch came up crooked, so Nora backed it out and tried again. When Mom raised her phone for a picture, Nora shook her head.
        - id: ch04-b14
          speaker: lin
          text: When I'm done.
        - id: ch04-b15
          speaker: narrator
          text: Nora sewed one broad strip flat around all four edges while Grandma secured its partner to the other front. Pressed together, they closed the coat without a loose button. The baby's chin moved above the pale blue edge.
        - id: ch04-b16
          speaker: lin
          text: Is the story hers now?
        - id: ch04-b17
          speaker: narrator
          text: Grandma set the tin beside Nora.
        - id: ch04-b18
          speaker: grandma
          text: The coat is hers. The story started with both of you.
    - id: ch05
      title: The Button from Today
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            After the baby fell asleep, the apartment finally quieted. Aunt May drank soup on the sofa. Mom and Uncle Rob whisper-argued over the dishes. Nora put away the needles and counted them twice, just as Grandma had taught her.

            She brought back the green button and the cream scrap. Three times she practiced on spare cloth. On the fourth, she sewed the button firmly in place. The knots on the back looked like a nest built in a hurry. She left them. Then she set the scrap in the tin, and the old buttons crowded around it.
        - id: ch05-b02
          speaker: grandma
          text: Whose button is that?
        - id: ch05-b03
          speaker: narrator
          text: Nora borrowed Grandma's brisk voice.
        - id: ch05-b04
          speaker: lin
          text: One I remember.
        - id: ch05-b05
          speaker: narrator
          text: Grandma laughed and shut the lid. Old buttons rattled around the new scrap. From the bedroom came a little grunt. Nora went to look. The baby slept in Aunt May's arms, and the cream coat lay folded on a chair with its soft fastening safely hidden inside. Behind Nora, the closed tin gave one quiet rattle as Grandma moved it from the table.
