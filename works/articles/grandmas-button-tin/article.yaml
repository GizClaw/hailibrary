picture_book: {level: j}
cover_prompt: |-
  A wordless intimate scene at a worn wooden sewing table beside a sunlit apartment window. Ten-year-old Lin, an East Asian girl with a straight black chin-length bob, one small red hair clip, a mustard-yellow cardigan, teal shirt, and navy pants, sits close to Grandma, an elderly East Asian woman with silver hair in a low bun, round glasses, a plum blouse, and a moss-green apron. Between them rests an open faded turquoise round metal tin with tiny cream flowers and a small rust patch near the hinge, overflowing with mismatched colorful buttons. Lin holds a large dark green four-hole button above a small cream cloth keepsake while Grandma holds a tiny pearl button; a finished cream baby jacket with pale blue edging and broad hook-and-loop fabric strips stitched flat inside its overlapping front lies safely apart from every loose button. A red coat button, a brown wooden toggle, and a small blue glass button are clearly visible in the tin. Warm late-afternoon light, close three-quarter view, faces and hands in sharp focus, quiet curiosity and affection, coherent miniature scale. No button or other small detachable decoration is attached to the baby jacket. No visible text, letters, numbers, logos, captions, speech bubbles, signatures, or watermarks.
