schema_version: 1
required: true
sources:
  - url: "https://www.nhs.uk/baby/first-aid-and-safety/safety/baby-and-toddler-safety/"
    authority: NHS baby and toddler safety guidance
    claims:
      - Small objects such as buttons should be kept out of a baby's reach because they can cause choking.
  - url: "https://www.cpsc.gov/s3fs-public/Session%204%20Textiles%20En.pdf"
    authority: U.S. Consumer Product Safety Commission children's clothing guidance
    claims:
      - Buttons and other fasteners on children's clothing should be secure; buttons that fall off because of poor construction may pose a substantial product hazard.
notes:
  - The fictional coat therefore uses broad hook-and-loop fabric strips stitched flat around their full edges, while the old green button remains on a keepsake cloth in the closed tin and never appears on the newborn's garment.
