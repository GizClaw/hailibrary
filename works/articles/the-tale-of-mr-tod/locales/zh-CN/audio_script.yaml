audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 亲切风趣，带着从容的童话讲述感, timbre: 温暖清亮, pace: 舒缓而有变化, pitch: 中}
    mr_tod:
      display_name: 托德先生
      tts: {delivery: 阴沉挑剔，发怒时尖刻急躁, timbre: 干涩锋利的成年男声, pace: 偏慢，激动时加快, pitch: 中低}
    tommy_brock:
      display_name: 汤米·布罗克
      tts: {delivery: 懒散粗野，总带着若无其事的笑意, timbre: 低沉沙哑, pace: 缓慢, pitch: 低}
    mr_bouncer:
      display_name: 老邦瑟先生
      tts: {delivery: 热情健谈，做错事后又倔强别扭, timbre: 苍老柔和, pace: 从容, pitch: 中低}
    flopsy:
      display_name: 弗洛普西
      tts: {delivery: 慈爱利落，着急时坚定有力, timbre: 温暖结实的成年女声, pace: 明快, pitch: 中}
    benjamin_bunny:
      display_name: 本杰明兔
      tts: {delivery: 爱子心切，焦急时气息促急, timbre: 柔和清亮, pace: 偏快, pitch: 中高}
    peter_rabbit:
      display_name: 彼得兔
      tts: {delivery: 机警果断，说话明快而有主意, timbre: 清脆明亮, pace: 轻快, pitch: 中}
    cottontail:
      display_name: 棉尾
      tts: {delivery: 直率友善，语气自然, timbre: 轻柔清晰, pace: 适中, pitch: 中高}
  chapters:
    - id: ch01
      title: 两个讨人嫌的家伙
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            我写过不少规规矩矩的家伙。这一回，咱们换换口味，说说两个讨人嫌的家伙。一个是汤米·布罗克，另一个是托德先生。

            要说托德先生招人喜欢，可没谁会同意。兔子们隔着半英里就能闻到他，简直受不了。他长着一脸狐狸胡须，又没个定居的地方，谁也不知道他下一回会从哪里冒出来。

            今天，他也许住在矮树林的树枝屋里，吓得老本杰明·邦瑟一家不得安宁。明天，他又可能搬到湖边那棵截过树梢的柳树里，去扰野鸭和水鼠。冬天到早春，他多半会待在牛堤顶上，燕麦岩下的石缝洞里。

            托德先生有五六处住所，却没几天真在家。他搬走以后，屋子也未必空着。汤米·布罗克有时候会住进去，当然，他从来不问主人同不同意。

            汤米个子矮，身子胖，浑身毛刺刺的，走起路来摇摇摆摆。他那张脸上永远挂着笑，嘴都快咧到两只耳朵了。可他的习惯真不怎么样。他吃黄蜂窝、青蛙和虫子，月亮出来后，他还总在外面东挖西刨。他的衣服脏兮兮的，白天睡觉时连靴子都不脱。而他睡的床，常常是托德先生的。

            别的吃食实在难找时，汤米偶尔也会吃上一两只很小的兔宝宝。可他和老邦瑟先生倒很要好。他们都讨厌那些可恶的水獭，也都讨厌托德先生。一见面，两个人就要把这些叫人痛心的事好好说上一遍。
        - id: ch01-b02
          speaker: narrator
          text: |-
            老邦瑟先生年纪已经很大了。那天下午，他围着围巾，坐在春天的暖阳里，抽着一管兔烟草。他跟儿子本杰明兔、儿媳弗洛普西住在一起。小两口已经有了一窝孩子。这一天，本杰明和弗洛普西出门了，孩子们就交给他照看。

            兔宝宝刚长到会睁开蓝眼睛、会蹬小腿的时候。他们躺在蓬松的兔毛和干草上，那张小床在一个浅浅的洞里，跟主洞隔着一段。可说实话，老邦瑟先生已经把他们忘得一干二净。

            正巧，汤米·布罗克从林子里经过。他背着一只口袋，带着挖土的小铲子和几副捕鼹鼠的夹子。老邦瑟先生跟他亲亲热热地聊了起来。汤米抱怨雉鸡蛋越来越难找，还一口咬定是托德先生偷走了。更糟的是，他冬眠时，水獭把青蛙也吃光了。
        - id: ch01-b03
          speaker: tommy_brock
          text: 我都两个星期没好好吃过一顿了，只能拿猪坚果填肚子。再这样下去，我可真要改吃素了。到时候，说不定连自己的尾巴也得啃掉！
        - id: ch01-b04
          speaker: narrator
          text: |-
            这笑话说实在的，也没多好笑。可汤米又矮又胖，脸上还总挂着那么大的笑，老邦瑟先生硬是听乐了。他哈哈大笑，一定要请汤米进洞坐坐。
        - id: ch01-b05
          speaker: mr_bouncer
          text: 快进来吧，汤米！尝一片香籽蛋糕，再喝一杯我儿媳弗洛普西酿的黄花九轮草酒。
        - id: ch01-b06
          speaker: narrator
          text: |-
            汤米立刻兴冲冲地挤进了兔洞。吃喝过后，老邦瑟先生又装了一管烟，还递给汤米一支卷心菜叶雪茄。那烟劲大得厉害。汤米笑得比平时更厉害，兔洞也让烟雾塞得满满当当。老邦瑟先生边咳边笑，汤米则一面喷云吐雾，一面咧嘴傻乐。

            到后来，老邦瑟先生被卷心菜烟熏得闭上了眼睛。

            等弗洛普西和本杰明回到家，老邦瑟先生才醒过来。可汤米·布罗克不见了，所有兔宝宝也全不见了。

            老邦瑟先生怎么也不肯承认，自己让谁进过兔洞。可洞里的獭味是赖不掉的，沙地上还印着又圆又沉的脚印。这回他闯了大祸。弗洛普西气得直拧自己的耳朵，还打了他几下。

            本杰明兔立刻出发，去追汤米·布罗克。
    - id: ch02
      title: 一路追到牛堤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            汤米留下的痕迹太明显了，根本不难追。他沿着林间弯弯曲曲的小路，慢吞吞地走过去。这儿的苔藓和酢浆草被他连根翻了起来，那儿又多了一个大坑。他挖了毒麦，还放下一副鼹鼠夹。小路中间横着一条溪水，本杰明轻轻一跳，脚上一点水也没沾。到了对岸，泥地上那些沉沉的獭脚印看得清清楚楚。

            小路通到矮树林中一片砍伐过的空地。新叶从橡树桩上长出来，蓝色风信子铺成了一片花海。可本杰明忽然停下，绝不是因为闻到了花香。

            托德先生的树枝屋就在眼前。偏偏这一回，托德先生在家。那股浓浓的狐狸味已经足够说明一切，况且充当烟囱的破桶里还冒着烟。

            本杰明直起身子，眼睛瞪得大大的，胡须抽动个不停。屋里忽然摔落一只盘子，接着有人说了句什么。本杰明猛地跥了一下脚，转身便逃。
        - id: ch02-b02
          speaker: narrator
          text: |-
            他一口气跑到林子另一边，这才停下。汤米显然也往这边来了。墙头上又有他的脚印，荆棘还从那只口袋上扯下了几缕麻线。

            本杰明翻过石墙，走进一片草地。他又发现了一副新安好的鼹鼠夹，可见汤米的踪迹还没断。天已经很晚了，别的兔子都出来乘凉。其中一只单独穿着蓝外套，正忙着找蒲公英。
        - id: ch02-b03
          speaker: benjamin_bunny
          text: 彼得表哥！彼得兔，彼得兔！
        - id: ch02-b04
          speaker: narrator
          text: 穿蓝外套的兔子立刻竖起耳朵，坐直了身子。
        - id: ch02-b05
          speaker: peter_rabbit
          text: 出什么事了，本杰明表弟？是猫，还是约翰·斯托特·费雷特？
        - id: ch02-b06
          speaker: benjamin_bunny
          text: 不，都不是！是汤米·布罗克。他把我的孩子装进口袋带走了！你看见他了吗？
          emotion: fearful
        - id: ch02-b07
          speaker: peter_rabbit
          text: 汤米·布罗克？他带走了几只？
        - id: ch02-b08
          speaker: benjamin_bunny
          text: 七只，彼得表哥，他们个个都是双胞胎！汤米从这里走了吗？求你快告诉我！
          emotion: fearful
        - id: ch02-b09
          speaker: peter_rabbit
          text: 是的，他从这儿走了，还不到十分钟。他说袋里是毛毛虫。我当时还在想，哪有踢得那么厉害的毛毛虫？
        - id: ch02-b10
          speaker: benjamin_bunny
          text: 哪边？他到底往哪边去了？
        - id: ch02-b11
          speaker: peter_rabbit
          text: 他背着口袋，里面肯定装着活东西。我还看见他放下一副鼹鼠夹。让我想想。本杰明，你先把整件事从头说给我听。
        - id: ch02-b12
          speaker: narrator
          text: 本杰明只好把事情全说了一遍。
        - id: ch02-b13
          speaker: peter_rabbit
          text: |-
            邦瑟舅舅都这么大年纪了，做事还这么欠考虑，真让人遗憾。不过，现在至少有两件好事。孩子们还活着，因为他们还会踢。再说，汤米已经吃过喝过了。他多半会先睡一觉，把孩子留到早饭再吃。
        - id: ch02-b14
          speaker: benjamin_bunny
          text: 可他到底去哪儿了？
        - id: ch02-b15
          speaker: peter_rabbit
          text: |-
            本杰明表弟，先稳住。我知道他去了哪里。托德先生刚才在树枝屋，汤米就只能去牛堤顶上的另一处住所。

            还有一件事能证明。汤米主动问过我，要不要给棉尾捎个口信，说他正好会从她那里路过。
        - id: ch02-b16
          speaker: narrator
          text: |-
            棉尾已经嫁给一只黑兔子，搬到山上去了。彼得把蒲公英藏好，陪着心急如焚、浑身直抖的兔爸爸上了路。他们穿过一片片田野，开始往山上爬。汤米的脚印清晰可见。看样子，他每走十二码左右，就得放下口袋歇一歇。
        - id: ch02-b17
          speaker: peter_rabbit
          text: 他肯定喘得厉害。闻闻这股味，我们离他已经很近了。真是个讨厌的家伙！
        - id: ch02-b18
          speaker: narrator
          text: |-
            斜斜的阳光照着山坡上的牧草，还是暖融融的。爬到半山腰时，他们看见棉尾坐在家门口。她身边有四五只半大兔子在玩，其中一只是黑色，其他都是棕色。

            棉尾说，她远远看见汤米从这儿走过。彼得问她丈夫在不在家，她却顾着说汤米走过时，停下歇了两回。
        - id: ch02-b19
          speaker: cottontail
          text: 他还朝我点点头，又指了指那只口袋。然后他弯下腰，好像都快笑得站不住了。
        - id: ch02-b20
          speaker: benjamin_bunny
          text: 快走吧，彼得！他会把孩子们煮了的。再快一点！
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: 他们继续往高处爬。彼得看见棉尾的丈夫在家，黑耳朵已经从洞口露了出来。可他们住得离岩石太近，彼得不想害邻居惹上麻烦，便催本杰明继续赶路。
    - id: ch03
      title: 岩屋里的呼噜声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            快到牛堤顶上的林子时，两只兔子放轻了脚步。树从成堆的岩石间长出来。一处峭壁下面，托德先生的另一个家就坐落在斜坡顶上。屋顶上悬着岩石，灌木枝也从上方探了出来。彼得和本杰明小心爬近，一边听，一边往里窥探。

            这房子既像洞穴，又像牢房，还像一座快塌的猪圈。只有房门格外结实，眼下正紧紧关着，还上了锁。

            落日把窗玻璃照得像红色火焰，可厨房的炉子没有点火。透过窗户，他们看见干柴已经整整齐齐地码在炉里。本杰明刚松了一口气，又被厨房桌上的东西吓得发抖。

            桌上摆着一只巨大的空馅饼盘，上面画着蓝色柳树。旁边有大切肉刀、大叉子和一柄砍刀。桌子另一头，一块桌布只铺开了一半，还摆着盘子、杯子、刀叉、盐罐和芥末，桌边放着一把椅子。这是给一个人准备的晚饭。

            可屋里没有人，也没有兔宝宝。厨房空荡荡的，一点声音也没有，连钟都停了。两只兔子把鼻子贴到玻璃上，拼命朝昏暗里看。
        - id: ch03-b02
          speaker: narrator
          text: |-
            他们绕过岩石，手脚并用地爬到房子另一边。这儿又湿又臭，荆棘和刺藤到处乱长，两只兔子连鞋里的脚都在发抖。
        - id: ch03-b03
          speaker: benjamin_bunny
          text: 我那些可怜的兔宝宝。这地方太可怕了，我再也见不到他们了！
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: |-
            他们悄悄爬到卧室窗前。这扇窗户也关得严严实实，插闩都插上了。不过，窗台上有新留下的脏脚印，附近的蛛网也被碰乱了。这扇窗不久前一定打开过。

            屋里黑沉沉的，一开始什么也看不见。可他们听到一阵呼噜声，缓慢、低沉，一声接着一声。等眼睛慢慢适应了黑暗，他们终于看清，托德先生的床上睡着一个家伙，正蜇缩在毯子下面。
        - id: ch03-b05
          speaker: peter_rabbit
          text: 他连靴子都没脱，就爬上床了。
        - id: ch03-b06
          speaker: narrator
          text: |-
            本杰明抖得更厉害了，一把将彼得从窗台上拉下来。汤米·布罗克躺在托德先生的床上，呼噜还是那样低沉而有规律。可那窝兔宝宝却连影子都不见。

            太阳下山了，林子里的猫头鹰开始咕咕地叫。四周散落着许多叫人心里发毛的东西。兔子的骨头和头骨，鸡腿，还有别的可怕玩意儿。这些东西早就该埋掉了。这里又黑又吓人。
        - id: ch03-b07
          speaker: narrator
          text: |-
            两只兔子回到房子正面，想方设法去拨厨房窗户的插闩。他们想用一枚生锈的钉子，从两扇窗框中间把插闩往上顶。可他们连盏灯也没有，怎么也弄不开。

            他们并排坐在窗外，一面轻声商量，一面仔细听着屋里的动静。半个小时后，月亮升到了林子上方。清冷明亮的月光照着岩石中的房子，也从厨房窗户照进去。可屋里还是看不见一只兔宝宝。

            月光在切肉刀和馅饼盘上闪闪发亮，又在脏地板上铺出一条亮亮的路。这下，他们看到炉边的墙上有一扇小铁门。那是老式砖炉的门，这种烤炉从前要靠一捆捆木柴来烧热。

            没多久，彼得和本杰明同时发现，他们每次摇动窗户，对面的小铁门也会跟着晃动。孩子们还活着，就被关在烤炉里。

            本杰明高兴得快跳起来，幸好没把汤米吵醒。庄严的呼噜声依然从托德先生的床上传过来。

            可他们还不能放心。窗户打不开，孩子们又小得连爬都不会，根本不可能自己逃出来。
        - id: ch03-b08
          speaker: narrator
          text: |-
            两只兔子商量了很久，最后决定挖一条地道。他们在斜坡下方一两码的地方动手，想从房子下面的大石头之间钻过去。厨房地面太脏，从窗外根本看不出它铺的是泥还是石板。

            他们一直挖，一直挖，足足忙了好几个钟头。大石头总挡着路，地道没法直着往前。可到了深夜尽头，他们总算钻到了厨房地板下面。

            本杰明仰面躺在地道里，向上刨土。彼得的爪子已经磨秃了，他守在洞口，把沙土不停地往外扒。他忽然说，天已经亮了。太阳升了起来，山下林子里的松鸦也吵闹起来。

            本杰明从黑洞里钻出来，抖掉耳朵里的沙子，再用爪子擦干净脸。山顶的阳光越来越暖。山谷里铺着白雾，金色的树梢从雾海上露了出来。

            就在这时，山下的松鸦又愤怒地叫起来。紧接着，他们听到了狐狸尖利的吠叫。两只兔子彻底慌了，竟做出最愚蠢的事。他们一起冲进那条又短又新的地道，一直躲到最里头，也就是托德先生的厨房地板下面。
    - id: ch04
      title: 托德先生的淋浴妙计
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            托德先生正沿着牛堤向上走，脾气坏得不得了。先前他摔碎了一只瓷盘。虽说全怪他自己，那可是老祖母维克森·托德留下的那套餐具里，最后一只盘子。后来小飞虫又多得叫他受不了。他想抓一只正在孵蛋的雉鸡，也没能得手。窝里只有五个蛋，还有两个是坏的。他这一夜过得真是诸事不顺。

            托德先生一向如此，心情一坏就要搬家。他先去看了那棵截了树梢的柳树，可里面湿漉漉的，水獭还在旁边留了一条死鱼。托德先生只肯碰自己的剩菜，别人的可不行。

            他继续往山上走，路上发现了獭的痕迹，脾气就更坏了。除了汤米，没有谁会无缘无故把苔藓刨得乱七八糟。托德先生气呼呼地用手杖抽打地面。他已经猜出汤米去了哪里。

            偏偏还有一只松鸦紧跟着他，从一棵树飞到另一棵树，一路骂个不停。那只鸟向所有听得见的兔子发出警告，说有猫或狐狸正往林场上面来。有一次，松鸦尖叫着掠过他头顶。托德先生猛地扑咬过去，还吠了一声。
        - id: ch04-b02
          speaker: narrator
          text: |-
            托德先生拿着一把生锈的大钥匙，小心走近房子。他闻了闻，胡须根根竖起。房门锁着，他却怀疑屋里未必没人。钥匙在锁里转动时，藏在地下的两只兔子听得一清二楚。托德先生慢慢推开门，走了进去。

            一看清厨房里的样子，他立刻火冒三丈。他的椅子，他的馅饼盘，他的刀叉、芥末和盐罐，还有他折好收进碗柜的桌布，全都摆了出来。这顿晚饭，也可能是早饭，显然是给那个可恶的汤米预备的。

            新翻的泥土和脏獭的味道充满了屋子，倒把兔子的气味盖住了。可托德先生顾不上再闻。一阵缓慢、低沉又有规律的呼噜声，正从他自己的床上传来。

            他从半开的卧室门旁探头看了一眼，马上转身逃出屋去。他气得胡须全竖着，连外套领子都立了起来。

            接下来的二十分钟，托德先生一次次蹑手蹑脚地走进屋，又一次次急忙退出来。他的胆子慢慢大了，每回都再多走几步，最后终于进了卧室。在屋外，他气得直抓地。可一进屋，看见汤米那口牙，他又害怕了。

            汤米仰面躺着，大张着嘴，那道笑容从一只耳朵一直铺到另一只耳朵。他安稳地打着呼噜，可有一只眼睛并没有完全闭上。

            托德先生在卧室里进进出出。他两回拿进手杖，还有一回搬来煤斗。可每次都改了主意，又把东西拿走。等他搬走煤斗再回来，汤米已稍稍翻过身，看上去睡得更沉了。这家伙懒得无可救药。他一点也不怕托德先生，只是躺得太舒服，懒得起来。
        - id: ch04-b03
          speaker: narrator
          text: |-
            托德先生又进来了，这次手上拿着一根晾衣绳。他站在床边看了汤米整整一分钟，又仔细听着呼噜。那声音确实响得厉害，又自然得很。

            他背对床铺，解开窗闩。窗户吱呀一响，吓得他猛然回头。汤米刚睁开一只眼，又赶紧闭上。呼噜声还在继续。

            托德先生把窗户推开一条缝，将大半截晾衣绳送出窗外，自己手上留着系有钩子的另一头。他这样做既古怪又胆战心惊，因为要从门走到窗前，必须从床边经过。

            汤米认认真真地打着呼噜。托德先生又盯着他看了一分钟，这才离开。汤米马上睁开两只眼，看看那根绳子，咧嘴一笑。窗外刚传来动静，他又赶快闭上了眼。

            托德先生从前门出去，绕到屋后。路上，他一脚踩进了兔子刚挖的地道。他的脚踏破洞顶，差点就踩到彼得和本杰明的头。可他只当这也是汤米干的好事。他拿起窗台外的绳子，听了一会儿，就把绳系到一棵树上。汤米透过窗户，用一只眼睛盯着他，心里有些纳闷。
        - id: ch04-b04
          speaker: narrator
          text: |-
            托德先生从泉边提来满满一大桶水，踉踉跄跄地穿过厨房，搬进卧室。汤米卖力打着呼噜，还特意哼了一声。

            托德先生把桶放到床边，拿起带钩的绳头。他迟疑了一下，看看汤米。那呼噜声闷得叫人快喘不过气，不过汤米脸上的笑容似乎没那么大了。

            他小心爬上床头旁的椅子。那两条细腿离汤米的牙可真近。他伸长胳膊，把钩子搭到有顶架的床头上。那里本该挂着床帘，可房子没人住，托德先生已把床帘和床罩都收了起来。汤米身上只盖着一条毯子。

            托德先生站在摇晃的椅子上，低头仔细看着他。这家伙真该拿个酣睡头奖。绳子都从床上甩过去了，他还是一点反应也没有。

            托德先生平安下了椅子，又想抱着水桶爬上去。他打算把桶挂在汤米头顶，然后在窗外拉动绳子，来一场淋浴。可他天生只长着两条细腿。虽说报复心强，又长着沙黄色胡须，却怎么也举不起那只重桶，差点把自己也摔下来。

            呼噜声越来越像喘不上气。毯子下面，汤米的一条后腿抽动了一下，可他依然睡得安安稳稳。
        - id: ch04-b05
          speaker: narrator
          text: |-
            托德先生和水桶总算有惊无险地下了椅子。他苦想一阵，把水倒进脸盆和水罐。空桶不重，他终于把它吊了起来，让它摇摇晃晃地悬在汤米头顶。

            世上真有这么沉的觉吗？托德先生爬上椅子，又爬下来，再爬上去。一整桶水没法一次举起，他便找来牛奶罐，每次舀一夸脱尔，慢慢往桶里加。水桶越来越满，像钟摆一样晃来晃去。偶尔有水滴溅出来，汤米依然有规律地打着呼噜，除了一只眼睛，其他地方一动不动。

            托德先生终于把一切准备妥当。桶里装满了水，绳子在床顶绷得紧紧的，又越过窗台，一直系到外面的树上。
        - id: ch04-b06
          speaker: mr_tod
          text: 这么一来，我的卧室可要弄得一团糟了。不过，那张床要是不从里到外洗个彻底，我以后也别想再睡。
        - id: ch04-b07
          speaker: narrator
          text: 托德先生最后看了獭一眼，悄悄离开卧室。他走出房子，关好前门。地道里的两只兔子，听见他的脚步从头顶走过。他跑到屋后，准备解开绳子，让那满桶水朝汤米头上砸下去。
        - id: ch04-b08
          speaker: mr_tod
          text: 我要给他一个讨厌的惊喜，让他好好醒一醒。
    - id: ch05
      title: 厨房里的恶战
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            托德先生刚一离开，汤米就飞快地爬了起来。他把托德先生的睡袍卷成一团，塞进水桶下面的被窝，假装自己还躺在那里。随后，他也离开了卧室，嘴都快笑到耳根了。

            汤米走进厨房，点起炉火开始烧水。眼下，他还顾不上烹调那些兔宝宝。

            托德先生来到树边，发现绳子又沉又紧，早就把绳结拉成了死扣。他怎么也解不开，只好低头用牙咬。他又啃又磨，忙了二十多分钟。绳子终于“啪”地断了，险些把他的牙全扯掉，还将他整个揀翻在地。

            屋里立刻传来“轰隆”一声巨响，接着是水花四溅、水桶满地翻滚的声音。

            可屋里并没有惨叫。托德先生糊涂了。他一动不动地坐着，仔细听了一会儿，随后探头朝窗里看。水从床上滴滴答答地往下流，水桶已经滚到墙角。

            床中央的湿毯子下，躺着一个扁塌塌的东西。它正中间让水桶砸得凹了下去，就像肚子被拦腰击中一样。脑袋上盖着湿毯子，呼噜声也没了。除了床垫上的水滴还在滴答、滴答、答滴地往下落，屋里再没有一点声音。

            托德先生盯着那东西看了半个钟头，眼睛闪闪发亮。后来，他高兴得跳了一步，胆子也大起来。他甚至敲了敲窗户，可那团东西还是一动不动。

            没错，再也不用怀疑了。这结果比托德先生原先盘算的还要好。水桶砸中了可怜的老汤米，把他活活砸死了。至少，托德先生是这样以为的。
        - id: ch05-b02
          speaker: mr_tod
          text: |-
            我要把这个讨厌的家伙埋进他挖的洞里。再把床上的东西都搬出来，放在太阳底下晒干。

            桌布得洗干净，摊到阳光下的草地上漂白。毯子得挂起来吹风。床要彻底消毒，再用暖床锅烘一遍，还得用热水袋暖透。

            我要弄来软皂、猴牌肥皂，还有各种各样的肥皂。苏打、板刷、波斯除虫粉和石炭酸也不能少，非把这股味除掉不可。这里必须消毒，说不定还得烧硫磺。
        - id: ch05-b03
          speaker: narrator
          text: |-
            托德先生急忙绕到房子前面，准备去厨房拿铲子。先把那个洞收拾好，再将毯子裹着的家伙拖出来。

            他推开了门。

            汤米·布罗克正坐在托德先生的厨房桌旁，用托德先生的茶壶，往托德先生的茶杯里倒茶。他浑身干爽，脸上还是挂着那道大大的笑。托德先生一进来，他立刻把一整杯滚烫的茶水泼到了对方身上。

            托德先生猛扑向汤米，汤米也一把揪住他。两个家伙在满地的碎杯破盘之间扭打起来。一场恶战卷过整间厨房。每倒下一件家具，藏在地板下面的两只兔子都觉得，头顶快要被砸穿了。

            他们赶快爬出地道，躲到岩石和灌木之间，焦急地听着屋里的动静。房子里闹得天翻地覆。烤炉里的兔宝宝都吓醒了，浑身发抖。也许他们这时候还关在里面，反而是件好事。

            除了厨房桌子，所有东西都撞翻了。就连壁炉台和炉栏也没能幸免。杯子、盘子和碗碎成了渣。椅子断了，窗户破了，钟也“轰”地掉到地上。地板上还散着一把又一把托德先生的沙黄色胡须。

            花瓶从壁炉台上摔下，罐子从架子上跌落，水壶也从炉架上翻了下来。汤米一脚踩进一罐覆盆子果酱，水壶里的开水则全浇在托德先生的尾巴上。

            水壶翻倒时，仍旧咧嘴笑着的汤米刚好占了上风。他把托德先生当成一根圆木，滚了一圈又一圈，一直滚出门去。

            到了屋外，他们还在龇牙低吼，又撕又咬。两个家伙一同滚下斜坡，沿山一路向下，在岩石上撞来颠去。汤米·布罗克和托德先生，这辈子都不可能和好了。
    - id: ch06
      title: 把孩子们带回家
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 路上终于空了。彼得和本杰明立刻从灌木丛里跑出来。
        - id: ch06-b02
          speaker: peter_rabbit
          text: 就是现在！快进去，本杰明！快把孩子们救出来，我在门口给你守着。
        - id: ch06-b03
          speaker: narrator
          text: 可本杰明又害怕起来。
        - id: ch06-b04
          speaker: benjamin_bunny
          text: 哎呀！哎呀！他们回来了！
          emotion: fearful
        - id: ch06-b05
          speaker: peter_rabbit
          text: 没有，他们根本没回来。
        - id: ch06-b06
          speaker: benjamin_bunny
          text: 回来了，他们就是回来了！
          emotion: fearful
        - id: ch06-b07
          speaker: peter_rabbit
          text: 听听他们骂得多难听。依我看，他们是掉进采石坑里了。
        - id: ch06-b08
          speaker: narrator
          text: 本杰明还在犹豫，彼得只好不停地推他。
        - id: ch06-b09
          speaker: peter_rabbit
          text: 快点，不会有事的。救出孩子后，记得把烤炉门关好，别让他看出孩子们已经不见了。
        - id: ch06-b10
          speaker: narrator
          text: |-
            托德先生的厨房里，确实发生了一连串热闹非凡的事。

            可兔洞家中这边，日子却一点也不好过。晚饭时吵过一架后，弗洛普西和老邦瑟先生整夜都没睡。到了早饭时，他们又吵了起来。老邦瑟先生再也无法否认，自己确实请过客人进洞。可弗洛普西不管怎么追问责怪，他都不肯回答。这一天过得沉闷极了。

            老邦瑟先生满肚子闷气，缩在角落里，还用一把椅子挡住自己。弗洛普西没收了他的烟斗，又把烟草藏了起来。她为了出气，把家里彻底翻腾一遍，来了场春季大扫除，这会儿才刚收拾完。老邦瑟先生躲在椅子后，心惊胆战地猜她下一步又会做什么。
        - id: ch06-b11
          speaker: narrator
          text: |-
            托德先生的厨房里，本杰明提心吊胆地穿过浓浓的尘雾，绕过满地狼藉，来到烤炉前。他打开炉门，把爪子伸进去摸索。里面有一团暖暖的东西，还在不停地扭动。他小心地把它提了出来，去跟彼得会合。
        - id: ch06-b12
          speaker: benjamin_bunny
          text: 我找到他们了！我们可以走了吗？彼得表哥，我们要不要先躲起来？
        - id: ch06-b13
          speaker: narrator
          text: |-
            彼得竖起耳朵。远处的林子里，打斗声还在隐隐传来。

            五分钟后，两只上气不接下气的兔子从牛堤上飞奔而下。他们一起半抬半拖着一只口袋，沿着草地一路颠颠簸簸。他们平安到家，一头冲进了兔洞。

            彼得和本杰明带着一窝孩子凯旋归来。老邦瑟先生终于松了口气，弗洛普西更是高兴得不得了。兔宝宝们一路被颠得有些狼狈，肚子也饿坏了。大家喂饱他们，再送他们上床。没过多久，他们就全都恢复了。

            大家送给老邦瑟先生一根崭新的长烟斗，还把他的兔烟草补足了。他脸上还摆着几分架子，不过礼物照样收下了。

            老邦瑟先生得到了原谅，一家人终于坐在一起吃了顿饭。吃过饭，彼得和本杰明讲起了他们的历险。只可惜，他们没有在山上多等一会儿。所以，汤米·布罗克和托德先生的那场恶战究竟怎样收场，他们就没法告诉大家了。

            故事到这里就讲完了。
