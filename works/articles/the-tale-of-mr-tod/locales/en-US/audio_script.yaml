audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: wry, vivid storytelling with quiet suspense
        timbre: warm and clear
        pace: measured
        pitch: medium
    mr_tod:
      display_name: Mr. Tod
      tts:
        delivery: sly, fussy, and quick to anger
        timbre: dry and sharp
        pace: deliberate
        pitch: medium-low
    tommy_brock:
      display_name: Tommy Brock
      tts:
        delivery: lazy, rough, and always faintly amused
        timbre: gravelly and heavy
        pace: slow
        pitch: low
    mr_bouncer:
      display_name: Mr. Bouncer
      tts:
        delivery: elderly, sociable, and stubborn
        timbre: soft and weathered
        pace: unhurried
        pitch: medium-low
    flopsy:
      display_name: Flopsy
      tts:
        delivery: caring, practical, and forceful when upset
        timbre: warm and firm
        pace: brisk
        pitch: medium
    benjamin_bunny:
      display_name: Benjamin Bunny
      tts:
        delivery: devoted, breathless, and easily alarmed
        timbre: gentle and light
        pace: quick
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: alert, resourceful, and confidently matter-of-fact
        timbre: bright and clear
        pace: lively
        pitch: medium
    cottontail:
      display_name: Cottontail
      tts:
        delivery: friendly and straightforward
        timbre: light and clear
        pace: conversational
        pitch: medium-high
  chapters:
    - id: ch01
      title: Two Disagreeable People
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            I have told plenty of stories about well-behaved people. This time, the story is about two thoroughly disagreeable ones: Tommy Brock and Mr. Tod.

            No one could call Mr. Tod nice. The rabbits could smell him half a mile away, and they couldn't stand him. With his fox whiskers and wandering ways, he never stayed anywhere for long. The rabbits never knew where he would appear next. One day he might live in a stick house in the coppice, terrifying old Mr. Benjamin Bouncer's family. The next day he might move into a hollow willow by the lake and frighten the wild ducks and water rats. In winter and early spring, he usually kept an underground home among the rocks at the top of Bull Banks, beneath Oatmeal Crag.

            Mr. Tod had half a dozen homes and was hardly ever in any of them. But when he moved out, his houses did not always stay empty. Sometimes Tommy Brock moved in without asking.

            Tommy Brock was short, fat, bristly, and waddling, with a grin spread right across his face. His habits were filthy. He ate wasp nests, frogs, and worms. At night he waddled around digging things up. His clothes were always dirty, and because he slept all day, he went to bed with his boots on. Usually, the bed belonged to Mr. Tod.

            Tommy Brock did sometimes eat rabbit pie. It did not happen often, and he took only very young rabbits when other food was truly scarce. Even so, he and old Mr. Bouncer were friends. They agreed completely about two things: the otters were wicked, and so was Mr. Tod. Whenever they met, they spent plenty of time talking over that painful subject.
        - id: ch01-b02
          speaker: narrator
          text: |-
            Old Mr. Bouncer was getting on in years. One spring afternoon, he sat outside the burrow in the sunshine, wrapped in a muffler and smoking rabbit tobacco. He lived with his son Benjamin Bunny, Benjamin's wife Flopsy, and their young family. Benjamin and Flopsy had gone out, leaving him in charge.

            The baby rabbits were only just old enough to open their blue eyes and kick. They lay in a soft bed of rabbit wool and hay, inside a shallow burrow apart from the main rabbit hole. The truth is, old Mr. Bouncer had forgotten all about them.

            Tommy Brock happened by with a sack, a small digging spade, and some mole traps. Mr. Bouncer welcomed him, and the two began a friendly conversation. Tommy grumbled that pheasant eggs were scarce and blamed Mr. Tod for stealing them. The otters, he said, had eaten all the frogs while he slept through the winter.
        - id: ch01-b03
          speaker: tommy_brock
          text: |-
            I haven't had one decent meal in two weeks. I'm living on pig nuts! Pretty soon I'll have to become a vegetarian and eat my own tail.
        - id: ch01-b04
          speaker: narrator
          text: |-
            It wasn't much of a joke. Still, Tommy was so fat and stumpy, and his grin was so wide, that old Mr. Bouncer found it hilarious.

            Mr. Bouncer urged Tommy to come inside.
        - id: ch01-b05
          speaker: mr_bouncer
          text: |-
            Come in and have some seed cake, Tommy. You can try a glass of my daughter Flopsy's cowslip wine, too.
        - id: ch01-b06
          speaker: narrator
          text: |-
            Tommy squeezed eagerly into the rabbit hole. Afterward, Mr. Bouncer lit another pipe and gave Tommy a cabbage-leaf cigar. It was terribly strong. Tommy grinned harder than ever as smoke filled the burrow. Mr. Bouncer coughed and laughed. Tommy puffed and grinned. At last, Mr. Bouncer closed his eyes in the thick cabbage smoke.

            When Benjamin and Flopsy came home, Mr. Bouncer woke up. Tommy Brock was gone. So were all the baby rabbits.

            Mr. Bouncer refused to admit that he had let anyone inside. But the smell of badger was impossible to deny, and round, heavy footprints marked the sand. Flopsy wrung her ears and slapped him. Mr. Bouncer was in deep disgrace.

            Benjamin Bunny went after Tommy Brock at once.
    - id: ch02
      title: Following the Trail
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            Tommy was easy to track. His heavy footprints followed the winding path through the woods. In one place he had torn up moss and wood sorrel. In another, he had dug a deep hole for dog darnel and set a mole trap. When the path crossed a little stream, Benjamin hopped over without wetting his feet. Tommy's prints sank plainly into the mud.

            The trail entered a cleared part of the thicket. Leafy oak stumps stood in a sea of blue hyacinths. But the smell that stopped Benjamin was certainly not the flowers.

            Mr. Tod's stick house stood ahead, and for once Mr. Tod was home. The fox smell proved it, and smoke rose from the broken pail he used as a chimney. Benjamin sat upright and stared, his whiskers twitching. A plate crashed inside, and someone spoke. Benjamin stamped once, then ran.

            He did not stop until he reached the far side of the wood. Tommy must have gone the same way. More badger tracks crossed the top of the wall, and strands from a sack clung to a briar.

            Benjamin climbed into a meadow and found another freshly set mole trap. He was still on the trail, but afternoon was slipping away. Rabbits were coming out for the evening. One rabbit in a blue coat was hunting dandelions alone.
        - id: ch02-b02
          speaker: benjamin_bunny
          text: |-
            Cousin Peter! Peter Rabbit! Peter!
        - id: ch02-b03
          speaker: narrator
          text: |-
            The blue-coated rabbit sat up, ears pricked.
        - id: ch02-b04
          speaker: peter_rabbit
          text: |-
            Benjamin, what's wrong? Is it a cat? Is John Stoat Ferret after you?
        - id: ch02-b05
          speaker: benjamin_bunny
          text: |-
            No, no! Tommy Brock took my family. He stuffed them in a sack! Have you seen him?
        - id: ch02-b06
          speaker: peter_rabbit
          text: |-
            Tommy Brock? How many babies did he take?
        - id: ch02-b07
          speaker: benjamin_bunny
          text: |-
            Seven, Peter, and every one of them is a twin! Did he come this way? Please, tell me now!
        - id: ch02-b08
          speaker: peter_rabbit
          text: |-
            Yes. He passed less than ten minutes ago. He told me they were caterpillars. I thought those caterpillars were kicking awfully hard.
        - id: ch02-b09
          speaker: benjamin_bunny
          text: |-
            Where did he go? Which way?
        - id: ch02-b10
          speaker: peter_rabbit
          text: |-
            His sack had something alive inside, and I watched him set a mole trap. Give me a moment to think. Start at the beginning and tell me everything.
        - id: ch02-b11
          speaker: narrator
          text: |-
            Benjamin told him what had happened.
        - id: ch02-b12
          speaker: peter_rabbit
          text: |-
            Uncle Bouncer has shown terrible judgment for a rabbit his age. But we have two reasons to hope. Your babies are alive and kicking, and Tommy has eaten and had a drink. He'll probably fall asleep and save them for breakfast.
        - id: ch02-b13
          speaker: benjamin_bunny
          text: |-
            But which way did he go?
        - id: ch02-b14
          speaker: peter_rabbit
          text: |-
            Steady, Benjamin. I know exactly where he went. Mr. Tod was home at the stick house, so Tommy headed for Mr. Tod's other place on top of Bull Banks. And he offered to carry a message to my sister Cottontail. He said he would be passing her home.
        - id: ch02-b15
          speaker: narrator
          text: |-
            Cottontail had married a black rabbit and moved to the hill. Peter hid his dandelions and set off with the miserable father, who was trembling all over.

            They crossed several fields and started uphill. Tommy's tracks were easy to see. Every dozen yards or so, he seemed to have put down the sack for a rest.
        - id: ch02-b16
          speaker: peter_rabbit
          text: |-
            He must be out of breath. That smell says we're close behind him. What a nasty creature!
          emotion: disgusted
        - id: ch02-b17
          speaker: narrator
          text: |-
            Warm evening sunlight slanted across the hillside. Halfway up, Cottontail sat in her doorway. Four or five half-grown rabbits played nearby, one black and the others brown.

            She had seen Tommy Brock in the distance. When Peter asked if her husband was home, she said Tommy had stopped twice while she watched. He had nodded, pointed at his sack, and bent over as if he were laughing.
        - id: ch02-b18
          speaker: benjamin_bunny
          text: |-
            Come on, Peter! He'll be cooking them. Hurry!
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: |-
            They climbed higher and higher.
        - id: ch02-b20
          speaker: cottontail
          text: |-
            My husband is home. I saw his black ears showing at the mouth of the burrow.
        - id: ch02-b21
          speaker: peter_rabbit
          text: |-
            They live too close to those rocks to pick fights with their neighbors. Keep going, Benjamin!
    - id: ch03
      title: The House Under the Crag
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Near the woods at the top of Bull Banks, the rabbits slowed down. Trees grew between piles of rock. Under a crag at the top of a steep bank, with rocks and bushes hanging over it, stood another of Mr. Tod's homes. Peter and Benjamin crept closer, stopping to listen and peek.

            The place was part cave, part prison, and part broken-down pigsty. Its heavy door was shut and locked.

            The sunset made the windowpanes glow red, almost like fire. But there was no flame in the kitchen stove. Dry sticks lay ready inside, waiting to be lit. Benjamin sighed with relief.

            Then he saw the kitchen table and shuddered. An enormous empty pie dish with a blue willow pattern sat beside a carving knife, a fork, and a chopping knife. At the other end were a partly opened tablecloth, a plate, a drinking glass, another knife and fork, the salt and mustard, and one chair. Supper for one was being prepared.

            No one was there. The baby rabbits were nowhere in sight. The kitchen was still, and the clock had stopped. Peter and Benjamin pressed their noses to the glass and stared into the dim room.

            They scrambled around the rocks to the back of the house. That side was damp, smelly, and tangled with thorns and briars. The rabbits shivered in their shoes.
        - id: ch03-b02
          speaker: benjamin_bunny
          text: |-
            Oh, my poor babies! This place is horrible. I'll never see them again!
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: |-
            They crept to the bedroom window. It was closed and bolted, just like the kitchen window. Yet it had been opened recently. The cobwebs were torn, and fresh, dirty footprints marked the sill.

            At first, the room was too dark to see. Then they heard a slow, deep, steady snoring grunt. As their eyes adjusted, they made out someone curled beneath a blanket on Mr. Tod's bed.
        - id: ch03-b04
          speaker: peter_rabbit
          text: |-
            He went to bed with his boots on.
        - id: ch03-b05
          speaker: narrator
          text: |-
            Benjamin was shaking so hard that he pulled Peter down from the sill. Tommy kept snoring in Mr. Tod's bed, slow and grunty. There was still no sign of the babies.

            Night had fallen, and an owl hooted in the woods. All around lay horrible things that should have been buried: rabbit bones and skulls, chicken legs, and worse. The place was dreadful and very dark.

            At the front of the house, they tried every way they could think of to move the kitchen-window bolt. They pushed a rusty nail between the window frames, but without a light, it was hopeless. So they sat together outside, whispering and listening.

            Half an hour later, the moon rose over the woods. Its clear, cold light fell across the house and shone through the kitchen window. Still, no baby rabbits could be seen. Moonlight flashed on the carving knife and pie dish, then stretched in a bright path across the dirty floor.

            Now the rabbits could see a small iron door in the wall beside the fireplace. It belonged to an old brick oven, the kind once heated with bundles of wood.

            Peter and Benjamin noticed something at the very same moment. Whenever they shook the window, that little iron door shook back. The babies were alive, shut inside the oven.

            Benjamin grew so excited that it was a wonder he did not wake Tommy. The badger kept snoring solemnly in Mr. Tod's bed. Still, knowing where the babies were did not solve much. Peter and Benjamin could not open the window, and the babies were too young even to crawl out by themselves.

            After a long whispered discussion, the cousins decided to dig a tunnel. They began a little way down the bank, hoping to work between the large stones beneath the house. The kitchen floor was so filthy that they could not tell whether it was made of earth or stone slabs.

            They dug for hours. The rocks kept them from going straight, but by the end of the night they were underneath the kitchen floor. Benjamin lay on his back, scratching upward. Peter's claws were worn down, and he stayed at the tunnel entrance, pushing away sand.

            Then Peter called that morning had come. The sun was rising, and jays were crying in the woods below. Benjamin crawled from the dark tunnel, shook sand from his ears, and washed his face with his paws. The hilltop grew warmer minute by minute. Down in the valley, white mist spread like a sea, with the golden tops of trees rising through it.

            An angry jay called again from the misty fields. Right after it came the sharp, yelping bark of a fox.

            Both rabbits completely lost their heads. They did the most foolish thing possible. They rushed into their short new tunnel and hid at its far end, directly under Mr. Tod's kitchen floor.
    - id: ch04
      title: Mr. Tod Comes Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            Mr. Tod was climbing Bull Banks in the worst possible temper. First, he had broken a plate. It was his own fault, but the plate was china, the last piece from the dinner set that had belonged to his grandmother, old Vixen Tod. Then the midges had bothered him. He had failed to catch a hen pheasant on her nest, and the nest held only five eggs, two of them rotten. Altogether, his night had been a failure.

            Whenever Mr. Tod was in a bad mood, he moved to another house. He tried the hollow willow first, but it was damp, and the otters had left a dead fish nearby. Mr. Tod could tolerate his own leftovers, but nobody else's.

            As he climbed the hill, he spotted the unmistakable marks of a badger. No one but Tommy Brock tore up moss so carelessly. Mr. Tod struck the ground with his walking stick and fumed. He could guess exactly where Tommy had gone.

            A jay followed him from tree to tree, scolding loudly. Its cries warned every rabbit nearby that a cat or fox was coming through the woods. When it screamed over his head, Mr. Tod snapped at the bird and barked.

            He reached his house carrying a large rusty key. He sniffed, and his whiskers bristled. The door was locked, but he doubted the house was empty. Under the floor, the rabbits heard the key turn. Mr. Tod carefully opened the door and stepped inside.

            One look at his kitchen made him furious. His chair, his pie dish, his knife and fork, mustard, salt cellar, and the tablecloth he had left folded in the dresser were all laid out for supper, or perhaps breakfast. There was no doubt who had done it. That hateful Tommy Brock.

            Fresh earth and dirty badger filled the air. Luckily for Peter and Benjamin, the badger smell covered every trace of rabbit. But one sound captured all of Mr. Tod's attention. A deep, slow, steady snoring grunt came from his own bed.

            Mr. Tod peeked through the hinges of the half-open bedroom door. Then he hurried straight back outside. His whiskers stood out, his coat collar rose, and he shook with rage.

            For twenty minutes, he crept into the house and hurried out again. Each time he went a little farther. First he reached the kitchen, then the bedroom door, and finally the bedroom itself. Whenever he escaped outdoors, he clawed the dirt furiously. But once he was back inside, he lost his courage. Tommy's teeth looked much too dangerous.

            Tommy lay on his back, mouth open and grinning from ear to ear. His snores were peaceful and regular. One eye, however, was not quite closed.

            Mr. Tod went in and out of the bedroom over and over. Twice he carried in his walking stick, but both times he took it away again. Then he returned with the coal scuttle. He changed his mind about that as well and removed it. When he came back, Tommy had rolled a little farther onto his side. If anything, he looked more deeply asleep. He was not afraid of Mr. Tod at all. He was simply too lazy and comfortable to move.

            Mr. Tod returned with a clothesline. He watched Tommy and listened closely. The snores sounded loud but natural. Then, with his back to the bed, he unfastened the window. It creaked. Mr. Tod spun around. Tommy had opened one eye, but he snapped it shut, and the snores went on.

            The bed stood between the door and window, so Mr. Tod moved awkwardly and kept looking uneasy. He pushed most of the clothesline out onto the sill, keeping the end with a hook in his paw. Tommy worked very hard at his snoring.

            Mr. Tod stared at him once more and left. Tommy opened both eyes, looked at the rope, and grinned. A sound came from outside the window, and he quickly closed his eyes again.

            Mr. Tod had gone around the back of the house. On the way, he stepped into the rabbits' tunnel. If he had known who was inside, he would have pulled them out at once. His foot broke through almost on top of Peter and Benjamin, but he decided it was only more of Tommy's digging.

            He picked up the coil of rope from the windowsill, listened, and tied it to a tree. Tommy watched through the window with one eye. For once, he looked puzzled.
        - id: ch04-b02
          speaker: narrator
          text: |-
            Next, Mr. Tod fetched a large, heavy pail of water from the spring and staggered through the kitchen into the bedroom. Tommy's snores became louder, ending in a snort.

            Mr. Tod set the pail beside the bed. He picked up the hooked end of the rope, hesitated, and studied Tommy. The snores sounded almost choking now, though the grin had grown smaller.

            Carefully, Mr. Tod climbed onto a chair beside the head of the bed. His thin legs stood dangerously close to Tommy's teeth. He reached up and hooked the rope over the wooden frame above the bed, where curtains would normally hang. The curtains and counterpane had been stored away while the house was empty, so Tommy had only a blanket over him.

            From the shaky chair, Mr. Tod stared down. What an astonishing sleeper! Even a rope flapping over the bed did not seem to wake him.

            Mr. Tod climbed down safely. Then he tried to climb back up carrying the pail. His plan was to hang it above Tommy's head and make a shower bath that he could release by pulling the rope outside. But Mr. Tod had thin legs, even if he was vengeful and sandy-whiskered. He could not raise the heavy pail high enough. He nearly toppled over.

            Tommy's snores grew worse. One hind leg twitched under the blanket, but he appeared to sleep peacefully.

            Mr. Tod and the pail came down without an accident. After thinking for some time, he poured the water into a basin and pitcher. The empty pail was light enough to lift, so he hung it wobbling above Tommy's head.

            Mr. Tod went up and down the chair again and again. Since he could not lift all the water at once, he used a milk pitcher to scoop it back into the hanging pail. The pail filled little by little and swung like a pendulum. Now and then, a drop splashed over. Tommy kept snoring and never moved, except for one eye.

            Finally, everything was ready. The pail was full. The rope stretched tightly over the bed, across the windowsill, and out to the tree.
        - id: ch04-b03
          speaker: mr_tod
          text: |-
            This will make a terrible mess in my bedroom. Still, I could never sleep in that bed again without a proper spring cleaning.
        - id: ch04-b04
          speaker: narrator
          text: |-
            Mr. Tod took one last look at the badger, slipped from the room, and closed the front door behind him. Beneath the floor, the rabbits heard his steps pass over their tunnel. He ran behind the house to release the rope and dump the water onto Tommy.
        - id: ch04-b05
          speaker: mr_tod
          text: |-
            I'll wake him with a very unpleasant surprise.
    - id: ch05
      title: The Pail and the Battle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            The moment Mr. Tod left, Tommy jumped out of bed. He rolled Mr. Tod's dressing gown into a bundle, tucked it under the blanket in his own place, and hurried from the room, grinning wider than ever.

            In the kitchen, Tommy lit the fire and boiled the kettle. For the moment, he did not bother cooking the baby rabbits.

            Outside, Mr. Tod found that the pail's weight had pulled the knot at the tree impossibly tight. He had to gnaw through it. For more than twenty minutes, he chewed and worried the rope. At last it snapped so suddenly that it nearly pulled out his teeth and knocked him flat on his back.

            A tremendous crash and splash came from the bedroom, followed by the sound of a pail rolling over and over.

            But no one screamed.

            Mr. Tod could not understand it. He sat completely still and listened for some sign of Tommy. When none came, he crept to the window and peered inside. Water ran from the soaked bed, and the fallen pail lay in a corner. Under the blanket was a wet, flattened shape. The middle had a deep hollow where the pail had struck it across the stomach. The wet blanket covered its head. Whatever it was, it had stopped snoring.

            Nothing moved. The only sound was water dripping from the mattress. Drip, drop, drop, drip.

            Mr. Tod stayed at the window for half an hour. He did not take his eyes from the bed, and his eyes began to shine. At last he leaped with delight. Feeling bolder, he even tapped on the glass to make absolutely sure. The bundle never stirred.

            There could be no doubt. His plan had worked better than he hoped. The pail had struck Tommy Brock and killed him dead.
        - id: ch05-b02
          speaker: mr_tod
          text: |-
            I'll bury that nasty creature in the hole he dug. Then I'll carry my bedding outside and dry it in the sun.

            I'll wash the tablecloth and spread it on the grass to bleach. The blanket can hang in the wind. The bed must be disinfected, aired with a warming pan, and warmed again with a hot-water bottle.

            I'll need soft soap, monkey soap, every kind of soap, soda, scrubbing brushes, Persian powder, and carbolic for the smell. The whole place must be disinfected. I may even have to burn sulfur.
        - id: ch05-b03
          speaker: narrator
          text: |-
            He hurried around the house to fetch a shovel from the kitchen.
        - id: ch05-b04
          speaker: mr_tod
          text: |-
            First I'll fix up the hole. Then I'll drag that creature out in the blanket.
        - id: ch05-b05
          speaker: narrator
          text: |-
            Mr. Tod opened the door.

            Tommy Brock sat at Mr. Tod's kitchen table, pouring tea from Mr. Tod's teapot into Mr. Tod's cup. Tommy himself was perfectly dry and grinning. He flung the cup of scalding tea all over Mr. Tod.

            Mr. Tod sprang at Tommy. Tommy grabbed Mr. Tod, and the two fought furiously among the broken dishes. Underneath them, Peter and Benjamin thought the floor might collapse with every crash of furniture.

            The rabbits crawled from their tunnel and waited among the rocks and bushes, listening nervously.

            The racket inside was dreadful. The baby rabbits woke and trembled in the oven. Perhaps it was just as well that the little ones were shut inside.

            Everything in the kitchen fell over except the table. Everything broke except the mantelpiece and the metal fender by the fire. The dishes shattered. The chairs broke. The window broke. The clock crashed down, along with handfuls of Mr. Tod's sandy whiskers.

            Vases tumbled from the mantelpiece. Canisters dropped from the shelf. The kettle fell from the stove. Tommy stepped into a jar of raspberry jam, and boiling water from the kettle poured over Mr. Tod's tail.

            When the kettle fell, Tommy was on top. Still grinning, he rolled Mr. Tod over and over like a log and straight out the door.

            Outside, they kept snarling and tearing at each other. They rolled over the bank and down the hill, bumping across the rocks. There will never be any love lost between Tommy Brock and Mr. Tod.
    - id: ch06
      title: The Rescue
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            As soon as the way was clear, Peter and Benjamin came out from the bushes.
        - id: ch06-b02
          speaker: peter_rabbit
          text: |-
            Now's our chance! Run inside and get the babies, Benjamin. I'll watch the door.
        - id: ch06-b03
          speaker: narrator
          text: |-
            But Benjamin was frightened.
        - id: ch06-b04
          speaker: benjamin_bunny
          text: |-
            Oh! They're coming back!
          emotion: fearful
        - id: ch06-b05
          speaker: peter_rabbit
          text: |-
            No, they're not.
        - id: ch06-b06
          speaker: benjamin_bunny
          text: |-
            Yes, they are!
          emotion: fearful
        - id: ch06-b07
          speaker: peter_rabbit
          text: |-
            Listen to that awful language. I think they fell into the stone quarry.
        - id: ch06-b08
          speaker: narrator
          text: |-
            Benjamin still hung back, and Peter kept pushing him toward the house.
        - id: ch06-b09
          speaker: peter_rabbit
          text: |-
            Hurry. It's safe. Once you have the babies, close the oven door so Tommy won't notice they're gone.
        - id: ch06-b10
          speaker: narrator
          text: |-
            There had certainly been lively goings-on in Mr. Tod's kitchen.

            Back at the rabbit hole, things had not been peaceful either. Flopsy and old Mr. Bouncer quarreled through supper, passed a sleepless night, and started quarreling again at breakfast. Mr. Bouncer could no longer deny inviting a visitor inside, but he refused to answer Flopsy's questions or complaints. The day dragged by.

            Mr. Bouncer sat sulking in a corner behind a chair he had set up like a barricade. Flopsy had taken away his pipe and hidden his tobacco. To work off her feelings, she had emptied and spring-cleaned the whole burrow. Now she was finished, and Mr. Bouncer waited anxiously behind the chair, wondering what she might do next.

            Meanwhile, Benjamin picked his way through the wreckage in Mr. Tod's kitchen. A thick cloud of dust hung in the air. Nervously, he reached the oven, opened its little door, and felt inside. Something warm and wriggling met his paws. He lifted it out carefully and went back to Peter.
        - id: ch06-b11
          speaker: benjamin_bunny
          text: |-
            I have them! Can we go now? Should we hide, Peter?
        - id: ch06-b12
          speaker: narrator
          text: |-
            Peter raised his ears. Far off in the woods, the sounds of fighting still echoed.

            Five minutes later, two breathless rabbits raced down Bull Banks. Between them, they half carried and half dragged a sack that went bump, bump, bump over the grass. They reached home safely and burst into the rabbit hole.

            Flopsy was overjoyed, and old Mr. Bouncer was deeply relieved when Peter and Benjamin returned in triumph with the young family. The babies were rumpled and very hungry. They were fed, tucked into bed, and soon recovered.

            Someone gave Mr. Bouncer a long new pipe and a fresh supply of rabbit tobacco. He acted rather dignified about it, but he accepted the gift.

            Mr. Bouncer was forgiven, and everyone ate dinner. Then Peter and Benjamin told the whole story. But they had not waited long enough to learn how the battle between Tommy Brock and Mr. Tod finally ended.

            The end.
