cover_prompt: |-
  A wordless cover scene at the edge of an Edwardian English wood shows Benjamin Bunny and Peter Rabbit quietly rescuing the baby rabbits from Mr. Tod's cottage. Benjamin is a brown rabbit in a green cap and short jacket, Peter a smaller brown rabbit in a pale blue jacket, and the babies are wrapped safely in a wicker basket between them. In the middle distance, Mr. Tod is a red fox in a worn brown coat and Tommy Brock a stocky badger in a dark waistcoat, both visible only as distracted silhouettes beyond a hedge. Benjamin lifts the basket toward Peter through an open window, making the careful rescue the focal action. Use a low rabbit-height three-quarter view with cottage stones and bracken framing the scene and calm dusk sky above. Keep the suspense gentle, the animals anatomically credible, and every design based on the original text rather than film or branded adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
