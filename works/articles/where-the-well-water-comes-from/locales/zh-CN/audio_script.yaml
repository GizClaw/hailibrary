audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在身边讲故事，沉静而有观察力, timbre: 温暖清晰, pace: 舒缓自然, pitch: 中}}
    child: {display_name: 阿满, tts: {delivery: 好奇认真，遇事会紧张但不躲闪, timbre: 清亮的少年声, pace: 自然稍快, pitch: 中高}}
    well-keeper: {display_name: 石伯, tts: {delivery: 实在耐心，说话直接，也坦然承认不知道, timbre: 低沉略带风霜, pace: 从容, pitch: 低}}
    worker: {display_name: 修农机的人, tts: {delivery: 劳作后的急躁和戒备, timbre: 朴实略粗, pace: 偏快, pitch: 中}}
    shop-owner: {display_name: 周叔, tts: {delivery: 起初冷硬防备，后来务实坦率, timbre: 厚实粗粝, pace: 稳健, pitch: 中低}}
  chapters:
    - id: ch01
      title: 空桶的闷响
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            井桶落到底，没有“扑通”一声。下面传来的，是一声闷闷的“咚”。

            阿满握着辘轳，肩膀还向后绷着。麻绳在木轴上颤了几下，井口冒出凉气，井里却没有水响。后面的铁桶、塑料壶和搪瓷盆，也都静了。
        - {id: ch01-b02, speaker: worker, text: 再往下放一点试试。}
        - id: ch01-b03
          speaker: narrator
          text: 阿满松了半圈绳。桶擦着石壁，又是一声“咚”。石伯挤到井边，把草帽往脑后一推，接过绳子慢慢提。桶里只有薄薄一层浑水，一片枯叶正在打转。
        - {id: ch01-b04, speaker: well-keeper, text: 今天一家少打半桶。}
        - {id: ch01-b05, speaker: child, text: 这片叶子怎么会在井底？}
        - {id: ch01-b06, speaker: well-keeper, text: 是从井口落下去的。}
        - {id: ch01-b07, speaker: child, text: 可井里的水去哪儿了？}
        - {id: ch01-b08, speaker: narrator, text: 石伯抬起手背，擦掉了桶边的泥。}
        - {id: ch01-b09, speaker: well-keeper, text: 这可不是一句话能说清的。先腾开地方，让后面的人打水。}
        - id: ch01-b10
          speaker: narrator
          text: |-
            阿满却没走。他答应母亲带两桶水回去，午后还要泡豆子。如今第二桶只打到一半。回家路上，扁担一边轻，一边重。桶里的水响个不停，像在数他少打了多少。

            天刚亮，石伯就来敲窗。阿满还当井水涨了，开门却见石伯扛着铁钎，腰边挂着卷尺和一只缺口白瓷缸。
        - {id: ch01-b11, speaker: well-keeper, text: 你不是要找水吗？把鞋穿结实了。}
        - id: ch01-b12
          speaker: narrator
          text: 两人先到井边。石伯放下拴着铁坠的细绳。铁坠一碰水，他就在井沿捏住绳子。阿满拉直卷尺，念出刻度。石伯把数记在烟盒背后，又翻出前几天的记录。那些数字像一串下坡的脚印，一天比一天低。
        - {id: ch01-b13, speaker: child, text: 井会不会就是一口大缸？水让大家喝光了？}
        - {id: ch01-b14, speaker: narrator, text: 阿满伏在青石井沿上，朝下面望。}
        - {id: ch01-b15, speaker: well-keeper, text: 要真是一口缸，水早就喝没了。井只是伸到地下水里的一个口。地下到底什么样，我也没有透视眼。走吧，咱们先去看地面。}
    - id: ch02
      title: 水怎么走
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            村东的河瘦得只剩一截截亮光。老石桥下，泥地裂开，白螺壳卡在缝里。阿满快步穿过干河床，鞋里忽然透进凉意。芦苇后面，湿沙正冒出小亮点。

            石伯拿瓷缸撇开浮泥，清水又慢慢聚拢了。
        - {id: ch02-b02, speaker: child, text: 这是泉眼吗？}
        - {id: ch02-b03, speaker: well-keeper, text: 只能说，这里有水渗出来。地下水遇到难穿过去的土和石头，有时会顺着上面的缝慢慢往旁边挪，再从低处露头。可别把它想成地底藏着一条大河。}
        - {id: ch02-b04, speaker: narrator, text: 说着，石伯把铁钎插进沙里探了探。阿满听了，还是想不通。}
        - {id: ch02-b05, speaker: child, text: 连一条河都没有，水靠什么往前走？}
        - id: ch02-b06
          speaker: narrator
          text: |-
            石伯装来一缸粗沙，又挖下一块黄褐色黏土，叫阿满同时倒水。沙里的水很快从缸底滴出，黏土上的水却摊在表面，被太阳照得发亮。

            阿满攥住湿沙。指缝没有水流，手心却凉了。
        - {id: ch02-b07, speaker: well-keeper, text: 沙和石头中间有空隙，水能待在里面，也能一点点过去。眼前这缸沙，只能让你看个大概。地下分了几层，每层朝哪边斜，要钻孔，要量水位，有时还得找懂地质的人。只用眼睛看，再跟着感觉猜，可不行。}
        - id: ch02-b08
          speaker: narrator
          text: 他们接着往上游走。太阳升高，石头烫脚，蝉声像从树皮里钻出来。阿满本想找到一个黑洞，看水轰隆隆流向老井。走了半天，却只见松软的砂砾、红色坡土、雨后冲出细沟的田埂，还有山脚生着青苔的渗水石缝。
        - {id: ch02-b09, speaker: child, text: 去年下的雨，是不是都藏到地下了？}
        - {id: ch02-b10, speaker: well-keeper, text: 哪能都在下面。有的进了河，有的让庄稼和树吸走了，有的又晒回天上。剩下的，才有一部分往下渗。就算渗下去，也未必会到咱们那口井。地下水走得慢，路也绕。}
        - {id: ch02-b11, speaker: narrator, text: 石伯说到这里，停下来喘了喘。}
        - {id: ch02-b12, speaker: child, text: 那等下一场雨，井水就会满回来吗？}
        - {id: ch02-b13, speaker: well-keeper, text: 这个，我不敢答应。}
        - id: ch02-b14
          speaker: narrator
          text: 这是石伯那天说得最痛快的一句。阿满原以为，修了三十年井的人什么都知道。听到“不敢答应”，他反而认真看起烟盒背后的图。图上有山坡、砂砾、难透水的黏土，还有一口伸进湿层的井。线虽然歪，雨落到坡上以后，却有好几条路。
    - id: ch03
      title: 不拿井水冒险
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 回村途中，废砖窑旁飘来呛人的柴油味。坡脚倒着几只破桶，黑油沿旧雨冲出的沟印，一直淌到砂砾地旁。两个修农机的人正要泼掉一盆灰水。石伯快步赶过去。
        - {id: ch03-b02, speaker: well-keeper, text: 先别倒在这里。}
        - {id: ch03-b03, speaker: worker, text: 老井离这儿远得很。}
        - {id: ch03-b04, speaker: well-keeper, text: 地面隔得远，地下可不一定断开。}
        - {id: ch03-b05, speaker: worker, text: 那你亲眼看见它们通着了？}
        - {id: ch03-b06, speaker: narrator, text: 这回，石伯没有马上跟他争。他弯下腰，从地上抓起一把砂砾。再松开手时，柴油味已经粘在指头上。}
        - {id: ch03-b07, speaker: well-keeper, text: 我没看见。正因为没看见，才不能拿全村喝的水去试。得找人来查。今天这盆水，先别泼。}
        - id: ch03-b08
          speaker: narrator
          text: 端盆的人看看太阳，又看看脏水，嘟囔几句，还是把盆端回棚子。阿满望着石伯沾油的手。老人承认不知道，却一步也没退。
    - id: ch04
      title: 把“可能”写下来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 午后，阿满把烟盒上的图放大，重画在旧木板上，带给井边的人看。有人说砖窑用了几十年也没出事。也有人说眼下正旱，别再添麻烦。修农机的周叔抱着胳膊站在人群外，脸色最难看。
        - {id: ch04-b02, speaker: shop-owner, text: 零件不让洗，我们还怎么做活？}
        - id: ch04-b03
          speaker: narrator
          text: 阿满前一晚准备了不少好听的话，这会儿全忘了。他只看见周叔指甲缝里都是黑油，也看见周叔家门口摆着两只空水桶。
        - {id: ch04-b04, speaker: well-keeper, text: 不是叫你们停工。洗过零件的油水先接住，再送去镇上的回收点。坡上漏油的旧桶，也先搬走。村里来找车，你们搭把手，这样行不行？}
        - {id: ch04-b05, speaker: worker, text: 那运东西的钱由谁来出？}
        - id: ch04-b06
          speaker: narrator
          text: |-
            人群里又响起一片争论。最后，卖豆腐的婶婶拿来了账本，各家按自己拿得出的数凑钱。周叔去找能盖严的大桶。阿满和几个孩子，只能到上坡没有油污的地方捡塑料和碎砖，黑泥谁也不许碰。

            干这件事，没有半点胜利的样子，更没有什么可庆祝的。太阳晒得人发晕，废桶又沉。刚抬起一只桶，底下就开始漏，大家只好赶紧另找盆来接。

            过了三天，镇里的技术员赶来。她看了地势，测了几处水位，还带走了水样。她说，这片地有可能是浅层地下水接收雨水的地方。不过，地下的情况还要继续查，不能只看一幅图就下结论。石伯听完，当着众人的面点点头。他把木板翻过来，在背面写下两个字，“可能”。
    - id: ch05
      title: 雨没有按人的钟走
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            第七天夜里，雨终于来了。第一滴敲上瓦片，阿满一下坐起身。很快，屋檐连成水帘，院里冒出干土沾水的气味。他跑到门前，看雨水顺石板冲向巷口。坡上的浅草沟挡住一部分急流。水在草根间慢下来，浑泥也渐渐沉了。

            阿满打着伞赶去井边。石伯已经到了，手里的电筒正照着井绳。
        - {id: ch05-b02, speaker: child, text: 咱们现在就量吗？}
        - {id: ch05-b03, speaker: well-keeper, text: 量。不过量完了，井也不会立刻装满。先把今天记住，往后还要继续量。}
        - id: ch05-b04
          speaker: narrator
          text: |-
            大雨把石伯的话打得断断续续。他们放下铁坠。细绳贴着湿透的井沿，一寸寸滑进黑暗。等了很久，下面才有一点轻响。那不再是空桶撞上石头的“咚”，更像一滴水，碰到了另一片水。

            石伯捏住绳子，阿满举着电筒，把卷尺上的刻度照亮。他们就这样记下了雨夜的数字。

            可到了第二天早晨，水位看不出什么变化。有人叹气，还有人说昨夜的雨算是白下了。阿满没跟他们争，只把红皮本收起来。石伯让他伸手摸摸井沿外侧。太阳已经把石头晒热了，石缝里还有一点潮湿。
        - {id: ch05-b05, speaker: child, text: 这场雨没有白下。是水没照着我们的钟走。}
        - {id: ch05-b06, speaker: well-keeper, text: 这话可以记进本子。不过，千万别把它当成保证。}
        - id: ch05-b07
          speaker: narrator
          text: |-
            后面的十天，阿满总在同一个时辰来井边。母亲也让他把家里用了多少水记上。泡过豆子的水留着冲院角，淘过米的水拿去浇门外那棵打蔫的石榴树。

            但母亲不许阿满把节水说成游戏。少做一锅豆腐，家里就少赚一笔钱。到了第五天，卖豆腐的婶婶来借水。母亲推过去半桶，夜里却望着没有泡完的豆子发愁。阿满这才懂了。井里那个刻度不是书上的题，它会进到每家的锅里，也会落到账本上。

            周叔的棚子也停了两天。没有合用的收集桶，他不敢洗零件。两个等着修水泵的人，只好转去镇上。后来，他在井边遇见阿满，冷着脸朝木板上的图点了点。
        - {id: ch05-b08, speaker: shop-owner, text: 就凭这幅图，你能把我赔掉的钱补回来吗？}
        - {id: ch05-b09, speaker: narrator, text: 阿满想躲到石伯背后去。偏偏石伯弯腰查看井盖，像是根本没听见。阿满只得站在原地，自己开口。}
        - {id: ch05-b10, speaker: child, text: 我赔不了。五金车要到周四才来。我可以去学校问问，先借几个能盖上的桶。}
        - {id: ch05-b11, speaker: shop-owner, text: 桶借到了，谁来洗？}
        - {id: ch05-b12, speaker: child, text: 油我不能碰。不过车哪天来，我可以挨家挨户去告诉大家。}
        - id: ch05-b13
          speaker: narrator
          text: |-
            周叔哼了一声，没答应，也没拒绝。那天下午，阿满一连跑了七户。有的人嫌他管得多，有的人愿意来抬桶。母亲听完，只在门边放下一双厚手套，告诉他，那是给成年人用的。

            星期四，五金车回村时，车厢特意空出了一半。周叔亲手把封好的废液桶推上跳板。石伯和司机各站一边，把桶扶稳。这一次，桶底再也没有拖出黑色的油线。
    - id: ch06
      title: 给下一次测量留白
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            技术员第二次进村，带回水样的初步结果。目前没有证据说明油污进井。可只取一次样，也不能保证以后安全。那面坡是不是主要的补水地方，还得看更多水位和地层资料。

            有人松了口气，马上问能不能搬回旧桶。周叔先开了口。他摘下手套，手心被捂得发白。
        - {id: ch06-b02, speaker: shop-owner, text: 难道非要等井里看见油才算数？新的桶留在棚里，旧的送走。车钱我先出一半。剩下那一半，谁往车上装了东西，谁来分担。}
        - id: ch06-b03
          speaker: narrator
          text: |-
            村里也没有圈住整座山。技术员说，水从哪里来还没弄清，不能靠想象画神奇的界线。大家先搬走漏桶，把洗油水收进带盖容器，不再往井旁倒污水。他们又修好通往砖窑的排水沟，在干净的裸地上种本地草，让暴雨少冲走泥土。孩子只捡干净垃圾。沾油的土，由做好防护的大人清理。

            从前，阿满最想要一张答案图。如今，红皮本里有了几种线。量过的水位画实线，待查的地下水路画虚线，雨在坡上流过的地方画弯线。线越多，他反而越不急着认定答案。

            第十一天，井水比雨夜稍高。石伯先量一次，又让阿满量一遍。两个数一样，他们才写进本子。没人说，这点水一定是那场雨直接送来的。也没人保证，井水不会再降。母亲看完，只给第二天的泡豆水多添一瓢。

            入秋以前，又下过两场慢雨。坡上的草先被雨压倒，后来又在沟边立直。干河床上依然露着大片白石，倒木下的渗水却比以前宽了一掌。阿满和石伯沿着老路复查。周叔也来了，背包里装着取样瓶和午饭。
        - {id: ch06-b04, speaker: shop-owner, text: 那天要不是你们拦住我，那盆水多半已经让我泼出去了。}
        - {id: ch06-b05, speaker: well-keeper, text: 可我们要是假装什么都明白，你也一样不会信。}
        - {id: ch06-b06, speaker: shop-owner, text: 到现在，我也没有全信。}
        - {id: ch06-b07, speaker: child, text: 那咱们就继续量。}
        - id: ch06-b08
          speaker: narrator
          text: |-
            说完，阿满把空瓶递给了周叔。

            水不是从一个洞口猛冲出来的。起先，只有几粒沙的颜色变深。接着，水在小石子中间连成薄薄的一片。再后来，它才一点一点积到瓶口里。阿满想起旱天的那个早晨，空桶碰到了井底。那时，他以为井是一口埋在地下的大缸，急着查出是谁喝空了水。现在，老井依旧没有给他一条明明白白的地下河。它给他的，是许多又慢又小的证据。

            冬天到来以前，技术员把几处水位、地势和地层资料放在一起，在木板上圈出一片坡地。那里需要先保护起来，也要接着调查。圈线从周叔棚子后面切过一角。周叔把清洗台挪到了一个有硬地、有棚顶、还能接住废水的地方。搬台子时，阿满使不上力，就跟在后面，把落下的螺帽一颗颗捡进盒子。

            井边每个月照旧测量水位。夏天定下的配水规矩也没有马上取消，后来雨水多起来，才一点点放宽。阿满偶尔写错日期，石伯总叫他划掉重写，不能凭记忆补一个数。石伯自己也有猜错的时候。有一次，他猜渗水会先涨，谁知老井先有了变化。他把原来的猜测圈住，在旁边写下，“猜错，留着。”

            第二年第一场春雨过后，阿满独自来到井边。他已经能把测绳稳稳放下去。铁坠穿过井口的凉气，细线从他的手指间一寸寸往下走。远处，周叔棚顶的雨水正落进草沟。坡上的新草把泥土压在原处。石桥下面，那处渗水把一小片沙染成了深褐色。

            井下传来轻轻一响。

            阿满捏住细线，在红皮本上记下刻度。他没有急着画箭头，只在日期后面留了半页空白。
