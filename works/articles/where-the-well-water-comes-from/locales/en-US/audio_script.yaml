audio_script:
  language: en-US
  cast:
    narrator: {display_name: Narrator, tts: {delivery: "conversational, observant, and composed", timbre: warm and clear, pace: measured, pitch: medium}}
    child: {display_name: Nora, tts: {delivery: "curious, candid, and intent on evidence", timbre: clear and youthful, pace: naturally lively, pitch: medium-high}}
    well-keeper: {display_name: Mr. Vale, tts: {delivery: "patient, practical, and honest about uncertainty", timbre: low and weathered, pace: unhurried, pitch: low}}
    repair-worker: {display_name: Repair worker, tts: {delivery: defensive and impatient, timbre: work-worn, pace: brisk, pitch: medium-low}}
    shop-owner: {display_name: Mr. Rusk, tts: {delivery: "guarded at first, then practical and candid", timbre: sturdy and slightly rough, pace: steady, pitch: medium-low}}
    hardware-driver: {display_name: Hardware driver, tts: {delivery: brief and matter-of-fact, timbre: clear adult voice, pace: even, pitch: medium}}
    hydrologist: {display_name: Hydrologist, tts: {delivery: precise but easy to follow, timbre: calm and clear, pace: measured, pitch: medium}}
    mother: {display_name: Nora's mother, tts: {delivery: "tired, direct, and caring", timbre: warm adult voice, pace: deliberate, pitch: medium}}
  chapters:
    - id: ch01
      title: The Short Chain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Nora knew the well was in trouble when Mr. Vale brought out the short chain.

            All summer, buckets had gone down on the long chain, hit water with a splash, and come back sweating cold drops. But on the first Monday in August, Mr. Vale took out six links to keep the bucket from hitting bottom. Even then, rusty sand swirled through the water in Nora's two cans.
        - {id: ch01-b02, speaker: child, text: "Where did the rest go?"}
        - {id: ch01-b03, speaker: well-keeper, text: "Out through our taps, mostly. The harder question is why it isn't coming back as fast."}
        - id: ch01-b04
          speaker: narrator
          text: |-
            Mr. Vale flexed his stiff fingers. He'd been fixing pumps and stone wells longer than Nora had been alive.

            His answer wasn't what she wanted. At home, her mother used a cup to measure water into the bean pot. Nora could practically hear every cup they didn't use.

            The next morning, she found Mr. Vale lowering a weighted tape through the well's inspection opening. The instant its buzzer touched water, he read the mark and wrote it in a grease-stained notebook.
        - {id: ch01-b05, speaker: child, text: "Can I see?"}
        - id: ch01-b06
          speaker: narrator
          text: He showed her a column of dates and depths. The water had dropped a little almost every day. Nora pictured a stone room beneath the village, drained one cup at a time.
        - {id: ch01-b07, speaker: child, text: "So we need to find the underground lake."}
        - {id: ch01-b08, speaker: narrator, text: "Mr. Vale closed the well cap."}
        - {id: ch01-b09, speaker: well-keeper, text: "Pack lunch. We'll go look for the lake that probably isn't there."}
    - id: ch02
      title: Clues on Juniper Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            They followed the dry creek toward Juniper Hill. Cicadas buzzed in the sycamores. Most of the creek bed was pale stone, except for a patch of black mud under a fallen log. Mr. Vale brushed the leaves aside. Clear water slowly filled his thumbprint.
        - {id: ch02-b02, speaker: child, text: "A spring?"}
        - {id: ch02-b03, speaker: well-keeper, text: "A seep. It tells us water is moving through this bank."}
        - id: ch02-b04
          speaker: narrator
          text: |-
            He filled three cracked flowerpots with gravel, sand, and clay. Nora poured the same amount of water into each one. It rattled through the gravel, dripped through the sand, and sat shining on top of the clay.
        - {id: ch02-b05, speaker: child, text: "Those are aquifers?"}
        - {id: ch02-b06, speaker: well-keeper, text: "Those are flowerpots."}
        - id: ch02-b07
          speaker: narrator
          text: |-
            He handed Nora the cup again.
        - {id: ch02-b08, speaker: well-keeper, text: "An aquifer is rock or sediment that can store and carry groundwater. The layers underground aren't lined up as neatly as my pots."}
        - id: ch02-b09
          speaker: narrator
          text: |-
            Nora squeezed the wet sand. It held water, even though no stream ran through her palm.

            They climbed on. The morning's heat rose off the bare slope. In a road cut, pebbles lay above a hard strip of reddish clay. Farther up, old rain had carved finger-shaped channels beside an abandoned vehicle shed.
        - {id: ch02-b10, speaker: child, text: "Rain falls here. Some of it soaks through the gravel. The clay slows it down, so it moves sideways and comes out at the creek."}
        - {id: ch02-b11, speaker: well-keeper, text: "That could be part of it."}
        - {id: ch02-b12, speaker: child, text: "And then it goes to our well."}
        - {id: ch02-b13, speaker: narrator, text: "Mr. Vale sat on a boulder and unwrapped his sandwich."}
        - {id: ch02-b14, speaker: well-keeper, text: "Could. I haven't mapped the layers, and I don't know the travel time. Groundwater doesn't promise to follow the arrows we draw."}
        - {id: ch02-b15, speaker: child, text: "But you fix wells."}
        - {id: ch02-b16, speaker: well-keeper, text: "Fixing a pump and knowing every crack under a hill are two different jobs."}
        - id: ch02-b17
          speaker: narrator
          text: Nora had never heard him say he didn't know. She'd expected those words to shut a door. Instead, he handed her the notebook and asked her to sketch the road cut.
    - id: ch03
      title: The Oily Streak
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Past the shed, a sharp oily smell pushed out the scent of hot weeds. Two dented drums lay on their sides. A dark streak ran from them into the very same gravel Nora had just drawn. A repair-shop worker came outside carrying a basin of gray wash water.
        - {id: ch03-b02, speaker: well-keeper, text: "Please don't dump that."}
        - {id: ch03-b03, speaker: narrator, text: "The man stopped."}
        - {id: ch03-b04, speaker: repair-worker, text: "Since when do you own this hill?", emotion: angry}
        - {id: ch03-b05, speaker: well-keeper, text: "I don't."}
        - {id: ch03-b06, speaker: repair-worker, text: "Then don't tell me where to wash a wrench.", emotion: angry}
        - id: ch03-b07
          speaker: narrator
          text: Mr. Vale crouched beside the dark streak and rubbed a little gravel between his fingers.
        - {id: ch03-b08, speaker: well-keeper, text: "This may be ground where water enters the shallow aquifer. If it is, spilled oil can travel with that water."}
        - {id: ch03-b09, speaker: repair-worker, text: "May be?"}
        - {id: ch03-b10, speaker: well-keeper, text: "May be. We need a real survey and water tests."}
        - {id: ch03-b11, speaker: repair-worker, text: "So you don't know.", emotion: disgusted}
        - id: ch03-b12
          speaker: narrator
          text: The man snorted. Nora waited for Mr. Vale to snap back, but he simply stood up.
        - {id: ch03-b13, speaker: well-keeper, text: "I know I won't gamble the village well just to save one trip to the collection station."}
        - {id: ch03-b14, speaker: narrator, text: "The basin trembled in the man's hands. At last, he carried it back inside."}
    - id: ch04
      title: Possible Paths
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            By noon, everyone had an opinion. Closing the wash area would hurt the repair shop. Hauling oily waste would cost money. And some people said a few old drums had nothing to do with the drought.

            Nora made a poster from a flattened grocery box. She drew rain sinking into gravel, water collecting above clay, and a well reaching into the wet layer. Mr. Vale had her add dotted lines and the words POSSIBLE PATHS.

            At the meeting, he suggested covered containers and a shared monthly trip to the county waste station. Mr. Rusk, the shop owner, folded his arms.
        - {id: ch04-b02, speaker: shop-owner, text: "You want me to lose a day's work."}
        - id: ch04-b03
          speaker: narrator
          text: Nora had prepared a fine speech about protecting the future. Then she saw the cracks in Mr. Rusk's hands and let the speech go.
        - {id: ch04-b04, speaker: child, text: "Could the hardware truck carry the containers when it goes to the county? It comes back empty on Thursdays."}
        - {id: ch04-b05, speaker: narrator, text: "The driver thought it over."}
        - {id: ch04-b06, speaker: hardware-driver, text: "If they're sealed, and somebody helps load."}
        - {id: ch04-b07, speaker: shop-owner, text: "And what if the tests say the water goes somewhere else?"}
        - {id: ch04-b08, speaker: well-keeper, text: "Then we'll know more than we know now."}
        - id: ch04-b09
          speaker: narrator
          text: |-
            They moved the leaking drums that afternoon. It was unpleasant work. Adults handled the stained ground. Nora and three friends cleared clean trash from the upper slope and dug shallow, grass-lined dips to slow water rushing off the bare track. Nobody cut a ribbon. One drum split when they lifted it, and everyone had to stop and find another tray.

            Two days later, a county hydrologist measured water levels, studied the slope, and sampled the seep and the well. Nora followed her with the poster under one arm.
        - {id: ch04-b10, speaker: child, text: "Did I draw it right?"}
        - {id: ch04-b11, speaker: hydrologist, text: "You drew one reasonable idea. Real groundwater moves through a patchwork of pores and cracks. We need measurements before we know which ground supplies this well."}
        - id: ch04-b12
          speaker: narrator
          text: |-
            The hydrologist explained recharge: some rain ran to the creek, some went back into the air or into plants, and some might travel down to groundwater. A storm that night could take time to reach the well. It might barely affect it at all.

            That evening, the wind changed. Leaves showed their pale undersides, and Nora smelled rain before she felt it.
    - id: ch05
      title: The Patient Column
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            The storm broke after midnight. Water hammered the roof and raced through the gutters. Nora pulled on her boots and found Mr. Vale at the well in a yellow raincoat. They walked up the road, staying clear of the flooded ditch. At the shed, the new containers were closed beneath a metal roof. Rain spread through the grassy dips instead of cutting one muddy channel toward the gravel.

            Back at the well, Nora reached for the measuring tape.
        - {id: ch05-b02, speaker: child, text: "Will it be full?"}
        - {id: ch05-b03, speaker: well-keeper, text: "No promises."}
        - id: ch05-b04
          speaker: narrator
          text: |-
            She lowered the probe. Rain tapped her hood, ran down her wrists, and darkened the stone rim. Far below, the buzzer sounded. Mr. Vale held the flashlight while Nora read the mark and wrote it beside the night's date.

            The number was almost the same as yesterday's. Nora looked from the rain pouring over the village to that patient column in the notebook. Then she turned the page and made a place for tomorrow.

            The next morning, the number had hardly moved. A few people sighed as if the storm had broken a promise. Nora closed the notebook before anyone could turn one measurement into an answer.

            At home, the drought kept records of its own. Her mother saved bean-rinsing water for the tomatoes. When Nora called all this careful measuring a challenge, her mother set down the cup.
        - {id: ch05-b05, speaker: mother, text: "A challenge ends when somebody wins. This is work, and it's costing us."}
        - id: ch05-b06
          speaker: narrator
          text: |-
            The family sold pickled beans at the Saturday market, and less water meant fewer jars. That week, Mrs. Bell needed half a can for her baby goats. Nora's mother gave it to her. Later, Nora found her staring at six empty pantry jars. The well level wasn't just a neat column of figures anymore. It had walked right into the kitchen and the ledger.

            Mr. Rusk was losing money too. Until covered containers arrived, he stopped washing engine parts, and two customers took their pumps to the county. At the well, he tapped Nora's diagram.
        - {id: ch05-b07, speaker: shop-owner, text: "Will those dotted lines pay for the work I lost?", emotion: angry}
        - id: ch05-b08
          speaker: narrator
          text: Nora looked toward Mr. Vale. He kept working on the well cap and didn't rescue her.
        - {id: ch05-b09, speaker: child, text: "No. The hardware truck comes back empty on Thursday. I can ask which neighbors will help load."}
        - {id: ch05-b10, speaker: shop-owner, text: "And who finds containers before Thursday?"}
        - {id: ch05-b11, speaker: child, text: "I can ask the school custodian. I can't handle the wash water."}
        - id: ch05-b12
          speaker: narrator
          text: |-
            Nora visited seven houses. Two adults offered strong backs. The custodian found sound drums with fitted lids and called the county station. Nora's mother left heavy gloves by the door with a note: adults only. On Thursday, Mr. Rusk rolled the sealed containers up the truck ramp himself. Not one drop hit the gravel.

            The hydrologist returned with early sample results. There was no evidence that oil from the shed had reached the well. But one round of samples couldn't promise the well would always be safe, and the hill's part in supplying the aquifer was still uncertain. They still needed more measurements.

            Relief moved through the room. Someone immediately asked if the old drums could go back outside. Mr. Rusk answered first, pulling off his gloves.
        - {id: ch05-b13, speaker: shop-owner, text: "Why wait until oil comes out of the village tap? The new containers stay under the roof. I'll pay half the hauling cost. Anyone who adds waste pays part of the rest."}
    - id: ch06
      title: Half a Page Blank
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            The village didn't fence the whole hill. The hydrologist warned them not to invent a boundary before they understood the ground. They chose steps that made sense under several possible maps: remove leaking drums, keep oily water covered and away from the well, repair the eroded track, and plant local grass on clean bare soil to slow muddy runoff. Adults handled stained soil. Children picked up only clean litter.

            Nora had wanted one finished map. Now her notebook held solid lines for measured water levels, dashes for possible underground paths, and curves for storm water crossing the slope. The more honest the map became, the less it looked like one tidy answer.

            She and Mr. Vale measured at the same hour for ten days. On day eleven, the water stood a little higher. He measured twice, then handed her the tape. Their readings matched.
        - {id: ch06-b02, speaker: child, text: "Was it our storm?"}
        - {id: ch06-b03, speaker: well-keeper, text: "Maybe some of it. Maybe older water arrived by a slower route. One rise can't tell us."}
        - id: ch06-b04
          speaker: narrator
          text: |-
            Nora wrote the number without drawing an arrow back to the rain.

            Two gentler storms came before autumn. Grass bent and stood again. Most of the creek was still white stone, but the seep below the log widened by the width of Nora's thumb. She went back with Mr. Vale and Mr. Rusk. Mr. Rusk carried sample bottles in the bag where he usually kept wrenches.
        - {id: ch06-b05, speaker: shop-owner, text: "If you hadn't walked by that day, I would've thrown out the basin."}
        - {id: ch06-b06, speaker: well-keeper, text: "If we'd claimed we knew the whole hill, you wouldn't have believed us."}
        - {id: ch06-b07, speaker: shop-owner, text: "I still don't believe every dashed line."}
        - {id: ch06-b08, speaker: child, text: "Then help us measure."}
        - id: ch06-b09
          speaker: narrator
          text: |-
            Nora handed him a bottle.

            Water didn't pour from a secret tunnel. One grain of sand darkened, then another. A thin shine joined the spaces between the pebbles. Only then did enough water gather to enter the bottle.

            Nora remembered the bucket striking bottom. She'd imagined a buried room and wanted to catch whoever had emptied it. The well never gave her a secret river. It gave her smaller evidence: wet sand, a clay layer, a row of depths, a delayed rise, and water quietly appearing between stones.

            Before winter, the hydrologist combined the slope survey, water levels, and local sediment data. She marked an area for priority protection and more study. Its boundary crossed one corner behind the repair shop. Mr. Rusk moved his cleaning bench onto a roofed pad where spills could be caught. Nora couldn't lift the bench, so she gathered loose nuts and washers into a tin.

            The village kept measuring each month. Water limits stayed until wetter weather made it sensible to ease them. Nora sometimes forgot her pencil. Once, she copied the wrong date. Mr. Vale made her cross it out instead of fixing the record from memory.

            He kept his own mistakes too. After one storm, he guessed the seep would rise before the well. The well moved first. He circled his prediction and wrote, WRONG—KEEP IT.
        - {id: ch06-b10, speaker: child, text: "Why keep a wrong guess?"}
        - {id: ch06-b11, speaker: well-keeper, text: "So the next idea has to answer it."}
        - id: ch06-b12
          speaker: narrator
          text: |-
            By spring, the notebook wouldn't close flat. Receipts, sample labels, rain dates, and three maps bulged between its pages. The first map had one bold arrow. The newest had several faint possibilities and a lot of solid observations.

            After the first spring rain, Nora went to the well alone. She could lower the tape now without knocking it against the stones. Across the creek, rain from Mr. Rusk's roof ran into the grassy dips. New roots held the soil beside the repaired track. Under the fallen log, the seep stained the sand dark brown.

            Far below, the buzzer sounded.

            Nora pinched the tape, read the mark, and opened the red notebook. She wrote the depth beside the date. Then, before she guessed where that water had traveled, she left half the page blank.
