schema_version: 1
id: the-squirrel-who-counted-acorns
type: fiction
category: fiction
genre: animals
age_range: {min: 6, max: 9}
style: naturalistic-storybook
research: required
labels:
  topics: [animals, nature]
  themes: [discovery, adaptation]
  moods: [warm, reflective]
characters:
  - id: hazel
    description: A young eastern gray squirrel who tries to make uncertainty manageable by counting every cached acorn.
  - id: rook
    description: "An older American crow who watches closely, speaks dryly, and refuses to promise more than he knows."
locales:
  zh-CN:
    writer: 松果先生
    working_title: 数到春天的橡果
    length: "3000-4500 Chinese characters"
  en-US:
    writer: sage-paw
    working_title: The Acorns Hazel Could Not Count
    length: "2000-3000 words"
picture_book: {level: k}
cover_prompt: |-
  A wordless autumn woodland cover scene beneath a mature white oak: Hazel, a small young eastern gray squirrel with silver-gray fur, a warm russet wash along her back, a white belly, a broad bushy tail with a charcoal tip, and a small notch in her left ear, pauses with one acorn held between her forepaws beside several separate freshly covered cache spots in leaf litter. Rook, an older American crow with glossy black plumage, a faint blue sheen on the wings, and one pale gray feather at the throat, watches from a low oak branch. Show fallen amber leaves, ridged acorns, exposed roots, moss, and slanting late-afternoon light; hint at the coming seasons with one tiny oak seedling near the far edge without making it the main subject. Eye-level three-quarter view, spacious woodland depth, clear emotional focus on Hazel's concentration and the many scattered hiding places. No visible text, letters, numbers, symbols, tally marks, labels, signs, logos, captions, speech bubbles, signatures, or watermark.
