audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 像在火炉边讲故事，温和细腻，遇到险情自然收紧, timbre: 温暖清亮, pace: 舒缓而有呼吸感, pitch: 中}
    hazel:
      display_name: 榛榛
      tts: {delivery: 认真机灵，着急时语速变快，放松时爽快自然, timbre: 年轻明亮, pace: 中快, pitch: 中高}
    rook:
      display_name: 黑羽
      tts: {delivery: 话不多，干巴巴的幽默里藏着关心, timbre: 低沉微哑, pace: 从容, pitch: 中低}
  chapters:
    - id: ch01
      title: 一百颗以后
      blocks:
        - {id: ch01-b01, speaker: narrator, text: 第一颗橡果落下时，榛榛正倒挂在白橡树的细枝上。果子碰了碰树根，滚进两片红叶中间。她落到地上，抱起来掂了掂。很饱满，也很沉，壳上只擦出一道浅痕。}
        - {id: ch01-b02, speaker: hazel, text: 一。}
        - id: ch01-b03
          speaker: narrator
          text: |-
            树上又是一响。第二颗落进草里，第三颗、第四颗也跟着来了。风穿过树冠，整棵老橡树都抖起来，像抖开了一袋木珠子。

            去年冬天，榛榛吃够了找不到食物的苦。雪封住林地，她一连刨开三个洞，里面全是空的，最后只能啃发苦的老树皮。她忘不了那种饿，肚子里就像关着一只小兽，一直拿爪子挠门。所以今年，每收下一颗橡果，她都要数进去。

            第一颗埋在苔石北边，第二颗塞进倒木旁的软土，第三颗藏到蕨根下面。榛榛从不把食物堆在一起。林子里的眼睛多，会刨土的爪子也多。分开藏，一个地方被偷了，别处还有。
        - {id: ch01-b04, speaker: hazel, text: 七，八，九……}
        - {id: ch01-b05, speaker: narrator, text: 每藏好一颗，她就用后脚踩平泥土，心里的数也跟着加一。老鸦黑羽落在低枝上。他喉咙边有一根灰白羽毛，像一小片去年的雪。}
        - {id: ch01-b06, speaker: rook, text: 你再这么念，偷果子的连数都省了。}
        - {id: ch01-b07, speaker: narrator, text: 榛榛马上闭了嘴，朝四周看了一圈。}
        - {id: ch01-b08, speaker: hazel, text: 你到底听见了多少？}
        - {id: ch01-b09, speaker: rook, text: 从三十二到四十七。对了，四十一让你数了两次。}
        - {id: ch01-b10, speaker: hazel, text: 才没有。}
        - {id: ch01-b11, speaker: narrator, text: 黑羽把脑袋偏向一边。}
        - {id: ch01-b12, speaker: rook, text: 那就是风数的。}
        - id: ch01-b13
          speaker: narrator
          text: |-
            榛榛不再理他。她找来一块白色小石头，每藏十颗，就用爪尖在石边刻一道。傍晚，石头上已经有六道细痕。她对着痕迹数了一遍又一遍，越数越觉得，冬天已经被自己关在门外了。

            第二天，风凉了许多。她从山毛榉跑到溪沟，又从刺莓丛跑到枯树坡。她挖出一个个浅坑，放进橡果，再拨回落叶。有虫洞的当场吃掉，裂壳的也不藏。只有好果子才留得到雪天。

            黑羽有时从天上看她，有时落下来啄甲虫，从来不帮忙记数。榛榛第三次绕过同一根树桩时，他才开口。
        - {id: ch01-b14, speaker: rook, text: 看来你今天特别舍不得这根木头。}
        - {id: ch01-b15, speaker: hazel, text: 我在找第五十八颗埋在哪儿。}
        - {id: ch01-b16, speaker: rook, text: 你埋的时候没有风。现在这些叶子，早就全换过地方了。}
        - {id: ch01-b17, speaker: narrator, text: 榛榛扒开一块土，里面是空的。她赶紧盖回去，尾巴却把落叶扫得乱七八糟。肚子里那只小兽，仿佛又挠了一下门。她得做一张更靠得住的地图。}
    - id: ch02
      title: 一张会动的地图
      blocks:
        - {id: ch02-b01, speaker: narrator, text: 榛榛没有纸，也用不着纸。她把林子分成苔石这边、溪沟那边、倒木上边和荆棘后边。她在白石上添刻痕，在树皮上咬出小缺口，还用三根细枝搭成箭头，让尖头朝着刚藏好的橡果。}
        - {id: ch02-b02, speaker: hazel, text: 这回肯定丢不了。}
        - {id: ch02-b03, speaker: narrator, text: 黑羽飞到箭头旁。风一吹，最上面的细枝就滚了半圈。}
        - {id: ch02-b04, speaker: rook, text: 什么丢不了？}
        - {id: ch02-b05, speaker: narrator, text: 榛榛赶紧把细枝放回原位。}
        - {id: ch02-b06, speaker: hazel, text: 我做的记号。}
        - id: ch02-b07
          speaker: narrator
          text: |-
            第三天夜里下了雨。雨水顺坡流，把浅坑拍实，也在白石的泥上冲出细沟。刺莓丛下，一只田鼠搬走两颗橡果。倒木旁，一只陌生松鼠挖出一颗，吃掉一半，又把剩下的埋到了远处。

            天刚亮，榛榛就冲出巢洞。枝条箭头散了。树皮缺口还在，树下却盖着厚厚的黄叶。白石上的刻痕有深有浅，多出一条水痕，还缺了一个小角。她数了又数。
        - {id: ch02-b08, speaker: hazel, text: 六，七……等等，这条是雨冲的，不能算。那就是八？可这两条以前会不会是一条？}
        - {id: ch02-b09, speaker: rook, text: 你要是在问石头，它今天好像不想开口。}
        - {id: ch02-b10, speaker: hazel, text: 我原来有九十颗，也许是九十一颗。可现在，我连这个都不知道了。}
        - {id: ch02-b11, speaker: rook, text: 可你还知道饿了该去哪里找。}
        - {id: ch02-b12, speaker: hazel, text: 但我不知道每个地方到底有几颗！, emotion: angry}
        - {id: ch02-b13, speaker: narrator, text: 黑羽啄了啄湿叶下面露出的橡果帽。}
        - {id: ch02-b14, speaker: rook, text: 到了冬天，能找到吃的就行。冬天又不会考你一共有几颗。}
        - {id: ch02-b15, speaker: narrator, text: 榛榛听完更生气了。黑羽说得好像有一点道理，可她丢掉的数还是没回来。她想把白石叼回树洞，才走三步，石头就掉下来砸中脚趾。}
        - {id: ch02-b16, speaker: hazel, text: 不准笑。, emotion: angry}
        - id: ch02-b17
          speaker: narrator
          text: |-
            黑羽把喙藏进翅膀，两边肩膀却抖了两下。

            从那以后，榛榛还是分散埋果，却不再每颗都回去做记号。她记粗大的树根、裂开的灰岩和长着三簇苔藓的树桩。她贴着地面闻，也用爪子分辨泥土是刚翻过的还是旧的。脑子里的数偶尔溜走，她就从最后记得的地方接上。有时接错，有时干脆不接。

            一天下午，鹰影掠过林地。榛榛叼着橡果，来不及逃回熟悉的树根，只好钻进矮灌木。她飞快挖坑、埋果、压土，再顺着石缝逃回树上。

            危险过去，她站在枝头向下望。风把灌木叶一簇簇翻过来，露出的全是银白背面。她知道橡果就在下面，却说不出埋在哪一簇。
        - {id: ch02-b18, speaker: hazel, text: 一百零三。}
        - {id: ch02-b19, speaker: narrator, text: 她小声说完，停了一阵。}
        - {id: ch02-b20, speaker: hazel, text: 也可能……是一百零二。}
        - {id: ch02-b21, speaker: narrator, text: 这次黑羽没有开玩笑。他望向远处越来越暗的云。}
        - {id: ch02-b22, speaker: rook, text: 先回窝吧。}
    - id: ch03
      title: 雪下的洞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            第一场雪很薄，只在枯叶边上描了一圈白。榛榛很快找到苔石旁的橡果。她刨开松土，咬破硬壳。油润的果仁一入口，暖意便从舌根一直到了胸口。

            第二场雪盖住低草。她从倒木旁找回两颗，又从蕨根下找到一颗。她也会找错。有的坑只留下田鼠的小脚印，有的地方刨了很久，最后却只有一块圆石头。不过，找回来的还是更多。

            到了深冬，雪面冻出硬壳，树枝稍微一碰，就响得像轻轻碎开的玻璃。一天早上，树洞里只剩几片啃干净的果壳。榛榛跑到白石旁，挖得鼻尖都是雪，却一颗也没找到。
        - {id: ch03-b02, speaker: hazel, text: 不是这里。}
        - {id: ch03-b03, speaker: narrator, text: 榛榛喘着气。黑羽缩成一团，蹲在上方的树枝上。}
        - {id: ch03-b04, speaker: rook, text: 你还记得别的地方。}
        - {id: ch03-b05, speaker: narrator, text: 榛榛记得裂开的灰岩，可岩缝冻住了。她也记得长着三簇苔藓的树桩，可苔藓被雪盖严了。她跑向溪沟，又停下来转去枯树坡。每个地方都像见过，又像从没来过。忽然，她想起鹰影、矮灌木、石缝，还有被风翻出银白背面的叶子。那里有一颗她没能数准的橡果。}
        - {id: ch03-b06, speaker: hazel, text: 那边。}
        - {id: ch03-b07, speaker: narrator, text: 雪把灌木压得很低。榛榛挖过第一簇和第二簇，只碰到冻硬的根。到了第三簇，爪尖终于碰到果壳。那颗橡果还在，旁边居然还有一颗。也许也是她藏的，也许是别的松鼠埋的。她没法知道，只把一颗推给黑羽。}
        - {id: ch03-b08, speaker: rook, text: 乌鸦过冬可不靠橡果。}
        - {id: ch03-b09, speaker: hazel, text: 可你一路上没少提醒我。}
        - {id: ch03-b10, speaker: rook, text: 提醒几句，不值半颗橡果。}
        - {id: ch03-b11, speaker: hazel, text: 那你还欠我半颗呢。}
        - id: ch03-b12
          speaker: narrator
          text: |-
            黑羽叼起橡果，啄开一个口。他们蹲在雪压低的灌木下，把果仁分着吃了。头顶的风依旧冷，榛榛肚子里那只挠门的小兽，却安静下来。

            冬天没有因为她数错就放过她，也没有因为她认真计数就特意为难她。她每天出去找，靠记忆，也靠气味、树根和偶尔露出的叶角。有些存粮被别的动物拿走了，有些连她自己也再没找到。不过，小坑分散在林子里，这一处空了，还可以去下一处。

            雪最深的那个星期，她不再计算还剩多少颗。并不是不在乎。只是每找回一颗，她会先让自己吃饱，再记住下一次该往哪里走。
    - id: ch04
      title: 没有找回来的
      blocks:
        - {id: ch04-b01, speaker: narrator, text: 春水在冰下响起来时，榛榛瘦了一圈，尾巴却还是蓬松的。她找到半颗发黑的橡果，嫌弃地推开，又在苔石旁找到秋天刻过的白石。雨雪磨平了几道痕迹，剩下的互相交叉，怎么数都不可信。石头下面也没有橡果，只有一条受惊的蚯蚓往土里缩。}
        - {id: ch04-b02, speaker: rook, text: 要不，你从头数一数春芽？}
        - {id: ch04-b03, speaker: hazel, text: 不数。}
        - id: ch04-b04
          speaker: narrator
          text: |-
            她答得太快，自己反倒先笑了。

            几天后，榛榛穿过枯树坡，闻见湿泥和新叶的气味。倒木外冒出一根弯弯的浅绿芽，顶端还扣着裂开的棕壳。那不是草。两片刚长出的叶子慢慢张开，像一双才从被窝里伸出来的手。

            她拨开旁边的叶子，找到第二株。溪沟上方有第三株。刺莓丛后还有两株挨在一起，其中一株歪向阳光。
        - {id: ch04-b05, speaker: hazel, text: 这些橡果是谁埋的？}
        - {id: ch04-b06, speaker: narrator, text: 黑羽从空中落下，看看小芽，又看看榛榛。}
        - {id: ch04-b07, speaker: rook, text: 林子里会埋橡果的，可不只有你。}
        - {id: ch04-b08, speaker: narrator, text: 榛榛认得倒木、灰岩和灌木后的石缝。可橡果裂开以后，根往下扎，芽往上长，她就认不出来了。也许有些是她忘记的，有些被别的动物搬过。有些会被吃掉，也可能熬不过干热的夏天。至少眼前这几株，已经活到了春光里。她碰了碰最近的嫩叶，又马上缩回爪子。叶子很软，细细的叶脉却已经清清楚楚。}
        - {id: ch04-b09, speaker: hazel, text: 它算谁的？}
        - {id: ch04-b10, speaker: rook, text: 你吃了，它就是午饭。你留下它，它就算它自己的。}
        - {id: ch04-b11, speaker: narrator, text: 榛榛瞪了黑羽一眼。这还是像句玩笑，也一样没有给她答案。那天下午，大风刮过林地。一根断枝落在最小的幼苗旁。榛榛已经跑过去了，听见叶片擦地的细响，又退回来。她咬住枝条末端，拖了三次，才让嫩芽旁边空出来。}
        - {id: ch04-b12, speaker: rook, text: 这到底算第一棵，还是第五棵？}
        - {id: ch04-b13, speaker: narrator, text: 榛榛坐在湿土上喘气。幼苗在风里晃了一下，没有倒。}
        - {id: ch04-b14, speaker: hazel, text: 这一棵。}
        - id: ch04-b15
          speaker: narrator
          text: |-
            入夏以前，林下长满高草。溪沟边的幼苗不见了，刺莓后的两株也只剩一株。倒木旁那株长出更多叶子，从嫩黄变成深绿。榛榛常从上面的枝路经过，有时赶走啃叶的毛虫，有时只看一眼。

            秋天又来时，老橡树再次落果。第一颗敲在树根上，滚进两片红叶中间，像去年那颗照着原路回来了。

            榛榛捡起果子掂了掂。它很饱满，也很沉，没有虫洞。她衔着它跑过苔石，没有停，跑过白石也没有停。她一直跑到离老树更远的一块松土上，挖坑放下橡果，再仔细盖好。
        - {id: ch04-b16, speaker: rook, text: 这回不数了？}
        - {id: ch04-b17, speaker: narrator, text: 榛榛用后脚踩平最后一小撮土。她看了看树根、石缝和被风翻动的叶子，又望向倒木旁那棵已经长到她胸口高的小橡树。}
        - {id: ch04-b18, speaker: hazel, text: 这一颗，我记得。}
        - {id: ch04-b19, speaker: narrator, text: 她说完，便跑回老橡树下，去接下一颗。}
