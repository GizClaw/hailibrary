required: true
notes: "The characters speak and Hazel counts as declared animal-story invention. Ecological behavior and seasonal causality follow the evidence below without claiming that real squirrels count this way or simply forget every unrecovered cache."
sources:
  - url: "https://www.nrs.fs.usda.gov/pubs/ch/ch08/chvolume08page299.pdf"
    authority: "United States Forest Service research archive; Mammal Caching of Oak Acorns in a Red Pine and a Mixed-Oak Stand; accessed 2026-09-14"
    claims:
      - "Some tree squirrels store individual acorns or small groups in numerous widely scattered caches."
      - "Burial and distribution away from a parent tree can benefit oak regeneration."
  - url: "https://research.fs.usda.gov/feis/species-reviews/quekel"
    authority: "United States Forest Service Fire Effects Information System; Quercus kelloggii, California black oak; accessed 2026-09-14"
    claims:
      - "Squirrels are important acorn cachers and dispersers that move and bury acorns away from parent trees."
      - "Some buried acorns can germinate when conditions are favorable."
  - url: "https://doi.org/10.3389/fevo.2020.00259"
    authority: "Frontiers in Ecology and Evolution peer-reviewed review; Squirrel-Seed Interactions; accessed 2026-09-14"
    claims:
      - "Scatter-hoarding decisions affect seed dispersal and establishment across oak systems."
      - "Not every cached acorn is recovered or survives to grow."
  - url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2830248/"
    authority: "Philosophical Transactions of the Royal Society B review; The history of scatter hoarding studies; accessed 2026-09-14"
    claims:
      - "Scatter-hoarders use spatial memory and other cues to recover many caches."
      - "Pilferage and unrecovered buried seeds are among the possible outcomes of caching."
  - url: "https://www.nps.gov/para/learn/nature/oak-trees.htm"
    authority: "U.S. National Park Service; Oak Trees; accessed 2026-09-14"
    claims:
      - "Some cached acorns left in soil can sprout when weather warms."
