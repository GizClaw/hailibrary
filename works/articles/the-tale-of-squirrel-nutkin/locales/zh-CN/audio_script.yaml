audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 俏皮而细致的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓有变化
        pitch: 中音
    nutkin:
      display_name: 坚果金
      tts:
        delivery: 伶俐顽皮，满是恶作剧的劲头
        timbre: 明亮活泼
        pace: 轻快
        pitch: 高音
    twinkleberry:
      display_name: 闪莓
      tts:
        delivery: 客气诚恳
        timbre: 轻柔温和
        pace: 适中
        pitch: 中高音
    cousin_one:
      display_name: 松鼠表亲一
      tts:
        delivery: 谦恭真诚
        timbre: 柔和稚嫩
        pace: 适中
        pitch: 中高音
    cousin_two:
      display_name: 松鼠表亲二
      tts:
        delivery: 尊重而清楚
        timbre: 轻盈稚嫩
        pace: 适中
        pitch: 中音
    cousin_three:
      display_name: 松鼠表亲三
      tts:
        delivery: 温和有礼
        timbre: 清澈稚嫩
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这个故事讲的是一条尾巴。它长在一只名叫坚果金的小红松鼠身上。坚果金有个哥哥叫闪莓，还有好多表兄弟姐妹。他们都住在湖边的树林里。
        - id: ch01-b02
          speaker: narrator
          text: 湖中央有座小岛，岛上到处是树和坚果灌木。树丛里有一棵空心老橡树，猫头鹰老布朗就住在那里。
        - id: ch01-b03
          speaker: narrator
          text: 秋天到了，坚果成熟，榛树叶有的金黄，有的碧绿。坚果金、闪莓和所有小松鼠来到湖边，用细树枝扎成木筏，划向猫头鹰岛去采坚果。
        - id: ch01-b04
          speaker: narrator
          text: 每只松鼠都背着小口袋，拿着大桨，还把尾巴张开当船帆。他们带来三只肥老鼠送给老布朗，把礼物放在门阶上。
        - id: ch01-b05
          speakers: [twinkleberry, cousin_one, cousin_two, cousin_three]
          ensemble: chorus
          text: 布朗老先生，请您开恩，让我们在岛上采些坚果吧？
        - id: ch01-b06
          speaker: narrator
          text: 小松鼠们说完，恭恭敬敬地鞠了躬。只有坚果金无礼得很。他像颗小红樱桃，上上下下蹦个不停。
        - id: ch01-b07
          speaker: nutkin
          text: 猜一猜，猜一猜，咚哒咚哒响！小小人儿个头矮，红红外套穿身上！手里握根杖，喉咙含块石。若能把谜底猜出来，一枚银币送给你。
        - id: ch01-b08
          speaker: narrator
          text: 这谜语古老得像山一样。老布朗理都不理，固执地闭上眼睛睡觉。松鼠们装满一袋袋坚果，傍晚才乘筏回家。
    - id: ch02
      title: 第二天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，松鼠们又来到岛上。闪莓和表亲们带来一只肥鼹鼠，放到老布朗门前的石头上。
        - id: ch02-b02
          speakers: [twinkleberry, cousin_one, cousin_two, cousin_three]
          ensemble: chorus
          text: 布朗先生，请您大发慈悲，让我们再采些坚果，好吗？
        - id: ch02-b03
          speaker: narrator
          text: 坚果金却根本不懂得尊重。他拿荨麻去挠老布朗，还在旁边蹦来蹦去。
        - id: ch02-b04
          speaker: nutkin
          text: 布朗老先生！谜儿猜一猜！希蒂皮蒂墙里待，希蒂皮蒂墙外待。谁敢碰那希蒂皮蒂，希蒂皮蒂一口咬过来！
        - id: ch02-b05
          speaker: narrator
          text: 老布朗猛地醒了，把鼹鼠拎回家，又当着坚果金的面关上门。过了一会儿，一缕柴火的蓝烟从树顶升起来。坚果金凑到钥匙孔上往里瞧。
        - id: ch02-b06
          speaker: nutkin
          text: 满满一屋，满满一窟！你却盛不满一只碗哟！
        - id: ch02-b07
          speaker: narrator
          text: 其他松鼠找遍小岛，口袋里全装满了坚果。坚果金只顾捡黄红相间的栎瘿。他坐在山毛榉树桩上，拿栎瘿玩弹珠，眼睛一直盯着老布朗的门。
    - id: ch03
      title: 第三天
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第三天一大早，松鼠们就起床捕鱼。他们捉到七条肥米诺鱼，要把鱼送给老布朗。他们划过湖，在岛上一棵歪栗树下上了岸。
        - id: ch03-b02
          speaker: narrator
          text: 闪莓和另外六只松鼠，每只都扛着一条鱼。没礼貌的坚果金什么也没带，只管抢在最前面唱歌。
        - id: ch03-b03
          speaker: nutkin
          text: 荒野里的人问我说：“海里能长多少草莓果？”我想怎么答，就怎么答他：“林中长多少红鲱鱼，海里就长多少草莓果。”
        - id: ch03-b04
          speaker: narrator
          text: 老布朗不爱听谜语。就算坚果金把答案也一并说了，他还是毫无兴趣。
    - id: ch04
      title: 第四天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第四天，松鼠们送来六只肥甲虫。老布朗吃起来，会觉得它们像葡萄干布丁里的李子一样好。每只甲虫都用酸模叶仔细包住，再拿松针别好。
        - id: ch04-b02
          speaker: narrator
          text: 坚果金还是那么无礼，又对着老布朗唱起来。
        - id: ch04-b03
          speaker: nutkin
          text: 布朗老先生！谜儿猜一猜！英格兰的粉，西班牙的果，一场雨里碰一块。装进口袋，细绳扎起来。若能把谜底猜出来，一枚戒指送给你！
        - id: ch04-b04
          speaker: narrator
          text: 这话真可笑，因为坚果金哪有什么戒指送给老布朗。别的松鼠在坚果灌木里四处寻找，他却从荆棘上摘下像知更鸟针垫的蔷薇瘿，再往上面插满松针。
    - id: ch05
      title: 第五天
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第五天，松鼠们带来野蜂蜜。蜂蜜甜得发黏，他们把它放到石头上时，都舔起了手指。这是他们从山尖尖的大黄蜂窝里偷来的。
        - id: ch05-b02
          speaker: narrator
          text: 坚果金在一旁跳个不停，嘴里的歌也没停。
        - id: ch05-b03
          speaker: nutkin
          text: 嗡啊嗡！嗡嗡！嗡啊嗡嗡！我翻过了蒂普尔藤，碰见一群漂亮猪。有的脖子黄，有的背儿黄！翻过蒂普尔藤的猪，数它们最最漂亮！
        - id: ch05-b04
          speaker: narrator
          text: 老布朗嫌坚果金太无礼，厌恶地翻了翻眼睛。可那份蜂蜜，他倒一口不剩地吃光了！
        - id: ch05-b05
          speaker: narrator
          text: 松鼠们装满了坚果。坚果金却坐在一块宽阔的平石头上，拿野苹果和绿色冷杉球果玩九柱戏。
    - id: ch06
      title: 第六天
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第六天是星期六。松鼠们最后一次上岛，带着一枚刚下的蛋。蛋装在小小的灯心草篮里，是他们送给老布朗的临别礼物。
        - id: ch06-b02
          speaker: narrator
          text: 坚果金笑着跑到最前面，大声喊了起来。
        - id: ch06-b03
          speaker: nutkin
          text: 矮胖墩儿躺溪边，白白被单围颈间。四十医生四十匠，也叫矮胖墩儿难复原！
        - id: ch06-b04
          speaker: narrator
          text: 老布朗这次对蛋有了兴趣。他睁开一只眼，又把眼睛闭上，一句话也没说。坚果金见了，反倒越来越放肆。
        - id: ch06-b05
          speaker: nutkin
          text: 布朗老先生！布朗老先生！希卡莫，哈卡莫，趴在国王厨房门上。国王的骏马全赶来，国王的士兵全赶来，也赶不走希卡莫，也赶不走哈卡莫。他们牢牢趴在国王厨房门上。
        - id: ch06-b06
          speaker: narrator
          text: 坚果金像一束阳光，蹦上蹦下。老布朗依旧一声不出。于是，坚果金又开了口。
        - id: ch06-b07
          speaker: nutkin
          text: 阿瑟·奥鲍尔挣断了绳索，一路怒吼冲过原野！苏格兰国王倾尽全力，也拦不住鲍尔家的阿瑟！
        - id: ch06-b08
          speaker: narrator
          text: 坚果金呼呼叫着，学出风的声音。他助跑几步，一下跳到老布朗的头顶！紧接着，翅膀乱扑，爪子乱抓，中间还爆出一声尖厉的“吱！”
        - id: ch06-b09
          speaker: narrator
          text: 其他松鼠飞快蹿进灌木丛。过了会儿，他们才小心地回来，从树后偷偷探头。老布朗正安安静静坐在门阶上，眼睛紧闭，好像什么也没发生。
        - id: ch06-b10
          speaker: narrator
          text: 可是，坚果金就在他的背心口袋里！
        - id: ch06-b11
          speaker: narrator
          text: 故事好像已经结束了。其实，还没有。
        - id: ch06-b12
          speaker: narrator
          text: 老布朗把坚果金带进屋，揪住尾巴提起来，想剥掉他的皮。坚果金拼命挣扎，尾巴断成了两截。他赶紧冲上楼梯，从阁楼窗户逃走了。
        - id: ch06-b13
          speaker: narrator
          text: 直到今天，要是你在树上碰见坚果金，再问他一个谜语，他准会朝你扔树枝，跺着脚骂你，最后扯开嗓子大叫。
        - id: ch06-b14
          speaker: nutkin
          text: 咕——咕——咕——咕噜噜——咕——咕咕！
          emotion: angry
