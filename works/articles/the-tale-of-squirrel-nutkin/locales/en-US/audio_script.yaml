audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and observant storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    nutkin:
      display_name: Nutkin
      tts:
        delivery: quick, cheeky, and full of mischief
        timbre: bright and lively
        pace: brisk
        pitch: high
    twinkleberry:
      display_name: Twinkleberry
      tts:
        delivery: polite and earnest
        timbre: light and gentle
        pace: moderate
        pitch: medium-high
    cousin_one:
      display_name: First Cousin
      tts:
        delivery: courteous and sincere
        timbre: soft and youthful
        pace: moderate
        pitch: medium-high
    cousin_two:
      display_name: Second Cousin
      tts:
        delivery: respectful and clear
        timbre: light and youthful
        pace: moderate
        pitch: medium
    cousin_three:
      display_name: Third Cousin
      tts:
        delivery: gentle and well-mannered
        timbre: clear and youthful
        pace: moderate
        pitch: medium-high
  chapters:
    - id: ch01
      title: The First Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: This is a tale about a tail. The tail belonged to a little red squirrel named Nutkin. Nutkin had a brother called Twinkleberry and ever so many cousins. They all lived in a wood beside a lake.
        - id: ch01-b02
          speaker: narrator
          text: In the middle of that lake was an island thick with trees and nut bushes. Among them stood a hollow oak. It was the home of an owl called Old Brown.
        - id: ch01-b03
          speaker: narrator
          text: One autumn, the nuts ripened and the hazel leaves turned gold and green. Nutkin, Twinkleberry, and all the other little squirrels came out of the wood and hurried down to the water. They built tiny rafts from twigs and paddled across to Owl Island to gather nuts. Each squirrel carried a little sack and a big oar, with his tail spread wide for a sail.
        - id: ch01-b04
          speaker: narrator
          text: The squirrels brought three fat mice as a present for Old Brown. They laid the mice on his doorstep. Then Twinkleberry and the cousins bowed low.
        - id: ch01-b05
          speakers: [twinkleberry, cousin_one, cousin_two, cousin_three]
          ensemble: chorus
          text: Mr. Brown, would you please allow us to gather nuts on your island?
        - id: ch01-b06
          speaker: narrator
          text: Nutkin had no such manners. He bobbed up and down like a little red cherry and sang to the owl.
        - id: ch01-b07
          speaker: nutkin
          text: "Riddle me, riddle me, rot-tot-tote! A little wee man in a red, red coat! A staff in his hand and a stone in his throat. Tell me the answer, and I'll give you a groat!"
        - id: ch01-b08
          speaker: narrator
          text: That riddle was as old as the hills. Old Brown paid no attention to Nutkin at all. He stubbornly closed his eyes and went to sleep. The squirrels filled their little sacks with nuts, then sailed home in the evening.
    - id: ch02
      title: The Second Day
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, all the squirrels returned to Owl Island. This time, Twinkleberry and the others brought Old Brown a fine fat mole. They set it on the stone outside his doorway.
        - id: ch02-b02
          speakers: [twinkleberry, cousin_one, cousin_two, cousin_three]
          ensemble: chorus
          text: Mr. Brown, would you kindly let us gather some more nuts?
        - id: ch02-b03
          speaker: narrator
          text: Nutkin still showed no respect. He danced up and down, tickled Old Brown with a nettle, and began another song.
        - id: ch02-b04
          speaker: nutkin
          text: "Old Mr. B, riddle-me-ree! Hitty Pitty inside the wall, Hitty Pitty outside the wall. If you touch Hitty Pitty, then Hitty Pitty will bite you!"
        - id: ch02-b05
          speaker: narrator
          text: Old Brown woke with a start. He carried the mole into his house and shut the door right in Nutkin's face. Before long, a thin thread of blue smoke rose from the top of the hollow tree. Nutkin peeped through the keyhole and sang again.
        - id: ch02-b06
          speaker: nutkin
          text: "A house full, a hole full, but you cannot gather a bowlful!"
        - id: ch02-b07
          speaker: narrator
          text: The squirrels searched the whole island and filled their sacks with nuts. Nutkin did something else. He gathered yellow and scarlet oak apples, sat on a beech stump, and played marbles while he watched Old Brown's door.
    - id: ch03
      title: The Third Day
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the third day, the squirrels rose very early and went fishing. They caught seven fat minnows for Old Brown. Then they paddled across the lake and came ashore beneath a crooked chestnut tree on Owl Island.
        - id: ch03-b02
          speaker: narrator
          text: Twinkleberry and six of the other little squirrels each carried one minnow. Nutkin brought no present at all. He ran ahead of everyone, singing as he went.
        - id: ch03-b03
          speaker: nutkin
          text: "The man in the wilderness said to me, 'How many strawberries grow in the sea?' And this was the answer I gave him then. 'As many red herrings as grow in the woods!'"
        - id: ch03-b04
          speaker: narrator
          text: Old Brown was not interested in riddles, even when Nutkin gave him the answer.
    - id: ch04
      title: The Fourth Day
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the fourth day, the squirrels brought six fat beetles. To Old Brown, they were as tasty as the plums in a plum pudding. Each beetle had been carefully wrapped in a dock leaf and fastened with a pine needle for a pin.
        - id: ch04-b02
          speaker: narrator
          text: But Nutkin was just as rude as before. Once again, he sang at the owl.
        - id: ch04-b03
          speaker: nutkin
          text: "Old Mr. B, riddle-me-ree! Flour from England, fruit from Spain, met together in a shower of rain. Put in a bag and tied with string. Tell me the answer, and I'll give you a ring!"
        - id: ch04-b04
          speaker: narrator
          text: That was a ridiculous promise, because Nutkin did not have any ring to give Old Brown. While the other squirrels hunted through the nut bushes, Nutkin picked robin's pincushions from a briar and stuck them full of pine-needle pins.
    - id: ch05
      title: The Fifth Day
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the fifth day, the squirrels brought wild honey. It was so sweet and sticky that they licked their fingers as they placed it on the stone. They had stolen it from a bumblebees' nest at the tippity-top of the hill.
        - id: ch05-b02
          speaker: narrator
          text: Nutkin skipped up and down and sang a buzzing song.
        - id: ch05-b03
          speaker: nutkin
          text: "Hum-a-bum! Buzz, buzz! Hum-a-bum, buzz! As I went over Tipple-tine, I met a flock of bonny swine. Some yellow-necked and some yellow-backed! They were the bonniest swine that ever went over Tipple-tine."
        - id: ch05-b04
          speaker: narrator
          text: Old Brown rolled his eyes at Nutkin's rude behavior. But he ate every bit of the honey.
        - id: ch05-b05
          speaker: narrator
          text: The squirrels filled their little sacks with nuts. Nutkin sat on a broad, flat rock instead. He used a crab apple and green fir cones to play ninepins.
    - id: ch06
      title: The Sixth Day
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The sixth day was Saturday, and the squirrels came back for the last time. For their parting present, they carried a newly laid egg in a little basket woven from rushes.
        - id: ch06-b02
          speaker: narrator
          text: Nutkin ran ahead, laughing and shouting.
        - id: ch06-b03
          speaker: nutkin
          text: "Humpty Dumpty lies in the brook, with a white bedspread around his neck. Forty doctors and forty builders cannot put Humpty Dumpty right!"
        - id: ch06-b04
          speaker: narrator
          text: Now, eggs did interest Old Brown. He opened one eye, then closed it again. Still, he did not say a word. Nutkin grew ruder and ruder.
        - id: ch06-b05
          speaker: nutkin
          text: "Old Mr. B! Old Mr. B! Hickamore, Hackamore, on the King's kitchen door! All the King's horses and all the King's men couldn't drive Hickamore, Hackamore, away from the King's kitchen door!"
        - id: ch06-b06
          speaker: narrator
          text: Nutkin danced up and down like a sunbeam. Old Brown said nothing at all. So Nutkin began once more.
        - id: ch06-b07
          speaker: nutkin
          text: "Arthur O'Bower has broken his band. He comes roaring over the land! The King of Scots, with all his power, cannot turn Arthur of the Bower!"
        - id: ch06-b08
          speaker: narrator
          text: Nutkin made a whirring sound like the wind. Then he took a running leap and landed right on Old Brown's head.
        - id: ch06-b09
          speaker: narrator
          text: All at once, there came a great flutter and scuffle, followed by one loud squeak. The other squirrels scampered into the bushes.
        - id: ch06-b10
          speaker: narrator
          text: After a while, they crept back very carefully and peeked around the tree. Old Brown sat perfectly still on his doorstep. His eyes were closed, as though nothing had happened.
        - id: ch06-b11
          speaker: narrator
          text: But Nutkin was inside Old Brown's waistcoat pocket!
        - id: ch06-b12
          speaker: narrator
          text: That may sound like the end of the story, but it is not. Old Brown carried Nutkin into his house and held him up by the tail. He meant to skin him. Nutkin pulled so hard that his tail broke in two. Then he raced up the stairs and escaped through the attic window.
        - id: ch06-b13
          speaker: narrator
          text: Even now, if you meet Nutkin in a tree and ask him a riddle, he will throw sticks at you. He will stamp his feet, scold you, and shout.
        - id: ch06-b14
          speaker: nutkin
          text: Cuck-cuck-cuck-cur-r-r-cuck-k-k!
