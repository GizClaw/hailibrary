cover_prompt: |-
  A wordless cover scene on an autumn lake in England shows Squirrel Nutkin and his companions crossing to Owl Island. Nutkin is a slim red squirrel with a bright russet coat, tufted ears, lively dark eyes, and no clothing, balancing at the bow of a tiny raft made from twigs. Several other red squirrels carry baskets of nuts, while Old Brown, a large tawny owl with mottled feathers and solemn amber eyes, watches calmly from a hollow oak. Nutkin lifts a ripe red apple as an offering toward the owl, making the bold greeting the focal action. Use a low water-level three-quarter view with the raft entering the island reeds and generous misty sky above the oak branches. Keep animal anatomy natural, expressions restrained, the mood playful and non-frightening, and every design independent of later adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
