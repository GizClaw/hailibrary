audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful folk storyteller with an easy sense of rhythm
        timbre: warm and clear
        pace: lively but unhurried
        pitch: medium
    huntsman_1:
      display_name: First Huntsman
      tts:
        delivery: confident and eager, always ready with an opinion
        timbre: bright and sturdy
        pace: brisk
        pitch: medium
    huntsman_2:
      display_name: Second Huntsman
      tts:
        delivery: cheerfully contrary with dry comic certainty
        timbre: round and resonant
        pace: measured
        pitch: medium-low
    huntsman_3:
      display_name: Third Huntsman
      tts:
        delivery: good-humored and energetic, joining the fun with gusto
        timbre: light and open
        pace: buoyant
        pitch: medium-high
  chapters:
    - id: ch01
      title: Off to the Hunt
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Three jovial huntsmen once set off to hunt. They hunted and hollered, and they blew their horns as they went.
        - id: ch01-b02
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch01-b03
          speaker: huntsman_1
          text: Keep your eyes sharp and your noses pointed straight into the wind. By sight or scent, we'll find something worth hunting.
        - id: ch01-b04
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch01-b05
          speaker: narrator
          text: On they went, hunting and hollering. The first thing they came upon was a ragged boggart in a field. They left it right where it was.
        - id: ch01-b06
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch01-b07
          speaker: huntsman_1
          text: That's a boggart.
        - id: ch01-b08
          speaker: huntsman_2
          text: No, it isn't. That's only a gentleman farmer who's lost his way.
        - id: ch01-b09
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
    - id: ch02
      title: A Stone and a Calf
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They hunted on, calling out as they went. Next they found a grindstone, grunting and grinding away. That, too, they left behind.
        - id: ch02-b02
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch02-b03
          speaker: huntsman_1
          text: Why, that's a grindstone.
        - id: ch02-b04
          speaker: huntsman_2
          text: Not at all. It's nothing but an old, hardened cheese that somebody rolled away.
        - id: ch02-b05
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch02-b06
          speaker: narrator
          text: Still they hunted and hollered. Soon they spotted a bull calf inside a pen. They passed it by as well.
        - id: ch02-b07
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch02-b08
          speaker: huntsman_1
          text: That's a bull calf.
        - id: ch02-b09
          speaker: huntsman_2
          text: No, no. It's a painted donkey that never learned how to bray.
        - id: ch02-b10
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
    - id: ch03
      title: Children and a Pig
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The three kept hunting and hollering. Then they saw two or three children coming out of school. The huntsmen left them behind.
        - id: ch03-b02
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch03-b03
          speaker: huntsman_1
          text: Those are children.
        - id: ch03-b04
          speaker: huntsman_2
          text: No, they're little angels. We should leave them to their games.
        - id: ch03-b05
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch03-b06
          speaker: narrator
          text: Away they went, hunting and hollering again. The next thing they found was a fat pig smiling in a ditch. They left that behind, too.
        - id: ch03-b07
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch03-b08
          speaker: huntsman_1
          text: That's a fat pig.
        - id: ch03-b09
          speaker: huntsman_2
          text: Nonsense. That's a London alderman whose clothes have been stolen.
        - id: ch03-b10
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
    - id: ch04
      title: A Rattling Good Day
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: They kept hunting and hollering. Next they came upon two young lovers in a lane. The huntsmen left them there.
        - id: ch04-b02
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch04-b03
          speaker: huntsman_1
          text: Those two are lovers.
        - id: ch04-b04
          speaker: huntsman_2
          text: No, they're a pair of poor, wandering lunatics. Come on. We'd better go.
        - id: ch04-b05
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch04-b06
          speaker: narrator
          text: So the three of them hunted and hollered until the sun went down. When the hunting day was over, they had nothing at all to carry home.
        - id: ch04-b07
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
        - id: ch04-b08
          speaker: narrator
          text: Then one huntsman turned to the others.
        - id: ch04-b09
          speaker: huntsman_1
          text: Hunting doesn't pay. Still, we've tramped up and down a bit, and we've had a rattling good day.
        - id: ch04-b10
          speakers: [huntsman_1, huntsman_2, huntsman_3]
          ensemble: chorus
          text: Look over there!
