audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 像吟唱老歌谣一样诙谐从容，反复句轻快有力
        timbre: 温暖明亮，带一点乡野故事的粗朴感
        pace: 舒展而富有节拍
        pitch: 中音
    huntsman_1:
      display_name: 猎人甲
      tts:
        delivery: 认真直率，看到什么就笃定地说什么
        timbre: 清亮爽朗
        pace: 明快
        pitch: 中高音
    huntsman_2:
      display_name: 猎人乙
      tts:
        delivery: 一本正经地抬杠，荒唐话也说得理直气壮
        timbre: 厚实风趣
        pace: 稍慢，落句干脆
        pitch: 中低音
  chapters:
    - id: ch01
      title: 出门打猎
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 三个快活的猎人出门打猎。他们一路追，一路喊，还呜呜地吹着号角。快瞧那边哎！
        - id: ch01-b02
          speaker: huntsman_1
          text: 眼睛可得放亮，鼻子要朝着风。闻也好，看也好，咱们准能碰上中意的东西。
        - id: ch01-b03
          speaker: narrator
          text: 快瞧那边哎！他们追着，喊着，最先在田里发现一个破衣烂衫的妖怪。可他们没带走它。快瞧那边哎！
        - id: ch01-b04
          speaker: huntsman_1
          text: 那就是个妖怪！
        - id: ch01-b05
          speaker: huntsman_2
          text: 不对。那明明是位乡绅农场主，不过是迷路走到田里来了。
        - id: ch01-b06
          speaker: narrator
          text: 快瞧那边哎！
    - id: ch02
      title: 磨刀石和小公牛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猎人们继续追，继续喊。接着，他们发现一块轧轧作响、呼呼转动的磨刀石，还是把它留在了原地。快瞧那边哎！
        - id: ch02-b02
          speaker: huntsman_1
          text: 那就是一块磨刀石！
        - id: ch02-b03
          speaker: huntsman_2
          text: 哪儿是什么磨刀石。那是一轮老得成了化石的干酪，不知让谁滚到这里来了。
        - id: ch02-b04
          speaker: narrator
          text: 快瞧那边哎！他们又追又喊，随后看见围栏里关着一头小公牛。这个呢，他们照样没有带走。快瞧那边哎！
        - id: ch02-b05
          speaker: huntsman_1
          text: 围栏里的是一头小公牛！
        - id: ch02-b06
          speaker: huntsman_2
          text: 才不是。那不过是头涂花的公驴，一直没学会怎么叫。
        - id: ch02-b07
          speaker: narrator
          text: 快瞧那边哎！
    - id: ch03
      title: 小天使和市参议员
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三个人追呀喊呀，又碰见两三个刚放学的孩子。他们也没把孩子带走。快瞧那边哎！
        - id: ch03-b02
          speaker: huntsman_1
          text: 他们是几个孩子。
        - id: ch03-b03
          speaker: huntsman_2
          text: 不，他们只不过是几个小天使。就让他们留在这里玩吧。
        - id: ch03-b04
          speaker: narrator
          text: 快瞧那边哎！猎人们接着追，接着喊。这一次，沟里有头胖猪，正咧着嘴笑。他们仍旧把它丢下了。快瞧那边哎！
        - id: ch03-b05
          speaker: huntsman_1
          text: 那可是一头胖猪！
        - id: ch03-b06
          speaker: huntsman_2
          text: 不对。那是伦敦的一位市参议员，身上的衣裳全叫人偷走了。
        - id: ch03-b07
          speaker: narrator
          text: 快瞧那边哎！
    - id: ch04
      title: 空手而归
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 三个猎人追着，喊着，又看见小路上有一对年轻人。他们连这两位也没有带走。快瞧那边哎！
        - id: ch04-b02
          speaker: huntsman_1
          text: 那是一对年轻的情人。
        - id: ch04-b03
          speaker: huntsman_2
          text: 哪儿是情人。他们是两个可怜的疯子，正在四处游荡。咱们快走吧。
        - id: ch04-b04
          speaker: narrator
          text: 快瞧那边哎！他们就这么一路追，一路喊，直到太阳落下去。等这一天的打猎结束，三个猎人还是两手空空，什么也没能带走。快瞧那边哎！
        - id: ch04-b05
          speaker: huntsman_1
          text: 这么打猎可真不划算。不过咱们上上下下转了这么一大圈，今天过得可真痛快！
        - id: ch04-b06
          speaker: narrator
          text: 快瞧那边哎！
