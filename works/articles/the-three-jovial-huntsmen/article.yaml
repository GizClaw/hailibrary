cover_prompt: |-
  A wordless cover scene on a late-eighteenth-century Lancashire moor follows three jovial huntsmen who repeatedly miss what is before them. The men wear weathered tricorn hats, long rust, green, and indigo coats, waistcoats, knee breeches, stockings, and stout shoes, each carrying an old hunting horn but no raised weapon. They stride confidently past a hare sitting plainly beside the path while their three small hounds sniff in the opposite direction. The hare's calm watchfulness as the hunters march by is the focal action and the source of the gentle joke. Use a broad side-on composition with rhythmic walking figures, low stone walls, and generous cloudy sky above the moor. Keep clothing and landscape grounded in Georgian northern England and create an original arrangement rather than copying any prior illustrated edition. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
