audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: lively and warmly amused
        timbre: clear and resonant
        pace: brisk with room for comic turns
        pitch: medium
    john_gilpin:
      display_name: John Gilpin
      tts:
        delivery: good-humored and increasingly breathless
        timbre: warm and sturdy
        pace: measured at first, quickening under pressure
        pitch: medium-low
    mrs_gilpin:
      display_name: Mrs. Gilpin
      tts:
        delivery: practical, affectionate, and spirited
        timbre: bright and mature
        pace: steady and conversational
        pitch: medium
    betty:
      display_name: Betty
      tts:
        delivery: alert and urgent
        timbre: light and clear
        pace: quick
        pitch: medium-high
    calender:
      display_name: The Calender
      tts:
        delivery: friendly and dryly playful
        timbre: deep and slightly rough
        pace: unhurried
        pitch: low
    sister:
      display_name: Mrs. Gilpin's Sister
      tts:
        delivery: cheerful and animated
        timbre: warm and light
        pace: lively
        pitch: medium
    child_1:
      display_name: First Child
      tts:
        delivery: excited and spontaneous
        timbre: young and clear
        pace: quick
        pitch: high
    child_2:
      display_name: Second Child
      tts:
        delivery: excited and spontaneous
        timbre: young and bright
        pace: quick
        pitch: high
    spectator_1:
      display_name: First Spectator
      tts:
        delivery: loud and enthusiastic
        timbre: open and ringing
        pace: brisk
        pitch: medium
    spectator_2:
      display_name: Second Spectator
      tts:
        delivery: loud and excited
        timbre: sharp and clear
        pace: brisk
        pitch: medium-high
    gentleman_1:
      display_name: First Gentleman
      tts:
        delivery: alarmed and commanding
        timbre: firm and full
        pace: urgent
        pitch: medium-low
    gentleman_2:
      display_name: Second Gentleman
      tts:
        delivery: alarmed and commanding
        timbre: crisp and forceful
        pace: urgent
        pitch: medium
    gentleman_3:
      display_name: Third Gentleman
      tts:
        delivery: alarmed and commanding
        timbre: bright and carrying
        pace: urgent
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Wedding-Day Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: John Gilpin was a well-known, well-respected citizen of London. He was also a captain in the local train-band.
        - id: ch01-b02
          speaker: mrs_gilpin
          text: My dear, we've been married twenty long years, and we haven't had one holiday. Tomorrow is our wedding anniversary. Let's take a chaise and pair to the Bell at Edmonton. My sister, her child, our three children, and I will fill the chaise, so you'll have to follow us on horseback.
        - id: ch01-b03
          speaker: john_gilpin
          text: There's only one woman in the world I admire, and that's you, my dearest. So we'll do it. Everyone knows I'm a bold linen draper, and my good friend the calender will lend me his horse.
        - id: ch01-b04
          speaker: mrs_gilpin
          text: Good. And since wine costs so much, we'll take our own. It's bright and clear.
        - id: ch01-b05
          speaker: narrator
          text: John kissed his loving wife. He was delighted. She wanted a day of pleasure, but she still knew how to save money.
        - id: ch01-b06
          speaker: narrator
          text: Morning came, and so did the chaise. Mrs. Gilpin would not let it stop at her own door. The neighbors might think she was showing off. It waited three doors away instead, and all six eager travelers climbed in.
        - id: ch01-b07
          speaker: narrator
          text: The whip cracked. The wheels spun. No travelers had ever been happier. The stones rattled under them as though all Cheapside had gone mad.
    - id: ch02
      title: The Runaway Ride Begins
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: John stood beside the horse, caught hold of its flowing mane, and hurried into the saddle. Then he came straight down again. He had barely reached the saddle and was ready to begin when he turned his head. Three customers had just entered his shop.
        - id: ch02-b02
          speaker: narrator
          text: Losing time upset him badly, but he knew losing money would trouble him even more. So he stayed. It took a long while before all three customers found exactly what they wanted. At last they were satisfied. Then Betty came screaming down the stairs.
        - id: ch02-b03
          speaker: betty
          text: The wine! You left it behind!
          emotion: surprised
        - id: ch02-b04
          speaker: john_gilpin
          text: Goodness! Bring it here, and bring my leather belt too. It's the belt I wear with my sword when we drill.
        - id: ch02-b05
          speaker: narrator
          text: Careful Mrs. Gilpin had found two stone bottles to keep the wine safe. Each bottle had a curved handle. John threaded his belt through them and hung one bottle on either side to balance himself. Over everything he threw his long red cloak, neatly brushed, and now he was dressed from head to toe.
        - id: ch02-b06
          speaker: narrator
          text: He mounted again. The lively horse stepped very slowly over the stones while John rode with great care. But when its well-shod feet found a smoother road, it snorted and began to trot. Every step jarred John in the saddle.
        - id: ch02-b07
          speaker: john_gilpin
          text: Easy now! Slowly!
        - id: ch02-b08
          speaker: narrator
          text: The horse paid no attention. The trot became a gallop, no matter how John pulled the reins. Unable to sit upright, he bent low and gripped the mane with both hands and all his strength.
        - id: ch02-b09
          speaker: narrator
          text: No one had ever handled the horse that way before. With every hard pull on its mane, it wondered more and more what strange thing had landed on its back. Away went Gilpin, neck or nothing. Away went his hat and wig. When he set out that morning, he had never dreamed his outing would turn into a ride like this.
        - id: ch02-b10
          speaker: narrator
          text: The wind blew hard, and his cloak streamed behind him, long and bright. Then loop and button both gave way, and off the cloak flew.
    - id: ch03
      title: Past the Bell and On to Ware
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Now everyone could see the two bottles swinging at his sides. Dogs barked. Children screamed. Windows flew open, and every onlooker shouted as loudly as possible.
        - id: ch03-b02
          speakers: [spectator_1, spectator_2]
          ensemble: duo
          text: Well done!
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: Away went Gilpin. Who else could it be? News of him raced ahead.
        - id: ch03-b04
          speaker: spectator_1
          text: Look at the weight he's carrying! He must be in a race for a thousand pounds!
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: The faster he came toward each turnpike, the more amazing it was to see. In an instant, the turnpike men threw their gates wide open and let him race straight through. John kept bowing his hot, dripping head down low. Then the two bottles swung together behind his back and smashed with one blow.
        - id: ch03-b06
          speaker: narrator
          text: The wine poured down onto the road. It splashed over the horse's sides until they smoked as if someone were basting them. John still appeared to carry a load, because the broken bottle necks dangled from his leather belt for all to see.
        - id: ch03-b07
          speaker: narrator
          text: He tore through merry Islington and reached the Wash at Edmonton. There the horse sent water flying to both sides of the road, like a rolling mop or a wild goose at play.
        - id: ch03-b08
          speaker: narrator
          text: At the Bell, Mrs. Gilpin looked down from the balcony. She was amazed to see her dear husband riding that way.
        - id: ch03-b09
          speakers: [mrs_gilpin, sister, child_1, child_2]
          ensemble: chorus
          text: Stop, John, stop! This is the house! Dinner is waiting, and we're tired!
          emotion: surprised
        - id: ch03-b10
          speaker: john_gilpin
          text: So am I!
        - id: ch03-b11
          speaker: narrator
          text: But the horse had no wish to stop. Its owner lived a full ten miles farther on, at Ware. It flew like an arrow shot from a strong bow. And with that flight, we have reached the middle of the song.
        - id: ch03-b12
          speaker: narrator
          text: Gilpin was breathless and wanted desperately to stop. Still the horse carried him on until it reached the calender's home. There, at last, it stood still.
    - id: ch04
      title: A Hat, a Wig, and Another Dash
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The calender stared at his neighbor in such a state. He put down his pipe and hurried to the gate.
        - id: ch04-b02
          speaker: calender
          text: What happened? Tell me the news. I want to know why you've come here bareheaded, and why you've come at all!
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: John had a cheerful wit and always enjoyed a well-timed joke.
        - id: ch04-b04
          speaker: john_gilpin
          text: I came because your horse decided to come. And unless I'm mistaken, my hat and wig will arrive soon. They're still somewhere on the road.
        - id: ch04-b05
          speaker: narrator
          text: The calender was glad to find his friend in good spirits. Without answering, he went inside and came back with a hat and a long wig. Both looked quite respectable, and the hat was hardly worn.
        - id: ch04-b06
          speaker: calender
          text: My head is twice the size of yours, so these are bound to fit. But first, let me scrape that dirt off your face. Stay and eat too. You must be hungry.
        - id: ch04-b07
          speaker: john_gilpin
          text: It's my wedding anniversary. Everyone would stare if my wife ate dinner in Edmonton while I ate mine in Ware.
        - id: ch04-b08
          speaker: narrator
          text: John turned toward the horse.
        - id: ch04-b09
          speaker: john_gilpin
          text: I'm in a hurry for dinner. You came here because you wanted to. Now you'll go back because I want you to.
        - id: ch04-b10
          speaker: narrator
          text: What unlucky words! What a useless boast! John paid dearly for them. While he spoke, a donkey let out a tremendous bray.
        - id: ch04-b11
          speaker: narrator
          text: The horse snorted as if it had heard a lion roar. Then it galloped away with all its strength, exactly as it had before.
        - id: ch04-b12
          speaker: narrator
          text: Away went Gilpin, and away went the borrowed hat and wig. He lost them even faster this time, because they were much too big.
    - id: ch05
      title: The Race Back to Town
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When Mrs. Gilpin saw her husband racing away into the countryside, she took out half a crown and spoke to the young postboy who had driven them to the Bell.
        - id: ch05-b02
          speaker: mrs_gilpin
          text: This money is yours if you bring my husband back safe and well.
        - id: ch05-b03
          speaker: narrator
          text: The postboy rode out and soon met John charging back. In an instant, the boy reached for the runaway horse's rein and tried to stop him.
        - id: ch05-b04
          speaker: narrator
          text: He meant to help, but he missed. Instead, he frightened the frightened horse even more and made it run faster.
        - id: ch05-b05
          speaker: narrator
          text: Away went Gilpin, with the postboy close behind. The postboy's horse was delighted to be free of the heavy chaise and its wheels.
        - id: ch05-b06
          speaker: narrator
          text: Six gentlemen on the road saw Gilpin flying past with the postboy racing after him. They raised the alarm, and no one stayed silent.
        - id: ch05-b07
          speakers: [gentleman_1, gentleman_2, gentleman_3]
          ensemble: chorus
          text: Stop, thief! Stop that highwayman!
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: Everyone they passed joined the chase. Once again, the turnpike gates flew open. Just as before, the toll keeper thought Gilpin was riding a race.
        - id: ch05-b09
          speaker: narrator
          text: And in a way, he was. He won it too. He reached town first and did not stop until he came to the very place where he had climbed onto the horse. There, he finally climbed down again.
        - id: ch05-b10
          speaker: narrator
          text: So let us sing, long live the King, and long live Gilpin too. The next time he rides abroad, may I be there to see it.
