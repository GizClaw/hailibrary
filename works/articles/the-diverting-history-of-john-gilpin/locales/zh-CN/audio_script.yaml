  chapters:
    - id: ch01
      title: 结婚纪念日的安排
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 约翰·吉尔平住在赫赫有名的伦敦城。他是个有名望、讲信用的布商，还是民兵队的一位队长。他和太太结婚整整二十年，却从没放过一天假。说起这件事，吉尔平太太觉得那二十年实在乏味得太久了。
        - id: ch01-b02
          speaker: mrs_gilpin
          text: 明天就是我们的结婚纪念日。咱们坐双马轻车，到埃德蒙顿的“钟铃旅店”去吧。我和妹妹、她的孩子，再带上咱们三个孩子，车里就满了。你骑马跟在后面。
        - id: ch01-b03
          speaker: john_gilpin
          text: 天下女子，我最敬爱的就是你。这事当然照办！漂布匠是我的好朋友，他会借马给我。
        - id: ch01-b04
          speaker: mrs_gilpin
          text: 那就好。旅店的酒贵，咱们把自己的好酒带上。
        - id: ch01-b05
          speaker: narrator
          text: 吉尔平亲了亲爱妻，心里十分欢喜。太太想出去游玩，过日子却一点儿不含糊，他更觉得称心。第二天一早，轻车来了。她怕邻居说自己摆阔，没让车停在门口，而是停在三户之外。一家六口走过去上了车，个个兴高采烈，恨不得马上冲过一路艰难。啪的一声，车夫甩响鞭子。车轮飞快转动，车下的石板咔啦啦直响，仿佛整条奇普赛街都发了疯。可吉尔平还没有出发。
    - id: ch02
      title: 酒瓶、红斗篷和飞奔的马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吉尔平来到马旁，抓紧飘拂的马鬃，急急忙忙上了鞍。他正要赶路，一回头，却看见三个顾客走进店里，只好又下马做生意。耽误时间固然让他难受，可他心里明白，少赚几个便士更叫人难受。那三位客人挑来选去，过了好半天才各自满意。刚刚送走他们，贝蒂又尖叫着跑下楼。
        - id: ch02-b02
          speaker: betty
          text: 酒还在家里，忘带啦！
          emotion: surprised
        - id: ch02-b03
          speaker: john_gilpin
          text: 哎呀，快拿来！再把我操练时挂佩剑的皮带也带来。
        - id: ch02-b04
          speaker: narrator
          text: 细心的吉尔平太太找了两只石瓶，好让美酒一路安稳。每只瓶子都有一只弯弯的耳。吉尔平把皮带从瓶耳里穿过去，左右各挂一只，这样身子正好平衡。为了从头到脚都齐齐整整，他又把刷得干干净净的长红斗篷往身上一披，这才重新上马。起初，他十分小心，马也在石路上慢慢踱步。可钉着铁掌的马蹄一踏上平坦大道，那匹喷着鼻息的马就小跑起来，颠得吉尔平在鞍上十分难受。
        - id: ch02-b05
          speaker: john_gilpin
          text: 喔，慢一点，稳稳地走！
        - id: ch02-b06
          speaker: narrator
          text: 喊也没用。不管他怎样拉嚼子、扯缰绳，小跑还是变成了飞奔。吉尔平根本坐不直，只能深深弯腰，两只手使出全力，死死抓住马鬃。马从没让人用这种架势骑过，越跑越猜不透，背上究竟趴着什么怪东西。它拼命向前，吉尔平也只好不顾死活地跟着飞。帽子飞走了，假发也飞走了。出门的时候，他哪能想到会有这番狼狈！风呼呼地吹，长红斗篷在背后飘起来，像一面鲜艳的长旗。最后扣环和纽扣一起崩开，斗篷也飞向了远处。
        - id: ch02-b07
          speaker: narrator
          text: 两只酒瓶这下全露了出来，在他左右两边荡来荡去。一路上，狗在叫，孩子在尖叫，家家户户的窗户全推开了。每个人都扯开嗓门为他喝彩。吉尔平的名声转眼传遍四周，人人看见那两只瓶子，都以为他带着负重在参加赛马。
        - id: ch02-b08
          speakers: [gentleman_1, gentleman_2, gentleman_3, gentleman_4]
          ensemble: chorus
          text: 骑得好！他带着负重赛马呢，赌注足有一千镑！
          emotion: happy
    - id: ch03
      title: 跑过钟铃旅店
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 吉尔平越跑越近，收费关卡的看守看见了，转眼便把大门敞开。吉尔平低着汗淋淋的脑袋，身子随着马步一下一下地往前点。背后的两只酒瓶猛地撞在一起，全碎了。好酒流了一路，实在叫人心疼。酒又淋在发热的马身上，马的两肋顿时水汽直冒，像烤肉浇上了油。可瓶颈还挂在皮带上，在吉尔平腰间来回晃荡。人人都看得见，所以远远望去，他仍像带着负重。
        - id: ch03-b02
          speaker: narrator
          text: 他一路穿过热闹的伊斯灵顿，把这场滑稽戏一直演到埃德蒙顿的沃什。马冲进泥水里，把脏水泼得到路两边都是。吉尔平随马颠簸，活像一把滚动的拖把，又像一只撒欢的野鹅。到了埃德蒙顿，吉尔平太太从旅店阳台看见了亲爱的丈夫。她眼看他用这副模样骑马，惊讶得怎么也想不明白。
        - id: ch03-b03
          speakers: [mrs_gilpin, sister, child_1, child_2]
          ensemble: chorus
          text: 停下，约翰！就是这里！饭菜在等，我们也累啦！
        - id: ch03-b04
          speaker: john_gilpin
          text: 我也已经累得不行啦！
        - id: ch03-b05
          speaker: narrator
          text: 马却丝毫不肯停。为什么呢？因为它的主人，也就是漂布匠，住在十英里外的韦尔。于是它像强壮的弓箭手射出的利箭，载着吉尔平继续飞去。故事唱到这里，正好过了一半。吉尔平已经气喘吁吁，心里一百个不情愿，却一点办法也没有。马一路冲到漂布匠家，这才终于在门前站住。
    - id: ch04
      title: 韦尔的帽子和假发
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 漂布匠看见邻居衣帽全无、满脸是泥，竟以这副模样骑着自己的马回来，惊得放下烟斗，飞奔到门口，一定要问清他带来了什么消息。
        - id: ch04-b02
          speaker: calender
          text: 出了什么事？快把消息告诉我！你怎么光着脑袋跑来了？又为什么跑到我家来？
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 吉尔平一向爱开及时的玩笑，这时仍笑着回答。
        - id: ch04-b04
          speaker: john_gilpin
          text: 我来，是因为你的马非来不可。照我看，我的帽子和假发也快到了，它们还在路上呢。
        - id: ch04-b05
          speaker: narrator
          text: 漂布匠见朋友还有说笑的兴致，心里十分高兴。他一句话没说，转身进了屋。不一会儿，他拿出一顶还算体面的旧帽子，还有一头长长垂到背后的假发。两样东西各有各的漂亮，只是都照着漂布匠的大脑袋做成。
        - id: ch04-b06
          speaker: calender
          text: 我的脑袋比你的大一倍，这两样东西肯定适合你。先让我刮掉你脸上的泥，再留下来吃饭吧，你一定饿了。
        - id: ch04-b07
          speaker: john_gilpin
          text: 今天是我的结婚纪念日。要是妻子在埃德蒙顿吃饭，我却在韦尔吃，大家见了还不奇怪吗？
        - id: ch04-b08
          speaker: narrator
          text: 吉尔平转向那匹马。
        - id: ch04-b09
          speaker: john_gilpin
          text: 我急着回去吃饭。刚才你为自己高兴，非要跑到这里。现在也该为我跑回去了。
        - id: ch04-b10
          speaker: narrator
          text: 这句倒霉的夸口可害苦了他，他为此付出的代价一点儿不轻。话还没说完，一头驴忽然扯开嗓门，叫得又响又清。马儿听见，仿佛耳边响起了狮吼，顿时喷着鼻息，使出全身力气再次狂奔。吉尔平又飞走了，帽子和假发也又飞了。这一回，它们掉得比上次还快。为什么呢？因为它们比吉尔平的脑袋大得太多。
    - id: ch05
      title: 一场追逐和一个头名
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 吉尔平太太看见丈夫向乡野冲去，拿出半克朗，对赶车的年轻人说。
        - id: ch05-b02
          speaker: mrs_gilpin
          text: 你把我丈夫平平安安带回来，这枚钱就是你的。
        - id: ch05-b03
          speaker: narrator
          text: 年轻人骑马追去，很快就遇见迎面飞奔回来的吉尔平。他一心想帮忙，立刻伸手去抓缰绳，打算一下子把马拦住。可这件他很想办成的事偏偏没办成。那匹马原本就受了惊，又让他吓了一跳，反而跑得更快。吉尔平在前面飞，赶车的年轻人在后面紧追。年轻人的马不用再拖那辆笨重的车，跑起来正觉得快活。
        - id: ch05-b04
          speaker: narrator
          text: 路上有六位绅士。他们看见吉尔平在前面没命地飞，赶车的年轻人又在后面策马紧追，便把吉尔平当成了强盗，六个人没有一个闭嘴。路上凡是听见呼喊的人，也全都加入了追赶。
        - id: ch05-b05
          speakers: [gentleman_1, gentleman_2, gentleman_3, gentleman_4]
          ensemble: chorus
          text: 抓贼！抓贼！前面有拦路强盗！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: 收费关卡的大门又在转眼之间打开。看守仍和先前一样，以为吉尔平正在参加一场赛马。说来也巧，他的确赛了一场，还真的赢了头名。因为所有追赶的人里，他第一个回到城里。他一路没有停，直到当初抓住马鬃、第一次上马的地方，才终于又从马上下来，双脚落了地。
        - id: ch05-b07
          speaker: narrator
          text: 这一次，他总算平平安安回到了家。现在，让我们大家一起唱吧。愿国王万岁，也愿吉尔平长寿！等他下一回骑马出门，愿我就在路边，也能从头到尾亲眼看见这番热闹。
