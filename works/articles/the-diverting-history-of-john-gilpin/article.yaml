cover_prompt: |-
  A wordless cover scene on an eighteenth-century English road catches John Gilpin during his wildly comic ride. Gilpin is a respectable middle-aged linen draper with a powdered wig, brown tricorn hat, blue coat, buff waistcoat, knee breeches, stockings, and buckled shoes, clinging to a fast bay horse. Two empty wine bottles swing from his belt while his coat tails stream behind him, and startled geese scatter safely from the lane. The horse's exuberant forward leap is the focal action, with Gilpin's alarm readable but harmless. Use a low diagonal roadside view with hedges and a distant inn receding behind them and generous pale sky above. Keep tack, clothing, road, and buildings grounded in Georgian England and do not copy any historical illustrator's composition. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
