cover_prompt: |-
  A wordless cover scene in a child's nursery around 1920 shows the Velveteen Rabbit at the threshold between beloved toy and living rabbit. The toy rabbit has soft brown velveteen fur worn thin at the seams, long floppy ears lined in faded rose cloth, black bead eyes, and a small cotton tail, with no clothing. A sleeping young boy with tousled brown hair lies in a brass bed beneath a patchwork quilt, while moonlit wild rabbits wait beyond an open garden door among dewy grass. The toy rabbit takes one tentative step from the rug toward the garden as a faint fresh shine comes into his eyes, making transformation through love the focal action. Use a low intimate three-quarter view with the nursery below and a broad calm moonlit opening above. Keep toys, furniture, and clothing faithful to the early twentieth century, make the magic gentle, and avoid resemblance to any film or animation adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
