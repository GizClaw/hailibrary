  chapters:
    - id: ch01
      title: What It Means to Be Real
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a velveteen rabbit. When he was new, he looked splendid. He was fat and bunchy, just as a rabbit ought to be, with brown-and-white spots, real thread whiskers, and ears lined in pink sateen. On Christmas morning he sat at the top of the Boy's stocking with a sprig of holly between his paws. He looked charming there.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The stocking held nuts, oranges, chocolate almonds, a toy engine, and a clockwork mouse. Still, the Rabbit was the best gift of all. The Boy loved him for at least two hours. Then the Aunts and Uncles arrived for dinner. Tissue paper rustled, parcels came open, and in all the excitement over the new presents, everyone forgot the Velveteen Rabbit.
        - id: ch01-b03
          speaker: narrator
          text: >-
            For a long time he lived in the toy cupboard or lay on the nursery floor. No one paid much attention to him. He was shy by nature, and because he was only made of velveteen, the expensive toys snubbed him. The mechanical toys acted especially important. They looked down on everyone else, filled their talk with modern ideas, and pretended they were real. The model boat had survived two seasons and lost most of his paint. Even so, he copied their manner and never missed a chance to describe his rigging in technical words.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The Rabbit could not even claim to be a model of something. He had no idea that living rabbits existed. He thought all rabbits were stuffed with sawdust, just as he was, though he understood that sawdust was terribly out of date and not a thing to mention among modern toys. Even Timothy, the jointed wooden lion made by disabled soldiers, put on airs and claimed connections with the Government. All of them made the poor Rabbit feel small and ordinary. Only the Skin Horse was kind to him.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The Skin Horse had been in the nursery longer than any other toy. His brown coat had worn bald in places, and the seams showed beneath it. Most of his tail had been pulled out, one hair at a time, so the children could string their bead necklaces. He was wise. He had watched a long procession of mechanical toys arrive, brag and swagger for a while, then break their mainsprings and disappear. He knew they were only toys and would never become anything else. Nursery magic is strange and wonderful, and only old, experienced playthings like the Skin Horse truly understand it.
        - id: ch01-b06
          speaker: velveteen_rabbit
          text: >-
            What does Real mean? Is it when you have something buzzing inside you and a handle that sticks out?
        - id: ch01-b07
          speaker: narrator
          text: >-
            The Rabbit asked him this one day as they lay beside the nursery fender, before Nana came in to tidy the room.
        - id: ch01-b08
          speaker: skin_horse
          text: >-
            Real isn't about how you're made. It's something that happens to you. When a child loves you for a long, long time, and doesn't just play with you but truly loves you, then you become Real.
        - id: ch01-b09
          speaker: velveteen_rabbit
          text: Does it hurt?
        - id: ch01-b10
          speaker: skin_horse
          text: Sometimes. But once you're Real, being hurt doesn't matter to you.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The Skin Horse always told the truth.
        - id: ch01-b12
          speaker: velveteen_rabbit
          text: Does it happen all at once, like getting wound up, or does it happen little by little?
        - id: ch01-b13
          speaker: skin_horse
          text: >-
            Not all at once. You become. It takes a long time. That's why it hardly ever happens to toys that break easily, have sharp edges, or must be kept perfect. Usually, by the time you're Real, most of your hair has been loved away. Your eyes may fall out, your joints grow loose, and you become very shabby. None of that matters. Once you're Real, you can't be ugly, except to someone who doesn't understand.
        - id: ch01-b14
          speaker: velveteen_rabbit
          text: I suppose you're Real, aren't you?
        - id: ch01-b15
          speaker: narrator
          text: >-
            As soon as he said it, the Rabbit wished he had not. Perhaps the Skin Horse would be sensitive about it. But the Skin Horse only smiled.
        - id: ch01-b16
          speaker: skin_horse
          text: >-
            The Boy's Uncle made me Real. That was many years ago. Once you become Real, you can never be unreal again. It lasts forever.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The Rabbit sighed. He thought it might take a very long time for that magic to happen to him. He longed to be Real and know how it felt. Yet the thought of becoming shabby and losing his eyes and whiskers made him sad. He wished he could become Real without any of those uncomfortable things happening.
    - id: ch02
      title: The Boy's Bunny
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Nana ruled the nursery. Some days she ignored the toys scattered around. On other days, for no reason they could see, she swept through like a great wind and hurried them into cupboards. She called it tidying up. All the toys hated it, especially the tin ones. The Rabbit did not mind as much, because wherever Nana tossed him, he landed softly.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One evening at bedtime, the Boy could not find the china dog that usually slept beside him. Nana was in a hurry and did not want to search for china dogs. She saw the open door of the toy cupboard and reached inside.
        - id: ch02-b03
          speaker: nana
          text: Here, take your old Bunny. He'll do for tonight.
        - id: ch02-b04
          speaker: narrator
          text: >-
            She pulled the Rabbit out by one ear and placed him in the Boy's arms.
        - id: ch02-b05
          speaker: narrator
          text: >-
            That night, and for many nights afterward, the Velveteen Rabbit slept in the Boy's bed. At first it was uncomfortable. The Boy hugged him very tightly, rolled over on him, and sometimes pushed him so far beneath the pillow that the Rabbit could hardly breathe. The Rabbit also missed the long moonlit hours when the house was quiet and he could talk with the Skin Horse.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Before long, though, he loved sleeping there. The Boy talked to him and built tunnels under the blankets, saying they were like the burrows where real rabbits lived. They played wonderful games in whispers after Nana went away to eat her supper. Only the night-light remained, glowing on the mantel while they played. When the Boy fell asleep, the Rabbit nestled under his warm little chin and dreamed while the Boy's hands held him close all night.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Time passed, and the little Rabbit was so happy that he never noticed his lovely velveteen fur wearing thin. His tail began to come unsewn. All the pink rubbed off his nose where the Boy kissed him.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Spring came, bringing long days in the garden. Wherever the Boy went, the Rabbit went too. He rode in the wheelbarrow and joined picnics on the grass. The Boy built lovely fairy huts for him beneath the raspberry canes behind the flower border, and the Rabbit played there beside him.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Once the Boy was suddenly called away to tea and left the Rabbit on the lawn until well after dark. The Boy could not sleep without him, so Nana had to search by candlelight. The Rabbit was soaked with dew and covered in earth from diving into the burrows the Boy had dug in the flower bed. Nana grumbled while she wiped him with the corner of her apron.
        - id: ch02-b10
          speaker: nana
          text: You simply have to have that old Bunny! What a fuss to make over a toy.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The Boy sat straight up in bed and reached out both hands.
        - id: ch02-b12
          speaker: boy
          text: Give me my Bunny! Don't call him a toy. He's REAL!
        - id: ch02-b13
          speaker: narrator
          text: >-
            When the little Rabbit heard that, happiness filled him. What the Skin Horse had said was true at last. The nursery magic had happened. He was not only a toy anymore. He was Real. The Boy himself had said so.
        - id: ch02-b14
          speaker: narrator
          text: >-
            That night the Rabbit was almost too happy to sleep. So much love stirred in his little sawdust heart that it nearly burst. His boot-button eyes had lost their shine long ago, but now wisdom and beauty showed in them. Even Nana noticed when she picked him up the next morning.
        - id: ch02-b15
          speaker: nana
          text: Well, would you look at that? This old Bunny has quite a knowing face.
        - id: ch02-b16
          speaker: narrator
          text: That was a wonderful summer.
    - id: ch03
      title: The Rabbits in the Wood
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A wood grew near the house, and on long June evenings the Boy liked to play there after tea. He always brought the Velveteen Rabbit. Before he wandered away to pick flowers or play at brigands among the trees, he made Bunny a small, cozy nest somewhere in the bracken. The Boy was kindhearted. Even when he ran off to his own games, he wanted Bunny to rest in comfort until he came back.
        - id: ch03-b02
          speaker: narrator
          text: >-
            One evening the Rabbit lay alone in his nest, watching ants hurry through the grass between his velvet paws. Then two strange creatures crept out of the tall bracken nearby.
        - id: ch03-b03
          speaker: narrator
          text: >-
            They were rabbits like him, but they were furry and looked brand-new. They must have been made extremely well, because not one seam showed. Their shapes changed strangely as they moved. One moment they looked long and thin, and the next they looked fat and bunchy. The Velveteen Rabbit always stayed the same shape. These rabbits stepped softly over the ground and came close, twitching their noses.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The Rabbit stared, trying to find where their clockwork stuck out. As far as he knew, anything that jumped needed to be wound up. But he could see no clockwork at all. They were clearly a new kind of rabbit. The two strangers stared at him. He stared back, while their noses kept twitching.
        - id: ch03-b05
          speaker: wild_rabbit
          text: Why don't you get up and play with us?
        - id: ch03-b06
          speaker: velveteen_rabbit
          text: I don't feel like playing.
        - id: ch03-b07
          speaker: narrator
          text: >-
            He did not want to admit that he had no clockwork.
        - id: ch03-b08
          speaker: wild_rabbit
          text: Oh, come on. It's easy!
        - id: ch03-b09
          speaker: narrator
          text: >-
            The furry rabbit made a huge sideways hop and rose onto his hind legs.
        - id: ch03-b10
          speaker: wild_rabbit
          text: I bet you can't do that!
        - id: ch03-b11
          speaker: velveteen_rabbit
          text: I can! I can jump higher than anything!
        - id: ch03-b12
          speaker: narrator
          text: >-
            He meant that he could jump when the Boy threw him, though he certainly did not want to explain that.
        - id: ch03-b13
          speaker: wild_rabbit
          text: Can you hop on your hind legs?
        - id: ch03-b14
          speaker: narrator
          text: >-
            That was a terrible question. The Velveteen Rabbit had no hind legs. His whole back end was one solid piece, like a pincushion. He sat very still in the bracken and hoped the others would not notice.
        - id: ch03-b15
          speaker: velveteen_rabbit
          text: I just don't want to.
        - id: ch03-b16
          speaker: narrator
          text: >-
            But wild rabbits have sharp eyes. The furry rabbit stretched his neck and looked closely.
        - id: ch03-b17
          speaker: wild_rabbit
          text: He doesn't have any hind legs! Imagine that. A rabbit with no hind legs!
        - id: ch03-b18
          speaker: narrator
          text: >-
            Then he laughed.
        - id: ch03-b19
          speaker: velveteen_rabbit
          text: I do have hind legs! I'm sitting on them!
        - id: ch03-b20
          speaker: wild_rabbit
          text: Then stick them out and show me. Like this!
        - id: ch03-b21
          speaker: narrator
          text: >-
            The wild rabbit spun and danced until the little Rabbit felt dizzy.
        - id: ch03-b22
          speaker: velveteen_rabbit
          text: I don't like dancing. I'd rather sit still.
        - id: ch03-b23
          speaker: narrator
          text: >-
            Yet he wanted desperately to dance. A new, tickly feeling ran through him. He would have given anything to jump about the way those rabbits did.
        - id: ch03-b24
          speaker: narrator
          text: >-
            The strange rabbit stopped dancing and came closer than before. His long whiskers brushed the Velveteen Rabbit's ear. Then, all at once, he wrinkled his nose, pressed his ears flat, and leaped backward.
        - id: ch03-b25
          speaker: wild_rabbit
          text: He smells wrong! He isn't a rabbit at all. He isn't real!
          emotion: surprised
        - id: ch03-b26
          speaker: velveteen_rabbit
          text: I am Real! I am! The Boy said so!
          emotion: sad
        - id: ch03-b27
          speaker: narrator
          text: >-
            The little Rabbit nearly cried. Just then footsteps sounded nearby, and the Boy ran past. With thumping feet and a flash of white tails, the two wild rabbits vanished.
        - id: ch03-b28
          speaker: velveteen_rabbit
          text: Come back and play! Please come back! I know I'm Real!
          emotion: sad
        - id: ch03-b29
          speaker: narrator
          text: >-
            No one answered. Only the ants hurried back and forth, and the bracken moved gently where the strangers had gone. The Velveteen Rabbit was alone.
        - id: ch03-b30
          speaker: velveteen_rabbit
          text: Oh, dear. Why did they run away? Why couldn't they stay and talk to me?
          emotion: sad
        - id: ch03-b31
          speaker: narrator
          text: >-
            For a long time he lay without moving. He watched the bracken and hoped they would return, but they never did. The sun sank lower. Little white moths fluttered out, and at last the Boy came to carry him home.
        - id: ch03-b32
          speaker: narrator
          text: >-
            The weeks went by. The little Rabbit became very old and shabby, but the Boy loved him just as much. He loved him until every whisker was gone. The pink lining inside his ears turned gray, his brown spots faded, and he began to lose his shape. To almost everyone, he hardly looked like a rabbit anymore. To the Boy, he was always beautiful, and that was all the Rabbit cared about. He did not mind what anyone else saw. Nursery magic had made him Real, and when you are Real, shabbiness does not matter.
    - id: ch04
      title: Behind the Fowl-House
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Then one day, the Boy became ill. His face turned bright red. He talked in his sleep, and his small body grew so hot that it burned the Rabbit when he held him close. Strangers came and went through the nursery, and a lamp burned all night.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Through it all, the Velveteen Rabbit stayed hidden beneath the bedclothes. He never moved. He feared that if anyone found him, they might take him away, and he knew the Boy needed him.
        - id: ch04-b03
          speaker: narrator
          text: >-
            It was a long, weary time. The Boy was too sick to play, and the Rabbit found the empty days dull. Still, he nestled beside him and waited patiently. He looked forward to the time when the Boy would be well, and they could go into the garden again. They would play among the flowers and butterflies and return to their wonderful games in the raspberry thicket, just as they used to.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The Rabbit planned all kinds of happy things. While the Boy lay half asleep, he crept near the pillow and whispered those plans in his ear. At last the fever broke, and the Boy began to recover. Soon he could sit up and look at picture books with the Rabbit tucked close beside him. Then one day, they let the Boy get dressed and leave his bed.
        - id: ch04-b05
          speaker: narrator
          text: >-
            It was a bright morning, full of sunshine, and the windows stood wide open. The Boy had been carried onto the balcony and wrapped in a shawl. The little Rabbit remained tangled in the bedclothes, thinking.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Tomorrow the Boy was going to the seaside. Everything had been arranged. Only the doctor's orders still had to be carried out. The grown-ups talked while the Rabbit listened with his head peeking from under the covers. The nursery had to be disinfected. Every book and toy that had shared the sickbed must be burned.
        - id: ch04-b07
          speaker: velveteen_rabbit
          text: Hurrah! Tomorrow we're going to the seaside!
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: >-
            The Boy had often described the seaside. The Rabbit longed to see the great waves, the tiny crabs, and the castles made of sand. Just then Nana spotted him.
        - id: ch04-b09
          speaker: nana
          text: What about his old Bunny?
        - id: ch04-b10
          speaker: doctor
          text: >-
            That thing? It's covered with scarlet fever germs. Burn it at once. No arguments. Get him a new rabbit. He must never have this one again.
        - id: ch04-b11
          speaker: narrator
          text: >-
            So the little Rabbit was stuffed into a sack with old picture books and a great deal of rubbish. Someone carried the sack all the way to the far end of the garden, behind the fowl-house. It was a fine place to build a bonfire, but the gardener was too busy to deal with it just then. The potatoes still had to be dug, and the green peas had to be gathered. He promised that he would come back early the next morning and burn the whole pile.
        - id: ch04-b12
          speaker: narrator
          text: >-
            That night the Boy slept in another room with a new bunny. The new one was splendid, made of white plush with real glass eyes. But the Boy was too excited to care much about it. Tomorrow he was going to the seaside, and that wonderful thought filled his mind.
        - id: ch04-b13
          speaker: narrator
          text: >-
            While the Boy dreamed of the seaside, the little Rabbit lay among the old picture books behind the fowl-house. He felt terribly lonely. The sack had been left open, and after some wriggling he managed to push his head through and look around.
        - id: ch04-b14
          speaker: narrator
          text: >-
            He shivered a little. He had always slept in a proper bed, and so many hugs had worn his coat thin and threadbare. It could no longer keep him warm. Nearby, the raspberry canes rose thick and tall, almost like a tropical jungle. In their deep shade, he and the Boy had played together on mornings that now seemed long ago.
        - id: ch04-b15
          speaker: narrator
          text: >-
            He remembered their long, sunny hours in the garden. Each memory seemed lovelier than the one before it. He saw the fairy huts in the flower bed and the quiet evenings in the wood, when ants ran over his paws as he rested in the bracken. He remembered the wonderful day when he first understood that he was Real.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Then he thought of the gentle, wise Skin Horse and everything the old horse had told him. What good was it to be loved, to lose your beauty, and to become Real if everything ended this way? One real tear slipped down his worn velvet nose and dropped onto the ground.
    - id: ch05
      title: Real to Everyone
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Then something strange happened. A flower sprang from the earth where the tear had landed. It was a mysterious flower, unlike anything else in the garden. Slender leaves as green as emeralds surrounded a blossom shaped like a golden cup. It was so beautiful that the little Rabbit forgot his tears and watched.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Soon the blossom opened, and a fairy stepped out. She was the loveliest fairy in the whole world. Her dress seemed to be made of pearls and drops of dew. Flowers circled her neck and nestled in her hair, and her face was lovelier than the most perfect flower. She came close to the Rabbit, gathered him into her arms, and kissed his damp velveteen nose.
        - id: ch05-b03
          speaker: nursery_fairy
          text: Little Rabbit, don't you know who I am?
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Rabbit looked up. Her face seemed familiar, but he could not remember where he had seen it.
        - id: ch05-b05
          speaker: nursery_fairy
          text: >-
            I am the Nursery Magic Fairy. I care for every plaything a child has loved. When those toys grow old and worn, and the children no longer need them, I come for them. I take them away and make them Real.
        - id: ch05-b06
          speaker: velveteen_rabbit
          text: Wasn't I Real already?
        - id: ch05-b07
          speaker: nursery_fairy
          text: >-
            You were Real to the Boy because he loved you. Now you will be Real to everyone.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The Fairy held him close and flew with him into the wood.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The moon had risen, and its light made the whole forest beautiful. Every frond of bracken shone like frosted silver. In an open clearing between the tree trunks, wild rabbits danced with their own shadows on the velvet grass. The moment they saw the Fairy, they stopped dancing. They gathered in a ring around her and stared.
        - id: ch05-b10
          speaker: nursery_fairy
          text: >-
            I've brought you a new friend. Be very kind to him, and teach him everything he needs to know about Rabbit-land. He is coming to live with you forever.
        - id: ch05-b11
          speaker: narrator
          text: >-
            She kissed the little Rabbit once more and set him on the grass.
        - id: ch05-b12
          speaker: nursery_fairy
          text: Run along and play, little Rabbit!
        - id: ch05-b13
          speaker: narrator
          text: >-
            But the little Rabbit sat perfectly still. With all the wild rabbits dancing around him, he suddenly remembered his missing hind legs. He did not want them to discover that his back was made in one piece. He had no idea that the Fairy's last kiss had changed him completely.
        - id: ch05-b14
          speaker: narrator
          text: >-
            He might have stayed there a long time, too shy to move. Then something tickled his nose. Without thinking, he raised a hind toe and scratched it.
        - id: ch05-b15
          speaker: narrator
          text: >-
            He had hind legs! His dull velveteen was gone, and soft, shining brown fur covered him. His ears twitched all by themselves. His whiskers had grown so long that they brushed the grass.
        - id: ch05-b16
          speaker: narrator
          text: >-
            He gave one great leap. The joy of using those hind legs was so strong that he bounded again and again across the grass. He hopped sideways and spun around just as the other rabbits did. He grew so excited that by the time he finally stopped to look for the Fairy, she had disappeared.
        - id: ch05-b17
          speaker: narrator
          text: He was a Real Rabbit at last, at home among the other rabbits.
        - id: ch05-b18
          speaker: narrator
          text: >-
            Autumn passed, and then winter. In the spring, when the days turned warm and sunny, the Boy went to play in the wood behind the house. As he played, two rabbits crept from the bracken and watched him.
        - id: ch05-b19
          speaker: narrator
          text: >-
            One rabbit was brown all over. The other had unusual marks beneath his fur, as if he had once been spotted and the old pattern still showed through. Something about his soft little nose and round black eyes looked familiar to the Boy.
        - id: ch05-b20
          speaker: boy
          text: Why, he looks just like my old Bunny that disappeared when I had scarlet fever!
          emotion: surprised
        - id: ch05-b21
          speaker: narrator
          text: >-
            But the Boy never knew that it truly was his own Bunny, returning to look at the child who had first helped him become Real.
