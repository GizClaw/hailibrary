audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着柔和的惊奇
        timbre: 清澈圆润
        pace: 舒缓
        pitch: 中
    velveteen_rabbit:
      display_name: 绒布兔子
      tts:
        delivery: 腼腆真诚，温柔而敏感
        timbre: 轻柔稚嫩
        pace: 轻缓
        pitch: 中高
    skin_horse:
      display_name: 皮马
      tts:
        delivery: 睿智坦诚，沉静宽厚
        timbre: 温暖沧桑
        pace: 从容
        pitch: 低
    nana:
      display_name: 保姆
      tts:
        delivery: 麻利务实，语气坚定
        timbre: 结实成熟
        pace: 稍快
        pitch: 中低
    boy:
      display_name: 男孩
      tts:
        delivery: 直率活泼，充满依恋
        timbre: 清亮童真
        pace: 自然
        pitch: 高
    wild_rabbit:
      display_name: 野兔
      tts:
        delivery: 敏捷自信，略带取笑
        timbre: 明亮活泼
        pace: 明快
        pitch: 中高
    doctor:
      display_name: 医生
      tts:
        delivery: 果断务实，不容争辩
        timbre: 清晰成熟
        pace: 稍快
        pitch: 中低
    nursery_fairy:
      display_name: 育儿室魔法仙子
      tts:
        delivery: 温柔明亮，令人安心
        timbre: 轻盈清澈
        pace: 优雅舒展
        pitch: 中高
  chapters:
    - id: ch01
      title: 变成真的
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一只绒布兔子。刚来到家里时，他神气极了，身子胖乎乎、圆滚滚的，棕白相间的绒布上有漂亮的斑纹。他的胡须是丝线做的，耳朵里衬着粉红缎子。圣诞节早晨，他坐在男孩长袜的袜口上，两只爪子间还插着一小枝冬青，看起来可爱极了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            袜子里装着坚果、橙子、巧克力杏仁，还有玩具火车头和上发条的老鼠。不过，兔子才是最棒的礼物。男孩爱了他足足两个钟头。后来亲戚们来吃饭，薄纸哗啦作响，礼物一个接一个拆开。男孩只顾着看新东西，绒布兔子就被忘在一边了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            此后的很长一段日子，他不是待在玩具柜里，就是躺在育儿室地板上，没人怎么理会他。兔子本来就害羞，又只是绒布做的，那些昂贵的玩具便瞧不起他。机械玩具最爱摆架子，看谁都低一等。他们满脑子都是新潮事物，还装成真的一样。那艘模型船已经待了两个年头，漆掉得所剩无几，却也学会了他们的腔调，逮住机会就用一串术语夸耀自己的帆缆。
        - id: ch01-b04
          speaker: narrator
          text: >-
            兔子连自己是什么东西的模型都不知道，因为他从没听说世上有活兔子。他以为兔子肚里都塞着木屑，不过他知道木屑早就不时髦了，不能在新派玩具面前提。就连伤残军人做的木狮子蒂莫西也装腔作势，说自己和政府有关系。大家弄得小兔子觉得自己平凡又渺小。只有皮马肯真心待他。
        - id: ch01-b05
          speaker: narrator
          text: >-
            皮马在育儿室里住得最久。他的棕色皮毛已经秃了一块又一块，连底下的接缝都露了出来。尾巴上的毛也被孩子们一根根拔去串珠子项链，最后没剩下几根。皮马见过许多机械玩具来到这里。他们刚来时吹嘘夸口，神气活现，没过多久主发条便断了，从此消失。皮马明白，他们始终只是玩具，不会变成别的东西。育儿室的魔法奇妙又神秘，只有像皮马这样年老、聪明、见多识广的玩具，才真正懂得其中的奥秘。
        - id: ch01-b06
          speaker: narrator
          text: >-
            一天，保姆还没来收拾屋子，兔子和皮马并排躺在壁炉挡板旁。兔子终于问出了藏在心里的疑问。
        - id: ch01-b07
          speaker: velveteen_rabbit
          text: “‘真的’到底是什么意思？是不是肚子里会嗡嗡响，身上还伸着一根把手？”
        - id: ch01-b08
          speaker: skin_horse
          text: >-
            真不真，不是看你怎么做出来，而是看后来有什么事发生在你身上。一个孩子爱你很久很久，不只是拿你玩，而是打心里爱你，你就会变成真的。
        - id: ch01-b09
          speaker: velveteen_rabbit
          text: “那会疼吗？”
        - id: ch01-b10
          speaker: skin_horse
          text: “有时会疼。不过你一旦成了真的，疼也就不算什么了。”
        - id: ch01-b11
          speaker: narrator
          text: 皮马一向说实话。兔子想了想，又问了下去。
        - id: ch01-b12
          speaker: velveteen_rabbit
          text: “是像上发条那样，一下子就变成真的，还是慢慢变的？”
        - id: ch01-b13
          speaker: skin_horse
          text: >-
            不是一下子。你会一点一点变成真的，要花很长时间。所以，容易坏、有尖角，或者必须小心保管的玩具，很少能走到那一步。通常等你成了真的，身上的毛已经被爱掉了，眼睛会脱落，关节会松开，模样也会很破旧。可这些全都不要紧。一旦成了真的，你就不会再丑了，除非看你的人根本不明白。
        - id: ch01-b14
          speaker: velveteen_rabbit
          text: “这么说，你已经是真的了吧？”
        - id: ch01-b15
          speaker: narrator
          text: >-
            话刚出口，兔子就后悔了。他怕皮马会觉得难堪，可皮马只是微微一笑。
        - id: ch01-b16
          speaker: skin_horse
          text: >-
            是男孩的叔叔让我变成真的。那已经是许多年前的事了。你成了真的以后，就再也不会变回去。这份真实会永远留下来。
        - id: ch01-b17
          speaker: narrator
          text: >-
            兔子轻轻叹了口气。这样的魔法，恐怕很久以后才会落到自己身上吧。他多想变成真的，亲自尝尝那是什么感觉。可一想到自己会变得破旧，眼睛和胡须也会一一掉落，他又觉得难过。要是能够成为真的，却不必经历那些叫人难受的变化，该有多好啊。
    - id: ch02
      title: 男孩的兔子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            育儿室归保姆管。有时她任由玩具躺在地上，有时又毫无缘由地像一阵大风卷过来，把他们统统塞进柜子。她说这是收拾屋子，玩具们却全都讨厌，尤其是铁皮玩具。兔子没那么怕，因为无论被扔到哪儿，他都会软软地落下。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天晚上，男孩临睡前找不到平常陪他的瓷狗。保姆正在忙，不愿这时候再去找。她瞧见玩具柜开着，顺手便把兔子揪了出来。
        - id: ch02-b03
          speaker: nana
          text: “来，抱着你的旧兔子吧。今晚有他陪你就够了。”
        - id: ch02-b04
          speaker: narrator
          text: >-
            保姆拽着兔子的一只耳朵，把他塞进男孩怀里。从那晚起，一连许多个夜晚，绒布兔子都睡在男孩床上。起初他并不好受。男孩搂得太紧，还会翻身压住他，有时又把他挤进枕头底下，害他几乎喘不过气。他也想念寂静的月夜，想念和皮马说话的时光。
        - id: ch02-b05
          speaker: narrator
          text: >-
            可他很快就喜欢上了这里。男孩会同他聊天，还在被窝里搭出一条条地道，说那就是真兔子住的洞穴。保姆去吃晚饭后，壁炉台上的小夜灯还亮着，他们便压低声音，痛痛快快地玩起游戏。等男孩睡着，兔子就依偎到他温暖的小下巴下面，安安稳稳地做梦。男孩的双手会整整一夜搂着他，一刻也不松开。
        - id: ch02-b06
          speaker: narrator
          text: >-
            日子一天天过去，小兔子快活得没有发现，自己漂亮的绒毛已经磨旧，尾巴也脱了线。男孩亲吻他的鼻子，连最后一点粉红色都亲掉了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            春天到了，他们整日待在花园。男孩去哪儿都带着兔子。他们坐过独轮车，在草地上野餐。花圃后面的覆盆子丛下，男孩还替他盖过一座座美丽的仙子小屋。一次，男孩忽然被叫去外面喝下午茶，竟把兔子忘在草坪上，直到夜色很深。男孩没有兔子便睡不着，保姆只好举着蜡烛，在黑暗里到处寻找。
        - id: ch02-b08
          speaker: narrator
          text: >-
            兔子被露水浸得湿透，又在花坛的洞穴里滚得满身是土。保姆拿围裙角擦着他，嘴里不停抱怨。
        - id: ch02-b09
          speaker: nana
          text: “你非得抱着这只旧兔子不可！不过一个玩具，何必闹这么大。”
        - id: ch02-b10
          speaker: narrator
          text: 男孩马上坐起来，朝她伸出双手。
        - id: ch02-b11
          speaker: boy
          text: “把兔子还给我！你不许叫他玩具。他是真的！”
        - id: ch02-b12
          speaker: narrator
          text: >-
            小兔子听见了，心里满是欢喜。皮马的话终于应验，育儿室的魔法已经发生在他身上。他不再只是玩具。他是真的，是男孩亲口这样说的。
        - id: ch02-b13
          speaker: narrator
          text: >-
            那一夜，他幸福得几乎无法入睡。小小的木屑心里涌动着那么多爱，仿佛马上就会胀破。那双靴扣做的眼睛早已失去从前的光泽，此刻却有了智慧而美丽的神采。第二天早晨，连保姆抱起他时也看出了这份变化。
        - id: ch02-b14
          speaker: nana
          text: “瞧呀，这只旧兔子的神情，还真像什么都明白。”
        - id: ch02-b15
          speaker: narrator
          text: 那真是一个美妙的夏天。
    - id: ch03
      title: 树林里的兔子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            屋子附近有片树林。六月的黄昏很长，男孩吃过下午茶就爱去那里玩，也总会带上绒布兔子。他要去采花，或到树丛里玩强盗之前，会先在蕨草中替兔子做个舒适的小窝。男孩心地善良，总惦记着让兔子待得舒服。
        - id: ch03-b02
          speaker: narrator
          text: >-
            一天傍晚，兔子独自躺在窝里，看蚂蚁从两只绒布爪子间来回穿过。两个陌生的家伙忽然从高高的蕨草中钻了出来。他们也是兔子，却浑身长毛，还像刚做出来一样崭新。想必他们的手艺好得不得了，因为身上一条缝都没有。活动起来时，他们的样子古怪地变来变去，一会儿细长，一会儿又变得圆胖，不像绒布兔子无论怎么动都只有同一个形状。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他们脚步轻轻，抽着鼻子凑了过来。兔子使劲找他们身上的发条机关，因为他以为，会跳的东西总得上发条。可他什么也没看见。这两只大概是全新的品种。双方互相盯着，那两个鼻子始终抽个不停。
        - id: ch03-b04
          speaker: wild_rabbit
          text: “你为什么不起来，跟我们一起玩？”
        - id: ch03-b05
          speaker: velveteen_rabbit
          text: “我这会儿不想玩。”
        - id: ch03-b06
          speaker: narrator
          text: >-
            他不愿承认自己没有发条。那只有毛的兔子哼了一声，猛地往旁边一跃，再用后腿站了起来。
        - id: ch03-b07
          speaker: wild_rabbit
          text: “这太容易了。你肯定做不到吧？”
        - id: ch03-b08
          speaker: velveteen_rabbit
          text: “谁说我不会？我能跳得比什么都高！”
        - id: ch03-b09
          speaker: narrator
          text: >-
            其实，他说的是男孩把他扔出去的时候，但他才不想告诉对方。
        - id: ch03-b10
          speaker: wild_rabbit
          text: “那你能用后腿蹦吗？”
        - id: ch03-b11
          speaker: narrator
          text: >-
            这问题真可怕。绒布兔子根本没有后腿，整个后半截连在一起，活像一只针垫。他端端正正坐在蕨草里，盼望对方看不出来。
        - id: ch03-b12
          speaker: velveteen_rabbit
          text: “我说了，我就是不想蹦。”
        - id: ch03-b13
          speaker: narrator
          text: 野兔的眼睛很尖。那只兔子伸长脖子，仔细一看，马上叫了起来。
        - id: ch03-b14
          speaker: wild_rabbit
          text: “他连后腿都没有！哪有兔子不长后腿的？”
        - id: ch03-b15
          speaker: narrator
          text: 他说完便笑了。
        - id: ch03-b16
          speaker: velveteen_rabbit
          text: “我当然有后腿！我现在正坐在腿上！”
        - id: ch03-b17
          speaker: wild_rabbit
          text: “那就像我这样，把腿伸出来给我看看。”
        - id: ch03-b18
          speaker: narrator
          text: >-
            野兔转着圈跳起舞来，弄得小兔子头都晕了。小兔子说自己不喜欢跳舞，宁可坐着不动，可他心里其实渴望得不得了。一阵陌生而痒酥酥的感觉窜遍全身。只要能像他们那样蹦跳，他愿意拿任何东西来换。
        - id: ch03-b19
          speaker: narrator
          text: >-
            陌生兔子停下来，靠得那么近，长胡须都擦到了他的耳朵。突然，野兔皱起鼻子，压低双耳，向后跳开。
        - id: ch03-b20
          speaker: wild_rabbit
          text: “他的味道不对！他根本不是兔子，也不是真的！”
          emotion: surprised
        - id: ch03-b21
          speaker: velveteen_rabbit
          text: “我是真的！男孩亲口说过，我是真的！”
          emotion: sad
        - id: ch03-b22
          speaker: narrator
          text: >-
            小兔子几乎哭了。就在这时，脚步声响起来，男孩从旁边跑过。两只野兔用力一蹬，白尾巴一闪，便没了踪影。
        - id: ch03-b23
          speaker: velveteen_rabbit
          text: “回来和我玩吧！求求你们回来，我知道自己是真的！”
          emotion: sad
        - id: ch03-b24
          speaker: narrator
          text: >-
            没有谁回答他。蚂蚁仍旧来回奔忙，野兔经过的地方，蕨草轻轻摇着。绒布兔子孤零零地留下来，不明白他们为什么那样跑掉，为什么不能留下陪他说话。他一动不动地躺了很久，始终望着蕨草，盼着那两只兔子回来。可他们再也没有出现。太阳越来越低，小小的白色飞蛾一只只飞了出来。最后，男孩才来到林中，把他抱回了家。
        - id: ch03-b25
          speaker: narrator
          text: >-
            几个星期过去，兔子变得又老又破，男孩却仍然那么用力地爱他。他的胡须全被爱掉了，耳朵里的粉红衬布变成灰色，身上的棕斑也渐渐褪去。他甚至失去了原来的形状，除了男孩，几乎谁也看不出他还是只兔子。可在男孩眼里，他始终很美，兔子也只在乎这一点。别人觉得他长成什么模样，他一点也不放在心上。育儿室的魔法已把他变成真的，一旦成了真的，破旧便不再要紧。
        - id: ch03-b26
          speaker: narrator
          text: 后来有一天，男孩生病了。
    - id: ch04
      title: 鸡舍后面
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            男孩的脸烧得通红，睡着了还在说话。他小小的身体滚烫，抱紧兔子时，兔子也觉得灼热。陌生的人在育儿室里进进出出，灯火整夜不灭。绒布兔子一直藏在被窝里，不敢动弹。他怕被人发现后带走，因为他知道男孩需要自己。
        - id: ch04-b02
          speaker: narrator
          text: >-
            那段日子又长又累。男孩病得不能玩，兔子整天无事可做，也觉得很无聊。可他耐心守在身边，只盼男孩重新好起来。他盼望他们再去花园，在花朵和蝴蝶中间玩耍，也盼望回到覆盆子丛，像从前那样痛痛快快地做游戏。他把这些日后要做的好玩事情一件件想好。等男孩半睡半醒时，他便爬到枕头旁边，在男孩耳边轻声讲给他听。
        - id: ch04-b03
          speaker: narrator
          text: >-
            后来，男孩终于退烧了。他能坐起来看图画书，兔子便依偎在一旁。又过了一天，大人们准许他起床穿衣。那天阳光明亮，窗户敞开着。男孩裹着披肩，被抱去了阳台，兔子却还缠在床上的被褥中，独自想着心事。
        - id: ch04-b04
          speaker: narrator
          text: >-
            男孩明天要去海边，一切都已安排好，只剩照医生的吩咐办事。兔子躺在被窝底下，只从被子边缘露出脑袋，静静听大人们商量。他们说房间必须彻底消毒，男孩卧病时在床上碰过的图画书和玩具也全要烧掉。兔子却没有听懂危险，只顾着高兴。他以为自己明天也会去海边。男孩常说起那里涌来的大浪、小小的螃蟹和一座座沙堡，他早就想亲眼看看了。
        - id: ch04-b05
          speaker: narrator
          text: 这时，保姆忽然发现了他。
        - id: ch04-b06
          speaker: nana
          text: “那他的旧兔子要怎么处理？”
        - id: ch04-b07
          speaker: doctor
          text: “那只兔子满是猩红热病菌，立刻烧掉。别说傻话了，给孩子换只新的，这只绝不能再碰。”
        - id: ch04-b08
          speaker: narrator
          text: >-
            小兔子就这样同旧图画书和一堆废物装进麻袋，送到了花园尽头的鸡舍后面。那里正适合生篝火，可园丁忙着挖马铃薯、摘青豌豆，答应第二天一早再来烧掉整袋东西。
        - id: ch04-b09
          speaker: narrator
          text: >-
            当晚，男孩换了间卧室，还有一只新的白绒兔子陪睡。那只兔子漂亮极了，长着真正的玻璃眼睛，可男孩满脑子都是第二天的海边，根本顾不上新玩具。
        - id: ch04-b10
          speaker: narrator
          text: >-
            男孩睡着了，梦里全是海边。小兔子却躺在鸡舍后的角落，夹在旧图画书中间，孤单得很。幸好麻袋口没有扎紧，他扭动了好一阵，终于从开口处探出头来，朝外张望。夜里冷得他微微发抖。他从来都睡在好好的床铺上，可身上的绒布早被一次次拥抱磨得又薄又秃，再也不能替他挡住寒意。
        - id: ch04-b11
          speaker: narrator
          text: >-
            他望见附近高大浓密的覆盆子丛，像一片热带密林。曾经，他和男孩在那些阴影里度过洒满阳光的早晨。那一段段快乐时光仿佛从眼前经过，而且一段比一段美。他想起花坛中的仙子小屋，想起树林里的宁静黄昏，也想起自己躺在蕨草里，任小蚂蚁爬过爪子的感觉。最难忘的，还是第一次知道自己成了真的那一天。
        - id: ch04-b12
          speaker: narrator
          text: >-
            皮马那么智慧、那么温柔，曾告诉过他这一切。可如果被人爱过，失去了美丽，又变成真的，最后却要落得这样的结局，那还有什么用呢？一滴真正的眼泪顺着他破旧的绒布鼻子滚下来，落进土里。
        - id: ch04-b13
          speaker: narrator
          text: >-
            奇异的事情发生了。泪水落下的地方，长出一朵花。它和花园里所有花都不同，细长的叶子绿得像翡翠，中间托着金杯一样的花朵。小兔子看得忘了哭。花瓣缓缓打开，一位仙子从花心里走了出来。
        - id: ch04-b14
          speaker: narrator
          text: >-
            她是世上最美的仙子。她的裙子由珍珠和露珠织成，头发里和颈间都戴着鲜花，脸庞比花儿还要完美。她走近兔子，把他抱起来，亲了亲那只湿漉漉的绒布鼻子。
    - id: ch05
      title: 在所有人眼里都是真的
      blocks:
        - id: ch05-b01
          speaker: nursery_fairy
          text: “小兔子，你不知道我是谁吗？”
        - id: ch05-b02
          speaker: narrator
          text: >-
            兔子抬头望着她。他觉得自己仿佛见过这张脸，却怎么也记不起是在哪里。
        - id: ch05-b03
          speaker: nursery_fairy
          text: >-
            我是育儿室魔法仙子。那些被孩子爱过的玩具，都由我照看。等他们老了、破了，孩子不再需要他们，我便来接走他们，再把他们变成真的。
        - id: ch05-b04
          speaker: velveteen_rabbit
          text: “难道我以前不是真的吗？”
        - id: ch05-b05
          speaker: nursery_fairy
          text: “因为男孩爱你，所以在他眼里，你是真的。现在，我要让你在每一个人眼里都是真的。”
        - id: ch05-b06
          speaker: narrator
          text: >-
            仙子把小兔子紧紧抱在怀里，带着他飞进树林。这时月亮已经升起来了，银白的月光照亮四周。整座森林美得像梦一样，蕨叶仿佛蒙着一层银霜，闪闪发光。树干之间的空地上，野兔正踩着天鹅绒般的草地，同自己的影子一起跳舞。看见仙子，他们立刻停下来，围成一圈，好奇地望着她。
        - id: ch05-b07
          speaker: nursery_fairy
          text: >-
            我带来了一位新伙伴。你们要好好待他，把兔子王国里该懂的事都教给他。从今以后，他会永远和你们生活在一起。
        - id: ch05-b08
          speaker: narrator
          text: 仙子又吻了兔子一下，把他轻轻放到草地上。
        - id: ch05-b09
          speaker: nursery_fairy
          text: “去吧，小兔子，跑起来，跟大家一起玩。”
        - id: ch05-b10
          speaker: narrator
          text: >-
            小兔子却坐在那里，一动也不动。看着四周跳舞的野兔，他突然记起自己没有后腿，后半截只是整整一块。他不愿让大家发现。可他不知道，仙子最后那个吻已经把他彻底改变了。
        - id: ch05-b11
          speaker: narrator
          text: >-
            他也许会因为害羞，继续在那里坐上很久。偏偏这时，有什么东西弄得他的鼻子痒起来。他根本没来得及想自己在做什么，便抬起一只后脚去挠。后脚！他真的有后腿了！暗淡的绒布不见了，身上长出柔软光亮的棕色皮毛。耳朵会自己抽动，胡须也变得那么长，低头时都能擦到草叶。
        - id: ch05-b12
          speaker: narrator
          text: >-
            小兔子纵身一跃。第一次用真正的后腿奔跑，那份快活简直无法形容。他在草地上不停跳跃，一会儿像别的兔子那样侧身蹦过去，一会儿又欢快地转着圈。那双新后腿越用越灵活，他也越来越兴奋。等他终于肯停下来，四下寻找仙子时，她已经悄然不见了。
        - id: ch05-b13
          speaker: narrator
          text: 他终于成了一只真正的兔子，也终于在兔子们中间找到了家。
        - id: ch05-b14
          speaker: narrator
          text: >-
            秋天过去了，冬天也过去了。第二年春天，白昼重新变得温暖而明亮，男孩来到屋后的树林里玩耍。他正玩着，两只兔子从蕨草中悄悄钻出来，探头看着他。其中一只从头到脚都是棕色，另一只的皮毛底下却透着奇怪的斑纹，仿佛很久以前身上曾有过棕白斑点，到了今天仍能隐约看见。
        - id: ch05-b15
          speaker: narrator
          text: >-
            那只兔子有柔软的小鼻子，还有一双圆圆的黑眼睛。鼻子和眼睛之间仿佛藏着一种熟悉的神情，让男孩越看越觉得似曾相识。看着看着，他心里忽然冒出一个念头，想起了自己生猩红热时弄丢的那只旧兔子。
        - id: ch05-b16
          speaker: boy
          text: “咦，他和我从前那只旧兔子真像！”
        - id: ch05-b17
          speaker: narrator
          text: >-
            可男孩永远不会知道，眼前的确实就是他的兔子。他回到这里，是为了看一看那个最先帮助他变成真的孩子。
