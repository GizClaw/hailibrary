cover_prompt: |-
  A wordless cover scene in an autumn English woodland shows Timmy Tiptoes gathering food with Goody before winter. Timmy is a plump gray squirrel with a pale belly and a small green waistcoat, while Goody is a graceful gray squirrel in a russet skirt and cream apron, both carrying hazelnuts. A striped chipmunk named Chippy Hackee peeks from a hollow tree as a little bird watches from a branch above. Timmy and Goody pour their shared harvest into the tree hollow, making cooperation and preparation the focal action. Use a low woodland-floor three-quarter view with roots and mushrooms leading toward golden trees and generous pale sky above the canopy. Keep animal anatomy believable, clothing simple and early-twentieth-century, and every design independent of existing illustrations or adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
