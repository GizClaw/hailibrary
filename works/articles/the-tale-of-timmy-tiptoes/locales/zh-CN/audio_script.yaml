audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻柔幽默的讲述感
        timbre: 清澈圆润
        pace: 舒缓
        pitch: 中音
    timmy:
      display_name: 蒂米·踮脚尖
      tts:
        delivery: 和气务实，乐呵呵而不慌不忙
        timbre: 柔和厚实
        pace: 从容
        pitch: 中低音
    goody:
      display_name: 古迪·踮脚尖
      tts:
        delivery: 亲切能干，心里有什么便直说
        timbre: 温暖明亮
        pace: 适中
        pitch: 中高音
    silvertail:
      display_name: 银尾巴
      tts:
        delivery: 冲动多疑，说话尖锐
        timbre: 干涩细硬
        pace: 急促
        pitch: 中高音
    squirrel_2:
      display_name: 松鼠乙
      tts:
        delivery: 激动强硬，随声起哄
        timbre: 轻而粗粝
        pace: 急促
        pitch: 中音
    squirrel_3:
      display_name: 松鼠丙
      tts:
        delivery: 忙乱而斩钉截铁
        timbre: 清脆尖细
        pace: 急促
        pitch: 高音
    first_bird:
      display_name: 第一只小鸟
      tts:
        delivery: 明快悦耳，反复吟唱
        timbre: 细小如铃
        pace: 轻快
        pitch: 高音
    second_bird:
      display_name: 第二只小鸟
      tts:
        delivery: 活泼跳荡，唱腔俏皮
        timbre: 小巧清亮
        pace: 轻快
        pitch: 高音
    chippy:
      display_name: 奇比·哈基
      tts:
        delivery: 伶俐好客，笑声里带点淘气
        timbre: 纤细活泼
        pace: 明快
        pitch: 高音
    mrs_chippy:
      display_name: 奇比·哈基太太
      tts:
        delivery: 利落讲究，越说越气恼
        timbre: 细亮
        pace: 较快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 过冬的坚果
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有只灰松鼠叫蒂米·踮脚尖。他胖乎乎的，小日子过得很舒坦。他和太太古迪住在高高的树梢上，窝顶铺满了树叶。
        - id: ch01-b02
          speaker: narrator
          text: 一天，蒂米坐在窝外吹风。他甩着尾巴，乐呵呵地开了口。
        - id: ch01-b03
          speaker: timmy
          text: 古迪小娘子，坚果都熟了。咱们得多攒一些，冬天和明年春天才有得吃。
        - id: ch01-b04
          speaker: narrator
          text: 古迪正忙着把苔藓塞进窝顶的缝里。
        - id: ch01-b05
          speaker: goody
          text: 窝里多暖和呀。这个冬天，咱们尽管安安稳稳地睡大觉。
        - id: ch01-b06
          speaker: timmy
          text: 可要是春天没东西吃，等咱们醒来，可就要瘦上一大圈了。
        - id: ch01-b07
          speaker: narrator
          text: 蒂米一向想得周到。于是，他和古迪去了坚果丛。那里已经来了不少松鼠。蒂米把外套脱下来挂在细树枝上，夫妻俩躲开大家，安静地忙活起来。
        - id: ch01-b08
          speaker: narrator
          text: 他俩每天都跑上好几趟，摘下大把大把的坚果，再装进袋子运回去。他们把坚果藏进窝树附近的几个空树墩。等那些树墩全都装满了，他们又找到了一个高高的树洞。那里从前住过啄木鸟。
        - id: ch01-b09
          speaker: narrator
          text: 坚果倒进洞里，骨碌碌地往下滚，往下，再往下。
        - id: ch01-b10
          speaker: goody
          text: 以后怎么拿出来呢？这个树洞活像一只存钱罐！
        - id: ch01-b11
          speaker: narrator
          text: 蒂米探头往洞里瞧了瞧。
        - id: ch01-b12
          speaker: timmy
          text: 亲爱的，等到春天，我早就瘦得多啦。
        - id: ch01-b13
          speaker: narrator
          text: 就这样，他们攒下了许许多多的坚果，一颗也没有丢。别的松鼠把坚果埋进土里，常常要丢掉一多半，因为谁也记不全那些地方。
    - id: ch02
      title: 小鸟惹出的祸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 全树林最健忘的，要数银尾巴。他刚挖了几下就忘了地方，只好再换一处。谁知这一挖，竟挖到了别人的坚果，一场架就这么打了起来。其他松鼠也四处乱挖，整片树林顿时闹翻了天。
        - id: ch02-b02
          speaker: narrator
          text: 偏偏这时，一群小鸟从灌木间飞过。它们正在找绿毛毛虫和蜘蛛，不同的小鸟唱着不同的调子。
        - id: ch02-b03
          speaker: first_bird
          text: 谁把我的果儿刨？谁把我的果儿刨？
        - id: ch02-b04
          speaker: second_bird
          text: 一小口面包，奶酪没有！一小口面包，奶酪没有！
        - id: ch02-b05
          speaker: narrator
          text: 松鼠们一路跟着听。第一只小鸟飞进一丛灌木，蒂米和古迪正好在那里扎紧口袋。
        - id: ch02-b06
          speaker: first_bird
          text: 谁把我的果儿刨？谁把我的果儿刨？
        - id: ch02-b07
          speaker: narrator
          text: 蒂米没搭腔，只管接着干活。小鸟本来也没想听谁回答。它天生就是这么唱的，那句话什么也不代表。
        - id: ch02-b08
          speaker: narrator
          text: 可其他松鼠听了，竟一起扑向蒂米。他们又打又抓，还把他的坚果袋掀翻了。那只小鸟明明无辜，却惹出了所有的乱子。它自己也吓坏了，扑棱一下飞走了。
        - id: ch02-b09
          speaker: narrator
          text: 蒂米在地上滚了好几圈，爬起来便往家逃。大群松鼠从后面追了上来。
        - id: ch02-b10
          speakers: [silvertail, squirrel_2, squirrel_3]
          ensemble: chorus
          text: 谁把我的果儿刨？
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 他们逮住蒂米，把他拖到那个小圆洞所在的树上。那正是蒂米先前用来存放坚果的树。松鼠们把他往洞里硬塞。洞口远比蒂米的身子小。他们狠命地挤，居然没挤断他的肋骨，实在是个奇迹。
        - id: ch02-b12
          speaker: silvertail
          text: 就让他待在里面，什么时候认罪，什么时候再出来！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 银尾巴又朝树洞里吼了一声。
        - id: ch02-b14
          speaker: silvertail
          text: 到底是谁刨了我的果儿？
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 蒂米一句也没回答。他已经摔进树洞深处，正落在自己的半配克坚果上。他摔得昏昏沉沉，躺在那里一动不动。
    - id: ch03
      title: 树洞里的日子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 古迪捡起坚果袋，独自回了家。她替蒂米沏好一杯茶，可等来等去，蒂米还是没有回来。
        - id: ch03-b02
          speaker: narrator
          text: 古迪孤零零地熬过了难过的一夜。第二天一早，她壮着胆子回坚果丛找丈夫，那些坏心眼的松鼠却把她赶走了。
        - id: ch03-b03
          speaker: narrator
          text: 她走遍树林，一路喊着蒂米的名字。
        - id: ch03-b04
          speaker: goody
          text: 蒂米·踮脚尖！蒂米·踮脚尖！你到底在哪儿呀？
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 与此同时，蒂米醒了。他躺在一张苔藓小床上，四周黑漆漆的，身上处处都疼。这里好像是在地底下。肋骨一疼，他便咳嗽起来，还难受得直哼哼。
        - id: ch03-b06
          speaker: narrator
          text: 一阵吱吱喳喳的声音传来。有只带条纹的小花栗鼠举着夜灯，出现在他面前。
        - id: ch03-b07
          speaker: chippy
          text: 你醒啦？现在觉得好一点没有？
        - id: ch03-b08
          speaker: narrator
          text: 小花栗鼠对蒂米好极了，把自己的睡帽也借给了他。他家里储备充足，到处都是吃的。原来，坚果一直从树顶噼里啪啦地落进来。
        - id: ch03-b09
          speaker: chippy
          text: 不光是这些，我还从地底下挖到了几颗呢！
        - id: ch03-b10
          speaker: narrator
          text: 听完蒂米的遭遇，小花栗鼠笑个不停。蒂米卧床养伤，他就不停地劝蒂米吃坚果。
        - id: ch03-b11
          speaker: timmy
          text: 可我不瘦下来，怎么钻得出那个洞？古迪一定在为我着急！
        - id: ch03-b12
          speaker: chippy
          text: 再吃一颗吧。要不就吃两颗，我替你剥开。
        - id: ch03-b13
          speaker: narrator
          text: 于是，蒂米不但没变瘦，反倒一天比一天胖了。
    - id: ch04
      title: 又一场坚果雨
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 古迪又开始独自收集坚果。她早就怀疑，放进啄木鸟树洞的坚果根本拿不出来，所以再也不往那里放了。她换了一个地方，把装满坚果的袋子带到一条树根旁，再把坚果倒进树根下面。坚果骨碌碌地滚下去，往下，再往下。
        - id: ch04-b02
          speaker: narrator
          text: 有一次，她倒进去格外满的一大袋，下面清清楚楚地传来一声尖叫。等她再带一袋回来时，一只带条纹的小花栗鼠慌忙爬了出来。
        - id: ch04-b03
          speaker: mrs_chippy
          text: 楼下全塞满啦！客厅里堆的都是坚果，走廊上也滚得到处都是。偏偏我丈夫奇比·哈基还跑了，把我一个人扔在家里。你为什么一阵阵地往我家下坚果雨？
        - id: ch04-b04
          speaker: goody
          text: 真对不起，我根本不知道这里有人住。可是，奇比·哈基去哪儿了？我的丈夫蒂米·踮脚尖也不见了。
        - id: ch04-b05
          speaker: mrs_chippy
          text: 我知道奇比在哪儿。有只小鸟告诉了我。
        - id: ch04-b06
          speaker: narrator
          text: 奇比太太领着古迪来到啄木鸟住过的那棵树。她们凑在洞边，仔细听。树洞深处传来咔嚓咔嚓的夹壳声。随后，一个胖松鼠的声音和一个瘦松鼠的声音一起唱了起来。
        - id: ch04-b07
          speakers: [timmy, chippy]
          ensemble: duo
          text: 我和我家小老头儿闹翻了，这桩事情该怎么收场？爱怎么收场就怎么收场，快走开吧，你这小老头儿！
        - id: ch04-b08
          speaker: goody
          text: 你身子小，从这个圆洞挤得进去。
        - id: ch04-b09
          speaker: mrs_chippy
          text: 我当然进得去。可奇比会咬人！
        - id: ch04-b10
          speaker: narrator
          text: 下面又响起咬坚果和嚼坚果的声音。胖松鼠和瘦松鼠接着唱道。
        - id: ch04-b11
          speakers: [timmy, chippy]
          ensemble: duo
          text: 嘀哩咚的一天，咚嘀哩咚嘀！咚嘀哩嘀哩咚的一天！
        - id: ch04-b12
          speaker: narrator
          text: 古迪探头往洞里看，朝下面喊了起来。
        - id: ch04-b13
          speaker: goody
          text: 蒂米·踮脚尖！你真不像话呀，蒂米·踮脚尖！
        - id: ch04-b14
          speaker: timmy
          text: 是你吗，古迪·踮脚尖？当然是你啦！
        - id: ch04-b15
          speaker: narrator
          text: 蒂米爬到洞口，隔着洞亲了亲古迪。可他吃得太胖，怎么也钻不出来。奇比倒还钻得出去，却压根不想走。他待在下面，乐得咯咯直笑。
    - id: ch05
      title: 蒂米回家了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这样的日子过了整整两个星期。一阵大风终于刮掉树顶，洞口豁开了，雨水也灌了进来。
        - id: ch05-b02
          speaker: narrator
          text: 蒂米这才离开树洞，撑着雨伞回了家。
        - id: ch05-b03
          speaker: narrator
          text: 奇比却不肯走。树洞里明明住得很不舒服，他还是又露营了一个星期。
        - id: ch05-b04
          speaker: narrator
          text: 后来，一头大熊从树林里走过。他四处嗅着，也许同样在找坚果。
        - id: ch05-b05
          speaker: narrator
          text: 奇比见了，急急忙忙赶回家。谁知到家以后，他发现自己伤了风，鼻子也堵住了，比住在树洞里还难受。
        - id: ch05-b06
          speaker: narrator
          text: 从那以后，蒂米和古迪总要在储藏坚果的地方挂上一把小锁，牢牢锁好。
        - id: ch05-b07
          speaker: narrator
          text: 那只小鸟每次见到花栗鼠夫妇，还是会唱起同一句歌。
        - id: ch05-b08
          speaker: first_bird
          text: 谁把我的果儿刨？谁把我的果儿刨？
        - id: ch05-b09
          speaker: narrator
          text: 可是，从来没有谁回答它。
