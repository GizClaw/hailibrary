audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带一点郑重其事的童话幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    lucie:
      display_name: 露西
      tts:
        delivery: 天真直率，好奇心强
        timbre: 清亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    sally_henny_penny:
      display_name: 莎莉咯咯鸡
      tts:
        delivery: 干脆利落，带母鸡咯咯叫的节奏
        timbre: 明亮稍尖
        pace: 稍快
        pitch: 高音
    mrs_tiggy_winkle:
      display_name: 刺猬温迪格尔夫人
      tts:
        delivery: 客气勤快，略带羞怯和絮叨
        timbre: 温厚微哑
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 丢失的小手绢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个叫露西的小姑娘，住在小镇庄农场。她很乖，只是总爱弄丢小手帕。
        - id: ch01-b02
          speaker: narrator
          text: 这一天，她哭着跑进农家庭院，哭得别提多伤心了。三块小手绢不见了，就连小围裙也找不到了。
        - id: ch01-b03
          speaker: lucie
          text: 我的小手绢不见了！三块小手绢，还有一条小围裙！斑斑小猫，你见过吗？
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 小猫没有理她，只顾舔洗自己的白爪子。露西只好去问一只花母鸡。
        - id: ch01-b05
          speaker: lucie
          text: 莎莉咯咯鸡，你捡到我的三块小手绢了吗？
        - id: ch01-b06
          speaker: narrator
          text: 花母鸡一边咯咯叫，一边跑进了谷仓。
        - id: ch01-b07
          speaker: sally_henny_penny
          text: 我光着脚，光着脚，光着脚！
        - id: ch01-b08
          speaker: narrator
          text: 露西接着去问停在树枝上的知更鸟。知更鸟用乌亮的眼睛斜瞧她一眼，飞过篱笆门，转眼就不见了。
        - id: ch01-b09
          speaker: narrator
          text: 露西爬上篱笆门，望向农场后面的高山。山坡向上伸进云层，好像根本没有山顶。就在很高很高的地方，她仿佛看见草地上铺着几样白东西。
    - id: ch02
      title: 山肚子里的门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 露西迈开结实的小腿，使劲朝山上爬。她沿陡峭的小路越跑越高，回头一看，小镇庄已经远在脚下。从这里丢一颗小石子，兴许能正好落进农庄的烟囱。
        - id: ch02-b02
          speaker: narrator
          text: 不久，她遇见一眼从山坡上汩汩冒出的泉水。有人把小铁罐放在石头上接水，可那罐子还没蛋杯大，水早就溢出来了。
        - id: ch02-b03
          speaker: narrator
          text: 泉水打湿了小路的沙土。湿沙上，清清楚楚印着一个小得不得了的人留下的脚印。露西看见了，便顺着小路不停往前跑。
        - id: ch02-b04
          speaker: narrator
          text: 小路到了大岩石底下，忽然断了。短短的绿草上立着蕨梗做的晾衣杆，晾衣绳是用灯芯草一股股编成的，旁边还有一堆小衣夹。可是，没有一块小手帕。
        - id: ch02-b05
          speaker: narrator
          text: 小手绢没找到，那里倒有一扇门，直通山肚子。门里面，有人一边做事，一边唱着歌。
        - id: ch02-b06
          speaker: mrs_tiggy_winkle
          text: 洗得雪白又干净，哦！小小褶边夹在中，哦！熨得平，熨得烫，半点锈斑不许藏，哦！
        - id: ch02-b07
          speaker: narrator
          text: 露西敲了一下，又敲一下，歌声停了。里面响起一个细小而有些害怕的声音。
        - id: ch02-b08
          speaker: mrs_tiggy_winkle
          text: 是谁呀？
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: 露西推门一看，你猜山肚子里藏着什么？竟是一间干干净净的厨房。地上铺着石板，头顶横着木梁，和普通农家厨房一个样。只是屋顶低得快碰到她的头，锅子、盘子，连屋里每样东西都很小。
        - id: ch02-b10
          speaker: narrator
          text: 屋里暖融融的，飘着熨衣服的气味。桌旁站着一个矮胖的小人，手拿熨斗，不安地望着露西。
        - id: ch02-b11
          speaker: narrator
          text: 她束起印花布裙，在条纹衬裙外系了条大围裙。黑鼻子一吸一嗅，两只眼睛亮闪闪的。更稀奇的是，她的帽子下面没有金色卷发，只有一根根尖刺。
    - id: ch03
      title: 奇妙的洗衣房
      blocks:
        - id: ch03-b01
          speaker: lucie
          text: 你是谁？你有没有见过我的小手绢？
        - id: ch03-b02
          speaker: narrator
          text: 小人向露西屈膝行了一礼。
        - id: ch03-b03
          speaker: mrs_tiggy_winkle
          text: 见过的，小姐，要是您不嫌弃的话。我是刺猬温迪格尔夫人。是的，小姐，我浆洗和上浆可是一把好手！
        - id: ch03-b04
          speaker: narrator
          text: 她从洗衣篮里取出一件东西，铺到熨衣毯上。
        - id: ch03-b05
          speaker: lucie
          text: 那是什么？不会是我的小手绢吧？
        - id: ch03-b06
          speaker: mrs_tiggy_winkle
          text: 不是的，小姐。这件猩红色的小背心，是知更鸟的。
        - id: ch03-b07
          speaker: narrator
          text: 温迪格尔夫人熨好背心，叠整齐放在一边，又从晾衣架上拿下一样东西。
        - id: ch03-b08
          speaker: lucie
          text: 那也不是我的小围裙吧？
        - id: ch03-b09
          speaker: mrs_tiggy_winkle
          text: 不是，小姐。这是鹪鹩珍妮的锦缎桌布。黑醋栗酒染了这么大一片，实在难洗！
        - id: ch03-b10
          speaker: narrator
          text: 温迪格尔夫人的鼻子又吸了几下，眼睛闪了几下。她从炉边换来一只滚烫的熨斗。
        - id: ch03-b11
          speaker: lucie
          text: 瞧，那儿是我的小手绢！我的小围裙也在那里！
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: 温迪格尔夫人先把围裙熨得平平整整，再一道道压出细褶，最后提起来，把四周的花边轻轻抖开。
        - id: ch03-b13
          speaker: lucie
          text: 哎呀，熨得真漂亮！
          emotion: happy
        - id: ch03-b14
          speaker: lucie
          text: 那些长长的黄东西是什么？怎么还长着手套一样的指头？
        - id: ch03-b15
          speaker: mrs_tiggy_winkle
          text: 那是莎莉咯咯鸡的长袜。她天天在院里刨土，袜跟都磨穿了。这样下去，她很快就得光脚啦！
        - id: ch03-b16
          speaker: lucie
          text: 咦，这里又有一块小手绢。不过它是红的，不是我的吧？
        - id: ch03-b17
          speaker: mrs_tiggy_winkle
          text: 不是的，小姐。这是老兔太太的手绢，原来满是洋葱味。我把它分开来洗了，味道还是除不掉。
        - id: ch03-b18
          speaker: lucie
          text: 这里还有一块是我的。
        - id: ch03-b19
          speaker: lucie
          text: 那些小小的白东西又是什么？看着真有意思。
        - id: ch03-b20
          speaker: mrs_tiggy_winkle
          text: 是斑斑小猫的连指手套。我只要替她熨平，因为她会自己洗。
        - id: ch03-b21
          speaker: lucie
          text: 我的最后一块小手绢也在这儿！
          emotion: happy
        - id: ch03-b22
          speaker: lucie
          text: 你正在往浆水盆里蘸什么呀？
        - id: ch03-b23
          speaker: mrs_tiggy_winkle
          text: 这些是山雀汤姆的小衬衫胸片。他对衣服最挑剔啦！现在全都熨好了，该拿出去透透气了。
        - id: ch03-b24
          speaker: lucie
          text: 这些软软的、毛茸茸的衣服是谁的？
        - id: ch03-b25
          speaker: mrs_tiggy_winkle
          text: 那是斯凯尔吉尔的小羊羔们穿的羊毛外套。
        - id: ch03-b26
          speaker: lucie
          text: 小羊的外套也能脱下来吗？
        - id: ch03-b27
          speaker: mrs_tiggy_winkle
          text: 能呀，小姐。您看肩上的羊群标记。这件属于盖茨加斯庄，那三件来自小镇庄。送洗的时候，全都得做上标记才认得清。
        - id: ch03-b28
          speaker: narrator
          text: 温迪格尔夫人把各种样式、各种尺寸的衣服一件件挂起来。有老鼠的棕色小外套，有一件乌黑柔软、摸起来像丝绒的鼹鼠皮背心，还有松鼠纳特金那件没有尾摆的红燕尾服。
        - id: ch03-b29
          speaker: narrator
          text: 彼得兔的夹克缩水缩得厉害。还有一条没做标记的衬裙，洗着洗着就找不到主人了。等这些都挂好，篮子总算空了。
    - id: ch04
      title: 一路送衣下山
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 温迪格尔夫人沏了两杯茶，一杯给自己，一杯给露西。她们坐在长凳上，炉火就在面前烧着。两个人悄悄斜眼打量着对方。
        - id: ch04-b02
          speaker: narrator
          text: 她端杯子的手黑褐黑褐的，因为总泡肥皂水，皮肤皱得很。裙子和帽子上还戳满了发夹，根根尖头朝外。露西看着那些尖头，不敢坐得太近。
        - id: ch04-b03
          speaker: narrator
          text: 喝完茶，她们把衣服分别扎成小包。露西的三块小手帕叠进洗净的小围裙，再拿银色安全别针牢牢别好。
        - id: ch04-b04
          speaker: narrator
          text: 她们给炉火添上草炭，走出屋子，锁好门，又把钥匙藏到门槛底下。
        - id: ch04-b05
          speaker: narrator
          text: 然后，露西和温迪格尔夫人带着一包包衣服，迈着小步一路跑下山。
        - id: ch04-b06
          speaker: narrator
          text: 沿途不断有小动物从蕨丛里钻出来迎接她们。最先来的，是彼得兔和本杰明兔。
        - id: ch04-b07
          speaker: narrator
          text: 温迪格尔夫人一路走，一路把洗得洁净的衣服交还给大家。小动物和鸟儿们拿回自己的衣裳，对亲爱的温迪格尔夫人别提多感激了。
        - id: ch04-b08
          speaker: narrator
          text: 等她们走到山脚的篱笆门旁，所有衣服都送完了，再没有别的东西要拿。手里只剩下露西自己的那个小包袱。
    - id: ch05
      title: 她究竟是谁
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 露西提着包袱爬上篱笆门。她回过头，正想对洗衣妇说声晚安，再谢谢她。可怪事发生了。
        - id: ch05-b02
          speaker: narrator
          text: 温迪格尔夫人没有留下来听道谢，也没有等着收洗衣钱。她已经跑呀跑呀，一路跑回山上去了。
        - id: ch05-b03
          speaker: narrator
          text: 可她那顶带白褶边的帽子呢？她的披肩呢？她的裙子和衬裙又去了哪里？
        - id: ch05-b04
          speaker: narrator
          text: 她怎么越变越小，越变越黑褐，身上还冒出了密密的尖刺？原来呀，刺猬温迪格尔夫人根本就是一只刺猬。
        - id: ch05-b05
          speaker: narrator
          text: 如今，有些人说，小露西当时只是在篱笆门上睡着了。可如果那是一场梦，她后来怎么会拿着三块干净的小手绢，还有一条用银色安全别针别好的小围裙呢？
        - id: ch05-b06
          speaker: narrator
          text: 再说，我亲眼见过那扇门。它就在猫铃山的山背后。何况，我跟亲爱的刺猬温迪格尔夫人熟得很呢！
