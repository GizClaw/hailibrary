audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gentle sense of wonder
        timbre: clear and comforting
        pace: measured
        pitch: medium
    lucie:
      display_name: Lucie
      tts:
        delivery: direct, curious, and naturally childlike
        timbre: light and clear
        pace: lively
        pitch: medium-high
    sally_henny_penny:
      display_name: Sally Henny-penny
      tts:
        delivery: brisk and matter-of-fact with a clucking rhythm
        timbre: bright and slightly raspy
        pace: quick
        pitch: high
    mrs_tiggy_winkle:
      display_name: Mrs. Tiggy-winkle
      tts:
        delivery: polite, bustling, and a little breathy
        timbre: warm and textured
        pace: steady
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Lost Handkerchiefs
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a little girl named Lucie lived on a farm called Little-town. She was a good little girl, except for one thing. She was always losing her pocket handkerchiefs.
        - id: ch01-b02
          speaker: narrator
          text: One day, Lucie came into the farmyard crying as hard as she could.
        - id: ch01-b03
          speaker: lucie
          text: I've lost my pocket-handkin! Three handkins and a pinny! Tabby Kitten, have you seen them?
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: The kitten just kept washing her white paws. So Lucie turned to a speckled hen.
        - id: ch01-b05
          speaker: lucie
          text: Sally Henny-penny, did you find three pocket-handkins?
        - id: ch01-b06
          speaker: narrator
          text: But the speckled hen ran into the barn, clucking as she went.
        - id: ch01-b07
          speaker: sally_henny_penny
          text: I go barefoot, barefoot, barefoot!
        - id: ch01-b08
          speaker: narrator
          text: Then Lucie asked Cock Robin, who was perched on a twig. He looked sideways at her with one bright black eye. Without a word, he flew over a stile and away.
        - id: ch01-b09
          speaker: narrator
          text: Lucie climbed onto the stile and looked at the hill behind Little-town. It went up and up into the clouds, as if it had no top at all. Far up the hillside, she thought she could see some white things spread out on the grass.
    - id: ch02
      title: The Door in the Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Lucie scrambled up the hill as fast as her sturdy little legs could carry her. She followed a steep path higher and higher, until Little-town lay far below. From up there, she could almost have dropped a pebble down a chimney.
        - id: ch02-b02
          speaker: narrator
          text: Before long, she reached a spring bubbling out of the hillside. Someone had set a tin can on a stone to catch the water. But the can was no bigger than an egg cup, and the water was already spilling over. In the wet sand beside it, Lucie saw the footprints of a very small person.
        - id: ch02-b03
          speaker: narrator
          text: She ran on and on. At last, the path stopped beneath a great rock. The grass there was short and green. Clothes props made from bracken stems held up lines of braided rushes, and tiny clothespins lay in a heap. But Lucie's pocket handkerchiefs were nowhere to be seen.
        - id: ch02-b04
          speaker: narrator
          text: Then she noticed something else. A door led straight into the hill, and from behind it came a song.
        - id: ch02-b05
          speaker: mrs_tiggy_winkle
          text: Lily-white and clean, oh! Little frills between, oh! Smooth and hot, with never a rusty spot to be seen, oh!
        - id: ch02-b06
          speaker: narrator
          text: Lucie knocked once, then twice, cutting the song short. A small, frightened voice answered from inside.
        - id: ch02-b07
          speaker: mrs_tiggy_winkle
          text: Who's there?
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: Lucie opened the door. And what do you think she found inside the hill? It was a neat kitchen with a stone floor and wooden beams, just like any farm kitchen. Only this ceiling was so low that Lucie's head nearly touched it. The pots and pans were tiny, and so was everything else.
        - id: ch02-b09
          speaker: narrator
          text: The kitchen had a pleasant hot, singed smell. Beside the table stood a short, very stout person with an iron in her hand. She stared at Lucie anxiously.
        - id: ch02-b10
          speaker: narrator
          text: Her printed gown was tucked up beneath a large apron, and a striped petticoat showed underneath. Her little black nose went sniffle, sniffle, snuffle, and her eyes went twinkle, twinkle. Under her cap, where Lucie had yellow curls, this little person had prickles.
    - id: ch03
      title: Mrs. Tiggy-winkle's Laundry
      blocks:
        - id: ch03-b01
          speaker: lucie
          text: What's your name? Have my pocket-handkins turned up here?
        - id: ch03-b02
          speaker: narrator
          text: The little person gave a bobbing curtsy.
        - id: ch03-b03
          speaker: mrs_tiggy_winkle
          text: Oh, yes, if you please, miss. I'm Mrs. Tiggy-winkle, and I'm an excellent clear-starcher!
        - id: ch03-b04
          speaker: narrator
          text: She took something from a laundry basket and spread it across the ironing blanket.
        - id: ch03-b05
          speaker: lucie
          text: What have you got there? That's not one of my pocket-handkins.
        - id: ch03-b06
          speaker: mrs_tiggy_winkle
          text: Oh, no, miss. That's Cock Robin's little scarlet waistcoat.
        - id: ch03-b07
          speaker: narrator
          text: Mrs. Tiggy-winkle ironed the waistcoat, folded it, and set it aside. Then she lifted another piece from the clothes horse.
        - id: ch03-b08
          speaker: lucie
          text: Is that my pinny? I don't think it is.
        - id: ch03-b09
          speaker: mrs_tiggy_winkle
          text: No, miss. This is Jenny Wren's damask tablecloth. See those currant-wine stains? They are terribly hard to wash out.
        - id: ch03-b10
          speaker: narrator
          text: Mrs. Tiggy-winkle's nose went sniffle, sniffle, snuffle, and her eyes went twinkle, twinkle. She fetched another hot iron from the fire.
        - id: ch03-b11
          speaker: lucie
          text: There's one of my pocket-handkins! And there's my pinny!
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: Mrs. Tiggy-winkle ironed the pinny, pressed its pleats, and shook out the frills.
        - id: ch03-b13
          speaker: lucie
          text: Oh, it looks lovely!
          emotion: happy
        - id: ch03-b14
          speaker: lucie
          text: Those long yellow things have fingers, almost like gloves. What are they?
        - id: ch03-b15
          speaker: mrs_tiggy_winkle
          text: Those are Sally Henny-penny's stockings. Just look at the heels. She's worn them through by scratching in the yard! Soon she really will be barefoot.
        - id: ch03-b16
          speaker: lucie
          text: Oh, another handkersniff! That red one doesn't belong to me, though.
        - id: ch03-b17
          speaker: mrs_tiggy_winkle
          text: No, miss. It belongs to old Mrs. Rabbit, and it smelled so strongly of onions! I had to wash it by itself, but the smell still won't come out.
        - id: ch03-b18
          speaker: lucie
          text: Look, you found one more of mine.
        - id: ch03-b19
          speaker: lucie
          text: What are those funny little white things over there?
        - id: ch03-b20
          speaker: mrs_tiggy_winkle
          text: Those are Tabby Kitten's mittens. I only need to iron them. She washes them herself.
        - id: ch03-b21
          speaker: lucie
          text: And that's my last pocket-handkin!
          emotion: happy
        - id: ch03-b22
          speaker: lucie
          text: What are those little things you're dipping in the starch?
        - id: ch03-b23
          speaker: mrs_tiggy_winkle
          text: These are Tom Tits-mouse's little shirtfronts. He's terribly particular about them! Now the ironing is done, and I'm going to air the clothes.
        - id: ch03-b24
          speaker: lucie
          text: These are so soft and fluffy. What could they be?
        - id: ch03-b25
          speaker: mrs_tiggy_winkle
          text: Those are the woolly coats that belong to the little lambs at Skelghyl.
        - id: ch03-b26
          speaker: lucie
          text: The lambs can take their jackets off?
          emotion: surprised
        - id: ch03-b27
          speaker: mrs_tiggy_winkle
          text: Oh, yes, miss. You can see the sheep mark on the shoulder. This one is marked for Gatesgarth, and these three came from Little-town. Their coats are always marked when they're washed.
        - id: ch03-b28
          speaker: narrator
          text: Mrs. Tiggy-winkle hung up clothes in every shape and size. There were small brown coats for mice and a velvety black moleskin waistcoat. There was Squirrel Nutkin's red tailcoat, which had no tail, and Peter Rabbit's jacket, which had shrunk badly. She even found an unmarked petticoat that had gone missing in the wash. At last, the basket was empty.
    - id: ch04
      title: Down the Hill
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then Mrs. Tiggy-winkle made tea, one cup for herself and one for Lucie. They sat together on a bench in front of the fire, each peeking sideways at the other.
        - id: ch04-b02
          speaker: narrator
          text: The hand around Mrs. Tiggy-winkle's teacup was very brown and deeply wrinkled from the soapsuds. Hairpins poked backward through her gown and her cap. Lucie did not care to sit too close to her.
        - id: ch04-b03
          speaker: narrator
          text: When tea was over, they tied the clean clothes into bundles. Mrs. Tiggy-winkle folded Lucie's pocket handkerchiefs inside her clean pinny and fastened the bundle with a silver safety pin.
        - id: ch04-b04
          speaker: narrator
          text: They built up the fire with turf. Then they went outside, locked the door, and hid the key under the doorsill.
        - id: ch04-b05
          speaker: narrator
          text: Away they trotted down the hill, Lucie and Mrs. Tiggy-winkle, carrying all those bundles of clothes.
        - id: ch04-b06
          speaker: narrator
          text: As they followed the path, little animals came out from among the ferns to meet them. Peter Rabbit and Benjamin Bunny were the very first.
        - id: ch04-b07
          speaker: narrator
          text: Mrs. Tiggy-winkle handed out all the nice clean clothes. Every little animal and bird was very grateful to dear Mrs. Tiggy-winkle.
        - id: ch04-b08
          speaker: narrator
          text: By the time they reached the stile at the bottom of the hill, only Lucie's small bundle was left to carry.
    - id: ch05
      title: A Very Odd Thing
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Lucie scrambled over the stile with the bundle in her hand. Then she turned around to thank the washerwoman and wish her good night.
        - id: ch05-b02
          speaker: narrator
          text: But what a very odd thing! Mrs. Tiggy-winkle had not waited for Lucie's thanks, or even for the washing bill. She was running, running, running back up the hill.
        - id: ch05-b03
          speaker: narrator
          text: Where was her white frilled cap? Where were her shawl, her gown, and her petticoat? How small she had grown! How brown she was, and how completely covered in prickles!
        - id: ch05-b04
          speaker: narrator
          text: Why, Mrs. Tiggy-winkle was nothing but a hedgehog.
        - id: ch05-b05
          speaker: narrator
          text: Now, some people say little Lucie had fallen asleep on the stile. But if that were true, how did she come home with three clean pocket-handkins and a pinny, all fastened together with a silver safety pin?
        - id: ch05-b06
          speaker: narrator
          text: Besides, I have seen the door in the back of the hill called Cat Bells. And besides, I know dear Mrs. Tiggy-winkle very well.
