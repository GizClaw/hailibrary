cover_prompt: |-
  A wordless cover scene inside a tiny hillside laundry in Edwardian Cumbria shows Lucie visiting Mrs. Tiggy-Winkle. Lucie is a small girl with brown hair under a white bonnet, a blue pinafore over a cream dress, striped stockings, and buttoned shoes. Mrs. Tiggy-Winkle is a small brown hedgehog standing upright in a white cap, striped petticoat, blue dress, and clean apron, carrying a neatly folded stack of tiny handkerchiefs. She offers Lucie one freshly ironed white cloth beside a warm stove, wooden tub, iron, and baskets of animal clothes, making the kindly exchange the focal action. Use an intimate eye-level view through the round cottage doorway, with a glimpse of green fells outside and calm plain wall space at the top. Keep the setting and garments faithful to the early 1900s, the hedgehog anatomy recognizable, and all designs original rather than copied from adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
