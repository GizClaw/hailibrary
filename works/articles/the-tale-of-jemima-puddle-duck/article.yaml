cover_prompt: |-
  A wordless cover scene on an Edwardian English farm shows Jemima Puddle-Duck seeking a quiet nesting place near a woodland shed. Jemima is a white farm duck with a soft gray bonnet and blue patterned shawl, carrying a few pale eggs in a fold of cloth; a red fox in a neat brown coat sits at a respectful distance with his tail curled beside him. Behind Jemima, the collie dog Kep emerges alertly through foxgloves and ferns, while the farmyard remains visible beyond the trees. Jemima pauses between the inviting shed and Kep's protective approach, making her moment of uncertain choice the focal action. Use a low duck-height three-quarter view with the figures separated clearly and generous soft woodland sky above. Keep the tension gentle and non-frightening, animal anatomy credible, and every design based on the text rather than later adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
