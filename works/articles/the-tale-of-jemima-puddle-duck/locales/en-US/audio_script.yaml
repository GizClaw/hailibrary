audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor and gathering suspense
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jemima_puddle_duck:
      display_name: Jemima Puddle-Duck
      tts:
        delivery: earnest, determined, and touchingly trusting
        timbre: soft and bright
        pace: conversational
        pitch: medium-high
    mrs_rebeccah_puddle_duck:
      display_name: Mrs. Rebeccah Puddle-Duck
      tts:
        delivery: practical, frank, and mildly impatient
        timbre: crisp and mature
        pace: brisk
        pitch: medium
    foxy_gentleman:
      display_name: The Foxy Gentleman
      tts:
        delivery: polished and flattering at first, turning sharp and hurried
        timbre: smooth and dry
        pace: deliberate
        pitch: medium-low
    kep:
      display_name: Kep
      tts:
        delivery: watchful, direct, and quietly knowing
        timbre: firm and warm
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: Jemima Wants Her Own Nest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            What a funny sight it is to see a hen with a whole brood of ducklings!

            This is the story of Jemima Puddle-Duck. She was very annoyed because the farmer's wife would not allow her to hatch her own eggs.

            Jemima's sister-in-law, Mrs. Rebeccah Puddle-Duck, was perfectly happy to let someone else do the hatching.
        - id: ch01-b02
          speaker: mrs_rebeccah_puddle_duck
          text: |-
            I could never sit on a nest for twenty-eight days. You couldn't either, Jemima. You'd let the eggs get cold, and you know it!
        - id: ch01-b03
          speaker: jemima_puddle_duck
          text: |-
            I want to hatch my own eggs. I'll do it all by myself!
        - id: ch01-b04
          speaker: narrator
          text: |-
            Jemima tried hiding her eggs, but every time, someone found them and carried them away.

            At last she was desperate. She decided to build a nest far from the farm.

            One fine spring afternoon, she set off along the cart road over the hill. She wore a shawl and a poke bonnet. From the top of the hill, she could see a wood in the distance. It looked quiet and safe.

            Jemima was not used to flying. She ran a few yards downhill, flapping her shawl, and launched herself into the air. Once she had a good start, she flew beautifully.

            She skimmed over the treetops until she found an open clearing in the middle of the wood. Then she came down with a rather heavy landing and waddled around, looking for a dry place to nest.

            A tree stump among some tall foxgloves looked promising. But someone was already sitting on it: an elegantly dressed gentleman, reading a newspaper. He had pointed black ears and sandy-colored whiskers. Jemima tilted her bonnet and her head to one side.
        - id: ch01-b05
          speaker: jemima_puddle_duck
          text: Quack?
        - id: ch01-b06
          speaker: narrator
          text: The gentleman lifted his eyes above the newspaper and studied her. His long, bushy tail was tucked beneath him because the stump was damp.
        - id: ch01-b07
          speaker: foxy_gentleman
          text: Madam, have you lost your way?
        - id: ch01-b08
          speaker: narrator
          text: |-
            Jemima thought he was very handsome and wonderfully polite. She told him she was not lost. She was only searching for a good, dry nesting place.

            The sandy-whiskered gentleman gave her another curious look. Then he folded his newspaper and slipped it into his coat pocket. Jemima complained about the unnecessary hen who kept hatching her eggs.
        - id: ch01-b09
          speaker: foxy_gentleman
          text: |-
            Really? How very interesting. I wish I could meet that hen. I'd teach her to mind her own business!

            And finding a nest is no trouble at all. I have a whole sack of feathers in my woodshed. You won't bother anyone there, my dear madam. Stay as long as you please.
    - id: ch02
      title: The House Among the Foxgloves
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            The long-tailed gentleman led Jemima to a lonely, gloomy little house among the foxgloves. It was made of sticks and turf. Two broken pails, stacked one on the other, served as its chimney.
        - id: ch02-b02
          speaker: foxy_gentleman
          text: |-
            This is my summer home. My earth, or winter home, wouldn't be nearly as comfortable for you.
        - id: ch02-b03
          speaker: narrator
          text: |-
            Behind the house stood a falling-down shed made from old soapboxes. The gentleman opened its door and invited Jemima inside.

            Feathers nearly filled the shed. The air was stifling, but everything felt soft and cozy. Jemima was surprised to see so many feathers. Still, she had no trouble making herself a comfortable nest.

            When she came out, the gentleman was sitting on a log with his newspaper spread open. He was supposed to be reading, but his eyes kept peeking over the top.

            He was so polite that he almost seemed sorry to let Jemima return home for the night. He promised to guard her nest until she came back the next day.
        - id: ch02-b04
          speaker: foxy_gentleman
          text: |-
            I simply adore eggs and ducklings. I'd be proud to see a fine nest full of them in my woodshed.
        - id: ch02-b05
          speaker: narrator
          text: |-
            Jemima returned every afternoon. In time, she laid nine very large, greenish-white eggs. The foxy gentleman admired them tremendously. Whenever Jemima was away, he turned them over and counted them.

            At last, Jemima announced that she would begin sitting the next day.
        - id: ch02-b06
          speaker: jemima_puddle_duck
          text: |-
            I'll bring a bag of corn. Then I won't have to leave my nest until the eggs hatch. I can't let them get cold.
        - id: ch02-b07
          speaker: narrator
          text: Jemima was very conscientious about it.
        - id: ch02-b08
          speaker: foxy_gentleman
          text: |-
            Madam, please don't trouble yourself with a bag. I'll supply the oats. But before you begin that tiresome sitting, I want to give you a treat. We'll have a little dinner party, just the two of us!

            Would you bring some herbs from the farm garden for a savory omelet? Sage, thyme, mint, two onions, and a little parsley. I'll provide the lard for the stuffing—I mean, the lard for the omelet.
    - id: ch03
      title: Kep Hears the Whole Story
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            Jemima Puddle-Duck was a simple soul. Even the mention of sage and onions did not make her suspicious.

            She went around the farm garden, nibbling little pieces from all the different herbs used to stuff a roast duck. Then she waddled into the kitchen and took two onions from a basket.

            As she came out, she met Kep, the collie dog.
        - id: ch03-b02
          speaker: kep
          text: |-
            What are you doing with those onions? And where do you go all by yourself every afternoon, Jemima Puddle-Duck?
        - id: ch03-b03
          speaker: narrator
          text: |-
            Jemima was rather afraid of the collie, so she told him the whole story.

            Kep listened with his wise head tilted to one side. When she described the polite gentleman with sandy whiskers, Kep grinned.

            He asked her several careful questions. What did the wood look like? Exactly where were the house and the shed?

            Then Kep went out and trotted down the village. He was looking for two foxhound puppies who had gone walking with the butcher.
    - id: ch04
      title: The Last Visit to the Wood
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            On a sunny afternoon, Jemima Puddle-Duck went up the cart road for the last time. Bundles of herbs and a bag holding two onions weighed her down.

            She flew over the wood and landed across from the long-tailed gentleman's house.

            He sat on a log, sniffing the air and throwing nervous glances around the wood. When Jemima landed, he jumped.
        - id: ch04-b02
          speaker: foxy_gentleman
          text: |-
            Look at your eggs, then come straight into the house. Give me those herbs for the omelet. Hurry up!
        - id: ch04-b03
          speaker: narrator
          text: |-
            He sounded harsh. Jemima had never heard him speak that way before. She felt surprised and uneasy.

            While she was inside the shed, she heard quick footsteps pattering around the back. Someone with a black nose sniffed under the door, then locked it from the outside.

            Now Jemima was terribly frightened.

            A moment later, dreadful sounds burst out all around her. There was barking and baying, growling and howling, squealing and groaning.

            After that, no one ever saw the foxy-whiskered gentleman again.
    - id: ch05
      title: Jemima Comes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            Before long, Kep opened the shed door and let Jemima Puddle-Duck out.

            Unfortunately, before he could stop them, the puppies rushed inside and gobbled up every one of her eggs.

            Kep had a bite on his ear, and both puppies were limping.

            Jemima was escorted home in tears because her eggs were gone.

            In June, she laid some more eggs and was allowed to keep them herself. But only four hatched.
        - id: ch05-b02
          speaker: jemima_puddle_duck
          text: It was because of my nerves.
        - id: ch05-b03
          speaker: narrator
          text: But Jemima had always been a poor sitter.
