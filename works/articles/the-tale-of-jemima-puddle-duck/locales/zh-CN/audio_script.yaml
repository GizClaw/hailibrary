audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切机敏，带着含蓄的幽默与悬念
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    jemima:
      display_name: 杰米玛·帕德尔鸭
      tts:
        delivery: 认真固执，天真直率
        timbre: 圆润明亮
        pace: 中等，紧张时稍快
        pitch: 中高
    rebeccah:
      display_name: 瑞贝卡·帕德尔鸭太太
      tts:
        delivery: 爽快务实，略带数落
        timbre: 饱满清脆
        pace: 明快
        pitch: 中等
    fox:
      display_name: 沙黄胡子的先生
      tts:
        delivery: 表面文雅客气，暗藏狡猾与急躁
        timbre: 柔滑低沉
        pace: 从容，失态时短促
        pitch: 中低
    kep:
      display_name: 凯普
      tts:
        delivery: 沉着机警，问话直接
        timbre: 厚实清楚
        pace: 稳健
        pitch: 低
  chapters:
    - id: ch01
      title: 杰米玛要自己孵蛋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 母鸡身后跟着一窝小鸭子，那模样真是滑稽。事情还得从杰米玛·帕德尔鸭说起。农场主的妻子不让她自己孵蛋，她为此很恼火。她的妯娌瑞贝卡太太倒巴不得有人代劳。
        - id: ch01-b02
          speaker: rebeccah
          text: 要我在窝里守上二十八天，我可坐不住。杰米玛，你也一样。你准会让蛋凉掉，这一点你自己清楚！
        - id: ch01-b03
          speaker: jemima
          text: 我偏要孵自己的蛋，而且一只也不让别人帮忙！
        - id: ch01-b04
          speaker: narrator
          text: 可她藏一次蛋，人们就找到一次，再把蛋拿走。杰米玛急得没了办法，终于决定离开农场，到很远的地方做窝。一个晴朗的春日午后，她沿着越过山冈的马车道出发了。她披着披肩，戴着宽边软帽。走到山顶时，她望见远处有一片树林。那地方安静得很，看起来也很安全。
        - id: ch01-b05
          speaker: narrator
          text: 杰米玛平常很少飞。她先朝山下跑了几码，披肩跟着一扇一扇，然后才跳到空中。有了这一阵助跑，她飞得漂亮极了。她擦着树梢飞过去，看见树林中央有一块清理过的空地，树木和灌丛都被移开了。
    - id: ch02
      title: 树林里的先生
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 杰米玛重重地落了地，摇摇摆摆地寻找干燥合适的孵蛋处。高高的毛地黄花丛里有个树桩，她很中意。没想到，树桩上坐着一位衣着考究的先生，手里还拿着报纸。她吓了一跳。那位先生长着黑色尖耳朵，两颊是沙黄色的胡须。杰米玛歪着脑袋，帽子也斜到一边，试探着嘎了两声。
        - id: ch02-b02
          speaker: narrator
          text: 先生从报纸上方抬起眼睛，好奇地看着她。他有一条毛茸茸的长尾巴。因为树桩有点潮，他把尾巴垫在身下坐着。
        - id: ch02-b03
          speaker: fox
          text: 太太，您是不是迷路了？
        - id: ch02-b04
          speaker: narrator
          text: 杰米玛觉得这位先生十分客气，模样也很英俊。她告诉他，自己不是迷了路，只是在找一个干燥又合适的地方做窝。
        - id: ch02-b05
          speaker: fox
          text: 啊，原来是这么回事？真的？
        - id: ch02-b06
          speaker: narrator
          text: 沙黄胡子的先生还是好奇地打量着她。他把报纸叠好，塞进燕尾服后面的口袋。杰米玛又说起那只多管闲事的母鸡，满肚子都是抱怨。
        - id: ch02-b07
          speaker: fox
          text: 是吗？这事可真有意思！真希望我能碰见那只鸡。我一定教教它，别再管不该管的事！至于做窝，那就更不难了。我的木棚里有满满一袋羽毛。亲爱的太太，您绝不会碍着谁，想在那里坐多久都可以。
        - id: ch02-b08
          speaker: narrator
          text: 毛茸茸的长尾巴先生在前面引路，把她带到毛地黄花丛深处。那里有一座僻静又阴森的房子，是用柴捆和草皮搭起来的。两只破桶摞在一起，就算是烟囱了。
        - id: ch02-b09
          speaker: fox
          text: 这是我的夏宅。我过冬住的地洞，可没有这里方便。
        - id: ch02-b10
          speaker: narrator
          text: 房子后面还有一间快塌的棚子，是用旧肥皂箱拼起来的。先生开门请杰米玛进去。棚里几乎全是羽毛，闷得她快透不过气来，不过脚下又软又舒服。杰米玛没想到会有这么多羽毛，可她没费什么力气，就把窝做好了。
        - id: ch02-b11
          speaker: narrator
          text: 她走出棚子时，先生正坐在圆木上看报。说是看报，其实他的眼睛一直越过报纸上沿，往外瞧。他客气得不得了，杰米玛要回家过夜时，他好像还舍不得放她走。他答应守好这个窝，等她第二天回来。
        - id: ch02-b12
          speaker: fox
          text: 我最喜欢蛋和小鸭子了。要是木棚里能有满满一窝，我也会觉得很荣幸。
        - id: ch02-b13
          speaker: narrator
          text: 从那以后，杰米玛每天下午都来。她一共下了九枚蛋，蛋壳泛着青白色，每一枚都很大。那位狐狸模样的先生爱极了这些蛋。杰米玛不在时，他总要把蛋挨个翻过来，再仔细数一遍。
    - id: ch03
      title: 晚宴要用的香草
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最后，杰米玛告诉先生，她打算从第二天起好好孵蛋。
        - id: ch03-b02
          speaker: jemima
          text: 我会带一袋谷子来。这样，直到小鸭子出壳，我都不用离开窝。要不然，蛋会着凉的。
        - id: ch03-b03
          speaker: narrator
          text: 杰米玛说得十分认真，因为她觉得自己凡事都考虑周全了。
        - id: ch03-b04
          speaker: fox
          text: 太太，请您别费事带袋子，燕麦由我来准备。不过，在您开始那段又长又乏味的孵蛋日子以前，我想请您吃顿好的。就让我们两个人办一场晚宴吧！还请您从农场菜园带些香草来，做一份喷香的煎蛋卷。我要鼠尾草、百里香、薄荷、两只洋葱，再加一点欧芹。至于油脂，我会准备好。那是做馅用的油脂——我是说，做煎蛋卷用的。
        - id: ch03-b05
          speaker: narrator
          text: 杰米玛实在糊涂。连鼠尾草和洋葱都说到了，她还是一点也没起疑。她绕着农场菜园走了一圈，把烤鸭填馅常用的各种香草都啄下一小簇。接着，她走进厨房，从篮子里拿了两只洋葱。
        - id: ch03-b06
          speaker: narrator
          text: 她刚从厨房出来，就碰见了牧羊犬凯普。
        - id: ch03-b07
          speaker: kep
          text: 你拿着两只洋葱干什么？杰米玛，你每天下午一个人去了哪里？
        - id: ch03-b08
          speaker: narrator
          text: 杰米玛有些怕凯普，只好把整件事从头说了一遍。凯普歪着聪明的脑袋听。听到那位长着沙黄胡子的礼貌先生，他咧嘴笑了。他又细细问起那片树林，还有房子和棚子的准确位置。
        - id: ch03-b09
          speaker: narrator
          text: 问完以后，凯普出门跑进村子。他要找两只猎狐犬幼犬。那两只小狗当时正跟着屠夫散步。
    - id: ch04
      title: 最后一次走进树林
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 又是一个阳光很好的午后。杰米玛最后一次走上那条马车道。她抱着一捆捆香草，袋子里还装着两只洋葱，压得她走路都费劲。她飞过树林，落在毛茸茸的长尾巴先生家对面。
        - id: ch04-b02
          speaker: narrator
          text: 先生坐在圆木上。他不停地嗅着空气，还不安地朝树林四下张望。杰米玛一落地，他竟猛地跳了起来。
        - id: ch04-b03
          speaker: fox
          text: 你看完蛋就马上进屋！把做煎蛋卷的香草给我，动作快点！
        - id: ch04-b04
          speaker: narrator
          text: 他的口气突然变得很粗暴。杰米玛从没听他这么说过话，既诧异，又不舒服。她进了棚子，没过多久，就听见后面响起一阵嗒嗒的脚步声。一个黑鼻子贴着门底嗅了嗅，接着，门被锁上了。
        - id: ch04-b05
          speaker: narrator
          text: 杰米玛这下害怕极了。片刻之后，棚外爆发出一片可怕的声音。有犬吠，有长嗥，有低吼和哀号，还夹着尖叫与呻吟。
        - id: ch04-b06
          speaker: narrator
          text: 从那以后，再也没有人见过那位长着狐狸胡须的先生。
        - id: ch04-b07
          speaker: narrator
          text: 过了一会儿，凯普打开棚门，放出了杰米玛。可他来不及阻拦，两只幼犬已经冲进棚里，把九枚蛋全都吞掉了。
    - id: ch05
      title: 回到农场以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 凯普的一只耳朵挨了一口，两只幼犬走路也都一瘸一拐。杰米玛想到失去的那些蛋，一路哭着，被护送回家。
        - id: ch05-b02
          speaker: narrator
          text: 到了六月，她又下了一窝蛋。这一次，人们允许她自己孵，可最后只有四只小鸭出了壳。
        - id: ch05-b03
          speaker: jemima
          text: 都怪我受了那么大的惊吓，到现在神经还没缓过来。
        - id: ch05-b04
          speaker: narrator
          text: 杰米玛是这样说的。不过说实在的，她一直都不太会孵蛋。
