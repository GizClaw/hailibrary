cover_prompt: |-
  A wordless cover scene in an American town on Christmas Eve in the 1820s shows St. Nicholas arriving above a snow-covered house. He is a merry compact older man with rosy cheeks, a full white beard, a fur-trimmed brown-red winter coat, leather boots, and a soft cap, seated in a small wooden sleigh drawn by eight lively reindeer. Below, a father in a white nightshirt and dark dressing gown opens an upstairs shutter and looks up in astonishment while the household sleeps. St. Nicholas lifts one mittened hand as the sleigh settles lightly toward the chimney, making the magical arrival the focal action. Use a low view from the snowy garden with the house and sleigh in the lower frame and broad starry breathing room above. Keep clothing, sleigh, and architecture grounded in the early nineteenth century and avoid modern commercial Santa imagery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
