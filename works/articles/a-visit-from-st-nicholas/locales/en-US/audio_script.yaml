audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, wonder-filled storytelling
        timbre: clear and gentle
        pace: measured with lively turns
        pitch: medium
    st_nicholas:
      display_name: St. Nicholas
      tts:
        delivery: hearty and cheerful
        timbre: warm and full
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Night Before Christmas
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was the night before Christmas. The whole house was still. Not one creature moved, not even a mouse. The stockings had been hung carefully by the chimney, in hope that St. Nicholas would soon come.
        - id: ch01-b02
          speaker: narrator
          text: The children lay warm and snug in their beds, dreaming of sugarplums. Mamma wore her kerchief, and I wore my cap. We had just settled down for a long winter nap.
        - id: ch01-b03
          speaker: narrator
          text: Then a great clatter rose from the lawn. I jumped out of bed to find out what was wrong. In a flash, I flew to the window, pulled open the shutters, and raised the sash.
        - id: ch01-b04
          speaker: narrator
          text: Moonlight shone across the fresh snow. Everything below looked as bright as midday. And then I saw something astonishing. There was a tiny sleigh, eight tiny reindeer, and a lively little old driver. I knew at once that he had to be St. Nick.
    - id: ch02
      title: Up to the Housetop
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: His reindeer raced along faster than eagles. He whistled and shouted, calling each one by name.
        - id: ch02-b02
          speaker: st_nicholas
          text: Now, Dasher! Now, Dancer! Come on, Prancer and Vixen! On, Comet! On, Cupid! On, Donder and Blixen! Up to the porch! Up to the wall! Now dash away, dash away, dash away, all!
        - id: ch02-b03
          speaker: narrator
          text: Dry leaves fly before a wild storm, then rise into the sky when they strike something in their path. The reindeer rose just like that. Up to the roof they flew, carrying the sleigh full of toys and St. Nicholas too.
        - id: ch02-b04
          speaker: narrator
          text: A moment later, I heard every little hoof prancing and pawing overhead. I pulled my head back from the window and turned around. With one quick bound, St. Nicholas came down the chimney.
    - id: ch03
      title: St. Nicholas at Work
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Fur covered him from head to foot, and ashes and soot had smudged his clothes. He carried a bundle of toys on his back. He looked like a peddler opening up his pack.
        - id: ch03-b02
          speaker: narrator
          text: His eyes twinkled, and merry dimples showed in his cheeks. Those cheeks were rosy, and his nose was red as a cherry. His funny little mouth curved like a bow, while the beard on his chin was as white as snow.
        - id: ch03-b03
          speaker: narrator
          text: He held a short pipe tightly between his teeth. Smoke circled his head like a wreath. His face was broad, and his little round belly shook like a bowlful of jelly whenever he laughed.
        - id: ch03-b04
          speaker: narrator
          text: He was chubby, plump, and such a jolly old elf that I couldn't help laughing when I saw him. He winked and tilted his head, and right away I knew there was nothing to fear.
        - id: ch03-b05
          speaker: narrator
          text: He never spoke. He went straight to work and filled every stocking. Then he turned sharply, laid one finger beside his nose, gave a nod, and rose back up the chimney.
    - id: ch04
      title: A Good Night to All
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: St. Nicholas leaped into his sleigh and whistled to his team. Away they all flew, as light as the soft down of a thistle.
        - id: ch04-b02
          speaker: narrator
          text: Before he drove out of sight, I heard him call through the night.
        - id: ch04-b03
          speaker: st_nicholas
          text: Happy Christmas to all, and to all a good night!
          emotion: happy
