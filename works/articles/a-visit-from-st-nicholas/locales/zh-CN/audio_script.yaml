audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖亲切，带着圣诞夜讲故事的惊喜感
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    st_nicholas:
      display_name: 圣尼古拉斯
      tts:
        delivery: 快活爽朗，招呼驯鹿时干脆有力
        timbre: 浑厚明亮
        pace: 轻快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 圣诞前夜的声响
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            圣诞前夜，整座屋子里静得很。别说人了，就连一只小老鼠也没有动。壁炉旁边，一只只长袜早已仔细挂好，大家都盼着圣尼古拉斯快点儿来。孩子们舒舒服服地偎在床上，梦里尽是跳舞的糖果梅。妈妈裹着头巾，我戴着睡帽，我们也刚刚躺好，准备睡上漫长的一觉。没想到，草坪上突然传来一阵喧闹。我一下跳下床，想瞧瞧到底出了什么事。我飞快跑到窗边，推开百叶窗，又猛地掀起窗扇。月光照着刚落下的新雪，下面的一切亮得像在正午。就在这片亮光里，我竟看见一架小雪橇，前面拉着八头小驯鹿。赶车的是个精神十足的小老头，动作又快又灵活。我立刻认出来了，他一定就是圣尼克。那些驯鹿跑得比鹰还快。他吹起口哨，高声叫出它们的名字。
        - id: ch01-b02
          speaker: st_nicholas
          text: >-
            冲啊，飞毛腿！冲啊，舞蹈家！腾跃者、雌狐，快跟上！彗星、丘比特，向前冲！雷霆、闪电，也快来！冲上门廊顶，冲上墙头！大家一起飞奔吧！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: >-
            狂风卷着枯叶迎面撞上障碍时，会一下把它们送上高空。那些驯鹿也这样腾空而起，飞上了屋顶。雪橇里装满玩具，圣尼古拉斯也坐在上面。
    - id: ch02
      title: 从烟囱来的客人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一眨眼，屋顶上便响起小蹄子腾跃刨踏的声音。我刚把脑袋从窗外缩回来，才一转身，圣尼古拉斯就从烟囱里纵身跳了下来。他浑身裹着毛皮，衣服让炉灰和烟尘弄得黑乎乎的，背后还甩着一大包玩具，看上去就像个正要打开货包的小贩。他的眼睛亮晶晶的，脸上带着快活的酒窝。双颊红得像玫瑰，鼻尖红得像樱桃。那张逗人的小嘴弯成一张弓，下巴上的胡须却白得像雪。他牙间紧咬着一截烟斗，一圈烟雾绕在脑袋旁，像一只花环。他长着宽宽的脸和小小的圆肚皮，一笑起来，肚子就像满满一碗果冻似的直颤。他胖乎乎、圆滚滚，是个快活的老精灵。我一看见他，也忍不住笑了。他朝我眨眨眼，又把头轻轻一歪，我马上明白，根本不用怕。
    - id: ch03
      title: 雪橇飞远了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            圣尼古拉斯一句话也没说，马上动手干活。他把每只长袜都装得满满的，接着猛一转身，把一根手指放到鼻子旁边，又点了点头，便顺着烟囱升了上去。他跳上雪橇，朝驯鹿们吹了一声口哨。转眼间，它们全都飞走了，轻盈得像风中的蓟草绒毛。就在雪橇快要消失的时候，我听见他远远地高声喊道。
        - id: ch03-b02
          speaker: st_nicholas
          text: >-
            祝大家圣诞快乐，也祝大家一夜好眠！
          emotion: happy
