cover_prompt: |-
  A wordless cover scene in an Edwardian cottage garden catches Tom Kitten and his sisters losing their best clothes during play. Tom is a small gray tabby kitten in a blue jacket with missing buttons, Mittens a dark tabby in a pale pink pinafore, and Moppet a lighter tabby in a cream pinafore and blue sash. They tumble harmlessly from a low garden wall as three white ducks below catch a loose bonnet, sash, and tiny jacket on their backs. Tom reaches toward the floating jacket while his sisters steady each other, making the comic clothing mishap the focal action. Use a low garden-level three-quarter view with flowers, stone wall, and cottage behind them and generous calm sky above. Keep the kittens' anatomy recognizable beneath period clothing, the action safe, and every design original rather than copied from adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
