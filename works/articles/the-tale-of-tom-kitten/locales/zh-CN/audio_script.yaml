audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而带着轻巧幽默的讲述
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    mrs_tabitha_twitchit:
      display_name: 塔比莎·特威契特太太
      tts:
        delivery: 爱整洁而严厉，话语干脆
        timbre: 成熟明亮
        pace: 稍快
        pitch: 中高音
    moppet:
      display_name: 莫佩特
      tts:
        delivery: 活泼大胆，带着孩子气的主意
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高音
    mr_drake_puddle_duck:
      display_name: 公水洼鸭先生
      tts:
        delivery: 一本正经而悠然
        timbre: 圆润低沉
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 三只小猫要见客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有三只小猫，叫米滕斯、汤姆和莫佩特。它们明明各有一身可爱的小毛皮，却总爱在门阶上打滚，还往尘土里钻。
        - id: ch01-b02
          speaker: narrator
          text: 一天，猫妈妈塔比莎·特威契特太太要请朋友来喝茶。客人还没到，她先把孩子们叫回屋，预备洗得干干净净，再好好打扮一番。
        - id: ch01-b03
          speaker: narrator
          text: 她先擦洗三张小脸。这一只是莫佩特。接着，她刷顺三身毛。这一只是米滕斯。最后，她又梳好尾巴和胡须。这一只，就是汤姆。
        - id: ch01-b04
          speaker: narrator
          text: 汤姆可淘气了，竟然伸出爪子抓人。
        - id: ch01-b05
          speaker: narrator
          text: 特威契特太太给莫佩特和米滕斯穿上干净围裙，系好白领布。给儿子汤姆穿衣时，她从五斗柜里取出一大堆漂亮却不舒服的衣裳，一件件套在他身上。
        - id: ch01-b06
          speaker: narrator
          text: 可汤姆又胖又长大了，衣服上的好几颗纽扣一下就崩掉了。妈妈只好再缝一遍。
    - id: ch02
      title: 花园里的绿印子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三只小猫终于收拾好了。特威契特太太要去做热黄油烤面包，竟把它们放进花园，免得在屋里碍事。这主意可不怎么高明。
        - id: ch02-b02
          speaker: mrs_tabitha_twitchit
          text: 孩子们，衣裳可不许弄脏！要用后腿走。别靠近脏灰坑，也别去找母鸡莎莉、猪圈和水洼鸭一家。
        - id: ch02-b03
          speaker: narrator
          text: 莫佩特和米滕斯摇摇晃晃地走上花园小径。没走多远，它们就踩住自己的围裙，一头栽下去，鼻子都贴到了地上。
        - id: ch02-b04
          speaker: narrator
          text: 两只小猫重新站起来时，衣裳上已经多了好几道绿印子！
        - id: ch02-b05
          speaker: moppet
          text: 咱们爬上假山，到花园围墙上坐着吧。
        - id: ch02-b06
          speaker: narrator
          text: 它们把围裙前后换了个方向，蹦蹦跳跳地向上爬。半路上，莫佩特的白领布掉到了大路上。
        - id: ch02-b07
          speaker: narrator
          text: 汤姆穿着裤子，又只能靠后腿走，哪里还跳得动。他一点点挪上假山，沿路踩断蕨草，纽扣左边掉一颗，右边又落一颗。
        - id: ch02-b08
          speaker: narrator
          text: 好不容易到了墙头，汤姆身上的衣裳早已七零八落。莫佩特和米滕斯忙着替他收拾，可帽子先掉了，剩下的纽扣也全都崩开了。
    - id: ch03
      title: 水洼鸭穿上了衣裳
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三只小猫正忙得不知怎么办，忽然传来一阵脚步声。啪嗒啪，蹼嗒啪！三只水洼鸭排成一列，沿着坚硬的高坡大路走来，抬腿的样子像鹅在行进。啪嗒啪，摇嗒啪！
        - id: ch03-b02
          speaker: narrator
          text: 水洼鸭们停下来，并排站着往墙头看。它们的小眼睛睁得圆圆的，满脸惊讶。
        - id: ch03-b03
          speaker: narrator
          text: 两只母鸭丽贝卡和杰迈玛捡起帽子和白领布，戴在了自己身上。
        - id: ch03-b04
          speaker: narrator
          text: 米滕斯笑得摔下墙头。莫佩特和汤姆也跟着往下爬。一路下来，两条围裙和汤姆其余的衣裳全都脱落了。
        - id: ch03-b05
          speaker: moppet
          text: 公水洼鸭先生，快过来帮他穿好呀！帮汤姆把纽扣扣上！
        - id: ch03-b06
          speaker: narrator
          text: 公水洼鸭先生侧着身，慢慢走近，把散在地上的衣裳一件件捡起来。
        - id: ch03-b07
          speaker: narrator
          text: 可他没有给汤姆穿，反而把衣裳全套到了自己身上！那身衣服穿在他身上，比穿在汤姆身上还不合适。
        - id: ch03-b08
          speaker: mr_drake_puddle_duck
          text: 今天这天气可真不错！
        - id: ch03-b09
          speaker: narrator
          text: 公水洼鸭先生说完，就和杰迈玛、丽贝卡沿着大路走了。三只鸭子步子整齐，啪嗒啪，蹼嗒啪！啪嗒啪，摇嗒啪！
    - id: ch04
      title: 楼上的响动
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时候，塔比莎·特威契特从花园那头走来，发现三个孩子没穿衣裳，全待在墙头上。
        - id: ch04-b02
          speaker: narrator
          text: 她把小猫们一个个揪下来，挨个打了几下，然后带回了屋。
        - id: ch04-b03
          speaker: mrs_tabitha_twitchit
          text: 我的朋友马上就到了，你们弄成这样，怎么能见人！真让我难堪。
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 特威契特太太把它们赶上楼。说来遗憾，她还告诉朋友们，孩子们出了麻疹，正躺在床上。可这根本不是真的。
        - id: ch04-b05
          speaker: narrator
          text: 正好相反。它们压根儿没躺在床上，一点儿也没有。
        - id: ch04-b06
          speaker: narrator
          text: 也不知怎么回事，楼上不时传出很不寻常的响动。茶会原本的体面和安宁，全被这些声音搅乱了。
        - id: ch04-b07
          speaker: narrator
          text: 我看，总有一天，我得再写一本更大的书，好多讲一点汤姆小猫的故事！
    - id: ch05
      title: 池塘里的结局
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 再说水洼鸭一家。它们走进了一座池塘。
        - id: ch05-b02
          speaker: narrator
          text: 因为衣裳上已经没有纽扣，它们刚下水，那些衣裳就全脱落了。
        - id: ch05-b03
          speaker: narrator
          text: 从那以后，公水洼鸭先生、杰迈玛和丽贝卡就一直在寻找那些衣裳。
