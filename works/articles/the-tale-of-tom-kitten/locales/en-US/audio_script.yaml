audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a touch of dry humor
        timbre: clear and gentle
        pace: measured
        pitch: medium
    mrs_tabitha_twitchit:
      display_name: Mrs. Tabitha Twitchit
      tts:
        delivery: proper, brisk, and firmly maternal
        timbre: warm and mature
        pace: moderately brisk
        pitch: medium
    moppet:
      display_name: Moppet
      tts:
        delivery: lively, direct, and playfully confident
        timbre: light and youthful
        pace: quick
        pitch: high
    mr_drake_puddle_duck:
      display_name: Mr. Drake Puddle-Duck
      tts:
        delivery: slow, dignified, and mildly self-satisfied
        timbre: rounded and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Dressed for Tea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, three little kittens lived together. Their names were Mittens, Tom Kitten, and Moppet. They had dear little fur coats of their own, and they loved tumbling around the doorstep and playing in the dust.
        - id: ch01-b02
          speaker: narrator
          text: One day, their mother, Mrs. Tabitha Twitchit, was expecting friends for tea. Before the fine company arrived, she brought the kittens inside to wash and dress them. First she scrubbed Moppet's face. Then she brushed Mittens's fur. Last of all, she combed Tom's tail and whiskers. Tom was very naughty and scratched her.
        - id: ch01-b03
          speaker: narrator
          text: Mrs. Tabitha put clean pinafores and tuckers on Moppet and Mittens. For her son Thomas, she took all kinds of elegant, uncomfortable clothes from a chest of drawers. Tom Kitten was very fat, and he had grown. Several buttons popped right off, so his mother sewed them on again.
        - id: ch01-b04
          speaker: narrator
          text: At last, all three kittens were ready. Mrs. Tabitha made the unwise choice of sending them into the garden while she prepared hot buttered toast.
        - id: ch01-b05
          speaker: mrs_tabitha_twitchit
          text: Mind your clean clothes, children! Stay on your hind legs, and don't go near the dirty ash pit. Keep clear of Sally Henny Penny, the pigsty, and the Puddle-Ducks too.
    - id: ch02
      title: Trouble in the Garden
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Moppet and Mittens wobbled down the garden path. Before long, they stepped on their pinafores and fell flat on their noses. When they got up, several green smears covered their clothes.
        - id: ch02-b02
          speaker: moppet
          text: How about climbing the rockery? We can sit on top of the garden wall.
        - id: ch02-b03
          speaker: narrator
          text: The two kittens turned their pinafores around backward. Then they skipped and jumped up the rocks. On the way, Moppet's white tucker slipped off and fell into the road.
        - id: ch02-b04
          speaker: narrator
          text: Tom Kitten could not jump at all while walking on his hind legs in trousers. Little by little, he struggled up the rockery, breaking ferns and dropping buttons on both sides. By the time he reached the top of the wall, his outfit was coming apart everywhere.
        - id: ch02-b05
          speaker: narrator
          text: Moppet and Mittens tried to put him back together. Instead, his hat fell off and all his remaining buttons burst away.
    - id: ch03
      title: The Puddle-Ducks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: While the kittens were having all this trouble, they heard a pit pat, paddle pat. Three Puddle-Ducks came marching along the hard, high road, one behind another, doing the goose step. Pit pat, paddle pat! Pit pat, waddle pat!
        - id: ch03-b02
          speaker: narrator
          text: The ducks stopped in a row and stared up at the kittens. Their eyes were very small, and they looked surprised. Rebeccah and Jemima Puddle-Duck picked up the hat and the tucker and put them on.
        - id: ch03-b03
          speaker: narrator
          text: Mittens laughed so hard that she fell off the wall. Moppet and Tom climbed down after her. On the way, both pinafores came off, along with every piece of Tom's clothing.
        - id: ch03-b04
          speaker: moppet
          text: Mr. Drake Puddle-Duck, come here! Help us get Tom dressed and fasten his buttons!
        - id: ch03-b05
          speaker: narrator
          text: Mr. Drake Puddle-Duck moved forward slowly and sideways. He picked up all the scattered clothes. But then he put them on himself! They fit him even worse than they had fit Tom Kitten.
        - id: ch03-b06
          speaker: mr_drake_puddle_duck
          text: What a very fine morning!
        - id: ch03-b07
          speaker: narrator
          text: Mr. Drake, Jemima, and Rebeccah Puddle-Duck marched away up the road in step. Pit pat, paddle pat! Pit pat, waddle pat!
    - id: ch04
      title: Not Fit to Be Seen
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then Tabitha Twitchit came down the garden. She found her kittens sitting on the wall without any clothes at all. She pulled them down, smacked them, and took them back into the house.
        - id: ch04-b02
          speaker: mrs_tabitha_twitchit
          text: My friends will be here any minute, and I can't let anyone see you like this. I am deeply offended!
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: Mrs. Tabitha sent the kittens upstairs. Then, I am sorry to say, she told her friends they were in bed with the measles. That was not true.
        - id: ch04-b04
          speaker: narrator
          text: It was quite the opposite. They were not in bed. Not in the least.
        - id: ch04-b05
          speaker: narrator
          text: Somehow, very strange noises began overhead. They disturbed all the dignity and quiet of the tea party.
        - id: ch04-b06
          speaker: narrator
          text: I think that someday I shall need to make another, larger book and tell you more about Tom Kitten!
    - id: ch05
      title: Into the Pond
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As for the Puddle-Ducks, they went into a pond.
        - id: ch05-b02
          speaker: narrator
          text: All the clothes came off at once because there were no buttons.
        - id: ch05-b03
          speaker: narrator
          text: Mr. Drake Puddle-Duck, Jemima, and Rebeccah have been looking for them ever since.
