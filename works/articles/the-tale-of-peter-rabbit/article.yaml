cover_prompt: |-
  A wordless cover scene in an Edwardian English vegetable garden shows Peter Rabbit making his daring escape. Peter is a small brown rabbit with upright ears, a white tail, and a pale blue jacket with brass-colored buttons, designed directly from the text without resemblance to later adaptations. He squeezes beneath a wooden gate while clutching one red radish, as the bearded gardener Mr. McGregor in a brown waistcoat, rolled white sleeves, dark trousers, and muddy boots hurries from far behind. Peter's leap through the gap is the focal action, energetic but safe, with lettuces, cabbages, clay pots, and a watering can marking the garden. Use a low rabbit-height diagonal view with the path leading toward a sunlit field and generous pale sky above the hedge. Keep rabbit anatomy believable, clothing and tools faithful to the early 1900s, and the overall mood playful rather than frightening. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
