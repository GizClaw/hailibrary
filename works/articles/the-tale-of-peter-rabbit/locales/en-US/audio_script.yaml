audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively, and gently storybook-like
        timbre: clear and comforting
        pace: measured with playful turns
        pitch: medium
    mrs_rabbit:
      display_name: Mrs. Rabbit
      tts:
        delivery: caring, practical, and firm when warning her children
        timbre: warm and mature
        pace: unhurried
        pitch: medium
    mr_mcgregor:
      display_name: Mr. McGregor
      tts:
        delivery: gruff, forceful, and easily flustered
        timbre: rough and full
        pace: brisk
        pitch: low
  chapters:
    - id: ch01
      title: Four Little Rabbits
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there were four little rabbits named Flopsy, Mopsy, Cotton-tail, and Peter. They lived with their mother in a burrow in a sandbank, right under the roots of a very big fir tree.
        - id: ch01-b02
          speaker: mrs_rabbit
          text: My dears, you may play in the fields or go down the lane. But you must not enter Mr. McGregor's garden. Your father had an accident there, and Mrs. McGregor put him in a pie.
        - id: ch01-b03
          speaker: mrs_rabbit
          text: Off you go now, and stay out of trouble. I'm going out.
        - id: ch01-b04
          speaker: narrator
          text: Mrs. Rabbit picked up her basket and umbrella. She went through the woods to the baker's shop, where she bought a loaf of brown bread and five currant buns.
        - id: ch01-b05
          speaker: narrator
          text: Flopsy, Mopsy, and Cotton-tail were good little bunnies. They went down the lane to pick blackberries. Peter, however, was very naughty. He ran straight to Mr. McGregor's garden and squeezed under the gate.
    - id: ch02
      title: The Chase in the Garden
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: First Peter ate some lettuce and French beans. Then he ate a few radishes. Soon his stomach felt rather sick, so he went off to find some parsley.
        - id: ch02-b02
          speaker: narrator
          text: As he rounded the end of a cucumber frame, there was Mr. McGregor! The gardener was down on his hands and knees, planting young cabbages. He sprang up and raced after Peter, waving a rake.
        - id: ch02-b03
          speaker: mr_mcgregor
          text: Stop, thief!
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: Peter was terribly frightened. He tore around the garden because he had forgotten how to get back to the gate. One shoe came off among the cabbages, and the other disappeared among the potatoes.
        - id: ch02-b05
          speaker: narrator
          text: Without his shoes, Peter ran on all four paws and went much faster. He might have escaped completely, but then he dashed into a gooseberry net. The big buttons on his brand-new blue jacket caught in the mesh.
        - id: ch02-b06
          speaker: narrator
          text: Peter thought he was lost. Big tears rolled down his face. Some friendly sparrows heard him sobbing and flew over in great excitement. They urged him to make one more effort.
        - id: ch02-b07
          speaker: narrator
          text: Mr. McGregor approached with a sieve, ready to drop it over Peter. Just in time, Peter wriggled free. He left his jacket behind and rushed into the tool shed.
    - id: ch03
      title: Trouble in the Tool Shed
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Peter jumped into a watering can. It would have made a wonderful hiding place, except that it had so much water in it.
        - id: ch03-b02
          speaker: narrator
          text: Mr. McGregor felt certain Peter was somewhere in the shed, perhaps under a flowerpot. One by one, he carefully turned the pots over and looked beneath them.
        - id: ch03-b03
          speaker: narrator
          text: Then Peter sneezed. “Kertyschoo!” Mr. McGregor came after him at once and tried to step on him. Peter leaped through a window and knocked over three plants.
        - id: ch03-b04
          speaker: narrator
          text: The window was too small for Mr. McGregor to follow. Besides, he was tired of chasing Peter, so he returned to his work.
        - id: ch03-b05
          speaker: narrator
          text: Peter sat down to rest. He was out of breath, shaking with fear, and completely unsure which way to go. After sitting in the watering can, he was also very wet.
    - id: ch04
      title: Finding the Gate
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After a while, Peter began to wander. He moved slowly, lippity-lippity, looking all around him.
        - id: ch04-b02
          speaker: narrator
          text: He found a door in a wall, but it was locked. There was no space underneath for a plump little rabbit to squeeze through.
        - id: ch04-b03
          speaker: narrator
          text: An old mouse kept running across the stone doorstep. She was carrying peas and beans home to her family in the woods. Peter asked her how to reach the gate, but a large pea filled her mouth. She could only shake her head. Peter began to cry.
        - id: ch04-b04
          speaker: narrator
          text: Next he tried to cross the garden in a straight line, but he only became more confused. Before long, he reached the pond where Mr. McGregor filled his watering cans.
        - id: ch04-b05
          speaker: narrator
          text: A white cat sat there, staring at the goldfish. She stayed very, very still, though the tip of her tail twitched now and then as if it had a life of its own. Peter decided not to speak to her. He had heard about cats from his cousin, little Benjamin Bunny.
        - id: ch04-b06
          speaker: narrator
          text: Peter headed back toward the tool shed. All at once, very close by, he heard a hoe scraping the ground. “Scr-r-ritch, scratch, scratch, scritch.” He scurried under the bushes.
        - id: ch04-b07
          speaker: narrator
          text: Nothing happened, so Peter crept out again. He climbed onto a wheelbarrow and peeked over the top. The first thing he saw was Mr. McGregor hoeing the onions. The man's back was turned, and there, beyond him, was the gate.
        - id: ch04-b08
          speaker: narrator
          text: Peter climbed down from the wheelbarrow as quietly as he could. Then he raced along a straight path behind the black-currant bushes.
        - id: ch04-b09
          speaker: narrator
          text: Mr. McGregor spotted him at the corner, but Peter did not care. He slipped beneath the gate and was safe at last, outside the garden in the woods.
    - id: ch05
      title: Home Under the Fir Tree
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Mr. McGregor hung Peter's little jacket and shoes on a scarecrow to frighten the blackbirds.
        - id: ch05-b02
          speaker: narrator
          text: Peter kept running without once looking back. He did not stop until he reached home beneath the big fir tree.
        - id: ch05-b03
          speaker: narrator
          text: He was so tired that he dropped onto the soft sand on the floor of the rabbit hole and closed his eyes. His mother was busy cooking, and she wondered what had happened to his clothes. This was the second jacket and pair of shoes Peter had lost in two weeks.
        - id: ch05-b04
          speaker: narrator
          text: I'm sorry to say that Peter did not feel well that evening.
        - id: ch05-b05
          speaker: narrator
          text: His mother put him to bed and made some chamomile tea. Then she gave Peter a dose of it.
        - id: ch05-b06
          speaker: mrs_rabbit
          text: One tablespoon at bedtime.
        - id: ch05-b07
          speaker: narrator
          text: Flopsy, Mopsy, and Cotton-tail, meanwhile, had bread and milk and blackberries for supper.
        - id: ch05-b08
          speaker: narrator
          text: And that is the end of the tale.
