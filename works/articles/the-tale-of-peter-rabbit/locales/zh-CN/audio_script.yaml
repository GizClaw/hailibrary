audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 亲切机敏，像坐在孩子身边讲一场小小冒险, timbre: 温暖清晰的成年声音, pace: 从容，追逐时自然加快, pitch: 中}
    mrs_rabbit:
      display_name: 兔妈妈
      tts: {delivery: 慈爱而认真，叮嘱时温和坚定, timbre: 柔和沉稳的成年女声, pace: 舒缓, pitch: 中}
    mr_mcgregor:
      display_name: 麦格雷戈先生
      tts: {delivery: 粗声直气，追赶时急促有力, timbre: 厚实粗粝的成年男声, pace: 偏快, pitch: 中低}
  chapters:
    - id: ch01
      title: 千万别进菜园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            从前，有四只小兔子，名叫弗洛普茜、莫普茜、棉尾巴和彼得。他们跟兔妈妈住在沙洞里，洞口藏在一棵大冷杉的树根底下。

            一天早晨，兔妈妈要出门，临走前把孩子们叫到身边。
        - id: ch01-b02
          speaker: mrs_rabbit
          text: 亲爱的孩子们，你们可以去田野，也可以顺着小路玩。不过，麦格雷戈先生的菜园千万不能进。你们的爸爸就是在那里出了事，后来还让麦格雷戈太太做成了馅饼。
        - id: ch01-b03
          speaker: mrs_rabbit
          text: 好了，快去玩吧。别惹麻烦，我也要出门了。
        - id: ch01-b04
          speaker: narrator
          text: |-
            兔妈妈挎着篮子，带上雨伞，穿过树林去了面包店。她买回一条黑面包和五个葡萄干小圆面包。

            弗洛普茜、莫普茜和棉尾巴都很听话，顺着小路采黑莓去了。彼得却偏偏往麦格雷戈先生的菜园跑，还从大门底下硬挤了进去。

            他先吃生菜，又吃四季豆，随后还吃了几只小萝卜。肚子有点难受了，他便去找欧芹。谁知刚绕过黄瓜暖床，就跟麦格雷戈先生撞了个正着。
        - id: ch01-b05
          speaker: narrator
          text: 麦格雷戈先生原本趴在地上栽小卷心菜。一看见彼得，他猛地起身，挥着耙子追了上来。
        - id: ch01-b06
          speaker: mr_mcgregor
          text: 站住，你这个偷菜的小贼！
          emotion: angry
    - id: ch02
      title: 外套挂在网里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            彼得吓得要命，在菜园里没头没脑地乱窜。他已经记不起大门在哪边了。一只鞋掉进卷心菜地，另一只落在马铃薯地里。

            没了鞋，他四脚着地，倒跑得更快。眼看就能逃走，他却一头撞进醋栗网。崭新的蓝外套上，那几颗黄铜大纽扣死死挂住了网眼。

            彼得觉得自己再也逃不掉了，大颗大颗地掉眼泪。几只好心的麻雀听见哭声，急忙飞过来，催他使劲挣脱。

            麦格雷戈先生拿来一只筛子，想从上面扣住彼得。就在那一刻，彼得扭出了外套，只把衣服留在网里，自己冲进了工具棚。
        - id: ch02-b02
          speaker: narrator
          text: |-
            他跳进一只洒水壶。要是壶里没有那么多水，这地方藏起来可真不错。可现在，他浑身都泡湿了。

            麦格雷戈先生认准彼得躲在工具棚里，或许就在某个花盆下面。他把花盆一个个掀起来，仔细往底下找。

            忽然，彼得忍不住打了个响亮的喷嚏：“阿嚏！”麦格雷戈先生立刻扑过去，抬脚便踩。彼得赶紧从窗户蹿出去，撞翻了三盆花。

            那扇窗太小，麦格雷戈先生钻不过去。他追得也累了，只好回去继续干活。
    - id: ch03
      title: 大门究竟在哪里
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            彼得坐下歇气，身子吓得直发抖。他不知道该往哪儿走，湿衣服又紧贴在身上。歇了一会儿，他才一小跳、一小跳地往前挪，走得很慢，一路四处张望。

            墙上倒是有扇门，可门锁得牢牢的，门底也没有地方能让这只胖乎乎的小兔子钻过去。

            一只老老鼠正越过石门槛来回运送豌豆和豆子，要带给树林里的家人。彼得问她大门怎么走。可她嘴里衔着一颗大豌豆，什么也说不了，只能摇摇头。彼得急得哭了。

            他又想横穿菜园找路，结果越走越糊涂。走到一口池塘旁边，他看见一只白猫正盯着金鱼。白猫一动不动，只有尾巴尖偶尔抽一下，好像那条尾巴有自己的性命。表弟小本杰明兔给彼得讲过猫，所以彼得一句话也没说，悄悄离开了。
        - id: ch03-b02
          speaker: narrator
          text: |-
            彼得折回工具棚。离他很近的地方，忽然响起锄头的声音，嚓啦，嚓，嚓，嚓啦。他一下钻进灌木丛，等了一阵，见没有动静，才爬上一辆独轮手推车，探出头看。

            麦格雷戈先生正在锄洋葱，背正对着彼得。越过他的肩膀，彼得终于看见了菜园大门。

            彼得轻轻溜下手推车，沿着黑醋栗灌木后面的直路飞奔。到了拐角，麦格雷戈先生发现了他，可彼得根本不理会。他从门底一滑而过，终于回到菜园外的树林，安全了。

            麦格雷戈先生把彼得的小外套和两只鞋挂起来，做了个吓乌鸫的稻草人。
    - id: ch04
      title: 一大汤匙洋甘菊茶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            彼得不停地跑，头也不回，一直跑回大冷杉下的家。他累得一头倒在兔洞柔软的沙地上，闭起了眼睛。

            兔妈妈正在做饭，心里纳闷彼得的衣服去了哪里。短短两个星期，这已经是彼得丢掉的第二件小外套和第二双鞋了。

            很遗憾，那天晚上彼得病恹恹的。兔妈妈让他上床躺好，又煮了些洋甘菊茶，给他服了一剂。
        - id: ch04-b02
          speaker: mrs_rabbit
          text: 睡觉之前，要喝一大汤匙。
        - id: ch04-b03
          speaker: narrator
          text: 至于弗洛普茜、莫普茜和棉尾巴，他们的晚餐是面包、牛奶，还有采回来的黑莓。
        - id: ch04-b04
          speaker: narrator
          text: 彼得兔的故事讲到这里，就结束了。
