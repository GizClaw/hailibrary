cover_prompt: |-
  A wordless cover scene in the old roof spaces of an Edwardian farmhouse shows Tom Kitten being found before real danger occurs. Tom is a small gray tabby kitten in a rumpled blue jacket, peeking from beneath a loose floorboard, while his mother Tabitha Twitchit, a larger gray tabby in a lavender dress and white apron, reaches toward him. Samuel Whiskers is a large brown rat with long pale whiskers and a shabby brown coat, and Anna Maria a smaller gray rat in a plain apron, both retreating through a distant beam passage with a rolling pin left behind. Tabitha's paw meeting Tom's outstretched paw is the focal action, emphasizing rescue over threat. Use a low attic-level three-quarter view with rafters and sacks forming depth and a quiet patch of plaster wall at the top. Keep the suspense gentle, animals anatomically credible, household details period-appropriate, and all designs independent of adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
