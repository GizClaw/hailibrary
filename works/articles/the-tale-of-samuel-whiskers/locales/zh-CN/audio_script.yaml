audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而带着轻巧幽默的讲述
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    mrs_tabitha_twitchit:
      display_name: 塔比莎·特威契特太太
      tts:
        delivery: 爱整洁而严厉，话语干脆
        timbre: 成熟明亮
        pace: 稍快
        pitch: 中高音
    moppet:
      display_name: 莫佩特
      tts:
        delivery: 活泼大胆，带着孩子气的主意
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高音
    mittens:
      display_name: 手套
      tts:
        delivery: 天真活泼，受惊时说得又急又快
        timbre: 轻柔清脆
        pace: 轻快
        pitch: 高音
    ribby:
      display_name: 小里比太太
      tts:
        delivery: 爽快能干，说话直截了当
        timbre: 温厚结实
        pace: 稳健
        pitch: 中音
    tom_kitten:
      display_name: 小猫汤姆
      tts:
        delivery: 淘气好奇，遇险后慌张而吃力
        timbre: 稚嫩清亮
        pace: 活泼
        pitch: 中高音
    samuel_whiskers:
      display_name: 塞缪尔·大胡子
      tts:
        delivery: 自负挑剔，盘算时慢条斯理
        timbre: 干涩沙哑
        pace: 偏慢
        pitch: 低音
    anna_maria:
      display_name: 安娜·玛丽亚
      tts:
        delivery: 泼辣利落，争辩时尖锐急促
        timbre: 尖细清晰
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 不见了的小猫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一只上了年纪的母猫，名叫塔比莎·特威契特太太。她总为孩子们操心，因为三只小猫动不动就不见，而每回不见，准是在淘气。到了烘焙日，她决定把孩子们关进柜子里。毛团和手套被她逮住了，汤姆却怎么也找不到。
        - id: ch01-b02
          speaker: narrator
          text: 塔比莎太太一边喵喵地喊汤姆，一边把整座房子从楼下找到楼上。她先看楼梯下的食品储藏室，又搜了蒙着防尘布的体面客房。最后连顶楼的阁楼都找遍了，还是没有汤姆。
        - id: ch01-b03
          speaker: narrator
          text: 这房子老得很，到处都是柜子和弯弯绕绕的过道。有些墙足有四英尺厚，里面常传出怪响，像是墙中藏着一道小楼梯。护墙板上还开着几扇歪歪斜斜的小门。每到夜里，总有东西不见，尤其是奶酪和咸肉。
        - id: ch01-b04
          speaker: narrator
          text: 塔比莎太太越来越慌，叫得好不可怜。她满屋找孩子的时候，毛团和手套已经惹起了麻烦。柜门没锁，两只小猫一推就开，溜到火炉边，拿软软的小爪子拍起了正在盆里发酵的面团。
        - id: ch01-b05
          speaker: mittens
          text: 毛团，咱们做几个可爱的小松饼吧？
        - id: ch01-b06
          speaker: narrator
          text: 偏偏这时，前门响起了敲门声。毛团吓得一头跳进面粉桶。手套逃进奶房，藏进石架上的一只空罐子，旁边就摆着平时盛牛奶的浅盆。
        - id: ch01-b07
          speaker: narrator
          text: 来的是邻居小里比太太，她想借一点酵母。塔比莎太太凄凄惨惨地叫着下了楼，一见她就掉下泪来。
        - id: ch01-b08
          speaker: mrs_tabitha_twitchit
          text: 小里比表姐，快进来坐吧！我都快愁死了。亲爱的托马斯不见了，恐怕已经叫老鼠捉去了。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 她说着，用围裙擦了擦眼睛。
        - id: ch01-b10
          speaker: ribby
          text: 他真是只坏小猫。上次我来喝茶，他还拿我最好的帽子玩翻花绳呢。你都找过什么地方了？
        - id: ch01-b11
          speaker: mrs_tabitha_twitchit
          text: 整座房子都找遍了！这里的老鼠实在太多，我根本管不过来。再加上一群不听话的孩子，真叫我一点办法也没有！
        - id: ch01-b12
          speaker: ribby
          text: 老鼠有什么可怕的？我帮你找。等找到了，我还要好好抽他一顿！对了，炉挡里怎么堆了那么多烟灰？
        - id: ch01-b13
          speaker: mrs_tabitha_twitchit
          text: 烟囱是该扫了。哎呀，小里比表姐，毛团和手套现在也不见了！
          emotion: surprised
        - id: ch01-b14
          speaker: ribby
          text: 她们两个准是从柜子里逃出来了！
        - id: ch01-b15
          speaker: narrator
          text: 小里比和塔比莎只好重新细细搜查。她们拿雨伞往床底下捅，翻遍每一个柜子，还点起蜡烛，查看阁楼里的一只衣箱。她们什么也没找到，只听见门砰地关了一回，接着有东西窸窸窣窣地冲下楼。
        - id: ch01-b16
          speaker: mrs_tabitha_twitchit
          text: 没错，这屋子已经叫老鼠占了。我在后厨房的洞里捉过七只小老鼠，上星期六还拿它们当了晚饭。有一次，我见过那只老公鼠。他的个头大得吓人！我刚要扑过去，他就冲我龇出黄牙，一转身钻回洞里。这些老鼠弄得我整天神经不宁。
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: 她们接着找。两只大猫都听见阁楼地板底下传来古怪的咕噜滚动声，却什么也看不见，只得回到厨房。
        - id: ch01-b18
          speaker: ribby
          text: 至少有一只找到了。
        - id: ch01-b19
          speaker: narrator
          text: 小里比把毛团从面粉桶里拖出来，抖掉她身上的面粉，又把她放到厨房地板上。毛团看起来吓坏了。
        - id: ch01-b20
          speaker: moppet
          text: 妈妈！刚才有个老鼠老太婆进了厨房，她偷走了一些面团！
          emotion: fearful
        - id: ch01-b21
          speaker: narrator
          text: 两只大猫赶紧去看面盆。面团上果然留下了小手抓过的印子，还有一大块不见了。
        - id: ch01-b22
          speaker: mrs_tabitha_twitchit
          text: 毛团，她往哪边跑了？
        - id: ch01-b23
          speaker: narrator
          text: 可毛团怕得要命，刚才根本没敢探头看。小里比和塔比莎继续寻找，也把她带在身边，好让她一直待在眼皮底下。
    - id: ch02
      title: 地板下面的滚动声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 她们走进奶房，马上就发现手套躲在空罐子里。两只大猫把罐子倒过来，手套手脚并用地爬了出来。
        - id: ch02-b02
          speaker: mittens
          text: 妈妈！刚才有个老鼠老头进了奶房！他大得吓人，是一只可怕的超级大老鼠！他偷走了一块黄油，还拿走了擀面杖！
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: 小里比和塔比莎互相看了一眼。
        - id: ch02-b04
          speaker: mrs_tabitha_twitchit
          text: 黄油和擀面杖！哎呀，我可怜的儿子托马斯！
          emotion: fearful
        - id: ch02-b05
          speaker: ribby
          text: 擀面杖？我们查看衣箱的时候，阁楼里不是正有东西咕噜咕噜地滚吗？
        - id: ch02-b06
          speaker: narrator
          text: 她们又冲上楼。那阵滚动声果然还在阁楼地板底下响着，听得清清楚楚。
        - id: ch02-b07
          speaker: ribby
          text: 这可严重了，塔比莎表妹。得马上请木匠约翰带着锯子过来。
    - id: ch03
      title: 汤姆爬进烟囱
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 现在，该说说小猫汤姆出了什么事了。他不肯被关进柜子。一看见母亲准备烤东西，他就决定藏起来，最后竟选中了烟囱。这件事足以说明，在一座不熟悉的老房子里，特别是屋里还有大得吓人的老鼠时，爬烟囱可不是好主意。
        - id: ch03-b02
          speaker: narrator
          text: 炉火才刚点着，热气不大，湿青柴却冒着呛人的白烟。汤姆爬上炉挡，抬头看了看那座宽大的老式壁炉。烟囱里面很宽，足够一个人站直了走，更别说一只小猫。
        - id: ch03-b03
          speaker: narrator
          text: 他跳进壁炉，落在悬水壶的铁杆上，又用力一跃，跳到烟囱高处的一道凸缘。烟灰被震下来，落进了炉挡。汤姆被呛得又咳又喘，还听见下面的木柴噼啪烧了起来。他决定一直爬到顶，从石板屋顶出去捉麻雀。
        - id: ch03-b04
          speaker: tom_kitten
          text: 我不能往回走。脚下一滑，我就会掉进火里，把漂亮的尾巴和蓝色小外套都烧焦！
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 这烟囱又高又老，是在人们还烧整根木头的年月里砌起来的。它伸出屋顶，像一座小石塔。日光从顶端挡雨的斜石板下面照进来，可汤姆还是越来越害怕。他向上爬呀，爬呀，爬呀。
        - id: ch03-b06
          speaker: narrator
          text: 接着，他侧过身，从几英寸深的烟灰里蹚过去，活像一个小扫烟囱工。黑暗里叫人分不清方向，一条烟道好像连着另一条。烟虽然少了，汤姆却彻底迷了路。
        - id: ch03-b07
          speaker: narrator
          text: 他继续往上爬。还没到烟囱顶，就看见墙上有一块松动的石头，四周还散着几根羊骨头。
        - id: ch03-b08
          speaker: tom_kitten
          text: 真奇怪，是谁跑到烟囱上面啃骨头？我真不该进来！这里还有一股怪味，像老鼠，可浓得吓人，害得我直打喷嚏。
        - id: ch03-b09
          speaker: narrator
          text: 汤姆从墙洞里挤过去，在一条窄得难受、几乎没有光的通道里拖着身子向前。他小心摸索了好几码，来到阁楼踢脚板背后，也就是图画里画着小星号的地方。
        - id: ch03-b10
          speaker: narrator
          text: 忽然，他在黑暗里一头栽进一个洞，翻着跟头掉下去，正落在一堆肮脏的破布上。汤姆爬起来看看四周。他在这座房子里住了一辈子，却从没见过这里。
        - id: ch03-b11
          speaker: narrator
          text: 这房间又小又闷，满是霉味。周围全是木板、椽子、蛛网，还有木条和灰泥。在离他远远的另一头，坐着一只硕大无比的老鼠。
        - id: ch03-b12
          speaker: samuel_whiskers
          text: 你这一身黑灰，怎么一头掉进我的床里来了？
        - id: ch03-b13
          speaker: narrator
          text: 那只老鼠说话时，牙齿咯咯直响。
        - id: ch03-b14
          speaker: tom_kitten
          text: 对不起，先生。是因为这烟囱该打扫了。
        - id: ch03-b15
          speaker: samuel_whiskers
          text: 安娜·玛丽亚！安娜·玛丽亚！
        - id: ch03-b16
          speaker: narrator
          text: 老鼠尖声一喊，椽子后面便传来嗒嗒的脚步。一只老母鼠探出头，转眼就扑向汤姆。他还没弄明白是怎么回事，外套已经被扒掉，身体也被卷成一团，用细绳打着死结捆了起来。
        - id: ch03-b17
          speaker: narrator
          text: 绳子是安娜·玛丽亚捆的。老公鼠站在一旁，不时吸一撮鼻烟。等她捆好，两只老鼠张着嘴坐在那里，直勾勾地盯着汤姆。
        - id: ch03-b18
          speaker: narrator
          text: 这只老公鼠就叫塞缪尔·大胡子。
        - id: ch03-b19
          speaker: samuel_whiskers
          text: 安娜·玛丽亚，把这只小猫做成卷布丁，给我们当晚饭。
        - id: ch03-b20
          speaker: anna_maria
          text: 那我得有面团、一块黄油，再来一根擀面杖。
        - id: ch03-b21
          speaker: narrator
          text: 她歪着头，把小猫汤姆从头到脚打量了一遍。
        - id: ch03-b22
          speaker: samuel_whiskers
          text: 不行。要想好好做，就该用面包屑。
        - id: ch03-b23
          speaker: anna_maria
          text: 胡说！就用黄油和面团。
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: 两只老鼠商量了几分钟，这才离开。
    - id: ch04
      title: 小猫卷布丁
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 塞缪尔·大胡子从护墙板的洞里钻出去，大模大样地走下正楼梯，到奶房拿了一块黄油。一路上，他一个人也没碰见。接着，他又去拿擀面杖，用爪子推着它向前滚，就像酿酒坊伙计在滚酒桶。
        - id: ch04-b02
          speaker: narrator
          text: 他听见小里比和塔比莎在说话，可她们正忙着点蜡烛查看衣箱，根本没看见他。安娜·玛丽亚则沿着踢脚板，从一扇百叶窗绕到厨房。她借来一只小碟子，用爪子舀走面团，也没发现藏在桶里的毛团。
        - id: ch04-b03
          speaker: narrator
          text: 汤姆独自留在阁楼地板下面。他拼命扭动，想大声喵喵求救。可他嘴里塞满了烟灰和蛛网，身上的绳结又紧得要命，谁也听不见他。
        - id: ch04-b04
          speaker: narrator
          text: 只有一只蜘蛛从天花板缝里爬出来，待在安全的远处，挑剔地查看那些绳结。蜘蛛当然很懂绳结，因为它常把倒霉的绿头苍蝇捆起来。不过，它一点儿也不想帮忙。汤姆又扭又挣，直到一点力气也没有了。
        - id: ch04-b05
          speaker: narrator
          text: 没过多久，两只老鼠回来了，动手把汤姆做成布丁。它们先往他身上抹黄油，再用面团把他裹住。
        - id: ch04-b06
          speaker: samuel_whiskers
          text: 安娜·玛丽亚，这些绳子吃下去，会不会很难消化？
        - id: ch04-b07
          speaker: narrator
          text: 安娜·玛丽亚说，她觉得没什么要紧。她只希望汤姆别再乱动脑袋，免得把面皮弄得不好看。说着，她一把揪住他的耳朵。
        - id: ch04-b08
          speaker: narrator
          text: 汤姆又咬又吐，又叫又扭。擀面杖咕噜滚，咕噜转，滚呀，转呀，咕噜转。两只老鼠一人抓着一头。
        - id: ch04-b09
          speaker: samuel_whiskers
          text: 他的尾巴还露在外面！安娜·玛丽亚，你拿来的面团不够。
        - id: ch04-b10
          speaker: anna_maria
          text: 我能搬得动的面团，全都拿来了。
        - id: ch04-b11
          speaker: narrator
          text: 塞缪尔·大胡子停下手，仔细瞧了瞧汤姆。
        - id: ch04-b12
          speaker: samuel_whiskers
          text: 我看，这个布丁不会好吃。它满是烟灰味。
        - id: ch04-b13
          speaker: narrator
          text: 安娜·玛丽亚正要反驳，头顶忽然传来别的声音。锯子刺啦刺啦地来回拉，还有一只小狗又抓又叫。两只老鼠立刻丢下擀面杖，竖起耳朵听着。
        - id: ch04-b14
          speaker: samuel_whiskers
          text: 我们叫人发现了，安娜·玛丽亚，还被他们打断了。快把我们的东西，还有别人的东西，全都收起来。我们马上离开。
        - id: ch04-b15
          speaker: samuel_whiskers
          text: 看来这个布丁只能留在这里了。
        - id: ch04-b16
          speaker: samuel_whiskers
          text: 不过，不管你怎么说，我还是觉得这些绳结一定很难消化。
        - id: ch04-b17
          speaker: anna_maria
          text: 快来帮我，把几根羊骨头包进床罩里扎好。烟囱里还有我藏的半只熏火腿呢。
        - id: ch04-b18
          speaker: narrator
          text: 等木匠约翰撬起地板，下面已经空无一人。那里只剩一根擀面杖，还有裹在肮脏面团里的小猫汤姆！
    - id: ch05
      title: 得救以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 地板下面的老鼠味浓得很。木匠约翰整个上午都在抽鼻子、呜呜叫、摇尾巴。他把脑袋伸进洞里，转来转去，活像一把手钻。后来，他把木板重新钉好，将工具装进袋子，下楼去了。
        - id: ch05-b02
          speaker: narrator
          text: 猫儿一家总算完全平静下来，便请他留下吃午饭。大家从汤姆身上剥下面团，把它另做成一只袋煮布丁，还添了葡萄干，好遮住里面的黑灰。为了洗掉汤姆身上的黄油，他们只好把他放进热水里洗澡。
        - id: ch05-b03
          speaker: narrator
          text: 木匠约翰闻了闻布丁，可惜没空留下。他刚替波特小姐做好一辆独轮手推车，另外还有两只鸡笼等着做。
        - id: ch05-b04
          speaker: narrator
          text: 那天下午晚些时候，我出门寄信。从街角顺着小路望过去，正看见塞缪尔·大胡子夫妇在逃跑。他们推着一辆小独轮车，车上装满大包小包。那辆车看起来很像我的。
        - id: ch05-b05
          speaker: narrator
          text: 两只老鼠刚刚拐进土豆农夫家谷仓的大门。塞缪尔·大胡子累得直喘粗气，安娜·玛丽亚还在尖声争辩。她好像认得路，而且带的行李可真不少。
        - id: ch05-b06
          speaker: narrator
          text: 我敢肯定，我从来没有答应把独轮车借给她！
        - id: ch05-b07
          speaker: narrator
          text: 他们进了谷仓，用一截绳子把包裹拉到干草垛顶上。
    - id: ch06
      title: 后来的老鼠
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 从那以后，塔比莎·特威契特太太家里很久都没再闹老鼠。可土豆农夫差点被老鼠逼疯。他的谷仓里到处是老鼠，老鼠，还是老鼠！它们吃光鸡食，偷走燕麦和麸皮，还在面粉袋上咬出一个个洞。
        - id: ch06-b02
          speaker: narrator
          text: 那些老鼠全是塞缪尔·大胡子夫妇的后代，有儿女，有孙辈，还有曾孙辈，一代接着一代。
        - id: ch06-b03
          speaker: narrator
          text: 简直没完没了！
        - id: ch06-b04
          speaker: narrator
          text: 毛团和手套长大以后，都成了很出色的捕鼠能手。她们走遍村子替人捉老鼠，生意好得很。她们按一打老鼠收一次钱，日子过得相当舒服。
        - id: ch06-b05
          speaker: narrator
          text: 每捉到一只老鼠，她们就把尾巴挂在谷仓门上，让人一眼看清她们的收获。一打又一打，多得数也数不完。
        - id: ch06-b06
          speaker: narrator
          text: 可小猫汤姆从此一直害怕老鼠。凡是比——
        - id: ch06-b07
          speaker: narrator
          text: 一只小老鼠更大的东西，他都再也不敢面对。
