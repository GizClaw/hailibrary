audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    tabitha_twitchit:
      display_name: Mrs. Tabitha Twitchit
      tts:
        delivery: motherly and proper, quickening when worried
        timbre: mature and soft-edged
        pace: moderately brisk
        pitch: medium-high
    moppet:
      display_name: Moppet
      tts:
        delivery: young, direct, and easily startled
        timbre: light and clear
        pace: quick
        pitch: high
    mittens:
      display_name: Mittens
      tts:
        delivery: playful, curious, and childlike
        timbre: bright and delicate
        pace: quick
        pitch: high
    ribby:
      display_name: Mrs. Ribby
      tts:
        delivery: practical, confident, and plainspoken
        timbre: firm and warm
        pace: steady
        pitch: medium
    tom_kitten:
      display_name: Tom Kitten
      tts:
        delivery: youthful and adventurous, turning breathless under pressure
        timbre: small and clear
        pace: lively
        pitch: medium-high
    samuel_whiskers:
      display_name: Samuel Whiskers
      tts:
        delivery: fussy, pompous, and calculating
        timbre: dry and raspy
        pace: deliberate
        pitch: low
    anna_maria:
      display_name: Anna Maria
      tts:
        delivery: sharp, brisk, and argumentative
        timbre: thin and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: The Missing Kittens
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an old cat named Mrs. Tabitha Twitchit. She was an anxious mother, and with good reason. Her kittens were forever getting lost, and whenever they disappeared, they were sure to be making trouble. On baking day, Tabitha decided to shut them safely in a cupboard. She caught Moppet and Mittens, but Tom was nowhere to be found.
        - id: ch01-b02
          speaker: narrator
          text: She went up and down through the whole house, calling and mewing for Tom Kitten. She searched the pantry beneath the stairs. She looked through the best spare bedroom, where dust sheets covered everything. Then she climbed right to the top of the house and searched the attics. No Tom. It was a very old house, crowded with cupboards and winding passages. Some walls were four feet thick. Strange sounds came from inside them, as if a tiny hidden staircase ran through the walls. There were jagged little doors in the woodwork, too, and things vanished at night, especially cheese and bacon.
        - id: ch01-b03
          speaker: narrator
          text: Tabitha grew more frantic by the minute, and her mewing became dreadful. Meanwhile, Moppet and Mittens had begun making trouble of their own. The cupboard was not locked. They pushed open the door and went straight to the pan of dough rising by the fire. They patted it with their soft little paws.
        - id: ch01-b04
          speaker: mittens
          text: Let's make sweet little muffins for everyone.
        - id: ch01-b05
          speaker: narrator
          text: Just then, someone knocked at the front door. Moppet was so frightened that she jumped into the flour barrel. Mittens ran to the dairy and hid inside an empty jar on the stone shelf by the milk pans.
        - id: ch01-b06
          speaker: narrator
          text: The visitor was their neighbor, Mrs. Ribby, who had come to borrow yeast. Tabitha hurried downstairs, still mewing, and burst into tears.
        - id: ch01-b07
          speaker: tabitha_twitchit
          text: Come in, Cousin Ribby, and please sit down. I'm in terrible trouble. My dear Thomas is missing, and I'm afraid the rats have taken him.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: She wiped her eyes on her apron.
        - id: ch01-b09
          speaker: ribby
          text: That kitten is badly behaved. Last time I came for tea, he tangled my best bonnet into a cat's cradle. Where have you searched?
        - id: ch01-b10
          speaker: tabitha_twitchit
          text: Everywhere! There are more rats than I can handle. Oh, what a trial it is to have such an unruly family!
        - id: ch01-b11
          speaker: ribby
          text: Rats don't scare me. I'll help find him, and I'll give him a whipping, too. But what's all that soot doing in the fender?
        - id: ch01-b12
          speaker: tabitha_twitchit
          text: The chimney needs sweeping. Oh, Cousin Ribby! Now Moppet and Mittens have vanished, too!
          emotion: surprised
        - id: ch01-b13
          speaker: ribby
          text: They've both escaped from the cupboard!
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: Ribby and Tabitha began a thorough search of the entire house. They poked beneath every bed with the end of Ribby's umbrella and rummaged through the cupboards. In one attic, they fetched a candle and peered deep inside a clothes chest. They found nothing at all. Once, though, a door banged somewhere nearby, and they heard somebody scampering down the stairs.
        - id: ch01-b15
          speaker: tabitha_twitchit
          text: Yes, this house is overrun with rats. I caught seven young ones in a single hole in the back kitchen. We ate them last Saturday. And once I saw their father, an enormous old rat. I was ready to spring when he bared his yellow teeth and whipped down the hole. Those rats make me so nervous, Cousin Ribby.
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Ribby and Tabitha searched and searched. While they were in the attic, both cats heard a strange roly-poly sound moving beneath the floorboards. They stopped and listened, but there was nothing to be seen. At last, they gave up on the attic and returned to the kitchen.
        - id: ch01-b17
          speaker: ribby
          text: Well, here's one kitten, at least.
        - id: ch01-b18
          speaker: narrator
          text: Ribby pulled Moppet from the flour barrel. The cats shook off the flour and set her on the floor. She looked terrified.
        - id: ch01-b19
          speaker: moppet
          text: Oh, Mother! An old lady rat came into the kitchen, and she stole some dough!
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: The cats rushed to the dough pan. Tiny finger marks scratched the surface, and a lump of dough was gone.
        - id: ch01-b21
          speaker: tabitha_twitchit
          text: Which way did she go, Moppet?
        - id: ch01-b22
          speaker: narrator
          text: Moppet had been too frightened to look out of the barrel. Ribby and Tabitha kept her close and continued the search. In the dairy, they found Mittens tucked inside the empty jar. They tipped it over, and out she scrambled.
        - id: ch01-b23
          speaker: mittens
          text: Oh, Mother! A horrible, enormous old man rat was in the dairy. He stole a pat of butter and the rolling pin!
          emotion: fearful
        - id: ch01-b24
          speaker: narrator
          text: Ribby and Tabitha stared at each other.
        - id: ch01-b25
          speaker: tabitha_twitchit
          text: Butter and a rolling pin! Oh, my poor Thomas!
          emotion: fearful
        - id: ch01-b26
          speaker: ribby
          text: A rolling pin? Didn't we hear something rolling under the attic floor while we searched that chest?
        - id: ch01-b27
          speaker: narrator
          text: They raced upstairs. The roly-poly sound was still going on, clear as ever, beneath the attic boards.
        - id: ch01-b28
          speaker: ribby
          text: This is serious, Cousin Tabitha. Send for John Joiner at once, and tell him to bring a saw.
    - id: ch02
      title: Tom in the Chimney
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Now, here is what had happened to Tom Kitten. It shows why climbing a chimney is a very bad idea in an old house full of enormous rats. Tom did not want to be shut in a cupboard. When he saw his mother preparing to bake, he looked for somewhere to hide and chose the chimney.
        - id: ch02-b02
          speaker: narrator
          text: The fire had only just been lit, so it was not hot yet. Still, the green sticks gave off thick white smoke. Tom climbed onto the fender and looked up into the huge, old-fashioned fireplace. The chimney was wide enough for a grown man to stand and walk inside. There was plenty of room for a small cat.
        - id: ch02-b03
          speaker: narrator
          text: Tom jumped onto the iron bar that held the kettle. From there, he made one more great leap and landed on a ledge high inside the chimney. A shower of soot fell into the fender below. Tom coughed and choked. Down in the fireplace, the sticks had begun to crackle. He decided to climb all the way out through the top and catch sparrows on the roof.
        - id: ch02-b04
          speaker: tom_kitten
          text: I can't go back now. If I slip, I could fall into the fire and scorch my beautiful tail and my little blue jacket.
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: The great chimney had been built long ago, when people burned whole logs of wood on the open hearth. Above the roof, its stack rose like a little stone tower. Daylight came down from the top and slipped beneath the sloping roof slates that kept out the rain. Tom could see the light far above him. He was growing very frightened, but he climbed higher and higher and higher.
        - id: ch02-b06
          speaker: narrator
          text: Then he had to push sideways through inches of soot. Soon he looked like a tiny chimney sweep. In the darkness, one flue seemed to run into another. The smoke was thinner now, but Tom was completely lost.
        - id: ch02-b07
          speaker: narrator
          text: Before he reached the top, he found a loose stone in the wall. Mutton bones lay scattered nearby.
        - id: ch02-b08
          speaker: tom_kitten
          text: That's strange. Who has been chewing bones up inside the chimney? I wish I'd never come here. And what's that smell? It's like a mouse, only much, much stronger. It's making me sneeze.
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: Tom squeezed through the hole in the wall and dragged himself into a passage so tight that it pressed against him. There was scarcely any light. He crept forward for several yards, feeling his way behind the baseboard in the attic wall. Then, without warning, the floor disappeared beneath him. He tumbled head over heels down a dark hole and landed on a heap of filthy old rags.
        - id: ch02-b10
          speaker: narrator
          text: He stood up and looked around. Though he had lived in the house all his life, he had never seen this place. It was a tiny, stale room under the floor, boxed in by boards and rafters, cobwebs, lath, and plaster. On the other side of the room, sitting as far from Tom as he could, was an enormous rat.
        - id: ch02-b11
          speaker: samuel_whiskers
          text: What do you think you're doing, falling into my bed covered in soot?
          emotion: angry
        - id: ch02-b12
          speaker: tom_kitten
          text: Please, sir, the chimney needs to be swept.
          emotion: fearful
        - id: ch02-b13
          speaker: samuel_whiskers
          text: Anna Maria! Anna Maria!
        - id: ch02-b14
          speaker: narrator
          text: Teeth chattered. Feet pattered. Then an old lady rat poked her head around a rafter. In an instant she rushed at Tom. Before he understood what was happening, his coat was off. Anna Maria rolled him into a bundle and tied him with string, knot after hard knot. Samuel Whiskers watched and took snuff. When she was done, the two rats sat with their mouths open, staring at Tom.
    - id: ch03
      title: A Kitten Dumpling
      blocks:
        - id: ch03-b01
          speaker: samuel_whiskers
          text: Anna Maria, make me a roly-poly kitten dumpling for dinner.
        - id: ch03-b02
          speaker: anna_maria
          text: Then I need dough, a pat of butter, and a rolling pin.
        - id: ch03-b03
          speaker: narrator
          text: She tilted her head and studied Tom.
        - id: ch03-b04
          speaker: samuel_whiskers
          text: No, Anna Maria. Do it properly. Use breadcrumbs.
        - id: ch03-b05
          speaker: anna_maria
          text: Nonsense! It must be butter and dough.
        - id: ch03-b06
          speaker: narrator
          text: The rats discussed the recipe for several minutes. Then they went to gather what they needed. Samuel Whiskers slipped through a hole in the woodwork and boldly walked down the front stairs. He reached the dairy without meeting anyone and took the butter.
        - id: ch03-b07
          speaker: narrator
          text: He went back for the rolling pin and shoved it ahead with his paws, like a workman rolling a barrel. He could hear Ribby and Tabitha talking nearby, but they were lighting the candle to search the clothes chest. They never saw him.
        - id: ch03-b08
          speaker: narrator
          text: Anna Maria traveled behind the baseboard and down past a window shutter to the kitchen. She borrowed a small saucer and scooped up dough with her paws. Moppet was hiding there, but Anna Maria did not notice her.
        - id: ch03-b09
          speaker: narrator
          text: Alone beneath the attic floor, Tom twisted inside the string and tried to mew for help. His mouth was clogged with soot and cobwebs, and the hard knots held him so tightly that he could not make anyone hear. No one except a spider. It crept from a crack in the ceiling and examined every knot with great care, though it stayed at a safe distance. The spider knew a great deal about knots because it had a habit of tying up unlucky bluebottle flies. Even so, it did not offer Tom any help.
        - id: ch03-b10
          speaker: narrator
          text: Tom wriggled and squirmed until he was exhausted. Soon the rats returned and began turning him into a dumpling. They smeared him with butter first, then rolled him in the dough.
        - id: ch03-b11
          speaker: samuel_whiskers
          text: Won't all that string be rather hard to digest, Anna Maria?
        - id: ch03-b12
          speaker: anna_maria
          text: It won't matter. But I do wish this kitten would keep his head still. He's ruining the pastry.
        - id: ch03-b13
          speaker: narrator
          text: She grabbed his ears. Tom bit and spat, mewed and twisted, while both rats pushed the rolling pin back and forth. Roly-poly, roly. Roly, poly, roly.
        - id: ch03-b14
          speaker: samuel_whiskers
          text: His tail is sticking out! You didn't bring enough dough, Anna Maria.
        - id: ch03-b15
          speaker: anna_maria
          text: I brought all I could carry.
        - id: ch03-b16
          speaker: samuel_whiskers
          text: I don't think this pudding will be any good. It smells of soot.
          emotion: disgusted
    - id: ch04
      title: John Joiner Comes with a Saw
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Anna Maria was about to argue when new sounds came from above. A saw began rasping through the floorboards. A little dog scratched and yelped overhead. The rats dropped the rolling pin and listened.
        - id: ch04-b02
          speaker: samuel_whiskers
          text: They've found us and spoiled our dinner. We must gather our belongings, including the ones that belong to other people, and leave immediately.
        - id: ch04-b03
          speaker: anna_maria
          text: I'm afraid we'll have to leave this pudding behind.
        - id: ch04-b04
          speaker: samuel_whiskers
          text: Those knots would have been impossible to digest, no matter what you say.
        - id: ch04-b05
          speaker: anna_maria
          text: Stop talking and help me bundle these mutton bones in a bedspread. I've got half a smoked ham hidden in the chimney.
        - id: ch04-b06
          speaker: narrator
          text: By the time John Joiner lifted the floorboard, the rats were gone. Under the floor, he found only the rolling pin and Tom Kitten, wrapped in one very dirty dumpling. The place smelled strongly of rats. For the rest of the morning, John sniffed and whined and wagged his tail. He circled the opening again and again, poking his head into it like a drill.
        - id: ch04-b07
          speaker: narrator
          text: At last, John nailed the floorboard back into place. He packed the saw and the rest of his tools into his bag and carried them downstairs. By then, the cat family had recovered from the fright, and they invited him to stay for dinner. They had carefully peeled the dumpling off Tom. Then they cooked the dough separately as a bag pudding, adding currants to hide the black flecks of soot. Tom himself had to be put into a hot bath before they could wash all the butter from his fur.
        - id: ch04-b08
          speaker: narrator
          text: John sniffed the pudding, but said he could not stay. He had just finished building a wheelbarrow for Miss Potter, and she was still waiting for two chicken coops.
    - id: ch05
      title: Rats, Rats, and Rats
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Late that afternoon, as I walked to the post office, I looked up the lane. There were Samuel Whiskers and his wife, running away with large bundles piled on a little wheelbarrow. It looked very much like mine. They turned through the gate of Farmer Potatoes's barn.
        - id: ch05-b02
          speaker: narrator
          text: Samuel was puffing and out of breath. Anna Maria was still arguing in her shrill voice. She seemed to know exactly where she was going, and she had brought a remarkable amount of luggage. I am quite sure I never gave her permission to borrow my wheelbarrow!
        - id: ch05-b03
          speaker: narrator
          text: The rats entered the barn and used a piece of string to haul their bundles to the top of the haystack. After that, Tabitha Twitchit's house had no rats for a long while.
        - id: ch05-b04
          speaker: narrator
          text: Farmer Potatoes was not so lucky. The rats in his barn nearly drove him out of his mind. They ate the chicken feed, stole the oats and bran, and chewed holes through the sacks of meal. Every one of them came from Mr. and Mrs. Samuel Whiskers. There were children, grandchildren, and great-great-grandchildren. The family never seemed to end.
        - id: ch05-b05
          speaker: narrator
          text: Moppet and Mittens grew up to be excellent rat catchers. They went out hunting rats all around the village, where there was always plenty of work for them. They charged their customers by the dozen and earned a very comfortable living. On the barn door, they hung the rats' tails in a row to show exactly how many they had caught. There were dozens and dozens of tails.
        - id: ch05-b06
          speaker: narrator
          text: But Tom Kitten remained afraid of rats. From then on, he never dared face anything larger than—
        - id: ch05-b07
          speaker: narrator
          text: A mouse.
