audio_script:
  language: en-US
  cast:
    narrator: {display_name: Narrator, tts: {delivery: close and observant like a storyteller beside the listener, timbre: warm and clear, pace: measured and natural, pitch: medium}}
    linlin: {display_name: June, tts: {delivery: cautious at first and increasingly curious, timbre: young and bright, pace: natural, pitch: medium-high}}
    mama: {display_name: Mom, tts: {delivery: steady with dry warmth, timbre: soft and grounded, pace: unhurried, pitch: medium}}
    papa: {display_name: Dad, tts: {delivery: earnest with gentle self-mocking humor, timbre: warm and full, pace: natural, pitch: medium-low}}
    grandma-wu: {display_name: Mrs. Wu, tts: {delivery: plainspoken and kind, timbre: lightly weathered, pace: unhurried, pitch: medium-low}}
    a-jun: {display_name: Milo, tts: {delivery: talkative and openly excited, timbre: bright and youthful, pace: quick, pitch: medium-high}}
    neighbor: {display_name: Neighbor, tts: {delivery: calling naturally across the courtyard, timbre: clear and friendly, pace: natural, pitch: medium}}
  chapters:
    - id: ch01
      title: The Last Little Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            The sun was down, but the day's heat was still trapped in the brick walls and balcony tiles. June came out of the shower with the ends of her black hair dripping down her pajama shirt. The air conditioner hummed over the television. On the rug, she was building an apartment tower out of cereal boxes, tape, and colored paper.

            She had one paper window left. She held it against the top floor, and right then the fan swung her way and blew it under the coffee table.
        - {id: ch01-b02, speaker: linlin, text: You have terrible timing.}
        - id: ch01-b03
          speaker: narrator
          text: |-
            Mom was cutting melon in the kitchen. Dad sat at the table answering a message and promising he'd put his phone away in one minute. He'd already made that promise twice.

            June crawled under the table, found the window beside one yellow sandal, and pressed the paper flat. Back at her tower, she held her breath and dabbed glue on it.

            Then the room went dark.

            The fan slowed with a long, falling sigh. The air conditioner stopped. In the kitchen, the knife clicked against a plate and went still. The paper window disappeared between June's fingers. For a second, she thought she'd shut her eyes. She opened them as wide as she could. Nothing changed.

            Then the refrigerator stopped humming too.

            It wasn't truly silent. Cicadas buzzed outside. A horn sounded on the street. Water moved through a pipe in the wall. Even so, the apartment felt as if it had stepped backward and left June alone on the rug. She reached for her tower and knocked it over. Boxes tumbled, and something small rolled under the sofa.
        - {id: ch01-b04, speaker: linlin, text: "Mom?", emotion: fearful}
        - {id: ch01-b05, speaker: mama, text: I'm in the kitchen. Stay where you are. Your city is all over the floor., emotion: calm}
        - id: ch01-b06
          speaker: narrator
          text: Dad's chair scraped.
        - {id: ch01-b07, speaker: papa, text: I can get a light.}
        - id: ch01-b08
          speaker: narrator
          text: A white glow came on under Dad's chin. His eyes floated above it, and his nostrils threw two enormous shadows. June gave a startled hiccup.
        - {id: ch01-b09, speaker: mama, text: Maybe point the phone away from your face.}
        - {id: ch01-b10, speaker: papa, text: I was checking if it worked.}
        - {id: ch01-b11, speaker: mama, text: Your face works.}
        - id: ch01-b12
          speaker: narrator
          text: |-
            Dad lowered the light. June almost laughed, though she still wanted Mom close enough to touch. Careful footsteps crossed the room, and then Mom's hand found her shoulder.
        - {id: ch01-b13, speaker: mama, text: There you are., emotion: calm}
        - {id: ch01-b14, speaker: linlin, text: I was here the whole time.}
        - {id: ch01-b15, speaker: mama, text: So was I., emotion: calm}
        - id: ch01-b16
          speaker: narrator
          text: |-
            Dad opened the drawer where the flashlight was supposed to live. He found string, tape, old batteries, a toy wheel, and one wool mitten left from winter. No flashlight.

            Someone knocked across the hall. Mrs. Wu called through the door:
        - {id: ch01-b17, speaker: grandma-wu, text: "Did your lights go out too?"}
        - id: ch01-b18
          speaker: narrator
          text: Mom opened the door. The hallway's emergency light turned the walls green. Mrs. Wu stood there in a flowered nightdress, holding her folding fan like a paddle.
        - {id: ch01-b19, speaker: papa, text: The whole floor is dark.}
        - id: ch01-b20
          speaker: narrator
          text: Milo's voice dropped from the balcony above.
        - {id: ch01-b21, speaker: a-jun, text: The whole building! I looked down. Every floor is out!}
        - id: ch01-b22
          speaker: narrator
          text: Milo sounded thrilled to have breaking news. June wasn't thrilled. The words “every floor” stacked the darkness higher than her fallen tower.
    - id: ch02
      title: One Small Flame
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Mom found a short candle left from somebody's birthday, but no candleholder. Dad suggested melting it onto a saucer. Mom shook her head.
        - {id: ch02-b02, speaker: mama, text: Put it in a glass jar. And keep it far from the curtain.}
        - id: ch02-b03
          speaker: narrator
          text: |-
            She washed and dried an empty jam jar, then set it on the round stool in the middle of the balcony. June stayed in the doorway while Dad struck a match. At that sharp scratch, an orange flame jumped up, and June stepped behind Mom.

            The candle stood inside the jar. Its light only reached the stool, Mom's hands, and the toes of June's sandals. It couldn't fill the living room. Still, the dark wasn't one huge thing anymore. Now it had corners. It had edges.

            Dad finally found the flashlight in the toolbox on top of the shoe cabinet. He pressed the switch. Nothing. He rolled the batteries against his palm as if he might wake them.
        - {id: ch02-b04, speaker: papa, text: Dead.}
        - {id: ch02-b05, speaker: mama, text: Then it can have the night off.}
        - id: ch02-b06
          speaker: narrator
          text: |-
            Mom carried three melon slices out to the balcony. June didn't follow. Beyond the open door, the courtyard looked like a deep, empty bowl. No streetlights, no bright corner-shop sign. Even the familiar tree looked like a stranger leaning over the wall.

            Mom didn't pull her outside. She left a melon slice on a stool near the doorway and sat by the candle. Dad borrowed Mrs. Wu's folding fan. After three waves, Mrs. Wu laughed from the next balcony.
        - {id: ch02-b07, speaker: grandma-wu, text: "The handle goes in your hand, Henry.", emotion: happy}
        - id: ch02-b08
          speaker: narrator
          text: Dad looked down. He'd been holding the fan by its wide end.
        - {id: ch02-b09, speaker: papa, text: I was testing another method.}
        - {id: ch02-b10, speaker: grandma-wu, text: "Does the other method make wind?", emotion: happy}
        - {id: ch02-b11, speaker: papa, text: It makes my arm tired., emotion: happy}
        - id: ch02-b12
          speaker: narrator
          text: |-
            Balcony doors slid open above and below. A woman asked if anyone was in the elevator. Someone in the courtyard said the building manager had checked. A man worried aloud about the ice cream melting in his freezer.
        - {id: ch02-b13, speaker: neighbor, text: Eat it now!}
        - id: ch02-b14
          speaker: narrator
          text: |-
            Children cheered on three different floors.

            Usually, televisions, kitchen fans, traffic, and music covered all those voices. Tonight they floated through the open middle of the building. June heard a baby fussing on six, hangers clicking on nine, and Milo on twelve trying to count every phone light.
        - {id: ch02-b15, speaker: a-jun, text: "Two, four, seven, eleven—"}
        - {id: ch02-b16, speaker: linlin, text: You missed five.}
        - id: ch02-b17
          speaker: narrator
          text: June had spoken before she meant to. Everything above went quiet for a beat.
        - {id: ch02-b18, speaker: a-jun, text: "June? Are you outside?", emotion: surprised}
        - id: ch02-b19
          speaker: narrator
          text: Milo leaned over his railing, just a shape against the sky. June looked down and realized she'd left the doorway. She stood beside the stool, melon in hand, with cool juice running along her wrist.
        - {id: ch02-b20, speaker: linlin, text: Only a little outside.}
        - {id: ch02-b21, speaker: a-jun, text: It still counts.}
        - id: ch02-b22
          speaker: narrator
          text: |-
            Mr. Bell, the building manager, came outside with a flashlight. He asked everyone to wait and reminded them not to use the elevator until the power had been checked. Neighbors passed the message from floor to floor. By the time it reached Milo, it had turned into this:
        - {id: ch02-b23, speaker: a-jun, text: Everybody sit down and wait!}
        - {id: ch02-b24, speaker: linlin, text: He said not to use the elevator.}
        - {id: ch02-b25, speaker: a-jun, text: I know. I was talking to my ice cream., emotion: happy}
        - id: ch02-b26
          speaker: narrator
          text: Laughter moved through the building again. June took another bite of melon. This time she didn't hurry back to the door.
    - id: ch03
      title: What the Dark Kept
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The candle threw three shadows on the balcony wall. Dad lifted Mrs. Wu's fan, and a flat fish swam over June's head. June made a dog whose mouth opened and closed. Mom tried a rabbit, but all she got was two ears with nothing under them.
        - {id: ch03-b02, speaker: linlin, text: "Where's its head?"}
        - {id: ch03-b03, speaker: mama, text: Hidden in the dark.}
        - {id: ch03-b04, speaker: linlin, text: "Then how does it know where to hop?"}
        - id: ch03-b05
          speaker: narrator
          text: Mom looked at her unfinished rabbit.
        - {id: ch03-b06, speaker: mama, text: Maybe it listens.}
        - id: ch03-b07
          speaker: narrator
          text: |-
            June thought the building was like that rabbit. A lot of it had disappeared, but it wasn't empty. A spoon fell in one apartment. A cat complained in another. A door opened, and someone called a name down the stairs. Mrs. Wu's fan snapped shut, then opened with a soft wooden clap.

            Someone on seven hummed two lines of a song and forgot the rest. A man on eight picked up the wrong tune. Another voice found the first tune and sent it upward again. Nobody sang the whole song, but it still traveled around the courtyard. When it faded, June heard a bus announce a stop several streets away. The voice was so faint, it sounded as if it came through the other side of a pillow.

            At bedtime, June often complained about chairs scraping upstairs or the gate closing below. Now every sound stood on its own. She could tell what was near and what was far. The sounds weren't what had scared her. The worst part had been that first moment, when she'd thought the dark meant nothing was there.
        - {id: ch03-b08, speaker: grandma-wu, text: "Still frightened?"}
        - id: ch03-b09
          speaker: narrator
          text: June wanted to say no. “No” was quick. It sounded brave. But the hallway behind her was still dark enough to hide every room.
        - {id: ch03-b10, speaker: linlin, text: Some., emotion: fearful}
        - {id: ch03-b11, speaker: grandma-wu, text: "Me too. Without my glasses, I might put this fan on my nose.", emotion: happy}
        - id: ch03-b12
          speaker: narrator
          text: Milo laughed until he coughed. Dad joined in.
        - {id: ch03-b13, speaker: papa, text: I'm afraid the flashlight will wake up tomorrow and be mad we didn't invite it., emotion: happy}
        - id: ch03-b14
          speaker: narrator
          text: |-
            Mom didn't say what she was afraid of. She wiped the melon juice from June's wrist, moved the jar farther from the curtain, and made sure it sat flat on the stool.

            A breeze came through the gap between buildings. It wasn't like the air conditioner's steady push. It touched June's damp hair and left. It lifted one corner of a napkin, changed its mind, and disappeared. When it came back, it bent the candle flame low inside the jar.
        - {id: ch03-b15, speaker: linlin, text: "Will it go out?", emotion: fearful}
        - id: ch03-b16
          speaker: narrator
          text: Mom cupped her hands near the glass without touching it.
        - {id: ch03-b17, speaker: mama, text: "It might. But if it does, we'll still be here.", emotion: calm}
        - id: ch03-b18
          speaker: narrator
          text: |-
            June watched the flame stand up again. It hadn't grown just because the whole building was dark. It simply kept one small circle bright.

            She slipped off her sandals, felt the cool tile under her feet, and took two steps toward the railing. The courtyard wasn't an empty bowl anymore. Phone lights moved under the tree. People carried folding chairs outside. Mr. Bell crossed from the front desk toward the electrical room. The next block still had power, and headlights from the intersection slid slowly over the walls.

            The dark hadn't taken the world away. It had moved familiar things into unfamiliar places.

            Dad touched June's shoulder.
        - {id: ch03-b19, speaker: papa, text: Look up.}
    - id: ch04
      title: Above the Water Tank
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: June first saw the black edge of the roof. Above that was a blue so deep it seemed to go on behind everything. Most nights, pale city light hung over the rooftops. Tonight it was thinner, and little bright points showed through. June tipped her head back.
        - {id: ch04-b02, speaker: linlin, text: "Are those all stars?", emotion: surprised}
        - {id: ch04-b03, speaker: papa, text: The ones we can see are. I don't know their names.}
        - id: ch04-b04
          speaker: narrator
          text: Milo called from above.
        - {id: ch04-b05, speaker: a-jun, text: I know the brightest one!}
        - {id: ch04-b06, speaker: grandma-wu, text: "What's it called?"}
        - id: ch04-b07
          speaker: narrator
          text: Milo took a long time to answer.
        - {id: ch04-b08, speaker: a-jun, text: The brightest one., emotion: happy}
        - id: ch04-b09
          speaker: narrator
          text: |-
            Laughter fell from the twelfth floor to the eighth, then down into the courtyard. June laughed too, still looking up. She didn't need every star to have a name. Some were sharp, some faint. One vanished when she looked straight at it and came back when she looked a little to the side.

            Mom switched off her phone light. Dad switched off his. Now the candle was the only yellow glow on the balcony. June almost asked them to turn the phones back on. She could feel the words waiting behind her teeth. But before she spoke, the dark began to change. She found the pale curve of Mom's cheek, Dad's hand on his knee, and Mrs. Wu's fan slowly opening and closing. More stars seemed to arrive above the roof.

            One bright point sat beside the water tank on the opposite building. June held up a finger. From where she stood, the star was only a fingertip from the tank. She knew that wasn't the real distance. She liked measuring it that way anyway.
        - {id: ch04-b10, speaker: linlin, text: "Where were they before?"}
        - {id: ch04-b11, speaker: mama, text: Right there. Tonight they're just easier for us to see.}
        - id: ch04-b12
          speaker: narrator
          text: |-
            June thought about her box building. With the lights on, she'd worried about one crooked paper window. With the lights off, the whole tower had disappeared. But in that same darkness, she'd heard a building full of people and found the sky above its roof.

            The elevator started with a low hum. Across the courtyard, windows flashed on in a row—white, gold, blue-white. The air conditioner sighed awake. The refrigerator began its familiar song. The living-room lamp flooded the balcony, and June squinted.
        - {id: ch04-b13, speaker: neighbor, text: Power's back!, emotion: happy}
        - id: ch04-b14
          speaker: narrator
          text: Dad stood up.
        - {id: ch04-b15, speaker: papa, text: I'll check the freezer.}
        - id: ch04-b16
          speaker: narrator
          text: Mom leaned toward the candle. June put a hand lightly on her wrist.
        - {id: ch04-b17, speaker: linlin, text: Wait.}
        - id: ch04-b18
          speaker: narrator
          text: Mom looked at her.
        - {id: ch04-b19, speaker: linlin, text: One more star.}
        - id: ch04-b20
          speaker: narrator
          text: |-
            Dad had reached the doorway, but he came back and switched off the living-room lamp. One apartment across the courtyard went dark again. Then another. Milo called from above:
        - {id: ch04-b21, speaker: a-jun, text: "Who can find the faintest one?"}
        - id: ch04-b22
          speaker: narrator
          text: |-
            The air conditioner was running. The elevator was moving. The city's glow was already climbing back into the sky. Inside the glass jar, the candle had shortened to one warm bead of light.

            June rested her head on Mom's shoulder and chose the smallest star beside the water tank.

            She kept it to herself.
