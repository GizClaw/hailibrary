schema_version: 1
required: true
sources:
  - url: "https://www.nps.gov/subjects/nightskies/lightpollution.htm"
    authority: U.S. National Park Service Night Skies program
    claims:
      - "Artificial skyglow reduces the contrast of stars against the night sky, so fewer stars are visible in a brightly lit city."
      - Reducing nearby artificial light lets the eye dark-adapt more fully and improves night-sky visibility.
  - url: "https://www.ncbi.nlm.nih.gov/books/NBK11525/"
    authority: "Webvision, University of Utah and U.S. National Library of Medicine NCBI Bookshelf"
    claims:
      - Visual sensitivity increases over time after a person moves from bright light into darkness.
      - "Cone adaptation begins quickly, while the more sensitive rod pathway contributes after more time in low light."
  - url: "https://nightsky.jpl.nasa.gov/documents/837/TTKReadyObserve1.pdf"
    authority: NASA Jet Propulsion Laboratory Night Sky Network
    claims:
      - Looking slightly to the side of a faint object can make it easier to see through averted vision.
notes:
  - "The story makes no precise claim about the number, identity, or distance of the visible stars."
  - The brief outage and neighborhood setting are fictional; the cited sources support only the ordinary visual effects used in the plot.
