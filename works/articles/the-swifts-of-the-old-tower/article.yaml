schema_version: 1
id: the-swifts-of-the-old-tower
type: fiction
category: fiction
genre: natural-science
age_range: {min: 6, max: 9}
style: naturalistic-storybook
labels:
  topics: [animals, nature, travel]
  themes: [curiosity, cooperation, responsibility]
  moods: [gentle, hopeful, reflective]
research: required
premise: >
  一座老城楼每年春天迎来一群北京雨燕。孩子与守楼人等待它们归来，用谨慎观察确认巢洞；
  城楼修缮与育雏期冲突时，孩子、守楼人、施工负责人和保护人员必须在公共安全、文物修缮
  与雨燕繁殖之间寻找有证据的办法。幼鸟离巢后，工程保留并补建巢腔，人们在秋天目送雨燕
  循已知种群的迁徙方向前往非洲南部越冬，同时承认归期与个体路线并非保证。
characters:
  - {id: child, description: 小禾，一名住在城楼附近、急于证明雨燕巢洞位置又逐渐学会严谨观察的孩子}
  - {id: tower-keeper, description: 老沈，长期记录雨燕来去日期的守楼人，寡言、谨慎，重视证据}
  - {id: foreman, description: 梁岚，负责城楼修缮的施工负责人，把公共安全和工期压力扛在肩上}
  - {id: conservator, description: 陈老师，负责协调文物保护与野生动物保护意见的文保人员}
locales:
  zh-CN: {writer: 雨歌, working_title: 老城楼的雨燕, length: 3000-4500 字}
  en-US: {writer: rain-song, working_title: The Open Stone, length: 2000-3000 words}
picture_book: {level: k}
cover_prompt: |-
  A wordless wide establishing scene of an old gray-brick city gate tower in Beijing at late spring dusk, seen from its quiet stone courtyard. Eleven anatomically accurate Beijing common swifts with dark brown-black bodies, pale throats, long swept-back sickle wings, and short forked tails race around the tiled eaves. In the foreground, an eleven-year-old Chinese girl with a straight black bob, mustard-yellow rain jacket, navy pants, red canvas shoes, and a small red pencil looks upward beside an older Chinese tower keeper with short silver hair, a weathered olive work jacket, charcoal trousers, and a clothbound brown ledger. One swift folds its wings toward a narrow preserved opening under the east cornice. Make the opening and the shared upward attention the focal action; keep scaffolding faint and secondary at the far west wall. No visible text, letters, numbers, symbols, logos, captions, signs, speech bubbles, signatures, or watermarks.
