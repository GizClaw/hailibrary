audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 像念童谣一样明快有节奏，随着人物增多自然推进
        timbre: 温暖清亮
        pace: 从容，回环句保持稳定节拍
        pitch: 中音
  chapters:
    - id: ch01
      title: 房子里的麦芽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这座房子，是杰克盖起来的。
        - id: ch01-b02
          speaker: narrator
          text: 这些麦芽，就放在杰克盖的房子里。
        - id: ch01-b03
          speaker: narrator
          text: 老鼠来了。它偷吃了麦芽，而那些麦芽，原本就放在杰克盖的房子里。
    - id: ch02
      title: 猫、狗和弯角牛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接着是这只猫。猫咬死了老鼠，老鼠偷吃了麦芽，麦芽就放在杰克盖的房子里。
        - id: ch02-b02
          speaker: narrator
          text: 这回狗也来了。狗追着猫，猫咬死老鼠，老鼠偷吃麦芽，麦芽仍放在杰克盖的房子里。
        - id: ch02-b03
          speaker: narrator
          text: 还有这头弯角牛。牛顶翻了狗，狗追赶了猫，猫咬死了老鼠，老鼠偷吃了麦芽，麦芽就放在杰克盖的房子里。
    - id: ch03
      title: 姑娘、男人和牧师
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 瞧这位满面愁容的姑娘。她挤了弯角牛的奶，牛顶翻了狗，狗追赶了猫，猫咬死了老鼠，老鼠偷吃了麦芽，麦芽放在杰克盖的房子里。
        - id: ch03-b02
          speaker: narrator
          text: 然后来了一个衣衫褴褛的男人。他亲吻了愁容满面的姑娘，姑娘挤了弯角牛的奶，牛顶翻了狗，狗追赶了猫，猫咬死了老鼠，老鼠偷吃了麦芽，麦芽还放在杰克盖的房子里。
        - id: ch03-b03
          speaker: narrator
          text: 再看这位胡须剃得干净、头发剪得短短的牧师。他为衣衫褴褛的男人主持婚礼，男人亲吻了愁容满面的姑娘，姑娘挤了弯角牛的奶，牛顶翻了狗，狗追赶了猫，猫咬死了老鼠，老鼠偷吃了麦芽，麦芽就放在杰克盖的房子里。
    - id: ch04
      title: 清晨的公鸡和农夫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 清早，公鸡打鸣了。它唤醒胡须剃得干净、头发剪得短短的牧师，牧师为衣衫褴褛的男人主持婚礼，男人亲吻了愁容满面的姑娘，姑娘挤了弯角牛的奶，牛顶翻了狗，狗追赶了猫，猫咬死了老鼠，老鼠偷吃了麦芽，麦芽还放在杰克盖的房子里。
        - id: ch04-b02
          speaker: narrator
          text: 最后是那位播种谷物的农夫。谷物喂饱了清早打鸣的公鸡，公鸡唤醒胡须剃得干净、头发剪得短短的牧师，牧师为衣衫褴褛的男人主持婚礼，男人亲吻了愁容满面的姑娘，姑娘挤了弯角牛的奶，牛顶翻了狗，狗追赶了猫，猫咬死了老鼠，老鼠偷吃了麦芽，麦芽依然放在杰克盖的房子里。
