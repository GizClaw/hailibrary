audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and gently rhythmic
        timbre: warm and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Jack's House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Here stands the house Jack built.
        - id: ch01-b02
          speaker: narrator
          text: Here is the malt that lay in the house Jack built.
    - id: ch02
      title: The Rat, the Cat, and the Dog
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Now meet the rat. It ate the malt that lay in the house Jack built.
        - id: ch02-b02
          speaker: narrator
          text: Then came the cat. It killed the rat that ate the malt that lay in the house Jack built.
        - id: ch02-b03
          speaker: narrator
          text: Next came the dog. It chased the cat that killed the rat that ate the malt that lay in the house Jack built.
    - id: ch03
      title: The Cow and the Maiden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Here comes the cow with the crumpled horn. She tossed the dog that chased the cat that killed the rat that ate the malt that lay in the house Jack built.
        - id: ch03-b02
          speaker: narrator
          text: Here is the lonely maiden. She milked the cow with the crumpled horn, who tossed the dog that chased the cat that killed the rat that ate the malt that lay in the house Jack built.
    - id: ch04
      title: The Wedding
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Here is the man, all tattered and torn. He kissed the lonely maiden who milked the cow with the crumpled horn, who tossed the dog that chased the cat that killed the rat that ate the malt that lay in the house Jack built.
        - id: ch04-b02
          speaker: narrator
          text: Now meet the priest, all shaven and shorn. He married the man, all tattered and torn, who kissed the lonely maiden who milked the cow with the crumpled horn, who tossed the dog that chased the cat that killed the rat that ate the malt that lay in the house Jack built.
    - id: ch05
      title: Morning on the Farm
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then came the rooster who crowed in the morning. He woke the priest, all shaven and shorn, who married the man, all tattered and torn, who kissed the lonely maiden who milked the cow with the crumpled horn, who tossed the dog that chased the cat that killed the rat that ate the malt that lay in the house Jack built.
        - id: ch05-b02
          speaker: narrator
          text: Last comes the farmer who planted the corn. The corn fed the rooster who crowed in the morning and woke the priest, all shaven and shorn. The priest married the man, all tattered and torn. The man kissed the lonely maiden. She milked the cow with the crumpled horn. The cow tossed the dog. The dog chased the cat. The cat killed the rat. The rat ate the malt that lay in the house Jack built.
