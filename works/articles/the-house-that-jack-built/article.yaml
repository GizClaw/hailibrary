cover_prompt: |-
  A wordless cover scene in an old English farmyard gathers the cumulative cast around the house that Jack built. A simple timber-and-plaster cottage stands behind a sack of grain, a brown rat, a black-and-white cat, a shaggy dog, a red-horned cow, and a milkmaid in an eighteenth-century apron and bonnet. Jack, a cheerful young farmer in a brown waistcoat and knee breeches, opens the gate as the orderly chain of creatures begins to circle the yard. The cat springing toward the fleeing rat is the focal action, playful and clearly nonviolent. Use a gently elevated wide composition with each figure readable in a curved sequence and generous quiet sky above the roof. Keep the setting preindustrial, the figures friendly, and the arrangement original rather than copied from existing nursery-book art. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
