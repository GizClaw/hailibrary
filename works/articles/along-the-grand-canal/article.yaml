schema_version: 1
id: along-the-grand-canal
category: fiction
genre: adventure
age_range: {min: 8, max: 11}
type: fiction
style: cut-paper-collage
labels: {topics: [travel, culture, history], themes: [discovery, responsibility, tradition], moods: [adventurous, warm]}
research: required
premise: >
  一个孩子跟着开货船的姑姑，沿京杭大运河从南往北走一段。
  途经船闸、古桥、码头和运河边的城镇，亲眼看到船闸怎样让船升降、
  运河过去和现在分别运什么。路上遇到一次需要孩子帮忙的具体小事，
  让旅程和责任连在一起。地点、船闸原理和历史细节必须准确。
characters:
  - {id: child, description: 第一次跟船远行的孩子}
  - {id: aunt, description: 开货船多年的姑姑}
locales:
  zh-CN: {writer: 北辰, working_title: 沿着大运河, length: 3000-4500 字}
  en-US: {writer: north-star-map, working_title: Along the Grand Canal, length: 2000-3000 words}
picture_book: {level: n}
cover_prompt: >-
  A broad three-quarter view from slightly above the working cargo boat Qinghe traveling north on the Grand Canal at early morning. Eleven-year-old Lin Zhou stands safely inside a yellow deck boundary holding a closed black phone at his side and an open waterproof voyage log in his other hand; he has straight black hair, a round face, an orange rain jacket, navy trousers, gray work shoes, and a red life vest. His aunt Lin Lan is visible through the wheelhouse window at the controls; she is a lean Chinese woman in her late thirties with a low black ponytail, a teal work jacket, dark trousers, and an orange life vest. Bagged building material lies under a tightly tied blue tarpaulin. Behind the boat, Hangzhou's three-arched stone Gongchen Bridge spans the water, while tiled riverside roofs, modern apartment towers, a distant crane, willow trees, and one passing barge show the old and living canal together. The focal action is the child choosing the log over filming as the boat passes under the historic bridge. Keep all people safely positioned, keep ropes coiled away from feet, show no readable gauges or markings, and include no text, letters, numbers, logos, captions, speech bubbles, signatures, or watermarks.
