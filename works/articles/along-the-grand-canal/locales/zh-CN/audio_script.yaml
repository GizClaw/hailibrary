audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在身边讲旅途见闻，沉静而有画面感, timbre: 温暖清晰, pace: 舒缓，遇险时稍快, pitch: 中}}
    child: {display_name: 林舟, tts: {delivery: 好奇直率，犯错后真诚克制, timbre: 清亮少年声, pace: 中等偏快, pitch: 中高}}
    aunt: {display_name: 林岚, tts: {delivery: 干脆镇定，关心藏在指令里, timbre: 扎实清晰的成年女声, pace: 从容, pitch: 中低}}
    deckhand: {display_name: 老周, tts: {delivery: 务实利落，偶尔带点干幽默, timbre: 粗粝温和的成年男声, pace: 中等, pitch: 低}}
    vendor: {display_name: 周阿婆, tts: {delivery: 爽快亲切，说话带生活味, timbre: 明亮的老年女声, pace: 中等, pitch: 中}}
  chapters:
    - id: ch01
      title: 一条太细的蓝线
      blocks:
        - {id: ch01-b01, speaker: narrator, text: “青禾”号离开杭州码头时，林舟把手机高高举过头顶，想把拱宸桥整个拍进去。可他怎么摆，驾驶篷都会挡住一个桥洞角。}
        - {id: ch01-b02, speaker: child, text: 姑姑，再往后一点！}
        - {id: ch01-b03, speaker: aunt, text: 这船可不是给你取景的。站在黄线里面。再退，你的鞋跟就踩上缆绳了。}
        - id: ch01-b04
          speaker: narrator
          text: |-
            林舟低头一看，灰色工作鞋果然挨着一圈粗绳，那绳子盘得像条蛇。他赶紧往里挪了一步。岸上的人提着早点，电动车铃混着船笛传来。三孔石桥慢慢滑过头顶，桥洞里的水声一下空了起来。再往前，桥后的天光铺满了甲板。

            这是他头一回跟姑姑跑货船。出发前，他在地图上画了一条从杭州直通北京的细蓝线，还想每天拍一段《一条河穿过半个中国》。林岚看过，只问了一句。
        - {id: ch01-b05, speaker: aunt, text: 几天假？}
        - {id: ch01-b06, speaker: child, text: 十二天。}
        - {id: ch01-b07, speaker: aunt, text: 那你顶多走完这条线的一小截。}
        - id: ch01-b08
          speaker: narrator
          text: |-
            青禾号装着袋装建材，要去江苏交货。柴油机在船尾稳稳地震，茶水也一直起细纹。林舟原以为运河该安安静静，两岸全是白墙黑瓦。真上了水才知道，不是这么回事：仓库挨着柳树，吊机越过旧屋顶，高架桥又从老石桥后头冒出来。对面一过船，浪就把青禾号托起，再放下。

            他把镜头转向姑姑。
        - {id: ch01-b09, speaker: child, text: 以前这些船都运过什么呀？}
        - id: ch01-b10
          speaker: narrator
          text: 林岚侧过脸。
        - {id: ch01-b11, speaker: aunt, text: 关了。开船的时候别拍我。}
        - id: ch01-b12
          speaker: narrator
          text: 午饭后，林岚拿出外公留下的旧木升斗。斗角磨圆了，里头还有一道细裂纹。林舟架好手机，等着一句漂亮的开场白。
        - id: ch01-b13
          speaker: aunt
          text: 大运河不是一下挖出来的一条沟。很早以前，各地就有一段段水道。到了隋代，它们连成贯通南北的交通系统，后来一代代还在修。漕粮和别的物资都走水路。元代时，人工河道超过两千公里，连起五大水系。不过，不是每袋粮都从杭州运到北京，这条河也不是两千多年一点没变。
        - {id: ch01-b14, speaker: child, text: 你怎么一开口就是“不是”啊？}
        - {id: ch01-b15, speaker: aunt, text: 因为你画的蓝线太直，也太细。}
        - id: ch01-b16
          speaker: narrator
          text: |-
            林舟正想顶嘴，一条支流汇了进来，水面转眼宽了一倍。他那条蓝线里，可装不下支流、仓库、桥影和迎面来的船浪。

            傍晚靠泊，林岚把防水航次记录册递给他，要他记第二天的调度时间，还有进闸、出闸的水尺读数。
        - {id: ch01-b17, speaker: child, text: 可我还要拍船闸呢。}
        - {id: ch01-b18, speaker: aunt, text: 先把记录做好，再拍。}
        - {id: ch01-b19, speaker: child, text: 数字用手机记也行啊。}
        - {id: ch01-b20, speaker: aunt, text: 设备存的是数据。你得记下自己亲眼看到、亲耳听到的东西。在船上，你答应了一件事，其他人就会照着已经做完来安排。}
        - {id: ch01-b21, speaker: narrator, text: 林舟把本子夹在胳膊底下。他觉得，这不过是姑姑给外甥安排的一份假差事。}
    - id: ch02
      title: 水做的台阶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            第二天一早，引航道里的船排成一列，慢慢往前挪。无线电里不断响起呼号和指令。轮到青禾号，林岚报完船的大小、吨位和货种，又接着等。

            林舟在安全区数船：蒙黑篷的煤船、装石料的船，还有暗红积木似的集装箱。一条小船往前蹭了半个船身，又退了回去。
        - {id: ch02-b02, speaker: child, text: 河面这么宽，它为什么不能先走？}
        - {id: ch02-b03, speaker: aunt, text: 闸室可不是街口。调度得看船的大小，把能安全停下的船排进去。就算抢到门前，闸门也不会只为一条船开。}
        - id: ch02-b04
          speaker: narrator
          text: |-
            等待比林舟想的久。他拍了十分钟船头，画面几乎没动，就低头给昨天的视频配音乐。老周一提醒，他才慌忙补写调度时间，数字因为写得太急，全都挤成一团。

            终于，青禾号驶进两堵高墙。缆绳准备好了，闸门也在身后合上。发动机声从四面弹回来。头顶的湿痕比驾驶篷还高，林舟心里发紧，觉得船进了一只没盖的巨箱。褐绿色的水从水下通道涌进来，青禾号没长翅膀，却跟墙边一片叶子一起升高。
        - {id: ch02-b05, speaker: child, text: 是不是有水泵在下面托着我们？}
        - {id: ch02-b06, speaker: aunt, text: 普通船闸借的是高处的水。上游的水流进来，闸室水面升高，船就跟着升。往下走时，水流到下游，船也会降下去。}
        - id: ch02-b07
          speaker: narrator
          text: 林舟盯着水尺报读数。船身一晃，铅笔在纸上拖出一条长尾巴。
        - {id: ch02-b08, speaker: child, text: 怎么还不开门？}
        - {id: ch02-b09, speaker: aunt, text: 里头还比上游低。水位没平，门两边的水压就不一样。}
        - id: ch02-b10
          speaker: narrator
          text: |-
            林舟把镜头对准门缝，等闸门踩着音乐打开。可水尺爬得太慢，他一会儿看屏幕，一会儿看水面，差点漏掉第二个读数。

            终于，水安静了。闸门打开，刚才还高悬头顶的上游水面，已经和船底连成一片。回头看，下一批船像停在一道巨大的水台阶下。林舟这才发现，自己忘了按录像键。

            午后，一座七孔石桥的圆拱正好映在水里。林舟才排好画面，老周就在甲板上叫他。
        - {id: ch02-b11, speaker: deckhand, text: 小舟，去看看右舷的碰垫。}
        - id: ch02-b12
          speaker: narrator
          text: 林舟舍不得移开刚排好的桥影，可还是放下手机去查。绳子没松，一分钟就看完了。等他回头，桥影已经被船尾的浪揉碎。
        - {id: ch02-b13, speaker: child, text: 我就知道。}
        - {id: ch02-b14, speaker: deckhand, text: 船上没出事，不代表这趟检查白做了。}
        - {id: ch02-b15, speaker: narrator, text: 林舟没把这句录下来。他听着只觉得，这又是大人专门说给孩子听的老话。}
    - id: ch03
      title: 没有搬走的箱子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第三天下午，天闷得发黄，杨树叶一动不动，远处却压着深灰色的云。天气提示一响，林岚让老周去查舱盖和篷布。
        - {id: ch03-b02, speaker: aunt, text: 林舟，把船尾那只蓝工具箱搬到篷里去。}
        - {id: ch03-b03, speaker: child, text: 知道了。}
        - {id: ch03-b04, speaker: aunt, text: 现在就去。}
        - {id: ch03-b05, speaker: child, text: 马上。}
        - id: ch03-b06
          speaker: narrator
          text: |-
            林舟还在剪片。一次没对齐，再来一次。终于，鼓点和闸门打开对上了，可窗外的杨树也全弯向一边。

            大雨点砸上铁甲板，像撒豆子。林舟这才想起箱子。蓝箱还在船尾，船一斜，它就滑一点。旁边的篷布松了，风钻进去，整张布猛地鼓起，绳子“啪”地抽着舱沿。林舟伸手就抓。
        - {id: ch03-b07, speaker: aunt, text: 回到黄线里面！, emotion: fearful}
        - id: ch03-b08
          speaker: narrator
          text: |-
            蓝箱正往排水口滑，林舟却跨了出去。松绳从眼前甩过，抽在栏杆上。他一下僵住。再偏一点，打中的就是他的脸。要是缠住脚，下一阵风可不会等他站稳。

            林岚减速稳舵。老周扣紧救生衣，从背风、有护栏的一边低身过去。他先用带钩长杆把箱子勾回安全处，再踩住松绳，把篷布压好。
        - {id: ch03-b09, speaker: deckhand, text: 备用绳！}
        - id: ch03-b10
          speaker: narrator
          text: |-
            林舟退回黄线里。他手抖得厉害，把绳团扔了出去，绳头却还攥在手里。老周只好等他理开，再接一次。

            十分钟后，乌云往东去了。篷布上的积水一股股流进运河。林岚查完舱盖、每个绳结，又打开蓝工具箱，确认里头的扳手和测量器具没进水，这才走到林舟面前。
        - {id: ch03-b11, speaker: aunt, text: 我第一次是怎么交代你的？}
        - {id: ch03-b12, speaker: child, text: 让我把工具箱搬进去。}
        - {id: ch03-b13, speaker: aunt, text: 那你是怎么答的？}
        - {id: ch03-b14, speaker: child, text: 我说知道了。}
        - {id: ch03-b15, speaker: aunt, text: 所以我就当这件事已经有人管了。}
        - id: ch03-b16
          speaker: narrator
          text: 林舟盯着鞋尖。他可以说天气来得太快，可以说绳子本来就没系好，也可以说最后是老周处理的。这些话多少都是真的，可没有一句能把“知道了”变成搬好的箱子。
        - {id: ch03-b17, speaker: child, text: 我只是想把那段视频先剪完。, emotion: sad}
        - {id: ch03-b18, speaker: aunt, text: 做不到，你就直接说做不到。不会，就开口问。你答应下来却没有做，别人根本不知道还得回头替你补上。}
        - id: ch03-b19
          speaker: deckhand
          text: 船长叫你退，你就退。别拿好心再添一个险。
        - id: ch03-b20
          speaker: narrator
          text: 老周拧着湿手套。林舟脸上烧得比暴雨前还厉害，以为姑姑会收走手机，剩下几天都不准他离开船舱。林岚却把毛巾和记录册递给他。
        - {id: ch03-b21, speaker: aunt, text: 先擦干。再记阵风时间、减速时间，还有耽误的航程。}
        - id: ch03-b22
          speaker: narrator
          text: |-
            那页被雨洇开了几处。林舟写得很慢。他终于明白，记录册里不只装着数字。一处空白，也可能是一件大家都以为已经有人做过的事。

            晚上，他打开剪到一半的视频。开头的自己站在拱宸桥下，说得又响又稳。
        - {id: ch03-b23, speaker: child, text: 真正的船员，最重要的就是责任心。}
        - id: ch03-b24
          speaker: narrator
          text: |-
            那样子，像是早懂了好多年。林舟把这段删掉，停了一会儿，又恢复了。删掉太像是在躲。

            他接上暴雨前的空甲板：蓝箱待在不该待的地方，第一滴雨落上箱盖。后面没有惊险画面，因为那时他没在拍。他只补了一句。
        - {id: ch03-b25, speaker: child, text: 下雨前，我本来就该把这个箱子搬进去。我答应搬了，可我没有做到。, emotion: sad}
        - {id: ch03-b26, speaker: narrator, text: 他没有配音乐。}
    - id: ch04
      title: 桥、吊机和一碗面
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            越往江苏走，水面越忙。天没亮，船灯就在雾里往前移。运煤船、建材船排队过闸，岸边吊机不停卸货，无线电里一个接一个叫船名。

            林舟开始把手机留在舱里。先查缆绳，再记时间。他也不再随口说“马上”，而是把事情说清楚。
        - {id: ch04-b02, speaker: child, text: 我先去搬蓝箱，搬完回来记读数。}
        - {id: ch04-b03, speaker: child, text: 我正在抄水尺，还得两分钟。时间来得及吗？}
        - {id: ch04-b04, speaker: aunt, text: 来得及。抄完再去。}
        - id: ch04-b05
          speaker: narrator
          text: |-
            头一回这么问，林舟觉得像在承认自己没本事。可林岚只看了眼表。

            又一次过闸，前船进去了，青禾号还在外头。林舟本来觉得，有空就该挤进去。林岚让他看前船多宽、缆绳系在哪儿、调度灯怎么亮。他看了一会儿，把“被耽误了”改成“等待下一闸”。看着空的地方，不一定能安全停下一条船。

            后来，他们在老石桥附近靠泊。面摊的周阿婆端了三碗热面上船。她从小住在河边，木船见过，越来越大的机动货船也见过。
        - {id: ch04-b06, speaker: child, text: 有了新船和新码头，古运河会不会慢慢没了？}
        - {id: ch04-b07, speaker: vendor, text: 你说的运河，到底是哪一个？是桥，是水，是码头，还是我弟弟跑了二十年的那条船？}
        - {id: ch04-b08, speaker: child, text: 我说的全都是。}
        - {id: ch04-b09, speaker: vendor, text: 那你这个问题，比面盆还大。先吃面，坨了我可不会再给你做一碗。}
        - id: ch04-b10
          speaker: narrator
          text: |-
            河对岸，吊机正把成袋货物放上托盘。老桥边，一只白鹭在芦苇里找吃的。石桥是真的，新吊机也是真的。柴油味是真的，面汤里的葱花香也是真的。林舟忽然不知道，该剪掉哪一样，视频才更像“古运河”。

            周阿婆吹着茶，说她小时候河岸更乱、更挤。后来航道修过，房子和码头也变了。有些旧东西留下，有些没有。她没替林舟下结论，只催他吃完碗底的面。

            林舟又翻出最初的地图。那条蓝线细得连一座城都装不下。他放大画面，蓝线散开了，桥、船闸、支流、码头，一个个名字都冒出来。他新建了片名，却没打字，只让光标在空白里闪着。
    - id: ch05
      title: 最后一项记录
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            到淮安附近，码头吊机开始卸货。蓝篷布卷在一边，袋装建材一批批离开货舱。

            林舟想把旧木斗摆在空舱边拍照，又怕观众以为它真量过某船漕粮。他先去问姑姑。
        - {id: ch05-b02, speaker: child, text: 我能拍这个木斗吗？我会说清楚，它只是外公留下来的东西。}
        - {id: ch05-b03, speaker: aunt, text: 可以。}
        - {id: ch05-b04, speaker: child, text: 那你愿不愿意也对着镜头讲几句？}
        - {id: ch05-b05, speaker: aunt, text: 等我签完。我只讲自己知道的。}
        - id: ch05-b06
          speaker: narrator
          text: 这是她第一次答应入镜。林舟收起手机，没催。卸完货，林岚把记录册递给他。
        - {id: ch05-b07, speaker: aunt, text: 核对交货时间。}
        - id: ch05-b08
          speaker: narrator
          text: 林舟看过码头时钟、驾驶篷显示和最后一页。
        - {id: ch05-b09, speaker: child, text: 准备好了。}
        - {id: ch05-b10, speaker: aunt, text: 你是已经做完了，还是准备现在去做？}
        - id: ch05-b11
          speaker: narrator
          text: 林舟重新核对一遍，写下时间，这才笑了。
        - {id: ch05-b12, speaker: child, text: 这回做完了。, emotion: happy}
        - id: ch05-b13
          speaker: narrator
          text: |-
            返航那晚，青禾号先在另一座船闸前排队。红绿灯的倒影拉在黑水里。轮到他们下行，青禾号驶进闸室，闸门从身后合上。水流向下游，船贴着湿漉漉的高墙，一点点降下去。

            林舟把手机留在盒里，站在黄线内读水尺。下降比上升更容易察觉：墙顶一点点远去，原先贴着甲板的湿痕慢慢升到头顶。他按顺序记下每个读数，一项也没漏，一个个念给姑姑听，再完整复读一遍确认。

            前面的水还低，所以门没开。这回他没问为什么，也没等适合配乐的瞬间，只看着两边水线靠拢。水声轻了，黑色的下游和船底的水终于连成一层。

            闸门开始分开。林岚一手握着控制杆，朝记录册点点下巴。林舟把最后一个读数写在“船员观察”栏里。笔尖经过最初那道歪线，也经过被雨洇开的字。他没绕开，更没撕掉那页。

            第二天清早，拱宸桥还远着。林舟在舱里剪片。旧木斗、石桥、吊机、排队的船、雨中的空甲板和水尺刻度，一个接一个出现。他把片名改成《水尺上的北方》。

            导出前，他又加了个短镜头。记录册摊在窗边。纸上的线一路向北，绕过桥和船闸，在一块雨痕前停了一下，又接着往前走。
