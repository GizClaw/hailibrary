audio_script:
  language: en-US
  cast:
    narrator: {display_name: Narrator, tts: {delivery: "intimate travel storytelling with a keen eye for detail", timbre: warm and clear, pace: "measured, quickening during danger", pitch: medium}}
    child: {display_name: Daniel, tts: {delivery: "curious and candid, growing more thoughtful after his mistake", timbre: clear young voice, pace: moderately quick, pitch: medium-high}}
    aunt: {display_name: Aunt May, tts: {delivery: "direct and steady, with care carried through practical words", timbre: grounded adult female voice, pace: unhurried, pitch: medium-low}}
    deckhand: {display_name: Mr. Wu, tts: {delivery: practical and concise with dry warmth, timbre: weathered adult male voice, pace: moderate, pitch: low}}
    vendor: {display_name: Mrs. Zhou, tts: {delivery: "brisk, friendly, and full of everyday wit", timbre: bright older female voice, pace: moderate, pitch: medium}}
  chapters:
    - id: ch01
      title: A Line Too Thin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Daniel came aboard the River Lark with a camera, a new rain jacket, and a private theory. Steering a cargo boat couldn't be much harder than steering the simulator at the maritime museum. Aunt May looked down at his white sneakers.
        - {id: ch01-b02, speaker: aunt, text: First job. Change those.}
        - {id: ch01-b03, speaker: child, text: We haven't even left Hangzhou.}
        - {id: ch01-b04, speaker: aunt, text: The deck's already slippery.}
        - id: ch01-b05
          speaker: narrator
          text: |-
            By the time Daniel came back in gray work shoes, the lines were aboard. The River Lark eased away from the wharf and headed north toward Gongchen Bridge. Daniel lifted his phone, trying to squeeze all three stone arches into the frame.
        - {id: ch01-b06, speaker: child, text: Back a little!}
        - {id: ch01-b07, speaker: aunt, text: The boat doesn't move for your picture. Stay inside the yellow line.}
        - id: ch01-b08
          speaker: narrator
          text: |-
            Daniel looked down. His heel was inches from a coil of heavy rope. He stepped in just as the bridge passed overhead. Vendors and bicycle bells disappeared inside the arch. The engine rolled around the stone, and then morning light spilled across the deck.

            This was his first working voyage with his aunt. On a map, he'd drawn one clean blue stroke from Hangzhou to Beijing. He planned a new video every day and already had a title: One Canal, Half a Country. Aunt May studied the map and asked one question.
        - {id: ch01-b09, speaker: aunt, text: "How long is your school break?"}
        - {id: ch01-b10, speaker: child, text: Twelve days.}
        - {id: ch01-b11, speaker: aunt, text: Then you'll see one small piece of that line.}
        - id: ch01-b12
          speaker: narrator
          text: |-
            The River Lark carried bagged construction material to Jiangsu. Its diesel engine sent a steady tremor through Daniel's shoes. Even the tea shivered in the crew's cups.

            And the canal looked nothing like the quiet antique ribbon he'd imagined. Warehouses stood beside willows. Cranes rose behind tiled roofs. A railway crossed high above an old stone bridge. Passing barges lifted the River Lark on their wakes and set it down again. This was a working route. It wouldn't hold still for his camera.

            Daniel pointed the lens at his aunt.
        - {id: ch01-b13, speaker: child, text: "What did boats carry long ago?"}
        - id: ch01-b14
          speaker: narrator
          text: Aunt May turned her face away.
        - {id: ch01-b15, speaker: aunt, text: Camera off while I'm steering.}
        - id: ch01-b16
          speaker: narrator
          text: After lunch, she took an old wooden grain measure from a cabinet. Its corners were worn round, and a fine crack crossed one side. It had belonged to Daniel's grandfather. Daniel propped up his phone and waited for a perfect opening line.
        - id: ch01-b17
          speaker: aunt
          text: The Grand Canal wasn't dug all at once. People built waterways in separate sections long ago. During the Sui dynasty, those sections became a great north-south transport system, and later dynasties kept repairing and changing it. Grain and other important goods traveled by water. By the thirteenth century, more than two thousand kilometers of artificial waterways linked five major river basins.
        - {id: ch01-b18, speaker: child, text: That part's good.}
        - {id: ch01-b19, speaker: aunt, text: "There's another part. Not every sack of grain went from Hangzhou to Beijing, and the canal didn't stay the same for two thousand years."}
        - {id: ch01-b20, speaker: child, text: You keep telling me what it wasn't.}
        - {id: ch01-b21, speaker: aunt, text: Because your blue line is too straight and too thin.}
        - id: ch01-b22
          speaker: narrator
          text: |-
            Daniel had an answer ready. Then a side channel entered from the west, and in less than a minute the water doubled in width. His blue line had no room for side channels, warehouses, bridge shadows, or waves from boats going the other way.

            That evening, Aunt May handed him the waterproof voyage log. She told him to record the next day's dispatch time and the water-gauge readings when they entered and left the lock.
        - {id: ch01-b23, speaker: child, text: But I need to film the lock.}
        - {id: ch01-b24, speaker: aunt, text: Log first. Film second.}
        - {id: ch01-b25, speaker: child, text: My phone can save the numbers.}
        - {id: ch01-b26, speaker: aunt, text: "The equipment saves data. You record what you see and hear. Once someone takes a job on a working boat, the rest of us plan as if it'll get done."}
        - {id: ch01-b27, speaker: narrator, text: Daniel tucked the log under his arm. It still felt like a pretend job for a visiting nephew.}
    - id: ch02
      title: A Stair Made of Water
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            The next morning, boats formed a slow line in the lock approach. The radio kept calling vessel names and instructions. When it was their turn, Aunt May reported the River Lark's size, tonnage, and cargo. Then they waited again.

            Daniel counted boats from the passenger area. Coal hid under black covers. Another vessel carried stone. Dark red containers rose behind a low wheelhouse. One narrow boat edged half a length toward an opening, then backed away.
        - {id: ch02-b02, speaker: child, text: "There's plenty of water. Why can't it go first?"}
        - {id: ch02-b03, speaker: aunt, text: The operator has to fit boats together safely. A gap by the gate isn't an invitation.}
        - id: ch02-b04
          speaker: narrator
          text: |-
            The wait went on far longer than Daniel expected. He filmed the bow for ten minutes, but almost nothing moved, so he started adding music to yesterday's bridge scene. Mr. Wu, one of the deckhands, had to remind him about the dispatch time. Daniel jammed the numbers into the log.

            At last, the gates opened. The River Lark crept between towering concrete walls. The crew readied the lines, and the gates closed behind them. The engine came back from every hard surface. Wet marks stood far above the wheelhouse roof. It felt like entering a giant box with no lid.

            Water poured in through passages below the surface. Brown-green swirls turned beside the hull. The boat had no wings and no cables, but it rose with a leaf floating by the wall.
        - {id: ch02-b05, speaker: child, text: "Are pumps pushing us up?"}
        - {id: ch02-b06, speaker: aunt, text: "A regular lock uses water from the higher side. Water flows in, so the surface rises. When a boat goes down, water flows out toward the lower side, and the boat drops with it."}
        - id: ch02-b07
          speaker: narrator
          text: Daniel watched the gauge and called out a reading. The hull shifted, and his pencil dragged a long tail across the page.
        - {id: ch02-b08, speaker: child, text: "Why can't the gate open now?"}
        - {id: ch02-b09, speaker: aunt, text: The chamber's still lower than the water beyond that gate. We wait until the levels match.}
        - id: ch02-b10
          speaker: narrator
          text: |-
            Daniel aimed his camera at the seam between the gates. He wanted them to open on the biggest beat in his music. But the water rose far too slowly. He looked from the screen to the wall and nearly missed the next reading.

            Finally, the swirling stopped. The gate opened without drama. Water that had towered above them now ran level beneath the hull. Behind the River Lark, another group waited at the bottom of that watery step.

            Daniel had forgotten to press record.

            That afternoon, they came to a seven-arch stone bridge. Each arch and its reflection made a dark circle. Daniel had just lined them up when Mr. Wu called from the deck.
        - {id: ch02-b11, speaker: deckhand, text: "Daniel, check the starboard fender."}
        - id: ch02-b12
          speaker: narrator
          text: Daniel watched the bridge drift toward the edge of his frame. Still, he lowered the phone and checked. The line was secure. The job took less than a minute, but the wake had already broken the reflected arches.
        - {id: ch02-b13, speaker: child, text: I knew nothing was wrong.}
        - {id: ch02-b14, speaker: deckhand, text: Finding nothing wrong isn't the same as checking for nothing.}
        - {id: ch02-b15, speaker: narrator, text: Daniel didn't record that. It sounded like something grown-ups kept ready for children.}
    - id: ch03
      title: The Box He Did Not Move
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the third afternoon, the sky turned a dusty yellow. Poplar leaves hung still, but a deep gray band was building in the distance. A weather alert appeared. Aunt May sent Mr. Wu to inspect the hatch covers and tarpaulin.
        - {id: ch03-b02, speaker: aunt, text: "Daniel, put the blue tool case under shelter."}
        - {id: ch03-b03, speaker: child, text: Got it.}
        - {id: ch03-b04, speaker: aunt, text: Now.}
        - {id: ch03-b05, speaker: child, text: Right away.}
        - id: ch03-b06
          speaker: narrator
          text: |-
            Daniel kept editing. The beat missed, so he tried again. When the gate finally opened at the perfect instant, every poplar outside had bent in the same direction.

            The first drops hit the steel deck like tossed beans. Daniel remembered the case and ran aft. It was still there, sliding each time the boat rolled. One tie on the blue cargo cover had come loose. Wind rushed underneath and lifted the whole sheet. The rope cracked against the coaming. Daniel reached for it.
        - {id: ch03-b07, speaker: aunt, text: Inside the yellow line!, emotion: fearful}
        - id: ch03-b08
          speaker: narrator
          text: |-
            The case slid toward a drain. Daniel stepped across the boundary. The loose rope whipped past his face and struck the rail. He froze. A few inches closer, and it would've hit him. One loop around his ankle, and the next gust wouldn't wait for him to stand.

            Aunt May slowed the boat and held it steady. Mr. Wu fastened his life vest and crouched in from the sheltered side. He didn't dive for the cover. First he pulled the case to safety with a boat hook. Then he pinned the rope and secured the tarpaulin.
        - {id: ch03-b09, speaker: deckhand, text: Spare line!}
        - id: ch03-b10
          speaker: narrator
          text: |-
            Daniel stepped back behind the boundary. His hands shook. He threw the whole coil while still gripping the end, and Mr. Wu had to wait while he untangled it and tried again.

            Ten minutes later, the cloud moved east. Water streamed from the cover into the canal. Aunt May checked every tie, then opened the blue case to make sure the tools and gauges inside were dry. Only then did she come to Daniel.
        - {id: ch03-b11, speaker: aunt, text: "What did I ask you the first time?"}
        - {id: ch03-b12, speaker: child, text: Put the case away., emotion: sad}
        - {id: ch03-b13, speaker: aunt, text: "And what did you say?"}
        - {id: ch03-b14, speaker: child, text: Got it., emotion: sad}
        - {id: ch03-b15, speaker: aunt, text: So I counted it as handled.}
        - id: ch03-b16
          speaker: narrator
          text: Daniel stared at his wet shoes. The storm had come fast. The tie had already been loose. Someone else had left the case there. Each excuse held a little truth, but none could turn “Got it” into a case under shelter.
        - {id: ch03-b17, speaker: child, text: I wanted to finish the edit., emotion: sad}
        - {id: ch03-b18, speaker: aunt, text: "If you can't do a job, say so. If you don't understand, ask. When you take it and leave it undone, the rest of us don't know we have to fill the hole.", emotion: calm}
        - {id: ch03-b19, speaker: deckhand, text: "And when the captain tells you to step back, step back. Don't give us a second danger made out of good intentions."}
        - id: ch03-b20
          speaker: narrator
          text: Mr. Wu wrung rain from his gloves. Daniel expected to lose his phone and spend the rest of the trip below deck. Instead, Aunt May handed him a towel and the log.
        - {id: ch03-b21, speaker: aunt, text: "Dry off. Then record the gust, the speed reduction, and the delay."}
        - id: ch03-b22
          speaker: narrator
          text: |-
            Rain had blurred several lines. Daniel wrote slowly. For the first time, he understood that a log held more than numbers. A blank could be a job everyone believed someone else had finished.

            That night, he opened his half-edited documentary. In the first clip, he stood below Gongchen Bridge and announced in a loud, certain voice:
        - {id: ch03-b23, speaker: child, text: The most important quality in a real crew is responsibility.}
        - id: ch03-b24
          speaker: narrator
          text: |-
            He sounded as if he'd understood it for years. Daniel deleted the clip, then restored it. Deleting it felt too much like hiding.

            He followed it with the empty deck before the storm: the blue case in the wrong place, one heavy drop landing on its lid. There was no thrilling rescue footage because he hadn't been filming. He added one plain sentence.
        - {id: ch03-b25, speaker: child, text: "The case should've been inside before the rain. I said I'd move it, and I didn't.", emotion: sad}
        - {id: ch03-b26, speaker: narrator, text: He added no music.}
    - id: ch04
      title: A Bridge, a Crane, and a Bowl of Noodles
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            The farther they went into Jiangsu, the busier the water became. Before sunrise, navigation lights moved through the mist. Coal boats and construction boats lined up for locks. Cranes worked beside waking towns. The radio called vessel names in order.

            Daniel began leaving his phone in the cabin while the crew prepared lines. He checked times, repeated instructions, and asked before filming. He stopped saying, “Right away.” Now he said exactly what he would do.
        - {id: ch04-b02, speaker: child, text: "I'll move the blue case, then come back for the gauge."}
        - {id: ch04-b03, speaker: child, text: "I need two minutes to finish this reading. Is that soon enough?"}
        - {id: ch04-b04, speaker: aunt, text: Two minutes is fine. Finish that first.}
        - id: ch04-b05
          speaker: narrator
          text: |-
            The first time, asking felt like admitting he wasn't useful. Aunt May only checked the clock.

            At another lock, the boat ahead went in while the River Lark stayed outside. Daniel thought the operator was wasting space. Aunt May told him to study the other boat's width, its line position, and the signal. After a few minutes, he changed his note from “unnecessary delay” to “waiting for the next chamber.” A space that looked empty wasn't always safe for another boat.

            They stopped near an old stone bridge for supplies. Mrs. Zhou from a waterside noodle stall carried three steaming bowls aboard. She'd grown up by the canal. She remembered wooden boats and had watched motor cargo vessels grow larger.
        - {id: ch04-b06, speaker: child, text: "Are new boats and ports destroying the old canal?"}
        - {id: ch04-b07, speaker: vendor, text: "Which canal? The bridge? The water? The port? Or my brother's boat?"}
        - {id: ch04-b08, speaker: child, text: All of it.}
        - {id: ch04-b09, speaker: vendor, text: That question's bigger than my washbasin. Eat before the noodles stick together.}
        - id: ch04-b10
          speaker: narrator
          text: |-
            Across the water, a crane lowered bagged goods onto a pallet. An egret hunted in the reeds below the old bridge. The stone was real, and so was the new crane. The diesel smell was real, and so were the scallions in his soup. Daniel no longer knew what to cut so his film would look more like an ancient canal.

            Mrs. Zhou blew on her tea. The bank had been rougher and more crowded when she was young. The channel had been improved. Houses and wharves had changed. Some old things remained; others didn't. She gave him no final answer. She only told him to finish his noodles.

            Daniel opened his first map again. That blue route was too thin to hold even one town. He zoomed in, and names appeared: bridges, locks, side channels, ports. He opened the title box for his film but left the cursor blinking in empty space.
    - id: ch05
      title: The Last Entry
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            Near their destination in Huai'an, a terminal crane began unloading the River Lark. The blue tarpaulin lay rolled and tied to one side. Pallets of construction material left the hold one after another.

            Daniel wanted to photograph the old wooden measure beside the empty cargo space. Then he worried people might think it had measured grain on a real historic voyage. So he found his aunt first.
        - {id: ch05-b02, speaker: child, text: "Can I film it if I explain that it only belonged to Grandpa?"}
        - {id: ch05-b03, speaker: aunt, text: Yes.}
        - {id: ch05-b04, speaker: child, text: "Will you explain it on camera?"}
        - {id: ch05-b05, speaker: aunt, text: After I sign. I'll say only what I know.}
        - id: ch05-b06
          speaker: narrator
          text: It was the first time she'd agreed to appear. Daniel put the phone away and waited without reminding her. When unloading ended, Aunt May handed him the log.
        - {id: ch05-b07, speaker: aunt, text: Verify the delivery time.}
        - id: ch05-b08
          speaker: narrator
          text: Daniel checked the terminal clock, the wheelhouse display, and the last page.
        - {id: ch05-b09, speaker: child, text: Ready.}
        - {id: ch05-b10, speaker: aunt, text: "Finished, or ready to begin?"}
        - id: ch05-b11
          speaker: narrator
          text: Daniel checked once more and wrote down the time. Then he smiled.
        - {id: ch05-b12, speaker: child, text: Finished., emotion: happy}
        - id: ch05-b13
          speaker: narrator
          text: |-
            On the return trip, they queued at another lock after dark. Red and green signals stretched across the black water. When it was the River Lark's turn to go down, the boat entered and was secured inside. The gates closed behind it, water flowed toward the lower reach, and the boat sank slowly beside the wet concrete wall.

            Daniel left his phone in its case. From inside the yellow line, he read the gauge aloud. Going down made the height easier to feel. The top of the wall moved farther away. Wet marks that had been near the deck climbed above his head. He wrote each reading, called it to his aunt, and repeated it to make sure.

            The water beyond the gate was still lower, so the gate stayed shut. Daniel didn't ask why it couldn't hurry. He didn't wait for a moment that would fit his music. He watched the two levels draw together until the rush softened and the dark water beyond became one surface with the water beneath the hull.

            The gates began to part. Aunt May kept one hand on the controls and nodded toward the log. Daniel wrote the final reading in the box marked CREW OBSERVATIONS. His pencil passed the crooked line from the first lock and the words blurred by rain. He didn't tear out the page or write around it.

            The next morning, Gongchen Bridge was still far to the south. Daniel sat in the cabin editing. The wooden measure, stone arches, cranes, waiting boats, empty deck in the rain, and marks on the water gauge moved across his screen. He changed the title to North by the Water Gauge.

            Before exporting, he added one short shot. The voyage log lay open by the window. Its ruled lines traveled north, bent around bridges and locks, paused at a rain stain, and kept going.
