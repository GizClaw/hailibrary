cover_prompt: |-
  A wordless cover scene on a rainy English pond shows Mr. Jeremy Fisher setting out to fish from his lily-pad boat. Jeremy is a green frog with a cream belly, wearing a shiny yellow raincoat and black overshoes, seated on a broad green lily pad with a reed fishing rod and a small wicker basket. A spotted newt in a red waistcoat and a tortoise in a brown shell wait on the bank near his damp stone house. Jeremy leans forward as a silvery minnow tugs the line and sends rings across the water, making the hopeful catch the focal action. Use a low water-level three-quarter view framed by reeds and foxgloves, with misty breathing room above the pond. Keep pond life recognizable, clothing simple and period-appropriate, and designs original rather than copied from illustrations or adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
