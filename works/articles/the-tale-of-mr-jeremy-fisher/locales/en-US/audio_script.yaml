audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a lightly playful touch
        timbre: clear and gentle
        pace: measured with lively turns
        pitch: medium
    mr_jeremy_fisher:
      display_name: Mr. Jeremy Fisher
      tts:
        delivery: polite and proper, becoming breathless when startled
        timbre: bright and slightly reedy
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Rainy Day for Fishing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once upon a time, there was a frog named Mr. Jeremy Fisher. He lived in a little damp house among the buttercups at the edge of a pond. The larder and the back passage were both slippy-sloppy with water.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Mr. Jeremy liked wet feet. No one ever scolded him for them, and he never caught a cold. So when he looked outside and saw big raindrops splashing into the pond, he was quite pleased.
        - id: ch01-b03
          speaker: mr_jeremy_fisher
          text: >-
            I'll dig up some worms and go fishing. Then I'll catch a dish of minnows for dinner. If I catch more than five, I'll invite my friends, Mr. Alderman Ptolemy Tortoise and Sir Isaac Newton. Though the Alderman does eat salad.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Mr. Jeremy pulled on a raincoat and a pair of shiny galoshes. He took his rod and basket, then made enormous hops to the place where he kept his boat.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The boat was round and green. It looked very much like the other lily pads, and it was tied to a water plant in the middle of the pond.
        - id: ch01-b06
          speaker: narrator
          text: >-
            With a reed for a pole, Mr. Jeremy pushed the boat into open water.
        - id: ch01-b07
          speaker: mr_jeremy_fisher
          text: >-
            I know just where to find minnows.
    - id: ch02
      title: Waiting for a Bite
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mr. Jeremy drove his pole into the mud and tied the boat to it. Then he sat cross-legged and got his fishing gear ready.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He had the dearest little red float. His rod was a sturdy grass stalk. His line was one long, fine white horsehair, with a small wriggling worm tied to the end.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Rain trickled down his back. For nearly an hour, he watched that float.
        - id: ch02-b04
          speaker: mr_jeremy_fisher
          text: >-
            This is getting dull. I believe I'd like some lunch.
        - id: ch02-b05
          speaker: narrator
          text: >-
            He poled back among the water plants and took his lunch from the basket.
        - id: ch02-b06
          speaker: mr_jeremy_fisher
          text: >-
            I'll have a butterfly sandwich while I wait for the rain to pass.
    - id: ch03
      title: A Prickly Catch
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A great big water beetle swam up beneath the lily pad and pinched the toe of one galosh. Mr. Jeremy tucked his legs up out of reach and kept eating his sandwich.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Once or twice, something rustled and splashed among the rushes beside the pond.
        - id: ch03-b03
          speaker: mr_jeremy_fisher
          text: >-
            I do hope that isn't a rat. I'd better move away from here.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Mr. Jeremy pushed the boat a little farther out and lowered his bait. Almost at once, something bit. The float gave a tremendous bob!
        - id: ch03-b05
          speaker: mr_jeremy_fisher
          text: >-
            A minnow! I've caught a minnow by the nose!
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: >-
            He jerked up the rod. What a horrible surprise! This was no smooth, fat minnow. He had landed little Jack Sharp, the stickleback, and Jack was covered in spines.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The stickleback flopped around the boat, pricking and snapping until he had no breath left. Then he sprang back into the water. A whole school of little fish poked up their heads and laughed at Mr. Jeremy Fisher.
    - id: ch04
      title: The Frightful Trout
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mr. Jeremy sat miserably on the edge of his boat. He sucked his sore fingers and peered into the water. Then something much worse happened. It would have been truly frightful if he hadn't been wearing his raincoat.
        - id: ch04-b02
          speaker: narrator
          text: >-
            A great, enormous trout burst up with a ker-plop-plop-plop and a splash. It seized Mr. Jeremy in one snap.
        - id: ch04-b03
          speaker: mr_jeremy_fisher
          text: >-
            Ow! Ow! Ow!
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: >-
            The trout turned and dived straight to the bottom of the pond. But it hated the taste of that raincoat. Before half a minute had passed, it spat Mr. Jeremy out again. The only things it swallowed were his galoshes.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Mr. Jeremy shot back to the surface like a cork, with bubbles fizzing around him like the ones in a bottle of soda water. He swam as hard as he could for the edge of the pond.
        - id: ch04-b06
          speaker: narrator
          text: >-
            He scrambled onto the first bank he reached. Then he hopped home across the meadow, with his raincoat hanging in tatters.
    - id: ch05
      title: Dinner Without Minnows
      blocks:
        - id: ch05-b01
          speaker: mr_jeremy_fisher
          text: >-
            Thank goodness it wasn't a pike! My rod and basket are gone, but that hardly matters. I'm quite sure I would never dare to go fishing again!
        - id: ch05-b02
          speaker: narrator
          text: >-
            Mr. Jeremy put sticking plaster on his fingers. Both his friends came to dinner. He had no fish to serve them, but there was something else in his larder.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Sir Isaac Newton arrived in his black-and-gold vest. Mr. Alderman Ptolemy Tortoise brought a salad in a string bag.
        - id: ch05-b04
          speaker: narrator
          text: >-
            So instead of a lovely dish of minnows, they ate roasted grasshopper with ladybug sauce. Frogs think it's a wonderful treat. I think it must have been nasty!
        - id: ch05-b05
          speaker: narrator
          text: >-
            The end.
