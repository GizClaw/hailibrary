audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容地讲述，带一点俏皮的观察
        timbre: 清澈柔和
        pace: 舒缓，遇到惊险处自然加快
        pitch: 中
    mr_jeremy_fisher:
      display_name: 渔夫杰里米先生
      tts:
        delivery: 彬彬有礼而一本正经，受惊时变得急促
        timbre: 明亮，略带细尖的蛙声质感
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 雨天去钓鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有只青蛙叫渔夫杰里米先生。他的小屋就在池塘边，藏在毛茛花丛里，里里外外总是湿漉漉的。储藏室和后过道满地是水，又湿又滑，一踩就啪嗒啪嗒响。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可杰里米先生就爱把脚弄湿。没人会为这事说他，他也从不伤风。这天，他看见大雨点噼噼啪啪落进池塘，心里可高兴了。
        - id: ch01-b03
          speaker: mr_jeremy_fisher
          text: >-
            我去挖些蚯蚓，再钓一盘小鲦鱼当晚餐。要是能钓到五条以上，我就请托勒密龟市议员先生和艾萨克·牛顿爵士一起来。不过，市议员先生吃的是沙拉。
        - id: ch01-b04
          speaker: narrator
          text: >-
            杰里米先生穿好雨衣，套上那双锃亮的橡胶套鞋，又带上钓竿和篮子。他一蹦就是老远，几下便到了停船的地方。那条船又圆又绿，模样和四周的睡莲叶几乎一模一样，还拴在池塘中央的一株水草上。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他拿芦苇篙一撑，小船便离开水草，滑向开阔的水面。
        - id: ch01-b06
          speaker: mr_jeremy_fisher
          text: >-
            我知道哪儿有很多小鲦鱼。
    - id: ch02
      title: 等鱼上钩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            杰里米先生把篙插进泥里，又把小船系在篙上，这才盘腿坐稳，一件件摆好钓具。他有一枚顶可爱的小红浮子。钓竿是结实的草茎，钓线是一根又细又长的白马鬃，末端还拴着一条不停扭动的小蚯蚓。
        - id: ch02-b02
          speaker: narrator
          text: >-
            雨水顺着他的背往下流。他对着浮子看呀看，差不多看了一个钟头。
        - id: ch02-b03
          speaker: mr_jeremy_fisher
          text: >-
            这样等下去真没意思。我看，还是先吃午饭吧。
        - id: ch02-b04
          speaker: narrator
          text: >-
            他把船撑回水草中，从篮子里拿出午饭。
        - id: ch02-b05
          speaker: mr_jeremy_fisher
          text: >-
            我先吃份蝴蝶三明治，等这阵雨过去。
    - id: ch03
      title: 扎手的收获
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一只硕大的水甲虫从睡莲叶下面钻出来，狠狠夹了一下杰里米先生一只套鞋的鞋尖。他赶紧把盘着的两条腿缩得更高，让水甲虫再也够不着，然后接着吃他的三明治。
        - id: ch03-b02
          speaker: narrator
          text: >-
            池塘边的灯芯草丛里，一两次传出窸窸窣窣的声音，还扑通溅起了水花。
        - id: ch03-b03
          speaker: mr_jeremy_fisher
          text: >-
            但愿那不是老鼠。我还是换个地方吧。
        - id: ch03-b04
          speaker: narrator
          text: >-
            杰里米先生把船往外撑了一点，放下鱼饵。几乎就在这时，有东西咬钩了。小浮子猛地一沉！
        - id: ch03-b05
          speaker: mr_jeremy_fisher
          text: >-
            是小鲦鱼！我钩住它的鼻子啦！
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: >-
            他猛地提起钓竿，结果吓了一跳。钓上来的哪是什么光溜溜、胖乎乎的小鲦鱼，分明是浑身尖刺的小刺鱼杰克·夏普！
        - id: ch03-b07
          speaker: narrator
          text: >-
            小刺鱼在船里扑腾个不停，又扎又咬，直到累得上气不接下气，才纵身跳回水中。紧接着，一大群小鱼也把脑袋探出水面，一起嘲笑渔夫杰里米先生。
    - id: ch04
      title: 可怕的大鳟鱼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            杰里米先生垂头丧气地坐在船沿，一边吮着被刺痛的手指，一边低头朝水里张望。偏偏就在这时，一件糟糕得多的事发生了。要不是身上穿着雨衣，那可真要成为一件可怕极了的事！
        - id: ch04-b02
          speaker: narrator
          text: >-
            一条大得惊人的鳟鱼猛冲上来，扑通通通，水花乱飞。它张嘴咔嚓一下，咬住了杰里米先生。
        - id: ch04-b03
          speaker: mr_jeremy_fisher
          text: >-
            哎哟！哎哟！哎哟！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: >-
            鳟鱼一转身，咬着他直潜到池塘底下。可雨衣的味道实在不合它的胃口。还不到半分钟，它便把杰里米先生重新吐了出来。到头来，鳟鱼吞进肚里的只有他那双橡胶套鞋。
        - id: ch04-b05
          speaker: narrator
          text: >-
            杰里米先生“嘭”地浮回水面，活像一只从水底弹上来的软木塞，身边还跟着一串气泡，就像汽水瓶里的气泡一股脑儿冒了出来。他使出浑身力气，朝池塘边游去。
        - id: ch04-b06
          speaker: narrator
          text: >-
            他游到碰见的第一处岸边，手脚并用地爬了上去。随后，他一路跳过草地回到家，身上的雨衣早已破破烂烂，垂成了一条条碎布。
    - id: ch05
      title: 没有小鲦鱼的晚餐
      blocks:
        - id: ch05-b01
          speaker: mr_jeremy_fisher
          text: >-
            幸亏那不是梭子鱼！钓竿和篮子虽然丢了，也没什么要紧。反正我以后再也不敢钓鱼了！
        - id: ch05-b02
          speaker: narrator
          text: >-
            回到家，杰里米先生给受伤的手指贴上了几块橡皮膏。到了晚餐时间，两位朋友果然都来了。他当然拿不出鱼来招待他们，好在储藏室里还有别的吃食。
        - id: ch05-b03
          speaker: narrator
          text: >-
            艾萨克·牛顿爵士穿着黑底金纹的背心。托勒密龟市议员先生则提着网兜，带来了一份沙拉。
        - id: ch05-b04
          speaker: narrator
          text: >-
            这一餐没有鲜美的小鲦鱼，只有烤蚱蜢配瓢虫酱。青蛙觉得那是难得的美味，可要我说，一定难吃死了！
        - id: ch05-b05
          speaker: narrator
          text: >-
            故事讲完了。
