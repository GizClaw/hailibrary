cover_prompt: |-
  A wordless cover scene in an Edwardian English garden shows the Flopsy Bunnies sleeping in a heap beneath flowering lettuces. Six small brown rabbits with soft white tails wear simple jackets and pinafores in muted blue, yellow, rose, and green, while their parents Benjamin and Flopsy watch anxiously from behind a stone border. Thomasina Tittlemouse, a tiny brown field mouse in a pale apron, nibbles through the corner of a loosely tied sack to free the sleepy rabbits. Her careful rescue is the focal action, with a red handkerchief, garden twine, and vegetable rows making the situation clear without menace. Use a low rabbit-height close view framed by broad leaves, leaving a calm band of hedge and pale sky at the top. Keep animal anatomy recognizable, clothing and garden details grounded in the early 1900s, and all designs original rather than adapted. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
