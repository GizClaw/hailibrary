audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切风趣，带着从容的童话讲述感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    mr_mcgregor:
      display_name: 麦格雷戈先生
      tts:
        delivery: 粗声粗气，得意时格外夸张
        timbre: 浑厚粗粝
        pace: 中等偏慢
        pitch: 中低
    mrs_mcgregor:
      display_name: 麦格雷戈太太
      tts:
        delivery: 直率泼辣，质问时干脆有力
        timbre: 明亮结实
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 莴苣与瞌睡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 据说，莴苣吃得太多，人就会昏昏欲睡。我吃莴苣倒从来没犯过困。不过，我毕竟不是兔子。对弗洛普西家的小兔子们来说，莴苣的催眠劲儿可大得很。
        - id: ch01-b02
          speaker: narrator
          text: 本杰明兔长大后，娶了表亲弗洛普西。他们有了一大家子，日子过得快活，却从不为以后打算。孩子们各自叫什么，我已经记不清了。大家都管他们叫弗洛普西家的小兔子。
        - id: ch01-b03
          speaker: narrator
          text: 家里常常没有足够的食物，本杰明便去找弗洛普西的哥哥彼得兔，向他借几棵卷心菜。彼得经营着一座苗圃，可有时候，他也没有卷心菜能匀出来。
        - id: ch01-b04
          speaker: narrator
          text: 每到这时，小兔子们就穿过田野，去麦格雷戈先生菜园外的沟边。那里有一座垃圾堆，可以翻找吃的。
        - id: ch01-b05
          speaker: narrator
          text: 那堆东西可真杂。有果酱罐，有纸袋，还有割草机留下的一座座碎草山，吃起来总有股油味。里面也少不了烂西葫芦和一两只旧靴子。
        - id: ch01-b06
          speaker: narrator
          text: 有一天，垃圾堆里竟然出现了一大堆长过头、已经抽薹开花的莴苣。多么叫兔子高兴呀！
        - id: ch01-b07
          speaker: narrator
          text: 小兔子们只顾往肚里塞莴苣。吃着吃着，他们一个接一个困得撑不住了，全倒在割下来的草里睡着了。
        - id: ch01-b08
          speaker: narrator
          text: 本杰明还没有孩子们那么困。闭眼以前，他尚且清醒，知道拿个纸袋套住脑袋，免得苍蝇来烦他。
    - id: ch02
      title: 垃圾堆上的险情
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 暖暖的太阳底下，小兔子们睡得香极了。菜园那头的草坪上，割草机远远发出咔嗒咔嗒的响声。绿头苍蝇在墙边嗡嗡打转，一只上了年纪的小老鼠则在果酱罐之间翻垃圾。
        - id: ch02-b02
          speaker: narrator
          text: 这只老鼠的名字，我倒记得。她叫托马西娜·蒂特尔鼠，是一只有长尾巴的林鼠。
        - id: ch02-b03
          speaker: narrator
          text: 她窸窸窣窣地爬过纸袋，一下惊醒了本杰明兔。小老鼠赶紧连声道歉，还告诉本杰明，她认识彼得兔。
        - id: ch02-b04
          speaker: narrator
          text: 他们正在墙根下说话，头顶忽然传来沉重的脚步。转眼间，麦格雷戈先生把满满一袋刚割的草倒下来，正好盖住那些熟睡的小兔子。
        - id: ch02-b05
          speaker: narrator
          text: 本杰明连忙缩进纸袋下面，蒂特尔鼠也藏进一个果酱罐。草屑纷纷落下，小兔子们还在梦里甜甜地笑，谁也没醒。那些莴苣实在太催眠了。
        - id: ch02-b06
          speaker: narrator
          text: 他们梦见妈妈弗洛普西正把他们安顿在干草床上，还替他们把被窝掖好。
        - id: ch02-b07
          speaker: narrator
          text: 麦格雷戈先生倒空袋子，低头瞧了瞧。他看见草里冒出几枚棕色的小耳朵尖，样子怪有趣的。他盯了好半天，直到一只苍蝇落在一枚耳朵尖上，那只耳朵忽然动了。
        - id: ch02-b08
          speaker: narrator
          text: 麦格雷戈先生爬下墙，来到垃圾堆上。他边数边把小兔子一只只丢进袋里。
        - id: ch02-b09
          speaker: mr_mcgregor
          text: 一、二、三、四！五！六只小兔崽子！
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 小兔子们还以为妈妈在床上给他们翻身，只是睡着动了几下，依旧没醒。麦格雷戈先生扎紧袋口，把袋子留在墙头，自己去收割草机了。
    - id: ch03
      title: 蒂特尔鼠的妙计
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 麦格雷戈先生走后，原本留在家里的弗洛普西兔太太穿过田野，赶到了这里。她疑心地打量着墙上的袋子，不明白大家都去了哪里。
        - id: ch03-b02
          speaker: narrator
          text: 蒂特尔鼠从果酱罐里钻出来，本杰明也摘掉了头上的纸袋。他们把刚才那桩惨事从头到尾讲给弗洛普西听。
        - id: ch03-b03
          speaker: narrator
          text: 本杰明和弗洛普西急得没了办法。他们怎么也解不开袋口的绳子。好在蒂特尔鼠很有主意，她在袋子底下的一角啃出了一个洞。
        - id: ch03-b04
          speaker: narrator
          text: 大家把小兔子一个个拉出来，又拧了他们几下，这才把他们弄醒。
        - id: ch03-b05
          speaker: narrator
          text: 接着，兔爸爸和兔妈妈往空袋子里塞进三只烂西葫芦、一把旧鞋刷，还有两只烂芜菁。
        - id: ch03-b06
          speaker: narrator
          text: 做完这些，他们全躲进一丛灌木，等麦格雷戈先生回来。
    - id: ch04
      title: 窗外偷听
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 麦格雷戈先生回来提走袋子。袋子沉甸甸地垂在手下，看上去还真有些分量。弗洛普西一家隔着一段安全的距离，悄悄跟了上去。
        - id: ch04-b02
          speaker: narrator
          text: 他们眼看麦格雷戈先生进了屋，便蹑手蹑脚来到窗边。屋里，麦格雷戈先生把袋子重重摔在石板地上。小兔子们要是还在里面，这一下准会疼得不得了。
        - id: ch04-b03
          speaker: narrator
          text: 窗外的一家子听见椅子从石板地面拖过，又听见麦格雷戈先生得意地咯咯笑。
        - id: ch04-b04
          speaker: mr_mcgregor
          text: 一、二、三、四、五、六只小兔崽子！
          emotion: happy
        - id: ch04-b05
          speaker: mrs_mcgregor
          text: 啊？你说什么？他们这回又糟蹋什么了？
        - id: ch04-b06
          speaker: mr_mcgregor
          text: 一、二、三、四、五、六只肥兔崽子！你看，一、二、三……
          emotion: happy
        - id: ch04-b07
          speaker: mrs_mcgregor
          text: 别犯傻了！你到底在说什么呀，你这个傻老头？
        - id: ch04-b08
          speaker: mr_mcgregor
          text: 就在袋子里！一、二、三、四、五、六！
        - id: ch04-b09
          speaker: narrator
          text: 最小的那只弗洛普西兔爬上了窗台。麦格雷戈太太抓过袋子，用手摸了摸。她承认里面有六样东西，可那些东西硬邦邦的，形状还各不相同，所以她断定，这准是六只老兔子。
        - id: ch04-b10
          speaker: mrs_mcgregor
          text: 肉肯定不能吃了。不过，兔皮正好给我的旧斗篷做里子。
        - id: ch04-b11
          speaker: mr_mcgregor
          text: 给你的旧斗篷做里子？我要卖掉它们，给自己买烟叶！
          emotion: angry
        - id: ch04-b12
          speaker: mrs_mcgregor
          text: 买你的兔子烟吧！我要剥掉它们的皮，再把脑袋砍下来。
    - id: ch05
      title: 烂西葫芦飞出窗外
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 麦格雷戈太太解开袋口，把手伸了进去。她摸到的哪是什么兔子，全是烂菜！这下她可气坏了，一口咬定麦格雷戈先生是存心捉弄她。
        - id: ch05-b02
          speaker: narrator
          text: 麦格雷戈先生同样气得要命。一只烂西葫芦从厨房窗口飞了出来，正砸中窗外最小的弗洛普西兔，把小家伙砸得颇疼。
        - id: ch05-b03
          speaker: narrator
          text: 本杰明和弗洛普西觉得，该回家去了。于是，麦格雷戈先生没买成烟叶，麦格雷戈太太也没得到兔皮。
        - id: ch05-b04
          speaker: narrator
          text: 不过，到了第二年圣诞节，托马西娜·蒂特尔鼠收到了一份礼物。那些兔毛足够她做一件斗篷、一顶兜帽、一只漂亮的暖手筒，还有一双暖和的连指手套。
