audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    mrs_tittlemouse:
      display_name: Mrs. Tittlemouse
      tts:
        delivery: precise, brisk, and increasingly flustered
        timbre: small and crisp
        pace: moderately quick
        pitch: medium-high
    mr_mcgregor:
      display_name: Mr. McGregor
      tts:
        delivery: gruff, boastful, and quick to flare up
        timbre: rough and full
        pace: deliberate
        pitch: medium-low
    mrs_mcgregor:
      display_name: Mrs. McGregor
      tts:
        delivery: blunt, skeptical, and sharply practical
        timbre: firm and clear
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Too Much Lettuce
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            People say that eating too much lettuce has a "soporific" effect. In other words, it makes you sleepy. Lettuce has never made me sleepy, but then, I am not a rabbit.

            It certainly made the Flopsy Bunnies sleepy.
        - id: ch01-b02
          speaker: narrator
          text: |-
            When Benjamin Bunny grew up, he married his cousin Flopsy. They had a large family. They were cheerful, but they were not very careful about planning ahead.

            I cannot remember each child's name. Everyone simply called them the Flopsy Bunnies.

            There was not always enough food for them all. Benjamin often borrowed cabbages from Flopsy's brother, Peter Rabbit, who ran a nursery garden. But sometimes Peter had no cabbages to spare.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Whenever that happened, the Flopsy Bunnies crossed the field to a rubbish heap in the ditch outside Mr. McGregor's garden.

            It was a jumble of jam pots, paper bags, old boots, rotten vegetable marrows, and great heaps of grass from the mowing machine. The cut grass always tasted oily. But one day, what a delight! The heap was covered with overgrown lettuces that had shot up into flower.
        - id: ch01-b04
          speaker: narrator
          text: |-
            The Flopsy Bunnies stuffed themselves with lettuce. One after another, they grew drowsy and lay down in the cut grass.

            Benjamin stayed awake a little longer than the children. Before he fell asleep, he put a paper bag over his head to keep the flies away.
    - id: ch02
      title: Six Sleeping Bunnies
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            The little Flopsy Bunnies slept happily in the warm sun. Beyond the garden, the mowing machine clattered in the distance. Bluebottle flies buzzed around the wall. An old mouse picked through the rubbish between the jam pots.

            Her name was Thomasina Tittlemouse. She was a woodmouse with a long tail.
        - id: ch02-b02
          speaker: narrator
          text: Thomasina rustled over the paper bag and woke Benjamin Bunny.
        - id: ch02-b03
          speaker: mrs_tittlemouse
          text: Oh, I am terribly sorry! I know Peter Rabbit, you know.
        - id: ch02-b04
          speaker: narrator
          text: |-
            As Thomasina and Benjamin talked beside the wall, heavy footsteps sounded right above them. Without warning, Mr. McGregor dumped a whole sack of lawn clippings on top of the sleeping Flopsy Bunnies.

            Benjamin crouched beneath his paper bag. Thomasina hid inside a jam jar.
        - id: ch02-b05
          speaker: narrator
          text: |-
            Under that shower of grass, the little rabbits only smiled in their sleep. The lettuce had made them far too drowsy to wake. They dreamed their mother, Flopsy, was tucking them into a bed of hay.

            After Mr. McGregor emptied the sack, he looked down. Funny little brown ear tips were poking through the lawn clippings. He stared at them for quite a while.

            Then a fly landed on one ear, and the ear moved.
        - id: ch02-b06
          speaker: narrator
          text: Mr. McGregor climbed down onto the rubbish heap. He picked up the rabbits one by one and dropped them into his sack.
        - id: ch02-b07
          speaker: mr_mcgregor
          text: One, two, three, four, five, six little rabbits!
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: |-
            The Flopsy Bunnies dreamed that their mother was turning them over in bed. They wriggled a little, but they still did not wake.

            Mr. McGregor tied the sack shut, left it on top of the wall, and went away to put up the mowing machine.
    - id: ch03
      title: Mrs. Tittlemouse Makes a Hole
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            While he was gone, Mrs. Flopsy Bunny came across the field from home. She eyed the sack with suspicion. Where was everybody?

            Thomasina climbed out of the jam jar, and Benjamin took the paper bag off his head. Together they told Flopsy the dreadful story.
        - id: ch03-b02
          speaker: narrator
          text: |-
            Benjamin and Flopsy were in despair. Neither of them could loosen the string.

            But Mrs. Tittlemouse was resourceful. She gnawed a hole in one bottom corner of the sack. The little rabbits were pulled through it, then pinched until they woke up.
        - id: ch03-b03
          speaker: narrator
          text: |-
            Their parents filled the empty sack with three rotten vegetable marrows, one old blacking brush, and two decayed turnips. Then everyone hid under a bush and waited for Mr. McGregor.

            He came back, lifted the sack, and carried it away. He let it hang low, as though it were quite heavy.
        - id: ch03-b04
          speaker: narrator
          text: |-
            The Flopsy Bunnies followed from a safe distance. They watched Mr. McGregor enter his house. Then they crept up to the window and listened.

            Inside, Mr. McGregor hurled the sack onto the stone floor. That would have hurt the Flopsy Bunnies terribly if they had still been in it.

            They heard him scrape his chair across the flagstones. Then he chuckled.
    - id: ch04
      title: At the Kitchen Window
      blocks:
        - id: ch04-b01
          speaker: mr_mcgregor
          text: One, two, three, four, five, six little rabbits!
        - id: ch04-b02
          speaker: mrs_mcgregor
          text: What? What have they gone and ruined this time?
        - id: ch04-b03
          speaker: narrator
          text: Mr. McGregor counted on his fingers.
        - id: ch04-b04
          speaker: mr_mcgregor
          text: Six plump little rabbits! One, two, three—
        - id: ch04-b05
          speaker: mrs_mcgregor
          text: Oh, stop being silly. What are you talking about, you foolish old man?
        - id: ch04-b06
          speaker: mr_mcgregor
          text: They're in the sack! One, two, three, four, five, six!
        - id: ch04-b07
          speaker: narrator
          text: The youngest Flopsy Bunny climbed onto the windowsill. Inside, Mrs. McGregor grabbed the sack and felt all around it.
        - id: ch04-b08
          speaker: mrs_mcgregor
          text: I can feel six of them. But they must be old rabbits. They're hard, and every one is a different shape. They won't be any good to eat, but their skins will make a fine lining for my old cloak.
        - id: ch04-b09
          speaker: mr_mcgregor
          text: Line your old cloak? No! I'll sell those rabbits and buy myself some tobacco!
          emotion: angry
        - id: ch04-b10
          speaker: mrs_mcgregor
          text: Rabbit tobacco! I'll skin them and cut off their heads.
        - id: ch04-b11
          speaker: narrator
          text: |-
            Mrs. McGregor untied the sack and reached inside. Her hand closed around the vegetables.

            She became very, very angry. She accused Mr. McGregor of tricking her on purpose. Mr. McGregor was furious, too.

            One rotten marrow came flying through the kitchen window. It struck the youngest Flopsy Bunny and hurt the little rabbit.
    - id: ch05
      title: A Christmas Present
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Benjamin and Flopsy decided it was time for everyone to go home.
        - id: ch05-b02
          speaker: narrator
          text: |-
            So Mr. McGregor never got his tobacco, and Mrs. McGregor never got her rabbit skins.

            But when Christmas came, Thomasina Tittlemouse received a present. There was enough rabbit wool to make herself a cloak and hood, a handsome muff, and a pair of warm mittens.
