cover_prompt: |-
  A wordless cover scene inside a neat burrow house shows Mrs. Tittlemouse restoring order after unexpected visitors. Mrs. Tittlemouse is a tiny wood mouse with warm brown fur, bright dark eyes, a pale blue dress, white apron, and small mobcap, holding a little broom. Mr. Jackson, a large damp toad in a moss-green coat, sits good-naturedly near the doorway while a bee and a ladybird hover above carefully arranged acorn cups and seed jars. Mrs. Tittlemouse sweeps a trail of wet footprints toward the open door, making her determined housekeeping the focal action. Use an intimate mouse-height view down the earthen passage, with rounded rooms receding behind her and calm blank wall space at the top. Keep the animals recognizable, the household objects Edwardian and handmade, and all designs original rather than copied from existing illustrations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
