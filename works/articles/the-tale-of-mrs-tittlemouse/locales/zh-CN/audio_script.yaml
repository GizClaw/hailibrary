audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带一点含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中音
    mrs_tittlemouse:
      display_name: 小不点鼠太太
      tts:
        delivery: 讲究利落，恼火时尖锐但不失体面
        timbre: 纤细清脆
        pace: 偏快
        pitch: 中高音
    spider:
      display_name: 大蜘蛛
      tts:
        delivery: 冒冒失失又自以为客气
        timbre: 低沉干涩
        pace: 稍慢
        pitch: 低音
    babbitty_bumble:
      display_name: 巴比蒂大黄蜂
      tts:
        delivery: 急躁尖厉，话音里带着嗡鸣感
        timbre: 尖细有力
        pace: 偏快
        pitch: 高音
    mr_jackson:
      display_name: 杰克逊先生
      tts:
        delivery: 慢悠悠又厚脸皮，总带着满足的笑意
        timbre: 浑厚湿润
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 树篱下的家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小不点鼠太太住在树篱底下的一道土坡里。她的房子可有意思了。一道道沙土小走廊延伸出去，穿过树篱的根须，通向食品储藏室、坚果窖和种子窖。
        - id: ch01-b02
          speaker: narrator
          text: 屋里有厨房、起居室、餐具间和食品柜，还有她自己的卧室。她就睡在一张小小的箱式床里。
        - id: ch01-b03
          speaker: narrator
          text: 小不点鼠太太爱干净到了极点，做什么都格外讲究。松软的沙土地面，她总要扫了又扫，掸了又掸。
        - id: ch01-b04
          speaker: narrator
          text: 偶尔会有甲虫在走廊里迷路。小不点鼠太太一看见，就把簸箕敲得哐啷作响。
        - id: ch01-b05
          speaker: mrs_tittlemouse
          text: 嘘，嘘！瞧你那双脏兮兮的小脚！
        - id: ch01-b06
          speaker: narrator
          text: 有一天，一个披着红底黑点斗篷的小老太太，在走廊里跑来跑去。
        - id: ch01-b07
          speaker: mrs_tittlemouse
          text: 瓢虫妈妈，你家着火啦！快飞回孩子们身边去！
        - id: ch01-b08
          speaker: narrator
          text: 另一天，一只肥硕的大蜘蛛为了躲雨，也闯进了她的家。
        - id: ch01-b09
          speaker: spider
          text: 对不起，请问这里不是玛菲特小姐家吗？
        - id: ch01-b10
          speaker: mrs_tittlemouse
          text: 快出去，你这又冒失又讨厌的蜘蛛！你把断头蛛丝丢得到处都是，我干干净净的房子都叫你弄脏了！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 她一把将蜘蛛撵出窗户。蜘蛛牵着一根又细又长的丝，顺着树篱垂了下去。
    - id: ch02
      title: 储藏室里的嗡嗡声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小不点鼠太太接着往远处的储藏室走。她要取些樱桃核和蓟花绒籽来做晚饭。一路上，她不停地抽动鼻子，还仔细看着地面。
        - id: ch02-b02
          speaker: mrs_tittlemouse
          text: 怎么有一股蜂蜜味？难道是树篱外的报春花香？地上这些印子，准是脏兮兮的小脚踩的。
        - id: ch02-b03
          speaker: narrator
          text: 刚转过一个弯，她突然撞见巴比蒂大黄蜂。
        - id: ch02-b04
          speaker: babbitty_bumble
          text: 滋滋，嗡嗡，嗡——！
        - id: ch02-b05
          speaker: narrator
          text: 小不点鼠太太严厉地瞪着她，真希望手里正拿着扫帚。
        - id: ch02-b06
          speaker: mrs_tittlemouse
          text: 你好，巴比蒂。我倒愿意买一点蜂蜡。可你跑到这下面来做什么？为什么每次都从窗户钻进来，还一路滋滋嗡嗡地叫？
          emotion: angry
        - id: ch02-b07
          speaker: babbitty_bumble
          text: 滋滋，嗡嗡，嗡——！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 巴比蒂尖声尖气地回了一句，贴着走廊溜走了。她钻进从前存放橡果的那间储藏室，再也看不见了。
        - id: ch02-b09
          speaker: narrator
          text: 可那些橡果早在圣诞节前就叫小不点鼠太太吃光了，那间屋子本该是空的。如今里面却塞满了乱蓬蓬的干苔藓。
        - id: ch02-b10
          speaker: narrator
          text: 小不点鼠太太动手往外扯苔藓。三四只蜜蜂立刻探出脑袋，气势汹汹地嗡嗡叫。
        - id: ch02-b11
          speaker: mrs_tittlemouse
          text: 我这里从来不出租房间，你们这是私闯民宅！我非找人把你们赶出去不可——
          emotion: angry
        - id: ch02-b12
          speaker: babbitty_bumble
          text: 嗡！嗡！嗡——！
          emotion: angry
        - id: ch02-b13
          speaker: mrs_tittlemouse
          text: 可是，我能找谁来帮忙呢？
        - id: ch02-b14
          speaker: babbitty_bumble
          text: 嗡嗡，嗡嗡，嗡——！
        - id: ch02-b15
          speaker: mrs_tittlemouse
          text: 杰克逊先生可不行，他从来不擦脚。
        - id: ch02-b16
          speaker: narrator
          text: 她决定先去吃晚饭，过后再来处理这些蜜蜂。
    - id: ch03
      title: 不请自来的杰克逊先生
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小不点鼠太太刚回到起居室，就听见有人粗声粗气地咳嗽。坐在那里的，偏偏正是杰克逊先生。
        - id: ch03-b02
          speaker: narrator
          text: 他用硕大的身子塞满了一张小摇椅，两手绕着拇指打转，笑眯眯地把双脚搁在壁炉围栏上。他平时住在树篱下面的排水管里，那里是一条又脏又湿的水沟。
        - id: ch03-b03
          speaker: mrs_tittlemouse
          text: 您好，杰克逊先生。哎哟，您怎么浑身都湿透了！
          emotion: surprised
        - id: ch03-b04
          speaker: mr_jackson
          text: 多谢，多谢，多谢你，小不点鼠太太！我在这里坐一会儿，把身上烘干。
        - id: ch03-b05
          speaker: narrator
          text: 他就那么坐着微笑，水从燕尾服下摆滴滴答答淌下来。小不点鼠太太只好拿着拖把，围在他身边擦个不停。
        - id: ch03-b06
          speaker: narrator
          text: 杰克逊先生坐了很久。到最后，主人家只得问他，要不要一起吃点晚饭。她先拿出樱桃核。
        - id: ch03-b07
          speaker: mr_jackson
          text: 多谢，多谢你，小不点鼠太太！可我没牙，没牙，一颗牙也没有！
        - id: ch03-b08
          speaker: narrator
          text: 他把嘴张得老大，其实根本没有这个必要。不过，他嘴里的确连一颗牙也没有。
        - id: ch03-b09
          speaker: narrator
          text: 小不点鼠太太又请他吃蓟花绒籽。
        - id: ch03-b10
          speaker: mr_jackson
          text: 嘀哩，咕哩，咕哩！噗，噗，噗！
        - id: ch03-b11
          speaker: narrator
          text: 这一吹，蓟花绒顿时飞得满屋都是。
        - id: ch03-b12
          speaker: mr_jackson
          text: 多谢，多谢，多谢你，小不点鼠太太！不过我真正想吃的，是一小碟蜂蜜！
        - id: ch03-b13
          speaker: mrs_tittlemouse
          text: 恐怕我这里没有蜂蜜，杰克逊先生。
        - id: ch03-b14
          speaker: mr_jackson
          text: 嘀哩，咕哩，咕哩，小不点鼠太太！我明明闻到了蜂蜜味。我就是闻着它才来拜访你的。
        - id: ch03-b15
          speaker: narrator
          text: 杰克逊先生笨重地从桌边站起来，挨个翻看碗柜。小不点鼠太太拿着洗碗布紧跟在后面，把他留在起居室地板上的又大又湿的脚印一只只擦掉。
        - id: ch03-b16
          speaker: narrator
          text: 碗柜全翻遍了，他终于相信那里没有蜂蜜，便沿着走廊继续往里走。
        - id: ch03-b17
          speaker: mrs_tittlemouse
          text: 真的，杰克逊先生，您会卡在里面的！
        - id: ch03-b18
          speaker: mr_jackson
          text: 嘀哩，咕哩，咕哩，小不点鼠太太！
    - id: ch04
      title: 一团糟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 杰克逊先生先硬挤进餐具间。
        - id: ch04-b02
          speaker: mr_jackson
          text: 嘀哩，咕哩，咕哩？没有蜂蜜吗？小不点鼠太太，真的没有吗？
        - id: ch04-b03
          speaker: narrator
          text: 碟架里藏着三个爬爬虫模样的小家伙。两个逃掉了，最小的那个却被杰克逊先生捉住。
        - id: ch04-b04
          speaker: narrator
          text: 接着，他又硬挤进食品柜。蝴蝶小姐正在偷尝白糖，一见他就从窗户飞走了。
        - id: ch04-b05
          speaker: mr_jackson
          text: 嘀哩，咕哩，咕哩，小不点鼠太太！你家的客人还真不少！
        - id: ch04-b06
          speaker: mrs_tittlemouse
          text: 可我一个也没请过！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 他们继续沿着沙土走廊往前。杰克逊先生还在念叨着“嘀哩，咕哩”，前面却传来一阵响亮的嗡嗡声。
        - id: ch04-b08
          speaker: narrator
          text: 他在转角遇见巴比蒂，一口将她吞了进去，随即又吐了出来。
        - id: ch04-b09
          speaker: mr_jackson
          text: 我可不喜欢大黄蜂。她们浑身都是扎人的硬毛。
        - id: ch04-b10
          speaker: narrator
          text: 说着，他用燕尾服袖子擦了擦嘴。
        - id: ch04-b11
          speaker: babbitty_bumble
          text: 滚出去，你这讨厌的老癞蛤蟆！
          emotion: angry
        - id: ch04-b12
          speaker: mrs_tittlemouse
          text: 我简直要发疯啦！
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: 杰克逊先生开始往外扯蜂巢，小不点鼠太太只好把自己关进坚果窖。他好像一点也不怕蜂蜇。
        - id: ch04-b14
          speaker: narrator
          text: 等小不点鼠太太壮着胆子出来时，所有人都走光了。可屋里乱得简直吓人。
        - id: ch04-b15
          speaker: mrs_tittlemouse
          text: 我这辈子都没见过这么乱的屋子！到处都是蜂蜜，还有苔藓、蓟花绒，大大小小的脏脚印踩遍了我干干净净的家！
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: 她收起苔藓和剩下的蜂蜡，又到外面捡来几根细树枝，把前门堵小了一些。
        - id: ch04-b17
          speaker: mrs_tittlemouse
          text: 我要让这扇门小得杰克逊先生再也钻不进来！
        - id: ch04-b18
          speaker: narrator
          text: 她又从储藏室取出软皂、法兰绒布和一把新板刷。可她实在太累，再也干不动了。她先在椅子上睡着，后来才回床上去。
        - id: ch04-b19
          speaker: mrs_tittlemouse
          text: 这里还会有重新变整洁的一天吗？
          emotion: sad
    - id: ch05
      title: 干干净净的宴会
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天一大早，小不点鼠太太就起床开始大扫除。这一收拾，足足用了两个星期。
        - id: ch05-b02
          speaker: narrator
          text: 她扫呀，刷呀，掸呀，又用蜂蜡把家具擦得锃亮，把一把把小锡勺也磨得闪闪发光。
        - id: ch05-b03
          speaker: narrator
          text: 等家里重新变得整整齐齐、干干净净，她请来另外五只小老鼠开宴会。这一回，她可没请杰克逊先生。
        - id: ch05-b04
          speaker: narrator
          text: 杰克逊先生闻见宴会的香味，顺着土坡爬上来。可是门口已经太窄了，他怎么挤也挤不进去。
        - id: ch05-b05
          speaker: narrator
          text: 于是，小老鼠们从窗户递给他一杯又一杯蜜露，每一杯都盛在小小的橡果壳里。杰克逊先生一点也没生气。
        - id: ch05-b06
          speaker: narrator
          text: 他坐在外面的阳光下，举起手里的橡果杯。
        - id: ch05-b07
          speaker: mr_jackson
          text: 嘀哩，咕哩，咕哩！祝你身体健康，小不点鼠太太！
          emotion: happy
