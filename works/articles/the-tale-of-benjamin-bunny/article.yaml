cover_prompt: |-
  A wordless cover scene in an Edwardian English kitchen garden shows Benjamin Bunny helping his cousin Peter recover lost clothes. Benjamin is a small brown rabbit wearing a green tam-o'-shanter and short brown jacket, while Peter is a slightly smaller brown rabbit in a pale blue jacket with brass-colored buttons. They stand beneath a wooden garden sieve holding a red cotton handkerchief filled with onions, as a large gray cat sits calmly on top without seeing them. Benjamin raises one paw to steady the sieve while Peter gathers his tiny shoes, making their careful rescue the focal action. Use a low rabbit-height three-quarter view among lettuces, clay pots, and a brick garden wall, leaving calm foliage and sky at the top. Keep rabbit anatomy believable beneath simple period clothing, base designs only on the text, and avoid all film, animation, or branded likenesses. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
