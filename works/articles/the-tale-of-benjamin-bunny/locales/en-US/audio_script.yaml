  chapters:
    - id: ch01
      title: A Visit to Peter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            One morning, a little rabbit sat on a bank. He pricked up his ears. Along the road came the trit-trot, trit-trot of a pony.

            Mr. McGregor was driving a gig, and Mrs. McGregor sat beside him in her best bonnet.
        - id: ch01-b02
          speaker: narrator
          text: |-
            The moment they had passed, little Benjamin Bunny slid down into the road. With a hop, a skip, and a jump, he set off to visit his relations. They lived in the wood behind Mr. McGregor's garden.

            The wood was full of rabbit holes. In the neatest, sandiest hole lived Benjamin's aunt and his cousins, Flopsy, Mopsy, Cotton-tail, and Peter.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Old Mrs. Rabbit was a widow, and she worked hard to support the family. She knitted rabbit-wool mittens and muffatees to sell. I once bought a pair at a bazaar. She sold herbs and rosemary tea, too, along with rabbit-tobacco. We call that lavender.

            Benjamin did not especially want to see his aunt.
        - id: ch01-b04
          speaker: narrator
          text: He came around the back of a fir tree and almost tumbled right on top of his cousin Peter. Peter sat there alone. He looked poorly, and he wore a red cotton handkerchief instead of his clothes.
        - id: ch01-b05
          speaker: benjamin
          text: Peter, who took your clothes?
        - id: ch01-b06
          speaker: peter
          text: They're on the scarecrow in Mr. McGregor's garden.
        - id: ch01-b07
          speaker: narrator
          text: Peter told Benjamin how Mr. McGregor had chased him through the garden and how he had lost his shoes and coat.
        - id: ch01-b08
          speaker: narrator
          text: Benjamin sat beside him. He explained that Mr. and Mrs. McGregor had both gone out in the gig. They would certainly be away for the day, because Mrs. McGregor had worn her best bonnet.
        - id: ch01-b09
          speaker: peter
          text: I wish it would rain.
        - id: ch01-b10
          speaker: narrator
          text: Just then, they heard old Mrs. Rabbit calling from inside the hole.
        - id: ch01-b11
          speaker: mrs_rabbit
          text: Cotton-tail! Cotton-tail! Go fetch some more chamomile!
        - id: ch01-b12
          speaker: peter
          text: Maybe a walk would help me feel better.
        - id: ch01-b13
          speaker: narrator
          text: |-
            The cousins went off hand in hand. Soon they reached the flat top of the wall at the bottom of the wood and looked down into Mr. McGregor's garden.

            There were Peter's coat and shoes on the scarecrow. On top sat one of Mr. McGregor's old tam-o'-shanters.
    - id: ch02
      title: Back in Mr. McGregor's Garden
      blocks:
        - id: ch02-b01
          speaker: benjamin
          text: You'll ruin your clothes crawling under a gate. We should climb down the pear tree instead.
        - id: ch02-b02
          speaker: narrator
          text: Peter fell headfirst from the tree. Luckily, the garden bed below had just been raked, so it was quite soft.

            Lettuces had been planted there.
        - id: ch02-b03
          speaker: narrator
          text: The rabbits left odd little footprints all over the bed. Benjamin left the most, because he was wearing clogs.
        - id: ch02-b04
          speaker: benjamin
          text: First, we get your clothes back. Then we can use that handkerchief.
        - id: ch02-b05
          speaker: narrator
          text: |-
            They pulled the clothes off the scarecrow. It had rained during the night, so the shoes were full of water and the coat had shrunk a little.

            Benjamin tried on the tam-o'-shanter, but it was far too big for him.
        - id: ch02-b06
          speaker: benjamin
          text: Let's fill your handkerchief with onions. We can bring them to Aunt as a present.
        - id: ch02-b07
          speaker: narrator
          text: Peter was not enjoying himself. He kept hearing noises. Benjamin felt perfectly at home. He ate a lettuce leaf and explained that he often came to the garden with his father to gather lettuce for Sunday dinner.
        - id: ch02-b08
          speaker: narrator
          text: Benjamin's father was old Mr. Benjamin Bunny.

            And the lettuces really were very fine.
        - id: ch02-b09
          speaker: peter
          text: I don't want anything to eat. I want to go home.
        - id: ch02-b10
          speaker: narrator
          text: Before long, Peter dropped half the onions.
        - id: ch02-b11
          speaker: benjamin
          text: We can't climb back up the pear tree carrying all these vegetables.
        - id: ch02-b12
          speaker: narrator
          text: |-
            Benjamin boldly led the way toward the far end of the garden. The cousins followed a little walkway made of planks beneath a sunny red brick wall.

            Mice sat on their doorsteps, cracking cherry pits. They winked at Peter Rabbit and little Benjamin Bunny.

            Then Peter dropped the handkerchief again.
    - id: ch03
      title: Under the Basket
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            They found themselves among flowerpots, frames, and tubs. The noises sounded worse than ever to Peter. His eyes grew as big as lollipops.

            He was a step or two ahead of Benjamin when he suddenly stopped.

            And this is what the little rabbits saw around the corner.
        - id: ch03-b02
          speaker: narrator
          text: Benjamin took one look. In less than half a minute, he had hidden Peter, the onions, and himself beneath a large basket.
        - id: ch03-b03
          speaker: narrator
          text: |-
            The cat stood up, stretched, and came over to sniff the basket. Perhaps she liked the smell of onions.

            Whatever the reason, she sat right on top.

            And she stayed there for five hours.
        - id: ch03-b04
          speaker: narrator
          text: I cannot show you Peter and Benjamin under that basket. It was completely dark, and the onion smell was dreadful. It made both little rabbits cry.
        - id: ch03-b05
          speaker: narrator
          text: The sun moved behind the wood, and afternoon grew late. Still, the cat sat on the basket.
        - id: ch03-b06
          speaker: narrator
          text: |-
            At last came a pitter-patter, pitter-patter. Little bits of mortar fell from the wall above.

            The cat looked up. Old Mr. Benjamin Bunny was prancing along the wall at the top of the terrace. He had a pipe of rabbit-tobacco in his mouth and a little switch in his hand.

            He was searching for his son.
    - id: ch04
      title: Old Mr. Bunny to the Rescue
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            Old Mr. Bunny could not stand cats.

            Down he came from the wall in one tremendous leap, landing right on the cat. He knocked her off the basket, kicked her into the greenhouse, and scratched out a handful of fur.

            The cat was too surprised to scratch him back.
        - id: ch04-b02
          speaker: narrator
          text: After driving the cat into the greenhouse, old Mr. Bunny locked the door.
        - id: ch04-b03
          speaker: narrator
          text: |-
            Then he went back to the basket. First he hauled his son Benjamin out by the ears and gave him a whipping with the little switch.

            Next he took out his nephew Peter. Then he pulled out the handkerchief full of onions and marched out of the garden.
    - id: ch05
      title: Home Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: About half an hour later, Mr. McGregor came home. Several things puzzled him.
        - id: ch05-b02
          speaker: narrator
          text: It looked as if someone in clogs had tramped all over the garden. The strange thing was, the footprints were ridiculously tiny.
        - id: ch05-b03
          speaker: narrator
          text: He also could not understand how the cat had shut herself inside the greenhouse when the door was locked from the outside.
        - id: ch05-b04
          speaker: narrator
          text: |-
            When Peter reached home, his mother forgave him. She was so glad that he had found his shoes and coat.

            Cotton-tail and Peter folded the handkerchief. Old Mrs. Rabbit tied the onions in strings and hung them from the kitchen ceiling beside the bunches of herbs and rabbit-tobacco.
