  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    benjamin:
      display_name: Benjamin Bunny
      tts:
        delivery: lively, confident, and matter-of-fact
