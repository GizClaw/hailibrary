audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带一点一本正经的幽默
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中
    benjamin:
      display_name: 小本杰明
      tts:
        delivery: 大胆快活，自信中透着孩子气
        timbre: 清脆活泼
        pace: 轻快
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 小心怯生，紧张时语气急促
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高
    mrs_rabbit:
      display_name: 老兔太太
      tts:
        delivery: 勤快利落，慈爱而有主见
        timbre: 温厚清晰
        pace: 适中
        pitch: 中
    old_benjamin:
      display_name: 老本杰明兔先生
      tts:
        delivery: 严厉果断，沉稳有力
        timbre: 低沉粗厚
        pace: 稳健
        pitch: 低
  chapters:
    - id: ch01
      title: 路上的马车
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天早晨，小本杰明兔子坐在土坡上。他忽然竖起耳朵，听见一匹小马嘚儿嗒、嘚儿嗒地沿路走来。一辆双轮马车越来越近，赶车的是麦格雷戈先生。麦格雷戈太太坐在他身旁，还戴着她最体面的帽子。
        - id: ch01-b02
          speaker: narrator
          text: 马车刚一走远，本杰明就从土坡溜到路上。他蹦一下，跳一步，再纵身一跃，一路去找亲戚。他们住在麦格雷戈先生菜园后面的树林里。林子里满是兔子洞，其中最整洁、沙土最干爽的一个，住着他的姑妈和四个表亲，弗洛普茜、莫普茜、棉尾巴和彼得。
        - id: ch01-b03
          speaker: narrator
          text: 本杰明的姑妈老兔太太是个寡妇。她靠编织兔毛手套和护腕过日子，还卖香草、迷迭香茶和兔子烟草。对了，兔子烟草，就是我们说的薰衣草。我还在义卖会上买过她织的一副手套呢。
        - id: ch01-b04
          speaker: narrator
          text: 可小本杰明其实不大想见姑妈。他从冷杉树后面绕过去，险些摔到表哥彼得身上。彼得独自坐着，看上去病恹恹的，身上只围了一块红棉布手帕。
        - id: ch01-b05
          speaker: benjamin
          text: 彼得，你的衣服让谁拿走了？
        - id: ch01-b06
          speaker: peter
          text: 麦格雷戈先生菜园里的稻草人。我在园子里被人追得到处跑，鞋子和外套也全丢在那里了。
        - id: ch01-b07
          speaker: narrator
          text: 本杰明挨着表哥坐下，向他保证麦格雷戈夫妇都坐马车走了。他们肯定一整天都不会回来，因为麦格雷戈太太连最体面的帽子都戴上了，这还会有错吗？
        - id: ch01-b08
          speaker: peter
          text: 我真希望今天会下雨。
        - id: ch01-b09
          speaker: mrs_rabbit
          text: 棉尾巴！棉尾巴！再拿些洋甘菊来！
        - id: ch01-b10
          speaker: narrator
          text: 姑妈的喊声从兔子洞里传出来。彼得一听，便说自己出去走走，也许会舒服一点。
    - id: ch02
      title: 重返菜园
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两只小兔手拉着手离开兔子洞，一直走到树林尽头。他们爬上平平的墙顶，朝菜园里低头一看，彼得的外套和鞋子还好端端地穿在稻草人身上，最上面扣着麦格雷戈先生的旧苏格兰帽。
        - id: ch02-b02
          speaker: benjamin
          text: 从门底下挤，会把衣服弄坏的。要进园子，就该顺着梨树爬下去。
        - id: ch02-b03
          speaker: narrator
          text: 彼得却头朝下一栽了下去。幸好下面的苗床刚刚耙过，泥土松软得很，一点也没摔坏。苗床里种着生菜，两只小兔在上面踩出了一串串古怪的小脚印。本杰明穿着木底鞋，留下的脚印尤其多。
        - id: ch02-b04
          speaker: benjamin
          text: 咱们先把你的衣服拿回来。腾出这块手帕，才好拿它装东西。
        - id: ch02-b05
          speaker: narrator
          text: 他们把衣服从稻草人身上脱下来。昨夜下过雨，鞋里全是水，外套也缩小了一点。本杰明又把苏格兰帽戴到头上试了试，可那帽子实在太大。
        - id: ch02-b06
          speaker: benjamin
          text: 我们装一手帕洋葱吧，正好送给姑妈当礼物。
        - id: ch02-b07
          speaker: narrator
          text: 彼得并不觉得好玩。他总听见奇怪的动静。本杰明却自在极了，还拿起一片生菜叶吃起来。
        - id: ch02-b08
          speaker: benjamin
          text: 我常跟爸爸来这里摘生菜，留着星期日吃晚餐。
        - id: ch02-b09
          speaker: narrator
          text: 小本杰明的爸爸，就是老本杰明兔先生。至于园子里的生菜，确实长得好极了。
        - id: ch02-b10
          speaker: peter
          text: 我什么也不想吃。我想回家了。
        - id: ch02-b11
          speaker: narrator
          text: 没过多久，彼得就掉了半包洋葱。
    - id: ch03
      title: 大筐底下
      blocks:
        - id: ch03-b01
          speaker: benjamin
          text: 带着这么多菜，我们可没法再爬上梨树。走另一头吧！
        - id: ch03-b02
          speaker: narrator
          text: 本杰明大胆地走在前面。他们踏着木板小路，沿一堵晒得暖烘烘的红砖墙向前走。老鼠们坐在各家门口，咔嚓咔嚓地咬樱桃核，还冲两只小兔眨眼睛。
        - id: ch03-b03
          speaker: narrator
          text: 没走多远，彼得又松开手，把兜着洋葱的手帕丢了一回。他们走到花盆、育苗框和木桶中间，听见的动静越来越吓人。彼得的眼睛都瞪得像两根棒棒糖那么大了。
        - id: ch03-b04
          speaker: narrator
          text: 彼得走在表弟前面，只快了一两步。刚到拐角，他突然停住。两只小兔朝拐角后面一看，那里蹲着的，正是一只猫！
        - id: ch03-b05
          speaker: narrator
          text: 本杰明只瞧了一眼，转眼间便把自己、彼得和那包洋葱全藏到一只大筐下面。猫站起来伸伸懒腰，走到筐边仔细闻了闻。也许她挺喜欢洋葱味呢。
        - id: ch03-b06
          speaker: narrator
          text: 不管怎样，猫在筐顶坐下了，而且一坐就是整整五个钟头。
        - id: ch03-b07
          speaker: narrator
          text: 我没法画出彼得和本杰明躲在筐下的模样。里面黑洞洞的，洋葱又呛得厉害，两只小兔都被熏哭了。
        - id: ch03-b08
          speaker: narrator
          text: 太阳慢慢绕到树林后面，下午已经很晚，可那只猫还是不肯离开筐顶。
    - id: ch04
      title: 老兔先生来了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 终于，墙上传来啪嗒啪嗒的脚步声，几块灰泥也落了下来。猫抬起头，只见老本杰明兔先生正沿着上层菜园的墙顶，一蹦一跳地赶过来。他叼着装有兔子烟草的烟斗，手里握着一根小细枝。他正在找儿子。
        - id: ch04-b02
          speaker: narrator
          text: 老兔先生一向讨厌猫。他从墙顶猛跳下来，正落在猫背上。他一巴掌把猫打下大筐，又一脚将她踢进温室，还抓掉了一大把猫毛。
        - id: ch04-b03
          speaker: narrator
          text: 猫实在太吃惊了，连伸爪子还手都忘了。老兔先生一直把她赶进温室，随后从外面锁上了门。
        - id: ch04-b04
          speaker: narrator
          text: 他回到筐边，先揪着本杰明的耳朵，把儿子提出来，用细枝狠狠抽了一顿。接着，他抱出外甥彼得，又取出那包洋葱，领着两个孩子昂首阔步地离开了菜园。
    - id: ch05
      title: 谁锁了温室
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 大约半小时后，麦格雷戈先生回来了。菜园里有好几件怪事，让他怎么想也想不通。
        - id: ch05-b02
          speaker: narrator
          text: 地上到处都是木底鞋踩过的痕迹，可那些脚印小得太可笑了。更奇怪的是，猫竟把自己关在温室里面，门却从外面锁得严严实实。
        - id: ch05-b03
          speaker: narrator
          text: 彼得回到家，妈妈看见他找回了鞋子和外套，高兴得原谅了他。棉尾巴和彼得叠好红手帕，老兔太太把洋葱一只只串起来，和一束束香草、兔子烟草一起挂到了厨房的天花板上。
