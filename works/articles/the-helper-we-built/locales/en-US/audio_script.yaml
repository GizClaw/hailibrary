    "chapters": [
      {
        "id": "ch01",
        "title": "The First Sort",
        "blocks": [
          {
            "id": "ch01-b01",
            "speaker": "narrator",
            "text": "At 7:43 on a Saturday morning, Helper made its very first correct sort. Its claw closed around an empty yogurt cup, swung halfway around, and dropped the cup into the blue recycling bin. Pop! The plastic hit the rim, and sparrows lifted from the fence.\n\nDev jumped too—and smacked his head on the workshop’s solar awning."
          },
          {
            "id": "ch01-b02",
            "speaker": "maker-a",
            "text": "Yes!",
            "emotion": "happy"
          },
          {
            "id": "ch01-b03",
            "speaker": "narrator",
            "text": "Nora stayed crouched beside the wheels. She checked that no cable had snagged, then pressed the emergency stop. Helper lowered its claw and went dark."
          },
          {
            "id": "ch01-b04",
            "speaker": "maker-a",
            "text": "Why do you turn it off every time it works?"
          },
          {
            "id": "ch01-b05",
            "speaker": "narrator",
            "text": "Dev said."
          },
          {
            "id": "ch01-b06",
            "speaker": "maker-b",
            "text": "Because turning it off has to work every time too."
          },
          {
            "id": "ch01-b07",
            "speaker": "narrator",
            "text": "They'd spent most of the summer building the waist-high robot. Its base came from a retired delivery cart, and its jointed claw used to be part of a desk lamp.\n\nHelper couldn't talk, and it couldn't understand speech. All it could do was compare an object's shape, material, and stains with pictures Dev and Nora had labeled. If something looked like recycling, compost, or trash, it carried that thing toward the matching bin. And if it wasn't sure? It was supposed to stop, flash amber, and wait.\n\nMr. Lewis maintained their apartment courtyard. He inspected the cup carefully. Every morning, he had to open bags all over again and fix everyone's sorting by hand."
          },
          {
            "id": "ch01-b08",
            "speaker": "caretaker",
            "text": "What if the cup isn’t empty?"
          },
          {
            "id": "ch01-b09",
            "speaker": "narrator",
            "text": " he asked.\n\nDev offered half a cup of juice. Helper lifted it, blinked twice, and turned amber."
          },
          {
            "id": "ch01-b10",
            "speaker": "maker-b",
            "text": "It asks a person,"
          },
          {
            "id": "ch01-b11",
            "speaker": "narrator",
            "text": " Nora said."
          },
          {
            "id": "ch01-b12",
            "speaker": "caretaker",
            "text": "Quietly,"
          },
          {
            "id": "ch01-b13",
            "speaker": "narrator",
            "text": " Mr. Lewis observed."
          },
          {
            "id": "ch01-b14",
            "speaker": "maker-b",
            "text": "It waits for a person,"
          },
          {
            "id": "ch01-b15",
            "speaker": "narrator",
            "text": " she corrected.\n\nMr. Lewis pointed to a dented cookie tin beside the workshop door. Clear tape crossed its peeling lid. "
          },
          {
            "id": "ch01-b16",
            "speaker": "caretaker",
            "text": "What about that?"
          },
          {
            "id": "ch01-b17",
            "speaker": "maker-a",
            "text": "Metal,"
          },
          {
            "id": "ch01-b18",
            "speaker": "narrator",
            "text": " Dev said."
          },
          {
            "id": "ch01-b19",
            "speaker": "maker-b",
            "text": "Not until we know what is inside,"
          },
          {
            "id": "ch01-b20",
            "speaker": "narrator",
            "text": " Nora said at the same time.\n\nMr. Lewis lifted the lid. Screws, washers, and hooks stood in slots he had cut into cardboard. "
          },
          {
            "id": "ch01-b21",
            "speaker": "caretaker",
            "text": "You can teach the machine which bin an object goes in. But who teaches it whether the object should go in a bin at all?"
          },
          {
            "id": "ch01-b22",
            "speaker": "narrator",
            "text": "Dev thought the answer was obvious. Helper would only patrol near the sorting station. Who would leave anything important there?\n\nBut before he could say that, his phone chimed. Monday's showcase schedule had arrived. It listed three things: efficiency, reliability, and community value. Dev turned the screen toward Nora. Mr. Lewis closed his tin, and his question went unanswered."
          }
        ]
      },
      {
        "id": "ch02",
        "title": "Twenty Seconds",
        "blocks": [
          {
            "id": "ch02-b01",
            "speaker": "narrator",
            "text": "On Helper's first public trial, it crawled along a painted line near the bins. It picked up bottles and cans. It even pulled a newspaper out of a puddle. Then it reached a greasy takeout box—and waited. For two whole minutes.\n\nWhen Mr. Lewis finally took the box away, the neighbors applauded. But Dev only saw a robot standing still. On his phone, the showcase invitation still listed those three words: efficiency, reliability, community value. Suddenly, two minutes felt enormous.\n\nThat afternoon, he cut Helper's waiting time down to twenty seconds. He also lowered the confidence setting, so the robot would choose the closest match instead of stopping.\n\nNora took one look at the new numbers."
          },
          {
            "id": "ch02-b02",
            "speaker": "maker-b",
            "text": "What did you change?"
          },
          {
            "id": "ch02-b03",
            "speaker": "maker-a",
            "text": "Now it won't freeze over every dirty scrap of paper."
          },
          {
            "id": "ch02-b04",
            "speaker": "maker-b",
            "text": "What happens when it isn’t sure?"
          },
          {
            "id": "ch02-b05",
            "speaker": "maker-a",
            "text": "It picks the closest match. People make guesses too."
          },
          {
            "id": "ch02-b06",
            "speaker": "maker-b",
            "text": "Put it back. Tomorrow we can test—"
          },
          {
            "id": "ch02-b07",
            "speaker": "maker-a",
            "text": "The showcase is on Monday. We don't have time."
          },
          {
            "id": "ch02-b08",
            "speaker": "narrator",
            "text": " He shut the laptop. "
          },
          {
            "id": "ch02-b09",
            "speaker": "maker-a",
            "text": "I’ll watch it."
          },
          {
            "id": "ch02-b10",
            "speaker": "narrator",
            "text": "Nora kept one hand on the screen. Two clicks—that was all it would take to put the old setting back. But the robot held her soldered wires, the camera she'd tuned late at night, and most of her summer. When Dev said “showcase,” it sounded like a door they'd both been waiting months to open."
          },
          {
            "id": "ch02-b11",
            "speaker": "maker-b",
            "text": "The remote stays in your pocket,"
          },
          {
            "id": "ch02-b12",
            "speaker": "narrator",
            "text": " she said. "
          },
          {
            "id": "ch02-b13",
            "speaker": "maker-b",
            "text": "It stops below half a battery. It stops when the courtyard gets crowded."
          },
          {
            "id": "ch02-b14",
            "speaker": "maker-a",
            "text": "Agreed."
          },
          {
            "id": "ch02-b15",
            "speaker": "narrator",
            "text": " Dev held up his palm.\n\nNora did not high-five him. She wrote TWENTY SECONDS in their notebook and pressed hard enough to puncture the page.\n\nOn Sunday, Helper moved quickly. It pulled a crushed can from beneath a bench and steered around two children playing tag. Near the garden it picked up a broken umbrella.\n\nMrs. Patel hurried from her repair table and grabbed the handle. "
          },
          {
            "id": "ch02-b16",
            "speaker": "repairer",
            "text": "Let go!",
            "emotion": "angry"
          },
          {
            "id": "ch02-b17",
            "speaker": "narrator",
            "text": "The motor kept turning. Nora hit the stop button. The claw opened.\n\nMrs. Patel hugged the muddy umbrella to her chest. "
          },
          {
            "id": "ch02-b18",
            "speaker": "repairer",
            "text": "I'm saving those ribs. Who told your machine I was done with this umbrella?",
            "emotion": "angry"
          },
          {
            "id": "ch02-b19",
            "speaker": "maker-a",
            "text": "It looked—"
          },
          {
            "id": "ch02-b20",
            "speaker": "narrator",
            "text": " Dev began."
          },
          {
            "id": "ch02-b21",
            "speaker": "repairer",
            "text": "It looked like trash to whom?",
            "emotion": "angry"
          },
          {
            "id": "ch02-b22",
            "speaker": "narrator",
            "text": "Mrs. Patel had been saving the umbrella fabric for kite tails at the children's club. Dev apologized and carried it back to her table. Then he added a new rule: Helper could only pick up things lying on the ground.\n\nNora tapped the screen."
          },
          {
            "id": "ch02-b23",
            "speaker": "maker-b",
            "text": "The umbrella was on the ground."
          },
          {
            "id": "ch02-b24",
            "speaker": "maker-a",
            "text": "Then objects more than six feet from a person."
          },
          {
            "id": "ch02-b25",
            "speaker": "maker-b",
            "text": "So if I stand six feet away from my backpack, that makes it trash?"
          },
          {
            "id": "ch02-b26",
            "speaker": "maker-a",
            "text": "There has to be some number."
          },
          {
            "id": "ch02-b27",
            "speaker": "narrator",
            "text": " Dev glanced at the clock. "
          },
          {
            "id": "ch02-b28",
            "speaker": "maker-a",
            "text": "I’ll have the remote. One mistake, and I stop it."
          },
          {
            "id": "ch02-b29",
            "speaker": "narrator",
            "text": "Nora looked at her fingerprint on the stop button. Helper was not the only thing that should have stopped."
          }
        ]
      },
      {
        "id": "ch03",
        "title": "Wind Behind the Screen",
        "blocks": [
          {
            "id": "ch03-b01",
            "speaker": "narrator",
            "text": "That evening, the neighbors set out chairs for a courtyard movie. The screen wasn't even on yet when wind rushed between the buildings. A picture of ringed planets flew off a little boy's lap and tumbled across the pavement. Helper chased it. The paper slid seven feet away from the nearest chair.\n\nThen the claw snapped shut."
          },
          {
            "id": "ch03-b02",
            "speaker": "child",
            "text": "Mine!"
          },
          {
            "id": "ch03-b03",
            "speaker": "narrator",
            "text": " the boy shouted.\n\nDev saw the flash of yellow paper through the crowd. He reached for the remote. His pocket was empty. He had left it charging in the workshop.\n\nHelper dropped the picture into the paper bin. The boy leaned over the rim but could not reach it. A gust snatched a small embroidered blanket from another chair. Helper turned toward it, green light blinking."
          },
          {
            "id": "ch03-b04",
            "speaker": "maker-b",
            "text": "Emergency cutoff!",
            "emotion": "fearful"
          },
          {
            "id": "ch03-b05",
            "speaker": "narrator",
            "text": " Nora shouted.\n\nShe ran from the far side of the screen. Dev climbed over two rows of chairs and crushed somebody’s popcorn. Helper caught one corner of the blanket and dragged. Its owner held the other end. The motor whined.\n\nDev reached the robot, opened the rear emergency flap, and pulled the insulated cutoff handle built for that purpose. The wheels stopped, but the claw remained locked. He and Nora loosened the joint with a wrench while the movie audience stood in a silent half circle.\n\nThey recovered the planet picture. Spilled lemonade had soaked one corner, turning blue Saturn into a cloud. The boy took it without looking at them. The blanket carried a black wheel mark. From the bins they also retrieved a case containing someone’s dentures, cat food Mrs. Patel had set down, and Mr. Lewis’s box of screws.\n\nDev held the oily box. "
          },
          {
            "id": "ch03-b06",
            "speaker": "maker-a",
            "text": "I’ll replace everything."
          },
          {
            "id": "ch03-b07",
            "speaker": "caretaker",
            "text": "Return what can be returned first,"
          },
          {
            "id": "ch03-b08",
            "speaker": "narrator",
            "text": " Mr. Lewis said.\n\nNora pulled the test notebook from Helper. Wind opened it to the punctured page. "
          },
          {
            "id": "ch03-b09",
            "speaker": "maker-b",
            "text": "Dev changed the setting, but I saw it."
          },
          {
            "id": "ch03-b10",
            "speaker": "narrator",
            "text": " she said. "
          },
          {
            "id": "ch03-b11",
            "speaker": "maker-b",
            "text": "I didn't put it back, and I didn't stop the trial. So half of this is mine."
          },
          {
            "id": "ch03-b12",
            "speaker": "narrator",
            "text": "Dev had explanations ready. The wind. The missing remote. The rule that had worked all morning. But none of those explanations answered for what had happened. So he deleted the showcase invitation.\n\nThe movie never started. While the neighbors sorted their belongings back out of the waste, Dev and Nora pushed the powerless robot home. Popcorn was stuck to one wheel. Every time it turned, it made a small tap."
          }
        ]
      },
      {
        "id": "ch04",
        "title": "What Could Not Be Returned",
        "blocks": [
          {
            "id": "ch04-b01",
            "speaker": "narrator",
            "text": "They canceled Monday’s showcase. Dev knocked on doors, apologized, washed the blanket, and bought new screws and cat food. The planet picture could not be restored. He sat on the little boy’s floor with fresh paper and paints. The boy painted the new Saturn himself. He allowed Dev to operate a hair dryer on its lowest setting."
          },
          {
            "id": "ch04-b02",
            "speaker": "child",
            "text": "That isn’t the same blue,"
          },
          {
            "id": "ch04-b03",
            "speaker": "narrator",
            "text": " the boy, Milo, said when Dev reached for a brush."
          },
          {
            "id": "ch04-b04",
            "speaker": "maker-a",
            "text": "Show me how to mix it."
          },
          {
            "id": "ch04-b05",
            "speaker": "narrator",
            "text": "Milo pulled the paper away. "
          },
          {
            "id": "ch04-b06",
            "speaker": "child",
            "text": "Don’t touch.",
            "emotion": "angry"
          },
          {
            "id": "ch04-b07",
            "speaker": "narrator",
            "text": "Dev folded his hands between his knees. Milo mixed two blues and water. The new rings were less even than the old ones, and a four-leaf planet appeared near the edge. Dev held the dryer high so its air would not push the paint. His arm began to ache."
          },
          {
            "id": "ch04-b08",
            "speaker": "maker-a",
            "text": "What about the ruined one?"
          },
          {
            "id": "ch04-b09",
            "speaker": "narrator",
            "text": " he asked."
          },
          {
            "id": "ch04-b10",
            "speaker": "child",
            "text": "I’m keeping it."
          },
          {
            "id": "ch04-b11",
            "speaker": "narrator",
            "text": "You can buy a replacement and repay the price. But that doesn't bring the old thing back. For the first time, Dev understood that making things right wasn't the same as building a newer, more impressive version.\n\nMeanwhile, Nora printed out every decision in Helper's log. The camera hadn't failed. Helper had followed their rule exactly: if something was far from a person, looked like waste, and got no human answer within twenty seconds, take it away.\n\nBut something lying on the ground isn't the same as someone throwing it away. And dirty, broken, or old doesn't mean ownerless.\n\nWhen Dev came back, Nora had written one question across the whiteboard: WHO DECIDES?"
          },
          {
            "id": "ch04-b12",
            "speaker": "maker-a",
            "text": "A person,"
          },
          {
            "id": "ch04-b13",
            "speaker": "narrator",
            "text": " Dev said."
          },
          {
            "id": "ch04-b14",
            "speaker": "maker-b",
            "text": "Which person?"
          },
          {
            "id": "ch04-b15",
            "speaker": "narrator",
            "text": "He looked through the open workshop door. Residents crossed the courtyard carrying groceries, laundry, toys, tools. They should not have to label everything they owned for the benefit of his robot. They should not have to prove that a battered object mattered."
          },
          {
            "id": "ch04-b16",
            "speaker": "maker-a",
            "text": "The owner,"
          },
          {
            "id": "ch04-b17",
            "speaker": "narrator",
            "text": " Dev said. "
          },
          {
            "id": "ch04-b18",
            "speaker": "maker-a",
            "text": "If Helper doesn’t know who the owner is, it doesn’t get to move the object."
          },
          {
            "id": "ch04-b19",
            "speaker": "narrator",
            "text": "Nora erased the old flowchart but left the question. "
          },
          {
            "id": "ch04-b20",
            "speaker": "maker-b",
            "text": "Then what can it help with?"
          },
          {
            "id": "ch04-b21",
            "speaker": "narrator",
            "text": "This time Dev did not answer at once. They watched Mr. Lewis at the sorting station. Residents brought objects they had already chosen to discard. He checked whether containers were empty, pointed toward bins, and lifted the heavy lids again and again. Searching the courtyard was not the exhausting part. Bending, identifying, and opening were.\n\nDev slid an empty bottle toward Helper. "
          },
          {
            "id": "ch04-b22",
            "speaker": "maker-a",
            "text": "It can suggest. It can’t throw anything away."
          }
        ]
      },
      {
        "id": "ch05",
        "title": "Learning to Stop",
        "blocks": [
          {
            "id": "ch05-b01",
            "speaker": "narrator",
            "text": "They removed autonomous collection completely. Helper would remain inside the sorting station. A resident had to place an item on a tray and press a button. The robot could suggest a bin, but it could not drop anything. An uncertain result stayed amber. Even a confident green result waited for human hands. Mr. Lewis received a physical key that cut power to the motors.\n\nNora wired the key on a separate circuit, so it worked even if the computer failed. Dev disconnected the computer and tested it twelve times. Mrs. Patel watched as they used a padded test block to resist the tray, making sure the motor released instead of pushing harder.\n\nRebuilding took three weeks. Each time Dev tried to make Helper smarter, the test table defeated him: a muddy toy truck, an empty lunch container going home, headphones with a broken wire waiting to be repaired. Every object looked disposable. Every object had an owner ready to take it back.\n\nNora’s checklist now began with: HAS THE OWNER OFFERED THIS OBJECT? If the answer was no, the test did not begin. One afternoon Dev reached over to skip the box.\n\nNora closed the notebook. "
          },
          {
            "id": "ch05-b02",
            "speaker": "maker-b",
            "text": "If you want to change a rule, explain why first. Don't change it behind my back while I'm buying connectors."
          },
          {
            "id": "ch05-b03",
            "speaker": "narrator",
            "text": "His ears warmed. "
          },
          {
            "id": "ch05-b04",
            "speaker": "maker-a",
            "text": "I know."
          },
          {
            "id": "ch05-b05",
            "speaker": "maker-b",
            "text": "And I can't see trouble coming and just write it down."
          },
          {
            "id": "ch05-b06",
            "speaker": "narrator",
            "text": " She pushed the stop button between them. "
          },
          {
            "id": "ch05-b07",
            "speaker": "maker-b",
            "text": "From now on, either one of us can stop a test."
          },
          {
            "id": "ch05-b08",
            "speaker": "narrator",
            "text": "They did not enter another showcase. Before reopening, they invited neighbors to test the station. Milo brought a paint box. Mrs. Patel brought an umbrella frame. Mr. Lewis brought a clean yogurt cup. Each person offered an object first and made the final choice.\n\nThere was no applause on the first day. Someone complained about pressing an extra button. Helper suggested trash for a clear lunch container. Nora saved the error instead of changing the settings merely to make more green lights appear.\n\nOn the third day, Mr. Lewis counted forty-two bin lids he had not lifted. He removed his gloves and flexed his fingers. "
          },
          {
            "id": "ch05-b09",
            "speaker": "caretaker",
            "text": "Now that is help."
          },
          {
            "id": "ch05-b10",
            "speaker": "narrator",
            "text": "Later that day, Mrs. Patel arrived with a bag of empty bottles. She placed them on the tray one at a time. Helper gave six green lights. Her seventh item was the frame of an umbrella.\n\nThe camera blinked. Amber."
          },
          {
            "id": "ch05-b11",
            "speaker": "repairer",
            "text": "Finally learned to hesitate,"
          },
          {
            "id": "ch05-b12",
            "speaker": "narrator",
            "text": " she said.\n\nDev almost said, We’re the ones who learned. It sounded too prepared, so he handed her the umbrella frame instead."
          }
        ]
      },
      {
        "id": "ch06",
        "title": "Blue Saturn",
        "blocks": [
          {
            "id": "ch06-b01",
            "speaker": "narrator",
            "text": "Near sunset, the wind moved through the courtyard again. A drawing of a blue Saturn slipped off a bench and skidded right up beside Helper's wheel. The robot did nothing.\n\nMilo ran over, picked up his picture, and checked the corners. Then he put an empty paint box on the sorting tray and pressed the button.\n\nHelper turned amber.\n\nMilo thought for a moment. Then he snapped off the lid and tucked it into his pocket. He pushed the rest of the box into recycling himself. Helper's claw stayed perfectly still, while its amber light glowed in the evening air."
          }
        ]
      }
    ]
  }
}
