cover_prompt: |-
  A wordless cover scene inside a tiny Edwardian village shop shows Ginger and Pickles cheerfully serving their animal customers. Ginger is a large orange tabby cat in a plain white shop apron, and Pickles is a friendly brown terrier in a green waistcoat, standing behind a wooden counter with jars, folded cloth, candles, and baskets. A rabbit mother, a field mouse, and a red squirrel wait with small empty baskets while a completely blank ledger lies closed on the counter. Pickles passes a paper-wrapped parcel to the rabbit as Ginger watches with patient dignity, making generous service the focal action. Use an eye-level interior view with shelves framing the group, an open door revealing the village lane, and calm uncluttered wall space at the top. Keep all goods and clothing faithful to an English village around 1909, with original animal designs unrelated to modern adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
