audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with dry humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    ginger:
      display_name: Ginger
      tts:
        delivery: gloomy, hungry, and sharply matter-of-fact
        timbre: smooth and dry
        pace: deliberate
        pitch: medium-low
    pickles:
      display_name: Pickles
      tts:
        delivery: courteous and practical, but quick to worry
        timbre: bright and slightly rough
        pace: moderately quick
        pitch: medium
    mr_john_dormouse:
      display_name: Mr. John Dormouse
      tts:
        delivery: sleepy, stubborn, and comfortably unconcerned
        timbre: soft and drowsy
        pace: very slow
        pitch: low
  chapters:
    - id: ch01
      title: The Village Shop
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a village shop with the name "Ginger and Pickles" over its window. It was a tiny shop, just the right size for dolls. Lucinda and Jane Doll-cook always bought their groceries there.
        - id: ch01-b02
          speaker: narrator
          text: The counter was a handy height for rabbits. Ginger and Pickles sold red, spotty pocket handkerchiefs for a penny and three farthings. They sold sugar, snuff, and galoshes, too. In fact, that little shop carried nearly everything. It only seemed to run out of the very things you needed in a hurry, such as bootlaces, hairpins, and mutton chops.
        - id: ch01-b03
          speaker: narrator
          text: Ginger and Pickles kept the shop. Ginger was a yellow tomcat, and Pickles was a terrier. The rabbits were always a little afraid of Pickles. Mice shopped there, too, though they were rather afraid of Ginger. Ginger usually asked Pickles to wait on them. He said the sight of the mice made his mouth water.
        - id: ch01-b04
          speaker: ginger
          text: I simply can't stand watching those mice walk out the door with their little packages.
        - id: ch01-b05
          speaker: pickles
          text: Rats make me feel the same way. But we can't eat our own customers. They'd stop coming here and shop at Tabitha Twitchit's instead.
        - id: ch01-b06
          speaker: ginger
          text: No. They wouldn't go anywhere.
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: Ginger said that gloomily. Tabitha Twitchit ran the only other shop in the village, and she never gave credit. Ginger and Pickles gave as much credit as anyone wanted.
        - id: ch01-b08
          speaker: narrator
          text: Credit worked like this. A customer would buy a bar of soap, but instead of taking out a purse and paying, she would promise to pay another day.
        - id: ch01-b09
          speaker: pickles
          text: Certainly, madam.
        - id: ch01-b10
          speaker: narrator
          text: Pickles would bow low, and the purchase would go into a book. Customers came back again and again and bought enormous amounts, even though they feared Ginger and Pickles. But no money ever went into the till.
        - id: ch01-b11
          speaker: narrator
          text: Crowds filled the shop every day, especially for toffee. Still, no one paid so much as a penny for peppermints. Their sales were ten times greater than Tabitha Twitchit's, yet there was never any money.
    - id: ch02
      title: Bills, Books, and a Policeman
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: With no money coming in, Ginger and Pickles had to eat food from their own shelves. Pickles ate biscuits, while Ginger ate a dried haddock. They had their meal by candlelight after closing the shop.
        - id: ch02-b02
          speaker: narrator
          text: January first arrived, and there was still no money. Pickles could not afford a dog license.
        - id: ch02-b03
          speaker: pickles
          text: This is awful. I'm afraid of the police.
          emotion: fearful
        - id: ch02-b04
          speaker: ginger
          text: That's your fault for being a terrier. I don't need a license, and neither does Kep, the collie.
        - id: ch02-b05
          speaker: pickles
          text: It makes me terribly uneasy. They may summon me to court. I even tried to get a license on credit at the post office, but it was no use. The place was full of policemen, and I passed one on my way home.
          emotion: fearful
        - id: ch02-b06
          speaker: pickles
          text: Ginger, let's send Samuel Whiskers his bill again. He owes twenty-two shillings and ninepence for bacon.
        - id: ch02-b07
          speaker: ginger
          text: I don't believe he means to pay us at all.
        - id: ch02-b08
          speaker: pickles
          text: And I'm certain Anna Maria slips things into her pockets. What happened to all the cream crackers?
        - id: ch02-b09
          speaker: ginger
          text: You ate them.
        - id: ch02-b10
          speaker: narrator
          text: Ginger and Pickles went into the back parlor to do their accounts. They added sum after sum after sum.
        - id: ch02-b11
          speaker: pickles
          text: Samuel Whiskers has a bill as long as his tail. Since October, he's taken an ounce and three quarters of snuff.
        - id: ch02-b12
          speaker: ginger
          text: What's the total for seven pounds of butter at one shilling and threepence, a stick of sealing wax, and four matches?
        - id: ch02-b13
          speaker: ginger
          text: Send everybody their bills again, and put "with compliments" on them.
        - id: ch02-b14
          speaker: narrator
          text: After a while, they heard a sound in the shop, as though something had been pushed through the door. They came out of the parlor. An envelope lay on the counter, and a policeman stood there writing in a notebook.
        - id: ch02-b15
          speaker: narrator
          text: Pickles nearly had a fit. He barked and barked, making one little rush after another.
        - id: ch02-b16
          speaker: ginger
          text: Bite him, Pickles! Go on, bite him! He's nothing but a German doll!
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: Ginger sputtered those words from behind a sugar barrel. The policeman kept writing. Twice he put his pencil into his mouth, and once he dipped it into the treacle. Pickles barked until he was hoarse, but the policeman paid no attention. His eyes were beads, and stitches held his helmet in place.
        - id: ch02-b18
          speaker: narrator
          text: At last, Pickles made one final rush and discovered that the shop was empty. The policeman had vanished. The envelope, however, was still there.
        - id: ch02-b19
          speaker: pickles
          text: Has he gone to bring back a real policeman? I'm afraid this is a summons.
          emotion: fearful
        - id: ch02-b20
          speaker: ginger
          text: No. I've opened it. It's the rates and taxes. Three pounds, nineteen shillings, and eleven pence three farthings.
        - id: ch02-b21
          speaker: pickles
          text: That's the last straw. Let's shut the shop.
    - id: ch03
      title: After the Shop Closed
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Ginger and Pickles put up the shutters and left. They did not move away from the neighborhood, though some people wished they had gone farther. Ginger now lives in the rabbit warren. I don't know what work he does, but he looks plump and comfortable. Pickles is a gamekeeper these days.
        - id: ch03-b02
          speaker: narrator
          text: The closed shop caused everyone a great deal of trouble. Tabitha Twitchit immediately added a halfpenny to every price, and she still refused to give credit.
        - id: ch03-b03
          speaker: narrator
          text: Of course, tradesmen came around with carts. There was the butcher, the fish seller, and Timothy Baker. But no one can live on currant buns, sponge cake, and butter buns. Not even when Timothy's sponge cake is very good.
        - id: ch03-b04
          speaker: narrator
          text: After a while, Mr. John Dormouse and his daughter began selling peppermints and candles. They did not carry self-fitting size-six clothes, and five mice had to work together to carry a single seven-inch candle.
        - id: ch03-b05
          speaker: narrator
          text: Worse still, their candles did very peculiar things in warm weather. Customers brought back the melted ends and complained, but Miss Dormouse would not take them back.
        - id: ch03-b06
          speaker: narrator
          text: When customers complained to Mr. John Dormouse, he stayed tucked up in bed. He had only one answer.
        - id: ch03-b07
          speaker: mr_john_dormouse
          text: Very snug.
        - id: ch03-b08
          speaker: narrator
          text: That is no way to run a store.
    - id: ch04
      title: Henny's Opening Sale
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: So everyone was delighted when Sally Henny Penny put out a printed poster. She was going to open the shop again. The poster announced, "Henny's Opening Sale! A grand cooperative jumble! Penny's penny prices! Come buy, come try, come buy!"
        - id: ch04-b02
          speaker: narrator
          text: It truly was a most tempting poster. On opening day, customers rushed in. The shop was packed, and crowds of mice climbed all over the biscuit canisters.
        - id: ch04-b03
          speaker: narrator
          text: Sally Henny Penny gets rather flustered when she counts out change, and she insists that everyone pay cash. Still, she is quite harmless, and she has stocked a remarkable collection of bargains.
        - id: ch04-b04
          speaker: narrator
          text: There is something to please everybody.
