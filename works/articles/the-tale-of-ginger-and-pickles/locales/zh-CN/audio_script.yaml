audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带一本正经的幽默
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    ginger:
      display_name: 金吉尔
      tts:
        delivery: 慢条斯理，偶尔阴沉地挖苦
        timbre: 圆润慵懒
        pace: 从容
        pitch: 中低音
    pickles:
      display_name: 皮克尔斯
      tts:
        delivery: 老实直率，紧张时急促慌乱
        timbre: 清晰而略显粗哑
        pace: 中速
        pitch: 中音
    john_dormouse:
      display_name: 约翰·睡鼠先生
      tts:
        delivery: 困倦懒散，对抱怨毫不在意
        timbre: 轻软含混
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 小小的村庄商店
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个村子里开着一家小店，橱窗上方写着“金吉尔和皮克尔斯”。店铺小得正适合玩偶们。露辛达和玩偶厨娘简，总来这里买杂货。柜台的高度也正适合兔子。店里卖带红点的手帕，一条一便士三法辛，还卖糖、鼻烟和套鞋。
        - id: ch01-b02
          speaker: narrator
          text: 别看店小，东西几乎样样齐全。只是你急需的鞋带、发卡和羊排，这里偏偏没有。店主人就是金吉尔和皮克尔斯。金吉尔是只黄毛公猫，皮克尔斯是只㹴犬。兔子们总有点怕皮克尔斯，老鼠顾客却怕金吉尔。
        - id: ch01-b03
          speaker: narrator
          text: 老鼠一进门，金吉尔通常就请皮克尔斯去招呼。他说，看见它们，自己就要流口水。
        - id: ch01-b04
          speaker: ginger
          text: 我真受不了。它们提着小包裹走出门，我只能眼睁睁地看着。
        - id: ch01-b05
          speaker: pickles
          text: 我见到耗子也是这样。可不能吃自家的顾客呀，不然它们就不来这儿，改去塔比莎·特威奇特的店了。
        - id: ch01-b06
          speaker: ginger
          text: 那可不对。被吃掉以后，它们哪儿也去不了。
        - id: ch01-b07
          speaker: narrator
          text: 金吉尔说这话时，神情阴沉沉的。塔比莎开着村里唯一的另一家店，她从来不让顾客赊账。金吉尔和皮克尔斯却不一样，想赊多少都行。
    - id: ch02
      title: 生意兴隆，钱箱空空
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 什么叫赊账呢？顾客拿了一块肥皂，不掏钱袋，只说以后再付。皮克尔斯便深深鞠上一躬。
        - id: ch02-b02
          speaker: pickles
          text: 乐意效劳，太太。
        - id: ch02-b03
          speaker: narrator
          text: 接着，皮克尔斯就把这笔账记进本子里。顾客虽然怕两位店主，还是一趟接一趟地来，每回都买一大堆。可那个叫作“钱箱”的东西里，连一文钱也没有。
        - id: ch02-b04
          speaker: narrator
          text: 每天，顾客们成群结队地进店，买走许多东西。买太妃糖的人尤其多，却没有谁付过哪怕一便士的薄荷糖钱。销量倒大得惊人，足足是塔比莎那家店的十倍。
        - id: ch02-b05
          speaker: narrator
          text: 店里总是没钱，两位店主只好吃自己的货。皮克尔斯吃饼干，金吉尔吃晒干的黑线鳕。每天打烊以后，他们就在烛光下吃这些东西。
        - id: ch02-b06
          speaker: narrator
          text: 到了一月一日，钱还是没有，钱箱依旧空空的。皮克尔斯连养狗执照也买不起了。
        - id: ch02-b07
          speaker: pickles
          text: 这可太难受了。我怕警察。
          emotion: fearful
        - id: ch02-b08
          speaker: ginger
          text: 谁让你偏偏是只㹴犬？这得怪你自己。我不用执照，柯利犬凯普也不用。
        - id: ch02-b09
          speaker: pickles
          text: 天天这么提心吊胆，真不好受。我恐怕会收到传票。我去邮局问过，想赊一张执照，可他们不肯。那里到处都是警察，我回家时还碰见一个。
          emotion: fearful
        - id: ch02-b10
          speaker: pickles
          text: 金吉尔，再给塞缪尔·惠斯克斯寄一次账单吧。他买熏肉还欠着二十二先令九便士。
        - id: ch02-b11
          speaker: ginger
          text: 我看他根本就不打算还钱。
        - id: ch02-b12
          speaker: pickles
          text: 安娜·玛丽亚肯定还偷偷往口袋里塞东西。那些奶油薄脆饼都去哪儿了？
        - id: ch02-b13
          speaker: ginger
          text: 是你自己吃掉的。
    - id: ch03
      title: 柜台上的警察
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两位店主退进后面的小客厅，开始算账。他们把一笔又一笔数目加起来，加了一遍，又加一遍，怎么也算不完。
        - id: ch03-b02
          speaker: pickles
          text: 塞缪尔·惠斯克斯欠的账，都快跟他的尾巴一样长啦。从十月份起，他已经拿走了一又四分之三盎司鼻烟。
        - id: ch03-b03
          speaker: pickles
          text: 七磅黄油，每磅一先令三便士，再加一根封蜡和四根火柴，到底是多少钱？
        - id: ch03-b04
          speaker: ginger
          text: 把所有人的账单再寄一次，别忘了写上“谨致问候”。
        - id: ch03-b05
          speaker: narrator
          text: 过了一会儿，店里传来响动，好像有什么东西从门口被塞了进来。他们赶紧出去，只见柜台上放着一只信封，旁边还有一名警察，正往笔记本上写字。
        - id: ch03-b06
          speaker: narrator
          text: 皮克尔斯差点吓得犯了病。他不停地叫，一次又一次扑过去。金吉尔却躲到了糖桶后面。
        - id: ch03-b07
          speaker: ginger
          text: 咬他，皮克尔斯！快咬他！他只是个德国玩偶！
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: 警察根本不理他们，只顾继续写。他两次把铅笔放进嘴里，还把笔往糖浆里蘸了一回。皮克尔斯叫得嗓子都哑了，警察还是毫无反应。原来，他长着珠子做的眼睛，头盔也是一针一线缝在头上的。
        - id: ch03-b09
          speaker: narrator
          text: 皮克尔斯最后又扑了一次。等他回过神来，店里已经空空荡荡，警察不见了，只有那只信封还在。
        - id: ch03-b10
          speaker: pickles
          text: 他会不会去找一个真正的活警察了？我怕信封里装的是传票。
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 金吉尔已经拆开了信封。
        - id: ch03-b12
          speaker: ginger
          text: 不是传票，是地方税和捐税。三英镑十九先令十一又四分之三便士。
        - id: ch03-b13
          speaker: pickles
          text: 这下真的撑不住了。我们关店吧。
    - id: ch04
      title: 店铺关门以后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们钉上护窗板，离开了店铺。不过两位谁也没搬出这一带。有些人其实巴不得他们走得更远些。
        - id: ch04-b02
          speaker: narrator
          text: 金吉尔住进了兔子洞。我不知道他靠什么过日子，只知道他看上去肥肥胖胖，过得挺舒坦。皮克尔斯呢，如今当上了猎场看守。
        - id: ch04-b03
          speaker: narrator
          text: 可是小店一关，村里人就非常不方便。塔比莎立刻把每样东西都涨了半便士，照旧不许赊账。当然，肉贩、鱼贩和蒂莫西·贝克还会赶着送货车来。
        - id: ch04-b04
          speaker: narrator
          text: 但人不能只靠“籽儿卷”、海绵蛋糕和黄油面包过日子。就算蒂莫西做的海绵蛋糕那么好吃，也不行。
        - id: ch04-b05
          speaker: narrator
          text: 后来，约翰·睡鼠先生和女儿卖起了薄荷糖和蜡烛。可他们没有“自动合脚六号鞋”。况且，一根七英寸长的蜡烛，要五只老鼠才能抬动。
        - id: ch04-b06
          speaker: narrator
          text: 更麻烦的是，那些蜡烛一遇上暖和天气，就会变得很古怪。顾客拿着剩下的蜡烛头回来抱怨，睡鼠小姐却不肯退货。
        - id: ch04-b07
          speaker: narrator
          text: 大家只好去找约翰·睡鼠先生。他总躺在床上，翻来覆去只有一句话。
        - id: ch04-b08
          speaker: john_dormouse
          text: 我躺在这里，舒服得很。
        - id: ch04-b09
          speaker: narrator
          text: 除了这句话，他什么也不肯说。可做零售生意，哪能这样呢？
    - id: ch05
      title: 母鸡店重新开张
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 所以，莎莉·母鸡佩妮发出一张印好的告示，说她要让这家店重新开张。大家一看，全都高兴起来。告示上写着，“母鸡店开张大减价！合作经营大杂烩！佩妮小店便士价！快来买，快来试，快来买！”
        - id: ch05-b02
          speaker: narrator
          text: 这张告示实在太诱人了。开张那天，顾客一拥而入，店里挤得满满当当，就连饼干罐上也聚着一群群老鼠。
        - id: ch05-b03
          speaker: narrator
          text: 莎莉找零钱时很容易慌手慌脚，而且坚持只收现钱。不过她完全不会伤害谁，还进了五花八门、便宜得出奇的一大批货。
        - id: ch05-b04
          speaker: narrator
          text: 这一次，每个人都能找到自己中意的东西。
