audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 冷静而有画面感，克制地保留疑问, timbre: 温暖清晰的成年声音, pace: 舒缓而有张力, pitch: 中}
    emile:
      display_name: 埃米尔
      tts: {delivery: 认真、敏感，犹豫时略收紧, timbre: 清亮的青年声音, pace: 中等，发现线索时稍快, pitch: 中高}
    depauw:
      display_name: 德波
      tts: {delivery: 务实直接，偶有干燥幽默, timbre: 厚实略沙的中年声音, pace: 稳健, pitch: 中低}
    dollo:
      display_name: 多洛
      tts: {delivery: 专注、精确，不夸张, timbre: 清楚克制的青年声音, pace: 中等偏慢, pitch: 中}
    miner:
      display_name: 矿工朱尔
      tts: {delivery: 警醒而坦率, timbre: 粗粝有力, pace: 简短利落, pitch: 中低}
    visitor:
      display_name: 参观者
      tts: {delivery: 好奇且笃定, timbre: 普通成年声音, pace: 中等, pitch: 中}
    instructor:
      display_name: 老师
      tts: {delivery: 简短赞许, timbre: 柔和成年声音, pace: 中等, pitch: 中}
    boy:
      display_name: 男孩
      tts: {delivery: 先轻率后认真, timbre: 明亮童声, pace: 稍快, pitch: 高}
  chapters:
    - id: ch01
      title: 电报
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            1878年4月，布鲁塞尔下着雨。皇家自然史博物馆门前的石路，被雨水洗得发亮。

            十九岁的埃米尔正在给洞熊的脚趾编号。楼梯上忽然传来急促的靴声。德波先生走到桌前，把一张还沾着雨的电报按了下去。
        - id: ch01-b02
          speaker: depauw
          text: 贝尼沙尔煤矿，三百二十二米深。发现了大批骨头。矿里有黄铁矿，骨头一见空气就可能坏。我得去现场。
        - id: ch01-b03
          speaker: narrator
          text: |-
            他念得很慢，生怕漏掉一个词。

            埃米尔看向陈列柜。里面那颗禽龙牙的模型，边缘像磨钝的叶片。五十多年前，英国医生兼地质学家吉迪恩·曼特尔从这样的牙齿和少量骨头开始研究。1825年，他发表了禽龙，名字的意思是“鬣蜥的牙”。

            旁边的复原图很有名。图里的禽龙像一头巨大的犀牛，鼻尖长着角。埃米尔刚进博物馆时，临摹的第一幅作品就是它。他把线画得又黑又稳，老师还夸他：
        - id: ch01-b04
          speaker: instructor
          text: 画得像你亲眼见过一样。
        - id: ch01-b05
          speaker: emile
          text: 我也去。
        - id: ch01-b06
          speaker: narrator
          text: 德波看看他干净的袖口。
        - id: ch01-b07
          speaker: depauw
          text: 矿井不是画室。
        - id: ch01-b08
          speaker: emile
          text: 所以我才该去。
        - id: ch01-b09
          speaker: narrator
          text: |-
            德波没答应，只把洞熊趾骨推回他面前。

            第二天清晨，运石膏、木板和麻布的车旁，却多了一盏给埃米尔的矿灯。
    - id: ch02
      title: 地下的队伍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            升降笼沉进黑暗，埃米尔这才知道三百多米有多深。井壁的水光一层层闪过，头顶的白昼缩成硬币，最后连硬币也合上了。煤尘钻进牙缝，远处的木梁发出湿冷的呻吟。

            带路的矿工叫朱尔。他举起灯，照出黏土里一排暗褐色的骨节。
        - id: ch02-b02
          speaker: miner
          text: 最先发现的是这些。不是一根，也不是乱成一堆。它们倒下以后，还像在排队。
        - id: ch02-b03
          speaker: narrator
          text: |-
            德波蹲下来，没有碰骨头，只把灯沿着轮廓慢慢移动。肋骨、椎骨、骨盆和后肢，许多部分还在原位。几块散骨能让人想出许多样子，可一副没有散开的骨架，会让一些想法站不住。

            埃米尔想起鼻角，心里像塞进一块煤。他画下黏土里的前肢，又重画一遍。第一遍动笔时，他还是不由得给鼻尖留了地方。
        - id: ch02-b04
          speaker: miner
          text: 你画的是眼前的骨头，还是柜子里的禽龙？
        - id: ch02-b05
          speaker: narrator
          text: 埃米尔把橡皮按在纸上。
        - id: ch02-b06
          speaker: emile
          text: 眼前的。
        - id: ch02-b07
          speaker: narrator
          text: |-
            巨骨不能整件拖出矿井。德波让人连着黏土把骨架分块，再用湿纸、麻布和石膏包好，装进木箱。骨头里的黄铁矿闪着金光，却会在空气和潮气中让骨头开裂。每清出一处，他们都得赶紧记下位置和方向。

            一天傍晚，顶板突然掉下碎屑。朱尔扑灭近处的灯，叫大家退到木梁后。尘土停了，德波仍坚持先加固通道。埃米尔盯着半露的手骨，急得手心发痒。
        - id: ch02-b08
          speaker: emile
          text: 再等一天，它可能就裂了。
          emotion: fearful
        - id: ch02-b09
          speaker: depauw
          text: 再抢一步，人就可能被埋。骨头已经等了一亿多年，不用你拿命证明勤快。
        - id: ch02-b10
          speaker: narrator
          text: |-
            第二天，支撑加好了，他们才继续。那只手旁边露出一枚粗大的尖骨。埃米尔心头一跳，它跟旧图上的鼻角实在太像。

            可它就在腕骨前面。
    - id: ch03
      title: 两张图
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            化石运回布鲁塞尔，前后用了好几季。工作间堆满编号木箱，湿黏土、胶和石膏混出的气味怎么也洗不掉。埃米尔拿矿下速写逐块核对标本。号码只要抄错，本来相邻的骨头就可能永远分开。

            有一回，两只箱盖竟写着同一个号码。搬运工催他先挑一箱，免得挡路。埃米尔却一箱也没动。他翻了半天方格图，终于从一条被煤水晕开的铅笔线认出，一箱来自左前肢，另一箱来自右前肢。

            德波没有夸他，只叫他把备用标签全查一遍。那晚，埃米尔抄到手腕发僵。他第一次明白，谨慎未必像发现那么耀眼。它常常只是阻止一件错事发生。

            他把尖骨图钉上墙，旁边就是旧鼻角图。两幅图越看越不像答案，倒像两个互相看着的问号。一位参观者路过，开口问：
        - id: ch03-b02
          speaker: visitor
          text: 新发现能证明它真有这只角了吧？
        - id: ch03-b03
          speaker: emile
          text: 还不能这么说，我们还没清理完。
        - id: ch03-b04
          speaker: visitor
          text: 可曼特尔不是已经画出来了吗？
        - id: ch03-b05
          speaker: emile
          text: 曼特尔只是提出过这种解释。
        - id: ch03-b06
          speaker: narrator
          text: |-
            埃米尔听见自己把“证明”换成了“提出”。声音只差一点，意思却差得很远。

            他查过曼特尔的论文和图版。1825年，曼特尔根据牙齿判断，这是一种巨大的植食性爬行动物。后来有了更多骨头，他也不断修改想象中的模样。可那枚孤零零的尖骨并没有说明书。把它放在鼻子上，只是有限材料支持的一种猜法，并非亲眼所见。

            埃米尔在工作簿上写下“尖骨——位置未定”。字起初很小，他又描了一遍。

            箱子越开越多，问题反倒更清楚。前两具骨架的头骨附近都没有合适的连接处，尖骨却总出现在前肢旁，有时左右各一枚。埃米尔按出土位置摆好三只手。中间三指粗壮，最外一指细长，尖骨正好占住剩下的位置。

            他没有按下去。形状相似，会诱使人把骨头摆到自己希望的地方。只有连接面，才能说明它是否合适。
        - id: ch03-b07
          speaker: emile
          text: 请德波先生过来。
    - id: ch04
      title: 不肯站稳的骨架
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            到了1882年，最完整的标本准备装架。普通房间放不下，工作搬进了高大的圣乔治礼拜堂。脚手架直搭到拱顶，绳子从梁上垂下，一节节骨头悬在空中，像一支还没决定姿势的队伍。

            年轻的路易·多洛来到博物馆。他常把相邻的骨头分开，换个角度再合上。要是一次拼得太顺，他反而多查一遍。德波想着怎样让脆弱的化石安全承重，多洛想着整副身体怎样说得通。埃米尔在两人之间递工具、画连接面，还要听他们同时喊自己的名字。

            外面的人等着看威风的新怪兽，报纸也爱写“巨兽复活”。礼拜堂里却全是慢活。量关节，退几步看重心，再把绳子缩短一点。埃米尔渐渐发现，复原图真正改变时没有号角，只有木架轻响，还有一句“再比一具”。

            旧图把禽龙画成四脚着地的沉重大兽。贝尼沙尔的后肢、骨盆和脊柱，却要求他们重想姿势。多洛当时主张让它主要靠后肢站立，并拿大型走禽比较。后来的人还会继续修正。可在1882年的礼拜堂里，他们只能回答当时证据允许的问题。

            最难办的还是手。一个下午，埃米尔把尖骨底面贴近第一指。两边的弧度顺着合拢，像一扇总关不严的门，终于进了门框。德波托住腕部。
        - id: ch04-b02
          speaker: depauw
          text: 别用力。
        - id: ch04-b03
          speaker: emile
          text: 我没用力。
        - id: ch04-b04
          speaker: depauw
          text: 你连呼吸都在用力。
        - id: ch04-b05
          speaker: narrator
          text: |-
            多洛比较了另一只手，又要来第二具标本的记录。尖骨左右成对，头骨上没有接点，手部第一指却反复出现。三条线索合在一起，旧鼻角失去了位置。

            埃米尔没有马上高兴。他看见墙边那幅保存多年的临摹。墨线依然又黑又稳。尖骨移到手上，那张图就错了，夸过它的人也会知道。
        - id: ch04-b06
          speaker: emile
          text: 我们能不能先装别的部分？
        - id: ch04-b07
          speaker: depauw
          text: 骨头会等，你的记录也会等。可它们不会替你写结论。
    - id: ch05
      title: 擦掉鼻角
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            那天夜里，礼拜堂只亮着一盏工作灯。埃米尔摊开旧图，橡皮停在禽龙鼻尖。他想起矿下没有散开的椎骨，也想起第一次画前肢时偷偷留下的空白。错误不一定出自恶意。它有时从一块孤单的证据旁长出来，再被一条漂亮的墨线越养越大。

            他没有毁掉旧图，而是另铺新纸。第一幅只画孤立尖骨，不替它安排位置。第二幅画它在三具骨架里都靠近手。第三幅画左右手的对应和连接面。最后一幅才是新的复原，尖骨成了第一指，也就是拇指。

            第二天，他把四幅图交给多洛。
        - id: ch05-b02
          speaker: emile
          text: 我以前把答案画在证据前面了。
        - id: ch05-b03
          speaker: dollo
          text: 别擦，留下它。
        - id: ch05-b04
          speaker: emile
          text: 错误也要留下？
        - id: ch05-b05
          speaker: dollo
          text: 要留下我们为什么会错，也留下后来为什么改。不然，别人会以为正确答案一直就在桌上。
        - id: ch05-b06
          speaker: narrator
          text: |-
            德波拿来另一只手的石膏托。他们把骨头逐块放妥。尖刺从两只手的拇指位置向外伸，鼻骨上没有它的座位。至于它用来抵御捕食者、争斗，还是处理植物，只看形状还不能确定。埃米尔在说明稿上写下“用途尚不确定”，没有添上更勇猛、更好听的结局。

            公开装架前，一只托架的绳结突然松滑。腕骨向旁边倾去，埃米尔本能地伸手，德波却先用肩膀顶住托板。
        - id: ch05-b07
          speaker: depauw
          text: 垫块！
        - id: ch05-b08
          speaker: narrator
          text: |-
            埃米尔没有抓化石。他踢紧木楔，托住石膏底座，多洛收短上方的绳索。尖骨在三个人中间轻轻晃了一下，终于停稳。

            埃米尔退开时，才发现掌心全是汗。德波喘着气说：
        - id: ch05-b09
          speaker: depauw
          text: 这次你先保住了位置，没有逞英雄。
        - id: ch05-b10
          speaker: emile
          text: 你说过，骨头等得起。
        - id: ch05-b11
          speaker: depauw
          text: 我说的是人别被埋。不过，你总算听懂了一半。
    - id: ch06
      title: 手上的空位
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            骨架装好了，巨大的禽龙站在礼拜堂里。这个姿势仍只是“最可能的姿势”，不是永远不许再改的答案。参观者抬头看骨架，也有人走到手边，寻找曾经长在鼻尖上的那块骨头。

            一个男孩看着埃米尔的旧图，笑出了声。
        - id: ch06-b02
          speaker: boy
          text: 他们怎么会把拇指放到鼻子上？
          emotion: happy
        - id: ch06-b03
          speaker: narrator
          text: 埃米尔本想说，因为他们只有零散化石。话到嘴边，他停住了。他领男孩走到第一张新图前，让他先看那枚孤立的尖骨。
        - id: ch06-b04
          speaker: emile
          text: 如果你只找到这一块，你会把它放在哪里？
        - id: ch06-b05
          speaker: narrator
          text: 男孩比了比自己的额头，又比了比手。
        - id: ch06-b06
          speaker: boy
          text: 我不知道。
        - id: ch06-b07
          speaker: emile
          text: 这就是当时最缺的东西。不是聪明，而是别的骨头。
        - id: ch06-b08
          speaker: narrator
          text: |-
            男孩沿着四幅图慢慢走过去，最后举起自己的拇指，对着禽龙手上的尖刺转了转。他没有再笑。

            闭馆以后，夕光从高窗落下，照亮脚手架留下的浅痕。埃米尔收拾桌面，把旧鼻角图放回文件夹，却把那块用过许多次的橡皮留在新图旁边。

            它没有擦掉过去。它只在纸边磨出一个空位，等下一件证据来。
