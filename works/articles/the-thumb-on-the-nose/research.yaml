schema_version: 1
required: true
sources:
  - url: https://royalsocietypublishing.org/doi/10.1098/rstl.1825.0010
    authority: Royal Society, Gideon Mantell's 1825 primary paper
    claims:
      - Gideon Mantell formally described and named Iguanodon in 1825 from fossil teeth and other limited remains from the Tilgate Forest strata.
      - The name means iguana tooth and arose from comparison with living iguana teeth.
  - url: https://www.nhm.ac.uk/discover/the-discovery-of-iguanodon.html
    authority: Natural History Museum, London
    claims:
      - Early Iguanodon evidence was fragmentary, and Mantell interpreted the isolated pointed bone as a horn.
      - The nasal-horn interpretation survived into the Crystal Palace reconstructions of the 1850s.
      - Later, more complete fossils showed that the paired spikes were modified thumbs; their exact function remains uncertain.
  - url: https://www.naturalsciences.be/en/discover-join/discover/the-bernissart-iguanodons-at-a-glance
    authority: Institute of Natural Sciences, Belgium
    claims:
      - About thirty relatively complete Iguanodon skeletons were discovered 322 metres underground at Bernissart in 1878.
      - The museum was notified by telegram on 12 April 1878, and the bones were affected by pyrite.
      - In 1882 Louis De Pauw began assembling a complete specimen under Louis Dollo's direction in the former Saint George chapel, using scaffold and ropes.
  - url: https://www.naturalsciences.be/fr/decouvrir-participer/decouvrir/jalon-en-paleontologie
    authority: Institute of Natural Sciences, Belgium, detailed historical account
    claims:
      - Excavation ran from 1878 to 1881 and recovered roughly thirty skeletons from the Bernissart mine.
      - Contemporary documents support the museum telegram and extraction chronology while some colorful later anecdotes lack documentary support.
  - url: https://www.nature.com/articles/028439a0
    authority: Nature, 1883 contemporary scientific report
    claims:
      - The Bernissart discovery occurred in spring 1878 and involved a large number of bones recognized as Iguanodon.
      - Louis Dollo published scientific notes on the Bernissart dinosaurs in 1882 and 1883.
  - url: https://www.belspo.be/belspo/brain2-be/projects/FinalReports/Iguanodon2_FinRep.pdf
    authority: Belgian Science Policy Office research report
    claims:
      - Complete Bernissart skeletons enabled Dollo to identify the supposed horn as the ungual of the first manual digit, the thumb.
      - Modern biomechanical work treats defensive or combative use as plausible rather than certain.
notes: >
  Emile and the speaking miner are fictional. Their notebook, dropped fossil cradle, conversations, and private choices are invented to dramatize documented work without assigning them historical discoveries. Mantell died in 1852 and therefore appears only through his published work and older reconstructions. The story distinguishes the 1878 discovery and extraction from Dollo's 1882 study and De Pauw's assembly. It avoids the undocumented claim that miners mistook the bones for gold and does not assert a single proven use for the thumb spike.
