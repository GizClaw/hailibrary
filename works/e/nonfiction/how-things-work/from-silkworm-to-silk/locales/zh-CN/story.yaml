        pace: 舒缓，句间停顿清楚
        pitch: 中低音
    maya:
      display_name: 小满
      tts:
        delivery: 细心认真，提问时轻而直接
        timbre: 清亮柔和的童声
        pace: 中慢速
        pitch: 高音
    owen:
      display_name: 大为
      tts:
        delivery: 安静专注，发现变化时有克制的兴奋
        timbre: 圆润厚实的童声
        pace: 中速，带观察时的短停顿
        pitch: 中低音
    silk_worker:
      display_name: 做丝的师傅
      tts:
        delivery: 沉着熟练
        timbre: 略带沙感的稳重成年女声
        pace: 清楚的中速
        pitch: 低音
