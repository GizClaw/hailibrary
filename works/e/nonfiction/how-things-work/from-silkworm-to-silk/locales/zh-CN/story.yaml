schema_version: 2
language: zh-CN
writer: 月芽笺
title: 从蚕到丝
summary: 全班原想养蚕，再用自己的茧抽丝。知道加热会让蛹死去后，大家改用别处的茧，让教室里的蚕蛾自己出来。
chapters:
  - id: ch01
    title: 小卵和桑叶
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 丝绕成白茧
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: 蚕蛾和丝线
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 蚕蜕皮以后，接着做了什么？
    answer: 它们不再吃叶，开始慢慢吐丝。
    page_refs:
      - p04
      - p05
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 大家为什么不给教室里的茧加热？
    answer: 因为加热会让茧里的蛹死去。
    page_refs:
      - p09
      - p10
      - p11
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: 蚕吃什么？
    choices:
      - 新鲜桑叶
      - 干草
      - 花瓣
    answer: 新鲜桑叶。
    page_refs:
      - p03
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 热水怎样帮助做丝的师傅抽丝？
    answer: 热水把细丝外的一层东西煮软。
    page_refs:
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 林老师带来一盘小小的卵。大家想把
            - vocabulary:
                id: silkworm
                text: 蚕
            - text: 养大，用自己的
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 抽丝。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 几天后，小
            - vocabulary:
                id: silkworm
                text: 蚕
            - text: 从卵里爬出。它们会变成
            - vocabulary:
                id: silk-moth
                text: 蚕蛾
            - text: 。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - vocabulary:
                id: mulberry-leaf
                text: 桑叶
            - text: 快被
            - vocabulary:
                id: silkworm
                text: 蚕
            - text: 吃光了。小满又添上新叶。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - vocabulary:
                id: silkworm
                text: 蚕
            - text: 越长越大，还会
            - vocabulary:
                id: molt
                text: 蜕皮
            - text: 。大为收起一片旧皮。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 有一天，
            - vocabulary:
                id: silkworm
                text: 蚕
            - text: 不再吃叶。它们抬头，慢慢吐出细丝。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 细丝绕住蚕，白
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 一点点变厚。
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 里，蚕开始变成
            - vocabulary:
                id: pupa
                text: 蛹
            - text: 。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 大为守着一个
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 。一天，一只白色的
            - vocabulary:
                id: silk-moth
                text: 蚕蛾
            - text: 爬了出来。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 小满问：“这个
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 还能抽出长丝吗？”林老师指着茧口的断丝。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 林老师说：“
            - vocabulary:
                id: silk-moth
                text: 蚕蛾
            - text: 出茧时会弄断长丝。所以人们常先加热茧，可是
            - vocabulary:
                id: pupa
                text: 蛹
            - text: 会死去。”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 小满看着没开的
            - vocabulary:
                id: cocoon
                text: 茧
            - text: ，问：“这些也要加热吗？”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 林老师摇头：“我们改主意了，要等
            - vocabulary:
                id: silk-moth
                text: 蚕蛾
            - text: 出来。”一位做丝的师傅带来别处加热过的
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 放进热水。热水泡软丝外那层黏黏的胶，师傅抽出长丝。教室的
            - vocabulary:
                id: silk-moth
                text: 蚕蛾
            - text: 停在空
            - vocabulary:
                id: cocoon
                text: 茧
            - text: 边。
