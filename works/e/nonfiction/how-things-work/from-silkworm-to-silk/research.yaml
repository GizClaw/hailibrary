notes:
  - The teacher, children, silk worker and classroom events are invented. No real school, exact rearing schedule, cocoon count or survival rate is claimed.
  - The class first plans to reel silk from its own cocoons, then changes that invented classroom plan after learning what heating would do to the pupae.
  - The work distinguishes the class cocoons, whose moths are allowed to emerge, from previously heat-treated demonstration cocoons used for silk reeling.
  - The story says people "usually" or "常" heat cocoons before moths emerge. This avoids claiming that every silk tradition uses unopened cocoons or the same processing route.
  - Boiling water is handled only by the adult silk worker; children observe from a distance in the illustration contract.
  - The page-level explanation uses "sticky coat" and "细丝外的一层东西" for sericin. These are level-appropriate descriptions of the coating around cocoon filament layers.
