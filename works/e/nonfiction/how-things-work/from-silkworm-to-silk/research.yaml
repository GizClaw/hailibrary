  - id: central-silk-board-rearing
    title: Rearing of Mulberry Silkworm
    publisher: Central Silk Board, Government of India
    url: https://silks.csb.gov.in/westkameng/rearing-of-mulberry-silkworm/
    supports: "p02-p05: Newly hatched silkworms are moved to rearing trays, fed tender mulberry leaves and cared for during repeated moults; mature larvae are mounted so they can spin cocoons."
    verified_at: 2026-09-13
