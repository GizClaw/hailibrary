characters:
  - id: narrator
    kind: narrator
    description: A warm observer follows the class through the silkworm life cycle and the silk demonstration.
    voice_identity: clear warm observational adult voice
  - id: ms_lin
    kind: character
    description: The class teacher answers difficult questions honestly and keeps the observation gentle and safe.
    visual_identity: East Asian woman in her thirties, oval face, warm beige skin, straight black hair in a low bun, moss-green cardigan, cream blouse, rust-brown trousers, dark brown flats.
    voice_identity: low mellow reassuring adult voice
  - id: maya
    kind: character
    description: A thoughtful class member who notices what the silk process means for the pupae.
    visual_identity: East Asian girl, seven years old, round face, warm beige skin, chin-length straight black bob with a small yellow leaf-shaped hair clip on her left side, mustard-yellow sweater, forest-green overalls, cream sneakers.
    voice_identity: bright gentle child voice
  - id: owen
    kind: character
    description: A careful class member who saves an old skin and watches for the first moth.
    visual_identity: Black boy, seven years old, deep brown skin, short tight black curls, sky-blue long-sleeve shirt, tan trousers, red canvas shoes.
    voice_identity: rounded curious child voice
  - id: silk_worker
    kind: character
    description: A visiting silk worker demonstrates reeling with cocoons already prepared for silk.
    visual_identity: East Asian woman in her fifties, square face, light tan skin, short salt-and-pepper hair, indigo work jacket, pale gray shirt, charcoal trousers, brown closed-toe shoes, cream heat-safe gloves during the hot-water demonstration.
    voice_identity: steady textured practical adult voice
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Retell the silkworm life cycle from egg to moth.
    - Explain how learning about heated cocoons changes the class's plan.
    - Explain how heat and water help silk strands unwind from prepared cocoons.
  concepts:
    - silkworm life cycle
    - cocoon spinning
    - silk reeling
    - pupae in silk production
rights:
  text: project-original
  artwork: project-generated
