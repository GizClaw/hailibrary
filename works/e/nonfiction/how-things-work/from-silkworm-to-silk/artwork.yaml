schema_version: 1
style: naturalistic-storybook
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Ms. Lin, Maya and Owen gather around a classroom silkworm habitat showing mulberry leaves, white silkworms, closed white cocoons and one pale silk moth, with no labels or written material visible.
  - id: p01
    file: artwork/p01.webp
    scene: Ms. Lin sets a shallow plain cream tray of tiny silkworm eggs on a low classroom observation table while Maya and Owen lean closer without touching.
  - id: p02
    file: artwork/p02.webp
    scene: Newly hatched tiny dark silkworm caterpillars crawl beside pale eggshells on fresh green mulberry leaves as Maya and Owen observe through the open side of the habitat.
  - id: p03
    file: artwork/p03.webp
    scene: Larger white silkworms eat fresh mulberry leaves; Maya adds a plain basket of new leaves to the nearly bare feeding tray.
  - id: p04
    file: artwork/p04.webp
    scene: Owen uses a small plain wooden craft stick to point near a shed silkworm skin while a larger white silkworm rests safely beside it.
  - id: p05
    file: artwork/p05.webp
    scene: Mature white silkworms lift their heads and lay fine pale silk onto twig frames in the classroom habitat while the children watch.
  - id: p06
    file: artwork/p06.webp
    scene: Several complete oval white cocoons hang among twig frames; one nearby silkworm is partly hidden by newly spun silk.
  - id: p07
    file: artwork/p07.webp
    scene: Owen and Maya watch a pale cream domesticated silk moth push through the broken end of one white cocoon in the habitat.
  - id: p08
    file: artwork/p08.webp
    scene: Maya asks Ms. Lin about the opened cocoon while Ms. Lin gently points to the short broken silk fibers around its exit hole.
  - id: p09
    file: artwork/p09.webp
    scene: Ms. Lin answers beside a simple physical display of one intact cocoon and one opened cocoon; the classroom remains calm and no hot-water equipment is present.
  - id: p10
    file: artwork/p10.webp
    scene: Maya looks thoughtfully toward several still-closed class cocoons, with Ms. Lin listening beside her and Owen waiting quietly.
  - id: p11
    file: artwork/p11.webp
    scene: Ms. Lin opens the habitat space for the class moths to emerge while the visiting silk worker arrives carrying a covered plain basket of separate prepared cocoons.
  - id: p12
    file: artwork/p12.webp
    scene: Behind a low safety barrier, the gloved silk worker uses a small steaming metal basin to reel several fine strands from prepared cocoons onto a plain wooden reel; Maya, Owen and Ms. Lin watch from a safe distance while pale moths rest beside opened class cocoons.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  continuity: Ms. Lin wears moss green, cream and rust; Maya has a black bob, yellow leaf clip, mustard sweater and green overalls; Owen has short black curls, a sky-blue shirt, tan trousers and red shoes; the silk worker wears indigo, gray and charcoal with cream gloves for p12. Classroom has warm wood, cream walls, green plants and soft daylight. Silkworms are anatomically plausible Bombyx mori larvae; moths are pale cream and flightless-looking.
