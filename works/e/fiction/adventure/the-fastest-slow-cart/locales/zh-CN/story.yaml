schema_version: 1
language: zh-CN
writer: 江笑
title: 谁的车更快
summary: 米可的小车跑得快，扎拉的大车装得多。到底谁先把货送完，不能只看哪一趟跑得快。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 风趣有劲, timbre: 清晰的成年声音, pace: 中快速, pitch: 中音}}
  miko: {display_name: 米可, tts: {delivery: 爽快自信, timbre: 明亮的少年声音, pace: 快速, pitch: 中高音}}
  zara: {display_name: 扎拉, tts: {delivery: 沉着幽默, timbre: 温暖的少年声音, pace: 中速, pitch: 中音}}
  mr_liu: {display_name: 刘师傅, tts: {delivery: 温和准确, timbre: 有质感的年长声音, pace: 中慢速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: mr_liu, text: 市场开门前，请把这些箱子送过去。}]}
  - {id: p02, illustration: p02, lines: [{speaker: miko, text: 我的红车全城最快。}]}
  - {id: p03, illustration: p03, lines: [{speaker: zara, text: 我的车比赛肯定输，送货倒很少拖到第二趟。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 米可装上两箱，一溜烟冲进小巷。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 扎拉把六个箱子稳稳排上宽车。}]}
  - {id: p06, illustration: p06, lines: [{speaker: miko, text: 我已经回来了！快吧？}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 扎拉慢慢绕过拥挤的水果摊。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 米可已经跑起第二趟，扎拉的大车还没到。}]}
  - {id: p09, illustration: p09, lines: [{speaker: miko, text: 等等，我刚才绑得太急，绳子松了。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 扎拉终于到了，六个箱子仍旧稳稳当当。}]}
  - {id: p11, illustration: p11, lines: [{speaker: miko, text: 我第三趟的箱子呢？}, {speaker: zara, text: 都送到了。}]}
  - {id: p12, illustration: p12, lines: [{speaker: mr_liu, text: 米可每趟跑得快，扎拉却一趟就把活儿干完了。}]}
  - {id: p13, illustration: p13, lines: [{speaker: miko, text: 下次我在前面探路，你的大车跟上，怎么样？}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: 下一批货，两人一前一后送得又快又稳。米可忙着赶路，没空再争第一。}]}
chapters:
  - {id: ch01, title: 两种快, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 一趟能装多少, page_refs: [p06, p07, p08, p09, p10]}
  - {id: ch03, title: 一起送得更快, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: 扎拉一次运几个箱子？, choices: [六个, 两个, 一个], answer: 六个。, page_refs: [p05]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 米可第二次出发后为什么停下？, answer: 他得重新绑好松掉的绳子。, page_refs: [p08, p09]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 扎拉为什么先做完整份活儿？, answer: 她一次就稳稳运走了剩下六个箱子。, page_refs: [p05, p10, p11]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: 米可为什么提议和扎拉一起送货？, answer: 他明白了速度和载货量可以互相帮忙。, page_refs: [p12, p13]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: 后来，米可觉得怎样才算真的“快”？, answer: 不只要看一趟跑多快，还要看能不能尽早把所有货物安全送完。, page_refs: [p06, p11, p12]}
