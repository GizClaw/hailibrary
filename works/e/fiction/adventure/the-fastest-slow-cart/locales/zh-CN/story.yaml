schema_version: 2
language: zh-CN
writer: 月芽笺
title: 最快的慢车
summary: 米科相信小红车跑得快，扎拉相信蓝车装得稳。一个松动的货箱改变了这场比赛，两人也明白，快和稳合在一起才省事。
chapters:
  - id: ch01
    title: 两辆不同的车
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 快和多
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
  - id: ch03
    title: 一起送货
    page_refs:
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 米科开始第二趟后发生了什么？
    answer: 一只货箱松了，他停下重新绑紧。
    page_refs:
      - p08
      - p09
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 扎拉为什么一趟就能运六箱？
    answer: 她的大车很宽，六箱能摆稳。
    page_refs:
      - p03
      - p05
      - p07
      - p10
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: 下一次送货时，两人怎样合作？
    answer: 米科带着车队转弯，扎拉保持货物平稳。
    page_refs:
      - p13
      - p14
  - id: q04
    type: explicit-choice
    speaker: narrator
    prompt: 米科运六箱用了几趟？
    choices:
      - 三趟
      - 一趟
      - 六趟
    answer: 三趟。
    page_refs:
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 刘伯伯指着货箱说：“开市前，把这些都送到。”
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 米科拨了一下小红车的轮子。车轮绕着
            - vocabulary:
                id: axle
                text: 车轴
            - text: 飞快转动。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 扎拉踩踩宽车板，说：“我的蓝车装得多。”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 米科抱上两箱货，拉着小红车冲进市场小路。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 扎拉没有着急。她把六箱货摆成稳稳的一摞。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 米科很快跑回来，原地还剩四箱货。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 扎拉慢慢绕过水果摊。六只货箱都很稳。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 米科又装上两箱，开始跑第二趟。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 一只货箱滑了出来。米科停下，把绳子重新收紧。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 扎拉到了店门口，六箱货仍旧整整齐齐。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 米科跑完第三趟，送来最后两箱。出发的地方终于空了。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 刘伯伯说：“扎拉跑一趟。米科跑三趟。”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 米科对扎拉说：“你的车装得多。”扎拉笑了：“你的车转弯快。”两人把车连在一起。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 下一趟，米科带车灵活转弯。扎拉稳住货物，他们顺利到了。
