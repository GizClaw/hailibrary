schema_version: 1
language: zh-CN
writer: 月芽笺
title: 最快的慢车
summary: 米科的小车跑得快，却要分三次运货。扎拉的大车走得慢，一次能稳稳装六箱。两人发现各自的长处后，决定一起送下一批货。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 有趣明快, timbre: 清楚的成年声音, pace: 中速, pitch: 中音}}
  miko: {display_name: 米科, tts: {delivery: 快速自信, timbre: 明亮的童声, pace: 中快, pitch: 中高音}}
  zara: {display_name: 扎拉, tts: {delivery: 平静幽默, timbre: 稳当的童声, pace: 中速, pitch: 中音}}
  mr_liu: {display_name: 刘伯伯, tts: {delivery: 温暖精确, timbre: 温厚的年长声音, pace: 中慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 刘伯伯指着一大堆货箱。}, {speaker: mr_liu, text: 市场开门前要全部送到。}]}
  - id: p02
    illustration: p02
    lines:
      - {speaker: narrator, text: 米科的红车又小又轻。}
      - speaker: narrator
        content: [{text: 车轮绕着}, {vocabulary: {id: axle, text: 车轴}}, {text: 转得飞快。}]
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 扎拉检查宽宽的蓝车。}, {speaker: zara, text: 它能装下更多货箱。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 米科装上两箱，飞快出发。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 扎拉把六箱货摆得稳稳当当。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 米科很快回来了。}, {speaker: narrator, text: 扎拉的车旁还剩四箱。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 扎拉慢慢绕过水果摊。}, {speaker: narrator, text: 六只货箱一点也没歪。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 米科开始第二趟快跑。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 一只货箱松了，米科只好停下。}, {speaker: narrator, text: 他重新绑紧绳子。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 扎拉带着六箱货平稳到达。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 又跑一趟后，米科送来最后两箱。}, {speaker: narrator, text: 出发地空了。}]}
  - {id: p12, illustration: p12, lines: [{speaker: mr_liu, text: 扎拉一趟运了六箱。}, {speaker: mr_liu, text: 米科三趟运了六箱。}]}
  - {id: p13, illustration: p13, lines: [{speaker: miko, text: 你的车装得多。}, {speaker: zara, text: 你的车转弯快。}, {speaker: narrator, text: 他们把两辆车连起来。}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: 米科带着车队灵活转弯。}, {speaker: narrator, text: 扎拉让货物保持平稳。}, {speaker: narrator, text: 下一批货顺利送到了。}]}
chapters:
  - {id: ch01, title: 两辆不同的车, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 快和多, page_refs: [p06, p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 一起送货, page_refs: [p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 米科开始第二趟后发生了什么？, answer: 一只货箱松了，他停下重新绑紧。, page_refs: [p08, p09]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: 扎拉为什么一趟就能运六箱？, answer: 她的大车很宽，六箱能摆稳。, page_refs: [p03, p05, p07, p10]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: 下一次送货时，两人怎样合作？, answer: 米科带着车队转弯，扎拉保持货物平稳。, page_refs: [p13, p14]}
  - {id: q04, type: explicit-choice, speaker: narrator, prompt: 米科运六箱用了几趟？, choices: [三趟, 一趟, 六趟], answer: 三趟。, page_refs: [p12]}
