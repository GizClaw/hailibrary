schema_version: 1
language: en-US
writer: river-wink
title: The Fastest Slow Cart
summary: Miko's cart wins every dash, but Zara's slower cart finishes the whole job first.
cast:
  narrator: {display_name: Narrator, tts: {delivery: witty and energetic, timbre: clear adult voice, pace: medium-fast, pitch: medium}}
  miko: {display_name: Miko, tts: {delivery: quick and bold, timbre: bright young voice, pace: fast, pitch: medium-high}}
  zara: {display_name: Zara, tts: {delivery: calm and humorous, timbre: warm young voice, pace: medium, pitch: medium}}
  mr_liu: {display_name: Mr. Liu, tts: {delivery: warm and exact, timbre: textured older voice, pace: medium-slow, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: mr_liu, text: "Please move these crates before the market opens."}]}
  - {id: p02, illustration: p02, lines: [{speaker: miko, text: "My red cart is the fastest in town."}]}
  - {id: p03, illustration: p03, lines: [{speaker: zara, text: "Mine has never won a race. It does enjoy finishing jobs."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Miko loaded two crates and flew down the lane."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Zara fitted six crates onto her broad cart."}]}
  - {id: p06, illustration: p06, lines: [{speaker: miko, text: "Back already! I told you it was fast."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Zara rolled carefully around the crowded fruit stall."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Miko began another quick trip. Zara was still on her first."}]}
  - {id: p09, illustration: p09, lines: [{speaker: miko, text: "Wait. My hurried rope has come loose."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Zara reached the shop with every crate steady."}]}
  - {id: p11, illustration: p11, lines: [{speaker: miko, text: "Where are the crates for my third trip?"}, {speaker: zara, text: "Already here."}]}
  - {id: p12, illustration: p12, lines: [{speaker: mr_liu, text: "Your cart was faster, Miko. Zara finished the job first."}]}
  - {id: p13, illustration: p13, lines: [{speaker: miko, text: "Then let my speed help your load."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "On the next delivery, Miko pulled while Zara carried the load. Neither cart had to boast."}]}
chapters:
  - {id: ch01, title: Two Kinds of Fast, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Trips and Loads, page_refs: [p06, p07, p08, p09, p10]}
  - {id: ch03, title: Moving the Work, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: "How many crates does Zara carry?", choices: [Six, Two, One], answer: "Six.", page_refs: [p05]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What delays Miko after his second start?", answer: "He must retie a loose load.", page_refs: [p08, p09]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why does Zara finish the whole job first?", answer: "Her cart carries all six remaining crates in one stable load.", page_refs: [p05, p10, p11]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why does Miko suggest joining the carts?", answer: "He now understands that speed and carrying capacity can work together.", page_refs: [p12, p13]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: "What changes Miko's idea of fast?", answer: "He learns that finishing the total job matters more than winning one short trip.", page_refs: [p06, p11, p12]}
