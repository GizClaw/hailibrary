schema_version: 1
language: en-US
writer: silver-bell
title: The Fastest Slow Cart
summary: Miko's small cart moves fast but needs three trips. Zara's larger cart moves slowly and carries six crates at once. They combine their strengths for the next delivery.
cast:
  narrator: {display_name: Narrator, tts: {delivery: energetic and clear, timbre: lively adult voice, pace: medium, pitch: medium}}
  miko: {display_name: Miko, tts: {delivery: quick and bold, timbre: bright young voice, pace: medium-fast, pitch: medium-high}}
  zara: {display_name: Zara, tts: {delivery: calm and humorous, timbre: steady young voice, pace: medium, pitch: medium}}
  mr_liu: {display_name: Mr. Liu, tts: {delivery: warm and exact, timbre: mellow older voice, pace: medium-slow, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Mr. Liu shows two couriers a tall crate pile."}, {speaker: mr_liu, text: "Please deliver everything before the market opens."}]}
  - id: p02
    illustration: p02
    lines:
      - {speaker: narrator, text: "Miko's red cart is small and light."}
      - speaker: narrator
        content: [{text: "Its wheels spin freely on the "}, {vocabulary: {id: axle, text: axle}}, {text: "."}]
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Zara checks her broad blue cart."}, {speaker: zara, text: "It can hold a larger load."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Miko loads two crates and races away."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Zara arranges six crates in one stable stack."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Miko returns quickly."}, {speaker: narrator, text: "Four crates still wait beside Zara's load."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Zara moves slowly around a fruit stall."}, {speaker: narrator, text: "Her six crates stay steady."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Miko begins a second fast trip."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "A loose crate makes Miko stop."}, {speaker: narrator, text: "He ties the load again."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Zara arrives with all six crates in place."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "After one more trip, Miko brings the last two."}, {speaker: narrator, text: "The starting pile is empty."}]}
  - {id: p12, illustration: p12, lines: [{speaker: mr_liu, text: "Zara carried six in one trip."}, {speaker: mr_liu, text: "Miko carried six in three trips."}]}
  - {id: p13, illustration: p13, lines: [{speaker: miko, text: "Your cart carries more."}, {speaker: zara, text: "Your cart turns quickly."}, {speaker: narrator, text: "They link the carts."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Miko guides the turns."}, {speaker: narrator, text: "Zara keeps the load steady."}, {speaker: narrator, text: "The next delivery moves smoothly."}]}
chapters:
  - {id: ch01, title: Two Different Carts, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Speed and Load, page_refs: [p06, p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: Better Together, page_refs: [p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: "What happens after Miko starts his second trip?", answer: "He stops to retie a loose crate.", page_refs: [p08, p09]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: "Why does Zara need only one trip for six crates?", answer: "Her broad cart holds one large stable load.", page_refs: [p03, p05, p07, p10]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: "How do Miko and Zara help each other next?", answer: "Miko guides quick turns while Zara steadies the load.", page_refs: [p13, p14]}
  - {id: q04, type: explicit-choice, speaker: narrator, prompt: "How many trips does Miko use for six crates?", choices: [Three, One, Six], answer: "Three.", page_refs: [p12]}
