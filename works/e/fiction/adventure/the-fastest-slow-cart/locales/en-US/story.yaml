schema_version: 2
language: en-US
writer: silver-bell
title: The Fastest Slow Cart
summary: Miko trusts his quick red cart, while Zara trusts her roomy blue one. A loose crate changes the race, and the two couriers discover that speed works best with a steady load.
chapters:
  - id: ch01
    title: Two Different Carts
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: Speed and Load
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
  - id: ch03
    title: Better Together
    page_refs:
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What happens after Miko starts his second trip?
    answer: He stops to retie a loose crate.
    page_refs:
      - p08
      - p09
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why does Zara need only one trip for six crates?
    answer: Her broad cart holds one large stable load.
    page_refs:
      - p03
      - p05
      - p07
      - p10
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: How do Miko and Zara help each other next?
    answer: Miko guides quick turns while Zara steadies the load.
    page_refs:
      - p13
      - p14
  - id: q04
    type: explicit-choice
    speaker: narrator
    prompt: How many trips does Miko use for six crates?
    choices:
      - Three
      - One
      - Six
    answer: Three.
    page_refs:
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Mr. Liu points to a crate pile. “Deliver these before the market opens,” he says.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "Miko spins his red cart's wheel. It turns freely around the "
            - vocabulary:
                id: axle
                text: axle
            - text: .
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Zara tests her broad blue cart. “Mine carries a bigger load,” she says.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Miko grabs two crates and races away.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Zara works slowly. She fits six crates into one firm stack.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Miko returns, but four crates still wait.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Zara rolls around a fruit stall. Her six crates stay steady.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Miko loads two more crates and starts again.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: A loose crate slips. Miko stops and pulls the rope tight again.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Zara arrives with all six crates still stacked.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: Miko's third trip brings the last two crates. The pile is gone.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Mr. Liu says, “Zara took one trip. Miko took three.”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: “Your cart carries more,” Miko tells Zara. “And yours turns quickly,” she replies. They link the carts together.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Next time, Miko guides each turn. Zara steadies the load, and every crate arrives.
