schema_version: 3
language: en-US
writer: silver-bell
title: "The Tomato Case, Part One: Mittens Appears"
summary: Grandpa blames the neighbor's cat, but Maya's tests show that the cat did not steal the tomato.
chapters:
  - {id: ch01, title: One Is Missing, page_refs: [p01, p02, p03]}
  - {id: ch02, title: The Basins Fall, page_refs: [p04, p05, p06, p07, p08]}
  - {id: ch03, title: Not Enough Proof, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "What did Grandpa try first and next?", answer: "Grandpa set up two basins. Flour failed too.", page_refs: [p04, p11]}
  - {id: q02, type: cause-effect, prompt: "Why did Grandpa clear the cat?", answer: "The fence stayed closed, but a green tomato still got bitten.", page_refs: [p12]}
  - {id: q03, type: short-answer, prompt: "What did Grandpa decide at the end?", answer: "Mittens was not the thief.", page_refs: [p12]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "Grandpa saw an empty stem. Salt kept falling into lunch."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "He pointed at Mittens. Maya asked if he saw the cat steal."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "Grandpa had not seen it. Maya wrote only that a tomato was gone."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "Grandpa set up two basins. Strings would drop them near the cat."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "He tested a string. Crash! A basin caught his hat."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "They waited until evening. At last, Mittens came."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "The cat ignored the tomatoes. He watched an old crate."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "Grandpa pulled too soon. The noise sent Mittens away."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "Cat tracks crossed the soil. They stopped far from the vines."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "Grandpa packed up. He would not cross off the cat yet."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "Flour failed too. Rain turned it into wet paste."}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "The fence stayed closed, but a green tomato still got bitten. Grandpa crossed off the cat. Mittens was not the thief."}]}
