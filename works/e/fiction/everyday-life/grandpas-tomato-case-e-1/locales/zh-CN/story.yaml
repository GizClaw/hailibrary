schema_version: 3
language: zh-CN
writer: 月芽笺
title: 番茄疑案（一）：黑耳朵来了
summary: 爷爷认定邻猫偷了番茄，小满却发现脚印没有走到菜架。
chapters:
  - {id: ch01, title: 少了一个, page_refs: [p01, p02, p03]}
  - {id: ch02, title: 盆先响了, page_refs: [p04, p05, p06, p07, p08]}
  - {id: ch03, title: 证据不够, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "爷爷先用了什么办法？后来又用了什么？", answer: "他先用搪瓷盆，后来撒了面粉。", page_refs: [p04, p11]}
  - {id: q02, type: cause-effect, prompt: "小满为什么不说猫偷了番茄？", answer: "因为猫的脚印没有走到菜架。", page_refs: [p09]}
  - {id: q03, type: short-answer, prompt: "最后一页多了什么新线索？", answer: "一个带小牙印的青番茄。", page_refs: [p12]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "爷爷看见空梗，盐却还在往面里落。又少了一个番茄！"}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "爷爷指着墙上的黑耳朵。小满问：“你看见它偷了吗？”"}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "爷爷没有看见。小满拿出本子，只写下番茄少了。"}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "爷爷支起两只盆。他要用绳子抓住猫。"}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "他试着一拉。哐当！盆先扣住了草帽。"}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "他们等到傍晚。黑耳朵终于跳上墙。"}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "猫没有看番茄。它只盯着墙边的旧木箱。"}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "爷爷拉早了。盆一响，猫马上逃走。"}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "地上有猫脚印。可是脚印只走到木箱。"}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "爷爷收起盆。他还不肯划掉猫的名字。"}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "面粉也失败了。雨把它变成了白泥。"}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "围栏没有动，青番茄却被咬了。爷爷开始怀疑自己的答案。"}]}
