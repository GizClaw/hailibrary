schema_version: 2
language: zh-CN
writer: 月芽笺
title: 不肯排队的种子
summary: 卡维的木轮分圆种子又快又准，带绒毛的长种子却把孔堵住了。小君帮他发现，一件工具不必包办所有事情。
chapters:
  - id: ch01
    title: 分类木轮
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 先看形状
    page_refs:
      - p07
      - p08
      - p09
      - p10
  - id: ch03
    title: 两种好办法
    page_refs:
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 木轮卡住后，他们做了什么？
    answer: 比较种子形状，再分成三组。
    page_refs:
      - p06
      - p07
      - p10
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 绒毛种子为什么会卡住木轮？
    answer: 长绒毛横在孔洞上。
    page_refs:
      - p05
      - p06
      - p07
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: 木轮和双手怎样一起工作？
    answer: 木轮分圆种子的大小，小君用手分其他形状。
    page_refs:
      - p11
      - p12
      - p13
  - id: q04
    type: explicit-choice
    speaker: narrator
    prompt: 木轮最适合分哪种种子？
    choices:
      - 圆种子
      - 绒毛种子
      - 带钩种子
    answer: 圆种子。
    page_refs:
      - p03
      - p04
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 长桌上摆着十二罐混合
            - vocabulary:
                id: seed
                text: 种子
            - text: 。卡维要把它们分好。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 他给小君看手摇木轮。三种孔下面摆着三个托盘。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 卡维倒进圆
            - vocabulary:
                id: seed
                text: 种子
            - text: ，得意地摇起把手。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 大、中、小三种种子落进不同的托盘。卡维欢呼：“成功啦！”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 小君拿来长着绒毛尾巴的种子。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 绒毛横在孔洞上。木轮咯噔一下，卡住了。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 小君托起两颗种子，说：“身子窄，尾巴却长。”卡维又看了一遍。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 卡维画新木轮，想给每种形状配个孔。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 图纸很快变成迷宫。小君敲敲旧木轮：“让它做好会做的事吧。”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 他们换了办法，先按形状分成三组。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 卡维只把圆种子倒进木轮，再按大小分开。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 小君用手分另外两组。卡维继续摇木轮。
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 卡维说：“这些形状，你用手就能分。”小君笑道：“圆种子交给木轮更快。”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 夕阳照进来，十二只罐子都分好了。木轮和托盘并排放着。
