schema_version: 1
language: en-US
writer: silver-bell
title: The Seeds That Would Not Queue
summary: Kavi's wheel sorts round seeds by size, but feathery seeds catch in its holes. Kavi and June group seeds by shape, then use the wheel and their hands for different jobs.
cast:
  narrator: {display_name: Narrator, tts: {delivery: crisp and warm, timbre: clear adult voice, pace: medium, pitch: medium}}
  kavi: {display_name: Kavi, tts: {delivery: confident then thoughtful, timbre: bright child voice, pace: medium, pitch: medium-high}}
  june: {display_name: June, tts: {delivery: patient and perceptive, timbre: calm child voice, pace: medium-slow, pitch: medium}}
pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content: [{text: "Twelve jars of mixed "}, {vocabulary: {id: seed, text: seeds}}, {text: " wait on the table."}]
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Kavi shows June a hand-cranked sorting wheel."}, {speaker: narrator, text: "It has three hole sizes."}]}
  - id: p03
    illustration: p03
    lines:
      - speaker: narrator
        content: [{text: "Kavi pours round "}, {vocabulary: {id: seed, text: seeds}}, {text: " into the top."}]
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Small, medium, and large seeds fall into separate trays."}, {speaker: kavi, text: "The wheel works!"}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "June brings long, feathery seeds next."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Their feathery ends catch across the holes."}, {speaker: narrator, text: "The wheel stops."}]}
  - {id: p07, illustration: p07, lines: [{speaker: june, text: "These seeds are narrow but long."}, {speaker: narrator, text: "Kavi studies their different shapes."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Kavi imagines a wheel with many strange holes."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "The new plan becomes a confusing maze."}, {speaker: june, text: "Keep the useful wheel simple."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "They make three groups: round, feathery, and hooked."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "The wheel sorts only the round group by size."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "June sorts the other shapes by hand."}, {speaker: narrator, text: "Kavi keeps the wheel turning."}]}
  - {id: p13, illustration: p13, lines: [{speaker: kavi, text: "Your hands handle shapes my wheel cannot."}, {speaker: june, text: "Your wheel handles round seeds quickly."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "At sunset, all twelve jars hold tidy groups."}, {speaker: narrator, text: "Wheel and trays rest side by side."}]}
chapters:
  - {id: ch01, title: The Sorting Wheel, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Shape Before Size, page_refs: [p07, p08, p09, p10]}
  - {id: ch03, title: Two Useful Methods, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: "What do Kavi and June do after the wheel stops?", answer: "They compare shapes and make three seed groups.", page_refs: [p06, p07, p10]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: "Why do feathery seeds stop the wheel?", answer: "Their long ends catch across the holes.", page_refs: [p05, p06, p07]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: "How do the two methods work together?", answer: "The wheel sorts round seeds, and June sorts other shapes by hand.", page_refs: [p11, p12, p13]}
  - {id: q04, type: explicit-choice, speaker: narrator, prompt: "Which seeds does the wheel sort well?", choices: [Round seeds, Feathery seeds, Hooked seeds], answer: "Round seeds.", page_refs: [p03, p04, p11]}
