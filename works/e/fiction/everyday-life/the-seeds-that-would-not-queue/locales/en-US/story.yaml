schema_version: 2
language: en-US
writer: silver-bell
title: The Seeds That Would Not Queue
summary: Kavi's wooden wheel sorts round seeds quickly, until feathery seeds jam its holes. June helps him notice that one tool does not need to solve every problem.
chapters:
  - id: ch01
    title: The Sorting Wheel
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: Shape Before Size
    page_refs:
      - p07
      - p08
      - p09
      - p10
  - id: ch03
    title: Two Useful Methods
    page_refs:
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What do Kavi and June do after the wheel stops?
    answer: They compare shapes and make three seed groups.
    page_refs:
      - p06
      - p07
      - p10
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why do feathery seeds stop the wheel?
    answer: Their long ends catch across the holes.
    page_refs:
      - p05
      - p06
      - p07
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: How do the two methods work together?
    answer: The wheel sorts round seeds, and June sorts other shapes by hand.
    page_refs:
      - p11
      - p12
      - p13
  - id: q04
    type: explicit-choice
    speaker: narrator
    prompt: Which seeds does the wheel sort well?
    choices:
      - Round seeds
      - Feathery seeds
      - Hooked seeds
    answer: Round seeds.
    page_refs:
      - p03
      - p04
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "Twelve jars of mixed "
            - vocabulary:
                id: seed
                text: seeds
            - text: " fill the table. Kavi will sort them all."
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: He shows June a wooden wheel. Three hole sizes open above three trays.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Kavi pours in round "
            - vocabulary:
                id: seed
                text: seeds
            - text: . Then he turns the handle.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Small, medium, and large seeds tumble into separate trays. “It works!” Kavi cheers.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Then June brings long seeds with feathery tails.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: The tails lie across the holes. The wheel jerks once and stops.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: June holds up two seeds. “They are narrow, but have long tails.” Kavi looks again.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Kavi sketches a wheel with holes for every shape.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Soon the drawing looks like a maze. June taps the old wheel. “Keep its job simple.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: They change the plan. First, they group the seeds by shape.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: Kavi's wheel sorts only round seeds by size.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: June sorts other shapes by hand. Kavi turns the wheel.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: “You can feel each tricky shape,” Kavi says. June nods. “The wheel is faster with round seeds.”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: By sunset, all twelve jars are sorted. Wheel and trays rest side by side.
