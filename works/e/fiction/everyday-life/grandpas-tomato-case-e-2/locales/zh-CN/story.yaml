schema_version: 3
language: zh-CN
writer: 月芽笺
title: 番茄疑案（二）：月光下的客人
summary: 新脚印带来新答案，爷爷查明真相后向陈姨道歉。
chapters:
  - {id: ch01, title: 新脚印, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 真正的访客, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: 六个番茄, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "小满先发现什么，后来看到什么？", answer: "她先发现长脚印，后来看到果子狸。", page_refs: [p04, p06]}
  - {id: q02, type: cause-effect, prompt: "爷爷为什么摘六个番茄？", answer: "因为他要向被冤枉的陈姨道歉。", page_refs: [p09, p10]}
  - {id: q03, type: explicit-choice, prompt: "黑耳朵爱吃番茄吗？", answer: "不爱，它闻到番茄就躲开。", page_refs: [p11]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "爷爷又摆好竹筛和豆荚。他们要等小偷。"}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "夜里，他们躲进工具棚。爷爷的薄荷糖很响。"}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "黑耳朵扑向一团灰影。豆荚立刻响起来。"}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "番茄不见了。小满却发现另一种长脚印。"}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "小满套好番茄，又在木箱边铺上细沙。"}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "月光下，一张小小的花脸探了出来。"}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "果子狸抱起裂番茄。它没有碰网袋。"}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "洞里传来幼崽的叫声。爷爷终于知道猫没偷。"}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "第二天，爷爷摘下六个最好的番茄。"}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "他把番茄送给陈姨，还说了对不起。"}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "黑耳朵一闻番茄就躲。大家都笑了。"}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "后来，猫又来到菜园。爷爷和小满笑着追过去。"}]}
