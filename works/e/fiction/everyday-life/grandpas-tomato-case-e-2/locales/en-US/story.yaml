schema_version: 3
language: en-US
writer: silver-bell
title: "The Tomato Case, Part Two: The Moonlight Guest"
summary: New tracks lead to a new answer, and Grandpa apologizes after learning the truth.
chapters:
  - {id: ch01, title: New Tracks, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: The Real Visitor, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: Six Tomatoes, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "What did Maya find before she saw the civet?", answer: "She found long-toed tracks.", page_refs: [p04, p06]}
  - {id: q02, type: cause-effect, prompt: "Why did Grandpa pick six tomatoes?", answer: "He wanted to apologize to Mrs. Alvarez.", page_refs: [p09, p10]}
  - {id: q03, type: explicit-choice, prompt: "Did Mittens want the tomato?", answer: "No. He pulled away from it.", page_refs: [p11]}
article:
  pages:
    - {id: p01, illustration: p01, paragraphs: [{text: "Grandpa set a basket and dry bean pods. They would wait."}]}
    - {id: p02, illustration: p02, paragraphs: [{text: "At night, they hid in the shed. Grandpa's candy was loud."}]}
    - {id: p03, illustration: p03, paragraphs: [{text: "Mittens chased a gray blur. The bean pods cracked."}]}
    - {id: p04, illustration: p04, paragraphs: [{text: "The tomato vanished. Maya found a different set of long tracks."}]}
    - {id: p05, illustration: p05, paragraphs: [{text: "Maya covered the tomatoes. She spread fine sand by the crate."}]}
    - {id: p06, illustration: p06, paragraphs: [{text: "In the moonlight, a small masked face came out."}]}
    - {id: p07, illustration: p07, paragraphs: [{text: "A civet held a split tomato. She left the covered ones alone."}]}
    - {id: p08, illustration: p08, paragraphs: [{text: "Babies squeaked in the drain. Grandpa knew the cat was innocent."}]}
    - {id: p09, illustration: p09, paragraphs: [{text: "In the morning, Grandpa picked his six best tomatoes."}]}
    - {id: p10, illustration: p10, paragraphs: [{text: "He gave them to Mrs. Alvarez. He said he was sorry."}]}
    - {id: p11, illustration: p11, paragraphs: [{text: "Mittens smelled one tomato and pulled away. Everyone laughed."}]}
    - {id: p12, illustration: p12, paragraphs: [{text: "Later, Mittens came back. Grandpa and Maya ran after him, laughing."}]}
