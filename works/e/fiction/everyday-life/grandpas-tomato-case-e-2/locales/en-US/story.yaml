title: "The Tomato Case, Part Two: The Moonlight Guest"
summary: New tracks lead to a new answer, and Grandpa apologizes after learning the truth.
chapters:
  - {id: ch01, title: New Tracks, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: The Real Visitor, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: Six Tomatoes, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "What did Maya find before she saw the civet?", answer: "Some pods broke. Maya found long-toed tracks beside them. In the moonlight, a small civet came out.", page_refs: [p04, p06]}
  - {id: q02, type: cause-effect, prompt: "Why did Grandpa pick six tomatoes?", answer: "To apologize, Grandpa picked his six best tomatoes.", page_refs: [p09]}
