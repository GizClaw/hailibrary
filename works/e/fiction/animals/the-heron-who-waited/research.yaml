schema_version: 1
required: true
sources:
  - url: https://www.allaboutbirds.org/guide/Gray_Heron/overview
    title: Gray Heron Overview
    publisher: Cornell Lab of Ornithology
    supports: The Gray Heron is Ardea cinerea, occurs in Europe, Asia, and Africa, and stands motionless in shallow water while waiting to strike at fish.
  - url: https://www.jstage.jst.go.jp/article/jjo1986/39/2/39_2_45/_article
    title: Feeding Activity of the Grey Heron Ardea cinerea in Tidal and Non-tidal Environments
    publisher: Ornithological Society of Japan
    supports: Observed Grey Herons used stand-and-wait tactics when catching fish at a reservoir and walked slowly while foraging at a tidal bay.
  - url: https://www.bto.org/learn/about-birds/bird-families/ardeidae-herons
    title: Ardeidae - Herons
    publisher: British Trust for Ornithology
    supports: Herons, including the Grey Heron, have hinged neck vertebrae that let them drive the head and bill toward fish with great speed.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3656933/
    title: Group Behavioural Responses of Atlantic Salmon to Light, Infrasound and Sound Stimuli
    publisher: PLOS ONE via PubMed Central
    supports: In a controlled study, surface disturbance caused Atlantic salmon groups to change depth and move downward; this supports the limited premise that a sudden splash can make some fish move away.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3966876/
    title: Context Consistency and Seasonal Variation in Boldness of Male Two-Spotted Gobies
    publisher: PLOS ONE via PubMed Central
    supports: In a controlled experiment, a small splash at the water surface made two-spotted gobies flee or freeze in artificial algae or on the bottom; this supports the story's limited scene of small fish moving away after a splash.
notes: The named herons, their teaching exchange, and the yellow leaf are fictional. The work presents one small fish group's observed response to one splash; it does not claim that every fish species always flees any water movement. The young bird is depicted as already independent and foraging.
