schema_version: 1
language: zh-CN
writer: 月芽笺
title: 每条河边的小屋
summary: 若修好了一座会沿河旅行的小屋。她起初希望小屋留下，后来发现每次停靠都能认识新邻居，分享工具，也带走一段新的回忆。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 温暖从容, timbre: 柔和的成年声音, pace: 中慢速, pitch: 中音}}
  ruo: {display_name: 若, tts: {delivery: 细心温柔, timbre: 清楚的年轻声音, pace: 中速, pitch: 中音}}
  he: {display_name: 阿和, tts: {delivery: 沉静幽默, timbre: 温厚的年长声音, pace: 慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 若背着工具沿河走。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 一座温暖的小屋停在水边。}, {speaker: narrator, text: 屋底藏着轮子。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 阿和在蓝门前欢迎若。}, {speaker: he, text: 有一只轮子歪了。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 若打开红色工具卷，修好轮子。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 清晨，小屋沿着河岸滚动。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 他们停在一条宽阔的芦苇河边。}, {speaker: narrator, text: 附近有个小村子。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 邻居们在屋外分享蔬菜。}, {speaker: ruo, text: 留在这里也很好。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 夜里，屋轮自己转向另一条路。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 若有些失望。}, {speaker: he, text: 小屋会去需要它的河边。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 若把一颗河石放上架子。}, {speaker: ruo, text: 那我就带着这次相遇。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 小屋来到红土地间的窄河边。}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: 新邻居借用若的工具。}, {speaker: narrator, text: 大家一起修好长椅。}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 若比较架子上不同的河石。}, {speaker: narrator, text: 她笑了。}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: 小屋又向下一条河出发。}, {speaker: narrator, text: 两座山上的朋友一起挥手。}]}
chapters:
  - {id: ch01, title: 有轮子的小屋, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 离开芦苇河, page_refs: [p06, p07, p08, p09, p10]}
  - {id: ch03, title: 带走每次相遇, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 小屋移动前，若先做了什么？, answer: 修好歪斜的轮子。, page_refs: [p03, p04, p05]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: 若为什么保存一颗河石？, answer: 小屋要离开，她想记住这次相遇。, page_refs: [p08, p09, p10]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: 若在红土河边怎样帮助邻居？, answer: 分享工具，一起修好长椅。, page_refs: [p11, p12]}
  - {id: q04, type: explicit-choice, speaker: narrator, prompt: 比较河石后，若是什么心情？, choices: [开心, 生气, 害怕], answer: 开心。, page_refs: [p13]}
