schema_version: 1
language: zh-CN
writer: 北辰
title: 会搬家的河边小屋
summary: 若修好一座会沿河搬家的房子。跟着它走过两条河以后，她对“家”有了新的想法。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 温暖舒缓, timbre: 柔和的成年声音, pace: 中慢速, pitch: 中音}}
  ruo: {display_name: 若, tts: {delivery: 细心真诚, timbre: 清晰的年轻成年声音, pace: 中速, pitch: 中高音}}
  he: {display_name: 阿河, tts: {delivery: 沉着略带幽默, timbre: 温润的年长声音, pace: 慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 若沿着河走，替人修东西。别人请她吃顿饭，再讲个新故事，就算报酬。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 那天，她遇见一座藏着轮子的房子。}]}
  - {id: p03, illustration: p03, lines: [{speaker: he, text: 我叫阿河。这房子叫“在路上”，左边那个轮子正在闹脾气。}]}
  - {id: p04, illustration: p04, lines: [{speaker: ruo, content: [{text: 轮子没生气，只是}, {vocabulary: {id: axle, text: 车轴}}, {text: 里进了细沙。}]}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 轮子修好后，房子沿着河岸轻轻出发。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 第一条河宽而安静，芦苇把风梳得很慢。}]}
  - {id: p07, illustration: p07, lines: [{speaker: ruo, text: 这里的人记得我的名字，也需要我的工具。留下不好吗？}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 可夜里，房子的轮子自己转向另一条路。}]}
  - {id: p09, illustration: p09, lines: [{speaker: he, text: 它不是催我们忘掉旧地方，只是还想去认识新的地方。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 若把河边捡的小石头放到窗前，和旧石头排在一起。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 第二条河窄而红，山影像弯曲的手臂。}]}
  - {id: p12, illustration: p12, lines: [{speaker: ruo, text: 这次我不只替大家修，我教大家一起修。}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 她看着两种河石，忽然明白：记住一个地方，不等于非得留在那里。}]}
  - {id: p14, illustration: p14, lines: [{speaker: ruo, text: 走吧。原来走过的路、认识的人，也能一点点变成家。}]}
chapters:
  - {id: ch01, title: 在路上, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 第一条河, page_refs: [p06, p07, p08, p09, p10]}
  - {id: ch03, title: 带着河石上路, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 若修好轮子后，房子先到了怎样的河边？, answer: 一条宽而安静、长着芦苇的河边。, page_refs: [p05, p06]}
  - {id: q02, type: character-motive, speaker: narrator, prompt: 若为什么想留在第一条河边？, answer: 因为那里的人记得她，也需要她的工具。, page_refs: [p07]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 搬到第二条河边后，若换了什么做法？, answer: 她不再一个人包办，而是教邻居一起修。, page_refs: [p11, p12]}
  - {id: q04, type: short-answer, speaker: narrator, prompt: 两种河石让若明白了什么？, answer: 记住一个地方不等于必须停在那里。, page_refs: [p10, p13]}
  - {id: q05, type: main-idea, speaker: narrator, prompt: 故事最后，若觉得什么也能慢慢变成“家”？, answer: 她走过的路、记住的地方和认识的人。, page_refs: [p07, p10, p13, p14]}
