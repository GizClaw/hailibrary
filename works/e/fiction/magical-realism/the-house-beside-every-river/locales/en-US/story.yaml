schema_version: 2
language: en-US
writer: silver-bell
title: The House Beside Every River
summary: Ruo repairs a little house that travels from river to river. She wants to stay at the first village, but the house teaches her another way to keep a place close.
chapters:
  - id: ch01
    title: A House on Wheels
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: Leaving the Reed River
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
  - id: ch03
    title: Visits to Carry
    page_refs:
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What does Ruo do before the house moves?
    answer: She repairs its leaning wheel.
    page_refs:
      - p03
      - p04
      - p05
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why does Ruo save a river pebble?
    answer: The house must leave, so she keeps a memory of the visit.
    page_refs:
      - p08
      - p09
      - p10
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: How does Ruo help at the red-earth river?
    answer: She shares her tools and helps repair a bench.
    page_refs:
      - p11
      - p12
  - id: q04
    type: explicit-choice
    speaker: narrator
    prompt: How does Ruo feel after comparing the pebbles?
    choices:
      - Glad
      - Angry
      - Afraid
    answer: Glad.
    page_refs:
      - p13
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Ruo follows the river path with her red tool roll.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: A warm little house waits beside the water. Small wheels hide beneath its floor.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: The keeper opens the blue door. “One wheel has leaned all morning,” they say.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Ruo opens her tools and sets the crooked wheel straight.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: At dawn, the repaired house rolls along the river.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: It stops by a village near a broad reed river.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Neighbors bring vegetables. Ruo laughs with them. “I could stay here,” she says.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: That night, the little wheels turn toward a new path.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Ruo stops smiling. The keeper closes the door. “Other rivers need this house.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Ruo picks up a smooth pebble. “This visit can come with me.”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: The house reaches a narrow river in red earth.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: New neighbors borrow Ruo's tools. Together, they mend a bench.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Ruo sets another pebble beside the first. Their colors make her smile.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: The house sets off again. Friends on two hills wave goodbye.
