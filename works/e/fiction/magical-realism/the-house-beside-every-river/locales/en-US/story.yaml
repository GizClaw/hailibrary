schema_version: 1
language: en-US
writer: silver-bell
title: The House Beside Every River
summary: Ruo repairs a little house that travels beside rivers. She first wishes it would stay, but each new stop lets her exchange help, tools, and memories with another community.
cast:
  narrator: {display_name: Narrator, tts: {delivery: warm and unhurried, timbre: gentle adult voice, pace: medium-slow, pitch: medium}}
  ruo: {display_name: Ruo, tts: {delivery: observant and gentle, timbre: clear young-adult voice, pace: medium, pitch: medium}}
  he: {display_name: Keeper, tts: {delivery: thoughtful and dry, timbre: mellow older voice, pace: slow, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Ruo follows a river path with her tools."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "A warm little house waits beside the water."}, {speaker: narrator, text: "Hidden wheels rest underneath."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "The keeper welcomes Ruo at the blue door."}, {speaker: he, text: "One wheel leans badly."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Ruo opens her red tool roll and repairs it."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "At dawn, the house rolls along the river."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "They stop beside a broad reed river."}, {speaker: narrator, text: "A small village stands nearby."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Neighbors share vegetables outside the house."}, {speaker: ruo, text: "I could stay here."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "That night, the wheels turn toward another path."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Ruo looks disappointed."}, {speaker: he, text: "This house visits rivers that need it."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Ruo places one river pebble on the shelf."}, {speaker: ruo, text: "Then I will carry this visit."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "The house reaches a narrow red-earth river."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "New neighbors borrow Ruo's tools."}, {speaker: narrator, text: "Together, they repair a bench."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Ruo compares the different river pebbles."}, {speaker: narrator, text: "Now she smiles."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "The house rolls toward another river."}, {speaker: narrator, text: "Friends wave from two distant hills."}]}
chapters:
  - {id: ch01, title: A House on Wheels, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Leaving the Reed River, page_refs: [p06, p07, p08, p09, p10]}
  - {id: ch03, title: Visits to Carry, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: "What does Ruo do before the house moves?", answer: "She repairs its leaning wheel.", page_refs: [p03, p04, p05]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: "Why does Ruo save a river pebble?", answer: "The house must leave, so she keeps a memory of the visit.", page_refs: [p08, p09, p10]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: "How does Ruo help at the red-earth river?", answer: "She shares her tools and helps repair a bench.", page_refs: [p11, p12]}
  - {id: q04, type: explicit-choice, speaker: narrator, prompt: "How does Ruo feel after comparing the pebbles?", choices: [Glad, Angry, Afraid], answer: "Glad.", page_refs: [p13]}
