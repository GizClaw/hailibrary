schema_version: 2
language: en-US
writer: silver-bell
title: The Orchard That Remembered
summary: Isa trusts the orchard's old trees and refuses a strange blue seed. When dry wind weakens the fruit, the old roots show her that remembering can make room for change.
chapters:
  - id: ch01
    title: The Unfamiliar Seed
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: The Orchard Reaches
    page_refs:
      - p05
      - p06
      - p07
      - p08
      - p09
      - p10
  - id: ch03
    title: Old and New
    page_refs:
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: What happens before Isa plants the blue seed?
    answer: Hot wind weakens the orchard, and old roots reach toward the seed.
    page_refs:
      - p05
      - p06
      - p07
      - p08
      - p09
      - p10
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why does Isa change her plan?
    answer: The old trees weaken and their roots reach toward the new seed.
    page_refs:
      - p05
      - p06
      - p08
      - p09
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: What shows that old and new can grow together?
    answer: Their branches make shared shade, and both fruits fill one basket.
    page_refs:
      - p11
      - p12
      - p13
  - id: q04
    type: explicit-choice
    speaker: narrator
    prompt: What does Isa give Jun?
    choices:
      - A mixed seed pouch
      - An empty basket
      - A broken branch
    answer: A mixed seed pouch.
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Isa picks red fruit from the orchard's old trees.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "Jun arrives with unlabeled "
            - vocabulary:
                id: seed
                text: seed
            - text: " packets from far away."
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Jun opens one palm. A blue "
            - vocabulary:
                id: seed
                text: seed
            - text: " rests there. “It may grow in dry weather.”"
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Isa gives it back. “These old trees have always fed us,” she says.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Then hot wind curls the leaves. Small fruit drops too soon.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Each day brings emptier baskets and thinner shade.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Jun sets the blue "
            - vocabulary:
                id: seed
                text: seed
            - text: " near cracked soil. Jun waits."
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Below ground, old roots bend toward the waiting seed.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Root patterns rise across the soil. Isa whispers, “The orchard wants to try.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Isa takes the blue "
            - vocabulary:
                id: seed
                text: seed
            - text: . She and Jun plant it beside an old tree.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: A blue-green shoot rises. Old branches shelter it.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Seasons pass. New and old branches weave shared shade.
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: At harvest, Isa fills one basket with red and blue fruit.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Isa gives Jun a mixed seed pouch. “Carry both. Another orchard may need them.”
