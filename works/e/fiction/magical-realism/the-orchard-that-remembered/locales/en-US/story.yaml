schema_version: 1
language: en-US
writer: silver-bell
title: The Orchard That Remembered
summary: Isa refuses an unfamiliar blue seed because old trees have always fed the orchard. After hot wind weakens them, the roots reach toward the new seed, and Isa chooses to plant old and new together.
cast:
  narrator: {display_name: Narrator, tts: {delivery: warm and observant, timbre: gentle adult voice, pace: medium-slow, pitch: medium}}
  isa: {display_name: Isa, tts: {delivery: grounded and reserved, timbre: steady older voice, pace: slow, pitch: low-medium}}
  jun: {display_name: Jun, tts: {delivery: curious and calm, timbre: clear adult voice, pace: medium, pitch: medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Isa gathers red fruit from rows of old trees."}]}
  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content: [{text: "Jun arrives with many unlabeled "}, {vocabulary: {id: seed, text: seed}}, {text: " packets."}]
  - id: p03
    illustration: p03
    lines:
      - speaker: narrator
        content: [{text: "Jun offers one dark blue "}, {vocabulary: {id: seed, text: seed}}, {text: "."}]
      - {speaker: jun, text: "It may grow in dry weather."}
  - {id: p04, illustration: p04, lines: [{speaker: isa, text: "These old trees have always fed us."}, {speaker: narrator, text: "Isa returns the seed."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "A hot, dry wind curls the leaves."}, {speaker: narrator, text: "Small fruit falls too early."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Isa sees empty baskets and thinner shade."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Jun sets the blue seed near cracked soil."}, {speaker: narrator, text: "Jun does not plant it."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Underground, old roots bend toward the waiting seed."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Root patterns rise through the soil."}, {speaker: isa, text: "The orchard is reaching for change."}]}
  - id: p10
    illustration: p10
    lines:
      - speaker: narrator
        content: [{text: "Isa and Jun plant the blue "}, {vocabulary: {id: seed, text: seed}}, {text: " together."}]
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "A blue-green shoot rises beside an old tree."}, {speaker: narrator, text: "The old branches shelter it."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "New and old branches weave shared shade."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Isa fills one basket with red and blue fruit."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Isa gives Jun a mixed pouch of seeds."}, {speaker: isa, text: "Carry both kinds forward."}]}
chapters:
  - {id: ch01, title: The Unfamiliar Seed, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: The Orchard Reaches, page_refs: [p05, p06, p07, p08, p09, p10]}
  - {id: ch03, title: Old and New, page_refs: [p11, p12, p13, p14]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: "What happens before Isa plants the blue seed?", answer: "Hot wind weakens the orchard, and old roots reach toward the seed.", page_refs: [p05, p06, p07, p08, p09, p10]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: "Why does Isa change her plan?", answer: "The old trees weaken and their roots reach toward the new seed.", page_refs: [p05, p06, p08, p09]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: "What shows that old and new can grow together?", answer: "Their branches make shared shade, and both fruits fill one basket.", page_refs: [p11, p12, p13]}
  - {id: q04, type: explicit-choice, speaker: narrator, prompt: "What does Isa give Jun?", choices: [A mixed seed pouch, An empty basket, A broken branch], answer: "A mixed seed pouch.", page_refs: [p14]}
