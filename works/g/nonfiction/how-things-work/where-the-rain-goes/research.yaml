sources:
  - id: usgs-infiltration
    title: Infiltration and the Water Cycle
    publisher: U.S. Geological Survey
    url: https://www.usgs.gov/water-science-school/science/infiltration-and-water-cycle
    supports: "p05 and p10: Water can enter soil through small spaces and cracks; hard paving does not rule out water entering through cracks. The possibility is qualified, with no measured rate or share."
    verified_at: 2026-09-13
  - id: usgs-runoff
    title: Surface Runoff and the Water Cycle
    publisher: U.S. Geological Survey
    url: https://www.usgs.gov/water-science-school/science/surface-runoff-and-water-cycle
    supports: "p02–p06: Water flows downhill over paving; water can take different surface routes or enter soil."
    verified_at: 2026-09-13
  - id: usgs-evaporation
    title: Evaporation and the Water Cycle
    publisher: U.S. Geological Survey
    url: https://www.usgs.gov/water-science-school/science/evaporation-and-water-cycle
    supports: "p07–p12: Water can leave a puddle by changing to invisible gaseous water; solar warmth supplies energy and helps evaporation. A dry gap establishes a smaller visible puddle, not exclusive proof of a mechanism."
    verified_at: 2026-09-13
  - id: epa-rain
    title: "Soak Up the Rain: What is the Problem?"
    publisher: U.S. Environmental Protection Agency
    url: https://www.epa.gov/soakuptherain/soak-rain-whats-problem
    supports: "p05–p06: Rainwater can soak into ground or flow over hard surfaces into drains. No particular ultimate drain destination is asserted."
    verified_at: 2026-09-13
