notes:
  - The teacher, children and classroom sequence are invented examples of real physical processes. No named real school, location, storm duration or exact drying rate is claimed.
  - The p07 puddle lies on a hard paved path. Its water is not visibly flowing along that surface; this does not rule out infiltration. P10 explicitly allows a little water to enter cracks as well as solar-assisted evaporation. Neither mechanism’s share is measured; the marker establishes the receding edge only.
  - All observations are from stable paving under adult supervision. The drain remains securely covered; no touching, opening, entering or water collection.
  - "Illustrations show clear air rather than visible steam: water vapor itself cannot be seen."
  - Soil spaces and ordinary rainwater pooling are scientific simplifications. No rate of infiltration or drainage destination is inferred.
