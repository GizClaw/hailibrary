schema_version: 2
language: zh-CN
writer: 铜罗盘
title: 雨水去哪儿了
summary: 全班一起看看雨水去了哪儿。跟不住分开的水流，大家换个办法，一处一处地看。
chapters:
  - id: ch01
    title: 跟着雨水走
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 水边的小石子
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 大家为什么不能一直跟着那股水走？
    answer: 水流分开了，没法同时跟着看。
    page_refs:
      - p02
      - p03
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 跟不住水流以后，大家先做了什么？
    answer: 先看一个地方，从路边种花的地方看起。
    page_refs:
      - p03
      - p04
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 老师为什么在水边放石子？
    answer: 留下记号，回来时能比较水边的位置。
    page_refs:
      - p08
      - p09
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 水干了，大家怎么找到原来的水洼？
    answer: 石子还在原处，能帮大家找到原来积水的地方。
    page_refs:
      - p08
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 大雨过后，老师确认校园里安全了。全班一起出门，看看雨水去了哪儿。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 校园的小路上，一股水正往低处流。小宁跟着水走，同学们也跟上来。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 水流分开了，小宁停下脚步。雨水往不同的地方去，没法同时跟着看。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 小宁问老师：“先看一个地方，好吗？”大家就从路边种花的地方看起。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 有些雨水慢慢进了泥土。土里有小缝，水能顺着小缝进去。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 路上的另一股水流进了排水口。孩子们跟老师站得远一点，没有靠过去。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 硬硬的小路上，低处积成了
            - vocabulary:
                id: puddle
                text: 水洼
            - text: 。大家等了一会儿，水没沿着路面流走。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 老师把石子放在水边，留个记号。大家先回教室，晚些时候再来看
            - vocabulary:
                id: puddle
                text: 水洼
            - text: 。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 下午再来，
            - vocabulary:
                id: puddle
                text: 水洼
            - text: 变小了。石子没动，石子和水之间却多了一块干地。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 太阳晒着
            - vocabulary:
                id: puddle
                text: 水洼
            - text: ，帮水变成水汽。水汽看不见。少量水也可能从小缝流进地下。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 小山问老师：“
            - vocabulary:
                id: puddle
                text: 水洼
            - text: 里的水到空气里去了吗？”老师点点头，大家又等了一会儿。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 后来，最后一点水也干了。还好石子留在原处，大家找到了
            - vocabulary:
                id: puddle
                text: 水洼
            - text: 原来的位置。
audio_script:
