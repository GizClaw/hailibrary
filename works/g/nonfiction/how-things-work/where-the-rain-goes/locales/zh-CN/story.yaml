        delivery: 温和地讲述观察过程
        timbre: 清晰饱满的成人声
        pace: 匀速适中
        pitch: 中音
    teacher:
      display_name: 老师
      tts:
        delivery: 轻柔而让人安心
        timbre: 柔润的成人声
        pace: 舒缓
        pitch: 低音
    nora:
      display_name: 小宁
      tts:
        delivery: 好奇，带着试一试的期待
        timbre: 轻亮略带气声的童声
        pace: 轻快，短暂停顿
        pitch: 高音
    sam:
      display_name: 小山
      tts:
        delivery: 疑惑中带着期待
        timbre: 圆润略沙的童声
        pace: 稍慢，问句前略停
        pitch: 中低音
