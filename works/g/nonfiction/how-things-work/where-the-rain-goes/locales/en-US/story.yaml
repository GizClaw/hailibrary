schema_version: 2
language: en-US
writer: brass-compass
title: Where Does the Rain Go?
summary: Our class follows rainwater, then tries a different way to see where it goes.
chapters:
  - id: ch01
    title: Following the Water
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: The Stone by the Puddle
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why do we stop following the stream?
    answer: It splits, so we cannot follow all the water at once.
    page_refs:
      - p02
      - p03
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What do we do after the stream splits?
    answer: We check one place first, beginning beside the plants.
    page_refs:
      - p03
      - p04
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does our teacher put a stone beside the puddle?
    answer: To help us compare the water’s edge when we come back.
    page_refs:
      - p08
      - p09
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: How do we find where the puddle was?
    answer: The stone is still beside the place where the water was.
    page_refs:
      - p08
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: The storm has passed, and our teacher checks outside. Now our class can find where the rainwater goes.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: We follow a thin stream across the school yard. The water runs down the sloping path.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: But the stream splits, and we lose track of it. We cannot follow all the water at once.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: “Can we check one place first?” Nora asks our teacher. We start beside the plants.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Some water goes into the soil where the plants grow. It fills tiny spaces between bits of soil.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Other water runs into a drain in the path. We stay back and watch beside our teacher.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "A shallow "
            - vocabulary:
                id: puddle
                text: puddle
            - text: " sits on the hard path nearby. We wait, but the water doesn't run along the path."
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "Our teacher sets a stone beside the water's edge. We will come back and check the "
            - vocabulary:
                id: puddle
                text: puddle
            - text: " later."
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "In the afternoon, the "
            - vocabulary:
                id: puddle
                text: puddle
            - text: " is smaller. A dry gap now lies between the stone and the water."
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "The sun helps "
            - vocabulary:
                id: puddle
                text: puddle
            - text: " water become vapor, a gas we can't see. A little water can also soak into cracks."
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "“Did the "
            - vocabulary:
                id: puddle
                text: puddle
            - text: " water go into the air?” Sam asks our teacher. She nods, and we stay a little longer."
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "Later, the last wet patch dries. The stone shows us where the "
            - vocabulary:
                id: puddle
                text: puddle
            - text: " used to be."
