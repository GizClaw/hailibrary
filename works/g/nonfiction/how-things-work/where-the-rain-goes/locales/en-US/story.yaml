        timbre: clear full adult voice
        pace: even medium
        pitch: middle
    teacher:
      display_name: Teacher
      tts:
        delivery: gentle and reassuring
        timbre: mellow smooth adult voice
        pace: unhurried
        pitch: low
    nora:
      display_name: Nora
      tts:
        delivery: curious and ready to act
        timbre: light airy child voice
        pace: lively with short pauses
        pitch: high
    sam:
      display_name: Sam
      tts:
        delivery: tentative and wondering
        timbre: rounded slightly husky child voice
        pace: slower with a questioning pause
        pitch: middle-low
