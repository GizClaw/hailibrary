schema_version: 1
language: zh-CN
writer: 江笑
title: 总是分错的机器人
summary: 小恩造了一台勤快的分拣机器人。它只看颜色和形状，动作越快，闹出的乱子也越大。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 风趣细致, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  em: {display_name: 小恩, tts: {delivery: 思路快而清楚, timbre: 专注的青年声音, pace: 中快速, pitch: 中高音}}
  tala: {display_name: 塔拉, tts: {delivery: 沉稳略带调侃, timbre: 有质感的年长声音, pace: 中慢速, pitch: 低音}}
  pebble: {display_name: 小石头, tts: {delivery: 友好直白, timbre: 柔和的合成声音, pace: 匀速, pitch: 中音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: em, text: 市场里退回来的货，全交给小石头。它分得快，来什么分什么。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 圆滚滚的橙子整整齐齐进了果蔬筐。}]}
  - {id: p03, illustration: p03, lines: [{speaker: pebble, text: 圆，红，水果。}, {speaker: narrator, text: 一个玩具球也跟着滚了进去。}]}
  - {id: p04, illustration: p04, lines: [{speaker: em, text: 小错而已。再教它认几种颜色就行。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 接着，一块绿肥皂朝蔬菜滑去。}]}
  - {id: p06, illustration: p06, lines: [{speaker: tala, text: 幸好我拦得快。等你更新完，肥皂都快跟菜一起下锅了。}]}
  - {id: p07, illustration: p07, lines: [{speaker: em, text: 测试时，它凭形状和颜色分得很准。}]}
  - {id: p08, illustration: p08, lines: [{speaker: tala, text: 可市场里的东西比测试样品杂多了。你看，模样差不多，用处却完全不同。}]}
  - {id: p09, illustration: p09, lines: [{speaker: pebble, text: 看起来一样，用处不一样。我分不出来。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 小恩重新安排分拣路线：食品单独走，其他东西先按材料分。}]}
  - {id: p11, illustration: p11, lines: [{speaker: tala, text: 再请天天遇到怪东西的人来试试。}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: 又来了一个水果模样的木玩具。小石头这回停住了，没有硬猜。}]}
  - {id: p13, illustration: p13, lines: [{speaker: em, text: 现在谁发现不对都能停下传送带。机器拿不准的，先放到一边等人检查。}]}
  - {id: p14, illustration: p14, lines: [{speaker: pebble, text: 这一次，我不知道。}]}
  - {id: p15, illustration: p15, lines: [{speaker: tala, text: 总算学会说“不知道”了。可这张检查台这么高，是只给机器人用的吗？}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 小恩把台面调低，又拓宽了周围的通道。}]}
  - {id: p17, illustration: p17, lines: [{speaker: em, content: [{text: 它先}, {vocabulary: {id: sort, text: 分拣}}, {text: ，人再检查。哪些东西总让它犯难，我们也一件件记下来。}]}]}
  - {id: p18, illustration: p18, lines: [{speaker: tala, text: 这才叫帮忙：干得快，拿不准时也知道停下来。}]}
chapters:
  - {id: ch01, title: 又快又公平, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 市场不是测试箱, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 不知道也能帮上忙, page_refs: [p13, p14, p15, p16, p17, p18]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: 小石头为什么把玩具球放进橙子里？, answer: 它只看形状和颜色，不懂东西的用途。, page_refs: [p02, p03, p07]}
  - {id: q02, type: short-answer, speaker: narrator, prompt: 把肥皂分进蔬菜里，为什么不能只当成笑话？, answer: 肥皂可能混进要吃的东西里。, page_refs: [p05, p06]}
  - {id: q03, type: character-motive, speaker: narrator, prompt: 塔拉为什么拿来三件形状相似的东西？, answer: 她要说明外形相似不等于用途相同。, page_refs: [p08, p09]}
  - {id: q04, type: evidence, speaker: narrator, prompt: 改造以后，小石头的做法有什么变化？, answer: 它遇到拿不准的东西会停下来，交给人检查，不再硬猜。, page_refs: [p12, p14]}
  - {id: q05, type: compare, speaker: narrator, prompt: 小恩后来怎样重新理解“公平”？, answer: 她起初以为，对所有东西一概按同一套规则处理就是公平；后来才明白，还要让人能够停机、检查和纠错，也要让不同身体条件的人都能参与。, page_refs: [p01, p13, p16, p17]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: 为什么机器说“我不知道”反而更有用？, answer: 它不再把拿不准的东西硬分下去，人们便能及时检查、纠正错误，再改进规则。, page_refs: [p13, p14, p17, p18]}
