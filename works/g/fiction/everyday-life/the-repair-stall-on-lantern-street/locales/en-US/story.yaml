schema_version: 2
language: en-US
writer: brass-compass
title: The Repair Stall on Lantern Street
summary: Mei rushes to fix a neighbor’s radio. Amara’s question helps her use an earlier clue.
chapters:
  - id: ch01
    title: A Quiet Radio
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: The Wobble
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: Music at the Stall
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Mei’s first repair attempt fail?
    answer: The low spring cannot press firmly against one battery. The radio gets no power.
    page_refs:
      - p03
      - p04
      - p08
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What do the girls do after Amara asks what Mei tried first?
    answer: Mei remembers the wobble, and they remove the batteries to look inside.
    page_refs:
      - p06
      - p07
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why does Mei start before Grandpa Lu returns?
    answer: She wants to prove that she can fix the radio herself.
    page_refs:
      - p02
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: Which earlier clue helps Mei find the bent spring?
    answer: One battery wobbled when Mei touched it.
    page_refs:
      - p03
      - p06
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: Auntie Chen brought a small radio to Grandpa Lu’s stall. “It went quiet,” she said.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Grandpa Lu stepped just inside for his tool tray. He could still see Mei. She leaned close, eager to fix the radio herself.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Mei opened the battery door. One battery wobbled when she touched it, but she hurried on.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: She wiped the battery ends and turned the round knob. The radio stayed quiet.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Over the past few weeks, Amara had learned a little Chinese. Mei’s dog Bean trotted over as Amara arrived. “I can fix it,” Mei said, turning the knob. Still nothing.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Amara crouched and pointed at the battery door. “What did you try first?” she asked. Mei remembered the little wobble.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "That wobble was a "
            - vocabulary:
                id: clue
                text: clue
            - text: ". They removed both batteries before looking inside the empty case."
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Two metal springs sat at the ends. One stood tall, but the other sat low. The low spring could not press firmly against the battery. The radio got no power.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Grandpa Lu returned. Mei showed him the bent spring. “May I lift it?” she asked.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: He nodded and held the radio steady. Mei used his small pliers to lift the spring. Amara watched.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: They put the batteries back the same way. Mei turned the knob. Warm music filled the stall.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Auntie Chen smiled when Mei returned the radio. Bean tilted his head at the music, and Amara laughed.
audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and clear
        timbre: smooth adult alto
        pace: measured medium
        pitch: middle-low
    mei:
      display_name: Mei
      tts:
        delivery: quick, curious, a little impatient
        timbre: light child voice with crisp consonants
        pace: brisk
        pitch: high
    grandpa-lu:
      display_name: Grandpa Lu
      tts:
        delivery: warm with dry understatement
        timbre: soft grainy elderly baritone
        pace: slow
        pitch: low
    amara:
      display_name: Amara
      tts:
        delivery: bright and direct, with questioning lift
        timbre: full rounded child voice
        pace: lively with deliberate questions
        pitch: middle-high
    bean:
      display_name: Bean
      tts:
        delivery: silent; narrator describes any bark
        timbre: no synthesized voice
        pace: no spoken delivery
        pitch: unvoiced
    auntie-chen:
      display_name: Auntie Chen
      tts:
        delivery: friendly and practical, with easy warmth
        timbre: clear rounded adult mezzo
        pace: brisk but unhurried
        pitch: middle
