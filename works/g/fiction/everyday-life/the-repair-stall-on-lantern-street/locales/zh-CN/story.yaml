schema_version: 2
language: zh-CN
writer: 铜罗盘
title: 灯笼街的修理摊
summary: 梅梅急着修好邻居的收音机。阿玛拉问了一个问题，让她想起先前发现的线索。
chapters:
  - id: ch01
    title: 不出声的收音机
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 轻轻一晃
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: 小摊响起音乐
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 梅梅第一次为什么没修好收音机？
    answer: 弹簧压得太低，顶不紧电池，收音机就通不了电。
    page_refs:
      - p03
      - p04
      - p08
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 阿玛拉问过问题后，她们先后做了什么？
    answer: 梅梅先想起电池晃了一下。两人再取出电池，查看电池盒。
    page_refs:
      - p06
      - p07
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 卢爷爷回来前，梅梅为什么先动手？
    answer: 她想证明自己能修好收音机。
    page_refs:
      - p02
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 先前哪个线索帮梅梅发现了压得很低的弹簧？
    answer: 一节电池轻轻一碰就晃。
    page_refs:
      - p03
      - p06
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 邻居陈阿姨抱来一台小收音机。“早上还响，现在没声了。”她说。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 卢爷爷进里屋拿工具盘。门开着，他还能看见梅梅。梅梅凑到摊前，想自己修好收音机。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 她打开电池盖。一节电池轻轻一碰就晃，梅梅却急着往下试。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 她擦了擦电池两头，又拧了拧开关。收音机还是安安静静。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 这几周，阿玛拉学会了一点中文。她来到摊前，梅梅的小狗豆豆跑来迎她。梅梅又拧开关：“我能修好。”还是没声音。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 阿玛拉蹲下，指了指电池盖：“你先试了什么？”梅梅想起电池晃的那一下。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 那个晃动是一条
            - vocabulary:
                id: clue
                text: 线索
            - text: 。她们先取出两节电池，再看空电池盒。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 盒里有两个小弹簧。一个高高地立着，另一个压得很低。压得很低的弹簧顶不紧电池，收音机就通不了电。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 卢爷爷回来了。梅梅指着压得很低的弹簧问他：“我能把它抬起来吗？”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 卢爷爷点头，扶稳收音机。梅梅用他的小钳子把弹簧轻轻拉高一点。阿玛拉在旁边看着。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 她们照原样放回电池。梅梅一拧开关，温暖的音乐流进小院。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 陈阿姨接过收音机，笑了。豆豆听见音乐，歪着脑袋，阿玛拉也笑起来。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚地讲述，留意人物的小动作
        timbre: 平滑柔和的成年中低音
        pace: 平稳适中
        pitch: 中低
    mei:
      display_name: 梅梅
      tts:
        delivery: 好奇，反应快，带一点急切
        timbre: 清亮纤细的童声，吐字利落
        pace: 稍快
        pitch: 高
    grandpa-lu:
      display_name: 卢爷爷
      tts:
        delivery: 温和，带一点不动声色的幽默
        timbre: 略有沙感的老年男声
        pace: 缓慢
        pitch: 低
    amara:
      display_name: 阿玛拉
      tts:
        delivery: 明快直接，问句带自然上扬
        timbre: 饱满圆润的童声
        pace: 活泼，问话时稍作停顿
        pitch: 中高
    bean:
      display_name: 豆豆
      tts:
        delivery: 不发言；叫声只由旁白描述
        timbre: 不合成角色声音
        pace: 无口语输出
        pitch: 无声
    auntie-chen:
      display_name: 陈阿姨
      tts:
        delivery: 亲切利落，带着邻里间的熟稔
        timbre: 清楚圆润的成年女中音
        pace: 明快但不催促
        pitch: 中
