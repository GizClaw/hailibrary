schema_version: 1
style: watercolor-gouache
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
setting: Lantern Street / 灯笼街, book 2 of a three-book series. A fictional old pedestrian lane in
  a Chinese city, with strings of red paper lanterns, small family shops, and a shared stone courtyard
  shaded by a camphor tree. Grandpa Lu’s open-air repair stall stands under the tree. No motor traffic,
  signs, or writing.
continuity: Preserve the recurring faces, body proportions, hair, clothing, dog markings, courtyard,
  camphor tree, red lanterns, and green toolbox established in book 1. The small portable radio has a
  rounded cream case, brown speaker grille without logos, one round knob, a rear battery door, two
  plain removable batteries, and two metal contact springs. Show no printed battery markings. Keep the
  radio disconnected from any cord. Batteries are out before the spring is touched, and Grandpa Lu
  steadies the radio during the supervised adjustment.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mei and Amara lean over the cream portable radio at Grandpa Lu’s repair stall while Grandpa
      Lu watches warmly. Bean stands beside the green toolbox. The camphor tree and red lantern strings
      make the setting clearly Lantern Street.
  - id: p01
    file: artwork/p01.webp
    scene: Auntie Chen brings the silent cream battery radio to Grandpa Lu across his open-air stall;
      Mei watches with eager interest, while Bean and the green toolbox wait nearby.
  - id: p02
    file: artwork/p02.webp
    scene: Grandpa Lu steps into the adjacent workroom for a shallow tool tray while Mei leans toward
      the radio on the stall table, visibly eager to try alone.
  - id: p03
    file: artwork/p03.webp
    scene: Mei opens the radio’s rear battery door and touches one plain battery, which sits visibly
      loose in its slot; her attention is already moving toward the front knob.
  - id: p04
    file: artwork/p04.webp
    scene: Mei wipes the two battery ends with a clean cloth, replaces them, and turns the radio’s one
      round knob, but her face shows that it remains silent.
  - id: p05
    file: artwork/p05.webp
    scene: Amara arrives with Bean as Mei confidently turns the radio knob again; the radio stays quiet,
      and Amara studies the scene with a questioning expression.
  - id: p06
    file: artwork/p06.webp
    scene: Amara crouches beside Mei and asks a focused question; Mei pauses with one finger near the
      open battery door as she remembers the battery’s small movement.
  - id: p07
    file: artwork/p07.webp
    scene: The girls have removed both plain batteries and set them safely beside the open radio. They
      peer into the empty battery compartment, following the wobble as their clue.
  - id: p08
    file: artwork/p08.webp
    scene: "Clear close view of the empty battery compartment between the girls: one metal spring stands
      tall while the matching spring is pressed noticeably low; both girls recognize the difference."
  - id: p09
    file: artwork/p09.webp
    scene: Grandpa Lu has returned with the tool tray. Mei points to the bent spring and asks permission;
      Amara remains beside her and Bean waits below the stall.
  - id: p10
    file: artwork/p10.webp
    scene: With both batteries still removed, Grandpa Lu steadies the cream radio while Mei gently lifts
      the flat spring using his small pliers; Amara watches closely.
  - id: p11
    file: artwork/p11.webp
    scene: The batteries are back inside and the rear door is closed. Mei turns the knob as everyone’s
      delighted faces show that warm music now fills the stall; do not draw music notes or symbols.
  - id: p12
    file: artwork/p12.webp
    scene: Auntie Chen receives the working radio from Mei and smiles. Amara laughs, Bean tilts his head,
      and Grandpa Lu looks on beside the green toolbox under the lanterns.
generation:
  workflow: Codex built-in image generation using book 1 as the visual reference; cwebp compression
