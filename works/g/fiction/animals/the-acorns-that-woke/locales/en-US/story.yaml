questions:
  - id: q01
    type: sequence
    prompt: What does Hazel remember after the first hole has no acorn?
    answer: Then Hazel remembers brush with silver-backed leaves near a rock shelf.
    page_refs:
      - p02
      - p03
  - id: q02
    type: cause-effect
    prompt: Why can Hazel still find food when some holes are empty?
    answer: "Her stores are spread out, so other holes still hold food."
    page_refs:
      - p06
  - id: q03
    type: short-answer
    prompt: What happens to some unfound acorns?
    answer: They stay buried and begin to grow.
    page_refs:
      - p08
      - p10
  - id: q04
    type: character-motive
    prompt: Why does Hazel pull the fallen branch three times?
    answer: She wants to free the small oak.
    page_refs:
      - p11
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Deep snow hides the roots and rocks. Hazel’s nest holds only empty shells.
    - id: p02
      illustration: p02
      paragraphs:
        - text: She digs beside the white stone. The first hole has no acorn.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Then Hazel remembers brush with silver-backed leaves near a rock shelf.
    - id: p04
      illustration: p04
      paragraphs:
        - text: She searches three clumps. Her claw taps a hard shell under the last one.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Two acorns wait there. Hazel shares one with Rook under the snowy brush.
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Through winter, some holes are empty. Because stores are spread out, others still hold food."
    - id: p07
      illustration: p07
      paragraphs:
        - text: Warm water begins to run under the creek ice. Spring opens the ground.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Hazel finds a curved green shoot with a split shell.
    - id: p09
      illustration: p09
      paragraphs:
        - text: More shoots rise by the creek and briars. Hazel cannot know which were hers.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Some acorns were moved or eaten. These few stayed buried and began to grow.
    - id: p11
      illustration: p11
      paragraphs:
        - text: A hard wind drops a branch beside the smallest oak. Its leaves scrape the soil.
    - id: p12
      illustration: p12
      paragraphs:
        - text: "Hazel returns and pulls three times. At last, the young oak stands free."
    - id: p13
      illustration: p13
      paragraphs:
        - text: Not every seedling lasts until summer. One beside the log grows dark green leaves.
    - id: p14
      illustration: p14
      paragraphs:
        - text: "In fall, Hazel buries a new acorn farther away. “I remember this one,” she says."
