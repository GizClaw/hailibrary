schema_version: 3
language: zh-CN
writer: 铜罗盘
title: 醒来的橡果
summary: 榛榛靠地标寻找冬粮。春天，她没找回的橡果带来了另一种结果。
chapters:
  - id: ch01
    title: 冬天
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 长出来的
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 第一个小坑没有橡果后，榛榛想起了什么？
    answer: 榛榛想起石坡旁的灌木。
    page_refs:
      - p02
      - p03
  - id: q02
    type: cause-effect
    prompt: 有些坑空了，榛榛为什么还能找到食物？
    answer: 橡果分散藏着，别的小坑里还有。
    page_refs:
      - p06
  - id: q03
    type: short-answer
    prompt: 一些没找到的橡果后来怎样了？
    answer: 它们留在土里，开始生长。
    page_refs:
      - p08
      - p10
  - id: q04
    type: character-motive
    prompt: 榛榛为什么把断枝拉了三次？
    answer: 她想让小橡树重新站直。
    page_refs:
      - p11
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 大雪藏住树根和石头。榛榛的窝里只剩空果壳。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她在白石边挖土。第一个小坑里没有橡果。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 榛榛想起石坡旁的灌木。风吹过时，叶背发白。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 她找了三丛。最后一丛下面，爪子碰到硬壳。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 那里有两颗。榛榛和黑羽在雪下分吃一颗。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 整个冬天，有些坑是空的。橡果分散藏着，别处还有。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 暖水开始在溪冰下流。春天露出了泥土。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 倒木旁，榛榛看见弯绿芽顶着一片裂果壳。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 溪边和刺莓后也有绿芽。榛榛不知道哪些是自己的。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 有些橡果被搬走或吃掉。这几颗留在土里，开始生长。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 大风吹落一根断枝。最小橡树的叶片擦着泥地。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 榛榛回来拉了三次。小橡树终于重新站直。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 不是每棵幼苗都活到夏天。倒木旁那棵长出深绿叶。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 秋天，榛榛把新橡果埋得更远。“这一颗，我记得。”
