schema_version: 3
language: zh-CN
writer: 铜罗盘
title: 榛榛会动的地图
summary: 榛榛给分散的橡果做记号。雨毁了地图，她只好换一种办法记住地点。
chapters:
  - id: ch01
    title: 计划
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 变化
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 大雨以后发生什么？
    answer: 榛榛发现地图变了。
    page_refs:
      - p07
      - p08
  - id: q02
    type: cause-effect
    prompt: 榛榛为什么换一种记法？
    answer: 雨水弄乱了树枝和石头上的线。
    page_refs:
      - p07
      - p08
      - p12
  - id: q03
    type: short-answer
    prompt: 榛榛现在用什么线索？
    answer: 她看树根、石头和苔藓，也闻松土。
    page_refs:
      - p12
      - p13
  - id: q04
    type: character-motive
    prompt: 榛榛为什么继续行动？
    answer: 她还要为冬天存食物。
    page_refs:
      - p01
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 去年冬天，榛榛挨过饿。今年她想多存食物。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她把好橡果分开埋。小偷不能一下全找到。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 榛榛数着每个小坑。数目越大，她越安心。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 黑羽听见了：“你把一颗数了两次。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 榛榛在白石上刻线。每道线代表十颗。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 她还用树枝指向新坑。现在，她有地图了。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 夜里，大雨流下山坡。叶子、泥土和树枝都动了。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 天亮时，树枝箭头散了。白石也被雨水冲花。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 榛榛重新数刻痕。她分不清哪道是雨痕。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 黑羽说：“冬天要食物，不考总数。”榛榛还是生气。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 榛榛想搬走白石。石头却砸到了她的脚。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 她改看弯树根、裂石头，还有长苔藓的树桩。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 现在，她闻松土，也记住每个地方的样子。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 数目又溜走了。榛榛仍把好橡果藏满树林。
