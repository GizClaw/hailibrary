schema_version: 3
language: en-US
writer: brass-compass
title: Hazel's Moving Map
summary: "Hazel counts many scattered stores and builds a map from marks. Rain ruins it, so she changes how she remembers."
chapters:
  - id: ch01
    title: The Plan
    page_refs:
      - p01
      - p02
