questions:
  - id: q01
    type: sequence
    prompt: What happens to Hazel's stick arrows overnight?
    answer: Rain breaks and scatters them.
    page_refs:
      - p07
      - p08
  - id: q02
    type: cause-effect
    prompt: Why can Hazel no longer trust the marks on the white stone?
    answer: She cannot tell scratches from rain lines.
    page_refs:
      - p09
  - id: q03
    type: short-answer
    prompt: What clues does Hazel use now?
    answer: "She uses roots, rocks, moss, smell, and soft soil."
    page_refs:
      - p12
      - p13
  - id: q04
    type: character-motive
    prompt: Why does Hazel keep hiding good acorns after her count slips away?
    answer: She still wants a safe store for winter.
    page_refs:
      - p01
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "Last winter, Hazel went hungry. This fall, she wants a safe store."
    - id: p02
      illustration: p02
      paragraphs:
        - text: She buries each good acorn alone. A thief cannot find them all.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Hazel counts each cache. The growing total makes her feel ready.
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Rook hears her. “You counted one twice,” he says."
    - id: p05
      illustration: p05
      paragraphs:
        - text: Hazel scratches lines on a white stone. Each line stands for ten.
    - id: p06
      illustration: p06
      paragraphs:
        - text: She also points little sticks toward new caches. Now she has a map.
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Rain runs down the slope at night. It moves leaves, mud, and sticks."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "By morning, her arrows are broken. Water has changed the stone too."
    - id: p09
      illustration: p09
      paragraphs:
        - text: Hazel counts the marks again. She cannot tell scratches from rain lines.
    - id: p10
      illustration: p10
      paragraphs:
        - text: "“Winter needs food, not a total,” Rook says. Hazel is still upset."
    - id: p11
      illustration: p11
      paragraphs:
        - text: Hazel tries to carry the stone. It drops on her toes.
    - id: p12
      illustration: p12
      paragraphs:
        - text: "She studies a bent root, split rock, and mossy stump instead."
    - id: p13
      illustration: p13
      paragraphs:
        - text: Now Hazel smells loose soil and remembers the shape of each place.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Her count slips away. She keeps hiding good acorns across the woods.
