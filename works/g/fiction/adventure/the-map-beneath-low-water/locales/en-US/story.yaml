schema_version: 1
language: en-US
writer: river-wink
title: The Map Beneath Low Water
summary: Ka brings a very confident inlet map, but the tide and a local ferrier revise it with equal confidence.
cast:
  narrator: {display_name: Narrator, tts: {delivery: quick-witted and lively, timbre: bright adult voice, pace: medium-fast, pitch: medium}}
  ka: {display_name: Ka, tts: {delivery: confident then candid, timbre: clear young adult voice, pace: medium-fast, pitch: medium-high}}
  mi: {display_name: Mi, tts: {delivery: practical and amused, timbre: steady adult voice, pace: medium, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Ka had mapped many mountain trails, so he arrived at the inlet carrying extra confidence."}]}
  - {id: p02, illustration: p02, lines: [{speaker: ka, text: "The island seed chest is one straight crossing away. Easy."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "The greenhouse looked close enough to reach in one long sentence."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "As the water fell, three curved sandbars appeared instead of one straight road."}]}
  - {id: p05, illustration: p05, lines: [{speaker: ka, text: "The map shows a line. Surely my feet should follow it."}]}
  - {id: p06, illustration: p06, lines: [{speaker: mi, text: "If the tide reads your map, I can finally take a holiday."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Mi pointed to a band of seaweed high on the dock post."}]}
  - {id: p08, illustration: p08, lines: [{speaker: ka, text: "The water reached that mark earlier. My paper captured only one moment."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Current still ran between the bars. From far away, water and wet sand had blurred together."}]}
  - {id: p10, illustration: p10, lines: [{speaker: ka, text: "My map is impressively straight and unfortunately fixed."}]}
  - {id: p11, illustration: p11, lines: [{speaker: mi, content: [{text: "Board the ferry. Routes here must be read with the "}, {vocabulary: {id: tide, text: tide}}, {text: "."}]}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "The boat curved around the sandbar and followed the open channel."}]}
  - {id: p13, illustration: p13, lines: [{speaker: ka, text: "Even that floating reed shows which way the current moves."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "They collected the seed chest without donating a pair of boots to the mud."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "On their return, rising water erased the sandbar edges."}]}
  - {id: p16, illustration: p16, lines: [{speaker: ka, text: "One frozen picture is not enough. I will draw three water stages."}]}
  - {id: p17, illustration: p17, lines: [{speaker: mi, text: "Add a model ferry, and travelers will know whom to ask first."}]}
  - {id: p18, illustration: p18, lines: [{speaker: ka, text: "A useful map does not speak over a place. It helps me listen."}]}
chapters:
  - {id: ch01, title: Too Straight, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Evidence That Moves, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: Three Water Pictures, page_refs: [p13, p14, p15, p16, p17, p18]}
questions:
  - {id: q01, type: cause-effect, speaker: narrator, prompt: "Why does Ka first expect a straight crossing?", answer: "He treats one fixed line on his map as a route that always exists.", page_refs: [p02, p04, p05]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "What proves that the water level changes?", answer: "Seaweed sits above the current waterline, and rising water later covers the sandbar edges.", page_refs: [p07, p08, p15]}
  - {id: q03, type: compare, speaker: narrator, prompt: "How does Ka's line differ from Mi's route knowledge?", answer: "The line stays fixed, while Mi considers water level, sandbars, and current.", page_refs: [p05, p09, p11, p13]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why does Ka roll up his original map?", answer: "He accepts that the observed inlet does not match its fixed route.", page_refs: [p08, p09, p10]}
  - {id: q05, type: short-answer, speaker: narrator, prompt: "What problem do the three new pictures solve?", answer: "They show that the inlet has different states instead of pretending it has one permanent route.", page_refs: [p15, p16]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "How does the journey change Ka's idea of a map?", answer: "A map should support observation and local knowledge rather than replace a changing place.", page_refs: [p01, p10, p16, p18]}
