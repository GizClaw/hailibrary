schema_version: 1
language: en-US
writer: tomorrow-lens
title: The Route Under New Snow
summary: Fresh snow hides the mountain's old paths, forcing Nara to test a popular route against present evidence and the needs of her whole team.
cast:
  narrator: {display_name: Narrator, tts: {delivery: clear and spacious, timbre: composed adult voice, pace: medium, pitch: medium}}
  nara: {display_name: Nara, tts: {delivery: analytical and calm, timbre: focused adult voice, pace: medium, pitch: medium}}
  timo: {display_name: Timo, tts: {delivery: brisk and inventive, timbre: compact lively voice, pace: medium-fast, pitch: medium-high}}
  vale: {display_name: Vale, tts: {delivery: deliberate and grounded, timbre: deep adult voice, pace: medium-slow, pitch: low}}
  ora: {display_name: Ora, tts: {delivery: composed and relieved, timbre: warm adult voice, pace: medium, pitch: medium-low}}
  loom: {display_name: Trail Loom, tts: {delivery: neutral and concise, timbre: soft synthetic tone, pace: even, pitch: medium}}
pages:
  - id: p01
    illustration: p01
    lines:
      - {speaker: narrator, text: "Snow fell without pause through the night, smoothing the mountain until fences, stones, and old tracks looked equally unfinished."}
      - {speaker: narrator, text: "At dawn, the relay station above Juniper Pass missed its signal. Ora, the keeper, did not answer the backup bell."}
      - {speaker: nara, text: "We will bring a repair kit and enough food to wait out another storm."}
  - id: p02
    illustration: p02
    lines:
      - {speaker: narrator, text: "Timo woke the Trail Loom, a small projector that compared records from earlier supply journeys."}
      - {speaker: loom, text: "Eastern path recommended. It is shorter and has the strongest travel record."}
      - {speaker: timo, text: "One hundred successful trips are a respectable argument."}
      - {speaker: vale, text: "Only if today resembles the days in that record."}
  - id: p03
    illustration: p03
    lines:
      - {speaker: vale, text: "The eastern shelf gathers windblown snow. Last week it was stone; this morning it may be a roof with empty air beneath it."}
      - {speaker: timo, text: "Or the station's silent sensor has confused us. The Loom still receives the old trail markers."}
      - {speaker: nara, text: "Both explanations fit part of what we know. We will test them before choosing."}
  - id: p04
    illustration: p04
    lines:
      - {speaker: narrator, text: "They loaded the battery cart with tools, blankets, and fuel. Timo checked every strap twice because a loose load could pull the short-legged corgi sideways."}
      - {speaker: timo, text: "If the Loom is wrong, I want evidence, not suspicion. It has earned that fairness."}
      - {speaker: nara, text: "Agreed. A reliable tool deserves a careful correction, not blind trust."}
  - id: p05
    illustration: p05
    lines:
      - {speaker: narrator, text: "The eastern approach began with blue stakes that rose above the snow like quiet reeds. Farther on, each stake stood lower than the last."}
      - {speaker: vale, text: "The path has not climbed, yet the snow surface has."}
      - {speaker: narrator, text: "Ahead, a white shelf curved over the slope. Its smoothness made it look safer than the broken rocks around it."}
  - id: p06
    illustration: p06
    lines:
      - speaker: nara
        content: [{text: "The Loom favors this "}, {vocabulary: {id: route, text: route}}, {text: " because many paws completed it before the snowfall."}]
      - {speaker: nara, text: "That record proves the old path existed. It does not measure the new surface."}
      - {speaker: timo, text: "Then we need an observation that separates changed ground from a missing marker."}
  - id: p07
    illustration: p07
    lines:
      - {speaker: vale, text: "I hear a dull answer when I tap this buried edge. Solid ground usually answers sharply."}
      - {speaker: timo, text: "The wind and my hood may be changing the sound. The projector also failed to find the next stake."}
      - {speaker: narrator, text: "Neither dog pretended that one uncertain clue had settled the disagreement."}
      - {speaker: nara, text: "We will look from the rocks without stepping onto the shelf."}
  - id: p08
    illustration: p08
    lines:
      - {speaker: narrator, text: "They backed away and climbed a rocky lookout beside the trail. From there, they could compare two paths without placing the cart on either one."}
      - {speaker: narrator, text: "The eastern shelf was short and narrow. The western ledge curved farther around the mountain, but wind had swept much of its stone bare."}
      - {speaker: vale, text: "Longer does not mean worse. It means we must count different costs."}
  - id: p09
    illustration: p09
    lines:
      - {speaker: narrator, text: "Low sunlight reached beneath the eastern shelf and drew a dark line across the slope. Through one gap, Nara saw moving air lift loose crystals."}
      - {speaker: timo, text: "That is not a shadow lying on stone. It is space beneath a bridge of snow."}
      - {speaker: vale, text: "So the strange sound and the hidden stakes came from the same change."}
  - id: p10
    illustration: p10
    lines:
      - {speaker: narrator, text: "Beyond the gap, one blue stake still stood upright. The Loom brightened as if the marker had defended its choice."}
      - {speaker: nara, text: "That stake proves where the path was. It cannot prove that the snow between us and the stake will hold."}
      - {speaker: timo, text: "The data is accurate, but our first interpretation was not."}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "Nara rejected the eastern path and marked its stored record as outdated for present conditions."}
      - {speaker: nara, text: "We are not erasing a hundred safe journeys. We are adding the first journey after this snowfall."}
      - {speaker: narrator, text: "Timo had wanted to defend the Loom, yet he smiled when its record became more honest."}
  - id: p12
    illustration: p12
    lines:
      - {speaker: vale, text: "The western ledge is broad enough for the cart, and its exposed stones give us firm steps."}
      - {speaker: timo, text: "It also adds three bends and almost twice the distance."}
      - {speaker: nara, text: "Then our route problem is solved, but our power problem has become harder."}
      - {speaker: narrator, text: "The rescue depended on both answers, not merely on finding safe ground."}
  - id: p13
    illustration: p13
    lines:
      - {speaker: timo, text: "The battery was packed for the eastern trip. A bright projection all the way around the western ledge may leave no power for repairs."}
      - {speaker: vale, text: "We can walk without the beam while the stone remains visible."}
      - {speaker: nara, text: "And save it for junctions, fog, or an emergency. The tool should work where uncertainty is greatest."}
  - id: p14
    illustration: p14
    lines:
      - {speaker: timo, text: "You and Vale could go ahead. I could stay here with the heavy cart and save nearly all the power."}
      - {speaker: narrator, text: "The suggestion reduced battery use, but it left Timo alone below a weakening sky and separated the repair kit from the repairers."}
      - {speaker: nara, text: "We plan for one team. A solution that abandons its slowest member is not complete."}
  - id: p15
    illustration: p15
    lines:
      - {speaker: nara, text: "Loom, show only the next junction, then sleep until we call."}
      - {speaker: narrator, text: "Timo lowered the lens and disconnected its warming plate between uses. The remaining charge now covered the longer journey with a small reserve."}
      - {speaker: timo, text: "Apparently even a machine can improve its manners by speaking less often."}
      - {speaker: vale, text: "Some dogs could try that experiment too."}
  - id: p16
    illustration: p16
    lines:
      - {speaker: narrator, text: "Vale led them onto the western ledge, testing exposed stone before the loaded cart followed. Nara watched both the clouds and Timo's pace."}
      - {speaker: narrator, text: "At the first bend, the Loom flashed a brief path across drifting powder, then went dark again."}
      - {speaker: timo, text: "A short answer, delivered at the useful moment."}
  - id: p17
    illustration: p17
    lines:
      - {speaker: narrator, text: "The ledge climbed gently, but each bend pushed the cart toward the outer edge. The team shortened the tow line and moved at the speed that kept all four wheels steady."}
      - {speaker: vale, text: "We are losing minutes."}
      - {speaker: nara, text: "We are also keeping the tools, the cart, and Timo together. Those minutes purchase something real."}
  - id: p18
    illustration: p18
    lines:
      - {speaker: narrator, text: "Ora opened the relay shelter before they could knock. She had conserved heat after the signal failed and had watched their lamps approach from the west."}
      - {speaker: ora, text: "I hoped whoever came would check the mountain instead of following old tracks. The eastern shelf sounded hollow before dawn."}
      - {speaker: timo, text: "Your observation confirms our reading, but it arrived after our decision."}
  - id: p19
    illustration: p19
    lines:
      - {speaker: narrator, text: "Inside the relay box, Timo found frost around a loosened contact. The route sensors had continued working; the damaged connection had stopped the station's outgoing signal."}
      - {speaker: timo, text: "We began with two possible explanations. Changed snow explains the route warning, while this contact explains the silence."}
      - {speaker: nara, text: "One mystery did not need one cause."}
  - id: p20
    illustration: p20
    lines:
      - {speaker: narrator, text: "While they repaired the contact, wind erased their newest tracks outside. Returning immediately would have exchanged a warm shelter for a route becoming harder to read."}
      - {speaker: ora, text: "The forecast window has closed. We have food, fuel, and room."}
      - {speaker: nara, text: "Then waiting is part of the journey, not a failure to continue it."}
  - id: p21
    illustration: p21
    lines:
      - {speaker: narrator, text: "They built a new route record together. Vale described the hollow sound, Timo entered the battery cost, and Ora added what she had heard before sunrise."}
      - {speaker: nara, text: "Record the eastern gap, the cart-friendly ledge, the weather, and what remains uncertain beneath untouched snow."}
      - {speaker: timo, text: "Future travelers will see observations, not a command pretending to be certainty."}
  - id: p22
    illustration: p22
    lines:
      - {speaker: narrator, text: "The next clear morning, the four dogs returned by the western ledge. Their new entry did not label one path best forever."}
      - {speaker: nara, text: "A route is a claim about a changing place. Evidence must be allowed to change it."}
      - {speaker: timo, text: "And a trustworthy record includes the day it was wrong, the reason it changed, and the questions still open."}
chapters:
