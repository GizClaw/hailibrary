  - {id: ch02, title: What the New Snow Hid, page_refs: [p08, p09, p10, p11, p12, p13, p14, p15]}
  - {id: ch03, title: One Team, Revised Map, page_refs: [p16, p17, p18, p19, p20, p21, p22]}
questions:
  - {id: q01, type: compare, speaker: narrator, prompt: "How do Vale and Timo initially explain the route conflict?", answer: "Vale thinks new snow has made the shelf hollow, while Timo suspects a missed marker or sensor error.", page_refs: [p03, p04, p07]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "Which observation shows that the eastern route record is outdated?", answer: "A visible gap lies beneath the snow shelf even though an old route stake stands beyond it.", page_refs: [p05, p09, p10]}
  - {id: q03, type: evaluate, speaker: narrator, prompt: "Why does Nara refuse to split the team?", answer: "Weather is worsening, and separating would leave Timo alone with the cart while weakening the group's ability to respond.", page_refs: [p13, p14, p20]}
  - {id: q04, type: evidence, speaker: narrator, prompt: "Which actions solve both the route and battery problems?", answer: "They take the broad western shelf together and project light only at nearby junctions.", page_refs: [p12, p15, p16, p17]}
  - {id: q05, type: compare, speaker: narrator, prompt: "What is the difference between the cause of the silence and the danger on the route?", answer: "A loose frosted contact silences the station, while changed snow makes the stored eastern path unsafe.", page_refs: [p09, p11, p19]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "What does Nara mean when she calls a route a claim?", answer: "A mapped route depends on observations and conditions, so new evidence may require a different choice.", page_refs: [p06, p10, p21, p22]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: "Does the Trail Loom become useless after its mistake? Explain.", answer: "No. It remains useful when it shows limited suggestions, preserves uncertainty, and leaves decisions to the team.", page_refs: [p11, p15, p21, p22]}
