schema_version: 1
language: zh-CN
writer: 明日镜
title: 新雪掩埋旧路之后
summary: 一场新雪埋住了旧路。娜拉必须放下“大家都走过”的答案，重新观察眼前的山，也照顾整支队伍的需要。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 清楚开阔, timbre: 沉静的成年声音, pace: 中速, pitch: 中音}}
  nara: {display_name: 娜拉, tts: {delivery: 冷静分析, timbre: 专注的成年声音, pace: 中速, pitch: 中音}}
  timo: {display_name: 蒂莫, tts: {delivery: 干脆机灵, timbre: 活泼紧凑的声音, pace: 中快速, pitch: 中高音}}
  vale: {display_name: 瓦勒, tts: {delivery: 不慌不忙, timbre: 低沉的成年声音, pace: 中慢速, pitch: 低音}}
  ora: {display_name: 奥拉, tts: {delivery: 镇定而如释重负, timbre: 温暖的成年声音, pace: 中速, pitch: 中低音}}
  loom: {display_name: 织路仪, tts: {delivery: 中性简洁, timbre: 柔和的合成声音, pace: 匀速, pitch: 中音}}
pages:
  - id: p01
    illustration: p01
    lines:
      - {speaker: narrator, text: "雪整整下了一夜。围栏、石块和旧脚印都被抹平，满山像一件还没做完的白色模型。"}
      - {speaker: narrator, text: "天刚亮，刺柏山口的中继站就错过了例行信号，守站的奥拉也没有回应备用铃。"}
      - {speaker: nara, text: "带上修理箱，也带够等一场风雪的食物。"}
  - id: p02
    illustration: p02
    lines:
      - {speaker: narrator, text: "蒂莫唤醒织路仪。这个小投影器会把从前运送物资的记录放在一起比较。"}
      - {speaker: loom, text: "建议走东路。路程更短，成功通行的记录也最多。"}
      - {speaker: timo, text: "一百次顺利抵达，听起来很有说服力。"}
      - {speaker: vale, text: "前提是今天的山还和那一百天一样。"}
  - id: p03
    illustration: p03
    lines:
      - {speaker: vale, text: "东边的石台会积住风吹来的雪。上周脚下是石头，今天可能只剩一层架在空中的雪壳。"}
      - {speaker: timo, text: "也可能是失联的感应器让我们多心。织路仪仍然收得到旧路桩。"}
      - {speaker: nara, text: "两种解释都说得通一部分。先去找能把它们分开的证据。"}
  - id: p04
    illustration: p04
    lines:
      - {speaker: narrator, text: "他们把工具、毛毯和燃料绑上电池车。蒂莫把每根带子都检查两遍，免得歪斜的重物把腿短的自己拖倒。"}
      - {speaker: timo, text: "如果织路仪错了，我要的是证据，不是一句怀疑。它过去那么可靠，理应得到公平的检查。"}
      - {speaker: nara, text: "同意。认真纠正一个可靠的工具，和盲目相信它，并不是一回事。"}
  - id: p05
    illustration: p05
    lines:
      - {speaker: narrator, text: "东路开头立着一排蓝色路桩，像从雪里长出的细芦苇。越往前走，路桩露在外面的部分就越短。"}
      - {speaker: vale, text: "小路并没有爬坡，雪面却越来越高。"}
      - {speaker: narrator, text: "前方，一大片雪从坡上探出去。它光滑得没有一点裂痕，反而比四周裸露的乱石更显得安全。"}
  - id: p06
    illustration: p06
    lines:
      - speaker: nara
        content: [{text: "织路仪推荐这条"}, {vocabulary: {id: route, text: 路线}}, {text: "，是因为下雪以前，许多队伍都从这里走完了全程。"}]
      - {speaker: nara, text: "这些记录能证明旧路存在，却没有量过眼前的新雪。"}
      - {speaker: timo, text: "那就找一种观察，看看究竟是地面变了，还是仪器漏掉了路桩。"}
  - id: p07
    illustration: p07
    lines:
      - {speaker: vale, text: "我敲雪层边缘，听见的是闷响。实心地面往往响得更脆。"}
      - {speaker: timo, text: "风声和我的兜帽也会改变声音。投影器确实还没找到下一根路桩。"}
      - {speaker: narrator, text: "一条含糊的线索，没有让谁急着宣布胜利。"}
      - {speaker: nara, text: "别踩上去。我们退到旁边的石台，从侧面看。"}
  - id: p08
    illustration: p08
    lines:
      - {speaker: narrator, text: "他们原路退开，登上一处安全的岩台。站在那里，不必把小车开上任何一条路，就能同时看清两边。"}
      - {speaker: narrator, text: "东边雪台又窄又近；西边石脊绕得更远，表面的雪却被风刮走了不少。"}
      - {speaker: vale, text: "远不等于差，只是要计算另一套代价。"}
  - id: p09
    illustration: p09
    lines:
      - {speaker: narrator, text: "低斜的阳光钻到东边雪台下面，在山坡上拉出一道暗线。一个缺口里，松散的雪粒正被穿过的风轻轻托起。"}
      - {speaker: timo, text: "那不是贴在石头上的影子，而是雪桥下面的空隙。"}
      - {speaker: vale, text: "闷响和消失的路桩，原来都来自同一个变化。"}
  - id: p10
    illustration: p10
    lines:
      - {speaker: narrator, text: "空隙对面，一根蓝色路桩仍旧站得笔直。织路仪随即亮起来，仿佛那根路桩替它证明了什么。"}
      - {speaker: nara, text: "它只能证明路从前在那里，不能证明我们脚下到路桩之间的雪撑得住。"}
      - {speaker: timo, text: "数据没有撒谎，是我们起初把它解释错了。"}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "娜拉否决东路，把那条通行记录标明为“不适用于当前雪况”。"}
      - {speaker: nara, text: "我们不是抹掉过去一百次安全通行，而是在后面补上下雪后的第一次观察。"}
      - {speaker: narrator, text: "蒂莫原本一心替织路仪辩护，如今记录变得更诚实，他反倒松了一口气。"}
  - id: p12
    illustration: p12
    lines:
      - {speaker: vale, text: "西边石脊露着结实的石面，也够宽，电池车能过去。"}
      - {speaker: timo, text: "可它多了三个弯，路程差不多翻倍。"}
      - {speaker: nara, text: "安全路线找到了，电量问题却更难了。"}
      - {speaker: narrator, text: "要完成救援，两道题都得回答，不能只顾脚下有路。"}
  - id: p13
    illustration: p13
    lines:
      - {speaker: timo, text: "电池是按东路准备的。要是一路保持明亮投影，绕到西边以后，修理中继站可能就没电了。"}
      - {speaker: vale, text: "石面看得清的时候，我们可以不用光。"}
      - {speaker: nara, text: "把电留给岔口、浓雾和紧急情况。工具应该用在最拿不准的地方。"}
  - id: p14
    illustration: p14
    lines:
      - {speaker: timo, text: "要不你和瓦勒先走，我守着重车留下来，几乎一点电也不用。"}
      - {speaker: narrator, text: "这个办法省电，却会让蒂莫独自待在越来越阴沉的天空下，也会让修理箱和修理的人分开。"}
      - {speaker: nara, text: "我们按一支队伍来计划。把走得最慢的伙伴扔下，不能算完整的办法。"}
  - id: p15
    illustration: p15
    lines:
      - {speaker: nara, text: "织路仪，只照亮下一个岔口，然后休眠，等我们再叫你。"}
      - {speaker: narrator, text: "每次用完，蒂莫就放低镜头，断开保温片。剩下的电足够绕远，还能留下一小部分备用。"}
      - {speaker: timo, text: "看来机器少说几句，举止也会变好。"}
      - {speaker: vale, text: "有些狗也可以试试这个办法。"}
  - id: p16
    illustration: p16
    lines:
      - {speaker: narrator, text: "瓦勒走上西边石脊，每一步都踩稳后，才让装满物资的小车跟进。娜拉同时留意云层和蒂莫的步子。"}
      - {speaker: narrator, text: "到第一个弯，织路仪在飘雪上投出一小段亮路，很快又暗了下去。"}
      - {speaker: timo, text: "话不多，时机正好。"}
  - id: p17
    illustration: p17
    lines:
      - {speaker: narrator, text: "石脊慢慢升高，每个急弯都会把小车带向外侧。他们缩短牵引绳，把速度降到四只轮子都不打滑为止。"}
      - {speaker: vale, text: "这样会晚到好几分钟。"}
      - {speaker: nara, text: "换来的，是工具、小车和蒂莫都在队伍里。这几分钟花得有去处。"}
  - id: p18
    illustration: p18
    lines:
      - {speaker: narrator, text: "他们还没来得及敲门，奥拉已经打开石屋。信号中断后，她一直节省取暖燃料，也看见了从西边靠近的灯光。"}
      - {speaker: ora, text: "我就盼着来人先看看眼前的山，别只顾追旧脚印。天亮前，东边雪台听着已经发空。"}
      - {speaker: timo, text: "这能印证我们的判断，不过我们作决定时，还没有这条消息。"}
  - id: p19
    illustration: p19
    lines:
      - {speaker: narrator, text: "打开中继箱，蒂莫发现一个接点结了霜，又被冷缩拉松。路线感应器一直正常，坏掉的是向外发送信号的连接。"}
      - {speaker: timo, text: "出发时有两种解释。现在看，新雪说明东路为何危险，松动的接点说明中继站为何沉默。"}
      - {speaker: nara, text: "一个谜团，不一定只有一个原因。"}
  - id: p20
    illustration: p20
    lines:
      - {speaker: narrator, text: "修好接点时，风已经抹去了他们刚留下的脚印。马上返程，等于离开暖和的石屋，走进一条越来越难辨认的路。"}
      - {speaker: ora, text: "适合赶路的天气已经过去。这里有食物、有燃料，也住得下大家。"}
      - {speaker: nara, text: "那就等。等待也是这趟行程的一部分，不是没能继续前进。"}
  - id: p21
    illustration: p21
    lines:
      - {speaker: narrator, text: "四只狗一起补写路线记录。瓦勒描述雪下的闷响，蒂莫记下电量消耗，奥拉补上日出前听到的动静。"}
      - {speaker: nara, text: "写清东边的空隙、西边能过小车的石脊、当时的天气，也写清没踩过的雪下面仍有什么不知道。"}
      - {speaker: timo, text: "后来者看到的是观察，不是一道假装永远正确的命令。"}
  - id: p22
    illustration: p22
    lines:
      - {speaker: narrator, text: "第二天放晴，四只狗沿西边石脊下山。新记录没有把某条路封成永远最好的答案。"}
      - {speaker: nara, text: "路线是我们对一处不断变化的地方所作的判断。证据变了，判断也必须能变。"}
      - {speaker: timo, text: "可信的记录还该留下：哪天错过，为什么修改，以及哪些问题依旧没有答案。"}
chapters:
  - {id: ch01, title: 走过最多的路, page_refs: [p01, p02, p03, p04, p05, p06, p07]}
  - {id: ch02, title: 新雪藏住了什么, page_refs: [p08, p09, p10, p11, p12, p13, p14, p15]}
  - {id: ch03, title: 一支队伍，一张新图, page_refs: [p16, p17, p18, p19, p20, p21, p22]}
questions:
  - {id: q01, type: compare, speaker: narrator, prompt: "瓦勒和蒂莫起初怎样解释路线不对劲？", answer: "瓦勒怀疑新雪下面已经空了，蒂莫则怀疑路桩或感应器出了错。", page_refs: [p03, p04, p07]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "什么证据说明东路的旧记录已经过期？", answer: "雪层下面露出空隙，可空隙对面仍立着旧路桩。", page_refs: [p05, p09, p10]}
  - {id: q03, type: evaluate, speaker: narrator, prompt: "娜拉为什么不肯让队伍分开？", answer: "风雪正在加重。若分开，蒂莫就会独自守着小车，整支队伍也更难互相照应。", page_refs: [p13, p14, p20]}
  - {id: q04, type: evidence, speaker: narrator, prompt: "哪些行动同时解决了绕路和电量不足的问题？", answer: "他们一起走能过小车的西路，只在岔口打开投影。", page_refs: [p12, p15, p16, p17]}
  - {id: q05, type: compare, speaker: narrator, prompt: "中继站沉默的原因和路上的危险有什么不同？", answer: "中继站是接点结霜松动，东路则是新雪改变了地面。", page_refs: [p09, p11, p19]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "娜拉为什么说“路线只是判断”？", answer: "地图上的路线来自过去的观察；条件变了，就要根据新证据重新选择。", page_refs: [p06, p10, p21, p22]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: "织路仪犯过错以后，是不是就完全没用了？为什么？", answer: "不是。只要它说明局限、保留不确定之处，把决定交给队伍，仍然可以帮助照路和记录。", page_refs: [p11, p15, p21, p22]}
