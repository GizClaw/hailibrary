  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "Work began on the west wall. Swifts still had a clear path. Their nest holes were on the east side."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "After three wet days, fresh dust fell below Nest Four. A crack above it had grown wide."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Lena closed the courtyard. The loose block could hurt people and tear open the hidden nest."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "Mina heard chicks inside. She reminded Lena that the crew had planned to wait."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "Waiting was no longer safe. Removing the stone was safer for people, but it would open the nest."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "The engineer found another way. The crew could support the stone from one side. The entrance could stay clear."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "Lena climbed the scaffold in a harness. Mina watched through a gap in the barrier."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "A parent swift flew toward the nest, saw the lift, and turned away. Then it tried again."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "Lena raised both hands from the wall. The swift passed her helmet and slipped into the old hole."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "The support held until July. One young swift dropped from Nest Four, opened its wings, and climbed."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "After the young birds left, the crew repaired the wall. They kept the used openings and added safe spaces behind them."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "In September, the swifts left toward the northwest. Mina held the ledger open beside seven waiting holes."
          }
        ]
      }
    ]
  }
}
