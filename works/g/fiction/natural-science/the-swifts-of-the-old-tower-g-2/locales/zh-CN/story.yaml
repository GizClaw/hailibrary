  "questions": [
    {
      "id": "q01",
      "type": "cause-effect",
      "prompt": "大家为什么不再照原计划施工？",
      "answer": "大雨让正在使用的巢洞上方出现了危险裂缝。",
      "page_refs": [
        "p02",
        "p03",
        "p05"
      ]
    },
    {
      "id": "q02",
      "type": "short-answer",
      "prompt": "工程师怎样让第四号洞保持畅通？",
      "answer": "工人从侧面托住了松砖。",
      "page_refs": [
        "p06",
        "p09"
      ]
    },
    {
      "id": "q03",
      "type": "sequence",
      "prompt": "梁岚举起双手以后发生了什么？",
      "answer": "亲鸟飞进了原来的洞口。",
      "page_refs": [
        "p08",
        "p09"
      ]
    },
    {
      "id": "q04",
      "type": "character-motive",
      "prompt": "梁岚为什么停下工作？",
      "answer": "她要让亲鸟安全飞回巢洞。",
      "page_refs": [
        "p08",
        "p09"
      ]
    }
  ],
  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "西墙开始修了，东墙仍留着宽宽的飞行通道。雨燕可以飞回原来的巢洞。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "连续下雨三天后，第四号洞下面落了新灰。洞口上方的裂缝变宽了。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "梁岚封闭了院子。松砖会砸伤人，也可能把藏在墙里的巢一起扯开。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "小禾听见幼鸟在墙里叫。她提醒梁岚，大家原来答应要等。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "现在继续等不安全。拆砖能保护行人，却会打开正在使用的巢。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "工程师想出另一个办法。他们可以从侧面托住松砖，并让入口保持畅通。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "梁岚系好安全绳，爬上脚手架。小禾从围挡的缝里看着她。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "一只亲鸟冲向巢洞，看见升降台又转开。绕了一圈，它再次飞来。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "梁岚把双手举离墙面。雨燕擦过安全帽，钻进原来的小洞。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "支撑一直撑到七月。一只幼鸟冲出第四号洞，展开长翅飞上屋脊。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "幼鸟离开后，工人修好东墙。他们保留旧入口，也在墙里留下安全巢腔。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "九月，雨燕向西北飞去。小禾在七道安静的洞口旁压住记录本。"
          }
        ]
      }
    ]
  }
}
