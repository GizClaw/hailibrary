  "questions": [
    {
      "id": "q01",
      "type": "cause-effect",
      "prompt": "小禾为什么擦掉几个红点？",
      "answer": "因为她说不清雨燕进了哪些洞，不能证明那些记录。",
      "page_refs": [
        "p04",
        "p05"
      ]
    },
    {
      "id": "q02",
      "type": "short-answer",
      "prompt": "小禾和老沈确认了几处入口？",
      "answer": "他们确认了七处入口。",
      "page_refs": [
        "p06",
        "p07"
      ]
    },
    {
      "id": "q03",
      "type": "sequence",
      "prompt": "专业人员检查东墙以后发生了什么？",
      "answer": "施工队改变了脚手架位置和施工时间。",
      "page_refs": [
        "p10",
        "p11"
      ]
    },
    {
      "id": "q04",
      "type": "character-motive",
      "prompt": "认真观察为什么重要？",
      "answer": "它让工人知道雨燕真正使用哪些入口。",
      "page_refs": [
        "p06",
        "p12"
      ]
    }
  ],
  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "修缮用的架管到了，春天的天空却还是空的。小禾怕雨燕回来时，巢洞已经被封住。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "傍晚，尖亮的叫声掠过屋顶。十一只雨燕绕着城楼飞，一只钻进松砖下面。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "小禾在施工图上画了一个红圈。她想在开工前找出每一处入口。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "雨燕飞得太快。小禾只看见两只交叉，却急着画了四个入口。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "老沈问：“你看见的是哪两个洞？”小禾指不出来，只好擦掉多画的圈。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "他们连续观察了许多天。只有雨燕再次使用同一个洞，小禾才把圈描深。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "七处入口被确认了。成鸟先带草屑进去，后来又叼着小虫回来喂幼鸟。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "迁徙图上是一段很长的旅程。被追踪的北京雨燕一年往返约三万公里。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "开会时，小禾拿出红圈。梁岚说松砖会掉下来，红圈还不是安全的办法。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "老沈建议先修没有巢的西墙。鸟类专家和工程师一起来检查东墙。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "新计划让脚手架避开雨燕的飞行路线。安全时，有巢的地方要等幼鸟离开。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "小禾看见七个红圈外多了细蓝圈。她认真重做的记录改变了施工位置。"
          }
        ]
      }
    ]
  }
}
