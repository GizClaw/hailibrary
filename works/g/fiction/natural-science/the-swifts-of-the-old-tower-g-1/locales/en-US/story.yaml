  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "The repair poles arrived, but the spring sky was still empty. Mina worried that the swifts would find their nest holes sealed."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "At dusk, sharp cries crossed the roof. Eleven swifts raced around the tower. One vanished under a loose stone."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Mina drew a red circle on the repair plan. She wanted to find every entrance before work began."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "The birds flew too fast. Mina marked four entrances after seeing only two birds cross."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "“Which holes did you see?” Mr. Sayeed asked. Mina could not point to them, so she erased the extra marks."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "They watched from the ground for many afternoons. A circle became dark only after a swift used the same opening again."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "Seven entrances were confirmed. Adults carried nest pieces in, then returned with insects for their hidden chicks."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "A migration map showed a huge journey. Tracked Beijing swifts flew about thirty thousand kilometers each year."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "At the repair meeting, Mina showed her circles. Lena said loose stones could fall. Red marks were not yet a safe plan."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "Mr. Sayeed suggested starting on the empty west wall. A bird specialist and an engineer came to check the east side."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "The new plan moved the scaffold away from the swifts’ flight path. Work near active nests would wait when it was safe."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "Mina found seven fine blue rings around her red circles. Her careful second try had changed where the crew would work."
          }
        ]
      }
    ]
  }
}
