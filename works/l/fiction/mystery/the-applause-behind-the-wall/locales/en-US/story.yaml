schema_version: 2
language: en-US
writer: north-star-map
title: The Applause Behind the Wall
summary: Empty theater walls seem to applaud Iona's rehearsal. She, Ren, and Maia trace the sound to loose ventilation shutters, then repair them without blocking fresh air and improve the theater's warning system.
chapters:
  - id: ch01
    title: An Empty Audience
    page_refs:
      - p01
