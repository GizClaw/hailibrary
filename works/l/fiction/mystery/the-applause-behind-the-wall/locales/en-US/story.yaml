questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: What causes the wall to clap?
    answer: A closing door pushes air through the opening, and the pressure knocks loose shutter blades together.
    page_refs:
      - p08
      - p09
      - p10
      - p11
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which tests rule out Iona's voice as the cause?
    answer: A loud speech produces no clap, while closing the heavy door produces one immediately.
    page_refs:
      - p07
      - p08
  - id: q03
    type: compare
    speaker: narrator
    prompt: How is Ren's repair better than Iona's first plan?
    answer: Sealing would block airflow; new hinges and stops prevent clapping while keeping ventilation open.
    page_refs:
      - p12
      - p13
      - p14
      - p15
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Maia test both light and sound?
    answer: She wants the warning to reach people who notice information in different ways.
    page_refs:
      - p17
      - p18
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What guides the team's two improvements?
    answer: They investigate the cause and protect each system's purpose instead of removing the first problem carelessly.
    page_refs:
      - p06
      - p11
      - p13
      - p14
      - p17
      - p18
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Iona rehearses alone beneath the theater’s work lights. She faces the empty seats. “Tomorrow, every one of you will be full.”
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: When her speech ends, a sudden clap bursts from the side wall. Iona says, “
            - text: Who is hiding there?”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: She searches the empty seats and balcony, but finds no listener.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Ren checks the doors, curtains, and backstage hall. “Something starts that clap. Let’s change one thing at a time.”
    - id: p05
      illustration: p05
      paragraphs:
        - text: Maia taps her drum softly. Dust trembles on the side wall. “That dust moved when we heard the clap.”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "They compare each clap with nearby actions. "
            - text: Both happened after something moved backstage.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Iona repeats her speech loudly. The wall remains silent. Iona says, “
            - text: So my voice is not the cause.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: Ren closes the heavy stage door. The wall answers at once.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Maia places her palm against the wall and feels a brief push. Maia says, “
            - text: The door moved the air.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Behind a panel, Ren finds a loose wooden "
            - vocabulary:
                id: shutter
                text: louver
            - text: ". "
            - text: Its angled blades can guide air through the wall.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "The closing door raises air pressure for a moment. "
            - text: That push knocks the worn blades together.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Iona grabs a roll of cloth. “Then I’ll seal the opening.”
    - id: p13
      illustration: p13
      paragraphs:
        - text: Maia catches the loose end of the cloth. “Don’t seal it. This room still needs fresh air.” Iona lowers the roll.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Ren shows them worn hinge pins and a small soft stop. “New pins will hold the blades apart. Air can still pass.”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: "They replace the hinges and add soft stops. "
            - text: The opening stays clear.
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: Ren closes the door again. The shutters move apart without clapping.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "Maia tests the emergency alert. "
            - text: A bright light flashes while a bell sounds.
    - id: p18
      illustration: p18
      paragraphs:
        - text: Maia sees the flashing light before Iona and Ren turn toward the bell. Iona nods. “You saw the light first. We’ll keep both warnings.”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: During the full rehearsal, fresh air moves quietly and both alerts remain clear.
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: The next applause comes from a real audience. Iona says, “
            - text: This time, I know exactly why the room is clapping.”
