        pitch: 中音
    iona:
      display_name: 艾奥娜
      tts:
        delivery: 充满活力并逐渐学会反思
        timbre: 有力的青年声音
        pace: 中快
        pitch: 中音
    ren:
      display_name: 任
      tts:
        delivery: 冷静而朴实
        timbre: 沉稳的成年声音
        pace: 中速
        pitch: 中低音
    maia:
