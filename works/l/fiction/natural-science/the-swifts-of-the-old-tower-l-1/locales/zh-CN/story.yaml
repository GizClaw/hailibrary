  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "四月十八日，修缮用的架管已经堆在墙下，春天的天空却没有雨燕。小禾担心工人会把看似空着的墙缝封住。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "傍晚，十一只雨燕终于回来了。它们在空中追小虫，掠过护城河喝水，又绕着旧瓦顶飞翔。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "一只雨燕收起长翅，钻进东墙的松砖下面。小禾在施工图上画出第一个红圈。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "她想在开工前找到每一处巢洞入口。老沈同意帮忙，但他们只能站在地面观察。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "两只雨燕在钟洞前交叉，小禾却画了四个入口。等她再次抬头，已经说不清每只鸟飞去了哪里。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "老沈告诉她：“可能发生的事，不是已经看见的事。”小禾擦去红点，纸也被擦薄了。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "他们改变了记录方法，写下时间、方向、进入和飞出。只有同一处洞再次被使用，红圈才算确认。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "最后留下七个圈。成鸟起初带着轻羽和草屑，后来一次次叼回小虫，喂墙里看不见的幼鸟。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "研究地图画出了被追踪的北京雨燕路线。它们一年往返约三万公里，最远到非洲南部越冬。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "小禾想到雨燕飞完这段长路，却只见一块封死的砖。她带着地图和七条记录去参加修缮会议。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "梁岚说出了另一种危险：雨水和冰冻已经让砖块松动。下面每天都有行人，破损的墙不能不管。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "小禾的记录能证明哪些入口正在使用。它不能证明周围的砖安全，也不能决定巢腔该有多深。"
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "老沈建议先修没有巢的西墙。陈老师同时请来鸟类保护人员和结构工程师。"
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "他们观察飞行路线，拍下裂缝，又避开巢腔检查墙体。小禾留在划好的安全线外。"
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "修改后的工期让东侧脚手架避开主要飞行路线。只要安全，有巢的区域就等幼鸟离开再修。"
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "七个红圈外多了七个细蓝圈。经过改正的观察，终于成了所有人都能使用的计划依据。"
          }
        ]
      }
    ]
  }
}
