  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "On April eighteenth, the repair poles waited below the tower, but no swifts crossed the spring sky. Mina feared the crew would seal empty-looking gaps."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "At dusk, eleven swifts returned. They chased insects, skimmed the moat to drink, and raced around the old tiled roof."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "One swift folded its long wings and vanished beneath a loose east stone. Mina drew the first red circle on the work plan."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "She wanted to locate every nest entrance before construction began. Mr. Sayeed agreed to watch only from the ground."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "Two fast birds crossed near the bell opening. Mina marked four entrances, although she could no longer say where each bird had gone."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "“A possibility is not an observation,” the keeper told her. Mina erased until the paper grew thin beneath her pencil."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "They changed their method. They recorded time, direction, entry, and exit, then waited for each opening to be used again."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "Seven circles survived. Adults first carried light nest material, then returned repeatedly with insects for chicks hidden inside the wall."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "A research map showed the route of tracked Beijing swifts. Their yearly round trip of about thirty thousand kilometers reached southern Africa."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "Mina imagined a bird completing that journey and meeting a sealed stone. She carried the map and the seven observations into the repair meeting."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "Lena explained the other danger: water and freezing had loosened stone above a public walkway. The damaged wall could not simply be ignored."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "Mina’s evidence identified active openings. It could not prove that the surrounding stones were secure or define a safe nest space."
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "Mr. Sayeed proposed starting on the unused west wall. The conservator called both a bird specialist and the structural engineer."
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "They checked approach routes, photographed cracks, and stayed away from the nest chambers. Mina waited behind the marked safety line."
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "The revised schedule moved east-side scaffolding away from the main flight path. Work beside active nests would wait whenever safety allowed."
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "Seven thin blue rings appeared around Mina’s red ones. The corrected observations had become one part of a plan the whole team could use."
          }
        ]
      }
    ]
  }
}
