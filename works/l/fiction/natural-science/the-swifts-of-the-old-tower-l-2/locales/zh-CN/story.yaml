  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "五月底，西墙已经罩上防护网，东面仍然敞开。雨燕绕过脚手架，飞进熟悉的巢洞。"
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "雨燕靠近时，工人会停下电钻。每次停工都会影响进度，但亲鸟仍能继续给墙里的幼鸟送食物。"
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "接着，大雨浇了城楼三天。第四天早晨，第四号洞下面出现了一层新灰。"
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "洞口上方的裂缝原来只有草茎宽，现在已经能放进小禾最细的手指。"
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "梁岚封闭了东院。移动的砖块可能砸伤游客，掉下时还可能扯开藏着巢的墙洞。"
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "小禾听见幼鸟的叫声，马上反对施工。梁岚说，只有墙体安全时，等待才是可行的办法。"
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "大家面对两种连在一起的危险。拆砖能保护行人，却会打开巢；完全不动，砖和巢都可能掉下来。"
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "连续拍摄的照片证明裂缝正在变大。亲鸟反复进入，又证明第四号洞还在使用。"
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "工程师根据两类证据改变方法。他们先从侧面固定周围砖体，再用窄支撑托住松砖。"
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "新办法不会堵住入口，也不伸进巢腔。不过它费用更高，封路更久，而且仍可能失败。"
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "梁岚选择了新办法。她系着安全绳爬上湿滑的脚手架，小禾只能从围挡外观看。"
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "一只叼着小虫的亲鸟看见升降台，立刻转开。它第二次飞来时，梁岚把双手举离墙面。"
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "雨燕擦过黄色安全帽，钻进第四号洞。直到短短的尾羽消失，梁岚才继续工作。"
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "支撑成功撑住了松砖。七月，一只幼鸟从洞中跌出，在雨篷上方展开长翅，飞上屋脊。"
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "幼鸟离开后，工人加固东墙，保留确认过的入口。他们还在旧巢附近增加了安全巢腔。"
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "九月，雨燕向西北远去。小禾在七道安静的墙缝旁压住记录本；洞口留下了，归来仍要等待。"
          }
        ]
      }
    ]
  }
}
