  "article": {
    "pages": [
      {
        "id": "p01",
        "illustration": "p01",
        "paragraphs": [
          {
            "text": "By late May, work covered the west wall. The east side stayed open, and swifts curved past the scaffold into their familiar holes."
          }
        ]
      },
      {
        "id": "p02",
        "illustration": "p02",
        "paragraphs": [
          {
            "text": "Workers paused their drills when birds approached. Each delay changed the schedule, but the adults continued feeding their hidden young."
          }
        ]
      },
      {
        "id": "p03",
        "illustration": "p03",
        "paragraphs": [
          {
            "text": "Then rain soaked the tower for three days. On the fourth morning, fresh dust lay below Nest Four."
          }
        ]
      },
      {
        "id": "p04",
        "illustration": "p04",
        "paragraphs": [
          {
            "text": "The crack had once been as narrow as a grass stem. Now it was as wide as Mina’s smallest finger."
          }
        ]
      },
      {
        "id": "p05",
        "illustration": "p05",
        "paragraphs": [
          {
            "text": "Lena closed the east courtyard. The moving block could strike a visitor, and its fall might tear open the nest chamber."
          }
        ]
      },
      {
        "id": "p06",
        "illustration": "p06",
        "paragraphs": [
          {
            "text": "Mina heard the chicks and protested. Lena answered that waiting had been possible only while the wall remained safe."
          }
        ]
      },
      {
        "id": "p07",
        "illustration": "p07",
        "paragraphs": [
          {
            "text": "The team now faced two linked risks. Removing the block would protect the walkway but expose the active nest; doing nothing might destroy both."
          }
        ]
      },
      {
        "id": "p08",
        "illustration": "p08",
        "paragraphs": [
          {
            "text": "Photographs showed how the crack had changed. Repeated visits by parent swifts showed that the entrance was still active."
          }
        ]
      },
      {
        "id": "p09",
        "illustration": "p09",
        "paragraphs": [
          {
            "text": "The engineer used both pieces of evidence. She proposed securing nearby stones and sliding a narrow support beneath the loose block."
          }
        ]
      },
      {
        "id": "p10",
        "illustration": "p10",
        "paragraphs": [
          {
            "text": "The method kept the entrance clear and avoided the nest chamber. It cost more, closed the courtyard longer, and could still fail."
          }
        ]
      },
      {
        "id": "p11",
        "illustration": "p11",
        "paragraphs": [
          {
            "text": "Lena chose the new method. In a safety harness, she climbed the wet scaffold while Mina watched through the barrier."
          }
        ]
      },
      {
        "id": "p12",
        "illustration": "p12",
        "paragraphs": [
          {
            "text": "A parent swift carrying insects saw the lift and turned away. On its second approach, Lena raised both hands from the wall."
          }
        ]
      },
      {
        "id": "p13",
        "illustration": "p13",
        "paragraphs": [
          {
            "text": "The bird passed beside her yellow helmet and entered Nest Four. Only after its tail disappeared did Lena continue."
          }
        ]
      },
      {
        "id": "p14",
        "illustration": "p14",
        "paragraphs": [
          {
            "text": "The support held. In July, a young swift dropped from the opening, spread its long wings above the awnings, and climbed."
          }
        ]
      },
      {
        "id": "p15",
        "illustration": "p15",
        "paragraphs": [
          {
            "text": "Once the young had left, the crew secured the wall and preserved known entrances. They added safe cavities near the old nests."
          }
        ]
      },
      {
        "id": "p16",
        "illustration": "p16",
        "paragraphs": [
          {
            "text": "In September, the swifts departed toward the northwest. Mina held open the ledger beside seven quiet gaps that remained ready, not promised."
          }
        ]
      }
    ]
  }
}
