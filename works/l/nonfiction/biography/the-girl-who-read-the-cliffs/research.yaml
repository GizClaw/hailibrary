schema_version: 1
required: true
sources:
  - url: https://www.nhm.ac.uk/discover/mary-anning-unsung-hero.html
    authority: Natural History Museum, London
    claims:
      - Mary Anning was born in Lyme Regis in 1799, learned fossil collecting from her father, had little formal education, and supported her family by selling finds.
      - Joseph found an ichthyosaur skull in 1811; Mary uncovered the roughly five-meter skeleton during 1812, and male scientists often omitted her credit.
      - Mary found the first complete plesiosaur skeleton in December 1823; Cuvier first doubted drawings, then accepted the find after more evidence.
      - Fossil sales helped Mary support the family after her father died in 1810.
  - url: https://www.nhm.ac.uk/discover/what-is-an-ichthyosaur.html
    authority: Natural History Museum, London
    claims:
      - By early 1813, Joseph and Mary Anning's specimen was the first largely complete ichthyosaur uncovered and was studied by Everard Home in 1814.
      - Ichthyosaurs were extinct marine reptiles, and early scientists debated whether the bones belonged to fish, crocodiles, or other animals.
  - url: https://www.nhm.ac.uk/discover/what-is-a-plesiosaur.html
    authority: Natural History Museum, London
    claims:
      - Mary Anning's 1823 Plesiosaurus was the first complete articulated plesiosaur skeleton discovered and was presented to the Geological Society in 1824.
      - A substantially intact plesiosaur had been found in Nottinghamshire in 1718, while Mary's later specimen was the first complete articulated skeleton.
      - Plesiosaurs were ancient marine reptiles rather than dinosaurs, and the skeleton's long neck helped reveal their unusual body plan.
  - url: https://www.nhm.ac.uk/discover/mary-anning-fossils.html
    authority: Natural History Museum, London
    claims:
      - Mary's specimen was the first largely complete ichthyosaur to be uncovered and scientifically described.
      - Her complete articulated plesiosaur had bones connected in their natural positions, and both finds are represented in the Fossil Marine Reptiles gallery.
  - url: https://www.geolsoc.org.uk/the-library/online-exhibitions/mary-anning-and-the-geological-society/
    authority: Geological Society of London
    claims:
      - Mary Anning's finds were important to understanding life about 200 million years ago.
      - Anning could not become a member of the Geological Society because of her gender, though her work influenced its Fellows.
  - url: https://www.lymeregismuseum.co.uk/about-us/the-mary-anning-experts/
    authority: Lyme Regis Museum
    claims:
      - Joseph found the large skull in a rockfall below Church Cliffs, and Mary exposed the rest over following months.
      - After her father died in 1810, the family relied on poor relief, and Mary's fossil sales helped support them.
      - Mary searched in all weather, prepared and sold fossils, and her work was seldom acknowledged in scientific publications.
  - url: https://www.oumnh.ox.ac.uk/learn-mary-anning-0
    authority: Oxford University Museum of Natural History
    claims:
      - With little formal education, Mary became an expert fossil collector and dealer whose knowledge was sought by scientists.
      - Her work informed male contemporaries, but she could not join the Geological Society and did not always receive credit.
  - url: https://www.geolsoc.org.uk/the-library/online-exhibitions/mary-anning-and-the-geological-society/geologising-with-mary-anning/letter-from-mary-anning/
    authority: Geological Society of London archive
    claims:
      - In a letter to Charlotte Murchison dated 11 October 1833, Mary wrote that a cliff fall killed her dog Tray at her feet and that only a moment separated her from the same fate.
  - url: https://www.geolsoc.org.uk/~/media/shared/documents/education%20and%20careers/Resources/FactSheets/Mary%20Anning%20factsheet.pdf?la=en
    authority: Geological Society of London educational fact sheet
    claims:
      - Mary went fossil hunting after storms exposed new fossils, studied geology and anatomy, and excavated the rest of the roughly five-meter ichthyosaur skeleton.
      - Her gender and working-class background kept her from joining the Geological Society and from receiving full recognition during her life.
  - url: https://charmouth.org/chcc/the-fossil-collecting-code/
    authority: Charmouth Heritage Coast Centre
    claims:
      - Fossils wash out of the cliffs and can be found loose in gravel and shingle on the beach.
      - The best place for the public to look is loose beach material rather than the cliffs.
  - url: https://charmouth.org/chcc/wp-content/uploads/2023/05/West-Dorset-Fossil-Collecting-Code-of-Conduct.pdf
    authority: West Dorset Fossil Collecting Code of Conduct, 2022/23 amendments
    claims:
      - Inexperienced collectors and educational groups should restrict collecting to beaches.
      - Cliff falls can happen without warning; visitors should avoid cliff bases, recent falls, moving rock falls, and mudflows.
      - Visitors should check tide times and collect on a falling tide.
  - url: https://charmouth.org/chcc/fossil-hunting-walks/
    authority: Charmouth Heritage Coast Centre
    claims:
      - Children on the Centre's public fossil walks must be accompanied by an adult.
  - url: https://ocean.si.edu/ocean-life/invertebrates/unearthing-history-mary-annings-hunt-prehistoric-ocean-giants
    authority: Smithsonian Ocean
    claims:
      - The account of Mary's survival after an 1800 lightning strike inspired local lore that the event changed her intelligence.
  - url: https://blogs.loc.gov/folklife/2017/07/she-sells-seashells-and-mary-anning-metafolklore-with-a-twist/
    authority: American Folklife Center, Library of Congress; Stephen Winick
    claims:
      - No evidence connects Mary Anning to the tongue twister "She sells seashells on the seashore"; the association appeared long after her lifetime.
notes: |-
  Surviving accounts differ in how they compress the ichthyosaur discovery: some say 1810–1811, while Natural History Museum research separates Joseph's 1811 skull from Mary's 1812 excavation, completed by early 1813. The work uses the latter sequence and says "by early 1813." Sources also differ on the later year women were admitted to the Geological Society, so the work states only that women could not join during Mary's lifetime.

  Mary's October 1833 account of Tray's death is documented in her own surviving letter to Charlotte Murchison and is used as evidence of the cliffs' danger. The dramatic 1800 lightning-survival account and its claim that the event changed Mary's intelligence are treated as local lore and omitted from the article. The supposed link between Mary and "She sells seashells" has no known evidence according to American Folklife Center folklorist Stephen Winick and is also omitted.

  Rockfall exposure is stated for Joseph's find. Present-day safety advice comes from the Charmouth fossil code and the West Dorset code: inexperienced visitors should search loose material on the beach, avoid cliff bases and fresh or moving slips, and check the tides. The adult-accompaniment line follows the Heritage Coast Centre's rule for its public children's fossil walks.
