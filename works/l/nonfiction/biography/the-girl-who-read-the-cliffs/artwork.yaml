continuity: |-
  Mary keeps an oval face, dark brown eyes, center-parted chestnut hair under a plain cream bonnet, sea-green wool dress, ochre shawl, brown apron, wicker basket, and small geology hammer. In 1811–1813 she is a slight twelve-to-thirteen-year-old; in 1823 and later she is an adult with the same features and palette. Joseph has wavy chestnut hair, a gray cap, rust-brown wool coat, cream shirt, and dark trousers. Lyme Regis has layered blue-gray cliffs, a pebble beach, gray-green sea, and cool daylight. No image contains text or symbols.
assets:
  - {id: cover, file: artwork/cover.webp, scene: Adult Mary stands on the Lyme Regis pebble beach studying layered cliffs while a large marine-reptile fossil shape is visible in fallen stone nearby.}
  - {id: p01, file: artwork/p01.webp, scene: Young Mary and Joseph learn to collect small fossils with their carpenter father on the Lyme Regis beach near town.}
  - {id: p02, file: artwork/p02.webp, scene: Young Mary studies newly fallen blue-gray rock below the layered cliffs after rain, keeping on the open beach.}
  - {id: p03, file: artwork/p03.webp, scene: Joseph points out a large fossil skull while young Mary carefully uncovers a connected line of bones in fallen rock.}
  - {id: p04, file: artwork/p04.webp, scene: Young Mary cleans and prepares the large fossil slab beside her basket before a well-dressed buyer.}
  - {id: p05, file: artwork/p05.webp, scene: Learned men in an early nineteenth-century London room examine the ichthyosaur fossil while Mary is absent.}
  - {id: p06, file: artwork/p06.webp, scene: A scientific paper and the fossil sit before male scholars while young Mary's empty place is suggested by her basket and tools at the edge; all paper is blank and wordless.}
  - {id: p07, file: artwork/p07.webp, scene: Older Mary studies anatomy books, makes a careful wordless fossil drawing, and compares it with cleaned bones in her Lyme Regis shop.}
  - {id: p08, file: artwork/p08.webp, scene: Adult Mary reveals a nearly complete long-necked plesiosaur skeleton in a broad slab of cliff rock.}
  - {id: p09, file: artwork/p09.webp, scene: Adult Mary makes an exact wordless anatomical drawing beside the long-necked plesiosaur bones, with a sealed envelope ready to carry a copy abroad.}
  - {id: p10, file: artwork/p10.webp, scene: Male scholars compare the long-necked plesiosaur skeleton with several wordless anatomical drawings at an 1824 meeting; Mary is absent.}
  - {id: p11, file: artwork/p11.webp, scene: Scholars trace the real long neck and connected bones of the plesiosaur while Mary's tools rest beside the prepared slab.}
  - {id: p12, file: artwork/p12.webp, scene: Adult Mary works alone in her modest Lyme Regis shop, cleaning fossils and comparing them with wordless anatomical drawings outside formal scientific institutions.}
  - {id: p13, file: artwork/p13.webp, scene: Scientists and visitors respectfully consult adult Mary among carefully prepared fossils in her small Lyme Regis shop.}
  - {id: p14, file: artwork/p14.webp, scene: A present-day museum gallery displays Mary's ichthyosaur and plesiosaur while a view beyond leads back to the layered Lyme Regis cliffs; no labels are visible.}
