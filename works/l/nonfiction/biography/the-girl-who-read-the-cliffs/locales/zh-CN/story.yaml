schema_version: 2
language: zh-CN
writer: 北辰
title: 读懂悬崖的女孩
summary: 玛丽·安宁从莱姆里吉斯的岩石中找到远古海洋动物。她带来的证据改变了科学，可当时的科学界常常没有写下她的名字。
chapters:
  - {id: ch01, title: 海边石层里的秘密, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 长得出奇的脖子, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: ch03, title: 骨头旁边的名字, page_refs: [p12, p13, p14]}
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 山石滑落怎样既帮助玛丽，又给她带来危险？
    answer: 它会让化石露出来，也曾砸死小狗特雷，差点砸死玛丽。
    page_refs: [p02, p03]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪两件事说明玛丽不只是看见了古老的骨头？
    answer: 她仔细挖出并清理鱼龙化石，还为蛇颈龙画图、比较每块骨头的位置。
    page_refs: [p03, p04, p07, p09]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 人们起初怎样看待鱼龙和蛇颈龙？后来又有什么变化？
    answer: 人们起初都不清楚它们是什么，甚至怀疑蛇颈龙是假的；更多证据让科学家改变了看法。
    page_refs: [p05, p09, p10]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 玛丽为什么要卖掉找到的化石？
    answer: 她家里很穷，需要靠卖化石得到一些收入。
    page_refs: [p01, p04]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 玛丽的发现和她受到的对待，合起来说明了什么？
    answer: 她的证据推动了科学，可当时的规则和偏见使她没有得到充分认可。
    page_refs: [p05, p06, p10, p11, p12, p14]
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: 居维叶为什么不再怀疑蛇颈龙化石？
    answer: 更多图画和彼此相连的骨头证明了这具奇特的骨架是真的。
    page_refs: [p09, p10, p11]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "1799年，玛丽·安宁出生在英国海边的小城莱姆里吉斯。她家境贫寒。父亲做木工养家，也把寻找和清理"
            - vocabulary: {id: fossil, text: 化石}
            - text: "的本领教给玛丽和哥哥约瑟夫。"
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "海浪和大雨不断改变海边的"
            - vocabulary: {id: cliff, text: 悬崖}
            - text: "。山石滑落会露出化石，也会夺去生命。多年后的1833年10月，悬崖突然塌下来，砸死了玛丽脚边的小狗特雷。她后来写信说，自己也差点被砸死。"
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "早在1811年，约瑟夫在悬崖下找到一个巨大的化石头骨。玛丽继续寻找藏在岩石中的部分。到1813年初，一副约五米长的"
            - vocabulary: {id: skeleton, text: 骨架}
            - text: "渐渐显出了形状。"
    - id: p04
      illustration: p04
      paragraphs:
        - text: 镇上的人从没见过这样的动物。玛丽一点点清掉岩石，整理好沉重的化石。1810年父亲去世后，卖化石的钱帮她养家。这副骨架后来送到伦敦，由科学家研究。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 有人先把它当成鳄鱼。经过多年研究，科学家认出这是一种已经灭绝的海洋爬行动物。它后来叫作鱼龙。它是第一副出土并得到科学描述的大体完整的鱼龙骨架。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 论文让更多人知道了这种奇怪的动物。有些文章却没有写下发现者玛丽的名字。读者能看见化石和男科学家的解释。玛丽在海边寻找、清理化石的劳动却很少出现。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 玛丽没有因此停下。她读解剖学和地质学的书，认真画出骨头的样子。她还把不同化石放在一起比较。玛丽上学不多，可她的判断仍很可靠。不少访客和科学家前来请教。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 1823年12月，玛丽又发现一副奇特的骨架。骨头仍连接在原来的位置上。这是人们发现的第一副完整的蛇颈龙骨架。它头小，脖子却长得出奇。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 玛丽照着骨头的位置画了一幅图。法国科学家乔治·居维叶看过图后，觉得脖子上的骨头多得不合常理。他猜，这块化石也许是假的，或者是两只动物的骨头拼成的。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 更多图画很快送到科学家手中。1824年，地质学会专门开会讨论这块化石，玛丽没有受到邀请。这些证据说明化石是真的，居维叶便不再怀疑。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 科学家终于正式介绍了这种古老的海洋动物。原先让人怀疑的长脖子，成了认识蛇颈龙的重要证据。可是，向众人介绍发现的是男性学者。找到并整理化石的玛丽仍站在科学团体之外。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 玛丽的名字被漏掉，不只是一两次粗心。当时，女性不能加入地质学会。玛丽出身于贫穷的手艺人家庭，上学也不多，很难进入科学团体。买走化石的人和发表文章的男性常常更受公众注意。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 不过，玛丽在世时已有不少人敬重她的知识。访客和科学家走进她的小店，询问她在岩层中看到的线索。博物馆收藏了她找到的化石，有些旧记录却没有清楚写出她做过什么。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 今天，玛丽发现的化石仍陈列在英国自然历史博物馆的海洋爬行动物展厅。去莱姆里吉斯海边找化石，要和大人一起，只捡散落在沙滩上的化石。远离崖脚和刚塌下的山石，还要留意潮水。
