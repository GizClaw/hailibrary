    narrator:
      display_name: 旁白
      tts: {delivery: 平静清楚，带有克制的好奇, timbre: 清亮的成年女声, pace: 中速, pitch: 中低}
    mary:
      display_name: 玛丽·安宁
      tts: {delivery: 耐心坚定，观察时专注, timbre: 清晰的年轻女声, pace: 中速, pitch: 中高}
    joseph:
      display_name: 约瑟夫·安宁
      tts: {delivery: 务实警觉，说话直接, timbre: 明亮的少年男声, pace: 稍快, pitch: 中等}
