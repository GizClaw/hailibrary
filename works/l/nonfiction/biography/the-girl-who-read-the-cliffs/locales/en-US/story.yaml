schema_version: 2
language: en-US
writer: north-star-map
title: The Girl Who Read the Cliffs
summary: Mary Anning learned to find ancient sea animals in the cliffs of Lyme Regis. Her careful evidence changed science, although the scientific world often left her name out.
chapters:
  - {id: ch01, title: Stones from the Sea, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: A Neck No One Expected, page_refs: [p06, p07, p08, p09, p10, p11]}
  - {id: ch03, title: The Name Beside the Bones, page_refs: [p12, p13, p14]}
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: How did rockfalls both help and endanger Mary?
    answer: They exposed fossils, but one fall killed Tray and almost killed Mary.
    page_refs: [p02, p03]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which two details show that Mary did more than simply notice old bones?
    answer: She carefully uncovered and prepared the ichthyosaur, and later she drew and compared the plesiosaur bones.
    page_refs: [p03, p04, p07, p09]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How were the first reactions to the ichthyosaur and plesiosaur alike?
    answer: Some scientists first doubted what each animal was, but more study and evidence changed their views.
    page_refs: [p05, p09, p10]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why did Mary sell the fossils she found?
    answer: Her family had little money and depended partly on money from fossil sales.
    page_refs: [p01, p04]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What main idea connects Mary's discoveries with the way people treated her?
    answer: Her evidence helped change science, but barriers kept her from receiving full public credit.
    page_refs: [p05, p06, p10, p11, p12, p14]
  - id: q06
    type: short-answer
    speaker: narrator
    prompt: Why did Cuvier change his mind about the plesiosaur?
    answer: More drawings and the connected bones showed that the unusual skeleton was real.
    page_refs: [p09, p10, p11]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "In 1799, Mary Anning was born in Lyme Regis, a small English town beside steep "
            - vocabulary: {id: cliff, text: cliffs}
            - text: ". Her family had little money. Her father taught Mary and her brother Joseph to find and clean "
            - vocabulary: {id: fossil, text: fossils}
            - text: "."
    - id: p02
      illustration: p02
      paragraphs:
        - text: Rain and waves kept changing the cliffs. Rockfalls exposed fresh stone, but they could kill. Years later, in October 1833, a cliff fall killed Mary's dog Tray at her feet. Mary wrote that she had almost met the same fate.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Back in 1811, Joseph found a huge fossil skull below a cliff. Mary returned to uncover more bones. By early 1813, much of a "
            - vocabulary: {id: skeleton, text: skeleton}
            - text: " about five meters long had emerged from the rock."
    - id: p04
      illustration: p04
      paragraphs:
        - text: The bones looked like no animal the townspeople knew. Mary cleaned and prepared the heavy fossil for sale. After her father died in 1810, the money helped support her family. The fossil later traveled to London, where men of science studied it.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Some scientists first thought the animal was a crocodile. Later study showed that it was an ichthyosaur, an extinct sea reptile. This was the first largely complete ichthyosaur skeleton to be uncovered and scientifically described.
    - id: p06
      illustration: p06
      paragraphs:
        - text: The scientific report brought attention to the strange animal. Yet the report did not name Mary as its finder. Readers saw the fossil and the men's ideas, but the report left out Mary's careful work.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Mary kept searching. She also studied anatomy and geology, made exact drawings, and compared one bone with another. With little formal schooling, she built knowledge from books and many finds. Visitors and scientists began asking for her opinion.
    - id: p08
      illustration: p08
      paragraphs:
        - text: In December 1823, Mary found another important fossil. Its bones remained connected in their natural places. It was the first complete, articulated plesiosaur skeleton known to science. The animal, unlike any living creature people knew, had a very long neck and a small head.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Mary drew the bones in their places and shared the drawing. In France, the famous scientist Georges Cuvier studied a copy. He thought the neck had too many bones, so he wondered whether the fossil was fake.
    - id: p10
      illustration: p10
      paragraphs:
        - text: More drawings were sent, and the Geological Society held a special meeting in 1824. Mary was not invited. The evidence showed that the fossil was real. Cuvier no longer doubted it.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Scientists described the unusual sea reptile. The long line of connected neck bones, which had caused doubt, became important evidence. Once again, men presented the discovery while the woman who found and prepared it stood outside their group.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Several barriers helped keep Mary's name out of public view. She was a working-class woman with little formal education. The Geological Society did not allow women to join. Buyers and male scientists often received public attention for fossils that Mary found, cleaned, and studied.
    - id: p13
      illustration: p13
      paragraphs:
        - text: Still, many visitors and scientists respected Mary's knowledge during her life. They came to her shop and asked what she had observed. Museums kept her fossils, even when old records did not clearly show her part in each discovery.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Today, fossils Mary found are displayed in the Natural History Museum's Fossil Marine Reptiles Gallery. Visitors to Lyme Regis should search for loose fossils on the beach with an adult. They should stay away from the bottom of cliffs, new rockfalls, and mudflows, and watch the tides.
