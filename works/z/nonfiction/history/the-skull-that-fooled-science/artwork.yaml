schema_version: 1
style: bold-ink-comic
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  dawson: English man in his late forties to early fifties, broad oval face, receding dark-brown hair, thick curled mustache, dark brown three-piece Edwardian suit, cream shirt, burgundy tie, brown felt hat outdoors.
  woodward: English man in his late forties to sixties, lean face, swept-back gray-brown hair, full pointed mustache, round spectacles, charcoal Edwardian suit, white shirt, teal tie, dark waistcoat.
  oakley: English man in his late thirties, narrow face, short dark hair combed back, clean-shaven, white laboratory coat over a navy suit and yellow tie, round safety spectacles during laboratory work.
  weiner: South African-born man in his late thirties, light-olive skin, short wavy black hair, clean-shaven, tan 1950s suit, white shirt, red tie.
  clark: English man in his late fifties, long face, thinning gray hair, neat gray mustache, pale laboratory coat over a dark green suit and bow tie.
  skull: several dark-brown human cranial fragments reconstructed above a dark-brown ape-like lower jaw with no gore or soft tissue.
  palette: saturated cyan shadows, brick red and mustard yellow accents, cream paper tones, deep ink black; Edwardian scenes warmer and 1950s laboratory scenes cooler.
assets:
  - {id: cover, file: artwork/cover.webp, scene: "A dramatic wordless museum-table composition centered on the reconstructed brown Piltdown skull, split by inspection light into an apparently unified fossil on one side and visibly separate human cranial fragments, ape jaw, file, stain bottle, and gravel on the other, with no labels."}
  - {id: p01, file: artwork/p01.webp, scene: "Dawson and Woodward present reconstructed skull fragments on a green-covered table before a crowded 1912 geological meeting, every paper and wall surface blank."}
  - {id: p02, file: artwork/p02.webp, scene: "Dawson and Woodward kneel in a Sussex gravel pit among sieves and buckets, examining separate dark bone fragments and stones without any sign or writing."}
  - {id: p03, file: artwork/p03.webp, scene: "Woodward at a museum worktable fits human cranial fragments above an ape-like jaw while anatomical comparison objects remain separated around him."}
  - {id: p04, file: artwork/p04.webp, scene: "Close view of the damaged jaw with absent rear joint and front chin areas beside the separate canine and a smooth plaster cast, handled with gloves."}
  - {id: p05, file: artwork/p05.webp, scene: "A chain of hands passes an unlabelled bone fragment from gravel pit worker to Dawson to Woodward and into a museum cabinet, with visible gaps between stages and no text."}
  - {id: p06, file: artwork/p06.webp, scene: "Scientists compare a large-brain silhouette above an ape-like jaw on a blank tabletop model while one skeptical figure keeps the two pieces apart."}
  - {id: p07, file: artwork/p07.webp, scene: "The Piltdown skull in a British museum gallery draws excited visitors while distant cases suggest European, Asian, and African fossil discoveries without flags or labels."}
  - {id: p08, file: artwork/p08.webp, scene: "Woodward stands beside a guarded museum specimen cabinet as several researchers study casts at a separate table."}
  - {id: p09, file: artwork/p09.webp, scene: "Wordless forensic cutaway of brown-stained skull pieces, gravel packed in cavities, filled joins, and a small hand file near altered teeth, arranged as evidence without showing a perpetrator."}
  - {id: p10, file: artwork/p10.webp, scene: "Dawson presents another dark fragment from a second imagined gravel setting while the first skull appears on a distant museum table, emphasizing apparent repetition without maps or labels."}
  - {id: p11, file: artwork/p11.webp, scene: "Multiple scientific groups around the skull point in conflicting directions while overlapping museum, gravel-pit, and fossil silhouettes converge behind them."}
  - {id: p12, file: artwork/p12.webp, scene: "David Waterston studies an ape jaw and human skull separately at a 1913 desk, gesturing that they do not fit while other anatomists compare blank casts."}
  - {id: p13, file: artwork/p13.webp, scene: "Several incompatible plaster reconstructions of the same fragments stand on a museum bench as researchers debate around them without speech bubbles."}
  - {id: p14, file: artwork/p14.webp, scene: "Gloved hands attempt to align a complete ape jaw with a human skull while the damaged Piltdown jaw lacks the surfaces needed for the same test."}
  - {id: p15, file: artwork/p15.webp, scene: "Museum staff protect the original fragments in a glass case while visiting researchers examine casts and request tiny samples, all forms blank."}
  - {id: p16, file: artwork/p16.webp, scene: "Authentic fossil silhouettes from Africa and Asia form a branching evolutionary display around the stubbornly mismatched Piltdown skull, with no diagram labels or symbols."}
  - {id: p17, file: artwork/p17.webp, scene: "Oakley in a 1949 laboratory compares tiny bone samples in glass vessels for fluorine content, with gauges and papers entirely blank."}
  - {id: p18, file: artwork/p18.webp, scene: "Weiner, Oakley, and Clark compare cranial, jaw, animal-bone, and stone samples across several chemical stations in a cool 1953 laboratory."}
  - {id: p19, file: artwork/p19.webp, scene: "Under strong laboratory light, artificial brown stain appears only on the surface of bone fragments while packing material and gravel emerge from cavities."}
  - {id: p20, file: artwork/p20.webp, scene: "Clark peers through a microscope at enlarged tooth surfaces showing parallel file scratches, while an ape tooth and human tooth sit separately for comparison."}
  - {id: p21, file: artwork/p21.webp, scene: "A balanced evidence table contrasts an honest but incorrect plaster reconstruction with deliberately stained, filled, filed, and combined original materials."}
  - {id: p22, file: artwork/p22.webp, scene: "Researchers remove the Piltdown reconstruction from a branching human-origins display and reorganize authentic fossil casts, without labels or text."}
  - {id: p23, file: artwork/p23.webp, scene: "Dawson stands at the center of several converging wordless paths from two gravel pits, museum parcels, and fossil fragments, while his face remains neutral rather than villainous."}
  - {id: p24, file: artwork/p24.webp, scene: "Several historical suspect silhouettes stand at unequal distances from a table of evidence, with Dawson most directly connected and no detective-board writing or symbols."}
  - {id: p25, file: artwork/p25.webp, scene: "Modern researchers use DNA tubes, three-dimensional skull imaging, measuring tools, and spectroscopy to compare Piltdown fragments, every screen showing only abstract color shapes."}
  - {id: p26, file: artwork/p26.webp, scene: "A trail of physical evidence reaches Dawson's open specimen case but stops before a shadowed unseen workshop, visually preserving the missing direct observation."}
  - {id: p27, file: artwork/p27.webp, scene: "Four nested pools of light surround the fraudulent composite, repeated preparation materials, Dawson's specimen case, and a faint unknown helper silhouette, showing decreasing confidence without text or symbols."}
  - {id: p28, file: artwork/p28.webp, scene: "Final museum case with the reconstructed skull visually dissolving into human fragments, orangutan jaw, stain, gravel, filler, and filed teeth as modern visitors examine it quietly."}
