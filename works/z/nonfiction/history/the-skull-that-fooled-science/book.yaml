characters:
  - id: narrator
    kind: narrator
    description: A source-conscious historical narrator who distinguishes observations, interpretations, and degrees of confidence.
    voice_identity: incisive, patient, and exact about uncertainty
  - id: dawson
    kind: historical-figure
    description: Charles Dawson, the Sussex solicitor and amateur antiquarian who brought the first Piltdown fragments to Arthur Smith Woodward.
    visual_identity: English man in his late forties to early fifties, broad oval face, receding dark-brown hair, thick curled mustache, dark brown three-piece Edwardian suit, cream shirt, burgundy tie, brown felt hat outdoors.
    voice_identity: unused; no invented quotation
  - id: woodward
    kind: historical-figure
    description: Arthur Smith Woodward, keeper of geology at the British Museum (Natural History), who reconstructed and defended Piltdown Man.
    visual_identity: English man in his late forties to sixties, lean face, swept-back gray-brown hair, full pointed mustache, round spectacles, charcoal Edwardian suit, white shirt, teal tie, dark waistcoat.
    voice_identity: unused; no invented quotation
  - id: waterston
    kind: historical-figure
    description: David Waterston, the anatomist who argued in 1913 that the ape-like jaw and human-like cranium did not belong to one individual.
    visual_identity: Scottish man in his early forties, narrow face, short dark hair parted to one side, neat mustache, dark Edwardian suit, white shirt, muted blue tie.
    voice_identity: unused; no invented quotation
  - id: oakley
    kind: historical-figure
    description: Kenneth Oakley, Natural History Museum geologist who applied fluorine analysis to the Piltdown remains.
    visual_identity: English man in his late thirties, narrow face, short dark hair combed back, clean-shaven, white laboratory coat over a navy suit and yellow tie, round safety spectacles during laboratory work.
    voice_identity: unused; no invented quotation
  - id: weiner
    kind: historical-figure
    description: Joseph Weiner, Oxford physical anthropologist who pressed the renewed investigation of Piltdown.
    visual_identity: South African-born man in his late thirties, light-olive skin, short wavy black hair, clean-shaven, tan 1950s suit, white shirt, red tie.
    voice_identity: unused; no invented quotation
  - id: clark
    kind: historical-figure
    description: Wilfrid Le Gros Clark, Oxford anatomist who examined the jaw and teeth during the 1953 investigation.
    visual_identity: English man in his late fifties, long face, thinning gray hair, neat gray mustache, pale laboratory coat over a dark green suit and bow tie.
    voice_identity: unused; no invented quotation
cover: artwork/cover.webp
