learning:
  goals:
    - Explain how incompatible human and ape remains were altered and presented as one ancient individual.
    - Evaluate why anatomical expectations, restricted access, national prestige, and apparent corroboration sustained acceptance without implying universal belief.
    - Compare anatomical criticism with fluorine, nitrogen, staining, microscopy, DNA, and three-dimensional imaging evidence.
    - Distinguish strong attribution to Charles Dawson from proof beyond every reasonable historical doubt.
  concepts:
    - Piltdown forgery and human-origins research
    - observation, interpretation, provenance, and independent testing
    - institutional authority, motivated expectation, and scientific correction
    - historical attribution under incomplete evidence
