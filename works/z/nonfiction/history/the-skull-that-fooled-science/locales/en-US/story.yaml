title: The Skull That Fooled Science
summary: In 1912, fragments from an English gravel pit seemed to reveal an ancient human with a modern brain and an ape-like jaw. This account follows the Piltdown forgery from its persuasive reconstruction and early critics to the converging tests that destroyed it in 1953, then asks how far later evidence can identify the maker without turning likelihood into certainty.
