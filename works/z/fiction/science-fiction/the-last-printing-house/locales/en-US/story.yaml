  pages:
    - {"id":"p01","illustration":"p01","blocks":[{"id":"p01-b01","speaker":"narrator","text":"On her first morning at the House of Common Print, Lin crossed a city where readers no longer bought editions. A public story changed its examples for each neighborhood, shortened itself for a hurried commuter, and enlarged its layout for tired eyes. The old printing house stood among those responsive surfaces like a machine that had missed an instruction. Lin had asked to serve her preservation term there because she believed a printed page could not revise its own past. Director Mara Vale met her beside the silent press and asked a less comfortable question: whether a page that could not change could nevertheless lose what it claimed to hold. Lin tested the claim against the objects in front of her rather than treating confidence as proof. She recorded the carrier, the action, the responsible person, and the remaining gap. That method separated a recoverable fact from an attractive interpretation, a distinction that would matter when the same evidence supported more than one policy."},{"id":"p01-b02","speaker":"narrator","text":"Her induction file described the house as a memory institution, but the phrase granted no supernatural memory. The building held selected objects, descriptions, and the labor required to connect them. Its charter treated access and preservation as linked duties, even when one constrained the other. Lin underlined selected because the word exposed a decision that shelves could hide. A future reader might mistake survival for importance, although survival could result from money, accident, or institutional preference. Before evaluating any object, Lin would ask what had been eligible, what had been refused, and whether the reason remained visible. Those questions complicated her admiration for the press without making that admiration foolish."}]}
    - {"id":"p02","illustration":"p02","blocks":[{"id":"p02-b01","speaker":"narrator","text":"Mara opened the storage hall only after Lin had recorded the room's temperature and humidity. Shelves held municipal reports, novels, school debates, recipes, and ordinary pamphlets chosen under an old public charter. The press had not made commercial books for years. It produced deposit copies when the city decided that a particular public edition should remain inspectable. Lin admired the unchanging rows, but Mara pointed to enclosures, filters, roof drains, and pest traps. Fixed did not mean self-preserving. It meant that any later alteration had to appear as damage, repair, annotation, or a new edition rather than arrive invisibly. Each preservation choice shifted risk instead of making risk disappear. More copies reduced dependence on one location but increased the systems requiring oversight. Tighter control protected an object but could restrict access. Lin began tracking those secondary effects beside each immediate benefit."},{"id":"p02-b02","speaker":"narrator","text":"The deposit rule concerned publication events rather than every private draft; a fixed edition marked one moment when an institution accepted public responsibility for particular wording. Later correction remained possible, but it had to appear beside the older state instead of occupying the same place without notice; that arrangement protected evidence of error as well as achievement. It also consumed paper, shelf space, cataloging time, and conservation attention. Lin wrote that a principled rule could still impose opportunity costs. The question was not whether a cost existed, but whether the city had named it and compared it with costs transferred to readers, researchers, and excluded communities."}]}
    - {"id":"p03","illustration":"p03","blocks":[{"id":"p03-b01","speaker":"narrator","text":"The week's disputed object was a civic report called the Harbor Heat Review. Its first printed edition had shaped a costly cooling plan fifteen years earlier. A recent on-demand version contained a corrected model and a note that the earlier forecast had overestimated several shaded districts. Residents now argued over which version represented the city's decision. Lin placed the two bound copies side by side. Their covers looked alike, but their charts and conclusions differed; the problem was not that one was authentic and the other false. Each could be authentic evidence of a different publication event, provided the event and changes were traceable. The case file distinguished observation, inference, and decision. An observation described what the team could inspect; an inference connected observations while admitting alternatives. A decision assigned resources and accepted consequences. Confusing those categories had allowed technical language to disguise a value choice."},{"id":"p03-b02","speaker":"narrator","text":"The correction did not prove that the original analysts had acted dishonestly; better shade data and revised assumptions could explain the changed forecast. Nor did an old edition prove that its conclusions deserved equal use in current planning, because historical evidence and current guidance served different purposes. Lin's sheet separated fidelity to a past publication from endorsement of its claim, preventing two opposite mistakes. One was erasing a documented error because it was inconvenient; the other was repeating an outdated estimate because it was original. A source-aware reader needed dates, methods, revisions, and enough context to decide which question each edition could answer."}]}
    - {"id":"p04","illustration":"p04","blocks":[{"id":"p04-b01","speaker":"narrator","text":"Ivo Sen arrived from the public library carrying a reader that could render the report as large print, audio, simplified navigation, or a tactile pattern. He objected when Lin called those forms temporary. For a patron who could not use the fixed volume, an inaccessible original was evidence behind glass, not a usable civic record. Mara did not defend the glass. She asked whether Ivo's system retained the exact source from which each accessible form had been made. His answer was yes, then no: the current text was preserved, but an old conversion service had overwritten some intermediate files after a software migration. The evidence changed the argument without dictating an automatic answer. Readers could describe barriers and logs could show events, but people still had to decide which losses were tolerable and who should bear them. Mara required every recommendation to name both its evidence and the judgment built upon it."},{"id":"p04-b02","speaker":"narrator","text":"Ivo showed that adaptation could change presentation without changing an argument, but the boundary required judgment. Reordering headings for navigation might preserve meaning, while shortening a qualification could alter it. The system needed tests comparing each derivative with its named source and involving people who used the access feature. Automated checks could locate missing segments; they could not decide every rhetorical effect. This dependency did not make accessible editions suspect. It made their editorial labor part of the record. If the city funded conversion but not review, it would advertise access while shifting errors onto the readers it claimed to include."}]}
    - {"id":"p05","illustration":"p05","blocks":[{"id":"p05-b01","speaker":"narrator","text":"The three examined the oldest digital deposit. At ingest, the repository had authenticated and recorded a reference digest; each facility's latest check matched that baseline. Those comparisons supported the claim that the stored object had not changed since ingest, yet the program that once displayed its interactive diagrams no longer ran. Ivo could extract the text and images, but not the timing or behavior of every layer. Lin had expected corrupted data; instead, she found intact data that had become partly unusable. Mara called the distinction essential. A fixity check could show that a file still matched its authenticated baseline. It could not by itself preserve the hardware, software, rights, and knowledge needed to present the file as earlier readers experienced it. Faster correction improved present accuracy but could obscure the public record of error. Lin began tracking that secondary effect beside the immediate benefit, noting that an authentic bitstream and a complete reading experience were related claims, not identical ones."},{"id":"p05-b02","speaker":"narrator","text":"Lin entered two findings: three independently computed digests matched the authenticated ingest value, giving strong evidence against accidental bit change since deposit. The historical rendering remained incomplete because one required component was unavailable; combining both findings into success or failure would discard precision. The repository had preserved something substantial, yet not everything earlier users experienced. Future work might recover more through documentation or emulation, but that possibility was not a present result. The record named both achievement and limit. Mara approved because later evidence could improve the conclusion without requiring anyone to erase its earlier uncertainty."}]}
    - {"id":"p06","illustration":"p06","blocks":[{"id":"p06-b01","speaker":"narrator","text":"Mara showed Lin a paper failure. A report from the previous century had grown brittle because its acidic wood-pulp sheets had changed chemically over time. Light had faded the cover, and an old leak had left a tide mark across the lower margin. The text remained readable, but handling could break its edges. A protective enclosure and stable conditions could slow further harm; neither could reverse all damage. Lin stopped using permanence as a synonym for paper. The physical carrier made alteration visible in useful ways, yet it also aged, absorbed water, burned, tore, and depended on continuing care. Materials could show damage and budgets could show scarcity, but neither chose a policy. The house had to decide when access justified handling, when a copy was sufficient, and whose future questions deserved scarce conservation work."},{"id":"p06-b02","speaker":"narrator","text":"The damaged report complicated the idea of an original: its sentences, paper, binding, annotations, and pattern of use were related but distinct evidence. A transcription preserved wording while losing the tide mark. A photograph showed the mark while flattening texture and sequence. The physical book retained both, provided handling did not destroy it. No representation answered every question. Lin began naming the preservation target before recommending a method: content, appearance, behavior, material history, or social context. That practice kept a useful copy from being dismissed because it was not the artifact, and kept an artifact from being treated as sufficient for every form of access."}]}
    - {"id":"p07","illustration":"p07","blocks":[{"id":"p07-b01","speaker":"narrator","text":"At the neighborhood branch, Ivo introduced Lin to patrons who used the Harbor report differently. One listened while traveling. Another increased contrast and spacing. A reader with limited hand movement navigated by voice. None of those access methods changed the report's claims, but each required software, structured content, and testing. Lin noticed that the printed deposit still mattered during their conversation: Ivo used it to verify a suspicious sentence break in the migrated audio source. The accessible forms and fixed copy were not rivals in that moment. They corrected different weaknesses in the preservation system. Tighter control could protect an artifact while preventing a citizen from using it; effortless distribution could conceal the source and revisions behind a polished screen. Lin wrote both consequences beside the same case instead of assigning virtue to a medium."}]}
    - {"id":"p08","illustration":"p08","blocks":[{"id":"p08-b01","speaker":"narrator","text":"Lin found a replacement leaf sewn into the supposedly untouched first edition. Its smoother fibers and newer thread crossed holes left by earlier stitching. The inserted leaf carried the corrected conclusion, although the catalog called the volume simply the first edition. Someone had tried to make the public copy accurate by concealing the intervention. The book remained important evidence, but it no longer offered uncomplicated proof of what residents had read fifteen years before. Mara did not defend the mistake. She isolated the volume, opened a treatment inquiry, and asked Lin to compare remote copies. Their institution valued visible history, yet its own record had hidden a change. The contradiction did not destroy every claim the house made; it required a narrower claim supported by disclosed evidence."},{"id":"p08-b02","speaker":"narrator","text":"The altered volume forced a distinction between correction and substitution. A new conclusion might be better supported, yet inserting it into an older carrier changed the evidence of publication. Readers needed both the historical claim and its later correction, linked without being collapsed. The catalog's silence therefore mattered independently of the corrected sentence's accuracy."}]}
    - {"id":"p09","illustration":"p09","blocks":[{"id":"p09-b01","speaker":"narrator","text":"A night storm drove rain under one roof joint. Sensors warned the staff before water reached the main shelves, but a box near the outer wall became damp. Because the affected quantity was small and the materials were only damp, Lin, Mara, and Ivo spread them on clean blotting material in a cool, dry work area with ample air circulation, following the conservation plan. No dramatic rescue made the collection safe forever. The incident exposed how preservation depended on routine inspection, trained people, stable buildings, and money. By morning, distributed digital replicas remained available, while one physical copy required treatment. Lin also knew that a regional network failure could reverse the pattern on another day. Redundancy moved risk across places and systems; it did not cancel risk. The roof invoice joined the hearing file because a claim about permanence without its maintenance cost was incomplete evidence."},{"id":"p09-b02","speaker":"narrator","text":"The emergency plan also recorded what had not happened. Water had not reached the main shelves, no volume was declared destroyed, and staff had not tested every possible future storm. Those limits prevented a near miss from becoming proof of safety. The incident supported repair and preparedness, not confidence that the next failure would follow the same path."}]}
    - {"id":"p10","illustration":"p10","blocks":[{"id":"p10-b01","speaker":"narrator","text":"The damp box contained neighborhood testimony omitted from the final Harbor report. Residents had described hot apartments, lost work hours, and doubts about a sensor survey that missed shaded courtyards. Their statements were not secret, but the city portal linked only to the polished report. Preserving a final edition had frozen an institutional selection without preserving the dispute that gave the edition meaning. Mara called context a collection decision, not an unlimited command. No archive could retain everything. The ethical problem was therefore not only how to preserve, but who selected the record and how exclusions could be challenged. Lin listed the testimony as contextual material and recorded why it changed interpretation of the report, without claiming that every statement was verified fact."},{"id":"p10-b02","speaker":"narrator","text":"The testimony complicated source authority without making every memory equally reliable. Residents could report their own heat, work, and encounters with officials; they could still misremember dates or infer causes beyond observation. Preserving their accounts allowed comparison with sensor methods and policy drafts. Excluding them would remove disagreement rather than resolve it."}]}
    - {"id":"p11","illustration":"p11","blocks":[{"id":"p11-b01","speaker":"narrator","text":"Ivo displayed the repository's independent copies, scheduled integrity checks, documented migrations, and access derivatives made from retained source files. The system did more than place one file on a server; it watched for unexpected change and recorded preservation events. Lin conceded that this practice could reveal failures a closed book might hide for years. Ivo then named an indirect risk. Because the service worked smoothly, officials had begun treating the current screen as the whole historical record. Good access could create false confidence when an interface concealed earlier editions and the choices behind them. The repository needed not only reliable storage but a comprehensible account of relationships among objects. A version map that nobody could understand would satisfy a technical requirement while failing its public purpose."},{"id":"p11-b02","speaker":"narrator","text":"Lin asked who watched the watchers. Integrity reports could themselves be incomplete, misconfigured, or misunderstood, so the system retained logs in separate administrative domains and invited periodic external review. Independence was a matter of degree, not a magical shield. The proposal named remaining shared dependencies instead of counting every copy as fully separate."}]}
    - {"id":"p12","illustration":"p12","blocks":[{"id":"p12-b01","speaker":"narrator","text":"An obsolete reader from the technology cabinet offered a harsher test. Its stored object remained readable, but a licensed rendering component had vanished with a company. Engineers could approximate the work from documentation, although one interactive sequence remained uncertain. Mara required the catalog to state that uncertainty rather than present the reconstruction as exact. Lin compared the failed rendering with the repaired paper leaf. Both media had required intervention. In both, honesty depended less on pretending that nothing had happened than on preserving evidence of what happened, who acted, why, and what could no longer be known. An unchanged object was valuable evidence, but no carrier supplied its own interpretation or future means of access."},{"id":"p12-b02","speaker":"narrator","text":"The reconstruction team preserved the obsolete object before attempting changes and documented each experiment on a copy. That practice protected later researchers from mistaking a failed attempt for the source. It also consumed expertise and time without guaranteeing success. The case justified planned intervention while warning that intervention could create new evidence and new ambiguity."}]}
    - {"id":"p13","illustration":"p13","blocks":[{"id":"p13-b01","speaker":"narrator","text":"Lin searched the accession ledger and found a sequence of repair slips. The replacement leaf had been authorized after a clerk argued that a public copy should contain the city's latest correction. A later director rejected that reasoning but never restored the removed sheet, which could not be found. The slips documented disagreement without solving it. They established who approved the change and when, but not whether the clerk acted from pressure or a sincere theory of public accuracy. A remote scan might show the missing wording, yet it could not recover the lost sheet as a material object. The record narrowed the possibilities while leaving motive uncertain, so Lin refused to turn a plausible explanation into a fact."},{"id":"p13-b02","speaker":"narrator","text":"The slips were not neutral merely because they were old. Their wording reflected institutional categories, and missing attachments could distort the sequence. Lin compared handwriting, dates, holes, and external copies before relying on them. Convergence strengthened the chronology, while disagreement remained visible rather than being averaged away."}]}
    - {"id":"p14","illustration":"p14","blocks":[{"id":"p14-b01","speaker":"narrator","text":"Mara demonstrated a modern repair on another volume. New thread supported the binding but remained visibly different under close inspection. A treatment record described the book's condition, the materials used, and the conservator's choices. For this volume, the goal was not to make the book appear untouched; it was to keep the object usable while allowing a future reader to distinguish original structure from intervention. Lin saw why this documented, distinguishable repair could support an authenticity assessment, while a cosmetically perfect substitution could weaken it by erasing evidence. Appearance alone could not settle the question. The same principle could guide digital migration: transformation was not automatically betrayal, provided the source, action, agent, reason, result, and uncertainty remained traceable."},{"id":"p14-b02","speaker":"narrator","text":"Mara distinguished reversible choices from irreversible ones. Whether a support could be removed safely depended on this book's materials, condition, and treatment; trimming an edge, by contrast, destroyed evidence at once. Digital actions had comparable differences, although the mechanisms were not identical. The workflow required greater review when an intervention foreclosed future questions."}]}
    - {"id":"p15","illustration":"p15","blocks":[{"id":"p15-b01","speaker":"narrator","text":"Ivo traced the overwritten intermediate files through old logs. A contractor had removed them under a policy that classified derivatives as reproducible. That assumption held for ordinary layout changes, but failed for an early speech rendering whose pauses had been reviewed by residents with cognitive disabilities. The final audio survived; the editable timing decisions did not. No malicious editor had rewritten history. A reasonable efficiency rule had erased evidence whose value appeared only later. The case forced Lin to consider indirect effects: accurate current access could rest on an undocumented loss. She added the policy itself to the record, because future readers needed to see not only a missing file but the assumption that had made its deletion seem harmless."},{"id":"p15-b02","speaker":"narrator","text":"The deleted timing data showed why future value cannot be predicted perfectly. Keeping everything was impossible, but calling every derivative reproducible was too broad. The revised policy identified human-reviewed features and sampled intermediate states. It also scheduled reassessment, since future questions could expose present categories as inadequate."}]}
    - {"id":"p16","illustration":"p16","blocks":[{"id":"p16-b01","speaker":"narrator","text":"Lin spent a day listening to readers instead of inspecting carriers. A retired engineer wanted the original model. A tenant organizer wanted the discarded testimony. A blind student wanted navigable audio. A historian wanted every dated edition and the links among them. Their requests overlapped but were not identical. Printing one definitive book could not satisfy them all, and keeping only a flexible current text could not show how authority had changed. Lin drafted a requirements map, then crossed out the heading 'Solution'. It was only a statement of obligations, some compatible and some in tension. The interviews were evidence of actual barriers and research needs, not a vote that automatically determined policy."},{"id":"p16-b02","speaker":"narrator","text":"The map also recorded conflicts among requests instead of merging them into a vague public interest. That choice allowed the later hearing to ask who benefited from each feature, who remained excluded, and which evidence could reveal an unintended consequence."}]}
    - {"id":"p17","illustration":"p17","blocks":[{"id":"p17-b01","speaker":"narrator","text":"The city called a hearing because the printing house roof needed major work. One proposal closed the press and transferred funds to the digital repository. Another protected the building by cutting accessible-format services. A third retained a smaller physical program and required stronger version records across both systems. Speakers arrived expecting a contest between old paper and new code. Lin arranged the Harbor objects so the altered book, intact bitstream, failed renderer, testimony box, and accessible editions could be examined together. None supported a simple victory. The hearing chair asked each advocate to name a benefit, a dependency, a person who might bear the cost, and evidence that could later prove the plan wrong."}]}
    - {"id":"p18","illustration":"p18","blocks":[{"id":"p18-b01","speaker":"narrator","text":"Mara presented the stained and altered first edition. She did not call its damage noble. The book preserved paper, binding, wear, and evidence of intervention that a transcription could not fully reproduce, but it had survived only because people repeatedly paid for its care. Ivo presented the accessible report and the integrity records behind it. He did not pretend that wide distribution guaranteed permanence. The system could serve more readers and compare many copies, but continued access depended on formats, software, governance, and documented migrations. Their concessions changed the room more than their defenses. Lin heard fewer claims that one medium was honest by nature and more questions about which practices made a claim inspectable."}]}
    - {"id":"p19","illustration":"p19","blocks":[{"id":"p19-b01","speaker":"narrator","text":"Residents used plain tokens to rank obligations rather than vote for a favored medium. Access ranked high, as did evidence of public decisions and protection against silent replacement. Keeping every physical item ranked lower once costs were visible, but allowing administrators alone to choose deposits also failed. A student asked why popular works should receive more copies than unpopular testimony. A printer asked whether generated text with a different version for every reader could ever have an edition. The hearing postponed the budget vote and commissioned a test using the Harbor record. The delay was not indecision for its own sake; it created a chance to test whether the proposed duties could survive one difficult case."}]}
    - {"id":"p20","illustration":"p20","blocks":[{"id":"p20-b01","speaker":"narrator","text":"Lin's test began with the altered leaf. Fiber patterns and stitching established that it had been inserted later; repair slips dated authorization; and a remote library held a scan of the original page. The repository event log recorded when the corrected edition was ingested as a new version linked to the preserved source master. No single clue solved the history. Together they supported a sequence: original publication, disputed forecast, authorized physical substitution, later policy reversal, and digital correction. The evidence could not prove the clerk's motive. Lin wrote that limit into the reconstruction instead of choosing the explanation that made her institution look best. Her report embedded images of objects and links to custody records, while its spoken version named each source so a listener could follow the reasoning without seeing them."}]}
    - {"id":"p21","illustration":"p21","blocks":[{"id":"p21-b01","speaker":"narrator","text":"The team built a hybrid workflow around the reconstruction. A designated fixed edition would be printed on durable paper and stored under controlled conditions. A preservation master would be copied in separate systems and checked for unexpected change. Accessible forms would derive from a named master. Every migration, repair, correction, and rights restriction would create an event record linked to an agent and reason. The workflow reduced several risks, but it did not eliminate selection bias, disasters, software loss, material decay, or future misunderstanding. It converted hidden dependencies into responsibilities that could be inspected. Independent audits would test the process, because a record written only by the institution responsible for the action could repeat the same blind spot."}]}
    - {"id":"p22","illustration":"p22","blocks":[{"id":"p22-b01","speaker":"narrator","text":"Mara sealed the reconstructed first edition in a stable enclosure, but placed a supported access copy nearby. Readers could request the original under supervised conditions when its material evidence mattered. Routine reading would use copies, reducing handling without turning the artifact into a sacred object. Lin noted a tradeoff: protection could extend physical life while limiting immediate contact. The policy therefore required a stated reason for restrictions and a review date. Preservation could not become an indefinite excuse for withholding a public record. Nor could access erase the duty to protect a unique carrier whose fibers, binding, wear, and repairs answered questions that a transcription could not."}]}
    - {"id":"p23","illustration":"p23","blocks":[{"id":"p23-b01","speaker":"narrator","text":"Ivo changed the portal so a correction produced a linked edition rather than silently replacing the previous one. The current version remained easiest to reach, but readers could open a version map, identify the source master, and see which passages had changed. Accessible renderings inherited the same links. The interface still summarized complex events, so it could mislead if its categories were poor. Ivo invited disability advocates, historians, and ordinary patrons to test the navigation before launch. Access meant more than putting evidence online; it included making relationships understandable. The old edition remained findable without being presented as current advice, while the correction remained prominent without pretending the earlier public decision had never occurred."},{"id":"p23-b02","speaker":"narrator","content":[{"text":"The portal made its "},{"vocabulary":{"id":"version-history","text":"version history"}},{"text":" visible as evidence rather than decoration."}]}]}
    - {"id":"p24","illustration":"p24","blocks":[{"id":"p24-b01","speaker":"narrator","text":"Lin added the first new event record herself. It named the enclosure, the comparison scan, the approving people, and the uncertainty about the missing sheet. Mara and Ivo witnessed the entry. Lin resisted adding a final judgment about the clerk because the evidence did not support one. The restraint felt less satisfying than a verdict, but it made the record more useful. A future discovery could revise the interpretation without pretending that the present team had known it all along. The record also preserved Lin's own role, preventing her reconstruction from appearing as a view from nowhere. Provenance described a chain of custody and action; it did not certify every decision in that chain as wise."}]}
    - {"id":"p25","illustration":"p25","blocks":[{"id":"p25-b01","speaker":"narrator","text":"The hardest question remained selection. The house could not print every generated variation, and the repository could not promise meaningful stewardship for an infinite stream. The team proposed preserving works tied to public decisions, representative samples of adaptive texts, nominated community records, and contextual material explaining selection. Rejected nominations would remain listed with reasons and an appeal path. Even that policy favored people who knew how to nominate. The plan funded outreach through libraries, but Lin described the remedy as partial. A transparent rule could still reproduce unequal attention. Storage capacity was not the only limit; description, rights review, migration, conservation, and human understanding also required continuing labor."}]}
    - {"id":"p26","illustration":"p26","blocks":[{"id":"p26-b01","speaker":"narrator","text":"At the second hearing, residents challenged the categories. A migrant association argued that a sample chosen by language totals could miss a small but historically important newsletter. A teacher warned that preserving every classroom-generated variation could bury the shared assignment. An engineer asked whether publishing detailed integrity operations might expose security weaknesses. The team revised the plan: qualitative nominations could override numerical sampling, shared source prompts would accompany selected outputs, and public reports would disclose outcomes without revealing operational details that created avoidable risk. Counterevidence changed the proposal instead of appearing as a ceremonial objection. No revision satisfied everyone, but each answered a concrete failure someone had identified."}]}
    - {"id":"p27","illustration":"p27","blocks":[{"id":"p27-b01","speaker":"narrator","text":"The council funded the smaller press, roof repair, distributed digital preservation, accessible editions, and an independent selection board. It rejected a guarantee that the system would preserve the city's memory forever. Instead, the charter required periodic audits, public reasons for selection and restriction, and transfer plans if either institution closed. The decision cost more than choosing one medium, so several popular reprinting projects were delayed. That consequence remained real. The council judged redundancy and accountability worth the cost, but the vote did not make dissent irrational. Its decision established a revisable allocation of duties, not a final theory of memory."}]}
    - {"id":"p28","illustration":"p28","blocks":[{"id":"p28-b01","speaker":"narrator","text":"Months later, the press produced the reconstructed Harbor edition. Its pages included the original report, the correction as a separately dated document, resident testimony, and a concise account of the missing leaf. Digital forms linked to the same components and offered audio, enlarged layout, and structured navigation. Lin shelved the fixed copy beside an empty space reserved for a future edition. The press stopped. Nothing in the quiet promised permanence. What had changed was practical: the city had made its acts of keeping, changing, and excluding visible enough for later readers to question. Lin checked the shelf sensor, signed the day's event record, and left the blank space open."}]}
