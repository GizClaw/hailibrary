schema_version: 1
required: true
fictional_scope: >-
  Bellwether City, the House of Common Print, its charter, characters, machines,
  public hearing, damaged edition, and final preservation plan are invented.
  The story applies documented preservation principles but does not claim that
  one fictional workflow is sufficient for a real archive or library.
sources:
  - url: https://www.dpconline.org/handbook/technical-solutions-and-tools/fixity-and-checksums
    title: Fixity and Checksums
    publisher: Digital Preservation Coalition
    supports: Fixity monitoring compares newly computed checksums with an authenticated reference value established at ingest or after an authorized migration; agreement among current replicas alone does not establish that a stored object remained unchanged over time.
  - url: https://www.archives.gov/preservation/holdings-maintenance/wet-records
    title: Wet Records
    publisher: United States National Archives and Records Administration
    supports: Small quantities of many wet record materials may be air-dried on clean blotting material in a cool, dry place with ample air circulation; densely packed or large quantities and particularly valuable materials require different handling or professional advice, and heat and harsh sunlight should be avoided.
  - url: https://www.culturalheritage.org/conservation-at-work/uphold-professional-standards/code
    title: Code of Ethics and Guidelines for Practice
    publisher: American Institute for Conservation
    supports: Conservation treatment should be documented, should preserve significant properties, and should use materials and methods that do not adversely affect future examination or treatment; reversibility depends on the object, materials, condition, and proposed treatment rather than operating as a universal rule.
  - url: https://www.loc.gov/programs/digital-collections-management/digital-formats/bit-level-preservation-and-long-term-usability/
    title: Bit Level Preservation and Long Term Usability
    publisher: Library of Congress
    supports: Bit-level preservation can maintain authentic copies, but unchanged bits alone do not ensure that obsolete formats, software, codecs, or hardware remain usable; preservation actions should be documented.
  - url: https://www.loc.gov/standards/premis/v3/premis-3-0-final.pdf
    title: PREMIS Data Dictionary for Preservation Metadata, Version 3.0
    publisher: Library of Congress
    supports: Preservation metadata can record objects, events, agents, and rights; bit-level preservation concerns keeping a digital object fixed and readable, not necessarily renderable.
  - url: https://unesdoc.unesco.org/in/rest/annotationSVC/DownloadWatermarkedAttachment/attach_import_f3e1c79f-c534-42df-9dfe-b49bef6f9c35?_=244675eng.pdf&from=1&to=42
    title: Recommendation concerning the Preservation of, and Access to, Documentary Heritage Including in Digital Form
    publisher: UNESCO
    supports: Documentary heritage includes analogue and digital content and carriers; preservation is ongoing, should protect integrity, authenticity, reliability, and access, and requires defined selection policies and contextual material.
  - url: https://www.nps.gov/subjects/museums/upload/19-24_508.pdf
    title: How to Preserve Acidic Wood Pulp Paper
    publisher: United States National Park Service
    supports: Much modern wood-pulp paper is chemically unstable; suitable enclosures and environmental control can slow deterioration but do not make paper indestructible.
  - url: https://guides.loc.gov/preserving-your-books/storing
    title: Preserving Your Books — Storing Your Books
    publisher: Library of Congress
    supports: Books require appropriate storage, handling, support, and environmental protection; physical volumes can be damaged by light, moisture, pests, and poor handling.
  - url: https://www.w3.org/WAI/fundamentals/accessibility-intro/
    title: Introduction to Web Accessibility
    publisher: World Wide Web Consortium Web Accessibility Initiative
    supports: Digital content can be designed so people with diverse disabilities can perceive and interact with it; accessibility requires deliberate design.
  - url: https://www.copyright.gov/circs/circ07d.pdf
    title: Mandatory Deposit of Copies or Phonorecords for the Library of Congress
    publisher: United States Copyright Office
    supports: A real mandatory-deposit system can require copies of certain published works, while scope and rules are jurisdiction-specific; the story's charter is fictional.
notes: >-
  These sources support complementary risks and duties, not a universal ranking
  of print over digital. Future machinery and civic rules are declared fiction.
