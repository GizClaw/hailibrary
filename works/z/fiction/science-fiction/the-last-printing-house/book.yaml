schema_version: 1
id: the-last-printing-house
type: [reading, illustrated-novella]
style: luminous-future-technology
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [technology, arts, history]
  themes: [responsibility, tradition, adaptation]
  moods: [reflective, hopeful]
characters:
  - {id: narrator, kind: narrator, description: "A close source-aware narrator who follows Lin through an argument about editions, access, and public memory.", voice_identity: "observant, exact, and willing to leave uncertainty visible"}
  - id: lin
    kind: character
    description: A seventeen-year-old apprentice preservation technician who first treats fixed print as the only honest memory.
    visual_identity: East Asian girl, seventeen, oval face, short straight black bob with blunt bangs, teal utility jacket with one coral seam, charcoal shirt, graphite cargo trousers, white shoes, transparent cyan tablet showing only blank abstract shapes.
    voice_identity: quick, skeptical, and increasingly precise
  - id: mara
    kind: character
    description: The printing-house director, an experienced Black conservator who refuses both nostalgia and careless replacement.
    visual_identity: Black woman in her fifties, deep brown skin, close-cropped salt-and-pepper hair, warm-white work coat with cyan seams, graphite trousers, dark shoes, gray protective gloves, brass magnifier.
    voice_identity: measured, dry, and concrete about materials
  - id: ivo
    kind: character
    description: A young public-library systems editor responsible for accessible on-demand editions and their revision records.
    visual_identity: South Asian man in his late twenties, medium-brown skin, wavy dark hair, coral overshirt, cream shirt, teal trousers, white shoes, slim transparent slate showing blank colored blocks.
    voice_identity: energetic, candid, and impatient with false either-or choices
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Distinguish a fixed edition from a changing text and from records that document change.
    - Evaluate physical and digital preservation without treating either medium as automatically permanent.
    - Explain how selection, access, authenticity, and maintenance create competing obligations.
    - Form a qualified judgment from narrative evidence and embedded documents.
  concepts: [fixed edition, version history, documentary heritage, preservation, access, authenticity]
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
