schema_version: 1
required: true
historical_scope: >-
  The work is original historical fiction set near the end of the Warring States
  period during Li Bing's administration of Shu. Li Bing is historical. Lian,
  Bao, Qiao, their dialogue, the testing sequence, the flood, and all precise
  worksite actions are invented. The story's construction sequence and its
  placement of all three modern headworks in Li Bing's time follow the modern
  heritage account, not an early construction record. Early sources preserve
  neither the modern names and locations nor workers' names, conversations, a
  construction diary, or a complete sequence for the three works.
sources:
  - url: https://whc.unesco.org/en/list/1001
    title: Mount Qingcheng and the Dujiangyan Irrigation System
    publisher: UNESCO World Heritage Centre
    supports: >-
      Dujiangyan began in the third century BCE, uses natural topography and
      hydrology without a dam, still functions, and its three key headworks are
      the Yuzui divider, Feishayan flood-discharge work, and Baopingkou diversion
      passage.
  - url: https://whc.unesco.org/uploads/nominations/1001.pdf
    title: Nomination of Mount Qingcheng and the Dujiangyan Irrigation System
    publisher: State Party nomination dossier hosted by UNESCO World Heritage Centre
    supports: >-
      Li Bing led local people in cutting the Bottle-Neck passage and opening
      canals; the three main works use local bamboo, wood, and cobbles; the
      system divides water, discharges floodwater and sediment, and depends on
      continuing management. Its materials and maintenance methods changed
      across later dynasties while the system's basic layout endured.
  - url: https://www.neac.gov.cn/seac/c103391/202308/1166522.shtml
    title: 这项战国始建的水利工程，为何造福后人两千余年？
    publisher: 国家民族事务委员会
    supports: >-
      The earliest account in Sima Qian is very brief; present structure and
      later records support the linked functions of Fish Mouth division,
      Flying Sand Weir overflow and sediment discharge, and Bottle-Neck intake.
      Bamboo cages filled with cobbles were used, and the living system was
      repeatedly maintained and improved by later generations.
  - url: https://www.xinhuanet.com/politics/2019-04/12/c_1124356086.htm
    title: 都江堰，中华科学文明的世界符号
    publisher: 新华网
    supports: >-
      The present headworks developed through repeated change rather than
      surviving unchanged from the Warring States period. The current Fish
      Mouth location was established in a 1936 rebuilding, the overflow work
      associated with today's Flying Sand Weir is documented from 662 CE, and
      traditional bamboo cages and macha tripods served changing construction
      and diversion needs.
  - url: https://www.scdfz.org.cn/Upload/main/ContentManage/Article/File/201701102112450415.pdf
    title: 四川省志·水利志中的都江堰大事记
    publisher: 四川省地方志工作办公室
    supports: >-
      The Xin Tang Shu geography entry records Shilang Weir and Baizhang Weir
      under Daojiang County and dates the work to the Longshuo era, 661–663 CE.
      The chronicle identifies Shilang Weir with the later Flying Sand Weir.
  - url: https://museum.nju.edu.cn/item/item09/content.php?eid=01040114
    title: 新唐书二百二十五卷
    publisher: 南京大学博物馆
    supports: >-
      The Xin Tang Shu was commissioned under the Northern Song and completed
      in Jiayou 5 (1060), so its account of Longshuo-era works is a later
      historical compilation rather than a Tang-period document.
  - url: https://www.nlc.cn/migrated/pcab.nlc.cn/gjml/gjzggj/201412/U020141217513656781431.pdf
    title: 国家珍贵古籍名录图录
    publisher: 国家图书馆
    supports: >-
      The catalog lists Tang Shu, the work now called Xin Tang Shu, as a history
      written by the Song authors Ouyang Xiu and Song Qi, corroborating its
      Northern Song authorship rather than a Tang-period origin.
  - url: https://lbzx.xhu.edu.cn/_upload/article/files/46/5c/ac6d07014008a55d07898d452e7d/8d4f277d-88ff-42b3-8531-e5779211b6ba.pdf
    title: 论修建都江堰的历史必然性和偶然性——以大禹、李冰为中心
    publisher: 西华大学李冰研究中心
    supports: >-
      The Huayang Guo Zhi description associates Li Bing with building a river
      divider; the Fish Mouth, Flying Sand Weir, and Bottle-Neck perform
      diversion, flood and sediment release, and intake control. The article
      also notes navigation and state interests alongside irrigation benefits.
  - url: https://wkxb.sicnu.edu.cn/Publish/201411/20141125160003758.pdf
    title: 李冰化神追程
    publisher: 四川师范大学学报（社会科学版）
    supports: >-
      Stories of Li Bing battling a river spirit appear after the early record;
      the claim that Li Bing had a son called Erlang appears much later, in the
      Song period. These traditions belong to the later growth of legend, not
      to an eyewitness construction account.
  - url: https://www.scsqw.cn/upload/main/contentmanage/article/file/201702082129543938.pdf
    title: 四川省志·水利志第四篇 水利管理
    publisher: 四川省地方志工作办公室
    supports: >-
      The surviving Fengsu Tongyi tradition places Li Bing's encounter with a
      river spirit in an Eastern Han text. It is evidence for the provenance of
      the legend, not for an eyewitness construction scene.
  - url: https://m.thepaper.cn/newsDetail_forward_23566893
    title: 古道高州：追寻先贤的背影
    publisher: 四川省地方志工作办公室（方志四川）
    supports: >-
      Huayang Guo Zhi places Li Bing's fire-setting against rock at Bodao, on a
      route in southern Sichuan, not at Bottle-Neck in Dujiangyan. The passage
      mentions accumulated fuel and burning but does not describe a fire-and-
      cold-water construction method at Bottle-Neck.
  - url: https://marx.sdu.edu.cn/info/1205/7062.htm
    title: 教学案例：都江堰 人与自然和谐共生的典范
    publisher: 山东大学马克思主义学院
    supports: >-
      A contemporary educational retelling includes the familiar account of
      workers heating rock and cooling it with water while cutting the
      Bottle-Neck passage. The work cites this only as evidence that the detail
      circulates in popular retellings, not as proof of an eyewitness event.
  - url: https://artsandculture.google.com/asset/the-statue-of-libing/hwEt0mXEBB0_mw?hl=zh-cn
    title: 李冰像
    publisher: 四川博物院（Google Arts & Culture 馆藏页）
    supports: >-
      The 2.9-meter Li Bing statue was excavated from the outer-river bed below
      the Dujiangyan suspension bridge in March 1974. Its inscription identifies
      Li Bing and records a precise production date, making it archaeological
      evidence for his later commemoration.
  - url: https://lbzx.xhu.edu.cn/_upload/article/files/ef/0e/00e6f8e54388883daa5ef7c80bb2/f193f9fd-d13b-4b25-b242-7fa60bef87bc.pdf
    title: 古代都江堰岁修制度——从《秦蜀守李冰湔堋堰官碑》说起
    publisher: 西华大学学报（哲学社会科学版）
    supports: >-
      The Li Bing stone figure was found in 1974 and bears a 168 CE inscription
      naming the water officials who made it. Later records equate Shilang Weir
      with the overflow works represented today by Flying Sand Weir and describe
      continuing annual inspection, sediment removal, and low-weir repair.
  - url: https://www.scspc.gov.cn/html/wszyxs_61/wxys_65/2014/0110/73652.html
    title: 都江堰岁修 古法新方两相宜
    publisher: 四川人大网
    supports: >-
      Macha diversion uses linked wooden tripods, bamboo mats, stone-filled
      baskets, and earth to block or redirect flow so exposed reaches can be
      repaired. The documented form is a later traditional technique; the story
      therefore calls its Warring States wooden frames the kind later known as
      macha rather than claiming the later procedure unchanged.
  - url: https://wwj.chengde.gov.cn/art/2025/12/8/art_962_1094945.html
    title: 都江堰：文化遗产与时代脉搏同频共振的见证
    publisher: 承德市文物局
    supports: >-
      The three headworks are mutually dependent: Fish Mouth divides the river,
      Flying Sand Weir releases excess inner-river water and sediment, and
      Bottle-Neck is the main intake. The heritage system has been maintained
      and remains in use.
notes: >-
  The modern heritage account links Li Bing with the three-part system, but the
  early records do not name Fish Mouth or Flying Sand Weir or preserve their
  construction order. The Northern Song Xin Tang Shu records the Tang-era
  overflow work as Shilang Weir, while Fish Mouth repeatedly moved and reached
  its present location in 1936. Huayang Guo Zhi was compiled roughly four centuries
  after the Shiji account. Its fire-setting passage concerns Bodao and does not
  place fire and cold water at Bottle-Neck. Qiao's higher weir, Lian's tests,
  Li Bing's speeches, the Warring States use of later-named macha, and the exact
  worksite sequence are explicit fiction. “The weir that does not block” is a
  thematic description of damless diversion, not a quotation from Li Bing.
