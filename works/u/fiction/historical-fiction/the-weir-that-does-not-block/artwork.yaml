schema_version: 1
style: woodblock-print
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  lian: A thirteen-year-old East Asian girl with a round face, straight black hair in one low loop tied with rust-red cord, indigo cross-collar wrap jacket, mustard trousers, straw sandals, forest-green shoulder pouch, and smooth bamboo measuring staff.
  bao: A lean middle-aged East Asian man with weathered cheeks, short black mustache, forest-green cross-collar robe, indigo headcloth, rust-red belt, straw sandals, and a sheathed bamboo knife.
  qiao: A broad middle-aged East Asian man with a square face, compact topknot, mustard work tunic, dark forest-green trousers, indigo leg wraps, straw sandals, and plain hemp rope.
  li_bing: A middle-aged East Asian man with an angular face, bound black hair under a simple tall dark-cloth cap, dark indigo cross-collar robe, rust-red sash, forest-green outer mantle, cloth shoes, and an unmarked bamboo survey staff.
  setting: Late Warring States Min River at the mountain exit above the Chengdu Plain, with steep Yulei rock, broad cobble bars, bamboo, braided channels, woven bamboo stone cages, wooden tripods, and no later temples, bridges, concrete, metal gates, modern tools, or modern clothing in historical scenes.
  waterworks: Fish Mouth is a long narrow cobble-and-bamboo divider pointing upstream; Flying Sand Weir is visibly low between the inner river and outer river; Bottle-Neck is a narrow rock-cut intake beside detached Li Dui rock. The three remain spatially consistent.
  palette: Fibrous cream paper, indigo water and shadows, rust-red accents, mustard earth and clothing, forest-green bamboo and vegetation, black carved linework.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Wide elevated view of Lian and Li Bing on a cobble bank above the complete three-part river system, with the Fish Mouth dividing the Min River, the low Flying Sand Weir crossing toward the outer river, and the narrow Bottle-Neck passage opening toward the plain; no solid dam spans the river.
  - id: p01
    file: artwork/p01.webp
    scene: After high water, Lian and Bao stand beside flooded field edges and a dry higher patch while the Min River leaves muddy branches across the plain; Bao carries rolled bamboo strips.
  - id: p02
    file: artwork/p02.webp
    scene: At a riverside work meeting, Qiao stretches a rope straight across a small model channel to propose a barrier while Li Bing lowers the rope and points along the flowing river; Lian listens with her bamboo staff.
  - id: p03
    file: artwork/p03.webp
    scene: Lian, Qiao, and Li Bing release several plain floating wood chips upstream at a natural bend and watch them divide around a long cobble bar, with safety ropes and workers on shore.
  - id: p04
    file: artwork/p04.webp
    scene: Bao and crews weave long bamboo cages, fill them with rounded cobbles, and place them in a narrow upstream-pointing divider while Lian counts completed loads with plain stones.
  - id: p05
    file: artwork/p05.webp
    scene: At low water, Lian follows the deeper inner branch with her bamboo staff as it curves toward the clearly visible narrow rock-cut Bottle-Neck passage; Qiao watches from the bank.
  - id: p06
    file: artwork/p06.webp
    scene: During higher water, Lian and Qiao observe from a secured bank as the straighter outer branch carries the larger visible flow around the same Fish Mouth divider.
  - id: p07
    file: artwork/p07.webp
    scene: The inner river presses toward Bottle-Neck while Li Bing uses his staff to indicate a low side route between the inner and outer channels; Lian studies a small water model on the bank.
  - id: p08
    file: artwork/p08.webp
    scene: Workers finish the low bamboo-and-cobble Flying Sand Weir while Qiao compares its low crest with the much higher bank and Lian braces a basket safely on shore.
  - id: p09
    file: artwork/p09.webp
    scene: Rising muddy water passes over the low Flying Sand Weir into the outer river as Lian, Qiao, and Li Bing watch from a high roped platform.
  - id: p10
    file: artwork/p10.webp
    scene: Muddy water and small stones visibly cross the low weir toward the outer river while clearer inner water turns toward Bottle-Neck; Lian holds two settling bowls without markings.
  - id: p11
    file: artwork/p11.webp
    scene: The fixed narrow Bottle-Neck rock passage admits a controlled stream toward the plain while excess inner-river water remains outside; Lian measures from a safe ledge with her bamboo staff.
  - id: p12
    file: artwork/p12.webp
    scene: Elevated view shows all three linked water movements at once, with Lian tracing the route using her bamboo staff beside Li Bing and Qiao on a high overlook.
  - id: p13
    file: artwork/p13.webp
    scene: After a strong flow, one edge of the bamboo-cage divider has sagged; Bao, Qiao, Lian, and a crew replace loose cobbles and woven cages in shallow diverted water with ropes.
  - id: p14
    file: artwork/p14.webp
    scene: Qiao stacks a proposed extra basket above the low weir, but Lian points to a water-stained high mark and the open overflow route; Li Bing compares both heights with his staff.
  - id: p15
    file: artwork/p15.webp
    scene: In the dry season, the lower deeper inner channel still carries water through Bottle-Neck while the outer cobble bed is shallow; Lian and Bao inspect the flow.
  - id: p16
    file: artwork/p16.webp
    scene: Water from Bottle-Neck enters several branching earth canals across the plain where farmers guide modest flows between fields; Lian stands beside Bao without implying instant abundance.
  - id: p17
    file: artwork/p17.webp
    scene: An older Lian during another maintenance season hands woven bamboo strips to a new group while workers clear deposited cobbles and repair the low weir.
  - id: p18
    file: artwork/p18.webp
    scene: A symbolic later-history still life shows plain bound bamboo slips, the wordless Eastern Han stone figure of Li Bing, and a small model of the three waterworks, with no readable marks or inscriptions.
  - id: p19
    file: artwork/p19.webp
    scene: A later storyteller gestures beside a brazier and bowl of water while listeners imagine a pale dragon-shaped cloud above the river and a heroic second figure; the historical stonework remains separate in the background, making the imagined scene visibly framed as legend.
  - id: p20
    file: artwork/p20.webp
    scene: Present-day Dujiangyan shown from above with the three working components and distant visitors, while faint carved bands suggest many generations of repair without any text or modern advertising.
