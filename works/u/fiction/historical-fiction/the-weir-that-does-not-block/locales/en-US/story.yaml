questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: What two seasonal problems make Lian first imagine a wall across the river?
    answer: Summer floodwater spreads over low fields and fills channels with stones, while higher fields can become hard and dry later.
    page_refs:
      - p01
  - id: q02
    type: compare
    speaker: narrator
    prompt: How does the river behave differently at Fish Mouth during low water and high water?
    answer: At low water, the narrow deep inner branch keeps a useful current toward the plain. During high water, the outer course spreads wider and sounds louder.
    page_refs:
      - p05
      - p06
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: Why is Flying Sand Weir built low?
    answer: Its low crest lets excess inner-river water cross back to the outer river before too much flow crowds toward Bottle-Neck.
    page_refs:
      - p07
      - p08
      - p09
  - id: q04
    type: evidence
    speaker: narrator
    prompt: What can Lian's two bowls support about sediment, and what can they not support?
    answer: They support that grit remains in both places and that some muddy water and small stones cross the weir. They do not show that all sediment leaves the inner river.
    page_refs:
      - p10
  - id: q05
    type: synthesis
    speaker: narrator
    prompt: How do Fish Mouth, Flying Sand Weir, and Bottle-Neck change the water reaching the plain as one system?
    answer: Fish Mouth divides the river, Flying Sand Weir releases excess water and some moving sediment, and Bottle-Neck limits the final intake. Each part changes what reaches the next.
    page_refs:
      - p04
      - p09
      - p10
      - p11
      - p12
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: Why is Qiao's proposal to raise Flying Sand Weir reasonable at first but risky for the system?
    answer: A higher structure might resist damage longer, but it would delay overflow and allow more water to crowd toward Bottle-Neck before escaping.
    page_refs:
      - p13
      - p14
  - id: q07
    type: source-analysis
    speaker: narrator
    prompt: Which parts of Lian's story are supported by historical evidence, and which are openly invented?
    answer: Early evidence links Li Bing to water management but does not establish all three works in their modern forms or locations. Their joint attribution follows the modern heritage account. Lian, her family, their dialogue, measurements, and construction order are invented.
    page_refs:
      - p18
      - p20
  - id: q08
    type: research-response
    speaker: narrator
    prompt: What checks should a reader make before treating a later story about Li Bing as an eyewitness account?
    answer: The reader should ask when the story first appeared, what kind of source preserves it, and whether physical or written evidence supports its details.
    page_refs:
      - p19
  - id: q09
    type: main-idea
    speaker: narrator
    prompt: How does Lian's idea of a strong water-control system change?
    answer: She moves from valuing a high barrier to valuing a coordinated system that leaves water room to pass and depends on observation and repair.
    page_refs:
      - p01
      - p02
      - p12
      - p14
      - p17
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: The river left two kinds of trouble at Lian's home. In summer, muddy water spread over the lower fields and pushed stones into the old channels. Months later, the higher fields could turn hard and dry. Thirteen-year-old Lian helped her father, Bao, split bamboo for baskets, yet she kept watching the Min River instead of her knife. A wall across that restless water seemed like the simplest answer. If a wall held the flood back, she reasoned, people could release water only when the fields needed it.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "When Governor Li Bing gathered the river crews, senior worker Qiao stretched a rope across a small model channel on the bank. “Build high along this line, and the flood must stop,” Qiao said. Li Bing lowered the rope. He proposed a "
            - vocabulary:
                id: weir
                text: weir
            - text: " that would guide part of the river without closing its main course. Qiao frowned at the open gap. Lian did too. A structure that let water pass looked unfinished to both of them. Li Bing gave Lian a smooth bamboo staff. “Mark where the current already chooses to go,” he said."
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "At a broad bend below the mountains, the crew released small wood chips while workers held safety ropes from shore. Some chips followed a deep curve toward the plain; others continued along the wider riverbed. The split changed as the water rose during the day. Lian placed pebbles beside her staff to record each result. This natural "
            - vocabulary:
                id: diversion
                text: diversion
            - text: " did not divide the river equally, and it did not behave the same way at every height. Li Bing chose the upstream point of a long cobble bar, where a narrow structure could strengthen the choice the river was already making."
    - id: p04
      illustration: p04
      paragraphs:
        - text: Bao's baskets were longer than a person. Crews packed them with rounded river stones, tied them shut, and lowered them beside earlier cages. Layer by layer, the line reached upstream like the narrow nose of a fish. The divider would later be called Fish Mouth. Water struck its point and separated into two branches. Lian carried counting stones from one completed cage to the next, then checked their line from the bank. The divider did not split the flow into fixed shares. It changed the riverbed so moving water found two paths, an inner branch toward the plain and an outer branch down the old course.
    - id: p05
      illustration: p05
      paragraphs:
        - text: During low water, Lian walked the bank of the inner branch. Its bed was narrower and deeper than the broad outer bed, so a useful current still turned toward the plain. Ahead, workers had cut through a spur of Yulei Mountain, separating Li Dui from the mountain. The opening would later be called Bottle-Neck for its narrow shape. Its fixed width also limited how much water could enter the canals beyond it. Lian pushed her staff into the shallows and found steady water where she had expected a nearly dry channel. Qiao smiled. “The summer test has not arrived,” he warned.
    - id: p06
      illustration: p06
      paragraphs:
        - text: The summer rise came after rain in the mountains. From a roped bank above the current, Lian saw the main flow rush along the wide outer course. The Fish Mouth divider still sent a strong branch inward, while the outer course spread wider and sounded louder. Qiao's line across the model had represented a wall facing all of that water. The pointed divider met only part of it and sent the rest around either side. Lian no longer called the open course a missing piece. Still, the inner branch climbed toward the rock passage, carrying more water than the canals could safely receive.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Li Bing marked a side opening between the inner and outer rivers, just before Bottle-Neck. “When the inner water rises above a low crossing, the extra flow can return to the outer river,” he said. Lian shaped a bank model with wet sand. A high ridge trapped water behind it. A lower ridge allowed the rising surface to pass over. Qiao pressed his thumb through the low ridge and asked what would keep the whole thing from washing away. Li Bing did not promise that it would never break. “Build it where the crews can inspect and repair it,” he said.
    - id: p08
      illustration: p08
      paragraphs:
        - text: The new low weir, later called Flying Sand Weir, barely rose beside the riverbank. Woven cages held its cobbles in place while gaps in the weave let water pass. Qiao stood on shore with a spare basket at his feet. “We have spent months guiding water, and now we leave it a way out,” he said. Bao tightened the binding on a cage. The low crest would let high water return toward the outer river. Qiao still looked doubtful, yet he helped secure the final rope before the river rose again.
    - id: p09
      illustration: p09
      paragraphs:
        - text: "When the river rose again, everyone watched from a high platform. The inner branch spread toward the low crest, crossed it, and returned to the outer branch. Water before Bottle-Neck still rose, but part of the flow had already escaped. Lian noted the depth before Bottle-Neck at the moment water reached the crest. Her observation could not measure every drop, yet it showed that the low weir released excess water before the fixed rock opening received it. Qiao stopped asking for another basket on top."
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Floodwater did not carry water alone. It moved brown mud, sand, and stones down from the mountains. This material, called "
            - vocabulary:
                id: sediment
                text: sediment
            - text: ", could settle where a current slowed and could fill a channel over time. Lian collected water at the inner bank and below the low crossing, then carried both settling bowls to a safe ledge. Grit gathered in each bowl, so she did not claim that the inner river had become clean. Yet she could see muddy water and small stones passing over Flying Sand Weir toward the outer course. Releasing some moving material mattered because Bottle-Neck could still be blocked if crews ignored what settled there."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "Bottle-Neck performed a different task. Its rock sides did not widen when the inner river swelled, so the passage set a firm limit on the opening toward the plain. Water that could not pass at once remained outside, where Flying Sand Weir offered another route. During lower flow, the same narrow entrance still fed the new channels. Lian had first imagined one gate that someone would open and close. Instead, the flow passed through a sequence: division at Fish Mouth, release at the low weir, then entry through a fixed neck. Each part changed what reached the next."
    - id: p12
      illustration: p12
      paragraphs:
        - text: From a high ledge, Lian traced the whole path with her bamboo staff beside Li Bing and Qiao. The divider split the river first. The low weir let excess water and some sediment return to the outer course, and the fixed rock opening limited the intake. Qiao studied the three places, then asked, “So is it finished?” Lian looked down at a pale line of fresh stones beside the divider. “Only for this season. When the channel changes, we will measure again,” she said.
    - id: p13
      illustration: p13
      paragraphs:
        - text: The warning arrived before the season ended. Strong water loosened several cages along the Fish Mouth edge and left a mound of cobbles near the inner channel. The divider still held its general line, but one side sagged. Temporary wooden tripods held back part of the flow until the repair area became shallow enough to enter with ropes. Bao replaced split bamboo. Qiao moved loose stones. Lian checked depth with her smooth staff, compared the bed with her old notes, and found where digging was needed. Before the crew reopened the temporary barrier, Li Bing added the weakened reach to the next inspection.
    - id: p14
      illustration: p14
      paragraphs:
        - text: At Flying Sand Weir, Qiao lifted a spare cage toward the crest. “One more layer would survive longer,” he said. Lian pointed to the high-water stain on the bank. With another layer, the overflow would have started later, after more water had crowded toward Bottle-Neck. “Then water could crowd against Bottle-Neck before it escapes,” she answered. Li Bing measured both heights with his staff and told the crew to repair the old low line. Qiao set the basket down and joined the repair crew.
    - id: p15
      illustration: p15
      paragraphs:
        - text: "When the dry months returned, the outer bed showed wide bars of pale stone. The deeper inner branch continued to turn toward Bottle-Neck. It carried less water than in summer, yet enough passed through the opening to supply several canals. Lian and Bao walked beside one clear current as farmers opened earth channels in turn. No structure had stored a lake behind a wall. Position, depth, and the narrow rock entrance allowed part of the river to move across the sloping plain. Lian used the low water for her own final check: the same system that shed a summer rise still supplied the canals in dry months."
    - id: p16
      illustration: p16
      paragraphs:
        - text: Water did not turn the whole plain green in a day. Some channels stopped at unfinished banks, and some low fields received more than their share. Crews extended branches, cleared deposits, and argued over turns. Lian carried reports back to the riverworks, where Li Bing compared the complaints with the available flow. The main works could bring water through the mountain edge and reduce flood pressure. They could not decide every local channel or repair themselves. Before the next dry month, one crew was still extending a canal while two villages revised their turns at another.
    - id: p17
      illustration: p17
      paragraphs:
        - text: Years later, Lian returned during the low-water repair season with new basket makers beside her. Bao's old knife hung at her belt as she handed woven bamboo strips to the new group. Crews cleared places where stone had gathered, replaced worn cages, and kept Flying Sand Weir low enough to release a future rise. Qiao, now gray at the temples, studied a shoal that had shifted since the last repair. He checked the repaired line without asking for another layer. “The river changed it again,” Qiao said. “Then we begin with what changed,” Lian replied. By sunset, fresh cages filled the gaps, and water was already passing over the repaired low line.
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "No known "
            - vocabulary:
                id: historical-record
                text: historical record
            - text: " names Lian. Her family and conversations are inventions. The earliest surviving account says Li Bing cut through Li Dui and opened waterways around Chengdu. It does not name Fish Mouth or Flying Sand Weir, give a construction order, or preserve Li Bing's words. Placing all three works in their modern forms and locations in Li Bing's time follows today's heritage account, not the early records. The New Book of Tang, completed under the Northern Song in 1060, records the later overflow work as Shilang Weir in the Tang Longshuo era, 661–663. Fish Mouth moved repeatedly; its present site dates from a 1936 rebuilding. A stone figure made in 168 CE names Li Bing, showing that later water officials commemorated him."
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "An Eastern Han text called Fengsu Tongyi preserves a "
            - vocabulary:
                id: legend
                text: legend
            - text: " in which Li Bing battled a river spirit. Still later stories gave him a heroic son called Erlang. Huayang Guo Zhi records fire being used against rock at Bodao, another site. It does not place fire and cold water at Bottle-Neck, and no early source does. Such stories show how communities remembered Li Bing, but they are not eyewitness notes. Readers should ask when a claim appeared, what kind of source carries it, and which physical or written evidence supports it."
    - id: p20
      illustration: p20
      paragraphs:
        - text: "The Dujiangyan system visible today still directs Min River water without a dam across the main channel. Its three famous works operate together, but they were repaired, moved, and reshaped over many centuries. Assigning all three in their modern forms to Li Bing follows the modern heritage account, not the early records. The New Book of Tang was completed under the Northern Song, centuries after Li Bing. The story also invents the works' construction order, Lian's measurements, and Li Bing's speech. That history's account of Tang-era Shilang Weir and Fish Mouth's move in 1936 show why the present view cannot be treated as an unchanged Warring States plan. From above, visitors can still watch the river divide around Fish Mouth, spill over the low weir, and pass through Bottle-Neck toward the plain."
audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and exact, with restrained wonder in the historical coda
        timbre: clear adult voice with a lightly textured center
        pace: measured medium
        pitch: middle-low
    lian:
      display_name: Lian
      tts:
        delivery: quick, practical, and increasingly reflective
        timbre: clear young teenage voice with a firm edge
        pace: lively medium-fast
        pitch: middle-high
    bao:
      display_name: Bao
      tts:
        delivery: warm and concrete, with patient humor
        timbre: soft weathered adult voice
        pace: unhurried medium
        pitch: middle-low
    qiao:
      display_name: Qiao
      tts:
        delivery: blunt and experienced, easing when evidence changes his mind
        timbre: broad rough adult voice
        pace: deliberate medium
        pitch: low
    li_bing:
      display_name: Li Bing
      tts:
        delivery: calm, concise, and attentive rather than ceremonial
        timbre: steady resonant adult voice
        pace: measured medium-slow
        pitch: low-middle
