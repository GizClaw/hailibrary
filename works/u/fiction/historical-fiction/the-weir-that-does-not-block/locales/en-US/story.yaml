          text: Li Bing measured both heights with his staff and told the crew to repair the old low line. Qiao set the basket down and joined the repair crew.
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: When the dry months returned, the outer bed showed wide bars of pale stone. The deeper inner branch continued to turn toward Bottle-Neck.
        - id: p15-b02
          speaker: narrator
          text: It carried less water than in summer, yet enough passed through the opening to supply several canals. Lian and Bao walked beside one clear current as farmers opened earth channels in turn.
        - id: p15-b03
          speaker: narrator
          text: No structure had stored a lake behind a wall. Position, depth, and the narrow rock entrance allowed part of the river to move across the sloping plain.
        - id: p15-b04
          speaker: narrator
          text: Lian used the low water for her own final check. The same system that shed a summer rise still supplied the canals in dry months.
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: Water did not turn the whole plain green in a day. Some channels stopped at unfinished banks, and some low fields received more than their share.
        - id: p16-b02
          speaker: narrator
          text: Crews extended branches, cleared deposits, and argued over turns. Lian carried reports back to the riverworks, where Li Bing compared the complaints with the available flow.
        - id: p16-b03
          speaker: narrator
          text: The main works could bring water through the mountain edge and reduce flood pressure. They could not decide every local channel or repair themselves.
        - id: p16-b04
          speaker: narrator
          text: Before the next dry month, one crew was still extending a canal while two villages revised their turns at another.
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: Years later, Lian returned during the low-water repair season with new basket makers beside her. Bao's old knife hung at her belt as she handed woven bamboo strips to the new group.
        - id: p17-b02
          speaker: narrator
          text: Crews cleared places where stone had gathered, replaced worn cages, and kept Flying Sand Weir low enough to release a future rise.
        - id: p17-b03
          speaker: narrator
          text: Qiao, now gray at the temples, studied a shoal that had shifted since the last repair. He checked the repaired line without asking for another layer.
        - id: p17-b04
          speaker: qiao
          text: The river changed it again.
        - id: p17-b05
          speaker: lian
          text: Then we begin with what changed.
        - id: p17-b06
          speaker: narrator
          text: By sunset, fresh cages filled the gaps, and water was already passing over the repaired low line.
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          content:
            - text: "No known "
            - vocabulary:
                id: historical-record
                text: historical record
            - text: " names Lian. Her family and conversations are inventions."
        - id: p18-b02
          speaker: narrator
          text: The earliest surviving account says Li Bing cut through Li Dui and opened waterways around Chengdu. It does not name Fish Mouth or Flying Sand Weir, give a construction order, or preserve Li Bing's words.
        - id: p18-b03
          speaker: narrator
          text: Placing all three works in their modern forms and locations in Li Bing's time follows today's heritage account, not the early records.
        - id: p18-b04
          speaker: narrator
          text: The New Book of Tang was completed under the Northern Song in 1060. Its geography section records Shilang Weir and dates that Tang-era work from 661 to 663, during the Longshuo era. Fish Mouth moved repeatedly; its present site dates from a 1936 rebuilding. A stone figure made in 168 CE names Li Bing, showing that later water officials commemorated him.
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          content:
            - text: "An Eastern Han text called Fengsu Tongyi preserves a "
            - vocabulary:
                id: legend
                text: legend
            - text: " in which Li Bing battled a river spirit. Still later stories gave him a heroic son called Erlang."
        - id: p19-b02
          speaker: narrator
          text: Huayang Guo Zhi records fire being used against rock at Bodao, another site. It does not place fire and cold water at Bottle-Neck, and no early source does.
        - id: p19-b03
          speaker: narrator
          text: Such stories show how communities remembered Li Bing, but they are not eyewitness notes. Readers should ask when a claim appeared, what kind of source carries it, and which physical or written evidence supports it.
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: The Dujiangyan system visible today still directs Min River water without a dam across the main channel.
        - id: p20-b02
          speaker: narrator
          text: Its three famous works operate together, but they were repaired, moved, and reshaped over many centuries.
        - id: p20-b03
          speaker: narrator
          text: Assigning all three in their modern forms to Li Bing follows the modern heritage account, not the early records. The New Book of Tang was completed under the Northern Song, centuries after Li Bing.
        - id: p20-b04
          speaker: narrator
          text: The story also invents their construction order, Lian's measurements, and Li Bing's speech.
        - id: p20-b05
          speaker: narrator
          text: That history's account of Tang-era Shilang Weir and Fish Mouth's move in 1936 show why the present view cannot be treated as an unchanged Warring States plan. From above, visitors can still watch the river divide around Fish Mouth, spill over the low weir, and pass through Bottle-Neck toward the plain.
