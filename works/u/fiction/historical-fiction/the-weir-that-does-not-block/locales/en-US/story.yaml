schema_version: 2
language: en-US
writer: tomorrow-lens
title: The Weir That Does Not Block the River
summary: In the late Warring States period, fictional basket maker's daughter Lian expects a strong water-control structure to stop the Min River. By observing low water, floodwater, sediment, and repair under Li Bing, she tests a divider, a low overflow weir, and a rock-cut intake. A source-aware coda explains how later records and modern heritage accounts connect those works to today's system.
