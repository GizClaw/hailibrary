        - id: p01-b03
          speaker: narrator
          text: 阿保没有笑她，只叫她先看看，江水究竟从哪里来，又要往哪里去。
    - id: p02
      illustration: p02
      blocks:
        - id: p02-b01
          speaker: narrator
          text: 李冰召集治水的人时，老水工乔叔在岸边的小水槽上横拉长绳。
        - id: p02-b02
          speaker: qiao
          text: 墙就该筑在这里，越高越能挡水。
        - id: p02-b03
          speaker: narrator
          content:
            - text: 李冰收起那根绳，说要修的不是堵死大江的墙，而是顺着水势导水的
            - vocabulary:
                id: weir
                text: 堰
            - text: 。江中仍会留出通路。乔叔听后直摇头，连宁也觉得少了一半。李冰把一根竹竿交给连宁。她要每天量水的深浅、记下流向，再看这个办法是否可行。
        - id: p02-b04
          speaker: li_bing
          text: 先把水路记下来。
    - id: p03
      illustration: p03
      blocks:
        - id: p03-b01
          speaker: narrator
          text: 山口下方正好有一道弯。工匠们站在岸上系好护绳，把许多小木片放到上游水面。木片有的沿深水弯向平原，有的顺着宽河床继续向下；水位稍一变化，两边的数目也跟着变。
        - id: p03-b02
          speaker: narrator
          content:
            - text: 连宁用石子记下每次结果。这种自然形成的
            - vocabulary:
                id: diversion
                text: 分流
            - text: 并不是把江水平均切开，也不会永远保持同一个样子。
        - id: p03-b03
          speaker: narrator
          text: 李冰最后选中江心长滩的上端，准备从那里伸出一道尖长的分水堤，让原有的两条水路变得稳定一些。
    - id: p04
      illustration: p04
      blocks:
        - id: p04-b01
          speaker: narrator
          text: 阿保和同伴编出的竹笼比人还长。大家把河滩上的圆石装进去，封紧笼口，再把它们一层层放到江心。
        - id: p04-b02
          speaker: narrator
          text: 分水堤的尖头迎向上游，远看像鱼嘴，因此后人称它为“鱼嘴”。水撞上尖头，便从两侧分开。
        - id: p04-b03
          speaker: narrator
          text: 连宁抱着计数用的石子来回跑，发现两边的水量并不固定。分水堤只改变河床形状，让水更容易走上两条路：外江顺原河道下行，内江转向平原。
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          text: 枯水时，外江露出一大片浅色石滩，内江却因为河床窄而深，仍有水流向东。连宁沿岸走到玉垒山前，看见工匠从山体边开出一道窄口。
        - id: p05-b02
          speaker: narrator
          text: 后来，人们称它为“宝瓶口”。它连着平原水道，宽度固定，能够限制进入的水量。连宁把竹竿插进浅处，水面虽然不高，流速却很稳。
        - id: p05-b03
          speaker: qiao
          text: 别急着下结论。等山里的大水下来，再看鱼嘴还能不能守住位置。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 山中连日下雨，夏水终于涨了。连宁站在系着护绳的高岸上，只见主流顺着较直、较宽的外江猛冲下去。外江水面比内江更宽，水声也更响。
        - id: p06-b02
          speaker: narrator
          text: 内江同样在涨，却没有吞下全部来水。她想起乔叔横在小水槽上的长绳：那条线代表一面堵住整条江的高墙，此刻就要正面承受这股力量。
        - id: p06-b03
          speaker: narrator
          text: 鱼嘴只把尖头伸进水中，两边都给水留下通路。连宁第一次觉得，“没有拦住”也可能是设计的一部分。
        - id: p06-b04
          speaker: narrator
          text: 可内江水位还在上升，宝瓶口前很快挤满急流。
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          text: 李冰在宝瓶口之前选了一处低地，那里位于内江和外江之间。他用竹竿划出一条不高的线。
        - id: p07-b02
          speaker: li_bing
          text: 内江水涨过这条线，多出的水就能越过去，回到外江。
        - id: p07-b03
          speaker: narrator
          text: 连宁在岸边用湿沙做了两个小坝。高坝把水越积越深，低坝却让水面到达一定高度后自行漫过。
        - id: p07-b04
          speaker: narrator
          text: 乔叔用手一按，低坝立刻塌了。他问，真正的工程坏了怎么办。李冰没有说它永远不坏。
        - id: p07-b05
          speaker: li_bing
          text: 修在便于查看和更换竹笼的位置。
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: 低堰筑好以后，它靠着高高的河岸，并不起眼。竹笼兜住卵石，缝隙仍让水流过，堰顶只略高于眼前的水面。乔叔望着堰顶，还是不放心。
        - id: p08-b02
          speaker: qiao
          text: 忙了这么久把水引进来，现在又专门给它留出口？
        - id: p08-b03
          speaker: narrator
          text: 阿保低头扎紧竹绳。
        - id: p08-b04
          speaker: narrator
          text: 水再涨，就会越过这道低线回到外江。
        - id: p08-b05
          speaker: narrator
          text: 乔叔没有再争，只拉紧最后一根护绳，等下一场大水检验。
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: 第二次涨水时，众人都退到高台上。内江水涨到低堰顶面，漫过堰顶，沿侧面流回外江。宝瓶口前的水位还在升，但已有一部分水提前离开。
        - id: p09-b02
          speaker: narrator
          text: 连宁记下水刚越过堰顶时，宝瓶口前的水有多深。这种观察不能算出每股水有多少，却足以说明低堰先放走了多出的水。
        - id: p09-b03
          speaker: narrator
          text: 乔叔盯着空着的备用竹笼看了许久，终于把它搬回岸上。后来，这道低堰被称为“飞沙堰”。
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          content:
            - text: 洪水带来的不只是水，还有山上冲下的黄泥、沙粒和石块。这些随水移动、又可能沉在河底的材料叫
            - vocabulary:
                id: sediment
                text: 泥沙
            - text: 。如果它们年年堆在同一处，水道就会越来越浅。
        - id: p10-b02
          speaker: narrator
          text: 连宁分别在内江岸边和低堰下取水，再把两只陶碗端到安全的高处静置。两碗都有细沙，所以她没有说内江已经变清。
        - id: p10-b03
          speaker: narrator
          text: 她亲眼看到的只是：一部分浑水和小石越过低堰，回到外江。宝瓶口附近仍会有沉积，若从此无人清理，再巧的水路也可能变窄。
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: 连宁原以为宝瓶口只是一条新开的水道，直到大水来到，她才看懂那道窄口的另一层作用。岩壁不会随着内江水位一起变宽，因此能限制同一时刻进入平原的水量。
        - id: p11-b02
          speaker: narrator
          text: 暂时进不去的水留在外面，还可以从飞沙堰泄回外江。到了枯水期，这个入口又能继续把内江水送向东边。
        - id: p11-b03
          speaker: narrator
          text: 宝瓶口不负责分江，鱼嘴不负责最后限流，飞沙堰也不负责把水送到田里。三个工程前后相接，前一个改变了后一个面对的水量和泥沙。
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: 连宁和乔叔跟着李冰登上高坡，从头到尾望了一遍。
        - id: p12-b02
          speaker: narrator
          text: 连宁用竹竿依次点着三处。
        - id: p12-b03
          speaker: narrator
          text: 分水堤先把江水分开，低堰再让多出的水和一部分沙石回到外江，岩石窄口最后限制入口。
        - id: p12-b04
          speaker: narrator
          text: 乔叔看了看三处，问这样是否就算完工。连宁望见鱼嘴旁多出一条浅色石带。
        - id: p12-b05
          speaker: lian
          text: 只能说这一季能用。明年水路变了，我们还要再量。
        - id: p12-b06
          speaker: narrator
          text: 李冰随即派人去量那条新石带。
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: 没等明年，江水先给了回答。一次急流冲松鱼嘴边的几个竹笼，内江口还堆起新的卵石滩。分水堤没有全坏，边缘却塌下去一截。
        - id: p13-b02
          speaker: narrator
          text: 工匠架起后来称为“杩槎”的木架，挡开一股水，让修补处变浅，再系着绳下去。阿保换掉断裂的竹条，乔叔搬开松石，连宁拿旧记录核对河床深浅。
        - id: p13-b03
          speaker: narrator
          text: 修好以后，李冰仍把这处松动的河段列入下次查看。
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: 修到飞沙堰时，乔叔又抱来一只竹笼，想垒在原来的顶上。
        - id: p14-b02
          speaker: qiao
          text: 加高一层，下次就不容易冲坏。
        - id: p14-b03
          speaker: narrator
          text: 连宁没有马上反对。她先把竹竿对准岸边的大水痕，再移到堰顶量高度。若再加高，内江水要涨得更多才会漫出去，宝瓶口前会先承受更大的压力。
        - id: p14-b04
          speaker: lian
          text: 再高一层，水会先挤到宝瓶口前。
        - id: p14-b05
          speaker: narrator
          text: 李冰量过两处高度，叫大家仍按旧低线修复。乔叔放下竹笼，跟着众人去补原来的低堰。
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: 又到少雨的季节，外江浅得露出宽阔石滩，较深的内江仍有水转向宝瓶口。水量比夏日小得多，却能沿着平原的坡势流进几条水道。
        - id: p15-b02
          speaker: narrator
          text: 连宁和阿保跟着一股水走，看农人依次打开田边的土口，再把它合上，让下一处接水。
        - id: p15-b03
          speaker: narrator
          text: 这里没有高坝蓄成的大湖，也没有人站在江心开关大门。鱼嘴的位置、两边河床的深浅和宝瓶口的宽度一起起作用。
        - id: p15-b04
          speaker: narrator
          text: 连宁也在检验自己的猜想：这套工程放走夏日大水以后，枯水时还能不能给水道送水。
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: 水并没有一夜之间染绿整个平原。有些支渠挖到半路，有些低田先得了太多水，高处的人还在等。
        - id: p16-b02
          speaker: narrator
          text: 工匠继续开沟、清沙，村里也要商量各处用水的次序。连宁把沿途听到的问题带回渠首，李冰让人拿这些情况对照当天的来水。
        - id: p16-b03
          speaker: narrator
          text: 鱼嘴、飞沙堰和宝瓶口能把一部分岷江水安全送进平原，却不能替每个村子决定水路，更不会自行修补。
        - id: p16-b04
          speaker: narrator
          text: 接下来的一个月里，一队人还在延长支渠，两个村子也重新排过用水次序。
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: 许多年后，连宁在枯水岁修时又回到鱼嘴。阿保的竹刀已经挂在她腰间，她把编好的竹条递给一群年轻学徒。
        - id: p17-b02
          speaker: narrator
          text: 众人清走新近淤积的泥沙和卵石，换掉破旧竹笼，又按原来的低线修好飞沙堰。两鬓发白的乔叔检查完堰顶，没有再要求加高。他望着变了位置的浅滩。
        - id: p17-b03
          speaker: qiao
          text: 江水又把工程改了。
        - id: p17-b04
          speaker: lian
          text: 那就从变化的地方量起。
        - id: p17-b05
          speaker: narrator
          text: 日落前，新竹笼补好了缺口，水已经从修过的低线流过。
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          content:
            - text: 已知
            - vocabulary:
                id: historical-record
                text: 史料
            - text: 中都找不到连宁。她的家人、经历和对白都是虚构的。
        - id: p18-b02
          speaker: narrator
          text: 早期文字只说李冰凿开离堆、在成都一带开通水道，未写鱼嘴、飞沙堰、施工顺序或李冰原话。
        - id: p18-b03
          speaker: narrator
          text: 故事把三处工程的现代形制和位置放进李冰时代，采用的是现代遗产叙述，并非早期记载。《华阳国志》约在《史记》之后四百年成书，提到李冰“壅江作堋”。
        - id: p18-b04
          speaker: narrator
          text: 北宋嘉祐五年，也就是公元一千零六十年纂成的《新唐书·地理志》，记载了龙朔年间的“侍郎堰”工程。龙朔年间是公元六百六十一年至六百六十三年。鱼嘴屡次移位，现址由1936年大修确定。建宁元年，也就是公元一六八年的李冰石像说明东汉水官仍在纪念他。
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          content:
            - text: 关于李冰，后世还流传着许多
            - vocabulary:
                id: legend
                text: 传说
            - text: 。东汉《风俗通义》保存了李冰与江神相斗的故事，更晚的传说又给他添了一位帮助降龙的儿子二郎。
        - id: p19-b02
          speaker: narrator
          text: 《华阳国志》确实写过积薪烧石，地点却在另一处：僰道。它没有写在宝瓶口用火和冷水破石，其他早期材料也没有。
        - id: p19-b03
          speaker: narrator
          text: 判断一个细节时，读者还要追问：这个说法何时出现，由哪类材料保存，又有哪些实物或文字能够支持它。
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: 今天的都江堰仍以无坝方式引岷江水，三处工程也仍在配合运行。不过，它们历经修整、移位和改建。
        - id: p20-b02
          speaker: narrator
          text: 把现代形制都归到李冰时代，采用的是现代遗产叙述，不是早期史料原话。
        - id: p20-b03
          speaker: narrator
          text: 北宋编成的《新唐书》晚于李冰许多世纪。故事中的施工顺序、连宁的测量和李冰的对白也属虚构。该书对唐代“侍郎堰”的记载，以及鱼嘴现址到1936年大修才确定的事实，都提醒读者：眼前景象并非未变的战国图纸。
        - id: p20-b04
          speaker: narrator
          text: 从高处望去，江水仍绕过鱼嘴分成两路，越过低堰，再从宝瓶口流向平原。
