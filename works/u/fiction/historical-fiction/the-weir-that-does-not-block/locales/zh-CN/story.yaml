      tts:
        delivery: 直截了当，接受证据后语气放缓
        timbre: 宽厚粗粝的成年男声
        pace: 稳重的中速
        pitch: 低音
    li_bing:
      display_name: 李冰
      tts:
        delivery: 平静简练，重视现场观察而非训话
        timbre: 沉稳清楚的成年男声
        pace: 略慢的中速
        pitch: 中低音
