schema_version: 2
language: zh-CN
writer: 明日镜
title: 不拦河的堰
summary: 战国末年，虚构的竹匠女儿连宁以为治水就该筑起高墙。她在李冰主持的工地上观察枯水、洪水、泥沙和修补，逐渐看懂分水堤、低溢洪堰与岩石窄口怎样配合。故事末章再说明后世记录和现代遗产叙述如何把这些工程与今天的都江堰联系起来。
