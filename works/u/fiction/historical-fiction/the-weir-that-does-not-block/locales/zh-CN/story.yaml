questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪两种季节性的困难，让连宁最初想在江上筑高墙？
    answer: 夏日洪水会淹到低处并把石子带进旧水沟，少雨时高处的土地又会干裂。
    page_refs:
      - p01
  - id: q02
    type: compare
    speaker: narrator
    prompt: 枯水和涨水时，鱼嘴两边的水流有什么不同？
    answer: 枯水时，较窄较深的内江仍能引水向东；涨水时，较直较宽的外江水面更宽，水声也更响。
    page_refs:
      - p05
      - p06
  - id: q03
    type: short-answer
    speaker: narrator
    prompt: 为什么飞沙堰要保持较低的高度？
    answer: 水位升到堰顶后，多出的内江水可以尽早越过低堰回到外江，减轻宝瓶口前的压力。
    page_refs:
      - p07
      - p08
      - p09
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 连宁用两只陶碗能说明泥沙的哪些情况，又不能说明什么？
    answer: 陶碗说明两处都有细沙，而她还看见部分浑水和小石越过低堰；这种粗略观察不能证明内江泥沙已经全部排走。
    page_refs:
      - p10
  - id: q05
    type: synthesis
    speaker: narrator
    prompt: 鱼嘴、飞沙堰和宝瓶口怎样共同改变进入平原的水？
    answer: 鱼嘴先分开江水，飞沙堰再放走多出的水和部分泥沙，宝瓶口最后限制入口水量，前一处会改变后一处面对的条件。
    page_refs:
      - p04
      - p09
      - p10
      - p11
      - p12
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 乔叔想加高飞沙堰，为什么这个想法有道理，却可能给整个系统带来危险？
    answer: 更高的堰也许不易受损，却会推迟溢流，使更多内江水先挤到宝瓶口前。
    page_refs:
      - p13
      - p14
  - id: q07
    type: source-analysis
    speaker: narrator
    prompt: 连宁的故事中，哪些内容有历史证据支持，哪些内容明确属于虚构？
    answer: 早期史料支持李冰与治水活动的关系，却不能证明三处工程当时已有今天的形制和位置；把它们共同归于李冰，是采用现代遗产叙述。连宁及家人、对白、测量过程和施工顺序都是虚构。
    page_refs:
      - p18
      - p20
  - id: q08
    type: research-response
    speaker: narrator
    prompt: 要判断一个李冰传说能否当作亲历记录，读者还应追问哪两类问题？
    answer: 应追问这个说法何时出现、由什么材料保存，还要寻找能支持具体细节的实物或文字证据。
    page_refs:
      - p19
  - id: q09
    type: main-idea
    speaker: narrator
    prompt: 连宁对“坚固的治水工程”的理解发生了什么变化？
    answer: 她从只相信拦河高墙，转而理解让水通过的配合系统，并认识到观察和修补也是工程的一部分。
    page_refs:
      - p01
      - p02
      - p12
      - p14
      - p17
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 岷江给连宁留下过两种记忆。夏日山洪下来，低处的田边尽是黄水，旧水沟很快堆满石子；到了少雨的时节，高处的土又硬得裂开。十三岁的连宁跟父亲阿保学编竹笼，手上削着竹片，眼睛却总追着水走。她觉得办法并不难：在江上筑一道高墙，先拦住洪水，等田里缺水时再开口放水。阿保没有笑她，只叫她先看看，江水究竟从哪里来，又要往哪里去。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 李冰召集治水的人时，老水工乔叔在岸边的小水槽上横拉长绳：“墙就该筑在这里，越高越能挡水。”李冰收起那根绳，说要修的不是堵死大江的墙，而是顺着水势导水的
            - vocabulary:
                id: weir
                text: 堰
            - text: 。江中仍会留出通路。乔叔听后直摇头，连宁也觉得少了一半。李冰把一根竹竿交给她。她要每天量水的深浅、记下流向，再看这个办法是否可行。他只说：“先把水路记下来。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 山口下方正好有一道弯。工匠们站在岸上系好护绳，把许多小木片放到上游水面。木片有的沿深水弯向平原，有的顺着宽河床继续向下；水位稍一变化，两边的数目也跟着变。连宁用石子记下每次结果。这种自然形成的
            - vocabulary:
                id: diversion
                text: 分流
            - text: 并不是把江水平均切开，也不会永远保持同一个样子。李冰最后选中江心长滩的上端，准备从那里伸出一道尖长的分水堤，让原有的两条水路变得稳定一些。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 阿保和同伴编出的竹笼比人还长。大家把河滩上的圆石装进去，封紧笼口，再把它们一层层放到江心。分水堤的尖头迎向上游，远看像鱼嘴，因此后人称它为“鱼嘴”。水撞上尖头，便从两侧分开。连宁抱着计数用的石子来回跑，发现两边的水量并不固定。分水堤只改变河床形状，让水更容易走上两条路：外江顺原河道下行，内江转向平原。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 枯水时，外江露出一大片浅色石滩，内江却因为河床窄而深，仍有水流向东。连宁沿岸走到玉垒山前，看见工匠从山体边开出一道窄口。后来，人们称它为“宝瓶口”。它连着平原水道，宽度固定，能够限制进入的水量。连宁把竹竿插进浅处，水面虽然不高，流速却很稳。乔叔没有反驳，只提醒她：“别急着下结论。等山里的大水下来，再看鱼嘴还能不能守住位置。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 山中连日下雨，夏水终于涨了。连宁站在系着护绳的高岸上，只见主流顺着较直、较宽的外江猛冲下去。外江水面比内江更宽，水声也更响。内江同样在涨，却没有吞下全部来水。她想起乔叔横在小水槽上的长绳：那条线代表一面堵住整条江的高墙，此刻就要正面承受这股力量。鱼嘴只把尖头伸进水中，两边都给水留下通路。连宁第一次觉得，“没有拦住”也可能是设计的一部分。可内江水位还在上升，宝瓶口前很快挤满急流。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 李冰在宝瓶口之前选了一处低地，那里位于内江和外江之间。他用竹竿划出一条不高的线：“内江水涨过这条线，多出的水就能越过去，回到外江。”连宁在岸边用湿沙做了两个小坝。高坝把水越积越深，低坝却让水面到达一定高度后自行漫过。乔叔用手一按，低坝立刻塌了。他问，真正的工程坏了怎么办。李冰没有说它永远不坏，只说：“修在便于查看和更换竹笼的位置。”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 低堰筑好以后，它靠着高高的河岸，并不起眼。竹笼兜住卵石，缝隙仍让水流过，堰顶只略高于眼前的水面。乔叔望着堰顶，还是不放心：“忙了这么久把水引进来，现在又专门给它留出口？”阿保低头扎紧竹绳。水再涨，就会越过这道低线回到外江。乔叔没有再争，只拉紧最后一根护绳，等下一场大水检验。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 第二次涨水时，众人都退到高台上。内江水涨到低堰顶面，漫过堰顶，沿侧面流回外江。宝瓶口前的水位还在升，但已有一部分水提前离开。连宁记下水刚越过堰顶时，宝瓶口前的水有多深。这种观察不能算出每股水有多少，却足以说明低堰先放走了多出的水。乔叔盯着备用竹笼看了许久，终于把它搬回岸上。后来，这道低堰被称为“飞沙堰”。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 洪水带来的不只是水，还有山上冲下的黄泥、沙粒和石块。这些随水移动、又可能沉在河底的材料叫
            - vocabulary:
                id: sediment
                text: 泥沙
            - text: 。如果它们年年堆在同一处，水道就会越来越浅。连宁分别在内江岸边和低堰下取水，再把两只陶碗端到安全的高处静置。两碗都有细沙，所以她没有说内江已经变清。她亲眼看到的只是：一部分浑水和小石越过低堰，回到外江。宝瓶口附近仍会有沉积，若从此无人清理，再巧的水路也可能变窄。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 连宁原以为宝瓶口只是一条新开的水道，直到大水来到，她才看懂那道窄口的另一层作用。岩壁不会随着内江水位一起变宽，因此能限制同一时刻进入平原的水量。暂时进不去的水留在外面，还可以从飞沙堰泄回外江。到了枯水期，这个入口又能继续把内江水送向东边。宝瓶口不负责分江，鱼嘴不负责最后限流，飞沙堰也不负责把水送到田里。三个工程前后相接，前一个改变了后一个面对的水量和泥沙。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 连宁和乔叔跟着李冰登上高坡，从头到尾望了一遍。连宁用竹竿依次点着三处。分水堤先把江水分开，低堰再让多出的水和一部分沙石回到外江，岩石窄口最后限制入口。乔叔看了看三处，问：“这样就算完工了？”连宁望见鱼嘴旁多出一条浅色石带，改口说：“只能说这一季能用。明年水路变了，我们还要再量。”李冰随即派人去量那条新石带。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 没等明年，江水先给了回答。一次急流冲松鱼嘴边的几个竹笼，内江口还堆起新的卵石滩。分水堤没有全坏，边缘却塌下去一截。工匠架起后来称为“杩槎”的木架，挡开一股水，让修补处变浅，再系着绳下去。阿保换掉断裂的竹条，乔叔搬开松石，连宁拿旧记录核对河床深浅。修好以后，李冰仍把这处松动的河段列入下次查看。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 修到飞沙堰时，乔叔又抱来一只竹笼，想垒在原来的顶上。“加高一层，下次就不容易冲坏。”连宁没有马上反对。她先把竹竿对准岸边的大水痕，再移到堰顶量高度。若再加高，内江水要涨得更多才会漫出去，宝瓶口前会先承受更大的压力。“再高一层，水会先挤到宝瓶口前。”她说。李冰量过两处高度，叫大家仍按旧低线修复。乔叔放下竹笼，跟着众人去补原来的低堰。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 又到少雨的季节，外江浅得露出宽阔石滩，较深的内江仍有水转向宝瓶口。水量比夏日小得多，却能沿着平原的坡势流进几条水道。连宁和阿保跟着一股水走，看农人依次打开田边的土口，再把它合上，让下一处接水。这里没有高坝蓄成的大湖，也没有人站在江心开关大门。鱼嘴的位置、两边河床的深浅和宝瓶口的宽度一起起作用。连宁也在检验自己的猜想：这套工程放走夏日大水以后，枯水时还能不能给水道送水。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 水并没有一夜之间染绿整个平原。有些支渠挖到半路，有些低田先得了太多水，高处的人还在等。工匠继续开沟、清沙，村里也要商量各处用水的次序。连宁把沿途听到的问题带回渠首，李冰让人拿这些情况对照当天的来水。鱼嘴、飞沙堰和宝瓶口能把一部分岷江水安全送进平原，却不能替每个村子决定水路，更不会自行修补。接下来的一个月里，一队人还在延长支渠，两个村子也重新排过用水次序。
    - id: p17
      illustration: p17
      paragraphs:
        - text: 许多年后，连宁在枯水岁修时又回到鱼嘴。阿保的竹刀已经挂在她腰间，她把编好的竹条递给一群年轻学徒。众人清走新近淤积的泥沙和卵石，换掉破旧竹笼，又按原来的低线修好飞沙堰。两鬓发白的乔叔检查完堰顶，没有再要求加高。他望着变了位置的浅滩，说：“江水又把工程改了。”连宁回答：“那就从变化的地方量起。”日落前，新竹笼补好了缺口，水已经从修过的低线流过。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 已知
            - vocabulary:
                id: historical-record
                text: 史料
            - text: 中都找不到连宁。她的家人、经历和对白都是虚构的。早期文字只说李冰凿开离堆、在成都一带开通水道，未写鱼嘴、飞沙堰、施工顺序或李冰原话。故事把三处工程的现代形制和位置放进李冰时代，采用的是现代遗产叙述，并非早期记载。《华阳国志》约在《史记》之后四百年成书，提到李冰“壅江作堋”。北宋嘉祐五年（1060）纂成的《新唐书·地理志》记载龙朔年间（661—663）的“侍郎堰”工程。鱼嘴屡次移位，现址由1936年大修确定。建宁元年（168）的李冰石像说明东汉水官仍在纪念他。
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: 关于李冰，后世还流传着许多
            - vocabulary:
                id: legend
                text: 传说
            - text: 。东汉《风俗通义》保存了李冰与江神相斗的故事，更晚的传说又给他添了一位帮助降龙的儿子二郎。《华阳国志》确实写过积薪烧石，地点却在另一处：僰道。它没有写在宝瓶口用火和冷水破石，其他早期材料也没有。判断一个细节时，读者还要追问：这个说法何时出现，由哪类材料保存，又有哪些实物或文字能够支持它。
    - id: p20
      illustration: p20
      paragraphs:
        - text: 今天的都江堰仍以无坝方式引岷江水，三处工程也仍在配合运行。不过，它们历经修整、移位和改建。把现代形制都归到李冰时代，采用的是现代遗产叙述，不是早期史料原话。北宋编成的《新唐书》晚于李冰许多世纪。故事中的施工顺序、连宁的测量和李冰的对白也属虚构。该书对唐代“侍郎堰”的记载，以及鱼嘴现址到1936年大修才确定的事实，都提醒读者：眼前景象并非未变的战国图纸。从高处望去，江水仍绕过鱼嘴分成两路，越过低堰，再从宝瓶口流向平原。
