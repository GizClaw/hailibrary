schema_version: 1
id: the-weir-that-does-not-block
type: [reading, illustrated-novella]
style: woodblock-print
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [history, culture, science]
  themes: [cooperation, problem-solving, responsibility, tradition]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close historical narrator who follows Lian, then steps forward in time to distinguish physical evidence, written records, and later legends.
    voice_identity: observant, restrained, and exact about uncertainty
  - id: lian
    kind: character
    description: A fictional thirteen-year-old basket maker's daughter who watches the river closely and changes her idea of what makes a strong water-control system.
    visual_identity: A thirteen-year-old East Asian girl with a round face and straight black hair in one low loop tied with a rust-red cord; indigo cross-collar wrap jacket, mustard trousers, straw sandals, small forest-green shoulder pouch, and a smooth bamboo measuring staff.
    voice_identity: quick, practical, and willing to revise her judgment
  - id: bao
    kind: character
    description: Lian's fictional father, an experienced basket maker responsible for woven bamboo stone cages.
    visual_identity: A lean middle-aged East Asian man with weathered cheeks, a short black mustache, forest-green cross-collar robe, indigo headcloth, rust-red belt, straw sandals, and a bamboo splitting knife in a plain sheath.
    voice_identity: warm, patient, and concrete
  - id: qiao
    kind: character
    description: A fictional senior river worker who fears that a low overflow structure will fail and tests his judgment against changing water.
    visual_identity: A broad middle-aged East Asian man with a square face, hair in a compact topknot, mustard work tunic, dark forest-green trousers, indigo leg wraps, straw sandals, and a coil of plain hemp rope.
    voice_identity: blunt, experienced, and able to concede
  - id: li_bing
    kind: historical-figure
    description: The Qin governor of Shu associated by early records with cutting through Li Dui and opening waterways; his exact words and actions in the story are fictionalized.
    visual_identity: A middle-aged East Asian man with an angular face, neatly bound black hair beneath a simple tall dark-cloth cap, dark indigo cross-collar robe, rust-red sash, forest-green outer mantle, cloth shoes, and a long unmarked bamboo survey staff.
    voice_identity: calm, concise, and attentive to field observations
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how the Fish Mouth divider, Flying Sand Weir, and Bottle-Neck Channel work together rather than as separate inventions.
    - Compare what a fictional scene, a brief historical record, a physical structure, and a later legend can each support.
    - Use evidence from low water, high water, sediment movement, and repair to evaluate why a low weir can be useful.
  concepts:
    - damless water diversion
    - interacting river-control structures
    - maintenance of living heritage
    - historical evidence and legend
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
