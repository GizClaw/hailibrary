        - id: p05-b01
          speaker: narrator
          text: 角度均分，并不等于时间完全均分。地球绕太阳的轨道不是正圆，运行速度也会变化。因此，相邻节气大约相隔十五天，实际间隔会前后差一些。林悦这才明白，日历上的日期只是方便人们找到那个计算时刻，并不是把一年装进二十四个长度完全相同的盒子。节气在角度上整齐，在日数上却不要求处处一样。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 在北半球，四个位置最容易让人看出太阳与季节的联系。夏至前后，白昼最长；冬至前后，白昼最短；春分和秋分前后，昼夜接近等长。古人很早便注意到这些重要节点。日照变化会参与形成大范围的季节节律，但只凭太阳位置，还不能说清一座校园当天的气温、雨水、风向和土壤湿度。
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          content:
            - text: 其余名称更贴近地面。有的说冷暖，有的提到雨、雪、露，还有的连着作物和农事。植物发芽开花、昆虫活动、候鸟迁飞等随季节出现的生命现象，合称
            - vocabulary: {id: phenology, text: 物候}
            - text: 。节气把天文位置、天气经验、物候变化和农事活动编进同一个顺序，既便于记忆，也便于安排事情。不过，这些名称来源不同，并不是二十四条形式相同的天气预报。
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          content:
            - text: 多份权威资料把二十四节气的起源指向黄河流域，尤其是中下游地区。当地先民要在不断变化的一年中安排生产生活，便长期观察日照、冷暖、雨水、作物与其他生物。权威
            - vocabulary: {id: historical-record, text: 史料}
            - text: 指出，完整一套二十四节气名称最早见于汉初《淮南子》。这套时间知识经过漫长的观察、使用和调整才逐步形成。
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: 爷爷找出一本旧农事笔记。纸页没有给全国写下统一的播种日，只记着自家在哪一年整地、看麦、用水，又怎样应对降温或降雨。节气把每条记录放进一年的大致位置，旁边的文字才补上当地情况。爷爷解释。
        - id: p09-b02
          speaker: grandfather_lin
          text: 名字提醒我这段时间要留心什么，今天能不能下地，还得看眼前。
        - id: p09-b03
          speaker: narrator
          text: 这本笔记能说明爷爷自己的经历，却不能替所有农田作证。
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          text: 这种限制并没有让旧框架失去作用。稳定的年周期帮助人们比较不同年份，记住农事，也把观察传给下一代。天文节点可以与一个地方的作物和气候经验相连。后来，二十四节气逐渐在全国使用，人们带走的是共同的时间顺序，并不是把黄河流域的天气一起搬走。不同地区把各自的田地、食物、仪式和季节现象接到了同一套节气上。
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: 下一次活动中，陈老师展示了中国不同地区的气象记录。同一个太阳位置、同一个节气时刻，各地可能呈现很不一样的天气：北方一些地方已经很冷，南方较远的地区仍然温暖。
        - id: p11-b02
          speaker: yue
          text: 也就是说，节气同时到，天气却不必一样？
        - id: p11-b03
          speaker: narrator
          text: 陈老师点头。
        - id: p11-b04
          speaker: chen_rui
          text: 对。相同和不同的地方都要记。
        - id: p11-b05
          speaker: narrator
          text: 纬度、海拔、离海远近和当时的天气形势都会产生影响。林悦把草稿里的“节气会预报什么”改成了“我们还要查什么”。
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: “霜降”正好能检验这个问题。这个名称反映了节气形成地区入秋转冷的经验，却不保证各地在霜降当天都会结霜。气象资料表明，中国各地初霜时间相差很大。东北一些地区可能早早见霜；遥远的南方有些地方很晚才见霜，甚至常年无霜。节气随日历到达每个地区，霜却要由当地的空气、地面和天气条件共同决定。
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: 把许多年放在一起看，气候变化还会让地面上的季节现象换个时间出现。花木可能比记忆中开得更早或更晚，一段冷暖天气也未必总在同一节气到来。中国气象部门已经记录并讨论过变暖背景下的这类变化。太阳到达规定位置的时刻并未因此改变；变的是那一刻，地面上正在发生什么。传统农谚保存着过去的地区经验，却不能直接拿来预报下周的天气。
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: 如今，决定哪天播种，还要考虑温室、灌溉、新品种、土壤测量和天气预报。这些办法不会取代节气提供的季节线索，却能补上眼前、本地的情况。林悦要判断校园菜园是否适合下种，便先看节气走到哪儿，再查本地预报，摸摸土，看看苗。接下来，她得先弄清每种资料究竟能回答什么问题。
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: 节气也不只存在于农田。不同社区把某些节气与聚会、饮食、歌谣、故事和仪式连在一起，各地做法并不完全相同。联合国教科文组织的介绍列举了壮族霜降节、九华立春祭等例子。这些例子说明，不同社区会让共同的时间框架长出自己的生活形式。它们却不能证明每个家庭、每个民族或每个省份都遵循同一种习俗。
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          content:
            - text: 这里所说的
            - vocabulary: {id: intangible-cultural-heritage, text: 非物质文化遗产}
            - text: ，是由社区认同并代代传递的活态知识和实践。二十四节气作为遗产，不只是一张列着二十四个日期的表。它还包括人们怎样使用节气、赋予它什么意义，以及怎样把相关经验传下去。传承可以发生在课堂，也可以来自家庭、劳动、节庆、歌谣和地方观察。保护这份遗产，不要求各地采用相同的季节描述。
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: 二〇一六年，二十四节气列入联合国教科文组织人类非物质文化遗产代表作名录。名录中的项目全称是“二十四节气——中国人通过观察太阳周年运动而形成的时间知识体系及其实践”。这项确认针对中国的时间知识及相关实践。它没有把每个节气名称变成各地通用的天气预报。林悦把这个年份记进报告，又从它下面画出两条线。一条通向共同的天文框架，另一条通向持续解释和使用它的不同社区。
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: 立春过去六周，班里迎来了春分。林悦本来期待气温一路上升，记录中却先有暖和的几天，接着下过一场大雨，夜里又冷了。靠墙的花先开，空旷花坛里的同种花晚一些。
        - id: p18-b02
          speaker: yue
          text: 靠墙这边先开了，可我还不知道为什么。
        - id: p18-b03
          speaker: narrator
          text: 林悦把这句话写进记录。墙面、土壤、水分、品种和天气都可能有关。一个节气名称解释不了同学们看到的所有差别。
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: 把菜苗移到室外以前，全班比较了三类证据。春分说明太阳走到年周期的哪个位置；六周的记录说明这座菜园已经发生过什么。本地天气预报则提醒大家，接下来还有两个较冷的夜晚。林悦看完预报说。
        - id: p19-b02
          speaker: yue
          text: 先等过这两个冷夜，再看看菜苗。
        - id: p19-b03
          speaker: narrator
          text: 全班等冷天过去后另选了一天。这次决定只回答他们的菜苗、校园和当周天气的问题，并不能推出全国都该在同一天种植。
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: 日历完成后，林悦保留了二十四节气，却没有把每个名称旁边填满，而是特意留了空白。以后，她会在那里记下当地的气温、雨水和植物变化，也记下自己怎样根据新情况改主意。二十四个太阳位置仍为一年排出共同的次序，旁边的空白则留给节气名称答不了的问题。全班终于把菜苗搬到室外那天，林悦又看了一遍预报，用手指按了按土，随即翻到新的一页，记下这块地当天的情况。
