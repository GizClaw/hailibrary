schema_version: 2
language: zh-CN
writer: 明日镜
title: 二十四节气里的天空与土地
summary: >-
  十二岁的林悦想用二十四节气判断校园菜园何时能春种。天文位置、爷爷的农事笔记、
  各地气象资料和非遗记录让她发现：共同的年周期很有用，但落到一块土地上，仍要用
  当地观察和新证据修正决定。
chapters:
  - id: ch01
    title: 先把一年画成圆
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 名字从土地上来
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: 同一节气，不同天气
    page_refs: [p11, p12, p13, p14]
  - id: ch04
    title: 仍在生活里的传统
    page_refs: [p15, p16, p17]
  - id: ch05
    title: 把当地写进去
    page_refs: [p18, p19, p20]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 什么冲突让林悦开始追问“立春”的含义？
    answer: 日历已经显示立春，校园菜园的土和接雨水的桶却仍然结冻。
    page_refs: [p01]
  - id: q02
    type: short-answer
    speaker: narrator
    prompt: 节气的天文框架能确定什么，又不能预报什么？
    answer: 它能确定太阳周年视路径上的固定位置，却不能预报某个地方的天气和土壤状况。
    page_refs: [p03, p04, p05, p06]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 二分二至与“霜降”“谷雨”这类名称有什么不同？
    answer: 二分二至直接对应太阳位置和昼夜长短的变化，许多其他名称还包含地区性的天气、物候或农事经验。
    page_refs: [p06, p07]
  - id: q04
    type: source-analysis
    speaker: narrator
    prompt: 权威资料怎样说明二十四节气的起源和发展？
    answer: 资料把起源指向黄河流域，说明它在长期观察和农事实践中逐步形成，并指出完整名称最早见于汉初《淮南子》。
    page_refs: [p08]
  - id: q05
    type: evidence
    speaker: narrator
    prompt: 为什么到了“霜降”，各地不一定同时见霜？
    answer: 节气的天文时刻相同，初霜却由各地的空气、地面和天气条件决定，而这些条件差异很大。
    page_refs: [p11, p12]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 为什么传统农谚仍有价值，却不能当作精确的现代天气预报？
    answer: 农谚能保存过去的地区经验并提醒人们观察季节，但气候变化和当地条件限制了它对某一周天气的预测能力。
    page_refs: [p13, p14]
  - id: q07
    type: source-analysis
    speaker: narrator
    prompt: 二〇一六年的联合国教科文组织名录确认了什么？
    answer: 名录确认了中国人观察太阳周年运动形成并持续传承的时间知识和相关实践，而不是一套各地通用的天气预报。
    page_refs: [p15, p16, p17]
  - id: q08
    type: synthesis
    speaker: narrator
    prompt: 节气、菜园记录和本地天气预报怎样共同帮助全班作决定？
    answer: 节气指出年周期的位置，记录提供这座菜园已经发生的证据，预报提示眼前的降温，三者合起来支持一个有限的当地决定。
    page_refs: [p18, p19, p20]
  - id: q09
    type: research-response
    speaker: narrator
    prompt: 如果要研究一个节气与你所在地的关系，应当收集哪些证据？
    answer: 应记录节气计算时刻、具体地点、当地天气和反复出现的动植物变化，并连续观察多个年份，再提出有限结论。
    page_refs: [p11, p13, p18, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            二月的郑州仍很冷。十二岁的林悦打开平板电脑上的日历，看见当天写着“立春”。教室窗外，菜园的土冻得发硬，接雨水的桶上还结着一层薄冰。班里正准备在园中种菜，林悦原以为节气名称会告诉她何时可以开始春种。眼前的寒意却逼出一个问题：既然天气还像冬天，“春”到底从哪里开始？
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            放学后，林悦把菜园里的疑惑讲给爷爷听。林爷爷年轻时在华北平原种过地，听完没有否定节气，也没催她照着日历下种。爷爷说：“立春只是说一年走到这儿了，可没说今天的土准会暖。”林悦于是决定做一次观察：选几个节气，连续记下校园菜园的变化。她想弄明白，哪些线索要抬头看天，哪些答案得低头查土，再对照当地天气。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 在市科技馆，陈老师先带林悦从天空找答案。从地球上看，太阳一年中仿佛在遥远星空前移动，这条周年视运动的路径叫
            - vocabulary: {id: ecliptic, text: 黄道}
            - text: 。实际上是地球绕着太阳运行，但站在地球上的观测者仍能用太阳位置的变化标记一年。陈老师转动木球后说：“这个模型能说明位置，不能告诉你明天会不会下雨。”黄道只说明太阳在一整圈视路径上走到了哪里，并不是天气图。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 陈老师请林悦想象一个没有数字的圆环。
            - vocabulary: {id: coordinate, text: 坐标}
            - text: 用来说明圆环上的位置。现代计算把二十四节气分别放在一整圈的二十四个固定位置上。一整圈共三百六十度，所以相邻位置相差十五度。太阳到达规定的黄经位置，那个节气就在这一刻开始。它不必等某朵花开放，也不必等一场雨落下，更不会等农人走进田里才到来。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            角度均分，并不等于时间完全均分。地球绕太阳的轨道不是正圆，运行速度也会变化。因此，相邻节气大约相隔十五天，实际间隔会前后差一些。林悦这才明白，日历上的日期只是方便人们找到那个计算时刻，并不是把一年装进二十四个长度完全相同的盒子。节气在角度上整齐，在日数上却不要求处处一样。
    - id: p06
      illustration: p06
      paragraphs:
        - text: >-
            在北半球，四个位置最容易让人看出太阳与季节的联系。夏至前后，白昼最长；冬至前后，白昼最短；春分和秋分前后，昼夜接近等长。古人很早便注意到这些重要节点。日照变化会参与形成大范围的季节节律，但只凭太阳位置，还不能说清一座校园当天的气温、雨水、风向和土壤湿度。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 其余名称更贴近地面。有的说冷暖，有的提到雨、雪、露，还有的连着作物和农事。植物发芽开花、昆虫活动、候鸟迁飞等随季节出现的生命现象，合称
            - vocabulary: {id: phenology, text: 物候}
            - text: 。节气把天文位置、天气经验、物候变化和农事活动编进同一个顺序，既便于记忆，也便于安排事情。不过，这些名称来源不同，并不是二十四条形式相同的天气预报。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 多份权威资料把二十四节气的起源指向黄河流域，尤其是中下游地区。当地先民要在不断变化的一年中安排生产生活，便长期观察日照、冷暖、雨水、作物与其他生物。权威
            - vocabulary: {id: historical-record, text: 史料}
            - text: 指出，完整一套二十四节气名称最早见于汉初《淮南子》。这套时间知识经过漫长的观察、使用和调整才逐步形成。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            爷爷找出一本旧农事笔记。纸页没有给全国写下统一的播种日，只记着自家在哪一年整地、看麦、用水，又怎样应对降温或降雨。节气把每条记录放进一年的大致位置，旁边的文字才补上当地情况。爷爷解释：“名字提醒我这段时间要留心什么，今天能不能下地，还得看眼前。”这本笔记能说明爷爷自己的经历，却不能替所有农田作证。
    - id: p10
      illustration: p10
      paragraphs:
        - text: >-
            这种限制并没有让旧框架失去作用。稳定的年周期帮助人们比较不同年份，记住农事，也把观察传给下一代。天文节点可以与一个地方的作物和气候经验相连。后来，二十四节气逐渐在全国使用，人们带走的是共同的时间顺序，并不是把黄河流域的天气一起搬走。不同地区把各自的田地、食物、仪式和季节现象接到了同一套节气上。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            下一次活动中，陈老师展示了中国不同地区的气象记录。同一个太阳位置、同一个节气时刻，各地可能呈现很不一样的天气：北方一些地方已经很冷，南方较远的地区仍然温暖。“也就是说，节气同时到，天气却不必一样？”林悦问。陈老师点头：“对。相同和不同的地方都要记。”纬度、海拔、离海远近和当时的天气形势都会产生影响。林悦把草稿里的“节气会预报什么”改成了“我们还要查什么”。
    - id: p12
      illustration: p12
      paragraphs:
        - text: >-
            “霜降”正好能检验这个问题。这个名称反映了节气形成地区入秋转冷的经验，却不保证各地在霜降当天都会结霜。气象资料表明，中国各地初霜时间相差很大。东北一些地区可能早早见霜；遥远的南方有些地方很晚才见霜，甚至常年无霜。节气随日历到达每个地区，霜却要由当地的空气、地面和天气条件共同决定。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            把许多年放在一起看，气候变化还会让地面上的季节现象换个时间出现。花木可能比记忆中开得更早或更晚，一段冷暖天气也未必总在同一节气到来。中国气象部门已经记录并讨论过变暖背景下的这类变化。太阳到达规定位置的时刻并未因此改变；变的是那一刻，地面上正在发生什么。传统农谚保存着过去的地区经验，却不能直接拿来预报下周的天气。
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            如今，决定哪天播种，还要考虑温室、灌溉、新品种、土壤测量和天气预报。这些办法不会取代节气提供的季节线索，却能补上眼前、本地的情况。林悦要判断校园菜园是否适合下种，便先看节气走到哪儿，再查本地预报，摸摸土，看看苗。接下来，她得先弄清每种资料究竟能回答什么问题。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            节气也不只存在于农田。不同社区把某些节气与聚会、饮食、歌谣、故事和仪式连在一起，各地做法并不完全相同。联合国教科文组织的介绍列举了壮族霜降节、九华立春祭等例子。这些例子说明，不同社区会让共同的时间框架长出自己的生活形式。它们却不能证明每个家庭、每个民族或每个省份都遵循同一种习俗。
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 这里所说的
            - vocabulary: {id: intangible-cultural-heritage, text: 非物质文化遗产}
            - text: ，是由社区认同并代代传递的活态知识和实践。二十四节气作为遗产，不只是一张列着二十四个日期的表。它还包括人们怎样使用节气、赋予它什么意义，以及怎样把相关经验传下去。传承可以发生在课堂，也可以来自家庭、劳动、节庆、歌谣和地方观察。保护这份遗产，不要求各地采用相同的季节描述。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            二〇一六年，二十四节气列入联合国教科文组织人类非物质文化遗产代表作名录。名录中的项目全称是“二十四节气——中国人通过观察太阳周年运动而形成的时间知识体系及其实践”。这项确认针对中国的时间知识及相关实践。它没有把每个节气名称变成各地通用的天气预报。林悦把这个年份记进报告，又从它下面画出两条线。一条通向共同的天文框架，另一条通向持续解释和使用它的不同社区。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            立春过去六周，班里迎来了春分。林悦本来期待气温一路上升，记录中却先有暖和的几天，接着下过一场大雨，夜里又冷了。靠墙的花先开，空旷花坛里的同种花晚一些。“靠墙这边先开了，可我还不知道为什么。”林悦把这句话写进记录。墙面、土壤、水分、品种和天气都可能有关。一个节气名称解释不了同学们看到的所有差别。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            把菜苗移到室外以前，全班比较了三类证据。春分说明太阳走到年周期的哪个位置；六周的记录说明这座菜园已经发生过什么。本地天气预报则提醒大家，接下来还有两个较冷的夜晚。林悦看完预报说：“先等过这两个冷夜，再看看菜苗。”全班等冷天过去后另选了一天。这次决定只回答他们的菜苗、校园和当周天气的问题，并不能推出全国都该在同一天种植。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            日历完成后，林悦保留了二十四节气，却没有把每个名称旁边填满，而是特意留了空白。以后，她会在那里记下当地的气温、雨水和植物变化，也记下自己怎样根据新情况改主意。二十四个太阳位置仍为一年排出共同的次序，旁边的空白则留给节气名称答不了的问题。全班终于把菜苗搬到室外那天，林悦又看了一遍预报，用手指按了按土，随即翻到新的一页，记下这块地当天的情况。
