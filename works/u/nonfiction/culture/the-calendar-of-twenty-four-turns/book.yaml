schema_version: 1
id: the-calendar-of-twenty-four-turns
type: [reading, illustrated-nonfiction]
style: watercolor-gouache
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [culture, science, history, nature]
  themes: [curiosity, discovery, tradition, adaptation]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A source-aware guide who follows Yue's investigation while distinguishing astronomy, regional experience, and cultural interpretation.
    voice_identity: clear, curious, and careful about the limits of evidence
  - id: yue
    kind: character
    description: A fictional twelve-year-old student in Zhengzhou who tests whether solar-term names can guide her class garden.
    visual_identity: A twelve-year-old East Asian girl with an oval face, straight chin-length black hair held by two small brass clips on the left, mustard-yellow hooded jacket, teal trousers, rust-red sneakers, an indigo field notebook, and a pale-green tablet.
    voice_identity: alert, practical, and willing to replace a broad claim with a narrower question
  - id: grandfather_lin
    kind: character
    description: Yue's fictional grandfather, a retired farmer from the North China Plain whose notebooks connect seasonal markers with local field observations.
    visual_identity: An elderly East Asian man with a lean lined face, short silver hair, warm brown quilted jacket, indigo trousers, dark cloth shoes, a woven straw hat outdoors, and a worn blue field notebook with no visible writing.
    voice_identity: patient, concrete, and unwilling to turn experience into a universal rule
  - id: chen_rui
    kind: character
    description: A fictional science-museum educator who helps Yue separate the solar terms' astronomical coordinates from local weather and phenology.
    visual_identity: An East Asian woman in her early thirties with a long face, short wavy black hair, round dark glasses, teal cardigan over a cream shirt, rust-red trousers, dark shoes, and a plain brass-and-wood Sun-Earth teaching model without markings.
    voice_identity: energetic, precise, and comfortable naming what a model cannot show
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how twenty-four fixed positions along the Sun's apparent annual path define the solar terms.
    - Connect the system's Yellow River farming origins with its later regional and cultural adaptations.
    - Evaluate why a solar term can be a useful seasonal checkpoint without serving as a universal local weather forecast.
    - Distinguish what astronomical calculation, field records, forecasts, and heritage sources can each support.
  concepts:
    - solar longitude and the ecliptic
    - seasonal observation and phenology
    - Yellow River agricultural origins
    - regional climate limits and local adaptation
    - living intangible cultural heritage
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
