schema_version: 1
required: true
historical_scope: >-
  The astronomy, geographical origin, agricultural use, regional limitations,
  and 2016 UNESCO inscription are researched nonfiction. Lin Yue, Grandfather
  Lin, Chen Rui, their dialogue, the school garden, field notebook, museum
  sessions, six-week observations, forecast, and planting decision are original
  fictional framing. The work does not claim that one inventor created the full
  system at one moment or that a solar-term name predicts local weather.
sources:
  - url: https://ich.unesco.org/en/RL/the-twenty-four-solar-terms-knowledge-in-china-of-time-and-practices-developed-through-observation-of-the-sun-s-annual-motion-00647?RL=00647
    title: The Twenty-Four Solar Terms, knowledge in China of time and practices developed through observation of the sun's annual motion
    publisher: UNESCO Intangible Cultural Heritage
    supports: >-
      The element originated in the Yellow River reaches, developed through
      observation of seasons, astronomy, and natural phenomena, spread across
      China, guided production and daily life, remains important to farmers,
      is transmitted formally and informally, includes varied community
      practices, and was inscribed on the Representative List in 2016.
  - url: https://www.hko.gov.hk/en/gts/time/24solarterms.htm
    title: The 24 Solar Terms
    publisher: Hong Kong Observatory
    supports: >-
      From Earth the Sun appears to follow the ecliptic; the system divides
      360 degrees of longitude into twenty-four segments fifteen degrees apart;
      equinoxes and solstices relate to Northern Hemisphere day length; and
      many names reflect weather and agricultural activity in ancient central
      China rather than universal local conditions.
  - url: https://www.hko.gov.hk/en/gts/astron2022/files/HKO_almanac_2022.pdf
    title: Hong Kong Observatory Almanac 2022 - Links Between the 24 Solar Terms and Astronomy
    publisher: Hong Kong Observatory
    supports: >-
      The modern fixed-longitude positions remain fifteen degrees apart, while
      intervals between terms vary from about 14.71 to 15.74 days because Earth
      moves at changing speed along an elliptical orbit; the first complete set
      of names appeared in the early Han text Huainanzi.
  - url: https://igsnrr.cas.cn/cbkx/kpyd/zybk/qhzy/202009/t20200910_5692918.html
    title: 什么是二十四节气？
    publisher: 中国科学院地理科学与资源研究所
    supports: >-
      The twenty-four names combine astronomy, climate, natural seasonal
      phenomena, and agricultural activity; the system originated in the
      middle and lower Yellow River region and reflects that regional climate.
  - url: https://www.pmo.cas.cn/xwdt2019/kpdt2019/202203/t20220314_6389637.html
    title: 历书基本术语简介
    publisher: 中国科学院紫金山天文台
    supports: >-
      Solar terms belong to the solar component of the Chinese lunisolar
      calendar and are calculated from the Sun's apparent longitude, with one
      term for every fifteen degrees of annual apparent motion.
  - url: https://www.cma.gov.cn/2011xwzx/2011xmtjj/202110/t20211029_4006706.html
    title: 二十四节气列入非遗名录 能唤回曾经的诗意生活吗
    publisher: 中国气象局
    supports: >-
      The solar terms arose from Yellow River regional experience; modern
      technology has reduced strict dependence on them for farming; and climate
      warming has shifted the timing of some climatic and phenological patterns
      relative to traditional solar-term expectations.
  - url: https://www.cma.gov.cn/ztbd/2022zt/20221020/2022102011/202210201102/20221025/202210/P020221025361855239136.pdf
    title: 霜降时节各地初霜差异
    publisher: 中国气象报, China Meteorological Administration
    supports: >-
      First-frost dates differ greatly across China: northeastern locations can
      see frost around the autumnal equinox, parts of southern China see it much
      later, and some far-southern areas can remain frost-free.
  - url: https://www.mct.gov.cn/whzx/bnsj/dwwhllj/201612/t20161214_773196.html
    title: 二十四节气正式列入联合国教科文组织人类非物质文化遗产代表作名录
    publisher: 中华人民共和国文化和旅游部
    supports: >-
      UNESCO's committee approved the inscription on 30 November 2016; the
      recognized element is a Chinese system of time knowledge and practice
      formed through observation of the Sun's annual motion, with Yellow River
      origins and later adoption by many communities and ethnic groups.
  - url: https://jgs.agri.gov.cn/twenty/zh/four_solar_terms.html
    title: 二十四节气
    publisher: 全国农业展览馆（中国农业博物馆）
    supports: >-
      Long observation of plant, animal, weather, and agricultural changes
      connected recurring phenomena with solar-term timing and helped shape
      transmitted farming and seasonal practices.
notes: >-
  The story treats each solar term as an astronomical instant and seasonal
  checkpoint, not as a guaranteed weather event or national planting command.
  It avoids unsupported claims about one inventor, one exact creation date, or
  uniform customs. Fictional garden observations are explicitly limited to one
  place and do not claim a proven cause for plant differences.
