schema_version: 1
style: watercolor-gouache
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  characters:
    yue: Twelve-year-old East Asian girl, oval face, straight chin-length black hair with two small brass clips on the left, mustard-yellow hooded jacket, teal trousers, rust-red sneakers, indigo field notebook, pale-green tablet.
    grandfather_lin: Elderly East Asian man, lean lined face, short silver hair, warm brown quilted jacket, indigo trousers, dark cloth shoes, woven straw hat outdoors, worn blue field notebook with blank pages.
    chen_rui: East Asian woman in her early thirties, long face, short wavy black hair, round dark glasses, teal cardigan, cream shirt, rust-red trousers, dark shoes, plain brass-and-wood Sun-Earth teaching model without markings.
  school_garden: A modest contemporary Zhengzhou school courtyard with six raised soil beds, low gray brick walls, one leafless apricot tree, a plain rain barrel, simple glass cold frames, and no readable signs.
  museum: A warm science-museum room with a large unmarked circular brass rail, plain wooden sphere models, a wide north-facing window, and no labels, digits, diagrams with symbols, or screens containing text.
  palette: Warm cream paper, mustard yellow, muted teal, rust red, soft blue-gray winter shadows, fresh green spring accents, and small brass highlights.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Yue stands between a circular brass Sun-path model and the school garden across four changing seasons, holding her indigo notebook; Grandfather Lin and Chen Rui stand farther back, with no calendar text or symbols.
  - id: p01
    file: artwork/p01.webp
    scene: On a cold late-winter morning, Yue looks from her pale-green tablet with a blank glowing screen to frozen raised garden beds and thin ice on a plain rain barrel outside the classroom window.
  - id: p02
    file: artwork/p02.webp
    scene: Yue and Grandfather Lin sit at a kitchen table beside a small potted seedling, an unmarked circular calendar wheel, Yue's indigo notebook, and Grandfather Lin's worn blue field notebook.
  - id: p03
    file: artwork/p03.webp
    scene: In the museum, Chen Rui guides Yue beside a brass-and-wood Sun-Earth model and a large unmarked circular rail suggesting the Sun's apparent yearly path.
  - id: p04
    file: artwork/p04.webp
    scene: Yue places one of twenty-four identical plain brass markers around an unnumbered circular rail while Chen Rui steadies the model; no numerals, letters, or labels appear.
  - id: p05
    file: artwork/p05.webp
    scene: Close view of a slightly elliptical wooden orbit model with Earth spheres at unequal spacings while Yue compares two plain sand timers with no numbers or markings.
  - id: p06
    file: artwork/p06.webp
    scene: Yue and Chen Rui observe four wordless seasonal panels around the same brass Sun model, with short summer-noon shadows, long winter shadows, and changing daylight suggested by the light.
  - id: p07
    file: artwork/p07.webp
    scene: A broad wordless seasonal tableau links budding branches, active insects, migrating birds, grain stalks, rain, dew, and snow around the circular brass path without presenting them as simultaneous events.
  - id: p08
    file: artwork/p08.webp
    scene: Historical-impression scene in the Yellow River plain shows several ancient farming families across seasons observing sunlight, fields, rain, crops, birds, and plants, with no single inventor centered.
  - id: p09
    file: artwork/p09.webp
    scene: Grandfather Lin opens his worn blue field notebook with blank pages beside simple farm objects and a bowl of wheat grains while Yue listens and adds an unmarked line to her own notebook.
  - id: p10
    file: artwork/p10.webp
    scene: A flowing visual transition carries the same unmarked circular seasonal wheel from a Yellow River farm toward several distant Chinese landscapes where communities adapt crops and activities.
  - id: p11
    file: artwork/p11.webp
    scene: Chen Rui and Yue compare three large wordless landscape photographs showing a snowy northern field, a mild central plain, and a warm far-southern garden at the same seasonal moment.
  - id: p12
    file: artwork/p12.webp
    scene: Split regional landscape shows early frost on a northeastern field, cool bare ground in central China, and lush frost-free vegetation in the far south, joined by one plain circular marker without text.
  - id: p13
    file: artwork/p13.webp
    scene: Yue compares Grandfather Lin's old seasonal memory of later blossoms with an early-blooming branch outside the present classroom, leaving multiple possible causes visually open.
  - id: p14
    file: artwork/p14.webp
    scene: At the school garden, Yue checks a blank weather screen, touches the soil, and inspects a seedling near a small glass cold frame, combining modern tools with direct observation.
  - id: p15
    file: artwork/p15.webp
    scene: A respectful wordless panorama shows distinct community practices connected to the seasonal cycle, including a Zhuang autumn gathering and a Jiuhua spring-plowing ritual, clearly separate rather than universalized.
  - id: p16
    file: artwork/p16.webp
    scene: Grandfather Lin passes seasonal knowledge to Yue beside the garden while a teacher, family, workers, musicians, and festival participants form a gentle chain of living transmission in the background.
  - id: p17
    file: artwork/p17.webp
    scene: Yue studies an abstract world-heritage display made of hands, a sun circle, crops, and community figures, with no UNESCO logo, emblem, letters, dates, or other text.
  - id: p18
    file: artwork/p18.webp
    scene: At the spring equinox six weeks later, Yue compares early flowers beside a warm brick wall with later buds in an exposed bed while rain puddles and lingering cold are both evident.
  - id: p19
    file: artwork/p19.webp
    scene: Yue and classmates hold seedlings indoors while comparing the brass seasonal model, their blank-page garden notebook, and a text-free local weather screen before deciding to wait.
  - id: p20
    file: artwork/p20.webp
    scene: On a milder morning, Yue presses one finger into garden soil beside newly carried seedlings, her open indigo notebook showing only blank colored swatches and no writing as classmates prepare the beds.
