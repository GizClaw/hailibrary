schema_version: 1
required: false
reason: A purely invented household sequence, not a factual explanation or instructional text. These sources document independent review of ordinary object use and visual safety rather than research needed to invent the story.
sources:
  - url: https://www.nhs.uk/baby/babys-development/play-and-learning/baby-and-toddler-play-ideas/
    authority: NHS
    claims:
      - Unbreakable household objects can be used in supervised water play; children must not be left alone with water.
  - url: https://www.healthychildren.org/English/safety-prevention/at-home/Pages/Bathroom-Safety.aspx
    authority: American Academy of Pediatrics
    claims:
      - Never leave a young child alone in the bath, even for a moment; p04 shows the mother supervising the child.
  - url: https://www.merriam-webster.com/dictionary/cup
    authority: Merriam-Webster
    claims:
      - A cup is an open drinking vessel; milk and water are plausible contents.
  - url: https://www.zdic.net/hans/杯子
    authority: Han Dian
    claims:
      - 杯子 is a small vessel for water and other drinks, matching the shared object.
  - url: https://www.nhs.uk/baby/weaning-and-feeding/babys-first-solid-foods/
    authority: NHS
    claims:
      - Young children can learn to sip from an open cup; the toddler’s open drinking cup is plausible.
  - url: https://caldwell.ces.ncsu.edu/news/messy-bouquets/
    authority: North Carolina Cooperative Extension
    claims:
      - A cup can serve as a flower container; p06 shows a flower placed in a cup, without claiming long-term plant care.
notes: Characters and events are fictional. Bathwater is not drunk. Drinking precedes bath play; after bath play the cup is empty, then holds a flower. No plant-growth, edibility, health-benefit, or lasting flower-care claim is made.
