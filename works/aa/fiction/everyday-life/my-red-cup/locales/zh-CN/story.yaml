schema_version: 2
language: zh-CN
writer: 溪铃
title: 我的红杯子
summary: 红杯子里有奶和水，后来有洗澡水，最后有一朵花。
chapters:
  - id: ch01
    title: 我的红杯子
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
questions:
  - id: q01
    type: picture
    speaker: mother
    prompt: 杯子是什么颜色的？
    answer: 红色。
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: mother
    prompt: 杯子里最后有什么？
    choices:
      - 一朵花
      - 奶
    answer: 一朵花
    page_refs:
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - vocabulary:
                id: cup
                text: 杯子
            - text: 是红的。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - vocabulary:
                id: cup
                text: 杯子
            - text: 里有奶。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - vocabulary:
                id: cup
                text: 杯子
            - text: 里有水。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 妈妈看着我舀水。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
