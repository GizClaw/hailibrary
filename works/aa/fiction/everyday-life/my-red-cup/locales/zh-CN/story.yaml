        timbre: 清亮柔软的童声
        pace: 舒缓，句间稍停
        pitch: 偏高，起伏轻柔
    mother:
      display_name: 妈妈
      tts:
        delivery: 平静温柔，给孩子安心感
        timbre: 圆润温暖的成人女声
        pace: 比孩子更慢、更稳
        pitch: 中低，收尾平缓
