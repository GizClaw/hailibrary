schema_version: 1
id: who-says-hello
type:
  - reading
  - picture-book
style: wax-crayon
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - animals
  themes:
    - discovery
    - friendship
  moods:
    - playful
    - warm
characters:
  - id: narrator
    kind: narrator
    description: A warm guide who names each speaker before the greeting sound.
    visual_identity: Not shown in the artwork.
    voice_identity: Clear, calm guide voice that leaves room for each animal sound.
  - id: child
    kind: character
    description: A four-year-old visitor who listens to the animals and answers them.
    visual_identity: Four-year-old child with warm brown skin, round cheeks, large dark-brown eyes, short dark curly hair, a sunflower-yellow shirt, teal overalls, and red rain boots.
    voice_identity: Bright, open child voice with a happy final greeting.
  - id: cow
    kind: character
    description: A gentle cow who greets the child first.
    visual_identity: Large cream cow with cinnamon-brown patches, small tan horns, and a pink muzzle.
    voice_identity: Low, rounded moo with a slow start.
  - id: pig
    kind: character
    description: A cheerful pig who greets the child by the barn.
    visual_identity: Small coral-pink pig with a darker round snout, curled tail, and one cream patch over the left eye.
    voice_identity: Bouncy, nasal oink with a quick finish.
  - id: duck
    kind: character
    description: A lively duck who greets the child beside the pond.
    visual_identity: Golden-yellow duck with an orange bill and feet, one green wing patch, and a round body.
    voice_identity: Bright, crisp quack with a short beat.
  - id: sheep
    kind: character
    description: A shy sheep who greets the child near the grass.
    visual_identity: Fluffy white sheep with a charcoal face and legs, coral inner ears, and a round woolly silhouette.
    voice_identity: Soft, airy baa with a gentle fall.
  - id: rooster
    kind: character
    description: A proud but friendly rooster who greets the child from a hay bale.
    visual_identity: Rust-red rooster with a bright red comb, golden neck, deep-blue tail feathers, and yellow legs.
    voice_identity: Clear, ringing crow with a lively rise and fall.
  - id: dog
    kind: character
    description: A friendly farm dog who greets the child at the barn door.
    visual_identity: Small caramel-brown dog with floppy dark-brown ears, cream chest, teal collar without a tag, and a wagging tail.
    voice_identity: Warm, playful woof with a firm middle tone.
  - id: cat
    kind: character
    description: A quiet barn cat who gives the last animal greeting.
    visual_identity: Small gray tabby cat with three dark forehead stripes, white paws and chest, green eyes, and a curled tail.
    voice_identity: Light, smooth meow with a soft upward curl.
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Match each named farm animal to its greeting sound.
    - Follow one repeated spoken frame and notice the child answer at the end.
  concepts:
    - cow
    - pig
    - duck
    - sheep
    - rooster
    - dog
    - cat
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
