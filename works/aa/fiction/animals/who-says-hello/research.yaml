schema_version: 1
required: true
reason: The farmyard greeting is fictional, but each locale uses conventional written words for animal sounds that require language evidence.
sources:
  - url: https://www.merriam-webster.com/dictionary/moo
    authority: Merriam-Webster
    claims:
      - Moo is the conventional English word for the sound made by a cow.
  - url: https://www.merriam-webster.com/dictionary/oink
    authority: Merriam-Webster
    claims:
      - Oink is the conventional English word for the natural noise of a pig or hog.
  - url: https://www.merriam-webster.com/dictionary/quack
    authority: Merriam-Webster
    claims:
      - Quack is the conventional English word for the characteristic cry of a duck.
  - url: https://www.merriam-webster.com/dictionary/baa
    authority: Merriam-Webster
    claims:
      - Baa is the conventional English word for the sound of a sheep.
  - url: https://www.merriam-webster.com/dictionary/cock-a-doodle-doo
    authority: Merriam-Webster
    claims:
      - Cock-a-doodle-doo is a conventional English rendering of a rooster's crow.
  - url: https://www.merriam-webster.com/dictionary/woof
    authority: Merriam-Webster
    claims:
      - Woof is a conventional English word for a sound made by a dog.
  - url: https://www.merriam-webster.com/dictionary/meow
    authority: Merriam-Webster
    claims:
      - Meow is a conventional English word for the cry of a cat.
  - url: https://www.zdic.net/hans/%E5%93%9E
