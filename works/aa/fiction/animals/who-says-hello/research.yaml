    claims:
      - “咩”是表示羊叫声的拟声词。
  - url: https://www.zdic.net/hans/%E5%96%94%E5%96%94
    authority: 汉典
    claims:
      - “喔喔”可形容鸡叫的声音。
  - url: https://www.zdic.net/hans/%E6%B1%AA%E6%B1%AA
    authority: 汉典
    claims:
      - “汪汪”可形容狗叫的声音。
