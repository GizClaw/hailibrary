    authority: 中国作家网转载《文艺报》儿童文学评论
    claims:
      - 评论引述中文儿童小说里一头猪发出“哼哼”声，证明该拟声写法在中文儿童叙事中可用于猪叫。
  - url: https://www.zdic.net/hans/%E5%98%8E
    authority: 汉典
    claims:
      - “嘎嘎”可形容鸭子的叫声。
  - url: https://www.zdic.net/hans/%E5%92%A9
