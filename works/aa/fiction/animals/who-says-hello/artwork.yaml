schema_version: 1
style: wax-crayon
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  - The same four-year-old child has warm brown skin, round cheeks, large dark-brown eyes, short dark curly hair, a sunflower-yellow shirt, teal overalls, and red rain boots in every image.
  - Animal identities stay fixed: cream-and-cinnamon cow with a pink muzzle; coral-pink pig with left-eye cream patch; golden duck with green wing patch; white sheep with charcoal face; rust-red, gold, and blue rooster; caramel dog with dark floppy ears and teal collar; gray tabby cat with white paws and green eyes.
  - The farm uses one red barn with cream trim, a pale-gold fence, green grass, a small blue pond, and a warm peach sky; no sign, writing, tag, or symbol appears anywhere.
  - Every scene uses chunky layered wax-crayon forms, visible warm-paper grain, broken wax edges, bold primary and secondary colors, and simple color-block lighting.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: The smiling child stands at the open barnyard gate while the cow, pig, duck, sheep, rooster, dog, and cat gather in a friendly semicircle facing the child; the red barn and pale-gold fence sit behind them.
  - id: p01
    file: artwork/p01.webp
    scene: The cream-and-cinnamon cow leans over the pale-gold fence toward the listening child, mouth open in a gentle greeting; the red barn remains behind them.
  - id: p02
    file: artwork/p02.webp
    scene: The coral-pink pig stands on clean straw beside the red barn and faces the child, mouth open in a cheerful greeting; the child's clothing and face match p01.
  - id: p03
    file: artwork/p03.webp
    scene: The golden-yellow duck stands at the edge of the small blue pond and faces the crouching child, bill open in a lively greeting.
  - id: p04
    file: artwork/p04.webp
    scene: The fluffy white sheep with charcoal face stands on green grass beside the child, mouth open in a soft greeting; the pale-gold fence crosses the background.
  - id: p05
    file: artwork/p05.webp
    scene: The rust-red rooster stands safely on a low hay bale and faces the child, beak open in a ringing greeting; the red barn door is behind them.
  - id: p06
    file: artwork/p06.webp
    scene: The caramel farm dog stands at the open barn door facing the child, tail wagging and mouth open in a playful greeting; the teal collar has no tag.
  - id: p07
    file: artwork/p07.webp
    scene: The gray tabby cat sits on the wide low fence rail at the child's eye level, mouth open in a small greeting; the child listens with both hands at their sides.
  - id: p08
    file: artwork/p08.webp
    scene: The smiling child stands in the barnyard and waves to all seven animals gathered in a semicircle, answering their greetings; every recurring character matches the earlier pages.
generation:
  workflow: Codex built-in image generation; one generation per asset; cwebp compression
  text_in_image_requested: false
