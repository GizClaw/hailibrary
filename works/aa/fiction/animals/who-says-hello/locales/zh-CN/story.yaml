audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着一点等待动物回应的好奇
        timbre: 清楚柔和的成人声音
        pace: 缓慢平稳，在每种叫声前自然停一下
        pitch: 中等，报出动物后微微上扬
    child:
      display_name: 孩子
      tts:
        delivery: 开心大方，真心回应新朋友
        timbre: 明亮清楚的幼童声音
        pace: 舒缓，一口说完
        pitch: 中高，结尾轻快上扬
    cow:
      display_name: 牛
      tts:
        delivery: 温和友好
        timbre: 低沉圆厚的声音
        pace: 很慢，元音拉长
        pitch: 低，缓缓落下
    pig:
      display_name: 猪
      tts:
        delivery: 欢快热情
        timbre: 轻巧、带鼻音的声音
        pace: 快，两声紧紧相连
        pitch: 中高，带一点跳动感
    duck:
      display_name: 鸭子
      tts:
        delivery: 活泼直接
        timbre: 明亮清脆、略尖的声音
        pace: 快而利落
        pitch: 高，每声短短落下
    sheep:
      display_name: 羊
      tts:
        delivery: 有点害羞，但很友好
        timbre: 轻柔、带气息的声音
        pace: 慢，两声都稍稍拉长
        pitch: 中高，轻轻落下
    rooster:
      display_name: 公鸡
      tts:
        delivery: 神气又亲切
        timbre: 清亮、有穿透力的声音
        pace: 从容，两声分明
        pitch: 高，先扬起再落下
    dog:
      display_name: 狗
      tts:
        delivery: 爱玩又热情
        timbre: 温暖结实、边缘柔和的声音
        pace: 中等，两声有力
        pitch: 中低，每声微微上扬
    cat:
      display_name: 猫
      tts:
        delivery: 安静好奇
        timbre: 轻软顺滑、靠近耳边的声音
        pace: 慢，尾音轻轻拉长
        pitch: 中高，尾音柔和上扬
