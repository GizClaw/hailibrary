questions:
  - id: q01
    type: picture
    speaker: child
    prompt: 谁在“哞哞”叫？
    answer: 牛。
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 谁说“你们好”？
    choices:
      - 孩子
      - 猫
    answer: 孩子
    page_refs:
      - p08
