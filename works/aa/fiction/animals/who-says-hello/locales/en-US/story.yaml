    type: picture
    speaker: child
    prompt: Who says, “Moo”?
    answer: Cow.
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: Who says, “Hello, friends”?
    choices:
      - The child
      - The cat
    answer: The child
    page_refs:
      - p08
