audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: Warm and inviting, naming each speaker with gentle anticipation
        timbre: Clear, smooth adult voice
        pace: Slow and steady, with a small pause before each quoted sound
        pitch: Middle, with a slight lift before each animal answers
    child:
      display_name: Child
      tts:
        delivery: Happy and open, answering new friends
        timbre: Bright, clear young child voice
        pace: Unhurried, with one clean beat
        pitch: High-middle, ending in a sunny rise
    cow:
      display_name: Cow
      tts:
        delivery: Gentle and welcoming
        timbre: Deep, rounded resonant voice
        pace: Very slow, with a long vowel
        pitch: Low and softly falling
    pig:
      display_name: Pig
      tts:
        delivery: Cheerful and eager
        timbre: Small, nasal, springy voice
        pace: Quick, with a clipped finish
        pitch: High-middle with a playful bounce
    duck:
      display_name: Duck
      tts:
        delivery: Lively and direct
        timbre: Bright, crisp, slightly reedy voice
        pace: Quick and neat
        pitch: High with a short downward snap
    sheep:
      display_name: Sheep
      tts:
        delivery: Shy but friendly
        timbre: Soft, airy voice
        pace: Slow, with a gentle held vowel
        pitch: Middle-high and softly falling
    rooster:
      display_name: Rooster
      tts:
        delivery: Proud, friendly, and musical
        timbre: Clear, ringing voice
        pace: Measured across the full call
        pitch: High, rising then falling in a broad arc
    dog:
      display_name: Dog
      tts:
        delivery: Playful and welcoming
        timbre: Warm, sturdy voice with a soft edge
        pace: Medium, with one firm beat
        pitch: Middle-low with a small upward bounce
    cat:
      display_name: Cat
      tts:
        delivery: Quiet and curious
        timbre: Light, smooth, close voice
        pace: Slow, with a softly stretched ending
        pitch: High-middle with a gentle upward curl
