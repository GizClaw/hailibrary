schema_version: 2
language: zh-CN
writer: 溪铃
title: 月井晚安·星星
summary: 小咕是一只小猫头鹰。小咕数着井水里的星星，渐渐困了，睡着了。
chapters:
  - id: ch01
    title: 数星星，晚安
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 井水里有星星，还是小鱼？
    choices:
      - 星星
      - 小鱼
    answer: 星星
    page_refs:
      - p02
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 小咕睡着了，还是飞走了？
    choices:
      - 睡着了
      - 飞走了
    answer: 睡着了
    page_refs:
      - p07
