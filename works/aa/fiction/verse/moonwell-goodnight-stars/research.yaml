schema_version: 1
required: false
sources:
  - url: https://osa.magnet.fsu.edu/teachersparents/articles/reflectionoflight.html
    authority: Optical Society of America / Florida State University
    claims:
      - Smooth water can reflect an image; the lights in the well depict
        reflections, not submerged stars.
  - url: https://www.oxfordlearnersdictionaries.com/definition/english/star_1
    authority: Oxford University Press
    claims:
      - The target star means the bright light seen in the night sky, not a
        celebrity or a decorative badge.
  - url: https://www.zdic.net/hans/星星
    authority: Han Dian
    claims:
      - 星星 is the night-sky noun, with neutral-tone second syllable xīng xing.
  - url: https://www.allaboutbirds.org/news/bird-cams-faq-barred-owl-nest/
    authority: Cornell Lab of Ornithology
    claims:
      - Owls can sleep with eyes closed, supporting the ordinary sleep pose; Pip
        is not identified as a Barred Owl and no species-specific sleep schedule
        is asserted.
notes: "No subject research required: purely invented bedtime verse, book 1 of
  Moonwell Goodnight / 月井晚安. Sources record independent review of ordinary
  reflection and lexical assumptions. Pip is a storybook owl, not a named
  biological species. The verse does not teach owl sleep schedules or claim
  counting causes sleep. Star glints are stylized reflections. Setting: mossy
  stone well beside an old pear tree at night."
