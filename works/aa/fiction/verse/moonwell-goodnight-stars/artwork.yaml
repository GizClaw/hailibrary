schema_version: 1
style: watercolor-gouache
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  series: Moonwell Goodnight / 月井晚安, book 1 of 3; cover establishes the reference
    design.
  setting: Old pear tree left, mossy circular stone well right. Broad branch
    outside the opening supports Pip. Enclosed amber lantern on ground left.
    Crescent moon reflected in water.
  palette: Dark blue night, moss green, cream, warm amber lamplight; assignment
    night lighting overrides the Style daylight default.
  pip: Round brown owl, cream belly and face discs, big amber eyes, one central
    fluffy tuft, ochre beak and feet, no clothes.
  counting: Counts identify the stars Pip has noticed. Framing and leaf
    reflections isolate glints; the number of real stars does not change.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Clear first-book design of Pip beside the old pear tree and mossy well at
      night; moon and starlight reflected in water.
  - id: p01
    file: artwork/p01.webp
    scene: Pip watches the well water from the pear-tree branch and begins counting.
  - id: p02
    file: artwork/p02.webp
    scene: Well water reflects starlight and the crescent moon; Pip watches from the
      branch.
  - id: p03
    file: artwork/p03.webp
    scene: Pip notices one clear star reflection beside the reflected moon; leaves
      obscure the other glints.
  - id: p04
    file: artwork/p04.webp
    scene: Pip notices two clear star reflections beside the reflected moon.
  - id: p05
    file: artwork/p05.webp
    scene: Pip notices three clear star reflections beside the reflected moon.
  - id: p06
    file: artwork/p06.webp
    scene: Pip grows sleepy on the same branch, amber eyes drooping.
  - id: p07
    file: artwork/p07.webp
    scene: Pip sleeps with eyes closed on the same secure branch outside the well
      opening.
  - id: p08
    file: artwork/p08.webp
    scene: Sleeping Pip and bright reflected stars rest quietly as the narrator bids
      the stars good night.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
