schema_version: 1
style: watercolor-gouache
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  series: Moonwell Goodnight / 月井晚安, book 2 of 3; match the established book-1 character, well, pear tree, lantern, and night setting.
  setting: Old pear tree on the left with a snug round tree hollow above the broad branch; mossy circular stone well on the right; enclosed amber lantern on the ground left; crescent moon reflected in the well water.
  palette: Soft dark-blue rainy night, moss green, cream, muted brown, and warm amber lamplight; night lighting overrides the Style daylight default.
  pip: Small round brown owl with cream belly and face discs, big amber eyes, one central fluffy feather tuft, tiny ochre beak and feet, and no clothing.
  rain: Gentle, sparse rain with readable droplets and small ripples; cozy rather than stormy, with no lightning or danger.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Pip listens from the round hollow of the old pear tree beside the mossy well; gentle rain falls through warm lantern light and ripples the reflected crescent moon.
  - id: p01
    file: artwork/p01.webp
    scene: Gentle raindrops tap the mossy stone rim and dark water of the moonwell while Pip watches from the nearby pear-tree hollow.
  - id: p02
    file: artwork/p02.webp
    scene: A close, uncluttered view of small droplets making tip-tap ripples beside the crescent-moon reflection in the well.
  - id: p03
    file: artwork/p03.webp
    scene: Gentle rain taps the broad green pear leaves above Pip, who looks up from the hollow entrance.
  - id: p04
    file: artwork/p04.webp
    scene: A close view of pear leaves softly swishing and dripping in the rain, with Pip listening nearby.
  - id: p05
    file: artwork/p05.webp
    scene: Raindrops tap the bark and rounded entrance of Pip's snug tree home; Pip nestles safely just inside.
  - id: p06
    file: artwork/p06.webp
    scene: A close view of drops falling past the tree-home entrance as Pip listens with heavy, sleepy amber eyes.
  - id: p07
    file: artwork/p07.webp
