schema_version: 2
language: zh-CN
writer: 溪铃
title: 月井晚安·雨
summary: 雨点敲着月井、树叶和小咕的树洞。小咕听着听着，睡着了。
chapters:
  - id: ch01
    title: 雨声，晚安
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 雨敲哪里？
    choices:
      - 月井
      - 小鼓
    answer: 月井
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 小咕睡了，还是飞了？
    choices:
      - 睡了
      - 飞了
    answer: 睡了
    page_refs:
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - vocabulary:
                id: rain
                text: 雨
            - text: 敲月井。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 井边，滴答。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - vocabulary:
                id: rain
                text: 雨
            - text: 敲树叶。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 叶上，沙沙。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - vocabulary:
                id: rain
                text: 雨
            - text: 敲小咕的家。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 家门口，滴滴答答。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 听着听着，睡着了。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 嘘，
            - vocabulary:
                id: rain
                text: 雨
            - text: 声轻了。
