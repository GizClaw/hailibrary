schema_version: 1
required: false
sources:
  - url: https://www.oxfordlearnersdictionaries.com/us/definition/american_english/rain_1
    authority: Oxford University Press
    claims:
      - The target noun rain means water falling from the sky in drops and has American English pronunciation /reɪn/.
  - url: https://zdic.net/hans/%E9%9B%A8
    authority: Han Dian
    claims:
      - The noun 雨 names water drops falling from clouds and is pronounced yǔ in this story sense.
  - url: https://osa.magnet.fsu.edu/teachersparents/articles/reflectionoflight.html
    authority: Optical Society of America / Florida State University
    claims:
      - A smooth water surface can reflect a clear image, supporting the moon reflection in the well.
  - url: https://www.allaboutbirds.org/news/bird-cams-faq-barred-owl-nest/
    authority: Cornell Lab of Ornithology
    claims:
      - At least one documented owl species sleeps with closed eyes and uses tree cavities; Pip remains a fictional, species-unspecified owl.
notes: "No subject research required: this is a purely invented bedtime verse, book 2 of Moonwell Goodnight / 月井晚安. The sources record lexical review and independent checks of ordinary visual assumptions only. Rain sounds are playful onomatopoeia, not scientific claims; the verse does not claim that rain causes sleep."
