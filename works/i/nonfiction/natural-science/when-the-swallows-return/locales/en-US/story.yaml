schema_version: 2
language: en-US
writer: rain-song
title: When the Swallows Return
summary: Near the Spring Equinox, Lili and her younger cousin Yan stay with Grandma Ruan. They watch two barn swallows return, feed, choose shelter, and build over several days. Their notes separate what they saw from what they guessed.
chapters:
  - id: ch01
    title: The First Flight
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: Mud by Mud
    page_refs:
      - p05
      - p06
      - p07
      - p08
      - p09
  - id: ch03
    title: What the Notes Show
    page_refs:
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: How did the nest change from the first mud trip to the final grass and feathers?
    answer: The swallows added small bits of mud, built a half-cup against the wall, and carried grass and feathers inside.
    page_refs:
      - p06
      - p07
      - p09
      - p10
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: What did Lili notice and guess about the mud trips?
    answer: She saw fewer trips at noon and more after a shower. She guessed soft mud helped. Grandma Ruan asked if the birds carried more at sunrise than at noon.
    page_refs:
      - p08
  - id: q03
    type: evidence
    speaker: narrator
    prompt: Which two body clues helped identify the birds as barn swallows?
    answer: Their rust-colored throats and long, forked tails helped identify them.
    page_refs:
      - p02
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why did Lili write that she did not know if these were last year's birds?
    answer: She saw two swallows, but she had no evidence that she had seen these same birds last year.
    page_refs:
      - p03
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What do Lili's notes show helped the swallows build the nest?
    answer: The swallows found food over the river, wet mud, and a dry wall under the roof. Both birds made many trips to build the nest.
    page_refs:
      - p04
      - p05
      - p06
      - p07
      - p08
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "Near the "
            - vocabulary:
                id: spring-equinox
                text: spring equinox
            - text: ", Lili opened her orange notebook. She and her younger cousin Yan were staying with Grandma Ruan. Two dark birds swept from the river toward the houses."
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Yan raced into the small garden where Grandma Ruan watched the weather. “Their tails look like open scissors!” he cried. Rust-colored throats and long, forked tails marked them as barn swallows."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Yan asked, “Are they last year's birds?” Grandma Ruan lowered her binoculars. “What would tell us?” The birds had no bands or special marks. Lili wrote, “Two arrived, but we don't know if they were here last year.”"
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "The swallows had "
            - vocabulary:
                id: migrate
                text: migrated
            - text: " here to raise chicks. They skimmed over water and rice fields, catching flying insects for food. Yan tried to guess where they would turn next."
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "A few days later, the two birds circled Grandma Ruan's house. They hovered under the "
            - vocabulary:
                id: eaves
                text: eaves
            - text: " beside a firm wooden beam. “Could they nest there?” Yan asked."
    - id: p06
      illustration: p06
      paragraphs:
        - text: Night rain left soft mud beside the garden path. At sunrise, one swallow picked up mud in its bill. The other carried a dry grass stem.
    - id: p07
      illustration: p07
      paragraphs:
        - text: "The two birds pressed small bits of mud against the wall. Working as a pair, they flew back and forth. “They're tiny builders with wings!” Yan shouted."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "At noon, Lili saw dry mud and fewer trips. A shower softened the mud, and the birds carried it again. “Maybe soft mud helped,” Lili guessed. “Or did they carry more at sunrise than at noon?” Grandma Ruan asked."
    - id: p09
      illustration: p09
      paragraphs:
        - text: Slowly, a half-cup rose against the wall. The swallows mixed grass into the mud. Under the roof edge, the growing nest stayed dry.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Days later, Lili watched the birds carry grass and small feathers inside. Her notes said, “The swallows had "
            - vocabulary:
                id: migrate
                text: migrated
            - text: " here. They found food over the river, wet mud, and a dry wall under the roof.”"
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "Yan pointed up and at the nest. He guessed, “The "
            - vocabulary:
                id: spring-equinox
                text: spring equinox
            - text: " brought them!” Grandma asked, “Did it bring them, or tell us when?” Lili smiled by her notebook. “They came around that time, but it didn't bring them.”"
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "At dusk, the mud cup clung beneath the "
            - vocabulary:
                id: eaves
                text: eaves
            - text: ". The two swallows rested on a nearby beam. Lili turned to a blank page and wrote, “Watch again tomorrow.”"
