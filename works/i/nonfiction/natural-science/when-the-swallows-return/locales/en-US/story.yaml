      tts:
        delivery: observant and quietly warm
        timbre: clear adult voice with a soft edge
        pace: steady medium
        pitch: middle
    lili:
      display_name: Lili
      tts:
        delivery: careful and precise with excitement just beneath the words
        timbre: clear young voice with a light, focused tone
        pace: measured medium-slow
        pitch: middle-high
    yan:
      display_name: Yan
      tts:
        delivery: loud, quick, and full of guesses
        timbre: bright young voice with a lively edge
        pace: fast
        pitch: high
    grandma-ruan:
      display_name: Grandma Ruan
      tts:
        delivery: calm and gently questioning
        timbre: mellow older voice with a dry warmth
        pace: unhurried
        pitch: middle-low
