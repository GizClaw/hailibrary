      - p09
  - id: ch03
    title: 笔记里的发现
    page_refs:
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 从第一次带泥到把草和羽毛放进巢里，泥巢怎样变化？
    answer: 家燕先把小泥团一层层按在墙上。泥巢变成半个碗的样子。它们再把细草和羽毛带进去。
    page_refs:
      - p06
      - p07
      - p09
      - p10
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 中午到小雨后，莉莉看见了什么，又猜了什么？
    answer: 她看见中午带泥少，雨后又带泥。她猜软泥也许更好用。阮奶奶还问，家燕早上是不是来得更多。
    page_refs:
      - p08
  - id: q03
    type: evidence
    speaker: narrator
    prompt: 从哪两处可以看出它们是家燕？
    answer: 嘴巴下面是红色，长尾巴中间分开。
    page_refs:
      - p02
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 莉莉为什么写下“还不知道是不是去年的”？
    answer: 她只看到两只燕子，认不出去年见过的是不是这两只。
    page_refs:
      - p03
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 从莉莉的笔记看，家燕怎样做好了泥巢？
    answer: 家燕飞回后，在河上找到飞虫，又找到湿泥和屋檐下的墙。两只鸟一次次来回，才做好泥巢。
    page_refs:
      - p04
      - p05
      - p06
      - p07
      - p08
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - vocabulary:
                id: spring-equinox
                text: 春分
            - text: 前后，莉莉和小表弟阿岩来阮奶奶家住几天。莉莉站在屋后的小园里，打开笔记本。河面上，两道黑影飞向屋顶。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 阿岩穿着蓝雨衣跑来。他抬头喊：“尾巴中间分开了！”它们嘴巴下面是红色，长尾巴中间分开。这说明它们是家燕。
    - id: p03
      illustration: p03
      paragraphs:
        - text: "阿岩问：“会不会是去年那两只？”阮奶奶放下望远镜：“怎么才能知道？”它们脚上没有脚环（jiǎo huán）。莉莉写下：“来了两只燕子，还不知道是不是去年的。”"
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 家燕从别处
            - vocabulary:
                id: migrate
                text: 迁徙
            - text: 到这里，准备养小燕子。它们贴着水面和田地飞，捉飞虫。吃飞虫让它们有力气。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 几天后，两只家燕在阮奶奶家的
            - vocabulary:
                id: eaves
                text: 屋檐
            - text: 下飞来飞去。它们飞近屋檐下的一根木头。阿岩问：“要在这儿做窝吗？”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 夜雨把小路边的泥土打湿了。天刚亮，一只家燕嘴里带着湿泥。另一只带来一点干草。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 两只鸟把小泥团按在屋檐下的墙上。它们一次次飞回，泥巢越变越高。阿岩喊：“它们也会用泥盖房子！”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 中午，路边的泥干了，家燕带泥也少了。小雨后，泥又变软了，家燕又来带泥。莉莉猜：“也许软泥好用。”阮奶奶问：“还是早上来得多，中午来得少？”
    - id: p09
      illustration: p09
      paragraphs:
        - text: 泥巢慢慢变成半个碗的样子。家燕把小草加进湿泥。伸出的屋檐让小雨打不到泥巢。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "家燕把草和羽毛带进巢里。莉莉看笔记，上面写着：“家燕"
            - vocabulary:
                id: migrate
                text: 迁徙
            - text: 到这里。它们在河上找到飞虫，也找到湿泥和屋檐下的墙。”她看看河、小路和墙。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 阿岩指天，又指泥巢。他猜：“
            - vocabulary:
                id: spring-equinox
                text: 春分
            - text: 把它们带来了！”阮奶奶问：“真是春分带来的吗？”莉莉笑着说：“不是。我们只知道，燕子是在春分前后回来的。”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 傍晚，泥巢牢牢贴在
            - vocabulary:
                id: eaves
                text: 屋檐
            - text: 下。两只家燕停在旁边的木头上。莉莉翻到空白页，写下：“明天再看。”
