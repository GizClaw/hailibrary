schema_version: 2
language: zh-CN
writer: 雨歌
title: 燕子回来了
summary: 春分前后，莉莉和小表弟阿岩来阮奶奶家住几天。他们看见两只家燕飞回小镇，捉虫吃，找地方做窝。后来，泥巢一天天变大。莉莉把看到的事和猜想分开写进笔记。
chapters:
  - id: ch01
    title: 飞回小镇
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 一团一团的泥
    page_refs:
      - p05
      - p06
