schema_version: 1
style: naturalistic-storybook
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: A small river town in eastern China beside rice fields, a levee path, and an old weather-observation garden behind Grandma Ruan's whitewashed tiled house.
  lili: Chinese girl about 10, long black ponytail, olive field vest with pockets, orange-covered notebook, pencil behind one ear.
  yan: Chinese boy about 8, short spiky black hair, blue raincoat, magnifying glass on a cord.
  grandma-ruan: Chinese woman about 68, short silver hair, wide straw hat, gray cardigan, binoculars.
  barn-swallows: Two anatomically accurate barn swallows with blue-black backs, warm rust throats, pale underparts, and long deeply forked tails.
  palette: Fresh spring greens, wet earth browns, whitewashed walls, gray roof tiles, olive, blue, and orange character accents.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Lili, Yan, and Grandma Ruan are clearly shown together in the old observation garden while two barn swallows sweep toward a half-built mud nest under the tiled eaves; the rice fields and river town establish the setting.
  - id: p01
    file: artwork/p01.webp
    scene: Near the Spring Equinox, Lili opens her plain orange notebook in the old weather garden as two barn swallows fly from the river toward the tiled houses.
  - id: p02
    file: artwork/p02.webp
    scene: Yan points excitedly while Lili studies two low-flying barn swallows whose rust throats and long forked tails are clearly visible.
  - id: p03
    file: artwork/p03.webp
    scene: Grandma Ruan lowers her binoculars and questions the children while Lili writes in her notebook and Yan watches the two unbanded birds from a respectful distance.
  - id: p04
    file: artwork/p04.webp
    scene: The two barn swallows skim above the river edge and young rice fields while catching tiny flying insects; Lili and Yan observe from the levee path.
  - id: p05
    file: artwork/p05.webp
    scene: The swallows hover beneath the projecting gray-tiled eaves of Grandma Ruan's house beside a firm wooden beam as the three observers stand well back.
  - id: p06
    file: artwork/p06.webp
    scene: After night rain, one barn swallow gathers wet mud in its bill beside the garden path while the other carries one dry grass stem.
  - id: p07
    file: artwork/p07.webp
    scene: Both swallows press small bits of mud against one shared nest start on the wall beneath the beam while Yan reacts with delight and Lili watches with her orange notebook closed.
  - id: p08
    file: artwork/p08.webp
    scene: A brief spring shower softens the muddy path edge, and the swallows return for mud while Grandma Ruan asks the children a question from beneath her straw hat.
  - id: p09
    file: artwork/p09.webp
    scene: A realistic semicircular half-cup nest rises against the whitewashed wall under the roof edge as the pair adds mud mixed with grass.
  - id: p10
    file: artwork/p10.webp
    scene: The nearly finished nest is lined with fine grass and small feathers while Lili compares her plain notebook with the river, muddy path, and sheltered wall around her.
  - id: p11
    file: artwork/p11.webp
    scene: Yan gestures from the spring sky toward the nest, Grandma Ruan responds with a questioning expression, and Lili smiles beside an open notebook with no visible marks.
  - id: p12
    file: artwork/p12.webp
    scene: At dusk, the completed mud cup clings beneath the eaves, the two swallows rest on a nearby beam, and Lili turns to a blank notebook page as Yan and Grandma Ruan watch.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - no-visible-text
      - barn-swallow-anatomy
      - character-continuity
      - clothing-and-prop-continuity
      - nest-building-sequence
      - scene-and-weather-continuity
      - safe-observation-distance
