learning:
  goals:
    - Connect several conditions that help barn swallows return and build a nest.
    - Separate an observation from a guess about a cause or an individual bird.
    - Use notes from several days to state a simple central idea.
  concepts:
    - barn swallow migration
    - mud-cup nest building
    - field observation and evidence
