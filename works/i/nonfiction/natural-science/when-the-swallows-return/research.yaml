schema_version: 1
required: true
sources:
  - url: https://www.allaboutbirds.org/guide/Barn_Swallow/lifehistory
    publisher: Cornell Lab of Ornithology
    claims:
      - Barn swallows forage for flying insects over open fields and water.
      - Pairs inspect possible sites by flying up and hovering, and commonly choose eaves, rafters, or cross beams.
      - Both birds build a cup with mud pellets and grass, and line it with grass and feathers.
      - A nest attached to a wall forms a semicircular half-cup.
  - url: https://www.allaboutbirds.org/guide/Barn_Swallow
    publisher: Cornell Lab of Ornithology
    claims:
      - Long deeply forked tails, dark blue upperparts, and warm-colored throats are useful barn swallow field marks.
      - Barn swallows often fly low over fields and water and build cup-shaped mud nests on human structures.
  - url: https://zjnews.zjol.com.cn/zjnews/hznews/201903/t20190320_9705083.shtml
    publisher: Zhejiang Online and Qianjiang Evening News
    claims:
      - The March 20 report said barn swallows had already appeared on Hefang Street in Hangzhou.
      - A West Lake bird expert expected barn swallows around West Lake by late March based on records from previous years.
      - This eastern-China report supports a March arrival window without fixing one date for every place or year.
  - url: https://doi.org/10.1016/j.avrs.2024.100192
    publisher: Avian Research
    claims:
      - Tracked barn swallows breeding in southern China made seasonal migrations and used a direct spring route back from Southeast Asian wintering areas.
  - url: https://doi.org/10.1016/j.scitotenv.2021.148823
    publisher: Science of the Total Environment
    claims:
      - Long-term records from northern China document spring first-sighting dates for barn swallows and show that arrival timing varies among places and years.
  - url: https://www.canada.ca/en/environment-climate-change/services/species-risk-public-registry/residence-descriptions/barn-swallow.html
    publisher: Environment and Climate Change Canada
    claims:
      - Barn swallows investigate possible nest sites after reaching the breeding grounds, and construction typically begins 5 to 14 days after spring arrival.
  - url: https://www.canada.ca/en/environment-climate-change/services/species-risk-public-registry/cosewic-assessments-status-reports/barn-swallow-2021.html
    publisher: Environment and Climate Change Canada
    claims:
      - Pair formation occurs within about two weeks of arrival at the breeding grounds, before the paired birds build together.
      - Reported new-nest construction takes 6 to 26 days depending on weather and other conditions, while the story avoids a falsely exact duration.
  - url: https://www.ontario.ca/page/barn-swallow-recovery-strategy
    publisher: Government of Ontario
    claims:
      - Nest construction starts soon after barn swallows return to their breeding grounds.
      - Building a nest generally takes about 6 to 15 days, so the story's several-day sequence is a compressed but plausible observation window.
  - url: https://web.stanford.edu/group/stanfordbirds/text/uspecies/Barn_Swallow.html
    publisher: Stanford University
    claims:
      - The barn swallow species account gives a typical nest-building duration of 7 to 14 days.
  - url: https://www.jstage.jst.go.jp/article/jyio1952/4/1/4_1_31/_article/-char/en
    publisher: Journal of the Yamashina Institute for Ornithology
    claims:
      - A study of 70 barn swallow nests found that birds carried nest material chiefly in the morning and completed nests in about 10 days on average.
      - Time of day is therefore a plausible alternative explanation for fewer mud trips observed at noon.
  - url: https://doi.org/10.1371/journal.pone.0035140
    publisher: PLOS ONE
    claims:
      - The paper identifies photoperiod, the relative duration of day and night, as a main cue birds use to time migration and breeding.
  - url: https://www.hko.gov.hk/en/gts/time/24solarterms.htm
    publisher: Hong Kong Observatory
    claims:
      - Spring Equinox is one of the 24 solar terms and occurs at zero degrees solar longitude.
      - Day and night are approximately equal in length at the equinox.
  - url: https://p.weather.com.cn/2017/03/tqsh/2676927_list.shtml
    publisher: China Weather Network
    claims:
      - The traditional first phenological sign of the Spring Equinox is described as the arrival of swallows.
      - The traditional association is cultural context, not proof that every barn swallow arrives on that date.
notes: >-
  The river town, house, weather garden, children, grandmother, and two observed
  birds are fictional. The eastern-China sighting near the Spring Equinox is
  regionally plausible, while the exact arrival date varies by place, year, and
  bird. The story treats the children's same-day mud observations as
  correlation: Lili offers soft mud only as a guess, and Grandma Ruan raises
  time of day as another possibility. Seasonal timing remains meaningful
  because changing day length can cue migration. Taken together, the Hong Kong
  Observatory's definition of the Spring Equinox as a solar term and Caprioli
  et al.'s account of photoperiod as a timing cue support an editorial
  distinction: the named date marks seasonal timing but is not itself a force
  that transports birds. The birds are unbanded, so the children do not
  claim they are the same individuals seen in an earlier year. The human-hair
  nest-trap paper with DOI 10.1002/ece3.73592 was removed because it does not
  support migration, site, or timing claims used by this story.
