schema_version: 1
required: true
traditional_tale:
  name: Stone Soup
  catalogue_number: ATU 1548
  cultural_origin: >-
    A European folktale family with many regional forms. The exact historical
    version consulted here was printed in London as an Irish comic recipe; that
    publication label does not prove that the whole tale type began in Ireland.
  consulted_version:
    title: A Receipt to Make Stone Soup
    book: The Spirit of Irish Wit; or, Post-Chaise Companion
    credited_name: Momus Broadgrin
    publisher: Thomas Tegg
    place: London
    year: 1812
    page: 333
    public_domain_basis: Published in 1812.
  retained_plot_beats:
    - From the wider ATU 1548 family, a hungry traveler arrives and starts with a pot of water and one stone.
    - From the 1812 recipe, salt, onions, carrots, greens, and other food turn the water into soup.
    - From the 1812 recipe, the unchanged stone is removed when the soup is ready.
    - The HaiLibrary retelling newly gives several villagers fair limits, voluntary choices, shared cooking work, and a meal eaten together.
sources:
  - url: https://sites.pitt.edu/~dash/type1548.html
    publisher: University of Pittsburgh, D. L. Ashliman Folktexts
    claims:
      - Stone Soup and its related regional variants are cataloged as folktale type ATU 1548.
      - The collection documents European forms using stones, pebbles, nails, or whetstones and many different travelers and ingredients.
      - The 1812 item titled A Receipt to Make Stone Soup is presented as an Irish variant and identifies its book and page.
  - url: https://books.google.com/books?id=e65bAAAAQAAJ&pg=PA333
    publisher: Momus Broadgrin, The Spirit of Irish Wit; Thomas Tegg, 1812
    claims:
      - The exact consulted public-domain version is A Receipt to Make Stone Soup on page 333.
      - It puts a large stone in water, adds salt, onions, cabbage, carrots, and other food, and removes the stone after the soup is made.
  - url: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
    publisher: United States Food and Drug Administration
    claims:
      - Fresh produce should be washed under running water before preparation.
      - The story therefore shows the adults washing the onion and carrots before they are cut and cooked.
  - url: https://www.usfa.fema.gov/gallery/pictographs/cooking.html
    publisher: United States Fire Administration
    claims:
      - Cooking guidance calls for a safety zone around heat and for someone to remain present while food cooks.
      - The story and fixed artwork keep adults in charge of the fire, knife, stable pot, and hot soup.
  - url: https://www.ars.usda.gov/ARSUserFiles/80400500/pdf/5%20Butternut%20Squash%20Soup.pdf
    publisher: United States Department of Agriculture, Agricultural Research Service
    claims:
      - A vegetable soup recipe cooks cut vegetables until tender.
      - Testing whether the vegetables are soft is a plausible way for the adults to judge that the soup is ready.
notes: >-
  The hill village, the hard previous winter, and all named characters are
  fictional. The text does not claim that the stone flavors or feeds anyone.
  Mara names the stone as a way to begin, and each villager decides what is safe
  to spare. Amounts and cooking time stay nonnumeric because pot size, heat, and
  cut size are not specified. The wording was drafted anew rather than adapted
  from the consulted version, a textbook, a picture book, or a modern retelling.
