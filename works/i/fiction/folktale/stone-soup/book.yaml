schema_version: 1
id: stone-soup
type:
  - reading
  - illustrated-short-story
style: wax-crayon
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - culture
    - everyday-life
    - food
  themes:
    - cooperation
    - sharing
  moods:
    - gentle
    - hopeful
    - warm
characters:
  - id: narrator
    kind: narrator
    description: A warm village storyteller who follows actions and consequences without explaining the lesson.
    voice_identity: clear, observant, and lightly playful
  - id: mara
    kind: character
    description: A hungry adult traveler who starts the unusual soup and lets each villager make a choice.
    visual_identity: Woman traveler in her mid-thirties with tan skin, dark-brown curly hair in one long braid, a rust-red hooded cloak over a teal tunic, olive trousers, worn brown boots, and a brown cross-body satchel.
    voice_identity: calm, dryly amused, and patient
  - id: nella
    kind: character
    description: A cautious village shopkeeper who opens her door only a little before curiosity changes her mind.
    visual_identity: Older woman in her fifties with pale freckled skin, silver-blond hair in a round bun, a mustard-yellow dress, a deep-blue apron, and dark red shoes.
    voice_identity: guarded and brisk at first, then practical and warm
  - id: oren
    kind: character
    description: A gardener who tends the fire and brings carrots from his small store.
    visual_identity: Tall man in his forties with brown skin, short black curls, a neat black beard, a leaf-green vest over a cream shirt, brown trousers, and black boots.
    voice_identity: low, direct, and thoughtful
  - id: bram
    kind: character
    description: A carpenter who steadies the pot, brings cooked beans, and sets out bowls.
    visual_identity: Stocky man in his thirties with fair skin, straight auburn hair under a purple cloth cap, a cobalt-blue shirt, a tan work apron, gray trousers, and brown clogs.
    voice_identity: hearty, curious, and gently skeptical
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Connect how several small additions and shared tasks produce one complete meal.
    - Infer why watching the pot changes the villagers' choices.
    - Identify from story evidence that the food, not the stone, makes the soup.
  concepts:
    - folktale
    - ingredients
    - cooperation
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
