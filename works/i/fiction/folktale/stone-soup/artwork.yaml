schema_version: 1
style: wax-crayon
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: A fictional old European hill village on a cold late-autumn day, with warm ochre stone cottages, dark wooden doors, red clay roofs, a cobbled square, and distant blue hills. No signs or written marks.
  mara: Woman traveler in her mid-thirties with tan skin, dark-brown curly hair in one long braid, a rust-red hooded cloak over a teal tunic, olive trousers, worn brown boots, and a brown cross-body satchel.
  nella: Older woman in her fifties with pale freckled skin, silver-blond hair in a round bun, a mustard-yellow dress, a deep-blue apron, and dark red shoes.
  oren: Tall man in his forties with brown skin, short black curls, a neat black beard, a leaf-green vest over a cream shirt, brown trousers, and black boots.
  bram: Stocky man in his thirties with fair skin, straight auburn hair under a purple cloth cap, a cobalt-blue shirt, a tan work apron, gray trousers, and brown clogs.
  pot_and_stone: One wide black iron cooking pot with two loop handles and one smooth oval gray stone small enough to lift with a long wooden spoon.
  palette: Warm paper, rust red, mustard yellow, deep blue, leaf green, carrot orange, bean cream, smoky gray, and evening violet.
  safety: Only adults cook. The fire is contained in a low stone hearth in the open square; sleeves are close fitting, the pot is stable, and people not tending it stand well back.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mara, Nella, Oren, and Bram gather around the stable black pot in the cobbled square as colorful vegetables go into the soup; the clean gray stone rests visibly on a wooden spoon beside the pot, and the warm village opens behind them.
  - id: p01
    file: artwork/p01.webp
    scene: Cold wind bends bare branches as hungry Mara enters the ochre hill village alone, one hand on her empty brown satchel while smoke rises from cottage chimneys.
  - id: p02
    file: artwork/p02.webp
    scene: Nella opens her dark wooden door only a narrow crack to Mara; other doors along the cold lane stay firmly shut, and both women's guarded expressions are clear.
  - id: p03
    file: artwork/p03.webp
    scene: In the square, Mara scrubs one smooth gray stone in a wooden basin beside a large black pot of water while Nella watches with open surprise.
  - id: p04
    file: artwork/p04.webp
    scene: Oren tends a small contained fire inside a low stone hearth and Bram steadies the black pot above it; Mara, Nella, and several curious adult villagers watch from a safe distance.
  - id: p05
    file: artwork/p05.webp
    scene: Nella returns with one washed onion and cuts it on a wooden board at a table well away from the fire while Mara tastes warm water with the long wooden spoon.
  - id: p06
    file: artwork/p06.webp
    scene: Oren adds three washed, cut carrots from a small basket while Bram approaches with a small bowl of cooked cream-colored beans; onion steam rises from the guarded pot.
  - id: p07
    file: artwork/p07.webp
    scene: Bram tips the cooked beans into the pot while Mara smiles and three distinct colors of food float around the gray stone; the adults remain safely positioned around the hearth.
  - id: p08
    file: artwork/p08.webp
    scene: Steam drifts toward Nella's doorway as two unnamed adult neighbors each bring one small addition, a pinch bowl of salt and a handful of green leaves; the soup grows more colorful.
  - id: p09
    file: artwork/p09.webp
    scene: >-
      The adults cooperate around the square: Nella stirs, Oren watches the
      steady contained fire, Bram arranges plain bowls, and Mara checks a cut
      vegetable with the long spoon.
  - id: p10
    file: artwork/p10.webp
    scene: Mara lifts the unchanged smooth gray stone out with the long wooden spoon while Oren lightly taps it with a second spoon; soft vegetables remain in the steaming pot.
  - id: p11
    file: artwork/p11.webp
    scene: Nella fills plain bowls with soup as Bram breaks one last loaf into pieces; Mara, Oren, and the adult neighbors sit together at a long outdoor table in the warm evening light.
  - id: p12
    file: artwork/p12.webp
    scene: At sunrise by the village gate, Nella gives Mara bread and one onion for the road; Mara holds the clean gray stone above her open brown satchel, ready to put it away, with the village glowing behind them.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - no-visible-text
      - character-and-clothing-continuity
      - pot-stone-and-village-continuity
      - scene-action-alignment
      - wax-crayon-style
      - adult-only-cooking-safety
