schema_version: 2
language: zh-CN
writer: 百径灯
title: 石头汤
summary: 去年冬天又冷又长，村里的食物不多。赶路人玛拉用一块石头给空锅开了头。村民各自拿来一点东西，又一起做事，终于吃上了一锅热汤。
chapters:
  - id: ch01
    title: 空锅开了头
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 香味飘过广场
    page_refs: [p05, p06, p07, p08]
  - id: ch03
    title: 布袋不再空
    page_refs: [p09, p10, p11, p12]
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 玛拉洗净石头以后，谁来生火，谁把大锅放稳？
    answer: 奥伦生火，布兰把大锅放稳。
    page_refs: [p03, p04]
  - id: q02
    type: character-motive
    speaker: narrator
    prompt: 妮拉为什么只把门打开一点？
    answer: 去年冬天又冷又长，她家留下的食物不多。
    page_refs: [p02]
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 汤的颜色和香味为什么变了？
    answer: 村民放进了洋葱、胡萝卜、豆子、盐和青菜。
    page_refs: [p05, p06, p07, p08]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 哪件事说明石头没有煮成食物？
    answer: 菜软了，玛拉用长勺拿出的石头却还是原来的样子。
    page_refs: [p10]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 每家食物都不多，大家为什么还能吃上一顿饭？
    answer: 村民各自拿出一点食物，还合作看火、搅汤和摆碗。
    page_refs: [p05, p06, p08, p09, p11]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 秋末，冷风吹过山路。赶路人玛拉空着肚子，走进山村。她摸摸布袋，里面什么也没有。
    - id: p02
      illustration: p02
      paragraphs:
        - text: "妮拉只把门打开一点。她小声说：“去年冬天又冷又长，我们留下的食物不多。”小路上，别家的门也没有打开。"
    - id: p03
      illustration: p03
      paragraphs:
        - text: "玛拉没有再要吃的。她借来一口大锅，打来水，把灰石头洗干净，放进锅里。妮拉跟到村子中间问：“石头有什么用？”玛拉说：“先给空锅开个头。”"
    - id: p04
      illustration: p04
      paragraphs:
        - text: 奥伦抱来木头生火，布兰把大锅放稳。他们还不确定能拿出什么食物，就先帮忙。火生起来后，几位村民也走了过来。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "水慢慢热了。玛拉问妮拉：“拿出一个洋葱，会不会太多？”妮拉想了想，回屋拿来一个洋葱。她把这第一样"
            - vocabulary: {id: ingredient, text: 食材}
            - text: "洗干净，再切成小块，放进锅里。"
    - id: p06
      illustration: p06
      paragraphs:
        - text: "洋葱一进锅，香味就飘开了。奥伦闻了闻：“我能拿出三根胡萝卜。”他把胡萝卜洗净切好，也放进锅里。布兰端来一小碗熟豆子。"
    - id: p07
      illustration: p07
      paragraphs:
        - text: "布兰把豆子倒进锅，锅里多了几种颜色。他盯着灰石头问：“我们最后要吃石头吗？”玛拉摇头：“等菜软了，再看看石头。”"
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "热气飘远了。两位邻居也闻到了香味。一个送来一点盐，另一个带来几片青菜。每样"
            - vocabulary: {id: ingredient, text: 食材}
            - text: "都让汤有一点新变化。"
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "这时，谁也没有闲着。妮拉搅汤，奥伦看火，布兰摆碗，三人分工"
            - vocabulary: {id: cooperate, text: 合作}
            - text: "。玛拉舀起一块胡萝卜，看看软了没有。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "菜软了，玛拉用长勺拿出灰石头。奥伦用另一把勺碰了碰：“一点没变！”锅里的汤却有了各种菜的香味。"
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "妮拉盛汤，布兰把最后一块面包分开。他们把碗摆上长桌。大家"
            - vocabulary: {id: cooperate, text: 合作}
            - text: "，把汤和面包传给每个人，然后坐下一起吃。"
    - id: p12
      illustration: p12
      paragraphs:
        - text: 天亮时，玛拉在村口打开布袋，准备收好石头。妮拉赶来，把面包和一个洋葱放进去。玛拉放进灰石头，背着不再空的布袋走上山路。
