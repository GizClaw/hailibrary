        delivery: calm, direct, and patient under pressure
        timbre: warm adult voice with a light husky texture
        pace: measured medium-slow
        pitch: middle-low
    nella:
      display_name: Nella
      tts:
        delivery: careful and guarded at first, then practical and open
        timbre: crisp older adult voice with gentle brightness
        pace: medium with firm pauses
        pitch: middle-high
    oren:
      display_name: Oren
      tts:
        delivery: thoughtful and plainspoken, with quiet care
        timbre: full adult voice with mellow resonance
        pace: unhurried medium
        pitch: low
    bram:
      display_name: Bram
      tts:
        delivery: curious, friendly, and lightly doubtful
        timbre: rounded adult voice with grainy warmth
        pace: lively medium
        pitch: middle
