questions:
  - id: q01
    type: sequence
    prompt: What two things did Daniel do before entering the lock?
    answer: "He filmed under Gongchen Bridge and stepped back inside the yellow line. The next day, he waited outside the lock."
    page_refs:
      - p01
      - p02
      - p05
  - id: q02
    type: cause-effect
    prompt: Why did the River Lark rise with the water?
    answer: Water from the higher side flowed into the chamber. The rising surface supported and lifted the boat.
    page_refs:
      - p07
  - id: q03
    type: character-motive
    prompt: Why did Daniel write the last reading before closing the log?
    answer: "His pencil line had bent when the boat moved, so this time he finished the reading first and did not miss his task."
    page_refs:
      - p08
      - p12
  - id: q04
    type: main-idea
    prompt: What two lessons did Daniel learn while passing through the lock?
    answer: He learned how rising water lifts a boat and how to finish his log readings before returning to his phone.
    page_refs:
      - p07
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Daniel joined his aunt’s cargo boat. He raised his phone to film Gongchen Bridge.
    - id: p02
      illustration: p02
      paragraphs:
        - text: "“Stay inside the yellow line,” Aunt May said. Daniel saw a heavy rope beside his shoe."
    - id: p03
      illustration: p03
      paragraphs:
        - text: The River Lark went north. New towers rose behind old bridges. Cranes stood near willow trees.
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Daniel’s map had one thin line. “We will travel only one small part,” said Aunt May."
    - id: p05
      illustration: p05
      paragraphs:
        - text: "The next day, they waited outside a lock. Each boat followed the dispatch order."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "Inside the chamber, gates closed in front and behind. High walls stood around the boat."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Water from the higher side flowed into the chamber. The surface rose, so the boat rose too."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "Daniel watched the gauge and wrote in the log. The boat moved, and his pencil line bent."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "“Why is the gate closed?” he asked. “The two water levels do not match yet,” said Aunt May."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "More water flowed in. At last, the chamber matched the water ahead."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "The gate opened. Daniel forgot to film, but he understood the stair made of water."
    - id: p12
      illustration: p12
      paragraphs:
        - text: He wrote the last reading before closing the log. Aunt May nodded.
