schema_version: 3
language: zh-CN
writer: 雨歌
title: 水做的台阶
summary: 林舟第一次跟姑姑跑船。他想拍好运河，却先要学会记录，并看懂船闸怎样让船升高。
chapters:
  - id: ch01
    title: 出发
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 改变
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: sequence
    prompt: 进船闸前，林舟先、接着和后来分别做了什么？
    answer: 他先举起手机，想拍下拱宸桥；接着发现鞋边的粗缆绳，马上退回黄线内；第二天，他们在船闸外等待调度。
    page_refs:
      - p01
      - p02
      - p05
  - id: q02
    type: cause-effect
    prompt: 为什么青禾号会跟着水面升高？
    answer: 高处的水流进闸室，闸室水面升高，青禾号也被水面托着升高。
    page_refs:
      - p07
  - id: q03
    type: character-motive
    prompt: 林舟为什么最后先写读数，再收记录册？
    answer: 他进闸时因船身晃动写歪过笔画，所以这一回要先把最后一个读数写清楚，不再漏掉任务。
    page_refs:
      - p08
      - p12
  - id: q04
    type: main-idea
    prompt: 林舟在这次过闸中学会了哪两件事？
    answer: 他看懂了船闸怎样用升高的水面托起船，也学会先写好读数、完成记录任务。
    page_refs:
      - p07
      - p12
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林舟第一次跟姑姑跑船。他举起手机，想拍下拱宸桥。桥洞里的船声一下变响。
    - id: p02
      illustration: p02
      paragraphs:
        - text: “站在黄线里面。”姑姑说。林舟发现鞋边就是粗缆绳。他马上退回黄线内站好。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 青禾号向北走。旧桥后有新楼，柳树旁有仓库和吊机。水波让船身轻轻摇动。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 林舟画的地图只有一条细线。姑姑说：“我们只能走其中一小段。”真正的河比地图宽得多。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 第二天，他们在船闸外排队。每条船都要听调度。林舟把时间写进记录册。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 进闸后，前后闸门关上。高墙把船围在中间。林舟抬头看着湿水印。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 高处的水流进闸室。水面升高，青禾号也跟着升高。墙上的旧水印越来越近。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 林舟看着水尺，在记录册上写下读数。船一晃，笔画歪了。他赶快把读数写清楚。
    - id: p09
      illustration: p09
      paragraphs:
        - text: “门为什么不开？”他问。姑姑说：“两边水位还没一样高。”林舟放下手机，继续等。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 水继续流入。闸室里的水终于和前面的水一样高。船边的水慢慢安静下来。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 闸门打开了。林舟忘了拍照，却看清了这级水做的台阶。后面的船还在低处等候。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 他先写好最后一个读数，再收起记录册。姑姑点了点头。这一回，他没有漏掉任务。
