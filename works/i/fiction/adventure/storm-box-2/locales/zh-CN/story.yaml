schema_version: 3
language: zh-CN
writer: 雨歌
title: 雨前的蓝箱子
summary: 林舟答应搬走工具箱，却只顾剪视频。风雨来了，他发现船上的一句“知道了”必须真的做到。
chapters:
  - id: ch01
    title: 出发
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 改变
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: sequence
    prompt: 姑姑叫林舟搬箱子后，他接着做了什么？
    answer: 他嘴上说“知道了”，却没有搬箱子，而是继续剪船闸视频。
    page_refs:
      - p01
      - p02
  - id: q02
    type: cause-effect
    prompt: 林舟没有马上搬箱子，造成了什么结果？
    answer: 大风来时，箱子还在甲板上，篷布也鼓了起来。林舟冲过去时又遇到甩来的松绳，船员只能先把他退回安全处。
    page_refs:
      - p02
      - p03
      - p04
      - p05
  - id: q03
    type: character-motive
    prompt: 雨停后，林舟为什么没有撕掉打湿的那一页？
    answer: 他已经对姑姑说了实话，也把风雨和耽误记了下来。留下雨痕，就是留下这次未完成任务的真实记录。
    page_refs:
      - p08
      - p09
  - id: q04
    type: main-idea
    prompt: 从蓝工具箱这件事中，林舟懂得了什么？
    answer: 答应任务就要真的完成；如果做不完，就要马上说清楚，让大家知道事情做到哪了。
    page_refs:
      - p01
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 天变暗了。姑姑叫林舟把蓝工具箱搬进篷里。远处的树叶已经开始翻动。
    - id: p02
      illustration: p02
      paragraphs:
        - text: “知道了。”林舟说。可是他还在剪船闸的视频。他以为再等一会儿也没事。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 大风突然吹来。工具箱还在甲板上，篷布也鼓了起来。雨点重重打在铁甲板上。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 林舟跑去抓箱子。一根松绳从他面前打过去。林舟吓得停在原地。
    - id: p05
      illustration: p05
      paragraphs:
        - text: “退回黄线！”姑姑减慢船速，让船保持平稳。林舟马上退到安全处。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 老周穿好救生衣，从安全的一边过去。他用长钩拉回箱子。箱子终于离开了排水口。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 林舟站在黄线内，把备用绳递给老周。他的手一直发抖。他这次听清指令再行动。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 雨停后，姑姑问：“你为什么没有搬箱子？”林舟说了实话。姑姑没有骂他，只等回答。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 他在记录册上写下风雨和耽误的时间，没有撕掉被雨打湿的页。那页纸留下几块淡淡雨痕。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 后来，林舟先做船上的工作，再拿手机。做不完时，他会马上说清楚。这样，大家知道事情做到哪了。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 返航过闸时，他把手机收好，认真读出每一个水尺读数。水面变平以后，闸门才开。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 记录册上有歪线，也有新写直的线。林舟让它们都留在那里。他知道每一道线怎样留下。
