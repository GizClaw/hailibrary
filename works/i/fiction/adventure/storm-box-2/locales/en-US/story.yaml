questions:
  - id: q01
    type: sequence
    prompt: What did Daniel do after Aunt May told him to move the case?
    answer: "He said, “Got it,” but left the case where it was and kept editing his lock video."
    page_refs:
      - p01
      - p02
  - id: q02
    type: cause-effect
    prompt: What happened because Daniel did not move the case at once?
    answer: "The case stayed on deck as the wind filled the cargo cover. When Daniel ran toward it, a loose rope snapped past his face, and the crew had to send him back to safety."
    page_refs:
      - p02
      - p03
      - p04
      - p05
  - id: q03
    type: character-motive
    prompt: Why did Daniel keep the rain-spotted page in the log?
    answer: He had told Aunt May the truth and recorded the storm and delay. Keeping the marks preserved what happened when he left the task undone.
    page_refs:
      - p08
      - p09
  - id: q04
    type: main-idea
    prompt: What did the blue tool case teach Daniel about accepting a job?
    answer: "Accepting a job means finishing it. If he needs more time, he must say so at once so the crew knows what has been done."
    page_refs:
      - p01
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: The sky grew dark. Aunt May told Daniel to move the blue tool case under shelter.
    - id: p02
      illustration: p02
      paragraphs:
        - text: "“Got it,” Daniel said. But he kept editing his lock video."
    - id: p03
      illustration: p03
      paragraphs:
        - text: "A hard wind arrived. The case was still on deck, and the cargo cover filled with air."
    - id: p04
      illustration: p04
      paragraphs:
        - text: Daniel ran toward the case. A loose rope snapped past his face.
    - id: p05
      illustration: p05
      paragraphs:
        - text: “Back inside the line!” Aunt May slowed the boat and held it steady.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Mr. Wu fastened his life vest and came from the safe side. He pulled the case back with a boat hook.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Daniel stayed inside the line and passed him a spare rope. His hands shook.
    - id: p08
      illustration: p08
      paragraphs:
        - text: "After the rain, Aunt May asked why he had not moved the case. Daniel told the truth."
    - id: p09
      illustration: p09
      paragraphs:
        - text: He logged the storm and delay. He did not tear out the rain-spotted page.
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Later, Daniel did the boat jobs before filming. If he needed time, he said so at once."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "In a lock on the return trip, he put his phone away. He read each gauge mark carefully."
    - id: p12
      illustration: p12
      paragraphs:
        - text: The log held one crooked line and many straight new lines. Daniel kept them all.
