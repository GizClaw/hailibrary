schema_version: 3
language: en-US
writer: rain-song
title: The Blue Case Before the Rain
summary: "Daniel promises to move a tool case but keeps editing. When a storm arrives, he learns that “Got it” must mean the job is truly done."
chapters:
  - id: ch01
    title: Departure
    page_refs:
      - p01
