schema_version: 1
language: en-US
writer: tomorrow-lens
title: The Valley of Borrowed Shadows
summary: A tower suddenly casts two shadows, and Li must test rival explanations without ignoring the needs behind them.
cast:
  narrator: {display_name: Narrator, tts: {delivery: restrained and precise, timbre: low adult voice, pace: medium-slow, pitch: low-medium}}
  li: {display_name: Li, tts: {delivery: analytical and open-minded, timbre: clear adult voice, pace: medium, pitch: medium}}
  oren: {display_name: Oren, tts: {delivery: guarded and resonant, timbre: textured older voice, pace: slow, pitch: low}}
  tama: {display_name: Tama, tts: {delivery: skeptical and quick, timbre: crisp young adult voice, pace: medium-fast, pitch: medium-high}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "When Li entered Twin-Cliff Valley, residents were arguing about the sky rather than the road."}]}
  - {id: p02, illustration: p02, lines: [{speaker: tama, content: [{text: "One tower, two "}, {vocabulary: {id: shadow, text: shadows}}, {text: ". Yesterday it had one."}]}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Tama marked both edges with cords. One shadow was sharp; the other looked faintly green."}]}
  - {id: p04, illustration: p04, lines: [{speaker: tama, text: "Some people claim a second sun arrived. The ridge keepers blame our clock."}]}
  - {id: p05, illustration: p05, lines: [{speaker: li, text: "Each story gives people something to blame, but neither explains all the evidence."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "The sharp shadow drifted slowly. The green one abruptly shortened."}]}
  - {id: p07, illustration: p07, lines: [{speaker: li, text: "Different sources can change shadows differently. Let us find the second beam."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Dust revealed an angled shaft of light descending from a vast curve on the ridge."}]}
  - {id: p09, illustration: p09, lines: [{speaker: tama, text: "Meanwhile, the extra shadow disrupts our morning clock. Markets and transit depend on it."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Li did not settle the question from below. She climbed with Tama to meet the ridge keepers."}]}
  - {id: p11, illustration: p11, lines: [{speaker: oren, text: "I am Oren. You have not found a new sun. You have found old mirrors."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Ancient curved mirrors hid among the rocks, redirecting morning light toward the shaded slope."}]}
  - {id: p13, illustration: p13, lines: [{speaker: li, text: "Turn one mirror slightly. We need a result that can be repeated."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "The mirror shifted, and far below, the green shadow moved with it."}]}
  - {id: p15, illustration: p15, lines: [{speaker: oren, text: "Our water channels cracked. The shaded greenhouse lost heat, so we restored the mirror array."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "Light meant for the ridge had missed its receiver and crossed the valley tower."}]}
  - {id: p17, illustration: p17, lines: [{speaker: tama, text: "The ridge gains light while the valley loses a trusted time signal."}]}
  - {id: p18, illustration: p18, lines: [{speaker: li, text: "We now have two needs, not one villain and one victim."}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "Both communities gathered around a model and showed what each side could not give up."}]}
  - {id: p20, illustration: p20, lines: [{speaker: oren, text: "We can aim at a dedicated stone receiver and reduce mirror use after repairing the channels."}]}
  - {id: p21, illustration: p21, lines: [{speaker: tama, text: "The tower has one shadow again, and the ridge was not ordered back into darkness."}]}
  - {id: p22, illustration: p22, lines: [{speaker: li, text: "An explanation must survive a moved mirror. A decision must survive the lives on both sides."}]}
chapters:
  - {id: ch01, title: The Second Shadow, page_refs: [p01, p02, p03, p04, p05, p06, p07]}
  - {id: ch02, title: Light on the Ridge, page_refs: [p08, p09, p10, p11, p12, p13, p14, p15]}
  - {id: ch03, title: Two Needs, page_refs: [p16, p17, p18, p19, p20, p21, p22]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "Which details suggest that the second shadow has another light source?", answer: "It is greenish, less sharp, and changes differently from the sun shadow.", page_refs: [p03, p06, p07]}
  - {id: q02, type: compare, speaker: narrator, prompt: "How do valley and ridge explanations initially differ?", answer: "Some valley residents propose a second sun, while ridge keepers blame the clock; neither explains all observations.", page_refs: [p04, p05]}
  - {id: q03, type: synthesis, speaker: narrator, prompt: "Which evidence connects the angled beam, mirrors, and green shadow?", answer: "Dust exposes a ridge beam, and moving a mirror moves the green shadow at the same time.", page_refs: [p08, p12, p13, p14]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why did Oren reactivate the mirror array?", answer: "Cracked water channels left the shaded greenhouse without its usual heat.", page_refs: [p15, p16]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "Why not simply shut every mirror?", answer: "That would restore the clock but ignore the ridge greenhouse's real need.", page_refs: [p15, p17, p18]}
  - {id: q06, type: evidence, speaker: narrator, prompt: "How does the revision answer both communities?", answer: "Light goes to a dedicated receiver, avoiding the tower, with reduced use planned after channel repair.", page_refs: [p20, p21]}
  - {id: q07, type: main-idea, speaker: narrator, prompt: "Which two kinds of judgment does Li separate?", answer: "Causal explanations need repeatable tests, while public decisions must also consider everyone affected.", page_refs: [p13, p18, p22]}
