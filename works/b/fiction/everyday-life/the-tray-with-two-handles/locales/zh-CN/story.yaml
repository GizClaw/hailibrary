"questions":
  - "id": "q01"
    "type": "picture"
    "prompt": "托盘上有几个杯子？"
    "answer": "三个。"
    "page_refs":
      - "p03"
  - "id": "q02"
    "type": "explicit-choice"
    "prompt": "托盘为什么会歪？"
    "answer": "因为一个把手只拉一边。"
    "page_refs":
      - "p04"
      - "p05"
  - "id": "q03"
    "type": "sequence"
    "prompt": "接着，他们加了什么？"
    "answer": "第二个把手。"
