schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 两个把手的托盘
summary: 欧伦的托盘只有一个把手，端起来会歪。欧伦和艾达加上第二个把手，托盘变平稳了。
chapters:
  - id: ch01
    title: 一个把手
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 两个把手
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 托盘上有几个杯子？
    answer: 三个。
    page_refs:
      - p03
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 托盘为什么会歪？
    choices:
      - 一个把手只拉一边
      - 杯子会飞
    answer: 一个把手只拉一边。
    page_refs:
      - p04
      - p05
  - id: q03
    type: sequence
    speaker: narrator
    prompt: 接着，他们加了什么？
    answer: 第二个把手。
    page_refs:
      - p05
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 欧伦做了一个红托盘。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 托盘只有一个
            - vocabulary:
                id: handle
                text: 把手
            - text: 。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 他放上三个空
            - vocabulary:
                id: cup
                text: 杯子
            - text: 。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 托盘一转弯就歪了。欧伦接住杯子。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 艾达说：“一转弯，它就会歪。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 他们加上第二个
            - vocabulary:
                id: handle
                text: 把手
            - text: 。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 欧伦和艾达各抓一个
            - vocabulary:
                id: handle
                text: 把手
            - text: 。托盘不歪了。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 欧伦放下托盘。艾达喊：“杯子没倒！”
