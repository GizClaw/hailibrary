      - "p06"
"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "欧伦做了一个红托盘。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "content":
            - "text": "托盘只有一个"
            - "vocabulary":
                "id": "handle"
                "text": "把手"
            - "text": "。"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "他放上三个空"
            - "vocabulary":
                "id": "cup"
                "text": "杯子"
            - "text": "。"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "欧伦一转弯，托盘就歪了。欧伦接住杯子。"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "艾达说：“一转弯，它就会歪。”"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "content":
            - "text": "他们加上第二个"
            - "vocabulary":
                "id": "handle"
                "text": "把手"
            - "text": "。"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "content":
            - "text": "欧伦和艾达各抓一个"
            - "vocabulary":
                "id": "handle"
                "text": "把手"
            - "text": "。托盘不歪了。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "欧伦放下托盘。艾达喊：“杯子没倒！”"
