schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 小桥先别过
summary: 小雨发现一块桥板松了，便停在岸边。伯伯从对岸帮忙，把桥板压平并检查小桥，再让小雨过桥。
chapters:
  - id: ch01
    title: 松动的桥板
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 伯伯来帮忙
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 什么松了？
    answer: 一块桥板。
    page_refs:
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 小雨先做了什么？
    answer: 停在桥边。
    page_refs:
      - p02
      - p03
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: 谁检查了小桥？
    choices:
      - 伯伯
      - 小雨
    answer: 伯伯。
    page_refs:
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小雨走向菜园。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 一块
            - vocabulary:
                id: bridge
                text: 桥
            - text: 板松了。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 小雨停在
            - vocabulary:
                id: bridge
                text: 桥
            - text: 边，喊道：“伯伯！”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 伯伯从对岸来，说：“先别动。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 小雨把长树枝推给伯伯。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 伯伯站在岸边，把桥板压平。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 伯伯检查小
            - vocabulary:
                id: bridge
                text: 桥
            - text: ，说：“可以过了。”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 小雨过了桥。他们一起去菜园。
