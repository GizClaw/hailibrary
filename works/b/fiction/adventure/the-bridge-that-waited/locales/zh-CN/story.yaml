schema_version: 1
language: zh-CN
writer: 北辰
title: 小桥先别过
summary: 桥上翘起了一块木板。小雨和对岸的伯伯隔着小溪检查后，决定先绕路，再请人来修桥。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 亲切平稳, timbre: 温暖的成年声音, pace: 中慢速, pitch: 中音}}
  yu: {display_name: 小雨, tts: {delivery: 认真活泼, timbre: 清脆的童声, pace: 中速, pitch: 中高音}}
  bo: {display_name: 伯伯, tts: {delivery: 耐心带笑, timbre: 温厚的年长声音, pace: 慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 小雨要去河对面的菜园。}]}
  - {id: p02, illustration: p02, lines: [{speaker: yu, text: 小桥有块木板翘起来了。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 她没往前走，站在岸边想办法。}]}
  - {id: p04, illustration: p04, lines: [{speaker: bo, text: 别上桥！}, {speaker: bo, text: 咱们站在岸边，用长树枝试试。}]}
  - {id: p05, illustration: p05, lines: [{speaker: yu, text: 我把这根长树枝递过去。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 伯伯从岸边轻轻一压。}, {speaker: narrator, text: 木板又翘了起来。}]}
  - {id: p07, illustration: p07, lines: [{speaker: yu, content: [{text: 还会晃，今天先别过}, {vocabulary: {id: bridge, text: 桥}}, {text: 。}]}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 两个人沿岸边绕到菜园。}, {speaker: narrator, text: 他们又请人来修桥。}]}
chapters:
  - {id: ch01, title: 小桥前, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 先绕路, page_refs: [p05, p06, p07, p08]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 小桥怎么了？, answer: 一块木板翘起来了。, page_refs: [p02]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 发现木板翘起来后，小雨先做了什么？, answer: 她没有上桥，先站在岸边想办法。, page_refs: [p03]}
  - {id: q03, type: explicit-choice, speaker: narrator, prompt: 发现木板还会晃以后，他们怎么办？, answer: 先绕路，再请人来修桥。, page_refs: [p06, p07, p08]}
