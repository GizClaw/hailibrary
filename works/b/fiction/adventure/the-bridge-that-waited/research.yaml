schema_version: 1
required: true
reason: The story explicitly models how characters respond to a visibly damaged footbridge.
sources:
  - id: hull-damaged-bridge
    title: Bridges and structures
    publisher: Hull City Council
    url: https://www.hull.gov.uk/roads-pavements/bridges-structures/3
    supports:
      - Damage to a bridge should be reported for assessment and repair.
  - id: barnsley-report-bridge
    title: Report a damaged bridge
    publisher: Barnsley Metropolitan Borough Council
    url: https://www.barnsley.gov.uk/services/roads-travel-and-parking/roadworks-and-road-maintenance/report-a-damaged-bridge/
    supports:
      - The council is responsible for inspection, maintenance, and repair, and asks the public to report bridge damage for inspection.
notes:
  - Yu and Bo do not test, enter, or repair the damaged bridge.
  - They place a simple rope barrier on existing posts before the entrance, use an established bank path, notify workers, and wait behind the barrier while the workers repair it.
  - The low-risk rope action belongs to this fictional village scene; it is not general advice to approach or manage a damaged public bridge.
  - The village and characters are fictional; the work is not a technical bridge-inspection guide.
