schema_version: 1
required: true
reason: The plot includes a safety-relevant choice not to stand in front of a rolling heavy object.
sources:
  - url: https://www.osha.gov/maritime/longshoring/section3/summary8
    title: Section III Material Handling Accidents - Summary No. 8 - Improperly Secured Load
    publisher: Occupational Safety and Health Administration
    supports: An unstable round load can create a struck-by hazard; personnel should work in a safe location away from its potential path, and likely-to-roll cargo should be secured or blocked before exposure.
notes:
  - This industrial source is used only for the ordinary stay-out-of-the-path principle; it is not child-specific or pumpkin-specific guidance.
  - The characters do not chase, intercept, touch, or place a barrier in front of the moving pumpkin. The rectangular hay bale is already at the empty foot of the fictional farm slope.
  - The characters keep their distance after the pumpkin stops and wait for an adult to move it.
