schema_version: 1
language: zh-CN
writer: 栗叶灯
title: 南瓜滚下坡
summary: 一个大南瓜滚下山坡。浣熊和山羊站在小路边，把软软的干草捆推到坡下，安全地挡住南瓜。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 明快直接, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  raccoon: {display_name: 浣熊, tts: {delivery: 机灵果断, timbre: 明亮的童声, pace: 中快, pitch: 中高音}}
  goat: {display_name: 山羊, tts: {delivery: 可靠爽朗, timbre: 厚实的童声, pace: 中速, pitch: 中低音}}
pages:
