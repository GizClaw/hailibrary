        content: [{text: 大}, {vocabulary: {id: pumpkin, text: 南瓜}}, {text: 滑下小车。}]
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 它顺着山坡滚下去。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 浣熊躲到小路边。}]}
  - {id: p04, illustration: p04, lines: [{speaker: goat, text: 那个干草捆能帮忙！}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 两个朋友一起推。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 干草捆挡住小路。}]}
