schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 南瓜滚下坡
summary: 一个大南瓜滚下山坡。浣熊和山羊站在小路边，把软软的干草捆推到坡下，安全地挡住南瓜。
chapters:
  - id: ch01
    title: 滚下山坡
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 软软地停下
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 什么滚下山坡？
    answer: 南瓜。
    page_refs:
      - p01
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 两个朋友先推什么？
    answer: 干草捆。
    page_refs:
      - p04
      - p05
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: 南瓜在哪里停下？
    choices:
      - 干草捆前
      - 小车上
    answer: 干草捆前。
    page_refs:
      - p06
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 大
            - vocabulary:
                id: pumpkin
                text: 南瓜
            - text: 滑下小车。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 它顺着空空的小路滚下去。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 浣熊喊：“快站到路边！”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 山羊指着草捆：“用那个！”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 他们从路边把草捆推过去。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 草捆挡住了空路。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - vocabulary:
                id: pumpkin
                text: 南瓜
            - text: 撞上软草，停了下来。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 两个朋友站在路边欢呼。
