schema_version: 2
language: en-US
writer: sage-paw
title: The Runaway Pumpkin
summary: A pumpkin rolls down a hill. Raccoon and Goat stay to the side and use a soft hay bale to stop it.
chapters:
  - id: ch01
    title: Rolling Away
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: A Soft Stop
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What rolls down the hill?
    answer: A pumpkin.
    page_refs:
      - p01
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What do the friends move first?
    answer: The hay bale.
    page_refs:
      - p04
      - p05
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: Where do the friends stand?
    choices:
      - Beside the path
      - Before the pumpkin
    answer: Beside the path.
    page_refs:
      - p03
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "A big "
            - vocabulary:
                id: pumpkin
                text: pumpkin
            - text: " slips from the cart."
    - id: p02
      illustration: p02
      paragraphs:
        - text: It rolls down the clear path.
    - id: p03
      illustration: p03
      paragraphs:
        - text: “Stay to the side!” Raccoon calls.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Goat points. “The hay bale!”
    - id: p05
      illustration: p05
      paragraphs:
        - text: They push the bale from the side.
    - id: p06
      illustration: p06
      paragraphs:
        - text: It blocks the empty path.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "The "
            - vocabulary:
                id: pumpkin
                text: pumpkin
            - text: " bumps the soft bale. It stops."
    - id: p08
      illustration: p08
      paragraphs:
        - text: The friends cheer from the side.
