  raccoon: {display_name: Raccoon, tts: {delivery: quick and inventive, timbre: bright youthful voice, pace: medium, pitch: medium-high}}
  goat: {display_name: Goat, tts: {delivery: strong and friendly, timbre: clear youthful voice, pace: medium, pitch: medium}}
pages:
