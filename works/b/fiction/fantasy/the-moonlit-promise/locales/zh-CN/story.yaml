"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "蝙蝠把月光果交给猫头鹰。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "content":
            - "text": "猫头鹰"
            - "vocabulary":
                "id": "promise"
                "text": "承诺"
            - "text": "：“我会看好它们。”"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "text": "老鼠在黑黑的洞口发抖。"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "老鼠问：“能给我一颗吗？”"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "猫头鹰没有拿果子。它先去问蝙蝠。"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "蝙蝠点头：“好，分一颗吧。”"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "他们送给老鼠一颗果子。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "果子照亮了老鼠的家。"
