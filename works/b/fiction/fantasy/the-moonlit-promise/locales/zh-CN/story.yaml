    "type": "picture"
    "prompt": "蝙蝠交给猫头鹰什么？"
    "answer": "月光果。"
    "page_refs":
      - "p01"
  - "id": "q02"
    "type": "sequence"
    "prompt": "分享果子前，猫头鹰先做什么？"
    "answer": "先去问蝙蝠。"
    "page_refs":
      - "p05"
      - "p06"
