schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 月光下的承诺
summary: 猫头鹰答应替蝙蝠看好月光果。老鼠需要一盏灯，猫头鹰先去问蝙蝠，再和大家分享一颗果子。
chapters:
  - id: ch01
    title: 一个承诺
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 分享一颗果子
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 蝙蝠交给猫头鹰什么？
    answer: 月光果。
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 分享果子前，猫头鹰先做什么？
    answer: 先去问蝙蝠。
    page_refs:
      - p05
      - p06
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: 什么照亮了老鼠的家？
    choices:
      - 一颗果子
      - 红围巾
    answer: 一颗果子。
    page_refs:
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 蝙蝠把月光果交给猫头鹰。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 猫头鹰
            - vocabulary:
                id: promise
                text: 承诺
            - text: ：“我会看好它们。”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 老鼠在黑黑的洞口发抖。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 老鼠问：“能给我一颗吗？”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 猫头鹰没拿果子。先去问蝙蝠。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 蝙蝠点头：“好，分一颗吧。”
    - id: p07
      illustration: p07
      paragraphs:
        - text: 他们送给老鼠一颗果子。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 果子照亮了老鼠的家。
