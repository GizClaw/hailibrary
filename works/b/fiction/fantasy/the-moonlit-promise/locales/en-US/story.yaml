schema_version: 2
language: en-US
writer: sage-paw
title: The Moonlit Promise
summary: Owl promises to guard Bat's moon berries. When Mouse needs light, Owl asks Bat before sharing one berry.
chapters:
  - id: ch01
    title: A Promise
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: One Shared Berry
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What does Bat give Owl?
    answer: The moon berries.
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Owl do before sharing?
    answer: Owl asks Bat.
    page_refs:
      - p05
      - p06
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: What lights Mouse's home?
    choices:
      - One berry
      - A red scarf
    answer: One berry.
    page_refs:
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Bat gives the moon berries to Owl.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "“I "
            - vocabulary:
                id: promise
                text: promise
            - text: " to guard them,” Owl says."
    - id: p03
      illustration: p03
      paragraphs:
        - text: Mouse shivers near a dark home.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Mouse asks, “May I have one?”
    - id: p05
      illustration: p05
      paragraphs:
        - text: Owl leaves the basket there. “I must ask Bat.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: Bat nods. “Yes, share one.”
    - id: p07
      illustration: p07
      paragraphs:
        - text: They carry one berry to Mouse.
    - id: p08
      illustration: p08
      paragraphs:
        - text: The berry lights Mouse's home.
