schema_version: 3
language: zh-CN
writer: 松果先生
title: 榛榛找到小橡树
summary: 榛榛在冬天找回一些橡果。春天，一颗没找到的橡果长成小橡树。
chapters:
  - id: ch01
    title: 冬天
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 长出来的
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: sequence
    prompt: 什么事先发生？
    answer: 雪先盖住食物。
    page_refs:
      - p01
      - p02
  - id: q02
    type: picture
    prompt: 最后有什么变化？
    answer: 小橡树站在阳光里。
    page_refs:
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 雪盖住榛榛藏的食物。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她在石头边找到一颗。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 她在倒木边找到一颗。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 有一个小坑空了。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 榛榛和黑羽分一颗。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 春天把白雪融化了。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 一根绿芽钻出泥土。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 橡果壳已经裂开了。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 榛榛拖走一根断枝。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 小橡树站在阳光里。
