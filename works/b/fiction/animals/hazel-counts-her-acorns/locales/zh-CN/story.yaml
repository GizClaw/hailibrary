schema_version: 3
language: zh-CN
writer: 松果先生
title: 榛榛数橡果
summary: 榛榛一边藏橡果一边数。雨弄乱记号后，她改看树根和石头。
chapters:
  - id: ch01
    title: 计划
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 变化
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: sequence
    prompt: 做树枝记号前，榛榛把橡果藏在哪里？
    answer: 她把橡果藏在石头和倒木边。
    page_refs:
      - p02
      - p03
      - p05
  - id: q02
    type: picture
    prompt: 什么帮榛榛找到藏着的橡果？
    answer: 一条大树根帮她找到了橡果。
    page_refs:
      - p08
      - p09
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 橡果落下，榛榛接住。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她在石头边藏一颗。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 她在倒木边藏一颗。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 榛榛每颗都要数。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 她用小树枝做记号。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 大雨冲乱了树枝。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 榛榛数不清记号了。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 她看见一条大树根。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 她在那里找到橡果。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 榛榛认真看，不再数。
