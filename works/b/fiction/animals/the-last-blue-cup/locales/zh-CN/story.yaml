  otter: {display_name: 小棕, tts: {delivery: 轻快坦率, timbre: 明亮友好的声音, pace: 中速, pitch: 中高音}}
  badger: {display_name: 阿灰, tts: {delivery: 平静安慰, timbre: 低沉柔和的声音, pace: 中慢速, pitch: 低音}}
