schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 两只茶杯
summary: 小棕只有一只蓝杯子。阿灰找到一只落灰的红杯子。两个朋友洗干净红杯子，一起喝茶。
chapters:
  - id: ch01
    title: 找杯子
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 两只干净的杯子
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 桌上先有什么？
    answer: 一只蓝杯子。
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 找到红杯子后做什么？
    answer: 把红杯子洗干净。
    page_refs:
      - p04
      - p05
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: 最后有几只干净的杯子？
    choices:
      - 两只
      - 一只
    answer: 两只。
    page_refs:
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 小棕放下一只蓝
            - vocabulary:
                id: cup
                text: 杯子
            - text: 。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 阿灰走进来，说：“我带茶来啦！”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 小棕找了找，没有别的杯子。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 阿灰喊：“这里有只红
            - vocabulary:
                id: cup
                text: 杯子
            - text: ！”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 他们把红杯子洗净擦干。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 两只干净的
            - vocabulary:
                id: cup
                text: 杯子
            - text: 摆在桌上。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 小棕问：“蓝的还是红的？”阿灰选了红的。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 两个朋友一起喝茶。
