title: 那只蓝杯子
summary: 桌上只有一只蓝杯子。水獭和獾又找出一只旧杯子，还想出了轮流用蓝杯子的办法。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 温暖直接, timbre: 清晰的成年声音, pace: 慢速, pitch: 中音}}
  otter: {display_name: 水獭, tts: {delivery: 轻快坦率, timbre: 明亮友好的声音, pace: 中速, pitch: 中高音}}
  badger: {display_name: 獾, tts: {delivery: 平静安慰, timbre: 低沉柔和的声音, pace: 中慢速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, content: [{text: 桌上只有一只蓝}, {vocabulary: {id: cup, text: 杯子}}, {text: 。}]}]}
  - {id: p02, illustration: p02, lines: [{speaker: badger, text: 茶来啦！}, {speaker: otter, text: 可蓝杯子只有一只。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 水獭翻遍了柜子。}, {speaker: otter, text: 再没有别的蓝杯子了。}]}
  - {id: p04, illustration: p04, lines: [{speaker: badger, text: 碗后面还有一只旧杯子！}, {speaker: otter, text: 它好脏呀。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 水獭把旧杯子洗干净。}]}
  - {id: p06, illustration: p06, lines: [{speaker: badger, text: 现在有两只干净的杯子了。}]}
  - {id: p07, illustration: p07, lines: [{speaker: otter, text: 喝完这一杯，咱们再换着用。}, {speaker: badger, text: 好主意！}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 两个朋友一起喝茶。}]}
