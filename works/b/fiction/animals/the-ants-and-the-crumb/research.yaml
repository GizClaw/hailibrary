schema_version: 1
required: true
reason: The fictional story uses the real behavior of some ant species cooperatively transporting food that one ant cannot move alone.
sources:
  - id: cockerelli-cooperative-transport
    title: Scaling of speed with group size in cooperative transport by the ant Novomessor cockerelli
    publisher: PLOS ONE
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6177163/
    supports:
      - Many ant species form cooperative groups to transport items too large for a single ant.
      - Novomessor cockerelli transport groups pull loads toward their nest.
  - id: longhorn-crazy-ant-transport
    title: Ant groups optimally amplify the effect of transiently informed individuals
    publisher: Nature Communications
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4525283/
    supports:
      - A team of Paratrechina longicornis ants retrieved a food item about 350 times the mass of one ant.
      - After recruitment, groups transported ring-shaped food items along nest-bound paths.
notes:
  - The named ants, exact bread find, and step-by-step arrival order are invented for this original story.
  - The story does not claim that every ant species transports food in groups or that adding ants always increases speed.
