schema_version: 1
style: woodblock-print
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Pip and Dot lead four more small worker ants as the group pulls one oversized golden bread crumb toward a dark nest opening beneath a forest-green leaf; the crumb is moving and all ants work in the same direction.
  - id: p01
    file: artwork/p01.webp
    scene: Pip, the rust-red ant in a mustard neckerchief, finds one oversized golden bread crumb on a cream woodland path; the nest opening is visible far to the left.
  - id: p02
    file: artwork/p02.webp
    scene: Pip alone braces six legs and pulls the near edge of the oversized bread crumb toward the nest at left; the crumb stays exactly beside the same small pebble.
  - id: p03
    file: artwork/p03.webp
    scene: Pip calls toward Dot, the indigo ant in a forest-green neckerchief, who comes along the woodland path; the large bread crumb remains beside the pebble.
  - id: p04
    file: artwork/p04.webp
    scene: Pip and Dot pull together toward the nest at left, but the bread crumb still rests beside the same pebble.
  - id: p05
    file: artwork/p05.webp
    scene: Dot calls toward three small worker ants arriving from under forest-green leaves while Pip waits by the unmoved bread crumb.
  - id: p06
    file: artwork/p06.webp
    scene: Pip, Dot, and one newly arrived worker ant pull together toward the nest, but the bread crumb still touches the same pebble as more ants approach.
  - id: p07
    file: artwork/p07.webp
    scene: Pip, Dot, and four more ants pull together; the bread crumb is now clearly left of the pebble and close to the nest.
  - id: p08
    file: artwork/p08.webp
    scene: The full ant group pulls the bread crumb into the dark nest opening beneath the forest-green leaf; Pip and Dot remain identifiable by body color and neckerchiefs.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
