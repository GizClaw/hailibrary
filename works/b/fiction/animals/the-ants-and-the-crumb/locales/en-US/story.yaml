schema_version: 2
language: en-US
writer: sage-paw
title: The Ants Move the Bread
summary: Pip cannot move the bread. Dot and more ants help Pip. Then the ants take the bread home.
chapters:
  - id: ch01
    title: The Bread Does Not Move
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: More Ants Come
    page_refs: [p05, p06, p07, p08]
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What does Pip find?
    answer: A piece of bread.
    page_refs: [p01]
  - id: q02
    type: sequence
    speaker: narrator
    prompt: Who comes after Pip calls?
    answer: Dot the ant.
    page_refs: [p03]
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: What happens when all the ants pull?
    choices: [The bread moves, The bread stays still]
    answer: The bread moves.
    page_refs: [p07]
