    pip:
      display_name: 点点
      tts: {delivery: 热心、明亮、说话直接, timbre: 清亮的幼小声音, pace: 中快速, pitch: 高音}
    dot:
      display_name: 圆圆
      tts: {delivery: 热心而稳当, timbre: 圆润的幼小声音, pace: 中速, pitch: 中高音}
