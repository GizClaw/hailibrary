schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 晒暖的小石头
summary: 雨后，小红找到一块晒暖的石头。石头太小，坐不下两个朋友。小红和小青便一起暖脚。
chapters:
  - id: ch01
    title: 暖石头
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 一起暖脚
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 小红找到了什么？
    answer: 一块暖石头。
    page_refs:
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 小青问过以后，小红做什么？
    answer: 小红坐到石头旁边。
    page_refs:
      - p04
      - p06
      - p07
  - id: q03
    type: explicit-choice
    speaker: narrator
    prompt: 两个朋友一起暖什么？
    choices:
      - 脚
      - 帽子
    answer: 脚。
    page_refs:
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 雨停了，太阳出来了。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 小红找到一块暖
            - vocabulary:
                id: stone
                text: 石头
            - text: 。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 小红坐下，小青走过来。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 小青问：“我能坐这儿吗？”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 这块
            - vocabulary:
                id: stone
                text: 石头
            - text: 坐不下两个朋友。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 小红说：“把脚放这儿吧。”
    - id: p07
      illustration: p07
      paragraphs:
        - text: 小红坐到石头旁边。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 两个朋友一起暖脚。
