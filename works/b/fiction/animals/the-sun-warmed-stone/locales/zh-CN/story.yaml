  fox: {display_name: 小红, tts: {delivery: 轻快爽朗, timbre: 明亮的童声, pace: 中速, pitch: 中高音}}
  lizard: {display_name: 小青, tts: {delivery: 温和坦率, timbre: 细柔的童声, pace: 中慢速, pitch: 中音}}
