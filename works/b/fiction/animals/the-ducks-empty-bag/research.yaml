schema_version: 1
required: true
reason: The fictional picnic explicitly teaches learners to collect food remains and napkins and carry them out of a meadow in a reusable bag.
sources:
  - id: nps-pack-out-trash
    title: Backcountry Food Storage
    publisher: U.S. National Park Service
    url: https://www.nps.gov/grca/planyourvisit/bc-food-storage.htm
    supports:
      - Inspect an eating area, clean up food crumbs and trash, and pack out all trash including leftover food.
  - id: epa-waste-free-lunch
    title: Waste-Free Lunch Activity Book
    publisher: U.S. Environmental Protection Agency
    url: https://www.epa.gov/system/files/documents/2026-06/wastefreelunch_june2026_0.pdf
    supports:
      - Reusable lunch boxes or cloth bags can carry food, and park visitors should take back everything they bring so the place remains free of litter.
notes:
  - The meadow and animal characters are fictional; the story presents only the simple pack-out behavior, not sorting, recycling, composting, or wildlife-feeding guidance.
  - The characters collect the windblown peels and napkins and leave the meadow visibly clean.
