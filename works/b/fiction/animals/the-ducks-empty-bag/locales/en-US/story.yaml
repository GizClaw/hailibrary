  mole: {display_name: Mole, tts: {delivery: quick and doubtful, timbre: soft earthy voice, pace: medium, pitch: medium-low}}
  rabbit: {display_name: Rabbit, tts: {delivery: gentle and lively, timbre: airy young voice, pace: medium, pitch: high}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Three friends planned a picnic."}]}
