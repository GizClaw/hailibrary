  - {id: p07, illustration: p07, lines: [{speaker: pip, text: "My empty bag is ready!"}, {speaker: narrator, text: "They gathered every scrap."}]}
  - {id: p08, illustration: p08, lines: [{speaker: mole, text: "Your empty bag is full now."}, {speaker: mole, text: "Good thinking!"}]}
