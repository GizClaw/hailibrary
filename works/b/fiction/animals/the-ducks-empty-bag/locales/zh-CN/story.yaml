schema_version: 1
language: zh-CN
writer: 江笑
title: 小鸭的空袋子
summary: 皮皮带着一个空袋子去野餐，风一来，大家才明白它有什么用。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 简洁友好, timbre: 清晰的成年声音, pace: 中慢速, pitch: 中音}}
  pip: {display_name: 皮皮, tts: {delivery: 快活稳当, timbre: 轻快的少年声音, pace: 中速, pitch: 中高音}}
  mole: {display_name: 鼹鼠, tts: {delivery: 快言快语, timbre: 柔厚的声音, pace: 中速, pitch: 中低音}}
  rabbit: {display_name: 兔子, tts: {delivery: 温和活泼, timbre: 轻柔的少年声音, pace: 中速, pitch: 高音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 三个朋友要去野餐。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 鼹鼠带面包，兔子带水果。}, {speaker: narrator, text: 皮皮只带了一个空袋子。}]}
  - {id: p03, illustration: p03, lines: [{speaker: mole, text: 你的袋子是空的！}]}
  - {id: p04, illustration: p04, lines: [{speaker: pip, text: 别急，它还没轮到上场呢。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 大家边吃边笑。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 风突然一吹，果皮和纸巾满地跑。}]}
  - {id: p07, illustration: p07, lines: [{speaker: pip, text: 这下轮到空袋子啦！}, {speaker: narrator, text: 大家把果皮和纸巾一一捡回来。}]}
  - {id: p08, illustration: p08, lines: [{speaker: mole, text: 空着来，装满回去。你想得真周到！}]}
chapters:
  - {id: ch01, title: 空袋子, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 终于派上用场, page_refs: [p05, p06, p07, p08]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 皮皮带了什么？, answer: 一个蓝袋子。, page_refs: [p02]}
  - {id: q02, type: explicit-choice, speaker: narrator, prompt: 最后，袋子里装了什么？, choices: [果皮和纸巾, 池水, 花], answer: 果皮和纸巾。, page_refs: [p07]}
  - {id: q03, type: sequence, speaker: narrator, prompt: 大家捡东西以前发生了什么？, answer: 风把东西吹跑了。, page_refs: [p06, p07]}
