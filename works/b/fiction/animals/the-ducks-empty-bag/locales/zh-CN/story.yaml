schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 小鸭的空袋子
summary: 皮皮带着空袋子去野餐。风把垃圾吹开后，三个朋友把垃圾捡进袋子，草地又干净了。
chapters:
  - id: ch01
    title: 空袋子
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 干净的草地
    page_refs:
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 皮皮带了什么？
    answer: 蓝袋子。
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 最后袋子里有什么？
    choices:
      - 垃圾
      - 池水
    answer: 垃圾。
    page_refs:
      - p06
      - p07
      - p08
  - id: q03
    type: sequence
    speaker: narrator
    prompt: 大家捡垃圾前发生了什么？
    answer: 风把垃圾吹跑了。
    page_refs:
      - p06
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 三个朋友去野餐。皮皮带着蓝
            - vocabulary:
                id: bag
                text: 袋子
            - text: 。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 小墨带面包，小白带苹果。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 小墨问：“空
            - vocabulary:
                id: bag
                text: 袋子
            - text: ？”皮皮说：“一会儿有用。”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 皮皮把空
            - vocabulary:
                id: bag
                text: 袋子
            - text: 收在翅膀下。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 三个朋友边吃边笑。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 风吹跑了果皮和纸巾。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 大家捡起每片垃圾。皮皮张开袋子。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 袋子装满了。草地又干净了。
