"questions":
  - "id": "q01"
    "type": "sequence"
    "prompt": "叶子放进水里后，接着放什么？"
    "answer": "石头。"
    "page_refs":
      - "p02"
      - "p03"
      - "p04"
  - "id": "q02"
    "type": "explicit-choice"
    "prompt": "什么和叶子一起浮在水上？"
    "answer": "小船。"
    "page_refs":
      - "p08"
"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "妈妈陪小米玩水。盆里装着水。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "小米把叶子放进水里。"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "叶子"
            - "vocabulary":
                "id": "float"
                "text": "浮"
            - "text": "在水面上。"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "content":
            - "text": "小米把"
            - "vocabulary":
                "id": "stone"
                "text": "石头"
            - "text": "放进水里。"
            - "vocabulary":
                "id": "stone"
                "text": "石头"
            - "text": "落到了盆底。"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "小米把玩具船放进水里。"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "content":
            - "text": "小船也"
            - "vocabulary":
                "id": "float"
                "text": "浮"
            - "text": "在水面上。"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "小米把钥匙放进水里。钥匙落到盆底。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "content":
            - "text": "叶子和小船还"
            - "vocabulary":
                "id": "float"
                "text": "浮"
            - "text": "在水上。"
