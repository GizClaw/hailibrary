schema_version: 1
style: clay-diorama
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: Wooden tabletop, cream wall, blurred felt plant; shallow transparent
    rounded rectangular tub with teal rim.
  characters: Same mother and child throughout; identities in book.yaml.
  props: One green oval leaf, one rounded dense gray stone, one watertight red toy
    boat with cream hollow interior and no mast, one plain brass key with round
    bow. Objects accumulate in test order.
  safety: Mother within arm’s reach; no immersion, climbing or mouthing objects.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mia and Mom observe leaf and boat still at surface, stone and key on
      bottom.
  - id: p01
    file: artwork/p01.webp
    scene: Mia and Mom finish pouring water from a cream jug into the shallow tub;
      four objects wait on the table.
  - id: p02
    file: artwork/p02.webp
    scene: Mia places the green oval leaf on water; stone, boat and key wait on the
      dry table.
  - id: p03
    file: artwork/p03.webp
    scene: Released leaf rests on the water surface while both watch; other objects
      wait on table.
  - id: p04
    file: artwork/p04.webp
    scene: Newly released gray stone reaches the bottom while leaf stays on surface;
      boat and key wait on table.
  - id: p05
    file: artwork/p05.webp
    scene: Mia places the red hollow toy boat upright on water; leaf afloat, stone
      on bottom, key on table.
  - id: p06
    file: artwork/p06.webp
    scene: Released empty boat and leaf float at surface; stone on bottom, key on
      table.
  - id: p07
    file: artwork/p07.webp
    scene: Newly released brass key lies on bottom beside stone; leaf and boat at
      surface.
  - id: p08
    file: artwork/p08.webp
    scene: Mia and Mom observe leaf and boat still at surface, stone and key on
      bottom.
generation:
  workflow: Codex built-in image generation; cwebp compression
  text_in_image_requested: false
