schema_version: 2
language: zh-CN
writer: 江笑
title: 变化河流的档案
summary: 档案员文帮助渡口建造者玛拉比较旧地图、现场证据和索拉的记忆。一道新砾石洲及后来洪水造成的变化说明固定桥梁仍需研究，于是社区先改善渡船通行，同时请独立专家调查长期方案。
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 档案员文带着防水资料夹来到一处宽阔河湾。
            - text: 河水绕过几道砾石洲分开流动，又在下游重新汇合。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 负责设计渡口的玛拉指向对岸的诊所和学校。玛拉说：“
            - text: 这里需要可靠的通道，尤其是渡船队伍不断变长的时候。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 一艘小渡船停靠码头，乘客已经排起长队。
            - text: 风、高水位和装载时间都会拖慢每一趟往返。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 玛拉把固定桥模型放在目前的主流上。玛拉说：“
            - text: 固定桥能让两岸居民每天少绕很多路。”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 文打开三张不同年代、只画河流形状的旧地图。文说：“
            - text: 这三张图上的河道不一样。桥不能只按今天的河形来定。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 地图叠在一起时，最深的弯道并不重合。
            - text: 旧图上的一处大河弯，在另一张图里已经成了干燥草地。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 退休船工索拉点着一处旧河湾，又指向草地。索拉说：“
            - text: 我年轻时，船就在如今牛群吃草的地方转弯。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 文走进草地，在露出的土中找到许多磨圆的石头。文说：“
            - text: 石头跟索拉的记忆对得上，不过它们说不出具体哪一年、河有多深。”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 玛拉蹲在新形成的砾石洲旁。
            - text: 河水被它分成一宽一窄两股。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 浑浊支流水把泥沙带进较清的主
            - vocabulary:
                id: channel
                text: 河道
            - text: 。文说：“
            - text: 水会从一边带走泥沙，又在另一边把泥沙放下。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 文把当前水流、砾石洲、草地石头和旧地图放在一起比较。文说：“
            - text: 我们能看出河道一直在变，但还不知道下一次会在哪里变。”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 玛拉从现状图上拿走固定桥模型。玛拉说：“
            - text: 桥未必不能建，只是第一个选址的依据还不够。”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 索拉在湿沙中画出自己记得的河弯。索拉说：“
            - text: 我记得船从这里转弯。至于是哪一年，我可不敢保证。”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 文分别摆下记忆石子、档案地图和现场样本。文说：“
            - text: 把记忆、旧图和石头分开记录。它们能互相印证，记录时却不能混在一起。”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 上游大雨后，一股颜色更深的水进入河湾。
            - text: 大家只在高处观察，没有靠近速度加快的水流。
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 高水退去，砾石洲的形状已经改变。玛拉说：“
            - text: 原来的桥线，现在正好跨过新的分流口。”
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: 文和玛拉用无字木桩标出新的边缘。
            - text: 他们把新标记跟前几次观察放在一起，记录里终于有了河道改变的过程。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 居民比较固定桥、可移动浮动码头和现有渡船。
            - text: 几个方案的载客量、灵活性、费用和调查要求各不相同。
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: 有人问，临时码头是不是说明不用再考虑桥。玛拉说：“
            - text: 不是。码头先改善通行，专家还要继续勘察两岸。”
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: 渡口增加一艘小船和两个可调节的浮动码头。
            - text: 队伍缩短了，水位变化时工人也能移动码头连接处。
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: 文保存旧地图副本、新河形、石头和照片。文说：“
            - text: 旧图、新河形和照片都留好。以后的人得知道我们今天看过什么。”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: 索拉用简单设备记录口述历史，一位年轻居民在旁听。索拉说：“
            - text: 把我的话也记下，不过别只信我，去跟地图和河道比一比。”
    - id: p23
      illustration: p23
      paragraphs:
        - content:
            - text: 玛拉和独立勘察专家检查两岸，渡船继续正常运行。
            - text: 地质、水流变化、通行需求和后期维护都会影响未来决定。
    - id: p24
      illustration: p24
      paragraphs:
        - content:
            - text: 文离开时，可调整的渡口正在开阔天空下服务两岸。玛拉说：“
            - text: 渡船先跑着，勘察也继续。等下一轮资料齐了，我们再谈桥位。”
