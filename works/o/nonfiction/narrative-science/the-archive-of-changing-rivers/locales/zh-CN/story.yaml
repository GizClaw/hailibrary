questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据支持河流位置发生过变化？
    answer: 互不重合的旧地图、索拉的记忆、草地圆石和现在的砾石洲都说明河流会随时间改变。
    page_refs:
      - p05
      - p06
      - p07
      - p08
      - p09
  - id: q02
    type: compare
    speaker: narrator
    prompt: 索拉的记忆、档案地图和现场样本分别有什么作用？
    answer: 记忆保存亲历，地图保存旧形状，现场样本检验物理痕迹，而每一种也都有局限。
    page_refs:
      - p07
      - p08
      - p13
      - p14
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 玛拉为什么拿走第一个桥模型？
    answer: 多份记录显示河道会移动，新砾石洲也说明原桥线只依据一个不完整时刻。
    page_refs:
      - p06
      - p09
      - p10
      - p11
      - p12
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: 为什么可调码头是合理的近期方案？
    answer: 它能减少当前排队并适应水位变化，同时让独立研究继续，而且没有假装桥梁问题已经解决。
    page_refs:
      - p18
      - p19
      - p20
      - p23
  - id: q05
    type: character-motive
    speaker: narrator
    prompt: 文为什么同时保存结论和不同证据来源？
    answer: 她希望未来决策者能检查证据、局限和解释随时间发生的变化。
    page_refs:
      - p14
      - p17
      - p21
      - p22
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: 河流研究和渡口决定共同说明了什么？
    answer: 面对变化的环境，负责任的决定要综合来源、承认不确定性、改善当下，并继续检验长期方案。
    page_refs:
      - p05
      - p11
      - p12
      - p17
      - p19
      - p21
      - p23
      - p24
