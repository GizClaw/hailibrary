schema_version: 1
language: zh-CN
writer: 江笑
title: 变化河流的档案
summary: 档案员文帮助渡口建造者玛拉比较旧地图、现场证据和索拉的记忆。一道新砾石洲及后来洪水造成的变化说明固定桥梁仍需研究，于是社区先改善渡船通行，同时请独立专家调查长期方案。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 准确而沉静, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  wen: {display_name: 文, tts: {delivery: 严谨而谦逊, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  mara: {display_name: 玛拉, tts: {delivery: 果断而务实, timbre: 有力的成年声音, pace: 中速, pitch: 中低音}}
  sola: {display_name: 索拉, tts: {delivery: 耐心并带一点幽默, timbre: 温暖的年长声音, pace: 中慢, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "田野档案员文带着防水资料夹来到一处宽阔河湾。"}, {speaker: narrator, text: "河水绕过几道砾石洲分开流动，又在下游重新汇合。"}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "渡口建造者玛拉指向对岸的诊所和学校。"}, {speaker: mara, text: "这里需要可靠的通道，尤其是渡船队伍不断变长的时候。"}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "一艘小渡船停靠码头，乘客已经排起长队。"}, {speaker: narrator, text: "风、高水位和装载时间都会拖慢每一趟往返。"}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "玛拉把固定桥模型放在目前的主流上。"}, {speaker: mara, text: "一座直接跨河的桥，可以缩短两岸居民每天的路。"}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "文打开三张不同年代、只画河流形状的旧地图。"}, {speaker: wen, text: "把建筑固定在一个位置以前，要先问这个位置能保持多久。"}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "地图叠在一起时，最深的弯道并不重合。"}, {speaker: narrator, text: "一张图上的河湾，在另一张图上穿过已经干燥的陆地。"}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "退休船工索拉点着一处旧河湾，又指向草地。"}, {speaker: sola, text: "我年轻时，船就在如今牛群吃草的地方转弯。"}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "文走进草地，在露出的土中找到许多磨圆的石头。"}, {speaker: wen, text: "石头支持索拉的记忆，却不能告诉我们准确年代和水深。"}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "玛拉检查一道刚形成不久、正在分开水流的砾石洲。"}, {speaker: narrator, text: "河水从它两边沿着宽窄不同的路径通过。"}]}
  - id: p10
    illustration: p10
    lines:
      - speaker: narrator
        content: [{text: "浑浊支流水把泥沙带进较清的主"}, {vocabulary: {id: channel, text: 河道}}, {text: "。"}]
      - {speaker: wen, text: "水流会在一些地方侵蚀材料，又在另一些地方沉积材料。"}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "文把当前水流、砾石洲、草地石头和旧地图放在一起比较。"}, {speaker: wen, text: "它们共同证明河流会动，却不能准确预告下一次变化发生在哪里。"}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "玛拉从现状图上拿走固定桥模型。"}, {speaker: mara, text: "桥仍可能建成，但第一个选址建立在一幅不完整的画面上。"}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "索拉在湿沙中画出自己记得的河弯。"}, {speaker: sola, text: "记忆能保存地图漏掉的细节，也可能给模糊岁月加上过多肯定。"}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "文分别摆下记忆石子、档案地图和现场样本。"}, {speaker: wen, text: "不同证据可以互相支持，却不会因此变成同一种来源。"}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "上游大雨后，一股颜色更深的水进入河湾。"}, {speaker: narrator, text: "大家只在高处观察，没有靠近速度加快的水流。"}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "高水退去，砾石洲的形状已经改变。"}, {speaker: mara, text: "我们原定的桥线，现在跨过了另一种分流位置。"}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "文和玛拉用无字木桩标出新的边缘。"}, {speaker: narrator, text: "连续观察记录的是变化过程，不再只是某一个时刻的静止画面。"}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "居民比较固定桥、可移动浮动码头和现有渡船。"}, {speaker: narrator, text: "每个方案的运力、灵活性、成本和所需研究都不相同。"}]}
  - {id: p19, illustration: p19, lines: [{speaker: mara, text: "专家研究两岸时，可调码头可以先改善现在的通行。"}, {speaker: narrator, text: "她没有把临时办法说成“不需要桥”的证明。"}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "渡口增加一艘小船和两个可调节的浮动码头。"}, {speaker: narrator, text: "队伍缩短了，水位变化时工人也能移动码头连接处。"}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "文保存旧地图副本、新河形、石头和照片。"}, {speaker: wen, text: "以后的决定者应该能检查今天的结论是怎样形成的。"}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "索拉用简单设备记录口述历史，一位年轻居民在旁听。"}, {speaker: sola, text: "记忆中的河流是需要追问和比较的证据，不是必须服从的命令。"}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: "玛拉和独立勘察专家检查两岸，渡船继续正常运行。"}, {speaker: narrator, text: "地质、水流变化、通行需求和后期维护都会影响未来决定。"}]}
  - {id: p24, illustration: p24, lines: [{speaker: narrator, text: "文离开时，可调整的渡口正在开阔天空下服务两岸。"}, {speaker: mara, text: "我们没有推迟责任，而是一边改善今天，一边研究明天能安全承受什么。"}]}
chapters:
  - {id: ch01, title: 互不重合的地图, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 草地里的证据, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 大雨后的河湾, page_refs: [p13, p14, p15, p16, p17]}
  - {id: ch04, title: 边改善边研究, page_refs: [p18, p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "哪些证据支持河流位置发生过变化？", answer: "互不重合的旧地图、索拉的记忆、草地圆石和现在的砾石洲都说明河流会随时间改变。", page_refs: [p05, p06, p07, p08, p09]}
  - {id: q02, type: compare, speaker: narrator, prompt: "索拉的记忆、档案地图和现场样本分别有什么作用？", answer: "记忆保存亲历，地图保存旧形状，现场样本检验物理痕迹，而每一种也都有局限。", page_refs: [p07, p08, p13, p14]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "玛拉为什么拿走第一个桥模型？", answer: "多份记录显示河道会移动，新砾石洲也说明原桥线只依据一个不完整时刻。", page_refs: [p06, p09, p10, p11, p12]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: "为什么可调码头是合理的近期方案？", answer: "它能减少当前排队并适应水位变化，同时让独立研究继续，而且没有假装桥梁问题已经解决。", page_refs: [p18, p19, p20, p23]}
  - {id: q05, type: character-motive, speaker: narrator, prompt: "文为什么同时保存结论和不同证据来源？", answer: "她希望未来决策者能检查证据、局限和解释随时间发生的变化。", page_refs: [p14, p17, p21, p22]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "河流研究和渡口决定共同说明了什么？", answer: "面对变化的环境，负责任的决定要综合来源、承认不确定性、改善当下，并继续检验长期方案。", page_refs: [p05, p11, p12, p17, p19, p21, p23, p24]}
