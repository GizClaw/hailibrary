questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: Which evidence supports the conclusion that the river has changed position?
    answer: Misaligned old maps, Sola's memory, rounded meadow stones, and the present gravel bar all indicate changes across time.
    page_refs:
      - p05
      - p06
      - p07
      - p08
      - p09
  - id: q02
    type: compare
    speaker: narrator
    prompt: How do Sola's memory, archival maps, and field samples contribute differently?
    answer: Memory preserves lived experience, maps preserve earlier shapes, and field samples test physical traces; each also has limits.
    page_refs:
      - p07
      - p08
      - p13
      - p14
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does Mara remove the first bridge model?
    answer: Several records show channel movement, and the new gravel bar means the proposed line rests on an incomplete snapshot.
    page_refs:
      - p06
      - p09
      - p10
      - p11
      - p12
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: Why are adjustable docks a reasonable near-term response?
    answer: They reduce present queues and can respond to water-level changes while independent study continues, without pretending to settle the bridge question.
    page_refs:
      - p18
      - p19
      - p20
      - p23
  - id: q05
    type: character-motive
    speaker: narrator
    prompt: Why does Wen preserve both conclusions and source types in the archive?
    answer: She wants future decision-makers to inspect the evidence, its limits, and how interpretations changed over time.
    page_refs:
      - p14
      - p17
      - p21
      - p22
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What central idea connects the river study and crossing decision?
    answer: When a landscape changes, responsible decisions combine several sources, acknowledge uncertainty, improve current conditions, and keep testing long-term options.
    page_refs:
      - p05
      - p11
      - p12
      - p17
      - p19
      - p21
      - p23
      - p24
