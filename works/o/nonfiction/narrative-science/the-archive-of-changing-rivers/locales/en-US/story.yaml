schema_version: 1
language: en-US
writer: river-wink
title: The Archive of Changing Rivers
summary: Archivist Wen helps crossing builder Mara compare old maps, field evidence, and Sola's memories beside a shifting river. A new gravel bar and later flood pulse show why a fixed bridge needs further study, so the community improves ferry access while independent specialists investigate a durable crossing.
cast:
  narrator: {display_name: Narrator, tts: {delivery: exact and contemplative, timbre: clear adult voice, pace: medium, pitch: medium}}
  wen: {display_name: Wen, tts: {delivery: precise and humble, timbre: clear adult voice, pace: medium, pitch: medium}}
  mara: {display_name: Mara, tts: {delivery: decisive and practical, timbre: strong adult voice, pace: medium, pitch: medium-low}}
  sola: {display_name: Sola, tts: {delivery: patient and wry, timbre: warm older-adult voice, pace: medium-slow, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Field archivist Wen arrives at a broad, unfamiliar river bend with a carefully sealed waterproof folio."}, {speaker: narrator, text: "The braided brown water divides around several pale gravel bars before joining again farther downstream."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Crossing builder Mara points toward a clinic and school on the far bank."}, {speaker: mara, text: "People need a dependable crossing, especially when the ferry queue grows."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "One small passenger ferry waits at the narrow dock while families and workers form a long line."}, {speaker: narrator, text: "Strong wind, high water, careful loading, and unloading time can delay every round trip."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Mara places a long fixed bridge model across the river's present main flow and gravel shore."}, {speaker: mara, text: "A direct permanent span could shorten daily travel for families on both banks."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Wen opens three old maps showing river shapes from different years."}, {speaker: wen, text: "Before fixing a structure in one place, we should ask how long that place stays the same."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "When Wen carefully overlaps the maps, their deepest curves, islands, and banks do not align."}, {speaker: narrator, text: "A broad bend on one older sheet crosses dry meadow land on another."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Retired ferrier Sola taps an old bend and points toward a meadow."}, {speaker: sola, text: "When I was young, boats turned where cattle now graze."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Wen walks the meadow and finds rounded stones inside exposed soil."}, {speaker: wen, text: "The stones support Sola's memory, although they do not tell us the exact year or depth."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Mara examines a fresh gravel bar that now splits the present river near the proposed crossing."}, {speaker: narrator, text: "Fast and slow water follow two unequal paths around its changing edges."}]}
  - id: p10
    illustration: p10
    lines:
      - speaker: narrator
        content: [{text: "Cloudy side water carries sediment into the clearer main "}, {vocabulary: {id: channel, text: channel}}, {text: "."}]
      - {speaker: wen, text: "Flow can erode material in one place and deposit it in another."}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Wen systematically compares present water, the new gravel bar, rounded meadow stones, and all three old maps."}, {speaker: wen, text: "Together they show repeated movement, but not exactly where or when the next major change will occur."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Mara removes the bridge model from the map."}, {speaker: mara, text: "A bridge may still be possible, but this first location rests on an incomplete picture."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Sola draws a remembered river curve in damp sand."}, {speaker: sola, text: "Memory keeps details that maps omit, and sometimes adds certainty that time has blurred."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Wen separates a memory pebble, an archival map, and a field sample."}, {speaker: wen, text: "Different evidence can support one another without becoming the same kind of source."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Several days later, after heavy rain upstream, a darker pulse of sediment-rich water enters the bend."}, {speaker: narrator, text: "The group observes the event from stable high ground instead of approaching the stronger, faster current."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "When the high water recedes, the gravel bar has changed shape."}, {speaker: mara, text: "Our proposed bridge line now crosses a different division of flow."}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "Wen and Mara mark the new bar edges with plain stakes."}, {speaker: narrator, text: "Repeated observations create a record of change rather than one frozen snapshot."}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "Residents from both banks compare a fixed bridge, movable floating docks, and the limited existing ferry."}, {speaker: narrator, text: "Each option differs in passenger capacity, flexibility, construction cost, maintenance, and the investigation it requires."}]}
  - {id: p19, illustration: p19, lines: [{speaker: mara, text: "Adjustable docks can improve access now while specialists study both banks."}, {speaker: narrator, text: "She refuses to present the temporary solution as proof that a bridge is unnecessary."}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "The community crossing soon gains a second small boat and two modular, adjustable floating docks."}, {speaker: narrator, text: "Passenger queues shorten, and trained workers can move the dock connections as seasonal water levels change."}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "Wen archives copies of old maps, new river shapes, stones, and photographs."}, {speaker: wen, text: "Future decisions should be able to inspect how today's conclusion was reached."}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "Sola records an oral history while a younger resident listens."}, {speaker: sola, text: "A remembered river is evidence to question and compare, not a command to obey."}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: "Mara and an independent team of survey specialists inspect both banks while the improved ferries continue operating."}, {speaker: narrator, text: "Local geology, changing flow, public access needs, construction impacts, and future maintenance will all shape a later decision."}]}
  - {id: p24, illustration: p24, lines: [{speaker: narrator, text: "Wen departs as the adaptable crossing steadily serves both banks beneath open sky."}, {speaker: mara, text: "We did not postpone responsibility. We improved today while studying what tomorrow can safely support."}]}
chapters:
  - {id: ch01, title: Maps That Disagree, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Evidence in the Meadow, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: A Bend After Rain, page_refs: [p13, p14, p15, p16, p17]}
  - {id: ch04, title: Improving While Studying, page_refs: [p18, p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "Which evidence supports the conclusion that the river has changed position?", answer: "Misaligned old maps, Sola's memory, rounded meadow stones, and the present gravel bar all indicate changes across time.", page_refs: [p05, p06, p07, p08, p09]}
  - {id: q02, type: compare, speaker: narrator, prompt: "How do Sola's memory, archival maps, and field samples contribute differently?", answer: "Memory preserves lived experience, maps preserve earlier shapes, and field samples test physical traces; each also has limits.", page_refs: [p07, p08, p13, p14]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why does Mara remove the first bridge model?", answer: "Several records show channel movement, and the new gravel bar means the proposed line rests on an incomplete snapshot.", page_refs: [p06, p09, p10, p11, p12]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: "Why are adjustable docks a reasonable near-term response?", answer: "They reduce present queues and can respond to water-level changes while independent study continues, without pretending to settle the bridge question.", page_refs: [p18, p19, p20, p23]}
  - {id: q05, type: character-motive, speaker: narrator, prompt: "Why does Wen preserve both conclusions and source types in the archive?", answer: "She wants future decision-makers to inspect the evidence, its limits, and how interpretations changed over time.", page_refs: [p14, p17, p21, p22]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "What central idea connects the river study and crossing decision?", answer: "When a landscape changes, responsible decisions combine several sources, acknowledge uncertainty, improve current conditions, and keep testing long-term options.", page_refs: [p05, p11, p12, p17, p19, p21, p23, p24]}
