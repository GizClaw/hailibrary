schema_version: 1
language: en-US
writer: river-wink
title: The Shady Thermometer
summary: Lin's volunteers measure neighborhood heat, but a thermometer in direct sun and another beside a wall cannot be compared fairly. Rosa helps the team separate standardized air temperature from people's actual heat exposure, leading to a bus-stop plan based on measurements, shade gaps, wait times, and accessible design.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured with light humor, timbre: clear adult voice, pace: medium, pitch: medium}}
  lin: {display_name: Lin, tts: {delivery: exact and increasingly patient, timbre: bright teen voice, pace: medium-fast, pitch: medium-high}}
  rosa: {display_name: Rosa, tts: {delivery: warm and challenging, timbre: grounded adult voice, pace: medium, pitch: medium-low}}
  dev: {display_name: Dev, tts: {delivery: patient and technical, timbre: warm older-adult voice, pace: medium-slow, pitch: medium-low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "On a clear summer morning, Lin leads volunteers carrying identical thermometers through a hot city neighborhood."}, {speaker: lin, text: "We will find the hottest block by carefully comparing repeated readings from every site."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Rosa waits with several passengers beside an unshaded bus stop, metal bench, and wide dark pavement."}, {speaker: rosa, text: "Start here. People stand in this exposed heat much longer than your route map suggests."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Lin holds a thermometer directly in bright sunlight near the shelter."}, {speaker: narrator, text: "Its reading rises quickly, and Lin marks the stop as the first extreme site."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Dev moves the instrument into a white, ventilated shield."}, {speaker: dev, text: "Direct solar heating can warm the instrument itself. We need shade and airflow for comparable air readings."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Following one shared plan, volunteers place shielded sensors at matching heights over several different surroundings."}, {speaker: narrator, text: "They use the same equipment and scheduled observation times so fewer important conditions change at once."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "One sensor stands near pavement and another over grass, both shaded and ventilated."}, {speaker: lin, text: "Now a difference is less likely to come from unequal instrument exposure."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Lin compares the standardized readings."}, {speaker: rosa, text: "Passengers also touch the bench, cross the pavement, and wait without tree shade. Where are those conditions?"}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "A child avoids a sun-heated metal bench and chooses a shaded seat."}, {speaker: narrator, text: "The bench surface can feel dangerously hot even when it is not measuring air temperature."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Lin separates air-temperature cards from cards describing surfaces, shade, and waiting."}, {speaker: lin, text: "One measurement cannot answer every heat question, so we must name what each observation represents."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Volunteers return and repeat every measurement at the same sites later in the hot afternoon."}, {speaker: narrator, text: "Repeated timing shows whether one surprising value persists or disappears when the setup remains comparable."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "One tree-lined block offers continuous shade; the next exposes wide pavement."}, {speaker: narrator, text: "Their standardized air readings differ, but not as dramatically as their walking conditions."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Rosa walks the bus route with Lin and identifies the longest passenger waits."}, {speaker: rosa, text: "Exposure depends on where people are, what surrounds them, and how long they remain."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Dev finds one shield crowded against a sun-warmed wall with poor airflow."}, {speaker: dev, text: "This site violates our setup. Its reading should not enter the comparable group."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Lin removes that value from the comparison but preserves it with a note about placement."}, {speaker: lin, text: "Discarding a bad comparison does not mean hiding the mistake that taught us something."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Residents add different colored tokens for crowded waits, steep crossings, missing shade, and frequently touched hot surfaces."}, {speaker: narrator, text: "Their repeated route experience becomes another organized dataset rather than decoration around the thermometers."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "The relief map combines measurement sites, shade gaps, and long waits."}, {speaker: narrator, text: "Several kinds of evidence now reveal where heat exposure may burden people most."}]}
  - {id: p17, illustration: p17, lines: [{speaker: narrator, text: "Lin presents the highest standardized air-temperature site."}, {speaker: rosa, text: "That is important, but another stop has less shade, a hotter bench, and twice the waiting time."}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "The group now distinguishes a standardized temperature ranking from a practical priority for public improvement."}, {speaker: narrator, text: "The two questions overlap, yet total exposure and accessible movement can change which site needs action first."}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "Residents test temporary fabric shade without blocking the sidewalk or driver sight lines."}, {speaker: narrator, text: "Passengers compare comfort while volunteers continue the standardized measurements."}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "City gardeners inspect places where future trees can grow away from underground and overhead utilities."}, {speaker: narrator, text: "Shade that survives requires suitable roots, watering, maintenance, and clear accessible paths."}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "The bus stop receives a broad canopy, cooler seating material, and an unobstructed path."}, {speaker: rosa, text: "The design now responds to waiting, touch, movement, and air—not one number alone."}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "New young street trees are planted only in carefully selected, suitable parts of the route."}, {speaker: narrator, text: "Protective rings support watering while keeping the walking surface clear."}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: "Volunteers repeat the same shielded measurements as residents record how the route feels."}, {speaker: lin, text: "We can track physical change and lived experience without pretending they are identical measures."}]}
  - {id: p24, illustration: p24, lines: [{speaker: narrator, text: "At the end of the route, Lin, Rosa, Dev, and several passengers rest in deep shade beside the monitoring kit."}, {speaker: lin, text: "A fair method made our numbers stronger. A broader question made them useful."}]}
chapters:
  - {id: ch01, title: A Number in the Sun, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: More Than Air, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: A Fair Comparison, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: Evidence into Shade, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "Which details show why Lin's first thermometer reading is not comparable?", answer: "It is heated directly by sunlight, while proper air-temperature sensors are shaded, ventilated, placed at matching heights, and observed at matched times.", page_refs: [p03, p04, p05, p06]}
  - {id: q02, type: compare, speaker: narrator, prompt: "How do standardized air temperature and heat exposure answer different questions?", answer: "Standardized temperature compares air under controlled setups; exposure also considers surfaces, shade, location, duration, movement, and people's experience.", page_refs: [p04, p07, p08, p09, p12]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why does Lin remove the wall-adjacent reading from the comparable dataset?", answer: "The warm wall and poor airflow violate the shared setup, so its difference may come from placement rather than neighborhood air.", page_refs: [p05, p13, p14]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: "Why can a stop without the highest air reading still receive improvements first?", answer: "Long waits, missing shade, hot surfaces, difficult movement, and many users can create greater practical exposure and need.", page_refs: [p12, p15, p16, p17, p18]}
  - {id: q05, type: character-motive, speaker: narrator, prompt: "Why does Lin preserve the rejected reading as a placement lesson?", answer: "She wants the record to explain the error and help future volunteers avoid repeating it, rather than conceal it.", page_refs: [p13, p14, p23]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "What central change improves the project?", answer: "The team strengthens measurement consistency and expands its question from ranking temperature to understanding where people experience harmful heat burdens.", page_refs: [p04, p05, p09, p12, p16, p18, p23, p24]}
