questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: Which details show why Lin's first thermometer reading is not comparable?
    answer: It is heated directly by sunlight, while proper air-temperature sensors are shaded, ventilated, placed at matching heights, and observed at matched times.
    page_refs:
      - p03
      - p04
      - p05
      - p06
  - id: q02
    type: compare
    speaker: narrator
    prompt: How do standardized air temperature and heat exposure answer different questions?
    answer: Standardized temperature compares air under controlled setups; exposure also considers surfaces, shade, location, duration, movement, and people's experience.
    page_refs:
      - p04
      - p07
      - p08
      - p09
      - p12
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does Lin remove the wall-adjacent reading from the comparable dataset?
    answer: The warm wall and poor airflow violate the shared setup, so its difference may come from placement rather than neighborhood air.
    page_refs:
      - p05
      - p13
      - p14
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: Why can a stop without the highest air reading still receive improvements first?
    answer: Long waits, missing shade, hot surfaces, difficult movement, and many users can create greater practical exposure and need.
    page_refs:
      - p12
      - p15
      - p16
      - p17
      - p18
  - id: q05
    type: character-motive
    speaker: narrator
    prompt: Why does Lin preserve the rejected reading as a placement lesson?
    answer: She wants the record to explain the error and help future volunteers avoid repeating it, rather than conceal it.
    page_refs:
      - p13
      - p14
      - p23
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What central change improves the project?
    answer: The team strengthens measurement consistency and expands its question from ranking temperature to understanding where people experience harmful heat burdens.
    page_refs:
      - p04
      - p05
      - p09
      - p12
      - p16
      - p18
      - p23
      - p24
