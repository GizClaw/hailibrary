schema_version: 2
language: en-US
writer: river-wink
title: The Shady Thermometer
summary: Lin's volunteers measure neighborhood heat, but a thermometer in direct sun and another beside a wall cannot be compared fairly. Rosa helps the team separate standardized air temperature from people's actual heat exposure, leading to a bus-stop plan based on measurements, shade gaps, wait times, and accessible design.
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: On a clear summer morning, Lin leads volunteers carrying identical thermometers through a hot city neighborhood. Lin says, “
            - text: We will find the hottest block by carefully comparing repeated readings from every site.”
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Rosa waits with several passengers beside an unshaded bus stop, metal bench, and wide dark pavement. Rosa says, “
            - text: Start here. People stand in this exposed heat much longer than your route map suggests.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Lin holds a thermometer directly in bright sunlight near the shelter. "
            - text: The reading rises quickly, and Lin marks it as the hottest stop so far.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Dev moves the instrument into a white, ventilated shield. Dev says, “
            - text: Direct solar heating can warm the instrument itself. We need shade and airflow for comparable air readings.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "Following one shared plan, volunteers place shielded sensors at matching heights over several different surroundings. "
            - text: The places change, but the equipment, height, and observation times stay as similar as possible.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: One sensor stands near pavement and another over grass, both shaded and ventilated. Lin says, “
            - text: At least both instruments now get the same shade and airflow.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Lin compares the standardized readings. Rosa says, “
            - text: Passengers also touch the bench, cross the pavement, and wait without tree shade. Where are those conditions?”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "A child avoids a sun-heated metal bench and chooses a shaded seat. "
            - text: A hot bench and a hot patch of air are different observations.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: Lin separates air-temperature cards from cards describing surfaces, shade, and waiting. Lin says, “
            - text: Keep the air readings in one group and the surface, shade, and waiting notes in another.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Volunteers return and repeat every measurement at the same sites later in the hot afternoon. "
            - text: They can now see whether the surprising value lasts or disappears under the same setup.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "One tree-lined block offers continuous shade; the next exposes wide pavement. "
            - text: Their standardized air readings differ, but not as dramatically as their walking conditions.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Rosa walks the bus route with Lin and identifies the longest passenger waits. Rosa says, “
            - text: Heat is not just the reading. It also matters where people wait and for how long.”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: Dev finds one shield crowded against a sun-warmed wall with poor airflow. Dev says, “
            - text: This sensor is too close to the hot wall. Keep the reading, but take it out of the comparison.”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Lin removes that value from the comparison but preserves it with a note about placement. Lin says, “
            - text: I will mark why we removed it. The mistake still taught us something.”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: "Residents add different colored tokens for crowded waits, steep crossings, missing shade, and frequently touched hot surfaces. "
            - text: The map now includes conditions that the thermometers do not capture.
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "The relief map combines measurement sites, shade gaps, and long waits. "
            - text: Together, the sites, shade gaps, and waiting times reveal where riders face the greatest heat exposure.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: Lin presents the highest standardized air-temperature site. Rosa says, “
            - text: That is important, but another stop has less shade, a hotter bench, and twice the waiting time.”
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "The hottest air site is not automatically the first place to improve. "
            - text: Waiting time, shade, and accessible movement can change the order.
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: "Residents test temporary fabric shade without blocking the sidewalk or driver sight lines. "
            - text: Passengers compare comfort while volunteers continue the standardized measurements.
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: "City gardeners inspect places where future trees can grow away from underground and overhead utilities. "
            - text: Shade trees need room for roots, regular watering, maintenance, and clear accessible paths.
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: The bus stop receives a broad canopy, cooler seating material, and an unobstructed path. Rosa says, “
            - text: Now passengers can wait, touch the seat, and reach the bus without crossing the worst heat.”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: "New young street trees are planted only in carefully selected, suitable parts of the route. "
            - text: Protective rings support watering while keeping the walking surface clear.
    - id: p23
      illustration: p23
      paragraphs:
        - content:
            - text: Volunteers repeat the same shielded measurements as residents record how the route feels. Lin says, “
            - text: "Next month, repeat both checks: the shielded readings and what riders experience.”"
    - id: p24
      illustration: p24
      paragraphs:
        - content:
            - text: At the end of the route, Lin, Rosa, Dev, and several passengers rest in deep shade beside the monitoring kit. Lin says, “
            - text: Leave the kit packed. We will measure again after the trees have had time to grow.”
