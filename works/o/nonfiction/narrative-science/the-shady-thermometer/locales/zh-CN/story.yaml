questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些细节说明林最初的温度计读数不能公平比较？
    answer: 它受到阳光直接加热，而规范气温传感器应遮阴、通风、放在相同高度，并在对应时间观察。
    page_refs:
      - p03
      - p04
      - p05
      - p06
  - id: q02
    type: compare
    speaker: narrator
    prompt: 标准化气温和热暴露分别回答什么问题？
    answer: 标准化气温比较统一设置下的空气；热暴露还考虑表面、阴影、位置、时长、移动和人的感受。
    page_refs:
      - p04
      - p07
      - p08
      - p09
      - p12
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 林为什么从可比较数据中移除贴墙读数？
    answer: 热墙和通风不足违反共同设置，差异可能来自摆放位置，而不是社区空气。
    page_refs:
      - p05
      - p13
      - p14
  - id: q04
    type: evaluate
    speaker: narrator
    prompt: 气温不是最高的车站为什么仍可能先得到改进？
    answer: 长时间等候、缺少阴影、表面滚烫、通行困难和使用人数都可能造成更大的实际热负担。
    page_refs:
      - p12
      - p15
      - p16
      - p17
      - p18
  - id: q05
    type: character-motive
    speaker: narrator
    prompt: 林为什么把被拒绝的读数保留为摆放教训？
    answer: 她希望记录解释错误，帮助未来志愿者避免重复，而不是把问题藏起来。
    page_refs:
      - p13
      - p14
      - p23
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: 项目发生了什么中心变化？
    answer: 团队既加强测量的一致性，也把问题从气温排名扩大到居民在哪里承受较大的热负担。
    page_refs:
      - p04
      - p05
      - p09
      - p12
      - p16
      - p18
      - p23
      - p24
