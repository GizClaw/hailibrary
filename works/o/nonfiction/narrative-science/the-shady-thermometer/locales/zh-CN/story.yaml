schema_version: 2
language: zh-CN
writer: 江笑
title: 阴影里的温度计
summary: 林带领志愿者调查社区热环境，却发现阳光直射的温度计和紧贴墙壁的温度计不能公平比较。罗莎帮助团队区分标准化气温与居民实际承受的热暴露，最后用测量、遮阴缺口、候车时长和无障碍需求共同制定公交站改进方案。
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 林带领志愿者拿着相同温度计走进炎热的城市社区。林说：“
            - text: 我们要比较每个地点的读数，找出最热的街区。”
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 罗莎和乘客在没有遮阴的公交站等待，旁边铺着深色路面。罗莎说：“
            - text: 先从这里开始。人们停留在热里的时间比地图显示得更久。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 林把温度计直接举在站棚旁的强烈阳光里。
            - text: 读数很快上升，林立刻把这里标成目前最热的一站。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 德夫把仪器移进通风的白色防辐射罩。德夫说：“
            - text: 阳光会加热仪器本身。可比较的气温读数需要遮阴和空气流通。”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 志愿者把有防护罩的传感器放在相同高度、不同环境上方。
            - text: 这样，地点不同，仪器、高度和观察时间却尽量相同。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 一台靠近路面，一台位于草地上方，两台都遮阴而且通风。林说：“
            - text: 至少现在，两台仪器得到的阴影和通风条件一样。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 林比较标准化读数。罗莎说：“
            - text: 乘客还会触碰长椅、穿过路面、在没有树荫处等候。这些条件在哪里？”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 一个孩子避开被太阳晒热的金属长椅，选择阴影里的座位。
            - text: 滚烫的长椅和发热的空气，是两种不同的观察。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 林把气温卡与表面、阴影和等候时间卡分开放置。林说：“
            - text: 气温读数放一组，地面、阴影和等候记录放另一组。”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 志愿者在当天较晚时重复测量相同地点。
            - text: 这样可以看出，刚才的高值是一直存在，还是偶然出现。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 一条街有连续树荫，下一条街却露出大片路面。
            - text: 两处标准化气温有差别，步行感受的差别却更加明显。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 罗莎陪林走完整条公交路线，指出乘客等候最久的位置。罗莎说：“
            - text: 热不只是温度计上的数字，还要看人在什么地方等、等多久。”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 德夫发现一只防护罩挤在被太阳晒热的墙边，通风很差。德夫说：“
            - text: 这台离热墙太近。读数留着，但别放进比较。”
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 林从比较中移除这个数值，却保留它并注明摆放问题。林说：“
            - text: 我会写清楚为什么删掉它。这个错误还是教了我们东西。”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 居民把彩色圆片放到立体图上，标出排队久、坡陡和没有阴影的地方。
            - text: 这些日常经验也成了一组可以比较的记录。
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 测量点、阴影缺口和候车时间叠在一起。
            - text: 几处最难受的站点渐渐显了出来。
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: 林指出标准化气温最高的地点。罗莎说：“
            - text: 它很重要，但另一站阴影更少、长椅更烫，等车时间还是两倍。”
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 气温最高的一站，不一定是最该先改的一站。
            - text: 等候时间、阴影和通行条件也会改变顺序。
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: 居民测试临时布棚，确保它不阻挡人行道和司机视线。
            - text: 乘客比较舒适度，志愿者则继续进行标准化测量。
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: 园林人员寻找远离地下和空中管线、适合树木生长的位置。
            - text: 长久的树荫还需要合适的根系空间、浇水、维护和畅通的无障碍通道。
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: 公交站增加宽大遮阳棚、较凉的座椅材料和无阻碍通道。罗莎说：“
            - text: 现在乘客能在阴影里等车，碰到座椅也不烫，去车门的路还很顺。”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: 新行道树只种在路线中真正合适的地段。
            - text: 保护圈方便浇水，人行道也保持平整通畅。
    - id: p23
      illustration: p23
      paragraphs:
        - content:
            - text: 志愿者重复相同的遮阴测量，居民也记录路线感受。林说：“
            - text: 下个月两种检查都重做：防护罩里的读数，还有乘客走这条路的感受。”
    - id: p24
      illustration: p24
      paragraphs:
        - content:
            - text: 林、罗莎、德夫和乘客坐在阴影里休息，监测工具仍放在旁边。林说：“
            - text: 工具先别收走。等树长一阵，我们再来测。”
