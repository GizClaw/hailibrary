schema_version: 1
language: en-US
writer: river-wink
title: Where the River Carried the Scent
summary: Search dog Moss alerts downstream from a missing wetland surveyor, but crosswind and changing weather make the alert an uncertain location clue. Ana, Jo, and Dev combine canine behavior, wind, terrain, and safe access routes to find Eli without mistaking detection for proof.
cast:
  narrator: {display_name: Narrator, tts: {delivery: attentive and restrained, timbre: clear adult voice, pace: medium, pitch: medium}}
  moss: {display_name: Moss, tts: {delivery: alert barks and quiet breathing, timbre: natural Labrador sounds, pace: variable, pitch: medium-low}}
  ana: {display_name: Ana, tts: {delivery: focused and patient, timbre: steady adult voice, pace: medium, pitch: medium}}
  jo: {display_name: Jo, tts: {delivery: practical and candid, timbre: textured older-adult voice, pace: medium, pitch: medium-low}}
  dev: {display_name: Dev, tts: {delivery: precise and curious, timbre: clear adult voice, pace: medium, pitch: medium}}
  eli: {display_name: Eli, tts: {delivery: tired but clear, timbre: warm adult voice, pace: medium-slow, pitch: medium-low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "At a gray dawn, Ana clips a red search harness onto Moss beside the busy river station."}, {speaker: jo, text: "Eli surveyed the northern reed plots yesterday afternoon and never returned for the evening check-in."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Jo points beyond the footbridge toward the north-bank plots, where Eli was last seen."}, {speaker: jo, text: "Overnight rain has swollen the river, so every team must use bridges and high-bank paths."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Ana offers Moss a clean reed sample case that carries Eli's familiar scent."}, {speaker: narrator, text: "Other searchers and their equipment stand back to avoid adding confusing odors near the starting point."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "Moss samples the air, then pulls downstream along the high bank."}, {speaker: ana, text: "He is following airborne scent, not a visible trail on the ground."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Near a wide river bend, Moss suddenly stops, faces the moving water, and gives his trained alert."}, {speaker: jo, text: "Then Eli must be somewhere downstream along this bank."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Ana rewards Moss but keeps the team in place."}, {speaker: ana, text: "The alert confirms that he detected scent here. It does not identify its source location."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "Dev's lightweight ribbon pole leans diagonally from the opposite bank toward Moss and the river bend."}, {speaker: dev, text: "A crosswind may be carrying scent over the river before the curved banks turn it downstream."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "From a dry, safe overlook, they compare tall reeds, steep banks, moving water, and wind."}, {speaker: narrator, text: "The broad river bend could redirect both air and scent without showing where Eli actually walked."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "The team crosses the footbridge, and Moss alerts again among south-bank reeds."}, {speaker: ana, text: "Two alerts across the river fit Dev's wind explanation better than Jo's first guess."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Jo builds two simple clay models: one shows Eli crossing; the other shows only airborne scent crossing."}, {speaker: jo, text: "Both explanations remain possible, so our search plan must test each one fairly."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Separate search teams take the bridge and marked high-bank routes while avoiding the fast, swollen water."}, {speaker: narrator, text: "One checks every safe access point; another searches sheltered ground farther downstream."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Dev marks each alert with a colored pebble and records the ribbon direction."}, {speaker: dev, text: "Time matters because the wind that moved the scent may change."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "Light rain arrives, cooling the air, and the wet ribbon turns toward a new direction."}, {speaker: narrator, text: "An alert made under these conditions cannot be interpreted with the earlier wind alone."}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "Moss enters dense reeds, searches carefully, then loses the scent and looks back."}, {speaker: ana, text: "That change is information too. We should not force him to confirm our favorite idea."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "Ana gives Moss water and examines his paws while he rests on a dry mat."}, {speaker: jo, text: "A tired searcher, human or canine, can miss important evidence."}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "A second canine team independently examines another high-bank sector beyond the reeds."}, {speaker: narrator, text: "Its separate search reduces the risk of treating Moss's path as the only possible path toward Eli."}]}
  - id: p17
    illustration: p17
    lines:
      - speaker: narrator
        content: [{text: "After resting, Moss alerts near the mouth of a narrow side "}, {vocabulary: {id: channel, text: channel}}, {text: "."}]
      - {speaker: narrator, text: "A line of willows shelters the air above it."}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "Ana and Dev compare the new alert with their model and ribbon records."}, {speaker: dev, text: "Across both wind periods, the side channel lies where several scent paths could meet."}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "Jo recognizes an old stone flood shelter beyond the willow line."}, {speaker: jo, text: "A maintained high-bank path reaches it safely, and someone with an injury might reasonably wait there."}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "The team follows that path and finds Eli waving from the dry stone doorway."}, {speaker: eli, text: "I heard you, but the river was too loud for you to hear me."}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "Eli shows a broken boot strap and explains why he stayed inside."}, {speaker: eli, text: "Crossing wet ground with an unstable boot seemed riskier than waiting in shelter."}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "Dev arranges alert pebbles, wind directions, and search sectors around the model."}, {speaker: ana, text: "No single clue gave us Eli's location. Their relationships narrowed the safe search."}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: "Moss receives water and quiet praise as both canine teams reunite."}, {speaker: jo, text: "My first conclusion was too exact for the evidence we had."}]}
  - {id: p24, illustration: p24, lines: [{speaker: narrator, text: "At sunset, the complete team returns along the high path above the river rather than beside its fast current."}, {speaker: ana, text: "A careful detection can guide responsible action without pretending uncertainty has completely disappeared."}]}
chapters:
  - {id: ch01, title: The First Alert, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Wind Across Water, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: Changing Conditions, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: The Shelter Beyond the Willows, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "What evidence weakens Jo's first claim that Eli must be downstream?", answer: "The crosswind points from the opposite bank, Moss alerts on both banks, and river bends can redirect airborne scent.", page_refs: [p05, p07, p08, p09]}
  - {id: q02, type: compare, speaker: narrator, prompt: "How do Jo's two clay explanations differ?", answer: "One proposes that Eli physically crossed the river; the other proposes that wind carried only his scent across it.", page_refs: [p07, p09, p10]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why does the team record the time and ribbon direction for each alert?", answer: "Wind changes can move scent differently, so each alert must be interpreted with the conditions at that time.", page_refs: [p12, p13, p18]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why does Ana rest Moss after he loses the scent?", answer: "She treats fatigue and the lost scent as meaningful limits, protecting Moss and preventing a forced, unreliable search.", page_refs: [p14, p15, p16]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "Why is checking the flood shelter a reasonable decision rather than proof that Eli is there?", answer: "Several scent paths meet near the channel, a safe route reaches the shelter, and an injured person might wait there, but none alone guarantees the location.", page_refs: [p17, p18, p19, p20]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "What does the search show about using uncertain evidence?", answer: "Teams can act on several limited clues by comparing explanations, conditions, and safe routes without claiming that one detection proves an exact location.", page_refs: [p06, p10, p12, p16, p18, p22, p24]}
