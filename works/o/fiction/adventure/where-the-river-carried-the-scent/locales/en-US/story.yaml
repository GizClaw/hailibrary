questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: What evidence weakens Jo's first claim that Eli must be downstream?
    answer: The crosswind points from the opposite bank, Moss alerts on both banks, and river bends can redirect airborne scent.
    page_refs:
      - p05
      - p07
      - p08
      - p09
  - id: q02
    type: compare
    speaker: narrator
    prompt: How do Jo's two clay explanations differ?
    answer: One proposes that Eli physically crossed the river; the other proposes that wind carried only his scent across it.
    page_refs:
      - p07
      - p09
      - p10
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does the team record the time and ribbon direction for each alert?
    answer: Wind changes can move scent differently, so each alert must be interpreted with the conditions at that time.
    page_refs:
      - p12
      - p13
      - p18
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Ana rest Moss after he loses the scent?
    answer: She treats fatigue and the lost scent as meaningful limits, protecting Moss and preventing a forced, unreliable search.
    page_refs:
      - p14
      - p15
      - p16
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: Why is checking the flood shelter a reasonable decision rather than proof that Eli is there?
    answer: Several scent paths meet near the channel, a safe route reaches the shelter, and an injured person might wait there, but none alone guarantees the location.
    page_refs:
      - p17
      - p18
      - p19
      - p20
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: What does the search show about using uncertain evidence?
    answer: Teams can act on several limited clues by comparing explanations, conditions, and safe routes without claiming that one detection proves an exact location.
    page_refs:
      - p06
      - p10
      - p12
      - p16
      - p18
      - p22
      - p24
