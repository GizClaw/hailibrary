schema_version: 2
language: en-US
writer: river-wink
title: Where the River Carried the Scent
summary: Search dog Moss alerts downstream from a missing wetland surveyor, but crosswind and changing weather make the alert an uncertain location clue. Ana, Jo, and Dev combine canine behavior, wind, terrain, and safe access routes to find Eli without mistaking detection for proof.
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: At a gray dawn, Ana clips a red search harness onto Moss beside the busy river station. Jo says, “
            - text: Eli surveyed the northern reed plots yesterday afternoon and never returned for the evening check-in.”
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: Jo points beyond the footbridge toward the north-bank plots, where Eli was last seen. Jo says, “
            - text: Overnight rain has swollen the river, so every team must use bridges and high-bank paths.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Ana offers Moss a clean reed sample case that carries Eli's familiar scent. "
            - text: Other searchers and their equipment stand back to avoid adding confusing odors near the starting point.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Moss samples the air, then pulls downstream along the high bank. Ana says, “
            - text: He is following airborne scent, not a visible trail on the ground.”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: Near a wide river bend, Moss suddenly stops, faces the moving water, and gives his trained alert. Jo says, “
            - text: Then Eli must be somewhere downstream along this bank.”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: Ana rewards Moss but keeps the team in place. Ana says, “
            - text: Moss smelled Eli here. That tells us where the scent reached him, not where Eli is.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: Dev's lightweight ribbon pole leans diagonally from the opposite bank toward Moss and the river bend. Dev says, “
            - text: A crosswind may be carrying scent over the river before the curved banks turn it downstream.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "From a dry, safe overlook, they compare tall reeds, steep banks, moving water, and wind. "
            - text: The broad river bend could redirect both air and scent without showing where Eli actually walked.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: The team crosses the footbridge, and Moss alerts again among south-bank reeds. Ana says, “
            - text: We found scent on both banks. Dev's crosswind idea now fits better than the downstream guess.”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "Jo builds two simple clay models: one shows Eli crossing; the other shows only airborne scent crossing. Jo says, “"
            - text: Both explanations still fit. We have to search them both.”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: "Separate search teams take the bridge and marked high-bank routes while avoiding the fast, swollen water. "
            - text: One checks every safe access point; another searches sheltered ground farther downstream.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Dev marks each alert with a colored pebble and records the ribbon direction. Dev says, “
            - text: Mark the wind with every alert. It may shift before the next one.”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: "Light rain arrives, cooling the air, and the wet ribbon turns toward a new direction. "
            - text: An alert made under these conditions cannot be interpreted with the earlier wind alone.
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: Moss enters dense reeds, searches carefully, then loses the scent and looks back. Ana says, “
            - text: He lost the scent. Give him room; we do not get to choose what he finds.”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: Ana gives Moss water and examines his paws while he rests on a dry mat. Jo says, “
            - text: Let him rest. Tired searchers miss things.”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "A second canine team independently examines another high-bank sector beyond the reeds. "
            - text: Its separate search reduces the risk of treating Moss's path as the only possible path toward Eli.
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: "After resting, Moss alerts near the mouth of a narrow side "
            - vocabulary:
                id: channel
                text: channel
            - text: ". "
            - text: A line of willows shelters the air above it.
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: Ana and Dev compare the new alert with their model and ribbon records. Dev says, “
            - text: Both winds could carry scent toward this side channel.”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: Jo stops and looks past the willow line. Jo says, “
            - text: There is an old flood shelter past those willows. The high-bank path reaches it.”
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: The team follows that path and finds Eli waving from the dry stone doorway. Eli says, “
            - text: I heard you, but the river was too loud for you to hear me.”
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: Eli shows a broken boot strap and explains why he stayed inside. Eli says, “
            - text: Crossing wet ground with an unstable boot seemed riskier than waiting in shelter.”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: Dev arranges alert pebbles, wind directions, and search sectors around the model. Ana says, “
            - text: The alerts, wind, and safe routes brought us here together. None of them did it alone.”
    - id: p23
      illustration: p23
      paragraphs:
        - content:
            - text: Moss receives water and quiet praise as both canine teams reunite. Jo says, “
            - text: I treated the first alert like an address. It was not.”
    - id: p24
      illustration: p24
      paragraphs:
        - content:
            - text: At sunset, the whole team returns along the high path above the fast river. Ana says, “
            - text: Easy, Moss. We are going home by the high path.”
