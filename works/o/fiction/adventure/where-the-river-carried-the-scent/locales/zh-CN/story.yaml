schema_version: 1
language: zh-CN
writer: 江笑
title: 河流带来的气味
summary: 搜救犬苔苔在失踪湿地调查员的下游发出提示，但横风和变化的天气让这个线索无法直接说明位置。安娜、乔和德夫结合搜救犬行为、风向、地形与安全通道，在不把发现误当成证明的前提下找到了伊莱。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 专注而克制, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  moss: {display_name: 苔苔, tts: {delivery: 警觉的吠声和安静呼吸, timbre: 自然的拉布拉多犬声音, pace: 随情境变化, pitch: 中低音}}
  ana: {display_name: 安娜, tts: {delivery: 专注而耐心, timbre: 稳定的成年声音, pace: 中速, pitch: 中音}}
  jo: {display_name: 乔, tts: {delivery: 务实而坦率, timbre: 有质感的年长声音, pace: 中速, pitch: 中低音}}
  dev: {display_name: 德夫, tts: {delivery: 准确而好奇, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  eli: {display_name: 伊莱, tts: {delivery: 疲惫但表达清楚, timbre: 温暖的成年声音, pace: 中慢, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "黎明时，安娜在河边站点为苔苔扣好红色搜救背带。"}, {speaker: jo, text: "伊莱昨天去调查芦苇地，至今没有回来。"}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "乔指向伊莱最后出现的北岸样地。"}, {speaker: jo, text: "河水已经上涨，所有队伍只能走桥和高岸道路，绝不能涉水。"}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "安娜拿出带有伊莱气味的干净芦苇样品盒。"}, {speaker: narrator, text: "其他搜救者退到远处，免得起点附近混入太多新的气味。"}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "苔苔仰头分辨空气，随后沿高岸向下游拉动牵引绳。"}, {speaker: ana, text: "它在追随空气里的气味，不是地面上一条看得见的脚印。"}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "来到河湾，苔苔停下，面向水面发出训练过的提示。"}, {speaker: jo, text: "那伊莱一定就在下游。"}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "安娜奖励了苔苔，却让队伍留在原处。"}, {speaker: ana, text: "提示只证明它在这里闻到了目标气味，并不能直接指出气味源头。"}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "德夫的飘带杆从对岸方向斜斜倒向苔苔。"}, {speaker: dev, text: "横风可能先把气味送过河面，再顺着河湾转向下游。"}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "他们站在安全的高处比较芦苇、高岸、水流和风。"}, {speaker: narrator, text: "河湾能同时改变空气与气味的方向，却不能说明伊莱走过哪里。"}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "队伍走过人行桥，苔苔又在南岸芦苇旁发出提示。"}, {speaker: ana, text: "两岸都出现提示，比乔最初的猜想更符合横风解释。"}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "乔做出两个黏土模型：一个表示伊莱过河，另一个只表示气味过河。"}, {speaker: jo, text: "两种解释都还可能成立，搜索必须继续检验。"}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "不同队伍沿桥和高岸分头行动，始终避开湍急河水。"}, {speaker: narrator, text: "一队检查安全出入口，另一队搜索下游受遮挡的地面。"}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "德夫用彩色石子记录每个提示位置，同时观察飘带方向。"}, {speaker: dev, text: "时间很重要，因为搬运气味的风随时可能改变。"}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "小雨到来，飘带转向了新的方向。"}, {speaker: narrator, text: "现在出现的提示，不能只用早先的风向来解释。"}]}
  - {id: p14, illustration: p14, lines: [{speaker: narrator, text: "苔苔进入浓密芦苇仔细搜索，后来失去气味，回头望向安娜。"}, {speaker: ana, text: "这也是信息。我们不能逼它证明自己最喜欢的猜想。"}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: "安娜让苔苔在干燥垫子上休息，给它喝水并检查脚掌。"}, {speaker: jo, text: "无论人还是狗，疲劳的搜救者都可能漏掉重要证据。"}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: "第二支搜救犬队检查另一段高岸。"}, {speaker: narrator, text: "独立搜索能避免大家把苔苔的路径当成唯一可能的路径。"}]}
  - id: p17
    illustration: p17
    lines:
      - speaker: narrator
        content: [{text: "休息后，苔苔在一条狭窄支流"}, {vocabulary: {id: channel, text: 河道}}, {text: "的入口附近提示。"}]
      - {speaker: narrator, text: "一排柳树挡住了上方部分气流。"}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "安娜和德夫把新提示与模型、飘带记录放在一起比较。"}, {speaker: dev, text: "在前后两种风向下，多条可能的气味路径都会靠近这条支流。"}]}
  - {id: p19, illustration: p19, lines: [{speaker: narrator, text: "乔想起柳树后有一座旧防洪石屋。"}, {speaker: jo, text: "安全的高岸路可以到达那里，受伤的人也可能选择在那里等待。"}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: "队伍沿安全道路前进，终于看见伊莱在干燥的石门口挥手。"}, {speaker: eli, text: "我听见了你们，可河声太大，你们没有听见我。"}]}
  - {id: p21, illustration: p21, lines: [{speaker: narrator, text: "伊莱展示断裂的靴带，解释自己为什么没有离开。"}, {speaker: eli, text: "穿着不稳的靴子走湿地太危险，留在避难处更安全。"}]}
  - {id: p22, illustration: p22, lines: [{speaker: narrator, text: "德夫把提示石子、风向和搜索区域排在河流模型周围。"}, {speaker: ana, text: "没有一条线索直接给出位置，是它们之间的关系缩小了安全搜索范围。"}]}
  - {id: p23, illustration: p23, lines: [{speaker: narrator, text: "两支犬队和搜救者平安会合，苔苔得到清水和安静表扬。"}, {speaker: jo, text: "我最初的结论，比当时的证据肯定得多。"}]}
  - {id: p24, illustration: p24, lines: [{speaker: narrator, text: "日落时，所有人沿河流上方的高路返回，避开仍然湍急的水。"}, {speaker: ana, text: "发现可以指导行动，却不需要假装不确定性已经消失。"}]}
chapters:
  - {id: ch01, title: 第一次提示, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 越过河面的风, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 变化的条件, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: 柳树后的石屋, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "哪些证据削弱了乔所说的“伊莱一定在下游”？", answer: "横风来自对岸，苔苔在两岸都提示，河湾还会改变空气中气味的方向。", page_refs: [p05, p07, p08, p09]}
  - {id: q02, type: compare, speaker: narrator, prompt: "乔的两个黏土解释有什么不同？", answer: "一个认为伊莱本人过了河，另一个认为只有他的气味被风带过了河。", page_refs: [p07, p09, p10]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "队伍为什么记录每次提示的时间和飘带方向？", answer: "风向变化会以不同方式搬运气味，所以每次提示都要结合当时条件解释。", page_refs: [p12, p13, p18]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "苔苔失去气味后，安娜为什么让它休息？", answer: "她把疲劳和气味中断都看作限制，既保护苔苔，也避免逼出不可靠的搜索结果。", page_refs: [p14, p15, p16]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "为什么检查防洪石屋是合理行动，却还不是伊莱在那里的证明？", answer: "多条气味路径靠近支流，安全道路通向石屋，受伤者也可能在那里等候，但任何一条都不能保证位置。", page_refs: [p17, p18, p19, p20]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "这次搜索说明应该怎样使用不确定的证据？", answer: "可以比较多个有限线索、不同解释、环境条件和安全路线来行动，但不能声称一次发现就证明精确位置。", page_refs: [p06, p10, p12, p16, p18, p22, p24]}
