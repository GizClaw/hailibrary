questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪些证据削弱了乔所说的“伊莱一定在下游”？
    answer: 横风来自对岸，苔苔在两岸都提示，河湾还会改变空气中气味的方向。
    page_refs:
      - p05
      - p07
      - p08
      - p09
  - id: q02
    type: compare
    speaker: narrator
    prompt: 乔的两个黏土解释有什么不同？
    answer: 一个认为伊莱本人过了河，另一个认为只有他的气味被风带过了河。
    page_refs:
      - p07
      - p09
      - p10
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 队伍为什么记录每次提示的时间和飘带方向？
    answer: 风向变化会以不同方式搬运气味，所以每次提示都要结合当时条件解释。
    page_refs:
      - p12
      - p13
      - p18
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 苔苔失去气味后，安娜为什么让它休息？
    answer: 她把疲劳和气味中断都看作限制，既保护苔苔，也避免逼出不可靠的搜索结果。
    page_refs:
      - p14
      - p15
      - p16
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: 为什么检查防洪石屋是合理行动，却还不是伊莱在那里的证明？
    answer: 多条气味路径靠近支流，安全道路通向石屋，受伤者也可能在那里等候，但任何一条都不能保证位置。
    page_refs:
      - p17
      - p18
      - p19
      - p20
  - id: q06
    type: main-idea
    speaker: narrator
    prompt: 这次搜索说明应该怎样使用不确定的证据？
    answer: 可以比较多个有限线索、不同解释、环境条件和安全路线来行动，但不能声称一次发现就证明精确位置。
    page_refs:
      - p06
      - p10
      - p12
      - p16
      - p18
      - p22
      - p24
