schema_version: 2
language: zh-CN
writer: 江笑
title: 河流带来的气味
summary: 搜救犬苔苔在失踪湿地调查员的下游发出提示，但横风和变化的天气让这个线索无法直接说明位置。安娜、乔和德夫结合搜救犬行为、风向、地形与安全通道，在不把发现误当成证明的前提下找到了伊莱。
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 黎明时，安娜在河边站点为苔苔扣好红色搜救背带。乔说：“
            - text: 伊莱昨天去调查芦苇地，至今没有回来。”
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 乔指向伊莱最后出现的北岸样地。乔说：“
            - text: 河水已经上涨，所有队伍只能走桥和高岸道路，绝不能涉水。”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 安娜拿出带有伊莱气味的干净芦苇样品盒。
            - text: 其他搜救者退到远处，免得起点附近混入太多新的气味。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 苔苔抬起鼻子嗅了嗅空气，随后沿高岸向下游拉动牵引绳。安娜说：“
            - text: 它在追随空气里的气味，不是地面上一条看得见的脚印。”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 来到河湾，苔苔突然停下，面向水面做出约定的提示动作。乔说：“
            - text: 那伊莱一定就在下游。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 安娜奖励了苔苔，却让队伍留在原处。安娜说：“
            - text: 苔苔在这里闻到了伊莱。那只能说明气味到了这里，不能说明伊莱就在这里。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 德夫的飘带杆从对岸方向斜斜倒向苔苔。德夫说：“
            - text: 横风可能先把气味送过河面，再顺着河湾转向下游。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 他们站在安全的高处比较芦苇、高岸、水流和风。
            - text: 河湾能同时改变空气与气味的方向，却不能说明伊莱走过哪里。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 队伍走过人行桥，苔苔又在南岸芦苇旁发出提示。安娜说：“
            - text: 两岸都有气味。现在看来，德夫说的横风比‘人一定在下游’更说得通。”
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 乔做出两个黏土模型：一个表示伊莱过河，另一个只表示气味过河。乔说：“
            - text: 两种情况都说得通，那就两边都查。”
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 不同队伍沿桥和高岸分头行动，始终避开湍急河水。
            - text: 一队检查安全出入口，另一队搜索下游受遮挡的地面。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 德夫用彩色石子记录每个提示位置，同时观察飘带方向。德夫说：“
            - text: 每次提示都把风向记下来。下一次提示前，风可能已经变了。”
    - id: p13
      illustration: p13
      paragraphs:
        - content:
            - text: 小雨到来，飘带转向了新的方向。
            - text: 现在出现的提示，不能只用早先的风向来解释。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: 苔苔进入浓密芦苇仔细搜索，后来失去气味，回头望向安娜。安娜说：“
            - text: 它闻不到了。让它自己找，别逼它替我们证明什么。”
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 安娜让苔苔在干燥垫子上休息，给它喝水并检查脚掌。乔说：“
            - text: 让它歇会儿。累了就容易漏掉东西。”
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: 第二支搜救犬队走上另一段高岸。
            - text: 这样，大家不必只跟着苔苔的路线找。
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: 休息后，苔苔在一条狭窄
            - vocabulary:
                id: channel
                text: 河道
            - text: 的入口附近提示。
            - text: 一排柳树挡住了上方部分气流。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: 安娜和德夫把新提示与模型、飘带记录放在一起比较。德夫说：“
            - text: 前后两种风，都可能把气味送到这条支流附近。”
    - id: p19
      illustration: p19
      paragraphs:
        - content:
            - text: 乔忽然停住脚，朝柳树后望去。乔说：“
            - text: 柳树后面有座旧防洪石屋，高岸路可以直接过去。”
    - id: p20
      illustration: p20
      paragraphs:
        - content:
            - text: 队伍沿安全道路前进，终于看见伊莱在干燥的石门口挥手。伊莱说：“
            - text: 我听见了你们，可河声太大，你们没有听见我。”
    - id: p21
      illustration: p21
      paragraphs:
        - content:
            - text: 伊莱展示断裂的靴带，解释自己为什么没有离开。伊莱说：“
            - text: 穿着不稳的靴子走湿地太危险，留在避难处更安全。”
    - id: p22
      illustration: p22
      paragraphs:
        - content:
            - text: 德夫把提示石子、风向和搜索区域排在河流模型周围。安娜说：“
            - text: 提示、风向和安全路线合在一起，才把我们带到这里。少一项都不行。”
    - id: p23
      illustration: p23
      paragraphs:
        - content:
            - text: 两支犬队和搜救者平安会合。苔苔喝了水，安娜蹲下来轻轻拍了拍它。乔说：“
            - text: 我把第一次提示当成了地址。它不是。”
    - id: p24
      illustration: p24
      paragraphs:
        - content:
            - text: 日落时，所有人沿高岸小路返回，避开仍然湍急的河水。安娜说：“
            - text: 慢点，苔苔。我们走高岸路回家。”
