schema_version: 1
required: true
sources:
  - url: https://www.nist.gov/glossary-term/18316
    title: Air Scenting
    publisher: U.S. National Institute of Standards and Technology
    supports: An air-scent canine searches for target odor carried on air currents and works the odor cone toward its source.
  - url: https://www.oregon.gov/OEM/Documents/ossa_k9_standard.pdf
    title: Search and Rescue Canine Certification Standards
    publisher: Oregon State Sheriffs' Association and Oregon Office of Emergency Management
    supports: A handler evaluates terrain, vegetation, weather, and wind and must interpret the dog's alert rather than treating it as a self-explaining location.
  - url: https://www.fema.gov/pdf/emergency/usr/appen_a.pdf
    title: FEMA National US&R Response System Rescue Specialist Training Manual Appendix A
    publisher: U.S. Federal Emergency Management Agency
    supports: Canine performance varies with working conditions, dogs need rest periods, and repeated or confirming searches can improve confidence.
notes: The characters and river valley are fictional. The story avoids claiming that an alert marks an exact location, that one dog can complete a rescue alone, or that wind remains constant. Search access and water decisions stay with the coordinated human team.
