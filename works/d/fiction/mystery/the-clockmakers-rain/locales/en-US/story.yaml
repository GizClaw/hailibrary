schema_version: 1
language: en-US
writer: silver-bell
title: The Clockmaker's Rain
summary: Silver drops fall inside a clock workshop after Oren removes a noisy gear. Nia finds the empty space, cleans the gear, and restores the clocks and their strange silver cloud.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and clear, timbre: calm adult voice, pace: medium, pitch: medium}}
  nia: {display_name: Nia, tts: {delivery: alert and thoughtful, timbre: bright young voice, pace: medium, pitch: medium-high}}
  oren: {display_name: Oren, tts: {delivery: dry and patient, timbre: mellow older voice, pace: slow, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Nia opens the workshop door."}, {speaker: narrator, text: "Tiny silver drops fall inside."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Each drop vanishes on the floor."}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Oren studies a stopped clock."}, {speaker: narrator, text: "Nia catches one drop in a bowl."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "A bell rings."}, {speaker: narrator, text: "The drop jumps from the bowl."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "Nia compares the drops with moving pendulums."}]}
  - id: p06
    illustration: p06
    lines:
      - speaker: narrator
        content: [{text: "She finds an empty space between the "}, {vocabulary: {id: gear, text: gears}}, {text: "."}]
  - id: p07
    illustration: p07
    lines:
      - speaker: oren
        content: [{text: "I removed one noisy "}, {vocabulary: {id: gear, text: gear}}, {text: " last night."}]
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Nia cleans the dusty gear."}, {speaker: narrator, text: "Oren holds the lamp."}]}
  - id: p09
    illustration: p09
    lines:
      - speaker: narrator
        content: [{text: "They return the clean "}, {vocabulary: {id: gear, text: gear}}, {text: " to its axle."}]
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "The clocks begin moving together."}, {speaker: narrator, text: "Silver drops rise."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "The drops gather into a bright cloud."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "The cloud becomes a shining ornament."}]}
chapters:
  - {id: ch01, title: Silver Rain, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: The Missing Gear, page_refs: [p07, p08, p09, p10, p11, p12]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: "What falls inside the workshop?", answer: "Tiny silver drops.", page_refs: [p01]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What does Nia do before replacing the gear?", answer: "She cleans it.", page_refs: [p08, p09]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why do the drops rise again?", answer: "The clean gear makes the clocks move together.", page_refs: [p09, p10]}
