schema_version: 2
language: en-US
writer: silver-bell
title: The Clockmaker's Rain
summary: Silver drops fall inside a clock workshop after Oren removes a noisy gear. Nia finds the empty space, cleans the gear, and restores the clocks and their strange silver cloud.
chapters:
  - id: ch01
    title: Silver Rain
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: The Missing Gear
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What falls inside the workshop?
    answer: Tiny silver drops.
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Nia do before replacing the gear?
    answer: She cleans it.
    page_refs:
      - p08
      - p09
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why do the drops rise again?
    answer: The clean gear makes the clocks move together.
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Nia opens the workshop door. Tiny silver drops fall inside.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Each shining drop vanishes when it touches the floor.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Oren studies a stopped clock while Nia catches one drop.
    - id: p04
      illustration: p04
      paragraphs:
        - text: A small bell rings. The drop jumps from the bowl.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Nia watches the drops and the moving pendulums.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "Then she finds an empty space among the brass "
            - vocabulary:
                id: gear
                text: gears
            - text: .
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Oren says, “I removed one noisy "
            - vocabulary:
                id: gear
                text: gear
            - text: " last night.”"
    - id: p08
      illustration: p08
      paragraphs:
        - text: Nia cleans the dusty gear while Oren holds the lamp.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "They return the clean "
            - vocabulary:
                id: gear
                text: gear
            - text: " to the empty axle."
    - id: p10
      illustration: p10
      paragraphs:
        - text: Because the clocks turn together again, the silver drops rise.
    - id: p11
      illustration: p11
      paragraphs:
        - text: The drops gather into a bright cloud.
    - id: p12
      illustration: p12
      paragraphs:
        - text: The cloud becomes a shining ornament above the moving clocks.
