title: The Clockmaker's Rain
summary: Nia follows impossible silver rain to a missing gear in Oren's workshop.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and observant, timbre: clear adult voice, pace: medium, pitch: medium}}
  nia: {display_name: Nia, tts: {delivery: alert and thoughtful, timbre: focused young-adult voice, pace: medium, pitch: medium-high}}
  oren: {display_name: Oren, tts: {delivery: dry and patient, timbre: textured older voice, pace: medium-slow, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Silver rain fell inside the clock workshop."}]}
  - {id: p02, illustration: p02, lines: [{speaker: nia, text: "Each drop disappears when it reaches the floor."}]}
  - {id: p03, illustration: p03, lines: [{speaker: oren, text: "The clocks stopped at dawn, but the roof is dry."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "A bell rang, and the drop in Nia's bowl jumped."}]}
  - {id: p05, illustration: p05, lines: [{speaker: nia, text: "The drops are keeping the clocks' lost rhythm."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, content: [{text: "She found an empty axle where a "}, {vocabulary: {id: gear, text: gear}}, {text: " belonged."}]}]}
  - {id: p07, illustration: p07, lines: [{speaker: oren, text: "I took out the noisy gear, then forgot it."}]}
  - {id: p08, illustration: p08, lines: [{speaker: nia, text: "Dust had jammed its teeth. No wonder it squealed."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "They cleaned the gear and returned it to the axle."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "The clocks moved, and every silver drop rose."}]}
  - {id: p11, illustration: p11, lines: [{speaker: oren, text: "The tower has found its rhythm again."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "The rain became a shining cloud above twelve steady clocks."}]}
