  - {id: ch03, title: Time Rises, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: "Where does the rain fall?", choices: [Inside the workshop, In the street, Under a bridge], answer: "Inside the workshop.", page_refs: [p01]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: "Why did Oren remove the gear?", answer: "It was noisy.", page_refs: [p07]}
  - {id: q03, type: character-motive, speaker: narrator, prompt: "Why does Nia examine the axles?", answer: "She is looking for the cause of the stopped clocks.", page_refs: [p03, p06]}
  - {id: q04, type: short-answer, speaker: narrator, prompt: "What evidence connects the drops to the clocks?", answer: "A drop jumps when the bell rings, and the drops rise when the clocks restart.", page_refs: [p04, p10]}
