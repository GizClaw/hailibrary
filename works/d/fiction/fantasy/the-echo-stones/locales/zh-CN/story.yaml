schema_version: 2
language: zh-CN
writer: 月芽笺
title: 会回应的石头
summary: 浓雾把狐狸和山羊隔开。狐狸误把回声当成伙伴的回答，后来想起约好的灯光和铃声，终于安全找到山羊。
chapters:
  - id: ch01
    title: 重复的声音
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 灯光和铃声
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 山羊带着什么？
    answer: 一只银铃。
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 发现旧脚印后，狐狸做了什么？
    answer: 停在空地上，高高举起灯。
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 狐狸为什么不再跟着声音走？
    answer: 它发现那个声音只是回声。
    page_refs:
      - p04
      - p05
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 狐狸拿着琥珀灯，山羊带着银铃。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 浓雾升起来，两个朋友看不见彼此。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 狐狸停在平地上喊：“山羊，你在哪里？”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 弯曲的石壁送回一道
            - vocabulary:
                id: echo
                text: 回声
            - text: 。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 狐狸跟着重复的声音走。它只找到旧脚印。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 同样的
            - vocabulary:
                id: echo
                text: 回声
            - text: 又回来了。狐狸说：“那是我自己的声音。”
    - id: p07
      illustration: p07
      paragraphs:
        - text: 狐狸没有乱跑，停在安全的空地上。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 狐狸想起约定，高高举起琥珀灯。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 山羊看见灯光，摇响了银铃。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 狐狸跟着铃声走。山羊望着琥珀色的灯光。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 两个朋友终于在空地上相遇。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 他们沿着宽路一起走出了浓雾。
