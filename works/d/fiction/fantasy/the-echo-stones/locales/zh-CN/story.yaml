schema_version: 1
language: zh-CN
writer: 松果先生
title: 雾谷里的回声
summary: 狐狸在雾谷里误把回声当成山羊的回答，认出回声后，靠事先约好的灯光和铃声找到伙伴。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 沉静神秘, timbre: 清晰有共鸣的成年声音, pace: 中慢速, pitch: 中低音}}
  fox: {display_name: 狐狸, tts: {delivery: 机敏认真, timbre: 明亮的成年声音, pace: 中速, pitch: 中音}}
  goat: {display_name: 山羊, tts: {delivery: 稳定务实, timbre: 厚实的成年声音, pace: 中慢速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 狐狸和山羊进雾谷寻找发光石。}, {speaker: narrator, text: 它们约好，走散了就举灯、摇铃。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 一阵浓雾把它们隔开了。}]}
  - {id: p03, illustration: p03, lines: [{speaker: fox, text: 山羊，你在哪里？}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, content: [{text: 岩壁间响起一阵}, {vocabulary: {id: echo, text: 回声}}, {text: 。}]}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 狐狸追着声音跑，却回到原地。}]}
  - {id: p06, illustration: p06, lines: [{speaker: fox, text: 不对，每次传回来的声音，都跟我说的话一样。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 狐狸停下脚步，不再追声音。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 狐狸想起约定，马上举起灯。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 雾里很快传来清脆的铃声。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 狐狸循着铃声走，山羊也朝灯光走来。}]}
  - {id: p11, illustration: p11, lines: [{speaker: goat, text: 这回可不是你的回声。}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: 它们终于碰面，一起走出了雾谷。}]}
chapters:
  - {id: ch01, title: 雾中的回答, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 回到原地, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: 两种信号, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: 狐狸起初把什么当成山羊的回答？, choices: [岩壁间的回声, 风吹树叶的声音, 自己的脚步声], answer: 岩壁间的回声。, page_refs: [p03, p04]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 狐狸发现自己回到原地后，先做了什么？, answer: 它停下脚步，不再追声音。, page_refs: [p05, p07]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 狐狸为什么不再追着回答跑？, answer: 因为它发现那只是重复自己话语的回声。, page_refs: [p04, p05, p06, p07]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: 山羊为什么摇铃？, answer: 为了按照事先的约定，让狐狸循着铃声找到它。, page_refs: [p01, p08, p09, p10]}
