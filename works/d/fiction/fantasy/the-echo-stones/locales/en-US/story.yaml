"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "Fox carries an amber lamp. Goat carries a silver bell."
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "Thick ground mist hides the friends from each other."
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "text": "Fox calls from a flat clearing, “Goat, where are you?”"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "content":
            - "text": "An "
            - "vocabulary":
                "id": "echo"
                "text": "echo"
            - "text": " returns from a curved rock wall."
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "Fox follows the repeated call but finds only old footprints."
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "content":
            - "text": "The same "
            - "vocabulary":
                "id": "echo"
                "text": "echo"
            - "text": " comes back. Fox says, “That was my own call.”"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "Fox stops in a safe open place instead of running."
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "Fox remembers their plan and raises the amber lamp."
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "Goat sees its glow and rings the silver bell."
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "Fox follows the bell while Goat watches the amber light."
    - "id": "p11"
      "illustration": "p11"
      "paragraphs":
        - "text": "The two friends meet in the clearing."
    - "id": "p12"
      "illustration": "p12"
      "paragraphs":
        - "text": "They leave the mist together on a broad path."
