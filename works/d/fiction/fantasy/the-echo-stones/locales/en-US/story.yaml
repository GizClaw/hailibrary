schema_version: 2
language: en-US
writer: silver-bell
title: The Echo Stones
summary: Mist separates Fox and Goat among curved rocks. Fox mistakes an echo for Goat's call, then remembers their lamp-and-bell signal and finds Goat safely.
chapters:
  - id: ch01
    title: A Repeated Voice
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: Lamp and Bell
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What does Goat carry?
    answer: A silver bell.
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Fox do after finding old footprints?
    answer: Fox stops and raises the lamp.
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does Fox stop following the voice?
    answer: Fox learns the voice is an echo.
    page_refs:
      - p04
      - p05
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Fox carries an amber lamp. Goat carries a silver bell.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Thick ground mist hides the friends from each other.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Fox calls from a flat clearing, “Goat, where are you?”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "An "
            - vocabulary:
                id: echo
                text: echo
            - text: " returns from a curved rock wall."
    - id: p05
      illustration: p05
      paragraphs:
        - text: Fox follows the repeated call but finds only old footprints.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "The same "
            - vocabulary:
                id: echo
                text: echo
            - text: " comes back. Fox says, “That was my own call.”"
    - id: p07
      illustration: p07
      paragraphs:
        - text: Fox stops in a safe open place instead of running.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Fox remembers their plan and raises the amber lamp.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Goat sees its glow and rings the silver bell.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Fox follows the bell while Goat watches the amber light.
    - id: p11
      illustration: p11
      paragraphs:
        - text: The two friends meet in the clearing.
    - id: p12
      illustration: p12
      paragraphs:
        - text: They leave the mist together on a broad path.
