schema_version: 1
language: zh-CN
writer: 月芽笺
title: 飘带转向的山口
summary: 三条山路都没有路牌。乔观察路边飘带和落叶，发现高处山口有石壁挡风，便带着提陶碗的丹安全走到村子。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 细致明快, timbre: 清楚的成年声音, pace: 中速, pitch: 中音}}
  qiao: {display_name: 乔, tts: {delivery: 好奇有条理, timbre: 明亮的年轻声音, pace: 中速, pitch: 中高音}}
  dan: {display_name: 丹, tts: {delivery: 务实爽朗, timbre: 温厚的成年声音, pace: 中慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 乔来到三条山路前。}, {speaker: narrator, text: 路口没有路牌。}]}
  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content: [{text: 每条路旁都挂着一条}, {vocabulary: {id: streamer, text: 飘带}}, {text: 。}]
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 低处的飘带垂着。}, {speaker: narrator, text: 落叶堵住了小路。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 中间的飘带左右乱甩。}, {speaker: narrator, text: 山崖迎着大风。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 高处的飘带稳稳指向前方。}, {speaker: narrator, text: 两面石壁护着山口。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 乔比较飘带和落叶。}, {speaker: qiao, text: 高处的路风更小。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 丹提着一篮陶碗来了。}, {speaker: dan, text: 走哪条路好呢？}]}
  - {id: p08, illustration: p08, lines: [{speaker: qiao, text: 看那条稳稳的飘带。}, {speaker: qiao, text: 石壁能挡住大风。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 他们走进宽阔的高山口。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 一阵大风越过山脊。}, {speaker: narrator, text: 石壁护住了他们。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 他们到了陶器村。}, {speaker: narrator, text: 每只碗都完好。}]}
  - id: p12
    illustration: p12
    lines:
      - speaker: narrator
        content: [{text: 村民又在路口挂上新}, {vocabulary: {id: streamer, text: 飘带}}, {text: 。}]
chapters:
  - {id: ch01, title: 三条山路, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 挡风的山口, page_refs: [p07, p08, p09, p10, p11, p12]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 哪条飘带稳稳指向前方？, answer: 高处的飘带。, page_refs: [p05]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 选路前，乔先做了什么？, answer: 比较三条飘带和路上的情况。, page_refs: [p03, p04, p05, p06]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 陶碗为什么没有摔坏？, answer: 高处山口的石壁挡住了大风。, page_refs: [p08, p09, p10, p11]}
