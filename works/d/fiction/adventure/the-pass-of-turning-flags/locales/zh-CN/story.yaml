schema_version: 2
language: zh-CN
writer: 月芽笺
title: 飘带转向的山口
summary: 三条山路都没有路牌。乔观察路边飘带和落叶，发现高处山口有石壁挡风，便带着提陶碗的丹安全走到村子。
chapters:
  - id: ch01
    title: 三条山路
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 挡风的山口
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 哪条飘带稳稳指向前方？
    answer: 高处的飘带。
    page_refs:
      - p05
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 选路前，乔先做了什么？
    answer: 比较三条飘带和路上的情况。
    page_refs:
      - p03
      - p04
      - p05
      - p06
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 陶碗为什么没有摔坏？
    answer: 高处山口的石壁挡住了大风。
    page_refs:
      - p08
      - p09
      - p10
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 乔来到三条山路前。路口一块路牌也没有。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 每条路旁都挂着一条
            - vocabulary:
                id: streamer
                text: 飘带
            - text: 。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 低处的飘带垂着，落叶盖住了小路。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 中间的飘带左右乱甩。旁边是迎风的山崖。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 高处的飘带很稳，两面石壁护着山口。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 乔看过飘带和落叶，说：“高处的路风小。”
    - id: p07
      illustration: p07
      paragraphs:
        - text: 丹提着一篮陶碗走来，问：“我们走哪条路？”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 乔指着高处说：“走这条。石壁能挡风。”
    - id: p09
      illustration: p09
      paragraphs:
        - text: 他们一起走进宽阔的高山口。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 大风越过山脊，两面石壁护住了他们。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 他们到了陶器村，每只碗都完好。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 村民又在路口挂上几条新
            - vocabulary:
                id: streamer
                text: 飘带
            - text: 。
