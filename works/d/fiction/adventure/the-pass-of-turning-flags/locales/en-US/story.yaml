schema_version: 2
language: en-US
writer: silver-bell
title: The Pass of Turning Flags
summary: Qiao studies three streamers at an unsigned mountain fork. The steadiest streamer points through a sheltered pass, so Qiao helps Dan carry his bowls safely to the village.
chapters:
  - id: ch01
    title: Three Paths
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: The Sheltered Pass
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: Which streamer points steadily?
    answer: The high streamer.
    page_refs:
      - p05
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Qiao do before choosing?
    answer: Qiao compares the streamers and paths.
    page_refs:
      - p03
      - p04
      - p05
      - p06
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why do the bowls arrive whole?
    answer: The rock walls shelter the high path from wind.
    page_refs:
      - p08
      - p09
      - p10
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Qiao reaches a fork with three mountain paths. None has a sign.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "A cloth "
            - vocabulary:
                id: streamer
                text: streamer
            - text: " hangs beside each path."
    - id: p03
      illustration: p03
      paragraphs:
        - text: The low streamer droops, and leaves cover its path.
    - id: p04
      illustration: p04
      paragraphs:
        - text: The middle streamer whips sideways above an open ledge.
    - id: p05
      illustration: p05
      paragraphs:
        - text: The high streamer stays steady between two rock walls.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Qiao studies the clues. She says, “The high path has less wind.”
    - id: p07
      illustration: p07
      paragraphs:
        - text: Dan arrives with a basket of bowls. He asks, “Which path should we take?”
    - id: p08
      illustration: p08
      paragraphs:
        - text: Qiao points high. She says, “Take this path. The rocks shelter it.”
    - id: p09
      illustration: p09
      paragraphs:
        - text: They enter the wide high pass together.
    - id: p10
      illustration: p10
      paragraphs:
        - text: A gust crosses the ridge. The rock walls shelter them.
    - id: p11
      illustration: p11
      paragraphs:
        - text: They reach the pottery village with every bowl whole.
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: "The villagers hang more plain "
            - vocabulary:
                id: streamer
                text: streamers
            - text: " at the fork."
