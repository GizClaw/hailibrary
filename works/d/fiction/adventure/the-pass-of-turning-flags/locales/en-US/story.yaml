"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "Qiao reaches a fork with three mountain paths. None has a sign."
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "content":
            - "text": "A cloth "
            - "vocabulary":
                "id": "streamer"
                "text": "streamer"
            - "text": " hangs beside each path."
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "text": "The low streamer droops, and leaves cover its path."
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "The middle streamer whips sideways above an open ledge."
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "The high streamer stays steady between two rock walls."
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "Qiao studies the clues. She says, “The high path has less wind.”"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "Dan arrives with a basket of bowls. He asks, “Which path should we take?”"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "Qiao points high. She says, “Take this path. The rocks shelter it.”"
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "They enter the wide high pass together."
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "A gust crosses the ridge. The rock walls shelter them."
    - "id": "p11"
      "illustration": "p11"
      "paragraphs":
        - "text": "They reach the pottery village with every bowl whole."
    - "id": "p12"
      "illustration": "p12"
      "paragraphs":
        - "content":
            - "text": "The villagers hang more plain "
            - "vocabulary":
                "id": "streamer"
                "text": "streamers"
            - "text": " at the fork."
