"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "A yellow ribbon hung between two trees. It marked the end of the woodland path."
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "Hare ran by Tortoise and laughed. “Should I wait for you?” he asked."
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "Tortoise looked down the path. “Let’s have a "
            - "vocabulary":
                "id": "race"
                "text": "race"
            - "text": ",” she said."
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "They chose a red leaf for the start. When it fell, they went down the path."
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "Soon, Hare rounded a bend. Tortoise kept moving behind him."
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "By a tree, Hare stopped and looked back. He could barely see Tortoise. So he flopped onto the soft grass."
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "While Hare slept, Tortoise passed the tree and kept going."
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "A rustle woke Hare. His ears shot up. Tortoise’s nose nearly touched the ribbon!"
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "Hare ran after her. Tortoise touched the yellow ribbon first."
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "“You won,” Hare said. He untied the ribbon and put it over Tortoise’s shell."
