        delivery: warm and alert, with each change in the race made clear
        timbre: gentle adult voice with a clear center
        pace: calm medium-slow
        pitch: medium
    tortoise:
      display_name: Tortoise
      tts:
        delivery: quiet and direct, with steady confidence
        timbre: soft rounded voice
        pace: measured and slow
        pitch: medium-low
    hare:
      display_name: Hare
      tts:
        delivery: playful at first, then open and sincere
        timbre: light bright voice
        pace: quick
        pitch: medium-high
