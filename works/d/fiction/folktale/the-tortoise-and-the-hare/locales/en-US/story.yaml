schema_version: 2
language: en-US
writer: manypath-lantern
title: The Tortoise and the Hare
summary: Hare stops to nap during a race. Tortoise does not stop and touches the yellow ribbon first.
chapters:
  - id: ch01
    title: The Red Leaf
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: Along the Path
    page_refs: [p05, p06, p07, p08, p09, p10]
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What hangs between the two trees?
    answer: A yellow ribbon.
    page_refs: [p01]
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Hare do after he looks back?
    answer: He lies on the grass.
    page_refs: [p06]
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does Tortoise touch the ribbon first?
    answer: Hare falls asleep, but Tortoise does not stop.
    page_refs: [p06, p07, p08, p09]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: A yellow ribbon hung between two trees. It marked the end of the woodland path.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Hare ran by Tortoise and laughed. “Should I wait for you?” he asked.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Tortoise looked down the path. “Let’s have a "
            - vocabulary: {id: race, text: race}
            - text: ",” she said."
    - id: p04
      illustration: p04
      paragraphs:
        - text: They chose a red leaf for the start. When it fell, they went down the path.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Soon, Hare rounded a bend. Tortoise kept moving behind him.
    - id: p06
      illustration: p06
      paragraphs:
        - text: By a tree, Hare stopped and looked back. He could barely see Tortoise. So he flopped onto the soft grass.
    - id: p07
      illustration: p07
      paragraphs:
        - text: While Hare slept, Tortoise passed the tree and kept going.
    - id: p08
      illustration: p08
      paragraphs:
        - text: A rustle woke Hare. His ears shot up. Tortoise’s nose nearly touched the ribbon!
    - id: p09
      illustration: p09
      paragraphs:
        - text: Hare ran after her. Tortoise touched the yellow ribbon first.
    - id: p10
      illustration: p10
      paragraphs:
        - text: “You won,” Hare said. He untied the ribbon and put it over Tortoise’s shell.
