schema_version: 2
language: zh-CN
writer: 百径灯
title: 龟兔赛跑
summary: 野兔在赛跑中睡着了。乌龟没有停下，先碰到黄布带。
chapters:
  - id: ch01
    title: 红叶落地
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 龟背上的黄布带
    page_refs: [p05, p06, p07, p08, p09, p10]
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 两棵树中间挂着什么？
    answer: 一条黄布带。
    page_refs: [p01]
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 野兔回头看过以后做了什么？
    answer: 它在树下的软草上躺好。
    page_refs: [p06]
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 乌龟为什么先碰到黄布带？
    answer: 野兔睡着了，乌龟一直没有停。
    page_refs: [p06, p07, p08, p09]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小路尽头，两棵树中间挂着一条黄布带。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 野兔跑在前面，回头笑着问：“要我等你吗？”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "乌龟看着远处的黄布带，说：“来"
            - vocabulary: {id: race, text: 赛跑}
            - text: "吧！”"
    - id: p04
      illustration: p04
      paragraphs:
        - text: 它们先说好：红叶落地就出发。红叶刚落地，就一起出发了。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 野兔很快跑远了。乌龟还在后面，却没有停。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 野兔回头一看，乌龟还远着呢。它就在树下的软草上躺好。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 没多久，野兔就睡着了。乌龟从树下走过，没有停下。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 野兔醒了。乌龟离黄布带不远了。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 野兔又跑起来，乌龟却先碰到黄布带。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 野兔停下，说：“这次你先到。”说完，解开布带，轻轻放到乌龟背上。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切清楚，留意比赛中每一次变化
        timbre: 温暖清亮的成年声音
        pace: 平稳的中慢速
        pitch: 中音
    tortoise:
      display_name: 乌龟
      tts:
        delivery: 话少而坚定，不急着争辩
        timbre: 柔和圆润的声音
        pace: 从容的慢速
        pitch: 中低音
    hare:
      display_name: 野兔
      tts:
        delivery: 开始时爱玩，最后坦然认真
        timbre: 明亮轻巧的声音
        pace: 轻快
        pitch: 中高音
