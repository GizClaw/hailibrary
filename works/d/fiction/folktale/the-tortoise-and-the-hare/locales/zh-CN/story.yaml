"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "小路尽头，两棵树中间挂着一条黄布带。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "野兔跑在前面，回头笑着问：“要我等你吗？”"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "乌龟看着远处的黄布带，说：“来"
            - "vocabulary":
                "id": "race"
                "text": "赛跑"
            - "text": "吧！”"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "它们先说好：红叶落地就出发。红叶刚落地，就一起出发了。"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "野兔很快跑远了。乌龟还在后面，却没有停。"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "野兔回头一看，乌龟还远着呢。它就在树下的软草上躺好。"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "没多久，野兔就睡着了。乌龟从树下走过，没有停下。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "野兔醒了。乌龟离黄布带不远了。"
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "野兔又跑起来，乌龟却先碰到黄布带。"
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "野兔停下，说：“这次你先到。”说完，解开布带，轻轻放到乌龟背上。"
