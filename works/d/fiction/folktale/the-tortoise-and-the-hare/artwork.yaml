schema_version: 1
style: bold-ink-comic
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  tortoise: small olive-green tortoise, golden segmented shell with a deep teal rim, red neckerchief
  hare: tall tan hare, black-tipped long ears, white muzzle, cyan scarf
  finish: one plain yellow cloth ribbon tied between two pale birch trees at the end of the same woodland path
  setting: sunny woodland path with saturated cyan sky, red and yellow leaves, and deep ink-black shadows
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Tortoise and Hare race along the woodland path toward the yellow ribbon, with Tortoise determined and Hare playful.
  - id: p01
    file: artwork/p01.webp
    scene: A plain yellow cloth ribbon stretches between two pale birch trees at the end of a sunny woodland path.
  - id: p02
    file: artwork/p02.webp
    scene: Hare runs ahead of Tortoise on the path and laughs playfully while Tortoise looks up.
  - id: p03
    file: artwork/p03.webp
    scene: Tortoise looks from Hare toward the distant yellow ribbon and calmly proposes the race.
  - id: p04
    file: artwork/p04.webp
    scene: A red leaf reaches the ground as Hare and Tortoise start side by side toward the ribbon.
  - id: p05
    file: artwork/p05.webp
    scene: Hare runs far ahead on the curving path while Tortoise continues behind with steady steps.
  - id: p06
    file: artwork/p06.webp
    scene: Hare lies down on soft grass beneath a tree because Tortoise is still far behind on the path.
  - id: p07
    file: artwork/p07.webp
    scene: Hare sleeps beneath the tree while Tortoise quietly passes and keeps moving toward the ribbon.
  - id: p08
    file: artwork/p08.webp
    scene: Hare wakes in surprise and sees Tortoise already near the yellow ribbon.
  - id: p09
    file: artwork/p09.webp
    scene: Tortoise touches the yellow ribbon first as Hare runs up just behind.
  - id: p10
    file: artwork/p10.webp
    scene: Hare gently places the untied yellow ribbon across Tortoise's golden shell, accepting the result.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - cover and all 10 pages inspected at local pixels
      - no visible text letters numbers logos captions speech bubbles or watermarks
      - tortoise shell neckerchief and hare ears muzzle scarf remain continuous
      - ribbon path order nap cause finish order and final gesture match the scenes
      - child-safe anatomy expressions and actions verified
