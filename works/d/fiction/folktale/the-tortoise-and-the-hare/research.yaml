    title: The Hare & the Tortoise, in The Aesop for Children
    creator: Aesop, with pictures by Milo Winter
    edition: Chicago, Rand McNally & Co., 1919
    publisher: Library of Congress
    url: https://read.gov/aesop/025.html
    rights: Public domain in the United States, as identified by the Library of Congress.
    supports:
      - The consulted 1919 version contains the inherited sequence of a proposed race, Hare's nap, Tortoise's continued movement, and Tortoise reaching the goal first.
  - id: loc-1919-record
    title: The Aesop for Children
    creator: Aesop and Milo Winter
    edition: Chicago, Rand McNally & Co., 1919; LCCN 19014083
    publisher: Library of Congress
    url: https://www.loc.gov/item/19014083/
    supports:
      - The exact consulted book was published by Rand McNally in 1919, is attributed to Aesop, and is in the Library of Congress public-domain collection.
  - id: aesopica-perry-226
    title: The Tortoise and the Hare — Perry 226
    publisher: Aesopica, compiled by Laura Gibbs
    url: https://www.mythfolklore.net/aesopica/perry/226.htm
