      - This separately consulted public-domain English version was used only to identify and avoid its wording and sentence frames while retaining the traditional race, sleep, continued movement, and win.
notes:
  - No source moral is reproduced; the result is carried by the characters' choices and the final ribbon action.
  - The two locale drafts were written independently from the retained plot beats and fixed artwork scenes.
  - Talking animals and an organized woodland race are declared story conventions, not claims about wild animal behavior.
