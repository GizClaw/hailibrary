schema_version: 1
required: true
reason: This work retells the traditional Aesopic fable The Hare and the Tortoise, so its provenance, catalogue number, retained plot, and consulted public-domain editions must be explicit.
tale:
  traditional_name: The Hare and the Tortoise
  attribution: Aesop
  cultural_origin: Ancient Greek Aesopic tradition
  catalogue:
    system: Perry Index
    number: 226
  retained_plot_beats:
    - Hare laughs about Tortoise's pace, and Tortoise proposes a race.
    - Hare moves far ahead, then lies down and falls asleep.
    - Tortoise keeps moving while Hare sleeps.
    - Tortoise reaches the agreed end first.
    - Hare accepts the result.
  hai_library_inventions:
    - The yellow cloth ribbon between two trees marks the end.
    - A falling red leaf is the agreed start signal.
    - Hare unties the ribbon and lays it across Tortoise's shell.
sources:
