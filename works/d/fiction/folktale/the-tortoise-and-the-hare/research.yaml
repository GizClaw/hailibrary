      - The catalogue cross-reference includes Chambry 352 in Greek, supporting placement in the Greek Aesopic tradition.
  - id: gutenberg-jones-1912
    title: Aesop's Fables, A New Translation by V. S. Vernon Jones
    creator: Aesop; translated by V. S. Vernon Jones
    edition: London, William Heinemann; New York, Doubleday, Page & Co., 1912; Project Gutenberg eBook 11339
    publisher: Project Gutenberg
    url: https://www.gutenberg.org/files/11339/old/11339-h/11339-h.htm
