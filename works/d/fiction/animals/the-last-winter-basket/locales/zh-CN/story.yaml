schema_version: 2
language: zh-CN
writer: 月芽笺
title: 冬天最后一篮坚果
summary: 松鼠只剩一篮坚果。田鼠的存粮被雨淋坏后，獾带来面粉交换。松鼠把坚果分成四份，让三个邻居都备好了食物。
chapters:
  - id: ch01
    title: 最后一篮
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 分成四份
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 店里还剩什么？
    answer: 一篮坚果。
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 獾带来面粉后，松鼠做了什么？
    answer: 把坚果分成四份。
    page_refs:
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 三个邻居为什么都有饭吃？
    answer: 獾拿面粉交换，松鼠又分好了坚果。
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 松鼠的店里只剩一
            - vocabulary:
                id: basket
                text: 篮子
            - text: 坚果。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 雪云在窗外聚拢。松鼠小声说：“这些坚果得省着吃。”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 田鼠抱着空空的红布包走进来。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 田鼠说：“架子倒了，雨水泡坏了坚果。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 松鼠看看田鼠，又看看窗外的雪云。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 松鼠仔细量了量
            - vocabulary:
                id: basket
                text: 篮子
            - text: 里的坚果。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 獾带来两袋面粉，说：“我拿这些换坚果。”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 松鼠把坚果分进四只碗。獾拿走两碗。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 松鼠留下一碗坚果和两袋面粉。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 田鼠拿起最后一碗，说：“春天我送新坚果。”
    - id: p11
      illustration: p11
      paragraphs:
        - text: 大雪落在三座小屋外。每个邻居都有饭吃。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 三根烟囱都升起暖暖的炊烟。
