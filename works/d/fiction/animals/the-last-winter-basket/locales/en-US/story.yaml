schema_version: 2
language: en-US
writer: silver-bell
title: The Last Winter Basket
summary: Squirrel has one last basket of nuts. When Vole loses a food store, Badger offers flour so Squirrel can divide the nuts and help all three homes through the snow.
chapters:
  - id: ch01
    title: One Basket Left
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: Four Shares
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What is left in the shop?
    answer: One basket of nuts.
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What happens after Badger brings flour?
    answer: Squirrel divides the nuts into four parts.
    page_refs:
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does each home have food?
    answer: Badger trades flour, and Squirrel divides the nuts.
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "One "
            - vocabulary:
                id: basket
                text: basket
            - text: " of nuts remains in Squirrel's shop."
    - id: p02
      illustration: p02
      paragraphs:
        - text: Snow clouds gather outside. Squirrel whispers, “These nuts must last.”
    - id: p03
      illustration: p03
      paragraphs:
        - text: Vole enters with an empty red bundle.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Vole says, “My shelf fell, and rain ruined the nuts.”
    - id: p05
      illustration: p05
      paragraphs:
        - text: Squirrel looks at Vole, then at the dark clouds.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "Squirrel measures the small "
            - vocabulary:
                id: basket
                text: basket
            - text: " carefully."
    - id: p07
      illustration: p07
      paragraphs:
        - text: Badger brings two flour sacks. “I can trade these for nuts,” he says.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Squirrel divides the nuts into four equal bowls. Badger takes two.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Squirrel keeps one bowl and the flour.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Vole takes the last bowl. “I will bring fresh nuts in spring,” she says.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Snow falls outside three homes. Each neighbor has a meal.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Warm smoke rises from all three chimneys.
