  badger: {display_name: Badger, tts: {delivery: low and generous, timbre: mellow adult voice, pace: slow, pitch: low-medium}}
  vole: {display_name: Vole, tts: {delivery: soft and earnest, timbre: gentle youthful voice, pace: slow, pitch: medium}}
