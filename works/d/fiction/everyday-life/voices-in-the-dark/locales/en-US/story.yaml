article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: The lights go out while June builds a box tower.
    - id: p02
      illustration: p02
      paragraphs:
        - text: "Because the fan stops, the room becomes hot and still."
    - id: p03
      illustration: p03
      paragraphs:
        - text: June bumps her tower because she cannot see it.
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Mom tells her to stay still, so June waits."
    - id: p05
      illustration: p05
      paragraphs:
        - text: Dad turns on his phone light. He points it at his face.
    - id: p06
      illustration: p06
      paragraphs:
        - text: His funny shadows make June almost laugh.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Mom finds a short candle and a clean glass jar.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Dad lights it while June stands safely behind Mom.
    - id: p09
      illustration: p09
      paragraphs:
        - text: The jar keeps the flame away from the curtain.
    - id: p10
      illustration: p10
      paragraphs:
        - text: "June still fears the dark balcony, so Mom waits nearby."
    - id: p11
      illustration: p11
      paragraphs:
        - text: Mrs. Wu laughs when Dad holds her fan backward.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Neighbors call from floor to floor. June knows they are close.
    - id: p13
      illustration: p13
      paragraphs:
        - text: June follows their voices toward the candle.
    - id: p14
      illustration: p14
      paragraphs:
        - text: She reaches Mom. They eat melon in the small light.
