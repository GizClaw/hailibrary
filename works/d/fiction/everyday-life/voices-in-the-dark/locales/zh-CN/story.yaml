schema_version: 3
language: zh-CN
writer: 月芽笺
title: 黑暗里的声音
summary: 突然停电让林林害怕，熟悉的声音和一支蜡烛陪她走过黑暗。
chapters:
  - id: ch01
    title: 变化
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 转折
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: picture
    prompt: 林林因为看不见，碰倒了什么？
    answer: 她碰倒了纸盒楼。
    page_refs:
      - p03
  - id: q02
    type: sequence
    prompt: 爸爸点火以前，妈妈找到了什么？
    answer: 妈妈找到了短蜡烛和干净的玻璃罐。
    page_refs:
      - p07
      - p08
  - id: q03
    type: cause-effect
    prompt: 林林为什么朝蜡烛走去？
    answer: 熟悉的声音引着她朝蜡烛走去。
    page_refs:
      - p12
      - p13
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林林搭纸盒楼时，屋里的灯突然灭了。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 风扇停了，所以房间又热又安静。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林林看不见纸盒，不小心碰倒了楼。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 妈妈叫她别动，林林就在原地等。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 爸爸打开手机灯，却先照亮了自己的脸。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 奇怪的影子让林林差点笑出来。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 妈妈找到短蜡烛和干净的玻璃罐。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 爸爸点火时，林林安全地站在妈妈身后。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 玻璃罐护着火苗，窗帘离得远远的。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 林林还怕黑阳台，所以妈妈在门边等她。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 爸爸拿反蒲扇，吴奶奶笑了。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 邻居隔着楼层说话，林林知道大家都在。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 林林跟着声音，慢慢走向蜡烛。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 她来到妈妈身边，在小小的光里吃西瓜。
