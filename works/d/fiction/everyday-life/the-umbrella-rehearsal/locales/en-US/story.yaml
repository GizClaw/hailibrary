schema_version: 2
language: en-US
writer: silver-bell
title: The Umbrella Rehearsal
summary: Water reaches Oma's chair beneath a tilted umbrella. Lina, Ben, and Oma test all three umbrellas at the same angle and discover that a loose stand causes the problem.
chapters:
  - id: ch01
    title: A Wet Chair
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: A Fair Test
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What gets wet first?
    answer: Oma's empty chair.
    page_refs:
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What do they change before testing?
    answer: They set the umbrellas at equal angles.
    page_refs:
      - p04
      - p05
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why did water reach the chair?
    answer: A loose stand tilted the umbrella.
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Lina sets chairs beneath three umbrellas. A community play begins soon.
    - id: p02
      illustration: p02
      paragraphs:
        - text: A shower wets Oma's empty chair. Lina cries, “The green umbrella leaks!”
    - id: p03
      illustration: p03
      paragraphs:
        - text: Lina ties a cloth around the green umbrella.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Ben looks at all three and says, “Wait. Their angles are different.”
    - id: p05
      illustration: p05
      paragraphs:
        - text: They set the umbrellas at equal angles above dry chairs.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Oma pours one can of water over the first umbrella.
    - id: p07
      illustration: p07
      paragraphs:
        - text: She uses the same careful test on the other two.
    - id: p08
      illustration: p08
      paragraphs:
        - text: All three chairs stay dry. Lina says, “The umbrella cloth is fine.”
    - id: p09
      illustration: p09
      paragraphs:
        - text: Ben tilts the green umbrella. Water runs under its high edge.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Lina finds one loose foot on the umbrella stand.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Lina and Ben tighten the stand. Oma holds the umbrella straight.
    - id: p12
      illustration: p12
      paragraphs:
        - text: The upright umbrellas keep the audience dry during the play.
