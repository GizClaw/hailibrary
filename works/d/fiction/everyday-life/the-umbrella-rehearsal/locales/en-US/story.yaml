schema_version: 1
language: en-US
writer: river-wink
title: The Umbrella Rehearsal
summary: Lina blames a dripping umbrella, but a fair test points to the stand beneath it.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and amused, timbre: clear adult voice, pace: medium, pitch: medium}}
  lina: {display_name: Lina, tts: {delivery: energetic and decisive, timbre: bright young voice, pace: medium-fast, pitch: medium-high}}
  ben: {display_name: Ben, tts: {delivery: patient and practical, timbre: light young voice, pace: medium, pitch: medium}}
  oma: {display_name: Oma, tts: {delivery: low and playful, timbre: textured older voice, pace: medium-slow, pitch: low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Lina arranged umbrellas for the courtyard play."}]}
  - {id: p02, illustration: p02, lines: [{speaker: oma, text: "This green one gives rain an indoor seat."}]}
  - {id: p03, illustration: p03, lines: [{speaker: lina, text: "It leaks. I will cover the hole."}]}
  - {id: p04, illustration: p04, lines: [{speaker: ben, text: "Which hole? The umbrellas are standing differently."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "They set all three at the same height and angle."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Oma poured one can over the first umbrella."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "She repeated the test twice, without changing anything else."}]}
  - {id: p08, illustration: p08, lines: [{speaker: ben, text: "Every chair is dry. The cloth is not the problem."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "When Ben tilted the green umbrella, water slipped under its edge."}]}
  - {id: p10, illustration: p10, lines: [{speaker: lina, text: "The stand has a loose foot. My umbrella was leaning."}]}
  - {id: p11, illustration: p11, lines: [{speaker: oma, text: "Good. Repair the foot, and spare the innocent umbrella."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "The play began, and the rain stayed in the audience outside."}]}
chapters:
  - {id: ch01, title: The Leaking Suspect, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: One Fair Test, page_refs: [p05, p06, p07, p08]}
  - {id: ch03, title: The Foot Below, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: "What does Lina first blame?", choices: [The green umbrella, Oma's chair, The watering can], answer: "The green umbrella.", page_refs: [p02, p03]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What do the friends do before pouring water?", answer: "They set the umbrellas at the same height and angle.", page_refs: [p05, p06]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why did water reach Oma's chair?", answer: "A loose stand made the umbrella lean, so water slipped under its edge.", page_refs: [p09, p10]}
  - {id: q04, type: character-motive, speaker: narrator, prompt: "Why does Ben ask the group to compare the umbrellas?", answer: "He wants to test whether the cloth really leaks.", page_refs: [p04, p05, p08]}
