schema_version: 1
language: en-US
writer: silver-bell
title: The Umbrella Rehearsal
summary: Water reaches Oma's chair beneath a tilted umbrella. Lina, Ben, and Oma test all three umbrellas at the same angle and discover that a loose stand causes the problem.
cast:
  narrator: {display_name: Narrator, tts: {delivery: measured and warm, timbre: clear adult voice, pace: medium, pitch: medium}}
  lina: {display_name: Lina, tts: {delivery: energetic and decisive, timbre: bright young voice, pace: medium, pitch: medium-high}}
  ben: {display_name: Ben, tts: {delivery: patient and practical, timbre: calm young voice, pace: medium-slow, pitch: medium}}
  oma: {display_name: Oma, tts: {delivery: low and playful, timbre: warm older voice, pace: slow, pitch: low-medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Lina sets chairs beneath three umbrellas."}, {speaker: narrator, text: "A community play begins soon."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "A shower wets Oma's empty chair."}, {speaker: lina, text: "The green umbrella leaks!"}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Lina ties cloth around the green umbrella."}]}
  - {id: p04, illustration: p04, lines: [{speaker: ben, text: "Wait. The umbrellas have different angles."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "They set all three at equal angles."}, {speaker: narrator, text: "Each covers one dry chair."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Oma pours one can over the first umbrella."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "She repeats the test on the others."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "All three chairs stay dry."}, {speaker: lina, text: "The cloth was not the answer."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Ben tilts the green umbrella."}, {speaker: narrator, text: "Water runs under its high edge."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Lina finds a loose foot on its stand."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Lina and Ben tighten the stand."}, {speaker: narrator, text: "Oma holds the umbrella straight."}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: "Upright umbrellas shelter the whole play."}]}
chapters:
  - {id: ch01, title: A Wet Chair, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: A Fair Test, page_refs: [p07, p08, p09, p10, p11, p12]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: "What gets wet first?", answer: "Oma's empty chair.", page_refs: [p02]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What do they change before testing?", answer: "They set the umbrellas at equal angles.", page_refs: [p04, p05]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why did water reach the chair?", answer: "A loose stand tilted the umbrella.", page_refs: [p09, p10]}
