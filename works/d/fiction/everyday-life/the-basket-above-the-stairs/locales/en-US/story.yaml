"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "Seedling trays sit below the rooftop greenhouse. Rain clouds are coming."
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "Etta carries one light tray upstairs, but many remain."
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "Arun points to a rope and empty "
            - "vocabulary":
                "id": "basket"
                "text": "basket"
            - "text": ". “We could lift them,” he says."
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "Ms. Vale checks the pulley. She says, “Stand back.”"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "She checks the knot. A red band marks the loading limit."
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "Etta stacks three trays on one side."
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "content":
            - "text": "The load is uneven. The "
            - "vocabulary":
                "id": "basket"
                "text": "basket"
            - "text": " tilts near the ground."
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "Arun says, “Spread the trays across the bottom.” They balance the load."
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "The trays stay below the red band. Etta closes the gate."
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "Etta pulls the rope from the clear area. The basket stays level as it rises."
    - "id": "p11"
      "illustration": "p11"
      "paragraphs":
        - "text": "Ms. Vale catches the basket at the rooftop landing."
    - "id": "p12"
      "illustration": "p12"
      "paragraphs":
        - "text": "Every seedling reaches the greenhouse without being crushed."
