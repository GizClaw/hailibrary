schema_version: 2
language: en-US
writer: silver-bell
title: The Basket Above the Stairs
summary: Rain is coming, and many seedlings must reach a rooftop greenhouse. After an adult checks the pulley, Etta and Arun balance the trays so the basket rises safely.
chapters:
  - id: ch01
    title: Before the Rain
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: A Balanced Load
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What marks the loading limit?
    answer: A red band.
    page_refs:
      - p05
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What do they do after the basket tilts?
    answer: They spread the trays across the bottom.
    page_refs:
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does the basket rise level?
    answer: The trays are spread evenly and stay below the limit.
    page_refs:
      - p08
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Seedling trays wait below the rooftop greenhouse. Rain clouds are coming.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Etta carries one light tray upstairs, but many remain.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Arun points to a rope and empty "
            - vocabulary:
                id: basket
                text: basket
            - text: . “We could lift them,” he says.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Ms. Vale checks the pulley. She says, “Stand back.”
    - id: p05
      illustration: p05
      paragraphs:
        - text: She checks the knot. A red band marks the loading limit.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Etta stacks three trays on one side.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "The load is uneven. The "
            - vocabulary:
                id: basket
                text: basket
            - text: " tilts near the ground."
    - id: p08
      illustration: p08
      paragraphs:
        - text: Arun says, “Spread the trays across the bottom.” They balance the load.
    - id: p09
      illustration: p09
      paragraphs:
        - text: The trays stay below the red band. Etta closes the gate.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Etta pulls from the clear area. The level basket rises.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Ms. Vale receives it at the rooftop landing.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Every seedling reaches the greenhouse without being crushed.
