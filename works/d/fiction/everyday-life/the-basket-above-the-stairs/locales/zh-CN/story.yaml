schema_version: 2
language: zh-CN
writer: 月芽笺
title: 楼梯上方的篮子
summary: 雨快来了，许多幼苗要送上屋顶温室。谷老师检查滑轮后，埃塔和阿伦把托盘摆均匀，让篮子平稳升到楼上。
chapters:
  - id: ch01
    title: 雨云来了
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
  - id: ch02
    title: 摆平托盘
    page_refs:
      - p07
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 什么标出了装货上限？
    answer: 红带。
    page_refs:
      - p05
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 篮子歪了以后，他们怎么做？
    answer: 把托盘均匀铺开。
    page_refs:
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 篮子为什么能平稳升起？
    answer: 托盘摆得均匀，也没有超过上限。
    page_refs:
      - p08
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 幼苗托盘等在温室楼下。雨云就要来了。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 埃塔端着一个轻托盘上楼。楼下还剩很多。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 阿伦指着空
            - vocabulary:
                id: basket
                text: 篮子
            - text: ，说：“可以吊托盘。”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 谷老师检查滑轮。她说：“你们站远些。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 她检查绳结，又用红带标出装货上限。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 埃塔把三个托盘堆在篮子一边。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 因为重量偏在一边，
            - vocabulary:
                id: basket
                text: 篮子
            - text: 刚升起就歪了。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 阿伦说：“把托盘铺开。”他们重新摆匀托盘。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 托盘没有超过红带，埃塔也关好了小门。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 埃塔站在空地拉绳，
            - vocabulary:
                id: basket
                text: 篮子
            - text: 平稳升起来。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 谷老师在屋顶平台接住篮子。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 每棵幼苗都到了温室，没有一棵被压坏。
