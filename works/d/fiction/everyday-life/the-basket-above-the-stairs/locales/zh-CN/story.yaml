schema_version: 1
language: zh-CN
writer: 月芽笺
title: 楼梯上方的篮子
summary: 雨快来了，许多幼苗要送上屋顶温室。谷老师检查滑轮后，埃塔和阿伦把托盘摆均匀，让篮子平稳升到楼上。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 细致温暖, timbre: 清楚的成年声音, pace: 中速, pitch: 中音}}
  etta: {display_name: 埃塔, tts: {delivery: 有劲坦率, timbre: 明亮的童声, pace: 中速, pitch: 中高音}}
  arun: {display_name: 阿伦, tts: {delivery: 小心鼓励, timbre: 平静的童声, pace: 中慢速, pitch: 中音}}
  ms_vale: {display_name: 谷老师, tts: {delivery: 平静坚定, timbre: 稳重的成年声音, pace: 慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 幼苗托盘等在温室楼下。}, {speaker: narrator, text: 天边来了雨云。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 埃塔端着一个轻托盘上楼。}, {speaker: narrator, text: 楼下还剩很多。}]}
  - id: p03
    illustration: p03
    lines:
      - speaker: arun
        content: [{text: 我们可以用滑轮和}, {vocabulary: {id: basket, text: 篮子}}, {text: 。}]
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 谷老师检查滑轮和绳子。}, {speaker: ms_vale, text: 检查时要站远些。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 她检查绳结。}, {speaker: narrator, text: 红带标出了装货上限。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 埃塔把三个托盘堆在一边。}]}
  - id: p07
    illustration: p07
    lines:
      - speaker: narrator
        content: [{vocabulary: {id: basket, text: 篮子}}, {text: 歪了，卡在低栏杆旁。}]
  - {id: p08, illustration: p08, lines: [{speaker: arun, text: 把托盘均匀铺开。}, {speaker: narrator, text: 他们重新摆好托盘。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 托盘没有超过红带。}, {speaker: narrator, text: 埃塔关好小门。}]}
  - id: p10
    illustration: p10
    lines:
      - {speaker: narrator, text: 埃塔站在空地拉绳。}
      - speaker: narrator
        content: [{vocabulary: {id: basket, text: 篮子}}, {text: 平稳升起来。}]
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 谷老师在楼上接住篮子。}]}
  - {id: p12, illustration: p12, lines: [{speaker: narrator, text: 每棵幼苗都安全到达温室。}]}
chapters:
  - {id: ch01, title: 雨云来了, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 摆平托盘, page_refs: [p07, p08, p09, p10, p11, p12]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 什么标出了装货上限？, answer: 红带。, page_refs: [p05]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 篮子歪了以后，他们怎么做？, answer: 把托盘均匀铺开。, page_refs: [p07, p08]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 篮子为什么能平稳升起？, answer: 托盘摆得均匀，也没有超过上限。, page_refs: [p08, p09, p10]}
