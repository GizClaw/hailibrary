schema_version: 3
language: zh-CN
writer: 月芽笺
title: 屋顶上的星星
summary: 林林听见黑暗中的整栋楼，慢慢安心，也发现了屋顶上的星星。
chapters:
  - id: ch01
    title: 变化
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 转折
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: picture
    prompt: 你看见了什么？
    answer: 林林和家人。
    page_refs:
      - p01
  - id: q02
    type: sequence
    prompt: 林林安心以前，先发生了什么？
    answer: 她听见并看见家人和邻居。
    page_refs:
      - p07
      - p14
  - id: q03
    type: cause-effect
    prompt: 林林为什么慢慢安心？
    answer: 她听见熟悉的人，也和家人在一起。
    page_refs:
      - p03
      - p05
      - p07
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林林听见婴儿、猫和衣架的声音。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 机器都安静了，所以小声音显得很近。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 她说自己还有一点害怕。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 吴奶奶笑说，自己会把蒲扇当眼镜。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 林林笑了，阳台又变得亲切。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 风吹弯火苗，玻璃罐却护着它。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 妈妈陪在身边，林林走近栏杆。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 楼下有手机光移动，院子不再空了。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 爸爸请林林看看屋顶上方。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 城市的灯灭了，所以许多星星露出来。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 妈妈关掉手机灯，林林的眼睛慢慢适应。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 电来了，星星开始变淡。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 妈妈要吹蜡烛，林林请她等一下。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 爸爸关掉灯，他们又看了一颗星。
