article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: June hears a baby and a cat. She hears hangers too.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Because the machines are quiet, every small sound seems near.
    - id: p03
      illustration: p03
      paragraphs:
        - text: She says she is still a little scared.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Mrs. Wu jokes about wearing her fan like glasses.
    - id: p05
      illustration: p05
      paragraphs:
        - text: June laughs, and the balcony feels friendly again.
    - id: p06
      illustration: p06
      paragraphs:
        - text: A breeze bends the candle. The glass jar guards it.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Mom stays beside June. June steps closer to the railing.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Phone lights move below. The courtyard no longer looks empty.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Dad asks June to look above the roof.
    - id: p10
      illustration: p10
      paragraphs:
        - text: City lights are off, so she can see many stars.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Mom turns off her phone, and June’s eyes slowly adjust.
    - id: p12
      illustration: p12
      paragraphs:
        - text: Then the power returns, and the stars begin to fade.
    - id: p13
      illustration: p13
      paragraphs:
        - text: June asks Mom to wait before blowing out the candle.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Dad turns off the lamp. They watch one more star.
