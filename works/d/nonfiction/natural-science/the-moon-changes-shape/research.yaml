schema_version: 1
required: true
scope: A fictional child records simplified, scientifically accurate lunar phases over about one synodic month; the explanation distinguishes the Moon's unchanged round body from the changing sunlit portion visible from Earth.
sources:
  - id: nasa-moon-phases
    title: Moon Phases
    publisher: NASA Science
    url: https://science.nasa.gov/moon/moon-phases/
    verified_at: 2026-09-13
    supports:
      - The Moon does not make its own light; moonlight is reflected sunlight.
      - The Sun illuminates half of the Moon, while the illuminated part visible from Earth changes as the Moon travels through its orbit.
      - The standard sequence includes new Moon, crescent, quarter or half-looking phases, full Moon, and the return toward new Moon.
      - The phase cycle repeats about every 29.5 days.
  - id: nasa-space-place-phases
    title: What Are the Moon's Phases?
    publisher: NASA Space Place
    url: https://spaceplace.nasa.gov/moon-phases/sp/
    verified_at: 2026-09-13
    supports:
      - The Moon appears to change shape, but the Moon's shape itself does not change during the month.
      - A new Moon is not visible from Earth because the side facing Earth is dark.
      - It takes about 29.5 days to go from one new Moon to the next.
  - id: usno-astronomical-glossary
    title: Glossary
    publisher: United States Naval Observatory Astronomical Applications Department
    url: https://aa.usno.navy.mil/faq/asa_glossary
    verified_at: 2026-09-13
    supports:
      - Lunar phases are cyclically recurring apparent forms of the Moon.
      - A phase can mean the apparent degree of illumination of the Moon's disk seen from Earth.
      - The mean synodic month between successive new Moons is about 29.531 days.
claims:
  - claim: Mina can record a sequence that moves from a thin crescent through a half-looking Moon and full Moon, then back through a smaller bright part, a not-visible Moon, and a returning crescent.
    source_ids: [nasa-moon-phases, nasa-space-place-phases]
    pages: [p02, p03, p04, p05, p06, p07]
  - claim: About twenty-nine and a half days separate matching points in the Moon's phase cycle.
    source_ids: [nasa-moon-phases, nasa-space-place-phases, usno-astronomical-glossary]
    pages: [p01, p07]
  - claim: The Moon remains round; sunlight illuminates half of it, and the bright portion visible from Earth changes as the Moon moves around Earth.
    source_ids: [nasa-moon-phases, nasa-space-place-phases]
    pages: [p08, p09, p10]
  - claim: Moon phase and 月相 name one of the recurring apparent forms or illuminated shapes of the Moon seen from Earth.
    source_ids: [nasa-moon-phases, usno-astronomical-glossary]
    pages: [p07, p10]
limitations:
  - Mina, Dad, their home, the sketchbook, dialogue, and the exact observation nights are fictional.
  - The ten pages sample major visible changes rather than claiming that Mina drew the Moon on every night or at the same clock time.
  - Weather, horizon position, viewing hemisphere, and crescent orientation are deliberately unspecified.
  - The plain ball beside the lamp is only a visual reminder that a round object can look partly lit; the text carries the scientific explanation.
