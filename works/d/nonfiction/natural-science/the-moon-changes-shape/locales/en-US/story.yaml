      display_name: Narrator
      tts:
        delivery: gentle and precise, separating observation from explanation
        timbre: warm adult alto with a clear center
        pace: calm medium-slow
        pitch: middle-low
    mina:
      display_name: Mina
      tts:
        delivery: curious and absorbed, with small pauses while thinking
        timbre: bright young voice with soft edges
        pace: lively medium
        pitch: high
    dad:
      display_name: Dad
      tts:
        delivery: reassuring and conversational, answering only what Mina asks
        timbre: low mellow adult voice
        pace: unhurried medium-slow
        pitch: low
