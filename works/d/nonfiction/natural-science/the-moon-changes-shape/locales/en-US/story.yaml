schema_version: 2
language: en-US
writer: silver-bell
title: The Moon Looks Different
summary: Mina draws the Moon for about one month. Her pictures change because she sees different bright parts of the same round Moon.
chapters:
  - id: ch01
    title: Shapes in the Window
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: The Moon Is Still Round
    page_refs:
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What does Mina use for her Moon drawings?
    answer: A sketchbook.
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What shape does Mina draw just before the full Moon?
    answer: Half a circle.
    page_refs:
      - p03
      - p04
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why do we see different bright parts of the Moon?
    answer: The Moon circles Earth. The Sun shines on half the Moon.
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Mina sets her sketchbook by the window. “I’ll draw the Moon,” she says. She keeps drawing for about a month.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "On the first clear night, Mina draws a "
            - vocabulary:
                id: crescent
                text: crescent
            - text: "."
    - id: p03
      illustration: p03
      paragraphs:
        - text: A few nights pass. The Moon looks like half a circle.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Soon, Mina draws the full Moon.
    - id: p05
      illustration: p05
      paragraphs:
        - text: After that, the bright part gets smaller.
    - id: p06
      illustration: p06
      paragraphs:
        - text: One night, Mina cannot see the Moon. She leaves one page blank.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Her first Moon drawing was about 29.5 days ago. Now, a "
            - vocabulary:
                id: crescent
                text: crescent
            - text: " returns. Each shape is a "
            - vocabulary:
                id: moon-phase
                text: moon phase
            - text: "."
    - id: p08
      illustration: p08
      paragraphs:
        - text: Mina puts all her drawings on the desk. “Did the Moon lose pieces?” she asks Dad.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Dad holds a ball so the lamp lights one side. The Sun shines on one half of the round Moon.
    - id: p10
      illustration: p10
      paragraphs:
        - text: The Moon circles Earth. We see more or less of the bright half. Mina begins another row of Moon drawings.
