schema_version: 2
language: zh-CN
writer: 月芽笺
title: 月亮看起来变了
summary: 小满画了约一个月的月亮。月亮一直是圆的，她看到的是不同的亮面。
chapters:
  - id: ch01
    title: 窗边的月亮
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 月亮还是圆的
    page_refs:
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 小满用什么画月亮？
    answer: 画本。
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 满月前的那幅画里，月亮是什么样？
    answer: 半圆的月亮。
    page_refs:
      - p03
      - p04
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 为什么我们看到的亮面会变？
    answer: 月亮绕着地球走，太阳照亮月亮的一半。
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小满在窗边放好画本。她想把一个月的月亮都画下来。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 天黑了，弯弯的
            - vocabulary:
                id: crescent
                text: 月牙
            - text: 出现了。小满把月牙画下来。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 过了几天，月亮变成了半圆。画本上又多了一张画。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 再过几天，满月又圆又亮。小满把圆画得大大的。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 后来，亮的部分变小了。月亮又像半个圆。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 有一晚，窗外不见月亮。小满没有下笔。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 画完第一幅后，过了约二十九天半。
            - vocabulary:
                id: crescent
                text: 月牙
            - text: 又出现了。这些样子叫
            - vocabulary:
                id: moon-phase
                text: 月相
            - text: 。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 小满把画放在桌上。她问爸爸：“月亮少了一块吗？”
    - id: p09
      illustration: p09
      paragraphs:
        - text: 爸爸把球拿到灯边。灯照亮球的一边。月亮是圆的，太阳只照亮一半。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 月亮绕着地球走。我们看见的亮的部分会变。小满再画一排
            - vocabulary:
                id: moon-phase
                text: 月相
            - text: 。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温和清楚，仔细分开观察和解释
        timbre: 温暖清亮的成年女中音
        pace: 平稳的中慢速
        pitch: 中低音
    mina:
      display_name: 小满
      tts:
        delivery: 好奇专注，思考时有短停顿
        timbre: 明亮柔和的童声
        pace: 轻快的中速
        pitch: 高音
    dad:
      display_name: 爸爸
      tts:
        delivery: 温和自然，只回答小满眼前的问题
        timbre: 低沉温厚的成年男声
        pace: 从容的中慢速
        pitch: 低音
