characters:
  - id: narrator
    kind: narrator
    description: A clear, gentle guide who separates what Mina sees from why the Moon looks different.
    voice_identity: warm adult voice with calm, careful emphasis
  - id: mina
    kind: character
    description: Mina / 小满, a curious seven-year-old who draws the Moon from her bedroom window for about one month.
    visual_identity: A seven-year-old child with medium-brown skin, round dark eyes, chin-length wavy black hair held by one plain sky-blue clip, coral long-sleeved pajamas, teal slippers, and a sky-blue sketchbook with blank unmarked pages.
    voice_identity: bright child voice with thoughtful pauses and open curiosity
  - id: dad
    kind: character
    description: Mina's father, who listens to her question and answers it with a plain white ball beside the desk lamp.
    visual_identity: An adult man with medium-brown skin, short curly black hair, a mustard knit sweater, navy trousers, and brown house shoes; he holds one plain white ball only on the final pages.
    voice_identity: low, reassuring adult voice with an easy conversational rhythm
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Follow the visible Moon shapes Mina records over about one month.
    - Connect sunlight and the Moon's movement around Earth with the changing bright part we see.
    - Distinguish the Moon's round body from its changing appearance.
  concepts:
    - moon-phase
    - sunlight
    - observation
rights:
