schema_version: 1
style: naturalistic-storybook
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  zhan-tianyou: Chinese man age 44 to 48, slim build, oval face, high forehead, short black hair neatly side-parted, narrow trimmed mustache, dark navy three-piece suit with high white collar; charcoal wool overcoat and dark brimmed hat outdoors.
  railway-team: Chinese surveyors and workers of 1905 to 1909 in practical muted tan, gray, indigo, and brown cotton jackets and caps; tools and actions vary but no worker is reduced to a faceless crowd.
  locomotives: Early twentieth-century black steam locomotives with brass and dark-red details, no readable plates or numbers; period wooden passenger and work cars.
  mountain: The same rugged Guanggou landscape of gray-brown rock, dry grasses, dark pines, narrow valleys, and distant Great Wall ridges under autumn daylight.
  engineering-props: Brass surveyor's transit, wooden tripod, measuring chain, plumb lines, timber supports, hand drills, carts, rails, and rolled blank plans; all paper and equipment surfaces remain blank.
  palette: Natural stone gray, pine green, dry ochre, indigo cloth, charcoal iron, muted brick red, warm skin tones, and restrained golden daylight.
  text-exclusion: No words, letters, numbers, glyphs, signs, captions, speech bubbles, logos, signatures, watermarks, or readable markings on paper, stations, trains, tunnel portals, tools, or clothing.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Zhan Tianyou stands with a surveyor's transit on a Guanggou ridge; below him a wordless Qinglongqiao switchback carries a two-locomotive train toward the dark Badaling Tunnel entrance.
  - id: p01
    file: artwork/p01.webp
    scene: In a 1905 engineering office, Zhan accepts a roll of blank plans beside Chinese engineers, with a distant mountain landscape visible through the window and no readable documents.
  - id: p02
    file: artwork/p02.webp
    scene: Zhan studies a brass transit, measuring chain, rail sample, and blank plans at a worktable, his experienced concentration contrasting with the difficult ridge beyond.
  - id: p03
    file: artwork/p03.webp
    scene: Zhan and the railway team face the steep Guanggou valley from below, comparing the limited steam locomotive on temporary track with the high ridge ahead.
  - id: p04
    file: artwork/p04.webp
    scene: Surveyors move through rocky terrain with a transit and measuring chain while Zhan compares several blank route cords laid across a small relief model.
  - id: p05
    file: artwork/p05.webp
    scene: At the south side of the Badaling ridge, workers prepare the tunnel portal while Zhan and surveyors look up toward the long mass of rock above.
  - id: p06
    file: artwork/p06.webp
    scene: A wide cutaway-like naturalistic view shows two shaft openings descending from the ridge and separate crews beginning work toward six tunnel faces, with safe timber frames and no diagram labels.
  - id: p07
    file: artwork/p07.webp
    scene: Underground surveyors use a plumb line, lamp, and transit to align a rock heading while Zhan checks the blank field notes near the shaft base.
  - id: p08
    file: artwork/p08.webp
    scene: Railway workers drill rock, load broken stone into small carts, and coordinate around timber supports inside the tunnel while Zhan confers with an engineer at a safe distance.
  - id: p09
    file: artwork/p09.webp
    scene: The completed Badaling Tunnel entrance opens through the ridge as workers and engineers stand beside a small inspection locomotive, with the portal entirely blank.
  - id: p10
    file: artwork/p10.webp
    scene: Near Qinglongqiao, Zhan and a surveyor measure the steep rising track while a two-locomotive steam train waits below the mountain grade.
  - id: p11
    file: artwork/p11.webp
    scene: Zhan and engineers use plain cords on a terrain model to compare a direct tunnel route with a longer bending route around the lower Qinglongqiao ridge.
  - id: p12
    file: artwork/p12.webp
    scene: A train with one locomotive at each end pauses safely on the Qinglongqiao switchback as railway workers set the points for the reverse climb.
  - id: p13
    file: artwork/p13.webp
    scene: Wide elevated view of the same train reversing along the second arm of the switchback, showing sharp curves, steep mountain, and two locomotives working together.
  - id: p14
    file: artwork/p14.webp
    scene: Zhan studies the operating switchback from a hillside while one train completes the slow reversal and another section of the longer mountain route lies visible beyond.
  - id: p15
    file: artwork/p15.webp
    scene: A 1909 construction milestone scene shows completed track, station buildings without signs, engineers, workers, and families gathered beside a steam train in restrained celebration.
  - id: p16
    file: artwork/p16.webp
    scene: Zhan stands among a varied railway team examining finished rails and bridge work, with workers and surveyors visibly sharing the completed task.
  - id: p17
    file: artwork/p17.webp
    scene: Zhan and Chinese railway technicians inspect an already manufactured Janney knuckle coupler between two stationary railcars, clearly evaluating an existing device rather than inventing it.
  - id: p18
    file: artwork/p18.webp
    scene: In a historically grounded 1908 view, two trains occupy different arms west of Qinglongqiao Station while Zhan and railway workers observe the mountain line, tunnel ridge, and completed track.
