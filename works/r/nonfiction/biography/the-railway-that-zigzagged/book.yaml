schema_version: 1
id: the-railway-that-zigzagged
type: [reading, narrative-nonfiction]
style: naturalistic-storybook
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [history, technology, travel]
  themes: [problem-solving, responsibility, perseverance]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A source-conscious historical narrator who makes engineering choices audible and separates documented achievement from later legend.
    voice_identity: clear, observant, and exact with quiet momentum
  - id: zhan-tianyou
    kind: historical-figure
    description: Zhan Tianyou, chief engineer of the Beijing-Zhangjiakou Railway; the work depicts documented actions but invents no quotation or private thought.
    visual_identity: Chinese man age 44 to 48, slim build, oval face, high forehead, short black hair neatly side-parted, narrow trimmed mustache, dark navy three-piece suit with high white collar, charcoal wool overcoat and dark brimmed hat outdoors.
    voice_identity: unused because the work attributes no spoken words to him
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how two shafts increased the number of working faces in the Badaling Tunnel.
    - Explain how the Qinglongqiao switchback exchanged longer travel and slower operations for a manageable climb and shorter excavation.
    - Evaluate Zhan Tianyou's decisions under limits of terrain, locomotive power, money, and time.
    - Distinguish documented adoption of the Janney automatic coupler from the false claim that Zhan invented it.
  concepts:
    - Zhan Tianyou and the Beijing-Zhangjiakou Railway
    - Badaling Tunnel shaft construction
    - Qinglongqiao railway grade and switchback
    - engineering trade-offs and team labor
    - invention, adaptation, and historical evidence
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
