schema_version: 1
required: true
sources:
  - url: https://wwj.beijing.gov.cn/bjww/362771/362779/dqpqgzdwwbhdw/523544/index.html
    publisher: Beijing Municipal Cultural Heritage Bureau
    claims:
      - The protected Nankou-to-Badaling section began construction in 1905 and the Beijing-Zhangjiakou Railway opened in 1909.
      - The surviving heritage includes the switchback railway, Qinglongqiao Station, staff buildings, Zhan Tianyou's tomb, and his statue.
      - The switchback near Qinglongqiao uses a reversing-line principle to reduce the effective grade.
      - The line is recognized as the first railway designed and constructed by China itself.
  - url: https://qxcm.tsjc.tsinghua.edu.cn/pc/folder117/2019-10-15/1613.html
    publisher: Tsinghua University School of Journalism and Communication
    claims:
      - The difficult Guanggou section reached a grade of about thirty-three point three per thousand while contemporary steam locomotives had limited pulling power.
      - A quoted planning document by Zhan Tianyou explains that routing near the lower ridge at Qinglongqiao added distance but could reduce excavation.
      - Two shafts above the Badaling Tunnel created six working faces together with the two portals, and the tunnel was opened in about eighteen months.
      - Money and schedule limits influenced the choice of the Qinglongqiao switchback.
  - url: https://www.loc.gov/item/2021668911/
    publisher: Library of Congress, from the National Library of China collection
    claims:
      - The 1909 construction album documents the railway's stations, factories, locomotives, bridges, tunnels, and workers.
      - The line was built in three sections completed in 1906, 1908, and 1909 and ran about two hundred kilometers from Fengtai to Zhangjiakou.
      - The photograph at Qinglongqiao shows trains on the mountain railway in 1908.
      - The railway was designed, built, and financed by Chinese participants without foreign control.
  - url: https://www.loc.gov/item/2021668916/
    publisher: Library of Congress, from the National Library of China collection
    claims:
      - A photograph made before the railway opened shows the north entrance of the Badaling Tunnel.
      - Badaling was one of four tunnels excavated for the Beijing-Zhangjiakou Railway.
  - url: https://source.nra.gov.cn/tlfc/tpsy/202204/t20220405_292994.shtml
    publisher: National Railway Administration of China
    claims:
      - The Qinglongqiao arrangement answered steep grades and insufficient locomotive traction.
      - A train used locomotives at both ends; after stopping and reversing at Qinglongqiao, their pulling and pushing roles changed.
  - url: https://world.yale.edu/news/yale-and-china-a-centuries-old-partnership
    publisher: Yale University
    claims:
      - Zhan Tianyou entered Yale's Sheffield Scientific School in 1878 and graduated in 1881 with a civil engineering degree and an interest in railroad construction.
  - url: https://investments.yale.edu/wp-content/uploads/2024/10/2007YaleEndowment.pdf
    publisher: Yale University
    claims:
      - Yale's institutional history describes Zhan as delivering the Beijing-Zhangjiakou project under budget and two years ahead of schedule.
  - url: https://www.gzjjjc.gov.cn/ljgzw/ljjy/qlkm/content/post_145616.html
    publisher: Guangzhou Municipal Commission for Discipline Inspection and Supervision
    claims:
      - Zhan promoted the American Janney coupler in China, but later retellings incorrectly credited him with inventing it.
      - His engineering glossary deliberately used a Chinese rendering that separated Janney's surname from Zhan's own.
      - The railway finished with money remaining, and Zhan's management combined technical work with cost control.
  - url: https://www.asme.org/about-asme/engineering-history/landmarks/267-janney-coupler
    publisher: American Society of Mechanical Engineers
    claims:
      - Eli Janney's interlocking automatic coupler was patented in the United States in 1873, before the Beijing-Zhangjiakou Railway project.
      - The coupler automatically joined cars and replaced a dangerous link-and-pin method that required workers to stand between cars.
  - url: https://patents.google.com/patent/US138405A/en
    publisher: United States Patent Office record, accessed through Google Patents
    claims:
      - United States patent 138405 names Eli H. Janney and is dated April 29, 1873.
      - The patent describes a rotary hook, guard arm, and catch lever that couple adjacent railroad cars as they meet.
  - url: https://ps.whrsm.cas.cn/kpjt/kpwz/202308/t20230801_573231.html
    publisher: Chinese Academy of Sciences, Wuhan Institute of Rock and Soil Mechanics
    claims:
      - A 1906 letter from Zhan describes intense public scrutiny and his fear that failure would damage trust in Chinese engineers.
      - The Zhan Tianyou Memorial Museum uses surviving plans, survey tools, and models to document route comparison and the central-shaft method at Badaling.
      - The railway was completed in 1909, two years earlier than planned, after work under limited money, technology, and time.
  - url: https://www.ccdi.gov.cn/special/lz70/lz70_wqhg/201909/t20190910_200209.html
    publisher: Central Commission for Discipline Inspection and National Commission of Supervision
    claims:
      - The Guanggou section had a maximum grade of about thirty-three per thousand and used two locomotives on the switchback.
      - Switchback railways had been used outside China; Zhan applied the method to the Qinglongqiao terrain rather than inventing the general idea.
      - The old route's sharp curves and steep grade later limited capacity, showing that the solution fit its original constraints rather than every future need.
notes: >-
  The work invents no dialogue, private thought, accident count, or lone-genius
  claim. Dates are stated by year because authoritative sources differ on the
  ceremonial start and completion days. The phrase “first major Chinese railway”
  is limited to a trunk line designed, built, and financed under Chinese control;
  it does not claim that China had no earlier railways. The tunnel description
  follows the documented two-shaft, six-working-face account. “Risky” is a
  level-appropriate ordinary inference from underground drilling and blasting,
  not a claim about a particular casualty. The coupler section distinguishes
  adoption and standardization work from invention and uses both Chinese
  institutional evidence and ASME's engineering history.
