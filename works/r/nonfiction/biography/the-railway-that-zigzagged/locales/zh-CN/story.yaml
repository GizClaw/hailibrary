            - vocabulary: {id: railway-switchback, text: 折返线}
            - text: 这种办法也不是詹天佑从无到有的发明，国外铁路早已用过相似线路。
        - {id: p14-b02, speaker: narrator, text: "他的贡献是青龙桥的具体设计，并让它同八达岭隧道和当时的机车配合。这个已有的方法，正好适合当地山势和工程限制。"}
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: "京张铁路分段完成。丰台至南口一段在1906年建成，南口至康庄的山区段在1908年完成，最后一段在1909年完工。"}
        - {id: p15-b02, speaker: narrator, text: "全线施工不到四年，比计划更早结束，经费也有结余。工程影集把这三个完工年份和全线照片一起保存了下来。"}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: "1909年出版的工程影集拍下了车站、工厂、桥隧、列车和施工人员，也留下詹天佑的照片。"}
        - {id: p16-b02, speaker: narrator, text: "这些史料说明他是主持工程的总工程师，却没有把整条铁路变成一个人的作品。勘测者、工人、其他工程师和铁路员工，都把各自的工作接进了这条线。"}
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          content:
            - text: 关于詹天佑，还有一个流传很广的误会。他在中国推动使用
            - vocabulary: {id: automatic-coupler, text: 自动车钩}
            - text: ，却不是这种装置的发明人。
        - {id: p17-b02, speaker: narrator, text: "美国人伊莱·詹尼早在京张铁路开工前就取得了相关专利。詹天佑后来编写工程词汇时，还特意把车钩的外文姓氏同自己的姓分开。"}
        - {id: p17-b03, speaker: narrator, text: "推广技术和发明技术，是两件不同的事。"}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "即使没有车钩传说，詹天佑的工程成就也有明确史料依据。八达岭隧道用两口竖井增加了工作面。青龙桥折返线以较长路程和较慢运营为代价，换取较少开挖和可控制的坡度。"}
        - {id: p18-b02, speaker: narrator, text: "1908年的照片里，一列客车和一列货车分别行驶在完工的山腰线路上。铁轨绕过山石，继续通向隧道。"}
