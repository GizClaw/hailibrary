schema_version: 2
language: zh-CN
writer: 星火
title: 詹天佑与折回去的铁路
summary: 在经费、工期、山势和机车能力的共同限制下，詹天佑主持修建京张铁路。八达岭隧道的竖井与青龙桥折返线，记录了他怎样把已有方法用于具体难题；自动车钩的误传则提醒我们分清推广与发明。
chapters:
  - {id: ch01, title: 山挡在前面, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 六处一起开工, page_refs: [p05, p06, p07, p08, p09]}
  - {id: ch03, title: 青龙桥的折返, page_refs: [p10, p11, p12, p13, p14]}
  - {id: ch04, title: 姓名背后的工作, page_refs: [p15, p16, p17, p18]}
questions:
  - id: q01
    type: short-answer
    speaker: narrator
    prompt: 两口竖井怎样把八达岭隧道的工作面增加到六处？
    answer: 每口竖井通到隧道高度后，都能向两个方向开挖，再加上南北两个洞口，一共有六处工作面。
    page_refs: [p05, p06]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪些证据说明地图上最短的路线不一定最合适？
    answer: 取直可能让坡度过大；绕远虽然多铺轨道，却能放缓上升并减少开山或打隧道的长度。
    page_refs: [p03, p04, p11]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 竖井方案和折返线方案各用什么代价换取了什么好处？
    answer: 竖井增加了从山顶向下的工程，却让更多队伍同时施工；折返线增加了路程和换向时间，却减少开挖并把坡度控制在机车能应对的范围内。
    page_refs: [p06, p11, p12, p13]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 詹天佑为什么没有只追求更直的山区路线？
    answer: 当时的机车难以安全爬上更陡的坡，而更长的隧道又会增加开挖、工期和经费。
    page_refs: [p10, p11, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 文章认为詹天佑最重要的工程贡献是什么？
    answer: 他根据当地山势和工程限制选择并组合已有方法，还组织许多人把方案建成了铁路。
    page_refs: [p04, p06, p12, p14, p16, p18]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 青龙桥折返线后来限制了运量，它还算成功的选择吗？请说明理由。
    answer: 对当时的工程来说算成功，因为它在有限工期和经费内控制了坡度、减少了开挖；但停车换向、急弯和陡坡确实限制了后来的运输能力。
    page_refs: [p11, p12, p13, p14]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: 八达岭隧道和青龙桥折返线体现了怎样相同的解决思路？
    answer: 两个方案都先承担一项额外代价，再减轻更紧迫的限制：竖井用额外开挖换时间，折返线用额外路程换较少开挖和较缓上升。
    page_refs: [p05, p06, p10, p11, p13]
  - id: q08
    type: evidence
    speaker: narrator
    prompt: 为什么文章认定詹天佑没有发明自动车钩？
    answer: 相关车钩在京张铁路开工前已经由美国人詹尼取得专利，史料支持的是詹天佑在中国推广这种装置，并认真处理它的译名。
    page_refs: [p17]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            1905年，清政府批准修建从北京通往张家口的铁路，詹天佑受命主持工程。它将成为中国人自行筹款、设计和施工的第一条干线铁路。工程成败不只关系一条路，也会影响人们是否相信中国工程师有能力主持大型建设。詹天佑面对的，既是山，也是社会的目光。
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            詹天佑并非只凭一腔热情接受任务。他1878年进入耶鲁大学谢菲尔德科学学校，1881年完成土木工程学业。回国后，他又在铁路上积累了多年经验。不过，课本里的方法不能替他移走军都山。知识让他更会看清问题，却不会自动给出一条平坦的路线。
    - id: p03
      illustration: p03
      paragraphs:
        - text: >-
            京张铁路全长约二百公里，最难的是南口到八达岭一带的关沟段。山谷窄，地面上升得快，当时的蒸汽机车牵引力又有限。工程还受到经费和工期的约束。线路绕远，钢轨和路基会增加；线路取直，坡可能太陡，隧道也可能更长。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            勘测人员一次次走进山谷，比较不同走向。地图上最近的路线，到了实地未必最省事。延长线路能让火车慢慢升高，却会多用土地和材料；打通长隧道能少拐弯，却要先运走大量岩石。詹天佑不能只追求最短、最快或最便宜，而要让安全、进度和经费同时过关。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            这段山路需要开凿四条隧道，其中八达岭隧道最长，穿山一千多米。若只从南北两个洞口向里挖，能接触岩面的队伍很少。洞口再宽，也不能让许多人同时挤在一处施工。要缩短工期，必须增加可以开工的位置。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 工程人员从山顶向下开出两口
            - vocabulary: {id: tunnel-shaft, text: 竖井}
            - text: ，一直通到计划中的隧道高度。每口井底可以向两个方向开挖，加上南北洞口，共有六处工作面同时推进。开竖井本身也要花时间，但它让更多队伍能同时接近岩层。这是一笔用额外工程换取施工进度的账。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            开工点增多以后，测量更不能马虎。六处工作面开出的洞段最终要贯通；方向若有小小偏差，地下的两支队伍就可能错开。工程人员需要反复核对位置和高度。詹天佑的责任不只是画出线路，还要把测量、人员、工具和工序组织在一起。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            工人钻孔、放炮，再把碎石一车车运走。人员和材料也要沿竖井上下。山里的劳动缓慢而艰苦，即使认真安排，风险仍然存在。讲述八达岭隧道时，不能只看见总工程师，也要看见在六处工作面施工的工人与其他工程人员。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            大约十八个月后，八达岭隧道打通了。1908年前后拍摄的《京张路工撮影》留下了洞口、桥梁、机车和铁路员工的影像。照片无法告诉我们所有施工细节，也没有拍下每一位劳动者。不过，它们是铁路通车前留下的直接记录，证明山中的线路已经成为实物。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 关沟段每向前一千米，部分线路大约升高三十三米。在铁路工程中，这种升高的比率叫作
            - vocabulary: {id: railway-grade, text: 坡度}
            - text: 。隧道之外，青龙桥附近还有一段陡峭的上坡。面对当时的蒸汽机车，再把坡修陡并不安全；若一味放缓坡度，线路和隧道又会变长。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            詹天佑把线路引向青龙桥附近较低的山岭，让路程增加一些。多走的距离给火车留下逐步上升的空间，也减少了需要开山或打隧道的长度。这个方案没有消除困难，而是减轻最急的问题，同时接受多铺轨道的代价。
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 列车驶进青龙桥后，要沿
            - vocabulary: {id: railway-switchback, text: 折返线}
            - text: 改变方向。车头和车尾各有一台机车。上第一段坡时，一台在前面拉，另一台在后面推；停车换向以后，原来在后面的机车领着列车继续上山。火车看似折回去了，实际已经换到更高的一段线路。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            折返线适合当时的山势和条件，却不是没有代价。列车需要停车、换向，还要用两台机车帮助爬坡。弯道和陡坡后来也限制了老线路的运输能力。若改挖更长的隧道，运营也许更直接，但1905年的建设者要付出更多时间和经费。
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - vocabulary: {id: railway-switchback, text: 折返线}
            - text: 这种办法也不是詹天佑从无到有的发明，国外铁路早已用过相似线路。他的贡献是青龙桥的具体设计，并让它同八达岭隧道和当时的机车配合。这个已有的方法，正好适合当地山势和工程限制。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            京张铁路分段完成。丰台至南口一段在1906年建成，南口至康庄的山区段在1908年完成，最后一段在1909年完工。全线施工不到四年，比计划更早结束，经费也有结余。工程影集把这三个完工年份和全线照片一起保存了下来。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            1909年出版的工程影集拍下了车站、工厂、桥隧、列车和施工人员，也留下詹天佑的照片。这些史料说明他是主持工程的总工程师，却没有把整条铁路变成一个人的作品。勘测者、工人、其他工程师和铁路员工，都把各自的工作接进了这条线。
    - id: p17
      illustration: p17
      paragraphs:
        - content:
            - text: 关于詹天佑，还有一个流传很广的误会。他在中国推动使用
            - vocabulary: {id: automatic-coupler, text: 自动车钩}
            - text: ，却不是这种装置的发明人。美国人伊莱·詹尼早在京张铁路开工前就取得了相关专利。詹天佑后来编写工程词汇时，还特意把车钩的外文姓氏同自己的姓分开。推广技术和发明技术，是两件不同的事。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            即使没有车钩传说，詹天佑的工程成就也有明确史料依据。八达岭隧道用两口竖井增加了工作面。青龙桥折返线以较长路程和较慢运营为代价，换取较少开挖和可控制的坡度。1908年的照片里，一列客车和一列货车分别行驶在完工的山腰线路上。铁轨绕过山石，继续通向隧道。
