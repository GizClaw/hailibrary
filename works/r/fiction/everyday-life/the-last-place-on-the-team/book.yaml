schema_version: 1
id: the-last-place-on-the-team
type: [reading, illustrated-short-story]
style: bold-ink-comic
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [everyday-life, sports]
  themes: [fairness, friendship, responsibility]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close third-person narrator who follows Mara's evidence and uncertainty without announcing a moral.
    voice_identity: observant, restrained, and emotionally precise
  - id: mara
    kind: character
    description: The ten-year-old team captain, responsible for recommending one candidate while her friendship with Tessa complicates the choice.
    visual_identity: Black girl about ten, two round puff braids, red headband, sleeveless cyan basketball jersey with no markings, black shorts with a red side stripe, bright yellow high-top shoes.
    voice_identity: thoughtful and direct, with pauses when responsibility becomes personal
  - id: tessa
    kind: character
    description: Mara's closest friend and a steady candidate who organizes defense, supports teammates, and does not hide her anger after the decision.
    visual_identity: light-skinned girl about ten with freckles and short copper curls, sleeveless yellow basketball jersey with no markings, deep red shorts, cyan wristbands, black basketball shoes.
    voice_identity: warm and quick in ordinary moments, clipped and controlled when hurt
  - id: dev
    kind: character
    description: A new student and strong scoring candidate who learns to respond to defensive pressure by involving teammates.
    visual_identity: South Asian boy about ten with warm brown skin and thick wavy black hair, sleeveless red basketball jersey with no markings, cyan shorts, yellow wristband, cyan basketball shoes.
    voice_identity: quiet, focused, and sincere
  - id: coach-imani
    kind: character
    description: The adult coach who asks Mara for a reasoned recommendation, protects an ordinary tryout process, and makes the final roster decision.
    visual_identity: East Asian woman in her thirties with a straight chin-length black bob, bright yellow track jacket with no markings, black athletic pants, red sneakers, plain silver whistle.
    voice_identity: calm, economical, and probing
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Evaluate a consequential decision under the competing demands of friendship, fairness, and team performance.
    - Explain why evidence gathered under different conditions may not support a fair comparison.
    - Synthesize observations from several practices and identify what later evidence could revise a decision.
  concepts:
    - comparable evidence
    - personal bias
    - practical tradeoffs
    - response after mistakes
    - accountable recommendations
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
