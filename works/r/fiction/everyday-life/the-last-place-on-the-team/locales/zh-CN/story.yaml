schema_version: 2
language: zh-CN
writer: 星火
title: 最后一个名额
summary: 球队只剩一个名额，队长玛拉必须在好友泰莎和得分出色的新队员凯文之间提出建议。她发现第一次分组无法公平比较，于是调换阵容，重新观察。最后的选择补上了球队的弱点，也让友谊留下了需要慢慢面对的伤口。
chapters:
  - {id: ch01, title: 第一次比较, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 换组之后, page_refs: [p06, p07, p08, p09]}
  - {id: ch03, title: 两种长处, page_refs: [p10, p11, p12, p13]}
  - {id: ch04, title: 名单公布, page_refs: [p14, p15, p16, p17, p18]}
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 为什么凯文的八分和泰莎的两分还不能直接作公平比较？
    answer: 凯文身边是熟悉配合的老队员，泰莎却花了很多时间帮助配合不熟的队友找位置，两人的条件不同。
    page_refs: [p03, p04, p06]
  - id: q02
    type: character-motive
    speaker: narrator
    prompt: 玛拉为什么要请伊曼教练调换两人的分组？
    answer: 她想分开球员本人的作用和身边阵容的作用，让新的观察更可比。
    page_refs: [p06, p07]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 换组后，泰莎和凯文怎样面对各自开场的失误？
    answer: 泰莎传球出界后继续组织防守；凯文丢球后不再硬冲，而是吸引防守，再把球传给空位队友。
    page_refs: [p08, p09]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 上学期的球队在什么情况下最难得分？
    answer: 球队落后、对手收紧篮下防守时最难得分。
    page_refs: [p13]
  - id: q05
    type: evidence
    speaker: narrator
    prompt: 哪些细节说明凯文不只是自己得分？
    answer: 他问玛拉在哪儿接球，为小个子队友制造空位，在第二名防守者靠近时传给玛拉，并在丢球后马上回防。
    page_refs: [p04, p09, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 玛拉是不是只按得分多少作出建议？请说明理由。
    answer: 不是。她调换阵容、比较两人失误后的反应、考虑球队过去的弱点，也主动说出了泰莎更强的地方。
    page_refs: [p06, p07, p08, p09, p12, p13, p15, p16]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: 结合几次训练和上学期的记录，说明玛拉为什么推荐凯文。
    answer: 凯文面对不同阵容都能得分，受阻后又改善了传球，还能拉开进攻空间；原来的球队防守较稳，却缺少落后时突破紧密防守的办法。
    page_refs: [p04, p09, p10, p11, p12, p13, p15]
  - id: q08
    type: evaluate
    speaker: narrator
    prompt: 玛拉有没有把自己的建议说成永远正确的结论？请用她和教练的谈话回答。
    answer: 没有。她说如果真正比赛一紧，凯文又不传球，自己的建议就站不住，说明以后的表现可能改变判断。
    page_refs: [p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '周一选拔结束，伊曼教练没有马上关灯。她告诉队员，十二人名单只剩一个空位，周五前要定下来。队长玛拉需要在泰莎和凯文之间提出建议。泰莎和她从二年级起就是最好的朋友；新来的凯文却在选拔赛中拿了最高分。玛拉第一次觉得，一张名单也能让球场变得这么安静。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '教练递给她一张空白记录表，只说：“别光数进球。比赛吃紧时，看看谁让场上发生了变化。”玛拉写下得分、传球、防守和失误后的反应。她没写“朋友”两个字，可泰莎的名字就在表格第一行。接下来的三次训练，两名候选人都会参加队内对抗，玛拉要边打边观察。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '第一次对抗，泰莎被分进配合还不熟的那一组。有人漏看身后的掩护，她立刻出声提醒；球滚到边线，她抢回来，没有勉强投篮，而是传给空位队友。队友两次都没投进，泰莎自己的两次出手也碰框而出。终场时，这一组只拿到两分，但几次混乱都被她及时理顺了。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '凯文身边是四名老队员。他借着熟练的传切连续突破，在二十分钟里投进四球。有一次玛拉已经跑到篮下空位，凯文还是自己带球，被人拍掉了。下一回合，他先问玛拉想在哪儿接球，随后送出传球。哨响前他又得分，老队员那组领先八分。'
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: '喝水时，泰莎碰碰玛拉的肩：“周五还去看电影吗？就算教练罚跑也去？”玛拉低头翻记录表，说自己可能会晚。泰莎脸上的笑收了回去。玛拉没有说谎，却拿这张表挡住了朋友的目光。她忽然担心，自己还没作判断，友谊已经让心里有了'
            - vocabulary: {id: bias, text: 偏向}
            - text: '。'
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: '晚上再看数字，凯文八分，泰莎两分，差距很大。可凯文身边的人熟悉每次跑位，泰莎却一直在帮新队友找位置。分数来自不同的条件，不能直接放在一起。玛拉把两套阵容圈出来：只有换组、给同样的上场时间，两人的表现才真正'
            - vocabulary: {id: comparable, text: 可比}
            - text: '。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '第二天，她请教练调换分组。“不然我比较的既是球员，也是她们身边的队友。”伊曼教练看了记录，答应让泰莎跟老队员配合，让凯文带另一组，并给两人相同时间。她没有说明玛拉发现了什么。这样，两名候选人只能照常打球，不能临时演出一场专给队长看的比赛。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '强手面前，泰莎开场就把球传出了边线。她咬了咬嘴唇，转身喊出下一次配合，又提醒玛拉注意背后的掩护。后来，对方突破时，她守住路线，没有伸手拉人，还在人群中拿到篮板。她的投篮依然没进，可她在场时，老队员的防守很少出现无人提醒的空当。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '凯文那组很快落后。他第一次面对两人夹防，仍想硬冲，结果丢了球，只能拍着球裤懊恼。一个小个子队友问该站在哪儿，凯文指了指空出的底角。下一次，他把防守者引向自己，再把球传过去。队友先是投失，后来用同样的机会得了分。玛拉同时记下凯文的失误和改变。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '到了周四，证据多了，答案却没有变轻松。最后一场对抗，两名候选人上场时间完全相同。老队员守得稳，可对手一收紧篮下，她们就很难得分。几个回合空手而归后，场上的声音也少了。玛拉一边组织进攻，一边留意谁能把球队从这种沉默中带出来。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '凯文先上。他突破得分，下一次又在第二名防守者靠近时，把球分给玛拉。玛拉投中，比分追平。接着凯文也丢了一次球，不过他马上回防，逼得对方匆忙传球。凯文没有消除所有问题，但防守者开始追着他移动，原本挤在一起的进攻空间被打开了。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '最后一段换上泰莎。她及时喊换防，挡住一次突破，又从高个队员中间抢下篮板。玛拉急着传球时，她把球回给玛拉，提醒大家重新落位。防守没有再失分，可连续三个回合，球队也没能投进。比赛以平局结束。一个人让球队更稳，另一个人让球队多了一条得分的路。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '训练后，教练拿出上学期的比赛记录。比分接近时，原来的队员常能守住领先；真正困难的是落后以后，对方缩紧防守，没人敢向里突破。泰莎能减少混乱，凯文能改变这种局面，而且换组以后，他不再只顾自己得分。最后一个空位装不下两种长处，玛拉必须决定球队眼下更缺哪一种。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '泰莎在看台边找到玛拉，开口就问：“你会因为我们是朋友选我，还是怕别人说闲话，故意不选我？”玛拉握着两张记录表，过了一会儿才说：“我还没定。但如果只想着别人怎么看，那就不是在看这几次训练。”泰莎点点头：“那你就看训练吧。”说完，她先走了，没留下任何让玛拉轻松的话。'
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: '玛拉重新比较同样的时间、不同强度的对手、两人的失误，以及失误后紧接着做出的选择。泰莎无论跟谁一组，都能让防守更清楚；凯文不只保持得分，还在受阻后学会寻找队友。球队原来的弱点让这场'
            - vocabulary: {id: tradeoff, text: 取舍}
            - text: '更难：增加突破得分，就要放弃泰莎带来的稳定。最后，玛拉写下凯文，也写下哪些新情况会证明自己的判断有误。'
    - id: p16
      illustration: p16
      paragraphs:
        - text: '伊曼教练没有立刻收下建议，而是问：“为什么是凯文？”玛拉说了换组、最后的平局和上学期落后时的困境，也主动说出泰莎做得更好的地方。她最后补充：“如果真正比赛一紧，凯文又不传球，这个建议就站不住。”教练逐项看完，才把第十二个名额给了凯文。以后还可以继续观察，可这次名单必须结束。'
    - id: p17
      illustration: p17
      paragraphs:
        - text: '公布结果后，凯文只低声对玛拉说：“谢谢。”泰莎一直收拾球鞋，直到人快走光，才说：“你本来可以选我。”玛拉回答：“我很想选你。可是球队落后时，凯文能让进攻有新的办法。”泰莎拉好鞋袋：“我看得懂你的记录，但我还是生你的气。”玛拉点头。她没有再用更多解释，逼朋友立刻原谅自己。'
    - id: p18
      illustration: p18
      paragraphs:
        - text: '下周一，玛拉提前来到开放球场。泰莎已经站在罚球线边运球。玛拉停在门口，不知道该不该过去。泰莎把球传来，弯下膝盖摆好防守姿势：“别让我。”玛拉把球回给她，重新开始。第一次突破，泰莎干净地把球拍掉，又把球托到玛拉面前：“你的球。再来。”'
