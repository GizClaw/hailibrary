      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: '最后一段换上泰莎。她及时喊换防，挡住一次突破，又从高个队员中间抢下篮板。玛拉急着传球时，她把球回给玛拉，提醒大家重新落位。防守没有再失分，可连续三个回合，球队也没能投进。比赛以平局结束。一个人让球队更稳，另一个人让球队多了一条得分的路。'}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: '训练后，教练拿出上学期的比赛记录。比分接近时，原来的队员常能守住领先；真正困难的是落后以后，对方缩紧防守，没人敢向里突破。泰莎能减少混乱，凯文能改变这种局面，而且换组以后，他不再只顾自己得分。最后一个空位装不下两种长处，玛拉必须决定球队眼下更缺哪一种。'}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: '泰莎在看台边找到玛拉，开口就问：'}
        - {id: p14-b02, speaker: tessa, text: '你会因为我们是朋友选我，还是怕别人说闲话，故意不选我？'}
        - {id: p14-b03, speaker: narrator, text: '玛拉握着两张记录表，过了一会儿才说：'}
        - {id: p14-b04, speaker: mara, text: '我还没定。但如果只想着别人怎么看，那就不是在看这几次训练。'}
        - {id: p14-b05, speaker: narrator, text: '泰莎点点头。'}
        - {id: p14-b06, speaker: tessa, text: '那你就看训练吧。'}
        - {id: p14-b07, speaker: narrator, text: '说完，她先走了，没留下任何让玛拉轻松的话。'}
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          content:
            - text: '玛拉重新比较同样的时间、不同强度的对手、两人的失误，以及失误后紧接着做出的选择。泰莎无论跟谁一组，都能让防守更清楚；凯文不只保持得分，还在受阻后学会寻找队友。球队原来的弱点让这场'
            - vocabulary: {id: tradeoff, text: 取舍}
            - text: '更难：增加突破得分，就要放弃泰莎带来的稳定。最后，玛拉写下凯文，也写下哪些新情况会证明自己的判断有误。'
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: '伊曼教练没有立刻收下建议，而是问：'}
        - {id: p16-b02, speaker: coach-imani, text: '为什么是凯文？'}
        - {id: p16-b03, speaker: narrator, text: '玛拉说了换组、最后的平局和上学期落后时的困境，也主动说出泰莎做得更好的地方。她最后补充：'}
        - {id: p16-b04, speaker: mara, text: '如果真正比赛一紧，凯文又不传球，这个建议就站不住。'}
        - {id: p16-b05, speaker: narrator, text: '教练逐项看完，才把第十二个名额给了凯文。以后还可以继续观察，可这次名单必须结束。'}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: '公布结果后，凯文只低声对玛拉说：'}
        - {id: p17-b02, speaker: dev, text: '谢谢。'}
        - {id: p17-b03, speaker: narrator, text: '泰莎一直收拾球鞋，直到人快走光，才说：'}
        - {id: p17-b04, speaker: tessa, text: '你本来可以选我。'}
        - {id: p17-b05, speaker: mara, text: '我很想选你。可是球队落后时，凯文能让进攻有新的办法。'}
        - {id: p17-b06, speaker: narrator, text: '泰莎拉好鞋袋。'}
        - {id: p17-b07, speaker: tessa, text: '我看得懂你的记录，但我还是生你的气。'}
        - {id: p17-b08, speaker: narrator, text: '玛拉点头。她没有再用更多解释，逼朋友立刻原谅自己。'}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: '下周一，玛拉提前来到开放球场。泰莎已经站在罚球线边运球。玛拉停在门口，不知道该不该过去。泰莎把球传来，弯下膝盖摆好防守姿势。'}
        - {id: p18-b02, speaker: tessa, text: '别让我。'}
        - {id: p18-b03, speaker: narrator, text: '玛拉把球回给她，重新开始。第一次突破，泰莎干净地把球拍掉，又把球托到玛拉面前。'}
        - {id: p18-b04, speaker: tessa, text: '你的球。再来。'}
