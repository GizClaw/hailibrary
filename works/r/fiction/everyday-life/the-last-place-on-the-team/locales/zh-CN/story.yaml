schema_version: 2
language: zh-CN
writer: 星火
title: 最后一个名额
summary: 球队只剩一个名额，教练请队长玛拉观察好友泰莎和得分出色的新队员德夫。玛拉发现第一次分组无法公平比较，便请教练调换阵容，再如实写下建议。教练作出最终选择，友谊却留下了伤口。
chapters:
  - {id: ch01, title: 第一次比较, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 换组之后, page_refs: [p06, p07, p08, p09]}
  - {id: ch03, title: 两种长处, page_refs: [p10, p11, p12, p13]}
  - {id: ch04, title: 名单公布, page_refs: [p14, p15, p16, p17, p18]}
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 为什么德夫那组的八分和泰莎那组的两分还不能直接作公平比较？
    answer: 德夫那组有熟悉配合的老队员，泰莎那组却有不少需要她帮忙找位置的新队员，两组的条件不同。
    page_refs: [p03, p04, p06]
  - id: q02
    type: character-motive
    speaker: narrator
    prompt: 玛拉为什么要请伊曼教练调换两人的分组？
    answer: 她想分开球员本人的作用和身边阵容的作用，让新的观察更可比。
    page_refs: [p06, p07]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 换组后，泰莎和德夫怎样面对各自开场的失误？
    answer: 泰莎传球出界后继续组织防守；德夫丢球后不再硬冲，而是吸引防守，再把球传给空位队友。
    page_refs: [p08, p09]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 上学期的球队在什么情况下最难得分？
    answer: 球队落后、对手收紧篮下防守时最难得分。
    page_refs: [p02, p10, p13]
  - id: q05
    type: evidence
    speaker: narrator
    prompt: 哪些细节说明德夫不只是自己得分？
    answer: 他问玛拉在哪儿接球，为小个子队友制造空位，在防守者堵住突破路线时传给玛拉，并在丢球后马上回防。
    page_refs: [p04, p09, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 玛拉是不是只按得分多少作出建议？请说明理由。
    answer: 不是。她请教练调换阵容，比较两人失误后的反应，考虑球队过去的弱点，也主动说出泰莎更强的地方；最后由教练作出决定。
    page_refs: [p06, p07, p08, p09, p12, p13, p15, p16]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: 结合几次训练和上学期的记录，说明玛拉为什么推荐德夫。
    answer: 德夫和老队员配合时能够得分，换组后又为队友创造了进球机会。他受阻后改善了传球，还能为玛拉拉开空间；原来的球队防守较稳，却缺少落后时突破严密防守的办法。
    page_refs: [p04, p09, p10, p11, p12, p13, p15]
  - id: q08
    type: evaluate
    speaker: narrator
    prompt: 玛拉和教练有没有把这个选择当成不会改变的结论？请用她们的谈话回答。
    answer: 没有。她们决定继续观察德夫在压力下会不会传球，说明以后的表现仍可能改变教练的判断。
    page_refs: [p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: '周一选拔结束，伊曼教练把玛拉叫到一边；泰莎和德夫还在球馆另一头，听不见谈话。十二人名单只剩一个空位，新来的德夫得分最高，泰莎却是玛拉最好的朋友。'
        - text: '“最后由我决定，不过你是队长，能看到我漏掉的事。”教练说，“我想听真话，也知道你和泰莎的关系；要是太难，就告诉我。”玛拉攥了攥手：“我会把两个人都看清楚。”教练点头，答应每次训练也会亲自观察。'
    - id: p02
      illustration: p02
      paragraphs:
        - text: '教练递给她一张空白记录表：“想想上学期。领先时我们守得住，一落后，大家却总等别人得分。别光数进球，看看谁能让场上发生变化。”玛拉写下得分、传球、防守和失误后的反应。她没写“朋友”两个字，可泰莎的名字就在表格第一行。接下来的三次训练，两名候选人都会参加队内对抗，玛拉要边打边观察。'
    - id: p03
      illustration: p03
      paragraphs:
        - text: '第一次对抗，泰莎被分进配合还不熟的那一组。玛拉上前给持球队员作掩护，泰莎立即提醒负责防守的队友绕开。球滚到边线，她抢回来，没有勉强投篮，而是传给空位的小后卫。小后卫投进了全组唯一一球。之后，泰莎又两次传出空位机会，队友都没投进。她自己的两次出手也碰框而出。终场时，那组一共只拿到两分。'
    - id: p04
      illustration: p04
      paragraphs:
        - text: '德夫身边是四名老队员。他们熟练的跑动拉开了空当，德夫接连突破，先投进三球。有一次玛拉已经跑到篮下空位，他还是自己带球，被人拍掉了。下一回合，德夫先问玛拉想在哪儿接球，随后把球传到她手里。玛拉出手，球碰框而出。'
        - text: '哨响前，德夫再次突破，投进了自己的第四球。他那组一共得到八分，最后领先六分。'
    - id: p05
      illustration: p05
      paragraphs:
        - text: '喝水时，泰莎碰碰玛拉的肩：“周五还去看电影吗？就算教练罚跑也去？”玛拉低头翻记录表：“我可能会晚。”泰莎脸上的笑收了回去。'
        - content:
            - text: '玛拉没有说谎，却拿这张表挡住了朋友的目光。她忽然担心，自己还没作判断，友谊已经让心里有了'
            - vocabulary: {id: bias, text: 偏向}
            - text: '。'
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: '晚上，玛拉又看了一遍：德夫那组八分，泰莎那组两分。可德夫身边的人熟悉每次跑位，泰莎却一直在帮新队友找位置。面对这样的分组，她还不能说两人的表现'
            - vocabulary: {id: comparable, text: 可比}
            - text: '。玛拉把两套阵容圈了起来，合上记录表。'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '第二天，玛拉问：“能不能让他们换组？不然我看不清，到底是球员改变了比赛，还是身边的队友帮了忙。”教练看完记录，说她也想试试。她让泰莎跟老队员配合，让德夫带另一组，并给两人相同时间。玛拉另起一张记录表。教练没有告诉两名候选人在试什么，他们只能像平常一样打球。'
    - id: p08
      illustration: p08
      paragraphs:
        - text: '第一次和老队员配合，泰莎开场就把球传出了边线。她咬了咬嘴唇，转身喊出下一次配合，又提醒玛拉注意背后的掩护。后来，对方突破时，她守住路线，没有伸手拉人，还在人群中拿到篮板。她的投篮依然没进，可她在场时，老队员很少再因为没人提醒而失去防守位置。'
    - id: p09
      illustration: p09
      paragraphs:
        - text: '德夫那组很快落后。两名防守者一上来夹住他，他还想硬冲，结果丢了球，懊恼地拍了一下大腿。一个小个子队友问该站在哪儿。“去底角，”德夫说，“他们再一起堵我，我就传给你。”下一回合，他把两名防守者引向自己，再把球传过去。队友先是投失，后来用同样的机会得了分。玛拉同时记下德夫的失误和改变。'
    - id: p10
      illustration: p10
      paragraphs:
        - text: '到了周四，记录多了，还是很难选。等候上场时，玛拉想起上学期的半决赛：球队守着微弱的领先直到最后几分钟，随后被反超。对手堵住篮下，没人再敢突破，球队最终输了四分。'
        - text: '最后一场对抗，两名候选人上场时间完全相同。老队员守得稳，可连续两次投失后，场上的声音又少了。玛拉一边组织进攻，一边看着每个空手而归的回合。'
    - id: p11
      illustration: p11
      paragraphs:
        - text: '德夫先上。他突破得分。下一回合，原本盯着玛拉的防守者横过来封路，德夫把球分给空位的玛拉。玛拉投中，比分追平。接着德夫也丢了一次球，不过他马上回防，逼得对方匆忙传球。再次进攻时，盯着玛拉的防守者又跟着德夫转身。德夫把球传过去，玛拉出手，球在篮圈上转了一圈，还是落到了外面。'
    - id: p12
      illustration: p12
      paragraphs:
        - text: '最后一段换上泰莎。她及时喊换防，挡住一次突破，又从高个队员中间抢下篮板。玛拉急着传球时，她把球回给玛拉，提醒大家重新落位。防守没有再失分，可连续三个回合，球队也没能投进。终场哨响，比分仍然相同。泰莎把球夹在臂弯里，玛拉则在最后三个回合旁画了线。'
    - id: p13
      illustration: p13
      paragraphs:
        - text: '训练后，教练拿出上学期的比赛记录。三场惜败都留下相似的过程：球队先守住领先，后来被反超，接着连续几个回合没能冲到篮下。教练把这些记录摊在玛拉的两张训练表旁，没有圈任何名字。玛拉把第四节的几行数字看了两遍，又翻回刚结束的那场平局。'
    - id: p14
      illustration: p14
      paragraphs:
        - text: '泰莎在看台边找到玛拉，开口就问：“你会因为我们是朋友推荐我，还是怕别人说闲话，故意不推荐我？”'
        - text: '玛拉攥着两张记录表：“我不知道。我怕推荐你，大家就说我只顾朋友。可要是不推荐你……”泰莎点点头：“那就别猜别人会说什么。告诉我，你看见了什么。”她没等玛拉回答，转身走了。'
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: '玛拉把两张训练表和旧比赛记录排在一起。她在泰莎的表上划出每一次提醒，队友的防守因此更有条理。她又在德夫的表上圈出硬冲失败后的两次传球。在“'
            - vocabulary: {id: tradeoff, text: 取舍}
            - text: '”一栏，她写下两件会失去的东西：泰莎在防守时的声音，或德夫冲击篮下的威胁。铅笔停了一会儿，她写下德夫的名字，又补了一句：继续看他遇到夹防时会不会传球。'
    - id: p16
      illustration: p16
      paragraphs:
        - text: '教练看完建议，问：“为什么是德夫？”玛拉指着换组后的记录：“两个人夹住他时，他没有再硬冲，还抬头看见了空位。防守这件事，我们本来就做得不错。”她也把泰莎做得好的地方指给教练。'
        - text: '教练点着平局那张表：“大家不出声时，泰莎能稳住队伍。德夫突破时，我也看见防守者被他带走了。最后由我决定。我选德夫。”她说正式比赛里还要看他会不会在压力下传球，随后合上名单夹。'
    - id: p17
      illustration: p17
      paragraphs:
        - text: '教练公布名单后，其他人陆续离开更衣区。德夫朝玛拉点点头：“我会认真训练。”说完，他走到一边。泰莎仍坐在长凳上收拾球鞋。'
        - text: '“你本来可以推荐我。”她说。“我知道，”玛拉回答，“对不起，让你这么难受。”泰莎拉好鞋袋：“我还是生气。”玛拉点头，没有打破接下来的沉默。'
    - id: p18
      illustration: p18
      paragraphs:
        - text: '下周一，队训还没开始，玛拉就提前到了球馆。泰莎已经站在罚球线边运球。玛拉停在门口，不知道该不该过去。泰莎把球传来，屈膝摆好防守姿势：“别故意让着我。认真打。”玛拉把球回给她，重新开始。第一次突破，泰莎干净地把球拍掉，又把球托到玛拉面前：“你的球。再来。”'
