      display_name: 旁白
      tts: {delivery: 克制观察，在情绪转折处清楚但不煽情, timbre: 清晰温暖、略带沉静感的成年声音, pace: 平稳中速, pitch: 中音}
    mara:
      display_name: 玛拉
      tts: {delivery: 思考时有自然停顿，作决定时直接坚定, timbre: 清亮而有重心的女孩声音, pace: 稍慢的中速, pitch: 中高音}
    tessa:
      display_name: 泰莎
      tts: {delivery: 放松时爽快亲近，受伤时短促克制, timbre: 明亮且略带沙感的女孩声音, pace: 偏快中速, pitch: 高音}
    dev:
      display_name: 凯文
      tts: {delivery: 安静专注，不夸张表达感谢, timbre: 柔和扎实的男孩声音, pace: 从容的中慢速, pitch: 中音}
    coach-imani:
      display_name: 伊曼教练
