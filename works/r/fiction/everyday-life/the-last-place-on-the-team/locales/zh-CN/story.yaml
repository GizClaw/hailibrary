      illustration: p08
      blocks:
        - {id: p08-b01, speaker: narrator, text: '第一次和老队员配合，泰莎开场就把球传出了边线。她咬了咬嘴唇，转身喊出下一次配合，又提醒玛拉注意背后的掩护。后来，对方突破时，她守住路线，没有伸手拉人，还在人群中拿到篮板。她的投篮依然没进，可她在场时，老队员很少再因为没人提醒而失去防守位置。'}
    - id: p09
      illustration: p09
      blocks:
        - {id: p09-b01, speaker: narrator, text: '德夫那组很快落后。两名防守者一上来夹住他，他还想硬冲，结果丢了球，懊恼地拍了一下大腿。一个小个子队友问该站在哪儿。'}
        - {id: p09-b02, speaker: dev, text: '去底角。他们再一起堵我，我就传给你。'}
        - {id: p09-b03, speaker: narrator, text: '下一回合，德夫把两名防守者引向自己，再把球传过去。队友先是投失，后来用同样的机会得了分。玛拉同时记下德夫的失误和改变。'}
    - id: p10
      illustration: p10
      blocks:
        - {id: p10-b01, speaker: narrator, text: '到了周四，记录多了，还是很难选。等候上场时，玛拉想起上学期的半决赛：球队守着微弱的领先直到最后几分钟，随后被反超。对手堵住篮下，没人再敢突破，球队最终输了四分。最后一场对抗，两名候选人上场时间完全相同。老队员守得稳，可连续两次投失后，场上的声音又少了。玛拉一边组织进攻，一边看着每个空手而归的回合。'}
    - id: p11
      illustration: p11
      blocks:
        - {id: p11-b01, speaker: narrator, text: '德夫先上。他突破得分。下一回合，原本盯着玛拉的防守者横过来封路，德夫把球分给空位的玛拉。玛拉投中，比分追平。接着德夫也丢了一次球，不过他马上回防，逼得对方匆忙传球。再次进攻时，盯着玛拉的防守者又跟着德夫转身。德夫把球传过去，玛拉出手，球在篮圈上转了一圈，还是落到了外面。'}
    - id: p12
      illustration: p12
      blocks:
        - {id: p12-b01, speaker: narrator, text: '最后一段换上泰莎。她及时喊换防，挡住一次突破，又从高个队员中间抢下篮板。玛拉急着传球时，她把球回给玛拉，提醒大家重新落位。防守没有再失分，可连续三个回合，球队也没能投进。终场哨响，比分仍然相同。泰莎把球夹在臂弯里，玛拉则在最后三个回合旁画了线。'}
    - id: p13
      illustration: p13
      blocks:
        - {id: p13-b01, speaker: narrator, text: '训练后，教练拿出上学期的比赛记录。三场惜败都留下相似的过程：球队先守住领先，后来被反超，接着连续几个回合没能冲到篮下。教练把这些记录摊在玛拉的两张训练表旁，没有圈任何名字。玛拉把第四节的几行数字看了两遍，又翻回刚结束的那场平局。'}
    - id: p14
      illustration: p14
      blocks:
        - {id: p14-b01, speaker: narrator, text: '泰莎在看台边找到玛拉，开口就问：'}
        - {id: p14-b02, speaker: tessa, text: '你会因为我们是朋友推荐我，还是怕别人说闲话，故意不推荐我？'}
        - {id: p14-b03, speaker: narrator, text: '玛拉攥着两张记录表：'}
        - {id: p14-b04, speaker: mara, text: '我不知道。我怕推荐你，大家就说我只顾朋友。可要是不推荐你……'}
        - {id: p14-b05, speaker: narrator, text: '泰莎点点头。'}
        - {id: p14-b06, speaker: tessa, text: '那就别猜别人会说什么。告诉我，你看见了什么。'}
        - {id: p14-b07, speaker: narrator, text: '她没等玛拉回答，转身走了。'}
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          content:
            - text: '玛拉把两张训练表和旧比赛记录排在一起。她在泰莎的表上划出每一次提醒，队友的防守因此更有条理；又在德夫的表上圈出硬冲失败后的两次传球。在“'
            - vocabulary: {id: tradeoff, text: 取舍}
            - text: '”一栏，她写下两件会失去的东西：泰莎在防守时的声音，或德夫冲击篮下的威胁。铅笔停了一会儿，她写下德夫的名字，又补了一句：继续看他遇到夹防时会不会传球。'
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: '教练看完建议，问：'}
        - {id: p16-b02, speaker: coach-imani, text: '为什么是德夫？'}
        - {id: p16-b03, speaker: narrator, text: '玛拉指着换组后的记录：'}
        - {id: p16-b04, speaker: mara, text: '两个人夹住他时，他没有再硬冲，还抬头看见了空位。防守这件事，我们本来就做得不错。'}
        - {id: p16-b05, speaker: narrator, text: '她也把泰莎做得好的地方指给教练。教练点着平局那张表：'}
        - {id: p16-b06, speaker: coach-imani, text: '大家不出声时，泰莎能稳住队伍。德夫突破时，我也看见防守者被他带走了。最后由我决定。我选德夫。'}
        - {id: p16-b07, speaker: narrator, text: '她说，正式比赛里还要继续看德夫会不会在压力下传球，随后合上名单夹。'}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: '教练公布名单后，其他人陆续离开更衣区。德夫朝玛拉点点头：'}
        - {id: p17-b02, speaker: dev, text: '我会认真训练。'}
        - {id: p17-b03, speaker: narrator, text: '说完，他走到一边。泰莎仍坐在长凳上收拾球鞋。'}
        - {id: p17-b04, speaker: tessa, text: '你本来可以推荐我。'}
        - {id: p17-b05, speaker: mara, text: '我知道。对不起，让你这么难受。'}
        - {id: p17-b06, speaker: narrator, text: '泰莎拉好鞋袋。'}
        - {id: p17-b07, speaker: tessa, text: '我还是生气。'}
        - {id: p17-b08, speaker: narrator, text: '玛拉点头，没有打破接下来的沉默。'}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: '下周一，队训还没开始，玛拉就提前到了球馆。泰莎已经站在罚球线边运球。玛拉停在门口，不知道该不该过去。泰莎把球传来，屈膝摆好防守姿势。'}
        - {id: p18-b02, speaker: tessa, text: '别故意让着我。认真打。'}
        - {id: p18-b03, speaker: narrator, text: '玛拉把球回给她，重新开始。第一次突破，泰莎干净地把球拍掉，又把球托到玛拉面前。'}
        - {id: p18-b04, speaker: tessa, text: '你的球。再来。'}
