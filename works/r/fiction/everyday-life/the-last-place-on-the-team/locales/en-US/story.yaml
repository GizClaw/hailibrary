schema_version: 2
language: en-US
writer: kind-spark
title: The Last Spot on the Team
summary: Coach Imani asks captain Mara to compare Tessa, her closest friend, and Dev, a strong new scorer, before filling one remaining roster spot. Mara asks the coach to switch the practice lineups, then gives an honest recommendation. Coach Imani makes the final choice, leaving the friendship bruised.
chapters:
  - {id: ch01, title: The Uneven First Look, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Switching the Lineups, page_refs: [p06, p07, p08, p09]}
  - {id: ch03, title: Two Kinds of Help, page_refs: [p10, p11, p12, p13]}
  - {id: ch04, title: The Recommendation, page_refs: [p14, p15, p16, p17, p18]}
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: Why were Dev's group's eight points and Tessa's group's two points not yet a fair comparison?
    answer: Dev's group included returning starters who knew the team's movements, while Tessa's group included less experienced players who needed help finding their places.
    page_refs: [p03, p04, p06]
  - id: q02
    type: character-motive
    speaker: narrator
    prompt: Why did Mara ask Coach Imani to switch Tessa's and Dev's groups?
    answer: Mara wanted to separate each candidate's effect from the effect of the lineup around that player.
    page_refs: [p06, p07]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How did Tessa and Dev respond differently after early mistakes in the switched lineups?
    answer: Tessa returned to organizing the defense after a bad pass. Dev stopped forcing the drive, drew defenders, and passed to an open teammate.
    page_refs: [p08, p09]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: What problem had the returning team faced during the previous season?
    answer: The team struggled to score after falling behind when opponents crowded the basket.
    page_refs: [p02, p10, p13]
  - id: q05
    type: evidence
    speaker: narrator
    prompt: What evidence showed that Dev could do more than score by himself?
    answer: He asked where Mara wanted a pass, created a corner shot for a younger guard, passed to Mara while his defender blocked the lane, and ran back after a turnover.
    page_refs: [p04, p09, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: Was Mara's recommendation based only on which candidate scored more? Explain.
    answer: No. She noticed the uneven conditions and asked Coach Imani to switch the lineups. She considered defense, responses after mistakes, the team's earlier problem, and Tessa's stronger contributions. Coach Imani made the final choice.
    page_refs: [p06, p07, p08, p09, p12, p13, p15, p16]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: Combine evidence from the practices and the previous season to explain why Mara recommended Dev.
    answer: Dev scored with the starters, then created a basket for a teammate in the switched practice. He also improved his passing under pressure and opened space for Mara. The returning team already defended steadily but needed another way to score after falling behind.
    page_refs: [p04, p09, p10, p11, p12, p13, p15]
  - id: q08
    type: evaluate
    speaker: narrator
    prompt: Did Mara and Coach Imani treat the choice as certain to remain correct? Use evidence from their talk.
    answer: No. They agreed to keep watching whether Dev passed under pressure, so later behavior could change how the coach judged him.
    page_refs: [p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'On Monday, Coach Imani called Mara aside after basketball tryouts while Tessa and Dev waited across the gym, too far away to hear. Eleven names were set. Dev, the new student, had scored more than anyone, while Tessa had been Mara''s closest friend since second grade.'
        - text: '“The final choice is mine,” Coach Imani said. “You''re captain, so tell me what I miss by Friday.” She nodded toward Tessa. “I know she''s your best friend, so tell me if this is too hard.” Mara swallowed, then said, “I can watch both.” Coach Imani promised to judge every practice herself.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'Coach Imani handed Mara a blank practice chart. “Think about last season,” she said. “We could protect a lead, but when we fell behind, everyone waited for someone else to score. Write down what each player changes when the game gets hard.” Mara added spaces for scoring, passing, defense, and response after a mistake. She did not add friendship, although the word stayed in her mind. For three practices, Tessa and Dev would rotate through short scrimmages while Mara watched from the court.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Tessa began with the second group, which included several players still learning the team''s plays. When Mara set a screen for the ball handler, Tessa warned the teammate guarding her and helped her go around it. Tessa chased a loose ball and passed instead of forcing a crowded shot. A younger guard made that shot for the group''s only basket. Twice more, Tessa''s passes created open chances that missed. Tessa also missed both of her own shots. Her group finished with two points.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Dev played beside four returning starters. Their cuts opened lanes, and he drove past defenders for three baskets. Once, he kept the ball while Mara stood open near the basket, and a defender knocked it away. On the next play, Dev asked where Mara wanted the pass and sent the ball there. Mara''s shot struck the rim.'
        - text: 'Just before the whistle, Dev drove again and made his fourth basket. His group finished with eight points and won by six.'
    - id: p05
      illustration: p05
      paragraphs:
        - text: 'At the water fountain, Tessa bumped Mara''s shoulder. “Friday movie, even if Coach makes us run?” she asked. Mara pretended to study the practice chart. “I might be late,” she said. Tessa stopped smiling.'
        - content:
            - text: 'Mara had not lied, but she had used the chart to avoid her friend. She wondered whether friendship had already created a '
            - vocabulary: {id: bias, text: bias}
            - text: ' before she wrote a single judgment.'
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 'That evening, Mara studied the eight beside Dev''s group and the two beside Tessa''s. Dev had played with teammates who knew every cut. Tessa had spent much of her time directing players still learning their places. Mara could not call those totals '
            - vocabulary: {id: comparable, text: comparable}
            - text: '. She circled both lineups and carried the chart back to Coach Imani the next morning.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '“Can we switch their groups?” Mara asked. “I can''t tell what belongs to the player and what belongs to the group.” Coach Imani studied the chart. “I was wondering the same thing,” she said. She moved Tessa beside the starters and Dev into the second group, with equal minutes for both. Mara started a fresh chart. Neither candidate knew what the coach was testing, so each had to play a normal practice.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Playing beside the starters for the first time, Tessa sent her first pass out of bounds. She pressed her lips together, called the next play, and warned Mara about a screen behind her. Later, Tessa stayed in front of a drive without grabbing the player and secured the loose ball. The starters gave up fewer easy shots while she played. Her own shots still struck the rim, but her voice kept the defense organized.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Dev''s new group fell behind early. He tried to drive through two defenders, lost the ball, and slapped one hand against his thigh. A younger guard asked where to stand. “Stay in the corner,” Dev said. “If both come at me again, I''ll pass.” On the next play, Dev drew the defenders toward himself and found the guard. The shot missed, but Dev made the same pass again. This time it went in. Mara marked both the mistake and the change.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'By Thursday, Mara had evidence from different lineups, but no easy answer. While she waited to check in, she remembered last season''s semifinal. Her team had protected a small lead until late, then fallen behind. When the other side packed the lane, no one drove. They lost by four.'
        - text: 'Coach Imani arranged one final scrimmage with equal minutes for both candidates. The returning team defended steadily, yet two missed shots made the players quiet. Mara felt each empty possession shorten the game.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'Dev entered first. He scored on a drive, then found Mara when her defender stepped across the lane. Her shot tied the game. On the next possession, Dev lost the ball, ran back, and pressured the other team into a difficult pass. When he attacked again, Mara''s defender turned toward him. Dev passed to Mara, but her shot rolled off the rim.'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Tessa replaced him for the last stretch. She called a switch that stopped a drive and pulled down a hard rebound between taller players. When Mara rushed a pass, Tessa returned the ball and told her to reset. The defense held, but three careful possessions ended without a basket. The whistle ended a tie. Tessa tucked the ball under one arm while Mara wrote beside the final three empty possessions.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'After practice, Coach Imani opened the folder from last season. Three close losses showed the pattern Mara remembered. The team had held a lead, fallen behind, and then gone several possessions without getting to the basket. The coach laid those score sheets beside Mara''s two practice charts without circling a name. Mara read the fourth-quarter lines twice, then turned back to her notes from the tied scrimmage.'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'Tessa found Mara alone on the bleachers. “Are you going to recommend me because we''re friends,” she asked, “or keep my name off your paper so nobody thinks you did?”'
        - text: 'Mara gripped the two practice charts. “I don''t know. I''m scared that if I recommend you, everyone will think it''s because we''re friends. And if I don''t—” Tessa nodded once. “Then stop guessing what people will think. Tell me what you saw.” She left before Mara could answer.'
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 'Mara spread the two practice charts beside the old score sheets. On Tessa''s chart, she underlined every call that had put a teammate in place. On Dev''s, she marked the passes that followed his failed drive. In the row labeled '
            - vocabulary: {id: tradeoff, text: tradeoff}
            - text: ', Mara listed what either choice would cost: Tessa''s steady voice on defense or Dev''s drives toward the basket. Her pencil hovered, then she wrote Dev''s name and a note to watch whether he kept passing.'
    - id: p16
      illustration: p16
      paragraphs:
        - text: 'Coach Imani read the paper, then asked why Mara had recommended Dev. Mara pointed to the switched practice. “When two defenders stopped him, he looked up and saw the open player. We already know how to defend.” Mara also showed every note beside Tessa''s name, then Coach Imani tapped the tied-game chart.'
        - text: '“I saw Tessa settle us when we got quiet and Dev pull a defender away from you. The choice is mine. I''m choosing Dev,” Coach Imani said. She promised to keep watching whether he passed under pressure, then closed the roster folder.'
    - id: p17
      illustration: p17
      paragraphs:
        - text: 'After Coach Imani announced the team, Dev found Mara in the nearly empty locker area. “I''ll be ready at practice,” he said, then stepped away. Tessa sat on a bench and packed her shoes.'
        - text: '“You could have recommended me,” she said. “I know,” Mara answered. “I''m sorry this hurt you.” Tessa pulled the zipper closed. “I''m still angry.” Mara nodded and let the silence stay.'
    - id: p18
      illustration: p18
      paragraphs:
        - text: 'On Monday, Mara went to the open gym before team practice. Tessa was already there, bouncing a ball at the free-throw line. Mara stopped near the door as Tessa tossed her the ball and took a defensive stance. “Don''t go easy on me,” she said. Mara checked the ball back. On the first drive, Tessa knocked it cleanly from her hands. She held it out again. “Your ball,” Tessa said. “Again.”'
