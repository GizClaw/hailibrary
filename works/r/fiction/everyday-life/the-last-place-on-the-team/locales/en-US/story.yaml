schema_version: 2
language: en-US
writer: kind-spark
title: The Last Spot on the Team
summary: Captain Mara must recommend Tessa, her closest friend, or Dev, a strong new scorer, for one remaining roster spot. She changes the practice lineups to make the evidence comparable, then makes a choice that helps the team but leaves her friendship bruised.
chapters:
  - {id: ch01, title: The Uneven First Look, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Switching the Lineups, page_refs: [p06, p07, p08, p09]}
  - {id: ch03, title: Two Kinds of Help, page_refs: [p10, p11, p12, p13]}
  - {id: ch04, title: The Recommendation, page_refs: [p14, p15, p16, p17, p18]}
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: Why were Dev's eight points and Tessa's two points not yet a fair comparison?
    answer: Dev played with returning starters who knew the team's movements, while Tessa spent much of the scrimmage directing a less experienced group.
    page_refs: [p03, p04, p06]
  - id: q02
    type: character-motive
    speaker: narrator
    prompt: Why did Mara ask Coach Imani to switch Tessa's and Dev's groups?
    answer: Mara wanted to separate each candidate's effect from the effect of the lineup around that player.
    page_refs: [p06, p07]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How did Tessa and Dev respond differently after early mistakes in the switched lineups?
    answer: Tessa returned to organizing the defense after a bad pass. Dev stopped forcing the drive, drew defenders, and passed to an open teammate.
    page_refs: [p08, p09]
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: What problem had the returning team faced in close games during the previous season?
    answer: The team struggled to score after falling behind when opponents crowded the basket.
    page_refs: [p13]
  - id: q05
    type: evidence
    speaker: narrator
    prompt: What evidence showed that Dev could do more than score by himself?
    answer: He asked where Mara wanted a pass, created a corner shot for a younger guard, passed when a second defender approached, and ran back after a turnover.
    page_refs: [p04, p09, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: Was Mara's recommendation based only on which candidate scored more? Explain.
    answer: No. She made the conditions more comparable, considered defense and responses after mistakes, used the team's earlier problem, and named Tessa's stronger contributions.
    page_refs: [p06, p07, p08, p09, p12, p13, p15, p16]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: Combine evidence from the practices and the previous season to explain why Mara recommended Dev.
    answer: Dev scored against different groups, improved his passing under pressure, and opened space for teammates. The returning team already defended steadily but needed another way to score after falling behind.
    page_refs: [p04, p09, p10, p11, p12, p13, p15]
  - id: q08
    type: evaluate
    speaker: narrator
    prompt: Did Mara present her recommendation as certain to remain correct? Use evidence from her talk with Coach Imani.
    answer: No. Mara said her recommendation would fail if Dev stopped passing when games became difficult, so later behavior could change the judgment.
    page_refs: [p15, p16]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 'On Monday, Coach Imani closed the gym doors after basketball tryouts. Eleven names were already set, and one roster spot remained. She asked Mara, the team captain, to recommend either Tessa or Dev by Friday. Tessa had been Mara''s closest friend since second grade. Dev was new at school, but he had scored more points than anyone during tryouts. Mara''s answer could change the team and one friendship.'
    - id: p02
      illustration: p02
      paragraphs:
        - text: 'Coach Imani handed Mara a blank practice chart. “Write down what each player changes when the game gets hard,” she said. Mara added spaces for scoring, passing, defense, and response after a mistake. She did not add friendship, although the word stayed in her mind. For three practices, Tessa and Dev would rotate through short scrimmages while Mara watched from the court.'
    - id: p03
      illustration: p03
      paragraphs:
        - text: 'Tessa began with the second group, which included several players still learning the team''s plays. She called out an open screen before a teammate saw it. She chased down a loose ball and passed instead of forcing a crowded shot. Twice, her passes created open chances that missed. Tessa also missed both of her own shots, so her group finished the scrimmage with only two points.'
    - id: p04
      illustration: p04
      paragraphs:
        - text: 'Dev played beside four returning starters. He drove past defenders and scored four baskets during the same twenty-minute scrimmage. Once, he kept the ball while Mara stood open near the basket, and a defender knocked it away. On the next play, Dev asked where Mara wanted the pass. He scored again before the whistle, and the starters won by eight points.'
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 'At the water fountain, Tessa bumped Mara''s shoulder. “Friday movie, even if Coach makes us run?” she asked. Mara pretended to study the practice chart. “I might be late,” she said. Tessa stopped smiling. Mara had not lied, but she had used the chart to avoid her friend. She wondered whether friendship had already created a '
            - vocabulary: {id: bias, text: bias}
            - text: ' before she wrote a single judgment.'
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 'That evening, the numbers looked simple: Dev had eight points, and Tessa had two. The conditions were not simple. Dev had played with teammates who knew every cut, while Tessa had spent much of her time directing a less experienced group. Their results were not yet '
            - vocabulary: {id: comparable, text: comparable}
            - text: '. Mara circled the two lineups and carried the chart back to Coach Imani the next morning.'
    - id: p07
      illustration: p07
      paragraphs:
        - text: '“I need to switch their groups,” Mara said. “Otherwise, I am comparing players and lineups at the same time.” Coach Imani studied the chart, then moved Tessa beside the starters and Dev into the second group. She gave both candidates equal minutes. Neither player knew which detail Mara had questioned, so they could not shape one perfect practice for her.'
    - id: p08
      illustration: p08
      paragraphs:
        - text: 'Against the strongest defenders, Tessa''s first pass went out of bounds. She pressed her lips together, called the next play, and warned Mara about a screen behind her. Later, Tessa blocked a drive without grabbing the shooter and secured the loose ball. The starters gave up fewer easy shots while she played. Her own shots still struck the rim, but her voice kept the defense organized.'
    - id: p09
      illustration: p09
      paragraphs:
        - text: 'Dev''s new group fell behind early. He tried to drive through two defenders, lost the ball, and slapped his hands against his shorts. Then a younger guard asked where to stand. Dev pointed to an open corner, drew a defender toward himself, and passed. The guard missed, yet Dev made the same pass again. This time, the shot went in. Mara marked both the mistake and the adjustment.'
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'By Thursday, Mara had evidence from different lineups, but no easy answer. Coach Imani arranged one final scrimmage with equal minutes for both candidates. The returning team defended steadily but struggled to score when the other side crowded the basket. Mara felt every empty possession shorten the game. She also noticed how quickly players stopped talking after two missed shots.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: 'Dev entered first. He scored on a drive, then found Mara when a second defender moved toward him. Her shot tied the game. On the next possession, he lost the ball, ran back, and forced a difficult pass. Dev did not solve every problem, but the offense changed when defenders had to follow him. The team found room it had not created before.'
    - id: p12
      illustration: p12
      paragraphs:
        - text: 'Tessa replaced him for the last stretch. She called a switch that stopped a drive and pulled down a hard rebound between taller players. When Mara rushed a pass, Tessa returned the ball and told her to reset. The defense held, but three careful possessions ended without a basket. The scrimmage finished tied. Each candidate had answered a different weakness.'
    - id: p13
      illustration: p13
      paragraphs:
        - text: 'After practice, Coach Imani opened the folder from last season. In close games, the returning players had often protected small leads. They had struggled more when they fell behind and needed someone to break through tight defense. Tessa made that group steadier. Dev gave it another way to score, and his passing had improved when the lineup changed. One roster spot could not provide both strengths.'
    - id: p14
      illustration: p14
      paragraphs:
        - text: 'Tessa found Mara alone on the bleachers. “Are you going to pick me because we''re friends,” she asked, “or leave me out so nobody thinks you did?” Mara looked at the two practice charts. “I don''t know yet,” she said. “I know that either reason would be about us, not about these practices.” Tessa nodded once. “Then use the practices.” She left before Mara could make that sound painless.'
    - id: p15
      illustration: p15
      paragraphs:
        - content:
            - text: 'Mara compared equal minutes, stronger opponents, mistakes, and the next choices both players made. Tessa''s communication remained valuable in every group. Dev''s scoring also held up, and he had changed his passing after the first failed drive. The team''s old problem made the '
            - vocabulary: {id: tradeoff, text: tradeoff}
            - text: ' harder, not easier: choosing new scoring meant losing Tessa''s steadiness. Mara wrote Dev''s name, then listed the evidence that could prove her wrong later.'
    - id: p16
      illustration: p16
      paragraphs:
        - text: 'Coach Imani did not accept the paper at once. “Why Dev?” she asked. Mara described the lineup switch, the tied game, and the pattern from last season. She also named what Tessa did better. “If Dev stops passing when games matter, my recommendation fails,” Mara finished. Coach Imani read every line and made Dev the twelfth player. The choice stayed open to future evidence, but the roster did not.'
    - id: p17
      illustration: p17
      paragraphs:
        - text: '“Thanks,” Dev told Mara quietly after Coach announced the team. Tessa packed her shoes without speaking until the gym was almost empty. Then she said, “You could have chosen me.” Mara answered, “I wanted to, but Dev changed what this team can do when it falls behind.” Tessa pulled the zipper closed. “I understand your chart,” she said. “I''m still angry with you.” Mara nodded. An explanation could answer a question without ending the hurt.'
    - id: p18
      illustration: p18
      paragraphs:
        - text: 'On Monday, Mara went to the open gym before team practice. Tessa was already there, bouncing a ball at the free-throw line. Mara stopped near the door as Tessa tossed her the ball and took a defensive stance. “Don''t make this easy for me,” she said. Mara checked the ball back. On the first drive, Tessa knocked it cleanly from her hands. She held it out again. “Your ball,” Tessa said. “Again.”'
