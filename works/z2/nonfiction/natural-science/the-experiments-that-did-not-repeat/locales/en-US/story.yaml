        - id: p15-b01
          speaker: narrator
          text: "Simmons, Nelson, and Simonsohn demonstrated this danger in twenty eleven through simulations and experiments. Flexible stopping, exclusions, outcomes, and covariates could greatly increase the chance of obtaining a conventionally significant result under a null model. The lesson was not that every researcher fabricated evidence. Repeated undisclosed searching changes the meaning of the final p-value. The calculation assumes a testing process; if the reported analysis conceals the process that selected it, readers evaluate the wrong procedure and underestimate how often chance could yield the reported result."
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: "P-hacking became a compact name for outcome-dependent efforts to obtain significance, but the label can obscure degrees of intent. A researcher may consciously hunt for a publishable result, follow local habits without recognizing their statistical cost, or explore many patterns for legitimate discovery and then describe one as confirmation. Those conduct questions differ. The evidential problem is shared: unreported multiplicity makes a surprising result less surprising. Exploration remains valuable when it is identified as exploration and followed, where appropriate, by a new confirmatory test."
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: "A p-value is often misinterpreted as the probability that a hypothesis is wrong. The American Statistical Association states that it is not. Under a specified statistical model, the value describes how incompatible the observed data are with that model; it does not assign truth probabilities to hypotheses, measure practical importance, or reveal effect size. Nor does passing a threshold transform a noisy estimate into a stable fact. Design quality, assumptions, missing analyses, measurement validity, and the consequences of error remain part of inference."
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: "Correcting misuse does not require banning p-values. In twenty twenty-one, an ASA task force stressed that significance tests remain useful when properly applied and interpreted. Sound analysis must also describe uncertainty and variability, address multiplicity, and consider study design alongside other evidence. That statement resisted another seductive headline: that one flawed research culture could be repaired by deleting one statistic. Different inferential tools answer different questions and carry their own assumptions. Confidence intervals, likelihoods, Bayesian models, prediction, and decision analysis can improve reasoning, but none makes selective reporting, weak measurement, or vague theory harmless."
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: "Publication incentives amplify selection. Journals have historically favored clear, positive, novel stories; researchers face career rewards for producing them. If null or complicated findings remain in drawers, the visible literature exaggerates success even when every individual analysis follows its stated rule. Small studies intensify the problem because only their largest chance estimates may cross a threshold. Replication then appears to shrink effects partly because the second study was not selected for having won the same sampling lottery. The mechanism is statistical and institutional at once."
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: "One reform changes the order of decisions. In preregistration, researchers place a time-stamped, read-only plan in a repository before data collection or analysis. The record may be public immediately or kept under a temporary embargo. A useful plan specifies hypotheses, outcomes, exclusions, stopping rules, and analyses closely enough that later deviations can be recognized. It does not forbid discovery, lock scientists into known mistakes, or certify that a design is good. It preserves chronology: readers can tell which tests were proposed before outcomes and which questions emerged after the data were seen."
    - id: p21
      illustration: p21
      blocks:
        - id: p21-b01
          speaker: narrator
          text: "Preregistration works only as well as its specificity and use. A vague plan can leave nearly as much flexibility as no plan; an inaccessible plan cannot help readers; an unreported deviation restores the old ambiguity. Yet deviations are not automatically misconduct. Equipment fails, assumptions break, and unexpected structure may demand a better model. The remedy is transparent explanation, with planned and exploratory results distinguished. A timestamp does not replace judgment or guarantee truth. It gives judgment an auditable history."
    - id: p22
      illustration: p22
      blocks:
        - id: p22-b01
          speaker: narrator
          text: "Registered Reports move evaluation earlier. Editors who adopted the format chose to review the question and method before researchers knew the outcomes, then to offer in-principle acceptance to strong protocols. A null result alone would not revoke that decision. Because publication no longer depended chiefly on a dramatic answer, a tractable question and credible method carried more weight. The format is designed chiefly for confirmatory, hypothesis-driven inquiry, while still allowing researchers to report serendipitous findings separately. Reform has to match the inquiry."
    - id: p23
      illustration: p23
      blocks:
        - id: p23-b01
          speaker: narrator
          text: "Sharing materials, data, and code creates other forms of accountability, subject to privacy, consent, security, and ownership constraints. Materials help a new team reproduce procedures. Data and code let readers check whether reported analyses run as described and explore sensitivity to defensible alternatives. These resources do not prove that a measure captures its intended construct or that participants in another setting interpret it similarly. Transparency makes the research process inspectable; it does not guarantee that the chosen measures answer the right question."
    - id: p24
      illustration: p24
      blocks:
        - id: p24-b01
          speaker: narrator
          text: "Better measurement may matter more than a larger sample. If a questionnaire changes meaning across groups, precision around its score cannot rescue the intended inference. If an experimental manipulation barely changes the proposed mental state, a null replication may test implementation rather than theory. Conversely, repeated positive results with the same biased instrument can reproduce the bias. Replicability, validity, and generalizability overlap but are not synonyms. A method can be repeatable and wrong, valid in one population but not another, or too imprecise to decide."
    - id: p25
      illustration: p25
      blocks:
        - id: p25-b01
          speaker: narrator
          text: "Direct replication holds the original method as constant as practical and asks whether the result recurs. Conceptual replication changes operations while testing the same theoretical relation. Direct attempts diagnose whether a published procedure can deliver its result again; conceptual attempts probe whether the explanation survives new implementations. Neither is inherently superior. A conceptual failure may indict the theory or merely introduce a weak operation. A direct success may establish a narrow regularity without explaining it. Strong programs use both and state which claim each attempt can revise."
    - id: p26
      illustration: p26
      blocks:
        - id: p26-b01
          speaker: narrator
          text: "Multiple laboratories can separate local accident from broader pattern. Teams agree on a protocol, recruit across sites, and examine whether effects vary with measured contexts. Large collaborations improve precision and reveal heterogeneity, but shared procedures can also share a blind spot. If every site uses the same narrow population or flawed instrument, agreement does not establish universality. Variation should be designed, documented, and analyzed rather than treated as noise only after results diverge. Geographic breadth matters only when relevant differences become part of inference."
    - id: p27
      illustration: p27
      blocks:
        - id: p27-b01
          speaker: narrator
          text: "Meta-analysis combines estimates across studies, weighting them by precision under an explicit model. It can show that a literature contains a small average effect, substantial heterogeneity, or uncertainty too large for a confident summary. It can also inherit publication bias, incompatible measures, and weak designs. Combining ten biased studies does not manufacture an unbiased answer. A responsible synthesis examines study quality, selection, and sensitivity, then reports the range of conclusions supported under plausible assumptions rather than hiding judgment beneath numerical authority."
    - id: p28
      illustration: p28
      blocks:
        - id: p28-b01
          speaker: narrator
          text: "When a result does not repeat, the follow-up should be proportional to the claim's importance and the evidence's ambiguity. Investigators can compare protocols, verify code, inspect manipulation checks, estimate precision, and design replications that separate competing explanations. In an adversarial collaboration, researchers with opposing expectations choose a discriminating test together before observing its result. They must decide which outcome would count against each position. Agreement about the protocol cannot force agreement about theory, but it makes it harder for either side to move every criterion afterward."
    - id: p29
      illustration: p29
      blocks:
        - id: p29-b01
          speaker: narrator
          text: "Reforms also alter who bears costs and who can participate. Open data enables checking, but privacy and consent can restrict what should be released. Large collaborations distribute expertise; when their labor is largely voluntary, however, researchers without funded time are easier to exclude. A careful individual practice may also lose force when institutions continue rewarding novelty instead of rigor. Registered Reports, already represented in published work by twenty fourteen, show that reform developed through a broader movement rather than appearing after one replication project. Evaluating change therefore requires evidence about resources, incentives, and behavior."
    - id: p30
      illustration: p30
      blocks:
        - id: p30-b01
          speaker: narrator
          text: "The label replication crisis does not identify a single defect. The evidence revealed weak incentives, small samples, selective reporting, flexible analysis, measurement problems, and underspecified theories in different combinations. It also revealed a field capable of organizing expensive self-criticism in public. Calling the episode either total collapse or complete vindication discards the most useful evidence. The relevant unit of confidence is not psychology as a whole but a particular claim supported by a particular chain of studies."
    - id: p31
      illustration: p31
      blocks:
        - id: p31-b01
          speaker: narrator
          text: "Non-replication changes that chain without cutting it at one stroke. A precise contradiction should reduce confidence more than an underpowered ambiguity. Repeated, preregistered results across relevant settings should count more than one selected success. A theory that predicts its boundary conditions earns more than one that explains every outcome afterward. These are not mechanical scores. They are disciplined comparisons that keep uncertainty visible while allowing decisions. Science advances because claims can be revised, narrowed, connected to context, or abandoned."
    - id: p32
      illustration: p32
      blocks:
        - id: p32-b01
          speaker: narrator
          text: "The one hundred replications from twenty fifteen did not deliver a census of truth. They supplied a common record on which different theories of scientific error could collide. Along with earlier debates and other large replication projects, that argument became part of a broader credibility movement associated with new journal formats, reporting practices, and expectations of transparency; Registered Reports, for example, already had documented publications by twenty fourteen. The causal history is collective, not the achievement of one project. Which effects travel, which depend on context, and which were enlarged by selection remain empirical questions. A mature response begins with a better specified next test."
