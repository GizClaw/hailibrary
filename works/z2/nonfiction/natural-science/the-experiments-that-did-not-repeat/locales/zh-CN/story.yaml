schema_version: 2
language: zh-CN
writer: 砚舟
title: 没有再次出现的结果
summary: >-
  从二〇一五年心理学重复研究计划出发，辨析一次未能重复究竟能说明什么，并追踪围绕方法差异、分析弹性和开放科学改革展开的真实争论。
chapters:
  - {id: ch01, title: 一个数字成了标题, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 怎样才算结果重现, page_refs: [p07, p08, p09, p10, p11, p12, p13]}
  - {id: ch03, title: 灵活选择如何累积, page_refs: [p14, p15, p16, p17, p18, p19]}
  - {id: ch04, title: 在看见结果之前写下计划, page_refs: [p20, p21, p22, p23, p24, p25]}
  - {id: ch05, title: 把证据接成更牢的链条, page_refs: [p26, p27, p28, p29, p30, p31, p32]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "二〇一五年的计划为何不能代表全部心理学研究？", answer: "它只选取三个期刊在二〇〇八年刊登的研究，重复其中一百项关键效应，并未随机覆盖整个学科。", page_refs: [p03, p04]}
  - {id: q02, type: compare, speaker: narrator, prompt: "显著性比例和效应量变化分别提供了什么信息？", answer: "前者说明多少次检验越过预设门槛，后者说明重复研究中的平均效应约缩小到原来一半；二者回答的问题不同。", page_refs: [p05, p06]}
  - {id: q03, type: evaluate, speaker: narrator, prompt: "为什么一次不显著的重复结果不能单独证明原结论错误？", answer: "抽样波动、精度不足、操作差异、情境变化以及效应确实很小或不存在，都可能产生不显著结果。", page_refs: [p07, p08, p09]}
  - {id: q04, type: source-analysis, speaker: narrator, prompt: "吉尔伯特等人与计划团队的争论焦点是什么？", answer: "双方对操作差异和预期波动能解释多少失败，以及样本能支持多大范围的结论，持不同判断。", page_refs: [p10, p11, p12, p13]}
  - {id: q05, type: evidence, speaker: narrator, prompt: "在没有伪造数据的情况下，分析弹性如何扭曲文献？", answer: "研究者若尝试多条合理路径却只报告越过门槛的结果，偶然偏大的发现就会在公开文献中过度集中。", page_refs: [p14, p15, p16]}
  - {id: q06, type: evaluate, speaker: narrator, prompt: "为什么美国统计协会不赞成把 p 值当作裁决？", answer: "p 值不表示假设为真的概率，也不表示效应大小和实际重要性；解释还需要设计、模型与报告过程。", page_refs: [p17, p18]}
  - {id: q07, type: short-answer, speaker: narrator, prompt: "预注册保存了什么？", answer: "它在结果出现前保存带时间记录的假设、指标、排除规则、停止规则和分析计划。", page_refs: [p20, p21]}
  - {id: q08, type: compare, speaker: narrator, prompt: "预注册与注册报告有什么区别？", answer: "预注册先形成带时间记录且不可改写的计划；注册报告还在结果未知时进行同行评议，并可按问题和方法给予原则上接受。", page_refs: [p20, p21, p22]}
  - {id: q09, type: synthesis, speaker: narrator, prompt: "为什么开放材料和数据能改善争论，却不能自动结束争论？", answer: "它们让程序与分析可检查，但研究者仍可能对测量是否有效、情境是否相关、模型假设以及推广范围持不同意见。", page_refs: [p23, p24, p25]}
  - {id: q10, type: source-analysis, speaker: narrator, prompt: "二〇二一年美国统计协会声明对简单的反 p 值口号作了什么修正？", answer: "声明认为正确使用的 p 值仍有作用，但必须同时说明不确定性、变异、多重比较、设计与其他证据。", page_refs: [p18, p29]}
  - {id: q11, type: research-response, speaker: narrator, prompt: "请为一项重要但未重复的结果设计适度的后续方案。", answer: "比较操作一致性与情境，核对代码和测量，估计效应与精度，完整公开分析，再以有区分力且样本充分的重复研究检验竞争解释。", page_refs: [p16, p23, p25, p26, p27, p28, p30, p31]}
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            二〇一五年八月，布赖恩·诺塞克与开放科学合作组织的数百名参与者公布了一项规模罕见的重复研究：分散在各地的团队重做一百项已发表研究，并再次采集数据。最容易被新闻标题截走的是百分之三十六，即达到通常显著性标准的重复结果比例。诺塞克和共同作者却没有把它写成学科判词；他们并列多种指标，保留不确定性，并称其为初步估计。这些观察没有给出一句轻巧的结论，反而把争论推回方法：这一组重复研究，究竟量到了什么？
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            所谓重复，并不是把旧实验原样复印一遍。另一支团队要重新招募参与者、布置材料、执行程序，再用新数据检验原来的主张。样本、时点和社会线索不可能完全复刻，关键在于这些变化是否落在理论允许的范围内。困难也正在这里：结果方向相同、效应量接近、置信区间彼此相容、统计检验再次显著，或者合并证据仍支持原主张，都可以被称为“重复成功”。因此，一个重复率只有连同判据和目标总体一起说明，才具有可解释的含义。
    - id: p03
      illustration: p03
      paragraphs:
        - text: >-
            先看这项计划实际抽取了什么。研究对象来自三个重要期刊二〇〇八年发表的论文，团队从中完成了一百项关键效应的重复；社会心理学和认知心理学所占比重较大。它没有对全部心理学分支进行随机抽样，更谈不上代表所有科学。这个选择为跨团队协作提供了难得的共同试验场，却也划定了结论的边界。把边界从报道中拿掉，百分比仍然精确，所指的总体却已悄悄更换。
    - id: p04
      illustration: p04
      paragraphs:
        - text: >-
            不同地点的重复团队先索取原始材料，与原作者核对程序，再按已发表效应量规划样本。真正动手时，他们仍须逐项决定：什么必须保持一致，哪些本地条件根本无法复制。团队把方案、数据和判断过程放到可检查的记录中，使差异显形，却没有假装差异已经消失。参与者来源、翻译后的指令、实验室环境，乃至某项操作是否真正起效，都可能改变观察结果。标准化让各团队能够核对方法选择，却不会使人的行为脱离具体情境而成为常数。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            结果不能只用一把尺来读。原研究中，百分之九十七的关键结果达到显著；到了重复研究，这个比例是百分之三十六。若改看区间，原效应量有百分之四十七落入重复研究的置信区间。参与重复的各团队还依据程序与研究内容作出主观判断，其中百分之三十九被他们评为重复成功。门槛、区间与团队的主观判断针对不同问题，彼此可以参照，却不能互相替代。
    - id: p06
      illustration: p06
      paragraphs:
        - text: >-
            另一项变化发生在效应量上：重复研究所得的平均效应大约只有原报告的一半。若较大的偶然估计更容易进入期刊，后续研究不再经过同样筛选时，数值往往会回落，这就是常说的“赢家诅咒”。当然，样本构成、实验程序或情境改变也可能造成收缩，所以均值变化不能独自确定原因。它真正补上的信息是，许多结果并非突然从“存在”跳到“不存在”，而是估计幅度向零靠近，同时仍各自带着误差。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            “不显著”首先是一次检验的结果，不是对效应是否存在的直接裁决。效应很弱、样本有限或测量噪声较大，都可能使真实关系没有越过门槛；随机波动也可能让并不存在的关系偶然越线。不过，不能证明为零，也不意味着原主张应当原封不动地保留。若一项严谨重复给出的估计远小于原报告，信心通常需要下调。下调多少，要结合估计精度、研究设计与先前证据来判断。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            精度决定一次失败究竟有多大分量。设想重复研究仍估到同一方向，却因噪声过大而得到很宽的区间，那么数据只够支持“尚不能确定”。另一项样本充分、控制严密的研究若把狭窄区间压在零点附近，就会对原先声称的效应幅度形成更强反证。按是否显著来分类，两者都可能落入失败一栏；用于更新知识时，它们却不应获得相同权重。比起寻找星号，读者更该问哪些效应大小仍与观察相容。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            人类行为会随语言、文化、时间和参与者预期而变化，这并不等于“情境不同”可以解释任何失败。有说服力的情境解释应当指出哪项因素会怎样改变效应，并在看到结果之前或至少独立于该次失败接受检验。否则，肯定结果被算作理论成功，否定结果又被归入尚未命名的边界，理论便失去了被反驳的可能。一次未能重复，既可能暴露过度概括，也可能揭示适用条件；新的研究必须让这两种解释产生不同预测。
    - id: p10
      illustration: p10
      paragraphs:
        - text: >-
            项目发表后不久，丹尼尔·吉尔伯特、加里·金、斯蒂芬·佩蒂格鲁和蒂莫西·威尔逊提出技术批评。他们把注意力放在程序不一致、不同研究之间本来就会出现的波动，以及样本能代表多大范围上。在他们看来，原报告对这些因素估计不足，因此把整体图景描绘得过于悲观。这个异议不是简单拒绝不利数据，而是提出了一套可竞争的解释：观察到的部分落差也许源于实施差异和分析方式，而不全是原效应失灵。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            计划团队随后逐项回应。他们认为，批评所依赖的一些假设并没有获得现有数据支持；即使剔除争议较大的案例，重复效应总体缩小的现象仍然存在。团队也提醒读者，原论文正因为没有唯一的“重复率”，才同时报告多种指标。程序差别当然值得追查，但不能仅凭存在差别就宣布一次重复无效。若要说某个差别导致了某项失败，就必须把这句话当作新的经验假设来检验。
    - id: p12
      illustration: p12
      paragraphs:
        - text: >-
            双方争的并不只是几个案例该留还是该删，而是重复计划应当估计什么。一边强调心理效应可能依赖人群与场景，另一边担心理论若能无限追加条件，就再也经不起严格检验。两种警惕都不可轻易排除。科学没有必要假定人的行为处处相同，却必须说明一项主张预期覆盖哪些范围。真正能够推进争论的做法，是事先提出有关差异的预测，再观察数据究竟更接近哪一种模型。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            公开的方案和数据没有消除冲突，却改变了冲突的质量。批评者能够指出具体案例、重新建模，原团队也能在同一记录上检验反驳；分歧因而落实到筛选、异质性和误差等假设。此时，有价值的问题不再是“谁一举获胜”，而是换用另一套可辩护模型后，哪些结论会改变。各种百分比的解释仍有争议，但重复研究的效应总体较小这一现象，在多种分析下更为稳固。开放首先带来的不是共识，而是可定位的分歧。
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            若回到一份尚未分析的数据，研究者面前往往不止一条道路。样本收集到何时停止、哪些观测应排除、哪个结果指标优先、是否加入协变量、测量值怎样转换，都可能有合理选项。这种“分析弹性”本身不等于欺骗；问题出在结果参与了选路，而论文只展示最后入选的一条。读者以为自己看到的是预先设定的一次检验，实际却是多次搜索后的幸存结果。于是，原有文献可能在没有伪造数据的情况下，逐渐积累偏大的效应。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            二〇一一年，西蒙斯、纳尔逊和西蒙松用模拟与实验说明了这种风险。在没有真实效应的模型里，只要灵活调整停止时点、排除对象、结果指标或协变量，取得传统显著结果的概率就会明显上升。重点不在于给所有研究者扣上造假的帽子，而在于检验结果必须连同产生它的过程来解释。p 值针对的是特定分析程序；若文章隐去了此前尝试过的路线，表面上的一次计算就无法代表实际发生的搜索。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            后来流行的“p 值操纵”把结果导向的搜索压缩成一个名称，也容易混淆不同意图。有人可能主动追逐可发表的结果，有人只是继承实验室惯例，还有人原本在探索，却把偶然发现写成了预先确认。这些行为的伦理性质不同，留下的证据缺口却相似：读者不知道一共尝试了多少路径，因而会高估最终结果的意外程度。探索对科学不可或缺；需要纠正的是把探索冒充确认，并省略随后独立检验的必要性。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            p 值常被误解为“假设出错的概率”，但美国统计协会明确否定了这种读法。在给定统计模型的条件下，它刻画观察数据与模型的不相容程度；它既不直接分配假设为真的概率，也不告诉人们效应有多大、现实意义有多强。一个数值越过门槛，并不会使噪声很大的估计立刻成为稳固事实。研究设计是否可靠、模型假设是否合适、分析是否完整公开、测量是否有效，以及误判会造成什么后果，都要进入推断。
    - id: p18
      illustration: p18
      paragraphs:
        - text: >-
            二〇二一年，美国统计协会工作组没有提出废除 p 值，反而重申：只要使用和解释得当，显著性检验仍然有用。声明要求分析者同时交代不确定性与变异，处理多重比较，并把研究设计和其他证据纳入判断。这个立场避开了另一种简单口号——仿佛删除一种统计量便能修复研究文化。区间、似然、贝叶斯模型、预测和决策分析能够补充不同信息，却也各有前提；任何工具都无法替代透明报告、可靠测量和清楚理论。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            单项研究之外，发表制度还会继续筛选结果。清楚、肯定、新奇的故事长期更容易进入期刊，职业奖励也随之倾斜；复杂或不显著的发现则可能留在抽屉里。即便每篇公开论文都遵守自己声明的分析规则，读者看到的文献仍会高估成功。小样本尤其容易受影响，因为往往只有偶然偏大的估计才能越过门槛。后来一次没有经历同样筛选的重复研究看起来“缩水”，既是抽样现象，也是奖励结构造成的可见性偏差。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            一种改革先改变决策顺序。进行预注册时，研究者在收集或分析数据之前，把带时间记录、不可改写的计划存入资料库；记录可以立即公开，也可以暂时处于保密期。有效计划会具体说明假设、结果指标、排除规则、停止规则与分析方法，使后来的偏离能够被辨认。它不会禁止发现，也不会迫使研究者坚持已知错误，更不证明设计优秀。它保存的是时间顺序：哪些检验先于结果提出，哪些问题是在看过数据后才出现。
    - id: p21
      illustration: p21
      paragraphs:
        - text: >-
            一枚时间戳本身不能保证研究质量。计划写得含糊，分析者仍可保留大量选择；记录无法访问，读者便无从核对；发生偏离却不报告，旧有的模糊也会回来。与此同时，修改计划并不自动构成违规：设备可能故障，模型前提可能不成立，数据也可能暴露预料之外的结构。关键是说明改了什么、为什么改，并把预设检验与后来探索区分开。预注册保存的不是绝对服从，而是一条可以审查的决策来路。
    - id: p22
      illustration: p22
      paragraphs:
        - text: >-
            采用注册报告的期刊编辑，把关键评议提前到结果出现以前。他们选择先审问题是否重要、方法能否回答问题，再对合格方案作出“原则上接受”的决定；此后不能只因结果不显著便撤销接收。发表不再主要取决于答案是否戏剧化，严密设计因而获得更多权重。这种格式主要面向验证性的假设检验，同时仍允许研究者另行报告意外发现。它在二〇一四年已有成组发表记录，并非二〇一五年之后才突然出现。
    - id: p23
      illustration: p23
      paragraphs:
        - text: >-
            材料、数据与代码开放后，外部研究者可以重建程序、复算结果，并检查结论是否依赖某个可替换的分析决定。这种问责必须受到隐私、知情同意、安全和所有权的约束，不能把“开放”理解为无条件公开。即使文件齐全，另一个问题仍然存在：测量是否真的对应目标概念，不同人群是否以相同方式理解任务。透明度让研究过程更容易检查，却不会自动证明研究问题与测量工具彼此对准。
    - id: p24
      illustration: p24
      paragraphs:
        - text: >-
            样本更大只能提高对现有测量的精度，不能修复测量对象错位。问卷在不同群体中若承载不同含义，再窄的置信区间也无法挽救原本想作的推断；实验操作若没有改变理论指定的心理状态，零结果检验的可能只是实施是否奏效。反过来，同一套有偏工具多次得到肯定结果，也不过是稳定地复制偏差。因而，可重复性、效度和可推广性必须分别讨论：一种方法可能重复得很好，却持续回答了错误的问题。
    - id: p25
      illustration: p25
      paragraphs:
        - text: >-
            两类重复承担不同任务。直接重复尽量保持原有方法，适合询问已发表程序能否再次产生结果；概念重复则改变具体操作，考察同一理论关系能否跨越不同实现。一次直接成功或许只确认狭窄规律，并不自动给出解释；一次概念失败也可能来自新操作太弱，而非理论本身错误。两者没有固定高下。设计后续研究时，应先说明这次尝试准备修正哪项主张，再选择相应的重复方式，而不是事后按结果挑选名称。
    - id: p26
      illustration: p26
      paragraphs:
        - text: >-
            当多个实验室依照共同方案在不同地点收集数据，局部偶然和跨地点模式便有机会被分开。更大的总样本提高精度，预先测量情境因素还能帮助识别异质性。不过，共同方案也可能复制共同盲点：所有地点若都使用狭窄人群或同一缺陷工具，一致结果仍不足以支持普遍主张。地理范围本身不是保证。真正重要的是把预期相关的变化写进设计、记录与分析，而不是等结果分散后再把差异笼统归为噪声。
    - id: p27
      illustration: p27
      paragraphs:
        - text: >-
            把多项研究放在一起时，元分析会在明确模型下综合估计，通常让更精确的研究获得更大权重。综合结果可能指向一个很小的平均效应，也可能显示研究间差异显著，甚至不确定到无法稳健概括。然而，合并并不会清洗输入材料：发表偏差、不相容的测量和薄弱设计都可能被一并继承。十项方向相同的偏差仍是偏差。可信的综合需要审查研究质量和筛选过程，并检验结论对不同合理假设有多敏感。
    - id: p28
      illustration: p28
      paragraphs:
        - text: >-
            面对一项重要却未能重复的结果，调查规模应与主张的重要性和现有证据的含混程度相称。先比较程序与情境，核对代码和测量，检查实验操作是否奏效，再评估估计精度；随后设计能让竞争解释给出不同预测的新研究。持相反预期的团队还可以进行对抗式合作：在看到结果前共同商定一项有区分力的检验，并写清什么结果会削弱各自的判断。共同选定实验方案和判据不会迫使理论一致，却能压缩事后移动标准的空间。
    - id: p29
      illustration: p29
      paragraphs:
        - text: >-
            改革还会重新分配成本与参与机会。开放数据便于复核，却必须受隐私与知情同意约束，并非越多越好。大型协作可以汇集专长；然而，当共同劳动主要依赖志愿投入时，没有经费或受保护工时的研究者更容易被排除。个人即使采用严谨做法，若机构仍主要奖励新奇结果，改变也难以持续。注册报告在二〇一四年已有成组发表记录，说明改革来自更广的可信度运动，而非某一次重复计划。成效应从资源、激励和实际行为中判断。
    - id: p30
      illustration: p30
      paragraphs:
        - text: >-
            “重复危机”这个名称并不指向一种单独缺陷。现有证据揭示的薄弱处各不相同：奖励机制、小样本、选择性报告、分析弹性、测量缺陷和理论边界含混会以不同组合出现。与此同时，心理学界也投入大量人力、时间和经费，公开开展了一场高成本的自我检验。全面崩塌和彻底洗白都是过度概括。需要更新信心的对象，应当是由具体证据链支持的具体主张，而不是整个学科的抽象声誉。
    - id: p31
      illustration: p31
      paragraphs:
        - text: >-
            非重复结果进入证据链后，改变的是各环节的权重，而不是把整条链瞬间剪断。一个精度很高的反例，比样本不足、区间宽阔的结果更应降低信心；在相关情境中多次出现且经过预注册的结果，也比一次被筛选出来的成功更可靠。理论若能预先说清适用边界，就比事后容纳一切结局更有内容。这套比较没有自动算分公式，但它要求不确定性始终可见，并允许主张被缩小、修正、限定乃至放弃。
    - id: p32
      illustration: p32
      paragraphs:
        - text: >-
            那一百次重复没有成为心理学的“真理普查”，却留下了一份各方可以共同检查的记录。它与更早的统计争论、注册报告实践以及其他大型重复项目一道，汇入了范围更广的可信度改革运动；新的期刊格式、报告做法和透明度要求，不能归功于二〇一五年这一个项目。改革已经发生，因果历史却属于许多行动者。至于哪些效应能够跨越环境、哪些依赖情境、哪些曾被筛选放大，仍需实验回答。成熟的下一步，是把边界和判据写得更清楚，再做一次真正有区分力的检验。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 冷静审慎，论证转折处略作强调, timbre: 清晰厚实的成年声线, pace: 稳定的中慢速, pitch: 中低音区}
    brian_nosek:
      display_name: 布赖恩·诺塞克
      tts: {delivery: 审慎、协作、重视每项指标的边界, timbre: 清晰平实的成年声线, pace: 稳定中速, pitch: 中音区}
    replication_teams:
      display_name: 重复研究团队
      tts: {delivery: 务实、专注操作与证据, timbre: 层次分明的群体声线, pace: 稳定中速, pitch: 混合中音区}
    journal_editors:
      display_name: 期刊编辑
      tts: {delivery: 严谨、程序清楚、关注制度后果, timbre: 沉着清楚的成年群体声线, pace: 从容中速, pitch: 中低音区}
  pages:
    - id: p01
      illustration: p01
      blocks:
        - id: p01-b01
          speaker: narrator
          text: "二〇一五年八月，布赖恩·诺塞克与开放科学合作组织的数百名参与者公布了一项规模罕见的重复研究：分散在各地的团队重做一百项已发表研究，并再次采集数据。最容易被新闻标题截走的是百分之三十六，即达到通常显著性标准的重复结果比例。诺塞克和共同作者却没有把它写成学科判词；他们并列多种指标，保留不确定性，并称其为初步估计。这些观察没有给出一句轻巧的结论，反而把争论推回方法：这一组重复研究，究竟量到了什么？"
    - id: p02
      illustration: p02
      blocks:
        - id: p02-b01
          speaker: narrator
          text: "所谓重复，并不是把旧实验原样复印一遍。另一支团队要重新招募参与者、布置材料、执行程序，再用新数据检验原来的主张。样本、时点和社会线索不可能完全复刻，关键在于这些变化是否落在理论允许的范围内。困难也正在这里：结果方向相同、效应量接近、置信区间彼此相容、统计检验再次显著，或者合并证据仍支持原主张，都可以被称为“重复成功”。因此，一个重复率只有连同判据和目标总体一起说明，才具有可解释的含义。"
    - id: p03
      illustration: p03
      blocks:
        - id: p03-b01
          speaker: narrator
          text: "先看这项计划实际抽取了什么。研究对象来自三个重要期刊二〇〇八年发表的论文，团队从中完成了一百项关键效应的重复；社会心理学和认知心理学所占比重较大。它没有对全部心理学分支进行随机抽样，更谈不上代表所有科学。这个选择为跨团队协作提供了难得的共同试验场，却也划定了结论的边界。把边界从报道中拿掉，百分比仍然精确，所指的总体却已悄悄更换。"
    - id: p04
      illustration: p04
      blocks:
        - id: p04-b01
          speaker: narrator
          text: "不同地点的重复团队先索取原始材料，与原作者核对程序，再按已发表效应量规划样本。真正动手时，他们仍须逐项决定：什么必须保持一致，哪些本地条件根本无法复制。团队把方案、数据和判断过程放到可检查的记录中，使差异显形，却没有假装差异已经消失。参与者来源、翻译后的指令、实验室环境，乃至某项操作是否真正起效，都可能改变观察结果。标准化让各团队能够核对方法选择，却不会使人的行为脱离具体情境而成为常数。"
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          text: "结果不能只用一把尺来读。原研究中，百分之九十七的关键结果达到显著；到了重复研究，这个比例是百分之三十六。若改看区间，原效应量有百分之四十七落入重复研究的置信区间。参与重复的各团队还依据程序与研究内容作出主观判断，其中百分之三十九被他们评为重复成功。门槛、区间与团队的主观判断针对不同问题，彼此可以参照，却不能互相替代。"
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: "另一项变化发生在效应量上：重复研究所得的平均效应大约只有原报告的一半。若较大的偶然估计更容易进入期刊，后续研究不再经过同样筛选时，数值往往会回落，这就是常说的“赢家诅咒”。当然，样本构成、实验程序或情境改变也可能造成收缩，所以均值变化不能独自确定原因。它真正补上的信息是，许多结果并非突然从“存在”跳到“不存在”，而是估计幅度向零靠近，同时仍各自带着误差。"
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          text: "“不显著”首先是一次检验的结果，不是对效应是否存在的直接裁决。效应很弱、样本有限或测量噪声较大，都可能使真实关系没有越过门槛；随机波动也可能让并不存在的关系偶然越线。不过，不能证明为零，也不意味着原主张应当原封不动地保留。若一项严谨重复给出的估计远小于原报告，信心通常需要下调。下调多少，要结合估计精度、研究设计与先前证据来判断。"
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: "精度决定一次失败究竟有多大分量。设想重复研究仍估到同一方向，却因噪声过大而得到很宽的区间，那么数据只够支持“尚不能确定”。另一项样本充分、控制严密的研究若把狭窄区间压在零点附近，就会对原先声称的效应幅度形成更强反证。按是否显著来分类，两者都可能落入失败一栏；用于更新知识时，它们却不应获得相同权重。比起寻找星号，读者更该问哪些效应大小仍与观察相容。"
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: "人类行为会随语言、文化、时间和参与者预期而变化，这并不等于“情境不同”可以解释任何失败。有说服力的情境解释应当指出哪项因素会怎样改变效应，并在看到结果之前或至少独立于该次失败接受检验。否则，肯定结果被算作理论成功，否定结果又被归入尚未命名的边界，理论便失去了被反驳的可能。一次未能重复，既可能暴露过度概括，也可能揭示适用条件；新的研究必须让这两种解释产生不同预测。"
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          text: "项目发表后不久，丹尼尔·吉尔伯特、加里·金、斯蒂芬·佩蒂格鲁和蒂莫西·威尔逊提出技术批评。他们把注意力放在程序不一致、不同研究之间本来就会出现的波动，以及样本能代表多大范围上。在他们看来，原报告对这些因素估计不足，因此把整体图景描绘得过于悲观。这个异议不是简单拒绝不利数据，而是提出了一套可竞争的解释：观察到的部分落差也许源于实施差异和分析方式，而不全是原效应失灵。"
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: "计划团队随后逐项回应。他们认为，批评所依赖的一些假设并没有获得现有数据支持；即使剔除争议较大的案例，重复效应总体缩小的现象仍然存在。团队也提醒读者，原论文正因为没有唯一的“重复率”，才同时报告多种指标。程序差别当然值得追查，但不能仅凭存在差别就宣布一次重复无效。若要说某个差别导致了某项失败，就必须把这句话当作新的经验假设来检验。"
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: "双方争的并不只是几个案例该留还是该删，而是重复计划应当估计什么。一边强调心理效应可能依赖人群与场景，另一边担心理论若能无限追加条件，就再也经不起严格检验。两种警惕都不可轻易排除。科学没有必要假定人的行为处处相同，却必须说明一项主张预期覆盖哪些范围。真正能够推进争论的做法，是事先提出有关差异的预测，再观察数据究竟更接近哪一种模型。"
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: "公开的方案和数据没有消除冲突，却改变了冲突的质量。批评者能够指出具体案例、重新建模，原团队也能在同一记录上检验反驳；分歧因而落实到筛选、异质性和误差等假设。此时，有价值的问题不再是“谁一举获胜”，而是换用另一套可辩护模型后，哪些结论会改变。各种百分比的解释仍有争议，但重复研究的效应总体较小这一现象，在多种分析下更为稳固。开放首先带来的不是共识，而是可定位的分歧。"
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: "若回到一份尚未分析的数据，研究者面前往往不止一条道路。样本收集到何时停止、哪些观测应排除、哪个结果指标优先、是否加入协变量、测量值怎样转换，都可能有合理选项。这种“分析弹性”本身不等于欺骗；问题出在结果参与了选路，而论文只展示最后入选的一条。读者以为自己看到的是预先设定的一次检验，实际却是多次搜索后的幸存结果。于是，原有文献可能在没有伪造数据的情况下，逐渐积累偏大的效应。"
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: "二〇一一年，西蒙斯、纳尔逊和西蒙松用模拟与实验说明了这种风险。在没有真实效应的模型里，只要灵活调整停止时点、排除对象、结果指标或协变量，取得传统显著结果的概率就会明显上升。重点不在于给所有研究者扣上造假的帽子，而在于检验结果必须连同产生它的过程来解释。p 值针对的是特定分析程序；若文章隐去了此前尝试过的路线，表面上的一次计算就无法代表实际发生的搜索。"
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: "后来流行的“p 值操纵”把结果导向的搜索压缩成一个名称，也容易混淆不同意图。有人可能主动追逐可发表的结果，有人只是继承实验室惯例，还有人原本在探索，却把偶然发现写成了预先确认。这些行为的伦理性质不同，留下的证据缺口却相似：读者不知道一共尝试了多少路径，因而会高估最终结果的意外程度。探索对科学不可或缺；需要纠正的是把探索冒充确认，并省略随后独立检验的必要性。"
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: "p 值常被误解为“假设出错的概率”，但美国统计协会明确否定了这种读法。在给定统计模型的条件下，它刻画观察数据与模型的不相容程度；它既不直接分配假设为真的概率，也不告诉人们效应有多大、现实意义有多强。一个数值越过门槛，并不会使噪声很大的估计立刻成为稳固事实。研究设计是否可靠、模型假设是否合适、分析是否完整公开、测量是否有效，以及误判会造成什么后果，都要进入推断。"
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: "二〇二一年，美国统计协会工作组没有提出废除 p 值，反而重申：只要使用和解释得当，显著性检验仍然有用。声明要求分析者同时交代不确定性与变异，处理多重比较，并把研究设计和其他证据纳入判断。这个立场避开了另一种简单口号——仿佛删除一种统计量便能修复研究文化。区间、似然、贝叶斯模型、预测和决策分析能够补充不同信息，却也各有前提；任何工具都无法替代透明报告、可靠测量和清楚理论。"
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: "单项研究之外，发表制度还会继续筛选结果。清楚、肯定、新奇的故事长期更容易进入期刊，职业奖励也随之倾斜；复杂或不显著的发现则可能留在抽屉里。即便每篇公开论文都遵守自己声明的分析规则，读者看到的文献仍会高估成功。小样本尤其容易受影响，因为往往只有偶然偏大的估计才能越过门槛。后来一次没有经历同样筛选的重复研究看起来“缩水”，既是抽样现象，也是奖励结构造成的可见性偏差。"
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: "一种改革先改变决策顺序。进行预注册时，研究者在收集或分析数据之前，把带时间记录、不可改写的计划存入资料库；记录可以立即公开，也可以暂时处于保密期。有效计划会具体说明假设、结果指标、排除规则、停止规则与分析方法，使后来的偏离能够被辨认。它不会禁止发现，也不会迫使研究者坚持已知错误，更不证明设计优秀。它保存的是时间顺序：哪些检验先于结果提出，哪些问题是在看过数据后才出现。"
    - id: p21
      illustration: p21
      blocks:
        - id: p21-b01
          speaker: narrator
          text: "一枚时间戳本身不能保证研究质量。计划写得含糊，分析者仍可保留大量选择；记录无法访问，读者便无从核对；发生偏离却不报告，旧有的模糊也会回来。与此同时，修改计划并不自动构成违规：设备可能故障，模型前提可能不成立，数据也可能暴露预料之外的结构。关键是说明改了什么、为什么改，并把预设检验与后来探索区分开。预注册保存的不是绝对服从，而是一条可以审查的决策来路。"
    - id: p22
      illustration: p22
      blocks:
        - id: p22-b01
          speaker: narrator
          text: "采用注册报告的期刊编辑，把关键评议提前到结果出现以前。他们选择先审问题是否重要、方法能否回答问题，再对合格方案作出“原则上接受”的决定；此后不能只因结果不显著便撤销接收。发表不再主要取决于答案是否戏剧化，严密设计因而获得更多权重。这种格式主要面向验证性的假设检验，同时仍允许研究者另行报告意外发现。它在二〇一四年已有成组发表记录，并非二〇一五年之后才突然出现。"
    - id: p23
      illustration: p23
      blocks:
        - id: p23-b01
          speaker: narrator
          text: "材料、数据与代码开放后，外部研究者可以重建程序、复算结果，并检查结论是否依赖某个可替换的分析决定。这种问责必须受到隐私、知情同意、安全和所有权的约束，不能把“开放”理解为无条件公开。即使文件齐全，另一个问题仍然存在：测量是否真的对应目标概念，不同人群是否以相同方式理解任务。透明度让研究过程更容易检查，却不会自动证明研究问题与测量工具彼此对准。"
    - id: p24
      illustration: p24
      blocks:
        - id: p24-b01
          speaker: narrator
          text: "样本更大只能提高对现有测量的精度，不能修复测量对象错位。问卷在不同群体中若承载不同含义，再窄的置信区间也无法挽救原本想作的推断；实验操作若没有改变理论指定的心理状态，零结果检验的可能只是实施是否奏效。反过来，同一套有偏工具多次得到肯定结果，也不过是稳定地复制偏差。因而，可重复性、效度和可推广性必须分别讨论：一种方法可能重复得很好，却持续回答了错误的问题。"
    - id: p25
      illustration: p25
      blocks:
        - id: p25-b01
          speaker: narrator
          text: "两类重复承担不同任务。直接重复尽量保持原有方法，适合询问已发表程序能否再次产生结果；概念重复则改变具体操作，考察同一理论关系能否跨越不同实现。一次直接成功或许只确认狭窄规律，并不自动给出解释；一次概念失败也可能来自新操作太弱，而非理论本身错误。两者没有固定高下。设计后续研究时，应先说明这次尝试准备修正哪项主张，再选择相应的重复方式，而不是事后按结果挑选名称。"
    - id: p26
      illustration: p26
      blocks:
        - id: p26-b01
          speaker: narrator
          text: "当多个实验室依照共同方案在不同地点收集数据，局部偶然和跨地点模式便有机会被分开。更大的总样本提高精度，预先测量情境因素还能帮助识别异质性。不过，共同方案也可能复制共同盲点：所有地点若都使用狭窄人群或同一缺陷工具，一致结果仍不足以支持普遍主张。地理范围本身不是保证。真正重要的是把预期相关的变化写进设计、记录与分析，而不是等结果分散后再把差异笼统归为噪声。"
    - id: p27
      illustration: p27
      blocks:
        - id: p27-b01
          speaker: narrator
          text: "把多项研究放在一起时，元分析会在明确模型下综合估计，通常让更精确的研究获得更大权重。综合结果可能指向一个很小的平均效应，也可能显示研究间差异显著，甚至不确定到无法稳健概括。然而，合并并不会清洗输入材料：发表偏差、不相容的测量和薄弱设计都可能被一并继承。十项方向相同的偏差仍是偏差。可信的综合需要审查研究质量和筛选过程，并检验结论对不同合理假设有多敏感。"
    - id: p28
      illustration: p28
      blocks:
        - id: p28-b01
          speaker: narrator
          text: "面对一项重要却未能重复的结果，调查规模应与主张的重要性和现有证据的含混程度相称。先比较程序与情境，核对代码和测量，检查实验操作是否奏效，再评估估计精度；随后设计能让竞争解释给出不同预测的新研究。持相反预期的团队还可以进行对抗式合作：在看到结果前共同商定一项有区分力的检验，并写清什么结果会削弱各自的判断。共同选定实验方案和判据不会迫使理论一致，却能压缩事后移动标准的空间。"
    - id: p29
      illustration: p29
      blocks:
        - id: p29-b01
          speaker: narrator
          text: "改革还会重新分配成本与参与机会。开放数据便于复核，却必须受隐私与知情同意约束，并非越多越好。大型协作可以汇集专长；然而，当共同劳动主要依赖志愿投入时，没有经费或受保护工时的研究者更容易被排除。个人即使采用严谨做法，若机构仍主要奖励新奇结果，改变也难以持续。注册报告在二〇一四年已有成组发表记录，说明改革来自更广的可信度运动，而非某一次重复计划。成效应从资源、激励和实际行为中判断。"
    - id: p30
      illustration: p30
      blocks:
        - id: p30-b01
          speaker: narrator
          text: "“重复危机”这个名称并不指向一种单独缺陷。现有证据揭示的薄弱处各不相同：奖励机制、小样本、选择性报告、分析弹性、测量缺陷和理论边界含混会以不同组合出现。与此同时，心理学界也投入大量人力、时间和经费，公开开展了一场高成本的自我检验。全面崩塌和彻底洗白都是过度概括。需要更新信心的对象，应当是由具体证据链支持的具体主张，而不是整个学科的抽象声誉。"
    - id: p31
      illustration: p31
      blocks:
        - id: p31-b01
          speaker: narrator
          text: "非重复结果进入证据链后，改变的是各环节的权重，而不是把整条链瞬间剪断。一个精度很高的反例，比样本不足、区间宽阔的结果更应降低信心；在相关情境中多次出现且经过预注册的结果，也比一次被筛选出来的成功更可靠。理论若能预先说清适用边界，就比事后容纳一切结局更有内容。这套比较没有自动算分公式，但它要求不确定性始终可见，并允许主张被缩小、修正、限定乃至放弃。"
    - id: p32
      illustration: p32
      blocks:
        - id: p32-b01
          speaker: narrator
          text: "那一百次重复没有成为心理学的“真理普查”，却留下了一份各方可以共同检查的记录。它与更早的统计争论、注册报告实践以及其他大型重复项目一道，汇入了范围更广的可信度改革运动；新的期刊格式、报告做法和透明度要求，不能归功于二〇一五年这一个项目。改革已经发生，因果历史却属于许多行动者。至于哪些效应能够跨越环境、哪些依赖情境、哪些曾被筛选放大，仍需实验回答。成熟的下一步，是把边界和判据写得更清楚，再做一次真正有区分力的检验。"
