style: cut-paper-collage
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
assets:
  - {id: cover, file: artwork/cover.webp, scene: A layered paper laboratory table with two parallel experimental paths, one vivid and one faint, joined by open hands arranging evidence tokens; no text or symbols.}
  - {id: p01, file: artwork/p01.webp, scene: Many small paper researchers surround one bright result token while a shadowy crowd of headlines remains abstract and wordless.}
  - {id: p02, file: artwork/p02.webp, scene: Two separate laboratory tables repeat the same arrangement with different paper participants and slightly different surroundings.}
  - {id: p03, file: artwork/p03.webp, scene: Three paper journal-like stacks feed selected experiment tokens into a bounded tray, clearly a sample rather than an entire field.}
  - {id: p04, file: artwork/p04.webp, scene: Coordinating hands pass matching plain materials among several laboratories while small contextual details differ.}
  - {id: p05, file: artwork/p05.webp, scene: Three distinct wordless measuring devices compare the same set of colored result tokens by threshold, interval, and expert sorting.}
  - {id: p06, file: artwork/p06.webp, scene: Large original effect shapes cast smaller replication shadows moving toward a neutral center line without numbers or labels.}
  - {id: p07, file: artwork/p07.webp, scene: A tiny real signal and a random paper ripple approach a plain threshold gate from opposite directions.}
  - {id: p08, file: artwork/p08.webp, scene: One broad translucent paper interval and one narrow interval surround a small central effect token.}
  - {id: p09, file: artwork/p09.webp, scene: Matching experiment tables sit in two cultural settings with deliberately visible but subtle contextual differences.}
  - {id: p10, file: artwork/p10.webp, scene: Four scholar silhouettes inspect mismatched paper protocol pieces beside the shared replication archive.}
  - {id: p11, file: artwork/p11.webp, scene: Another research group tests disputed pieces against a broad field of smaller effect tokens.}
  - {id: p12, file: artwork/p12.webp, scene: Two branching models show a context-sensitive effect and a severe universal test without written labels.}
  - {id: p13, file: artwork/p13.webp, scene: Opposing research groups rebuild different models from the same open tray of data shapes.}
  - {id: p14, file: artwork/p14.webp, scene: A dataset at a crossroads branches into many plausible analysis paths toward different outcomes.}
  - {id: p15, file: artwork/p15.webp, scene: Hands repeatedly adjust sample, exclusion, outcome, and covariate tokens until one path reaches a bright threshold.}
  - {id: p16, file: artwork/p16.webp, scene: A transparent maze reveals many explored paths while only one polished path exits toward publication.}
  - {id: p17, file: artwork/p17.webp, scene: A small p-value token sits among larger design, effect, uncertainty, and consequence shapes without any characters or symbols.}
  - {id: p18, file: artwork/p18.webp, scene: A balanced toolkit contains intervals, probability models, predictions, and decisions alongside rather than replacing one test tool.}
  - {id: p19, file: artwork/p19.webp, scene: A narrow publication gate admits bright positive result tokens while muted null results remain in a drawer.}
  - {id: p20, file: artwork/p20.webp, scene: Researchers seal a detailed but wordless plan in a transparent archive before opening a covered data box.}
  - {id: p21, file: artwork/p21.webp, scene: A precise plan template and a vague plan template lead to differently auditable analysis paths, entirely wordless.}
  - {id: p22, file: artwork/p22.webp, scene: Peer reviewers examine an experimental apparatus before a covered result tray is revealed.}
  - {id: p23, file: artwork/p23.webp, scene: Open materials, data tokens, and mechanical code-like blocks are visible behind a privacy shield, with no actual text.}
  - {id: p24, file: artwork/p24.webp, scene: A finely measured but misaligned instrument contrasts with a rough instrument correctly aimed at the intended construct.}
  - {id: p25, file: artwork/p25.webp, scene: One direct replication repeats a paper apparatus while a conceptual replication uses a different apparatus to test the same relation.}
  - {id: p26, file: artwork/p26.webp, scene: Multiple laboratories across varied landscapes run a shared protocol while preserving visible local variation.}
  - {id: p27, file: artwork/p27.webp, scene: Many study estimates flow into a careful synthesis balance that still contains visible heterogeneity and gaps.}
  - {id: p28, file: artwork/p28.webp, scene: Two opposing teams jointly assemble one agreed test apparatus before revealing the result.}
  - {id: p29, file: artwork/p29.webp, scene: Open-science tools cast both helpful and cautionary shadows involving privacy, paperwork, resources, and review capacity.}
  - {id: p30, file: artwork/p30.webp, scene: A scientific system under a stress test reveals several weak joints while researchers repair them in public.}
  - {id: p31, file: artwork/p31.webp, scene: A chain of evidence is reweighted and narrowed rather than cut, with uncertainty shown as translucent paper layers.}
  - {id: p32, file: artwork/p32.webp, scene: Researchers leave an open archive and carry a newly specified experiment toward the next laboratory.}
