locales: [en-US, zh-CN]
labels: {topics: [science], themes: [curiosity, responsibility, problem-solving], moods: [reflective, hopeful]}
characters:
  - id: narrator
    kind: narrator
    description: A source-aware guide through a contested episode in research methods.
    voice_identity: measured, exact, and comfortable leaving uncertainty open
  - id: brian_nosek
    kind: historical-person
    description: "Brian Nosek, a social psychologist and coordinator of the Open Science Collaboration's Reproducibility Project: Psychology."
    voice_identity: deliberate, collaborative, and attentive to the limits of each measure
  - id: replication_teams
    kind: historical-group
    description: The distributed research teams that rebuilt protocols, collected new data, and recorded judgments for the 2015 replication project.
    voice_identity: practical, method-focused, and varied across laboratories
  - id: journal_editors
    kind: historical-group
    description: Journal editors who adopted Registered Reports and moved part of publication review before results were known.
    voice_identity: exacting, procedural, and alert to incentives
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Interpret the Open Science Collaboration's twenty fifteen results without treating one metric as a universal verdict.
    - Explain how analytical flexibility, publication incentives, power, and sampling variation can affect replication outcomes.
    - Distinguish preregistration, Registered Reports, transparency, direct replication, and meta-analysis as related but nonidentical reforms.
    - Evaluate competing explanations for non-replication and design a proportionate follow-up.
  concepts: [replication, effect size, p-value, analytical flexibility, preregistration, Registered Reports, publication bias, meta-analysis]
