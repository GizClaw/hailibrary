schema_version: 1
required: true
sources:
  - url: https://pubmed.ncbi.nlm.nih.gov/26315443/
    publisher: U.S. National Library of Medicine, indexing Open Science Collaboration in Science
    claims: [Brian Nosek coordinated the Open Science Collaboration project with distributed replication teams; the project attempted replications of one hundred experimental and correlational studies from three psychology journals, ninety-seven percent of original studies had significant results, thirty-six percent of replications did, forty-seven percent of original effect sizes fell within replication confidence intervals, thirty-nine percent were subjectively judged replicated, and mean replication effects were about half the originals.]
  - url: https://projects.iq.harvard.edu/files/psychology-replications/files/gilbert_king_pettigrew_wilson_2016_with_appendix.pdf
    publisher: Science technical comment by Gilbert, King, Pettigrew, and Wilson
    claims: [Critics argued that differences between original and replication procedures, sampling choices, and the treatment of expected variation made the project's broad interpretation too pessimistic.]
  - url: https://www.science.org/doi/10.1126/science.aad9163
    publisher: Science response by Anderson and colleagues for the Open Science Collaboration
    claims: [The project authors replied that the critique's assumptions and reanalyses did not overturn the evidence of lower replication effects and that no single indicator was offered as a definitive reproducibility rate.]
  - url: https://doi.org/10.1177/0956797611417632
    publisher: Psychological Science
    claims: [Undisclosed flexibility in stopping data collection, excluding observations, selecting outcomes, or adding covariates can raise false-positive rates; exploratory work remains legitimate when disclosed and separated from confirmation.]
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6970975/
    publisher: National Library of Medicine archive of Perspectives on Psychological Science
    claims: [When studies or estimates are selected for statistical significance, sampling error is preferentially positive and published effect sizes are consequently overestimated; estimates from subsequent replications that are not subject to the same selection tend to shrink, a selection effect commonly described as the winner's curse.]
  - url: https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf
    publisher: American Statistical Association
    claims: [A p-value does not state the probability that a hypothesis is true, does not measure effect size or importance, and should not alone determine scientific conclusions; valid inference requires transparency and context.]
  - url: https://help.osf.io/article/330-welcome-to-registrations
    publisher: Center for Open Science, OSF Support
    claims: [Preregistration places a time-stamped read-only study plan in a repository before data collection or analysis, making planned confirmation distinguishable from later exploration.]
  - url: https://www.cos.io/initiatives/registered-reports
    publisher: Center for Open Science
    claims: [Journal editors adopting Registered Reports moved review of research questions and methods before results were known and could grant in-principle acceptance that is not revoked merely because results are null; the format is designed around the confirmatory hypothetico-deductive model while still permitting serendipitous findings to be reported; published introductions and a fifteen-report special issue document that the format was already in use by twenty fourteen.]
  - url: https://www.nature.com/articles/s44271-023-00003-2
    publisher: Communications Psychology perspective on the broader credibility movement
    claims: [Large replication projects were one impetus within a broader credibility movement that produced structural, procedural, and community changes; reforms interact across individual and institutional levels; resource disparities and volunteer-dependent big-team science can exclude researchers without funded time; adversarial collaboration asks researchers with opposing positions to agree in advance on a method capable of distinguishing their predictions.]
  - url: https://www.ncbi.nlm.nih.gov/books/NBK547535/
    publisher: National Academies of Sciences, Engineering, and Medicine, hosted by NCBI Bookshelf
    claims: [Reliability and validity are distinct properties of measurement; increasing observations can improve precision without correcting a measure that does not validly represent the intended construct.]
  - url: https://www.psychologicalscience.org/observer/measurement-matters
    publisher: Association for Psychological Science Observer
    claims: [Large samples reduce sampling error but do not by themselves repair systematic measurement error or establish that an operational measure captures the intended construct.]
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6701696/
    publisher: National Library of Medicine archive of Advances in Methods and Practices in Psychological Science
    claims: [Transparency measures include reporting measures and exclusions, sharing materials and data where ethical, preregistration, and distinguishing exploratory from confirmatory analysis.]
  - url: https://magazine.amstat.org/blog/2021/08/01/task-force-statement-p-value/
    publisher: American Statistical Association President's Task Force
    claims: [Properly applied p-values and significance tests remain useful; sound practice describes uncertainty, variability, multiplicity, and sources of variation rather than abandoning one tool by slogan.]
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4968573/
    publisher: National Library of Medicine archive
    claims: [Replication outcomes vary because estimates are noisy and because definitions of replication success differ; interpreting a replication requires expected variation rather than a binary label alone.]
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4988618/
    publisher: National Library of Medicine archive
    claims: [Some psychological effects may be sensitive to context, but context sensitivity must be specified and tested rather than invoked after any failure.]
  - url: https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-10
    publisher: Cochrane Handbook for Systematic Reviews of Interventions
    claims: [Meta-analysis statistically combines results from separate studies, commonly through weighted averages; it can improve precision and investigate heterogeneity, but biases, reporting selection, incompatible designs, and analytical judgments can make a synthesis misleading.]
  - url: https://dictionary.apa.org/replication
    publisher: American Psychological Association Dictionary of Psychology
    claims: [Replication repeats an experiment or study to verify or increase confidence in its results; direct replication keeps procedures as close as practical, while conceptual replication introduces different techniques to test theoretical information.]
  - url: https://www.apa.org/pubs/journals/releases/amp-amp0000191.pdf
    publisher: American Psychological Association Journal Article Reporting Standards
    claims: [Replication reports should identify whether they are direct, approximate, or conceptual and disclose changes in conditions, materials, procedures, participants, and treatment fidelity.]
  - url: https://www.apa.org/pubs/journals/resources/open-science
    publisher: American Psychological Association
    claims: [Sharing research data supports replication, reanalysis, and tests of generalizability; open-science practice must also address informed consent and data availability.]
notes: The work describes a documented methodological dispute. It does not claim that one hundred studies represent all psychology or all science, and it treats p-hacking as a family of undisclosed outcome-contingent choices rather than an accusation of fabrication.
