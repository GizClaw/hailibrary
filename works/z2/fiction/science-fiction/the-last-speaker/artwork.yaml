schema_version: 1
style: watercolor-gouache
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  mara: Forty-two-year-old woman, olive skin, angular face, dark brown wavy hair in low braid, rust-red field jacket, cream shirt, slate trousers, brown boots, matte-black unmarked recorder.
  ilyan: Eighty-seven-year-old island man, weathered copper-brown skin, narrow face, short cloud-white hair, neat white mustache, deep teal knit vest, pale ochre shirt, charcoal trousers, soft black shoes, carved wooden tide bird.
  seli: Twenty-six-year-old island woman, copper-brown skin, oval face, thick black curls tied with mustard cloth, sea-green overshirt, cream top, dark indigo trousers, tan boots, plain cobalt notebook.
  oren: Thirty-five-year-old East Asian man, light tan skin, rectangular face, short black hair, round glasses, pale gray-blue technical coat, navy trousers, white shoes, translucent amber audio device without glyphs.
  locations: Pelu Island has dark volcanic shore, low wind-shaped greenery, pale wood buildings, an old cream weather station with teal shutters, a warm boat shed, and a communal kitchen.
  palette: Rust red, deep teal, pale ochre, sea green, slate blue, warm wood, and one amber technology accent under soft maritime daylight.
assets:
  - {id: cover, file: artwork/cover.webp, scene: "Mara, Ilyan, Seli, and Oren gathered around a small recorder and carved tide bird in the weather station, with ocean and boat shed visible beyond; human conversation is central and the amber machine remains secondary."}
  - {id: p01, file: artwork/p01.webp, scene: "On an empty volcanic-stone pier beneath a wet slate sky, Ilyan carves a small wooden tide bird while Mara arrives carrying a closed recorder case and Oren follows with the amber device."}
  - {id: p02, file: artwork/p02.webp, scene: "Ilyan stands at the center of a loose island gathering: Seli listens, two fishers handle reef gear, and an older aunt keeps respectful distance, showing varied knowledge without ranking labels."}
  - {id: p03, file: artwork/p03.webp, scene: "Inside the old weather station, Seli arranges colored cords and shaped objects while speaking with Mara and Ilyan; Oren listens without understanding."}
  - {id: p04, file: artwork/p04.webp, scene: "Mara reviews a rich wordless archive of audio wave shapes, video thumbnails without glyphs, objects, and contextual links, while uneven empty spaces remain visibly present."}
  - {id: p05, file: artwork/p05.webp, scene: "In the warm boat shed, Ilyan and Naro repair a sail amid hammering and wind while Mara records and Oren reacts to the noisy setting."}
  - {id: p06, file: artwork/p06.webp, scene: "Mara moves a shell among a hill, shore, path, and cliff represented by simple physical models as Ilyan rejects the impossible cliff route."}
  - {id: p07, file: artwork/p07.webp, scene: "Oren unfolds the translucent amber speech device at the weather station while Seli questions him and he closes a glowing blank display."}
  - {id: p08, file: artwork/p08.webp, scene: "Mara separates three physical evidence trays for archive, model, and living conversation while Ilyan turns the tide bird and Oren listens."}
  - {id: p09, file: artwork/p09.webp, scene: "Ilyan and the team listen critically to several unmarked audio streams on the amber device, with kinship tokens showing that two similar sound errors have unequal social effects."}
  - {id: p10, file: artwork/p10.webp, scene: "Oren revises a report using blank geometric cards while Mara challenges the conclusion and Seli circles one selected card with an unmarked ring."}
  - {id: p11, file: artwork/p11.webp, scene: "Ilyan hides the carved tide bird in a cloth bag as Seli re-enters and the amber model responds, while Mara watches the source-of-knowledge test."}
  - {id: p12, file: artwork/p12.webp, scene: "Oren traces many workshop recordings of handled wooden birds toward a source tag, while Ilyan points toward the human annotator behind that tag."}
  - {id: p13, file: artwork/p13.webp, scene: "Ilyan narrates beside a wordless tabletop scene of a tiny boat entering luminous fog; the model projects singing bird silhouettes while listeners remain unconvinced."}
  - {id: p14, file: artwork/p14.webp, scene: "Seli challenges the tide story and Ilyan offers a new ending in which villagers wait for daylight outside the fog, with Oren comparing several open paths."}
  - {id: p15, file: artwork/p15.webp, scene: "Seli discovers a restricted storm-song recording represented by a closed family box feeding accidentally toward the amber model; the team reaches to disconnect it."}
  - {id: p16, file: artwork/p16.webp, scene: "Oren isolates derivative data branches while Mara consults descendants through the island council; an encrypted family archive box remains separate from the model."}
  - {id: p17, file: artwork/p17.webp, scene: "Mara maps a dense cluster of expert ceremonial recordings beside conspicuous empty kitchen and learner-conversation spaces in a wordless physical archive."}
  - {id: p18, file: artwork/p18.webp, scene: "A tired Ilyan rests beside the oxygen unit that the clinic had already placed in the weather station, while the recorder stays visibly closed and Mara listens without taking notes."}
  - {id: p19, file: artwork/p19.webp, scene: "Oren presents two unequal model versions and a traceable chain of plain source tokens; Seli tests a locked category without celebrating."}
  - {id: p20, file: artwork/p20.webp, scene: "Seli hesitates mid-conversation with the amber device, which answers too quickly; Oren adjusts it while Mara observes the failed repair interaction."}
  - {id: p21, file: artwork/p21.webp, scene: "Seli closes her cobalt notebook after Mara corrects her, while Ilyan holds two balanced wooden forms representing preservation and learner freedom."}
  - {id: p22, file: artwork/p22.webp, scene: "Mara, Seli, and Ilyan compare two plausible motion paths along a model shore and choose to gather more voices rather than mark one path wrong."}
  - {id: p23, file: artwork/p23.webp, scene: "The island council meets without cameras around separate source and synthetic audio objects, setting access gates and a physical pause control."}
  - {id: p24, file: artwork/p24.webp, scene: "A learner practice station offers several traceable examples and an open abstention path, while a community teacher controls whether any annotation enters the archive."}
  - {id: p25, file: artwork/p25.webp, scene: "Seli places a large server-maintenance stack beside a much smaller teaching stack; Oren and Mara rebalance resources toward local apprentices and classes."}
  - {id: p26, file: artwork/p26.webp, scene: "At a public island hall, Oren presents four separate wordless panels for archive, model, supervised learning, and social vitality instead of one triumphant symbol."}
  - {id: p27, file: artwork/p27.webp, scene: "In the boat shed, Ilyan and Seli test a bent plank and compare two directional forms on an unmarked tablet while Mara records their disagreement."}
  - {id: p28, file: artwork/p28.webp, scene: "Mara arranges a multidimensional speaker survey using blank objects for domains, partners, confidence, and learning; Seli and Naro choose different clusters while an aunt abstains."}
  - {id: p29, file: artwork/p29.webp, scene: "Ilyan plays cards beside his oxygen unit while the closed recorder rests away; in a parallel kitchen space, Seli and cousins cook and argue informally."}
  - {id: p30, file: artwork/p30.webp, scene: "At a quiet rain-season memorial, Seli pauses while Naro offers a word; the carved tide bird rests among flowers and all technology remains dark."}
  - {id: p31, file: artwork/p31.webp, scene: "Months later Seli uses a modest faceless practice tool that offers several source-linked paths without ranking them, while Mara adds a separate learner annotation."}
  - {id: p32, file: artwork/p32.webp, scene: "In the communal kitchen, five imperfect speakers laugh and debate around two bowls and the carved tide bird; the recorder remains paused until they jointly reach toward it."}
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - cover and all thirty-two page WebP files visually inspected at final resolution
      - every image checked against its declared page event and listen-alone text
      - recurring faces, hair, clothing, carved tide bird, recorder, island buildings, and palette remain identifiable
      - p31 and p32 regenerated after the first pass incorrectly retained Ilyan after his death
      - final images contain no visible words, letters, numbers, captions, logos, speech bubbles, signatures, or watermarks
      - final dimensions are 1536 by 1024 for cover and 768 by 512 for every page
