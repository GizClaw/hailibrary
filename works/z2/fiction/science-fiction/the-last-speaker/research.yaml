schema_version: 1
required: true
fictional_scope: >-
  Tava, its words and grammar, Pelu Island, the weather station, the characters,
  the recordings, model behavior, test results, access council, and all events
  are invented. The model's abilities are speculative and are not presented as
  representative performance for any existing system or language.
sources:
  - url: https://ich.unesco.org/doc/src/00120-EN.pdf
    title: Language Vitality and Endangerment
    publisher: UNESCO Ad Hoc Expert Group on Endangered Languages
    supports: >-
      Language endangerment is not measured by speaker count alone; factors include
      intergenerational transmission, domains of use, response to new domains and
      media, educational materials, policy, community attitudes, and documentation.
      A language is endangered when use narrows and transmission stops.
  - url: https://www.unesco.org/en/articles/towards-world-atlas-languages
    title: Towards World Atlas of Languages
    publisher: UNESCO
    supports: >-
      Documentation and new language tools can support speaker communities, while
      vitality data are incomplete and small speaker populations require careful,
      non-deterministic interpretation.
  - url: https://www.unesco.org/en/articles/leveraging-unesco-normative-instruments-ethical-generative-ai-use-indigenous-data
    title: Leveraging UNESCO Normative Instruments for an Ethical Generative AI Use of Indigenous Data
    publisher: UNESCO
    supports: >-
      Digitization and AI may aid recording, transmission, and revitalization, but
      misuse, misappropriation, privacy, intellectual-property, informed-consent,
      and data-sovereignty concerns require community control and cultural context.
  - url: https://www.unesco.org/ethics-ai/en/recommendation
    title: Recommendation on the Ethics of Artificial Intelligence
    publisher: UNESCO
    supports: >-
      AI governance should protect dignity, diversity, privacy, transparency,
      accountability, and human determination; ultimate responsibility must not be
      displaced onto an automated system.
  - url: https://blogs.soas.ac.uk/elar/2020/06/25/remote-linguistic-elicitation-methods/
    title: Remote Linguistic Elicitation Methods
    publisher: Endangered Languages Archive, SOAS University of London
    supports: >-
      Language documentation depends on relationships, informed consent, recording
      practice, speaker participation, contextual notes, and metadata; elicitation
      is not equivalent to ordinary conversation.
  - url: https://blogs.soas.ac.uk/elar/about-elar/
    title: About the Endangered Languages Archive
    publisher: Endangered Languages Archive, SOAS University of London
    supports: >-
      Endangered-language documentation archives preserve and publish multimedia
      collections, establishing that recordings and associated materials can form
      durable research and community resources.
  - url: https://journals.linguisticsociety.org/proceedings/index.php/PLSA/article/view/5219
    title: How usable are digital collections for endangered languages? A review
    publisher: Proceedings of the Linguistic Society of America
    supports: >-
      Digital preservation does not guarantee usability: discoverability, access,
      digitized audio, and associated time-aligned transcripts can remain serious
      limitations in archived collections.
  - url: https://aclanthology.org/2025.lm4uc-1.1/
    title: Enhance Contextual Learning in ASR for Endangered Low-resource Languages
    publisher: Association for Computational Linguistics
    supports: >-
      Low-resource speech technology is sensitive to language-specific design;
      stronger language-model results do not automatically yield better speech
      recognition, and transferred settings can substantially degrade performance.
notes: >-
  Sources support the distinctions among vitality, documentation, access, consent,
  and language-technology performance. They do not establish a universal definition
  of fluent speaker, guarantee revitalization, or validate the fictional Tava model.
  The story therefore treats “last fluent speaker” as a locally negotiated working
  description and makes every model claim subject to community-designed tests.
