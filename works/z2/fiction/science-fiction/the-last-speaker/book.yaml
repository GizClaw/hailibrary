schema_version: 1
id: the-last-speaker
type: [reading, illustrated-novella]
style: watercolor-gouache
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [science, technology, culture]
  themes: [identity, responsibility, tradition, cooperation]
  moods: [reflective, hopeful]
characters:
  - id: narrator
    kind: narrator
    description: A close near-future narrator attentive to evidence, silence, and the limits of technical claims.
    voice_identity: measured, lucid, and quietly skeptical
  - id: mara
    kind: character
    description: Dr. Mara Venn, a field linguist who has worked with the Tava community for twelve years and must reconsider what her archive can claim.
    visual_identity: A forty-two-year-old woman with olive skin, an angular face, dark brown wavy hair in a low braid, a rust-red field jacket over a cream shirt, slate trousers, brown boots, and a compact matte-black recorder with no markings.
    voice_identity: precise and patient, with restrained urgency when evidence is overstated
  - id: ilyan
    kind: character
    description: Ilyan Sero, the eighty-seven-year-old last fully fluent Tava speaker, a retired boatbuilder who controls what may be recorded and released.
    visual_identity: An eighty-seven-year-old island man with weathered copper-brown skin, a narrow face, short cloud-white hair, a neat white mustache, a deep teal knit vest over a pale ochre shirt, charcoal trousers, soft black shoes, and a small carved wooden tide bird with no symbols.
    voice_identity: economical, dryly playful, and exact about relationships
  - id: seli
    kind: character
    description: Seli Sero, Ilyan's twenty-six-year-old granddaughter, who understands much Tava, speaks it unevenly, and coordinates community access to the archive.
    visual_identity: A twenty-six-year-old island woman with copper-brown skin, an oval face, thick black curls tied with a mustard cloth, a sea-green overshirt over a cream top, dark indigo trousers, tan boots, and a plain cobalt notebook with blank pages.
    voice_identity: quick, candid, and increasingly confident, with contemporary island rhythms
  - id: oren
    kind: character
    description: Oren Vale, an engineer from the public language laboratory who built the experimental speech model and learns to narrow its claims.
    visual_identity: A thirty-five-year-old East Asian man with light tan skin, rectangular features, short straight black hair, round glasses without reflections or text, a pale gray-blue technical coat, navy trousers, white shoes, and a translucent amber audio device with no glyphs.
    voice_identity: analytical and earnest, becoming less defensive as tests expose the model's limits
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Distinguish recordings, descriptions, models, fluent use, and intergenerational transmission as different forms of linguistic preservation.
    - Evaluate how consent, access rules, error analysis, and community authority change a technical preservation project.
    - Interpret counterevidence that narrows a claim without making the underlying tool worthless.
  concepts:
    - language vitality and intergenerational transmission
    - documentary corpora and contextual metadata
    - speech-model evaluation under scarce data
    - consent, access, and community governance
rights: {text: project-original, artwork: project-generated, writer_persona: project-original}
