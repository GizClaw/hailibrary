    type: picture
    speaker: narrator
    prompt: What is on the chair?
    answer: A red hat.
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: Whose hat is it?
    choices:
      - Ari's
      - Mei's
      - The chair's
    answer: Ari's.
    page_refs:
      - p02
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
