    - id: p02
      illustration: p02
      paragraphs:
        - text: Mei asks, “Is this yours?” Ari nods.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Mei lifts Ari's hat.
    - id: p04
      illustration: p04
      paragraphs:
        - text: “Please put it on,” Ari says.
    - id: p05
      illustration: p05
      paragraphs:
        - text: The red hat goes on Ari.
    - id: p06
      illustration: p06
      paragraphs:
        - text: “Now we can sit!” Mei laughs.
