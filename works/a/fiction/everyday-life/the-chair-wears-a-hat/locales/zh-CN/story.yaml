schema_version: 2
language: zh-CN
writer: 溪铃
title: 椅子戴着红帽子
summary: 小梅看见椅子上有一顶红帽子。她拿起帽子，阿梨说帽子是自己的。小梅给他戴上了。
chapters:
  - id: ch01
    title: 好笑的帽子
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 红帽子放在哪里？
    answer: 放在椅子上。
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 帽子是谁的？
    choices:
      - 阿梨的
      - 小梅的
      - 椅子的
    answer: 阿梨的。
    page_refs:
      - p04
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 红帽子放在椅子上。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 小梅问：“是你的吗？”阿梨点点头。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 小梅拿起阿梨的帽子。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 阿梨说：“请帮我戴上。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 红帽子戴在阿梨头上。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 小梅笑了：“现在能坐啦！”
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖俏皮
        timbre: 清晰的成年声音
        pace: 慢速
        pitch: 中音
    mei:
      display_name: 小梅
      tts:
        delivery: 好奇明亮
        timbre: 清脆的儿童声音
        pace: 慢速
        pitch: 中高音
    ari:
      display_name: 阿梨
      tts:
        delivery: 活泼温和
        timbre: 柔和的儿童声音
        pace: 慢速
        pitch: 高音
  pages:
    - id: p01
      illustration: p01
      blocks:
        - id: p01-b01
          speaker: narrator
          text: 红帽子放在椅子上。
    - id: p02
      illustration: p02
      blocks:
        - id: p02-b01
          speaker: mei
          text: 椅子戴着红帽子！
    - id: p03
      illustration: p03
      blocks:
        - id: p03-b01
          speaker: narrator
          text: 小梅拿起红帽子。
    - id: p04
      illustration: p04
      blocks:
        - id: p04-b01
          speaker: ari
          text: 那是我的帽子！
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          text: 红帽子戴在阿梨头上。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: mei
          text: 椅子空了。我们能坐啦！
