schema_version: 1
required: true
reason: The work names asking before touching another person's belonging as a social-learning concept.
sources:
  - id: naeyc-self-direction
    title: Fostering Children's Competence and Success
    publisher: National Association for the Education of Young Children
    url: https://www.naeyc.org/resources/pubs/yc/spring2021/fostering-competence-success
    supports:
      - Young children can practice thinking before acting and resisting the urge to touch another person's belongings.
  - id: naeyc-positive-guidance
    title: Culturally Appropriate Positive Guidance with Young Children
    publisher: National Association for the Education of Young Children
    url: https://www.naeyc.org/resources/pubs/yc/mar2017/culturally-appropriate-positive-guidance
    supports:
      - Taking another child's object without permission is a behavior adults should guide rather than normalize.
notes:
  - Mei asks Ari about the hat before lifting or returning it.
  - The chair-wearing-a-hat line is clearly playful personification.
