schema_version: 3
language: zh-CN
writer: 溪铃
title: 再看一颗星
summary: 林林走上阳台，抬头看见星星，还想再看一颗。
chapters:
  - id: ch01
    title: 变化
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 转折
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    prompt: 屋顶上方有什么在发亮？
    answer: 星星在发亮。
    page_refs:
      - p04
      - p05
  - id: q02
    type: explicit-choice
    prompt: 灯亮以后，林林请妈妈等一下，还是进屋？
    answer: 她请妈妈等一下。
    page_refs:
      - p07
      - p09
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林林走上阳台。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她听见邻居说话。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 她抬头看屋顶。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 一颗星亮着。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 更多星星亮着。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 林林站在妈妈身边。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 楼里的灯亮了。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 星星变淡了。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 林林说：“等一下。”
    - id: p10
      illustration: p10
      paragraphs:
        - text: 他们再看一颗星。
