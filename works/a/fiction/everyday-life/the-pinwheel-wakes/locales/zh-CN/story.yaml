schema_version: 2
language: zh-CN
writer: 溪铃
title: 小风车醒了
summary: 米娜的小风车不转。小李发现一片风叶弯了。米娜把风叶扶好，小风车又转起来。
chapters:
  - id: ch01
    title: 小小修理
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 哪一片风叶弯了？
    answer: 小李指着的风叶。
    page_refs:
      - p03
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 什么让风车转起来？
    choices:
      - 风
      - 书
      - 杯子
    answer: 风。
    page_refs:
      - p05
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 蓝风车一动不动。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 米娜吹了吹，说：“转呀！”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 小李说：“这片风叶弯了。”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 米娜轻轻扶好风叶。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - vocabulary:
                id: wind
                text: 风
            - text: 吹动了蓝风车。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 米娜欢呼：“转起来啦！”
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖清楚
        timbre: 柔和的成年声音
        pace: 慢速
        pitch: 中音
    mina:
      display_name: 米娜
      tts:
        delivery: 好奇明快
        timbre: 清亮的童声
        pace: 慢速
        pitch: 中高音
    lee:
      display_name: 小李
      tts:
        delivery: 平静耐心
        timbre: 柔和的童声
        pace: 慢速
        pitch: 中音
  pages:
    - id: p01
      illustration: p01
      blocks:
        - id: p01-b01
          speaker: narrator
          text: 蓝风车不转。
    - id: p02
      illustration: p02
      blocks:
        - id: p02-b01
          speaker: narrator
          text: 米娜吹一吹。
        - id: p02-b02
          speaker: mina
          text: 还是不转。
    - id: p03
      illustration: p03
      blocks:
        - id: p03-b01
          speaker: lee
          text: 一片风叶弯了。
    - id: p04
      illustration: p04
      blocks:
        - id: p04-b01
          speaker: narrator
          text: 米娜把风叶扶起来。
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          content:
            - vocabulary:
                id: wind
                text: 风
            - text: 吹动了蓝风车。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 蓝风车转得真快！
        - id: p06-b02
          speaker: mina
          text: 它醒啦！
