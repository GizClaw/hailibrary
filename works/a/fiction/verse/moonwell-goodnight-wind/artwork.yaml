schema_version: 1
style: watercolor-gouache
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  series: Moonwell Goodnight / 月井晚安, book 3 of 3; match the established Pip, old pear tree, mossy well, lantern, crescent moon, distant lake, hills, and night setting.
  setting: Old pear tree on the left with a snug round hollow above a broad branch; mossy circular stone well on the right; enclosed amber lantern on the ground left; crescent moon reflected in the well water.
  palette: Soft dark-blue night, moss green, cream, muted brown, pear green, and warm amber lamplight; night lighting overrides the Style daylight default.
  pip: Small round brown owl with cream belly and face discs, big amber eyes, one central fluffy feather tuft, tiny ochre beak and feet, and no clothing.
  wind: Readable through gently streaming leaves, bending small twigs, Pip's feathers, and subtle water ripples; safe and cozy, never a storm, with no broken branches or flying debris.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Pip holds the broad pear-tree branch as the night wind moves leaves and pears beside the mossy moonwell; the amber lantern glows and a crescent moon reflects in the water.
  - id: p01
    file: artwork/p01.webp
    scene: Wide establishing view of night wind moving the old pear tree beside the mossy well while Pip watches from the broad branch.
  - id: p02
    file: artwork/p02.webp
    scene: The broad pear-tree branch and leaves sway gently; Pip rocks with the branch while keeping both feet planted.
  - id: p03
    file: artwork/p03.webp
    scene: A stronger but safe breeze streams the pear leaves and ruffles Pip's feathers as Pip grips the broad branch tightly with both feet.
  - id: p04
    file: artwork/p04.webp
    scene: Pip holds the branch, faces the moving leaves, and opens his beak to ask the wind to slow; no speech bubble or text.
  - id: p05
    file: artwork/p05.webp
    scene: The wind eases; leaves and small twigs move softly while Pip relaxes on the steadier branch.
  - id: p06
    file: artwork/p06.webp
    scene: Pear leaves rustle gently above Pip like a soft song; Pip listens with heavy, calm amber eyes.
  - id: p07
    file: artwork/p07.webp
    scene: Pip closes his eyes on the now-steady broad branch close to the pear-tree trunk, warm lantern light below.
  - id: p08
    file: artwork/p08.webp
    scene: Pip sleeps securely on the broad branch as only a few leaves stir; the dim amber lantern and crescent moon reflection complete the quiet night.
