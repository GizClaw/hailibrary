        timbre: 圆润的成年嗓音
        pace: 舒缓，每句自然停顿
        pitch: 中低音
    pip:
      display_name: 小咕
      tts:
        delivery: 轻柔、困倦，像快睡着了
        timbre: 细软、略带气声的小嗓音
        pace: 很慢，轻轻拖长尾音
        pitch: 轻盈的高音
