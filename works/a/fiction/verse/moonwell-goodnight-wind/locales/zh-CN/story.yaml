schema_version: 2
language: zh-CN
writer: 溪铃
title: 月井晚安·风
summary: 风摇着梨树，小咕抓紧树枝。风轻了，小咕听着听着，睡着了。
chapters:
  - id: ch01
    title: 风轻了
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
      - p08
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 图里，风吹弯了哪一样？
    choices:
      - 梨树
      - 地上的灯笼
    answer: 梨树
    page_refs:
      - p01
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 最后，小咕睡了，还是飞了？
    choices:
      - 睡了
      - 飞了
    answer: 睡了
    page_refs:
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - vocabulary:
                id: wind
                text: 风
            - text: 儿大，梨树晃。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 小咕抓紧树枝，不慌张。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - vocabulary:
                id: wind
                text: 风
            - text: 更大，呼呼响。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 小咕喊：“
            - vocabulary:
                id: wind
                text: 风
            - text: 儿别忙！”
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - vocabulary:
                id: wind
                text: 风
            - text: 儿轻，吹过身旁。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - vocabulary:
                id: wind
                text: 风
            - text: 儿唱，树叶沙沙响。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 小咕闭眼，灯光亮。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 小咕睡得香。
