schema_version: 1
required: false
sources:
  - url: https://www.oxfordlearnersdictionaries.com/us/definition/american_english/wind1_1
    authority: Oxford University Press
    claims:
      - The target noun wind means naturally moving air and has American English pronunciation /wɪnd/.
      - Wind can blow, grow softer, and make trees sway in ordinary English usage.
  - url: https://www.zdic.net/hans/%E9%A3%8E
    authority: Han Dian
    claims:
      - The noun 风 names moving air and is pronounced fēng in this story sense.
  - url: https://www.cambridgeenglish.org/images/506166-starters-movers-flyers-word-list-2025.pdf
    authority: Cambridge University Press & Assessment
    claims:
      - The 2025 Cambridge Young Learners list records wind as a noun at A1 Movers.
  - url: https://www.weather.gov/pqr/wind?lv=true
    authority: NOAA National Weather Service
    claims:
      - Light and gentle breezes can move leaves and small twigs, while stronger breezes can move branches and make small trees sway.
  - url: https://osa.magnet.fsu.edu/teachersparents/articles/reflectionoflight.html
    authority: Optical Society of America / Florida State University
    claims:
      - A smooth water surface can show a reflected image, supporting the moon reflection in the well.
  - url: https://dl.allaboutbirds.org/hubfs/Bird%20Academy/WonderfulWorldOwlsPoster_July%202024.pdf
    authority: Cornell Lab of Ornithology
    claims:
      - Owls have feet adapted for perching on branches, supporting Pip's secure hold; Pip remains a fictional, species-unspecified owl.
notes: "No subject research required: this is a purely invented bedtime verse, book 3 of Moonwell Goodnight / 月井晚安. The sources record lexical review and independent checks of ordinary visual and physical assumptions only. The wind's song and Pip's request to the wind are clear personification, not scientific claims, and the verse does not claim that wind causes sleep."
