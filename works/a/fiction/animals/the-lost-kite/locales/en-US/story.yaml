schema_version: 1
language: en-US
writer: mossy-kite
title: The Lost Kite
summary: The wind takes Fox's red kite to a tree. Fox finds it on a low branch.

cast:
  narrator:
    display_name: Narrator
    tts:
      delivery: warm and unhurried
      timbre: soft, clear adult voice
      pace: slow
      pitch: medium
  fox:
    display_name: Fox
    tts:
      delivery: young, bright, and expressive
      timbre: light youthful voice
      pace: medium-slow
      pitch: medium-high

pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content:
          - text: "Fox has a red "
          - vocabulary: { id: kite, text: kite }
          - text: "."

  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content:
          - text: "The "
          - vocabulary: { id: wind, text: wind }
          - text: " pulls the kite."

  - id: p03
    illustration: p03
    lines:
      - speaker: narrator
        text: The wind takes the kite!
      - speaker: fox
        text: My kite!

  - id: p04
    illustration: p04
    lines:
      - speaker: narrator
        content:
          - text: "Fox looks by the "
          - vocabulary: { id: tree, text: tree }
          - text: "."

  - id: p05
    illustration: p05
    lines:
      - speaker: narrator
        text: The kite is on a branch.

  - id: p06
    illustration: p06
    lines:
      - speaker: narrator
        text: Fox gets the kite.
      - speaker: fox
        text: My kite is back!

chapters:
  - id: ch01
    title: Lost and Found
    page_refs: [p01, p02, p03, p04, p05, p06]

questions:
  - id: q01
    type: explicit-choice
    speaker: narrator
    prompt: What color is the kite?
    choices: [Red, Blue, Green]
    answer: Red
    page_refs: [p01]

  - id: q02
    type: picture
    speaker: narrator
    prompt: Where does Fox find the kite?
    answer: On a branch.
    page_refs: [p05]
