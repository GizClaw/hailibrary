schema_version: 1
language: en-US
writer: meadow-lark
title: The Lost Kite
summary: Fox loses a red kite in the wind and finds it in a tree.

cast:
  narrator:
    display_name: Narrator
    tts:
      delivery: warm and unhurried
      timbre: soft, clear adult voice
      pace: slow
      pitch: medium
  fox:
    display_name: Fox
    tts:
      delivery: young, bright, and expressive
      timbre: light youthful voice
      pace: medium-slow
      pitch: medium-high

pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content:
          - text: "Fox has a red "
          - vocabulary: { id: kite, text: kite }
          - text: "."

  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content:
          - text: "The "
          - vocabulary: { id: wind, text: wind }
          - text: " is strong."

  - id: p03
    illustration: p03
    lines:
      - speaker: narrator
        text: The kite flies away.
      - speaker: fox
        text: Oh, no!

  - id: p04
    illustration: p04
    lines:
      - speaker: narrator
        content:
          - text: "Fox runs to the "
          - vocabulary: { id: tree, text: tree }
          - text: "."

  - id: p05
    illustration: p05
    lines:
      - speaker: narrator
        text: The red kite is there!
      - speaker: fox
        text: My kite!

  - id: p06
    illustration: p06
    lines:
      - speaker: narrator
        text: Fox hugs the kite.
      - speaker: fox
        text: I found it!

chapters:
  - id: ch01
    title: Lost and Found
    page_refs: [p01, p02, p03, p04, p05, p06]

questions:
  - id: q01
    type: explicit-choice
    speaker: narrator
    prompt: What color is the kite?
    choices: [Red, Blue, Green]
    answer: Red
    page_refs: [p01]

  - id: q02
    type: picture
    speaker: narrator
    prompt: Where does Fox find the kite?
    answer: In the tree.
    page_refs: [p04, p05]
