schema_version: 1
language: zh-CN
writer: 溪铃
title: 飞走的风筝
summary: 风吹跑了小狐狸的红风筝。还好，风筝挂在了树上。

cast:
  narrator:
    display_name: 旁白
    tts:
      delivery: 温暖、清楚、从容
      timbre: 柔和清楚的成年声音
      pace: 慢速
      pitch: 中音
  fox:
    display_name: 小狐狸
    tts:
      delivery: 年幼、明亮、情绪清楚
      timbre: 轻快的幼年声音
      pace: 中慢速
      pitch: 中高音

pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content:
          - text: 小狐狸有一只红
          - vocabulary: { id: kite, text: 风筝 }
          - text: 。

  - id: p02
    illustration: p02
    lines:
      - speaker: narrator
        content:
          - vocabulary: { id: wind, text: 风 }
          - text: 越刮越大。

  - id: p03
    illustration: p03
    lines:
      - speaker: narrator
        text: 风筝飞走了。
      - speaker: fox
        text: 糟了！

  - id: p04
    illustration: p04
    lines:
      - speaker: narrator
        content:
          - text: 小狐狸跑到
          - vocabulary: { id: tree, text: 树 }
          - text: 下。

  - id: p05
    illustration: p05
    lines:
      - speaker: narrator
        text: 红风筝挂在树上！
      - speaker: fox
        text: 我的风筝！

  - id: p06
    illustration: p06
    lines:
      - speaker: narrator
        text: 小狐狸抱住风筝。
      - speaker: fox
        text: 找到啦！

chapters:
  - id: ch01
    title: 风筝找到了
    page_refs: [p01, p02, p03, p04, p05, p06]

questions:
  - id: q01
    type: explicit-choice
    speaker: narrator
    prompt: 风筝是什么颜色？
    choices: [红色, 蓝色, 绿色]
    answer: 红色
    page_refs: [p01]

  - id: q02
    type: picture
    speaker: narrator
    prompt: 小狐狸在哪里找到风筝？
    answer: 在树上。
    page_refs: [p04, p05]
