schema_version: 1
required: true
reason: A kite, wind, and tree create a potential retrieval-safety implication even in a fictional animal story.
sources:
  - id: nws-wind-safety
    title: High Wind Safety
    publisher: National Weather Service
    url: https://www.weather.gov/safety/wind-hazards
    supports:
      - Trees and airborne objects can be hazardous during high winds.
  - id: met-office-strong-wind
    title: Stay safe in strong wind
    publisher: Met Office
    url: https://weather.metoffice.gov.uk/warnings-and-advice/seasonal-advice/stay-safe-in-strong-wind
    supports:
      - Being outside in strong winds can increase the risk of injury.
notes:
  - The story does not call the wind severe or teach kite retrieval.
  - Fox does not climb or pull at the tree; the wind stops before the kite slips from a low branch.
  - The speaking fox and convenient falling kite are declared fantasy events.
