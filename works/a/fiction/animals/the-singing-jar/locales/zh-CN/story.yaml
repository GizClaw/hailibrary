schema_version: 2
language: zh-CN
writer: 溪铃
title: 会唱歌的罐子
summary: 雨滴落进罐子，响得鼹鼠睡不着。老鼠在罐里垫上布，声音小了；雨停后，他们还要修屋顶。
chapters:
  - id: ch01
    title: 安静下来
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 雨滴落在哪里？
    answer: 罐子里。
    page_refs:
      - p02
  - id: q02
    type: explicit-choice
    speaker: narrator
    prompt: 什么让雨滴轻下来？
    choices:
      - 罐子里的布
      - 鼹鼠的被子
    answer: 罐子里的布。
    page_refs:
      - p05
      - p06
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 滴答！雨从屋顶漏下来。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 雨滴落进
            - vocabulary:
                id: jar
                text: 罐子
            - text: 里。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 老鼠说：“太响了！”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 鼹鼠叹气：“睡不着。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 老鼠在罐里垫上软布。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 鼹鼠睡着了。屋顶还漏雨。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 安静清楚
        timbre: 柔和的成年声音
        pace: 慢速
        pitch: 中音
    mouse:
      display_name: 老鼠
      tts:
        delivery: 机灵关切
        timbre: 轻亮的童声
        pace: 中速
        pitch: 高音
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 困倦温和
        timbre: 低软的童声
        pace: 慢速
        pitch: 低音
  pages:
    - id: p01
      illustration: p01
      blocks:
        - id: p01-b01
          speaker: narrator
          text: 屋顶漏下一滴雨。
    - id: p02
      illustration: p02
      blocks:
        - id: p02-b01
          speaker: narrator
          content:
            - text: 雨滴落进
            - vocabulary:
                id: jar
                text: 罐子
            - text: 。
    - id: p03
      illustration: p03
      blocks:
        - id: p03-b01
          speaker: mouse
          text: 太响了！
    - id: p04
      illustration: p04
      blocks:
        - id: p04-b01
          speaker: mole
          text: 罐子太响，我睡不着。
    - id: p05
      illustration: p05
      blocks:
        - id: p05-b01
          speaker: narrator
          text: 老鼠把布放进罐子。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 雨滴安静了。鼹鼠睡着了。屋顶还漏雨。
