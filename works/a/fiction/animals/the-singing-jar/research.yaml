schema_version: 1
required: true
reason: The story depicts an indoor roof leak and must distinguish temporary containment from repairing and drying the water problem.
sources:
  - id: epa-mold-moisture
    title: What are ten things I need to know about mold?
    publisher: United States Environmental Protection Agency
    url: https://www.epa.gov/mold/what-are-ten-things-i-need-know-about-mold
    supports:
      - Fix the source of a water problem or leak.
      - Dry wet or damp materials within 24 to 48 hours when possible.
  - id: cdc-mold
    title: 8 Tips to Clean Mold
    publisher: Centers for Disease Control and Prevention
    url: https://www.cdc.gov/mold-health/communication-resources/8-tips-to-clean-mold.html
    supports:
      - Fix water leaks and dry wet items promptly to help prevent mold growth.
notes:
  - The jar and cloth are explicitly temporary measures that catch water and soften the sound.
  - The ending says the roof still needs repair after the rain stops; it does not present cloth as a leak repair.
  - The burrow home and speaking animals are fantasy.
