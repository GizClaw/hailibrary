schema_version: 2
language: en-US
writer: mossy-kite
title: The Little Red Trail
summary: An follows a hill path with the village's red ribbon. After it guides her past a split, the villagers make red markers together.
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: An takes the village's red ribbon.
    - id: p02
      illustration: p02
      paragraphs:
        - text: An walks uphill. The ribbon streams behind.
    - id: p03
      illustration: p03
      paragraphs:
        - text: The path splits by the rock.
    - id: p04
      illustration: p04
      paragraphs:
        - text: An ties the ribbon. “This way,” she says.
    - id: p05
      illustration: p05
      paragraphs:
        - text: An follows that path home.
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "Villagers say, “Let's make red "
            - vocabulary: {id: marker, text: markers}
            - text: "!”"
