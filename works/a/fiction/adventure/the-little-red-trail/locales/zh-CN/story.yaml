  - {id: p02, illustration: p02, lines: [{speaker: an, text: 红丝带，陪我上山吧！}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 小路分成两条。}]}
  - {id: p04, illustration: p04, lines: [{speaker: an, text: 系一根红丝带吧。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 安终于到了山村。}]}
  - {id: p06, illustration: p06, lines: [{speaker: an, content: [{text: 这下，大家都有}, {vocabulary: {id: marker, text: 路标}}, {text: 啦！}]}]}
chapters:
