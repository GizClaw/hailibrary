schema_version: 2
language: zh-CN
writer: 溪铃
title: 山路上的红丝带
summary: 安带着村里的红丝带上山。丝带帮她认清岔路，到了村子后，大家一起做了红路标。
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 安拿起村里的红丝带。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 安上山，丝带飘在身后。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 山路在灰石头旁分开了。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 安系好丝带，说：“走这边。”
    - id: p05
      illustration: p05
      paragraphs:
        - text: 安顺着小路到了村子。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 村民说：“一起做红
            - vocabulary: {id: marker, text: 路标}
            - text: 吧！”
audio_script:
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 温柔清楚, timbre: 清亮的成年声音, pace: 慢速, pitch: 中音}}
    an: {display_name: 安, tts: {delivery: 好奇明快, timbre: 清脆的童声, pace: 中慢速, pitch: 中高音}}
    villagers: {display_name: 村民们, tts: {delivery: 热情亲切, timbre: 友好的多人声音, pace: 中慢速, pitch: 中音}}
  pages:
