schema_version: 1
language: zh-CN
writer: 北辰
title: 山路上的红丝带
summary: 安沿小路上山，一路系下红丝带，给后来的人留下路标。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 温柔清楚, timbre: 清亮的成年声音, pace: 慢速, pitch: 中音}}
  an: {display_name: 安, tts: {delivery: 好奇明快, timbre: 清脆的童声, pace: 中慢速, pitch: 中高音}}
pages:
