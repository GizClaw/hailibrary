cover_prompt: |-
  A wordless cover scene in a small New England town around 1910 shows Pollyanna bringing warmth to a quiet household. Pollyanna is an eleven-year-old girl with sunlit auburn braids, freckles, a practical straw hat, a simple checked dress, and sturdy buttoned boots. She stands on the broad steps of her aunt's severe white house, holding a small prism so that a rainbow patch falls across the gray hallway and reaches an elderly woman seated inside. Pollyanna's careful tilt of the prism is the focal action, symbolizing her habit of finding gladness without becoming sentimental. Use an eye-level view from the doorway, balancing the bright garden outside with the shadowed interior and leaving calm pale wall space at the top. Keep clothing, furnishings, and architecture accurate to early-twentieth-century Vermont and avoid any modern adaptation likenesses. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
