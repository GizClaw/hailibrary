cover_prompt: |-
  A wordless cover scene in a lantern-lit palace courtyard evokes a collection of wondrous tales from the medieval Islamic world. A courageous young woman in a flowing deep-blue robe sits beside an open lattice window, telling a story to a solemn ruler in a jeweled turban while a younger woman listens nearby. From the storyteller's raised hand, imagined wonders sweep across the courtyard: a vast bird flies above a distant island, a richly dressed young traveler lifts a glowing brass lamp, and a merchant ship crosses a moonlit sea. The unfolding visions form the focal action, linking palace, desert, sea, and enchanted journey within one continuous scene. Use a wide, gently elevated composition with patterned arches framing the figures, warm lamplight below, and calm open night sky across the top. Keep the architecture, clothing, vessels, and objects grounded in a broadly premodern Middle Eastern setting, with original child-friendly designs and no frightening detail. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
