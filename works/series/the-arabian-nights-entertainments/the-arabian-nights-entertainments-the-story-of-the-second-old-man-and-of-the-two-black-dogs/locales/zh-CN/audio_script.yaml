audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    old_man_black_dogs:
      display_name: 牵黑狗的老人
      tts:
        delivery: 自信持重，提出请求时恭敬而笃定
        timbre: 苍老清晰，沉稳有力
        pace: 从容偏慢
        pitch: 中低音
    eldest_brother:
      display_name: 大哥
      tts:
        delivery: 落魄时低沉羞愧，心生歹意后冷硬寡言
        timbre: 成熟粗哑，略带疲惫
        pace: 自然偏慢
        pitch: 中低音
    fairy:
      display_name: 仙女
      tts:
        delivery: 坚定果决，发怒时威严凌厉
        timbre: 清亮成熟，带着超然气度
        pace: 清楚从容，震怒时略微加重
        pitch: 中高音
    genius:
      display_name: 精灵
      tts:
        delivery: 暴烈森严，发怒时咄咄逼人
        timbre: 粗粝浑厚，带着可怖的压迫感
        pace: 缓慢沉重，威吓时突然加重
        pitch: 低音
    scheherazade:
      display_name: 山鲁佐德
      tts:
        delivery: 聪慧沉着，讲述时从容而富有悬念
        timbre: 柔和清澈，端庄温暖
        pace: 舒缓自然，转折处稍作停顿
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三兄弟的家产
      blocks:
        - id: ch01-b01
          speaker: old_man_black_dogs
          text: |-
            精灵王子，我们本是兄弟三人，就是我和您眼前这两条黑狗。父亲去世后，留给我们每人一千枚金币。我们拿着同样的本钱，做起同一种营生，各自开了一间铺子，都成了商人。
        - id: ch01-b02
          speaker: old_man_black_dogs
          text: |-
            铺子开张不久，大哥便卖掉全部家当，换成货物，到外国做生意去了。整整一年以后，一个乞丐走进我的铺子。我照常向他问好。
        - id: ch01-b03
          speaker: eldest_brother
          text: 你好。怎么，你已经认不出我了吗？
        - id: ch01-b04
          speaker: old_man_black_dogs
          text: |-
            我仔细看了看，才认出这个乞丐竟是大哥。我赶紧带他回家，问他这一年过得怎么样。
        - id: ch01-b05
          speaker: eldest_brother
          text: |-
            别问了。你看看我，就知道我还剩下什么。这一年里发生的种种不幸，才让我落到这般田地。再说一遍，只会让我重新难过。
          emotion: sad
        - id: ch01-b06
          speaker: old_man_black_dogs
          text: |-
            我关上铺子，处处照料他，先带他去沐浴，又把自己最好的衣裳给他穿。我查看账目，发现原有的一千枚金币已经翻了一番，如今共有两千枚，便把其中一半分给了他。
        - id: ch01-b07
          speaker: old_man_black_dogs
          text: 哥哥，收下这些钱，把从前的损失忘了吧。
        - id: ch01-b08
          speaker: old_man_black_dogs
          text: |-
            大哥欢喜地收下，我们又像从前那样生活。不久，二哥也执意卖掉铺子，跟商队出门远行。我和大哥使尽办法劝他留下，他始终不听。一年后，他回来了，也像大哥当初那样一贫如洗。我好好照料他，又从手里的余钱中拿出一千枚金币，让他重新开店。
    - id: ch02
      title: 远航与背叛
      blocks:
        - id: ch02-b01
          speaker: old_man_black_dogs
          text: |-
            后来，两位哥哥一起来找我，劝我同他们结伴远行，到外面做买卖。我起初怎么也不肯，还问他们，前两次出门究竟赚到了什么。可他们不肯罢休，一次又一次来劝。足足坚持了五年，我最后还是答应了。
        - id: ch02-b02
          speaker: old_man_black_dogs
          text: |-
            准备货物时，我才知道，先前给他们的钱早已花得一枚不剩。我没有责备他们，而是把自己的六千枚金币拿出来，给他们每人一千，自己留下一千，再把剩下的三千埋在家里。我们装好一船货物，乘着顺风出海了。
        - id: ch02-b03
          speaker: old_man_black_dogs
          text: |-
            航行两个月后，我们来到一座海港。我们下船做成好几笔大买卖，又换成当地的货物，准备再次出海。就在船要起航时，一位衣衫破旧、容貌却十分美丽的女子在岸边拦住我。她走到我面前，亲吻我的手，求我娶她为妻，再带她一同上船。
        - id: ch02-b04
          speaker: old_man_black_dogs
          text: |-
            我一开始拒绝了。可她苦苦恳求，还答应一定会做个贤良的妻子，我终于同意。我给她置办了几身漂亮衣裳，同她成婚，然后一起登船出发。一路相处，我发现她身上有许多美好的品性，对她也一天比一天爱重。
        - id: ch02-b05
          speaker: old_man_black_dogs
          text: |-
            两个哥哥却因为我的好运而心生嫉妒，暗中谋划着要取我的性命。一天夜里，趁我和妻子都睡着，他们把我们扔进了海里。可我的妻子原来是仙女。她没有让我淹死，还施展法术，把我送到一座岛上。天亮时，她终于说出了实情。
        - id: ch02-b06
          speaker: fairy
          text: |-
            那天在岸边，我一见你就十分喜欢，便想试试你是否心地善良，所以才化成那副贫苦模样来见你。现在，我救了你的命，也算回报了你的善心。可你的哥哥竟敢这样害你，我绝不会放过他们。我要取他们的性命！
          emotion: angry
        - id: ch02-b07
          speaker: old_man_black_dogs
          text: |-
            我谢过仙女的救命之恩，又一再求她饶哥哥们一命，总算平息了她的怒火。
    - id: ch03
      title: 两条黑狗
      blocks:
        - id: ch03-b01
          speaker: old_man_black_dogs
          text: |-
            一眨眼，仙女便把我从那座岛送回自家屋顶，随后消失了。我下到屋里，打开紧闭的家门，又从墙角挖出埋藏的三千枚金币。接着，我回到从前做生意的地方，把铺子重新开了起来。商人朋友们见我平安归来，纷纷赶来向我道贺。
        - id: ch03-b02
          speaker: old_man_black_dogs
          text: |-
            等我回到家，两条黑狗愁眉苦脸地迎了上来。我从没见过它们，心里正惊讶得很，仙女忽然又出现在眼前。
        - id: ch03-b03
          speaker: fairy
          text: |-
            不用奇怪，这两条狗就是你的哥哥。我罚他们保持这副模样，整整生活十年。
        - id: ch03-b04
          speaker: old_man_black_dogs
          text: |-
            接着，她告诉我，今后要去什么地方才能打听到她的消息。说完这些，她便从我眼前消失了。如今，哥哥们受罚的十年之期眼看要满，我正在赶路寻找仙女。途中碰见这位商人和牵母鹿的老人，我便停下脚步，留在这里陪着他们。
        - id: ch03-b05
          speaker: old_man_black_dogs
          text: |-
            精灵王子，这便是我的全部经历。您说，这个故事难道还不够奇妙吗？
        - id: ch03-b06
          speaker: genius
          text: 的确奇妙。看在这个故事的分上，我免去商人三分之一的刑罚。
    - id: ch04
      title: 商人获救
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            接着，第三个老人也提出了相同的请求。精灵答应，只要他的故事胜过前两个，就免去商人最后三分之一的刑罚。
        - id: ch04-b02
          speaker: narrator
          text: |-
            第三个老人就这样把自己的故事讲给精灵听。可惜那故事究竟是什么，我并不知道，所以没法转述给你们。不过有一件事我很清楚，那故事比前两个更加奇妙，连精灵听完也惊叹不已。
        - id: ch04-b03
          speaker: genius
          text: |-
            我愿为你免去商人三分之一的刑罚。这个商人应该感谢你们三位出手相助。若不是你们，他早已没命了。
        - id: ch04-b04
          speaker: narrator
          text: |-
            说完，精灵便消失了，众人无不欢喜。商人一一谢过三位朋友，随后大家各自上路。他回到妻子儿女身边，从此同他们幸福地度过余生。
        - id: ch04-b05
          speaker: scheherazade
          text: |-
            不过，陛下，我刚才讲的这些故事纵然动听，也远远比不上渔夫的故事。
