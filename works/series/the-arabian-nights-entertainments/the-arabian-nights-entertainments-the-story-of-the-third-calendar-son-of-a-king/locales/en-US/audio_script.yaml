  chapters:
    - id: ch01
      title: The Black Mountain
      blocks:
        - id: ch01-b01
          speaker: agib
          text: >-
            My story is quite different from the stories of my two friends. Fate cost them their right eyes. I lost mine through my own foolishness. My name is Agib, and I am the son of King Cassib. His great kingdom had one of the finest seaports in the world for its capital.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When Agib inherited his father's throne, he first visited the provinces on the mainland. Then he sailed among the many islands off the coast, hoping to win the love of his people. Those voyages made him long for wider seas. Before long, he ordered a fleet of large ships to be fitted out, and set off to explore distant waters.
        - id: ch01-b03
          speaker: narrator
          text: >-
            For forty days, the wind and weather favored the fleet. Then a terrible storm rose in the night. It drove the ships this way and that for ten days, until the pilot admitted that he no longer knew where they were. A sailor climbed to the masthead to search for land. He could see only sea and sky, and one enormous mass of blackness behind them.
        - id: ch01-b04
          speaker: narrator
          text: >-
            At that news, the pilot turned white. He beat his breast, and his cries made the whole crew tremble.
        - id: ch01-b05
          speaker: pilot
          text: >-
            Oh, sir, we are lost. We are lost!
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: >-
            Once he had recovered enough to speak, Agib asked what frightened him so badly. The pilot explained that the storm had swept them far from their course. By noon the next day, they would reach that dark mass. It was the famous Black Mountain.
        - id: ch01-b07
          speaker: pilot
          text: >-
            The mountain is made of adamant. It draws every piece of iron toward it, even the nails in our ships. As we come closer, the pull will grow stronger. All the iron and nails will tear free and fly to the mountain. Then our ships will fall apart and sink with everyone aboard. So much iron has gathered on the side facing the sea that the whole slope looks black.
        - id: ch01-b08
          speaker: pilot
          text: >-
            Its sides are terribly steep and broken. But a brass dome stands at the summit, supported by pillars. On top of it is a brass horse and rider. The rider wears a lead breastplate marked with strange signs. People say that ships will keep dying at the foot of the mountain as long as that statue remains above it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The pilot began to weep again. The sailors believed their last hour had come, and each made a will in favor of one of his companions.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At noon the following day, just as the pilot had foretold, the fleet drew close to the Black Mountain. The pull became irresistible. Every nail and piece of iron ripped out of the ships, flew through the air, and struck the mountain with a dreadful crash. With nothing left to hold their timbers together, the vessels broke apart. A moment later, they sank to the bottom with their crews.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Agib alone caught hold of a floating plank. The wind carried him to shore without so much as a scratch. He landed at the foot of a stairway that climbed straight up the mountain. There was nowhere else to place a foot. The steps themselves were so narrow and steep that even a light breeze might have blown him into the sea.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At the summit, he found the brass dome and the mounted statue exactly as the pilot had described them. He was too exhausted to do more than glance at them. He threw himself down beneath the dome and fell asleep at once.
        - id: ch01-b13
          speaker: narrator
          text: >-
            An old man came to him in a dream and gave him careful instructions.
        - id: ch01-b14
          speaker: dream_old_man
          text: >-
            Listen, Agib. When you wake, dig into the ground beneath your feet. You will find a brass bow and three lead arrows. Shoot them at the statue. The rider will fall into the sea, but the horse will land beside you. Bury it where you found the bow and arrows.
        - id: ch01-b15
          speaker: dream_old_man
          text: >-
            Then the sea will rise over the mountain. You will see a metal man sitting in a boat, with an oar in each hand. Get into the boat and let him carry you away. But if you wish to see your kingdom again, do not speak the name of Allah.
        - id: ch01-b16
          speaker: narrator
          text: >-
            After giving these instructions, the vision vanished. Agib woke feeling greatly comforted. He sprang up and dug beneath his feet. There, just as the old man had promised, he found the brass bow and three lead arrows. He aimed them at the statue. The first two did not bring it down, but his third shot struck true. The brass rider crashed into the sea, while the horse fell beside him.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At once the water began to rise. Agib barely had time to bury the horse before the boat reached him. He climbed in without a word. The metal man pushed away and rowed steadily for nine days. Then land appeared on the horizon.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The sight filled Agib with such joy that he forgot the old man's warning.
        - id: ch01-b19
          speaker: agib
          text: >-
            Allah be praised! Allah be praised!
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: >-
            The words had hardly left his mouth when the boat and the metal man sank beneath him. Agib was left floating on the surface. All that day and through the next night, he took turns swimming and floating, struggling toward the nearest land.
        - id: ch01-b21
          speaker: narrator
          text: >-
            At last his strength failed, and he gave himself up for lost. Just then, the wind rose. A huge wave swept him onto a flat shore. Once he was safe, he spread his clothes in the sun to dry and lay down on the warm ground to rest.
    - id: ch02
      title: The Boy Beneath the Island
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next morning, Agib dressed and explored the island. Fruit trees grew everywhere, and streams watered the land, but he saw no other person. The mainland he hoped to reach was still far away. Before he could lose heart, a ship headed straight for the island. Unsure whether friends or enemies were aboard, he hid among the thick branches of a tree.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The ship entered a creek. Ten slaves came ashore with spades and pickaxes. They dug in the middle of the island until they uncovered what looked like a trapdoor. After several trips to carry down furniture and provisions, they returned with an old man who was leading a handsome boy of fourteen or fifteen.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Everyone went below. A few minutes later, the old man and the slaves came back without the boy. They closed the trapdoor, covered it with earth, boarded the ship, and sailed away.
        - id: ch02-b04
          speaker: narrator
          text: >-
            When the ship was out of sight, Agib climbed down and went to the buried entrance. Beneath the earth, he found a large stone with a ring in its center. He lifted it away and discovered stone steps leading to a richly furnished room lit by tapers. The boy sat on a pile of tapestry-covered cushions. At the sight of a stranger, he looked up in alarm.
        - id: ch02-b05
          speaker: agib
          text: >-
            Please don't be afraid, sir, whoever you are. I am a king and a king's son, and I mean you no harm. Perhaps I have even been sent to rescue you from this tomb where you were buried alive.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Agib's words calmed the young man. He explained that the reason for his hiding place was stranger than Agib could imagine.
        - id: ch02-b07
          speaker: merchant_son
          text: >-
            My father is a rich merchant. He owns land and many ships, and he trades in precious stones. For years, he grieved because he had no child to inherit his wealth. Then he dreamed that a son would be born to him the following year, and that is exactly what happened.
        - id: ch02-b08
          speaker: merchant_son
          text: >-
            He asked every wise man in the kingdom what my future would be. They all gave him the same answer. I would live happily until I was fifteen. Then I would face a terrible danger that I was unlikely to escape. If I survived it, I would live to a great old age.
        - id: ch02-b09
          speaker: merchant_son
          text: >-
            They also warned him about the statue of the brass horse on the mountain of adamant. When Agib, son of Cassib, threw that statue into the sea, his son would die by Agib's hand fifty days later.
        - id: ch02-b10
          speaker: merchant_son
          text: >-
            The prophecy filled my father with sorrow, but he still took great care with my education. I turned fifteen a short while ago. Yesterday, news came that the brass statue had been thrown into the sea ten days earlier. Father immediately brought me to this underground room, which he had built for this purpose. He promised to return after forty days. I am not afraid. Prince Agib would hardly come here looking for me.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Agib listened with a secret smile. The thought that he could ever wish to kill this harmless boy seemed absurd. He quickly promised the young man both friendship and protection. He would stay with him through the remaining days and guard him from harm. In return, Agib asked the boy to take him home aboard his father's ship. But he carefully hid one fact. He never said that he was the very Agib named in the prophecy.
        - id: ch02-b12
          speaker: narrator
          text: >-
            They spent the day talking, and Agib found the boy clever and well educated. He became the boy's servant. He held the basin and water while the young man washed, prepared dinner, and set the table. The boy soon grew fond of him. For thirty-nine days, their life underground was as pleasant as it could be.
        - id: ch02-b13
          speaker: narrator
          text: >-
            On the morning of the fortieth day, the young man woke and joyfully gave thanks. He believed the danger had passed.
        - id: ch02-b14
          speaker: merchant_son
          text: >-
            My father may arrive at any moment. Please heat some water for me. I want to bathe, change my clothes, and be ready to welcome him.
          emotion: happy
        - id: ch02-b15
          speaker: narrator
          text: >-
            Agib brought the water, then washed and rubbed him. The boy lay down and slept for a little while. When he woke again, he asked for a melon and some sugar to refresh himself.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Agib chose a fine melon from those that remained, but he could find no knife.
        - id: ch02-b17
          speaker: merchant_son
          text: >-
            Look on the ledge above my head. I think you'll find one there.
        - id: ch02-b18
          speaker: narrator
          text: >-
            The knife was high above him, and Agib had trouble reaching it. His foot caught in the bed covering. He slipped and fell directly onto the young man. The knife went straight into the boy's heart.
        - id: ch02-b19
          speaker: narrator
          text: >-
            Agib screamed at the dreadful sight. The accident had fulfilled the prophecy at the very moment when both of them believed the danger was over. In grief and pain, he threw himself to the floor, tore his clothes, and pulled at his hair. Then fear seized him. The unhappy father would see only his dead son and would surely punish Agib as a murderer. Agib lifted the great stone over the stairs, left the underground room, and carefully covered the entrance until everything looked as it had before.
        - id: ch02-b20
          speaker: narrator
          text: >-
            He had barely finished when he saw the ship returning. He believed no one would accept his claim of innocence, so once again he hid in the branches of a nearby tree.
        - id: ch02-b21
          speaker: narrator
          text: >-
            As soon as the ship reached land, the old man and his slaves rowed ashore and hurried to the underground chamber. When they noticed the disturbed earth, they stopped, and the color left their faces. They went down in silence and called the boy's name.
        - id: ch02-b22
          speaker: narrator
          text: >-
            For a moment, Agib heard nothing. Then a terrible scream split the air. The slaves rushed back up carrying the old man, who had fainted from grief. They laid him beneath the very tree where Agib was hiding and struggled for a long time to revive him.
        - id: ch02-b23
          speaker: narrator
          text: >-
            When the father finally opened his eyes, the slaves left him and dug a grave. They laid the young man's body inside and covered it with earth. Then they carried the remaining furniture from the chamber to the ship. They wove a litter from branches, placed the old man upon it, and bore him away. The ship raised its sails and returned to sea.
    - id: ch03
      title: The Castle of Red Copper
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Agib was alone once more. For a whole month, he walked around the island each day, searching for some way to escape. Then he noticed that his prison seemed larger than before and the mainland looked closer. His heart began to beat faster. He watched carefully, hardly daring to believe it. Soon only a narrow stream separated the island from the shore.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Agib crossed the stream safely, but his escape was not over. He still had a long distance to cross over mud and loose sand before he reached firm ground. He was exhausted when he saw what looked like a fire far ahead. Hoping it meant shelter, he hurried toward it as fast as he could. After several hard miles, he discovered that the blaze was really the shine of a castle made from red copper. He stood before it in amazement. It was the most wonderful building he had ever seen.
        - id: ch03-b03
          speaker: narrator
          text: >-
            While Agib was staring, a tall old man approached with ten handsome young men. Every one of them was blind in the right eye. Ten men walking together with the same missing eye seemed almost as strange as the copper castle itself.
        - id: ch03-b04
          speaker: narrator
          text: >-
            They welcomed Agib warmly and asked what had brought him there. He told them that his story was long, but he would gladly share it if they sat down to listen. When the tale was finished, the young men invited him into the castle, and Agib happily went with them.
        - id: ch03-b05
          speaker: narrator
          text: >-
            They passed through room after room until they reached a large hall. Ten small blue sofas stood there, one for each young man to use as both a chair and a bed. Another sofa in the center belonged to the old man. Since each sofa held only one person, they asked Agib to sit on the carpet. They also warned him not to question anything he might see.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The old man soon brought supper. Agib ate eagerly, for he was very hungry. One of the young men asked to hear his remarkable story again. After Agib had repeated it, the young men told the old man to perform his duty, because it was late and they wished to sleep.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The old man went to a cupboard and returned with ten basins covered in blue cloth. He placed a basin and a lighted taper before each young man. Beneath the covers, Agib saw ashes, coal dust, and lampblack.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The young men mixed the dark powders and rubbed them over their heads and faces. Then they wept and beat their breasts, all crying the same words.
        - id: ch03-b09
          speakers: [one_eyed_prince, second_one_eyed_prince, third_one_eyed_prince, fourth_one_eyed_prince]
          ensemble: chorus
          text: >-
            This is the fruit of idleness and of our wicked lives.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The ceremony continued for nearly the whole night. When it ended, the young men washed carefully, changed into clean clothes, and lay down to sleep.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Agib had kept silent, though curiosity burned inside him. The next day, while they were out walking, he could bear it no longer.
        - id: ch03-b12
          speaker: agib
          text: >-
            Gentlemen, I know you told me not to ask questions, but I cannot stay silent any longer. You are clearly sensible men, yet only madmen would behave as you did last night. Whatever happens to me, I must know why you blacken your faces and why every one of you is blind in the right eye.
        - id: ch03-b13
          speaker: narrator
          text: >-
            They answered only that it was none of his business and advised him to say no more. For the rest of the day, they spoke about other things. That night, however, the same strange ceremony took place. Again Agib begged them to explain it.
        - id: ch03-b14
          speaker: one_eyed_prince
          text: >-
            We refused for your own good. We hoped to save you from the fate that struck us. But if you are determined to share it, we will not keep you waiting any longer.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Agib said he would accept any consequence and take the result upon his own head. His curiosity had to be satisfied. The young man warned him once more. Even after Agib lost his eye, he would not be allowed to remain in the copper castle. There were exactly ten places, and their number was already complete. Agib answered that he would be deeply sorry to leave such honorable companions. Even so, the certainty of losing their company could not turn him from his decision.
        - id: ch03-b16
          speaker: narrator
          text: >-
            When the ten hosts saw that he would not yield, they killed a sheep and handed Agib a knife. One of them explained what must happen next.
        - id: ch03-b17
          speaker: one_eyed_prince
          text: >-
            We will sew you inside this sheepskin and leave you here. Soon a monstrous bird called a roc will see what looks like a sheep. It will seize you and carry you into the sky. Do not be afraid. It will set you down safely on a mountaintop.
        - id: ch03-b18
          speaker: one_eyed_prince
          text: >-
            Once you touch the ground, use the knife to cut through the skin and throw it off. The roc will be frightened when it sees you and will fly away. Then walk until you find a castle covered in golden plates and studded with jewels. Its gate is always open, so go straight inside.
        - id: ch03-b19
          speaker: one_eyed_prince
          text: >-
            Do not ask what we found there. You will discover that for yourself. We can tell you only this. The place cost each of us his right eye, and it brought upon us the penance you see every night.
        - id: ch03-b20
          speaker: narrator
          text: >-
            The young men sewed the sheepskin around Agib and returned to the hall. A few minutes later, the roc appeared. Its enormous claws lifted him to the mountaintop as lightly as a feather. That great white bird was so strong that it had even been known to carry an elephant to its nest in the hills.
        - id: ch03-b21
          speaker: narrator
          text: >-
            The instant his feet touched the ground, Agib drew the knife and cut the threads. When the roc saw a man standing there in ordinary clothes, it spread its wings and flew away in fear. Agib set out at once to find the golden castle.
    - id: ch04
      title: The Forty Princesses
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After wandering for half a day, Agib found the castle. Nothing could have prepared him for such splendor. Beyond its gate lay a square courtyard with a hundred doors. Ninety-nine were made from rare woods, and one was made of gold. Through the open doors, he glimpsed magnificent gardens and storehouses filled with riches.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Agib entered one of the open doors and stepped into a vast hall. Forty beautiful young ladies in magnificent clothes were resting there. The moment they saw him, they rose and welcomed him. They insisted that he sit above them, though he felt that the proper place for him was at their feet.
        - id: ch04-b03
          speaker: narrator
          text: >-
            One lady brought him splendid clothes. Another poured scented water over his hands. The others prepared refreshments. After he had eaten delicate food and drunk rare wine, they gathered around and asked to hear every one of his adventures.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Night had fallen by the time Agib finished his story. The ladies lit so many tapers that the castle seemed almost brighter than day. They served dried fruits and sweetmeats for supper. Some of them sang, while others danced. Agib enjoyed himself so much that he forgot the passing hours.
        - id: ch04-b05
          speaker: princess
          text: >-
            It is midnight now, and you must be tired. Come with me. I will show you the room we have prepared for you.
        - id: ch04-b06
          speaker: narrator
          text: >-
            She led him to his room, wished him good night, and left him to sleep.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The next thirty-nine days passed much like the first. The princesses filled each day with generous meals, music, dancing, and pleasant company, while Agib told them more of his life. Then one morning, as usual, the ladies came into his room to ask how he had slept. But their faces had completely changed. Instead of greeting him with smiles, all forty princesses were in floods of tears.
        - id: ch04-b08
          speaker: princess
          text: >-
            Prince, we must leave you. We have never found it so painful to part from a friend. We may never see you again. But if you can control yourself, perhaps we may still hope to meet once more.
          emotion: sad
        - id: ch04-b09
          speaker: agib
          text: >-
            Ladies, what do these strange words mean? Please tell me why you must go.
        - id: ch04-b10
          speaker: princess
          text: >-
            We are all princesses, each one a king's daughter. We live together in this castle as you have seen. At the end of every year, secret duties call us away for forty days, and the time has come for us to leave.
        - id: ch04-b11
          speaker: princess
          text: >-
            We will give you our keys so you can enjoy the castle while we are gone. We ask only one thing. Do not open the Golden Door. If you value your peace and the happiness of your life, leave it locked. Once that door is opened, we must say farewell forever.
        - id: ch04-b12
          speaker: narrator
          text: >-
            With tears in his eyes, Agib promised to be careful. The princesses embraced him tenderly and departed.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Each day, Agib opened two or three new doors. There were so many wonders behind them that he could not grow bored, even though he missed the princesses. One door revealed an orchard whose fruits were far larger than those in his father's garden.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Another opened onto a courtyard filled with roses, jasmine, daffodils, hyacinths, anemones, and countless flowers he could not name. Elsewhere he found an aviary alive with every kind of singing bird. Another room held heaps of precious stones. Whatever lay behind a door was perfect in its own way.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Thirty-nine days passed faster than Agib could have imagined. The princesses would return the following morning, and he had only one day left to wait. But he had now explored every garden, treasury, and chamber except the room behind the Golden Door. There was nothing new to occupy him. The single forbidden place remained in his thoughts, more tempting because everything else had been seen.
    - id: ch05
      title: The Golden Door
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Agib stood before the forbidden door for a long time, gazing at its beauty. Then he found a way to argue against his own conscience. Opening the door did not mean he had to enter. He could remain outside and merely look at whatever wonder was hidden beyond it.
        - id: ch05-b02
          speaker: narrator
          text: >-
            He turned the key. A sweet scent rushed out, so powerful that he fainted across the threshold. Even that did not stop him. As soon as he recovered, he stepped outside for a few moments to clear his head. Then he boldly entered the room.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The chamber was large and vaulted. Tapers burned in golden candlesticks, and the air was heavy with the scent of aloes and ambergris. Lamps of gold and silver hung from the ceiling. Rare objects made with extraordinary skill lay heaped all around him. Yet Agib gave those treasures hardly a glance. A great black horse stood in one corner, finer and more perfectly formed than any animal he had ever seen.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The horse wore a massive golden saddle and bridle, both worked with great skill. One side of its trough held clean barley and sesame. The other held rose water. Agib led the horse outside, climbed onto its back, and shook the reins. It did not move.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Agib picked up a switch from the stable and touched the horse lightly. At once, the animal spread wings that Agib had not noticed. It flew straight into the sky with him. After climbing to an enormous height, it plunged toward the earth and landed on the terrace of another castle.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The landing threw Agib violently from the saddle. As the horse cast him off, its tail struck his face and knocked out his right eye.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Half stunned, Agib struggled to his feet. Now he understood what had happened to the ten young men. He watched the horse rise into the clouds, then left the terrace and wandered on. Soon he entered a hall with ten blue sofas along the wall. It was the very hall from which the roc had carried him away.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The ten young men were not there at first. Before long, they entered with the old man. They welcomed Agib kindly and mourned his injury, though it was exactly what they had expected.
        - id: ch05-b09
          speaker: one_eyed_prince
          text: >-
            Everything that happened to you happened to us as well. We would still be living in happiness if we had not opened the Golden Door while the princesses were away. You were no wiser than we were, and now you have suffered the same punishment.
        - id: ch05-b10
          speaker: one_eyed_prince
          text: >-
            We would gladly let you stay and perform our nightly penance with us, but we already warned you that our number cannot grow. You must leave this place and travel to the court of Bagdad. There you will meet the person who can decide your fate.
        - id: ch05-b11
          speaker: narrator
          text: >-
            They showed Agib the road he should follow, and he left them behind.
    - id: ch06
      title: The Third Calender's Journey
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Agib followed the road the young men had described. Along the way, he had his beard and eyebrows shaved and exchanged a prince's appearance for the clothing of a wandering Calender. The journey was long and difficult. At last, on the very evening when the three strangers entered Zobeida's house, he reached the city of Bagdad.
        - id: ch06-b02
          speaker: agib
          text: >-
            At the gate, I met the other two Calenders. They were strangers, just as I was. Each of us wondered to see that the others had also lost the right eye, but we had no time to tell one another how it happened. We could only come here and ask for the kindness you have so generously shown us.
        - id: ch06-b03
          speaker: narrator
          text: >-
            With those words, the Third Calender finished his story. Then it was Zobeida's turn to speak. She addressed all three Calenders.
        - id: ch06-b04
          speaker: zobeida
          text: >-
            Go wherever you please. I pardon all three of you, but you must leave this house at once.
