audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    calender_3:
      display_name: 第三位卡兰德
      tts:
        delivery: 坦率而富于感情，讲到自己的莽撞时带着悔意
        timbre: 清朗沉稳，略带沧桑
        pace: 从容，遇到危急场面时加快
        pitch: 中低音
    pilot:
      display_name: 领航员
      tts:
        delivery: 老练谨慎，面对灾难时惊恐而绝望
        timbre: 粗粝低沉
        pace: 平稳，惊惧时急促
        pitch: 低音
    vision_old_man:
      display_name: 梦中老人
      tts:
        delivery: 神秘庄严，告诫时清楚有力
        timbre: 苍老浑厚，带有回响感
        pace: 缓慢
        pitch: 低音
    merchant_son:
      display_name: 商人之子
      tts:
        delivery: 文雅温和，谈及预言时略带不安
        timbre: 清澈稚嫩
        pace: 平稳
        pitch: 中高音
    young_man_1:
      display_name: 独眼青年甲
      tts:
        delivery: 诚恳克制，劝告时严肃
        timbre: 清晰温厚
        pace: 平稳
        pitch: 中音
    young_man_2:
      display_name: 独眼青年乙
      tts:
        delivery: 沉着寡言，齐声说话时整齐有力
        timbre: 明亮坚实
        pace: 平稳
        pitch: 中音
    young_man_3:
      display_name: 独眼青年丙
      tts:
        delivery: 郑重内敛，齐声说话时带着悔恨
        timbre: 柔和略沙哑
        pace: 稍慢
        pitch: 中低音
    princess_1:
      display_name: 城堡公主甲
      tts:
        delivery: 热情端庄，告别时忧伤而恳切
        timbre: 清亮柔美
        pace: 舒缓
        pitch: 中高音
    princess_2:
      display_name: 城堡公主乙
      tts:
        delivery: 温柔优雅，齐声说话时真挚自然
        timbre: 柔和明亮
        pace: 舒缓
        pitch: 中高音
    princess_3:
      display_name: 城堡公主丙
      tts:
        delivery: 从容亲切，齐声说话时带着依依不舍
        timbre: 清澈轻柔
        pace: 平稳
        pitch: 中音
    zobeida:
      display_name: 祖贝达
      tts:
        delivery: 端庄自持，发号施令时冷峻有力
        timbre: 丰满清亮，带有威严
        pace: 从容，动怒时字句分明
        pitch: 中低音
  chapters:
    - id: ch01
      title: 黑山沉船
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第三位卡兰德说，他的遭遇与两位朋友不同。那两人失去右眼是命运作弄，他却是被自己的愚蠢害了。
        - id: ch01-b02
          speaker: calender_3
          text: |-
            我叫阿吉卜，是卡西卜国王的儿子。父王统治着辽阔的国土，国都坐落在一座举世闻名的繁华海港。我继承王位后，头一件事就是巡视大陆各省，随后又乘船走遍近海的许多岛屿，希望得到各地臣民的爱戴。几次航行下来，我越来越迷恋大海，便命人赶紧备好一支大船队，带我探索远方的海域。

            船只全部装备妥当，我便登船出发。起初四十天，风向和天气都很顺。第四十一天夜里，一场可怕的风暴突然卷来。船队在海上被吹来吹去，足足迷航十天，领航员终于承认，他再也辨不清方位。一个水手爬上桅顶眺望，回来只说，周围除了海和天，什么也没有，只在船尾远处看见一大片浓黑的影子。
        - id: ch01-b03
          speaker: pilot
          text: |-
            陛下，我们完了，真的完了！船队早已远远偏离航道。明天中午，我们就会靠近那片黑影。那正是闻名天下的黑山，整座山都是磁石，会把船上的铁器和铁钉全吸过去。越靠近，吸力越强。最后铁钉会脱船飞上山壁，船身散架，所有人都沉进海底。山靠海的一面，就是被无数铁器染得这样黑。
          emotion: fearful
        - id: ch01-b04
          speaker: pilot
          text: |-
            黑山的四面全是崎岖绝壁，顶上却有一座铜柱托起的圆顶。圆顶上立着一匹铜马，马背上坐着骑士。骑士的铅胸甲刻满极其奇怪的符号和图形。只要这尊像还在那里，船只就会不断在山脚沉没。
          emotion: fearful
        - id: ch01-b05
          speaker: calender_3
          text: |-
            领航员说完又哭起来。水手们虽然还不知道该如何逃生，却已经认定死期到了，纷纷留下遗言，把自己的东西托付给同伴。第二天中午，我们果然来到黑山近旁。大家亲眼看见船上所有铁器和铁钉一齐飞出去，带着骇人的巨响撞上山壁。失去铁钉的船板再也连不住，转眼之间，一艘艘船散了架，连船员一起沉入海底。只有我及时抓住一块浮木，被风送到岸边，身上竟连一道划伤也没有。

            面前正好有一列石阶通向山顶，我自然喜出望外。山脚左右连一寸落脚处也没有，石阶本身又窄又陡，哪怕吹来一点微风，我也会落进海里。我好不容易爬到顶上，看见领航员说过的铜圆顶和雕像。那时我已经累得睁不开眼，只看了几下，就倒在圆顶下面睡着了。
        - id: ch01-b06
          speaker: vision_old_man
          text: |-
            阿吉卜，听清楚。醒来后挖开脚下的土，你会找到一张铜弓和三支铅箭。用箭去射雕像，骑士会掉进海里，铜马却会落在你身旁。你要把铜马埋回取出弓箭的地方。随后海水会升起，淹没整座山。水上将有一个金属人坐船而来，双手各拿一支桨。上船让他带你走。可你若想再见自己的王国，千万不要说出阿拉之名。
        - id: ch01-b07
          speaker: calender_3
          text: |-
            老人说完便从梦中消失，我醒来后心里踏实多了。我立刻跳起来，照他说的地方挖出铜弓和三支铅箭。第三箭终于射中，铜骑士轰然坠海，铜马落到我的身边，海水也马上飞快上涨。我几乎来不及把铜马埋回原处，小船已经来到眼前。我默默上船坐好。金属人双手执桨，带我离开黑山，一刻不停地划了九天。第九天，我终于看见陆地出现在天边。狂喜之下，我把老人的警告全忘了。
        - id: ch01-b08
          speaker: calender_3
          text: |-
            赞美阿拉！赞美阿拉！
          emotion: happy
        - id: ch01-b09
          speaker: calender_3
          text: |-
            我的话还没说完，小船和金属人便从身下沉了下去，只留我一个人漂在海面。我游一阵，实在累了就仰身漂一阵，整整一天一夜都在尽力朝最近的陆地挪动。后来气力一点点耗尽，我认定这次必死无疑。就在这时，海上忽然起风，一个巨浪把我抛上平坦的岸边。我挣扎着爬到安全处，赶紧脱下湿透的衣服，摊开晒在太阳下，自己则倒在暖热的地面上休息。
    - id: ch02
      title: 地下密室的预言
      blocks:
        - id: ch02-b01
          speaker: calender_3
          text: |-
            第二天早晨，我穿好已经晒干的衣服，开始察看小岛。岛上似乎除了我再没有别人，果树和溪流倒是随处可见，可我盼望抵达的大陆仍远得无法靠自己过去。还没来得及灰心，我便看见一艘船直奔小岛而来。来人是敌是友，我无法判断，只好藏进一棵大树的浓密枝叶里。

            船驶进小湾，十名奴隶带着铁锹和鹤嘴锄上岸。他们在岛中央挖开一扇活门，几次从船上搬来家具和食物。最后，一位老人领着一个十四五岁的漂亮少年走来。众人下到门里，几分钟后重新出来，少年却被留在下面。他们盖好活门，覆回泥土，便登船离去。
        - id: ch02-b02
          speaker: calender_3
          text: |-
            船一走远，我就爬下树，走到少年被藏起来的地方，亲手挖开那片泥土。下面有块带铁环的大石，移开以后，露出一列通往地下的石阶。尽头是一间烛火明亮、陈设华美的宽敞房间。少年坐在一堆铺着织毯的软垫上。他抬头看见陌生人在这样的地方突然出现，顿时又惊又怕。
        - id: ch02-b03
          speaker: calender_3
          text: |-
            阁下，别害怕。不管你是谁，我都不会伤害你。我是一位国王，也是一位国王的儿子。也许上天正是派我来把你从这座活坟里救出去的。
        - id: ch02-b04
          speaker: merchant_son
          text: |-
            王子殿下，我被藏在这里的缘由实在离奇。父亲是个富商，有许多土地和船只，还经营很大的宝石生意。可他始终没有孩子继承家业，为此伤心不已。

            后来，他梦见第二年会得到一个儿子，事情果真应验。他请全国贤者占卜我的命运，所有人给出的答案都一样。我会平安活到十五岁，随后遭遇一场几乎逃不过的大难。要是能躲过去，便会长寿。贤者们还说，只要卡西卜之子阿吉卜把磁石山顶的铜马像投入海中，五十天后，我就会死在他手里。
        - id: ch02-b05
          speaker: merchant_son
          text: |-
            这道预言让父亲从此再也没有真正快活过，不过他仍旧悉心教养我。不久前，我刚满十五岁。昨天，父亲听说铜像已经在十天前坠海，马上把我送进这间专门修建的密室，并答应四十天一过就来接我。我自己并不害怕，阿吉卜王子总不会特意跑到这里来找我。
        - id: ch02-b06
          speaker: calender_3
          text: |-
            我听得暗暗发笑。这样一个无辜少年，我怎么可能想要杀他？我赶紧安慰他，答应与他做朋友，还要保护他的安全，只请他父亲来接人时，也让我乘船回到自己的国家。当然，我格外小心，绝口没说，自己就是他预言中害怕的阿吉卜。

            那一天，我们聊了许多事。我发现他聪明机敏，也很有学识。我像仆人一样照料他，洗漱时端盆送水，还替他准备饭菜。他很快便喜欢上我。此后三十九天，我们住在地下，日子竟过得十分愉快。
        - id: ch02-b07
          speaker: merchant_son
          text: |-
            父亲随时都可能到了。请替我备一盆热水吧，我要洗澡换衣，好迎接他。
          emotion: happy
        - id: ch02-b08
          speaker: calender_3
          text: |-
            这已经是第四十天早晨。少年醒来，欢喜地感谢上天，因为危险似乎终于过去了。我依言取水，替他洗浴擦身。后来他又睡了一小会儿，醒来便请我拿甜瓜和糖给他吃，好恢复精神。

            我挑好甜瓜，却怎么也找不到刀。
        - id: ch02-b09
          speaker: merchant_son
          text: |-
            看看我头顶的檐饰吧，我想那里放着一把刀。
        - id: ch02-b10
          speaker: calender_3
          text: |-
            刀放得太高，我踮起脚，费了好大劲才把它拿下来。偏偏就在这时，我的脚被床罩绊住。整个人一下滑倒，直直摔向躺着的少年，手里的刀也跟着落下，刀锋当场刺进他的心脏。

            眼见这场惨祸，我失声尖叫，扑在地上撕扯衣服和头发。可我又怕那位不幸的父亲把我当成凶手，只得逃出密室，把入口照原样封好。才做完，我就看见那艘船驶向小岛。申辩不会有人相信，我只好再次藏进树上。
        - id: ch02-b11
          speaker: calender_3
          text: |-
            船一靠岸，老人和奴隶便乘小艇赶来。他们快步走向入口，一看泥土动过，全都停住脚步，脸色大变。众人默默走下石阶，呼唤少年的名字。片刻后，一声惨叫撕破长空。奴隶们抬着昏死过去的老人出来，把他放在我藏身的树下，用尽办法救了很久，他才终于苏醒。随后，奴隶们挖好坟墓，把少年的遗体放进去，填土安葬。他们又把地下剩余的家具全搬回船上，折下树枝编成担架，将老人抬上船，扬帆离去。
    - id: ch03
      title: 红铜城堡
      blocks:
        - id: ch03-b01
          speaker: calender_3
          text: |-
            我再次孤身留在岛上。整整一个月，每天都在岛上来回走动，一遍遍寻找逃生的机会，却始终没有找到。后来，我忽然觉得这座困住我的小岛好像变大了，大陆也近了。这个念头好得叫人不敢相信，我的心怦怦直跳。再仔细观察一阵，便没有疑问了。海水果然越来越浅，最后只剩下一道小溪似的水面。我渡到对岸，又在泥泞和沙地里走了很远，才终于踏上干燥的土地。

            我累得筋疲力尽时，远处出现一座红铜城堡，初看简直像一团烈火。我又跋涉几英里，终于站到城堡前，惊讶地望着这座平生未见的奇妙建筑。一位高大的老人朝我走来，身旁跟着十名英俊青年。他们竟然全都瞎了右眼。
        - id: ch03-b02
          speaker: calender_3
          text: |-
            十个人走在一起，又个个右眼失明，这场面和红铜城堡一样少见。我还在暗自猜测，他们已经热情地问候我，想知道我怎么来到这里。我把自己的经历说了一遍，他们便邀请我进入城堡。

            我们穿过一间又一间屋子，多得仿佛永远也走不到尽头，最后才来到一座大厅。墙边有十张蓝色小榻，供青年们坐卧，中央另有一张属于老人。每张都只能坐一个人，所以他们让我坐在地毯上，还再三嘱咐，无论看见什么都不要问。
        - id: ch03-b03
          speaker: calender_3
          text: |-
            过了一会儿，老人起身端来晚餐。我饿得厉害，吃得十分畅快。一名青年又请我讲了一遍故事，因为刚才的经历让他们每个人都很惊讶。等我讲完，夜已经深了，青年们说大家该睡了，叫老人去“履行职责”。老人随即走到壁橱前，从里面拿出十只盖着蓝布的盆，分别摆到十名青年面前，每只盆旁还点了一支蜡烛。

            揭开蓝布，我才发现盆里装着灰烬、煤屑和灯烟。青年们把三样东西混在一起，从头到脸涂得一片漆黑，随后一面哭，一面捶打胸膛。
        - id: ch03-b04
          speakers: [young_man_1, young_man_2, young_man_3]
          ensemble: chorus
          text: |-
            这就是我们游手好闲、作恶度日结出的果实！
          emotion: sad
        - id: ch03-b05
          speaker: calender_3
          text: |-
            这场仪式持续了几乎整夜。结束以后，他们仔细洗净身体，换好衣服，才躺下睡觉。我虽然好奇得浑身难受，还是忍住没问。第二天出门散步时，我终于再也憋不住了。
        - id: ch03-b06
          speaker: calender_3
          text: |-
            诸位，请原谅我不能再守约。你们并不缺少智慧，却做着只有疯子才会做的事。不管会有什么后果，我都非问不可。你们为什么把脸涂黑？又为什么每个人都瞎了右眼？
        - id: ch03-b07
          speaker: calender_3
          text: |-
            他们只说事情与我无关，最好不要再问。白天，我们谈了别的话题。夜里，同样的仪式又上演了，我便苦苦恳求，要他们说出真相。
        - id: ch03-b08
          speaker: young_man_1
          text: |-
            我们不肯说，完全是为你好，想让你避开我们不幸的命运。可你非要落得和我们一样，我们也不再拖延。
        - id: ch03-b09
          speaker: calender_3
          text: |-
            我说，不管后果是什么，我都要满足好奇心，一切由自己承担。青年再次警告我，说这份好奇必会让我失去一只眼睛。即使如此，我也不能回来住在这里，因为他们的人数已经满了，再容不下别人。可我回答，与这样正直的朋友分别固然令人难过，还是改变不了我的主意。无论前面等着什么，我都情愿自己承受。
        - id: ch03-b10
          speaker: young_man_1
          text: |-
            我们会把你缝进一张羊皮，再把你留在外面。空中会来一只名叫大鹏的巨鸟，把你当成羊抓上天空。别害怕，它会把你平安放在山顶。双脚一落地，就用这把刀割开羊皮。大鹏看见你，自会受惊飞走。

            你只管向前走，直到看见一座覆盖金板、镶满珠宝的城堡。城门永远敞开，你大胆进去就是。别问我们在那里看见什么，又经历了什么，你亲自进去便会知道。我们只能告诉你，那地方让我们每人失去右眼，也使我们夜夜受罚。
        - id: ch03-b11
          speaker: calender_3
          text: |-
            他们先杀了一只羊，把刀交给我，然后费力将羊皮缝到我身上，自己退回大厅。几分钟后，大鹏果然来了。它用巨爪把我抓到山顶，轻得像抓一根羽毛。这种白色巨鸟力大无穷，据说连大象也能抓回山里的巢穴。

            双脚一着地，我便割开缝线。大鹏看见羊皮里钻出一个穿着衣服的人，立刻吓得飞走。我也就此动身寻找那座城堡。
    - id: ch04
      title: 四十位公主
      blocks:
        - id: ch04-b01
          speaker: calender_3
          text: |-
            我在山上游荡了半天，终于找到城堡。它的华丽远远超出我的想象。大门里面是一座方形庭院，四周足有一百扇门，九十九扇用各色珍贵木料制成，最后一扇则由黄金铸造。透过每道门，我都能隐约望见绚丽的花园，或堆满奇珍异宝的库房。

            我走进一扇开着的门。宽阔的大厅里斜倚着四十位年轻女子，个个衣饰华贵，美貌无双。她们一见我便起身欢迎，硬请我坐上高位，尽管我觉得自己只配坐在她们脚边。
        - id: ch04-b02
          speakers: [princess_1, princess_2, princess_3]
          ensemble: chorus
          text: |-
            欢迎你来到这里，王子。
          emotion: happy
        - id: ch04-b03
          speaker: calender_3
          text: |-
            她们不只把高位让给我。一位公主又为我拿来华服，另一位在盆中装满香水，亲自浇洗我的双手，其余人则忙着准备茶点。我享用过最精美的食物和最珍贵的美酒，她们便一齐围到身边，请我讲出一路经历的所有奇遇。

            故事说完，夜幕也落了下来。公主们点起数不清的蜡烛，把城堡照得比白昼还亮。我们又吃了果干和蜜饯，有人唱歌，有人跳舞。我快活得忘了时间。直到午夜，一位公主才说我一定累了，把我带到备好的房间，道过晚安，让我独自休息。
        - id: ch04-b04
          speaker: calender_3
          text: |-
            接下来的三十九天，每一天都像第一天那样快乐。可最后一日清晨，公主们照常来问我睡得好不好，脸上却没有笑容，人人泪流不止。
        - id: ch04-b05
          speakers: [princess_1, princess_2, princess_3]
          ensemble: chorus
          text: |-
            王子，我们必须走了。我们从没这样舍不得一位朋友。也许今后再也见不到你，不过，只要你能管住自己，我们或许还有重逢的一天。
          emotion: sad
        - id: ch04-b06
          speaker: calender_3
          text: |-
            诸位夫人，这些话究竟是什么意思？请告诉我吧。
        - id: ch04-b07
          speaker: princess_1
          text: |-
            我们全是公主，每个人都是国王的女儿。平日里，我们就像你看见的这样，共同住在城堡。可每到年末，都有秘密职责召我们离开四十天。现在时候到了。我们会把全部钥匙留给你，免得你独自在这里无事可做。

            只求你答应一件事。若还珍惜自己的安宁和一生的幸福，千万别打开那扇金门。门只要开一次，我们就必须永远离开你。
          emotion: sad
        - id: ch04-b08
          speaker: calender_3
          text: |-
            我听完也流下眼泪，再三保证自己一定谨慎，绝不会碰那扇金门。她们温柔地拥抱我，一一道别，随后才各自离开。

            每天，我打开两三扇没见过的门。里面的新奇事物多得看不完，我虽然想念那些公主，却根本没有工夫寂寞。有的门后是一座果园，果实比父王花园里的大得多。有的门后是鲜花盛开的庭院，玫瑰、茉莉、水仙、风信子、银莲花之外，还有上千种我叫不出名字的花。有时，我走进养满鸣禽的鸟舍，有时又看见堆满宝石的库房。每一样东西，都是同类中的极品。
    - id: ch05
      title: 禁止开启的金门
      blocks:
        - id: ch05-b01
          speaker: calender_3
          text: |-
            三十九天过得快得出奇。第二天早晨，公主们就要回来了。偏偏所有地方都被我看遍，只剩金门后的房间。我再也找不到别的消遣，便站在禁门前望了很久。它越是美丽，我越想知道里面藏着什么。最后，我竟想出一个自欺欺人的理由。公主们只是不许我开门，可就算打开门，我也不一定非要走进去。只站在外面看一眼，又能有什么关系？

            我明知不该，还是转动了钥匙。门一开，一股奇香猛冲出来。香气虽美，却浓得使我当场昏倒，横在门槛上。这本该是一次警告。可我醒来后，只去外面透了一会儿气，等头脑清醒，又大胆走了进去。
        - id: ch05-b02
          speaker: calender_3
          text: |-
            房内是一座巨大的拱顶大厅。金烛台上亮着蜡烛，沉香和龙涎香的气味弥漫四周，天花板垂着一盏盏金银灯。身边虽堆满精巧绝伦的珍宝，我却几乎没看，因为角落里站着一匹高大的黑马。那是我平生见过最俊美、体形最匀称的骏马。金鞍和金辔雕饰精巧，食槽一边装着干净的大麦和芝麻，另一边盛的竟是玫瑰水。

            我把马牵到外面，跃上马背，抖动缰绳，它却一动不动。我捡起马厩里的一根细鞭，轻轻抽了它一下。鞭子刚落下，黑马便展开一双我先前没发现的翅膀，载着我冲上高空。飞到高得令人眩晕的地方，它又猛冲下来，落在另一座城堡的露台上。着地时，它狠狠把我甩下马鞍，又用尾巴猛击我的脸，就这样打瞎了我的右眼。
        - id: ch05-b03
          speaker: calender_3
          text: |-
            我被这一连串变故弄得头昏眼花，勉强爬起来，望着黑马飞进云层。这时，我想起了十名青年的遭遇，也终于明白他们为什么个个失去右眼。我走下露台，一路漫无目的地游荡，最后来到一座大厅。墙边摆着十张熟悉的蓝色小榻，我立刻认出，这里正是大鹏把我带走的地方。

            十名青年当时不在，很快却与老人一同回来。他们亲切地迎接我，为我的不幸叹息，不过这样的结局早在他们意料之中。
        - id: ch05-b04
          speakers: [young_man_1, young_man_2, young_man_3]
          ensemble: chorus
          text: |-
            你遇到的事情，我们全都经历过。要不是趁公主离开时打开金门，我们现在还在享受那份幸福。你没有比我们更明智，所以也受了同样的惩罚。

            我们愿意接纳你，让你和我们一起苦修，可这里实在不能再添人。离开吧，前往巴格达的宫廷。到了那里，你会遇见能够决定你命运的人。
        - id: ch05-b05
          speaker: calender_3
          text: |-
            他们替我指明道路，我就告辞了。路上，我叫人剃掉胡须和眉毛，换上卡兰德的衣服。经过漫长旅途，我在今晚抵达这座城，并在城门口遇见两位卡兰德兄弟。他们也和我一样，都是异乡人。看见我们三个全瞎了同一只眼睛，彼此都惊讶不已。可我们没有时间详谈共同的苦难，只赶来这里，请求您慷慨赐予我们如今已经得到的恩惠。
    - id: ch06
      title: 祖贝达的裁决
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            第三位卡兰德说完了自己的故事。接下来，轮到祖贝达作出裁决。
        - id: ch06-b02
          speaker: zobeida
          text: |-
            你们想去哪里都可以。我宽恕你们三个，不过，你们必须马上离开这所房子。
