audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    calender_2:
      display_name: 第二位卡兰德
      tts:
        delivery: 郑重坦率，谈及身世时带着神秘感
        timbre: 温厚低沉
        pace: 从容
        pitch: 中低音
    tailor:
      display_name: 裁缝
      tts:
        delivery: 朴实热心，说起危险时谨慎严肃
        timbre: 温和略显沙哑
        pace: 平稳
        pitch: 中音
    princess:
      display_name: 乌木岛公主
      tts:
        delivery: 柔和端庄，受困时忧伤，危急时果断
        timbre: 清澈柔美
        pace: 舒缓，急切时稍快
        pitch: 中高音
    genius:
      display_name: 精灵
      tts:
        delivery: 傲慢暴烈，质问时咄咄逼人
        timbre: 阴沉浑厚
        pace: 缓慢有压迫感，盛怒时加快
        pitch: 低音
    zobeida:
      display_name: 祖贝达
      tts:
        delivery: 端庄自持，发号施令时冷峻有力
        timbre: 丰满清亮，带有威严
        pace: 从容，动怒时字句分明
        pitch: 中低音
  chapters:
    - id: ch01
      title: 王子落难
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第二位卡兰德面对祖贝达，要从自己一生的开端讲起，说明那只右眼究竟如何失去。
        - id: ch01-b02
          speaker: calender_2
          text: |-
            夫人，我还在襁褓中，父王就看出我比同龄孩子聪敏，早早替我安排教育。我学会读写，研读《古兰经》和最出色的注疏，把先知友人传下的圣训牢记在心，也学习历史、诗歌、韵律、地理、年代学和王子应当掌握的户外技艺。不过，我最喜欢的还是阿拉伯书法，很快便胜过老师，连印度都听说了我的名声。
        - id: ch01-b03
          speaker: calender_2
          text: |-
            印度苏丹听说有个年轻王子偏爱书法，很想亲眼见见，便派使臣带着厚礼来到父王宫中，热情邀请我去他的朝廷。父王一心盼望与这位强大的君主交好，也觉得出门远游能磨炼我的举止、开阔眼界，于是欣然答应。没过多久，我就随使臣启程。因为路途遥远，道路又十分难行，我只带了少数随从。可礼数不能少，我仍备下十峰骆驼，把献给苏丹的珍贵礼物全驮在上面。
        - id: ch01-b04
          speaker: calender_2
          text: |-
            走了约一个月，一团尘云突然向我们冲来，里面竟藏着五十名强盗。我们人数还不到他们一半，行动又受骆驼拖累，交战根本没有胜算。大家只能报出身份和去处，想用苏丹与父王的名号把他们吓退。强盗听完只管大笑，说这与他们毫不相干，接着二话不说，凶狠地扑了上来。我已经负伤，仍抵抗到最后。直到使臣和随从全被俘获，我才猛踢马腹，拼命逃走。坐骑肋下有道伤口，狂奔一程便倒地死去。幸而我及时跃下，没有受伤。强盗正忙着为赃物争吵，一时也没有追来。
        - id: ch01-b05
          speaker: calender_2
          text: |-
            我身在一片全然陌生的国土，不敢重回大路，唯恐再次落进强盗手里。好在伤势不重，我勉强包扎妥当，又徒步走完余下的一天。夜里，我在山脚洞穴中安然睡下，晚饭只有路上采来的几枚果子。此后我漫无目的地流浪整整一个月，终于走到一座美丽城市的郊外。溪流弯弯曲曲地穿城而过，那里仿佛永远沐浴在春光里。
        - id: ch01-b06
          speaker: calender_2
          text: |-
            想到终于又能和人来往，我满心欢喜，可一想到别人眼中的自己，喜悦便淡了。脸和双手几乎被太阳晒黑，衣服破成碎布，鞋也烂得不能再穿，早被我丢在路上。我走进城，在一家裁缝铺前停下，询问自己到了什么地方。店主看出我的身份应当远胜于眼前这副落魄模样，便请我坐下。我也把全部遭遇告诉了他。他听得很仔细，可给出的回答非但没有安慰我，反而让我更加忧虑。
        - id: ch01-b07
          speaker: tailor
          text: |-
            这些话千万不能再告诉别人。此地的君主是你父王最大的仇敌。他若知道你落在自己手里，一定高兴极了。
        - id: ch01-b08
          speaker: calender_2
          text: |-
            我谢过他的忠告，答应无论他怎样指点，我都照办。那时我饿得厉害，欣然吃下他端来的食物，又接受好意，住进他家。几天后，旅途造成的疲惫已经消退。裁缝知道，信奉我们宗教的王子照例要学一门手艺或营生，好在厄运中养活自己，便问我有什么谋生本领。我说自己受过语法学家和诗人的教育，而最大的长处是书法。
        - id: ch01-b09
          speaker: tailor
          text: |-
            这些在这里都没有用。听我的，换上短衣，凭你的力气进森林砍柴，再拿到街上卖。这样能养活自己，也能等到时来运转。斧头和绳子由我送你。
        - id: ch01-b10
          speaker: calender_2
          text: |-
            从一个受尽教育的王子变成樵夫，这主意叫我很不好受，可我没有别的路，只能接受。第二天早晨，我跟裁缝介绍的一群穷樵夫进了森林。才到头一天，我砍下的柴便卖到一笔还算可观的钱。此后我的手艺越来越熟练，没过多久，挣来的钱已经足够偿还裁缝借给我的一切。
    - id: ch02
      title: 地下宫殿
      blocks:
        - id: ch02-b01
          speaker: calender_2
          text: |-
            做了一年多樵夫以后，有一天，我走到从未去过的森林深处，在一片青翠宜人的空地上砍树。斧头劈向树根时，我忽然看见泥土里露出一只铁环，连着一扇同样用铁铸成的活门。我很快清开四周泥土，拉起门板，看见下面有道阶梯。我把斧头留在手里防身，当即决定下去一探究竟。
        - id: ch02-b02
          speaker: calender_2
          text: |-
            阶梯底下竟是一座巨大的宫殿，灯火辉煌，丝毫不逊于我见过的任何一座地上王宫。长廊向前延伸，两旁立着碧玉石柱，柱头全用黄金装饰。一位女子沿着长廊向我走来。她美得让我忘掉世间万物，心里只剩下她。我不愿叫她多走一步，连忙迎上前去，深深行了一礼。
        - id: ch02-b03
          speaker: princess
          text: |-
            你是谁？究竟是凡人，还是精灵？
        - id: ch02-b04
          speaker: calender_2
          text: |-
            夫人，我是凡人，和精灵毫无关系。
        - id: ch02-b05
          speaker: princess
          text: |-
            你怎么会来到这里？我在这儿住了二十五年，你是第一个前来探望我的男人。
        - id: ch02-b06
          speaker: calender_2
          text: |-
            她又美丽又温柔，我便鼓起勇气说，这场相遇不只安慰了我的悲伤，也许还能让我改善她的命运。随后，我说出自己的身份和来到地下的经过。
        - id: ch02-b07
          speaker: princess
          text: |-
            王子，你猜对了。我并不情愿被关在这座华丽宫殿里。我是乌木岛国王的女儿，想必你听说过父王的声名。我奉他的意愿嫁给一位王子，那人也是我的堂兄。可就在婚礼当天，一个精灵把我掳走了。我当时昏了过去，再醒来时已经躺在这里。很长一段时间，我除了哭什么也不做，更不准精灵靠近。可是岁月渐渐教会了我顺从。如今我已经习惯他的存在。若衣服和珠宝真能使人满足，我拥有的倒是多得很。
        - id: ch02-b08
          speaker: princess
          text: |-
            二十五年来，他每十天来一次。若我临时需要他，只须触碰寝室门口的护符。离下次来访还有五天，请你留下来做我的客人吧。
        - id: ch02-b09
          speaker: calender_2
          text: |-
            她的美貌使我神魂颠倒，我连拒绝的念头都不曾有过。公主叫人领我去沐浴，又备下一身与王子身份相称的华服。随后，我们走进一间悬挂印度刺绣织物的屋子，那里已经摆好最精美的菜肴。第二天一同用餐时，我再也按捺不住，恳求她挣脱束缚，随我回到那个有阳光照耀的世界。
        - id: ch02-b10
          speaker: princess
          text: |-
            那绝不可能。不如你留下陪我。每逢第十天，我等精灵主人到来时，你暂且躲进森林便好。他嫉妒得可怕，绝不准男人接近我。
        - id: ch02-b11
          speaker: calender_2
          text: |-
            公主，你只是害怕那个精灵，我却一点也不怕。我非把护符砸碎不可！不管他多可怕，我都要让他尝尝我这条臂膀的厉害。我在此发誓，定把整个精灵族一扫而空。
        - id: ch02-b12
          speaker: princess
          text: |-
            别碰它！你若动了护符，我们两个都会毁在这里。我比你更了解精灵。
          emotion: fearful
        - id: ch02-b13
          speaker: calender_2
          text: |-
            公主明白我的狂言会带来什么后果，一再苦苦阻止。可酒已经搅乱我的头脑，我根本听不进去。我抬脚猛踢，护符立刻碎成千百片。脚才碰到它，四周便黑如深夜。可怕的轰鸣从空中传来，整座宫殿一直摇到根基。我顷刻间清醒过来，也终于明白自己闯下了多大的祸。
        - id: ch02-b14
          speaker: calender_2
          text: |-
            公主，这是怎么了？
          emotion: surprised
        - id: ch02-b15
          speaker: princess
          text: |-
            快逃，不然你就没命了！
          emotion: fearful
    - id: ch03
      title: 精灵追来
      blocks:
        - id: ch03-b01
          speaker: calender_2
          text: |-
            我冲上阶梯，把斧头落在下面，可已经迟了。宫殿裂开，精灵现出身形，愤怒地转向公主。
        - id: ch03-b02
          speaker: genius
          text: |-
            出了什么事，你为什么这样召我回来？
          emotion: angry
        - id: ch03-b03
          speaker: princess
          text: |-
            我忽然心口疼，只好拿小瓶求助。后来一阵眩晕，我滑倒时撞上护符，它就碎了。事情真的只有这些。
        - id: ch03-b04
          speaker: genius
          text: |-
            无耻的骗子！那斧头和鞋又是哪里来的？
          emotion: angry
        - id: ch03-b05
          speaker: princess
          text: |-
            我从没见过。你来得那么急，也许是在路上无意间带来的，自己都不知道。
        - id: ch03-b06
          speaker: calender_2
          text: |-
            精灵听完，只用辱骂和殴打回答。我躲在上面，听见公主一声声惨叫呻吟。这时我已经脱下华服，换回前一天来到宫殿时穿的破衣。我掀开活门，重新逃进森林，只背着一小捆柴回到裁缝家，心里装满羞愧和悲伤。裁缝因为我许久未归，一直坐立不安，见我回来十分欢喜。我却对地下发生的事只字不提，尽快躲进自己的房间，暗暗悔恨这场由愚蠢招来的灾祸。
        - id: ch03-b07
          speaker: tailor
          text: |-
            楼下有位老人送来了你的斧头和鞋。他说是在路上捡到的，又向你的同伴问出住处。你最好亲自下去见他。
        - id: ch03-b08
          speaker: calender_2
          text: |-
            听见这番话，我顿时脸色惨白，两条腿也在身下不停发抖。裁缝看出了我的慌乱，正要追问其中缘故，房门却自己打开了。那位老人径直走进屋来，手中拿的正是我遗落在地下宫殿里的斧头和鞋。
        - id: ch03-b09
          speaker: genius
          text: |-
            我是精灵，是精灵之王易卜劣斯的外孙。斧头和鞋都是你的，对不对？
        - id: ch03-b10
          speaker: calender_2
          text: |-
            他根本没等我回答。其实就算肯等，我也吓得说不出话。他一把抓住我，快如闪电地冲上天空，又以同样惊人的速度朝地面坠去。双脚刚一落地，他便重重跺了一下，大地随即张开。转眼之间，我们回到那座施过魔法的宫殿，也再次见到乌木岛公主。可她和上次完全不同，浑身是血，横卧在地上，正在悲痛地哭泣。
    - id: ch04
      title: 生死考验
      blocks:
        - id: ch04-b01
          speaker: genius
          text: |-
            叛徒！这个男人不就是你的情人吗？
          emotion: angry
        - id: ch04-b02
          speaker: calender_2
          text: |-
            公主慢慢抬起眼睛，悲伤地看着我。
        - id: ch04-b03
          speaker: princess
          text: |-
            我从未见过他，也不知道他是谁。
          emotion: sad
        - id: ch04-b04
          speaker: genius
          text: |-
            你受的苦全是他害的，竟还敢说不认识他！
          emotion: angry
        - id: ch04-b05
          speaker: princess
          text: |-
            如果他真是陌生人，我为什么要撒谎害死他？
        - id: ch04-b06
          speaker: genius
          text: |-
            很好。拿起这把弯刀，砍下他的头。
        - id: ch04-b07
          speaker: princess
          text: |-
            我虚弱得连刀都拿不动。就算还有力气，为什么要杀一个无辜的人？
          emotion: sad
        - id: ch04-b08
          speaker: genius
          text: |-
            你不肯动手，已经定了自己的罪。至于你，你也不认识她吗？
        - id: ch04-b09
          speaker: calender_2
          text: |-
            我决意仿效公主的忠贞，便反问精灵，我既然从未见过她，又怎么可能认识。精灵随即换了一个办法。他把弯刀交给我，命我砍下公主的头，还说她若真是陌生人，我便没有理由拒绝。只要我照办，他就相信我说的是真话，并且立刻放我自由。
        - id: ch04-b10
          speaker: calender_2
          text: |-
            当然可以。
        - id: ch04-b11
          speaker: calender_2
          text: |-
            我接过弯刀，嘴上答应下来，又悄悄示意公主不要害怕。我真正准备牺牲的是自己的性命，绝不会伤害她。可是，当她向我投来感激的目光时，我的勇气还是动摇了。我再也装不下去，索性把弯刀扔到地上。
        - id: ch04-b12
          speaker: calender_2
          text: |-
            我若懦弱到杀死一位与我素不相识、此刻又已经伤得半死的夫人，便不配继续活着。你想怎样处置我都可以，我已经落在你的掌心。可要我服从这样残酷的命令，亲手取走她的性命，我绝不答应。
        - id: ch04-b13
          speaker: genius
          text: |-
            看来你们打定主意和我抗争到底。那么我就先让你们尝尝，接下来会遭受什么。
          emotion: angry
        - id: ch04-b14
          speaker: calender_2
          text: |-
            话才说完，他便挥起弯刀，一刀斩下公主的一只手。她已经虚弱得只能勉强抬起另一只手，向我挥了挥，就这样作了永别。眼前这一幕叫我再也支撑不住。我失去知觉，昏迷了好几分钟。
    - id: ch05
      title: 两个邻居的引子
      blocks:
        - id: ch05-b01
          speaker: calender_2
          text: |-
            醒来以后，我再也受不了这种等待死亡的煎熬，便恳求精灵不要继续把我悬在生死之间，快些动手，结束我的痛苦。他对这些哀求毫不理会，只用冷酷的声音告诉我，公主为什么会受到这样的惩罚。
        - id: ch05-b02
          speaker: genius
          text: |-
            这就是精灵对待背叛自己的女人的办法。我若愿意，也可以立刻杀掉你。不过，我打算发发慈悲，只把你变成一条狗、一头驴、一只狮子，或者一只鸟。你想变成什么，自己挑吧。
        - id: ch05-b03
          speaker: calender_2
          text: |-
            我一听这番话，便从绝望中也抓住了一线希望。我想，也许还能设法平息他的怒气，让他不只留下我的性命，也饶我完整地保住原来的模样。
        - id: ch05-b04
          speaker: calender_2
          text: |-
            精灵啊！你既然愿意饶我一命，就请宽宏到底，不要把我变成别的模样，真正放过我吧。答应我的请求，赦免我犯下的罪过。世上最善良的那个人，也曾饶恕一个因嫉妒而满心憎恨他的邻居。请你也像他那样待我。
        - id: ch05-b05
          speaker: calender_2
          text: |-
            我原以为这番恳求只会让他更加恼怒，没想到精灵反而来了兴致，叫我说说那两个邻居之间究竟发生过什么。夫人，我想这个故事或许也会使您喜欢。现在，就请让我把它讲给您听吧。
