  chapters:
    - id: ch01
      title: A Prince Far from Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The young man turned to Zobeida and began his story.
        - id: ch01-b02
          speaker: second_calendar
          text: >-
            Madam, to explain how I lost my right eye, I must tell you the story of my whole life.
        - id: ch01-b03
          speaker: second_calendar
          text: >-
            I was hardly more than a baby when my father, the king, noticed that I was unusually quick for my age. At once, he began thinking about my education. First I learned to read and write. Then my tutors taught me the Koran, which stands at the heart of our holy religion. To understand it better, I studied the finest explanations of its teaching. I also learned by heart the traditions handed down by the Prophet's friends.
        - id: ch01-b04
          speaker: second_calendar
          text: >-
            I studied history, poetry, verse, geography, and chronology. I also practiced every outdoor exercise expected of a prince. Yet nothing pleased me as much as forming Arabic characters. Before long, I wrote better than my own masters, and news of my skill traveled as far as India.
        - id: ch01-b05
          speaker: second_calendar
          text: >-
            The Sultan of the Indies heard of my reputation and grew curious about a young prince with such unusual interests. He sent my father an ambassador laden with splendid gifts, along with a warm invitation for me to visit his court. My father was eager to win the friendship of so mighty a ruler. He also believed that a little travel would improve my manners and open my mind, so he gladly accepted for me.
        - id: ch01-b06
          speaker: second_calendar
          text: >-
            Soon I set out for India with the ambassador. Because the journey was long and the roads were poor, only a small company came with us. Still, duty required me to bring ten camels loaded with rich gifts for the sultan.
        - id: ch01-b07
          speaker: second_calendar
          text: >-
            About a month later, a cloud of dust came racing toward us. As it drew near, we saw fifty robbers hidden inside it. Our men numbered barely half that many, and the camels kept us from moving freely. Fighting seemed useless. We tried to frighten the robbers away by telling them exactly who we were and where we were going. They only laughed. Our rank and our journey were none of their concern. Without another word, they attacked us brutally.
        - id: ch01-b08
          speaker: second_calendar
          text: >-
            I fought on to the very end, even after I was wounded. At last, I saw that resistance was hopeless. The ambassador and every one of our followers had been taken prisoner. I put my spurs to my horse and fled as fast as he could carry me. At last, a wound in his side brought the poor animal down dead. I managed to leap free without hurting myself. When I looked behind me, no one was following. For the moment, I was safe. The robbers, I imagined, were too busy quarreling over their spoils.
        - id: ch01-b09
          speaker: second_calendar
          text: >-
            I was alone in a country I had never seen. I dared not return to the main road, where the robbers might catch me again. Fortunately, my wound was slight. I bound it as well as I could and walked until evening. At the foot of a mountain, I found a cave and slept there safely after eating fruit gathered along the way.
        - id: ch01-b10
          speaker: second_calendar
          text: >-
            For a whole month I wandered without knowing where I was going. Then I reached the edge of a beautiful city, crossed by winding streams and blessed with endless spring. I longed to be among people again, but I knew how miserable I looked. The sun had burned my face and hands almost black. My clothes hung in rags, and my shoes had become so ruined that I had thrown them away.
    - id: ch02
      title: The Tailor and the Woodcutter
      blocks:
        - id: ch02-b01
          speaker: second_calendar
          text: >-
            I entered the city and stopped at a tailor's shop to ask where I was. The tailor could see that my appearance did not match the person I truly was. He invited me to sit, and I told him everything that had happened. He listened closely, but his answer made my troubles worse.
        - id: ch02-b02
          speaker: tailor
          text: >-
            Be careful. Tell no one else what you have told me. The prince who rules this kingdom is your father's greatest enemy. If he finds you in his power, he will rejoice.
        - id: ch02-b03
          speaker: second_calendar
          text: >-
            I thanked him for the warning and promised to do whatever he advised. By then, I was terribly hungry. I gladly ate the food he placed before me, and when he offered me a room in his own house, I accepted that kindness too.
        - id: ch02-b04
          speaker: second_calendar
          text: >-
            Within a few days, I had fully recovered from the hardships of my journey. The tailor knew our custom. Princes of our religion were expected to learn a trade or profession, so they could support themselves if misfortune ever came. He asked whether I had any skill that might earn me a living.
        - id: ch02-b05
          speaker: second_calendar
          text: >-
            I told him I had been trained in grammar and poetry, but that writing was my greatest talent.
        - id: ch02-b06
          speaker: tailor
          text: >-
            None of that will help you here. Listen to me. Put on a short coat and go into the woods. You are strong enough to cut firewood and sell it in the streets. You can earn your food that way while you wait for better days. I will give you a hatchet and a rope.
        - id: ch02-b07
          speaker: second_calendar
          text: >-
            The advice was deeply unpleasant to me. Still, I could see no choice but to follow it. The next morning, I put on the short coat and joined a band of poor woodcutters whom the tailor had introduced to me. Even on that first day, I cut enough wood to sell for a fair sum. I soon became more skillful, and before long, I had earned enough to repay everything the tailor had lent me.
        - id: ch02-b08
          speaker: second_calendar
          text: >-
            I lived as a woodcutter for more than a year. Then one day, I wandered farther into the forest than I had ever gone before. I came upon a lovely green clearing and began cutting wood there. As I hacked at the root of a tree, I noticed an iron ring fixed to a trapdoor made of the same metal. I cleared away the earth, pulled the heavy door open, and discovered a staircase beneath it. I quickly decided to descend, taking my hatchet along for protection.
        - id: ch02-b09
          speaker: second_calendar
          text: >-
            At the bottom stood an enormous underground palace, as bright as any palace beneath the sun. A long gallery stretched before me. Its pillars were jasper, and their tops were decorated with gold. Then a lady came down the gallery to meet me. She was so beautiful that every other thought vanished from my mind.
    - id: ch03
      title: The Princess Beneath the Earth
      blocks:
        - id: ch03-b01
          speaker: second_calendar
          text: >-
            Hoping to spare her any trouble, I hurried forward and bowed deeply.
        - id: ch03-b02
          speaker: princess
          text: >-
            Who are you? Tell me, are you a man or a genius?
          emotion: surprised
        - id: ch03-b03
          speaker: second_calendar
          text: >-
            I am a man, madam. I have nothing to do with genii.
        - id: ch03-b04
          speaker: princess
          text: >-
            Then how did you ever come here? I have lived in this place for twenty-five years, and you are the first man who has visited me.
          emotion: sad
        - id: ch03-b05
          speaker: second_calendar
          text: >-
            Her beauty and gentleness gave me courage.
        - id: ch03-b06
          speaker: second_calendar
          text: >-
            Before I answer, madam, let me say how grateful I am that we have met. Seeing you comforts me in my own deep sorrow. Perhaps I may even be able to make your life happier.
        - id: ch03-b07
          speaker: second_calendar
          text: >-
            Then I told her who I was and how I had found the palace.
        - id: ch03-b08
          speaker: princess
          text: >-
            Alas, Prince, you are right. I am an unwilling prisoner in this magnificent place. I am the daughter of the king of the Ebony Isle. Surely his fame has reached you. At my father's wish, I married a prince who was also my cousin. But on the very day of our wedding, a genius snatched me away. I fainted, and he brought me here while I lay unconscious.
          emotion: sad
        - id: ch03-b09
          speaker: princess
          text: >-
            For a long time, I did nothing but weep. I would not allow the genius to come near me. But time teaches us to submit, and now I have grown used to his presence. If fine clothes and precious jewels could bring contentment, I would have more than enough. This palace is filled with them.
          emotion: sad
        - id: ch03-b10
          speaker: princess
          text: >-
            For twenty-five years, he has visited me every tenth day. If I need him sooner, I only have to touch the talisman by my chamber door. His next visit is still five days away. I hope you will honor me by staying as my guest until then.
        - id: ch03-b11
          speaker: second_calendar
          text: >-
            Her beauty had dazzled me so completely that I never dreamed of refusing her invitation. The princess had me taken to the bath, and afterward, I was given a rich robe suited to my true rank. Then a feast of the most delicate dishes was served to us in a room hung with embroidered fabrics from India.
        - id: ch03-b12
          speaker: second_calendar
          text: >-
            The next day, as we ate, I could hold back no longer. I begged her to escape her prison and return with me to the world beneath the sun.
        - id: ch03-b13
          speaker: princess
          text: >-
            What you ask cannot be done. Stay here with me instead, and we can be happy. You need only go back to the forest every tenth day, when my master is due to visit. You know how jealous he is. He will never allow another man near me.
        - id: ch03-b14
          speaker: second_calendar
          text: >-
            Princess, only your fear of the genius makes you speak this way. As for me, I dread him so little that I mean to break his talisman into pieces. However terrible you believe him to be, he will feel the weight of my arm. Here and now, I swear that I will stamp out his whole race!
        - id: ch03-b15
          speaker: second_calendar
          text: >-
            The princess understood what my reckless words could bring upon us. She pleaded with me not to touch the talisman.
        - id: ch03-b16
          speaker: princess
          text: >-
            If you break it, you will ruin us both. I know genii far better than you do.
          emotion: fearful
        - id: ch03-b17
          speaker: second_calendar
          text: >-
            But the wine had clouded my mind. I kicked the talisman, and it shattered into a thousand pieces.
        - id: ch03-b18
          speaker: second_calendar
          text: >-
            The instant my foot struck it, the air turned dark as night. A dreadful noise filled the palace, and the whole place shook to its foundations. My senses returned at once. I knew what I had done.
        - id: ch03-b19
          speaker: second_calendar
          text: >-
            Princess, what is happening?
          emotion: fearful
        - id: ch03-b20
          speaker: princess
          text: >-
            Oh, fly! If you stay, you are lost!
          emotion: fearful
        - id: ch03-b21
          speaker: second_calendar
          text: >-
            Even in her terror, she thought first of saving me. I obeyed and raced up the stairs, leaving my hatchet behind. But I had waited too long. The palace opened, and the genius appeared. He turned on the princess in fury.
        - id: ch03-b22
          speaker: genius
          text: >-
            What has happened? Why did you summon me this way?
          emotion: angry
        - id: ch03-b23
          speaker: princess
          text: >-
            My heart began to hurt, and I needed the medicine in this little bottle. I felt faint, slipped, and fell against the talisman. That is how it broke. Nothing else happened.
        - id: ch03-b24
          speaker: genius
          text: >-
            You shameless liar! Then where did this hatchet come from? And these shoes?
          emotion: angry
        - id: ch03-b25
          speaker: princess
          text: >-
            I have never seen them before. You came so quickly that perhaps you picked them up on the road without noticing.
        - id: ch03-b26
          speaker: second_calendar
          text: >-
            The genius answered her with nothing but insults and blows. From my hiding place, I heard the princess shriek and groan. By then, I had torn off the rich clothes and put on the poor ones I had worn when I arrived the day before. I lifted the trapdoor, found myself in the forest once more, and returned to my friend the tailor. I carried only a light bundle of wood, and my heart was heavy with shame and grief.
    - id: ch04
      title: The Old Man at the Door
      blocks:
        - id: ch04-b01
          speaker: second_calendar
          text: >-
            The tailor had grown uneasy during my long absence and was delighted to see me return. But I kept my adventure entirely to myself. As soon as I could get away, I went to my room and shut myself in. There, alone, I mourned the misery that my own foolishness had caused.
        - id: ch04-b02
          speaker: second_calendar
          text: >-
            While I sat there mourning, my host came in with a message.
        - id: ch04-b03
          speaker: tailor
          text: >-
            An old man is waiting downstairs. He has brought back your hatchet and slippers. He says he found them on the road, then asked one of the other woodcutters where you lived. You had better come down and speak to him yourself.
        - id: ch04-b04
          speaker: second_calendar
          text: >-
            At those words, the color left my face, and my legs began to shake beneath me. The tailor noticed my confusion and was just about to ask what had frightened me. Before he could speak, the door of my room opened. The old man himself stood there, holding my hatchet and shoes in his hands.
        - id: ch04-b05
          speaker: genius
          text: >-
            I am a genius, and my mother is the daughter of Eblis, prince of the genii. This hatchet belongs to you, does it not? And so do these shoes.
        - id: ch04-b06
          speaker: second_calendar
          text: >-
            He did not wait for my answer. In truth, I was far too frightened to give one. He seized me and shot high into the air with the speed of lightning. Then, just as swiftly, he plunged back toward the earth. The moment his feet touched the ground, he struck it once. The earth opened beneath us, and we descended into the enchanted palace.
        - id: ch04-b07
          speaker: second_calendar
          text: >-
            The beautiful princess of the Ebony Isle lay before us. How different she looked from the woman I had so recently left. She was stretched across the floor, covered in blood and weeping bitterly.
        - id: ch04-b08
          speaker: genius
          text: >-
            Traitor! This man is your lover, is he not?
          emotion: angry
        - id: ch04-b09
          speaker: second_calendar
          text: >-
            She slowly raised her eyes and looked at me with sorrow.
        - id: ch04-b10
          speaker: princess
          text: >-
            I have never seen him. I do not know who he is.
          emotion: sad
        - id: ch04-b11
          speaker: genius
          text: >-
            What? He caused all your suffering, and you still dare to call him a stranger?
          emotion: angry
        - id: ch04-b12
          speaker: princess
          text: >-
            If he truly is a stranger, why should I lie and bring about his death?
        - id: ch04-b13
          speaker: genius
          text: >-
            Very well. Take this sword and cut off his head.
        - id: ch04-b14
          speaker: princess
          text: >-
            Alas, I am too weak even to hold the sword. And if I had the strength, why would I kill an innocent man?
          emotion: sad
        - id: ch04-b15
          speaker: genius
          text: >-
            Your refusal proves your guilt.
          emotion: angry
        - id: ch04-b16
          speaker: second_calendar
          text: >-
            Then he turned to me.
        - id: ch04-b17
          speaker: genius
          text: >-
            And you. Do you know this woman?
        - id: ch04-b18
          speaker: second_calendar
          text: >-
            I decided to be as faithful to her as she had been to me.
        - id: ch04-b19
          speaker: second_calendar
          text: >-
            How could I know her? I have never seen her before.
        - id: ch04-b20
          speaker: genius
          text: >-
            Then cut off her head. If she is truly a stranger, I will believe you and set you free.
    - id: ch05
      title: A Plea for Mercy
      blocks:
        - id: ch05-b01
          speaker: second_calendar
          text: >-
            I agreed and took the sword in my hands. Then I made a sign to the princess, telling her not to be afraid. I meant to sacrifice my own life, not take hers. She understood. But the look of gratitude she gave me shook my courage, and I flung the sword down upon the floor.
        - id: ch05-b02
          speaker: second_calendar
          text: >-
            I would not deserve to live if I could murder a lady I do not even know, especially when she is already half dead. Do whatever you wish with me. I am in your power, but I will not obey such a cruel order.
        - id: ch05-b03
          speaker: genius
          text: >-
            I see that both of you have chosen to defy me. Now I will show you what you can expect.
          emotion: angry
        - id: ch05-b04
          speaker: second_calendar
          text: >-
            With one sweep of his sword, the genius cut off one of the princess's hands. She had only enough strength left to raise the other and wave me an everlasting farewell. At that sight, everything went dark. I lost consciousness and knew nothing for several minutes.
        - id: ch05-b05
          speaker: second_calendar
          text: >-
            When I came to myself, I begged the genius not to keep me waiting in that terrible uncertainty. I pleaded with him to waste no time and put an end to my suffering. The genius paid no attention to my prayers. Instead, he answered me sternly.
        - id: ch05-b06
          speaker: genius
          text: >-
            Now you have seen how a genius treats a woman who betrays him. If I chose, I could kill you as well. But I will be merciful. I will content myself with changing you into a dog, an ass, a lion, or a bird. You may choose which one.
        - id: ch05-b07
          speaker: second_calendar
          text: >-
            His words gave me a faint hope that I might soften his anger, and I seized it eagerly.
        - id: ch05-b08
          speaker: second_calendar
          text: >-
            O genius, if you mean to spare my life, then spare me completely. Be generous and pardon what I have done, just as the best man in the world forgave a neighbor who was consumed by envy of him.
        - id: ch05-b09
          speaker: second_calendar
          text: >-
            Against all my expectations, the genius became interested.
        - id: ch05-b10
          speaker: genius
          text: >-
            Tell me the story of those two neighbors.
        - id: ch05-b11
          speaker: second_calendar
          text: >-
            And since I think the story may please you too, madam, I will tell it to you as well.
