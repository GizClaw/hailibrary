      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    second_calendar:
      display_name: Second Calendar
      tts:
        delivery: candid, courtly, and deeply reflective
        timbre: clear and youthful
