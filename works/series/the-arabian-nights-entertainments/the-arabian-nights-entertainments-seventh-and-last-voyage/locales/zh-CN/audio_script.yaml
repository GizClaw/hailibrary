audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    king:
      display_name: 锡兰王
      tts:
        delivery: 威严宽厚，待人慷慨而有分寸
        timbre: 洪亮沉稳
        pace: 从容
        pitch: 低音
    caliph:
      display_name: 哈里发
      tts:
        delivery: 庄重敏锐，言语简洁有威仪
        timbre: 深沉清晰
        pace: 稍缓
        pitch: 低音
    merchant:
      display_name: 富商主人
      tts:
        delivery: 务实爽直，感激时真诚厚道
        timbre: 稳健清晰
        pace: 适中
        pitch: 中低音
    hindbad:
      display_name: 脚夫欣巴达
      tts:
        delivery: 朴实恭敬，言语诚恳
        timbre: 温厚自然
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 哈里发的使命
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            第六次航行回来以后，我下定决心，再也不出海了。我的年纪已经不小，冒过的险也够多，只想安安静静地过完余生。

            可有一天，我正在家里招待朋友，哈里发的一名官员忽然登门，要我随他进宫。到了哈伦·拉希德面前，我先行了礼。
        - id: ch01-b02
          speaker: caliph
          text: 辛巴达，我有件事需要你去办。你替我带上一封信和一份礼物，送给锡兰王，回报他对我的友好问候。
        - id: ch01-b03
          speaker: sindbad
          text: |-
            这道命令像晴天霹雳一样落在我头上。

            我告诉哈里发，陛下无论要我做什么，我都愿意服从。可我受过的那些磨难世所未闻，早已叫我心灰意冷。我甚至发过誓，再也不离开巴格达。

            接着，我把最离奇的几次遭遇一一讲给他听。他一直耐心听完。
        - id: ch01-b04
          speaker: caliph
          text: 你的经历确实非同寻常，可这不妨碍你替我走一趟。你只要直奔锡兰，把我的口信送到，就可以回来，从此随心生活。不过，这一趟你必须去。我的荣誉和尊严都系在这件事上。
        - id: ch01-b05
          speaker: sindbad
          text: |-
            我见推辞不了，只好答应。哈里发如愿以偿，赐给我一千枚金币做旅费。我带好信和礼物，从巴士拉登船，一路平安抵达锡兰。

            国王听明来意，隆重地接待了我。我进宫觐见时，他一看见我就满心欢喜。
        - id: ch01-b06
          speaker: king
          text: 欢迎你，辛巴达！我常常想起你，今天又见到你，真叫人高兴。
        - id: ch01-b07
          speaker: sindbad
          text: |-
            我谢过国王，便把哈里发的礼物陈列出来。先是两张带有全套帷幔的床，一张通体织着金线，价值一千枚金币，另一张则是深红色的。还有五十件华美的刺绣长袍，一百匹来自开罗、苏伊士、库法和亚历山大港的上等白麻布，几张式样不同的床，一只雕着弯弓射狮图案的玛瑙花瓶，以及一张据说曾属于所罗门王的珍贵桌子。

            国王欣然接受了哈里发的心意。我的使命已经完成，一心只想回家，他却过了好些日子才准我离开。临行时，他又送给我许多礼物。
    - id: ch02
      title: 海盗与象林
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            我没有耽搁，登上一艘马上启航的船。头四天风平浪静，第五天却遇上了海盗。他们夺走船只，杀死所有反抗的人。那些看清形势、立即投降的，则全被抓了起来，我也是其中之一。海盗抢光我们的财物，逼我们脱下原来的衣裳，换上破烂不堪的衣服。随后，他们把船开到一座遥远的岛上，将我们当作奴隶卖掉。

            买下我的是一位富商。他带我回家，给我好衣好饭。几天以后，他问我会做什么。我说，自己原是个商人，只因被海盗捉来才落到这里，并不会什么手艺。
        - id: ch02-b02
          speaker: merchant
          text: 那你会射箭吗？
        - id: ch02-b03
          speaker: sindbad
          text: |-
            我告诉他，年轻时常拿射箭消遣。只要练一练，从前的本领应该还能回来。

            他马上给我备好弓箭，让我与他同乘一头大象，走到远离城镇的广阔森林里。在最荒僻的地方，他指着一棵大树，说这片森林到处都是大象。我要藏到树上，见到经过的大象便放箭。等射死一头，再回去报信。

            主人留下食物，独自回城。我爬到高处守了一夜，什么也没看见。第二天太阳刚升起，一大群象就轰隆隆地冲过来。我连射几箭，终于有一头倒地死去，其余的象都退走了。

            象群退走以后，我从藏身的大树上爬下来，飞快地赶回城里报喜。主人不但夸奖我，还拿出许多美味款待我。随后，我们一同回到林中，挖了一道很深的壕沟，把死象埋进去。等血肉消失，只剩下骨架，主人就能回来取走它的两根象牙。
    - id: ch03
      title: 象牙山
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            接连两个月，我每天都能射到一头象。不过我也很谨慎，不会总守在同一棵树上。有时换到这里，有时又换去别处，不让象群摸清我的藏身地。

            一天早晨，我又在树上望见象群走来。这一次，它们没有像平常那样从树下经过，却突然停住，把整棵树围得严严实实。它们发出可怕的吼叫，沉重的脚步震得地面不停发颤。我低头一看，所有大象的眼睛都死死盯着自己。我吓得浑身发抖，连弓箭也从手里掉了下去。

            转眼间，最大的一头象伸出长鼻，紧紧缠住树干。它只用了一下力，就把整棵大树连根拔起。我被枝叶缠住，一起摔到地面，以为自己的最后一刻终于来了。可巨象没有踩死我，反而轻轻把我卷起来，放到自己背上。整个象群跟在后面，一路踩断枝木，撞进密林。我吓得几乎失去知觉，只能紧紧攀住它。

            我觉得这段路走了很久，巨象才把我放回地上。我站在那里，如同还在梦中，眼看象群掉转方向，踏着重重的脚步离开，很快消失在浓密的灌木深处。等我回过神，才发现自己站在一座大山的山坡上。放眼望去，无论左边还是右边，四处都是大象的骨骸和象牙。

            我这才明白，这里一定是大象的墓地。象群知道我只为象牙而来，才把我带到这里，好叫我别再残害它们。而满山的象牙，我一辈子也搬不完。

            我立刻往城里赶。一路上没有遇到一头大象。它们似乎全都退进森林深处，特意让出了通往象牙山的道路。想到它们的智慧，我怎么赞叹也不够。

            走过一天一夜，我终于回到主人家。他见我活着回来，又惊又喜。
        - id: ch03-b02
          speaker: merchant
          text: 可怜的辛巴达！我去森林找过你，只看见大树刚被拔倒，弓箭落在旁边。我还以为再也见不到你了。你究竟是怎么逃过这一劫的？
        - id: ch03-b03
          speaker: sindbad
          text: |-
            我把事情从头说了一遍。第二天，我们一同前往象牙山。主人见那里的情形与我说的一模一样，高兴极了。我们给大象装上它能驮动的最多象牙，然后启程回城。
        - id: ch03-b04
          speaker: merchant
          text: |-
            我的兄弟，你让我得到这么大的财富，我不能再把你当奴隶了。从现在起，你自由了，愿上天保佑你。

            这些野象每年都会杀死许多奴隶。不管我们怎么教他们小心，他们迟早还是会中象群的计。只有你逃了出来，一定是上天在护佑你。

            如今靠着你的发现，全城都能富起来，也不必再有人丧命。所以我不但要还你自由，还要送你一笔财产。
        - id: ch03-b05
          speaker: sindbad
          text: 主人，谢谢你，也祝你事事顺遂。我只求能以自由之身回到故乡。
        - id: ch03-b06
          speaker: merchant
          text: 好。季风很快会把象牙船带来。到时候我替你安排船只，再给你一些旅费。
    - id: ch04
      title: 回到巴格达
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            我就这样住在主人家中，等候季风到来。我们每天都去象牙山搬运，直到他所有的仓库都堆得满满当当。城里的其他商人也渐渐知道了秘密，不过那里的象牙多得取不完，大家尽管去拿，也仍旧绰绰有余。

            船队到来以后，主人亲自替我挑选了一艘船。他给我备下许多上好的食物，又把大批象牙和当地最贵重的奇珍搬上船。他待我这样厚重，我实在怎么谢也谢不尽，只能与他告别。

            船到第一处港口，我就上了岸。过去所有的海难都压在心头，我已经无法安心留在海上。我卖掉随身的象牙，换来许多黄金，又买了不少稀有而贵重的礼物，把它们装到驮兽背上，随后加入一支商队，改走陆路回家。

            旅程又长又乏味，我却耐心忍受。至少这一路不必害怕暴风雨、海盗、巨蛇，还有从前遇到的那些险境。

            最后，我们终于到了巴格达。我第一件事就是进宫，把出使的经过禀报给哈里发。他说，我离开太久，让他很不安，可他一直盼着我平安回来。象群的故事更叫他惊叹。他还说，要不是一向知道我诚实，简直无法相信。

            哈里发命书记官用金字写下这个故事，连同我以前讲过的历险，一起收进宝库。我向他辞行。他赐下的荣誉和赏赐，让我心满意足。从那以后，我再也没有四处奔波，只在家中陪伴亲友。
    - id: ch05
      title: 最后的故事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 辛巴达就这样讲完了第七次，也是最后一次航行。他转过身，对欣巴达说道：
        - id: ch05-b02
          speaker: sindbad
          text: 我的朋友，现在你怎么想？你听说过有谁受过比我更多的苦，又有这么多次死里逃生吗？如今让我过安逸宁静的日子，难道不应该吗？
        - id: ch05-b03
          speaker: narrator
          text: 欣巴达走上前，恭恭敬敬地亲吻辛巴达的手。
        - id: ch05-b04
          speaker: hindbad
          text: 先生，您经历的凶险确实可怕。我的烦恼和您的苦难相比，根本不算什么。您又这样慷慨地使用财富，可见这一切本来就该属于您。愿您长寿安康，永远幸福地享有这些福分。
        - id: ch05-b05
          speaker: narrator
          text: 辛巴达送给欣巴达一百枚金币，从此把他当作朋友。他还让欣巴达不必再做脚夫，每天都来与自己同桌吃饭，好叫他一生都记得水手辛巴达。
