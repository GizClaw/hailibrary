  chapters:
    - id: ch01
      title: Seventh and Last Voyage
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            After my sixth voyage, I was determined never to go to sea again. I was old enough to value a quiet life, and I had faced more than enough danger. All I wanted was to spend the rest of my days in peace.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            One day, while I was entertaining some friends, an officer of the Caliph came to see me. He ordered me to follow him into the presence of Haroun al Raschid. I went with him and greeted the Caliph with proper respect.
        - id: ch01-b03
          speaker: caliph
          text: >-
            Sindbad, I sent for you because I need your service. I have chosen you to carry a letter and a gift to the King of Serendib. They will answer the message of friendship he sent me.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            The command struck me like a thunderbolt.
        - id: ch01-b05
          speaker: sindbad
          text: >-
            Commander of the Faithful, I am ready to do whatever your Majesty commands. But please remember how greatly my terrible sufferings have discouraged me. I have sworn never to leave Bagdad again.
        - id: ch01-b06
          speaker: sindbad
          text: >-
            I told him at length about some of my strangest adventures, and he listened patiently.
        - id: ch01-b07
          speaker: caliph
          text: >-
            I agree that your experiences have been extraordinary. Even so, they should not prevent you from doing what I ask. Go directly to Serendib, deliver my message, and then come home and live as you please. But you must go. My honor and dignity require it.
        - id: ch01-b08
          speaker: sindbad
          text: >-
            There was no way out, so I declared that I would obey. The Caliph was delighted to have his way and gave me a thousand sequins for the expenses of the voyage. I soon made every preparation, took charge of his letter and present, and sailed from Balsora. The journey to Serendib was quick and safe.
        - id: ch01-b09
          speaker: sindbad
          text: >-
            When I explained my mission, I was warmly received and taken before the king. He greeted me with joy.
        - id: ch01-b10
          speaker: king_of_serendib
          text: >-
            Welcome, Sindbad! I have often thought of you, and I am very glad to see you again.
          emotion: happy
        - id: ch01-b11
          speaker: sindbad
          text: >-
            I thanked him for the honor and showed him the Caliph's gifts. There was a bed with hangings made entirely of cloth of gold, worth a thousand sequins, and another bed draped in crimson. There were fifty richly embroidered robes and a hundred pieces of the finest white linen from Cairo, Suez, Cufa, and Alexandria.
        - id: ch01-b12
          speaker: sindbad
          text: >-
            The gifts also included beds of several other designs, an agate vase carved with a man aiming an arrow at a lion, and a costly table that had once belonged to King Solomon. The king was pleased by this proof of the Caliph's friendship.
        - id: ch01-b13
          speaker: sindbad
          text: >-
            My task was done, and I wanted to leave. For some time the king would not hear of it. At last he let me go and sent many presents with me. I boarded a ship without delay, and we set sail at once.
        - id: ch01-b14
          speaker: sindbad
          text: >-
            For four days, everything went well. On the fifth, pirates overtook us. They seized our ship and killed everyone who fought back. Those who surrendered at once were taken prisoner, and I was among them.
        - id: ch01-b15
          speaker: sindbad
          text: >-
            The pirates robbed us of everything, dressed us in miserable clothes, and sailed to a distant island. There they sold us as slaves. A wealthy merchant bought me, took me home, and gave me good food and clothing. A few days later, he asked what kind of work I knew.
        - id: ch01-b16
          speaker: sindbad
          text: >-
            I was a rich merchant until pirates captured me. I never learned a trade.
        - id: ch01-b17
          speaker: merchant_master
          text: >-
            Can you use a bow?
        - id: ch01-b18
          speaker: sindbad
          text: >-
            Archery was one of my pleasures when I was young. With some practice, I am sure the skill will return.
        - id: ch01-b19
          speaker: sindbad
          text: >-
            He gave me a bow and arrows, seated me behind him on his elephant, and rode far from town to a vast forest. Deep in its wildest part, we stopped beside a great tree.
        - id: ch01-b20
          speaker: merchant_master
          text: >-
            This forest is full of elephants. Hide high in this tree and shoot every elephant that passes. As soon as you kill one, come back and tell me.
        - id: ch01-b21
          speaker: sindbad
          text: >-
            He left me food and returned to town. I climbed high into the tree and watched. Nothing appeared that night. Just after sunrise, a large herd came crashing through the forest, shaking the earth beneath their feet.
        - id: ch01-b22
          speaker: sindbad
          text: >-
            I quickly shot several arrows. At last, one of the great animals fell dead. The others withdrew and left me free to climb down. I ran all the way back to my master with the news. He praised my success and rewarded me with good things to eat.
        - id: ch01-b23
          speaker: sindbad
          text: >-
            Then we returned to the forest and dug a deep trench. We buried the elephant there so that, once only its skeleton remained, my master could come back for the tusks.
        - id: ch01-b24
          speaker: sindbad
          text: >-
            I hunted this way for two months, and not a single day passed without my killing an elephant. I never kept watch from the same tree for long. Sometimes I hid in one part of the forest, and sometimes in another.
        - id: ch01-b25
          speaker: sindbad
          text: >-
            One morning, the elephants did not pass beneath me as usual. They stopped and surrounded my tree. Their terrible trumpeting filled the forest, and their heavy tread shook the ground. Every eye was fixed on me. Terror took hold of me, and my arrows fell from my trembling hand.
        - id: ch01-b26
          speaker: sindbad
          text: >-
            The largest elephant wrapped his trunk around the tree. With one mighty pull, he tore it out by the roots. I crashed down, tangled among the branches, certain that my last hour had come.
        - id: ch01-b27
          speaker: sindbad
          text: >-
            But the huge animal lifted me gently and placed me on his back. I clung there, more dead than alive, as the whole herd followed him deep into the forest.
        - id: ch01-b28
          speaker: sindbad
          text: >-
            After what seemed a very long time, the elephant set me on my feet. I stood as though dreaming while the herd turned away and vanished into the thick undergrowth.
        - id: ch01-b29
          speaker: sindbad
          text: >-
            When I came to my senses, I looked around. I was standing on the slope of a great hill. Everywhere I looked, the ground was covered with elephants' bones and tusks.
        - id: ch01-b30
          speaker: sindbad
          text: >-
            This must be the elephants' burial ground. They brought me here so I would stop hunting them. Tusks are all I want, and there are more here than I could carry away in a lifetime.
        - id: ch01-b31
          speaker: sindbad
          text: >-
            I hurried toward the city as fast as I could. I did not see a single elephant on the way. That convinced me the whole herd had gone farther into the forest so the path to Ivory Hill would remain open for me. I could not admire their wisdom enough.
        - id: ch01-b32
          speaker: sindbad
          text: >-
            After traveling for a day and a night, I reached my master's house. He received me with joyful surprise.
        - id: ch01-b33
          speaker: merchant_master
          text: >-
            Ah, poor Sindbad! I kept wondering what had happened to you. I went to the forest and found the tree freshly torn from the ground, with your arrows beside it. I was afraid I would never see you again. Please tell me how you escaped.
          emotion: surprised
        - id: ch01-b34
          speaker: sindbad
          text: >-
            I satisfied his curiosity by telling him everything that had happened. The next day, we rode together to Ivory Hill. When he saw the bones and tusks spread across the hillside, he was overjoyed. He knew then that every word I had spoken was true.
        - id: ch01-b35
          speaker: sindbad
          text: >-
            We loaded our elephant with as many tusks as it could carry. On our way back to the city, my master spoke to me.
        - id: ch01-b36
          speaker: merchant_master
          text: >-
            My brother, you have made me rich, so I can no longer treat you as a slave. You are free, and may Heaven bring you prosperity.
        - id: ch01-b37
          speaker: merchant_master
          text: >-
            I must tell you that these wild elephants kill many of our slaves every year. We gave those men the best advice we could, but sooner or later the animals caught them. You alone escaped their cleverness. Surely Heaven has given you special protection.
        - id: ch01-b38
          speaker: merchant_master
          text: >-
            Because of you, everyone in the town can become richer without another life being lost. I will give you more than freedom. I will give you a fortune as well.
        - id: ch01-b39
          speaker: sindbad
          text: >-
            Master, thank you. I wish you every success. For myself, I ask only to be free to return to my own country.
        - id: ch01-b40
          speaker: merchant_master
          text: >-
            Very well. The monsoon will soon bring the ivory ships here. When they arrive, I will send you home and give you something to pay for the journey.
        - id: ch01-b41
          speaker: sindbad
          text: >-
            I stayed with him until the monsoon brought the ivory ships. Each day we went back to the hill and added more tusks to our store, until all his warehouses overflowed. By then the other merchants had learned the secret too, but Ivory Hill held more than enough for everyone.
        - id: ch01-b42
          speaker: sindbad
          text: >-
            At last the ships arrived. My master personally chose the vessel that would carry me. He placed a great store of the finest provisions aboard for me. He also gave me ivory in abundance and the most costly wonders his country could offer. I could not thank him enough for such generosity, and then we said farewell.
        - id: ch01-b43
          speaker: sindbad
          text: >-
            At the first port we reached, I left the ship. After all the trouble the sea had brought me, I could not feel safe upon it. I sold my ivory for a great sum of gold and used part of it to buy many rare and costly gifts. Then I loaded my wealth and presents onto pack animals and joined a caravan of merchants.
        - id: ch01-b44
          speaker: sindbad
          text: >-
            The journey was long and tiring, but I bore it patiently. At least I no longer had to fear storms, pirates, serpents, or any of the other dangers I had met before. In time, we reached Bagdad.
        - id: ch01-b45
          speaker: sindbad
          text: >-
            My first duty was to appear before the Caliph and tell him what had happened on my mission. He said my long absence had worried him greatly, though he had continued to hope for the best.
        - id: ch01-b46
          speaker: sindbad
          text: >-
            He listened in amazement to my adventure with the elephants. If he had not known me to be truthful, he said, he could never have believed it.
        - id: ch01-b47
          speaker: sindbad
          text: >-
            At his command, the royal scribes wrote this story and all the others I had told him in letters of gold. The Caliph had those accounts placed among his treasures. When I took my leave of him, I was well satisfied with all the honors and rewards he had given me.
        - id: ch01-b48
          speaker: sindbad
          text: >-
            From that time onward, I rested from all my labors and devoted myself entirely to my family and friends.
        - id: ch01-b49
          speaker: narrator
          text: >-
            So Sindbad ended the story of his seventh and last voyage. Then he turned to Hindbad.
        - id: ch01-b50
          speaker: sindbad
          text: >-
            Well, my friend, what do you think now? Have you ever heard of anyone who suffered more or escaped so many dangers? Is it not fair that I should enjoy a peaceful and comfortable life at last?
        - id: ch01-b51
          speaker: narrator
          text: >-
            Hindbad came closer and respectfully kissed Sindbad's hand.
        - id: ch01-b52
          speaker: hindbad
          text: >-
            Sir, you truly have faced terrible dangers. My troubles are nothing beside yours. And the generous way you use your wealth shows that you deserve it. May you live a long and happy life and enjoy all that you have.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Sindbad gave him a hundred sequins and, from then on, counted him as a friend. He arranged for Hindbad to leave his work as a porter and dine at his table every day. In that way, Hindbad would remember Sindbad the Sailor for the rest of his life.
