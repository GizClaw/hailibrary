audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    schacabac:
      display_name: 沙卡巴克
      tts:
        delivery: 圆滑机灵，逢场作戏时一本正经
        timbre: 清朗灵活
        pace: 适中偏快
        pitch: 中音
    servant:
      display_name: 宅中仆役
      tts:
        delivery: 客气中带着理所当然的自豪
        timbre: 清晰爽利
        pace: 适中
        pitch: 中音
    barmecide:
      display_name: 巴尔马克老爷
      tts:
        delivery: 热情豪爽，玩笑时郑重其事
        timbre: 温厚洪亮
        pace: 从容
        pitch: 中低音
    caliph:
      display_name: 哈里发
      tts:
        delivery: 威严果断，讥讽时不动声色
        timbre: 深沉清晰
        pace: 稳健
        pitch: 低音
    tailor:
      display_name: 裁缝
      tts:
        delivery: 嘲讽直率，责骂时义愤难平
        timbre: 干涩清亮
        pace: 稍快
        pitch: 中音
    sultan:
      display_name: 喀什噶尔苏丹
      tts:
        delivery: 威仪从容，好奇时兴味盎然
        timbre: 饱满沉稳
        pace: 稳健
        pitch: 中低音
    barber:
      display_name: 理发师
      tts:
        delivery: 自信健谈，说起本领来兴致勃勃
        timbre: 苍老清亮
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 一顿看不见的宴席
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            现在，只剩我第六个兄弟的故事还没说了。他叫沙卡巴克，也从父亲那里分到一百枚银德拉克马。他把这笔钱看成一大笔财富，可运气不好，很快就赔得精光，只能沿街乞讨。

            好在他能说会道，举止也得体，讨来的东西倒不少。他专门同大户人家的仆役交朋友，想办法借他们的门路见到主人。

            一天，他路过一座气派的宅子，看见许多仆役在院里闲坐，心想这回一定能讨到丰厚的施舍。他走进去，问这是谁的家。
        - id: ch01-b02
          speaker: servant
          text: 好汉，你从哪里来？这样的宅子，除了慷慨好施的巴尔马克家族，还能是谁的？
        - id: ch01-b03
          speaker: narrator
          text: |-
            沙卡巴克听了，便向门口的守卫讨钱。守卫客客气气地请他进去，叫他亲自找主人开口。

            这所宅子大得惊人。他走了好一阵，才来到主人的居所。在一间满是华美绘画的屋里，一位长着白色长须的老人坐在长榻上，亲切地接待了他。沙卡巴克便壮着胆子说明来意。
        - id: ch01-b04
          speaker: schacabac
          text: 老爷，您面前站着一个穷人。全靠您这样富足又慷慨的人相助，我才能活下去。
        - id: ch01-b05
          speaker: narrator
          text: 沙卡巴克还没说完，巴尔马克老爷已经满脸惊讶地打断了他。
        - id: ch01-b06
          speaker: barmecide
          text: 怎么可能？我就在巴格达，竟会让你这样的人挨饿？这可不能再继续了！绝不能让人说我丢下你不管。我也相信，你一定不会丢下我。
          emotion: surprised
        - id: ch01-b07
          speaker: schacabac
          text: 老爷，我向您发誓，今天从早到晚，我一点东西也没吃过。
        - id: ch01-b08
          speaker: barmecide
          text: 什么，你都快饿死了？来人，快拿水来，我们饭前先洗手！
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: |-
            没有仆人出现，老人却认真地搓起双手，好像真有人把水倒在了手上。

            他还叫沙卡巴克一起洗。沙卡巴克看不懂这个玩笑，却还是走上前去，照着老人的动作搓起手来。

            老人洗完那双根本没沾水的手，又提高嗓门，吩咐仆人马上摆饭，说两个人已经饿极了。依然没有一道菜送来，他却像面对一只盛满食物的盘子那样伸出手，取了一口送进嘴中。沙卡巴克也跟着做得有模有样。
        - id: ch01-b10
          speaker: barmecide
          text: 吃呀，朋友，快吃吧。别拘束，就当在自己家里。你都饿成这样了，胃口怎么还这么小？
        - id: ch01-b11
          speaker: schacabac
          text: 老爷，请您见谅。我一点也没耽搁，这顿饭吃得痛快极了。
        - id: ch01-b12
          speaker: barmecide
          text: 这面包怎么样？我觉得格外香甜。
        - id: ch01-b13
          speaker: schacabac
          text: 老爷，我这辈子从没吃过这么美味的东西。
        - id: ch01-b14
          speaker: barmecide
          text: 那就放开肚子吃。为了随时吃到这种面包，我花了五百枚金币，把烤面包的女人买了下来。
    - id: ch02
      title: 玩笑成了真
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            巴尔马克老爷又吩咐人端上各式各样的菜，当然，一道也没有真的出现。他却一道接一道地尝，还把每道菜的妙处都品评一番，沙卡巴克也陪着他称赞。最后，老人说两人既然已经吃得这么好，该喝酒了。

            沙卡巴克起先不肯，说教规禁止饮酒。老人却坚持不能独自喝，他只得答应尝一点。老人装着一次次斟酒，沙卡巴克也装着醉意上头，忽然一拳打在老人脑袋上，把他打倒在地。他举起手还想再打，老人吓得大叫，说他疯了。

            沙卡巴克马上收住手，连声赔罪，硬说全是刚才喝下的酒惹的祸。老人听完不但没生气，反而大笑起来，从地上起身，一把抱住了他。
        - id: ch02-b02
          speaker: barmecide
          text: 我找你这样的人已经很久了！从今天起，这里就是你的家。桌上什么也没有，你却肯陪我装着吃喝，真是难得。现在，我要请你吃一顿真正的好饭！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: |-
            老人拍了拍手。刚才他们凭空尝过的每一道菜，这回全都真的端了上来。奴仆们唱起歌，奏起各种乐器。整顿饭里，老人都把沙卡巴克当作亲密的朋友，还从自己的衣柜中取出一件长袍送给他。

            沙卡巴克就这样在巴尔马克老爷家住了二十年，替他照管宅院，料理所有事务。后来，这位慷慨的恩人去世了，又没有留下任何继承人，所有财产都归了王公。前来收取产业的人毫不留情，连本来就属于沙卡巴克的东西也夺走了。

            他重新穷得一无所有，只好加入一支去麦加朝圣的商队。不料商队遭到贝都因人袭击，财物被抢，朝圣者也全成了俘虏。

            一个贝都因人把沙卡巴克收为奴隶，每天鞭打他，想逼他主动提出交赎金。沙卡巴克反复说明，这番折磨全无用处，他的亲人和他一样穷，打死他也拿不出钱。那人最后折磨腻了，便让他骑上骆驼，把他送到一座荒凉高山的顶上，独自丢在那里自生自灭。

            一支前往巴格达的过路商队告诉了我他的下落。我赶去相救，把已经惨不忍睹的兄弟带回城里。
    - id: ch03
      title: 沉默者说完了故事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 理发师接着说，这就是他后来讲给哈里发听的故事。哈里发听完，顿时大笑不止。
        - id: ch03-b02
          speaker: caliph
          text: 别人叫你“沉默者”，真是再贴切不过。没有哪个名字比这更适合你。不过，我自有缘故，不必告诉你。你离开这座城，以后再也不许回来。
        - id: ch03-b03
          speaker: narrator
          text: |-
            理发师说，他当然别无选择，只能服从。在外漂泊了好几年以后，他听说哈里发去世，便匆忙赶回巴格达，却发现自己的兄弟们已经全部亡故。

            也就在那时，他为跛脚青年帮了一个大忙。可青年不但没有感激，反而宁愿离开巴格达，也不肯冒险再见到他。理发师找了很久，直到今天才意外遇见那个青年，而青年对他的火气还和从前一样大。

            裁缝说到这里，又讲了一遍跛脚青年与理发师的故事。这段故事，大家先前已经听过了。理发师自称给了青年极大的帮助，青年却觉得受了纠缠，宁可远远躲开他。

            裁缝接着说，理发师讲完以后，他们一致认为，那个青年骂他是大话篓子，确实一点也没说错。不过，他们还是请理发师留下赴宴，与大家分享桌上的酒菜。众人在桌边一直坐到午后礼拜时分才散，各自离去，裁缝也回了自己的铺子继续做工。
    - id: ch04
      title: 驼背的真相
      blocks:
        - id: ch04-b01
          speaker: tailor
          text: |-
            就在那段时候，小驼背带着几分醉意，一面唱歌，一面敲鼓，来到我面前。我把他带回家，想逗妻子开心。妻子请他留下吃晚饭，可他吃鱼时，一根鱼刺卡进了喉咙。我们想尽办法也没能救活他。

            他死得太突然，我们全慌了。为了不让人怀疑，我们把尸体送到一个犹太医生家中。医生也怕惹上麻烦，又把他放进御膳采办官的屋里。采办官发现以后，把尸体撑在街上。这样一来，后来的人便以为，是那个商人杀了他。

            陛下，为了满足您的要求，我不得不讲的就是这些。如今请您裁决，我们该得宽恕还是惩罚，该活还是该死？
        - id: ch04-b02
          speaker: narrator
          text: 喀什噶尔苏丹面带笑意听着，让裁缝和朋友们都生出了希望。
        - id: ch04-b03
          speaker: sultan
          text: |-
            我得承认，比起我那弄臣的故事，理发师兄弟几人的故事，还有跛脚青年的故事，都有趣得多。

            不过，我还不能放你们四人回家，也不能马上安葬驼背。我想见见那个让你们得以获赦的理发师。他既然就在城中，便让侍从陪你们立刻去找。
        - id: ch04-b04
          speaker: narrator
          text: 侍从和裁缝很快便带回一位老人。看他的年纪，至少已有九十岁。
        - id: ch04-b05
          speaker: sultan
          text: 沉默者，听说你知道许多奇闻异事。能不能说几个给我听？
        - id: ch04-b06
          speaker: barber
          text: 我的故事先放在一边。请殿下开恩，告诉我这个犹太人、这个基督徒和这个穆斯林，还有这具尸体，为什么全在这里？
        - id: ch04-b07
          speaker: sultan
          text: 这与你有什么相干？
        - id: ch04-b08
          speaker: narrator
          text: |-
            苏丹带着笑意这样问，可他看出理发师一定有自己的理由，便叫人把驼背的故事从头讲了一遍。

            理发师听完，显得十分惊奇。
        - id: ch04-b09
          speaker: barber
          text: 这件事实在太离奇了！不过，我想仔细看看这具尸体。
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: |-
            他跪下来，把驼背的头枕在膝上，仔细端详。忽然，他放声大笑，竟仰面跌倒在地。等他终于笑到能开口，便转向苏丹。
        - id: ch04-b11
          speaker: barber
          text: 这个人根本没死，正如我还活着一样。请看我的本事。
        - id: ch04-b12
          speaker: narrator
          text: |-
            理发师从衣袋里取出一只小药匣，把香脂制成的药膏涂在驼背颈上。接着，他掰开驼背的嘴，用小钳子夹出了喉咙里的鱼刺。

            驼背立刻打了一个喷嚏，伸展四肢，睁开双眼。
    - id: ch05
      title: 苏丹的赏赐
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            苏丹和在场的所有人，一时都说不清更该赞叹什么。驼背明明看起来已经死了整整一夜，又过了大半个白昼，身体竟还能撑住，等到鱼刺取出便活了过来。理发师只凭端详便看出真相，又用药膏和小钳子救醒了他，医术同样高明得惊人。众人从此都把理发师看成一个了不起的人物。

            苏丹命人把驼背的全部经历写下来，与理发师的故事一起存进档案。这样一来，世世代代的人都会把两个故事放在一起谈论。

            苏丹还想抹去众人先前受苦的记忆，便命裁缝、医生、御膳采办官和商人在回家以前，各自在他面前穿上一件取自王家衣柜的长袍。

            至于理发师，苏丹赏给他一笔丰厚的年金，还把他留在自己身边。
