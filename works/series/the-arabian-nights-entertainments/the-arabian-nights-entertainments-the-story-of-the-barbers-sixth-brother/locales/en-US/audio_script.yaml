  chapters:
    - id: ch01
      title: Schacabac Seeks His Fortune
      blocks:
        - id: ch01-b01
          speaker: barber
          text: >-
            Only my sixth brother's story remains. His name was Schacabac. Like the rest of us, he inherited one hundred silver drachmas from our father and thought himself rich. Bad luck soon swept it all away, and he had to beg for a living. He spoke smoothly and had excellent manners, so begging treated him rather well. He made a special effort to befriend servants in great houses, because they could lead him to their masters.
        - id: ch01-b02
          speaker: barber
          text: >-
            One day Schacabac passed a magnificent mansion where many servants lounged in the courtyard. Such a house, he thought, might bring him a generous gift. He went in and asked who owned it.
        - id: ch01-b03
          speaker: servant
          text: >-
            My good man, where have you come from? One look should tell you that this can only be the home of a Barmecide.
        - id: ch01-b04
          speaker: barber
          text: >-
            The Barmecides were famous everywhere for openhanded generosity. Schacabac was delighted to hear the name. Several porters stood nearby, and he asked them whether they would give him alms. They did not turn him away. Instead, they answered him kindly and told him to go inside and speak to the master himself.
        - id: ch01-b05
          speaker: barber
          text: >-
            My brother thanked them and entered. The mansion was so vast that it took him quite a while to reach the Barmecide's rooms. At last he came to a chamber covered with rich paintings. There an old man with a long white beard sat upon a sofa. The old man welcomed him so warmly that Schacabac found the courage to ask for help.
        - id: ch01-b06
          speaker: schacabac
          text: >-
            My lord, I am a poor man. I live only because wealthy and generous people like you are willing to help me.
        - id: ch01-b07
          speaker: barber
          text: >-
            He could say no more. The Barmecide broke in with a look of amazement.
        - id: ch01-b08
          speaker: barmecide
          text: >-
            Can this be true? While I am here in Bagdad, a man like you is going hungry? I must put that right at once! No one shall ever say I deserted you. And I am certain you will never desert me.
          emotion: surprised
        - id: ch01-b09
          speaker: schacabac
          text: >-
            My lord, I swear I have eaten nothing since the day began.
        - id: ch01-b10
          speaker: barmecide
          text: >-
            What? You are starving? Slave, bring water at once so we may wash before we eat!
          emotion: surprised
        - id: ch01-b11
          speaker: barber
          text: >-
            No slave came, and there was no water. Still, the Barmecide held out his hands, rubbed them together, and went through every motion exactly as if a servant had poured water over them.
        - id: ch01-b12
          speaker: barmecide
          text: >-
            Well, why aren't you washing your hands?
        - id: ch01-b13
          speaker: barber
          text: >-
            Schacabac assumed this must be some joke, though he could not see the fun in it. He stepped closer and copied the old man's motions.
    - id: ch02
      title: The Invisible Feast
      blocks:
        - id: ch02-b01
          speaker: barmecide
          text: >-
            Bring our food immediately! We are both famished.
        - id: ch02-b02
          speaker: barber
          text: >-
            Again, nothing appeared. The Barmecide reached toward an empty dish, lifted an imaginary bite, and carried it to his mouth.
        - id: ch02-b03
          speaker: barmecide
          text: >-
            Eat, my friend, please eat! Make yourself at home and take whatever you like. You say you are starving, yet you hardly touch a thing.
        - id: ch02-b04
          speaker: schacabac
          text: >-
            Forgive me, my lord. I assure you, I am wasting no time. I am enjoying this meal to the fullest.
        - id: ch02-b05
          speaker: barmecide
          text: >-
            And what do you think of this bread? I find it especially fine.
        - id: ch02-b06
          speaker: schacabac
          text: >-
            My lord, I have never tasted bread so delicious.
        - id: ch02-b07
          speaker: barmecide
          text: >-
            Then eat all you want. I paid five hundred gold pieces for the woman who bakes it, just so I would never run out.
        - id: ch02-b08
          speaker: barber
          text: >-
            The Barmecide called for one dish after another, though not one ever came. He and Schacabac pretended to taste them all, discussing what made each imaginary course so fine. At last the old man declared that, after dining so well, they ought to drink wine. Schacabac objected at first and reminded him that wine was forbidden. But his host insisted that he could not possibly drink alone. In the end, my brother agreed to take only a little.
        - id: ch02-b09
          speaker: barber
          text: >-
            The Barmecide pretended to fill their glasses again and again. Before long Schacabac acted as though all that invisible wine had gone straight to his head. He struck his host such a blow that the old man fell to the floor. My brother even raised his hand to strike a second time.
        - id: ch02-b10
          speaker: barmecide
          text: >-
            Have you gone mad?
          emotion: angry
        - id: ch02-b11
          speaker: barber
          text: >-
            Schacabac stopped himself at once. He apologized and swore that the wine was entirely to blame. Instead of growing angry, the Barmecide laughed and embraced him.
        - id: ch02-b12
          speaker: barmecide
          text: >-
            I have searched a long time for a man exactly like you. From this day on, my home is your home. You were good enough to join my game and pretend to eat and drink when there was nothing here. Now I shall reward you with a supper that is real.
          emotion: happy
        - id: ch02-b13
          speaker: barber
          text: >-
            He clapped his hands. This time servants brought every dish the two men had imagined before and during their feast. Other servants sang and played instruments. The Barmecide treated Schacabac like an old friend and even dressed him in a robe from his own wardrobe.
    - id: ch03
      title: Fortune Lost Again
      blocks:
        - id: ch03-b01
          speaker: barber
          text: >-
            Twenty years went by. All that time, Schacabac remained with the Barmecide, caring for his great household and managing his affairs. Then his generous friend died without an heir, and every one of the dead man's possessions passed to the prince. The officials even stripped my brother of the few things that truly belonged to him. He was left as poor as he had ever been.
        - id: ch03-b02
          speaker: barber
          text: >-
            With nothing left to keep him in Bagdad, Schacabac joined a caravan of pilgrims bound for Mecca. Bedouins attacked the caravan, stole everything, and took all the pilgrims captive. My brother became the slave of a man who beat him every day, hoping pain would make him offer a ransom for his freedom.
        - id: ch03-b03
          speaker: barber
          text: >-
            Schacabac kept explaining that the beatings were useless because every one of his relatives was as poor as he was. At last the Bedouin tired of tormenting him. He put my brother on a camel, carried him to the top of a high, barren mountain, and abandoned him there.
        - id: ch03-b04
          speaker: barber
          text: >-
            Later, a passing caravan bound for Bagdad found out where Schacabac had been left and brought the news to me. I hurried to the mountain, rescued my brother, and carried him back to the city in a wretched state. That is the story I told the Caliph. When I reached the end, he burst into fits of laughter.
        - id: ch03-b05
          speaker: caliph
          text: >-
            They called you the Silent One, and no name was ever more fitting! Still, for reasons I need not explain, I order you to leave this city and never return.
        - id: ch03-b06
          speaker: barber
          text: >-
            I had no choice, so I obeyed. I wandered for several years. As soon as I heard that the Caliph had died, I rushed back to Bagdad, only to discover that all my brothers were dead.
        - id: ch03-b07
          speaker: barber
          text: >-
            It was then that I performed the great service for the young cripple which you have already heard about. You also know how deeply ungrateful he was. He would rather leave Bagdad than risk meeting me again. I searched for him from place to place, but found him only today, when I least expected it. And he was just as irritated with me as ever.
        - id: ch03-b08
          speaker: narrator
          text: >-
            With that, the barber ended his tale. The tailor then continued the story of the lame young man and the barber, which had already been told.
    - id: ch04
      title: The Tailor Appeals to the Sultan
      blocks:
        - id: ch04-b01
          speaker: tailor
          text: >-
            When the barber finally finished, we decided that the young man had been right to call him a terrible chatterbox. Even so, we wanted him to stay and share our feast. We sat at the table until the afternoon prayer. Then everyone left, and I returned to my shop.
        - id: ch04-b02
          speaker: tailor
          text: >-
            During that interval, the little hunchback came to me. He was already half drunk, singing and beating his drum. I took him home to entertain my wife, and she invited him to stay for supper. While he was eating fish, a bone lodged in his throat. We did everything we could, but it was no use. Within a short time, he seemed to be dead.
        - id: ch04-b03
          speaker: tailor
          text: >-
            It happened so suddenly that we lost our heads. Afraid the blame would fall on us, we carried the body to the home of a Jewish doctor. The doctor placed it in the purveyor's room. The purveyor then propped it upright in the street. There it was found, and people came to believe that the merchant had killed the poor man.
        - id: ch04-b04
          speaker: tailor
          text: >-
            That, Sire, is the whole story I was required to tell your Highness. Now you must decide what we deserve. Will it be mercy or punishment? Life or death?
        - id: ch04-b05
          speaker: narrator
          text: >-
            The Sultan of Kashgar had listened with such pleasure that the tailor and his friends began to hope.
        - id: ch04-b06
          speaker: sultan
          text: >-
            I admit that the barber, his brothers, and the lame young man interest me far more than my own jester's story. Before I send all four of you home and have the hunchback properly buried, I want to see the barber who has won your pardon. Since he is here in the city, an usher must go with you and bring him at once.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The usher and the tailor soon returned with an old man who was at least ninety years old.
        - id: ch04-b08
          speaker: sultan
          text: >-
            Silent One, I hear that you know many remarkable stories. Will you tell me some of them?
        - id: ch04-b09
          speaker: barber
          text: >-
            Let my stories wait, your Highness. First, please tell me why this Jew, this Christian, this Muslim, and that dead body are all here together.
        - id: ch04-b10
          speaker: sultan
          text: >-
            Why should that concern you?
        - id: ch04-b11
          speaker: narrator
          text: >-
            The Sultan smiled as he asked, but he saw that the barber had a reason for wanting to know. So he ordered someone to tell him the hunchback's entire tale.
    - id: ch05
      title: The Hunchback Opens His Eyes
      blocks:
        - id: ch05-b01
          speaker: barber
          text: >-
            That is certainly an astonishing story. Now let me examine the body.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The barber knelt and rested the hunchback's head upon his knees. He studied it closely. Then, without warning, he laughed so loudly that he toppled backward. Once he had recovered enough to speak, he turned to the Sultan.
        - id: ch05-b03
          speaker: barber
          text: >-
            This man is no more dead than I am. Watch what I do.
        - id: ch05-b04
          speaker: narrator
          text: >-
            He took a small medicine case from his pocket and rubbed balsam ointment on the hunchback's neck. Then he opened the man's mouth and used a pair of pincers to pull the fish bone from his throat. At once the hunchback sneezed, stretched, and opened his eyes.
        - id: ch05-b05
          speaker: narrator
          text: >-
            The Sultan and everyone who witnessed it could not decide which was more amazing. Was it the strong constitution of the hunchback, who had appeared dead through a whole night and most of the following day? Or was it the skill of the barber who had brought him back? From that moment on, everyone looked upon the barber as a great man.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The Sultan ordered the hunchback's history to be written down and placed in the archives beside the barber's story. In that way, people would remember the two tales together for all time.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Nor did the Sultan stop there. To make amends for all that the four accused men had suffered, he dressed the tailor, the doctor, the purveyor, and the merchant in robes from his own wardrobe before sending them home. He granted the barber a large pension and kept him close at court.
