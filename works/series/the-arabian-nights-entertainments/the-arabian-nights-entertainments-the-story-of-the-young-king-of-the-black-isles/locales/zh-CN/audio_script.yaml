audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严果断，对奇事充满执着的探究心
        timbre: 洪亮明净，沉稳有力
        pace: 从容，作出决定时干脆
        pitch: 中低音
    black_slave:
      display_name: 黑奴
      tts:
        delivery: 可怖威严，语气如同严厉审问
        timbre: 粗重低沉
        pace: 缓慢有压迫感
        pitch: 低音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 文雅有礼，悲伤深沉而克制
        timbre: 清润而疲惫
        pace: 舒缓
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 冷酷强势，面对所爱之人时哀切痴迷
        timbre: 华丽低柔，怒时锐利
        pace: 平稳，悲诉时缓慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 黑岛的灾变
      blocks:
        - id: ch01-b01
          speaker: young_man
          text: |-
            陛下，我的父亲马哈茂德原是黑岛王国的国王。那四座小山从前都是岛屿，所以我国才有了这个名字。如今的大湖，原先正是都城。听我讲完，您就会知道，这一切为何会变成现在的模样。
        - id: ch01-b02
          speaker: young_man
          text: |-
            父王六十六岁时去世，我继承了王位。我娶了自己的表妹，深深爱着她，也以为她同样爱我。
        - id: ch01-b03
          speaker: young_man
          text: |-
            一天下午，我半睡半醒地躺着，王后的两个侍女正在替我打扇。我听见一个侍女对另一个说，女主人早已不爱主人了，只要有机会，她恐怕还想杀掉他，因为她是个女巫。另一个侍女也赞同她的话。
        - id: ch01-b04
          speaker: young_man
          text: |-
            我暗中留意，没过多久，就发现她们说得没错。后来，王后宠爱的一个黑奴犯下一桩大罪，被我打成重伤，只剩下一口气。她求我准她在花园里修一座宫殿，住在那里为他哀哭悲叹。整整两年，她一直没有离开那里，也没有停止哭泣。
        - id: ch01-b05
          speaker: young_man
          text: |-
            最后，我劝她别再为那黑奴伤心。他不能说话，也不能动，全靠她的巫术才没有断气。谁知她听完怒不可遏，转身对我念起咒语。我立刻变成了这副模样，一半是人，一半是大理石。
          emotion: sad
        - id: ch01-b06
          speaker: young_man
          text: |-
            她又把人口众多、繁荣兴旺的都城变成湖泊和荒原。湖里四种颜色的鱼，就是城中原先的各族百姓。那四座山丘，就是使我国得名的四座岛屿。她亲口把这些告诉我，好让我更加痛苦。可她还不肯罢休。每天，她都要来用水牛皮鞭抽打我。
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: |-
            年轻国王讲完自己的悲惨遭遇，眼泪又一次夺眶而出。苏丹深受触动，心中也十分悲恸。
        - id: ch01-b08
          speaker: sultan
          text: |-
            那个恶毒的女人在哪里？她拼命吊住性命的那个可怜人，又藏在什么地方？
        - id: ch01-b09
          speaker: young_man
          text: |-
            我不知道她住在哪里。不过每天打完我以后，她都会在日出时去看那个黑奴，瞧他能不能开口同她说话。
        - id: ch01-b10
          speaker: sultan
          text: |-
            不幸的国王，我一定尽我所能，替你报仇。
    - id: ch02
      title: 苏丹设下计策
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            苏丹和年轻国王仔细商议，定下了复仇的计策，约好第二天动手。苏丹随后歇息下来。年轻国王则满怀希望，盼着自己终于能够获救。
        - id: ch02-b02
          speaker: narrator
          text: |-
            第二天，苏丹起身来到花园里的宫殿。黑奴就躺在里面。苏丹拔出宝剑，了结了他残存的一点性命，又把尸体扔进一口井里。随后，苏丹躺到黑奴原先的卧榻上，等着女巫前来。
        - id: ch02-b03
          speaker: narrator
          text: |-
            女巫先去找年轻国王，用鞭子狠狠抽了他一百下。之后，她走进那间屋子。她以为负伤的黑奴还躺在那里，却不知道卧榻上的人已经换成了苏丹。
        - id: ch02-b04
          speaker: queen
          text: |-
            亲爱的，你今天好些了吗？哪怕只同我说一个字也好。
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: |-
            苏丹模仿起埃塞俄比亚人的口音。
        - id: ch02-b06
          speaker: sultan
          text: |-
            你丈夫日夜哀号，我连觉都睡不成，怎么可能好起来？
        - id: ch02-b07
          speaker: queen
          text: |-
            我终于听见你说话了！你想让他变回原来的模样吗？
          emotion: happy
        - id: ch02-b08
          speaker: sultan
          text: |-
            想。快放他自由，别再让他的惨叫吵着我。
        - id: ch02-b09
          speaker: narrator
          text: |-
            王后立刻出去取来一杯水，对着杯子念起咒语。水很快沸腾起来，就像架在火上一样。她把水泼到年轻国王身上，他顿时恢复了原形，心中欣喜若狂。
        - id: ch02-b10
          speaker: queen
          text: |-
            马上离开这里，永远不许回来。否则，我就杀了你。
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: |-
            年轻国王走开以后，悄悄藏了起来。他要亲眼看看，苏丹的计策最后如何收场。
    - id: ch03
      title: 魔法解除
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            女巫回到哀泣宫，来到卧榻旁边。
        - id: ch03-b02
          speaker: queen
          text: |-
            你要我做的事，我已经办完了。
        - id: ch03-b03
          speaker: sultan
          text: |-
            这还不够，我的病并没有好。每天半夜，被你变成鱼的百姓都会从湖里探出头，高声喊着要向你报仇。快去让他们恢复原形。
        - id: ch03-b04
          speaker: narrator
          text: |-
            女巫匆匆来到湖边，对着湖水念了几句咒语。转眼间，四种颜色的鱼儿重新变成男人、女人和孩子，空荡荡的房屋和店铺里也再次挤满了人。
        - id: ch03-b05
          speaker: narrator
          text: |-
            苏丹的随从原本在湖边扎营。这时，他们忽然发现自己身处一座美丽的大城中央，全都惊讶得说不出话来。
        - id: ch03-b06
          speaker: narrator
          text: |-
            整座城的魔法一解除，女巫便返回宫殿。
        - id: ch03-b07
          speaker: queen
          text: |-
            你现在全好了吗？
        - id: ch03-b08
          speaker: sultan
          text: |-
            走近些。再近一点。
        - id: ch03-b09
          speaker: narrator
          text: |-
            女巫依言走近。苏丹猛然跃起，只用一剑，就把她劈成了两半。
    - id: ch04
      title: 年轻国王获救
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            苏丹随后找到了年轻国王。
        - id: ch04-b02
          speaker: sultan
          text: |-
            高兴起来吧。你那残忍的仇敌已经死了。
        - id: ch04-b03
          speaker: narrator
          text: |-
            年轻国王一遍又一遍地向苏丹道谢，怎么谢也觉得不够。
        - id: ch04-b04
          speaker: sultan
          text: |-
            现在，我该回自己的都城了。好在我的都城离你的这么近。
        - id: ch04-b05
          speaker: young_man
          text: |-
            离我的都城这么近？您可知道，从这里走到您的都城，足足要一年？先前这里中了魔法，您才能在几个小时内赶到。不过，我愿意陪您走完这段路。
          emotion: surprised
        - id: ch04-b06
          speaker: sultan
          text: |-
            有你陪我同行，我会非常高兴。我没有儿女，就立你为王位继承人吧。
        - id: ch04-b07
          speaker: narrator
          text: |-
            于是，苏丹与年轻国王一同启程。黑岛国王备下了丰厚的礼物，让苏丹满载而归。
    - id: ch05
      title: 回到都城
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            回到都城的第二天，苏丹召集满朝文武，把自己的全部经历告诉他们，又宣布要收年轻国王为义子，立他做王位继承人。
        - id: ch05-b02
          speaker: narrator
          text: |-
            随后，苏丹按照每个人身份的高低，分别赐下与他们地位相称的礼物。
        - id: ch05-b03
          speaker: narrator
          text: |-
            至于那个渔夫，正是他最先促成了年轻国王的获救。苏丹赏给他许多钱财。从此以后，渔夫和家人都过上了幸福的生活。
