audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    young_king:
      display_name: Young King of the Black Isles
      tts:
        delivery: noble, heartfelt, and quietly sorrowful
        timbre: clear and youthful
        pace: measured
        pitch: medium
    first_maid:
      display_name: First Maid
      tts:
        delivery: hushed and concerned
        timbre: soft and clear
        pace: moderate
        pitch: medium-high
    sultan:
      display_name: Sultan
      tts:
        delivery: commanding, courageous, and compassionate
        timbre: full and resonant
        pace: measured
        pitch: medium-low
    enchantress:
      display_name: Enchantress
      tts:
        delivery: intense, imperious, and changeable
        timbre: rich and sharp
        pace: deliberate
        pitch: medium
  chapters:
    - id: ch01
      title: The Young King's Sorrow
      blocks:
        - id: ch01-b01
          speaker: young_king
          text: >-
            You must understand, sire, that my father Mahmoud ruled this country before me. It is called the Black Isles after four small mountains that were once islands. Where you saw the great lake, our capital once stood. Now I will tell you how everything changed.
        - id: ch01-b02
          speaker: young_king
          text: >-
            My father died at sixty-six, and I became king. I married my cousin. I loved her dearly, and I believed she loved me too.
        - id: ch01-b03
          speaker: young_king
          text: >-
            Then one afternoon, I was half asleep while two of her maids fanned me. I heard one whisper to the other.
        - id: ch01-b04
          speaker: first_maid
          text: >-
            It is such a pity our mistress no longer loves our master. I think she would kill him if she could. She is an enchantress.
        - id: ch01-b05
          speaker: young_king
          text: >-
            I watched her after that and soon learned the maids were right. Later, I mortally wounded her favorite slave for a terrible crime. She begged to build a palace in the garden. For two years she stayed there, weeping and mourning over him.
        - id: ch01-b06
          speaker: young_king
          text: >-
            At last I asked her to stop grieving. Her magic was keeping the slave barely alive, though he could neither speak nor move. She flew into a rage. She spoke magic words over me, and in an instant I became what you see now, half man and half marble.
          emotion: sad
        - id: ch01-b07
          speaker: young_king
          text: >-
            Then that wicked enchantress changed my busy, flourishing capital into the lake and empty plain you saw. The four colors of fish are the different peoples who lived in the city. The four hills are the islands that gave my kingdom its name. She told me all this just to deepen my misery. And every day she comes here and strikes me with a buffalo-hide whip.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            When the young king finished his sorrowful tale, he burst into tears again. The Sultan was deeply moved.
        - id: ch01-b09
          speaker: sultan
          text: >-
            Tell me where this wicked woman is. And where is the wretched man she keeps barely alive?
        - id: ch01-b10
          speaker: young_king
          text: >-
            I do not know where she lives. But every day at sunrise, after beating me, she goes to see whether the slave can speak to her yet.
          emotion: sad
        - id: ch01-b11
          speaker: sultan
          text: >-
            Unfortunate king, I will do everything I can to avenge you.
    - id: ch02
      title: The Sultan's Plan
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The Sultan and the young king considered how best to defeat the enchantress. They settled on a plan to carry out the next day. Then the Sultan rested, while the young king let himself hope that freedom was near.
        - id: ch02-b02
          speaker: narrator
          text: >-
            In the morning, the Sultan went to the garden and entered the palace where the black slave lay. He drew his sword and ended the little life that remained in the man. Then he dropped the body into a well, took the slave's place on the couch, and waited.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The enchantress first visited the young king and struck him a hundred times. Afterward she entered the room where she believed her wounded slave was lying. But the man on the couch was the Sultan.
        - id: ch02-b04
          speaker: enchantress
          text: >-
            My dear slave, are you feeling better today? Please, speak just one word to me.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The Sultan answered in the speech of the Ethiopians.
        - id: ch02-b06
          speaker: sultan
          text: >-
            How can I recover when your husband's cries and groans never let me sleep?
        - id: ch02-b07
          speaker: enchantress
          text: >-
            What joy it is to hear your voice! Do you want me to restore his true shape?
          emotion: happy
        - id: ch02-b08
          speaker: sultan
          text: >-
            Yes. Set him free at once, and then I will no longer have to hear his cries.
    - id: ch03
      title: The Prince Restored
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The queen immediately left the Palace of Tears. She filled a cup with water and spoke words over it. The water began to boil as though it stood over a fire. Then she threw it over the prince, and at once he became fully human again.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Joy filled him, but the enchantress gave him a deadly warning.
        - id: ch03-b03
          speaker: enchantress
          text: >-
            Leave this place quickly and never return, or I will kill you.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The young king went away, then hid so that he could watch the rest of the Sultan's plan.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The enchantress returned to the Palace of Tears and approached the couch.
        - id: ch03-b06
          speaker: enchantress
          text: >-
            I have done what you asked of me.
        - id: ch03-b07
          speaker: sultan
          text: >-
            That is not enough to heal me. Every midnight, all the people you turned into fish raise their heads from the lake and cry out for vengeance. Go quickly and restore their proper shapes.
    - id: ch04
      title: The City Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The enchantress hurried to the lake and spoke magic words over the water. At once, the fish became men, women, and children again. Houses and shops reappeared and filled with people. The Sultan's attendants had camped beside the lake. Imagine their astonishment when they suddenly found themselves in the middle of a great and beautiful city.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Once the spell was broken, the queen went back to the palace.
        - id: ch04-b03
          speaker: enchantress
          text: >-
            Are you completely well now?
        - id: ch04-b04
          speaker: sultan
          text: >-
            Come closer. Closer still.
        - id: ch04-b05
          speaker: narrator
          text: >-
            She obeyed him. The Sultan leaped up and struck once with his sword, cutting her in two.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Then he went to find the young king.
        - id: ch04-b07
          speaker: sultan
          text: >-
            Rejoice! Your cruel enemy is dead.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The prince thanked the Sultan over and over.
    - id: ch05
      title: The Sultan's Heir
      blocks:
        - id: ch05-b01
          speaker: sultan
          text: >-
            Now I will return to my own capital. I am glad to discover that it lies so close to yours.
        - id: ch05-b02
          speaker: young_king
          text: >-
            Close to mine? It is a full year's journey from here. You arrived in only a few hours because this land was enchanted. But I will travel with you.
          emotion: surprised
        - id: ch05-b03
          speaker: sultan
          text: >-
            I would be very pleased to have you escort me. I have no children, so I will name you as my heir.
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Sultan and the young king began the journey together. The King of the Black Isles loaded the Sultan with splendid gifts for the road.
        - id: ch05-b05
          speaker: narrator
          text: >-
            On the day after the Sultan reached his capital, he gathered his court. He told them everything that had happened and announced that he meant to adopt the young king as his heir. Then he gave each man a gift suited to his rank.
        - id: ch05-b06
          speaker: narrator
          text: >-
            And what became of the fisherman? Since his actions had first set the young prince's rescue in motion, the Sultan rewarded him with a great deal of money. The fisherman and his family lived happily for the rest of their days.
