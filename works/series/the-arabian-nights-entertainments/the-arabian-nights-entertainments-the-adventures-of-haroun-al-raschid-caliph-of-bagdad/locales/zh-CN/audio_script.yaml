audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    caliph:
      display_name: 哈伦·拉希德
      tts:
        delivery: 威严果断，言谈中带着敏锐的好奇
        timbre: 洪亮圆润
        pace: 从容
        pitch: 中低音
    giafar:
      display_name: 贾法尔
      tts:
        delivery: 忠诚老练，进言时恭谨而善于劝说
        timbre: 清晰温厚
        pace: 稳健
        pitch: 中低音
    baba_abdalla:
      display_name: 巴巴·阿卜杜拉
      tts:
        delivery: 谦卑执拗，声音里压着深重悔恨
        timbre: 苍老粗哑
        pace: 缓慢
        pitch: 低音
    passerby:
      display_name: 过路人
      tts:
        delivery: 朴实直白，如实回答所知之事
        timbre: 自然清亮
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 哈里发微服出行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            哈里发哈伦·拉希德坐在宫里，怎么也提不起精神。他想来想去，只想知道世上还有没有什么新鲜事，能让自己消遣几个时辰。

            就在这时，大维齐尔贾法尔来到他面前。贾法尔既是他的老友，也是经过多年考验的忠臣。他深深行礼，按照规矩等主人先开口。哈里发却只回头看了他一眼，随后又倦倦地靠了回去。
        - id: ch01-b02
          speaker: narrator
          text: 贾法尔有要紧的话要说，可不愿因为这一片沉默就退下。他走到御座前，再行一礼，终于开了口。
        - id: ch01-b03
          speaker: giafar
          text: 信士的统帅，臣斗胆提醒陛下一件事。您答应过要微服出行，亲自看看城里是否秉公办事，秩序是否安定。今天正是您选定的日子。臣看您被忧愁缠住，实在难过。出去尽这份职责，也许正好能让您换换心绪。
        - id: ch01-b04
          speaker: caliph
          text: 你说得对，我竟全忘了。你去换衣服，我也去换。
        - id: ch01-b05
          speaker: narrator
          text: |-
            没过多久，两人重新来到殿里，都扮成了外乡商人。他们穿过暗门，走到城外，又转向幼发拉底河。乘小船渡河以后，两人沿着对岸的城区一路察看。

            他们没有发现需要干预的事。城中太平，处处井然有序，哈里发和维齐尔都很满意，于是走上一座通向王宫的桥。
    - id: ch02
      title: 桥上的盲人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两人刚过桥，一个年老的盲人便拦住他们讨钱。哈里发给了他一枚钱币，正要离开，盲人却抓住他的手，怎么也不肯松开。
        - id: ch02-b02
          speaker: baba_abdalla
          text: 好心的施主，不管您是谁，都请再答应我一个请求。求您打我一下。我该受这一打，就是再重的惩罚，我也受之无愧。
        - id: ch02-b03
          speaker: narrator
          text: 哈里发没想到他会提出这样的请求。他一边轻轻挣脱盲乞丐的手，一边温和地回答。
        - id: ch02-b04
          speaker: caliph
          text: 好人，这可不行。我才给了你施舍，转眼又来伤害你，那份善意还有什么用？
        - id: ch02-b05
          speaker: baba_abdalla
          text: 老爷，请原谅我这样冒犯，还一再纠缠。您若不肯打，就把钱收回去吧。我曾郑重发誓，每次收下施舍，都必须同时受罚。您若知道全部缘故，就会明白，这一下连我应受惩罚的十分之一也不到。
        - id: ch02-b06
          speaker: narrator
          text: |-
            盲人的话打动了哈里发。再说，他还有事情等着去办，最后只得答应，在那人的肩头轻轻打了一下。哈里发继续赶路，盲人在身后不停为他祝福。

            等走到盲人听不见的地方，哈里发对贾法尔说起这桩怪事。
        - id: ch02-b07
          speaker: caliph
          text: 这个人会有如此古怪的举动，背后一定有原因。我非弄清楚不可。你回去告诉他我的身份，再命他明日晚祷以后务必进宫见我。
        - id: ch02-b08
          speaker: narrator
          text: 贾法尔回到桥边，先给盲乞丐一枚钱币，再照他的要求打了一下。他传完哈里发的旨意，便赶回主人身边。
    - id: ch03
      title: 广场上的骑手
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            两人继续向王宫走。经过一处广场时，他们看见许多人围在一起。人群中有个衣着体面的年轻人，正催着一匹马绕空地飞奔。他又用马刺扎，又挥鞭抽，半点也不留情。可怜的马浑身都是白沫和鲜血。

            哈里发看得惊讶，便问一个过路人，这究竟是怎么回事。
        - id: ch03-b02
          speaker: passerby
          text: 谁也不知道，老爷。只知道每天到了这个时辰，同样的事都会再来一遍。
        - id: ch03-b03
          speaker: narrator
          text: 哈里发带着满腹疑问继续走。眼下他能做的，只有吩咐贾法尔传命，叫那名骑手明日与盲人一同进宫。
    - id: ch04
      title: 巴巴·阿卜杜拉进宫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            第二天晚祷以后，哈里发走进大殿。贾法尔跟随在后，带来了盲人、骑手，还有一个与眼下这段故事无关的人。三人都在御座前深深行礼。哈里发命他们起身，接着问盲人叫什么名字。
        - id: ch04-b02
          speaker: baba_abdalla
          text: 陛下，我叫巴巴·阿卜杜拉。
        - id: ch04-b03
          speaker: caliph
          text: |-
            巴巴·阿卜杜拉，你昨日讨钱的办法太过古怪，我险些当场禁止你继续这样当众闹事。我把你召来，是想知道你为什么立下这个怪誓。

            听过原因，我才能决定是否准你继续。依我看，你的做法会给别人留下很坏的榜样。现在把实情从头说来，什么也不许隐瞒。
        - id: ch04-b04
          speaker: narrator
          text: 巴巴·阿卜杜拉听了，心中十分不安。他伏倒在哈里发脚下，随后站起身来回答。
        - id: ch04-b05
          speaker: baba_abdalla
          text: |-
            信士的统帅，请宽恕臣。臣一再求陛下做那件事，表面看来确实毫无道理，世人自然也不会明白。

            可臣曾犯下极其可怕的罪。对臣而言，挨这一下只算很轻的赎罪。陛下若肯听完臣的故事，就会知道，无论多重的惩罚，都抵偿不了那桩罪过。
