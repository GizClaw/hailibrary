  chapters:
    - id: ch01
      title: The Caliph Goes Out in Disguise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Caliph Haroun-al-Raschid sat in his palace, wondering whether anything in the world could still amuse him for a few hours. Then Giafar, his grand-vizir and trusted old friend, appeared before him. Giafar bowed low. His duty required him to wait until his master spoke first. The Caliph only turned his head to look at him, then sank back into the same weary pose.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Giafar had come with something important to say. He had no intention of letting the Caliph's silence put him off, or of leaving without delivering his message. So he stepped before the throne, bowed low once more, and began to speak.
        - id: ch01-b03
          speaker: giafar
          text: >-
            Commander of the Faithful, may I remind you of a promise you made? You meant to go out in secret and see for yourself whether justice is being done and order kept throughout the city. This is the day you chose for it. Perhaps doing your duty will also draw you away from the sadness that troubles you.
        - id: ch01-b04
          speaker: caliph
          text: >-
            You are right. I had forgotten it completely. Go change your coat, and I will change mine.
        - id: ch01-b05
          speaker: narrator
          text: >-
            A few moments later, they both returned to the hall disguised as foreign merchants. They slipped through a secret door and went out into the open country. From there they turned toward the Euphrates, crossed the river in a small boat, and walked through the part of the town along the far bank.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Nothing they saw required them to step in. Pleased by the peace and good order of the city, the Caliph and his vizir headed for a bridge that led straight back toward the palace.
    - id: ch02
      title: The Blind Man on the Bridge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They had already crossed the bridge when an old blind man stopped them and begged for alms. The Caliph gave him a coin and started to move on, but the blind man caught his hand and would not let go.
        - id: ch02-b02
          speaker: baba_abdalla
          text: >-
            Kind sir, whoever you are, grant me one more request. Please strike me once. I have richly earned that blow, and a far harsher punishment besides.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The request astonished the Caliph. He answered gently as he tried to free his hand from the beggar's grasp.
        - id: ch02-b04
          speaker: caliph
          text: >-
            My good man, I cannot do that. What good would my charity be if I treated you so cruelly afterward?
        - id: ch02-b05
          speaker: baba_abdalla
          text: >-
            My lord, forgive me for being so bold and so persistent. Either take back your money or give me the blow I ask for. I have sworn a solemn oath never to accept anything unless I am punished as well. If you knew the whole story, you would see that even this is less than a tenth of what I deserve.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The man's words moved the Caliph. Perhaps the other business still waiting for him helped persuade him too. At last he gave in and struck the beggar lightly on the shoulder. Then he continued on his way while the blind man called blessings after him.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Once they were too far away for the beggar to hear, the Caliph spoke to Giafar.
        - id: ch02-b08
          speaker: caliph
          text: >-
            Something very strange must have driven that man to behave this way, and I want to know what it is. Go back. Tell him who I am, and order him to come to the palace tomorrow without fail, after the evening prayer.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Giafar returned to the bridge. First he gave the blind beggar a coin, then he gave him a blow. After delivering the Caliph's message, he rejoined his master.
    - id: ch03
      title: The Horseman in the Square
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The two men continued toward the palace. As they crossed a square, they found a crowd watching a young, well-dressed horseman. He was driving his horse around the open space at full speed, digging in his spurs and lashing it with his whip. The poor animal was covered with foam and blood.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Astonished by the sight, the Caliph asked one of the passersby what it meant.
        - id: ch03-b03
          speaker: passerby
          text: >-
            No one knows, sir. All I can tell you is that the same thing happens every day at this very hour.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The Caliph went on, still wondering about the rider. For the moment, all he could do was tell Giafar to order the horseman to appear at the palace at the same hour as the blind man.
    - id: ch04
      title: Baba-Abdalla Before the Caliph
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The next day, after the evening prayer, the Caliph entered the hall. Giafar followed, bringing the blind beggar, the horseman, and a third man whose story does not concern us here. All three bowed low before the throne. The Caliph told them to rise, then asked the blind man his name.
        - id: ch04-b02
          speaker: baba_abdalla
          text: >-
            Baba-Abdalla, your Highness.
        - id: ch04-b03
          speaker: caliph
          text: >-
            Baba-Abdalla, the way you begged for alms yesterday was so strange that I nearly ordered you on the spot to stop making such a public scandal. Instead, I sent for you so I could learn why you made this curious vow. Once I know the reason, I can judge whether you should be allowed to continue. It seems to me that your behavior sets a very bad example for everyone else. Now tell me the whole truth, and hide nothing.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The Caliph's words troubled Baba-Abdalla deeply. He threw himself at the ruler's feet. Then he rose and answered.
        - id: ch04-b05
          speaker: baba_abdalla
          text: >-
            Commander of the Faithful, I humbly ask you to pardon me. I kept begging you to do something that must have seemed completely senseless. To other people, it surely does. But to me, that blow is a small payment for a terrible sin I committed. If your Highness will listen to my story, you will understand that no punishment could ever make up for my crime.
