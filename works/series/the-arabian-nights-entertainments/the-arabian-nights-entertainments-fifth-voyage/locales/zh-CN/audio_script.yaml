audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    sailor_1:
      display_name: 水手甲
      tts:
        delivery: 老练直率，谈到海上危险时语气郑重
        timbre: 粗粝清晰
        pace: 适中
        pitch: 中低音
    sailor_2:
      display_name: 水手乙
      tts:
        delivery: 朴实警觉，言语干脆
        timbre: 明亮结实
        pace: 适中
        pitch: 中音
    sailor_3:
      display_name: 水手丙
      tts:
        delivery: 沉稳厚道，带着常年航海的阅历
        timbre: 温厚略哑
        pace: 稍缓
        pitch: 低音
    merchant_friend:
      display_name: 商人朋友
      tts:
        delivery: 热心周到，提醒危险时认真直接
        timbre: 清朗温和
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 鲁克鸟的复仇
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            从前吃过那么多苦，我还是过不惯安静日子。家里的享乐很快就让我厌倦，我又想出去看看新鲜事，碰碰新的险境。

            这一次，我没有搭别人的船。我在最近的海港亲自造了一艘，把一切都置办齐全。这样一来，想在哪个港口停靠，想停多久，都可以由自己做主。我带的货不够装满整条船，便邀了几位来自不同国家的商人同行。

            第一阵顺风到来，我们便扬帆出海。在大海上航行了很久以后，船停在一座陌生的荒岛旁。岛上虽然没人，大家仍决定进去探察。

            走不多远，我们发现了一枚鲁克鸟蛋，和我从前见过的那枚一样巨大。雏鸟就要破壳了，尖喙已经啄穿蛋壳。我知道大事不好，苦苦劝大家不要碰它，可那些商人根本不听。他们抡起斧头劈开蛋壳，杀了雏鸟，又生火割肉，烤来吃。我在一旁看得心惊胆战。

            这顿不祥的饭刚刚吃完，空中便落下两片巨大的阴影。船长认得那是什么，立刻大喊，说两只老鲁克鸟回来了，要我们赶快上船。

            大家奔回船上，升起风帆。可船还没有驶开，鲁克鸟已经飞到毁坏的巢上。它们看见幼鸟残破的尸体，一边盘旋，一边发出可怕的尖叫。过了一会儿，两只鸟忽然不见了。我们还以为逃过一劫，心里正暗自庆幸，它们却再次出现，直飞到大船上方。每只鸟的爪中，都抓着一块足以砸碎大船的巨岩。

            一只鲁克鸟先松开了爪子。岩石呼啸着落下来。舵手临危不乱，猛地把船转向另一边，石块擦着船身砸进海里。海水裂开一道深沟，我们几乎看见了海底。

            可大家连一口气都没喘匀，第二块巨岩已经轰然落下，正中船身。大船一下碎成千百片。乘客和水手有的被压死，有的被抛进海中。我也沉了下去，幸好浮回水面时并没有受伤。

            我一只手抓住浮木，一只手拼命划水，总算没有沉没。潮水把我送到一座岛上。那里的海岸又陡又多石，我仍设法爬了上去，随后一头倒在青草地上休息。
    - id: ch02
      title: 海老人
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            等力气恢复一些，我才开始打量四周。眼前简直像一座极乐花园。树木到处都是，枝头开着花，结着果，一道水晶般清亮的小溪在树影下弯弯曲曲地流过。

            夜里，我找了个舒适的角落睡觉。可是一想到自己孤零零地留在陌生地方，我还是会猛然惊醒，害怕地看看周围，又后悔没有留在家里安享清福。第二天，晨光让我重新有了勇气。我继续在林间行走，只是心里一直提防着，不知道下一刻又会遇到什么。

            走到岛内深处，我看见河边坐着一个弯腰驼背、十分衰弱的老人。我以为他也是遭遇海难的水手，便上前友好地问候。他不说话，只点了点头。

            我问他为什么待在这里，他打着手势，说想去河对岸摘果子，又求我背他过去。我看他年老体弱，便把他背起来，蹚过溪水。到了对岸，我弯下身子，请他下来。

            谁知，这个看起来一碰就倒的家伙，动作竟快得很。他猛地跃上我的肩膀，两腿勾住我的脖子，越夹越紧。我几乎不能呼吸，吓得失去知觉，倒在地上。说来也怪，直到今天，想起自己那时上当的模样，我还是忍不住想笑。

            等我醒来，那个仇敌还骑在我身上，只是把腿稍稍松开，让我能够喘气。他见我恢复过来，就用两只脚轮流踢我，逼我站起身。我只能背着他在树下踉跄行走，让他一路挑最好的果子吃。

            一整天都是这样。到了夜里，我累得半死，倒在地上，他仍死死夹着我的脖子。天刚蒙蒙亮，那双脚便在我身上乱敲，硬把我叫醒。我心里又恨又气，却只能爬起来，继续这场没完没了的苦行。
    - id: ch03
      title: 葫芦里的酒
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            一天，我从一棵树下经过，看见地上有几个干葫芦。我随手拿起一个，把里面掏空，又从随处可见的灌木上摘下几串葡萄，将汁水挤进葫芦。装满以后，我把它稳稳地支在树杈间。

            几天后，我背着那可恶的老人又走到这里。我经过树下时一把抓过葫芦，痛痛快快地喝了一口。葡萄汁已经酿成美酒，醇厚又解乏。我一高兴，竟忘了肩上还驮着那个讨厌的家伙，又唱又跳起来。

            老怪物立刻看出了酒的效力。他发觉我的脚步比平时轻快，便伸出枯瘦的手，把葫芦抢了过去。他先谨慎地尝一口，接着仰起头，把酒喝得一滴不剩。

            酒劲很强，葫芦又装得多。没过多久，他也含含糊糊地唱起来。我感觉到，那双像铁箍一样夹着我的怪腿终于松开了。我猛然用力，把他摔在地上。他倒在那里，从此再也没有动过。

            我终于摆脱这个诡异的老人，高兴得简直发狂。我一路跑着跳着来到海边，竟在那里遇到一群水手。他们的船泊在岛外，众人上岸，是为了品尝岛上的鲜美果实，再给船补足淡水。

            他们听了我的经历，全都惊讶得不得了。
        - id: ch03-b02
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: 你落在海老人手里，竟然还能活下来，真是上天保佑！他骑到谁的肩上，谁就会被他勒死，从来没人逃得掉。这座岛因为他的恶行出了名。我们这些商人和水手登岛以后，谁也不敢离开同伴太远。
          emotion: surprised
        - id: ch03-b03
          speaker: sindbad
          text: |-
            大家谈了一阵，便带我回到船上。船长待我也很和善。我们很快扬帆离岛，几天后来到一座繁华的大城。城里的房屋全用石头砌成，大船就在这里停泊。

            路上有位商人对我十分友好。他带我上岸，又领我去看一处专供外乡商人住宿的房舍。随后，他交给我一只大口袋，还指了指旁边一队同样背着口袋的人。
        - id: ch03-b04
          speaker: merchant_friend
          text: 跟着他们走，别人怎么做，你就怎么做。不过千万别跟丢了。你要是独自迷路，会有性命危险。
        - id: ch03-b05
          speaker: sindbad
          text: 说完，他替我备好食物，便向我告别。我背起口袋，跟着新同伴出了城。
    - id: ch04
      title: 猴子与椰子
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            没走多久，我就知道此行是为了装满一袋袋椰子。可等我见到椰子树，却怎么也想不出摘取的办法。那些树高得惊人，树干又细又光滑，人根本爬不上去。

            树冠间挤满了猴子，大大小小都有。它们灵巧地从这棵树跳到那棵树，一边好奇地看着我们，一边又因我们的到来而不安。

            同伴们弯腰捡起石头，纷纷向猴子投去。我起先很惊讶，觉得这些活泼的小兽并没有招惹我们。很快，我便明白了大家的用意，也兴冲冲地捡起石头加入他们。

            猴子受了骚扰，恼怒起来，也想用同样的办法还击。它们从树上扯下椰子，恶狠狠地朝我们砸来。我们根本不用爬树，没费多少力气，口袋就被落下来的椰子装满了。

            大家背不动更多以后，便一起返回城里。那位商人朋友买下我采来的椰子，又劝我继续这样做，等赚够回乡的钱再走。我听从他的劝告，一趟趟去采椰子，不久便积攒下一笔可观的钱财。
    - id: ch05
      title: 珍珠与归航
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: |-
            正巧这时，有一艘商船准备启航。我向朋友告别，带着自己存下的大批椰子上了船。

            我们先前往出产胡椒的岛屿，随后又到了科马里。那里盛产最上等的沉香木，还有一条永远不能更改的法律，禁止所有人饮酒。我用椰子换来胡椒和好沉香，又同几位商人一起出海采珠。

            我的采珠人运气好极了。没过多久，他们便捞上来数不清的珍珠，而且每一颗都又大又圆满。

            我带着这些宝物，欢欢喜喜地回到巴格达，再把它们卖成大笔金钱。我仍照从前的习惯，拿出十分之一周济穷人。劳碌终于结束，我又能享受财富带来的安逸生活了。
        - id: ch05-b02
          speaker: narrator
          text: 辛巴达讲完以后，吩咐人送给欣巴达一百枚金币，宾客们也纷纷告辞。到了第二天，众人再次赴宴。宴席结束，辛巴达便开始讲述自己的第六次航行。
