  chapters:
    - id: ch01
      title: The Rocs' Revenge
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            Even after all I had suffered, I could not settle down to a quiet life. Its pleasures soon tired me, and once again I wanted change and adventure. This time I built and fitted out a ship of my own at the nearest seaport. Then I could visit any port I pleased and stay as long as I wished.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            I did not have enough goods to fill the hold, so I invited merchants from several nations to sail with me. We left with the first good wind. After a long voyage across the open sea, we landed on an unknown island. No one lived there, but we went ashore to explore.
        - id: ch01-b03
          speaker: sindbad
          text: >-
            Before long, we found a roc's egg as huge as the one I had seen on an earlier voyage. It was almost ready to hatch. The young bird's beak had already broken through the shell. I begged the merchants to leave it alone, but they would not listen. They attacked it with their hatchets, broke the shell, and killed the young roc. Then they cut off pieces, lit a fire, and roasted the meat while I watched in horror.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            They had barely finished that unlucky meal when two enormous shadows darkened the sky above us. Our captain had seen such a thing before. He knew at once what those shadows meant.
        - id: ch01-b05
          speaker: captain
          text: >-
            The parent rocs are coming! Get back aboard as fast as you can!
          emotion: fearful
        - id: ch01-b06
          speaker: sindbad
          text: >-
            We rushed onto the ship and raised the sails. Before we had made any distance, the rocs reached their ruined nest. They hovered above it and gave terrible cries when they saw their young one torn apart. Then they vanished from sight for a moment. We began to tell ourselves that we had escaped.
        - id: ch01-b07
          speaker: sindbad
          text: >-
            Suddenly they returned, soaring high above our ship. Each roc carried an immense rock in its claws, ready to crush us. We watched and waited without breathing. Then one bird let go. Our helmsman kept his head and swung the ship hard aside. The rock plunged into the sea beside us and split the water so deeply that we could almost see the bottom.
        - id: ch01-b08
          speaker: sindbad
          text: >-
            We had hardly drawn a breath of relief when the second rock crashed into the middle of our unlucky ship. The vessel burst into a thousand pieces. Passengers and crew were crushed or hurled into the sea. I went under with everyone else, but fortune let me rise again unharmed. I caught a piece of wreckage and held it with one hand while I swam with the other. At last, the tide washed me onto an island.
        - id: ch01-b09
          speaker: sindbad
          text: >-
            The shore was steep and rocky, but I managed to climb it. Once I reached the green turf above, I lay down to rest.
    - id: ch02
      title: The Old Man of the Sea
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: >-
            When my strength returned, I began to examine the place where I had landed. The island seemed like a garden of delights. Trees stood everywhere, heavy with flowers and fruit, and a clear stream wound in and out beneath their shade. That night I found a cozy, sheltered place and slept well. Still, the thought of being alone in a strange land sometimes startled me awake. I would look around in alarm and wish with all my heart that I had stayed safely at home.
        - id: ch02-b02
          speaker: sindbad
          text: >-
            Morning sunlight gave me courage. I walked among the trees again, though I worried about what I might find. Some distance inland, I saw a bent, feeble old man sitting beside the river. I thought he might be another shipwrecked sailor, so I greeted him kindly. He answered only with a nod.
        - id: ch02-b03
          speaker: sindbad
          text: >-
            What are you doing here?
        - id: ch02-b04
          speaker: sindbad
          text: >-
            He made signs that he wanted to cross the river and gather fruit. He seemed to ask me to carry him. I felt sorry for the poor old man, so I lifted him onto my back and waded across. At the other bank, I bent down for him.
        - id: ch02-b05
          speaker: sindbad
          text: >-
            Here we are. You can get down now.
        - id: ch02-b06
          speaker: sindbad
          text: >-
            But he did nothing of the kind. Even now, the memory makes me laugh. This creature, who had looked so weak, sprang nimbly onto my shoulders. He hooked his legs around my neck and squeezed until I could scarcely breathe. Terror overcame me, and I fell senseless to the ground.
        - id: ch02-b07
          speaker: sindbad
          text: >-
            When I came to my senses, my enemy was still in place, though he had loosened his grip just enough to let me breathe. As soon as he saw that I was awake, he skillfully jabbed me with one foot and then the other. I had to get up and stagger beneath the trees with him on my back while he reached out, picked the finest fruit, and ate it.
        - id: ch02-b08
          speaker: sindbad
          text: >-
            This went on for the whole day. At night I dropped to the ground, nearly dead from weariness, but the terrible old man still kept his legs locked around my neck. At the first glimmer of morning, he greeted the daylight by drumming his heels against me. I had no choice but to wake, rise, and begin that miserable march again, with rage and bitterness in my heart.
        - id: ch02-b09
          speaker: sindbad
          text: >-
            One day I passed a tree with several dry gourds beneath it. I picked one up, cleaned it out, and filled it with juice pressed from bunches of grapes that grew all around. Then I left the full gourd wedged in the fork of a tree.
        - id: ch02-b10
          speaker: sindbad
          text: >-
            A few days later, the hateful old man made me pass that way again. I snatched up the gourd and drank. The juice had become excellent wine. It refreshed me so much that I forgot my burden for a while and began to sing and dance.
        - id: ch02-b11
          speaker: sindbad
          text: >-
            The old monster quickly noticed that the drink made me carry him more easily. He reached out one skinny hand and seized the gourd. First he tasted it carefully. Then he drained every drop. The wine was strong, and there had been plenty of it. Soon he began his own strange singing, and at last I felt those iron legs loosen around my neck.
        - id: ch02-b12
          speaker: sindbad
          text: >-
            With one mighty effort, I threw him to the ground. He never moved again. I was so delighted to be free of that uncanny old man that I ran and leaped all the way to the shore.
    - id: ch03
      title: Rescue and a Warning
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: >-
            By wonderful good luck, I found some mariners on the beach. Their ship lay at anchor offshore, and they had come to gather the island's delicious fruit and refill their water supply. I told them how I had escaped.
        - id: ch03-b02
          speakers: [mariner_1, mariner_2, mariner_3]
          ensemble: chorus
          text: >-
            That was the Old Man of the Sea! It is a wonder he did not strangle you. He has killed everyone else whose shoulders he managed to climb onto.
          emotion: surprised
        - id: ch03-b03
          speakers: [mariner_1, mariner_2, mariner_3]
          ensemble: chorus
          text: >-
            Everyone knows this island for his wicked deeds. No merchant or sailor here dares to wander far from his companions.
        - id: ch03-b04
          speaker: sindbad
          text: >-
            After we had talked for a while, the mariners took me out to their ship. The captain received me kindly, and we soon sailed away from that dreadful island. Several days later, we reached a large and prosperous-looking town. Every house there was built of stone.
        - id: ch03-b05
          speaker: sindbad
          text: >-
            A merchant who had treated me warmly during the voyage took me ashore with him. He showed me a lodging set aside for foreign merchants. Then he gave me a large sack and pointed to a whole group of men who were equipped with sacks just like mine.
        - id: ch03-b06
          speaker: merchant_friend
          text: >-
            Go with those men and follow their example. Do not lose sight of them. If you wander away, your life will be in danger.
        - id: ch03-b07
          speaker: sindbad
          text: >-
            He gave me provisions and said farewell. Then I set out with my new companions.
    - id: ch04
      title: The Monkeys and the Cocoanuts
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: >-
            I soon learned that we were going to fill our sacks with cocoanuts. When we reached the trees, I could not imagine how we would gather them. The palms were immensely tall, with slender trunks too smooth to climb.
        - id: ch04-b02
          speaker: sindbad
          text: >-
            Monkeys, big and small, crowded the crowns of the palms. They bounded from tree to tree with amazing skill. They watched us curiously, but our arrival clearly disturbed them. Then my companions gathered stones and began throwing them at the lively creatures. The monkeys looked harmless to me, so I was astonished and could not understand what the men were doing.
        - id: ch04-b03
          speaker: sindbad
          text: >-
            The reason soon became clear. The angry monkeys wanted to pay us back in our own coin. They tore cocoanuts from the palms and hurled them down at us with spiteful gestures. As soon as I understood the plan, I joined my companions heartily. With very little work, our sacks were filled with fruit we could never have reached in any other way.
        - id: ch04-b04
          speaker: sindbad
          text: >-
            Once we had as much as we could carry, we returned to town. My merchant friend bought my share. He advised me to keep gathering cocoanuts until I had earned enough money to travel home. I followed his advice, and before long I had made a considerable sum.
    - id: ch05
      title: Home to Bagdad
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: >-
            Just then, I heard that a trading ship was about to sail. I said goodbye to my friend and boarded with a good supply of cocoanuts. We went first to the islands where pepper grows, and then to Comari. That land produces the finest aloes wood, and an unchanging law there forbids anyone to drink wine.
        - id: ch05-b02
          speaker: sindbad
          text: >-
            In Comari, I traded my cocoanuts for pepper and fine aloes wood. I also went pearl fishing with some of the other merchants from the ship. My divers had extraordinary luck. In very little time, I owned an immense number of pearls, all of them large and perfect.
        - id: ch05-b03
          speaker: sindbad
          text: >-
            With all these treasures, I returned joyfully to Bagdad. I sold them there for great sums of money. As I had done before, I made sure to give one tenth of it to the poor. After that, I rested from my labors and comforted myself with every pleasure my riches could provide.
        - id: ch05-b04
          speaker: narrator
          text: >-
            With the tale finished, Sindbad ordered that Hindbad be given one hundred sequins. The guests departed. After the next day's feast, Sindbad began the story of his sixth voyage.
