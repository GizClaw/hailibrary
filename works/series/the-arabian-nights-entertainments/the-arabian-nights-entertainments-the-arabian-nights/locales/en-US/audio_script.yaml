  chapters:
    - id: ch01
      title: Two Brothers and a Cruel Vow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The old chronicles tell of the Sassanidae, a dynasty that ruled for nearly four hundred years. Their lands stretched from Persia all the way toward the borders of China, beyond even the great river Ganges. One king of that line was praised as the finest ruler of his age. His people loved him, and the rulers of neighboring lands feared him. When he died, he left behind a kingdom more prosperous and powerful than any king before him had done.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Two sons survived him, and they loved each other dearly. The elder, Schahriar, inherited the empire. Yet its laws would not let him share the realm with his brother Schahzeman, and that troubled him deeply. Ten years passed before Schahriar found a way. He separated Great Tartary from the Persian Empire and made his brother its king.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Sultan Schahriar had a wife he loved more than anything in the world. His greatest happiness was surrounding her with splendor and giving her beautiful clothes and the finest jewels. Then, after several years, he discovered by chance that she had completely deceived him. Everything he learned about her conduct filled him with shame and sorrow. He felt bound to carry out the law of the land, so he ordered the grand vizir to put her to death.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The shock nearly broke the Sultan's mind. He became certain that every woman was as wicked as his wife and would prove it if only she were found out. He decided the world would be better with fewer women in it. From then on, he married a new wife each evening. The following morning, she was strangled before the grand vizir.
        - id: ch01-b05
          speaker: narrator
          text: >-
            It was the vizir's duty to find each of these unhappy brides and bring her to the Sultan. The poor man carried out his task with great reluctance, but there was no escape. Each day brought the same horror. A girl became a bride at night, and by morning a wife was dead.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The Sultan's cruelty filled the whole town with horror. Nothing could be heard but cries and mourning. In one house, a father wept for the daughter he had lost. In another, a mother trembled over what might happen to her child. Once, the people had showered blessings on the Sultan. Now the very air seemed full of curses.
    - id: ch02
      title: Scheherazade's Request
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The grand vizir had two daughters. The elder was Scheherazade, and the younger was Dinarzade. Dinarzade was much like other girls, but Scheherazade was unusually clever and brave. Her father had found the best teachers for her. She had studied philosophy, medicine, history, and the fine arts. She was also more beautiful than any other girl in Persia.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Scheherazade was her father's pride and joy. One day, as they talked together, she asked him for a favor.
        - id: ch02-b03
          speaker: scheherazade
          text: >-
            Father, there is something I want to ask of you. Will you grant it?
        - id: ch02-b04
          speaker: grand_vizir
          text: >-
            If what you ask is just and reasonable, I could never refuse you.
        - id: ch02-b05
          speaker: scheherazade
          text: >-
            Then please hear me out. I mean to put an end to the Sultan's cruelty and save the girls and their mothers from the dreadful fate hanging over them.
        - id: ch02-b06
          speaker: grand_vizir
          text: >-
            That would be a wonderful thing. But how could you possibly do it?
        - id: ch02-b07
          speaker: scheherazade
          text: >-
            Every day, you must find the Sultan another wife. Father, for all the love you bear me, let that honor fall to me.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The grand vizir started back in horror.
        - id: ch02-b09
          speaker: grand_vizir
          text: >-
            Have you lost your senses? Why would you ever think of such a thing? You know what it means to become the Sultan's bride!
          emotion: fearful
        - id: ch02-b10
          speaker: scheherazade
          text: >-
            Yes, Father. I know exactly what it means, and I am not afraid. If I fail, at least my death will have been for a noble purpose. If I succeed, I will have done our country a great service.
        - id: ch02-b11
          speaker: grand_vizir
          text: >-
            No. I will never agree to this. If the Sultan ordered me to drive a dagger into your heart, I would have to obey him. How could any father bear such a task? If you do not fear death for yourself, then think of the anguish you would cause me.
          emotion: fearful
        - id: ch02-b12
          speaker: scheherazade
          text: >-
            I ask you once more, Father. Will you grant my request?
        - id: ch02-b13
          speaker: grand_vizir
          text: >-
            You still will not give this up? Why are you so determined to destroy yourself?
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: >-
            Scheherazade would not be moved by anything he said. At last, the grand vizir gave way in despair. With a heavy heart, he went to the palace and told the Sultan that he would bring Scheherazade to him the following evening.
    - id: ch03
      title: The Grand Vizir Gives Way
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The news astonished Sultan Schahriar.
        - id: ch03-b02
          speaker: schahriar
          text: >-
            How could you decide to sacrifice your own daughter to me?
        - id: ch03-b03
          speaker: grand_vizir
          text: >-
            Sire, this is what she herself wants. Even the terrible fate waiting for her could not make her turn back.
        - id: ch03-b04
          speaker: schahriar
          text: >-
            Make no mistake, Vizir. You will have to take her life with your own hands. If you refuse, I swear your head will pay the price.
        - id: ch03-b05
          speaker: grand_vizir
          text: >-
            Sire, I will obey you, whatever it costs me. I may be her father, but I am also your subject.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The Sultan told him he could bring his daughter as soon as he wished. The vizir returned home and told Scheherazade everything that had passed between them. She received the news as though it were the happiest thing in the world. She warmly thanked her father for giving in to her wish.
        - id: ch03-b07
          speaker: narrator
          text: >-
            But the grand vizir was still bent beneath his grief. Scheherazade tried to comfort him. She said she hoped the day would come when he would never regret allowing her to marry the Sultan. Then she began preparing herself for the wedding and asked that her sister Dinarzade be sent to speak with her.
    - id: ch04
      title: The Sisters Make a Plan
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When the two sisters were alone, Scheherazade explained what she needed Dinarzade to do.
        - id: ch04-b02
          speaker: scheherazade
          text: >-
            Dear sister, I need your help with something very important. Father is taking me to the palace to marry the Sultan. When the Sultan receives me, I will ask one last favor. I will beg him to let you sleep in our chamber, so that you can be with me on the last night of my life.
        - id: ch04-b03
          speaker: scheherazade
          text: >-
            If he agrees, as I hope he will, wake me one hour before dawn. Say, “My sister, if you are still awake, please tell me one of your charming stories before the sun rises.” Then I will begin. By doing this, I hope to free our people from the terror that rules their lives.
        - id: ch04-b04
          speaker: dinarzade
          text: >-
            I will gladly do exactly as you ask.
    - id: ch05
      title: One Hour Before Dawn
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At the usual hour, the grand vizir led Scheherazade to the palace and left her alone with the Sultan. Schahriar told her to lift her veil. When she did, her beauty amazed him. Then he noticed the tears in her eyes and asked what was wrong.
        - id: ch05-b02
          speaker: scheherazade
          text: >-
            Sire, I have a sister who loves me as dearly as I love her. Please let her sleep in this room tonight. It is the last night we will ever spend together.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: >-
            Schahriar granted her request, and Dinarzade was brought to the chamber. One hour before daybreak, she woke and spoke the words she had promised to say.
        - id: ch05-b04
          speaker: dinarzade
          text: >-
            Dear sister, if you are not asleep, please tell me one of your charming stories before the sun comes up. This is the last time I will have the joy of hearing you.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Scheherazade did not answer her sister. Instead, she turned to the Sultan.
        - id: ch05-b06
          speaker: scheherazade
          text: >-
            Will Your Highness allow me to do as my sister asks?
        - id: ch05-b07
          speaker: schahriar
          text: >-
            Gladly.
        - id: ch05-b08
          speaker: narrator
          text: >-
            And so Scheherazade began her story.
