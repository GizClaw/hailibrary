audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    shahriar:
      display_name: 山鲁亚尔
      tts:
        delivery: 威严冷峻，话语简短而不容违抗
        timbre: 深沉有力，带着阴郁的锋芒
        pace: 稳重偏慢，威胁时字字分明
        pitch: 低音
    vizir:
      display_name: 大维齐尔
      tts:
        delivery: 忠谨克制，面对女儿时流露深切忧虑
        timbre: 苍老厚实，略带疲惫
        pace: 平稳，激动时稍快
        pitch: 中低音
    scheherazade:
      display_name: 山鲁佐德
      tts:
        delivery: 聪慧坚定，从容中含着勇气
        timbre: 清亮柔和，意志坚韧
        pace: 从容清楚，关键请求略作停顿
        pitch: 中音
    dinarzade:
      display_name: 迪娜佐德
      tts:
        delivery: 真挚柔顺，依照姐姐嘱咐时自然恳切
        timbre: 年轻清澈，温柔亲近
        pace: 轻缓流畅
        pitch: 中高音
  chapters:
    - id: ch01
      title: 两位王子与苏丹的暴行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            古时候，萨珊王朝统治了约四百年。它的疆土从波斯伸向中国边境，甚至越过恒河。史册称颂过这个王朝的一位国王，说他是当时最贤明的君主。百姓爱戴他，邻国畏惧他。他去世时，留下的国家比历代任何国王留下的都富庶、强盛。
        - id: ch01-b02
          speaker: narrator
          text: |-
            国王身后留下两个感情深厚的儿子。长子山鲁亚尔继承了王位，帝国的法令却不许他和弟弟沙赫泽曼分享自己的国土，这让他真正感到痛苦。整整十年，这件事一直萦绕在他心头。最后，他从波斯帝国划出大鞑靼国，让弟弟在那里做了国王。
        - id: ch01-b03
          speaker: narrator
          text: |-
            山鲁亚尔爱自己的妻子胜过世间的一切。他把最华美的衣裳、最珍贵的珠宝全都送给她，只愿她生活在荣光与富贵里，这便是他最大的快乐。几年后，他却偶然发现，妻子一直在欺骗他。她的种种行为竟如此恶劣，苏丹又羞又痛，只得依照国法，下令让大维齐尔将她处死。
        - id: ch01-b04
          speaker: narrator
          text: |-
            这一击几乎使山鲁亚尔失去理智。他认定天下女子骨子里都像王后一样邪恶，只不过有些没有被揭穿，还说世上的女人越少越好。从那以后，他每晚娶一位新娘，第二天清晨便命人当着大维齐尔的面把她绞死。为苏丹寻找这些不幸新娘的差事，也由大维齐尔承担。他万般不愿，却没有逃脱的办法。于是，每天都有一位姑娘出嫁，又有一位妻子死去。
        - id: ch01-b05
          speaker: narrator
          text: |-
            这种暴行使全城笼罩在极度的恐惧里，到处只有哭声和哀号。这一家，父亲正为失去女儿而痛哭。那一家，母亲正在为孩子将来的命运发抖。过去，百姓把祝福纷纷献给苏丹。如今，空中回荡的只剩诅咒。
    - id: ch02
      title: 山鲁佐德的请求
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            大维齐尔自己也有两个女儿。姐姐叫山鲁佐德，妹妹叫迪娜佐德。妹妹没有什么异于寻常姑娘的才华，姐姐的聪慧与勇气却无人能及。父亲请最好的老师教她哲学、医学、历史和各种美艺。除此以外，她的容貌也胜过波斯王国里的所有姑娘。
        - id: ch02-b02
          speaker: narrator
          text: |-
            有一天，大维齐尔正和山鲁佐德说话。这个长女一直是他的骄傲与安慰。山鲁佐德忽然向父亲提出一个请求。
        - id: ch02-b03
          speaker: scheherazade
          text: 父亲，我想求您一件事。您愿意答应吗？
        - id: ch02-b04
          speaker: vizir
          text: 只要你的请求合情合理，我什么都可以答应。
        - id: ch02-b05
          speaker: scheherazade
          text: 那就请您听我说。我一定要阻止苏丹继续这种暴行，救下那些日日担惊受怕的姑娘和母亲。
        - id: ch02-b06
          speaker: vizir
          text: 若能做到，当然再好不过。可你有什么办法呢？
        - id: ch02-b07
          speaker: scheherazade
          text: 每天为苏丹送去新娘的人就是您。父亲，看在您疼爱我的分上，请把这份荣耀赐给我，让我去做他的新娘。
        - id: ch02-b08
          speaker: narrator
          text: 大维齐尔吓得猛然后退。
        - id: ch02-b09
          speaker: vizir
          text: 你疯了吗？你怎么会想到这种事？做苏丹的新娘是什么下场，你难道还不明白？
          emotion: fearful
        - id: ch02-b10
          speaker: scheherazade
          text: 父亲，我明白得很，可我不害怕。要是失败，我会死得光荣。要是成功，我就能为国家立下大功。
        - id: ch02-b11
          speaker: vizir
          text: 不行，我绝不会同意！苏丹若命我把匕首刺进你的心口，我也只能服从。哪有父亲受得了这种事？你就算不怕死，也该想想我会多么痛苦。
          emotion: fearful
        - id: ch02-b12
          speaker: scheherazade
          text: 父亲，我再问您一次。您愿意答应我的请求吗？
        - id: ch02-b13
          speaker: vizir
          text: 你怎么还这样固执？为什么非要亲手毁掉自己？
        - id: ch02-b14
          speaker: narrator
          text: 无论父亲怎样劝说，山鲁佐德都坚决不肯听从。大维齐尔终于彻底绝望，只得让步。他满怀悲伤地走进王宫，禀告苏丹，第二天傍晚会把女儿送来。
    - id: ch03
      title: 苏丹的警告
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 苏丹听完，惊讶极了。
        - id: ch03-b02
          speaker: shahriar
          text: 你怎么舍得把亲生女儿献给我？
          emotion: surprised
        - id: ch03-b03
          speaker: vizir
          text: 陛下，这是她自己的愿望。她明知悲惨的命运就在前面，还是不肯回头。
        - id: ch03-b04
          speaker: shahriar
          text: 维齐尔，你可别弄错。到时候，你必须亲手取她性命。你若不肯服从，就拿自己的头来偿命。
        - id: ch03-b05
          speaker: vizir
          text: 陛下，无论代价是什么，我都会服从。我的确是她的父亲，可我也是您的臣子。
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: 苏丹便叫大维齐尔什么时候愿意，就什么时候把女儿送来。维齐尔回家告诉山鲁佐德，她听后竟像得到世上最称心、最愉快的好消息。她热切地感谢父亲成全自己的愿望。见父亲仍被悲伤压得抬不起头，她又说，希望父亲永远不会后悔准许她嫁给苏丹。
        - id: ch03-b07
          speaker: narrator
          text: 随后，山鲁佐德为婚礼做起准备，又请父亲叫来妹妹迪娜佐德。等姐妹俩单独相处，她便把自己的安排告诉妹妹。
        - id: ch03-b08
          speaker: scheherazade
          text: 好妹妹，有件极要紧的事，我需要你帮忙。父亲就要带我进宫，嫁给苏丹。陛下接见我以后，我会求他最后开一次恩，让你睡在我们的寝殿里，陪我度过生命中的最后一夜。
        - id: ch03-b09
          speaker: scheherazade
          text: 他若答应，你一定要在天亮前一个时辰叫醒我，然后这样说：“姐姐，你若还没睡着，就在太阳升起以前，给我讲一个迷人的故事吧。”到时我会开始讲。我希望用这个办法，让百姓摆脱笼罩全城的恐惧。
        - id: ch03-b10
          speaker: dinarzade
          text: 姐姐，我一定照你的话做。
    - id: ch04
      title: 黎明前的故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            到了往常的时刻，大维齐尔领着山鲁佐德来到王宫，把她独自留在苏丹身边。苏丹命她揭下面纱，一见她的美貌，不禁十分惊叹。可是，山鲁佐德眼里满是泪水。苏丹便问她究竟出了什么事。
        - id: ch04-b02
          speaker: scheherazade
          text: 陛下，我有一个妹妹。她爱我，就像我爱她一样深。求您让她今夜也睡在这间寝殿里吧，因为这是我们姐妹最后一次相聚了。
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 山鲁亚尔准许了她的请求，宫里便派人接来迪娜佐德。
        - id: ch04-b04
          speaker: narrator
          text: 离天亮还有一个时辰，迪娜佐德醒来，照姐姐事先交代的那样开了口。
        - id: ch04-b05
          speaker: dinarzade
          text: 好姐姐，你若还没睡着，求你趁太阳还没升起，给我讲一个迷人的故事吧。这是我最后一次有福听你讲故事了。
        - id: ch04-b06
          speaker: narrator
          text: 山鲁佐德没有回答妹妹，而是转身询问苏丹。
        - id: ch04-b07
          speaker: scheherazade
          text: 陛下准许我满足妹妹的请求吗？
        - id: ch04-b08
          speaker: shahriar
          text: 当然可以。
        - id: ch04-b09
          speaker: narrator
          text: 于是，山鲁佐德开始讲述。
