  chapters:
    - id: ch01
      title: Envy and the Old Well
      blocks:
      - id: ch01-b01
        speaker: second_calender
        text: >-
          In a town of modest size, two men lived next door to each other. They had not been neighbors long when one began to hate the other with bitter envy. The innocent man hoped distance might make his enemy forget him, so he sold his house and its few furnishings. Then he moved to the capital, which stood not far away.
      - id: ch01-b02
        speaker: second_calender
        text: >-
          Half a mile outside the city, he bought a pleasant little home. It had a large garden and a good-sized courtyard, with an old well at its center. The man wanted a quieter life than the one he had left behind. He put on the robes of a dervish and divided his house into many small cells. Before long, a number of other dervishes had settled there with him. Word of his goodness spread little by little, first nearby and then much farther. People of every rank came to visit him and ask for his prayers, including several of the most important people in the country.
      - id: ch01-b03
        speaker: second_calender
        text: >-
          Before long, news of this growing fame reached his old neighbor. Instead of forgetting his envy, the wicked man let it grow stronger than ever. He vowed that he would not rest until he had found some way to harm the dervish he hated. He left his house and his business to look after themselves and traveled to the new monastery. The innocent founder suspected nothing. He remembered only that they had once been neighbors, and welcomed his visitor with every sign of warmth.
      - id: ch01-b04
        speaker: envious_man
        text: >-
          I have come to ask your advice about a private matter of great importance. No one else must hear it. Night is near, so please send the other dervishes to their cells and meet me alone in the courtyard.
      - id: ch01-b05
        speaker: second_calender
        text: >-
          The dervish agreed without delay and sent his companions into their cells. When the two men were alone, the visitor began telling a long story. They walked back and forth across the courtyard as he spoke. Step by step, without seeming to do so, he guided the dervish closer to the old well. When they stood beside its edge, he suddenly seized his host and dropped him into the darkness. Then he ran away before anyone could see him. He congratulated himself as he fled, certain that the man he hated was dead and would never trouble him again.
      - id: ch01-b06
        speaker: second_calender
        text: >-
          But he was wrong. Fairies and genii had lived in that old well for many years, though no human knew it. They caught the dervish as he fell, and he was not hurt at all. He could see nothing in the darkness, but he knew some wonder must have saved him. Otherwise, he would have struck the wall of the well and died. He lay still and listened.
      - id: ch01-b07
        speaker: fairy
        text: >-
          Can you guess who this man is, the one we have just saved from death?
      - id: ch01-b08
        speaker: second_fairy
        text: >-
          No. Who is he?
      - id: ch01-b09
        speaker: fairy
        text: >-
          His heart is so good that he left his old town, hoping to cure a neighbor of his envy by putting distance between them. Yet people soon came to honor him here, and that only deepened his enemy's hatred. Today the envious man came intending to kill him. Without our help, he would have succeeded on the very day before the Sultan plans to visit this holy dervish and beg him to pray for the princess.
      - id: ch01-b10
        speaker: second_fairy
        text: >-
          What has happened to the princess? Why does she need the dervish's prayers?
      - id: ch01-b11
        speaker: fairy
        text: >-
          She has fallen under the power of Maimoum, son of Dimdim. The chief dervish could easily cure her if he knew the secret. A black cat lives in his monastery, and the very tip of its tail is white. He must pull seven white hairs from that tail, burn three of them, and let the smoke rise around the princess's head. She will be completely freed, and Maimoum will never dare come near her again.
      - id: ch01-b12
        speaker: second_calender
        text: >-
          The fairies and genii stopped speaking, but the dervish remembered every word. When morning came, he noticed a broken place in the side of the well where his hands and feet could find a hold. He climbed out easily. His companions had been unable to imagine what had become of him, and they were overjoyed when he appeared again. He told them that the previous day's guest had tried to take his life. Then he withdrew to his own cell.
      - id: ch01-b13
        speaker: second_calender
        text: >-
          Soon the black cat came in, as it did every morning, to greet its master. The dervish lifted the animal onto his knee. When the moment came, he pulled seven white hairs from its tail and set them aside until they were needed.
    - id: ch02
      title: The Dervish's Reward
      blocks:
      - id: ch02-b01
        speaker: second_calender
        text: >-
          The sun had barely risen when the Sultan arrived at the monastery gate with a great company. He meant to leave nothing undone that might save his daughter. The dervishes received him with deep respect. He quickly explained why he had come, then drew their chief aside.
      - id: ch02-b02
        speaker: sultan
        text: >-
          Noble sheik, perhaps you have already guessed what I have come to ask of you.
      - id: ch02-b03
        speaker: dervish
        text: >-
          Yes, sire. If I am right, the princess's illness has brought me this honor.
      - id: ch02-b04
        speaker: sultan
        text: >-
          It has. If your prayers can free my daughter from the strange illness that holds her, you will give me my life back as well.
      - id: ch02-b05
        speaker: dervish
        text: >-
          Have the princess brought here, Your Highness. I will see what I can do.
      - id: ch02-b06
        speaker: second_calender
        text: >-
          Filled with hope, the Sultan sent orders for the princess to set out as soon as possible with her usual attendants. When she arrived, her veil was so thick that the dervish could not see her face. He asked for a brazier to be held over her head, then laid the hairs on the burning coals. The instant they were consumed, terrible cries rang through the monastery. No one could tell where they came from. Only the dervish guessed that Maimoum, son of Dimdim, was crying out because he could feel the princess escaping his power.
      - id: ch02-b07
        speaker: second_calender
        text: >-
          Until then, the princess had seemed unaware of everything around her. Now she lifted her veil and showed her face.
      - id: ch02-b08
        speaker: princess
        text: >-
          Where am I? How did I come to this place?
        emotion: surprised
      - id: ch02-b09
        speaker: second_calender
        text: >-
          Joy swept over the Sultan when he heard her speak. He embraced his daughter and kissed the dervish's hand. Then he faced the attendants gathered around them.
      - id: ch02-b10
        speaker: sultan
        text: >-
          What reward should I give the man who has restored my daughter to me?
      - id: ch02-b11
        speakers: [vizir, officer]
        ensemble: duo
        text: >-
          He deserves the princess's hand in marriage.
      - id: ch02-b12
        speaker: sultan
        text: >-
          I agree. From this moment, I declare him my son-in-law.
      - id: ch02-b13
        speaker: second_calender
        text: >-
          Not long after the wedding, the grand vizir died, and the Sultan gave that high office to the dervish. He did not hold the post for long. The Sultan himself fell victim to an illness and died. He had no sons to inherit the kingdom. The soldiers and the priests therefore declared that the dervish would succeed him on the throne, and the news brought great joy to all the people.
      - id: ch02-b14
        speaker: second_calender
        text: >-
          One day, the dervish, now Sultan himself, made a royal progress through the city with his court. Among the people gathered to watch, he noticed the very man whose envy had once driven him from his home and into the well. The Sultan made a small sign to one of his vizirs and quietly pointed the man out.
      - id: ch02-b15
        speaker: dervish
        text: >-
          Bring that man to me, but be very careful not to frighten him.
      - id: ch02-b16
        speaker: second_calender
        text: >-
          The vizir obeyed. When the envious man stood before him, the Sultan greeted him kindly.
      - id: ch02-b17
        speaker: dervish
        text: >-
          My friend, I am very glad to see you again.
      - id: ch02-b18
        speaker: second_calender
        text: >-
          Then the Sultan turned to an officer.
      - id: ch02-b19
        speaker: dervish
        text: >-
          Give him a thousand gold pieces from my treasury and twenty wagonloads of goods from my private stores. Send soldiers with him to escort him safely home.
      - id: ch02-b20
        speaker: second_calender
        text: >-
          With that, the Sultan took leave of the man who had tried to murder him and continued on his way.
    - id: ch03
      title: The Genius's Punishment
      blocks:
      - id: ch03-b01
        speaker: second_calender
        text: >-
          When I had finished that story, I explained its lesson to the genius.
      - id: ch03-b02
        speaker: second_calender
        text: >-
          O genius, you see that this Sultan did more than forgive the envious man who tried to take his life. He loaded his enemy with gifts and riches.
      - id: ch03-b03
        speaker: second_calender
        text: >-
          But the genius had already decided my fate. Nothing I said could soften him.
      - id: ch03-b04
        speaker: genius
        text: >-
          Do not think you will escape so easily. I will spare your life, and no more. You must learn what happens to those who meddle in my affairs.
        emotion: angry
      - id: ch03-b05
        speaker: second_calender
        text: >-
          He seized my arm with great force. The palace roof opened above us, and we rose so high that the earth below looked no larger than a little cloud. Then he plunged down as swiftly as lightning, and we landed on the top of a mountain.
      - id: ch03-b06
        speaker: second_calender
        text: >-
          The genius bent down and gathered a handful of earth. He murmured words over it and threw it into my face.
      - id: ch03-b07
        speaker: genius
        text: >-
          Leave the shape of a man and take the shape of a monkey.
      - id: ch03-b08
        speaker: second_calender
        text: >-
          Then he vanished. I found myself changed into an ape, alone in a country I had never seen.
      - id: ch03-b09
        speaker: second_calender
        text: >-
          There was no use staying on the mountain. I climbed down and reached a level plain beside the sea. Half a mile from shore, a ship lay at anchor. The water was calm, so I broke a branch from a tree and dragged it to the water. Sitting astride it, I used two sticks as oars and made my way toward the ship.
      - id: ch03-b10
        speaker: second_calender
        text: >-
          The deck was crowded with people who watched my strange voyage with great interest. When I reached the hull, I caught a hanging rope and swung myself aboard. Then I discovered that I had escaped death from the genius only to face death at the sailors' hands. They believed that allowing a monkey to remain would bring bad luck to the vessel and every merchant traveling in it.
      - id: ch03-b11
        speaker: sailor_one
        text: >-
          Throw him into the sea!
        emotion: fearful
      - id: ch03-b12
        speaker: sailor_two
        text: >-
          Strike him on the head with a hammer!
        emotion: angry
      - id: ch03-b13
        speaker: sailor_three
        text: >-
          Let me put an arrow through him!
        emotion: angry
      - id: ch03-b14
        speaker: second_calender
        text: >-
          One of them surely would have done it, but I threw myself at the captain's feet and clung tightly to his clothes. My action touched him. He patted my head and announced that I was under his protection and no one was to harm me.
    - id: ch04
      title: The Monkey Who Could Write
      blocks:
      - id: ch04-b01
        speaker: second_calender
        text: >-
          After a voyage of about fifty days, we dropped anchor before a large town. A crowd of small boats immediately gathered around the ship. Some of the people in them had come to meet friends, while others were there only from curiosity. One boat carried several royal officials. They asked for the merchants on board and said the Sultan had sent them as a sign of welcome. His Highness also begged each merchant to write a few lines on a roll of paper they had brought.
      - id: ch04-b02
        speaker: official
        text: >-
          I should explain this unusual request. Our late grand vizir was famous for his beautiful handwriting, and the Sultan hopes to find the same gift in the man who replaces him. No one has satisfied him yet, but His Highness has not abandoned the search.
      - id: ch04-b03
        speaker: second_calender
        text: >-
          The merchants wrote on the roll one after another. When the last had finished, I stepped forward and snatched the paper from the official's hand. Everyone thought I meant to toss it into the sea. Then they saw how carefully I held it, and I made signs to show that I wanted to write too.
      - id: ch04-b04
        speaker: captain
        text: >-
          Let him try. If he ruins the paper, I promise I will punish him. But I believe he truly can write. He is the cleverest monkey I have ever known. If he succeeds, I will adopt him as my son. The son I lost did not have half his sense!
      - id: ch04-b05
        speaker: second_calender
        text: >-
          No one objected after that. I took up the pen and wrote in all six styles of writing used among the Arabs. For each style, I composed an original verse or couplet in praise of the Sultan. My handwriting did more than surpass the work of the merchants. It was so beautiful that nothing equal to it had ever been seen in that country. When I laid down the pen, the astonished officials took the roll and returned with it to the Sultan.
      - id: ch04-b06
        speaker: second_calender
        text: >-
          As soon as the Sultan saw my writing, he did not even glance at the merchants' samples. He ordered his officials to choose the finest horse in his stables and cover it in the richest trappings. They were also to find the most magnificent robe they could obtain. Then they must dress the writer in that robe, place him on the horse, and bring him straight to court.
      - id: ch04-b07
        speaker: second_calender
        text: >-
          The officials burst out laughing when they heard the command. They knew the Sultan expected them to return with a man dressed for court. When they could speak again, they begged His Highness to forgive their laughter before they explained what had happened.
      - id: ch04-b08
        speaker: official
        text: >-
          Your Highness, those lines were not written by a man. A monkey wrote them.
      - id: ch04-b09
        speaker: sultan
        text: >-
          A monkey?
        emotion: surprised
      - id: ch04-b10
        speaker: official
        text: >-
          Yes, sire. We watched the monkey write them ourselves.
      - id: ch04-b11
        speaker: sultan
        text: >-
          Then bring that monkey to me as quickly as possible.
      - id: ch04-b12
        speaker: second_calender
        text: >-
          The officials returned to the ship and showed the captain the royal order.
      - id: ch04-b13
        speaker: captain
        text: >-
          The Sultan is the master here. Send for the monkey.
      - id: ch04-b14
        speaker: second_calender
        text: >-
          They dressed me in the magnificent robe and rowed me ashore. There they placed me on the splendid horse and led me toward the palace. The Sultan waited for me in great state, surrounded by his whole court. News of the sight had filled the streets. A vast crowd packed every doorway and every window along the way. People shouted and cheered as I passed, and those cries followed me until I was led into the Sultan's presence.
      - id: ch04-b15
        speaker: second_calender
        text: >-
          I approached the throne and bowed three times. Then I fell flat before the Sultan. Everyone stared in amazement. They could not understand how a monkey knew the ruler from everyone else or could show him the respect owed to his rank. Though I could not speak the customary words, I left out none of the other forms of a royal audience.
      - id: ch04-b16
        speaker: second_calender
        text: >-
          When the audience ended, the Sultan dismissed everyone at court except the chief eunuch and a young slave. He kept me with them and led us into another room. Food was brought at his command, and he made signs for me to sit at the table and eat beside him. I rose from my seat first and kissed the ground. Then I took my place and ate with the greatest care, never forgetting whose table it was, and taking only a moderate share.
      - id: ch04-b17
        speaker: second_calender
        text: >-
          Before the dishes were cleared away, I pointed to writing materials in a corner and asked for them by signs. I picked up a peach and wrote verses on it in the Sultan's praise. He could not speak for wonder. Then I wrote more verses on the glass from which I had drunk.
      - id: ch04-b18
        speaker: sultan
        text: >-
          A man who could do all this would be cleverer than any other man alive, yet this creature is only a monkey!
        emotion: surprised
      - id: ch04-b19
        speaker: second_calender
        text: >-
          After supper, chessmen were brought in. The Sultan signaled to ask whether I would play. I kissed the ground and touched my head to show that I would try to deserve the honor. He won the first game, but I won the second and third. I saw that this displeased him a little, so I quickly wrote a verse to console him.
    - id: ch05
      title: Queen of Beauty Knows the Truth
      blocks:
      - id: ch05-b01
        speaker: second_calender
        text: >-
          The Sultan was delighted by every talent I displayed and wanted someone else to see them. He turned to the chief eunuch.
      - id: ch05-b02
        speaker: sultan
        text: >-
          Ask my daughter, Queen of Beauty, to come here. I want to show her something she has never seen.
      - id: ch05-b03
        speaker: second_calender
        text: >-
          The chief eunuch bowed and left. A few moments later, he returned with the princess. Her face was uncovered when she entered, but the instant she saw the room, she pulled her veil over her head.
      - id: ch05-b04
        speaker: queen_of_beauty
        text: >-
          Father, what were you thinking when you called me into the presence of a man?
      - id: ch05-b05
        speaker: sultan
        text: >-
          I do not understand. Your own eunuch is here, along with the young slave and me. There is no one else but a monkey. Why cover your face and speak as if I had done something wrong?
      - id: ch05-b06
        speaker: queen_of_beauty
        text: >-
          Sire, I am right. That creature is not truly a monkey. He is a young prince whom an evil genius, the son of the daughter of Eblis, changed by magic.
      - id: ch05-b07
        speaker: second_calender
        text: >-
          The Sultan stared at me in astonishment, watching to see how I would answer. Since I could not speak, I placed my hand on my head to show that the princess had told the truth.
      - id: ch05-b08
        speaker: sultan
        text: >-
          My daughter, how can you know this?
      - id: ch05-b09
        speaker: queen_of_beauty
        text: >-
          The old woman who cared for me as a child was a skilled magician. She taught me seventy rules of her art. With them, I could move your capital into the middle of the ocean in an instant. Her teaching also lets me recognize an enchanted person at first sight and know who cast the spell.
      - id: ch05-b10
        speaker: sultan
        text: >-
          My daughter, I never knew you possessed such extraordinary skill.
        emotion: surprised
      - id: ch05-b11
        speaker: queen_of_beauty
        text: >-
          There are many unusual things worth knowing, sire, but no one should boast about them.
      - id: ch05-b12
        speaker: sultan
        text: >-
          Do you know how to break the spell on this young prince?
      - id: ch05-b13
        speaker: queen_of_beauty
        text: >-
          Yes. I can free him myself.
      - id: ch05-b14
        speaker: sultan
        text: >-
          Then give him back his true form. Nothing could please me more. I mean to make him my grand vizir and give you to him as his wife.
        emotion: happy
      - id: ch05-b15
        speaker: queen_of_beauty
        text: >-
          As Your Highness wishes.
      - id: ch05-b16
        speaker: second_calender
        text: >-
          Queen of Beauty rose and went to her chamber. She returned carrying a knife with Hebrew words engraved on its blade. Then she told the Sultan, the chief eunuch, the young slave, and me to follow her down into a secret courtyard of the palace. A covered gallery ran all the way around it. She placed the four of us beneath that gallery while she stood alone in the center of the open court. With the knife, she traced a great circle around herself and wrote several words in Arabic characters inside it.
      - id: ch05-b17
        speaker: second_calender
        text: >-
          When the circle and its writing were complete, the princess stood in the middle and recited verses from the Koran. Slowly, the air turned dark. The earth seemed ready to crumble beneath us. Then the genius, son of the daughter of Eblis, appeared as a gigantic lion, and our fear grew greater still.
      - id: ch05-b18
        speaker: queen_of_beauty
        text: >-
          Dog! Do you think that hideous shape will frighten me?
        emotion: angry
      - id: ch05-b19
        speaker: genius
        text: >-
          And did you not fear to break our solemn agreement that neither of us would interfere with the other?
        emotion: angry
      - id: ch05-b20
        speaker: queen_of_beauty
        text: >-
          Accursed genius, you were the first to break that agreement!
        emotion: angry
      - id: ch05-b21
        speaker: genius
        text: >-
          I will teach you what it costs to cause me so much trouble.
        emotion: angry
    - id: ch06
      title: The Battle of Many Shapes
      blocks:
      - id: ch06-b01
        speaker: second_calender
        text: >-
          The lion opened his enormous mouth and sprang forward to swallow the princess. She had expected the attack and leaped aside. Plucking one hair from his mane, she spoke two or three words over it. The hair became a sword in her hand. One sharp stroke cut the lion's body in two.
      - id: ch06-b02
        speaker: second_calender
        text: >-
          The two halves vanished, leaving only the lion's head. At once, that head became a scorpion. The princess changed into a serpent and fought it. When the scorpion began to lose, it turned into an eagle and flew away. In a breath, the serpent became an even stronger eagle and soared after it. Soon both disappeared from sight.
      - id: ch06-b03
        speaker: second_calender
        text: >-
          We stayed where we were, trembling with worry. Suddenly, the ground opened before us. A black-and-white cat leaped out with its fur standing on end, crying horribly. A wolf came close behind and nearly caught it. The cat became a worm, pierced the skin of a pomegranate that had fallen from a tree, and hid inside the fruit.
      - id: ch06-b04
        speaker: second_calender
        text: >-
          The pomegranate began to swell until it grew as large as a pumpkin. Then it lifted itself onto the roof of the gallery, dropped into the courtyard, and burst into pieces when it struck the ground. While this happened, the wolf changed into a rooster and began swallowing the scattered pomegranate seeds as fast as its beak could move. When every seed seemed to be gone, it flew toward us and beat its wings, as though asking whether any of us could see one more.
      - id: ch06-b05
        speaker: second_calender
        text: >-
          Suddenly, the rooster's eye caught one last seed lying on the bank of the little canal that crossed the courtyard. It hurried toward the seed, but before its beak could touch it, the seed rolled into the canal and became a fish. The rooster threw itself into the water after it and changed into a pike. For two full hours, they chased each other up and down beneath the surface. Horrible cries rose from the water, but we could see nothing of the struggle below.
      - id: ch06-b06
        speaker: second_calender
        text: >-
          At last they rose from the canal in their own forms, shooting flames from their mouths. We feared the palace itself would catch fire. Then the genius broke away from the princess and flew toward us. We would all have died if she had not drawn his attention back to herself.
      - id: ch06-b07
        speaker: second_calender
        text: >-
          Even so, the fire singed the Sultan's beard and scorched his face. It burned the chief eunuch to ashes, and one spark destroyed the sight in one of my eyes. The Sultan and I had lost all hope when the princess cried out.
      - id: ch06-b08
        speaker: queen_of_beauty
        text: >-
          Victory! Victory!
        emotion: happy
      - id: ch06-b09
        speaker: second_calender
        text: >-
          The genius lay at her feet, nothing but a great heap of ashes.
      - id: ch06-b10
        speaker: second_calender
        text: >-
          Though exhausted, the princess immediately told the young slave, the only one who had not been hurt, to bring her a cup of water. She spoke magic words over it and dashed it into my face.
      - id: ch06-b11
        speaker: queen_of_beauty
        text: >-
          If magic alone made you a monkey, return now to the human form you had before.
      - id: ch06-b12
        speaker: second_calender
        text: >-
          In an instant, I stood before her as the man I had once been, though one eye remained blind. I was about to kneel and thank her, but she gave me no time. She turned to her father.
    - id: ch07
      title: The Price of Victory
      blocks:
      - id: ch07-b01
        speaker: queen_of_beauty
        text: >-
          Sire, I won the battle, but the price was terrible. The fire has reached my heart, and I have only moments to live. This would not have happened if I had noticed the final pomegranate seed and eaten it with the others. That seed was the genius's last defense, and until then I was safe. When I missed it, I had to fight with fire. For all his experience, I proved I knew more than he did. He is dead and lies in ashes, but death is coming for me too.
        emotion: sad
      - id: ch07-b02
        speaker: sultan
        text: >-
          My daughter, what misery has fallen on me! I can hardly believe I am still alive. The eunuch has been consumed by the flames, and the prince you saved has lost the sight of one eye.
        emotion: sad
      - id: ch07-b03
        speaker: second_calender
        text: >-
          Sobs stopped the Sultan from saying more, and all of us wept together.
      - id: ch07-b04
        speaker: queen_of_beauty
        text: >-
          I burn! I burn!
        emotion: fearful
      - id: ch07-b05
        speaker: second_calender
        text: >-
          With that cry, death released her from her torment.
      - id: ch07-b06
        speaker: second_calender
        text: >-
          Madam, I have no words that can tell you what I felt at that terrible sight. I would rather have remained a monkey for the rest of my life than see the woman who saved me die in such a dreadful way. The Sultan could not be comforted. His subjects had dearly loved the princess, and the grief that filled the palace spread through the whole kingdom. For seven days, the entire nation mourned her. Afterward, her ashes were carried out and buried with great ceremony, and a magnificent tomb was raised above them.
      - id: ch07-b07
        speaker: second_calender
        text: >-
          After the princess died, the Sultan became gravely ill from sorrow. As soon as he had recovered, he sent for me. He spoke with courtesy, but he also spoke plainly. Whenever he saw me, he would remember the daughter he had lost. For that reason, he asked me to leave his kingdom immediately. If I ever returned, the punishment would be death.
      - id: ch07-b08
        speaker: second_calender
        text: >-
          I had no choice but to obey. With no idea what would become of me, I shaved my beard and eyebrows and put on the clothes of a calender. I wandered without purpose through several countries. At last, I decided to come to Bagdad and ask for an audience with the Commander of the Faithful.
      - id: ch07-b09
        speaker: second_calender
        text: >-
          And that, madam, is my story.
      - id: ch07-b10
        speaker: narrator
        text: >-
          Then the other Calender began his tale.
