audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    calender_2:
      display_name: 第二位卡兰德
      tts:
        delivery: 郑重坦率，谈及身世时带着神秘感
        timbre: 温厚低沉
        pace: 从容
        pitch: 中低音
    genius:
      display_name: 精灵
      tts:
        delivery: 傲慢暴烈，质问时咄咄逼人
        timbre: 阴沉浑厚
        pace: 缓慢有压迫感，盛怒时加快
        pitch: 低音
    zobeida:
      display_name: 祖贝达
      tts:
        delivery: 端庄自持，发号施令时冷峻有力
        timbre: 丰满清亮，带有威严
        pace: 从容，动怒时字句分明
        pitch: 中低音
    envied_man:
      display_name: 受嫉者
      tts:
        delivery: 谦和宽厚，身处险境仍不失沉着
        timbre: 温润清朗
        pace: 平稳从容
        pitch: 中音
    envious_man:
      display_name: 嫉妒者
      tts:
        delivery: 表面恭顺，暗藏急切与恶意
        timbre: 略显尖窄
        pace: 稍快
        pitch: 中高音
    spirit_1:
      display_name: 井中仙灵甲
      tts:
        delivery: 神秘而笃定，讲述时条理清楚
        timbre: 空灵柔和
        pace: 舒缓
        pitch: 中音
    spirit_2:
      display_name: 井中仙灵乙
      tts:
        delivery: 好奇直率，问话简洁
        timbre: 清亮轻盈
        pace: 平稳
        pitch: 中高音
    spirit_3:
      display_name: 井中精灵
      tts:
        delivery: 低声应答，带着幽深的回响
        timbre: 浑厚低沉
        pace: 缓慢
        pitch: 低音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严坦率，喜怒都真切强烈
        timbre: 洪亮厚实
        pace: 从容，激动时加快
        pitch: 中低音
    princess:
      display_name: 美人皇后公主
      tts:
        delivery: 聪慧端庄，施法与迎战时果断无畏
        timbre: 清澈有力
        pace: 平稳，危急时明快
        pitch: 中高音
    courtier_1:
      display_name: 宫廷侍从甲
      tts:
        delivery: 恭敬郑重
        timbre: 清晰端正
        pace: 平稳
        pitch: 中音
    courtier_2:
      display_name: 宫廷侍从乙
      tts:
        delivery: 恭敬爽直
        timbre: 明亮
        pace: 平稳
        pitch: 中音
    courtier_3:
      display_name: 宫廷侍从丙
      tts:
        delivery: 恭谨沉稳
        timbre: 温厚
        pace: 稍缓
        pitch: 中低音
    sailor_1:
      display_name: 水手甲
      tts:
        delivery: 粗声粗气，迷信而急躁
        timbre: 粗粝
        pace: 快
        pitch: 中低音
    sailor_2:
      display_name: 水手乙
      tts:
        delivery: 凶狠莽撞
        timbre: 沙哑厚重
        pace: 快
        pitch: 低音
    sailor_3:
      display_name: 水手丙
      tts:
        delivery: 急切强硬
        timbre: 尖亮
        pace: 快
        pitch: 中高音
    captain:
      display_name: 船长
      tts:
        delivery: 豪爽仁厚，说话干脆
        timbre: 饱满粗犷
        pace: 平稳
        pitch: 中低音
    official:
      display_name: 官员
      tts:
        delivery: 恭谨清楚，传达王命时郑重
        timbre: 清朗端正
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 井底的秘密
      blocks:
        - id: ch01-b01
          speaker: calender_2
          text: |-
            夫人，我给精灵讲的故事是这样的。一座不大不小的城里，住着两个比邻而居的人。没过多久，其中一个便开始憎恨邻居，嫉妒得近乎发狂。那位可怜的邻居只想躲开仇恨，心想两人不再日日碰面，对方也许会渐渐把自己忘掉。于是，他卖掉房屋和仅有的一点家具，搬到附近的国都。他在城外约半英里处买下一座清静小宅。宅旁有一大片花园，院子也很宽，正中还留着一口古井。
        - id: ch01-b02
          speaker: calender_2
          text: |-
            为求安宁，他披上苦行僧的长袍，把宅子隔成一间间静室，招来一群苦行僧同住。他的德行很快传开，许多人慕名拜访，请他代为祈祷，其中还有身份极尊贵的人。
        - id: ch01-b03
          speaker: calender_2
          text: |-
            名声传回故乡，嫉妒者不但没有罢休，反而发誓非要害死他不可。恶人抛下家业，赶到修院。主人早已不计前嫌，仍热情接待了他。
        - id: ch01-b04
          speaker: envious_man
          text: |-
            我有一件极要紧的私事，只能单独告诉您。天快黑了，请先让众位苦行僧回静室，再到院里来见我，千万别让旁人听见。
        - id: ch01-b05
          speaker: calender_2
          text: |-
            苦行僧立刻照他说的做了。院里只剩两个人以后，嫉妒者讲起一个很长的故事。他们一边交谈，一边在院中来回踱步。嫉妒者就这样一点点把主人引向古井。到了井边，恶人突然抓住他，将他推了下去，然后得意地逃走。没有人看见这桩恶行，他暗自庆幸，认定自己憎恨的人已经死了，再也不会来烦扰他。
        - id: ch01-b06
          speaker: calender_2
          text: |-
            可他想错了。井里早住着一群仙灵和精灵，他们接住了坠落的苦行僧，使他毫发无伤。苦行僧什么也看不见，只知道若没有怪事发生，自己早该撞上井壁，摔得粉身碎骨。他静静躺着，不久便听见一个声音。
        - id: ch01-b07
          speaker: spirit_1
          text: |-
            你们猜得出，我们刚从死亡手里救下的人是谁吗？
        - id: ch01-b08
          speakers: [spirit_2, spirit_3]
          ensemble: duo
          text: |-
            猜不出。
        - id: ch01-b09
          speaker: spirit_1
          text: |-
            这个人天性善良。为了躲开邻居的嫉妒，他甘愿离开故乡，搬到这里。谁知他的德行又赢得众人敬重，嫉妒者因此更加恨他，特意赶来取他性命。若不是我们相救，那恶人已经得手。偏偏明天苏丹还要来拜访这位圣洁的苦行僧，请他为女儿祈祷。
        - id: ch01-b10
          speaker: spirit_2
          text: |-
            公主出了什么事，为什么非要请苦行僧祈祷？
        - id: ch01-b11
          speaker: spirit_1
          text: |-
            她落进了丁丁之子迈穆姆的魔掌。要治好她其实不难。修院里有只黑猫，尾巴尖长着一小撮白毛。苦行僧只要拔下七根，把其中三根投进火里，让烟熏过公主头顶，就能彻底救她。以后迈穆姆再也不敢靠近她。
        - id: ch01-b12
          speaker: calender_2
          text: |-
            井里重新安静下来，苦行僧却把每个字都记在心里。天亮以后，他发现井壁有一处破损，正好可以借力，很轻易便爬出了井口。众苦行僧始终想不出首领去了哪里，见他重新出现，全都喜出望外。他说明昨日那位客人怎样企图害死自己，随后回到静室。没过多久，那只黑猫照常跑来向主人问早安。他把猫抱上膝头，趁机从尾尖拔下七根白毛，仔细收在一旁，等需要时使用。
    - id: ch02
      title: 公主痊愈
      blocks:
        - id: ch02-b01
          speaker: calender_2
          text: |-
            太阳升起不久，苏丹带着大队随从来到修院。他不愿错过任何救女儿的办法。苦行僧们恭敬相迎，苏丹说明来意，又把首领请到一旁。
        - id: ch02-b02
          speaker: sultan
          text: |-
            尊贵的谢赫，想必你已经猜到，我为何而来了吧？
        - id: ch02-b03
          speaker: envied_man
          text: |-
            是的，陛下。若我没有猜错，您是为公主的病而来。
        - id: ch02-b04
          speaker: sultan
          text: |-
            正是。若你的祈祷能把女儿从怪病里救出来，就等于给了我第二次生命。
        - id: ch02-b05
          speaker: envied_man
          text: |-
            请陛下命人带公主过来，我愿尽力一试。
        - id: ch02-b06
          speaker: calender_2
          text: |-
            苏丹满怀希望，立刻下令让公主带着平日的侍从赶来。她到达时，面纱遮得严严实实。苦行僧叫人在她头顶托起火盆，把七根白毛中的三根放到炭火上。白毛刚烧尽，四周便响起可怕的惨叫，谁也不知道声音从哪里来。只有苦行僧明白，是迈穆姆发觉公主要逃出魔掌，正在号叫。
        - id: ch02-b07
          speaker: calender_2
          text: |-
            公主此前仿佛一直不知道自己在做什么。这时她抬手揭下面纱，神情茫然。
        - id: ch02-b08
          speaker: princess
          text: |-
            我这是在哪里？又怎么会来到这里？
          emotion: surprised
        - id: ch02-b09
          speaker: calender_2
          text: |-
            苏丹欣喜若狂，紧紧抱住女儿，又俯身亲吻苦行僧的手。接着，他转身询问围在四周的侍从。
        - id: ch02-b10
          speaker: sultan
          text: |-
            他使公主恢复如初，我该用什么来赏赐他？
        - id: ch02-b11
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: |-
            陛下应当把公主嫁给他。
        - id: ch02-b12
          speaker: sultan
          text: |-
            这也正合我的心意。从现在起，他就是我的女婿。
        - id: ch02-b13
          speaker: calender_2
          text: |-
            这件事过去不久，大维齐尔去世了，他的职位便交给了苦行僧。可苦行僧担任大维齐尔的时间并不长，苏丹又因一场疾病去世。苏丹没有儿子，军士和教士共同拥立这位苦行僧继承王位，全国百姓都为此欢欣鼓舞。
        - id: ch02-b14
          speaker: calender_2
          text: |-
            一天，昔日的苦行僧已成为苏丹，正率领宫廷臣属巡游。他在人群中忽然看见嫉妒者，便低声吩咐一位维齐尔，把那个人带来，千万不要惊吓他。嫉妒者来到面前，君王和气地开了口。
        - id: ch02-b15
          speaker: envied_man
          text: |-
            朋友，再见到你，我实在高兴。
        - id: ch02-b16
          speaker: calender_2
          text: |-
            说完，他转向一名官员，吩咐对方从国库取出一千枚金币赏给嫉妒者，再从自己的私库拨出二十车货物，还要派一队士兵护送那人回家。君王随后向嫉妒者道别，接着便继续巡游。
        - id: ch02-b17
          speaker: calender_2
          text: |-
            故事讲完，我便提醒精灵从中取一个教训。
        - id: ch02-b18
          speaker: calender_2
          text: |-
            精灵啊，你也听见了。这位苏丹不但饶恕了企图杀害自己的嫉妒者，还慷慨地送给他财宝。请你也这样待我吧。
        - id: ch02-b19
          speaker: genius
          text: |-
            别以为这样就能轻易逃脱。我至多留下你的性命，可你既然插手我的事，就一定要吃到苦头。
    - id: ch03
      title: 猴子登船
      blocks:
        - id: ch03-b01
          speaker: calender_2
          text: |-
            话音未落，他便凶狠地抓住我的手臂。宫殿屋顶自行裂开，为我们让出一条路。我们一路升到高空，脚下的地面看上去只剩一小片云。接着，他又像先前那样，以闪电般的速度向下飞去，最后落在一座山顶。
        - id: ch03-b02
          speaker: calender_2
          text: |-
            精灵弯腰抓起一把泥土，念过咒语，猛地撒到我脸上。
        - id: ch03-b03
          speaker: genius
          text: |-
            脱去人的形体，变成一只猴子吧。
        - id: ch03-b04
          speaker: calender_2
          text: |-
            说完，他转眼消失，我的模样也真的变成了猿猴。四周是一片从未来过的陌生国土。留在那里毫无用处，我只好下山穿过平原，一直走到海边。我高兴地看见，离岸约半英里的地方停着一艘船，海上又没有风浪。我折下一根树枝，拖进水里，跨坐在上面，再用两根木棍当船桨，朝大船划去。
        - id: ch03-b05
          speaker: calender_2
          text: |-
            甲板上站满了人，都兴致勃勃地看着我靠近。可我抓住绳索荡上船，才知道自己刚从精灵手里逃得性命，又要死在水手手里。他们全都害怕一只猴子会给船和商人招来厄运，争着要杀我，谁也不愿让我留在甲板上。
        - id: ch03-b06
          speaker: sailor_1
          text: |-
            快把它扔进海里！
        - id: ch03-b07
          speaker: sailor_2
          text: |-
            让我拿锤子砸烂它的脑袋！
        - id: ch03-b08
          speaker: sailor_3
          text: |-
            都让开，我一箭就能射死它！
        - id: ch03-b09
          speaker: calender_2
          text: |-
            我赶紧扑到船长脚边，死死抓住他的衣袍。若非如此，准会有人如愿以偿。船长被我的举动打动，轻轻拍了拍我的头，宣布由他保护我，谁也不许伤害。
        - id: ch03-b10
          speaker: calender_2
          text: |-
            大约五十天后，船在一座大城前抛锚。许多小船立刻围上来，船上挤满了人。有些人来迎接亲友，有些人只是来看热闹。其中一条小船上坐着几名官员。他们先求见大船上的商人，说自己奉苏丹之命前来迎接，又请每个人都在一卷纸上写下几行字。
        - id: ch03-b11
          speaker: official
          text: |-
            诸位也许觉得这个请求古怪。新近去世的大维齐尔写得一手好字，苏丹急着寻找一位同样有才华的人接任。合适的人选至今没有找到，陛下仍不肯放弃。
        - id: ch03-b12
          speaker: calender_2
          text: |-
            商人们依次写过。轮到最后，我上前从官员手中一把夺过纸卷。大家起初以为我要把它扔进海里。见我小心捧着纸，又用手势表示也想写字，他们更加惊讶。
        - id: ch03-b13
          speaker: captain
          text: |-
            它既然想写，就让它试试。要是把纸弄得一团糟，我自然会罚它。不过，这可是我见过最聪明的猴子，说不定真会写。要真有这份本领，我就收它做儿子。我失去的那个儿子，还没有它机灵呢。
        - id: ch03-b14
          speaker: calender_2
          text: |-
            众人这才不再反对。我提起笔，把阿拉伯人通用的六种字体一一写来，每种字体都配上一首自己创作的短诗或对句，用来赞颂苏丹。我的字不但使商人们的手迹黯然失色，甚至可以说，这个国家从未有人见过如此优美的书法。全部写完以后，官员们带着纸卷回去复命。
        - id: ch03-b15
          speaker: calender_2
          text: |-
            苏丹一看见我的字，根本没有再瞧商人们的手迹，立即命人从御厩牵出装饰最华美的骏马，再取来最华贵的衣袍，给写字的人穿上，带他入宫。官员们忍不住笑了，好不容易才停下来。
        - id: ch03-b16
          speaker: official
          text: |-
            请陛下宽恕我们的失礼。写出这些字的不是人，是一只猴子。
        - id: ch03-b17
          speaker: sultan
          text: |-
            一只猴子？
          emotion: surprised
        - id: ch03-b18
          speaker: official
          text: |-
            是的，陛下。我们亲眼看着它写下这些字。
        - id: ch03-b19
          speaker: sultan
          text: |-
            那就快把它带来见我，越快越好。
        - id: ch03-b20
          speaker: calender_2
          text: |-
            官员回船出示王命。好心的船长只说，陛下是主人，便吩咐人把我叫来。
    - id: ch04
      title: 王宫里的奇才
      blocks:
        - id: ch04-b01
          speaker: calender_2
          text: |-
            官员们给我穿上苏丹赐下的华丽衣袍，用小船送我上岸，又扶我骑上那匹装饰华美的骏马，一路牵到王宫。沿街走来，我始终是大群百姓争相观看的对象。每扇门、每扇窗都挤满了人。我就在他们的欢呼喝彩声中，被领到威严端坐、群臣簇拥的苏丹面前。
        - id: ch04-b02
          speaker: calender_2
          text: |-
            我走近苏丹的宝座，深深行了三次礼，再俯伏到他脚前。满朝臣属全都大为惊奇，怎么也想不明白，一只猴子怎会从众人中辨认出谁是苏丹，还懂得献上符合君王身份的敬意。除了不能开口说出例行的颂词，觐见君王应守的礼节，我一样也没有遗漏。
        - id: ch04-b03
          speaker: calender_2
          text: |-
            觐见结束以后，苏丹遣退所有臣属，只留下宦官首领和一个小奴仆。他走进另一间屋子，命人送上食物，又示意我和他同桌用餐。我先从座位上起身，恭敬地亲吻地面，这才在桌边坐下。你们可以想象，一只猴子在苏丹面前用餐时，我处处小心，十分克制。
        - id: ch04-b04
          speaker: calender_2
          text: |-
            菜还没有撤走，我便打起手势，请人把放在屋角的笔墨拿到面前。我拿起一只桃子，在上面题了几句赞颂苏丹的诗。苏丹看得惊讶万分，一句话也说不出来。后来，我又在自己喝过水的杯子上题了一首诗。他见一只猴子接连做出这些事，终于忍不住自言自语。
        - id: ch04-b05
          speaker: sultan
          text: |-
            一个人若有这样的本领，已经胜过世间所有人了。可眼前的偏偏是一只猴子！
          emotion: surprised
        - id: ch04-b06
          speaker: calender_2
          text: |-
            晚餐结束，有人送来棋子。苏丹用手势问我愿不愿意与他对弈。我先亲吻地面，又把手放在头顶，表示愿意竭尽全力，不负这份荣幸。第一局由苏丹获胜，第二局和第三局却都由我赢了。我看出苏丹因为连输两局有些不快，便立即写下一首诗安慰他。
        - id: ch04-b07
          speaker: calender_2
          text: |-
            我的种种才艺让苏丹心醉神迷，他很想叫别人也来开开眼界，于是转向宦官首领。
        - id: ch04-b08
          speaker: sultan
          text: |-
            去请我的女儿美人皇后来。我有一样她从未见过的东西，要让她看看。
        - id: ch04-b09
          speaker: calender_2
          text: |-
            宦官首领行礼退出。片刻以后，他领着美人皇后公主走进房间。公主原本没有蒙面，可脚才跨进门槛，便立刻拉起面纱，将自己的头脸严严实实地遮住。
        - id: ch04-b10
          speaker: princess
          text: |-
            陛下，您为什么叫我到这里，在一个男人面前露面？
        - id: ch04-b11
          speaker: sultan
          text: |-
            我不懂你的意思。这里除了服侍你的宦官、小奴仆、我和这只猴子，再没有别人。你怎么反倒蒙起脸，还像是在责怪我？
        - id: ch04-b12
          speaker: princess
          text: |-
            陛下，这次是我看得对。这只猴子其实是一位年轻王子。他中了邪恶的法术，才变成这副模样。施法的精灵正是易卜劣斯女儿的儿子。
        - id: ch04-b13
          speaker: calender_2
          text: |-
            苏丹听见这些话，自然大为吃惊。他立刻转过头望向我，想看看我对公主的话有什么反应。我仍旧不能开口，只好把手放到头顶，用这个动作表示她说的一切全是真的。
        - id: ch04-b14
          speaker: sultan
          text: |-
            女儿，你怎么知道这些？
        - id: ch04-b15
          speaker: princess
          text: |-
            陛下，我幼年时由一位老妇人照料。她是法术高强的女巫，教给我七十条施法秘诀。靠这些法术，我一眨眼就能把您的国都挪到海中央，也能认出所有中了魔法的人，看出是谁施的法。
        - id: ch04-b16
          speaker: sultan
          text: |-
            我真没想到，你竟有这样大的本领。
          emotion: surprised
        - id: ch04-b17
          speaker: princess
          text: |-
            陛下，有些罕见的本领，懂得总比不懂好，只是不该拿来夸耀。
        - id: ch04-b18
          speaker: sultan
          text: |-
            那么，你知道怎样解除这位年轻王子身上的法术吗？
        - id: ch04-b19
          speaker: princess
          text: |-
            我知道，也能亲手替他解除。
        - id: ch04-b20
          speaker: sultan
          text: |-
            那就快让他恢复原来的模样！再没有什么能比这更叫我高兴。我还要任命他做大维齐尔，把你嫁给他。
          emotion: happy
        - id: ch04-b21
          speaker: princess
          text: |-
            一切遵从陛下的意愿。
    - id: ch05
      title: 狮子与雄鹰
      blocks:
        - id: ch05-b01
          speaker: calender_2
          text: |-
            美人皇后回寝宫取来一把刀，刀刃上刻着几个希伯来文字。她请苏丹、宦官首领、小奴仆和我一起走下台阶，来到王宫里一处隐秘庭院。我们站在四周的回廊下，她独自走到院子中央，在地面画出一个大圆圈，又在圈内写下几个阿拉伯文字。
        - id: ch05-b02
          speaker: calender_2
          text: |-
            圆圈和文字完成以后，公主站在圈子中央，诵读《古兰经》里的几段经文。四周的天空渐渐暗下去，我们觉得大地仿佛就要崩裂，心中越来越惊恐。就在大家不知会发生什么的时候，易卜劣斯女儿的儿子忽然现身了。他化成一头巨狮，更叫我们吓得魂不附体。
        - id: ch05-b03
          speaker: princess
          text: |-
            恶狗！你变成这副丑恶模样来到我面前，就以为能吓倒我吗？
          emotion: angry
        - id: ch05-b04
          speaker: genius
          text: |-
            你竟敢撕毁我们郑重立下的盟约！我们早就说好，谁也不许干涉对方。
          emotion: angry
        - id: ch05-b05
          speaker: princess
          text: |-
            该受诅咒的精灵，先破坏盟约的分明是你！
          emotion: angry
        - id: ch05-b06
          speaker: genius
          text: |-
            你给我惹下这么多麻烦，我现在就来教训你！
          emotion: angry
        - id: ch05-b07
          speaker: calender_2
          text: |-
            巨狮张开血盆大口，猛然扑向公主，要把她一口吞下。公主早已料到这一招，始终小心提防。她纵身闪到一旁，从狮子鬃毛中拔下一根，低声对它念了两三句话。那根鬃毛顷刻变成一把利剑。公主挥剑猛砍，将狮子的身躯劈成两半。两半身体不知消失到哪里，只留下一颗狮头，而狮头又立刻化为蝎子。
        - id: ch05-b08
          speaker: calender_2
          text: |-
            公主快如闪念，变成一条蛇，与蝎子激烈厮杀。蝎子渐渐落在下风，便化成一只雄鹰，展开翅膀飞走。那条蛇也在一瞬间变成一只更强大的雄鹰，直冲天空追赶而去。没过多久，两只雄鹰都从我们的视野中消失了。我们只能留在庭院里，忧心忡忡，浑身发抖地等着它们再次出现。
    - id: ch06
      title: 最后一粒石榴籽
      blocks:
        - id: ch06-b01
          speaker: calender_2
          text: |-
            我们留在原处，忧心忡忡地发着抖。忽然，面前的地裂开，一只黑白花猫从地下跃出。它浑身毛发直竖，发出骇人的尖叫。一匹狼紧追在后，眼看就要捉住它。
        - id: ch06-b02
          speaker: calender_2
          text: |-
            花猫猛地变成一条虫，钻破一只刚从树上落下的石榴的果皮，藏进果实。石榴迅速胀大，直到像南瓜一样。接着，它自行升上回廊屋顶，又从那里摔进庭院，碎得四分五裂。与此同时，追赶它的狼已经化成一只公鸡，飞快地吞吃散落在地上的石榴籽，一粒接一粒，绝不肯放过。
        - id: ch06-b03
          speaker: calender_2
          text: |-
            一粒粒种子全被吃光以后，公鸡拍着翅膀跑向我们，仿佛在问还有没有遗漏。忽然，它看见庭院小水渠岸边还留着一粒，急忙扑过去。可在它碰到以前，那粒种子便滚入水渠，化成一条鱼。公鸡随即纵身跃进水中，又变成一条梭鱼，继续追赶那条鱼。
        - id: ch06-b04
          speaker: calender_2
          text: |-
            接下来的两个时辰，它们在水下追来逐去，不断发出可怕的叫声，我们却什么也看不见。最后，精灵与公主恢复原形，从水中升起，彼此向对方喷出熊熊烈火，吓得我们以为整座王宫就要烧起来了。
        - id: ch06-b05
          speaker: calender_2
          text: |-
            更可怕的危险很快来了。精灵摆脱公主，直朝我们飞来。公主见我们命悬一线，设法把他的注意重新引向自己，我们这才没有全部丧命。即便如此，苏丹的胡须仍被烧焦，脸也被灼伤。宦官首领被烈焰烧成了一团焦炭。一粒火星飞进我的眼睛，使我从此失去一只眼睛的视力。
        - id: ch06-b06
          speaker: calender_2
          text: |-
            我和苏丹都不再指望获救，忽然听见公主高喊。
        - id: ch06-b07
          speaker: princess
          text: |-
            胜了！我胜了！
          emotion: happy
        - id: ch06-b08
          speaker: calender_2
          text: |-
            我们再向精灵看去，他已经化成公主脚边的一大堆灰烬。公主虽然精疲力竭，却没有停下来休息。她立刻吩咐唯一毫发无伤的小奴仆取来一杯水，把水握在手里，先对着杯子念了几句咒语，随后将水泼到我脸上。
        - id: ch06-b09
          speaker: princess
          text: |-
            你若只是中了魔法才变成猴子，就恢复从前人的模样吧。
        - id: ch06-b10
          speaker: calender_2
          text: |-
            一眨眼，我就恢复了从前人的模样，站在公主面前，只是已经瞎了一只眼。我正要跪下来感谢她的救命之恩，公主却没有给我这个时间，只转身望向自己的父亲。
        - id: ch06-b11
          speaker: princess
          text: |-
            陛下，我虽然赢了，却付出了惨重的代价。烈火已经烧进我的心，我只剩片刻可活。若我及时看见最后那粒石榴籽，把它也吞下去，就不会落到这个地步。那是精灵最后一次挣扎。在这以前，我一直安然无恙。可我错失了机会，只能动用火焰。精灵经验丰富，我还是证明了自己的法术胜过他。他已经化成灰烬，可我的死期也正迅速逼近。
          emotion: sad
        - id: ch06-b12
          speaker: sultan
          text: |-
            女儿啊，我的处境多么凄惨！我竟然还活着，连自己都感到惊讶。宦官被烈火吞噬，你救下的王子也失去了一只眼睛。
          emotion: sad
        - id: ch06-b13
          speaker: calender_2
          text: |-
            苏丹再也说不下去，呜咽堵住了喉咙，我们也一同流泪。突然，公主尖声喊了起来。
        - id: ch06-b14
          speaker: princess
          text: |-
            我在燃烧！我在燃烧！
          emotion: fearful
        - id: ch06-b15
          speaker: calender_2
          text: |-
            死亡随即降临，使她从痛苦中解脱。
    - id: ch07
      title: 第二位卡兰德的结局
      blocks:
        - id: ch07-b01
          speaker: calender_2
          text: |-
            夫人，眼见这样可怕的景象，我心里的感受根本无法说清。我宁愿一辈子做猴子，也不愿救命恩人这样惨烈地死去。苏丹更是悲痛欲绝。全国百姓都深爱公主，也同他一起哀悼。整整七天，全国上下沉浸在悲伤里。七日以后，人们以极隆重的仪式安葬公主的骨灰，又在墓上建起一座宏伟华美的陵寝。
        - id: ch07-b02
          speaker: calender_2
          text: |-
            公主去世以后，苏丹也因悲痛染上重病。等他终于康复，便把我召到面前。他没有责骂我，言辞坦率，却仍然不失礼数，然后说出了不能再留我的缘故。
        - id: ch07-b03
          speaker: sultan
          text: |-
            只要看见你，我就会想起失去女儿的伤痛。请你立刻离开这个国家，永远不要回来。若你再回来，我只能处死你。
          emotion: sad
        - id: ch07-b04
          speaker: calender_2
          text: |-
            我只能服从。那时我茫然不知该去哪里，便剃去胡须和眉毛，穿上卡兰德的衣服。此后，我漫无目的地漂泊过几个国家，最后决定来到巴格达，请求觐见信士的统帅。
        - id: ch07-b05
          speaker: calender_2
          text: |-
            夫人，这便是我的故事。
        - id: ch07-b06
          speaker: narrator
          text: |-
            第二位卡兰德说完，另一位卡兰德便接着讲起自己的故事。
