  chapters:
    - id: ch01
      title: A Rest in the Shade
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In the days of the Caliph Haroun-al-Raschid, a poor porter named Hindbad lived in Bagdad. One very hot day, he was sent across the city with a heavy load. Before he had gone halfway, he was worn out.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Then he came to a quiet street. Rose water had been sprinkled over the pavement, and a cool breeze moved through the air. Hindbad put down his burden and rested in the shade of a grand house. He could not have found a more pleasant spot.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Sweet smoke from aloes wood and pastilles drifted through the open windows. It mingled with the scent rising from the warm, rose-sprinkled stones. From inside came the music of many instruments, all skillfully played, along with the lovely calls of nightingales and other birds. Soon Hindbad also caught the tempting smell of many fine dishes. The music, birdsong, and delicious scents told him that a merry feast was going on in the palace.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Hindbad wondered who owned such a magnificent home. He had never seen it before, because his work rarely took him down that street. Curiosity drew him toward the entrance. Splendidly dressed servants stood at the door, so he went up to one of them and asked who their master was.
        - id: ch01-b05
          speaker: door_servant
          text: >-
            You live in Bagdad and do not know this house? It belongs to the noble Sindbad the Sailor, the famous traveler who has sailed every sea beneath the sun.
    - id: ch02
      title: The Porter's Complaint
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Hindbad had often heard about Sindbad's enormous wealth. Now envy rose in him. Why should this sailor's life be so happy when his own was so miserable? He looked up at the sky and cried aloud.
        - id: ch02-b02
          speaker: hindbad
          text: >-
            Mighty Creator of all things, look at the difference between Sindbad's life and mine! Every day brings me a thousand hardships and misfortunes. I work so hard, yet I can barely find enough coarse barley bread to keep my family and myself alive. But fortunate Sindbad throws his money around and eats the finest food. What has he done to be given such a pleasant life? What have I done to deserve such a hard fate?
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            In misery and despair, Hindbad stamped his foot on the ground. Just then, a servant came out of the palace and took him by the arm.
        - id: ch02-b04
          speaker: palace_servant
          text: >-
            Come with me. My master, the noble Sindbad, wishes to speak with you.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The summons startled Hindbad. He feared that his careless words had offended Sindbad and brought the great man's anger down on him. Hoping to get away, he said he could not leave in the street the burden someone had trusted him to carry.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The servant promised that the load would be looked after and would remain safe. Still Hindbad held back. The servant kept urging him to answer Sindbad's call, and at last the porter had to give in.
    - id: ch03
      title: At Sindbad's Table
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Hindbad followed him into a vast room. A large company sat around a table loaded with every sort of delicacy. In the place of honor was a tall, serious man. His long white beard gave him a noble and venerable air. A crowd of attendants stood behind his chair, eager to serve whatever he might need. This was the famous Sindbad.
        - id: ch03-b02
          speaker: narrator
          text: >-
            All that magnificence frightened the porter more than ever. Trembling, he greeted the noble company. Sindbad answered him kindly, beckoned him closer, and had him sit at his right hand. Then Sindbad himself filled Hindbad's plate with choice morsels and poured him a cup of excellent wine. The porter ate there among all those honored guests until the banquet was nearly over.
        - id: ch03-b03
          speaker: narrator
          text: >-
            As the feast came to an end, Sindbad spoke to him in a friendly way and asked his name and his work.
        - id: ch03-b04
          speaker: hindbad
          text: >-
            My lord, my name is Hindbad.
        - id: ch03-b05
          speaker: sindbad
          text: >-
            I am glad you are here, Hindbad, and I am sure everyone at this table is glad as well. But tell me, what were you saying in the street just now?
        - id: ch03-b06
          speaker: narrator
          text: >-
            Before the feast, Sindbad had passed an open window and heard Hindbad's complaint. Now the porter was deeply embarrassed. He lowered his head before he answered.
        - id: ch03-b07
          speaker: hindbad
          text: >-
            My lord, I was exhausted and in a foul temper. I spoke without thinking. Please forgive me for those foolish words.
    - id: ch04
      title: The Promise of Seven Voyages
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: >-
            Oh, you need not think I am unfair enough to blame you. I understand your troubles, and I feel for you. But you have the wrong idea about me, and I want you to know the truth. When you see the wealth and comfort around me, you may think I gained it all without hardship or danger. Nothing could be further from the truth. I reached this happy life only after years of suffering every kind of toil and peril.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Then Sindbad turned from the porter to the noble friends gathered around his table.
        - id: ch04-b03
          speaker: sindbad
          text: >-
            Yes, my noble friends, my adventures were strange enough to frighten even the greediest man away from seeking riches across the seas. Perhaps you have heard confused tales of my seven voyages and the dangers and wonders I met on sea and land. Now I will tell you the full and true story. I believe you will be pleased to hear it.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Sindbad meant his story mainly for Hindbad. Before he began, he ordered his own servants to carry the porter's burden from the street to the place where it was meant to go. Hindbad stayed behind to listen.
