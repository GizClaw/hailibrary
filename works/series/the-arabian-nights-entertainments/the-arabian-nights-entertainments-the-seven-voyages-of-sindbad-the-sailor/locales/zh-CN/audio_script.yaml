audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    servant:
      display_name: 辛巴达的仆人
      tts:
        delivery: 恭敬利落，对主人深感自豪
        timbre: 清晰明快
        pace: 平稳
        pitch: 中音
    hindbad:
      display_name: 脚夫欣巴达
      tts:
        delivery: 朴实直率，抱怨时激动，面对贵人时拘谨
        timbre: 粗朴厚实，略带疲惫
        pace: 平稳，情绪激动时稍快
        pitch: 中低音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 豪宅门前的脚夫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            哈伦·拉希德哈里发当政的时候，巴格达住着一个穷脚夫，名叫欣巴达。

            一天热得厉害，欣巴达受人差遣，要把一副沉重的担子从城东挑到城西。路还没走到一半，他已经累得走不动了。正好前面有条安静的街，路面刚洒过玫瑰水，还有凉风迎面吹来。他放下担子，在一座豪宅的阴影里坐下歇息。

            这个地方实在舒服。敞开的窗户里飘出沉香和香锭的气息，同热石板上蒸起的玫瑰水香混在一起。宅子里传来许多乐器合奏的声音，还有夜莺和别的鸟儿在婉转鸣唱。过了一会儿，各种佳肴的香味也飘了出来。欣巴达猜想，里面一定正在设宴取乐。

            他平日很少经过这条街，从没见过眼前的华美宅邸，便想知道主人是谁。他走到门口，问了一名衣着华丽的仆人。
        - id: ch01-b02
          speaker: servant
          text: |-
            怎么，你住在巴格达，竟不知道这里是谁的家？主人就是尊贵的水手辛巴达，那位闻名天下的旅行家。太阳照耀下的每一片海洋，他都航行过！
        - id: ch01-b03
          speaker: narrator
          text: |-
            欣巴达早就听说过辛巴达的万贯家财。想到这个人过得如此幸福，自己的日子却这样悲惨，他忍不住妒忌起来。他抬头望着天空，高声抱怨。
        - id: ch01-b04
          speaker: hindbad
          text: |-
            创造万物的伟大主宰啊，请看看辛巴达和我的日子差得多远！我每天吃尽苦头，倒霉事一件接着一件。拼命干活，也只挣得到粗劣的大麦面包，勉强养活自己和一家老小。辛巴达却花钱如流水，天天享用世上最丰美的东西！他究竟做了什么，能得到这么舒适的生活？我又做了什么，竟该受这样的苦？
        - id: ch01-b05
          speaker: narrator
          text: |-
            他说着重重跺脚，悲苦绝望得几乎失去理智。偏偏就在这时，一名仆人从宅子里出来，一把拉住了他的胳膊。
        - id: ch01-b06
          speaker: servant
          text: |-
            跟我进去吧。我的主人，尊贵的辛巴达，要见你。
        - id: ch01-b07
          speaker: narrator
          text: |-
            这一下，欣巴达可吃惊不小。他怕自己刚才那些无遮无拦的话惹恼了辛巴达，赶紧推说，别人托付给他的担子还在街上，实在不能离开。仆人答应会派人照管，又一再催他遵从主人的召唤。欣巴达没有办法，最后只好跟着进去。
    - id: ch02
      title: 辛巴达的宴席
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            仆人把欣巴达带进一间宽阔的大厅。许多宾客围坐在桌边，面前摆满各式各样的珍馐美味。上首坐着一个高大而庄重的男子。他留着长长的白胡须，看上去很有威望。椅子后面站着许多侍从，都等着随时上前服侍。这个人就是大名鼎鼎的辛巴达。

            眼前如此富丽堂皇，脚夫越看越害怕。他浑身发抖，向满座贵客行了一礼。辛巴达却招手叫他过去，让他坐在自己右边，还亲手夹起精美的食物，堆进他的盘子，又为他倒了一杯好酒。

            酒宴快结束的时候，辛巴达亲切地同他攀谈，问他叫什么名字，又靠什么营生。
        - id: ch02-b02
          speaker: hindbad
          text: |-
            老爷，我叫欣巴达。
        - id: ch02-b03
          speaker: sindbad
          text: |-
            很高兴你能来。我敢替在座的朋友们担保，他们也一样欢迎你。不过，我想请你把刚才在街上说的话，再讲给我听一遍。
        - id: ch02-b04
          speaker: narrator
          text: |-
            原来酒宴开始以前，辛巴达曾从敞开的窗边走过，恰好听见脚夫的抱怨，这才命人把他请了进来。

            欣巴达一听，羞得满脸通红，低下头去。
        - id: ch02-b05
          speaker: hindbad
          text: |-
            老爷，我承认，刚才实在又累又烦，一时管不住嘴，说了不该说的话。求您宽恕我吧。
    - id: ch03
      title: 七次航行的开端
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            不用这样。你别以为我会不讲道理地责怪你。我明白你的处境，也很同情你。只是，你似乎把我的事情想错了，我愿意告诉你真相。

            你一定以为，我没经历什么艰难和危险，就得到了眼前这些财富，过上这样奢华的日子。其实完全不是。许多年来，我受尽世间种种劳苦和凶险，才终于有了今天的安乐。
        - id: ch03-b02
          speaker: narrator
          text: |-
            说到这里，辛巴达转过身，面向在座的宾客。
        - id: ch03-b03
          speaker: sindbad
          text: |-
            是的，尊贵的朋友们。我敢向你们保证，我经历过的奇事，足以吓退世上最贪财的人，让他再也不敢渡海去寻找财富。

            你们也许只听过一些零碎的传闻，知道我有过七次航行，也知道我在海上和陆地遇见过危险与奇观。现在，我愿意把全部经过原原本本地告诉你们。我想，这些故事一定会让你们喜欢。
        - id: ch03-b04
          speaker: narrator
          text: |-
            辛巴达讲述自己的奇遇，主要是想让脚夫听个明白。所以故事开讲以前，他先吩咐仆人把留在街上的担子送去欣巴达原本要去的地方。这样一来，脚夫便可以安心留下，听辛巴达讲述那七次航行了。
