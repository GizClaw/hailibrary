  chapters:
    - id: ch01
      title: Three Wishes and Three Weddings
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, a young Sultan named Kosrouschah ruled Persia. Even as a boy, he had loved disguising himself and roaming through the city in search of adventure. Soon after his father died and the ceremonies of his accession were over, he laid aside his royal robes, told his grand-vizir to dress as an ordinary citizen, and slipped with him into the lesser-known streets of the capital.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In a lonely street, the Sultan heard women talking loudly behind a door. He peeped through a crack and saw three sisters seated together in a large hall. Each was saying what kind of man she would like to marry.
        - id: ch01-b03
          speaker: eldest_sister
          text: >-
            I would ask for nothing better than the Sultan's baker. Just think! I could eat all the delicious bread baked especially for his Highness. Now let us hear whether either of you can make a better wish.
        - id: ch01-b04
          speaker: second_sister
          text: >-
            I would be perfectly happy with the Sultan's chief cook. Imagine the wonderful stews I could enjoy. And since the whole palace eats the Sultan's bread, I would have that as well. My choice is every bit as good as yours.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Then it was the youngest sister's turn. She was the most beautiful of the three, and she had more sense than either of the others.
        - id: ch01-b06
          speaker: sultana
          text: >-
            I would aim higher. If we are wishing for husbands, no one less than the Sultan himself will do for me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The Sultan was so amused that he decided to grant all three wishes. He told the grand-vizir to remember the house and bring the sisters before him the next morning. The vizir obeyed. He barely gave them time to change their clothes before leading them to the palace, where they bowed one after another before the throne.
        - id: ch01-b08
          speaker: sultan
          text: >-
            Do you remember the wishes you made last night while you were amusing yourselves? Do not be afraid. Tell me the truth.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The question took them completely by surprise. They lowered their eyes in confusion, and the youngest sister blushed. Her blush touched the Sultan's heart. When none of them answered, he quickly reassured them.
        - id: ch01-b10
          speaker: sultan
          text: >-
            I do not mean to frighten or hurt you. I already know what each of you wished. You, the youngest, asked for me, and you shall marry me today. Your two sisters shall marry my baker and my chief cook at the very same time.
        - id: ch01-b11
          speaker: narrator
          text: >-
            All three sisters threw themselves at his feet. The youngest could scarcely get her words out.
        - id: ch01-b12
          speaker: sultana
          text: >-
            Oh, sire, those foolish words were only a joke. I am not worthy of the honor you offer me. Please forgive me for speaking so boldly.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Her sisters tried to excuse their own wishes too, but the Sultan refused to listen.
        - id: ch01-b14
          speaker: sultan
          text: >-
            No, my decision is made. Every one of your wishes will come true.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The three weddings took place that very day, though they were very different. The youngest sister's marriage had all the splendor expected when the Shah of Persia took a bride. Nothing was spared in celebrating her new rank. The baker and the chief cook also had wedding festivities, but only those suited to men in their positions. No one else would have thought that difference strange. The two elder sisters could think of little else. They had wished for the husbands they received, yet the magnificence surrounding their younger sister enraged them. Jealousy took hold of both women, and before it was done, their anger would bring suffering to many innocent people.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Several days passed before the two elder sisters could speak privately at a public bath. When they did, neither tried to hide her bitterness.
        - id: ch01-b17
          speaker: eldest_sister
          text: >-
            What can the Sultan possibly see in that little cat? How did she ever charm him so completely?
        - id: ch01-b18
          speaker: second_sister
          text: >-
            He must be blind. So she looks a little younger than we do. What difference does that make? You would have been a far better Sultana.
        - id: ch01-b19
          speaker: eldest_sister
          text: >-
            I say nothing about myself. If he had chosen you, I could have accepted it. But that miserable little creature? I cannot bear it. I will find some way to take revenge on her, and you must help me think of something that will humiliate her.
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            From then on, the two women met constantly to discuss one wicked idea after another. Nothing they imagined seemed likely to succeed. All the while, they behaved toward the Sultana as though they loved her as much as ever. She suspected nothing and answered their false affection with unfailing kindness. This only left them more determined to wound her. For a long time, they found no opening at all. Then word spread that the Sultana was expecting an heir. At once the sisters understood that the coming birth might give them the chance for which they had been waiting.
    - id: ch02
      title: The Children on the Canal
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The elder sisters asked the Sultan for permission to stay in the palace for several weeks, pretending that they wished to care for the Sultana. Once admitted, they remained beside her night and day, allowing no one to suspect what they intended. At last she gave birth to a little boy, beautiful as the sun. The sisters took the helpless child, placed him in his cradle, and secretly carried him out to a canal running through the palace grounds. They set the cradle upon the current and abandoned him to whatever fate might come. Then they returned and told the Sultan that the child he had so fondly desired was not a son at all, but a puppy.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Rage and grief overwhelmed the Sultan when he heard their dreadful report. He had longed for a son, and in that first storm of feeling, he turned his anger upon the innocent mother. Only the grand-vizir's desperate efforts kept him from harming her. While confusion filled the palace, the little cradle continued peacefully along the canal. It passed through the royal grounds and drifted toward the outer edge of the gardens. There the intendant happened to be walking. He was one of the kingdom's highest and most respected officers, and the small object moving on the water immediately caught his attention.
        - id: ch02-b03
          speaker: intendant
          text: >-
            Go and bring me that cradle.
        - id: ch02-b04
          speaker: narrator
          text: >-
            A gardener working nearby pulled it from the water and placed it in the intendant's hands. The intendant had expected an empty cradle. Instead, he found a baby whose beauty already showed, young as the child was. He and his wife had been married for years but had no children. At once he thought that he could raise this child as his own. He told the gardener to carry the cradle and follow him home.
        - id: ch02-b05
          speaker: intendant
          text: >-
            My wife, heaven has not given us children, but here is a child sent in their place. Call for a nurse. I will publicly recognize this baby as my son and do everything that must be done.
        - id: ch02-b06
          speaker: narrator
          text: >-
            His wife welcomed the child with joy. The intendant understood perfectly well that the cradle must have come from the royal palace, but he did not believe it was his place to investigate the mystery.
        - id: ch02-b07
          speaker: narrator
          text: >-
            A second prince was born the following year, and the jealous sisters sent him down the canal too. By good fortune, the intendant was again walking there. He found the baby and carried him home just as before. The Sultan's fury was even greater this time.
        - id: ch02-b08
          speaker: narrator
          text: >-
            In the third year, the same cruel trick was played on a newborn princess. Now the Sultan could no longer control himself. To the delight of the jealous sisters, he ordered the Sultana's execution. But she was deeply loved at court. Though they risked sharing her fate, the grand-vizir and the courtiers fell at the Sultan's feet and begged him not to punish her so cruelly for something that was not her fault.
        - id: ch02-b09
          speaker: grand_vizir
          text: >-
            Let her live, sire. Banish her from your presence for the rest of her days. That alone will be punishment enough.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The Sultan's first burst of anger had passed, and some self-command returned to him.
        - id: ch02-b11
          speaker: sultan
          text: >-
            She may live, since all of you desire it so greatly. But I grant her life on one condition, and it will make her pray for death every day. Build a box for her beside the main door of the great mosque. Its window must always remain open. She will sit there in the roughest clothes. Every Mussulman entering the mosque must spit in her face as he passes. Anyone who refuses will suffer the same punishment. Vizir, see that my command is obeyed.
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            The grand-vizir knew that further pleading was useless. The elder sisters watched triumphantly while the prison was built, and then listened to the crowd jeer at the helpless Sultana inside. Yet she endured everything with such dignity and gentleness that before long, the best people in the crowd began to pity her.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The third cradle, carrying the little princess, had also reached the intendant. He and his wife adopted her, and they raised all three children with the greatest care and affection. As the children grew, their beauty and noble bearing became more striking. Their manners had the natural grace of people born to high rank.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Their foster-father named the princes Bahman and Perviz, after two ancient kings of Persia. He called the princess Parizade, which means child of the genii. He educated them as their true rank deserved. A tutor taught the princes to read and write. Parizade was determined not to fall behind, and she begged to share their lessons. Soon she knew as much as her brothers.
        - id: ch02-b15
          speaker: narrator
          text: >-
            From then on, all three children studied together. Their foster-father found the finest masters he could for them. They learned the fine arts, geography, poetry, history, and science, along with difficult kinds of knowledge that very few people ever studied. No subject seemed too hard. Again and again, their teachers were astonished by how quickly the children understood and how steadily they improved. Parizade especially loved music. She learned to sing beautifully and could play all kinds of instruments. Yet she did not limit herself to quiet accomplishments. She rode and drove as well as either brother. With a bow, an arrow, or a javelin, she equaled their skill and sometimes surpassed it.
        - id: ch02-b16
          speaker: narrator
          text: >-
            The intendant wanted them to have space worthy of their gifts. He bought a splendid country house a few miles from the capital, surrounded by a vast park. He stocked the park with wild animals so the young people could hunt whenever they wished. Then he went before the Sultan, spoke of his age and long service, and asked permission to retire.
        - id: ch02-b17
          speaker: sultan
          text: >-
            Your request is granted. Tell me what reward I may give my faithful servant.
        - id: ch02-b18
          speaker: intendant
          text: >-
            I ask for nothing but the continued favor of your Highness.
        - id: ch02-b19
          speaker: narrator
          text: >-
            The intendant bowed and withdrew. For five or six months, the family enjoyed country life. Then death came upon him so suddenly that he had no time to reveal the secret of the children's birth. His wife had already died. It seemed that Bahman, Perviz, and Parizade might never learn they had been born to a far higher station. They mourned their foster-father deeply and stayed quietly in their new home, with no wish for the pleasures or intrigues of court.
    - id: ch03
      title: The Three Wonders
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            One day, the two princes went hunting as usual while Parizade stayed in her rooms. During their absence, an old Mussulman devotee came to the door and asked to enter because it was the hour of prayer. Parizade immediately ordered her servants to take the woman to the private oratory in the grounds. After her prayers, they were to show her the house and gardens and bring her to the princess.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The old woman was very pious, but piety had not made her indifferent to beauty. She looked closely at everything the servants showed her and seemed to understand its worth as well as admire it. She saw how comfortably the house was arranged, how carefully each room had been furnished, and how the gardens joined beauty with perfect order. At last, the servants led her into Parizade's own apartment. It was more splendid than any room she had yet seen, and the princess sat there waiting to receive her.
        - id: ch03-b03
          speaker: parizade
          text: >-
            My good woman, please sit here beside me. I am delighted to have a little time to speak with so holy a person.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The devotee protested that the place of honor was too much for her, but Parizade insisted that her guest take the best seat. Thinking the old woman must be tired, she ordered refreshments. While the woman ate, the princess asked about her way of life and her religious practices. Then she asked what the visitor thought of the house.
        - id: ch03-b05
          speaker: devotee
          text: >-
            Madam, anyone who found fault here would be very hard to please. The house is beautiful, comfortable, and perfectly ordered. Nothing could be lovelier than the garden. Still, since you have asked, I must admit that three things are missing. With those three, everything would be absolutely perfect.
        - id: ch03-b06
          speaker: parizade
          text: >-
            Three things? Tell me what they are, and I will get them without delay.
        - id: ch03-b07
          speaker: devotee
          text: >-
            First is the Talking Bird. When it sings, every other singing bird comes to join its chorus. Second is the Singing Tree, whose every leaf makes music that never falls silent. Last is the Golden Water. Pour one drop into a basin and it rises in a fountain that never runs dry, though the basin never overflows.
        - id: ch03-b08
          speaker: parizade
          text: >-
            How can I thank you for telling me about such treasures? Please be kinder still and tell me where I may find them.
        - id: ch03-b09
          speaker: devotee
          text: >-
            I would repay your hospitality badly if I refused. All three are in one place, near the border of this kingdom toward India. Your messenger must take the road that passes this house and follow it for twenty days. At the end of that time, ask the first person you meet for the Talking Bird, the Singing Tree, and the Golden Water.
        - id: ch03-b10
          speaker: narrator
          text: >-
            With that, the old woman rose, said farewell, and left. Her departure was so sudden that Parizade did not realize until she was gone how little the directions truly explained. The princess was still thinking about the three wonders and how delightful it would be to possess them when her brothers returned from the hunt.
        - id: ch03-b11
          speaker: bahman
          text: >-
            Sister, what is troubling you? Why do you look so serious? Are you ill, or has something happened?
        - id: ch03-b12
          speaker: narrator
          text: >-
            Parizade did not answer at once. Her thoughts were still fixed on the treasures and on the old woman's hurried directions. At last, she looked up and said that nothing was wrong. Bahman knew her too well to accept that answer. She had been cheerful when he and Perviz left for the hunt. In only a few hours, her whole manner had changed, and he could see that some serious thought was weighing on her.
        - id: ch03-b13
          speaker: bahman
          text: >-
            Something must have changed while we were away. Please hide nothing from us, unless you want us to think the trust we have always shared has come to an end.
        - id: ch03-b14
          speaker: parizade
          text: >-
            When I called it nothing, I meant that it did not concern either of you, though it matters greatly to me. We have always believed the house our father built was perfect. Today I learned it still lacks the Talking Bird, the Singing Tree, and the Golden Water.
        - id: ch03-b15
          speaker: narrator
          text: >-
            She explained the powers of all three treasures and repeated the devotee's directions.
        - id: ch03-b16
          speaker: parizade
          text: >-
            Perhaps you think our home is beautiful enough without them. I cannot agree. I will never be satisfied until they are here. Tell me whom I should send to find them.
        - id: ch03-b17
          speaker: bahman
          text: >-
            If this matters to you, that is enough, even if we cared nothing about it ourselves. But we do care. As the elder brother, I claim the right to try first. Tell me where to go and what I must do.
        - id: ch03-b18
          speaker: narrator
          text: >-
            Perviz objected. As head of the family, Bahman should not expose himself to danger. Bahman would not yield, and he went away to prepare for the journey.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Very early the next morning, Bahman said farewell and mounted his horse. He was just raising his whip when Parizade cried out and stopped him.
        - id: ch03-b20
          speaker: parizade
          text: >-
            Oh, you may never return! No one can know what accident lies ahead. Please give up this journey. I would lose the Talking Bird, the Singing Tree, and the Golden Water a thousand times over rather than have you face danger.
          emotion: fearful
        - id: ch03-b21
          speaker: bahman
          text: >-
            Dear sister, accidents come to the unlucky, and I hope I am not one of them. Still, nothing is certain, so I promise to be careful. Take this knife from my belt. Draw it now and then and examine the blade. While it stays bright and clean, you will know I am alive. If blood appears on it, you will know I am dead, and then you may mourn me.
        - id: ch03-b22
          speaker: narrator
          text: >-
            Bahman said farewell once more and rode down the high road, well armed and on a fine horse. For twenty days, he went straight ahead without turning aside. Near the Persian frontier, he saw a hideous old man seated under a roadside tree. A long white mustache covered his mouth, his beard nearly touched his feet, and his nails had grown to an astonishing length. A huge hat on his head served as an umbrella.
    - id: ch04
      title: The Mountain of Black Stones
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Bahman had watched for someone since sunrise, remembering that the devotee had told Parizade to question the first person met after twenty days. The strange old man had the appearance of a holy dervish, so the prince believed he had finally reached the person who could guide him. He did not call out from horseback or treat the ragged figure lightly. He dismounted, approached with respect, and bowed deeply before speaking.
        - id: ch04-b02
          speaker: bahman
          text: >-
            Father, may you live long in this land, and may every wish of yours be fulfilled.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The dervish tried to answer, but his mustache was so thick that the words could hardly be understood. Bahman saw the problem. He took scissors from his saddlebag and asked permission to trim the mustache because he had a question of great importance. The dervish nodded. When the prince had shortened the hair and beard all around, he told the old man how much younger he looked. The dervish smiled and thanked him.
        - id: ch04-b04
          speaker: dervish
          text: >-
            You have made me much more comfortable. Let me show my gratitude. What can I do for you?
        - id: ch04-b05
          speaker: bahman
          text: >-
            Gentle dervish, I have traveled a long way seeking the Talking Bird, the Singing Tree, and the Golden Water. I know they are somewhere nearby, but not the exact place. Please show me the way, so my journey will not have been useless.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The dervish's face changed. He waited a long time before replying.
        - id: ch04-b07
          speaker: dervish
          text: >-
            My lord, I know the road. But you have been kind to me, and I have come to care what happens to you. That makes me unwilling to point it out.
        - id: ch04-b08
          speaker: bahman
          text: >-
            Why? What danger is there?
        - id: ch04-b09
          speaker: dervish
          text: >-
            The greatest danger. Men as brave as you have come this way and asked the same question. I warned every one of them. None would listen, and none returned. Turn back while you still can.
        - id: ch04-b10
          speaker: bahman
          text: >-
            I thank you for caring about me and for your advice, though I cannot take it. What danger could courage and a good sword fail to meet?
        - id: ch04-b11
          speaker: dervish
          text: >-
            And if the enemies are invisible?
        - id: ch04-b12
          speaker: bahman
          text: >-
            Nothing will make me abandon my quest. I ask you one last time. Tell me where to go.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Seeing that Bahman would not change his mind, the dervish drew a ball from a bag and held it out with a sigh.
        - id: ch04-b14
          speaker: dervish
          text: >-
            Mount your horse and throw this ball ahead of you. It will roll to the foot of a mountain. When it stops, stop too. Dismount and lay the reins on your horse's neck. The animal will not wander. You will see great heaps of black stones on both sides and hear crowds of voices insulting you. Ignore them. Above all, never turn your head. If you look back, you will instantly become a black stone. Every stone there was once a man on this same quest. If you escape that trap and reach the summit, you will find the Talking Bird in a splendid cage. Ask the bird where to find the Singing Tree and the Golden Water. Now you know what to do and what to avoid. If you are wise, you will forget it all and go home.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Bahman smiled and shook his head, showing that even the last warning had not changed his decision. He thanked the dervish for the ball and for explaining the danger, then sprang into the saddle and threw the ball onto the road. It rolled away so swiftly that even on his fine horse, he struggled to keep up. Mile after mile, it maintained the same speed. Only when it reached the foot of the mountain did it stop, and then it halted at once. Bahman dismounted exactly as he had been told. He dropped the reins loosely on his horse's neck, trusting the dervish's promise that it would not stray. Before him, the mountain rose under great masses of black stones. The sight might have reminded him how many men had already failed, but he paused for only a moment. Then he fixed his eyes on the path and began to climb.
        - id: ch04-b16
          speaker: narrator
          text: >-
            He had taken only four steps when voices burst out around him, though no living creature could be seen.
        - id: ch04-b17
          speakers: [mocking_voice_1, mocking_voice_2]
          ensemble: duo
          text: >-
            What fool is this? Stop him! Kill him! Help! Robbers! Murderers! Help!
          emotion: angry
        - id: ch04-b18
          speaker: mocking_voice_3
          text: >-
            Oh, leave him alone. He is such a handsome young man. Surely the bird and its cage have been waiting just for him.
        - id: ch04-b19
          speaker: narrator
          text: >-
            At first, Bahman ignored the uproar and pressed onward. His silence only enraged the voices. They screamed more furiously from ahead and behind. At last he became confused. His knees shook, and as he felt himself falling, he forgot the dervish's warning. He turned to flee down the mountain. In that instant, he became a black stone.
        - id: ch04-b20
          speaker: narrator
          text: >-
            At home, Perviz and Parizade had examined the magic knife many times each day. Until that fatal hour, the blade remained bright and spotless. The moment Bahman and his horse turned to stone, great drops of blood appeared upon it.
        - id: ch04-b21
          speaker: parizade
          text: >-
            Oh, my beloved brother! I will never see you again, and I am the one who killed you. What a fool I was to listen to that woman. Perhaps none of it was true. What do I care for the Talking Bird or the Singing Tree now, however much I wanted them? They are nothing beside you.
          emotion: sad
        - id: ch04-b22
          speaker: narrator
          text: >-
            Perviz grieved no less deeply, but he did not spend his time lamenting.
        - id: ch04-b23
          speaker: perviz
          text: >-
            Why believe the old woman deceived you? What reason could she have had? No. Our brother must have died through an accident or because he missed some precaution. Tomorrow, I will follow the same road.
        - id: ch04-b24
          speaker: narrator
          text: >-
            Terrified of losing her remaining brother, Parizade begged him to abandon the plan. Perviz stayed firm. Before leaving, he gave her a string of one hundred pearls.
        - id: ch04-b25
          speaker: perviz
          text: >-
            Count these beads for me every day while I am gone. If they ever stick and will no longer pass one after another through your fingers, you will know that I have met our brother's fate. Still, let us hope I will be luckier.
        - id: ch04-b26
          speaker: narrator
          text: >-
            Perviz departed. On the twentieth day, he found the dervish in the same place and asked for the three wonders. The dervish tried to turn him back. He even said that a young man who closely resembled him had passed only weeks before and never returned.
        - id: ch04-b27
          speaker: perviz
          text: >-
            That man was my elder brother. I know he is dead, though I do not know how he died.
        - id: ch04-b28
          speaker: dervish
          text: >-
            He became a black stone, like every other man who went on this quest. The same will happen to you unless you follow my directions more carefully.
        - id: ch04-b29
          speaker: narrator
          text: >-
            The dervish told Perviz exactly what had happened to Bahman. Then he repeated every warning, urging the younger prince to value his life enough to follow the instructions. Whatever the voices said, Perviz must ignore them. Whatever seemed to happen behind him, he must not turn. At last, the old man handed him another ball from the bag, which still looked half full, and sent him onward. The ball led Perviz to the same mountain. He jumped from his horse and stood for a moment, carefully calling each warning to mind. Then he strode boldly up the slope. He had gone only five or six paces when a man's voice seemed to shout directly beside his ear.
        - id: ch04-b30
          speaker: mocking_voice_1
          text: >-
            Stop, you reckless fool! Let me punish your insolence!
          emotion: angry
        - id: ch04-b31
          speaker: narrator
          text: >-
            The insult drove every warning from Perviz's mind. He drew his sword and turned to take revenge. Before he fully understood that no one stood there, he and his horse had become two black stones.
        - id: ch04-b32
          speaker: narrator
          text: >-
            Not one morning passed without Parizade counting Perviz's pearls from beginning to end. She did not trust herself to set them aside even at night. Instead, she hung the strand around her neck, so that if she woke in darkness, her hand could find the beads and make certain her brother was still safe. She was moving them one by one through her fingers at the very moment his impatience destroyed him. The first pearl suddenly stuck in place. No matter how she tried, it would not move. Her heart sank, for the sign could have only one meaning. But during the days of waiting, she had decided what she would do if this happened. She would not remain at home grieving while both brothers lay lost. At dawn the next morning, she put on a man's clothing, armed herself for the road, mounted her horse, and set out alone for the mountain.
    - id: ch05
      title: Parizade Wins the Treasures
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Parizade had ridden since childhood, so she covered as many miles each day as her brothers had. On the twentieth day, she reached the dervish beneath the tree.
        - id: ch05-b02
          speaker: parizade
          text: >-
            Good dervish, may I rest beside you for a moment? And perhaps you can tell me whether you have heard of a Talking Bird, a Singing Tree, and Golden Water somewhere near here.
        - id: ch05-b03
          speaker: dervish
          text: >-
            Madam, your clothing is a man's, but your voice reveals you. I will gladly serve you if I can. First, may I ask why you seek these things?
        - id: ch05-b04
          speaker: parizade
          text: >-
            I have heard such wonderful descriptions that I cannot rest until they are mine.
        - id: ch05-b05
          speaker: dervish
          text: >-
            They are more beautiful than any description. But you cannot know the dangers ahead, or you would never have begun this journey. Please turn home. Do not ask me to help you toward a cruel death.
        - id: ch05-b06
          speaker: parizade
          text: >-
            Holy father, I have come too far to return without trying. Tell me every difficulty. Then I can judge whether I may overcome it or whether it truly lies beyond my strength.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The dervish repeated the whole terrible account he had given her brothers. A rolling ball would lead her to the mountain. She must leave her horse below and climb between heaps of black stones, every one of which had once been a living man. Invisible voices would crowd around her, threatening, insulting, and mocking her as she went. Their purpose was to make her turn. If she looked behind even once, she and her horse would become stones as well. Only by reaching the cage and taking hold of it could she escape their power. Again and again, the dervish emphasized the one rule on which her life depended. Until the cage was in her hands, she must keep moving forward and never look back.
        - id: ch05-b08
          speaker: parizade
          text: >-
            Then success depends on ignoring the voices and keeping my eyes ahead. I believe I can refuse to turn. But even the bravest men have been frightened by that noise. I will fill my ears with cotton. The voices may shout as loudly as they please, and I will hear nothing.
        - id: ch05-b09
          speaker: dervish
          text: >-
            Of all the people who have asked me for the road, you are the first to think of escaping the danger that way. You may succeed. Even so, the risk is very great.
          emotion: surprised
        - id: ch05-b10
          speaker: parizade
          text: >-
            Good dervish, my heart tells me I will succeed. I need only the road.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The dervish saw that nothing more could be said. He gave her a ball, and she threw it ahead. At the mountain, Parizade's first act was to stop her ears with cotton. She chose the best path and started upward. Faint echoes still reached her, but they did not disturb her. The higher she climbed, the louder and more insulting the voices became. She only laughed to herself. A few rough words would not stand between her and her goal.
        - id: ch05-b12
          speaker: narrator
          text: >-
            At last, she saw the cage in the distance. The bird's voice joined the others like thunder.
        - id: ch05-b13
          speaker: talking_bird
          text: >-
            Go back! Go back! Do not dare come near me!
          emotion: angry
        - id: ch05-b14
          speaker: narrator
          text: >-
            Parizade hurried toward it. The noise had become deafening, but she walked straight to the cage and seized it.
        - id: ch05-b15
          speaker: parizade
          text: >-
            Now I have you, bird, and I will make certain you do not escape.
        - id: ch05-b16
          speaker: narrator
          text: >-
            She pulled the cotton from her ears. It was no longer needed.
        - id: ch05-b17
          speaker: talking_bird
          text: >-
            Brave lady, do not blame me for joining those who tried to protect my freedom. Though I lived in a cage, I was content. If I must serve someone, I could wish for no nobler mistress than one with such courage and constancy. From this moment, I will serve you faithfully. One day you will test that promise, for I know who you are better than you know yourself. For now, tell me what you need.
        - id: ch05-b18
          speaker: parizade
          text: >-
            First, thank you for your goodwill. Now tell me where I can find the Golden Water.
        - id: ch05-b19
          speaker: narrator
          text: >-
            The bird directed her to a nearby place. Parizade filled the small silver flask she had brought and returned to the cage.
        - id: ch05-b20
          speaker: parizade
          text: >-
            One treasure remains. Where will I find the Singing Tree?
        - id: ch05-b21
          speaker: talking_bird
          text: >-
            Behind you, in that wood.
        - id: ch05-b22
          speaker: narrator
          text: >-
            Parizade walked through the wood until voices of wonderful sweetness led her to the tree. It was far too tall and strong to uproot, so she returned for advice.
        - id: ch05-b23
          speaker: talking_bird
          text: >-
            You need not take the whole tree. Break off one twig and plant it in your garden. It will root there and grow into a magnificent tree.
        - id: ch05-b24
          speaker: narrator
          text: >-
            With the bird, the flask, and a branch in her hands, Parizade possessed all three wonders. But her brothers had paid for them with their lives, and she could not be happy.
        - id: ch05-b25
          speaker: parizade
          text: >-
            This is not enough. My brothers became black stones because of you. I cannot recognize them among all the others, but you must know them. Point them out so I can take them home.
        - id: ch05-b26
          speaker: narrator
          text: >-
            For some reason she could not understand, her demand displeased the bird. It gave no answer. Parizade waited, then spoke more sternly.
        - id: ch05-b27
          speaker: parizade
          text: >-
            Have you forgotten that you called yourself my servant and promised to obey? Have you forgotten that your life is in my hands?
          emotion: angry
        - id: ch05-b28
          speaker: talking_bird
          text: >-
            I have forgotten neither. What you ask is difficult, but I will do my best. Look around and you will see a pitcher nearby. Take it. As you descend, sprinkle a little of its water on every black stone. Before long, you will find your brothers.
        - id: ch05-b29
          speaker: narrator
          text: >-
            Parizade took the pitcher. Now she had to carry it along with the bird's cage, the branch from the Singing Tree, and the silver flask of Golden Water. She began down the mountainside and stopped beside the first black stone. A few drops from the pitcher touched its surface, and in the same instant, a living man stood in its place. She went to the next stone and the next. Every sprinkling released another prisoner from the spell. All along the road, men returned to themselves, while the stones that had been their horses became horses once more. Parizade continued patiently, knowing that Bahman and Perviz must be somewhere among the great number. Then, without warning, her two brothers were standing before her. The joy of seeing them alive was so great that it mingled with astonishment.
        - id: ch05-b30
          speaker: parizade
          text: >-
            Why, what are you doing here?
          emotion: surprised
        - id: ch05-b31
          speakers: [bahman, perviz]
          ensemble: duo
          text: >-
            We have been asleep.
        - id: ch05-b32
          speaker: parizade
          text: >-
            Yes, and without me you might have slept until the day of judgment. Have you forgotten your search for the Talking Bird, the Singing Tree, and the Golden Water? Have you forgotten the black stones along the road? Look around. Not one remains. These gentlemen, both of you, and all your horses were stones. I freed you with water from this pitcher. I had won the treasures, but I could not go home without you, so I forced the bird to tell me how to break the spell.
        - id: ch05-b33
          speaker: narrator
          text: >-
            Bahman and Perviz now understood all they owed their sister. The restored knights declared that they were her servants and would carry out any wish. Parizade thanked them courteously but said she wanted no company beyond her brothers. The others were free to go wherever they pleased.
        - id: ch05-b34
          speaker: narrator
          text: >-
            She mounted her horse and would not even allow Bahman to carry the bird's cage. Instead, she gave him the branch of the Singing Tree. Perviz carried the flask of Golden Water. The rescued men followed, begging to escort them. The company meant to stop and tell the dervish what had happened, but they found him dead. They never knew whether age had taken him or whether he died because his task was finished.
        - id: ch05-b35
          speaker: narrator
          text: >-
            As the company traveled, its numbers slowly diminished. One rescued knight after another reached the road leading toward his own home, said farewell, and turned aside. In the end, only Bahman, Perviz, and Parizade drew rein at the gates of their country house. Parizade carried the cage straight into the garden. The moment the Talking Bird began to sing, birds answered from every direction. Nightingales, larks, thrushes, finches, and many other kinds flew in and mingled their voices with its song. Parizade planted the branch in a corner near the house. It took root at once, and in only a few days, it had become a great Singing Tree. For the third wonder, they prepared a broad marble basin. Parizade emptied her little flask into it. The Golden Water swelled and bubbled, then rose in a fountain twenty feet high. It continued to play without ever running out, yet not one drop spilled over the basin's rim. Word of the Talking Bird, Singing Tree, and Golden Water soon spread across the country. People came from nearby villages and from distant places simply to see and admire them.
    - id: ch06
      title: The Sultan Meets the Princes
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            After a few days, Bahman and Perviz returned to their usual life and spent most of their time hunting. One day the Sultan of Persia hunted in the same part of the country. When the princes heard his party approaching, they prepared to withdraw so they would not disturb his sport. By chance, they turned into the very path along which he was riding. They leaped from their horses and bowed with their faces to the earth. The Sultan wanted to see them and ordered them to rise.
        - id: ch06-b02
          speaker: narrator
          text: >-
            They stood respectfully before him, but without awkwardness. He studied their faces in silence, struck by their appearance and manner. Then he asked who they were and where they lived.
        - id: ch06-b03
          speaker: bahman
          text: >-
            Sire, we are the sons of your Highness's late intendant of the gardens. We live in the house he built shortly before his death, and we wait there for an opportunity to serve you.
        - id: ch06-b04
          speaker: sultan
          text: >-
            You appear to be fond of hunting.
        - id: ch06-b05
          speaker: bahman
          text: >-
            Sire, it is our usual exercise. No man who hopes to follow the ancient customs of this kingdom and bear arms should neglect it.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The answer delighted the Sultan.
        - id: ch06-b07
          speaker: sultan
          text: >-
            Then I will enjoy watching you. Come, choose the animals you wish to hunt.
        - id: ch06-b08
          speaker: narrator
          text: >-
            The brothers mounted and followed at a respectful distance. Soon several wild animals appeared together. Bahman chased a lion while Perviz pursued a bear. Each threw his javelin with such skill that the animals fell as soon as the princes came within range. Then Perviz brought down a lion and Bahman a bear. Both young men prepared to attack a third time, but the Sultan sent an official to call them back.
        - id: ch06-b09
          speaker: sultan
          text: >-
            If I allow you to continue, there will soon be no game left in the forest. Your courage and your manners have won my heart, and I will not let you face more danger. I am sure that one day I will find you useful as well as agreeable companions.
        - id: ch06-b10
          speaker: narrator
          text: >-
            He warmly invited them to live with him at court. The princes thanked him for the great honor but begged to remain in their own home. The Sultan was not used to having his offers refused, and he asked why.
        - id: ch06-b11
          speaker: bahman
          text: >-
            We do not wish to leave our sister, sire. The three of us are accustomed to deciding everything together, and we would not take such a step without asking her.
        - id: ch06-b12
          speaker: sultan
          text: >-
            Then ask her advice. Hunt with me again tomorrow and bring me your answer.
        - id: ch06-b13
          speaker: narrator
          text: >-
            Bahman and Perviz returned home, but the meeting had made so little impression on them that neither remembered to mention it to Parizade. The next morning they met the Sultan in the same place. When he asked what their sister had advised, the brothers glanced at each other and blushed.
        - id: ch06-b14
          speaker: bahman
          text: >-
            Sire, we must beg for your mercy. My brother and I both forgot the matter entirely.
        - id: ch06-b15
          speaker: sultan
          text: >-
            Be certain you remember today, and give me your reply tomorrow.
        - id: ch06-b16
          speaker: narrator
          text: >-
            Yet the same thing happened a second time. Now the princes feared their carelessness would anger him. The Sultan took it good-naturedly. He drew three small golden balls from his purse and placed them in Bahman's hand.
        - id: ch06-b17
          speaker: sultan
          text: >-
            Put these inside your clothing. Tonight, when you loosen your belt, they will fall and make enough noise to remind you of my request.
        - id: ch06-b18
          speaker: narrator
          text: >-
            Everything happened just as he predicted. That evening, the balls dropped to the floor. The brothers hurried into Parizade's rooms just as she was about to go to bed and told her the whole story. The news deeply troubled her, and she did not hide it.
        - id: ch06-b19
          speaker: parizade
          text: >-
            Meeting the Sultan is a great honor and may bring you many advantages. But it places me in a difficult position. I know you refused because you did not want to leave me, and I love you for it. Still, kings dislike having their offers rejected. In time, he might resent you, and that would make me miserable. Ask the Talking Bird. It sees farther than we do. Then tell me what it says.
        - id: ch06-b20
          speaker: narrator
          text: >-
            They brought the bird and explained the Sultan's proposal.
        - id: ch06-b21
          speaker: talking_bird
          text: >-
            The princes must not refuse him. More than that, they should invite the Sultan to visit this house.
        - id: ch06-b22
          speaker: parizade
          text: >-
            Bird, you know how dearly the three of us love one another. Will this not damage our closeness?
        - id: ch06-b23
          speaker: talking_bird
          text: >-
            Not in the least. It will draw you closer still.
        - id: ch06-b24
          speaker: parizade
          text: >-
            Then the Sultan will have to meet me.
        - id: ch06-b25
          speaker: talking_bird
          text: >-
            He must meet you. Everything will end well.
        - id: ch06-b26
          speaker: narrator
          text: >-
            The following morning, the Sultan asked at once whether they had finally consulted their sister. Bahman replied that the brothers were ready to accept his generous offer. He added that Parizade had reproved them for ever hesitating over an honor from their sovereign. The Sultan received both their answer and their apology with great kindness. He told them that their devotion to one another convinced him they would be equally faithful in serving him. For the rest of the day, he kept the brothers close at his side and showed openly how much pleasure he took in their company. This sudden rise of two strangers into royal favor did not please everyone. The grand-vizir and the other courtiers watched with growing vexation.
        - id: ch06-b27
          speaker: narrator
          text: >-
            When the royal procession entered the capital, everyone in the crowded streets stared at the two unknown young men riding near the Sultan.
        - id: ch06-b28
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: >-
            If only the Sultan had sons like those! They look so noble, and they are about the age his own sons would have been.
        - id: ch06-b29
          speaker: narrator
          text: >-
            The Sultan ordered splendid apartments prepared for the brothers and insisted that they dine at his own table. During the meal, he quietly tested whether their minds were equal to their courage and manners. He led the conversation through several fields of science, then turned to history, a subject he especially loved. Bahman and Perviz were never boastful, but whatever subject arose, each had something thoughtful to contribute. They knew facts that surprised the courtiers and expressed their opinions with ease and good judgment. The Sultan found that the more he heard, the more he wanted to hear. He marveled at their education, their taste for knowledge, and the care that must have gone into raising them.
        - id: ch06-b30
          speaker: sultan
          text: >-
            If these young men were my own sons, they could not have been educated better.
        - id: ch06-b31
          speaker: narrator
          text: >-
            At the evening's end, the princes bowed and asked permission to go home. The Sultan's warm farewell encouraged Bahman to make another request.
        - id: ch06-b32
          speaker: bahman
          text: >-
            Sire, may my brother and I ask one favor? The next time your hunt passes our home, would you honor us and our sister by resting there for a little while?
        - id: ch06-b33
          speaker: sultan
          text: >-
            With the greatest pleasure. I am impatient to meet the sister of two such accomplished young men. Expect me the day after tomorrow.
        - id: ch06-b34
          speaker: narrator
          text: >-
            Parizade was anxious to entertain the Sultan properly. She had no experience with court customs, so she hurried to the Talking Bird and asked what food should be served.
        - id: ch06-b35
          speaker: talking_bird
          text: >-
            Dear mistress, your cooks are excellent. Leave the meal to them, with one exception. In the first course, you must serve cucumbers stuffed with pearl sauce.
        - id: ch06-b36
          speaker: parizade
          text: >-
            Cucumbers stuffed with pearls? Who has ever heard of such food? The Sultan expects a dinner he can eat, not one he can merely admire. And every pearl I own would not provide half enough.
          emotion: surprised
        - id: ch06-b37
          speaker: talking_bird
          text: >-
            Do exactly as I say, and only good will come of it. As for the pearls, go into the park at dawn tomorrow. Dig beneath the first tree on the right. You will find all you need.
        - id: ch06-b38
          speaker: narrator
          text: >-
            Parizade trusted the bird because its earlier counsel had always proved right. Even so, the command sounded almost impossible. A box of pearls buried beneath an ordinary tree was nearly as strange as a dish made from them. At dawn the next morning, she took the gardener into the park and led him to the first tree on the right, exactly as the bird had instructed. She marked the place at its foot and told him to dig. For some time, the gardener found only soil. Then his spade struck something solid. They cleared the earth away and uncovered a golden box secured by several small clasps. These opened easily. Inside lay enough pearls for the strange dish. They were not large, but each was beautifully shaped and colored. Parizade left the gardener to fill the hole and carried the box toward the house.
        - id: ch06-b39
          speaker: narrator
          text: >-
            Her brothers had seen her leave so early and wondered why. They dressed and met her on the way back.
        - id: ch06-b40
          speakers: [bahman, perviz]
          ensemble: duo
          text: >-
            Where have you been? Did the gardener come to tell you that he had discovered a treasure?
        - id: ch06-b41
          speaker: parizade
          text: >-
            No. I am the one who found it.
        - id: ch06-b42
          speaker: narrator
          text: >-
            She opened the box and showed them the pearls. As they walked home, she repeated the bird's strange instructions. All three tried to guess what the pearl-stuffed cucumbers could mean. At last, they admitted that no explanation occurred to them. They would have to obey without understanding.
        - id: ch06-b43
          speaker: narrator
          text: >-
            As soon as Parizade entered the house, she summoned the head cook and ordered the Sultan's meal. When the list was complete, she added one final dish.
        - id: ch06-b44
          speaker: parizade
          text: >-
            There is one dish you must prepare especially for the Sultan, and no one else may touch it. Stuff cucumbers with these pearls. You alone must make them.
        - id: ch06-b45
          speaker: narrator
          text: >-
            In all his years of cooking, the man had never heard such an order. He stepped back in amazement, and Parizade read the thought on his face.
        - id: ch06-b46
          speaker: parizade
          text: >-
            You think I have lost my senses. I know exactly what I am doing. Take the pearls, go, and prepare the dish as well as you can.
    - id: ch07
      title: The Truth at the Table
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The next morning, Bahman and Perviz rode to the forest and soon joined the Sultan. The hunt continued until noon, when the heat grew too fierce to go on. As arranged, they turned toward the country house. Bahman remained beside the Sultan while Perviz galloped ahead to warn Parizade.
        - id: ch07-b02
          speaker: narrator
          text: >-
            The moment his Highness entered the courtyard, Parizade bowed at his feet. He bent down and raised her. For several moments, he simply looked at her. Her beauty and grace struck him, and so did the unmistakable air of a royal court in this young woman who had grown up in the country.
        - id: ch07-b03
          speaker: sultan
          text: >-
            Each one is worthy of the others. No wonder the brothers value their sister's judgment so highly. I must learn more about all three.
        - id: ch07-b04
          speaker: narrator
          text: >-
            Once Parizade recovered from the first embarrassment of meeting him, she welcomed her guest.
        - id: ch07-b05
          speaker: parizade
          text: >-
            Sire, this is only a plain country house, suited to people like us who live quietly. It cannot compare with the grand homes of the capital, much less with even the smallest palace belonging to the Sultan.
        - id: ch07-b06
          speaker: sultan
          text: >-
            I cannot agree. I already admire what little I have seen. I will save my final judgment until you show me the rest.
        - id: ch07-b07
          speaker: narrator
          text: >-
            Parizade led him through every room, and the Sultan examined each carefully.
        - id: ch07-b08
          speaker: sultan
          text: >-
            You call this plain? If every country house were like yours, the cities would soon be empty. Now I understand why you do not want to leave. Let us see the gardens. I am certain they are as beautiful as these rooms.
        - id: ch07-b09
          speaker: narrator
          text: >-
            A small door opened directly into the garden. The first thing the Sultan saw was the fountain of Golden Water.
        - id: ch07-b10
          speaker: sultan
          text: >-
            What extraordinary colored water! Where is its spring? How do you make it rise so high? I do not believe anything like this exists elsewhere in the world.
          emotion: surprised
        - id: ch07-b11
          speaker: narrator
          text: >-
            He went closer and studied the fountain until his curiosity was satisfied for the moment. Parizade then guided him toward the Singing Tree. As they approached, unseen voices filled the air. The Sultan stopped, startled.
        - id: ch07-b12
          speaker: sultan
          text: >-
            Where are your musicians hidden? Are they above us or beneath the ground? Voices this lovely should not hide from us.
        - id: ch07-b13
          speaker: parizade
          text: >-
            Sire, all the music comes from the tree ahead. Walk a few steps nearer, and you will hear it more clearly.
        - id: ch07-b14
          speaker: narrator
          text: >-
            The Sultan moved forward. The music delighted him so completely that he stood without speaking for a long time.
        - id: ch07-b15
          speaker: sultan
          text: >-
            Madam, how did this marvelous tree come to your garden? It must have traveled a great distance. I collect wonders, and otherwise I surely would have heard of it. What is it called?
        - id: ch07-b16
          speaker: parizade
          text: >-
            Its only name is the Singing Tree, sire, and it did not grow in this country. Its story is joined to the Golden Water and to the Talking Bird, whom you have not yet met. If you wish, I will tell you everything after you have rested.
        - id: ch07-b17
          speaker: sultan
          text: >-
            You have shown me so many wonders that I cannot feel tired. Let us look once more at the Golden Water. Then I must see this Talking Bird.
        - id: ch07-b18
          speaker: narrator
          text: >-
            He could barely pull himself away from the fountain, which puzzled him more each time he examined it.
        - id: ch07-b19
          speaker: sultan
          text: >-
            You say there is no spring and no pipe carrying this water. I understand only that neither the fountain nor the tree belongs to Persia.
        - id: ch07-b20
          speaker: parizade
          text: >-
            That is true. Look at the basin and you will see it was carved in one piece, so no water can enter through it. Stranger still, I poured in only one small flask. From that little amount came everything you see.
        - id: ch07-b21
          speaker: sultan
          text: >-
            I will puzzle over it no longer today. Take me to the Talking Bird.
        - id: ch07-b22
          speaker: narrator
          text: >-
            Near the house, the Sultan noticed that the air was crowded with birds and song.
        - id: ch07-b23
          speaker: sultan
          text: >-
            Why are there so many more birds here than anywhere else in the garden?
        - id: ch07-b24
          speaker: parizade
          text: >-
            Do you see the cage hanging in the window of the sitting room? That is the Talking Bird. Its voice rises even above the nightingale's, and all these birds gather to sing with it.
        - id: ch07-b25
          speaker: narrator
          text: >-
            The Sultan stepped through the open window into the sitting room. Nearby, the meal waited on a table, but for the moment he paid no attention to it. He listened to the single voice rising above the chorus outside and studied the cage from which it came. The Talking Bird, however, gave no sign that the ruler of Persia had entered. It continued its song exactly as before, and all the gathered birds continued singing with it.
        - id: ch07-b26
          speaker: parizade
          text: >-
            My servant, the Sultan is here. Give him a proper greeting.
        - id: ch07-b27
          speaker: narrator
          text: >-
            The bird stopped at once. Every other bird fell silent with it.
        - id: ch07-b28
          speaker: talking_bird
          text: >-
            Welcome, Sultan. May your life be long and your reign prosperous.
        - id: ch07-b29
          speaker: sultan
          text: >-
            Thank you, good bird. I am delighted to meet the Sultan and King of all birds.
        - id: ch07-b30
          speaker: narrator
          text: >-
            The Sultan sat before the meal laid on a table near the window. He saw his favorite cucumber dish, served himself, and discovered that the stuffing was made of pearls.
        - id: ch07-b31
          speaker: sultan
          text: >-
            This is certainly new! But what can it mean? No one can eat pearls.
          emotion: surprised
        - id: ch07-b32
          speaker: narrator
          text: >-
            Before any of the three young people could answer, the bird spoke.
        - id: ch07-b33
          speaker: talking_bird
          text: >-
            Sire, how can pearls inside a cucumber astonish you when you so easily believed that the Sultana gave birth to a dog, a cat, and a piece of wood instead of children?
        - id: ch07-b34
          speaker: sultan
          text: >-
            I believed it because the women caring for her told me it was true.
        - id: ch07-b35
          speaker: talking_bird
          text: >-
            Those women were the Sultana's own sisters. Jealousy consumed them after you raised her above them, and they invented the whole story to take revenge. Question them and they will confess. Bahman, Perviz, and Parizade are your children. The intendant of your gardens saved them from death and raised them as his own.
        - id: ch07-b36
          speaker: narrator
          text: >-
            In a flash, the truth became clear to the Sultan. His heart confirmed every word.
        - id: ch07-b37
          speaker: sultan
          text: >-
            Bird, I know you have spoken the truth. My children, come and let me embrace you. Embrace one another not only as the brother and sister you have always been, but as children of Persia's royal blood, which could not flow in nobler veins.
        - id: ch07-b38
          speaker: narrator
          text: >-
            For a time, none of them could master their emotion. When they had grown calmer, the Sultan hurried through the rest of the meal. Then he turned to his children again.
        - id: ch07-b39
          speaker: sultan
          text: >-
            Today, you have met your father. Tomorrow, I will bring you the Sultana, your mother. Be ready to welcome her.
        - id: ch07-b40
          speaker: narrator
          text: >-
            The Sultan mounted and rode swiftly to the capital. He immediately summoned the grand-vizir and ordered him to arrest and question the Sultana's sisters that same day. The women were confronted with each other. Their guilt was proved, and within an hour they were executed.
        - id: ch07-b41
          speaker: narrator
          text: >-
            The Sultan did not wait for anyone to return and report that his orders had been carried out. His first thought was for the innocent wife whom he had condemned without examining the accusation. He left the palace on foot, and his entire court followed him through the city to the great mosque. By then, the Sultana had spent many years shut inside the narrow box at its principal door. She still wore the coarse clothing commanded by the Sultan, and the open window still exposed her to every passerby. Before the watching crowd, he approached the prison himself, reached inside, and drew her out with his own hand. Tears filled his eyes as he embraced her.
        - id: ch07-b42
          speaker: sultan
          text: >-
            Madam, I have come to beg forgiveness for the injustice I did you and to repair it as far as I can. I have begun by punishing those who committed this terrible crime. I hope you can forgive me when I bring you to our children. They are the most delightful and accomplished young people in the world. Come with me. Take back your place and every honor that belongs to you.
          emotion: sad
        - id: ch07-b43
          speaker: narrator
          text: >-
            He spoke before a vast crowd. People had hurried from every part of the city at the first hint of what was happening, and within moments the news passed from mouth to mouth.
        - id: ch07-b44
          speaker: narrator
          text: >-
            Early the next day, the Sultan and Sultana put on their robes of state. The disgrace forced upon her was over, and she once again appeared with all the honor of her true position. With the entire court following, they traveled from the capital to their children's country house. There the Sultan brought Bahman, Perviz, and Parizade forward one by one and presented them to their mother. The family had been separated since each child was born, and none of the young people had known why. Now mother and children could finally look upon one another. For a long while, no one had any wish to speak formally. There were only embraces, tears, and tender words.
        - id: ch07-b45
          speaker: narrator
          text: >-
            Then the family sat down to the magnificent dinner prepared for them. After the long journey and all the emotion of their meeting, the meal gave them time to recover and enjoy being together. When everyone was refreshed, they walked out into the garden. The Sultan took pleasure in showing his wife the wonders that had astonished him on his first visit. He led her to the marble basin where the Golden Water rose without overflowing, then to the Singing Tree whose leaves filled the garden with music. The Sultana needed no introduction to the third wonder. She had already seen and personally made the acquaintance of the Talking Bird.
        - id: ch07-b46
          speaker: narrator
          text: >-
            That evening, the whole family rode together toward the capital. The order of the procession showed everyone what had been restored. Bahman and Perviz traveled on either side of their father, while Parizade rode beside the mother from whom she had been separated since birth. Long before they reached the city gates, people had heard the news and hurried out to meet them. The road was lined on both sides, and welcoming cries filled the air as the royal family passed. Parizade carried the Talking Bird in its cage upon her lap. Its clear song rose over the cheering, and all the other birds that followed it added their own voices. Thus the same wonder that had revealed the truth accompanied the children and their mother openly home.
        - id: ch07-b47
          speaker: narrator
          text: >-
            After years of deception, punishment, and separation, the Sultan, the Sultana, and their three children entered the capital as one family. And so they returned together to their father's palace.
