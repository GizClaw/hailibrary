audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    persian_king:
      display_name: 波斯国王
      tts:
        delivery: 威严直率，喜怒鲜明
        timbre: 洪亮厚实
        pace: 从容，激动时加快
        pitch: 中低音
    grand_vizier:
      display_name: 大维齐尔
      tts:
        delivery: 忠诚持重，劝谏时恳切坚定
        timbre: 低沉清晰
        pace: 平稳
        pitch: 中低音
    elder_sister:
      display_name: 大姐
      tts:
        delivery: 爽快直白，嫉妒时尖刻阴冷
        timbre: 清脆偏硬
        pace: 较快
        pitch: 中高音
    second_sister:
      display_name: 二姐
      tts:
        delivery: 精明好胜，常带嘲弄
        timbre: 明亮稍薄
        pace: 轻快
        pitch: 中高音
    sultana:
      display_name: 苏丹后
      tts:
        delivery: 温厚谦逊，遭难后仍保持尊严
        timbre: 柔和清丽
        pace: 从容
        pitch: 中高音
    garden_superintendent:
      display_name: 御花园总管
      tts:
        delivery: 宽厚慈爱，处事稳重
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低音
    bahman:
      display_name: 巴赫曼王子
      tts:
        delivery: 勇敢坦荡，有长兄的担当
        timbre: 清朗坚定
        pace: 明快
        pitch: 中音
    parviz:
      display_name: 佩尔维兹王子
      tts:
        delivery: 热诚果断，年轻而急切
        timbre: 清亮有力
        pace: 较快
        pitch: 中音
    perizade:
      display_name: 佩里扎德公主
      tts:
        delivery: 聪慧温柔，遇到危险时沉着坚定
        timbre: 清丽坚韧
        pace: 从容，决断时稍快
        pitch: 中高音
    holy_woman:
      display_name: 女修士
      tts:
        delivery: 虔诚客气，说起奇物时神秘而笃定
        timbre: 苍老柔和
        pace: 舒缓
        pitch: 中音
    dervish:
      display_name: 德尔维希
      tts:
        delivery: 苍老睿智，劝诫时忧心而诚恳
        timbre: 沙哑低沉
        pace: 缓慢
        pitch: 低音
    talking_bird:
      display_name: 会说话的鸟
      tts:
        delivery: 机敏自信，语气清醒而颇有威严
        timbre: 清越响亮
        pace: 利落
        pitch: 高音
  chapters:
    - id: ch01
      title: 三个心愿与三个孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            从前，波斯有一位名叫霍斯鲁沙的苏丹。他少年时就爱换上平民衣服，带一名也改了装束的臣子，到城里寻访奇事。父王的葬礼和自己的登基大典才结束，他就又叫上大维齐尔，悄悄走进都城僻静的街巷。

            走到一所房子外，苏丹听见几个女子争论得很热闹。他从门缝望进去，看见三姐妹坐在厅里的长榻上，正在说各自想嫁怎样的人。
        - id: ch01-b02
          speaker: elder_sister
          text: 我没别的心愿，嫁给苏丹的面包师就好。陛下吃的面包那么香，到时候我想吃多少就吃多少。我看你们还能许什么更好的愿。
        - id: ch01-b03
          speaker: second_sister
          text: 那我就嫁给苏丹的御厨。宫里那些精美的炖菜，我可以天天吃。而且御厨吃的也是宫中面包，你的好处我一样不少。大姐，我挑的人不比你的差吧？
        - id: ch01-b04
          speaker: sultana
          text: 我的心愿可比你们高。既然要许愿嫁人，那么除了苏丹本人，我谁都不嫁。
        - id: ch01-b05
          speaker: narrator
          text: 苏丹觉得这些话十分有趣，当场决定满足她们。他叫大维齐尔记住这所房子，第二天早晨就把三位姑娘带到御前。她们几乎连更衣的时间都没有，进宫行礼以后，苏丹开门见山地问起昨夜的愿望。
        - id: ch01-b06
          speaker: persian_king
          text: 昨晚你们说笑时许了什么愿，还记得吗？不用害怕，照实说就好。
        - id: ch01-b07
          speaker: narrator
          text: 三姐妹听得慌了神，都低下头，一句话也答不出。小妹脸上泛起红晕，反而更打动了苏丹。
        - id: ch01-b08
          speaker: persian_king
          text: 别怕，我不是要为难你们。你们的愿望，我早就知道了。小妹想嫁给我，今天便会如愿。你们两个也会在同一天，分别嫁给我的面包师和御厨。
        - id: ch01-b09
          speaker: narrator
          text: 三姐妹一起扑倒在苏丹脚下。小妹紧张得说话都不连贯。
        - id: ch01-b10
          speaker: sultana
          text: 陛下，您既然已经知道我说过的傻话，请相信那只是一句玩笑。我根本配不上这样的尊荣，只求您原谅我的冒失。
        - id: ch01-b11
          speaker: narrator
          text: 两位姐姐也想解释，苏丹却不肯再听。
        - id: ch01-b12
          speaker: persian_king
          text: 不必再说。我已经决定了，你们三个的愿望都会实现。
        - id: ch01-b13
          speaker: narrator
          text: |-
            三场婚礼就在同一天举行。小妹的婚礼华贵极了，两位姐姐的婚礼则按面包师和御厨的身份操办。这样的差别本很自然，两人却气愤难平，嫉妒很快变成了仇恨。

            几天后，她们在公共浴室里得到私下说话的机会，便把怨毒全都吐露出来。
        - id: ch01-b14
          speaker: elder_sister
          text: 那个小贱人究竟哪里好，竟能把苏丹迷成那样？你想得明白吗？
          emotion: angry
        - id: ch01-b15
          speaker: second_sister
          text: 他一定是瞎了眼。她不过比我们年轻一点，这算得了什么？要是你做苏丹后，不知比她强多少。
          emotion: angry
        - id: ch01-b16
          speaker: elder_sister
          text: 我又不是只替自己抱屈。他若选了你，我也不会说什么。可他偏偏挑中那个可怜的小东西，叫我怎么咽得下这口气？我一定要报复她。你得帮我，想到能叫她受辱的法子，立刻告诉我。
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: |-
            此后，两姐妹常常碰面商议，在苏丹后面前却仍装得亲密。苏丹后始终温厚待她们。她们很久都找不到下手的机会，直到宫中盼望已久的王嗣将要降生。

            苏丹准许两人住进宫里，她们便日夜守在妹妹身边。第一个男婴出生后，两人把他放进摇篮，让摇篮沿着王宫花园的水渠漂走，再向苏丹谎称，苏丹后生下的不是王子，而是一只小狗。苏丹悲愤得几乎失去理智，大维齐尔竭尽全力，才保住了苏丹后。
        - id: ch01-b18
          speaker: narrator
          text: 摇篮安稳地漂到御花园边缘，被王家园林的总管发现。他叫附近的园丁把摇篮捞上来。看见里面竟然躺着一个俊美的婴儿，总管十分吃惊。他成婚多年，始终没有儿女，便想收养这个孩子。他让园丁抱着摇篮，跟自己回家。
        - id: ch01-b19
          speaker: garden_superintendent
          text: 妻子，上天一直没有赐给我们儿女，如今却送来一个孩子，弥补了这份遗憾。快去请一位乳母。其他事情交给我，我会公开认他作儿子。
        - id: ch01-b20
          speaker: narrator
          text: |-
            总管的妻子欢喜地接过婴儿。总管明知孩子必定来自王宫，却认为自己不该追查其中的秘密。

            第二年，又一位王子被放进水渠，也被总管抱回家。苏丹这一次更加暴怒。第三年，同样的怪事再次发生，他终于无法克制，下令处死苏丹后。她在宫中深受爱戴，大维齐尔和群臣不顾自己也可能遭殃，全都伏在苏丹脚下为她求情。
        - id: ch01-b21
          speaker: grand_vizier
          text: 请陛下饶她一命，只叫她一生再也不能见您。这样的惩罚已经足够沉重了。
        - id: ch01-b22
          speaker: narrator
          text: 最初的盛怒过去，苏丹恢复了自制。
        - id: ch01-b23
          speaker: persian_king
          text: |-
            你们既然一定要为她求情，我就留她一命。但我有一个条件，我要叫她每天都盼着死去。

            在大清真寺门口造一只木笼，窗口永远敞开。叫她穿最粗劣的衣服坐在里面。每个进清真寺的穆斯林，经过时都要向她脸上吐一口唾沫。谁敢不照办，自己也要受同样的刑罚。维齐尔，你要监督此事，不得有误。
        - id: ch01-b24
          speaker: narrator
          text: |-
            大维齐尔明白再劝也没有用。两位姐姐得意地看着木笼造好，听着人群嘲弄被囚在里面的苏丹后。可她一直保持着尊严，默默忍受一切。没过多久，品性高尚的人都开始同情她。

            第三个婴儿是一位公主。她和两个哥哥一样，也被园林总管发现，由他和妻子收养。三个孩子从此在无微不至的爱护中长大。
    - id: ch02
      title: 女修士说起三件奇物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            三个孩子越长越出众，容貌、气度和举止都显出一种天生的高贵。养父用两位波斯古代君王的名字，为两个男孩取名巴赫曼和佩尔维兹。女孩叫佩里扎德，意思是“精灵之女”。

            总管照着他们真正的身份教养他们，请来老师教授读写。佩里扎德不愿落在哥哥们后面，也跟着一起上课，很快就学得和哥哥们一样好。
        - id: ch02-b02
          speaker: narrator
          text: |-
            后来，三人无论学什么都在一起。美术、地理、诗歌、历史、自然学问，甚至很少有人钻研的深奥学科，他们都学得轻松，连老师也赞叹不已。

            佩里扎德尤其喜欢音乐。她歌唱得动人，也会弹奏各种乐器。骑马、驾车、射箭和投标枪，她不比两个哥哥差，有时还胜过他们。
        - id: ch02-b03
          speaker: narrator
          text: |-
            为了让孩子们尽情施展本领，总管不愿再把他们留在御花园那一小片天地里。他在都城几里外买下一座华美的乡间庄园。庄园四周有辽阔的园林，里面放养着各种野兽，三兄妹随时都能骑马打猎，也能练习自己学会的各种本领。

            安排好一切，总管向苏丹请求辞去职务。苏丹念他多年忠心，准许了，又问他想要什么赏赐。总管说，自己只求陛下继续施恩，随后便叩拜退下。
        - id: ch02-b04
          speaker: narrator
          text: |-
            一家人在乡间快活地住了五六个月，总管却突然病逝，甚至没来得及说出三个孩子的身世秘密。他的妻子早已去世，从此似乎再没有人能告诉三兄妹，他们并不是总管亲生的孩子，原本生在比眼下更尊贵的地位。

            三人深深哀悼养父。往后的日子里，他们仍安静地住在庄园。他们有才华，也有优越的生活，却对宫廷的宴乐和权谋毫无兴趣。
        - id: ch02-b05
          speaker: narrator
          text: |-
            一天，两个哥哥照常外出打猎，佩里扎德独自在家。一位年老的穆斯林女修士来到门前，说祈祷的时辰到了，想进来借个地方礼拜。

            公主立刻让仆人领她去花园里的私人礼拜堂，又吩咐等她祷告完，先带她参观整座宅邸和花园，最后再来见自己。老妇人祷告以后一路看过去，既懂得欣赏，也毫不掩饰自己的赞叹。
        - id: ch02-b06
          speaker: narrator
          text: 老妇人信仰虔诚，却也懂得欣赏眼前的华美。一路看下来，她处处由衷赞叹。仆人最后把她领进一间格外富丽的厅室，佩里扎德正在那里等她。
        - id: ch02-b07
          speaker: perizade
          text: 好婆婆，来坐在我身边吧。能和您这样虔诚的人说一会儿话，我很高兴。
        - id: ch02-b08
          speaker: narrator
          text: 老妇人觉得这份礼遇太重，连声推辞。公主坚持请她坐上最好的位置，又想到她参观了许久，一定累了，便叫人送来茶点。等老妇人吃东西时，公主问了许多问题，想知道她平日怎样生活，又做哪些虔诚的修行，最后也问她看完整座宅邸以后，心里觉得怎样。
        - id: ch02-b09
          speaker: holy_woman
          text: 殿下，这里美丽舒适，处处都打理得很好，花园更是可爱极了。若还要挑毛病，那个人实在太难讨好。不过您既然问了，我只好说实话。要称得上真正完美，这里还少三样东西。
        - id: ch02-b10
          speaker: perizade
          text: 少了哪三样？请您告诉我，我马上去找。
          emotion: surprised
        - id: ch02-b11
          speaker: holy_woman
          text: |-
            第一样是会说话的鸟。它一开口，别的鸣禽都会被吸引过来，陪它一起歌唱。

            第二样是歌唱树，每一片叶子都会唱出永不停歇的歌。

            最后是金水。只要往池里滴一滴，它便会变成永不枯竭的喷泉，池水却永远不会溢出来。
        - id: ch02-b12
          speaker: perizade
          text: 世上竟有这样的奇珍！我真不知该怎样谢您。请再告诉我，要去哪里才能找到它们？
          emotion: surprised
        - id: ch02-b13
          speaker: holy_woman
          text: 殿下这样热情地款待我，我当然要回答。三件东西都在同一个地方，就在王国通往印度的边境。派人沿宅子前这条路一直走二十天，到时候向路上遇见的第一个人打听就行。
        - id: ch02-b14
          speaker: narrator
          text: 女修士说完便起身告辞，独自离开了。她走得太快，佩里扎德直到人已经不见，才想到这些指点并不清楚，未必能让寻宝的人找到目的地。可她还是一直想着三件奇物，想象会说话的鸟如何召来群鸟，歌唱树怎样日夜奏乐，金水又会怎样在花园里喷涌。她越想越觉得，若能把它们带回庄园，该是多么美妙。正想着，两个哥哥打猎回来了。
        - id: ch02-b15
          speaker: bahman
          text: 妹妹，你怎么这样忧愁？是身体不舒服，还是出了什么事？
        - id: ch02-b16
          speaker: narrator
          text: 佩里扎德沉默了好一会儿，才抬头说没有什么。巴赫曼却看出她有心事。
        - id: ch02-b17
          speaker: bahman
          text: 一定有事。我们才离开片刻，你就像变了个人。求你别瞒着我们，难道兄妹之间无话不谈的日子已经过去了吗？
        - id: ch02-b18
          speaker: perizade
          text: |-
            我说没事，是因为这只与我有关，可对我确实十分要紧。我们一直以为父亲留下的宅邸样样完美，今天我才知道，它还少了三件东西：会说话的鸟、歌唱树和金水。

            一位穆斯林女修士告诉了我它们的妙处，也说了大概在什么地方。也许你们觉得，宅子没有这些也一样美，我却再不能称心。请替我拿个主意，我们该派谁去把它们找来？
        - id: ch02-b19
          speaker: bahman
          text: 亲爱的妹妹，只要你把这件事放在心上，就足够让我们替你去办，何况我们也和你一样想得到它们。告诉我该往哪里走。身为长兄，本来就该由我先去。
        - id: ch02-b20
          speaker: narrator
          text: 佩尔维兹先提出反对。他说兄长是一家之主，不该让巴赫曼亲自去冒险，自己更适合承担这趟旅程。巴赫曼没有听从，径自做好了出发的准备。第二天一早，他向弟弟妹妹告别，骑上骏马。正要挥鞭启程，佩里扎德忽然叫住他。
        - id: ch02-b21
          speaker: perizade
          text: 也许你这一走就回不来了，谁知道路上会出什么意外！哥哥，求你别去。哪怕永远得不到那三件东西，我也不愿你遇到危险。
          emotion: fearful
        - id: ch02-b22
          speaker: bahman
          text: |-
            亲爱的妹妹，意外只会落在命运不好的人身上，我想自己不会如此。不过世事难料，我答应你，路上一定万分小心。

            收好这把短刀，常常拔出来看看。只要刀身还和今天一样明亮，我就活着。若刀刃染上鲜血，那便是我的死讯，到时你再为我哭吧。
        - id: ch02-b23
          speaker: narrator
          text: 巴赫曼把连鞘的短刀交给妹妹，再次道别。他全副武装，骑马沿大道直行了二十天，既不左转，也不右转，终于来到波斯边境附近。路旁一棵树下坐着一个相貌丑陋的老人，雪白长髭盖住嘴巴，胡须几乎拖到脚面。老人留着长得惊人的指甲，头上那顶大帽子足以遮阳挡雨。
        - id: ch02-b24
          speaker: narrator
          text: |-
            巴赫曼从日出起就在留心路上遇见的第一个人。他看出老人是位德尔维希，便下马行礼，祝他长寿安康。

            老人竭力想回答，话音却被浓密的胡髭挡住，根本听不清。王子明白过来，从鞍袋取出剪刀，请求替他把胡髭剪短，因为自己有一件极要紧的事想问。老人打手势让他尽管动手。王子把他四周的须发各修短几寸，又夸他看起来年轻了许多。德尔维希听见这番恭维，微笑着道了谢。
        - id: ch02-b25
          speaker: dervish
          text: 你叫我舒服多了。说吧，我能替你做什么，也好谢谢你。
        - id: ch02-b26
          speaker: bahman
          text: 善良的德尔维希，我从远方来寻找会说话的鸟、歌唱树和金水。我知道它们就在附近，却不知道确切的位置。请您指点我，别让我白走这一趟。
        - id: ch02-b27
          speaker: narrator
          text: 德尔维希的神色变了。他沉默许久，才终于开口。
        - id: ch02-b28
          speaker: dervish
          text: 殿下，我知道那条路。可你待我这样好，我也已经把你当朋友，实在不忍心指给你。
        - id: ch02-b29
          speaker: bahman
          text: 为什么？那里究竟有什么危险？
        - id: ch02-b30
          speaker: dervish
          text: 危险到了极处。许多和你一样勇敢的人都沿这条路而来，问过我同一个问题。我每次都尽力劝他们回头，可没有一个肯听，也没有一个活着回来。你待我这样仁厚，我实在不愿看你得到同样的下场。现在还来得及，听我的劝，别再往前走。
        - id: ch02-b31
          speaker: bahman
          text: 您这样关心我，我十分感激，可我不能回头。世上有什么危险，是勇气和一柄好剑对付不了的？
        - id: ch02-b32
          speaker: dervish
          text: 要是你的敌人看不见，也摸不着呢？
        - id: ch02-b33
          speaker: bahman
          text: 不管是什么，都不能叫我放弃。请您最后告诉我一次，我该往哪里走？
        - id: ch02-b34
          speaker: narrator
          text: 德尔维希见他决心不改，从身边的袋子里拿出一只圆球。
        - id: ch02-b35
          speaker: dervish
          text: |-
            既然你非去不可，就拿着它。上马以后，把球抛到前面。它会一直滚到一座山脚。球停下，你也停下，把缰绳搭在马颈上，放心下马，它不会走失。

            山路两旁全是巨大的黑石。你还会听见无数看不见的声音辱骂你。千万不要回答，也不要停下，尤其不能回头。一回头，你立刻也会变成黑石。那些石头原来都是像你一样来寻找三件奇物的人。他们没能经受住声音的折磨，全都失败了。我只怕你也会落到相同的下场。

            只要避过这一劫，登上山顶，你就会看见笼中的会说话的鸟。歌唱树和金水在哪里，可以问它。该做什么、该躲开什么，你全知道了。可你若明智，现在就该沿原路回家。
        - id: ch02-b36
          speaker: narrator
          text: 王子只是笑着摇头，再次谢过德尔维希。他跃上马背，把圆球抛向前方，紧紧追了上去。
    - id: ch03
      title: 黑石山上的考验
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            圆球沿大路飞滚，速度丝毫不曾减慢。巴赫曼费了很大力气，才没有被它甩开。到了山脚，球突然停住。王子下马，把缰绳搭在马颈上，站了一会儿，望了望遍布山坡的黑石，便毅然向上走去。

            他才走四步，四周便响起无数声音，眼前却一个生灵也没有。
        - id: ch03-b02
          speaker: narrator
          text: 有的声音喊他是蠢货，催别人快把他拦住。有的尖声叫着“杀了他”，又大喊“强盗”“杀人凶手”和“救命”。还有一个声音说出最叫人难忍的讥讽，要大家别碰他，因为他长得这样俊美，那只鸟和笼子一定专为他留下。
        - id: ch03-b03
          speaker: narrator
          text: |-
            起初，王子完全不理会，只管继续登山。那些声音见他不停，反倒恼怒起来，变得加倍凶猛，从前后左右一齐向他袭来。渐渐地，他神智昏乱，双膝也开始发抖。

            就在快要跌倒时，他忘了德尔维希的警告，转身想逃下山。刹那间，他和坐骑一同变成了黑石。
        - id: ch03-b04
          speaker: narrator
          text: |-
            佩尔维兹和佩里扎德一直忧心忡忡，每天不知要看多少次那把短刀。此前刀身始终明亮，可就在巴赫曼化为黑石的那一刻，刀刃上忽然冒出大滴鲜血。

            公主惊恐地扔下短刀，放声痛哭。
        - id: ch03-b05
          speaker: perizade
          text: 我亲爱的哥哥，我再也见不到你了！是我害死了你。我真愚蠢，竟听信那个老妇人，也许她说的根本不是真的！不管我多想得到它们，会说话的鸟和歌唱树又怎么能与你相比？
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: 佩尔维兹失去兄长，同样悲痛，却没有一直哀叹下去。
        - id: ch03-b07
          speaker: parviz
          text: 妹妹，你为什么认定老妇人骗了你？她这样做又有什么好处？不，哥哥一定是遇到了意外，或者一时疏忽才丧命。明天我就沿着同一条路出发。
        - id: ch03-b08
          speaker: narrator
          text: 佩里扎德想到自己也许连最后一个哥哥都会失去，吓得苦苦哀求。佩尔维兹心意已定。临行前，他把一串用一百颗珍珠穿成的念珠交给妹妹。
        - id: ch03-b09
          speaker: parviz
          text: 我走以后，你每天把珠子数一遍。若它们忽然粘住，一颗也拨不动，那就说明我也遇到了哥哥的命运。不过，我们还是该盼着我运气更好。
        - id: ch03-b10
          speaker: narrator
          text: |-
            佩尔维兹出发了。旅程的第二十天，他在哥哥遇见老人的同一个地方碰到德尔维希，便向他打听三件奇物。德尔维希像劝巴赫曼那样劝他放弃，还说就在几个星期前，有个和他相貌极像的年轻人经过这里，从此再也没有回来。
        - id: ch03-b11
          speaker: parviz
          text: 尊敬的德尔维希，那是我的兄长。他已经死了，只是我还不知道他怎样死去。
        - id: ch03-b12
          speaker: dervish
          text: 他和其他寻宝人一样，已经变成了黑石。你若不能比他更谨慎地听从我的指示，也会得到同样的下场。
        - id: ch03-b13
          speaker: narrator
          text: 德尔维希郑重告诫他，登山时无论身后的声音怎样叫骂，都不能理会。随后，他又从那只仍装着半袋圆球的袋子里取出一只，交给王子。
        - id: ch03-b14
          speaker: narrator
          text: |-
            佩尔维兹来到山脚，下马以后先在心里重温了一遍老人的指示，才大胆上山。可是刚走五六步，一个男人的声音忽然贴着他耳边怒喝，要他站住受罚。

            这句冒犯一下激怒了王子。他忘了全部告诫，拔剑转身，要教训那个无礼的人。还没等他看清那里空无一人，他和坐骑已经成了两块黑石。
        - id: ch03-b15
          speaker: narrator
          text: |-
            佩尔维兹离家后，佩里扎德每天早晨都数一遍念珠，夜里甚至把它挂在颈上，好在醒来时立刻确认哥哥是否平安。哥哥因为急躁而遇难的那一刻，她正好在拨念珠。第一颗珍珠突然纹丝不动，再也不能一颗接一颗滑过去，她的心顿时沉了下去。

            可公主早已想好，若真有这一天，自己要怎么办。第二天清早，她换上男装，也向那座山出发了。
        - id: ch03-b16
          speaker: narrator
          text: 公主从小擅长骑马，每天赶的路不比两个哥哥少。和他们一样，第二十天，她来到德尔维希坐着的地方。她先礼貌地请求在老人身边歇一会儿，又问他是否听说过附近有会说话的鸟、歌唱树和金水。
        - id: ch03-b17
          speaker: dervish
          text: 姑娘，你虽然穿着男装，声音却已经泄露了身份。只要我做得到，我很愿意帮助你。不过，你为什么要打听这三样东西？
        - id: ch03-b18
          speaker: perizade
          text: 善良的德尔维希，我听说它们奇妙极了。若不能亲手得到，我再也无法安心。
        - id: ch03-b19
          speaker: dervish
          text: 它们比任何描述都更美妙，可你显然不知道路上有多危险。求你回家吧，别让我帮你走向死亡。
        - id: ch03-b20
          speaker: perizade
          text: 我从很远的地方赶来，没达到目的便回去，只会绝望。请把危险一一告诉我，让我自己判断能不能克服。
        - id: ch03-b21
          speaker: narrator
          text: 德尔维希便把先前的警告又讲了一遍。这一次，他说得更加仔细，讲到山上的可怕叫嚣，讲到那些黑石原本全是活人，也讲到山路怎样艰难。他再三强调，能否成功，最要紧的一点就是抓住鸟笼以前无论如何也不能回头。
        - id: ch03-b22
          speaker: perizade
          text: 最要紧的，就是拿到鸟笼以前只看前方，不理身后的声音。一直不回头，我想自己做得到。可那些叫喊连最勇敢的男子也能吓倒，我也可能害怕。所以我要用棉花塞住耳朵，让自己一句也听不见。
        - id: ch03-b23
          speaker: dervish
          text: 姑娘，来问路的人多得数不清，想到这个办法的，你还是第一个！也许你真的会成功，可风险仍旧很大。
          emotion: surprised
        - id: ch03-b24
          speaker: perizade
          text: 善良的德尔维希，我知道自己一定会成功。现在只请您告诉我该怎样走。
        - id: ch03-b25
          speaker: narrator
          text: 老人知道再劝也没有用，只好把圆球交给她。公主将球抛向前方，跟着它来到山脚。她先用棉花堵住双耳，选定一条合适的路，便开始登山。
        - id: ch03-b26
          speaker: narrator
          text: |-
            隔着棉花，仍有一点声音的回响钻进耳中，却已经不能扰乱她。她始终望着山顶，一步也不停。越往上走，叫骂越响，也越难听，公主反而笑了。她心想，两个哥哥会被这些声音激怒，自己却早已做好准备。几句粗话休想拦住她达到目的。

            终于，她远远看见了鸟笼。笼中的鸟吼声如雷，也和那些声音一起叫她回去，不许她靠近。
        - id: ch03-b27
          speaker: narrator
          text: 公主看见鸟，脚下走得更快。震耳欲聋的喧嚣没能叫她慌乱。她径直来到笼前，一把将它抓住，又取出耳中的棉花。
        - id: ch03-b28
          speaker: perizade
          text: 小鸟，现在你落在我手中了，我绝不会再让你逃掉。
        - id: ch03-b29
          speaker: talking_bird
          text: |-
            勇敢的姑娘，请别怪我也跟着那些竭力维护我自由的声音叫喊。我虽然被关在笼里，本来已经接受了自己的命运。可若注定要服侍别人，我再找不到比你这样勇敢坚定的人更高贵的主人。

            从现在起，我会忠心服侍你。总有一天，你会亲自看到我的本领，因为我比你更清楚你是谁。眼下请说吧，你要我做什么？
        - id: ch03-b30
          speaker: narrator
          text: 想到两个哥哥都为这只鸟丧命，公主心中竟涌起一股连自己也觉得奇怪的喜悦。
        - id: ch03-b31
          speaker: perizade
          text: 小鸟，先谢谢你的好意。现在请告诉我，金水在哪里？
        - id: ch03-b32
          speaker: narrator
          text: 鸟儿说出一个不远的地方。公主走过去，用带来的银瓶装满金水，随即回到笼边。
        - id: ch03-b33
          speaker: perizade
          text: 还剩一样。歌唱树要去哪里找？
        - id: ch03-b34
          speaker: talking_bird
          text: 就在你身后的树林里。
        - id: ch03-b35
          speaker: narrator
          text: 公主走进树林，顺着世上最甜美的歌声找到那棵树。可是树干高大粗壮，根本不可能连根挖走。她只好回来请教鸟儿。
        - id: ch03-b36
          speaker: talking_bird
          text: 不必挖整棵树。折下一根细枝，种进你的花园，它自己会生根，长成一棵壮丽的大树。
        - id: ch03-b37
          speaker: narrator
          text: 佩里扎德终于把三件奇物都拿到了手。可她看着鸟儿，心里想的还是两个哥哥。
        - id: ch03-b38
          speaker: perizade
          text: |-
            这还不够。我的哥哥们因为你变成了黑石。那么多石头，我认不出哪两块是他们，你一定知道。

            请把他们指出来，我要带他们一起回家。
        - id: ch03-b39
          speaker: narrator
          text: 鸟儿像是有些不快，没有回答。公主等了一会儿，语气严厉起来。
        - id: ch03-b40
          speaker: perizade
          text: 你忘了吗？你亲口说自己是我的奴仆，愿意听我差遣。你的性命也还在我手里。
        - id: ch03-b41
          speaker: talking_bird
          text: 我没有忘。只是你要求的事实在很难。不过我会尽力。回头看，附近有一只水罐。下山时，往每块黑石上洒一点罐中的水，很快就能找到你的哥哥。
        - id: ch03-b42
          speaker: narrator
          text: |-
            公主拿起水罐，又带好鸟笼、树枝和银瓶，沿山坡往回走。每遇到一块黑石，她都停下来洒一点水。水刚碰到石头，石头立刻变回一个人。那些人的坐骑也一一恢复了原样。

            两个哥哥突然出现在面前时，她又惊又喜。
        - id: ch03-b43
          speaker: perizade
          text: 咦，你们在这里做什么？
          emotion: surprised
        - id: ch03-b44
          speakers: [bahman, parviz]
          ensemble: duo
          text: 我们刚刚睡了一觉。
        - id: ch03-b45
          speaker: perizade
          text: |-
            是啊。要是没有我，你们这一觉恐怕要睡到末日审判。你们忘了自己来找会说话的鸟、歌唱树和金水吗？也忘了满山的黑石？

            看看四周，现在还有一块黑石吗？这些先生、你们两个，还有所有坐骑，原先都变成了石头。我把罐中的水洒上去，才让大家恢复原样。

            我已经拿到三件奇珍，可我绝不会丢下你们独自回去。所以我逼着鸟儿说出了破解魔法的办法。
        - id: ch03-b46
          speaker: narrator
          text: 两位王子听完这番话，才明白自己欠妹妹多大的恩情。周围获救的骑士和贵人也说，公主救了他们的性命，他们愿意从此做她的奴仆，听她差遣。公主谢过大家的好意，只说自己有两个哥哥陪伴便够了，不需要别人随侍，请众人各自回家。
        - id: ch03-b47
          speaker: narrator
          text: |-
            公主跨上坐骑。巴赫曼想替妹妹携带鸟笼，她却没有答应，只把歌唱树的枝条交给他，又让佩尔维兹照看装有金水的银瓶。三兄妹一同离开。那些获救的骑士和贵人仍请求护送，于是也跟在他们身后。

            他们原想经过德尔维希那里时停下来讲述经历，却悲伤地发现老人已经去世。究竟是年纪太大，还是因为使命已经完成，没有人知道。
        - id: ch03-b48
          speaker: narrator
          text: |-
            继续赶路以后，同行的人一天比一天少。那些骑士和贵人本来来自不同地方，随着道路分开，便一个接一个告别兄妹三人，转向自己的家园。最后走完全程，在庄园门前勒马停下的，只剩兄妹三人。

            佩里扎德把鸟笼径直带进花园。鸟儿一开口，夜莺、云雀、鸫鸟、雀鸟和各种飞禽都来陪它歌唱。她把树枝种在屋旁一角，短短几天便长成一棵大树。金水则被倒进特意准备的大理石池中。池水先翻滚冒泡，接着腾空喷起六米多高的水柱，却始终没有漫出池沿。

            三件奇物的名声很快传向四方，远近的人纷纷赶来观赏。
    - id: ch04
      title: 狩猎场上的相逢
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            几天后，巴赫曼和佩尔维兹恢复了平常的生活，大部分时间都在打猎。一天，波斯苏丹恰好也在附近围猎。兄弟二人听见猎队接近，不愿打扰陛下，正想避开，却偏偏转进了苏丹迎面而来的道路。

            他们立刻下马伏地行礼。苏丹想看清两人的容貌，便叫他们起身。他默默端详了一会儿，才问他们是谁，住在哪里。
        - id: ch04-b02
          speaker: bahman
          text: 陛下，我们是已故御花园总管的儿子，住在父亲去世前不久建成的宅子里，一直等着有机会为您效力。
        - id: ch04-b03
          speaker: persian_king
          text: 看来你们很喜欢打猎。
        - id: ch04-b04
          speaker: bahman
          text: 陛下，这是我们平日的操练。一个男子若想遵循王国的古老传统，拿得起兵器，就不该荒废这门本领。
        - id: ch04-b05
          speaker: persian_king
          text: 好，那我正想看看你们的身手。来吧，想猎什么野兽，由你们自己挑。
        - id: ch04-b06
          speaker: narrator
          text: |-
            两位王子跃上马背，隔着一点距离跟随苏丹。没走多远，一群野兽同时出现。巴赫曼纵马追赶一头狮子，佩尔维兹则追一头熊。两人的标枪使得出神入化，刚到可以投掷的距离，两支长枪便准确贯穿猎物，狮子和熊一齐倒地。

            接着，佩尔维兹追狮子，巴赫曼追熊。不到几分钟，两头野兽也倒下了。兄弟二人正要第三次追击，苏丹却派人把他们叫了回来。
        - id: ch04-b07
          speaker: persian_king
          text: 再让你们猎下去，这片猎场很快就没有野兽了。你们的勇气和风度都叫我喜欢，我不能再让你们冒险。我相信，总有一天，你们不仅会赢得我的喜爱，还会成为我的得力助手。
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: 苏丹热情地邀请兄弟二人留在身边。他们再三感谢，却请求陛下准许自己仍住在家中。苏丹从没见人拒绝过这样的提议，便问他们为什么。
        - id: ch04-b09
          speaker: bahman
          text: 陛下，我们不愿离开妹妹。兄妹三人早已习惯，无论遇到什么事，都要一起商量。
        - id: ch04-b10
          speaker: persian_king
          text: 那就回去问她。明天仍来陪我打猎，再把她的答复带给我。
        - id: ch04-b11
          speaker: narrator
          text: |-
            两位王子回到家，这场奇遇竟没在心里留下多深的印象，谁也没想起要告诉妹妹。第二天早晨，他们照常出门打猎，又在原来的地方遇见苏丹。苏丹一见二人，便问妹妹给了什么意见。兄弟俩这才想起自己的承诺，相互看了一眼，都羞得红了脸。
        - id: ch04-b12
          speaker: bahman
          text: 陛下，只能求您宽恕了。我和弟弟谁也没有想起来。
        - id: ch04-b13
          speaker: persian_king
          text: 那么今天千万别再忘了，明天把答复带来。
        - id: ch04-b14
          speaker: narrator
          text: |-
            不料第二次还是一样。兄弟二人担心苏丹会因他们的疏忽动怒，苏丹却没有计较。他从钱袋里拿出三颗小金球，交给巴赫曼。
        - id: ch04-b15
          speaker: persian_king
          text: 把金球放进怀里。这一次，你们不会再忘了。今晚解下腰带时，它们掉到地上的声音自然会提醒你们。
        - id: ch04-b16
          speaker: narrator
          text: 果然，兄弟二人走进妹妹房间时，金球提醒了他们。他们把事情从头到尾讲了一遍。佩里扎德听后十分不安，也没有掩饰自己的心情。
        - id: ch04-b17
          speaker: perizade
          text: |-
            能遇见苏丹，是你们极大的荣耀，对你们也一定有好处。你们为了我推辞，我很感激，可这也叫我十分为难。

            君王不喜欢被人拒绝。时间久了，他也许会对你们不满，那会让我很痛苦。去问问那只聪明又有远见的鸟吧，再把它的话告诉我。
        - id: ch04-b18
          speaker: narrator
          text: 兄妹三人把鸟笼取来，将整件事说给鸟儿听。
        - id: ch04-b19
          speaker: talking_bird
          text: 两位王子绝不能拒绝苏丹。不仅如此，你们还应该邀请他来看看这座宅邸。
        - id: ch04-b20
          speaker: perizade
          text: 可是，小鸟，你知道我们兄妹多么亲爱。这样做，难道不会伤害我们的感情吗？
        - id: ch04-b21
          speaker: talking_bird
          text: 绝不会。你们只会变得更加亲近。
        - id: ch04-b22
          speaker: perizade
          text: 那么，苏丹也会见到我了。
        - id: ch04-b23
          speaker: talking_bird
          text: 他一定要见你，而且一切都会得到最好的结果。
        - id: ch04-b24
          speaker: narrator
          text: |-
            第二天，苏丹问兄弟二人是否已同妹妹商量。巴赫曼回答，他们愿意听从陛下，妹妹还责怪他们不该犹豫。苏丹宽厚地接受了道歉，相信两人也会忠于自己。

            他一整天都把兄弟俩留在身边。这份格外亲近的待遇，叫大维齐尔和其余朝臣很不痛快。队伍就按这样的次序进入都城大门。街上挤满百姓，人人都把目光投向苏丹身旁这两个谁也不认识的年轻人。
        - id: ch04-b25
          speaker: narrator
          text: 人们彼此低声议论，要是苏丹有两个这样的儿子，那该多好。这两个年轻人气度如此不凡，年纪又恰好和陛下失去的两位王子相仿。
        - id: ch04-b26
          speaker: narrator
          text: |-
            苏丹下令给兄弟二人准备华美的房间，还坚持让他们和自己同桌用餐。席间，他有意把话题引向各种学问，又说起自己格外喜爱的历史。无论谈到什么，他都发现两位年轻人的见解值得倾听。他们不但知道得多，答话也从容得体，既不卖弄，也不畏缩。

            苏丹心想，就算是自己的亲生儿子，也不可能受到更好的教养。他嘴上也称赞二人学识广博，喜欢求知。
        - id: ch04-b27
          speaker: narrator
          text: 夜晚结束时，两位王子再次伏在御座前，请求回家。苏丹温和地向他们道别。巴赫曼见陛下心情很好，便鼓起勇气开口。
        - id: ch04-b28
          speaker: bahman
          text: 陛下，请原谅我们的冒昧。下次猎队经过寒舍附近时，您愿不愿进屋歇息一会儿，让我们兄妹有机会侍奉您？
        - id: ch04-b29
          speaker: persian_king
          text: 我非常愿意。你们这样才德出众，我早就想见见那位深受你们看重的妹妹。后天，我便去拜访。
        - id: ch04-b30
          speaker: narrator
          text: 佩里扎德很想用最合礼数的方式招待苏丹，可她不熟悉宫廷规矩，只好去问会说话的鸟，该准备哪些菜肴。
        - id: ch04-b31
          speaker: talking_bird
          text: 亲爱的主人，你的厨师都很出色，其他事情尽可交给他们。只有一样要记住。第一道菜里，必须有一盘用珍珠作馅的黄瓜。
        - id: ch04-b32
          speaker: perizade
          text: 珍珠填馅的黄瓜？谁听说过这种菜！苏丹是来吃宴席，不是来看摆设。何况把我所有珍珠都拿出来，也远远不够。
          emotion: surprised
        - id: ch04-b33
          speaker: talking_bird
          text: 主人，照我的话做，结果只会对你有利。至于珍珠，明天黎明时去花园，在右手边第一棵树下挖土，想要多少就有多少。
        - id: ch04-b34
          speaker: narrator
          text: |-
            公主信任这只一向言之有验的鸟。第二天一早，她带着园丁来到那棵树下，仔细照着鸟儿的指点挖掘。过了一会儿，土中露出一只带小搭扣的金盒。搭扣很容易就打开了，盒里全是珍珠。颗颗不算很大，却圆润匀称，光泽极好。

            公主让园丁填平土坑，自己抱着金盒回屋。两个哥哥奇怪她为何这样早出门，也起身迎了过来。
        - id: ch04-b35
          speakers: [bahman, parviz]
          ensemble: duo
          text: 你去做什么了？难道园丁告诉你，他挖到了宝藏？
        - id: ch04-b36
          speaker: perizade
          text: 正好相反，是我找到了一件宝藏。
        - id: ch04-b37
          speaker: narrator
          text: 公主打开盒子，让惊讶的哥哥们看见里面的珍珠，又在回屋的路上讲了自己怎样请教鸟儿，以及鸟儿给了什么古怪的吩咐。兄妹三人把能想到的理由都猜了一遍，仍旧不明白珍珠为什么要装进黄瓜。最终，他们只能承认猜不出来，决定信任鸟儿，闭着眼睛照办。
        - id: ch04-b38
          speaker: narrator
          text: 公主进屋后首先召来御厨，先吩咐他准备宴席上的各种菜肴。说完以后，她才补充那道专为苏丹做的菜。除了御厨本人，谁也不许碰它。那是一根填馅黄瓜，馅料必须用盒中的珍珠。御厨掌勺一生，从没听过这种菜，以为自己听错了，惊得向后退了一步。
        - id: ch04-b39
          speaker: perizade
          text: 你一定以为我疯了，可我很清楚自己在做什么。拿上珍珠去吧，尽你的本领把菜做好。
    - id: ch05
      title: 会说话的鸟揭开真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            次日早晨，两位王子先到森林等候。不久，苏丹前来会合。众人一直狩猎到正午，天气变得酷热难当，才不得不停下。按照约定，队伍掉转马头，前往兄妹三人的庄园。巴赫曼陪在苏丹身边，佩尔维兹先赶回去通知妹妹，他们就要到了。

            苏丹一走进庭院，公主便伏倒在他脚下。苏丹俯身扶她起来，凝神望着她看了许久。她的风姿与美貌让他惊叹，这个乡间姑娘身上还萦绕着一种说不出的宫廷气度。苏丹心想，兄妹三人的确彼此相称，难怪两个哥哥如此看重她的意见。他一定要更多了解这三个年轻人。
        - id: ch05-b02
          speaker: narrator
          text: 佩里扎德从初见君王的窘迫中镇定下来，开口欢迎客人。
        - id: ch05-b03
          speaker: perizade
          text: 陛下，这只是一所简朴的乡间宅子，适合我们这样安静生活的人。它比不上都城里的宏伟府邸，更不能和您最小的一座宫殿相比。
        - id: ch05-b04
          speaker: persian_king
          text: 我可不能完全同意。单是已经看到的地方，就叫我十分喜欢。等你带我看完整座宅子，我再下判断。
        - id: ch05-b05
          speaker: narrator
          text: 公主带着苏丹走过一间又一间屋子，苏丹处处仔细观看。
        - id: ch05-b06
          speaker: persian_king
          text: |-
            你竟说这只是简朴的乡间宅子？若乡下的住宅都有这样美，人们很快就要把城镇丢空了。我现在完全明白，你们为什么不愿离开这里。

            再带我看看花园吧。我相信，那里一定不会比屋里逊色。
        - id: ch05-b07
          speaker: narrator
          text: 一扇小门通向花园。苏丹第一眼便看见了金水。
        - id: ch05-b08
          speaker: persian_king
          text: 这水的颜色真美！泉眼在哪里？你们用什么办法让水喷得这样高？我不相信世上还有第二处这样的奇观。
          emotion: surprised
        - id: ch05-b09
          speaker: narrator
          text: 苏丹走近喷泉，仔细看了一会儿。等他满足了好奇心，公主又领他去看歌唱树。越走近，空中越是充满奇妙的歌声，可周围一个人也看不见。苏丹十分惊讶。
        - id: ch05-b10
          speaker: persian_king
          text: 你把乐师藏到哪里去了？在空中，还是地下？歌声这样动人，实在不该叫他们躲着。
          emotion: surprised
        - id: ch05-b11
          speaker: perizade
          text: 陛下，声音全从前面那棵树上传来。再走几步，您会听得更清楚。
        - id: ch05-b12
          speaker: narrator
          text: 苏丹照她的话又向前走了几步。歌声果然越来越清楚，他听得心醉神迷，站在那里久久没有说话。
        - id: ch05-b13
          speaker: persian_king
          text: |-
            告诉我，这棵神奇的树怎样来到了你的花园？它一定生在很远的地方。不然，我这样喜爱奇珍异宝，不会从没听说过它。

            它叫什么名字？
        - id: ch05-b14
          speaker: perizade
          text: 陛下，它就叫歌唱树，并不生长在我国。它的来历与金水，还有您尚未见过的会说话的鸟连在一起。若您愿意，等休息以后，我会把整个故事讲给您听。
        - id: ch05-b15
          speaker: persian_king
          text: 看见这么多奇观，我怎么还会疲倦？我们先再看一眼金水，我也急着见到那只会说话的鸟。
        - id: ch05-b16
          speaker: narrator
          text: 苏丹几乎舍不得离开金水。他绕着大理石池仔细察看，既找不到泉眼，也看不见把水送进来的管道。池中只有最初那一小瓶金水，却能不停翻滚，喷起高高的水柱，又从来不会漫出来。这道奇泉让他越看越不明白。
        - id: ch05-b17
          speaker: persian_king
          text: 你说它不是从泉眼涌出，也没有管道送水。现在我只明白一件事，它和歌唱树都不是我国的东西。
        - id: ch05-b18
          speaker: perizade
          text: |-
            陛下说得对。仔细看就会发现，整座池子是从一块大理石中凿出来的，水不可能从池底的管道流进来。

            更奇妙的是，我当初只倒进一小瓶金水，它便自己变成了眼前这么多。
        - id: ch05-b19
          speaker: persian_king
          text: 好吧，今天不再看了。带我去见会说话的鸟。
        - id: ch05-b20
          speaker: narrator
          text: 回宅子的路上，苏丹发现这里聚集的飞鸟多得惊人，远远超过花园其他地方。它们的歌声交织在一起，几乎充满天空。他越看越奇怪，便问公主，为何群鸟全都来到这里。
        - id: ch05-b21
          speaker: perizade
          text: 陛下看见厅堂窗边挂着的鸟笼了吗？笼里就是会说话的鸟。它的声音盖过所有飞鸟，甚至胜过夜莺。群鸟都被吸引到这里，用自己的歌声陪它合唱。
        - id: ch05-b22
          speaker: narrator
          text: 苏丹从窗边走进厅堂，鸟儿仍旧唱着，根本没有理会他。
        - id: ch05-b23
          speaker: perizade
          text: 我的奴仆，这位是苏丹。快说几句好听的话欢迎陛下。
        - id: ch05-b24
          speaker: narrator
          text: 鸟儿立刻停止歌唱，其他飞鸟也全都静了下来。
        - id: ch05-b25
          speaker: talking_bird
          text: 欢迎苏丹驾临。愿陛下长寿，事事兴盛。
        - id: ch05-b26
          speaker: persian_king
          text: 谢谢你，善良的鸟儿。我也很高兴见到你这位百鸟的苏丹和君王。
        - id: ch05-b27
          speaker: narrator
          text: 苏丹在窗旁已经摆好的宴席前坐下。桌上菜肴丰盛，他第一眼便看见了自己最爱吃的黄瓜，于是高兴地盛了一份。可是才拿到面前，他就发现黄瓜里面没有寻常馅料，填的竟是一颗颗光泽明亮的珍珠。
        - id: ch05-b28
          speaker: persian_king
          text: 这可真是从没见过！为什么要这样做？珍珠又不能吃。
          emotion: surprised
        - id: ch05-b29
          speaker: narrator
          text: 两位王子和公主还没来得及回答，鸟儿先开了口。
        - id: ch05-b30
          speaker: talking_bird
          text: 陛下看见珍珠填馅的黄瓜，何必这样惊讶？从前有人说，苏丹后生下的不是孩子，而是一条狗、一只猫和一根木头，您不是很容易就相信了吗？
        - id: ch05-b31
          speaker: persian_king
          text: 我会相信，是因为侍候她的女人亲口这样告诉我。
        - id: ch05-b32
          speaker: talking_bird
          text: |-
            陛下，那两个女人正是苏丹后的姐姐。她们嫉妒妹妹得到您的尊荣，为了报复，才编出这个谎言。只要审问，她们自然会认罪。

            眼前这三个人就是您的孩子。御花园总管把他们从死亡中救出来，又当作亲生儿女抚养成人。
        - id: ch05-b33
          speaker: narrator
          text: 真相像闪电一样照亮了苏丹的心。眼前三个年轻人的年纪、气度，还有自己一见他们便生出的亲近之情，这时全有了解释。他转向鸟儿，又转向三个孩子，激动得再也无法克制。
        - id: ch05-b34
          speaker: persian_king
          text: |-
            鸟儿，我的心告诉我，你说的全是真的。

            我的孩子们，让我拥抱你们，你们也彼此拥抱吧。从今天起，你们不只是兄妹，也要知道自己流着波斯王室的血。这高贵的血统，再不可能落在比你们更高贵的人身上。
          emotion: happy
        - id: ch05-b35
          speaker: narrator
          text: 最初那阵激动稍稍平息后，苏丹匆匆吃完宴席，再次转向孩子们。
        - id: ch05-b36
          speaker: persian_king
          text: 今天，你们终于认识了父亲。明天，我会带你们的母亲苏丹后一起来。准备迎接她吧。
          emotion: happy
        - id: ch05-b37
          speaker: narrator
          text: |-
            苏丹立刻上马，飞快赶回都城。他一刻也没有耽搁，召来大维齐尔，下令当天就逮捕苏丹后的两个姐姐，把她们带来当面对质，立即审问。那些多年前看似不可思议的怪事，如今已有了清楚的解释。他不肯再让无辜的妻子多受片刻折磨。

            命令很快执行。姐妹二人被带来当面对质。鸟儿揭出的真相与当年的每一件事都能相互印证，她们再也无法狡辩。罪证确凿，不到一个时辰，两人便为自己的恶行付出了性命。
        - id: ch05-b38
          speaker: narrator
          text: 苏丹没有留下等候回报，而是立刻步行前往大清真寺，满朝文武全跟在身后。那只狭窄的木笼仍立在寺门口，窗口依旧敞开。苏丹走到受尽多年羞辱的妻子面前，亲手把她从木笼中扶出来，流着眼泪拥抱她。
        - id: ch05-b39
          speaker: persian_king
          text: |-
            夫人，我来请求你原谅我加在你身上的不公，也会竭尽全力弥补。我已经开始惩治这桩可恨罪行的主谋。

            等我把我们的孩子带到你面前，希望你能够宽恕我。他们是世上最可爱、才德最出众的孩子。跟我回去吧，重新接受本来属于你的地位和全部尊荣。
          emotion: sad
        - id: ch05-b40
          speaker: narrator
          text: 苏丹说话时，无数百姓围在四周。人们先看见君王亲自走到木笼前，又看见他含泪拥抱受苦多年的苏丹后，立刻明白一桩天大的冤屈已经昭雪。消息刚刚传出，人们便从都城各处赶来，彼此口耳相传，转眼之间，所有人都知道发生了什么。
        - id: ch05-b41
          speaker: narrator
          text: |-
            第二天一早，苏丹与苏丹后穿上王室礼服，在整个宫廷的簇拥下动身前往乡间庄园。到了那里，苏丹把三个孩子逐一引到母亲面前，让这个分离多年的家庭终于相认。

            很长时间里，没有人顾得上别的，只有一次又一次的拥抱、止不住的眼泪和温柔的话语。随后，众人享用了特意准备的盛大宴席。等情绪渐渐平复，大家又走进花园，苏丹亲自把金水和歌唱树指给妻子看。至于会说话的鸟，苏丹后已经同它相识了。
        - id: ch05-b42
          speaker: narrator
          text: |-
            傍晚，一家人一同骑马返回都城。两位王子分列父亲左右，佩里扎德陪在母亲身边。离城门还很远，道路两旁已经站满前来迎接的百姓，欢迎他们的欢呼声一阵接一阵，回荡在空中。

            欢呼中还混着会说话的鸟和追随它的群鸟的歌声。那些飞鸟一路跟着归来的队伍，把花园里的奇妙歌唱带进都城。会说话的鸟仍坐在笼中，笼子就安放在佩里扎德膝上。
        - id: ch05-b43
          speaker: narrator
          text: 他们就这样在百姓长久的欢呼与群鸟的歌声中，一起回到了父亲的宫殿。这个失散多年的家庭，终于真正重新团聚。
