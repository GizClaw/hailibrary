  chapters:
    - id: ch01
      title: 王子拒婚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            从波斯海岸坐船走上二十来天，就到了哈勒丹子民之岛。岛上分成许多行省，每一省都有繁华的大城，整个王国富足又强盛。统治这里的沙赫扎曼国王，一向觉得自己是世上最太平、最幸运的君主。只是有一件事总压在他心上。他有四位王后，却一直没有继承人。

            一天，国王把烦恼告诉了大维齐尔。维齐尔说，这件事不是人力能够办到的，唯有安拉能成全陛下的心愿。
        - id: ch01-b02
          speaker: grand_vizier
          text: 陛下，不妨给那些终生祈祷的圣者送去厚礼，请他们替您祈求。谁知道呢，也许他们的祷告真会得到回应。
        - id: ch01-b03
          speaker: narrator
          text: |-
            国王照办了。无数人替他祈祷，到了第二年，他果然有了一个儿子。沙赫扎曼向清真寺和修道院送去贵重的还愿礼，又举行了盛大的庆典。孩子俊美无比，取名卡马拉尔扎曼，意思是“世纪之月”。

            最出色的师傅和全国最聪明的教师一同教养王子。等他长大，世间再找不出比他更俊秀、更有才华的青年。父王深爱他，王子还年轻时，国王就想把王位传给他。大维齐尔并不赞同。

            国王并不是一时兴起。他看见儿子一天比一天出众，早就盼着亲手把国家交给他。可维齐尔知道，聪明和俊美还不足以治理一个王国。年轻人若从未承担过责任，也没有经历过朝政，再珍贵的王冠戴在头上，也未必能够安稳。
        - id: ch01-b04
          speaker: grand_vizier
          text: |-
            陛下，王子还太年轻，暂时担不起治国的重任。您怕他日渐懒散，这份担忧很有道理。不如先让他成婚。有了家庭，他的心会安定些。您再让他参与议政，慢慢学会怎样戴稳王冠。等他真正有了本领，再传位也不迟。
        - id: ch01-b05
          speaker: narrator
          text: 国王听从了劝告，把儿子召来。王子立刻赶到，恭敬地垂眼站在父王面前，问有什么吩咐。
        - id: ch01-b06
          speaker: schahzaman
          text: 我叫你来，是想告诉你，我希望你成婚。你愿意吗？
        - id: ch01-b07
          speaker: narrator
          text: 王子完全没料到这件事，惊得半晌说不出话。
        - id: ch01-b08
          speaker: camaralzaman
          text: 父王，如果我的回答让您失望，请您宽恕。我还这么年轻，一想到成婚就十分厌恶。也许我以后会改变，可要我现在照您的心愿去做，恐怕还要等很久。
        - id: ch01-b09
          speaker: narrator
          text: 国王十分伤心，却不愿强迫儿子。
        - id: ch01-b10
          speaker: schahzaman
          text: 我可以给你时间细想。不过你要记住，这件事早晚非办不可。像你这样的王子，终有一天要统治一个大国。
        - id: ch01-b11
          speaker: narrator
          text: |-
            从那以后，王子获准参加御前会议，父王也处处宠爱他。一年过去，国王私下问他，是否已经改变了心意。王子不再吃惊，态度却一点也没软下来。他求父王别再提婚事，说催多少次都没用。

            国王又去找大维齐尔，说自己听了劝，可儿子反而更加固执。
        - id: ch01-b12
          speaker: grand_vizier
          text: 陛下，耐心常能办成大事，强迫王子却可能让您后悔。再等一年吧。到时候，请您当着满朝大臣告诉他，国家安危需要他成婚。有群臣在场，又有我们亲自相劝，他总不能再次拒绝。
        - id: ch01-b13
          speaker: narrator
          text: 国王虽然盼着儿子立刻完婚，还是答应再等一年。他又去见王子的母亲法蒂玛，把失望都说给她听。
        - id: ch01-b14
          speaker: schahzaman
          text: 卡马拉尔扎曼对你说的心里话更多。请你好好同他谈谈。他若一直这样固执，迟早会惹我震怒。为了贯彻自己的意志，我不得不采取手段，到时他一定会后悔。
        - id: ch01-b15
          speaker: narrator
          text: 法蒂玛再见到儿子时，便说自己听说了拒婚的事。她很难过，也问王子为什么不肯服从父王。
        - id: ch01-b16
          speaker: camaralzaman
          text: |-
            母后，我知道世上有邪恶刻薄、难以相处的女子，也有善良温柔、可亲可敬的女子。我真希望她们都像您一样。可我不能忍受的是，我对一个女子毫不了解，却要先娶她为妻。

            父王会向邻国君主的女儿求婚，对方也会答应。不管她美或丑，聪明或愚钝，善良或恶毒，我都没有选择。谁能保证她不傲慢暴躁，不轻蔑待人，也不挥霍无度？我又怎会知道，我们的性情合不合得来？
        - id: ch01-b17
          speaker: fatima
          text: 可是，我的儿，难道你愿意让这个统治国家多年、又如此荣耀的家族，到你这里便断了后嗣吗？
        - id: ch01-b18
          speaker: camaralzaman
          text: 母后，我并不想比父王活得长久。不过真有那么一天，我会尽全力做个不辱先祖的君王。
        - id: ch01-b19
          speaker: narrator
          text: |-
            这样的谈话还有许多次。苏丹终于明白，怎样讲道理都没用。又一年过去，王子的想法依旧不变。

            一天，苏丹把王子召到御前会议，当着所有大臣告诉他，这门婚事不只关乎父王的心愿，也关系国家利益，要他就在群臣面前回答。王子顿时勃然大怒，说出了极为激烈的话。国王遭儿子当众顶撞，也发了怒，下令将他逮捕，关进一座古塔。塔里只有几件家具、几本书和一个服侍他的奴仆。

            王子终于可以安静读书，竟很满意这份刑罚。入夜后，他沐浴净身，做完祷告，又读了几页《古兰经》，没有熄灭床边的灯，便躺下睡着了。

            从国王第一次提起婚事，到这次当众逼问，整整两年的等待都没能改变王子的心。父子一个认定继承人必须成婚，一个认定自己不能娶完全陌生的人。到了御前会议上，这场争执终于再也收不住了。可对王子来说，古塔并不像惩罚。他有书可读，也没人再来催婚，反倒正合心意。
    - id: ch02
      title: 月夜里的赌约
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            古塔里有一口深井。精灵王达姆里亚特统领着一支镇尼军团，他的女儿迈穆娜最爱在这口井里歇息。快到午夜时，她轻盈地从井中飘出，本想像往常一样去尘世游荡。

            王子房里的灯光让她吃了一惊。她没惊动横睡在门槛上的奴仆，悄悄进了房间。王子半张脸藏在被下，迈穆娜掀起被角，竟看见了她一生中见过的最俊美的青年。
        - id: ch02-b02
          speaker: maimoune
          text: 他闭着眼睛已经这样好看，要是睁开眼，又会有多么惊人！他到底犯了什么错，竟受这样的对待？
        - id: ch02-b03
          speaker: narrator
          text: 迈穆娜久久看不够。她轻轻吻了王子的额头和双颊，替他盖好被子，才飞回空中。到了天地之间，她听见巨翼迎面拍来。不久，一个叫丹哈什的恶镇尼出现了。他知道迈穆娜的善良能压倒自己的邪恶，吓得魂不附体。两人已经离得太近，他只好低声求和。
        - id: ch02-b04
          speaker: danhasch
          text: 善良的迈穆娜，请你以安拉的名义答应不伤害我。我也保证，绝不会伤你。
          emotion: fearful
        - id: ch02-b05
          speaker: maimoune
          text: 该受诅咒的镇尼，你真以为自己伤得了我？不过，我就当你有这份本领，也答应你的请求。说吧，你今夜看见了什么，又做过什么？
        - id: ch02-b06
          speaker: danhasch
          text: |-
            美丽的仙女，你来得正好。我从遥远的中国尽头赶来，那里是世上最大也最强盛的王国之一。国王只有一个女儿，她的美貌无人能够形容。你把最完美的五官、最明艳的肤色和最动人的神情都想在一起，也远不及她本人。

            国王把这件珍宝藏得很严，不许她在未来夫婿以外的人面前出现。为了不让她的生活乏味，他造了七座举世无双的宫殿。第一座是水晶，第二座是青铜，第三座是精钢，第四座用了更贵重的铜，第五座是试金石，第六座是白银，第七座是纯金。宫殿里陈设奢华，花园也美得出奇。

            公主的美名传遍远近，许多强国都派人求婚。国王每次盛情接待，却不肯违背女儿的心愿。公主把求婚者一一拒绝，使臣们虽然满意国王的款待，仍都失望而归。

            中国国王为了女儿，确实用尽了心力和钱财。他让她住在世上罕见的宫殿里，把凡俗的目光都挡在外面，也始终告诉前来求婚的人，自己不会逼迫女儿。可公主越是闻名，求婚的君主就越多。一次又一次，使臣带着希望而来，又带着同样的答复离去。
        - id: ch02-b07
          speaker: badoura
          text: 父王，我知道您希望我成婚，也知道您一心想让我称心，我十分感激。可是，我不想改变现在的生活。我住在这样美丽舒适的地方，嫁给谁能比现在更快活呢？求您别再逼我了。
        - id: ch02-b08
          speaker: narrator
          text: 丹哈什接着说，后来有一位富强的国王派来使团。中国国王十分看重这场联姻，一再向女儿说明它有多重要，逼她答应。公主终于压不住怒火，忘了对父亲应有的敬重。
        - id: ch02-b09
          speaker: badoura
          text: 父王，不要再提这门婚事，也别再提任何婚事！您若继续逼我，我就把匕首刺进胸膛，从此摆脱这一切！
          emotion: angry
        - id: ch02-b10
          speaker: china_king
          text: 你已经失去了理智，那就只能按对待疯子的办法处置。
          emotion: angry
        - id: ch02-b11
          speaker: danhasch
          text: |-
            国王把公主锁在一座宫殿的几间屋子里，只留下十名老妇，由乳母管着她们。他又写信给从前求婚的国王，说公主已经疯了，请他们别再惦记。派往各地的使臣则公开宣布，谁能治好公主，谁就能娶她。

            我每天都去看那位举世无双的美人。你跟我去一趟，一定会承认，从未见过这样的容貌。
        - id: ch02-b12
          speaker: narrator
          text: 迈穆娜听完放声大笑，好容易才停下来。
        - id: ch02-b13
          speaker: maimoune
          text: 得了吧，你是在逗我吗？我还当你真有趣事可讲，原来只是对陌生姑娘的一番痴话。你要是看见我刚才见到的王子，只怕马上就会神魂颠倒。他的美貌才真正超凡绝世。
          emotion: happy
        - id: ch02-b14
          speaker: danhasch
          text: 迷人的迈穆娜，那位王子是谁？他是什么身份？
        - id: ch02-b15
          speaker: maimoune
          text: 你只要知道，他的遭遇和你的公主很像。父王逼他成婚，他不肯，就被关进古塔。我刚从那里出来。
        - id: ch02-b16
          speaker: danhasch
          text: 我不愿顶撞一位仙女，可我还是不信，凡间会有人比我的公主更美。
        - id: ch02-b17
          speaker: maimoune
          text: 闭嘴！这绝不可能。
          emotion: angry
        - id: ch02-b18
          speaker: danhasch
          text: 那就别争了。让我带你去亲眼看看公主，自然能辨真假。
        - id: ch02-b19
          speaker: maimoune
          text: 不必跑那么远。把你的公主带到这里，放在我的王子身边，我们从容比较。
        - id: ch02-b20
          speaker: narrator
          text: |-
            丹哈什欣然答应。两人定下赌约，他便飞往中国。短得令人不敢相信的一会儿之后，他已经带着沉睡的巴杜拉回来。迈穆娜把她安放在王子身边，两位精灵立即争得不可开交。

            巴杜拉是在魔法中越过遥远路程的，始终没有醒来。丹哈什把她从中国送到哈勒丹的古塔，迈穆娜又亲手将她放上卧榻。两个年轻人就这样第一次并肩躺在一起。一个因为拒婚被父王囚禁，另一个也因为拒婚被父王看作疯子。他们彼此毫不相识，却有着如此相似的遭遇。两个精灵把他们放在一起，本来只为争论谁更美，却不知道这一夜会改变两个人的一生。
        - id: ch02-b21
          speaker: danhasch
          text: 现在看清了吧？我的公主比你的王子更美，你还怀疑吗？
        - id: ch02-b22
          speaker: maimoune
          text: 我当然怀疑！你的公主确实很美，可你只要认真看看，就得承认王子远胜过她。除非你瞎了眼。
        - id: ch02-b23
          speaker: danhasch
          text: 第一眼已经够了，我不会改口。不过你若非要赢，我让你赢就是。
        - id: ch02-b24
          speaker: maimoune
          text: 我才不要欠你这个该受诅咒的镇尼人情。我们请一位裁判，你也必须服从他的裁决。
        - id: ch02-b25
          speaker: narrator
          text: 丹哈什答应后，迈穆娜一脚踏向地面。大地裂开，一个驼背跛足、斜着双眼、头生六角、两手如利爪的丑镇尼钻了出来。他一见迈穆娜，便伏倒在她脚下。
        - id: ch02-b26
          speaker: maimoune
          text: 起来吧，卡什卡什。请你替我和丹哈什裁断。看看床上的青年和少女，不偏不倚地说，究竟谁更美。
        - id: ch02-b27
          speaker: narrator
          text: 卡什卡什看了很久，脸上满是赞叹，却始终分不出高下。
        - id: ch02-b28
          speaker: caschcasch
          text: 仙女，硬说其中一人更美，就是欺骗你。我只想到一个办法。依次唤醒他们，看谁见到对方时流露出的爱慕更深。
        - id: ch02-b29
          speaker: narrator
          text: |-
            迈穆娜和丹哈什都赞成。迈穆娜变成小飞虫，落在王子咽喉上狠狠叮了一口。卡马拉尔扎曼惊醒，第一眼就看见了身边的公主。他撑起身子仔细端详，那个从未动情的心，顿时涌出了陌生的爱意和压不住的欢喜。

            他亲吻公主的额头、眼睛和嘴唇。若不是镇尼的魔法让她沉睡，这些吻早已把她唤醒。

            王子从前坚决反对婚事，并不是因为见过巴杜拉以后仍旧无动于衷。恰恰相反，他只看了片刻，便觉得眼前的人比自己想象过的一切都更动人。他不知道她的姓名和来处，也无法叫醒她，只能把所有惊喜都说给这个沉睡的人听。
        - id: ch02-b30
          speaker: camaralzaman
          text: 多么美丽，多么迷人！啊，我的心，我的灵魂！美丽的姑娘，卡马拉尔扎曼这样爱你，你还不醒来吗？不管你是谁，他都配得上你。
          emotion: happy
        - id: ch02-b31
          speaker: narrator
          text: 王子猜想，这也许就是父王挑中的新娘，是父王故意把她送来，想看看自己能不能抵挡她的魅力。他决定留下纪念，便取下公主的戒指，换上自己的戒指，随后躺回去，很快又睡熟了。
        - id: ch02-b32
          speaker: narrator
          text: |-
            丹哈什也变成飞虫，在公主唇上叮了一口。巴杜拉猛然醒来，看见身旁的青年，先是震惊，很快又被他的俊美打动，满心欢喜。

            她从前拒绝所有求婚，也不是因为永远不会爱上任何人。她只是从没见过一个真正使自己心动的人。如今，这个青年忽然出现在身边，她立刻以为父王终于选中了自己愿意嫁的人，又后悔先前为了拒婚那样激烈地顶撞父亲。
        - id: ch02-b33
          speaker: badoura
          text: 原来父王要我嫁的就是你吗？我竟然没早些知道！要是知道，我也不会把父王气成那样。醒醒，快醒醒！我一定会全心全意地爱你。
          emotion: happy
        - id: ch02-b34
          speaker: narrator
          text: 她用力摇晃王子，可迈穆娜的魔法护着他，他始终不醒。公主拉起他的手，看见自己的戒指戴在他指上，更加惊奇。她吻了王子的脸颊，不久也睡着了。
        - id: ch02-b35
          speaker: maimoune
          text: 怎么样？现在你该承认，我的王子胜过你的公主了吧？下次我说话，你可要记得相信。卡什卡什，多谢你了。你和丹哈什现在把公主送回家去。
        - id: ch02-b36
          speaker: narrator
          text: 两个镇尼赶紧照办，迈穆娜也回到了井里。
    - id: ch03
      title: 两地相思
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            第二天早晨，王子醒来便四下寻找昨夜的姑娘，又盘问守门的奴仆。奴仆一口咬定，根本没见过什么姑娘，也不知道她怎么可能进入古塔。王子忍无可忍，狠狠打了他一顿，又把他捆起来沉进井里。直到奴仆大叫愿意全说，他才把人湿淋淋地拉上来。

            奴仆请求先换衣服。王子刚点头，他便一路跑进王宫。那时国王正和大维齐尔谈论儿子带来的忧虑。
        - id: ch03-b02
          speaker: narrator
          text: 奴仆一进门就说，王子已经彻底失去理智，硬说昨夜有个姑娘睡在床上。看他这一身狼狈，就知道王子听人反驳时会怎样发狂。接着，他把经过全说了。
        - id: ch03-b03
          speaker: narrator
          text: 国王心乱如麻，请维齐尔去查明真相。维齐尔来到古塔，见王子安静地读着书，便说那奴仆带来的消息惊扰了陛下，自己很生气。
        - id: ch03-b04
          speaker: camaralzaman
          text: 他带去了什么消息？
        - id: ch03-b05
          speaker: grand_vizier
          text: 大概只是些荒唐话。看殿下现在这样，我已经放心了。
        - id: ch03-b06
          speaker: camaralzaman
          text: 那多半是荒唐话。不过你既然来了，就告诉我，昨夜睡在这里的姑娘去了哪里？
        - id: ch03-b07
          speaker: narrator
          text: 维齐尔顿时不知如何回答。
        - id: ch03-b08
          speaker: grand_vizier
          text: 殿下，奴仆整夜横在门槛上。连男子进来都得从他身上跨过去，更别说一个女子了。请您仔细想想，那只是一场过分逼真的梦。
        - id: ch03-b09
          speaker: narrator
          text: 王子怒气冲冲，非要问出姑娘是谁、身在何处。维齐尔怎样发誓，说绝不是自己的安排，王子都不信。最后，他揪住维齐尔的胡须打了起来。
        - id: ch03-b10
          speaker: grand_vizier
          text: 殿下，住手！请先听臣说完！
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: 王子的胳膊打累了，才停下手。
        - id: ch03-b12
          speaker: grand_vizier
          text: 殿下，臣承认，您说的事并非毫无根据。可大臣只能服从君主。请让我回去，把您的话禀报陛下。
        - id: ch03-b13
          speaker: camaralzaman
          text: 很好。告诉父王，我愿意娶昨夜由他送来、或由他带来的姑娘。快去快回，把答复带给我。
        - id: ch03-b14
          speaker: narrator
          text: |-
            维齐尔行了礼，匆匆离开古塔。国王见他回来，马上追问儿子的情形。维齐尔叹息着说，奴仆讲的全是真的，又把王子如何暴怒、如何殴打自己一一禀报。

            国王悲痛万分，决定亲自查问。王子极为恭敬地迎接父王，对所有问题都答得清醒得体。最后，国王问起昨夜的姑娘。

            这正是最叫人困惑的地方。王子谈起别的事时，神智清楚，礼节周全，一点也不像失去理智。可话题一回到昨夜，他便坚信姑娘真实来过，还认定父王和维齐尔知道真相。奴仆说不知情，便被沉进井里。维齐尔说那是梦，也挨了一顿打。国王只能亲自来听儿子把话说完。他既怕儿子真的病了，又不愿在没有弄清真相以前责怪他。
        - id: ch03-b15
          speaker: camaralzaman
          text: |-
            父王，请别再拿这件事增添我的痛苦。求您把她嫁给我，让我得到幸福吧。从前我再厌恶婚事，一见她，所有成见便都消失了。若能由您亲手把她交给我，我会感激不尽。
        - id: ch03-b16
          speaker: narrator
          text: 国王几乎惊得说不出话。他郑重保证，自己对姑娘一无所知，也没有暗中安排她出现。王子便把始末详详细细讲了一遍，又拿出那枚戒指，请父王帮他寻找新娘。
        - id: ch03-b17
          speaker: schahzaman
          text: 听完这些，我不能再怀疑你。可她从哪里来，怎样进来，又为何只停留那么短，我一点也猜不出。这件事实在神秘。来吧，我亲爱的儿，我们一起等好日子到来。
        - id: ch03-b18
          speaker: narrator
          text: |-
            国王牵着儿子的手回到王宫。王子从此卧床不起，陷入绝望。国王也把自己关在儿子身边，连国事都不再过问。只有首相获准入内。最后，维齐尔不得不告诉国王，朝臣和百姓都在抱怨，国家已经深受其害。

            他建议父子搬到邻近的小岛。那里景色宜人、空气清新，王子或许能恢复精神，国王前往公开朝会也很方便。国王同意了。城堡收拾好后，父子便搬进去。除了每周两次朝会，沙赫扎曼再不离开儿子半步。

            王子的病不是医药能够解释的。他知道昨夜并非梦境，手里的戒指就是证据，却连姑娘来自哪里都不知道。国王也终于相信儿子没有发疯，可他既不能解释神秘的来去，也无法替儿子找到人，只能陪着他一起等待。父子搬到岛上以后，国王把两次朝会以外的每一刻都留给了儿子。

            与此同时，巴杜拉公主已经被送回自己的宫殿。第二天，她醒来发现身边无人，立刻叫来侍女。
        - id: ch03-b19
          speaker: badoura
          text: 我深爱的那个青年在哪里？昨夜他就睡在我身旁。
        - id: ch03-b20
          speaker: nurse
          text: 公主，您得再说清楚一些，我们实在听不懂。
        - id: ch03-b21
          speaker: badoura
          text: 昨夜有个世上最俊美、最迷人的青年睡在这里。我用尽办法也没能叫醒他。
        - id: ch03-b22
          speaker: nurse
          text: 殿下是在逗我们吧。您要起身了吗？
        - id: ch03-b23
          speaker: badoura
          text: 我说的全是真的。我只要知道他去了哪里。
        - id: ch03-b24
          speaker: nurse
          text: 可我们昨夜离开时，房里只有您一个人，后来也没人进去呀。
        - id: ch03-b25
          speaker: narrator
          text: 公主失去耐性，揪住乳母的头发，狠狠打她耳光，逼她交代，否则就要杀了她。乳母好容易挣脱，含泪去见王后，把事情从头讲了一遍，说公主一定已经神志不清。
        - id: ch03-b26
          speaker: narrator
          text: 王后急忙赶来，先把女儿搂在怀里，再问她为什么这样粗暴地对待乳母。
        - id: ch03-b27
          speaker: badoura
          text: 母后，您也想取笑我吗？除了昨夜那位迷人的青年，我谁也不嫁。您一定知道他在哪里，请把他叫来。若不准我嫁给自己选中的人，我就自尽。
          emotion: angry
        - id: ch03-b28
          speaker: narrator
          text: |-
            王后十分惊讶，怎样安抚都没用。国王也亲自来查问，公主仍坚持原先的说法，还拿出手上的戒指作证。国王无法明白这一切，只认定女儿疯得更厉害了。他命人严密看守，只留乳母服侍，又派强壮的守卫把住门口。

            随后，他召集群臣，宣布谁能治好公主，谁就能娶她，并成为王位继承人。一位年长的埃米尔想到年轻貌美的妻子和整个王国，立刻自告奋勇，说愿用法术试一试。

            巴杜拉的处境同王子几乎一模一样。她醒来以后也确信昨夜不是梦，也有一枚并不属于自己的戒指作为凭证。可身边每个人都说，房门一直守着，不可能有人进来。她越坚持，父王越认定她的疯病加重。国王许下的奖赏极大，失败的代价也同样可怕。
        - id: ch03-b29
          speaker: china_king
          text: 你可以试。不过若是失败，就得丢掉性命。
        - id: ch03-b30
          speaker: narrator
          text: 埃米尔接受条件。国王带他去见公主，公主立刻用面纱遮住脸。
        - id: ch03-b31
          speaker: badoura
          text: 父王，您怎么把陌生男子带到我面前来了？
        - id: ch03-b32
          speaker: china_king
          text: 不必惊慌。这是我的一位埃米尔，他来向你求婚。
        - id: ch03-b33
          speaker: badoura
          text: 他不是您先前许给我的人，也不是同我交换戒指的人。请恕我不能接受别人。
        - id: ch03-b34
          speaker: narrator
          text: 埃米尔原以为会听见胡言乱语，没想到公主神色平静，话也合情合理。他不敢医治，只能任国王处置。国王正在盛怒中，立即命人砍下他的头。后来还有许多人来求娶公主，却都因为治不好她而丧命。那位埃米尔只是第一个。
    - id: ch04
      title: 马尔扎万寻人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            过了一阵，乳母的儿子马尔扎万结束游历回到家中。他走过许多国家，学会了不少本领，其中包括占星术。母亲很快就告诉他乳姊妹巴杜拉公主的悲惨处境。马尔扎万请母亲想办法瞒过国王，让他去见公主。母亲答应下来，还说服守门宦官放他进入内宫。

            公主见乳兄回来，欢喜不已，把自己的遭遇和被囚的缘由全告诉了他。马尔扎万垂眼细听，等她说完才开口。
        - id: ch04-b02
          speaker: marzavan
          text: 公主，如果一切确如您所说，我相信一定能替您找到慰藉。请再耐心等一阵。我马上去别国寻访。等您听说我回来，就可以相信，您日夜思念的人已经不远了。
        - id: ch04-b03
          speaker: narrator
          text: |-
            马尔扎万第二天便启程。他走过一座又一座城、一个又一个岛和行省。所到之处，人们都在谈论巴杜拉公主的奇事。四个月后，他抵达人口众多的海港大城托尔夫。这里没人再提巴杜拉，众人口中说的全是卡马拉尔扎曼王子。据说他身患重病，遭遇与中国公主十分相似。

            这个变化立刻引起了马尔扎万的注意。此前无论走到哪里，大家说的总是中国那位拒婚、后来又思念陌生青年的公主。如今，人们讲的却是另一个同样拒婚、又同样为了夜里见过的人病倒的王子。两件怪事彼此呼应，他知道自己的漫长寻访终于有了方向。

            马尔扎万欣喜万分，立刻坐船前往王子的住处。航程一直顺利，可船快进港时忽然撞上礁石，就在王子、国王与大维齐尔居住的宫殿前沉没了。马尔扎万水性很好，跳进海里，在宫殿附近上了岸。那里的人给他干衣服，又把他领去见大维齐尔。

            维齐尔欣赏这个青年不凡的气度和聪敏的谈吐，也看出他见多识广，便叹息说，但愿他懂得什么秘术，能治好一种令整个宫廷悲愁已久的疾病。马尔扎万说，只要知道是什么病，自己也许有办法。维齐尔便把王子的故事全讲给他听。

            马尔扎万暗自欢喜，确信自己找到了巴杜拉思念的人，却没有表露，只请求见王子。他一进内室，就看见卡马拉尔扎曼闭着眼，直挺挺躺在床上，国王守在一旁。他竟顾不上行礼，脱口惊呼。
        - id: ch04-b04
          speaker: marzavan
          text: 天哪，竟然如此相像！
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: 王子的容貌确实和巴杜拉很相似。他听见这句话，好奇地勉强睁眼。马尔扎万立刻向他致意，又用隐晦的话说起中国公主。苏丹和维齐尔听不明白，王子却马上知道，这个来客能带来自己苦等的消息。
        - id: ch04-b06
          speaker: narrator
          text: 王子求父王让两人单独谈话。国王见儿子终于对人和事有了兴趣，立即答应。旁人离开后，马尔扎万讲了巴杜拉的故事和她所受的痛苦。
        - id: ch04-b07
          speaker: marzavan
          text: 我深信，只有您能治好她。但那段路很长，您得先恢复体力。请尽力调养，越快康复越好。
        - id: ch04-b08
          speaker: narrator
          text: 这番话像奇药一样。希望使王子精神大振，他当即说自己已经能起床穿衣。国王看见儿子的转变，欣喜若狂，下令举国庆祝王子康复。
        - id: ch04-b09
          speaker: narrator
          text: 王子很快强健如初，便把马尔扎万叫到一旁。
        - id: ch04-b10
          speaker: camaralzaman
          text: |-
            现在该兑现你的诺言了。我急着再见公主，再不动身，只怕又要病倒。唯一的阻碍是父王太爱护我。你已经看见了，只要我离开他的视线，他就无法忍受。
        - id: ch04-b11
          speaker: marzavan
          text: 我早已想过。自从我来到这里，您还没出过门。请国王准许您和我打猎两三天，再让人为我们各备两匹好马。其余的事交给我。
        - id: ch04-b12
          speaker: narrator
          text: |-
            第二天，王子提出请求。国王欣然同意，只担心他病体初愈，规定他们只能在外过一夜。次日一早，王子和马尔扎万出发，两名马夫跟在后面，牵着备用坐骑。他们沿途稍稍打猎，却有意避开城镇。夜里，两人在客店吃饭睡下。到了午夜，马尔扎万悄悄唤醒王子，请他脱下外衣，换上随身带来的另一件。两人骑上备用的马，又牵走一名马夫的坐骑。

            天亮时，他们来到森林深处四条路交会的地方。马尔扎万让王子等着，自己把那匹马牵进树林，割断它的喉咙，再把王子的外衣浸进血里，丢在岔路口。王子问他为什么这样做。
        - id: ch04-b13
          speaker: marzavan
          text: 我们要继续赶路，只能先引开追赶的人，让大家以为您已经死了。您父王一定会悲痛万分，可等您回来，他的喜悦也会更深。
        - id: ch04-b14
          speaker: narrator
          text: |-
            两人继续前行，一程走陆路，一程渡海。他们的钱足够支付沿途开销，没有无谓耽搁，终于抵达中国都城。他们找好住处，休息三天，恢复旅途消耗的精力。

            马尔扎万替王子备好占星师的衣袍。两人沐浴以后，王子换上袍服，被领到能望见王宫的地方。马尔扎万去找自己的母亲商议，王子则照他的指点走近宫门，高声宣告。

            这一路上，他们不能让人知道王子的真实身份，也不能让沙赫扎曼派来的追兵追上。到了中国都城，真正困难的事才刚开始。先前那些想医治公主的人都付出了性命。卡马拉尔扎曼却没有丝毫迟疑，因为他已经知道，宫墙里面等着的正是自己寻找的人。
        - id: ch04-b15
          speaker: camaralzaman
          text: 我是一名占星师，来为中国国王之女巴杜拉公主治病。我接受陛下的条件。若治好公主，我便娶她。若治不好，我愿献出性命。
        - id: ch04-b16
          speaker: narrator
          text: 已经很久没人敢冒这个风险。人群迅速围上来，看他年轻俊美、举止高贵，都替他惋惜。
        - id: ch04-b17
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: 先生，你到底在想什么？何苦白白送死！城墙上的头颅还不能警告你吗？趁现在来得及，快离开吧！
          emotion: fearful
        - id: ch04-b18
          speaker: narrator
          text: 王子毫不动摇，用更坚定的声音再次宣告。人群惊恐极了。
        - id: ch04-b19
          speakers: [townsman_1, townsman_2, townsman_3]
          ensemble: chorus
          text: 他是铁了心要死！愿上天怜悯他！
          emotion: fearful
        - id: ch04-b20
          speaker: narrator
          text: |-
            王子第三次宣告。最后，大维齐尔亲自出宫，把他领到国王面前。国王也被这位青年高贵的气度打动，想到他显然逃不过惨死，心中十分怜惜，劝他放弃。可王子态度谦恭，决心却丝毫不动。国王只得命看守公主房间的宦官领他进去。

            宦官走过一条条长廊，王子急着见日夜思念的人，紧紧跟在后面。两人终于来到公主寝殿的前厅。

            城里人看见的只是一个年轻得过分的占星师。他们不知道，王子手里有公主的戒指，也不知道他为何确信自己能成功。他们只看见城墙上那些失败者的头颅，便认定这个异乡青年也会送命。可那些警告没有使王子后退。他连续三次说出同样的条件，直到宫里终于听见他的声音。就连中国国王也不忍看这样一个高贵的青年白白丧命，给了他最后一次放弃的机会，可他仍旧坚持。
        - id: ch04-b21
          speaker: camaralzaman
          text: 现在请你选吧。是让我到公主面前医治，还是不见她，就站在这里把她治好？
        - id: ch04-b22
          speaker: narrator
          text: 宦官一路上几次轻蔑地怀疑他的本领，听见这话却大为惊奇。
        - id: ch04-b23
          speaker: eunuch
          text: 只要你真能治好公主，在哪里都一样，你的名声都会传开。
        - id: ch04-b24
          speaker: camaralzaman
          text: 很好。虽然我迫不及待想见她，还是留在这里医治，好让你更相信我的本领。
        - id: ch04-b25
          speaker: narrator
          text: |-
            王子取出纸笔写信。他告诉可敬可爱的公主，痴情的卡马拉尔扎曼永远不会忘记凝望她沉睡中的美貌、把心交给她的那一刻。当时无缘交谈，他只好留下自己的戒指，又取走她的戒指。如今，他把戒指附在信里归还。若公主愿意再把它送还给他，他便是世上最幸福的人。若她不肯，他也愿意为爱而死。他正在前厅等候答复。

            王子把戒指包在信中，不让宦官看见，然后交给他。

            这封信就是王子的医术。他不需要药物，也不需要走进寝殿。只要巴杜拉看见那枚戒指，就会知道夜里见到的人不是幻影，也会知道对方同样记得她、寻找她。宦官看不见信里的东西，自然不懂王子为何如此笃定。
        - id: ch04-b26
          speaker: camaralzaman
          text: 朋友，请把信送给你的女主人。她读过信、看过里面的东西后若没有立刻痊愈，你尽管骂我是厚颜无耻的骗子。
        - id: ch04-b27
          speaker: eunuch
          text: 公主，新来了一位占星师。他说，您只要读完信，看见里面的东西，病马上就会好。
        - id: ch04-b28
          speaker: narrator
          text: |-
            公主懒洋洋地接过信，可一看见自己的戒指，几乎连信也来不及读，便猛然起身冲到门前，推开帷幕。两人一眼认出了彼此，立刻紧紧拥抱，亲吻着对方，简直不敢相信分别这么久还能重逢。乳母赶来，把他们拉回内室。巴杜拉在那里把戒指交还王子。
        - id: ch04-b29
          speaker: badoura
          text: 拿回去吧。若不还给你，我就不能留下自己的戒指。而我已经决定，只要活着一天，就会一直戴着你的戒指。
          emotion: happy
        - id: ch04-b30
          speaker: narrator
          text: 宦官早已飞奔去见国王。
        - id: ch04-b31
          speaker: eunuch
          text: 陛下，从前的医生和占星师全是骗子！这个人甚至没见公主一面，就把她治好了！
          emotion: surprised
        - id: ch04-b32
          speaker: narrator
          text: 国王听完经过，欣喜若狂，赶去拥抱女儿，又把她的手放进王子手中。
        - id: ch04-b33
          speaker: china_king
          text: 幸运的异乡人，不管你是谁，我都会守信，把女儿嫁给你。不过若我没看错，你的身份一定比这身打扮高贵得多。
        - id: ch04-b34
          speaker: camaralzaman
          text: 陛下猜得不错。我并非占星师。为了配得上您的王室，我才这样伪装。我也是王子，名叫卡马拉尔扎曼，父亲是哈勒丹子民诸岛之王沙赫扎曼。
        - id: ch04-b35
          speaker: narrator
          text: 王子讲出自己的经历，也说起两人不可思议的初见和他怎样爱上巴杜拉。
        - id: ch04-b36
          speaker: china_king
          text: 这样非凡的故事不能失传。我要命人写进本国史册，再传到四方各地。
        - id: ch04-b37
          speaker: narrator
          text: 第二天，婚礼隆重举行，举国欢腾。马尔扎万也得到一个俸禄优厚的宫廷职位，国王答应以后继续提拔他。王子与公主朝夕相伴，幸福无比，几个月转眼便过去了。
    - id: ch05
      title: 护符带来的离别
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一天夜里，王子梦见父王命在旦夕，还说自己疼爱的儿子抛下了他，如今竟要害他死去。王子呻吟着惊醒，也吓醒了公主。
        - id: ch05-b02
          speaker: badoura
          text: 出了什么事？
        - id: ch05-b03
          speaker: camaralzaman
          text: 唉，也许就在这一刻，我父王已经不在人世了！
          emotion: fearful
        - id: ch05-b04
          speaker: narrator
          text: |-
            王子把梦境告诉妻子。巴杜拉当时没多说，第二天早晨却去见父王，吻过他的手，提出一件请求。她强调，这绝不是丈夫授意的，她只想请国王准许夫妻二人去探望公公沙赫扎曼。

            中国国王舍不得女儿，却觉得请求合情合理。他只提出一个条件，女儿在沙赫扎曼的宫廷只能住一年，以后小夫妻可以轮流探望双方父母。巴杜拉把好消息带给丈夫，王子感激她如此体贴，满怀柔情地道谢。

            众人加紧准备。启程后，国王陪他们走了数日，才依依不舍地向女儿告别，又叮嘱王子好好照顾她。

            中国国王只允许女儿在丈夫的父亲那里住一年，并不是不体谅王子的孝心，而是自己也难以忍受长久分别。他希望这对夫妻往后轮流探望两边的父母。这样，沙赫扎曼能够见到久别的儿子，中国国王也不至于永远失去女儿。两位年轻人带着随从启程时，谁都以为这只是一趟探亲之旅。王子将要回去安慰因他失踪而悲伤的父亲，公主也会在一年后回到自己的父王身边。

            一个月后，队伍来到辽阔的草原。成群的参天大树投下浓荫，天气又热，王子便命人在这片凉爽之地扎营。公主走进帐篷，解下腰带放在身边，让侍女退出，躺下睡着了。

            王子安排完营地，进帐看见妻子熟睡，便静静坐在旁边。他拿起那条镶着宝石的腰带，看见上面缝着一个扣紧的小袋。袋中有块红玉髓，上面刻着图案和奇异文字。

            夫妻这次离开中国，本是为了让王子探望忧思成疾的父亲。巴杜拉主动请求远行，又得到父王许可。他们原以为，只要走完漫长旅途，就能让两个家庭重新团聚。谁也没有想到，真正使他们分开的，会是腰带里一件看似不起眼的小东西。
        - id: ch05-b05
          speaker: camaralzaman
          text: 这块红玉髓一定非常珍贵，不然她不会这样贴身收藏。
        - id: ch05-b06
          speaker: narrator
          text: |-
            其实，那是一道护符。中国王后送给女儿时说过，只要带在身边，便能保她幸福。

            王子走到帐门边，把宝石托在掌心细看。一只鸟突然俯冲下来，叼起宝石飞走了。公主如此珍爱它，王子却把它弄丢，自然惊慌不已。他追上前，盼那鸟丢下宝石。可每当他靠近，小贼就再飞一段。忽然，鸟把宝石吞进肚里，飞得更远。王子想用石头打死它，却越追越远。

            鸟引着王子翻山越谷，走了一整天。夜里，它停在一棵极高的大树顶上。王子又饿又渴，又累又困，也找不到回营的路，只能睡在树下。

            第二天，他赶在鸟离巢前醒来，继续追赶，沿路采野菜和果子充饥。这样过了整整十天。第十一天，他们来到一座海边大城。鸟忽然直冲高空，彻底消失。王子只得绝望地放弃护符。

            每天清晨，鸟从最高的枝头飞走，王子就在地面紧追。每到夜里，它又高高栖息，王子只能睡在树下。他明知离营地越来越远，却无法舍弃公主珍藏的护符。直到第十一天，连鸟也消失在高空，他才发现自己已经来到一个完全陌生的地方，既找不回护符，也找不到回到妻子身边的路。

            他在陌生的街道上走了许久，最后沿海岸进入一扇敞开的花园门。一位善良的老花匠正在劳作。他看出陌生人也是穆斯林，连忙叫王子进来关门。
        - id: ch05-b07
          speaker: gardener
          text: 我看得出，你是异乡人，也是穆斯林。这城里几乎全是偶像崇拜者，他们憎恨、迫害我们的同教。你能找到这所房子，简直像有奇迹引路。这里很安全。
        - id: ch05-b08
          speaker: narrator
          text: 王子热诚道谢，老人却打断了他。
        - id: ch05-b09
          speaker: gardener
          text: 客套话先别说。你又累又饿，快进来吃东西，好好歇息。
        - id: ch05-b10
          speaker: narrator
          text: |-
            王子吃饱后，把自己的遭遇毫不隐瞒地讲了出来。他问回到父王都城最近的路，又想到与公主分别已有十一天，也许她已经不在人世，顿时放声痛哭。

            花匠告诉他，前往任何穆斯林国家，陆路都要走一年。若坐船去乌木岛，路会短得多，从那里也容易回哈勒丹。每年都有一艘船开往乌木岛。

            老花匠是这座城里少有的穆斯林，因此格外明白王子的危险。他先让陌生人关紧大门，再给他食物和住处，直到王子恢复体力才问缘由。听完故事后，他没有追问王子的财富，也没有怀疑他的身份，只认真替他寻找能回家的路。可一年一班的船刚刚离开，王子只能等待下一次机会。在这段漫长的日子里，他白天帮老人照料花园，夜里独自思念失散的妻子。
        - id: ch05-b11
          speaker: gardener
          text: 你若早到几天，就能马上登船。如今只好等到明年。你若愿意跟我住，这间简陋的小屋便诚心供你安身。
        - id: ch05-b12
          speaker: narrator
          text: |-
            王子庆幸找到了容身之处，欣然接受。他白天在花园劳作，夜里思念妻子，为她叹息。

            再说巴杜拉。她醒来不见王子，先问侍女。侍女们只看见王子进过帐篷，不知道他何时离开。公主拿起腰带，发现小袋已经打开，护符也不见了。她认定丈夫拿去看，很快便会送回来。

            她一直等到夜里，王子仍不见踪影。公主陷入绝望，咒骂护符和制作它的人。可她没有乱了方寸。除了她和侍女，营中没人知道王子失踪。她担心消息传开会有人叛乱，便严令侍女守密，随后换上丈夫的衣服。她与王子本就十分相像，这一装扮，活脱脱就是王子。

            第二天，她命令拔营，让侍女坐进自己的轿子，自己骑马领队，竟无人察觉。经过漫长的陆路和海路，她一直使用卡马拉尔扎曼的名字，终于抵达乌木岛国王阿尔马诺斯的都城。

            巴杜拉不敢留在原地等待。随行的队伍身在荒野，一旦知道真正的王子不见了，谁也无法保证不会出现混乱。她只能先保住丈夫的身份，让所有人相信领队的仍是卡马拉尔扎曼。那位坐在轿中的侍女则替她扮作公主。一路走过陆地、渡过海洋，这个秘密始终没有泄露。

            阿尔马诺斯听说老友兼盟友的儿子来到港口，亲自迎接这位假王子，把所有随从接入宫中，设下盛宴。三天后，客人谈起继续赶路，老国王提出挽留。
        - id: ch05-b13
          speaker: armanos
          text: |-
            王子，我已经年老，却没有儿子继承王国。上天只给我一个女儿，她美丽又迷人，唯有像你这样出身高贵、才德兼备的人配得上她。请别再回国了。娶我的女儿，接过王冠，留在这里。有贤能的继承人，我就能安心卸下治国的重担。
        - id: ch05-b14
          speaker: narrator
          text: |-
            巴杜拉万分为难。承认欺骗国王不可能，拒绝他一心促成的婚事也可能把善意变成仇恨与迫害。她权衡许久，红着脸答应。国王还以为她只是羞涩。
        - id: ch05-b15
          speaker: badoura
          text: 陛下这样看重我，又给我这份荣耀，我感激不尽。虽然自觉配不上，我也不敢推辞。只是请您答应，今后一直用您的智慧指点我，我才敢接受婚事。
        - id: ch05-b16
          speaker: narrator
          text: |-
            婚礼定在第二天。巴杜拉先把经过告诉自己的官员，保证公主已经完全同意，又命侍女严守秘密。阿尔马诺斯召集朝廷，把未来女婿引见给众人，让她登上王座，接受群臣效忠。

            对巴杜拉来说，这不是她想要的婚姻，也不是她想要的王冠。可她正借用丈夫的身份带领整支队伍，若突然拒绝老国王，便可能引起怀疑，甚至招来迫害。她只能把困境告诉自己的人，让他们相信这项安排经过了公主的同意，再独自面对从未见过的哈娅特内芙丝。

            夜里，全城欢庆，国王的女儿哈娅特内芙丝被送入宫殿。巴杜拉早已想好，唯一的办法就是坦白真相，请对方保密。两人独处后，她握住新娘的手。

            阿尔马诺斯没有儿子，因而不只要为女儿挑丈夫，也要替整个王国选继承人。他眼中的卡马拉尔扎曼出身高贵、举止得体，正是最合适的人选。他让未来女婿当众坐上王座，又让全体大臣宣誓效忠，实际上已经把国家托付出去。巴杜拉无法在这时揭穿自己的身份，只能先接受一切，再求真正的新娘帮助自己守住秘密。她知道，哈娅特内芙丝若不肯原谅，自己便再也无法维持这场假象。
        - id: ch05-b17
          speaker: badoura
          text: 公主，我必须告诉你一个秘密，只能求你怜悯。我不是卡马拉尔扎曼王子。我和你一样是位公主，也是他的妻子。请听完我的故事。等你知道我受过怎样的苦，一定会原谅这场欺骗。
        - id: ch05-b18
          speaker: narrator
          text: 巴杜拉讲完全部经历，哈娅特内芙丝热烈地拥抱她，保证完全同情她，也真心喜爱她。两位公主商定共同维持假象，让巴杜拉继续扮成男子，直到真正的卡马拉尔扎曼传来消息。
        - id: ch05-b19
          speaker: hayatelnefous
          text: 我会替你保守秘密，也愿意帮助你。我们一起等真正的王子回来。
          emotion: calm
    - id: ch06
      title: 花园里的财宝
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 乌木岛发生这些事时，王子还住在偶像崇拜者之城的花匠小屋。一天清早，花匠告诉他，全城正在过节，本地人自己不做工，也不许别人做工。
        - id: ch06-b02
          speaker: gardener
          text: 你今天好好休息。我去看看几个朋友，也顺便打听那艘船的消息，设法替你订个船位。它应该快到了。
        - id: ch06-b03
          speaker: narrator
          text: |-
            老人换上体面的衣服出门。王子走进花园，很快又沉入对爱妻和悲惨离别的回忆。忽然，树上两只大鸟的喧闹惊醒了他。它们用尖喙利爪凶猛厮杀，不久，一只坠地死去，胜者飞走。

            另外两只更大的鸟飞来，一只停在死鸟头边，另一只停在脚边。它们悲伤地摇头，又刨坑埋葬了死鸟。随后，它们飞走，很快抓着凶手回来，一只咬住翅膀，一只咬住腿。凶手尖叫挣扎，它们却把它拖到坟前杀死，撕开尸身，扯出内脏，才再次飞走。

            王子走近查看，在死鸟旁看见一件红色东西。他拾起来，竟是带来一切不幸的护符。王子惊喜得不停亲吻，把它包好，牢牢系在手臂上。自从夫妻分别，这是他第一次安然睡过一夜。

            那只偷走护符的鸟，正是刚刚被杀死的凶手。宝石从它腹中落了出来，又回到王子手里。王子这些日子一直不知道妻子身在何处，也不知道自己是否还能回家。如今护符失而复得，他终于觉得，厄运也许将要转向。

            第二天，花匠叫他砍掉一棵枯死的老果树。王子挥动斧头，忽然在树根下撞到硬物。他拨开泥土，看见一块巨大的青铜板。铜板下面有十级台阶，通往一座宽敞地窟。里面立着五十口带盖铜瓮，每一口都盛满金沙。王子把铜板盖回去，砍完树，等花匠归来。

            王子没有因为发现财宝就忘记自己的工作。他先把铜板放回原位，又照花匠的吩咐砍完枯树。老人回来以后，他也没有把金沙说成自己的好运，而是认定财富属于在园中辛苦八十年的主人。老人却同样不肯占有，坚持说宝藏直到王子挥斧这天才出现，显然是留给这位落难王子的。两个人谁也不肯把好处全留给自己，所以争论许久，才终于接受平分的办法。

            老人带回好消息，说船三天后启航，船位已经订好。
        - id: ch06-b04
          speaker: camaralzaman
          text: 再没有比这更好的消息了。作为回报，我也有喜事告诉您。请跟我来，看看落在您身上的好运。
        - id: ch06-b05
          speaker: narrator
          text: 王子带花匠看了地窟，说这是上天回报老人的善良，补偿他多年的清苦。
        - id: ch06-b06
          speaker: gardener
          text: |-
            你以为我会把财宝占为己有吗？它是你的，我无权拿走。我在这片土地上挖了八十年，从未发现任何东西。显然，这些财富特意留给了你。你马上要回国，比我这个年老无求的人更需要它。
        - id: ch06-b07
          speaker: narrator
          text: 王子怎么也不接受，两人争了很久，最后决定平分。老人又想出运走财宝的办法。
        - id: ch06-b08
          speaker: gardener
          text: 乌木岛不产橄榄，从这里运去能卖高价。你拿五十口瓮，每口装一半金沙，再用园里的橄榄填满。登船时，我们把瓮全送上船，就不会引人怀疑。
        - id: ch06-b09
          speaker: narrator
          text: |-
            王子用一天装好五十口瓮。他怕护符再从手臂滑落，便把它藏进一口瓮，在瓮上做了记号。入夜，两人各自休息。

            王子所得的金沙正好装满五十口瓮。每一口下面都是财宝，上面都用橄榄遮盖。这样，即使搬运的人打开瓮口，也只会看见岛上常见的果实。王子特意标记藏有护符的那一口，本想登船以后随时认出它。他准备带着财宝和重新找回的护符踏上归途，也盼着这一次不再有意外。可就在所有东西都收拾妥当的夜里，老人的病忽然重了。

            也许因为年纪太大，也许因为前一天劳累又激动，花匠一夜之间病得很重。第三天早晨，他已性命垂危。天刚亮，船长带水手来到花园，问旅客在哪里。
        - id: ch06-b10
          speaker: camaralzaman
          text: 就是我。替我订船位的花匠病了，不能见各位。请先搬走这些橄榄瓮和行囊。我向他辞行后马上赶来。
        - id: ch06-b11
          speaker: narrator
          text: 水手搬走行李。船长临走再三叮嘱，眼下风向正好，千万不要耽误。王子回到小屋，向老朋友告别，再次感谢所有恩情。老人已奄奄一息，勉强念完信仰告白，便咽下最后一口气。
        - id: ch06-b12
          speaker: narrator
          text: |-
            王子不能丢下恩人不管。他在园中挖墓，裹好遗体，将老人安葬，又锁上大门，把钥匙交还花园主人。等他赶到码头，那艘足足等了三个时辰的船已经开走。

            王子被迫在这个陌生而讨厌的国家再留一年。他又失去了公主的护符，害怕再也见不到它，绝望得难以形容。他只得租下花园，继续住在小屋，又雇了一个少年帮忙。为了保住剩余财宝，他把自己的金沙也装进另外五十口瓮，再用橄榄填满，随时准备离开。

            老花匠临终前没能等到王子回来，王子也不能为了赶船而抛下恩人的遗体。等他尽完最后的义务，船和五十口瓮已经一同离开。那些瓮里不只有他分到的金沙，还有巴杜拉的护符。于是他刚刚得到的两份希望，又在同一天离开了他。

            那艘船一路顺利，抵达乌木岛。巴杜拉以新王身份住在俯瞰港口的宫殿。她看见挂满旗帜的船驶进港湾，听说它来自偶像崇拜者之岛，每年都带来名贵货物，便带宫廷官员赶到港口，询问船长航程、旅客和货物。

            船长说，乘客全是商人，船上有各国布料、薄纱、宝石、麝香、龙涎香、香料、药材和橄榄。巴杜拉一向爱吃橄榄。
        - id: ch06-b13
          speaker: badoura
          text: 船上的橄榄我全要了。立刻卸下来，我们谈价钱。也请告诉其他商人，最好的货物先拿来给我看。
        - id: ch06-b14
          speaker: captain
          text: 陛下，船上有五十口大橄榄瓮，属于一个没赶上船的商人。我等了他很久，只好先开船。
        - id: ch06-b15
          speaker: badoura
          text: 没关系，都卸下来。价钱是多少？
        - id: ch06-b16
          speaker: captain
          text: 那商人很穷。您给他一千枚银币，已经十分慷慨。
        - id: ch06-b17
          speaker: badoura
          text: 既然他这样贫穷，我给一千枚金币。你一定要把钱转交给他。
        - id: ch06-b18
          speaker: narrator
          text: |-
            公主付了钱，命人把瓮送进王宫。夜里，她来到哈娅特内芙丝的居所，想与朋友尝尝橄榄。谁知刚倒进盘子，每颗橄榄上都沾着金沙。她们接连打开其他瓮，发现每一口都混有金沙，越看越惊奇。

            最后，两人从一口瓮里找到了护符。巴杜拉激动得昏厥过去。朋友和侍女急忙救醒她。公主恢复知觉后，捧着护符吻个不停，又遣退侍从。

            巴杜拉并不知道花园、财宝和错过船只的经过，可她认得这件贴身带过的宝物。护符在丈夫失踪时一同消失，如今竟从一个没有登船的贫穷青年所托运的瓮里出现。对她来说，这已经足够证明，那个青年就是她寻找已久的卡马拉尔扎曼。
        - id: ch06-b19
          speaker: badoura
          text: 亲爱的，你一定猜到了。我看见这道护符才会如此激动。当初正是它使我和丈夫失散。如今我相信，它也会让我们重逢。
          emotion: happy
        - id: ch06-b20
          speaker: narrator
          text: 第二天天刚亮，巴杜拉召来船长，问橄榄原主住在哪里，又为什么没上船。船长把知道的都说了。
        - id: ch06-b21
          speaker: badoura
          text: |-
            你必须立刻回去接他。他欠我的债，马上把他带到这里。否则，我会没收你的全部货物。现在，所有货仓都要封存。除非你把人带回来，任何一间都不许开。立即出发。
        - id: ch06-b22
          speaker: narrator
          text: |-
            船长别无选择，当晚便补足给养返航。抵达偶像崇拜者之岛后，他没有进港，而是在离岸稍远处抛锚。夜里，他带六名水手坐小艇上岸，来到王子的小屋。

            王子还未睡着，正想着夫妻离散的痛苦。敲门声忽然响起。他一开门，船长和水手便抓住他，不作解释，强行抬上小艇。众人一登大船，立刻起锚扬帆。王子一路沉默，认出船长后才问为何绑架自己。

            船长急着保住自己的货物，自然不敢耽搁。他不知道新王为何认定一个没赶上船的贫穷商人欠债，只知道若不把人带回去，整船货物都不能取出。为了防止王子拒绝，他趁夜上岸，叫六名强壮水手一起动手。王子就这样在完全不明白缘由的情况下，被那道护符第二次带向妻子。他还以为前方等着的是一位从未见过的债主，根本想不到巴杜拉就在乌木岛的王宫里。
        - id: ch06-b23
          speaker: captain
          text: 你不是欠了乌木岛国王一笔债吗？
        - id: ch06-b24
          speaker: camaralzaman
          text: 我？我连这位国王都没听说过，更从没踏上过他的国土！
          emotion: surprised
        - id: ch06-b25
          speaker: captain
          text: 那你比我更清楚。反正很快就能见到他。在此之前，安心待着，耐心等吧。
    - id: ch07
      title: 乌木岛重逢
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: |-
            返航同上次一样顺利。船进港时虽已入夜，船长仍立即带王子上岸，请求国王接见。巴杜拉一眼就认出衣衫破旧的丈夫。她恨不得扑过去搂住他，却为了两人着想，决定把戏再演一阵。她命官员好好照料王子，又命人揭去货仓封条，赏给船长一颗名贵钻石，还让他留下买橄榄所得的一千枚金币，说自己会亲自和商人结算。

            回到内室，她把经过和计划告诉哈娅特内芙丝，请她帮忙。朋友爽快答应。

            第二天，巴杜拉命人带王子沐浴，换上埃米尔或总督的华贵衣饰，再将他领进御前会议。王子俊美的容貌和高贵气度吸引了所有目光。巴杜拉见他恢复原有风采，满心欢喜。
        - id: ch07-b02
          speaker: badoura
          text: 诸位大人，我来介绍一位新同僚。他叫卡马拉尔扎曼，我在旅途中就认识他。我可以保证，他完全值得你们敬重与钦佩。
        - id: ch07-b03
          speaker: narrator
          text: 王子听见国王说认识自己，十分惊奇。他从未怀疑眼前的国王是女子乔装，也确信以前根本没有见过她。不过，他仍谦逊地接受众人的赞许，伏地行礼。
        - id: ch07-b04
          speaker: camaralzaman
          text: 陛下赐我如此厚重的荣誉，我找不到足够的言辞道谢。只能向您保证，我会竭尽全力，证明自己配得上这份荣宠。
        - id: ch07-b05
          speaker: narrator
          text: |-
            朝会结束后，王子被领到一座华美宅邸。宅中仆役齐全，马厩里满是良驹，书房里还有一箱供他花用的金币。好运来得如此突然，他越来越困惑，怎么也猜不到这一切出自巴杜拉之手。

            几天后，巴杜拉任命他为大司库。王子清廉正直、宽厚仁慈，很快赢得所有人的尊敬。若不是始终为夫妻离别而哀叹，他几乎可以自认是世上最幸福的人。

            巴杜拉没有立刻显露身份。她先让丈夫洗去旅途的尘垢，换回与身份相称的衣服，又给他宅邸、仆役、马匹和钱财。王子担任大司库以后，没有辜负这份信任。朝廷众人只看见新王格外器重这位异乡人，没有一个人猜到，他们本来就是失散已久的夫妻。

            王子自己也没有认出妻子。他只知道，乌木岛的国王声称曾在旅途中见过他，还一再赐予远超寻常的恩惠。眼前的人穿着男装，坐在王位上，又被所有大臣称作国王。即使面容使他觉得熟悉，他也不会想到，巴杜拉竟一路使用自己的名字，还已经统治了这个国家。公主则耐心等到丈夫站稳脚跟、得到群臣敬重，才准备揭开秘密。

            众人称巴杜拉为小阿尔马诺斯国王，几乎没人还记得，她初来时曾用过另一个名字。终于，公主觉得该结束悬念了。她同哈娅特内芙丝安排妥当，告诉大司库有件要事想听他的意见，请他当晚到王宫内室，以免有人打扰。

            王子准时赴约。公主遣退侍从，从小匣里取出护符递给他。
        - id: ch07-b06
          speaker: badoura
          text: 不久前，有位占星师送给我这道护符。你见闻广博，也许能告诉我，它有什么用？
        - id: ch07-b07
          speaker: narrator
          text: 王子接过护符，对着灯光一看，顿时惊叫起来。
        - id: ch07-b08
          speaker: camaralzaman
          text: |-
            陛下问它有什么用。唉，直到今天，它带给我的只有灾祸！正因为它，我才同世上最爱的人失散。这个故事又悲惨又离奇，若陛下准许我讲，一定也会为之动容。
        - id: ch07-b09
          speaker: badoura
          text: 改日再听吧。不过，我想这个故事对我也不完全陌生。请在这里等候，我很快回来。
        - id: ch07-b10
          speaker: narrator
          text: |-
            公主走进另一间屋，脱下男装，换回女装，又系上分别那天所戴的腰带，这才回到王子面前。

            王子一眼认出了她，满怀深情地将她拥入怀中。
        - id: ch07-b11
          speaker: camaralzaman
          text: 啊，国王送我这样大的惊喜，我要怎样感谢他才好？
          emotion: happy
        - id: ch07-b12
          speaker: badoura
          text: 你再也不用盼着见那位国王，因为国王就是我。我们坐下吧，我把一切都告诉你。
          emotion: happy
        - id: ch07-b13
          speaker: narrator
          text: |-
            巴杜拉擦去喜悦的泪水，把分别后的历险一一讲出，又用了许多话赞美哈娅特内芙丝的美德、高贵和真诚帮助。接着，她请王子也讲自己的遭遇。两人交谈了大半夜。

            王子这才知道，自己追鸟离开营地以后，妻子怎样守住秘密、扮成他的模样，怎样被阿尔马诺斯当作女婿和继承人，又怎样得到哈娅特内芙丝的帮助。巴杜拉也终于知道丈夫流落花园、受到老人收留、找到金沙，又因安葬恩人错过船只的全部经过。两边的故事到这一夜才真正合在了一起。

            第二天早晨，巴杜拉仍穿女装，命宦官总管请阿尔马诺斯国王前来。老国王走进内室，看见一个陌生女子和大司库在一起，大为惊讶。按规矩，大司库根本无权进来。他坐下后，问国王去了哪里。
        - id: ch07-b14
          speaker: badoura
          text: |-
            陛下，昨天我还是国王，今天却只是中国公主，也是真正的卡马拉尔扎曼王子之妻。他的父亲就是沙赫扎曼国王。等您听完我们的故事，一定不会责怪我这场迫不得已、又没有伤害任何人的骗局。
        - id: ch07-b15
          speaker: narrator
          text: 阿尔马诺斯答应听下去，越听越惊奇。故事讲完后，巴杜拉又提出请求。
        - id: ch07-b16
          speaker: badoura
          text: |-
            陛下，我们的教规准许男子迎娶不止一位妻子。我恳求您把哈娅特内芙丝公主嫁给卡马拉尔扎曼。她给了我深厚的恩情。为了表达感激，我愿意让她居于首位，享有王后的尊号。
        - id: ch07-b17
          speaker: narrator
          text: 阿尔马诺斯既惊讶又赞叹，转身询问王子。
        - id: ch07-b18
          speaker: armanos
          text: |-
            我的儿，直到现在，我还一直把你的妻子巴杜拉当作女婿。她愿意让我的女儿与你共享婚姻与爱情。我只问你，这门婚事合不合你的心意？你又愿不愿接受王冠？巴杜拉原本配得上一生佩戴它，如今却因为爱你，甘愿让给你。
        - id: ch07-b19
          speaker: camaralzaman
          text: 陛下，无论您提出什么要求，我都不会拒绝。
        - id: ch07-b20
          speaker: narrator
          text: |-
            于是，卡马拉尔扎曼依照礼仪正式成为国王，又用同样隆重的典礼迎娶哈娅特内芙丝。她的美貌、才华和深情，无一不令王子称心。

            两位王后亲如姐妹，真正和睦地生活在一起。过了一段时日，她们先后为卡马拉尔扎曼生下一个儿子。两位王子的诞生，让整个国家都欢庆不已。
