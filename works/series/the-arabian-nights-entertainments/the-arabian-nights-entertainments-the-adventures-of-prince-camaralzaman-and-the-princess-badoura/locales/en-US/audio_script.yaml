  chapters:
    - id: ch01
      title: The Prince Who Would Not Marry
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            About twenty days by sea from Persia lay the Isles of the Children of Khaledan, a prosperous kingdom of rich provinces and flourishing towns. King Schahzaman ruled there in peace and considered himself among the most fortunate kings alive. Yet one sorrow troubled him. None of his four wives had given him an heir.
        - id: ch01-b02
          speaker: grand_vizir
          text: >-
            No human power can settle such a matter, sire. Allah alone can grant what you desire. Send generous gifts to holy men who spend their lives in prayer, and ask them to pray for you. Their petitions may yet be answered.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The king followed this advice, and the next year a son was born. Schahzaman sent splendid thank offerings to mosques and religious houses, and the whole kingdom celebrated. The child was so beautiful that he was named Camaralzaman, the Moon of the Century.

            Excellent teachers raised the prince with the greatest care. By the time he grew up, no young man was more charming or accomplished. His father loved him so dearly that he thought of giving up the throne in his favor, though the grand vizir did not think him ready.
        - id: ch01-b04
          speaker: grand_vizir
          text: >-
            The prince is still young for the burdens of ruling. You are right to fear that idleness may harm him, but let him marry first. Give him a place in your councils so he can learn the work of a king little by little. Then, when he is ready, you may safely give him the crown.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Once again, the king liked his minister's advice. He summoned Camaralzaman, who came at once and stood respectfully before him with lowered eyes.
        - id: ch01-b06
          speaker: schahzaman
          text: >-
            My son, I have called you here because I want you to marry. Tell me what you think.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The proposal overwhelmed the prince. For a long while he could not answer.
        - id: ch01-b08
          speaker: camaralzaman
          text: >-
            Father, forgive me if this is not the answer you hoped for. I never expected you to ask this while I am still so young. Marriage is deeply unpleasant to me. Perhaps I will not always feel this way, but I need a great deal of time before I can take the step you want.
        - id: ch01-b09
          speaker: schahzaman
          text: >-
            I will not force you. Take time to think. But remember that marriage is necessary for a prince who will one day rule a great kingdom.
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: >-
            From then on, Camaralzaman sat in the royal council and received every sign of his father's favor. A year passed. When Schahzaman asked again, the prince was no longer surprised, but he was just as firm. He begged his father to drop the subject and said that further urging would do no good.

            The unhappy king went back to the grand vizir.
        - id: ch01-b11
          speaker: schahzaman
          text: >-
            I followed your advice, but Camaralzaman still refuses to marry. He is more stubborn than ever.
        - id: ch01-b12
          speaker: grand_vizir
          text: >-
            Patience has already gained us much, sire, and harsh action may bring regret. Wait one more year. Then tell the prince before the full council that the good of the kingdom requires his marriage. Surely he will not refuse you again before all those honored ministers.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Schahzaman longed to see the prince married at once, but he agreed to wait. He visited Camaralzaman's mother and told her what had happened.
        - id: ch01-b14
          speaker: schahzaman
          text: >-
            Our son trusts you more than he trusts me. Speak to him seriously. Make him understand how deeply he will displease me if he keeps resisting, and that he may regret the steps I must take to enforce my will.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The next time Sultana Fatima saw her son, she told him how distressed she was that he had hurt his father. She asked why he objected so strongly.
        - id: ch01-b16
          speaker: camaralzaman
          text: >-
            Mother, I know there are many good, gentle, loving women, just as there are women who are nothing like that. If only they were all like you. What I cannot bear is being told to marry someone I know nothing about. Father will ask a neighboring king for his daughter, and that king will agree. Whether she is beautiful or ugly, clever or foolish, kind or cruel, I will have no choice. How can I know she will not be proud, hot-tempered, scornful, wasteful, or completely unsuited to me?
        - id: ch01-b17
          speaker: fatima
          text: >-
            But my son, do you truly want to be the last of a family that has ruled this kingdom so long and so gloriously?
        - id: ch01-b18
          speaker: camaralzaman
          text: >-
            I do not wish to outlive my father. If I do, I will try to rule in a way that honors those who came before me.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Many talks like this convinced the sultan that argument was useless. The second year passed without changing the prince's mind. At last Schahzaman summoned him before the whole council. There he declared that both his own wish and the good of the empire demanded the marriage, and he ordered his son to answer before the ministers.

            Camaralzaman flared into anger and answered with such heat that his father, furious at being defied in public, had him arrested. The prince was locked in an old tower with only a little furniture, a few books, and one attendant. Camaralzaman cared surprisingly little for the punishment. At least he could enjoy his books in peace.
        - id: ch01-b20
          speaker: narrator
          text: >-
            That night he washed, said his prayers, read several pages of the Koran, and lay down without putting out the lamp. Before long he was asleep.

            A deep well stood inside the tower. It was a favorite resting place of Maimoune, daughter of Damriat, chief of a legion of genii. Near midnight she floated up from the well, planning to wander wherever curiosity led her. The lamp surprised her. She slipped past the attendant asleep across the doorway and entered the room.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Camaralzaman's face was half covered. Maimoune lifted the coverlet and saw the most beautiful young man she had ever beheld.
        - id: ch01-b22
          speaker: maimoune
          text: >-
            What a wonder he must be when his eyes are open! What could he have done to deserve a prison like this?
        - id: ch01-b23
          speaker: narrator
          text: >-
            She gazed until she could hardly tear herself away. Then she kissed his brow and cheeks, replaced the coverlet, and flew upward. In the middle region of the air, she heard great wings. They belonged to Danhasch, one of the wicked genii. He knew that her goodness gave her power over him, and he was terrified. Escape was impossible, so he tried to make peace.
        - id: ch01-b24
          speaker: danhasch
          text: >-
            Good Maimoune, swear by Allah that you will not harm me. I promise that I will do you no injury either.
        - id: ch01-b25
          speaker: maimoune
          text: >-
            Accursed genie, what harm could you possibly do me? Still, I accept your promise and give you mine. Now tell me what you have seen and done tonight.
        - id: ch01-b26
          speaker: danhasch
          text: >-
            You have met me at the perfect moment. I have come from the farthest end of China, one of the world's greatest kingdoms. Its king has one daughter, Princess Badoura, and no creature could find words beautiful enough to describe her. Imagine perfect features, a brilliant delicate complexion, and the most enchanting expression. Even then, your imagination would fall short.

            Her father has hidden this treasure from every eye except that of the man he may choose as her husband. To make her seclusion pleasant, he built her seven magnificent palaces. One is crystal, one bronze, one fine steel, another a still more precious bronze, then touchstone, silver, and finally solid gold. Their furnishings are splendid and their gardens exquisite.

            Kings have come from far away to ask for her hand. Her father welcomes every embassy, but will not force her. Badoura refuses each proposal, and every envoy goes home disappointed.
        - id: ch01-b27
          speaker: badoura
          text: >-
            Father, I know you want me to marry because you want me to be happy, and I am grateful. But I have no desire to change my life. I am happy among these lovely palaces and gardens. I cannot believe any husband would make me happier. Please stop asking me.
        - id: ch01-b28
          speaker: danhasch
          text: >-
            At last a king so rich and powerful sent an embassy that her father pressed the match again and again. Badoura lost her temper and forgot the respect she owed him.
        - id: ch01-b29
          speaker: badoura
          text: >-
            Say nothing more about this marriage, or any marriage! If you keep tormenting me, I will drive this dagger into my heart and escape you all!
          emotion: angry
        - id: ch01-b30
          speaker: king_of_china
          text: >-
            You have lost your senses, and I will have you treated as someone who has gone mad.
          emotion: angry
        - id: ch01-b31
          speaker: danhasch
          text: >-
            He shut her in one part of a palace with ten elderly attendants led by her nurse. He told every king who had sought her hand that she was insane, and announced that whoever cured her could marry her. That is how matters stand. I visit her every day just to gaze at her. Come with me once, and you will admit that no loveliness can compare with hers.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Maimoune burst out laughing.
        - id: ch01-b33
          speaker: maimoune
          text: >-
            Oh, stop! I thought you had something interesting to tell me, but you are only raving about an unknown girl. If you saw the prince I have just left, you would learn what true beauty is. You would lose your head completely.
        - id: ch01-b34
          speaker: danhasch
          text: >-
            Charming Maimoune, who is this prince you speak of?
        - id: ch01-b35
          speaker: maimoune
          text: >-
            His story is much like your princess's. His father tried to force him to marry. When he refused, the king imprisoned him in an old tower, and that is where I found him.
        - id: ch01-b36
          speaker: danhasch
          text: >-
            I dislike contradicting a lady, but no mortal can possibly be as beautiful as my princess.
        - id: ch01-b37
          speaker: maimoune
          text: >-
            Be quiet! What you say is impossible.
          emotion: angry
        - id: ch01-b38
          speaker: danhasch
          text: >-
            I do not mean to be stubborn. Come see the princess yourself, and we can settle the question.
        - id: ch01-b39
          speaker: maimoune
          text: >-
            There is an easier way. Bring your princess here and lay her beside my prince. Then we can compare them properly and decide who is right.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Danhasch agreed and wagered that Badoura would win. After Maimoune showed him the tower, he flew to China. He returned with the sleeping princess in an incredibly short time, and they laid her beside Camaralzaman. At once the argument began again.
        - id: ch01-b41
          speaker: danhasch
          text: >-
            Now you can see that my princess is more beautiful. Surely you cannot doubt it any longer.
        - id: ch01-b42
          speaker: maimoune
          text: >-
            Of course I doubt it! You must be blind if you cannot see that my prince surpasses her. Badoura is very handsome, I admit, but one look should tell you that I am right.
        - id: ch01-b43
          speaker: danhasch
          text: >-
            I have looked enough, and my first judgment has not changed. Still, if you insist, charming Maimoune, I am willing to yield.
        - id: ch01-b44
          speaker: maimoune
          text: >-
            Certainly not. I will owe no favor to a wicked genie like you. We will call an impartial judge, and you will accept his decision.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Danhasch agreed. Maimoune stamped the floor, and it opened. Out came Caschcasch, a hideous genie who was hunchbacked, lame, and cross-eyed, with six horns and clawlike hands. He dropped at Maimoune's feet and asked what she commanded.
        - id: ch01-b46
          speaker: maimoune
          text: >-
            Rise, Caschcasch. Judge between Danhasch and me. Look at the couch and tell us fairly whether the young man or the maiden is more beautiful.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Caschcasch stared at them in wonder. He looked for a long time, but could not choose.
        - id: ch01-b48
          speaker: caschcasch
          text: >-
            Madam, I would deceive you if I called either one more beautiful. There is only one fair test. Wake them one at a time and see which shows greater admiration for the other.
    - id: ch02
      title: The Two Rings
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Maimoune and Danhasch liked the plan. The fairy became a gnat, settled on Camaralzaman's throat, and stung him sharply awake. His eyes opened upon the Princess of China. Astonished to find a young woman beside him, he raised himself on one arm and gazed. Her youth and beauty awakened a feeling his heart had never known.
        - id: ch02-b02
          speaker: camaralzaman
          text: >-
            What beauty! What grace! You have taken my heart and soul.
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: >-
            He kissed her forehead, eyes, and lips, but the genie's enchantment held her asleep.
        - id: ch02-b04
          speaker: camaralzaman
          text: >-
            Lovely lady, will you not wake even when Camaralzaman shows his love? Whoever you are, I am not unworthy of you.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Suddenly he wondered if this was the bride his father had chosen. Perhaps the king had placed her there to test whether his dislike of marriage could survive such beauty.
        - id: ch02-b06
          speaker: camaralzaman
          text: >-
            Whatever the truth may be, I will keep her ring to remember her.
        - id: ch02-b07
          speaker: narrator
          text: >-
            He slipped the fine ring from Badoura's finger and put his own in its place. Then he lay down and soon fell asleep again.

            Danhasch now became a gnat and bit Badoura on the lip. She started awake and stared at the young man beside her. Surprise became admiration, then delight, as she studied his handsome face.
        - id: ch02-b08
          speaker: badoura
          text: >-
            Was this the man Father wanted me to marry? If only I had known! I would never have made him so angry. Wake up, please. Wake up! I know I could love you with all my heart.
          emotion: surprised
        - id: ch02-b09
          speaker: narrator
          text: >-
            She shook Camaralzaman hard, but Maimoune's spell kept him asleep.
        - id: ch02-b10
          speaker: badoura
          text: >-
            Oh, why must you sleep so deeply?
        - id: ch02-b11
          speaker: narrator
          text: >-
            She took his hand and saw her own ring on his finger. Her wonder grew. Since he would not wake, she kissed his cheek and soon fell asleep beside him.
        - id: ch02-b12
          speaker: maimoune
          text: >-
            Well, Danhasch, are you satisfied now that my prince surpasses your princess? Next time, believe me when I tell you something. Caschcasch, thank you. You and Danhasch may carry Badoura home.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The two genii obeyed, and Maimoune returned to her well.

            The next morning, Camaralzaman looked everywhere for the lady. Then he questioned his attendant. The man insisted that he knew nothing about any visitor or how she could have entered. The prince lost his temper. He beat the attendant, tied a rope around him, and lowered him into the well until the poor man promised to tell everything. Once Camaralzaman pulled him out, the dripping attendant begged to change his clothes. Given permission, he ran straight to the palace.
        - id: ch02-b14
          speaker: slave
          text: >-
            Alas, sire, I bring terrible news. The prince has completely lost his reason. He insists that a lady slept on his couch last night. Look at me, and you can see what happens when anyone contradicts him.
        - id: ch02-b15
          speaker: narrator
          text: >-
            He described everything the prince had said and done. Deeply troubled, Schahzaman asked the grand vizir to investigate. The minister found Camaralzaman quietly reading.
        - id: ch02-b16
          speaker: grand_vizir
          text: >-
            Your attendant has alarmed the king with his report, and I am very angry with him for it.
        - id: ch02-b17
          speaker: camaralzaman
          text: >-
            What report did he bring?
        - id: ch02-b18
          speaker: grand_vizir
          text: >-
            Something absurd, I am sure, now that I see you sitting here so sensibly.
        - id: ch02-b19
          speaker: camaralzaman
          text: >-
            Most likely. But since you are here, tell me where the lady is who slept in this room last night.
        - id: ch02-b20
          speaker: narrator
          text: >-
            The grand vizir was stunned.
        - id: ch02-b21
          speaker: grand_vizir
          text: >-
            Prince, how could any man enter this room, much less a woman, without stepping over your attendant at the door? Think carefully. A dream must have made a very powerful impression on you.
        - id: ch02-b22
          speaker: narrator
          text: >-
            Camaralzaman angrily demanded the woman's name and location. The vizir's denials only convinced him that the minister had arranged the whole trick. At last the prince grabbed his beard and struck him until the unfortunate man cried out.
        - id: ch02-b23
          speaker: grand_vizir
          text: >-
            Stop, Prince! Please stop and listen to me!
          emotion: fearful
        - id: ch02-b24
          speaker: narrator
          text: >-
            The prince's arm was tired, so he paused.
        - id: ch02-b25
          speaker: grand_vizir
          text: >-
            I admit there is some truth in what you say. But a minister must carry out his master's orders. Let me go to the king, and I will deliver any message you choose.
        - id: ch02-b26
          speaker: camaralzaman
          text: >-
            Very well. Tell my father that I consent to marry the lady he brought here last night. Hurry back with his answer.
        - id: ch02-b27
          speaker: narrator
          text: >-
            The vizir bowed low and escaped. When the king asked about his son, he sadly confirmed the attendant's report and described the prince's fury. Schahzaman decided to learn the truth himself and took the vizir back to the tower.

            Camaralzaman received his father with deep respect and answered several questions sensibly. At last the king asked about the lady.
        - id: ch02-b28
          speaker: camaralzaman
          text: >-
            Father, please do not add to my pain. Make me happy by giving her to me. I once disliked the very thought of marriage, but one sight of this young woman swept away every objection. I will receive her from you with all my heart.
        - id: ch02-b29
          speaker: narrator
          text: >-
            The king could hardly speak. He swore that he knew nothing about the woman and had no part in bringing her there. Camaralzaman told the whole story, showed him the ring, and begged for help finding the bride he now loved.
        - id: ch02-b30
          speaker: schahzaman
          text: >-
            After hearing this and seeing the ring, I cannot doubt you. But I cannot imagine where she came from, how she entered, or why she stayed such a short time. It is a complete mystery. Come, my dear son. We will wait together and hope for happier days.
        - id: ch02-b31
          speaker: narrator
          text: >-
            Schahzaman led him back to the palace. There the prince took to his bed in despair. His father shut himself away with him and neglected the kingdom. At last the grand vizir warned that the court and the people were complaining. He advised moving to a lovely nearby island, where the king could hold public audiences while the scenery and fresh air strengthened his son.

            The plan was accepted. Once the island castle was ready, father and son moved there. Schahzaman left Camaralzaman only for his two audiences each week.
        - id: ch02-b32
          speaker: narrator
          text: >-
            Meanwhile, the genii had returned Badoura to her palace and placed her in bed. When she woke alone, she called loudly for her women.
        - id: ch02-b33
          speaker: badoura
          text: >-
            Where is the young man I love, the one who slept beside me last night?
        - id: ch02-b34
          speaker: nurse
          text: >-
            Princess, we do not understand. You must explain what you mean.
        - id: ch02-b35
          speaker: badoura
          text: >-
            The most charming and beautiful young man was here beside me. I tried everything I could to wake him, but nothing worked.
        - id: ch02-b36
          speaker: nurse
          text: >-
            Your Royal Highness must be teasing us. Would you like to rise now?
        - id: ch02-b37
          speaker: badoura
          text: >-
            I am not teasing. I mean every word, and I want to know where he is.
        - id: ch02-b38
          speaker: nurse
          text: >-
            But we left you alone last night, Princess. No one has entered this room since then.
        - id: ch02-b39
          speaker: narrator
          text: >-
            Badoura seized the nurse by the hair and boxed her ears.
        - id: ch02-b40
          speaker: badoura
          text: >-
            Tell me, you old witch, or I will kill you!
          emotion: angry
        - id: ch02-b41
          speaker: narrator
          text: >-
            The nurse barely escaped. In tears, she ran to the queen and said the princess must truly be out of her mind. The queen hurried to her daughter, embraced her tenderly, and asked why she had treated the old woman so badly.
        - id: ch02-b42
          speaker: badoura
          text: >-
            Mother, you seem determined to mock me too. I will never marry anyone except the wonderful young man I saw last night. You must know where he is. Please send for him.
        - id: ch02-b43
          speaker: narrator
          text: >-
            The queen knew nothing and said so. Badoura threatened to kill herself if she could not marry the man she had chosen. No effort could soothe her. Her father came to hear the story. She repeated it and showed him the ring as proof. He decided she was madder than ever and placed her under a stronger guard with only her nurse beside her.

            Then he called his council.
        - id: ch02-b44
          speaker: king_of_china
          text: >-
            Whoever cures my daughter may marry her and become my heir.
        - id: ch02-b45
          speaker: narrator
          text: >-
            An elderly emir desired both the beautiful princess and the kingdom. He offered to use his knowledge of magic.
        - id: ch02-b46
          speaker: king_of_china
          text: >-
            You may try, but on one condition. If you fail, you will lose your life.
        - id: ch02-b47
          speaker: narrator
          text: >-
            The emir accepted. When the king brought him to Badoura, she covered her face.
        - id: ch02-b48
          speaker: badoura
          text: >-
            Father, why have you brought a strange man into my room?
        - id: ch02-b49
          speaker: king_of_china
          text: >-
            There is no cause for alarm. This emir asks to marry you.
        - id: ch02-b50
          speaker: badoura
          text: >-
            He is not the man you gave me before, whose ring I am wearing. I can accept no one else.
        - id: ch02-b51
          speaker: narrator
          text: >-
            The emir had expected nonsense. Instead, he found her calm and reasonable. He admitted he could not cure her and placed his life in the king's hands. The angry monarch promptly had him beheaded. He was only the first of many suitors who paid with their lives when they failed.
    - id: ch03
      title: Marzavan Finds the Prince
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After some time, the nurse's son Marzavan returned from years of travel. He had visited many countries and learned many arts, including astrology. His mother quickly told him what had happened to Badoura, who was his foster sister. He asked her to arrange a secret visit. She agreed and persuaded the guard to let him enter.

            Badoura was delighted to see him. She told him everything, from the mysterious night to the ring and her imprisonment. Marzavan listened with lowered eyes and complete attention.
        - id: ch03-b02
          speaker: marzavan
          text: >-
            Princess, if everything happened as you say, I still have hope of bringing you comfort. Be patient a little longer. I will search other countries at once. When you hear that I have returned, you may be sure that the man you long for is near.
        - id: ch03-b03
          speaker: narrator
          text: >-
            He left the next morning. From cities to islands and from one province to another, he heard people repeat the strange story of Princess Badoura. Four months later he reached the crowded seaport of Torf. There no one spoke of her. Instead, everyone discussed an ailing Prince Camaralzaman, whose story sounded remarkably like Badoura's.

            Marzavan rejoiced and took ship toward Schahzaman's capital. The voyage went well until the vessel came within sight of the palace where the prince lived. Just before reaching harbor, it struck a rock and sank.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Marzavan was a strong swimmer. He reached shore near the palace, received dry clothes, and was brought to the grand vizir. The minister admired his intelligence and the experience he had gained abroad.
        - id: ch03-b05
          speaker: grand_vizir
          text: >-
            How I wish your travels had taught you some secret that could cure the illness which has kept our whole court in sorrow.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Marzavan said he might suggest a remedy if he knew the illness. The vizir told Camaralzaman's entire story. Marzavan felt certain that he had found the man Badoura loved, but hid his joy and asked to see him.

            The prince lay on his bed with his eyes closed while the king sat nearby. The moment Marzavan entered, he forgot court manners and exclaimed aloud.
        - id: ch03-b07
          speaker: marzavan
          text: >-
            Heavens, what an astonishing likeness!
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: >-
            Camaralzaman did resemble the Princess of China. He opened his eyes with weary curiosity. Marzavan greeted him, then spoke of Badoura's condition in words that the king and vizir could not understand, though the prince knew at once that this stranger carried welcome news.

            Camaralzaman asked to speak with him alone. The king gladly agreed, pleased that anything had caught his son's interest.
        - id: ch03-b09
          speaker: marzavan
          text: >-
            Princess Badoura has suffered just as you have. I am certain that only you can cure her. But the journey is long, and first you must regain your strength. Do everything you can to recover quickly.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Hope transformed the prince. He declared that he could rise and dress at once. His father was overjoyed and ordered public celebrations. Before long, Camaralzaman was completely well.
        - id: ch03-b11
          speaker: camaralzaman
          text: >-
            Now you must keep your promise. I am so desperate to see Badoura that another delay may make me ill again. The only obstacle is my father's love. As you have seen, he cannot bear to let me out of his sight.
        - id: ch03-b12
          speaker: marzavan
          text: >-
            I have a plan. You have not gone outdoors since I arrived. Ask permission to hunt with me for two or three days. Once the king agrees, order two good horses for each of us. Leave everything else to me.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The king granted the request the next day, though he allowed only one night away because the prince had so recently recovered. Early the following morning, Camaralzaman and Marzavan rode out with two grooms leading spare horses. They hunted a little while steadily putting distance between themselves and every town.

            At night they reached an inn, ate, and slept until midnight. Marzavan woke the prince without disturbing the others. He had Camaralzaman change coats. Then they mounted the spare horses, and Marzavan led one groom's horse with him.
        - id: ch03-b14
          speaker: narrator
          text: >-
            By dawn they reached a lonely crossing of four roads in the forest. Marzavan told the prince to wait. He led the groom's horse deep among the trees, killed it, stained Camaralzaman's old coat with its blood, and threw the garment down at the crossroads.
        - id: ch03-b15
          speaker: marzavan
          text: >-
            This is the only way to keep pursuit from stopping us. Everyone will believe you were killed. Your father will suffer terrible grief, but his joy will be even greater when you return.
        - id: ch03-b16
          speaker: narrator
          text: >-
            They continued over land and sea. With plenty of money for the journey, they suffered no needless delays. At last they reached the capital of China and rested there for three days.

            Marzavan had an astrologer's robe made for the prince. After visiting the baths, Camaralzaman put it on. Marzavan led him within sight of the palace, then went to speak with his mother. Following his instructions, the prince approached the gates and called out.
        - id: ch03-b17
          speaker: camaralzaman
          text: >-
            I am an astrologer. I have come to restore Princess Badoura, daughter of the mighty King of China, to health. I accept the king's terms. If I cure her, I will marry her. If I fail, I will die.
        - id: ch03-b18
          speaker: narrator
          text: >-
            No one had dared take that risk for some time. A crowd gathered, and the people pitied such a young, handsome, noble-looking stranger.
        - id: ch03-b19
          speakers: [crowd_member_1, crowd_member_2]
          ensemble: duo
          text: >-
            What are you doing? Why walk willingly into certain death? Look at the heads on the city wall and take warning. Please abandon this madness while you still can!
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: >-
            Camaralzaman only repeated his challenge more confidently.
        - id: ch03-b21
          speakers: [crowd_member_1, crowd_member_2]
          ensemble: duo
          text: >-
            He means to die! May heaven have mercy on him!
          emotion: fearful
        - id: ch03-b22
          speaker: narrator
          text: >-
            After the third proclamation, the king's grand vizir came out and brought him inside. The king was struck by the stranger's noble bearing and urged him to give up a plan that seemed certain to kill him. Camaralzaman remained courteous but firm. At last the king ordered the chief eunuch to lead him to Badoura.

            They passed through long corridors until they reached the hall outside her room.
        - id: ch03-b23
          speaker: camaralzaman
          text: >-
            You may choose. Shall I cure the princess face to face, or shall I do it from this hall without seeing her?
        - id: ch03-b24
          speaker: eunuch
          text: >-
            If you truly possess such power, the place makes no difference. Your fame will be just as great.
        - id: ch03-b25
          speaker: camaralzaman
          text: >-
            Very well. Though I long to see her, I will cure her from here so you cannot doubt my skill.
        - id: ch03-b26
          speaker: narrator
          text: >-
            He wrote a letter telling Badoura that Camaralzaman had never forgotten the moment he saw her asleep and gave her his heart. Since he could not speak with her then, he had left his ring and taken hers. Now he enclosed her ring. If she returned it, he would be the happiest man alive. If she refused, he would accept death for love of her. He waited in the outer hall.

            Camaralzaman folded the ring inside without letting the eunuch see it.
        - id: ch03-b27
          speaker: camaralzaman
          text: >-
            Take this to your mistress. If the letter and what it holds do not cure her at once, you may call me a shameless impostor.
        - id: ch03-b28
          speaker: eunuch
          text: >-
            Madam, another astrologer has come. He says this letter and whatever lies inside it will cure you as soon as you see them.
        - id: ch03-b29
          speaker: narrator
          text: >-
            Badoura opened the letter without interest. The instant she saw her ring, she barely glanced at the words. She leaped up, ran to the doorway, and pulled back the hangings. She and Camaralzaman recognized each other. In a moment they were embracing, amazed that their long separation had ended.

            The nurse drew them into the private room. There Badoura gave back his ring.
        - id: ch03-b30
          speaker: badoura
          text: >-
            Take your ring. I could not keep mine unless I returned yours, and I mean to wear your ring for the rest of my life.
          emotion: happy
        - id: ch03-b31
          speaker: narrator
          text: >-
            The eunuch hurried to the king.
        - id: ch03-b32
          speaker: eunuch
          text: >-
            Sire, every former doctor and astrologer was a fraud. This man cured the princess without even seeing her!
          emotion: surprised
        - id: ch03-b33
          speaker: narrator
          text: >-
            The delighted king rushed to Badoura, embraced her, and placed her hand in Camaralzaman's.
        - id: ch03-b34
          speaker: king_of_china
          text: >-
            Fortunate stranger, I will keep my promise and give you my daughter, whoever you may be. But I suspect your true rank is much higher than your clothes suggest.
        - id: ch03-b35
          speaker: camaralzaman
          text: >-
            Your Majesty has guessed correctly. I am no astrologer. I wore this disguise only so I could earn your daughter's hand. I am Prince Camaralzaman, son of Schahzaman, King of the Isles of the Children of Khaledan.
        - id: ch03-b36
          speaker: narrator
          text: >-
            He told the king everything, including the mysterious night when he first saw and loved Badoura.
        - id: ch03-b37
          speaker: king_of_china
          text: >-
            A story this extraordinary must never be lost. I will have it written in the records of my kingdom and sent throughout the world.
        - id: ch03-b38
          speaker: narrator
          text: >-
            The wedding took place the next day amid splendid celebrations. Marzavan received a rich court position and a promise of further honors. Camaralzaman and Badoura were completely happy, and the months passed unnoticed in each other's company.
    - id: ch04
      title: The Stolen Talisman
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            One night Camaralzaman dreamed that his father lay close to death, mourning that the son he loved had deserted him and was causing him to die. The prince woke with a groan so deep that Badoura started up and asked what had happened.
        - id: ch04-b02
          speaker: camaralzaman
          text: >-
            At this very moment, my father may already be dead.
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: >-
            He told her the dream. Badoura said little then, but the next morning she went to her father and kissed his hand.
        - id: ch04-b04
          speaker: badoura
          text: >-
            Your Majesty, I ask one favor, and I promise that my husband did not persuade me to ask it. Please let us visit my father-in-law, King Schahzaman.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Her father hated the thought of losing her even for a while, but the request was reasonable, especially because it came from Badoura herself. He could not refuse. He agreed on one condition. She could remain at Schahzaman's court for only a year. After that, the young couple could divide their time fairly and visit their two families in turn.

            Badoura carried the good news to her husband, who thanked her tenderly for this fresh proof of love. Preparations began at once, and everything needed for the long journey was gathered without delay. When all was ready, her father traveled with them for several days. At last he said an affectionate farewell to his daughter, charged Camaralzaman to care for her in every way, and sadly returned to his capital.
        - id: ch04-b06
          speaker: narrator
          text: >-
            A month into the journey, they reached a broad meadow dotted with great trees and cool shade. The heat was heavy, so Camaralzaman ordered the company to camp. Badoura entered her tent, removed her jeweled girdle, set it beside her, and dismissed her women. Soon she was asleep.

            Once the camp was settled, the prince came in and sat quietly near her. He noticed a small pouch sewn to the girdle. Something hard lay inside. He opened it and found a red cornelian carved with strange figures and signs.
        - id: ch04-b07
          speaker: camaralzaman
          text: >-
            This stone must be precious, or Badoura would not keep it so carefully against her body.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The stone was a talisman from the Queen of China. When she gave it to her daughter, she had said that Badoura's happiness would remain safe as long as she always carried it. Camaralzaman knew none of this. He only wanted to examine the carving more closely, so he stepped to the open doorway where the daylight was stronger. The stone lay uncovered in his palm. Without warning, a bird dropped from the sky, snatched it in its beak, and flew away.

            The prince was horrified to lose something Badoura clearly valued so highly. He ran after the bird. It settled on the ground only a short distance away, still gripping the talisman. Camaralzaman approached slowly, hoping it might drop its prize. The thief only fluttered a few yards farther. Again he followed, and again it retreated. Then the bird swallowed the talisman and took a longer flight. The prince picked up stones and hoped to kill it, but the harder he pursued, the farther the bird flew.
        - id: ch04-b09
          speaker: narrator
          text: >-
            All day the bird led him over hills and through valleys, never letting him come close enough to recover the stone. When night came, it perched at the top of a very tall tree where no hand could reach it. Camaralzaman stood below in despair and wondered whether he should abandon the chase and return to camp. Then he looked around and understood that he no longer knew the way. Should he climb the next hill or descend into the valley? Darkness hid every landmark. Even if he chose correctly, hunger, thirst, and exhaustion had nearly spent his strength. With no other choice, he passed the night beneath the tree.

            He woke before the bird the next morning and watched until it left its branch. The moment it flew, he followed again with no more success than before. He stopped only long enough to eat whatever herbs and wild fruit he could find. The same hopeless chase continued for ten days. He followed from morning until night, while the bird always chose the highest branch and slept safely above him. On the eleventh day, both pursuer and bird came near a large town. Just outside its walls, the creature suddenly rose much higher than before. Within moments it vanished completely. Camaralzaman could only stand and watch the sky, knowing that every hope of recovering Badoura's talisman had disappeared with it.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Camaralzaman entered the seaside town in despair. He wandered until he found an open garden gate and stepped through it. An elderly gardener looked up, recognized the stranger's Muslim clothing, and urgently motioned him inside.
        - id: ch04-b11
          speaker: gardener
          text: >-
            Come in quickly and shut the gate.
        - id: ch04-b12
          speaker: camaralzaman
          text: >-
            Why must we be so careful?
        - id: ch04-b13
          speaker: gardener
          text: >-
            You are a stranger and a Muslim. Nearly everyone in this town worships idols, and they hate and persecute people of our faith. It is almost a miracle that you found this garden. I am glad you have reached safety.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Camaralzaman began to thank him warmly, but the old man cut him short.
        - id: ch04-b15
          speaker: gardener
          text: >-
            Save your compliments. You are tired and hungry. Come inside, eat, and rest.
        - id: ch04-b16
          speaker: narrator
          text: >-
            After feeding him, the gardener asked how he had arrived. Camaralzaman told the truth and asked for the shortest road to his father's capital.
        - id: ch04-b17
          speaker: camaralzaman
          text: >-
            After eleven days, how could I ever find Badoura's caravan again? She may not even be alive now.
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: >-
            He broke down in tears. The gardener explained that the nearest Muslim country was a full year away by land. By sea, however, a ship sailed once each year to the Ebony Island, from which the Isles of the Children of Khaledan were easily reached.
        - id: ch04-b19
          speaker: gardener
          text: >-
            If you had arrived a few days earlier, you could have sailed at once. Now you must wait another year. If you are willing to stay with me, my poor home is yours with all my heart.
        - id: ch04-b20
          speaker: narrator
          text: >-
            The prince gratefully accepted. By day he worked in the garden. At night he thought of Badoura and grieved for her.
    - id: ch05
      title: Badoura Becomes a King
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When Badoura woke in the meadow, Camaralzaman was gone. Her women had seen him enter the tent but not leave. Then she found the pouch on her girdle open and the talisman missing. She decided he had taken it and would soon return.

            She waited impatiently until evening. When night fell with no sign of him, despair seized her, and she bitterly blamed both the talisman and its maker. Yet she kept control of herself and chose a bold, unusual course.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Only Badoura and her women knew the prince had vanished. The rest of the company slept or rested in their tents. Fearing treachery if anyone learned the truth, she ordered the women to remain silent. Then she put on Camaralzaman's clothes. Their faces resembled each other so strongly that the disguise was convincing.

            The next morning no one questioned her order to break camp. Badoura placed one of her women inside her own covered litter, mounted the prince's horse, and led the company onward.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The procession traveled for a long time, sometimes overland and sometimes by sea. Through it all, Badoura continued to speak, dress, and command under Camaralzaman's name. At last they reached the capital of the Ebony Island, whose ruler was King Armanos. A ship had just entered his harbor carrying, as everyone believed, the son of an old friend and ally. The king hurried out in person to greet the supposed prince. He brought Badoura and the whole company to the palace, gave them splendid rooms, and entertained them with every honor he could offer.

            For three days Badoura accepted his hospitality while carefully preserving the disguise. Then she spoke of continuing toward Camaralzaman's homeland. In that short time, Armanos had already become deeply fond of his courteous and accomplished young guest. The thought of letting such a prince sail away gave him another idea.
        - id: ch05-b04
          speaker: armanos
          text: >-
            Prince, I am old, and I have no son to inherit my kingdom. Heaven gave me one daughter, so beautiful and gracious that only a prince of your birth and accomplishments could deserve her. Do not return home. Marry my daughter, accept my crown, and remain here. I will know that my people have a worthy ruler, and I can gladly retire from government.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Badoura was trapped. Confessing the disguise seemed impossible, but refusing the marriage might turn the old king's affection into hatred and persecution. After thinking through every danger, she decided to accept. She blushed, and Armanos mistook her anxiety for modesty.
        - id: ch05-b06
          speaker: badoura
          text: >-
            Sire, your generous opinion of me and the honor you offer create a debt I can never repay. Though I am unworthy, I cannot refuse. I ask only that you promise to guide me with your advice.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The wedding was fixed for the very next day. Badoura used the short time before it to speak privately with the officers who had traveled from China. She told them about King Armanos's offer and assured them that Princess Badoura, whom they believed remained hidden in the litter, had given her full consent to the match. Then she told her own women exactly what had happened and warned them that her safety depended on their guarding the secret well.

            Armanos was delighted that every part of his plan had succeeded. He wasted no time. He assembled his whole court and council, presented the supposed Prince Camaralzaman as his chosen successor, and placed the young ruler upon the throne. Every minister and officer bowed in homage and swore allegiance to the new king. That night the city filled with lights, music, and celebration. With all the ceremony due to a royal bride, Princess Haiatelnefous was escorted from her father's household to the palace where Badoura waited.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Badoura had spent the day thinking about their first private meeting. Once they were alone, she took Haiatelnefous by the hand.
        - id: ch05-b09
          speaker: badoura
          text: >-
            Princess, I must trust you with a secret and place myself in your mercy. I am not Prince Camaralzaman. I am a princess like you, and I am his wife. Please hear my story. When you know what I have suffered, I hope you can forgive this deception.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Badoura told her everything. When the tale ended, Haiatelnefous embraced her warmly and promised sympathy and affection. Together they agreed to preserve the secret. Badoura would continue to rule as a man until they received news of the real Camaralzaman.
    - id: ch06
      title: The Garden and the Jars
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            While Badoura ruled the Ebony Island, Camaralzaman still lived in the gardener's cottage. Early one morning the old man explained that the town was observing a public holiday. No one worked, and the townspeople forbade anyone else to work either.
        - id: ch06-b02
          speaker: gardener
          text: >-
            Rest today while I visit some friends. The yearly ship should arrive soon, so I will ask about it and try to reserve your passage.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The gardener put on his best clothes and left to visit his friends and ask when the ship would sail. Camaralzaman wandered slowly among the trees. Soon he forgot the garden around him and thought only of Badoura, of the meadow where he had lost her, and of every unhappy day since their separation. A violent commotion above him broke his reverie. He stopped and looked up. Two large birds were fighting savagely among the branches, striking with their beaks and tearing with their claws. Before long, one fell dead to the ground. The victor spread its wings and flew away.

            Almost at once, two still larger birds that had watched the duel flew down. One stood at the dead bird's head and the other at its feet. For some time they remained there sadly shaking their heads. Then they used their claws to dig a grave, lowered the body into it, and covered it with earth. Their work finished, they flew away together. Before long they returned with the murderer trapped between them. One held it by a wing and the other by a leg. Their prisoner screamed and twisted in rage and terror, but they never loosened their beaks. They carried it to the grave of its victim, killed it there, tore open its body, scattered what lay inside, and once more flew out of sight.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Camaralzaman approached and noticed something red beside the dead bird. It had fallen from the creature's body. He picked it up and recognized Badoura's talisman. His joy was beyond words. He kissed the stone again and again, wrapped it carefully, and tied it around his arm.

            For the first time since losing his wife, he slept well. At dawn he rose cheerfully and asked the gardener what work needed doing.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The gardener told him to cut down a dead fruit tree. As Camaralzaman chopped at its roots, his axe struck something hard. He cleared the soil and uncovered a broad bronze slab. Beneath it, ten steps descended into a roomy cave. Fifty great bronze jars stood there, each one filled with gold dust.

            He replaced the slab, finished cutting the tree, and waited. The gardener returned with good news shining in his face.
        - id: ch06-b06
          speaker: gardener
          text: >-
            Rejoice, my son, and be ready. The ship sails in three days, and I have arranged your passage with its captain.
        - id: ch06-b07
          speaker: camaralzaman
          text: >-
            No news could make me happier. I also have something wonderful to show you. Come see the good fortune that has found you.
        - id: ch06-b08
          speaker: narrator
          text: >-
            Camaralzaman led him to the cave and said that heaven had rewarded his kindness and years of hardship.
        - id: ch06-b09
          speaker: gardener
          text: >-
            What do you mean? I will not take this treasure. It belongs to you. I have dug in this garden for eighty years and never found it. Clearly it was meant for you. A prince returning to his own country needs it far more than an old man near the end of his life.
        - id: ch06-b10
          speaker: narrator
          text: >-
            The prince refused to keep everything. After a long argument, they divided the gold equally.
        - id: ch06-b11
          speaker: gardener
          text: >-
            Now we must carry your treasure secretly. Olives do not grow on the Ebony Island, so imported ones sell for a high price. Fill fifty jars halfway with gold dust and cover the gold with olives from this garden. Then we can load them aboard when you sail.
        - id: ch06-b12
          speaker: narrator
          text: >-
            Camaralzaman spent the day preparing the jars. Afraid that the talisman might slip from his arm, he hid it in one marked jar. That night both men went to bed.

            Perhaps age, exhaustion, or the excitement of the discovery was too much for the gardener. He passed a miserable night, grew worse the next day, and by the third morning was dangerously ill. At dawn, the captain and several sailors knocked at the gate and asked for their passenger.
        - id: ch06-b13
          speaker: camaralzaman
          text: >-
            I am the passenger. The gardener who booked my place is too ill to meet you. Please take these olive jars and my bag. I will follow as soon as I have said farewell to him.
        - id: ch06-b14
          speaker: narrator
          text: >-
            The sailors carried all fifty jars and the prince's bag down to the vessel. Before leaving the garden, the captain warned Camaralzaman not to lose a moment. The wind was fair, the cargo was ready, and he meant to sail at once. The prince promised to follow as soon as he had thanked the man who had sheltered him for a year.

            Camaralzaman returned to the cottage to say farewell and thank his friend once more for every act of kindness. But the old man was at his last breath. He barely murmured his final confession of faith before he died. The prince could not leave his body unattended merely to catch a ship. He dug a grave with his own hands, wrapped the gardener carefully, and buried him in the ground he had tended for eighty years. Only after performing those last duties did Camaralzaman lock the gate, carry the key to the garden's owner, and hurry toward the quay.
        - id: ch06-b15
          speaker: narrator
          text: >-
            The ship had sailed after waiting three hours. Camaralzaman despaired at the thought of another year in that hostile country. Worse still, the talisman had gone with the jars, and he feared he would never see it again.

            He rented the garden, hired a boy to help with the work, and filled fifty more jars with the remaining gold and olives, ready for the next ship.
        - id: ch06-b16
          speaker: narrator
          text: >-
            The first ship quickly reached the Ebony Island. From the palace above the harbor, Badoura saw its bright flags and learned that it carried the yearly cargo from the Island of the Idolaters. Always searching for news of her husband, she went down with several officers and questioned the captain about his country, voyage, passengers, and goods.

            He listed fine cloth, muslin, jewels, musk, amber, spices, medicines, olives, and many other wares.
        - id: ch06-b17
          speaker: badoura
          text: >-
            I will buy every olive on your ship. Unload them now, and we will agree on the price. Tell the other merchants to show me their finest goods before offering them elsewhere.
        - id: ch06-b18
          speaker: captain
          text: >-
            Sire, I have fifty large jars of olives. They belong to a merchant who was left behind. We waited, but he delayed so long that I had to sail without him.
        - id: ch06-b19
          speaker: badoura
          text: >-
            Unload them anyway. We will settle the price.
        - id: ch06-b20
          speaker: narrator
          text: >-
            The jars came ashore, and Badoura asked their value.
        - id: ch06-b21
          speaker: captain
          text: >-
            The merchant is very poor. A thousand silver pieces would be a generous price.
        - id: ch06-b22
          speaker: badoura
          text: >-
            Then I will give you a thousand gold pieces for him. Make sure he receives them.
        - id: ch06-b23
          speaker: narrator
          text: >-
            The jars were carried to the palace. That evening Badoura visited Haiatelnefous and opened one so they could taste the olives. Gold dust coated every olive she poured into the dish. Astonished, she opened the other jars and found gold in them all.

            Then she discovered her talisman. The shock was so great that she fainted. Haiatelnefous and the attendants revived her. Badoura covered the stone with kisses, dismissed everyone except her friend, and explained.
        - id: ch06-b24
          speaker: badoura
          text: >-
            You have guessed why this moved me so deeply. This talisman caused my separation from my dear husband. Now I am certain it will bring us together again.
          emotion: happy
        - id: ch06-b25
          speaker: narrator
          text: >-
            At dawn she summoned the captain and questioned him closely about the owner of the jars. He described the garden and explained how the young merchant had missed the ship.
        - id: ch06-b26
          speaker: badoura
          text: >-
            Then sail back at once and bring him here. He owes me a debt. If you return without him, I will confiscate all your merchandise. Until you bring me that man, every warehouse holding your cargo will remain under the royal seal. Go now and obey.
        - id: ch06-b27
          speaker: narrator
          text: >-
            The captain had no choice. He provisioned the ship and sailed that evening. After a rapid voyage, he anchored outside the hostile harbor. Under darkness, he and six strong sailors rowed ashore near the garden.

            Camaralzaman lay awake mourning the events that had separated him from Badoura. Hearing a knock, he opened the gate. The sailors seized him without explanation, carried him to their boat, and immediately returned to the ship. As soon as they boarded, the vessel sailed.
        - id: ch06-b28
          speaker: camaralzaman
          text: >-
            Captain, I recognize you. Why have you kidnapped me?
        - id: ch06-b29
          speaker: captain
          text: >-
            Are you not in debt to the King of the Ebony Island?
        - id: ch06-b30
          speaker: camaralzaman
          text: >-
            I have never heard of that king, and I have never set foot in his country!
        - id: ch06-b31
          speaker: captain
          text: >-
            You must know more about it than I do. You will meet him soon. Until then, be patient and accept where you are.
    - id: ch07
      title: The King Revealed
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The return voyage went smoothly. Though the ship reached the Ebony Island at night, the captain immediately took Camaralzaman to the palace.

            Badoura recognized her husband despite his worn clothes. She longed to embrace him but decided that both of them would be safer if she kept her disguise a little longer. She ordered an officer to care for him well. Then she removed the seals from the captain's warehouses, gave him a valuable diamond, and let him keep the thousand gold pieces paid for the olives.
        - id: ch07-b02
          speaker: narrator
          text: >-
            In private, Badoura told Haiatelnefous everything and asked for help with her plan. Her friend readily agreed.

            The next morning Camaralzaman was taken to the baths, dressed like an emir or provincial governor, and presented to the council. His noble appearance drew every eye. Badoura was delighted to see him looking like himself again.
        - id: ch07-b03
          speaker: badoura
          text: >-
            My lords, this is your new colleague, Camaralzaman. I knew him during my travels, and I assure you that he deserves both your respect and your admiration.
        - id: ch07-b04
          speaker: narrator
          text: >-
            Camaralzaman was baffled. He had never seen this king before, yet the ruler claimed to know him. He accepted the praise modestly and bowed to the ground.
        - id: ch07-b05
          speaker: camaralzaman
          text: >-
            Sire, words cannot express my gratitude for this great honor. I can only promise to do everything in my power to prove worthy of it.
        - id: ch07-b06
          speaker: narrator
          text: >-
            When the council ended, officers escorted Camaralzaman to a magnificent house prepared especially for him. A complete household of servants waited there, and the stables were filled with fine horses placed at his command. As he entered his study, the steward presented him with a heavy chest of gold for his daily expenses. Each new favor made his sudden good fortune more mysterious. He searched his memory for some explanation, but never guessed that the Princess of China was the hidden cause of it all.

            A few days later, Badoura promoted him again and made him grand treasurer of the kingdom. Camaralzaman carried out every duty with such honesty, wisdom, and generosity that the ministers trusted him and the people praised him. With wealth, honor, and useful work, he might have considered himself the happiest man alive. Yet he never stopped mourning the wife from whom he had been torn. Nor did the new king's name reveal anything. Out of respect for the old ruler, Badoura had taken the name Armanos and was commonly called King Armanos the Younger. Few people remembered the different name used by the traveler who had first arrived. Camaralzaman therefore stood near his wife day after day without the smallest clue to her identity.
        - id: ch07-b07
          speaker: narrator
          text: >-
            At last Badoura decided that their suspense had lasted long enough. After arranging matters with Haiatelnefous, she summoned Camaralzaman to her private rooms that evening to advise her on important business. Once the attendants withdrew, she took the talisman from a box and handed it to him.
        - id: ch07-b08
          speaker: badoura
          text: >-
            An astrologer gave me this talisman not long ago. You are a learned man. Can you tell me what it is used for?
        - id: ch07-b09
          speaker: camaralzaman
          text: >-
            Sire, this talisman has brought me nothing but sorrow. It caused my separation from the person I love most in all the world. The story is so strange and sad that I believe it would move you, if you allow me to tell it.
          emotion: sad
        - id: ch07-b10
          speaker: badoura
          text: >-
            I will hear the story another time. For now, I think this object is not entirely unknown to me. Wait here. I will return soon.
        - id: ch07-b11
          speaker: narrator
          text: >-
            She went into another room, changed from the king's clothes into a woman's dress, fastened the same girdle she had worn when they parted, and came back.

            Camaralzaman recognized her instantly. He embraced her with all his tenderness.
        - id: ch07-b12
          speaker: camaralzaman
          text: >-
            How can I ever thank the king for giving me this wonderful surprise?
          emotion: happy
        - id: ch07-b13
          speaker: badoura
          text: >-
            You will never see that king again, because I was the king. Sit beside me, and I will explain everything.
          emotion: happy
        - id: ch07-b14
          speaker: narrator
          text: >-
            With tears of joy in her eyes, she told him every adventure since their separation. She spoke especially of Haiatelnefous, her kindness, and the loyal help she had given. Then Camaralzaman told his own story. They talked through most of the night.

            In the morning Badoura remained in woman's clothes and sent the chief eunuch to invite King Armanos to her rooms. The old king arrived and found an unknown woman with the grand treasurer, who had no right to be in the private apartment. Astonished, he sat down and asked for the young king.
        - id: ch07-b15
          speaker: badoura
          text: >-
            Sire, yesterday I was the king. Today I am only the Princess of China and the wife of the true Prince Camaralzaman, son of King Schahzaman. When you hear our story, I hope you will forgive the innocent deception that circumstances forced upon me.
        - id: ch07-b16
          speaker: narrator
          text: >-
            Armanos listened in growing wonder. When Badoura finished, she made one more request.
        - id: ch07-b17
          speaker: badoura
          text: >-
            Sire, our faith allows a man more than one wife. Please give your daughter, Princess Haiatelnefous, in marriage to Camaralzaman. I gladly yield to her the place and title of first queen, because I owe her more gratitude than I can express.
        - id: ch07-b18
          speaker: narrator
          text: >-
            Armanos regarded her with surprise and admiration, then turned to the prince.
        - id: ch07-b19
          speaker: armanos
          text: >-
            My son, Princess Badoura, whom I believed to be my son-in-law, willingly shares your hand and affection with my daughter. Will you accept this marriage? And will you accept the crown that Badoura deserves to wear for life, but chooses to give up because she loves you?
        - id: ch07-b20
          speaker: camaralzaman
          text: >-
            Sire, I can refuse you nothing.
        - id: ch07-b21
          speaker: narrator
          text: >-
            Camaralzaman was proclaimed king and married Princess Haiatelnefous with great ceremony. He soon found every reason to admire her beauty, intelligence, and affection.

            The two queens lived together in true sisterly harmony. In time, each gave King Camaralzaman a son, and the whole kingdom celebrated the births with the greatest joy.
