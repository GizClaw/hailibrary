  chapters:
    - id: ch01
      title: The Marvel at the New Year Feast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Feast of the New Year was the oldest and grandest festival in Persia. All day in Schiraz, the king had taken part in the magnificent shows his people had prepared to honor it. The sun was setting, and he was just about to dismiss the court, when an Indian suddenly appeared before his throne. The man bowed to the ground. Beside him stood a richly harnessed horse, made so perfectly that it looked alive in every way.
        - id: ch01-b02
          speaker: indian
          text: >-
            Sire, forgive me for coming so late. But I can promise that none of the wonders you have seen today can compare with this horse. Your Highness has only to look at it.
        - id: ch01-b03
          speaker: king_of_persia
          text: >-
            I see nothing but a clever copy of a real horse. Any skillful craftsman might make one.
        - id: ch01-b04
          speaker: indian
          text: >-
            Its outward shape is not the wonder, Sire. I have only to mount it and choose the place where I wish to go. No matter how far away that place may be, I will find myself there within moments. That is what makes this horse so marvelous. If Your Highness permits it, I will prove its power myself.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The king loved anything strange or rare, and he had never heard of a horse with such a gift. He ordered the Indian to mount it and show the court what it could do. In an instant, the man sprang into the saddle and asked where the king wished to send him.
        - id: ch01-b06
          speaker: king_of_persia
          text: >-
            See that great mountain three leagues from Schiraz? Bring me a leaf from the palm tree at its foot.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The king had hardly finished speaking when the Indian turned a screw in the horse's neck, close beside the saddle. The horse bounded into the air like lightning. In moments, even the sharpest eyes in the court could no longer see it. Then, only a quarter of an hour later, the Indian appeared again with the palm leaf in his hand. He guided the horse down to the foot of the throne, dismounted, and laid the leaf before the king.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Now that the king had seen the horse's astonishing speed, he longed to possess it himself. He was so certain the Indian would gladly sell it that, in his own mind, the horse already belonged to him.
        - id: ch01-b09
          speaker: king_of_persia
          text: >-
            I never guessed from its appearance how precious this horse truly was, and I thank you for showing me my mistake. If you are willing to sell it, name your price.
        - id: ch01-b10
          speaker: indian
          text: >-
            I knew that a wise ruler like Your Highness would value my horse once you understood its power. I also thought you might wish to own it. Much as I treasure it, I will give it up on one condition. I did not make the horse. Its inventor gave it to me in exchange for my only daughter, and she made me swear never to part with it unless I received something of equal value.
        - id: ch01-b11
          speaker: king_of_persia
          text: >-
            Ask for anything. Choose one of my beautiful cities, and you may rule it for life.
        - id: ch01-b12
          speaker: indian
          text: >-
            Your offer is generous, Sire, but I can give up the horse only for your daughter's hand.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The courtiers burst out laughing when they heard that demand. Prince Firouz Schah, the king's heir, burned with anger at the Indian's boldness. The king did not share his anger. He thought it would cost him little to part with his daughter if he could gain such a delightful wonder, and he hesitated before answering.
        - id: ch01-b14
          speaker: firouz_schah
          text: >-
            Father, surely you cannot hesitate over such an insulting bargain. Remember your honor and the blood of our ancestors.
          emotion: angry
        - id: ch01-b15
          speaker: king_of_persia
          text: >-
            My son, you speak nobly. But you do not understand the value of this horse. If I refuse him, the Indian may make the same offer to another king, and I could not bear to know that anyone else owned this Seventh Wonder of the World. I have not said that I will accept his condition. Perhaps he can still be brought to reason. Meanwhile, examine the horse and, if its owner permits it, test its power yourself.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The Indian overheard the king and took his words as a sign that he might yet accept the bargain. He gladly agreed to the test. He came forward to help the prince mount and began explaining how the horse was controlled. But before he could finish, Firouz Schah turned the screw. Horse and rider shot upward and vanished. Everyone waited, expecting the prince to reappear at any moment. Time passed, and still he did not return. At last the Indian grew frightened and threw himself before the throne.
        - id: ch01-b17
          speaker: indian
          text: >-
            Your Highness saw that the prince was too impatient to let me explain how he must return to the place where he began. Please do not punish me for something that was not my fault, whatever misfortune may follow.
          emotion: fearful
        - id: ch01-b18
          speaker: king_of_persia
          text: >-
            Why did you not call him back?
          emotion: angry
        - id: ch01-b19
          speaker: indian
          text: >-
            He moved so quickly that surprise robbed me of my voice. By the time I could call out, he was already beyond hearing. We must hope he notices a second screw and turns it. That will bring the horse back to earth.
        - id: ch01-b20
          speaker: king_of_persia
          text: >-
            What will stop him from falling into the sea or onto the rocks?
          emotion: fearful
        - id: ch01-b21
          speaker: indian
          text: >-
            Have no fear, Your Highness. The horse can pass safely over seas, and it can carry its rider wherever he wishes to go.
        - id: ch01-b22
          speaker: king_of_persia
          text: >-
            If my son is not back, or sends no word within three months, your life will answer for his.
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: >-
            The king ordered the Indian thrown into prison.
    - id: ch02
      title: A Midnight Landing in Bengal
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Meanwhile, Firouz Schah went cheerfully upward. For a whole hour the horse climbed higher and higher, until he could no longer tell the mountains from the plains below. At last he decided it was time to descend. He supposed he only needed to turn the screw the other way, but no matter how hard he tried, it would not move. Then he remembered how impatiently he had flown off without learning how to come back down, and he understood the danger he was in. Even so, he did not lose his head. He carefully searched the horse's neck until, close to its right ear, he found a tiny peg much smaller than the first. He turned it. To his intense joy, the horse began to sink toward the earth, though far more slowly than it had risen.
        - id: ch02-b02
          speaker: narrator
          text: >-
            By then it was dark, and the prince could see nothing beneath him. Uneasy though he was, he had to let the horse choose its own course. Midnight had passed before its feet touched the ground. Firouz Schah was faint and weary after the long ride, and he had eaten nothing since early morning. He dismounted and tried to discover where he was. In the thick darkness, he could just make out the terraced roof of a vast palace, surrounded by a marble railing. In one corner stood a small door. It opened onto a staircase leading down into the palace.
        - id: ch02-b03
          speaker: firouz_schah
          text: >-
            I mean no harm. Whoever owns this place will see that I am unarmed.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Firouz Schah went cautiously down the stairs, afraid of missing a step in the dark. On a landing, he saw an open door and a faintly lighted hall beyond it. He stopped and listened. The only sound was the snoring of men. By the light of a hanging lantern, he saw a row of black guards asleep, each with a bare sword beside him. The hall, he realized, must be the outer room of a queen or princess. He stood still until his eyes grew used to the gloom. Then he noticed a bright light shining behind a curtain in one corner. He crossed the hall softly, drew the curtain aside, and entered a magnificent chamber. Women slept on low couches all around it. One woman alone lay on a sofa. She must be the princess, and she was more beautiful than any woman he had ever seen.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Fascinated as he was, the prince knew how dangerous his position had become. One startled cry would wake the guards and bring him certain death. He quietly sank to his knees beside the sofa, took hold of the princess's sleeve, and lightly drew her arm toward him. Her eyes opened. When she saw a handsome, richly dressed stranger kneeling before her, astonishment left her unable to speak.
        - id: ch02-b06
          speaker: firouz_schah
          text: >-
            Madame, you see before you a prince in distress, the son of the King of Persia. Yesterday I was celebrating our great festival at my father's court. Now, after an adventure so strange you may hardly believe it, I find myself in danger in a country I do not know. I beg for your protection.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The woman was the eldest daughter of the King of Bengal. Her father had built this palace near the capital so that she could spend a few days away from the noise and ceremony of the court. She listened to the prince with kindness.
        - id: ch02-b08
          speaker: princess_of_bengal
          text: >-
            Prince, do not be afraid. The kingdom of Bengal honors hospitality as faithfully as Persia does, and you will be protected here. I am eager to hear the story of your strange adventure, but first you must eat and rest. You need both very badly.
          emotion: calm
        - id: ch02-b09
          speaker: narrator
          text: >-
            The princess ordered her attendants to take Firouz Schah into a lofty room and give him whatever he needed. They prepared a bed and brought a supper fit for his rank. Then they showed him cupboards filled with clothes and left him to sleep. The princess herself could not rest so easily. She had been deeply struck by the prince's face, his manner, and the danger of his arrival. When her women returned, she eagerly asked what they thought of him.
        - id: ch02-b10
          speakers: [attendant_1, attendant_2]
          ensemble: duo
          text: >-
            We cannot tell what impression he made on you, madame. But if your father allowed you to marry so charming a prince, we would call you fortunate. There is no one at the whole court of Bengal who can compare with him.
        - id: ch02-b11
          speaker: princess_of_bengal
          text: >-
            You are both chatterboxes. Go back to bed and let me sleep.
    - id: ch03
      title: Two Hearts and a Journey Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The next morning, the princess took even greater care than usual with her appearance. Her women arranged her hair with diamonds and dressed her in a robe covered with precious stones. When she was ready, she sent an attendant to learn whether the prince was awake. Firouz Schah had already risen. He was leaving his room at that very moment to ask whether the princess would receive him.
        - id: ch03-b02
          speaker: firouz_schah
          text: >-
            Her wish is my law. I am here to obey her.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The princess decided to visit him there. No officer of the court had the right to enter that room, so no one could interrupt them. She seated herself and asked him to explain the adventure that had carried him so far from home. Firouz Schah began with the New Year feast. He told her about the Indian and the enchanted horse, the demand for his sister's hand, and the anger that had made him mount before he knew how to guide it. He described his reckless climb into the sky and the terror of finding that the first screw would not bring him down.
        - id: ch03-b04
          speaker: firouz_schah
          text: >-
            I rose faster than an arrow, until I almost expected to strike my head against the sky. At last I found the second screw and trusted myself to fate. The rest, madame, you already know. Your goodness has made me your grateful servant, and I have nothing left to offer you except my heart. No, even that is not mine to give. It has belonged to you since the first moment I saw you.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The princess blushed, and her confusion made her lovelier still.
        - id: ch03-b06
          speaker: princess_of_bengal
          text: >-
            Your story has given me great pleasure, though I trembled when you spoke of the danger you faced in the sky. I owe much to the chance that brought you here, and you have proved that courage helps those who are bold enough to act. But you must not call yourself my servant. In this palace you are as free as you were in your father's court. And as for your heart, surely a prince like you promised it long ago to some worthy princess. I would never want to make you unfaithful to her.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Firouz Schah was about to assure her that no other princess had any claim on him when an attendant entered to announce dinner. The princess led him into a splendid hall. They sat at a table covered with baskets of fruit while richly dressed young women sang and played stringed instruments. When the meal was over, the princess and the prince withdrew to a room decorated in blue and gold. Its windows looked out over a garden filled with trees and flowers that were strange to him.
        - id: ch03-b08
          speaker: firouz_schah
          text: >-
            Until yesterday, I believed Persia held the finest palaces and gardens in the world. Now I see that every great ruler knows how to surround himself with buildings worthy of his rank. Nothing I have seen here is less splendid than the palace of the King of Persia.
        - id: ch03-b09
          speaker: princess_of_bengal
          text: >-
            You are judging our kingdom by a very modest place. This palace is nothing beside my father's. I hope you will visit him soon and see his true court for yourself.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The princess hoped that her father would admire Firouz Schah and offer him her hand. The prince was no less eager to meet the king, but he explained that a royal son could not present himself at a great court without attendants suited to his rank. She quickly found an answer. Persian merchants lived in the city, and they could appear as his followers. Her treasury was open to him, she said, so he could reward them generously and equip himself as magnificently as he wished.
        - id: ch03-b11
          speaker: firouz_schah
          text: >-
            Your generosity touches me deeply, and I can never thank you enough. But my father must be suffering terribly because of my absence. I would be unworthy of his love if I did not return at once and ease his grief. Then I will come back openly as a prince, with the attendants my rank requires, and ask your father for your hand. The King of Persia has always promised that I may choose my own wife. Once he hears of your kindness and all you have done for me, I know he will share my wish and send an embassy worthy of both our kingdoms.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The princess understood that duty called him home. Still, she feared that absence might cool his love, or that he would see someone else and forget her. She begged him to remain a little longer, and the prince could not refuse her. She filled his days with balls, spectacles, and hunting parties. For two whole months, each day seemed happier than the one before. Yet Firouz Schah never forgot his father's grief. At last he told her that he could delay no longer and must leave the next morning.
        - id: ch03-b13
          speaker: firouz_schah
          text: >-
            You may fear that I am one of those lovers who make promises and forget them as soon as they leave. If I dared to ask it, I would beg you to come with me now, because I can be happy only when you are near me. Persia will receive you with all the honor you deserve. When your father learns what has happened, he cannot refuse our marriage if he truly cares for your happiness. Will you trust me enough to make the journey?
        - id: ch03-b14
          speaker: narrator
          text: >-
            The princess answered only with silence and lowered eyes, but that was enough. Then a new fear came to her. Perhaps the prince still did not truly know how to control the horse. He assured her that he understood both screws now and could direct it wherever he wished. Before dawn the next morning, while the whole palace slept, she met him on the roof. Firouz Schah helped her onto the horse behind him and told her to hold tightly around his belt. Then he turned the screw, and the horse carried them into the air.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Two and a half hours after they left Bengal, the capital of Persia lay below them. Firouz Schah chose not to land in the great square or at his father's palace. Instead, he came down at a country house a short distance from the city. He showed the princess into a beautiful group of rooms and asked her to rest while he told his father of their arrival and prepared a welcome worthy of her rank. Then he ordered a horse and rode into the city. People who had long given up hope of seeing him again shouted for joy all along the streets. At the palace, he found the sultan among his ministers, and everyone wore the deepest mourning. At the sound of his son's voice, the king nearly lost his senses from surprise and delight. Once he could speak calmly again, he begged the prince to tell him all that had happened.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The prince seized the chance and told the whole story. He described the kindness of the Princess of Bengal and did not hide that she had fallen in love with him. He explained that he had given his royal word that his father would consent to their marriage, and that the princess had trusted that promise and returned with him. Now she was waiting anxiously at the country house to learn whether he had promised in vain.
        - id: ch03-b17
          speaker: king_of_persia
          text: >-
            My son, I gladly consent to your marriage. I will go at once to pay my respects to the princess and thank her myself for all she has done for you. Then I will bring her back with me, and we will arrange for your wedding to be celebrated today.
    - id: ch04
      title: The Indian's Revenge
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The king ordered everyone to cast off their mourning clothes. Drums, trumpets, and cymbals were to announce the prince's return throughout the city. Then he commanded that the Indian be taken from prison and brought before him under guard.
        - id: ch04-b02
          speaker: king_of_persia
          text: >-
            I kept you locked away so your life would answer for my son's if he was lost. He has returned. Take your horse and leave my kingdom forever.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Indian left the king's presence quickly. Once outside, he questioned the man who had led him from prison. He learned where the prince had spent those months and heard that the Princess of Bengal was waiting at a country house for the king's consent. At once, revenge entered his mind. He went straight to the country house and told the doorkeeper that the king and prince had sent him to fetch the princess. He was to carry her to the palace on the enchanted horse. The doorkeeper recognized him and knew that he had been imprisoned nearly three months before. Seeing the man free again, he assumed the order must be genuine and led him to the princess. She, too, believed a messenger who claimed to have come from the prince, and she gladly agreed to follow him.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Delighted that his trick had succeeded, the Indian mounted the horse and helped the princess sit behind him. He turned the peg at the very moment when Firouz Schah was leaving the palace for the country house, followed by his father and the whole court. The Indian knew they were coming. To make his revenge quicker and sweeter, he deliberately guided the horse straight over the city. When the King of Persia saw the horse and its riders above him, he stopped in horror and shouted oaths and curses. The Indian remained unmoved because he knew no one could pursue him. Yet the king's fury was nothing beside the prince's grief. Firouz Schah watched the woman he loved being carried away and blamed himself for failing to guard her. Speechless with grief and remorse, he saw her vanish from sight. He would not return to the palace merely to surrender to despair. Both love and courage drove him onward to the country house.
        - id: ch04-b05
          speaker: narrator
          text: >-
            At the country house, the doorkeeper fell at the prince's feet and begged forgiveness.
        - id: ch04-b06
          speaker: firouz_schah
          text: >-
            Rise. This was my fault, not yours. Find me a dervish's robe, but tell no one it is for me.
        - id: ch04-b07
          speaker: narrator
          text: >-
            A convent of dervishes stood near the house, and its leader was a friend of the doorkeeper. With a quick false story, the servant obtained one of their robes. Firouz Schah exchanged his own clothes for the disguise. Beneath it, he hid a box of pearls and diamonds that he had meant to give the princess. At nightfall, he left the house. He had no idea which road to take or where the Indian had carried her, but he was firmly resolved never to return without her.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Meanwhile, the Indian guided the horse toward the kingdom of Cashmere. After several hours, he came down in a wood near the capital, beside a clear stream. Hungry himself, he guessed that the princess must need food as well, so he left her in the shade and went to find some. At first she thought of escaping and hiding in the forest. But she had eaten almost nothing since leaving Bengal, and she was too weak to go far. She had to abandon the attempt. When the Indian returned with several kinds of food, she ate eagerly and regained some of her courage. Soon she was answering his insults with spirit. His threats finally drove her to her feet, and she called loudly for help. A troop of horsemen heard her cries and rode toward them. Their leader was the Sultan of Cashmere, returning from the hunt.
        - id: ch04-b09
          speaker: sultan_of_cashmere
          text: >-
            Who are you, and who is this woman?
        - id: ch04-b10
          speaker: indian
          text: >-
            She is my wife. No one has any right to interfere between us.
        - id: ch04-b11
          speaker: princess_of_bengal
          text: >-
            My lord, do not believe this impostor. He is a wicked magician. Today he tore me from the Prince of Persia, the man I am to marry, and carried me here on that enchanted horse.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Tears choked the princess before she could say more. Her beauty and noble manner convinced the sultan that she had told the truth, and he ordered his followers to cut off the Indian's head at once. Yet escape from one danger only brought her into another. The sultan gave her a horse and conducted her to his own palace. There he placed her in a beautiful apartment, chose women to wait on her, and set guards outside. Without giving her time even to thank him, he told her to rest and said she could relate her adventures the following day.
    - id: ch05
      title: The Princess Feigns Madness
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The princess fell asleep believing that once the sultan heard her story, compassion would move him to send her back to Firouz Schah without delay. She would soon learn her mistake. After leaving her the night before, the Sultan of Cashmere had decided that the sun would not set again before she became his wife. At daybreak, drums, trumpets, cymbals, and every joyful instrument announced his intention throughout the city.
        - id: ch05-b02
          speaker: sultan_of_cashmere
          text: >-
            Those trumpets begin our marriage ceremonies. Prepare yourself for the wedding.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The noise woke the princess early, but she never imagined that it had anything to do with her. As soon as she was dressed, the sultan came to ask about her health and told her what the music meant. The unexpected news filled her with such terror that she fainted. Her attendants rushed to help, and even the sultan tried to revive her, but for a long time nothing worked. When her senses slowly returned, she made a desperate choice. Rather than betray the Prince of Persia by agreeing to this marriage, she would pretend to be mad. She began talking nonsense and making strange gestures. The sultan watched with sorrow and surprise, then left her to her women with orders to care for her closely. As the day passed, her supposed illness grew worse, and by night it seemed almost violent.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Days passed before the sultan summoned all the doctors of his court. They told him madness could take too many forms for them to judge her condition without seeing her, so he ordered them into her room one at a time according to rank. The princess had expected this. She knew that even the most ignorant doctor would discover her good health if he felt her pulse. Each time a physician approached, she burst into such a wild fit that he did not dare lay a finger on her. A few men pretended they could diagnose sickness by sight alone. They prescribed potions, and she swallowed them willingly because she was sure the medicines were harmless.
        - id: ch05-b05
          speaker: narrator
          text: >-
            When the court doctors failed, the sultan called in the physicians of the city. They did no better. Next came the most celebrated doctors from other large towns, but the case defeated them too. At last the sultan sent messengers into neighboring states with a full account of the princess's madness. He offered to pay the expenses of every physician who came to examine her and promised a rich reward to the one who cured her. Foreign doctors crowded into Cashmere. Naturally, none succeeded, because the cure depended neither on their learning nor their remedies. It depended only on the princess herself.
        - id: ch05-b06
          speaker: narrator
          text: >-
            All this while, Firouz Schah wandered sadly and almost hopelessly from place to place. At last he reached a great city in India. There he heard people talking about a Princess of Bengal who had lost her senses on the very day she was meant to marry the Sultan of Cashmere. That single report was enough. He took the road to Cashmere at once. At the first inn where he lodged in the capital, he asked for every detail. Once he knew that he had finally found the princess he had searched for so long, he began planning how to rescue her.
    - id: ch06
      title: The Physician's Secret
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Firouz Schah first obtained a doctor's robe. Together with the long beard he had allowed to grow during his travels, it made him look unmistakably like a physician. He lost no time in going to the palace. There he gained an audience with the chief usher. He apologized for daring to think he could cure the princess after so many others had failed, but declared that he knew the secret of certain remedies whose effects had never failed.
        - id: ch06-b02
          speaker: chief_usher
          text: >-
            You are heartily welcome here. The sultan will be glad to receive you, and if you succeed, you will earn a magnificent reward.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The disguised prince was brought before the sultan, who wasted no time on ceremony. He warned that the mere sight of a doctor threw the princess into a violent rage. Then he led Firouz Schah to a room beneath the roof. A hidden opening there allowed him to observe the princess without being seen. Firouz Schah looked through it and found her reclining on a sofa with tears in her eyes. She was softly singing about the cruel fate that had separated her, perhaps forever, from the person she loved most.
        - id: ch06-b04
          speaker: narrator
          text: >-
            The prince's heart beat fast as he listened. He needed no further proof that her madness was a trick and that love for him had driven her to it. He quietly left the hiding place and returned to the sultan. Certain signs, he said, had shown him that her illness could be cured. But he would have to see her and speak to her alone. The sultan raised no objection and ordered that the physician be taken into her apartment.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The moment the princess saw the physician's robe, she sprang from her seat in a fury and poured insults upon him. Firouz Schah paid no attention. He moved close enough that no one else could hear and spoke in a low whisper.
        - id: ch06-b06
          speaker: firouz_schah
          text: >-
            Look at me, Princess. I am no doctor. I am the Prince of Persia, and I have come to free you.
        - id: ch06-b07
          speaker: narrator
          text: >-
            At the sound of his voice, the Princess of Bengal suddenly grew calm. Joy spread across her face, the kind of joy that comes when the thing we desire most, and expect least, suddenly happens. For a while she was too overcome to speak. Firouz Schah used that silence to tell her everything. He spoke of his despair when the Indian carried her away before his eyes, the oath he had made to follow her across the world, and his happiness at finding her at last in Cashmere. Then he asked how she had come there, so that he could devise a way to rescue her. It took only a few words for the princess to explain the whole danger. After the Indian abducted her, the sultan had killed him and taken her to the palace. Then, without even asking her consent, he had tried to force her into marriage. She had pretended madness to escape him. If necessary, she had resolved to die rather than break faith with the prince she loved.
        - id: ch06-b08
          speaker: firouz_schah
          text: >-
            Do you know what became of the enchanted horse after the Indian died?
        - id: ch06-b09
          speaker: princess_of_bengal
          text: >-
            I have heard nothing, but after I told the sultan of its value, I cannot believe he forgot it.
        - id: ch06-b10
          speaker: narrator
          text: >-
            Firouz Schah agreed that the sultan was unlikely to have forgotten such a marvelous object. Together they shaped a plan that would let her escape and return with him to Persia. As the first step, she was to dress with care and receive the sultan politely when he visited the next morning. The report of the physician's success delighted the sultan. His opinion rose higher still when the princess's behavior the next day convinced him that her cure was near. He told her how happy he was to see such improvement, urged her to trust so clever a doctor completely, and withdrew without waiting for an answer.
        - id: ch06-b11
          speaker: narrator
          text: >-
            The false physician left the room at the same time. With a show of humility, he asked how the Princess of Bengal had reached Cashmere, so far from her father's kingdom and apparently alone. The sultan thought the question natural. He repeated the story the princess had told and added that he had placed the enchanted horse in his treasury as a curiosity. No one there knew how it worked.
        - id: ch06-b12
          speaker: firouz_schah
          text: >-
            Sire, your story has given me the final clue to the princess's recovery. During her journey on the enchanted horse, some part of its magic must have passed into her. Only certain perfumes whose secret I possess can drive it away. If Your Highness wishes to give the court and the people a spectacle they will never forget, have the horse brought into the great square outside the palace. Leave everything else to me. Before the whole crowd, you will see the princess restored in both mind and body within moments. To make the spectacle still more impressive, have her dressed in the crown's richest clothes and finest jewels.
        - id: ch06-b13
          speaker: narrator
          text: >-
            The sultan readily agreed to every part of the proposal and gave orders for the following morning.
    - id: ch07
      title: The Flight from Cashmere
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The next morning, the enchanted horse was taken from the treasury and brought into the great square of the palace. Word spread quickly through the city that something extraordinary was about to happen. Such a crowd gathered that guards had to keep order and clear a path for the horse. When all was ready, the sultan appeared and took his place on a platform surrounded by the chief nobles and officers of his court. Then the Princess of Bengal came slowly from the palace. She wore magnificent clothes and the finest jewels of the crown, and the ladies assigned to her walked beside her. With their help, she mounted the enchanted horse, set her feet in the stirrups, and took the bridle in her hands.
        - id: ch07-b02
          speaker: narrator
          text: >-
            The physician placed large braziers filled with burning coals all around the horse. Into each one he threw a perfume made from many delicious scents. Then he crossed his hands over his chest, lowered his eyes, and walked around the horse three times while murmuring mysterious words. Thick smoke rose from the braziers. Soon it almost completely hid both the horse and the princess from the crowd.
        - id: ch07-b03
          speaker: narrator
          text: >-
            This was the moment Firouz Schah had been waiting for. Hidden by the smoke, he sprang lightly onto the horse behind the princess. He leaned forward, found the peg, and turned it. In an instant the enchanted horse shot into the sky.
        - id: ch07-b04
          speaker: firouz_schah
          text: >-
            Sultan of Cashmere, the next time you wish to marry a princess who has come to you for protection, learn to gain her consent first!
        - id: ch07-b05
          speaker: narrator
          text: >-
            That was how the Prince of Persia rescued the Princess of Bengal. Together they flew back to Persia, and this time the enchanted horse came down directly before the king's own palace. Their marriage was delayed only long enough to prepare a ceremony as brilliant as possible.
        - id: ch07-b06
          speaker: narrator
          text: >-
            When the rejoicing was over, an ambassador was sent to the King of Bengal. He told the king everything that had happened and asked him to approve both the marriage and the alliance between their two kingdoms. The King of Bengal gave his approval gladly.
