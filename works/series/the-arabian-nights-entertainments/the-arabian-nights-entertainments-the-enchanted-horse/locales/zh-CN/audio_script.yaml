audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    persian_king:
      display_name: 波斯国王
      tts:
        delivery: 威严直率，喜怒鲜明
        timbre: 洪亮厚实
        pace: 从容，激动时加快
        pitch: 中低音
    indian:
      display_name: 印度人
      tts:
        delivery: 精明自负，恭敬中藏着算计
        timbre: 干涩清楚
        pace: 平稳
        pitch: 中音
    prince:
      display_name: 菲鲁兹·沙王子
      tts:
        delivery: 勇敢热诚，言谈坦率而有王室教养
        timbre: 清朗坚定
        pace: 明快，郑重时放缓
        pitch: 中音
    bengal_princess:
      display_name: 孟加拉公主
      tts:
        delivery: 聪慧温柔，危急时坚决不屈
        timbre: 柔美清亮
        pace: 从容，激动时稍快
        pitch: 中高音
    maid_1:
      display_name: 侍女甲
      tts:
        delivery: 伶俐亲昵，说笑自然
        timbre: 明亮轻柔
        pace: 轻快
        pitch: 中高音
    maid_2:
      display_name: 侍女乙
      tts:
        delivery: 伶俐亲昵，说笑自然
        timbre: 柔和清脆
        pace: 轻快
        pitch: 中高音
    maid_3:
      display_name: 侍女丙
      tts:
        delivery: 伶俐亲昵，说笑自然
        timbre: 清亮活泼
        pace: 轻快
        pitch: 高音
    porter:
      display_name: 行宫门房
      tts:
        delivery: 忠厚谨慎，犯错后惶恐自责
        timbre: 朴实低沉
        pace: 平稳
        pitch: 中低音
    kashmir_sultan:
      display_name: 克什米尔苏丹
      tts:
        delivery: 自信专断，表面殷勤
        timbre: 饱满威严
        pace: 从容
        pitch: 中低音
    chamberlain:
      display_name: 礼宾长
      tts:
        delivery: 恭谨圆熟，答话利落
        timbre: 清晰沉稳
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 新年节上的魔马
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            波斯王国的新年节，是全国最古老、最盛大的节日。这一天，国王在设拉子看了一整天的庆典表演。太阳快落山时，他正要让群臣退下，一个印度人忽然牵着一匹装饰华美的马来到御座前。那匹马看上去和真马一模一样。
        - id: ch01-b02
          speaker: indian
          text: 陛下，请原谅我来得这样晚。不过，今天所有的奇观都比不上这匹马。请您务必看一看。
        - id: ch01-b03
          speaker: persian_king
          text: 我只看出它做得很像真马。手艺高明的工匠都能造出这样的东西。
        - id: ch01-b04
          speaker: indian
          text: 陛下，它真正神奇的不是模样，而是本领。我骑上去以后，只要想着一个地方，不管多远，片刻便能赶到。您若准许，我现在就证明给您看。
        - id: ch01-b05
          speaker: narrator
          text: 国王最喜欢稀奇事物，从没见过这样的马，便命他当场展示。印度人跳上马背，问国王要他去哪里。
        - id: ch01-b06
          speaker: persian_king
          text: 看见三里格外那座高山了吗？去摘一片山脚下的棕榈叶给我。
        - id: ch01-b07
          speaker: narrator
          text: |-
            印度人转动马颈靠近鞍座的一枚旋钮，木马像闪电一样腾空而起，转眼便消失了。一刻钟后，他拿着棕榈叶飞回来，落在御座前，把叶子献给国王。

            见识过木马的速度，国王立刻想把它据为己有，甚至已经在心里把马当成了自己的。
        - id: ch01-b08
          speaker: persian_king
          text: 我刚才只看外表，实在低估了它。多谢你让我知道它的价值。只要肯卖，你尽管开价。
        - id: ch01-b09
          speaker: indian
          text: |-
            陛下一向睿智，自然懂得欣赏它。我也料到，您也许会想留下这件珍宝。只要答应一个条件，我愿意奉上。

            这匹马不是我造的。造马的人拿它换走了我唯一的女儿。女儿又要我起誓，除非换到价值相等的东西，否则绝不能把马给别人。
        - id: ch01-b10
          speaker: persian_king
          text: 你想要什么，只管说！我的王国有那么多名城，随你挑一座。从此以后，你可以在那里终身为王。
        - id: ch01-b11
          speaker: indian
          text: 多谢陛下厚赐。若我直说所求，还请您别怪罪。这匹马只能用来换一桩婚事。我要娶公主殿下。
        - id: ch01-b12
          speaker: narrator
          text: |-
            群臣一听，全都大笑起来。王储菲鲁兹·沙更被印度人的狂妄激怒。可国王觉得，用一个女儿换这样好玩的宝物，并不算太大的代价。他正在犹豫，王子开了口。
        - id: ch01-b13
          speaker: prince
          text: 父王，他提出这样无礼的交易，您怎么还能犹豫？请您想想自己的尊严，也想想祖先的高贵血统。
          emotion: angry
        - id: ch01-b14
          speaker: persian_king
          text: |-
            我儿，你的话听来堂堂正正，可你不懂这匹马的价值。我要是回绝他，他只会把同样的条件开给另一位君王。这世上的第七大奇观若落到别人手里，我一定痛苦极了。

            我还没说会答应他，也许能劝他改变心意。眼下你先仔细看看这匹马。主人若同意，你也亲自试试它的本领。
        - id: ch01-b15
          speaker: narrator
          text: |-
            印度人以为国王已经有意答应，高高兴兴地扶王子上马。他正要讲解驾驭的方法，性急的王子已经转动旋钮，眨眼间消失在天边。

            众人等了许久，不断望向远方。王子始终没有回来，印度人终于害怕了，伏倒在御座前。
        - id: ch01-b16
          speaker: indian
          text: 陛下，您也看见了。王子没等我说完怎样回来，就自己飞走了。这不是我的过错。无论出了什么不幸，都求您不要怪罪我。
          emotion: fearful
        - id: ch01-b17
          speaker: persian_king
          text: 既然如此，你看见他飞走时为什么不喊住他？
          emotion: angry
        - id: ch01-b18
          speaker: indian
          text: 他飞得太快，我当时惊得说不出话。等我回过神，他已经听不见了。现在只能盼王子找到另一枚旋钮。转动那一枚，马就会下降。
          emotion: fearful
        - id: ch01-b19
          speaker: persian_king
          text: 就算找到了又怎样？木马若落进大海，或把他摔死在岩石上，谁能拦得住？
        - id: ch01-b20
          speaker: indian
          text: 陛下不用担心。它能飞过海洋，也能把骑手带到他想去的地方。
        - id: ch01-b21
          speaker: persian_king
          text: 那就用你的脑袋担保！三个月之内，他若不能平安回来，至少也该送来消息。不然，你就拿命抵偿。
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: 国王随即命侍卫抓住印度人，把他投入监牢。
    - id: ch02
      title: 午夜降临的王子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            这时，菲鲁兹·沙正在高空中兴奋地飞翔。他不停上升了一个时辰，直到再也分不清山和平原，才想降落。他以为把旋钮反着转就行，不料那枚旋钮一动不动。

            王子又惊又怕，这才想起自己根本没听完返回地面的方法。他强迫自己镇定下来，仔细检查马颈，终于在右耳旁找到一枚更小的栓钮。他欣喜若狂，转动栓钮，木马果然开始下降，只是速度比升空时慢得多。
        - id: ch02-b02
          speaker: narrator
          text: |-
            天已经黑了，王子什么也看不见，只能不安地任木马选择方向。午夜过后，他终于落在一座巨大宫殿的露台屋顶上。飞了这么久，他又累又饿，从清早起还一口东西也没吃。

            他摸黑看了看四周。露台围着大理石栏杆，一角的小门后有楼梯通向宫中。
        - id: ch02-b03
          speaker: prince
          text: 我没有恶意。不管这里的主人是谁，看见我手无寸铁，总不会伤害我吧。
        - id: ch02-b04
          speaker: narrator
          text: |-
            王子怕踩空，慢慢走下楼梯。在一处平台上，他看见一扇门敞开着，里面是一座灯光昏暗的厅堂。他先停下来听，只听见男人们的鼾声。借着屋顶悬挂的灯笼，他看见一排黑人侍卫睡得正熟，每个人身边都放着出鞘的利剑。他明白，这里一定是某位王后或公主寝殿外的前厅。

            等眼睛适应了昏暗，他发现角落的帷幕后透着亮光，便轻轻走过去。帷幔后是一间富丽堂皇的寝殿，许多女子睡在低矮卧榻上，只有一个人独睡在长榻上。王子一看就知道，那人必定是公主。
        - id: ch02-b05
          speaker: narrator
          text: |-
            他走到床边，发现她比自己见过的任何女子都美丽。可他也知道，只要公主叫一声，侍卫便会惊醒，他必死无疑。

            王子跪下来，轻轻捏住公主的衣袖，把她的手臂拉向自己。公主睁开眼，看见一个衣着华贵、容貌俊美的男子跪在面前，惊得说不出话。
        - id: ch02-b06
          speaker: prince
          text: |-
            公主，站在您面前的是一个落难的王子，我是波斯国王的儿子。一场难以置信的奇遇把我带到这里，我只能求您庇护。

            昨天我还在父王的宫廷里庆祝我国最庄严的节日，今天却到了陌生的国土，连性命也悬在一线。
        - id: ch02-b07
          speaker: narrator
          text: 这位公主是孟加拉国王的长女。她正在离都城不远的行宫休养。她和善地听完王子的话。
        - id: ch02-b08
          speaker: bengal_princess
          text: |-
            王子，请别担心。孟加拉和波斯一样懂得好客和仁慈。无论您遇见谁，都会得到保护，我可以向您保证。

            我很想知道，您怎么会在这样短的时间里来到这里。不过您一定饿坏了。我先叫侍女带您去客房，给您准备晚餐，让您好好休息。
          emotion: calm
        - id: ch02-b09
          speaker: narrator
          text: |-
            侍女们已经醒来。公主示意后，她们匆匆穿好衣服，举着蜡烛，把王子带到一间宽敞的房间。两人替他铺床，其余人去厨房取来菜肴，又让他看过装满衣物的橱柜，才退出去。

            公主想起王子的容貌，再也睡不着。侍女回来后，她急切地问王子是否什么都不缺，又问她们觉得他怎样。
        - id: ch02-b10
          speakers: [maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 殿下，我们不知道他在您心里是什么模样。不过依我们看，国王若准许您嫁给这样可爱的人，真是您的福气。孟加拉宫廷里，没有谁比得上他。
        - id: ch02-b11
          speaker: bengal_princess
          text: 你们几个真是多嘴。快回床上，让我睡觉。
        - id: ch02-b12
          speaker: narrator
          text: |-
            第二天一早，公主对衣饰格外挑剔，头发拆了又梳，足足梳了两三遍。她心想，昨夜那副模样都没让王子厌烦，今天若让他看见自己全部的美貌，他一定更会动心。

            她把最大的钻石插在发间，又戴好宝石项链、手镯和腰带，披上只有王室成员才能穿的名贵长袍。装扮满意后，她派人去问王子是否醒了，能否让她亲自来见。
        - id: ch02-b13
          speaker: prince
          text: 公主的心愿就是我的命令。我来到这里，自然听从她的安排。
        - id: ch02-b14
          speaker: narrator
          text: 不久，公主来到客房。两人见礼后，她在长榻上坐下。
        - id: ch02-b15
          speaker: bengal_princess
          text: |-
            若在我的寝宫见您，宦官长随时可能进来，我们很容易被打扰。这里却是他不能踏入的地方。

            我太想知道了，到底发生了什么不可思议的事，才把您送到我身边？请从头讲吧。
        - id: ch02-b16
          speaker: narrator
          text: 王子便从波斯每年的纳鲁兹节讲起，又说到节日上的种种奇观。听见魔马，公主惊叹自己连一半这样神奇的事都想象不出。王子继续说了下去。
        - id: ch02-b17
          speaker: prince
          text: |-
            父王酷爱稀奇事物，一见木马就想得到，立刻问印度人要多少钱。可那人的回答荒唐极了。他要的竟是我妹妹的婚姻。

            满朝都在嘲笑他，我也气得发狂。父王却拿不定主意，不肯立刻回绝，只叫我去看看木马。我明白，他是想让我也知道那匹马有多珍贵。

            为了让父王高兴，我骑上木马，没等印度人教完，就照着先前见过的方法转动栓钮。一眨眼，我便冲上高空，比箭还快，仿佛头马上要撞到天顶。脚下什么也看不见，我甚至不知道自己正飞向哪里。

            天色渐暗时，我总算找到另一枚旋钮。木马慢慢下降，我只能听凭命运安排。午夜以后，它落在这座宫殿的屋顶。我沿楼梯下来，溜过熟睡的守卫，走到您门外的帷幔前。后来的事，公主都知道了。

            现在，我只想感谢您的仁慈。照各国的礼法，我已经是您的奴仆，除了自己的心，再没什么能献给您。可我怎么还能说那颗心属于自己呢？从第一眼见到您起，它就已经属于您了。
        - id: ch02-b18
          speaker: narrator
          text: 王子的神情让公主明白，她的美貌已经打动了他。她脸上泛起红晕，过了好一会儿才从慌乱中恢复。
        - id: ch02-b19
          speaker: bengal_princess
          text: |-
            王子，您的故事让我听得入迷。您明明安然坐在这里，我听到您飞在高空，还是忍不住发抖。那场意外把您送到我的家中，我真该感谢它。不管您走进哪所房子，也不会得到比这里更热诚的欢迎。

            您说自己是奴仆，当然只是玩笑。在这里，您和在父王宫中一样自由。至于您的心，我猜它早已许给一位配得上它的公主了。我可不愿让您辜负她。
        - id: ch02-b20
          speaker: narrator
          text: 王子正要说明从没有女子先得到他的心，一名侍女进来禀报午宴已经备好。这次打断，两个人其实都不觉得遗憾。
        - id: ch02-b21
          speaker: narrator
          text: |-
            午宴摆在一间华美的厅堂里，桌上满是鲜美的水果。席间，一群衣着艳丽的少女伴着弦乐，唱起轻柔甜美的歌。用餐以后，王子和公主来到一间蓝金相间的小厅。窗外是一座花园，开满鲜花，还长着许多杨梅树，和波斯的园林大不相同。
        - id: ch02-b22
          speaker: prince
          text: 从前我一直以为，没有哪个王国的宫殿和花园胜得过波斯。今天亲眼看见这里，我才懂得，只要有一位伟大的君王，自然会有配得上他的建筑。
        - id: ch02-b23
          speaker: bengal_princess
          text: 我没见过波斯的宫殿，实在没法比较。不过这座行宫和父王的宫殿相比，只能算很简陋。希望您不久就去拜见他。到时候，您一定会赞同我的话。
        - id: ch02-b24
          speaker: narrator
          text: |-
            公主盼着王子去见父王。她相信，国王只要看见这个年轻人不凡的气度和优雅的举止，一定会深受打动，主动把女儿嫁给他。可王子听懂暗示后，给出的回答并不完全合她心意。
        - id: ch02-b25
          speaker: prince
          text: |-
            若能拜见孟加拉国王，我既能满足好奇，也能向他表达敬意。不过，要去见这样伟大的君主，我绝不能没有配得上身份的随从。否则，他只会把我看成来历不明的冒险之徒。
        - id: ch02-b26
          speaker: bengal_princess
          text: 若只缺随从，这里有许多波斯商人，您想要多少人都能找到。钱财也不用担心，我的宝库永远向您敞开。
        - id: ch02-b27
          speaker: narrator
          text: 王子猜到公主为何这样慷慨，十分感动。可越来越深的爱意，并没有让他忘记责任。
        - id: ch02-b28
          speaker: prince
          text: |-
            公主，您的盛情让我不知怎样感谢。若不是想到父王此刻一定在为我忧心，我会立刻接受。父王给了我无尽的慈爱，我若不尽快回到他身边，就不配做他的儿子。我在这里享受欢乐时，他也许正以为再也见不到我。多耽搁一刻，都可能酿成大错。

            等我尽过儿子的责任，就会数着每一刻，盼您准许我回来。那时我不再像个流浪者，而会以王子的身份拜见孟加拉国王，求他把您的手赐给我。父王一向准我自己选择妻子。只要听过您的慷慨，他一定会把我的愿望当成自己的愿望。
        - id: ch02-b29
          speaker: narrator
          text: |-
            公主通情达理，接受了他的解释。可一听说他马上要走，仍旧万分不安，生怕王子一旦远去，自己留在他心里的印象也跟着淡去。她先赞同王子急着探望父亲，又求他至少多留一两天。

            王子出于礼貌，很难拒绝。公主把每天的消遣安排得巧妙极了，舞会、表演和狩猎一场接着一场，两个月竟不知不觉过去。只要没有危险，公主最喜爱的就是打猎。最后，王子终于郑重告诉她，自己再不能这样荒废责任。他求公主别再阻拦，也答应很快带着配得上两人身份的一切荣耀回来。
        - id: ch02-b30
          speaker: prince
          text: |-
            公主，也许您把我当成那种虚情假意的人，以为一分开，我的誓言就会改变。若真是这样，您就错怪我了。

            如果不会冒犯您，我想求您和我一起走。只有和您共度一生，我才能幸福。波斯宫廷一定会按照您的美德来欢迎您。至于孟加拉国王，若他不答应我们的婚事，那他对您的幸福，就远没有您说的那么关心。
        - id: ch02-b31
          speaker: narrator
          text: |-
            公主没有回答，只垂下双眼。她的沉默已经说明，她愿意随王子远行。

            她只担心一件事。王子还不完全懂得怎样驾驭木马，两人会不会再次陷入先前那种险境？王子耐心宽慰她，终于打消了她的恐惧。从此，公主一心秘密安排出逃，绝不能让宫中任何人起疑。
        - id: ch02-b32
          speaker: narrator
          text: |-
            第二天清早，整座宫殿还在沉睡，公主悄悄登上屋顶。王子已把木马的头朝向波斯。他先骑上马，再扶公主坐在身后。等她坐稳，双手紧紧抱住他的腰带，王子便转动旋钮。木马飞快离开地面。

            木马仍以惯常的速度飞驰，王子已经能把它驾驭得十分稳当。仅仅两个半小时后，波斯都城已经横在脚下。他没有降落在原先的广场，也没有直入王宫，而是选了城外不远的一座行宫。他把公主带到一套美丽的房间，请她在这里休息。自己则先去禀报父王，再筹备一场配得上她身份的公开欢迎仪式。随后，他命人备马，赶向城中。
    - id: ch03
      title: 归来与劫持
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            王子一路穿过街道，百姓们欢声雷动地迎接他。大家早已不抱希望，谁也没想到还能看到他回来。到了王宫，他发现父王身边围着群臣，人人都穿着最深的丧服。国王只听见儿子的声音，就惊喜得几乎失去理智。等心情稍稍平复，他立刻恳求王子讲述这段奇遇。

            王子正好抓住这个机会，把孟加拉公主怎样款待自己的经过全说了出来，连她爱上自己的事实也没有隐瞒。最后，他把最要紧的事告诉父王。
        - id: ch03-b02
          speaker: prince
          text: 父王，我以王室的名誉向她保证，您不会反对我们的婚事，她才肯和我同乘木马回来。我把她安顿在城外的行宫。她正在那里焦急等候，想知道我有没有说一句空话。
        - id: ch03-b03
          speaker: narrator
          text: 王子说着便要跪在父王脚下。国王扶住他，再次把他抱进怀里。
        - id: ch03-b04
          speaker: persian_king
          text: 我儿，我当然同意你迎娶孟加拉公主。我还要亲自去向她致意，感谢她给你的种种恩惠。随后我会接她入宫，今天就为你们举行婚礼。
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: |-
            国王随即下令，所有百姓立刻脱去丧服，让鼓、号角和铙钹一同奏响。他要亲自接公主进宫，还要在当天举行婚礼。接着，他又命人把印度人放出监牢，押到自己面前。
        - id: ch03-b06
          speaker: persian_king
          text: 我把你关起来，是怕我儿一去不返，要你拿命抵偿。如今他已经回来了。带上你的马，永远滚出我的国土！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: |-
            命令很快执行。印度人在侍卫包围下被押来，又匆匆离开王宫。他向释放自己的狱卒打听王子这些日子去了哪里，又做了什么。狱卒把整件事全告诉了他，还说孟加拉公主正在城外行宫，等国王答应婚事。

            想起自己受过的囚禁，印度人立刻生出复仇的计策。他径直来到行宫，对门房说，国王和王子派他接公主，要用魔马送她入宫。
        - id: ch03-b08
          speaker: narrator
          text: 门房认得印度人，也知道三个月前国王把他关进监牢。如今见他已经获释，便相信他说的都是真的，毫不为难地带他去见公主。公主听说他奉王子之命而来，也高高兴兴答应了。
        - id: ch03-b09
          speaker: narrator
          text: |-
            印度人见诡计成功，欢喜极了。他骑上木马，扶公主坐到身后，随即转动栓钮。就在这时，王子正离开王宫赶往行宫，国王和满朝群臣跟在后面。

            印度人明知他们正在路上，反而故意驾着木马从城市正上方飞过。他觉得自己无辜入狱，如今就要让这场报复来得更快，也更痛快。
        - id: ch03-b10
          speaker: narrator
          text: |-
            波斯国王看见木马上的两个人，惊骇得猛然停步，破口咒骂。印度人听得一清二楚，却毫不在意，因为没有人追得上他。

            国王又羞又怒，可他的痛苦远不及王子。王子眼看深爱的人被飞快带走，又因为没有好好保护她而悲痛悔恨，一时连话也说不出。转眼之间，公主便消失在视野里。他该怎么办？跟父王回宫，让绝望在那里吞没自己吗？他的爱情和勇气都不允许。
        - id: ch03-b11
          speaker: narrator
          text: |-
            王子绝不肯跟父王回宫，让绝望吞没自己。他仍旧继续赶到行宫。门房一见他，立刻明白自己闯下多大的祸，扑倒在主人脚边，恳求王子饶恕。
        - id: ch03-b12
          speaker: prince
          text: 起来吧。造成这场灾祸的是我，不是你。替我找一身苦行僧的衣服来，千万别说是我要的。
        - id: ch03-b13
          speaker: narrator
          text: |-
            行宫附近有一座苦行僧修院，院长谢赫正是门房的朋友。门房临时编了个谎话，很容易便弄来一套衣服。王子立刻脱下原来的装束，换上苦行僧的衣服，又把一盒本来打算送给公主的珍珠和钻石藏在身上。

            夜色降临后，他离开行宫。虽然不知道该往哪里去，他却已经下定决心，找不回公主，绝不归来。
    - id: ch04
      title: 克什米尔的假疯病
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            与此同时，印度人改变了木马的方向。几小时后，他们飞进克什米尔都城附近的一片树林。他腹中饥饿，也猜想公主需要进食，便让木马落回地面，把她独自留在一道清澈溪流岸边的树荫下，自己去找食物。

            起初，公主发现只剩自己一人，也想过逃走躲藏。可自从离开孟加拉，她几乎没有吃过东西，虚弱得走不了多远，只好放弃。印度人带回各色食物，她狼吞虎咽地吃下，很快恢复了足够的勇气，开始有力地回击他的无礼言语。印度人的威胁反而把她激怒，她猛地站起来，高声呼救。
        - id: ch04-b02
          speaker: narrator
          text: |-
            幸好，一队骑兵听见呼喊，立刻策马赶来查问出了什么事。领队的正是打猎归来的克什米尔苏丹。他马上转向印度人，问他是谁，身旁的女子又是什么人。
        - id: ch04-b03
          speaker: indian
          text: 她是我的妻子。我们夫妻之间的事，旁人无权干涉。
        - id: ch04-b04
          speaker: bengal_princess
          text: 大人，无论您是谁，千万别信这个骗子！他是个可恶的魔法师。今天，他把我从未婚夫波斯王子身边掳走，又用这匹魔马把我带到这里。
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: |-
            公主还想再说，泪水却堵住了喉咙。她并不知道救自己的人身份尊贵。苏丹见她美貌非凡，气度高贵，相信她说的是真话，便命随从斩下印度人的首级。命令立刻执行了。

            公主刚逃过一场危险，却像是落入了另一场。苏丹给她一匹马，亲自带她回宫，安顿在华美的房间里，又挑选女奴服侍、宦官守卫。公主还没来得及感谢相救之恩，苏丹便让她先安心休息，说明天再听她讲述经历。
        - id: ch04-b06
          speaker: narrator
          text: |-
            公主睡去时还满怀信心，以为只要说出自己的故事，苏丹就会心生怜悯，立刻送她回到王子身边。仅仅几小时后，她便知道自己错了。

            前一晚，苏丹离开她的房间时已经决定，下一次日落前一定要娶她。天刚亮，城中各处便响起鼓、号角、铙钹和各种振奋人心的乐器，宣告他的意愿。公主一大早被声音吵醒，却一刻也没想到这件事会和自己有关。
        - id: ch04-b07
          speaker: narrator
          text: |-
            等公主梳妆完毕，苏丹立刻前来问候她的身体，又告诉她，耳中听见的号角正是隆重婚礼的一部分，请她准备成婚。这个消息来得太突然，公主当场吓得昏死过去。

            侍候她的女奴纷纷赶来救护，苏丹也亲自竭力唤醒她，可很久都没有效果。公主终于渐渐恢复神智。她宁愿装疯，也不肯答应婚事，背弃波斯王子。于是她开始胡言乱语，做出各种怪异举动。
        - id: ch04-b08
          speaker: narrator
          text: |-
            苏丹站在旁边，又伤心又惊讶。他等了许久，公主的病始终不见减轻，只好把她交给女奴，命她们仔细照料。可随着天色一天天变晚，她的疯病像是越来越重，到了夜里几乎变得狂暴。

            这样的日子接连过去。克什米尔苏丹终于召集宫中所有御医，要他们一起会诊公主这场可悲的疯病。御医们回答，疯病分许多种，不亲眼看见公主，根本无法作出判断。苏丹只好下令，按照品级高低，让他们一个个进入公主寝宫。
        - id: ch04-b09
          speaker: narrator
          text: |-
            公主早料到会有这一步。她十分清楚，只要御医摸到脉搏，哪怕最无知的人也会发现她身体完全健康，疯病只是伪装。所以每当一名御医走近，她就突然猛烈发作，吓得谁也不敢用一根手指碰她。

            少数御医自称自己的本领胜过旁人，只用眼睛也能诊断病情，便为她开了药水。公主深信这些药都没有害处，毫不为难地一一喝下。
        - id: ch04-b10
          speaker: narrator
          text: |-
            克什米尔苏丹眼看宫中御医治不好公主，又召来城里的医生，他们同样束手无策。接着，他求助于其他大城最负盛名的医生，结果还是一样，病情仍旧超出他们的医术。

            最后，苏丹派使者前往邻近各国，带着一份详述公主疯病症状的文书。他宣布，凡是愿意亲自来诊治的医生，路费全由他承担。若有人能治好公主，还会得到丰厚的奖赏。告示传出，许多外国名医纷纷赶到克什米尔。可治愈与否既不取决于他们，也不取决于医术，只取决于公主自己，他们自然不会比先前的人更成功。
        - id: ch04-b11
          speaker: narrator
          text: |-
            就在这段日子里，菲鲁兹·沙悲伤而绝望地四处漂泊，终于来到印度的一座大城。他听见许多人都在议论孟加拉公主，说她本来要嫁给克什米尔苏丹，却在婚礼当天突然发疯。

            只凭这些消息，王子便立即动身赶往克什米尔。他一到都城，就在落脚的第一家客店仔细打听事情的始末。终于确定自己找到了失散已久的公主，他立刻开始筹划营救的办法。
        - id: ch04-b12
          speaker: narrator
          text: |-
            王子先找来一件医生的长袍。旅途中蓄起的长胡须配上这身衣服，任何人看上一眼，都会认定他是医生。他没有浪费片刻，径直前往王宫求见礼宾长。

            见到对方后，他先为自己的冒昧道歉，说那么多名医都已经失败，自己竟还敢妄想治好公主。接着又宣称，他掌握几种秘药，从来没有失效过。
        - id: ch04-b13
          speaker: chamberlain
          text: 您来得正好，苏丹一定会欣然接见。若真能治好公主，您也会得到极丰厚的赏赐。
        - id: ch04-b14
          speaker: narrator
          text: |-
            乔装成医生的波斯王子被带到苏丹面前。苏丹没有浪费时间多谈，只提醒他公主只要看见医生便会勃然大怒，随即领他登上一间屋顶下的小室。墙上有个孔洞，可以暗中观察公主，又不会被她发现。

            王子从孔中望去，看见公主斜倚在长榻上，眼中含着泪，正低声唱着一首哀歌。她悲叹命运残酷，夺走了自己深深爱着的人，也许今生再也不能相见。
        - id: ch04-b15
          speaker: narrator
          text: |-
            年轻的王子听着，心跳不已。他再也不需要别的证据，便明白公主的疯病是假。正是对他的爱情，逼得她使出这条计策。

            王子悄悄离开藏身处，回到苏丹面前。他说，从某些迹象看来，公主并非无药可救，但自己必须单独见她，与她交谈。苏丹毫不为难地答应，命人把他带进公主寝宫。
    - id: ch05
      title: 烟雾中的脱身
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 公主一看见医生的长袍，便怒气冲冲地跳起来，对他百般辱骂。王子不理会她的举动，只走到近前，用只有她能听见的声音低声开口。
        - id: ch05-b02
          speaker: prince
          text: 公主，请仔细看看我。我不是医生，我是来救您脱身的波斯王子。
        - id: ch05-b03
          speaker: narrator
          text: |-
            公主一听见他的声音，立刻安静下来。喜悦铺满她的脸。只有一个人最渴望、也最不敢期待的愿望突然成真时，才会有这样的神情。她完全沉浸在惊喜里，许久说不出话。

            王子便讲起分别后的事。他怎样眼看她消失，怎样陷入绝望，又怎样发誓走遍天下也要追寻她，直到终于在克什米尔王宫找到她，心中又是怎样狂喜。随后，他请公主也说出自己怎样来到这里，好让他想出办法，把她从苏丹的暴虐中救走。
        - id: ch05-b04
          speaker: narrator
          text: 公主只说了几句，王子便明白了全部处境。苏丹甚至没有礼貌地问她是否同意，就要强娶她。为了躲避这桩婚事，她只好装成疯女。若真的没有别的办法，她宁愿死，也不会受人逼迫，嫁入这样的婚姻，背弃所爱的王子。
        - id: ch05-b05
          speaker: prince
          text: 印度人死后，那匹魔马去了哪里？
        - id: ch05-b06
          speaker: bengal_princess
          text: 我从没听到过它的消息。不过，我已经告诉苏丹，那匹马有多么珍贵。他应该不会把它忘掉。
        - id: ch05-b07
          speaker: narrator
          text: |-
            王子也赞同她的判断。两人一起商量怎样让公主逃走，跟他返回波斯。作为计划的第一步，公主要精心梳妆。第二天早晨苏丹来访时，她还要改变先前的态度，礼貌地接待他。

            苏丹听说这次诊治有了结果，欣喜若狂。第二天，公主精心梳妆，对他的态度果然大为不同。这让苏丹相信，她离彻底痊愈已经不远，也叫他更加佩服这位医生的本领。
        - id: ch05-b08
          speaker: kashmir_sultan
          text: 看见您好了这么多，我实在高兴。请继续接受这位高明医生的诊治，也要全心信任他。
        - id: ch05-b09
          speaker: narrator
          text: 苏丹只告诉公主，看见她康复许多，自己是多么欢喜，又劝她好好接受这位高明医生的诊治。说完，他不等公主回答便退出房间。王子也跟着出来，恭敬地请求苏丹容他问一句。孟加拉离克什米尔这样遥远，公主究竟怎样独自来到这里？
        - id: ch05-b10
          speaker: narrator
          text: |-
            苏丹觉得这个问题十分自然，就把孟加拉公主讲过的经历原样复述一遍。他还补充说，自己虽然完全不懂怎样使用魔马，但它实在奇异罕见，所以没有丢弃，已经命人收入宝库。
        - id: ch05-b11
          speaker: prince
          text: |-
            陛下的话给了我最重要的线索。现在，我能彻底治好公主了。她乘魔马来到这里时，马身上一部分魔力不知怎么转到了她身上。只有几种秘制香料的烟，才能把它赶走。

            若陛下准许，也愿意让朝廷和百姓看到前所未有的奇观，请把木马搬到宫外的大广场，其余的事交给我。只需片刻，所有人都会看见公主恢复从前的健康。为了让这场奇观更壮丽，也请让她盛装出席，戴上王室最珍贵的珠宝。
        - id: ch05-b12
          speaker: narrator
          text: |-
            苏丹爽快地答应了王子的全部提议。第二天清早，他命人从宝库取出魔马，搬到王宫外的大广场。城里很快传开消息，说那里会发生一件非同寻常的事。

            聚集的人越来越多，侍卫只好出动维持秩序，并为魔马留出一条道路。一切准备妥当后，苏丹现身，在宫廷最高贵的显臣和将官簇拥下登上高台。
        - id: ch05-b13
          speaker: narrator
          text: |-
            众人坐定，只见盛装的孟加拉公主在苏丹派给她的女官陪同下走出王宫，缓缓来到魔马旁。女官扶她骑上马背。她在鞍上坐稳，双脚踏入马镫，手中握好缰绳。

            医生在木马四周摆下几只装满炽炭的大火盆，每一盆都撒入由各种芬芳香料配成的熏香。接着，他双手交叠在胸前，垂着眼睛绕马走了三圈，口中念念有词。
        - id: ch05-b14
          speaker: narrator
          text: |-
            火盆很快腾起浓烟，几乎把木马和公主完全遮住。王子等的正是这一刻。他轻盈地跳到公主身后，俯身转动栓钮。木马猛然冲上天空，王子向下面高声喊去，叫在场的每个人都听得见。
        - id: ch05-b15
          speaker: prince
          text: 克什米尔苏丹，以后若想迎娶前来求你庇护的公主，先学会取得她本人的同意！
        - id: ch05-b16
          speaker: narrator
          text: |-
            菲鲁兹·沙就这样救出孟加拉公主，和她一起回到波斯。这一次，他们直接降落在国王的宫殿前。

            婚礼只为筹备一场尽可能辉煌的仪式，稍稍推迟了一些。庆典结束后，波斯便派使臣前往孟加拉，把全部经过禀告国王，也请求他赞同两国结亲。

            孟加拉国王欣然答应了。
