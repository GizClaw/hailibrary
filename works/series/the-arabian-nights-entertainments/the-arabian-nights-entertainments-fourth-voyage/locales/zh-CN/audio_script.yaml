audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    pepper_picker_1:
      display_name: 采胡椒人甲
      tts:
        delivery: 直率警觉，问话时带着惊讶
        timbre: 清亮朴实
        pace: 适中
        pitch: 中音
    pepper_picker_2:
      display_name: 采胡椒人乙
      tts:
        delivery: 爽朗坦率，语气自然
        timbre: 明朗结实
        pace: 适中
        pitch: 中音
    pepper_picker_3:
      display_name: 采胡椒人丙
      tts:
        delivery: 沉稳质朴，反应真切
        timbre: 温厚清晰
        pace: 稍缓
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严从容，把本国习俗视为理所当然
        timbre: 饱满沉稳
        pace: 舒缓
        pitch: 中低音
    neighbor:
      display_name: 邻居
      tts:
        delivery: 悲恸认命，言语诚恳而克制
        timbre: 低沉疲惫
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 海难与逃亡
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            第三次航行以后，我有钱又快活，可还是不能安安稳稳地留在家中。我喜欢做生意，也舍不得那些新奇陌生的见闻。于是，我料理好家事，先把大批货物运到沿途各处，等着我去经营，然后动身游历波斯的几个省份。

            我在一处遥远的海港登船。开头一切顺利，后来却遇上猛烈的飓风。那位可敬的船长想尽办法，仍救不了船。大船彻底撞毁，许多同行者都葬身海浪。我和少数几个人抱着沉船碎片，被风浪冲到一座岛上。大家爬到海水够不着的地方，已经筋疲力尽，只能倒下来等天亮。

            第二天一早，我们朝岛内走，不久就看见几间棚屋。大群肤色黝黑的居民从屋里涌出，把我们团团围住。他们将我们带回去，像分东西一样各自领走。我和另外五个人被关进一间棚屋，按在地上坐着。那些人拿出一种草叶，比画着叫我们吃。

            我发现他们自己根本不碰，便只装作尝了尝。可同伴们饿坏了，一口气把面前的草叶吃光。没过多久，他们竟全都发了疯，只管不停地胡言乱语。我听不懂他们的话，我开口叫他们，他们也毫无反应。

            那些野蛮人又端来几大碗椰油煮的米饭。发疯的同伴抢着吃，我只尝了几粒。我已经看明白了，抓我们的人想尽快把大家养肥，再吃进肚里。事情果真如此。同伴失去了理智，既不担忧，也不害怕，给什么就拼命吃什么。他们很快胖了起来，随后便送了命。

            我吃得很少，又日日害怕自己将来的命运，身体越来越瘦，连吃下去的那一点东西也养不住我。正因为我瘦得不值得入口，他们反倒准我随意走动。一天，其他人全都外出，只留一个老人看守我。我趁机逃开，一头扎进森林。老人越喊我回来，我就跑得越快，终于把他远远甩掉。
    - id: ch02
      title: 胡椒之国
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            我接连走了七天，只有天黑以后才停下歇息，沿途全靠椰子解渴充饥。第八天，我走到海边，看见一群肤色较浅的人正在采胡椒，附近到处都是胡椒树。看见他们安安分分地做着活计，我稍稍放了心，便朝他们走去。

            他们用阿拉伯语向我问好，又问我是谁，从哪里来。听到熟悉的语言，我别提多高兴了，立刻把海难和被抓的经过告诉他们。
        - id: ch02-b02
          speakers: [pepper_picker_1, pepper_picker_2, pepper_picker_3]
          ensemble: chorus
          text: 那些野人是会吃人的！你怎么可能逃出来？
        - id: ch02-b03
          speaker: sindbad
          text: |-
            我把刚才讲给你们的事又说了一遍，他们听得十分震惊。我一直等到众人采够胡椒，才跟他们回国。他们引我去见国王，国王殷勤地接待我。我又讲了一次自己的遭遇，国王也很惊讶。他听完便吩咐人给我衣服和食物，还要大家好好待我。

            这座岛人口众多，物产也十分丰饶。都城里商旅云集，我很快便住得自在又称心。国王格外宠信我，宫廷上下和城中百姓也都想让我过得愉快。

            不过，我发现一件怪事。岛上所有男人，不管身份高低，骑马都不用缰绳和马镫。一天，我壮着胆子问国王为什么不用这些东西。
        - id: ch02-b04
          speaker: king
          text: 你说的是什么东西？我从来没听说过。
        - id: ch02-b05
          speaker: sindbad
          text: |-
            这句话让我有了主意。我找到一位手艺高明的工匠，请他照我的指点削出马鞍底架。我垫上软料，蒙好精选的皮革，再用华美的金线刺绣装饰。接着，我画出样式，请锁匠打了一副马嚼子和一双马刺。

            东西全部做好后，我把它们献给国王，又教他怎么使用。我替他的一匹马套好鞍辔。国王骑上去兜了几圈，对这件新鲜东西喜欢极了，便送给我许多贵重礼物。后来，王宫里的高官纷纷找我制作马鞍，也都送来厚礼。我很快富裕起来，还成了城中颇有地位的人物。

            有一天，国王召我进宫。
        - id: ch02-b06
          speaker: king
          text: |-
            辛巴达，我有件事要请你答应。我和臣民都很看重你，希望你在这里住上一辈子。我会替你找一位富有又美貌的女子成婚。以后，就别再惦记自己的故乡了。
        - id: ch02-b07
          speaker: sindbad
          text: |-
            国王的话就是法律，我只能迎娶他挑选的可爱新娘。婚后我们过得很幸福，可我始终想着，只要机会一到，就逃回巴格达。
    - id: ch03
      title: 活人与死者
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            日子正过得顺遂，我的一位邻居却遭逢不幸。他和我已经成了好朋友，他的妻子忽然病倒，不久便去世了。我上门安慰，只见他悲痛欲绝。我便对他说：“愿上天保佑你，赐你长寿！”
        - id: ch03-b02
          speaker: neighbor
          text: 我只剩一个钟头可活了。你现在祝我长寿，还有什么用呢？
          emotion: sad
        - id: ch03-b03
          speaker: sindbad
          text: 别这样说，事情怎么会坏到这个地步？我还盼着你平安无事，再陪我许多年呢。
        - id: ch03-b04
          speaker: neighbor
          text: |-
            愿你长寿，可我的一生已经结束了。家里的事情我全安排好了，今天就要和妻子一起下葬。

            这座岛从远古就有这样的法律。妻子死了，活着的丈夫要陪她入墓。丈夫死了，活着的妻子也要跟他进去。祖先这样做，我们也只能这样做。法律不会改变，谁都得服从。
          emotion: sad
        - id: ch03-b05
          speaker: sindbad
          text: |-
            他说着话，夫妻俩的亲朋好友已经聚了过来。死去的妻子身穿华服，满身珠宝闪闪发亮，被放在一副没有盖子的棺架上。送葬队伍朝远处的一座高山进发。我的邻居从头到脚裹着黑斗篷，悲悲戚戚地跟在后面。

            到了埋葬的地方，死者连同棺架一起被放进一个深坑。丈夫向朋友们一一告别，躺到另一副棺架上，身旁放着七个小面包和一罐水。他也被放了下去，一直降到那座恐怖洞穴的最深处。随后，众人用巨石封住洞口，满怀哀伤地回城去了。

            你们想想，我看见这种事，怎么可能无动于衷？其他人从小见惯了，我却惊骇极了，忍不住进宫告诉国王，这件事在我看来有多么可怕。

            我说：“陛下，贵国把活人和死人一同埋葬，这种风俗实在叫我震惊。我走过那么多地方，从未见过如此残酷、如此可怕的法律。”
        - id: ch03-b06
          speaker: king
          text: |-
            辛巴达，你要我怎么办？这是人人都必须遵守的法律。要是王后先去世，连我也得陪她下葬。
        - id: ch03-b07
          speaker: sindbad
          text: 陛下，请恕我冒昧。连来到这里的外乡人，也必须遵守这条法律吗？
        - id: ch03-b08
          speaker: king
          text: |-
            当然。外乡人只要娶了本国女子，就不能例外。
        - id: ch03-b09
          speaker: sindbad
          text: |-
            国王说这话时还在微笑，我只觉得那笑容冷酷极了。我垂头丧气地回到家里，从此再没有一天安心。妻子哪怕小指头疼一下，我也以为她要死了。

            没想到，过了不久，她真的病倒，几天后便咽了气。我惊慌万分，只觉得活埋比落到食人族手里还可怕，可我根本逃不掉。妻子的遗体穿上最华贵的衣裳，佩满所有珠宝，放在棺架上。我走在后面，身后跟着长长的送葬队伍，由国王和全体贵族领头。就这样，我们来到那座要命的高山。它是临海群山中的一座。
    - id: ch04
      title: 黑暗墓窟
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            到了山上，我最后一次苦苦哀求国王和周围的人，希望他们发发慈悲，在最后一刻放我一条生路。可没有人理会我。大家似乎只想赶紧完成这件可怕的事。

            很快，我便被放进阴森的深坑，身旁只有七个面包和一罐水。我还没落到底，头顶的巨石就滚回原处，把我独自留在那里等死。

            一线微光从石缝中漏进来。我鼓起勇气四处看看，才发现这里是一座巨大的墓窟，满地都是白骨和死尸。我甚至仿佛听见了垂死者的叹息。他们也和我一样，被活着送进了这片凄惨的地方。

            我又愤怒又绝望，放声嘶喊，责怪自己贪恋财富和冒险，才落到这样的地步。可喊叫毫无用处。渐渐平静下来以后，我拿起食物和水，用斗篷裹住脸，摸索着走向洞穴深处，因为那里的空气稍微清新一些。

            我在黑暗和苦难中熬着，直到面包和水全部耗尽。正当我快要饿死时，头顶的巨石被移开了。一副棺架正在往下落，上面躺着一个死去的男人，后面还有一个活着的女人。

            我立刻拿定主意。那个女人也只能慢慢饿死，早一点结束她的痛苦，反而是在帮她。她早已吓得不省人事。等她落到洞底，我握着一根粗大的骨头，一下将她打死，夺下她带来的面包和水，自己又有了活下去的希望。

            后来，我又几次使用这种绝望的办法。我也不知道被困了多久。有一天，附近忽然传来粗重的呼吸。我转头一看，昏暗中有个影子。我刚一动，那东西便逃了，从墙壁的一条裂缝里挤出去。

            我拼命追上去，发现岩石间有一道狭窄的缝隙，勉强容得一个人挤过。我顺着石缝一直爬，仿佛爬了许多英里。最后，前方出现一点微光。光越来越亮，我终于从海岸边钻了出来。那一刻的喜悦，我根本说不出来。

            等我确信自己不是在做梦，才明白那大概是一只从海边钻进墓窟的小动物。它受惊逃走，无意中替我指出了一条生路。若不是它，我永远也找不到这里。我匆匆察看周围，发现群山隔绝了这片海岸，城里的人绝不可能追来。
    - id: ch05
      title: 珠宝与归航
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: |-
            群山陡峭地直落海中，中间没有路可以穿过。我确认安全以后，又回到墓窟，收集散落在地上的钻石、红宝石、祖母绿和各色珠宝。我把这些宝物扎成一包包，存放在海滩上的安全处，然后满怀希望地等待船只。

            我一连守望两天，连一片船帆也没看见。后来，终于有一条船从离岸不远的地方经过。我欣喜极了，一面高声呼喊，一面挥舞双臂，总算引起船员的注意。他们派了一只小艇来接我。

            水手问我为什么会独自待在这里。我告诉他们，我乘的船两天前遇难了，自己好不容易爬上岸，还把那些货包救了出来。幸好他们相信了，连周围都没有察看，便搬起货包，将我送回大船。

            船长正忙着应付航行的难处，没有工夫细问我的来历。不过，他还是热情地收留了我，连我拿来抵作船费的珠宝也不肯接受。

            此后的航程一帆风顺。我们经过许多地方，每到一处，我都收购大批珍贵货物。最后，我终于又回到巴格达，带回各种闻所未闻的财富。我拿出许多钱周济穷人，也向城中所有的清真寺慷慨捐赠。接下来，我把日子都留给亲友，每天同他们宴饮欢聚。
        - id: ch05-b02
          speaker: narrator
          text: |-
            辛巴达说到这里，停了下来。所有听众都说，第四次航行的奇遇，比先前听过的任何故事都更叫人喜欢。随后，众人纷纷告辞。脚夫欣巴达又得到一百枚金币，也和大家一同离去。辛巴达请他们第二天再来，听第五次航行的故事。

            到了约定的时刻，众人再次聚齐。大家吃过席上的佳肴，喝过美酒，辛巴达便开始讲述下一段经历。
