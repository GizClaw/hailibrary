  chapters:
    - id: ch01
      title: Shipwreck and Escape
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            After my third voyage, I was rich and happy. Still, I could not bring myself to remain at home forever. I loved trade, and anything new or strange drew me onward. So I put my affairs in order and sent stores of goods ahead to the places I meant to visit across the Persian provinces.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            I travelled to a distant seaport and took ship. All went well for some time. Then a violent hurricane caught us. Our worthy captain did everything he could, but the vessel was completely wrecked, and many of our company drowned. A few of us clung to pieces of wreckage and were washed toward an island. We struggled beyond the waves, dropped from exhaustion, and waited there for morning.
        - id: ch01-b03
          speaker: sindbad
          text: >-
            At daylight, we wandered inland until we saw some huts. As we approached, great numbers of the island's Black inhabitants rushed out and surrounded us. They led us to their homes and divided us among our captors. Five other men and I were taken into one hut and made to sit on the ground.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            Our captors gave us certain herbs and motioned for us to eat. I noticed that they did not touch the herbs themselves, so I only pretended to taste mine. My companions were starving and quickly ate everything before them. Soon, to my horror, they had all gone mad. They chattered without stopping, but I could not understand them, and they paid no attention when I spoke.
        - id: ch01-b05
          speaker: sindbad
          text: >-
            Then our captors brought large bowls of rice cooked with coconut oil. My crazed companions devoured it. I ate only a few grains, because I understood that the men meant to fatten us for their own table. And that was exactly what happened. My companions had lost both reason and fear. They greedily ate whatever they were given, grew fat, and soon met their end.
        - id: ch01-b06
          speaker: sindbad
          text: >-
            I ate so little that fear and hunger made me thinner every day. Since I looked nothing like a tempting meal, they let me wander freely. One day, everyone left on an expedition except an old man who stayed to guard me. I slipped away from him and ran into the forest.
        - id: ch01-b07
          speaker: old_guard
          text: >-
            Come back! Come back here!
        - id: ch01-b08
          speaker: sindbad
          text: >-
            His shouting only made me run faster. Before long, I had left him far behind.
        - id: ch01-b09
          speaker: sindbad
          text: >-
            I hurried onward for seven days and stopped only when darkness forced me to rest. I lived mostly on coconuts, which gave me both food and drink. On the eighth day, I reached the shore. There I saw a party of men gathering the pepper that grew thickly all around them. Their peaceful work reassured me, so I went toward them.
        - id: ch01-b10
          speaker: pepper_gatherer_1
          text: >-
            Who are you, and where have you come from?
        - id: ch01-b11
          speaker: sindbad
          text: >-
            They had spoken in Arabic. I was overjoyed to hear familiar words, and I told them about the shipwreck and my capture.
        - id: ch01-b12
          speakers: [pepper_gatherer_1, pepper_gatherer_2]
          ensemble: duo
          text: >-
            But those people eat human beings! How did you ever get away?
        - id: ch01-b13
          speaker: sindbad
          text: >-
            I told them the whole story I have just told you, and they could hardly believe it. I stayed with them until they had gathered all the pepper they wanted from the plants around us. Then they took me back to their own country and presented me to their king.
        - id: ch01-b14
          speaker: sindbad
          text: >-
            The king welcomed me kindly, and I had to tell my adventures once more. He was greatly surprised. When I finished, he ordered that I be given clothes and food and treated with every consideration.
    - id: ch02
      title: A New Life in the King's City
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: >-
            The island was crowded with people and rich in all sorts of desirable things. A great deal of trade passed through the capital, and I soon felt comfortable and contented there. The king showed me special favour. Because of that, everyone at court and throughout the city tried to make my life pleasant.
        - id: ch02-b02
          speaker: sindbad
          text: >-
            One custom seemed very strange to me. Every man, from the greatest lord to the poorest citizen, rode without a bridle or stirrups. One day, I dared to ask the king why he did not use them.
        - id: ch02-b03
          speaker: king
          text: >-
            These things you speak of are entirely unknown to me.
        - id: ch02-b04
          speaker: sindbad
          text: >-
            His answer gave me an idea. I found a skilful workman and showed him how to cut the wooden base of a saddle. I padded it, covered it in fine leather, and decorated it with rich gold embroidery. Then a locksmith made a bit and a pair of spurs from patterns I drew.
        - id: ch02-b05
          speaker: sindbad
          text: >-
            When everything was ready, I presented it to the king and showed him how each piece worked. I placed the saddle and bridle upon one of his horses. He mounted and rode about, completely delighted by this new way of riding. To show his gratitude, he rewarded me with splendid gifts. After that, I had to make saddles for all the chief officers of his household. Each officer gave me rich presents in return, and I soon became both wealthy and important in the city.
        - id: ch02-b06
          speaker: sindbad
          text: >-
            Then one day, the king sent for me.
        - id: ch02-b07
          speaker: king
          text: >-
            Sindbad, I want to ask a favour of you. My people and I think highly of you, and we want you to spend the rest of your life among us. I will choose a rich and beautiful lady for you to marry. Put your own country out of your mind and make your home here.
        - id: ch02-b08
          speaker: sindbad
          text: >-
            The king's wish was law, so I accepted the charming bride he chose for me. We lived happily together. Even so, I meant to escape at the first opportunity and return to Bagdad.
    - id: ch03
      title: The Law of the Island
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: >-
            While I was prospering, the wife of a neighbour who had become my good friend fell ill and died. I went to his house to comfort him and found him overwhelmed with grief.
        - id: ch03-b02
          speaker: sindbad
          text: >-
            May Heaven protect you and grant you a long life.
        - id: ch03-b03
          speaker: neighbor
          text: >-
            Alas, what good can those words do? I have only one hour left to live.
          emotion: sad
        - id: ch03-b04
          speaker: sindbad
          text: >-
            Come, my friend, matters cannot be that hopeless. I trust you will live for many years yet.
        - id: ch03-b05
          speaker: neighbor
          text: >-
            I hope your own life will be long. Mine is over. I have put my house in order, because today I must be buried with my wife. This has been our island's law since the earliest times. A living husband enters the grave with his dead wife, and a living wife goes with her dead husband. Our fathers obeyed it, and so must we. The law never changes. No one can refuse it.
          emotion: sad
        - id: ch03-b06
          speaker: sindbad
          text: >-
            As he spoke, the couple's friends and relatives began to gather. His wife's body was dressed in rich robes and covered with sparkling jewels. They placed her upon an open bier, and the procession set out for a high mountain some distance beyond the city. My miserable friend walked behind it, wrapped from head to foot in a black mantle and mourning all the way.
        - id: ch03-b07
          speaker: sindbad
          text: >-
            At the burial place, they lowered the dead woman, still on her bier, into a deep pit. Her husband said farewell to his friends and lay down upon a second bier. Beside him they placed seven small loaves of bread and a pitcher of water. Then they lowered him down, down, down into the dreadful cavern. A stone sealed the opening, and the mournful company returned to the city.
        - id: ch03-b08
          speaker: sindbad
          text: >-
            Everyone else had known this custom from childhood, but I was horrified by what I had seen. I could not keep silent. I went to the king and told him exactly what I thought.
        - id: ch03-b09
          speaker: sindbad
          text: >-
            Sire, I can hardly express my astonishment at this custom of burying living people with the dead. In all my travels, I have never found a law so cruel and horrible.
          emotion: surprised
        - id: ch03-b10
          speaker: king
          text: >-
            What else could we do, Sindbad? The law applies to everyone. If the Queen died before me, I would be buried with her myself.
        - id: ch03-b11
          speaker: sindbad
          text: >-
            Your Majesty, may I ask whether the same law applies to foreigners?
        - id: ch03-b12
          speaker: king
          text: >-
            Why, of course. Once foreigners marry in this country, they are no exception.
        - id: ch03-b13
          speaker: sindbad
          text: >-
            He smiled as he answered, though the matter seemed far too heartless for a smile. I went home deeply troubled, and from that day I never felt at ease. If my wife's little finger hurt, I imagined she was dying. Before long, she truly fell ill, and within a few days she was dead.
        - id: ch03-b14
          speaker: sindbad
          text: >-
            I was filled with dismay. Being buried alive seemed even worse than being eaten by cannibals, but there was no escape from the island's law. They dressed my wife's body in her finest robes, covered her with all her jewels, and laid her upon the bier. I followed it through the city. Behind me came a great procession led by the king and all his nobles. In that order, we reached the fatal mountain, one of a high chain that bordered the sea.
    - id: ch04
      title: The Cavern of the Dead
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: >-
            At the mountain, I made one last frantic appeal to the king and all who stood nearby. I hoped they might pity me, even at that final moment. It was useless. No one answered. They seemed eager to finish their dreadful task. Soon I was being lowered into the dark pit, with my seven loaves and pitcher of water beside me.
        - id: ch04-b02
          speaker: sindbad
          text: >-
            Almost before I reached the bottom, they rolled the stone over the opening above my head and abandoned me to my fate. A weak ray of light entered through a crack. When I found the courage to look around, I saw an enormous vault scattered with bones and bodies of the dead. In that gloom, I even thought I heard the dying sighs of others who, like me, had entered that terrible place alive.
        - id: ch04-b03
          speaker: sindbad
          text: >-
            I screamed with rage and despair. I blamed my own love of profit and adventure for bringing me there, but my cries achieved nothing. At last, I grew calmer. I picked up my bread and water, covered my face with my mantle, and felt my way toward the far end of the cavern, where the air seemed fresher.
        - id: ch04-b04
          speaker: sindbad
          text: >-
            I remained there in darkness and misery until all my food and water were gone. I was close to dying of hunger when the rock moved overhead. A bier descended into the cavern, carrying the body of a man. A living woman was lowered after him, already senseless with terror.
        - id: ch04-b05
          speaker: sindbad
          text: >-
            I decided at once what I would do. The woman faced nothing but a slow and lingering death, and I believed that ending her misery quickly would be a service. I stood ready with a great bone in my hands. When she reached the bottom, one blow killed her. I took the seven loaves and the pitcher of water lowered beside her, and those provisions gave me a new hope of staying alive.
        - id: ch04-b06
          speaker: sindbad
          text: >-
            Several times, I was driven to that same desperate act. I cannot say how long I had been imprisoned when, one day, I heard something breathing heavily nearby. I turned and barely made out a shadowy shape. The creature fled from my movement and squeezed through a narrow crack in the wall.
        - id: ch04-b07
          speaker: sindbad
          text: >-
            I chased it as fast as I could. The crack led into a tight passage among the rocks, and there was barely room to force my body through. Still, I followed the creature for what seemed like many miles. At last, a glimmer appeared ahead. It grew brighter with every moment until I came out upon the seashore. I cannot describe the joy I felt there.
        - id: ch04-b08
          speaker: sindbad
          text: >-
            Once I was certain I was not dreaming, I understood what must have happened. Some small animal had entered the cavern from the sea. When I startled it, it ran back the same way and revealed an escape I could never have found alone. I quickly examined the coast and saw that no one from the town could pursue me there.
    - id: ch05
      title: Treasure and Homecoming
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: >-
            The mountains fell steeply into the sea, with no road across them. Once I was certain that the people of the town could not reach me, I returned to the cavern. Diamonds, rubies, emeralds, and every kind of jewel lay scattered over the ground. I gathered a great treasure, packed it into bales, and carried them to a safe place on the beach. Then I settled down to wait hopefully for a passing ship.
        - id: ch05-b02
          speaker: sindbad
          text: >-
            I watched the sea for two full days without seeing a single sail. At last, a ship appeared not far from the coast. I waved my arms and shouted again and again until the crew noticed me, and they sent a boat ashore.
        - id: ch05-b03
          speaker: sailor
          text: >-
            How did you come to be stranded in a place like this?
        - id: ch05-b04
          speaker: sindbad
          text: >-
            I was shipwrecked two days ago. I managed to reach the shore with those bales.
        - id: ch05-b05
          speaker: sindbad
          text: >-
            Luckily, the sailors believed me. They did not even examine the place where they had found me. They simply loaded my bundles and rowed me back to the ship.
        - id: ch05-b06
          speaker: sindbad
          text: >-
            Once I was on board, I saw that the captain was too busy with the dangers of navigation to question me closely. He welcomed me generously and would not accept even one of the jewels I offered as payment for my passage. We had a prosperous voyage. We visited many lands, and in each one I gathered a fine store of valuable merchandise.
        - id: ch05-b07
          speaker: sindbad
          text: >-
            At last, after all those lands and all that trade, I reached Bagdad again. I returned with riches of every kind, greater than anything people had heard of. Once more, I gave large sums of money to the poor and added generously to the wealth of every mosque in the city. After that, I devoted myself to my friends and relations, and passed my time with them in feasting and merriment.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Here Sindbad paused. All his listeners agreed that the adventures of his fourth voyage had pleased them more than anything he had told them before. Then the guests took their leave. Hindbad went with them after receiving another hundred sequins. Sindbad had invited every one of them to return the next day for the story of his fifth voyage.
        - id: ch05-b09
          speaker: narrator
          text: >-
            When the time came, everyone was in place. They ate and drank from all that had been set before them. Then Sindbad began his tale.
