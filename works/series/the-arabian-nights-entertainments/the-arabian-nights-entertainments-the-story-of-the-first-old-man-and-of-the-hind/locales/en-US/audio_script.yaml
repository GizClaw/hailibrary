  chapters:
    - id: ch01
      title: The Story of the First Old Man and of the Hind
      blocks:
        - id: ch01-b01
          speaker: first_old_man
          text: >-
            Now I will begin my story, so please listen closely. This hind beside me is my wife. We had no children, so I adopted the son of a favorite slave and decided that he would be my heir.
        - id: ch01-b02
          speaker: first_old_man
          text: >-
            My wife hated both the mother and the boy, though she hid it from me until it was too late. When my adopted son was about ten, I had to leave on a journey. I placed them both in my wife's care and asked her to look after them while I was away. My journey lasted a full year.
        - id: ch01-b03
          speaker: first_old_man
          text: >-
            During that year, my wife learned magic so she could carry out her wicked plan. Once she knew enough, she took my son to a distant place and turned him into a calf. She gave the calf to my steward and claimed she had bought it. Then she turned his mother into a cow and sent that animal to the steward as well.
        - id: ch01-b04
          speaker: first_old_man
          text: >-
            When I came home, I asked where the slave and the child were.
        - id: ch01-b05
          speaker: wife
          text: >-
            Your slave is dead. As for your son, I haven't seen him for two months, and I don't know where he is.
        - id: ch01-b06
          speaker: first_old_man
          text: >-
            The news of the mother's death filled me with grief. But my son had only disappeared, so I believed I would soon find him. Eight months passed without any word of him. Then the feast of Bairam arrived.
        - id: ch01-b07
          speaker: first_old_man
          text: >-
            For the feast, I ordered my steward to bring me a very fat cow to sacrifice. He brought the poor slave who had been changed into a cow. I tied her up, but just as I raised my hand to kill her, she let out the most pitiful cries. Tears streamed from her eyes. I had never seen such a thing. Pity stopped me, and I told the steward to take her away and bring another cow.
        - id: ch01-b08
          speaker: first_old_man
          text: >-
            My wife was there. When she saw her cruel plan failing, she mocked me for showing mercy.
        - id: ch01-b09
          speaker: wife
          text: >-
            What are you doing? Kill this cow. She is the best one we have for the sacrifice.
        - id: ch01-b10
          speaker: first_old_man
          text: >-
            I tried again to please my wife. Again, the cow's cries and tears took away my resolve.
        - id: ch01-b11
          speaker: first_old_man
          text: >-
            Take her away and kill her yourself. I cannot do it.
        - id: ch01-b12
          speaker: first_old_man
          text: >-
            The steward killed the cow. Yet when he removed her hide, he found nothing but bones beneath it, though the animal had looked so fat. I was deeply vexed.
        - id: ch01-b13
          speaker: first_old_man
          text: >-
            Keep what is left for yourself. If you have a fat calf, bring it to me instead.
        - id: ch01-b14
          speaker: first_old_man
          text: >-
            Before long, he returned with a very fat calf. I did not know that this calf was my son. The moment it saw me, it strained against its rope, rushed to me, and threw itself at my feet with its head against the ground. It seemed to be begging for pity, begging me not to take its life.
        - id: ch01-b15
          speaker: first_old_man
          text: >-
            That touched and astonished me even more than the tears of the cow.
        - id: ch01-b16
          speaker: first_old_man
          text: >-
            Take this calf back. Care for it well, and bring me another one at once.
        - id: ch01-b17
          speaker: first_old_man
          text: >-
            As soon as my wife heard me, she cried out against my decision.
        - id: ch01-b18
          speaker: wife
          text: >-
            Husband, what are you doing? This is the calf you must sacrifice. Don't choose another one.
        - id: ch01-b19
          speaker: first_old_man
          text: >-
            No, wife. I will not sacrifice this calf.
        - id: ch01-b20
          speaker: first_old_man
          text: >-
            She argued and protested, but I would not change my mind. I had another calf killed, and this one was led away. The next day, my steward asked to speak with me alone.
        - id: ch01-b21
          speaker: steward
          text: >-
            I have news that I think will make you glad. My daughter knows magic. Yesterday, when I brought home the calf you would not sacrifice, she smiled at first. A moment later, she began to cry. I asked her what had caused both reactions.
        - id: ch01-b22
          speaker: steward_daughter
          text: >-
            Father, this calf is our master's son. I smiled because he is still alive. But I cried for his mother, who was sacrificed yesterday in the shape of a cow. Our master's wife hated them both, and she used magic to change them.
        - id: ch01-b23
          speaker: first_old_man
          text: >-
            O Genius, imagine my astonishment when I heard this. I could scarcely believe what the steward had told me. I went straight away with him to speak to his daughter. But first I entered the stable to see my son. I caressed him, and though he could not speak, he answered me as best he could.
        - id: ch01-b24
          speaker: first_old_man
          text: >-
            When the steward's daughter arrived, I asked whether she could restore my son to his true shape.
        - id: ch01-b25
          speaker: steward_daughter
          text: >-
            Yes, I can, but only on two conditions. First, you must give him to me as my husband. Second, you must allow me to punish the woman who turned him into a calf.
        - id: ch01-b26
          speaker: first_old_man
          text: >-
            I agree to the first condition with all my heart, and I will give you a generous dowry. I agree to the second as well. I ask only that you spare my wife's life.
        - id: ch01-b27
          speaker: steward_daughter
          text: >-
            I will spare her. I will treat her in the same way she treated your son.
        - id: ch01-b28
          speaker: first_old_man
          text: >-
            She took a vessel of water and spoke words over it that I could not understand. Then she threw the water over the calf. At once, he became a young man again.
        - id: ch01-b29
          speaker: first_old_man
          text: >-
            My son, my dear son! This kind young woman has saved you from a terrible enchantment. I am sure you will marry her out of gratitude.
          emotion: happy
        - id: ch01-b30
          speaker: first_old_man
          text: >-
            My son agreed joyfully. Before they married, the young woman changed my wife into a hind. That is the hind you see here. I wanted her to take this shape instead of some strange and repulsive one, so she could remain with the family without filling us with disgust.
        - id: ch01-b31
          speaker: first_old_man
          text: >-
            Since then, my son has lost his wife and gone away traveling. I am searching for him now. I did not want to leave my wife in anyone else's care, so I brought her with me. Is that not a truly marvelous tale?
        - id: ch01-b32
          speaker: genius
          text: >-
            Indeed it is. Because of your story, I grant you one third of this merchant's punishment.
        - id: ch01-b33
          speaker: narrator
          text: >-
            When the first old man finished, the second old man, who was leading the two black dogs, addressed the Genius.
        - id: ch01-b34
          speaker: second_old_man
          text: >-
            Now I will tell you what happened to me. I am certain you will find my story even more astonishing than the one you have just heard. When I have told it, will you also grant me one third of the merchant's punishment?
        - id: ch01-b35
          speaker: genius
          text: >-
            Yes, if your story is more astonishing than the tale of the hind.
        - id: ch01-b36
          speaker: narrator
          text: >-
            With that agreement, the second old man began his story.
