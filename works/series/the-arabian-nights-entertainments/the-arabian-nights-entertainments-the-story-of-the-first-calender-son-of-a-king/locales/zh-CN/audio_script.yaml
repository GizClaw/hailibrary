audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    calender_1:
      display_name: 第一位卡兰德
      tts:
        delivery: 有礼克制，遇到冒犯时仍尽量和气
        timbre: 清朗略显沧桑
        pace: 平稳
        pitch: 中音
    calender_2:
      display_name: 第二位卡兰德
      tts:
        delivery: 郑重坦率，谈及身世时带着神秘感
        timbre: 温厚低沉
        pace: 从容
        pitch: 中低音
    prince:
      display_name: 堂兄王子
      tts:
        delivery: 温文亲密，隐藏秘密时坚决而急切
        timbre: 清朗柔和
        pace: 平稳，催促时稍快
        pitch: 中音
    executioner:
      display_name: 刽子手
      tts:
        delivery: 粗直严厉，动了恻隐之心后仍保持警觉
        timbre: 低沉粗粝
        pace: 简短干脆
        pitch: 低音
    uncle:
      display_name: 叔父国王
      tts:
        delivery: 威严深沉，悲愤中带着对侄儿的关爱
        timbre: 浑厚苍老
        pace: 沉缓克制
        pitch: 低音
    zobeida:
      display_name: 祖贝达
      tts:
        delivery: 端庄自持，发号施令时冷峻有力
        timbre: 丰满清亮，带有威严
        pace: 从容，动怒时字句分明
        pitch: 中低音
  chapters:
    - id: ch01
      title: 堂兄的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第一位卡兰德面向祖贝达，讲起自己失去右眼、又换上这身装束的缘由。
        - id: ch01-b02
          speaker: calender_1
          text: |-
            夫人，我原本也是国王的儿子。父王唯一的弟弟统治着邻国，他的一双儿女都和我年纪相仿。我长大以后，每年都去叔父的宫廷住上两个月，因此和堂兄十分亲近。最后一次去看他，他比往常更欢喜，还特意为我设宴。饭后，他忽然说自己有件秘密要告诉我。
        - id: ch01-b03
          speaker: prince
          text: |-
            堂弟，你一定猜不到，你离开以后，我照自己的设计叫人建了一处住所。现在已经完工，可以住了。我愿意带你去看，但你要先答应我两件事：绝不负我，也绝不把秘密说出去。
        - id: ch01-b04
          speaker: calender_1
          text: |-
            他无论要我做什么，我都不会拒绝，当场便发了誓。他让我稍等，转身离开，不一会儿领来一位衣饰华贵、容貌绝美的女子。他没有说出她的姓名，我也觉得不便追问。我们三人围桌而坐，随意谈些无关紧要的事，又互相祝酒。过了一阵，堂兄突然说不能再耽搁，请我送那位夫人去一座新建的圆顶陵墓。他说那地方一眼就能认出，要我们两人进去等候，自己很快就来。
        - id: ch01-b05
          speaker: calender_1
          text: |-
            我既然答应了，只能照办。我牵着那位夫人的手，借月光把她送到陵墓。我们前脚刚到，堂兄后脚就来了，手中拿着一小罐水、一把鹤嘴锄和一袋灰泥。他立刻砸起墓穴正中的空石棺，把拆下的石块一块一块堆到角落。石棺全拆掉以后，他又挖开下面的泥土。那里竟藏着一扇地门。他掀起门板，下面露出一道螺旋阶梯。
        - id: ch01-b06
          speaker: prince
          text: |-
            夫人，沿这道阶梯下去，就能到我对你说过的地方。
        - id: ch01-b07
          speaker: calender_1
          text: |-
            那位夫人一声不响地走了下去，堂兄也跟在后面。到了阶梯口，他又回头望着我。
        - id: ch01-b08
          speaker: prince
          text: |-
            堂弟，你帮了我这样大的忙，我真不知道该怎样感谢你。永别了。
        - id: ch01-b09
          speaker: calender_1
          text: |-
            永别？你是什么意思？我一点也不明白。
        - id: ch01-b10
          speaker: prince
          text: |-
            不必明白。照原路回去吧。
        - id: ch01-b11
          speaker: calender_1
          text: |-
            无论我怎样问，他都不肯再开口。我只好满腹疑惑地回宫睡下。醒来后，我几乎以为夜里的事是一场梦，便派仆人去问堂兄是否起身。可他整夜没有回宫。我慌忙赶到墓地，偏偏每一座陵墓都长得相似。我找了四天，也没能认出那一座。
        - id: ch01-b12
          speaker: calender_1
          text: |-
            那段日子，叔父一直外出狩猎，谁也不知道他何时回来。我最后只能启程回国，请宫中大臣替我向叔父致歉。他们为堂兄的命运忧心如焚，我多么想把他的去向说出来，可那场重誓仍逼着我守口如瓶。
    - id: ch02
      title: 王位被夺
      blocks:
        - id: ch02-b01
          speaker: calender_1
          text: |-
            回到父王的都城，我惊讶地看见宫门前列着大队卫兵。一进门，他们就把我团团围住。我向领队的军官追问缘由，听到的消息让我万分惊骇。军队已经叛乱，杀害了父王，又把大维齐尔推上王位。如今，那个篡位者还下令逮捕了我。
        - id: ch02-b02
          speaker: calender_1
          text: |-
            那名维齐尔从我少年时便恨我。过去我用弓箭射鸟，曾失手射瞎他一只眼睛。事发以后，我马上派仆人向他表达歉意，又亲自登门赔罪，可这一切都没有用。他始终怀恨在心，遇到机会就要让我知道他有多憎恶我。如今我落在他手里，他当然不会留情。他被胜利和狂怒冲昏了头，闯进牢房，生生剜去了我的右眼。夫人，这就是我失去右眼的经过。
        - id: ch02-b03
          speaker: calender_1
          text: |-
            可他仍不罢休，又把我锁进一只大箱子，命刽子手带到荒野砍头，再把尸身扔给猛禽。装着我的箱子被驮上马，刽子手和另一个人骑马来到郊外，一直走到荒无人烟、适合行刑的地方。他们的心肠并不像外表那样冷硬。我的眼泪和一声声哀求，终于使两个人动摇了。
        - id: ch02-b04
          speaker: executioner
          text: |-
            马上离开这个国家，永远别回来。否则不光你的脑袋保不住，我们也会跟着掉脑袋。
        - id: ch02-b05
          speaker: calender_1
          text: |-
            我满怀感激地谢过他，想到自己虽然少了一只眼睛，到底逃过了其他灾祸，只能这样安慰自己。经历了这一切，我又怕被仇敌认出，赶路格外缓慢而谨慎。白天躲在偏僻处休息，夜里才尽力多走一程。历尽艰辛，我终于进入叔父的国土，确信在那里能得到他的庇护。
    - id: ch03
      title: 地下陵墓
      blocks:
        - id: ch03-b01
          speaker: calender_1
          text: |-
            叔父正为儿子的失踪伤心。他说，堂兄消失得没有一点踪迹。可他自己这样悲痛，仍然分担了我的苦难。一个人失去的亲人，也是另一个人失去的亲人，我们只能让眼泪流在一起。到了这一步，我认定自己有责任打破向堂兄发过的重誓，便立刻把知道的事全说了出来。还没听完，叔父的愁苦似乎已经减轻了一些。
        - id: ch03-b02
          speaker: uncle
          text: |-
            我亲爱的侄儿，你的话让我看见了一点希望。我知道儿子曾在建造一座陵墓，也许我能找出那个地方。不过，他既然不愿让别人知道，我们就单独去找。
        - id: ch03-b03
          speaker: calender_1
          text: |-
            叔父让我乔装起来。我们从一道通往墓地的花园侧门悄悄出去，很快便来到堂兄消失的地方，也认出了我先前苦寻不获的陵墓。里面果然有那扇通往阶梯的地门。可堂兄曾用随身带来的灰泥从下方将它封死，我们费了很大力气才掀开。
        - id: ch03-b04
          speaker: calender_1
          text: |-
            叔父先下去，我跟在后面。阶梯底下像是一间前厅，浓烟弥漫，几乎看不见东西。我们穿过烟雾，来到一个灯火通明的大房间。起初那里仿佛空无一物，仔细一看，尽头却有一座高台。堂兄和那位夫人的尸身并排躺在台上，都已经烧去一半，仿佛有人赶在火焰把他们完全吞没前，将他们拖了出来。
        - id: ch03-b05
          speaker: calender_1
          text: |-
            眼前的惨状让我几乎昏倒。叔父却不像我这样惊讶，他更多的是愤怒。
        - id: ch03-b06
          speaker: uncle
          text: |-
            我早知道儿子深爱这个女子，可他们根本不可能成婚。我想尽办法让他回心转意，把世上最美的公主带给他看，他却一个也不要。如今，他们终于结合在一起，代价竟是在这座地下陵墓里惨死。
        - id: ch03-b07
          speaker: calender_1
          text: |-
            叔父说着，怒火便化成了眼泪，我也陪他再次痛哭。等心绪平复，他把我拉近，紧紧抱住。
        - id: ch03-b08
          speaker: uncle
          text: |-
            我亲爱的侄儿，你来到我身边，正好代替他的位置。我会尽力忘记，自己曾有过一个做出这般恶事的儿子。
        - id: ch03-b09
          speaker: calender_1
          text: |-
            说完，叔父转身登上阶梯。我们回到宫里，没有任何人发现我们曾经离开。
    - id: ch04
      title: 再度逃亡
      blocks:
        - id: ch04-b01
          speaker: calender_1
          text: |-
            没过多久，铿锵的鼓声、钹声和嘹亮的号角突然一齐传来，令我们惊愕不已。天边同时扬起滚滚尘云，宣告一支大军正在逼近。等我看清领兵的人，心顿时沉了下去。那正是推翻我父王的维齐尔，他这次是来夺取叔父的王国。
        - id: ch04-b02
          speaker: calender_1
          text: |-
            都城没有做过抵御围攻的准备。城中人见反抗毫无用处，立刻打开城门。叔父为了保住性命奋力拼杀，却很快寡不敌众。等他倒下，我设法从一条秘道逃走，藏进一名自己信得过的军官家里。
        - id: ch04-b03
          speaker: calender_1
          text: |-
            厄运一次次追上我，悲痛也压得我喘不过气。眼前似乎只剩下一条活路。为了保命，我剃掉胡须和眉毛，换上卡兰德的衣裳。这样一来，赶路时便不容易被认出。我避开所有城镇，一直走进声名远扬、权势显赫的哈里发哈伦·拉希德的国土，才终于有理由相信，仇敌再也伤不到我了。
        - id: ch04-b04
          speaker: calender_1
          text: |-
            我打算赶到巴格达，跪在殿下面前。我深信，他听过我的悲惨经历，必定会为之动容。除了同情我，他还会给我所需要的援助与庇护。
    - id: ch05
      title: 厄运中的兄弟
      blocks:
        - id: ch05-b01
          speaker: calender_1
          text: |-
            经过几个月的跋涉，我终于来到这座城的门前。太阳正要落山，我停在那里四处张望，思量接下来该往哪边走。还没拿定主意，眼前这位卡兰德便来到我身旁，停下来向我问候。
        - id: ch05-b02
          speaker: calender_1
          text: |-
            看来，你也和我一样，是个异乡人。
        - id: ch05-b03
          speaker: calender_2
          text: |-
            你说得不错，我也是初来此地的异乡人。
        - id: ch05-b04
          speaker: calender_1
          text: |-
            他还没来得及多讲，第三位卡兰德也走了过来。他同样刚到巴格达。我们都是厄运里的兄弟，于是决定结伴同行，把各自的命运放在一起。不管命运还准备了什么，都由三个人共同承受。
        - id: ch05-b05
          speaker: calender_1
          text: |-
            那时天色已经很晚，我们却不知道该去哪里过夜。幸而幸运之星把我们引到这扇门前。我们冒昧敲门，请求借宿，诸位立刻怀着世上最亲切的善意收留了我们。夫人，这就是我的故事。
        - id: ch05-b06
          speaker: zobeida
          text: |-
            我很满意。你想走便可以走了。
        - id: ch05-b07
          speaker: narrator
          text: |-
            第一位卡兰德却没有离开，恳求祖贝达准许他继续留下。他还想听完另外两位朋友，以及席间其余三人的经历。祖贝达答应了他的请求。
