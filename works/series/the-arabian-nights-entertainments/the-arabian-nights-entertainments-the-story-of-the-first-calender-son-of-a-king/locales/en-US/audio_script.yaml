  chapters:
    - id: ch01
      title: The Prince's Secret
      blocks:
        - id: ch01-b01
          speaker: first_calender
          text: >-
            Madam, to explain why I lost my right eye and came to wear a calender's dress, I must begin by telling you that I am a king's son. My father's only brother ruled the neighboring country. He had a son and a daughter, both my own age.
        - id: ch01-b02
          speaker: first_calender
          text: >-
            As I grew older and gained more freedom, I visited my uncle's court every year and usually stayed for about two months. My cousin and I became very close and deeply attached to each other. On my last visit, he seemed happier to see me than ever before. He held a great feast in my honor, and after we had finished eating, he told me he had a secret.
        - id: ch01-b03
          speaker: prince
          text: >-
            Cousin, you would never guess what I have done since you were last here. As soon as you left, I had men begin a building of my own design. It is finished now and ready to live in. I want to show it to you, but first you must swear to be faithful to me and never reveal my secret.
        - id: ch01-b04
          speaker: first_calender
          text: >-
            I could not imagine refusing him. I gave my word at once. He asked me to wait and disappeared. A few moments later, he returned with a beautiful lady in splendid clothes. He did not give me her name, so I did not ask. The three of us sat at the table, talked of ordinary things, and drank to one another's health.
        - id: ch01-b05
          speaker: prince
          text: >-
            Cousin, there is no time to waste. Please take this lady to a certain place. You will find a newly built tomb shaped like a dome, and you cannot miss it. Go inside together and wait for me. I will come soon.
        - id: ch01-b06
          speaker: first_calender
          text: >-
            I had made my promise, so I gave the lady my hand and led her through the moonlight to the place he had described. We had only just arrived when the prince joined us. He carried a small vessel of water, a pickaxe, and a little bag of plaster.
    - id: ch02
      title: Beneath the Tomb
      blocks:
        - id: ch02-b01
          speaker: first_calender
          text: >-
            He began at once to break apart the empty stone grave in the middle of the tomb. He lifted each stone away and stacked it in a corner. When the whole structure was gone, he dug into the earth beneath it and uncovered a trapdoor. He raised it, revealing the top of a spiral staircase.
        - id: ch02-b02
          speaker: prince
          text: >-
            Madam, these stairs will take you down to the place I told you about.
        - id: ch02-b03
          speaker: first_calender
          text: >-
            The lady answered nothing. She silently went down, and the prince followed her. Before descending, he looked back at me.
        - id: ch02-b04
          speaker: prince
          text: >-
            My cousin, I cannot thank you enough for your kindness. Farewell.
        - id: ch02-b05
          speaker: first_calender
          text: >-
            Farewell? What do you mean? I do not understand.
        - id: ch02-b06
          speaker: prince
          text: >-
            It does not matter. Go home by the same path you came.
        - id: ch02-b07
          speaker: first_calender
          text: >-
            He would say nothing more. Completely puzzled, I followed the same path back to my room in the palace and went to bed. When I woke and thought over the strange night, it seemed so unreal that I wondered if I had dreamed it. I sent a servant to ask whether the prince was dressed and ready to see me. The answer came back that he had not slept at home at all.
        - id: ch02-b08
          speaker: first_calender
          text: >-
            Alarmed, I hurried to the cemetery. But every tomb looked so much like the next that I could not find the one I wanted. I searched for four days and found nothing.
        - id: ch02-b09
          speaker: first_calender
          text: >-
            My uncle was away on a hunting expedition, and no one knew when he would return. At last, I decided to go home and asked his ministers to excuse my departure. They were terribly anxious about the missing prince, and I longed to tell them what I knew. But my oath forced me to remain silent.
    - id: ch03
      title: The Rebel Vizir
      blocks:
        - id: ch03-b01
          speaker: first_calender
          text: >-
            When I reached my father's capital, I was astonished to see a large force of guards waiting before the palace gate. The moment I entered, they surrounded me. I demanded to know why they were treating me this way. Their officers gave me a terrible answer. The army had rebelled, killed my father, and placed the grand vizir on his throne. On the new king's orders, I was now under arrest.
        - id: ch03-b02
          speaker: first_calender
          text: >-
            This rebel vizir had hated me since I was a boy. Once, while shooting an arrow at a bird with my bow, I had struck his eye by accident and destroyed it. I immediately sent a servant to tell him how sorry I was, and then I went to him and apologized in person. Nothing I said or did helped. His hatred never died, and he never missed a chance to show it.
        - id: ch03-b03
          speaker: first_calender
          text: >-
            Now that I was his prisoner, I knew he would have no mercy. I was right. Wild with triumph and rage, he came into my prison and tore out my right eye. That, madam, is how I lost it.
        - id: ch03-b04
          speaker: first_calender
          text: >-
            But my persecutor had not finished with me. He locked me inside a large case. Then he ordered his executioner to carry me to a deserted place, cut off my head, and leave my body for the birds of prey.
        - id: ch03-b05
          speaker: first_calender
          text: >-
            They loaded the case, with me still inside, onto a horse. The executioner and another man rode out into the country until they found a place that suited their purpose. Yet their hearts were softer than they appeared. My tears and pleas made them hesitate.
        - id: ch03-b06
          speaker: executioner
          text: >-
            Leave this kingdom at once, and never come back. If you return, you will lose your head, and you will cost us ours as well.
        - id: ch03-b07
          speaker: first_calender
          text: >-
            I thanked him with all my heart. I tried to bear the loss of my eye by remembering the worse fate I had escaped.
    - id: ch04
      title: The Hidden Chamber
      blocks:
        - id: ch04-b01
          speaker: first_calender
          text: >-
            After everything I had suffered, I feared that an enemy might recognize me. I traveled slowly and with great care. Most days I hid in some lonely place, and at night I walked as far as I could. In time, I reached my uncle's kingdom, where I knew I would be protected.
        - id: ch04-b02
          speaker: first_calender
          text: >-
            I found my uncle deeply troubled. His son, he said, had vanished without leaving a single trace. Even in his own grief, he listened to my misfortunes and shared my sorrow. We mingled our tears, because each of us felt the other's loss as his own. Then I decided that my duty to my uncle was stronger than the solemn promise I had made to my cousin. Without delay, I told him everything I knew. Before I finished, I saw a little of the sorrow lift from his face.
        - id: ch04-b03
          speaker: uncle
          text: >-
            My dear nephew, your story gives me hope. I knew my son was building a tomb, and I believe I can find it. Since he wanted this kept secret, we must go alone and search for it ourselves.
        - id: ch04-b04
          speaker: first_calender
          text: >-
            He told me to disguise myself. Together, we slipped through a garden door that opened onto the cemetery. Before long, he led us to the place where the prince had disappeared. It was the very tomb I had searched for in vain.
        - id: ch04-b05
          speaker: first_calender
          text: >-
            Inside, we found the trapdoor above the staircase. Raising it was difficult, because the prince had sealed it underneath with the plaster he had carried. At last it opened. My uncle went down first, and I followed.
        - id: ch04-b06
          speaker: first_calender
          text: >-
            At the foot of the stairs was an anteroom filled with smoke so thick that we could barely see. We made our way through it and entered a large chamber. At first the room looked empty, though it was brilliantly lit. Then we noticed a raised platform at one end.
        - id: ch04-b07
          speaker: first_calender
          text: >-
            On it lay the bodies of the prince and the lady. Both were half burned, as though they had been pulled from a fire before the flames could consume them. The horrible sight made me faint. But to my surprise, my uncle showed more anger than shock.
    - id: ch05
      title: A Kingdom Lost
      blocks:
        - id: ch05-b01
          speaker: uncle
          text: >-
            I knew my son dearly loved this lady, though he could never marry her. I tried to draw his thoughts away from her. I brought the most beautiful princesses before him, but he cared for none of them. Now you see how the two have been united, through a dreadful death beneath the ground.
          emotion: angry
        - id: ch05-b02
          speaker: first_calender
          text: >-
            As my uncle spoke, his anger gave way to tears, and once more I wept beside him. When he had recovered, he pulled me close and embraced me.
        - id: ch05-b03
          speaker: uncle
          text: >-
            My dear nephew, you have come to take my son's place. I will do my best to forget that I ever had a son who could behave so wickedly.
          emotion: sad
        - id: ch05-b04
          speaker: first_calender
          text: >-
            He turned away and climbed the stairs. We reached the palace without anyone noticing that we had gone. Soon afterward, the crash of drums and cymbals and the blare of trumpets broke upon our ears. A thick cloud of dust rose along the horizon. A great army was approaching.
        - id: ch05-b05
          speaker: first_calender
          text: >-
            My heart sank when I recognized its commander. It was the vizir who had overthrown my father, and he had come to seize my uncle's kingdom too.
        - id: ch05-b06
          speaker: first_calender
          text: >-
            The capital was completely unprepared to withstand a siege. Its people saw that resistance was useless and opened the gates at once. My uncle fought fiercely for his life, but the enemy soon overpowered him. When he fell, I managed to escape through a secret passage. I took refuge in the house of an officer I knew I could trust.
    - id: ch06
      title: The Calenders Meet
      blocks:
        - id: ch06-b01
          speaker: first_calender
          text: >-
            Ill fortune still pursued me, and grief weighed heavily on me. Only one path to safety remained. I shaved off my beard and eyebrows and put on the clothes of a calender. In that disguise, I could travel without being recognized.
        - id: ch06-b02
          speaker: first_calender
          text: >-
            I stayed away from towns until I entered the kingdom of the famous and powerful Caliph Haroun-al-Raschid. Once I was within his lands, I no longer had reason to fear my enemies. I meant to come to Bagdad, fall at His Highness's feet, and tell him my sorrowful history. I felt certain that my story would touch his heart and that he would grant me his help and protection.
        - id: ch06-b03
          speaker: first_calender
          text: >-
            My journey lasted several months. At last I reached the gates of this city as the sun was setting. I paused there for a little while, looking about me and trying to decide which way to turn my steps. While I was still debating where to go, this other calender came up and greeted me.
        - id: ch06-b04
          speaker: first_calender
          text: >-
            You seem to be a stranger here, just as I am.
        - id: ch06-b05
          speaker: second_calender
          text: >-
            You are right. I am a stranger too.
        - id: ch06-b06
          speaker: first_calender
          text: >-
            Before he could say anything more, the third calender arrived. He too had only just reached Bagdad. We were brothers in misfortune, so we agreed to join our fortunes and share whatever fate had waiting for us.
        - id: ch06-b07
          speaker: first_calender
          text: >-
            By then it had grown late, and none of us knew where we could spend the night. Our lucky star led us to this door. We knocked and asked for shelter, and you received us at once with the greatest kindness.
    - id: ch07
      title: Zobeida's Answer
      blocks:
        - id: ch07-b01
          speaker: first_calender
          text: >-
            This, madam, is my story.
        - id: ch07-b02
          speaker: zobeida
          text: >-
            I am satisfied. You may leave whenever you wish.
        - id: ch07-b03
          speaker: narrator
          text: >-
            The calender asked instead for permission to remain. He wished to hear the stories of his two companions and of the other three people in the company. Zobeida allowed him to stay.
