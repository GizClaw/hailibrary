  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    sindbad:
      display_name: Sindbad
      tts:
        delivery: vivid, reflective, and assured
        timbre: rich and clear
        pace: measured
        pitch: medium
    groom:
      display_name: The King's Groom
      tts:
        delivery: practical and welcoming
        timbre: sturdy and open
        pace: moderate
