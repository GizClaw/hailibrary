  chapters:
    - id: ch01
      title: Wealth and the Open Sea
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            My parents had left me a great fortune. But I was young and foolish, and at first I wasted it on every pleasure I could find.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            Before long, I saw how quickly riches can fly away when they are handled as badly as I had handled mine. I also remembered what a misery it would be to grow old in poverty. So I began to think seriously about making the best of what remained.
        - id: ch01-b03
          speaker: sindbad
          text: >-
            I sold all my household goods at a public auction. Then I joined a company of sea merchants. Together we fitted out a ship and sailed from Balsora.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            We headed toward the East Indies through the Persian Gulf. The coast of Persia lay on our left, and Arabia Felix lay on our right.
        - id: ch01-b05
          speaker: sindbad
          text: >-
            At first, the rolling ship made me very ill. I soon recovered, though, and from that time on I was never troubled by seasickness again.
        - id: ch01-b06
          speaker: sindbad
          text: >-
            Now and then we stopped at different islands to sell or trade our goods. Then one day the wind suddenly died. Our ship came to a standstill beside what looked like a small green island, barely rising above the water.
    - id: ch02
      title: The Island That Moved
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: >-
            The crew furled the sails, and the captain let anyone who wished go ashore for a little amusement. I went with them. After wandering about, we lit a fire and sat down to eat the food we had brought.
        - id: ch02-b02
          speaker: sindbad
          text: >-
            All at once, the ground shook violently beneath us. At that same moment, the people on the ship began shouting for us to come back if we wanted to live. What we had taken for an island was really the back of an enormous sleeping whale.
        - id: ch02-b03
          speaker: sindbad
          text: >-
            The people nearest the boat threw themselves into it. Others leaped straight into the sea. But before I could escape, the whale plunged into the depths.
        - id: ch02-b04
          speaker: sindbad
          text: >-
            The water closed over the place where the whale had been, and I was left clinging to a piece of wood we had carried ashore for the fire.
        - id: ch02-b05
          speaker: sindbad
          text: >-
            Meanwhile, a breeze had risen. Everyone aboard was busy raising the sails and pulling up the people in the boat or hanging from its sides. In all that confusion, no one noticed I was missing. The ship sailed away and left me at the mercy of the waves.
        - id: ch02-b06
          speaker: sindbad
          text: >-
            All day I drifted up and down, tossed first one way and then another. When night came, I thought I would die. I was exhausted, but I still held tight to that frail piece of wood.
        - id: ch02-b07
          speaker: sindbad
          text: >-
            Imagine my joy when morning came and I saw that the waves had carried me to an island.
    - id: ch03
      title: The King's Grooms
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: >-
            The cliffs above me were high and steep. Luckily, tree roots stuck out here and there. I used them to climb until at last I reached the top.
        - id: ch03-b02
          speaker: sindbad
          text: >-
            I stretched out on the grass, more dead than alive, and lay there until the sun was high. By then I was terribly hungry. After searching, I found some herbs I could eat and a spring of clear water. They refreshed me enough to explore the island.
        - id: ch03-b03
          speaker: sindbad
          text: >-
            Before long, I came to a wide plain. A horse was grazing there, tied to a stake. As I stood looking at it, I heard voices that seemed to come from underground.
        - id: ch03-b04
          speaker: sindbad
          text: >-
            A moment later, a man appeared and asked how I had come to the island. I told him everything that had happened to me.
        - id: ch03-b05
          speaker: groom
          text: >-
            I am one of the grooms of Mihrage, the king of this island. We come here every year to feed our master's horses on this plain.
        - id: ch03-b06
          speaker: sindbad
          text: >-
            The groom led me into a cave where his companions had gathered. They set food before me, and I ate.
        - id: ch03-b07
          speaker: groom
          text: >-
            You were fortunate to find us today. We return to the king tomorrow. Without our help, you could never find your way to the inhabited part of the island.
        - id: ch03-b08
          speaker: sindbad
          text: >-
            Early the next morning, we set out together. When we reached the capital, King Mihrage received me graciously. I told him about my voyage and my escape.
        - id: ch03-b09
          speaker: sindbad
          text: >-
            The king ordered his people to care for me well and give me everything I needed.
    - id: ch04
      title: Waiting in King Mihrage's Land
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: >-
            Since I was a merchant, I began seeking out other merchants, especially those from foreign lands. I hoped one of them might bring news from Bagdad or help me find a way home. The capital stood by the sea, and ships came there from every part of the world.
        - id: ch04-b02
          speaker: sindbad
          text: >-
            While I waited, I heard many curious things. People asked me question after question about my own country, and I gladly spoke with everyone who came to see me.
        - id: ch04-b03
          speaker: sindbad
          text: >-
            I also visited a little island called Cassel, which belonged to King Mihrage. People believed that a spirit named Deggial lived there. Sailors told me they often heard timbals playing on the island at night.
        - id: ch04-b04
          speaker: sindbad
          text: >-
            I saw nothing strange during that voyage except some extraordinary fish. Some were two hundred cubits long. Fortunately, they feared us even more than we feared them. If we struck a board, they fled from the sound.
        - id: ch04-b05
          speaker: sindbad
          text: >-
            Other fish were only one cubit long, and their heads looked like the heads of owls.
    - id: ch05
      title: The Cargo of a Dead Man
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: >-
            One day, after I had returned to the capital, I walked down to the quay. A ship had just dropped anchor and was unloading its cargo. The merchants who owned the goods were directing the workers as they carried everything to the warehouses.
        - id: ch05-b02
          speaker: sindbad
          text: >-
            I went closer and saw my own name marked on some of the packages. I examined them carefully. There could be no doubt. These were the very goods I had loaded onto our ship at Balsora.
        - id: ch05-b03
          speaker: sindbad
          text: >-
            Then I recognized the captain. I knew he must believe I was dead, so I approached him and asked who owned the packages before us.
        - id: ch05-b04
          speaker: captain
          text: >-
            A merchant from Bagdad named Sindbad sailed aboard my ship. One day, he and several other passengers went ashore on what we thought was an island. It was really a huge whale asleep on the waves.
        - id: ch05-b05
          speaker: captain
          text: >-
            The whale felt the heat of the fire they had lit on its back and dived into the sea. Several people in the water were lost. Poor Sindbad was among them.
        - id: ch05-b06
          speaker: captain
          text: >-
            These goods belonged to him. I have decided to sell them for his family's benefit, if I ever have the good fortune to find them.
        - id: ch05-b07
          speaker: sindbad
          text: >-
            Captain, I am the Sindbad you believe drowned. Those goods are mine!
        - id: ch05-b08
          speaker: sindbad
          text: >-
            He stared at me and cried out in amazement.
        - id: ch05-b09
          speaker: captain
          text: >-
            Good heavens! What is the world coming to? There is not an honest man left anywhere. I saw Sindbad drown with my own eyes, and now you dare claim to be him!
          emotion: surprised
        - id: ch05-b10
          speaker: captain
          text: >-
            I took you for a just man. Yet you would tell such a dreadful lie to seize property that is not yours.
        - id: ch05-b11
          speaker: sindbad
          text: >-
            Be patient, Captain. Please hear my story before you judge me.
        - id: ch05-b12
          speaker: captain
          text: >-
            Very well. Speak. I am listening.
    - id: ch06
      title: Sindbad Comes Home
      blocks:
        - id: ch06-b01
          speaker: sindbad
          text: >-
            I told him how I had escaped from the whale and how fortunate I had been to meet the king's grooms. I told him, too, of the kindness shown to me at the palace.
        - id: ch06-b02
          speaker: sindbad
          text: >-
            Before long, I could see that he was beginning to believe me. Then some of the other merchants arrived. They recognized me at once and showed great joy at finding me alive. At last, the captain recognized me too.
        - id: ch06-b03
          speaker: sindbad
          text: >-
            He threw his arms around my neck.
        - id: ch06-b04
          speaker: captain
          text: >-
            Heaven be praised! You have escaped a terrible danger. Here are your goods. Take them and use them however you wish.
          emotion: happy
        - id: ch06-b05
          speaker: sindbad
          text: >-
            I thanked him and praised his honesty. In my gratitude, I asked him to accept several bales of merchandise, but he refused to take anything.
        - id: ch06-b06
          speaker: sindbad
          text: >-
            I chose the finest of my goods as a present for King Mihrage. At first he was amazed, because he knew I had lost everything. I explained how my bales had been restored to me in this wonderful way.
        - id: ch06-b07
          speaker: sindbad
          text: >-
            The king graciously accepted my gifts and gave me many valuable things in return. Then I took my leave of him.
        - id: ch06-b08
          speaker: sindbad
          text: >-
            I traded my merchandise for sandalwood and aloes wood, camphor, nutmegs, cloves, pepper, and ginger. Then I boarded the same ship and began my journey home.
        - id: ch06-b09
          speaker: sindbad
          text: >-
            My trading went so well along the way that I reached Balsora with about one hundred thousand sequins. My family was overjoyed to receive me, and I felt just as much joy when I saw them again.
        - id: ch06-b10
          speaker: sindbad
          text: >-
            I bought land and slaves and built a great house. There I decided to live happily, enjoy every pleasure of life, and forget all I had suffered.
    - id: ch07
      title: The Tale Continues
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            Here Sindbad stopped his story. He ordered the musicians to play again, and the feast continued until evening.
        - id: ch07-b02
          speaker: narrator
          text: >-
            When it was time for the porter to leave, Sindbad gave him a purse containing one hundred sequins.
        - id: ch07-b03
          speaker: sindbad
          text: >-
            Take this, Hindbad, and go home. Come back tomorrow, and you shall hear more of my adventures.
        - id: ch07-b04
          speaker: narrator
          text: >-
            The porter went away, overcome by such generosity. You may imagine the welcome he received at home. His wife and children thanked their lucky stars that he had found so generous a benefactor.
        - id: ch07-b05
          speaker: narrator
          text: >-
            The next day, Hindbad put on his best clothes and returned to the voyager's house. Sindbad welcomed him with open arms.
        - id: ch07-b06
          speaker: narrator
          text: >-
            Once all the guests had arrived, the banquet began just as it had before. They feasted long and merrily. Then Sindbad turned to them.
        - id: ch07-b07
          speaker: sindbad
          text: >-
            My friends, please give me your attention. I will tell you about my second voyage, and you will find it even more astonishing than the first.
