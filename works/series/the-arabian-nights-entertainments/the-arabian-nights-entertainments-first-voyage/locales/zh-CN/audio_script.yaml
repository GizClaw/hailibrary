audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    hindbad:
      display_name: 脚夫欣巴达
      tts:
        delivery: 朴实直率，抱怨时激动，面对贵人时拘谨
        timbre: 粗朴厚实，略带疲惫
        pace: 平稳，情绪激动时稍快
        pitch: 中低音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    captain:
      display_name: 船长
      tts:
        delivery: 老练直率，警觉时严厉，释然后真诚豪爽
        timbre: 粗粝洪亮，带着海上风霜
        pace: 稳健，激动时稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 离开巴士拉
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            父母留给我一大笔财产。可我那时年轻又糊涂，只知道四处享乐，花起钱来毫无节制。没过多久，我就明白了。钱财落在不会经营的人手里，转眼便会飞个精光。等到年老时再受穷，那才真是苦日子。

            我赶紧盘算，该怎样用好手里剩下的钱。后来，我把家中什物全都公开卖掉，加入了一群出海经商的商人。我们合资置办了一条船，从巴士拉出发，驶进波斯湾，向东印度群岛前进。船的左边是波斯海岸，右边是福地阿拉伯。

            刚上船时，船身一晃，我就难受得厉害。好在身体很快适应了。从那以后，我再也没晕过船。

            一路上，我们常在不同的岛屿靠岸，出售或交换货物。一天，海风突然停了。船泊在一座小岛旁，那地方绿得像一片草地，只比水面高出一点。大家收起风帆，船长准许我们上岸游玩片刻，我也跟着去了。

            我们走了一阵，便点起火，坐下来吃随身带的食物。谁知脚下突然猛烈摇晃。留在船上的人同时大喊起来，叫我们快逃。那根本不是岛，而是一头浮在海面上沉睡的巨鲸！

            离小船近的人马上跳了进去，还有人直接跃进海里。我来不及逃，鲸鱼已经感觉到背上的火热，猛地潜进深海。我只能死死抓住一块原本准备用来生火的木柴。

            偏偏这时又起了风。船上的人忙着升帆，还要救起小船里和攀在船边的人，谁也没发现我不见了。我就这样被独自留在海上，任凭波浪把我抛来抛去。

            我漂了整整一天。黑夜一来，我以为自己再也活不成了。可身上即使一点力气也没有，我仍旧抱紧那块木头。直到天亮，我才看见自己已经漂到一座岛边。那一刻，我真是欢喜得说不出话来。
    - id: ch02
      title: 海岛上的生路
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            岛岸的峭壁又陡又高，幸好石缝里伸出了几条树根。我攀着树根，总算爬上崖顶，随即倒在草地上。那时的我只剩下一口气，一直躺到太阳升得很高，才慢慢缓过来。

            我饿得难受，四处寻找，终于找到几种能吃的野草，还有一泓清泉。吃饱喝足以后，我重新有了精神，便起身察看这座岛。

            不久，我来到一片大平原。那里拴着一匹正在吃草的马。我正看着它，忽然听到有人说话，声音仿佛是从地下传来的。紧接着，一个男人走了出来，问我是怎么登上这座岛的。

            我讲完自己的遭遇，他才告诉我，他是岛上米赫拉杰国王的马夫。每年这个时候，他们都会来到这片平原，替国王饲养马匹。他把我领进一座洞穴，其他马夫都在那里。他们给了我食物，又说我能及时遇见他们，实在幸运。因为第二天，他们就要回到国王身边。没有他们带路，我绝不可能找到岛上有人居住的地方。

            第二天清早，我跟着马夫们出发。到了都城，国王很亲切地接见了我。我向他讲述一路的遭遇，他便命人好好照料我，把我需要的东西都准备齐全。

            我原本就是商人，便去结识当地的同行，尤其是从异国来的商客。我盼着从他们那里听见巴格达的消息，也想找到回家的办法。那座都城就在海边，世界各地的船都会来此停靠。我等待的时候，听了许多奇闻，也乐意同来访的人谈起自己的故乡。

            为了打发日子，我还去过一座名叫卡塞尔的小岛。那也是米赫拉杰国王的领地，据说岛上住着一个名叫德吉亚尔的精灵。水手们告诉我，夜里常能听见那里的定音鼓声。

            不过，我一路没碰见什么怪事，只见过几种奇鱼。有些足足两百腕尺长，幸好它们比我们更胆小。只要敲一敲木板，它们就吓得逃走了。还有些鱼只有一腕尺长，却顶着一颗猫头鹰似的脑袋。
    - id: ch03
      title: 失而复得的货物
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            一天，我从卡塞尔岛回来，走到码头，看见一条刚抛锚的船正在卸货。商人们忙着指挥人把货送进仓库。我走近一看，有些货包上竟写着我的名字。

            我仔细检查了一遍。没错，那正是我在巴士拉装上船的货物！接着，我又认出了那条船的船长。我知道，他一定以为我已经死了，便上前问他，那些货包是谁的。
        - id: ch03-b02
          speaker: captain
          text: |-
            我的船上原来有个巴格达商人，名叫辛巴达。有一天，他和几名乘客登上一处地方，以为那是小岛，其实那是一头漂在海上沉睡的巨鲸。众人在鲸背上生起火，巨鲸感到热，马上潜进了深海。好几个人都葬身海中，那个不幸的辛巴达也没能逃出来。

            这些货物就是他的。将来如果能遇见他的家人，我会把货物卖掉，再把所得的钱交给他们。
        - id: ch03-b03
          speaker: sindbad
          text: |-
            船长，我就是那个被你认定已经死去的辛巴达。这些货物全都是我的！
        - id: ch03-b04
          speaker: captain
          text: |-
            哎呀，这世道究竟怎么了？如今连一个诚实人也找不到！我明明亲眼看见辛巴达溺水，你竟敢冒充他？我原以为你是个正直的人。想不到为了抢走别人的财物，你连这种可怕的谎话都编得出来！
          emotion: angry
        - id: ch03-b05
          speaker: sindbad
          text: |-
            请耐心一点，先听我讲完自己的经历。
        - id: ch03-b06
          speaker: captain
          text: |-
            那你就讲吧，我仔细听着。
        - id: ch03-b07
          speaker: sindbad
          text: |-
            于是，我说起自己如何逃生，如何幸运地遇见国王的马夫，又如何受到王宫的款待。船长听着听着，神情渐渐变了，我看得出，他已经开始相信我。

            这时，船上另外几名商人也赶了过来。他们认出我还活着，个个喜出望外。船长终于也认出了我，一把抱住了我的脖子。
        - id: ch03-b08
          speaker: captain
          text: |-
            感谢上天！你竟从那么大的凶险中逃了出来。你的货物都在这里，请拿回去，随你处置吧！
          emotion: happy
    - id: ch04
      title: 满载而归
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            我向船长道谢，称赞他为人诚实，还请他收下几包货物，算作我的谢礼。可他无论如何也不肯要。

            我又从最好的货物中挑出一份，送给米赫拉杰国王。国王知道我先前失去了一切，起初十分惊讶。我把货物奇迹般回到手中的经过告诉他，他便欣然收下礼物，又回赠我许多珍贵的东西。

            后来，我向国王辞行，把自己的货物换成檀香木、沉香木、樟脑、肉豆蔻、丁香、胡椒和姜，再次登上那条船。回程一路，我的生意做得十分顺利。抵达巴士拉时，我已经拥有大约十万枚金币。

            家人见我回来，欢喜极了。我再次见到他们，心里也一样快活。我买下土地和奴仆，又盖了一座大宅。从此，我只想安享人生的种种乐趣，把过去吃过的苦全都忘掉。
    - id: ch05
      title: 第二次航行的约定
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            辛巴达说到这里，停了下来。他吩咐乐师们重新奏乐，宴席一直持续到傍晚。脚夫欣巴达该回家时，辛巴达递给他一只钱袋，里面装着一百枚金币。
        - id: ch05-b02
          speaker: sindbad
          text: |-
            拿着吧，欣巴达。今天先回家，明天再来。我会接着讲后面的奇遇。
        - id: ch05-b03
          speaker: narrator
          text: |-
            脚夫告辞离去。辛巴达如此慷慨，叫他感动得不知如何是好。想来他回家以后，一定受到了热烈欢迎。妻子和孩子都庆幸他遇见了这样一位恩人。

            第二天，欣巴达穿上自己最好的衣裳，再次来到水手辛巴达家里。主人张开双臂欢迎他。等宾客全都到齐，酒宴便像前一天那样开始了。大家畅饮欢宴了许久，辛巴达才开口对众人说。
        - id: ch05-b04
          speaker: sindbad
          text: |-
            朋友们，请用心听我讲第二次航行的奇遇吧。这一次的经历，比第一次还要惊人。
