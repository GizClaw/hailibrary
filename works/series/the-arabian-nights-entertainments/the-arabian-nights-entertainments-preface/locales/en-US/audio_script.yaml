audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Old Stories Everywhere
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Most stories in the Fairy Books are the kind that old women in the countryside tell their grandchildren. No one knows how old they are, or who first told them. Perhaps the children of Ham, Shem, and Japhet heard them in the Ark on rainy days. Perhaps Hector's little boy heard them in Troy. We can be sure that Homer knew them, and some were written down in Egypt around the time of Moses.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The details change from country to country, but underneath, they are always the same tales. Little Zulus at the Cape and little Eskimos near the North Pole know them in different forms. Manners and customs account for the differences. People may wear clothes or go without them. In warm lands they meet talking lions, while in cold lands they meet talking bears.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Fairy tales are full of kings and queens because long ago the countries themselves were full of kings. In very old Scotland, and in other places too, a gentleman who would now be called a squire was a sort of king. People never forgot these old stories. At different times, mostly during this century, they wrote them down in all kinds of languages. Those ancient tales fill the Fairy Books.
    - id: ch02
      title: The Fairy Tales of the East
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The Arabian Nights are simply the fairy tales of the East. This volume includes some of them, though far from all. People in Asia, Arabia, and Persia told these stories in their own fashion. They told them for adults, not children. There were no novels or printed books then. Instead, professional storytellers entertained men and women with tales.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Those storytellers dressed up the old fairy tales. They made the characters good Mahommedans who lived in Bagdad or India. Many adventures were said to take place during the rule of the great Caliph Haroun al Raschid, ruler of the Faithful, who lived in Bagdad from 786 to 808. The vizir who travels with him was real as well. He belonged to the great Barmecide family. The Caliph had him cruelly put to death, though no one ever knew the reason.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The stories probably took their present form long after the Caliph died, when people no longer knew exactly what had happened. At last, a storyteller wrote the tales down and fitted them into a frame. It made them seem as though a cruel Sultan's wife had told them all to him.
        - id: ch02-b04
          speaker: narrator
          text: >-
            They were probably written down around the time Edward the First was fighting Robert Bruce. Later ages kept changing them. They added many verses, along with a great deal that was dull and foolish. This book leaves out both the verses and those wearisome passages.
    - id: ch03
      title: The Nights Come to Europe
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            France and England knew almost nothing of the Arabian Nights until the reigns of Queen Anne and George the First. Then Monsieur Galland translated them into French. Adults loved fairy tales in those days, and they believed these Arab tales were the finest they had ever read.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Readers delighted in Ghouls, who lived among tombs, and in Geni, who seemed rather like ogres. They loved spell-casting Princesses and Peris, the fairies of Arabia. Some of Sindbad's adventures may have come from Homer's Odyssey. Really, the whole East had gathered up its wonders and sent them to Europe in a single parcel.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Once, in the middle of the night, young men made a clamor beneath Monsieur Galland's windows and called for one of his marvelous stories. Everyone was talking about dervishes and vizirs, rocs and peris. The tales passed from French into every language.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Only Bishop Atterbury objected. He complained that the stories were unlikely to be true and offered no moral. Before long, the bishop was banished for supporting Prince Charlie's father. That gave him plenty of time to regret being quite so solemn.
    - id: ch04
      title: This Edition
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The Arabian Nights in this book come from Monsieur Galland's French version. He had already left out the poetry. He also removed much that the Arabian authors found amusing, but that seems tiresome to us.
        - id: ch04-b02
          speaker: narrator
          text: >-
            This edition shortens the stories here and there. It also omits passages meant only for Arabs and old gentlemen. The writers of the Fairy Book tales made the translations, and Mr. Ford made the pictures.
    - id: ch05
      title: In Good Company
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            I still remember reading the Arabian Nights when I was six years old. My copies were grubby old yellow volumes, printed in tiny type and without a single picture.
        - id: ch05-b02
          speaker: narrator
          text: >-
            I hope that children reading these tales with Mr. Ford's pictures will be just as happy as I was then, keeping company with Aladdin and Sindbad the Sailor.
