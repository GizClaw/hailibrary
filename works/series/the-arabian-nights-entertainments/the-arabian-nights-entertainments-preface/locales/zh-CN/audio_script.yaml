audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
  chapters:
    - id: ch01
      title: 古老的童话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            《彩色童话集》里的那些故事，多半是乡下的老婆婆讲给孙儿孙女听的。故事究竟有多老，又是谁最先开口讲的，已经没有人知道。也许雨落个不停的时候，含、闪和雅弗的孩子们就在方舟里听过。也许赫克托耳的小儿子在特洛伊城里也听过。我们可以肯定，荷马知道这些故事，其中几篇早在摩西生活的年代，就有人在埃及写下来了。
        - id: ch01-b02
          speaker: narrator
          text: |-
            同一个故事，到了不同的国家，就有不同的讲法。可不管听故事的是好望角一带的祖鲁小孩，还是北极附近的爱斯基摩小孩，故事的骨架总没有变。变的是各地的生活习惯。有人穿衣，有人不穿。炎热地方的故事里，会说话的是狮子。寒冷地方的故事里，开口的就成了熊。
        - id: ch01-b03
          speaker: narrator
          text: |-
            童话里为什么总有那么多国王和王后？因为很久以前，各地确实有过许多国王。今天只称得上乡绅的人，在古时的苏格兰也可能算一位小国王，别的地方同样如此。这些老故事从来没有被人忘记。人们在不同年代，用各种语言把它们记在纸上，大部分直到本世纪才写成文字。这就是《彩色童话集》所收的故事。
    - id: ch02
      title: 东方的故事怎样写下来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            再说《天方夜谭》。这本书选的只是一部分，离全部还远得很。它们说到底，就是东方的童话。亚洲、阿拉伯和波斯的人按照自己的方式来讲，而且不是讲给孩子听，而是讲给大人听。当时没有小说，当然也没有印刷的书，却有专门靠说故事给男女听众解闷的人。
        - id: ch02-b02
          speaker: narrator
          text: |-
            说书人给童话换上东方的装束，让人物成为虔诚的穆斯林，住在巴格达或印度。许多事都被安排在伟大的哈里发，也就是信士们的统治者哈伦·拉希德当政的时候。他从公元786年到808年统治巴格达。常陪在哈里发身边的维齐尔并非虚构，他来自显赫的巴尔马克家族。哈里发极其残酷地处死了他，至于缘故，始终无人知晓。
        - id: ch02-b03
          speaker: narrator
          text: |-
            哈里发死去很久以后，这些故事才成了如今的样子。到那时，过去真正发生过什么，早已没人说得清了。后来，一位说书人想到把故事写下来，还给它们套上一个框架，就像这一切全是一个妻子讲给残暴苏丹听的。写成文字的年代，大概正赶上英格兰国王爱德华一世与罗伯特·布鲁斯交战。
        - id: ch02-b04
          speaker: narrator
          text: |-
            故事后来又经过许多次改动。有人往里面塞了大量诗句，也添进不少沉闷又愚蠢的篇章。我们这本书里，那些诗和乏味的部分都没有收。
    - id: ch03
      title: 《天方夜谭》来到欧洲
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            一直到安妮女王和乔治一世在位的年代，法国人和英国人对《天方夜谭》还几乎一无所知。后来，加朗先生把故事译成法文。那时的大人非常喜欢童话，一读这些阿拉伯故事，便觉得从来没有读过比它们更好的。
        - id: ch03-b02
          speaker: narrator
          text: |-
            住在坟墓间的食尸鬼、仿佛食人魔的精灵、会施魔法的公主，还有阿拉伯仙子佩里，全都让他们神魂颠倒。辛巴达的奇遇也许来自荷马的《奥德赛》。其实，整个东方都拿出了自己的奇观，把它们打成一包，送到了欧洲。
        - id: ch03-b03
          speaker: narrator
          text: |-
            有一回，一群年轻人在半夜跑到加朗先生窗外大声吵闹，非要他讲一个神奇故事不可。人人谈的都是托钵僧和维齐尔、大鹏鸟和佩里。故事又从法文译成各种语言。只有阿特伯里主教抱怨，说这些事不像真的，也没有什么教训。没过多久，他因为站在查理王子父亲一边，被流放了。这样一来，他有的是时间后悔自己当初何必那么严肃。
        - id: ch03-b04
          speaker: narrator
          text: |-
            本书的《天方夜谭》依据加朗先生的法译本译出。原来的阿拉伯作者觉得可笑的内容，有很多在我们看来只觉厌烦，加朗便把它们和诗歌一起删了。这本书还在几处缩短了故事，略去的只是那些仅适合阿拉伯人和上了年纪的先生阅读的段落。译文由《彩色童话集》各篇故事的作者完成，图画则出自福特先生之手。
        - id: ch03-b05
          speaker: narrator
          text: |-
            我还记得自己六岁时读《天方夜谭》的情景。那套书又旧又脏，纸页泛黄，字印得很小，连一幅图也没有。如今的孩子能看着福特先生的插图来读这些故事。我只盼他们与阿拉丁和航海家辛巴达相伴时，也会像六岁时的我一样快乐。
