        timbre: 清晰圆润
        pace: 适中
        pitch: 中音
    persian_merchant:
      display_name: 波斯商人
      tts:
        delivery: 谦恭诚恳，谈及商品时自信而克制
        timbre: 温和清晰
        pace: 从容
        pitch: 中音
    fair_persian:
      display_name: 美丽的波斯女郎
      tts:
        delivery: 聪慧真挚，欢喜时明快，忧伤时含蓄动人
