      display_name: 哈里发
      tts:
        delivery: 威严果断，讥讽时不动声色
        timbre: 深沉清晰
        pace: 稳健
        pitch: 低音
  chapters:
    - id: ch01
      title: 一万枚金币
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            巴士拉长久向哈里发称臣。哈伦·拉希德在位时，那里的国王是他的堂弟穆罕默德·齐奈比。国王设了两位维齐尔。一位叫卡坎，仁厚大方，只要办得到，他从不拒绝求助的人，因此举国都敬重他。

            另一位叫索维。他冷酷、阴沉，明明家财万贯，却连日常需用都舍不得买。他尤其仇视卡坎，总在国王面前说他的坏话。

            一天，国王与维齐尔和大臣们闲谈，说起什么样的女奴才算出众。有人说美貌就够了，也有人说，她还得聪慧明理，端庄自重，最好又有才学。卡坎赞同后一种说法，国王也很赞同，当场命他去寻找这样的人。
        - id: ch01-b02
          speaker: saouy
          text: 陛下，才貌都这样出众的女子，只怕很难找。就算找到了，花一万枚金币也不算贵。
        - id: ch01-b03
          speaker: basra_king
          text: 索维，你觉得一万枚金币是天大的数目。对你或许是，对我可不是。
        - id: ch01-b04
          speaker: narrator
          text: |-
            国王马上叫在场的大司库拨给卡坎一万枚金币，专门用来购买女奴。卡坎回家后，把贩卖女奴的商人们都召来，详细说明自己的要求，叫他们一找到合适的人便立刻来报。商人们答应尽力去办。此后，没有一天不带人来让他挑选，卡坎却每次都能看出这样或那样的不足。

            终于有一天早晨，一个商人拦住正要进宫的卡坎，告诉他，昨夜有位波斯商人进城，带来一个才智和美貌都无人能比的女奴。卡坎请他下午把人带来。等他真正见到她，才发现她比自己想象的还要美，便给她取名“美丽的波斯女郎”。

            卡坎自己学识渊博，也很有见识。他只同波斯女郎说了几句话，就知道在国王要求的每一项才德上，都不可能再找到一个胜过她的人。他便问奴隶商人，原主要价多少。
        - id: ch01-b05
          speaker: slave_merchant
          text: 大人，少于一万枚金币，原主绝不肯卖。他说，光是请师傅教她学问和强身的本领，再加上多年的衣食，花费就不止这些。她什么乐器都会，还能唱歌、跳舞、作诗，完全配得上侍奉国王。
        - id: ch01-b06
          speaker: kakkan
          text: 我买她不是留给自己，而是要献给国王。不过，你开的价的确太高了。
        - id: ch01-b07
          speaker: persian_merchant
          text: 大人，要是我不是个商人，我真愿意直接把她献给陛下，那是我的荣耀。我现在所要的，只是培养她所花的本钱。
        - id: ch01-b08
          speaker: narrator
          text: 卡坎不再讨价还价，当即付了金币。波斯商人离开前，又特意叮嘱他。
        - id: ch01-b09
          speaker: persian_merchant
          text: 她赶了很长的路，已经累坏了。既然要献给国王，最好先留她在府上住半个月，好好调养。烈日把她晒黑了，等她沐浴两三次，再换上合身的衣裳，您会看见她还能美上许多。
        - id: ch01-b10
          speaker: narrator
          text: 卡坎谢过商人的提醒，决定照他说的办。他把波斯女郎安置在妻子寝室附近的一间屋里，嘱咐妻子，要按照未来王妃应有的体面来照顾她，还特地替她定制最华美的衣裳。临走以前，他又把波斯女郎叫到跟前，认真提醒她。
        - id: ch01-b11
          speaker: kakkan
          text: 我已经替你找到最大的福分，你很快就会属于国王。但我必须提醒你，我有个儿子，他不笨，只是年轻任性，做事莽撞。你一定要躲着他。
        - id: ch01-b12
          speaker: fair_persian
          text: 谢谢大人告诫，我会牢牢记住。
    - id: ch02
      title: 一场风波，一段婚姻
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            卡坎的儿子就是努尔丁。他年轻俊秀，体态优美，又能自由出入母亲的寝室。凡是同他来往的人，都会被他的风度吸引。他第一眼看见波斯女郎，就对她着了迷。他明知她将被献给国王，还是立刻打定主意，无论想什么办法，都要把她留给自己。

            波斯女郎也爱上了努尔丁。在她看来，维齐尔愿把她献给国王虽是抬举，可要是能嫁给努尔丁，她才真的心满意足。努尔丁一有机会就来陪她说笑，若不是母亲硬赶他走，他简直一步都不愿离开。

            五六天后，维齐尔夫人让人烧好浴室，又命女奴们伺候波斯女郎沐浴更衣。她梳妆好来到夫人面前时，美得连夫人几乎都认不出了。
        - id: ch02-b02
          speaker: fair_persian
          text: 夫人，您觉得我穿这身衣裳好看吗？侍女们都说太合身了，她们差点认不出我。要是她们没在奉承我，这一切都是您的恩赐。
        - id: ch02-b03
          speaker: kakkan_wife
          text: 好孩子，她们说的是真话，连我也差点没认出你。不过，这可不全是衣裳的功劳。洗过澡以后，你比先前更有光彩了。效果这么好，我也想去试试。
        - id: ch02-b04
          speaker: narrator
          text: |-
            夫人说做便做。临走时，她留下两个小女奴照看波斯女郎，严令她们，努尔丁若来，绝不能放他进去。可她刚刚离开，努尔丁就到了。他在母亲房里找不到人，便径直去波斯女郎的住处。两个小女奴挡在门前，说夫人有令，不许他进去。努尔丁一手抓住一个，把她们拖出前厅，然后关上了房门。两个女孩哭叫着奔到浴室告状，说努尔丁已经强行闯了进去。

            夫人惊慌地穿好衣服，赶到波斯女郎房里，努尔丁却已经走了。波斯女郎见她流着泪，忙问发生了什么不幸的事。
        - id: ch02-b05
          speaker: kakkan_wife
          text: 你还问发生了什么？刚才你明明和我儿子努尔丁单独在这里！
          emotion: angry
        - id: ch02-b06
          speaker: fair_persian
          text: 可是夫人，这有什么不对吗？
          emotion: surprised
        - id: ch02-b07
          speaker: kakkan_wife
          text: 怎么会没有不对？我丈夫难道没告诉你，你是要献给国王的吗？
        - id: ch02-b08
          speaker: fair_persian
          text: 他当然说过。可努尔丁刚才告诉我，他父亲改了主意，已经把我送给他了。我信了他。而且我爱努尔丁，要是能跟他一起过一辈子，我心甘情愿。
        - id: ch02-b09
          speaker: kakkan_wife
          text: 愿苍天保佑，让你说的都是真的！可努尔丁骗了你。他父亲一定会认为这是莫大的羞辱，他会杀了这个孩子的。
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: |-
            夫人放声痛哭，女奴们也跟着掉泪。不久，卡坎走了进来。他看见妻子和女奴们满脸是泪，波斯女郎又惊慌不安，便一再追问原因。众人许久都不敢开口。等妻子终于平静下来，将一切都告诉他，卡坎又羞又怒，绞着双手，撕扯胡须，几乎发了狂。
        - id: ch02-b11
          speaker: kakkan
          text: 这个孽子！他毁掉的不只是自己，还有他的父亲。国王既会要他的命，也会要我的命！
          emotion: angry
        - id: ch02-b12
          speaker: kakkan_wife
          text: 您别再这样折磨自己了。我把首饰卖掉，就能凑出一万枚金币。您拿这笔钱再买一个女奴吧。
        - id: ch02-b13
          speaker: kakkan
          text: 你以为我痛苦的是损失了钱吗？现在危在旦夕的是我的名誉，它比我所有财富都更珍贵。索维是我的死敌。他一旦听说此事，必定会去告诉国王，后果你自己也想得到。
        - id: ch02-b14
          speaker: kakkan_wife
          text: 我知道索维卑鄙，也知道他做得出这种事。可他怎么会知道我们家里发生了什么？就算有人怀疑，国王来问，您只要说验看以后发现她配不上陛下。您放宽心，告诉商人说您不满意，让他们继续去找就是了。
        - id: ch02-b15
          speaker: narrator
          text: |-
            卡坎觉得这办法很有道理，决定照办，但他对努尔丁依旧怒火难消。努尔丁一整天都不敢露面。他怕躲到常去的朋友家会被父亲找到，便藏进一座无人认识他的偏僻花园，在那里一直挨到天黑。父亲睡下后，他才悄悄回家，第二天一早，又赶在卡坎醒来之前出门。这样小心躲避，过了整整一个月。

            母亲明知他每晚都会回来，却一直不敢求丈夫宽恕。最后，她终于鼓起了勇气。
        - id: ch02-b16
          speaker: kakkan_wife
          text: 老爷，努尔丁这样对待父亲，当然再不孝不过。可事已至此，您能不能饶了他？你们父子长久不和，反而会害了您。要是有心怀恶意的人追查原因，说不定会猜到真相。
        - id: ch02-b17
          speaker: kakkan
          text: 你说得对。但我必须让努尔丁受到应有的羞辱，然后才能饶他。
        - id: ch02-b18
          speaker: kakkan_wife
          text: 那就照我的办法做。今晚他回来时，您躲在暗处，假装要杀他。我会赶来救他。您就说是我苦苦哀求，才饶他一命，再逼他接受您娶波斯女郎的条件。
        - id: ch02-b19
          speaker: narrator
          text: 卡坎同意了。当晚努尔丁回家，一切果然照计策发生。卡坎假装要杀儿子，直到妻子哀求，他才让步。
        - id: ch02-b20
          speaker: kakkan
          text: 是你母亲救了你的命。看在她的分上，我饶了你。但你必须答应几个条件。你要娶美丽的波斯女郎为妻，绝不能把她当成女奴。你永远不得卖她，也不得休弃她。
        - id: ch02-b21
          speaker: noureddin
          text: 父亲，我没想到您会这样宽厚。谢谢您饶了我。我发誓，一定遵守您所有的吩咐。
        - id: ch02-b22
          speaker: narrator
          text: |-
            此后，卡坎屡次在国王面前诉说这件差事有多难，想尽办法把它拖延下去。可家里的真相还是泄露了几句，最终传到索维耳中。

            一年多以后，卡坎刚洗完澡，身上的热气还没退，就为一桩紧急公务冒着寒冷出门。他因此受了凉，接着肺部发炎，病情很快变得严重。自知就要离世时，他把努尔丁叫到身边，在临终前再三叮嘱儿子，无论发生什么事，永远都不要同美丽的波斯女郎分离。

            不久，卡坎便与世长辞。举国都在哀悼他，无论贫富，人人都来送葬。
    - id: ch03
      title: 败尽家业
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            努尔丁失去父亲，悲痛得很久不肯见人。后来，一位朋友终于得到允许，进来劝他节哀，也劝他重新出去交游。努尔丁很快听从了。他结交了十个年纪相仿的青年，从此天天设宴取乐。

            波斯女郎偶尔也在宴席上露面。她不赞成丈夫这样花钱，一再提醒他，长此下去必有后患。努尔丁却笑她多虑，只说父亲从前管得太严，自己如今重获自由，正该快活。
        - id: ch03-b02
          speaker: narrator
          text: 管家几次捧着账簿来，想同他核对收支，他也不肯过问。
        - id: ch03-b03
          speaker: noureddin
          text: 你只管让我过得舒坦，别拿账目这些事来烦我。
        - id: ch03-b04
          speaker: narrator
          text: 那些朋友不只享用他的酒宴，还处处占他的便宜。他们无论看中了努尔丁的土地、房屋、浴场，还是别的进项，只要开口讨要，他就立刻慷慨相赠。波斯女郎一次次告诉他，这样做是在坑害自己。她怎样苦劝，也拦不住他把父亲辛苦积攒的家财大把散出去。
        - id: ch03-b05
          speaker: narrator
          text: |-
            整整一年，努尔丁除了享乐，就是挥霍父亲留下的财富。一年刚过，众人又在宴饮时，门外忽然响起敲门声。家里的奴仆已经全被遣散，努尔丁只好亲自去开门。一位朋友也站起身来，却没他走得快，便藏到帷幕后偷听。

            门外站着管家。努尔丁走出去，随手关上了门。
        - id: ch03-b06
          speaker: steward
          text: 老爷，请原谅我冒昧来打扰。可我早就担心的事，今天还是发生了。您交给我支付日常开销的钱，一枚也没剩。别的进项也都送了人，往后再没有收入。您若还要我服侍，就请给我维持家用的钱。不然，我只能告退了。
        - id: ch03-b07
          speaker: narrator
          text: 努尔丁惊得说不出话。帷幕后面的朋友马上溜回席间，把听到的消息告诉了其他人。
        - id: ch03-b08
          speakers: [friend_1, friend_2, friend_3]
          ensemble: chorus
          text: 要真是这样，我们以后可不能再来了。
        - id: ch03-b09
          speaker: narrator
          text: 努尔丁恰好回到屋里。尽管他极力掩饰，众人还是看出消息不假。他们接连起身，各找一个借口告辞。转眼间，努尔丁便孤零零地留在席上，却还没猜到朋友们已经打定了什么主意。波斯女郎出来后，他懊悔不已，把管家的话告诉了她。
        - id: ch03-b10
          speaker: noureddin
          text: 美丽的波斯女郎，我当初要是听你的，就不会落到今天。好在这些钱都花给了朋友。到了危难的时候，他们总不会丢下我。明天我就去找他们，大家凑一凑，借我一笔本钱，我还能做生意重新起家。
        - id: ch03-b11
          speaker: narrator
          text: |-
            第二天一早，努尔丁便去拜访那十位朋友。他们都住在同一条街。他先去敲那位首领家的门。开门的奴仆请他在前厅等候，自己进去通报。努尔丁却清清楚楚听见里面有人高喊，要奴仆告诉他主人不在，以后无论他什么时候来，都要这样回答。

            第二家这样，第三家也这样。十家没有一家肯见他。直到这时，努尔丁才明白，那些人全是假朋友，一见他落难就把他抛弃了。他又羞又痛，只得回家向波斯女郎求安慰。
        - id: ch03-b12
          speaker: fair_persian
          text: 唉，老爷，您现在总算相信我从前的担忧了。我们已经没有别的办法，只能先卖掉家里的奴仆和家具。
        - id: ch03-b13
          speaker: narrator
          text: 努尔丁先卖了奴仆，靠这笔钱过了一阵。接着，他又把许多贵重家具卖掉，所得的钱也渐渐花完。最后，家中再没有东西可卖，他只好又问波斯女郎怎么办。
        - id: ch03-b14
          speaker: fair_persian
          text: 老爷，您父亲当年用一万枚金币买下我。如今我的身价就算不如从前，应该还能卖到不少钱。别再犹豫了，把我卖掉吧。拿到钱以后，您可以去远方的另一座城做生意，重新安顿下来。
        - id: ch03-b15
          speaker: noureddin
          text: 迷人的波斯女郎，我怎么能做这种卑鄙的事？你比我的性命还珍贵。我宁可死，也绝不会离开你。
        - id: ch03-b16
          speaker: fair_persian
          text: 老爷，我知道您多么爱我，因为我也同样爱您。可眼前的困境太残酷了，我们实在只剩这一个办法。
        - id: ch03-b17
          speaker: narrator
          text: |-
            努尔丁终于让步，依依不舍地带她来到奴隶市场。他找到商人哈吉·哈桑，请对方看看她值多少。哈吉·哈桑把两人领进一间僻静屋子。波斯女郎才揭开面纱，他便认出，这正是卡坎当年用一万枚金币买下的女子。

            哈吉·哈桑答应尽力替她卖出高价。他先把波斯女郎锁在屋里，再召集其他奴隶商人，说自己找到了女奴中的明珠。商人们看过以后，都认为起价不能少于四千枚金币。哈吉·哈桑于是站到外面高声叫卖。
        - id: ch03-b18
          speaker: haji_hassan
          text: 谁肯出四千枚金币，买下这位波斯女奴？
        - id: ch03-b19
          speaker: narrator
          text: |-
            众人还没来得及出价，索维恰好骑马经过。他听见四千枚金币的开价，断定这女奴必定美貌非凡，便来到哈吉·哈桑面前，命他让自己看上一眼。按市场规矩，女奴本不能给尚未出价的人看。可索维是维齐尔，谁也不敢违抗，只得满足他的要求。

            索维一见波斯女郎，便被她的美貌震住，一心要占有她。他还不知道原主就是努尔丁，立刻叫哈吉·哈桑把人找来，谈妥这笔买卖。哈吉·哈桑找到努尔丁，先提醒他，这个价钱远远配不上波斯女郎。若卖给索维，以那人的品性，甚至可能拿了人却不付钱。接着，他压低声音说出一个计策。
        - id: ch03-b20
          speaker: haji_hassan
          text: 你要装作从没真想卖她，只是生气时赌咒要把她送来。等我假装得到你的许可，要把她交给索维，你就冲出来打她几下，再硬把她带走。
        - id: ch03-b21
          speaker: narrator
          text: |-
            努尔丁照计策行事。索维顿时勃然大怒，纵马直冲过来，想从努尔丁手中强行夺走波斯女郎。努尔丁先放开她，再一把抓住索维坐骑的缰绳。旁观的人纷纷喝彩助威，他便把索维从马上拖下来，狠狠痛打一顿，直打得那个维齐尔鲜血淋漓，又把人扔进阴沟。

            随后，努尔丁领着波斯女郎回家。百姓痛恨索维，一路欢呼，既没人替他解围，也不许他的奴仆上前相救。
        - id: ch03-b22
          speaker: narrator
          text: 索维满身污泥和鲜血，在两个奴仆搀扶下勉强爬起来。他径直进宫，向国王哭诉。
        - id: ch03-b23
          speaker: saouy
          text: |-
            请陛下明察。臣到奴隶市场，本想买个厨娘，却听见有人叫卖一名女奴，开价四千枚金币。臣看过才发现，她美貌无双，卖她的正是已故维齐尔之子努尔丁。

            陛下当年赐给卡坎一万枚金币，要他买一个女奴。如今叫卖的正是那个人。卡坎没有把她献给陛下，反而给了自己的儿子。努尔丁在父亲死后耗尽家产，卖光产业，现在连她也拿出来卖。

            臣对他说，愿出一万枚金币买下女奴献给陛下，还会替他在陛下面前美言，这远胜商人多给的几个钱。他却骂臣是恶毒的老东西，宁可把女奴送给犹太人，也不卖给臣。臣提醒他，这样说是在冒犯陛下，他反倒更加疯狂，把臣拖下马，任意毒打。臣如今这副模样，全是他害的。
          emotion: sad
        - id: ch03-b24
          speaker: narrator
          text: 索维说完便转过脸痛哭。国王听信了这番话，对努尔丁怒不可遏。他命侍卫长带四十人去洗劫努尔丁的家，把房子夷平，再将努尔丁和波斯女郎一并押来。
        - id: ch03-b25
          speaker: narrator
          text: |-
            一个名叫桑吉亚尔的守门人听见了命令，悄悄溜出御前。他从前是卡坎的奴仆，如今飞奔去给努尔丁报信，催他马上带波斯女郎逃走。他又送给努尔丁四十枚金币，没等对方开口道谢便消失了。

            波斯女郎蒙好面纱，两人立刻出逃。他们没有被人发现，顺利出了城，来到幼发拉底河口。那里正有一艘船要开往巴格达，他们登船后，船便起锚扬帆。
        - id: ch03-b26
          speaker: narrator
          text: 侍卫长带兵赶到努尔丁家，命人破门而入，却没有找到努尔丁和他的女奴，四邻也提供不了半点消息。国王得知两人逃走，随即张贴告示。无论是谁，只要把他们捉来，便赏一千枚金币。反过来，谁敢藏匿他们，必受重罚。
    - id: ch04
      title: 花园里的夜宴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            此时，努尔丁和波斯女郎已经平安到了巴格达。他们付过五枚金币船资，走上岸来。两人从未来过这里，不知道该到哪里投宿，只能沿着底格里斯河岸向前走。

            他们来到一座高墙环绕的花园外。大门已经关了，门前却有一间敞开的前厅，两边各放着一张长榻。
        - id: ch04-b02
          speaker: noureddin
          text: 今晚我们就在这里过夜吧。
        - id: ch04-b03
          speaker: narrator
          text: |-
            两人各自躺在一张长榻上，很快睡着了。这座花园其实属于哈里发。园子中央有一座宏伟楼阁，华丽的大厅开着八十扇窗，每扇窗上都挂着枝形灯。只有哈里发来这里消夜时，所有灯才会点亮。

            园中只住着一个守门人，名叫谢赫·易卜拉欣，是个退伍老兵。哈里发严令他仔细盘查每一个进园的人，更不许任何人坐在门前的长榻上。那天晚上，老人恰好外出办事。他回来发现两人睡在榻上，本想拿棍子把他们赶走。可走近一看，原来是个俊秀青年和一位美丽女子，便收起棍子，改为温和地将他们唤醒。

            努尔丁告诉老人，他们是外乡人，只想借这里过一夜。老人听完，邀他们跟自己进去。
        - id: ch04-b04
          speaker: sheikh_ibrahim
          text: 跟我来吧。我给你们找个更好的住处，再领你们看看我那座美丽的花园。
        - id: ch04-b05
          speaker: narrator
          text: |-
            他把两人带进了哈里发的花园，却说这是自己的产业。园中景色让客人赞叹不已。努尔丁拿出两枚金币交给老人。
        - id: ch04-b06
          speaker: noureddin
          text: 麻烦您替我们买些吃的回来，今晚大家一起快活。
        - id: ch04-b07
          speaker: narrator
          text: |-
            谢赫·易卜拉欣十分贪财，打算只花掉金币的十分之一，其余全收进自己口袋。他走后，努尔丁和波斯女郎四处游赏，又登上白色大理石阶梯，来到上锁的大厅门前。

            老人回来后，两人央求他开门，让他们看看里面的陈设。他答应了，不但取来钥匙，还带来一盏灯，立刻打开房门。大厅的富丽堂皇让两人看得目眩神迷。墙上的绘画和屋里的家具，没有一样不精美。每两扇窗之间，还伸出一条银臂，上面托着蜡烛。

            老人在长榻前摆好饭桌，三人一起吃了晚饭。饭后，努尔丁请他再拿一瓶酒来。
        - id: ch04-b08
          speaker: sheikh_ibrahim
          text: 愿苍天保佑，让我离酒远远的！我去麦加朝觐过四次，早就发誓再也不喝了。
        - id: ch04-b09
          speaker: noureddin
          text: 您只要替我们买来，就是帮了大忙，不必亲手碰酒。门口拴着一头驴，您把它牵到最近的酒铺，请路人代买两坛，让他把酒坛放进驴背两边的筐里，再赶回来。这两枚金币给您花用。
        - id: ch04-b10
          speaker: narrator
          text: |-
            谢赫·易卜拉欣一见金币，马上动身照办。等他带着两坛酒回来，努尔丁又说，他们还少了喝酒的杯子，若能再添些水果就更好了。老人只好又跑了一趟，不久便带回一桌金杯银盏和各色鲜美水果。两人一再请他同坐，他还是退了出去。

            努尔丁和波斯女郎尝到酒味香醇，便一边饮酒，一边唱歌。他们都有一副好嗓子。老人越听越陶醉，起初站得很远，后来一点点靠近，最后把头探进了门。
        - id: ch04-b11
          speaker: narrator
          text: 努尔丁看见他，又邀他进来作伴。老人起先不肯，后来经不住两人再三劝说，终于走进大厅。他先在靠门的长榻边沿坐下，过了一会儿，又一点点挪近，坐到波斯女郎身旁。她一再请老人喝一杯，为自己祝福。老人这才让步，接过她递来的酒杯。
        - id: ch04-b12
          speaker: narrator
          text: |-
            其实，他戒酒的说法全是装的。他也常去酒铺，买酒时根本没用努尔丁教的那些遮掩办法。第一杯既已下肚，第二杯、第三杯也就不难了。老人一杯接一杯，最后连自己在做什么都不知道。三个人喝酒、说笑、唱歌，一直热闹到快半夜。

            波斯女郎见偌大的厅里只有一根寒酸的牛油蜡烛，便请老人点亮银臂上的几根好蜡烛。
        - id: ch04-b13
          speaker: sheikh_ibrahim
          text: 你比我年轻，还是自己去点吧。不过，五六根就够了。
        - id: ch04-b14
          speaker: narrator
          text: 波斯女郎却一根接一根，把八十根蜡烛全点亮了。老人已经醉得毫无察觉。过了一会儿，努尔丁又提议点几盏枝形灯。
        - id: ch04-b15
          speaker: sheikh_ibrahim
          text: 你点灯也比我在行。不过，可别超过三盏。
        - id: ch04-b16
          speaker: narrator
          text: 努尔丁哪里肯只点三盏。他点亮所有枝形灯，又将八十扇窗全部打开。整座楼阁顿时灯火辉煌。
    - id: ch05
      title: 乔装的哈里发
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 恰在这时，哈里发哈伦·拉希德推开王宫大厅里一扇正对花园的窗。他看见楼阁亮如白昼，十分吃惊，立刻召来大维齐尔贾法尔。
        - id: ch05-b02
          speaker: caliph
          text: 失职的维齐尔，你看看那座楼阁。我不在那里，里面为什么灯火通明？
        - id: ch05-b03
          speaker: narrator
          text: 贾法尔一看，吓得浑身发抖，只好赶紧编出一个解释。
        - id: ch05-b04
          speaker: jaafar
          text: 信士的统帅，臣不得不禀告您。四五天前，谢赫·易卜拉欣说，他要请清真寺的执事们聚会，想借用那座楼阁。臣答应了，后来却忘了向陛下禀报。
          emotion: fearful
        - id: ch05-b05
          speaker: caliph
          text: 贾法尔，你犯了三项错。你不该答应他，不该瞒着我，更不该连事情怎样安排都不过问。罚你今夜陪我去会会那些体面人物。我换上平民衣服，你也去乔装，然后随我前往。
        - id: ch05-b06
          speaker: narrator
          text: |-
            两人来到花园门口，发现连大门都敞开着，哈里发更加生气。走到楼阁前，那里竟也没有关门。他悄悄登上楼梯，从大厅半掩的门后向里张望，竟看见素来被自己当作滴酒不沾之人的谢赫·易卜拉欣，正陪着一位青年和一位美丽女子饮酒唱歌。

            哈里发惊讶归惊讶，却没有立刻发火。他想先看清这些人是谁，又在做些什么。过了一会儿，老人问波斯女郎，今夜还少些什么才能让她尽兴。
        - id: ch05-b07
          speaker: fair_persian
          text: 只可惜这里没有乐器，不然我还能弹一曲。
        - id: ch05-b08
          speaker: narrator
          text: 谢赫·易卜拉欣马上从橱柜取出一把鲁特琴交给她。波斯女郎一边弹奏，一边歌唱。她的琴艺精妙，歌声里的情意也格外动人，连躲在门外的哈里发都听得入了迷。等她唱完一曲，哈里发才悄悄走下楼去见贾法尔。
        - id: ch05-b09
          speaker: caliph
          text: 我从没听过这样美的歌声，也没听过谁能把鲁特琴弹得这样好。我一定要进去，请她再为我演奏。
        - id: ch05-b10
          speaker: jaafar
          text: 信士的统帅，要是谢赫·易卜拉欣认出您，只怕会活活吓死。
        - id: ch05-b11
          speaker: caliph
          text: 我可不想让他吓死。放心，我自有办法。你留在这里等我回来。
        - id: ch05-b12
          speaker: narrator
          text: |-
            哈里发曾命人引来一弯河水，在花园里汇成湖泊。湖里养着底格里斯河最肥美的鱼，却严禁任何人捕捞。偏偏那天夜里，一个渔夫看见园门敞开，便溜进来撒了网。

            渔夫正要收网，哈里发迎面走来。哈里发虽已乔装，渔夫还是一眼认出了他，马上伏在他脚下求饶。
        - id: ch05-b13
          speaker: caliph
          text: 不必害怕。起来，把网拉上来。
        - id: ch05-b14
          speaker: narrator
          text: |-
            渔夫听命收网，一下捞起五六条肥鱼。哈里发从中挑走最大的两条，又命渔夫同自己交换全身衣服。不一会儿，他从脚上的鞋到头上的头巾，全都变成了渔夫的模样。

            哈里发提着鱼回到贾法尔那里。贾法尔竟没认出他，还想赶他走。哈里发表明身份后，把维齐尔留在楼梯下，自己上楼敲门。努尔丁打开门，只见一个渔夫站在外面。
        - id: ch05-b15
          speaker: caliph
          text: 谢赫·易卜拉欣，我是渔夫卡里姆。看见你和朋友们在这里饮宴，特地送两条鱼来。
        - id: ch05-b16
          speaker: narrator
          text: 努尔丁和波斯女郎说，只要能把鱼好好烹调，他们很愿意尝尝。哈里发便回到贾法尔身边，两人一起到谢赫·易卜拉欣的住处动手烹鱼，做出一盘香气诱人的菜，再端回大厅。努尔丁和波斯女郎吃得津津有味。
        - id: ch05-b17
          speaker: narrator
          text: 饭后，努尔丁取出桑吉亚尔送给他的那笔钱。一路花费下来，此刻只剩三十枚金币，他却把这些钱全部赠给了眼前的渔夫。哈里发谢过这份慷慨，又请波斯女郎行个方便，为自己再弹奏一曲。她欣然答应，一边弹琴，一边歌唱，再次令哈里发心醉神迷。
        - id: ch05-b18
          speaker: noureddin
          text: 渔夫，既然你这样喜欢她，那就把她带走吧。从今以后，她属于你了。
        - id: ch05-b19
          speaker: narrator
          text: 波斯女郎没想到他竟要同自己分离，震惊极了。她抱起鲁特琴，眼里含着泪，把对努尔丁的怨诉唱进琴声。
        - id: ch05-b20
          speaker: caliph
          text: 大人，我看得出，这位美丽姑娘是您的女奴。能不能赏脸，把您的身世讲给我听听？
        - id: ch05-b21
          speaker: narrator
          text: 努尔丁爽快地答应了。他从父亲买下波斯女郎说起，把此后的一切一直讲到眼前。哈里发听完，又问他下一步准备去哪里。
        - id: ch05-b22
          speaker: noureddin
          text: 安拉的手把我引到哪里，我就去哪里。
        - id: ch05-b23
          speaker: caliph
          text: 那么，你若肯听我的劝，就立刻回巴士拉去。我替你给国王写一封信。他看过信，一定会好好接待你。
        - id: ch05-b24
          speaker: noureddin
          text: 一个渔夫竟能写信给国王，这种奇事我可从没听过。
        - id: ch05-b25
          speaker: caliph
          text: 别惊讶。我们从前一同求学，一直是最好的朋友。只是命运让他做了国王，却让我成了一个卑微的渔夫。
        - id: ch05-b26
          speaker: narrator
          text: 哈里发取来纸笔。信的顶端，他用极小的字写下“奉至仁至慈的安拉之名”，表示收信人必须绝对服从。随后，他写道。
        - id: ch05-b27
          speaker: caliph
          text: |-
            哈里发哈伦·拉希德致巴士拉国王书。

            马赫迪之子哈伦·拉希德，致信堂弟穆罕默德·齐奈比。维齐尔卡坎之子努尔丁持信到达后，你读完就要立刻脱下王袍，披到他的肩上，再让他坐上你的王位，不得违误。就此别过。
        - id: ch05-b28
          speaker: narrator
          text: |-
            哈里发把信交给努尔丁。努尔丁带着桑吉亚尔所赠钱财中剩下的那一点，马上启程。波斯女郎见他离开，悲痛欲绝，倒在长榻上，泪水流了满脸。

            努尔丁走后，一直没出声的谢赫·易卜拉欣终于开了口。
        - id: ch05-b29
          speaker: sheikh_ibrahim
          text: 卡里姆，你拿两条不值钱的鱼，换来一袋钱和一个女奴。我可先说明，女奴归我。钱袋里若是银币，你可以拿一枚。若是金币，那就全归我，我把里面那几枚铜币给你。
        - id: ch05-b30
          speaker: narrator
          text: |-
            原来，哈里发方才端鱼上楼时，曾命贾法尔立即回宫，带四名奴仆和一套王服来，在楼阁外等候。只要听见他拍手，众人便立刻进来。此刻，那些人已经到了。

            哈里发仍装成渔夫，回答老人。
        - id: ch05-b31
          speaker: caliph
          text: 谢赫·易卜拉欣，不管钱袋里装的是什么，我都同你平分。女奴却要归我。你若不答应，就一样也得不到。
        - id: ch05-b32
          speaker: narrator
          text: 老人觉得受了冒犯，气得抓起酒杯朝哈里发扔去。醉汉扔来的东西，哈里发轻易躲开。酒杯撞墙摔碎，老人更加愤怒，跑出去找棍子。哈里发趁机拍了拍手。贾法尔和四名奴仆马上进来，脱去他的渔夫衣裳，替他换上王服。
        - id: ch05-b33
          speaker: narrator
          text: 谢赫·易卜拉欣提着粗棍回来时，哈里发已经端坐在宝座上，地板中央只剩那套渔夫衣服。老人吓得立刻扑倒在哈里发脚下。
        - id: ch05-b34
          speaker: sheikh_ibrahim
          text: 信士的统帅，您卑贱的奴仆冒犯了您，求您宽恕！
          emotion: fearful
        - id: ch05-b35
          speaker: caliph
          text: 起来吧，我饶恕你。
          emotion: calm
        - id: ch05-b36
          speaker: narrator
          text: 哈里发走下宝座，转向波斯女郎。
        - id: ch05-b37
          speaker: caliph
          text: 美丽的姑娘，你现在知道我是谁了。你还要知道，我已派努尔丁去巴士拉继承王位。等一切安排妥当，我会送你去做王后。在此之前，我会在王宫里给你一处住所，让你得到最尊贵的礼遇。
        - id: ch05-b38
          speaker: narrator
          text: 波斯女郎听了，这才重新振作。哈里发信守承诺，把她交给自己的妻子祖贝达照料。
    - id: ch06
      title: 刑场前的骑兵
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 努尔丁一路兼程赶回巴士拉。他一进城便直奔王宫，请求觐见。国王准许后，他把书信高举过头，从人群中挤到御前。国王读着信，脸色突然变了。他本来就要依照哈里发的命令行事，却先把信递给索维。索维的利害得失，也全系在这张纸上。
        - id: ch06-b02
          speaker: narrator
          text: 索维装作要再看一遍，侧身走到光亮处。他趁无人留意，撕下信顶端那句训令，塞进嘴里吞掉，然后转身对国王开口。
        - id: ch06-b03
          speaker: saouy
          text: 陛下不必服从这封信。字迹的确是哈里发的，可上面没有训令。他也没派使者送来正式诏书。没有诏书，这封信便不能作数。请把这件事交给臣，所有后果都由臣承担。
        - id: ch06-b04
          speaker: narrator
          text: |-
            国王听从了索维，还把努尔丁交给他处置。索维先命人把努尔丁打得半死，再投入最深、最黑的地牢，每天只给他面包和清水。

            十天后，索维决定杀死他，却不敢不经国王准许便下手。他命自家的几个奴仆捧着厚礼，带到国王面前，谎称这些都是新王登基以后送来的礼物。
        - id: ch06-b05
          speaker: basra_king
          text: 什么！那个恶徒竟然还活着？马上去砍下他的头。我准你行刑。
          emotion: angry
        - id: ch06-b06
          speaker: saouy
          text: 多谢陛下替臣主持公道。臣还有一事恳请恩准。努尔丁曾当众羞辱臣，请把刑场设在王宫门前，再通告全城，让人人都知道他今天伏法。
        - id: ch06-b07
          speaker: narrator
          text: |-
            国王答应了。告示传遍全城，百姓无不悲痛，因为他们一直记得努尔丁父亲的恩德。

            索维带着二十个自家奴仆到监狱，把努尔丁提出来，逼他骑上一匹没有马鞍的劣马。到了王宫，索维独自进去见国王，把努尔丁留在广场上。索维的奴仆紧紧围住他，外围还有王家卫兵。百姓几次想冲过去救人，卫兵费尽力气才将他们拦下。

            人们恨透了索维。只要当时有人带头，索维穿街而来时，早被石头砸死了。他从国王内室的窗边看到人群骚动，便高声催刽子手立刻行刑。
        - id: ch06-b08
          speaker: narrator
          text: 国王却叫刽子手暂且住手。他一来不满索维越过自己，竟敢擅自向刽子手发号施令，二来还看见一队骑兵正朝广场飞驰而来。索维已经猜到来人可能是谁，连声催促国王马上发出行刑信号。国王仍不肯答应，坚持要先弄清这队骑兵的身份。
        - id: ch06-b09
          speaker: narrator
          text: |-
            骑兵正是大维齐尔贾法尔和他的随从。原来，努尔丁带信离开以后，哈里发连续几天都忘了派使者送任命诏书。没有诏书，单凭那封信确实不能生效。

            一天，哈里发在后宫听见一个美丽的声音正在悲伤哭诉。他询问以后才知道，那是美丽的波斯女郎。哈里发猛然想起，答应给努尔丁的诏书还没送出，马上召来贾法尔，命他以最快速度赶往巴士拉。努尔丁若已经死了，就绞死索维。若他还活着，便把努尔丁、国王和索维一起带回巴格达。
        - id: ch06-b10
          speaker: narrator
          text: 贾法尔带着随从从巴格达一路疾驰而来。他策马飞越广场，在王宫台阶前下马，国王亲自走出来迎接。贾法尔开口便问努尔丁是否还活着。国王回答说人还在，努尔丁马上被带出来，手脚依旧捆着。贾法尔命人当场替他解开绳索，又用同一副绳索把索维捆了起来。
        - id: ch06-b11
          speaker: narrator
          text: 第二天，贾法尔便动身返回巴格达，把巴士拉国王、索维和努尔丁三人一并带去。哈里发听说了努尔丁在狱中遭受的种种虐待，准许他亲手斩下索维的头。努尔丁却不愿让仇人的鲜血沾上自己的手，索维便立刻被交给刽子手处置。
        - id: ch06-b12
          speaker: narrator
          text: |-
            哈里发又要努尔丁回巴士拉做国王，他同样谢绝了。他说，自己经历过这一切以后，宁愿永远不再回巴士拉，只想留在哈里发身边效力。从此，努尔丁成了哈里发最亲近的朝臣之一，也终于同美丽的波斯女郎团聚，两人长久幸福地生活在一起。

            至于巴士拉国王，哈里发只把他遣返回国，并告诫他，今后挑选维齐尔一定要更加谨慎。
