audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    basra_king:
      display_name: 巴士拉国王
      tts:
        delivery: 威严自负，决断时不容质疑
        timbre: 饱满沉稳
        pace: 稳健
        pitch: 中低音
    kakkan:
      display_name: 卡坎
      tts:
        delivery: 宽厚明理，动怒时痛切严厉
        timbre: 温厚清朗
        pace: 从容
        pitch: 中低音
    saouy:
      display_name: 索维
      tts:
        delivery: 阴冷刻薄，进谗时故作忠诚
        timbre: 干涩低沉
        pace: 稍慢
        pitch: 低音
    slave_merchant:
      display_name: 奴隶商人
      tts:
        delivery: 热心老练，说价时条理分明
        timbre: 清晰圆润
        pace: 适中
        pitch: 中音
    persian_merchant:
      display_name: 波斯商人
      tts:
        delivery: 谦恭诚恳，谈及商品时自信而克制
        timbre: 温和清晰
        pace: 从容
        pitch: 中音
    fair_persian:
      display_name: 美丽的波斯女郎
      tts:
        delivery: 聪慧真挚，欢喜时明快，忧伤时含蓄动人
        timbre: 柔和清亮
        pace: 舒缓
        pitch: 中高音
    kakkan_wife:
      display_name: 维齐尔夫人
      tts:
        delivery: 慈爱细心，焦急时直截了当
        timbre: 温暖沉稳
        pace: 适中
        pitch: 中音
    noureddin:
      display_name: 努尔丁
      tts:
        delivery: 热情爽朗，落难后真诚坚定
        timbre: 年轻清朗
        pace: 适中偏快
        pitch: 中音
    steward:
      display_name: 管家
      tts:
        delivery: 恭敬谨慎，说明账目时坦率
        timbre: 清晰平实
        pace: 适中
        pitch: 中音
    friend_1:
      display_name: 宴饮朋友甲
      tts:
        delivery: 途利圆滑，推脱时冷淡
        timbre: 轻浮清亮
        pace: 稍快
        pitch: 中音
    friend_2:
      display_name: 宴饮朋友乙
      tts:
        delivery: 随声附和，事不关己
        timbre: 平滑清晰
        pace: 适中
        pitch: 中音
    friend_3:
      display_name: 宴饮朋友丙
      tts:
        delivery: 精明冷淡，说话简短
        timbre: 稍显尖薄
        pace: 稍快
        pitch: 中高音
    haji_hassan:
      display_name: 哈吉·哈桑
      tts:
        delivery: 精明仗义，低声献策时果断
        timbre: 清亮结实
        pace: 明快
        pitch: 中音
    sangiar:
      display_name: 桑吉亚尔
      tts:
        delivery: 忠诚急切，警告时干脆利落
        timbre: 低沉有力
        pace: 稍快
        pitch: 中低音
    sheikh_ibrahim:
      display_name: 谢赫·易卜拉欣
      tts:
        delivery: 老练贪财，喝酒后夸张粗鲁
        timbre: 苍老浑厚
        pace: 适中，醉后忽快忽慢
        pitch: 中低音
    jaafar:
      display_name: 贾法尔
      tts:
        delivery: 谨慎干练，面对哈里发时恭敬克制
        timbre: 沉稳清晰
        pace: 稳健
        pitch: 中低音
    caliph:
      display_name: 哈里发
      tts:
        delivery: 威严果断，讥讽时不动声色
        timbre: 深沉清晰
        pace: 稳健
        pitch: 低音
  chapters:
    - id: ch01
      title: 一万枚金币
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            巴士拉长久向哈里发称臣。哈伦·拉希德在位时，那里的国王是他的堂弟穆罕默德·齐奈比。国王设了两位维齐尔。一位叫卡坎，仁厚大方，只要办得到，他从不拒绝求助的人，因此举国都敬重他。

            另一位叫索维。他冷酷、阴沉，明明家财万贯，却连日常需用都舍不得买。他尤其仇视卡坎，总在国王面前说他的坏话。

            一天，国王与维齐尔和大臣们闲谈，说起什么样的女奴才算出众。有人说美貌就够了，也有人说，她还得聪慧明理，端庄自重，最好又有才学。卡坎赞同后一种说法，国王也很赞同，当场命他去寻找这样的人。
        - id: ch01-b02
          speaker: saouy
          text: 陛下，才貌都这样出众的女子，只怕很难找。就算找到了，花一万枚金币也不算贵。
        - id: ch01-b03
          speaker: basra_king
          text: 索维，你觉得一万枚金币是天大的数目。对你或许是，对我可不是。
        - id: ch01-b04
          speaker: narrator
          text: |-
            国王马上叫大司库拨给卡坎一万枚金币。卡坎回家后，把贩卖女奴的商人们都召来，叫他们找到合适的人便立刻来报。此后，商人们天天带人来，卡坎却每次都能看出不足。

            终于有一天早晨，一个商人拦住正要进宫的卡坎，告诉他，昨夜有位波斯商人进城，带来一个才智和美貌都无人能比的女奴。卡坎请他下午把人带来。等他真正见到她，才发现她比自己想象的还要美，便给她取名“美丽的波斯女郎”。

            卡坎学识渊博，同她说了几句话，就知道不可能再找到才德胜过她的人。他便问奴隶商人，原主要价多少。
        - id: ch01-b05
          speaker: slave_merchant
          text: 大人，少于一万枚金币，原主绝不肯卖。他说，光是请师傅教她学问和强身的本领，再加上多年的衣食，花费就不止这些。她什么乐器都会，还能唱歌、跳舞、作诗，完全配得上侍奉国王。
        - id: ch01-b06
          speaker: kakkan
          text: 我买她不是留给自己，而是要献给国王。不过，你开的价的确太高了。
        - id: ch01-b07
          speaker: persian_merchant
          text: 大人，要是我不是个商人，我真愿意直接把她献给陛下，那是我的荣耀。我现在所要的，只是培养她所花的本钱。
        - id: ch01-b08
          speaker: narrator
          text: 卡坎不再讨价还价，当即付了金币。波斯商人离开前，又特意叮嘱他。
        - id: ch01-b09
          speaker: persian_merchant
          text: 她赶了很长的路，已经累坏了。既然要献给国王，最好先留她在府上住半个月，好好调养。烈日把她晒黑了，等她沐浴两三次，再换上合身的衣裳，您会看见她还能美上许多。
        - id: ch01-b10
          speaker: narrator
          text: 卡坎采纳了这个建议。他让波斯女郎住在妻子寝室附近，叫妻子照未来王妃应有的体面待她，还替她缝制最华美的衣裳。离开时，他对她说。
        - id: ch01-b11
          speaker: kakkan
          text: 我已经替你找到最大的福分，你很快就会属于国王。但我必须提醒你，我有个儿子，他不笨，只是年轻任性，做事莽撞。你一定要躲着他。
        - id: ch01-b12
          speaker: fair_persian
          text: 谢谢大人告诫，我会牢牢记住。
    - id: ch02
      title: 一场风波，一段婚姻
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            卡坎的儿子就是努尔丁。他年轻俊秀，风度迷人，又能自由出入母亲的寝室。他第一眼看见波斯女郎，就对她着了迷。他明知她将被献给国王，还是决心无论如何都要把她留给自己。

            波斯女郎也爱上了努尔丁。在她看来，维齐尔愿把她献给国王虽是抬举，可要是能嫁给努尔丁，她才真的心满意足。努尔丁一有机会就来陪她说笑，若不是母亲硬赶他走，他简直一步都不愿离开。

            五六天后，维齐尔夫人让人烧好浴室，又命女奴们伺候波斯女郎沐浴更衣。她梳妆好来到夫人面前时，美得连夫人几乎都认不出了。
        - id: ch02-b02
          speaker: fair_persian
          text: 夫人，您觉得我穿这身衣裳好看吗？侍女们都说太合身了，她们差点认不出我。要是她们没在奉承我，这一切都是您的恩赐。
        - id: ch02-b03
          speaker: kakkan_wife
          text: 好孩子，她们说的是真话，连我也差点没认出你。不过，这可不全是衣裳的功劳。洗过澡以后，你比先前更有光彩了。效果这么好，我也想去试试。
        - id: ch02-b04
          speaker: narrator
          text: |-
            夫人临走时，留下两个小女奴守门，严令她们绝不能放努尔丁进去。可她才走，努尔丁就来了。两个小女奴挡在门前，努尔丁一手抓住一个，把她们拖到前厅，然后关上了房门。两人哭着跑到浴室告状。

            夫人惊慌地穿好衣服，赶到波斯女郎房里，努尔丁却已经走了。波斯女郎见她流着泪，忙问发生了什么不幸的事。
        - id: ch02-b05
          speaker: kakkan_wife
          text: 你还问发生了什么？刚才你明明和我儿子努尔丁单独在这里！
          emotion: angry
        - id: ch02-b06
          speaker: fair_persian
          text: 可是夫人，这有什么不对吗？
          emotion: surprised
        - id: ch02-b07
          speaker: kakkan_wife
          text: 怎么会没有不对？我丈夫难道没告诉你，你是要献给国王的吗？
        - id: ch02-b08
          speaker: fair_persian
          text: 他当然说过。可努尔丁刚才告诉我，他父亲改了主意，已经把我送给他了。我信了他。而且我爱努尔丁，要是能跟他一起过一辈子，我心甘情愿。
        - id: ch02-b09
          speaker: kakkan_wife
          text: 愿苍天保佑，让你说的都是真的！可努尔丁骗了你。他父亲一定会认为这是莫大的羞辱，他会杀了这个孩子的。
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: |-
            夫人放声痛哭，女奴们也跟着掉泪。不久，卡坎走了进来。他看见妻子和女奴们满脸是泪，波斯女郎又惊慌不安，便一再追问原因。众人许久都不敢开口。等妻子终于平静下来，将一切都告诉他，卡坎又羞又怒，绞着双手，撕扯胡须，几乎发了狂。
        - id: ch02-b11
          speaker: kakkan
          text: 这个孽子！他毁掉的不只是自己，还有他的父亲。国王既会要他的命，也会要我的命！
          emotion: angry
        - id: ch02-b12
          speaker: kakkan_wife
          text: 您别再这样折磨自己了。我把首饰卖掉，就能凑出一万枚金币。您拿这笔钱再买一个女奴吧。
        - id: ch02-b13
          speaker: kakkan
          text: 你以为我痛苦的是损失了钱吗？现在危在旦夕的是我的名誉，它比我所有财富都更珍贵。索维是我的死敌。他一旦听说此事，必定会去告诉国王，后果你自己也想得到。
        - id: ch02-b14
          speaker: kakkan_wife
          text: 我知道索维卑鄙，也知道他做得出这种事。可他怎么会知道我们家里发生了什么？就算有人怀疑，国王来问，您只要说验看以后发现她配不上陛下。您放宽心，告诉商人说您不满意，让他们继续去找就是了。
        - id: ch02-b15
          speaker: narrator
          text: |-
            卡坎觉得这办法有道理，但他对努尔丁依然怒火难消。努尔丁一整天都不敢露面。他怕父亲去熟人家找他，便在偏僻的花园里躲到天黑。父亲睡下后，他才悄悄回家，第二天天不亮又离开。这样过了整整一个月。

            母亲明知他每晚都会回来，却一直不敢求丈夫宽恕。最后，她终于鼓起了勇气。
        - id: ch02-b16
          speaker: kakkan_wife
          text: 老爷，努尔丁这样对待父亲，当然再不孝不过。可事已至此，您能不能饶了他？你们父子长久不和，反而会害了您。要是有心怀恶意的人追查原因，说不定会猜到真相。
        - id: ch02-b17
          speaker: kakkan
          text: 你说得对。但我必须让努尔丁受到应有的羞辱，然后才能饶他。
        - id: ch02-b18
          speaker: kakkan_wife
          text: 那就照我的办法做。今晚他回来时，您躲在暗处，假装要杀他。我会赶来救他。您就说是我苦苦哀求，才饶他一命，再逼他接受您娶波斯女郎的条件。
        - id: ch02-b19
          speaker: narrator
          text: 卡坎同意了。当晚努尔丁回家，一切果然照计策发生。卡坎假装要杀儿子，直到妻子哀求，他才让步。
        - id: ch02-b20
          speaker: kakkan
          text: 是你母亲救了你的命。看在她的分上，我饶了你。但你必须答应几个条件。你要娶美丽的波斯女郎为妻，绝不能把她当成女奴。你永远不得卖她，也不得休弃她。
        - id: ch02-b21
          speaker: noureddin
          text: 父亲，我没想到您会这样宽厚。谢谢您饶了我。我发誓，一定遵守您所有的吩咐。
        - id: ch02-b22
          speaker: narrator
          text: |-
            此后，卡坎屡次向国王诉说这件差事有多难，尽力把它拖下去。可真相还是漏出了几句，传到索维耳中。

            一年多后，卡坎刚洗完澡，身上还热着，就为紧急公务冒寒出门。他受寒后肺部发炎，病情迅速恶化。自知将要离世时，他把努尔丁叫到身边，再三叮嘱儿子永远不要同波斯女郎分离。

            不久，卡坎便与世长辞。举国都在哀悼他，无论贫富，人人都来送葬。
    - id: ch03
      title: 败尽家业
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            努尔丁失去父亲，悲痛得很久不肯见人。后来，一位朋友终于得到允许，进来劝他节哀，也劝他重新出去交游。努尔丁很快听从了。他结交了十个年纪相仿的青年，从此天天设宴取乐。

            波斯女郎偶尔也在宴席上露面。她不赞成丈夫这样花钱，一再提醒他，长此下去必有后患。努尔丁却笑她多虑，只说父亲从前管得太严，自己如今重获自由，正该快活。
        - id: ch03-b02
          speaker: narrator
          text: 管家几次捧着账簿来，想同他核对收支，他也不肯过问。
        - id: ch03-b03
          speaker: noureddin
          text: 你只管让我过得舒坦，别拿账目这些事来烦我。
        - id: ch03-b04
          speaker: narrator
          text: 那些朋友不只享用他的酒宴，还处处占他的便宜。谁看中了土地、房屋、浴场或别的产业，努尔丁就把它送给谁。波斯女郎苦苦相劝，仍拦不住他把家财大把散出去。
        - id: ch03-b05
          speaker: narrator
          text: |-
            整整一年，努尔丁除了享乐，就是挥霍父亲留下的财富。一年刚过，众人又在宴饮时，门外忽然响起敲门声。家里的奴仆已经全被遣散，努尔丁只好亲自去开门。一位朋友也站起身来，却没他走得快，便藏到帷幕后偷听。

            门外站着管家。努尔丁走出去，随手关上了门。
        - id: ch03-b06
          speaker: steward
          text: 老爷，请原谅我冒昧来打扰。可我早就担心的事，今天还是发生了。您交给我支付日常开销的钱，一枚也没剩。别的进项也都送了人，往后再没有收入。您若还要我服侍，就请给我维持家用的钱。不然，我只能告退了。
        - id: ch03-b07
          speaker: narrator
          text: 努尔丁惊得说不出话。帷幕后面的朋友马上溜回席间，把听到的消息告诉了其他人。
        - id: ch03-b08
          speakers: [friend_1, friend_2, friend_3]
          ensemble: chorus
          text: 要真是这样，我们以后可不能再来了。
        - id: ch03-b09
          speaker: narrator
          text: 努尔丁恰好回到屋里。尽管他极力掩饰，众人还是看出消息不假。他们接连起身，各找一个借口告辞。转眼间，努尔丁便孤零零地留在席上，却还没猜到朋友们已经打定了什么主意。波斯女郎出来后，他懊悔不已，把管家的话告诉了她。
        - id: ch03-b10
          speaker: noureddin
          text: 美丽的波斯女郎，我当初要是听你的，就不会落到今天。好在这些钱都花给了朋友。到了危难的时候，他们总不会丢下我。明天我就去找他们，大家凑一凑，借我一笔本钱，我还能做生意重新起家。
        - id: ch03-b11
          speaker: narrator
          text: |-
            第二天一早，努尔丁便去拜访那十位朋友。他们都住在同一条街。第一家的奴仆让他在前厅等候，进去通报。他却清楚地听见主人在里面吩咐，说以后只要努尔丁登门，一律说自己不在。

            第二家这样，第三家也这样。十家没有一家肯见他。直到这时，努尔丁才明白，那些人全是假朋友，一见他落难就把他抛弃了。他又羞又痛，只得回家向波斯女郎求安慰。
        - id: ch03-b12
          speaker: fair_persian
          text: 唉，老爷，您现在总算相信我从前的担忧了。我们已经没有别的办法，只能先卖掉家里的奴仆和家具。
        - id: ch03-b13
          speaker: narrator
          text: 努尔丁先卖了奴仆，靠这笔钱过了一阵。接着，他又把许多贵重家具卖掉，所得的钱也渐渐花完。最后，家中再没有东西可卖，他只好又问波斯女郎怎么办。
        - id: ch03-b14
          speaker: fair_persian
          text: 老爷，您父亲当年用一万枚金币买下我。如今我的身价就算不如从前，应该还能卖到不少钱。别再犹豫了，把我卖掉吧。拿到钱以后，您可以去远方的另一座城做生意，重新安顿下来。
        - id: ch03-b15
          speaker: noureddin
          text: 迷人的波斯女郎，我怎么能做这种卑鄙的事？你比我的性命还珍贵。我宁可死，也绝不会离开你。
        - id: ch03-b16
          speaker: fair_persian
          text: 老爷，我知道您多么爱我，因为我也同样爱您。可眼前的困境太残酷了，我们实在只剩这一个办法。
        - id: ch03-b17
          speaker: narrator
          text: |-
            努尔丁终于让步，依依不舍地带她来到奴隶市场。他找到商人哈吉·哈桑，请对方看看她值多少。哈吉·哈桑把两人领进一间僻静屋子。波斯女郎才揭开面纱，他便认出，这正是卡坎当年用一万枚金币买下的女子。

            哈吉·哈桑答应尽力替她卖出高价。他先把波斯女郎锁在屋里，再召集其他奴隶商人，说自己找到了女奴中的明珠。商人们看过以后，都认为起价不能少于四千枚金币。哈吉·哈桑于是站到外面高声叫卖。
        - id: ch03-b18
          speaker: haji_hassan
          text: 谁肯出四千枚金币，买下这位波斯女奴？
        - id: ch03-b19
          speaker: narrator
          text: |-
            众人还没来得及出价，索维恰好骑马经过。他听见四千枚金币的开价，猜想这女奴必定极美，便命哈吉·哈桑让自己看看。按市场规矩，尚未出价的人本不能看，可谁也不敢违抗维齐尔。

            索维一见波斯女郎，便被她的美貌震住，一心要占有她。他还不知道原主就是努尔丁，立刻叫哈吉·哈桑把人找来，谈妥这笔买卖。哈吉·哈桑找到努尔丁，先提醒他，这个价钱远远配不上波斯女郎。若卖给索维，以那人的品性，甚至可能拿了人却不付钱。接着，他压低声音说出一个计策。
        - id: ch03-b20
          speaker: haji_hassan
          text: 你要装作从没真想卖她，只是生气时赌咒要把她送来。等我假装得到你的许可，要把她交给索维，你就冲出来打她几下，再硬把她带走。
        - id: ch03-b21
          speaker: narrator
          text: |-
            努尔丁照计策行事。索维顿时大怒，纵马冲来，要把波斯女郎抢回去。努尔丁放开她，一把抓住马的缰绳。旁观者纷纷替他喝彩，他便把索维拖下马，痛打一顿，直打得对方满身是血，又把人扔进阴沟。

            随后，努尔丁领着波斯女郎回家。百姓痛恨索维，一路欢呼，既没人替他解围，也不许他的奴仆上前相救。
        - id: ch03-b22
          speaker: narrator
          text: 索维满身污泥和鲜血，在两个奴仆搀扶下勉强爬起来。他径直进宫，向国王哭诉。
        - id: ch03-b23
          speaker: saouy
          text: |-
            请陛下明察。臣到奴隶市场，本想买个厨娘，却听见有人叫卖一名女奴，开价四千枚金币。臣看过才发现，她美貌无双，卖她的正是已故维齐尔之子努尔丁。

            陛下当年赐给卡坎一万枚金币，要他买一个女奴。如今叫卖的正是那个人。卡坎没有把她献给陛下，反而给了自己的儿子。努尔丁在父亲死后耗尽家产，卖光产业，现在连她也拿出来卖。

            臣对他说，愿出一万枚金币买下女奴献给陛下，还会替他在陛下面前美言，这远胜商人多给的几个钱。他却骂臣是恶毒的老东西，宁可把女奴送给犹太人，也不卖给臣。臣提醒他，这样说是在冒犯陛下，他反倒更加疯狂，把臣拖下马，任意毒打。臣如今这副模样，全是他害的。
          emotion: sad
        - id: ch03-b24
          speaker: narrator
          text: 索维说完便转过脸痛哭。国王听信了这番话，对努尔丁怒不可遏。他命侍卫长带四十人去洗劫努尔丁的家，把房子夷平，再将努尔丁和波斯女郎一并押来。
        - id: ch03-b25
          speaker: narrator
          text: |-
            守门人桑吉亚尔听见命令，悄悄离开御前。他从前是卡坎的奴仆，如今飞奔去给努尔丁报信，催他马上带波斯女郎逃走。他又送给努尔丁四十枚金币，没等对方道谢便消失了。

            波斯女郎蒙好面纱，两人立刻出逃。他们没有被人发现，顺利出了城，来到幼发拉底河口。那里正有一艘船要开往巴格达，他们登船后，船便起锚扬帆。
        - id: ch03-b26
          speaker: narrator
          text: 侍卫长破门闯进努尔丁家，却没有找到两人，邻居也不知道他们去了哪里。国王随即张贴告示，悬赏一千枚金币捉拿他们，谁敢藏匿便要受重罚。
