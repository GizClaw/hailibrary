        timbre: 饱满沉稳
        pace: 稳健
        pitch: 中低音
    kakkan:
      display_name: 卡坎
      tts:
        delivery: 宽厚明理，动怒时痛切严厉
        timbre: 温厚清朗
        pace: 从容
        pitch: 中低音
    saouy:
      display_name: 索维
      tts:
        delivery: 阴冷刻薄，进谗时故作忠诚
        timbre: 干涩低沉
        pace: 稍慢
        pitch: 低音
    slave_merchant:
      display_name: 奴隶商人
      tts:
