        pitch: 中音
    friend_1:
      display_name: 宴饮朋友甲
      tts:
        delivery: 途利圆滑，推脱时冷淡
        timbre: 轻浮清亮
        pace: 稍快
        pitch: 中音
    friend_2:
      display_name: 宴饮朋友乙
      tts:
        delivery: 随声附和，事不关己
        timbre: 平滑清晰
        pace: 适中
        pitch: 中音
    friend_3:
      display_name: 宴饮朋友丙
      tts:
        delivery: 精明冷淡，说话简短
        timbre: 稍显尖薄
        pace: 稍快
        pitch: 中高音
    haji_hassan:
      display_name: 哈吉·哈桑
