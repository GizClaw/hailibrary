        pace: 适中
        pitch: 中音
    noureddin:
      display_name: 努尔丁
      tts:
        delivery: 热情爽朗，落难后真诚坚定
        timbre: 年轻清朗
        pace: 适中偏快
        pitch: 中音
    steward:
      display_name: 管家
      tts:
        delivery: 恭敬谨慎，说明账目时坦率
