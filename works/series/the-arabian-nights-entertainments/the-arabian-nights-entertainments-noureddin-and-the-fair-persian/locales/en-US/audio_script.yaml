  chapters:
    - id: ch01
      title: The Fair Persian
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, Balsora was the capital of a kingdom that paid tribute to the caliph. Its king was Zinebi, a cousin of Caliph Haroun-al-Raschid. Zinebi had two vizirs to govern his lands. One was Khacan, a kind and generous man who gladly helped anyone who came to him. Everyone in the kingdom respected him. The other was Saouy. He was gloomy, miserly, and harsh to everyone he met. Most of all, he hated Khacan and never stopped speaking against him to the king.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day the king and his council began discussing what qualities mattered in a female slave. Some said beauty was enough. Khacan and others disagreed. They believed beauty should come with intelligence, wisdom, modesty, and learning. The king agreed with Khacan and ordered him to find a woman who possessed every one of those qualities.
        - id: ch01-b03
          speaker: saouy
          text: >-
            Sire, finding such an accomplished woman will be very difficult. If one exists, ten thousand gold pieces would be a low price for her.
        - id: ch01-b04
          speaker: king_zinebi
          text: >-
            That may seem like a great sum to you, Saouy, but it does not seem great to me.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The king told his grand treasurer to send Khacan ten thousand gold pieces. Once Khacan reached home, he called the slave dealers and described the woman he needed. They promised to search. Every day they brought someone for him to inspect, but every candidate lacked one of the qualities the king required.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Then, early one morning, a dealer hurried up to Khacan on his way to the palace. A Persian merchant had arrived the night before with a slave whose intelligence and wisdom matched her extraordinary beauty. Delighted, Khacan told the dealer to bring her to his house that afternoon.
        - id: ch01-b07
          speaker: narrator
          text: >-
            When she arrived, she was more beautiful than Khacan had expected. He called her the Fair Persian. A short conversation showed him that she had all the gifts the king wanted and that he would search in vain for anyone better. He asked what her owner would accept.
        - id: ch01-b08
          speaker: slave_dealer
          text: >-
            The merchant will not take less than ten thousand gold pieces. He says he has already spent that much on her teachers, her exercise, her clothes, and her food. She is fit for a king. She plays every instrument, sings, dances, writes verse, and excels at everything she has learned.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Khacan sent for the merchant and explained that he was buying the Fair Persian for the king, though he thought the price too high.
        - id: ch01-b10
          speaker: persian_merchant
          text: >-
            Sir, I would count it an honor to give her to his Majesty, if such a gift were proper for a merchant. I am only asking you to repay what her education has cost me.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Khacan did not bargain. He had all ten thousand pieces counted out. Before the merchant left, however, he offered some advice.
        - id: ch01-b12
          speaker: persian_merchant
          text: >-
            Since she is meant for the king, please remember how tired she is after her long journey. Keep her in your house for two weeks and care for her before you present her. The sun has darkened her complexion. After several baths and proper clothes, you will see her beauty increase even more.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Khacan thanked the merchant and decided to follow every part of his advice. At home, he gave the Fair Persian a private apartment near his wife's rooms. He explained that she was intended for the king and must be treated with all the respect due to such a lady. His wife was to see that she rested after the long road, attended the baths, and received the most magnificent clothes they could provide. Before Khacan left the young woman to recover, he gave her one serious warning.
        - id: ch01-b14
          speaker: khacan
          text: >-
            No greater good fortune could have come to you, for you now belong to the king. But I have a son. He is clever enough, yet he is also young, foolish, and headstrong. Keep him at a distance.
        - id: ch01-b15
          speaker: fair_persian
          text: >-
            Thank you for warning me. I will remember what you have said.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Khacan's son was named Noureddin. He was young, handsome, pleasant, and able to charm almost everyone he met. Because he came and went freely through his mother's apartments, it was not long before he saw the Fair Persian. He knew perfectly well that his father had bought her for the king, yet her beauty swept away his good sense. At once he began thinking of every means by which he might keep her for himself. The Fair Persian was equally captivated by Noureddin, though she knew the place for which Khacan had chosen her.
        - id: ch01-b17
          speaker: fair_persian
          text: >-
            The vizir honors me greatly by buying me for the king, but I would be happier if he gave me to his son.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Noureddin seized every chance to look at her, talk with her, and laugh beside her. He would never have left if his mother had not made him go.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Five or six days after the purchase, Khacan's wife had the bath heated for the Fair Persian. Her attendants bathed her and dressed her in the splendid clothes prepared for her. When the young woman returned, Khacan's wife could hardly recognize her.
        - id: ch01-b20
          speaker: fair_persian
          text: >-
            Madam, what do you think of the dress you gave me? Your women say it suits me so well that they scarcely knew me. If they are telling the truth and not flattering me, I owe the change to you.
        - id: ch01-b21
          speaker: khacans_wife
          text: >-
            They are not flattering you, my daughter. I hardly knew you myself. The dress has helped, but the bath has done even more. The difference is so remarkable that I mean to try it myself.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Acting on the thought at once, Khacan's wife went to the bath. Before leaving, she placed two young attendants outside the Fair Persian's room and gave them a strict order. If Noureddin appeared, they must not let him enter. She had barely gone when he arrived. He looked for his mother, and when he did not find her, he tried to enter the Fair Persian's apartment. The two attendants stood across the doorway and repeated their mistress's command. Noureddin caught each girl by an arm, moved them out of the anteroom, and shut the door behind them. Crying out in fear, they ran all the way to the bath and told their mistress that Noureddin had forced them aside and gone in.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The news filled Khacan's wife with alarm. She dressed as quickly as she could and hurried back to the Fair Persian's rooms. By the time she arrived, Noureddin had already left. The young woman was astonished to see her enter in tears and asked what misfortune could have happened.
        - id: ch01-b24
          speaker: khacans_wife
          text: >-
            How can you ask me that when you know my son has been alone with you?
          emotion: sad
        - id: ch01-b25
          speaker: fair_persian
          text: >-
            But madam, what harm is there in that?
        - id: ch01-b26
          speaker: khacans_wife
          text: >-
            Did my husband not tell you that you were meant for the king?
        - id: ch01-b27
          speaker: fair_persian
          text: >-
            Of course he did. But Noureddin has just told me that his father changed his mind and gave me to him. I believed him. I love Noureddin so much that I would gladly spend my life with him.
        - id: ch01-b28
          speaker: khacans_wife
          text: >-
            If only that were true! Noureddin has deceived you, and his father may kill him for what he has done.
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: >-
            Khacan's wife wept bitterly, and all her attendants wept with her. Soon Khacan came in. He found his household in tears and the Fair Persian deeply troubled. At last his wife managed to tell him what had happened. Rage and shame overwhelmed him. He wrung his hands and tore at his beard.
        - id: ch01-b30
          speaker: khacan
          text: >-
            Miserable son! You have destroyed yourself and your father with you. The king will demand both your blood and mine.
          emotion: angry
        - id: ch01-b31
          speaker: khacans_wife
          text: >-
            Do not torment yourself. I can sell my jewels for ten thousand gold pieces, and you can buy another slave with the money.
        - id: ch01-b32
          speaker: khacan
          text: >-
            It is not the money I fear losing. My honor is worth more than all my wealth. Saouy is my bitter enemy. If he learns of this, he will tell the king, and you know what will follow.
        - id: ch01-b33
          speaker: khacans_wife
          text: >-
            I know how spiteful Saouy can be, but how could he learn what happened inside this house? Even if the king grows suspicious, say you examined the woman and found her unworthy of him. Tell the dealers to keep searching for someone better.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Khacan saw that her advice was sensible and decided to follow it. He would tell the dealers that the first woman had not met the king's high standard and order them to continue their search. Still, his anger toward Noureddin did not lessen. His son did not dare show his face that day. He avoided his usual companions, knowing his father might look for him among them, and hid instead in a quiet garden where no one knew him. That night he waited until Khacan was asleep before returning home, then slipped away early the next morning. For an entire month he followed the same careful pattern.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Noureddin's mother knew very well that he came home each night, yet she did not dare ask her husband to forgive him. At last she found the courage. She admitted that no son could have treated his father more shamefully, but asked whether a month of punishment was not enough. If the quarrel continued, malicious people might begin asking questions and discover the secret they most needed to hide. Khacan agreed that her reasoning was sound. Even so, he could not forgive Noureddin until the young man had been frightened and humbled as he deserved. His wife proposed a plan. Khacan would wait for Noureddin that evening and pretend he meant to kill him. She would rush in and beg for her son's life. Khacan could then make it seem that her pleas alone had saved Noureddin and force him to accept whatever conditions his father laid down.
        - id: ch01-b36
          speaker: narrator
          text: >-
            That evening everything happened as they had arranged. Khacan lay in wait and made Noureddin believe his life was about to end. Only after his wife pleaded with him did he lower his hand.
        - id: ch01-b37
          speaker: khacan
          text: >-
            You owe your life to your mother. For her sake I forgive you, but only on these terms. Take the Fair Persian as your wife, not as your slave. Never sell her, and never send her away.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Noureddin had never hoped for such mercy. He thanked his father and swore to obey. Khacan often spoke to the king about how difficult the search had become, though whispers of the truth eventually reached Saouy.
    - id: ch02
      title: Fortune Lost
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            More than a year passed after Noureddin's marriage. Then important business called Khacan away just as he came from the bath, while his body was still hot. The sudden cold struck him badly. Inflammation settled in his lungs, and the illness grew worse with frightening speed. Khacan understood that his life was ending. He sent for Noureddin and, with his last breath, charged him never to part with the Fair Persian. Soon afterward the good vizir died. Regret spread throughout the kingdom. Rich and poor alike remembered his kindness, and a great multitude followed him to his grave.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Noureddin grieved deeply and refused to see anyone for a long time. Then one friend persuaded him to return to society. Noureddin needed little encouragement. Before long, he spent every day feasting with ten young men of his own age.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The Fair Persian sometimes joined their gatherings, but she warned him that such wild spending could only end badly. Noureddin laughed. He said his father had kept him under too much restraint and that he meant to enjoy his freedom. Whenever his steward brought the account book, Noureddin sent him away.
        - id: ch02-b04
          speaker: noureddin
          text: >-
            Just make sure I live well. Do not trouble me with anything else.
        - id: ch02-b05
          speaker: narrator
          text: >-
            His companions did more than eat and drink at his table every day. They learned that his generosity had no limit and took advantage of it whenever they could. If one praised a piece of Noureddin's land, he gave it away. If another admired a house, a public bath, or anything else that brought in money, Noureddin handed it over without a second thought. Each gift reduced the income that supported his household, but he refused to examine the accounts and see the danger. The Fair Persian repeatedly begged him to stop doing himself such harm. He laughed away every protest and went on scattering with both hands the fortune his father had worked so hard to build.
        - id: ch02-b06
          speaker: narrator
          text: >-
            After a year of pleasure, a knock came during one of their feasts. Noureddin had dismissed his servants, so he opened the door himself and found the steward. One curious friend hid behind a curtain to listen.
        - id: ch02-b07
          speaker: steward
          text: >-
            My lord, forgive me for disturbing you, but what I feared has happened. Every coin you gave me for expenses is gone, and you have given away all the property that once brought you an income. If you want me to continue serving you, you must provide more money. Otherwise, I have to leave.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Noureddin was too stunned to answer. The listener rushed back and told the others what he had heard.
        - id: ch02-b09
          speaker: false_friend
          text: >-
            If he truly has nothing left, then we must stop coming here.
        - id: ch02-b10
          speaker: narrator
          text: >-
            When Noureddin returned, his face confirmed the news. One guest after another invented an excuse and slipped away. Noureddin did not understand why. He told the Fair Persian what the steward had said and bitterly regretted his carelessness.
        - id: ch02-b11
          speaker: noureddin
          text: >-
            If I had listened to you, none of this would have happened. Still, I spent my fortune among friends, and they will not abandon me now. Tomorrow I will visit them. Together they can lend me enough to begin some kind of business.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Early the next morning, he went to the street where all ten lived. At the first house, a servant left him waiting in the hall while he announced the visitor. Noureddin heard the master's answer clearly.
        - id: ch02-b13
          speaker: false_friend
          text: >-
            Noureddin? Tell him I am not at home, and say the same thing whenever he comes.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The second friend refused him in the same way, then the third, and finally all ten. Too late, Noureddin saw that these were false friends who wanted him only while he was rich. Crushed, he returned to the Fair Persian.
        - id: ch02-b15
          speaker: fair_persian
          text: >-
            My lord, now you know that my warning was true. We have only one choice left. We must sell the servants and the furniture.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Noureddin sold the servants first, and the money supported them for a while. Then he sold the furniture. Much of it was valuable, so that money lasted longer, but at last it too was gone. Once more he asked the Fair Persian what they should do.
        - id: ch02-b17
          speaker: fair_persian
          text: >-
            Your father paid ten thousand gold pieces for me. I may be worth less now, but I would still bring a large sum. You must sell me. Take the money to a distant town and begin a business there.
          emotion: sad
        - id: ch02-b18
          speaker: noureddin
          text: >-
            How could I do anything so shameful? I would rather die than lose you. I love you more than my own life.
          emotion: sad
        - id: ch02-b19
          speaker: fair_persian
          text: >-
            I know you love me, and I love you just as deeply. But cruel necessity has left us no other remedy.
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: >-
            In the end, Noureddin accepted the truth. With great reluctance, he led her to the slave market and asked a dealer named Hagi Hassan what price she might bring. The dealer took them into a private room. When she removed her veil, he recognized her.
        - id: ch02-b21
          speaker: hagi_hassan
          text: >-
            My lord, is this not the woman your father bought for ten thousand gold pieces?
        - id: ch02-b22
          speaker: narrator
          text: >-
            When Noureddin said that she was, Hagi Hassan promised to obtain the highest price possible. He called the other merchants to see what he called the pearl among slaves. They agreed that the bidding should begin at four thousand gold pieces.
        - id: ch02-b23
          speaker: hagi_hassan
          text: >-
            Who will offer four thousand gold pieces for the Persian slave?
        - id: ch02-b24
          speaker: narrator
          text: >-
            Before a merchant could bid, Saouy rode past. Such a high opening price told him the woman must be remarkable, and he demanded to see her. Private buyers were not usually allowed an early viewing, but no one dared refuse a vizir. The moment Saouy saw the Fair Persian, he wanted her. He did not yet know she belonged to Noureddin and ordered Hagi Hassan to fetch the owner.
        - id: ch02-b25
          speaker: narrator
          text: >-
            Hagi Hassan hurried to find Noureddin. He warned him that the Fair Persian was about to go for far less than her true value. Worse still, Saouy was capable of taking her and never paying what he had promised. The dealer proposed a trick. Noureddin must claim that he had never truly meant to sell her. He should say that they had quarreled and that, in a moment of anger, he had sworn to take her to market. Hagi Hassan would present her to Saouy as though Noureddin had agreed to the bargain. At that moment, Noureddin should rush forward, pretend to strike her for causing the quarrel, and lead her away again.
        - id: ch02-b26
          speaker: narrator
          text: >-
            Noureddin followed the plan. Saouy flew into a rage and rode at him, trying to seize the Fair Persian. Noureddin released her, caught the horse's bridle, and pulled Saouy down. The watching crowd cheered while Noureddin beat the hated vizir and left him bleeding in the gutter. Then Noureddin took the Fair Persian home. The people would not help Saouy or even allow his servants to defend him.
        - id: ch02-b27
          speaker: narrator
          text: >-
            Covered from head to foot in mud and blood, Saouy struggled upright. Leaning on two servants, he went straight to the palace and demanded to see the king. He began his story with a lie. He said he had visited the slave market only because he needed a cook. While there, he heard a woman offered for four thousand gold pieces and asked to see her. Her incomparable beauty made him realize that she was the very slave Khacan had bought with the ten thousand pieces provided by the king. Instead of presenting her at court, Saouy said, Khacan had given her to his own son. Since his father's death, Noureddin had spent his entire fortune, sold every possession, and finally brought the king's slave to market.
        - id: ch02-b28
          speaker: saouy
          text: >-
            I offered Noureddin ten thousand pieces and said I would present her to your Majesty. I even promised to speak for him before you. He answered that he would sooner give her away than sell her to me. When I reminded him of all his father owed you, he dragged me from my horse and beat me like a madman. Your Majesty can see what he did.
          emotion: sad
        - id: ch02-b29
          speaker: narrator
          text: >-
            Saouy turned aside and wept. The king believed his lies and burned with anger.
        - id: ch02-b30
          speaker: king_zinebi
          text: >-
            Captain, take forty men. Plunder Noureddin's house and tear it to the ground. Bring both him and the slave before me.
          emotion: angry
        - id: ch02-b31
          speaker: narrator
          text: >-
            A palace doorkeeper named Sangiar heard the command. He had once been Khacan's slave, and he hurried away to warn Khacan's son. He pressed forty gold pieces into Noureddin's hand and vanished before he could be thanked.
        - id: ch02-b32
          speaker: sangiar
          text: >-
            Take the Fair Persian and flee at once. The king's guard is coming for you.
          emotion: fearful
        - id: ch02-b33
          speaker: narrator
          text: >-
            The Fair Persian put on her veil, and the two escaped Balsora unseen. At the mouth of the Euphrates, they found a ship about to sail for Bagdad and boarded just as the anchor rose.
        - id: ch02-b34
          speaker: narrator
          text: >-
            The captain of the guard reached Noureddin's house with his forty men. They smashed open the door and searched every room, but found no trace of Noureddin or the Fair Persian. The neighbors could tell them nothing. When the captain returned with the news, the king issued a proclamation throughout Balsora. Whoever brought back the fugitives would receive one thousand gold pieces. Whoever hid them would suffer severe punishment. Meanwhile, beyond the reach of the proclamation, Noureddin and the Fair Persian sailed safely to Bagdad. When the ship anchored, they paid five gold pieces for their passage and went ashore. Neither had ever visited the city, and they had no idea where a stranger might find lodging.
        - id: ch02-b35
          speaker: narrator
          text: >-
            They wandered beside the Tigris, looking for shelter. At last they came to a high-walled garden. Its gate was shut, but an open porch stood before it with a sofa on either side.
        - id: ch02-b36
          speaker: noureddin
          text: >-
            Let us spend the night here.
        - id: ch02-b37
          speaker: narrator
          text: >-
            They lay down on the sofas and soon fell asleep.
    - id: ch03
      title: The Caliph's Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The garden belonged to the caliph. In its center stood a great pavilion with a splendid hall and eighty windows. Each window had a hanging lamp, but those lamps were lit only when the caliph spent an evening there. The garden's only resident was an old soldier named Scheih Ibrahim. He guarded the gate and had strict orders never to let anyone sit on the sofas outside.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Scheih Ibrahim had been away on an errand. When he returned and saw two strangers asleep on the forbidden sofas, he first meant to drive them away with blows. Then he noticed their youth and beauty and woke them gently instead. Noureddin explained that they were strangers with nowhere else to sleep.
        - id: ch03-b03
          speaker: scheih_ibrahim
          text: >-
            Come with me. I can give you better lodging, and I will show you a magnificent garden of my own.
        - id: ch03-b04
          speaker: narrator
          text: >-
            He led them into the caliph's garden and allowed them to believe it belonged to him. Its beauty filled them with wonder. Noureddin handed the old man two gold pieces.
        - id: ch03-b05
          speaker: noureddin
          text: >-
            Please bring us something to eat, and then we can enjoy the evening together.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Scheih Ibrahim was very greedy. The moment he had the coins in his hand, he decided to spend no more than one tenth of their value on food and keep all the rest. While he was away, Noureddin and the Fair Persian wandered among the trees and flowers. They reached the pavilion and climbed its white marble staircase, but the door to the great hall was locked. When Scheih Ibrahim returned with the food, they begged him to let them see whatever lay beyond it. At last he agreed. He fetched both the key and a light, climbed the stairs with them, and unlocked the door.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The room dazzled them as soon as they entered. Every painting was beautiful, and every piece of furniture seemed more splendid than the last. Around the hall stood eighty windows. Between them, silver arms projected from the walls, each one holding a candle. Scheih Ibrahim spread the food on a table in front of a sofa, and all three sat down to eat together. When the meal was over, Noureddin asked the old man to bring them a bottle of wine.
        - id: ch03-b08
          speaker: scheih_ibrahim
          text: >-
            Heaven protect me from wine! I have made the pilgrimage to Mecca four times, and I have renounced wine forever.
        - id: ch03-b09
          speaker: noureddin
          text: >-
            You would do us a great kindness by bringing some, and you need never touch it. Lead the donkey at the gate to the nearest wine shop. Ask a passerby to order two jars and have them placed in the panniers. Then drive the donkey home. Here are two gold pieces for the cost.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The sight of two more gold pieces quickly overcame the old man's objections. He set off at once and carried out the commission. When he returned with the jars, Noureddin explained that they still lacked cups and asked whether he could find some fruit as well. Scheih Ibrahim disappeared again. Before long, he came back with a table furnished with cups of gold and silver and covered with every kind of beautiful fruit. Noureddin and the Fair Persian repeatedly invited him to remain with them, but for the moment he insisted on withdrawing.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Noureddin and the Fair Persian found the wine excellent. As they drank, they began to sing, and both possessed beautiful voices. Scheih Ibrahim could not resist listening. At first he stayed some distance away. Then he crept nearer to the hall, and at last he put his head through the doorway. Noureddin noticed him and called him in to keep them company. The old man refused several times before allowing himself to be persuaded. First he entered and sat on the very edge of the sofa nearest the door. Soon he drew a little closer. By the end, he had settled beside the Fair Persian, who kept urging him to accept a cup from her hand.
        - id: ch03-b12
          speaker: fair_persian
          text: >-
            You must drink to my health. Please take this cup from me.
        - id: ch03-b13
          speaker: narrator
          text: >-
            At last he accepted it. In truth, Scheih Ibrahim only pretended to avoid wine and often visited wine shops himself. Once he took the first cup, the second and third followed easily. Soon he no longer knew what he was doing. They drank, laughed, and sang until nearly midnight.
        - id: ch03-b14
          speaker: fair_persian
          text: >-
            This hall has only one poor tallow candle burning. Will you light some of the beautiful candles in those silver holders?
        - id: ch03-b15
          speaker: scheih_ibrahim
          text: >-
            Light them yourself. You are younger than I am, but five or six will be plenty.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The Fair Persian lit all eighty candles. The old man was too drunk to notice. A little later, Noureddin asked whether they might light some of the hanging lamps.
        - id: ch03-b17
          speaker: scheih_ibrahim
          text: >-
            You can light them better than I can. Just do not light more than three.
        - id: ch03-b18
          speaker: narrator
          text: >-
            Noureddin lit every lamp and opened all eighty windows. At that moment, Caliph Haroun-al-Raschid happened to look toward the garden from a palace window. He stared at the pavilion blazing with light and summoned his grand vizir, Giafar.
        - id: ch03-b19
          speaker: caliph
          text: >-
            Negligent vizir, look at that pavilion. Why is it fully lit when I am not there?
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: >-
            Giafar saw the lights and trembled. He quickly invented an explanation.
        - id: ch03-b21
          speaker: giafar
          text: >-
            Commander of the Faithful, Scheih Ibrahim came to me four or five days ago. He wished to gather the ministers of his mosque in the pavilion, and I gave him permission. I am afraid I forgot to mention it to your Majesty.
        - id: ch03-b22
          speaker: caliph
          text: >-
            Giafar, you have made three mistakes. You gave permission, you failed to tell me, and you never looked into the matter. Your punishment is to spend the rest of the night there with me and these worthy people. I will dress as a citizen. Disguise yourself and meet me.
        - id: ch03-b23
          speaker: narrator
          text: >-
            They found the garden gate open, which made the caliph furious. The pavilion door stood open too. He climbed quietly and looked through the half-closed door of the hall. There sat Scheih Ibrahim, a man he had always believed sober, drinking and singing with a young man and a beautiful woman. The caliph held back his anger and watched.
        - id: ch03-b24
          speaker: scheih_ibrahim
          text: >-
            Is there anything missing that would make this evening complete?
        - id: ch03-b25
          speaker: fair_persian
          text: >-
            If only I had an instrument to play.
        - id: ch03-b26
          speaker: narrator
          text: >-
            Scheih Ibrahim took a lute from a cupboard. The Fair Persian played and sang with such skill that the hidden caliph was enchanted. When she finished, he crept downstairs to Giafar.
        - id: ch03-b27
          speaker: caliph
          text: >-
            I have never heard a finer voice or a lute played so beautifully. I mean to go inside and have her play for me.
        - id: ch03-b28
          speaker: giafar
          text: >-
            Commander of the Faithful, if Scheih Ibrahim recognizes you, the fright will kill him.
        - id: ch03-b29
          speaker: caliph
          text: >-
            I would be sorry for that. I will make sure he does not know me. Wait here until I return.
    - id: ch04
      title: The Fisher Kerim
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The caliph had turned a bend of the river into a lake inside his garden. The finest fish in the Tigris lived there, and fishing was strictly forbidden. But that night a fisherman had noticed the open gate and slipped inside to cast his nets. As he prepared to haul them in, he saw the disguised caliph coming. He recognized him at once, fell at his feet, and begged for mercy.
        - id: ch04-b02
          speaker: caliph
          text: >-
            Do not be afraid. Stand up and pull in your nets.
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: >-
            The fisherman obeyed and hauled up his nets. Inside were five or six fine fish, and the caliph selected the two largest. Then he told the astonished man to exchange clothes with him. In a few moments Haroun-al-Raschid had been transformed into a fisherman, from the worn shoes on his feet to the turban around his head. Carrying one fish in each hand, he returned to Giafar. The disguise was so complete that the vizir did not recognize his own master and was about to order the supposed fisherman away.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Leaving Giafar below, the caliph climbed the stairs and knocked. Noureddin opened the door.
        - id: ch04-b05
          speaker: caliph
          text: >-
            Scheih Ibrahim, it is Kerim the fisherman. I saw you feasting with friends, so I brought you these fish.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Noureddin and the Fair Persian thanked him. They said they would gladly taste the fish if they were properly cleaned, cooked, and served. The caliph carried them downstairs again. In Scheih Ibrahim's house, he and Giafar set to work and prepared such a tempting dish that the couple ate it with great pleasure. When they had finished, Noureddin remembered the generosity of the fisherman who had brought it. He took out the thirty gold pieces still remaining from Sangiar's gift. Though this was all the money he possessed, he placed the entire sum in the caliph's hands.
        - id: ch04-b07
          speaker: caliph
          text: >-
            Thank you for your generosity. May I ask one more favor? Would the lady play a single piece for me on the lute?
        - id: ch04-b08
          speaker: narrator
          text: >-
            The Fair Persian gladly played and sang. Again the caliph was delighted. Noureddin had always given away anything another person admired, and even now his reckless generosity had not changed.
        - id: ch04-b09
          speaker: noureddin
          text: >-
            Fisherman, since she gives you so much pleasure, take her. She belongs to you now.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The Fair Persian could hardly believe he meant to part with her. Tears filled her eyes. She lifted the lute and sang her reproaches to its music.
        - id: ch04-b11
          speaker: caliph
          text: >-
            Sir, I understand that this lady is your slave. Please tell me how the two of you came here.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Noureddin willingly told the entire story. He explained why his father had purchased the Fair Persian for King Zinebi, how he and the young woman had fallen in love, and how Khacan had allowed them to marry. He spoke of his father's death, his own foolish spending, the false friends who deserted him, and the desperate visit to the slave market. Then he described his fight with Saouy, Sangiar's warning, and the flight that had brought them from Balsora to this garden in Bagdad.
        - id: ch04-b13
          speaker: caliph
          text: >-
            Where will you go now?
        - id: ch04-b14
          speaker: noureddin
          text: >-
            Wherever the hand of Allah leads me.
        - id: ch04-b15
          speaker: caliph
          text: >-
            Then take my advice and return to Balsora at once. I will write to the king, and my letter will make him receive you well.
        - id: ch04-b16
          speaker: noureddin
          text: >-
            I have never heard of a fisherman writing to a king.
        - id: ch04-b17
          speaker: caliph
          text: >-
            That should not surprise you. We studied together and have remained close friends. Fortune made him a king and left me a humble fisherman, but our friendship endured.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The caliph took a sheet of paper and began to write. At the very top, in tiny characters, he placed the words, "In the name of the Most Merciful God." That sacred formula showed that the order beneath it must be obeyed without question. He titled the message as a letter from Caliph Haroun-al-Raschid to the king of Balsora. Then, naming himself as the son of Mahdi, he addressed Mohammed Zinebi as his cousin. The command was brief and exact. As soon as Noureddin, son of the Vizir Khacan, delivered the letter and Zinebi had read it, the king must take off his royal mantle, place it on Noureddin's shoulders, and seat him in his own place. The letter ended with a farewell.
        - id: ch04-b19
          speaker: narrator
          text: >-
            Noureddin took the letter and set out immediately with the little money that remained from Sangiar's gift. The Fair Persian was inconsolable. Once he had gone, she sank onto a sofa in tears.
        - id: ch04-b20
          speaker: narrator
          text: >-
            Scheih Ibrahim had remained silent through all of this. Now he turned on the fisherman.
        - id: ch04-b21
          speaker: scheih_ibrahim
          text: >-
            Kerim, two miserable fish have brought you a purse and a slave. I will take the slave. If the purse holds silver, you may keep one piece. If it holds gold, I will take it all and give you the copper in my own purse.
        - id: ch04-b22
          speaker: narrator
          text: >-
            There was one thing Scheih Ibrahim did not know. Earlier, when the caliph had carried the plate of cooked fish upstairs, he had paused long enough to give Giafar a secret order. The vizir was to hurry to the palace and return with four servants carrying a complete change of royal clothing. They were to wait out of sight beyond the pavilion until they heard the caliph clap his hands. Giafar had obeyed, and the servants were already standing ready outside.
        - id: ch04-b23
          speaker: caliph
          text: >-
            Scheih Ibrahim, I will divide whatever is in the purse equally with you, but the slave stays with me. If you refuse those terms, you will receive nothing.
        - id: ch04-b24
          speaker: narrator
          text: >-
            The old man considered this answer unbearable insolence from a poor fisherman. In drunken fury, he snatched up a cup and hurled it at the caliph. A missile thrown by such an unsteady hand was easy to avoid. The cup sailed past and shattered into a thousand pieces against the wall. That only made Scheih Ibrahim more enraged. He stormed out to find a heavy stick and promised himself a better weapon. The instant he disappeared, the caliph clapped his hands. Giafar and the four palace servants rushed inside. They stripped away the fisherman's rough clothes and dressed Haroun-al-Raschid in the royal garments they had brought.
        - id: ch04-b25
          speaker: narrator
          text: >-
            Scheih Ibrahim returned gripping his stick. The caliph sat on the throne, and only a heap of fishing clothes remained in the center of the hall. The old man threw himself at the caliph's feet.
        - id: ch04-b26
          speaker: scheih_ibrahim
          text: >-
            Commander of the Faithful, your miserable servant has offended you. I beg you to forgive me.
          emotion: fearful
        - id: ch04-b27
          speaker: caliph
          text: >-
            Get up. I forgive you.
          emotion: calm
        - id: ch04-b28
          speaker: narrator
          text: >-
            Then the caliph turned to the Fair Persian.
        - id: ch04-b29
          speaker: caliph
          text: >-
            Fair lady, now you know who I am. I have sent Noureddin to Balsora to become king. When the preparations are complete, I will send you there to be his queen. Until then, you will have rooms in my palace and every honor will be shown to you.
        - id: ch04-b30
          speaker: narrator
          text: >-
            Hope returned to the Fair Persian. The caliph kept his promise and placed her in the care of his wife, Zobeida.
    - id: ch05
      title: The Letter Without Its Seal
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Noureddin made all possible haste on the road to Balsora. The moment he arrived, he went straight to the royal palace and demanded an audience with the king. His request was granted at once. He held the caliph's letter high above his head so everyone could see it and forced his way through the crowded court until he stood before Zinebi. As the king read, the color in his face changed. The caliph's command left no room for refusal, and Zinebi would have obeyed immediately. Before surrendering his throne, however, he handed the letter to Saouy. The wicked vizir's position was threatened just as surely as the king's.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Saouy pretended that he needed better light to read the letter a second time. Turning away, he secretly tore off the sacred formula, placed it in his mouth, and swallowed it. Then he faced the king.
        - id: ch05-b03
          speaker: saouy
          text: >-
            Your Majesty does not need to obey this. The handwriting belongs to the caliph, but the required formula is missing. He has sent no official messenger with the patent either, and without that patent the letter means nothing. Leave the matter to me. I will accept the consequences.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The king allowed Saouy's arguments to overcome the plain command before him. Instead of honoring Noureddin, he placed the young man entirely in his enemy's hands. Saouy first ordered a savage beating. The blows continued until Noureddin lay more dead than alive. Then the vizir had him carried below the prison and shut inside its deepest and darkest dungeon. No comfort was allowed him there. Day after day, his only food was bread, and his only drink was water.
        - id: ch05-b05
          speaker: narrator
          text: >-
            After Noureddin had suffered ten days in the dungeon, Saouy decided that imprisonment was not enough. He wanted his enemy dead, but even he did not dare order an execution without the king's authority. To gain it, he devised another deception. He loaded several of his own servants with costly gifts and led the procession before Zinebi. Then he presented the treasures as though they had been sent by the new king of Balsora to mark his coronation.
        - id: ch05-b06
          speaker: king_zinebi
          text: >-
            What? Is that wretch still alive? Go and cut off his head at once. You have my authority.
          emotion: angry
        - id: ch05-b07
          speaker: saouy
          text: >-
            Sire, thank you for giving me justice. Because Noureddin insulted me in public, let his execution take place before the palace. Have it proclaimed across the city so that everyone knows his fate.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The king granted both requests. The announcement filled Balsora with grief, for the people still loved the memory of Khacan. Saouy went to the prison with twenty of his own servants. They put Noureddin on a miserable horse without a saddle and led him to the palace square.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Saouy's twenty servants closed around the prisoner, and the royal guard formed another barrier beyond them. Even so, the crowd pressed forward and tried to reach Noureddin. The soldiers had great difficulty preventing the people from rushing in and setting him free. Hatred of Saouy had spread through the whole city. If one person had dared to throw the first stone, the others would have followed, and the vizir could not have crossed the streets alive. Saouy watched the unrest from a window in the king's private rooms. Fearing rescue, he called down to the executioner and ordered him to strike at once.
        - id: ch05-b10
          speaker: narrator
          text: >-
            The king countermanded him and ordered the executioner to wait. Zinebi was already jealous of the authority Saouy tried to exercise in his presence. He also had another reason for delaying. In the distance, a company of horsemen had appeared, riding at full gallop toward the palace square. Saouy suspected exactly who these riders might be. Again and again he begged the king to give the signal before they arrived. Zinebi refused. No execution would take place until he knew the identity and purpose of the approaching troop.
    - id: ch06
      title: Rescue at the Palace
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The riders were Giafar and his attendants, racing from Bagdad. For several days after Noureddin left, the caliph had forgotten to send the official patent that made his letter valid. Then he heard a beautiful voice lamenting in the women's rooms of the palace. When he learned it belonged to the Fair Persian, he suddenly remembered the missing document.
        - id: ch06-b02
          speaker: narrator
          text: >-
            Haroun-al-Raschid immediately summoned Giafar and admitted that the forgotten patent might have placed Noureddin in terrible danger. The vizir must ride to Balsora with all possible speed, stopping for nothing that could be avoided. His orders depended on what he found. If Noureddin was already dead, Giafar was to hang Saouy for the crime. If the young man still lived, the vizir must save him and bring three people back to Bagdad without delay: Noureddin, Saouy, and King Zinebi himself.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Giafar and his company galloped straight through the crowded square, forcing a path toward the palace. He dismounted at the steps, where the king himself came down to greet the caliph's grand vizir.
        - id: ch06-b04
          speaker: giafar
          text: >-
            Is Noureddin still alive?
        - id: ch06-b05
          speaker: king_zinebi
          text: >-
            He is alive.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The bound prisoner was led forward from the square. Ropes still held both his hands and his feet, and the marks of his suffering were plain. At Giafar's command, the cords were cut away immediately. The same ropes were then wrapped around Saouy, turning the accuser into the prisoner. Noureddin's execution had been stopped at its final moment. On the following day, Giafar began the return journey to Bagdad, taking with him the rescued Noureddin, the disgraced Saouy, and the king of Balsora.
        - id: ch06-b07
          speaker: narrator
          text: >-
            When the caliph learned how Noureddin had been treated, he gave the young man permission to behead Saouy with his own hands.
        - id: ch06-b08
          speaker: noureddin
          text: >-
            I will not shed my enemy's blood myself.
        - id: ch06-b09
          speaker: narrator
          text: >-
            Noureddin would not take vengeance with his own hands, so Saouy was handed over to the executioner and received the sentence he had tried to bring upon another. The caliph then turned to the promise in his letter. He offered Noureddin the throne of Balsora and invited him to rule the kingdom that had so nearly killed him.
        - id: ch06-b10
          speaker: noureddin
          text: >-
            After everything that happened there, I never wish to return. Let me remain here and serve you instead.
        - id: ch06-b11
          speaker: narrator
          text: >-
            The caliph accepted Noureddin's choice and welcomed him into his own service. In time, the young man became one of Haroun-al-Raschid's closest and most trusted courtiers. Reunited with the Fair Persian, he lived beside her for many years in great happiness. As for King Zinebi, the caliph did not remove him from his throne or punish him further. He sent his cousin back to Balsora with one firm recommendation: in the future, he must show far greater care when choosing the vizirs whose counsel he trusted.
