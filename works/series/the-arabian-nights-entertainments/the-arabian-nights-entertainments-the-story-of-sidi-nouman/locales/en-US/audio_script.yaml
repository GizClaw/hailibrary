  chapters:
    - id: ch01
      title: Sidi-Nouman Before the Caliph
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Caliph Haroun-al-Raschid had listened with great pleasure to the blind man's tale of the dervish. When it ended, he turned to the young man who had treated his horse so cruelly and asked his name. The young man said he was called Sidi-Nouman.
        - id: ch01-b02
          speaker: caliph
          text: >-
            Sidi-Nouman, I have watched horses being trained all my life, and I have trained them myself. Never have I seen anyone handle a horse as brutally as you did yesterday. Everyone there condemned you. I was so angry that I nearly revealed who I was and stopped you myself. Yet you do not seem like a cruel man, and I would like to believe you had some reason. I hear you whip and spur that horse every day, so I mean to learn the truth. Tell me everything. Hide nothing.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            The color left Sidi-Nouman's face, and he grew confused. He knew he could not refuse. He bowed to the floor before the throne and tried to answer, but no words would come.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The Caliph was used to being obeyed at once, but he understood that something troubled the young man. He tried to make him feel safe enough to speak.
        - id: ch01-b05
          speaker: caliph
          text: >-
            Do not think of me as the Caliph just now. Think of me as a friend who wishes to hear your story. If you fear that some part of it may offend me, take courage. I pardon you before you begin. Speak freely, as you would to someone who knows you and cares for you.
          emotion: calm
        - id: ch01-b06
          speaker: narrator
          text: >-
            The Caliph's kindness reassured him. At last, Sidi-Nouman began.
        - id: ch01-b07
          speaker: sidi_nouman
          text: >-
            Commander of the Faithful, your presence overwhelms me, but I will do my best to answer you. I have my faults, yet cruelty is not in my nature, and I do not enjoy breaking the law. I know what I did to my horse must make you think badly of me and may lead others toward wickedness. Still, I did not punish it without cause. When you have heard my story, perhaps you will pity me more than you blame me.
    - id: ch02
      title: Amina's Secret
      blocks:
        - id: ch02-b01
          speaker: sidi_nouman
          text: >-
            My family was not important enough to trouble you with its history. My ancestors managed their affairs carefully, and they left me enough money to live comfortably, though not grandly. I had a modest fortune. All I wanted was a wife who would love me in return. That happiness was not meant for me, for the very day after our marriage, my bride began to test my patience in the hardest way.
        - id: ch02-b02
          speaker: sidi_nouman
          text: >-
            In our country, a man must marry without first seeing the woman who will share his life. So he has little right to complain afterward, as long as she is not truly repulsive or badly deformed. Whatever faults there may be in her appearance, a pleasant nature and good conduct can make up for much. When my wife was brought to my house with all the usual ceremonies, I saw her unveiled for the first time. I was delighted. Amina was every bit as beautiful as I had been told. No one had deceived me about her looks, and I began our life together in high spirits, full of hope that we would be happy.
        - id: ch02-b03
          speaker: sidi_nouman
          text: >-
            The next day, a grand dinner was prepared. Amina did not appear, so I sent a servant to call her. I waited impatiently, and at last she entered. We sat at the table with plates of rice before us. I ate with a spoon. Amina took a small case from her pocket, chose a long pin, and lifted the rice to her mouth one grain at a time. I could hardly believe what I was seeing.
        - id: ch02-b04
          speaker: sidi_nouman
          text: >-
            Amina, is this how you ate rice at home? Is your appetite so small, or are you counting the grains to make sure you never eat too many? If you are trying to save money and teach me not to waste food, you need not worry. We have more than enough for our needs. Please, my dear, do not hold back. Eat as much as you wish, just as I do.
        - id: ch02-b05
          speaker: sidi_nouman
          text: >-
            I spoke kindly and expected a cheerful reply. Amina said nothing. She went on picking up grains, each one more slowly than the last. She tasted none of the other dishes. Now and then, she put a crumb of bread into her mouth, but all those crumbs together would not have fed a sparrow.
        - id: ch02-b06
          speaker: sidi_nouman
          text: >-
            Her stubborn silence annoyed me, but I tried to find every possible excuse for her. Perhaps she was not used to eating in the company of men. Perhaps her family had taught her to act with great restraint in front of her husband. She might already have eaten before joining me, or she might mean to dine later in her own rooms. Any of those explanations could have been true, and I did not want to judge her too quickly. I said no more. When I had finished my meal, I left the room, though in secret her strange behavior vexed me greatly.
        - id: ch02-b07
          speaker: sidi_nouman
          text: >-
            At supper, the same thing happened. It continued through the next day whenever we ate together. No woman could live on two or three crumbs of bread and a few grains of rice, so she had to be eating somewhere else. I decided to discover when and how she found her food. I gave no sign that I was watching. I hoped that, little by little, she would grow used to me, become friendlier, and let me understand her ways without being questioned. Before long, I saw that all those hopes were useless.
        - id: ch02-b08
          speaker: sidi_nouman
          text: >-
            One night, I lay with my eyes closed and seemed to be sound asleep. Amina rose softly and dressed without a sound. I could not imagine where she meant to go, so I resolved to follow. She slipped from the room. As soon as the curtain fell behind her, I put a garment over my shoulders and slippers on my feet. Through a lattice overlooking the courtyard, I saw her pass through the street door and carefully leave it open.
        - id: ch02-b09
          speaker: sidi_nouman
          text: >-
            The moon was bright enough for me to keep her in sight without coming close. She walked to a cemetery not far from our house and entered it. I stayed beneath the shadow of the wall and crouched where I could not easily be seen. I had barely concealed myself when Amina came toward me again, this time beside a female ghoul. Your Highness knows the kind of demon I mean. Such creatures roam the countryside and make their lairs in deserted buildings. They leap upon unwary travelers and devour their flesh. If no living person crosses their path, they turn instead to cemeteries and feed upon the bodies buried there.
        - id: ch02-b10
          speaker: sidi_nouman
          text: >-
            The sight of my wife beside that hideous creature nearly robbed me of speech. They passed my hiding place without noticing me. Together they dug up a body that had been buried earlier that day. Then they sat on the edge of the open grave and began their dreadful meal. What horrified me almost as much as the feast was the way they talked. They chatted quietly and cheerfully the whole time, though I was too far away to make out their words. When they had finished, they lowered what remained of the body into the grave and heaped the earth over it again.
        - id: ch02-b11
          speaker: sidi_nouman
          text: >-
            I did not try to stop them. I hurried home, left the street door open exactly as I had found it, climbed into bed, and pretended to sleep. A little later, Amina returned just as quietly. She undressed and slipped into bed, apparently certain that she had hidden her journey perfectly.
    - id: ch03
      title: The Man Who Became a Dog
      blocks:
        - id: ch03-b01
          speaker: sidi_nouman
          text: >-
            After what I had seen, sleep would not come for a long time. At the first sound calling the faithful to prayer, I dressed and went to the mosque. Even prayer could not restore peace to my troubled mind. I could not face Amina until I had decided what our future should be, so I spent the morning wandering from one garden to another. I turned plan after plan over in my thoughts, searching for some way to make her abandon those horrible practices. I considered using force to make her obey, but I could not bring myself to treat her cruelly. Besides, I felt that gentle means had the better chance of succeeding. By then I was somewhat calmer, and I returned home around dinner time.
        - id: ch03-b02
          speaker: sidi_nouman
          text: >-
            Amina had dinner served as soon as I arrived. We sat down, and once again she picked at only a few grains of rice. I could bear the secret no longer, so I spoke as quietly as I could.
        - id: ch03-b03
          speaker: sidi_nouman
          text: >-
            Amina, you must know how surprised I was when, on the day after our wedding, you refused everything but a few bites of rice. The way you acted would have deeply wounded most husbands. I was patient with you. Instead of complaining, I tried to tempt your appetite with the finest dishes I could think of, but nothing pleased you. Still, Amina, surely there must be something among them that tastes as sweet to you as the flesh of a corpse?
        - id: ch03-b04
          speaker: sidi_nouman
          text: >-
            The instant I said it, she knew I had followed her to the cemetery. I had never seen such fury. Her face turned purple. Her eyes seemed ready to burst from her head, and foam gathered at her mouth. I watched in terror, unable to guess what she would do.
        - id: ch03-b05
          speaker: sidi_nouman
          text: >-
            Amina snatched up a vessel of water, dipped her hand into it, and murmured words I could not understand. Then she scattered the water over my face and cried out wildly.
        - id: ch03-b06
          speaker: amina
          text: >-
            Wretch! This is your reward for spying on me. Become a dog!
          emotion: angry
        - id: ch03-b07
          speaker: sidi_nouman
          text: >-
            Before the last word had left her mouth, I knew that I was no longer a man. I felt no change taking place, yet suddenly I stood there in the body of a dog. I had never imagined that Amina was a magician. The shock was so great that I did not even think of running away. I remained rooted to the spot while she seized a stick and began to beat me. Her blows fell so heavily that I can only wonder they did not kill me then and there.
        - id: ch03-b08
          speaker: sidi_nouman
          text: >-
            The pain finally broke my stupor. I raced into the courtyard with Amina close behind. She lunged at me wildly with the stick, and I was not quick enough to avoid every blow. At last she stopped chasing me. Perhaps she had grown tired, or perhaps a new idea had come to her, one that promised me a quicker and more painful death. She opened the gate leading to the street and waited for me to pass, intending to crush me between the gate and its frame.
        - id: ch03-b09
          speaker: sidi_nouman
          text: >-
            Though I was a dog, I understood her plan. The danger sharpened my mind. I chose my moment and sprang through the opening. She slammed the gate, but caught only the tip of my tail.
        - id: ch03-b10
          speaker: sidi_nouman
          text: >-
            I was free, but my tail hurt terribly. I ran through the streets, yelping and howling so loudly that other dogs rushed at me. To escape them, I fled into a cookshop that sold tongues and sheep's heads.
        - id: ch03-b11
          speaker: sidi_nouman
          text: >-
            The cook was kind at first. He drove off the dogs that were still snapping at my heels while I crept into the darkest corner of the shop. For the moment, I was safe. But I was not meant to remain long under his protection. The man believed dogs were so unclean that all the washing in the world could hardly purify someone after touching one. As soon as my attackers had gone to look for other prey, he tried to lure me out of my corner so he could force me into the street. I refused to leave my hiding place. After the pain Amina had inflicted, I desperately needed rest, and I slept there through the night.
        - id: ch03-b12
          speaker: sidi_nouman
          text: >-
            The next morning, the cook went early to market and returned loaded with the sheep's heads, tongues, and trotters that made up his stock for the day. The smell of fresh meat drew hungry dogs from all around the neighborhood. They crowded his door and begged for scraps, so I crept out of my corner and stood among them. Despite his belief that dogs were unclean, my protector had a kind heart. He knew I had eaten nothing since the day before. When he began throwing out pieces, he made sure that mine were larger and better than anything the other dogs received.
        - id: ch03-b13
          speaker: sidi_nouman
          text: >-
            When I had eaten, I tried to return to the shop. The cook planted himself in the doorway with a heavy stick and would not let me pass. I had no choice but to look for another home.
    - id: ch04
      title: Rufus and the False Coins
      blocks:
        - id: ch04-b01
          speaker: sidi_nouman
          text: >-
            A few steps away stood a baker's shop. Its owner seemed cheerful and good-natured. He was eating breakfast when I arrived. Although I gave no sign that I was hungry, he immediately threw me a piece of bread. Most dogs would have swallowed it without a thought. I lowered my head and wagged my tail first, so he would understand that I thanked him for his kindness. He did understand, and he smiled at me pleasantly.
        - id: ch04-b02
          speaker: sidi_nouman
          text: >-
            I was not really hungry after the meat I had eaten, but refusing his kindness seemed rude. I ate the bread slowly so he would see that I accepted it only to be polite. He understood that as well. When I finished, I sat facing the door. I wanted him to see that I asked for nothing more than his protection. He was quite willing to let me remain in the shop. Soon he even encouraged me to enter the house itself and gave me a corner where I could sleep without standing in anyone's way.
        - id: ch04-b03
          speaker: sidi_nouman
          text: >-
            That excellent man treated me with far more kindness than I could ever have expected. His manner toward me was always affectionate, and he let me share his breakfast, dinner, and supper. In return, I gave him all the gratitude, loyalty, and attachment he deserved. Whenever he was near, I sat with my eyes fixed upon him. He never left the house without me at his heels. If I happened to be asleep when he prepared to go out and failed to notice him, he would call the name he had given me.
        - id: ch04-b04
          speaker: baker
          text: >-
            Rufus! Rufus, come with me!
        - id: ch04-b05
          speaker: sidi_nouman
          text: >-
            Several weeks passed happily. Then one day, a woman came to buy bread. She placed several coins on the counter, and one was false. The baker saw it and asked her for another. She refused to take it back and insisted it was perfectly good. He would not accept it. At last, he laughed and called to me.
        - id: ch04-b06
          speaker: baker
          text: >-
            That coin is such a poor copy, even my dog can spot it. Rufus! Come here and find the bad one.
        - id: ch04-b07
          speaker: sidi_nouman
          text: >-
            I jumped onto the counter. The baker spread the coins before me. I examined them one by one, placed my paw on the false coin, and looked up at my master so he would know which one I meant.
        - id: ch04-b08
          speaker: sidi_nouman
          text: >-
            The baker had called me only as a joke. He never dreamed I could truly answer, so what I did amazed him. The woman was astonished too. She could no longer deny that the coin was false, and she produced another piece of money to replace it. After she left, my master was so delighted with me that he told all the neighbors what had happened. In his excitement, he made my cleverness sound much greater than it really was.
        - id: ch04-b09
          speaker: sidi_nouman
          text: >-
            Naturally, the neighbors refused to believe such a story. They gathered all the bad money they could find and tested me several times. Each time, they mixed false coins among good ones, and each time I laid my paw on the right piece. I never failed their tests. Word spread quickly. Before long, people filled the shop from morning until night. They came pretending to buy bread, but what they really wanted was to see whether the famous dog was as clever as people claimed. With so many visitors, the baker did a roaring trade. He freely admitted that I was worth my weight in gold to him.
        - id: ch04-b10
          speaker: sidi_nouman
          text: >-
            Of course, his success made plenty of people jealous. Many traps were laid for me, and my master no longer dared let me out of his sight. One day, a woman who had never visited the shop before came in and asked for bread like all the others. I was lying on the counter as usual. She placed six coins before me, with one false coin hidden among them. I examined the pieces, found the false one at once, and put my paw upon it. Then I looked directly at the woman.
        - id: ch04-b11
          speaker: magician_mother
          text: >-
            Yes. You are right. That is the false one.
        - id: ch04-b12
          speaker: sidi_nouman
          text: >-
            She studied me carefully for some time. Then she paid for her bread and left, secretly motioning for me to follow.
        - id: ch04-b13
          speaker: sidi_nouman
          text: >-
            My thoughts were always searching for some way to escape Amina's spell. I remembered how intently this woman had studied me, and I began to suspect that she had guessed what had happened. As it turned out, I was right. Still, I did not follow at once. I let her walk a little way while I stood at the shop door and watched. She turned around, saw that I had not moved, and beckoned to me a second time.
        - id: ch04-b14
          speaker: sidi_nouman
          text: >-
            The baker was busy with his oven and had forgotten me for the moment. I slipped away and ran after the woman.
    - id: ch05
      title: The Spell Is Broken
      blocks:
        - id: ch05-b01
          speaker: sidi_nouman
          text: >-
            Her house was some distance away. When we reached it, she opened the door and spoke to me.
        - id: ch05-b02
          speaker: magician_mother
          text: >-
            Come in. Come in. You will never regret following me.
        - id: ch05-b03
          speaker: sidi_nouman
          text: >-
            Once I entered, she fastened the door behind us and led me into a large room. A beautiful young woman sat there, working carefully on a piece of embroidery. My guide turned to her eagerly and announced why she had brought me.
        - id: ch05-b04
          speaker: magician_mother
          text: >-
            Daughter, I have brought you the baker's famous dog, the one that can tell good money from bad. When I first heard about him, I told you he must be a man changed into a dog by magic. Today I went to the shop to test the story for myself, and I persuaded him to follow me home. What do you think now?
        - id: ch05-b05
          speaker: young_magician
          text: >-
            You were right, Mother.
        - id: ch05-b06
          speaker: sidi_nouman
          text: >-
            The girl rose and dipped her hand into a vessel of water. She sprinkled the water over me and spoke.
        - id: ch05-b07
          speaker: young_magician
          text: >-
            If you were born a dog, remain a dog. But if you were born a man, then by the power of this water, take back your true form.
        - id: ch05-b08
          speaker: sidi_nouman
          text: >-
            In a single moment, the spell broke. The body of the dog vanished as completely as though it had never existed, and I stood before her once more as a man. I could scarcely contain my gratitude at being delivered from that miserable shape. I fell at the young woman's feet and kissed the edge of her garment.
        - id: ch05-b09
          speaker: sidi_nouman
          text: >-
            How can I ever thank you for showing such kindness to a stranger and setting me free? From this moment, I am your servant. You may do with me whatever you wish.
        - id: ch05-b10
          speaker: sidi_nouman
          text: >-
            Then I told the young woman my whole story, from Amina's strange eating to the spell that had turned me into a dog. I wanted her to understand exactly how I had come to stand before her in that shape. When the tale was finished, I turned to her mother and gave her the thanks she deserved for finding me and leading me to the happiness of being human again.
        - id: ch05-b11
          speaker: young_magician
          text: >-
            Sidi-Nouman, you owe us no more thanks. Knowing that we helped you is payment enough. We must speak about your wife. I knew Amina before she married you. I knew she was a magician, and she knew that I had studied the same art under the same teacher. We often met on our way to the same baths, but we disliked one another and never tried to become friends. Breaking your spell is not enough. Amina must be punished for her wickedness. Please stay here with my mother for a moment. I will soon return.
        - id: ch05-b12
          speaker: sidi_nouman
          text: >-
            The young magician hurried away, leaving me alone with her mother. While we waited, I again tried to express how deeply grateful I was, not only to the daughter who had broken the spell, but also to the mother who had recognized me and brought me home.
        - id: ch05-b13
          speaker: magician_mother
          text: >-
            My daughter knows as much magic as Amina, as you have seen. But you would be amazed by all the good she does with it. That is why I have never stopped her from practicing. Otherwise, I would have ended it long ago.
        - id: ch05-b14
          speaker: sidi_nouman
          text: >-
            As the mother finished speaking, her daughter came back into the room. She carried a small bottle in her hand and had already learned what I must do next.
        - id: ch05-b15
          speaker: young_magician
          text: >-
            Sidi-Nouman, the books I consulted tell me that Amina is away from home, though she may return at any moment. They also reveal that she has pretended to be deeply worried by your disappearance. She told the servants that you suddenly remembered urgent business during dinner and hurried out without shutting the door. Then, she says, a dog wandered inside, and she had to drive it away with a stick.
        - id: ch05-b16
          speaker: young_magician
          text: >-
            Go home at once and wait in your room. When Amina returns, go down to meet her. The sight of you will startle her, and she will try to escape. Have this bottle ready. Throw the water over her and say, "Receive the reward of your crimes." That is all you need to do.
    - id: ch06
      title: The Horse in the Square
      blocks:
        - id: ch06-b01
          speaker: sidi_nouman
          text: >-
            Everything happened exactly as the young magician had foretold. I had been home only a few minutes when Amina returned. As she drew near, I stepped in front of her with the bottle in my hand. She gave a loud cry and turned toward the door, but she was too late. I had already thrown the water into her face and spoken the words of the spell.
        - id: ch06-b02
          speaker: sidi_nouman
          text: >-
            Amina vanished. In her place stood the horse you saw me beating yesterday.
        - id: ch06-b03
          speaker: sidi_nouman
          text: >-
            That, Commander of the Faithful, is my story. Now that you know why I acted as I did, may I hope that you will not think this wicked woman has been punished too harshly?
        - id: ch06-b04
          speaker: caliph
          text: >-
            Sidi-Nouman, your story is truly extraordinary, and there is no excuse for your wife's actions. I will not condemn you for what you have done, but think how greatly she must suffer in the body of an animal. Let that punishment be enough. I will not command you to ask the young magician to make your wife human again. Women who use magic for evil do not easily abandon it. If Amina were restored, I might only bring upon you a revenge far worse than everything you have already endured.
