audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    caliph:
      display_name: 哈伦·拉希德
      tts:
        delivery: 威严果断，言谈中带着敏锐的好奇
        timbre: 洪亮圆润
        pace: 从容
        pitch: 中低音
    sidi_nouman:
      display_name: 西迪·努曼
      tts:
        delivery: 恭谨坦诚，讲到惊险处仍带着克制
        timbre: 清朗温厚
        pace: 平稳，情势紧迫时稍快
        pitch: 中音
    amina:
      display_name: 阿米娜
      tts:
        delivery: 冷淡隐忍，暴怒时尖厉凶狠
        timbre: 冷冽清晰
        pace: 偏慢，施咒时骤然加快
        pitch: 中高音
    baker:
      display_name: 面包师
      tts:
        delivery: 爽朗热情，带着市井人的诙谐
        timbre: 明亮饱满
        pace: 轻快
        pitch: 中音
    mother:
      display_name: 女巫的母亲
      tts:
        delivery: 热心机敏，说话爽快可信
        timbre: 柔和成熟
        pace: 从容
        pitch: 中音
    young_magician:
      display_name: 年轻女巫
      tts:
        delivery: 沉着善良，谈及法术时坚定自信
        timbre: 清澈柔韧
        pace: 不疾不徐
        pitch: 中高音
  chapters:
    - id: ch01
      title: 新娘的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哈里发哈伦·拉希德听完盲人与德尔维希的故事，很是满意。接着，他转向昨天虐待坐骑的年轻人，问他叫什么名字。年轻人说，自己名叫西迪·努曼。
        - id: ch01-b02
          speaker: caliph
          text: |-
            西迪·努曼，我这辈子见过许多人驯马，自己也驯过，可从没见过谁像你昨天那样狠毒地对待一匹马。围观的人都在斥责你，我也气得差点当场亮明身份，叫你住手。

            不过，你看起来并非天性残忍。我愿意相信，你这样做自有缘故。可人们说，你天天都在鞭打它，还用马刺踢它。我一定要知道事情的真相。你从头说来，什么也不要隐瞒。
        - id: ch01-b03
          speaker: narrator
          text: 西迪·努曼听见这番话，顿时变了脸色，神情也慌乱起来。他心里明白，这件事已经无法回避，只好伏倒在哈里发的御座前，竭力想要遵命开口。可话一直堵在喉头，他伏在那里，半晌一声也说不出来。
        - id: ch01-b04
          speaker: caliph
          text: 西迪·努曼，眼下只把我当成一个想听你讲故事的朋友。即使其中有什么会冒犯我，你也不用害怕，我先宽恕你。像对一个了解你、关心你的朋友那样，坦然说出一切吧。
        - id: ch01-b05
          speaker: narrator
          text: 哈里发如此宽厚，西迪·努曼总算安下心来。
        - id: ch01-b06
          speaker: sidi_nouman
          text: |-
            信士的统帅，臣虽在陛下的威仪前心神惶惑，仍会竭尽所能。臣不是完人，却也并非生性残忍，更不以犯法为乐。臣知道，自己那样责打坐骑，会让陛下厌恶，也会给旁人树立坏榜样。

            可臣并非无缘无故责罚它。等陛下听完，臣只盼您觉得，臣与其说该受惩罚，不如说更值得怜悯。
        - id: ch01-b07
          speaker: sidi_nouman
          text: |-
            臣出身平凡，不值得耽误陛下的时间。祖辈谨慎持家，给臣留下的钱足够安稳度日，只是不算富丽奢华。臣有了这份家产，所缺的只是一位能回应臣真情的妻子。可惜，这份福气并不属于臣。婚后第二天，新娘就开始以种种最难忍受的方式考验臣。

            按照我们这里的风俗，男子婚前不能见到将与自己共度一生的女子。所以，只要妻子不是丑陋得无法亲近，也没有严重的残疾，丈夫自然无权抱怨。即使身体有些缺陷，只要性情温柔，举止得体，也能弥补许多。
        - id: ch01-b08
          speaker: sidi_nouman
          text: |-
            妻子按惯例举行完婚礼，被送到臣家里以后，臣才第一次见到她揭下面纱。别人早就说她美貌，如今看来果然一点不假，臣并没有受骗。臣满心欢喜，就这样开始婚后的生活，以为最美满的幸福正在前面等着。

            第二天，家里备好丰盛的饭菜，她却迟迟不来。臣让仆人去请，又等了许久，她才走进房间。我们坐到桌边，仆人给两人各端来一盘米饭。
        - id: ch01-b09
          speaker: sidi_nouman
          text: 臣拿勺子吃饭，却看见妻子从衣袋里取出一只小匣，拈出一根长针。她不用勺子，竟拿针把米粒一颗一颗送进嘴里。
        - id: ch01-b10
          speaker: sidi_nouman
          text: 阿米娜，你在娘家也是这样吃饭吗？是因为胃口太小，还是非要数清米粒，不让自己多吃？要是你想节省，还想教臣不可浪费，那实在不必担心。几口饭不会叫我们破产。家里的钱足够应付生活，你想吃多少，就像臣一样好好吃吧！
          emotion: surprised
        - id: ch01-b11
          speaker: sidi_nouman
          text: |-
            臣以为这番亲热的话会换来快活的回答，阿米娜却一声不吭，还是拿针挑米，吃得越来越慢。桌上别的菜，她碰也不碰，偶尔只吃一小屑面包，那点分量连麻雀也喂不饱。

            她如此固执，臣有些生气，仍尽力替她找理由。也许她从来不惯于同男子吃饭，家人又教她在丈夫面前必须谨慎矜持。也许她早就吃过，或打算回自己的房间以后再吃。臣没有再问，饭后装作若无其事地离开，心里却被她的古怪举动搅得十分烦恼。
        - id: ch01-b12
          speaker: sidi_nouman
          text: |-
            晚饭时仍是如此。接下来一整天，只要我们同桌，她也只吃两三屑面包和几粒米。谁也不可能靠这些活下去，臣决定查明她究竟何时、在何处进食。臣表面上不再留意她做什么，心里仍盼着，只要给她一点时间，她就会渐渐习惯臣，也愿意与臣亲近。可臣很快就明白，这番期待全然落空了。

            一天夜里，臣闭眼躺着，装成已经熟睡。阿米娜悄悄起身，一点声音也没有，穿好衣服便走出房间。臣猜不出她要做什么，决定暗中跟随。
        - id: ch01-b13
          speaker: sidi_nouman
          text: |-
            她刚放下身后的帘子，臣便披上外衣，套上拖鞋。从朝向院子的格窗望去，正看见她走出临街的大门，还特意留了一道缝。

            那晚月色明亮，臣毫不费力就一路盯着她，直到她走进离家不远的墓地。臣藏在围墙的阴影里，小心地蹲下。才刚藏好，就看见妻子同一个丑陋的女食尸鬼走来。陛下知道，这类恶魔在乡野游荡，藏身于废弃的屋子，会突然扑杀毫无防备的旅人，吞吃他们的血肉。路上找不到活人时，它们就到墓地吞食尸体。
        - id: ch01-b14
          speaker: sidi_nouman
          text: |-
            看见妻子与那可怕的女食尸鬼同行，臣惊骇得几乎失声。她们从面前经过，完全没有发现臣。两人刨出一具当天才下葬的尸体，坐在墓穴边，享用那顿恐怖的晚餐。吃的时候，她们始终轻松愉快地说着话。臣离得太远，听不清她们到底谈了些什么。

            她们吃完，把尸体扔回墓穴，重新填好泥土。臣不敢惊动她们，赶紧回家，照原样留着大门，再躺回床上装睡。
        - id: ch01-b15
          speaker: sidi_nouman
          text: |-
            不久，阿米娜悄无声息地回来，脱衣上床。看她的样子，还在暗自庆幸这次夜行安排得天衣无缝。

            经历那样的场面，臣久久不能合眼。召唤信徒祈祷的声音一响，臣便穿上衣服，前往清真寺。可就连祈祷也不能安定臣的心。臣还没想好以后该怎样对待妻子，实在无法回去面对她。整个上午，臣都在一座座花园之间游荡，反复思量怎样迫使她戒掉那种可怕的习性。
        - id: ch01-b16
          speaker: sidi_nouman
          text: 臣想过用强硬手段，却不忍粗暴待她。臣也觉得，温和的办法更可能奏效。心情稍稍平复以后，臣回到家中，那时正好临近午饭。
    - id: ch02
      title: 魔法与流浪
      blocks:
        - id: ch02-b01
          speaker: sidi_nouman
          text: 臣一回家，阿米娜便让仆人摆饭。她照旧只挑起几粒米。那件事沉沉压在臣心头，臣决定立刻说明。
        - id: ch02-b02
          speaker: sidi_nouman
          text: 阿米娜，婚后第二天，你只肯吃几口米，举止又那么反常。你一定知道臣有多惊讶。换了别的丈夫，早已深受伤害。臣却耐心待你，想尽办法做出最好的菜，可你一样也不肯吃。桌上这些佳肴，难道就没有一道像死尸的肉那样香甜吗？
        - id: ch02-b03
          speaker: sidi_nouman
          text: 话刚出口，阿米娜便明白臣跟踪她去了墓地。她猛然暴怒。臣一生从没见过谁发那么大的火。她的脸涨成紫色，两眼像要迸出眼眶，嘴边甚至冒起白沫。
        - id: ch02-b04
          speaker: sidi_nouman
          text: 臣惊恐地望着她，不知道接下来会发生什么。她抓起身旁的水器，把手浸进去，低声念了几句臣听不清的咒语。随后，她将水洒到臣脸上，疯狂地尖叫起来。
        - id: ch02-b05
          speaker: amina
          text: 恶徒，窥探我的报应来了。变成狗吧！
          emotion: angry
        - id: ch02-b06
          speaker: sidi_nouman
          text: |-
            她话音未落，臣还没感觉身体有什么变化，就突然知道自己已经不是人了。臣根本不知道阿米娜是个女巫，惊骇得连逃跑也忘了，只能呆站在那里。

            阿米娜抓起木棍，劈头盖脸打下来。她下手极重，臣至今都不明白自己为何没有当场丧命。棍棒倒把臣从震惊中打醒了。臣冲进院子，她紧追在后，一次又一次发疯似的扑来。臣已经拼命躲闪，还是慢了一步，又挨了好几下。
        - id: ch02-b07
          speaker: sidi_nouman
          text: |-
            后来，她也许追累了，也许想到一种能让臣迅速而痛苦地死去的新办法，竟打开临街的大门，打算在臣穿过去时把臣活活夹死。臣虽成了狗，却看透了她的用意。巨大的危险逼得臣恢复机敏，臣算准时机冲了出去。大门砰地合上，只夹住臣的尾巴尖。

            臣逃得性命，尾巴却痛得厉害。臣一路哀号，引来附近的狗围攻。为了躲开它们，臣钻进一家专卖羊舌和羊头的熟食铺。
        - id: ch02-b08
          speaker: sidi_nouman
          text: |-
            店主起初很和善，赶走仍追在臣身后的狗，让臣躲进最阴暗的角落。臣总算暂时安全了，可这份庇护注定不会长久。店主认定狗极不洁净，觉得只要与狗接触，再怎样洗也洗不干净。等外面的狗散去，另找猎物以后，他就想把臣从角落里引出来，硬赶回街上。

            臣死活不肯出来，就在那里睡了一夜。受过阿米娜那番折磨，臣实在太需要休息了。
        - id: ch02-b09
          speaker: sidi_nouman
          text: |-
            臣不愿用变成狗以后的悲苦念头烦扰陛下。不过，第二天早晨，店主出去采买，回来时带着当天要卖的羊头、羊舌和羊蹄。肉香引来附近许多饿狗，都围在门口讨碎肉。臣也悄悄走出角落，站到它们中间。

            店主虽嫌狗不洁，心地倒很善良。他知道臣从昨天起什么也没吃，给臣的肉块比落到别的狗面前的更大，也更好。臣吃完以后，仍想回到店里，他这次却绝不允许。他提着一根结实的粗棍，牢牢守住门口。臣实在进不去，只好放弃，另找住处。
        - id: ch02-b10
          speaker: sidi_nouman
          text: |-
            往前几步就是一家面包铺，店主看起来快活爽朗。他正在吃早饭，见臣走来，立刻扔了一块面包。臣没有像普通的狗那样吞下，而是低头摇尾向他道谢。他看懂了，笑得很愉快。

            其实臣一点也不想吃，只觉得拒绝这份好意太失礼，便慢慢吃完，让他知道臣只是出于礼貌。他连这层意思也懂了，似乎很愿意让臣留在铺里。臣面朝门口坐下，表示只求他的庇护。他答应下来，还鼓励臣走进内屋，给了臣一个不会挡路、也不会妨碍任何人的角落睡觉。
        - id: ch02-b11
          speaker: sidi_nouman
          text: |-
            这位好心人给臣的关爱，远远超过臣所能期望。他待臣总是亲热和善，每天早饭、午饭和晚饭都分给臣吃。臣也以全部的感激和依恋回报他，尽到自己应尽的情分。臣总是目不转睛地望着他。他每次离开铺子，臣必定跟在脚边。偶尔臣睡着了，没有发现他正准备出门，他就会呼唤臣。
        - id: ch02-b12
          speaker: baker
          text: 鲁弗斯！鲁弗斯！
    - id: ch03
      title: 会辨假钱的狗
      blocks:
        - id: ch03-b01
          speaker: sidi_nouman
          text: |-
            鲁弗斯正是他给臣取的名字。这样的日子过了几个星期。一天，一个女子来买面包。付钱时，她放下几枚硬币，其中一枚是假币。面包师看出来了，要她另换一枚，她却坚持说钱是真的。两人谁也不肯退让。

            最后，面包师喊了起来。
        - id: ch03-b02
          speaker: baker
          text: 这假币做得也太差了，连我的狗都骗不过！来，鲁弗斯！鲁弗斯！
        - id: ch03-b03
          speaker: sidi_nouman
          text: 臣听见召唤，马上跳上柜台。面包师把那些钱撒在臣面前。
        - id: ch03-b04
          speaker: baker
          text: 来看看，这里面有没有假币。
        - id: ch03-b05
          speaker: sidi_nouman
          text: |-
            臣把每一枚钱依次看过，然后把爪子按在那枚假币上，又抬眼望着主人，清清楚楚地指给他看。面包师本来只是在开玩笑，根本没料到臣会明白。他见臣真的找出假币，对臣的聪明惊讶极了。那女子也终于相信他说的是实话，拿出另一枚钱换掉了假币。

            她走后，主人高兴极了，把这件事告诉所有邻居，还说得比事实神奇许多。邻居们自然不肯相信。他们把能够搜集到的假币全拿来，一次又一次试探臣。无论混进什么假钱，臣每回都能顺利找出，从来没有失手。
        - id: ch03-b06
          speaker: sidi_nouman
          text: |-
            很快，从早到晚都有人挤满铺子。他们假装来买面包，其实都想亲眼看看，臣是否真像传闻中那么聪明。面包师的生意兴隆得不得了。他自己也承认，臣对他来说，简直和同等重量的黄金一样贵重。

            眼红他生意的人当然不少。他们挖空心思，设下一个又一个陷阱，全都冲着臣而来。面包师知道有人想害臣，从此一刻也不敢让臣离开视线。
        - id: ch03-b07
          speaker: sidi_nouman
          text: |-
            一天，一个从没来过的女子也到铺里买面包。臣照常趴在柜台上。她放下六枚硬币，其中一枚是假币。臣立刻认出来，把爪子按在上面，又抬头看她。

            她点了点头。
        - id: ch03-b08
          speaker: mother
          text: 对，你找得一点不错，就是这一枚。
        - id: ch03-b09
          speaker: sidi_nouman
          text: |-
            她站在那里，仔细端详臣许久。付过面包钱以后，她走出铺子，临走时暗暗打了个手势，让臣跟上。

            臣的心思一直放在解除魔法上，总盼着能找到办法。看她注视臣的神情，臣忽然猜想，她也许知道臣身上发生过什么。后来果然证明，臣没有猜错。不过，臣先让她走出一小段路，自己只站在门边看着。她回头见臣仍然不动，又朝臣招了招手。
        - id: ch03-b10
          speaker: sidi_nouman
          text: 面包师这时正忙着照看烤炉，已经把臣忘在一边。臣便轻轻溜出铺子，跑去追赶那个女子。她的家离面包铺颇远，臣一路跟随。等我们终于到达，她打开房门，转身招呼臣进去。
        - id: ch03-b11
          speaker: mother
          text: 进来吧，快进来。你绝不会后悔跟我走这一趟。
        - id: ch03-b12
          speaker: sidi_nouman
          text: 臣进门后，她闩好门，把臣领进一间宽敞的屋子。一个美丽的姑娘正在里面刺绣。那女子立刻叫起女儿来。
        - id: ch03-b13
          speaker: mother
          text: |-
            女儿，我把面包师那条会辨真假钱的名犬带来了。你还记得吗？我第一次听说它，就认定它原本是个人，只是被魔法变成了狗。

            今天我亲自到面包铺查验这个传闻，亲眼看见它辨出假币，又劝它跟着我回到这里。现在你亲自看看，觉得我猜得对不对？
        - id: ch03-b14
          speaker: young_magician
          text: 母亲说得没错。
        - id: ch03-b15
          speaker: sidi_nouman
          text: 姑娘起身，把手浸进一只水器，又将水洒到臣身上。
        - id: ch03-b16
          speaker: young_magician
          text: 如果你生来就是狗，便继续做狗。如果你生来是人，就借这水的力量，恢复本来的样子。
        - id: ch03-b17
          speaker: sidi_nouman
          text: 转眼之间，魔法解除了。狗的形体消失得无影无踪，站在姑娘面前的又成了一个男人。臣感激得不能自已，立即扑倒在她脚边，亲吻她的衣襟。
        - id: ch03-b18
          speaker: sidi_nouman
          text: 您善待一个素不相识的人，还为臣做下这样的大恩，臣该怎样感谢才好？从今以后，臣就是您的奴仆，任凭您处置！
        - id: ch03-b19
          speaker: sidi_nouman
          text: 接着，为了让她明白臣为什么会变成狗，臣把全部经过从头到尾讲了一遍。讲完以后，臣也向她的母亲郑重道谢。若不是那位母亲看出真相，又把臣带到这里，臣不会得到今日的解救。
    - id: ch04
      title: 年轻女巫的帮助
      blocks:
        - id: ch04-b01
          speaker: young_magician
          text: |-
            西迪·努曼，不用再说欠我们什么人情了。知道我们帮到了你，就是足够的回报。现在该说说你的妻子阿米娜。

            她成婚以前，我就认识她。我知道她是个女巫，她也知道，我曾和她跟着同一位老师学习法术。我们常在去同一间浴室的路上碰见，可彼此都不喜欢，也从来没有主动亲近，更没有成为朋友。
        - id: ch04-b02
          speaker: young_magician
          text: 你的魔法虽然解除了，这件事却还没有结束。阿米娜必须为恶行受罚。请你陪母亲等我片刻，我很快回来。
        - id: ch04-b03
          speaker: sidi_nouman
          text: 姑娘离开以后，臣独自陪着她的母亲，又一次向老人家表达感激，也请她把这份谢意转达给女儿。
        - id: ch04-b04
          speaker: mother
          text: 你已经看出来，我女儿的法术和阿米娜一样高明。可她用这份本领做过多少好事，说出来一定会让你惊讶。正因为她只用法术帮助别人，我才从不干涉。否则，我早就制止她，不准她继续下去了。
        - id: ch04-b05
          speaker: sidi_nouman
          text: 说话间，姑娘回来了，手里拿着一只小瓶。
        - id: ch04-b06
          speaker: young_magician
          text: |-
            西迪·努曼，我刚才查过法术书。书上说，阿米娜现在不在家，不过随时可能回来。书上还告诉我，她在仆人面前装得十分担忧，好像很为你的失踪着急。

            她编了一个故事，说你同她吃饭时，忽然想起一件要立刻办理的事，出门时忘了关门。一条狗闯进屋里，她只好拿棍子将狗赶出去。
        - id: ch04-b07
          speaker: young_magician
          text: |-
            你马上回家，到自己的房间等她。她回来时，你就下楼迎上去。她一见你，必定大吃一惊，转身逃跑。

            那时，你要备好这只瓶子，把里面的水泼到她身上，大声说：“收下你作恶的报应吧。”我要告诉你的就是这些。
        - id: ch04-b08
          speaker: sidi_nouman
          text: |-
            一切果然和年轻女巫预言的分毫不差。臣回家以后，才在屋里等了几分钟，阿米娜就回来了。她向臣走近时，臣手里拿着那瓶水，突然挡在她面前。她一看见臣，就发出一声响亮的尖叫，转身冲向大门，可已经太迟了。

            臣把水泼到她脸上，念出那句咒语。
        - id: ch04-b09
          speaker: sidi_nouman
          text: 收下你作恶的报应吧！
        - id: ch04-b10
          speaker: sidi_nouman
          text: 阿米娜随即消失了。原地站着的，就是陛下昨天看见臣鞭打的那匹马。
    - id: ch05
      title: 哈里发的裁断
      blocks:
        - id: ch05-b01
          speaker: sidi_nouman
          text: 信士的统帅，这就是臣从头到尾的故事。如今陛下已经知道，臣为什么会那样对待自己的坐骑。臣斗胆请问，听过全部缘故以后，您还会认为臣对这个恶毒的女人罚得太重吗？
        - id: ch05-b02
          speaker: caliph
          text: |-
            西迪·努曼，你的故事确实非同寻常，你妻子的行为也没有任何辩解的余地。我不打算谴责你怎样对待她，不过，你该仔细想一想，一个人被变成牲畜，要承受多大的痛苦。依我看，这份惩罚已经足够了。

            我也不会命令你坚持要求那位年轻女巫把妻子变回人。像她这样的女子一旦开始作恶，就再也不会收手。真让她恢复人形，只怕会给你招来远比从前更加可怕的报复。
