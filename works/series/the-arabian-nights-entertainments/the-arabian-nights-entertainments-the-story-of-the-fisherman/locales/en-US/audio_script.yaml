audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    genius:
      display_name: Genius
      tts:
        delivery: fierce and commanding
        timbre: deep and rough
        pace: deliberate
        pitch: low
    fisherman:
      display_name: Fisherman
      tts:
        delivery: humble, expressive, and quick-witted
        timbre: weathered and warm
        pace: moderate
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Story of the Fisherman
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Sire, once there was a fisherman who was very old and very poor. He could barely support his wife and three children. Each day, he went fishing early in the morning, and he never cast his nets more than four times.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One morning, he set out by moonlight and came to the seashore. He took off his clothes and cast his nets. As he pulled them toward the beach, they felt so heavy that he thought he had caught a great fish. He was delighted at the thought of such a fine catch. Then he hauled the nets in and found no fish at all. There was only the carcass of an ass, and his delight turned to bitter disappointment.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The carcass had torn the nets in several places. The fisherman patiently mended every hole before he cast a second time. Once again, the nets felt so heavy that he thought they must be full of fish. But when he dragged them ashore, all he found was a large basket filled with rubbish. This second worthless catch left him angry and annoyed.
        - id: ch01-b04
          speaker: fisherman
          text: >-
            O Fortune, why do you play with a poor fisherman like me? I can hardly feed my family as it is!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            He threw away the rubbish, washed the dirt from his nets, and cast them for the third time. This time, he pulled in nothing but stones, shells, and mud. He was close to despair.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At last, he cast his nets for the fourth time. He felt something heavy and struggled to bring it in, thinking once more that it might be a fish. There was no fish. Instead, he found a yellow pot. Its weight made it seem full of something, and its lid was fastened with lead and stamped with the impression of a seal. The fisherman was overjoyed.
        - id: ch01-b07
          speaker: fisherman
          text: >-
            I can sell this pot to the founder. The money will buy me a measure of wheat.
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: >-
            He examined the pot from every side. Then he shook it to hear whether anything rattled inside, but there was no sound. Still, the seal and the tightly fastened lid made him think the pot might hold something precious. He took out his knife and, after some effort, pried the lid open. Then he turned the pot upside down. Nothing fell out, and that surprised him greatly.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Surprised, he set the pot in front of him and watched it closely. Thick smoke began pouring from its mouth, and he had to step back a pace or two. The smoke climbed to the clouds and stretched across the sea and shore until it made a heavy mist. The sight astonished the fisherman. When every bit of smoke had escaped, it drew together into one great mass. Out of it rose a genius, twice as large as the largest giant.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The fisherman wanted to run from the terrible monster, but he was trembling so badly that he could not take a single step.
        - id: ch01-b11
          speaker: genius
          text: >-
            Great king of the genii, I will never disobey you again!
        - id: ch01-b12
          speaker: narrator
          text: >-
            Hearing those words, the fisherman found his courage.
        - id: ch01-b13
          speaker: fisherman
          text: >-
            Great Genius, what are you talking about? Tell me your story. How did you come to be locked inside that pot?
        - id: ch01-b14
          speaker: narrator
          text: >-
            The genius looked down at him with contempt.
        - id: ch01-b15
          speaker: genius
          text: Speak more politely, before I kill you.
        - id: ch01-b16
          speaker: fisherman
          text: >-
            Why would you kill me? I am the one who just set you free. Have you forgotten already?
          emotion: fearful
        - id: ch01-b17
          speaker: genius
          text: >-
            I have not forgotten. I will kill you all the same. I grant you one favor. You may choose how you die.
        - id: ch01-b18
          speaker: fisherman
          text: But what have I done to you?
        - id: ch01-b19
          speaker: genius
          text: >-
            I can treat you no other way. Listen to my story, and you will understand why.
        - id: ch01-b20
          speaker: genius
          text: >-
            I rebelled against the king of the genii. As punishment, he shut me in this copper pot. He sealed the leaden lid with an enchantment that kept me from escaping, and then he had the pot thrown into the sea.
        - id: ch01-b21
          speaker: genius
          text: >-
            During my first hundred years in prison, I made a vow. If anyone freed me before those years ended, I would make that person rich, even after death. A hundred years passed, and no one came.
        - id: ch01-b22
          speaker: genius
          text: >-
            During the second hundred years, I promised every treasure in the world to the one who released me. Still, no one came.
        - id: ch01-b23
          speaker: genius
          text: >-
            During the third hundred years, I promised to make my rescuer a king. I would stay near him and grant him three wishes every day. That century passed like the others, and I remained trapped.
        - id: ch01-b24
          speaker: genius
          text: >-
            At last, after so long in captivity, my anger took hold of me. I vowed that whoever released me would die at once. I would give my rescuer only one choice: the manner of death. You freed me today, so choose how you will die.
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: >-
            The fisherman was miserable.
        - id: ch01-b26
          speaker: fisherman
          text: >-
            How unlucky I am to have set you free! Please, spare my life.
          emotion: sad
        - id: ch01-b27
          speaker: genius
          text: >-
            I told you that cannot happen. Choose quickly. You are wasting time.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The fisherman began to form a plan.
        - id: ch01-b29
          speaker: fisherman
          text: >-
            Since I must die, answer one question on your honor before I choose my death. Were you truly inside that pot?
        - id: ch01-b30
          speaker: genius
          text: Yes, I was.
        - id: ch01-b31
          speaker: fisherman
          text: >-
            I cannot believe that. The pot could not hold even one of your feet. How could your whole body fit inside? I will believe it only if I see you do it.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The genius began changing back into smoke. As before, it spread over the sea and shore. Then the smoke gathered itself and slowly flowed into the pot. It went in evenly until nothing remained outside.
        - id: ch01-b33
          speaker: genius
          text: >-
            Well, unbelieving fisherman, I am inside the pot. Do you believe me now?
        - id: ch01-b34
          speaker: narrator
          text: >-
            Instead of answering, the fisherman seized the leaden lid and quickly sealed the pot.
        - id: ch01-b35
          speaker: fisherman
          text: >-
            Now, Genius, ask me for mercy, and choose how you will die! No, I have a better plan. I will throw you back into the sea where I found you. Then I will build a house on this shore and warn every fisherman who comes here. I will tell them not to catch a wicked genius who swears to kill the very man who sets him free.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The genius struggled with all his power to escape, but the enchantment on the lid held him fast.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Then he tried cunning instead.
        - id: ch01-b38
          speaker: genius
          text: >-
            Take off the lid, and I will reward you.
        - id: ch01-b39
          speaker: fisherman
          text: >-
            No. If I trust you, I fear you will treat me as a certain Greek king treated the physician Douban. Listen, and I will tell you that story.
