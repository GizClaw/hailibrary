audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    caliph:
      display_name: 哈伦·拉希德
      tts:
        delivery: 威严果断，言谈中带着敏锐的好奇
        timbre: 洪亮圆润
        pace: 从容
        pitch: 中低音
    ali_cogia:
      display_name: 阿里·科吉亚
      tts:
        delivery: 诚恳温厚，受冤时急切却仍克制
        timbre: 清朗朴实
        pace: 平稳，申诉时稍快
        pitch: 中音
    merchant:
      display_name: 商人
      tts:
        delivery: 表面爽快，心虚时强硬狡辩
        timbre: 低沉干涩
        pace: 平稳，争辩时加快
        pitch: 中低音
    merchant_wife:
      display_name: 商人的妻子
      tts:
        delivery: 明理谨慎，劝阻时恳切坚定
        timbre: 柔和成熟
        pace: 从容
        pitch: 中音
    travelling_merchant:
      display_name: 过路商人
      tts:
        delivery: 随口评点，精明直率
        timbre: 明亮清楚
        pace: 轻快
        pitch: 中音
    child_cadi:
      display_name: 小卡迪
      tts:
        delivery: 聪敏自信，审案时一本正经
        timbre: 清亮稚嫩
        pace: 利落
        pitch: 中高音
    child_plaintiff:
      display_name: 扮演阿里·科吉亚的孩子
      tts:
        delivery: 认真投入，申诉时恭敬诚恳
        timbre: 清脆稚嫩
        pace: 平稳
        pitch: 中高音
    child_defendant:
      display_name: 扮演商人的孩子
      tts:
        delivery: 装腔狡辩，带着游戏中的认真
        timbre: 明亮稚嫩
        pace: 稍快
        pitch: 中高音
    olive_dealer_1:
      display_name: 橄榄商人甲
      tts:
        delivery: 老练肯定，说话简洁
        timbre: 厚实清楚
        pace: 平稳
        pitch: 中音
    olive_dealer_2:
      display_name: 橄榄商人乙
      tts:
        delivery: 老练肯定，说话简洁
        timbre: 温和清楚
        pace: 平稳
        pitch: 中音
    grand_vizier:
      display_name: 大维齐尔贾法尔
      tts:
        delivery: 谨慎沉着，进言时恭敬周全
        timbre: 醇厚清晰
        pace: 从容
        pitch: 中低音
    boy_mother:
      display_name: 男孩的母亲
      tts:
        delivery: 慈爱朴实，受惊时急切
        timbre: 柔和温暖
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 七年的远行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            哈里发哈伦·拉希德在位时，巴格达有个商人，名叫阿里·科吉亚。他没有妻子儿女，做生意赚得不多，却很知足。他在父亲留下的房子里安安稳稳住了几年，从没想过这种生活会忽然改变。

            有一回，他连续三个晚上做了同一个梦。每到梦里，总有一位老人出现在他面前，责备他迟迟不去麦加朝圣，没有尽到虔诚穆斯林的本分。
        - id: ch01-b02
          speaker: narrator
          text: |-
            阿里·科吉亚为这个梦烦恼极了。他舍不得店铺和那些老主顾，过去也一直躲着不想朝圣，只是多做些善事，好让自己的良心过得去。可一连三夜的警告让他再也不敢拖延。

            他卖掉家具和店里的货物，只留下沿途可以买卖的商品。店铺也卖了，自己的房子很快找到了租客。所有事情都安排妥当，只剩下一桩难题。还有一千枚金币要留在巴格达，交给谁保管才安全呢？
        - id: ch01-b03
          speaker: narrator
          text: 阿里想了许久，终于想出一个自以为稳妥的办法。他取来一只大瓮，把一千枚金币放在最底下，上面装满橄榄，再把瓮口封得严严实实。随后，他亲自把瓮送到一个朋友那里。那人也和他一样，是个商人。
        - id: ch01-b04
          speaker: ali_cogia
          text: 兄弟，再过几天，我就要随商队去麦加了。请你替我保管这瓮橄榄，等我回来再取，可以吗？
        - id: ch01-b05
          speaker: merchant
          text: 当然可以。这是我店铺的钥匙，你自己进去，喜欢放在哪里就放在哪里。等你回来，它一定还在原处。
        - id: ch01-b06
          speaker: narrator
          text: |-
            几天后，阿里骑上驮满货物的骆驼，加入商队，按时到了麦加。他和其他朝圣者一同前往圣寺朝拜。等所有宗教义务都完成了，他才把货物摆在最显眼的位置，希望往来的行人会停下脚步，成为他的客人。

            不久，两个商人停下来翻看他的货物。其中一人对同伴说起了悄悄话。
        - id: ch01-b07
          speaker: travelling_merchant
          text: 这人若是精明，就该把货带去开罗。到了那里，准能卖出比这里高得多的价钱。
        - id: ch01-b08
          speaker: narrator
          text: |-
            阿里听见了，一点时间也没耽搁。他收起货物，没有返回巴格达，反而跟着另一支商队去了开罗。这趟买卖让他满心欢喜，货物几乎立刻便销售一空。他又买下一批埃及珍玩，准备运往大马士革。商队还要六个星期才动身，他就趁空游览了金字塔和尼罗河沿岸的几座城市。

            到了大马士革，那里的风光又把这个善良的商人迷住了，他几乎舍不得离开。后来，他终于想起巴格达还有一个家，才计划经过阿勒颇，渡过幼发拉底河，再沿底格里斯河返回。
        - id: ch01-b09
          speaker: narrator
          text: 可他到了摩苏尔，又和几位波斯商人成了好友。他们邀他同去波斯故土，后来甚至一路到了印度。等阿里再回头，离开巴格达已经整整七年。而替他保管橄榄瓮的朋友，在这七年里一次也没想过他和那只瓮。直到阿里真正回来前一个月，商人才因为妻子的一句话，偶然记起这件事。
    - id: ch02
      title: 瓮底的金币
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 阿里回到巴格达前一个月，商人的妻子有一天偶然说起，自己很久没吃橄榄了，倒有些想念那种滋味。直到这时，她的丈夫才想起七年前的朋友，也想起了店里那只早被遗忘的瓮。
        - id: ch02-b02
          speaker: merchant
          text: 七年前，阿里·科吉亚去麦加，把一瓮橄榄留给我。过了这么久，他多半已经死了。既然我们想吃，就拿来尝尝吧。给我一盏灯，我去取。
        - id: ch02-b03
          speaker: merchant_wife
          text: |-
            丈夫，千万别做这样的事！七年没有消息，不等于阿里已经死了。他随时都可能回来。你若揭开封口，便是辜负他的信任，将来怎么向他交代？

            我刚才只是随口一说，你别放在心上。我现在一点也不想吃了。何况过了这么多年，那些橄榄恐怕早坏了。我总觉得阿里会回来。到那时，他会怎样看你？求你别碰那只瓮。
        - id: ch02-b04
          speaker: narrator
          text: 商人不肯听劝，还是拿着灯和盘子进了店铺。
        - id: ch02-b05
          speaker: merchant_wife
          text: 你非要这样固执，我也拦不住。可日后惹出祸来，别怪我没有劝过你。
        - id: ch02-b06
          speaker: narrator
          text: |-
            商人打开瓮，见上面的橄榄已经腐烂，便往盘里倒出一些，想看看底下的是否还好。几枚金币竟随着橄榄一起滚了出来。

            他的贪念一下子全醒了。再往瓮里一看，底下装的全是黄金。他把橄榄放回去，回到妻子身边。
        - id: ch02-b07
          speaker: merchant
          text: 你说得对，橄榄确实坏了。不过，我已经把瓮口重新封好。阿里绝不会知道有人动过它。
        - id: ch02-b08
          speaker: merchant_wife
          text: 你早听我的就好了。我只盼这件事不要招来灾祸。
        - id: ch02-b09
          speaker: narrator
          text: |-
            妻子的警告丝毫没有打动商人。他整夜都在琢磨，万一阿里回来索要瓮，怎样才能留下那些金币。天刚亮，他便买来新鲜橄榄，扔掉旧的，把金币取出藏好，再把新橄榄装进瓮里。他封好瓮口，又把瓮放回阿里亲手留下的地方。

            一个月后，阿里回到巴格达。房子还租给别人，他只好住进客店。第二天，他去见老朋友。商人张开双臂迎接，满脸惊讶，连声说没想到他还能回来。两人互相问候了一阵，阿里才请朋友交还那只替自己保管了七年的瓮。
        - id: ch02-b10
          speaker: merchant
          text: 当然可以取走。我能替你保管它，也很高兴。钥匙在这里，你去当初放瓮的地方拿吧。
        - id: ch02-b11
          speaker: narrator
          text: |-
            阿里把瓮搬回客店，打开封口，把手一直探进橄榄里，却摸不到金币。他仍相信钱一定藏在下面，便从行装中取出盘子和器皿，把橄榄全倒了出来。可他找遍每一个角落，金币还是不见踪影。他惊得半晌说不出话。

            难道那个老朋友，真的犯下了这种罪行？阿里急忙赶回商人家里。
        - id: ch02-b12
          speaker: ali_cogia
          text: |-
            朋友，我在瓮里找不到那一千枚金币了。当初我把钱放在瓮底，上面才盖了橄榄。

            也许你做生意时拿去周转了？那也没关系，我愿意借给你。请写张收据，等你方便时再还我。
        - id: ch02-b13
          speaker: merchant
          text: 阿里·科吉亚，你把橄榄瓮送来以后，我碰过它吗？
        - id: ch02-b14
          speaker: merchant
          text: |-
            钥匙是我交给你的，瓮也是你亲手放进去的。刚才你去取，它不是还在原来的地方，模样也没变吗？

            你若放过金币，钱就该还在里面。我只听你说过橄榄，别的一概不知。你信也好，不信也好，我连一根手指都没碰过那只瓮。
        - id: ch02-b15
          speaker: ali_cogia
          text: 我一向不愿与人争斗，更不想采取严厉的手段。请你再想一想，也想想自己的名声。你若逼得我只能求助法律，我会非常难过。只要你肯说出实情，一切都还来得及。
        - id: ch02-b16
          speaker: merchant
          text: |-
            你自己说，交给我的是一瓮橄榄。瓮由你亲手取走，现在却说里面还有一千枚金币，要我赔给你！从前你可曾提过一个字？我连瓮里是否真有橄榄都不知道。

            幸亏你没说里面还有珍珠和钻石。快走吧，别让人群堵在我的店门前。
        - id: ch02-b17
          speaker: narrator
          text: |-
            可过路人和附近的商人已经围了上来。他们听着两人争吵，不时想从中调解。阿里听完朋友那番话，便把事情原原本本告诉众人。大家听到最后，又问被指控的商人有什么可说。

            商人承认那只瓮确实在自己的店里存放了七年，却发誓从没碰过。瓮里究竟装着什么，他只知道阿里曾经说过的话。他还请在场的人作证，说阿里当众侮辱了他，败坏了他的名声。

            阿里抓住他的胳膊。
        - id: ch02-b18
          speaker: ali_cogia
          text: 这是你自找的。既然你要法律来评理，我们就去找卡迪！到他面前，看你还敢不敢这样说。
        - id: ch02-b19
          speaker: merchant
          text: 好，我正求之不得。很快就会知道，我们两人到底谁有道理。
    - id: ch03
      title: 没能伸张的正义
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            作为一个虔诚的穆斯林，商人不能拒绝把争端交给法官。两人一同来到卡迪面前。阿里再次讲完经过，卡迪问他有没有证人。阿里只好回答，他一直把商人当作朋友，在此以前也始终认为对方诚实可靠，所以从没想过要预先找人作证。

            商人仍旧咬定原来的说法，还愿意郑重起誓，说那一千枚金币不是他偷的，他甚至不知道瓮里有钱。卡迪听完，准许他当庭宣誓，随后便宣布商人无罪。
        - id: ch03-b02
          speaker: narrator
          text: |-
            阿里平白损失一千枚金币，心里怒不可遏。他当庭抗议这个判决，还说自己一定要亲自向哈里发哈伦·拉希德申诉。卡迪根本不理会他的警告，仍认定自己已经照规矩办事，判决也没有错。

            判决一下，商人得意地回了家。阿里则回到客店，给哈里发写了一封诉状。第二天中午祈祷以后，他守在哈里发必经的路上，把诉状高高递给走在御驾前面的官员。那人的职责，正是替哈里发收取百姓的陈情，进入王宫后再一一呈上。哈里发总会仔细阅读这些诉状。
        - id: ch03-b03
          speaker: narrator
          text: |-
            阿里熟知这个惯例，便跟着哈里发进入王宫的议事大厅，站在那里等候消息。过了一会儿，官员出来告诉他，哈里发已经读过诉状，定在第二天早晨召见他。官员还仔细问清了商人的住址，好派人传他一同到场。

            当天晚上，哈里发与大维齐尔贾法尔、宦官长麦斯鲁尔照例乔装改扮，到城中散步。
        - id: ch03-b04
          speaker: narrator
          text: |-
            三个人走过一条街时，哈里发听见一阵喧闹。他从一扇通往庭院的门向里望去，只见十来个孩子正在月光下玩耍。哈里发很快藏进一个阴暗的角落，静静看着他们。

            那群孩子里，最聪明伶俐的一个忽然开了口。
        - id: ch03-b05
          speaker: child_cadi
          text: 我们来玩卡迪审案吧！我当卡迪。把阿里·科吉亚，还有那个偷走他一千枚金币的商人，都带到我面前来。
        - id: ch03-b06
          speaker: narrator
          text: |-
            这句话让哈里发想起早晨读过的诉状。他很想知道孩子们会怎样判案，便继续看下去。

            其他孩子早听大人议论过此事，一听这个提议，全都高兴地答应。他们很快分好角色。小卡迪庄严地坐下，扮作官差的孩子先带进原告阿里，再带进被告商人。每个人都认真得仿佛这真是一座法庭。
        - id: ch03-b07
          speaker: child_plaintiff
          text: 大人，我把一瓮橄榄交给朋友保管，七年后回来，瓮还在原处，藏在瓮底的一千枚金币却不见了。我请他归还，他坚称自己从没碰过。求您替我主持公道，别让我蒙受这么大的损失。
        - id: ch03-b08
          speaker: child_cadi
          text: 商人，你为什么不把阿里·科吉亚的钱还给他？
        - id: ch03-b09
          speaker: child_defendant
          text: 他只交给我一瓮橄榄，根本没提过金币。瓮也是他亲手放下，又亲手取走的。我愿意发誓，我说的句句是真话。
        - id: ch03-b10
          speaker: child_cadi
          text: 等一等！先别忙着发誓，我要查看那只橄榄瓮。阿里·科吉亚，你把瓮带来了吗？没有？那就快去取来。
        - id: ch03-b11
          speaker: narrator
          text: |-
            扮演阿里的孩子退到一旁，很快又回来，假装把一只瓮放到卡迪脚下，说这就是交给被告保管的那只。小卡迪为了不漏掉审案的程序，先问被告是否认得它。对方沉默着，算是承认了。接着，阿里装作揭开盖子，小卡迪也探头向并不存在的瓮里看去。

            他装作拿出一颗橄榄，放进嘴里尝了尝。
        - id: ch03-b12
          speaker: child_cadi
          text: 这些橄榄真漂亮，味道也好极了！可是，放了七年的橄榄，怎么还会这么鲜美？去请几个卖橄榄的商人来，听听他们怎么说。
        - id: ch03-b13
          speaker: narrator
          text: 两个孩子扮成橄榄商人，被带到小卡迪面前。
        - id: ch03-b14
          speaker: child_cadi
          text: 告诉我，橄榄最多能存放多久，吃起来还会有好滋味？
        - id: ch03-b15
          speakers: [olive_dealer_1, olive_dealer_2]
          ensemble: duo
          text: 大人，无论保存得多么用心，橄榄也放不过三年。三年后，它们既没颜色，也没滋味，只能扔掉。
        - id: ch03-b16
          speaker: child_cadi
          text: 那就看看这只瓮，尝尝里面的橄榄，再告诉我，它们已经存放多久了。
        - id: ch03-b17
          speakers: [olive_dealer_1, olive_dealer_2]
          ensemble: duo
          text: 这些橄榄又新鲜，味道又好，是今年才装进瓮里的。
        - id: ch03-b18
          speaker: child_cadi
          text: 你们弄错了。阿里·科吉亚明明说，自己七年前就把它们装进瓮里了。
        - id: ch03-b19
          speakers: [olive_dealer_1, olive_dealer_2]
          ensemble: duo
          text: 大人，我们敢保证，这就是今年的新橄榄。您问遍巴格达所有同行，也不会有人说出不同的话。
        - id: ch03-b20
          speaker: narrator
          text: 扮演被告的孩子张嘴想要反驳，小卡迪却不给他机会。
        - id: ch03-b21
          speaker: child_cadi
          text: 住口！你就是个贼。把他带走，绞死！
        - id: ch03-b22
          speaker: narrator
          text: 孩子们拍手欢呼，大家都为小卡迪的判决喝彩，又一同押着“罪犯”去受绞刑。这场游戏到这里才算结束。藏在暗处的哈里发，却仍在回想刚才的每一步审问。
    - id: ch04
      title: 月光下的小卡迪
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            哈里发被那孩子的智慧惊得久久说不出话。自己明天才要审的案子，这个男孩竟已找出关键证据，作出如此明智的裁断。大维齐尔也深受触动，和哈里发一样佩服这个孩子。

            哈里发问他，难道还会有比这更好的判法吗？
        - id: ch04-b02
          speaker: grand_vizier
          text: 若事情确如我们听到的这样，陛下无论怎样推理，又怎样定案，恐怕都只能效法这个孩子。
        - id: ch04-b03
          speaker: caliph
          text: |-
            记住这所房子，明天把孩子带来。我要让他当着我的面审理此案。再把那位卡迪召来，让他听听一个孩子怎样教他履行职责。

            叫阿里·科吉亚带上橄榄瓮，也安排两个橄榄商人到场。
        - id: ch04-b04
          speaker: narrator
          text: |-
            说完，哈里发返回王宫。第二天清早，大维齐尔来到那所房子，请女主人和孩子们出来。三个男孩站到他面前。他问昨晚是谁扮演卡迪。年纪最大、个子最高的男孩听见这句话，顿时变了脸色，却还是老实承认了。

            大维齐尔说，自己奉命带他去见哈里发。男孩的母亲听了，吓得不得了。
        - id: ch04-b05
          speaker: boy_mother
          text: 难道哈里发要把我的儿子从我身边夺走吗？
          emotion: fearful
        - id: ch04-b06
          speaker: grand_vizier
          text: 请放心，一个时辰之内，我一定把孩子送回来。等您知道哈里发为何召见他，准会感到满意。
          emotion: calm
        - id: ch04-b07
          speaker: narrator
          text: |-
            母亲听了保证，这才稍稍放下心，替男孩换上最好的衣服，让他跟着大维齐尔离开。

            孩子来到哈里发面前，既敬畏又慌乱。哈里发和颜悦色地向他解释了传召的原因。
        - id: ch04-b08
          speaker: caliph
          text: 走近些，我的孩子。昨晚审理阿里·科吉亚和商人那桩案子的，就是你吧？我偶然听见了，很欣赏你审案的办法。今天，真正的阿里和商人都会到场。来，坐到我身边。
    - id: ch05
      title: 真正的审判
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 哈里发坐上御座，让孩子坐在身旁。真正的阿里和商人被领进大殿，依次伏倒在地，以额头触碰御座脚下的地毯。两人站起以后，哈里发当众吩咐他们开口陈述。
        - id: ch05-b02
          speaker: caliph
          text: 现在把事情说清楚。这个孩子会给你们公正的裁断。若还有什么不足，我自会处置。
        - id: ch05-b03
          speaker: narrator
          text: |-
            阿里与商人先后申诉。两个人讲的，正是孩子昨晚听来的那桩争端。商人又想发先前在卡迪面前发过的誓，孩子却立刻拦住了他，坚持在宣誓以前先看那只橄榄瓮。

            阿里把瓮呈到哈里发面前，当场揭开封口。哈里发亲手取出一颗橄榄尝了尝，又命两位行家也各自品尝。他们看过颜色，尝过滋味，都说这些橄榄保存得很好，是当年新产的。
        - id: ch05-b04
          speaker: child_cadi
          text: 可阿里·科吉亚说，这些橄榄是他七年前装进瓮里的。你们确定没有看错吗？
        - id: ch05-b05
          speakers: [olive_dealer_1, olive_dealer_2]
          ensemble: duo
          text: 我们确定。这些是今年的新橄榄，绝不可能在瓮里放过七年。
        - id: ch05-b06
          speaker: narrator
          text: |-
            两位行家的回答，和前一晚扮演他们的孩子完全一样。被告商人这才明白，自己的罪行已经暴露，一定会被定罪，连忙张口想替自己辩护。孩子却很有分寸，没有像游戏里那样擅自下令绞死他，只转头望向哈里发。
        - id: ch05-b07
          speaker: child_cadi
          text: 信士的统帅，现在可不是游戏。判他死刑，应当由陛下决定，不该由我来做。
        - id: ch05-b08
          speaker: narrator
          text: |-
            所有证据都摆在眼前，哈里发确信商人就是窃贼，下令将他带走绞死。直到行刑以前，商人才终于承认自己偷走了一千枚金币，也说出从瓮里取走钱以后，究竟把阿里的财物藏在什么地方。那笔钱终于有了下落。

            随后，哈里发命那位卡迪好好听着，从一个孩子口中学习究竟该怎样审案，怎样伸张正义。他又赏给男孩一只钱袋，里面装着一百枚金币，以此表示自己的恩宠，这才让人把孩子送回家。
