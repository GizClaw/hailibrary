  chapters:
    - id: ch01
      title: The Pilgrimage and the Long Journey
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            During the reign of Haroun-al-Raschid, a merchant named Ali Cogia lived in Bagdad. He had no wife or children, and the small profits from his trade were enough for him. For years he lived happily in the house his father had left him. Then, on three nights in a row, an old man appeared in his dreams. Each time, the old man reproached him for waiting so long to make the pilgrimage to Mecca, as every good Mussulman should.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The dream troubled Ali Cogia. He hated the thought of closing his shop and losing his customers. For a long time he had avoided the pilgrimage and tried to quiet his conscience by doing extra good works. But this repeated dream felt like a direct warning. He decided he would delay no longer.
        - id: ch01-b03
          speaker: narrator
          text: >-
            First he sold his furniture and the goods in his shop, keeping only a few things to trade along the road. He sold the shop too and found a tenant for his house. One problem remained. He had a thousand gold pieces, and he could not decide where to leave them safely.
        - id: ch01-b04
          speaker: narrator
          text: >-
            At last he thought of a plan. He put the gold at the bottom of a large vase, covered it with olives, and sealed the vase tightly. Then he carried it to a friend who was also a merchant.
        - id: ch01-b05
          speaker: ali_cogia
          text: >-
            My brother, you may have heard that I am leaving with a caravan for Mecca in a few days. Would you keep this vase of olives safe until I return?
        - id: ch01-b06
          speaker: merchant
          text: >-
            Of course. Here is the key to my shop. Put the vase wherever you wish, and when you return, you will find it exactly where you left it.
        - id: ch01-b07
          speaker: narrator
          text: >-
            A few days later, Ali Cogia loaded his merchandise onto a camel and joined the caravan. In time he reached Mecca. He visited the sacred Mosque and completed all his religious duties with the other pilgrims. Then he arranged his goods where passing customers could see them.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Before long, two merchants stopped to examine his wares. After turning the goods over, one spoke to the other.
        - id: ch01-b09
          speaker: mecca_merchant_1
          text: >-
            If this fellow has any sense, he will carry these goods to Cairo. He can get a far better price there than he ever will here.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Ali Cogia heard the advice and wasted no time. Instead of returning to Bagdad, he packed his wares and joined a caravan bound for Cairo. The result delighted him. Almost as soon as he arrived, he sold everything at a fine price. With the money, he bought a stock of Egyptian curiosities that he meant to sell in Damascus. The caravan he needed would not leave for another six weeks, so he used the delay to visit the Pyramids and several cities along the banks of the Nile.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Damascus charmed him so much that he could hardly make himself leave. At last he remembered his home in Bagdad. He planned to return through Aleppo, cross the Euphrates, and follow the Tigris home.
        - id: ch01-b12
          speaker: narrator
          text: >-
            But when he reached Mossoul, Ali Cogia became friendly with several Persian merchants. They urged him to accompany them to their own country. From there, they persuaded him to travel even farther, all the way to India. One journey had led to another, and by the time Ali Cogia finally turned homeward, seven full years had slipped by since he left Bagdad.
    - id: ch02
      title: The Gold Beneath the Olives
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Through all those years, the friend guarding the vase had never thought about Ali Cogia or his olives. Then, only a month before Ali Cogia returned, the merchant's wife remarked that she had not eaten olives in a long while and would like some.
        - id: ch02-b02
          speaker: merchant
          text: >-
            That reminds me. Before Ali Cogia left for Mecca seven years ago, he put a vase of olives in my care. He must be dead by now, so why shouldn't we eat them? Give me a light. I will bring them up and see if they are still good.
        - id: ch02-b03
          speaker: merchant_wife
          text: >-
            My husband, please do not do anything so shameful. Seven years without news does not mean Ali Cogia is dead. He may return any day. How could you admit that you broke the seal and betrayed his trust? Forget what I said. I no longer want the olives, and after so much time they are probably spoiled anyway. I feel that Ali Cogia will return. What will he think of you then? Please leave the vase alone.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Her warning was sensible, but the merchant refused to listen. He took a light and a dish and went into his shop.
        - id: ch02-b05
          speaker: merchant_wife
          text: >-
            If you insist on being so stubborn, I cannot stop you. But if this ends badly, do not say I failed to warn you.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The olives at the top of the vase were rotten. The merchant shook some into the dish to see whether those underneath were any better. A few gold pieces fell out with them.
        - id: ch02-b07
          speaker: narrator
          text: >-
            At the sight of the money, greed took hold of him. He peered inside and saw gold covering the whole bottom of the vase. Then he put the olives back and returned to his wife.
        - id: ch02-b08
          speaker: merchant
          text: >-
            You were right. The olives have spoiled. I sealed the vase again so carefully that Ali Cogia will never know it was opened.
        - id: ch02-b09
          speaker: merchant_wife
          text: >-
            You should have listened to me before you touched it. I can only hope no harm comes from this.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Her words still had no effect. The merchant spent the entire night turning one thought over in his mind. How could he keep the gold if Ali Cogia came home and asked for the vase? Very early the next morning, he went out and bought fresh olives. He threw away every one of the old olives, took all the gold from the bottom, and hid it. Then he filled the vase with the olives he had just bought, sealed it again, and returned it to the exact place where Ali Cogia had left it.
    - id: ch03
      title: Ali Cogia Seeks Justice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            One month later, Ali Cogia came back to Bagdad. His house was still rented, so he took a room at an inn. The next day he visited his old friend, who welcomed him warmly and seemed amazed to see him. After they had exchanged news, Ali Cogia asked for the vase that had been kept so long.
        - id: ch03-b02
          speaker: merchant
          text: >-
            Certainly. I was glad to help you. Here is my shop key. You will find the vase right where you put it.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Ali Cogia carried the vase back to the inn and opened it. He pushed his hand down through the olives but felt no money. Still sure the gold must be there, he took out plates and bowls from his traveling things and emptied the vase. It was no use. The gold was gone. For a moment he could not speak. Then he lifted his hands in horror.
        - id: ch03-b04
          speaker: ali_cogia
          text: >-
            Could my old friend truly have done such a thing?
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: >-
            He hurried back to the merchant's house.
        - id: ch03-b06
          speaker: ali_cogia
          text: >-
            My friend, you may be surprised to see me again so soon. I put a thousand gold pieces at the bottom of that vase beneath the olives, and now I cannot find them. Perhaps you borrowed the money for your business. If you did, you were welcome to use it. Just give me a receipt, and you may repay me whenever you can.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The merchant had expected this and had his answer ready.
        - id: ch03-b08
          speaker: merchant
          text: >-
            Ali Cogia, did I touch your vase when you brought it here? I gave you my shop key, and you chose where to put it. You found it in the same place and in the same condition. If you hid gold inside, it should still be there. You told me only about olives. Believe me or not, I never laid a finger on that vase.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Ali Cogia tried again to make him admit the truth.
        - id: ch03-b10
          speaker: ali_cogia
          text: >-
            I want peace, and I would deeply regret taking harsher steps. Think once more about your good name. If you force me to call on the law, I shall be heartsick over it.
        - id: ch03-b11
          speaker: merchant
          text: >-
            You admit that you left a vase of olives with me. You carried it away yourself, and now you claim it held a thousand gold pieces that I must return. Did you ever mention that money before? I did not even know whether the vase truly held olives because you never showed them to me. Why not accuse me of taking pearls and diamonds too? Please go before a crowd gathers outside my shop.
        - id: ch03-b12
          speaker: narrator
          text: >-
            A crowd had already gathered. Passersby had stopped, and merchants from the neighboring shops stood around listening. Now and then, someone tried to settle the quarrel between the two old friends. But after the merchant's last answer, Ali Cogia decided everyone should know the cause of their dispute. He told the whole story from the beginning. The listeners waited until he had finished, then asked the merchant what he had to say for himself.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The merchant admitted that the vase had stayed in his shop. But he denied touching it and swore that he knew only what Ali Cogia had told him about its contents. He called on everyone there to witness how badly he had been insulted.
        - id: ch03-b14
          speaker: ali_cogia
          text: >-
            You brought this upon yourself. Since you appeal to the law, the law will judge us. Let us see whether you dare tell the same story before the Cadi.
        - id: ch03-b15
          speaker: narrator
          text: >-
            As a good Mussulman, the merchant could not refuse that choice of judge.
        - id: ch03-b16
          speaker: merchant
          text: >-
            Very well. Nothing would suit me better. We will soon learn which of us is right.
        - id: ch03-b17
          speaker: narrator
          text: >-
            The two men went before the Cadi, and Ali Cogia told his story once again. The Cadi asked what witnesses could prove his claim. Ali Cogia had none. He explained that he had never thought such a precaution was needed. The merchant had been his friend, and until that day, Ali Cogia had always known him as an honest man.
        - id: ch03-b18
          speaker: narrator
          text: >-
            The merchant held firmly to his denial. He offered to swear a solemn oath on two points. He had never stolen the thousand pieces of gold, he said, and he had never even known they were hidden in the vase. With no witness to contradict him, the Cadi allowed him to take the oath. Then the judge pronounced the merchant innocent and dismissed the charge.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Furious at losing his money, Ali Cogia protested. He declared that he would appeal to the Caliph himself. The Cadi ignored the threat, certain that his judgment was right.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Once judgment was given, the merchant went home in triumph. Ali Cogia returned to the inn and carefully wrote a petition to Haroun-al-Raschid. The next morning, he took his place on the road where the Caliph always passed after midday prayer. An officer walked before the ruler, collecting petitions from the people and carrying them into the palace. Ali Cogia stretched out his own petition, and the officer received it. Inside, the Caliph studied every request with care.
        - id: ch03-b21
          speaker: narrator
          text: >-
            Ali Cogia knew this custom, so he followed the Caliph into the public hall and waited. At last the officer came to him.
        - id: ch03-b22
          speaker: palace_officer
          text: >-
            The Caliph has read your petition. He will hear you tomorrow morning at the appointed hour. Now give me the merchant's address so that he may be summoned too.
    - id: ch04
      title: The Children Judge the Case
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            That very evening, the Caliph went walking through the town in disguise, as he often did. Giafar, his grand-vizir, and Mesrour, chief of the eunuchs, were disguised and walking with him. As the three men passed down one street, a noise caught the Caliph's attention. He looked through an open doorway into a courtyard. There, ten or twelve children were playing in the moonlight. The Caliph slipped into a dark corner where they could not see him, and he quietly watched their game.
        - id: ch04-b02
          speaker: boy_cadi
          text: >-
            Let us play Cadi. I will be the judge. Bring me Ali Cogia and the merchant who stole his thousand gold pieces.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The words at once reminded the Caliph of the petition he had read that morning, and he waited with great interest to see what the children would do. The others greeted the idea with delight. They had heard the grown-ups talking about the case, so they knew the story and quickly chose their parts. The young Cadi took his seat with a grave face. A child acting as an officer brought in the boy playing Ali Cogia first, then the boy playing the accused merchant.
        - id: ch04-b04
          speaker: boy_ali
          text: >-
            My lord, I left a vase of olives in this merchant's care. A thousand gold pieces lay hidden beneath them. When I returned after seven years, the vase was there, but my gold was gone. Please do not make me bear so great a loss.
        - id: ch04-b05
          speaker: boy_cadi
          text: >-
            Why have you not returned the thousand gold pieces that belong to Ali Cogia?
        - id: ch04-b06
          speaker: boy_merchant
          text: >-
            He left only a vase of olives in my shop. He chose where to put it, and he took it away himself. I never touched it and knew nothing about any gold. I am ready to swear that every word I have said is true.
        - id: ch04-b07
          speaker: boy_cadi
          text: >-
            Wait. Before anyone swears an oath, I want to inspect the vase of olives. Ali Cogia, did you bring it with you?
        - id: ch04-b08
          speaker: narrator
          text: >-
            The boy playing Ali Cogia had not brought it, so the young Cadi sent him to fetch it. He disappeared for a moment. When he returned, he pretended to set a heavy vase at the judge's feet and declared that it was the very vase he had given the accused for safekeeping. To make every detail proper, the Cadi asked the merchant whether he recognized it as the same vase. The boy playing the merchant said nothing, and by his silence admitted that he did.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The Cadi ordered the vase opened. One boy acted as though he were lifting the lid, while the young judge leaned forward and peered into a vase that was not really there.
        - id: ch04-b10
          speaker: boy_cadi
          text: >-
            These olives look wonderful. I would like to taste one. Yes, they are excellent! But how can olives that are seven years old still taste so good? Bring in some olive dealers. We will ask them.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Two more children stepped forward as olive merchants.
        - id: ch04-b12
          speaker: boy_cadi
          text: >-
            Tell me, how long can olives be kept and still be good to eat?
        - id: ch04-b13
          speakers: [boy_olive_dealer_1, boy_olive_dealer_2]
          ensemble: duo
          text: >-
            My lord, no matter how carefully olives are stored, they never last beyond the third year. By then they have lost their taste and color and must be thrown away.
        - id: ch04-b14
          speaker: boy_cadi
          text: >-
            Then examine these olives and tell me how long they have been in the vase.
        - id: ch04-b15
          speaker: narrator
          text: >-
            The two children pretended to inspect and taste the olives. Then they gave their answer.
        - id: ch04-b16
          speakers: [boy_olive_dealer_1, boy_olive_dealer_2]
          ensemble: duo
          text: >-
            They are fresh, my lord, and very good.
        - id: ch04-b17
          speaker: boy_cadi
          text: >-
            You must be mistaken. Ali Cogia says he put them in this vase seven years ago.
        - id: ch04-b18
          speakers: [boy_olive_dealer_1, boy_olive_dealer_2]
          ensemble: duo
          text: >-
            We assure you, my lord, these olives were grown this very year. Ask every olive merchant in Bagdad, and none will tell you otherwise.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The accused merchant opened his mouth to object, but the young Cadi cut him off.
        - id: ch04-b20
          speaker: boy_cadi
          text: >-
            Be quiet. You are a thief. Take him away and hang him.
        - id: ch04-b21
          speaker: narrator
          text: >-
            That ended the game. The children clapped and led the pretend criminal away to be hanged.
    - id: ch05
      title: The Caliph Sends for the Boy
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Haroun-al-Raschid stood astonished by the child's wisdom. In a game, the boy had found a sound way to judge the very case that the Caliph himself was due to hear the next morning. The fresh olives had exposed what an oath alone could never prove. Giafar was every bit as impressed as his master, and both men understood the force of the child's reasoning.
        - id: ch05-b02
          speaker: caliph
          text: >-
            Could there be any other verdict? I cannot imagine a better judgment.
        - id: ch05-b03
          speaker: giafar
          text: >-
            If the facts are truly as we heard them, your Highness could do no better than follow this boy's reasoning and reach the same conclusion.
        - id: ch05-b04
          speaker: caliph
          text: >-
            Then remember this house carefully. Bring the boy to me tomorrow, and let him try the case in my presence. Summon the Cadi as well, so he may learn his duty from a child. Tell Ali Cogia to bring the vase, and make sure two olive dealers attend.
        - id: ch05-b05
          speaker: narrator
          text: >-
            With those orders given, the Caliph returned to the palace.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Early the next morning, Giafar went back to the house where the children had played. He asked to see the mistress of the house and her children. Three boys came forward. Giafar asked which of them had played the Cadi the night before. The eldest and tallest changed color. He confessed that it was he. His mother became deeply alarmed when Giafar told her that he had strict orders to bring the child into the presence of the Caliph.
        - id: ch05-b07
          speaker: mother
          text: >-
            Does the Caliph mean to take my son away from me?
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: >-
            Giafar quickly reassured her. He promised that the boy would be home again within an hour, and that she would be pleased when she learned why he had been summoned. The mother dressed her son in his best clothes, and he left with Giafar.
        - id: ch05-b09
          speaker: narrator
          text: >-
            When Giafar presented him at the palace, the child felt shy and confused in the Caliph's presence. Haroun-al-Raschid kindly explained why he had sent for him.
        - id: ch05-b10
          speaker: caliph
          text: >-
            Come closer, my son. You were the one who judged the quarrel between Ali Cogia and the merchant last night, were you not? I happened to overhear you, and I was very pleased by the way you handled it. Today you will meet the real men. Come sit beside me.
    - id: ch06
      title: The True Judgment
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The Caliph took his place on the throne and seated the boy beside him. Then Ali Cogia and the accused merchant were brought into the hall. One after another, the two men prostrated themselves before the ruler. Each touched his forehead to the carpet at the foot of the throne. When both had risen and stood ready to present their dispute, the Caliph addressed them.
        - id: ch06-b02
          speaker: caliph
          text: >-
            Speak now. This child will judge between you. If anything more is needed, I will see to it myself.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Ali Cogia spoke first and presented his case. The merchant answered him with the same denial as before. Then he offered to swear the very oath he had taken in the Cadi's court. The boy stopped him before he could begin. No oath should be heard yet, he said. First, he must see and examine the vase of olives.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Ali Cogia brought the vase forward, presented it to the Caliph, and removed the lid. The Caliph took out one olive and tasted it. Then he ordered the two expert olive dealers to taste the fruit for themselves. Both men examined the olives and declared that they were good, fresh, and grown that very year. The boy told them that Ali Cogia said he had placed those olives in the vase seven years before. The experts did not change their answer.
        - id: ch06-b05
          speakers: [olive_dealer_1, olive_dealer_2]
          ensemble: duo
          text: >-
            These olives cannot be seven years old. They are fresh from this year.
        - id: ch06-b06
          speaker: narrator
          text: >-
            By then, the accused merchant knew he was certain to be condemned. He tried to offer some defense. The boy had enough good sense not to repeat the ending of the game. Instead, he looked toward the Caliph.
        - id: ch06-b07
          speaker: boy_cadi
          text: >-
            Commander of the Faithful, this is no game now. It is for your Highness, not me, to condemn this man to death.
        - id: ch06-b08
          speaker: narrator
          text: >-
            The Caliph had no doubt now that the merchant was a thief. He gave the order for the man to be taken away and hanged. But before the sentence was carried out, the merchant confessed everything. He admitted his guilt and told them where he had hidden Ali Cogia's thousand gold pieces.
        - id: ch06-b09
          speaker: narrator
          text: >-
            The Caliph commanded the Cadi to learn from a child's own mouth how justice should be given. Then he sent the boy home with a purse holding one hundred gold pieces, a reward for the Caliph's favor.
