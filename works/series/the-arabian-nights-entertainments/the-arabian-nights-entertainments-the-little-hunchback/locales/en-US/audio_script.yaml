  chapters:
    - id: ch01
      title: The Tailor's Guest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, in the kingdom of Kashgar on the borders of Great Tartary, a tailor lived happily with his wife. One day, as he worked in his shop, a little hunchback sat down in the doorway. The fellow sang and played his tambourine, and his lively performance amused the tailor so much that he invited him home to entertain his wife. The hunchback agreed, the tailor closed his shop, and off they went together.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Supper was waiting when they arrived. Soon all three sat around a fine fish that the tailor's wife had cooked herself. Then disaster struck. The hunchback swallowed a large bone, and it stuck in his throat. The tailor and his wife did everything they could to help him. Nothing worked. He choked and died almost at once.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The couple felt terribly sorry for the poor man, but they were frightened for themselves as well. If the police heard what had happened, they might accuse them of killing him on purpose and throw them into prison. To save themselves, they tried to invent a plan that would make someone else seem responsible. At last they decided to place the blame on a young doctor who lived nearby.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The tailor lifted the dead man by the head, his wife took the feet, and together they carried him to the doctor's house. The front door opened directly onto a steep staircase. They knocked, and a servant came feeling her way down through the darkness.
        - id: ch01-b05
          speaker: tailor
          text: >-
            Please tell your master we've brought him a very sick man to cure. Here, take this money to him now, so he knows he'll be paid for his trouble.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The servant went upstairs with the message and the fee. The instant she disappeared, the tailor and his wife hurried the body up after her. They propped it at the top of the stairs, then raced home as fast as they could.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The doctor was young and had very few patients, so the news delighted him.
        - id: ch01-b08
          speaker: doctor
          text: >-
            Bring a light and come after me, quickly!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: >-
            He rushed from his room toward the staircase before the servant could return with a lamp. In the dark, he nearly tripped over the hunchback. Without knowing what lay in his path, he kicked the body so hard that it rolled all the way to the bottom. The doctor almost tumbled down after it.
        - id: ch01-b10
          speaker: doctor
          text: >-
            A light! Hurry, bring me a light!
        - id: ch01-b11
          speaker: narrator
          text: >-
            When the servant arrived with the lamp, the doctor saw the body below and nearly lost his senses from terror.
        - id: ch01-b12
          speaker: doctor
          text: >-
            Holy Moses! Why didn't I wait for the light? I've killed the sick man they brought me. Unless the sacred Ass of Esdras comes to my aid, I'm lost. They'll soon drag me off to jail as a murderer!
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: >-
            Even in his panic, the doctor remembered to close the front door before anyone passing by could see. Then he carried the corpse into his wife's room and frightened her nearly out of her wits.
        - id: ch01-b14
          speaker: doctors_wife
          text: >-
            We're ruined unless we get this body out of the house! Once the sun comes up, we won't be able to hide it. How could you have done such a terrible thing?
          emotion: fearful
        - id: ch01-b15
          speaker: doctor
          text: >-
            That doesn't matter now. We have to find a way out of this.
        - id: ch01-b16
          speaker: narrator
          text: >-
            For a long time, the doctor and his wife tried to think of an escape, but every plan seemed useless. At last he gave up and prepared himself to suffer for his misfortune. His wife, however, was twice as clever. Suddenly an idea came to her.
        - id: ch01-b17
          speaker: doctors_wife
          text: >-
            I've got it! We'll carry the body onto our roof and lower it down our neighbor's chimney.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Their neighbor was a Muslim purveyor who worked for the Sultan and supplied the royal table with oil and butter. A large storeroom filled part of his house, and rats and mice feasted there freely among the goods. The doctor eagerly accepted his wife's plan. Together they carried the hunchback onto the roof, passed ropes beneath his arms, and lowered him through the chimney into the purveyor's bedroom. They moved so gently that the body came to rest as if the man were standing and leaning against the wall. Once they felt his feet touch the floor, they pulled the ropes back up and left him there.
    - id: ch02
      title: The Purveyor and the Merchant
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The doctor and his wife had barely returned home when the purveyor entered his room. He had spent the evening at a wedding feast and carried a lantern. Its dim glow showed him a man standing in the chimney. The purveyor was a courageous fellow. Certain that he had caught a thief, he snatched up a stick and charged at him.
        - id: ch02-b02
          speaker: purveyor
          text: >-
            Ah, so you're the one stealing my butter! I blamed the rats and mice, but it was you all along. I'll make sure you never come back!
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            He struck the hunchback several hard blows, and the body fell to the floor. The purveyor only hit it harder. At last it seemed strange that this thief should lie so still and never fight back. He lowered his stick, bent down, and examined the man. The hunchback was quite dead. In an instant, all the purveyor's courage deserted him, and cold fear took its place.
        - id: ch02-b04
          speaker: purveyor
          text: >-
            Miserable man that I am! I've killed someone. My revenge went much too far. Without Allah's help, I'm finished. Curse the goods that have brought me to ruin!
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: >-
            He could already imagine the hangman's rope around his neck. Once the first shock passed, he began searching for some way out of his trouble. He lifted the hunchback in his arms and carried him out into the empty street. There he leaned the body upright against the wall of a shop. Then he stole back to his own house without looking behind him even once.
        - id: ch02-b06
          speaker: narrator
          text: >-
            A few minutes before sunrise, a wealthy Christian merchant left his house to visit the bath. He supplied the palace with many necessities and had spent the night feasting. Though very drunk, he knew dawn was near and good Muslims would soon be walking to prayer. If anyone on the way to the mosque saw his condition, the merchant might be jailed for drunkenness. So he hurried along.
        - id: ch02-b07
          speaker: narrator
          text: >-
            In his haste, he collided with the hunchback, and the body fell heavily against him. The drunken merchant thought a thief had leaped upon him. With one blow of his fist, he knocked the hunchback to the ground. Then he shouted loudly for help, and while he waited for someone to come, he went on beating the fallen man.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The chief policeman of that quarter came running. He found a Christian striking a Muslim and demanded an answer.
        - id: ch02-b09
          speaker: chief
          text: >-
            What do you think you're doing?
          emotion: angry
        - id: ch02-b10
          speaker: merchant
          text: >-
            He tried to rob me! He nearly choked me!
        - id: ch02-b11
          speaker: chief
          text: >-
            You've taken enough revenge. Come now, get away from him.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The policeman seized the merchant's arm, then offered a hand to help the hunchback up. But the hunchback did not move. The policeman looked more closely.
        - id: ch02-b13
          speaker: chief
          text: >-
            Oh, I see. So this is how a Christian dares to treat a Muslim!
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: >-
            He gripped the merchant firmly and took him before the inspector of police. The merchant was thrown into prison until the judge rose from bed and could hear the case. By then, the shock had sobered him completely. He turned the encounter over and over in his mind. Yet the more he considered what had happened, the less he understood how the hunchback could have died merely from the blows he had given him.
        - id: ch02-b15
          speaker: narrator
          text: >-
            While the merchant was still puzzling over it, the chief of police summoned him and questioned him about the crime. The merchant could not deny striking the man. Because the dead hunchback was one of the Sultan's private jesters, the chief would not pronounce a death sentence before consulting his master. He went to the palace, asked for an audience, and told the Sultan the whole story.
        - id: ch02-b16
          speaker: sultan
          text: >-
            A Christian who kills a Muslim will not be pardoned. Do your duty.
        - id: ch02-b17
          speaker: narrator
          text: >-
            The chief ordered a gallows built. Criers went through every street announcing that a Christian would be hanged that day for killing a Muslim.
    - id: ch03
      title: Three Confessions
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When everything was ready, the merchant was brought from prison to the foot of the gallows. The executioner tied the rope firmly around his neck and was about to lift him into the air. Just then, the Sultan's purveyor burst through the crowd and called to the hangman between gasping breaths.
        - id: ch03-b02
          speaker: purveyor
          text: >-
            Stop! Don't be so quick. That man didn't commit the murder. I did!
        - id: ch03-b03
          speaker: narrator
          text: >-
            The chief of police was there to make sure all went properly. He questioned the purveyor closely. The man told the whole story, from finding the hunchback standing in his room and mistaking him for a thief, to striking him down and believing he had killed him. He also confessed that he had carried the body outside and left it at the shop where the Christian merchant later found it.
        - id: ch03-b04
          speaker: purveyor
          text: >-
            You're about to kill an innocent man. He could not have murdered someone who was dead before he found him. It is bad enough that I killed a Muslim. I won't also carry the guilt of letting an innocent Christian die for what I did.
        - id: ch03-b05
          speaker: narrator
          text: >-
            He spoke loudly enough for the whole crowd to hear. Even if the chief had wanted to ignore him, he could no longer avoid releasing the merchant.
        - id: ch03-b06
          speaker: chief
          text: >-
            Take the rope from the Christian's neck. This man has confessed to the murder, so hang him instead.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The executioner obeyed. He removed the rope from the merchant, set him free, and began tying it firmly around the purveyor. Before he could finish, the doctor's voice rose above the crowd, begging him to wait because he had something important to say. The doctor fought his way through the tightly packed people until he reached the chief of police.
        - id: ch03-b08
          speaker: doctor
          text: >-
            Honored sir, this purveyor does not deserve to die. I alone am guilty. Last night, a man and woman I had never seen came to my door with a patient. My servant could barely see them in the dark, but she agreed to wake me and carried me their fee. While she delivered the message, they must have brought the sick man to the top of my stairs and left him.
        - id: ch03-b09
          speaker: doctor
          text: >-
            I jumped up and rushed down without waiting for a lantern. In the darkness I struck something, and it tumbled headfirst down the stairs. At the bottom, I discovered a dead Muslim hunchback. My wife and I were terrified. We carried him to the roof and lowered him through our neighbor's chimney.
        - id: ch03-b10
          speaker: doctor
          text: >-
            The purveyor naturally mistook him for a thief. He struck the man down, then thought his own blow had killed him. But that cannot be true. The hunchback was already dead, and I am the murderer. I never meant to commit such a crime, but I must still pay for it. Otherwise, I would have the blood of two Muslims on my conscience. Please release the purveyor and put me in his place.
        - id: ch03-b11
          speaker: narrator
          text: >-
            After hearing the doctor's confession, the chief ordered the purveyor released and the doctor led to the gallows in his place. The executioner put the rope around the doctor's neck. His feet had already left the ground when the tailor's voice rang out from the crowd. The tailor begged the executioner to pause for one moment and listen to what he had to say.
        - id: ch03-b12
          speaker: tailor
          text: >-
            My lord, you have nearly put three innocent people to death! Listen to me, and you'll learn who is truly responsible. If anyone must suffer, it must be me.
        - id: ch03-b13
          speaker: tailor
          text: >-
            Yesterday at dusk, I was working cheerfully in my shop. The little hunchback came to the doorway, more than half drunk, and sang several songs for me. I invited him to spend the rest of the evening at my home, and he accepted. During supper, I served him a piece of fish. A bone caught in his throat, and though my wife and I did all we could, he died within minutes.
        - id: ch03-b14
          speaker: tailor
          text: >-
            We were deeply sorry, but we feared people would blame us. So we carried the body to the doctor's house. I knocked and asked the servant to bring her master quickly to a sick man who needed treatment. To hurry him along, I put his fee into her hand. As soon as she went upstairs, I dragged the body to the top of the steps. Then my wife and I hurried home.
        - id: ch03-b15
          speaker: tailor
          text: >-
            The doctor accidentally knocked the body downstairs. When he found the man dead, he believed he had killed him. But now you know the truth. Free the doctor and let me die instead.
        - id: ch03-b16
          speaker: narrator
          text: >-
            The chief of police and the whole crowd of spectators stood amazed. None of them could believe the strange chain of events that had grown from the death of one little hunchback.
        - id: ch03-b17
          speaker: chief
          text: >-
            Release the doctor and hang the tailor. He has confessed to the crime. This is truly an extraordinary story. It deserves to be written in letters of gold.
        - id: ch03-b18
          speaker: narrator
          text: >-
            The executioner quickly untied the doctor and began placing the rope around the tailor's neck. At that very time, the Sultan of Kashgar had noticed that his jester was missing and asked his officers what had become of him.
    - id: ch04
      title: The Sultan's Summons
      blocks:
        - id: ch04-b01
          speakers: [officer_1, officer_2]
          ensemble: duo
          text: >-
            Sire, the hunchback drank too much, escaped from the palace, and wandered through the town. He was found dead this morning. A man was arrested for killing him and kept in prison until a gallows could be built.
        - id: ch04-b02
          speakers: [officer_1, officer_2]
          ensemble: duo
          text: >-
            Just as that man was about to die, another came forward and confessed. Then another did the same. This has continued for some time. At this very moment, the chief of police is questioning a man who insists that he alone is the true killer.
        - id: ch04-b03
          speaker: narrator
          text: >-
            As soon as the Sultan heard this, he sent an usher to the chief of police. The usher was to bring back everyone connected with the hunchback's death, along with the corpse, so the Sultan could see his jester once more.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The usher hurried away on his errand and arrived only just in time. The tailor was already swinging in the air when the royal command cut through the silence of the crowd. The hangman recognized the speaker as one of the Sultan's servants and immediately cut the tailor down. Once the usher had made sure the man was safe, he found the chief of police and delivered the Sultan's order.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The chief immediately set out for the palace. With him went the tailor, the doctor, the purveyor, and the merchant. The dead hunchback had to go as well, just as the Sultan had commanded. Together, the four men lifted the body and carried it on their shoulders through the city to the palace.
        - id: ch04-b06
          speaker: narrator
          text: >-
            When the strange procession reached the palace, the chief of police bowed to the ground at the Sultan's feet. Then he related everything he knew about the case from beginning to end. The circumstances struck the Sultan as so remarkable that he called for his private historian and ordered him to write an exact account of all that had happened. That way, in the years to come, no one would forget the miraculous escape of the four men who had each believed himself a murderer.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Then the Sultan asked everyone involved in the hunchback's affair to tell his own story. Among them was a talkative barber, and the tale he told about one of his brothers follows next.
