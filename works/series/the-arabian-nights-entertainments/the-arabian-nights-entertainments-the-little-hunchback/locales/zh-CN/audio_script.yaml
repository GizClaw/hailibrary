audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    tailor:
      display_name: 裁缝
      tts:
        delivery: 本分直率，慌乱时语速加快
        timbre: 清亮朴实
        pace: 适中
        pitch: 中音
    tailor_wife:
      display_name: 裁缝妻子
      tts:
        delivery: 利落机敏，紧张时仍很实际
        timbre: 明快自然
        pace: 稍快
        pitch: 中高音
    servant:
      display_name: 女仆
      tts:
        delivery: 谨慎恭顺，吐字简洁
        timbre: 柔和清晰
        pace: 适中
        pitch: 中音
    doctor:
      display_name: 犹太医生
      tts:
        delivery: 年轻急切，受惊时慌张失措
        timbre: 清晰偏亮
        pace: 稍快
        pitch: 中高音
    doctor_wife:
      display_name: 医生妻子
      tts:
        delivery: 聪明果断，危急时干脆有主意
        timbre: 清脆坚定
        pace: 适中
        pitch: 中音
    purveyor:
      display_name: 苏丹的采办
      tts:
        delivery: 胆大爽直，认错时诚恳坚决
        timbre: 粗壮洪亮
        pace: 适中
        pitch: 中低音
    merchant:
      display_name: 基督徒商人
      tts:
        delivery: 富足自信，酒醒后困惑不安
        timbre: 饱满清晰
        pace: 适中
        pitch: 中音
    policeman:
      display_name: 警长
      tts:
        delivery: 严厉警觉，说话直截了当
        timbre: 硬朗有力
        pace: 稍快
        pitch: 中低音
    police_chief:
      display_name: 警察总监
      tts:
        delivery: 威严果断，面对奇事时带着惊叹
        timbre: 深沉清晰
        pace: 稳健
        pitch: 低音
    sultan:
      display_name: 喀什噶尔苏丹
      tts:
        delivery: 威严冷峻，发令简洁有力
        timbre: 洪亮沉稳
        pace: 稍缓
        pitch: 低音
    officer:
      display_name: 王宫侍从
      tts:
        delivery: 恭敬准确，禀报时条理分明
        timbre: 清晰稳重
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 一根鱼刺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            很久以前，喀什噶尔王国里住着一对十分恩爱的裁缝夫妇。喀什噶尔就在大鞑靼的边境上，这一点人人都知道。

            一天，裁缝正在店里专心干活，一个小驼背来到门口坐下，边唱歌边敲手鼓。他一会儿唱，一会儿做出滑稽的模样，把裁缝逗得十分开心。裁缝心想，不如带这个有趣的家伙回去，也让妻子开心一下。他便开口相邀。小驼背答应了，裁缝当即收起手里的活，关上店门，同他一起回去。

            到家时，餐桌早已收拾整齐，晚饭也摆好了。没过多久，三个人便围坐桌前，吃起裁缝妻子亲手做的一尾鲜美大鱼。不料，小驼背吞下一根很大的鱼刺，立刻噎住了。夫妻俩想尽办法相救也没有用，他顷刻间便窒息断了气。

            两人不但为这个可怜人难过，也为自己的处境怕得魂不附体。警察要是知道了，他们这对本分夫妻很可能会被当成故意杀人的凶手关进监牢。为了躲过这场大祸，他们苦苦盘算，想找个办法把嫌疑引到别人身上。最后，两人决定让附近一位犹太医生充当罪案的元凶。

            裁缝抬着小驼背的头，妻子托着他的脚，一同把尸体送到医生家。他们敲开大门，门里就是一道陡峭的楼梯。一个女仆摸黑走下来，问他们有什么事。
        - id: ch01-b02
          speaker: tailor
          text: 请告诉你家主人，我们带来一个重病的人，请他赶快医治。这点钱先交给他，免得他觉得白费工夫。
        - id: ch01-b03
          speaker: narrator
          text: 女仆收下钱，重新走上楼梯，去向医生传话。她的身影刚一消失，裁缝夫妇便迅速抬着尸体跟上去，把他稳稳靠在楼梯顶端。两个人一刻也不敢停留，转身便跑，双腿能有多快就跑多快，一口气逃回了家。
        - id: ch01-b04
          speaker: narrator
          text: 年轻的医生平日没有多少病人，一听来了生意，顿时喜出望外。
        - id: ch01-b05
          speaker: doctor
          text: 快拿灯来，赶紧跟上我！
        - id: ch01-b06
          speaker: narrator
          text: |-
            医生冲出房门，直奔楼梯，黑暗中险些被小驼背绊倒。他不知道脚下是什么，狠狠一脚把尸体踢得滚下楼梯。那尸体一直滚到最底下，差一点连医生也拖了下去。他连声催女仆拿灯。等灯送来，他看清自己做了什么，吓得几乎发疯。
        - id: ch01-b07
          speaker: doctor
          text: 神圣的摩西啊！我为什么没等灯来？送来治病的人竟被我害死了。要是以斯拉的圣驴不来救我，我很快就会被当成杀人犯押进监牢！
          emotion: fearful
    - id: ch02
      title: 尸体去了哪里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            医生惊慌万分，也的确有理由惊慌。不过，他还没有忘记先关好大门，免得过路的人碰巧看见这里出了什么事。随后，他抱起小驼背的尸体，送进妻子的房间，险些把她也吓疯。
        - id: ch02-b02
          speaker: doctor_wife
          text: 我们完了！天一亮，这具尸体就再也藏不住。得赶紧把他弄出这所房子。你怎么会犯下这么可怕的罪？
          emotion: fearful
        - id: ch02-b03
          speaker: doctor
          text: 先别追问了，我们得想一条脱身的路。
        - id: ch02-b04
          speaker: narrator
          text: 夫妻俩想了很久，把每一种可能的脱身办法都在心里翻来覆去，却始终找不到一个足够妥当的。医生终于彻底死心，只好认命，等着为这场不幸受罚。可妻子比他聪明一倍，忽然想出了主意。
        - id: ch02-b05
          speaker: doctor_wife
          text: 把尸体抬上屋顶，从邻居那个穆斯林家的烟囱里放下去！
        - id: ch02-b06
          speaker: narrator
          text: |-
            那位邻居是苏丹的采办，专给宫里供应油和黄油。他家有一大片仓库，老鼠成群，整日像在里面摆宴席。

            医生一听便赞成了。夫妻俩抬起小驼背，把绳索从尸体的腋下穿过，再从屋顶轻轻将他放进采办的卧房。他们做得十分小心，看上去简直像有个人靠墙站着。等感觉到尸体的脚已经落地，两人便抽回绳子，丢下他不管了。

            他们刚回家，采办也参加完一场婚宴，提着灯笼走进卧房。他借着昏暗的灯光，看见烟囱里站着一个人。采办天生胆大，抓起棍子就扑向这个想象中的窃贼。
        - id: ch02-b07
          speaker: purveyor
          text: 好啊，原来偷我黄油的不是老鼠，是你！这次我管保你再也不敢回来！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: |-
            采办狠狠打了几棍，尸体倒在地上，他反而打得更起劲。过了好一阵，他才觉得不对。这个贼为什么躺得这样安静，一动不动，连还手也不会？他停下棍子，俯身仔细查看，发现那人已经死透了。一阵冰冷的恐惧顿时攫住了他。
        - id: ch02-b09
          speaker: purveyor
          text: 我这个恶棍，竟然杀了人！我报复得太过分了。没有安拉相助，我就完了。害我丧命的这些货物，全都该受诅咒！
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: |-
            他仿佛已经感觉到绞索套住了自己的脖子。最初的惊吓过去后，采办也开始思量怎样逃过这一劫。他把小驼背一把抱进怀里，带到街上，靠在一家店铺的墙边，然后偷偷溜回自己的房子，一次也没有回头。

            日出前不久，一个富有的基督徒商人离家去浴室。他也替王宫办事，供应宫里所需的各样物品。前一夜，他刚刚赴宴回来，已经醉得厉害，但还知道天快亮了。虔诚的穆斯林很快便要去礼拜。他若在路上遇见前往清真寺的人，被人看出醉态，准会因酗酒入狱，于是赶紧加快脚步。

            慌忙间，他撞上小驼背，尸体沉重地倒在他身上。商人以为遭到窃贼袭击，一拳把对方打倒，又高声呼救，边喊边殴打地上的人。
    - id: ch03
      title: 第一个将被绞死的人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这一带的警长赶来，看见一个基督徒正在殴打一个穆斯林，十分气愤。
        - id: ch03-b02
          speaker: policeman
          text: 你在干什么？
          emotion: angry
        - id: ch03-b03
          speaker: merchant
          text: 他想抢我，差一点就掐死我！
        - id: ch03-b04
          speaker: policeman
          text: 你的仇已经报够了。走吧，快离开这里！
        - id: ch03-b05
          speaker: narrator
          text: |-
            警长说着，伸手想扶小驼背起来，对方却一动不动。他凑近仔细一看，立刻认定这个基督徒竟敢这样对待一个穆斯林，便牢牢抓住商人，把他送到警察总监那里。总监将商人投入监牢，等法官起床后审问。

            这一吓让商人彻底醒了酒。他越想越不懂，小驼背怎么会只挨了那几拳便死掉。

            商人还在思量，便被传到警察总监面前。总监盘问他的罪行，他无法否认自己动过手。死者又是苏丹的贴身弄臣，总监不肯立即宣判死刑，决定先去请示主人。他进宫求见，将整件事禀告苏丹。
        - id: ch03-b06
          speaker: sultan
          text: 基督徒杀了穆斯林，绝不能赦免。照你的职责办吧。
        - id: ch03-b07
          speaker: narrator
          text: |-
            总监领命以后，叫人架起绞刑架，又派传令官走遍全城的大街小巷，宣布当天要绞死一个杀害穆斯林的基督徒。

            一切准备妥当，商人被从监牢里押出来，带到绞刑架下。刽子手把绳索牢牢套上这个不幸之人的脖子，正要将他吊起，苏丹的采办忽然冲开人群，上气不接下气地朝刽子手喊起来。
        - id: ch03-b08
          speaker: purveyor
          text: 住手！别这么急！小驼背不是他杀的，是我杀的！
        - id: ch03-b09
          speaker: narrator
          text: 警察总监也在场监督，确保行刑不出差错。他当场盘问了采办几个问题。采办便从头讲起，说自己怎样把小驼背当成偷黄油的贼，用棍子将他打倒，发现人死了以后，又怎样把尸体抱到街上，靠在商人后来经过的那家店铺墙边。
        - id: ch03-b10
          speaker: purveyor
          text: 这个基督徒撞上的本来就是死人，他不可能是凶手。我杀了一个穆斯林已经罪孽深重，不能再让无辜的人替我偿命。
        - id: ch03-b11
          speaker: narrator
          text: 采办说得很响，围观的人全都听见了。就算警察总监还想处死商人，此刻也已经办不到了。
        - id: ch03-b12
          speaker: police_chief
          text: 解开基督徒的绳子，把这个亲口认罪的人吊上去。
    - id: ch04
      title: 谁才是真凶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 刽子手依命解开商人的绳索，正给采办牢牢套上，犹太医生忽然高声恳求他停下，说自己有极重要的话。医生奋力挤过拥挤的人群，终于来到警察总监面前。
        - id: ch04-b02
          speaker: doctor
          text: |-
            尊贵的大人，这个穆斯林不该死，只有我才有罪。

            昨晚，一男一女两个陌生人来敲门，说带来一个病人。女仆摸黑给他们开门，答应上楼叫醒我，也收下了诊金。她去传话时，那两个人似乎把病人放在楼梯顶端，自己走了。

            我没等灯笼，匆忙跑向楼梯，在黑暗中撞上一个东西。它一直滚到楼梯底下。我检查以后，才发现那是一个已经死去的驼背穆斯林。

            我和妻子吓坏了，把尸体从屋顶放进邻居采办家的烟囱。采办以为房里来了贼，一棍把他打倒。看见对方死了，他便以为是自己下的手。

            可听到这里，您该明白，那是误会。真正害死他的人是我。我虽然无意犯罪，也应当偿命，否则良心上还要背负另一个穆斯林的鲜血。请放了采办，让我替他吧。
        - id: ch04-b03
          speaker: narrator
          text: 警察总监听完这番陈述，命人释放苏丹的采办，把医生押上绞刑架。绳索套住医生的脖子，他的双脚刚刚离开地面，人群里又响起裁缝的声音。他恳求刽子手再停一会儿，听他说完要紧的话。
        - id: ch04-b04
          speaker: tailor
          text: |-
            大人，您差一点就害死三个无辜的人！请听完我的话，真正有罪的是我。

            昨天傍晚，我正在店里快活地做工。那个半醉的小驼背来到门口，唱了几支歌。我请他来家里度过余下的夜晚，他便跟我回去了。

            晚饭时，我夹给他一片鱼肉。一根鱼刺卡进他的喉咙，我们怎么救也没用，几分钟后他就死了。我们非常难过，又怕被人追究，才把尸体抬到犹太医生家。

            我敲开大门，请女仆催医生下来救治病人，还给了她一枚钱币作诊金。女仆一走，我就把尸体拖到楼梯顶端，同妻子赶紧逃回家。医生下楼时撞倒尸体，以为是自己害死了人。

            现在真相已经清楚了。请放过医生，让我替他去死。
        - id: ch04-b05
          speaker: narrator
          text: 警察总监和围观的人听得目瞪口呆。一个小驼背的死，竟引出了这一连串离奇的事，三个险些被当成凶手处死的人，原来全都没有杀他。
        - id: ch04-b06
          speaker: police_chief
          text: 给医生松绑，改吊裁缝。他已经认罪。这个故事实在奇异，真该用金字写下来。
    - id: ch05
      title: 四个人死里逃生
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            刽子手飞快解开捆住医生的绳结，正要把绞索套上裁缝。就在这时，喀什噶尔的苏丹发现贴身弄臣不见了，向手下问起他的去向。
        - id: ch05-b02
          speaker: officer
          text: |-
            陛下，小驼背喝多了酒，逃出王宫，在城里四处游荡。今天早晨，人们发现他已经死了。

            一个男子因涉嫌害死他而被捕。绞刑架搭好以后，那个人刚要受刑，先后又来了几个人，每一个都说自己才是凶手。此刻，警察总监还在盘问一个自称真凶的男子。
        - id: ch05-b03
          speaker: narrator
          text: |-
            苏丹听完禀报，立刻命一名宫廷传令官赶去见警察总监，把所有牵涉小驼背之死的人连同尸体一起带来。他还想再看弄臣最后一眼。

            传令官奉命急急赶去，抵达时恰是最后关头，裁缝已经实实在在地被吊到了半空。人群鸦雀无声，他的命令忽然在寂静中响起，叫刽子手立即把人放下。刽子手认出他是国王的侍从，马上割断绳索。

            传令官见裁缝平安以后，找到警察总监，传达苏丹的命令。总监随即动身进宫，带上裁缝、医生、采办和商人。四个人把死去的小驼背扛在肩上，排成一支奇异的队伍，一同前往王宫。

            队伍抵达宫中，警察总监伏在苏丹脚下，将自己知道的一切如实禀报。事情的来龙去脉令苏丹大为震动。他命自己的史官把全部经过准确写下来。这样，那四个误以为自己杀了人的男子怎样奇迹般逃过一死，千百年后也不会被人遗忘。

            随后，苏丹又请所有牵涉小驼背事件的人各自讲述自己的故事。其中有一个喋喋不休的理发师。下面要讲的，便是他一位兄弟的故事。
