audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    alnaschar:
      display_name: 阿尔纳斯查尔
      tts:
        delivery: 爱夸口又冲动，情绪起伏鲜明
        timbre: 轻快灵活
        pace: 明快，幻想时逐渐加快
        pitch: 中高音
    tailor:
      display_name: 裁缝
      tts:
        delivery: 嘲讽直率，责骂时义愤难平
        timbre: 干涩清亮
        pace: 稍快
        pitch: 中音
    noble_lady:
      display_name: 贵夫人
      tts:
        delivery: 宽厚从容，自有不容置疑的威仪
        timbre: 柔润端庄
        pace: 适中
        pitch: 中音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 奉承圆滑，受质问时装腔抗议
        timbre: 苍老偏细
        pace: 适中偏快
        pitch: 中高音
    rich_lady:
      display_name: 宅中夫人
      tts:
        delivery: 举止文雅，言语谨慎而善于劝诱
        timbre: 柔和秀雅
        pace: 适中
        pitch: 中音
    black_slave:
      display_name: 持刀黑奴
      tts:
        delivery: 阴狠威逼，命令短促有力
        timbre: 低沉粗粝
        pace: 稍缓
        pitch: 低音
    judge:
      display_name: 法官
      tts:
        delivery: 官腔威严，决断时冷淡干脆
        timbre: 坚实洪亮
        pace: 稳健
        pitch: 中低音
    wife_attendant:
      display_name: 妻子的侍女
      tts:
        delivery: 恭敬恳切，哀求时小心翼翼
        timbre: 柔和清晰
        pace: 适中
        pitch: 中音
    mother_in_law:
      display_name: 岳母
      tts:
        delivery: 谦卑诚恳，求情时焦急恳切
        timbre: 温厚成熟
        pace: 适中
        pitch: 中低音
    imagined_wife:
      display_name: 幻想中的妻子
      tts:
        delivery: 含泪怯弱，言语深情而卑微
        timbre: 轻柔纤细
        pace: 稍缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一篮玻璃做成的美梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            父亲在世的时候，我的兄弟阿尔纳斯查尔懒得出奇。他不肯做工，每天傍晚出去讨些东西，留着第二天过活，丝毫也不觉得羞耻。

            父亲年老去世，只留下七百枚银德拉克马。我们七个儿子每人分到一百枚。阿尔纳斯查尔从来没见过这么多属于自己的钱，想了很久，才决定从批发商那里买进杯子、瓶子一类的玻璃器皿。

            他又在好地段找到一间小铺子，把货全堆在一只没有盖的篮子里，摆在门前。自己就坐在敞开的店门口，等过路的人来买。

            他盯着篮子，心却越飘越远。不知什么时候，竟把心里的算盘大声说了出来。隔壁铺子的裁缝听得一清二楚。
        - id: ch01-b02
          speaker: alnaschar
          text: |-
            这一篮货花了一百枚德拉克马，也就是我的全部家当。只要一件件卖掉，就能变成两百枚。我再拿两百枚买玻璃，很快又会变成四百枚。这样翻下去，四千枚不难，四千再翻一番也容易。

            等攒到一万枚，我就丢下玻璃生意，去做珠宝商，专门买卖珍珠、钻石和各种宝石。最后，我想要多少财富就有多少。我要买一座美丽的乡间宅邸，养骏马，养奴仆，天天享乐，还要大宴宾客。附近城里的乐师和舞女，都得来给我的客人助兴。

            不过，有了这些我还不能收手。非等攒足十万枚德拉克马，我才不再做生意。到那时，我已经成了举足轻重的人物，就去求娶大维齐尔的女儿。我会告诉她父亲，我听说她既美丽又聪明，成婚那天还会送上三千枚金币。

            他要是不肯……当然，他多半不敢拒绝。可他真敢说不，我就揪住他的胡子，把他拖到我家里来！
        - id: ch01-b03
          speaker: alnaschar
          text: |-
            娶到他的女儿以后，我要挑十个最出色的阉奴服侍她。我自己穿上最华丽的礼服，骑一匹骏马，马鞍用纯金打造，辔饰上全是钻石。身后再跟一长队奴仆，就这样去拜访大维齐尔。

            沿途百姓见了我，都要低下眼睛，深深鞠躬。到了大维齐尔府邸的台阶下，我翻身下马，让仆从整整齐齐地列在左右两边。我独自走上台阶，大维齐尔早就在阶顶等着迎接我。他会把我当女婿一样拥抱，让我坐他的座位，自己反倒坐在我的下首。

            这些事情当然都会像我料想的那样发生。随后，我的两个仆人各捧一个钱袋进来，每袋都有一千枚金币。他们当着大维齐尔的面走到我跟前，把钱袋恭恭敬敬地送到我手上。
        - id: ch01-b04
          speaker: alnaschar
          text: 这是求娶令爱时说好的一千枚金币。这里还有一千枚，叫您看看，我阿尔纳斯查尔给人的，总比答应的更多。
        - id: ch01-b05
          speaker: alnaschar
          text: |-
            天下人听说我这么慷慨，从此嘴里谈的就只有我了。

            我回家时，排场也要同出门时一样。妻子会派官员来，替她恭贺我拜访过父亲。我便赏给那官员一身华服和一份厚礼。可妻子若送我礼物，我绝不接受，还要把送礼的人赶出去。

            没有我的准许，她别想踏出自己的房间。我去看她，也要处处讲究仪式，让她敬畏我。我家的规矩一定最严整，我也永远穿得配得上自己的身份。

            晚上回到内室，我坐在上首，摆出威严的神气，一言不发，只看着前方。我的妻子美得像一轮满月，低着头站在我面前，我偏偏装作没看见。
        - id: ch01-b06
          speaker: wife_attendant
          text: 尊贵的老爷和主人，您的妻子和奴婢正站在面前，等您看她一眼。您一直不肯垂顾，她心里难过，站得也累了。求您请她坐下吧。
        - id: ch01-b07
          speaker: alnaschar
          text: |-
            我连听见的样子也不做，急得她们全都哭着扑到我脚下。我等够了，才抬起头，随便瞥妻子一眼，然后又恢复原来的姿势。

            侍女们准会以为我嫌她衣服不够好，赶紧带她去换一身更华美的。我也另换一套更加富丽的衣裳。等她们回来再求，这一次，我要叫她们花上更多工夫，才肯看妻子一眼。往后一辈子怎么过，新婚这天就得怎么开头。

            第二天，妻子会向母亲哭诉我怎样冷落她。听到这件事，我心里一定痛快极了。她母亲会赶来，恭恭敬敬地吻我的手。她可不敢随便叫我“女婿”，只敢叫我“老爷”。
        - id: ch01-b08
          speaker: mother_in_law
          text: 老爷，我求求您，别再不肯看我的女儿，也别躲着她。她一心只想讨您欢喜，整颗心都在您身上。
        - id: ch01-b09
          speaker: alnaschar
          text: |-
            我还是不理。哪怕她跪在脚下求我，也没有用。最后，她只好把一杯酒交给我的妻子。
        - id: ch01-b10
          speaker: mother_in_law
          text: 来，你亲手端给他。这样美丽的一只手递过去的东西，他怎么忍心拒绝呢？
        - id: ch01-b11
          speaker: alnaschar
          text: |-
            妻子眼里含着泪，浑身发抖地把酒递来，我却把脸转开。她哭得更厉害了，还是把杯子举在我面前。
        - id: ch01-b12
          speaker: imagined_wife
          text: 我敬爱的丈夫，只要您还不肯赏脸喝下这杯酒，我就一直求下去。
          emotion: sad
        - id: ch01-b13
          speaker: alnaschar
          text: 她这样纠缠，我一下就会火冒三丈。我先狠狠瞪她，再扇她一记耳光，接着用力一踢，让她踉踉跄跄穿过房间，摔到长榻上！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: |-
            我的兄弟完全陷在美梦里。说到这里，他竟真的抬脚踢了出去。这一脚不偏不倚，正中那只玻璃篮子。篮子翻到街上，里面的货顷刻摔成千百片。

            隔壁裁缝听完他的全部幻想，又亲眼看见这一幕，顿时放声大笑。
        - id: ch01-b15
          speaker: tailor
          text: 你这个可怜虫，真该羞愧死了！一个无辜的年轻妻子，你竟打算这样对待她。她流着泪苦苦哀求都感动不了你，你根本就是头畜生。我要是大维齐尔，一定叫人用牛皮鞭抽你一百下，再让传令官数说你的罪行，押着你走遍全城！
          emotion: angry
    - id: ch02
      title: 五百枚金币
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            这一脚不但踢碎了玻璃，也踢碎了阿尔纳斯查尔发财的指望。他终于清醒过来，知道全怪自己狂妄，便扯破衣裳，揪住头发，放声哭号。

            那天正好是星期五，街上的行人比平日更多。有人停下来可怜他，也有人只顾着笑话他。那股冲昏头脑的虚荣，已经跟一篮玻璃一起碎掉了。他还在为自己的愚蠢放声痛哭时，一位一望便知身份尊贵的夫人骑着骡子经过。她停下来，问出了什么事，这个男人为什么哭。众人告诉她，这个穷人用全部家当买了一篮玻璃，现在全摔碎了。
        - id: ch02-b02
          speaker: noble_lady
          text: 把你身上带的钱都给他。
        - id: ch02-b03
          speaker: narrator
          text: |-
            随从马上把一只钱袋放进我兄弟手里，里面足有五百枚金币。阿尔纳斯查尔欢喜得险些丢了性命。他对夫人祝福了千百遍，随后关掉已经无货可卖的铺子，回到家中。

            他还在出神地想着这场好运，门外忽然响起敲门声。打开一看，是个老妇人。
        - id: ch02-b04
          speaker: old_woman
          text: 孩子，我想求你一件事。礼拜的时辰到了，我还没有净身。请让我进屋，再给我一点水吧。
        - id: ch02-b05
          speaker: narrator
          text: |-
            我的兄弟根本不认识她，还是立刻答应了。他给老妇人一罐水，自己坐回原处，一边回想方才那场意外和突如其来的好运，一边把金币装进细长的钱袋。那种钱袋系在腰带上，随身带着十分方便。

            老妇人做完祈祷，来到他面前恭恭敬敬地拜了两拜。她站起身后，又为他祈求了数不清的福分。阿尔纳斯查尔看她衣衫破旧，以为这份感激其实是在暗示自己给钱添置新衣，便递给她两枚金币。老妇人像受了侮辱似的，吃惊地往后一退。
        - id: ch02-b06
          speaker: old_woman
          text: 天哪，您这是什么意思？老爷，您把我当成那种闯进别人家里讨钱的可怜虫了吗？快把钱收回去吧。我什么也不缺。我服侍的夫人又美丽又富有，我想要什么，她都会给我。
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: 我的兄弟没有看破她的把戏。老妇人故意不收两枚金币，正是想骗走更多。他反而问，能不能让自己见一见那位美丽的夫人。
        - id: ch02-b08
          speaker: old_woman
          text: 当然可以。她一定很愿意嫁给您，让您做她全部财富的主人。把钱收好，跟我走吧。
        - id: ch02-b09
          speaker: narrator
          text: |-
            一想到既能发财，又能娶到美人，我的兄弟乐得什么也不问。他把钱袋藏进衣褶，跟着老妇人出了门。

            走了好一阵，他们在一座大宅前停下。一个年轻的希腊女奴开了门。老妇人领他穿过铺得齐整的庭院，来到陈设华美的厅堂，随后独自去通报女主人。

            天气很热，阿尔纳斯查尔倒在一堆软垫上，摘下沉重的头巾。不久，一位夫人走了进来。她比他想象中更美，衣饰也更华贵。他连忙起身，夫人却示意他坐下，自己也坐到旁边。两人客套了一番。
        - id: ch02-b10
          speaker: rich_lady
          text: 这里坐着不舒服，我们换一间屋子吧。
        - id: ch02-b11
          speaker: narrator
          text: 她带他走进一间较小的屋子，那里似乎没有别的出口。又谈了一会儿，夫人忽然匆匆起身。
        - id: ch02-b12
          speaker: rich_lady
          text: 你留在这里，我马上回来。
        - id: ch02-b13
          speaker: narrator
          text: |-
            阿尔纳斯查尔依言等着。可门再次打开时，进来的不是夫人，而是一个身材魁梧、手执弯刀的黑奴。他满面怒容，一步步逼近。
        - id: ch02-b14
          speaker: black_slave
          text: 你来这里干什么？
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: |-
            那声音和神色实在骇人。阿尔纳斯查尔吓得一个字也说不出，任由黑奴抢走金币，又挥刀把自己砍伤，始终不敢抵抗。黑奴一松手，他就倒在地上，虽然神志清醒，身子却动弹不得。

            黑奴以为他已经死了，叫希腊女奴拿来一盆盐。两个人把盐狠狠抹进每一道伤口，疼得他如受酷刑。幸好他还沉得住气，忍住剧痛，没有露出半点活人的动静。

            两人离开后，老妇人进来了。她把他拖到一道活板门前，扔进一个地窖。那里面堆满了遇害者的尸体。
    - id: ch03
      title: 从杀人魔窟归来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            猛烈的一摔让阿尔纳斯查尔失去了知觉。可伤口里的盐一直钻心地痛，使他没有就此死去，反倒保住了性命。他一点点恢复力气。两天后的夜里，他终于能够推开头顶的活板门，爬出去藏进庭院，一直等到天亮。

            老妇人出门寻找新的猎物，没有发现他。等她走远，他偷偷逃出这个杀人魔窟，来到我家避难。

            我替他包扎伤口，小心照料。过了一个月，他恢复如初，心里只剩下一件事，就是找那个恶毒的老婆子报仇。

            他做了一只足够装五百枚金币的大钱袋，里面却塞满玻璃碎片，再把它系在腰上。随后，他装扮成一个老妇人，把弯刀藏进衣服。

            一天早晨，他弯腰驼背地走在街上，正遇见仇人四处物色新的猎物。他模仿女人的声音，主动上前搭话。
        - id: ch03-b02
          speaker: alnaschar
          text: 你有没有秤，能借我用一下吗？我刚从波斯来，带了五百枚金币，想看看每枚的分量够不够。
        - id: ch03-b03
          speaker: old_woman
          text: 好太太，你找我可算找对人了。我儿子就是钱币兑换商。跟我来，他会亲自替你称。不过咱们得快一点，不然他就去铺子了。
        - id: ch03-b04
          speaker: narrator
          text: |-
            老妇人又把他领到原先那座宅子，开门的仍是那个希腊女奴。我的兄弟照旧独自等在厅堂。没过多久，那个冒充老妇人儿子的黑奴出现了。
        - id: ch03-b05
          speaker: black_slave
          text: 该死的老太婆，起来，跟我走！
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: |-
            黑奴转身向杀人的地方走去。阿尔纳斯查尔跟着站起来，从衣服下面抽出弯刀，一刀斩断了他的脖子。他一手提着头，一手拖着尸体，把身子扔进地窖，又把头丢了下去。

            希腊女奴以为事情和往常一样，端着一盆盐来了。她看见阿尔纳斯查尔手持弯刀，吓得扔下盐盆，转身就逃。可他快了一步，眨眼间，她的头也滚落在地。

            响声把老妇人引了过来。她还没来得及逃，就被他一把抓住。
        - id: ch03-b07
          speaker: alnaschar
          text: 恶妇，你认得我吗？
          emotion: angry
        - id: ch03-b08
          speaker: old_woman
          text: 老爷，您是谁？我从来没见过您。
          emotion: fearful
        - id: ch03-b09
          speaker: alnaschar
          text: 我就是那个让你进家门、看着你假意祷告的人。现在想起来了吗？
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 老妇人跪地求饶，阿尔纳斯查尔却把她斩成了四块。
    - id: ch04
      title: 空空的金箱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            现在只剩宅中的夫人还活着。她对身边发生的一切毫不知情。阿尔纳斯查尔找遍大宅，终于见到她。她一看见他，吓得几乎昏过去，苦苦求他饶命。

            我的兄弟答应不杀她，但要她说清楚，自己怎么会和那些恶人合伙。
        - id: ch04-b02
          speaker: rich_lady
          text: |-
            我从前是个本分商人的妻子。那个老妇人偶尔来探望我，我当时根本不知道她有多恶毒。

            有一天，她说她家要举办盛大的婚礼，请我赏光出席，还说我一定会玩得很开心。我相信了她，穿上最华美的衣裳，又带了一百枚金币。谁知一进这扇门，我就被那个可怕的黑奴强行扣住。

            到今天，我被关在这里整整三年了，也痛苦了整整三年。
          emotion: sad
        - id: ch04-b03
          speaker: alnaschar
          text: 那个可怕的黑奴，一定积攒了数不清的财富。
        - id: ch04-b04
          speaker: rich_lady
          text: 确实多得惊人。只要能全部带走，就够你富足一辈子。来，我带你去看看。
        - id: ch04-b05
          speaker: narrator
          text: |-
            她领阿尔纳斯查尔走进一间屋子。屋里摆满了箱柜，每一只都塞满黄金。他站在那里看得满脸惊叹，怎么也藏不住心中的赞叹。
        - id: ch04-b06
          speaker: rich_lady
          text: 去找些人来，把箱子全都运走。
        - id: ch04-b07
          speaker: narrator
          text: |-
            阿尔纳斯查尔连第二句话也没等，立刻跑到街上，很快找来十个人。可他们回到大宅时，只见门敞开着，原先装满黄金的箱子全不见了。他惊得不敢相信自己的眼睛。那位夫人比他精明，已经把这段时间用得再好不过，带着黄金逃走。

            他只好搬走宅里那些精美家具，安慰自己说，这些东西的价值毕竟远远超过丢掉的五百枚金币。

            不幸的是，他出门时忘了锁门。邻居发现宅中空无一人，便报了警。第二天早晨，警察把阿尔纳斯查尔当作窃贼抓起来。他想用钱贿赂警察，求他们放过自己，可没人理会。他们绑住他的双手，让他夹在众人中间一路步行，把他押到法官面前。

            警察说明缘由以后，法官问他，昨天搬回家的那些家具究竟从哪里得来。
        - id: ch04-b08
          speaker: alnaschar
          text: 大人，我愿意从头到尾说出实情。可是，请您先答应我，不会因为这个故事惩罚我。
        - id: ch04-b09
          speaker: judge
          text: 我答应你。
    - id: ch05
      title: 法官的裁决
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            我的兄弟便从最初那篮玻璃讲起，说出自己的全部遭遇，也说了怎样逃过一死，又怎样向那伙陷害他的恶人报仇。说到家具，他恳求法官至少准他留下其中一部分，好补偿被抢走的五百枚金币。

            法官对他的请求一句也不回答，马上派人把阿尔纳斯查尔搬走的东西全部取来。等家具都运进自己的府邸，他又命我的兄弟离开这座城，若敢回来，就要他的命。他生怕阿尔纳斯查尔回来以后，会去找哈里发讨还公道。

            阿尔纳斯查尔只得服从，动身前往附近的一座城。可还没走到那里，他就在路上撞见一伙强盗。强盗扒走他全身衣服，也没有给他留下任何遮身的东西，就这样把他赤条条地丢在路边。

            我听说他的惨状，急忙追去安慰他，又拿出自己最好的长袍给他穿。趁着夜色，我让他乔装改扮，把他带回家中。从那以后，我一直照料他，就像照料其余几个兄弟一样。
