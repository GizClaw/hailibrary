  chapters:
    - id: ch01
      title: The Basket of Glass
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            While our father was alive, my brother Alnaschar was thoroughly idle. Instead of earning his bread, he begged each evening and lived the next day on whatever he received. When our father died of old age, he left seven hundred silver drachmas among his seven sons. Alnaschar's share was one hundred, more money than he had ever owned, and at first he had no idea what to do with it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After thinking it over, he bought glasses, bottles, and other pieces of glassware from a wholesale merchant. Then he found a small shop in a good place. He sat in the open doorway with all his goods piled in an uncovered basket before him and waited for people to pass.
        - id: ch01-b03
          speaker: narrator
          text: >-
            His eyes stayed on the basket, but his thoughts wandered far away. Before long, he was speaking aloud without knowing it. A tailor in the shop next door could hear every word.
        - id: ch01-b04
          speaker: alnaschar
          text: >-
            This basket cost me one hundred drachmas, every coin I own. If I sell the pieces one by one, I will make two hundred. I will spend that on more glass and turn it into four hundred. I will keep doing that until I have four thousand, and soon enough that will double too.
        - id: ch01-b05
          speaker: alnaschar
          text: >-
            Once I have ten thousand drachmas, I will leave the glass trade and become a jeweler. I will spend all my time dealing in pearls, diamonds, and other precious stones. In time I will have all the riches anyone could want. I will buy a beautiful country house, along with horses and slaves. Then I will live merrily and entertain my friends. Whenever I hold a feast, I will send to the neighboring town for musicians and dancers to amuse my guests.
        - id: ch01-b06
          speaker: alnaschar
          text: >-
            Even then, I will go on trading until I have one hundred thousand drachmas. By that time I will be an important man. I will ask to marry the grand vizier's daughter. I will tell him that I have heard of her beauty and wit, and that I will pay three thousand gold pieces on our wedding day. Of course he will hardly dare refuse me. If he does, I will seize him by the beard and drag him home.
        - id: ch01-b07
          speaker: alnaschar
          text: >-
            After I marry his daughter, I will give her ten of the finest servants I can find. I will dress in my grandest robes and mount a horse with a saddle of pure gold. Its trappings will blaze with diamonds, and a long train of slaves will follow me to the grand vizier's house. Everyone I pass will lower their eyes and bow deeply before me.
        - id: ch01-b08
          speaker: alnaschar
          text: >-
            At the foot of his staircase I will dismount. My servants will stand in rows on either side while I climb to meet the grand vizier. He will embrace me as his son-in-law, give me his own seat, and sit below me. Then two servants will enter, each carrying a purse with one thousand gold pieces.
        - id: ch01-b09
          speaker: alnaschar
          text: >-
            I will hand him the first purse and say, “Here are the thousand gold pieces I offered for your daughter's hand.” Then I will hold out the second. “And here are another thousand, to show that I give more than I promise.” The whole world will talk about my generosity.
        - id: ch01-b10
          speaker: alnaschar
          text: >-
            I will return home with all the same splendor I showed on the way there. My wife will send an officer to compliment me on my visit to her father. I will honor that officer with a rich robe and a handsome gift. But if my wife tries to send me a gift, I will refuse it and dismiss the person who carries it.
        - id: ch01-b11
          speaker: alnaschar
          text: >-
            I will never let my wife leave her rooms for any reason unless I give permission. Whenever I visit her, everything will be done with enough ceremony to inspire respect. No household will be managed better than mine, and I will always dress in a way that suits my position.
        - id: ch01-b12
          speaker: alnaschar
          text: >-
            That evening I will sit in the place of honor, looking grand and saying very little. My wife, lovely as the full moon, will stand humbly before my chair. I will stare straight ahead and pretend I cannot see her.
        - id: ch01-b13
          speaker: wife_attendant
          text: >-
            Honored lord and master, your wife and servant is standing before you, waiting to be noticed. She is deeply hurt that you will not even look at her, and she is tired from standing so long. Please ask her to sit down.
        - id: ch01-b14
          speaker: alnaschar
          text: >-
            I will give no sign that I heard a word, and that will upset her women terribly. They will throw themselves at my feet, lamenting and begging me to notice her. At last I will raise my head and give my wife one careless glance. Then I will settle back into exactly the same proud pose as before.
        - id: ch01-b15
          speaker: alnaschar
          text: >-
            The women will decide that her dress has displeased me. They will lead her away and dress her in something finer, while I change into robes more splendid than the ones I had on. Then they will bring her back and begin their pleas again. This time they will have to work much longer before they persuade me even to look at my wife. I may as well begin on my wedding day exactly as I mean to continue for the rest of our lives.
        - id: ch01-b16
          speaker: alnaschar
          text: >-
            The next day she will complain to her mother, and that will delight me. Her mother will come, kiss my hands respectfully, and call me “my lord.” She will never risk my anger by calling me her son-in-law.
        - id: ch01-b17
          speaker: mother_in_law
          text: >-
            My lord, please do not refuse to look at my daughter or come near her. She lives only to please you, and she loves you with all her heart.
        - id: ch01-b18
          speaker: alnaschar
          text: >-
            I will pay no more attention to my mother-in-law than I paid to the women. She will beg me again to hear her and this time throw herself at my feet. Nothing she does will move me. At last she will put a glass of wine into my wife's hand and tell her to offer it herself.
        - id: ch01-b19
          speaker: mother_in_law
          text: >-
            Take this to him yourself. Surely he cannot be cruel enough to refuse a gift from such a beautiful hand.
        - id: ch01-b20
          speaker: alnaschar
          text: >-
            My wife will take the glass and offer it to me with a trembling hand and tears in her eyes. I will turn my face in the other direction. That will make her weep even harder, but she will keep the glass stretched out toward me while she begs.
        - id: ch01-b21
          speaker: imagined_wife
          text: >-
            My adored husband, I will not stop begging until you grant me the kindness of taking this drink.
          emotion: sad
        - id: ch01-b22
          speaker: alnaschar
          text: >-
            Her pleading will finally drive me into a rage. I will glare at her, strike her hard across the cheek, and kick her so fiercely that she falls across the room onto the sofa.
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: >-
            My brother was so completely lost in his dream that his foot truly shot out as he imagined that cruel kick. Instead of striking his imaginary wife, it struck the basket in front of him. The basket toppled into the street, and all his glass shattered at once into a thousand pieces.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The tailor next door had heard every one of Alnaschar's grand visions. When he saw the broken glass, he burst into loud laughter.
        - id: ch01-b25
          speaker: tailor
          text: >-
            You miserable man! You should be ashamed of treating an innocent young wife that way, even in your dreams. What kind of brute could ignore her tears and prayers? If I were the grand vizier, I would have you whipped a hundred times. Then I would parade you through town while a herald announced what you had done.
          emotion: angry
    - id: ch02
      title: A Gift and a Trap
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The crash and the loss of every imagined profit brought Alnaschar back to his senses. He saw that his own unbearable pride had caused the disaster. He tore his clothes, pulled at his hair, and wailed so loudly that people stopped in the street to listen. Since it was Friday, there were more passersby than usual. Some pitied him, while others only laughed. All the vanity that had filled his head was gone with his basket of glass.
        - id: ch02-b02
          speaker: narrator
          text: >-
            While he was still loudly mourning his foolishness, a noble lady rode past on a mule. She stopped and asked why he was weeping. The people explained that the poor man had spent everything he owned on a basket of glass and that it had broken.
        - id: ch02-b03
          speaker: noble_lady
          text: >-
            Give him all the money you are carrying.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Her attendant obeyed and placed a purse of five hundred gold pieces in my brother's hands. Alnaschar almost died of joy when he felt its weight. He blessed the lady a thousand times. Then, since there was nothing left for him to do at the shop, he closed it and went home with the purse.
        - id: ch02-b05
          speaker: narrator
          text: >-
            He was still thinking about his wonderful luck when someone knocked at his door. An old woman stood outside.
        - id: ch02-b06
          speaker: old_woman
          text: >-
            My son, would you do me a kindness? It is time for prayer, and I have not washed yet. Please let me come inside and give me some water.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Though she was a complete stranger, my brother did not hesitate. He let her in, gave her a vessel of water, and returned to his seat and his thoughts. His mind was still busy with the astonishing events of the day. While the old woman washed and said her prayers, he put his new gold into a long, narrow purse that he could carry easily inside his belt.
        - id: ch02-b08
          speaker: narrator
          text: >-
            When the old woman finished praying, she came to Alnaschar and bowed all the way to the ground twice. Then she rose and poured blessing after blessing over him. Her clothes looked shabby. My brother decided all that gratitude was really a hint that she wanted money for new ones, so he held out two gold pieces. She jumped back in surprise as though the offer itself were an insult.
        - id: ch02-b09
          speaker: old_woman
          text: >-
            Good heavens, my lord! What do you mean by this? Do you think I am one of those wretched people who push into houses to beg? Take your money back. I need nothing. I serve a beautiful and very wealthy lady who gives me everything I want.
          emotion: surprised
        - id: ch02-b10
          speaker: narrator
          text: >-
            The old woman had refused two coins only because she hoped to get more. Alnaschar was not clever enough to see that. Instead, he asked whether she could arrange for him to meet her mistress.
        - id: ch02-b11
          speaker: old_woman
          text: >-
            Gladly. She will be delighted to marry you and make you master of all her wealth. Pick up your money and come with me.
        - id: ch02-b12
          speaker: narrator
          text: >-
            My brother believed he had found both a fortune and a beautiful wife without the least trouble. He asked no more questions. He hid the purse from the noble lady inside his clothes and happily followed his guide.
        - id: ch02-b13
          speaker: narrator
          text: >-
            They walked for some distance before the old woman stopped at a large house and knocked. A young Greek slave opened the door. The old woman led my brother across a well-paved courtyard and into a richly furnished hall. There she left him alone while she went to tell her mistress that a visitor had arrived.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The day was hot, so Alnaschar stretched out on a pile of cushions and removed his heavy turban. A few minutes later, a lady entered. One glance told him that she was even more beautiful and more richly dressed than he had expected. He rose from his seat, but she motioned for him to sit again and settled beside him. They exchanged all the usual polite greetings.
        - id: ch02-b15
          speaker: rich_lady
          text: >-
            We are not comfortable here. Let us move to another room.
        - id: ch02-b16
          speaker: narrator
          text: >-
            She took him into a smaller chamber that seemed to have no other door. They talked for a while. Then she suddenly stood up.
        - id: ch02-b17
          speaker: rich_lady
          text: >-
            Stay here. I will be back in a moment.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Alnaschar waited. But instead of the lady, a huge armed slave came in carrying a sword. He strode toward my brother with fury on his face.
        - id: ch02-b19
          speaker: black_slave
          text: >-
            What are you doing here?
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: >-
            The man's terrible voice and manner frightened Alnaschar so completely that he had no strength to answer. He let the man take his purse of gold and make several cuts across his body with the sword. My brother offered no resistance. As soon as the man let go, Alnaschar sank to the floor. He could not move, though he remained fully aware of what was happening.
        - id: ch02-b21
          speaker: narrator
          text: >-
            The armed slave believed Alnaschar was dead and ordered the Greek servant to bring salt. The two of them rubbed it deep into his wounds. The pain was terrible, but my brother had enough presence of mind not to move or make a sound. When they had gone, the old woman took their place. She dragged him across the floor to a trapdoor, opened it, and threw him down into a vault already filled with the bodies of murdered men.
        - id: ch02-b22
          speaker: narrator
          text: >-
            The violence of the fall knocked him unconscious at first. Yet the burning salt in his wounds had kept him alive, and little by little his strength returned. At the end of two days, he managed to raise the trapdoor during the night. He hid in the courtyard until daybreak, when he saw the old woman leave the house to search for more prey. By good fortune she never noticed him. Once she was out of sight, he slipped away from that nest of killers and took shelter in my house.
    - id: ch03
      title: Alnaschar's Revenge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            I dressed his wounds and cared for him faithfully. After a month, he was completely well again. From then on, he thought of nothing but revenge on the wicked old woman. He had a purse made large enough to hold five hundred gold pieces, but filled it with bits of glass instead. He tied it around his waist with a sash, disguised himself as an old woman, and hid a sword beneath his clothes.
        - id: ch03-b02
          speaker: narrator
          text: >-
            One morning he hobbled through the streets and found his old enemy searching for someone else to deceive. He approached her and copied an old woman's voice.
        - id: ch03-b03
          speaker: alnaschar
          text: >-
            Could you lend me a pair of scales? I have just arrived from Persia with five hundred gold pieces, and I want to make sure they have the right weight.
        - id: ch03-b04
          speaker: old_woman
          text: >-
            Good woman, you could not have found anyone better. My son changes money. Come with me, and he will weigh the coins himself. We must hurry, though, or he will already have left for his shop.
        - id: ch03-b05
          speaker: narrator
          text: >-
            With that, she led him straight back to the same large house. The same young Greek servant opened the door. Once more, my brother was taken inside and left waiting alone in the hall. Before long, the old woman's supposed son appeared. It was the very same armed slave who had robbed and wounded him.
        - id: ch03-b06
          speaker: black_slave
          text: >-
            Get up, you miserable old woman, and follow me.
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: >-
            The man turned and started toward the room where the murders were done. Alnaschar rose behind him, drew the sword from beneath his disguise, and struck him across the neck. The blow cut the man's head from his body. My brother picked up the head with one hand, dragged the body with the other, and carried both to the vault. He threw in the body and sent the head after it.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The Greek servant thought everything had happened in the usual way. Soon she arrived carrying the basin of salt. But when she saw Alnaschar alive with the sword in his hand, she let the basin fall and turned to flee. My brother was too quick for her. Before she could escape, her head was rolling away from her body.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The noise brought the old woman running. Before she could escape, Alnaschar seized her.
        - id: ch03-b10
          speaker: alnaschar
          text: >-
            You wretch! Do you know who I am?
          emotion: angry
        - id: ch03-b11
          speaker: old_woman
          text: >-
            Who are you, my lord? I have never seen you before.
          emotion: fearful
        - id: ch03-b12
          speaker: alnaschar
          text: >-
            I am the man whose house you entered so you could pretend to pray. Do you remember me now?
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: >-
            She fell to her knees and begged for mercy, but he cut her into four pieces.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Only the lady remained, and she knew nothing of what had happened around her. Alnaschar searched through the house until he found her. The sight of him nearly made her faint with terror. She pleaded desperately for her life. My brother was generous enough to spare her, but he demanded to know how she had become the partner of the horrible people he had just killed.
        - id: ch03-b15
          speaker: rich_lady
          text: >-
            I was once married to an honest merchant. I did not know how wicked that old woman was, and she sometimes visited me. One day she told me there was a grand wedding at her house. She said I would enjoy myself if I honored them by attending.
        - id: ch03-b16
          speaker: rich_lady
          text: >-
            I let her persuade me. I put on my richest dress and brought a purse with one hundred gold pieces. But once I entered this house, that dreadful man kept me here by force. I have been a prisoner for three years, and every one of them has been filled with grief.
          emotion: sad
        - id: ch03-b17
          speaker: alnaschar
          text: >-
            That horrible man must have gathered a great fortune.
        - id: ch03-b18
          speaker: rich_lady
          text: >-
            He gathered so much that carrying it all away would make you rich forever. Come. I will show you how much there is.
        - id: ch03-b19
          speaker: narrator
          text: >-
            She took him into a room full of chests packed with gold. Alnaschar could not hide his wonder as he stared at them.
        - id: ch03-b20
          speaker: rich_lady
          text: >-
            Go and find men to carry these chests away.
        - id: ch03-b21
          speaker: narrator
          text: >-
            My brother did not wait to be asked twice. He hurried into the streets and quickly gathered ten men to help him. But when they returned, the front door stood open. Inside, the room that had held all the chests of gold was completely empty. The lady had proved cleverer than Alnaschar and had made excellent use of the time he was away. He tried to console himself by removing all the beautiful furniture instead. Its value was more than enough to repay the five hundred gold pieces he had lost.
    - id: ch04
      title: The Judge's Promise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Unfortunately, Alnaschar forgot to lock the door when he left the house. The neighbors found the place standing open and empty, so they informed the police. The next morning, officers arrested my brother as a thief. He offered them money to release him, but they would not even listen. They tied his hands and forced him to walk between them all the way to the judge.
        - id: ch04-b02
          speaker: narrator
          text: >-
            After the officers explained the complaint, the judge asked Alnaschar where he had found all the furniture carried to his home the day before.
        - id: ch04-b03
          speaker: alnaschar
          text: >-
            Sir, I will tell you everything, but first give me your word that I will not be punished.
        - id: ch04-b04
          speaker: judge
          text: >-
            You have my promise.
        - id: ch04-b05
          speaker: narrator
          text: >-
            My brother began at the beginning. He described every adventure and told how he had taken revenge on the people who betrayed him. Then he begged the judge to let him keep at least some of the furniture, to repay the five hundred gold pieces that had been stolen.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The judge would say nothing about letting Alnaschar keep any part of it. Instead, he lost no time in sending men to collect every piece my brother had removed from the house. Once all that furniture had been carried beneath the judge's own roof, he ordered Alnaschar to leave the city and never enter it again on pain of death. The judge feared that if my brother remained, he might go to the Caliph and demand justice.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Alnaschar obeyed and set off for a neighboring city. On the road he met a band of robbers. They took his clothes and left him naked beside the road.
        - id: ch04-b08
          speaker: narrator
          text: >-
            When news of his plight reached me, I hurried after him. I did what I could to comfort him after all his misfortunes and dressed him in my finest robe. Then I disguised him and brought him back to my house under cover of night. He has lived there ever since, receiving the same care that I give to each of my other brothers.
