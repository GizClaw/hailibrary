audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    caliph:
      display_name: The Caliph
      tts:
        delivery: amused, authoritative, and decisive
        timbre: resonant and polished
        pace: measured
        pitch: low
    baba_abdalla:
      display_name: Baba-Abdalla
      tts:
        delivery: humble, insistent, and burdened by remorse
        timbre: aged and rough
        pace: unhurried
        pitch: low
    dervish:
      display_name: The Dervish
      tts:
        delivery: patient, perceptive, and quietly grave
        timbre: dry and steady
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Secret Treasure
      blocks:
        - id: ch01-b01
          speaker: baba_abdalla
          text: >-
            Commander of the Faithful, I was born in Bagdad. My parents died within a few days of each other while I was still a very young man, and they left me a small fortune. I worked day and night to increase it. In time, I owned eighty camels. I hired them out to travelling merchants, often went with them on their journeys, and always came home with a good profit.
        - id: ch01-b02
          speaker: baba_abdalla
          text: >-
            One day, I was returning from Balsora after carrying goods that were bound for India. At noon, I stopped in a lonely place where my camels could find rich pasture. I was resting beneath a tree when a dervish came along on foot, heading toward Balsora. He sat beside me. We asked where each other had come from and where we were going, and we soon became friendly. Then we brought out our food and ate together.
        - id: ch01-b03
          speaker: baba_abdalla
          text: >-
            As we ate, the dervish told me of a treasure hidden only a little way from where we sat. It was so vast, he said, that even if all my eighty camels carried as much as they could bear, the hiding place would still seem untouched.
        - id: ch01-b04
          speaker: baba_abdalla
          text: >-
            Joy and greed nearly drove me out of my senses. I threw my arms around the dervish's neck.
        - id: ch01-b05
          speaker: baba_abdalla
          text: >-
            Good dervish, the riches of this world mean nothing to you. What use can this secret be when you are alone and on foot? You could carry away only a handful. Show me the place. I will load all eighty camels, and I will give you one of them to thank you.
        - id: ch01-b06
          speaker: baba_abdalla
          text: >-
            That offer may not sound generous. Yet it seemed generous to me. Covetousness had swept over my heart so completely that even the seventy-nine camels I meant to keep felt like too little.
        - id: ch01-b07
          speaker: baba_abdalla
          text: >-
            The dervish understood exactly what was in my mind, though he gave no sign of what he thought.
        - id: ch01-b08
          speaker: dervish
          text: >-
            My brother, you know that your offer is unjust. I could have kept the secret and saved the treasure for myself. By telling you it exists, I showed that I trusted you. I hoped to make both our fortunes and earn your lasting gratitude. Before I reveal the place, swear that when the camels are fully loaded, you will give me half and then let us go our separate ways. That is fair. I may receive forty camels from you, but I will give you the means to buy a thousand more.
        - id: ch01-b09
          speaker: baba_abdalla
          text: >-
            I could not deny that his terms were reasonable. Even so, I could not bear the thought of the dervish becoming as rich as I was. I knew there was no use arguing with him. Either I accepted his conditions, or I lost the treasure and spent the rest of my life grieving over the fortune I might have had. So I gave him my word.
        - id: ch01-b10
          speaker: baba_abdalla
          text: >-
            I gathered my camels, and the dervish led us away. After some time, we reached a place like a valley. Its entrance was so narrow that the camels had to pass through one at a time. Two mountains enclosed the open ground, and their straight cliffs were too steep for any person to climb.
        - id: ch01-b11
          speaker: baba_abdalla
          text: >-
            When we stood exactly between the mountains, the dervish stopped.
        - id: ch01-b12
          speaker: dervish
          text: >-
            Make the camels lie down here, where we can load them easily. Then we will go to the treasure.
        - id: ch01-b13
          speaker: baba_abdalla
          text: >-
            I obeyed and returned to find him lighting a fire with dry wood. Once it caught, he cast a handful of perfume onto the flames and spoke words I could not understand. At once, a thick column of smoke rose high into the air. He divided it into two columns. Then a rock that stood like a pillar between the mountains slowly opened, and inside it appeared a magnificent palace.
    - id: ch02
      title: The Palace in the Rock
      blocks:
        - id: ch02-b01
          speaker: baba_abdalla
          text: >-
            Commander of the Faithful, by then gold had taken such command of my heart that I did not even pause to look over the riches. I rushed to the first heap of gold I could reach and began filling a sack I had brought.
        - id: ch02-b02
          speaker: baba_abdalla
          text: >-
            The dervish began gathering treasure too, but I soon noticed that he chose only precious stones. I decided it would be wise to do the same. At last, we had loaded the camels with all they could carry. Only one thing remained. We had to close the hiding place and leave.
        - id: ch02-b03
          speaker: baba_abdalla
          text: >-
            Before closing it, the dervish walked to a great golden vase covered in beautiful designs. From it, he took a small wooden box and slipped it inside his robe. He told me only that it held a special ointment. Then he lit the fire again, added the perfume, and murmured the strange spell. The rock closed and became whole once more.
        - id: ch02-b04
          speaker: baba_abdalla
          text: >-
            Next, we divided the loaded camels, forty for him and forty for me. Each of us took charge of his own group, and we marched out of the valley together. We stayed on the same road until we reached the place where the two routes divided. The dervish would go toward Balsora, while I would return to Bagdad. We embraced warmly. I poured out my thanks for the honour he had done me by choosing me to share in such wealth. Then we said a hearty farewell, turned our backs on each other, and hurried after our camels.
        - id: ch02-b05
          speaker: baba_abdalla
          text: >-
            I had barely caught up with my forty when envy filled my soul. I thought, what need has a dervish for riches like these? He knows the treasure's secret and can return for more whenever he pleases. I stopped my camels beside the road and ran after him.
        - id: ch02-b06
          speaker: baba_abdalla
          text: >-
            I ran quickly and soon reached him. As soon as I had breath enough to speak, I called out.
        - id: ch02-b07
          speaker: baba_abdalla
          text: >-
            My brother, just after we parted, something occurred to me that perhaps you have not considered. You are a dervish. You live quietly, care only about doing good, and give no thought to worldly things. You cannot know what a burden all this wealth will be. Besides, anyone who has not handled camels from childhood will struggle with these stubborn creatures. Take my advice. Keep no more than thirty. Even those will give you trouble enough.
        - id: ch02-b08
          speaker: dervish
          text: >-
            You are right. I admit I had not considered that. Choose any ten you wish and drive them ahead of you.
        - id: ch02-b09
          speaker: baba_abdalla
          text: >-
            He understood me perfectly, but he did not want a quarrel. I chose ten of the finest camels, and we started down the road to join the forty I had left behind. I had gained what I wanted. Still, the dervish had yielded so easily that I regretted not asking for ten more. I looked back. He had gone only a few paces, so I called to him again.
        - id: ch02-b10
          speaker: baba_abdalla
          text: >-
            My brother, I cannot leave without warning you of one more thing. Keeping thirty camels together takes years of experience. For your own good, you would be happier if you trusted me with ten more. With my practice, driving two camels or a hundred makes no difference.
        - id: ch02-b11
          speaker: baba_abdalla
          text: >-
            Once again, the dervish raised no objection. I drove away ten more camels in triumph and left him with twenty. I now owned sixty. Anyone would think that should have satisfied me.
        - id: ch02-b12
          speaker: baba_abdalla
          text: >-
            But, Commander of the Faithful, the more a person has, the more he wants. That was true of me. Sixty camels did not satisfy me. I could not rest while the dervish still had even one. I returned to him yet again. This time, I doubled all my efforts. I begged and pleaded, embraced him again and again, and promised him endless gratitude. I kept on until all his remaining twenty camels were in my hands and every one of the eighty belonged to me once more.
        - id: ch02-b13
          speaker: dervish
          text: >-
            Make good use of them, my brother. Remember, riches sometimes grow wings when we keep them all for ourselves. The poor wait at our gates so that we may help them.
        - id: ch02-b14
          speaker: baba_abdalla
          text: >-
            Gold had blinded my eyes. I gave no thought to his wise advice about wealth taking flight or helping the poor. Though I had recovered all eighty camels and gained their loads of treasure besides, I only looked around for something else I might take from him.
    - id: ch03
      title: The Ointment
      blocks:
        - id: ch03-b01
          speaker: baba_abdalla
          text: >-
            Then I remembered the little box inside the dervish's robe. I imagined its ointment must be worth more than all the treasure. I embraced him one last time and tried to sound careless.
        - id: ch03-b02
          speaker: baba_abdalla
          text: >-
            What will you do with that little box of ointment? It hardly seems worth carrying. You may as well give it to me. After all, a dervish who has turned away from the world has no need for ointment.
        - id: ch03-b03
          speaker: baba_abdalla
          text: >-
            If only he had refused me. Yet my madness was so great that, if he had refused, I would have taken it by force. Instead, he offered it to me at once.
        - id: ch03-b04
          speaker: dervish
          text: >-
            Take it, my friend. If there is anything more I can do to make you happy, you need only ask.
        - id: ch03-b05
          speaker: baba_abdalla
          text: >-
            The moment I held the box, I tore off its cover.
        - id: ch03-b06
          speaker: baba_abdalla
          text: >-
            Since you are so kind, please tell me what this ointment can do.
        - id: ch03-b07
          speaker: dervish
          text: >-
            Its powers are most unusual. Touch a little to your left eye, and at once you will see every treasure hidden deep within the earth. But take care. If it touches your right eye, you will lose your sight forever.
        - id: ch03-b08
          speaker: baba_abdalla
          text: >-
            My curiosity burned hotter than ever.
        - id: ch03-b09
          speaker: baba_abdalla
          text: >-
            Try it on me, I beg you. You will do it better than I could. I cannot wait another moment to test its magic.
        - id: ch03-b10
          speaker: baba_abdalla
          text: >-
            I held out the box, and the dervish took it from me. He told me to close my left eye, then gently touched the eyelid with the ointment. When I opened it again, treasures of every kind appeared spread before me. There were more than I could count, all hidden beneath the earth. Yet to see them, I had to keep my right eye tightly closed. Holding it shut soon became tiring, and that discomfort gave me one more excuse to demand what I wanted. I begged the dervish to put the ointment on my right eye too.
        - id: ch03-b11
          speaker: dervish
          text: >-
            If you insist, I will do it. But remember my warning. The moment this ointment touches your right eye, you will be blind.
        - id: ch03-b12
          speaker: baba_abdalla
          text: >-
            Again and again, the dervish had proved that he spoke the truth. Yet I convinced myself that he was hiding some greater power of the ointment from me. I would not listen.
        - id: ch03-b13
          speaker: baba_abdalla
          text: >-
            My brother, you must be joking. The same ointment cannot possibly have two completely opposite effects.
        - id: ch03-b14
          speaker: dervish
          text: >-
            It is true, whether it seems possible or not. You would do well to believe me.
        - id: ch03-b15
          speaker: baba_abdalla
          text: >-
            Still I refused to believe him. Greed had dazzled me. In my mind, the dervish's warning could only mean that he wanted to keep the ointment's greatest secret for himself. I reasoned that if my left eye could reveal hidden riches, perhaps my right eye would show me how to take possession of them. I pressed him again and again to anoint it, but he would not agree.
        - id: ch03-b16
          speaker: dervish
          text: >-
            I have already done so much for you. I cannot willingly do you this terrible harm. Think what it means to be blind. Do not force me to do something you will regret for the rest of your life.
        - id: ch03-b17
          speaker: baba_abdalla
          text: >-
            Nothing could stop me.
        - id: ch03-b18
          speaker: baba_abdalla
          text: >-
            My brother, say no more. Do as I ask. Until now, you have granted every wish with great generosity. Do not spoil my memory of you over such a small matter. Whatever happens, I accept it. I will never blame you.
        - id: ch03-b19
          speaker: dervish
          text: >-
            Since you are determined, there is nothing more to say.
          emotion: sad
        - id: ch03-b20
          speaker: baba_abdalla
          text: >-
            He answered with a sigh, took the ointment, and spread a little over my tightly closed right eye. I tried to open it. Instead of treasures, heavy clouds of darkness rolled before me. I could see nothing with either eye. In that instant, I became as blind as you see me now.
    - id: ch04
      title: Blindness and Loss
      blocks:
        - id: ch04-b01
          speaker: baba_abdalla
          text: >-
            Miserable dervish! So your warning was true after all. My hunger for gold has thrown me into a bottomless pit. Only now, when my eyes are closed, do I truly see. Every misery I suffer is my own doing. But, good brother, you are kind, charitable, and learned in so many secrets. Do you know no remedy that can restore my sight?
          emotion: sad
        - id: ch04-b02
          speaker: dervish
          text: >-
            Unhappy man, what happened is not my fault. It is a just punishment. The blindness in your heart has brought blindness upon your body. You have seen that I know many secrets, but I know none that can restore your sight. You proved unworthy of the riches placed in your hands. They have passed to me now, and from me they will pass to people less greedy and ungrateful than you.
        - id: ch04-b03
          speaker: baba_abdalla
          text: >-
            The dervish said nothing more. Shame and confusion left me unable to speak. I was so miserable that I stood rooted to the spot in that lonely place, while he gathered every one of the eighty camels. With all the treasure and all my former wealth under his command, he set off toward Balsora.
        - id: ch04-b04
          speaker: baba_abdalla
          text: >-
            I begged him not to abandon me. If he would not stay, I pleaded, he could at least lead me to a place where the first passing caravan might find me. He paid no attention to my prayers and cries. Left alone and blind on that track, I would soon have died from hunger and misery. But on the following day, some merchants came that way. They heard me, took pity on my condition, and kindly brought me all the way back to Bagdad.
        - id: ch04-b05
          speaker: baba_abdalla
          text: >-
            In a single moment, I fell from riches into beggary. From that day until now, I have lived only on the alms others give me. To pay for the greed that ruined me, I require every passerby to strike me once.
        - id: ch04-b06
          speaker: baba_abdalla
          text: >-
            Commander of the Faithful, that is my story.
    - id: ch05
      title: The Caliph's Judgment
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When the blind man had finished, the Caliph spoke to him.
        - id: ch05-b02
          speaker: caliph
          text: >-
            Baba-Abdalla, your sin was indeed great, but you have suffered enough. From now on, repent in private. I will see that you receive enough money each day to meet all your needs.
        - id: ch05-b03
          speaker: narrator
          text: >-
            At those words, Baba-Abdalla threw himself at the Caliph's feet.
        - id: ch05-b04
          speaker: baba_abdalla
          text: >-
            May honour and happiness be yours forever, Commander of the Faithful.
