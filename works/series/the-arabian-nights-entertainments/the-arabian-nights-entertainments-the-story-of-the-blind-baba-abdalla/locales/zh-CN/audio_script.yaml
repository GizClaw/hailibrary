audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    caliph:
      display_name: 哈伦·拉希德
      tts:
        delivery: 威严果断，言谈中带着敏锐的好奇
        timbre: 洪亮圆润
        pace: 从容
        pitch: 中低音
    baba_abdalla:
      display_name: 巴巴·阿卜杜拉
      tts:
        delivery: 谦卑执拗，声音里压着深重悔恨
        timbre: 苍老粗哑
        pace: 缓慢
        pitch: 低音
    dervish:
      display_name: 德尔维希
      tts:
        delivery: 平静克制，劝诫时庄重而坚定
        timbre: 清朗沉稳
        pace: 不疾不徐
        pitch: 中低音
  chapters:
    - id: ch01
      title: 荒野中的秘密
      blocks:
        - id: ch01-b01
          speaker: baba_abdalla
          text: |-
            信士的统帅，臣生在巴格达。臣还很年轻的时候，父母就在短短几天里相继去世，留下一小笔财产。臣成了孤儿，只好日夜辛劳，想办法让这点钱慢慢增加。

            后来，臣有了八十峰骆驼。臣把它们租给往来的商人，也常陪商队四处远行。每次回到巴格达，臣总能赚回一笔可观的利润。
        - id: ch01-b02
          speaker: baba_abdalla
          text: |-
            有一天，臣从巴士拉回来。臣刚把一批预备运往印度的货送到那里。中午，我们停在一处荒僻的地方，那里水草丰美，正适合让骆驼歇息吃草。臣也坐到一棵树的阴影下歇脚。这时，一名德尔维希徒步走来，他正要前往巴士拉。

            他在臣身边坐下，臣便问他从哪里来，要到哪里去。我们很快熟络起来，问过旅人相逢时常问的那些话，又各自拿出食物，一起吃到填饱肚子。
        - id: ch01-b03
          speaker: baba_abdalla
          text: 吃饭时，德尔维希随口告诉臣，离这里不远的地方藏着一座大宝库。即便把臣的八十峰骆驼全都装满，装到一件东西也驮不动，宝库里仍会像没人碰过一样满。
        - id: ch01-b04
          speaker: baba_abdalla
          text: |-
            臣一听，又欢喜又贪心，差点失去理智。臣搂住他的脖子，急忙求他。

            善良的德尔维希，世上的财富对你没有什么用。你一个人徒步赶路，就算找到宝库，也不过能拿走一捧。你若带我去，我就把八十峰骆驼装满，再送你一峰，算是谢礼。
        - id: ch01-b05
          speaker: baba_abdalla
          text: 如今回头听，这份谢礼当然少得可怜。可当时，贪欲一下淹没了臣的心。臣竟觉得送出一峰骆驼已经十分慷慨，仿佛余下的七十九峰也根本不值一提。
        - id: ch01-b06
          speaker: narrator
          text: 德尔维希看透了巴巴·阿卜杜拉的心思，却没有露出自己对这个提议的看法。他只是平静地回答。
        - id: ch01-b07
          speaker: dervish
          text: |-
            兄弟，你也知道，这样分并不公平。我本可以守住秘密，独自留下宝藏。如今我愿意告诉你，是因为我信任你，也想让我们两个人一起富起来，换得你长久的感激。

            不过，在我说出宝库的位置以前，你必须先发誓。等八十峰骆驼全都装满，我们一人一半，再各走各的路。你给我四十峰骆驼，我却让你得到足以再买一千峰的财富，这难道还不公平吗？
        - id: ch01-b08
          speaker: baba_abdalla
          text: |-
            臣无法否认，他的话十分公道。可是，一想到这个德尔维希会变得和臣一样富有，臣就难受得无法忍耐。偏偏臣又没有讨价还价的余地。要是不答应，这份巨富便会从臣手边溜走，臣也会为此抱憾终身。

            臣只得收拢骆驼，跟着他上路。走了一阵，我们来到一处小山谷。谷口窄得只能让骆驼一峰一峰通过，两旁全是笔直的悬崖，任谁也爬不上去。
        - id: ch01-b09
          speaker: baba_abdalla
          text: 到了两山正中，德尔维希忽然停下。
        - id: ch01-b10
          speaker: dervish
          text: 让骆驼全卧在这片空地上吧。这样装东西方便些，然后我们就去宝库。
        - id: ch01-b11
          speaker: baba_abdalla
          text: |-
            臣照他说的做了，再回到他身边。他正在用几根枯枝生火。火刚点着，他就撒进去一把香料，又念了几句臣听不懂的话。一股浓烟立刻直冲天空。他把烟分成两股，夹在两山之间的一块巨石便慢慢打开了。

            那块石头像一根巨大的柱子。等它打开，里面竟露出一座金碧辉煌的宫殿。
    - id: ch02
      title: 八十峰骆驼
      blocks:
        - id: ch02-b01
          speaker: baba_abdalla
          text: |-
            信士的统帅，那时臣满心只有黄金，根本顾不上好好看看宫殿里的珍宝。臣扑向最近的一堆金币，拿出随身的袋子就往里装。

            德尔维希也开始收取财宝。臣很快发现，他只挑宝石，便认定跟着他做才聪明，也改去拣宝石。最后，八十峰骆驼全都驮满了，我们只要把宝库重新封好，就能离开。
        - id: ch02-b02
          speaker: baba_abdalla
          text: |-
            封宝库以前，德尔维希走到一只雕刻精美的大金瓶前，从里面取出一只小木匣，藏进胸前。他只说，里面装着一种特别的药膏。

            接着，他重新点火，撒进香料，又低声念起那道咒语。巨石随即合上，恢复得完完整整，再也看不出里面藏着一座宫殿。
        - id: ch02-b03
          speaker: baba_abdalla
          text: |-
            我们把骆驼分成两队，让它们驮稳财宝，各自领着四十峰走出山谷。我们一路走到大路分岔的地方。他要往巴士拉，臣要回巴格达，我们就在这里道别。

            我们亲热地拥抱。臣一再感谢他，感谢他把这样的荣耀给了臣，单单选中臣来分享如此巨大的财富。我们诚心诚意地互道珍重，这才各自转身，匆匆追赶自己的骆驼。
        - id: ch02-b04
          speaker: baba_abdalla
          text: |-
            可臣还没赶上自己的驼队，妒忌就钻进了心里。臣暗想，一个德尔维希要这么多财富做什么？宝库的秘密只有他知道，往后想拿多少，随时都能再去。

            臣把自己的骆驼停在路旁，转身追了回去。臣跑得快，没多久就追上他。气还没喘匀，臣便开始劝说。
        - id: ch02-b05
          speaker: baba_abdalla
          text: |-
            兄弟，我们刚刚分手，我忽然想到一件事。你过的是清静日子，一心行善，从不在乎世间的财物。可你恐怕还不知道，带着这么多财富会给自己添多大的负担。

            再说了，若不是从小就跟骆驼打交道，谁也管不住这些倔牲口。你最好只留下三十峰，就算三十峰也够你操心了。
        - id: ch02-b06
          speaker: narrator
          text: 德尔维希完全明白他的心思，只是不想争执。
        - id: ch02-b07
          speaker: dervish
          text: 你说得对，我先前确实没有想到。随你挑十峰，领走吧。
        - id: ch02-b08
          speaker: baba_abdalla
          text: |-
            臣挑走十峰最好的骆驼，赶着它们往回走。明明已经如愿，臣却见他这么好说话，反倒后悔没有多要十峰。臣回头一看，他才走出几步，就又把他叫住。

            臣说，兄弟，我不能什么也不提醒就同你分开。三十峰骆驼聚在一起，只有经验老到的人才能管得住。你再交十峰给我，自己会轻松许多。至于我，凭这些年的本事，赶两峰和赶一百峰都一样。
        - id: ch02-b09
          speaker: baba_abdalla
          text: |-
            德尔维希还是没有为难臣。臣得意地又领走十峰，只给他剩下二十峰。此时臣已有六十峰骆驼，谁都会以为臣该满足了。

            可信士的统帅，有得越多，想要的也就越多。只要德尔维希手中还留着一峰，臣就不得安宁。臣再次回去，一遍遍求他，不住地拥抱他，还答应永远感激他。最后，那二十峰也全到了臣手里。
        - id: ch02-b10
          speaker: dervish
          text: 兄弟，好好使用这些骆驼。记住，财富若只留给自己，有时会长出翅膀飞走。穷人来到我们的门前，正是等着我们伸手相助。
    - id: ch03
      title: 木匣里的药膏
      blocks:
        - id: ch03-b01
          speaker: baba_abdalla
          text: |-
            黄金早已蒙住臣的双眼，臣根本听不进这番劝告，还在四处寻找有什么东西可以夺走。这时，臣想起了那只小木匣。臣猜，匣子里藏着的宝物，也许比所有金银和宝石都珍贵。

            臣最后拥抱他一次，装作随口问起那匣药膏。
        - id: ch03-b02
          speaker: baba_abdalla
          text: 你带着这么小一匣药膏做什么？这点东西不值得一路拿着，不如也给我吧。你既然已经离开尘世，一个德尔维希哪里还用得着药膏？
        - id: ch03-b03
          speaker: baba_abdalla
          text: |-
            唉，他当时若能拒绝臣就好了！可臣已经被贪念逼疯。就算他不肯，臣大概也会动手强抢。

            他偏偏没有拒绝，马上把木匣递了过来。
        - id: ch03-b04
          speaker: dervish
          text: 拿去吧，朋友。要是还有什么能让你高兴，也只管告诉我。
        - id: ch03-b05
          speaker: baba_abdalla
          text: 木匣刚到手，臣便猛地揭开盖子，又追问他，这药膏到底有什么奇妙的用处。
        - id: ch03-b06
          speaker: dervish
          text: 它的效用确实又奇妙又有趣。只要在左眼抹上一点，你立刻就能看到埋在大地深处的所有宝藏。不过千万当心，绝不能让药膏碰到右眼，不然你会永远失明。
        - id: ch03-b07
          speaker: baba_abdalla
          text: |-
            这番话让臣越发好奇。臣把木匣递回去，急着求他亲手替臣试一试。臣说，他一定比臣更会使用这种药，臣已经等不及要看看它的魔力了。

            德尔维希接过木匣，让臣闭上左眼，轻轻抹上一点药膏。臣再次睁眼时，数不清的各色宝藏仿佛全铺在了面前。
        - id: ch03-b08
          speaker: baba_abdalla
          text: 可要看清那些宝藏，臣就得一直闭着右眼。这样实在累人，臣便请他也给右眼抹上药膏。
        - id: ch03-b09
          speaker: dervish
          text: 你要是一定坚持，我可以照办。可别忘了我刚才的警告。药膏一碰右眼，你马上就会瞎。
        - id: ch03-b10
          speaker: baba_abdalla
          text: |-
            他说过那么多真话，臣也一次次亲眼证实，可这一回，臣偏认定他藏起了药膏最珍贵的秘密。臣把他所有的警告都当成耳旁风，怎么劝也不肯听。

            臣笑着对他说，兄弟，你一定是在开玩笑。同一种药膏，怎么会有两种完全相反的效用？
        - id: ch03-b11
          speaker: dervish
          text: 可事实就是这样。你要是肯信我的话，才是真正对自己好。
        - id: ch03-b12
          speaker: baba_abdalla
          text: |-
            臣还是不信。贪欲晃花了臣的心眼。臣想，左眼既然能看见财富，右眼也许就能告诉臣，怎样才能把这些财富全弄到手。

            臣不停催促德尔维希，让他给右眼抹药。他却始终不肯。
    - id: ch04
      title: 黑暗降临
      blocks:
        - id: ch04-b01
          speaker: dervish
          text: 我已经给了你这么多好处，实在不愿亲手再给你招来灾祸。好好想想双眼失明是什么滋味。别逼我做一件让你后悔一辈子的事。
        - id: ch04-b02
          speaker: baba_abdalla
          text: |-
            可他说什么都没有用。臣斩钉截铁地告诉他，兄弟，不必再劝了，只管照我的要求做。直到现在，我的愿望你都慷慨地成全了。不要为了这么一件小事，坏了我对你的感激。

            无论出了什么事，后果都由我自己承担，我永远不会责怪你。
        - id: ch04-b03
          speaker: dervish
          text: 既然你已经下定决心，再说什么也没有用了。
        - id: ch04-b04
          speaker: baba_abdalla
          text: |-
            他叹了一口气，拿起药膏，抹在臣紧闭的右眼上。臣试着睁眼，面前却只有沉重的黑云，一层层翻涌而来。臣就这样瞎了，正像陛下现在看见的一样！

            臣尖声大叫，原来这一切都是真的！臣贪恋黄金，竟把自己推进这样一座没有底的深渊。双眼闭上以后，臣的心眼反倒真正睁开了。臣这才知道，所有苦难都是自己一手招来的。
        - id: ch04-b05
          speaker: baba_abdalla
          text: 可臣还是求他。善良的兄弟，你这样仁慈，又懂得那么多深奥的秘密，难道没有什么办法，能让臣重新看见吗？
          emotion: sad
        - id: ch04-b06
          speaker: dervish
          text: |-
            不幸的人，你遭遇这些，并不是我的过错，而是你应受的惩罚。你的心先瞎了，现在双眼也跟着失明。

            我确实知道一些秘密。我们相识虽然不久，你也已经见识过了。可是，我没有任何能让你恢复视力的秘法。你已经证明，自己配不上得到的财富。如今它们到了我手中，还会从我手中流向别人。那些人不会像你这样贪婪，也不会这样忘恩负义。
        - id: ch04-b07
          speaker: baba_abdalla
          text: |-
            德尔维希说完便走了。臣羞愧得说不出话，又慌乱又绝望，只能僵在原地，一步也动不了。他收拢八十峰骆驼，赶着它们往巴士拉去了。

            臣苦苦哀求他，别把臣一个人留在那里。就算不肯带臣同行，也请把臣领到过往商队容易发现的地方。可臣怎样呼喊，他都不理。第二天，若不是有几名商人沿路经过，好心把臣带回巴格达，臣很快就会在饥饿和苦难中死去。
    - id: ch05
      title: 哈里发的裁断
      blocks:
        - id: ch05-b01
          speaker: baba_abdalla
          text: |-
            臣在一瞬间从富翁变成乞丐。直到今天，臣都只能靠别人施舍度日。贪婪毁了臣，臣为了赎罪，才要求每一个从身边走过的人都打臣一下。

            信士的统帅，这就是臣的故事。
        - id: ch05-b02
          speaker: narrator
          text: 盲人的故事到这里讲完。哈里发听罢，作出了裁断。
        - id: ch05-b03
          speaker: caliph
          text: 巴巴·阿卜杜拉，你的罪过的确很重，可你受的苦已经够多了。以后只须私下悔过。我会吩咐下去，每天给你足够的钱，让你不愁生活。
        - id: ch05-b04
          speaker: narrator
          text: 巴巴·阿卜杜拉听完，立刻扑倒在哈里发脚下，祝愿陛下永远享有尊荣与幸福。
