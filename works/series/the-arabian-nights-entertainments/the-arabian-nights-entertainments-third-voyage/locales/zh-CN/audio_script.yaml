audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    voyage_captain:
      display_name: 船长
      tts:
        delivery: 老练警觉，面对危险时严肃果断
        timbre: 粗粝浑厚，带着海上生活的风霜感
        pace: 稳健
        pitch: 中低音
    former_captain:
      display_name: 旧船长
      tts:
        delivery: 正直爽朗，谈到旧事时诚恳而略带愧疚
        timbre: 洪亮结实，成熟可靠
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 毛人岛
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            安逸快活的日子没过多久，我就把前两次航行的危险忘光了。那时我正年轻力壮，总觉得还是出去闯荡更有意思。于是，我又置办了一批巴格达最珍奇、最上等的货物，运到巴士拉，和几位熟悉的商人一同出海，驶向遥远的异乡。

            我们沿途停靠过许多港口，做成了一笔又一笔生意，赚得丰厚利润。可有一天，船正在茫茫大海上航行，突然刮起狂风。风连着几日不停，把船吹得完全迷失了方向，最后赶进一座陌生岛屿的港湾。
        - id: ch01-b02
          speaker: voyage_captain
          text: |-
            我宁可把船停在任何地方，也不愿停在这里。这座岛和附近的岛上，全住着浑身长毛的野人。他们一定会来袭击我们。那些矮人无论做什么，大家都不能还手。他们多得像蝗虫，杀掉一个，其余的便会扑上来，很快把我们杀光。
          emotion: fearful
        - id: ch01-b03
          speaker: sindbad
          text: |-
            全船的人听了都很惊恐，而且很快就知道，船长说得一点不假。无数面目可憎的野人从岛上出现。他们还不到两尺高，浑身长着红褐色的毛，一齐跳进海里，围住了我们的船。

            他们叽叽喳喳地说着陌生的话，抓住绳索和舷梯，飞快地爬上船舷，快得简直像在飞。我们又怒又怕，只能眼睁睁看着。谁也不敢阻拦，更说不出一句他们听得懂的话。至于他们究竟想做什么，我们当时还猜不出来。

            那些野人升起帆，砍断锚索，把船开到稍远的一座岛。他们将我们赶上岸，随后夺走船只，回到了他们来的地方。我们被扔在这片所有水手都害怕的海岸上，孤立无援，连一点自救的办法也没有。当时我们还不知道，水手们为什么如此惧怕这里。

            大家凄凄惶惶地往岛内走，路上见到野草和果子，就摘来充饥。明知逃生无望，我们还是想尽量多活一会儿。不久，远处出现一座像华美宫殿的建筑。我们拖着疲惫的脚步走近，才看出那是一座高大坚固的城堡。

            我们推开沉重的乌木大门，穿过庭院。可一走到里面那座大厅的门口，所有人都吓得僵住了。一边堆着高高的白骨，而且全是人的骨头。另一边摆着数不清的烤肉铁签。我们绝望得再也支撑不住，颤抖着倒在地上，一动也不动，谁也说不出话。

            太阳快落山时，一声巨响惊醒了我们。大厅的门被猛地撞开，一个巨人走了进来。他高得像棕榈树，浑身漆黑。额头正中只有一只眼睛，亮得像燃烧的炭火。他的尖牙露在外面，下唇垂到胸口。两只大耳朵盖住肩膀，指甲则像猛禽的利爪。
    - id: ch02
      title: 独眼巨人
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            我们吓得失去知觉，像死人一样躺在那里。醒来时，巨人正用那只独眼打量我们。他走过来，捏住我的后颈，把我提起来翻来覆去地摸了一遍。发觉我只剩皮包骨头，他又把我放下，逐个查看别人。

            最后，他找到了我们当中最肥的船长。巨人一只手将船长抓起来，穿在铁签上，又生起大火，把他烤熟吃掉。吃过晚饭，巨人倒头就睡，鼾声比雷还响。我们却整夜瑟瑟发抖。天一亮，他便起身走了。

            我们确信巨人已经走远，立刻跳起来哀号。绝望的哭喊声在大厅里回荡。明明我们人多，巨人只有一个，可谁也没有想到杀死他。就算当时想到了，对付那样一个怪物也绝不是容易的事。大家商量来商量去，始终想不出逃生的办法，只能听天由命。

            整个白天，我们在岛上漫无目的地来回游荡，只能采食找到的果子。天黑以后，大家仍旧没有发现别的藏身处，只好又回到城堡。巨人在日落时回来，又吃掉一个不幸的伙伴，接着睡下，鼾声响到天明，随后才像前一天那样离开。

            这样的处境太可怕了。几个伙伴宁愿跳下悬崖，马上死在海里，也不愿留下来等着被吃。可是，我已经想到了一个办法，便说给大家听。他们都愿意一试。
        - id: ch02-b02
          speaker: sindbad
          text: |-
            兄弟们，岸边不是有许多漂来的木头吗？我们先扎几只木筏，搬到合适的地方。要是计策成功，就留在岛上等过路的船来救我们。要是失败，立刻乘木筏逃走。木筏虽然不结实，也比留在这里多一分活命的希望。
        - id: ch02-b03
          speaker: sindbad
          text: |-
            大家全都赞成。我们忙了一天，扎好几只木筏，每只能够乘三个人。入夜后，我们再次回到城堡。不久，巨人进来了，又有一个伙伴成了他的晚餐。不过，我们复仇的时候也到了。

            巨人吃饱以后，像往常一样睡下。我听见鼾声响起，便和九个最勇敢的伙伴悄悄站起来。每人拿一根铁签，在火里烧得通红。信号一到，十个人一齐把铁签刺进巨人的独眼，彻底刺瞎了他。

            巨人惨叫着跳起身，双手朝四面乱抓。可我们早已分头逃开，趴在各处角落里，让他的脚碰不到我们。他摸索了好一阵，才找到门，嚎叫着冲了出去。

            我们赶紧逃离城堡，守在木筏旁。原以为太阳升起时，只要看不见巨人，也听不见他渐渐远去的嚎声，就能认定他已经死了。那样，我们不必冒险乘木筏出海，可以继续留在岛上等船。

            谁知晨光一亮，那个巨人又回来了。两个几乎同样高大可怕的巨人一左一右搀扶着他，后面还跟着一大群同类。我们立刻跳上木筏，拼命划向海面。

            巨人们看见猎物正在逃走，抓起巨石，蹚进水里朝我们猛掷。他们投得极准，除了我的木筏，其余木筏全被砸翻，伙伴们尽数溺死。我们连自保都很勉强，根本没有办法救他们。我和筏上的两个同伴用尽力气划桨，才终于逃出巨人的攻击，来到开阔的海上。

            风浪摆布着这只小木筏，把我们抛来荡去，整整过了一昼夜。第二天早晨，附近出现一座岛，我们欢欢喜喜地登了上去。
    - id: ch03
      title: 巨蛇之夜
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            岛上长着美味的果子。我们吃饱以后，便躺在岸边休息。忽然，一阵巨大的沙沙声把大家惊醒。我们跳起来，看见一条巨蛇正从沙地上飞快地滑来。

            巨蛇来得实在太快。一个同伴还没来得及跑，就被它捉住了。任凭他怎样呼喊挣扎，巨蛇仍用粗大的身躯将他紧紧缠住，很快便勒断了他的气，接着把他整个吞了下去。

            我和另一个同伴拼命逃跑，想躲开这场新的灾难。我们看见一棵高树，便从周围的灌木上采了些果子，带着爬了上去。

            到了夜里，我刚刚睡着，那条蛇又来了。它围着树游了一圈又一圈，嘶嘶声十分骇人。最后，它直起身子贴上树干，将睡在我下方的同伴也吞进肚里，随后爬走了。我独自留在树上，吓得只剩半条命。

            太阳升起时，我慢慢爬到地面。两位同伴已经遭到同样的厄运，我几乎不相信自己还能逃过巨蛇的吞噬。可是生命毕竟可贵，只要还有一点可能，我就不能放弃。我决心用尽一切办法自救。

            我发疯似的忙了一整天，收集许多干灌木、芦苇和荆棘，将它们捆成束，围着树一层层堆牢。我在里面做出一个帐篷般的藏身处，像看见猫的老鼠缩进洞里一样，蜷缩在其中。

            那一夜过得有多恐怖，你们一定想象得到。巨蛇果然又来了。它饿得一心要吃掉我，绕着这道脆弱的屏障一圈又一圈地游动，到处寻找入口。我每时每刻都怕它推开一捆树枝，从缺口钻进来。幸好那些柴束始终牢牢连在一起。天亮以后，巨蛇又饿又恼，只得退回巢穴。

            我爬出藏身处时浑身发抖，又被它有毒的气息熏得透不过气。我踉跄着走向海边，觉得与其再过这样一个夜晚，不如跳下悬崖，马上结束性命。

            就在这时，一条船从岛外驶过。我惊喜极了，一面大喊，一面用力挥动头巾。船员终于发现了我。
    - id: ch04
      title: 失而复得的货物
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            船上派来一只小艇，把我救了回去。很快，我已经站在甲板上。惊讶的水手和商人将我团团围住，人人都急着知道，我怎么会独自流落在那座荒岛。我讲完自己的遭遇，他们拿出船上最好的食物款待我。船长见我衣衫破烂，还慷慨地送给我一件自己的外衣。

            船走过许多港口，最后来到盛产檀香木的萨拉哈特岛。大家在这里卸下货物，准备买卖。我站在一旁看着，船长忽然走到我面前。
        - id: ch04-b02
          speaker: former_captain
          text: |-
            兄弟，我这里有些货物，属于一位已经去世的乘客。你能不能帮我拿去交易？将来遇见他的继承人，我好把卖得的钱交给他们。你出了力，自然也该得到一份报酬。
        - id: ch04-b03
          speaker: sindbad
          text: |-
            我不喜欢站在旁边无所事事，便痛快地答应了。船长指给我看那些货包，又叫来专门登记全船货物的管事。那人到了以后，先看了看货物，然后问船长，这批货应该记在谁的名下。
        - id: ch04-b04
          speaker: former_captain
          text: 记在水手辛巴达名下。
        - id: ch04-b05
          speaker: sindbad
          text: |-
            我吃了一惊，仔细打量眼前的人，终于认出他正是第二次航行时那条船的船长。几年不见，他的模样已经变了许多。他以为我早就死了，自然也没能认出我。

            船长，这些货包原来的主人，真的叫辛巴达吗？
        - id: ch04-b06
          speaker: former_captain
          text: |-
            是的。他是巴格达人，从巴士拉登上我的船。有一次，我们在荒岛停靠，给水桶补水，不幸把他落在了岛上。足足过了四个钟头，大家才发现他不见了。那时风已经变大，我们没法回去接他。
        - id: ch04-b07
          speaker: sindbad
          text: 你想他已经死了吗？
        - id: ch04-b08
          speaker: former_captain
          text: 唉，是的。
          emotion: sad
        - id: ch04-b09
          speaker: sindbad
          text: |-
            船长，你仔细看看我！我就是那个在岛上睡着，醒来以后才发现自己被丢下的辛巴达！
          emotion: surprised
        - id: ch04-b10
          speaker: sindbad
          text: |-
            船长惊愕地盯着我，一时间简直不敢相信自己的眼睛。过了一会儿，他终于确信我说的全是真话，也为我能够从那座荒岛死里逃生而十分高兴。
        - id: ch04-b11
          speaker: former_captain
          text: |-
            知道你还活着，我总算不必再为那次疏忽良心不安了。现在把货物拿回去吧，还有我替你赚到的利润。愿你以后事事顺遂。
          emotion: happy
    - id: ch05
      title: 第三次归航
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: |-
            我满怀感激地收下了货物和钱。此后，船从一座岛驶向另一座岛，我也一路做着买卖，陆续买进丁香、肉桂和其他香料。

            在其中一个地方，我还见到一只大得惊人的巨龟，身长足有二十腕尺，宽也足足有二十腕尺。我还亲眼看见一种像牛的鱼，皮厚得可以拿来制作盾牌。另一种鱼无论形状还是颜色，都像骆驼。

            我们就这样渐渐回到巴士拉，我也从那里返回巴格达。带回的钱多得连自己都数不清，此外还有数不胜数的珍宝。我拿出大笔钱财救济穷人，又买下许多土地，添在原有的产业里。我的第三次航行，就这样结束了。
        - id: ch05-b02
          speaker: narrator
          text: |-
            辛巴达讲完这个故事，又送给脚夫欣巴达一百枚金币。欣巴达和其他客人一同告辞。第二天，众人再次聚齐。宴席结束以后，主人便继续讲起自己的冒险经历。
