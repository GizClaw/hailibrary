  chapters:
    - id: ch01
      title: Third Voyage
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            It took very little time for my pleasant, easy life to make me forget the dangers of my first two voyages. I was still in the prime of life, and I longed to be busy again. So I gathered the rarest merchandise I could find in Bagdad, carried it to Balsora, and sailed with merchants I knew toward distant lands.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            We stopped at many ports and earned a handsome profit. Then, while we were far out at sea, a terrible wind caught us. It blew us completely off our course and raged for days. At last it drove our ship into the harbor of an island none of us knew.
        - id: ch01-b03
          speaker: captain
          text: >-
            Of all the places we might have anchored, I wish it had not been here. Hairy savages live on this island and all the islands around it. They are sure to attack us. Whatever those dwarfs do, we must not fight back. They swarm like locusts. Kill even one, and all the others will fall on us and quickly finish us.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            The captain's warning filled the whole company with dread. We soon learned that every word was true. A vast crowd of hideous little people appeared. They stood no more than two feet high, and reddish fur covered their bodies. They threw themselves into the waves and surrounded our ship.
        - id: ch01-b05
          speaker: sindbad
          text: >-
            They chattered in a language we could not understand. Grabbing ropes and gangways, they raced up the side so quickly that they almost seemed to fly. Rage and terror seized us as we watched. We did not dare stop them, and we could not say a word that they would understand.
        - id: ch01-b06
          speaker: sindbad
          text: >-
            Their purpose soon became clear. They raised the sails themselves, cut the anchor cable, and took our ship to another island nearby. There they drove every one of us ashore. Then they seized the vessel and sailed back toward the place they had come from. We were helpless on a coast that every sailor avoided in horror, as we were about to discover for ourselves.
        - id: ch01-b07
          speaker: sindbad
          text: >-
            We turned away from the sea and wandered miserably inland. We found herbs and fruit along the way and ate them. We had no hope of escape, but we meant to stay alive as long as we could. Far off, we saw what looked like a splendid palace, and we dragged ourselves toward it.
        - id: ch01-b08
          speaker: sindbad
          text: >-
            When we reached it, we found a tall, strongly built castle. We pushed open its heavy ebony doors and crossed the courtyard. But at the entrance to the great hall, we stopped cold. On one side lay a huge pile of human bones. On the other stood more roasting spits than we could count.
        - id: ch01-b09
          speaker: sindbad
          text: >-
            Despair overcame us. We sank trembling to the ground and could neither speak nor move. At sunset, a great noise made us look up. The hall door burst open, and a horrible giant came in.
        - id: ch01-b10
          speaker: sindbad
          text: >-
            He was as tall as a palm tree and black from head to foot. One eye burned like a coal in the middle of his forehead. Long, sharp teeth showed in a dreadful grin, and his lower lip hung down over his chest. His ears were like an elephant's and covered his shoulders. His nails curved like the claws of a fierce bird.
        - id: ch01-b11
          speaker: sindbad
          text: >-
            The sight robbed us of our senses, and we lay like dead men. When we came to ourselves, the giant was studying us with that terrible eye. He reached down, caught me by the back of the neck, and turned me from side to side. I was nothing but skin and bone, so he put me down and examined the others in the same way.
        - id: ch01-b12
          speaker: sindbad
          text: >-
            At last he came to our captain, the fattest among us. The giant lifted him in one hand, thrust him onto a spit, and kindled a huge fire. There he roasted him. After his supper, the giant lay down and slept. His snores were louder than thunder, while we shivered in horror through the night. At daybreak he woke, went out, and left us in the castle.
        - id: ch01-b13
          speaker: sindbad
          text: >-
            Once we were sure he had gone, we jumped up and mourned our horrible fate. Our despairing cries rang through the great hall. There were many of us and only one giant, yet none of us thought of killing him. Even if the idea had come to us, bringing down such a creature would have been terribly hard. We talked and searched for some plan, but we could find no way to save ourselves.
        - id: ch01-b14
          speaker: sindbad
          text: >-
            At last we gave ourselves up to our fate. We spent the day roaming the island and eating whatever fruit we could find. We searched everywhere for another shelter but found none, so night brought us back to the castle. At sunset the giant returned. He ate another of our unhappy companions, then slept and snored until dawn before leaving us again.
        - id: ch01-b15
          speaker: sindbad
          text: >-
            Our plight seemed so dreadful that several men wanted to throw themselves from the cliffs and die in the waves instead of waiting for such a miserable end. But I had thought of a way to escape. When I explained it, they all agreed to try.
        - id: ch01-b16
          speaker: sindbad
          text: >-
            Listen, my brothers. You have seen all the driftwood along the shore. Let us build several rafts and carry them to a good launching place. If our plot works, we can wait here until a passing ship rescues us. If it fails, we can rush to the rafts. They may be frail, but they give us a better chance than staying here.
        - id: ch01-b17
          speaker: sindbad
          text: >-
            Everyone agreed. We worked through the day and built rafts that could each carry three men. At nightfall we went back to the castle. The giant soon arrived, and another companion was sacrificed. But now the hour of our revenge had come.
        - id: ch01-b18
          speaker: sindbad
          text: >-
            After his horrible meal, the giant lay down as usual. We waited until his great snores told us he was asleep. Then nine of the boldest men and I rose without a sound. Each of us took one of the roasting spits and held it in the fire until the iron glowed red. At my signal, all ten of us struck together. We drove the burning spits into the giant's single eye and blinded him completely.
        - id: ch01-b19
          speaker: sindbad
          text: >-
            With a terrible cry, he sprang up and grabbed in every direction, trying to catch us. But as soon as we struck, we had scattered across the hall. We lay flat in corners where his feet were unlikely to touch us.
        - id: ch01-b20
          speaker: sindbad
          text: >-
            He searched without success. At last he felt his way to the door and ran out, howling horribly. We hurried from that fatal castle and took our places beside the rafts. His cries still reached us through the darkness, but they grew fainter and fainter.
        - id: ch01-b21
          speaker: sindbad
          text: >-
            We hoped that sunrise would bring no sight or sound of him. If his distant howls stopped and he did not return, we would know he was dead. Then we could remain on the island and wait for a ship instead of trusting our lives to those flimsy rafts. But morning showed him coming straight toward us. Two giants nearly as large and terrible as he was supported him, one on either side, and a crowd of others followed close behind.
        - id: ch01-b22
          speaker: sindbad
          text: >-
            We did not hesitate. We climbed onto the rafts and rowed with all our strength. The giants saw their prey escaping. They picked up enormous rocks, waded into the water, and hurled them after us with deadly aim. Every raft except mine was swamped, and every man aboard them drowned. We could do nothing to help.
        - id: ch01-b23
          speaker: sindbad
          text: >-
            My two companions and I had all we could do to keep our own raft beyond the giants' reach. We rowed hard until we finally reached the open sea. Then the wind and waves took command. They tossed us back and forth for a full day and night. The next morning, we found ourselves near an island and gladly went ashore.
        - id: ch01-b24
          speaker: sindbad
          text: >-
            The island offered us delicious fruit. We ate until our hunger was gone, then lay down to rest on the shore. A sudden, loud rustling woke us. We sprang up and saw an enormous snake sliding over the sand toward us.
        - id: ch01-b25
          speaker: sindbad
          text: >-
            It moved so quickly that one of my companions could not escape. The snake seized him, wrapped him in its mighty coils, and crushed him despite all his cries and struggles. Then it swallowed him.
        - id: ch01-b26
          speaker: sindbad
          text: >-
            My other companion and I ran for our lives, searching for safety from this new horror. We found a tall tree and climbed into its branches. Before we went up, we gathered fruit from the bushes around it so we would have something to eat.
        - id: ch01-b27
          speaker: sindbad
          text: >-
            Night came, and I fell asleep. Once again, the terrible snake woke me. It hissed as it circled the tree, then raised itself against the trunk. My sleeping companion rested on a branch below me. The snake reached him, swallowed him too, and crawled away. I was left half dead with terror.
        - id: ch01-b28
          speaker: sindbad
          text: >-
            At sunrise I crept down. I had little hope of avoiding the fate of my companions. Still, life is sweet, and I resolved to do everything I could to save myself. All day I worked in frantic haste, gathering dry brushwood, reeds, and thorns. I tied them into bundles and stacked them in a firm circle beneath my tree.
        - id: ch01-b29
          speaker: sindbad
          text: >-
            I piled the bundles one upon another until they made a kind of tent. Then I crouched inside like a mouse hiding in its hole when the cat comes near. That night the hungry snake returned, eager to devour me. It glided around and around my frail shelter, hissing and searching for an opening. Every moment I expected it to push some brushwood aside and reach me. But the bundles held firm. When daylight came, the baffled, hungry snake went back to its den.
        - id: ch01-b30
          speaker: sindbad
          text: >-
            I stumbled out more dead than alive. I was shaking with fear and nearly choked by the monster's poisonous breath. I crawled toward the sea, thinking it would be better to throw myself from the cliffs than endure another such night.
        - id: ch01-b31
          speaker: sindbad
          text: >-
            Then, to my joy and relief, I saw a ship sailing past. I shouted wildly and waved my turban until the crew noticed me. They sent a boat, and before long I was safely aboard.
        - id: ch01-b32
          speaker: sindbad
          text: >-
            Wondering sailors and merchants crowded around me. They wanted to know what chance had left me alone on that desolate island. I told them about the hairy people, the one-eyed giant, the rafts, and the snake. Then they gave me the finest food the ship could offer. The captain saw that my clothes were nothing but rags and generously gave me one of his own coats.
        - id: ch01-b33
          speaker: sindbad
          text: >-
            We sailed on for some time and called at many ports. At last we reached Salahat, an island where sandalwood grows in abundance. The ship anchored there. I stood watching as the merchants carried their goods ashore, laid them out, and prepared to sell or exchange them. Then the captain came over to me.
        - id: ch01-b34
          speaker: captain
          text: >-
            Brother, I have some merchandise that belonged to a passenger who died. Would you trade it for me? If I ever meet his heirs, I can give them the money. Of course, you should receive a fair share for your trouble.
        - id: ch01-b35
          speaker: sindbad
          text: >-
            I gladly agreed, for I did not want to stand idle while everyone else traded. The captain pointed out the dead passenger's bales, then sent for the officer whose duty was to keep a complete list of everything carried on the ship. When that man arrived, he asked whose name he should enter beside the merchandise.
        - id: ch01-b36
          speaker: captain
          text: >-
            Put it down in the name of Sindbad the Sailor.
        - id: ch01-b37
          speaker: sindbad
          text: >-
            I was astonished. I looked closely at the captain and recognized him as the master of the ship from my second voyage. Time had changed him greatly. He believed I was dead, so it was no surprise that he did not know me.
        - id: ch01-b38
          speaker: sindbad
          text: >-
            Captain, did you say the merchant who owned those bales was named Sindbad?
        - id: ch01-b39
          speaker: captain
          text: >-
            Yes. That was his name. He came from Bagdad and joined my ship at Balsora. By terrible luck, we left him behind on a desert island where we had stopped to refill our water casks. We did not miss him for four hours. By then the wind had risen, and we could not turn back.
        - id: ch01-b40
          speaker: sindbad
          text: >-
            Then you believe he died there?
        - id: ch01-b41
          speaker: captain
          text: >-
            Sadly, yes.
          emotion: sad
        - id: ch01-b42
          speaker: sindbad
          text: >-
            Captain, look at me carefully! I am Sindbad. I am the man who fell asleep on that island and woke to find the ship gone!
          emotion: surprised
        - id: ch01-b43
          speaker: sindbad
          text: >-
            The captain stared at me in amazement. Before long, I convinced him that I was telling the truth, and he rejoiced at my escape.
        - id: ch01-b44
          speaker: captain
          text: >-
            I am glad to have that careless mistake off my conscience. Take back your goods, along with the profit I earned for you. May good fortune follow you from now on.
          emotion: happy
        - id: ch01-b45
          speaker: sindbad
          text: >-
            I accepted my goods and their profits with gratitude. As we traveled from island to island, I used them to trade and laid in stores of cloves, cinnamon, and other spices. I saw wonders along the way. In one place there was a tortoise twenty cubits long and just as broad. I also saw a fish shaped like a cow, with skin so thick that people made shields from it. Another fish had the shape and color of a camel.
        - id: ch01-b46
          speaker: sindbad
          text: >-
            In time we returned to Balsora, and from there I went home to Bagdad. I brought back more money than I could count, along with treasures without end. I gave generously to the poor and bought a great deal of land to add to my property. And that was the end of my third voyage.
        - id: ch01-b47
          speaker: narrator
          text: >-
            When Sindbad finished, he gave Hindbad another hundred sequins. The porter left with the other guests. The next day, they all gathered once more. When the banquet was over, their host continued the story of his adventures.
