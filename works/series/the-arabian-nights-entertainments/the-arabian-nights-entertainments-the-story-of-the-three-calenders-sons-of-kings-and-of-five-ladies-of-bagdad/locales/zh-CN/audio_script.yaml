audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严果断，对奇事充满执着的探究心
        timbre: 洪亮明净，沉稳有力
        pace: 从容，作出决定时干脆
        pitch: 中低音
    porter:
      display_name: 脚夫
      tts:
        delivery: 机灵健谈，善于逗趣，危急时慌张直率
        timbre: 明亮朴实，略带粗粝
        pace: 轻快，辩解时稍快
        pitch: 中音
    zobeida:
      display_name: 祖贝达
      tts:
        delivery: 端庄自持，发号施令时冷峻有力
        timbre: 丰满清亮，带有威严
        pace: 从容，动怒时字句分明
        pitch: 中低音
    sadie:
      display_name: 萨迪
      tts:
        delivery: 爽朗热情，待客机敏大方
        timbre: 清脆明亮
        pace: 轻快自然
        pitch: 中高音
    amina:
      display_name: 阿米娜
      tts:
        delivery: 温柔友善，歌唱与感伤时热烈投入
        timbre: 柔美清润
        pace: 舒缓流畅
        pitch: 中高音
    giafar:
      display_name: 贾法尔
      tts:
        delivery: 谨慎睿智，措辞恭敬而周全
        timbre: 沉静清晰
        pace: 平稳从容
        pitch: 中低音
    calender_1:
      display_name: 第一位卡兰德
      tts:
        delivery: 有礼克制，遇到冒犯时仍尽量和气
        timbre: 清朗略显沧桑
        pace: 平稳
        pitch: 中音
    calender_2:
      display_name: 第二位卡兰德
      tts:
        delivery: 郑重坦率，谈及身世时带着神秘感
        timbre: 温厚低沉
        pace: 从容
        pitch: 中低音
    calender_3:
      display_name: 第三位卡兰德
      tts:
        delivery: 文雅自尊，语气沉着
        timbre: 清晰稳重
        pace: 平稳
        pitch: 中音
  chapters:
    - id: ch01
      title: 神秘宅邸里的三姐妹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            哈里发哈伦·拉希德在位时，巴格达住着一个脚夫。他虽然身份低微，却是个聪明又明白事理的人。一天早晨，他照常坐在老地方，把筐子摆在面前等人雇用。一个身材高挑的年轻女子向他走来，脸上垂着长长的细棉纱面幕。她吩咐脚夫扛起筐子跟上。脚夫一见她的姿容，又听见她悦耳的声音，心里欢喜极了。他立刻跳起来，把筐子稳稳顶在头上，陪着她一路走去。
        - id: ch01-b02
          speaker: porter
          text: |-
            多么快活的日子！多么走运的相逢！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: |-
            女子很快在一扇紧闭的门前停下，抬手敲门。一个白须飘垂的老人开了门。她一句话也没说，只把钱递过去。老人似乎早已明白她要什么，转身进屋，不一会儿便抱出一大坛酒。脚夫把酒坛放进筐里，又照她的手势继续跟上。她接着去鲜果花卉铺，买了许多苹果、杏子、桃子和别的果品，还有百合、茉莉和各种芬芳花草。离开这里，她又走遍肉铺、杂货铺和禽肉铺。筐子越来越沉，脚夫也越来越吃力。
        - id: ch01-b04
          speaker: porter
          text: |-
            好心的小姐，您早说要买足够装满一座城的粮食，我就该牵匹马来。不，我该牵头骆驼来！
        - id: ch01-b05
          speaker: narrator
          text: |-
            女子笑着说还没买完。她又挑了各式香料和香粉，才在一座富丽堂皇的宅邸前轻轻敲门。开门的女子美得令脚夫眼花，而且一看就不是奴婢。脚夫愣在那里，领他来的女子则饶有兴味地看着。
        - id: ch01-b06
          speaker: sadie
          text: |-
            姐姐，你怎么还不进来？这个可怜人压得都快倒下了。
        - id: ch01-b07
          speaker: narrator
          text: |-
            两个女子进门以后，大门便关上了。三人穿过一座宽阔的庭院，四周环绕着透雕回廊。庭院一端有座高台，台上的琥珀宝座由四根乌木柱托起，四周镶满珍珠和钻石。正中央还有一方大理石水池，清水从金狮口中汩汩流出。脚夫四下张望，样样东西都令他赞叹，可最吸引他的，还是宝座上的第三位女子。她比另外两位更加美丽。看那两个女子对她如此敬重，脚夫猜她准是长姐，而他猜对了。她名叫祖贝达。开门的是萨迪，领脚夫采买的管家叫阿米娜。
        - id: ch01-b08
          speaker: narrator
          text: |-
            祖贝达命两个妹妹卸下筐子。她们付给脚夫丰厚的酬劳，可他拿着空筐仍不肯走。祖贝达问他是不是还嫌钱少。
        - id: ch01-b09
          speaker: porter
          text: |-
            夫人，您给得已经太多了。我没有立刻告辞，还请您原谅。我只是没想到，几位这样美丽的小姐竟独自在这里。只有女人而没有男人的聚会，就像只有男人而没有女人一样乏味。
        - id: ch01-b10
          speaker: narrator
          text: |-
            脚夫又讲了几个故事，想证明男女相伴才不乏味，最后恳求三姐妹准他留下，凑成第四个人，一同吃饭。三姐妹听着他的保证，觉得颇为有趣。她们商量了一阵，想到有他作伴或许真能添些乐趣，这才答应了他的请求。
        - id: ch01-b11
          speaker: zobeida
          text: |-
            朋友，你可以留下，但必须处处有礼。偶然看见了我们的生活情形，也要守口如瓶。
        - id: ch01-b12
          speaker: narrator
          text: |-
            众人围桌坐下，阿米娜买来的各色菜肴早已摆满桌面。才吃了几口，她便把酒斟进一只金杯。照阿拉伯人的习惯，阿米娜先亲自喝了一杯，再斟给两位姐妹。轮到脚夫时，他吻了吻阿米娜的手，当场编出一支赞美美酒的歌，唱给她听。三姐妹听得十分高兴，也各自唱了起来。这顿饭吃得兴高采烈，远比平日长久。直到太阳将要落山，萨迪才提醒脚夫，他们分别的时候到了。
    - id: ch02
      title: 三个卡兰德来访
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            太阳快落山时，萨迪叫脚夫起身回家。
        - id: ch02-b02
          speaker: porter
          text: |-
            夫人，我喝了酒，又见到几位小姐，已经晕头转向，哪里还认得回家的路？让我留到明早吧。等我清醒了，您要我什么时候走，我就什么时候走。
        - id: ch02-b03
          speaker: amina
          text: |-
            让他留下吧。他给我们添了这么多欢乐，留下他才算公平。
        - id: ch02-b04
          speaker: zobeida
          text: |-
            妹妹既然愿意，他就留下。不过脚夫，你还得答应，无论看见什么都不许发问。问了，也许会听见你不爱听的话。
        - id: ch02-b05
          speaker: narrator
          text: |-
            条件说定，阿米娜端上晚餐，又在大厅里点起许多散发香气的蜡烛。众人重新坐到桌边，胃口也像重新回来了一样。他们继续吃喝、唱歌、吟诗，个个尽兴极了。正是满屋欢声笑语的时候，外门忽然传来敲门声。萨迪起身去开门，很快便回到姐妹身边。
        - id: ch02-b06
          speaker: sadie
          text: |-
            门外有三个卡兰德，刚到巴格达，天却已经黑了。他们举止很讨人喜欢，模样更是滑稽。三个人都瞎了右眼，头发、胡须和眉毛也剃得干干净净。有他们作伴，一定很有趣。
        - id: ch02-b07
          speaker: narrator
          text: |-
            两个姐姐本不愿接纳陌生人，可萨迪一再恳求，祖贝达只好点头。
        - id: ch02-b08
          speaker: zobeida
          text: |-
            带他们进来吧。先说清楚，不相干的事绝不能多嘴，也让他们看看门上的题字。
        - id: ch02-b09
          speaker: narrator
          text: |-
            那扇门上用金字写着，谁若多管与己无关之事，便会听见叫自己不快的真话。三个卡兰德进门后深深鞠躬，感谢三姐妹的仁慈与款待。三姐妹也出言欢迎。众人正要落座，三个卡兰德忽然看见了脚夫。他的衣着同他们颇有几分相似，只是天生的头发、胡须和眉毛还一根不少地留在身上。
        - id: ch02-b10
          speaker: calender_1
          text: |-
            看来，这是我们一位反叛了本门首领的阿拉伯兄弟。
        - id: ch02-b11
          speaker: porter
          text: |-
            坐下，管好自己的事！门上的题字没看见吗？世上的人又不是非得过同一种日子不可。
          emotion: angry
        - id: ch02-b12
          speaker: calender_1
          text: |-
            好朋友，别生气。我们绝不愿惹你不高兴。
        - id: ch02-b13
          speaker: narrator
          text: |-
            卡兰德连忙赔礼，这场争执也就平息了。三个卡兰德饱餐一顿，随后问屋里有没有乐器，说愿意为女主人们演奏。三姐妹一听就来了兴致。萨迪去找了一圈，片刻后抱来两种不同的笛子和一面铃鼓。三人各选一件，奏起人人熟悉的曲调，三姐妹便和着乐声唱歌。歌词欢快活泼到了极点，她们唱着唱着，总要停下来大笑，几乎笑得喘不过气。就在这一片喧闹声中，门又被敲响了。
    - id: ch03
      title: 哈里发微服入席
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            原来那天傍晚，哈里发秘密离开宫殿，身边只带着大维齐尔贾法尔和宦官长梅斯鲁尔。三个人都换上商人的衣服，没人看得出他们的身份。走过这条街时，哈里发听见屋里传出乐器声和阵阵欢笑，立刻被吸引住了。他命维齐尔上前敲门，因为自己非进去看看不可。贾法尔说，住在里面的女子显然正在招待朋友，主人最好不要贸然打扰。可哈里发已经打定主意，坚持要他服从命令。
        - id: ch03-b02
          speaker: narrator
          text: |-
            萨迪手持蜡烛开门。贾法尔见她如此美丽，吃了一惊，恭敬地深深行礼。
        - id: ch03-b03
          speaker: giafar
          text: |-
            夫人，我们是三个新近从摩苏尔来的商人。今晚遇到意外，赶回客栈时门已经关了，要到明早才开。我们无处可去，只好在街上游荡。经过府上，看见灯火，听见人声，便斗胆求您收留一夜。若蒙恩准，我们愿尽力陪诸位愉快地消磨时光。
        - id: ch03-b04
          speaker: narrator
          text: |-
            萨迪说，这件事必须先问过姐妹。三个人留在门外等候，她回到大厅，把来客的请求从头到尾说了一遍。姐妹们商量妥当，她才再次来到门边，告诉那位商人，他和两个朋友都可以加入席间。三人进了大厅，彬彬有礼地向女主人和在座宾客行礼。祖贝达身为一家之主，神情郑重地迎上前去。
        - id: ch03-b05
          speaker: zobeida
          text: |-
            欢迎诸位。不过，请答应我一件事。眼睛尽管看，舌头却不要动。无论见到多奇怪的事，都不许发问。
        - id: ch03-b06
          speaker: giafar
          text: |-
            夫人，我们一定照办。眼前有趣的事情已经够多，何必再操心与自己无关的事呢？
        - id: ch03-b07
          speaker: narrator
          text: |-
            众人一同坐下，举杯祝新来的客人安康。贾法尔同三姐妹交谈时，哈里发却一直暗暗猜测，她们究竟是什么人，三个卡兰德又为何都失去了右眼。他好奇得心里发痒，恨不得立刻问个清楚。可祖贝达的告诫封住了他的嘴，他只好打起精神加入谈话。众人聊得十分热烈，谈的是世间形形色色的乐趣。过了一阵，三个卡兰德站起身来，跳了几支稀奇古怪的舞，把其余人逗得十分高兴。
        - id: ch03-b08
          speaker: narrator
          text: |-
            舞跳完了，祖贝达牵起阿米娜的手。
        - id: ch03-b09
          speaker: zobeida
          text: |-
            妹妹，我们要完成每晚必做的事，若像是忘了客人还在，请诸位见谅。
        - id: ch03-b10
          speaker: narrator
          text: |-
            阿米娜明白姐姐的意思，收走了碗碟、酒杯和乐器。萨迪打扫大厅，把一切收拾整齐。她请三个卡兰德坐到一边的长榻上，又请哈里发和两个随从坐到对面，脚夫则留下来帮姐妹做事。不久，阿米娜搬来一张凳子，放在腾空的大厅中央。她走到壁橱门前，示意脚夫跟来。片刻后，脚夫再次出现，手里牵着一根链子，链上拴着两条黑狗。他把狗领到大厅中央。祖贝达从卡兰德与哈里发之间起身，缓缓走到脚夫面前。她深深叹息，挽起衣袖，又接过萨迪递来的鞭子。
        - id: ch03-b11
          speaker: zobeida
          text: |-
            我们必须尽自己的本分。把一条狗牵到阿米娜那里，另一条交给我。
        - id: ch03-b12
          speaker: narrator
          text: |-
            脚夫照办。黑狗一面尖声哀号，一面用哀求的眼神望着祖贝达。她毫不理会，挥鞭抽打，直到累得气喘吁吁。接着，她提起链子，让狗以后腿站立。一人一狗悲哀地对望，双方都落下泪来。祖贝达温柔地替狗擦泪，亲吻它，再让脚夫把它送回去，换另一条来。第二条狗也经历了完全相同的仪式。
        - id: ch03-b13
          speaker: narrator
          text: |-
            第二条狗也被抽打、流泪、亲吻。整个过程中，众人全都惊呆了。哈里发尤其按捺不住，不断向贾法尔使眼色，要他问出这一切的缘由。贾法尔却装作没看见，把头转向别处。祖贝达在大厅中央站了许久。萨迪终于上前请她坐下，说接下来也该由自己完成那份职责了。阿米娜从黄色缎面盒里取出一把鲁特琴，交给萨迪。萨迪一边弹奏，一边唱了好几支歌，直到再也唱不动了。
        - id: ch03-b14
          speaker: sadie
          text: |-
            妹妹，我再也唱不动了。来吧，求你接替我。
        - id: ch03-b15
          speaker: narrator
          text: |-
            阿米娜先拨了几下琴弦，随后放声歌唱。歌声里饱含热烈的情感，唱到后来，她自己也承受不住了，喘息着倒在一堆软垫上。倒下时，她扯开衣襟，想让自己透一口气。众人原以为她的脖颈会像脸庞一样白皙光洁，眼前所见却完全出乎意料。那里竟没有一块完好的肌肤，触目都是伤疤。
    - id: ch04
      title: 禁令被打破
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            三个卡兰德和哈里发彼此交换眼色，趁祖贝达和萨迪忙着照料昏厥的阿米娜，凑在一起低声交谈。两姐妹没有听见他们的话。
        - id: ch04-b02
          speaker: sultan
          text: |-
            这一切究竟是什么意思？
        - id: ch04-b03
          speaker: calender_1
          text: |-
            我们知道的并不比您多。
        - id: ch04-b04
          speaker: sultan
          text: |-
            什么！你们不是这家里的人？
          emotion: surprised
        - id: ch04-b05
          speakers: [calender_1, calender_2, calender_3]
          ensemble: chorus
          text: |-
            大人，我们也只比您早一个时辰来到这里。
        - id: ch04-b06
          speaker: narrator
          text: |-
            他们又转向脚夫，想看他能不能解开这个谜，谁知脚夫同他们一样毫不知情。哈里发再也压不住好奇，宣称非逼三姐妹说明这些怪事的缘由不可。贾法尔早已料到会有怎样的后果，恳请主人记住女主人定下的条件。他又压低声音提醒，只要等到天亮，殿下就能以哈里发的身份召她们前来问话。可是哈里发向来不惯于受人反驳，当即拒绝。众人又商量了一会儿，决定推脚夫出面发问。祖贝达忽然转过身，看见他们神色激动，便开口问道。
        - id: ch04-b07
          speaker: zobeida
          text: |-
            出了什么事？你们在这样起劲地商量什么？
        - id: ch04-b08
          speaker: porter
          text: |-
            夫人，这几位先生请您说明，为什么先鞭打两条狗，又抱着它们落泪？那位昏厥的小姐，为什么脖颈上满是伤疤？他们请我替大家问您。
        - id: ch04-b09
          speaker: zobeida
          text: |-
            诸位先生，你们当真叫这个人来问我这些吗？
        - id: ch04-b10
          speakers: [sultan, calender_1, calender_2, calender_3]
          ensemble: chorus
          text: |-
            不错，是我们请他来问的。
        - id: ch04-b11
          speaker: narrator
          text: |-
            只有贾法尔没有开口。祖贝达挺直身子，越说越愤怒。
        - id: ch04-b12
          speaker: zobeida
          text: |-
            我这样款待你们，你们竟这样报答我？难道忘了进门时答应的唯一条件？快来！
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: |-
            她拍了三下手。话音未落，七个手持弯刀的黑奴便闯进大厅，分别逼到七个男人身边，把他们掀倒在地。只等女主人一个手势，他们就要砍下这些人的脑袋。七个犯禁的人都以为死期到了。哈里发痛悔没有听从贾法尔的劝告，却和其他人一样决心勇敢赴死。只有脚夫高声喊冤，问祖贝达为什么别人犯下的过错也要让他受罚。他还说，要不是三个总会招来厄运的卡兰德，一切灾祸根本不会发生。最后，他苦苦哀求祖贝达分清无辜与有罪的人，饶他一命。
        - id: ch04-b14
          speaker: narrator
          text: |-
            祖贝达虽在盛怒之中，脚夫那一声接一声的哀号实在太过滑稽，还是忍不住笑了出来。不过，她并没有就此忘记众人违背禁令的事。她先把脚夫撇在一旁，又转向其余的人，再次开口质问。
        - id: ch04-b15
          speaker: zobeida
          text: |-
            说，你们究竟是什么人？若不如实交代，一刻也别想多活。无论来自哪个国家，我都不信你们是有身份的人。若真有身份，待我们就该更体谅一些。
        - id: ch04-b16
          speaker: narrator
          text: |-
            哈里发性情本就急躁。想到自己的性命竟握在一个理应受了冒犯的女子手中，他受的煎熬比谁都多。可是听见祖贝达追问众人的身份，他反而松了口气。依他看来，只要她得知自己的姓名和地位，所有危险自然都会消失。于是，他赶忙悄声催促身旁的贾法尔，叫维齐尔立刻说出三人的秘密。贾法尔却比主人看得更远，不愿让他们今晚所受的羞辱传到外界。
        - id: ch04-b17
          speaker: giafar
          text: |-
            说到底，我们不过是自作自受。
    - id: ch05
      title: 三位王子的秘密
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            祖贝达转向三个卡兰德，问他们既然都瞎了一只眼，是否原本就是兄弟。
        - id: ch05-b02
          speaker: calender_1
          text: |-
            不是，夫人。我们没有血缘关系，只因过着同样的生活，才以兄弟相称。
        - id: ch05-b03
          speaker: zobeida
          text: |-
            那么你呢？你生来就瞎了一只眼吗？
        - id: ch05-b04
          speaker: calender_2
          text: |-
            不是，夫人。我经历了一桩从未落到别人身上的奇事，才失去这只眼睛。此后，我剃掉头发和眉毛，换上了您现在看见的装束。
        - id: ch05-b05
          speaker: narrator
          text: |-
            祖贝达向另外两人问了同样的问题，得到的回答也完全相同。第三个卡兰德又补充了一句。
        - id: ch05-b06
          speaker: calender_3
          text: |-
            夫人也许会有兴趣知道，我们并非出身卑微。我们三个都是国王的儿子，而且我们的父王都深受世人敬重。
        - id: ch05-b07
          speaker: narrator
          text: |-
            听见三个卡兰德竟都是王子，祖贝达的怒气渐渐消了。她转向持刀的黑奴，命他们让众人稍稍自在一些，不必再把刀锋逼得那么紧，却仍不许任何人离开大厅。众人虽然暂时保住性命，能否平安走出这扇门，仍要看接下来如何回答。
        - id: ch05-b08
          speaker: zobeida
          text: |-
            谁肯讲出自己的身世，还有来到这里的缘由，谁就能安然离开。若是不肯——
        - id: ch05-b09
          speaker: narrator
          text: |-
            祖贝达没有说完。脚夫已经明白，只要交代经历就能脱险，立刻抢着开口。
        - id: ch05-b10
          speaker: porter
          text: |-
            夫人，您已经知道我怎样来到这里。今早，您的妹妹在我平日等生意的地方找到我，叫我跟着她走遍几家店铺。筐子装满后，我们回到这里，您又好心准我留下。这份恩情，我永远感激。我的故事就这些。
        - id: ch05-b11
          speaker: narrator
          text: |-
            脚夫焦急地望着祖贝达。她点了点头。
        - id: ch05-b12
          speaker: zobeida
          text: |-
            你可以走了。小心别再让我碰见你。
        - id: ch05-b13
          speaker: porter
          text: |-
            夫人，请再让我多留一会儿。别人都听了我的故事，我却听不到他们的，这太不公平了。
        - id: ch05-b14
          speaker: narrator
          text: |-
            脚夫说完，不等祖贝达准许，便径自坐到三姐妹所在长榻的一端，显然已经认定自己可以留下听个究竟。其余人仍蹲坐在地毯上，七个黑奴则握着弯刀，靠墙站成一排。大厅里的欢宴早已停了，所有人都在等待。随后，第一位卡兰德面向身为女主人的祖贝达，开始讲述自己的故事。
