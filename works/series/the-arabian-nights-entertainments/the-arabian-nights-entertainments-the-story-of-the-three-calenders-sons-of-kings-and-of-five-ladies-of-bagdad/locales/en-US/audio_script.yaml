  chapters:
    - id: ch01
      title: The Porter's Lucky Morning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In the days of Caliph Haroun-al-Raschid, an intelligent and sensible porter lived in Bagdad. One morning, he sat in his usual place with his basket before him, waiting for work. A tall young lady approached, her face covered by a long muslin veil.
        - id: ch01-b02
          speaker: amina
          text: >-
            Take up your basket and come with me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Her looks and her voice delighted the porter. He sprang up, balanced the basket on his head, and followed her.
        - id: ch01-b04
          speaker: porter
          text: >-
            What a happy day! What a lucky meeting!
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            The lady stopped at a closed door and knocked. An old man with a long white beard opened it. She silently held out some money, and he disappeared inside. Soon he returned with a large jar of wine. The porter put it in his basket, and the lady led him on.
        - id: ch01-b06
          speaker: narrator
          text: >-
            At a fruit and flower shop, she bought apples, apricots, peaches, and many other fruits. She added lilies, jasmine, and all kinds of sweet-smelling plants. Then she led him to a butcher's shop, a grocer's, and a poulterer's. At every stop she chose more provisions, and the basket on his head grew heavier.
        - id: ch01-b07
          speaker: porter
          text: >-
            My good lady, if I had known you meant to buy enough food for a whole town, I would have brought a horse. Better yet, I would have brought a camel!
        - id: ch01-b08
          speaker: narrator
          text: >-
            The lady laughed and told him they were not finished. After buying scents and spices from a druggist, she finally stopped before a magnificent palace and knocked softly.
        - id: ch01-b09
          speaker: narrator
          text: >-
            A porteress opened the door. Her beauty dazzled the porter, and he was surprised to see that she was no slave. While he stared, the lady who had brought him watched with amusement.
        - id: ch01-b10
          speaker: sadie
          text: >-
            Sister, why are you still standing there? This poor man is carrying so much that he is about to fall over.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Once both women were inside, the door was fastened behind them. The three of them entered a great courtyard surrounded by an open-work gallery. At one end, a raised platform held an amber throne. Four ebony columns supported it, and pearls and diamonds shone all around it. In the center of the court stood a marble basin, filled by water that poured from the mouth of a golden lion.
        - id: ch01-b12
          speaker: narrator
          text: >-
            A third lady sat upon the throne, even more beautiful than the other two. From the respect they showed her, the porter correctly guessed that she was the eldest. Her name was Zobeida. The porteress was Sadie, and the lady who had done the shopping was Amina.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The porter looked all around, taking in one wonderful sight after another. Yet the lady on the throne held his attention most of all. At Zobeida's command, Sadie and Amina lifted away the heavy basket, much to his relief. They emptied it and paid him generously for carrying it. Yet instead of picking up the basket and leaving, he lingered. At last Zobeida asked what he was waiting for and whether he expected still more money.
        - id: ch01-b14
          speaker: porter
          text: >-
            Oh, madam, you have already paid me far too much. Forgive me for lingering. I was simply amazed to find three such beautiful ladies here alone. A gathering of women without men is as dull as a gathering of men without women. Please let me stay and make a fourth at dinner.
        - id: ch01-b15
          speaker: narrator
          text: >-
            He even told them stories to prove his point. The ladies found his confidence amusing. After discussing it, they decided that his company might entertain them, and they allowed him to remain.
        - id: ch01-b16
          speaker: zobeida
          text: >-
            Listen carefully, friend. You may stay only if you behave with perfect politeness. You must also keep our way of life secret, since you discovered it only by chance.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The porter agreed. Then all four sat down at the table Amina had covered with the food she had bought.
    - id: ch02
      title: Guests at the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After the first few bites, Amina poured wine into a golden cup. Following the Arab custom, she tasted it first herself, then filled the cup for each of her sisters. When it was the porter's turn, he took the cup, kissed Amina's hand, and sang a song in praise of the wine. He composed every word at that very moment.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The ladies enjoyed his song and answered with songs of their own. The meal became so merry that it lasted far longer than usual. At last, Sadie saw that the sun was setting.
        - id: ch02-b03
          speaker: sadie
          text: >-
            It is time for us to part now. You must get up and go.
        - id: ch02-b04
          speaker: porter
          text: >-
            Oh, madam, how can you send me away like this? Between the wine and the pleasure of your company, I could never find my way home. Let me stay until morning. Once my head is clear, I will leave whenever you wish.
        - id: ch02-b05
          speaker: amina
          text: >-
            Let him remain. He has entertained us so well that it is only fair.
        - id: ch02-b06
          speaker: zobeida
          text: >-
            If that is what you want, sister, he may stay. But there is one new condition. Porter, whatever you see here, you must ask no questions. If you do, you may hear an answer you will not enjoy.
        - id: ch02-b07
          speaker: narrator
          text: >-
            With that settled, Amina brought in supper. She lit many sweet-smelling candles until their light filled the hall. Once more, the four companions sat at the table with fresh appetites. They ate and drank, sang songs, and recited verses to one another. They were all enjoying themselves immensely when a knock sounded at the outer door, and Sadie rose to answer it.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Sadie went to answer. Soon she returned with news of three Calenders. Each was blind in the right eye, and each had a clean-shaven head, face, and eyebrows. They had just reached Bagdad after nightfall and were asking for shelter.
        - id: ch02-b09
          speaker: sadie
          text: >-
            They seem very pleasant, and you cannot imagine how funny they look. I am certain they would amuse us.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Zobeida and Amina hesitated, for a reason Sadie understood. But she pressed them so strongly that Zobeida finally gave in.
        - id: ch02-b11
          speaker: zobeida
          text: >-
            Bring them inside, then. Make sure they know not to comment on anything that does not concern them. And have them read the words above the door.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Written there in gold was a warning. Anyone who meddled in business that was not his own would hear truths that did not please him.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The three Calenders entered with low bows. They thanked the ladies for receiving strangers so kindly, and their hostesses answered with welcoming words. Everyone was about to sit when the Calenders noticed the porter. His clothes were not very different from their own. Unlike them, though, he still wore every bit of the hair nature had given him.
        - id: ch02-b14
          speaker: calender_1
          text: >-
            This man seems to be one of our Arab brothers, but he must have rebelled against our ruler.
        - id: ch02-b15
          speaker: narrator
          text: >-
            The porter was half asleep from the wine, yet he heard every word. Without even moving, he answered angrily.
        - id: ch02-b16
          speaker: porter
          text: >-
            Sit down and concern yourself with your own affairs. Did you miss the warning over the door? Not everyone has to live as you do.
          emotion: angry
        - id: ch02-b17
          speaker: calender_1
          text: >-
            Please do not be angry, my good man. We would be very sorry to offend you.
        - id: ch02-b18
          speaker: narrator
          text: >-
            That ended the quarrel, and supper began in earnest. Once the Calenders had eaten their fill, they offered to play music if the house contained any instruments.
        - id: ch02-b19
          speaker: narrator
          text: >-
            The ladies were delighted by the offer. Sadie searched the house and soon returned carrying two different kinds of flutes and a tambourine. Each Calender chose the instrument he liked best. Together they played a well-known tune while the ladies sang the gayest, liveliest words imaginable. Again and again, the singers had to stop because laughter nearly choked them. In the middle of all that music and noise, another knock sounded at the door.
    - id: ch03
      title: Three Merchants After Dark
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Earlier that evening, the Caliph had secretly left his palace. His grand-vizir Giafar and Mesrour, chief of the eunuchs, went with him. All three were disguised as merchants.
        - id: ch03-b02
          speaker: narrator
          text: >-
            As the three men passed along the street, music and laughter drew the Caliph's attention to the house. He ordered Giafar to go and knock. The vizir replied that the ladies inside seemed to be entertaining their friends. In his view, his master would do better not to intrude upon them. But the Caliph had set his mind on finding out what was happening for himself, and he insisted on being obeyed.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Sadie came to the door carrying a candle. Struck by her beauty, Giafar bowed low and spoke with great respect.
        - id: ch03-b04
          speaker: giafar
          text: >-
            Madam, we are three merchants newly arrived from Moussoul. A mishap delayed us tonight, and when we reached our inn, its doors were locked until morning. We wandered through the streets until we saw your lights and heard voices here. Would you shelter us until dawn? If you allow us in, we will gladly do our best to make the hours pass pleasantly.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Sadie said she must consult her sisters. After the three ladies discussed the request, she returned and invited the supposed merchants to join them.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The newcomers entered and bowed politely to the ladies and their guests. Then Zobeida stepped forward as mistress of the house and addressed them gravely.
        - id: ch03-b07
          speaker: zobeida
          text: >-
            You are welcome here, but I ask one thing of you. Use your eyes as much as you please, but keep your tongues still. No matter how strange something looks, ask no questions about it.
        - id: ch03-b08
          speaker: giafar
          text: >-
            Madam, we will obey. There is already plenty here to delight and interest us. We have no wish to trouble ourselves with matters that do not concern us.
        - id: ch03-b09
          speaker: narrator
          text: >-
            They all sat down, and the company drank to the health of the newcomers. While Giafar talked with the ladies, the Caliph studied the room. He wondered who the three women could be. He also wanted desperately to know why every Calender had lost his right eye. Zobeida's warning kept him silent, so he tried to shake off his curiosity and join the conversation instead.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Instead, he joined the lively talk about the many different pleasures to be found in the world. The conversation continued for some time. Then the Calenders rose and performed several curious dances, and their performance delighted the whole company.
    - id: ch04
      title: The Ladies' Nightly Task
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When the dancing ended, Zobeida rose and took Amina by the hand.
        - id: ch04-b02
          speaker: zobeida
          text: >-
            Sister, our friends will forgive us if we turn away from them for a while. It is time to carry out our nightly task.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Amina knew exactly what her sister meant. She gathered the dishes, glasses, and musical instruments and carried them from the room. While she did that, Sadie swept the hall and restored everything to order. Then Sadie asked the Calenders to sit together on a sofa at one side of the room. She placed the Caliph and his two companions opposite them. The porter was given no seat. Instead, she called him over to help her and Amina with what came next.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Amina brought in a seat and set it in the middle of the open floor. Then she went to a closet and beckoned the porter after her. He soon came back leading two black dogs on a chain and brought them into the center of the hall.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Zobeida left her place between the Calenders and the Caliph. She walked slowly toward the porter and the dogs, then gave a deep sigh and pushed back her sleeves. Sadie handed her a whip.
        - id: ch04-b06
          speaker: zobeida
          text: >-
            We must do our duty. Porter, take one dog to Amina and give the other to me.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The porter obeyed. As he led one dog to Zobeida, it gave piercing howls and looked up at her as if begging for mercy. Zobeida paid no attention. She whipped the dog until she had no breath left.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Then she took its chain and raised the dog onto its hind legs. They gazed sorrowfully into each other's eyes until tears fell from them both. Zobeida tenderly wiped the dog's eyes with her handkerchief and kissed it.
        - id: ch04-b09
          speaker: zobeida
          text: >-
            Take this one back to the closet. Now bring me the other.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The porter returned with the second dog, and Zobeida went through the very same ceremony again. The entire company watched with growing amazement. Of them all, the Caliph had the greatest difficulty containing himself. He repeatedly made signs to Giafar, urging the vizir to ask what the strange scene meant. Giafar refused to be drawn in. He turned his head away and pretended not to see his master's signals.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Zobeida remained in the center of the room for some time. At last Sadie approached and asked her to sit, because Sadie also had a part to perform.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Amina took a lute from a yellow satin case and gave it to Sadie. Sadie played and sang several songs. When she grew tired, she turned to her sister.
        - id: ch04-b13
          speaker: sadie
          text: >-
            Sister, I cannot continue. Please come and take my place.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Amina took the lute, struck a few chords, and broke into song. She sang with such passion that her own feelings overcame her. At last she could bear no more. Gasping for air, she sank onto a heap of cushions. As she fell, she tore open the front of her dress so that she could breathe.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Everyone stared in astonishment. Her neck was not smooth and white like her face. It was covered with scars.
    - id: ch05
      title: The Forbidden Question
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            While Zobeida and Sadie cared for their fainting sister, the Calenders and the Caliph exchanged looks and whispered together beyond the ladies' hearing.
        - id: ch05-b02
          speaker: caliph
          text: >-
            What can all of this mean?
        - id: ch05-b03
          speaker: calender_1
          text: >-
            We know no more about it than you do.
        - id: ch05-b04
          speaker: caliph
          text: >-
            What? You do not belong to this household?
          emotion: surprised
        - id: ch05-b05
          speakers: [calender_1, calender_2, calender_3]
          ensemble: chorus
          text: >-
            No, my lord. We arrived here for the first time only an hour before you.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The men turned next to the porter, hoping that someone who had spent longer in the house could explain the mystery. But he was just as ignorant as the rest. At last the Caliph could bear his curiosity no longer. He declared that he would compel the ladies to tell them the meaning of everything they had seen.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Giafar foresaw the danger. He begged the Caliph to remember the condition their hostesses had set. In a whisper, he urged him to wait until morning. Then, as Caliph, he could summon the ladies before him.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The Caliph was not used to being opposed, and he rejected the advice. After further discussion, they decided that the porter should ask the question for them. Suddenly Zobeida turned and saw their excitement.
        - id: ch05-b09
          speaker: zobeida
          text: >-
            What is happening? What are all of you discussing so seriously?
        - id: ch05-b10
          speaker: porter
          text: >-
            Madam, these gentlemen want to know why you whipped the dogs and then wept over them. They also want to know why the lady who fainted is covered with scars. They asked me to speak for them.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Zobeida drew herself up and faced the men.
        - id: ch05-b12
          speaker: zobeida
          text: >-
            Gentlemen, is that true? Did you tell this man to ask me those questions?
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: >-
            Every man except Giafar answered that it was true. Zobeida's anger rose with every moment.
        - id: ch05-b14
          speaker: zobeida
          text: >-
            Is this how you repay my hospitality? Have you forgotten the one condition under which you entered my house? Come at once!
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: >-
            She clapped three times. Before the words had left her mouth, seven black slaves rushed in, each holding a sabre. They threw the seven men to the floor and stood over them, ready to cut off their heads at one sign from Zobeida.
        - id: ch05-b16
          speaker: narrator
          text: >-
            All seven men believed their final hour had come. The Caliph now bitterly regretted refusing Giafar's wise advice. Since escape appeared impossible, the prisoners made up their minds to face death bravely. The porter alone refused to accept his fate in silence. He raised his voice and demanded to know why he should die for the faults of the others.
        - id: ch05-b17
          speaker: porter
          text: >-
            Why should I suffer for someone else's mistake? None of this would have happened without those Calenders. They always bring bad luck! Please, madam, do not punish an innocent man with the guilty ones. Spare my life!
          emotion: fearful
        - id: ch05-b18
          speaker: narrator
          text: >-
            Zobeida was still angry, but the porter's groans were so comical that she could not help laughing. Then she set him aside and turned once more to the others.
        - id: ch05-b19
          speaker: zobeida
          text: >-
            Tell me who you are, and tell me the truth. Otherwise, you have only moments left to live. I can hardly believe that any of you holds an honorable position. If you did, you would have shown us more consideration.
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: >-
            The Caliph was impatient by nature, and he suffered more than any of the others. His life now rested in the hands of a woman who had every reason to be offended with him. Yet the moment she asked their identities, he began to breathe more easily. He was convinced that his name and rank would end the danger at once. Giafar was beside him, so the Caliph hastily whispered that the vizir should reveal their secret.
        - id: ch05-b21
          speaker: narrator
          text: >-
            Giafar was wiser. He did not want the public to learn how they had been humiliated.
        - id: ch05-b22
          speaker: giafar
          text: >-
            After all, this is only what we deserved.
    - id: ch06
      title: Stories in Exchange for Freedom
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Meanwhile, Zobeida turned to the three Calenders.
        - id: ch06-b02
          speaker: zobeida
          text: >-
            Since all three of you are blind in one eye, are you brothers?
        - id: ch06-b03
          speaker: calender_1
          text: >-
            No, madam. We are not related by blood. We are brothers only because we follow the same way of life.
        - id: ch06-b04
          speaker: zobeida
          text: >-
            And you, were you born blind in one eye?
        - id: ch06-b05
          speaker: calender_2
          text: >-
            No, madam. I lost my eye in an adventure so astonishing that nothing like it may ever have happened to anyone else. Afterward, I shaved my head, face, and eyebrows and put on these clothes.
        - id: ch06-b06
          speaker: narrator
          text: >-
            Zobeida put the same question to the other two Calenders. Neither had been born blind. Each told her that he too had lost his right eye through an extraordinary adventure, then shaved his head, face, and eyebrows and adopted the dress of a Calender.
        - id: ch06-b07
          speaker: calender_3
          text: >-
            You may also be interested to know, madam, that none of us was lowborn. We are all sons of kings, and our fathers are highly honored throughout the world.
        - id: ch06-b08
          speaker: narrator
          text: >-
            At that, Zobeida's anger began to cool. She turned to the armed slaves.
        - id: ch06-b09
          speaker: zobeida
          text: >-
            Let them move a little more freely, but remain in the hall. Any man who tells us his history and explains why he came here may leave unharmed. Anyone who refuses...
        - id: ch06-b10
          speaker: narrator
          text: >-
            She let the threat hang in the air. The porter understood at once that a short account would free him from danger, so he broke in before anyone else.
        - id: ch06-b11
          speaker: porter
          text: >-
            Madam, you already know how I came here, so my tale will be quick. Your sister found me this morning where I always wait for work. She took me from shop to shop until my basket was full, and then we returned here. You kindly allowed me to stay, and I will always be grateful. That is my whole story.
        - id: ch06-b12
          speaker: narrator
          text: >-
            He watched Zobeida anxiously. She nodded.
        - id: ch06-b13
          speaker: zobeida
          text: >-
            You may go. Take care that we never meet again.
        - id: ch06-b14
          speaker: porter
          text: >-
            Oh, madam, please let me stay a little longer. The others heard my story. It would not be fair if I could not hear theirs.
        - id: ch06-b15
          speaker: narrator
          text: >-
            Without waiting for permission, the porter settled himself at the end of the sofa where the ladies sat. The rest of the men remained crouched together on the carpet. Around them, the armed slaves took their places against the wall and stayed in the hall, just as Zobeida had commanded.
        - id: ch06-b16
          speaker: narrator
          text: >-
            Then the first Calender turned toward Zobeida, the principal lady, and began his story.
