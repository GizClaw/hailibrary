  chapters:
    - id: ch01
      title: The Parrot's Report
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            There once was a good man with a beautiful wife. He loved her passionately and rarely left her. Then important business forced him to travel. Before leaving, he went to a bird market.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There he found an extraordinary parrot. It spoke well and could tell its master everything that had happened before it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The man bought the parrot and brought it home in a cage. He asked his wife to keep it in her room and care for it while he was gone. Then he left.
        - id: ch01-b04
          speaker: narrator
          text: >-
            When the husband returned, he asked the parrot what had taken place during his absence. The bird told him several things that made him scold his wife.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His wife was sure that one of her slaves had been telling tales about her. But the slaves told her that the parrot had revealed everything. At once, she decided to take revenge on the bird.
    - id: ch02
      title: A Storm That Never Came
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next time her husband went away for a day, his wife set her plan in motion. She ordered one slave to turn a hand mill beneath the cage and another to pour water over it. A third swept a mirror back and forth before the bird's eyes by candlelight.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The slaves kept this up for part of the night and carried out the trick perfectly.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The husband came home the following day and asked the parrot what it had seen while he was away.
        - id: ch02-b04
          speaker: parrot
          text: >-
            My good master, there was lightning and thunder, and the rain poured down. It troubled me all night. I cannot begin to tell you how much I suffered.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The husband knew perfectly well that there had been no rain or thunder that night. Now he felt certain that the parrot had lied. He pulled the bird from its cage and threw it hard against the ground, killing it.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Later, he learned what had really happened and discovered that the parrot had told the truth. Then he bitterly regretted killing it.
    - id: ch03
      title: The Vizir Refuses to Yield
      blocks:
        - id: ch03-b01
          speaker: fisherman
          text: >-
            Great genius, when the Greek king finished the parrot's story, he turned to his vizir and refused his advice.
        - id: ch03-b02
          speaker: greek_king
          text: >-
            And so, vizir, I will not listen to you. I will spare the physician. Otherwise, I may repent just as the husband did after he killed the parrot.
        - id: ch03-b03
          speaker: fisherman
          text: >-
            But the vizir would not give up.
        - id: ch03-b04
          speaker: vizir
          text: >-
            Sire, the death of one parrot was nothing. When a king's life is at stake, it is better to sacrifice an innocent man than to save a guilty one. And there is no uncertainty here. The physician Douban means to assassinate you. My devotion to Your Majesty compels me to warn you. If I am wrong, then I deserve the same punishment that another vizir once received.
        - id: ch03-b05
          speaker: greek_king
          text: >-
            What did that vizir do to deserve such a punishment?
        - id: ch03-b06
          speaker: vizir
          text: >-
            I will tell Your Majesty, if you will honor me by listening.
