  chapters:
    - id: ch01
      title: The Merchant and the Genius
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Sire, there once lived a merchant with great wealth in land, merchandise, and ready money. From time to time, he had to travel to distant places to manage his affairs. One day, business called him far from home. He mounted his horse and carried a small wallet filled with a few biscuits and dates. His road crossed a desert where no food could be found. He reached his destination without mishap, finished his business, and set out for home.
        - id: ch01-b02
          speaker: narrator
          text: >-
            On the fourth day, the sun grew fiercely hot. The merchant left the road to rest beneath some trees. At the foot of a great walnut tree, he found a fountain of clear, running water. He tied his horse to a branch, sat beside the fountain, and ate a few biscuits and dates. When the simple meal was over, he washed his face and hands in the water.
        - id: ch01-b03
          speaker: narrator
          text: >-
            As he washed, an enormous genius came toward him. The creature was white with rage and carried a scimitar in his hand.
        - id: ch01-b04
          speaker: genius
          text: Get up! You killed my son, and now I will kill you!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            The genius let out a frightful yell. His hideous face and terrible words filled the merchant with fear. Trembling, the merchant answered him.
        - id: ch01-b06
          speaker: merchant
          text: Alas, good sir, what have I done to deserve death?
          emotion: fearful
        - id: ch01-b07
          speaker: genius
          text: You killed my son. I will kill you in return.
          emotion: angry
        - id: ch01-b08
          speaker: merchant
          text: But how could I have killed him? I do not know your son. I have never even seen him.
        - id: ch01-b09
          speaker: genius
          text: When you came here, did you sit on the ground? Did you take dates from your wallet and throw away the stones as you ate?
        - id: ch01-b10
          speaker: merchant
          text: Yes. That is what I did.
        - id: ch01-b11
          speaker: genius
          text: >-
            Then you killed my son. He passed by while you were tossing those stones, and one struck him in the eye and killed him. Now I will kill you.
          emotion: angry
        - id: ch01-b12
          speaker: merchant
          text: Oh, sir, please forgive me!
          emotion: fearful
        - id: ch01-b13
          speaker: genius
          text: I will show you no mercy.
          emotion: angry
        - id: ch01-b14
          speaker: merchant
          text: I never meant to kill your son. I beg you, spare my life.
          emotion: fearful
        - id: ch01-b15
          speaker: genius
          text: No. You killed my son, so I will kill you.
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            The genius seized the merchant by the arm, hurled him onto the ground, and lifted his sword to cut off his head. The merchant kept protesting that he was innocent. He mourned the wife and children he would leave behind, weeping and pleading pitifully in the hope of escaping his fate. The genius stood over him with the scimitar raised and waited until he had finished. Not one word of the merchant's grief touched him.
    - id: ch02
      title: Morning Breaks the Tale
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At that moment, Scheherazade saw that day had come. She knew the Sultan always rose early for the council, so she stopped her story.
        - id: ch02-b02
          speaker: dinarzade
          text: Sister, what a wonderful story this is!
          emotion: surprised
        - id: ch02-b03
          speaker: scheherazade
          text: >-
            What comes next is even more wonderful. You would think so too, if the Sultan let me live another day and allowed me to tell you the rest tomorrow night.
        - id: ch02-b04
          speaker: narrator
          text: Schahriar had enjoyed listening to Scheherazade. He thought to himself.
        - id: ch02-b05
          speaker: schahriar
          text: >-
            I will wait until tomorrow. Once I have heard how her story ends, I can still have her killed.
        - id: ch02-b06
          speaker: narrator
          text: >-
            All this while, the grand-vizir had been in a terrible state of anxiety. He expected the Sultan to order his daughter's death. But then he saw Schahriar enter the council chamber without giving that dreadful command, and his fear gave way to great relief.
    - id: ch03
      title: A Year of Grace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Before dawn the next morning, Dinarzade spoke to her sister.
        - id: ch03-b02
          speaker: dinarzade
          text: Dear sister, if you are awake, please go on with your story.
        - id: ch03-b03
          speaker: narrator
          text: The Sultan did not wait for Scheherazade to ask permission.
        - id: ch03-b04
          speaker: schahriar
          text: Finish the story of the genius and the merchant. I want to hear how it ends.
        - id: ch03-b05
          speaker: narrator
          text: >-
            So Scheherazade continued the tale of the merchant and the genius. From then on, the same thing happened each morning. The Sultana would tell part of a story, dawn would interrupt her, and the Sultan would let her live so that he could hear the ending.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The merchant saw that the genius truly meant to cut off his head. He made one last plea.
        - id: ch03-b07
          speaker: merchant
          text: >-
            Please, hear one more thing. Give me a little time to go home, say farewell to my wife and children, and make my will. When that is done, I will return, and you may kill me.
        - id: ch03-b08
          speaker: genius
          text: If I give you that time, I fear you will never come back.
        - id: ch03-b09
          speaker: merchant
          text: I give you my word of honor. I will return without fail.
        - id: ch03-b10
          speaker: genius
          text: How much time do you need?
        - id: ch03-b11
          speaker: merchant
          text: >-
            Give me one year. A year from tomorrow, I promise I will be waiting beneath these trees to surrender myself to you.
        - id: ch03-b12
          speaker: narrator
          text: The genius left him beside the fountain and disappeared.
    - id: ch04
      title: The Merchant Keeps His Word
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Once the merchant had recovered from his fright, he mounted his horse and continued home. His wife and children welcomed him with great joy. But instead of embracing them, he began to weep so bitterly that they knew something dreadful had happened.
        - id: ch04-b02
          speaker: merchant_wife
          text: Please tell us. What has happened?
        - id: ch04-b03
          speaker: merchant
          text: Alas, I have only one year left to live.
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: >-
            The merchant told them everything that had passed between him and the genius beside the fountain. He explained how a carelessly thrown date stone had killed the genius's son, and how he had given his word to return at the end of one year to be killed. When his wife and children heard the sad news, they fell into despair and wept bitterly.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The very next day, the merchant began putting his affairs in order. First he paid every debt. He gave presents to his friends and generous alms to the poor. He freed his slaves and made sure his wife and children would be provided for.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The year passed all too quickly, and at last the merchant was obliged to leave. When he tried to say goodbye to his family, grief overcame him. It took all his strength to tear himself away. He traveled back to the very place where he had first seen the genius and arrived on the exact day he had appointed. There he dismounted and sat at the edge of the fountain, waiting in terrible suspense for the genius to appear.
    - id: ch05
      title: Three Old Men Wait
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            While he waited, an old man approached, leading a hind. They greeted one another, and then the old man questioned him.
        - id: ch05-b02
          speaker: first_old_man
          text: >-
            Brother, may I ask what brought you to this lonely place? Many evil genii haunt this desert. These beautiful trees make it look as though people live here, but it is dangerous to stay for long.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The merchant explained why he had been forced to come. The old man listened in astonishment.
        - id: ch05-b04
          speaker: first_old_man
          text: >-
            What a marvelous affair! I would like to witness your meeting with the genius.
          emotion: surprised
        - id: ch05-b05
          speaker: narrator
          text: >-
            With that, he sat beside the merchant. While the two men talked, a second old man arrived with two black dogs following him. He greeted them and asked what they were doing in that lonely place. The first old man repeated the whole adventure of the merchant and the genius. The second old man had scarcely heard it before he decided that he too would stay and witness whatever happened next. Then he sat down with the others.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The merchant and the two old men were still talking when a third old man came toward them. He saw the merchant's sorrow and asked why the man looked so sad. They told him the strange story and explained what they were waiting for. The third old man also resolved to remain and see what would pass between the genius and the merchant, so he waited there with the rest.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Before long, they saw thick smoke in the distance, like a cloud of dust. It drew nearer and nearer. Then it vanished all at once, and there stood the genius. Without a word to the old men, he strode up with his sword in hand, seized the merchant by the arm, and spoke.
        - id: ch05-b08
          speaker: genius
          text: Get up! You killed my son, and now I will kill you!
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: The merchant and all three old men began to weep and groan.
        - id: ch05-b10
          speaker: narrator
          text: The old man with the hind threw himself at the monster's feet.
        - id: ch05-b11
          speaker: first_old_man
          text: >-
            O Prince of the Genii, please hold back your fury and listen to me. I will tell you my story and the story of this hind. If you find it more marvelous than the merchant's story, will you take away one-third of his punishment?
        - id: ch05-b12
          speaker: narrator
          text: The genius thought for a while before giving his answer.
        - id: ch05-b13
          speaker: genius
          text: Very well. I agree.
