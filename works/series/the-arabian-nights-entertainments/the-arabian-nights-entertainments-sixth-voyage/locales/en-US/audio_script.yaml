  chapters:
    - id: ch01
      title: Sixth Voyage
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            You may wonder how I could tempt fortune again after five shipwrecks and so many unheard-of dangers. Looking back, I wonder at it myself. Yet I seemed fated to roam. After a year of rest, I prepared for a sixth voyage, though my friends and relations begged me to stay at home.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            This time I did not travel by the Persian Gulf. I went a great distance overland and finally sailed from a far-off Indian port. Our captain planned a long voyage, and that is exactly what we had. Storms drove us so far from our course that for many days neither the captain nor the pilot knew where we were going.
        - id: ch01-b03
          speaker: sindbad
          text: >-
            At last they discovered our position, but the news brought no comfort at all. The captain threw his turban on the deck and tore at his beard. He declared that we had reached the most dangerous place in the whole wide sea. At that very moment, a current had caught the ship and was sweeping us straight toward destruction.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            The sailors fought with all their strength, but nothing could save us. The current rushed toward a mountain that rose straight out of the sea. Our vessel struck the rocks at its foot and broke apart. Before it did, we scrambled ashore with the most precious things we could carry.
        - id: ch01-b05
          speaker: captain
          text: >-
            Since we are trapped here, we might as well start digging our graves. No shipwrecked sailor has ever returned from this fatal shore.
          emotion: sad
        - id: ch01-b06
          speaker: sindbad
          text: >-
            His words crushed our spirits, and we began to mourn our miserable fate. The mountain formed the seaward edge of a great island. Between it and the water lay only a narrow, rocky shore, covered with the wreckage of a thousand fine ships. The bones of their unlucky crews shone white in the sun. We shuddered to think how soon our own bones might be added to that heap.
        - id: ch01-b07
          speaker: sindbad
          text: >-
            Great quantities of the costliest merchandise lay everywhere, and treasure filled every crack among the rocks. But none of it could save the men who had owned it. All those riches only made the shore feel more desolate. Stranger still, a clear river sprang from the mountain not far from where we stood. Instead of running into the sea as rivers usually do, it turned sharply and vanished beneath a natural arch of stone.
        - id: ch01-b08
          speaker: sindbad
          text: >-
            I went closer to examine the cave. Inside, diamonds, rubies, and great masses of crystal lay thick across its walls, while ambergris covered the floor. The sight was astonishing, but all that wealth could not help us. The mountain was impossible to climb, and any ship that approached the shore could only be wrecked as ours had been.
        - id: ch01-b09
          speaker: sindbad
          text: >-
            Our captain's first act was to gather all the food we possessed and divide it equally among us. From then on, each man's life depended on how long he could make his share last. I needed very little to live, but one companion after another used up his food and died. Each time, I dug a grave and buried him. In the end, I was the only one left.
        - id: ch01-b10
          speaker: sindbad
          text: >-
            By the time I buried the last man, so little food remained that I doubted I would live long enough to dig my own grave. Still, I began the work. I bitterly regretted the restless nature that kept bringing me into danger, and I longed for the comfort and plenty I had left behind.
        - id: ch01-b11
          speaker: sindbad
          text: >-
            Then I happened to stand once more beside the river as it plunged into the cavern, and an idea came to me. Surely that hidden river must appear again somewhere far away. Why not build a raft and trust myself to the swift water? If I died underground, I would be no worse off. Death already faced me here. But perhaps my lucky star would carry me safely to a good land.
        - id: ch01-b12
          speaker: sindbad
          text: >-
            I decided to risk it. Driftwood and more than enough strong rope lay all over the beach, so I quickly built a sturdy raft. I packed rubies, emeralds, rock crystal, ambergris, and precious cloth into many bundles. I tied them firmly to the raft and balanced their weight with care. Then I placed two small oars I had made within easy reach, sat down, and untied the cord that held the raft to the bank.
        - id: ch01-b13
          speaker: sindbad
          text: >-
            The current swept me beneath the gloomy arch, and soon I could see nothing at all. The rapid river carried me smoothly onward through the blackness. It seemed to go on for many days and nights. Once the passage narrowed so much that I barely escaped being crushed against the rocky roof. From then on, I took care to lie flat on top of my valuable bundles.
        - id: ch01-b14
          speaker: sindbad
          text: >-
            I ate only enough to stay alive, but at last I swallowed my final morsel. I began to wonder if hunger would kill me after all. Worn down by fear and exhaustion, I fell into a deep sleep.
        - id: ch01-b15
          speaker: sindbad
          text: >-
            When I opened my eyes, daylight surrounded me again. A beautiful country stretched ahead. My raft was tied to the riverbank, and a group of friendly-looking Black men stood around it. I rose and greeted them. They answered me in return, but I could not understand a single word of their language.
        - id: ch01-b16
          speaker: sindbad
          text: >-
            My sudden return to light and life left me completely bewildered. In Arabic, I murmured, “Close your eyes, and while you sleep, Heaven will change your fortune from evil to good.”
        - id: ch01-b17
          speaker: islander
          text: >-
            Brother, do not be astonished to see us. This is our country. We came to draw water and saw your raft floating down the river. One of us swam out and pulled you ashore. We have waited for you to wake. Now tell us where you came from, and why you took such a dangerous path.
        - id: ch01-b18
          speaker: sindbad
          text: >-
            I will gladly tell you everything. But I am starving. Please let me eat first.
        - id: ch01-b19
          speaker: sindbad
          text: >-
            They quickly brought me all the food I needed. Once my hunger was satisfied, I gave them a faithful account of everything that had happened. When my tale was interpreted for the others, they were lost in wonder. They said adventures as astonishing as mine must be told to their king by the man who had lived through them.
        - id: ch01-b20
          speaker: sindbad
          text: >-
            They found a horse and helped me mount it. Several strong men lifted my raft onto their shoulders, with all its bundles still tied in place. In that order we entered the city of Serendib, where they presented me to the king. Following the custom of India, I bowed at his feet and kissed the ground. He told me to rise and sit beside him.
        - id: ch01-b21
          speaker: king_of_serendib
          text: >-
            What is your name?
        - id: ch01-b22
          speaker: sindbad
          text: >-
            I am Sindbad. Men call me the Sailor because I have traveled over so many seas.
        - id: ch01-b23
          speaker: king_of_serendib
          text: >-
            And how did you come to this place?
        - id: ch01-b24
          speaker: sindbad
          text: >-
            I told him my entire story and hid nothing. The king listened with such wonder and pleasure that he ordered my adventures written in letters of gold and placed in the records of his kingdom.
        - id: ch01-b25
          speaker: sindbad
          text: >-
            Then the men carried in my raft and opened the bundles before him. Great heaps of rubies and emeralds poured out. The king declared that even his treasury held no jewels like them. When I saw how closely he studied the treasure, I offered him everything I owned, myself included.
        - id: ch01-b26
          speaker: king_of_serendib
          text: >-
            No, Sindbad. Heaven forbid that I should desire your riches. I mean to add to them. You must not leave my kingdom without gifts that show my goodwill.
        - id: ch01-b27
          speaker: sindbad
          text: >-
            Smiling, the king ordered his officers to give me a suitable home at his expense. He sent servants to wait upon me and to carry the raft and all its bundles to my new lodging. You may imagine how warmly I praised his generosity and thanked him. I never failed to appear in his audience chamber each day. For the rest of my time, I explored everything in the city that was most worthy of attention.
        - id: ch01-b28
          speaker: sindbad
          text: >-
            Serendib lies on the equinoctial line, so its days and nights are equal in length. Its chief city stands at the end of a beautiful valley formed by the highest mountain in the world, which rises in the middle of the island. I was curious enough to climb all the way to its summit, for this was said to be the place where Adam was sent after leaving Paradise.
        - id: ch01-b29
          speaker: sindbad
          text: >-
            Rubies and many other precious things are found on that mountain. Rare plants grow there in abundance, along with cedar trees and cocoa palms. On the seashore and at the mouths of the rivers, divers search beneath the water for pearls. In some of the island's valleys, diamonds are plentiful.
        - id: ch01-b30
          speaker: sindbad
          text: >-
            After many days, I asked the king for permission to return to my own country, and he kindly agreed. He loaded me with valuable gifts. When I went to say farewell, he also placed a royal present and a letter in my care.
        - id: ch01-b31
          speaker: king_of_serendib
          text: >-
            Please deliver these to the Caliph Haroun al Raschid, the Commander of the Faithful, and assure him of my friendship.
        - id: ch01-b32
          speaker: sindbad
          text: >-
            I accepted the duty with respect and soon boarded the ship the king himself had chosen for me. His letter was written in blue characters on a rare and precious yellowish skin. It offered the Caliph greetings from the King of the Indies, before whom a thousand elephants walked. It spoke of his palace, whose roof blazed with a hundred thousand rubies, and his treasure house, which held twenty thousand diamond crowns.
        - id: ch01-b33
          speaker: sindbad
          text: >-
            The letter asked the Caliph to accept the offering as a sign of the king's esteem and friendship, though the king called it too humble for the Caliph's notice. In return, he asked for the same friendly regard, if the Caliph thought him worthy of it. He ended by calling the Caliph his brother and bidding him farewell.
        - id: ch01-b34
          speaker: sindbad
          text: >-
            The first gift was a vase carved from one ruby. It stood six inches high, and its walls were as thick as my finger. Inside were the finest pearls, large and perfectly shaped, with a beautiful shine. The second was an enormous snakeskin whose scales were each as large as a sequin. Anyone who slept upon it would be protected from sickness.
        - id: ch01-b35
          speaker: sindbad
          text: >-
            There were also great quantities of aloes wood, camphor, and pistachio nuts. Last of all came a beautiful slave girl dressed in robes that glittered with precious stones.
        - id: ch01-b36
          speaker: sindbad
          text: >-
            Our voyage was long but prosperous. When we landed at Balsora, I made haste to reach Bagdad with the king's letter. At the palace gate, the beautiful slave and several members of my family followed me, carrying the treasure. As soon as I declared my mission, I was taken into the Caliph's presence.
        - id: ch01-b37
          speaker: sindbad
          text: >-
            I made my humble bow before the Caliph, then delivered the letter and the king's gifts into his hands. He examined the message and every part of the royal present. Then he asked me whether the Prince of Serendib was really as rich and powerful as he claimed to be.
        - id: ch01-b38
          speaker: sindbad
          text: >-
            Commander of the Faithful, I assure you that he has not exaggerated his wealth or greatness at all. Nothing can equal the splendor of his palace. When he travels outside it, his throne is placed on an elephant's back. His ministers, favorites, and courtiers ride on both sides.
        - id: ch01-b39
          speaker: sindbad
          text: >-
            An officer sits on the elephant's neck with a golden lance in his hand. Behind the throne stands another officer holding a pillar of gold. At the top of that pillar is an emerald as long as my hand. A thousand men dressed in cloth of gold ride richly decorated elephants ahead of the king.
        - id: ch01-b40
          speaker: sindbad
          text: >-
            As the procession advances, the officer guiding the king's elephant calls for everyone to behold the mighty and valiant Sultan of the Indies. He proclaims that the king's palace bears a hundred thousand rubies and that he owns twenty thousand diamond crowns. He says this monarch is greater than Solomon and Mihrage in all their glory.
        - id: ch01-b41
          speaker: sindbad
          text: >-
            Then the officer behind the throne answers, “This king, so great and powerful, must die, must die, must die!” The first officer replies, “All praise to Him who lives forever.”
        - id: ch01-b42
          speaker: sindbad
          text: >-
            There is something more, my lord. Serendib needs no judge. Whenever the people seek justice, they go straight to the king himself.
        - id: ch01-b43
          speaker: caliph
          text: >-
            The king's letter led me to think he was wise. Now I see that he deserves his people, and they deserve him.
        - id: ch01-b44
          speaker: sindbad
          text: >-
            The Caliph was well pleased with my report. He dismissed me with rich presents, and I returned peacefully to my own house.
        - id: ch01-b45
          speaker: narrator
          text: >-
            When Sindbad finished speaking, his guests departed. Before Hindbad left, he received another hundred sequins. They all returned the next day to hear about the seventh voyage, and Sindbad began his tale.
