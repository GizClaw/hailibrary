audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    captain:
      display_name: 船长
      tts:
        delivery: 久经风浪，危急时直率沉重
        timbre: 粗粝而清晰
        pace: 适中
        pitch: 中低音
    native:
      display_name: 当地人
      tts:
        delivery: 友善坦诚，问话自然直接
        timbre: 明亮温厚
        pace: 适中
        pitch: 中音
    king:
      display_name: 锡兰王
      tts:
        delivery: 威严宽厚，待人慷慨而有分寸
        timbre: 洪亮沉稳
        pace: 从容
        pitch: 低音
    caliph:
      display_name: 哈里发
      tts:
        delivery: 庄重敏锐，言语简洁有威仪
        timbre: 深沉清晰
        pace: 稍缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 绝境海岸
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            你们一定想不通，我已经五次遇上海难，受过那么多闻所未闻的磨难，为什么还敢再出门冒险。其实，如今回头想想，连我自己也觉得奇怪。可我似乎命中注定不能安居。

            在家休息一年以后，我又开始准备第六次航行。亲友们苦苦劝阻，想尽办法留我在家，我还是出发了。这一次，我没有走波斯湾，而是从陆路走了很远，来到印度一处遥远的港口。我在那里登上一艘船，船长正打算远航。

            这一程果然够远。暴风雨把大船吹离航线，一连几天，就连船长和领航员也不知道我们身在何处，又正驶向哪里。等他们终于认出这片海域，船长一把扯下头巾，扔在甲板上，又揪着自己的胡须。他说，我们闯进了整片大海上最危险的地方，海流正在把船推向毁灭。

            他说得一点也没错。水手们用尽办法，大船还是飞快地冲向一座从海中陡然升起的山。船撞上山脚的岩石，摔得粉碎。幸好撞船之前，我们爬上了岸，也来得及抢出最值钱的财物。
        - id: ch01-b02
          speaker: captain
          text: 我们既然落到这里，还是马上给自己挖坟吧。凡是流落到这片绝地的海员，从来没有一个活着回去。
        - id: ch01-b03
          speaker: sindbad
          text: |-
            听完这番话，所有人都失去了希望，只能哀叹自己的命运。

            那座山挡在一个大岛的海边。我们脚下只有一条狭窄的岩岸，千百艘坚船的残骸散落得到处都是。遇难海员的白骨在阳光下发亮。一想到自己的尸骨很快也会添进那堆白骨，我们便不寒而栗。

            岸边还有无数贵重货物，岩缝里塞满财宝。可在这种地方，财宝越多，景象反而越凄凉。附近有一道清澈的淡水从山里涌出来。它没有流进大海，却忽然拐弯，从一道天然石拱下钻进山腹，再也看不见了。我走近洞口，发现里面的石壁布满钻石、红宝石和大块水晶，地上还散落着龙涎香。

            可我们带不走这些宝物，也爬不过眼前的大山。即使有别的船驶来，也只能和我们的船一样毁在这里。船长把剩下的食物平均分给大家。从那一刻起，每个人能活多久，全看他能把自己的粮食省多久。好在我一向吃得很少。
    - id: ch02
      title: 黑暗河流
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            可等我把最后一位同伴埋葬以后，自己的粮食也快吃光了。我动手给自己挖坟，心里却不知道还能不能活到挖完。我恨透了自己那颗总想漂泊的心，也一遍遍想起家中的舒适生活。

            有一天，我又走到那条河边，看着河水消失在洞穴深处。忽然，我想到，河水既然流进地下，就一定会在远方重新露出地面。我为什么不扎一只木筏，顺着水流逃走呢？留在岸上只有死路一条。就算没能活着见到天光，我也不会损失什么。可要是好运还没有离开我，说不定前面真有一片可以安身的土地。

            我决定赌一次。我用岸上的浮木扎好木筏，再拿随处可见的牢固绳索把它捆紧。随后，我把红宝石、绿宝石、水晶、龙涎香和珍贵织物装成许多包，小心地摆在筏子两边，牢牢系好。我带上两把自己削成的小桨，坐上木筏，解开岸边的绳子。

            水流立刻带着木筏穿过阴森的石拱。四周一片漆黑，我什么也看不见，只感觉急流一直平稳地推着我向前。那段航程仿佛过了许多个白天和黑夜。有一次，水道突然变窄，我差点被夹在木筏和洞顶之间。从此以后，我只敢伏在装满珍宝的包裹上。

            我一路省着粮食，只吃维持性命的一点点，可最后一口食物还是吃完了。我开始害怕，自己终究会饿死在黑暗里。焦虑和疲倦耗尽了我的力气，我终于沉沉睡去。

            等我睁开眼睛，天竟然亮了。眼前是一片美丽的田野，木筏已经被系在河岸上，身边围着一群神情友善的黑人。我站起来向他们问候，他们也回答我，可我一句也听不懂。刚刚还在黑暗中等死，转眼又回到了光明里，我简直不敢相信，只能用阿拉伯语低声对自己说：“合上双眼吧。你睡着的时候，上天自会让命运由凶转吉。”
        - id: ch02-b02
          speaker: native
          text: 兄弟，看见我们不用惊讶。这里就是我们的土地。我们到河边取水时，看见你的木筏顺流而下。有人游过去，把你带上了岸。我们一直守着，等你醒来。现在告诉我们吧，你从哪里来？为什么会走上这么危险的路？
        - id: ch02-b03
          speaker: sindbad
          text: |-
            原来有个当地人听得懂阿拉伯语。我告诉他，我很愿意讲清来龙去脉，可自己快要饿坏了，得先吃点东西。他们马上拿来食物。我吃饱以后，把所有遭遇如实说了一遍。

            其他人听完翻译，惊讶得说不出话来。他们认为，这样离奇的故事，必须由我亲口讲给国王听。于是，他们找来一匹马让我骑上，几名壮汉则把木筏连同上面的东西原样扛在肩头。我们一路走进锡兰城，当地人把我带到国王面前。

            我按照印度的礼节，伏在他脚下亲吻地面。国王叫我起来，坐到他身旁，然后问我的名字。
        - id: ch02-b04
          speaker: sindbad
          text: 我叫辛巴达。人们都叫我“水手”，因为我曾在许多海域远航。
        - id: ch02-b05
          speaker: king
          text: 那你是怎么来到这里的？
        - id: ch02-b06
          speaker: sindbad
          text: 我没有隐瞒，把自己的故事从头到尾讲了一遍。国王听得又惊又喜，还命人用金字记录下我的历险，收进王国的档案库。
    - id: ch03
      title: 锡兰王的厚待
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            不久，我的木筏被抬进宫里，那些包裹也当着国王的面打开了。眼前堆满红宝石和绿宝石。国王说，就算翻遍他的宝库，也找不出这样的珍品。

            我见他看得很有兴致，便斗胆表示，无论是我本人，还是我的全部财物，都听凭他处置。国王听了，只是微微一笑。
        - id: ch03-b02
          speaker: king
          text: 不，辛巴达。上天不会容许我贪图你的财富。我不但不拿你的东西，还要再送你一些。我希望你离开我国时，能带走代表我善意的礼物。
        - id: ch03-b03
          speaker: sindbad
          text: |-
            国王命官员为我安排合适的住处，所有费用都由他承担。他还派来奴仆照料我，把木筏和包裹送到新居。我连声称赞他的慷慨，诚心诚意地道谢。此后，我每天都去朝堂觐见，其余时间便游览城中最值得看的地方。

            锡兰岛坐落在赤道上，白昼和黑夜一样长。都城位于一座美丽山谷的尽头，世上最高的山峰就在岛中央，山谷也由它形成。我因为好奇，爬到了山巅。据说，亚当被逐出乐园以后，就被放逐到这里。

            山里出产红宝石和许多奇珍，也长满罕见的草木、雪松和椰子树。海岸边和河口处，有潜水人下水寻找珍珠。有些山谷里，钻石更是多得惊人。

            过了许多天，我请求国王准我回乡，他很和气地答应了，还送给我许多贵重礼物。临行前，他又把一份王室赠礼和一封书信交给我，请我转呈我们的君主、信士的统帅。
        - id: ch03-b04
          speaker: king
          text: 请把这些交给哈伦·拉希德哈里发，也请代我告诉他，我珍视与他的友谊。
        - id: ch03-b05
          speaker: sindbad
          text: |-
            我恭敬地接下使命，登上国王亲自为我挑选的船。那封信写在一张黄褐色的珍贵兽皮上，字迹是蓝色的。信中说，印度之王出行时有一千头大象开道。他居住的宫殿，屋顶闪耀着十万颗红宝石。宝库里还藏着两万顶钻石王冠。他向哈伦·拉希德哈里发致意，也请哈里发收下这份微薄的礼物，把它看作敬意和友谊的凭证。如果印度之王还配得上这份情谊，也盼哈里发以同样的心意相待。信的末尾写着：“再会，兄弟。”

            国王的礼物中，有一只用整块红宝石雕成的花瓶。它高六英寸，瓶壁有我的手指那么厚，里面装满最上等的珍珠，每颗都又大又圆，光泽无瑕。还有一张巨蛇皮，每片鳞都像一枚金币那么大。据说，睡在上面便不会生病。其余礼物是大量沉香木、樟脑和开心果，最后还有一位美丽的女奴，她的衣袍上缀满宝石。
    - id: ch04
      title: 献给哈里发的礼物
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            经过一段漫长而顺利的航程，我们在巴士拉上岸。我匆匆赶往巴格达，带着国王的书信来到宫门前。那位美丽的女奴跟在后面，我的几名家人也捧着其他宝物一同前来。

            我说明来意，很快便被领到哈里发面前。我先向他行礼，再献上书信和锡兰王的礼物。哈里发仔细看过，便问我，锡兰王是不是真像信中所说的那样富有而强大。
        - id: ch04-b02
          speaker: sindbad
          text: |-
            信士的统帅，请容我向陛下保证，锡兰王对自己的财富与威势没有半点夸大。他的宫殿壮丽无比，世上没有什么能与它相比。

            国王出行时，宝座安放在大象背上，大臣、宠臣和朝臣骑马跟在两旁。大象的颈上坐着一名官员，手里握着金矛。宝座后还站着另一名官员，举着一根金柱，柱顶嵌着一块足有手掌那么长的绿宝石。

            在国王前方，有一千名身穿金线衣袍的男子开道。他们都骑着披挂华美的大象。队伍向前行进时，驾驭国王坐骑的官员会大声呼喊：“请看这位伟大的君王，这位强大英勇的印度苏丹！他的宫殿覆盖着十万颗红宝石，他拥有两万顶钻石王冠。请看吧，他的荣光胜过所罗门和米赫拉杰！”

            站在宝座后面的官员随即回答：“这位如此伟大、如此强盛的国王，也必将死去，必将死去，必将死去！”

            前面的官员便再次高声领唱：“一切赞颂，尽归永生不灭的主。”

            还有一件事，陛下。锡兰根本不需要法官。百姓想求得公正时，会直接去见他们的国王。
        - id: ch04-b03
          speaker: caliph
          text: 我读过这封信，就知道锡兰王是个贤明的人。看来，他配得上他的百姓，他的百姓也配得上他。
        - id: ch04-b04
          speaker: sindbad
          text: 哈里发对我的禀报十分满意。他说完这番话，便赏赐我许多贵重礼物，准我退下。我平平安安地回到了家中。
    - id: ch05
      title: 第六次航行结束
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            辛巴达的故事讲完了。宾客们纷纷告辞，欣巴达照例先领到一百枚金币。

            第二天，大家又回到辛巴达家中，等着听第七次航行的故事。辛巴达这样开了头。
