  chapters:
    - id: ch01
      title: A Physician Comes to Court
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            In the Persian country of Zouman, there once lived a Greek king who suffered from leprosy. Every doctor in the land had tried to cure him, but every remedy had failed. Then a remarkably clever physician came to court.
        - id: ch01-b02
          speaker: narrator
          text: >-
            His name was Douban. He had studied many languages and knew a great deal about healing herbs and medicines. As soon as he heard of the king's illness, he dressed in his finest robe and presented himself before the throne.
        - id: ch01-b03
          speaker: physician_douban
          text: >-
            Your Majesty, I know that none of your physicians has been able to make you well. Follow my instructions, and I promise to cure you without medicine to swallow and without putting anything on your skin.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The king considered this remarkable offer.
        - id: ch01-b05
          speaker: greek_king
          text: >-
            If you are skillful enough to do that, I will make you and all your descendants rich forever.
    - id: ch02
      title: The Cure in the Polo Club
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Douban returned home and made a polo club. He hollowed out its handle and filled the space with the drug he meant to use. Then he made a ball. The next day, he carried them both to the king.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The physician asked the king to play polo. So the king mounted his horse and rode onto the playing ground. Douban came forward with the club he had prepared.
        - id: ch02-b03
          speaker: physician_douban
          text: >-
            Take this club, sire. Strike the ball until your hand and your whole body feel hot. The warmth of your hand will release the remedy hidden in the handle, and it will pass through your body. Then return to the palace, bathe, and sleep. When you wake tomorrow morning, you will be cured.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The king took the club and spurred his horse after the ball Douban had thrown. He struck it, and the courtiers playing with him sent it back. The game continued until the king felt very hot. Then he stopped, returned to the palace, bathed, and followed every instruction the physician had given him.
        - id: ch02-b05
          speaker: narrator
          text: >-
            When the king rose the next morning, he discovered to his joy and amazement that the leprosy was completely gone. He entered the audience chamber, where the courtiers were waiting eagerly to learn whether the marvelous cure had worked. When they saw him, they were overcome with joy.
    - id: ch03
      title: Honor and Envy
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Physician Douban entered the hall and bowed until he was close to the ground. The king called him forward, seated him at his side, and treated him with every possible honor.
        - id: ch03-b02
          speaker: narrator
          text: >-
            That evening, the king gave Douban a splendid long robe of state and two thousand sequins. The next day, he continued to shower the physician with favors.
        - id: ch03-b03
          speaker: narrator
          text: >-
            But the king's grand vizir was greedy, envious, and thoroughly wicked. He became bitterly jealous of Douban and resolved to destroy him. To begin his plot, he asked to speak with the king alone, claiming that he had something of the greatest importance to report.
        - id: ch03-b04
          speaker: greek_king
          text: >-
            What is this important matter?
        - id: ch03-b05
          speaker: grand_vizir
          text: >-
            Sire, a monarch puts himself in terrible danger when he trusts a man whose loyalty has never been proved. How can you know that this physician is not a traitor who came here to murder you?
    - id: ch04
      title: The Vizir's Warning
      blocks:
        - id: ch04-b01
          speaker: greek_king
          text: >-
            I am certain that Douban is the most faithful and honorable of men. If he wanted me dead, why would he have cured me? Say no more against him. I understand what is happening. You are jealous of him, but you will not turn me against him.
        - id: ch04-b02
          speaker: greek_king
          text: >-
            I remember what a vizir once told his master, King Sindbad, when he wished to keep the king from putting his own son to death.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The king's words made the grand vizir curious.
        - id: ch04-b04
          speaker: grand_vizir
          text: >-
            Sire, will Your Majesty graciously tell me what that vizir said to King Sindbad?
        - id: ch04-b05
          speaker: greek_king
          text: >-
            He warned King Sindbad not to believe everything a mother-in-law says. Then he told him this story.
