  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    greek_king:
      display_name: Greek King
      tts:
        delivery: regal, candid, and decisive
        timbre: full and resonant
