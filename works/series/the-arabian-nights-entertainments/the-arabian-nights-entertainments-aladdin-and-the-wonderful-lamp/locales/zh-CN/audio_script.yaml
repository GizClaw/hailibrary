audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    aladdin:
      display_name: 阿拉丁
      tts:
        delivery: 年轻坦率，从顽皮莽撞渐渐变得果断自信
        timbre: 清朗明亮
        pace: 适中偏快
        pitch: 中音
    aladdin_mother:
      display_name: 阿拉丁的母亲
      tts:
        delivery: 朴实慈爱，忧虑时直白恳切
        timbre: 温暖柔和，略带沧桑
        pace: 适中
        pitch: 中音
    african_magician:
      display_name: 非洲魔法师
      tts:
        delivery: 圆滑善诱，暴怒时阴狠凌厉
        timbre: 低沉干涩
        pace: 适中
        pitch: 中低音
    ring_genie:
      display_name: 戒指精灵
      tts:
        delivery: 威严直接，回应命令时简洁恭顺
        timbre: 浑厚空灵
        pace: 稳健
        pitch: 低音
    lamp_genie:
      display_name: 神灯精灵
      tts:
        delivery: 威严有力，服从时庄重，震怒时如雷鸣
        timbre: 洪亮深沉
        pace: 稳健
        pitch: 低音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严多变，和悦时宽厚，发怒时强硬
        timbre: 洪亮厚重
        pace: 稳健
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 端庄真挚，受惊时克制，决断时沉着勇敢
        timbre: 明丽清澈
        pace: 适中
        pitch: 中高音
    queen:
      display_name: 王后
      tts:
        delivery: 慈爱端庄，追问时关切直接
        timbre: 柔和丰润
        pace: 舒缓
        pitch: 中音
    townsman:
      display_name: 城中人
      tts:
        delivery: 热心爽快，说起奇观时兴致勃勃
        timbre: 明亮朴实
        pace: 稍快
        pitch: 中音
    maid_1:
      display_name: 女奴甲
      tts:
        delivery: 活泼直率，发笑时轻快
        timbre: 清脆
        pace: 稍快
        pitch: 中高音
    maid_2:
      display_name: 女奴乙
      tts:
        delivery: 机灵随和，说话简洁自然
        timbre: 柔亮
        pace: 适中
        pitch: 中高音
    chief_jeweler:
      display_name: 珠宝匠领头人
      tts:
        delivery: 恭敬务实，说明困难时坦诚谨慎
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中音
    second_magician:
      display_name: 魔法师的弟弟
      tts:
        delivery: 阴沉狠毒，伪装时刻意温和庄重
        timbre: 冷硬低哑
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 假叔叔与地下宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            从前，有个穷裁缝，他的儿子名叫阿拉丁。阿拉丁又懒又贪玩，整天只跟街上的闲伙伴混在一起，什么事也不肯做。父亲为他愁坏了，最后忧郁而死。母亲流过许多眼泪，也一次次苦劝他，可他还是不肯改。

            一天，阿拉丁又在街头玩，一个陌生人走过来，先问他多大，又问他是不是裁缝穆斯塔法的儿子。
        - id: ch01-b02
          speaker: aladdin
          text: 是的，先生。不过，我父亲早就去世了。
        - id: ch01-b03
          speaker: narrator
          text: 这人其实是非洲一位很有名的魔法师。他一听，马上搂住阿拉丁又亲又抱。
        - id: ch01-b04
          speaker: african_magician
          text: 我就是你叔叔啊。你和我哥哥长得太像了，我一眼就认出了你。快回家告诉你母亲，我马上去看她。
        - id: ch01-b05
          speaker: narrator
          text: 阿拉丁飞奔回家，把突然冒出来的叔叔告诉了母亲。
        - id: ch01-b06
          speaker: aladdin_mother
          text: 你父亲的确有个兄弟，可我一直以为他早已不在人世了。
        - id: ch01-b07
          speaker: narrator
          text: |-
            母亲心里虽然疑惑，还是备好了晚饭，让阿拉丁去找那人。魔法师带着酒和水果进了门，先俯身亲吻穆斯塔法以前坐过的地方。他说自己离乡四十年了，所以嫂嫂从没见过他，一点也不奇怪。

            接着，他问阿拉丁学了什么手艺。阿拉丁羞得低下头，母亲忍不住哭起来。魔法师听说这孩子什么都不肯学，便答应替他租铺子、备货物，让他做生意。第二天，他给阿拉丁买了漂亮衣裳，又领他看遍全城，直到黄昏才送他回家。母亲看到儿子这么体面，高兴极了。
        - id: ch01-b08
          speaker: narrator
          text: |-
            又过一天，魔法师带阿拉丁出了城。他们走过几座美丽的花园，在喷泉旁分吃了一块饼，然后继续走向群山。阿拉丁累得再也不想挪步，一再求他回家，魔法师却不断讲着有趣的故事，硬把他带到了两山之间的狭谷。
        - id: ch01-b09
          speaker: african_magician
          text: 就到这里。我让你看一样奇妙的东西。你去捡些枯枝，我来点火。
        - id: ch01-b10
          speaker: narrator
          text: |-
            火烧起来后，魔法师往里面撒了一撮粉末，又念出咒语。大地轻轻震动，突然裂开，露出一块方正的平石，石板中央嵌着黄铜环。阿拉丁吓得转身就逃，魔法师一把抓住他，狠狠将他打倒。
        - id: ch01-b11
          speaker: aladdin
          text: 叔叔，我到底做错了什么？
          emotion: fearful
        - id: ch01-b12
          speaker: african_magician
          text: 别怕，只要照我的话做。石板下面有一宗宝物，命中注定归你，别人谁也碰不了。所以我怎么吩咐，你就怎么做。
        - id: ch01-b13
          speaker: narrator
          text: 阿拉丁一听见“宝物”，立刻忘了害怕。他照着吩咐，念出父亲和祖父的名字，再握住铜环，轻轻松松就提起了石板。下面露出一段台阶。
        - id: ch01-b14
          speaker: african_magician
          text: |-
            你下去。台阶尽头的门开着，后面有三间大厅。先把长袍下摆束好，穿过去时什么也别碰，不然你马上就会死。

            大厅后面是座果园。一直往前走，露台墙上有个壁龛，里面放着一盏点燃的灯。把油倒掉，把灯拿回来交给我。
        - id: ch01-b15
          speaker: narrator
          text: 魔法师从手上褪下一枚戒指，交给阿拉丁，还祝他顺利。阿拉丁走下去，所见果然和他说的一模一样。他从树上摘了几颗果子，又取到那盏灯，终于回到洞口。魔法师早已等得不耐烦了。
        - id: ch01-b16
          speaker: african_magician
          text: 快，把灯先给我！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 阿拉丁自己还在洞底，双手又被灯和果子占满，根本没法把灯先递上去。他坚持要魔法师先拉自己出去，再把灯交给他。魔法师顿时暴跳如雷。他又把粉末撒进火中，念了一句咒语，石板轰的一声滚回原处，把阿拉丁独自封在地下。
        - id: ch01-b18
          speaker: narrator
          text: |-
            魔法师离开波斯，再没回来。原来，他根本不是阿拉丁的叔叔，而是个阴险的术士。他从魔法书里知道，世上藏着一盏神灯，得到它的人会成为天下最有权势的人。灯藏在哪里，只有他知道，可又必须由别人亲手交给他，自己不能去拿。他挑中无知的阿拉丁，就是想利用这孩子取灯，再将他杀死。

            阿拉丁被困在黑暗中，哭喊了两天。最后，他合起双手祈祷，无意间擦到魔法师忘记拿回去的戒指。顷刻间，一个身形巨大、面目可怕的精灵从地下升了起来。
        - id: ch01-b19
          speaker: ring_genie
          text: 你要我做什么？我是这枚戒指的奴仆，无论什么事，都听你的命令。
        - id: ch01-b20
          speaker: aladdin
          text: 带我离开这里！
        - id: ch01-b21
          speaker: narrator
          text: 话音刚落，大地裂开，阿拉丁已经回到地面。他的眼睛好不容易适应阳光，便赶回家，可刚跨过门槛就昏倒了。
    - id: ch02
      title: 神灯的力量
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            阿拉丁醒来后，把事情从头到尾告诉母亲，又拿出那盏旧灯和从花园摘来的果子。那些果子其实全是宝石。说完这些，他才说自己饿了，向母亲要吃的。
        - id: ch02-b02
          speaker: aladdin_mother
          text: 唉，孩子，家里什么吃的都没有了。不过我纺了些棉线，还可以拿去卖。
        - id: ch02-b03
          speaker: narrator
          text: 阿拉丁叫母亲留下棉线，说不如卖掉旧灯。灯上都是污垢，母亲想先擦干净，好多卖几个钱。她刚擦了几下，一个丑陋的精灵便出现在眼前，问她有什么吩咐。母亲当场吓昏，阿拉丁赶紧抢过神灯。
        - id: ch02-b04
          speaker: aladdin
          text: 给我拿吃的来！
        - id: ch02-b05
          speaker: narrator
          text: 一眨眼，精灵送来一只银碗、十二只装满珍馐的银盘、两只银杯和两瓶酒。刚才还空空的家里，一下摆满了足够他们吃上许久的食物。母亲醒来，看着面前的宴席，惊得不敢相信。
        - id: ch02-b06
          speaker: aladdin_mother
          text: 这么丰盛的一桌饭，到底是从哪里来的？
          emotion: surprised
        - id: ch02-b07
          speaker: aladdin
          text: 先别问了，我们只管吃吧。
        - id: ch02-b08
          speaker: narrator
          text: 母子俩从早上一直吃到中午。阿拉丁又说出神灯的秘密。母亲求他赶快卖掉这个邪物，以后再也别同魔鬼来往。
        - id: ch02-b09
          speaker: aladdin
          text: 我不卖。既然机缘让我们知道它有这样的法力，就该好好利用，戒指也是一样。我会一直把戒指戴在手上。
        - id: ch02-b10
          speaker: narrator
          text: 精灵送来的食物吃完后，阿拉丁卖掉一只银盘。钱用光了，他便再卖一只。他不知道这些银盘真正值多少钱，只求能换来眼前的生活。直到十二只全都卖完，他才又召来神灯精灵，得到另一套银盘。母子二人依靠神灯，就这样生活了许多年。
    - id: ch03
      title: 苏丹的承诺
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            一天，苏丹下令说，公主要出宫沐浴，来回的路上，所有人都得待在家中，还要关严百叶窗。公主总用面纱遮脸，外人很难看见她。阿拉丁却忽然生出一个强烈的念头，非看她一眼不可。

            他藏在浴室门后，从缝隙里偷偷望去。公主进门时掀起面纱，那张脸美得惊人。阿拉丁只看一眼，就深深爱上了她。
        - id: ch03-b02
          speaker: narrator
          text: |-
            回到家以后，阿拉丁像变了个人，母亲吓得不知如何是好。他说自己爱公主爱得没有她便活不下去，一定要请苏丹把公主嫁给他。母亲听得大笑起来，可禁不住他再三央求，终于答应进宫求亲。

            她把魔法花园里的宝石果子包在布巾中，准备献给苏丹。到了大殿，她站在苏丹面前，苏丹却根本没理会。接下来一连七天，她天天都去，总站在同一个地方。
        - id: ch03-b03
          speaker: sultan
          text: 我每天都看见一个女人站在大殿里，手里还捧着布包。她下次再来，你把她叫到前面，我想听听她有什么事。
        - id: ch03-b04
          speaker: narrator
          text: 第二天，大维齐尔向她示意，她便走到御座前跪下。
        - id: ch03-b05
          speaker: sultan
          text: 起来吧，好心的妇人。你有什么请求，只管告诉我。
        - id: ch03-b06
          speaker: narrator
          text: 她迟迟不敢开口。苏丹让维齐尔以外的人全都退下，又叫她不必害怕，不论她要说什么，自己都先赦她无罪。她这才说起儿子怎样痴恋公主。
        - id: ch03-b07
          speaker: aladdin_mother
          text: 我怎样劝，阿拉丁都不肯忘掉公主。他甚至说，如果我不来求陛下把公主嫁给他，他就会做出不要性命的傻事。求陛下开恩，饶恕我，也饶恕我的儿子。
        - id: ch03-b08
          speaker: narrator
          text: 苏丹和颜悦色地问布巾里装着什么。她打开布巾，把宝石献了上去。苏丹看得目瞪口呆，转头问维齐尔。
        - id: ch03-b09
          speaker: sultan
          text: 你怎么看？这个人送来如此厚重的礼物，表明公主在他心里有多珍贵。我难道不该把公主嫁给他吗？
        - id: ch03-b10
          speaker: narrator
          text: 大维齐尔一心要让自己的儿子娶公主，便请苏丹暂缓三个月。他盼着儿子能在这段时间献上一份更贵重的礼物。苏丹答应下来，告诉阿拉丁的母亲，婚事已经允准，但三个月内她不要再来。
        - id: ch03-b11
          speaker: narrator
          text: |-
            阿拉丁耐心等了快到三个月。没想到才过两个月，母亲进城买油，却看见人人喜气洋洋。她问出了什么事。
        - id: ch03-b12
          speaker: townsman
          text: 你还不知道吗？大维齐尔的儿子今晚就要迎娶公主了！
        - id: ch03-b13
          speaker: narrator
          text: 母亲喘着气跑回家，把消息告诉阿拉丁。阿拉丁起初像挨了一记重击，接着突然想起神灯。他擦亮灯，精灵立刻出现。
        - id: ch03-b14
          speaker: lamp_genie
          text: 主人，请吩咐。
        - id: ch03-b15
          speaker: aladdin
          text: 苏丹违背了对我的承诺，要把公主嫁给维齐尔的儿子。今晚，把新娘和新郎连同婚床一起带到这里来。
        - id: ch03-b16
          speaker: lamp_genie
          text: 主人，我遵命。
        - id: ch03-b17
          speaker: narrator
          text: 到了午夜，精灵果然把婚床、新郎和公主一同搬进阿拉丁的房间。
        - id: ch03-b18
          speaker: aladdin
          text: 把新郎带到外面，让他在寒风里待一夜，天亮再送回来。
        - id: ch03-b19
          speaker: narrator
          text: 精灵立刻抓走维齐尔的儿子，只留下阿拉丁和公主。
        - id: ch03-b20
          speaker: aladdin
          text: 您别怕。您本来就该是我的妻子，是您那失信的父亲把您许配给了我。我绝不会伤害您。
        - id: ch03-b21
          speaker: narrator
          text: |-
            公主吓得一句话也说不出，度过了一生中最凄惨的一夜，阿拉丁却躺在她身旁睡得很香。到了约好的时辰，精灵把冻得发抖的新郎送回来，再把婚床搬回王宫。

            不久，苏丹来看女儿。维齐尔的儿子赶紧起身躲开，公主却满脸悲伤，一句话也不说。苏丹只好让王后去问她。
        - id: ch03-b22
          speaker: queen
          text: 孩子，你为什么不肯跟父亲说话？昨夜到底出了什么事？
        - id: ch03-b23
          speaker: narrator
          text: 公主深深叹气，把婚床怎样被搬到一所陌生屋子，维齐尔的儿子怎样被带走，还有阿拉丁怎样睡在她身边，全告诉了母亲。王后一个字也不信，只叫她快起床，别把荒唐的梦当成真事。
        - id: ch03-b24
          speaker: narrator
          text: |-
            第二夜，同样的事一点不差地重演。第二天早上，公主还是不肯开口，苏丹便威胁要砍掉她的头。她只得说出实情，还让父亲去问维齐尔的儿子。

            那青年承认一切都是真的。他说自己虽然深爱公主，却宁死也不愿再熬一夜，因此请求解除婚约。苏丹答应了，婚宴和欢庆全都停了下来。
    - id: ch04
      title: 婚礼与奇迹宫殿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            三个月期满，阿拉丁让母亲进宫，提醒苏丹别忘了约定。她仍站在从前的位置。苏丹看到她，才猛然想起阿拉丁。可见她如此贫寒，他更不愿履行承诺，便去问维齐尔怎么办。维齐尔劝他开出一份世上无人付得起的聘礼。
        - id: ch04-b02
          speaker: sultan
          text: |-
            好心的妇人，苏丹不会忘记承诺，我当然会信守前言。不过，你儿子先要送来四十只金盆，每只都得装满珠宝。再由四十名黑奴顶着金盆，前面由四十名白奴引路，所有人都要穿得华贵。

            回去把这些告诉他，我等着他的答复。
        - id: ch04-b03
          speaker: narrator
          text: 阿拉丁的母亲深深鞠躬，转身回家。她心里认定这件事已经彻底没希望了。
        - id: ch04-b04
          speaker: aladdin_mother
          text: 那就让苏丹等着吧。恐怕他等一辈子，也等不到你的答复！
        - id: ch04-b05
          speaker: aladdin
          text: 母亲，他不会等那么久。为了公主，再难得多的事情，我也愿意做。
        - id: ch04-b06
          speaker: narrator
          text: 阿拉丁召出神灯精灵。片刻之间，八十名奴仆便站满了小屋和花园。他让他们两人一排走向王宫，母亲跟在队伍后面。众人衣着华美，腰带上全是耀眼的珠宝。街上的人纷纷挤过来，看他们和头顶的金盆。
        - id: ch04-b07
          speaker: narrator
          text: 奴仆进宫跪拜后，把四十只盛满宝石的金盆呈在苏丹面前，再抱着双臂，在御座四周排成半圆。金盆、珠宝和八十名衣着华贵的奴仆，全都和苏丹要求的一样。阿拉丁的母亲上前，把他们作为聘礼献给苏丹。苏丹再没有半点迟疑。
        - id: ch04-b08
          speaker: sultan
          text: 好心的妇人，回去告诉你儿子，我张开双臂等他来。
        - id: ch04-b09
          speaker: narrator
          text: 母亲赶回家，催阿拉丁立刻进宫。阿拉丁却先召来了精灵。
        - id: ch04-b10
          speaker: aladdin
          text: |-
            给我备一池加了香料的浴水、一套华丽刺绣的礼服，还有一匹比苏丹坐骑更好的骏马。我要二十名奴仆跟在身边，再派六名穿着漂亮的女奴服侍我母亲。

            最后，再给我十袋金币，每袋一千枚。
        - id: ch04-b11
          speaker: narrator
          text: |-
            阿拉丁刚说完，一切都准备好了。他骑着骏马穿过全城，随从一路撒下金币。小时候陪他玩耍的人，没有一个认得出他。如今，他已经长成一位英俊的青年。

            苏丹亲自走下御座拥抱他，又领他进入摆好宴席的大厅，打算当天就让他和公主完婚。
        - id: ch04-b12
          speaker: aladdin
          text: 我得先为公主建一座配得上她的宫殿，之后才能成婚。
        - id: ch04-b13
          speaker: narrator
          text: 阿拉丁向苏丹告辞回家，再次吩咐神灯精灵。
        - id: ch04-b14
          speaker: aladdin
          text: |-
            替我建一座最上等大理石的宫殿，里面镶上碧玉、玛瑙和各种宝石。中央要有圆顶大厅，四壁用厚厚的金银砌成，每面墙开六扇窗。窗格都镶满钻石和红宝石，只留一扇不要完工。

            马厩、骏马、马夫和奴仆也都要备齐。快去办吧。
        - id: ch04-b15
          speaker: narrator
          text: |-
            第二天，宫殿已经落成。精灵领阿拉丁四处查看，每一道命令都完成了，就连新宫殿通往苏丹王宫的天鹅绒地毯也铺好了。

            阿拉丁的母亲盛装走在女奴中间，阿拉丁骑马跟在后面。苏丹派乐师吹响号角、敲起铙钹，满城都是音乐和欢呼。入夜后，公主向父亲告别，与阿拉丁的母亲并肩走上地毯，身后跟着一百名奴仆。她见到迎面而来的阿拉丁，立刻被他的风采打动。
        - id: ch04-b16
          speaker: aladdin
          text: 公主，如果我的大胆冒犯了您，那就请责怪您自己的美貌吧。
        - id: ch04-b17
          speaker: princess
          text: 如今我亲眼见到了你，愿意在这件事上听从父亲的安排。
        - id: ch04-b18
          speaker: narrator
          text: 婚礼正式举行后，阿拉丁带公主进入摆好盛宴的大厅。两人共进晚餐，又一直跳舞到午夜。
        - id: ch04-b19
          speaker: narrator
          text: 第二天，阿拉丁请苏丹来看宫殿。苏丹走进二十四扇窗的大厅，只见红宝石、钻石和祖母绿在窗上闪耀，不禁惊叹起来。
        - id: ch04-b20
          speaker: sultan
          text: 这真是世间奇观！可我不明白，那一扇窗为什么没有完成？是工匠不小心漏掉了吗？
          emotion: surprised
        - id: ch04-b21
          speaker: aladdin
          text: 不是，陛下。这是我特意留下的，我想把完成宫殿的荣耀留给您。
        - id: ch04-b22
          speaker: narrator
          text: 苏丹听了很高兴，立刻召来全城最好的珠宝匠，要他们把那扇窗装饰得同其他窗户一样。
        - id: ch04-b23
          speaker: chief_jeweler
          text: 陛下，我们没有足够的宝石，实在无法照着其他窗户完成它。
        - id: ch04-b24
          speaker: narrator
          text: |-
            苏丹拿出自己的珠宝，可工匠很快全用光了，仍旧无济于事。一个月过去，工程连一半都没完成。阿拉丁知道他们办不到，就让人拆掉做好的部分，将宝石全部还给苏丹，再命精灵把窗户完成。

            苏丹看见自己的珠宝一件不少地送回来，十分惊讶。他亲自赶到宫殿，看见那扇完美的窗，立刻拥抱阿拉丁。只有嫉妒未消的大维齐尔，还在一旁暗示这一切都是魔法。

            阿拉丁待人温和有礼，很受百姓爱戴。他成了苏丹军队的统帅，打赢过好几场战役，却始终谦逊和善。就这样，他平安满足地过了好几年。
    - id: ch05
      title: 旧灯换新灯
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            远在非洲的魔法师忽然想起阿拉丁。他施法一查，才发现阿拉丁不但没有死在地洞里，反而娶了公主，过着富贵尊荣的生活。他知道，穷裁缝的儿子能得到这一切，一定是借了神灯的力量。

            魔法师日夜兼程赶到中国的都城，一心要毁掉阿拉丁。走在街上时，他听见人们都在谈论一座不可思议的宫殿。
        - id: ch05-b02
          speaker: african_magician
          text: 请原谅我见识少。你们说的是哪一座宫殿？
        - id: ch05-b03
          speaker: townsman
          text: 你没听过阿拉丁王子的宫殿吗？那可是天下第一奇观。你想去看的话，我可以给你指路。
        - id: ch05-b04
          speaker: narrator
          text: 魔法师道过谢，顺着那人所指的方向走去。他亲眼看见宫殿以后，马上认定它只能是神灯精灵建造的，气得几乎发疯。阿拉丁原本该死在黑暗的地洞里，如今却拥有这般富贵，更叫他无法忍受。他决定抢回神灯，再把阿拉丁打回一无所有的日子。
        - id: ch05-b05
          speaker: narrator
          text: |-
            恰好阿拉丁出门狩猎，要八天才回来。魔法师买来十几盏新铜灯，装进篮子，在宫殿外沿街叫卖旧灯换新灯。人们跟在后面，不停地笑话他。

            公主正在二十四扇窗的大厅里，听见外面吵闹，便派一个女奴去看。女奴回来时还笑个不停，公主为此责备了她。
        - id: ch05-b06
          speaker: maid_1
          text: 夫人，外面有个老傻瓜，居然拿崭新的灯换破旧的灯。这叫人怎么忍得住不笑呢？
        - id: ch05-b07
          speaker: maid_2
          text: 飞檐上正好放着一盏旧灯，可以拿去跟他换。
        - id: ch05-b08
          speaker: narrator
          text: 那正是神灯。阿拉丁去打猎，没法把灯带在身上，便留在了飞檐上。公主不知道它有多珍贵，笑着让女奴拿去换。
        - id: ch05-b09
          speaker: maid_1
          text: 给我一盏新灯，换走这盏旧的吧。
        - id: ch05-b10
          speaker: narrator
          text: |-
            魔法师一把夺过神灯，随她挑了一盏新的。旁人还在笑，他根本不在意，马上停止叫卖，直接出了城。

            他来到没人的荒地，一直等到天黑，才拿出神灯擦了擦。精灵现身后，依照他的命令，把魔法师、整座宫殿和宫殿里的公主，一同搬到非洲荒凉的地方。
        - id: ch05-b11
          speaker: narrator
          text: |-
            第二天清早，苏丹从窗口望出去，阿拉丁的宫殿竟消失得无影无踪。他揉揉眼睛，马上叫来大维齐尔。维齐尔看过以后也惊呆了，又说这一定是魔法。这一次，苏丹相信了。

            他派三十名骑兵捉拿阿拉丁。骑兵迎面碰上打猎归来的阿拉丁，把他捆住，逼他戴着镣铐步行进城。爱戴阿拉丁的百姓全拿起武器跟在后面，生怕他受到伤害。
        - id: ch05-b12
          speaker: narrator
          text: 阿拉丁被押到苏丹面前。苏丹甚至没有先告诉他罪名，立刻命刽子手砍下他的头。刽子手让他跪下，蒙住他的眼睛，又举起弯刀，刀锋眼看就要落下。就在这时，大维齐尔发现百姓已经冲进庭院，正爬上宫墙，要来救阿拉丁，连忙命刽子手住手。人群的神情太凶猛，苏丹只得让步，当着众人的面赦免阿拉丁，命人解开他。
        - id: ch05-b13
          speaker: narrator
          text: 阿拉丁这才请求苏丹告诉他，自己到底犯了什么罪。
        - id: ch05-b14
          speaker: sultan
          text: 你这个奸诈的恶徒，到这里来！
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: 苏丹把他带到窗前，指着宫殿原来所在的地方。阿拉丁惊骇万分，一句话也说不出来。
        - id: ch05-b16
          speaker: sultan
          text: 我的宫殿和女儿在哪里？宫殿我可以不在意，可女儿一定要回来。你若找不到她，就得丢掉脑袋！
          emotion: angry
        - id: ch05-b17
          speaker: narrator
          text: |-
            阿拉丁请求给他四十天寻找公主，还答应若找不到，就回来任凭处死。苏丹准了。

            阿拉丁悲伤地离开王宫，三天里像疯了一样到处游荡，见人便问自己的宫殿去了哪里。人们只会笑他，同时又可怜他。最后，他走到河边跪下祈祷，准备祷告完便投河自尽。跪下时，他无意中擦到一直戴在手上的魔法戒指。
        - id: ch05-b18
          speaker: narrator
          text: 曾在地洞中出现的精灵立刻来到他面前，问他有什么吩咐。
        - id: ch05-b19
          speaker: aladdin
          text: 精灵，救救我的命，把我的宫殿搬回来。
        - id: ch05-b20
          speaker: ring_genie
          text: 这件事我办不到。我只是戒指的奴仆，你得去求神灯的奴仆。
        - id: ch05-b21
          speaker: aladdin
          text: 那么，把我送到宫殿那里，放在我妻子的窗下。这件事你总办得到吧？
        - id: ch05-b22
          speaker: narrator
          text: 一眨眼，阿拉丁已经来到非洲，正好落在公主窗下。一路积下的疲惫涌了上来，他倒头便睡。
    - id: ch06
      title: 宫殿重归故土
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            鸟儿的歌声唤醒了阿拉丁，他的心情轻松了许多。现在他很清楚，所有灾祸都是丢了神灯引起的，可他还是猜不到是谁偷走了灯。

            那天，公主醒得比平常早。被带到非洲后，她每天都不得不见魔法师一次，可她对他冷若冰霜，吓得他不敢一直住在宫中。公主梳妆时，一个侍女朝窗外看去，发现了阿拉丁。公主立刻跑去推窗。声响惊醒阿拉丁，他抬起头，公主赶快叫他上楼。这对爱侣终于重逢，喜悦简直无法形容。
        - id: ch06-b02
          speaker: narrator
          text: 阿拉丁亲吻过公主，马上问起那件最要紧的事。
        - id: ch06-b03
          speaker: aladdin
          text: 公主，看在真主的分上，先别谈别的。为了您，也为了我，请告诉我，我打猎前留在二十四扇窗大厅飞檐上的旧灯，现在到哪里去了？
        - id: ch06-b04
          speaker: princess
          text: 唉，是我无意中给我们招来了这场灾祸。
          emotion: sad
        - id: ch06-b05
          speaker: narrator
          text: 公主把旧灯换新灯的经过全说了。
        - id: ch06-b06
          speaker: aladdin
          text: 我明白了！这一切都是那个非洲魔法师干的。神灯现在在哪里？
          emotion: surprised
        - id: ch06-b07
          speaker: princess
          text: |-
            他把灯贴身带着，我亲眼见他从怀里拿出来给我看。他要我背弃你、嫁给他，还说父亲已经下令砍了你的头。

            他每次来都说你的坏话，我只有流泪。要是我一直不肯答应，他迟早会用强。
        - id: ch06-b08
          speaker: narrator
          text: 阿拉丁安慰了她，暂时离开宫殿。他跟城里遇见的第一个人换了衣服，又买来一种药粉，然后回到宫中。公主从一道小侧门接他进去。
        - id: ch06-b09
          speaker: aladdin
          text: |-
            换上您最漂亮的衣裳，带着笑迎接魔法师，让他以为您已经忘了我。请他陪您吃晚餐，就说想尝尝他家乡的酒。

            他会去取酒。等他走了，我再告诉您下一步怎么做。
        - id: ch06-b10
          speaker: narrator
          text: |-
            公主认真听完。阿拉丁走后，她第一次换上来到非洲以后最鲜艳的衣裳，系好钻石腰带，又戴上钻石头饰。魔法师来了，她便迎上前去。她的态度突然改变，魔法师惊喜万分。
        - id: ch06-b11
          speaker: princess
          text: |-
            我已经想通了。阿拉丁一定死了，流再多眼泪也不能让他回来，我不想再这样哀悼下去。所以，今晚请你陪我用餐吧。

            不过，我已经喝腻了中国的酒，很想尝尝非洲的好酒。
        - id: ch06-b12
          speaker: narrator
          text: 魔法师听见公主想喝家乡的酒，立刻飞奔到酒窖取酒。趁他离开，公主把阿拉丁给的药粉倒进自己的杯子。魔法师回来后，公主请他用非洲酒为自己的健康干杯，又把自己的酒杯递给他，同他交换杯子，表示两人已经和好。魔法师满心以为她终于答应了自己，丝毫没有怀疑。
        - id: ch06-b13
          speaker: narrator
          text: 魔法师举杯前，滔滔不绝地赞美公主的容貌。公主打断了他。
        - id: ch06-b14
          speaker: princess
          text: 让我先喝。喝完以后，你想说多久都行。
        - id: ch06-b15
          speaker: narrator
          text: 公主把杯子举到唇边，却一直没有喝。魔法师将手中的酒一饮而尽，随即向后一倒，再也没有气息。
        - id: ch06-b16
          speaker: narrator
          text: |-
            公主打开门，扑上去搂住阿拉丁。阿拉丁轻轻推开她，让她先离开，因为自己还有事情要办。他走到魔法师的尸体旁，从背心里取出神灯，命精灵把宫殿和其中所有人、所有东西一并搬回中国。

            精灵照办了。公主留在自己的房间里，只觉得宫殿先后轻轻震动了两下。除此之外，她什么也没有察觉，更没想到整座宫殿已经越过遥远的路途，回到了中国原来的位置。
        - id: ch06-b17
          speaker: narrator
          text: |-
            苏丹独自在小书房里，为失去女儿而伤心。他偶然抬头一看，忍不住揉了揉眼睛。宫殿竟像从前一样，端端正正立在原处。

            苏丹急忙赶过去。阿拉丁和公主并肩站在二十四扇窗的大厅里迎接他。阿拉丁讲完全部经过，又让他亲眼看魔法师的尸体。苏丹这才完全相信，下令全国欢宴十天。

            看来，阿拉丁从此能平安过完一生了。可是，这个故事还没有结束。
    - id: ch07
      title: 假法蒂玛
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: |-
            非洲魔法师还有个弟弟。他比哥哥更邪恶，心计也更深。他赶到中国，要替哥哥报仇，又去拜访一位叫法蒂玛的虔诚女子，想要利用她。

            他闯进法蒂玛独居的小屋，把匕首抵在她胸前，逼她立刻起身，完全听从命令，否则就要杀她。接着，他跟她交换衣服，把脸涂成她的模样，又蒙上她的面纱。为了不让秘密泄露，他还是杀死了她。
        - id: ch07-b02
          speaker: narrator
          text: |-
            魔法师假扮成法蒂玛，朝阿拉丁的宫殿走去。百姓以为他真是那位圣洁的女子，纷纷围过来亲吻他的手，请他赐福。到了宫殿外，他身边已经喧闹不堪。

            公主派女奴从窗口探问。女奴说，那位圣洁的女子来了，据说她只要用手一摸，就能治好人的病。公主早就想见法蒂玛，立刻派人请她进宫。
        - id: ch07-b03
          speaker: narrator
          text: 假法蒂玛来到公主面前，为她的健康和福祉祈祷。公主请他坐在身边，还求他永远留在宫中。他正求之不得，马上答应，只因怕身份败露，始终不肯揭开面纱。公主领他参观大厅，问他觉得怎么样。
        - id: ch07-b04
          speaker: second_magician
          text: 这里的确美极了。不过依我看，还少一样东西。
        - id: ch07-b05
          speaker: princess
          text: 少的是什么？
        - id: ch07-b06
          speaker: second_magician
          text: 只要在圆顶正中挂上一枚大鹏鸟蛋，这里就会成为天下第一奇观。
        - id: ch07-b07
          speaker: narrator
          text: |-
            从此，公主满心只想着大鹏鸟蛋。阿拉丁打猎回来，发现她心情糟透了。他问了又问，公主才说，因为大厅圆顶下没有大鹏鸟蛋，她觉得宫里所有乐趣都消失了。
        - id: ch07-b08
          speaker: aladdin
          text: 如果只是这件事，您很快就会高兴起来。
        - id: ch07-b09
          speaker: narrator
          text: 阿拉丁离开公主，擦亮神灯。精灵出现后，他命精灵带来一枚大鹏鸟蛋。精灵突然发出可怕的怒吼，震得整座大厅都摇晃起来。
        - id: ch07-b10
          speaker: lamp_genie
          text: |-
            恶徒！我为你做了这么多，难道还不够？你竟敢叫我把自己的主人带来，挂在圆顶中央！你、你的妻子，还有整座宫殿，都该被烧成灰。

            不过，这不是你自己生出的念头。是那个死去的非洲魔法师的弟弟教唆了你。他就在宫中，假扮成被他杀害的圣洁女子。他把这个念头塞进你妻子心里，一心要取你的性命。你要小心！
          emotion: angry
        - id: ch07-b11
          speaker: narrator
          text: 精灵说完便消失了。阿拉丁回到公主身边，假装自己头疼，请她叫圣洁的法蒂玛来，用手替他医治。魔法师一靠近，阿拉丁猛地夺过他的匕首，一刀刺进他的心脏。
        - id: ch07-b12
          speaker: princess
          text: 你做了什么？你杀了那位圣洁的女子！
          emotion: surprised
        - id: ch07-b13
          speaker: aladdin
          text: 不，她根本不是圣洁的女子，而是个邪恶的魔法师。
        - id: ch07-b14
          speaker: narrator
          text: |-
            阿拉丁把公主怎样受骗，全都解释给她听。

            从此，阿拉丁和妻子平安地生活在一起。苏丹去世后，阿拉丁继承王位，统治国家许多年。他的后代绵延不绝，一代又一代登上王位。
