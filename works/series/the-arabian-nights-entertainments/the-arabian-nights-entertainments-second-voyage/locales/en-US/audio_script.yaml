audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, thoughtful, and gently amused
        timbre: clear and mellow
        pace: measured
        pitch: medium
    sindbad:
      display_name: Sindbad
      tts:
        delivery: assured, vivid, and reflective
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Alone on the Island
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: >-
            As you know, when I came home from my first voyage, I meant to spend the rest of my life quietly in Bagdad. But it was not long before I tired of doing nothing. Once again, I longed to be at sea.
        - id: ch01-b02
          speaker: sindbad
          text: >-
            I bought the kinds of goods I could trade in the places I planned to visit. Then I boarded a fine ship with several merchants I knew to be honourable men. We sailed from island to island and often made excellent bargains.
        - id: ch01-b03
          speaker: sindbad
          text: >-
            One day, we landed on an island rich with fruit trees and clear springs, but without a house or a person anywhere. My companions wandered here and there, gathering flowers and fruit. I settled in a shady place beside a clear, murmuring brook. After heartily enjoying the food and wine I had brought with me, I listened to the water and fell asleep.
        - id: ch01-b04
          speaker: sindbad
          text: >-
            I do not know how long I slept. When I woke and sprang up, I saw to my horror that I was alone. The ship was gone. I ran wildly back and forth, crying out in despair. From the shore, I could just see the vessel under full sail as it disappeared over the horizon. How bitterly I wished I had stayed safely at home.
        - id: ch01-b05
          speaker: sindbad
          text: >-
            Wishing could not help me, so after a while I gathered my courage and searched for some way to escape. I climbed a tall tree and looked anxiously out to sea. There was nothing there to give me hope. Then I looked inland and noticed a huge white object gleaming in the distance. It was too far away for me to tell what it was.
        - id: ch01-b06
          speaker: sindbad
          text: >-
            I climbed down, gathered what food I had left, and set off toward it as fast as I could. As I drew near, it looked like an enormous white ball, both tall and wide. Its surface felt wonderfully smooth and soft. I could not climb it because there was nowhere to place my feet. I walked all the way around, searching for an opening, but found none. It must have measured at least fifty paces around.
        - id: ch01-b07
          speaker: sindbad
          text: >-
            The sun was almost down when daylight suddenly vanished. Something like a vast black cloud swept over me. To my amazement, it was a bird of extraordinary size hovering above the island. Then I remembered the sailors' stories of a wonderful bird called the roc. The great white object had to be its egg.
        - id: ch01-b08
          speaker: sindbad
          text: >-
            Sure enough, the roc slowly settled on the egg and spread its wings over it for warmth. I crouched beside the egg with one of the bird's feet in front of me. That foot was as thick as a tree trunk. I unwound my turban and tied myself firmly to it, hoping that when the roc flew away in the morning, it would carry me off this lonely island.
    - id: ch02
      title: The Valley of Diamonds
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: >-
            That is exactly what happened. At dawn, the roc rose into the air with me tied to its foot. It carried me higher and higher until the earth vanished below. Then it plunged downward so fast that I nearly lost consciousness.
        - id: ch02-b02
          speaker: sindbad
          text: >-
            When my senses returned, the bird had landed and I was standing on solid ground again. I hurried to untie my turban and free myself from its foot. I was only just in time. The roc pounced on an enormous snake and killed it with a few blows of its powerful beak. Then it seized the snake, rose into the air once more, and soon disappeared from my view. Once I looked around, I began to wonder whether leaving the empty island had helped me at all.
        - id: ch02-b03
          speaker: sindbad
          text: >-
            I stood in a deep, narrow valley. Mountains rose into the clouds on every side, and their rocky walls were far too steep to climb. As I wandered about, desperately looking for a way out, I saw diamonds scattered across the ground. Some were astonishingly large, and the sight delighted me at first.
        - id: ch02-b04
          speaker: sindbad
          text: >-
            My delight soon vanished. The valley was also full of horrible snakes, so long and huge that the smallest could easily have swallowed an elephant. Luckily, they hid in rocky caves during the day and came out only at night, perhaps because they feared the roc.
        - id: ch02-b05
          speaker: sindbad
          text: >-
            I wandered up and down the valley all day, still searching for a way out. At dusk, I crept into a small cave and blocked its entrance with a stone. After eating a little of my remaining food, I lay down to sleep. But all night, serpents crawled to and fro outside, hissing so horribly that terror scarcely let me close my eyes.
        - id: ch02-b06
          speaker: sindbad
          text: >-
            I was thankful when morning came. Once the valley fell silent and I believed the snakes had returned to their dens, I stepped trembling from the cave. Again I wandered up and down, kicking diamonds out of my way with contempt. What use were precious stones to a man trapped there?
        - id: ch02-b07
          speaker: sindbad
          text: >-
            At last, worn out, I sat on a rock. I had barely closed my eyes when something struck the ground beside me with a heavy thud.
    - id: ch03
      title: The Eagles' Nests
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: >-
            It was a great piece of fresh meat. While I stared at it, several more pieces tumbled over the cliffs into different parts of the valley. At once, I remembered the sailors' tales about the famous valley of diamonds and the clever method merchants used to collect the stones. I had always dismissed those stories as travellers' inventions, but now I knew they were true.
        - id: ch03-b02
          speaker: sindbad
          text: >-
            The merchants came when the eagles nesting among the rocks had hatched their young. They threw large pieces of meat down into the valley. The meat struck the diamonds with such force that some of the precious stones became stuck to it. Then the eagles swooped down, seized the meat, and carried it up to their nests for their hungry chicks. The merchants drove the parent birds away with shouts and outcries, then claimed the stones carried up with the meat.
        - id: ch03-b03
          speaker: sindbad
          text: >-
            Until that moment, I had thought the valley would be my grave. I had seen no possible way to leave it alive. Now I took heart and formed a plan. First, I picked up the largest diamonds I could find and packed them into the leather wallet that had held my food. I fastened the wallet securely to my belt.
        - id: ch03-b04
          speaker: sindbad
          text: >-
            Then I chose the piece of meat that best suited my purpose. Using my turban, I tied it firmly across my back. I lay facedown on the ground and waited for the eagles.
        - id: ch03-b05
          speaker: sindbad
          text: >-
            Soon I heard their mighty wings beating above me. To my great relief, an eagle seized the meat, carrying me with it, and slowly rose toward its nest. When it reached the nest, it dropped me inside. Luckily for me, the merchants were already watching. They gave their usual great shouts and rushed forward until the startled eagle flew away.
        - id: ch03-b06
          speaker: sindbad
          text: >-
            The men were amazed to find me in the nest, but they were disappointed too. All together, they began scolding me for taking the profit they expected to find there. I turned to the man who seemed most upset.
        - id: ch03-b07
          speaker: sindbad
          text: >-
            If you knew everything I had suffered, I am certain you would treat me more kindly. And you need not worry about diamonds. I have enough of the finest stones for you, for me, and for every man in your company.
        - id: ch03-b08
          speaker: sindbad
          text: >-
            I showed them my diamonds. The merchants crowded around, marvelling at my adventures and at the plan that had carried me out of the valley. They led me back to their camp and examined the stones. In all their years of trade, they told me, they had never seen diamonds so large or so beautiful.
    - id: ch04
      title: The Journey from the Valley
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: >-
            Each merchant had chosen one particular eagle's nest and accepted whatever fortune brought him there. I asked the man who had claimed the nest where I landed to take as many of my diamonds as he wished. He chose only one, and not even the largest. He said that single gem would make his fortune, so he would never need to labour again.
        - id: ch04-b02
          speaker: sindbad
          text: >-
            I remained at the merchants' camp for several days. When they began their homeward journey, I gladly went with them. Our route led across high mountains infested with dreadful serpents. We had the good fortune to escape every one of them, and at last we came down to the seashore. From there, we boarded a ship and sailed to the island of Rohat.
        - id: ch04-b03
          speaker: sindbad
          text: >-
            On Rohat, camphor trees grow so enormous that a hundred men can easily stand in the shelter of one tree. To gather camphor, people cut an opening high in the trunk and hang a vessel beneath it. Sap runs into the vessel and soon hardens into the substance called camphor. But once the sap is taken this way, the tree withers and dies.
        - id: ch04-b04
          speaker: sindbad
          text: >-
            We also saw the rhinoceros. It is smaller than an elephant but larger than a buffalo. One solid horn, about a cubit long, rises from its head. A groove runs all the way from the horn's base to its tip, and white lines upon it form the figure of a man.
        - id: ch04-b05
          speaker: sindbad
          text: >-
            The rhinoceros fights the elephant. It drives its horn into the elephant and carries the great animal away upon its head. But the elephant's blood blinds the rhinoceros, and it falls helplessly to the ground. Then the roc swoops down, catches both animals in its claws, and carries them away to feed its young.
        - id: ch04-b06
          speaker: sindbad
          text: >-
            Perhaps that astonishes you. If you doubt my tale, go to Rohat and see it for yourself. I will spare you the many other wonders we saw on that island, for I do not wish to weary you.
    - id: ch05
      title: Home to Bagdad
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: >-
            Before we left Rohat, I traded one of my diamonds for a great quantity of fine merchandise. It brought me a handsome profit as we travelled home. At last, we reached Balsora. From there, I hurried to Bagdad.
        - id: ch05-b02
          speaker: sindbad
          text: >-
            The first thing I did was give large sums of money to the poor. Then I settled down to enjoy in peace the riches I had gained through so much hardship and pain.
        - id: ch05-b03
          speaker: narrator
          text: >-
            With that, Sindbad ended the story of his second voyage. Once again, he gave Hindbad a hundred sequins and invited him to return the next day to hear what happened on his third voyage.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The other guests went home as well. At the same hour the following day, every one of them came back, including the porter. His old life of hard work and poverty had already begun to feel like a bad dream.
        - id: ch05-b05
          speaker: narrator
          text: >-
            When the feast was over, Sindbad once more asked his guests to listen. Then he began the tale of his third voyage.
