audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着温和的学者式幽默
        timbre: 温暖清晰，沉稳而不厚重
        pace: 舒缓，遇到年代与专名时略作停顿
        pitch: 中音
    hindbad:
      display_name: 脚夫欣巴达
      tts:
        delivery: 朴实直率，抱怨时激动，面对贵人时拘谨
        timbre: 粗朴厚实，略带疲惫
        pace: 平稳，情绪激动时稍快
        pitch: 中低音
    sindbad:
      display_name: 水手辛巴达
      tts:
        delivery: 宽厚庄重，讲述往事时坦率有力
        timbre: 苍劲温暖，富有阅历感
        pace: 从容
        pitch: 低音
    diamond_merchant:
      display_name: 钻石商人
      tts:
        delivery: 精明谨慎，起初气恼，明白缘由后爽直知足
        timbre: 清亮结实，带着长途跋涉的风霜感
        pace: 稳健
        pitch: 中音
  chapters:
    - id: ch01
      title: 再次出海
      blocks:
        - id: ch01-b01
          speaker: sindbad
          text: |-
            你们都知道，第一次航行回来以后，我本想留在巴格达，从此安安静静地过日子。谁知才清闲了没多久，我就待不住了，一心又想回到海上。

            我置办好一批适合沿途买卖的货物，第二次登上商船，同行的都是我熟悉的正派商人。我们一座岛接一座岛地航行，做成了不少好生意。

            有一天，大家登上一片陌生的地方。岛上到处是果树和清泉，却看不见房屋，也找不到人烟。伙伴们四下采花摘果，我独自在树荫里坐下，痛痛快快地吃了食物，喝了酒。旁边的清溪淙淙作响，我听着听着，便睡着了。

            不知道过了多久，我睁眼跳起来，才发现四周一个人也没有，船也走了。我发疯似的来回奔跑，绝望地大喊。赶到岸边时，那条船已经张满帆，正在天边消失。

            我真后悔没有老老实实留在家里。可再怎么后悔，也救不了眼前的我。我只得重新振作，寻找活路。我爬上一棵高树，先朝海上张望，那里什么希望也没有。再看岛内，远处竟有个庞大雪白的东西，亮得耀眼。我看不清那是什么，心里却十分好奇。
    - id: ch02
      title: 大鹏的蛋
      blocks:
        - id: ch02-b01
          speaker: sindbad
          text: |-
            我爬下树，收起剩下的食物，快步朝那件白东西赶去。走近一看，它活像一只大得惊人的白球。我伸手摸了摸，表面又光滑又柔软。可是四周没有落脚的地方，根本爬不上去。我绕了一圈，也没找到入口，只估量出它至少有五十步那么粗。

            太阳眼看就要落山，天色却猛地暗了。一个像乌云般的黑影从头顶掠过，原来是只大得出奇的鸟。它就在白色圆球附近盘旋。我又看了一会儿，忽然想起水手们说过的奇鸟大鹏，顿时明白了。面前这只白色圆球，正是大鹏的蛋。

            大鹏慢慢落下来，张开翅膀，覆在蛋上取暖。我缩在蛋边，它的一只脚恰好立在我面前，粗得就像树干。我解下头巾，把自己牢牢绑在那只脚上，只盼它天亮起飞时，能顺便带我离开荒岛。

            第二天破晓，大鹏果然飞了起来。它带着我越升越高，直到脚下的大地完全看不见，四周只剩茫茫天空。随后，它突然向下疾冲，我差点失去知觉。等我回过神，大鹏已经落在地上。我赶紧解开头巾，刚刚脱身，它就扑向一条巨蛇，用长喙猛击几下，把蛇杀死，抓着它飞走了。

            我终于又踩到了实地。可看看四周，我实在不知道，自己离开荒岛以后，处境到底是变好了，还是更糟了。
    - id: ch03
      title: 钻石谷
      blocks:
        - id: ch03-b01
          speaker: sindbad
          text: |-
            我落在一条又深又窄的山谷里。四面的山峰一直插进云层，岩壁陡得吓人，哪里都爬不上去。我焦急地寻找出口，却看见地上散满钻石，有些大得惊人。

            刚看到这些宝石时，我当然高兴。可紧接着，我就发现谷里还有许多巨蛇。那些蛇长得又粗又长，哪怕最小的一条，也能轻易吞下一头大象。幸好白天它们躲在岩洞里，只在夜晚出没。想来它们也怕大鹏。

            我整天在谷里来回寻找。天快黑时，我钻进一个小洞，用石头堵住洞口，吃掉一点所剩不多的食物，便躺了下来。可蛇群一夜都在外面爬动，那阵可怕的嘶嘶声，吓得我几乎不敢闭眼。

            熬到晨光照进来，我总算松了一口气。等四周安静下来，我猜蛇群已经回到巢里，才浑身发抖地走出山洞，又在谷里来回寻找出路。那些钻石散在脚下，我看也不看，只管把它们踢到一旁。人若连命都保不住，要宝石又有什么用？

            我走得精疲力竭，便坐到一块岩石上。眼睛才合拢，旁边忽然砰的一响，有东西重重落在地上。我睁眼一看，竟是一大块鲜肉。紧接着，又有好几块肉从不同的峭壁上滚了下来。
    - id: ch04
      title: 鹰背上的生路
      blocks:
        - id: ch04-b01
          speaker: sindbad
          text: |-
            从前，水手们常说起钻石谷，也说过商人取宝石的奇法。我一直当那是远行人编来逗大家高兴的故事。到了这时，我才知道一切都是真的。

            岩间的鹰孵出幼鸟以后，商人便把大块的肉扔进山谷。肉从高处重重砸下来，会粘起地上的钻石。鹰再把肉抓回岩壁高处的巢里，喂给巢中嗷嗷待哺的幼鸟。守在上面的商人便大声呼喊，吓走成鸟，从肉上取下宝石。

            原先，我只把这座山谷当成自己的坟墓。现在看见这些肉块，我又有了勇气。我捡起能找到的最大钻石，装进盛过食物的皮袋，把袋子系紧在腰上。接着，我选好一块肉，用头巾牢牢绑在背后，脸朝下趴在地上，等鹰飞来。

            很快，头顶响起巨翅拍动的声音。一只鹰抓住我背后的肉，也把我一起抓了起来。感觉身体离开地面时，我心里一阵欣喜，知道这个办法果然成了。鹰慢慢飞向巢穴，随后将我扔了进去。

            商人们一直守在附近，立刻照老办法大声叫喊，冲到巢边赶走了鹰。可他们见到我，既惊讶又失望，纷纷责骂我，说我抢了他们本该得到的收获。我便找到其中最生气的一个，向他解释。
        - id: ch04-b02
          speaker: sindbad
          text: |-
            你若知道我受过多少苦，就不会这样苛待我了。说到钻石，我这里全是最上等的，足够分给你、我，还有你的所有伙伴。
        - id: ch04-b03
          speaker: sindbad
          text: |-
            我把钻石拿了出来，所有商人都围过来看。他们听完我的遭遇，又知道我是怎样借着鹰逃出山谷的，无不惊叹。回到营地以后，他们仔细察看我的宝石，都说自己做了这么多年生意，从未见过这样硕大、这样美丽的钻石。

            原来，每位商人都会选定一个鹰巢，守着自己的那一处，能从里面找到什么，全凭运气。我请选中这个鹰巢的商人随意拿取我的钻石。
        - id: ch04-b04
          speaker: diamond_merchant
          text: |-
            我只要这一颗。有了这样的宝石，我这一生已经富足，再也不用辛苦奔波了。
        - id: ch04-b05
          speaker: sindbad
          text: |-
            他取的并不是最大的一颗。我和这些商人一起住了几天。后来他们启程回乡，我也高高兴兴地跟着上路。我们翻过毒蛇出没的高山，幸而没有遇险，最后平安到了海边。
    - id: ch05
      title: 罗哈特岛与归途
      blocks:
        - id: ch05-b01
          speaker: sindbad
          text: |-
            我们从海边乘船来到罗哈特岛。那里的樟树大得惊人，一棵树下足以容纳一百个人。人们在高处割开树干，再挂上容器，接住流出的汁液。那些汁液很快就会凝成樟脑，可一棵树经过这样的割取，也就渐渐枯死了。

            岛上还有犀牛。它比大象小，比水牛大，头顶长着一根大约一腕尺长的实心独角。那根角从底端到尖端有一道凹槽，上面的白色纹路，恰好勾出一个人的形状。

            犀牛会和大象搏斗。它用角刺穿大象，再把大象顶在头上带走。大象的血流下来，蒙住了犀牛的眼睛，它便倒在地上，再也动弹不得。这时大鹏飞来，一爪抓起犀牛和大象，把它们一起带回去喂幼鸟。

            你们听了也许不敢相信。那就亲自到罗哈特岛看看吧。岛上还有许多奇事，我就不一件件讲了，免得叫你们厌倦。

            离开以前，我用一颗钻石换来许多上等货物。归途中，我又靠这些货物赚了不少钱。最后，我们抵达巴士拉，我立刻赶回巴格达。到家以后，我先拿出大笔钱财分给穷人。接着，我才安顿下来，安安稳稳地享用这份历尽艰辛得来的财富。
        - id: ch05-b02
          speaker: narrator
          text: |-
            第二次航行的故事讲完了。辛巴达又送给脚夫欣巴达一百枚金币，请他第二天再来，听听第三次航行的遭遇。

            其他宾客也各自回家。第二天同一时刻，大家又都来到这里，那位脚夫当然也来了。从前那些劳苦贫困的日子，在他心里已经像一场渐渐远去的噩梦。

            宴席结束以后，辛巴达再次请客人们留心倾听，开始讲述他的第三次航行。
