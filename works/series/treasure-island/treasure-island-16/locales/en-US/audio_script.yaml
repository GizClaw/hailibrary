audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Dr. Livesey
      tts:
        delivery: observant, decisive first-person storytelling
        timbre: warm and steady
        pace: measured
        pitch: medium-low
    captain_smollett:
      display_name: Captain Smollett
      tts:
        delivery: firm, commanding, and plainspoken
        timbre: crisp and weathered
        pace: measured
