  chapters:
    - id: ch01
      title: "PART FOUR--The Stockade · XVI Narrative Continued by the Doctor: How the Ship Was Abandoned"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At about half past one, or three bells as sailors say, the two boats left the Hispaniola and headed for shore. The captain, the squire, and I were talking things over in the cabin. If there had been even a breath of wind, we could have attacked the six mutineers left aboard, cut the cable, and sailed away. But there was no wind. Then Hunter came down with worse news. Jim Hawkins had slipped into one of the boats and gone ashore with the others.
        - id: ch01-b02
          speaker: narrator
          text: >-
            None of us doubted Jim. We were afraid for him. With the men in such a dangerous mood, the boy had about an even chance of coming back alive. We hurried onto the deck. Pitch bubbled between the planks, and the foul smell of that anchorage made me sick. If any place ever smelled of fever and dysentery, it was that one. The six scoundrels sat beneath a sail in the forecastle, grumbling. On shore, the two gigs were tied near the mouth of the river, with one man guarding each. One of them was whistling “Lillibullero.”
        - id: ch01-b03
          speaker: narrator
          text: >-
            The waiting became too much. We decided that Hunter and I would take the jolly-boat ashore and find out what we could.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The gigs had gone off to our right, but Hunter and I rowed straight toward the stockade marked on the chart. The two guards grew restless when they saw us. The whistling stopped, and they began discussing what to do. If they had run to warn Silver, everything might have ended differently. But they seemed determined to follow their orders. They stayed where they were, and soon “Lillibullero” began again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The coast curved a little, so I steered behind the bend. Before we landed, the gigs were out of sight. I jumped ashore and moved as close to a run as I dared. I had tucked a large silk handkerchief beneath my hat to keep cool, and I carried two loaded pistols for protection. Before I had gone a hundred yards, I reached the stockade.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Here is what I found. A clear spring rose near the top of a small hill. A strong log house had been built around it, large enough to hold forty people if necessary, with firing holes for muskets on every side. Around the house, the ground had been cleared wide. Beyond that stood a fence six feet high, with no gate or opening. It would take time and hard work to pull down, yet it offered attackers nowhere to hide. Anyone inside the log house could stand safely under cover and shoot an enemy in the open like game birds. With food and a careful watch, the place could hold off a regiment unless it was taken completely by surprise.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The spring interested me most. The cabin aboard the Hispaniola gave us good shelter, plenty of weapons and ammunition, food, and excellent wine. But we had forgotten one thing. We had no water.
        - id: ch01-b08
          speaker: narrator
          text: >-
            As I thought about that, a dying man's cry rang across the island. Violent death was nothing new to me. I had served the Duke of Cumberland and had been wounded myself at Fontenoy. Even so, my pulse stumbled at that sound. My first thought was, Jim Hawkins is gone.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Being an old soldier helps, but being a doctor helps even more. In my work, there is no time to hesitate. I made my decision at once, hurried back to shore, and jumped into the jolly-boat.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Luckily, Hunter was strong with an oar. We sent the water flying, and soon we were alongside the schooner. I climbed aboard and found everyone shaken, as anyone would be. The squire sat there as white as a sheet, blaming himself for the danger he had brought upon us. One of the six hands in the forecastle looked almost as pale.
        - id: ch01-b11
          speaker: captain_smollett
          text: >-
            That man there is new to this business. When he heard the cry, he nearly fainted. One more little turn, Doctor, and he'll come over to us.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I gave the captain my plan. Together, we worked out how to carry it through.
        - id: ch01-b13
          speaker: narrator
          text: >-
            We stationed old Redruth in the passage between the cabin and the forecastle. He had three or four loaded muskets and a mattress to shield him. Hunter brought the boat beneath the stern port. Then Joyce and I began loading it with tins of powder, muskets, bags of biscuits, kegs of pork, a cask of cognac, and my priceless medicine chest.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Meanwhile, the squire and the captain stayed on deck. Captain Smollett called out to Israel Hands, the leading man among those still aboard.
        - id: ch01-b15
          speaker: captain_smollett
          text: >-
            Mr. Hands, there are two of us here, and each of us has two pistols. If any one of you six makes any kind of signal, that man dies.
        - id: ch01-b16
          speaker: narrator
          text: >-
            That startled them. After a quick discussion, all six scrambled down the forward hatch. No doubt they meant to come around and attack us from behind. But Redruth was waiting for them in the barred passage, so they turned back at once. A head appeared above deck again.
        - id: ch01-b17
          speaker: captain_smollett
          text: >-
            Get back down, you dog!
        - id: ch01-b18
          speaker: narrator
          text: >-
            The head vanished. For the moment, those six fainthearted sailors gave us no more trouble.
        - id: ch01-b19
          speaker: narrator
          text: >-
            We threw supplies into the jolly-boat as fast as they came and loaded it as heavily as we dared. Joyce and I climbed out through the stern port. Then we pulled for shore with all our strength.
        - id: ch01-b20
          speaker: narrator
          text: >-
            This second trip finally stirred up the guards along the beach. Once more, “Lillibullero” stopped. Just before the bend hid them from us, one of the men jumped ashore and disappeared. I nearly changed my plan and went to destroy their boats. But Silver and the others might have been close by. If I tried to do too much, I could lose everything.
        - id: ch01-b21
          speaker: narrator
          text: >-
            We landed at the same place as before and began stocking the log house. All three of us made the first trip from the beach, each carrying a heavy load. We tossed the supplies over the fence. Then we left Joyce to guard them. He was only one man, but he had half a dozen muskets. Hunter and I went back to the jolly-boat and loaded ourselves again.
        - id: ch01-b22
          speaker: narrator
          text: >-
            We kept at it without stopping to catch our breath until every bit of cargo was inside. The two servants took their places in the log house. Then I rowed back to the Hispaniola alone, using every ounce of strength I had.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Risking a second load may sound more daring than it was. The mutineers had more men, but we had the guns. Not one of the men ashore carried a musket. Before they came close enough to use their pistols, we believed we could bring down at least six of them.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The squire was waiting at the stern window, and all his weakness had left him. He caught the boat's rope and tied it fast. Then we loaded as if our lives depended on it. We took pork, powder, and biscuits, with only one musket and one cutlass each for the squire, Redruth, the captain, and me. We dropped all the other weapons and powder overboard into fifteen feet of water. Far below us, we could see the bright steel shining in the sun against the clean sand.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The tide had begun to run out, and the ship was turning around her anchor. In the distance, we heard voices calling near the two gigs. That told us Joyce and Hunter, farther east, were still safe. It also warned the rest of us that it was time to leave.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Redruth left his post in the passage and dropped into the boat. We brought it around beneath the ship's stern, where Captain Smollett could reach it easily.
        - id: ch01-b27
          speaker: captain_smollett
          text: >-
            Now, men, can you hear me?
        - id: ch01-b28
          speaker: narrator
          text: >-
            No one answered from the forecastle.
        - id: ch01-b29
          speaker: captain_smollett
          text: >-
            Abraham Gray, I'm talking to you.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Again, there was no answer.
        - id: ch01-b31
          speaker: captain_smollett
          text: >-
            Gray, I am leaving this ship, and I order you to come with your captain. I know there's a good man inside you. And I don't believe any of those men are as bad as he makes them out to be. My watch is in my hand. You have thirty seconds to join me.
        - id: ch01-b32
          speaker: narrator
          text: >-
            We waited.
        - id: ch01-b33
          speaker: captain_smollett
          text: >-
            Come on, my good fellow. Don't take so long deciding. Every second I wait, I'm risking my life and the lives of these gentlemen.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Suddenly, we heard a struggle and the sound of blows. Abraham Gray burst out with a knife wound across his cheek and ran to the captain like a dog answering a whistle.
        - id: ch01-b35
          speaker: abraham_gray
          text: >-
            I'm coming with you, sir.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A moment later, Gray and the captain dropped into the boat. We pushed away and pulled hard at the oars.
        - id: ch01-b37
          speaker: narrator
          text: >-
            We were safely away from the ship, but we had not yet reached the stockade on shore.
