audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 利弗西医生
      tts:
        delivery: 冷静果断，带着老兵回顾险境时的克制与机敏
        timbre: 温厚清晰的中年男声
        pace: 沉稳明快，紧张处稍加快
        pitch: 中低
    captain_smollett:
      display_name: 斯摩莱特船长
      tts:
        delivery: 威严简短，命令清楚有力，危急中仍不失冷静
        timbre: 坚实粗粝的成年男声
        pace: 利落紧凑
        pitch: 中低
    abraham_gray:
      display_name: 亚伯拉罕·格雷
      tts:
        delivery: 朴实直接，经过挣扎后显得坚定
        timbre: 稍显沙哑的年轻水手声线
        pace: 简短干脆
        pitch: 中
  chapters:
    - id: ch01
      title: 吉姆上了岸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大约一点半钟，也就是海上说的三声钟，两条小艇从“伊斯帕尼奥拉号”驶向岸边。船长、乡绅和我都在船舱里商量对策。哪怕有一丝风，我们也会扑向船上剩下的六个叛徒，砍断锚索，驶入大海。可海面一丝风也没有。偏在这时，亨特又跑下来报信，说吉姆·霍金斯溜上了小艇，跟那帮人一起上岸了。
        - id: ch01-b02
          speaker: narrator
          text: 我们当然不会怀疑吉姆，可真担心他还能不能回来。那些人正在火头上，这孩子是生是死，谁也说不准。我们跑到甲板上，船缝里的柏油正在冒泡。锚地的臭气熏得我恶心。要是热病和痢疾真有气味，那就是这股味道。
        - id: ch01-b03
          speaker: narrator
          text: 六个坏蛋坐在船头楼的帆布下面，嘴里骂骂咧咧。岸边的两条小艇系在河口附近，每条上面都坐着一个人。其中一个还在吹《利莉布乐罗》的口哨。一直等下去太煎熬了，所以我们决定，让亨特和我驾小船上岸，先去探个究竟。
        - id: ch01-b04
          speaker: narrator
          text: 那两条小艇偏向右边，亨特和我却按照海图，直朝木寨划去。守船的两个人看见我们，顿时慌了手脚。口哨停了，两人在那里商量该怎么办。他们要是跑去告诉西尔弗，后来的事恐怕就不一样了。可他们大概有命令在身，最后还是坐在原处，又吹起了那支曲子。
        - id: ch01-b05
          speaker: narrator
          text: 海岸有一处小小的弯角。我掌着舵，让它挡在我们和那两条艇之间。还没登岸，他们就已经看不见我们了。我一跳下船，就小心地尽量快跑，可又不敢真的拔腿飞奔。帽子下垫着大丝巾遮热，两支手枪也都装好引火药，随时可以防身。不到一百码，木寨就出现在眼前。
    - id: ch02
      title: 木寨与泉水
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那儿有个小山包，一股清泉从靠近山顶的地方涌出来。山包上盖着一座结实的圆木屋，泉水就圈在屋里。急了，那座屋子足够挤下四十个人，四面还有供火枪射击的枪眼。木屋四周清出一大片空地，外面再围上六英尺高的木栅。
        - id: ch02-b02
          speaker: narrator
          text: 木栅既没有门，也没有缺口。想推倒它，非得花上不少时间和力气。可它的缝隙很大，围攻的人又没处可藏。躲在圆木屋里的人占尽了便宜，他们可以安稳地待在里面，把外头的人当鹧鸪打。只要哨卡守得严，食物又足，除非有人杀他们一个措手不及，不然就算一团兵来了，也休想攻下来。
        - id: ch02-b03
          speaker: narrator
          text: 我最看中的还是那眼泉水。我们在“伊斯帕尼奥拉号”船舱里不愁武器和弹药，也有食物和上好的葡萄酒。可我们偏偏没有淡水。我正想着这件事，岛上忽然响起一个人临死前的惨叫。
        - id: ch02-b04
          speaker: narrator
          text: 我见过暴死。我曾在康伯兰公爵殿下麾下服役，在丰特诺伊战役里也负过伤。可听见那声惨叫，我的心还是往下一沉，脉搏也乱了。我头一个念头就是，吉姆·霍金斯完了。
        - id: ch02-b05
          speaker: narrator
          text: 当过老兵管用，当医生更管用。干我们这一行，没时间磨蹭。我当场拿定主意，赶回岸边，跳上小船。幸好亨特很会划船。桨一落下，水花就朝两边飞。没过多久，我们靠上船舀，我又回到了船上。
    - id: ch03
      title: 准备撤离
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 船上的人果然都吓得不轻。乡绅坐在那里，脸白得像纸。这位好心人只顾想着，是自己害大家落到了这个地步。船头楼的六个水手里，有一个也没比他强多少。斯摩莱特船长朝那人点了点头。
        - id: ch03-b02
          speaker: captain_smollett
          text: 医生，那个人还没见过这种事。惨叫一响，他差点晕倒。咱们再把舵偏过来一点，他就会投到我们这边。
        - id: ch03-b03
          speaker: narrator
          text: 我把计划说给船长听，两个人很快定下了具体办法。老雷德鲁斯守在船舱与船头楼之间的通道里，面前挡着一张床垫，手边放了三四支装好弹药的火枪。亨特把小船划到船尾窗下面，乔伊斯和我就往里装火药罐、火枪、饼干、猪肉、白兰地，还有我那只无价的药箱。
        - id: ch03-b04
          speaker: narrator
          text: 乡绅和船长留在甲板上。船长对着船上为首的舵工喊话。
        - id: ch03-b05
          speaker: captain_smollett
          text: 汉斯先生，我们两个人，每人都拿着两支手枪。你们六个里面，谁要是敢打任何暗号，谁就没命。
        - id: ch03-b06
          speaker: narrator
          text: 那帮人着实吃了一惊。他们低声商量片刻，一个接一个地钻下前舱口，想必是要从后面扑上来。可他们发现雷德鲁斯端着火枪，守在木栅隔开的通道里，立刻又掉头退了回去。这时，一颗脑袋又从甲板上探了出来。
        - id: ch03-b07
          speaker: captain_smollett
          text: 滚下去，狗东西！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 脑袋马上缩了回去。接下来一阵，这六个胆小的水手再也没有动静。这时小船已经装得不能再满。乔伊斯和我从船尾窗爬出去，拼命朝岸边划。
    - id: ch04
      title: 抢运物资
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们第二次靠岸，守船的人终于警觉起来。《利莉布乐罗》又停了。我们马上就要被小岖角挡住时，有个人突然跳上岸，一转眼就没了影。我曾想改掉计划，先把他们的小艇毁了。可西尔弗和其他人也许就在附近。我们要是贪得太多，反而可能一切尽失。
        - id: ch04-b02
          speaker: narrator
          text: 我们仍从原处登岸，给圆木屋送物资。第一趟，三个人都背得沉沉的，把东西扔过木栅。乔伊斯守在那里。虽然只有他一个人，手边却摆着六支火枪。亨特和我回到小船，又背了一趟。我们没停下来喘过一口气，直到全部货物都放进圆木屋。
        - id: ch04-b03
          speaker: narrator
          text: 两个仆人留在里面防守，我使出全身力气，独自划回大船。如今看来，我们敢再冒险运一船，似乎大胆得过分。其实他们占了人多的便宜，我们则占了武器的便宜。岸上没有一个人带着火枪。在他们走进手枪射程之前，我们至少能收拾掉五六个，所以心里并不害怕。
        - id: ch04-b04
          speaker: narrator
          text: 乡绅守在船尾窗旁等我，脸上的惊慌已经不见了。他抓住小船的缆绳，系紧以后，我们便拼了命往里装货。这次只装猪肉、火药和饼干。我、乡绅、雷德鲁斯和船长，每人只留了一支火枪和一把水手刀。
        - id: ch04-b05
          speaker: narrator
          text: 剩下的武器和火药都被扔进水里。那里有两寻半深，海底干净平坦，钢刃落在水底，仍在阳光下明亮地闪着。潮水已经开始退了，大船也绕着锚慢慢转向。两条小艇那边隐约传来呼喊声。这证明乔伊斯和亨特并没遇到麻烦，因为他们在更靠东的地方。可这也提醒我们，再不走就晚了。
    - id: ch05
      title: 格雷的抉择
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 雷德鲁斯撤出通道，跳进小船。我们把船划到船尾，好让斯摩莱特船长更容易下来。船长向船头楼那边喊了起来。
        - id: ch05-b02
          speaker: captain_smollett
          text: 喂，你们几个，听得见我说话吗？
        - id: ch05-b03
          speaker: narrator
          text: 船头楼里没有人回答。
        - id: ch05-b04
          speaker: captain_smollett
          text: 亚伯拉罕·格雷，我叫的是你。我正在跟你说话。
        - id: ch05-b05
          speaker: narrator
          text: 还是没有回音。斯摩莱特船长又把声音提高了一些。
        - id: ch05-b06
          speaker: captain_smollett
          text: 格雷，我要离开这条船。我命令你跟上自己的船长。我知道你骨子里是个好人。你们这帮人里，我想也没一个真有他表现出来的那么坏。我手里拿着表。现在给你三十秒，马上到我这里来。
        - id: ch05-b07
          speaker: narrator
          text: 船上沉默了一阵。
        - id: ch05-b08
          speaker: captain_smollett
          text: 来吧，好伙计，别再犹豫了。你每耗一秒，我和这几位好绅士就要多冒一秒的生命危险。
        - id: ch05-b09
          speaker: narrator
          text: 船上忽然响起一阵扭打声，里面还夹着拳脚落下的闷响。紧接着，亚伯拉罕·格雷冲了出来。他的一边脸颊被刀划出了一道口子。船长一召唤，他就像听见口哨的狗一样，飞奔而来。
        - id: ch05-b10
          speaker: abraham_gray
          text: 先生，我跟您走。
        - id: ch05-b11
          speaker: narrator
          text: 转眼间，格雷和船长都跳进了我们的小船。我们撑离大船，用力划起桨来。
        - id: ch05-b12
          speaker: narrator
          text: 我们终于离开了“伊斯帕尼奥拉号”，可还没有登上岸，进入那座木寨。
