audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    yellow_eyed_pirate:
      display_name: 乔治·梅里
      tts:
        delivery: 表面恭敬、实则强硬，照着海盗规矩咬字说话
        timbre: 阴沉偏冷的男声
        pace: 不紧不慢
        pitch: 中低
    ben_gunn:
      display_name: 本·冈恩
      tts:
        delivery: 长久独居后的古怪跳脱，故意模仿幽灵时尖细飘忽
        timbre: 干瘦尖细的成年男声
        pace: 忽慢忽快
        pitch: 高
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 镇定果断，言语清楚利落，偶尔透出轻快的讥讽
        timbre: 温和而坚实的成年男声
        pace: 中等，发令时短促
        pitch: 中
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 正直直率，盛怒时措辞严厉而不失身份
        timbre: 洪亮饱满的成年男声
        pace: 中等
        pitch: 中低
    captain_smollett:
      display_name: 斯莫利特船长
      tts:
        delivery: 严谨克制，带着老船长不动声色的冷幽默
        timbre: 坚定略显疲惫的成年男声
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 宝坑两边
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上大概再没有这样翻天覆地的打击了。六个人全像挨了一棍。只有西尔弗转眼就缓过劲来。他一心奔着那笔钱，念头绷得像赛场上的马。宝藏突然落空，仿佛有人一下勒死了那匹马。可旁人还没明白过来，他已经稳住心神，换好了盘算。
        - id: ch01-b02
          speaker: long_john_silver
          text: 吉姆，拿着这把枪。留神，马上要出乱子。
        - id: ch01-b03
          speaker: narrator
          text: 他把一把双筒手枪递给我，又悄悄往北挪了几步，让宝坑隔在我们和其余五人中间。他朝我点点头，那意思再明白不过，我们已经被逼进了死角。他看我的眼神并不友善。我实在受够了他的反复无常，也压低声音回了他一句。
        - id: ch01-b04
          speaker: narrator
          text: 这么说，你又换了一边。
        - id: ch01-b05
          speaker: narrator
          text: 西尔弗来不及回答。海盗们咒骂着，一个接一个跳进坑里，用手指乱挖，又把木板四处乱扔。摩根翻出一枚金币，举起来骂个不停。那不过是一枚两几尼金币，却在他们手里来回传了足足一刻钟。
        - id: ch01-b06
          speaker: yellow_eyed_pirate
          text: 两几尼！西尔弗，这就是你说的七十万英镑？你真会做买卖啊！不是说你从来不会把事办砸吗？你这个木头脑袋的旱鸭子！
          emotion: angry
        - id: ch01-b07
          speaker: long_john_silver
          text: 接着挖呀，弟兄们。说不定下面还有几颗猪食块根呢。
        - id: ch01-b08
          speaker: yellow_eyed_pirate
          text: 猪食块根？伙计们，都听见了吧？这家伙早就知道宝藏没了！看看他的脸，全写在上面呢！
          emotion: angry
        - id: ch01-b09
          speaker: long_john_silver
          text: 哟，梅里，你又想当船长啦？可真会往上钻。
        - id: ch01-b10
          speaker: narrator
          text: 这一回，所有人都站在梅里那边。他们抢着爬出坑，还不断回头怒视西尔弗。我看见了一件对我们有利的事。他们全从西尔弗对面那一边爬了上去。于是我们两个站在这边，他们五个站在那边，宝坑横在中间。双方都把火气顶到了头，却还是谁也不敢先动手。四周一时僵住，谁都在等别人先迈出那一步。
        - id: ch01-b11
          speaker: narrator
          text: 西尔弗一动不动。他拄着拐杖，挺直身子盯住他们，脸上还是那么镇定。我从没见他比这时更沉着。这个人确实勇敢，半点不假。过了一会儿，梅里大概觉得该说几句，好让众人扑上来。
        - id: ch01-b12
          speaker: yellow_eyed_pirate
          text: 伙计们，他们才两个！一个是把咱们领来，又害咱们落到这一步的老瘸子。另一个就是那小崽子，我非把他的心挖出来！伙计们，现在——
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 梅里举起手，越喊越响，摆明了要带头冲锋。就在这一刻，灌木丛里砰砰砰响了三枪。梅里一头栽进坑里。头缠绷带的海盗原地转了一圈，侧身直挺挺倒下。他人已经死了，身子还在抽动。另外三人转身就跑，拼尽全力逃命。
        - id: ch01-b14
          speaker: narrator
          text: 还没等人眨一下眼，西尔弗已经朝垂死挣扎的梅里打完了双筒手枪里的两发子弹。梅里在最后的痛苦中翻起眼睛看他。
        - id: ch01-b15
          speaker: long_john_silver
          text: 乔治，我看这回把你收拾妥当了。
    - id: ch02
      title: 抢在逃兵前头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 医生、格雷和本·冈恩从肉豆蔻树丛里出来，手中的火枪还冒着烟。
        - id: ch02-b02
          speaker: doctor_livesey
          text: 往前冲！快跑，孩子们！我们得抢先赶到小艇那里！
        - id: ch02-b03
          speaker: narrator
          text: 我们立刻飞奔起来，有时一头钻进齐胸深的灌木。西尔弗为了跟上，简直拼了老命。他拄着拐杖一下下跳，胸口的肌肉快要挣裂。就连四肢健全的人，也未必吃得消这样的苦头，医生后来也这么说。可等我们到达坡顶时，他还是落在三十码外，几乎要窒息了。
        - id: ch02-b04
          speaker: long_john_silver
          text: 医生，看那边！不用急啦！
        - id: ch02-b05
          speaker: narrator
          text: 高地空旷处，那三个逃走的人还沿着起初的方向狂奔，径直逃往后桅山。我们已经横在他们和小艇之间，的确不用着急。于是我们四个坐下来喘气，西尔弗则一边擦脸，一边慢慢赶到身边。
        - id: ch02-b06
          speaker: long_john_silver
          text: 多谢您啦，医生。您来救我和霍金斯，时辰掐得正好。原来是你呀，本·冈恩！你可真是个好家伙。
        - id: ch02-b07
          speaker: ben_gunn
          text: 我就是本·冈恩，没错。您好啊，西尔弗先生？托您的福，我挺好。您准会这么说。
        - id: ch02-b08
          speaker: narrator
          text: 本窘得浑身扭来扭去，说到一半还停了好一阵。西尔弗只是低声念叨。
        - id: ch02-b09
          speaker: long_john_silver
          text: 本啊，本，真想不到你会这样对我！
        - id: ch02-b10
          speaker: narrator
          text: 医生派格雷回去，捡一把叛乱者逃跑时丢下的十字镐。随后我们不紧不慢地走下山坡，朝停放小艇的地方去。医生边走边用几句话说出了前因后果，西尔弗听得格外入神。这整个故事里，那个有几分痴傻的荒岛流浪汉本·冈恩，才是从头到尾的大英雄。
        - id: ch02-b11
          speaker: narrator
          text: 本独自在岛上游荡时，早就发现了那具骷髅，骷髅身上的东西也是他搜走的。宝藏同样由他找到、由他挖出。坑里那根断柄，正是从他的十字镐上折下来的。他把财宝背在肩上，从高松树下运往岛屿东北角的双峰山。一趟又一趟，每一趟都走得筋疲力尽，最后才把宝藏全藏进自己的洞穴。早在“伊斯帕尼奥拉号”到来两个月前，它们就已经安全地躺在那里了。
        - id: ch02-b12
          speaker: narrator
          text: 木寨遇袭那天下午，医生从本嘴里套出了秘密。第二天早晨，他看见锚地已经空无一物，便去找西尔弗。医生把已经没用的藏宝图交给他，也把给养交了出去，因为本的洞里备着许多亲手腌制的山羊肉。只要能让自己人平安离开木寨，转移到没有疟疾的双峰山洞，再守住财宝，医生什么都肯给。
        - id: ch02-b13
          speaker: doctor_livesey
          text: 至于你，吉姆，我也很不忍心。可我得先顾那些忠于职守的人。你自己没有跟他们待在一起，这能怪谁呢？
        - id: ch02-b14
          speaker: narrator
          text: 那天早晨，医生想到我也会撞上他为叛乱者准备的可怕失望，便一口气跑回洞穴。他让乡绅留下照看船长，自己带着格雷和本斜穿全岛，赶往高松树附近接应。可我们那队人走在前面，于是腿脚最快的本被先派出去，独自尽力阻拦。他想到了旧船友的迷信，便装神弄鬼吓住他们。这个办法果然争取了时间。寻宝的人到达之前，医生和格雷已经赶上来，埋伏在树林里。
        - id: ch02-b15
          speaker: long_john_silver
          text: 啊，幸亏霍金斯在我手上。要不然，医生，您准会眼看着老约翰被剁碎，连想也不想一下吧？
        - id: ch02-b16
          speaker: doctor_livesey
          text: 一下也不会想。
          emotion: happy
    - id: ch03
      title: 海路回到洞穴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 说话间，我们到了小艇旁。医生抡起十字镐，毁掉其中一只。大家登上另一只，准备从海上绕往北汊湾。这一程足有八九英里。西尔弗已经累得半死，仍被安排到一支桨，和我们一同用力。不久，小艇便飞快掠过平静的海面，驶出海峡，绕过岛屿东南角。四天前，我们曾拖着“伊斯帕尼奥拉号”从这处岬角外经过。
        - id: ch03-b02
          speaker: narrator
          text: 经过双峰山时，我们看见本·冈恩洞穴的入口黑黢黢的。乡绅正站在洞口旁，手拄火枪。我们挥起手帕，齐声欢呼三次，西尔弗也喊得格外卖力，声音一点不比别人小。
        - id: ch03-b03
          speaker: narrator
          text: 又划了三英里，刚进北汊湾口，我们竟迎面碰见了独自在水上漂游的“伊斯帕尼奥拉号”。上一场涨潮把它托了起来。要是当时风更大，或者潮流像南边锚地那样急，它早不知漂到哪里去了。就算还能找到，也可能已经搁浅在无可挽救的地方。幸好除了主帆损坏，它没有什么大毛病。
        - id: ch03-b04
          speaker: narrator
          text: 我们备好一只锚，抛进一寻半深的水里，又掉头划向朗姆酒湾。那里离本的藏宝洞最近。格雷随后独自驾小艇回到“伊斯帕尼奥拉号”，留下来守夜。
        - id: ch03-b05
          speaker: narrator
          text: 一道缓坡从海滩一直通到洞口。我们走到坡顶，乡绅在那里迎接大家。他待我亲切又热诚，对我擅自出走这件事一句也没多说，既不责备，也不夸奖。西尔弗客客气气地向他行礼时，乡绅的脸微微涨红。
        - id: ch03-b06
          speaker: squire_trelawney
          text: 约翰·西尔弗，你是个了不得的恶棍和骗子，是个罪大恶极的骗子，先生！别人叫我别起诉你，那我就不告。可那些死去的人会像磨盘一样，永远坠在你脖子上！
          emotion: angry
        - id: ch03-b07
          speaker: long_john_silver
          text: 多谢您啦，先生。
        - id: ch03-b08
          speaker: squire_trelawney
          text: 你竟敢谢我！我不告你，已经是严重失职了。退后！
          emotion: angry
    - id: ch04
      title: 弗林特的宝藏
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们全都走进洞穴。里面宽敞通风，一股细泉流入清澈的水池，池上垂着蕨叶，地面铺满沙子。斯莫利特船长躺在一堆旺火前。洞穴深处有个角落，火焰只能把那里映出一点昏黄。我就在那片暗淡的火光里，看见了成堆的钱币，还有一垛垛用金条砌成的方堆。
        - id: ch04-b02
          speaker: narrator
          text: 那就是弗林特的宝藏。我们千里迢迢寻找它，“伊斯帕尼奥拉号”上已经有十七个人为它丧命。可当初搜罗这批财宝，又死过多少人？流过多少血，留下多少悲伤？多少好船被凿沉在深海，多少勇敢的人蒙着眼睛走下跳板？又响过多少炮火，藏着多少耻辱、谎言和残酷？世上还活着的人，恐怕谁也说不清。
        - id: ch04-b03
          speaker: narrator
          text: 可岛上还有三个人曾经参与过那些罪行。西尔弗、老摩根和本·冈恩，当年各自都做过一份恶，也都妄想从宝藏里分到报酬，最后却全落了空。
        - id: ch04-b04
          speaker: captain_smollett
          text: 进来吧，吉姆。照你自己的路数来说，你是个好孩子。不过以后，我看咱俩不会再一起出海了。你天生太得老天偏爱，我可受不了。那是你吗，约翰·西尔弗？你跑来干什么？
        - id: ch04-b05
          speaker: long_john_silver
          text: 回来尽我的本分，先生。
        - id: ch04-b06
          speaker: narrator
          text: 船长只应了一声“啊”，除此什么也没说。那天晚上，我和所有朋友围坐在一起，吃了一顿痛快的晚餐。桌上有本·冈恩腌制的山羊肉，有从船上带来的几样精美食物，还有一瓶从“伊斯帕尼奥拉号”上取来的陈年好酒。我敢说，世上从没有一群人比我们更快活、更幸福。
        - id: ch04-b07
          speaker: narrator
          text: 西尔弗坐在火光几乎照不到的后面，吃得津津有味。谁需要什么，他立刻起身帮忙。我们笑时，他甚至也跟着轻声笑。他又变回了来岛航程中的模样，那个和颜悦色、彬彬有礼、低声下气的水手。
