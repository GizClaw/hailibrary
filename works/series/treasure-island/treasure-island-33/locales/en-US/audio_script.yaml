  chapters:
    - id: ch01
      title: The Empty Pit
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Nothing could have turned the world upside down more completely. All six men looked as if a blow had struck them. Silver recovered almost at once. His mind had been racing toward that treasure, and now the loss stopped him dead. Before the others understood, he had mastered himself and changed his plan.
        - id: ch01-b02
          speaker: long_john_silver
          text: Jim, take this. Be ready for trouble.
        - id: ch01-b03
          speaker: narrator
          text: He slipped me a double-barreled pistol, then quietly moved north until the hollow lay between us and the other five men. He looked at me and nodded. We were in a tight corner. But there was nothing friendly in his face, and his constant switching of sides sickened me.
        - id: ch01-b04
          speaker: narrator
          text: So you've turned your coat again.
        - id: ch01-b05
          speaker: narrator
          text: Silver had no chance to answer. Cursing and shouting, the pirates jumped into the pit. They clawed at the dirt and flung the boards aside. Morgan found one gold coin and held it up through a fountain of curses. It was worth two guineas, and passed from hand to hand.
        - id: ch01-b06
          speaker: george_merry
          text: Two guineas! So that's your seven hundred thousand pounds, is it? Fine bargain you made for us! You never spoil anything, do you, you wooden-headed fool?
          emotion: angry
        - id: ch01-b07
          speaker: long_john_silver
          text: Keep digging, boys. Maybe you'll turn up a few pig-nuts.
        - id: ch01-b08
          speaker: george_merry
          text: Pig-nuts! Hear that, mates? I'm telling you, he knew the truth all along. Just look at his face. It's written all over him!
          emotion: angry
        - id: ch01-b09
          speaker: long_john_silver
          text: Why, Merry, are you trying to be captain again? You're an eager lad, aren't you?
        - id: ch01-b10
          speaker: narrator
          text: This time every man was on Merry's side. They scrambled out of the pit, throwing furious looks back at Silver. One thing gave me hope. Every one of them climbed out on the far side, away from us.
        - id: ch01-b11
          speaker: narrator
          text: Silver and I stood on one side, the five pirates on the other, with the pit between us. No one could bring himself to strike first. Silver never moved. He watched them from his crutch, as cool as I had ever seen him. Whatever else he was, he was brave.
        - id: ch01-b12
          speaker: narrator
          text: At last Merry decided a speech might push the others forward.
        - id: ch01-b13
          speaker: george_merry
          text: Mates, there are only two of them over there. One is the old cripple who dragged us here and ruined the whole business. The other is that boy, and I mean to tear his heart out. Now, mates—
          emotion: angry
    - id: ch02
      title: Shots from the Thicket
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Merry lifted his arm and voice, ready to lead a charge. Then three musket shots cracked from the thicket. Merry pitched headfirst into the pit. The bandaged pirate spun like a top, fell on his side, and lay dead but twitching. The other three turned and ran.
        - id: ch02-b02
          speaker: narrator
          text: In the blink of an eye, Long John fired both barrels of his pistol into the struggling Merry. The dying man rolled his eyes up toward him.
        - id: ch02-b03
          speaker: long_john_silver
          text: George, I reckon that settles you.
        - id: ch02-b04
          speaker: narrator
          text: At that same moment, Dr. Livesey, Gray, and Ben Gunn came out from among the nutmeg trees, their muskets still smoking.
        - id: ch02-b05
          speaker: doctor_livesey
          text: Forward! Quick now, lads! We have to cut them off from the boats.
        - id: ch02-b06
          speaker: narrator
          text: We raced away, sometimes plunging chest-deep through the bushes. Silver struggled to keep up, bounding on his crutch until his chest looked ready to burst. The doctor said no able-bodied man could have matched that labor. At the top of the slope, Silver was thirty yards behind and nearly choking.
        - id: ch02-b07
          speaker: long_john_silver
          text: Doctor! Look there! No need to hurry!
        - id: ch02-b08
          speaker: narrator
          text: He was right. Across an open stretch of the plateau, we could see the three survivors still running toward Mizzenmast Hill. We were already between them and the boats. The four of us sat down to catch our breath while Long John slowly came up, wiping his face.
        - id: ch02-b09
          speaker: long_john_silver
          text: Much obliged, doctor. You arrived just in time for Hawkins and me. And so it's you, Ben Gunn! Well, aren't you a fine one?
        - id: ch02-b10
          speaker: ben_gunn
          text: I'm Ben Gunn, I am.
        - id: ch02-b11
          speaker: narrator
          text: The maroon twisted about like an eel, awkward and embarrassed. After a long pause, he spoke again.
        - id: ch02-b12
          speaker: ben_gunn
          text: And how are you, Mr. Silver? Pretty well, I suppose you'd say.
        - id: ch02-b13
          speaker: long_john_silver
          text: Ben, Ben. To think you'd do this to me!
    - id: ch03
      title: Ben Gunn's Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The doctor sent Gray back to fetch one of the pickaxes the mutineers had dropped. Then we walked more slowly down toward the boats, and the doctor told us what had happened. Silver listened with deep interest. From beginning to end, the hero of the story was poor, half-wild Ben Gunn.
        - id: ch03-b02
          speaker: narrator
          text: During his long, lonely wandering, Ben had found and searched the skeleton. He had found the treasure too and dug it up. The broken pickax handle in the pit was his. Load by weary load, he carried the treasure from the tall pine to his cave on the two-pointed hill at the island's northeast corner. The gold had been safe there for two months before the Hispaniola arrived.
        - id: ch03-b03
          speaker: narrator
          text: On the afternoon of the stockade attack, the doctor drew the secret out of Ben. Next morning, when he found the anchorage empty, he went to Silver. He handed over the now-worthless map and the supplies, since Ben's cave held plenty of goat meat Ben had salted. He gave up everything so his party could safely move from the stockade to the two-pointed hill, away from malaria and close to the money.
        - id: ch03-b04
          speaker: doctor_livesey
          text: As for you, Jim, leaving you behind went against my heart. But I had to do what seemed best for the men who stayed loyal to their duty. If you weren't among them, whose fault was that?
        - id: ch03-b05
          speaker: narrator
          text: That morning, the doctor realized I would be caught in the terrible shock he had prepared for the mutineers. He ran all the way to the cave. He left the squire there to guard the captain, then started across the island with Gray and Ben. They took a diagonal route so they could reach the tall pine in time.
        - id: ch03-b06
          speaker: narrator
          text: The doctor soon saw that Silver's party was ahead. Ben ran fastest, so he went on alone. He used his old shipmates' superstitious fear against them. His trick delayed the pirates until Gray and the doctor caught up and hid in the brush before the treasure hunters arrived.
        - id: ch03-b07
          speaker: long_john_silver
          text: Lucky for me I had Hawkins beside me. You'd have let old John be chopped to pieces without another thought, doctor.
        - id: ch03-b08
          speaker: doctor_livesey
          text: Not another thought.
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: By then we had reached the two small boats. The doctor took the pickax and smashed one of them. We all climbed into the other and set out by sea for North Inlet.
    - id: ch04
      title: Around the Island
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The trip was eight or nine miles. Silver was already almost spent, but he had to take an oar with the rest of us. Soon we were gliding fast over calm water. We came out of the straits and rounded the southeast corner of the island. Four days earlier, we had towed the Hispaniola past that same point.
        - id: ch04-b02
          speaker: narrator
          text: As we passed the two-pointed hill, we saw the dark mouth of Ben Gunn's cave. A man stood outside, leaning on a musket. It was the squire. We waved a handkerchief and cheered three times. Silver's voice rang out as heartily as anyone's.
        - id: ch04-b03
          speaker: narrator
          text: Three miles farther, inside North Inlet, we met the Hispaniola sailing by herself. The high tide had floated her free. With more wind or a current like the one in the southern anchorage, we might never have seen her again, or found her stranded beyond rescue. Instead, little was damaged except the mainsail.
        - id: ch04-b04
          speaker: narrator
          text: We prepared another anchor and dropped it in nine feet of water. Then all of us rowed back around to Rum Cove, the closest landing to Ben Gunn's treasure cave. Gray returned alone in the small boat to spend the night guarding the Hispaniola.
        - id: ch04-b05
          speaker: narrator
          text: A gentle slope led from the beach to the cave. The squire met us at the top. He greeted me warmly and kindly. He did not blame me for running away, but he did not praise me either. When Silver gave him a polite salute, the squire's face reddened.
        - id: ch04-b06
          speaker: squire_trelawney
          text: John Silver, you are a tremendous villain and a monstrous fraud. I've been told not to bring you to trial, so I won't. But every dead man hangs around your neck like a millstone.
          emotion: angry
        - id: ch04-b07
          speaker: long_john_silver
          text: Thank you kindly, sir.
        - id: ch04-b08
          speaker: narrator
          text: He saluted once more.
        - id: ch04-b09
          speaker: squire_trelawney
          text: How dare you thank me! Letting you go is a shameful failure of my duty. Stand back!
          emotion: angry
    - id: ch05
      title: Flint's Treasure
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: We all went into the cave. It was large and airy, with a little spring and a pool of clear water beneath hanging ferns. Sand covered the floor. Captain Smollett lay in front of a great fire. Far off in one corner, where the flames reached only faintly, I saw enormous heaps of coins and square stacks built from bars of gold.
        - id: ch05-b02
          speaker: narrator
          text: "There was Flint's treasure, the fortune we had traveled so far to find. Seventeen men from the Hispaniola had died for it. No one alive could count its earlier cost in blood and sorrow, ships sunk at sea, blindfolded men on the plank, cannon fire, shame, lies, and cruelty. Three men on the island had shared in those crimes: Silver, old Morgan, and Ben Gunn. Each had hoped in vain to share the reward."
        - id: ch05-b03
          speaker: captain_smollett
          text: Come in, Jim. You're a good boy in your own way, but I don't believe you and I should go to sea together again. You're too much the favorite of fortune for me. Is that John Silver? What are you doing here, man?
        - id: ch05-b04
          speaker: long_john_silver
          text: I've come back to my duty, sir.
        - id: ch05-b05
          speaker: captain_smollett
          text: Ah.
        - id: ch05-b06
          speaker: narrator
          text: That was all the captain said.
        - id: ch05-b07
          speaker: narrator
          text: What a supper we had that night, with all my friends around me. We ate Ben Gunn's salted goat, along with special treats and a bottle of old wine from the Hispaniola. I am sure no group of people was ever happier or in better spirits.
        - id: ch05-b08
          speaker: narrator
          text: Silver sat a little way back, almost beyond the firelight. He ate heartily and sprang up at once whenever anyone needed something. He even joined quietly in our laughter. Once again, he was the same smooth, polite, eager-to-please sailor we had known on the voyage out.
