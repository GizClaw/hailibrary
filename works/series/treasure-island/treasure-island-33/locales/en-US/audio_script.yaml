audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: commanding, quick-witted, and rough-edged
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    morgan:
      display_name: Tom Morgan
      tts:
        delivery: blunt, mutinous, and weather-beaten
        timbre: coarse and gravelly
        pace: forceful
        pitch: medium-low
    george_merry:
      display_name: George Merry
      tts:
        delivery: hot-tempered, taunting, and ambitious
        timbre: harsh and raspy
        pace: fast
        pitch: medium-low
    doctor_livesey:
      display_name: Dr. Livesey
      tts:
        delivery: observant, decisive, and dryly humorous
        timbre: warm and steady
        pace: measured
        pitch: medium-low
    abraham_gray:
      display_name: Abraham Gray
      tts:
        delivery: earnest and resolute
        timbre: sturdy and clear
        pace: moderate
