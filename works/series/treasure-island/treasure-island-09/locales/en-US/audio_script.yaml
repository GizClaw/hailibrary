  chapters:
    - id: ch01
      title: Powder and Arms
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Hispaniola lay some distance from shore, so we had to make our way through a forest of ships. Our boat passed beneath their figureheads and around their sterns. Sometimes the heavy cables scraped under our keel, and sometimes they swung above our heads. At last we pulled alongside. The mate, Mr. Arrow, greeted us as we climbed aboard. He was an old brown-faced sailor with earrings in his ears and a squint in his eye. He and the squire acted like close friends at once. But I soon saw that Captain Smollett and Mr. Trelawney were on very different terms.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The captain had a sharp look about him and seemed displeased with everything aboard. We soon learned why. We had barely reached the cabin when a sailor came after us.
        - id: ch01-b03
          speaker: sailor
          text: >-
            Captain Smollett is asking to speak with you, sir.
        - id: ch01-b04
          speaker: squire_trelawney
          text: >-
            I'm always at the captain's service. Send him in.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Captain Smollett was right behind the messenger. He stepped inside and closed the door.
        - id: ch01-b06
          speaker: squire_trelawney
          text: >-
            Well, Captain, what is it? I hope everything is sound and ready for sea.
        - id: ch01-b07
          speaker: captain_smollett
          text: >-
            Sir, I'd better be plain, even if it offends you. I don't like this voyage. I don't like the crew. And I don't like my officer. There it is, short and clear.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I could see the squire's anger rising.
        - id: ch01-b09
          speaker: squire_trelawney
          text: >-
            Perhaps you don't like the ship, either, sir?
        - id: ch01-b10
          speaker: captain_smollett
          text: >-
            I haven't seen her under sail, so I can't judge her yet. She looks like a fine craft. That's all I can honestly say.
        - id: ch01-b11
          speaker: squire_trelawney
          text: >-
            And maybe you don't care for the man who hired you?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Before the quarrel could go any further, Dr. Livesey stepped in.
        - id: ch01-b13
          speaker: dr_livesey
          text: >-
            Hold on. Questions like that will only cause bad feeling. The captain has either said too much or not enough, and I want him to explain. Captain, you say you dislike this voyage. Why?
        - id: ch01-b14
          speaker: captain_smollett
          text: >-
            I was hired under sealed orders. I was to sail this ship wherever that gentleman told me. That was fair enough. But now I discover that every sailor aboard knows more about our business than I do. Do you call that fair?
        - id: ch01-b15
          speaker: dr_livesey
          text: >-
            No, I do not.
        - id: ch01-b16
          speaker: captain_smollett
          text: >-
            Then I hear from my own men that we're hunting treasure. Treasure voyages are dangerous work, and I want no part of them at the best of times. It's worse when the voyage is supposed to be secret, but someone has told the secret to the parrot. Begging your pardon, Mr. Trelawney.
        - id: ch01-b17
          speaker: squire_trelawney
          text: >-
            You mean Silver's parrot?
        - id: ch01-b18
          speaker: captain_smollett
          text: >-
            It's only an expression, sir. I mean someone has blabbed the secret to everyone. I don't believe either of you gentlemen understands what you're getting into. The way I see this voyage, it could come down to life or death, and it'll be a close-run thing.
        - id: ch01-b19
          speaker: dr_livesey
          text: >-
            That's clear enough, and likely true. We accept the danger, though we aren't as ignorant as you think. Now tell us about the crew. Aren't they capable sailors?
        - id: ch01-b20
          speaker: captain_smollett
          text: >-
            I don't trust them, sir. And I should have been allowed to choose my own crew.
        - id: ch01-b21
          speaker: dr_livesey
          text: >-
            Perhaps you should have. My friend might have included you when he hired them, but he meant no insult. And what is wrong with Mr. Arrow?
        - id: ch01-b22
          speaker: captain_smollett
          text: >-
            I don't approve of him. He may be a good sailor, but he's too friendly with the crew to be a good officer. A mate should keep some distance. He shouldn't drink with the common sailors.
        - id: ch01-b23
          speaker: squire_trelawney
          text: >-
            Are you saying he drinks?
          emotion: angry
        - id: ch01-b24
          speaker: captain_smollett
          text: >-
            No, sir. I'm saying he's too familiar with the men.
        - id: ch01-b25
          speaker: dr_livesey
          text: >-
            Then give us the heart of it, Captain. What do you want us to do?
        - id: ch01-b26
          speaker: captain_smollett
          text: >-
            First tell me this. Are you determined to make the voyage?
        - id: ch01-b27
          speaker: squire_trelawney
          text: >-
            Absolutely.
        - id: ch01-b28
          speaker: captain_smollett
          text: >-
            Very well. You've listened patiently while I made claims I can't prove, so hear me out a little longer. The powder and weapons are being stored in the forward hold. There's a good storage space beneath this cabin, so move them here instead. That's my first request. You are also bringing four of your own people, and I've been told that some of them will sleep up forward with the crew. Give those men berths back here beside the cabin instead. That's my second request.
        - id: ch01-b29
          speaker: squire_trelawney
          text: >-
            Is there anything else?
        - id: ch01-b30
          speaker: captain_smollett
          text: >-
            One more thing. Too much has already been said.
        - id: ch01-b31
          speaker: dr_livesey
          text: >-
            Far too much.
        - id: ch01-b32
          speaker: captain_smollett
          text: >-
            I'll tell you what I've heard with my own ears. You have a map of an island. Crosses on it show where the treasure lies. And the island is located at these exact coordinates.
        - id: ch01-b33
          speaker: narrator
          text: >-
            He gave the latitude and longitude without a single mistake.
        - id: ch01-b34
          speaker: squire_trelawney
          text: >-
            I never told anyone that!
          emotion: surprised
        - id: ch01-b35
          speaker: captain_smollett
          text: >-
            The crew knows it, sir.
        - id: ch01-b36
          speaker: squire_trelawney
          text: >-
            Livesey, either you or Hawkins must have told them!
        - id: ch01-b37
          speaker: dr_livesey
          text: >-
            It hardly matters who did.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Neither the doctor nor the captain put much faith in the squire's protest. I didn't, either, because he talked so freely. Still, I believe he was telling the truth this time. No one had revealed the island's position.
        - id: ch01-b39
          speaker: captain_smollett
          text: >-
            Gentlemen, I don't know who carries the map. But I insist that its location remain hidden, even from Mr. Arrow and me. If you won't agree, then let me resign.
        - id: ch01-b40
          speaker: dr_livesey
          text: >-
            I understand. You want us to keep the whole business in the dark. And you want the stern turned into a guarded position, with our own people sleeping there beside every weapon and all the powder aboard. Put simply, you fear a mutiny.
        - id: ch01-b41
          speaker: captain_smollett
          text: >-
            Sir, I mean no disrespect, but you have no right to put those words in my mouth. Any captain with enough reason to declare a mutiny likely would not be justified in sailing at all. I believe Mr. Arrow is completely honest. Some of the crew are honest, too, and perhaps every one of them is. I simply don't know.
        - id: ch01-b42
          speaker: captain_smollett
          text: >-
            What I do know is that I'm responsible for the safety of this ship and for the life of every last man aboard her. I see things going in a way that doesn't look right. Either take these precautions or allow me to resign my post. That is all.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dr. Livesey smiled before he answered.
        - id: ch01-b44
          speaker: dr_livesey
          text: >-
            Captain Smollett, have you heard the fable about the mountain and the mouse? Forgive me, but you bring it to mind. I'll wager my wig that when you walked in, you meant to say far more than this.
        - id: ch01-b45
          speaker: captain_smollett
          text: >-
            You're a sharp man, Doctor. I came here intending to be dismissed. I never expected Mr. Trelawney to listen to a word.
        - id: ch01-b46
          speaker: squire_trelawney
          text: >-
            I wouldn't have listened if Livesey hadn't been here. I'd have sent you straight to the devil. But I've heard you, and I'll do what you ask. I still think less of you for it.
          emotion: angry
        - id: ch01-b47
          speaker: captain_smollett
          text: >-
            Think what you please, sir. You'll find that I do my duty.
        - id: ch01-b48
          speaker: narrator
          text: >-
            With that, the captain left us.
        - id: ch01-b49
          speaker: dr_livesey
          text: >-
            Trelawney, I never expected to say this, but you seem to have brought two honest men aboard. One is Captain Smollett, and the other is John Silver.
        - id: ch01-b50
          speaker: squire_trelawney
          text: >-
            Silver, certainly. But that unbearable fraud? His conduct is cowardly, unworthy of a sailor, and thoroughly un-English!
          emotion: angry
        - id: ch01-b51
          speaker: dr_livesey
          text: >-
            We'll see.
        - id: ch01-b52
          speaker: narrator
          text: >-
            By the time we returned to the deck, the men were already moving the weapons and powder. They called out, "Yo-ho!" together as they worked, while Captain Smollett and Mr. Arrow stood nearby and supervised every move.
        - id: ch01-b53
          speaker: narrator
          text: >-
            I liked the new arrangement very much. The whole schooner had been reorganized. Six berths now filled the rear section of the main hold. A slatted passage along the port side was the only connection between those cabins and the galley and forecastle.
        - id: ch01-b54
          speaker: narrator
          text: >-
            At first, the six berths were meant for the captain, Mr. Arrow, Hunter, Joyce, the doctor, and the squire. Now Redruth and I would take two of them. The captain and Mr. Arrow would sleep on deck in the companion. It had been widened on both sides until you could almost call it a roundhouse. The ceiling was still very low, of course, but there was room to swing two hammocks. Even the mate seemed pleased with the change. Perhaps he had his own doubts about the crew, though that is only my guess. As you will hear, we did not have the benefit of his opinion for long.
        - id: ch01-b55
          speaker: narrator
          text: >-
            We were all busy shifting the powder and changing the berths when the last few men came out from shore. Long John was with them.
        - id: ch01-b56
          speaker: narrator
          text: >-
            The cook climbed the ship's side with the quickness of a monkey. The moment he saw what we were doing, he called out.
        - id: ch01-b57
          speaker: long_john_silver
          text: >-
            Ho there, mates! What's going on?
        - id: ch01-b58
          speaker: crewman
          text: >-
            We're moving the powder, Jack.
        - id: ch01-b59
          speaker: long_john_silver
          text: >-
            By the powers, if we stop for that, we'll miss the morning tide!
        - id: ch01-b60
          speaker: captain_smollett
          text: >-
            Those are my orders. Go below, cook. The men will need supper.
        - id: ch01-b61
          speaker: long_john_silver
          text: >-
            Aye, aye, sir.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Silver touched his forehead and went straight toward the galley.
        - id: ch01-b63
          speaker: dr_livesey
          text: >-
            That's a good man, Captain.
        - id: ch01-b64
          speaker: captain_smollett
          text: >-
            Very likely, sir. Easy there, men. Easy with that powder.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Then he caught me inspecting the swivel gun amidships, a long brass cannon that fired a nine-pound shot.
        - id: ch01-b66
          speaker: captain_smollett
          text: >-
            You there, ship's boy! Get away from that. Go help the cook and make yourself useful.
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: >-
            I hurried off, and behind me I heard the captain speak loudly to the doctor.
        - id: ch01-b68
          speaker: captain_smollett
          text: >-
            I'll have no favorites aboard my ship.
        - id: ch01-b69
          speaker: narrator
          text: >-
            I can tell you this. I agreed completely with the squire, and I hated Captain Smollett with all my heart.
