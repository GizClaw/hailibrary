audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    ben_gunn:
      display_name: 本·冈
      tts:
        delivery: 久未与人交谈的生涩中透着急切，水手口吻粗朴而神经质
        timbre: 嘶哑干涩，略显苍老
        pace: 时快时慢，兴奋时连珠炮般急促
        pitch: 中高
  chapters:
    - id: ch01
      title: 林中的怪影
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 山坡到了这里，又陡又满是石头。突然，一股碎石松动了，噼里啪啦地穿过树林，一路滚下来。我本能地朝那边看去，只见一个身影飞快地躲到松树干后。那究竟是熊，是人，还是猴子？我一点也看不清，只觉得它黑黢黢、毛蓬蓬的。这个突然出现的怪物，把我吓得停住了脚。
        - id: ch01-b02
          speaker: narrator
          text: 我像是被两面夹住了。身后是杀人凶手，前面又藏着这个不知是什么的东西。未知的东西反而更可怕，跟它一比，连西尔弗本人都没那么吓人了。我马上掉转脚跟，朝小艇的方向走回去，一路还警觉地越过肩头，不住向身后张望。
        - id: ch01-b03
          speaker: narrator
          text: 怪影立刻又冒了出来。它绕着大圈，想抢到我前面堵住去路。我已经很累了，可就算刚睡醒、浑身有劲，也绝不可能跑得过它。它像鹿一样从一棵树闪到另一棵树，用两条腿奔跑，身子却几乎弯成两折。我从没见过这样的人，可现在已经能肯定，它就是一个人。
        - id: ch01-b04
          speaker: narrator
          text: 我想起了以前听人讲过的食人族，差点开口呼救。不过再野蛮，他毕竟是人，单是这一点就让我稍稍安心。对西尔弗的恐惧也随之重新回来。我站住脚，四下寻找脱身的办法，忽然记起自己身上还有一把手枪。我并不是毫无抵抗之力。勇气一下又回到心里，我坚定地转过身，大步朝这个岛上的人走去。
        - id: ch01-b05
          speaker: narrator
          text: 他已经躲到另一棵树后，却一直紧紧盯着我。我才朝他走，他便出来迎了一步，接着又迟疑着退缩，又重新上前。最后，在我的惊讶和困惑中，他竟跪倒在地，双手紧握着伸向我，一副苦苦哀求的样子。我又停住了。
        - id: ch01-b06
          speaker: narrator
          text: 我问他是谁。
        - id: ch01-b07
          speaker: ben_gunn
          text: 本·冈。我就是可怜的本·冈。我整整三年没跟一个信基督的人说过话啦。
        - id: ch01-b08
          speaker: narrator
          text: 他的嗓音嘶哑又生涩，像一把锈住的锁。这时我看清了，他和我一样是白人，五官甚至颇为清秀。可太阳把他裸露的皮肤全晒黑了，连嘴唇都是黑的，那双浅色眼睛便显得格外惊人。我见过的乞丐，加上我想象得出的乞丐，谁也没有他这样褴褛。他用旧船帆和旧水手服的碎片裹住身体，拼成一套古怪的百衲衣，再拿铜纽扣、小木棍和涂过焦油的绳圈，把那些毫不相配的破布勉强连起来。全身上下，只有腰间那条带旧铜扣的皮带还算结实。
    - id: ch02
      title: 三年的孤独
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我惊叫起来，问他是不是三年前遇了海难。
        - id: ch02-b02
          speaker: ben_gunn
          text: 不是，伙计。我是给人扔在荒岛上的。
        - id: ch02-b03
          speaker: narrator
          text: 我听说过这种可怕的海盗刑罚。犯事的人会被赶下船，只留给他一点火药和子弹，让他独自困在遥远的荒岛上。
        - id: ch02-b04
          speaker: ben_gunn
          text: 三年前，我就给扔下了。从那以后，我靠山羊、浆果和牡蛎活着。人不管落到哪儿，总能给自己找条活路。可我真馋信基督的人吃的饭哪。伙计，你身上有没有一块奶酪？没有吗？唉，好多个长夜里，我都梦见奶酪，大多还是烤得香喷喷的。可一睁眼，我还在这里。
        - id: ch02-b05
          speaker: narrator
          text: 我答应他，只要还能回到船上，就给他整磅整磅的奶酪。他一面说话，一面摸我外套的料子，抚平我的双手，又低头打量我的靴子。每逢停下说话，他便用这些动作表示见到同类的欢喜，那样子就像个孩子。可听见我说“只要还能回到船上”，他马上抬起头，警醒起来，脸上也多了几分受惊后的狡黠。
        - id: ch02-b06
          speaker: ben_gunn
          text: 只要你还能回去？你是这么说的？怎么，有谁拦着你吗？
        - id: ch02-b07
          speaker: narrator
          text: 我说，反正不会是他。他立刻高兴起来，问我叫什么。
        - id: ch02-b08
          speaker: narrator
          text: 我告诉他，我叫吉姆。
        - id: ch02-b09
          speaker: ben_gunn
          text: 吉姆，吉姆。听着，这些年我过得有多苦，说出来准叫你替我害臊。看我这副样子，你肯定想不到，我从前有过一位虔诚的母亲吧？
        - id: ch02-b10
          speaker: narrator
          text: 我承认，确实看不出来。
        - id: ch02-b11
          speaker: ben_gunn
          text: 可我真有过。她虔诚得不得了。我小时候也规规矩矩，敬奉上帝，背《教理问答》快得叫人听不清一个字。后来呢，就成了这副样子。最初只是跑到神圣的墓碑上玩掷硬币，接着却越走越远，什么坏事都来了。我母亲早就这样警告过我。后来发生的一切，她全预言中了，她真是个虔诚的女人。可上天把我送到这里，也是有安排的。我一个人待在这座荒岛上，把所有事情都想明白了，如今又重新敬奉上帝啦。往后你绝不会再看见我喝那么多朗姆酒。当然，头一回有机会，还得喝顶针那么一点，讨个吉利。我已经铁了心，要做一个好人，也知道该怎么做。还有，吉姆，我发财了。
        - id: ch02-b12
          speaker: narrator
          text: 我认定他独居太久，已经疯了。我的脸色大概露出了这个念头，因为他马上激动起来。
        - id: ch02-b13
          speaker: ben_gunn
          text: 发财了！我说，我发财了！吉姆，我会让你出人头地。你会庆幸老天保佑，让你第一个发现我！
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: 话才说完，他的脸色忽然沉了下来，像有一层阴影罩住了整张脸。他紧紧抓住我的手，又竖起一根食指，直举到我眼前，神色里带着警告和威胁。
        - id: ch02-b15
          speaker: ben_gunn
          text: 吉姆，现在你要说实话。那不是弗林特的船吧？
    - id: ch03
      title: 意外的盟友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我心里忽然一亮，觉得自己也许找到了盟友，便立刻对他说了实话。那不是弗林特的船，弗林特已经死了。不过船上的确有几个以前跟过他的人。正因为他们在船上，我们其余的人才落到这样的困境里，实在是倒了大霉。
        - id: ch03-b02
          speaker: ben_gunn
          text: 不是那个……只有一条腿的人吧？
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 我问，他说的是不是西尔弗。
        - id: ch03-b04
          speaker: ben_gunn
          text: 对，西尔弗！就是他。
        - id: ch03-b05
          speaker: narrator
          text: 我说，西尔弗既是厨子，也是叛乱的头目。本·冈还抓着我的手腕，一听便狠狠拧了一把。
        - id: ch03-b06
          speaker: ben_gunn
          text: 要是高个子约翰派你来的，那我准会变成一块猪肉，这我清楚。可你呢？你知道自己现在落到什么处境了吗？
        - id: ch03-b07
          speaker: narrator
          text: 我马上拿定主意，把这次航行从头到尾的经过，还有我们此刻被叛徒围困、进退两难的处境，全都告诉了他。他始终听得全神贯注。等我终于讲完，他伸手拍了拍我的头。
        - id: ch03-b08
          speaker: ben_gunn
          text: 你是个好孩子，吉姆。你们现在给绳结套得死死的，对吧？只管相信本·冈，他正是能帮你们的人。要是有人替你们解了套，你家乡绅会不会出手大方？照你说的，他现在可被套牢了。
        - id: ch03-b09
          speaker: narrator
          text: 我告诉他，乡绅是世上最大方的人。
        - id: ch03-b10
          speaker: ben_gunn
          text: 我可不是想给他看门，再领一套号衣。那不是我要的。我是说，那笔钱本来就跟一个人自己的差不多，他肯不肯拿出，比如说，一千英镑？
        - id: ch03-b11
          speaker: narrator
          text: 我说他一定肯，本来船上每个人就都有一份。
        - id: ch03-b12
          speaker: ben_gunn
          text: 还让我搭船回家？
        - id: ch03-b13
          speaker: narrator
          text: 我叫了起来，说乡绅是位正派绅士，当然会带他回家。何况除掉其他人以后，我们人手不足，还得靠本·冈帮忙把船开回去。他听完这番话，终于放下心来，显得轻松多了。
    - id: ch04
      title: 本·冈的秘密
      blocks:
        - id: ch04-b01
          speaker: ben_gunn
          text: 现在我告诉你一件事，只说这么多，别的可不说。弗林特埋藏宝时，我就在他的船上。他带六个强壮的水手上岸，待了差不多一个星期，我们驾着老“海象号”在外海来回守候。有一天，信号终于升起来了。弗林特独自划着一条小艇回来，头上缠着蓝头巾。太阳正在升起，他站在船头前面，看着白得像死人。可你要听清楚，他确实回来了，那六个人却全死了，也全埋了。船上没有一个人知道他究竟怎么做到的。反正少不了打斗、谋杀和横死，而且是他一个人对付六个。比利·博恩斯那时是大副，高个子约翰是舵手。他们问弗林特把宝藏埋在了哪里。弗林特回答，你们愿意上岸就去，愿意留下也尽管留下。可这艘船还要顶着风继续航行，再去找些财宝来，老天作证。他就是这么说的。
        - id: ch04-b02
          speaker: ben_gunn
          text: 三年前，我在另一条船上，我们望见了这座岛。我对弟兄们说，弗林特的宝藏就在这里，咱们上岸把它找出来吧。船长听了很不高兴，可跟我同桌吃饭的伙伴全都赞成，于是大家还是上了岸。他们一连找了十二天，可一天比一天更恼火，骂我的话也一天比一天难听。终于有天早晨，所有人全回到了船上。他们对我说，本杰明·冈，这杆火枪留给你，再留下一把铁锹和一把镐头。你就待在这里，自己去找弗林特的钱吧。他们就这样把我丢下了。
        - id: ch04-b03
          speaker: ben_gunn
          text: 所以你看，吉姆，我在这里过了三年。从那天起，连一口信基督的人吃的饭都没尝过。现在你仔细瞧瞧我。我像个普通水手吗？不像，你会这么说。我本来就不是，我会这么说。
        - id: ch04-b04
          speaker: narrator
          text: 他冲我眨眼，又狠狠掐了我一把。
        - id: ch04-b05
          speaker: ben_gunn
          text: 你把这句话告诉乡绅，吉姆。“他本来就不是。”就是这几个字，可别忘了。整整三年，天亮也好，天黑也好，晴天也好，下雨也好，他一直都是这个岛上的人。有时候，他也许会想起一段祷文，你得这么说。有时候，他也许会想起自己的老母亲，假如她还活着的话，你也要这么说。可冈的大部分时间，你要特别告诉他，他的大部分时间都用在另外一件事上了。说到这里，你再像我这样掐他一下，让他明白这是个要紧的秘密。
        - id: ch04-b06
          speaker: narrator
          text: 说到这里，他果真又用力掐了我一下。他那副亲热又神秘的样子，仿佛我已经成了他的知己，我们正共享着一个不能让任何人听见的天大秘密。
        - id: ch04-b07
          speaker: ben_gunn
          text: 然后你站起来，对他说，冈是个好人。比起那些自称幸运绅士的人，他更信任天生的正派绅士。是信任得多得多，这点千万别忘。虽说他自己从前也当过幸运绅士。
        - id: ch04-b08
          speaker: narrator
          text: 我说，他刚才讲的话，我一个字也没听懂。不过那不要紧，我只想知道该怎么回到船上。
        - id: ch04-b09
          speaker: ben_gunn
          text: 这才真是难处。不过我有一条自己造的小船，藏在白岩石下面。实在没有别的办法，等天黑以后，我们也许能试试。嗨！那是什么声音？
          emotion: surprised
    - id: ch05
      title: 炮声与国旗
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 太阳明明还要一两个钟头才会落下，整座岛上的回声却突然全醒了。一声炮响如同惊雷，震得山林四处轰鸣，回声从岛的一头滚到另一头。
        - id: ch05-b02
          speaker: narrator
          text: 我大叫，他们打起来了，快跟我来！接着便朝锚地拔腿飞奔，先前的恐惧全忘了。那个身披山羊皮的弃岛人紧跟在旁边，跑得轻快又从容。
        - id: ch05-b03
          speaker: ben_gunn
          text: 左边，左边！往左走，吉姆伙计！从树底下穿过去！我宰的第一只山羊就在那儿。现在它们可不敢下来了，全躲到那些山顶上去，就因为害怕本杰明·冈。啊！那边是墓……墓地。看见那几座土堆了吗？有时候，我猜差不多该到星期日了，就会到这里来祷告。这里虽然算不上一座小教堂，可总有几分庄严的味道。你还得告诉乡绅，本·冈手头缺人，没有牧师，连一本《圣经》和一面旗子都没有。
        - id: ch05-b04
          speaker: narrator
          text: 我一路朝锚地奔跑，他也一路不停地说。他根本没指望我回答，而我只顾跑，也一句话都没有答。隔了相当长的一阵，第一声炮响之后，远处又传来一排枪声。
        - id: ch05-b05
          speaker: narrator
          text: 四周再次安静下来，我们继续向前。随后，就在前方不到四分之一英里的地方，我抬头看见树林上空，一面英国国旗正在风中展开，迎风飘扬。
