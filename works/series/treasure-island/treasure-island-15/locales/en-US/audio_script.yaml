audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: vivid, thoughtful first-person storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    ben_gunn:
      display_name: Ben Gunn
      tts:
        delivery: eager, eccentric, and confidential
        timbre: hoarse and weathered
        pace: quick and uneven
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Creature in the Woods
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The hillside beside me was steep and covered in stones. Suddenly, loose gravel broke away and went rattling and bouncing down through the trees. Without thinking, I looked toward the sound and caught sight of something leaping quickly behind a pine trunk. I could not tell if it was a bear, a man, or even a monkey. All I saw was a dark, shaggy shape. I knew nothing more, and the sight of it stopped me cold.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Now I seemed trapped on both sides. The murderers were behind me, and this unknown creature was ahead. At once, the danger I knew felt better than the danger I did not. Even Silver seemed less frightening than that thing in the woods. I turned around and started back toward the boats, watching sharply over my shoulder.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The figure appeared again right away. It made a wide circle to cut me off before I could reach safety. I was already tired, but even if I had been as fresh as when I woke that morning, I could never have matched its speed. The creature darted from tree to tree like a deer. It ran on two legs like a man, though it bent almost double as it moved. I had never seen any man run that way. Still, I could see now that it truly was a man.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Stories I had heard about cannibals came back to me, and I came within an inch of shouting for help. Yet knowing he was human, no matter how wild he looked, eased my fear a little. As that fear faded, my fear of Silver returned. I stopped and searched my mind for some way to escape. That was when I remembered my pistol. I was not defenseless after all. Courage warmed my heart again, and I set my face toward the man of the island. Then I walked straight at him, quickly and firmly.
        - id: ch01-b05
          speaker: narrator
          text: >-
            By then he was hiding behind another tree. He must have been watching closely, because the moment I moved toward him, he stepped out. First he came forward, then hesitated and backed away. He tried again. To my complete surprise, he finally dropped to his knees and reached out with both hands clasped together, begging me.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I stopped again.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Who are you?
        - id: ch01-b08
          speaker: ben_gunn
          text: >-
            Ben Gunn. Poor Ben Gunn, that's me. I haven't spoken to a Christian soul in three years.
        - id: ch01-b09
          speaker: narrator
          text: >-
            His voice came out rough and stiff, like a rusty lock. Now that I could see him clearly, I knew he was a white man like me, and his features were even pleasant. The sun had burned every patch of bare skin, even turning his lips black. His fair eyes looked startling in that dark face, brighter than anything else about him.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Of all the beggars I had ever seen or imagined, he was the most ragged. His clothes were scraps of old sailcloth and worn sea cloth. The patchwork was held together in every possible way, with brass buttons, little sticks, and loops of tarred rope. Around his waist was an old leather belt with a brass buckle. It was the one solid thing in his whole outfit.
    - id: ch02
      title: Three Years Marooned
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Three years! Were you shipwrecked?
        - id: ch02-b02
          speaker: ben_gunn
          text: >-
            No, mate. Marooned.
        - id: ch02-b03
          speaker: narrator
          text: >-
            I knew that word. It was a terrible punishment used often enough by the buccaneers. They would put the offender ashore on some lonely, distant island, leaving him behind with only a little gunpowder and shot.
        - id: ch02-b04
          speaker: ben_gunn
          text: >-
            Marooned three years ago, I was. I've lived on goats ever since, with berries and oysters. A man can manage wherever he is. That's what I always say. But oh, mate, how I ache for proper Christian food! You don't have a bit of cheese on you, do you? No? Well, I've spent many a long night dreaming of cheese, mostly toasted. Then I wake up, and I'm still here.
        - id: ch02-b05
          speaker: narrator
          text: >-
            If I ever get back aboard, I'll make sure you get a whole load of cheese.
        - id: ch02-b06
          speaker: narrator
          text: >-
            While we talked, he kept touching the cloth of my jacket, smoothing my hands, and staring at my boots. Whenever he paused, he showed a childlike delight at simply being near another person. But when I mentioned getting aboard again, his expression suddenly turned sharp and sly.
        - id: ch02-b07
          speaker: ben_gunn
          text: >-
            If you ever get aboard again, you say? Well now, who's stopping you?
        - id: ch02-b08
          speaker: narrator
          text: >-
            Not you. I know that much.
        - id: ch02-b09
          speaker: ben_gunn
          text: >-
            And you're right! Now then, mate, what do they call you?
        - id: ch02-b10
          speaker: narrator
          text: >-
            Jim.
        - id: ch02-b11
          speaker: ben_gunn
          text: >-
            Jim, Jim. Well, Jim, I've had such a rough life out here, you'd be ashamed to hear about it. Looking at me now, would you ever guess I had a religious mother?
        - id: ch02-b12
          speaker: narrator
          text: >-
            Not especially.
        - id: ch02-b13
          speaker: ben_gunn
          text: >-
            Ah, but I did, and she was remarkably religious. I used to be a good, proper boy myself. I could race through my catechism so fast, nobody could tell one word from the next. And look where I ended up! It all started with gambling on the churchyard gravestones. Then it got worse, just as my dear mother said it would. She predicted the whole thing. But Providence put me on this island. I've had time to think, and I've returned to a religious life. You won't catch me drinking much rum now. Maybe one tiny sip for luck when I get the chance, but that's all. I mean to be good, and I know how to do it. And Jim—
        - id: ch02-b14
          speaker: narrator
          text: >-
            He glanced all around us and lowered his voice to a whisper.
        - id: ch02-b15
          speaker: ben_gunn
          text: >-
            I'm rich.
        - id: ch02-b16
          speaker: narrator
          text: >-
            I felt certain the poor man had gone mad from being alone, and my face must have shown it.
        - id: ch02-b17
          speaker: ben_gunn
          text: >-
            Rich! I said I'm rich! And listen, Jim. I'll make a man of you. You'll thank your lucky stars you were the first one to find me!
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: >-
            Then a shadow passed over his face. He gripped my hand more tightly and raised one finger in warning before my eyes.
        - id: ch02-b19
          speaker: ben_gunn
          text: >-
            Now tell me the truth, Jim. That isn't Flint's ship, is it?
    - id: ch03
      title: A New Ally
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That question gave me a hopeful idea. Perhaps I had found someone who would help us, so I answered at once.
        - id: ch03-b02
          speaker: narrator
          text: >-
            It isn't Flint's ship. Flint is dead. But since you asked for the truth, some of his old crew are aboard, and that's bad luck for the rest of us.
        - id: ch03-b03
          speaker: ben_gunn
          text: >-
            Not a man with one leg?
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: >-
            Silver?
        - id: ch03-b05
          speaker: ben_gunn
          text: >-
            Yes, Silver! That was his name.
        - id: ch03-b06
          speaker: narrator
          text: >-
            He's the ship's cook, and he's leading the mutiny too.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Ben still had hold of my wrist. At that answer, he twisted it hard.
        - id: ch03-b08
          speaker: ben_gunn
          text: >-
            If Long John sent you, I'm as good as dead. I know that. But then, where do you stand in all this?
        - id: ch03-b09
          speaker: narrator
          text: >-
            I decided immediately to trust him. I told him the whole story of our voyage and the dangerous position we were in. He listened eagerly. When I finished, he patted me on the head.
        - id: ch03-b10
          speaker: ben_gunn
          text: >-
            You're a good boy, Jim. And your whole party's tied up in a mighty hard knot, isn't it? Well, put your trust in Ben Gunn. Ben Gunn's the man to get you out. Now, if I helped your squire while he's caught in that knot, do you think he'd be generous to me?
        - id: ch03-b11
          speaker: narrator
          text: >-
            I told him the squire was as generous as any man alive.
        - id: ch03-b12
          speaker: ben_gunn
          text: >-
            Aye, but I don't mean he'd hire me to mind a gate and give me a fine servant's coat. That's not what Ben Gunn is after. I mean, would he pay me, say, one thousand pounds out of money that's almost mine already?
        - id: ch03-b13
          speaker: narrator
          text: >-
            I'm sure he would. We already agreed that everyone on the voyage would get a share.
        - id: ch03-b14
          speaker: ben_gunn
          text: >-
            And he'd give me passage home?
        - id: ch03-b15
          speaker: narrator
          text: >-
            The squire is a gentleman. Besides, once we're rid of the others, we'll need you to help sail the ship home.
        - id: ch03-b16
          speaker: ben_gunn
          text: >-
            Ah. Yes, you would.
        - id: ch03-b17
          speaker: narrator
          text: >-
            He looked greatly relieved.
    - id: ch04
      title: Ben Gunn's Secret
      blocks:
        - id: ch04-b01
          speaker: ben_gunn
          text: >-
            Now I'll tell you something, but only this much. I sailed on Flint's ship when he buried the treasure. Flint went ashore with six men, six strong sailors, and they stayed there nearly a week. The rest of us kept the old Walrus cruising offshore.
        - id: ch04-b02
          speaker: ben_gunn
          text: >-
            Then one fine day, the signal went up. Flint came rowing back alone in a little boat, with a blue scarf wrapped around his head. The sun was just rising, and as his boat reached our bow, his face looked deathly white. But there he was, while the other six men were dead and buried. Not one of us aboard could understand how he'd done it. There must have been a battle, murder, and sudden death, with Flint alone against all six.
        - id: ch04-b03
          speaker: ben_gunn
          text: >-
            Billy Bones was mate then, and Long John was quartermaster. They asked Flint where he'd hidden the treasure. Flint told them, “Go ashore and stay there if you like. But this ship will head out to find more treasure, by thunder!” Those were his very words.
        - id: ch04-b04
          speaker: ben_gunn
          text: >-
            Three years ago, I was sailing on a different ship when we spotted this island. I told the men, “That's where Flint's treasure is. Let's go ashore and find it.” The captain was angry about that, but every one of my shipmates agreed with me. They were all set on the idea, so we landed anyway.
        - id: ch04-b05
          speaker: ben_gunn
          text: >-
            They searched for twelve days, and every day they had harsher words for me. Then one fine morning, every last man went back aboard. They said, “As for you, Benjamin Gunn, here's a musket, a spade, and a pickax. You can stay right here and find Flint's money for yourself.” And that was exactly what they did.
        - id: ch04-b06
          speaker: ben_gunn
          text: >-
            So here I've been for three years, Jim, without one bite of proper Christian food. But take a good look at me. Do I look like an ordinary sailor who worked before the mast? You'd say no. And I wasn't one either.
        - id: ch04-b07
          speaker: narrator
          text: >-
            He winked at me and gave me a hard pinch.
        - id: ch04-b08
          speaker: ben_gunn
          text: >-
            Be sure you tell your squire those exact words, Jim. “He wasn't an ordinary sailor either.” That's what you say. Tell him Ben Gunn spent three years alone on this island, day and night, in good weather and bad. Sometimes he thought about saying a prayer. Sometimes he thought about his old mother, if she's still alive. But make sure you tell him this. Most of Ben Gunn's time went into something else. Then give the squire a little pinch, the way I just pinched you.
        - id: ch04-b09
          speaker: narrator
          text: >-
            He pinched me again, as if we shared a great secret.
        - id: ch04-b10
          speaker: ben_gunn
          text: >-
            Then you tell him, “Gunn is a good man.” Tell him I put far more trust in a gentleman born than I do in these gentlemen of fortune, even though I used to be one myself. Remember, far more trust.
        - id: ch04-b11
          speaker: narrator
          text: >-
            I don't understand a word of that. But never mind. How am I supposed to get back aboard the ship?
        - id: ch04-b12
          speaker: ben_gunn
          text: >-
            Ah, that's the hard part. Well, I built a boat with my own two hands. I keep it hidden under the white rock. If everything goes wrong, we might try it after dark. Hey! What's that?
          emotion: surprised
    - id: ch05
      title: The Cannon and the Flag
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The sun still had an hour or two left in the sky. Just then, a cannon thundered, and every echo on the island seemed to wake and roar with it.
        - id: ch05-b02
          speaker: narrator
          text: >-
            They've started fighting! Follow me!
        - id: ch05-b03
          speaker: narrator
          text: >-
            I ran toward the anchorage, forgetting every fear I had felt before. The marooned man in his goatskins stayed close beside me, trotting along easily.
        - id: ch05-b04
          speaker: ben_gunn
          text: >-
            Left, Jim, left! Keep under the trees! That's where I killed my first goat. They never come down here now. They're all high up on the mountains because they're afraid of Benjamin Gunn. Ah, and there's the cemetery. See those mounds? I used to come here and pray now and then, whenever I thought it might be Sunday. It wasn't quite a chapel, but it felt more solemn. You can tell the squire Ben Gunn had to manage alone, with no chaplain, no Bible, and no flag.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Ben went on talking like that while I ran. He neither expected nor received any answer from me.
        - id: ch05-b06
          speaker: narrator
          text: >-
            After a long pause, the cannon shot was followed by a burst of musket fire.
        - id: ch05-b07
          speaker: narrator
          text: >-
            There was another pause. Then, less than a quarter mile ahead, I saw the Union Jack fluttering above the woods.
