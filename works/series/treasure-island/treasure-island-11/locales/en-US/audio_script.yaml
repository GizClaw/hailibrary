  chapters:
    - id: ch01
      title: What I Heard in the Apple-Barrel
      blocks:
        - id: ch01-b01
          speaker: long_john_silver
          text: >-
            Not me. Flint was captain, and I was quartermaster, wooden leg and all. I lost my leg in the same broadside where old Pew lost his sight. The surgeon who cut it off was a fine one. He'd been to college and could pour out Latin by the bucket. It did him no good. They hanged him like a dog and left him drying in the sun at Corso Castle with the rest of Roberts's men. That trouble came from changing their ships' names, calling one the Royal Fortune and then giving another some new name. I say a ship should keep the name she was christened with. The Cassandra kept hers, and she brought every one of us safely home from Malabar after England captured the Viceroy of the Indies. Flint's old Walrus kept her name too. I've seen that ship running wild, her decks red with blood and her hold so heavy with gold that she was ready to sink.
        - id: ch01-b02
          speaker: dick
          text: >-
            Ah, Flint was the finest of them all!
          emotion: surprised
        - id: ch01-b03
          speaker: long_john_silver
          text: >-
            They say Davis was a real man too, though I never sailed with him. I served under England first, then Flint. That's my history. Now I'm working for myself, you might say. I put away nine hundred pounds from England's voyages and two thousand more after Flint. Not bad for an ordinary sailor, and every bit of it safe in the bank. Earning money isn't what matters. Saving it does. Look at the others. Where are England's men now? I couldn't tell you. Where are Flint's? Most of them are right here aboard, happy enough to get pudding after some of them had been begging for food. Old Pew lost his sight and ought to have known better. Instead, he spent twelve hundred pounds in one year, living like a lord in Parliament. And where is he now? Dead and under the hatches. For two whole years before that, the man was starving. He begged, stole, and cut throats, and after all that he still starved, by thunder!
        - id: ch01-b04
          speaker: dick
          text: >-
            Then I guess the money doesn't do much good after all.
        - id: ch01-b05
          speaker: long_john_silver
          text: >-
            It does no good for fools, and neither does anything else. But listen. You're young, yet you're sharp as they come. I saw it the first time I looked at you, so I'll speak to you man to man.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Imagine how I felt. The hateful old scoundrel was flattering someone else with the very same words he had used on me. If I could have moved, I think I would have killed him right through the barrel. Silver had no idea anyone was listening, and he went on.
        - id: ch01-b07
          speaker: long_john_silver
          text: >-
            Here's the truth about gentlemen of fortune. We live rough and risk the gallows, but we eat and drink like fighting cocks. When a voyage ends, we have hundreds of pounds in our pockets instead of a few pennies. Most men blow it all on rum and one wild spree. Then they go back to sea with nothing but the shirts on their backs. That's not my way. I put my money away in different places, some here and some there. I never leave too much in any one spot, because too much trust makes people suspicious. I'm fifty now. Once this voyage is over, I'll settle down and live as a true gentleman. About time, you might say. But I've lived comfortably while I waited. I've never denied myself anything my heart wanted. Except when I was at sea, I slept in a soft bed and ate fine food all my days. And where did I begin? I was an ordinary hand before the mast, just like you.
        - id: ch01-b08
          speaker: dick
          text: >-
            But isn't all your other money gone now? After this, you won't dare show your face in Bristol.
        - id: ch01-b09
          speaker: long_john_silver
          text: >-
            And where do you think I kept it?
        - id: ch01-b10
          speaker: dick
          text: >-
            In Bristol, in the banks and places like that.
        - id: ch01-b11
          speaker: long_john_silver
          text: >-
            It was there when we raised anchor. By now, my wife has it all. The Spy-glass is sold, lease, goodwill, furniture, and everything. She's already gone to meet me. I'd tell you where, because I trust you, but the others would get jealous.
        - id: ch01-b12
          speaker: dick
          text: >-
            Can you really trust your wife?
        - id: ch01-b13
          speaker: long_john_silver
          text: >-
            Gentlemen of fortune don't often trust one another, and they're right not to. But I have my own way of handling things. If a man who knows me breaks faith with old John, he won't stay long in this world. Some men feared Pew, and some feared Flint. Flint himself feared me. He did, and he was proud of it too. His crew was the roughest afloat. The devil himself would have been afraid to go to sea with them. Now, I'm not a man who boasts. You've seen for yourself how easily I get along with everyone. But when I was quartermaster, "lambs" wasn't a gentle enough word for the way Flint's old buccaneers behaved around me. You can feel safe aboard old John's ship.
        - id: ch01-b14
          speaker: dick
          text: >-
            Well, John, I didn't like this business much at all before we talked. But I'm with you now. Shake on it.
        - id: ch01-b15
          speaker: long_john_silver
          text: >-
            You're a brave lad and a clever one too. I've never seen a finer young gentleman of fortune.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Silver shook Dick's hand so hard that the whole barrel trembled. By then, I understood their secret language. A "gentleman of fortune" meant nothing more or less than an ordinary pirate. The little scene I had overheard was the final step in corrupting one of the honest sailors. For all I knew, Dick might have been the last honest man left aboard. I soon learned that he was not. Silver gave a little whistle, and a third man wandered over and sat down with them.
        - id: ch01-b17
          speaker: long_john_silver
          text: >-
            Dick's with us.
        - id: ch01-b18
          speaker: israel_hands
          text: >-
            I knew Dick would come around. He's no fool. But listen, Barbecue. How long are we going to drift around like some useless supply boat? I've had nearly enough of Captain Smollett ordering me about. I want into that cabin. I want their pickles, their wine, and the rest of it.
        - id: ch01-b19
          speaker: long_john_silver
          text: >-
            Israel, your head was never worth much, but I suppose you can listen. Your ears are big enough. So hear me. You'll sleep forward, eat rough, speak softly, and stay sober until I give the word. Count on that, my son.
        - id: ch01-b20
          speaker: israel_hands
          text: >-
            I'm not saying no. I'm asking when. That's all.
        - id: ch01-b21
          speaker: long_john_silver
          text: >-
            When? By thunder, if you need to know, I'll tell you. At the very last moment I can manage. Captain Smollett is a first-rate sailor, and right now he's sailing this ship for us. The squire and the doctor have the map and all the information. Where is that map? I don't know, and neither do you. So the squire and doctor will find the treasure for us. Then they'll help us carry it back and load it safely aboard. Only after that will we act. If I could trust every one of you, I'd even have Captain Smollett navigate us halfway home before I struck.
        - id: ch01-b22
          speaker: dick
          text: >-
            Aren't we all sailors here?
        - id: ch01-b23
          speaker: long_john_silver
          text: >-
            We're all forecastle hands, you mean. We can hold the wheel and steer once someone gives us a course, but which of you can work out where that course lies? That's where you gentlemen always fail, from the first day to the last. If it were up to me, Captain Smollett would take us all the way back into the trade winds. Then we'd have no ruined calculations and no sitting helpless while our water came down to one spoonful a day. But I know what you're like. I'll finish them on the island as soon as the money is safely aboard, though it's a shame to waste them. None of you are happy unless you're drunk. It turns my stomach to sail with men like you!
          emotion: angry
        - id: ch01-b24
          speaker: israel_hands
          text: >-
            Easy, Long John. Who's arguing with you?
        - id: ch01-b25
          speaker: long_john_silver
          text: >-
            How many fine ships do you think I've seen captured and boarded? How many strong young men have I seen hanging in the sun at Execution Dock? And every time, the cause was the same. Hurry, hurry, hurry. Do you hear me? I've seen a thing or two at sea, and I've learned from it. If you'd only set a proper course and keep one point to windward, you'd live to ride in carriages. But you won't. I know the kind of men you are. You'll gulp down your rum tomorrow, throw every chance away, and end on the gallows.
          emotion: angry
        - id: ch01-b26
          speaker: israel_hands
          text: >-
            Everyone knows you're almost a preacher, John. But other men could sail and command as well as you. They enjoyed themselves. They weren't so stiff and proper. They had their fun together like good shipmates.
        - id: ch01-b27
          speaker: long_john_silver
          text: >-
            Is that so? Then where are they now? Pew lived that way, and he died a beggar. Flint did too, and rum killed him in Savannah. A charming crew they were. But where are they now?
        - id: ch01-b28
          speaker: dick
          text: >-
            Once we attack them, what are we going to do with them?
        - id: ch01-b29
          speaker: long_john_silver
          text: >-
            That's the man for me! Now you're talking business. What would you choose? Leave them on shore like maroons? That was England's way. Or cut them down like pork? Flint and Billy Bones would have done that.
        - id: ch01-b30
          speaker: israel_hands
          text: >-
            Billy was always ready for that. "Dead men don't bite," he'd say. Well, now he's dead himself, so he knows the whole truth of it. If ever a hard man came into port, it was Billy.
        - id: ch01-b31
          speaker: long_john_silver
          text: >-
            Exactly. Rough and quick. Now listen. I'm an easy man, a gentleman, you might say. But this time it's serious. Duty is duty, mates, and my vote is death. When I'm in Parliament, riding in my coach, I don't want one of these sea-lawyers from the cabin turning up at home like the devil at prayers. Wait, that's my word. But when the time comes, let it rip!
        - id: ch01-b32
          speaker: israel_hands
          text: >-
            John, you're a real man!
        - id: ch01-b33
          speaker: long_john_silver
          text: >-
            You'll know it when you see me, Israel. I ask for only one thing. Trelawney is mine. I'll twist his fool head off with these hands. Dick, be a good lad. Jump up and fetch me an apple to moisten my pipe.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Think how terrified I was. I would have leaped out and run if my heart and legs had not failed me. Dick started to rise. Then someone seemed to stop him.
        - id: ch01-b35
          speaker: israel_hands
          text: >-
            Forget that! Don't drink that bilge water, John. Let's have some rum.
        - id: ch01-b36
          speaker: long_john_silver
          text: >-
            Dick, I trust you. Mind this, though. I've marked the level in the keg. Here's the key. Fill a cup and bring it up.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Even in my terror, I realized this must be how Mr. Arrow had gotten the liquor that ruined him. Dick was gone only a short while. While he was away, Israel leaned close and spoke straight into Silver's ear. I caught only a few words, but they told me something important. Along with other scraps, I clearly heard one whole sentence.
        - id: ch01-b38
          speaker: israel_hands
          text: >-
            Not one more of them will join us.
        - id: ch01-b39
          speaker: narrator
          text: >-
            So there were still loyal men aboard. Dick came back, and the three drank from the cup one after another.
        - id: ch01-b40
          speaker: dick
          text: >-
            To luck.
        - id: ch01-b41
          speaker: israel_hands
          text: >-
            Here's to old Flint.
        - id: ch01-b42
          speaker: long_john_silver
          text: >-
            Here's to ourselves. Hold your course, and we'll have plenty of prizes and plenty of pudding.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Just then, light spilled into the barrel. I looked up and saw that the moon had risen. It silvered the mizzen-top and shone white against the forward sail. At almost the same moment, the lookout's voice rang out.
        - id: ch01-b44
          speaker: lookout
          text: >-
            Land ho!
