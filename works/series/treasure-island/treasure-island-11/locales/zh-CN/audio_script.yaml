audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑爽朗，善于用水手口吻取信于人，激动时夸张有力
        timbre: 洪亮厚实，带一点粗粝感
        pace: 灵活明快
        pitch: 中低
    israel_hands:
      display_name: 伊斯雷尔·汉兹
      tts:
        delivery: 老练世故，口吻粗直，谈起海上人物时十分笃定
        timbre: 低沉沙哑
        pace: 适中
        pitch: 低
    dick:
      display_name: 迪克
      tts:
        delivery: 年轻直率，容易受人鼓动，语气里带着初入歧途的犹疑
        timbre: 清亮而略显稚嫩
        pace: 稍快
        pitch: 中高
    lookout:
      display_name: 瞭望手
      tts:
        delivery: 警醒有力，喊报时声音高亢悠长
        timbre: 洪亮清晰
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 弗林特和他的旧部
      blocks:
        - id: ch01-b01
          speaker: silver
          text: 我可没当船长。船长是弗林特，我呢，因为这条木腿，只做军需官。那场舷炮战打下来，我丢了腿，老皮尤丢了那对招子。替我截腿的是个顶好的医生，正经上过大学，拉丁文一开口能倒出一大桶，别的本事也样样不缺。可他后来照样让人像狗一样吊死，和其他人一起挂在科尔索城堡晒成了干尸。那是罗伯茨的手下。他们落得这种下场，就因为总给船换名字，什么《皇家财富号》之类。依我看，船受洗时叫什么，就该一直叫什么。《卡桑德拉号》没改名。英格兰夺下《印度总督号》以后，它把我们从马拉巴尔一个不少地送回了家。弗林特那条老船《海象号》也没改。我亲眼见过它满船是鲜红的血，也见过它装着多得快把船压沉的黄金。
        - id: ch01-b02
          speaker: dick
          text: 弗林特真是那伙人里最了不起的一个！
        - id: ch01-b03
          speaker: narrator
          text: 这是船上最年轻的水手。他听得入迷，话里全是敬佩。
        - id: ch01-b04
          speaker: silver
          text: 听说戴维斯也是条汉子，不过我没跟他一起出过海。我先跟英格兰，后来跟弗林特，这就是我的经历。现在嘛，算是替自己干。跟英格兰时，我安安稳稳存了九百镑，跟弗林特又攒了两千镑。一个普通水手能有这些，很不错了。钱全都稳稳放在银行里。听着，现在要紧的不是挣钱，是把钱守住。英格兰的人如今在哪儿，我不知道。弗林特的人呢？多半就在这条船上。有些人先前还在讨饭，如今能吃到一口葡萄干布丁就高兴。老皮尤瞎了眼，本该知道收敛，却一年花掉一千二百镑，摆的派头像个国会议员。结果呢？他如今已经死了，躺在棺材板下面。死前那两年更惨，讨饭、偷窃、割人喉咙，什么都做，到头来还是饿肚子。老天作证！
        - id: ch01-b05
          speaker: dick
          text: 那这样看来，钱到头来也没什么用。
        - id: ch01-b06
          speaker: silver
          text: 钱落到傻瓜手里当然没用，什么东西都一样。不过我跟你说，你虽然年轻，脑子可机灵。我第一眼就看出来了，所以才把你当男子汉，跟你说这些实在话。
        - id: ch01-b07
          speaker: narrator
          text: 你们可以想想，我听见这个可恶的老骗子拿当初奉承我的那套话，又去笼络另一个人，心里是什么滋味。要是那时动弹得了，我真想隔着木桶杀了他。可西尔弗根本不知道有人偷听，还在滔滔不绝。
    - id: ch02
      title: 时运绅士
      blocks:
        - id: ch02-b01
          speaker: silver
          text: 说起我们这些时运绅士，平时过的是苦日子，脑袋也随时可能套上绞索。不过一旦有了吃喝，就过得像斗鸡一样威风。一趟买卖做完，口袋里装的是几百镑，不是几百个小铜子。多数人拿钱去灌朗姆酒，再痛痛快快闹上一场。等到重新出海，他们浑身只剩一件衬衫。我走的可不是这条路。钱要分开来存，这里放一点，那里放一点，哪一处都不能太多，免得惹人怀疑。你记住，我已经五十岁了。这趟航程一回来，我就要真正做个绅士。你会说，现在也不算晚。这些年我同样没委屈自己，心里想要什么，从没舍不得。除了在海上的时候，我天天睡软床，吃精细饭菜。可我当初是怎么起步的？还不是跟你一样，只是个普通水手。
        - id: ch02-b02
          speaker: dick
          text: 可你那些钱现在不是没了吗？咱们干完这件事，你还敢回布里斯托尔？
        - id: ch02-b03
          speaker: silver
          text: 那你说，我的钱会放在哪儿？
        - id: ch02-b04
          speaker: dick
          text: 当然在布里斯托尔，存在银行那些地方。
        - id: ch02-b05
          speaker: silver
          text: 起锚的时候确实还在那里。现在，全在我家老太婆手上了。《望远镜》也已经卖掉，店面、租约和家当全脱了手。老太婆正在赶来跟我会合。我信你，原本可以告诉你地点，可别的伙伴会眼红。
        - id: ch02-b06
          speaker: dick
          text: 你真能相信你家老太婆？
        - id: ch02-b07
          speaker: silver
          text: 时运绅士彼此很少信任，这样才对。不过我自有我的办法。哪个熟悉我的伙伴敢挣脱缆绳，跟老约翰翻脸，我就让他从这个世上消失。有人怕皮尤，也有人怕弗林特。可就连弗林特本人也怕我。他不光怕我，还服我。他手下那伙人，是海上最凶的一群，就连魔鬼也不敢跟他们一起出海。我不是爱吹牛的人。你也亲眼见过，我平时跟大家相处得多和气。可我当军需官的时候，弗林特那些老海盗要还算得上羔羊，世上就没有羔羊了。只要上了老约翰的船，你就尽管把心放稳。
        - id: ch02-b08
          speaker: dick
          text: 约翰，我跟你说实话。刚才以前，我连这桩买卖的四分之一都不喜欢。现在不一样了，我跟你握手，这事我答应。
        - id: ch02-b09
          speaker: silver
          text: 你又勇敢，又机灵。拿你去做时运绅士船上的船头雕像，我再找不到更体面的人了。
        - id: ch02-b10
          speaker: narrator
          text: 西尔弗使劲握住对方的手，震得我藏身的苹果桶直晃。这时我才完全听懂他们的隐语。所谓时运绅士，说穿了就是普通的海盗。我刚才听见的，正是一个老实水手堕落前的最后一幕。他也许还是船上最后一个没有变坏的人。不过，我很快就不必为这件事担心了。西尔弗轻轻吹了声口哨，第三个人慢慢走过来，在他们旁边坐下。
        - id: ch02-b11
          speaker: silver
          text: 迪克已经跟我们一条心了。
    - id: ch03
      title: 何时动手
      blocks:
        - id: ch03-b01
          speaker: israel_hands
          text: 我早知道迪克靠得住，他又不傻。
        - id: ch03-b02
          speaker: narrator
          text: 说话的是舵手伊斯雷尔·汉兹。他把烟草块拨到嘴巴另一边，朝地上啐了一口。
        - id: ch03-b03
          speaker: israel_hands
          text: 不过听着，烤肉，我倒有件事要问。我们还得像一条该死的卖货小艇一样，在外面来来回回兜多久？斯莫列特船长使唤我已经使唤够了，真见鬼！我现在就想进那间船舱，吃他们的腌菜，喝他们的酒，再把别的好东西也拿来。
        - id: ch03-b04
          speaker: silver
          text: 伊斯雷尔，你那颗脑袋从来不顶用。可你总该听得见，那双耳朵毕竟够大。我没发话以前，你就睡前舱，吃苦头，说话小心，还得少喝酒。给我牢牢记住。
        - id: ch03-b05
          speaker: israel_hands
          text: 我又没说不干。我只问一句，到底什么时候动手？
        - id: ch03-b06
          speaker: silver
          text: 什么时候？当然是我能拖到的最后一刻！斯莫列特是个一流的水手，现在正替我们驾着这条该死的船。乡绅和医生手上还有地图什么的。地图藏在哪儿，我不知道，对不对？你也不知道，是不是？那就让他们先找到宝藏，再替我们把东西搬上船。老天在上，等这些事都办完再说。要是我真能信得过你们这帮杂种，我甚至会让斯莫列特替我们走完一半返航路程，然后才动手。
        - id: ch03-b07
          speaker: dick
          text: 可我觉得，船上大伙儿都是水手呀。
        - id: ch03-b08
          speaker: silver
          text: 该说大家都是在前甲板干活的水手。我们会掌舵，可谁能定航线？你们这些人从头到尾，总是坏在这件事上。要是由我作主，至少该让斯莫列特带我们回到信风带。那样就不会算错航程，落到最后一天，每个人只能分到一勺水。不过，我知道你们是什么货色，肯定忍不了那么久。等宝藏一搬上船，我就在岛上杀掉他们，虽然这样实在可惜。可你们非得喝到烂醉才觉得痛快。真要笑破我的肚皮了。跟你们这种人一起出海，真叫我恶心！
          emotion: angry
        - id: ch03-b09
          speaker: israel_hands
          text: 消消气吧，高个子约翰。这里有谁反对你了？
        - id: ch03-b10
          speaker: silver
          text: 你们倒说说，我见过多少大船遭人靠舷攻占？又见过多少好小伙子挂在行刑码头，让太阳晒成干尸？全都是因为急，急，还是急！听明白没有？我在海上见过的事情可不少。只要你们肯照定好的航线走，手里始终留一点上风余地，以后就能坐上马车。可你们偏不肯听！我太了解你们了。明天准会灌上一肚子朗姆酒，最后走上绞架。
          emotion: angry
        - id: ch03-b11
          speaker: israel_hands
          text: 人人都知道你爱像传教士一样说教，约翰。可还有些人，驾船掌舵的本事一点不比你差。他们就爱找点乐子，从不摆出你这副一本正经、滴酒不沾的样子。他们痛痛快快玩上一场，个个照样是快活的好伙伴。
        - id: ch03-b12
          speaker: silver
          text: 是吗？那他们如今在哪儿？皮尤爱这么玩，结果死时是个乞丐。弗林特也爱这么玩，最后在萨凡纳被朗姆酒送了命。他们可真是一帮好伙伴，只不过人都到哪儿去了？
    - id: ch04
      title: 西尔弗的一票
      blocks:
        - id: ch04-b01
          speaker: dick
          text: 等我们横过去截住他们以后，到底该怎么处置他们？
        - id: ch04-b02
          speaker: silver
          text: 这才是我喜欢的人，这才叫谈正事。你觉得该怎么办？像英格兰那样，把他们扔在荒岛上？还是照弗林特和比利·博恩斯的办法，把他们当猪肉一样砍倒？
        - id: ch04-b03
          speaker: israel_hands
          text: 比利最会干这种事。他总说，死人不会咬人。得了，现在他自己也死了，总算把这句话的来龙去脉全弄明白啦。要说有哪个粗暴的狠角色最后还能进港，比利准算一个。
        - id: ch04-b04
          speaker: silver
          text: 说得对，比利下手又快又狠。不过你们听清楚，我平时好说话，也完全算得上一个绅士，可这一次事情非同小可，不能含糊。责任就是责任，伙计们。我的一票投给死。等我当上国会议员，坐着自己的马车出门，我可不想哪天看见这帮海上讼棍突然回家，像祷告时出现的魔鬼一样，冷不防闯进我的船舱。我主张现在先等。可时候一到，就让他们全完蛋！
          emotion: angry
        - id: ch04-b05
          speaker: israel_hands
          text: 约翰，你才是真正的男子汉！
        - id: ch04-b06
          speaker: silver
          text: 伊斯雷尔，等你亲眼见过我的手段，自然会这么说。我只要求一件事，我要一个人。特里劳尼归我！我要用这双手，亲自把他那颗牛犊脑袋从身子上拧下来！迪克，好孩子，快跳起来给我拿个苹果，我好润润烟斗。
        - id: ch04-b07
          speaker: narrator
          text: 你们可以想象，我怕到了什么地步。只要身上还有一点力气，我早就跳出木桶，转身逃走了。可我的手脚和心全都不听使唤。我听见迪克开始起身，紧接着，仿佛又有人把他拦了下来。
        - id: ch04-b08
          speaker: israel_hands
          text: 得了，别去拿苹果！约翰，别喝那舱底污水。咱们来点朗姆酒吧。
        - id: ch04-b09
          speaker: silver
          text: 迪克，我信你。可记住，酒桶上有刻度，我一直看着。钥匙给你，装一小锡杯拿上来。
        - id: ch04-b10
          speaker: narrator
          text: 我虽然已经怕成这样，脑子里还是忍不住冒出一个念头。亚罗先生准是用同样的办法弄到那些烈酒，最后让酒毁掉了自己。
    - id: ch05
      title: 陆地在前
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 迪克没离开多久。他不在的那一会儿，伊斯雷尔一直贴着厨子的耳朵低声说话，一刻也没有停下来。我只能听清零星一两个词，可那些话都指向同一件事，还是让我得知了一个要紧消息。除了那些断断续续的话，其中还有一整句，我从头到尾听得明明白白。
        - id: ch05-b02
          speaker: israel_hands
          text: 他们剩下的人，一个也不会入伙。
        - id: ch05-b03
          speaker: narrator
          text: 原来船上还有忠诚可靠的人。迪克回来后，三个人一个接一个地拿起小锡杯喝酒。第一个说，祝咱们走运。另一个举杯说，敬老弗林特。轮到西尔弗，他用唱歌一样的调子开了口。
        - id: ch05-b04
          speaker: silver
          text: 敬我们自己，迎风稳稳走，奖赏多多，布丁够够。
        - id: ch05-b05
          speaker: narrator
          text: 就在这时，一片亮光落进桶里。我抬头望去，月亮已经升了起来。银光铺在后桅楼上，前帆迎风的那一边也被照得雪白。几乎就在同一刻，瞭望手高声喊了起来。
        - id: ch05-b06
          speaker: lookout
          text: 陆地——在前面！
