audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    pirate_singer:
      display_name: 唱歌的海盗
      tts:
        delivery: 醉意沉沉，拖着古老水手歌的长腔
        timbre: 粗哑低沉的成年男声
        pace: 缓慢拖沓，句尾颤悠悠地拉长
        pitch: 低
    pirate_chorus_1:
      display_name: 海盗甲
      tts:
        delivery: 酒后放纵，粗野而响亮
        timbre: 沙哑厚重的成年男声
        pace: 节拍鲜明
        pitch: 低
    pirate_chorus_2:
      display_name: 海盗乙
      tts:
        delivery: 酒后放纵，粗野而响亮
        timbre: 浑厚浑浊的成年男声
        pace: 节拍鲜明
        pitch: 中低
    pirate_chorus_3:
      display_name: 海盗丙
      tts:
        delivery: 酒后放纵，粗野而响亮
        timbre: 尖涩有力的成年男声
        pace: 节拍鲜明
        pitch: 中
  chapters:
    - id: ch01
      title: 摸不清脾气的小圆舟
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 后来我才知道，这只科拉克小圆舟其实很安全。像我这样高、这样重的人坐进去，它浮得稳，在浪里也灵便。可真要驾驭它，那就麻烦透了。它又歪又别扭，不管怎么划，总比别的船横着漂得更远，最擅长的却是原地打转。连本·冈自己都承认，摸不清这条船的脾气，就难摆弄得很。
        - id: ch01-b02
          speaker: narrator
          text: 我那时当然不懂它的脾气。我要去的方向，它偏不肯去，大半时间都横着身子随水漂，船舷直冲着水流。若不是退潮一直推着我，我绝不可能靠近大船。幸好西斯帕尼奥拉号就在水道中央。不管我怎样乱划，退潮始终只顾带着我往下游走，而大船正好挡在途中，想错过都难。
        - id: ch01-b03
          speaker: narrator
          text: 起初，大船只是黑暗里一团比夜色还浓的黑影。慢慢地，桅杆和船身才有了形状。水越流越急，仿佛一眨眼，我已经来到锚缆旁边，伸手牢牢抓住了它。
        - id: ch01-b04
          speaker: narrator
          text: 那根缆绳绷得像弓弦。潮水太猛，大船被冲得不停拉扯船锚。船身四周，细浪在黑暗里翻滚，冒着泡，咕嘟咕嘟地响，很像一条小山溪。只要用水手刀割上一下，西斯帕尼奥拉号就会顺着退潮呼啸而去。
        - id: ch01-b05
          speaker: narrator
          text: 可我忽然想起，绷紧的缆绳要是一下断开，就和尥蹶子的马一样危险。我若是莽撞地下刀，十有八九，缆绳会把我和小圆舟一起抽出水面。我只得停下来，一时再不敢动手。要不是运气又格外帮了我，这个计划只能放弃。
        - id: ch01-b06
          speaker: narrator
          text: 白天从东南方和南方来的微风，入夜后已经转向西南。就在我发愁时，一阵风兜住大船，把它往上游顶去。锚缆在我手里松了，我那只手也跟着沉进水里一下。我心里一喜，马上拔出水手刀，用牙咬开刀刃，一股一股地割。最后只留下两股绳纤，我便伏着不动，等下一阵风再把它吹松。
    - id: ch02
      title: 黑暗中的争吵与歌声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 船舱里一直有人高声叫嚷。先前我全心都在锚缆上，根本没仔细听。现在只能等待，我才分辨出一个是舵手伊斯雷尔·汉兹。他从前在弗林特船上管火炮。另一个人，就是那个戴红睡帽的海盗。
        - id: ch02-b02
          speaker: narrator
          text: 两人都醉得不轻，却还在喝。其中一个醉醺醺地喊了一声，推开船尾窗，扔出一样东西。我猜是只空酒瓶。他们不只喝醉了，还气得要命，咒骂声像冰雹一样乱飞。每隔一会儿，争吵就会猛地炸开，我总以为他们马上要动手。可每一次又会平息，声音低下去，含含糊糊地抱怨一阵。过不多久，再来一次，仍旧没有结果。
        - id: ch02-b03
          speaker: narrator
          text: 岸上的大篝火透过临岸的树林，照出暖红的光。有人唱起一支古老的水手歌，调子沉闷，拖得很长。每一段唱到末尾，声音都先往下一落，再颤悠悠地拖下去。只要唱歌的人还有耐性，这支歌大概永远也唱不完。我在航行中听过不止一次，还记得其中两句。
        - id: ch02-b04
          speaker: pirate_singer
          text: 七十五个人扬帆出海，到头来只剩一个还活着。
        - id: ch02-b05
          speaker: narrator
          text: 我心想，他们早上刚死了那么多人，这首小调也未免太凄凉、太应景了。不过这些海盗个个心硬得很，简直和他们航行的大海一样。
        - id: ch02-b06
          speaker: narrator
          text: 风终于又来了。大船在黑暗里侧过身，一点点朝我靠近，锚缆再次松下来。我使足力气，终于割断最后的绳纤。小圆舟几乎不受风，立刻被水推向大船船头。西斯帕尼奥拉号也开始以自身为轴缓缓转身，首尾横着扫过水流。
    - id: ch03
      title: 船舱窗口的一眼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我拼命划着，生怕小船下一刻就被淹没。直接往外撑根本没有用，我只好顺着大船一直朝船尾推。好不容易摆脱这个危险的庞然大物，我最后又撑了一下，双手忽然碰到一根从船尾舷墙垂进水里的细绳。我想也没想，一把抓住了。
        - id: ch03-b02
          speaker: narrator
          text: 我也说不清自己为什么这么做。开始只是本能。等我发现细绳系得很牢，好奇心就压过了害怕。我非得往船舱里看一眼不可。于是我两手轮换着收拢细绳，一点点靠近大船。觉得距离够了，我冒着翻船的危险撑起半个身子。这才看清船舱顶，也看到了舱内的一角。
        - id: ch03-b03
          speaker: narrator
          text: 这时，大船和跟在旁边的小圆舟都在水上越滑越快，已经和岸上的篝火并排了。水手会说，大船正在高声说话。它踏过数不清的细浪，一路发出不停翻腾、拍击的水声。我一直不明白，守船的人怎么会毫无察觉。等眼睛刚越过窗台，我只看了一眼，就全明白了。我也只敢看这一眼。汉兹和红睡帽正拼死扭打，两个人各伸一只手，死死掐住对方的喉咙。
        - id: ch03-b04
          speaker: narrator
          text: 我赶紧跌回横座，再迟一点就要掉出船外。眼睛一时还不适应黑暗，眼前只有烟雾缭绕的灯光，还有两张狂怒、涨红的脸。它们纠缠在一起，不停摇晃。我只好闭起双眼，让眼睛重新习惯黑暗。
        - id: ch03-b05
          speaker: narrator
          text: 那支没完没了的歌总算停了。篝火旁剩下的海盗，又一起唱起我听过许多遍的副歌。
        - id: ch03-b06
          speakers: [pirate_singer, pirate_chorus_1, pirate_chorus_2, pirate_chorus_3]
          ensemble: chorus
          text: 十五个人守着死人箱，哟嗬嗬，再来一瓶朗姆酒！酒和魔鬼送了其余人的命，哟嗬嗬，再来一瓶朗姆酒！
        - id: ch03-b07
          speaker: narrator
          text: 我正想着，酒和魔鬼这会儿在西斯帕尼奥拉号的船舱里可真忙。忽然，小圆舟猛地一歪，船头紧跟着急转，像是换了方向，速度也古怪地快了起来。
    - id: ch04
      title: 水流转向外海
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我立刻睁眼。四周全是细小的波纹，浪尖翻卷，发出尖利的簌簌声，还亮着一点磷光。西斯帕尼奥拉号就在几码之外，我仍被它的尾流卷着走。大船像是也站不稳了，桅杆在黑夜里轻轻晃动。我又看了一会儿，才确定它也正在转向南方。
        - id: ch04-b02
          speaker: narrator
          text: 我回头一看，心猛地撞上肋骨。篝火的光居然就在正后方。水流不知何时拐了一个直角，把高大的帆船和跳舞似的小圆舟一起卷过弯去。它越流越急，泡沫越涌越高，低沉的咆哮也越来越响。我们就这样一路打着旋儿，穿过狭窄的水道，直奔外海。
        - id: ch04-b03
          speaker: narrator
          text: 前面的大船忽然猛转，大约一下偏了二十度。几乎同时，船上一声接一声地喊起来，舱梯上也响起急促的脚步。那两个醉鬼终于不再争吵，也终于明白灾难已经到了眼前。
    - id: ch05
      title: 梦见老本葆将军客店
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我平躺进那条可怜的小船，把自己的灵魂交给造物主。我认定水道尽头准有一道怒涛翻滚的沙洲。我们会一头撞上去，我的所有烦恼也会马上结束。我也许还能忍受死亡，可我受不了眼睁睁看着它朝自己逼近。
        - id: ch05-b02
          speaker: narrator
          text: 我大概在那里躺了好几个钟头。波浪一直把小船来回抛动，飞起的水花不时打湿我。每当船头再次栽下去，我都以为下一刻就是死期。后来，疲惫一点点压了上来。哪怕心里仍然害怕，我的头脑也渐渐麻木，偶尔还会昏沉过去。最后，我终于睡着了。小圆舟仍在海浪里颠簸，我却梦见了家，梦见了那座老本葆将军客店。
