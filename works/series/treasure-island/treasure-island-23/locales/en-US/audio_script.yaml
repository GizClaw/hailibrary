  chapters:
    - id: ch01
      title: "XXIII The Ebb-tide Runs"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Before I was done with Ben Gunn's coracle, I learned that it was quite safe for someone my size. It floated well and handled rough water cleverly. But trying to steer it was another matter. The little boat was crooked, lopsided, and determined to slide sideways. Most of all, it loved to spin. Ben Gunn himself later admitted that it was a strange boat to manage until you learned its ways.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I certainly had not learned them. The coracle went everywhere except where I wanted it to go. Most of the time it drifted broadside, and without the tide I would never have reached the ship. Luckily, no matter how badly I paddled, the ebb kept carrying me down the channel. The Hispaniola lay right in its path, almost impossible to miss.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At first she rose ahead of me as a shape blacker than the night. Then I began to make out her hull and spars. The farther I traveled, the faster the current ran. Almost before I knew it, I was beside her anchor rope, and I caught hold of it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The hawser was stretched tight as a bowstring. The current was so strong that the ship pulled hard against her anchor. In the darkness, water bubbled and chattered all around the hull like a little mountain stream. One cut with my sea knife, and the Hispaniola would go humming away with the tide.
        - id: ch01-b05
          speaker: narrator
          text: >-
            That sounded simple. Then I remembered what happens when a tight rope is suddenly cut. It can kick like a horse. If I was foolish enough to slash through the hawser at once, it would probably knock both me and the coracle clean out of the water.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I stopped. Without another piece of good luck, I would have had to give up. During the day, light winds had blown from the southeast and south. After dark they had shifted to the southwest. While I considered what to do, a gust caught the Hispaniola and pushed her up against the current. To my delight, the hawser went slack in my hand, and for a moment my hand dipped beneath the water.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I decided at once. I pulled out my knife, opened it with my teeth, and cut through the strands one after another. Soon only two remained. Then I waited quietly. I would cut those last strands when another breath of wind eased the strain.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Loud voices had been coming from the cabin all this time. I had been too busy to pay much attention, but now I had nothing to do but wait and listen.
        - id: ch01-b09
          speaker: narrator
          text: >-
            One voice belonged to Israel Hands, the coxswain who had once served as Flint's gunner. The other had to be the man in the red nightcap. Both were very drunk, and they were still drinking. As I listened, one of them threw open the stern window with a drunken yell and tossed something out. I guessed it was an empty bottle.
        - id: ch01-b10
          speaker: narrator
          text: >-
            They were not only drunk. They were furious. Their curses flew as thick as hail, and again and again the quarrel burst out so violently that I was sure they would come to blows. Each time, though, it died away. Their voices sank to angry mutters until the next outburst began, then that one passed without a fight as well.
        - id: ch01-b11
          speaker: narrator
          text: >-
            On shore, the great campfire glowed warmly through the trees. Someone there was singing an old sailor's song in a dull, droning voice. Every verse ended in a droop and a quaver. The song seemed likely to last as long as the singer's patience. I had heard it more than once during the voyage, and I remembered the words.
        - id: ch01-b12
          speaker: pirate_singer
          text: >-
            But one man of her crew came back alive, though seventy-five had sailed.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The song felt horribly suited to men who had suffered such cruel losses that very morning. Yet the buccaneers seemed as hard and unfeeling as the sea they sailed.
        - id: ch01-b14
          speaker: narrator
          text: >-
            At last the breeze returned. The schooner slid sideways and drew nearer through the dark. The hawser loosened in my hand once more. With one hard pull of the knife, I cut through the final fibers.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The breeze barely moved the coracle, and the current swept me straight against the Hispaniola's bow. At the same time, the schooner began turning slowly from end to end across the channel.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I worked desperately because I expected the coracle to be swamped at any moment. I could not shove her directly away, so I pushed toward the ship's stern instead. At last I got clear of my dangerous neighbor. As I gave one final push, my hands found a thin cord trailing over the stern rail and down into the water. Without thinking, I grabbed it.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I can hardly explain why. At first it was pure instinct. Once I felt that the cord was tied fast, curiosity took over. I decided to look through the cabin window.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I hauled myself along the cord, hand over hand. When I thought I was close enough, I rose to half my height, though it was terribly risky. From there I could see the cabin roof and a narrow part of the room inside.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The schooner and the tiny boat beside her were moving quickly now. We had already come level with the campfire. Sailors say a ship talks as she travels. The Hispaniola was talking loudly, stepping through countless ripples with one endless, rolling splash. Until my eye reached the window, I could not understand why the watchmen had raised no alarm.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Then my eye cleared the window ledge, and one glance told me everything. It was the only glance I dared take from that rocking little boat. Hands and the red-capped man were locked in a deadly struggle, each gripping the other's throat.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I dropped back onto the seat just in time. I had nearly fallen overboard. For a while, all I could see were those two furious, red faces swaying together beneath the smoky lamp. I closed my eyes and waited for them to grow used to the darkness again.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The endless song had finally stopped. Around the campfire, the smaller band of pirates began the chorus I had heard so many times.
        - id: ch01-b23
          speakers: [pirate_1, pirate_2, pirate_3, pirate_4]
          ensemble: chorus
          text: >-
            Fifteen men on the dead man's chest! Yo-ho-ho, and a bottle of rum! Drink and the devil had finished the rest! Yo-ho-ho, and a bottle of rum!
        - id: ch01-b24
          speaker: narrator
          text: >-
            I was thinking that drink and the devil were very busy inside the Hispaniola's cabin at that moment. Then the coracle gave a sudden lurch. She swung sharply and seemed to take a new course, while her speed rose in a strange way.
        - id: ch01-b25
          speaker: narrator
          text: >-
            I opened my eyes. Small ripples surrounded me, curling over with a sharp, bristling sound and a faint glow. The Hispaniola was still only a few yards ahead, pulling me along in her wake. Now she seemed to stagger, and her spars tossed against the black sky. As I watched, I became certain that she too was turning south.
        - id: ch01-b26
          speaker: narrator
          text: >-
            I looked over my shoulder, and my heart leaped against my ribs. The glow of the campfire was directly behind me. The current had bent at a right angle, carrying the tall schooner and the dancing coracle with it. It spun through the narrow passage toward the open sea, running faster, bubbling higher, and muttering louder all the time.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Suddenly, the schooner swung hard, turning perhaps twenty degrees. Almost at once, one shout after another came from her deck. Feet pounded on the cabin stairs. The two drunken men had finally stopped fighting and realized what was happening to them.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I lay flat in the bottom of that miserable little boat and entrusted my spirit to its Maker. I was certain that we would strike a bar of raging breakers at the end of the straits and that all my troubles would soon be over. Perhaps I could bear to die, but I could not bear to lift my head and watch my fate coming straight toward me.
        - id: ch01-b29
          speaker: narrator
          text: >-
            I must have lain there for hours, beaten back and forth by the waves. Flying spray soaked me now and then, and I never stopped expecting death with the next plunge. Slowly, exhaustion took hold. Even in the middle of my terror, my body grew numb and my mind sometimes slipped into a daze.
        - id: ch01-b30
          speaker: narrator
          text: >-
            At last I fell asleep in the sea-tossed coracle, dreaming of home and the old Admiral Benbow.
