audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    sailor_one:
      display_name: 水手甲
      tts:
        delivery: 粗朴爽快，带着干活时的兴奋
        timbre: 粗犷有力
        pace: 明快
        pitch: 中
    sailor_two:
      display_name: 水手乙
      tts:
        delivery: 随意响亮，带着水手的豪爽
        timbre: 沙哑结实
        pace: 明快
        pitch: 中低
    sailor_three:
      display_name: 水手丙
      tts:
        delivery: 直率有力，唱号子时节奏鲜明
        timbre: 洪亮厚实
        pace: 明快
        pitch: 中低
    silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑爽朗，善于用水手口吻取信于人，激动时夸张有力
        timbre: 洪亮厚实，带一点粗粝感
        pace: 灵活明快
        pitch: 中低
    captain_smollett:
      display_name: 斯莫列特船长
      tts:
        delivery: 严肃克制，判断谨慎，说话干脆而有权威
        timbre: 冷峻坚实
        pace: 稳健
        pitch: 中低
    israel_hands:
      display_name: 伊斯雷尔·汉兹
      tts:
        delivery: 老练世故，口吻粗直，谈起海上人物时十分笃定
        timbre: 低沉沙哑
        pace: 适中
        pitch: 低
    parrot_flint:
      display_name: 鹦鹉弗林特船长
      tts:
        delivery: 尖利急促，机械地重复听来的水手喊话
        timbre: 尖亮刺耳
        pace: 急促
        pitch: 高
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静清醒，措辞从容而判断明确
        timbre: 温和清晰
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 启程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 整整一夜，我们都忙着把东西安放妥当。乡绅的朋友们也坐着一船又一船的小艇赶来，布兰德利先生他们都来祝他一路顺风，平安归来。即使在本葆海军上将客店最忙的时候，我也没干过这么重的活。天快亮了，水手长吹响哨子，船员们握住绞盘杆，我已经累得像条狗。可眼前的一切又新鲜又有趣，我再累一倍也舍不得离开甲板。简短的号令一声接一声，尖厉的哨音划过夜色。船灯昏暗的光里，水手们纷纷奔向自己的位置。
        - id: ch01-b02
          speaker: sailor_one
          text: 喂，烤肉，给大伙儿唱一段！
        - id: ch01-b03
          speaker: sailor_two
          text: 就唱那首老歌！
        - id: ch01-b04
          speaker: silver
          text: 好嘞，好嘞，伙计们。十五个人守着死人箱——
        - id: ch01-b05
          speakers: [sailor_one, sailor_two, sailor_three]
          ensemble: chorus
          text: 哟嗬嗬，再来一瓶朗姆酒！
        - id: ch01-b06
          speaker: narrator
          text: 第三声“嗬”刚落，水手们一齐发力，把绞盘杆推了起来。那一刻，我明明兴奋得很，这首歌却忽然把我带回了从前的本葆海军上将客店。我仿佛又听见老船长扯着尖嗓子，也在跟着众人合唱。
        - id: ch01-b07
          speaker: narrator
          text: 很快，锚链收短了，湿淋淋的锚吊在船头，船帆也吃满了风。两边的陆地和船只不断向后退去。我还没来得及躺下睡上一个钟头，伊斯帕尼奥拉号已经启程，驶向金银岛。
        - id: ch01-b08
          speaker: narrator
          text: 这段航程，我不准备从头到尾细讲。一路还算顺利。船是条好船，水手们都是能干的海员，船长也很懂自己的行当。不过，在我们靠近金银岛以前，发生了两三件不能不说的事。
    - id: ch02
      title: 亚罗先生失踪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 先说亚罗先生。事实证明，他比船长担心的还糟。他压不住手下的水手，大家想怎样就怎样，根本不把他放在眼里。更坏的是，出海一两天后，他常常醉醺醺地出现在甲板上。两眼迷蒙，双颊通红，说话舌头打结。他一次次丢尽脸面，被勒令回舱。有时他跌倒，把自己划伤。有时他在升降口旁的小铺位里躺上一整天。偶尔也能差不多清醒一两天，勉强把差事办好。
        - id: ch02-b02
          speaker: narrator
          text: 可他从哪里弄来的酒，我们谁也猜不透。这成了船上的一个谜。无论大家怎样盯着他，始终找不到答案。当面去问，他喝醉时只会发笑，清醒时却郑重发誓，说自己除了水，什么也没喝。
        - id: ch02-b03
          speaker: narrator
          text: 他当不好大副，还给水手带来坏影响。谁都明白，他照这样下去，很快会送掉自己的命。后来一个漆黑的夜晚，船迎着浪头行驶，他突然消失了，从此再没出现。大家既不惊讶，也不怎么惋惜。
        - id: ch02-b04
          speaker: captain_smollett
          text: 掉进海里了！好吧，各位先生，这倒省得我们把他铐起来。
        - id: ch02-b05
          speaker: narrator
          text: 这样一来，船上便没了大副，只能从水手中提拔一个。水手长乔布·安德森最合适。大家还叫他水手长，可他多少已经在做大副的事。特里劳尼乡绅从前也在海上讨过生活，他的经验很有用。天气平稳的时候，他常常亲自值班。舵手伊斯雷尔·汉兹年纪大，经验丰富，做事谨慎又狡猾，到了紧要关头，几乎什么都可以交给他。
        - id: ch02-b06
          speaker: narrator
          text: 汉兹是高个子约翰·西尔弗的心腹。说到汉兹，自然也就该说说西尔弗了。水手们都管这位船上的厨子叫“烤肉”。
    - id: ch03
      title: 厨子和他的鹦鹉
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 在船上，西尔弗用绳索把拐杖吊在脖子上，好让两只手都空出来。做饭时，他把拐杖一头顶在舱壁上，身子靠住它，随着船身来回摇摆，手里的活一点也不耽误，看上去就像站在岸上一样安稳。
        - id: ch03-b02
          speaker: narrator
          text: 风浪最猛的时候，看他穿过甲板更叫人惊奇。他让人在几处最宽的空当拉起绳索，水手们管那些绳子叫“高个子约翰的耳环”。他抓着绳子从一头挪到另一头，有时撑着拐杖，有时让拐杖吊在身旁拖着走，速度和别人走路一样快。可从前跟他一起出过海的水手，见他如今少了一条腿，还是会替他惋惜。
        - id: ch03-b03
          speaker: israel_hands
          text: 烤肉不是普通人。他年轻时受过很好的教育，只要他想，说起话来就跟书上写的一样。再说他的胆量，狮子跟高个子约翰一比，根本算不了什么！我亲眼见过他赤手空拳抓住四个人，把他们的脑袋撞到一块儿。
        - id: ch03-b04
          speaker: narrator
          text: 船员们都敬重西尔弗，甚至肯听他的吩咐。他知道该怎么跟每个人说话，还总能替对方做点特别的事。对我，他更是一直亲切得很。每次我走进厨房，他都很高兴。那里让他收拾得一尘不染，碟子擦得锃亮，一只只挂好。角落里还摆着鸟笼，里面关着他的鹦鹉。
        - id: ch03-b05
          speaker: silver
          text: 快进来，霍金斯，陪约翰聊一会儿。孩子，这里最欢迎的人就是你。坐下听听新鲜事吧。这位是弗林特船长。我是照那位大名鼎鼎的海盗，给鹦鹉取了这个名字。它刚才还说，咱们这趟航程准能成功。是不是呀，船长？
        - id: ch03-b06
          speaker: parrot_flint
          text: 八里亚尔银币！八里亚尔银币！八里亚尔银币！
        - id: ch03-b07
          speaker: narrator
          text: 鹦鹉叫得又快又响，让人纳闷它怎么还没喘不过气。最后总要等约翰把手帕盖到笼子上，它才肯停下。
        - id: ch03-b08
          speaker: silver
          text: 霍金斯，这只鸟说不定已经活了两百年。这些鸟多半永远不死。世上要是有人见过的坏事比它还多，那也只会是魔鬼本人。它跟过英格兰，就是那位了不起的海盗英格兰船长。马达加斯加、马拉巴尔、苏里南、普罗维登斯、波托韦洛，它全去过。打捞沉没的运宝船时，它也在场。“八里亚尔银币”就是那时学会的，这可一点也不奇怪。当时捞出来的银币足足有三十五万枚呢！
        - id: ch03-b09
          speaker: silver
          text: 从果阿开出的《印度总督号》遭人登船劫掠时，它也在场。可你看看它，还以为它是个小娃娃。你闻过火药味，对不对，船长？
        - id: ch03-b10
          speaker: parrot_flint
          text: 准备转向！
        - id: ch03-b11
          speaker: silver
          text: 啊，它可真是个漂亮家伙。
        - id: ch03-b12
          speaker: narrator
          text: 厨子说着，从口袋里拿出糖喂它。那鸟吃过糖，又啄着笼条破口大骂，骂得又凶又恶，简直让人不敢相信。
        - id: ch03-b13
          speaker: silver
          text: 瞧见了吧，孩子，沾上柏油，哪有不弄脏的。你看我这只可怜的老鸟，本来多么天真无邪，现在骂起人来像冒蓝火似的。可它根本不懂自己在骂什么，这一点你放心。打个比方吧，就算站在牧师面前，它也会照骂不误。
        - id: ch03-b14
          speaker: narrator
          text: 约翰说完，总会庄重地碰一碰额发。看着他那副样子，我真以为他是世上最好的人。
    - id: ch04
      title: 船长仍不放心
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这段日子里，乡绅和斯莫列特船长仍旧十分疏远。乡绅根本不掩饰自己有多瞧不起船长。船长呢，别人不开口问，他就一句话也不说。非说不可时，他的回答也又尖锐，又简短，又冷淡，一个字都不浪费。
        - id: ch04-b02
          speaker: narrator
          text: 后来，别人把他追问得无路可退，他才承认，自己先前对船员的看法似乎错了。其中几个人正像他希望的那样干练，所有人的表现也都还不错。他已经真心喜欢上了伊斯帕尼奥拉号。
        - id: ch04-b03
          speaker: captain_smollett
          text: 先生，它迎风航行的时候，还能再靠近风向一点。一个男人对自己的妻子都不敢有这么高的指望。不过我还是那句话。咱们还没有平安回家，而我不喜欢这趟航行。
        - id: ch04-b04
          speaker: narrator
          text: 每次听到这里，乡绅都会转过身去，仰起下巴，在甲板上大步来回走。
        - id: ch04-b05
          speaker: squire_trelawney
          text: 这家伙再多说一句，我就真要炸了。
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 航程中，我们遇到过几场大风浪。这只让伊斯帕尼奥拉号更显出它的好来。船上人人都心满意足。若还有谁不满意，那人可真够难伺候。依我看，自从诺亚驾船出海以来，从没有哪一船水手这样受宠。只要有一点由头，每人就能分到双份朗姆酒。隔三岔五还能吃上葡萄干布丁，比方说，乡绅听说哪个水手过生日的时候。船腰那里还总放着一桶开了盖的苹果，谁想吃都能自己拿。
        - id: ch04-b07
          speaker: captain_smollett
          text: 这么做从来没有好结果。把前甲板的水手宠坏了，他们就会变成魔鬼。我就是这么看的。
        - id: ch04-b08
          speaker: narrator
          text: 可那桶苹果偏偏带来了好结果。要是没有它，我们就收不到任何警讯，或许早已全都死在叛徒手里。这件事究竟是怎么发生的，我现在就讲。
    - id: ch05
      title: 苹果桶里的秘密
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 为了驶到那座岛的上风处，我们借着信风一路前进。岛在哪里，我不能说得更清楚。如今，我们已经转向那里，开始顺风驶近。就算把时间往宽里算，这也是去程的最后一天。当夜，最晚第二天中午以前，我们就会看见金银岛。
        - id: ch05-b02
          speaker: narrator
          text: 船头朝着西南偏南，稳定的风从船侧吹来，海面十分平静。伊斯帕尼奥拉号有节奏地摇摆，船头斜桅不时探进飞溅的浪花。高处低处的船帆全都吃足了风。第一段冒险就要结束了，人人都兴高采烈。
        - id: ch05-b03
          speaker: narrator
          text: 日落后不久，我干完了所有活，正往自己的铺位走，忽然很想吃一个苹果。我跑上甲板。值班的水手全在船头眺望海岛。舵手盯着船帆的迎风边，轻轻吹着口哨。四周再没有别的声音，只有海水冲过船头，又沿着船身两侧沙沙流动。
        - id: ch05-b04
          speaker: narrator
          text: 我整个人钻进苹果桶，才发现里面几乎没有苹果了。我在黑暗里坐下，耳边是水声，身下的船又摇来晃去。我不知道自己已经睡着，还是正要睡着，忽然有个很沉的人在旁边砰地坐了下来。他把肩膀靠上木桶，桶身猛地一震。
        - id: ch05-b05
          speaker: narrator
          text: 我刚想跳出去，那人就开口了。是西尔弗的声音。还没听完十二个字，哪怕有人把全世界给我，我也绝不会露面。我躺在桶里，浑身发抖，又害怕，又忍不住想听下去。因为只凭那短短几句话，我已经明白，船上所有正直之人的性命，此刻全都系在我一个人身上。
