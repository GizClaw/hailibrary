  chapters:
    - id: ch01
      title: The Old Sea-dog Arrives
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Squire Trelawney, Dr. Livesey, and the other gentlemen asked me to tell the whole story of Treasure Island, from beginning to end. I am to hold back only the island's bearings, because some treasure still lies there. So I begin in the year 17-something, when my father kept the Admiral Benbow inn. That was when the brown old sailor with the saber scar first came to stay beneath our roof.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I can still see him trudging up to the inn door. He was tall, broad, and strong, with skin browned by the sea. A tarry pigtail hung over his dirty blue coat. His hands were scarred and ragged, his nails black and broken, and a pale, grimy saber cut crossed one cheek. Behind him, a man pushed his sea chest in a handcart. The sailor looked around the cove, whistled to himself, and then burst into the song we would hear so often afterward.
        - id: ch01-b03
          speaker: captain
          text: |-
            Fifteen men on the dead man's chest—
            Yo-ho-ho, and a bottle of rum!
        - id: ch01-b04
          speaker: narrator
          text: >-
            His voice was high, old, and shaky, as if years of hauling at a ship's capstan had tuned it and broken it. He struck the door with the short, heavy stick in his hand. When my father answered, the stranger roughly ordered a glass of rum. He took his time drinking it, tasting every swallow while his eyes traveled over the cliffs and up to our sign.
        - id: ch01-b05
          speaker: captain
          text: >-
            This cove will do nicely. A pleasant little place for a drink, too. Do you get much company here, mate?
        - id: ch01-b06
          speaker: father
          text: >-
            No, sir. Very little, I'm sorry to say.
        - id: ch01-b07
          speaker: captain
          text: >-
            Good. Then this is the berth for me. You there, matey! Bring the cart alongside and help carry up my chest. I'll stop here awhile. I'm a plain man. Give me rum, bacon, and eggs, and let me use that lookout above to watch for ships. As for my name, you can call me Captain.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He caught the look on my father's face, threw three or four gold coins onto the threshold, and fixed him with the fierce stare of a commander.
        - id: ch01-b09
          speaker: captain
          text: >-
            Tell me when I've used all that up.
        - id: ch01-b10
          speaker: narrator
          text: >-
            His clothes were shabby and his speech was coarse, but he did not seem like an ordinary sailor who took orders before the mast. He looked more like a mate or captain, a man used to being obeyed and ready to strike anyone who refused. The man with the cart told us that the mail coach had left him at the Royal George the morning before.
        - id: ch01-b11
          speaker: barrow_man
          text: >-
            He asked about every inn along this part of the coast. Someone spoke well of yours and told him it stood alone, so this is the one he chose.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That was everything we managed to learn about our new guest.
    - id: ch02
      title: The Man with One Leg
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Most of the time, the captain said almost nothing. During the day he wandered around the cove or stood on the cliffs with a brass telescope. In the evening he took the corner beside the parlor fire and drank rum mixed very strong with water. If anyone spoke to him, he would jerk up his head, glare, and blow through his nose like a foghorn. Before long, our family and everyone who visited the inn knew enough to leave him alone.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Each day, when he returned from his walk, he asked whether any sailors had passed along the road. At first we supposed he missed the company of men like himself. Then we noticed what happened whenever a seaman actually stayed at the Admiral Benbow on the way to Bristol. Before entering the parlor, the captain would spy on the newcomer through the curtained door. Once inside, he became as quiet as a mouse. He was not hoping to meet sailors. He was hiding from them.
        - id: ch02-b03
          speaker: narrator
          text: >-
            I knew more about his fear than the others did, because he made me share it. One day he pulled me aside. He promised me a silver fourpence on the first day of every month if I kept watch for a sailor with one leg and warned him the instant that man appeared.
        - id: ch02-b04
          speaker: captain
          text: >-
            Keep your weather-eye open, boy. The moment you see a seafaring man with one leg, you come straight to me.
        - id: ch02-b05
          speaker: narrator
          text: >-
            On the first of the month, I would ask for my pay. Usually he only snorted and stared until I backed away. But before the week ended, he always thought better of it. He brought me the little silver coin and gave the same order again.
        - id: ch02-b06
          speaker: narrator
          text: >-
            That one-legged sailor followed me into my dreams. On stormy nights, wind shook all four corners of the inn while the surf thundered through the cove and against the cliffs. In sleep, I saw the man in a thousand shapes, each with a dreadful face. Sometimes his leg ended at the knee, sometimes at the hip. Sometimes he was a monster born with only one leg, set in the middle of his body. Worst of all, he would leap and race after me over hedges and ditches. I earned that monthly fourpence dearly, because it came with those horrible nightmares.
    - id: ch03
      title: Rum, Songs, and Terrible Tales
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Even though the thought of that one-legged sailor terrified me, I feared the captain himself much less than anyone else did. Some nights he drank more rum and water than he could handle. Then he might sit by himself, singing his old, wild, wicked sea songs without caring who heard. On other nights he demanded glasses for everyone. He made the trembling guests listen to his stories or join the chorus of his song.
        - id: ch03-b02
          speakers: [captain, neighbor_1, neighbor_2, neighbor_3]
          ensemble: chorus
          text: >-
            Yo-ho-ho, and a bottle of rum!
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: >-
            I often heard that chorus shake the whole inn. Every neighbor sang as if his life depended on it. Each tried to be louder than the next, afraid the captain might notice anyone holding back. When rum took hold of him, no guest was more overbearing. One slap of his palm on the table meant that every voice must stop. If someone asked a question, he might flare up in rage. If no one asked anything, he might grow just as angry, because that proved they had stopped following his tale. He would not let a single person leave until at last he drank himself sleepy and staggered upstairs to bed.
        - id: ch03-b04
          speaker: narrator
          text: >-
            His stories frightened them more than his temper did. He told of men hanged from the gallows and forced to walk the plank. He told of storms at sea, the Dry Tortugas, and savage deeds in far-off places along the Spanish Main. If his own account was true, he had spent his life among some of the worst men ever allowed to sail the ocean. Our quiet country neighbors were nearly as shocked by the language he used as by the crimes he described.
        - id: ch03-b05
          speaker: narrator
          text: >-
            My father kept saying the captain would ruin the inn. Who would return just to be bullied, silenced, and sent shivering home to bed? Yet I believe the captain actually helped our business. The guests were frightened while he held them there, but later they enjoyed remembering the excitement. Their country lives were quiet, and his dreadful tales gave them something extraordinary to talk about.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Some of the younger men even pretended to admire him. They called him a true sea-dog and a real old salt. A man like that, they said, was the kind who had made England feared upon the sea.
    - id: ch04
      title: A Guest Who Never Paid
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            In one respect, though, the captain truly did seem likely to ruin us. He stayed week after week, and then month after month. The coins he had dropped on our threshold were soon spent, but my father could never summon the courage to demand more. Whenever he tried to mention the bill, the captain blew through his nose so fiercely that it sounded like a roar. Then he stared my poor father right out of the room.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Afterward, I saw my father wringing his hands. He lived with constant worry and fear, and I am certain that misery helped bring on his early, unhappy death.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Through all his time with us, the captain hardly changed his clothes. He bought one pair of stockings from a traveling seller, and that was all. When one side of his hat fell loose, he left it hanging, even though the flap bothered him whenever the wind caught it. Upstairs in his room, he patched his own coat until, by the end, there seemed to be nothing left but patches.
        - id: ch04-b04
          speaker: narrator
          text: >-
            No letter ever came for him, and he never sent one. He spoke only to the neighbors, and usually only when rum had loosened his tongue. As for the great sea chest in the front room upstairs, none of us ever saw it open.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Only one person ever stood up to the captain. It happened near the end of his stay, when my poor father was already wasting away from the illness that would take his life.
    - id: ch05
      title: Dr. Livesey Stands His Ground
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Dr. Livesey came late one afternoon to tend my father. After eating a little dinner from my mother, he went into the parlor to smoke his pipe while someone brought his horse down from the village. The old Admiral Benbow had no stable of its own, so he had to wait. I followed him into the room.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The difference between the doctor and everyone around him struck me at once. He was neat and bright, with powdered hair as white as snow, keen black eyes, and pleasant manners. The country people looked awkward beside him. Most of all, he was the exact opposite of our pirate, who sat with his arms spread across the table. The captain was filthy, heavy, red-eyed, and deep in rum.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Without warning, the captain began his endless song again.
        - id: ch05-b04
          speaker: captain
          text: |-
            Fifteen men on the dead man's chest—
            Yo-ho-ho, and a bottle of rum!
            Drink and the devil had done for the rest—
            Yo-ho-ho, and a bottle of rum!
        - id: ch05-b05
          speaker: narrator
          text: >-
            When I first heard the words “the dead man's chest,” I had imagined they meant the captain's huge box in the upstairs room. In my nightmares, that chest and the one-legged sailor had become tangled together. By now, though, the rest of us had heard the song so often that we paid it no attention. Only Dr. Livesey was new to it. He looked up with clear annoyance, then turned back to old Taylor, the gardener. They had been discussing a new treatment for rheumatism.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Meanwhile, the captain grew more pleased with his own singing. At last he slapped his hand on the table. Everyone in the room knew that signal. All the voices stopped except Dr. Livesey's. The doctor kept talking in the same clear, friendly tone, taking quick draws on his pipe every few words.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The captain glared at him, then struck the table again. The doctor still went on. The captain's stare grew darker until he finally growled a foul oath.
        - id: ch05-b08
          speaker: captain
          text: >-
            Silence there, between decks!
          emotion: angry
        - id: ch05-b09
          speaker: doctor_livesey
          text: >-
            Were you speaking to me, sir?
        - id: ch05-b10
          speaker: narrator
          text: >-
            The captain answered with another oath and made it clear that he was.
        - id: ch05-b11
          speaker: doctor_livesey
          text: >-
            Then I have one thing to tell you. If you go on drinking rum this way, the world will soon be rid of a very dirty scoundrel.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The old sailor flew into a terrible fury. He sprang up, pulled out a sailor's folding knife, snapped the blade open, and balanced it across his palm. Then he threatened to pin the doctor to the wall.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Dr. Livesey did not move at all. He only looked back over his shoulder and answered in the same voice as before. He spoke a little louder so that the whole room could hear him, but his tone stayed perfectly steady.
        - id: ch05-b14
          speaker: doctor_livesey
          text: >-
            Put that knife in your pocket this instant. If you don't, I give you my word of honor that you will hang at the next assizes.
          emotion: calm
        - id: ch05-b15
          speaker: narrator
          text: >-
            For a moment, the two men fought without a word, each staring into the other's eyes. The captain was the first to give way. He folded the knife, put it back, and dropped into his chair, grumbling like a beaten dog.
        - id: ch05-b16
          speaker: doctor_livesey
          text: >-
            Now that I know a man like you is in my district, you may be sure I'll watch you day and night. I am not only a doctor. I am also a magistrate. If I hear even one complaint about you, including another piece of rudeness like tonight's, I will see that you are hunted down and driven out of here. That is enough.
        - id: ch05-b17
          speaker: narrator
          text: >-
            Soon afterward, Dr. Livesey's horse arrived at the door and he rode away. The captain said nothing else that evening. In fact, he kept quiet for many evenings after that.
