audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    captain:
      display_name: 船长
      tts:
        delivery: 粗野强横，带着惯于发号施令的海上口气
        timbre: 沙哑厚重，像被海风和烈酒磨损过
        pace: 缓慢而逼人，发怒时骤然加快
        pitch: 低
    father:
      display_name: 父亲
      tts:
        delivery: 老实拘谨，面对威吓时小心退让
        timbre: 温和朴实
        pace: 稍慢
        pitch: 中
    inn_guest_1:
      display_name: 客人甲
      tts:
        delivery: 紧张顺从，为免惹怒船长而用力跟唱
        timbre: 粗朴微哑的成年男声
        pace: 稍快
        pitch: 中低
    inn_guest_2:
      display_name: 客人乙
      tts:
        delivery: 胆怯拘谨，跟唱时急着盖过旁人的声音
        timbre: 清瘦发紧的年轻男声
        pace: 偏快
        pitch: 中高
    inn_guest_3:
      display_name: 客人丙
      tts:
        delivery: 忐忑而勉强，竭力装出响亮顺从的样子
        timbre: 朴实浑厚的中年男声
        pace: 稍慢
        pitch: 低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 清楚有礼，面对威胁仍坚定从容
        timbre: 明亮清朗
        pace: 稳健利落
        pitch: 中
  chapters:
    - id: ch01
      title: 刀疤老水手来到客店
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 特里劳尼乡绅、利弗西医生和其余几位先生，要我把金银岛的事情从头到尾写下来，任何细节都不要隐瞒。只有岛的方位不能透露，因为那里至今还有宝藏没有起出。于是，一七——年，我提起笔，把记忆带回父亲经营本博将军客店的日子，也想起那个第一次住进我家屋檐下的老水手。他皮肤棕黑，脸上横着一道刀疤。
        - id: ch01-b02
          speaker: narrator
          text: 我记得他走到客店门前的样子，就像那是昨天的事。他身材高大，壮实沉重，棕褐色的脸挨过无数风吹日晒。他拖着脚步走来，后面有人用手推车载着他的水手箱。沾着焦油的发辫搭在脏蓝外套上。他的手粗糙又满是伤疤，指甲乌黑残缺，脸颊上的军刀伤痕灰白而吓人。他一边打量海湾，一边吹着口哨，忽然唱起一首老海歌。后来，这首歌我们不知听过多少遍。
        - id: ch01-b03
          speaker: captain
          text: 十五个人守着死人的箱——哟嗬嗬，再来一瓶朗姆酒！
        - id: ch01-b04
          speaker: narrator
          text: 那嗓音又高又老，颤颤巍巍，像是早年在绞盘旁领唱时磨坏了，从此再也调不准。他拿一截绞盘棒似的短棍敲门。父亲出来后，他粗声要了一杯朗姆酒。酒送到手里，他倒不急着灌下去，而是像品酒行家一样慢慢喝，一面细细尝味，一面四下张望，先看海边的峭壁，又抬头看我们的招牌。
        - id: ch01-b05
          speaker: captain
          text: 这个海湾很方便，这家小酒馆的位置也不错。伙计，客人多不多？
        - id: ch01-b06
          speaker: father
          text: 不多，实在少得可惜。
        - id: ch01-b07
          speaker: captain
          text: 那正好，我就住这儿。推车的伙计，把车靠过来，帮我把箱子抬上去。我只要朗姆酒、咸肉和鸡蛋，再要上面那座山冈，好让我盯着海上的船。至于称呼嘛，叫我船长。哦，我知道你在等什么。这几枚金币拿去，用完了再告诉我。
        - id: ch01-b08
          speaker: narrator
          text: 他把三四枚金币扔在门槛上，凶狠地瞪着父亲，像个正在发号施令的统帅。虽然衣服破旧，说话粗野，他却不像在甲板上听人使唤的普通水手，倒像一个惯于命令别人、不服就动手的大副或船长。推车的人只告诉我们，邮车前一天早晨把他放在皇家乔治客店。他在那里打听沿海都有哪些住处，大概是听说我家名声不错，又知道这里偏僻，才舍下其他客店，挑中了这里。关于这位客人，我们能打听出来的只有这些。
    - id: ch02
      title: 独腿水手的阴影
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 船长平时很少开口。白天，他拿着黄铜望远镜在海湾边和峭壁上转悠。晚上，他坐在客厅炉火旁的角落，喝很浓的朗姆酒兑水。有人同他说话，他往往只会突然抬头，凶狠地一瞪，再从鼻子里喷一口气，响得像雾号。大家很快学会了别去惹他。
        - id: ch02-b02
          speaker: narrator
          text: 每次散步回来，他都问路上有没有水手经过。我们起初以为他想找同行作伴，后来才明白，他其实是在躲人。偶尔有水手沿着海岸公路去布里斯托尔，顺道在本博将军投宿，他会先隔着门帘偷看，认清来人之后才肯走进客厅。只要有这种水手在场，他全程都安静得像只老鼠。我知道其中有鬼，因为他也让我分担了这份恐惧。
        - id: ch02-b03
          speaker: captain
          text: 小子，你替我留神风色。要是看见一个独腿水手，马上来报信。每月初一，我给你一枚四便士银币。
        - id: ch02-b04
          speaker: narrator
          text: 可每逢月初一，我照约定去讨工钱，他常常只从鼻子里重重喷气，再恶狠狠地盯着我，直到我不敢开口，只好离开。好在一星期还没过完，他总会改变主意，把那枚四便士银币交给我，又重复一遍命令，叮嘱我盯紧独腿水手。那个人也从此钻进了我的梦。
        - id: ch02-b05
          speaker: narrator
          text: 暴风雨的夜里，狂风摇着屋子的四个角，海浪沿着海湾轰鸣，又扑上峭壁。我梦见那个独腿水手变出千百种模样，每一张脸都带着恶魔般的神情。他的腿有时断在膝盖，有时从胯下整个消失，有时他成了一个怪物，仿佛一生下来就只有一条腿，而且偏偏长在身体正中。最可怕的是，他用那条腿一蹦一跳地飞奔，越过树篱，跨过沟渠，始终在后面追我。为了每月四便士，我付的代价实在不小，那些可憎的噩梦就是利息。
        - id: ch02-b06
          speaker: narrator
          text: 可我虽然怕极了独腿水手，却没有别人那么怕船长。船长有些晚上喝下的朗姆酒兑水，远远超过了脑袋能承受的分量。他有时独自坐着，不理任何人，只唱那些古老、邪恶又狂野的海歌。有时，他又给在场每个人叫上一杯酒，逼满屋子发抖的人听他的故事，还要替他合唱。整座客店常常随着歌声震动。邻居们仿佛性命都悬在上面，只能拼命跟着唱，还争着比别人更响，免得被他挑中。
        - id: ch02-b07
          speakers: [inn_guest_1, inn_guest_2, inn_guest_3]
          ensemble: chorus
          text: 哟嗬嗬，再来一瓶朗姆酒！
        - id: ch02-b08
          speaker: narrator
          text: 酒疯一上来，他就成了世上最霸道的同伴。他一掌拍在桌上，屋里就得立刻安静。有人提问，他勃然大怒。没人提问，他照样发火，说大家根本没跟上他的故事。直到他把自己灌得昏昏欲睡，摇摇晃晃回到房间，任何人都不准离开客店。
    - id: ch03
      title: 令人惧怕的房客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最吓人的是他的故事。他讲绞刑，讲被迫走下跳板，讲海上风暴和干龟群岛，也讲西班牙美洲海域那些无法无天的勾当和可怕地方。照他的说法，他一生都和上帝容许在海上横行的最邪恶的一群人混在一起。故事里的罪行已经够可怕，他讲述时满嘴的粗话，也让我们这些老实的乡下人同样震惊。
        - id: ch03-b02
          speaker: narrator
          text: 父亲常说，船长迟早会毁掉客店。谁愿意来这里受他欺压和羞辱，再浑身发抖地回去睡觉呢？可我真觉得，他反而招来了生意。客人当时固然害怕，过后回想起来却觉得很有趣。安静的乡间生活难得有这样的刺激。几个年轻人甚至假装崇拜他，称他是真正的海狼，是地道的老水手，还说英格兰正是靠这种人才威震海上。
        - id: ch03-b03
          speaker: narrator
          text: 不过，他确实差点用另一种办法拖垮我们。他一星期接一星期地住，后来一月接一月也不走，预付的钱早就用光了。父亲却始终鼓不起勇气催他再交钱。只要稍微提起，船长就从鼻子里喷出一声巨响，简直像在咆哮，再死死瞪着我那可怜的父亲，直到把他逼出房间。我不止一次看见父亲在外面绞着双手。那些日子里积下的烦恼和恐惧，一定让他过早而不幸的死亡来得更快了。
        - id: ch03-b04
          speaker: narrator
          text: 船长住在这里时，衣着几乎没变过，只从一个走街串巷的小贩手里买了几双长袜。帽子的一角塌了，他就一直任它垂着，哪怕风一吹，那块帽檐碍事得厉害，他也不管。他自己在楼上房间里缝补外套。那件衣服的样子我还记得，到最后，它简直只剩下一块又一块补丁。他从来不写信，也没有收过一封信。除了邻居，他不同别人说话，而和邻居开口，多半也是喝醉以后。至于那只大水手箱，我们谁都没见他打开。
    - id: ch04
      title: 利弗西医生与船长
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 船长住在我家的那些日子里，只有一个人顶撞过他。那已是很后来的事了。当时，我那可怜的父亲受痨病折磨，身体已经非常虚弱，离去世也不远了。一天傍晚，利弗西医生很晚才来给父亲看病。他吃了母亲准备的一点晚饭，便到客厅抽烟斗，等人从村里把他的马牵过来，因为老本博客店没有马厩。我也跟着医生进了客厅。
        - id: ch04-b02
          speaker: narrator
          text: 医生整洁而有精神，发粉白得像雪，黑眼睛明亮，待人又亲切有礼。他和周围那些笨拙的乡下人已经很不一样，和我们的海盗更是天差地别。船长又脏又胖，醉眼蒙眬，像个吓人的稻草人。他把两条胳膊都搁在桌上，已经醉得不轻。就在这时，他忽然扯起那副又高又破的嗓子，再次唱起没完没了的老歌。
        - id: ch04-b03
          speaker: captain
          text: 十五个人守着死人的箱——哟嗬嗬，再来一瓶朗姆酒！酒和魔鬼送其余人见了阎王——哟嗬嗬，再来一瓶朗姆酒！
        - id: ch04-b04
          speaker: narrator
          text: 我起初一直以为，歌里的“死人箱”就是楼上临街房里的那只大箱子。在我的噩梦中，它总和独腿水手混在一起。但到这时，大家早听惯了这首歌，只有利弗西医生第一次听。他显然不喜欢，带着怒意抬头看了一眼，很快又接着和老园丁泰勒谈起治疗风湿病的新办法。
        - id: ch04-b05
          speaker: narrator
          text: 船长听着自己的歌，越唱越来劲，最后用力拍了面前的桌子。大家都熟悉这个动作，知道他要所有人闭嘴。屋里的声音马上停下，只有医生照旧说个不停。他的声音清楚又和气，每讲一两个词，还从容而有力地吸一口烟斗。船长先瞪了他一阵，又拍一次桌子，接着瞪得更加凶狠，终于压低嗓门，恶狠狠地骂了出来。
        - id: ch04-b06
          speaker: captain
          text: 中甲板上的人，全都给我闭嘴！
          emotion: angry
        - id: ch04-b07
          speaker: doctor_livesey
          text: 先生，你是在对我说话吗？
        - id: ch04-b08
          speaker: narrator
          text: 那恶棍又骂了一句，说的正是医生。
        - id: ch04-b09
          speaker: doctor_livesey
          text: 那我只告诉你一句。你再这样喝朗姆酒，用不了多久，世上就会少一个肮脏的恶徒。
        - id: ch04-b10
          speaker: narrator
          text: 老家伙顿时暴怒。他跳起来，抽出水手折刀，弹开刀刃，摊在掌心掂着，威胁要把医生钉在墙上。医生连动也没动，只是侧过肩头，仍用原来的声调说话。他稍稍提高声音，让全屋都听见，可语气始终平静坚定。
        - id: ch04-b11
          speaker: doctor_livesey
          text: 现在就把刀收进口袋。不然我以名誉担保，等到下次巡回审判，你一定会被送上绞架。
          emotion: calm
        - id: ch04-b12
          speaker: narrator
          text: 两个人用目光交战。船长很快服了软，收起刀，重新坐下，嘴里嘟囔着，像一条挨了打的狗。
        - id: ch04-b13
          speaker: doctor_livesey
          text: 还有，先生。既然我知道管辖的地方有你这么一个人，我就会日夜盯着你。我不只是医生，也是治安推事。以后只要有人投诉你，哪怕只说你像今晚这样无礼，我也会让人追捕你，把你赶出这一带。你记住这些就够了。
        - id: ch04-b14
          speaker: narrator
          text: 不久，医生的马牵到了门口。他骑马离开。那天晚上，船长一句话也没说，接下来的许多个夜晚也是一样。
