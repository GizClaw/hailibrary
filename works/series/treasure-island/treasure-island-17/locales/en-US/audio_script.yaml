  chapters:
    - id: ch01
      title: "XXVII Narrative Continued by the Doctor: The Jolly-boat’s Last Trip"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Our fifth trip was nothing like the others. For one thing, our little gallipot of a boat was dangerously overloaded. Five grown men were already too many, especially when three of them—Trelawney, Redruth, and the captain—stood more than six feet tall. Then we piled in powder, pork, and bags of bread. The gunwale at the stern nearly touched the water. Again and again, a little wave spilled aboard. Before we had gone a hundred yards, my breeches and the tails of my coat were soaked.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The captain told us how to shift our weight, and we got the boat sitting a bit more evenly. Even then, we hardly dared to breathe.
        - id: ch01-b03
          speaker: narrator
          text: >-
            There was another problem. The tide was going out. A strong, rippling current ran west across the anchorage, then turned south through the same straits we had entered that morning and rushed out to sea. Even those small ripples threatened our overloaded boat. Worse yet, the current carried us off our proper course and away from the landing place behind the point. If we let it take us, we would come ashore next to the pirates’ gigs. The pirates could return at any moment.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I held the tiller while the captain and Redruth, the two men with fresh arms, pulled at the oars. But I couldn't point the boat toward the stockade.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Captain, the tide keeps pushing us down. Can you row any harder?
        - id: ch01-b06
          speaker: captain_smollett
          text: >-
            Not without sinking us. Turn her farther up, Doctor. Keep turning until you see us gain ground.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I tried it. Each time I turned the bow farther east, we gained a little more against the tide, though it still carried us sideways. In the end, I had to aim due east, almost at a right angle to the direction we needed to travel.
        - id: ch01-b08
          speaker: narrator
          text: >-
            At this rate, we'll never reach shore.
        - id: ch01-b09
          speaker: captain_smollett
          text: >-
            If that's the only course she can hold, sir, then we hold it. We have to stay upstream. If we drift past the landing place, there's no telling where we'll come ashore, and the gigs may board us. This way, the current should weaken. Then we can slip back along the coast.
        - id: ch01-b10
          speaker: abraham_gray
          text: >-
            The current's easing already, sir. You can turn her off a little now.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Thank you, my man.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I said it as though nothing unusual had happened. Without discussing it, we had all decided to treat Gray as one of us.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Then the captain spoke again. This time, something in his voice had changed.
        - id: ch01-b14
          speaker: captain_smollett
          text: >-
            The gun!
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: >-
            I've thought of that. They could never bring the cannon ashore. And even if they did, they'd never drag it through the woods.
        - id: ch01-b16
          speaker: captain_smollett
          text: >-
            Look behind us, Doctor.
        - id: ch01-b17
          speaker: narrator
          text: >-
            We had completely forgotten the long nine-pound cannon. I looked back in horror. Five rogues were already at work around it, stripping off what they called its jacket, the heavy tarpaulin cover it wore at sea. Then another thought struck me. We had left the cannonballs and the gunpowder behind. One blow of an ax would put them all in the pirates’ hands.
        - id: ch01-b18
          speaker: abraham_gray
          text: >-
            Israel served as Flint's gunner.
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: >-
            We took the risk and turned straight for the landing place. By then, we had moved far enough out of the strongest current to keep control of the boat, even though the men had to row gently. I held her steady on course. But now our broad side faced the Hispaniola instead of our stern. We were offering them a target as wide as a barn door.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I saw and heard that brandy-faced villain Israel Hands drop a cannonball heavily onto the deck as the men prepared the gun.
        - id: ch01-b21
          speaker: captain_smollett
          text: >-
            Who's our best shot?
        - id: ch01-b22
          speaker: narrator
          text: >-
            Mr. Trelawney, by far.
        - id: ch01-b23
          speaker: captain_smollett
          text: >-
            Mr. Trelawney, pick off one of those men, please. Hands, if you can.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Trelawney was as cool as steel. He checked the priming on his gun.
        - id: ch01-b25
          speaker: captain_smollett
          text: >-
            Easy with that gun, sir, or you'll sink us. Everyone, be ready to shift your weight when he aims.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The squire lifted his gun. The oars stopped, and all of us leaned to the opposite side to balance the boat. We managed it so neatly that not one drop came aboard.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The pirates had swung the cannon around on its swivel. Hands stood at the muzzle with the rammer, leaving himself more exposed than anyone else. But luck was against us. The moment Trelawney fired, Hands ducked. The ball whistled over him and struck one of the other four men instead.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The wounded man cried out. His four companions on the ship answered him, and so did a great many voices from shore. I turned that way and saw the other pirates pour out from among the trees and tumble into their places in the boats.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The gigs are coming, sir.
        - id: ch01-b30
          speaker: captain_smollett
          text: >-
            Then pull! Never mind if we sink her now. If we don't reach shore, we're finished.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Only one gig is taking on a crew, sir. The men from the other one are probably running around the shore to cut us off.
        - id: ch01-b32
          speaker: captain_smollett
          text: >-
            They'll have a hard run. Sailors are no good on land, you know. I'm not worried about them. It's that cannonball. This is as easy as rolling balls across a carpet. My lady's maid couldn't miss us. Squire, tell us when you see the match, and we'll stop the boat.
        - id: ch01-b33
          speaker: narrator
          text: >-
            All the while, we were making good speed for such an overloaded boat, and very little water came in. We were close now. Another thirty or forty strokes would put us on the beach. The falling tide had uncovered a narrow strip of sand below the crowded trees. The point already hid the gig from sight, so it could no longer catch us. The same tide that had delayed us so cruelly was now slowing our attackers. Only the cannon could stop us.
        - id: ch01-b34
          speaker: captain_smollett
          text: >-
            If I dared, I'd stop and shoot another one.
        - id: ch01-b35
          speaker: narrator
          text: >-
            But the pirates clearly meant to let nothing delay their shot. They never even looked at the man Trelawney had hit. He was still alive, and I could see him trying to crawl away.
        - id: ch01-b36
          speaker: squire_trelawney
          text: >-
            Ready!
        - id: ch01-b37
          speaker: captain_smollett
          text: >-
            Hold!
        - id: ch01-b38
          speaker: narrator
          text: >-
            The captain answered as fast as an echo. He and Redruth drove their oars backward with one great pull, forcing the stern completely under water. At that very instant, the cannon fired. That was the first shot Jim heard. The sound of Trelawney's musket had not carried to him.
        - id: ch01-b39
          speaker: narrator
          text: >-
            None of us knew exactly where the cannonball went. I believe it flew over our heads, and the rush of air behind it may have helped cause our accident.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Whatever the cause, the boat settled gently by the stern in three feet of water. The captain and I ended up standing face-to-face. The other three went headfirst into the water and came back up drenched and sputtering.
        - id: ch01-b41
          speaker: narrator
          text: >-
            At first, the damage did not seem too terrible. No one had died, and we could wade safely to shore. But all our stores lay on the bottom, including much of the food and powder we had worked to save. Worse still, only two of our five guns could now be used. By instinct, I had snatched mine from my knees and held it over my head. The captain had worn his over one shoulder on its strap, wisely keeping the lock uppermost. The other three guns had gone down with the boat.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Then we heard voices in the woods along the shore, already coming closer. We were soaked, poorly armed, and in danger of being cut off from the stockade. We also had to wonder whether Hunter and Joyce would stand firm if half a dozen pirates attacked them. We knew Hunter was steady. Joyce was less certain. He was a pleasant, polite valet and knew how to brush a gentleman's clothes, but he was not made for battle.
        - id: ch01-b43
          speaker: narrator
          text: >-
            With all that on our minds, we waded ashore as quickly as we could. Behind us, we left the poor jolly-boat and more than half our powder and provisions.
