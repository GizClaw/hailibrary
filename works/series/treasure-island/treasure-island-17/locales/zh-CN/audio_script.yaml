audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 利弗西医生
      tts:
        delivery: 冷静果断，带着老兵回顾险境时的克制与机敏
        timbre: 温厚清晰的中年男声
        pace: 沉稳明快，紧张处稍加快
        pitch: 中低
    captain_smollett:
      display_name: 斯摩莱特船长
      tts:
        delivery: 威严简短，命令清楚有力，危急中仍不失冷静
        timbre: 坚实粗粝的成年男声
        pace: 利落紧凑
        pitch: 中低
    abraham_gray:
      display_name: 亚伯拉罕·格雷
      tts:
        delivery: 朴实直接，经过挣扎后显得坚定
        timbre: 稍显沙哑的年轻水手声线
        pace: 简短干脆
        pitch: 中
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 超载的小艇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第五趟运送和前几趟完全不同。我们坐的那只小艇本来就像个小药罐，如今更是载得太重。五个成年男人挤在艇上，本身就超过了它该载的分量。何况特里劳尼、雷德鲁斯和船长还都高过六英尺。再加上火药、猪肉和一袋袋面包，船尾的舷缘几乎贴住了水面。还没走出一百码，水已经灌进来好几次，我的马裤和衣服后摆全湿透了。
        - id: ch01-b02
          speaker: narrator
          text: 船长让大家挪动位置，小艇才稍稍平稳下来。可我们还是连大气都不敢喘。这只是头一个麻烦。第二个麻烦，是潮水偏偏开始退了。一股很强的水流泛着细浪，先向西穿过锚地，再折向南，沿着早晨进来的海峡奔向大海。小艇载得这么沉，连那点细浪都很危险。更麻烦的是，我们被冲离了航线，离岬角后面的登陆处越来越远。任潮水冲下去，我们就会在海盗的两条大艇旁边上岸。那些人随时都可能出现。
        - id: ch01-b03
          speaker: narrator
          text: 当时由我掌舵，船长和雷德鲁斯划桨。他们刚上船，手上还有力气。
        - id: ch01-b04
          speaker: narrator
          text: 船长先生，我没法让船头对准木寨。潮水一直把我们往下冲。你们能不能再加把劲？
        - id: ch01-b05
          speaker: captain_smollett
          text: 不能再用力了，船会进水的。劳驾您把船头迎着水流，先生。一直迎上去，等您看见小艇开始往前走再说。
        - id: ch01-b06
          speaker: narrator
          text: 我照他的话试了一阵。潮水还是不停地把我们往西推。最后，我只好将船头转向正东，几乎与原本该走的方向成了直角，这才勉强稳住。
        - id: ch01-b07
          speaker: narrator
          text: 这样走下去，我们永远也靠不了岸。
        - id: ch01-b08
          speaker: captain_smollett
          text: 先生，要是只有这个方向能稳住船，我们就只能照这个方向走。必须顶着上游。我们一旦漂到登陆处的下风头，不但不知道会在哪里上岸，还可能让那两条大艇追上。可继续往前，水流总会缓下来，到时再转回去，贴着岸走。
        - id: ch01-b09
          speaker: abraham_gray
          text: 先生，水流已经弱些了。船头可以放开一点。
        - id: ch01-b10
          speaker: narrator
          text: 我像什么也没发生过那样向格雷道了谢。大家早已默契地把他看作自己人。
    - id: ch02
      title: 船上的长炮
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 船长忽然又开了口。他的声音有点不一样。
        - id: ch02-b02
          speaker: captain_smollett
          text: 那门炮！
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: 我也想到那件事了。他们不可能把炮运上岸。就算搬了下来，也拖不过树林。
        - id: ch02-b04
          speaker: captain_smollett
          text: 医生，往船尾看。
        - id: ch02-b05
          speaker: narrator
          text: 我们竟把那门长九磅炮忘得一干二净。五个恶棍正围着它忙活，揭掉航行时蒙在炮上的厚油布。他们管那东西叫“炮衣”。眼前的景象已经够吓人了，我又突然想起一件更糟的事。炮弹和火药也留在船上。只要砍上一斧，那些东西就全归了这伙无法无天的恶人。
        - id: ch02-b06
          speaker: abraham_gray
          text: 伊斯雷尔以前是弗林特的炮手。
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: 我们顾不得危险，立刻把船头对准登陆处。这时小艇已经离开最急的水流。我们只能轻轻划，速度不快，却总算还掌得住方向。我也能稳稳地让它朝目的地走。可这样一来，对着“伊斯帕尼奥拉号”的不再是船尾，而是整个侧面。那目标大得简直像一扇谷仓门，任凭对方瞄准。
        - id: ch02-b08
          speaker: narrator
          text: 那个长着白兰地酒糟脸的恶棍伊斯雷尔·汉斯，抱来一颗圆炮弹，砰的一声放到甲板上。我不只看见了他的动作，那声响也听得一清二楚。
        - id: ch02-b09
          speaker: captain_smollett
          text: 你们当中，谁的枪法最好？
        - id: ch02-b10
          speaker: narrator
          text: 当然是特里劳尼先生，别人远远比不上。
        - id: ch02-b11
          speaker: captain_smollett
          text: 特里劳尼先生，请您打掉一个。能打中汉斯最好。
        - id: ch02-b12
          speaker: narrator
          text: 特里劳尼冷静得像块钢。他低头检查火枪的引火药。
        - id: ch02-b13
          speaker: captain_smollett
          text: 先别开枪！先生，拿稳了，别弄翻小艇。等您瞄准时，大家都准备挪到另一边压住船身。
        - id: ch02-b14
          speaker: narrator
          text: 乡绅慢慢举起火枪。划桨的人都停了手，我们则一起朝另一侧探身，替小艇压住平衡。大家配合得正好，船舷稳稳当当，连一滴水也没灌进来。
    - id: ch03
      title: 海盗追来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 海盗已经把长炮转了过来。汉斯拿着推弹杆站在炮口边，是最显眼的靶子。可特里劳尼扣动扳机的一瞬间，他正好俯下身。子弹从他头顶呼啸而过，却击倒了另外四人中的一个。
        - id: ch03-b02
          speaker: narrator
          text: 中弹的人惨叫一声。船上的同伴跟着喊起来，岸边也有许多人出声应和。我朝那边一看，只见其他海盗一群群冲出树林，跌跌撞撞地钻进小艇，又急忙各就各位。
        - id: ch03-b03
          speaker: narrator
          text: 先生，大艇追来了。
        - id: ch03-b04
          speaker: captain_smollett
          text: 那就使劲划！现在顾不得会不会进水。只要上不了岸，我们就全完了。
        - id: ch03-b05
          speaker: narrator
          text: 先生，只有一条艇正在上人。另一条艇的人大概会从岸上绕过去，截住我们。
        - id: ch03-b06
          speaker: captain_smollett
          text: 那他们可得拼命跑了，先生。水手上了岸是什么样，您也知道。我不担心他们，我怕的是那颗炮弹。开炮简直跟玩地毯滚球一样，就连我家夫人的女仆也不会打偏。乡绅，您一看见火绳就告诉我们，我们马上倒桨停船。
        - id: ch03-b07
          speaker: narrator
          text: 小艇虽然载得太沉，这时却划得相当快，也没进多少水。岸已经很近，再有三四十桨就能冲上沙滩。退潮让密密的树林下面露出了一条窄沙地。小岬角挡住了追来的大艇，我们连它的影子也看不见了。刚才拼命拖住我们的潮水，如今反倒拦住了追兵，像是在偿还欠债。现在只剩那门炮最危险。
        - id: ch03-b08
          speaker: captain_smollett
          text: 我要是敢停船，还想再打掉他们一个。
        - id: ch03-b09
          speaker: narrator
          text: 可海盗铁了心，不肯让任何事耽误开炮。那个中弹的人还没有死，倒在甲板上挣扎着，想要一点点爬开。他们却忙着手里的炮，连看也没看同伴一眼。
        - id: ch03-b10
          speaker: squire_trelawney
          text: 准备！
        - id: ch03-b11
          speaker: captain_smollett
          text: 停！
        - id: ch03-b12
          speaker: narrator
          text: 船长几乎和乡绅同时喊出声。他和雷德鲁斯使出全力向后倒桨，整个船尾一下压进水里。就在同一刻，炮声轰然响起。吉姆没有听见乡绅刚才那一枪，所以这才是他听见的第一声枪炮响。
    - id: ch04
      title: 小艇沉没
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 炮弹究竟从哪里飞过，我们当中谁也说不清。我猜它大概掠过了头顶。炮弹带起的那股疾风，或许也推了小艇一把，酿成了后面的灾祸。
        - id: ch04-b02
          speaker: narrator
          text: 小艇没有猛地翻倒，而是在三英尺深的水里，从船尾缓缓沉下去。船长和我双脚踩着水底，就那么面对面站着。其余三个人全都一头栽进水里，再冒出来时浑身湿透，嘴里还在不停地冒水泡。
        - id: ch04-b03
          speaker: narrator
          text: 好在没有人丧命，大家也能安全涉水上岸。可是物资全沉到了水底，麻烦还不止这些。五支火枪里，也只剩两支还能用。我凭着本能，从膝头抓起自己的枪，高高举过头顶。船长用武装带把枪背在肩上，很有先见地让枪机朝上，所以他的枪也保住了。其余三支枪都跟着小艇沉了下去。
    - id: ch05
      title: 涉水上岸
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 岸边树林里的说话声已经越来越近，我们更加担心了。大家等于失去了一半战力，随时可能在赶到木寨前被人截住。还有一件事也让我们放心不下。亨特和乔伊斯若遇上六七个海盗，有没有足够的头脑和胆量守住阵地？亨特向来稳重，这一点我们清楚。乔伊斯却不一定。他做贴身男仆、替主人刷衣服时，和气又有礼。真要打仗，他可不是合适的人选。
        - id: ch05-b02
          speaker: narrator
          text: 我们心里装着这些忧虑，尽快涉水走上岸去。那只可怜的小艇，还有一多半火药和粮食，都被留在了身后。
