audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    mother:
      display_name: 母亲
      tts:
        delivery: 朴实坚定，恐惧中仍守着不肯退让的尊严
        timbre: 温厚而略带疲惫
        pace: 从容清楚，危急时变得短促
        pitch: 中
  chapters:
    - id: ch01
      title: 到村子求援
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我马上把知道的一切告诉了母亲。这些事，也许早就该让她知道。我们这才看清，眼下既危险又难办。船长要是有钱，当然该拿出一部分还账。可他的同伙绝不会为了一个死人，把到手的赃物分给我们。尤其是黑狗和那个瞎眼乞丐，我已经见识过他们是什么人。
        - id: ch01-b02
          speaker: narrator
          text: 我也不能照船长的话，立刻骑马去找利弗西医生。那样会把母亲一个人留在客店，身边连个保护她的人也没有。可继续待下去同样不行。炉膛里一块煤掉下来，时钟滴答响一声，都会把我们吓一跳。我们总觉得外面有人正一步步走近。
        - id: ch01-b03
          speaker: narrator
          text: 客厅里躺着船长的尸体。那个可恨的瞎子也许还在附近转悠，随时会回来。每次想到这里，我都怕得浑身一颤。我们非赶快想出办法不可。最后，我们决定一起去附近的村子求人帮忙。两人连帽子都顾不上戴，就跑进越来越暗的暮色和冷雾里。
        - id: ch01-b04
          speaker: narrator
          text: 村子就在下一个海湾那边，只有几百码远，不过从客店看不见。好在它跟瞎子来去的方向正好相反，这让我安心了不少。一路没走几分钟，我们却几次停下来，抓住对方仔细听。四周没有异样，只有细浪轻轻冲着岸，还有林子里传来的低哑叫声。
        - id: ch01-b05
          speaker: narrator
          text: 到了村子，家家户户已经点起蜡烛。门窗里透出的黄光，让我的心一下安定下来。那份安慰太深了，直到许多年后，我还是忘不了。可我们能从村民那里得到的帮助，也只有这些灯光了。没有一个人肯跟我们回本博将军客店。照理说，他们真该为此感到害臊才对。我们的处境说得越危险，他们越躲在自家屋里不出来，男人、女人和孩子全都一样。
        - id: ch01-b06
          speaker: narrator
          text: 我从没听过弗林特船长的名字，村里却有人知道，一听见就吓得不轻。还有几个去客店另一边田里干活的人，说路上见过陌生人。他们把那些人当成走私贩，转身便逃。至少有一个村民，还在基特洞看见过一艘小帆船。总之，只要跟船长沾上关系，就足以叫他们怕得要命。
        - id: ch01-b07
          speaker: narrator
          text: 有几个人倒愿意朝另一个方向骑马，到利弗西医生家去。可是请他们帮忙守住客店，谁也不肯。常有人说胆怯会传染。可大家争论起来，你一句我一句，母亲反倒被激起了勇气。等他们全说完，她站出来开了口。
        - id: ch01-b08
          speaker: mother
          text: 属于我这个没了父亲的孩子的钱，我一文也不会丢。你们都不敢去，我和吉姆敢。我们怎么来的，就怎么回去。你们一个个人高马大，胆子却这么小，我可用不着谢你们。哪怕送了命，我们也要打开那只箱子。克罗斯利太太，把你的袋子借给我，我要拿回应得的钱。
        - id: ch01-b09
          speaker: narrator
          text: 我当然愿意陪母亲回去。所有人都嚷着说我们不要命，却还是没有一个男人肯同行。他们只给了我一把装好弹药的手枪，让我在遇袭时防身。他们还答应备好鞍马，万一我们回来时有人追赶，就能立刻逃走。另外，一个小伙子先骑马去找医生，请他带着武装人手赶来。
        - id: ch01-b10
          speaker: narrator
          text: 我们母子再次走进寒夜，我的心跳得厉害。满月正从雾气上方升起，露出暗红色的光。我们知道，等离开客店时，月光会把四周照得像白天。要是有人监视，准能看清我们的行踪。于是我们贴着树篱，飞快而安静地赶路。一路没有新的动静。直到客店大门在身后合上，我们才松了口气。
    - id: ch02
      title: 死人身上的钥匙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我立刻插上门闩。黑暗里，我们站着喘了好一阵。整座屋子只有我们，还有船长的尸体。母亲去酒吧间点起蜡烛，我们牵着手走进客厅。他还是仰面躺着，眼睛睁开，一条胳膊伸在身旁，和我们离开时完全一样。
        - id: ch02-b02
          speaker: mother
          text: 吉姆，把百叶窗放下来。外面也许有人在偷看。
        - id: ch02-b03
          speaker: narrator
          text: 我把百叶窗放好。母亲看着地上的尸体，声音里忽然带上了哭腔。
        - id: ch02-b04
          speaker: mother
          text: 接下来得从这个死人身上找到钥匙。可是，谁敢伸手碰他呢？
        - id: ch02-b05
          speaker: narrator
          text: 我马上跪了下去。船长手边有一小片圆纸，一面熏得漆黑。我一看便知道，那是黑券。翻到背面，上面用整齐清楚的字写着，今晚十点以前，任你处置。
        - id: ch02-b06
          speaker: narrator
          text: 母亲，他们给他留到了十点。
        - id: ch02-b07
          speaker: narrator
          text: 话刚出口，家里的老钟突然敲响，把我们吓得差点跳起来。不过数过钟声，我们反而有了点希望。现在才六点。
        - id: ch02-b08
          speaker: mother
          text: 好了，吉姆。现在去拿钥匙。
        - id: ch02-b09
          speaker: narrator
          text: 我挨个翻他的口袋，只摸出几枚小钱、一只顶针、一些针线、一截咬过的辫状烟草，还有弯柄水手刀、袖珍罗盘和火绒盒。钥匙却怎么也找不到，我越来越泄气。
        - id: ch02-b10
          speaker: mother
          text: 会不会挂在他的脖子上？
        - id: ch02-b11
          speaker: narrator
          text: 我压住心里的厌恶，扯开他的衣领。钥匙果然挂在一截沾着焦油的绳子上。我拿起他的水手刀，割断绳子。这一来，我们又有了希望，赶紧跑上楼，来到他住了很久的小屋。他从第一天到这里起，就一直把箱子放在那里。
        - id: ch02-b12
          speaker: narrator
          text: 那只箱子看上去跟普通海员的箱子没什么不同。箱盖上烙着字母“B”，几个角被长年累月地乱撞，已经又凹又破。
        - id: ch02-b13
          speaker: mother
          text: 把钥匙给我。
        - id: ch02-b14
          speaker: narrator
          text: 锁锈得很涩，母亲却转眼就把它拧开，掀起箱盖。一股烟草和焦油的浓重气味冲了出来。最上面是一套质地很好的衣服，刷得干净，叠得整齐。母亲看过以后，说那套衣服从来没有穿过。
    - id: ch03
      title: 海箱里的金币
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 衣服下面全是杂物。有象限仪、小锡杯、几条烟草、两对精美的手枪、一块条形银锭，还有西班牙旧怀表。里面也有几件不大值钱的小玩意儿，多半来自外国，另外还有一副镶黄铜的圆规，以及五六枚奇特的西印度群岛贝壳。后来我常常纳闷，他一辈子四处漂泊，犯下罪过，又被人追捕，为什么始终带着这些贝壳。
        - id: ch03-b02
          speaker: narrator
          text: 除了银锭和那些小玩意儿，我们还没找到值钱的东西，而那些都不是我们要的。再往下是一件旧船用斗篷。它经过不知多少道港湾沙洲，早被海盐漂白了。母亲不耐烦地掀开斗篷，箱底最后两样东西终于露了出来。
        - id: ch03-b03
          speaker: narrator
          text: 一样是油布包裹的一捆东西，看起来像文件。另一样是帆布袋，手一碰，里面的金币就叮当作响。
        - id: ch03-b04
          speaker: mother
          text: 我要让这些恶棍知道，我是个清白的女人。该拿的账款，我一分不少，多一个法辛也不要。吉姆，拿好克罗斯利太太的袋子。
        - id: ch03-b05
          speaker: narrator
          text: 母亲打开水手的钱袋，按船长欠下的数目，一枚枚数进我手里的袋子。这可不是件容易事。钱币来自许多国家，大小也不同，全胡乱混在一起。有达布隆金币、法国路易金币、金基尼、西班牙八里亚尔银币，还有很多连我都叫不上名字的钱。
        - id: ch03-b06
          speaker: narrator
          text: 偏偏母亲只会用金基尼计算，袋子里这种钱又最少。数到大约一半，我突然按住她的胳膊。结霜的寒夜一片寂静，我们却听见瞎子的手杖敲上了冻硬的道路。嗒，嗒。那声音一下下逼近，我的心也提到了嗓子眼。
        - id: ch03-b07
          speaker: narrator
          text: 我们坐着不敢呼吸。手杖终于重重敲在客店门上。接着，门把被人拧动，门闩也叫他摇得哐啷作响。那个可怕的瞎子想闯进来。过了一会儿，门里门外全没了声音。寂静持续了很久，敲击声才重新响起。
        - id: ch03-b08
          speaker: narrator
          text: 那阵嗒嗒声渐渐远去，最后再也听不见了。我们心里的欣喜和庆幸，简直说不出来。
        - id: ch03-b09
          speaker: narrator
          text: 母亲，别再数了。全拿上，我们快走。大门从里面闩住，一定会让他起疑。他很快就会带来一大群恶徒。只有亲眼见过那个瞎子的人，才会知道我多么庆幸自己插上了门闩。
        - id: ch03-b10
          speaker: narrator
          text: 母亲明明也吓坏了，却不肯多拿一丁点，也不愿少拿一丁点。她说离七点还早，自己清楚应得多少，就非拿足不可。她还在跟我争论，远处山上传来一声低低的口哨。这一下，对我们来说已经远远够了。
        - id: ch03-b11
          speaker: mother
          text: 数到多少，我就拿多少。
        - id: ch03-b12
          speaker: narrator
          text: 母亲一下站了起来。我也伸手捡起那只油布包。
        - id: ch03-b13
          speaker: narrator
          text: 那我拿走这个，正好抵清还没数完的账。
    - id: ch04
      title: 月光下逃亡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 下一刻，我们把蜡烛留在打开的空箱旁，摸黑跑下楼。再下一刻，大门已经打开，我们拼命往村子撤。动身再迟一点儿，后果都不堪设想。雾正在飞快消散，两边的高地已经铺满清亮月光。只有山坳最深处和客店门口，还留着一层没有散开的薄雾，暂时替我们遮住刚刚逃离客店的身影。
        - id: ch04-b02
          speaker: narrator
          text: 可是走不到一半，才越过山脚一点点，我们就必须踏进月光。更糟的是，几个人奔跑的脚步已经传了过来。我们回头望去，一点灯光上下摇晃，正迅速逼近。来人里有人提着灯笼。
        - id: ch04-b03
          speaker: mother
          text: 好孩子，你拿着钱先跑。我快要昏过去了。
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 我心想，这回我们两人都完了。我恨那些邻居为什么如此胆小，也埋怨可怜的母亲。她刚才又老实又贪心，先前还那么逞强，现在却忽然没了力气。
        - id: ch04-b05
          speaker: narrator
          text: 幸好我们刚好走到小桥边。我扶着母亲往河岸走，她脚步踉跄，到了岸边便叹了一声，倒在我的肩头。我不知道自己怎么找到了那股力气。动作恐怕很粗鲁，可我总算把她拖下河岸，又往桥洞下面拖了一点。
        - id: ch04-b06
          speaker: narrator
          text: 桥身太低，我只能从下面爬过去，没法再拖动母亲。我们只好留在那里。母亲几乎整个身子都露在外面，我们两人又离客店那么近，近得能听见那里传来的声音。
