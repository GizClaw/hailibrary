audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: vivid, thoughtful first-person storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    mother:
      display_name: Mrs. Hawkins
      tts:
        delivery: caring, practical, and easily flustered
        timbre: warm and gentle
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Sea-chest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I wasted no time telling Mother everything I knew. I should probably have told her much sooner. Right away, we understood how dangerous our position was. If the captain had any money, some of it certainly belonged to us. But his old shipmates, especially Black Dog and the blind beggar, were not likely to give up any treasure just to pay a dead man's debts.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The captain had told me to ride for Dr. Livesey at once. But that would leave Mother alone and unprotected, and I could never do that. We could not stay in the house much longer, either. Every small noise frightened us. Coals shifted in the kitchen grate. The clock kept ticking. Each sound seemed like footsteps coming closer.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The captain's body still lay on the parlor floor. Worse, I could not stop thinking about that hateful blind man somewhere nearby, ready to return. At times, the fear nearly made me jump out of my skin. We had to decide quickly. At last, we agreed to leave together and ask for help in the nearby hamlet. We ran out bareheaded into the cold fog as evening gathered around us.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The hamlet stood only a few hundred yards away, beyond the next cove and out of sight. It lay in the opposite direction from the road the blind man had taken, and that gave me courage. The walk took only a few minutes, though now and then we stopped, grabbed hold of each other, and listened. We heard nothing strange. There was only the soft wash of the water and the croaking of creatures in the woods.
        - id: ch01-b05
          speaker: narrator
          text: >-
            By the time we reached the hamlet, it was dark enough for candles. They glowed yellow behind the doors and windows, and the sight cheered me more than I can say. But that light was nearly all the comfort we found there. You might think the villagers would have been ashamed of themselves, but not one person would come back with us to the Admiral Benbow. The more we explained our trouble, the tighter every man, woman, and child clung to the safety of home.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Captain Flint's name meant nothing to me, but some of the villagers knew it well, and it terrified them. Men who had worked in the fields beyond our inn had seen strangers on the road. They thought the men were smugglers and ran away. Someone had even spotted a small sailing boat in Kitt's Hole. To the villagers, any old friend of the captain was reason enough to hide. Several offered to ride in the other direction for Dr. Livesey, but no one would help defend the inn.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Fear can spread from person to person. But after everyone had argued long enough, Mother found her courage and stood up to them. She said she would not lose money that rightfully belonged to her fatherless son.
        - id: ch01-b08
          speaker: mother
          text: >-
            If none of you has the nerve to go, Jim and I do. We're going straight back the way we came, and no thanks to you big, hulking cowards. We'll open that chest even if it kills us. Mrs. Crossley, give me a bag. I'm bringing back every penny we're lawfully owed.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Of course I said I would go with her. Everyone protested that we were being reckless, but still no man offered to join us. They gave me a loaded pistol in case we were attacked. They also promised to keep saddled horses ready if we came back with men chasing us. One boy was sent ahead to the doctor's house to find armed help.
        - id: ch01-b10
          speaker: narrator
          text: >-
            My heart pounded as Mother and I started into the cold night. A full moon was rising, red through the top of the fog, and the sight made us hurry. Soon it would be bright as day, and anyone watching would see us leave. We moved quickly and quietly beside the hedges. Nothing appeared. Nothing made a sound. At last, with deep relief, we shut the door of the Admiral Benbow behind us.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I slid the bolt into place. For a moment we stood in the dark, panting, alone with the dead captain. Mother found a candle in the bar. Holding hands, we went into the parlor. He was just where we had left him, flat on his back, his eyes open and one arm reaching out.
        - id: ch01-b12
          speaker: mother
          text: >-
            Pull down the window blind, Jim. They might be outside watching us.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I did as she asked.
        - id: ch01-b14
          speaker: mother
          text: >-
            Now we have to get the key off him. But who in the world is going to touch him?
        - id: ch01-b15
          speaker: narrator
          text: >-
            Her voice broke into a little sob. I dropped to my knees. Near the captain's hand lay a small round piece of paper, black on one side. It had to be the black spot. I picked it up and turned it over. In neat, clear writing, it said, “You have until ten tonight.”
        - id: ch01-b16
          speaker: narrator
          text: >-
            I told Mother, “He had until ten.” Just as the words left my mouth, our old clock began to strike. The sudden noise in that silent house nearly frightened us senseless. But when we counted the strokes, the news was good. It was only six. We still had four hours before the time written on the black spot.
        - id: ch01-b17
          speaker: mother
          text: >-
            All right, Jim. Find that key.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I searched every pocket. I found a few small coins, a thimble, thread and large needles, a chewed piece of tobacco, his crooked-handled knife, a pocket compass, and a tinderbox. That was all. I was beginning to lose hope.
        - id: ch01-b19
          speaker: mother
          text: >-
            Maybe he wore it around his neck.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I hated what I had to do, but I forced myself to tear open his shirt. There was the key, hanging from a tarry cord. I cut the cord with his own knife. Finding it filled us with hope, and we hurried upstairs to the little room where he had slept and kept his chest from the day he arrived.
        - id: ch01-b21
          speaker: narrator
          text: >-
            From the outside, it looked like any sailor's chest. The letter B had been burned into the lid, and years of rough handling had battered its corners.
        - id: ch01-b22
          speaker: mother
          text: >-
            Give me the key.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The lock fought against the key, but Mother forced it around and threw back the lid in moments. A heavy smell of tar and tobacco rose from inside. On top lay only a fine suit of clothes, carefully brushed and folded. Mother looked them over and said they had never been worn. We lifted them out and kept searching.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Beneath it was a strange collection. We found a navigation instrument, a small tin cup, several twists of tobacco, two pairs of handsome pistols, a bar of silver, an old Spanish watch, and a few cheap foreign trinkets. There was also a brass-mounted compass and five or six curious shells from the West Indies. In later years, I often wondered why he had carried those shells through his guilty, wandering life while men hunted him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            So far, only the silver and trinkets had any value, and neither was what we needed. At the bottom lay an old boat cloak, bleached white with sea salt from many harbors. Mother pulled it aside impatiently. Under it were the last two things in the chest. One was a bundle wrapped in oilcloth that felt like papers. The other was a canvas bag that jingled with gold when we touched it.
        - id: ch01-b26
          speaker: mother
          text: >-
            Those thieves will see that I'm an honest woman. I'll take exactly what he owed us, and not one farthing more. Jim, hold Mrs. Crossley's bag.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Mother began moving coins from the sailor's bag into the one I held, counting out the captain's unpaid bill. It was slow, difficult work. Coins from all over the world had been tossed together at random, all different in size and value. There were doubloons, louis d'or, guineas, pieces of eight, and others I could not name. English guineas were the only coins Mother knew how to count properly, and there were fewer of those than almost anything else. She had to pick through the whole shining heap to find them.
        - id: ch01-b28
          speaker: narrator
          text: >-
            We had counted about half when I suddenly grabbed her arm. Through the cold, silent air came a sound that made my heart leap into my throat. Tap. Tap. Tap. It was the blind man's stick striking the frozen road.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The tapping drew closer while we held our breath. Then the stick struck sharply against the inn door. The handle turned. The bolt rattled as that dreadful man tried to get inside. After that came a long silence, both inside the inn and out. At last, the tapping began again. To our joy, it slowly faded until we could hear it no more.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I begged Mother to take all the money and leave. The locked door must have made the blind man suspicious, and I was sure he would bring the whole gang down on us. No one who had not met him could understand how thankful I was that I had bolted that door.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Mother was frightened, but she still refused to take one coin more than we were owed. She would not settle for less, either. It was nowhere near seven o'clock, she argued. She knew what was rightfully hers, and she meant to have it. We were still arguing when a quiet whistle sounded far off on the hill. That was more than enough for both of us.
        - id: ch01-b32
          speaker: mother
          text: >-
            I'll take what I've counted.
        - id: ch01-b33
          speaker: narrator
          text: >-
            She jumped to her feet with the coins she had already counted. I grabbed the oilcloth bundle of papers. If Mother would not take more gold than she was owed, I said, then I would take the packet to settle whatever was still missing from the bill.
        - id: ch01-b34
          speaker: narrator
          text: >-
            A moment later, we were feeling our way downstairs in the dark. We left the candle burning beside the open chest, now emptied of the things we had taken. Then we pulled open the door and fled. We had escaped just in time. The fog was breaking apart fast. Moonlight already shone clearly over the high ground on both sides of us. Only a thin curtain of mist remained at the bottom of the hollow and around the tavern door. For the first few steps, that mist still hid us from anyone looking down the road.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Before we reached even halfway to the hamlet, just beyond the foot of the hill, we would have to step into the moonlight. And now we heard several people running toward us. When we looked back, a light swung from side to side and came closer by the second. One of them was carrying a lantern.
        - id: ch01-b36
          speaker: mother
          text: >-
            My dear, take the money and keep running. I'm going to faint.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I thought that meant the end for both of us. I cursed the neighbors for their cowardice. I blamed poor Mother, too, for being so honest and yet so greedy, for daring so much before and becoming weak now.
        - id: ch01-b38
          speaker: narrator
          text: >-
            By good luck, we had reached the little bridge. Mother was staggering. I helped her to the edge of the bank, where she sighed and collapsed against my shoulder. I don't know how I found the strength to move her. I fear I handled her roughly, but somehow I dragged her down the bank and partway beneath the arch.
        - id: ch01-b39
          speaker: narrator
          text: >-
            I could take her no farther. The bridge was so low that I could only crawl under it. We had to stay there, with Mother almost completely exposed and both of us close enough to hear whatever happened at the inn.
