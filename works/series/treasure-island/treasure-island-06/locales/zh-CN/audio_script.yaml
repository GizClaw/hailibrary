audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    dance:
      display_name: 丹斯先生
      tts:
        delivery: 爽朗直率，带着办事人的利落劲头
        timbre: 洪亮结实
        pace: 明快
        pitch: 中
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静机敏，幽默中透着不容含糊的坚定
        timbre: 清晰温厚
        pace: 从容
        pitch: 中
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，兴奋时声势十足又直来直往
        timbre: 洪亮饱满
        pace: 明快多变
        pitch: 中低
  chapters:
    - id: ch01
      title: 大宅书房
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们一路纵马疾驰，直到利弗西医生家门前才勒住缰绳。宅子正面却黑着灯。丹斯先生叫我下马敲门，多格把马镫让给我踩着下来。女仆几乎马上就开了门。
        - id: ch01-b02
          speaker: narrator
          text: 我问她，利弗西医生在家吗？
        - id: ch01-b03
          speaker: narrator
          text: 她说，医生下午回来过，后来去大宅陪乡绅吃晚饭、消磨夜晚了。
        - id: ch01-b04
          speaker: dance
          text: 那好，小伙子们，咱们接着走。
        - id: ch01-b05
          speaker: narrator
          text: 路程不远，我没再上马，只抓着多格的马镫皮跟着跑。我们穿过庄园大门，沿着落光叶子的长道一路向前。月色铺满道路。尽头那座大宅一片雪白，屋宇向两旁展开，俯瞰着古老的大花园。丹斯先生在那里下了马，带我走到门前。门房一听他说完，马上放我们进去。仆人又领着我们穿过铺着席垫的过道，来到尽头的一间大书房。四壁全是书架，架顶摆着一尊尊半身像。乡绅和医生坐在明亮的炉火两边，手里都拿着烟斗。
        - id: ch01-b06
          speaker: narrator
          text: 我从没离乡绅这样近。他身高超过六英尺，肩膀也宽得相称。那张脸粗犷豪爽。常年在外旅行，让他的皮肤变得粗糙，晒得通红，也刻下许多纹路。两道浓黑的眉毛特别灵活，总是动个不停。你一看便知道，他有几分火气。那脾气来得又快又猛，不过并不坏。
        - id: ch01-b07
          speaker: squire_trelawney
          text: 进来吧，丹斯先生。
        - id: ch01-b08
          speaker: narrator
          text: 乡绅说得庄重，还带着几分大人物俯就小人物的派头。医生则朝我们点点头。
        - id: ch01-b09
          speaker: doctor_livesey
          text: 晚上好，丹斯。吉姆小朋友，也祝你晚上好。是什么好风把你们吹来了？
        - id: ch01-b10
          speaker: narrator
          text: 丹斯先生把身子挺得笔直，僵硬得像在背课文，一五一十讲起客店发生的事。你真该看看那两位先生当时的模样。他们越听越入神，一会儿探身向前，一会儿互相看一眼。两人又惊讶又好奇，连烟斗都忘了抽。听到母亲竟然返回客店，医生猛拍了一下大腿，乡绅高喊一声好样的，手里的长烟斗也在炉栅上磕断了。故事还没讲完，特里劳尼乡绅已经离开座位，在房里大步来回走。医生像是怕漏听一个字，索性摘下扑粉的假发，露出自己剪得短短的黑发。坐在那里，他的模样实在古怪极了。
        - id: ch01-b11
          speaker: narrator
          text: 丹斯先生终于说完，乡绅立刻夸起他来。
        - id: ch01-b12
          speaker: squire_trelawney
          text: 丹斯先生，你真是个了不起的好汉！你纵马撞倒那个黑心恶棍，也算做了一件善事，就像一脚踩死一只蟑螂。霍金斯这孩子也很出色。霍金斯，摇一下铃吧，该让丹斯先生喝杯麦酒。
        - id: ch01-b13
          speaker: doctor_livesey
          text: 吉姆，他们苦苦追赶的东西，现在在你手里，对吗？
        - id: ch01-b14
          speaker: narrator
          text: 我说就在这里，把油布包交给了医生。他翻来覆去地看，手指像是痒得恨不得马上拆开，却只把包安安静静地收进外套口袋。
        - id: ch01-b15
          speaker: doctor_livesey
          text: 乡绅，丹斯喝完麦酒还要去办国王的差事。我想让吉姆今晚睡在我家。你若不介意，就请人端来冷馅饼，让他先吃顿晚饭。
        - id: ch01-b16
          speaker: squire_trelawney
          text: 随你安排，利弗西。不过霍金斯立了这样的功，可不只配吃一块冷馅饼。
        - id: ch01-b17
          speaker: narrator
          text: 一只大乳鸽馅饼很快端了进来，放在边桌上。我早就饿得像只鹰，于是坐下来痛痛快快吃了一顿。那边，乡绅和医生又好好夸奖了丹斯先生一番。直到最后，他们才送他离开。
    - id: ch02
      title: 油布包里的册子
      blocks:
        - id: ch02-b01
          speaker: doctor_livesey
          text: 那么，乡绅，我们来谈正事吧。
        - id: ch02-b02
          speaker: squire_trelawney
          text: 那么，利弗西，我们来谈正事吧。
        - id: ch02-b03
          speaker: doctor_livesey
          text: 一个人一个人说。弗林特这个人，你总听说过吧？
        - id: ch02-b04
          speaker: squire_trelawney
          text: 听说过？你还问我听没听说过！出海的海盗里，就数他最嗜血。黑胡子跟他一比，简直还是个孩子。西班牙人怕他怕得要命，我有时甚至会为他是英国人而骄傲。我亲眼在特立尼达岛外见过他的上桅帆。同船那个从朗姆酒桶里生出来的胆小鬼，马上掉头逃回了西班牙港！
        - id: ch02-b05
          speaker: doctor_livesey
          text: 我在英国也听过他的名声。可我要问的是，他有钱吗？
        - id: ch02-b06
          speaker: squire_trelawney
          text: 钱？故事你没听明白吗？那帮恶棍追的不就是钱？除了钱，他们还在乎什么？还有什么能让他们拿自己的贱命去冒险？
        - id: ch02-b07
          speaker: doctor_livesey
          text: 我们马上就会知道。可你这么急躁，一开口就嚷，我连一句整话也说不了。假如我口袋里有一条线索，能领我们找到弗林特埋宝藏的地方，那批宝藏究竟会有多少？
        - id: ch02-b08
          speaker: squire_trelawney
          text: 会有多少？先生，只要真有这条线索，我就到布里斯托尔码头置办一条船，带上你和霍金斯。就算找上一年，我也非把宝藏找出来不可！
        - id: ch02-b09
          speaker: doctor_livesey
          text: 很好。吉姆要是同意，我们就把包打开。
        - id: ch02-b10
          speaker: narrator
          text: 医生把油布包放到面前的桌上。包裹四周用线缝得严严实实，根本没法直接打开。他只好拿出医疗器械盒，从里面取出医用剪刀，一针一针剪开缝线。包里总共两样东西，一本册子，还有一张封好的纸。医生决定先看册子。他翻开时，乡绅立刻从肩头探过去。我本来还坐在边桌旁吃东西，医生却好心地朝我招手，让我也绕过去，一起享受寻找线索的乐趣。
        - id: ch02-b11
          speaker: narrator
          text: 第一页尽是零碎字句，像是有人手里拿着笔，无聊时随手乱写，又像是拿来练字。有一句和文身相同，写着“比利·鲍恩斯的心爱之物”。此外还有“W.鲍恩斯先生，大副”“再也不喝朗姆酒”“他在棕榈岛外得到了它”，以及几个让人摸不着头脑的词。我不由得想，到底是谁得到了它，得到的又是什么。说不定，是背后挨了一刀。
        - id: ch02-b12
          speaker: doctor_livesey
          text: 这一页没告诉我们多少东西。
        - id: ch02-b13
          speaker: narrator
          text: 后面十来页写着一串怪账。每一行的一头是日期，另一头是一笔钱，和普通账簿没有两样。可该写说明的中间，只画着数目不同的叉号。一七四五年六月十二日那一项，明明是某个人应得七十英镑，缘由却只用六个叉来交代。偶尔也会出现“加拉加斯外海”这样的地名。有时连地名也没有，只留下一组经纬度。
        - id: ch02-b14
          speaker: narrator
          text: 这些账目前后延续了将近二十年。每一笔钱的数目都随着年月过去越来越大。册子末尾还有一笔总数，显然是算账的人连着加错五六遍之后，才终于得出的结果。旁边写着几个字，“鲍恩斯的全部家当”。
        - id: ch02-b15
          speaker: doctor_livesey
          text: 我真是半点也看不懂。
        - id: ch02-b16
          speaker: squire_trelawney
          text: 这还不跟白天一样清楚？这是那条黑心恶狗的账本。叉号代表被他们抢过或弄沉的船和城镇，钱数就是他分到的一份。怕人看不懂时，他还添上说明。你看“加拉加斯外海”，准有一条倒霉的船在那里被他们洗劫。愿上帝保佑船上的可怜人。他们如今早就化成珊瑚了。
        - id: ch02-b17
          speaker: doctor_livesey
          text: 对！走过远路的人就是有见识。你再看，他的地位越高，分的钱也越多。
        - id: ch02-b18
          speaker: narrator
          text: 册子里剩下的内容很少。靠近末尾的几张空白页上，只记了几个地方的方位。除此之外，还有一张钱币换算表，可以把法国、英国和西班牙的钱，全都折算成同一种币值。
        - id: ch02-b19
          speaker: doctor_livesey
          text: 真会精打细算！谁也别想从他手里骗走一分钱。
        - id: ch02-b20
          speaker: squire_trelawney
          text: 好了，现在看另一件。
    - id: ch03
      title: 宝岛地图
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那张纸封了好几处，拿来盖印的是一枚顶针，也许正是我从船长口袋里找到的那一枚。医生十分小心，一处一处揭开封口。随后，一张海岛地图从里面掉了出来。图上不但标着经纬度和水深，还写着山岭、海湾和小港的名字。一艘船要靠近海岸，在那里安全下锚，所需的一切细节都画在上面。
        - id: ch03-b02
          speaker: narrator
          text: 这座岛长大约九英里，宽约五英里。要说它像什么，简直像一条挺身站起来的胖龙。岛上有两处很好的内港，四面都受陆地遮护。中央那座山标着“望远镜山”。图上还有几处后来添写的记号，最醒目的是红墨水画出的三个叉。两个在岛的北边，一个在西南方。西南那个红叉旁，也用红墨水写着一行小字。字迹又小又工整，和船长歪歪扭扭的字完全不同。那行字写的是“大部分宝藏在此”。
        - id: ch03-b03
          speaker: narrator
          text: 把地图翻过来，背面还是同一个人的笔迹。上面说，望远镜山肩部有一棵高树，方位在东北偏北再向北一点。骷髅岛位于东南偏东再偏东。下一行只写着“十英尺”。银锭藏在北边的秘窖，要沿着东侧小丘的走向寻找，在那块形如人脸的黑色峭岩以南十噚处。武器倒是很好找，就埋在北面小港入口岬角北端的沙丘里，方位东偏北四分之一。所有说明的末尾，署着两个字母，J.F.
        - id: ch03-b04
          speaker: narrator
          text: 地图背面的说明到这里就结束了。文字虽然不多，我却一个字也弄不懂。可乡绅和利弗西医生看过以后，顿时高兴得不得了。
        - id: ch03-b05
          speaker: squire_trelawney
          text: 利弗西，你马上扔下那份倒霉的行医差事。明天我就动身去布里斯托尔。三个星期，不，两个星期，不，十天之内，我们就会有全英格兰最好的船和最出色的水手。霍金斯跟我们走，来当船舱侍役。他一定会成为一流的船舱侍役。你当船医，我当舰队司令。再带上雷德鲁斯、乔伊斯和亨特。我们会一路顺风，很快抵达，轻轻松松找到那个地方。从此钱多得随便吃，随便在里面打滚，还能当扁石子打水漂！
          emotion: happy
        - id: ch03-b06
          speaker: doctor_livesey
          text: 特里劳尼，我愿意跟你去。我也敢替吉姆担保，他一定愿意去，而且会给这趟事业增光。不过，我只害怕一个人。
        - id: ch03-b07
          speaker: squire_trelawney
          text: 谁？快说出那条狗的名字！
        - id: ch03-b08
          speaker: doctor_livesey
          text: 就是你，因为你管不住自己的嘴。知道这张纸的不只我们几个。今晚袭击客店的那群人既大胆又亡命，留在小帆船上的同伙也一样。我敢说，附近还有更多人。无论发生什么，他们都发了誓，非拿到这笔钱不可。所以，在我们出海以前，谁都不能独自行动。这段日子，吉姆跟我寸步不离。你骑马去布里斯托尔时，也要带上乔伊斯和亨特。从现在到最后，我们谁也不许透露半个字，更不能说出自己发现了什么。
        - id: ch03-b09
          speaker: squire_trelawney
          text: 利弗西，你说得总是对。我一定像坟墓一样守口如瓶。
