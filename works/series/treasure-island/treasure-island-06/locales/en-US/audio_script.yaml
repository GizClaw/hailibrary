  chapters:
    - id: ch01
      title: The Captain's Papers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            We rode at full speed until we pulled up outside Dr. Livesey's house. The whole front of it was dark.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Mr. Dance told me to get down and knock. Dogger held out a stirrup for me, and the maid opened the door almost at once.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I asked if Dr. Livesey was home.
        - id: ch01-b04
          speaker: maid
          text: >-
            No. He came home this afternoon, but then he went up to the hall. He's dining with the squire and spending the evening there.
        - id: ch01-b05
          speaker: mr_dance
          text: >-
            Then that's where we're going, boys.
        - id: ch01-b06
          speaker: narrator
          text: >-
            It was not far, so I stayed on foot and ran beside Dogger, holding on to his stirrup leather. We passed through the lodge gates and hurried along a long avenue of bare trees under the moon. Ahead, the white buildings of the hall stretched between great old gardens.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Mr. Dance climbed down there and took me inside. A servant led us along a carpeted passage into a huge library. Bookcases covered the walls, with busts lined up above them. The squire and Dr. Livesey sat on opposite sides of a bright fire, each holding a pipe.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I had never seen the squire so close before. He stood more than six feet tall and was just as broad. His face was bold and ready for anything, rough, red, and deeply lined from years of travel. Thick black eyebrows shifted above his eyes and made him look quick-tempered, though not cruel.
        - id: ch01-b09
          speaker: squire_trelawney
          text: >-
            Come in, Mr. Dance.
        - id: ch01-b10
          speaker: doctor_livesey
          text: >-
            Good evening, Dance. And good evening to you, Jim. What brings you here tonight?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mr. Dance stood straight and stiff and gave his report as if he had learned every word by heart. The two gentlemen leaned closer and stared at each other. They were so surprised and interested that they forgot all about their pipes.
        - id: ch01-b12
          speaker: narrator
          text: >-
            When Mr. Dance told them how my mother had gone back into the inn, Dr. Livesey slapped his thigh. The squire shouted his approval and struck his long pipe against the fireplace so hard that it broke. Before the story was half over, Squire Trelawney was pacing the room. The doctor even pulled off his powdered wig, as if that would help him hear. His own black hair was cut very short, and without the wig he looked strange indeed.
        - id: ch01-b13
          speaker: narrator
          text: >-
            At last, Mr. Dance came to the end.
        - id: ch01-b14
          speaker: squire_trelawney
          text: >-
            Mr. Dance, you are a noble fellow. And running down that wicked scoundrel was a public service, sir. No different from stamping on a cockroach. Young Hawkins is a fine lad, too. Hawkins, ring the bell. Mr. Dance deserves some ale.
        - id: ch01-b15
          speaker: doctor_livesey
          text: >-
            So, Jim, you have what those men were hunting for?
        - id: ch01-b16
          speaker: narrator
          text: >-
            I handed him the oilskin packet.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The doctor turned it over and studied every side. He plainly wanted to open it, but he resisted. Instead, he slipped it quietly into his coat pocket.
        - id: ch01-b18
          speaker: doctor_livesey
          text: >-
            Squire, once Dance has had his ale, he must go back to the king's business. But Jim will sleep at my house tonight. If you agree, let's bring up the cold pie and give the boy some supper.
        - id: ch01-b19
          speaker: squire_trelawney
          text: >-
            Just as you say, Livesey. Though Hawkins has earned something better than cold pie.
        - id: ch01-b20
          speaker: narrator
          text: >-
            A large pigeon pie was set on a side table. I ate a tremendous supper, because I was hungry as a hawk. Meanwhile, the gentlemen praised Mr. Dance some more, and at last he took his leave.
        - id: ch01-b21
          speakers: [doctor_livesey, squire_trelawney]
          ensemble: duo
          text: >-
            And now...
        - id: ch01-b22
          speaker: narrator
          text: >-
            They both spoke at exactly the same moment.
        - id: ch01-b23
          speaker: doctor_livesey
          text: >-
            One at a time!
        - id: ch01-b24
          speaker: narrator
          text: >-
            Dr. Livesey laughed, then asked whether the squire had heard of Flint.
        - id: ch01-b25
          speaker: squire_trelawney
          text: >-
            Heard of him? Flint was the most bloodthirsty pirate ever to sail. Beside him, Blackbeard was a child. The Spanish feared Flint so much that I was almost proud he was English. I once saw his topsails off Trinidad with my own eyes. The coward I was sailing with turned us straight around and ran back into Port of Spain!
        - id: ch01-b26
          speaker: doctor_livesey
          text: >-
            I've heard of Flint here in England, too. What matters is whether he had money.
        - id: ch01-b27
          speaker: squire_trelawney
          text: >-
            Money? Haven't you understood the story? Why else were those villains there? Money is all they care about. It's the only thing they'd risk their worthless hides to get!
        - id: ch01-b28
          speaker: doctor_livesey
          text: >-
            We will know soon enough. But you're making such a storm of noise that I can hardly speak. Suppose the packet in my pocket holds a clue to Flint's buried treasure. Would that treasure be worth very much?
        - id: ch01-b29
          speaker: squire_trelawney
          text: >-
            Worth much? If you truly have that clue, I'll outfit a ship in Bristol and take you and Hawkins with me. If it takes a whole year, I'll find that treasure!
        - id: ch01-b30
          speaker: doctor_livesey
          text: >-
            Very well. If Jim agrees, let's open the packet.
        - id: ch01-b31
          speaker: narrator
          text: >-
            He placed it on the table. The wrapping had been sewn shut, so the doctor took out his instrument case and snipped the stitches with his medical scissors. Inside were two things, a book and a sealed paper.
        - id: ch01-b32
          speaker: doctor_livesey
          text: >-
            We'll start with the book.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The squire and I leaned over his shoulders as he opened it. Dr. Livesey had waved me over from my supper so I could join the fun of the search. The first page held only scraps of writing, the sort of marks a man makes when he has a pen and nothing better to do. One matched the captain's tattoo and said, “Billy Bones his fancy.” There were other bits, too. “Mr. W. Bones, mate.” “No more rum.” “Off Palm Key he got itt.” Most of the rest was single words that made no sense.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I wondered who had “got itt,” and what he had gotten. A knife in the back, most likely.
        - id: ch01-b35
          speaker: doctor_livesey
          text: >-
            That tells us very little.
        - id: ch01-b36
          speaker: narrator
          text: >-
            He turned the page. The next ten or twelve pages were covered with strange accounts. Every line had a date at one end and an amount of money at the other. But where an ordinary account book would explain the payment, this one showed only a number of crosses.
        - id: ch01-b37
          speaker: narrator
          text: >-
            One entry said that seventy pounds became due on June twelfth, 1745. Six crosses were the only explanation. Now and then, the writer had added a place, like “Offe Caraccas.” In one spot, he had written nothing but coordinates: sixty-two degrees, seventeen minutes, twenty seconds, followed by nineteen degrees, two minutes, forty seconds.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Those records covered almost twenty years. The payments grew larger over time. At the end, someone had tried five or six times to add the total correctly. Beneath the final answer were the words, “Bones, his pile.”
        - id: ch01-b39
          speaker: doctor_livesey
          text: >-
            I can't make any sense of it.
        - id: ch01-b40
          speaker: squire_trelawney
          text: >-
            Why, it's perfectly clear! This is that blackhearted villain's account book. The crosses stand for ships or towns his crew robbed and sank. Each amount is his share. Whenever the note might be confusing, he added a clue. Look at “Offe Caraccas.” Some poor ship was boarded near that coast. God help the people who sailed her. Their bones have been coral for years.
        - id: ch01-b41
          speaker: doctor_livesey
          text: >-
            You're right! That's what comes of being a traveler. And look, the payments grew larger as he rose through the ranks.
        - id: ch01-b42
          speaker: narrator
          text: >-
            There was not much more in the book. A few pages near the back gave compass bearings for different places. Another page showed how to convert French, English, and Spanish money to the same value.
        - id: ch01-b43
          speaker: doctor_livesey
          text: >-
            What a careful fellow. No one was going to cheat him.
        - id: ch01-b44
          speaker: squire_trelawney
          text: >-
            Now let's see the other one.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The paper had been sealed in several places with the head of a thimble. It might have been the very thimble I found in the captain's pocket. Dr. Livesey opened each seal with great care.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Out fell a map of an island. It gave the latitude and longitude, the depth of the water, and the names of hills, bays, and inlets. It held every detail a captain would need to bring a ship safely to anchor there.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The island was about nine miles long and five miles wide. It looked something like a fat dragon standing upright. There were two fine harbors, safely enclosed by land, and a hill in the middle named the Spy-glass.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Notes had been added to the map later. Three red crosses stood out above everything else. Two were in the north and one in the southwest. Beside the last cross, in small, neat writing quite unlike the captain's shaky hand, were the words, “Bulk of treasure here.”
        - id: ch01-b49
          speaker: narrator
          text: >-
            The same hand had written more directions on the back. They pointed to a tall tree on the shoulder of the Spy-glass, bearing one point north of north-northeast. From there, Skeleton Island lay east-southeast and by east. Then came one last measure: ten feet.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The bar silver was in the northern hiding place. It could be found by following the line of the eastern hill, ten fathoms south of the black cliff with a face on it. The weapons were easy to find in the sand hill at the north point of the north inlet cape, bearing east and a quarter north. The directions ended with the initials J. F.
        - id: ch01-b51
          speaker: narrator
          text: >-
            That was everything. The directions were short, and I could make no sense of them. But the squire and Dr. Livesey were delighted.
        - id: ch01-b52
          speaker: squire_trelawney
          text: >-
            Livesey, give up this miserable medical practice at once. I leave for Bristol tomorrow. In three weeks—no, two weeks—ten days! We'll have the finest ship and the best crew in England. Hawkins will sail as cabin boy. You'll be a splendid cabin boy, Hawkins. Livesey, you'll be the ship's doctor, and I will be admiral. We'll bring Redruth, Joyce, and Hunter, too.
        - id: ch01-b53
          speaker: squire_trelawney
          text: >-
            We'll have good winds and a fast voyage. We'll find the place without the slightest trouble. Then we'll have enough money to eat, roll in, and toss over ponds for the rest of our lives!
        - id: ch01-b54
          speaker: doctor_livesey
          text: >-
            Trelawney, I'll go with you. I can promise Jim will go as well, and he'll do us proud. But there is one man who worries me.
        - id: ch01-b55
          speaker: squire_trelawney
          text: >-
            Who is he? Tell me the scoundrel's name!
        - id: ch01-b56
          speaker: doctor_livesey
          text: >-
            You. You cannot keep quiet. We are not the only people who know about this paper. The men who attacked the inn tonight were bold and desperate. Others stayed aboard their boat, and I suspect more of them are still nearby. Every one of them is determined to get that money, whatever it takes.
        - id: ch01-b57
          speaker: doctor_livesey
          text: >-
            Until we are safely at sea, none of us should go anywhere alone. Jim and I will stay together. When you ride to Bristol, take Joyce and Hunter with you. And from beginning to end, not one of us may say a single word about what we found.
        - id: ch01-b58
          speaker: squire_trelawney
          text: >-
            Livesey, you're right as always. I'll be as silent as the grave.
