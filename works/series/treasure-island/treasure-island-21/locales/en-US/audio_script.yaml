  chapters:
    - id: ch01
      title: "XXI The Attack"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The moment Silver was gone, the captain turned from watching him and looked around the blockhouse. Every man had left his post except Gray. For the first time, we saw Captain Smollett truly angry.
        - id: ch01-b02
          speaker: captain_smollett
          text: >-
            Back to your stations!
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            We all crept back to our places. Then the captain spoke to each of us in turn.
        - id: ch01-b04
          speaker: captain_smollett
          text: >-
            Gray, you've done your duty like a sailor, and I'll put that in the log. Mr. Trelawney, sir, I expected better from you. Doctor, you once wore the king's uniform! If you behaved this way at Fontenoy, you should have stayed in bed.
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            The doctor's watch hurried back to the loopholes. The others loaded the spare muskets. Every one of us had a burning face after that scolding.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The captain watched in silence for a while before he addressed us again.
        - id: ch01-b07
          speaker: captain_smollett
          text: >-
            Men, I gave Silver a full broadside, and I made it hot on purpose. He said they'll attack before the hour is over, and I believe him. They outnumber us, but we've got shelter. A minute ago, I'd have said we had discipline too. Still, if you choose to fight properly, I don't doubt we can beat them.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He went from station to station and made sure everything was ready. The east and west walls each had two loopholes. The south wall, where the porch stood, had two more. The long north wall had five. Seven of us had about twenty muskets between us.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Four piles of firewood stood inside like tables, one near the middle of each wall. We laid ammunition and four loaded muskets on every pile, close to the defenders' hands. The cutlasses were lined up in the center of the room.
        - id: ch01-b10
          speaker: captain_smollett
          text: >-
            Take the fire outside. The morning chill is gone, and we can't have smoke getting in our eyes.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mr. Trelawney carried the whole iron fire basket out, and the embers were buried in the sand.
        - id: ch01-b12
          speaker: captain_smollett
          text: >-
            Hawkins hasn't eaten breakfast. Jim, get yourself something and eat it at your post. Be quick, lad. You'll need the food before this is over. Hunter, give every man a measure of brandy.
        - id: ch01-b13
          speaker: narrator
          text: >-
            While we did as he ordered, the captain finished working out his defense.
        - id: ch01-b14
          speaker: captain_smollett
          text: >-
            Doctor, take the door. Stay inside where they can't see you, and fire through the porch. Hunter, you have the east wall. Joyce, take the west. Mr. Trelawney, you're our best shot, so you and Gray cover the long north wall and its five loopholes. That's where the real danger lies. If they reach that wall, they can fire through our own openings and trap us inside. Hawkins, you and I aren't much use with a gun. We'll load for the others and help wherever we're needed.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The captain was right about the cold. It had vanished. Once the sun climbed above the ring of trees, its full heat struck the clearing and swallowed the mist. The sand soon baked under us, and resin began to melt from the blockhouse logs.
        - id: ch01-b16
          speaker: narrator
          text: >-
            We threw off our coats and jackets, opened our shirt collars, and rolled our sleeves to the shoulders. Then we waited at our posts, feverish with heat and worry.
        - id: ch01-b17
          speaker: narrator
          text: >-
            A whole hour went by.
        - id: ch01-b18
          speaker: captain_smollett
          text: >-
            Curse them. This is as lifeless as the doldrums. Gray, whistle us up a wind.
        - id: ch01-b19
          speaker: narrator
          text: >-
            At that very moment, the first warning of the attack came from Joyce's post.
        - id: ch01-b20
          speaker: richard_joyce
          text: >-
            Excuse me, sir. If I spot someone, should I shoot?
        - id: ch01-b21
          speaker: captain_smollett
          text: >-
            I already gave you that order!
          emotion: angry
        - id: ch01-b22
          speaker: richard_joyce
          text: >-
            Thank you, sir.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Joyce answered with his usual quiet politeness. Nothing happened right away, but his question put us all on edge. The men at the loopholes held their guns ready and strained their eyes and ears. Captain Smollett stood in the center of the blockhouse, his mouth tight and his face set in a frown.
        - id: ch01-b24
          speaker: narrator
          text: >-
            A few seconds passed. Then Joyce suddenly raised his musket and fired. Before the sound faded, shots answered from outside. They came one after another from every side of the stockade, scattered like a line of geese calling overhead.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Several balls struck the log walls, but none came through. When the smoke drifted away, the stockade and the woods looked just as still and empty as before. No branch moved. Not one flash of a musket barrel showed us where the enemy hid.
        - id: ch01-b26
          speaker: captain_smollett
          text: >-
            Did you get him?
        - id: ch01-b27
          speaker: richard_joyce
          text: >-
            No, sir. I don't believe I did.
        - id: ch01-b28
          speaker: captain_smollett
          text: >-
            At least you told the truth. Hawkins, reload his musket. Doctor, how many men were firing on your side?
        - id: ch01-b29
          speaker: doctor_livesey
          text: >-
            I can tell you exactly. Three shots came from this side. I saw all three flashes. Two were close together, and the third was farther west.
        - id: ch01-b30
          speaker: captain_smollett
          text: >-
            Three. And how many did you count, Mr. Trelawney?
        - id: ch01-b31
          speaker: narrator
          text: >-
            That was harder to answer. Many shots had come from the north. The squire counted seven, while Gray thought there were eight or nine. Only one shot had come from the east and one from the west.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Plainly, the true attack would come from the north. The firing on the other sides was meant to distract us. Even so, Captain Smollett kept every man at his assigned post. If the mutineers crossed the stockade, they could seize any unguarded loophole and shoot us down inside our own shelter.
        - id: ch01-b33
          speaker: narrator
          text: >-
            We had almost no time to think. With a wild cheer, a small band of pirates burst from the north woods and ran straight at the stockade. The men hidden among the trees opened fire again. One rifle ball sang through the doorway and smashed the doctor's musket to pieces.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The attackers poured over the fence like monkeys. The squire and Gray fired again and again. Three pirates went down. One fell forward into the enclosure, and two dropped back outside. But one of those two had been scared more than hurt. In an instant he jumped up and vanished among the trees.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Two men were down, one had fled, and four had made it inside our defenses. Meanwhile, seven or eight pirates stayed under cover in the woods. Each seemed to have several loaded muskets, and they kept up a furious but useless fire against the blockhouse.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The four inside charged straight at the building, shouting as they ran. Their friends among the trees shouted back to urge them on. More shots rang out, but everyone fired so wildly that none seemed to hit. In another moment, the four pirates rushed up the mound and reached us.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Job Anderson, the boatswain, thrust his head into the middle loophole.
        - id: ch01-b38
          speaker: job_anderson
          text: >-
            Get them, every man! All of you, get them!
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: >-
            At the same instant, another pirate grabbed Hunter's musket by the barrel. He tore it from Hunter's hands, dragged it through the loophole, and struck him senseless with one terrible blow. A third pirate had run safely around the building. Now he sprang into the doorway and attacked the doctor with his cutlass.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Everything had turned against us. A moment earlier, we had been under cover, firing at men in the open. Now we were exposed and couldn't strike back.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Smoke filled the blockhouse, and that was the only thing keeping us somewhat safe. I heard shouting and confusion, pistol shots flashing and cracking, and one great groan.
        - id: ch01-b42
          speaker: captain_smollett
          text: >-
            Outside, men! Get out there and fight them in the open! Take the cutlasses!
        - id: ch01-b43
          speaker: narrator
          text: >-
            I snatched a cutlass from the pile. Someone grabbed another at the same time and sliced across my knuckles, but I hardly felt it. I raced through the doorway into the bright sunlight, with someone close behind me. I couldn't tell who it was.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Straight ahead, the doctor was chasing the pirate who had attacked him. As I looked, the doctor knocked aside the man's guard and sent him sprawling on his back with a great cut across his face.
        - id: ch01-b45
          speaker: captain_smollett
          text: >-
            Around the house, men! Get around the house!
        - id: ch01-b46
          speaker: narrator
          text: >-
            Even in that chaos, I heard something change in the captain's voice.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Without thinking, I obeyed. I turned east and ran around the corner with my cutlass raised. There stood Anderson, face-to-face with me. He roared and lifted his blade high over his head, where it flashed in the sun.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I had no time to feel afraid. Before his blow came down, I sprang sideways. My foot slipped in the soft sand, and I tumbled headfirst down the slope.
        - id: ch01-b49
          speaker: narrator
          text: >-
            When I first ran out the door, more mutineers had already been climbing the stockade to finish us. One man in a red nightcap had reached the top with a cutlass between his teeth and one leg over the fence.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Hardly any time had passed when I got back on my feet. The red-capped man was still halfway over. Another pirate's head had only just risen above the stockade. Yet in that single breath, the battle was over, and we had won.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Gray had followed close behind me. Before Anderson could recover from his missed blow, Gray cut the big boatswain down. Another pirate had been shot while firing through a loophole. Now he lay there in agony, the pistol still smoking in his hand. The doctor had already defeated a third with that one stroke.
        - id: ch01-b52
          speaker: narrator
          text: >-
            That left only one of the four men who had crossed the fence. He had dropped his cutlass and was scrambling back over the stockade in terror for his life.
        - id: ch01-b53
          speaker: doctor_livesey
          text: >-
            Fire from the blockhouse! And you men, get back under cover!
        - id: ch01-b54
          speaker: narrator
          text: >-
            No one obeyed him. Not a shot came from the house. The last attacker escaped and disappeared into the woods with the others. Three seconds later, nothing remained of the attacking party but five fallen men, four inside the stockade and one outside.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The doctor, Gray, and I ran back to shelter as fast as we could. The survivors would soon reach the muskets they had left behind, and their firing could begin again at any moment.
        - id: ch01-b56
          speaker: narrator
          text: >-
            By then, some of the smoke had cleared from the blockhouse, and one glance showed us what our victory had cost. Hunter lay stunned beside his loophole. Joyce lay at his station, shot through the head, and he would never move again.
        - id: ch01-b57
          speaker: narrator
          text: >-
            In the center of the room, the squire held up the captain. Both men were deathly pale.
        - id: ch01-b58
          speaker: squire_trelawney
          text: >-
            The captain has been wounded.
        - id: ch01-b59
          speaker: captain_smollett
          text: >-
            Did they get away?
        - id: ch01-b60
          speaker: doctor_livesey
          text: >-
            Every man who still could. But five of them will never run again.
        - id: ch01-b61
          speaker: captain_smollett
          text: >-
            Five! That's better. We've lost three, and they've lost five. That leaves four of us against nine of them. Those odds are better than when we started. Then it was seven against nineteen, or so we believed, and that's a much harder fight.
        - id: ch01-b62
          speaker: narrator
          text: >-
            In fact, the mutineers soon numbered only eight. The man Mr. Trelawney had shot aboard the schooner died from his wound that evening. We on the faithful side did not learn that until later.
