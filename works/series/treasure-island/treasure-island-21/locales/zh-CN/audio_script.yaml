audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    captain_smollett:
      display_name: 斯摩莱特船长
      tts:
        delivery: 威严简短，命令清楚有力，危急中仍不失冷静
        timbre: 坚实粗粝的成年男声
        pace: 利落紧凑
        pitch: 中低
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静机敏，带着温和而含蓄的幽默
        timbre: 温厚清晰的中年男声
        pace: 沉稳从容
        pitch: 中低
    joyce:
      display_name: 乔伊斯
      tts:
        delivery: 忠厚拘谨，无论多么紧张都保持礼貌
        timbre: 朴实清楚的成年男声
        pace: 平稳稍慢
        pitch: 中
    job_anderson:
      display_name: 乔布·安德森
      tts:
        delivery: 凶悍粗暴，冲锋时吼声震耳
        timbre: 粗粝洪亮的成年男声
        pace: 急促有力
        pitch: 低
  chapters:
    - id: ch01
      title: 船长部署防守
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西尔弗刚在树林里消失，船长便转身查看木屋。他刚才一心盯着西尔弗，这时才发现，除了格雷，谁也没守在自己的位置上。我们从没见过他这样生气。
        - id: ch01-b02
          speaker: captain_smollett
          text: 全都回到岗位上去！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 听到这一声吼，我们一个个羞愧地溜回原处。船长先表扬了唯一没有离岗的格雷，又把乡绅和医生狠狠训了一顿。
        - id: ch01-b04
          speaker: captain_smollett
          text: 格雷，我会把你的名字记进航海日志。你守住了职责，像个真正的水手。特里劳尼先生，您居然也擅离岗位，实在让我吃惊。医生，我以为您穿过国王的军装。您在丰特努瓦要是也这么当兵，还不如一直躺在铺位上！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 医生那班人赶紧守回射击孔，其他人忙着给备用火枪装弹。人人都涨红了脸，又羞又窘，活像耳朵里钻进了跳蚤。船长沉默地看了一阵，等所有人安顿好，才再次开口。
        - id: ch01-b06
          speaker: captain_smollett
          text: 弟兄们，我刚才故意用最狠的话轰了西尔弗一通。照他说的，不到一个钟头，他们就会来攻。对方人多，这不必我说。不过我们有木屋掩护。本来我还想说，我们也有纪律。只要你们肯尽力，我相信我们一定能把他们打垮。
        - id: ch01-b07
          speaker: narrator
          text: 船长挨处巡视，确认准备无误。木屋东西两面较短，各有两个射击孔，南面的门廊两旁也有两个，北面却有五个。我们七个人共有大约二十支火枪。四垛柴火分别摆在每面墙的中央，临时当作桌子。每垛上都放着弹药和四支上好子弹的枪，守卫伸手就能拿到。弯刀则整齐地排在屋子中央。
        - id: ch01-b08
          speaker: captain_smollett
          text: 把火搬出去。现在已经不冷了，交战时不能让烟熏着我们的眼睛。
        - id: ch01-b09
          speaker: narrator
          text: 乡绅把整个铁火篮搬出门，将余烬埋进沙里闷灭。船长又想到我还没吃早饭。
        - id: ch01-b10
          speaker: captain_smollett
          text: 霍金斯，拿些东西吃，带回岗位上。快一点，小伙子，这场仗打完前，你会需要这顿饭。亨特，给每个人倒一份白兰地。
        - id: ch01-b11
          speaker: narrator
          text: 我们忙着吃东西、分白兰地，船长也趁这段工夫在心里想好了整个防守计划。
        - id: ch01-b12
          speaker: captain_smollett
          text: 医生，您守门口。留在屋里，别让敌人看见，从门廊往外开枪。亨特守东面，乔伊斯守西面。特里劳尼先生，您枪法最好，您和格雷守北面的五个射击孔。那里最危险。敌人要是冲到墙下，从我们的孔里向内开枪，麻烦就大了。霍金斯，你和我的枪法都不怎么样，我们负责装弹，随时帮忙。
    - id: ch02
      title: 等待中的第一枪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 寒气早已消散。太阳越过环绕空地的树梢，把热力全压下来，一下就吸干了雾气。沙地渐渐烫得灼人，木屋圆木上的树脂也融化了。我们脱掉夹克和外套，解开衬衫领口，把袖子一直卷到肩头。每个人都守着岗位，热得发昏，也急得发昏。
        - id: ch02-b02
          speaker: narrator
          text: 整整一个钟头过去，外面仍旧毫无动静，只有我们在闷热中继续等待。
        - id: ch02-b03
          speaker: captain_smollett
          text: 这群该死的家伙，等得人像困在无风带里一样发闷。格雷，吹声口哨，给我们招点风来。
        - id: ch02-b04
          speaker: narrator
          text: 偏偏就在这一刻，袭击有了第一个动静。乔伊斯仍像平常那样客客气气，先向船长请示。
        - id: ch02-b05
          speaker: joyce
          text: 对不起，先生。我要是看见人，是不是应该开枪？
        - id: ch02-b06
          speaker: captain_smollett
          text: 我不是已经吩咐过了吗！
        - id: ch02-b07
          speaker: joyce
          text: 明白了，谢谢您，先生。
        - id: ch02-b08
          speaker: narrator
          text: 之后又静了一会儿，可这个问题让我们全都绷紧了神经。大家竖起耳朵，盯住外面。持枪的人端着武器，船长站在屋子中央，紧抿着嘴，眉头也皱了起来。
        - id: ch02-b09
          speaker: narrator
          text: 几秒以后，乔伊斯猛地举枪射击。他的枪声还未落下，围栏外便响起零散的排枪。子弹从四面八方接连飞来，枪声像一串掠过天空的大雁。好几颗子弹打在木屋上，却没有一颗穿透。等硝烟散开，围栏和树林仍然空荡而安静。树枝纹丝不动，也没有闪亮的枪管暴露敌人的位置。
        - id: ch02-b10
          speaker: captain_smollett
          text: 你打中那个人了吗？
        - id: ch02-b11
          speaker: joyce
          text: 没有，先生。我想我没有打中。
        - id: ch02-b12
          speaker: captain_smollett
          text: 能老实说出来，也算仅次于打中了。霍金斯，给他的枪装弹。医生，您那边有几个人？
        - id: ch02-b13
          speaker: doctor_livesey
          text: 我看得很清楚。这边一共开了三枪，我见到三处火光。两处靠得很近，还有一处在更西边。
        - id: ch02-b14
          speaker: captain_smollett
          text: 三个人。特里劳尼先生，您那边有多少？
        - id: ch02-b15
          speaker: narrator
          text: 北面的枪太多，很难算准。乡绅估计有七支，格雷却数出八九支。东西两边各自只有一枪。敌人显然会从北面主攻，其余三面不过是在开枪虚张声势，故意牵制我们。船长还是没有调动人手。他知道，叛徒一旦翻过围栏，就会抢占任何无人防守的射击孔，再从那里朝屋里射击。那样一来，我们便会在自己的堡垒里被当成老鼠打死。
    - id: ch03
      title: 海盗冲进木寨
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 留给我们思考的时间已经没有了。北面树林里忽然爆出一阵高喊，一小群海盗从树丛里跃出来，直奔围栏。同时，藏在林中的人又一次开枪。一颗步枪子弹呼啸着穿过门口，正打在医生的火枪上，把枪打成了碎片。
        - id: ch03-b02
          speaker: narrator
          text: 海盗像猴子一样爬过栅栏。乡绅和格雷一枪接一枪地射击，三个敌人倒了下去。一个向前栽进围栏，两个向后倒在外边。其中一个显然只是吓着了，伤得并不重。他转眼便跳起来，钻进树林不见了。
        - id: ch03-b03
          speaker: narrator
          text: 两个海盗倒地不起，一个逃回林中，另有四个已经在我们的防线内站稳了脚跟。藏在树林里的七八个人，每人显然都备了几支火枪，不断朝木屋猛烈射击，却没有打出什么结果。
        - id: ch03-b04
          speaker: narrator
          text: 翻过围栏的四个人一面奔跑，一面大喊，径直冲向木屋。林中的同伙也高声回应，替他们助威。双方匆忙开了好几枪，可开枪的人都太慌乱，看起来谁也没有打中。转眼间，那四个人便涌上土坡，杀到了我们面前。水手长乔布·安德森从中央的射击孔外探出脑袋。
        - id: ch03-b05
          speaker: job_anderson
          text: 大伙儿一起上！全都给我冲进去！
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 就在同一刻，一个海盗抓住亨特的枪口，从他手中夺走火枪，又隔着射击孔狠狠打了他一下。可怜的亨特当场昏倒。第三个海盗绕屋跑了一圈，竟没受一点伤。他突然出现在门口，挥刀砍向医生。
        - id: ch03-b07
          speaker: narrator
          text: 局势完全倒了过来。刚才还是我们躲在掩护后，射击暴露在外的敌人。现在却是我们失去遮挡，连手也还不了。
        - id: ch03-b08
          speaker: narrator
          text: 木屋里到处是硝烟，我们能暂时保住性命，反倒多亏了这层遮挡。耳边全是喊叫和混乱，手枪的火光一闪接一闪，爆响连成一片，中间还传来一声沉重的呻吟。
        - id: ch03-b09
          speaker: captain_smollett
          text: 冲出去，在空地上跟他们打！快拿弯刀！
        - id: ch03-b10
          speaker: narrator
          text: 我伸手从刀堆里抢了一把弯刀。有人同时来拿另一把，刀锋划破了我的指关节，我却几乎没感觉。我冲过门口，跑进刺眼的阳光里。身后有人紧跟着，可我不知道是谁。前面，医生正追着袭击他的海盗冲下坡去。我刚把目光投向他们，医生便压下对方的刀，一记猛劈落在那人脸上，把他仰面砍倒在地。
        - id: ch03-b11
          speaker: captain_smollett
          text: 小伙子们，绕到屋后去！快绕过去！
        - id: ch03-b12
          speaker: narrator
          text: 四周虽然一片混乱，我还是听出船长的声音变了。我下意识地服从命令，向东转去，高举弯刀绕过墙角。下一刻，安德森已经站在我面前。他怒吼着把短弯刀举过头顶，刀刃在阳光下发亮。我甚至来不及害怕。趁那一刀还悬着、没有劈下，我猛地跳向一旁。脚下的软沙却没踩稳，我顿时失去平衡，一头滚下了斜坡。
    - id: ch04
      title: 一口气之间的胜负
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我冲出门时，其他叛徒已经挤上围栏，准备把我们彻底解决。一个戴红睡帽的人到了顶上，嘴里衔着弯刀，一条腿也跨过栅栏。可一切发生得太快了。等我重新站稳，眼前几乎还是刚才那副样子。红睡帽仍然只跨过一半，另一个人也才从围栏顶端露出脑袋。就在短短一口气之间，战斗已经结束，而我们赢了。
        - id: ch04-b02
          speaker: narrator
          text: 原来格雷紧跟着我冲了出来。高大的安德森还没来得及从刚才那一刀里恢复，就被格雷砍倒。另一个海盗正从射击孔往屋里开枪，也在扣动扳机时中了弹。他痛苦地倒在地上，手里的手枪还在冒烟。第三个敌人就是我亲眼看见被医生一刀解决的那一个。四个翻进围栏的人里，只剩最后一个还活着。他把弯刀丢在战场上，吓得魂飞魄散，拼命往外爬。
        - id: ch04-b03
          speaker: doctor_livesey
          text: 从屋里向他开枪！你们几个也快回到掩护里！
        - id: ch04-b04
          speaker: narrator
          text: 混战中的人根本没有听见医生的话，屋里也没有人开枪。最后那个攻进来的海盗成功翻了出去，跟同伴一起逃进树林。仅仅三秒钟后，袭击者已经不见踪影，只留下五个倒下的人。四个在围栏里面，一个在外面。
        - id: ch04-b05
          speaker: narrator
          text: 医生、格雷和我全速跑回木屋寻找掩护。活着的海盗很快就会回到树林里，捡起刚才留在那里的火枪。敌人的射击随时都可能重新开始。
    - id: ch05
      title: 胜利的代价
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 屋里的烟这时散去了一些，我们一眼就看见这场胜利花了怎样的代价。亨特倒在自己的射击孔旁，仍然昏迷不醒。乔伊斯也倒在他的岗位上，子弹穿过了头，他再也不会起来了。屋子正中央，乡绅正在支撑受伤的船长，两个人的脸色一样苍白。
        - id: ch05-b02
          speaker: squire_trelawney
          text: 船长受伤了。
        - id: ch05-b03
          speaker: captain_smollett
          text: 那些海盗都逃走了吗？
        - id: ch05-b04
          speaker: doctor_livesey
          text: 能逃的当然全逃了。不过，有五个人永远也跑不动了。
        - id: ch05-b05
          speaker: captain_smollett
          text: 五个！那就好多了。他们损失五个，我们倒下三个，现在是我们四个人对他们九个。比开始时好多了。那时是七个人对十九个，至少我们以为是十九个，那才真叫难熬。
        - id: ch05-b06
          speaker: narrator
          text: 其实，叛徒不久便只剩八个人。乡绅在双桅帆船上打伤的那个海盗，当天晚上就伤重死了。当然，我们这一方直到后来才知道。
