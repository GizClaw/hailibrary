audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: vivid, thoughtful first-person storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    captain:
      display_name: The Captain
      tts:
        delivery: rough, commanding, and weather-beaten
        timbre: gravelly and heavy
        pace: deliberate
        pitch: low
    doctor_livesey:
      display_name: Dr. Livesey
      tts:
        delivery: crisp, civil, and unwavering
        timbre: clean and resonant
        pace: composed
        pitch: medium
    mother:
      display_name: Mrs. Hawkins
      tts:
        delivery: caring, practical, and easily flustered
        timbre: warm and gentle
        pace: brisk
        pitch: medium-high
    blind_man:
      display_name: The Blind Man
      tts:
        delivery: falsely gentle, cold, and menacing
        timbre: thin and hard-edged
