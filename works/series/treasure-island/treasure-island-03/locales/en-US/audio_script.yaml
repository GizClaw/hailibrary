        pitch: medium-low
  chapters:
    - id: ch01
      title: The Black Spot
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Around noon, I carried some cooling drinks and medicine to the captain's room. He lay much as we had left him, only propped a little higher. He looked weak, but his eyes were restless.
        - id: ch01-b02
          speaker: captain
          text: >-
            Jim, you're the only useful soul in this place. I've always treated you well. Haven't I given you a silver fourpence every month? Now look at me. I'm laid low, and everyone's deserted me. You'll bring me one little cup of rum, won't you, matey?
        - id: ch01-b03
          speaker: narrator
          text: >-
            I started to remind him what the doctor had said. The captain cut me off with a stream of curses. His voice was feeble, but he put his whole heart into them.
        - id: ch01-b04
          speaker: captain
          text: >-
            Doctors are useless swabs! What does that one know about sailors? I've been where the heat was black as pitch, where men dropped all around me from yellow fever, and earthquakes made the land roll like the sea. What does he know about places like that? Rum kept me alive. It was my food and drink, my whole life. Take it away now, and I'm an old wreck driven onto a lee shore. If I die, it'll be on you and that doctor swab!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            He cursed for a while longer. Then his anger gave way to pleading.
        - id: ch01-b06
          speaker: captain
          text: >-
            Look at my fingers, Jim. See how they twitch? I can't hold them still. I haven't had one drop all day. That doctor's a fool. Without a dram, the horrors will come. I've seen some already. Old Flint was standing in that corner, right behind you. I saw him plain as print. And if the horrors take me, remember, I've lived rough. I'll raise Cain. The doctor himself said one glass wouldn't hurt. Bring me a cup, Jim, and I'll give you a gold guinea.
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: >-
            His excitement frightened me because Father was terribly ill that day and needed quiet. Still, the doctor had said one glass would not hurt him, and I was offended that the captain tried to bribe me.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I told him I wanted none of his money except what he owed my father. I would bring one glass, and not another.
        - id: ch01-b09
          speaker: narrator
          text: >-
            When I returned, he snatched the rum and swallowed it greedily.
        - id: ch01-b10
          speaker: captain
          text: >-
            Ah, that's better. Now tell me, matey. How long did that doctor say I had to stay in this old berth?
        - id: ch01-b11
          speaker: narrator
          text: >-
            I told him at least a week.
        - id: ch01-b12
          speaker: captain
          text: >-
            Thunder! A week? I can't wait that long. They'll give me the black spot before then. Those lubbers are out there sniffing for me right now. They couldn't hold on to what they had, so they mean to steal what belongs to someone else. You call that proper sailor's conduct? I've always saved my money. Never wasted it, never lost it. I'll fool them again. I'm not afraid of them. I'll shorten sail and slip away once more, matey.
        - id: ch01-b13
          speaker: narrator
          text: >-
            As he spoke, he struggled out of bed. His hand clamped onto my shoulder so hard I nearly cried out, while his legs dragged like dead weights. His words sounded bold, but the weak voice behind them was pitiful. Once he reached the edge of the bed, he had to stop.
        - id: ch01-b14
          speaker: captain
          text: >-
            That doctor has finished me. My ears are ringing. Help me lie down.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Before I could do much, he fell back where he had been and lay silent for a time. At last, he spoke again.
        - id: ch01-b16
          speaker: captain
          text: >-
            Jim, you saw that sailor today, didn't you?
        - id: ch01-b17
          speaker: narrator
          text: >-
            I asked if he meant Black Dog.
        - id: ch01-b18
          speaker: captain
          text: >-
            Aye, Black Dog. He's a bad one, but worse men sent him. If I can't get away and they hand me the black spot, it's my old sea chest they're after. You can ride a horse, can't you? Then ride to that blasted doctor and tell him to call up everybody. Magistrates and the rest. Have them come down on the Admiral Benbow and seize every last man of Flint's old crew. I was Flint's first mate, and I'm the only one who knows the place. He told me at Savannah when he lay dying, just as I might be dying now. But don't betray me unless they give me the black spot, or you see Black Dog again, or a one-legged sailor. Watch for him most of all.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I asked him what the black spot was.
        - id: ch01-b20
          speaker: captain
          text: >-
            It's a summons, mate. If they give it to me, I'll explain. Until then, keep a sharp watch, Jim. On my honor, I'll split everything with you equally.
        - id: ch01-b21
          speaker: narrator
          text: >-
            He rambled on as his voice faded. Soon I gave him his medicine, and he swallowed it as obediently as a child.
        - id: ch01-b22
          speaker: captain
          text: >-
            If any sailor ever needed medicine, Jim, it's me.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Then he sank into a heavy sleep, almost like a faint, and I left him there.
        - id: ch01-b24
          speaker: narrator
          text: >-
            If everything else had gone well, I don't know what I would have done next. I probably would have told the doctor the whole story. I was deathly afraid the captain might regret telling me his secrets and kill me. But that evening, my poor father died very suddenly, and nothing else mattered for a while.
        - id: ch01-b25
          speaker: narrator
          text: >-
            We had our own grief to bear. Neighbors came and went, the funeral had to be arranged, and the inn still had to run. I was so busy that I barely thought about the captain, much less feared him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The next morning he came downstairs and took his meals as usual, though he ate very little. I'm afraid he drank even more rum than usual. He served himself from the bar, scowling and snorting, and no one dared stop him. The night before the funeral, he got as drunk as ever. It was dreadful to hear his ugly old sea song ringing through a house in mourning.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Even in his weakened state, we were all afraid he might kill us. The doctor had been called to a case many miles away and never came near the inn after Father's death. And the captain did not recover. He seemed to grow weaker every day.
        - id: ch01-b28
          speaker: narrator
          text: >-
            He hauled himself up and down the stairs, then from the parlor to the bar and back. Sometimes he stuck his nose outside just to smell the sea. Each trip was a struggle. He clung to the walls for support, inching along while he breathed as hard and fast as a man climbing a steep mountain. He hardly spoke to me, and I believe he had nearly forgotten what he had confessed.
        - id: ch01-b29
          speaker: narrator
          text: >-
            His temper grew wilder and, despite his weakness, more violent. When he was drunk, he had an alarming habit of drawing his cutlass and laying the bare blade on the table. Yet he paid less attention to the people around him. He seemed trapped in his own thoughts, with his mind drifting. Once, to our astonishment, he began singing a country love song in a tune unlike any we had heard from him. He must have learned it as a young man, before he went to sea.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The day after the funeral, around three in the afternoon, I stood for a moment at the inn door. The day was bitter, foggy, and cold, and my thoughts were full of Father. Then I saw someone coming slowly along the road.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The man was clearly blind. He tapped the road ahead with a stick and wore a wide green shade over his eyes and nose. He stooped as if he were old or weak. A huge, ragged sea cloak hung from his shoulders, and its hood made his shape look twisted. I had never seen anyone so dreadful. He stopped a short distance from the inn and called into the empty air in a strange singsong voice.
        - id: ch01-b32
          speaker: blind_man
          text: >-
            Would some kind friend tell a poor blind man where he is? I lost my precious eyesight defending my native England. God bless King George! What part of the country have I reached?
        - id: ch01-b33
          speaker: narrator
          text: >-
            I told the good man he was at the Admiral Benbow in Black Hill Cove.
        - id: ch01-b34
          speaker: blind_man
          text: >-
            I hear someone. A young voice. Give me your hand, my kind young friend, and lead me inside.
        - id: ch01-b35
          speaker: narrator
          text: >-
            I held out my hand. In an instant, that horrible, soft-spoken, eyeless man closed his fingers around it like a vise. The shock made me pull away, but one jerk of his arm dragged me close.
        - id: ch01-b36
          speaker: blind_man
          text: >-
            Now, boy, take me in to the captain.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I told him I truly did not dare.
        - id: ch01-b38
          speaker: blind_man
          text: >-
            Oh, is that how it is? Take me straight in, or I'll break your arm.
        - id: ch01-b39
          speaker: narrator
          text: >-
            He twisted my arm as he spoke, and I cried out.
        - id: ch01-b40
          speaker: narrator
          text: >-
            I tried to explain that I was warning him for his own sake. The captain was not the man he used to be. He sat with his cutlass drawn, and another gentleman had already—
        - id: ch01-b41
          speaker: blind_man
          text: >-
            Enough. March.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I had never heard a voice so cold, cruel, and ugly. It frightened me more than the pain did. I obeyed at once and led him through the door toward the parlor, where our sick old buccaneer sat in a rum-soaked daze.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The blind man stayed pressed against me. One iron hand held me fast, and he leaned so much of his weight on me that I could hardly bear it.
        - id: ch01-b44
          speaker: blind_man
          text: >-
            Lead me right up to him. Once he can see me, call out, “Here's a friend for you, Bill.” If you don't, you'll get another taste of this.
        - id: ch01-b45
          speaker: narrator
          text: >-
            He gave my arm another twist, and I nearly fainted. By then I feared the blind beggar so much that I forgot to fear the captain. I opened the parlor door and repeated his words in a trembling voice.
        - id: ch01-b46
          speaker: narrator
          text: >-
            The poor captain looked up. The instant he saw the man, all the rum seemed to leave him, and he stared back completely sober. His face showed something worse than fear. It looked sick with the certainty of death. He tried to rise, but I don't believe his body had enough strength left.
        - id: ch01-b47
          speaker: blind_man
          text: >-
            Stay in your seat, Bill. I may not see, but I can hear so much as a finger move. Business is business. Hold out your left hand. Boy, take Bill by the left wrist and bring his hand close to my right one.
        - id: ch01-b48
          speaker: narrator
          text: >-
            We obeyed him exactly. I watched the blind man slip something from the hollow of the hand that held his stick into the captain's palm. The captain's fingers closed around it at once.
        - id: ch01-b49
          speaker: blind_man
          text: >-
            There. That's finished.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He suddenly released me. Then, with amazing speed and accuracy, he skipped out of the parlor and into the road. I stood frozen, listening as his stick went tap, tap, tapping away into the distance.
        - id: ch01-b51
          speaker: narrator
          text: >-
            For a while, neither the captain nor I seemed able to think. At nearly the same moment, I finally let go of the wrist I was still holding, and he pulled back his hand. He stared sharply into his palm.
        - id: ch01-b52
          speaker: captain
          text: >-
            Ten o'clock! Six hours. We can beat them yet!
        - id: ch01-b53
          speaker: narrator
          text: >-
            He sprang to his feet. At once he staggered and clutched his throat. He swayed there for a moment. Then a strange sound came from him, and he crashed face-first onto the floor.
        - id: ch01-b54
          speaker: narrator
          text: >-
            I ran to him and called for Mother, but nothing could help him. A massive stroke had killed the captain.
        - id: ch01-b55
          speaker: narrator
          text: >-
            I had never liked the man, though lately I had begun to pity him. Even so, the moment I saw he was dead, I burst into tears.
        - id: ch01-b56
          speaker: narrator
          text: >-
            His was the second death I had ever known, and the grief of the first was still fresh in my heart.
