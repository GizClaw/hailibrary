audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    captain:
      display_name: 船长
      tts:
        delivery: 粗野强横，病弱时仍带着惯于发号施令的海上口气
        timbre: 沙哑厚重，像被海风和烈酒磨损过
        pace: 缓慢而逼人，激动时骤然加快
        pitch: 低
    blind_beggar:
      display_name: 瞎眼乞丐
      tts:
        delivery: 表面轻柔可怜，威胁时冷酷而不容反抗
        timbre: 干涩阴冷
        pace: 从容缓慢，发令时短促
        pitch: 中低
  chapters:
    - id: ch01
      title: 船长的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快到中午，我端着清凉饮料和药，走到船长门口。他还躺在原来的地方，只把上身垫高了一点儿。整个人又虚弱，又坐立不安。
        - id: ch01-b02
          speaker: captain
          text: 吉姆，这儿只有你还靠得住。我一直对你不错吧？每个月，我都另外给你一枚四便士银币。如今我病成这样，别人全把我扔下不管了。好伙计，替我拿一小杯朗姆酒来，行不行？
        - id: ch01-b03
          speaker: narrator
          text: 我刚说出“可是医生”，他便把话抢了过去。嗓子虽然没有力气，骂起人来却一点儿也不含糊。
        - id: ch01-b04
          speaker: captain
          text: 医生全是废物！那个医生知道什么叫跑海？我去过热得像沥青的地方，眼看同伴染上黄热病，一个个倒下。我也遇过地震，陆地颠得跟海面一样。他懂这些吗？我能活到今天，靠的就是朗姆酒。它管我的吃，管我的喝，比家人还亲。如今不给我酒，我就是一条冲上岸的破船壳。吉姆，我要是死了，就是你和那个废物医生害的！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 他骂个不停，过了一阵，口气忽然软下来，伸出不停发抖的手指给我看。
        - id: ch01-b06
          speaker: captain
          text: 你看看，我连手指都管不住了。今天一滴酒也没沾，那医生还说什么胡话！再不给我喝一口，幻觉就要全冒出来了。我已经看见老弗林特站在你背后的墙角，清清楚楚，错不了。我这辈子过的都是粗野日子，真发起疯来，可要闹得天翻地覆。医生自己说过，一杯酒伤不了我。给我拿来吧，吉姆，我赏你一枚金基尼。
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 他越说越激动，我心里也越来越不安。父亲那天病得很重，最需要清静，我实在怕船长闹起来。何况医生确实说过，一杯酒不会伤他，这话现在从船长嘴里说出来，也让我放心了一些。只是他竟想拿钱收买我，又让我很不痛快。
        - id: ch01-b08
          speaker: narrator
          text: 我告诉他，我不要他的赏钱，只要他付清欠父亲的账。朗姆酒可以给一杯，不能再多。他一拿到酒，马上抢过去，一口喝干了。
        - id: ch01-b09
          speaker: captain
          text: 对，这下好多了。伙计，那个医生到底要我在这张破床上躺多久？
        - id: ch01-b10
          speaker: narrator
          text: 我回答说，至少得躺一个星期。
        - id: ch01-b11
          speaker: captain
          text: 见鬼，一个星期！那可不行。没等我下床，他们就会把黑券送来了。那群旱鸭子正在四处探我的消息。他们自己守不住东西，就想来抢我的，这也叫水手吗？我的钱从来没白白糟蹋过，也没有丢过。这一回，我照样能甩掉他们。我不怕。只要再松一层帆，我还会让他们追不上！
        - id: ch01-b12
          speaker: narrator
          text: 他说得豪气，身子却连坐起来都难。他死死攥住我的肩膀，疼得我险些喊出来。两条腿沉甸甸地拖着，像是早已没了知觉。这样威风的话，从那副虚弱嗓子里出来，只让人觉得凄凉。他终于挪到床边坐好，便再也撑不住了。
        - id: ch01-b13
          speaker: captain
          text: 那医生真把我害惨了。耳朵一直在响。吉姆，快扶我躺下。
        - id: ch01-b14
          speaker: narrator
          text: 我还没扶稳，他已经倒回床上，静静躺了好一会儿。后来，他又问我，今天是不是见过那个跑海的人。我问他说的是不是黑狗。
        - id: ch01-b15
          speaker: captain
          text: 对，就是黑狗。他是个恶棍，可派他来的人更坏。听仔细了。要是我怎么也逃不掉，他们又把黑券给了我，那群人就是冲着我的老海箱来的。你会骑马吧？当然会。到时候立刻上马，去找那个该死的医生。叫他吹哨召集所有人，把地方官之类的人全叫来，再到本博将军客店登船抓人。老弗林特手下还活着的船员，不管老的少的，一个也别漏。
        - id: ch01-b16
          speaker: captain
          text: 我从前是弗林特的大副，只有我知道那个地方在哪儿。他临死时在萨凡纳把秘密交给了我，就像我现在也快死了一样。不过你不能走漏风声。除非黑券真的送来，或者你再见到黑狗，还有那个独腿水手。吉姆，独腿的那个尤其要当心。
        - id: ch01-b17
          speaker: narrator
          text: 我问他，黑券究竟是什么。
        - id: ch01-b18
          speaker: captain
          text: 那是召集令，伙计。他们真送来，我自然会告诉你。你只管留心四周。以我的名誉发誓，事情成了，我跟你一人一半。
        - id: ch01-b19
          speaker: narrator
          text: 他又颠三倒四地说了一阵，声音越来越轻。我把药给他，他倒像个听话的孩子，老老实实咽了下去，还说，世上要是有哪个水手该吃药，那就是他。没多久，他终于陷入沉睡，那样子几乎像是昏了过去。我留他独自躺在那里，悄悄离开房间。
    - id: ch02
      title: 父亲去世以后
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要是后来没有出事，我也不知道自己会怎么办。我多半会把一切告诉医生，因为我怕船长反悔，更怕他为了守住秘密而杀了我。可就在那天傍晚，我可怜的父亲突然去世了。先前那些事，一下都被抛到了脑后。
        - id: ch02-b02
          speaker: narrator
          text: 我们沉浸在悲痛里。邻居们接连来访，丧事等着安排，客店的生意又不能停。母亲和我忙得喘不过气，几乎没有时间想起船长，更顾不上怕他。
        - id: ch02-b03
          speaker: narrator
          text: 第二天早晨，船长果然下了楼。他照常吃饭，却没吃多少。朗姆酒倒喝得比平时还多。他自己走进酒吧间取酒，瞪着眼睛，鼻子里呼呼喷气，谁也不敢拦他。
        - id: ch02-b04
          speaker: narrator
          text: 葬礼前一晚，他又醉得不成样子。这是正在守丧的人家，他却扯开嗓门，唱那支难听的老船歌，实在叫人震惊，听着更是心里发冷。他身体已经很弱，我们还是怕他怕得要命。偏偏医生被几英里外的一位病人叫走，父亲去世以后，再也没来过客店。
        - id: ch02-b05
          speaker: narrator
          text: 船长的身体没有好转，反而越来越糟。他费力地爬上爬下，又从客厅挪到酒吧间，再从酒吧间挪回来。有时，他会把头探出门外，闻闻海上的气味。每走一步都得扶墙，喘得又急又重，像在攀一座陡山。
        - id: ch02-b06
          speaker: narrator
          text: 他没再特意找我说话，大概早已把泄露的秘密忘了。可他的脾气比从前更反复。要不是身体太弱，只怕发作起来比过去还凶。现在他一喝醉，常常突然拔出弯刀，把明晃晃的刀摆在面前的桌上。话虽如此，他反倒不太理睬身边的人了，只顾陷在自己的心事里，神志也常常恍惚。
        - id: ch02-b07
          speaker: narrator
          text: 有一回，他忽然换了调子，唱起一首乡间情歌。那首歌大概是他年轻时学的，那时他还没有出海。我们听见以后，全都惊讶得说不出话。
    - id: ch03
      title: 可怕的瞎眼人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 葬礼过去一天，下午三点左右，天气冷得刺骨，雾气又浓，地上结着霜。我站在门口，心里还想着父亲。就在这时，一个人顺着大路慢慢走近。
        - id: ch03-b02
          speaker: narrator
          text: 他用手杖一下下敲探着前方，显然双眼已瞎。眼睛和鼻子上方，罩着一大片绿眼罩。他弓着背，不知道是因为年老，还是因为身体太弱。身上那件水手斗篷又大又旧，已经破烂不堪。兜帽从头顶罩下来，让他整个人看上去都变了形。我这一辈子，从没见过这么可怕的模样。
        - id: ch03-b03
          speaker: narrator
          text: 他在客店外不远处停住，抬高声音，对着面前的空气唱歌似的开了口。
        - id: ch03-b04
          speaker: blind_beggar
          text: 哪位好心人愿意告诉这个可怜的瞎子，他现在到了什么地方？我为了保卫祖国英格兰，蒙上天恩典，失去了宝贵的双眼。愿上帝保佑乔治国王！
        - id: ch03-b05
          speaker: narrator
          text: 我告诉他，这里是黑山湾的本博将军客店。
        - id: ch03-b06
          speaker: blind_beggar
          text: 我听见一个年轻人的声音。好心的小朋友，你能把手给我，领我进去吗？
        - id: ch03-b07
          speaker: narrator
          text: 我把手伸过去。他说话轻声细气，脸上却没有眼睛，已经够吓人的了。没想到，他一下便夹紧我的手，力气像一把老虎钳。我吃了一惊，想把手抽回来，他只收了一下胳膊，就把我拽到身边。
        - id: ch03-b08
          speaker: blind_beggar
          text: 好了，小子。带我进去见船长。
        - id: ch03-b09
          speaker: narrator
          text: 我老实告诉他，我不敢。
        - id: ch03-b10
          speaker: blind_beggar
          text: 原来是这样。马上领我进去，不然我就拧断你的胳膊。
        - id: ch03-b11
          speaker: narrator
          text: 他边说边狠狠一扭，疼得我叫出了声。我急忙解释，我其实是替他担心。船长已经不像从前了，现在总拔着弯刀坐在那里。我才提到还有另一位先生，他便冷冷截住了我。
        - id: ch03-b12
          speaker: blind_beggar
          text: 别说了。往前走。
        - id: ch03-b13
          speaker: narrator
          text: 我从没听过这么残忍、这么冰冷的声音。它比胳膊上的疼痛更叫我害怕。我不敢再反抗，只得领他走进客店，直奔客厅。船长就在里面，喝得昏昏沉沉。
        - id: ch03-b14
          speaker: narrator
          text: 瞎子紧贴在我身旁，一只铁钳似的手仍攥着我，身子也压了过来，重得我几乎撑不住。他命令我一直走到船长面前，等船长看见我们，就喊“比尔，有朋友来看你了”。我要是不照办，他就再拧我的胳膊。说着，他果然狠狠扭了一下，差点把我疼昏过去。
        - id: ch03-b15
          speaker: narrator
          text: 这个乞丐把我吓得魂都没了。我甚至忘记自己原本也怕船长。客厅门一打开，我便用发抖的声音喊，比尔，有朋友来看你了。
        - id: ch03-b16
          speaker: narrator
          text: 船长抬眼一看，酒意顿时全消了。他瞪着来人，清醒得不能再清醒。那张脸与其说是害怕，不如说像个快死的人。他想站起来，身体里却已经没有那么多力气。
    - id: ch04
      title: 黑券送到
      blocks:
        - id: ch04-b01
          speaker: blind_beggar
          text: 比尔，老老实实坐着。我看不见，可你哪怕动一根手指，我都听得见。公事就是公事。把左手伸出来。小子，抓住他的左手腕，把那只手送到我的右手边。
        - id: ch04-b02
          speaker: narrator
          text: 我们完全照他说的做了。我看见他从握手杖的那只手里取出一样东西，塞进船长掌心。船长马上把手握紧。
        - id: ch04-b03
          speaker: blind_beggar
          text: 好了，事情办完了。
        - id: ch04-b04
          speaker: narrator
          text: 话音一落，他突然放开我。这个瞎子动作准得难以相信，身手也灵活得惊人，一下就跳出客厅，接着又跃上大路。我还僵在原地，一动也没有动，只听他的手杖嗒、嗒、嗒地敲着路面，声音一路远去。
        - id: ch04-b05
          speaker: narrator
          text: 我跟船长都愣在原地，过了好一会儿，才几乎同时回过神来。我这才发现，自己居然还一直握着他的手腕，于是赶紧放开。船长也把左手缩回去，立刻摊开掌心，急急地看向瞎子刚塞给他的东西。
        - id: ch04-b06
          speaker: captain
          text: 十点钟！还有六个钟头。我们照样斗得过他们！
        - id: ch04-b07
          speaker: narrator
          text: 他猛地站了起来。可才一起身，整个人就晃了一下。他一只手紧紧抓住喉咙，摇摇摆摆站了片刻，嘴里忽然发出一声怪响。接着，他从头到脚直挺挺倒下，脸朝下扑在地板上。
        - id: ch04-b08
          speaker: narrator
          text: 我一边大声喊母亲，一边冲到他身旁，可做什么都来不及了。船长中了猛烈的中风，当场便死了。
        - id: ch04-b09
          speaker: narrator
          text: 说来也奇怪。我从来不喜欢这个人，最近倒有些可怜他。如今亲眼看见他死了，我忽然放声哭起来。这是我亲眼见过的第二次死亡，而头一次死亡留下的悲痛，在我心里还那么新。
