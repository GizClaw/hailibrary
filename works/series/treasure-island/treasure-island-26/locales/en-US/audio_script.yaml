audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    israel_hands:
      display_name: Israel Hands
      tts:
        delivery: shrewd, seasoned, and admiring
        timbre: coarse and weathered
        pace: steady
        pitch: low
  chapters:
    - id: ch01
      title: "XXVI Israel Hands"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The wind shifted west, just as we needed it to. That made the run from the island's northeast corner to the mouth of North Inlet much easier. But we could not drop anchor, and we dared not beach the schooner until the tide rose higher. So we had time to spare. Hands showed me how to stop the ship and hold her in place. It took me several tries, but at last I managed it. Then we sat without speaking and ate another meal.
        - id: ch01-b02
          speaker: israel_hands
          text: >-
            Captain, there's my old shipmate O'Brien. Maybe you ought to toss him overboard. I'm not usually fussy, and I don't blame myself for finishing him. Still, you can't say he's making the ship look any better.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I'm not strong enough, and I don't care for the work. He can stay where he is.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Hands blinked at me, still wearing that smile that made me uneasy.
        - id: ch01-b05
          speaker: israel_hands
          text: >-
            This Hispaniola is an unlucky ship, Jim. Think how many men have died aboard her since you and me first sailed from Bristol. I've never seen luck this foul. Take O'Brien there. He's dead, isn't he? Now, I'm no educated man, and you're a boy who can read and do sums. Tell me straight. Once a man dies, is that the end of him? Or does he come alive again?
        - id: ch01-b06
          speaker: narrator
          text: >-
            You can kill a man's body, Mr. Hands, but you can't kill his spirit. You must know that. O'Brien is in another world now, and he may be watching us.
        - id: ch01-b07
          speaker: israel_hands
          text: >-
            Ah. That's a shame. Makes killing people sound like wasted effort. Still, from what I've seen, spirits don't amount to much. I'll take my chances with them. Now, since you've answered me honest, I'd be obliged if you'd go down to the cabin and fetch me a... a... blast it, I can't think of the word. Bring me a bottle of wine, Jim. This brandy's too strong for my head.
        - id: ch01-b08
          speaker: narrator
          text: >-
            His hesitation did not sound natural. And I did not believe for a moment that he wanted wine instead of brandy. It was all an excuse to get me off the deck. I could see that much, though I had no idea what he planned to do. He would not meet my eyes. He looked up, down, and side to side, now at the sky and now at dead O'Brien. All the while, he smiled and slipped his tongue between his lips. He looked so guilty and awkward that even a child would have known he meant to trick me.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I answered at once. I had the advantage now. Hands was so dull-witted that I knew I could hide my suspicions from him.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Wine? That's a much better choice. Do you want red or white?
        - id: ch01-b11
          speaker: israel_hands
          text: >-
            Makes no blessed difference to me, shipmate. If it's strong and there's plenty of it, what else matters?
        - id: ch01-b12
          speaker: narrator
          text: >-
            All right, Mr. Hands. I'll bring you some port. It may take me a while to find it.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I clattered down the companion stairs as loudly as I could. Then I slipped off my shoes and ran quietly along the slatted passage. I climbed the forecastle ladder and peered out through the forward companionway. Hands would never expect me to appear there, but I was careful all the same. What I saw proved my worst suspicions true.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He had pushed himself onto his hands and knees. Moving clearly hurt his leg, and I heard him choke back a groan. Even so, he dragged himself across the deck at a lively pace. Within half a minute, he reached the port scuppers. From inside a coil of rope, he pulled a long knife, almost a short dagger, stained with blood all the way to the handle. He thrust out his lower jaw and studied it. Then he tested the point against his hand, slipped it quickly inside his jacket, and hauled himself back to his old place by the bulwark.
        - id: ch01-b15
          speaker: narrator
          text: >-
            That told me everything I needed to know. Israel could move, and now he had a weapon. If he had gone to such trouble to send me away, then I was meant to be his victim. I could not guess what he planned after that. Perhaps he would crawl across the whole island from North Inlet to the pirates' camp in the marshes. Perhaps he would fire the great cannon and trust that his own comrades would reach the ship before any of mine did. There was no way for me to know.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Still, I knew I could trust him about one thing. We both wanted the same end for the schooner. She had to be beached safely in a sheltered place, where she could later be floated off with as little work and danger as possible. Until that was done, I felt certain he would spare my life.
        - id: ch01-b17
          speaker: narrator
          text: >-
            While I worked all this out, I kept moving. I stole back to the cabin, put my shoes on again, and grabbed the first bottle of wine I found. With my excuse in hand, I returned to the deck.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Hands lay in the same crumpled heap where I had left him. His eyelids drooped as if even the light was too much for him. When I came up, he raised his head. He knocked the neck off the bottle with the ease of long practice, took a deep drink, and gave his favorite toast.
        - id: ch01-b19
          speaker: israel_hands
          text: "Here's luck!"
        - id: ch01-b20
          speaker: narrator
          text: >-
            He rested for a while. Then he drew out a stick of tobacco and asked me to cut him a piece.
        - id: ch01-b21
          speaker: israel_hands
          text: >-
            Cut me a chunk, will you? I don't have a knife, and I barely have the strength anyway. Ah, Jim, Jim, I've missed my last turn. Cut me one final chew, lad. I'm bound for the grave now, sure enough.
        - id: ch01-b22
          speaker: narrator
          text: >-
            I'll cut your tobacco. But if I were you, and I believed I was dying, I'd say my prayers like a Christian.
        - id: ch01-b23
          speaker: israel_hands
          text: >-
            Why? You tell me why.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Why? A moment ago you were asking me about the dead. You betrayed the people who trusted you. Your life has been full of sin, lies, and blood. The man you killed is lying at your feet right now, and you ask me why? You should pray for God's mercy, Mr. Hands. That's why.
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: >-
            I spoke hotly because I was thinking of the bloody dagger hidden inside his coat, the one he meant to kill me with. Hands took another long drink of wine. Then he answered with a solemnity I had never heard from him before.
        - id: ch01-b26
          speaker: israel_hands
          text: >-
            I've sailed the seas for thirty years. I've seen good and bad, better and worse. I've known fair weather and foul, empty food stores, knife fights, and everything else. And I'll tell you this. I've never seen goodness do a man any good. Give me the fellow who strikes first. Dead men don't bite. Those are my views. Amen, and so be it.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Then his tone changed without warning.
        - id: ch01-b28
          speaker: israel_hands
          text: >-
            Now listen. We've wasted enough time on this nonsense. The tide's high enough. Follow my orders, Captain Hawkins, and we'll sail straight in and finish the job.
        - id: ch01-b29
          speaker: narrator
          text: >-
            We had less than two miles left, but the sailing would be difficult. The entrance to the northern anchorage was narrow and shallow. It also ran east to west, so the schooner had to be handled with great care. I followed orders quickly, and Hands proved an excellent pilot. We tacked one way and then the other, slipping past the banks so neatly and surely that it was a pleasure to watch. The schooner seemed to dodge every danger by inches.
        - id: ch01-b30
          speaker: narrator
          text: >-
            As soon as we passed between the headlands, the land seemed to close around us. Thick woods covered the shores of North Inlet, just as they did around the anchorage in the south. The wooded banks pressed close on either side. But this inlet was longer and narrower. It looked like the mouth of a river, which was exactly what it was.
        - id: ch01-b31
          speaker: narrator
          text: >-
            At the southern end, directly ahead, stood the wreck of a ship in the last stages of decay. It had once been a great three-masted vessel. Now the weather had covered it with heavy curtains of dripping seaweed. Bushes had taken root on its deck and were blooming thick with flowers. The wreck was a sad sight, but it proved the water there was calm.
        - id: ch01-b32
          speaker: israel_hands
          text: >-
            Look over there. That's a fine little place to beach her. Flat sand, not a breath of wind, trees all around, and flowers growing on that old ship like a garden.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Once she's beached, how will we ever get her off again?
        - id: ch01-b34
          speaker: israel_hands
          text: >-
            Easy enough. At low tide, carry a line ashore on the far side and wrap it around one of those big pine trees. Bring it back aboard and wind it around the capstan. When high tide comes, everybody hauls on the line. She'll slide free as sweet as you please.
        - id: ch01-b35
          speaker: israel_hands
          text: >-
            Now stand ready, boy. We're close, and she's moving too fast. A little starboard. That's it. Hold steady. Starboard again. Now a little to port. Steady. Steady!
        - id: ch01-b36
          speaker: narrator
          text: >-
            I obeyed every order, hardly daring to breathe.
        - id: ch01-b37
          speaker: israel_hands
          text: >-
            Now, matey, turn her into the wind!
        - id: ch01-b38
          speaker: narrator
          text: >-
            I threw the helm hard over. The Hispaniola swung quickly around and drove bow-first toward the low, wooded shore.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Those last maneuvers had taken my attention away from Hands. Even then, I was so eager to feel the ship touch bottom that I forgot the danger hanging over me. I leaned across the starboard bulwark and watched the ripples spreading out before the bow.
        - id: ch01-b40
          speaker: narrator
          text: >-
            I might have died without putting up a fight if a sudden warning had not made me turn. Maybe I heard a board creak. Maybe I caught his shadow moving from the corner of my eye. Or perhaps some catlike instinct saved me. Whatever it was, I looked back. Hands was already halfway across the deck, coming straight at me with the dagger in his right hand.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The moment our eyes met, we both shouted. Mine was a high cry of terror. His was the furious roar of a charging brute. He hurled himself forward, and I sprang sideways toward the bow. As I jumped, I let go of the tiller. It snapped hard to leeward and struck Hands across the chest, stopping him for one precious moment. I believe that blow saved my life.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Before he recovered, I escaped the corner where he had trapped me. Now I had the whole deck to dodge across. Just ahead of the mainmast, I stopped and pulled a pistol from my pocket. Hands had already turned and was rushing at me again. I aimed carefully and pulled the trigger.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The hammer fell, but there was no flash and no shot. Seawater had ruined the priming. I cursed my own carelessness. Why hadn't I cleaned and reloaded my only weapons long before? If I had, I would not have been helpless now, nothing but a sheep running from a butcher.
        - id: ch01-b44
          speaker: narrator
          text: >-
            For a wounded man, Hands moved amazingly fast. His gray hair tumbled over his face, and the effort and fury had turned him as red as a signal flag. I had no time to test my second pistol, and I felt sure it would fail too. One thing was clear. If I simply backed away, he would soon trap me at the bow, just as he had nearly trapped me at the stern. Then the bloodstained blade in his hand would be the last thing I ever felt.
        - id: ch01-b45
          speaker: narrator
          text: >-
            I put both palms against the thick mainmast and waited with every nerve stretched tight. Hands saw that I meant to dodge around it, so he stopped too. For a few moments, he feinted one way and I shifted the other. It was the sort of game I had often played among the rocks at Black Hill Cove. But never before had my heart pounded so wildly while I played it.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Even so, it was still a boy's game. I thought I could hold my own against an older sailor with a wounded thigh. My courage began to rise. Quick thoughts flashed through my mind about how our fight might end. I could keep him circling that mast for a long time, I decided. But I could see no way to escape him in the end.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Then the Hispaniola struck. She shuddered, ground against the sand for a moment, and suddenly tipped to port as sharply as if she had been hit. The deck tilted to an angle of forty-five degrees. A barrelful of water burst through the scupper holes and pooled between the deck and the bulwark.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Hands and I both lost our footing in the same instant. We rolled together into the scuppers, and the dead man in the red cap tumbled stiffly after us with his arms still spread. We landed so close that my head struck the coxswain's foot with a crack hard enough to rattle my teeth.
        - id: ch01-b49
          speaker: narrator
          text: >-
            In spite of that blow, I got up first. Hands had become tangled with O'Brien's body. With the deck tilted so steeply, there was no room left to run. I needed another escape at once, because my enemy was almost close enough to touch me.
        - id: ch01-b50
          speaker: narrator
          text: >-
            In an instant, I sprang into the rigging of the mizzenmast. Hand over hand, I raced upward and did not breathe again until I sat safely on the cross-trees. Moving so quickly had saved me. The dagger struck less than half a foot below me as I climbed. Israel Hands stood beneath me with his mouth open and his face turned upward. He looked frozen with surprise and disappointment.
        - id: ch01-b51
          speaker: narrator
          text: >-
            At last I had a moment to spare. I quickly replaced the wet priming in one pistol. When that weapon was ready, I made doubly sure by unloading the other and charging it again from the beginning.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The sight of me reloading shook Hands badly. He began to understand that his luck was turning. After hesitating, he pulled himself heavily into the shrouds. With the dagger clenched between his teeth, he started climbing toward me.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Dragging his wounded leg upward cost him a great deal of time and many groans. By the time he had climbed a third of the way, I had calmly finished my work. I held a loaded pistol in each hand and called down to him.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Take one more step, Mr. Hands, and I'll blow your brains out. Dead men don't bite, you know.
        - id: ch01-b55
          speaker: narrator
          text: >-
            I gave a little laugh as I threw his own words back at him. Hands stopped at once. His face worked and twisted while he tried to think. He took so long over it that, feeling safe above him, I laughed out loud. At last he swallowed once or twice and spoke. He had to take the dagger from his mouth, but the rest of his body stayed perfectly still.
        - id: ch01-b56
          speaker: israel_hands
          text: >-
            Jim, you and me have gotten ourselves tangled up. Seems we'll have to make terms. I would've caught you if the ship hadn't lurched, but luck's never with me. So I suppose I'll have to surrender. That's a hard thing for a master sailor to do when he's facing a young cabin boy like you, Jim.
        - id: ch01-b57
          speaker: narrator
          text: >-
            I drank in every word. I stood there smiling, as proud as a rooster on a wall. Then, in one quick motion, his right hand flew back over his shoulder.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Something sang through the air like an arrow. A blow hit me, followed by a sharp burst of pain. The dagger had pinned my shoulder to the mast. The pain and shock were so terrible that I cannot say I chose to act. I know I did not aim. Both pistols fired, and both flew from my hands.
        - id: ch01-b59
          speaker: narrator
          text: >-
            They did not fall alone. With a choking cry, Israel Hands let go of the rigging and plunged headfirst into the water.
