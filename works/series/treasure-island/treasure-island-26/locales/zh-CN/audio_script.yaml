audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    israel_hands:
      display_name: 伊斯莱尔·汉兹
      tts:
        delivery: 粗鲁虚弱，话里藏着老水手的狡猾与算计
        timbre: 沙哑低沉的老年男声
        pace: 缓慢吃力，恢复体力后稍显有力
        pitch: 低
  chapters:
    - id: ch01
      title: 舵手的诡计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 风向转到西边，正合我们的心意。从岛屿东北角驶向北湾入口，顺当多了。可船上没有锚，潮水又不够高，我们还不敢让船搁浅，只能在海上消磨时间。汉兹教我怎样让船停住不走。我试了许多回，总算成功。随后，我们默默坐着，又吃了一顿。
        - id: ch01-b02
          speaker: israel_hands
          text: 船长，你瞧，我的老伙计奥布赖恩还躺在这儿呢。要不把他扔进海里吧？我平常不挑剔，也不怪自己结果了他，可他摆在这里，实在不好看，是不是？
        - id: ch01-b03
          speaker: narrator
          text: 我没那么大力气，也不愿干这种事。他要躺，就让他躺着。
        - id: ch01-b04
          speaker: israel_hands
          text: 吉姆，西斯帕尼奥拉号真是艘倒霉船。打从咱们在布里斯托尔上船，已经死了多少可怜水手！我就没见过这么坏的运气。奥布赖恩已经死了，对吧？我不识字，你却会读会算。你说，人死了是不是永远死透了？还会不会再活过来？
        - id: ch01-b05
          speaker: narrator
          text: 汉兹先生，人的身体可以被杀死，灵魂却不会死，这你早该知道。奥布赖恩已经到了另一个世界，说不定正看着我们。
        - id: ch01-b06
          speaker: israel_hands
          text: 啊，那可糟了。照这么说，杀人岂不是白费力气？不过依我看，灵魂也没多大本事。吉姆，我就跟它们赌一把吧。还有，麻烦你到舱里给我拿一瓶……该死，那名字怎么偏想不起来？拿瓶葡萄酒来。这白兰地太冲脑袋。
        - id: ch01-b07
          speaker: narrator
          text: 他吞吞吐吐，很不自然。我也绝不相信他会嫌白兰地太烈。这全是借口，他只想支开我。可他想做什么，我猜不出来。他的眼睛始终不肯和我相对，只管忽上忽下地乱转，不是望天，就是飞快瞥一眼死去的奥布赖恩。他脸上一直挂着笑，还心虚又尴尬地不住吐舌头，连孩子都看得出他藏着诡计。我却立刻答应了。这个人蠢得透顶，我有把握把疑心藏到最后。
        - id: ch01-b08
          speaker: narrator
          text: 葡萄酒当然好。你要红的还是白的？
        - id: ch01-b09
          speaker: israel_hands
          text: 伙计，对我都一样。只要够烈，给得够多，什么酒又有什么分别？
        - id: ch01-b10
          speaker: narrator
          text: 那我给你找波特酒。不过，得翻一阵才能找到。
        - id: ch01-b11
          speaker: narrator
          text: 我急匆匆跑下升降口，故意闹出很大的响动。到了下面，我立刻脱掉鞋，悄无声息地跑过铺着格栅的通道，再爬上艏楼的梯子，由前升降口探出头来。汉兹绝不会想到我从这里出现，可我还是处处小心。最坏的猜测果然成了真。
        - id: ch01-b12
          speaker: narrator
          text: 汉兹已经离开原来的位置，手脚着地趴在甲板上。每挪一下，那条伤腿都疼得厉害，我还听见他强忍住一声呻吟。可他拖着身子横过整片甲板，速度仍然快得出奇。不到半分钟，他便到了左舷排水口，从一盘绳索中抽出一把长刀，说是短剑更合适。刀上的血迹一直染到刀柄。他伸出下巴，拿着刀仔细端详了一阵，又用手试了试锋利的刀尖，随后赶紧把刀藏进上衣怀里，拖着身子爬回舷墙边原来的地方。
        - id: ch01-b13
          speaker: narrator
          text: 这就够了。伊斯莱尔不但能四处活动，现在还有了武器。他费尽心机把我支走，显然是想拿我开刀。得手以后，他也许会从北湾爬过整座岛，回到沼泽中的营地，也许会开动“长汤姆”，盼着同伙抢先赶来救他。究竟是哪一样，我无从知道。
        - id: ch01-b14
          speaker: narrator
          text: 可在处置帆船这件事上，我还能信他，因为我们的利害完全相同。我们都要让船安全搁浅在有遮蔽的地方，将来需要时，又能少费力、少冒险地弄回水里。在船停妥以前，我相信他一定会留下我的命。我脑子里不停盘算，手脚也没闲着。我先悄悄溜回船舱，重新穿好鞋，又随手拿上一瓶葡萄酒。有了这个借口，我便若无其事地再次回到甲板。
    - id: ch02
      title: 死人不会咬人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 汉兹还是我离开时那副模样，整个人软软缩成一团，眼皮低垂，仿佛虚弱得连光也受不了。看见我回来，他才抬起头，熟练地敲掉瓶颈，显然这种事早已做惯。他狠狠灌下一大口，还照旧说了句“祝咱们好运”。随后，他安静躺了一会儿，又掏出一条板烟，请我替他切一块嚼烟。
        - id: ch02-b02
          speaker: israel_hands
          text: 替我割一块吧。我没有刀，就算有刀，也没力气用了。唉，吉姆，我这回怕是抢风转不过去啦。这大概是我最后一块嚼烟。孩子，我就要回那个永远的老家了，错不了。
        - id: ch02-b03
          speaker: narrator
          text: 我可以替你切。不过你要是真觉得自己快不行了，就该像个基督徒一样祷告。
        - id: ch02-b04
          speaker: israel_hands
          text: 为什么？你倒说说，为什么？
        - id: ch02-b05
          speaker: narrator
          text: 你刚才还问我死人会怎样。你辜负别人，一辈子都活在罪恶、谎言和鲜血里。现在，被你杀死的人就躺在脚边，你竟还问为什么！汉兹先生，你该求上帝怜悯你，这就是原因。
        - id: ch02-b06
          speaker: narrator
          text: 我说得有些激动。因为我想起他藏在上衣怀里的那把染血短剑，也想起他怀着恶念，正盘算着用它结束我的性命。汉兹却只是仰头痛饮一大口葡萄酒，随后忽然换上一种格外郑重、平常绝不会有的口吻。
        - id: ch02-b07
          speaker: israel_hands
          text: 我在海上过了三十年。好事坏事，顺境逆境，晴天风暴，我全见过。粮食吃光过，刀子动过，还有什么没经历？可我从没见过做好事能带来什么好处。我就喜欢先下手的人。死人不会咬人，这就是我的道理。阿门，就这么着。好了，蠢话也说够了。潮水已经涨得差不多。霍金斯船长，你照我的话做，咱们把船开进去，赶紧了事。
        - id: ch02-b08
          speaker: narrator
          text: 算起来，航程还不到两英里，却很难走。北面锚地的入口不但窄而浅，还是东西横向的，帆船必须转得恰到好处，才能开进去。我想自己是个听令迅速的好副手，汉兹领航也确实高明。我们一次又一次换舷转向，在曲折的水道里左绕右闪，几乎贴着浅滩驶过。船始终走得准确利落，那份从容和漂亮，叫人看着都觉得痛快。
        - id: ch02-b09
          speaker: narrator
          text: 船刚穿过入口两侧的岬角，陆地便从四面围拢过来。北湾两岸的树林同南边锚地一样茂密，可这片水面更长也更窄，看起来正像它本来的模样，一道河口。就在正前方的南端，有一条破船，已经残败到了最后关头。它从前是艘高大的三桅船，却在风吹雨打里搁了太久。船身挂满一大片一大片湿淋淋的海草，岸边的灌木甚至在甲板上扎下根，如今花开得正密。那景象很凄凉，却也清楚地证明这里风平浪静。
        - id: ch02-b10
          speaker: israel_hands
          text: 看那边！那块地方最适合让船搁浅。细沙滩又平又静，连猫爪那么点儿浪都没有。四面全是树，老船上的花还开得像花园呢。
        - id: ch02-b11
          speaker: narrator
          text: 可船搁浅以后，咱们怎么让它重新下水？
        - id: ch02-b12
          speaker: israel_hands
          text: 很容易。退潮时把绳子送到对岸，绕住一棵大松树，再带回船上绕过绞盘，等着涨潮。潮水一高，大家一起拉，船自然顺顺当当地下水。孩子，准备好！快到了，船走得太快。往右一点，对，稳住。再往右……往左一点……稳住，稳住！
        - id: ch02-b13
          speaker: narrator
          text: 我屏住呼吸，照着每一道命令操船。
        - id: ch02-b14
          speaker: israel_hands
          text: 就是现在，伙计，迎风转舵！
        - id: ch02-b15
          speaker: narrator
          text: 汉兹一道道发令，我屏住呼吸，全都照办。听见最后这声喊，我猛地推满舵柄。西斯帕尼奥拉号立刻飞快转身，整个船身迅速旋了过去，船头正对着那片低矮而葱郁的岸边，直冲过去。
    - id: ch03
      title: 甲板上的追杀
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最后这番操船太叫人兴奋，我不知不觉放松了对汉兹的提防。船还没触地，我就探着身子伏在右舷舷墙上，只顾看船头的波纹一圈圈向外散开，连悬在头顶的危险都忘了。要不是心里突然生出一阵不安，我恐怕连挣扎一下都没有便送了命。我立刻回头。也许是听见木板轻响，也许是眼角扫见影子，也许只是猫一样的直觉。汉兹已经走完一半路，右手握着短剑，正朝我扑来。
        - id: ch03-b02
          speaker: narrator
          text: 我们一对上目光，都叫出了声。我吓得尖声惊叫，他却像冲来打人的恶霸，发出狂怒的吼声。就在同一刻，他猛扑向前，我侧身跃向船头。这一跳让我松开舵柄，舵柄立刻猛弹向下风，正好横撞在汉兹胸口，把他硬生生挡住了片刻。我想，就是这一下救了我的命。
        - id: ch03-b03
          speaker: narrator
          text: 趁他还没缓过来，我逃出船尾那个死角。眼前整片甲板都可以让我周旋。我在主桅前停下，从衣袋里掏出一支手枪。汉兹已经转身，又朝我直冲过来。我仍旧稳稳瞄准，扣下扳机。枪锤落了下去，却没有火光，也没有声音。点火药早让海水泡坏了。我狠狠责怪自己的疏忽。为什么不早把仅有的两支枪换药装弹？要是准备妥当，我怎么会像只羊，只能躲着屠夫逃命？
        - id: ch03-b04
          speaker: narrator
          text: 汉兹明明腿上有伤，跑得却快得惊人。花白头发不停翻动，披散在他的脸上。那张脸因为拼命追赶和满腔暴怒，红得像一面鲜红的船旗。我来不及试另一支枪，其实也不想试，因为我断定它同样没用。有件事再清楚不过，我不能只顾着一步步后退，不然很快会被逼进船头的死角，就像刚才在船尾险些被困住一样。一旦被他堵在那里，那把染血的短剑就会有九到十英寸刺进我身体，成为我在人世间最后的感受。
        - id: ch03-b05
          speaker: narrator
          text: 我把双掌抵在粗壮的主桅上，全身每一根神经都绷紧了。汉兹看出我要绕着桅杆躲，也停了下来。他虚晃一下，我便朝相反方向挪动。这种游戏，我小时候常在黑山湾的礁石间玩，可我的心从没跳得这样凶。说到底，这仍是孩子们的游戏。对手不过是个大腿受伤的老水手，我觉得自己还能应付，胆量也渐渐大了，甚至开始猜想最后会怎样收场。只是我虽然能拖很久，却仍找不到脱身的办法。
        - id: ch03-b06
          speaker: narrator
          text: 就在我们绕着桅杆僵持的时候，西斯帕尼奥拉号突然撞上了岸。船身先是踉跄般狠狠一震，在沙上摩擦了片刻，随即快得像挨了一记重击，猛然倒向左舷。甲板一直倾斜到四十五度左右。一大桶水似的海水从排水孔泼了进来，哗地积在甲板和舷墙之间。
        - id: ch03-b07
          speaker: narrator
          text: 我和汉兹转眼同时摔倒，几乎一起滚进排水沟。红帽子的尸体还伸着两条胳膊，也僵硬地跟着滚了下来。我们挨得太近，我的头砰地撞上汉兹的脚，牙齿都震得发颤。尽管挨了这一下，我还是先站起来，因为汉兹正和那具死人的身体缠在一起。船突然歪成这样，甲板上已经无法奔跑。我必须就在这一刻另找一条逃路，敌人几乎已经碰到我了。我想到就做，当即纵身跳上后桅支索，两只手轮流抓住绳索，手脚并用，飞快向上爬。直到稳稳坐上桅楼横木，我才敢喘一口气。
        - id: ch03-b08
          speaker: narrator
          text: 正是因为我出手够快，才救了自己。就在我向上攀爬时，那把短剑刺在脚下不到半英尺的地方。伊斯莱尔·汉兹站在下面，一动也不动，嘴巴大张，仰起脸望着我，像一尊被惊讶和失望冻住的石像。
    - id: ch04
      title: 桅杆上的决斗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 坐上横木，我终于有了一点属于自己的时间。可我半刻也不敢耽搁，马上换掉手枪里受潮的点火药。第一支枪已经能用了，我却还不放心。为了更加保险，我又取出另一支枪里的旧弹药，把里面全部清空，再从头重新装过一遍。等到汉兹开始行动时，两支枪都已准备妥当，不会再出岔子。
        - id: ch04-b02
          speaker: narrator
          text: 汉兹被我的动作镇住，终于明白这场较量的运气已经转到我这边。他明显犹豫了一阵，还是拖着沉重的身子攀上支索。他把短剑咬在牙齿之间，开始缓慢又痛苦地向上爬。那条伤腿一直拖在身后，每挪动一次，他都要费尽力气，还会疼得发出一声呻吟。他爬得慢极了。等他刚过三分之一，我早已不慌不忙地准备妥当，双手各握一支枪，对准了他。
        - id: ch04-b03
          speaker: narrator
          text: 汉兹先生，再往上一步，我就打爆你的脑袋！你不是说过吗？死人不会咬人。
        - id: ch04-b04
          speaker: narrator
          text: 我说完还轻轻笑了一声。他立即停住，脸上的肌肉一阵抽动，显然在努力思考。那过程又慢又吃力。我坐在新近找到的安全之处，看得放声大笑。过了一会儿，他咽了一两口唾沫，终于开口。为了说话，他只得取下嘴里的短剑，身体其他地方却仍旧一动不动。
        - id: ch04-b05
          speaker: israel_hands
          text: 吉姆，看来咱俩缠在一起，非讲和不可啦。要不是船刚才突然歪了，我早就收拾了你。可我就是没有运气，只能认输。你想想，我堂堂一个船上领航员，竟要向你这个船上的小崽子低头，心里能好受吗？
        - id: ch04-b06
          speaker: narrator
          text: 我一字不漏地听着他的话，脸上还笑个不停，得意得像只站在墙头的公鸡，完全没有看穿他这番认输的话。就在一眨眼的工夫，他右手猛地越过肩头，向后一扬。一件东西像箭似的尖啸着穿过空气。我肩头先是挨了一记重击，紧接着一阵尖锐的剧痛钻进身体。等我明白过来，那把短剑已经穿过肩头，把我牢牢钉在桅杆上。
        - id: ch04-b07
          speaker: narrator
          text: 那一刻，剧痛和惊骇一齐袭来。我根本说不清自己是不是有意开的枪，只知道绝没有用心瞄准。两支手枪却同时响了，也同时从我手中脱落，向下坠去。可掉下去的还不止手枪。汉兹发出一声堵在喉咙里的惨叫，抓住支索的双手猛然松开，整个人头朝下，从高处一直栽进水中。
