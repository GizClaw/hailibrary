  chapters:
    - id: ch01
      title: "XVIII Narrative Continued by the Doctor: End of the First Day’s Fighting"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            We hurried through the strip of woods between us and the stockade. With every step, the pirates' voices sounded closer. Soon we heard their running feet and the snap of branches as they forced their way through a thicket.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It was clear now that we were in for a real fight. I checked the priming of my gun.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Captain, Trelawney is our finest shot. Give him your gun. His own won't fire.
        - id: ch01-b04
          speaker: narrator
          text: >-
            They traded weapons. Trelawney had stayed quiet and cool through all the confusion. Now he paused just long enough to make sure the captain's gun was ready. Gray had no weapon, so I handed him my cutlass. The sight of him lifted all our spirits. He spat into his palm, frowned, and swung the blade until it sang through the air. Every part of him told us our new man would hold his own.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Forty paces later, we reached the edge of the trees. The stockade stood directly ahead. We came up near the middle of its south wall just as seven mutineers burst into view at the southwest corner. Job Anderson, the boatswain, led them on at a run.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The sight of us stopped them cold. Before they could recover, Trelawney and I fired. Hunter and Joyce fired from the log house at almost the same moment. The four shots were scattered, but they did their work. One pirate dropped. The rest turned at once and plunged back among the trees.
        - id: ch01-b07
          speaker: narrator
          text: >-
            We reloaded, then followed the outside of the palisade to examine the fallen man. He was dead, shot straight through the heart.
        - id: ch01-b08
          speaker: narrator
          text: >-
            We had just begun to celebrate when a pistol cracked in the bushes. A ball whistled past my ear, and poor Tom Redruth pitched full-length onto the ground. The squire and I fired back, but there was nothing to aim at. Most likely, we only wasted powder. We loaded again and turned to Tom.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The captain and Gray were already looking him over. One glance told me there was no hope.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Our quick shots must have driven the mutineers off again. No one troubled us as we lifted the old gamekeeper over the stockade. Groaning and bleeding, he was carried into the log house.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Until that moment, Tom had never spoken a word of surprise, fear, complaint, or even agreement through all our troubles. He had stayed behind his mattress in the ship's gallery like a soldier of old. Every order had been obeyed in silence, stubbornly and well. He was twenty years older than any of us. And now this tough, useful old servant was the one who lay dying.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The squire fell to his knees beside Tom, kissed his hand, and cried like a child.
        - id: ch01-b13
          speaker: tom_redruth
          text: >-
            Am I dying, Doctor?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Tom, my friend, you're going home.
        - id: ch01-b15
          speaker: tom_redruth
          text: >-
            I only wish I'd gotten one shot at them first.
        - id: ch01-b16
          speaker: squire_trelawney
          text: >-
            Tom, please tell me you forgive me.
          emotion: sad
        - id: ch01-b17
          speaker: tom_redruth
          text: >-
            Would it be proper for a servant to forgive his squire? Well, then. So be it. Amen.
        - id: ch01-b18
          speaker: narrator
          text: >-
            For a little while, no one spoke. Then Tom said someone ought to read a prayer.
        - id: ch01-b19
          speaker: tom_redruth
          text: >-
            It's the custom, sir.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Not long after that, he died without another word.
        - id: ch01-b21
          speaker: narrator
          text: >-
            While we had been caring for Tom, the captain emptied his bulging coat and pockets. Out came the British colors, a Bible, a coil of heavy rope, pen and ink, the logbook, and several pounds of tobacco. A long, trimmed fir tree lay inside the enclosure. With Hunter's help, he raised it at the corner where the log-house walls crossed. Then he climbed onto the roof himself, bent the tree into place, and ran up the flag.
        - id: ch01-b22
          speaker: narrator
          text: >-
            That seemed to take a great weight off his mind. He came back inside and began counting our supplies as though nothing else mattered. Even so, he had been watching Tom. The moment Tom was gone, the captain stepped forward with another flag and laid it over the body with great care.
        - id: ch01-b23
          speaker: captain_smollett
          text: >-
            Don't grieve so, sir.
          emotion: calm
        - id: ch01-b24
          speaker: narrator
          text: >-
            He took the squire's hand.
        - id: ch01-b25
          speaker: captain_smollett
          text: >-
            Tom is all right now. A man who falls doing his duty to his captain and his owner has nothing to fear. That may not be proper religion, but I know it's true.
          emotion: calm
        - id: ch01-b26
          speaker: narrator
          text: >-
            Then the captain drew me aside.
        - id: ch01-b27
          speaker: captain_smollett
          text: >-
            Dr. Livesey, how many weeks before you and the squire expect the other ship?
        - id: ch01-b28
          speaker: narrator
          text: >-
            Not weeks. Months. If we haven't returned by the end of August, Blandly is supposed to send a ship to look for us. It won't come any sooner or any later. You can work out the time yourself.
        - id: ch01-b29
          speaker: captain_smollett
          text: >-
            Yes. Even allowing plenty for the mercy of Providence, sir, I'd say we're in a very tight spot.
        - id: ch01-b30
          speaker: narrator
          text: >-
            What do you mean?
        - id: ch01-b31
          speaker: captain_smollett
          text: >-
            I mean it's a bad thing we lost that second load. We have enough powder and shot. But food is another matter. Our rations are very short, Doctor. So short that perhaps we're better off without one more mouth to feed.
        - id: ch01-b32
          speaker: narrator
          text: >-
            He pointed toward Tom's body beneath the flag.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Just then, we heard a roar and a shrill rush overhead. A cannonball flew high above the log-house roof and crashed deep into the woods beyond us.
        - id: ch01-b34
          speaker: captain_smollett
          text: >-
            Oh, go on! Keep firing, lads. You don't have much powder to spare.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Their second shot came closer. The ball landed inside the stockade and threw up a cloud of sand, but it caused no other harm.
        - id: ch01-b36
          speaker: squire_trelawney
          text: >-
            Captain, they can't see the house from the ship. They must be aiming at the flag. Wouldn't it be wiser to bring it down?
        - id: ch01-b37
          speaker: captain_smollett
          text: >-
            Lower my colors? No, sir. I will not!
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: >-
            The moment he said it, I think every one of us agreed. It was the brave, seamanlike answer. It was also good sense. Leaving the flag up showed our enemies how little we cared about their cannon fire.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The cannon thundered through the whole evening. One ball after another flew over us, fell short, or kicked sand into the air inside the stockade. The pirates had to aim so high that each shot struck the soft ground and buried itself. None could bounce dangerously toward us. One ball did punch through the roof of the log house and continue through the floor. Before long, even that kind of rough game bothered us no more than a cricket ball.
        - id: ch01-b40
          speaker: captain_smollett
          text: >-
            Here's one good thing. The woods in front of us are probably clear now. The tide has been going out for some time, so our supplies should be above water. Who'll volunteer to fetch the pork?
        - id: ch01-b41
          speaker: narrator
          text: >-
            Gray and Hunter stepped forward first. Armed well, they slipped out of the stockade. But the trip was no use. The mutineers were braver than we thought, or else they had great faith in Israel's aim. Four or five of them were already hauling away our supplies. They waded out to one of the gigs nearby while a man pulled on an oar to hold the boat against the current. Silver sat in the stern and gave the orders. And somehow, every pirate now had a musket from a hidden store of weapons.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The captain sat down with his logbook. His first entry began by naming the men who were still loyal. Alexander Smollett, master. David Livesey, ship's doctor. Abraham Gray, carpenter's mate. John Trelawney, owner. John Hunter and Richard Joyce, the owner's servants and landsmen. Those were all the faithful men left from the ship's company. We had come ashore that day with ten days of short rations, and we had raised the British colors over the log house on Treasure Island.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Then he recorded that Thomas Redruth, the owner's servant and a landsman, had been shot by the mutineers. After that came the words, “James Hawkins, cabin boy,” with nothing more.
        - id: ch01-b44
          speaker: narrator
          text: >-
            All this time, I was wondering what had become of poor Jim Hawkins.
        - id: ch01-b45
          speaker: narrator
          text: >-
            A shout came from the landward side of the stockade.
        - id: ch01-b46
          speaker: john_hunter
          text: >-
            Someone's calling to us.
        - id: ch01-b47
          speaker: jim_hawkins
          text: >-
            Doctor! Squire! Captain! Hunter, is that you?
        - id: ch01-b48
          speaker: narrator
          text: >-
            I ran to the doorway just in time to see Jim Hawkins, safe and sound, climbing over the stockade.
