audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 利弗西医生
      tts:
        delivery: 冷静果断，带着老兵回顾险境时的克制与机敏
        timbre: 温厚清晰的中年男声
        pace: 沉稳明快，紧张处稍加快
        pitch: 中低
    captain_smollett:
      display_name: 斯摩莱特船长
      tts:
        delivery: 威严简短，命令清楚有力，危急中仍不失冷静
        timbre: 坚实粗粝的成年男声
        pace: 利落紧凑
        pitch: 中低
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
    tom_redruth:
      display_name: 汤姆·雷德鲁斯
      tts:
        delivery: 忠厚质朴，恪守礼数，临危时依旧坚忍
        timbre: 苍老沙哑而温厚
        pace: 缓慢吃力
        pitch: 低
    john_hunter:
      display_name: 约翰·亨特
      tts:
        delivery: 稳重警觉，说话朴实简短
        timbre: 结实清楚的成年男声
        pace: 平稳
        pitch: 中低
    jim_hawkins:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年般直率清亮，历险后仍带着急切与活力
        timbre: 清澈的少年声线
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 奔向木寨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们拼命穿过挡在木寨前的树林。海盗的喊声越来越近，很快，连奔跑的脚步和撞断枝条的噼啪声都听清了。我知道这回非打不可，赶紧查看火枪的引火药。
        - id: ch01-b02
          speaker: narrator
          text: 船长，特里劳尼的枪法最准。把您的枪交给他吧，他自己的已经不能用了。
        - id: ch01-b03
          speaker: narrator
          text: 两人换了枪。特里劳尼仍像纷乱开始时一样沉默镇定，只停了一下，检查枪能不能用。我看格雷手无寸铁，也把弯刀递给了他。他往掌心啐了一口，皱紧眉头，挥得刀刃嗡嗡作响。看见这副架势，大家心里都振奋起来。这个新伙伴确实靠得住。
        - id: ch01-b04
          speaker: narrator
          text: 又跑了四十步，我们冲到林边，木寨就在前面。我们来到围栏南侧中央时，七个叛徒也在水手长乔布·安德森带领下，喊叫着冲到了西南角。他们像是没料到会撞见我们，一下站住了。趁这几个人还没回神，乡绅和我先举起枪，木屋里的亨特和乔伊斯也抓住机会开火。四枪虽然打得稀稀落落，却已经够了。一个敌人当场倒下，其余人毫不犹豫，转身便钻进树林。
        - id: ch01-b05
          speaker: narrator
          text: 我们重新装好弹药，沿着栅栏外侧走过去察看。那人被子弹打穿了心脏，早已死透。大家刚为这场胜利高兴起来，灌木丛里突然传出一声枪响。子弹贴着我的耳朵呼啸过去，可怜的汤姆·雷德鲁斯脚下一个踉跄，整个人直挺挺摔在地上。乡绅和我马上朝树林还击，可那里连个目标也没有，这两枪大概只白费了火药。我们赶紧再次装弹，把全部心思转到汤姆身上。
    - id: ch02
      title: 忠仆之死
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 船长和格雷已经俯身检查汤姆的伤势。我只看了一眼，便知道一切都完了。我们方才迅速还击，大概又一次把叛徒驱散了。此后再没有人来袭扰。大家合力把这位可怜的老猎场看守抬起来，先送过木寨的栅栏，再把呻吟着、流着血的老人抬进木屋。
        - id: ch02-b02
          speaker: narrator
          text: 从灾难开始，一直到被安置在木屋里等死，老人没说过一句惊讶、抱怨或害怕的话，也不曾表示认命。在船尾楼里，他曾像古特洛伊的勇士一样，伏在床垫后坚守。交给他的每一道命令，他总是一声不响地照办，既坚定又可靠。他比我们中最年轻的人还大二十岁。如今，偏偏是这个年老倔强、处处顶用的忠仆要死了。乡绅跪在他身边，捧起那只手吻着，自己却像个孩子一样哭了起来。
        - id: ch02-b03
          speaker: tom_redruth
          text: 医生，我是不是快不行了？
        - id: ch02-b04
          speaker: narrator
          text: 汤姆，我的老伙计，你要回家了。
        - id: ch02-b05
          speaker: tom_redruth
          text: 真可惜，我还没来得及拿枪揍他们一下。
        - id: ch02-b06
          speaker: squire_trelawney
          text: 汤姆，请你说一声，你原谅我，好不好？
          emotion: sad
        - id: ch02-b07
          speaker: tom_redruth
          text: 我是您的下人，乡绅。由我说原谅您，合礼数吗？不过，既然您要我说，那就这样吧。阿门！
        - id: ch02-b08
          speaker: narrator
          text: 屋里安静了一会儿。随后，汤姆说，也许该请什么人来念一段祷文。他像是觉得自己的要求给大家添了麻烦，又带着歉意解释说，这是老规矩。此后没过多久，他一个字也没再说，就离开了人世。
    - id: ch03
      title: 国旗下的汤姆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 船长的胸前和口袋一直塞得异乎寻常地鼓。此刻，他一样一样往外掏，竟拿出了英国国旗、一本《圣经》、一卷相当结实的绳索、纸笔墨水、航海日志，还有足足好几磅烟草。他又在围栏里发现一棵已经砍倒、削去枝杈的长杉树。木屋一角的圆木交错相接，正好形成一个夹角。船长便让亨特来帮忙，把杉树竖在那里。接着，他亲自爬上屋顶，系好国旗，将它升了起来。
        - id: ch03-b02
          speaker: narrator
          text: 国旗升起来以后，船长像是一下宽心了许多。他重新走进木屋，立刻开始清点物资，那副专注的样子，仿佛世上再没有别的事情。可他其实一刻也没忘记留意汤姆的临终情形。老人刚刚咽气，他便拿来另一面旗，走到近前，恭恭敬敬地铺在遗体上。
        - id: ch03-b03
          speaker: captain_smollett
          text: 先生，您别太伤心。他不会有事的。一个人为了船长和船主尽忠，最后中枪倒下，我们不用替他担心。这话也许不合教义，可事实就是如此。
          emotion: calm
        - id: ch03-b04
          speaker: narrator
          text: 接着，船长把我拉到一旁。
        - id: ch03-b05
          speaker: captain_smollett
          text: 利弗西医生，您和乡绅估计，再过多少个星期接应船会来？
        - id: ch03-b06
          speaker: narrator
          text: 我告诉他，得按月算，不是按星期算。要是我们八月底还没回去，布兰德利才会派人来找，不早也不晚。您自己算算吧。
        - id: ch03-b07
          speaker: captain_smollett
          text: 是啊。先生，就算把上天给我们的好运全算进去，我看咱们还是相当吃紧。
        - id: ch03-b08
          speaker: narrator
          text: 怎么说？
        - id: ch03-b09
          speaker: captain_smollett
          text: 可惜第二趟物资丢了，我说的就是这个。火药和子弹还够，可口粮太少，实在太少。利弗西医生，也许少一张嘴吃饭，对我们反倒有好处。
        - id: ch03-b10
          speaker: narrator
          text: 他指向国旗下的尸体。就在这时，一颗圆炮弹咆哮着从屋顶上空飞过，远远落进我们身后的树林。
    - id: ch04
      title: 炮火与旗帜
      blocks:
        - id: ch04-b01
          speaker: captain_smollett
          text: 哟嗬，尽管打吧！小伙子们，你们剩下的火药可没多少了。
        - id: ch04-b02
          speaker: narrator
          text: 第二炮准了一些，炮弹落进木寨，扬起一大片沙土，却没伤到什么。
        - id: ch04-b03
          speaker: squire_trelawney
          text: 船长，从船上根本看不见木屋。他们一定是在瞄准国旗。我们把旗降下来，是不是更明智？
        - id: ch04-b04
          speaker: captain_smollett
          text: 降下我的旗？不，先生，我绝不降！
        - id: ch04-b05
          speaker: narrator
          text: 船长一说完，大家都认同了。这不光是一股坚毅豪迈的水手意气，也是个好计策。我们正好让敌人看看，谁也没把他们的炮击当回事。
        - id: ch04-b06
          speaker: narrator
          text: 整个傍晚，海盗的炮声一直轰隆隆响个不停。炮弹一颗接一颗，有的越过木屋，有的还没飞到就落下了，还有的砸进围栏，扬起大片沙土。他们从船上看不见目标，只能把炮口抬得很高。这样一来，炮弹落下时已经没了冲劲，一头埋进松软的沙里，也不会弹起来伤人。倒有一颗炮弹砰地穿过木屋屋顶，又从地板钻了出去。不过，我们很快习惯了这种胡闹，再也不比在意一场板球赛更多。
        - id: ch04-b07
          speaker: captain_smollett
          text: 这倒有个好处。前面的树林多半没人了。潮水已经退了好一阵，物资应该露出来了。谁愿意去把猪肉搬回来？
        - id: ch04-b08
          speaker: narrator
          text: 格雷和亨特最先站出来。他们带足武器，悄悄溜出木寨，可这趟差事已经没有用了。叛徒要么比我们想的更大胆，要么就是对伊斯雷尔的炮术很有信心。四五个人正在抢运我们的物资。他们抱着东西蹚进水里，送到近旁的一条小艇上。艇上的人不时划一两下桨，顶住水流，让船身稳在那里。西尔弗坐在艇尾发号施令。更糟的是，不知他们从哪个秘密储藏处翻出了火枪，如今每个人都已经武装起来。
    - id: ch05
      title: 吉姆归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 船长坐下来写航海日志。他先列出所有仍旧忠诚的人。亚历山大·斯摩莱特是船长，戴维·利弗西是船医，亚伯拉罕·格雷是木匠副手，约翰·特里劳尼是船主。约翰·亨特和理查德·乔伊斯则是船主的仆人，都是非水手。他接着写道，这些人带着只够节省吃上十天的物资，于当天登上金银岛，并在木屋升起英国国旗。托马斯·雷德鲁斯同样是船主的仆人和非水手，已经被叛徒枪杀。写到舱房侍者詹姆斯·霍金斯时，这篇记录停住了。
        - id: ch05-b02
          speaker: narrator
          text: 船长写下这些话的同时，我也一直惦记着可怜的吉姆·霍金斯，不知道这个孩子落到了什么境地，命运究竟如何。就在这时，木寨靠陆地的一侧忽然传来一声呼喊。
        - id: ch05-b03
          speaker: john_hunter
          text: 有人在叫我们。
        - id: ch05-b04
          speaker: jim_hawkins
          text: 医生！乡绅！船长！喂，亨特，是你吗？
        - id: ch05-b05
          speaker: narrator
          text: 我冲到门口，正好看见吉姆·霍金斯安然无恙，翻过栅栏爬了进来。
