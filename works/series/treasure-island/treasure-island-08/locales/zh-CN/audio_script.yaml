audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑爽朗，善于用水手口吻取信于人，激动时夸张有力
        timbre: 洪亮厚实，带一点粗粝感
        pace: 灵活明快
        pitch: 中低
    morgan:
      display_name: 汤姆·摩根
      tts:
        delivery: 老实迟钝，受盘问时畏缩而恭敬
        timbre: 苍老沙哑
        pace: 缓慢
        pitch: 低
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静清醒，措辞从容而判断明确
        timbre: 温和清晰
        pace: 从容
        pitch: 中
  chapters:
    - id: ch01
      title: 初见高个子约翰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 吃完早饭，乡绅给了我一封信，让我送到望远镜酒店，交给约翰·西尔弗。他说，我只管沿码头往前走，留心一家用大黄铜望远镜做招牌的小酒馆。我正巴不得多看看船和水手，便兴冲冲地出了门。码头忙得不可开交，到处是人、车和成包的货物。我从当中穿过去，终于找到了地方。
        - id: ch01-b02
          speaker: narrator
          text: 那家小酒馆又明亮又整洁。招牌刚刷过漆，窗上挂着齐齐整整的红帘子，地板还铺了一层干净的细沙。屋子左右各临一条街，两边也都开着门。虽说里面飘着一团团烟草的浓烟，那间宽宽矮矮的大屋仍然很亮堂，站在门口就能看得清楚。
        - id: ch01-b03
          speaker: narrator
          text: 屋里的客人大多是水手，一个个说话震天响。我在门口犹豫了一会儿，心里还真有点不敢进去。
        - id: ch01-b04
          speaker: narrator
          text: 这时，一个男人从旁边的小屋走出来。我一眼就断定，他一定是高个子约翰。他的左腿从胯部截断，左腋下撑着拐杖。可那根拐杖到了他手里，灵活得出奇。他单腿跳来跳去，活像一只鸟。这个人又高又壮，脸有火腿那么大。模样平常，脸色苍白，眼神却很机灵，嘴边总带着笑。他一边吹口哨，一边在桌子间来回招呼客人。遇上格外喜欢的，就逗人家一句，或在肩头拍上一巴掌。看起来，他的心情好极了。
        - id: ch01-b05
          speaker: narrator
          text: 可我心里原本一直防着他。乡绅第一次在信里提到高个子约翰时，我便怀疑，他会不会就是那个独腿水手。那个人，我在老“本葆将军”等了很久。可如今只看了西尔弗一眼，我就放下心来。我见过船长，见过黑狗，也见过瞎子皮尤。我自以为早已知道海盗是什么样子。无论怎么看，这个干净整齐、脾气和气的店主，都跟他们完全不同。
        - id: ch01-b06
          speaker: narrator
          text: 我马上壮起胆子，走进店里，来到他面前。他正撑着拐杖，跟一位客人说话。我把信递了过去。
        - id: ch01-b07
          speaker: narrator
          text: 请问，您是西尔弗先生吗？
        - id: ch01-b08
          speaker: silver
          text: 没错，小伙子，我就是西尔弗。你是哪一位？
        - id: ch01-b09
          speaker: narrator
          text: 他看见乡绅的信，好像轻轻吃了一惊，随即大声招呼我，还伸出手来。
        - id: ch01-b10
          speaker: silver
          text: 啊，我知道了！你就是新来的见习水手。见到你可真高兴。
        - id: ch01-b11
          speaker: narrator
          text: 说完，他用那只又大又有力的手握住了我。那一下握得结结实实，看起来，他确实很欢迎这个新来的见习水手。
    - id: ch02
      title: 黑狗逃走了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就在这时，远处一个客人突然起身，直冲门口。门就在他旁边，一转眼，他已经跑上街了。他逃得这么急，反倒叫我留了神。我马上认出，那张脸蜡黄蜡黄的，手上还少了两根指头。最早到“本葆将军”找船长的人就是他。
        - id: ch02-b02
          speaker: narrator
          text: 快拦住他！他是黑狗！
        - id: ch02-b03
          speaker: silver
          text: 他是谁，我连两个铜板都不在乎。可他还欠着酒钱！哈里，快追！
        - id: ch02-b04
          speaker: narrator
          text: 门边另一个客人立刻跳起来追了出去。
        - id: ch02-b05
          speaker: silver
          text: 就算他是霍克将军，也得把酒钱付了！你刚说他叫什么？黑什么？
        - id: ch02-b06
          speaker: narrator
          text: 黑狗，先生。特里劳尼先生没告诉过您那些海盗吗？他就是其中一个。
        - id: ch02-b07
          speaker: silver
          text: 什么？他竟敢进我的店！本，你也快去帮哈里。原来那家伙是那帮狗东西里的一个。摩根，刚才跟他喝酒的是你吧？过来！
        - id: ch02-b08
          speaker: narrator
          text: 摩根走上前来，显得很心虚。他是个老水手，头发已经灰白，脸晒成了红褐色，嘴里还嚼着烟草。
        - id: ch02-b09
          speaker: silver
          text: 汤姆·摩根，你以前从没见过那个黑……那个黑狗，是不是？
        - id: ch02-b10
          speaker: morgan
          text: 我没见过，先生。
        - id: ch02-b11
          speaker: silver
          text: 你也不知道他叫什么，对不对？
        - id: ch02-b12
          speaker: morgan
          text: 我不知道，先生。
        - id: ch02-b13
          speaker: silver
          text: 老天保佑，这算你走运！你要是跟那种人有关系，就永远别再进我的门。他都跟你说了些什么？
        - id: ch02-b14
          speaker: morgan
          text: 我说不太准，先生。
        - id: ch02-b15
          speaker: silver
          text: 你肩膀上的是脑袋，还是该死的滑轮眼？刚才跟谁说话，你是不是也说不准？快讲！他在说航程、船长，还是船？他说了什么？
        - id: ch02-b16
          speaker: morgan
          text: 我们说的是把人拖过船底的刑罚。
        - id: ch02-b17
          speaker: silver
          text: 原来是拖船底！这话题还真适合他。汤姆，你这个笨水手，滚回座位去。
        - id: ch02-b18
          speaker: narrator
          text: 摩根嘴里嚼着烟草，拖着脚回到了座位。西尔弗凑到我身边，用把我当作自己人的口气低声说，汤姆·摩根为人很老实，就是脑子不大灵。听他这样信任我，我心里很受用。随后，他又提高了声音，像是刚刚才想起黑狗这个名字。
        - id: ch02-b19
          speaker: silver
          text: 黑狗？这个名字我不认识。不过，我好像见过那家伙。他以前常跟一个瞎眼的叫花子到我这里来。
        - id: ch02-b20
          speaker: narrator
          text: 对，就是他。那个瞎子我也认识，他叫皮尤。
        - id: ch02-b21
          speaker: silver
          text: 没错，他就是皮尤！那家伙长得像条鲨鱼。要是咱们抓到黑狗，就有消息向特里劳尼船长报告了。本跑得飞快，没几个水手追得过他。他一定能赶上！黑狗不是爱谈拖船底吗？我要把他拖过船底！
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: 西尔弗一句接一句地喊着，一边撑着拐杖在店里咚咚走动，一边用手猛拍桌子。他装得那么激动，就算老贝利法庭的法官，或是弓街的捕快，也会信以为真。看见黑狗以后，我的疑心已经全冒了回来，便紧紧盯住这个厨子。可他的心思实在太深，脑筋太快，也太机灵，我怎么看也看不透。
        - id: ch02-b23
          speaker: narrator
          text: 过了一会儿，哈里和本气喘吁吁地回来了。他们只得承认，黑狗钻进人群，连踪影也找不到了。西尔弗听完，把两人骂得像小偷一样。到了这时，我甚至愿意替高个子约翰·西尔弗作保，认定他一定是清白的。
    - id: ch03
      title: 酒钱的笑话
      blocks:
        - id: ch03-b01
          speaker: silver
          text: 霍金斯，你看看，我碰上这种事，是不是太倒霉了？特里劳尼船长会怎么想？这个该死的混账坐在我自己的店里，喝着我自己的朗姆酒。你跑来明明白白告诉了我，我却让他从咱们所有人的眼皮底下溜了。你可得在船长面前替我说句公道话。你年纪不大，脑子却快。我一见你进门就看出来了。
        - id: ch03-b02
          speaker: silver
          text: 可我撑着这根老木头，一瘸一拐的，又能怎么办？当年我还是一级水手，早就飞快追上去，三两下叫他停船投降了。可如今……
        - id: ch03-b03
          speaker: narrator
          text: 他突然住了口，下巴一下垂下来，像是猛然记起什么。
        - id: ch03-b04
          speaker: silver
          text: 酒钱！三份朗姆酒！天杀的，我居然把酒钱忘了！
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: 他跌坐在长凳上，笑得眼泪都流了出来。我也忍不住笑了。我们一阵接一阵，笑声响遍整间酒馆。
        - id: ch03-b06
          speaker: silver
          text: 我真是一头难得的老海牛！霍金斯，我看咱们一定处得来。我敢发誓，我也只配当个见习水手。好了，准备掉头，咱们该走了。这样不行。伙计，职责就是职责。我得戴上那顶旧公鸡帽，跟你去见特里劳尼船长，把这件事原原本本报告给他。
        - id: ch03-b07
          speaker: silver
          text: 你要明白，这事很严重。你我办得都算不上体面。没错，你也一样。咱们两个谁都不够机灵。不过，扯掉我的纽扣吧，刚才那酒钱的事可太好笑了！
        - id: ch03-b08
          speaker: narrator
          text: 说完，他又痛痛快快地笑起来，笑声怎么也停不住。我其实没觉得酒钱这件事有那么好笑，可听他笑成那样，还是禁不住陪着又笑了一场。
        - id: ch03-b09
          speaker: narrator
          text: 接着，我们沿码头去找乡绅。这一小段路上，西尔弗真是个有趣的同伴。每经过一条船，他都能告诉我，那条船挂什么帆，有多少吨，来自哪个国家。他还给我解释码头上的活儿。哪条船正在卸货，哪条正在装船，哪条又要准备出海，他全都清楚。
        - id: ch03-b10
          speaker: narrator
          text: 一路上，他不时讲起船只和水手的小故事，也会教我航海行话。一句话，他会一遍又一遍地说，直到我完全记住才罢休。他懂船，也懂水手，还很会跟人说话。我渐渐觉得，能跟这样的人做船伴，真是再好不过了。
    - id: ch04
      title: 一起去看船
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们回到客店时，乡绅和利弗西医生正坐在一起。他们喝着一夸脱泡了烤面包片的麦酒，准备喝完就上双桅纵帆船察看。
        - id: ch04-b02
          speaker: narrator
          text: 高个子约翰从头到尾讲了一遍事情经过。他说得有声有色，却又句句属实，没有漏掉什么，也没有添上什么。讲着讲着，他总会转头问我，事情是不是这样。我每次都能替他证明，他说得半点不错。
        - id: ch04-b03
          speaker: narrator
          text: 两位先生听说黑狗逃了，都很遗憾。不过大家一致认为，眼下已经没有办法。西尔弗受了他们一番夸奖，便拿起拐杖告辞。
        - id: ch04-b04
          speaker: squire_trelawney
          text: 今天下午四点，全体上船！
        - id: ch04-b05
          speaker: silver
          text: 是，是，先生！
        - id: ch04-b06
          speaker: narrator
          text: 厨子的声音从过道里传回来。等他走远，医生才开了口。
        - id: ch04-b07
          speaker: doctor_livesey
          text: 乡绅，平常我不大相信你找人的眼光。不过这一次，我得承认，约翰·西尔弗很合我的心意。
        - id: ch04-b08
          speaker: squire_trelawney
          text: 他简直棒极了。
        - id: ch04-b09
          speaker: doctor_livesey
          text: 那么，吉姆也能跟我们一起上船，对吧？
        - id: ch04-b10
          speaker: squire_trelawney
          text: 当然能。霍金斯，戴上帽子，咱们去看看船。
