  chapters:
    - id: ch01
      title: At the Sign of the Spy-glass
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After breakfast, the squire handed me a note for John Silver at the Spy-glass. He said I could find the tavern by following the docks and watching for a big brass telescope over the door. I was delighted to have another chance to see the ships and sailors. The docks were at their busiest, and I had to weave through crowds, carts, and piles of cargo before I found the place.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Spy-glass was a bright, pleasant little tavern. Its sign looked freshly painted. Neat red curtains hung in the windows, and clean sand covered the floor. Streets ran along both sides, with an open door facing each one. Plenty of daylight reached the broad, low room, even through the clouds of tobacco smoke.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Nearly all the customers were seamen. Their voices filled the room, so loud and rough that I stopped at the doorway and almost lost my nerve.
        - id: ch01-b04
          speaker: narrator
          text: >-
            While I waited, a man came out of a side room. One glance told me this had to be Long John. His left leg was gone all the way up to the hip. He carried a crutch under his left shoulder and moved on it with amazing skill, hopping about as lightly as a bird. He was tall and powerfully built, with a broad, pale, ordinary-looking face that seemed both clever and friendly. He whistled as he went from table to table, cheerful as could be, greeting favorite customers with a joke or a slap on the shoulder.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I must admit, the moment Squire Trelawney first mentioned Long John in his letter, I had feared he might be the one-legged sailor I had watched for so long at the old Admiral Benbow. But now one look seemed enough to settle that fear. I had seen the captain, Black Dog, and blind Pew. I thought I knew what a pirate looked like. This clean, good-natured innkeeper seemed nothing like them.
        - id: ch01-b06
          speaker: narrator
          text: >-
            My courage came back. I stepped inside and walked straight over to him. He was leaning on his crutch and talking with a customer. I held out the note.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Are you Mr. Silver, sir?
        - id: ch01-b08
          speaker: long_john_silver
          text: >-
            That's me, lad. And who might you be?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Then he noticed the squire's letter. For just a moment, I thought I saw him start.
        - id: ch01-b10
          speaker: long_john_silver
          text: >-
            Oh! Now I see. You're our new cabin boy. I'm mighty pleased to meet you.
        - id: ch01-b11
          speaker: narrator
          text: >-
            He reached out and closed his large, strong hand around mine.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At that instant, a customer on the far side of the room sprang up and hurried toward the nearest door. He was in the street almost before I could turn. But that sudden dash caught my eye, and I knew him at once. He had a pale, greasy face and two missing fingers. He was the first man who had come looking for the captain at the Admiral Benbow.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Stop him! That's Black Dog!
        - id: ch01-b14
          speaker: long_john_silver
          text: >-
            Black Dog or not, I don't care two coppers. He hasn't paid his bill! Harry, after him. Catch that man!
        - id: ch01-b15
          speaker: narrator
          text: >-
            A sailor near the door jumped up and raced after him.
        - id: ch01-b16
          speaker: long_john_silver
          text: >-
            I don't care if he's Admiral Hawke himself. He'll pay what he owes!
        - id: ch01-b17
          speaker: narrator
          text: >-
            Silver let go of my hand and turned back to me.
        - id: ch01-b18
          speaker: long_john_silver
          text: >-
            What did you call him? Black what?
        - id: ch01-b19
          speaker: narrator
          text: >-
            Black Dog, sir. Didn't Mr. Trelawney tell you about the pirates? That man was one of them.
        - id: ch01-b20
          speaker: long_john_silver
          text: >-
            What? A pirate, right here in my house? Ben, you go help Harry. Morgan! Were you sitting there drinking with him? Come over here.
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: >-
            Morgan was an old sailor with gray hair and a dark, weathered face. He came forward looking ashamed, working his tobacco in his mouth.
        - id: ch01-b22
          speaker: long_john_silver
          text: >-
            Now listen, Tom Morgan. You'd never set eyes on that Black Dog before today. Is that right?
        - id: ch01-b23
          speaker: tom_morgan
          text: >-
            Never, sir.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Morgan gave him a salute.
        - id: ch01-b25
          speaker: long_john_silver
          text: >-
            And you didn't know his name?
        - id: ch01-b26
          speaker: tom_morgan
          text: >-
            No, sir.
        - id: ch01-b27
          speaker: long_john_silver
          text: >-
            By thunder, Tom, you'd better be telling the truth. If you were mixed up with a man like that, you'd never step inside my house again. So what was he saying to you?
          emotion: angry
        - id: ch01-b28
          speaker: tom_morgan
          text: >-
            I can't rightly say, sir.
        - id: ch01-b29
          speaker: long_john_silver
          text: >-
            Is that a head on your shoulders, or a dead-eye? You can't rightly say? Maybe you can't rightly say who you were talking to, either! Come on, man. What was he going on about? Voyages? Captains? Ships? Speak up!
          emotion: angry
        - id: ch01-b30
          speaker: tom_morgan
          text: >-
            We were talking about keel-hauling.
        - id: ch01-b31
          speaker: long_john_silver
          text: >-
            Keel-hauling, were you? A fitting subject, too. You can depend on that. Now get back to your seat, you old lubber.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Morgan shuffled back to his place. Silver leaned close and whispered to me in a way that made me feel important.
        - id: ch01-b33
          speaker: long_john_silver
          text: >-
            Tom Morgan's honest enough. He's just not very bright.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Then Silver raised his voice again.
        - id: ch01-b35
          speaker: long_john_silver
          text: >-
            Now, Black Dog. No, I can't say I know that name. Still, I have seen the fellow before. Yes, that's it. He used to come in here with a blind beggar.
        - id: ch01-b36
          speaker: narrator
          text: >-
            You're right about that. I knew the blind man, too. His name was Pew.
        - id: ch01-b37
          speaker: long_john_silver
          text: >-
            Pew! That was his name, sure enough. And a shark he looked! If the lads catch this Black Dog, we'll have something worth telling Captain Trelawney. Ben can run with the best of them. He ought to chase the rogue down in no time. So Black Dog talked about keel-hauling, did he? I'll keel-haul him!
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: >-
            As he fired off these words, Silver thumped around the tavern on his crutch and slapped the tables with his hand. He put on such a convincing show of outrage that he could have fooled any judge or police officer in England.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Finding Black Dog at the Spy-glass had brought all my doubts rushing back, and I watched Silver as closely as I could. But he was far too clever and too quick for me. However carefully I studied him, I could find nothing in his face or manner that gave him away. Harry and Ben finally returned, breathless, and admitted they had lost Black Dog in the crowd. Silver scolded them as if they were thieves themselves. By then, I would gladly have sworn that Long John was innocent.
        - id: ch01-b40
          speaker: long_john_silver
          text: >-
            Look at the spot this puts me in, Hawkins. What will Captain Trelawney think? That cursed Dutchman's son sits in my own house drinking my rum. Then you come in and tell me who he is, and I stand here while he slips away! You'll speak fair for me to the captain, won't you? You're young, but you're sharp as a needle. I saw that the minute you walked in.
        - id: ch01-b41
          speaker: long_john_silver
          text: >-
            What else could I do, hobbling on this old piece of timber? Back when I was an able seaman, I'd have closed with him in a flash and stopped him before he took two breaths. But now...
        - id: ch01-b42
          speaker: narrator
          text: >-
            Silver broke off. His mouth fell open as if a forgotten thought had just struck him.
        - id: ch01-b43
          speaker: long_john_silver
          text: >-
            His bill! Three glasses of rum! Shiver my timbers, I forgot all about his bill!
          emotion: surprised
        - id: ch01-b44
          speaker: narrator
          text: >-
            He dropped onto a bench and laughed until tears ran down his face. I couldn't help myself. Soon I was laughing with him, peal after peal, until the whole tavern rang.
        - id: ch01-b45
          speaker: long_john_silver
          text: >-
            What a precious old sea-calf I am!
          emotion: happy
        - id: ch01-b46
          speaker: narrator
          text: >-
            At last, he wiped his cheeks.
        - id: ch01-b47
          speaker: long_john_silver
          text: >-
            You and I will get along fine, Hawkins. I swear I ought to be rated as a ship's boy myself. But come on, it's time to change course. This won't do at all. Duty is duty, shipmate. I'll put on my old cocked hat and go with you to Captain Trelawney. We must report the whole business.
        - id: ch01-b48
          speaker: long_john_silver
          text: >-
            Make no mistake, this is serious. Neither one of us comes out looking clever. You don't, either! No, neither of us was clever today. But blast my buttons, that part about the bill was a good one!
        - id: ch01-b49
          speaker: narrator
          text: >-
            He burst out laughing again. I didn't find the joke nearly as funny as he did, but his laughter pulled me in once more.
        - id: ch01-b50
          speaker: narrator
          text: >-
            We set off along the quays, and Silver proved to be the most fascinating companion. He told me about every ship we passed. He explained its rig, its size, and the country it came from. One vessel was unloading, another was taking cargo aboard, and a third was being prepared for sea. Between his explanations, he shared little stories about ships and sailors. When he used a sailor's phrase, he repeated it until I knew it perfectly. I began to think no one could make a better shipmate.
        - id: ch01-b51
          speaker: narrator
          text: >-
            At the inn, we found Squire Trelawney and Dr. Livesey sitting together. They were finishing a quart of ale and a piece of toast before going aboard the schooner to inspect her.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Long John told them everything, from beginning to end. He spoke with great spirit, and every part of his story was true. Now and then, he turned to me.
        - id: ch01-b53
          speaker: long_john_silver
          text: >-
            That's exactly how it happened, wasn't it, Hawkins?
        - id: ch01-b54
          speaker: narrator
          text: >-
            Each time, I could confirm every word. The squire and the doctor were sorry Black Dog had escaped, but all of us agreed there was nothing more we could do. They praised Silver for the way he had handled things. Then he picked up his crutch and left.
        - id: ch01-b55
          speaker: squire_trelawney
          text: >-
            Every hand aboard by four this afternoon!
        - id: ch01-b56
          speaker: long_john_silver
          text: >-
            Aye, aye, sir!
        - id: ch01-b57
          speaker: narrator
          text: >-
            His answer came back from the passage. Once he was gone, Dr. Livesey turned to the squire.
        - id: ch01-b58
          speaker: dr_livesey
          text: >-
            Well, squire, I don't usually put much trust in the men you discover. But I will say this. John Silver suits me.
        - id: ch01-b59
          speaker: squire_trelawney
          text: >-
            He's a splendid fellow!
        - id: ch01-b60
          speaker: dr_livesey
          text: >-
            And Jim may come aboard with us now, may he not?
        - id: ch01-b61
          speaker: squire_trelawney
          text: >-
            Of course he may. Get your hat, Hawkins. Let's go see the ship.
