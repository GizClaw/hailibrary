  chapters:
    - id: ch01
      title: "The Treasure-hunt—The Voice Among the Trees"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The alarm had taken some of the strength out of everyone, and Silver and the sick men needed a rest. So as soon as we reached the top of the climb, the whole party sat down.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The plateau sloped a little toward the west, and from where we stopped we could see a great distance in both directions. Ahead, beyond the treetops, the Cape of the Woods stood against a fringe of breaking surf. Behind us lay the anchorage and Skeleton Island. Beyond the spit and the low ground to the east, open sea stretched away. The Spy-glass rose steeply above us, scattered with lone pines in some places and dark with cliffs in others. All we heard was the far-off surf around the island and countless insects chirping in the brush. There was not a man or a sail anywhere on the sea. Such a huge view only made us feel more alone.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Silver sat there taking bearings with his compass.
        - id: ch01-b04
          speaker: long_john_silver
          text: >-
            There are three tall trees about where they ought to be, in line with Skeleton Island. And that "Spy-glass shoulder" must be the lower point over there. Finding the treasure should be child's play now. I'm half a mind to eat first.
        - id: ch01-b05
          speaker: morgan
          text: >-
            I couldn't eat. It's thinking about Flint that's done for me, I reckon.
        - id: ch01-b06
          speaker: long_john_silver
          text: >-
            Then thank your lucky stars he's dead, my son.
        - id: ch01-b07
          speaker: first_mutineer
          text: >-
            He was a wicked devil. And that blue face of his!
          emotion: fearful
        - id: ch01-b08
          speaker: council_spokesman
          text: >-
            The rum turned him blue. Blue? I should say he was. That's the truth.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Ever since the pirates had found the skeleton, every thought had led them back to Flint. Their voices had fallen lower and lower until they were almost whispering. Their talk barely disturbed the silence in the woods. Then, from among the trees ahead, a thin, high, shaking voice began the tune they all knew.
        - id: ch01-b10
          speaker: ben_gunn
          text: |-
            Fifteen men on the dead man's chest—
            Yo-ho-ho, and a bottle of rum!
        - id: ch01-b11
          speaker: narrator
          text: >-
            I had never seen men struck by such terror. The color vanished from all six pirate faces as if by magic. Some jumped up. Some grabbed hold of one another. Morgan threw himself flat on the ground.
        - id: ch01-b12
          speaker: council_spokesman
          text: "It's Flint, by heaven!"
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: >-
            The song stopped as sharply as it had begun, cut off in the middle of a note as if someone had covered the singer's mouth. To me, the voice had sounded light and sweet as it came through the clear, sunny air over the green treetops. That only made its effect on the pirates seem stranger.
        - id: ch01-b14
          speaker: long_john_silver
          text: >-
            Come on now. We can't carry on like this. Get ready to move. This is a strange business, and I don't know the voice. But somebody's playing games with us. That's a living man, and you can depend on it.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Silver could hardly force the first words past his pale lips. But as he went on, his courage returned, and some color came back into his face. The others were listening. They had just begun to take heart when the voice sounded again. This time it did not sing. A weak, faraway call came through the trees, and its echo faded among the cracks and hollows of the Spy-glass.
        - id: ch01-b16
          speaker: ben_gunn
          text: >-
            Darby M'Graw! Darby M'Graw! Darby M'Graw! Fetch the rum aft, Darby!
        - id: ch01-b17
          speaker: narrator
          text: >-
            The pirates stood frozen, staring ahead with their eyes wide. Even after the voice died away, they did not move or speak.
        - id: ch01-b18
          speaker: second_mutineer
          text: "That settles it. Let's get out of here."
          emotion: fearful
        - id: ch01-b19
          speaker: morgan
          text: >-
            Those were his last words. The last words Flint ever spoke aboard ship.
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: >-
            Dick had pulled out his Bible and was praying as fast as he could. He had been raised well before he went to sea and fell in with bad company.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Silver still refused to give in. I could hear his teeth knocking together, but he had not surrendered.
        - id: ch01-b22
          speaker: long_john_silver
          text: >-
            Nobody else on this island ever heard of Darby. Nobody except the men standing right here.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Then he gathered all his strength and raised his voice.
        - id: ch01-b24
          speaker: long_john_silver
          text: >-
            Shipmates, I came for that treasure, and no man or devil will beat me. I wasn't afraid of Flint when he was alive, and I'll face him now that he's dead. Seven hundred thousand pounds lies less than a quarter mile from here. Since when does a gentleman of fortune turn his back on money like that because of some drunken old sailor with a blue face, especially a dead one?
        - id: ch01-b25
          speaker: narrator
          text: >-
            His men showed no returning courage. Silver's disrespect for the dead only frightened them more.
        - id: ch01-b26
          speaker: council_spokesman
          text: >-
            Stop there, John. Don't go crossing a spirit.
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: >-
            The others were too terrified to answer. Each would have run if he had dared to go alone. Instead, fear held them together and kept them close to Silver, as though they could borrow some of his nerve. Silver had nearly mastered his own fear by then.
        - id: ch01-b28
          speaker: long_john_silver
          text: >-
            A spirit? Maybe so. But one thing doesn't fit. We heard an echo. No one ever saw a spirit cast a shadow, so why should one have an echo? That can't be natural, can it?
        - id: ch01-b29
          speaker: narrator
          text: >-
            The argument sounded weak to me. But there is no telling what may convince a superstitious man. To my surprise, George Merry looked greatly relieved.
        - id: ch01-b30
          speaker: council_spokesman
          text: >-
            That's true enough. You've got a good head on you, John. Turn around, mates! I believe this crew has been sailing the wrong course. And now I think about it, the voice did sound like Flint, but it wasn't quite the same. It sounded more like someone else. More like—
        - id: ch01-b31
          speaker: long_john_silver
          text: "By heaven, it was Ben Gunn!"
          emotion: surprised
        - id: ch01-b32
          speaker: morgan
          text: "Aye, that's who it was! Ben Gunn!"
          emotion: surprised
        - id: ch01-b33
          speaker: dick
          text: >-
            Does that make any difference? Ben Gunn isn't here alive any more than Flint is.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The older sailors answered him with scorn.
        - id: ch01-b35
          speaker: council_spokesman
          text: >-
            Who cares about Ben Gunn? Dead or alive, nobody's afraid of him.
        - id: ch01-b36
          speaker: narrator
          text: >-
            It was amazing how quickly their courage returned and the color came back to their faces. Soon they were talking again, though now and then they stopped to listen. When no more sounds came, they shouldered their tools and started off. Merry went first with Silver's compass, keeping the line from Skeleton Island. He had told the truth. Dead or alive, nobody cared about Ben Gunn.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Dick alone kept his Bible in his hand. As he walked, he glanced fearfully around him. No one felt sorry for him. Silver even made fun of his attempt to protect himself.
        - id: ch01-b38
          speaker: long_john_silver
          text: >-
            I warned you that you'd ruined your Bible. If it's no use for swearing an oath, what do you think a spirit would give for it? Not that much!
        - id: ch01-b39
          speaker: narrator
          text: >-
            Silver stopped for a moment on his crutch and snapped his thick fingers. But Dick could not be comforted. Soon I could see that he was becoming ill. The heat, the exhaustion, and his terrible fright had brought on the fever Dr. Livesey had predicted, and it was rising fast.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Walking across the summit was easy. Our path ran slightly downhill because the plateau leaned toward the west. Tall and short pines stood far apart, and broad patches of ground lay open under the hot sun between clumps of nutmeg and azalea. We crossed the island toward the northwest. On one side, we moved closer beneath the shoulders of the Spy-glass. On the other, more and more of the western bay opened before us, the same bay where I had once been tossed about in the coracle, trembling with fear.
        - id: ch01-b41
          speaker: narrator
          text: >-
            We reached the first tall tree, but the compass bearings showed it was the wrong one. The second was wrong too. Then we saw the third. It rose nearly two hundred feet above a thicket, a giant tree with a red trunk as broad as a cottage. Its shadow spread so wide that a whole company of men could have moved around beneath it. Sailors could see it far out at sea on either side of the island. It could easily have served as a mark on a chart.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Yet the pirates hardly cared about its enormous size. All they could think of was the seven hundred thousand pounds in gold buried somewhere beneath that spreading shadow. As they came closer, the thought of the money swallowed every fear they had felt. Their eyes burned. Their steps became quicker and lighter. Each man gave his whole mind to the fortune waiting there and to the lifetime of wild pleasure he meant to buy with it.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Silver grunted as he hurried along on his crutch. His nostrils flared and trembled. Whenever flies landed on his hot, shining face, he cursed like a madman. He jerked savagely at the rope that tied me to him, and from time to time he turned a murderous look on me. He made no effort to hide his thoughts, and I could read them plainly.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Now that the gold was close, Silver had forgotten everything else. His promise and the doctor's warning meant nothing to him anymore. I was certain he meant to take the treasure, find the Hispaniola in the dark, and climb aboard. Then he would kill every honest man left on the island and sail away as he had planned from the beginning, loaded with riches and crimes.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Those thoughts shook me, and I struggled to keep pace with the treasure hunters. I stumbled now and then. Each time, Silver yanked hard on the rope and glared at me as if he meant to kill me. Dick had fallen behind and now came last, muttering prayers and curses as his fever climbed. That made my misery worse.
        - id: ch01-b46
          speaker: narrator
          text: >-
            And there was something else. I could not stop thinking about the terrible scene that had once taken place on this plateau. Flint, the godless pirate with the blue face who later died in Savannah while singing and crying out for rum, had killed his six companions here with his own hands. This quiet grove must have echoed with their cries then. Once the thought took hold of me, I could almost hear those cries still.
        - id: ch01-b47
          speaker: narrator
          text: >-
            We had reached the edge of the thicket.
        - id: ch01-b48
          speaker: council_spokesman
          text: "Come on, mates! All together!"
        - id: ch01-b49
          speaker: narrator
          text: >-
            The men in front broke into a run. Before they had gone another ten yards, they stopped dead, and a low cry rose from them. Silver drove himself forward twice as fast, digging at the ground with his crutch like a man possessed. A moment later, he and I stopped just as suddenly.
        - id: ch01-b50
          speaker: narrator
          text: >-
            A great pit lay before us. It had not been dug recently. The sides had partly fallen in, and grass grew across the bottom. Inside lay the handle of a pick, broken in two, along with boards from several packing cases. One board had a name burned into it with a hot iron. The name was Walrus, Flint's ship.
        - id: ch01-b51
          speaker: narrator
          text: >-
            There could be no mistake. Someone had already found the hiding place and emptied it. The seven hundred thousand pounds was gone!
