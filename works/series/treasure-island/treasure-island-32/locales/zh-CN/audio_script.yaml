audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    tom_morgan:
      display_name: 汤姆·摩根
      tts:
        delivery: 老水手般粗野冲动，底气不足时仍强撑着
        timbre: 苍老干涩的男声
        pace: 急促
        pitch: 中低
    yellow_eyed_pirate:
      display_name: 乔治·梅里
      tts:
        delivery: 表面恭敬、实则强硬，照着海盗规矩咬字说话
        timbre: 阴沉偏冷的男声
        pace: 不紧不慢
        pitch: 中低
    unnamed_pirate:
      display_name: 一名海盗
      tts:
        delivery: 粗声粗气，面对医生时收敛而谨慎
        timbre: 沙哑的成年男声
        pace: 中等
        pitch: 中低
    bandaged_pirate:
      display_name: 头缠绷带的海盗
      tts:
        delivery: 受伤后虚弱多疑，提到鬼魂时惶恐不安
        timbre: 发虚的成年男声
        pace: 稍慢
        pitch: 中
    dick:
      display_name: 迪克
      tts:
        delivery: 年轻水手般直率，病中虚弱慌乱
        timbre: 发颤的年轻男声
        pace: 偏快，病重时断续
        pitch: 中高
    ben_gunn:
      display_name: 本·冈恩
      tts:
        delivery: 长久独居后的古怪跳脱，故意模仿幽灵时尖细飘忽
        timbre: 干瘦尖细的成年男声
        pace: 忽慢忽快
        pitch: 高
  chapters:
    - id: ch01
      title: 林中歌声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 方才的惊吓压住了众人的兴头，西尔弗和几个病人也需要歇息。我们一登上坡顶，便全坐了下来。高地微微向西倾斜，从这里朝两边望去，视野十分开阔。前方越过树梢，林角岬围着一圈白浪。身后是锚地和骷髅岛，再越过沙嘴和东边低地，还能看见东方辽阔的海面。望远镜山陡然耸在头顶，有的地方散落着孤松，有的地方露出黑沉沉的峭壁。四周的声音只有两种。远处海浪拍岸，从各个方向传来，灌木丛里则有无数虫子不停鸣叫。海上一个人也没有，一片帆也不见。眼前的天地越辽阔，我们越显得孤单。
        - id: ch01-b02
          speaker: narrator
          text: 西尔弗坐着拿出罗盘，测了几个方位。
        - id: ch01-b03
          speaker: long_john_silver
          text: 有三棵高树，从骷髅岛望过去，差不多都在咱们该走的线上。我看地图上说的望远镜山山肩，就是那边较低的山头。现在找东西已经容易得很。我倒想先吃顿午饭。
        - id: ch01-b04
          speaker: tom_morgan
          text: 我一点胃口都没有。准是想着弗林特闹的，我看就是他。
        - id: ch01-b05
          speaker: long_john_silver
          text: 孩子，那你可该谢天谢地，弗林特已经死了。
        - id: ch01-b06
          speaker: bandaged_pirate
          text: 那家伙活脱脱是个恶鬼，连脸都蓝得吓人！
          emotion: fearful
        - id: ch01-b07
          speaker: yellow_eyed_pirate
          text: 那是朗姆酒害的。蓝？嘿，他那张脸可真够蓝的，这话半点不假。
        - id: ch01-b08
          speaker: narrator
          text: 自从看见那具骸骨，他们便一直想着弗林特，声音也越压越低。到了这会儿，大家几乎只剩下耳语，树林里的寂静一点也没被打破。忽然，前方林木深处传来一道尖细发颤的声音，唱起了人人熟悉的调子。
        - id: ch01-b09
          speaker: ben_gunn
          text: 死人胸前十五人——哟嗬嗬，再来一瓶朗姆酒！
        - id: ch01-b10
          speaker: narrator
          text: 我从没见过谁吓成他们那副模样。六张脸上的血色像中了魔法，一下子褪得干干净净。有人猛地跳了起来，有人伸手乱抓，死死抓住身边的同伴，摩根更是整个人趴倒在地。
        - id: ch01-b11
          speaker: yellow_eyed_pirate
          text: 是弗林特，见鬼！
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 歌声来得突然，停得也突然。它只唱到半个音便断了，像是有人捂住了歌者的嘴。那声音穿过晴朗的空气和绿色树梢，在我听来又轻又悦耳。可它越好听，同伴们的反应就越显得古怪。
        - id: ch01-b13
          speaker: long_john_silver
          text: 振作点，这样可不成。准备回头。这事虽说邪门，我也听不出是谁，可准是有人在胡闹。那是个有血有肉的活人，你们尽管相信。
    - id: ch02
      title: 鬼魂与回声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 西尔弗一边说，胆气一边回来，脸上也恢复了几分血色。其余人听进了他的鼓劲，也开始慢慢清醒过来。可就在这时，同一个声音又响了。这回不再是歌，而是远处微弱的呼喊。声音传进望远镜山一道道裂谷，回声一层层变轻，听起来更加幽微。
        - id: ch02-b02
          speaker: ben_gunn
          text: 达比·麦格劳！达比·麦格劳！达比，把朗姆酒拿到船尾来！
        - id: ch02-b03
          speaker: narrator
          text: 那声音一遍遍哀号，后来又提高嗓门，还夹了一句我不愿复述的咒骂。海盗们像在地上生了根，眼睛瞪得几乎掉出来。声音消失了很久，他们依旧一动不动，只管惊恐地望着前方。
        - id: ch02-b04
          speaker: unnamed_pirate
          text: 这下没什么好说的了。咱们快走吧。
          emotion: fearful
        - id: ch02-b05
          speaker: tom_morgan
          text: 那是他的临终遗言，是他活着时说的最后一句话。
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: 迪克已经掏出《圣经》，嘴里不停祈祷。他从前受过良好教养，只是出海以后落进了坏伙伴中间。西尔弗仍不肯认输。我听得见他的牙齿格格作响，可他还撑着。
        - id: ch02-b07
          speaker: long_john_silver
          text: 这岛上从没人听说过达比，除了咱们几个，一个都没有。伙计们，我来这里就是为了取那批东西。活人也好，魔鬼也罢，谁都别想赶走我。弗林特活着时，我没怕过他。现在他死了，我照样敢当面迎上去！七十万英镑离这里不到四分之一英里。哪个海上好汉会因为一个喝酒喝昏了头、脸色发蓝的老水手，就把船尾冲着这么多钱逃跑？何况他还是个死人！
        - id: ch02-b08
          speaker: narrator
          text: 手下人听了，并没有重新鼓起勇气。西尔弗越是不敬鬼神，他们反而越害怕。
        - id: ch02-b09
          speaker: yellow_eyed_pirate
          text: 打住吧，约翰！你可别冒犯鬼魂。
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: 其余人怕得答不出话。若有胆量，他们早就各自逃命了。偏偏恐惧把他们拢在约翰身边，仿佛能从他的胆气里分到一点勇气。西尔弗自己倒差不多压住了心里的害怕。
        - id: ch02-b11
          speaker: long_john_silver
          text: 鬼魂？也许吧。可我有件事想不通。刚才明明有回声。谁也没见过鬼魂带影子，对不对？那鬼魂怎么会有回声？这不合常理吧？
        - id: ch02-b12
          speaker: narrator
          text: 在我听来，这道理实在牵强。可迷信的人会信什么，谁也猜不准。乔治·梅里听完，竟然大大松了口气。
        - id: ch02-b13
          speaker: yellow_eyed_pirate
          text: 对呀，约翰，你这脑袋真不是白长的。伙计们，转向！咱们这条船刚才走错航向了。现在想想，那声音确实像弗林特，可又不完全像，不是那么地道。倒更像另一个人，像是……
        - id: ch02-b14
          speaker: long_john_silver
          text: 老天在上，是本·冈恩！
        - id: ch02-b15
          speaker: tom_morgan
          text: 对，就是他！是本·冈恩！
        - id: ch02-b16
          speaker: dick
          text: 可这有什么分别？本·冈恩和弗林特一样，肉身也不在这里了。
        - id: ch02-b17
          speaker: narrator
          text: 几个老水手一听，全都轻蔑地驳斥他。
        - id: ch02-b18
          speaker: yellow_eyed_pirate
          text: 嗨，谁会怕本·冈恩？管他死了还是活着，都没人把他当回事。
    - id: ch03
      title: 黄金近在眼前
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 真是不可思议，他们立刻有了精神，脸上也恢复了正常的血色。没过多久，众人便重新交谈起来，只是隔一会儿就会停住，侧耳听听林中还有没有动静。后来再没传来任何声音，他们便把工具扛上肩头，重新出发。梅里拿着西尔弗的罗盘走在最前面，好让队伍始终沿着骷髅岛所指的方位前进。他说得不假，本·冈恩不管死活，都没人怕他。
        - id: ch03-b02
          speaker: narrator
          text: 只有迪克还握着《圣经》，边走边害怕地四处张望。没有人同情他，西尔弗甚至拿他的防备取笑。
        - id: ch03-b03
          speaker: long_john_silver
          text: 我早说过，你把《圣经》糟蹋了。拿它发誓都不管用，你以为鬼魂会在乎它吗？它连这么一点都不值！
        - id: ch03-b04
          speaker: narrator
          text: 西尔弗停下拐杖，响亮地打了个指响。迪克还是安不下心。很快我便看出来，这小伙子正在生病。炎热、疲惫和刚才的惊吓催着病势发作，利弗西医生预料的高烧正迅速加重。
        - id: ch03-b05
          speaker: narrator
          text: 高地顶上平坦开阔，路很好走。地面向西倾斜，我们便稍稍往下走。大大小小的松树彼此隔得很远，肉豆蔻树和杜鹃之间也留着大片空地，在火热的阳光下晒得滚烫。我们几乎一直朝西北走，横穿整座岛屿。望远镜山的山肩在一边越逼越近，另一边，西面的海湾也越来越完整地展现在眼前。我从前坐着那只小圆舟，曾在那里随浪颠簸，吓得浑身发抖。
        - id: ch03-b06
          speaker: narrator
          text: 我们先到了第一棵高树跟前，可一测方位，发现不是它。第二棵也一样。第三棵从一大片灌木丛中拔地而起，差不多有两百英尺高。它简直是植物中的巨人，赤红的树干像一间小屋那么粗，四周铺开一大片阴影，足够一整队人马在里面操练。无论从东边还是西边的远海上，都能清楚看见它。这样醒目的大树，甚至可以画在海图上，给来往的船只充当陆标。
        - id: ch03-b07
          speaker: narrator
          text: 可同伴们已经顾不上树有多高、有多粗。他们只想着，在那片向四周伸展的树荫下面，不知什么地方埋着七十万英镑的黄金。离大树越近，金钱的念头就越把先前的恐惧吞得干干净净。他们两眼灼灼发亮，脚步越来越快，也越来越轻。每个人的整个心魂都系在那笔等待着他的财富上。只要把它挖出来，眼前便是一辈子的挥霍与享乐。
        - id: ch03-b08
          speaker: narrator
          text: 西尔弗拄着拐杖，一瘸一拐地赶路，嘴里呼哧直喘，张开的鼻孔不停翕动。苍蝇只要落到他又热又亮的脸上，他便像疯子一样破口咒骂。他恶狠狠地扯着那根把我拴在他身边的绳子，时不时回过头来瞪我，目光里全是杀气。他根本不费心掩饰自己的念头，我也把它看得像纸上的字一样清楚。
        - id: ch03-b09
          speaker: narrator
          text: 黄金近在眼前，西尔弗已经忘了其他一切。给我的承诺和医生的警告，全被抛在脑后。我毫不怀疑，他打算夺下宝藏，趁夜找到“伊斯帕尼奥拉号”并登船，割断岛上每一个正直人的喉咙，再照最初的计划扬帆离去，船上既装着财富，也装着罪恶。
    - id: ch04
      title: 空空的宝坑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这些恐惧搅得我心神不宁，寻宝的人又走得飞快，我很难跟上他们。我不时会绊一下。每到这时，西尔弗便粗暴地猛扯绳子，再朝我射来要杀人似的目光。迪克早已落在我们后面，走在全队最后。随着高烧不断加重，他嘴里一会儿祷告，一会儿咒骂，不停说着胡话。这也使我更加难受。
        - id: ch04-b02
          speaker: narrator
          text: 更糟的是，我总想着这里从前发生的惨剧。那个不敬神的海盗头子，那个脸色发蓝、死在萨凡纳时还唱着歌、喊着要酒的人，曾在这片高地上亲手砍倒六名同伙。眼前的树林如今如此安静，当年却一定回荡着他们的惨叫。这个念头在心里挥之不去，我甚至觉得，那些叫声到现在还在林间回响。
        - id: ch04-b03
          speaker: narrator
          text: 我们来到了灌木丛边缘。
        - id: ch04-b04
          speaker: yellow_eyed_pirate
          text: 好哇，伙计们，大家一起上！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 最前面的人拔腿奔跑。可还没跑出十码，他们突然停住了，人群中传来一声低呼。西尔弗像着了魔，用拐杖尖拼命戳地，把速度加快一倍。转眼间，他和我也猛地停下。
        - id: ch04-b06
          speaker: narrator
          text: 我们面前是一个很大的坑。看得出来，它已经挖开一阵子了，四周的坑壁全都塌落下来，坑底甚至长出了青草。坑里扔着一根断成两截的十字镐木柄，周围还散落着几只装货木箱的板子。我看见其中一块板上用烙铁烫着“海象号”几个字，那正是弗林特那条船的名字。
        - id: ch04-b07
          speaker: narrator
          text: 事实再清楚不过。宝藏早被人找到，也早被洗劫一空。七十万英镑，全不见了！
