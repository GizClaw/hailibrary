  chapters:
    - id: ch01
      title: Council of War
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Feet came pounding across the deck. I heard men tumbling up from the cabin and the forecastle. In an instant, I slipped out of the barrel, ducked behind the foresail, and doubled back toward the stern. I came out on the open deck just in time to join Hunter and Dr. Livesey as they rushed to the weather bow.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Everyone was already gathered there. The moon appeared just as a bank of fog began to lift. Far to the southwest, we could see two low hills standing about two miles apart. Behind one of them rose a third and taller hill, though fog still covered its peak. All three hills looked steep, sharp, and pointed.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I took it all in as if I were dreaming, because I had not recovered from the terror of what I had heard only minutes before. Then Captain Smollett began calling orders. Once every sail had been hauled into place, the Hispaniola turned a little closer to the wind. We settled on a course that would just carry us clear of the island's eastern side.
        - id: ch01-b04
          speaker: captain_smollett
          text: >-
            Now, men, has anyone here seen that land before?
        - id: ch01-b05
          speaker: long_john_silver
          text: >-
            I have, sir. I stopped for water there once, when I was cook aboard a trading ship.
        - id: ch01-b06
          speaker: captain_smollett
          text: >-
            The anchorage is on the south side, behind a little island. Is that right?
        - id: ch01-b07
          speaker: long_john_silver
          text: >-
            Yes, sir. They call that little place Skeleton Island. Pirates used to favor these waters, and one man I sailed with knew all their names for the hills. The one to the north is Foremast Hill. Three hills run south from there, fore, main, and mizzen. The big middle one, with the cloud over it, is usually called the Spy-glass. Pirates kept a lookout there while they cleaned their ships in the anchorage, if you'll pardon me, sir.
        - id: ch01-b08
          speaker: captain_smollett
          text: >-
            I have a chart. Take a look and tell me if this is the same place.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Silver's eyes blazed when he took the chart. But the paper looked fresh, and I knew at once that he would find nothing. This was not the map we had taken from Billy Bones's chest. It was an exact copy, complete with every name, height, and depth of water. Only the red crosses and the handwritten notes were missing. Silver must have been bitterly disappointed. Even so, he had enough control to hide every sign of it.
        - id: ch01-b10
          speaker: long_john_silver
          text: >-
            Yes, sir, this is certainly the place, and it's drawn very neatly. I wonder who made it. The pirates couldn't have managed work like this. Ah, there it is, Captain Kidd's Anchorage. That's what my old shipmate called it. A strong current runs along the south and then heads north up the west coast. You were right to keep us to windward of the island, sir. That is, if you mean to enter the anchorage and clean the ship. You won't find a better place for it anywhere around here.
        - id: ch01-b11
          speaker: captain_smollett
          text: >-
            Thank you. I may ask for your help later. You can go now.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I was amazed by the cool way Silver admitted that he knew the island. Then I saw him coming toward me, and my surprise turned to fear. Of course, he had no idea that I had overheard his council from inside the apple barrel. But by then, his cruelty, his deceit, and his power over the other men had filled me with horror. When he laid his hand on my arm, I could barely hide a shudder.
        - id: ch01-b13
          speaker: long_john_silver
          text: >-
            Ah, Jim, this is a fine island for a lad to explore. You can swim, climb trees, and hunt goats. You'll scramble up those hills like a goat yourself. Why, just looking at the place makes me feel young again. I nearly forgot my wooden leg! It's grand to be young and have all ten toes. Whenever you want to go exploring, ask old John. I'll pack you something to eat along the way.
        - id: ch01-b14
          speaker: narrator
          text: >-
            He gave my shoulder the friendliest slap, then hobbled forward and went below.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Captain Smollett, the squire, and Dr. Livesey were talking together on the quarterdeck. I was desperate to tell them my story, but I dared not interrupt them openly. While I searched my mind for some believable excuse to approach them, Dr. Livesey called me to his side. He had left his pipe below. Since he could hardly do without tobacco, he meant to send me after it. The moment I was close enough to speak without anyone overhearing, I rushed out my warning.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Doctor, I need to talk to you. Get the captain and the squire into the cabin, then find some excuse to send for me. I have terrible news.
        - id: ch01-b17
          speaker: narrator
          text: >-
            His face changed for a moment. Then he had himself under control again.
        - id: ch01-b18
          speaker: doctor_livesey
          text: >-
            Thank you, Jim. That's all I needed to know.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He said it loudly, as though I had only answered an ordinary question. Then he turned away and went back to the other two. They spoke quietly for a while. No one jumped, raised his voice, or even whistled. Still, it was plain that the doctor had passed on my request. The next thing I heard was the captain giving Job Anderson an order. A moment later, the call went out for every hand to come on deck.
        - id: ch01-b20
          speaker: captain_smollett
          text: >-
            Men, I have something to tell you. The land ahead is the place we've been sailing for. Mr. Trelawney, who is as generous as we all know, just asked how you have done your work. I told him that every man aboard has done his duty, below and aloft, as well as any captain could ask. So he, the doctor, and I are going down to the cabin to drink to your health and good luck. Grog will be served to you, so you can drink to ours. I call that a handsome thing. If you agree, give a proper sea cheer for the gentleman who offered it.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The cheer came at once, just as anyone would have expected. But it rang out so full and hearty that I could scarcely believe these very men were secretly plotting to murder us.
        - id: ch01-b22
          speaker: long_john_silver
          text: >-
            One more cheer for Captain Smollett!
        - id: ch01-b23
          speaker: narrator
          text: >-
            They gave that cheer just as eagerly. Then the three gentlemen went below. Before long, a message came forward that Jim Hawkins was wanted in the cabin.
        - id: ch01-b24
          speaker: narrator
          text: >-
            I found all three men seated around the table. A bottle of Spanish wine and some raisins stood before them. The doctor was smoking, and his wig lay in his lap. I knew that was a sure sign he was deeply upset. The stern window stood open because the night was warm. Through it, I could see the moon shining behind us on the ship's long wake.
        - id: ch01-b25
          speaker: squire_trelawney
          text: >-
            All right, Hawkins. You have something to tell us. Go ahead.
        - id: ch01-b26
          speaker: narrator
          text: >-
            I obeyed. As briefly as I could, I told them every detail of Silver's conversation in the apple barrel. No one interrupted me until I had finished. None of the three made so much as a movement. From the first word to the last, they kept their eyes fixed on my face.
        - id: ch01-b27
          speaker: doctor_livesey
          text: >-
            Sit down with us, Jim.
        - id: ch01-b28
          speaker: narrator
          text: >-
            They made room for me at the table, poured me a glass of wine, and filled both my hands with raisins. Then all three men drank to my health, one after another. Each gave me a bow and thanked me for my good luck, my courage, and the service I had done them.
        - id: ch01-b29
          speaker: squire_trelawney
          text: >-
            Captain, you were right and I was wrong. I've made a fool of myself. Give the orders, and I'll follow them.
        - id: ch01-b30
          speaker: captain_smollett
          text: >-
            No more than I have, sir. Whenever a crew plans a mutiny, someone usually shows a warning sign. A captain with eyes can spot the danger and act. But this crew has fooled me completely.
        - id: ch01-b31
          speaker: doctor_livesey
          text: >-
            With your permission, Captain, that is Silver's doing. He is an extraordinary man.
        - id: ch01-b32
          speaker: captain_smollett
          text: >-
            He'd look extraordinary hanging from a yardarm, sir. But talk won't help us. I see three or four points we need to consider. With Mr. Trelawney's permission, I'll lay them out.
        - id: ch01-b33
          speaker: squire_trelawney
          text: >-
            You are the captain, sir. The floor is yours.
        - id: ch01-b34
          speaker: captain_smollett
          text: >-
            First, we have to go on, because we cannot turn back. If I ordered the ship around now, the men would rise against us at once. Second, we still have some time, at least until the treasure is found. Third, there are loyal hands aboard. Sooner or later, this will come to a fight. I propose that we use the time we have and choose the moment ourselves. We can strike on a day when they least expect it. Mr. Trelawney, can we count on the servants you brought from home?
        - id: ch01-b35
          speaker: squire_trelawney
          text: >-
            As surely as you can count on me.
        - id: ch01-b36
          speaker: captain_smollett
          text: >-
            That makes three. Add the four of us here, including Hawkins, and we have seven. What about the honest sailors?
        - id: ch01-b37
          speaker: doctor_livesey
          text: >-
            Trelawney's own recruits are the likeliest ones. He hired them before he met Silver.
        - id: ch01-b38
          speaker: squire_trelawney
          text: >-
            No. Hands was one of mine.
        - id: ch01-b39
          speaker: captain_smollett
          text: >-
            I thought I could trust Hands too.
        - id: ch01-b40
          speaker: squire_trelawney
          text: >-
            And every one of them is an Englishman! I could almost blow up the ship myself.
          emotion: angry
        - id: ch01-b41
          speaker: captain_smollett
          text: >-
            Gentlemen, I don't have much comfort to offer. For now, we must lie low and keep a sharp lookout. I know how hard that is for any man. It would feel better to fight and settle things at once. But we have no choice until we know which men are truly ours. So we wait, watch, and hope the right moment comes.
        - id: ch01-b42
          speaker: doctor_livesey
          text: >-
            Jim can help us more than anyone. The men speak freely around him, and he notices things.
        - id: ch01-b43
          speaker: squire_trelawney
          text: >-
            Hawkins, I have tremendous faith in you.
        - id: ch01-b44
          speaker: narrator
          text: >-
            That left me feeling desperate, because I felt completely helpless. Yet by a strange chain of events, our safety truly did come through me. For now, no matter how much we talked, we knew we could trust only seven people out of twenty-six. One of those seven was a boy. That left six grown men on our side against their nineteen.
