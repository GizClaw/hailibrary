audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    captain_smollett:
      display_name: 斯莫列特船长
      tts:
        delivery: 严肃克制，判断谨慎，说话干脆而有权威
        timbre: 冷峻坚实
        pace: 稳健
        pitch: 中低
    silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑爽朗，善于用水手口吻取信于人，激动时夸张有力
        timbre: 洪亮厚实，带一点粗粝感
        pace: 灵活明快
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静清醒，措辞从容而判断明确
        timbre: 温和清晰
        pace: 从容
        pitch: 中
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 海岛现身
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 甲板上猛然响起一片脚步声。我听见人们从船舱和前舱跌跌撞撞地涌上来。我赶紧溜出苹果桶，躲到前帆后面，又折回去绕向船尾。等我跑上露天甲板，正好跟亨特和利弗西医生一起奔到上风一侧的船头。
        - id: ch01-b02
          speaker: narrator
          text: 全船的人都已经聚在那里。月亮刚刚升起，一带浓雾也随之散开。西南方出现两座低矮的小山，相隔大约两英里。它们后面还耸着第三座更高的山，峰顶仍埋在雾里。三座山都尖尖的，像三个圆锥。
        - id: ch01-b03
          speaker: narrator
          text: 我看着这一切，脑子里像在做梦。前一两分钟的惊吓实在太可怕，我还没有缓过来。这时，斯莫列特船长发出一道道命令。伊斯帕尼奥拉号朝风吹来的方向转近了两个罗经点，如今沿着一条正好能从海岛东面驶过的航线前进。
        - id: ch01-b04
          speaker: captain_smollett
          text: 帆索都收好了。伙计们，你们有谁见过前面那片陆地？
        - id: ch01-b05
          speaker: silver
          text: 我见过，先生。从前我在商船上当厨子，来这里取过淡水。
        - id: ch01-b06
          speaker: captain_smollett
          text: 锚地是在南面，藏在一座小岛后头，对吧？
        - id: ch01-b07
          speaker: silver
          text: 对，先生。大家管那座小岛叫骷髅岛。这里从前是海盗常来的地方。我们船上有个伙伴，知道他们给每处地方起的名字。北边那座叫前桅山。三座山由北往南排开，分别是前桅山、主桅山和后桅山。中间最高的那座，就是顶上还罩着云的那座，他们通常叫望远镜山。海盗把船开进锚地清理船底时，总在那儿安排人瞭望。他们清理船底的地方就是这里。请您原谅，先生。
        - id: ch01-b08
          speaker: captain_smollett
          text: 我这里有一张海图。你来认认，是不是这个地方。
        - id: ch01-b09
          speaker: narrator
          text: 高个子约翰接过海图，眼睛里顿时冒出光来。可是那张纸崭新，我一看就知道他非失望不可。这不是比利·博恩斯箱子里的地图，只是一份极准确的摹本。地名、高度、水深标记全都不缺，唯独没有那些红叉和手写的批注。西尔弗心里一定恼火极了，却仍有本事把情绪藏得严严实实。
        - id: ch01-b10
          speaker: silver
          text: 没错，先生，就是这儿。这图画得真漂亮，会是谁画的呢？那帮海盗恐怕没这个本事。您看，这里写着“基德船长锚地”，我那位船友也是这么叫的。南边有一道很强的海流，随后沿西岸往北去。您收紧帆索，留在海岛上风，做得再对不过。要是打算进港，把船拖上岸清理，这一带可找不到更好的地方。
        - id: ch01-b11
          speaker: captain_smollett
          text: 多谢你了，伙计。过后还要请你帮忙。现在去吧。
    - id: ch02
      title: 吉姆的消息
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 约翰竟能这样若无其事地承认自己熟悉海岛，我十分吃惊。他朝我走来时，我甚至有些害怕。他当然不知道我在苹果桶里听见了他们的密谋。可是我已经怕透了他的残忍、奸诈，还有他操纵众人的力量。他一把手搭在我胳膊上，我差点没藏住浑身的战栗。
        - id: ch02-b02
          speaker: silver
          text: 这座岛可真是个好地方，最适合你这样的孩子上岸玩了。你可以游水、爬树、猎山羊，还能像山羊一样爬上那些山顶。说得我都觉得自己又年轻啦，差点忘了这条木腿。年轻就是好，两只脚上有十根脚趾。你什么时候想去探险，只管来找老约翰。我给你包上一份点心，让你带着走。
        - id: ch02-b03
          speaker: narrator
          text: 他亲亲热热地拍了拍我的肩膀，一瘸一拐地走向船头，下舱去了。船长、乡绅和医生正在后甲板上说话。我急着把事情告诉他们，却不敢当众打断。正发愁找个什么说得过去的借口，医生把我叫了过去。他把烟斗落在下面了，又离不开烟，本想叫我去取。我一走近，确信别人听不见，马上开了口。
        - id: ch02-b04
          speaker: narrator
          text: 医生，请让我说句话。您把船长和乡绅带进船舱，再找个借口叫我过去。我有个可怕的消息。
        - id: ch02-b05
          speaker: narrator
          text: 医生的脸色变了一下，转眼又镇定下来。
        - id: ch02-b06
          speaker: doctor_livesey
          text: 谢谢你，吉姆。我想知道的就是这些。
        - id: ch02-b07
          speaker: narrator
          text: 他故意说得很响，仿佛刚才只是问了我一件普通的事。随后，他脚跟一转，回到另外两个人身边。三个人低声谈了片刻。谁也没有惊跳，没有抬高声音，连表示吃惊的口哨都没吹一声。不过我看得出来，医生已经转达了我的请求。紧接着，船长向乔布·安德森下令。哨声响起，所有船员都被召上了甲板。
        - id: ch02-b08
          speaker: captain_smollett
          text: 伙计们，我有话要说。我们望见的陆地，就是大家一路要找的地方。特里劳尼先生一向慷慨，这你们都知道。他刚才问我，大伙儿干得怎么样。我告诉他，船上每个人都尽了本分。不论在甲板还是桅杆高处，我从没见过谁能干得更好。所以，特里劳尼先生、医生和我要到下面喝一杯，祝你们健康走运。你们也会领到朗姆酒，祝我们健康走运。我觉得这事办得漂亮。你们要是也这么想，就为这位慷慨的先生好好欢呼一声！
        - id: ch02-b09
          speaker: narrator
          text: 欢呼声当然立刻响了起来，而且那样真诚，那样响亮，响彻了整条船。我不得不承认，自己简直无法相信，眼前这些人正是密谋着要取我们性命的那一伙。
        - id: ch02-b10
          speaker: silver
          text: 再为斯莫列特船长欢呼一声！
        - id: ch02-b11
          speaker: narrator
          text: 众人又扯开嗓子，十分卖力地欢呼起来。随后，三位先生一起下了船舱。没过多久，船头那边便传来话，说船舱里要见吉姆·霍金斯。
    - id: ch03
      title: 船舱里的报告
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我进去时，三个人正围桌而坐。桌上摆着一瓶西班牙葡萄酒，还有一些葡萄干。医生不停地抽着烟，假发搁在膝上。我知道，他只有心里很不安时才会这样。那晚天气很暖，船尾窗敞开着，从那里望出去，正能看见月光照在船后的航迹上。
        - id: ch03-b02
          speaker: squire_trelawney
          text: 好了，霍金斯。你有话要讲，尽管说吧。
        - id: ch03-b03
          speaker: narrator
          text: 我照乡绅的吩咐，把西尔弗那场谈话的每一个细节从头到尾讲了一遍，只是尽量说得简短。直到我全部讲完，三个人都没有插一句嘴，甚至没有动一下。从第一句话到最后一句，他们始终盯着我的脸。
        - id: ch03-b04
          speaker: doctor_livesey
          text: 吉姆，坐到这里来。
        - id: ch03-b05
          speaker: narrator
          text: 他们让我在桌边坐到三人身旁，给我倒了一杯酒，又把葡萄干塞满我的两只手。接着，三个人一个接一个地站起来，向我点头举杯。他们祝我健康，谢我帮了大忙，还称赞我的运气和勇气。
        - id: ch03-b06
          speaker: squire_trelawney
          text: 船长，你说对了，我错了。我承认自己是头蠢驴。从现在起，我听你的命令。
        - id: ch03-b07
          speaker: captain_smollett
          text: 先生，我并不比您好多少。凡是打算叛变的船员，我从没听说有哪一伙事先不露出些迹象。只要眼睛没瞎，就该看出祸事，及时采取防备。可是这一伙，我实在看不透。
        - id: ch03-b08
          speaker: doctor_livesey
          text: 船长，请恕我直说。那正是西尔弗的厉害之处。他真是个非同寻常的人物。
        - id: ch03-b09
          speaker: captain_smollett
          text: 先生，把他吊在桁端，那副模样才真叫非同寻常。不过说这些都是空话，不能帮我们脱困。我看眼下有三四件要紧事。特里劳尼先生若允许，我就一件件说出来。
        - id: ch03-b10
          speaker: squire_trelawney
          text: 你是船长，当然该由你说。
    - id: ch04
      title: 战前会议
      blocks:
        - id: ch04-b01
          speaker: captain_smollett
          text: 第一，我们只能继续往前，因为已经回不了头。我一下令掉转船头，他们马上就会起来叛变。第二，宝藏找到以前，我们还有时间。第三，船上还有忠诚的人。双方迟早免不了要交手。我的主意是抢在时机前头，先耐心等着，挑一个他们最想不到的好日子，由我们先动手。特里劳尼先生，您自己的家仆总信得过吧？
        - id: ch04-b02
          speaker: squire_trelawney
          text: 就像我信自己一样。
        - id: ch04-b03
          speaker: captain_smollett
          text: 那三个家仆可以算进去。再加上我们自己，还有这里的霍金斯，一共七个。那么，那些忠诚的水手又会是谁？
        - id: ch04-b04
          speaker: doctor_livesey
          text: 多半是特里劳尼原先亲自雇来的那几个人，也就是他还没遇见西尔弗时挑中的人。
        - id: ch04-b05
          speaker: squire_trelawney
          text: 不对。汉兹就是我挑的。
        - id: ch04-b06
          speaker: captain_smollett
          text: 我本来也以为汉兹信得过。
        - id: ch04-b07
          speaker: squire_trelawney
          text: 他们还全是英国人！先生，我真恨不得把整条船炸上天。
          emotion: angry
        - id: ch04-b08
          speaker: captain_smollett
          text: 各位先生，我能想出的最好办法，其实不算什么。请大家耐心等着，时时睁大眼睛。我知道，这样熬着很折磨人，痛快打一场反而更合心意。可在弄清谁是自己人以前，我们别无选择。眼下只能停住不动，耐心等待，盼着风来。这就是我的看法。
        - id: ch04-b09
          speaker: doctor_livesey
          text: 吉姆比任何人都更能帮我们。那些水手在他面前没有戒心，而且他很会留意事情。
        - id: ch04-b10
          speaker: squire_trelawney
          text: 霍金斯，我可是对你寄予厚望。
        - id: ch04-b11
          speaker: narrator
          text: 听到这话，我几乎绝望了，因为我觉得自己完全无能为力。然而后来种种阴差阳错，我们竟真的靠我脱离了险境。眼下无论怎样商量，二十六个人里，我们明知可以信赖的只有七个。这七人中还有一个孩子，就是我。也就是说，我们这边只有六个成年人，要对付他们十九个。
