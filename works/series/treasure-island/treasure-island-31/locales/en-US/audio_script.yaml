  chapters:
    - id: ch01
      title: "Breakfast and a Bargain"
      blocks:
        - id: ch01-b01
          speaker: long_john_silver
          text: >-
            Jim, I saved your life, and you saved mine. I won't forget that. I caught the doctor signaling you to run, and I saw you refuse him as clearly as if I'd heard you. That's one in your favor. It's the first bit of hope I've had since the attack went wrong, and I owe it to you. Now we're off hunting treasure under sealed orders, and I don't like it. You and me have to stick close, back to back. We'll save our necks yet, whatever fate and fortune throw at us.
        - id: ch01-b02
          speaker: narrator
          text: >-
            A man called from the fire that breakfast was ready. Soon we were scattered over the sand, eating biscuit and fried salt pork. The pirates had built a fire big enough to roast an ox. It grew so hot that they could approach only from the windy side, and even that took care. They had cooked perhaps three times what we could eat. One man gave an empty laugh and tossed the leftovers into the flames, making the fire blaze and roar.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I had never seen men care so little about tomorrow. They lived from one moment to the next. Between the wasted food and the sentries who slept at their posts, I could tell exactly what sort of men they were. They had courage enough to rush into one quick fight and finish it. But they were completely unfit for any struggle that demanded patience and discipline over many days. Even Silver ate steadily with Captain Flint on his shoulder and never said one word against their recklessness. That surprised me all the more because he had never seemed more cunning than he did that morning.
        - id: ch01-b04
          speaker: long_john_silver
          text: >-
            Aye, mates, you're lucky Barbecue has this head of his to do your thinking. I got the news I wanted. They've got the ship, sure enough. I don't know where they've put her yet. But once we find the treasure, we'll move fast and track her down. And since we've got the boats, mates, I'd say we still hold the better hand.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Silver kept talking with his mouth full of hot pork. He built up the men's hope and confidence, and I strongly suspected he was rebuilding his own at the same time.
        - id: ch01-b06
          speaker: long_john_silver
          text: >-
            As for our hostage, he's had his last talk with those dear friends of his. I got my news from him, and I thank him for that, but now it's finished. When we go after the treasure, I'll keep him on a rope. He's worth as much as gold if something goes wrong. Once we have both ship and treasure and we're safely out at sea together, then we'll have a friendly talk with Mr. Hawkins. After all his kindness, we'll make sure he gets his share.
        - id: ch01-b07
          speaker: narrator
          text: >-
            No wonder the men were cheerful after hearing such a plan. I was miserable. If Silver could do what he had just described, he would betray us again without a moment's hesitation. He was already a traitor twice over, and he still kept one foot in each camp. On the pirates' side, he might win riches and freedom. On our side, the best he could hope for was a narrow escape from the gallows. I had no doubt which future he would choose.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Yet even if events forced him to keep his promise to Doctor Livesey, we faced terrible danger. His followers already suspected him. The instant their suspicions hardened into certainty, Silver and I would have to fight for our lives against five strong, active sailors. He had only one leg, and I was only a boy. The thought of that fight frightened me almost as much as the thought of his betrayal.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Then there were all the mysteries. Why had my friends left the stockade? Why had they handed over the chart? And hardest of all, why had the doctor warned Silver to watch for trouble when he found the treasure? With those fears weighing on me, I could hardly eat. My heart was deeply uneasy when I set out behind my captors.
    - id: ch02
      title: "Across the Anchorage"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            We made a strange-looking party. Every one of us wore dirty sailor's clothes, and all but me were armed to the teeth. Silver carried two guns, one slung in front and one behind. A great cutlass hung at his waist, and each pocket of his square-tailed coat held a pistol. Captain Flint perched on his shoulder, chattering scraps of meaningless sea talk.
        - id: ch02-b02
          speaker: narrator
          text: >-
            A rope circled my waist. I followed the sea cook obediently while he held the loose end, sometimes in one hand and sometimes between his powerful teeth. I was being led along like a dancing bear.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The other men carried all sorts of loads. Some had picks and shovels, because tools for digging had been the very first things they brought ashore from the Hispaniola. Others hauled pork, bread, and brandy for our midday meal. I noticed that every bit of food and drink came from our supplies. That proved Silver had told the truth the night before. Without his bargain with the doctor, the mutineers would have been abandoned by the ship. They would have had only plain water and whatever they could shoot. Water was not much to their taste, sailors were rarely fine hunters, and men so short of food were not likely to have much gunpowder to spare.
        - id: ch02-b04
          speaker: narrator
          text: >-
            So we all straggled down to the beach, even the man with the wounded head, though he should have stayed in the shade. Two gigs waited there. The pirates' drunken foolishness showed in those boats too. One had a broken seat, and both were muddy and full of water. We divided ourselves between them and took both boats for safety, then pushed out across the anchorage.
        - id: ch02-b05
          speaker: narrator
          text: >-
            As we rowed, the men argued over the chart. The red cross was much too large to mark an exact place, and the note on the back was not entirely clear. It told us to find a tall tree on the shoulder of Spy-glass, a little north of north-northeast. Skeleton Island should lie east-southeast and a little east from there. The treasure was ten feet away.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The tall tree was our main guide, but there were many trees to choose from. Ahead, a plateau rose two or three hundred feet above the anchorage. Its northern end joined the long, sloping southern shoulder of Spy-glass. Farther south, the land climbed once more into the rough cliffs of the hill called the Mizzenmast. Pine trees of many heights crowded the top of the plateau. Here and there, a tree of some other kind rose forty or fifty feet clear above its neighbors. We could only decide which one Flint meant after we reached the ground and took the proper compass bearings.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Still, before we were halfway across, every man in the boats had chosen his own favorite tree. Only Long John shrugged and told them to wait until they got there.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Silver kept the rowing easy so no one would tire too soon. After a long crossing, we landed where the second river flowed down through a wooded cleft in Spy-glass. We turned left and started climbing toward the plateau.
    - id: ch03
      title: "Bones Beneath the Pine"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At first, deep mud and a tangled mat of marsh plants slowed us badly. Little by little, the hill grew steeper. The ground became stony under our feet, and the trees stood farther apart. We were entering one of the most pleasant parts of the island. Strong-smelling broom and many flowering shrubs had nearly replaced the grass. Thickets of green nutmeg trees appeared here and there among the red columns and broad shadows of the pines. The spice of the nutmegs mixed with the scent of the other plants. Fresh air moved around us, and beneath the direct blaze of the sun, it brought wonderful relief to all our senses.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The men spread out like a fan, shouting and leaping this way and that. Silver and I came well behind them near the middle. I was tied to his rope while he drove himself through the sliding gravel, breathing hard. Now and then I had to give him a hand, or he would have lost his footing and tumbled backward down the hill.
        - id: ch03-b03
          speaker: narrator
          text: >-
            We had gone about half a mile and were nearing the top when the man farthest to the left cried out in terror. He shouted again and again. The others began running toward him.
        - id: ch03-b04
          speaker: morgan
          text: >-
            He can't have found the treasure. That's clear up at the top.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Morgan hurried past us from the right. When we reached the place, we found something very different from treasure. A human skeleton lay beneath a good-sized pine with a few scraps of clothing still around it. A green creeper had wound among the bones and even lifted some of the smaller ones. For a moment, a chill seemed to pass through every heart.
        - id: ch03-b06
          speaker: george_merry
          text: >-
            He was a sailor. At least, what's left of his clothes is proper sea cloth.
        - id: ch03-b07
          speaker: narrator
          text: >-
            George Merry had gone closer than the others and was examining the rags.
        - id: ch03-b08
          speaker: long_john_silver
          text: >-
            Aye, most likely. You wouldn't expect to find a bishop here. But look at the way those bones are lying. That isn't natural.
        - id: ch03-b09
          speaker: narrator
          text: >-
            A second look showed that the body could hardly have fallen that way by itself. Some of the bones were out of place. Perhaps birds had moved them while feeding on the body, or perhaps the vine had shifted them as it slowly grew over the remains. Apart from that disorder, the skeleton lay in a perfectly straight line. Its feet pointed one way. Its arms reached above its head like a diver's, and the hands pointed exactly the opposite way.
    - id: ch04
      title: "Flint's Pointer"
      blocks:
        - id: ch04-b01
          speaker: long_john_silver
          text: >-
            I've got an idea in this old numbskull of mine. Here's the compass, and there's the top point of Skeleton Island sticking out like a tooth. Take a bearing along the line of those bones, will you?
        - id: ch04-b02
          speaker: narrator
          text: >-
            One of the men set the compass and looked along the line made by the bones. Silver's guess was right. The skeleton pointed straight toward the tip of Skeleton Island, and the compass showed east-southeast and a little east, exactly as the writing on the chart said.
        - id: ch04-b03
          speaker: long_john_silver
          text: >-
            I knew it! This man is a pointer. Follow that line uphill and we'll reach the Pole Star and the merry dollars. But thunder, thinking about Flint turns me cold inside. This is one of his jokes, no question. Flint came here alone with six men. He killed every one of them. Then he dragged this fellow here and laid him out by compass. Those are long bones, and the hair was yellow. Aye, this must be Allardyce. You remember Allardyce, Tom Morgan?
        - id: ch04-b04
          speaker: morgan
          text: >-
            Aye, I remember him. He owed me money, and he took my knife ashore with him.
        - id: ch04-b05
          speaker: first_mutineer
          text: >-
            Then where's his knife? Flint wasn't one to rob a sailor's pockets, and the birds wouldn't carry it off.
        - id: ch04-b06
          speaker: long_john_silver
          text: "By thunder, that's true!"
        - id: ch04-b07
          speaker: george_merry
          text: >-
            There's nothing here. Not a copper coin, not even a tobacco box. That doesn't look right to me.
        - id: ch04-b08
          speaker: long_john_silver
          text: >-
            No, it doesn't look right, and I don't like it. Great guns, mates, if Flint were alive, this would be a dangerous place for us. There were six of them, and there are six of us. Now they're nothing but bones.
        - id: ch04-b09
          speaker: morgan
          text: >-
            I saw him dead with my own eyes. Billy took me in to see him. Flint lay there with pennies over his eyes.
        - id: ch04-b10
          speaker: bandaged_pirate
          text: >-
            Dead, aye. He's gone below for certain. But if any spirit ever walked, Flint's would. Dear heart, he died a terrible death.
          emotion: fearful
        - id: ch04-b11
          speaker: second_mutineer
          text: >-
            That he did. One moment he raged, the next he yelled for rum, and then he sang. "Fifteen Men" was the only song he knew, mates. I've never liked hearing it since. The day was burning hot, and the window stood open. That old song came out clear as anything, though death was already on him.
          emotion: fearful
        - id: ch04-b12
          speaker: long_john_silver
          text: >-
            Enough. Stow that talk. He's dead, and dead men don't walk. Not in daylight, anyway, you can count on that. Worry never helped anyone. Move on and find the doubloons.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Silver's command got us moving again. But the sight of those bones had changed the whole party. Even under the hot sun and the broad, staring daylight, the pirates no longer scattered through the woods or shouted as they ran. They stayed side by side now, keeping close to one another, and when they spoke, they lowered their voices. Fear of the dead buccaneer had settled heavily over them.
