audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    tom_morgan:
      display_name: 汤姆·摩根
      tts:
        delivery: 老水手般粗野冲动，底气不足时仍强撑着
        timbre: 苍老干涩的男声
        pace: 急促
        pitch: 中低
    yellow_eyed_pirate:
      display_name: 乔治·梅里
      tts:
        delivery: 表面恭敬、实则强硬，照着海盗规矩咬字说话
        timbre: 阴沉偏冷的男声
        pace: 不紧不慢
        pitch: 中低
    unnamed_pirate:
      display_name: 一名海盗
      tts:
        delivery: 粗声粗气，面对医生时收敛而谨慎
        timbre: 沙哑的成年男声
        pace: 中等
        pitch: 中低
    second_unnamed_pirate:
      display_name: 另一名海盗
      tts:
        delivery: 久经海上的粗野口吻，谈起旧日恐怖时声音发紧
        timbre: 粗粝的成年男声
        pace: 偏慢
        pitch: 中低
    bandaged_pirate:
      display_name: 头缠绷带的海盗
      tts:
        delivery: 受伤后虚弱多疑，提到鬼魂时惶恐不安
        timbre: 发虚的成年男声
        pace: 稍慢
        pitch: 中
  chapters:
    - id: ch01
      title: 背靠背
      blocks:
        - id: ch01-b01
          speaker: long_john_silver
          text: 吉姆，我救过你，你也救了我，这份情我忘不了。医生挥手叫你逃，我拿眼角瞧见了。你不肯走，我也看得一清二楚。昨晚进攻失败以后，我还是头一次看见一点希望，而这全靠你。眼下咱们还得去寻宝，连他们葫芦里卖的什么药都不知道，我可不喜欢。你我得紧紧靠在一处，背对着背。管它命运怎么折腾，咱俩总得保住自己的脖子。
        - id: ch01-b02
          speaker: narrator
          text: 火堆那边有人喊早饭好了。我们很快便散坐在沙地上，吃起饼干和煎咸肉。那帮人烧了一堆足够烤牛的大火，热得吓人。就算站在上风口，也得小心才能靠近。他们煮的东西够我们吃上三顿，却有人空洞地干笑一声，把剩下的全扔进火里。火焰吞下这堆不寻常的燃料，又呼呼咆哮起来。我从没见过这样不管明天的人。他们有一顿吃一顿，任意糟蹋食物，连负责放哨的人也会倒头睡着。要他们狠狠干一仗，打完就走，他们倒有胆量。可若是长久作战，他们一点也不顶用。
        - id: ch01-b03
          speaker: narrator
          text: 西尔弗肩上蹲着弗林特船长，只顾低头吃饭，对这种胡闹一句责备也没有。这越发让我惊讶，因为那时的他，比我见过的任何时候都更有心计。
        - id: ch01-b04
          speaker: long_john_silver
          text: 伙计们，你们运气不错，还有烤肉架子这颗脑袋替大家想办法。我要的东西已经弄到了。船确实在他们手里，藏在哪儿，我暂时还不知道。等找到宝藏，咱们就赶快行动，把船搜出来。小艇还在咱们手上，所以占上风的还是咱们。
        - id: ch01-b05
          speaker: narrator
          text: 他嚼着滚烫的咸肉，嘴里还是说个不停。他把大家的希望和信心又说了回来。我甚至觉得，他也在拿这番话给自己打气。
        - id: ch01-b06
          speaker: long_john_silver
          text: 再说咱们的人质。他跟那些心肝宝贝说话，这回就是最后一次。我从他嘴里得到了消息，这一点得谢谢他，可也就到这里啦。去寻宝时，我会用绳子牵着他。在那以前，咱们得像看住黄金一样把他看牢，免得出了意外。等船和宝藏都归了咱们，大伙儿快活地出了海，再慢慢劝霍金斯先生入伙。看他帮过咱们的份上，当然也会分他一份。
        - id: ch01-b07
          speaker: narrator
          text: 海盗们听完都高兴起来，我却彻底灰了心。这个计划真能办成，已经当过两次叛徒的西尔弗绝不会犹豫，一定会照办。他仍旧一只脚踩在一边，两边都给自己留着退路。他若跟我们走，最好的结果也不过是逃过绞刑。若跟海盗走，却能得到财富和自由。他会怎么选，根本不用猜。
        - id: ch01-b08
          speaker: narrator
          text: 退一步说，就算形势逼得他必须对利弗西医生守信，危险也没有少。只要手下人的怀疑变成了确信，认定他已经变节，他和我就得为活命拼死迎战五个强壮灵活的水手。他是个瘸子，我只是个孩子，怎么敌得过他们？
        - id: ch01-b09
          speaker: narrator
          text: 何况朋友们的举动还是个谜。他们为什么无缘无故放弃木屋，又为什么莫名其妙交出地图？更难懂的是医生留给西尔弗的那句警告，找到宝藏时，当心暴风骤起。两重危险和这些疑团全压在心上，那顿早饭在我嘴里一点滋味也没有。后来我跟在俘虏我的人身后出发寻宝时，一颗心更是七上八下。
    - id: ch02
      title: 地图上的高树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要是当时有人看见，一定会觉得我们这支队伍古怪极了。人人穿着肮脏的水手服，除了我，全都武装到牙齿。西尔弗胸前背后各挂着一支枪，腰上别一把大弯刀，方下摆外套的两个口袋里还各有一把手枪。为了让模样更离奇，弗林特船长还蹲在他肩上，没完没了地咕哝几句不知所谓的航海话。我腰里拴着绳子，乖乖跟在船上厨子后面。绳子松着的那一头，他有时攥在空着的手里，有时用结实的牙齿咬住。那样子活像他牵着一头跳舞熊。
        - id: ch02-b02
          speaker: narrator
          text: 其余人也都背着东西。有的扛十字镐和铁锹，这正是他们最早从“伊斯帕尼奥拉号”搬上岸的必需品。有的带着猪肉、面包和白兰地，留作午饭。我看得出来，那些食物全来自我们的储藏，西尔弗昨夜说得没错。他要是没有跟医生谈成条件，船又抛下了他们，这伙叛乱者便只能喝清水，靠打猎填肚子。可他们不爱喝水，水手通常又打不准猎物。食物已经短缺，想必他们也舍不得拿不多的火药去打猎。
        - id: ch02-b03
          speaker: narrator
          text: 大家装备停当，一起动身。就连那个脑袋受伤、本该待在阴凉处休养的人也来了。我们稀稀落落，一个接一个来到海滩。两艘小艇等在那里，上面同样留着海盗醉酒胡闹的痕迹。一艘的坐板坏了，两艘都满是泥，船舱里的积水也没人舀掉。为了稳妥起见，我们得把两艘都带走，于是分开坐上去，划进了锚地。
        - id: ch02-b04
          speaker: narrator
          text: 划船过去的路上，大伙儿议论起地图。红十字画得太大，根本没法准确指路。背后的注记也说得含含糊糊。各位或许还记得，上面一共写了三项。第一项是，高树，望远镜山山肩，方位在东北偏北以北一点。第二项是，骷髅岛东南偏东再偏东。最后一项只有三个字，十英尺。
        - id: ch02-b05
          speaker: narrator
          text: 最要紧的标记显然是那棵高树。锚地前方横着一片二三百英尺高的高地。往北，它连着望远镜山向南倾斜的山肩。往南，它又重新隆起，成了遍布峭壁、崎岖不平的后桅山。高地顶上密密长着高低不同的松树。这里一棵，那里一棵，偶尔夹着别的树木，比邻近的树高出四五十英尺。究竟哪一棵才是弗林特所说的高树，只有亲自走到那里，再用罗盘测过才知道。
        - id: ch02-b06
          speaker: narrator
          text: 可小艇还没划到一半，人人就选定了自己中意的一棵。只有高个子约翰耸耸肩，叫他们到了地方再下结论。我们照他的吩咐，不紧不慢地划，免得划船的人过早耗尽力气。走了很长一段水路以后，终于在第二条河的河口上岸。那条河从望远镜山一道长满树木的峡谷里流下来。我们从河口朝左一转，沿着山坡往高地爬。
        - id: ch02-b07
          speaker: narrator
          text: 开头的路泥泞沉重，沼泽植物又纠缠在一起，严重拖慢了脚步。后来山坡渐渐变陡，脚下也有了石头，树林的模样跟着变了，树与树之间越来越空旷。眼前这片地方实在是岛上最宜人的一角。气味浓郁的金雀花和盛开的灌木几乎代替了青草。翠绿的肉豆蔻树一丛丛散落其间，松树赤红的树干从中挺起，投下大片阴影。肉豆蔻的辛香和花木的香气混在一起。阳光直照下来，空气却清新流动，叫人的感官都舒畅起来。
        - id: ch02-b08
          speaker: narrator
          text: 队伍散成扇形，大伙儿来回跳跃，高声吆喝。西尔弗和我走在中间，却落后很远。我被绳子拴住，他气喘吁吁，在不断滑动的碎石里费力挪动。我时不时还得扶他一把，不然他会脚下一滑，仰面摔下山去。
    - id: ch03
      title: 骨头指向哪里
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我们走了大约半英里，眼看要到高地边缘，最左边的海盗忽然惊恐地大喊。他一声接一声地叫，其他人全朝那边跑去。
        - id: ch03-b02
          speaker: tom_morgan
          text: 他发现的肯定不是宝藏。宝藏还在正上头呢。
        - id: ch03-b03
          speaker: narrator
          text: 老摩根说着，从右边匆匆越过我们。等我们也赶到那里，才发现那完全是另一回事。一棵相当高大的松树下面躺着一具人骨，身上只剩几片破衣服。绿色藤蔓已经把骸骨缠在里面，甚至将几根小骨头托离了地面。那一刻，我相信每个人心里都掠过一阵寒意。
        - id: ch03-b04
          speaker: yellow_eyed_pirate
          text: 这是个水手。至少他身上穿的是上好的水手衣料。
        - id: ch03-b05
          speaker: narrator
          text: 乔治·梅里比别人胆大。他走到近处，仔细查看那些破布。
        - id: ch03-b06
          speaker: long_john_silver
          text: 对，八成是个水手。你总不能盼着在这里找出一位主教吧。可这副骨头为什么这样摆着？这绝不是自然倒下的姿势。
        - id: ch03-b07
          speaker: narrator
          text: 再看一眼，尸体的姿势的确不可能是天然形成的。几处凌乱，也许是那些曾经啄食尸体的鸟弄出来的，也许是缓慢生长的藤蔓一点点裹住遗骸造成的。除此之外，那人躺得笔直。双脚指向一边，双手却像跳水的人那样举过头顶，笔直指向完全相反的方向。
        - id: ch03-b08
          speaker: long_john_silver
          text: 我这颗又老又木的脑袋忽然想到一件事。罗盘在这里，那边就是骷髅岛最高的尖顶，像牙齿一样伸出来。你们沿着骨头指的方向测一下方位。
        - id: ch03-b09
          speaker: narrator
          text: 有人立刻照他的意思，拿罗盘测了方位。尸骨果然径直指向骷髅岛，罗盘上读出的正是东南偏东再偏东。
        - id: ch03-b10
          speaker: long_john_silver
          text: 我就知道！这副骨头是个指针。沿着这条线一直往上，就是咱们的北极星，还有那些叫人快活的银元。可真见鬼，一想到弗林特，我肚子里就发冷。这一定是他开的玩笑，绝不会错。他和那六个人单独待在岛上，把他们一个不剩全杀了，再把这个人拖过来，照着罗盘摆好。我的老天爷！骨头这么长，头发以前又是黄的。没错，这准是阿勒代斯。汤姆·摩根，你还记得他吗？
        - id: ch03-b11
          speaker: tom_morgan
          text: 当然记得。他欠我钱，上岸时还把我的刀带走了。
        - id: ch03-b12
          speaker: unnamed_pirate
          text: 说到刀，他自己的刀怎么不在旁边？弗林特不会搜水手的口袋。鸟也不会把刀叼走吧。
        - id: ch03-b13
          speaker: long_john_silver
          text: 老天在上，你说得对！
        - id: ch03-b14
          speaker: yellow_eyed_pirate
          text: 这里什么也没剩下。一个铜板都没有，烟草盒也不见了。我看，这可不正常。
        - id: ch03-b15
          speaker: narrator
          text: 梅里一边说，一边还在骨头中间摸索。
        - id: ch03-b16
          speaker: long_john_silver
          text: 是不正常，而且不是好兆头。我的老天！伙计们，弗林特要是还活着，你我可就有大麻烦了。那时候他们有六个人，如今咱们也是六个。可他们现在只剩下骨头啦。
    - id: ch04
      title: 死去的海盗头子
      blocks:
        - id: ch04-b01
          speaker: tom_morgan
          text: 我用这双眼睛亲眼看见他死了。比利带我进去，他就躺在那里，两只眼睛上各压着一枚便士。
        - id: ch04-b02
          speaker: bandaged_pirate
          text: 死了，对，他当然死透了，早就下了地狱。可这世上要是真有鬼魂会走动，那肯定是弗林特的鬼。老天哪，他死得太惨了！
          emotion: fearful
        - id: ch04-b03
          speaker: second_unnamed_pirate
          text: 可不是吗。他一会儿发狂，一会儿喊着要朗姆酒，一会儿又唱歌。他只唱那首《十五个人》。伙计们，我跟你们说，从那以后，我一听见那首歌就不自在。那天天气热得要命，窗户开着。那首老歌从屋里传出来，我听得清清楚楚。那时候，死亡的绞盘声已经在他身上响起来了。
          emotion: fearful
        - id: ch04-b04
          speaker: long_john_silver
          text: 行了，别再说这些。他已经死了，死人不会走路，这我知道。至少大白天不会，你们放心。想得太多，连猫都会送命。往前走，找金币去。
        - id: ch04-b05
          speaker: narrator
          text: 我们的确又动身了。尽管头顶烈日炎炎，四周亮得刺眼，海盗们却再也不敢像先前那样散开，在树林里奔跑叫喊。他们肩并肩挤在一处，连说话也压低了嗓音。那个死去的海盗头子，已经把恐惧压进了每个人心里。
