audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: commanding, quick-witted, and rough-edged
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    doctor_livesey:
      display_name: Dr. Livesey
      tts:
        delivery: observant, decisive, and dryly humorous
        timbre: warm and steady
        pace: measured
        pitch: medium-low
    ben_gunn:
      display_name: Ben Gunn
      tts:
        delivery: restless, secretive, and eager
        timbre: thin and weathered
        pace: quick and uneven
        pitch: medium-high
    first_mutineer:
      display_name: First Mutineer
      tts:
        delivery: resentful and defiant
        timbre: rough and nasal
        pace: clipped
        pitch: medium
    second_mutineer:
      display_name: Second Mutineer
      tts:
        delivery: bitter and confrontational
        timbre: hard and hoarse
        pace: brisk
        pitch: medium-low
    third_mutineer:
      display_name: Third Mutineer
      tts:
        delivery: desperate and ragged
        timbre: strained and gravelly
        pace: uneven
        pitch: medium
    captain_flint:
      display_name: Captain Flint
      tts:
        delivery: sharp, repetitive, and piercing
        timbre: shrill and birdlike
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: The Treasure Leaves the Cave
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Early the next morning, we went to work. That great heap of gold had to travel almost a mile over land to the beach, then another three miles by boat to the Hispaniola. There were very few of us to do it. The three pirates still loose on the island did not worry us much. One sentry on the hillside could guard against a surprise, and we figured those men had already had enough fighting.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We worked as fast as we could. Gray and Ben Gunn carried loads back and forth by boat. While they were gone, the rest of us stacked treasure on the beach. Two gold bars tied to the end of a rope made a full load for a grown man, and even he had to walk slowly. I was not much help with the heavy lifting, so I spent each day in the cave, packing coins into the old bread bags.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The mix of coins reminded me of Billy Bones's old hoard, only this collection was far larger and more varied. I don't think I had ever enjoyed sorting anything so much. The money came from England, France, Spain, Portugal, and places much farther away. There were Georges and Louises, doubloons, double guineas, moidores, and sequins. Kings from a hundred years of European history stared up from them. Some eastern coins were marked with shapes like tangled string or spiderwebs. Some were round, some square, and some had holes through the middle so they could be worn around the neck. It seemed as if nearly every kind of money in the world was there. There were as many coins as autumn leaves. By day's end, my back hurt from bending and my fingers ached from sorting.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The work continued day after day. Each evening, we had another fortune safely aboard, yet a second fortune still waited in the cave for morning. All that time, we heard nothing from the three mutineers.
    - id: ch02
      title: Voices in the Dark
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On the third night, as far as I remember, the doctor and I were walking along the shoulder of the hill above the island's low ground. A sound came up from the deep darkness below us. It was half a shriek and half a song. The wind carried only a short piece of it, and then the night went silent again.
        - id: ch02-b02
          speaker: doctor_livesey
          text: "Heaven forgive them. That's the mutineers."
        - id: ch02-b03
          speaker: long_john_silver
          text: "They're all drunk, sir."
        - id: ch02-b04
          speaker: narrator
          text: >-
            Silver had come up behind us. By then, he was free to go where he pleased. No matter how often we pushed him away, he acted as though he were once again a trusted friend of the party. He accepted every slight with endless politeness and never stopped trying to win us over. Still, almost everyone treated him worse than a dog. Ben and I were the only real exceptions, and we had very different reasons. Ben Gunn remained terrified of his old quartermaster. I had some reason to be grateful to Silver, though I had also watched him plan another betrayal on the plateau. The doctor answered him sharply.
        - id: ch02-b05
          speaker: doctor_livesey
          text: "Drunk or out of their minds."
        - id: ch02-b06
          speaker: long_john_silver
          text: "Exactly, sir. And it makes precious little difference to you or me."
        - id: ch02-b07
          speaker: doctor_livesey
          text: >-
            No one would call you a humane man, Mr. Silver, so perhaps this will surprise you. If I knew they had gone mad, and I'm nearly certain at least one has a fever, I would leave this camp and take them my medical help, whatever the risk to my own skin.
        - id: ch02-b08
          speaker: long_john_silver
          text: >-
            Begging your pardon, sir, that would be a terrible mistake. You'd lose your life. You can count on that. I'm fully on your side now, and I don't want our party weakened. Least of all, I don't want anything to happen to you, after what I owe you. But those men down there couldn't keep their word even if they wanted to. Worse yet, they'd never believe you could keep yours.
        - id: ch02-b09
          speaker: doctor_livesey
          text: "No. We all know you're the one who keeps his word."
        - id: ch02-b10
          speaker: narrator
          text: >-
            That was nearly the last news we had of the three pirates. We heard one distant gunshot and guessed they were hunting. After a council, we decided we had to leave them on the island. Ben Gunn was delighted, and Gray strongly agreed. We left plenty of powder and shot, most of the salted goat meat, a few medicines, and other useful things. They also got tools, clothes, a spare sail, a little rope, and, because the doctor insisted, a generous supply of tobacco.
    - id: ch03
      title: Farewell to Treasure Island
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That was about the last thing we did on the island. The treasure was already aboard. We had taken on enough water and all the goat meat that remained, in case we ran into trouble. Then, one fine morning, we raised the anchor. It took nearly all our strength. We sailed out of North Inlet under the same flag Captain Smollett had flown and defended at the stockade.
        - id: ch03-b02
          speaker: narrator
          text: >-
            We soon learned that the three pirates had been watching us more closely than we knew. The narrow channel forced us close to the southern point. There they were, all three kneeling on a strip of sand with their arms raised, begging us to stop. The sight touched every one of us. But we could not risk another mutiny, and carrying them home only to be hanged would have been a cruel kind of mercy.
        - id: ch03-b03
          speaker: doctor_livesey
          text: >-
            We left supplies for you! I told you where to find them!
        - id: ch03-b04
          speakers: [first_mutineer, second_mutineer, third_mutineer]
          ensemble: chorus
          text: >-
            Please, for God's sake, have mercy! Don't leave us here to die!
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: >-
            They kept calling each of us by name and begging for mercy. But the Hispaniola held her course, and their voices began to fade behind us. Then one of the men sprang up with a hoarse cry. I could not tell which one. He threw his musket to his shoulder and fired. The ball whistled over Silver's head and tore through the mainsail.
        - id: ch03-b06
          speaker: narrator
          text: >-
            After that, we crouched behind the ship's sides. When I looked again, the men had vanished from the sand, and the strip of beach itself was nearly lost in the distance. That was the end of it. Before noon, to my great joy, Treasure Island's highest rock sank beneath the blue curve of the sea.
        - id: ch03-b07
          speaker: narrator
          text: >-
            We had so few hands that everyone aboard had to work. Only the captain stayed out of it, lying on a mattress in the stern and giving orders. He had recovered a great deal, but he still needed rest. We headed for the nearest port in Spanish America because we dared not sail all the way home without more sailors. Even so, shifting winds and two more gales wore us all out before we arrived.
    - id: ch04
      title: Silver Slips Away
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At sunset, we dropped anchor inside a beautiful gulf, sheltered by land. Boats crowded around us at once. They were filled with Black people, Mexican Indians, and people of mixed ancestry. Some sold fruit and vegetables. Others offered to dive for coins. After the island, those friendly faces, especially the Black faces among them, were a welcome sight. The sweet tropical fruit and the town lights shining across the water also made a wonderful change from all the blood and darkness we had left behind.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The doctor and the squire took me ashore for the first part of the night. They met the captain of an English warship and soon fell into conversation with him. We all went aboard his ship and enjoyed ourselves so much that dawn was breaking when we finally returned to the Hispaniola.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Ben Gunn stood alone on deck. The moment we climbed aboard, he twisted and squirmed through a confession. Silver was gone. Hours earlier, Ben had secretly helped him escape in one of the shore boats.
        - id: ch04-b04
          speaker: ben_gunn
          text: >-
            I only did it to save our lives. If that one-legged man had stayed aboard, he'd have finished us for certain.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Silver had not left empty-handed. Without anyone noticing, he had cut through a wall inside the ship and taken one sack of coins. It was worth perhaps three or four hundred guineas, enough to help him on his next journey. I think all of us were glad to be rid of him at so small a price.
    - id: ch05
      title: Home Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            To finish the story, we hired a few more sailors and had a good voyage home. The Hispaniola reached Bristol just as Mr. Blandly was starting to think about sending another ship after us. Only five of the men who had sailed away returned. Drink and the devil had certainly finished the rest, though we were not quite as badly off as the ship in the old song.
        - id: ch05-b02
          speaker: narrator
          text: |-
            With one man of her crew alive,
            What put to sea with seventy-five.
        - id: ch05-b03
          speaker: narrator
          text: >-
            We each received a large share of the treasure, and each of us used it wisely or foolishly, according to his nature. Captain Smollett retired from the sea. Gray saved his money. Then, eager to better himself, he studied his profession. He is now the mate and part owner of a fine full-rigged ship. He has also married and become a father.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Ben Gunn received a thousand pounds. He spent or lost it all in three weeks. To be exact, he was begging again on the twentieth day. After that, he was given a lodge to look after, just as he had feared back on the island. He still lives there. The country boys love him, though they also make plenty of jokes at his expense, and he is a fine singer in church on Sundays and saints' days.
        - id: ch05-b05
          speaker: narrator
          text: >-
            We never heard from Silver again. At last, that dangerous one-legged sailor passed completely out of my life. I imagine he found the Black woman he used to live with. Perhaps he still lives comfortably with her and Captain Flint. I hope so, because he has very little chance of comfort in the next world.
        - id: ch05-b06
          speaker: narrator
          text: >-
            As far as I know, the silver bars and the weapons still lie where Flint buried them. They will certainly stay there as far as I am concerned. Not even teams of oxen and heavy wagon ropes could pull me back to that cursed island. My worst dreams come when I hear the surf booming along its shores, or when I sit straight up in bed with Captain Flint's sharp voice ringing in my ears.
        - id: ch05-b07
          speaker: captain_flint
          text: "Pieces of eight! Pieces of eight!"
