audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 镇定果断，言语清楚利落，偶尔透出轻快的讥讽
        timbre: 温和而坚实的成年男声
        pace: 中等，发令时短促
        pitch: 中
    ben_gunn:
      display_name: 本·冈恩
      tts:
        delivery: 长久独居后的古怪跳脱，故意模仿幽灵时尖细飘忽
        timbre: 干瘦尖细的成年男声
        pace: 忽慢忽快
        pitch: 高
  chapters:
    - id: ch01
      title: 搬运宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "第二天一早，我们就忙开了。先要把一大堆金子从洞里运到近一英里外的海滩，再用小艇送到三英里外的“伊斯帕尼奥拉号”。我们只有这么几个人，这趟活可不轻。岛上还躲着三个叛乱者，不过派一名哨兵守住山肩，就不怕他们偷袭。我们也料定，他们早就打怕了。"
        - id: ch01-b02
          speaker: narrator
          text: "大家手脚不停。格雷和本·冈恩一次次把小艇划到船边，再划回岸上。他们不在时，其他人就从洞穴往海滩搬财宝，等小艇回来装载。两根金条拿绳子一兜，已经够一个壮年男子受的，他挑着走时巴不得一步比一步慢。我出不上这份力，只好整天待在洞里，把一枚枚钱币塞进面包袋。"
        - id: ch01-b03
          speaker: narrator
          text: "清点那些钱，倒是件快活事。它们像比尔·蓬斯留下的钱币一样杂，却多了不知多少倍。英国、法国、西班牙、葡萄牙的钱都有，乔治金币、路易金币、达布隆、双几尼、莫伊多尔、塞金，过去一百年里欧洲各国国王的脸都挤在里面。东方的钱币更奇特，花纹像乱线，也像蛛网。它们有圆有方，还有中间穿孔、像是能挂上脖子的。世上的钱币，大概差不多都来这里聚齐了。它们多得像秋叶，我弯腰弯到背痛，分拣分到手指也痛。"
        - id: ch01-b04
          speaker: narrator
          text: "我们一天接一天地搬。每晚送上船的都是一大笔财富，可到了第二天，仍有同样多的金银等在那里。那三个叛乱者始终没有消息。"
        - id: ch01-b05
          speaker: narrator
          text: "大约在第三天夜里，我和医生走到山肩上散步。脚下是全岛的低地，四周黑得看不清东西。风里忽然传来一小段怪声，又像叫喊，又像唱歌。才响了一会儿，夜里便重新安静下来。"
        - id: ch01-b06
          speaker: doctor_livesey
          text: "愿上天饶恕他们。是那几个叛乱者。"
        - id: ch01-b07
          speaker: long_john_silver
          text: "他们全都喝醉了，先生。"
        - id: ch01-b08
          speaker: narrator
          text: "西尔弗从身后接了话。这时他可以随意走动。别人天天给他冷脸，他却又摆出一副受人信任的随从模样，仿佛自己仍有不少特权。他受了轻慢也不恼，总是客客气气地讨好大家，那股耐心简直用不完。可除了仍然怕极了他的本·冈恩，还有多少欠他一点情的我，谁也没把他看得比狗高贵。即使是我，也忘不了他在高地上又想背叛我们的样子，所以也有理由比别人更厌恶他。医生听见他的声音，回答得很不客气。"
        - id: ch01-b09
          speaker: doctor_livesey
          text: "他们不是醉了，就是疯了。"
        - id: ch01-b10
          speaker: long_john_silver
          text: "一点不错，先生。可对您和我来说，醉了还是疯了，根本没分别。"
        - id: ch01-b11
          speaker: doctor_livesey
          text: "西尔弗先生，你当然不会要我夸你心地仁慈，所以我接下来的话也许会吓你一跳。要是能确定他们疯了，而且我几乎肯定至少有一个正在发烧，我就会离开营地。哪怕自己有性命危险，我也要去给他们看病。"
        - id: ch01-b12
          speaker: long_john_silver
          text: "恕我直说，先生，那样做可大错特错。您一定会送命。我现在跟您是一条心，不愿咱们的人再少一个，更别说少了您。我心里明白欠您多少。可下面那些人守不了信，哪怕他们有心也没用。还有，就算您愿意守信，他们也绝不会信您。"
        - id: ch01-b13
          speaker: doctor_livesey
          text: "是啊，谁最守信用，我们早就知道了。"
    - id: ch02
      title: 离开宝岛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "从那以后，我们几乎再没听见三个海盗的动静。远处只响过一次枪，我们猜他们是在打猎。大家坐下来商量，最后决定把三人留在岛上。本·冈恩一听就乐坏了，格雷也坚决赞成。我们没有让他们空手求生，特意留下许多火药弹丸、大部分腌山羊肉、几味药和其他必需品，还有工具、衣服、备用船帆和一两寻绳子。医生还坚持给他们留下一大包烟草。"
        - id: ch02-b02
          speaker: narrator
          text: "这是我们在岛上做的最后几件事之一。财宝早已装好，淡水和剩下的羊肉也搬上船，足够途中应急。一个晴朗的早晨，我们好不容易升起船锚，驶出了北汊湾。头顶那面旗仍旧迎风飘着，斯莫利特船长曾在木寨升起它，也曾在它下面作战。"
        - id: ch02-b03
          speaker: narrator
          text: "三个家伙一直盯着我们，盯得比大家以为的更紧。船穿过狭窄水道时，必须贴着南面的岬角航行。就在那片近得不能再近的沙嘴上，我们看见三个人跪成一团，双手高高举起，苦苦求我们带他们走。看他们落到那步田地，我们每个人心里都不好受。可带上他们，就得再冒一次叛乱的危险。即使他们不闹事，回到英国以后也只会被送上绞架。那样的搭救，实在残酷。"
        - id: ch02-b04
          speaker: narrator
          text: "医生朝岸上大喊，告诉他们物资留在什么地方。三个人却还在叫我们的名字，求我们看在上帝的分上发发善心，别把他们丢在岛上等死。船没有停，喊声很快就要追不上我们了。其中一人忽然嘶叫着跳起来，端起火枪。一颗子弹从西尔弗头顶飞过，在主帆上打了个洞。"
        - id: ch02-b05
          speaker: narrator
          text: "枪响以后，我们赶紧躲到舷墙后面，再也不敢站在甲板上露出身子。等我下一次探头时，三个人已经不见了，连那片沙嘴也快消失在越来越远的海面上。至少，他们的事到这里终于结束了。不到正午，宝岛最高的岩峰也沉进一圈蓝色海水里。我看着最后一点陆地消失，心里那份欢喜真是说不出来。"
        - id: ch02-b06
          speaker: narrator
          text: "船上缺人，谁都得动手，甲板上的活儿谁看见谁就得做，没有一个人能闲着。只有船长躺在船尾的褥垫上发号施令。他虽然好了许多，身体还是需要休养。我们不敢就凭这点人一路回家，只能先驶往西属美洲最近的港口。途中风向老跟我们作对，又接连刮了两场大风。等我们进港时，人人都累坏了。"
    - id: ch03
      title: 西尔弗逃走
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "日落时分，我们在一座四面环陆的美丽海湾里下锚。船才停住，岸边的小艇立刻从四面围了上来。黑人、墨西哥印第安人和混血人挤在艇上，有人卖新鲜的水果蔬菜，有人仰头招呼，说只要往水里扔几枚钱，他就潜下去捞。那些和气的面孔，尤其是黑人们的笑脸，甜美的热带水果，还有城中一盏接一盏亮起的灯，全都和宝岛上的日子截然不同。那段阴沉又血腥的生活，好像一下离得很远了。"
        - id: ch03-b02
          speaker: narrator
          text: "医生和乡绅带我上岸去消磨前半夜。他们遇见一位英国军舰的舰长，聊得很投机，又跟他登上军舰。我们过了一个痛快的夜晚，回到“伊斯帕尼奥拉号”旁时，天都亮了。"
        - id: ch03-b03
          speaker: narrator
          text: "甲板上只剩本·冈恩。他一看见我们，就扭着身子摆出各种怪模样，吞吞吐吐地认了错。西尔弗已经不在船上。几个钟头前，本故意放他乘岸边小艇溜走了。"
        - id: ch03-b04
          speaker: ben_gunn
          text: "我这么做，是为了保住大伙儿的命。那个独腿汉子要是还在船上，咱们一个也活不了。"
        - id: ch03-b05
          speaker: narrator
          text: "可西尔弗走时并非两手空空。他趁没人看见，在隔舱板上凿开一个洞，搬走一袋钱币，大约值三四百几尼。这些钱足够他继续四处漂泊了。我们只花这点代价便甩掉了他，我想大家都很满意。"
    - id: ch04
      title: 各人的结局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "后面的事，说起来就短了。我们在港口招到几个水手，人手总算够了，接下来的航程也很顺利。“伊斯帕尼奥拉号”抵达布里斯托尔时，布兰德利先生才刚打算给它配一条船，出海寻找我们的下落。当初跟着它离港的人，只有五个活着回来。那句老话说，酒和魔鬼害死了其余的人。用来说我们，真是再准不过。不过我们还没惨到另一首海员歌里的船那样。它载着七十五个人出海，到头来，船上只剩一个活人。"
        - id: ch04-b02
          speaker: narrator
          text: "财宝人人有份，分量都很丰厚。有人用得精明，有人花得糊涂，全看各人的本性。斯莫利特船长如今已经退下来，再也不出海。格雷不光把分到的钱好好留住，还忽然生出一股上进心，认真钻研起航海这一行。如今，他是一艘漂亮全帆装船的大副，也是船东之一。他已经娶妻成家，还有了自己的孩子。"
        - id: ch04-b03
          speaker: narrator
          text: "本·冈恩分到整整一千英镑。三个星期之内，那笔钱就被他花光或弄丢了。说准一点，其实只用了十九天，因为第二十天他已经回到街头讨饭。后来，有人给了他一份看守庄园大门的差事，正好应了他在岛上的担心。他一直住在那里，成了乡下孩子们很喜欢的人，虽然也常常成为他们取笑的对象。每逢星期日和圣徒纪念日，他就在教堂唱歌，还是个出了名的好歌手。"
        - id: ch04-b04
          speaker: narrator
          text: "西尔弗从此杳无音信。那个可怕的独腿海员，终于彻底离开了我的生活。我猜他找到了从前那个黑人老婆，说不定现在还跟她和弗林特船长一起，舒舒服服地过日子。我想，还是祝他如此吧。因为到了另一个世界，他大概很难得到安宁。"
        - id: ch04-b05
          speaker: narrator
          text: "弗林特埋下的银条和武器，据我所知还留在原地。我绝不会再去碰它们。哪怕套上公牛，用拉大车的粗缆来拖，也别想把我拖回那座受诅咒的岛。直到今天，我最可怕的梦，仍是听见海浪轰隆隆拍打岛岸。有时我会猛地从床上坐起，耳边还响着弗林特船长尖声叫喊：八里亚尔！八里亚尔！"
