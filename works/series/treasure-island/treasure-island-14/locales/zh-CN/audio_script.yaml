audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑爽朗，善于用水手口吻取信于人，激动时夸张有力
        timbre: 洪亮厚实，带一点粗粝感
        pace: 灵活明快
        pitch: 中低
    tom:
      display_name: 汤姆
      tts:
        delivery: 正直刚烈，紧张时嗓音发颤，表明立场时勇敢坚定
        timbre: 沙哑粗朴
        pace: 稍慢而有力
        pitch: 中低
  chapters:
    - id: ch01
      title: 陌生岛屿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我成功甩掉了高个子约翰，心里别提多得意。这下我有了闲心，开始仔细打量脚下这片陌生的土地。
        - id: ch01-b02
          speaker: narrator
          text: 我刚穿过一片泥泞的湿地。那里到处是柳树、香蒲，还有些从未见过的沼泽树木。再往前，地势忽然开阔起来。一片起伏的沙地足有一英里长，上面散落着几棵松树，还有许多枝干扭曲的怪树。它们的形状像橡树，叶子却像柳叶一样浅。沙地那一头立着一座山，两座嶙峋的怪峰正在阳光下闪闪发亮。
        - id: ch01-b03
          speaker: narrator
          text: 我生平头一次体会到探险的快乐。岛上一个人也没有。同船的人都被我留在后面，眼前只有不会说话的走兽和飞鸟。我在树间东走西看，常常碰见不认识的花，也不时看见蛇。有一条蛇从岩石上昂起头，冲我嘶嘶作响，那声音很像转动的陀螺。那时我还不知道，这东西能要人的命，而我听见的正是响尾蛇有名的响声。
        - id: ch01-b04
          speaker: narrator
          text: 后来，前面出现一大片狭长的怪树。我也是后来才知道，它们叫常青栎。它们沿着沙地贴地生长，像一丛丛荆棘。盘曲的树枝上挤满叶子，密得像一层茅草。林子从沙丘顶一路铺下来，越变越宽，树也越长越高，最后伸到长满芦苇的大沼泽边。最近的一条小河慢慢穿过沼泽，流进锚地。烈日把湿地晒得水汽蒸腾，远处望远镜山的轮廓隔着热雾不停晃动。
    - id: ch02
      title: 树丛里的密谈
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 香蒲丛里忽然乱了起来。一只野鸭嘎嘎叫着飞上天，紧接着又飞起一只。转眼间，整片沼泽上空全是盘旋尖叫的鸟。我马上猜到，一定有几个同船的人正沿着湿地走来。果然，远处很快传来低低的说话声。我越听，那声音就离得越近，也变得越清楚。
        - id: ch02-b02
          speaker: narrator
          text: 我吓坏了，赶紧爬到最近的常青栎下面，蹲在枝叶的遮掩里，像只老鼠一样一声不出。第二个人应了一句，先前那个人又接着说个不停。我听出那是西尔弗，另一个人偶尔才打断他。他们谈得十分认真，甚至有些凶狠，可具体说了什么，我还是听不见。
        - id: ch02-b03
          speaker: narrator
          text: 过了一会儿，两人好像停下脚步，也许还坐了下来。他们不再靠近，鸟群也渐渐安静，一只只落回沼泽里原来的地方。我这才想到，自己跟着这帮亡命徒上岸，本来已经够冒失了，要是连他们密谋的内容都不去偷听，那就更没有尽到责任。我应该借低矮的树丛藏住自己，尽量靠近他们。
        - id: ch02-b04
          speaker: narrator
          text: 凭着声音，再看看那几只仍在闯入者头顶惊慌盘旋的鸟，我很快找准了方向。于是我手脚并用，虽然爬得很慢，却始终没有停下。最后，我从叶丛的空隙里抬头望去，看见沼泽边有一小片绿色洼地，四周树木挤得很密。高个子约翰·西尔弗正和另一个水手面对面站在那里。
        - id: ch02-b05
          speaker: narrator
          text: 阳光毫无遮拦地直晒在他们身上。西尔弗把帽子扔在身旁的地上，宽大光滑的白净脸庞热得发亮。他仰头望着对面的人，像是在苦苦相劝。
        - id: ch02-b06
          speaker: silver
          text: 老兄，我真把你看得比金子还金贵，这话你尽管信！我要不是打心眼里喜欢你，何必跑来报信？事情已经定了，你想改也没用。我这是在救你的命。要是那几个狠家伙知道我来劝你，我会有什么下场，汤姆？你说，我会有什么下场？
        - id: ch02-b07
          speaker: narrator
          text: 对面的汤姆涨红了脸。他的嗓子哑得像乌鸦，声音也像绷紧的绳子一样发颤，可他说的话毫不退让。
        - id: ch02-b08
          speaker: tom
          text: 西尔弗，你年纪大，是个老实人，至少大家都这样说。你手里有钱，好多穷水手可没有。你也有胆量，不然就是我看错了。现在你倒要告诉我，你甘心让那帮混账牵着鼻子走？我不信！上帝看着我呢，我宁可丢掉一只手。要我背弃自己的职责……
    - id: ch03
      title: 沼泽里的惨叫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一阵突如其来的声音打断了汤姆。我刚发现一个忠诚的水手，偏在这时，另一个忠诚者的消息也从远处传来。沼泽深处先响起一声怒吼，紧接着又是一声，随后爆发出一阵骇人而漫长的惨叫。望远镜山的岩壁把它来回传了二十多遍。所有鸟同时振翅飞起，黑压压地遮住天空。
        - id: ch03-b02
          speaker: narrator
          text: 那声垂死的惨叫还在我脑中回响，四周却已经重新沉寂。鸟群落下时发出一片窸窣声，远处海浪低沉地轰鸣，午后的倦怠里只剩这两种声音。汤姆像一匹挨了马刺的马，猛地跳了起来。西尔弗却眼也不眨，仍然轻轻倚着拐杖，盯住同伴，像一条正要扑出去的蛇。
        - id: ch03-b03
          speaker: tom
          text: 约翰，你怎么能这样？
        - id: ch03-b04
          speaker: narrator
          text: 汤姆伸手去碰他。西尔弗猛然向后跃开一码，动作又快又稳，简直像个练熟了的杂技演员。
        - id: ch03-b05
          speaker: silver
          text: 别碰我！
          emotion: angry
        - id: ch03-b06
          speaker: tom
          text: 好啊，约翰·西尔弗，我不碰你。你要不是良心太黑，怎么会怕我？可看在上帝的分上，快告诉我，刚才那是什么声音？
        - id: ch03-b07
          speaker: narrator
          text: 西尔弗仍在笑，却比先前更加提防。他那张大脸上的眼睛缩得像针尖，亮得又像一小片玻璃。
        - id: ch03-b08
          speaker: silver
          text: 那个声音？哦，我猜是艾伦。
        - id: ch03-b09
          speaker: narrator
          text: 这一刻，汤姆忽然像个真正的英雄一样挺了起来。
        - id: ch03-b10
          speaker: tom
          text: 艾伦！愿他的灵魂安息，他是个真正的水手！约翰·西尔弗，我们做了这么多年的伙伴，可从现在起，我再也不是你的伙伴。我就算死得像条狗，也要为自己的职责而死。艾伦是你们杀的，对不对？有本事就杀了我，可我绝不会向你们低头！
          emotion: angry
    - id: ch04
      title: 第一次打击
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 说完，勇敢的汤姆立刻背对厨子，朝海滩走去。可他没能走出多远。约翰突然大叫一声，抓住头顶的树枝，从腋下抽出拐杖，用力掷了出去。沉重的拐杖尖正中汤姆后背，在两肩之间狠狠撞了一下。汤姆的双手猛地扬起，喉咙里挤出一声喘息，整个人扑倒在地。
        - id: ch04-b02
          speaker: narrator
          text: 谁也不知道他到底伤得有多重。听那声音，他的脊梁很可能当场就断了。可就算他还能活，也没有机会恢复。西尔弗少了一条腿，又没了拐杖，动作却仍像猴子一样灵活。他转眼扑到汤姆身上，把刀一直刺到刀柄，朝那毫无抵抗之力的身体连刺两下。我藏在树丛里，清楚听见他每次下刀时粗重的喘息。
        - id: ch04-b03
          speaker: narrator
          text: 我不知道真正昏过去是什么感觉。我只记得，接下来的一小会儿，整个世界忽然化作旋转的雾，从眼前飘走。西尔弗、鸟群，还有望远镜山高高的峰顶，全都颠倒过来，不停打转。各种钟声在我耳边乱响，远处也仿佛有人不停呼喊。
        - id: ch04-b04
          speaker: narrator
          text: 等我恢复清醒，那个恶魔已经重新夹好拐杖，戴上帽子。汤姆一动不动地躺在他面前的草地上，凶手却根本不看他，只拿一把草擦着染血的刀。其余一切都和刚才一样。太阳仍无情地照着水汽升腾的沼泽，也照着望远镜山高高的峰顶。我简直无法相信，就在片刻之前，一场谋杀真的发生在我眼前，一条人命已经被残忍地夺走。
        - id: ch04-b05
          speaker: narrator
          text: 约翰从口袋里掏出哨子，吹了几声高低不同的长音。哨声穿过灼热的空气，传到很远的地方。我当然不懂这个信号，可恐惧马上又醒了。更多人就要赶来，我也可能被发现。他们已经杀了两个忠诚的人。汤姆和艾伦之后，下一个会不会就是我？
    - id: ch05
      title: 拼命逃亡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我立刻从藏身处慢慢退出，尽量又快又安静地爬向树林较稀的地方。一路上，老海盗和他的同伙彼此呼喊，那危险的声音仿佛给我长了翅膀。我刚钻出灌木林就飞奔起来，这辈子从没跑得这样快。只要离那些杀人凶手越来越远，我根本顾不上方向。越跑，我越害怕，最后几乎发了疯。
        - id: ch05-b02
          speaker: narrator
          text: 还有谁会比我迷失得更彻底？等召集大家的炮声响起，我怎么敢回到小艇边，走进那群手上还沾着血的恶魔中间？他们一看见我，准会像扭断鹬鸟的脖子那样扭断我的脖子。我无缘无故不见了，不就说明我已经起疑，也知道了足以送命的秘密吗？我想，一切全完了。永别了，伊斯帕尼奥拉号！永别了，乡绅、医生和船长！如今，我不是活活饿死，就是死在叛徒手中。
        - id: ch05-b03
          speaker: narrator
          text: 我脑子里翻滚着这些念头，脚下还是不停地跑。等我无意间抬头，才发现自己已经来到那座双峰小山脚下。这里的常青栎隔得很开，树形也更高大，终于有了森林的模样。中间还散落着几棵松树，有的高五十英尺，有的接近七十英尺。连空气也比沼泽边清新得多。
        - id: ch05-b04
          speaker: narrator
          text: 就在这里，新的惊吓让我猛地停住脚步，心脏怦怦狂跳。
