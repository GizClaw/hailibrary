audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: vivid, thoughtful first-person storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: hearty, quick-witted, and commanding
        timbre: deep and robust
        pace: lively
        pitch: low
    tom:
      display_name: Tom
      tts:
        delivery: plainspoken, earnest, and resolute
        timbre: rough and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Strange Island
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I was so pleased to have slipped away from Long John that I began to enjoy myself. For the first time, I looked around with real interest at the strange country I had entered.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I had crossed wet ground crowded with willows, bulrushes, and strange swamp trees unlike any I knew. Now I came to the edge of open, rolling sand about a mile long. A few pines stood there among many twisted trees. They grew something like oaks, but their pale leaves looked more like willow leaves. On the far side of the open land rose a hill with two odd, rocky peaks shining brightly in the sun.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then I felt the joy of exploring. The island seemed empty. I had left my shipmates behind, and ahead of me there were only wild animals and birds. I wandered among the trees, turning this way and that. Strange flowers grew here and there. I saw snakes too. One lifted its head from a shelf of rock and hissed with a sound like a spinning top. I had no idea it was a deadly enemy, or that I was hearing the famous rattle.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Before long, I reached a long thicket of those oaklike trees. I later learned they were live oaks, or evergreen oaks. They spread low across the sand like brambles, with twisted branches and leaves packed together like a roof. The thicket ran down from a sandy hill. It grew taller as it went, all the way to a wide marsh full of reeds. Through that marsh, the nearest little river crept toward the anchorage. Steam rose from the wet ground in the fierce sun, and the shape of the Spy-glass shook in the haze.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Suddenly, the bulrushes came alive. One wild duck flew up quacking, then another. Soon a great cloud of birds hung over the whole marsh, screaming and circling. I knew at once that some of my shipmates must be coming along the edge of the wet ground. Sure enough, I soon heard a human voice, low and far away. As I listened, it came steadily closer and louder.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Fear took hold of me. I crawled beneath the nearest live oak and crouched there under cover, listening as quietly as a mouse.
        - id: ch01-b07
          speaker: narrator
          text: >-
            A second voice answered. Then the first began again, and now I knew it was Silver. He talked for a long time while the other man interrupted only now and then. Their voices sounded serious, almost fierce, but I could not make out a single word.
        - id: ch01-b08
          speaker: narrator
          text: >-
            At last, they seemed to stop moving, and perhaps they sat down. Their voices came no closer. Even the birds grew quieter and began settling into their places in the swamp again.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Then I realized I was forgetting why I had come ashore. I had been foolish enough to land with these desperate men. The least I could do was listen to their plans. My clear duty was to get as close as I could while the low trees kept me hidden.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Their voices told me which way to go. So did the few frightened birds still circling above the intruders. I dropped to all fours and moved steadily toward the sound, slow enough to stay hidden. At last, I raised my head to a gap in the leaves. I could see clearly down into a little green hollow beside the marsh, surrounded closely by trees. Long John Silver and another sailor stood there, facing each other in conversation.
    - id: ch02
      title: Silver and Tom
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The full sun beat down on them. Silver had tossed his hat onto the ground beside him. His broad, smooth, fair-haired face shone with heat as he lifted it toward the other man and pleaded with him.
        - id: ch02-b02
          speaker: long_john_silver
          text: >-
            Mate, I'm warning you because I think the world of you. You can count on that. If I hadn't taken to you from the start, would I be here risking my neck to help you? It's all settled now. You can't change a thing. I'm trying to save you, Tom. If one of the wild ones knew what I was doing, what do you think would happen to me?
        - id: ch02-b03
          speaker: narrator
          text: >-
            The other man was Tom. His face had gone red, and his rough voice shook like a rope pulled tight.
        - id: ch02-b04
          speaker: tom
          text: >-
            Silver, you're an old sailor. Folks call you honest. You've got money when plenty of good sailors have none, and I've always thought you were brave. Now you're telling me you'd let a rotten crew like that lead you astray? No. I don't believe it. As God sees me, I'd sooner lose my hand than turn against my duty—
        - id: ch02-b05
          speaker: narrator
          text: >-
            A sound cut him off. I had found one honest sailor, and at that very moment we learned there was another. Far out in the marsh came an angry cry. A second cry followed, then one terrible scream that went on and on. The rocks of the Spy-glass threw it back again and again. Every marsh bird rose at once, darkening the sky with the beat of its wings.
        - id: ch02-b06
          speaker: narrator
          text: >-
            That dying scream kept ringing in my mind long after silence returned and seemed to rule the island once more. Then only the birds rustling down again and the distant boom of waves against the shore broke the heavy stillness of the afternoon.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Tom jumped at the sound as if a spur had struck him. Silver never blinked. He stayed where he was, balanced lightly on his crutch and watching Tom like a snake ready to spring.
        - id: ch02-b08
          speaker: tom
          text: >-
            John!
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: >-
            Tom reached out his hand.
        - id: ch02-b10
          speaker: long_john_silver
          text: >-
            Keep your hands off me!
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            Silver sprang back about a yard, quick and sure as a trained acrobat.
        - id: ch02-b12
          speaker: tom
          text: >-
            Fine, I'll keep my hands off you, John Silver. If you're scared of me, your own black conscience is to blame. But for heaven's sake, tell me what that was.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Silver smiled, but he was more watchful than ever. His eye looked no bigger than a pinprick in that great face, and it flashed like a bit of glass.
        - id: ch02-b14
          speaker: long_john_silver
          text: >-
            That? Oh, I'd say that was Alan.
        - id: ch02-b15
          speaker: narrator
          text: >-
            At that, Tom blazed out like a hero.
        - id: ch02-b16
          speaker: tom
          text: >-
            Alan! Then may he rest in peace, because he was a true sailor. And you, John Silver, have been my mate for years, but you're no mate of mine now. If I die like a dog, I'll still die doing my duty. You killed Alan, did you? Then kill me too, if you can. I defy you!
          emotion: angry
    - id: ch03
      title: The First Blow
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The brave man turned his back directly on the cook and started walking toward the beach. He did not get far. With a shout, John grabbed a tree branch. He pulled the crutch from under his arm and hurled that clumsy weapon through the air.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The point struck poor Tom with terrible force, right between his shoulders. His hands flew up. He gave a choking gasp and fell.
        - id: ch03-b03
          speaker: narrator
          text: >-
            No one could ever say how badly that first blow hurt him. From the sound, it may have broken his back at once. He was given no chance to recover. Even without his leg or his crutch, Silver moved as quickly as a monkey. In an instant, he was on top of Tom. Twice he drove his knife all the way into the helpless body. From my hiding place, I heard Silver pant with every blow.
        - id: ch03-b04
          speaker: narrator
          text: >-
            I do not truly know what it means to faint. I only know that for a while, the whole world slipped away in a spinning mist. Silver, the birds, and the tall peak of the Spy-glass all whirled upside down before my eyes. Bells rang in my ears, mixed with faraway voices calling out.
        - id: ch03-b05
          speaker: narrator
          text: >-
            When my senses returned, the monster had collected himself. His crutch was under his arm again, and his hat was back on his head. Tom lay still on the grass in front of him. The murderer paid no attention to the body. He was wiping his bloody knife clean on a handful of grass.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Everything else looked just as it had before. The sun still burned down without mercy on the steaming marsh and the high mountain peak. Nothing in the bright afternoon seemed to have changed. I could hardly make myself believe that a murder had happened right before me, and that a man's life had been cruelly ended only moments ago.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Then John reached into his pocket, took out a whistle, and blew several different notes. They rang far across the hot air. I had no way to know what the signal meant, but my fear woke at once. More men would come. They might find me. Two honest sailors were already dead. After Tom and Alan, I might be next.
    - id: ch04
      title: Flight Through the Woods
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            I pulled myself free of the branches and began crawling back toward the more open woods as quickly and quietly as I could. Behind me, the old pirate and his companions called back and forth to one another. Every hail reminded me how close the danger was, and the sound gave me wings.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The moment I cleared the thicket, I ran harder than I had ever run before. I hardly cared where I was going, as long as it took me away from the murderers. With every step, my fear grew until it became a kind of madness.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Could anyone have been more completely lost? When the ship's gun fired, how could I go down to the boats and face those fiends, still fresh from murder? The first one who saw me might twist my neck as easily as a small bird's. They would notice I had stayed away. My absence alone would show them I was frightened, and that would tell them I had learned their deadly secret.
        - id: ch04-b04
          speaker: narrator
          text: >-
            I thought it was all over. Good-bye to the Hispaniola. Good-bye to the squire, the doctor, and the captain. I could see no way back to any of them. Nothing waited for me on that island except death by starvation or death at the hands of the mutineers.
        - id: ch04-b05
          speaker: narrator
          text: >-
            I was still running as those thoughts raced through my head. Without noticing, I had come close to the foot of the small hill with two peaks. Here the live oaks stood farther apart and rose more like forest trees. A few pines grew among them, some fifty feet high and others closer to seventy. The air smelled fresher than it had beside the marsh.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Then a new terror stopped me cold, my heart pounding.
