audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    abraham_gray:
      display_name: Abraham Gray
      tts:
        delivery: earnest and resolute
        timbre: sturdy and clear
        pace: moderate
        pitch: medium-low
  chapters:
    - id: ch01
      title: "XXII How I Began My Sea Adventure"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The mutineers did not come back. Not another shot came out of the woods. As the captain said, they had gotten their rations for the day. That left us alone, and for a while all was quiet. We could tend the wounded and make dinner. The squire and I cooked outside, danger or no danger. Even there, we could hardly tell what we were doing. The doctor's patients groaned so loudly that the sound filled us with horror.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Eight men had fallen in the fight, and only three still breathed. They were the pirate shot at the loophole, Hunter, and Captain Smollett. The first two had no hope. The pirate died while the doctor operated. We did everything we could for Hunter, but he never woke again. All day he lingered, breathing heavily like the old buccaneer back at the inn during his fit. The blow had crushed the bones in Hunter's chest, and his skull had broken when he fell. Sometime the next night, he died without a movement or a sound.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The captain was badly wounded, but his life was not in danger. Job Anderson's ball, the first shot to hit him, had broken his shoulder blade and grazed one lung. The other ball had only torn and shifted some muscles in his calf. The doctor said he would recover. For several weeks, though, he must not walk, move his arm, or even speak unless he had to.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The cut across my knuckles was nothing beside that. Doctor Livesey covered it with plaster, then pulled my ears for good measure.
        - id: ch01-b05
          speaker: narrator
          text: >-
            After dinner, the squire and the doctor sat beside the captain and talked things over. A little after noon, the doctor stood up. He took his hat and pistols, buckled on a cutlass, slipped the chart into his pocket, and put a musket over his shoulder. Then he crossed the north side of the palisade and strode off among the trees.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Gray and I sat at the far end of the blockhouse, where we could not overhear the officers. Gray pulled his pipe from his mouth. He was so astonished by what the doctor had done that he forgot to put it back.
        - id: ch01-b07
          speaker: abraham_gray
          text: >-
            In Davy Jones's name, has Dr. Livesey gone mad?
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: >-
            No. If anyone here has kept his senses, it's the doctor.
        - id: ch01-b09
          speaker: abraham_gray
          text: >-
            Well, shipmate, maybe he isn't mad. But if he's sane, then mark my words, I'm not.
        - id: ch01-b10
          speaker: narrator
          text: >-
            I figured the doctor had a plan. If I was right, he had gone to find Ben Gunn. Later, I learned that was true.
        - id: ch01-b11
          speaker: narrator
          text: >-
            But another idea was growing in my own head, and mine was nowhere near as sensible. The blockhouse was stifling. Outside, the little patch of sand blazed in the noon sun. I envied the doctor walking beneath cool trees, with birds around him and the clean smell of pine. I was stuck there with resin clinging to my clothes, blood everywhere, and dead men all around. I hated the place almost as much as I feared it.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That feeling only grew while I scrubbed the blockhouse and cleaned up after dinner. At last I found myself beside a bread bag with no one watching. I took my first step toward running off and filled both coat pockets with biscuits.
        - id: ch01-b13
          speaker: narrator
          text: >-
            I was a fool, and what I meant to do was foolish and far too bold. Still, I planned to take every precaution I could. If something happened to me, those biscuits would keep me from starving until well into the next day. Then I took two pistols. I already had powder and bullets, so I felt well armed.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The plan itself had some sense in it. I would follow the sandy spit that separated the eastern anchorage from the open sea. Then I would find the white rock I had noticed the night before and learn whether Ben Gunn had hidden his boat there. I still believe that was worth finding out. The trouble was, I knew no one would allow me to leave the enclosure. My only choice was to slip away without permission when nobody was looking. Going about it that way made the whole thing wrong. But I was only a boy, and my mind was made up.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Soon my chance came. The squire and Gray were helping with the captain's bandages. No one stood in my way. I dashed over the stockade and plunged into the thickest trees. Before anyone noticed I was missing, I had gone too far to hear them call.
        - id: ch01-b16
          speaker: narrator
          text: >-
            This was my second foolish act, and it was worse than the first. I had left only two healthy men to guard the house. Yet, like my earlier mistake, it helped save us all in the end.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I headed straight for the island's east coast. I meant to follow the seaward side of the spit, where no one in the anchorage could spot me. The afternoon was already late, though the sun still felt warm and bright. I kept threading my way through the tall woods. Long before I reached the shore, I heard the endless crash of surf ahead. Leaves tossed and branches ground together overhead. That told me the sea breeze was blowing harder than usual.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Cool gusts began to reach me through the trees. A few steps later, I came out at the open edge of the grove. Before me, the sea stretched blue and bright all the way to the horizon, while waves rolled in one after another and flung their white foam along the beach.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I never saw the sea lie quiet around Treasure Island. The sun could blaze, the air could go still, and the water could look smooth and blue. Those huge waves would keep rolling along the outer coast all the same, thundering day and night. I doubt there was one place on the island where you could not hear them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I enjoyed my walk beside the surf. When I thought I had gone far enough south, I slipped into some thick bushes and crept carefully up the ridge of the spit.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The open sea was behind me, and the anchorage lay ahead. The strong sea breeze seemed to have spent itself quickly because it had blown so hard. Now faint, shifting winds came from the south and southeast, bringing great banks of fog. Sheltered by Skeleton Island, the anchorage looked as still and gray as it had on the day we arrived. Its surface was like one unbroken mirror. The Hispaniola appeared perfectly in it, from the top of her mast to the waterline. The Jolly Roger hung from the peak.
        - id: ch01-b22
          speaker: narrator
          text: >-
            One of the small boats lay beside the ship. Silver sat in the back. I could always recognize him. Two men leaned over the rail above him, and one wore a red cap. He was the same villain I had seen straddling the palisade that morning. They seemed to be talking and laughing, but they were more than a mile away, and I could not hear a word.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Suddenly, a horrible, unearthly scream rang out. It gave me a terrible start. Then I remembered Captain Flint's voice. I could even make out the parrot's bright feathers as she perched on Silver's wrist.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Soon the little boat pushed off and headed for shore. The red-capped man and his companion went below by the cabin stairs. At about the same time, the sun dropped behind the Spy-glass. Fog gathered fast, and the island began to grow truly dark. If I meant to find Ben Gunn's boat before the evening was gone, I had no time to lose.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The white rock was easy enough to see above the brush, but it still stood about an eighth of a mile farther down the spit. Reaching it took a long while. I had to crawl through the scrub, often dropping onto my hands and knees to get through. Night had nearly fallen when I finally reached out and touched its rough side.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Just below the rock was a tiny hollow of green grass. Banks and knee-high bushes hid it on every side. In the middle stood a little goatskin tent, like the ones travelers carried in England. I climbed down, lifted one side, and there was Ben Gunn's boat.
        - id: ch01-b27
          speaker: narrator
          text: >-
            No boat could have looked more homemade. It had a rough, crooked frame of tough wood covered with goatskin, furry side in. It was tiny even for me, and I could hardly imagine how it had ever floated with a grown man aboard. One crosswise seat sat as low as it could go. There was a kind of foot brace in the bow and a double-ended paddle to drive the boat through the water.
        - id: ch01-b28
          speaker: narrator
          text: >-
            At the time, I had never seen the round little boats called coracles, though I have since. Ben Gunn's craft looked like the first and worst coracle anyone had ever built. Still, it had the coracle's great advantage. It was wonderfully light and easy to carry.
        - id: ch01-b29
          speaker: narrator
          text: >-
            You might think finding the boat would have satisfied me and ended my wandering for the day. Instead, another plan seized me. I grew so stubbornly fond of it that I believe I would have tried it even with Captain Smollett standing in my way. After dark, I would paddle out, cut the Hispaniola loose, and let her drift wherever she pleased until she ran ashore.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I felt sure the beaten mutineers wanted nothing more than to raise anchor and escape to sea. Stopping them seemed worth doing. Their watchmen had been left aboard without a boat, so I believed I could manage it with little danger.
        - id: ch01-b31
          speaker: narrator
          text: >-
            I sat down to wait for night and ate a solid meal of biscuits. Out of ten thousand nights, I could not have chosen a better one for my purpose. By then, the fog had covered the whole sky. The last rays of daylight grew weaker and disappeared. Complete darkness settled over Treasure Island.
        - id: ch01-b32
          speaker: narrator
          text: >-
            At last, I hoisted the coracle onto my shoulder and felt my way out of the hollow where I had eaten. Only two lights showed anywhere in the anchorage.
        - id: ch01-b33
          speaker: narrator
          text: >-
            One was the pirates' great fire on shore. After their defeat that morning, they lay drinking around it in the swamp. The other was only a dim glow in the darkness, marking where the ship lay at anchor. The ebb tide had turned her around, so her bow now pointed toward me. Her only lights burned inside the cabin. I could not see those lights themselves. What I saw was the strong light from the stern window shining against the fog.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The tide had been running out for some time. Before I could reach the water, I had to cross a long stretch of swampy sand. I sank past my ankles more than once as I struggled over it with the boat. Then I waded a little way into the retreating water. With all the strength and care I could manage, I turned the coracle the right way up and set its keel upon the surface.
