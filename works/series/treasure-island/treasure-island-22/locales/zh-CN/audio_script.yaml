audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    abraham_gray:
      display_name: 亚伯拉罕·格雷
      tts:
        delivery: 朴实直接，经过挣扎后显得坚定
        timbre: 稍显沙哑的年轻水手声线
        pace: 简短干脆
        pitch: 中
  chapters:
    - id: ch01
      title: 战斗过后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 叛徒没有回来，树林里连一枪也没再响。船长说，他们当天的口粮已经领够了。木寨暂时全归我们，四周也安静下来，我们总算可以仔细查看伤员，再准备午饭。尽管外面并不安全，乡绅和我还是到屋外做饭。可即使隔着这段距离，伤员响亮的呻吟仍不断从医生那边传来，听得我们心惊肉跳，连手里在做什么都快弄不清了。
        - id: ch01-b02
          speaker: narrator
          text: 这一仗倒下了八个人，只有三个还在呼吸。一个是在射击孔旁中弹的海盗，一个是亨特，还有一个是斯摩莱特船长。前两个其实已经活不成了。那个叛徒果然死在医生的手术刀下。亨特呢，不管我们怎么救治，始终没有在这个世上醒来。他拖了一整天，呼吸又响又沉，就像家乡那个中风发作的老海盗。他的胸骨被打碎了，摔倒时头骨也裂了。第二天夜里，他没出一点声音，也没露出一点征兆，就去见了造物主。
        - id: ch01-b03
          speaker: narrator
          text: 船长的伤虽然很重，却不会要命，体内没有哪个要害受了致命伤。乔布·安德森打出的第一颗子弹击碎了他的肩胛骨，还擦伤了肺，好在肺伤不重。第二颗子弹撕裂了小腿上的几束肌肉，把它们扯离了原位。医生说船长一定能好起来，不过接下来的几个星期，他不能走路，不能动那条胳膊，最好连话也少说。至于我指关节上的伤，根本算不了什么。医生贴好膏药，还顺手揪了揪我的耳朵。
        - id: ch01-b04
          speaker: narrator
          text: 午饭后，乡绅和医生坐在船长身边商量了好一阵。等他们谈了个尽兴，时间才刚过正午。医生忽然拿起帽子和手枪，腰间佩好弯刀，把地图装进口袋，再扛上一支火枪。他从北面越过围栏，大步走进了树林。
        - id: ch01-b05
          speaker: narrator
          text: 格雷和我待在木屋另一头，免得听见长官们商议什么。眼看医生就这么走了，格雷惊得把烟斗从嘴里拿下来，竟忘了再放回去。
        - id: ch01-b06
          speaker: abraham_gray
          text: 看在戴维·琼斯的分上，利弗西医生这是疯了吗？
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 怎么可能？咱们这一伙人里，最不可能发疯的就是他。
        - id: ch01-b08
          speaker: abraham_gray
          text: 好吧，伙计，他也许没疯。可你记住，他要是没疯，那疯的准是我。
        - id: ch01-b09
          speaker: narrator
          text: 我看医生心里自有主意。要是没猜错，他这会儿是去找本·冈了。
    - id: ch02
      title: 吉姆偷偷离开木寨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来的事证明，我猜得没错。可那时木屋闷得让人喘不过气，围栏里的沙地也被正午的太阳晒得发烫。我心里生出了另一个念头，这回可错得厉害。我羡慕医生能走在阴凉的树林里，身边有鸟鸣，还闻得到松树的清香。我却留在木寨挨烤，衣服粘着滚烫的树脂。四周满是鲜血和可怜的尸体。我越来越厌恶这个地方，那份厌恶几乎和恐惧一样强烈。
        - id: ch02-b02
          speaker: narrator
          text: 我冲洗木屋，又洗刷午饭用过的东西。干得越久，我越想离开。后来走到面包袋旁，恰好没人看我。我便把外套的两个口袋全塞满了饼干，迈出了这次出逃的第一步。
        - id: ch02-b03
          speaker: narrator
          text: 我当然是个傻瓜，也明知道自己要做的事又蠢又大胆。不过既然决心要去，我就想把能做的防备都做好。万一出了事，那些饼干至少能让我到第二天很晚也不挨饿。接着我又拿上一对手枪。加上原有的火药角和子弹，我觉得武器已经足够了。
        - id: ch02-b04
          speaker: narrator
          text: 我的计划本身其实不坏。我要沿着分开东面锚地和外海的沙岬往下走，找到昨晚看见的白色岩石，看看本·冈是不是把小船藏在那里。直到今天，我仍觉得这件事值得去做。可我知道，谁也不会准我离开木寨。我只能不告而别，趁人不注意偷偷溜走。这种做法实在太坏，连好计划也被它弄错了。可那时我只是个孩子，主意又早已拿定。
        - id: ch02-b05
          speaker: narrator
          text: 机会终于来了。乡绅和格雷都在帮船长包扎，没有人留意我。我一口气翻过栅栏，钻进树林最密的地方。等伙伴们发现我不见时，我已经跑得太远，他们再喊也听不到了。
        - id: ch02-b06
          speaker: narrator
          text: 这是我第二次做蠢事，比第一次还糟。因为木屋里只剩下两个没有受伤的人防守。不过和第一次一样，这件蠢事最后也帮着救了我们大家。
    - id: ch03
      title: 沙岬上的海风
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我径直赶往岛的东岸，准备沿沙岬靠外海的一边走，这样锚地里的人就看不到我了。时候已经很晚，天气仍旧温暖晴朗。我一路在高大的树木间穿行，远远听见浪涛不停轰鸣，还听见树叶翻动，枝杈互相摩擦。今天的海风显然比平常猛烈。很快，一阵阵凉风吹到脸上。我又走几步，便从树林里出来，来到开阔的林边。阳光下的大海一片蔚蓝，一直伸到天边。浪头沿着海滩翻滚，卷起一层层白沫。
        - id: ch03-b02
          speaker: narrator
          text: 金银岛四周的海，我从没见它真正平静过。就算烈日当空，空气一丝不动，海面又平又蓝，巨浪还是会沿着岛外侧所有海岸滚过来。白天也响，夜里也响，轰隆，轰隆，永远不停。我简直不相信岛上能有哪个地方听不到它们。
        - id: ch03-b03
          speaker: narrator
          text: 我沿着浪边走得很痛快。估摸已经到了足够靠南的地方，便躲进浓密的灌木，小心爬上沙岬的高处。身后是大海，眼前是锚地。那阵异乎寻常的海风仿佛刮得太猛，已经提前耗尽力气。接替它的是从南方和东南方吹来的微风，风向来回变化，还带来了大片浓雾。骷髅岛挡住了风，锚地里的水和我们初次进来时一样，沉静得像一整块铅。西斯帕尼奥拉号完整地映在这面镜子里，从桅顶到水线都看得清清楚楚。骷髅旗垂在船尾旗杆上。
        - id: ch03-b04
          speaker: narrator
          text: 一条小艇停在船边，西尔弗坐在艇尾。那么远，我还是一眼认出了他。两个海盗俯在船尾舷墙上，其中一个戴着红帽子，正是几个钟头前骑在围栏上的家伙。他们像是在说笑，可隔着一英里多，我当然听不到内容。忽然，一阵骇人的怪叫传过来。我先吓了一跳，随即认出那是鹦鹉弗林特船长的声音，甚至仿佛看见它那身鲜亮的羽毛和它停着的主人手腕。
        - id: ch03-b05
          speaker: narrator
          text: 不久，小艇离开大船，划向岸边。红帽子和同伴则从梯口下了船舱。差不多就在这时，太阳落到望远镜山背后。雾越聚越快，天真的黑了。我知道，想在当晚找到小船，就一点时间也不能再浪费。
    - id: ch04
      title: 本·冈的小船
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 白色岩石就在灌木上方，离我还有八分之一英里左右。为了靠近它，我在矮树丛里爬了好久，常常得手脚并用。等我终于摸到粗糙的岩壁，夜已经快降临了。岩石下面藏着一小块长满绿草的洼地，四周有土埂和齐膝深的矮树遮挡。洼地中央果然立着一顶山羊皮小帐篷，就像英国吉卜赛人随身带的那种。
        - id: ch04-b02
          speaker: narrator
          text: 我跳进洼地，掀开帐篷一边，本·冈的小船果然藏在里面。要说什么东西一眼就能看出是亲手做的，那就是它。几根结实的木条搭成粗糙又歪斜的骨架，外面绷着山羊皮，带毛的一面朝里。它小得出奇，连我坐进去都嫌挤。我真想不出，它怎么能载着一个成年男人浮在水上。船里只有一块尽量压低的横座，船头有个像脚撑的东西，划船则靠一支两头带桨叶的桨。
        - id: ch04-b03
          speaker: narrator
          text: 那时我还没见过古代不列颠人的科拉克小圆舟，后来才见到。要形容本·冈这条船，最贴切的说法就是，它像世人造出的第一条，也是最糟的一条科拉克小圆舟。不过小圆舟最大的优点，它倒一点没少。它轻得很，搬起来也方便。
        - id: ch04-b04
          speaker: narrator
          text: 船已经找到了，你也许会以为，我这次出逃总该够了。可我又生出一个新念头，还固执得不得了。哪怕斯摩莱特船长亲自挡在面前，我大概也非做不可。我要趁着夜色划出去，割断西斯帕尼奥拉号的锚缆，让它随便漂到哪处岸上去。
        - id: ch04-b05
          speaker: narrator
          text: 我认定叛徒们早晨进攻失败以后，眼下最想做的就是起锚出海。要能阻止他们逃走，那就再好不过了。现在我又亲眼看到，他们没有给守船的人留下小艇，所以我觉得这件事用不着冒多大风险。
    - id: ch05
      title: 黑暗中的两点灯火
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我坐下来等天黑，痛痛快快地吃了一顿饼干。对我的计划来说，这样的夜晚真是一万个里也找不出一个。浓雾已经把整个天空埋住了。最后一点白昼的光线越来越暗，终于完全消失，彻底的黑暗随即落在金银岛上。
        - id: ch05-b02
          speaker: narrator
          text: 最后，我把科拉克小圆舟扛上肩头，摸索着走出刚才坐着吃晚饭的洼地，一路磕磕绊绊。放眼整片锚地，这时只剩两个地方还看得见。
        - id: ch05-b03
          speaker: narrator
          text: 一处是岸上燃得正旺的大火。打了败仗的海盗躺在沼地里，围着火喝酒狂欢。另一处只是黑暗中一团朦胧的微光，告诉我帆船停在哪里。退潮已经让船转过身来，船头正对着我。船上只有船舱亮着灯。我看到的那团光，其实只是船尾窗射出的强光映在雾里。
        - id: ch05-b04
          speaker: narrator
          text: 潮水已经退去了一阵。我得穿过很长一片泥泞的沙地才能走到退去的水边，好几次都陷得没过脚踝。到了水边，我又抱着小圆舟往水里趟了一小段。最后，我使足力气，也用上几分巧劲，把科拉克小圆舟船底朝下，稳稳放到了水面上。
