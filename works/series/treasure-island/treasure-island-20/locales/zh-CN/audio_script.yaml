audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    captain_smollett:
      display_name: 斯摩莱特船长
      tts:
        delivery: 威严简短，命令清楚有力，危急中仍不失冷静
        timbre: 坚实粗粝的成年男声
        pace: 利落紧凑
        pitch: 中低
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    flag_bearer:
      display_name: 举旗的海盗
      tts:
        delivery: 粗声直气，面对枪口时带着谨慎
        timbre: 沙哑的成年男声
        pace: 短促清楚
        pitch: 中
  chapters:
    - id: ch01
      title: 晨雾里的休战旗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 木寨外果然站着两个人。一个挥着白布，另一个安安静静地等在旁边。那不是别人，正是西尔弗本人。天还很早。那大概是我在露天经历过最冷的早晨，寒气直钻骨头。头顶晴朗无云，阳光把树梢染成了玫瑰色。可西尔弗和副手站的地方仍罩在阴影里。夜间从沼泽爬来的白雾低低贴着地面，没过了他们的膝盖。寒气加上白雾，已经把这座岛的底细说得够清楚。这里又潮湿，又容易叫人发热生病，绝不是有益健康的地方。
        - id: ch01-b02
          speaker: captain_smollett
          text: 大家留在屋里。十有八九，这是个圈套。
        - id: ch01-b03
          speaker: narrator
          text: 船长站稳身子，随即提高嗓门，朝木寨外面的海盗喊话。
        - id: ch01-b04
          speaker: captain_smollett
          text: 什么人？站住！再走一步，我们就开枪！
        - id: ch01-b05
          speaker: long_john_silver
          text: 我们举的是休战旗！
        - id: ch01-b06
          speaker: narrator
          text: 船长守在门廊里，特意避开可能遭人暗算的角度。他转过身，迅速安排每个人的位置。
        - id: ch01-b07
          speaker: captain_smollett
          text: 医生这一班警戒。利弗西医生，请守北面。吉姆守东面，格雷守西面。换下来的人都给枪装弹。动作快，也要小心。
        - id: ch01-b08
          speaker: narrator
          text: 船长又转向叛徒，问他们打着休战旗来干什么。这次，举白布的人回答了。
        - id: ch01-b09
          speaker: flag_bearer
          text: 西尔弗船长想进去谈条件，先生！
        - id: ch01-b10
          speaker: captain_smollett
          text: 西尔弗船长？没听说过。他是谁？
        - id: ch01-b11
          speaker: narrator
          text: 我们听见船长低声嘀咕，说这家伙升得可真快。高个子约翰便亲自开了口。
        - id: ch01-b12
          speaker: long_john_silver
          text: 是我，先生。您把我们扔下以后，这些可怜的小伙子推举我做了船长。没错，是您把我们扔下的。条件要是合适，我们愿意归顺，绝不啰嗦。我只求您答应一件事，斯摩莱特船长。让我平平安安走出这座木寨，再给我一分钟走到枪打不着的地方，然后你们才能开火。
        - id: ch01-b13
          speaker: captain_smollett
          text: 我根本不想跟你谈。你想谈，就自己过来。真要有人耍诈，也只会是你们。到时候，愿上帝救你。
        - id: ch01-b14
          speaker: long_john_silver
          text: 这就够了，船长！您一句话就够。我认得出真正的绅士，您放心。
        - id: ch01-b15
          speaker: narrator
          text: 举旗的人听见船长答得毫不客气，伸手想拦住西尔弗。这也难怪。西尔弗却放声大笑，还拍了拍他的背，好像害怕这个念头荒唐极了。接着，他走到木寨边，把拐杖先扔过围栏，再架起一条腿。他费了好一番力气，靠着一身本领翻了进来，最后稳稳落在我们这一边。
    - id: ch02
      title: 两位船长
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我全神贯注地看着，根本没尽到半点哨兵的职责。我早就离开东面的射击孔，悄悄挪到船长身后。船长坐在门槛上，两肘撑着膝盖，双手托着头。他盯着沙地里的旧铁锅，看泉水在里面咕嘟咕嘟地冒出来，嘴里还吹着《来吧，姑娘和小伙子们》的调子。
        - id: ch02-b02
          speaker: narrator
          text: 西尔弗爬那座小山冈，着实吃了苦头。斜坡又陡，到处都是粗大的树桩，脚下还全是软沙。他和那根拐杖陷在里面，简直像一条迎着风停住、怎么也转不过头的船。可他像条汉子，一声不吭地坚持下来，终于到了船长面前，还漂漂亮亮地行了礼。他穿上了最体面的行头。一件宽大的蓝外套缀满铜纽扣，一直垂到膝盖。那顶滚着精美花边的帽子，则斜斜扣在脑后。
        - id: ch02-b03
          speaker: captain_smollett
          text: 总算到了，伙计。坐下吧。
        - id: ch02-b04
          speaker: long_john_silver
          text: 您不让我进屋吗，船长？这么冷的早晨，坐在外头的沙地上，可真够难受的。
        - id: ch02-b05
          speaker: captain_smollett
          text: 西尔弗，你肯老老实实做人，现在就能坐在自己的厨房里。这都是你自找的。你要么是我船上的厨子，那时大家待你不薄。要么是所谓的西尔弗船长，一个普通的叛徒和海盗，那你就该上绞架。
        - id: ch02-b06
          speaker: long_john_silver
          text: 好吧，好吧，船长。待会儿您拉我一把，让我起来就行。您这地方收拾得可真漂亮。啊，吉姆也在！早上好，吉姆。医生，我向您问安。哟，各位都聚齐了，看起来倒像和和美美的一家人。
        - id: ch02-b07
          speaker: captain_smollett
          text: 有什么话，你最好快说。
        - id: ch02-b08
          speaker: long_john_silver
          text: 您说得对，斯摩莱特船长。当差就得尽本分。昨晚那一手真漂亮，我认，确实漂亮。你们中有人使短棍很有两下子。我也不否认，我这边有人吓着了。也许人人都吓着了，也许连我也吓着了。说不定我就是为这个来谈条件的。可您听清楚，那一招绝不会再得手！我们往后会派人放哨，朗姆酒也得少喝一点。也许您以为我们全醉得东倒西歪。可我清醒得很，只是累得像条狗。我要是早一眨眼醒来，准能当场逮住你们。等我赶到那个人身边时，他可还没死，远远没有。
        - id: ch02-b09
          speaker: captain_smollett
          text: 所以呢？
        - id: ch02-b10
          speaker: narrator
          text: 西尔弗说的这一大篇，对船长来说全是谜。可单听他的语气，你绝对猜不出这一点。我心里倒慢慢有了头绪。本·冈恩临别时的那几句话重新浮现出来。我猜，昨晚海盗们一起醉倒在火堆旁时，他去拜访过他们。算一算，如今需要对付的敌人只剩十四个了。我想到这里，心里不由得一阵高兴。
    - id: ch03
      title: 西尔弗的条件
      blocks:
        - id: ch03-b01
          speaker: long_john_silver
          text: 那我就直说了。我们要那批宝藏，而且一定会拿到手。这就是我们这边的条件。依我看，你们也想保住自己的命。那就是你们这边的条件。藏宝图在你们手上，对不对？
        - id: ch03-b02
          speaker: captain_smollett
          text: 也许有，也许没有。
        - id: ch03-b03
          speaker: long_john_silver
          text: 得了吧，您明明有，我知道。犯不着对人这么冲，那一点用也没有。我们要你们交出藏宝图。我本人可从没想害你们。
        - id: ch03-b04
          speaker: captain_smollett
          text: 这套话骗不了我。你们打算做什么，我们知道得清清楚楚。我们也不在乎，因为现在你们办不到了。
        - id: ch03-b05
          speaker: narrator
          text: 船长只是平静地看着西尔弗，半点没有被他说动。接着，他拿出烟斗，不紧不慢地往里面装起烟丝。
        - id: ch03-b06
          speaker: long_john_silver
          text: 那亚伯拉罕·格雷又怎么说？
        - id: ch03-b07
          speaker: captain_smollett
          text: 住嘴！格雷什么也没说，我也什么都没问。我宁愿先看着你、他，还有整座岛一起炸上天，统统滚进地狱。这就是我的态度。
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 船长这一阵不大的火气，反倒让西尔弗冷静下来。他刚才已经越来越恼怒，这时却把火气压了下去，重新控制住自己。
        - id: ch03-b09
          speaker: long_john_silver
          text: 很可能。绅士们认为什么合乎船上的规矩，我可不敢多说。既然您要抽烟，船长，那我也跟着抽一斗。
        - id: ch03-b10
          speaker: narrator
          text: 西尔弗也装好烟丝，点着烟斗。两个人面对面坐着，沉默地抽了好一阵。时而盯着对方的脸，时而停下来拨弄烟丝，时而又探身向前，吐上一口唾沫。看他们这样无声较量，简直像看戏一样精彩。
        - id: ch03-b11
          speaker: long_john_silver
          text: 现在听好条件。把寻宝图交给我们，也别再开枪打那些可怜的水手，别趁他们睡着时砸烂脑袋。答应这两件事，你们就有两个选择。等宝藏装上船，你们可以跟我们一起走。我凭誓词和自己的名誉担保，把你们送到一个安全的地方上岸。要是不喜欢这个办法，也没关系。我手下有些人脾气粗暴，又因为以前受过责打，跟你们结了旧怨。那你们就留在这里。我们按人头把补给平分给你们。只要看见第一条过往的船，我就招呼他们过来接你们。你们得承认，这才叫好好谈条件，再也别想得到更优厚的了。木屋里的人都听清楚！我对一个人说，就是对所有人说！
        - id: ch03-b12
          speaker: narrator
          text: 斯摩莱特船长站起来，把烟灰磕在左手掌心。
        - id: ch03-b13
          speaker: captain_smollett
          text: 说完了？
        - id: ch03-b14
          speaker: long_john_silver
          text: 一个字也不剩！你们要是不答应，下回见到我，就只有枪子儿相见。
          emotion: angry
    - id: ch04
      title: 谈判破裂
      blocks:
        - id: ch04-b01
          speaker: captain_smollett
          text: 很好。现在听我的条件。你们一个接一个走上来，手里不许带武器。我保证把你们全铐起来，押回英国，让你们接受公正审判。你们要是不肯，我叫亚历山大·斯摩莱特，头顶飘着国王的旗，我会把你们统统送去见戴维·琼斯。你们找不到宝藏，也驾不了船。你们中没有一个人有本事把船开走。你们更打不过我们。格雷就在这里，他一个人就从你们五个手里逃了出来。西尔弗先生，你的船已经动弹不得。你们又困在下风岸边，很快就会明白处境。我就站在这里，明明白白地告诉你。这也是你能从我这里听到的最后几句好话。凭上帝的名义起誓，下次见到你，我会一枪打进你的后背。走吧，伙计。手脚并用也好，马上从这里滚出去，越快越好。
        - id: ch04-b02
          speaker: narrator
          text: 西尔弗那张脸简直成了一幅画，谁看一眼都不会忘记。他气得两只眼睛从眼眶里往外突，猛地把烟斗里的火全抖到了地上。
        - id: ch04-b03
          speaker: long_john_silver
          text: 拉我起来！
          emotion: angry
        - id: ch04-b04
          speaker: captain_smollett
          text: 我不拉。
        - id: ch04-b05
          speaker: long_john_silver
          text: 到底谁来拉我一把？
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 我们当中没有一个人动弹，也没有谁肯伸手。西尔弗嘴里嘟囔着最恶毒的咒骂，在沙地上艰难地爬了一段。等他终于抓住门廊，才把自己撑起来，重新在拐杖上站稳。随后，他转过身，朝泉水里吐了一口唾沫。
        - id: ch04-b07
          speaker: long_john_silver
          text: 看见了吧！这就是我对你们的看法。用不了一个钟头，我会把你们这座破木屋砸得像只烂朗姆酒桶。笑吧，活见鬼，尽管笑！再过一个钟头，你们就该在另一边哭了。那时候，死掉的人才算走运。
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: 他又狠狠咒骂一声，跌跌撞撞地离开。一路上，他在松软的沙地里费力向下走，拐杖犁出一道深沟。到了木寨边，他接连试了四五次，都没能翻过围栏。最后，举休战旗的人伸手帮他过去。转眼间，西尔弗便消失在树林里。
