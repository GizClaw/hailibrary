audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    captain_smollett:
      display_name: Captain Smollett
      tts:
        delivery: firm, commanding, and plainspoken
        timbre: crisp and weathered
        pace: measured
        pitch: low
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: genial, cunning, and commanding
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    truce_bearer:
      display_name: Truce Bearer
      tts:
        delivery: rough, cautious, and deferential
        timbre: rugged and clear
        pace: moderate
        pitch: medium-low
  chapters:
    - id: ch01
      title: "XX Silver’s Embassy"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Sure enough, two men stood just outside the stockade. One waved a white cloth. The other waited calmly beside him, and that man was Silver himself.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It was still early, and I don't think I'd ever known a colder morning outdoors. The chill went straight into my bones. Above us, the sky was bright and clear, and the rising sun colored the treetops pink. But Silver and his companion stood in shadow, knee-deep in a low white mist that had crept out of the marsh overnight. That cold mist told us something grim about the island. It was wet, feverish, and unhealthy.
        - id: ch01-b03
          speaker: captain_smollett
          text: >-
            Stay inside, men. Ten to one, this is some trick.
        - id: ch01-b04
          speaker: captain_smollett
          text: >-
            Who goes there? Stop, or we fire!
        - id: ch01-b05
          speaker: long_john_silver
          text: >-
            Flag of truce!
        - id: ch01-b06
          speaker: narrator
          text: >-
            The captain stood in the porch, careful to keep out of the path of any treacherous shot. Then he turned to us.
        - id: ch01-b07
          speaker: captain_smollett
          text: >-
            Doctor's watch, take the loopholes. Dr. Livesey, the north side, please. Jim, east. Gray, west. Everyone off watch, load the muskets. Move quickly, men, and be careful.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then he faced the mutineers again.
        - id: ch01-b09
          speaker: captain_smollett
          text: >-
            What do you want with that flag of truce?
        - id: ch01-b10
          speaker: truce_bearer
          text: >-
            Captain Silver wants to come aboard and discuss terms, sir!
        - id: ch01-b11
          speaker: captain_smollett
          text: >-
            Captain Silver? Never heard of him. Who is he?
        - id: ch01-b12
          speaker: narrator
          text: >-
            We heard him mutter to himself that Silver had earned quite a promotion.
        - id: ch01-b13
          speaker: long_john_silver
          text: >-
            That's me, sir. These poor fellows chose me as captain after you deserted them, sir. Yes, deserted them. We're ready to submit if we can agree on terms, with no trouble about it. I only ask for your word, Captain Smollett. Let me leave this stockade safe and sound, and give me one minute to get out of range before anyone fires.
        - id: ch01-b14
          speaker: captain_smollett
          text: >-
            My man, I have no wish at all to speak with you. If you want to speak with me, come over. That's all. Any treachery will be on your side, and may the Lord help you then.
        - id: ch01-b15
          speaker: long_john_silver
          text: >-
            That's good enough, Captain! Your word is enough for me. I know a gentleman when I hear one, you can count on that.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The man holding the white flag tried to stop Silver from going farther. No wonder, after the captain's careless answer. But Silver laughed aloud and slapped him on the back, as though the very thought of danger was foolish. He moved up to the stockade, tossed his crutch across, and managed to pull one leg over. With remarkable strength and skill, he hauled himself across the fence and dropped safely inside.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I have to admit, I was so caught up in watching him that I was no use at all as a sentry. I'd already abandoned my eastern loophole and crept behind the captain. Captain Smollett now sat on the threshold. His elbows rested on his knees, and his head rested in his hands. He kept his eyes on the water as it bubbled out of the old iron kettle sunk in the sand. All the while, he whistled “Come, Lasses and Lads.”
        - id: ch01-b18
          speaker: narrator
          text: >-
            Silver had a terrible time climbing the little hill. The slope was steep, tree stumps crowded his way, and the soft sand gave way under him. With only one leg and a crutch, he was as helpless as a ship that couldn't come about. Still, he kept at it without a word. At last he reached the captain and gave him his finest salute.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Silver had dressed in his best clothes. A huge blue coat covered in brass buttons hung down to his knees. A fine hat trimmed with lace sat back on his head.
        - id: ch01-b20
          speaker: captain_smollett
          text: >-
            So here you are, my man. You'd better sit down.
        - id: ch01-b21
          speaker: long_john_silver
          text: >-
            You won't let me come inside, Captain? It's bitter cold out here, sir, sitting on the sand.
        - id: ch01-b22
          speaker: captain_smollett
          text: >-
            Silver, if you'd chosen to be an honest man, you could be sitting in your galley now. This is your own doing. You're either my ship's cook, and you were treated well, or you're Captain Silver, a common mutineer and pirate. If that's what you are, you can go hang.
        - id: ch01-b23
          speaker: long_john_silver
          text: >-
            Well, well, Captain. I'll sit where you tell me. You'll just have to give me a hand up again, that's all. You've got a sweet little place here. Ah, there's Jim! A fine morning to you, Jim. And my respects to you, Doctor. Why, look at that. You're all gathered together like one happy family, you might say.
        - id: ch01-b24
          speaker: captain_smollett
          text: >-
            If you came to say something, my man, then say it.
        - id: ch01-b25
          speaker: long_john_silver
          text: >-
            You're right, Captain Smollett. Duty is duty. Now listen. That was a clever move you made last night, and I won't deny it. Some of you are mighty handy with the end of a handspike. I won't deny that some of my men were shaken either. Maybe every one of them was. Maybe I was shaken myself, and maybe that's why I've come here to talk terms.
        - id: ch01-b26
          speaker: long_john_silver
          text: >-
            But mark me, Captain, you won't manage it twice! We'll post proper sentries from now on, and we'll ease off the rum a little. Maybe you think every one of us was drunk. Well, I was sober. I was only worn out. If I'd woken one second earlier, I'd have caught you right in the act. And that man wasn't dead when I reached him. No, he wasn't.
        - id: ch01-b27
          speaker: captain_smollett
          text: >-
            Well?
        - id: ch01-b28
          speaker: narrator
          text: >-
            Everything Silver said was a mystery to the captain, but no one could have guessed that from his cool voice. I was beginning to understand, though. Ben Gunn's last words came back to me. I guessed that he'd paid the buccaneers a visit while they all lay drunk together around their fire. I counted our enemies again with delight. Now there were only fourteen of them left to face.
        - id: ch01-b29
          speaker: long_john_silver
          text: >-
            Here's the matter plain. We want that treasure, and we'll have it. That's our side. You want to save your lives, I expect. That's yours. You have the chart, don't you?
        - id: ch01-b30
          speaker: captain_smollett
          text: >-
            Maybe we do, and maybe we don't.
        - id: ch01-b31
          speaker: long_john_silver
          text: >-
            Oh, you have it. I know you do. There's no use snapping at me like that. What I'm saying is, we want your chart. I never meant you any harm myself.
        - id: ch01-b32
          speaker: captain_smollett
          text: >-
            That won't work with me, my man. We know exactly what you planned to do, and we don't care. You can't do it now.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The captain looked at him calmly and began filling his pipe.
        - id: ch01-b34
          speaker: long_john_silver
          text: >-
            If Abe Gray—
        - id: ch01-b35
          speaker: captain_smollett
          text: >-
            Stop right there! Gray told me nothing, and I asked him nothing. What's more, I'd sooner see you, Gray, and this whole island blown straight into flames. Now you know exactly what I think, my man.
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: >-
            That quick flash of anger seemed to cool Silver down. He'd been getting irritated, but now he pulled himself together.
        - id: ch01-b37
          speaker: long_john_silver
          text: >-
            Fair enough. I wouldn't tell gentlemen what they should or shouldn't consider proper. And since you're about to smoke, Captain, I hope you won't mind if I do the same.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Silver filled his pipe and lit it. For quite a while, the two men sat smoking in silence. Sometimes they stared straight into each other's faces. Sometimes they stopped to press down the tobacco in their pipes. Then one of them would lean forward to spit. Watching those two enemies sit there together was as good as watching a play.
        - id: ch01-b39
          speaker: long_john_silver
          text: >-
            Now, here are our terms. Give us the treasure chart. Stop shooting poor sailors and smashing in their heads while they're asleep. Do that, and we'll give you a choice.
        - id: ch01-b40
          speaker: long_john_silver
          text: >-
            Once the treasure is aboard, you can sail away with us. I'll give you my sworn word of honor that we'll put you safely ashore somewhere. Or maybe that doesn't suit you. Some of my men are rough, and they hold old grudges over the way you treated them. In that case, you can stay here. We'll divide the supplies evenly with you, man for man. And again, I'll swear to hail the first ship I see and send it here to pick you up.
        - id: ch01-b41
          speaker: long_john_silver
          text: >-
            You have to admit that's a fair offer. You couldn't hope for a better one. And I hope everyone inside this blockhouse is listening, because what I say to one of you, I say to all of you!
        - id: ch01-b42
          speaker: narrator
          text: >-
            Captain Smollett stood and knocked the ashes from his pipe into his left palm.
        - id: ch01-b43
          speaker: captain_smollett
          text: >-
            Is that everything?
        - id: ch01-b44
          speaker: long_john_silver
          text: >-
            Every last word! Refuse, and the next thing you see of me will be musket balls.
        - id: ch01-b45
          speaker: captain_smollett
          text: >-
            Very good. Now listen to me. Come up one at a time and unarmed. I'll put every one of you in irons and take you home for a fair trial in England.
        - id: ch01-b46
          speaker: captain_smollett
          text: >-
            If you refuse, my name is Alexander Smollett. I fly my sovereign's colors, and I'll send you all to Davy Jones. You can't find the treasure. You can't sail the ship, because none of you knows how. And you can't beat us in a fight. Gray there escaped from five of you.
        - id: ch01-b47
          speaker: captain_smollett
          text: >-
            Your ship is trapped, Master Silver. You're caught on a lee shore, and soon you'll know it. Those are the last kind words you'll hear from me. In heaven's name, the next time I meet you, I'll put a bullet in your back. Now get moving, my lad. Out of here, hand over hand, and double quick.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Silver's face was a sight to see. His eyes nearly leaped from his head with rage. He shook every spark and shred of burning tobacco out of his pipe.
        - id: ch01-b49
          speaker: long_john_silver
          text: >-
            Give me a hand up!
          emotion: angry
        - id: ch01-b50
          speaker: captain_smollett
          text: >-
            I will not.
        - id: ch01-b51
          speaker: long_john_silver
          text: >-
            Will any of you give me a hand up?
          emotion: angry
        - id: ch01-b52
          speaker: narrator
          text: >-
            Not one of us moved. Silver growled the foulest curses as he crawled over the sand. At last he caught hold of the porch and used it to haul himself upright again on his crutch. Then he leaned over and spat straight into the spring.
        - id: ch01-b53
          speaker: long_john_silver
          text: >-
            There! That's what I think of you. Before an hour passes, I'll smash your old blockhouse open like a rum barrel. Go on, laugh! Before that hour is over, you'll be laughing from the other side. The ones who die will be the lucky ones.
          emotion: angry
        - id: ch01-b54
          speaker: narrator
          text: >-
            After one last dreadful oath, Silver stumbled away, plowing down the slope through the soft sand. He tried four or five times to get over the stockade and failed each time. At last, the man with the white flag helped him across. A moment later, Silver disappeared among the trees.
