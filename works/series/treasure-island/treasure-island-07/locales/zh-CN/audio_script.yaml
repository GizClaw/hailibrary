audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    redruth:
      display_name: 雷德鲁斯
      tts:
        delivery: 忠厚粗直，抱怨时带着老猎场看守的倔强
        timbre: 粗哑结实
        pace: 稍慢
        pitch: 中低
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，兴奋时声势十足又直来直往
        timbre: 洪亮饱满
        pace: 明快多变
        pitch: 中低
  chapters:
    - id: ch01
      title: 等待出海
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 出海前的准备，比乡绅料想的久多了。原先的安排全都落了空。利弗西医生没法把我带在身边，因为他得赶到伦敦，请另一位大夫代管诊所。乡绅在布里斯托尔忙着操办出海的大大小小事务，我则留在大宅，由老猎场看守雷德鲁斯照管。日子过得像坐牢，可我的心早就飞到了海上。
        - id: ch01-b02
          speaker: narrator
          text: 我把地图上的每个地方都记得清清楚楚，还是会对着它一看就是几个钟头。坐在女管家房里的炉边，我从各个可能的方向驶近小岛，在想象里走遍每一寸土地，也不知登上望远镜山多少回。站在峰顶望出去，每次都是另一番奇景。
        - id: ch01-b03
          speaker: narrator
          text: 有时岛上到处是野人，我们跟他们交战。有时猛兽遍地，追得我们四处逃命。可不管我怎样做梦，都没梦见后来那些真正的遭遇。那些事比我的幻想离奇得多，也惨烈得多。
        - id: ch01-b04
          speaker: narrator
          text: 几个星期过去，一封写给利弗西医生的信送到了。信封上另有一句嘱咐，说医生若不在，就由汤姆·雷德鲁斯或小霍金斯拆阅。我们遵照嘱咐把信拆开，里面是一长串要紧消息。其实信是我读的，因为雷德鲁斯除了印刷体，别的字认不大好。信上先写着日期和地点，一七——年三月一日，布里斯托尔老锚客店。接着，特里劳尼乡绅这样说道。
        - id: ch01-b05
          speaker: squire_trelawney
          text: 亲爱的利弗西，我不知道你正在大宅，还是仍旧待在伦敦，所以两边各寄了一封同样的信。
        - id: ch01-b06
          speaker: squire_trelawney
          text: 船已经买好，也装备齐全了。她正停在锚地，随时能出海。你想不到这条双桅纵帆船有多可爱，连孩子都能驾驶。船重二百吨，名字是“伊斯帕尼奥拉号”。
        - id: ch01-b07
          speaker: squire_trelawney
          text: 这是老朋友布兰德利替我弄到的。他真是够朋友，为了我的事忙得要命。布里斯托尔其他人也差不多，只要他们听说我们要去哪儿。我的意思是，只要他们听说我们要去寻宝。
        - id: ch01-b08
          speaker: narrator
          text: 我看到这里，忍不住停下来提醒雷德鲁斯。
        - id: ch01-b09
          speaker: narrator
          text: 雷德鲁斯，利弗西医生一定不喜欢这样。乡绅到底还是把事情说出去了。
        - id: ch01-b10
          speaker: redruth
          text: 哼，除了乡绅，还有谁更有资格说？要是乡绅连利弗西医生的事都不能替他说，那才叫怪呢。
        - id: ch01-b11
          speaker: narrator
          text: 我听了便打消插嘴评论的念头，只管照着信接着往下念。
        - id: ch01-b12
          speaker: squire_trelawney
          text: “伊斯帕尼奥拉号”是布兰德利亲自找到的。他很有办法，只花一点钱就替我买了下来。布里斯托尔有些人偏偏对他成见很深。他们竟说这个老实人为了钱什么都做得出来，还说船原本就是他的，卖给我的价钱高得离谱。这些话明明都是诽谤。不过，谁也不敢说船不好。
        - id: ch01-b13
          speaker: squire_trelawney
          text: 到这里都很顺利。索具工和其他工匠确实慢得气人，好在多等些时候，活儿总算做完了。真正让我发愁的，是找船员。
        - id: ch01-b14
          speaker: squire_trelawney
          text: 我想凑足二十个人。万一碰上土著、海盗，或那些讨厌的法国人，人手多些才好。可我费了天大的力气，连六个人也找不齐。幸好后来运气来了，把我最需要的人送到我面前。
        - id: ch01-b15
          speaker: squire_trelawney
          text: 那天我站在码头上，偶然跟一个人聊了起来。他原来是个老水手，如今开酒馆，布里斯托尔跑船的人他全认识。他说自己在岸上待坏了身体，想找个厨子的好差事，再回海上去。那天早晨，他一瘸一拐来到码头，只为闻闻海水的咸味。
        - id: ch01-b16
          speaker: squire_trelawney
          text: 我听了实在感动，换成你也会动心。我完全是出于怜悯，当场就雇他当船上的厨子。他叫高个子约翰·西尔弗，少了一条腿。可这反倒让我更信任他，因为那条腿是他在不朽的霍克将军麾下为国效力时失去的。利弗西，他居然没有抚恤金！我们活的这个时代，实在可恶透顶。
        - id: ch01-b17
          speaker: squire_trelawney
          text: 老兄，我还以为自己只找到了一个厨子，谁知找到的竟是一整船人。西尔弗和我只用几天，就召来一群最老练、最强悍的水手。他们长得并不好看，脸上却全是绝不服输的劲头。我敢说，我们甚至能跟一艘护卫舰交战。
        - id: ch01-b18
          speaker: squire_trelawney
          text: 我先前雇了六七个人，高个子约翰还从中赶走两个。他马上就让我看出来，那两个是不经风浪的旱鸭子。办这样的大事，我们最要防的正是这种人。
        - id: ch01-b19
          speaker: squire_trelawney
          text: 我现在身体好得不得了，精神也旺得很，吃东西像头牛，睡觉像棵树。可只要还没听见那些老水手绕着绞盘踩响甲板，我就一刻也快活不起来。出海喽！宝藏见鬼去吧！真正迷住我的，是大海的荣光。利弗西，你要是还看重我，就赶快搭驿车来，千万别耽搁。
        - id: ch01-b20
          speaker: squire_trelawney
          text: 让小霍金斯马上去看母亲，叫雷德鲁斯护送。随后，两个人都全速赶来布里斯托尔。约翰·特里劳尼。
        - id: ch01-b21
          speaker: squire_trelawney
          text: 又及，我漏了一件事。布兰德利找来一位很出色的船长。他太严厉了，我不喜欢这一点，除此以外却是块宝。顺便告诉你，如果我们到八月底还没有出现，布兰德利会派船来接应。高个子约翰·西尔弗也找到一个能干的大副，名叫阿罗。我还有一位会吹哨发令的水手长。所以在漂亮的“伊斯帕尼奥拉号”上，样样都会照军舰的规矩办。
        - id: ch01-b22
          speaker: squire_trelawney
          text: 我又想起一件事。西尔弗颇有家产，我亲自查过，他在银行有账户，从来没有透支。他会把酒馆交给妻子照看。她是个有色人种女人，所以你我这两个老光棍不妨猜猜，他想重新出海闯荡，恐怕一半是为了身体，一半也是为了躲开太太。J. T.
        - id: ch01-b23
          speaker: squire_trelawney
          text: 再又及，霍金斯可以陪母亲住一晚。J. T.
    - id: ch02
      title: 告别本葆将军
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 读完这封信，我兴奋得简直忘了自己是谁。可老汤姆·雷德鲁斯一路抱怨个不停，那一刻，我真有些瞧不起他。他手下任何一个猎场看守都愿意跟他换。只是乡绅没这样安排，而乡绅的话在他们那里就像法律。也只有老雷德鲁斯敢发发牢骚。
        - id: ch02-b02
          speaker: narrator
          text: 第二天早晨，我和雷德鲁斯步行回到“本葆将军”。母亲身体很好，精神也不错。那个害得我们长久不得安宁的船长，已经去了恶人不再作乱的地方。乡绅让人修好客店，重新油漆公共客房和招牌，还添了家具。酒吧间里多了一把漂亮的扶手椅，专门给母亲坐。
        - id: ch02-b03
          speaker: narrator
          text: 乡绅又找来一个男孩当学徒，好让我走后还有人帮母亲干活。我一看到他，才真正明白自己要离开了。在这以前，我只想着前面的冒险，根本没有想过身后的家。可这个笨手笨脚的陌生人要代替我陪着母亲，我忽然忍不住哭起来。
        - id: ch02-b04
          speaker: narrator
          text: 我得承认，那个男孩被我折腾得够呛。他刚开始学，做什么都不熟，我便一次又一次纠正他，好显得自己比他能干。这样的机会，我一次也没放过。
        - id: ch02-b05
          speaker: narrator
          text: 一夜过去，第二天吃完午饭，我和雷德鲁斯又步行上路。我告别母亲，告别从出生起便生活的海湾，也告别亲爱的老“本葆将军”。不过招牌重新上过油漆，我看它已经没有从前那么亲切了。
        - id: ch02-b06
          speaker: narrator
          text: 临走前，我还想到了船长。他以前常戴着三角帽，露着脸颊上的军刀伤疤，夹一架旧黄铜望远镜，在海滩上来回大步走。可转过街角，家就从我眼前消失了。
    - id: ch03
      title: 初见布里斯托尔
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 黄昏时分，邮车在荒野上的“皇家乔治”客店接到我们。我被夹在雷德鲁斯和一位胖胖的老先生中间。车跑得飞快，夜风又冷，可我刚上车就开始打盹。后来更是一路睡得像根木头，翻过山，穿过谷，换了一个又一个驿站，全都不知道。
        - id: ch03-b02
          speaker: narrator
          text: 最后，有人在我肋下捅了一下。我睁开眼，发现车停在城里的一条街上，面前立着一幢大房子。天早已亮了很久。
        - id: ch03-b03
          speaker: narrator
          text: 我们到哪儿了？
        - id: ch03-b04
          speaker: redruth
          text: 布里斯托尔。下车。
        - id: ch03-b05
          speaker: narrator
          text: 特里劳尼先生为了盯着船上的工程，住进了码头深处的一家客店。我们得步行去找他。一路沿着港岸走，我高兴得不得了。身边停满各种船，大的小的，帆装和索具各不相同，也来自不同国家。有一条船上的水手边干活边唱歌。另一条船上，有人爬到我头顶很高的地方，手里攀着的绳索看上去只比蛛丝粗一点。
        - id: ch03-b06
          speaker: narrator
          text: 我从小住在海边，可到了这里，才觉得自己从前根本没见过大海。焦油混着海水的味道，我闻着都新鲜。船头那些奇妙的雕像，每一尊都曾远渡重洋。码头上还有许多老水手，耳朵戴着环，络腮胡卷成一圈一圈，沾着焦油的辫子垂在脑后。他们迈着笨拙的海上步子，身子摇来摆去，神气得很。哪怕迎面来了同样多的国王或大主教，我也不会更快活。
        - id: ch03-b07
          speaker: narrator
          text: 而且，我自己也要出海了！我要坐双桅纵帆船，船上有吹哨发令的水手长，也有梳辫子、唱着歌的水手。我们要驶向一座没人知道的岛，去找埋在地下的宝藏！
        - id: ch03-b08
          speaker: narrator
          text: 我还沉在这个美梦里，忽然已经走到一间大客店门口。特里劳尼乡绅正好从里面出来。他穿一身结实的蓝呢制服，把自己打扮得像个海军军官。他笑容满面，连走路都学着水手的样子，学得还真像。
        - id: ch03-b09
          speaker: squire_trelawney
          text: 你们终于到了！医生昨晚也从伦敦回来了。好极了，全船人马都齐了！
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: 先生，我们什么时候开船？
        - id: ch03-b11
          speaker: squire_trelawney
          text: 什么时候？明天就开！
          emotion: happy
