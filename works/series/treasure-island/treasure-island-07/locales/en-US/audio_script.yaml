audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: vivid, thoughtful first-person storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    squire_trelawney:
      display_name: Squire Trelawney
      tts:
        delivery: grand, impulsive, and warmhearted
        timbre: broad and booming
        pace: lively
        pitch: medium-low
    tom_redruth:
      display_name: Tom Redruth
      tts:
        delivery: gruff, loyal, and plainspoken
        timbre: dry and weathered
        pace: steady
        pitch: low
  chapters:
    - id: ch01
      title: Waiting for the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Getting ready for sea took much longer than the squire expected. Every one of our first plans had to change. Dr. Livesey had meant to keep me with him, but he had to go to London and find another doctor to care for his patients. The squire was busy in Bristol. I stayed at the hall with old Tom Redruth, the gamekeeper, watching over me so closely that I felt almost like a prisoner.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Still, my head was full of the sea. I spent hours dreaming about strange islands and the adventures waiting there. I knew every mark on the map by heart. As I sat by the fire in the housekeeper's room, I sailed toward the island from one direction after another. In my mind, I crossed every acre and climbed the tall hill called the Spy-glass a thousand times. The view from its top was always changing and always wonderful.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Sometimes I imagined the island crowded with savage people we had to fight. Sometimes dangerous animals chased us through it. But none of those dreams came close to the strange and tragic things that truly happened there.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The weeks went by. Then, one fine day, a letter arrived for Dr. Livesey. Written on the outside were instructions that Tom Redruth or young Hawkins should open it if the doctor was away. We followed the order. Or rather, I did. Redruth could manage printed words, but handwriting gave him trouble. Inside, I found news important enough to read aloud.
    - id: ch02
      title: The Squire's Letter
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The letter came from the Old Anchor Inn in Bristol and was dated March first. It began with a note to Dr. Livesey.
        - id: ch02-b02
          speaker: squire_trelawney
          text: >-
            Dear Livesey, I don't know whether you're at the hall or still in London, so I'm sending this letter to both places. The ship is bought, fitted out, and lying at anchor, ready for sea. You never saw a sweeter schooner. A child could sail her. She's two hundred tons, and her name is the Hispaniola.
        - id: ch02-b03
          speaker: squire_trelawney
          text: >-
            My old friend Blandly found her for me, and he's been a magnificent help from beginning to end. The fellow has worked himself to the bone for us. So has nearly everyone in Bristol, once they heard where we're sailing. I mean once they heard we're after treasure.
        - id: ch02-b04
          speaker: narrator
          text: >-
            I stopped reading right there.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Redruth, Dr. Livesey won't be happy about this. The squire has been talking after all.
        - id: ch02-b06
          speaker: tom_redruth
          text: >-
            And who has more right to talk than the squire? It'd be a fine thing if he needed Dr. Livesey's permission.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Redruth only growled at me, so I stopped commenting and went on with the letter.
        - id: ch02-b08
          speaker: squire_trelawney
          text: >-
            Blandly himself discovered the Hispaniola, and through brilliant bargaining he got her for next to nothing. Some men in Bristol are terribly unfair to him. They claim the honest fellow would do anything for money. They even say the ship was his and that he charged me a ridiculous price for it. Pure slander, of course. But not one of them can deny that she's a fine ship.
        - id: ch02-b09
          speaker: squire_trelawney
          text: >-
            Up to that point, nothing went wrong. The riggers and other workmen moved at an infuriating crawl, but in time they finished. Finding a crew was the real trouble.
        - id: ch02-b10
          speaker: squire_trelawney
          text: >-
            I wanted twenty men in case we met natives, pirates, or those dreadful Frenchmen. I could barely find six until an amazing piece of luck brought me exactly the man I needed.
        - id: ch02-b11
          speaker: squire_trelawney
          text: >-
            I happened to start talking with him on the dock. He was an old sailor who kept a public house and knew every seafaring man in Bristol. His health had suffered on land, and he wanted a place as cook so he could go to sea again. He told me he'd hobbled down to the harbor that morning just to smell the salt air.
        - id: ch02-b12
          speaker: squire_trelawney
          text: >-
            It moved me deeply, Livesey. It would have moved you, too. Out of simple pity, I hired him as our ship's cook right then. His name is Long John Silver. He has lost one leg, but I took that as a point in his favor because he lost it serving his country under the immortal Hawke. Yet he gets no pension. Think what a shameful age we live in!
        - id: ch02-b13
          speaker: squire_trelawney
          text: >-
            I believed I'd found one cook. In fact, I'd found an entire crew. Silver and I gathered a company of the toughest old sailors you can imagine in only a few days. They're not handsome men, but one look at their faces tells you they won't give up. Why, I believe we could take on a warship!
        - id: ch02-b14
          speaker: squire_trelawney
          text: >-
            Long John even dismissed two of the six or seven men I'd hired before meeting him. He saw at once that they were useless landsmen, exactly the kind we can't risk on an adventure this important.
        - id: ch02-b15
          speaker: squire_trelawney
          text: >-
            As for me, I've never felt healthier or happier. I eat like a bull and sleep like a tree. But I won't truly enjoy myself until I hear my old sailors marching around the capstan. To sea! Forget the treasure. It's the glory of the sea that's gone to my head. Come by the fastest coach, Livesey. If you care for me at all, don't waste an hour.
        - id: ch02-b16
          speaker: squire_trelawney
          text: >-
            Send young Hawkins home at once to see his mother, with Redruth guarding him. Then they must both hurry straight to Bristol. John Trelawney.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Then came a postscript.
        - id: ch02-b18
          speaker: squire_trelawney
          text: >-
            I forgot to mention that Blandly found us a sailing master. If we haven't returned by the end of August, Blandly is also to send another ship after us. The captain is a stiff sort of man, which I regret, but excellent in every other way. Long John Silver found a very capable mate named Arrow. We have a boatswain who can pipe orders, too. Everything aboard the good ship Hispaniola will be run just like a navy vessel.
        - id: ch02-b19
          speaker: squire_trelawney
          text: >-
            And Silver is a man of means. I know for a fact that he has money in the bank and has never overdrawn his account. He's leaving his wife in charge of the inn. Since you and I are old bachelors, perhaps we can be forgiven for suspecting that his wife, as much as his health, makes him eager to wander again. J. T.
        - id: ch02-b20
          speaker: narrator
          text: >-
            There was even a second postscript.
        - id: ch02-b21
          speaker: squire_trelawney
          text: >-
            Hawkins may spend one night with his mother. J. T.
    - id: ch03
      title: One Night at Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            You can imagine what that letter did to me. I was nearly wild with happiness. If I ever looked down on any man, it was old Tom Redruth then, because all he could do was complain about the trip. Any younger gamekeeper would gladly have traded places with him. But the squire's wishes were law among his servants, and only old Redruth would have dared to grumble at all.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The next morning, Redruth and I walked to the Admiral Benbow. I found my mother healthy and cheerful. The old captain who had caused us so much misery was gone for good. Squire Trelawney had paid to repair everything. The public rooms and the sign had fresh paint, and there was new furniture, including a beautiful armchair for Mother behind the bar. He had also hired a boy to help her while I was away.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The moment I saw that boy, I finally understood what leaving meant. Until then, I'd thought only about the adventures ahead. I had never thought about the home behind me. But here was this awkward stranger, ready to take my place beside my mother, and suddenly I began to cry.
        - id: ch03-b04
          speaker: narrator
          text: >-
            I'm afraid I made life miserable for him. He was new to the work, so I found a hundred chances to correct him and make him feel small. I took every one of them.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The night passed. After dinner the following day, Redruth and I started down the road again. I said goodbye to Mother, to the cove where I'd lived all my life, and to the dear old Admiral Benbow. With all that new paint, though, it didn't look quite so dear anymore.
        - id: ch03-b06
          speaker: narrator
          text: >-
            One of my last thoughts was of the old captain. I could still picture him striding along the beach in his cocked hat, with the scar from a saber across his cheek and his old brass telescope. Then we turned the corner, and my home disappeared from sight.
    - id: ch04
      title: Bristol
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Around dusk, the mail coach picked us up at the Royal George on the heath. I was squeezed between Redruth and a stout old gentleman. The coach flew along, and the cold night air rushed past us, but I began nodding off almost at once. Soon I was sleeping like a log, uphill and downhill, from one stage to the next.
        - id: ch04-b02
          speaker: narrator
          text: >-
            At last, someone jabbed me in the ribs. I opened my eyes. The coach had stopped outside a large building on a city street, and morning had been shining for quite a while.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Where are we?
        - id: ch04-b04
          speaker: tom_redruth
          text: >-
            Bristol. Out you get.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Squire Trelawney was staying at an inn far down by the docks so he could oversee the work on the schooner. We had to walk there. To my delight, the road followed the quays, past a whole forest of ships. They came in every size, with every kind of rigging, from nation after nation.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Sailors sang as they worked on one ship. On another, men hung high above my head from ropes that looked no thicker than spider threads. I had lived beside the shore all my life, yet I felt as though I'd never truly been near the sea before. Even the smell of salt and tar was new to me.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Wonderful figureheads looked out from the bows, and every one of them had crossed the ocean. Old sailors passed me with rings in their ears, curled whiskers, tar-stained pigtails, and that rolling, clumsy walk that belonged to the sea. I couldn't have been more thrilled if the quay had been crowded with kings and archbishops.
        - id: ch04-b08
          speaker: narrator
          text: >-
            And I was going to sea myself. I would sail in a schooner with a boatswain piping commands and pigtail sailors singing around me. We were bound for an unknown island to hunt for buried treasure!
        - id: ch04-b09
          speaker: narrator
          text: >-
            I was still lost in that glorious dream when we came to a large inn. Squire Trelawney stepped out through the door to meet us. He wore heavy blue clothes like a naval officer. A smile covered his face, and he was doing an excellent imitation of a sailor's rolling walk.
        - id: ch04-b10
          speaker: squire_trelawney
          text: >-
            There you are! The doctor arrived from London last night. Excellent! Now the whole ship's company is here!
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: >-
            Oh, sir, when are we leaving?
        - id: ch04-b12
          speaker: squire_trelawney
          text: >-
            Leaving? We sail tomorrow!
          emotion: happy
