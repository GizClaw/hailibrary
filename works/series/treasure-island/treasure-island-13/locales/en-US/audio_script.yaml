  chapters:
    - id: ch01
      title: How I Began My Shore Adventure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When I came on deck the next morning, the island looked completely different. The breeze had died, but we had traveled a long way during the night. Now the ship lay still about half a mile southeast of the low eastern shore.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Gray woods covered most of the land. Here and there, strips of yellow sand crossed the lower ground. Tall pines rose above the other trees, some alone and some in groups. Even with those breaks, the island's color stayed dull and sad. Above the woods stood bare peaks, and every one had a strange shape. The Spy-glass was the tallest by three or four hundred feet, and the oddest. Its sides rose almost straight up, then ended in a flat top like a base waiting for a statue.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The Hispaniola rolled so far that her scuppers dipped into the swell. The booms pulled hard against the blocks, the rudder slammed from side to side, and the ship creaked, groaned, and jumped like a busy factory. I had to cling tightly to the backstay while the world spun around me. I was a fair sailor when a ship was moving ahead, but I never learned to bear being tossed like a bottle while standing still. Each roll made my empty stomach turn, and mornings were always the worst.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Maybe it was the rolling. Maybe it was the island itself, with those gloomy woods, wild stone peaks, and surf we could both see and hear pounding the steep beach. The sun was bright and hot. Shore birds fished and cried all around us, and after so long at sea, anyone should have been glad to reach land. But my heart sank into my boots. From that first look, I hated even the thought of Treasure Island.
        - id: ch01-b05
          speaker: narrator
          text: >-
            A miserable morning's work waited for us. With no wind at all, we had to lower and crew the boats, then tow the ship three or four miles around the island's corner and through the narrow passage to the harbor behind Skeleton Island. I volunteered for one of the boats, though I had no business there. The heat was fierce, and the men complained bitterly as they pulled. Anderson commanded my boat, but instead of quieting them, he grumbled as loudly as anyone.
        - id: ch01-b06
          speaker: job_anderson
          text: >-
            Well, this won't last forever, damn it.
        - id: ch01-b07
          speaker: narrator
          text: >-
            That seemed like a very bad sign. Until then, the men had done their work quickly and willingly. One look at the island had already loosened discipline among them.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The whole way in, Long John stood beside the helmsman and guided the ship. He knew the channel as well as he knew his own hand. The sailor taking soundings kept finding deeper water than the chart showed, but John never hesitated.
        - id: ch01-b09
          speaker: long_john_silver
          text: >-
            The ebb runs hard through here. You might say it dug this channel out with a spade.
        - id: ch01-b10
          speaker: narrator
          text: >-
            We anchored at the exact place marked on the chart, about a third of a mile from either shore. The mainland lay on one side and Skeleton Island on the other. Beneath us was clean sand. When the anchor plunged down, clouds of birds burst above the woods, wheeling and crying. In less than a minute, they settled again, and everything was quiet.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Woods surrounded the harbor and shut it away from the open sea. Trees grew right down to the high-water mark. The shores were mostly flat. Farther back, hilltops stood here and there around us like seats in an amphitheater. Two small rivers, really more like swamps, drained into that pondlike harbor. The leaves near those swampy outlets had a bright, poisonous look.
        - id: ch01-b12
          speaker: narrator
          text: >-
            We could not see the house or the stockade from the ship because the trees hid them completely. Without the chart lying on the companionway, we might have believed no ship had anchored there since the island first rose from the sea.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Not a breath of air moved anywhere in that closed-in harbor. The only sound was the surf booming half a mile away on the outer beaches and rocks. A strange, stale smell hung over the anchorage, the smell of soaked leaves and rotting tree trunks. I saw the doctor sniff again and again, like a man testing a bad egg.
        - id: ch01-b14
          speaker: doctor_livesey
          text: >-
            I can't promise you treasure, but I'll bet my wig this place is full of fever.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The men's behavior had worried me in the boats. Once they were back aboard, it turned openly threatening. They sprawled around the deck, muttering together in groups. Every small order brought a dark look, and they obeyed only after dragging their feet over it. Even the honest sailors seemed to catch the mood. Not one man aboard tried to pull another back into line. Mutiny hung over us like a thundercloud.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The cabin party was not alone in seeing the danger. Long John hurried from group to group, pouring all his energy into friendly advice. No man could have put on a better show. He smiled at everyone and acted more willing and polite than ever. Whatever needed doing, he seemed eager to be the first man at it. The instant an order came, John swung forward on his crutch with the brightest answer in the world.
        - id: ch01-b17
          speaker: long_john_silver
          text: >-
            Aye, aye, sir!
        - id: ch01-b18
          speaker: narrator
          text: >-
            When there was no work to do, he kept one song going after another, as though he could cover the other men's anger with his voice. But his performance did not reassure me. Of all the dark signs that afternoon, Long John's obvious worry was the darkest.
        - id: ch01-b19
          speaker: narrator
          text: >-
            We met in the cabin to decide what to do.
        - id: ch01-b20
          speaker: captain_smollett
          text: >-
            Sir, one more order could bring the whole crew down on us. If a man gives me a rough answer and I challenge him, they'll have their pikes out in seconds. If I let it pass, Silver will know we're suspicious, and then our game is over. Right now, there is only one man we can depend on.
        - id: ch01-b21
          speaker: squire_trelawney
          text: >-
            Who is that?
        - id: ch01-b22
          speaker: captain_smollett
          text: >-
            Silver, sir. He wants to quiet this trouble as much as we do. It's only a quarrel among the men, and he'd settle them if he got the chance. So let's give him that chance. We allow the crew an afternoon ashore. If every man goes, we take the ship and fight from here. If no one goes, we hold the cabin, and may God defend the right. If only some go, mark my words, Silver will bring them back as gentle as lambs.
        - id: ch01-b23
          speaker: narrator
          text: >-
            We agreed. Loaded pistols were handed to every man we knew was loyal. Hunter, Joyce, and Redruth were told the truth. They took the news with less surprise and more courage than we had expected. Then the captain went on deck to speak to the crew.
        - id: ch01-b24
          speaker: captain_smollett
          text: >-
            Men, we've had a hot day, and we're all tired and out of sorts. A little time ashore won't hurt anyone. The boats are still in the water, so take the gigs and go if you please. I'll fire a gun half an hour before sunset.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Those foolish men must have imagined they would trip over treasure the moment they landed. Their bad mood vanished, and they cheered so loudly that a distant hill sent back the echo. The birds rose again, flying and squalling around the anchorage.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The captain knew enough to get out of the way. He disappeared at once and left Silver to arrange the shore party. That was wise. If he had stayed, he could no longer have pretended that he did not understand what was happening. The truth was plain. Silver was captain now, and he had a powerful, rebellious crew.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Some loyal sailors were still aboard, as I soon learned, but they must have been slow to see the danger. Perhaps every man had been affected by the ringleaders, though some had gone further than others. A few were decent enough that no one could lead or drive them beyond a certain point. Shirking work was one thing. Seizing a ship and murdering innocent men was another.
        - id: ch01-b28
          speaker: narrator
          text: >-
            At last, Silver finished choosing the party. Six men would remain aboard. The other thirteen, Silver among them, began climbing into the boats.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Then the first of the wild ideas that later helped save our lives came into my head. Silver had left six men behind, so our side could not take the ship and defend it. But with only six left, the cabin party did not need my help at that moment. I decided at once to go ashore.
        - id: ch01-b30
          speaker: narrator
          text: >-
            In a flash, I slipped over the side and curled up in the front of the nearest boat. Almost at the same instant, it pushed away.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Almost no one noticed me. Only the man at the bow oar spoke.
        - id: ch01-b32
          speaker: bow_oarsman
          text: >-
            Jim, is that you? Keep your head down.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Silver was in the other boat. He looked sharply across the water and called out to ask whether that was me. From that moment on, I began to regret what I had done.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The two crews raced toward the beach. Our boat had started first. It was lighter and had the stronger crew, so we shot far ahead. The bow struck among the trees at the water's edge. I grabbed a branch, swung myself out, and plunged into the nearest thicket. Silver and the others were still a hundred yards behind.
        - id: ch01-b35
          speaker: long_john_silver
          text: >-
            Jim! Jim!
        - id: ch01-b36
          speaker: narrator
          text: >-
            I paid no attention. I jumped, ducked, and crashed through the brush, running straight ahead until I could not run another step.
