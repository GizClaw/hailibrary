audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    captain_smollett:
      display_name: 斯莫列特船长
      tts:
        delivery: 严肃克制，判断谨慎，说话干脆而有权威
        timbre: 冷峻坚实
        pace: 稳健
        pitch: 中低
    silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑爽朗，善于用水手口吻取信于人，激动时夸张有力
        timbre: 洪亮厚实，带一点粗粝感
        pace: 灵活明快
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静清醒，措辞从容而判断明确
        timbre: 温和清晰
        pace: 从容
        pitch: 中
    squire_trelawney:
      display_name: 特里劳尼乡绅
      tts:
        delivery: 豪爽热烈，说话直截了当而充满自信
        timbre: 洪亮饱满
        pace: 明快
        pitch: 中低
    anderson:
      display_name: 乔布·安德森
      tts:
        delivery: 粗鲁烦躁，带着不服管束的水手口气
        timbre: 粗哑厚重
        pace: 偏快
        pitch: 中低
    bow_oarsman:
      display_name: 船头桨手
      tts:
        delivery: 随口招呼，语气简短直接
        timbre: 粗朴清晰
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 阴沉的海岛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，我走上甲板，海岛已经换了一副模样。风完全停了，可我们夜里走了很远，如今停在低矮的东海岸东南方大约半英里外，四周一片无风。岛上大半都盖着灰色树林。低地间露出一道道黄沙，许多高大的松树越过别的树梢，有的独自挺立，有的聚成一丛，可整个海岛依旧灰暗凄凉，颜色单调得让人难受。
        - id: ch01-b02
          speaker: narrator
          text: 一座座光秃的石峰从树林上方拔起，形状全都古怪。望远镜山比别的山高出三四百英尺，也最奇特。它几乎四面陡直，到了顶上忽然平平截断，像一座等着安放雕像的台座。
        - id: ch01-b03
          speaker: narrator
          text: 伊斯帕尼奥拉号在长浪中颠簸，排水孔一下下浸进水里。帆桁扯着滑轮，舵来回猛撞。整条船又响又跳，像一座开足了工的工场。我死死抓住后支索，眼前仍转个不停。船往前走时，我还算经得起风浪，可这样停着，像瓶子一样被浪摇来晃去，我实在受不了。何况还是一早，肚子里空空的。
        - id: ch01-b04
          speaker: narrator
          text: 也许是晕船，也许是海岛的样子叫人难受。灰暗的树林，荒蛮的石峰，还有浪头在陡峭的海滩上翻起白沫，轰隆作响。太阳明明又亮又热，海鸟也在四周捕鱼啼叫。一个人在海上待了这么久，见到陆地本该高兴，可我的心却一直沉到了靴底。从第一眼起，我就连金银岛这个念头也厌恶透了。
        - id: ch01-b05
          speaker: narrator
          text: 那个上午很不好过。没有风，我们只好放下小艇，派人上去划桨，拖着大船绕过岛角，足足走上三四英里，再穿过窄窄的水道，进入骷髅岛后面的港湾。我也自告奋勇上了一条艇，其实那里根本没有我的事。天气闷热得让人喘不过气，水手们边干活边恶狠狠地抱怨。安德森管着我这条艇，不但不约束他们，反而跟抱怨得最凶的人一样叫得响。
        - id: ch01-b06
          speaker: anderson
          text: 算了吧！这活儿横竖也干不了一辈子。
        - id: ch01-b07
          speaker: narrator
          text: 这句话让我觉得很不妙。过去水手们一直干得又快又情愿，如今只看了海岛一眼，管束他们的绳索便松了。
        - id: ch01-b08
          speaker: narrator
          text: 进水道时，高个子约翰一直站在舵手身边引路。他熟悉这里，就像熟悉自己的手掌。探水的人量到的水深处处都比海图所标的更深，约翰却一次也没犹豫。
        - id: ch01-b09
          speaker: silver
          text: 退潮时这里的水流很急。要我说，这条水道简直像有人拿铲子挖出来的。
    - id: ch02
      title: 港湾里的雷雨云
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我们照着海图，在标着锚形的地方停下。一边是本岛，另一边是骷髅岛，船离两边都约有三分之一英里，水底全是干净的沙。铁锚猛地坠入水中，惊起成群的鸟。它们在树林上空盘旋尖叫，不到一分钟又全落了回去，四周重新安静下来。
        - id: ch02-b02
          speaker: narrator
          text: 港湾被陆地严严围住，深深藏在树林之间。树一直长到涨潮时海水所到的地方，岸边大多平坦。远处的山峰这里一座，那里一座，围成半圈，像个露天剧场。两条小河，说是河，其实更像两片沼泽，流进这片池塘似的水面。那一带岸边的树叶亮得有些吓人，仿佛带着毒。
        - id: ch02-b03
          speaker: narrator
          text: 屋子和寨子全藏在树里，从船上一点也看不见。要不是舱口旁摆着那张海图，我们几乎会以为，自从这座岛从海里升起来以后，还从没人来这里下过锚，而我们就是头一批闯进这片寂静水面的人。
        - id: ch02-b04
          speaker: narrator
          text: 空气纹丝不动。一丝风也没有。半英里外，海浪沿着外侧的沙滩轰响，又撞上礁石，那是唯一的声音。锚地上罩着一股古怪而凝滞的气味，是湿透的落叶和腐烂树干散出来的。医生不停地抽鼻子，好像刚尝了一口坏鸡蛋。
        - id: ch02-b05
          speaker: doctor_livesey
          text: 宝藏有没有，我不敢说。不过我敢拿自己的假发打赌，这地方一定有热病。
        - id: ch02-b06
          speaker: narrator
          text: 水手们在艇上已经叫人不安，回到船上就更危险了。他们东倒西歪地躺在甲板上，凑在一起低声咆哮。哪怕只下一道最轻微的命令，也会招来一张阴沉的脸。他们就算照办，也是勉勉强强，既粗心又敷衍。连那些忠诚的水手似乎也染上了这股邪气，船上没有一个人肯劝别人收敛。叛乱像一团雷雨云，已经沉沉压在我们头顶。
        - id: ch02-b07
          speaker: narrator
          text: 看出危险的不只是我们这些住船舱的人。高个子约翰也急坏了。他从这群人走到那群人那里，好话说了一遍又一遍，表现得比谁都殷勤和气，见到每个人都满脸堆笑。命令一下来，他马上拄着拐杖赶去，用世上最爽快的声音答应。没事可做时，他就一首接一首唱个不停，仿佛想用歌声盖住别人的不满。
        - id: ch02-b08
          speaker: silver
          text: 是，是，先生！
        - id: ch02-b09
          speaker: narrator
          text: 那个下午处处阴沉，可最让我害怕的，还是约翰这份藏不住的焦虑。于是，我们进船舱商量对策。
    - id: ch03
      title: 船长的计策
      blocks:
        - id: ch03-b01
          speaker: captain_smollett
          text: 先生，我要是再下一道命令，全船的人转眼就会扑过来。事情摆在这里。我下令，他们蛮横地顶嘴。我若还嘴，他们马上就会拿起长矛。我若不还嘴，西尔弗又会看出不对，我们照样完蛋。现在只有一个人能靠得住。
        - id: ch03-b02
          speaker: squire_trelawney
          text: 是谁？
        - id: ch03-b03
          speaker: captain_smollett
          text: 西尔弗，先生。他跟我们一样，也急着把乱子压下去。现在还只是闹别扭，只要给他机会，他很快就能把人劝住。所以我想，让水手们上岸待一个下午。要是全去了，我们就夺船守船。要是一个也不去，我们便守住船舱，愿上帝保佑有理的一方。要是只走一部分，您记住，西尔弗会把他们带回来，一个个温顺得像羊羔。
        - id: ch03-b04
          speaker: narrator
          text: 大家就这样定了下来。装好弹药的手枪发给了每个确定可靠的人。亨特、乔伊斯和雷德鲁思也被叫来，知道了全部实情。他们没有我们想的那么吃惊，胆气也比我们预料的更足。接着，船长走上甲板，对全体水手开口。
        - id: ch03-b05
          speaker: captain_smollett
          text: 伙计们，今天又热又累，大伙儿都不痛快。上岸走走，对谁也没坏处。小艇还在水里，你们谁愿意去，都可以在岸上待一下午。日落前半小时，我会放一炮叫你们回来。
        - id: ch03-b06
          speaker: narrator
          text: 那群傻瓜大概以为一下船就会被宝藏绊断小腿。他们转眼便不再生气，一起放声欢呼。喊声在远处一座山间激起了回响，港湾四周的鸟也再次飞起来，在锚地上空盘旋着尖声乱叫。
        - id: ch03-b07
          speaker: narrator
          text: 船长很聪明，不肯留在那里碍事。他说完就躲开，把安排上岸人手的事留给西尔弗。他若还站在甲板上，连装作不明白局势都不可能。事情已经像白昼一样清楚。真正指挥水手的是西尔弗，而他手下是一群叛意汹汹的人。
        - id: ch03-b08
          speaker: narrator
          text: 船上确实还有忠诚的人，我很快就会亲眼看见。只是他们一定迟钝得很。更准确地说，所有人都受了带头闹事者的坏榜样影响，不过有深有浅。有几个人本性还算正直，无论别人怎么引诱、怎么逼迫，也不肯再多走一步。偷懒躲活是一回事，夺下一条船，再杀害一群无辜的人，是完全不同的另一回事。
    - id: ch04
      title: 我的疯狂念头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 过了一阵，上岸的人终于选好了。六个人要留在船上，其余十三个人，包括西尔弗在内，全都开始登上小艇。
        - id: ch04-b02
          speaker: narrator
          text: 就在这时，我冒出了第一个疯狂念头。后来，正是这类念头帮我们保住了性命。西尔弗留下六个人，我们显然没法夺船。可船上只剩六个叛徒，船舱里的人眼下也不需要我帮忙。我立刻决定上岸。转眼间，我已经溜下船舷，蜷在最近那条小艇的前座。几乎就在同时，小艇划了出去。
        - id: ch04-b03
          speaker: bow_oarsman
          text: 是你吗，吉姆？把头低下去。
        - id: ch04-b04
          speaker: narrator
          text: 没有别人注意到我，只有船头的桨手随口问了一句。可是另一条艇上的西尔弗猛然望来，高声问那是不是我。从那一刻起，我便开始后悔自己做了这件事。
        - id: ch04-b05
          speaker: narrator
          text: 两条艇抢着往海滩划。我坐的这一条本来就稍稍领先，又轻一些，划船的人也更多，很快把另一条远远抛在后面。船头一撞进岸边的树丛，我便抓住一根树枝，荡出小艇，一头钻进最近的灌木。西尔弗他们还在一百码以外。
        - id: ch04-b06
          speaker: silver
          text: 吉姆！吉姆！
        - id: ch04-b07
          speaker: narrator
          text: 你们一定猜得到，我根本不理他。我一会儿跳，一会儿低头闪躲，硬从枝叶间闯过去，只顾朝正前方飞跑，直到再也跑不动才停下来。
