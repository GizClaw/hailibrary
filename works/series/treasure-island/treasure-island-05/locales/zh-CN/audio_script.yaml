audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    pew:
      display_name: 皮尤
      tts:
        delivery: 凶狠急躁，命令中带着失控的贪婪
        timbre: 尖厉粗哑
        pace: 急促逼人
        pitch: 中高
    pirate:
      display_name: 海盗
      tts:
        delivery: 粗野戒备，危急时慌乱犹疑
        timbre: 粗粝低沉
        pace: 偏快
        pitch: 中低
    dance:
      display_name: 丹斯先生
      tts:
        delivery: 爽朗直率，带着办事人的利落劲头
        timbre: 洪亮结实
        pace: 明快
        pitch: 中
  chapters:
    - id: ch01
      title: 海盗闯进客店
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 好奇心到底还是压过了恐惧。我不能一直躲着，又悄悄爬回河岸，把头藏到金雀花后面。从那里，我正好能看见客店门前的整条路。刚藏好，敌人就来了。七八个人拼命奔跑，脚步杂乱地敲着路面。提灯笼的领先几步，冲在最前面。还有三个人手拉着手一起跑。隔着浓雾，我仍看出中间那个正是瞎眼乞丐。他一开口，我就确定自己没有认错。
        - id: ch01-b02
          speaker: pew
          text: 把门给我撞开！
          emotion: angry
        - id: ch01-b03
          speaker: pirate
          text: 是，老大！
        - id: ch01-b04
          speaker: narrator
          text: 两三个人一齐冲向本博将军客店，提灯笼的也紧跟过去。他们忽然停住，压低嗓门说了几句。大门竟然敞开着，这显然出乎他们的意料。可他们只迟疑了片刻，皮尤立刻又下了命令。他又急又怒，声音尖得像着了火。
        - id: ch01-b05
          speaker: pew
          text: 都进去！快进去！别磨磨蹭蹭的！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 四五个人马上进了屋，另有两个留在路上陪着皮尤。安静了一会儿，里面突然传出一声惊叫。
        - id: ch01-b07
          speaker: pirate
          text: 比尔死了！
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: 皮尤又骂他们耽误工夫。
        - id: ch01-b09
          speaker: pew
          text: 你们几个懒骨头去搜他的身，其他人上楼，把箱子搬下来！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 脚步轰隆隆地踏上我家的旧楼梯，整座屋子仿佛都在发抖。很快，楼上又是一阵惊呼。船长房间的窗户砰地打开，碎玻璃叮当乱响。一个人把头和肩膀探进月光里，朝路上的皮尤喊。
        - id: ch01-b11
          speaker: pirate
          text: 皮尤，有人赶在我们前面！箱子已经被翻了个底朝天。
        - id: ch01-b12
          speaker: pew
          text: 那东西还在吗？
        - id: ch01-b13
          speaker: pirate
          text: 钱还在。
        - id: ch01-b14
          speaker: narrator
          text: 皮尤狠狠咒骂起那些钱来。
        - id: ch01-b15
          speaker: pew
          text: 谁问钱了？我要的是弗林特那一拳留下的东西！
          emotion: angry
        - id: ch01-b16
          speaker: pirate
          text: 这里根本没有。
        - id: ch01-b17
          speaker: pew
          text: 楼下的人听着，比尔身上有没有？
        - id: ch01-b18
          speaker: narrator
          text: 搜查尸体的家伙来到门口。
        - id: ch01-b19
          speaker: pirate
          text: 比尔早就被人搜过了，身上什么也没有。
        - id: ch01-b20
          speaker: pew
          text: 准是客店里的人干的，就是那个小崽子！我早该挖掉他的眼睛！刚才他们还在这里，我来时门还闩着。都散开，把他们找出来！
          emotion: angry
        - id: ch01-b21
          speaker: pirate
          text: 没错，他们连灯都没带走。
        - id: ch01-b22
          speaker: pew
          text: 快去找！把这座屋子彻底翻过来！
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: 皮尤边喊边用手杖猛敲路面。老客店里顿时乱成一团。沉重的脚步来回奔踏，家具一件件被推倒，房门也被踹开。那响声大得连四周的岩石都传回了回声。最后，海盗一个接一个回到路上，都说屋里根本找不到我们的踪影。
    - id: ch02
      title: 最后的警报
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这时，那阵曾经吓得我和母亲逃出客店的口哨，又划过了夜空，而且连续响了两次。起初我还以为，这是皮尤召集同伙进攻的号角。看到海盗们的反应，我才明白，口哨来自村庄方向的山坡，是在警告他们危险就要到了。
        - id: ch02-b02
          speaker: pirate
          text: 又是德克，两声！弟兄们，我们非走不可了。
          emotion: fearful
        - id: ch02-b03
          speaker: pew
          text: 走什么，你这个缩头乌龟！德克向来又蠢又胆小，别管他。那两个人肯定就在附近，东西眼看就到手了。散开去找，你们这些狗！我要是有双眼睛就好了！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 这番话多少有点作用。两个人总算到杂物中间东翻西看，可他们并不用心，还时时分神提防着自己的危险。其余的人仍站在路上，犹犹豫豫，拿不定主意。
        - id: ch02-b05
          speaker: pew
          text: 几千枚金币就在你们手边，你们却不肯动！找到它，你们个个都能富得像国王。你们知道东西就在这里，还只管躲着。你们谁敢去面对比尔？一个都没有！可我去了，我还是个瞎子！难道我发财的机会，就要毁在你们手里？我本来能坐着马车四处走，现在却还得趴在地上讨酒喝！只要你们还有一块饼干里的象鼻虫那么点胆量，现在就能抓住他们！
          emotion: angry
        - id: ch02-b06
          speaker: pirate
          text: 见鬼吧，皮尤！我们不是已经拿到达布隆金币了吗？
        - id: ch02-b07
          speaker: pirate
          text: 那东西也许被他们藏起来了。皮尤，拿上乔治金币走吧，别在这里号叫了。
        - id: ch02-b08
          speaker: narrator
          text: 皮尤的确是在号叫。这几句反驳让他的怒火越烧越旺，到最后，他彻底失去了理智。他看不见人，只管向左右胡乱挥杖，沉重的棍子接连打中了好几个人。那些人也回过头来咒骂这个瞎眼恶棍，还用吓人的话威胁他。他们想抓住手杖，从他手里夺走，却怎么也抓不住。
        - id: ch02-b09
          speaker: narrator
          text: 正是这场争吵救了我们。他们还在吵时，村庄那边的山顶忽然传来隆隆马蹄声。几乎同时，树篱旁闪起一道火光，一声枪响紧跟着传来。这显然是最后的危险信号。海盗们立刻转身逃跑。有人沿海湾奔向海边，有人斜着穿过山坡，其他人也各自四散。不到半分钟，所有人都没了踪影，路上只剩下皮尤。
        - id: ch02-b10
          speaker: narrator
          text: 也许他们吓得只顾逃命，也许他们恨透了皮尤刚才的辱骂和棍打，我说不清。总之，所有人都把他丢在了那里。皮尤独自留在路上，发疯似的用手杖来回点探。他一边摸索着乱走，一边大声呼唤同伴。后来，他走错方向，朝村庄跑了几步，正好从我的藏身处旁边经过。
        - id: ch02-b11
          speaker: pew
          text: 约翰尼！黑狗！德克！弟兄们，你们不会丢下老皮尤吧？不能把老皮尤扔下啊！
          emotion: fearful
    - id: ch03
      title: 皮尤的末日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时，马蹄声越过了坡顶。四五名骑手出现在月光里，正全速冲下山坡。皮尤这才知道自己跑错了。他尖叫着转身，直奔路沟，一头滚了进去。可他转眼又站起来，再次拔腿狂奔。这时他已经彻底慌乱，完全分不清方向，竟径直冲到最前面那匹马的蹄下。
        - id: ch03-b02
          speaker: narrator
          text: 骑手竭力想避开他，却已经来不及了。皮尤发出的尖叫刺破夜空，随即倒了下去。四只马蹄从他身上踩过，又把他踢到一旁，继续奔了过去。皮尤先是侧身倒着，接着身体一软，慢慢伏到地上，再也没有动。
        - id: ch03-b03
          speaker: narrator
          text: 我一下跳起来，高声招呼那些骑手。其实，他们已经开始收缰停车，那场意外把他们全吓坏了。我很快认出了来人。落在队伍最后的，是村里派去找利弗西医生的小伙子。其余的人都是缉私官。小伙子半路遇见他们，马上想到该带着他们返回客店，于是领着众人赶了回来。
        - id: ch03-b04
          speaker: narrator
          text: 原来，不知是谁把基特洞出现小帆船的消息传到了缉私队长丹斯耳中。这消息让他当晚就率人朝我们这里赶来。母亲和我能从海盗手里保住性命，正是多亏了这件事。
        - id: ch03-b05
          speaker: narrator
          text: 皮尤死了，死得不能再死。母亲被大家抬到村里。人们给她用了一点冷水和嗅盐，她很快便醒了过来。那场惊吓没有伤着她的身体，可她心里仍放不下那笔账，还在惋惜没把余下的钱拿足。
        - id: ch03-b06
          speaker: narrator
          text: 丹斯队长同时用最快的速度赶往基特洞。他的手下只好下马，在小山谷里摸黑往下走。他们牵着马，有时还得扶稳马匹，一路又怕有人埋伏。这样一来，等他们终于赶到，小帆船已经启航，也就不奇怪了。好在船离岸还不远。丹斯朝船上喊话，船上也有人回答。
        - id: ch03-b07
          speaker: pirate
          text: 离开月光！不然我就给你吃一颗铅弹！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 对方话音刚落，一颗子弹就飞了过来，擦着丹斯的手臂呼啸而过。没多久，小帆船绕过岬角，再也看不见了。丹斯说，自己只能站在那里，活像一条离了水的鱼。他唯一还能做的，就是派一个人去B镇，通知那里的缉私艇。
        - id: ch03-b09
          speaker: dance
          text: 可那几乎一点用也没有。他们已经逃得干干净净，这事算是完了。不过，我倒很高兴踩痛了皮尤少爷的鸡眼。
    - id: ch04
      title: 去见利弗西医生
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，丹斯已经听我讲完了整件事的经过。我跟着他回到本博将军客店。你简直想象不出，那里被砸成了什么样子。海盗为了疯狂搜寻我和母亲，家具和房门都毁了，连时钟也被推倒在地。真正丢掉的东西，只有船长的钱袋和钱柜里的一点银币。可我一眼就看得出来，这间客店已经被毁了，我们也完了。丹斯望着满屋狼藉，怎么也想不通，他们究竟在找什么。
        - id: ch04-b02
          speaker: dance
          text: 你说，他们已经拿走钱了？那么，霍金斯，他们还想找什么？难道是更多的钱？
        - id: ch04-b03
          speaker: narrator
          text: 不，先生，我想不是钱。说实话，我相信他们要找的东西就在我的上衣内袋里。我很想把它放到安全的地方。
        - id: ch04-b04
          speaker: dance
          text: 当然，孩子，你想得很对。你要是愿意，可以交给我保管。
        - id: ch04-b05
          speaker: narrator
          text: 我本来想，也许该交给利弗西医生……
        - id: ch04-b06
          speaker: dance
          text: 对极了！他是绅士，也是治安官。我正好也该去他那里，把今晚的事报告给他或者乡绅。皮尤少爷到底是死了。我不为他难过，可他确实死了。只要找得到借口，人们准会怪到国王的缉私官头上。霍金斯，你愿意的话，我带你一起去。
        - id: ch04-b07
          speaker: narrator
          text: 我真心感谢丹斯先生的好意，跟着大家走回村子，马匹都留在那里。等我把自己的打算告诉母亲，众人已经一个接一个跨上马背，做好了出发的准备。
        - id: ch04-b08
          speaker: dance
          text: 多格，你的马不错。让这孩子坐在你身后。
        - id: ch04-b09
          speaker: narrator
          text: 我上了马，双手紧紧抓住多格的腰带。丹斯队长一声令下，我们便沿着通往利弗西医生家的路，轻快地小跑起来。
