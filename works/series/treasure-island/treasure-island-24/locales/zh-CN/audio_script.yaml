audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
  chapters:
    - id: ch01
      title: 峭壁下的海狮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我醒来时，天已经大亮。小圆舟载着我，在金银岛西南端的海面上颠簸。太阳早已升起，可望远镜山庞大的山体挡在后面。这边的山势几乎直落海中，一眼望去，全是吓人的峭壁。
        - id: ch01-b02
          speaker: narrator
          text: 拉帆索角和后桅山就在身边。山岭光秃秃、黑沉沉的，海角四周是四五十英尺高的悬崖，下面堆满从崖上落下的巨石。我离岸不到四分之一英里，立刻想划过去上岸。
        - id: ch01-b03
          speaker: narrator
          text: 可这个主意马上就行不通了。海浪冲进乱石堆，喷涌着，大声咆哮着。回声一阵接一阵，沉重的浪花不断飞起，再重重砸下。我若靠近，不是摔死在岸边，就是耗光力气，也爬不上那些向外伸出的峭壁。
        - id: ch01-b04
          speaker: narrator
          text: 更叫人害怕的还在后面。岩台上挤着四五十头又大又滑的怪物，有的慢慢爬动，有的砰地落进海里。它们像大得没法想象的软体蜗牛，吠叫起来，连岩石都跟着回响。后来我才知道，那是海狮，并不会伤人。可当时我哪里知道？看着它们，再看看难以攀登的海岸和一阵高过一阵的浪，我宁可饿死在海上，也不愿从这里登陆。
        - id: ch01-b05
          speaker: narrator
          text: 好在前面似乎还有机会。拉帆索角北面，陆地向内凹进去很远，退潮后会露出一大片长长的黄沙。再向北就是林木角，海图上写着这个名字。那里长满高大的青松，一直绿到海边。
        - id: ch01-b06
          speaker: narrator
          text: 西尔弗说过，金银岛西岸有股海流，一路向北。我已经被它推着走了。于是我放弃拉帆索角，决定省下力气，等到了看起来温和得多的林木角，再想办法上岸。
    - id: ch02
      title: 学会顺着波浪走
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 海上涌着宽阔而平缓的长浪。南风稳定地轻轻吹来，和海流方向一致，所以波浪只是一起一伏，没有碎开。若是风和海流相冲，我早就没命了。可眼下，那条又小又轻的船竟能那么轻松、那么稳当地乘着浪走，实在叫人惊奇。
        - id: ch02-b02
          speaker: narrator
          text: 我躺在船底，只把一只眼睛探过船舷。常有一座蓝色浪峰从近处升起来，高高悬在头顶。小圆舟只是轻轻蹦几下，像装了弹簧一样。越过浪峰以后，它又轻得像只鸟，落入另一边的浪谷。
        - id: ch02-b03
          speaker: narrator
          text: 过了一会儿，我胆子大了，坐起来试着划桨。哪知道，在小圆舟里只要稍稍挪动重量，它马上就会变个样。我才刚动，它便不再轻轻跳舞，而是沿着一道陡得让人头晕的水坡直冲下去，船头一下扎进迎面的浪里，水花猛地喷了起来。
        - id: ch02-b04
          speaker: narrator
          text: 我浑身湿透，也吓坏了，赶紧倒回原来的姿势。小圆舟这才重新找准方向，又温顺地载着我穿过波浪。看来我碰不得它。可我要是什么也做不了，又怎么可能上岸呢？
        - id: ch02-b05
          speaker: narrator
          text: 我怕得厉害，头脑却还清醒。我小心挪动，用水手帽一点点舀掉船里的水。然后又把眼睛探过船舷，仔细看小圆舟究竟怎么从滚滚波涛中滑过去。
        - id: ch02-b06
          speaker: narrator
          text: 这一看我才明白。每道浪都不是岸上看见的那种光滑大山。它跟陆地上的山岭一样，有高峰，有缓坡，也有山谷。只要不去打扰，小圆舟就会自己左右转动，专从低处穿过，躲开陡坡和快要倒下来的浪头。
        - id: ch02-b07
          speaker: narrator
          text: 我心里有了办法。身体必须老老实实躺着，不能破坏平衡。不过到了水势平缓的地方，我可以把桨伸出去，轻轻划上一两下，让船头朝岸边转。这个念头刚冒出来，我就动手了。我用双肘撑着，难受地趴在船底，等船进入浪间的平缓处，便勉强划上一两桨。
    - id: ch03
      title: 错过林木角
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这办法又慢又累，可我确实离岸越来越近。到了林木角附近，我看得出来，这座海角一定赶不上了。不过我已经向东挪了几百码，离岸也很近。凉爽青翠的树梢就在眼前，随着风一齐摇摆。我相信下一座岬角一定能上去。
        - id: ch03-b02
          speaker: narrator
          text: 这次机会来得正是时候，因为口渴已经在折磨我。烈日从头顶晒下来，海面又把阳光千百倍地照回来。海水不停溅到身上，又被太阳晒干，连嘴唇都结满盐霜。我的喉咙火烧似的，脑袋也突突地疼。那些树明明近在眼前，清凉的绿荫仿佛伸手就能够到，我却只能看着，馋得几乎病倒。
        - id: ch03-b03
          speaker: narrator
          text: 可海流毫不理会我的愿望，很快就把我带过了岬角。前方又展开一片海面，我看到的景象，让口渴和上岸的念头全变了样。西斯帕尼奥拉号就在正前方，离我不到半英里，正扬着帆。我自然以为自己会被船上的人抓住。可我渴得那么难受，竟不知道该高兴还是发愁。还没想明白，惊讶已经占满了我的心，我只能盯着它看。
        - id: ch03-b04
          speaker: narrator
          text: 大船升着主帆和两面艏帆，雪白的帆在太阳下闪着银光。起初，所有帆都吃满了风，船朝西北走。我猜他们正绕过岛去，准备回到锚地。接着，大船越来越偏向西边。我还以为他们发现了我，正在掉头追来。可最后，它竟迎头撞进风里，帆被风从正面兜住，只能停在那里，帆布不停地发抖。
        - id: ch03-b05
          speaker: narrator
          text: 我说，这群人真是笨手笨脚，准还醉得像猫头鹰。要是斯莫利特船长在，他早就把他们指使得满船飞跑了。
        - id: ch03-b06
          speaker: narrator
          text: 帆船慢慢偏开风向，换到另一舷，又吃上了风。它飞快走了一两分钟，随后再次迎头顶风。一次又一次，西斯帕尼奥拉号忽东忽西，忽南忽北，到处猛冲乱闯。可每一次，最后都回到原样，只剩帆布懒洋洋地拍打。船上显然没人掌舵。那些人究竟在哪里？我想，他们不是醉倒了，就是弃船走了。要是我能登船，也许就能把它还给船长。
    - id: ch04
      title: 追赶无人掌舵的大船
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 海流把小圆舟和帆船用同样的速度向南推。大船自己却走得毫无章法，常常顶风停很久。就算它没有倒退，也占不到一点便宜。只要我敢坐起来划，就一定能追上它。这个冒险的计划让我精神大振。再想到前舱口旁边那只淡水桶，我的勇气一下又翻了一倍。
        - id: ch04-b02
          speaker: narrator
          text: 我坐起身，立刻被一片水雾迎面扑中。这回我没有躺下，而是又用力、又小心地追着无人掌舵的大船划去。有个大浪灌进船里，我的心吓得像鸟一样乱跳，只得停下来舀水。慢慢地，我掌握了诀窍，能带着小圆舟在浪间穿行。船头只是偶尔挨上一记，浪花也只是偶尔打到脸上。
        - id: ch04-b03
          speaker: narrator
          text: 我很快追近了，连舵柄来回猛撞时，上面的黄铜闪光都看得见。可甲板上还是一个人影也没有。我只好相信船被遗弃了。否则，那些人就是醉倒在舱下。说不定我能把他们关在里面，把舱门牢牢钉死，然后随意处置这条船。
        - id: ch04-b04
          speaker: narrator
          text: 偏偏有一阵，大船停在原地，这对我最不利。它船头几乎正对南方，一直左右摇摆。每次稍稍偏开，船帆就会吃上一点风，又立刻把船推回风口。它看着无可奈何，帆布却像大炮一样炸响，滑车在甲板上滚来撞去。大船不只跟我一起被海流带走，还在大幅向侧面漂移。它就靠这股侧漂不断离我远去，我怎么追也追不上。
        - id: ch04-b05
          speaker: narrator
          text: 我的机会终于来了。风有几秒钟变得很弱，几乎完全停了。海流逐渐推着西斯帕尼奥拉号，让它围着自身中心慢慢旋转，最后把船尾朝向我。船舱窗口还大敞着，桌子上方的灯竟从夜里一直亮到白天。主帆像一面垂下的旗，软软地挂在那里。要不是海流仍在推动，大船简直一点也没动。
        - id: ch04-b06
          speaker: narrator
          text: 我刚才已经被它落下了一段，现在赶紧加倍用力，又开始接近它。离船不到一百码时，风却猛地回来了。大船左舷受风，船帆一下鼓满。它俯身擦过海面，像燕子一样飞走了。
    - id: ch05
      title: 无路可退
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我先是绝望，紧接着却一阵狂喜。大船转了过来，整个侧舷正对着我。它还在继续转，越过我们之间一半的距离，又越过三分之二，接着是四分之三。距离越来越短，我能看见船头切进海面，下面的海水沸腾似的滚成一片白沫。从低矮的小圆舟里仰望，那条船高大得惊人，仿佛正朝我压下来。
        - id: ch05-b02
          speaker: narrator
          text: 我突然明白发生了什么，可已经没有时间多想，也没有多少时间动手救自己。我在一道长浪顶上，大船正从下一道浪上俯冲下来，艏斜桅已经悬到了我的头顶。我猛地站起，纵身跳过去，把小圆舟重重一脚踩进水里。一只手抓住艏帆伸臂，一只脚卡在支索和帆脚索之间。
        - id: ch05-b03
          speaker: narrator
          text: 我气喘吁吁地攀在那里，仍旧一直死死抓住不放。耳边忽然传来一声闷响，我立刻明白，西斯帕尼奥拉号已经冲下来，撞中了小圆舟。我的退路就这样彻底断绝了，只能留在这条大船上。
