audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: "XXIV The Cruise of the Coracle"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It was broad daylight when I woke. The coracle was tossing near the southwest end of Treasure Island. The sun was already up, though the great bulk of the Spy-glass hid it from me. On this side, the mountain dropped almost to the sea in fearsome cliffs.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Haulbowline Head and Mizzenmast Hill were close beside me. The hill stood bare and dark. Cliffs forty or fifty feet high ringed the headland, with huge piles of fallen rock below them. I was less than a quarter mile offshore, and my first thought was to paddle in and land.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I soon gave that up. Breakers burst among the fallen rocks with a roar. Heavy spray flew up and crashed down again, one wave after another. If I went any closer, I could see exactly what would happen. The rough shore would smash me to death, or I would waste all my strength trying to climb those overhanging cliffs.
        - id: ch01-b04
          speaker: narrator
          text: >-
            And there was something else. Huge, slimy creatures crawled together across the flat rocks. Others dropped into the sea with a loud smack. They looked like soft snails of an unbelievable size, and there must have been forty or sixty of them. Their barking echoed from the rocks.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I learned later that they were sea lions and quite harmless. At the time, the sight of them was enough. Between those creatures, the difficult shore, and the high surf, I wanted nothing to do with that landing place. I would rather starve at sea than face all those dangers.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I thought I had a better chance farther north. Beyond Haulbowline Head, the coast curved far inward. At low tide, it left a long strip of yellow sand. Past that lay another point marked on the chart as Cape of the Woods. Tall green pines covered it all the way down to the sea.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Silver had said that a current ran north along the whole west coast of the island. I could tell it had already caught me. So I let Haulbowline Head fall behind and saved my strength for the friendlier-looking Cape of the Woods.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The sea rolled in a great, smooth swell. A gentle wind blew steadily from the south, moving with the current instead of against it. The waves rose and fell without breaking. If wind and current had fought each other, I would have died long before. As it was, my little light boat rode the water with surprising ease. I could do nothing to help her, yet she stayed safe among waves that looked enormous from where I lay.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I lay in the bottom with only one eye above the side. Again and again, a great blue crest would lift beside me. The coracle merely bounced, danced as if it were riding on springs, then slipped down into the next hollow as lightly as a bird.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Before long, I grew bold enough to sit up and try paddling. That was a mistake. In a coracle, even the smallest shift of weight can change everything. The moment I moved, the boat stopped its gentle dance. It shot down such a steep slope of water that I felt dizzy, then drove its nose deep into the next wave and threw spray everywhere.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Soaked and terrified, I dropped straight back into my old position. At once the coracle righted herself and carried me softly through the swells again. Clearly, she did not want my help. But if I could not guide her at all, how could I ever reach land?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Fear took hold of me, but I still kept my head. First, moving as carefully as I could, I used my sea cap to bail out the boat. Then I raised one eye above the side again and watched closely. I had to learn how the coracle slipped through the rollers so quietly.
        - id: ch01-b13
          speaker: narrator
          text: >-
            From shore or from a ship's deck, each wave looks like one smooth, shining mountain. Down where I was, it looked more like a whole range of hills on land. It had peaks, gentle places, and valleys. Left alone, the coracle turned from side to side and found a path through the lower water. She stayed clear of the steep slopes and the high crests that were ready to topple.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Then I saw what to do. I had to stay flat and keep the boat balanced. But whenever we reached a smooth place, I could dip the paddle over the side and give one or two strokes toward land. I tried it at once. Lying awkwardly on my elbows, I gave a weak stroke now and then to turn her head toward shore.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The work was slow and exhausting, but I was gaining ground. As I neared the Cape of the Woods, I saw that I was certain to miss the point. Still, I had moved several hundred yards east. The shore was close now. I could see the cool green treetops swaying in the breeze, and I felt sure I would reach the next point.
        - id: ch01-b16
          speaker: narrator
          text: >-
            I needed to land soon. Thirst had begun to torture me. The sun burned from overhead and flashed back from a thousand places on the waves. Sea spray kept falling on me and drying there until salt crusted my lips. My throat burned, and my head ached. Seeing the trees so close made me almost sick with longing.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Then the current swept me past the point. The next stretch of sea opened before me, and suddenly I forgot everything else.
        - id: ch01-b18
          speaker: narrator
          text: >-
            There, straight ahead and less than half a mile away, was the Hispaniola under sail. Of course, I felt certain they would pick me up. Yet I was suffering so badly for water that I could hardly decide whether to be glad or sorry. Before I could make up my mind, surprise took over. All I could do was stare.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The schooner carried her mainsail and two jibs. Her beautiful white canvas shone in the sun like snow or silver. When I first saw her, the wind filled every sail, and she was heading northwest. I supposed the men were sailing around the island toward the anchorage.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Soon she turned farther west. Perhaps they had spotted me and were coming after me. But then she swung straight into the wind and stopped there helplessly, her sails trembling and empty. I thought, "What clumsy fools. They must still be as drunk as owls." Captain Smollett would have made them move quickly enough.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The schooner slowly turned away and caught the wind on another tack. She raced ahead for a minute, then swung into the wind and stalled once more. It happened over and over. The Hispaniola darted this way and that, north and south, east and west. Every wild run ended the same way, with her canvas flapping uselessly.
        - id: ch01-b22
          speaker: narrator
          text: >-
            At last I understood. No one was steering her. But where were the men? I thought they must be dead drunk or else they had abandoned the ship. If I could climb aboard, perhaps I could take the Hispaniola back to her captain.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The current carried the schooner and my coracle south at the same speed. Her sailing was so wild, and she spent so much time trapped head-on to the wind, that she gained nothing. She might even have lost ground. If I dared sit up and paddle, I was sure I could catch her. The adventure of it filled me with courage. Then I remembered the water barrel beside the forward hatch, and my courage doubled.
        - id: ch01-b24
          speaker: narrator
          text: >-
            I sat up. Almost at once, a cloud of spray struck me. This time I held on and paddled after the unsteered Hispaniola with all the strength and care I had. One wave poured so much water into the coracle that I had to stop and bail. My heart fluttered like a bird. Little by little, though, I learned the trick. I guided the boat between the waves, taking only an occasional blow on the bow or a burst of foam in my face.
        - id: ch01-b25
          speaker: narrator
          text: >-
            I was closing on the schooner fast. I could see the brass flashing on the tiller as it swung and banged, but not one person appeared on deck. I had to believe the ship was deserted. If the men were still aboard, they must be lying drunk below. Perhaps I could shut them in and take control of the ship.
        - id: ch01-b26
          speaker: narrator
          text: >-
            For a while, the Hispaniola did the worst possible thing for me. She stood nearly still with her bow pointing south, though she kept swinging from side to side. Whenever she turned away, her sails partly filled and quickly pushed her back into the wind. She looked helpless. Her canvas cracked like cannon fire, and the blocks rolled and hammered across the deck. Even so, she kept escaping me. The current carried her along, and her broad side gave the wind plenty to push against. All that sideways drift kept adding to the distance between us.
        - id: ch01-b27
          speaker: narrator
          text: >-
            At last, my chance came. The breeze nearly died for a few seconds. The current caught the Hispaniola and slowly turned her around her center until her stern faced me. The cabin window still gaped open, and the lamp above the table was still burning in full daylight. The mainsail drooped like a hanging banner. Except for the current, the ship did not move.
        - id: ch01-b28
          speaker: narrator
          text: >-
            I had been losing ground, but now I put twice as much strength into the paddle and began to catch her again. I came within a hundred yards. Then the wind returned with a clap. The sails filled on the port tack, and the schooner sped away, leaning low and skimming like a swallow.
        - id: ch01-b29
          speaker: narrator
          text: >-
            At first, I despaired. The next moment, I was delighted. She kept turning until her broad side faced me. Still she came around, sweeping across half the space between us, then two thirds, then three quarters. White water boiled beneath her bow. From my place so low in the coracle, she looked immensely tall.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Then I suddenly understood the danger. There was hardly time to think, hardly time to save myself. My coracle rose to the top of one swell just as the schooner plunged over the next. Her bowsprit passed above my head.
        - id: ch01-b31
          speaker: narrator
          text: >-
            I sprang up and jumped, driving the coracle underwater. One hand caught the jib boom, and one foot wedged between a stay and a brace. I hung there, panting. Then a dull crash sounded below me. The schooner had struck the coracle. I had no way back. I was aboard the Hispaniola.
