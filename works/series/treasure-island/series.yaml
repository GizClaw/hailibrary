cover_prompt: |-
  A wordless cover scene aboard the Hispaniola in the eighteenth-century Caribbean shows Jim Hawkins watching Treasure Island rise beyond the bow. Jim is a lean teenage boy with windblown brown hair, a loose cream sailor's shirt, dark waistcoat, knee breeches, and sturdy shoes, holding a rolled but completely blank chart. Long John Silver is a broad one-legged seaman with a weathered face, blue coat, wooden crutch, and green parrot on his shoulder, standing at a measured distance without menace. Jim steps toward the rail as the island's twin hills emerge through sea mist, making discovery and wary curiosity the focal action. Use a low deck-level view framed by rigging and sails, with the island centered below generous open sky. Keep ship, clothing, and equipment historically credible, the adventure child-friendly, and every character independent of film or illustrated adaptation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
