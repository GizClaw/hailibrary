audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: vivid, thoughtful first-person storytelling
        timbre: warm and clear
        pace: measured
        pitch: medium
    captain:
      display_name: The Captain
      tts:
        delivery: rough, commanding, and weather-beaten
        timbre: gravelly and heavy
        pace: deliberate
        pitch: low
    doctor_livesey:
      display_name: Dr. Livesey
      tts:
        delivery: crisp, civil, and unwavering
        timbre: clean and resonant
        pace: composed
        pitch: medium
    mother:
      display_name: Mrs. Hawkins
      tts:
        delivery: caring, practical, and easily flustered
        timbre: warm and gentle
        pace: brisk
        pitch: medium-high
    black_dog:
      display_name: Black Dog
      tts:
        delivery: sly, threatening, and falsely friendly
        timbre: thin and rasping
        pace: watchful
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Stranger at the Inn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Not long after that came the first strange event that finally rid us of the captain, though it did not rid us of his affairs. The winter was bitterly cold, with hard frosts and heavy gales. My poor father grew weaker every day, and it seemed clear he would not live to see spring. Mother and I had the whole inn to manage, so we had little attention to spare for our unpleasant guest.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Early one January morning, frost covered the gray cove. It was a pinching, bitter morning. Small waves lapped softly at the stones, and the sun still sat low. Its light touched only the hilltops and shone far out at sea. The captain got up earlier than usual and walked down the beach. His cutlass swung beneath the broad skirts of his old blue coat, his brass telescope rested under his arm, and his hat tipped back from his head. I remember how his breath hung behind him like smoke as he strode away. As he passed the great rock, the last sound I heard was a loud, angry snort. He must still have been thinking about Dr. Livesey.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Mother was upstairs with Father while I set the breakfast table for the captain. Then the parlor door opened, and a man I had never seen stepped inside. He was pale and waxy, with two fingers missing from his left hand. He carried a cutlass, but he did not look like much of a fighter. I always watched for seafaring men, whether they had one leg or two, and this fellow puzzled me. He did not look quite like a sailor, yet there was something of the sea about him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I asked what he wanted. He ordered rum, but when I turned to fetch it, he sat on a table and motioned me closer. I stopped with my napkin still in my hand.
        - id: ch01-b05
          speaker: black_dog
          text: >-
            Come over here, sonny. Closer now.
        - id: ch01-b06
          speaker: narrator
          text: >-
            I moved one step toward him.
        - id: ch01-b07
          speaker: black_dog
          text: >-
            Is this table set for my old mate Bill?
        - id: ch01-b08
          speaker: narrator
          text: >-
            I said I knew no Bill. The table was for the man lodging with us, the one we called the captain.
        - id: ch01-b09
          speaker: black_dog
          text: >-
            Well, my mate Bill might call himself Captain. That's likely enough. He has a cut on one cheek, and when he's been drinking, he's got a mighty pleasant way about him. Let's say the scar is on his right cheek. Ah! I can see by your face that I was right. So tell me, is my mate Bill in this house?
        - id: ch01-b10
          speaker: narrator
          text: >-
            I told him the captain was out walking.
        - id: ch01-b11
          speaker: black_dog
          text: >-
            Which way did he go, sonny?
        - id: ch01-b12
          speaker: narrator
          text: >-
            I pointed toward the rock and explained when the captain would probably return. The stranger asked several more questions. Once I had answered them all, he seemed satisfied.
        - id: ch01-b13
          speaker: black_dog
          text: >-
            Seeing me will do Bill more good than a drink.
        - id: ch01-b14
          speaker: narrator
          text: >-
            His face made those words sound anything but friendly. I had my own reasons for thinking he was mistaken, even if he meant what he said. Still, it was none of my business, and I had no idea what to do. He kept hanging around just inside the inn door, peering around the corner like a cat watching for a mouse. Once, I stepped out into the road myself. He called me back at once, but I did not obey fast enough to please him. His pale face changed in a horrible way, and he cursed as he ordered me inside. I jumped.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The moment I came back, he became half flattering and half mocking again. He patted my shoulder, called me a good boy, and said he had taken a liking to me.
        - id: ch01-b16
          speaker: black_dog
          text: >-
            I've got a son of my own, just about your size. He's the pride of my heart. But the great thing for a boy is discipline, sonny. Discipline! If you'd ever sailed with Bill, you wouldn't stand there waiting for a man to call you twice. Bill never allowed that, and neither did any of the men who sailed with him. Why, here comes my old mate now, with his spyglass under his arm. Bless his old heart. Come into the parlor with me. We'll get behind the door and give Bill a fine surprise. Bless his heart again.
        - id: ch01-b17
          speaker: narrator
          text: >-
            He backed me into the parlor and put me behind him in a corner, where the open door hid us both. I was frightened and uneasy. It scared me even more to see that the stranger was frightened too. He freed the hilt of his cutlass and loosened the blade in its sheath. As we waited, he kept swallowing as if something were caught in his throat.
    - id: ch02
      title: Black Dog Meets Bill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last the captain strode in. He slammed the door without glancing either way and marched straight toward his breakfast.
        - id: ch02-b02
          speaker: black_dog
          text: >-
            Bill.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The stranger tried to make his voice sound big and bold. The captain spun around to face us. Every bit of brown drained from his face, and even his nose turned blue. He looked like a man staring at a ghost, or the devil, or something worse. In one instant he seemed so old and sick that I felt sorry for him.
        - id: ch02-b04
          speaker: black_dog
          text: >-
            Come on, Bill. You know me. Surely you remember an old shipmate.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The captain gasped.
        - id: ch02-b06
          speaker: captain
          text: >-
            Black Dog!
          emotion: fearful
        - id: ch02-b07
          speaker: black_dog
          text: >-
            Who else would it be? Black Dog himself, come to see his old shipmate Billy at the Admiral Benbow inn. Ah, Bill, we've seen plenty of times together, the two of us, since before I lost these two claws.
        - id: ch02-b08
          speaker: narrator
          text: >-
            He held up his damaged hand. The captain told him he had found the man he wanted, so he had better say what he came to say.
        - id: ch02-b09
          speaker: captain
          text: >-
            You've tracked me down. Here I am. Now speak up. What do you want?
        - id: ch02-b10
          speaker: black_dog
          text: >-
            That's the Bill I remember. First, this dear boy can bring me some rum. Then we'll sit down and talk honestly, like two old shipmates.
        - id: ch02-b11
          speaker: narrator
          text: >-
            By the time I returned with the rum, they sat across from each other at the breakfast table. Black Dog had taken the chair nearest the door and turned sideways. I thought he wanted one eye on the captain and the other on his escape.
        - id: ch02-b12
          speaker: black_dog
          text: >-
            Off you go, sonny, and leave that door wide open. I don't want you listening through any keyholes.
        - id: ch02-b13
          speaker: narrator
          text: >-
            I left them alone and went into the bar. For a long while, though I did my very best to listen, I heard nothing but the low rattle of their voices. At last they began speaking louder. I could make out a word here and there, and most of those words were the captain's curses.
        - id: ch02-b14
          speaker: captain
          text: >-
            No, no, no! That's the end of it!
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: >-
            A little later, he shouted again.
        - id: ch02-b16
          speaker: captain
          text: >-
            If one of us hangs for it, then every one of us ought to hang!
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: >-
            Suddenly, curses burst from the room, followed by a tremendous crash. A chair and the table went over together. Steel rang against steel, and someone cried out in pain. The next moment I saw Black Dog racing away, with the captain close behind him. Both men had drawn their cutlasses, and blood streamed from Black Dog's left shoulder. At the doorway, the captain aimed one last terrible blow at the fleeing man. It would certainly have split Black Dog down the back, but the blade struck the great Admiral Benbow sign instead. You can still see the notch on the lower edge of its frame.
        - id: ch02-b18
          speaker: narrator
          text: >-
            That blow ended the fight. Once Black Dog reached the open road, he ran amazingly fast despite his wound. Within half a minute, he vanished over the edge of the hill. The captain stayed where he was, staring at the sign like a bewildered man. He passed a hand over his eyes several times, then finally turned back into the inn.
    - id: ch03
      title: The Captain Falls
      blocks:
        - id: ch03-b01
          speaker: captain
          text: >-
            Jim, bring me rum.
        - id: ch03-b02
          speaker: narrator
          text: >-
            He swayed as he spoke and caught himself against the wall with one hand.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I asked if he was hurt.
        - id: ch03-b04
          speaker: captain
          text: >-
            Rum. I have to get away from here. Rum! Rum!
        - id: ch03-b05
          speaker: narrator
          text: >-
            I ran to get it, but everything that had happened left me so shaken that I broke one glass and made a mess of the tap. I only got more in my own way. While I was still struggling, a heavy crash came from the parlor. I hurried in and found the captain stretched out full length on the floor. At the same moment, Mother came running downstairs to help me. The shouts and fighting had frightened her. Together we lifted his head. His eyes were shut, his face had turned a dreadful color, and every breath came loud and hard.
        - id: ch03-b06
          speaker: mother
          text: >-
            Oh, dear, what a disgrace for the inn! And with your poor father lying sick upstairs!
        - id: ch03-b07
          speaker: narrator
          text: >-
            Neither of us knew how to help him. We had no thought except that the stranger must have wounded him badly enough to kill him in their fight. I finally brought the rum and tried to pour some down his throat, but his teeth were tightly shut and his jaws felt as strong as iron. What a happy relief it was when the door opened and Dr. Livesey came in on his visit to my father.
        - id: ch03-b08
          speakers: [narrator, mother]
          ensemble: duo
          text: >-
            Doctor, what can we do? Where has he been wounded?
        - id: ch03-b09
          speaker: doctor_livesey
          text: >-
            Wounded? Nonsense! He's no more wounded than you or I. The man has had a stroke, exactly as I warned him. Mrs. Hawkins, go upstairs to your husband and keep this from him if you can. As for me, I must try to save this fellow's thoroughly worthless life. Jim, bring me a basin.
        - id: ch03-b10
          speaker: narrator
          text: >-
            When I came back, the doctor had already cut open the captain's sleeve and uncovered his great, sinewy arm. It was tattooed in several places. On his forearm, neat, clear letters read, “Here's luck,” “A fair wind,” and “Billy Bones his fancy.” Up near his shoulder was a drawing of a gallows with a man hanging from it. I thought the picture had been done with plenty of spirit.
        - id: ch03-b11
          speaker: doctor_livesey
          text: >-
            That may tell the future. Now, Master Billy Bones, if that's really your name, let's see what color your blood is. Jim, does blood frighten you?
        - id: ch03-b12
          speaker: narrator
          text: >-
            I told him it did not.
        - id: ch03-b13
          speaker: doctor_livesey
          text: >-
            Good. Hold the basin.
        - id: ch03-b14
          speaker: narrator
          text: >-
            He opened a vein with his lancet.
    - id: ch04
      title: Dr. Livesey's Warning
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The doctor took a great deal of blood before the captain opened his eyes and looked around in a daze. First he recognized Dr. Livesey, and an unmistakable frown crossed his face. Then his gaze fell on me, and he looked relieved. But all at once, his color changed again. He struggled to raise himself from the floor and cried out.
        - id: ch04-b02
          speaker: captain
          text: >-
            Where's Black Dog?
          emotion: fearful
        - id: ch04-b03
          speaker: doctor_livesey
          text: >-
            There is no Black Dog here, except the one riding on your own back. You've been drinking rum, and you've had the stroke I warned you about. Much against my wishes, I've just pulled you headfirst out of the grave. Now, Mr. Bones...
        - id: ch04-b04
          speaker: captain
          text: >-
            That's not my name.
        - id: ch04-b05
          speaker: doctor_livesey
          text: >-
            I don't care. It's the name of a buccaneer I once knew, and I'm using it because it's short. Now listen to what I have to tell you. One glass of rum may not kill you, but after one you'll take another, and then another. I stake my wig on this. Unless you stop completely, you will die. Do you understand me? You will die and go to your own proper place, like the man in the Bible. Come now, make an effort. This once, I'll help you to bed.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Between us, and with a great deal of trouble, the doctor and I managed to haul him upstairs. We laid him on his bed, where his head dropped back against the pillow as if he were close to fainting.
        - id: ch04-b07
          speaker: doctor_livesey
          text: >-
            Remember what I've told you. For you, rum means death.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Then the doctor took me by the arm and went to see my father. As soon as he had shut the door, he spoke to me.
        - id: ch04-b09
          speaker: doctor_livesey
          text: >-
            This is not serious yet. I took enough blood to keep him quiet for a while. He should stay in bed for a week. That would be best for him and for you. But another stroke would finish him.
