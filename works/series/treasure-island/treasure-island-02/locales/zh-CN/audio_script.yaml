audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆
      tts:
        delivery: 沉着而有画面感，带着回忆往事的亲历感
        timbre: 清亮温暖的少年音色
        pace: 舒缓中带有冒险故事的张力
        pitch: 中高
    captain:
      display_name: 船长
      tts:
        delivery: 粗野强横，带着惯于发号施令的海上口气
        timbre: 沙哑厚重，像被海风和烈酒磨损过
        pace: 缓慢而逼人，发怒时骤然加快
        pitch: 低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 清楚有礼，面对威胁仍坚定从容
        timbre: 明亮清朗
        pace: 稳健利落
        pitch: 中
    black_dog:
      display_name: 黑狗
      tts:
        delivery: 油滑讥诮，讨好中藏着威胁，紧张时故作强硬
        timbre: 阴冷粗涩
        pace: 忽缓忽急
        pitch: 中低
    mother:
      display_name: 母亲
      tts:
        delivery: 勤谨善良，受惊时急促而直率
        timbre: 温厚清晰
        pace: 中等，慌乱时稍快
        pitch: 中
    jim_and_mother:
      display_name: 吉姆与母亲
      tts:
        delivery: 惊慌急切，两人同时开口求助
        timbre: 一少一长的自然合声
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 严霜清晨的陌生人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 后来，我们终于摆脱了船长，可他的麻烦并没有就此放过我们。引出这一切的第一件怪事，就发生在不久之后。那年冬天冷得厉害，严霜长久不化，狂风一阵接着一阵。大家一开始就看出来，我可怜的父亲恐怕撑不到春天。他一天比一天衰弱，母亲和我只得把客店里里外外的活全担起来。我们从早忙到晚，已经顾不上那个难缠的房客了。
        - id: ch01-b02
          speaker: narrator
          text: 一月里一个天刚亮的早晨，寒气针扎似的刺人，地面冻得发白。海湾罩着一层灰霜，细浪轻轻舔着石滩。太阳还很低，只碰得到山顶，光芒从那里一直铺向远海。船长比平常起得更早，已经出了门。他沿沙滩大步走去，弯刀在旧蓝外套宽大的下摆下面来回晃动，胳膊夹着黄铜望远镜，帽子歪向脑后。呼出的白气像烟一样拖在身后。他转过大岩石时，我听见他最后重重哼了一声，仿佛心里还在恼恨利弗西医生。
        - id: ch01-b03
          speaker: narrator
          text: 母亲在楼上陪父亲，我在楼下摆早餐，等船长回来。客厅门忽然开了，走进一个我从未见过的男人。他脸色苍白蜡黄，左手少了两根手指，腰间虽有弯刀，却不像个善于打斗的人。我向来留心水手，不管对方有一条腿还是两条腿。这个人却叫我犯了难。他没有水手的样子，身上又偏偏带着海上的气息。我问他需要什么，他说要一杯朗姆酒。可我刚转身要去拿，他却坐到一张桌子上，招手叫我过去。我手里还拿着摆餐桌用的餐巾，只好停在原地。
        - id: ch01-b04
          speaker: black_dog
          text: 过来呀，小子。再靠近一点儿。
        - id: ch01-b05
          speaker: narrator
          text: 我只向前走了一步。
        - id: ch01-b06
          speaker: black_dog
          text: 这桌早餐，是给我那位比尔老伙计准备的吧？
        - id: ch01-b07
          speaker: narrator
          text: 他笑得不怀好意。我说自己不认识什么比尔，这桌饭是给住店的船长摆的。
        - id: ch01-b08
          speaker: black_dog
          text: 那就对了。我那位比尔，多半也让人叫船长。他脸上有道刀疤，喝过酒以后，脾气尤其招人喜欢。让我猜猜，你们船长的右脸上正好有道疤，是不是？啊哈，我就知道。我的老伙计比尔在这里吗？
        - id: ch01-b09
          speaker: narrator
          text: 我说船长出去散步了。
        - id: ch01-b10
          speaker: black_dog
          text: 往哪边去了，小子？他从哪边回来？
        - id: ch01-b11
          speaker: narrator
          text: 我把岩石指给他看，又说了船长回来的方向和时间。他接着盘问了几句，我也都回答了。
        - id: ch01-b12
          speaker: black_dog
          text: 好极了。我的老伙计比尔见到我，准比喝了酒还痛快。
        - id: ch01-b13
          speaker: narrator
          text: 他说这话时，脸色一点儿也不友善。就算他真心认为比尔会高兴，我也有自己的理由觉得他肯定想错了。可这件事轮不到我管，我也实在想不出该怎么办。他守在店门里面，不住地向转角探头，像只等着耗子的猫。有一次，我自己走到路上，他立刻叫我回去。我没有马上听从，那张蜡黄的脸顿时变得狰狞。他咒骂着命令我进门，吓得我猛地一跳。我刚回来，他又换回半讨好、半嘲弄的样子，拍着我的肩，说我是个好孩子，他已经喜欢上我了。
        - id: ch01-b14
          speaker: black_dog
          text: 我自己也有个儿子，跟你就像两块木头似的一个样，是我心里最大的骄傲。可男孩子最要紧的是守规矩，小子，守规矩。要是你跟比尔出过海，就不会站在那里，非让人叫第二遍才动。比尔从来不许别人这样，跟他出海的人也没有这种规矩。瞧，他真的回来了，胳膊下还夹着望远镜呢。来吧，小子，咱们躲到客厅门后，给比尔一个小惊喜。我再说一遍，愿老天保佑他的心肝。
        - id: ch01-b15
          speaker: narrator
          text: 他一面说，一面带着我倒退进客厅，再把我安置在他身后的墙角。敞开的门正好遮住我们两个人。你们可以想见，我心里又紧张又害怕。可后来我发现，这个陌生人自己显然也在发怵，心里反而更不安。他先让弯刀的柄露出来，又把刀刃从鞘里松了松。等待时，他一刻不停地吞咽，好像喉咙里堵着一个硬疙瘩。
    - id: ch02
      title: 老船友相见
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 船长终于大步进来。他关门时砰的一声，根本没有看向两边，径直走到早餐桌旁。
        - id: ch02-b02
          speaker: black_dog
          text: 比尔。
        - id: ch02-b03
          speaker: narrator
          text: 陌生人有意把这一声装得又粗又响。船长脚跟一转，猛地面对我们。他脸上的棕色全褪了，连鼻子也变得发青。他像是见到了鬼，见到了恶魔，甚至比恶魔更可怕的东西——假如还有什么比恶魔更可怕的话。一眨眼，他就显得那样苍老，那样病弱。说真的，连我看了都觉得可怜。
        - id: ch02-b04
          speaker: black_dog
          text: 别这样，比尔。你当然认识我，怎么会忘了自己的老船友？
        - id: ch02-b05
          speaker: narrator
          text: 船长倒吸了一口气。
        - id: ch02-b06
          speaker: captain
          text: 黑狗！
          emotion: fearful
        - id: ch02-b07
          speaker: black_dog
          text: 除了我还能是谁？黑狗还是那个黑狗，来本博将军客店看看老船友比利。比尔啊，自从我少了这两根爪子，咱们俩也一起见过不少世面了。
        - id: ch02-b08
          speaker: narrator
          text: 他说着，举起那只残缺的手。
        - id: ch02-b09
          speaker: captain
          text: 听好。你已经找到我了，我人也在这里。有话就直说，你究竟想干什么？
        - id: ch02-b10
          speaker: black_dog
          text: 这才是比尔说话的样子。好比利，你说得对。先让这个讨人喜欢的小家伙给我拿杯朗姆酒。然后咱们坐下来，像两个老船友一样，把话讲个明白。
        - id: ch02-b11
          speaker: narrator
          text: 我拿着朗姆酒回来时，他们已经分坐在船长的早餐桌两边。黑狗挑了靠门的位置，又把身子侧向一旁。依我看，他这样既能用一只眼睛盯住老船友，也能用另一只眼睛看住自己的退路。
        - id: ch02-b12
          speaker: black_dog
          text: 你出去，把门开着。小子，我可不想让你从钥匙孔里偷听。
        - id: ch02-b13
          speaker: narrator
          text: 我照他说的出去，把他们留在客厅，自己退到酒吧间。我费尽力气偷听了很久，却只听见一阵压得很低的咕哝。后来，两人的嗓门渐渐高了，我终于能断断续续听清几个字，几乎全是船长嘴里的咒骂。
        - id: ch02-b14
          speaker: captain
          text: 不行，不行，不行！这件事就说到这里！要是真得有人上绞架，那就一个也别落下！
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 突然间，咒骂声和各种响动一起炸开。椅子和桌子哗啦一声翻倒，钢刀紧跟着撞出脆响，随后又是一声痛叫。下一刻，黑狗拔着弯刀没命地逃出客厅，船长也挥刀紧追。黑狗左肩的鲜血一路流下来。到了门口，船长又对准逃跑的人，用尽力气劈出最后一刀。要不是本博将军的大招牌正好挡住刀锋，黑狗一定会从脊背给劈开。那道刀痕直到今天还留在招牌框的下沿。
        - id: ch02-b16
          speaker: narrator
          text: 这一刀也结束了打斗。黑狗虽然受了伤，逃起来却快得出奇，眨眼就把船长甩在后面，不到半分钟便越过山坡边缘，不见了。船长没有再追，只留在原地，茫然地盯着那块招牌。他用手在眼前抹了好几次，过了片刻，才终于转身回到屋里。
        - id: ch02-b17
          speaker: captain
          text: 吉姆，给我朗姆酒。
        - id: ch02-b18
          speaker: narrator
          text: 他说着踉跄了一下，赶紧伸手撑住墙壁。
        - id: ch02-b19
          speaker: narrator
          text: 我问他是不是受伤了。
        - id: ch02-b20
          speaker: captain
          text: 朗姆酒。我得赶紧离开这里。快给我朗姆酒！
    - id: ch03
      title: 船长倒下
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我跑去取酒，可刚才发生的一切害得我心神不定。我打碎一只杯子，又弄脏酒桶龙头，越着急越碍自己的事。酒还没有取好，客厅里忽然传来一声巨响。我冲进去，只见船长直挺挺倒在地上。就在这时，母亲也被喊叫和打斗声惊动，从楼上跑下来帮我。我们一起托起船长的头。他呼吸又粗又重，双眼紧闭，脸色吓人极了。
        - id: ch03-b02
          speaker: mother
          text: 天哪，家里闹出这种事，真是太丢脸了！你可怜的父亲还病着呢！
        - id: ch03-b03
          speaker: narrator
          text: 我们根本不知道怎么救他，满心只以为他在同陌生人的打斗中受了致命伤。我当然把朗姆酒拿来了，也试着往他喉咙里灌，可他的牙齿咬得死紧，两边下巴硬得像铁。我们正束手无策，门忽然开了。利弗西医生正好来探望父亲，对我们来说真是天大的解脱。
        - id: ch03-b04
          speaker: jim_and_mother
          text: 医生，快救救他！他到底伤在哪儿了？
        - id: ch03-b05
          speaker: doctor_livesey
          text: 受伤？胡说八道。他身上没有伤，跟你我一样好好的。这人是中了风，我早就警告过他。霍金斯太太，请你马上上楼照顾丈夫。能瞒住的话，就别让他知道这里出了什么事。至于我，只好尽力救一救这个家伙那条加倍不值钱的命。吉姆，拿一只盆给我。
        - id: ch03-b06
          speaker: narrator
          text: 我端盆回来时，医生已经割开船长的袖子，露出一条粗壮而筋络凸起的胳膊。那条胳膊上刺着好几处图案。小臂上有“好运常在”“一路顺风”，还有“比利·博恩斯的心上人”，字样都刺得整齐又清楚。靠近肩膀的地方还画着一座绞架，上面吊着一个人。依我看，那幅画倒是很有气势。
        - id: ch03-b07
          speaker: doctor_livesey
          text: 这幅画倒有先见之明。好了，比利·博恩斯少爷，假如这真是你的名字，就让我看看你的血是什么颜色。吉姆，你怕血吗？
        - id: ch03-b08
          speaker: narrator
          text: 我说自己不怕。
        - id: ch03-b09
          speaker: doctor_livesey
          text: 那你端稳盆。
        - id: ch03-b10
          speaker: narrator
          text: 医生随即取出柳叶刀，割开一条静脉。流掉许多血以后，船长终于睁开眼睛，目光迷蒙地望向四周。他先认出了医生，立刻明明白白地皱起眉头。接着，他的视线落到我身上，神情才松下来。可忽然间，他的脸色又变了，挣扎着想要撑起身子。
        - id: ch03-b11
          speaker: captain
          text: 黑狗在哪儿？
          emotion: fearful
        - id: ch03-b12
          speaker: doctor_livesey
          text: 这里没有黑狗，除非你自己背上背着一只。你朗姆酒喝得太多，所以中了风，跟我警告过你的一模一样。我刚才很不情愿地抓住你的脑袋，把你从坟墓里拖了回来。现在，博恩斯先生，你听我说。
        - id: ch03-b13
          speaker: captain
          text: 那不是我的名字。
        - id: ch03-b14
          speaker: doctor_livesey
          text: 我不在乎。我认识一个海盗，就叫这个名字，为了省事，我也这么叫你。我要告诉你，一杯朗姆酒不会立刻要你的命，可喝过一杯，你就会再喝一杯，然后还有一杯。我拿自己的假发打赌，你要是不马上彻底戒掉，就一定会死。听清楚，是死。你会像《圣经》里的那个人一样，到自己该去的地方。现在使点劲，我这一次扶你上床。
        - id: ch03-b15
          speaker: narrator
          text: 我们两个人费了很大力气，才把他从楼下架上去，再放到自己的床上。他的头向后一仰，重重倒在枕头上，仿佛又快要昏过去了。
        - id: ch03-b16
          speaker: doctor_livesey
          text: 给我牢牢记住。我该说的都说了，也算尽到了责任。对你来说，只要听见朗姆酒这几个字，就等于听见死亡。
        - id: ch03-b17
          speaker: narrator
          text: 说完这些，医生便拉着我的胳膊离开船长的房间，去给父亲看病。房门刚在我们身后关上，他便告诉我，船长的情况并不严重。
        - id: ch03-b18
          speaker: doctor_livesey
          text: 这没什么。我放掉了足够多的血，他会安静一阵子。最好让他在床上躺一个星期，对他和你们都有好处。但他要是再中一次风，就活不成了。
