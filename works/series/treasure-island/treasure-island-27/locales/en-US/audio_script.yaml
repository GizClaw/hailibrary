audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: commanding, quick-witted, and rough-edged
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    dick:
      display_name: Dick
      tts:
        delivery: wary and obedient
        timbre: lean and youthful
        pace: steady
        pitch: medium
    captain_flint:
      display_name: Captain Flint
      tts:
        delivery: sharp, repetitive, and piercing
        timbre: shrill and birdlike
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: "Pinned Above the Bay"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The schooner lay tilted so far over that her masts reached out above the water. From my seat on the cross-trees, I looked straight down at the bay. Hands had not climbed as high as I had, so he fell between me and the ship. Once he came up through a froth of blood and foam. Then he sank for good.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When the water cleared, I saw him curled on the clean, bright sand beneath the shadow of the hull. A fish or two darted past him. The trembling water sometimes made him seem to stir, as though he might rise again. But he was dead, shot and drowned. The fish would feed on him in the very place where he had meant to murder me.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once I knew that, sickness and terror swept over me. Hot blood ran down my back and chest. The dagger that pinned my shoulder to the mast burned like hot iron. Yet the pain was not what frightened me most. I could endure that without crying out. What I could not bear was the thought of falling into the still green water beside the coxswain's body.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I gripped the mast until my fingernails hurt and squeezed my eyes shut against the danger. Little by little, my thoughts returned. My heartbeat slowed, and I became master of myself again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At first I tried to pull out the dagger. Either it held too tightly or my courage failed, because I stopped with a violent shiver. Strangely, that shiver freed me. The blade had almost missed altogether and caught only a pinch of skin. My movement tore the skin loose. Blood flowed faster, but now only my coat and shirt held me to the mast.
        - id: ch01-b06
          speaker: narrator
          text: >-
            One sharp jerk ripped the cloth, and I climbed down by the starboard shrouds. Shaken as I was, nothing could have made me use the overhanging port side where Israel had just fallen.
    - id: ch02
      title: "Alone on the Hispaniola"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Below deck, I did what I could for my shoulder. It hurt badly and bled freely, but the cut was neither deep nor dangerous. Moving my arm did not trouble it much. Then I looked around. The ship belonged to me now, in a way, and I decided to remove her last passenger. That was dead O'Brien.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He had fallen against the bulwark and still lay there, like a horrible life-sized puppet with none of the color or grace of life. After so many grim adventures, I had lost most of my fear of the dead. I caught him around the waist as if he were a sack of bran, gave one strong heave, and tipped him overboard.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He struck the water with a heavy splash. His red cap floated free. When the ripples settled, I could see O'Brien and Israel lying side by side and wavering with the movement of the water. O'Brien was young but nearly bald, and his bare head rested across the knees of the man who had killed him. Quick little fish steered back and forth above them both.
        - id: ch02-b04
          speaker: narrator
          text: >-
            I was alone aboard the schooner. The tide had just turned, and the sun was close to setting. Shadows from the pines on the western shore already stretched across the anchorage and patterned the deck. An evening breeze had risen. The eastern hill with two peaks sheltered us from most of it, but the ropes began to hum softly and the loose sails rattled.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Then I saw that the ship was in danger. I quickly lowered the jibs and let them tumble onto the deck. The mainsail was harder. When the schooner tipped, the boom swung over the side, leaving its end and part of the sail underwater. That seemed dangerous, but the ropes were under such strain that I was afraid to touch them.
        - id: ch02-b06
          speaker: narrator
          text: >-
            At last I took my knife and cut the halyards. The peak dropped at once, and a great belly of loose canvas spread over the water. No matter how hard I pulled, I could not move the downhaul. That was all I could do. From there, the Hispaniola would have to trust to luck, just as I had.
        - id: ch02-b07
          speaker: narrator
          text: >-
            By then, shadow covered the whole anchorage. The final rays of sunlight came through a gap in the woods and shone like jewels on the flowers growing over the wreck. The air turned cold. As the tide rushed out to sea, the schooner leaned farther onto her side.
        - id: ch02-b08
          speaker: narrator
          text: >-
            I scrambled to the bow and peered down. The water looked shallow. Holding the cut hawser with both hands for safety, I lowered myself over the side. The water barely reached my waist, and the rippled sand felt firm beneath my feet. I waded ashore in high spirits, leaving the Hispaniola on her side with the mainsail spread across the bay. The sun disappeared at about that same moment, and the breeze whispered through the tossing pines in the dusk.
    - id: ch03
      title: "Homeward Through the Woods"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last, I was off the sea, and I had not come back empty-handed. The schooner lay free of buccaneers and ready for our men to board and sail away. All I wanted was to return to the stockade and boast about what I had done. They might scold me for running off, but recovering the Hispaniola was answer enough. I hoped even Captain Smollett would admit that I had used my time well.
        - id: ch03-b02
          speaker: narrator
          text: >-
            With those thoughts lifting my spirits, I started for the blockhouse and my companions. I remembered that the easternmost stream flowing into Captain Kidd's anchorage came down from the two-peaked hill on my left. I headed that way so I could cross while the water was still shallow. The woods were fairly open. By following the lower slopes, I soon rounded the hill and waded through the stream, which rose only halfway up my calves.
        - id: ch03-b03
          speaker: narrator
          text: >-
            That brought me near the place where I had met Ben Gunn, so I walked more carefully and watched every side. Dusk was nearly complete when I came in sight of the gap between the twin peaks. A wavering glow showed against the sky. I guessed that Ben, the man of the island, had built a roaring fire to cook his supper. Still, I wondered why he would be so careless. If I could see that light, might Silver see it too from his camp by the marshes?
        - id: ch03-b04
          speaker: narrator
          text: >-
            Night grew steadily blacker. I could barely keep to my general direction. Behind me, the two-peaked hill faded from sight, and Spy-glass Hill on my right grew dimmer too. Only a few pale stars showed above me. Down on the low ground, I kept stumbling into bushes and rolling into sandy hollows.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Then a faint light suddenly fell around me. I looked up and saw pale moonbeams touching the top of Spy-glass Hill. Soon something broad and silver moved low behind the trees. The moon had risen.
        - id: ch03-b06
          speaker: narrator
          text: >-
            With the moon to guide me, I crossed the remaining ground quickly, sometimes walking and sometimes running. I could hardly wait to reach the stockade. But when I entered the grove in front of it, I slowed down and moved with care. After all my adventures, it would have been a miserable end to be shot by my own friends by mistake.
    - id: ch04
      title: "The Silent Stockade"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The moon climbed higher, dropping pools of light through the open parts of the woods. Straight ahead, another glow appeared among the trees. This one was red and hot. Every so often it darkened slightly, like the dying embers of a bonfire.
        - id: ch04-b02
          speaker: narrator
          text: >-
            I could not imagine what it was.
        - id: ch04-b03
          speaker: narrator
          text: >-
            At last I reached the edge of the clearing. Moonlight flooded its western end, while the rest of it, including the blockhouse, remained in black shadow crossed by long silver streaks. On the far side of the house, an enormous fire had burned down to bright embers. Its steady red glow stood out against the soft, pale moonlight. No one moved. I heard nothing but the breeze.
        - id: ch04-b04
          speaker: narrator
          text: >-
            I stopped, puzzled and a little afraid. We did not build fires that large. Captain Smollett had ordered us to use our firewood sparingly. I began to fear that something had gone wrong while I was away.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Staying close to the shadows, I crept around the eastern end. Where the darkness was deepest, I climbed over the palisade. To be even safer, I dropped to my hands and knees and crawled silently toward the corner of the house.
        - id: ch04-b06
          speaker: narrator
          text: >-
            As I drew near, my heart suddenly felt much lighter. Normally, it is not a pleasant sound, and I had often complained about it. But just then, hearing my friends snore loudly and peacefully together was like hearing music. No sailor's cry of “All's well” could have comforted me more.
        - id: ch04-b07
          speaker: narrator
          text: >-
            One thing was certain, though. They were keeping a disgracefully poor watch. If Silver and his men had been creeping in instead of me, none of my friends would have lived to see the morning. This was what came of having the captain wounded. Once again, I blamed myself bitterly for leaving them in danger when so few men remained to stand guard.
        - id: ch04-b08
          speaker: narrator
          text: >-
            By then I had reached the door, and I stood up. The inside was too dark for me to see anything. I could hear the steady drone of snoring, along with a faint noise now and then. It sounded like something flicking or pecking, though I could not explain it.
        - id: ch04-b09
          speaker: narrator
          text: >-
            I held out my arms and walked slowly inside. I would lie down in my usual place, I thought, laughing silently to myself. What faces they would make when they found me there in the morning.
        - id: ch04-b10
          speaker: narrator
          text: >-
            My foot struck something soft. It was a sleeping man's leg. He shifted and groaned but did not wake.
    - id: ch05
      title: "Pieces of Eight"
      blocks:
        - id: ch05-b01
          speaker: captain_flint
          text: >-
            Pieces of eight! Pieces of eight! Pieces of eight! Pieces of eight! Pieces of eight!
        - id: ch05-b02
          speaker: narrator
          text: >-
            The shrill cry burst from the darkness and went on without a pause or change, like a tiny mill clacking away. It was Silver's green parrot, Captain Flint. That was the creature I had heard pecking at a piece of bark. She had kept better watch than any human and was announcing my arrival with her tiresome refrain.
        - id: ch05-b03
          speaker: narrator
          text: >-
            I had no time to recover. At the parrot's sharp voice, the sleepers woke and jumped to their feet. Then Silver shouted a mighty oath.
        - id: ch05-b04
          speaker: long_john_silver
          text: "Who's there?"
        - id: ch05-b05
          speaker: narrator
          text: >-
            I spun around to run. I crashed hard into one man, bounced away, and ran straight into the arms of another. He closed his grip around me and held me fast.
        - id: ch05-b06
          speaker: long_john_silver
          text: "Dick, fetch a torch."
        - id: ch05-b07
          speaker: narrator
          text: >-
            Once Silver knew I was caught, one of the men left the blockhouse. A moment later, Dick returned carrying a burning piece of wood.
