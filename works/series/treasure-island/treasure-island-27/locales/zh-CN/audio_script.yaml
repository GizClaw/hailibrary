audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    parrot_flint:
      display_name: 鹦鹉弗林特船长
      tts:
        delivery: 尖利急促，机械地重复听来的水手喊话
        timbre: 尖亮刺耳
        pace: 急促
        pitch: 高
  chapters:
    - id: ch01
      title: 水下的汉兹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 船歪向一边，桅杆便远远伸到了海湾上方。我坐在桅楼横木上，脚底下只有水。汉兹的位置低一些，他从我和舷墙之间掉了下去。血和泡沫裹着他浮上来一次，随后一沉到底，再也没有出现。
        - id: ch01-b02
          speaker: narrator
          text: 水面慢慢平静。我看见汉兹蜷在船影下面，洁净的沙底亮得清清楚楚。一两条鱼从尸体旁飞掠过去。水波一颤，他仿佛也会稍稍动一下，像是还想爬起来。可他中了枪，又溺了水，早已死透。他本想在这里杀我，如今自己倒要喂鱼了。
        - id: ch01-b03
          speaker: narrator
          text: 确信他死了以后，我忽然又恶心，又眩晕，心里怕得厉害。热血从背后流到胸前，钉住肩膀的短剑更像一块烧红的铁。可这些疼痛，我觉得自己还能咬紧牙关，一声不出地忍住。真正吓坏我的，是怕自己从高处摔进那片安静的绿水，正好落在舵手尸体旁边。
        - id: ch01-b04
          speaker: narrator
          text: 我死死抓住横木，直到指甲发疼，还闭上眼，不去看脚下的危险。过了一阵，心跳才慢下来，脑子也重新清醒了。
        - id: ch01-b05
          speaker: narrator
          text: 我先想把短剑拔出来。可它不是扎得太紧，就是我自己没了胆量。刚动一下，我便猛地打了个寒战，不敢再碰。偏偏这一哆嗦救了我。刀刃原来几乎从我身边擦过，只钉住薄薄一小片皮肉。身体一颤，那片皮便撕开了。血流得更快，可我已经能自由活动，只剩外衣和衬衫还挂在桅杆上。
        - id: ch01-b06
          speaker: narrator
          text: 我用力一挣，扯破衣服，再从右舷支索爬回甲板。无论如何，我都不肯再碰左舷那几根垂在水上的支索。伊斯莱尔才刚从那里摔下去。
        - id: ch01-b07
          speaker: narrator
          text: 到了舱里，我尽量把伤口包扎好。肩膀仍旧很疼，血也流得不少，不过伤势不深，没有危险，手臂动起来也不太碍事。随后我环顾四周。这条船现在也算是我的了，而船上还剩最后一名乘客，就是死去的奥布赖恩。
        - id: ch01-b08
          speaker: narrator
          text: 前面说过，他倒在舷墙边，活像一个真人大小、却又丑陋吓人的木偶。大小虽和活人相同，脸上却没有半点活人的颜色和神采。他这个姿势正好方便我动手。我经历了这么多惨事，对尸体已经不大害怕，于是抓住他的腰，像提一袋麦麸一样使劲一掀，把他翻进海里。
        - id: ch01-b09
          speaker: narrator
          text: 扑通一声，奥布赖恩沉了下去，红帽子从头上脱落，独自在水面漂着。等飞溅的水花散去，我看见他和伊斯莱尔并排躺在水底，随着颤动的水光一同晃动。奥布赖恩还很年轻，头顶却已经秃得厉害。此刻，那颗秃头正横在杀死他的人的膝上，灵巧的小鱼从两具尸体上方来来回回地游过。
    - id: ch02
      title: 独自离船
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 船上终于只剩我一个，潮水也刚刚转向。太阳就要落山，西岸松树的影子已经越过锚地，在甲板上铺开。晚风虽然被东边的双峰山挡住大半，帆索仍低声哼唱起来，松垂的船帆也拍个不停。
        - id: ch02-b02
          speaker: narrator
          text: 我看出船有危险，赶紧降下船头的三角帆，让它们全落在甲板上。主帆却难得多。船一倾斜，帆桁自然甩到舷外，末端和一两英尺长的帆布都泡在水里。我觉得这样会让船更加危险，可绳索承受的力道太重，一时又不敢去动。
        - id: ch02-b03
          speaker: narrator
          text: 最后，我拿刀割断升帆索。帆桁顶端猛地落下，一大片松垮的帆布鼓在水面。我怎么拉也拉不动降帆索，只能就此罢手。剩下的事，西斯帕尼奥拉号只好和我一样，全凭运气了。
        - id: ch02-b04
          speaker: narrator
          text: 这时，整片锚地已经沉进阴影。最后几缕阳光穿过林间空隙，照在破船开满鲜花的外衣上，亮得像宝石。天渐渐凉了，潮水正飞快退向大海。随着水位降低，帆船也越来越朝一边倒下去，几乎要完全侧卧在水中了。
        - id: ch02-b05
          speaker: narrator
          text: 我爬到船头往下一看，水并不深。为了最后再添一层保障，我双手紧抓断掉的缆绳，轻轻滑下船。海水刚到腰间，脚下的沙地又硬又平，上面全是水波留下的纹路。我高高兴兴趟上岸，把侧卧的西斯帕尼奥拉号留在身后，任它的主帆宽宽拖在海湾里。这时太阳完全落下，晚风在暮色中的松林里低声呼啸。
        - id: ch02-b06
          speaker: narrator
          text: 我总算离开大海，而且不是空手回来。帆船就躺在那里，海盗已经全被清除，只等我们的人登上去，再度出海。我眼下最想做的，就是马上回寨子夸耀这一番功劳。擅自离开也许要挨上几句责备，可我夺回了西斯帕尼奥拉号，这便足以回答他们。就连斯莫利特船长，也该承认我没有白白浪费时间。
    - id: ch03
      title: 月下归途
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我得意极了，立刻朝木屋和伙伴们走去。我记得，流入基德船长锚地的几条小河当中，最东边那条发源于左边的双峰山。只要往那里走，就能趁溪水还浅，从上游渡过去。林子很疏，我沿着低矮的山脚绕过山角。没过多久，便趟过了那道只到小腿肚的溪流。
        - id: ch03-b02
          speaker: narrator
          text: 这里离我遇见那个荒岛弃人本·冈恩的地方不远。我放慢脚步，留意着四周。暮色几乎全合上了。双峰之间的豁口上方，却映着一片忽明忽暗的光。我猜是本·冈恩在熊熊火堆前做晚饭，可他怎么会这么不小心？连我都看得见这片亮光，驻扎在沼泽岸边的西尔弗难道会看不见吗？
        - id: ch03-b03
          speaker: narrator
          text: 夜越来越黑，我连大致方向都快分不清了。身后的双峰山越来越模糊，右边的望远镜山也渐渐淡去。天上的星星又少又暗。我在低地摸索前进，一次次被灌木绊住，还会失脚滚进沙坑。
        - id: ch03-b04
          speaker: narrator
          text: 忽然，四周亮了一些。我抬起头，看见苍白的月光刚刚落到望远镜山顶。紧接着，树林后面有一大片银光低低移动。月亮升起来了。
        - id: ch03-b05
          speaker: narrator
          text: 借着月光，我时而走，时而跑，很快便接近寨子。可一钻进寨子前面的树林，我还是放慢脚步，小心前进。经历了这么多冒险，要是最后被自己人误认成敌人，一枪打死，那可太不值了。
        - id: ch03-b06
          speaker: narrator
          text: 月亮越爬越高，大片清辉透过稀疏的树木洒下来。正前方却另有一团红热的光，藏在树影之间，还不时暗下去一点，像一堆篝火烧剩的余烬。
        - id: ch03-b07
          speaker: narrator
          text: 我无论如何也想不出，那会是什么。
        - id: ch03-b08
          speaker: narrator
          text: 到了空地边缘，我看见西头已经全是月色，木屋和其余地方仍埋在黑影里，只有一道道长长的银光交错其间。屋后那堆大火早已烧成透亮的红炭，稳定地映出一片红光，和柔和苍白的月光形成强烈对照。周围一个人影也没有，除了风吹过的声音，什么都听不见。
        - id: ch03-b09
          speaker: narrator
          text: 我停下来，心里又惊讶，又有一点害怕。我们从不会生这么大的火。船长叫大家节省柴火，我们也一直照办。难道我离开的这段时间，寨子里出了什么事？
    - id: ch04
      title: 黑暗中的守夜者
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我始终紧贴着阴影，悄悄绕到木屋东边，又挑了夜色最浓、最不容易被发现的地方翻过栅栏。为了更加稳妥，我伏下身子，手脚着地，一点声音也不发出，慢慢爬向屋角。
        - id: ch04-b02
          speaker: narrator
          text: 越靠近木屋，我的心越轻松。平时我总嫌鼾声难听，可这一刻，朋友们一起安稳熟睡，鼾声又响又齐，听在耳中简直像音乐。守夜水手那句动听的海上号子“一切平安”，也从没让我这样安心过。
        - id: ch04-b03
          speaker: narrator
          text: 不过，有件事再清楚不过，他们这岗放得实在太糟。此刻要是摸进来的是西尔弗和他的手下，根本不会有人发现，屋里谁也见不到明天的太阳。我想，这就是船长负伤的后果。我又狠狠责怪自己，明知留下的人这样少，连站岗都不够，竟还把大家丢在危险里。
        - id: ch04-b04
          speaker: narrator
          text: 这时，我已经来到门前，便站起身来。屋里一片漆黑，眼睛根本分辨不出任何东西。耳边只有熟睡的人平稳而绵长的鼾声，偶尔还传来一点细碎的响动，像什么东西在轻轻扑翅，又像在啄食。我怎么也猜不到那是什么。
        - id: ch04-b05
          speaker: narrator
          text: 我伸着两臂，慢慢往里走，打算回自己的老地方躺下。我还在心里偷笑，等大家明早发现我，不知会露出什么表情。忽然，我的脚碰上一个软东西。原来是熟睡之人的腿。那人翻了个身，哼了一声，却没有醒。
        - id: ch04-b06
          speaker: narrator
          text: 就在这时，黑暗里猛然响起一个尖厉的声音。
        - id: ch04-b07
          speaker: parrot_flint
          text: 八里亚尔！八里亚尔！八里亚尔！八里亚尔！八里亚尔！
        - id: ch04-b08
          speaker: narrator
          text: 它一刻不停地重复，声音和语调一点也不变，像架小磨坊咔嗒咔嗒转个没完。那是西尔弗的绿鹦鹉，弗林特船长！刚才发出细响的，正是它在啄一块树皮。人类守夜人全都睡着了，反倒是这只鸟看守得最好。也是它先发现我，用那句烦人的老话大声报信。
        - id: ch04-b09
          speaker: narrator
          text: 我还来不及回神，鹦鹉尖脆的叫声已经惊醒众人。屋里的人纷纷跳了起来，西尔弗也爆出一声恶狠狠的咒骂。
        - id: ch04-b10
          speaker: long_john_silver
          text: 谁在那里？
        - id: ch04-b11
          speaker: narrator
          text: 我转身就跑，却猛撞上一个人。我往后一退，又正好落进另一个人的怀里。他立刻收紧双臂，把我死死制住。
        - id: ch04-b12
          speaker: long_john_silver
          text: 迪克，拿个火把来。
        - id: ch04-b13
          speaker: narrator
          text: 一个海盗走出木屋，很快便举着一根燃烧的木柴回来了。
