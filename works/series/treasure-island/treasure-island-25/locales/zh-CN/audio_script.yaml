audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    israel_hands:
      display_name: 伊斯莱尔·汉兹
      tts:
        delivery: 粗鲁虚弱，话里藏着老水手的狡猾与算计
        timbre: 沙哑低沉的老年男声
        pace: 缓慢吃力，恢复体力后稍显有力
        pitch: 低
  chapters:
    - id: ch01
      title: 失控的帆船
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我刚在艏斜桅上站稳，飞艏帆就啪地鼓向另一边，响得像开了一炮。西斯帕尼奥拉号从甲板一直颤到龙骨。转眼间，其他帆还在受风，飞艏帆却又拍回来，软软垂下。
        - id: ch01-b02
          speaker: narrator
          text: 我险些被甩进海里，赶紧顺着艏斜桅爬回去，一头跌上甲板。我落在艏楼的下风处，仍旧鼓着的主帆挡住了后甲板。我没看见半个人。自从海盗叛乱以后，甲板再也没擦过，到处都是脚印。排水沟里还有只断了瓶颈的空酒瓶，正跟着船身来回滚动，像个活东西。
        - id: ch01-b03
          speaker: narrator
          text: 大船猛然迎头转进风里。身后的艏帆爆响起来，舵柄砰地撞向一边。船身狠狠一颠，叫人胃里翻腾，紧接着又浑身发抖。主帆桁同时扫回船内，帆索在滑车中吱呀作响，被遮住的后甲板终于露了出来。
        - id: ch01-b04
          speaker: narrator
          text: 那两个看守果然都在。红帽子仰面躺着，僵得像根绞盘棒。两条手臂横伸出去，仿佛被钉在十字架上，嘴里还露着牙。伊斯莱尔·汉兹倚着舷墙，下巴垂在胸前，两手摊在甲板上。他的脸原本晒得黝黑，这时却白得像牛脂蜡烛。
        - id: ch01-b05
          speaker: narrator
          text: 帆船像匹凶马，一会儿尥蹶子，一会儿横着乱挪。船帆忽而在这边吃风，忽而又鼓向另一边。主帆桁不停扫来扫去，连桅杆都被压得呻吟。水雾不时越过舷墙，船头一下下重撞涌浪。我那条歪斜的小圆舟已经沉了，可同它相比，这艘高桅大船在同样的海面上闹出的动静，不知要大多少。
        - id: ch01-b06
          speaker: narrator
          text: 船每颠一下，红帽子的尸体就来回滑一次。最吓人的是，任凭怎么摔，他那横伸双臂的姿势不变，露齿的僵笑也不变。汉兹同样随着船身滑动，却像不断往自己身体里缩，越陷越低。双脚伸得越来越远，整个人慢慢歪向船尾。他的脸一点点被遮住，最后我只看见一只耳朵，还有一绺磨散的络腮胡。
        - id: ch01-b07
          speaker: narrator
          text: 两人周围的木板上溅着一摊摊暗红的血。我看着那些血迹，心里渐渐明白，他们多半在醉怒中互相残杀了。
        - id: ch01-b08
          speaker: narrator
          text: 正猜想着，船忽然平稳了一刻。汉兹侧过身，低低呻吟着，吃力地挪回原来的姿势。那声音又痛苦又虚弱，下巴还无力地张着，听得我心里一紧。可我想起在苹果桶里偷听到的阴谋，那点同情立刻没了。
    - id: ch02
      title: 船舱里的白兰地
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我走到船尾，在主桅旁停下，故意挖苦他。
        - id: ch02-b02
          speaker: narrator
          text: 汉兹先生，欢迎登船。
        - id: ch02-b03
          speaker: narrator
          text: 他费力地转动眼珠，虚弱得连惊讶都露不出来，只挤出了一个词。
        - id: ch02-b04
          speaker: israel_hands
          text: 给我白兰地。
        - id: ch02-b05
          speaker: narrator
          text: 时间不能再耽搁。主帆桁又横扫过来，我躲开它，溜到船尾，顺着楼梯下进船舱。
        - id: ch02-b06
          speaker: narrator
          text: 里面乱得没法形容。所有上锁的地方都被撬开了，海盗们显然搜过海图。他们从营地周围的沼泽趟水回来，就坐在舱里喝酒、商量，地板上留下厚厚的泥。雪白镶金的舱壁印满脏手印。几十只空酒瓶挤在角落，随着船摇晃，叮叮当当碰个不停。
        - id: ch02-b07
          speaker: narrator
          text: 医生的一本医书还摊在桌上，差不多一半书页都让人撕掉了，我猜是用来点烟斗。那盏灯竟在一片狼藉中亮着，烟雾蒙住昏暗的火光，整间舱里都是浑浊的赭褐色。
        - id: ch02-b08
          speaker: narrator
          text: 我又进了储藏室。酒桶已经搬空，数不清的酒瓶也全被喝光，随手扔得到处都是。叛乱开始以后，这群人恐怕就没有谁真正清醒过。
        - id: ch02-b09
          speaker: narrator
          text: 我在储藏室里四处翻找，终于找出一瓶还剩些白兰地的酒，又为自己寻到饼干、腌水果、一大串葡萄干和一块奶酪。回到甲板后，我先把食物藏在舵头后面，远远放在汉兹够不到的地方。接着，我走到船头的淡水桶旁，痛痛快快喝了个够。直到自己喝完，我才把酒递给他。
        - id: ch02-b10
          speaker: narrator
          text: 汉兹一口气灌下足足四分之一品脱，这才把瓶子从嘴边移开。
        - id: ch02-b11
          speaker: israel_hands
          text: 啊，真见鬼！我眼下最缺的就是这口酒。
        - id: ch02-b12
          speaker: narrator
          text: 我已经在自己的角落坐下吃东西，便问他：“你的伤很重吗？”汉兹从喉咙里挤出一声，听着简直像狗吠。
        - id: ch02-b13
          speaker: israel_hands
          text: 那个医生要是在船上，给我治上两下，我很快就能没事。可我这辈子从来没走过运，毛病就在这儿。至于那个没用的东西，他已经死透啦。反正他从来就算不得水手。倒是你，你从哪儿冒出来的？
        - id: ch02-b14
          speaker: narrator
          text: 他说着，朝红帽子的尸体指了指。
        - id: ch02-b15
          speaker: narrator
          text: 我是上船来接管这条船的，汉兹先生。在我另作安排以前，你最好把我当船长。
        - id: ch02-b16
          speaker: narrator
          text: 他阴沉沉地盯着我，没有回答。脸颊虽然恢复了一点血色，人还是病得厉害。船身不停颠簸撞击，他也跟着一点点向下滑，在甲板上越瘫越低，怎么也坐不稳。
    - id: ch03
      title: 我与舵手的交易
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我又告诉汉兹：“对了，这面旗我可受不了。借你的光，我现在就把它降下来。船上宁可不挂旗，也不能留着这个。”我躲过扫来的主帆桁，跑到旗索旁，把那面该死的黑旗扯下，扔进海中。
        - id: ch03-b02
          speaker: narrator
          text: 上帝保佑国王！西尔弗船长到此为止啦！
        - id: ch03-b03
          speaker: narrator
          text: 我挥着帽子高喊。汉兹的下巴一直垂在胸前，目光却又尖又滑，从头到尾都盯着我。过了好一会儿，他才开口。
        - id: ch03-b04
          speaker: israel_hands
          text: 我寻思，霍金斯船长，你现在大概很想上岸吧。咱们可以谈笔买卖。
        - id: ch03-b05
          speaker: narrator
          text: 我回答说：“不错，我正求之不得。汉兹先生，你尽管说吧。”接着，我回到食物旁，胃口很好地吃了起来。
        - id: ch03-b06
          speaker: israel_hands
          text: 那个死人叫奥布赖恩，是个十足的爱尔兰佬。我跟他一起升起船帆，本来想把船开回去。可他现在跟舱底污水一样，已经死得透透的。这船还得有人来开，可依我看，你自己不会。你给我吃的、喝的，再拿一条旧围巾或者手帕，让我包住伤口。我来教你驾船。你说，这不是很公平吗？
        - id: ch03-b07
          speaker: narrator
          text: 我先把自己的条件说清楚。我不打算回基德船长锚地，而是要开进北湾，让船稳稳搁浅在那里。
        - id: ch03-b08
          speaker: israel_hands
          text: 那当然！我还没蠢到无可救药。我有眼睛，看得清眼下的情势。我已经试过，也已经输了，现在是你占上风。去北湾？我还有别的选择吗？真见鬼，就算你要去行刑码头，我也照样帮你把船开过去！
        - id: ch03-b09
          speaker: narrator
          text: 他说得似乎有些道理，我们当场成交。不到三分钟，我已经让西斯帕尼奥拉号顺风沿着金银岛海岸平稳行驶。我满怀希望，打算中午前绕过岛屿北端，再顶着风一路驶回北湾。到了涨潮时，我们可以让船安全搁浅，再等退潮露出岸边，便能下船登陆。
        - id: ch03-b10
          speaker: narrator
          text: 我把舵柄绑牢，下舱从箱子里取出母亲的一方柔软丝手帕。汉兹借着我的手，用它包住大腿上那道仍在流血的刺伤。他吃了些东西，又喝了一两口酒，明显有了精神。身子坐直了，声音也变得响亮清楚，简直换了个人。
    - id: ch04
      title: 霍金斯船长
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 风一路帮着我们。帆船乘风掠过海面，轻快得像只鸟。岛岸在身边闪过，眼前的景色每一刻都在改变。我们很快越过高地，沿一片低矮的沙地疾驶。那里只零零星星长着几棵矮松。没过多久，沙地也到了身后，我们绕过了岛屿最北端那座石山的山脚。
        - id: ch04-b02
          speaker: narrator
          text: 头一次指挥一条大船，我心里得意极了。阳光明亮，岸边又不断出现新景色，更让我快活。眼下淡水已经够喝，身边也有好东西可吃。我原先因为私自离队，一直被良心狠狠责备，可夺下西斯帕尼奥拉号这场胜利，终于让那份不安平息了。
        - id: ch04-b03
          speaker: narrator
          text: 我本来已经什么都不缺了，偏偏汉兹始终盯着我。他的眼神带着嘲弄，脸上还挂着一抹古怪的笑。那是憔悴老人痛苦而虚弱的笑，可里面又藏着一点讥讽，还有一丝背叛。我在甲板上忙碌，他就满怀算计地看着。看了又看，一刻也不肯把目光移开。
