audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    israel_hands:
      display_name: Israel Hands
      tts:
        delivery: shrewd, seasoned, and admiring
        timbre: coarse and weathered
        pace: steady
        pitch: low
  chapters:
    - id: ch01
      title: "XXV I Strike the Jolly Roger"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            I had barely found my balance on the bowsprit when the flying jib snapped full on the other tack like a gunshot. The schooner shook from deck to keel. A moment later, the jib flapped back and hung loose again.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The shock nearly threw me into the sea. I wasted no time. I crawled back along the bowsprit and tumbled headfirst onto the deck.
        - id: ch01-b03
          speaker: narrator
          text: >-
            I landed on the lee side of the forecastle. The mainsail was still drawing, and it blocked my view of part of the after-deck. I could not see a soul. No one had swabbed the planks since the mutiny, and footprints covered them. In the scuppers, a bottle with its neck broken off rolled back and forth like a living thing.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Suddenly the Hispaniola turned straight into the wind. The jibs cracked behind me, and the rudder slammed hard over. The whole ship heaved and shuddered. At that same instant, the main boom swung inboard, its rope groaning through the blocks, and the lee side of the after-deck came into view.
        - id: ch01-b05
          speaker: narrator
          text: >-
            There were the two watchmen. The man in the red cap lay on his back, stiff as a handspike. His arms stretched wide, and his teeth showed between his open lips. Israel Hands sat propped against the bulwarks. His chin rested on his chest, his open hands lay on the deck, and beneath his tan his face was white as candle wax.
        - id: ch01-b06
          speaker: narrator
          text: >-
            For a while, the schooner bucked and sidled like a vicious horse. The sails filled first on one tack, then the other. The boom swept back and forth until the mast groaned under the strain. Spray flew over the bulwark, and the bow struck the swell with heavy blows. This great rigged ship made far worse weather of the sea than my crooked little homemade coracle, which now lay at the bottom.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Each time the schooner jumped, red-cap slid across the deck. The ghastly thing was that his stiff pose and fixed grin never changed. Hands sank lower with every jolt. His feet slipped farther out, and his body leaned toward the stern. Little by little his face disappeared, until I could see only one ear and the ragged curl of a whisker.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then I noticed dark blood splashed across the planks around both men. I began to feel sure they had attacked each other in a drunken rage.
        - id: ch01-b09
          speaker: narrator
          text: >-
            As I watched and wondered, the ship grew still for a moment. Israel Hands turned partway around. With a low moan, he twisted himself back into the position where I had first seen him. His hanging jaw and that sound of pain and terrible weakness went straight to my heart. Then I remembered what I had overheard from the apple barrel, and every bit of pity left me.
        - id: ch01-b10
          speaker: narrator
          text: >-
            I walked aft as far as the mainmast.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Welcome aboard, Mr. Hands.
        - id: ch01-b12
          speaker: narrator
          text: >-
            I said it mockingly. He slowly rolled his eyes toward me, but he was too weak even to look surprised. He managed just one word.
        - id: ch01-b13
          speaker: israel_hands
          text: "Brandy."
        - id: ch01-b14
          speaker: narrator
          text: >-
            There was no time to waste. I dodged the boom as it lurched across the deck again, hurried aft, and went down the companion stairs into the cabin.
        - id: ch01-b15
          speaker: narrator
          text: >-
            You could hardly imagine such a mess. The mutineers had broken open every locked place while hunting for the chart. Mud lay thick on the floor where they had sat drinking or talking after wading through the marshes around their camp. Dirty handprints covered the white-and-gold walls. As the ship rolled, dozens of empty bottles clinked together in the corners.
        - id: ch01-b16
          speaker: narrator
          text: >-
            One of the doctor's medical books lay open on the table. Half its pages had been torn out, probably to light pipes. Through all that confusion, the lamp still burned with a dim, smoky brown glow.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I went into the cellar. Every barrel was gone, and an astonishing number of bottles had been emptied and thrown aside. Since the mutiny began, those men could not have spent a single moment sober.
        - id: ch01-b18
          speaker: narrator
          text: >-
            After searching around, I found a bottle with a little brandy left for Hands. For myself, I gathered some biscuits, pickled fruit, a large bunch of raisins, and a piece of cheese. I carried everything on deck and set my food behind the rudder head, well beyond the coxswain's reach. Then I went forward to the water barrel and drank deeply. Only after that did I hand Hands the brandy.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He swallowed nearly a quarter pint before lowering the bottle.
        - id: ch01-b20
          speaker: israel_hands
          text: >-
            Aye, by thunder, I surely needed that!
        - id: ch01-b21
          speaker: narrator
          text: >-
            I had already settled into my own corner and started eating.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Are you badly hurt?
        - id: ch01-b23
          speaker: narrator
          text: >-
            He answered with a grunt that sounded more like a bark.
        - id: ch01-b24
          speaker: israel_hands
          text: >-
            If that doctor was aboard, he'd have me fixed up after a couple of treatments. But luck never comes my way. That's my trouble. As for that swab, he's dead for certain.
        - id: ch01-b25
          speaker: narrator
          text: >-
            He pointed to the man in the red cap.
        - id: ch01-b26
          speaker: israel_hands
          text: >-
            He was never much of a sailor anyway. And where did you come from?
        - id: ch01-b27
          speaker: narrator
          text: >-
            Well, Mr. Hands, I've come aboard to take this ship. From now on, you can treat me as your captain.
        - id: ch01-b28
          speaker: narrator
          text: >-
            He gave me a sour look but said nothing. Some color had returned to his cheeks. Still, he looked sick, and whenever the ship banged about, he kept sliding lower on the deck.
        - id: ch01-b29
          speaker: narrator
          text: >-
            One more thing, Mr. Hands. Those colors won't do. With your permission, I'm taking them down. No flag at all is better than that one.
        - id: ch01-b30
          speaker: narrator
          text: >-
            I dodged the boom again and ran to the flag lines. I hauled down the cursed black flag and threw it overboard. Then I waved my cap.
        - id: ch01-b31
          speaker: narrator
          text: >-
            God save the king! That's the end of Captain Silver!
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: >-
            Hands watched me with a sharp, sly look, his chin still resting on his chest. At last he spoke.
        - id: ch01-b33
          speaker: israel_hands
          text: >-
            I reckon you'll be wanting to get ashore now, Captain Hawkins. Suppose we talk it over.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Gladly, Mr. Hands. Go ahead.
        - id: ch01-b35
          speaker: narrator
          text: >-
            I returned to my meal and ate with a fine appetite.
        - id: ch01-b36
          speaker: israel_hands
          text: >-
            That man there was O'Brien. A bad Irishman, he was. He and I got the sails up because we meant to sail the ship back. Well, he's dead now, dead as bilge water. So who's going to sail her? Unless I give you some guidance, it won't be you. Here's the deal. You give me food and drink, and an old scarf or handkerchief to bind my wound. I'll teach you how to handle her. That sounds fair all around.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Then let me make one thing clear. I'm not taking her back to Captain Kidd's anchorage. I'm sailing into North Inlet, and I'll beach her quietly there.
        - id: ch01-b38
          speaker: israel_hands
          text: >-
            Of course you are! I'm not such a hopeless landlubber that I can't see what's happened. I took my chance, and I lost. You've got the advantage now. North Inlet? I don't have any choice, do I? Why, I'd help you sail her all the way to Execution Dock. By thunder, I would!
        - id: ch01-b39
          speaker: narrator
          text: >-
            His offer made sense to me, so we struck the bargain right there. Within three minutes, I had the Hispaniola running easily before the wind along the coast of Treasure Island. I hoped to round the northern point before noon. Then we could beat back down to North Inlet and arrive before high water. There we could beach her safely and wait for the falling tide to let us go ashore.
        - id: ch01-b40
          speaker: narrator
          text: >-
            I tied the tiller in place and went below to my own chest. Inside, I found a soft silk handkerchief that belonged to my mother. With my help, Hands wrapped it around the deep, bleeding stab wound in his thigh. He ate a little and took another swallow or two of brandy. Soon he looked noticeably stronger. He sat straighter, spoke more clearly, and seemed like a different man.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The breeze could not have served us better. We skimmed ahead like a bird while the island coast flashed past and the view changed from minute to minute. Before long, the high ground lay behind us. We raced beside low, sandy country dotted here and there with dwarf pines. Then that country fell behind as well, and we rounded the rocky hill that forms the island's northern end.
        - id: ch01-b42
          speaker: narrator
          text: >-
            I was thrilled with my new command. The sun shone brightly, and every new view of the coast pleased me. I had plenty of water and good things to eat now. My conscience had troubled me badly for deserting the others, but the great victory of taking the ship had quieted it. I might have had nothing left to wish for, except for the way the coxswain kept watching me.
        - id: ch01-b43
          speaker: narrator
          text: >-
            His eyes followed me around the deck with mockery in them, and a strange smile never quite left his face. Part of it came from pain and weakness, the haggard smile of an old man. But there was something else in his expression too. A trace of scorn. A shadow of treachery. As I went about my work, he watched me, and watched me, and watched me.
