audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: commanding, quick-witted, and rough-edged
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    dick:
      display_name: Dick
      tts:
        delivery: wary and obedient
        timbre: lean and youthful
        pace: steady
        pitch: medium
    morgan:
      display_name: Tom Morgan
      tts:
        delivery: blunt, mutinous, and weather-beaten
        timbre: coarse and gravelly
        pace: forceful
        pitch: medium-low
    growling_pirate:
      display_name: Growling Pirate
      tts:
        delivery: sullen and suspicious
        timbre: dark and raspy
        pace: slow
        pitch: low
    first_mutineer:
      display_name: First Mutineer
      tts:
        delivery: resentful and defiant
        timbre: rough and nasal
        pace: clipped
        pitch: medium
    second_mutineer:
      display_name: Second Mutineer
      tts:
        delivery: bitter and confrontational
        timbre: hard and hoarse
        pace: brisk
        pitch: medium-low
    council_spokesman:
      display_name: Council Spokesman
      tts:
        delivery: cold, formal, and calculating
        timbre: dry and cutting
        pace: measured
        pitch: medium
