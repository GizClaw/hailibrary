      display_name: Rules Pirate
      tts:
        delivery: guarded and matter-of-fact
        timbre: rough and reedy
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: "The Enemy in the Blockhouse"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The torch cast a red glare through the blockhouse, and it showed me exactly what I had feared. The pirates had taken the house and all our supplies. The brandy cask was there, along with the pork and bread. But what frightened me ten times more was that I saw no prisoners. I could only believe my friends were dead, and I bitterly wished I had stayed and died beside them.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There were six buccaneers left alive. Five stood around me, red-faced and swollen after being jerked awake from a drunken sleep. The sixth had only pushed himself up on one elbow. His face was deathly pale, and a bloodstained bandage circled his head. He had been wounded and dressed not long before. I remembered the man who had been shot during the attack and had fled into the woods. I felt sure this was him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Silver's parrot sat on his shoulder, smoothing her feathers. Silver himself looked paler and sterner than usual. He still wore the fine broadcloth suit from his visit to our camp, but it was badly worn. Clay covered the cloth, and sharp thorns had torn it in the woods.
        - id: ch01-b04
          speaker: long_john_silver
          text: >-
            Well, well. Jim Hawkins, if it isn't you! Just dropped in for a visit, did you? That's downright friendly.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He sat across the brandy cask and began filling his pipe.
        - id: ch01-b06
          speaker: long_john_silver
          text: "Dick, lend me that torch."
        - id: ch01-b07
          speaker: narrator
          text: >-
            Once his pipe was lit, Silver handed it back.
        - id: ch01-b08
          speaker: long_john_silver
          text: >-
            That'll do, lad. Stick the light back in the woodpile. And the rest of you, sit down. No need to stand for Mr. Hawkins. He won't mind. Now, Jim, here you are. What a fine surprise for old John! I knew you were sharp the first time I saw you, but this has me beat.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I said nothing. They put me with my back against the wall, and I stood there looking Silver in the face. I hoped I appeared brave enough from the outside. Inside, though, my heart was black with despair, and I had given up all hope.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Silver calmly drew on his pipe a few times before he went on.
        - id: ch01-b11
          speaker: long_john_silver
          text: >-
            Since you're here, Jim, I'll tell you straight. I've always liked you. You're a spirited lad, and you remind me of myself when I was young and handsome. I always wanted you to join us, take your share of the prize, and die a gentleman. Now you'll have to. Captain Smollett is a fine sailor. I'll admit that any day. But he's strict about discipline. "Duty is duty," he says, and he's right. Best stay clear of the captain. Even the doctor has turned against you. "Ungrateful scamp," he called you. So here's the whole of it. Your own people won't take you back. Unless you mean to start a third ship's company all by yourself, and that could get lonely, you'll have to join Captain Silver.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That much was good news. My friends were alive. I half believed Silver when he said they were angry because I had deserted them, but relief mattered far more than worry just then.
        - id: ch01-b13
          speaker: long_john_silver
          text: >-
            I don't need to remind you that you're in our hands. You know it well enough. I favor a fair argument myself. Threats never brought much good, as far as I've seen. If you like our service, then join us. If you don't, you're welcome to say no. Tell me, shipmate, could any sailor offer fairer terms than that?
        - id: ch01-b14
          speaker: narrator
          text: >-
            The threat of death hung over me beneath every mocking word. I could feel it through all of Silver's talk about fairness and freedom. My cheeks burned, my heart beat painfully against my ribs, and my voice trembled when I answered.
        - id: ch01-b15
          speaker: narrator
          text: "So I'm supposed to answer now?"
        - id: ch01-b16
          speaker: long_john_silver
          text: >-
            Nobody's forcing you, lad. Take your time and get your bearings. We won't hurry you. Your company makes the time pass pleasantly.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Well, if I truly have a choice, then I have a right to know what's happened. Why are you here, and where are my friends?
        - id: ch01-b18
          speaker: growling_pirate
          text: >-
            What's happened? A lucky man would know the answer to that.
        - id: ch01-b19
          speaker: long_john_silver
          text: >-
            Keep your mouth shut until someone asks you to speak, my friend.
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            Then Silver turned back to me, and his voice became pleasant again.
        - id: ch01-b21
          speaker: long_john_silver
          text: >-
            Yesterday morning, Mr. Hawkins, during the early watch, Doctor Livesey came down under a flag of truce. He told me, "Captain Silver, you've lost. The ship is gone." Maybe we'd been passing the bottle and singing to keep it moving. I won't deny it. Anyway, not one of us had bothered to look out. When we finally did, sure enough, the old ship had vanished! You never saw such a pack of fools, and I looked the greatest fool of all. Then the doctor said we should make a bargain. He and I settled it, and that is how we came to have the supplies, the brandy, the blockhouse, and all that firewood you kindly cut. In a manner of speaking, we got the whole blessed ship from the cross-trees down to the keel. Your friends marched off. Where they went, I couldn't tell you.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He took another quiet pull at his pipe, then added one more thing.
        - id: ch01-b23
          speaker: long_john_silver
          text: >-
            And don't go thinking that the bargain included you. These were the last words between us. I asked how many of them were leaving. The doctor said, "Four, with one man wounded. As for that boy, I don't know where he is, and I don't much care. We're sick of him." That's exactly what he said.
        - id: ch01-b24
          speaker: narrator
          text: "Is that everything?"
        - id: ch01-b25
          speaker: long_john_silver
          text: "It's everything you're going to hear, my son."
        - id: ch01-b26
          speaker: narrator
          text: "And now I choose?"
        - id: ch01-b27
          speaker: long_john_silver
          text: "Now you choose. You can count on that."
    - id: ch02
      title: "Jim Tells the Truth"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I told Silver I was no fool. I knew very well what was waiting for me, and I was ready to let the worst happen. After seeing so many men die since I had fallen in with the pirates, I hardly cared how bad it was. But before they decided, I had a few things of my own to tell them. By then, excitement had driven away my fear.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Look at the trouble you're in. Your ship is gone. The treasure is gone. Your men are gone. Your whole plan has been wrecked. And if you want to know who did it, I did! I was hiding in the apple barrel when we first saw the island. I heard you, John, and Dick Johnson, and Hands, who's now at the bottom of the sea. I repeated every word within the hour. I cut the schooner's cable. I killed the men you left aboard her. And I took the ship somewhere none of you will ever find her. I'm the one with the last laugh. I've been ahead of you from the start, and I'm no more afraid of you than I am of a fly.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Kill me or let me live. But hear this first. If you spare me, I'll forget what's past. When you're brought to court for piracy, I'll do everything I can to save you. So the choice belongs to you. You can kill one more person and gain nothing, or you can spare me and keep a witness who may save you from the gallows.
        - id: ch02-b04
          speaker: narrator
          text: >-
            I stopped because I had run out of breath. To my amazement, not one of them moved or reached for me. They stayed where they were and stared as blankly as a flock of sheep. While they were still staring, I found my voice and spoke once more.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Mr. Silver, I believe you're the best man among them. If things go badly for me, I'd be grateful if you told the doctor how I faced it.
        - id: ch02-b06
          speaker: long_john_silver
          text: "I'll remember that."
        - id: ch02-b07
          speaker: narrator
          text: >-
            There was something strange in Silver's voice. I could not tell whether he was laughing at me or whether my courage had won him over.
        - id: ch02-b08
          speaker: morgan
          text: >-
            I'll add something to the charge against him! That's the boy who knew Black Dog.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The speaker was Morgan, the old sailor with the dark mahogany face. I had seen him before at Long John's tavern on the Bristol docks.
        - id: ch02-b10
          speaker: long_john_silver
          text: >-
            And I'll add another, by thunder! This is the same boy who took the chart from Billy Bones. Every time we've come to grief, Jim Hawkins has been there!
        - id: ch02-b11
          speaker: morgan
          text: "Then I'll finish him now!"
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            Morgan swore, sprang to his feet, and drew his knife in one quick motion. For that instant, the old sailor moved as though he were twenty years old again.
        - id: ch02-b13
          speaker: long_john_silver
          text: >-
            Hold it right there! Who do you think you are, Tom Morgan? Captain, maybe? Cross me, and I'll teach you different. For thirty years, every man who stood against me met a bad end. Some swung from a yardarm. Some went overboard and fed the fish. No man has ever looked me in the eye that way and lived to enjoy the next day. Remember that, Tom Morgan.
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: >-
            Morgan stopped. Then an angry muttering rose from the others.
        - id: ch02-b15
          speaker: first_mutineer
          text: "Tom's right."
        - id: ch02-b16
          speaker: second_mutineer
          text: >-
            I've taken enough bullying from one man already. I'll be hanged before I take it from you, John Silver.
        - id: ch02-b17
          speaker: long_john_silver
          text: >-
            Does one of you gentlemen want to settle this with me? Then put a name to what you're after. You can still talk, can't you? Anyone who wants a fight can have one. I've lived all these years, and now, near the end of them, some rum-soaked nobody thinks he can swagger over me? You know how this works. You call yourselves gentlemen of fortune, so come on. I'm ready. Take up a cutlass if you dare. Crutch and all, I'll show you the color of your own insides before this pipe goes cold.
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: >-
            No one moved. No one answered.
        - id: ch02-b19
          speaker: long_john_silver
          text: >-
            So that's the kind of men you are. A fine-looking lot, but no use in a fight. Maybe you'll understand plain English. You elected me captain because I'm the best man here by a whole sea mile. If you won't fight me like gentlemen of fortune, then you'll obey me. I like this boy. I've never seen a better one. He's more of a man than any two rats in this house. Let me see anyone lay a hand on him. Go on. Just try it.
        - id: ch02-b20
          speaker: narrator
          text: >-
            A long silence followed. I stayed upright against the wall. My heart still pounded like a sledgehammer, but now a small ray of hope had appeared. Silver leaned back against the wall with folded arms and his pipe at the corner of his mouth. He looked as calm as if he were sitting in church. All the while, his eyes moved secretly from man to man, never losing sight of his unruly followers.
    - id: ch03
      title: "The Forecastle Council"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The pirates slowly gathered at the far end of the blockhouse. Their low whispers made a steady hiss in my ears, like a stream running nearby. One after another, they glanced up from their secret talk. Each time, the red torchlight caught a nervous face for a moment. They were not looking at me. Every uneasy eye turned toward Silver.
        - id: ch03-b02
          speaker: long_john_silver
          text: >-
            You fellows seem to have plenty to say. Speak up so I can hear it, or stop talking.
        - id: ch03-b03
          speaker: council_spokesman
          text: >-
            Begging your pardon, sir, you're quick enough to use some of the rules. Perhaps you'll respect the others too. This crew is dissatisfied, and it won't stand for any more bullying. We have our rights, same as any crew. By your own rules, we're allowed to talk among ourselves. I recognize you as captain for the present, sir. But I claim my right to step outside for a council.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The man gave Silver an elaborate sailor's salute. He was about thirty-five, tall and ugly, with yellow eyes. Then he walked calmly out the door. The others followed one at a time. Each saluted Silver and offered some excuse as he passed.
        - id: ch03-b05
          speaker: rules_pirate
          text: "It's according to the rules."
        - id: ch03-b06
          speaker: morgan
          text: "Forecastle council."
        - id: ch03-b07
          speaker: narrator
          text: >-
            With one remark or another, they all marched outside. Silver and I were left alone in the blockhouse with the torch. The moment the door was clear, Silver pulled the pipe from his mouth.
        - id: ch03-b08
          speaker: long_john_silver
          text: >-
            Listen closely, Jim Hawkins. You're half an inch from death, and what comes before it may be torture. Those men mean to throw me out as captain. But mark this. I'll stand by you through thick and thin. I didn't plan to, not until you spoke up. I was almost desperate when I thought I'd lose all that money and hang besides. Then I saw what kind of lad you are. I told myself, "Stand by Hawkins, John, and Hawkins will stand by you." You're my last card, Jim, and I'm yours. Back-to-back, that's how we'll do it. I save my witness, and my witness saves my neck.
        - id: ch03-b09
          speaker: narrator
          text: >-
            I was only beginning to understand him.
        - id: ch03-b10
          speaker: narrator
          text: "You mean everything is lost?"
        - id: ch03-b11
          speaker: long_john_silver
          text: >-
            Aye, that's just what I mean! The ship's gone, and my neck will go with it. When I looked into that bay and saw no schooner, even a hard man like me gave up. As for that bunch and their council, they're nothing but fools and cowards. I'll save your life from them if I can. But this is a trade, Jim. You must save Long John from hanging.
        - id: ch03-b12
          speaker: narrator
          text: >-
            I could hardly make sense of it. The old buccaneer who had led the whole mutiny was asking me for something that seemed impossible.
        - id: ch03-b13
          speaker: narrator
          text: "Whatever I can do, I'll do."
        - id: ch03-b14
          speaker: long_john_silver
          text: >-
            Then it's a bargain! You spoke bravely, Jim, and now I may have a chance.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Silver hobbled to the torch, which was propped among the firewood, and lit his pipe again. Then he came back to me.
    - id: ch04
      title: "Silver Changes Sides"
      blocks:
        - id: ch04-b01
          speaker: long_john_silver
          text: >-
            Understand me, Jim. I've got a good head on my shoulders. I'm on the squire's side now. I know you've hidden that ship somewhere safe. I don't know how you managed it, but safe she is. I suppose Hands and O'Brien lost their nerve, though I never trusted either one much. Listen carefully. I won't ask you any questions, and I won't let anyone else ask them either. I know when the game is over, and I know a loyal lad when I see one. Ah, you're young! If you and I had joined forces while I was young too, we could have done a great deal together.
        - id: ch04-b02
          speaker: narrator
          text: >-
            He drew some brandy from the cask and poured it into a small tin cup for himself.
        - id: ch04-b03
          speaker: long_john_silver
          text: "Care for a taste, shipmate?"
        - id: ch04-b04
          speaker: narrator
          text: >-
            I refused.
        - id: ch04-b05
          speaker: long_john_silver
          text: >-
            Then I'll have a drink myself. I need something to steady me, Jim. There's trouble coming. And speaking of trouble, why did the doctor give me the treasure map?
        - id: ch04-b06
          speaker: narrator
          text: >-
            The surprise on my face was so genuine that Silver knew there was no point in questioning me further.
        - id: ch04-b07
          speaker: long_john_silver
          text: >-
            He gave it to me, all right. There must be something behind that. Something good or bad, but something for certain.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Silver swallowed another mouthful of brandy. Then he shook his great fair head slowly from side to side, like a man looking ahead and expecting the worst.
