audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    dick:
      display_name: 迪克
      tts:
        delivery: 年轻海盗的直白粗野，面对头目时带着小心
        timbre: 稍显沙哑的年轻男声
        pace: 偏快
        pitch: 中
    pirate_deep_voice:
      display_name: 低嗓门海盗
      tts:
        delivery: 粗鲁多疑，发牢骚时压着怒气
        timbre: 低沉粗糙的男声
        pace: 稍慢
        pitch: 低
    tom_morgan:
      display_name: 汤姆·摩根
      tts:
        delivery: 老水手般粗野冲动，底气不足时仍强撑着
        timbre: 苍老干涩的男声
        pace: 急促
        pitch: 中低
    pirate_dissenter:
      display_name: 叛乱的海盗
      tts:
        delivery: 沉不住气的不满与挑衅，话里带着怨恨
        timbre: 沙哑紧绷的男声
        pace: 中快
        pitch: 中
    yellow_eyed_pirate:
      display_name: 黄眼睛海盗
      tts:
        delivery: 表面恭敬、实则强硬，照着海盗规矩咬字说话
        timbre: 阴沉偏冷的男声
        pace: 不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 落入敌手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 火把的红光照进木屋，眼前的一切证实，我最怕的事果然发生了。屋子和所有补给都落到了海盗手里。那桶白兰地还在，猪肉和面包也还跟从前一样放着。最叫我害怕的是，屋里连一个俘虏的影子也看不见。我只能想，朋友们全死了。我心里痛得厉害，恨自己没能留下来，陪他们死在一起。
        - id: ch01-b02
          speaker: narrator
          text: 屋里总共有六个海盗，别的人都已经死了。其中五个已经站起身，脸色涨红，眼皮浮肿，像是刚从酒醒后的第一觉里被人惊醒。最后一个还躺着，只能用胳膊撑起半边身子。他的脸惨白得吓人，头上缠着染血的绷带。看来他不久前才受过伤，伤口更是刚刚包扎过。我想起大战时那个中枪后逃回林子的人，料定一定就是他。
        - id: ch01-b03
          speaker: narrator
          text: 弗林特船长蹲在高个子约翰肩上，只顾梳理自己的羽毛。西尔弗看着比平常苍白，神情也更加严厉。他还穿着去执行使命时那套精美的阔呢衣服，可它早已不成样子。上面到处是泥，林中的尖荆棘还把它划得处处破裂。
        - id: ch01-b04
          speaker: long_john_silver
          text: 原来是吉姆·霍金斯，真见鬼！你自己找上门来了，是吧？好，这份情我领了。
        - id: ch01-b05
          speaker: narrator
          text: 他跨坐到白兰地酒桶上，开始装烟。
        - id: ch01-b06
          speaker: long_john_silver
          text: 迪克，把火把借我一下。
        - id: ch01-b07
          speaker: narrator
          text: 等烟斗点好，他又把火把还了回去。
        - id: ch01-b08
          speaker: long_john_silver
          text: 行了，小伙子，把灯放回柴火堆。请坐吧，几位。霍金斯先生不会怪你们失礼。吉姆，你真给可怜的老约翰送来一个惊喜。第一眼见你，我就知道你聪明，可你这一手连我都看不明白。
        - id: ch01-b09
          speaker: narrator
          text: 听完这一大套话，我什么也没说。他们让我背靠墙站着。我迎着西尔弗的目光，希望自己至少表面上看起来还算勇敢，可我心里已经被一片漆黑的绝望压住了。西尔弗却非常从容，他慢慢抽了几口烟，然后又开了口。
        - id: ch01-b10
          speaker: long_john_silver
          text: 吉姆，既然你来了，我就跟你说句真心话。我一直喜欢你。你这小子有胆量，像极了年轻又英俊时的我。我早就想叫你入伙，让你分到自己那一份，将来再像个体面人那样死去。现在嘛，我的小公鸡，你只能这么选了。斯莫利特船长是个好水手，这一点我随时都愿意承认，可他把纪律看得比什么都重。他总说职责就是职责，这话倒没错。你还是离他远点吧。就连医生也彻底不要你了，说你是个不知感恩的小混蛋。所以，你回不了他们那边，他们不会再收留你。除非你一个人另组第三伙船员，不过那也太孤单了。看来你只能跟西尔弗船长入伙。
        - id: ch01-b11
          speaker: narrator
          text: 这番话至少告诉我，朋友们还活着。我的确有点相信西尔弗所说的那一部分，觉得木屋里的人会因为我擅自离队而生气，甚至真的不想再要我。可只要知道他们都还活着，得到的安慰就远远多过不安。
        - id: ch01-b12
          speaker: long_john_silver
          text: 我可没说你已经落在我们手里，虽说你确实就站在这里。我喜欢讲道理，从没见过威胁能带来什么好结果。你要是喜欢这份差事，就跟我们入伙。要是不喜欢，吉姆，你就尽管说不。放心回答吧，伙计。一个凡人水手要是还能说出更公道的话，就叫我断了背梁骨。
        - id: ch01-b13
          speaker: narrator
          text: 那么，我现在就要回答吗？
        - id: ch01-b14
          speaker: narrator
          text: 我的声音抖得厉害。西尔弗嘴上说得轻松，我却听出死亡正悬在头顶。我脸上发烫，心跳得胸口生疼。
        - id: ch01-b15
          speaker: long_john_silver
          text: 小伙子，没人逼你。先看清形势吧。咱们都不催你，有你作伴，时间过得可愉快呢。
        - id: ch01-b16
          speaker: narrator
          text: 听他这样说，我的胆子大了一点。要我选可以，可我还没有傻到糊里糊涂就做决定。我有权先弄明白几件事。到底发生了什么？你们为什么会在这里？还有，我的朋友们究竟去了哪里？
        - id: ch01-b17
          speaker: pirate_deep_voice
          text: 发生了什么？哼，谁要是知道，那才叫走运呢！
        - id: ch01-b18
          speaker: long_john_silver
          text: 没让你说话的时候，最好把舱口闭严了，我的朋友。
        - id: ch01-b19
          speaker: narrator
          text: 西尔弗恶狠狠地压住那人，转向我时，又换回了亲切口气。
        - id: ch01-b20
          speaker: long_john_silver
          text: 霍金斯先生，昨天早晨头班值更时，利夫西医生打着白旗下来了。他开口就说，西尔弗船长，你们完了，船不见了。我们当时也许喝了几杯，又唱了歌助兴，这我不否认。反正一直没人出去看。等大家跑出去一看，天打雷劈的，那条老船果然没了。我还没见过哪群傻瓜能露出那么狼狈的脸色，而且我敢说，当时数我自己的脸色最难看。医生接着说，咱们做笔交易吧。我们就谈成了。现在，补给、白兰地、木屋，还有你们好心砍好的柴，全都归我们。可以说，整条该死的船，从桅顶横木到龙骨，都已经是我们的了。至于他们，都徒步离开了。他们现在去了哪里，我也不知道。
        - id: ch01-b21
          speaker: narrator
          text: 他又慢悠悠地抽了一口烟。
        - id: ch01-b22
          speaker: long_john_silver
          text: 你可别以为这交易里也包括你。我再把当时最后的话说给你听。我问医生，你们打算有几个人离开？他说，四个，总共四个，其中一个还受了伤。至于那小子，鬼知道他在哪里，我也不怎么在乎。我们都已经受够他了。这可都是医生当时的原话。
        - id: ch01-b23
          speaker: narrator
          text: 就这些吗？
        - id: ch01-b24
          speaker: long_john_silver
          text: 儿子，你能听的就这些。
        - id: ch01-b25
          speaker: narrator
          text: 现在该我选了？
        - id: ch01-b26
          speaker: long_john_silver
          text: 对，现在就由你选。
    - id: ch02
      title: 吉姆的挑战
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我还不至于傻到不知道自己的下场。最坏的事尽管来，我一点也不在乎。自从跟你们碰上，我已经看过太多人死去了。不过我有几件事必须告诉你们。第一件就是，你们现在糟透了。船丢了，宝藏丢了，人也没了，整件事都让你们弄得一败涂地。想知道是谁干的吗？是我！望见陆地的那天晚上，我躲在苹果桶里，听到了约翰、迪克·约翰逊和如今躺在海底的汉兹说的每句话。还没过一个钟头，我就把你们的话全告诉了别人。至于那条帆船，它的锨缆是我砍断的。你们留在船上的人是我杀的。船也是我藏起来的，你们谁都别想再见到它。这一回轮到我笑了。从头到尾，占上风的都是我。我怕你们，还不如怕一只苍蝇。杀我还是留我，你们自己选。我只再说一件事。要是留下我，从前的事就一笔勾销。等你们因为当海盗上了法庭，我会尽力救你们。你们可以杀掉又一个人，却得不到任何好处。也可以留下我，留下一个能救你们不上绞架的证人。
        - id: ch02-b02
          speaker: narrator
          text: 我说完已经喘不过气。可那些人谁都没动，只像一群羊那样瞪着我。趁他们还没回过神，我又对西尔弗开了口。
        - id: ch02-b03
          speaker: narrator
          text: 西尔弗先生，我相信你是这里最有本事的人。要是事情真到了最坏的地步，请你告诉医生，我是怎样面对的。
        - id: ch02-b04
          speaker: long_john_silver
          text: 我会记住。
        - id: ch02-b05
          speaker: narrator
          text: 他的语气古怪极了。我怎么也听不出，他是在取笑我，还是真被我的勇气打动了。
        - id: ch02-b06
          speaker: tom_morgan
          text: 我再给这小子加一条。当初他就认得黑狗。
        - id: ch02-b07
          speaker: narrator
          text: 说话的是老水手摩根。他有一张桃花心木般黑红的脸，我曾在布里斯托尔码头的高个子约翰酒馆见过他。
        - id: ch02-b08
          speaker: long_john_silver
          text: 那我也给他加一条，真见鬼！从比利·骨头手里弄走藏宝图的，也是他。从头到尾，咱们都是栽在吉姆·霍金斯手里的。
        - id: ch02-b09
          speaker: tom_morgan
          text: 那就动手吧！
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: 摩根骂了一句，腾地跳起来，拔出刀子，劲头完全不像个老人。
        - id: ch02-b11
          speaker: long_john_silver
          text: 给我站住！汤姆·摩根，你以为自己是船长吗？那我就教你明白明白。敢跟我作对，你就会去那些好汉三十年来去的地方。有人被吊在帆桁上，有人被扔进海里，最后都喂了鱼。从没有人敢盯着我挑衅，之后还能过上好日子。这话你记好了。
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 摩根停下了，其他人却在低声叫嚷。
        - id: ch02-b13
          speaker: pirate_deep_voice
          text: 汤姆说得对。
        - id: ch02-b14
          speaker: pirate_dissenter
          text: 我受够了别人的欺压。约翰·西尔弗，我可不想再受你欺负，否则就叫我上绞架！
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 西尔弗还坐在酒桶上，却猛地俯身向前，几乎要从桶上探出去。他右手仍紧紧握着烟斗，斗里的火明明灭灭，还没熄灭。
        - id: ch02-b16
          speaker: long_john_silver
          text: 你们有谁想跟我见个高低？想干什么就把话说清楚，我料你们还不是哑巴。谁想来，我就陪他，他也一定能得到想要的。我活了这么多年，临到末了，还能让一个酒桶里长大的杂种骑到我头上？你们都是闯荡江湖的好汉，该怎么办，规矩也都懂。好，我已经准备好了。有胆的就拿起弯刀，现在就站出来。在这斗烟抽完之前，我就连人带拐杖剖开他的肚子，看看里面是什么颜色！
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: 没人动，也没人回答。
        - id: ch02-b18
          speaker: long_john_silver
          text: 原来你们就这点出息。看着倒是一群神气的家伙，真打起来却一个都不中用。乔治国王的英语，你们总该听得懂。我是大家选出来的船长。我能当上船长，是因为我比你们强得多，强出的不只一星半点。你们不敢像闯荡江湖的好汉那样动手，那就必须乖乖听我的命令。这话你们尽管记住。我喜欢这小子，从没见过比他更好的。你们这群老鼠，就算两个凑在一起，都比不上他像个男子汉。现在我把话放在这里，谁敢动他一根手指，就站出来让我看看。
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: 屋里沉默了很久。我挺直身子靠在墙上，心仍像铁锤一样猛敲，可胸口已经有了一线希望。西尔弗靠墙坐着，两臂交叉，嘴角衔着烟斗，镇定得像是身在教堂。不过他总在暗中转动眼睛，用眼角盯住不听话的手下。那些人聚到木屋远处，压低声音商量。那片窃窃私语像溪水一样没完没了。他们不时抬起头，火把的红光从一张张紧张的脸上掠过。他们看的不是我，而是西尔弗。
    - id: ch03
      title: 前舱会议
      blocks:
        - id: ch03-b01
          speaker: long_john_silver
          text: 你们看来有不少话要说。那就大声说给我听，不然就闭嘴。
        - id: ch03-b02
          speaker: yellow_eyed_pirate
          text: 请您原谅，先生。有些规矩您用起来挺随便，那么别的规矩也请您留心照办。大家现在都很不满意。咱们这伙人可不把欺压人当什么了不起的本事，也不肯再任人欺负。咱们跟别的船员一样，都有自己的权利，这句话我就放胆说了。照您自己定的规章，我们有权聚在一起商量。请您再原谅一回，先生。我承认您现在还是船长，可我也要行使自己的权利，走到屋外去开个会。
        - id: ch03-b03
          speaker: narrator
          text: 这人大约三十五岁，高高瘦瘦，模样凶恶，两只眼睛发黄。他照水手的派头，认真而繁复地敬了个礼，然后不紧不慢地走到门边，消失在屋外。其他人也一个接一个照他的样子做。每个人路过西尔弗时都会行个礼，再说上一句给自己开脱的话。
        - id: ch03-b04
          speaker: pirate_deep_voice
          text: 照规矩办。
        - id: ch03-b05
          speaker: tom_morgan
          text: 前舱会议。
        - id: ch03-b06
          speaker: narrator
          text: 他们全都走了出去。木屋里只剩下火把、西尔弗和我。西尔弗立刻拿下了烟斗。
        - id: ch03-b07
          speaker: long_john_silver
          text: 吉姆·霍金斯，你给我听好。你离死只有半块船板那么远，比死更糟的是，他们还可能先拷打你。他们正打算把我赶下台。不过你记住，从现在开始，不管出什么事，我都站在你这边。本来我并不想这么做，直到你说出刚才那番话。我原本已经绝望了。那么一大笔钱全没了，到头来，自己还要上绞架。可我看出你是个真正可靠的人。我对自己说，约翰，你帮霍金斯，霍金斯也会帮你。你是他最后一张牌，我向活着的雷神起誓，他也是你最后一张牌。咱们背靠背。你保住自己的证人，他就保住你脖子上的脑袋。
        - id: ch03-b08
          speaker: narrator
          text: 听到这里，我才渐渐明白他究竟在说什么。你的意思是，一切都完了？
        - id: ch03-b09
          speaker: long_john_silver
          text: 对，真见鬼，就是全完了！船没了，脑袋也保不住了，这就是整件事的样子。吉姆·霍金斯，我往海湾里一看，发现连帆船的影子都没了。我当然算得上一块硬骨头，可那一刻，就连我也撑不住了。至于外面那伙人和他们的会议，你尽管看着吧，他们全是一群彻头彻尾的傻瓜和胆小鬼。只要我能做到，就会从他们手上救你一命。可是吉姆，你听好，咱们得一报还一报。你要救高个子约翰不上绞架。
        - id: ch03-b10
          speaker: narrator
          text: 我听得晕头转向。这个要求简直没有实现的可能。向我求救的，可是这个老海盗，他始终是叛乱的头子。
        - id: ch03-b11
          speaker: narrator
          text: 只要是我能做的，我就做。
        - id: ch03-b12
          speaker: long_john_silver
          text: 一言为定！你这话说得有胆量。真见鬼，这下我有机会了！
        - id: ch03-b13
          speaker: narrator
          text: 他一瘸一拐地走到柴火堆边，借着火把重新点燃烟斗，然后又回到我面前。
        - id: ch03-b14
          speaker: long_john_silver
          text: 吉姆，你要真正明白我的话。我肩膀上长着脑袋，它可不是白长的。我现在已经站在乡绅那边。我知道你把船安安稳稳地藏在了某个地方。怎么做到的，我不知道，可那条船现在肯定很安全。我猜汉兹和奥布赖恩是忽然手软了，反正我从来没怎么信过他们俩。你现在听好，我不问你船的事，也不准别人向你打听。一场游戏是不是已经结束，我看得出来。一个小伙子是不是忠实可靠，我也看得出来。唉，你还这么年轻。你和我要是早早搭上伙，本来能一起干出多少了不起的大事啊！
        - id: ch03-b15
          speaker: narrator
          text: 他从酒桶里接了一锡杯白兰地。
        - id: ch03-b16
          speaker: long_john_silver
          text: 来一口吗，伙计？
        - id: ch03-b17
          speaker: narrator
          text: 我拒绝了。
        - id: ch03-b18
          speaker: long_john_silver
          text: 好吧，吉姆，那我就自己喝一口。眼下麻烦就要来了，我得喝杯酒压压惊，先给自己撑一撑。说到这场麻烦，吉姆，我还有一件怎么也想不明白的事。利夫西医生为什么会把那张藏宝图交到我手里？
        - id: ch03-b19
          speaker: narrator
          text: 这件事完全出乎我的意料，脸上的惊讶再真实不过。西尔弗只看了我一眼，就知道继续问我也不会得到任何答案。
        - id: ch03-b20
          speaker: long_john_silver
          text: 他的确把图给我了。这里面一定有名堂，吉姆，一定有。只是不知道对我们是好是坏。
        - id: ch03-b21
          speaker: narrator
          text: 说完，他又灌了一口白兰地，还不停摇着那颗浅色的大脑袋。看他的样子，简直像个已经做好一切准备、正等着最坏事情降临的人。
