audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    dick:
      display_name: 迪克
      tts:
        delivery: 年轻海盗的直白粗野，面对头目时带着小心
        timbre: 稍显沙哑的年轻男声
        pace: 偏快
        pitch: 中
    pirate_deep_voice:
      display_name: 低嗓门海盗
      tts:
        delivery: 粗鲁多疑，发牢骚时压着怒气
        timbre: 低沉粗糙的男声
        pace: 稍慢
        pitch: 低
    tom_morgan:
      display_name: 汤姆·摩根
      tts:
        delivery: 老水手般粗野冲动，底气不足时仍强撑着
        timbre: 苍老干涩的男声
        pace: 急促
        pitch: 中低
    pirate_dissenter:
      display_name: 叛乱的海盗
      tts:
        delivery: 沉不住气的不满与挑衅，话里带着怨恨
        timbre: 沙哑紧绷的男声
        pace: 中快
        pitch: 中
    yellow_eyed_pirate:
      display_name: 黄眼睛海盗
      tts:
        delivery: 表面恭敬、实则强硬，照着海盗规矩咬字说话
        timbre: 阴沉偏冷的男声
        pace: 不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 黑券再临
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海盗们在外面商量了好一阵，才有一个人走回木屋。他又行了那个礼，我怎么看都觉得带着讥讽。那人请求把火把借去片刻，西尔弗一口答应。人一出去，屋里便只剩我和西尔弗，四周又黑了下来。
        - id: ch01-b02
          speaker: long_john_silver
          text: 吉姆，要起风了。
        - id: ch01-b03
          speaker: narrator
          text: 他说这句话时，口气已经变得亲热又随便。我走到最近的射击孔边往外看。大火只剩暗红的余烬，火光低低贴着地面，难怪他们非要借火把。那五个人聚在通向栅栏的斜坡半腰。一个举着火把，一个跪在人群中，手里的刀刃映着火光和月光，不停变换颜色。其他人全都弯着腰，像是在仔细看他摆弄什么。我还瞧见他手中有一本书，正奇怪书和刀怎么会凑到一块儿，那人已经站起来，带着众人一起朝木屋走来。
        - id: ch01-b04
          speaker: narrator
          text: 他们过来了。
        - id: ch01-b05
          speaker: narrator
          text: 我赶紧回到原处，免得被他们撞见我在偷看。我觉得那样未免有失体面。
        - id: ch01-b06
          speaker: long_john_silver
          text: 来吧，小伙子，让他们来。我的弹药箱里还留着一发呢。
        - id: ch01-b07
          speaker: narrator
          text: 门一开，五个人挤在门里，把一个同伴推到前头。那人每走一步都要犹豫，紧握的右手却一直伸在身前。若不是眼下情势紧张，他这副慢吞吞的样子准会惹人发笑。
        - id: ch01-b08
          speaker: long_john_silver
          text: 过来呀，小伙子，我又不会吃了你。东西拿来吧，你这笨蛋。规矩我懂，不会为难你这个代表。
        - id: ch01-b09
          speaker: narrator
          text: 那海盗得了鼓励，胆子大了些，脚步也快起来。他走到西尔弗跟前，把一样东西从自己的手里递进西尔弗手中，随后更加敏捷地一溜烟退回同伴身边。西尔弗低头看了看收到的东西。
        - id: ch01-b10
          speaker: long_john_silver
          text: 果然是黑券！可这纸是哪儿来的？嘿，瞧瞧你们干的好事！你们居然从《圣经》上割纸，这可太不吉利了。是谁蠢到割坏《圣经》的？
        - id: ch01-b11
          speaker: tom_morgan
          text: 看吧！我早就说了，这么干绝不会有好下场。
        - id: ch01-b12
          speaker: long_john_silver
          text: 这下好啦，你们亲手把大家送上了绞架。到底哪个没脑子的家伙带着《圣经》？
        - id: ch01-b13
          speaker: pirate_deep_voice
          text: 那本《圣经》是迪克带来的。
        - id: ch01-b14
          speaker: long_john_silver
          text: 原来是迪克。那你快祷告去吧，你的好运算是走到头了。
        - id: ch01-b15
          speaker: narrator
          text: 长着黄眼睛的高个子这时插了进来。
        - id: ch01-b16
          speaker: yellow_eyed_pirate
          text: 够了，约翰·西尔弗。全体船员已经正式开会，照规矩把黑券交给了你。你也照规矩把它翻过来，看看写的是什么。看完再说话。
        - id: ch01-b17
          speaker: long_john_silver
          text: 多谢你，乔治。你办正事还是这么麻利，规矩也记得一清二楚，真让我高兴。好吧，让我看看背面到底写了什么。哈，原来是“罢免”！这字写得真漂亮，简直跟印出来的一样。我敢打赌，这是你的笔迹吧，乔治？你在这伙人里越来越像个领头的了，说不定下一任船长就是你呢。劳驾再把火把借我一下，好吗？我这烟斗抽不动了。
        - id: ch01-b18
          speaker: yellow_eyed_pirate
          text: 得了，你再也骗不了我们。你总说自己有趣，可你现在完了。快从酒桶上下来，跟大家一起投票。
        - id: ch01-b19
          speaker: long_john_silver
          text: 你刚才不是还说自己懂规矩吗？你不懂，我可懂。听清楚，现在我仍是你们的船长。我会坐在这里等着，直到你们把所有不满都说出来，再由我一条条回答。在我答话以前，这张黑券连块饼干都不值。等我说完以后，咱们再看谁该下台。
        - id: ch01-b20
          speaker: yellow_eyed_pirate
          text: 你用不着担心，我们早都准备好了。第一，这趟航行让你办得一团糟，你再大胆也不敢否认。第二，你没换回任何东西，就把敌人从这个陷阱里放走了。我不知道他们为什么非出去不可，可谁都看得出，他们一心想走。第三，他们在路上行进时，你不许我们下手。约翰·西尔弗，我们已经看穿你了。你的毛病，就是想从两边都捞到好处。第四，还有眼前这个小子。
        - id: ch01-b21
          speaker: long_john_silver
          text: 你们的不满就只有这些？
        - id: ch01-b22
          speaker: yellow_eyed_pirate
          text: 这还不够？事情叫你办砸了，我们全得吊在绞架上晒成干尸。
    - id: ch02
      title: 西尔弗的申辩
      blocks:
        - id: ch02-b01
          speaker: long_john_silver
          text: 那就听好，这四条我挨个回答。你们说是我毁了这趟航行，对不对？可你们全都知道我原先怎么打算。要是照我的办法来，今天晚上咱们早就在《伊斯帕尼奥拉号》上了。每个人都还活着，身子好好的，肚里塞满上好的葡萄干布丁，宝藏也已经装进了船舱！可到底是谁跟我作对？是谁逼我这个正牌船长提前动手？咱们刚登上岛，才开始跳这场舞，又是谁把黑券递给了我？没错，这场舞确实跳得漂亮，简直像在伦敦的行刑码头，脖子套着绳索跳水手舞。带头的就是安德森、汉兹，还有你，乔治·梅里！当初那伙多管闲事的人，如今只有你还活着。你害惨了我们所有人，现在竟敢厚着脸皮站出来，要抢我的船长位子！老天在上，再荒唐的故事也比不过这一出。
        - id: ch02-b02
          speaker: narrator
          text: 西尔弗停了下来。乔治和那几个刚才还跟他站在一起的同伴全都变了脸色，我知道这番话没有白说。西尔弗擦去额头上的汗。刚才他说得太激烈，声音仿佛连整座木屋也震动起来。
        - id: ch02-b03
          speaker: long_john_silver
          text: 第一条就说到这里！我可以向你们保证，跟你们这群人讲话，真叫我恶心得受不了。你们既没有脑子，也没有记性。我只想知道，你们的母亲把你们养在什么地方，居然肯放你们出海。出海？还自称闯荡江湖的好汉？依我看，你们的本行一定是裁缝！
        - id: ch02-b04
          speaker: tom_morgan
          text: 说下去，约翰。把另外几条也讲给他们听。
        - id: ch02-b05
          speaker: long_john_silver
          text: 另外几条？这帮人可真有出息，是不是？你们只知道航行办砸了，却不知道究竟砸得有多厉害。咱们离绞架已经那么近，我光想着它，脖子都僵了。你们大概见过挂在铁链里的尸首吧？鸟绕着他们飞，水手顺潮经过，还会把他们指给别人看。一个人问：“那是谁？”另一个回答：“那是约翰·西尔弗，我从前跟他很熟。”船继续驶向下一座浮标，身后的铁链还在哗啦哗啦地响。多亏了乔治，还有汉兹、安德森和你们中间这些只会坏事的蠢货，如今咱们每一个人，差不多都走到那一步了。
        - id: ch02-b06
          speaker: long_john_silver
          text: 你们再问第四条，问这个小子怎么办。活见鬼了，他难道不是个人质吗？咱们会蠢到白白糟蹋一个人质？当然不会。他也许就是我们最后的一线生机。你们想杀他？我可不干，伙计们！第三条也有得说。每天都有一位真正念过大学的医生来看你们，这难道还不算好处？你，约翰，脑袋摔破了。还有你，乔治·梅里，六个钟头前还冷得直打哆嗦，直到现在，两只眼睛仍旧黄得像柠檬皮。你们大概还不知道，有一条接应船就快来了吧？可它一定会来，而且不用再等多久。等到了那时候，咱们倒要看看，谁不庆幸手里还留着一个人质。
        - id: ch02-b07
          speaker: long_john_silver
          text: 最后再说第二条。你们问我为什么做那笔交易？当初明明是你们灰心透顶，跪着爬来求我谈的！没错，你们就是跪着来的。要不是我答应，你们早就饿死了。不过这些都不重要。朝那边看看吧，那才是我肯做交易的真正原因！
        - id: ch02-b08
          speaker: narrator
          text: 他把一张纸扔到地板上。我立刻认出，那是船长衣箱底下油布包里的黄纸地图，上面画着三个红十字。医生为什么把它交给西尔弗，我怎么想也想不明白。
        - id: ch02-b09
          speaker: narrator
          text: 地图落到西尔弗手里，我只觉得无法解释。可在那些幸存的叛乱者眼中，它的出现简直叫人不敢相信。他们像猫扑老鼠一样扑过去。地图传过一只手，又被另一只手抢走，几个人争来夺去。查看时，他们不停地咒骂、叫喊，还发出孩子般的笑声。听着那阵动静，你会以为他们不但已经把真正的黄金摸在手里，还带着宝藏平平安安回到了海上。
        - id: ch02-b10
          speaker: pirate_dissenter
          text: 没错，这肯定是弗林特的记号。一个J，一个F，下面再划一道线，线上还打着双套结。他每次都这么标。
        - id: ch02-b11
          speaker: yellow_eyed_pirate
          text: 图倒是漂亮。可咱们连船都没有，找到宝藏又怎么运走？
    - id: ch03
      title: 烤肉架仍是船长
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 西尔弗一下跳起来，一只手撑住墙。
        - id: ch03-b02
          speaker: long_john_silver
          text: 乔治，我现在警告你。你再敢说一句这种无礼话，我就叫你出来，跟你当面决斗！问我怎么运走？我怎么会知道？这话该由你们告诉我。就是你和其他人胡乱插手，才害我丢了那条帆船！可你们这帮该死的东西，连蟑螂那点主意都没有，当然一个字也答不出来。不过，乔治·梅里，你至少可以客客气气地跟我说话，而且非这么说不可。这一点，你给我记牢。
          emotion: angry
        - id: ch03-b03
          speaker: tom_morgan
          text: 这话还算公道。
        - id: ch03-b04
          speaker: long_john_silver
          text: 当然公道！你们把船弄丢了，我把宝藏找回来。到底谁更有本事？现在我不干了！你们爱选谁当船长就选谁，我辞职。
        - id: ch03-b05
          speakers: [dick, tom_morgan, pirate_deep_voice, pirate_dissenter]
          ensemble: chorus
          text: 西尔弗！永远选烤肉架！让烤肉架当船长！
        - id: ch03-b06
          speaker: long_john_silver
          text: 原来你们又唱起这个调子了，是不是？乔治，看来你只好再等一轮了，朋友。你该庆幸我不是个记仇的人，我从来没有那种习惯。好了，伙计们，这张黑券现在还有什么用？眼下不值什么了吧？迪克弄坏了自己的运气，又糟蹋了他的《圣经》，结果也不过如此。
        - id: ch03-b07
          speaker: dick
          text: 这本书总还能拿来亲吻发誓吧？
        - id: ch03-b08
          speaker: narrator
          text: 迪克低声咕哝，显然很怕自己招来的诅咒。
        - id: ch03-b09
          speaker: long_john_silver
          text: 《圣经》少了一块，当然不行。它跟一本歌谣集没两样，再也管不了用了。
        - id: ch03-b10
          speaker: dick
          text: 真管不了用了？那也好，这消息至少有点用。
          emotion: happy
        - id: ch03-b11
          speaker: long_john_silver
          text: 拿着，吉姆。送你一件稀罕东西。
        - id: ch03-b12
          speaker: narrator
          text: 西尔弗把纸扔给了我。它差不多有一枚克朗银币那么大。原来那是书的最后一页，所以一面空白，另一面印着《启示录》中的一两节经文。其中几个字一下刺进我心里：“外面有犬类和杀人者。”印字的一面用木灰涂黑了，灰这时已经开始脱落，把我的手指也弄脏了。空白的一面也用同样的木灰写着“罢免”。直到今天，这件稀罕物还放在我身边。可上面的字迹早已消失得一点不剩，只留下了一道划痕，仿佛有人用大拇指的指甲划过那里。
        - id: ch03-b13
          speaker: narrator
          text: 这一夜的事情到这里就结束了。没过多久，大家轮流喝了一巡，便各自躺下。西尔弗所谓的报复，也不过是让乔治·梅里去站岗，再威胁他，要是不好好值守，就取他的性命。
        - id: ch03-b14
          speaker: narrator
          text: 过了很久，我还是不能合眼。天知道，我心里装了太多事情。那个下午死在我手里的人，我自己眼下万分危险的处境，还有西尔弗正在玩的那场奇怪把戏，全在脑中翻腾。他一只手拢住叛乱者，另一只手拼命去抓每一个可能或不可能的机会，想跟正派人讲和，保住自己那条可怜的性命。他自己倒睡得很安稳，鼾声又响又沉。可他虽然作恶多端，一想到四周阴暗的危险，还有前面等着他的那座耻辱的绞架，我心里竟然替他难过起来。
