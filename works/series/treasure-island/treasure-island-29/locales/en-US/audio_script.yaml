      display_name: Long John Silver
      tts:
        delivery: commanding, quick-witted, and rough-edged
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    dick:
      display_name: Dick
      tts:
        delivery: wary and obedient
        timbre: lean and youthful
        pace: steady
        pitch: medium
