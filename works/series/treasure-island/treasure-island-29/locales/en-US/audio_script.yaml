  chapters:
    - id: ch01
      title: "The Black Spot Again"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The pirates had been holding their council for some time when one of them came back into the house. He gave Silver that same salute, which looked mocking to me, and asked to borrow the torch for a moment. Silver agreed without much fuss. The man went out again, and Silver and I were left together in the dark.
        - id: ch01-b02
          speaker: long_john_silver
          text: "There's a storm brewing, Jim."
        - id: ch01-b03
          speaker: narrator
          text: >-
            By now, Silver spoke to me in an easy, familiar way. I turned toward the nearest loophole and looked outside. The great fire had burned down to a dim bed of embers, so I understood why the men needed a torch. They were gathered halfway down the slope toward the stockade. One held the light. Another knelt in the middle with an open knife, its blade flashing different colors in the moonlight and torchlight. The others bent over to watch him. I could just make out a book in his other hand. How had pirates come by anything so out of place? Before I could guess, the kneeling man stood, and they all started back toward the house.
        - id: ch01-b04
          speaker: narrator
          text: "They're coming."
        - id: ch01-b05
          speaker: narrator
          text: >-
            I moved back to where I had been. I did not want them to catch me watching.
        - id: ch01-b06
          speaker: long_john_silver
          text: >-
            Let them come, lad. Let them come. I've still got one shot left to play.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The door opened. Five men crowded together just inside and shoved one of their number forward. In any other moment, the sight would have been funny. He crept toward Silver one careful step at a time. He hesitated before putting down each foot, but kept his closed right hand stretched out before him.
        - id: ch01-b08
          speaker: long_john_silver
          text: >-
            Come on, lad. I won't eat you. Hand it here, you lubber. I know the rules, and I don't hurt a delegation.
        - id: ch01-b09
          speaker: narrator
          text: >-
            That gave the pirate courage. He hurried the last few steps, passed something from his hand into Silver's, and darted back to the others. Silver looked down at what he had received.
        - id: ch01-b10
          speaker: long_john_silver
          text: >-
            The black spot. Just what I expected. But where'd you get this paper? Wait now. This is bad luck! You've cut it out of a Bible. Which fool cut up a Bible?
        - id: ch01-b11
          speaker: morgan
          text: >-
            There! What did I tell you? I said no good would come of that.
        - id: ch01-b12
          speaker: long_john_silver
          text: >-
            Well, you've done for yourselves now. I reckon every one of you will hang. Which soft-headed lubber brought a Bible?
        - id: ch01-b13
          speaker: first_mutineer
          text: "Dick did."
        - id: ch01-b14
          speaker: long_john_silver
          text: >-
            Dick, was it? Then Dick had better start praying. His luck has run out, and that's the truth.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Then the tall man with the yellow eyes stepped in.
        - id: ch01-b16
          speaker: council_spokesman
          text: >-
            Enough of that, John Silver. This crew gave you the black spot in full council, just as the rules require. Now turn it over, like the rules require, and read what's written there. You can talk after that.
        - id: ch01-b17
          speaker: long_john_silver
          text: >-
            Thank you, George. Always quick about business, and you know every rule by heart. I'm pleased to see it. So what does it say? Ah, "Deposed." That's it, is it? Very neatly written. Looks almost printed. Is that your handwriting, George? You're becoming a leading man in this crew. You'll be captain next, I shouldn't wonder. Now pass me that torch again, will you? My pipe's gone out.
        - id: ch01-b18
          speaker: council_spokesman
          text: >-
            Come now. You can't make fools of us anymore. You may think you're a funny man, but you're finished. Get down from that barrel and help us vote.
        - id: ch01-b19
          speaker: long_john_silver
          text: >-
            I thought you said you knew the rules. Maybe you don't, but I do. I'll wait right here, and remember, I'm still your captain. First you state your complaints, then I answer them. Until you do, that black spot isn't worth a biscuit. Afterward, we'll see.
        - id: ch01-b20
          speaker: council_spokesman
          text: >-
            Don't worry. We've got everything in order. First, you ruined this voyage. You'd have to be bold to deny that. Second, you let the enemy walk out of this trap and gave us nothing for it. I don't know why they wanted out, but they plainly did. Third, you stopped us from attacking them on the march. We know what you're doing, John Silver. You're trying to play both sides. And fourth, there's the boy.
        - id: ch01-b21
          speaker: long_john_silver
          text: "Is that everything?"
        - id: ch01-b22
          speaker: council_spokesman
          text: >-
            It's more than enough. Your bungling will leave every one of us hanging in the sun.
        - id: ch01-b23
          speaker: long_john_silver
          text: >-
            Listen, then. I'll answer all four charges, one at a time. You say I ruined the voyage? Every one of you knows what I wanted to do. If you'd followed my plan, we'd be aboard the Hispaniola this very night. Every man among us would be alive, healthy, and full of good plum duff, with the treasure safe in the hold, by thunder! So who crossed me? Who forced the hand of your lawful captain? Who gave me the black spot the very day we landed and started this whole dance?
        - id: ch01-b24
          speaker: long_john_silver
          text: >-
            A fine dance it's been. I agree with you there. It looks likely to end with a rope at Execution Dock in London. But who began it? Anderson did, and Hands, and you, George Merry! You're the only one of that meddling lot still above ground. And now you've got the nerve to stand there and offer yourself as captain over me. You, the man who sank us all! By the powers, I've never heard a wilder tale.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Silver stopped. One look at George and the other pirates showed me that his words had struck home.
        - id: ch01-b26
          speaker: long_john_silver
          text: >-
            That's my answer to number one. I give you my word, I'm sick of talking to you. You've got no sense and no memory. I can't imagine what kind of mothers let you go to sea. You call yourselves gentlemen of fortune? Tailors would suit you better.
        - id: ch01-b27
          speaker: narrator
          text: >-
            He wiped the sweat from his forehead. He had spoken so fiercely that the whole house seemed to shake with him.
        - id: ch01-b28
          speaker: morgan
          text: "Keep going, John. Answer the rest."
        - id: ch01-b29
          speaker: long_john_silver
          text: >-
            Ah, the rest! A fine set of charges. You say the voyage is ruined. If you understood just how badly you've ruined it, you'd be afraid to breathe. We're so close to the gallows that my neck goes stiff whenever I think of it. Maybe you've seen dead men hanging in chains, with birds circling them and sailors pointing as they pass on the tide. One sailor asks, "Who's that up there?" Another answers, "Why, that's John Silver. I knew him well." Then the chains keep rattling behind you as your boat moves on toward the next buoy.
        - id: ch01-b30
          speaker: long_john_silver
          text: >-
            That's where every mother's son of us is headed, all thanks to George, Hands, Anderson, and the rest of you ruinous fools. And you want an answer about charge number four, the boy? Isn't he a hostage? Are we going to throw away a hostage? Not us. Jim might be our last chance. Kill the boy? Not me, mates.
        - id: ch01-b31
          speaker: long_john_silver
          text: >-
            Now for number three. You may think it's nothing to have a real college doctor visit every day. You there, John, with your broken head. And you, George Merry, shaking with fever less than six hours ago, with eyes as yellow as lemon peel even now. Maybe you didn't know another ship is coming. Well, one is, and it won't be long. Then we'll see who's glad to have a hostage.
        - id: ch01-b32
          speaker: long_john_silver
          text: >-
            As for number two, you want to know why I made that bargain? You came crawling to me on your knees and begged me to make it. You were so beaten down you'd have starved if I hadn't. But never mind that. Look there. That's why!
        - id: ch01-b33
          speaker: narrator
          text: >-
            Silver threw a sheet of paper onto the floor. I knew it the instant I saw it. It was the yellow chart with three red crosses, the one I had found inside the oilcloth at the bottom of the captain's chest. Why had the doctor given it to Silver? I could not begin to imagine.
        - id: ch01-b34
          speaker: narrator
          text: >-
            I was puzzled, but the surviving mutineers could hardly believe their eyes. They pounced on the chart like cats on a mouse. It flew from hand to hand as they snatched it away from one another and studied every mark. They swore, shouted, and laughed like children. To hear them, you would have thought they were already touching Flint's gold. More than that, you would have thought the treasure was safely aboard and they were out at sea with it.
        - id: ch01-b35
          speaker: first_mutineer
          text: >-
            Yes, that's Flint's mark, sure enough. J. F., with the line underneath and a clove hitch. That's how he always signed it.
        - id: ch01-b36
          speaker: council_spokesman
          text: >-
            Very nice. But how do we carry the treasure away when we haven't got a ship?
        - id: ch01-b37
          speaker: narrator
          text: >-
            Silver sprang up and braced one hand against the wall.
        - id: ch01-b38
          speaker: long_john_silver
          text: >-
            I'm warning you, George. Give me one more bit of that mouth, and I'll call you out and fight you. How do we get away? How should I know? You ought to answer that. You and the rest lost my schooner by interfering with me, curse you! But you can't answer. You haven't got as much invention as a cockroach. You can speak civilly, though, George Merry, and you will.
          emotion: angry
        - id: ch01-b39
          speaker: morgan
          text: "That's fair enough."
        - id: ch01-b40
          speaker: long_john_silver
          text: >-
            Fair? Of course it is. You lost the ship, and I found the treasure. Which of us is the better man? And now I resign, by thunder! Elect anyone you please as captain. I'm finished with the job.
        - id: ch01-b41
          speakers: [morgan, dick, first_mutineer, second_mutineer]
          ensemble: chorus
          text: >-
            Silver! Barbecue forever! Barbecue for captain!
        - id: ch01-b42
          speaker: long_john_silver
          text: >-
            So that's your tune now, is it? George, my friend, you'll have to wait for another turn. Lucky for you I'm not a vengeful man. Never have been. And what about this black spot, shipmates? It's not much use now, is it? Dick crossed his luck and spoiled his Bible. That's about all it accomplished.
        - id: ch01-b43
          speaker: dick
          text: >-
            We can still kiss the book when we swear on it, can't we?
        - id: ch01-b44
          speaker: narrator
          text: >-
            Dick growled the question, plainly worried about the curse he had brought on himself.
        - id: ch01-b45
          speaker: long_john_silver
          text: >-
            A Bible with a piece cut out? No. It won't bind an oath any better than a songbook.
        - id: ch01-b46
          speaker: dick
          text: >-
            It won't? Well, that's good news too!
          emotion: happy
        - id: ch01-b47
          speaker: long_john_silver
          text: >-
            Here, Jim. Take this curiosity.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Silver tossed me the paper. It was about the size of a crown coin. One side was blank because it had been the last leaf of the Bible. The other held a verse or two from Revelation. Among the printed words, one line struck me especially hard: "Outside are dogs and murderers." They had blackened that printed side with wood ash. The ash was already coming loose and staining my fingers. On the blank side, they had used the same ash to write one word, misspelled as "Depposed."
        - id: ch01-b49
          speaker: narrator
          text: >-
            I still have that strange paper beside me today. The years have erased every trace of the ashy writing. Nothing remains except one small scratch, the sort a man might make across the paper with his thumbnail.
        - id: ch01-b50
          speaker: narrator
          text: >-
            That ended the night's business. Soon afterward, the pirates shared a round of drinks, and we lay down to sleep. Silver took no greater revenge than ordering George Merry to stand guard and threatening to kill him if he failed in his duty.
        - id: ch01-b51
          speaker: narrator
          text: >-
            It was a long time before I could close my eyes. Heaven knows I had enough to think about. There was the man I had killed that afternoon. There was my own terrible danger. And most of all, there was the strange game Silver was playing before my eyes. With one hand, he held the mutineers together. With the other, he grabbed at every possible and impossible way to make peace with my friends and save his wretched life.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Silver himself slept peacefully and snored aloud. Yet wicked as he was, my heart ached for him. Dark dangers were closing around him on every side, and if they caught him, a shameful death on the gallows waited ahead.
