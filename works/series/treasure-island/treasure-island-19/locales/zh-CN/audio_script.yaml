audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    ben_gunn:
      display_name: 本·冈恩
      tts:
        delivery: 神经兮兮又自鸣得意，话多而急，藏着孤岛生活留下的不安
        timbre: 干涩粗哑的成年男声
        pace: 忽快忽慢，重要字眼反复强调
        pitch: 中高
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 冷静机敏，带着温和而含蓄的幽默
        timbre: 温厚清晰的中年男声
        pace: 沉稳从容
        pitch: 中低
    captain_smollett:
      display_name: 斯摩莱特船长
      tts:
        delivery: 威严简短，命令清楚有力，危急中仍不失冷静
        timbre: 坚实粗粝的成年男声
        pace: 利落紧凑
        pitch: 中低
    sentry:
      display_name: 哨兵
      tts:
        delivery: 警觉直接，意外来临时脱口而出
        timbre: 清楚有力的成年男声
        pace: 短促明快
        pitch: 中
  chapters:
    - id: ch01
      title: 本·冈恩的口信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 本·冈恩一看见那面旗，马上停住脚，一把拉住我的胳膊，坐了下来。
        - id: ch01-b02
          speaker: ben_gunn
          text: 瞧，那边准是你的朋友。
        - id: ch01-b03
          speaker: narrator
          text: 我说，那更可能是叛徒。
        - id: ch01-b04
          speaker: ben_gunn
          text: 那面旗？不可能！这种地方，除了干咱们这行的好汉，根本不会有别人靠岸。要是西尔弗占了那里，他早把海盗旗挂起来了。那准是你的朋友。他们还打过一仗，我看是你的朋友赢了。现在他们上了岸，守着弗林特许多年前造的老木寨。弗林特才真是有脑子的人！只要不算朗姆酒，谁也比不上他。他一个人都不怕，只有西尔弗不一样。西尔弗那人，可真有派头。
        - id: ch01-b05
          speaker: narrator
          text: 我告诉他，就算猜对了，我也更该赶去和朋友会合。
        - id: ch01-b06
          speaker: ben_gunn
          text: 别忙，伙计，你不能去。你是个好孩子，可说到底只是个孩子。本·冈恩如今可机灵着呢。你要去的地方，拿朗姆酒来引我也不成。除非先让我见到你那位天生的绅士，请他凭名誉向我作保。你见了他，可别忘记说，要多得多的信任。就这么说，再掐他一下。
        - id: ch01-b07
          speaker: narrator
          text: 他摆出一副聪明透顶的神气，第三次掐了我一把。
        - id: ch01-b08
          speaker: ben_gunn
          text: 等他们要找本·冈恩，就到今天你找到我的地方。来的人手里得拿一样白东西，还必须独自来。你还要告诉他们，本·冈恩自有他的道理。
        - id: ch01-b09
          speaker: narrator
          text: 我问他，是不是有件事要提议，想见乡绅或者医生，还在原处等着。除此以外，还有没有别的？
        - id: ch01-b10
          speaker: ben_gunn
          text: 还有时间。你得说，从正午观测时分起，到六响钟左右。
        - id: ch01-b11
          speaker: narrator
          text: 我说记住了，又问自己现在能不能走。
        - id: ch01-b12
          speaker: ben_gunn
          text: 你不会忘吧？要多得多的信任，还有本·冈恩自有他的道理。这一句顶要紧，咱们可是男人对男人说话。好了，我看你可以走了。可是吉姆，万一见到西尔弗，你不会出卖本·冈恩吧？就算用野马来拽，你也不会吐出一个字，对不对？要是那些海盗在岸上扎营，你说到了明早，会不会又多出几个寡妇？
        - id: ch01-b13
          speaker: narrator
          text: 一声炮响猛地截断了他的话。炮弹撕开树林，落进离我们不到一百码的沙地。眨眼之间，我俩各自拔腿，朝不同的方向逃去。
    - id: ch02
      title: 炮火之后
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 此后足足一个钟头，炮声一次次震动全岛，炮弹不断撞断林木。我从一个藏身处逃到另一个藏身处，总觉得那些可怕的炮弹正在追着我不放。炮击快结束时，我才重新有了几分胆量。不过，木寨方向落弹最密，我仍不敢靠近，只好向东绕了一大圈，最后伏低身子，悄悄钻进海岸边的树林。
        - id: ch02-b02
          speaker: narrator
          text: 太阳刚刚落下。海风吹进树林，枝叶一阵阵翻滚，沙沙作响，也吹皱了锚地灰蒙蒙的水面。潮水已经退得很远，大片大片的沙滩裸露出来。白天的热气一消散，冷风隔着外衣也冻得我浑身发抖。
        - id: ch02-b03
          speaker: narrator
          text: “伊斯帕尼奥拉号”还停在原来的地方，桅顶果然飘着快乐罗杰，那面黑色海盗旗。我正望着，一道红光又闪了起来，紧接着炮声轰鸣，回声撞遍四周。又一颗圆炮弹呼啸着飞过空中。这是最后一炮。
        - id: ch02-b04
          speaker: narrator
          text: 我趴着看了许久。炮击之后，海盗们又忙乱起来。木寨附近的沙滩上，有人挥着斧头拆东西，后来我才知道，他们拆的是我们那条可怜的划艇。河口附近的林子里燃着大火，一条小艇在火堆和大船之间来回穿梭。那些水手先前还阴沉着脸，现在却边划边像孩子一样叫喊。光听声音就知道，朗姆酒已经起了作用。
        - id: ch02-b05
          speaker: narrator
          text: 末了，我觉得可以回木寨了。当时我已经走到锚地东边那条低矮沙嘴的深处。沙嘴环着锚地，退到半潮时会跟骷髅岛连起来。我刚站起身，就看见更远处有块孤零零的岩石，从矮灌木间高高耸起，白得出奇。我猜那就是本·冈恩说的白岩石。将来若需要一条小船，我便知道该到哪里找了。
        - id: ch02-b06
          speaker: narrator
          text: 我沿着树林边缘绕回木寨背后，也就是朝海的一侧。忠诚的伙伴们很快发现了我，热情地把我迎了进去。
    - id: ch03
      title: 木屋里的夜晚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我很快讲完自己的经历，便打量起这座木屋。屋顶、墙壁和地板，全由没削整过的松树圆木搭成。有几处地板比沙地高出一尺到一尺半。门外有座门廊，廊下的小泉涌进一个古怪的水池。那其实是一口船上用的大铁锅，锅底被敲掉，整个锅照船长的说法，沉到吃水线，埋进了沙里。
        - id: ch03-b02
          speaker: narrator
          text: 屋里除了一副木架，几乎空空如也。一个角落铺着石板，算是炉床，旁边放着一只生锈的旧铁筐，用来盛火。山冈斜坡和木寨里的树，全被砍去盖屋了。留在地上的树桩一排排伸开。只要看上一眼，也知道这里从前有过一片多么挺拔茂盛的树林，后来却为了这座木屋全毁掉了。
        - id: ch03-b03
          speaker: narrator
          text: 树一砍光，大部分泥土不是让雨冲走，就是被流沙埋住。只有小溪从铁锅流下的地方还绿着，沙间长着厚苔藓、蕨草和矮小的匍匐灌木。木寨四周紧贴着森林，近得不利于防守。陆地那边都是高大茂密的冷杉，靠海的一边还混生着许多常青栎。
        - id: ch03-b04
          speaker: narrator
          text: 寒冷的晚风从木屋每条缝里呼啸着钻进来，细沙不停落到地板上。我们眼里有沙，牙缝里有沙，晚饭里也有沙。铁锅底的泉水中，沙粒上下翻舞，活像一锅刚要煮沸的麦粥。烟囱只是屋顶上的一个方洞，只有一点烟能飘出去，其余全在屋里打转，呛得我们不停咳嗽，眼泪直流。
        - id: ch03-b05
          speaker: narrator
          text: 再看看我们这些人，情形也好不到哪里去。新加入的格雷在逃离叛徒时脸上挨了一刀，这会儿还缠着绷带。可怜的老汤姆·雷德鲁斯也没有下葬。他僵硬地躺在墙边，身上盖着英国国旗。这些事若让人闲坐着想，大家准会一个接一个灰心丧气。可斯摩莱特船长从来不是让人闲下来的性子。
        - id: ch03-b06
          speaker: narrator
          text: 船长召集所有人，分成两班值守。医生、格雷和我一班，乡绅、亨特和乔伊斯一班。大家已经筋疲力尽，他还是派两个人去捡柴，另两个人挖雷德鲁斯的墓穴。医生负责做饭，我守在门口。船长自己不停走动，一面鼓舞大家，一面在哪里需要就去哪里帮忙。
        - id: ch03-b07
          speaker: narrator
          text: 医生不时走到门边透气，也让快被烟熏瞎的眼睛歇一歇。每回出来，他总要跟我说上几句话。
        - id: ch03-b08
          speaker: doctor_livesey
          text: 斯摩莱特这个人比我强。吉姆，我这么说，分量可不轻。
        - id: ch03-b09
          speaker: narrator
          text: 后来他又出来了一次，先沉默片刻，再歪着头看我。
        - id: ch03-b10
          speaker: doctor_livesey
          text: 这个本·冈恩，还算是个正常人吗？
        - id: ch03-b11
          speaker: narrator
          text: 我说自己也不知道，不敢肯定他是不是还清醒。
        - id: ch03-b12
          speaker: doctor_livesey
          text: 既然还拿不准，那他就是清醒的。一个人在荒岛上咬了三年指甲，哪还能指望他看起来跟你我一样正常？人性经不起这个。对了，你说他特别想吃奶酪，是不是？
        - id: ch03-b13
          speaker: narrator
          text: 我告诉医生，没错，本·冈恩想吃的就是奶酪。
        - id: ch03-b14
          speaker: doctor_livesey
          text: 那你瞧，吃东西挑剔也有好处。你见过我的鼻烟盒，也从没见我吸鼻烟，对吧？因为那里面装的是一小块帕尔马干酪。那是意大利产的奶酪，很有营养。现在，它归本·冈恩了！
    - id: ch04
      title: 我们的两个盟友
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 吃晚饭以前，我们先把老汤姆埋进沙地。大家脱下帽子，站在墓旁，让晚风吹了一阵。捡回来的柴已经很多，船长却仍嫌不够。他摇着头说，明天还得接着干，动作也得快得多。后来我们吃了咸猪肉，每人喝下一大杯掺水的白兰地。三位首领聚在屋角，商量接下来怎么办。
        - id: ch04-b02
          speaker: narrator
          text: 他们其实已经快想不出办法了。存粮少得可怜，援兵又远没到来。照这样下去，接应我们的人还没出现，饥饿就会先逼着我们投降。三个人商量到最后，只认定一个希望，那就是尽量消灭海盗，逼他们降下旗帜，或者让他们驾着“伊斯帕尼奥拉号”逃走。
        - id: ch04-b03
          speaker: narrator
          text: 海盗原来有十九人，如今只剩十五人，还有两个负了伤。至少一个伤得很重，就是大炮旁边中枪的那个人。他即使没死，也差不多了。只要有机会开枪，我们就得抓住，同时还要万分小心，先保住自己的命。除此以外，我们还有两个得力盟友，一个是朗姆酒，一个是岛上的气候。
        - id: ch04-b04
          speaker: narrator
          text: 两边隔着大约半英里，我们还是能听见海盗直到深夜都在吼叫唱歌。这就是朗姆酒。至于气候，医生拿自己的假发打赌，那群人扎营在沼泽里，手头又没药，不出一星期，准有一半病倒。
        - id: ch04-b05
          speaker: doctor_livesey
          text: 所以，只要我们没先让他们一枪一个全打死，他们很快就会巴不得收拾东西，逃回纵帆船上。那终究是条船，我猜他们还能重新去当海盗。
        - id: ch04-b06
          speaker: captain_smollett
          text: 这是我头一回丢掉一条船。
    - id: ch05
      title: 休战旗
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我累得要命。躺下以后翻来覆去许久，才终于睡着。可一睡着，我就像一截木头，什么也不知道了。
        - id: ch05-b02
          speaker: narrator
          text: 后来，一阵突然的喧闹和说话声把我惊醒。睁眼一看，其他人早已起床，连早饭都吃完了。他们还出去捡了不少柴，把昨天的柴堆又添了原来的一半那么高。
        - id: ch05-b03
          speaker: sentry
          text: 有人举着休战旗！
        - id: ch05-b04
          speaker: narrator
          text: 紧接着，我又听见一声惊讶的叫喊。
        - id: ch05-b05
          speaker: sentry
          text: 是西尔弗，他亲自来了！
          emotion: surprised
        - id: ch05-b06
          speaker: narrator
          text: 一听说西尔弗亲自来了，我猛地跳起来，一路使劲揉着眼睛，飞快跑到墙上的射击孔前。
