  chapters:
    - id: ch01
      title: "XIX Narrative Resumed by Jim Hawkins: The Garrison in the Stockade"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The moment Ben Gunn saw the colors flying above the stockade, he stopped short. He caught me by the arm and sat down.
        - id: ch01-b02
          speaker: ben_gunn
          text: >-
            There they are. Those are your friends, sure enough.
        - id: ch01-b03
          speaker: jim_hawkins
          text: >-
            I think the mutineers are much more likely.
        - id: ch01-b04
          speaker: ben_gunn
          text: >-
            Them? Not a chance! Nobody comes to a place like this except gentlemen of fortune, and Silver would be flying the Jolly Roger. You can be certain of that. No, those are your friends. There's been fighting too, and I'd say your side won. Now they've come ashore to Flint's old stockade. Flint had a head on him, he did. Except for the rum, there was never another man like him. He feared nobody. Well, nobody but Silver. Silver always had such fine manners.
        - id: ch01-b05
          speaker: jim_hawkins
          text: >-
            Maybe you're right. Then I have even more reason to hurry over and join them.
        - id: ch01-b06
          speaker: ben_gunn
          text: >-
            No, mate, not yet. You're a good boy, unless I've judged you wrong, but you're still only a boy. Ben Gunn knows how to be careful. Not even rum could get me to go where you're going. First I must see your born gentleman and have his word of honor. Remember exactly what to tell him. Say, “He wants a precious sight more confidence.” Then give him a little pinch, like this.
        - id: ch01-b07
          speaker: narrator
          text: >-
            For the third time, he pinched me, wearing the same clever look.
        - id: ch01-b08
          speaker: ben_gunn
          text: >-
            When Ben Gunn is wanted, Jim, you know where to find him. Right where you found him today. Whoever comes must carry something white and come alone. And tell them this too. Say, “Ben Gunn has reasons of his own.”
        - id: ch01-b09
          speaker: jim_hawkins
          text: >-
            I think I understand. You have an offer to make. You want to meet the squire or the doctor, and they can find you where I found you. Is that everything?
        - id: ch01-b10
          speaker: ben_gunn
          text: >-
            But when, you ask? From about noon observation until six bells.
        - id: ch01-b11
          speaker: jim_hawkins
          text: >-
            Good. Can I leave now?
        - id: ch01-b12
          speaker: ben_gunn
          text: >-
            You won't forget, will you? “A precious sight,” and “reasons of his own.” The reasons are the mainstay, mind you, just between one man and another. Well, then, I suppose you can go. But Jim, if you meet Silver, you won't sell out Ben Gunn, will you? Wild horses couldn't drag the secret from you. That's what you'll say. And if those pirates camp on shore tonight, there'll be widows by morning. What else could happen?
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: >-
            He still had hold of me when a cannon boomed. A ball ripped through the trees and struck the sand less than a hundred yards away. In the next instant, Ben and I were racing off in opposite directions.
        - id: ch01-b14
          speaker: narrator
          text: >-
            For the next hour, cannon fire kept shaking the island, and shot crashed again and again through the woods. I darted from one hiding place to another. Wherever I went, those terrifying balls seemed to be hunting me. Near the end of the bombardment, I began to find my courage again. I still didn't dare approach the stockade, because most of the shots were falling there. Instead, I made a wide circle to the east and crept down among the trees along the shore.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The sun had just gone down. A sea breeze tossed the branches and wrinkled the gray water in the anchorage. The tide was far out, leaving broad stretches of bare sand. After the day's heat, the evening air chilled me right through my jacket.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The Hispaniola was still at anchor. And there, sure enough, the black Jolly Roger flew from her peak. As I watched, I saw another red flash. The cannon's report sent echoes rattling across the island, and one last round shot whistled through the air. That was the end of the bombardment.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I stayed hidden for a while and watched the activity after the attack. Near the stockade, men on the beach were hacking something apart with axes. Later, I learned it was our poor jolly boat. Farther away, near the river mouth, a huge fire glowed among the trees. One of the gigs traveled back and forth between the fire and the ship. The men who had looked so gloomy before were now yelling over their oars like children. Something in their voices told me they had been drinking rum.
        - id: ch01-b18
          speaker: narrator
          text: >-
            At last, I decided it was safe to head back toward the stockade. By then I had gone far down the low, sandy point that closes off the east side of the anchorage and joins Skeleton Island when the tide is halfway out. As I stood, I noticed a single tall rock rising from the low bushes farther along the point. Its color was a strange, bright white.
        - id: ch01-b19
          speaker: narrator
          text: >-
            I wondered if that was the white rock Ben Gunn had mentioned. If we ever needed his boat, I would know where to look.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I kept to the edge of the woods until I reached the back of the stockade, on the side nearest the shore. A moment later, our loyal party welcomed me warmly.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I quickly told them everything that had happened. Then I looked around my new shelter. The log house was built entirely from rough pine trunks. They made up the roof, the walls, and even the floor. In some places, that floor stood a foot or more above the sand. A porch covered the doorway. Beneath it, the little spring bubbled into a very unusual basin. Someone had knocked the bottom out of a huge iron ship's kettle and sunk it firmly into the sand, or “down to her bearings,” as the captain put it.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Almost nothing remained inside but the house's bare frame. In one corner, a flat stone served as a hearth, with an old rusty iron basket to hold the fire.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The builders had cleared the whole slope and everything inside the stockade to get timber for the house. The stumps showed that a magnificent grove once stood there. After the trees were cut, most of the earth had washed away or disappeared under drifting sand. Only beside the tiny stream from the kettle did moss, ferns, and low creeping plants still grow green.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Thick woods rose close around the fence, much too close for good defense, as our men pointed out. Fir trees covered the landward side. Toward the sea, many live oaks grew among them.
        - id: ch01-b25
          speaker: narrator
          text: >-
            The cold breeze whistled through every crack in the rough walls and constantly sprinkled fine sand across the floor. Sand got into our eyes, our teeth, and our supper. It danced in the spring at the bottom of the kettle like porridge just starting to boil. Our chimney was only a square hole cut in the roof. Very little smoke found its way through. The rest curled around the room until we were coughing and our eyes were streaming.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Gray, our newest man, wore a bandage around his face where the mutineers had cut him as he escaped. And poor old Tom Redruth still had not been buried. He lay stiff against the wall beneath the Union Jack.
        - id: ch01-b27
          speaker: narrator
          text: >-
            If we had been left with nothing to do, every one of us would have sunk into misery. Captain Smollett would never allow that. He called everyone together and split us into two watches. The doctor, Gray, and I made up one. The squire, Hunter, and Joyce made up the other.
        - id: ch01-b28
          speaker: narrator
          text: >-
            We were all exhausted, but the captain sent two men to gather firewood and two more to dig Redruth's grave. He made the doctor our cook and posted me as sentry at the door. Then he moved from job to job, helping wherever he was needed and keeping everyone's spirits up.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Every so often, the doctor came to the doorway for fresh air and to rest his eyes from the smoke. Each time, he had something to say to me.
        - id: ch01-b30
          speaker: doctor_livesey
          text: >-
            That Captain Smollett is a better man than I am, Jim. Coming from me, that means quite a lot.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The next time he came out, he stood quietly for a moment. Then he tilted his head and studied me.
        - id: ch01-b32
          speaker: doctor_livesey
          text: >-
            This Ben Gunn of yours. Is he really a man?
        - id: ch01-b33
          speaker: jim_hawkins
          text: >-
            I don't know, sir. I'm not even sure he's in his right mind.
        - id: ch01-b34
          speaker: doctor_livesey
          text: >-
            If you're not sure, then he probably is. A man who's spent three years biting his nails on a deserted island can't be expected to look as sane as you or me. Human beings aren't made that way. You said he was longing for cheese, didn't you?
        - id: ch01-b35
          speaker: jim_hawkins
          text: >-
            Yes, sir. Cheese.
        - id: ch01-b36
          speaker: doctor_livesey
          text: >-
            Well, Jim, here's proof that being particular about food can do some good. You've seen my snuffbox, haven't you? But you've never seen me take snuff. That's because I keep a piece of Parmesan in it instead. It's an Italian cheese, and very nourishing. That cheese is for Ben Gunn.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Before supper, we buried old Tom in the sand. For a little while, we stood around his grave with our heads bare in the wind.
        - id: ch01-b38
          speaker: narrator
          text: >-
            We had collected plenty of firewood, though still not enough to satisfy the captain. He shook his head and said we would have to work much faster at it tomorrow. After we ate our pork and each drank a strong glass of brandy grog, our three leaders gathered in a corner to decide what to do next.
        - id: ch01-b39
          speaker: narrator
          text: >-
            They could see no easy way out. Our supplies were so low that hunger would force us to surrender long before help could arrive. They decided our best hope was to bring down the number of buccaneers until the survivors either lowered their flag or escaped aboard the Hispaniola.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The pirates had started with nineteen men. Now only fifteen remained fit, and two more were wounded. At least one of those two, the man shot beside the cannon, was badly hurt and might already be dead. Whenever we had a safe chance to fire on them, we must take it. But we had to guard our own lives with the greatest care.
        - id: ch01-b41
          speaker: narrator
          text: >-
            We also had two powerful allies on our side. One was rum. The other was the island's climate.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The pirates were half a mile away, yet we could hear them roaring and singing late into the night. As for the climate, they had camped in the marsh without any medicine. The doctor swore that half of them would be flat on their backs within a week.
        - id: ch01-b43
          speaker: doctor_livesey
          text: >-
            So, unless they shoot every one of us first, they'll soon be eager to pack themselves onto the schooner and leave. A ship is still a ship, after all. I suppose they can always go back to piracy.
        - id: ch01-b44
          speaker: captain_smollett
          text: >-
            It will be the first ship I've ever lost.
        - id: ch01-b45
          speaker: narrator
          text: >-
            I was completely worn out, as you can imagine. Even then, I tossed for a long time before sleep came. Once it did, I slept as heavily as a log.
        - id: ch01-b46
          speaker: narrator
          text: >-
            By the time a commotion and the sound of voices woke me, everyone else had been up for hours. They had eaten breakfast and made the firewood pile half again as large.
        - id: ch01-b47
          speaker: lookout
          text: >-
            Flag of truce!
          emotion: surprised
        - id: ch01-b48
          speaker: lookout
          text: >-
            It's Silver himself!
          emotion: surprised
        - id: ch01-b49
          speaker: narrator
          text: >-
            I sprang up at once. Still rubbing my eyes, I ran to a loophole in the wall.
