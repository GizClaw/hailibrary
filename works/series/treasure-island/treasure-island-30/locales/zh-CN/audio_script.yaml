audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 吉姆·霍金斯
      tts:
        delivery: 少年亲历者般坦率生动，紧张中保留敏锐与勇气
        timbre: 清澈的少年声线
        pace: 明快，描写险境时张弛分明
        pitch: 中高
    long_john_silver:
      display_name: 高个子约翰·西尔弗
      tts:
        delivery: 圆滑老练又暗藏凶狠，海员土话说得亲热而富有煽动力
        timbre: 浑厚粗哑的成年男声
        pace: 从容多变，威胁时骤然加重
        pitch: 中低
    doctor_livesey:
      display_name: 利弗西医生
      tts:
        delivery: 镇定正直，措辞清楚利落，讥讽时仍保持从容
        timbre: 清朗沉稳的成年男声
        pace: 从容适中，紧要处果断加快
        pitch: 中
    tom_morgan:
      display_name: 汤姆·摩根
      tts:
        delivery: 老水手般粗野冲动，底气不足时仍强撑着
        timbre: 苍老干涩的男声
        pace: 急促
        pitch: 中低
    yellow_eyed_pirate:
      display_name: 乔治·梅里
      tts:
        delivery: 表面恭敬、实则强硬，照着海盗规矩咬字说话
        timbre: 阴沉偏冷的男声
        pace: 不紧不慢
        pitch: 中低
    unnamed_pirate:
      display_name: 一名海盗
      tts:
        delivery: 粗声粗气，面对医生时收敛而谨慎
        timbre: 沙哑的成年男声
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 清晨来客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 林边忽然传来一声清亮有力的呼喊，把木屋里所有人都惊醒了。连靠着门柱睡倒的哨兵也一下挺起身来。
        - id: ch01-b02
          speaker: doctor_livesey
          text: 木屋里的人听着，医生来了！
        - id: ch01-b03
          speaker: narrator
          text: 果然是利弗西医生。听见他的声音，我自然高兴，可心里还有另一番滋味。我偷偷出走，违抗命令，结果落进了什么人中间，又被多少危险包围。想到这些，我羞愧得简直不敢看他的脸。天才蒙蒙亮，他显然摸黑就动身了。我跑到射击孔前，看见他站在林间缓缓流动的雾里，雾气一直没到小腿。先前西尔弗也曾这样站在那里。
        - id: ch01-b04
          speaker: long_john_silver
          text: 哟，原来是您啊，医生！祝您一早顺心。您来得可真早，俗话说得好，早起的鸟儿才有口粮吃嘛。乔治，别再赖着了，小子，快起来搭把手，扶利弗西医生翻过船帮。您的病人都好着呢，个个精神十足，快快活活！
        - id: ch01-b05
          speaker: narrator
          text: 西尔弗一眨眼就彻底清醒了，脸上也立刻堆满和气的笑容。他拄着拐杖站在小丘顶上，把拐杖夹在胳膊下面，另一只手扶住木屋墙壁，嘴里说个不停。无论声音、举止还是神情，他简直又成了从前那个老约翰。
        - id: ch01-b06
          speaker: long_john_silver
          text: 先生，我们还给您留了一桩惊喜。这儿多了个小客人，一个新房客！嘿，嘿！他身子绷得结实，活像一把小提琴。昨晚他就挨着老约翰睡，像个押货大副似的，一觉睡到天亮。我俩可是船头抵着船头啊。
        - id: ch01-b07
          speaker: narrator
          text: 医生翻过栅栏，走到西尔弗近前。一开口，他的声音就变了。
        - id: ch01-b08
          speaker: doctor_livesey
          text: 不会是吉姆吧？
          emotion: surprised
        - id: ch01-b09
          speaker: long_john_silver
          text: 正是那个吉姆，一点没变。
        - id: ch01-b10
          speaker: narrator
          text: 医生站住了，沉默了好几秒，才重新迈开脚步。
        - id: ch01-b11
          speaker: doctor_livesey
          text: 好吧，先办正事，再叙私情。西尔弗，这话你也一定赞成。让我先看看你的病人。
        - id: ch01-b12
          speaker: narrator
          text: 医生进了木屋，只冷冷朝我点一下头，便开始诊病。他一定知道，自己身处这群背信弃义的恶魔中间，性命只悬在一根头发丝上，可他脸上没有一丝惧色。他照样和病人有说有笑，仿佛只是在一个安静的英国家庭里照例出诊。那份从容也感染了海盗。他们在医生面前一个个规规矩矩，仿佛什么都没发生，他还是船医，他们也还是船上忠心的水手。
        - id: ch01-b13
          speaker: doctor_livesey
          text: 朋友，你恢复得不错。要说谁是从鬼门关前捡回了一条命，那就是你了，你这颗脑袋准是铁打的。乔治，你怎么样？瞧你这脸色，可真够漂亮的。老兄，你的肝都快翻过来了。药吃了吗？伙计们，他究竟把药吃下去没有？
        - id: ch01-b14
          speaker: tom_morgan
          text: 吃了，先生，他确实吃了。
        - id: ch01-b15
          speaker: doctor_livesey
          text: 我既然当了叛乱者的医生，或者照我更喜欢的说法，当了监狱医生，就得顾全自己的名誉。愿上帝保佑乔治国王。我可不能让国王和绞架少掉任何一个该得的人。
        - id: ch01-b16
          speaker: narrator
          text: 海盗们互相望了望，谁也没敢回敬这句挖苦。
        - id: ch01-b17
          speaker: unnamed_pirate
          text: 先生，迪克不大舒服。
        - id: ch01-b18
          speaker: doctor_livesey
          text: 是吗？迪克，过来让我看看舌头。好家伙，这舌头能把法国人吓跑！他当然不会舒服，又发烧了。
        - id: ch01-b19
          speaker: tom_morgan
          text: 我就说吧，这是糟蹋《圣经》招来的。
        - id: ch01-b20
          speaker: doctor_livesey
          text: 照你的说法，这倒真有个原因。只不过，病是你们蠢得没边招来的。你们连干净空气和毒气都分不清，也不知道哪里是干地，哪里是又脏又毒的烂泥潭。照我的诊断，当然这只是我的看法，你们非得大吃苦头，才能把疟疾赶出身体。居然在沼泽里扎营！西尔弗，我真没想到。总的说来，你比他们聪明得多，可你连最起码的卫生常识都不懂。
        - id: ch01-b21
          speaker: narrator
          text: 医生挨个给他们服药，又留下各人的医嘱。那帮双手沾血的叛乱者和海盗，竟像慈善学校里的孩子一样，谦恭地听他说话，乖乖把难喝的药咽下去。看着他们那副样子，实在叫人发笑。
        - id: ch01-b22
          speaker: doctor_livesey
          text: 今天就看到这里。现在请让我跟那个孩子谈一谈。
        - id: ch01-b23
          speaker: narrator
          text: 医生说着，漫不经心地朝我这边点了点头。乔治正站在门边，那口难喝的药弄得他又吐又咳。一听医生要单独和我说话，他立刻停止咳嗽，猛地转过身来，脸一下涨得通红，还破口骂了一声。
        - id: ch01-b24
          speaker: yellow_eyed_pirate
          text: 我不答应！
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: 西尔弗一掌拍响酒桶，像狮子一样扫视众人。
        - id: ch01-b26
          speaker: long_john_silver
          text: 安静！医生，我也正有这个意思，知道您很喜欢这孩子。您的好意我们都感激不尽。您也亲眼看见了，大伙儿信得过您，您开的药，我们喝得像朗姆酒一样痛快。我想出了一个两边都能接受的办法。霍金斯，你虽然出身贫寒，却是个真正的年轻绅士。你肯拿年轻绅士的名誉担保，绝不解开缆绳，趁机逃走吗？
        - id: ch01-b27
          speaker: narrator
          text: 我立刻发了誓。
        - id: ch01-b28
          speaker: long_john_silver
          text: 那么医生，请您先走到栅栏外面。我把孩子带到里面来，你们隔着木桩聊。先生，再会，也替我们向乡绅和斯莫列特船长问好。
    - id: ch02
      title: 栅栏边的交易
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 医生一出木屋，先前被西尔弗阴沉目光压住的怒火立刻爆发。他们骂西尔弗脚踩两只船，只顾替自己另找活路，却要牺牲同伙和落在他们手里的人。他们骂中的，正是西尔弗真正的盘算，事情明摆到这个地步，我怎么也想不出他还能怎样脱身。可他一个人抵得上其余人两个，昨夜那场胜利更叫众人怕他。他把所有人骂成蠢货和笨蛋，又说我非见医生不可。他还把地图抖到他们脸前，问他们当天就要去寻宝，难道偏偏现在敢撕毁协议。
        - id: ch02-b02
          speaker: long_john_silver
          text: 当然不能！等时候到了，撕毁协议的得是咱们。在那以前，就算让我拿白兰地给医生擦靴子，我也得把他哄住。
        - id: ch02-b03
          speaker: narrator
          text: 说完，他命令众人生火，把一只手搭到我的肩上，拄着拐杖昂然走出门去。屋里那群人乱作一团。他们只是被西尔弗滔滔不绝的话压得哑口无言，心里根本没有信服。
        - id: ch02-b04
          speaker: long_john_silver
          text: 慢一点，小伙子。要是让他们看出咱们着急，他们转眼就会掉过头来对付咱们。
        - id: ch02-b05
          speaker: narrator
          text: 于是，我们故意走得不慌不忙，一步步穿过栅栏里的沙地。利弗西医生正在另一边等着。等我们走到不用提高嗓门，也能同他从容交谈的距离，西尔弗便停下脚步。
        - id: ch02-b06
          speaker: long_john_silver
          text: 医生，这件事也请您记上一笔。孩子会告诉您，我救过他的命，还为此被他们罢免过船长，这一点您尽管信。像我这样贴着风勉强掌舵，拿身体里的最后一口气当铜板抛着玩，求您替我说句好话，总不算过分吧？还请您记住，如今赌上的不只我的命，这孩子的命也在里面。看在老天慈悲的份上，请您好好同我说话，给我一点盼头，让我能撑下去吧。
        - id: ch02-b07
          speaker: narrator
          text: 背对同伙和木屋以后，西尔弗完全变了个人。他两颊像塌了下去，嗓音也在发抖。这回，他的认真没有半点虚假。
        - id: ch02-b08
          speaker: doctor_livesey
          text: 怎么，约翰，你害怕了？
        - id: ch02-b09
          speaker: long_john_silver
          text: 医生，我可不是胆小鬼，还没胆小到那个地步！我要真胆小，也不会承认。可我说实话，一想起绞架，我就浑身发抖。您是个正直的好人，我从没见过比您更好的人。我的坏事您不会忘，我做过的好事，您也一定不会忘。现在我退开，让您和吉姆单独谈。这一步可不小，也请您替我记住。
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: 说完，西尔弗退到听不见我们说话的地方，在一个树桩上坐下，吹起了口哨。他不时在树桩上转过身，一会儿盯着我和医生，一会儿察看那些不服管束的家伙。海盗们正在火堆和木屋之间来回走动。他们重新点起火，又从屋里搬出猪肉和面包，预备早饭。
    - id: ch03
      title: 吉姆的誓言
      blocks:
        - id: ch03-b01
          speaker: doctor_livesey
          text: 吉姆，你果然落到这里来了。自己酿下的苦酒，只好自己喝下去，孩子。老天知道，我实在不忍心责怪你，可有句话非说不可，不论你听来觉得慈爱还是刻薄。斯莫列特船长好端端的时候，你不敢擅自离开。等他受了伤，已经无力阻止你，你反倒跑了。老天在上，这实在是胆小鬼的做法。
          emotion: sad
        - id: ch03-b02
          speaker: narrator
          text: 我听着听着，哭了起来。
        - id: ch03-b03
          speaker: narrator
          text: 医生，您就饶了我吧，我已经把自己责怪得够多了。反正我的命已经不保，要不是西尔弗替我撑腰，我现在早就死了。医生，请您相信，我不怕死，而且我想，自己也许确实该死。可我害怕的是酷刑。要是他们真的对我用刑……
          emotion: fearful
        - id: ch03-b04
          speaker: doctor_livesey
          text: 吉姆，我绝不能让这种事发生。快翻过栅栏，我们一起逃！
        - id: ch03-b05
          speaker: narrator
          text: 医生，我已经发过誓了。
        - id: ch03-b06
          speaker: doctor_livesey
          text: 我知道，我知道。可吉姆，现在已经顾不得那个誓言了。所有责任都由我一肩承担，不管别人怎么责骂，不管这件事有多丢脸，全算在我的头上。可我绝不能让你继续留在这里。快跳！只要一下跳过栅栏，你就自由了，我们马上像羚羊一样逃走。
        - id: ch03-b07
          speaker: narrator
          text: 不。您心里很清楚，您自己绝不会做这种事，乡绅和船长也不会，我当然也不会。西尔弗信任我，我发过誓，就一定回去。不过医生，我刚才还没说完。要是他们折磨我，我也许会失口说出船藏在哪里。那条船是我弄到手的，一半靠运气，一半靠冒险。它如今停在北汊南岸，位置就在涨潮水线下面。潮水退到一半时，它一定会完全搁浅在岸上。
        - id: ch03-b08
          speaker: doctor_livesey
          text: 那条船竟然在你手里！
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: 我赶紧把离开木屋以后经历的事情，从头到尾说给医生听。我讲得很快，没有漏掉那些惊险的遭遇。医生始终没有插话，只是一声不响地听我全部讲完。
        - id: ch03-b10
          speaker: doctor_livesey
          text: 这件事仿佛真有命运在做主。每到关键一步，救下我们性命的人都是你。难道你以为，我们会眼睁睁看着你丢掉自己的命？那样报答你，也太不像话了。阴谋是你发现的，本·冈恩也是你找到的。找到本·冈恩，是你做过的最要紧的事，就算活到九十岁，恐怕也不会再有更要紧的了。天哪，说到本·冈恩！这下麻烦可大了。西尔弗！我有句话要告诉你。找到宝藏以后，千万别急着动手。
    - id: ch04
      title: 医生的忠告
      blocks:
        - id: ch04-b01
          speaker: long_john_silver
          text: 先生，这事我再想办法也办不到。恕我直说，我和孩子若想活命，就只能去找那批宝藏。
        - id: ch04-b02
          speaker: doctor_livesey
          text: 既然这样，我再多说一句。找到宝藏时，要当心暴风骤起。
        - id: ch04-b03
          speaker: long_john_silver
          text: 先生，咱们男人对男人，把话说直吧。您这话既说得太多，又说得太少。您究竟想做什么，为什么离开木屋，又为什么把那张地图给我，我可一点也不知道，对不对？可我一直闭着眼照您的吩咐办，连半句能给人希望的话也没听见。这可太过分了。您要是不肯把意思明说，只管告诉我，我马上撒手不管。
        - id: ch04-b04
          speaker: doctor_livesey
          text: 不，我没权利再多讲，因为这不是我的秘密。否则，我向你保证，一定会告诉你。只要我敢陪你走多远，我就陪你走多远，甚至还会再多迈一步。要是我没猜错，船长知道以后，准会把我的假发骂歪！先给你一点希望吧。西尔弗，如果我们两个人都能活着走出这个狼窝，我一定尽力救你，只是绝不会替你作伪证。
        - id: ch04-b05
          speaker: narrator
          text: 西尔弗的脸顿时亮了起来。
        - id: ch04-b06
          speaker: long_john_silver
          text: 先生，就算您是我亲娘，也不可能说得更多了！
          emotion: happy
        - id: ch04-b07
          speaker: doctor_livesey
          text: 好，这是我的第一个让步。第二个是一句忠告。把孩子紧紧带在身边，别让他离开你。需要援手时就大声喊。我现在就去替你寻找帮手，而我真的动身去找，这件事本身就足以证明我不是随口说说。再会，吉姆。
        - id: ch04-b08
          speaker: narrator
          text: 话说完了。利弗西医生隔着栅栏伸出手，紧紧和我握了握，又转向西尔弗，朝他点了一下头。接着，他不再停留，迈开轻快的步子，很快走进树林，消失在我们眼前。
