audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Jim Hawkins
      tts:
        delivery: youthful, observant first-person storytelling
        timbre: bright and warm
        pace: measured
        pitch: medium-high
    long_john_silver:
      display_name: Long John Silver
      tts:
        delivery: commanding, quick-witted, and rough-edged
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    doctor_livesey:
      display_name: Dr. Livesey
      tts:
        delivery: observant, decisive, and dryly humorous
        timbre: warm and steady
        pace: measured
        pitch: medium-low
    george_merry:
      display_name: George Merry
      tts:
        delivery: hot-tempered and openly defiant
        timbre: harsh and wiry
        pace: brisk
        pitch: medium
    morgan:
      display_name: Tom Morgan
      tts:
        delivery: blunt, mutinous, and weather-beaten
        timbre: coarse and gravelly
        pace: forceful
        pitch: medium-low
    first_mutineer:
      display_name: First Mutineer
      tts:
        delivery: resentful and defiant
        timbre: rough and nasal
        pace: clipped
        pitch: medium
  chapters:
    - id: ch01
      title: "On Parole"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A clear, hearty call came from the edge of the woods and woke every one of us. Even the sentry jerked awake where he had slumped against the doorpost.
        - id: ch01-b02
          speaker: doctor_livesey
          text: "Blockhouse, ahoy! It's the doctor."
        - id: ch01-b03
          speaker: narrator
          text: >-
            It really was Dr. Livesey. The sound of his voice made me glad, but that gladness came mixed with shame. I remembered how I had disobeyed, slipped away without a word, and landed myself among these companions and dangers. I could hardly bear to look him in the face. He must have risen and started out in darkness, because day had barely broken. I ran to a loophole and saw him standing in the creeping mist, knee-deep in it, just as Silver had stood there before.
        - id: ch01-b04
          speaker: long_john_silver
          text: >-
            Doctor! A fine good morning to you, sir! Up bright and early, I see. They say the early bird gets the rations. George, stir yourself and help Dr. Livesey aboard. Your patients are doing grand, sir. Every man well and cheerful.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Silver was wide awake and smiling in an instant. He stood on the hilltop with his crutch under one elbow and one hand against the blockhouse wall. As he kept up his cheerful chatter, he sounded and looked like the old John Silver again.
        - id: ch01-b06
          speaker: long_john_silver
          text: >-
            We've got a surprise for you too, sir. A new lodger! Fit as a fiddle, he is. Slept all night beside old John, stem to stem, like a proper ship's officer.
        - id: ch01-b07
          speaker: narrator
          text: >-
            By then the doctor had crossed the stockade and come close to Silver. When he spoke, I heard his voice change.
        - id: ch01-b08
          speaker: doctor_livesey
          text: "You don't mean Jim?"
          emotion: surprised
        - id: ch01-b09
          speaker: long_john_silver
          text: "The very same Jim Hawkins."
        - id: ch01-b10
          speaker: narrator
          text: >-
            The doctor stopped dead. For several seconds he could not seem to move.
        - id: ch01-b11
          speaker: doctor_livesey
          text: >-
            Well, then. Duty before pleasure, as you might say yourself, Silver. Let me examine these patients of yours.
        - id: ch01-b12
          speaker: narrator
          text: >-
            A moment later he entered the blockhouse. He gave me one grim nod, then went straight to the sick men. Though he knew his life among those treacherous pirates hung by a thread, he showed no fear at all. He moved from patient to patient and talked as casually as if this were an ordinary visit to a quiet English family. His confidence seemed to pass into the men. They answered him politely and did exactly as he said. For those few minutes, they acted as though nothing had happened, as though he were still the ship's doctor and they were still loyal sailors serving before the mast.
        - id: ch01-b13
          speaker: doctor_livesey
          text: >-
            You're coming along well, my friend. If anyone ever had a narrow escape, it was you. That head of yours must be iron. And how are you, George? That's quite a color you've got. Your liver is turned upside down. Did you take the medicine? Men, did he swallow it?
        - id: ch01-b14
          speaker: morgan
          text: "Aye, sir. He took every bit of it."
        - id: ch01-b15
          speaker: doctor_livesey
          text: >-
            Good. Since I'm serving as doctor to mutineers, or prison doctor, as I prefer to call it, my honor requires me not to lose a man who belongs to King George, God bless him, and the gallows.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The rogues glanced at one another, but they took the insult in silence.
        - id: ch01-b17
          speaker: first_mutineer
          text: "Dick's feeling poorly, sir."
        - id: ch01-b18
          speaker: doctor_livesey
          text: >-
            Is he? Come here, Dick, and show me your tongue. Good heavens, no wonder he feels poorly. That tongue could frighten the French. Another fever.
        - id: ch01-b19
          speaker: morgan
          text: "There, you see? That's what comes of ruining Bibles."
        - id: ch01-b20
          speaker: doctor_livesey
          text: >-
            No, it comes from being complete fools. You haven't enough sense to tell clean air from poison or dry ground from a filthy, fever-soaked swamp. This is only my opinion, of course, but every one of you may pay dearly before that malaria leaves your body. What were you thinking, camping in a bog? Silver, I thought you had more sense than most men here. Yet from what I see, you don't know even the first rule of staying healthy.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The doctor gave medicine to each man, and the bloodstained mutineers swallowed it with the meek faces of charity-school boys.
        - id: ch01-b22
          speaker: doctor_livesey
          text: "That's enough for today. Now I'd like a word with the boy, please."
        - id: ch01-b23
          speaker: narrator
          text: >-
            He gave a careless nod in my direction.
        - id: ch01-b24
          speaker: narrator
          text: >-
            George Merry was at the door, coughing and spitting over the foul medicine. The moment he heard the doctor's request, he wheeled around, his face dark red.
        - id: ch01-b25
          speaker: george_merry
          text: "No!"
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: >-
            He followed it with an oath. Silver slapped the barrel with his open hand and looked around like a lion.
        - id: ch01-b27
          speaker: long_john_silver
          text: "Si-lence!"
          emotion: angry
        - id: ch01-b28
          speaker: narrator
          text: >-
            Then Silver returned to his usual voice.
        - id: ch01-b29
          speaker: long_john_silver
          text: >-
            Doctor, I was thinking the same thing, since I know you're fond of the boy. We're grateful for your care. You can see we trust you, because we swallow your medicine as readily as rum. I believe I've got a plan that suits everybody. Hawkins, give me your word as a young gentleman, and a gentleman you are though you were born poor. Promise you won't slip away.
        - id: ch01-b30
          speaker: narrator
          text: "I gave him my word at once."
        - id: ch01-b31
          speaker: long_john_silver
          text: >-
            Then step outside the stockade, doctor. I'll bring Jim down on this side, and you can talk through the stakes. Good day, sir. Give our respects to the squire and Captain Smollett.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The doctor left the house. At once, all the anger Silver's black looks had held back burst loose. The pirates accused him of playing both sides. They said he meant to make a private peace for himself by sacrificing his partners and his prisoners alike. That was exactly what he was doing, and it seemed so obvious that I could not imagine how he would talk his way free. But Silver was twice the man any of them was. His victory the night before still weighed heavily on their minds and gave him power over them.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Silver called them every kind of fool and blockhead he could think of. He told them there was no choice. I had to speak with the doctor. Then he pulled out the treasure map and fluttered it in their faces. Were they really foolish enough, he asked, to break the treaty on the very day they were bound to set out treasure hunting?
        - id: ch01-b34
          speaker: long_john_silver
          text: >-
            No, by thunder! We'll break the treaty when the right time comes. Until then, I'll fool that doctor even if I have to polish his boots with brandy.
        - id: ch01-b35
          speaker: narrator
          text: >-
            He ordered them to light the fire. Then he put one hand on my shoulder and stalked outside on his crutch. His flood of words had silenced the men, though it had not convinced them.
        - id: ch01-b36
          speaker: long_john_silver
          text: >-
            Easy, lad. Take it slow. If they see us hurry, they could turn on us in a heartbeat.
        - id: ch01-b37
          speaker: narrator
          text: >-
            We crossed the sand very deliberately. The doctor waited beyond the stockade. When we were close enough to speak without raising our voices, Silver stopped.
        - id: ch01-b38
          speaker: long_john_silver
          text: >-
            Make a note of this too, doctor. The boy will tell you I saved his life. He'll tell you they threw me out as captain for doing it. I'm sailing so close to the wind that I'm gambling with the last breath in my body. Surely one good word from you isn't too much to ask. And remember, it isn't only my life now. The boy's life is tied to mine. Speak fairly for me, doctor. For mercy's sake, give me some small hope to hold on to.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Away from the blockhouse, with his back turned to his followers, Silver seemed like another man. The bold look had gone out of him. His cheeks looked hollow, his voice shook, and every word came from a man in deadly earnest.
        - id: ch01-b40
          speaker: doctor_livesey
          text: "Why, John, are you frightened?"
        - id: ch01-b41
          speaker: long_john_silver
          text: >-
            I'm no coward, doctor. Not that much.
        - id: ch01-b42
          speaker: narrator
          text: "He snapped his fingers."
        - id: ch01-b43
          speaker: long_john_silver
          text: >-
            If I were a coward, I wouldn't admit it. But I'll tell you honestly, the gallows gives me the shakes. You're a good and truthful man, the best I've ever known. You won't forget the good I've done any more than the bad. Look, I'll move away and leave you alone with Jim. Put that down for me too. Letting you talk alone is a great risk.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Silver backed away until he could no longer hear us. He sat on a tree stump and began to whistle. Every so often he twisted around on the stump to keep watch. One moment he looked toward the doctor and me. The next, he checked on his unruly men. They were crossing the sand again and again between the fire and the house. Some worked at getting the fire lit while others carried out pork and bread for breakfast.
        - id: ch01-b45
          speaker: doctor_livesey
          text: >-
            So here you are, Jim. You made this trouble, and now you must face what follows. Heaven knows I can't bring myself to blame you. Still, I have to say this, whether it sounds kind or cruel. You never would have dared to run away while Captain Smollett was well and able to command you. But when he was wounded and helpless to stop you, off you went. By George, Jim, that was cowardly.
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: >-
            I began to cry.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Doctor, please spare me. I've blamed myself more than enough already. My life is lost anyway. I should be dead now, and I would be if Silver hadn't stood up for me. Believe me, doctor, I can face death. I may even deserve it. What frightens me is torture. If they begin to torture me, I might—
          emotion: fearful
        - id: ch01-b48
          speaker: doctor_livesey
          text: >-
            Jim, no. I won't allow this. Climb over, and we'll make a run for it.
        - id: ch01-b49
          speaker: narrator
          text: "Doctor, I gave my word."
        - id: ch01-b50
          speaker: doctor_livesey
          text: >-
            I know. But that can't matter now. I'll take all the blame and shame myself. I cannot leave you here. Jump, Jim! One leap and you're free. Then we'll run like antelopes.
        - id: ch01-b51
          speaker: narrator
          text: >-
            No. You wouldn't break your word yourself. Neither would the squire or the captain, and neither will I. Silver trusted me. I promised to return, so I'm going back. But you stopped me before I finished. If they torture me, I may tell them where the ship is. I captured her partly through luck and partly by taking risks. She's in North Inlet, on the southern beach, just below the high-water line. At half tide, she'll be high and dry.
        - id: ch01-b52
          speaker: doctor_livesey
          text: "The ship?"
          emotion: surprised
        - id: ch01-b53
          speaker: narrator
          text: >-
            I quickly told him the whole story of my adventures, from cutting the ship loose to bringing her into North Inlet. He heard me through to the end without saying a word.
        - id: ch01-b54
          speaker: doctor_livesey
          text: >-
            There seems to be fate at work here. At every turn, you're the one who saves our lives. Do you imagine we'll stand by and let you lose yours after that? It would be a shameful way to repay you. First you uncovered the pirates' plot. Then you found Ben Gunn, and that may be the best thing you ever do, even if you live to ninety. Good heavens, Ben Gunn! I nearly forgot him. Now there's trouble itself.
        - id: ch01-b55
          speaker: narrator
          text: "He called Silver back."
        - id: ch01-b56
          speaker: doctor_livesey
          text: "Silver, here's my advice. Don't rush to find that treasure."
        - id: ch01-b57
          speaker: long_john_silver
          text: >-
            Sir, I do what I can, but I can't do that. Begging your pardon, the only way I can save my life and Jim's is to hunt for the treasure. That's the truth of it.
        - id: ch01-b58
          speaker: doctor_livesey
          text: "If that's so, I'll tell you one thing more. When you find it, watch out for squalls."
        - id: ch01-b59
          speaker: long_john_silver
          text: >-
            Sir, speaking man to man, you've said too much and not enough. I don't know what you're planning, why you left the blockhouse, or why you handed me that map. You must know I don't. Still, I did exactly what you wanted. I went ahead with my eyes shut, without asking questions, and you never gave me one word of hope. But this warning goes too far. If you won't tell me plainly what you mean, just say so. I'll let go of the helm and stop asking.
        - id: ch01-b60
          speaker: doctor_livesey
          text: >-
            No, I have no right to tell you more. The secret isn't mine to give away. If it were, I'd give you my word and tell you everything. Still, I'll go as far as I dare, and perhaps one step farther. The captain may tear my wig off for it, unless I'm much mistaken. First, I'll give you some hope. Silver, if both of us get out of this wolf trap alive, I'll do everything I can to save you, short of lying under oath.
        - id: ch01-b61
          speaker: narrator
          text: "Silver's face lit up."
        - id: ch01-b62
          speaker: long_john_silver
          text: >-
            You couldn't promise me more, sir, not even if you were my own mother.
          emotion: happy
        - id: ch01-b63
          speaker: doctor_livesey
          text: >-
            That's my first concession. Here is the second, and it's advice you should follow. Keep Jim close beside you. When the moment comes and you need help, shout for it. I'm going to look for help for you now. That alone should prove I'm not speaking at random. Good-bye, Jim.
        - id: ch01-b64
          speaker: narrator
          text: >-
            Dr. Livesey shook my hand through the stockade, nodded to Silver, and walked briskly into the woods.
