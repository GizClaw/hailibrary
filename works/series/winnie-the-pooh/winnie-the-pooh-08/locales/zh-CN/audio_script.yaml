audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 小心谨慎，紧张时语速加快，鼓起勇气时格外认真
        timbre: 轻柔稚嫩
        pace: 轻快而富有变化
        pitch: 高
    rabbit:
      display_name: 兔子
      tts:
        delivery: 自信干脆，安排事情时郑重又急切
        timbre: 明亮清晰
        pace: 偏快
        pitch: 中高
    kanga:
      display_name: 袋鼠妈妈
      tts:
        delivery: 温柔镇定，捉弄别人时仍像一位耐心的母亲
        timbre: 温暖柔和
        pace: 从容
        pitch: 中等
    roo:
      display_name: 小袋鼠豆豆
      tts:
        delivery: 活泼天真，兴奋时声音短促明快
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 森林里的陌生动物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁也不知道袋鼠妈妈和小袋鼠豆豆是从哪儿来的，可他们已经住进森林了。噗问克里斯托弗·罗宾，他们是怎么来的。
        - id: ch01-b02
          speaker: christopher_robin
          text: 就是平常那样来的呀，噗。你明白我的意思吧？
        - id: ch01-b03
          speaker: narrator
          text: 噗其实一点也不明白，却先说了一声“噢”，又点了两下头，像是终于懂了。他重复了一遍“平常那样”，随后去找小猪，想听听小猪怎么想。到了小猪家，他发现兔子也在那里，三个朋友便一起谈起这件事。
        - id: ch01-b04
          speaker: rabbit
          text: 我不喜欢的就是这个。本来我们都在这儿，你、噗、小猪，还有我，大家一直住得好好的。可是忽然之间，事情就变了……
        - id: ch01-b05
          speaker: pooh
          text: 还有屹耳。
        - id: ch01-b06
          speaker: rabbit
          text: 对，还有屹耳。可是忽然之间……
        - id: ch01-b07
          speaker: pooh
          text: 还有猫头鹰。噢，还有屹耳，我差点把他忘了。
        - id: ch01-b08
          speaker: rabbit
          text: 我们大家本来都好好待在这里。可是忽然有一天早上醒来，我们发现了什么？森林里竟然多了一种陌生动物，一种从没听说过的动物！她还把全家装进口袋，随身带着走。我要是也这么做，得缝多少只口袋？
        - id: ch01-b09
          speaker: piglet
          text: 十六只。
        - id: ch01-b10
          speaker: rabbit
          text: 等等，应该是十七只吧？而且我还得另外有一只口袋放手帕，那就是十八只。一套衣服缝上整整十八只口袋，我哪有工夫管这种事。
        - id: ch01-b11
          speaker: narrator
          text: 大家安静下来，认真想了很久。噗一直皱紧眉头，像是在算一件极难的事。过了好几分钟，他终于有了答案。
        - id: ch01-b12
          speaker: pooh
          text: 我算出来是十五个。
        - id: ch01-b13
          speaker: rabbit
          text: 十五个什么？
        - id: ch01-b14
          speaker: pooh
          text: 你的家人呀。
        - id: ch01-b15
          speaker: narrator
          text: 兔子问自己的家人怎么了。噗揉揉鼻子，说他还以为兔子刚才一直在讲家里有多少人。兔子满不在乎地问，自己真的讲过吗。噗刚要提醒他，小猪已经不耐烦地叫噗别管了。
        - id: ch01-b16
          speaker: rabbit
          text: 现在真正要紧的是，我们该拿袋鼠妈妈怎么办。最好的办法，就是把豆豆偷走，再把他藏起来。袋鼠妈妈问“豆豆在哪儿”，我们三个就一起对她说“哈”！
        - id: ch01-b17
          speaker: pooh
          text: 哈！哈！哈！我先把这种口气练好。不过仔细想想，就算我们根本没有偷走豆豆，也一样能站在那里说“哈”呀。
        - id: ch01-b18
          speaker: rabbit
          text: 噗，你没有脑筋。我们说“哈”，是要让袋鼠妈妈知道，我们知道豆豆在哪里。这一声真正的意思是，只要她答应离开森林，而且永远不再回来，我们才肯告诉她豆豆藏在什么地方。现在先别讲话，我得安静地想一想。
        - id: ch01-b19
          speaker: pooh
          text: 我知道我没有脑筋。
        - id: ch01-b20
          speaker: narrator
          text: 噗躲到角落，用兔子教的那种口气练习“哈”。有时他觉得，这一声里确实藏着“离开森林，我们才告诉你”的意思。有时听起来却完全不像。他想，大概只要练习就行了。不过，袋鼠妈妈也许也得练习，才能听懂。
        - id: ch01-b21
          speaker: piglet
          text: 还有一件事让我不放心。克里斯托弗·罗宾说，袋鼠通常被看作比较凶猛的动物。我平常并不怕凶猛的动物，可大家都知道，一只凶猛的动物要是失去孩子，就会变得像两只凶猛的动物那么凶。到那时候，对她说“哈”，也许就是一件很傻的事了。
        - id: ch01-b22
          speaker: rabbit
          text: 小猪，你一点胆量也没有。
        - id: ch01-b23
          speaker: piglet
          text: 一只非常小的动物要勇敢起来，本来就很难。
        - id: ch01-b24
          speaker: rabbit
          text: 正因为你是一只非常小的动物，眼前这场历险才特别用得上你。何况袋鼠只有冬天才凶，其他时候性情都很慈爱，你根本不用担心。
        - id: ch01-b25
          speaker: narrator
          text: 一听说自己会有用，小猪兴奋得立刻忘了害怕。兔子又告诉他，袋鼠在冬天之外都十分慈爱。这下小猪几乎坐不住了，只想马上派上用场。噗却伤心起来，担心自己没有一点用。
        - id: ch01-b26
          speaker: piglet
          text: 别难过，噗。也许下次会用上你。
        - id: ch01-b27
          speaker: rabbit
          text: 没有噗，这场历险根本办不成。
        - id: ch01-b28
          speaker: narrator
          text: 小猪听完，只说了一声“噢”，还努力不让自己显得失望。噗却躲到房间角落，骄傲地告诉自己，没有他就办不成，他就是这样的熊。兔子忙着削好铅笔，写完了一份计划。随后，他叫大家听仔细。噗和小猪张着嘴，万分专心地坐好。
        - id: ch01-b29
          speaker: rabbit
          text: 计划是这样的。第一，袋鼠妈妈跑得比我们谁都快，连我也比不过。第二，她从不让豆豆离开眼前，除非豆豆安稳地扣在口袋里。所以，我们捉到豆豆以后，必须先跑出很远。还有一个想法。等豆豆跳出来，就让同样很小的小猪跳进去，她不会发现不同。不过，她得先看向别处，不能看见小猪往里跳。这就由噗跟她起劲地说话。我抱起豆豆，赶快逃走。最后，袋鼠妈妈要到过后才会发现换了人。
        - id: ch01-b30
          speaker: narrator
          text: 兔子得意地念完这份计划。念完以后，屋里有好一会儿没有任何声音。小猪的嘴一开一合了好几次，却一句话也说不出来。最后，他才哑着嗓子挤出一个问题。
        - id: ch01-b31
          speaker: piglet
          text: 可是，过后怎么办？我的意思是，等袋鼠妈妈真的发现口袋里换了人，发现那不是豆豆的时候，我们怎么办？
        - id: ch01-b32
          speaker: rabbit
          text: 我们三个一起说“哈”。
        - id: ch01-b33
          speaker: piglet
          text: 只要我们三个一起说，我就不介意。可要是让我独自说，我可不愿意。一个人说出来，听着远远没有三个人一起说得好。还有，你刚才讲冬天的那些话，真的没有错吗？你真的确定，他们只有冬天才凶？
        - id: ch01-b34
          speaker: rabbit
          text: 当然确定，冬天的事一点也不用担心。好了，噗，你明白自己的任务了吧？你只要拼命跟袋鼠妈妈说话，让她忙着听你，什么别的事情也注意不到。
        - id: ch01-b35
          speaker: pooh
          text: 可是我要跟她说什么呢？什么都可以吗？比如给她念一小段诗，或者别的什么？
        - id: ch01-b36
          speaker: rabbit
          text: 正是这样，念诗再合适不过了。这个办法妙极了。现在什么都安排好了，我们一起出发去找袋鼠妈妈吧。
    - id: ch02
      title: 兔子的计划
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 袋鼠妈妈和豆豆在森林的一片沙地上，安安静静地度过午后。豆豆练习跳很小很小的步子，不断掉进老鼠洞，再从里面爬出来。袋鼠妈妈在一旁走来走去，总说，亲爱的，再跳一次我们就回家。这时，噗咚咚咚地爬上了山。
        - id: ch02-b02
          speaker: pooh
          text: 下午好，袋鼠妈妈。
        - id: ch02-b03
          speaker: kanga
          text: 下午好，噗。
        - id: ch02-b04
          speaker: roo
          text: 看我跳！
        - id: ch02-b05
          speaker: narrator
          text: 豆豆说着，又掉进一个老鼠洞。噗向这个小家伙问好。兔子和小猪也从山坡另一面赶来，先向袋鼠妈妈问好，又跟豆豆打招呼。豆豆请他们看自己跳，于是大家都留了下来。袋鼠妈妈也一直看着他。
        - id: ch02-b06
          speaker: pooh
          text: 袋鼠妈妈，你喜欢诗吗？
        - id: ch02-b07
          speaker: kanga
          text: 我对诗几乎一点兴趣也没有。亲爱的豆豆，你可以再跳最后一次，跳完这一次，我们就收拾好回家。
        - id: ch02-b08
          speaker: narrator
          text: 大家安静了一小会儿，只看着豆豆又掉进一个老鼠洞。兔子躲在爪子后面，用谁都听得见的悄悄话催噗继续说下去。
        - id: ch02-b09
          speaker: pooh
          text: 说到诗，我来的路上正好写了一小首。它原本是这样的。呃，现在让我好好想一想，开头到底怎么念来着……
        - id: ch02-b10
          speaker: rabbit
          text: 这首诗你一定会喜欢。你可得非常仔细地听着，从开头一直听到结尾。
        - id: ch02-b11
          speaker: piglet
          text: 你准会爱上这首诗，所以一句也不要漏掉，不然就太可惜了。
        - id: ch02-b12
          speaker: narrator
          text: 袋鼠妈妈嘴上答应会好好听，眼睛却一刻也没离开豆豆。兔子只好替她追问噗，那首诗到底是怎么念的。噗站好以后，先轻轻咳了一声，然后一本正经地念起《一只脑筋很小的熊写的诗句》。
        - id: ch02-b13
          speaker: pooh
          text: 星期一，太阳晒，我想来想去真奇怪。这个是不是那个来，究竟哪个是哪个来？星期二，又冰雹又飘雪，我心里的念头越长越热切。几乎谁也分不清，这是那些，还是那些是这些。星期三，蓝蓝天，我没别的事可干。有时想想究竟是不是真，谁是什么，什么又是谁来扮。星期四，寒气到，树上白霜亮闪耀。任谁一看都知道，这些是谁的，可谁的又是这些呢？星期五……
        - id: ch02-b14
          speaker: kanga
          text: 可不是吗？这首诗真是这么回事。好了，亲爱的豆豆，再跳最后一次，然后我们真的必须回家了。
        - id: ch02-b15
          speaker: narrator
          text: 袋鼠妈妈根本没等到诗里的星期五发生什么，就把话接了过去。兔子连忙用胳膊肘碰噗一下，催他赶快想别的办法。
        - id: ch02-b16
          speaker: pooh
          text: 说到诗，你有没有留意过那边那棵树？就是你身后的那一棵。我从这里看见树上有一样东西，好像是一只鸟。可是再仔细看，也可能是一条鱼。
        - id: ch02-b17
          speaker: kanga
          text: 你说的是哪棵树？我怎么没有看见？好了，亲爱的豆豆，现在跳进口袋里来，我们该回家了。
        - id: ch02-b18
          speaker: rabbit
          text: 你真的应该回头看看那棵树，从这里看特别清楚。豆豆，你是不是够不到口袋？要不要我把你抱进去？
        - id: ch02-b19
          speaker: piglet
          text: 那不是鱼，是一只鸟。
        - id: ch02-b20
          speaker: rabbit
          text: 没错，果然是一只鸟。可它到底是乌鸫，还是一只椋鸟？这才是眼下最要紧的问题，非看清楚不可。
        - id: ch02-b21
          speaker: narrator
          text: 袋鼠妈妈终于转头去看那棵树。她刚转过去，兔子就大喊一声“豆豆，进去”。小猪立刻跳进袋鼠妈妈的口袋，兔子抱起豆豆，使出全身力气逃走了。袋鼠妈妈回过头，发现兔子不见了，便问他去了哪里，又问口袋里的豆豆好不好。小猪缩在口袋底下，只好学着豆豆尖叫一声。
        - id: ch02-b22
          speaker: pooh
          text: 兔子刚才忽然想起一件事情，非马上赶去看看不可。至于小猪，我想他也在同一个时候，忽然想起了一件非走不可的事。
        - id: ch02-b23
          speaker: kanga
          text: 既然他们两个人都有急事，我们也该回家了。再见，噗，下次再见。
        - id: ch02-b24
          speaker: narrator
          text: 袋鼠妈妈说完再见，三个大跳就不见了。噗站在原地望着她，真希望自己也能那样跳。他想，有的能，有的不能，事情就是这样。可口袋里的小猪却巴不得她不会跳。过去穿过森林，走上长长一段回家路时，小猪常盼着自己能变成一只鸟。可这一回，他每次被抛到空中都要喊一声，落下来又得喊一声。现在，他被颠得连一句念头也想不完整。
        - id: ch02-b25
          speaker: piglet
          text: 要是这样上去下来也能算作飞，那我以后再也不想飞了。呜——！噢！呜——噢！呜——噢！一路都停不下来！
    - id: ch03
      title: 小猪洗澡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 袋鼠妈妈刚解开口袋，就明白发生了什么。有那么一小会儿，她以为自己吓坏了，转眼又知道自己根本不怕。她确信克里斯托弗·罗宾绝不会让豆豆受到伤害。既然大家要跟她开玩笑，她便决定，也跟大家开一个玩笑。
        - id: ch03-b02
          speaker: kanga
          text: 好了，亲爱的豆豆，我们已经到家了。现在时候不早，你该乖乖上床睡觉了。
        - id: ch03-b03
          speaker: piglet
          text: 哈！我们知道豆豆在哪里！
        - id: ch03-b04
          speaker: narrator
          text: 经过那段一路上上下下的可怕旅程，小猪已经只能挤出这样一声。这声“哈”既不响亮，也一点不像威胁，袋鼠妈妈似乎根本没听明白里面藏着什么意思。
        - id: ch03-b05
          speaker: kanga
          text: 不过在睡觉以前，当然得先好好洗一个澡。
        - id: ch03-b06
          speaker: piglet
          text: 哈！你该知道，我们知道豆豆在哪里！
        - id: ch03-b07
          speaker: narrator
          text: 小猪又说了一声“哈”，焦急地四下寻找伙伴，可谁也不在。兔子正在自己家里陪豆豆玩，而且每过一分钟，就更喜欢豆豆一点。噗还留在森林顶上的沙地，因为他决定做一只袋鼠，正在练习跳跃。
        - id: ch03-b08
          speaker: kanga
          text: 我正在认真想，今晚洗一个冷水澡，说不定是个好主意。亲爱的豆豆，你愿不愿意洗冷水澡呀？
        - id: ch03-b09
          speaker: narrator
          text: 小猪从来没有真正喜欢过洗澡。听见“冷水澡”几个字，他又气又怕，打了一个长长的寒战。可伙伴们全不在身边，他只好尽量鼓起勇气，把话说清楚。
        - id: ch03-b10
          speaker: piglet
          text: 袋鼠妈妈，现在该把话嗦清楚了。
        - id: ch03-b11
          speaker: kanga
          text: 真是个有趣的小豆豆。
        - id: ch03-b12
          speaker: piglet
          text: 我不是豆豆！我是小猪！
          emotion: angry
        - id: ch03-b13
          speaker: kanga
          text: 对，亲爱的，对，你说自己是小猪。你竟然连小猪的声音都学会了，真是聪明极了。我倒想看看，接下来你还会做出什么新鲜事。
        - id: ch03-b14
          speaker: narrator
          text: 袋鼠妈妈说着走到柜子前，从里面拿出一大块黄色肥皂，准备给小猪洗澡。
        - id: ch03-b15
          speaker: piglet
          text: 你看不见吗？你没有眼睛吗？快看看我！
          emotion: angry
        - id: ch03-b16
          speaker: kanga
          text: 我正仔细看着你呢，亲爱的豆豆。你还记得昨天我怎么跟你说做鬼脸这件事吗？你要是一直把脸扮得像小猪，长大以后真会变成他的样子。到了那个时候，你该多么后悔呀。现在马上进浴盆，别让我为了这件事再说第二遍。
        - id: ch03-b17
          speaker: narrator
          text: 小猪还没反应过来，已经坐进浴盆。袋鼠妈妈拿起一大块沾满肥皂沫的绒布，结结实实地给他擦洗。
        - id: ch03-b18
          speaker: piglet
          text: 噢！放我出去！我是小猪！
        - id: ch03-b19
          speaker: kanga
          text: 亲爱的，别张嘴，不然肥皂会进去。你瞧，我说过了吧？
        - id: ch03-b20
          speaker: piglet
          text: 你……你……你是故意的！
          emotion: angry
        - id: ch03-b21
          speaker: narrator
          text: 小猪刚能开口，就指责袋鼠妈妈是故意的。话还没说完，他又不小心吃进一口带肥皂沫的绒布。袋鼠妈妈叫他什么也别说。又过了一分钟，澡洗完了，小猪出了浴盆，被毛巾从头到脚擦得干干净净。
        - id: ch03-b22
          speaker: kanga
          text: 现在吃药，然后上床睡觉。
        - id: ch03-b23
          speaker: piglet
          text: 什……什么药？
          emotion: fearful
        - id: ch03-b24
          speaker: kanga
          text: 当然是让你长得又高又壮的药呀，亲爱的。你总不想长大以后，还像小猪那样又小又瘦弱吧？既然不想，那就该把药喝下去。
        - id: ch03-b25
          speaker: narrator
          text: 这时有人敲门，克里斯托弗·罗宾走了进来。
        - id: ch03-b26
          speaker: piglet
          text: 克里斯托弗·罗宾，克里斯托弗·罗宾！快告诉袋鼠妈妈我到底是谁！她一直说我是豆豆，可我根本不是豆豆。你最清楚了，对不对？
        - id: ch03-b27
          speaker: narrator
          text: 克里斯托弗·罗宾仔细看了看小猪，摇了摇头。
        - id: ch03-b28
          speaker: christopher_robin
          text: 你当然不可能是豆豆，因为我刚才过来的时候，还亲眼看见豆豆好好地待在兔子家里，正跟兔子一起玩呢。
        - id: ch03-b29
          speaker: kanga
          text: 哎呀，真想不到！我竟然会犯下这样的错误，把你认成了豆豆。
        - id: ch03-b30
          speaker: piglet
          text: 你看，我早就告诉过袋鼠妈妈了，她就是不肯相信。现在你也认出来了，我的确是小猪。
        - id: ch03-b31
          speaker: narrator
          text: 克里斯托弗·罗宾又摇摇头。
        - id: ch03-b32
          speaker: christopher_robin
          text: 噢，你也不可能是小猪。我跟小猪很熟，一眼就能认出他。他身上的颜色跟你现在的颜色完全不一样。
        - id: ch03-b33
          speaker: narrator
          text: 小猪本想解释，是刚洗过的澡让自己变了颜色。可是转念一想，也许还是别提洗澡为好。他张开嘴，正准备换一句话，袋鼠妈妈已经把药匙塞了进去。她又拍拍小猪的背，告诉他，这药只要喝习惯了，味道其实很不错。
        - id: ch03-b34
          speaker: kanga
          text: 我就知道，他绝不可能是我们认识的那只小猪。可是这个干干净净的小家伙，到底会是谁呢？
        - id: ch03-b35
          speaker: christopher_robin
          text: 也许他是噗的什么亲戚。会不会是噗的侄子，或者叔叔，再不然是别的亲戚？既然得给他取个名字，我们就叫他噗猪吧，简称亨利·噗猪。
    - id: ch04
      title: 大家又快快乐乐了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 名字刚定下来，亨利·噗猪小猪就从袋鼠妈妈怀里拼命扭了出去，跳到地上。让他高兴极了的是，克里斯托弗·罗宾进门时没有把门关上。小猪这辈子从来没有跑得这么快。他一口气跑到离家很近的地方，到了只剩一百码时，才停下脚步，改为一路打滚回家。这样，他就能重新变回原来那种舒服的颜色。袋鼠妈妈和豆豆就这样留在了森林里。以后每个星期二，豆豆都去陪他的好朋友兔子。每个星期二，袋鼠妈妈都陪她的好朋友噗，还教他怎样跳跃。每个星期二，小猪也都和他的好朋友克里斯托弗·罗宾一起玩。于是，大家又都快快乐乐了。
