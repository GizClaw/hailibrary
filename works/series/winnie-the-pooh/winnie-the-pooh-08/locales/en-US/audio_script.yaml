audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    piglet:
      display_name: Piglet
      tts:
        delivery: eager and delicately expressive
        timbre: small and bright
        pace: lightly quick
        pitch: high
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    rabbit:
      display_name: Rabbit
      tts:
        delivery: brisk and confidently organized
        timbre: crisp and slightly reedy
        pace: quick
        pitch: medium-high
    kanga:
      display_name: Kanga
      tts:
        delivery: warm, practical, and gently knowing
        timbre: smooth and motherly
        pace: measured
        pitch: medium
    roo:
      display_name: Roo
      tts:
        delivery: lively and innocently excited
        timbre: tiny and bright
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: In Which Kanga and Baby Roo Come to the Forest, and Piglet Has a Bath
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            No one in the Forest seemed to know where Kanga and Baby Roo had come from. Nobody could remember seeing them arrive. They were simply there one day, Kanga with little Roo riding in her pocket. Pooh was puzzled by this, so he went to Christopher Robin and asked how the two newcomers had come to the Forest.
        - id: ch01-b02
          speaker: christopher_robin
          text: >-
            The usual way, Pooh. You know what I mean.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Pooh did not know what Christopher Robin meant, but he said, “Oh!” Then he nodded twice, as though he understood perfectly, and said, “The usual way. Ah!” After that, he went to call on Piglet and find out what Piglet thought. Rabbit was already at Piglet's house, so the three friends sat down and discussed the newcomers together.
        - id: ch01-b04
          speaker: rabbit
          text: >-
            Here's what bothers me. There we were, Pooh, Piglet, and me. Then suddenly...
        - id: ch01-b05
          speaker: pooh
          text: >-
            And Eeyore.
        - id: ch01-b06
          speaker: rabbit
          text: >-
            Yes, Eeyore. And then suddenly...
        - id: ch01-b07
          speaker: pooh
          text: >-
            And Owl.
        - id: ch01-b08
          speaker: rabbit
          text: >-
            Yes, Owl. And then, all at once...
        - id: ch01-b09
          speaker: pooh
          text: >-
            Oh, and Eeyore. I forgot him.
        - id: ch01-b10
          speaker: rabbit
          text: >-
            Here we all are, every one of us. Then one morning we wake up and find a strange animal living among us. An animal we've never even heard of before! And she carries her whole family around in her pocket. Suppose I tried carrying my family in my pocket. How many pockets would I need then?
        - id: ch01-b11
          speaker: piglet
          text: >-
            Sixteen.
        - id: ch01-b12
          speaker: rabbit
          text: >-
            Seventeen, isn't it? Plus one for a handkerchief. That's eighteen pockets in one suit! I haven't got time for that.
        - id: ch01-b13
          speaker: narrator
          text: >-
            They were quiet for a long time. Pooh frowned and thought very hard.
        - id: ch01-b14
          speaker: pooh
          text: >-
            I count fifteen.
        - id: ch01-b15
          speaker: rabbit
          text: >-
            What?
        - id: ch01-b16
          speaker: pooh
          text: >-
            Fifteen.
        - id: ch01-b17
          speaker: rabbit
          text: >-
            Fifteen what?
        - id: ch01-b18
          speaker: pooh
          text: >-
            Your family.
        - id: ch01-b19
          speaker: rabbit
          text: >-
            What about them?
        - id: ch01-b20
          speaker: narrator
          text: >-
            Pooh rubbed his nose and explained that he thought Rabbit had been talking about his family.
        - id: ch01-b21
          speaker: rabbit
          text: >-
            Was I?
        - id: ch01-b22
          speaker: pooh
          text: >-
            Yes. You said...
        - id: ch01-b23
          speaker: piglet
          text: >-
            Never mind, Pooh.
          emotion: angry
        - id: ch01-b24
          speaker: rabbit
          text: >-
            What matters is what we're going to do about Kanga. The best plan is to steal Baby Roo and hide him. Then Kanga will ask us, “Where is Baby Roo?” And we'll look at her and say, “Aha!”
        - id: ch01-b25
          speaker: pooh
          text: >-
            Aha! Aha, aha! Though we could say “Aha!” without stealing Baby Roo.
        - id: ch01-b26
          speaker: rabbit
          text: >-
            Pooh, you haven't any brain.
        - id: ch01-b27
          speaker: pooh
          text: >-
            I know.
        - id: ch01-b28
          speaker: rabbit
          text: >-
            We say it so Kanga knows we know where Roo is. It means we'll tell her if she promises to leave the Forest and never return. Now be quiet while I think.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Pooh went into a corner and tried saying “Aha!” in the voice Rabbit had used. Sometimes the word really did seem to mean, “We'll tell you where Roo is if you promise to go away.” Other times, it sounded like nothing but “Aha!” Pooh decided it must take practice. Then he began to wonder whether Kanga would have to practice too before she could understand him.
        - id: ch01-b30
          speaker: piglet
          text: >-
            There's one problem. Christopher Robin told me Kangas are generally considered fierce. Now, I'm not usually afraid of fierce animals. But everyone knows that when a fierce animal loses its young, it becomes as fierce as two fierce animals. Then “Aha!” might not be a very wise thing to say.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Rabbit took out a pencil and licked its end.
        - id: ch01-b32
          speaker: rabbit
          text: >-
            Piglet, you haven't any courage.
        - id: ch01-b33
          speaker: piglet
          text: >-
            It's hard to be brave when you're a Very Small Animal.
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            Rabbit started writing busily, then looked up.
        - id: ch01-b35
          speaker: rabbit
          text: >-
            Being very small is exactly why you'll be useful in this adventure.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The thought of being useful made Piglet so excited that he forgot to be afraid. Rabbit went on to explain that Kangas were fierce only during the winter months. At every other time of year, he said, they were affectionate animals. By then, Piglet could hardly sit still. He was eager to begin being useful right away.
        - id: ch01-b37
          speaker: pooh
          text: >-
            What about me? Won't I be useful?
          emotion: sad
        - id: ch01-b38
          speaker: piglet
          text: >-
            Never mind, Pooh. Maybe another time.
          emotion: calm
        - id: ch01-b39
          speaker: rabbit
          text: >-
            Without Pooh, this adventure would be impossible.
        - id: ch01-b40
          speaker: piglet
          text: >-
            Oh.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Piglet tried very hard not to look disappointed. Pooh went into a corner of the room feeling proud. “Impossible without Me!” he said to himself. That, he thought, was the sort of Bear he was.
        - id: ch01-b42
          speaker: rabbit
          text: >-
            Listen, both of you. Here is the plan to capture Baby Roo. First, Kanga runs faster than any of us, even me. Second, she never takes her eyes off Roo unless he's buttoned safely inside her pocket. That means we'll need a long head start. Now, here's my thought. Suppose Roo jumps out of the pocket and Piglet jumps in. Kanga won't know they've traded places, because Piglet is a Very Small Animal. Just like Roo. Of course, Kanga must be looking somewhere else when Piglet gets in. That is where Pooh comes in. If Pooh talks to her very excitedly, she may turn her head for one moment. Then I can pick up Roo and run away with him. Quickly. And Kanga won't discover the difference until afterward.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Rabbit finished reading his plan with great pride. For a while, no one spoke. Piglet opened and closed his mouth without making a sound. At last, he managed a hoarse little question.
        - id: ch01-b44
          speaker: piglet
          text: >-
            And what happens later?
        - id: ch01-b45
          speaker: rabbit
          text: >-
            What do you mean?
        - id: ch01-b46
          speaker: piglet
          text: >-
            When Kanga finds out I'm not Roo?
        - id: ch01-b47
          speaker: rabbit
          text: >-
            Then all of us say, “Aha!”
        - id: ch01-b48
          speaker: piglet
          text: >-
            All three of us?
        - id: ch01-b49
          speaker: rabbit
          text: >-
            Yes.
        - id: ch01-b50
          speaker: piglet
          text: >-
            Oh. That's fine, as long as all three of us say it together. I don't mind then. I just wouldn't care to stand there and say “Aha!” all by myself. It wouldn't sound nearly as good that way. And Rabbit, you're completely sure about what you said before? About Kangas only being fierce in winter?
        - id: ch01-b51
          speaker: rabbit
          text: >-
            Winter?
        - id: ch01-b52
          speaker: piglet
          text: >-
            Yes. You said they're only fierce during the winter months.
        - id: ch01-b53
          speaker: rabbit
          text: >-
            Oh, yes. That's all settled. Pooh, do you understand your part?
        - id: ch01-b54
          speaker: pooh
          text: >-
            No, not yet. What do I do?
        - id: ch01-b55
          speaker: rabbit
          text: >-
            Keep talking to Kanga so hard that she doesn't notice anything.
        - id: ch01-b56
          speaker: pooh
          text: >-
            What should I talk about?
        - id: ch01-b57
          speaker: rabbit
          text: >-
            Whatever you like.
        - id: ch01-b58
          speaker: pooh
          text: >-
            Could I tell her some poetry?
        - id: ch01-b59
          speaker: rabbit
          text: >-
            Exactly. Splendid. Let's go.
        - id: ch01-b60
          speaker: narrator
          text: >-
            And all three went to find Kanga.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Kanga and Roo were spending a quiet afternoon in a sandy part of the Forest. Roo practiced the smallest jumps you could imagine. Every so often, he fell into a mouse hole and had to climb back out again. Kanga moved around him, keeping an eye on every jump and reminding him that it was nearly time to leave.
        - id: ch01-b62
          speaker: kanga
          text: >-
            One last jump, dear. Then we must go home.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Just then, Pooh came thumping up the hill.
        - id: ch01-b64
          speaker: pooh
          text: >-
            Good afternoon, Kanga.
        - id: ch01-b65
          speaker: kanga
          text: >-
            Good afternoon, Pooh.
        - id: ch01-b66
          speaker: roo
          text: >-
            Watch me jump!
          emotion: happy
        - id: ch01-b67
          speaker: narrator
          text: >-
            Roo squeaked, and promptly fell into another mouse hole.
        - id: ch01-b68
          speaker: pooh
          text: >-
            Hello there, little Roo!
        - id: ch01-b69
          speaker: kanga
          text: >-
            We were just about to leave. Good afternoon, Rabbit. Good afternoon, Piglet.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Rabbit and Piglet had come up the other side of the hill.
        - id: ch01-b71
          speakers: [rabbit, piglet]
          ensemble: duo
          text: >-
            Hello, Roo!
        - id: ch01-b72
          speaker: narrator
          text: >-
            Roo wanted Rabbit and Piglet to watch him jump too, so they stayed on the hill and watched. Kanga's eyes followed every jump. Rabbit waited, then winked at Pooh once. Pooh did nothing. Rabbit winked a second time, and Pooh finally remembered that he was supposed to talk.
        - id: ch01-b73
          speaker: pooh
          text: >-
            Kanga, are you interested in poetry?
        - id: ch01-b74
          speaker: kanga
          text: >-
            Hardly at all.
        - id: ch01-b75
          speaker: pooh
          text: >-
            Oh.
        - id: ch01-b76
          speaker: kanga
          text: >-
            Roo, dear, just one more jump. Then we really must go.
        - id: ch01-b77
          speaker: narrator
          text: >-
            There was a brief silence while Roo fell down another mouse hole. Rabbit whispered loudly behind his paw.
        - id: ch01-b78
          speaker: rabbit
          text: >-
            Keep talking!
        - id: ch01-b79
          speaker: pooh
          text: >-
            Speaking of poetry, I made up a little piece on the way here. It went... well... let me remember.
        - id: ch01-b80
          speaker: kanga
          text: >-
            How nice. Now, Roo, dear—
        - id: ch01-b81
          speaker: rabbit
          text: >-
            You'll enjoy Pooh's poem.
        - id: ch01-b82
          speaker: piglet
          text: >-
            You'll love it.
        - id: ch01-b83
          speaker: rabbit
          text: >-
            Listen closely.
        - id: ch01-b84
          speaker: piglet
          text: >-
            You don't want to miss a bit.
        - id: ch01-b85
          speaker: kanga
          text: >-
            Of course.
        - id: ch01-b86
          speaker: narrator
          text: >-
            But Kanga kept watching Roo.
        - id: ch01-b87
          speaker: rabbit
          text: >-
            How does it begin, Pooh?
        - id: ch01-b88
          speaker: narrator
          text: >-
            Pooh coughed softly and began his poem, “Lines Written by a Bear of Very Little Brain.”
        - id: ch01-b89
          speaker: pooh
          text: >-
            On Monday, when the sun is hot, I wonder to myself a lot: Now is it true, or is it not, that what is which and which is what? On Tuesday, when it hails and snows, the feeling in me grows and grows that hardly anybody knows if those are these or these are those. On Wednesday, when the sky is blue, and I have nothing else to do, I sometimes wonder if it's true that who is what and what is who. On Thursday, when it starts to freeze, and frost is sparkling on the trees, how easy then it is to see that these are whose—but whose are these? On Friday—
        - id: ch01-b90
          speaker: kanga
          text: >-
            Yes, it is, isn't it? One more jump, Roo, and then we truly have to go.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Rabbit nudged Pooh to hurry him along.
        - id: ch01-b92
          speaker: pooh
          text: >-
            Speaking of poetry, have you noticed that tree over there?
        - id: ch01-b93
          speaker: kanga
          text: >-
            Where? Now, Roo—
        - id: ch01-b94
          speaker: pooh
          text: >-
            Over there, behind you.
        - id: ch01-b95
          speaker: kanga
          text: >-
            No, I haven't. Jump into my pocket now, Roo, and we'll go home.
        - id: ch01-b96
          speaker: rabbit
          text: >-
            You really ought to look at that tree. Shall I help you into the pocket, Roo?
        - id: ch01-b97
          speaker: narrator
          text: >-
            Rabbit picked Roo up.
        - id: ch01-b98
          speaker: pooh
          text: >-
            I can see a bird in the tree. Or perhaps it's a fish.
        - id: ch01-b99
          speaker: rabbit
          text: >-
            You should see that bird from here. Unless it is a fish.
        - id: ch01-b100
          speaker: piglet
          text: >-
            It's a bird, not a fish.
        - id: ch01-b101
          speaker: rabbit
          text: >-
            So it is.
        - id: ch01-b102
          speaker: pooh
          text: >-
            Is it a starling or a blackbird?
        - id: ch01-b103
          speaker: rabbit
          text: >-
            That's exactly the question. Blackbird or starling?
        - id: ch01-b104
          speaker: narrator
          text: >-
            At last, Kanga turned to look. The instant her head moved, Rabbit called out.
        - id: ch01-b105
          speaker: rabbit
          text: >-
            Into the pocket, Roo!
        - id: ch01-b106
          speaker: narrator
          text: >-
            Piglet sprang straight into Kanga's pocket. At the same moment, Rabbit tucked Roo into his paws and scampered away as fast as his legs could carry him. By the time Kanga turned around again, Rabbit and Roo were already gone.
        - id: ch01-b107
          speaker: kanga
          text: >-
            Where did Rabbit go? Are you all right, Roo, dear?
        - id: ch01-b108
          speaker: narrator
          text: >-
            From the bottom of the pocket, Piglet made a tiny squeak like Roo.
        - id: ch01-b109
          speaker: pooh
          text: >-
            Rabbit suddenly remembered something he had to take care of.
        - id: ch01-b110
          speaker: kanga
          text: >-
            And Piglet?
        - id: ch01-b111
          speaker: pooh
          text: >-
            I think Piglet remembered something at the same time. Suddenly.
        - id: ch01-b112
          speaker: kanga
          text: >-
            Well, we need to get home. Goodbye, Pooh.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Kanga was gone in three enormous jumps. Pooh stood on the hill and watched her. He wished he could jump the way she did. After considering the matter, he decided that some people could jump like that and some could not. That was simply how things were.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Down in the pocket, Piglet sometimes wished Kanga could not jump at all. Many times, after a long walk home through the Forest, he had wished that he could be a bird and fly instead. Now he shot up and down so violently that his thoughts came in jerks. If this was what flying felt like, he decided, he would never try it again.
        - id: ch01-b115
          speaker: piglet
          text: >-
            Ooooooo!
          emotion: fearful
        - id: ch01-b116
          speaker: narrator
          text: >-
            That was when he went up.
        - id: ch01-b117
          speaker: piglet
          text: >-
            Ow!
          emotion: fearful
        - id: ch01-b118
          speaker: narrator
          text: >-
            That was when he came down. All the way to Kanga's house, Piglet went, “Ooooooo-ow! Ooooooo-ow! Ooooooo-ow!”
        - id: ch01-b119
          speaker: narrator
          text: >-
            As soon as Kanga unbuttoned her pocket, she saw what had happened. For one moment, she thought she was frightened. Then she knew she was not, because Christopher Robin would never let anything happen to Roo. If the others were playing a joke on her, she decided, she would play one on them.
        - id: ch01-b120
          speaker: kanga
          text: >-
            All right, Roo, dear. Time for bed.
        - id: ch01-b121
          speaker: narrator
          text: >-
            She lifted Piglet from her pocket.
        - id: ch01-b122
          speaker: piglet
          text: >-
            Aha!
        - id: ch01-b123
          speaker: narrator
          text: >-
            Piglet said it as well as he could after that terrifying ride. But it was a weak and breathless little “Aha!” Kanga showed no sign that she understood what it was meant to tell her.
        - id: ch01-b124
          speaker: kanga
          text: >-
            Bath first.
          emotion: happy
        - id: ch01-b125
          speaker: piglet
          text: >-
            Aha!
        - id: ch01-b126
          speaker: narrator
          text: >-
            Piglet tried “Aha!” once more and looked around anxiously for Pooh and Rabbit. Neither of them was there. Rabbit was at his own house, playing with Baby Roo and growing fonder of him every minute. Pooh had decided that he would like to be a Kanga. He was still at the sandy place on top of the Forest, practicing one jump after another.
        - id: ch01-b127
          speaker: kanga
          text: >-
            Perhaps a cold bath would be a good idea tonight. Would you like that, Roo, dear?
        - id: ch01-b128
          speaker: narrator
          text: >-
            Piglet had never been very fond of baths, and a cold bath sounded worse still. He gave one long, indignant shudder. Then he gathered all the courage he had and spoke in the bravest voice he could manage.
        - id: ch01-b129
          speaker: piglet
          text: >-
            Kanga, the time has come to spleak painly.
        - id: ch01-b130
          speaker: kanga
          text: >-
            What a funny little Roo.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Kanga began preparing the bath.
        - id: ch01-b132
          speaker: piglet
          text: >-
            I am not Roo! I'm Piglet!
          emotion: angry
        - id: ch01-b133
          speaker: kanga
          text: >-
            Yes, dear, of course. And now you're copying Piglet's voice! How clever. What will you do next?
          emotion: calm
        - id: ch01-b134
          speaker: narrator
          text: >-
            Kanga took a large yellow bar of soap from the cupboard.
        - id: ch01-b135
          speaker: piglet
          text: >-
            Can't you see me? Don't you have eyes? Look at me!
          emotion: angry
        - id: ch01-b136
          speaker: kanga
          text: >-
            I am looking, Roo, and you remember what I said about making faces. Keep making a face like Piglet's and you may grow up to look like him. Think how sorry you'd be then. Into the bath now. I don't want to ask again.
          emotion: angry
        - id: ch01-b137
          speaker: narrator
          text: >-
            Before Piglet had time to work out where he was or what to do next, Kanga put him into the bath. She took a large washcloth, covered it with thick soap suds, and began scrubbing him firmly from one end to the other.
        - id: ch01-b138
          speaker: piglet
          text: >-
            Ow! Let me out! I'm Piglet!
          emotion: fearful
        - id: ch01-b139
          speaker: kanga
          text: >-
            Keep your mouth closed, dear, or the soap will get in. There! You see?
        - id: ch01-b140
          speaker: piglet
          text: >-
            You—you—you did that on purpose!
          emotion: angry
        - id: ch01-b141
          speaker: narrator
          text: >-
            Piglet sputtered those words as soon as he could speak again. But before he could say anything more, the foamy washcloth accidentally went into his mouth a second time.
        - id: ch01-b142
          speaker: kanga
          text: >-
            That's right, dear. Don't say anything.
        - id: ch01-b143
          speaker: narrator
          text: >-
            A minute later, Piglet was out of the bath, and Kanga was rubbing him dry with a towel.
        - id: ch01-b144
          speaker: kanga
          text: >-
            Now take your medicine, and then it's bedtime.
        - id: ch01-b145
          speaker: piglet
          text: >-
            W-what medicine?
          emotion: fearful
        - id: ch01-b146
          speaker: kanga
          text: >-
            Medicine to make you grow big and strong. You don't want to stay small and weak like Piglet, do you? Well, then.
        - id: ch01-b147
          speaker: narrator
          text: >-
            At that moment, someone knocked on the door.
        - id: ch01-b148
          speaker: kanga
          text: >-
            Come in.
        - id: ch01-b149
          speaker: narrator
          text: >-
            Christopher Robin came inside.
        - id: ch01-b150
          speaker: piglet
          text: >-
            Christopher Robin! Please tell Kanga who I am! She keeps calling me Roo, but I'm not Roo. Am I?
        - id: ch01-b151
          speaker: narrator
          text: >-
            Christopher Robin studied Piglet carefully and shook his head.
        - id: ch01-b152
          speaker: christopher_robin
          text: >-
            You can't be Roo. I just saw Roo playing at Rabbit's house.
        - id: ch01-b153
          speaker: kanga
          text: >-
            Well! Imagine that. How could I make such a mistake?
        - id: ch01-b154
          speaker: piglet
          text: >-
            See? I told you. I'm Piglet.
        - id: ch01-b155
          speaker: narrator
          text: >-
            Christopher Robin shook his head again.
        - id: ch01-b156
          speaker: christopher_robin
          text: >-
            Oh, you're not Piglet. I know Piglet very well, and he's a completely different color.
        - id: ch01-b157
          speaker: narrator
          text: >-
            Piglet started to explain that his color was different because he had just taken a bath. Then he thought it might be better not to mention the bath after all. He opened his mouth to say something else instead. At that exact moment, Kanga slipped the medicine spoon in, patted him on the back, and assured him that the medicine really tasted quite nice once you got used to it.
        - id: ch01-b158
          speaker: kanga
          text: >-
            I knew it wasn't Piglet. Who could it be?
        - id: ch01-b159
          speaker: christopher_robin
          text: >-
            Maybe he's related to Pooh. He could be a nephew or an uncle.
        - id: ch01-b160
          speaker: narrator
          text: >-
            Kanga agreed that a relation of Pooh's was probably what the strange little creature must be. Since neither of them knew exactly who he was, they decided they would have to choose a name for him themselves.
        - id: ch01-b161
          speaker: christopher_robin
          text: >-
            I'll call him Pootel. Henry Pootel for short.
        - id: ch01-b162
          speaker: narrator
          text: >-
            The moment they settled on the name, Henry Pootel Piglet wriggled out of Kanga's arms and jumped to the floor. To his great delight, Christopher Robin had left the door open. Piglet dashed through it. Never in his life had Henry Pootel Piglet run so fast. He did not slow down until he was quite close to home. When he had only a hundred yards left, he stopped running, dropped to the ground, and rolled the rest of the way. By the time he arrived, he hoped to have his own nice, comfortable color again.
        - id: ch01-b163
          speaker: narrator
          text: >-
            After all that, Kanga and Roo stayed in the Forest. In time, the animals who had worried about them became their friends. Every Tuesday, Roo went to Rabbit's house and spent the whole day with his great friend Rabbit. On those same Tuesdays, Kanga spent the day with her great friend Pooh and patiently taught him how to jump. Piglet, meanwhile, spent the day safely with his great friend Christopher Robin. And so, with Kanga and Roo now part of life in the Forest, they were all happy again.
