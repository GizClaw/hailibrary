audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 小心谨慎，紧张时语速加快，鼓起勇气时格外认真
        timbre: 轻柔稚嫩
        pace: 轻快而富有变化
        pitch: 高
  chapters:
    - id: ch01
      title: 要捉一只长鼻怪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，克里斯托弗·罗宾、维尼噗和小猪凑在一起聊天。克里斯托弗·罗宾把嘴里的东西咽下去，随口提起一件事。
        - id: ch01-b02
          speaker: christopher_robin
          text: 小猪，我今天看见长鼻怪了。
        - id: ch01-b03
          speaker: piglet
          text: 它当时在做什么？
        - id: ch01-b04
          speaker: christopher_robin
          text: 它一颠一颠地走过去了。我猜它没瞧见我。
        - id: ch01-b05
          speaker: piglet
          text: 我以前也见过一只。至少，我觉得见过。可也许那只不是。
        - id: ch01-b06
          speaker: pooh
          text: 我也见过。
        - id: ch01-b07
          speaker: narrator
          text: 噗嘴上这么说，心里却在想，长鼻怪到底长什么样。
        - id: ch01-b08
          speaker: christopher_robin
          text: 这种怪物不常见。
        - id: ch01-b09
          speaker: piglet
          text: 现在是不常见。
        - id: ch01-b10
          speaker: pooh
          text: 每年到了这个时候，都不常见。
        - id: ch01-b11
          speaker: narrator
          text: 后来，他们换了一个话题。等噗和小猪该回家了，两人就沿着百亩林边上的小路往前走。起先谁也没说多少话。到了小溪边，他们互相帮忙，踩着一块又一块石头过了水。走进石南丛以后，两人终于又能肩并肩了，于是便亲热地聊起这个，又聊起那个。小猪说，噗，你要是懂我的意思。噗说，小猪，我想的正是这个。小猪提醒他，不过话说回来，还有一件事可别忘了。噗回答，一点不错，只是我刚才一时忘了。
        - id: ch01-b12
          speaker: narrator
          text: 走到六棵松树旁边，噗回头确认没有谁在听，忽然摆出非常郑重的样子。
        - id: ch01-b13
          speaker: pooh
          text: 小猪，我已经作好一个决定了。
        - id: ch01-b14
          speaker: piglet
          text: 你决定了什么？
        - id: ch01-b15
          speaker: pooh
          text: 我要捉一只长鼻怪。
        - id: ch01-b16
          speaker: narrator
          text: 噗说完，郑重地连点了好几下头。他等着小猪问他打算怎么捉，或者惊呼一声，说噗绝对办不到。哪怕说点别的有用的话也好。可是等了一会儿，小猪一句话也没说。原来，小猪心里正后悔，这么好的主意怎么不是自己先想到的。噗只好继续往下讲。
        - id: ch01-b17
          speaker: pooh
          text: 我要用陷阱捉，而且一定得是个巧妙的陷阱。所以，你要帮我。
        - id: ch01-b18
          speaker: narrator
          text: 小猪又高兴起来了。
        - id: ch01-b19
          speaker: piglet
          text: 噗，我愿意帮忙。可我们要怎么做？
        - id: ch01-b20
          speaker: pooh
          text: 问题就在这里。究竟怎么做？
        - id: ch01-b21
          speaker: narrator
          text: 于是他们一起坐下，开始动脑筋。
    - id: ch02
      title: 巧妙的陷阱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 噗想出的第一个办法，是挖一个非常深的大坑。到时候，长鼻怪会沿路走过来，一脚掉进坑里。说到这里，噗觉得事情已经讲得很明白了。可小猪偏偏还要问，长鼻怪为什么会掉进去。
        - id: ch02-b02
          speaker: pooh
          text: 它也许边走边哼歌，还抬头看天，猜会不会下雨。等它发现大坑，已经掉到一半了。那就太迟啦。
        - id: ch02-b03
          speaker: piglet
          text: 这个陷阱很好。可要是雨已经在下了呢？
        - id: ch02-b04
          speaker: narrator
          text: 噗揉揉鼻子。他还真没想过这一点。可没过多久，他就有了答案。
        - id: ch02-b05
          speaker: pooh
          text: 要是雨已经在下，它就会看着天，猜雨什么时候停。等它看见坑，还是已经掉到一半了。那也太迟啦。
        - id: ch02-b06
          speaker: piglet
          text: 这一点既然说清楚了，我也觉得它是个巧妙的陷阱。
        - id: ch02-b07
          speaker: narrator
          text: 噗听得十分得意，仿佛那只长鼻怪已经稳稳当当地捉在手里。不过，他们还有一件事情非想明白不可。这个非常深的大坑，到底该挖在哪里？位置要是不对，再巧妙的陷阱也没有用。小猪想了想，说最合适的位置，就是长鼻怪掉下去以前站着的地方，再朝前大约一英尺。照他的说法，那正好会在长鼻怪的下一步前面。
        - id: ch02-b08
          speaker: pooh
          text: 可它会看见我们在挖坑。
        - id: ch02-b09
          speaker: piglet
          text: 它要是望着天，就看不见。
        - id: ch02-b10
          speaker: pooh
          text: 可它万一低头，就会起疑心。这事比我原先想的难。难怪长鼻怪几乎从来捉不到。
          emotion: sad
        - id: ch02-b11
          speaker: piglet
          text: 一定就是这个缘故。
        - id: ch02-b12
          speaker: narrator
          text: 他们叹着气站起来，才发现身上扎了几根金雀花刺。两人把刺拔掉，又坐了回去。这段时间里，噗一直在心里念叨，要是我能想出办法就好了。他十分相信，一个非常聪明的脑袋只要找对法子，一定能捉住长鼻怪。问题只是怎样才算找对法子。
        - id: ch02-b13
          speaker: pooh
          text: 小猪，假如你要捉我，你会怎么办？
        - id: ch02-b14
          speaker: piglet
          text: 我会设一个陷阱，再放一罐蜂蜜进去。你闻到香味，就会进去找蜂蜜，然后……
        - id: ch02-b15
          speaker: pooh
          text: 我会小心地走进去，免得撞疼自己。找到罐子以后，我先沿边上舔一圈，装作里面已经空了。接着走开想一想，再回来舔罐子中间，然后……
        - id: ch02-b16
          speaker: piglet
          text: 后面就不用说了。你已经待在里面，我会把你捉住。现在得先想想，长鼻怪爱吃什么。我猜是橡子。我们去找一大堆……噗，醒醒！
        - id: ch02-b17
          speaker: narrator
          text: 噗听着听着，早已沉进一个关于蜂蜜的甜美梦境。小猪把他叫醒以后，他还惦记着那只罐子，坚持说蜂蜜比橡子更能让陷阱像个陷阱。小猪原本不同意，正要跟他争论，忽然想起一件要紧的事。如果用橡子，就得由自己去找一大堆。若是用蜂蜜，噗却要拿出自己收藏的蜂蜜。与此同时，噗也想通了同一件事，正准备改口说，还是橡子好。
        - id: ch02-b18
          speaker: piglet
          text: 好吧，那就用蜂蜜。事情定了。我挖坑，你去拿蜂蜜。
        - id: ch02-b19
          speaker: pooh
          text: 好吧。
    - id: ch03
      title: 一罐蜂蜜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 噗咚咚地回到家，径直走进食橱。他搬来一把椅子，站到上面，从最高一层取下一只很大的罐子。罐上写着两个字，叫“峰蜜”。照理说，这已经很清楚了。不过噗觉得还是应当保险一点。他揭开纸盖，认真往里看。里面那种金黄的东西，看起来确实很像蜂蜜。
        - id: ch03-b02
          speaker: pooh
          text: 不过，光看可不一定准。我叔叔说过，他见过这种颜色的奶酪。
        - id: ch03-b03
          speaker: narrator
          text: 为了试出真相，噗把舌头伸进罐里，结结实实地舔了一大口。他把味道仔细尝过，这才开口下结论。
        - id: ch03-b04
          speaker: pooh
          text: 没错，是蜂蜜。从罐口到罐底，应该全是。除非有人开玩笑，在底下放了奶酪。那我最好再往深处尝一点。万一长鼻怪和我一样，不吃奶酪呢……啊！我果然没错，整罐都是蜂蜜。
        - id: ch03-b05
          speaker: narrator
          text: 噗一直尝到了罐子深处，这才完全放下心。他带着那只罐子回到小猪那里。此时，小猪已经挖出了非常深的大坑，正站在坑底。他仰起脸，看见噗抱着罐子回来了。噗告诉他罐子不太满，随后把蜂蜜从坑口扔了下去。
        - id: ch03-b06
          speaker: piglet
          text: 拿来了吗？
        - id: ch03-b07
          speaker: pooh
          text: 拿来了，不过这一罐不太满。
        - id: ch03-b08
          speaker: piglet
          text: 当然不满了！你只剩这些了吗？
        - id: ch03-b09
          speaker: pooh
          text: 是的。
        - id: ch03-b10
          speaker: narrator
          text: 噗说的是实话，因为罐里确实只剩这些。小猪把蜂蜜罐安放在大坑底下，自己爬了出来。陷阱就这样准备好了，两人一同踏上回家的路。到了噗家门口，小猪向他道过晚安，又约好第二天早晨六点在松树旁碰面。到那时，他们就能数一数，陷阱里究竟捉到了多少只长鼻怪。
        - id: ch03-b11
          speaker: pooh
          text: 六点见。小猪，你有绳子吗？
        - id: ch03-b12
          speaker: piglet
          text: 没有。你要绳子做什么？
        - id: ch03-b13
          speaker: pooh
          text: 好牵它们回家。
        - id: ch03-b14
          speaker: piglet
          text: 噢！我想，只要吹声口哨，长鼻怪就会跟过来。
        - id: ch03-b15
          speaker: pooh
          text: 有些会，有些不会。这种事谁也说不准。晚安！
        - id: ch03-b16
          speaker: piglet
          text: 晚安！
        - id: ch03-b17
          speaker: narrator
          text: 小猪一溜小跑，回到写着“闲人勿进·威”的家里。噗也准备睡觉了。
        - id: ch03-b18
          speaker: narrator
          text: 几个钟头过去，夜色开始悄悄退去。噗忽然醒了，心里直往下沉。他以前有过这种感觉，知道这表示他饿了。他跑到食橱，站上椅子，往最高一层摸去，却什么也没有。
        - id: ch03-b19
          speaker: pooh
          text: 真奇怪。那里明明有满满一罐蜂蜜，装得一直到罐口。罐上还写着“峰蜜”，免得我认错。真奇怪。
        - id: ch03-b20
          speaker: narrator
          text: 他来回走着，猜蜂蜜去了哪里，还用唱歌似的调子低声哼起来。
        - id: ch03-b21
          speaker: pooh
          text: 这事真是怪又怪，我明明有蜂蜜在。罐上标签写得清，叫作“峰蜜”。美味满罐装得足，如今不知去了何处。是呀，不知去了哪里，真是稀奇。
        - id: ch03-b22
          speaker: narrator
          text: 噗把歌唱了三遍，突然记起来了。蜂蜜已经让他放进巧妙的陷阱，用来捉长鼻怪。
        - id: ch03-b23
          speaker: pooh
          text: 真麻烦！都是因为我非要对长鼻怪这么好。
        - id: ch03-b24
          speaker: narrator
          text: 噗重新钻进床里，却怎么也睡不着。他越用力想睡，反而越是清醒。先试着数绵羊，这个办法有时很灵，可今天一点儿也不管用。于是他改数长鼻怪，结果比刚才还糟。每一只数到的长鼻怪，都径直冲向噗的蜂蜜罐，把里面吃得一滴不剩。噗苦恼地躺了好几分钟，眼看着一只又一只想象中的长鼻怪来吃他的蜂蜜。等他数到第五百八十七只，那家伙正舔着嘴巴，还在夸那罐蜂蜜。噗再也没办法假装不在意了。
        - id: ch03-b25
          speaker: pooh
          text: 这蜂蜜真好。我可不记得吃过更好的。
        - id: ch03-b26
          speaker: narrator
          text: 噗终于受不了了。他跳下床，冲出屋子，直奔六棵松树。
    - id: ch04
      title: 坑里的长鼻怪
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 太阳还在睡觉，可百亩林上方的天空已经有了微光，像是快要醒来，很快便会踢开被子。半明半暗之中，六棵松树看起来又冷又孤单。那个非常深的大坑显得比原来还要深。坑底的蜂蜜罐神神秘秘的，只剩一个模糊的影子，根本看不清是什么。噗越走越近，鼻子先替眼睛认出了蜂蜜。他的舌头也跟着伸出来，把嘴巴舔得干干净净，准备迎接罐里剩下的美味。
        - id: ch04-b02
          speaker: pooh
          text: 真麻烦！有长鼻怪吃过了！噢，不对，是我吃的。我忘记了。
        - id: ch04-b03
          speaker: narrator
          text: 蜂蜜确实已经叫噗吃掉了大半。不过，罐子最底下还留着薄薄一点。想要够到那里，只伸舌头可不行。噗索性把整个脑袋都塞进罐口，一直探到深处，认认真真地舔了起来。
        - id: ch04-b04
          speaker: narrator
          text: 过了一阵，小猪醒了。他先对自己说“噢”，又勇敢地说“是的”，接着更加勇敢地说“正是如此”。可他心里一点也不勇敢。“长鼻怪”这个词正在脑袋里颠来跳去。那怪物长什么样？凶不凶？吹口哨时，它真的会来吗？又会怎么来？它喜欢小猪吗？若是喜欢，哪一种小猪都一样吗？假如它对小猪很凶，那么，这只小猪有个叫“闲人勿进·威廉”的祖父，会不会有点分别？
        - id: ch04-b05
          speaker: narrator
          text: 小猪一个答案也不知道。最要紧的是，再过大约一个钟头，他就要见到生平第一只长鼻怪了。噗当然会陪着他，两个人在一起，总比一个人更叫人安心。可万一长鼻怪不光对小猪很凶，对熊也一样凶呢？也许他可以假装头疼，今天早晨便不用去六棵松树那里。可是再一想，万一今天天气很好，坑里根本没有长鼻怪，他岂不是要躺在床上，白白浪费掉整个早晨？小猪想来想去，不知道该选哪一个办法。
        - id: ch04-b06
          speaker: narrator
          text: 最后，小猪有了聪明的主意。他现在就悄悄过去，先看一眼。坑里要是有长鼻怪，他就回家躺下。要是没有，他就不回去。
        - id: ch04-b07
          speaker: narrator
          text: 小猪就这样出了门。刚走上路时，他觉得陷阱里大概不会有长鼻怪。又往前走了一段，他转而觉得，里面也许真的会有一只。等他离六棵松树越来越近，心里就再也没有疑问了。坑里一定有长鼻怪，因为他已经听见，那东西正在里面拼命折腾，闹出的动静可不小。
        - id: ch04-b08
          speaker: piglet
          text: 哎呀，哎呀，哎呀！
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: 小猪一听，恨不得立刻转身逃走。可是也不知道为什么，他觉得自己既然已经走得这么近，总得亲眼看看长鼻怪是什么模样才行。不看清楚就这样逃掉，他又有些不甘心。于是他压低身子，一步一步挪过去，尽量不发出声音。到了陷阱边上，他鼓足勇气，把脑袋探过去，朝下面望了一眼。
        - id: ch04-b10
          speaker: narrator
          text: 这时候，噗一直在设法把罐子从头上拔下来。他越摇，罐子套得越紧。
        - id: ch04-b11
          speaker: pooh
          text: 真麻烦！救命啊！嗷！
        - id: ch04-b12
          speaker: narrator
          text: 噗试着拿罐子去撞四周，希望能把它撞下来。可他看不见自己撞到了什么，这办法一点忙也帮不上。他又摸索着想爬出陷阱，眼前却只有套住脑袋的罐子，而且连罐子里面也看不了多少。他完全找不到该往哪边走。试过所有这些办法以后，噗只好把脑袋高高抬起，连罐子也一同举了起来。他发出一声响亮的吼叫，里面满是悲伤和绝望。偏偏就在这一刻，小猪从坑边探出头，向下看去。
        - id: ch04-b13
          speaker: piglet
          text: 救命啊！长鼻怪！一只可怕的长鼻怪！救命，可怕的长怪鼻！怪、怪，一只怕长鼻！鼻、鼻，一只长怕怪鼻！
          emotion: fearful
        - id: ch04-b14
          speaker: narrator
          text: 小猪一边把那些词喊得乱七八糟，一边使出全身力气逃跑。他的腿一刻不停，嘴巴也一刻不停。就这样，他从六棵松树一直跑到克里斯托弗·罗宾家里。等他冲进去时，克里斯托弗·罗宾才刚刚起床。
        - id: ch04-b15
          speaker: christopher_robin
          text: 小猪，你这是怎么了？
        - id: ch04-b16
          speaker: piglet
          text: 长……长……长鼻怪。
          emotion: fearful
        - id: ch04-b17
          speaker: christopher_robin
          text: 在哪儿？
        - id: ch04-b18
          speaker: piglet
          text: 就在那边。
        - id: ch04-b19
          speaker: christopher_robin
          text: 它长得什么样？
        - id: ch04-b20
          speaker: piglet
          text: 它的脑袋大得你从没见过。大得不得了，像……像什么也不像。一个特别大的……我说不清……就像一个大得不得了的“什么也没有”。像一只罐子。
        - id: ch04-b21
          speaker: christopher_robin
          text: 那我去看看。你也来吧。
        - id: ch04-b22
          speaker: narrator
          text: 克里斯托弗·罗宾说着便穿起鞋来。有他在身边，小猪觉得自己没有什么可怕的了。于是，两个人一同出门，沿着小猪刚才逃回来的路，再次朝六棵松树走去。
    - id: ch05
      title: 罐子碎了
      blocks:
        - id: ch05-b01
          speaker: piglet
          text: 我听见它了。你也听见了，对不对？
        - id: ch05-b02
          speaker: christopher_robin
          text: 我的确听见了什么声音。
        - id: ch05-b03
          speaker: narrator
          text: 声音确实是从陷阱那边传来的。原来，噗在黑暗中摸到了一根树根，正拿套着罐子的脑袋一下又一下往上撞。
        - id: ch05-b04
          speaker: piglet
          text: 又响了！是不是可怕极了？
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: 小猪紧紧拉住克里斯托弗·罗宾的手，不肯松开。突然，克里斯托弗·罗宾大笑起来。他一直笑，一直笑，笑了一遍又一遍，怎么也停不下来。就在他的笑声里，“砰”的一下，长鼻怪的脑袋重重撞上那根树根。紧接着又是“啪啦”一响，套在头上的罐子碎开了。所谓长鼻怪不见了，维尼噗的脑袋重新露了出来。
        - id: ch05-b06
          speaker: narrator
          text: 这下，小猪终于明白，自己刚才是多么傻的一只小猪。他想到自己一路乱喊，还把蜂蜜罐当成那么可怕的怪物，羞得不得了。于是他径直跑回家，真的像头疼一样，上床躺着去了。克里斯托弗·罗宾和噗没有跟去。他们两个一同回家吃早饭去了。
        - id: ch05-b07
          speaker: christopher_robin
          text: 噢，熊！我真是太喜欢你了！
          emotion: happy
        - id: ch05-b08
          speaker: pooh
          text: 我也喜欢我。
