audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    piglet:
      display_name: Piglet
      tts:
        delivery: eager and delicately expressive
        timbre: small and bright
        pace: lightly quick
        pitch: high
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Cunning Trap
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, Christopher Robin, Winnie-the-Pooh, and Piglet were talking
            together. Christopher Robin finished what he was eating and casually
            told Piglet something remarkable.
        - id: ch01-b02
          speaker: christopher_robin
          text: >-
            I saw a Heffalump today, Piglet.
        - id: ch01-b03
          speaker: piglet
          text: >-
            What was it doing?
        - id: ch01-b04
          speaker: christopher_robin
          text: >-
            Oh, just lumping along. I don't believe it noticed me.
        - id: ch01-b05
          speaker: piglet
          text: >-
            I've seen one before. At least, I believe I have. Though maybe it
            wasn't one after all.
        - id: ch01-b06
          speaker: pooh
          text: >-
            I've seen one, too.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Pooh said this while wondering what a Heffalump might look like.
        - id: ch01-b08
          speaker: christopher_robin
          text: >-
            You don't see them very often.
        - id: ch01-b09
          speaker: piglet
          text: >-
            Not these days.
        - id: ch01-b10
          speaker: pooh
          text: >-
            Not during this part of the year.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Soon they began talking about something else. Later, when it was time
            to go, Pooh and Piglet set off for home together. They followed the
            path beside the Hundred Acre Wood without saying much. Then they helped
            each other over the stepping stones in the stream. Once they were
            walking side by side across the heather, their friendly conversation
            began again.
        - id: ch01-b12
          speaker: piglet
          text: >-
            You understand what I mean, don't you, Pooh?
        - id: ch01-b13
          speaker: pooh
          text: >-
            That's exactly what I was thinking, Piglet.
        - id: ch01-b14
          speaker: piglet
          text: >-
            Still, Pooh, we have to keep the other side of it in mind.
        - id: ch01-b15
          speaker: pooh
          text: >-
            Quite right. I had forgotten that part for a moment.
        - id: ch01-b16
          speaker: narrator
          text: >-
            When they reached the Six Pine Trees, Pooh looked around to make sure
            no one else could hear. Then his voice turned very solemn.
        - id: ch01-b17
          speaker: pooh
          text: >-
            Piglet, I've made a decision.
        - id: ch01-b18
          speaker: piglet
          text: >-
            What have you decided?
        - id: ch01-b19
          speaker: pooh
          text: >-
            I'm going to catch a Heffalump.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Pooh nodded several times. He waited for Piglet to ask how, or to say
            it couldn't be done, or to offer some other helpful remark. But Piglet
            didn't say a word. He was too busy wishing that the idea of catching a
            Heffalump had come to him first. Pooh waited a little longer before he
            went on.
        - id: ch01-b21
          speaker: pooh
          text: >-
            I'll catch it with a trap. It will have to be a Cunning Trap, so I'll
            need your help.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Piglet felt happy again.
        - id: ch01-b23
          speaker: piglet
          text: >-
            Of course I'll help. How are we going to make it?
        - id: ch01-b24
          speaker: pooh
          text: >-
            That's the question. How?
        - id: ch01-b25
          speaker: narrator
          text: >-
            They sat down together and began to think.
    - id: ch02
      title: Honey in the Pit
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Pooh's first plan was to dig a Very Deep Pit. A Heffalump would come
            along, tumble into it, and then...
        - id: ch02-b02
          speaker: piglet
          text: >-
            Why?
        - id: ch02-b03
          speaker: pooh
          text: >-
            Why what?
        - id: ch02-b04
          speaker: piglet
          text: >-
            Why would the Heffalump tumble in?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Pooh rubbed his nose with his paw. Perhaps, he explained, the
            Heffalump would be strolling along, humming a song and staring at the
            sky while it wondered whether rain was coming. It wouldn't notice the
            Very Deep Pit until it was halfway down. By then, it would be too late.
        - id: ch02-b06
          speaker: piglet
          text: >-
            That's a very good trap. But what if it's raining already?
        - id: ch02-b07
          speaker: narrator
          text: >-
            Pooh rubbed his nose again. He had not considered that. Then his face
            brightened. If rain was already falling, the Heffalump would still be
            watching the sky, only now it would be wondering when the weather would
            clear. Once again, it wouldn't see the pit until it was halfway down,
            when it was too late.
        - id: ch02-b08
          speaker: piglet
          text: >-
            Now that you've explained that part, I can see it really is a Cunning
            Trap.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Pooh felt very proud. The Heffalump seemed almost caught already. But
            one question remained, and the whole trap depended on it. They had to
            decide where the Very Deep Pit should go.
        - id: ch02-b10
          speaker: piglet
          text: >-
            We should put it wherever the Heffalump will be right before it falls
            in. About one foot ahead of that spot.
        - id: ch02-b11
          speaker: pooh
          text: >-
            But then it would watch us digging.
        - id: ch02-b12
          speaker: piglet
          text: >-
            Not while it's looking at the sky.
        - id: ch02-b13
          speaker: pooh
          text: >-
            If it happened to glance down, it would become Suspicious.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Pooh thought for a long while. When he spoke again, he sounded sad.
        - id: ch02-b15
          speaker: pooh
          text: >-
            This isn't nearly as easy as I expected. That must be why people hardly
            ever catch Heffalumps.
          emotion: sad
        - id: ch02-b16
          speaker: piglet
          text: >-
            Yes, that must be the reason.
        - id: ch02-b17
          speaker: narrator
          text: >-
            They sighed and stood up. After pulling a few gorse prickles out of
            themselves, they sat down again. Pooh kept thinking, If only I could
            come up with something! The thought went around and around inside his
            head. He felt sure that a Very Clever Brain could catch a Heffalump. It
            only needed to discover the proper way to do it.
        - id: ch02-b18
          speaker: pooh
          text: >-
            Suppose you wanted to catch me. What would you do?
        - id: ch02-b19
          speaker: piglet
          text: >-
            Well, I would build a trap and put a jar of honey inside. You'd smell
            the honey, and you'd follow the smell into the trap, and then...
        - id: ch02-b20
          speaker: pooh
          text: >-
            I'd go in after it, but very carefully, so I wouldn't hurt myself. When
            I reached the jar, I'd lick all around the rim first and pretend there
            wasn't any honey left. Then I'd walk away to think for a little while.
            After that, I'd come back and begin licking the middle, and then...
          emotion: happy
        - id: ch02-b21
          speaker: piglet
          text: >-
            Never mind all that. You'd be inside, and I would catch you. What we
            need to know is what Heffalumps like. Acorns, perhaps? We could gather
            plenty of... Pooh, wake up!
        - id: ch02-b22
          speaker: narrator
          text: >-
            Pooh had drifted into a pleasant dream. He woke with a start and said
            honey would make much better bait than acorns. Piglet disagreed. They
            were about to argue when Piglet remembered that acorn bait meant he
            would have to gather the acorns. If they used honey, Pooh would have to
            give up some of his own honey instead. That made honey seem like the
            better answer to Piglet. At that very moment, Pooh remembered exactly
            the same thing from the other side. Honey would have to come from his
            own supply, so he was just about to agree that acorns were best.
        - id: ch02-b23
          speaker: piglet
          text: >-
            All right, we'll use honey.
        - id: ch02-b24
          speaker: narrator
          text: >-
            Piglet repeated the word thoughtfully, as though everything were
            settled.
        - id: ch02-b25
          speaker: piglet
          text: >-
            Honey. I'll dig the pit, and you can fetch it.
        - id: ch02-b26
          speaker: pooh
          text: >-
            Very well.
        - id: ch02-b27
          speaker: narrator
          text: >-
            Pooh stumped home and went straight to his pantry. He stood on a chair
            and took a very large jar from the top shelf. The jar said HUNNY. Still,
            Pooh removed the paper cover and looked inside, just to make certain.
            It certainly looked like honey.
        - id: ch02-b28
          speaker: pooh
          text: >-
            You can never be too sure. My uncle once saw cheese that was exactly
            this color.
        - id: ch02-b29
          speaker: narrator
          text: >-
            Pooh put in his tongue and took a large lick.
        - id: ch02-b30
          speaker: pooh
          text: >-
            Yes, this is honey. There's no doubt. I expect it's honey all the way
            to the bottom. Unless somebody hid cheese down there as a joke. I'd
            better taste a little deeper, just in case. Heffalumps may not like
            cheese, just as I don't.
        - id: ch02-b31
          speaker: narrator
          text: >-
            After another taste, Pooh gave a deep sigh.
        - id: ch02-b32
          speaker: pooh
          text: >-
            Ah! I was right. It is honey all the way down.
          emotion: happy
        - id: ch02-b33
          speaker: narrator
          text: >-
            Once he had made quite certain, Pooh carried the jar back. Piglet
            looked up from the bottom of the Very Deep Pit.
        - id: ch02-b34
          speaker: piglet
          text: >-
            Did you bring it?
        - id: ch02-b35
          speaker: pooh
          text: >-
            Yes, though the jar isn't completely full.
        - id: ch02-b36
          speaker: narrator
          text: >-
            Pooh tossed it down.
        - id: ch02-b37
          speaker: piglet
          text: >-
            It certainly isn't! Is this really all that's left?
          emotion: surprised
        - id: ch02-b38
          speaker: pooh
          text: >-
            Yes.
        - id: ch02-b39
          speaker: narrator
          text: >-
            And it was. Piglet placed the jar at the bottom, climbed out, and went
            home with Pooh. At Pooh's house, they said good night.
        - id: ch02-b40
          speaker: piglet
          text: >-
            We'll meet by the Pine Trees at six tomorrow morning and count how many
            Heffalumps we caught.
        - id: ch02-b41
          speaker: pooh
          text: >-
            Six o'clock. Do you have any string?
        - id: ch02-b42
          speaker: piglet
          text: >-
            No. What do you need string for?
        - id: ch02-b43
          speaker: pooh
          text: >-
            To lead the Heffalumps home.
        - id: ch02-b44
          speaker: piglet
          text: >-
            Oh! I believe Heffalumps follow you if you whistle.
        - id: ch02-b45
          speaker: pooh
          text: >-
            Some will, and some won't. With Heffalumps, you can never be sure. Good
            night, Piglet.
        - id: ch02-b46
          speaker: piglet
          text: >-
            Good night, Pooh.
        - id: ch02-b47
          speaker: narrator
          text: >-
            Piglet trotted away to his house marked TRESPASSERS W, while Pooh got
            ready for bed.
    - id: ch03
      title: Pooh Goes Back for the Honey
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Several hours passed. Just as the night began to slip away, Pooh woke
            with a sinking feeling. He had felt it before, and he knew exactly what
            it meant. He was hungry. He went to the pantry, climbed onto a chair,
            reached for the top shelf, and found nothing there.
        - id: ch03-b02
          speaker: pooh
          text: >-
            That's strange. I'm sure there was a jar of honey on this shelf. It was
            full right to the top, and HUNNY was written on it so I'd know what it
            was. Very strange indeed.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Pooh wandered back and forth, wondering where the jar had gone. He
            murmured a little song to himself.
        - id: ch03-b04
          speaker: pooh
          text: >-
            It's very, very funny, because I know I had some honey. There was a
            label saying HUNNY on a lovely, full-up pot. Now I don't know where it
            got to. No, I don't know where it's gone. Well, it's funny.
        - id: ch03-b05
          speaker: narrator
          text: >-
            He sang the murmur three times. Then he suddenly remembered. He had put
            the jar into the Cunning Trap for the Heffalump.
        - id: ch03-b06
          speaker: pooh
          text: >-
            Bother! This is what happens when you try to be kind to Heffalumps.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Pooh climbed back into bed, but sleep would not come. The harder he
            tried, the wider awake he felt. First he counted sheep. That sometimes
            helped, but not tonight. So he counted Heffalumps instead, which was
            much worse. Every Heffalump marched straight toward Pooh's honey and
            ate every bit of it. One after another they reached the pot, and not a
            single Heffalump left any honey behind for Pooh.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Pooh lay there miserably for several minutes. At last, the five hundred
            and eighty-seventh Heffalump licked its jaws and spoke to itself.
        - id: ch03-b09
          speaker: pooh
          text: >-
            What excellent honey. I can't remember ever tasting better.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Pooh could stand no more. He leaped out of bed, rushed from the house,
            and ran straight to the Six Pine Trees.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The sun was still asleep. A pale glow above the Hundred Acre Wood made
            it seem as if the morning was waking and would soon kick off its
            blankets. In the dim light, the Pine Trees looked cold and lonely. The
            Very Deep Pit looked deeper than it really was. Far below, Pooh's honey
            jar was only a mysterious shape.
        - id: ch03-b12
          speaker: narrator
          text: >-
            As Pooh came closer, his nose assured him that the shape was honey. His
            tongue came out and polished his mouth, getting it ready. Then Pooh
            pushed his nose into the jar.
        - id: ch03-b13
          speaker: pooh
          text: >-
            Bother! A Heffalump has eaten some!
          emotion: surprised
        - id: ch03-b14
          speaker: narrator
          text: >-
            He thought for a moment.
        - id: ch03-b15
          speaker: pooh
          text: >-
            Oh, no. I ate it. I forgot.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Pooh had eaten most of the honey, but a little remained at the very
            bottom. He pushed his whole head into the jar and began to lick.
    - id: ch04
      title: The Horrible Heffalump
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After a while, Piglet woke up. The moment his eyes opened, he spoke to
            himself.
        - id: ch04-b02
          speaker: piglet
          text: >-
            Oh! Yes. Quite so.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Piglet made each answer braver than the one before, though he did not
            feel brave. One word kept jiggeting around inside his head. Heffalumps.
            What did a Heffalump look like? Was it fierce? Would it really come
            when somebody whistled? If it did, what sort of way would it come? Did
            it like Pigs at all? If it was fond of them, would the particular sort
            of Pig make any difference? And if it was fierce with Pigs, might it
            behave differently toward a Pig whose grandfather was named
            TRESPASSERS WILLIAM?
        - id: ch04-b04
          speaker: narrator
          text: >-
            Piglet knew none of the answers, and in about an hour he would meet his
            first Heffalump. Pooh would be there, of course. Everything felt more
            Friendly with two. But what if Heffalumps were Very Fierce with both
            Pigs and Bears? Having Pooh there might not help then. Perhaps Piglet
            should pretend to have a headache. He could stay in bed and never go
            near the Six Pine Trees that morning.
        - id: ch04-b05
          speaker: narrator
          text: >-
            On the other hand, the morning might be fine and the trap might be
            empty. Then he would waste the whole morning in bed for no reason. What
            should he do? He could not settle it either way. At last, a Clever Idea
            came to him. He would leave early and go very quietly to the Six Pine
            Trees. There he would creep close to the trap and peek inside as
            cautiously as he could. If a Heffalump was there, Piglet would hurry
            home and go back to bed. If there wasn't one, he wouldn't.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Off Piglet went. At first he thought the trap would be empty. Then he
            thought it wouldn't. The nearer he came, the more certain he became
            that a Heffalump was inside, because he could hear it heffalumping
            around with all its might. Every sound made the creature in his mind
            seem more real.
        - id: ch04-b07
          speaker: piglet
          text: >-
            Oh, dear. Oh, dear. Oh, dear!
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: >-
            Piglet wanted to run. Yet after coming this far, he felt he simply had
            to see what a Heffalump looked like. He had never seen a real one
            before, and now one seemed to be just below him. So, although he was
            frightened, he crept to the edge of the trap and peered down.
        - id: ch04-b09
          speaker: narrator
          text: >-
            All this time, Winnie-the-Pooh had been struggling to pull the honey
            jar off his head. Each shake only wedged it tighter.
        - id: ch04-b10
          speaker: pooh
          text: >-
            Bother! Oh, help! Ow!
        - id: ch04-b11
          speaker: narrator
          text: >-
            Pooh bumped the jar against things, but he couldn't see what he was
            hitting, so that did no good. He tried climbing out of the pit. But all
            he could see was the inside of the jar, and not very much of that, so
            he couldn't find the way up. Nothing he tried loosened the jar or led
            him out. At last he lifted his head, jar and all, and let out a loud
            roar of sadness and despair. That was the very moment Piglet looked
            into the pit.
        - id: ch04-b12
          speaker: piglet
          text: >-
            Help! Help! There's a Heffalump! A horrible Heffalump!
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: >-
            Piglet scampered away as fast as he could, shouting all the while.
        - id: ch04-b14
          speaker: piglet
          text: >-
            Help! A herrible Hoffalump! Hoff, hoff! A hellible Horralump! Holl,
            holl! A hoffable Hellerump!
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: >-
            He did not stop shouting or running until he reached Christopher
            Robin's house. Christopher Robin was just getting up.
        - id: ch04-b16
          speaker: christopher_robin
          text: >-
            Piglet, what's the matter?
        - id: ch04-b17
          speaker: piglet
          text: >-
            Heff... a Heff... a Heff... a Heffalump!
          emotion: fearful
        - id: ch04-b18
          speaker: narrator
          text: >-
            Piglet was breathing so hard he could barely speak.
        - id: ch04-b19
          speaker: christopher_robin
          text: >-
            Where is it?
        - id: ch04-b20
          speaker: piglet
          text: >-
            Up there!
        - id: ch04-b21
          speaker: narrator
          text: >-
            Piglet waved his paw toward the Pine Trees.
        - id: ch04-b22
          speaker: christopher_robin
          text: >-
            What did it look like?
        - id: ch04-b23
          speaker: piglet
          text: >-
            It had the biggest head in the world! A huge, enormous thing, like...
            like nothing at all. A great big... well, I don't know. It looked like
            an enormous nothing. Like a jar!
          emotion: fearful
        - id: ch04-b24
          speaker: christopher_robin
          text: >-
            I'll go take a look. Come with me.
        - id: ch04-b25
          speaker: narrator
          text: >-
            Christopher Robin put on his shoes. With him beside him, Piglet wasn't
            afraid, and they set off together.
        - id: ch04-b26
          speaker: piglet
          text: >-
            You can hear it, can't you?
          emotion: fearful
        - id: ch04-b27
          speaker: narrator
          text: >-
            They were close to the trap now.
        - id: ch04-b28
          speaker: christopher_robin
          text: >-
            I hear something.
        - id: ch04-b29
          speaker: narrator
          text: >-
            The sound was Pooh knocking his jar-covered head against a tree root
            he had found.
        - id: ch04-b30
          speaker: piglet
          text: >-
            There! Isn't it awful?
          emotion: fearful
        - id: ch04-b31
          speaker: narrator
          text: >-
            Piglet clung tightly to Christopher Robin's hand. Then, without
            warning, Christopher Robin began to laugh. He laughed and laughed and
            laughed, until he could hardly stop. While he was still laughing, the
            Heffalump's great jar-shaped head struck the tree root with a crash.
            The jar smashed to pieces, and Pooh's own head came out again.
        - id: ch04-b32
          speaker: narrator
          text: >-
            Piglet saw how foolish he had been. He felt so ashamed that he ran
            straight home. Once there, he went to bed with the headache he had
            thought about pretending to have. Christopher Robin and Pooh left the
            trap together and went home for breakfast.
        - id: ch04-b33
          speaker: christopher_robin
          text: >-
            Oh, Bear! I do love you!
          emotion: happy
        - id: ch04-b34
          speaker: pooh
          text: >-
            I love you, too.
          emotion: happy
