audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
  chapters:
    - id: ch01
      title: In Which We Meet Winnie-the-Pooh and Some Bees, and the Stories Begin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Here comes Edward Bear down the stairs. Bump, bump, bump. He is on the back of his head, following Christopher Robin. As far as Edward knows, this is the only way to come downstairs. Sometimes he thinks there might be another way, if he could only stop bumping long enough to think. Then he decides there probably isn't. Anyway, he has reached the bottom now, and he is ready to meet you. This is Winnie-the-Pooh.
        - id: ch01-b02
          speaker: narrator
          text: The first time I heard that name, I asked the very question you are about to ask.
        - id: ch01-b03
          speaker: narrator
          text: But I thought Winnie was a boy.
        - id: ch01-b04
          speaker: christopher_robin
          text: I thought so too.
        - id: ch01-b05
          speaker: narrator
          text: Then you can't call him Winnie.
        - id: ch01-b06
          speaker: christopher_robin
          text: I don't.
        - id: ch01-b07
          speaker: narrator
          text: But you just said—
        - id: ch01-b08
          speaker: christopher_robin
          text: He's Winnie-ther-Pooh. Don't you know what “ther” means?
        - id: ch01-b09
          speaker: narrator
          text: Oh, yes. Now I do. I said that quickly, and I hope you understand too, because that is all the explanation you will get.
        - id: ch01-b10
          speaker: narrator
          text: Some days, when Pooh reaches the bottom of the stairs, he wants to play a game. Other days, he would rather sit quietly by the fire and hear a story. This was one of those evenings.
        - id: ch01-b11
          speaker: christopher_robin
          text: How about a story?
        - id: ch01-b12
          speaker: narrator
          text: What about one?
        - id: ch01-b13
          speaker: christopher_robin
          text: Could you tell Winnie-the-Pooh one, very sweetly?
        - id: ch01-b14
          speaker: narrator
          text: I suppose I could. What kind of story does he like?
        - id: ch01-b15
          speaker: christopher_robin
          text: A story about himself. He's that sort of Bear.
        - id: ch01-b16
          speaker: narrator
          text: Ah. I see.
        - id: ch01-b17
          speaker: christopher_robin
          text: So will you tell him one, very sweetly?
        - id: ch01-b18
          speaker: narrator
          text: I'll try. And so I did.
        - id: ch01-b19
          speaker: narrator
          text: Once upon a time, a very long time ago—about last Friday—Winnie-the-Pooh lived alone in a forest under the name of Sanders.
        - id: ch01-b20
          speaker: christopher_robin
          text: What does “under the name” mean?
        - id: ch01-b21
          speaker: narrator
          text: It means the name Sanders was painted in gold letters over his door, and Pooh lived underneath it.
        - id: ch01-b22
          speaker: christopher_robin
          text: Winnie-the-Pooh wasn't quite sure about that.
        - id: ch01-b23
          speaker: pooh
          text: Now I understand.
        - id: ch01-b24
          speaker: narrator
          text: Good. Then I'll go on.
        - id: ch01-b25
          speaker: narrator
          text: One day, Pooh was walking through the forest when he came to a clearing. A great oak tree stood in the middle, and a loud buzzing sound came from its very top.
        - id: ch01-b26
          speaker: narrator
          text: Pooh sat at the foot of the tree. He tucked his head between his paws and began to think.
        - id: ch01-b27
          speaker: pooh
          text: That buzzing must mean something. A noise can't go buzzing and buzzing for no reason. If there's a buzzing sound, someone must be making it. And the only creatures I know who buzz like that are bees.
        - id: ch01-b28
          speaker: narrator
          text: He thought for a long while longer.
        - id: ch01-b29
          speaker: pooh
          text: And the only reason I know for being a bee is to make honey.
        - id: ch01-b30
          speaker: narrator
          text: Then he stood up.
        - id: ch01-b31
          speaker: pooh
          text: And the only reason for making honey is so I can eat it.
        - id: ch01-b32
          speaker: narrator
          text: So Pooh started climbing the tree. Up and up he went, singing a little song to himself.
        - id: ch01-b33
          speaker: pooh
          text: Isn't it funny how a bear likes honey? Buzz, buzz, buzz! I wonder why he does.
        - id: ch01-b34
          speaker: narrator
          text: He climbed a little higher, then a little higher, and then just a little higher still. The tree seemed to go on and on above him. By then, another song had come into his head, and he sang that one as he climbed too.
        - id: ch01-b35
          speaker: pooh
          text: It's funny to think, if Bears were Bees, their nests would be down at the bottom of trees. And if Bees were Bears, as anyone sees, we wouldn't need to climb stairs such as these.
        - id: ch01-b36
          speaker: narrator
          text: Pooh was tired now, which was why that had turned into a Complaining Song. He was almost at the top. All he had to do was stand on one branch.
        - id: ch01-b37
          speaker: narrator
          text: Crack!
        - id: ch01-b38
          speaker: pooh
          text: Oh, help! If only I hadn't—
          emotion: surprised
        - id: ch01-b39
          speaker: narrator
          text: He dropped ten feet and landed on the branch below. Then he bounced another twenty feet onto the next one.
        - id: ch01-b40
          speaker: pooh
          text: You see, what I meant to do—
        - id: ch01-b41
          speaker: narrator
          text: He turned head over heels and crashed onto another branch, thirty feet lower.
        - id: ch01-b42
          speaker: pooh
          text: Of course, it was rather—
        - id: ch01-b43
          speaker: narrator
          text: He slid quickly through six more branches.
        - id: ch01-b44
          speaker: pooh
          text: I suppose this all comes from liking honey so much. Oh, help!
        - id: ch01-b45
          speaker: narrator
          text: Pooh said good-bye to the last branch, spun around three times, and sailed neatly into a gorse bush.
        - id: ch01-b46
          speaker: narrator
          text: He crawled out, brushed the prickles from his nose, and began thinking again. The first person who came to mind was Christopher Robin.
        - id: ch01-b47
          speaker: christopher_robin
          text: Was that me?
          emotion: surprised
        - id: ch01-b48
          speaker: narrator
          text: That was you. Christopher Robin had asked in an awed little voice, hardly daring to believe that he was truly inside the story. He did not say anything after my answer. His eyes grew wider and wider, and his face grew pinker and pinker.
        - id: ch01-b49
          speaker: narrator
          text: Pooh went to see his friend Christopher Robin, who lived behind a green door in another part of the forest.
        - id: ch01-b50
          speaker: pooh
          text: Good morning, Christopher Robin.
        - id: ch01-b51
          speaker: christopher_robin
          text: Good morning, Winnie-ther-Pooh.
        - id: ch01-b52
          speaker: pooh
          text: You don't happen to have a balloon with you, do you?
        - id: ch01-b53
          speaker: christopher_robin
          text: A balloon?
        - id: ch01-b54
          speaker: pooh
          text: Yes. On my way here, I wondered whether Christopher Robin might have a balloon. I was thinking about balloons, you see, and wondering.
        - id: ch01-b55
          speaker: christopher_robin
          text: What do you need a balloon for?
        - id: ch01-b56
          speaker: narrator
          text: Pooh checked that nobody was listening. Then he raised a paw to his mouth and whispered one deep word.
        - id: ch01-b57
          speaker: pooh
          text: Honey!
        - id: ch01-b58
          speaker: christopher_robin
          text: But a balloon won't get you honey.
        - id: ch01-b59
          speaker: pooh
          text: It will if I use it.
        - id: ch01-b60
          speaker: narrator
          text: As it happened, Christopher Robin had been at a party the day before, at Piglet's house, and there had been balloons at the party. Christopher Robin had a large green one. One of Rabbit's relations had brought a large blue one, but left it behind because he was really too young to be at a party at all. So Christopher Robin had carried both the green balloon and the blue balloon home with him.
        - id: ch01-b61
          speaker: christopher_robin
          text: Which color would you like?
        - id: ch01-b62
          speaker: narrator
          text: Pooh put his head between his paws and considered this very carefully.
        - id: ch01-b63
          speaker: pooh
          text: Here's the problem. When you go looking for honey with a balloon, you mustn't let the bees know you're coming. With the green balloon, they might think I'm part of the tree and never see me. With the blue balloon, they might think I'm part of the sky. So which one would fool them best?
        - id: ch01-b64
          speaker: christopher_robin
          text: Won't they see you hanging under it?
        - id: ch01-b65
          speaker: pooh
          text: Maybe they will, and maybe they won't. Bees are hard to predict.
        - id: ch01-b66
          speaker: narrator
          text: Pooh thought for another moment.
        - id: ch01-b67
          speaker: pooh
          text: I'll make myself look like a little black cloud. That should trick them.
        - id: ch01-b68
          speaker: christopher_robin
          text: Then you'd better take the blue balloon.
        - id: ch01-b69
          speaker: narrator
          text: And that settled it.
        - id: ch01-b70
          speaker: narrator
          text: Christopher Robin and Pooh went out with the blue balloon. Christopher Robin brought his gun, just in case, as he always did. Pooh led the way to a very muddy place he knew. He rolled and rolled in the mud until he was black all over, just like the little cloud he meant to be. Then they blew the balloon up as big as it would go and both held tightly to the string. Christopher Robin suddenly let go. Pooh floated smoothly into the sky and stayed there, level with the treetop and about twenty feet away from it.
        - id: ch01-b71
          speaker: christopher_robin
          text: Hooray!
          emotion: happy
        - id: ch01-b72
          speaker: pooh
          text: Isn't this wonderful? What do I look like from down there?
          emotion: happy
        - id: ch01-b73
          speaker: christopher_robin
          text: You look like a Bear holding a balloon.
        - id: ch01-b74
          speaker: pooh
          text: I don't look like a little black cloud in a blue sky?
        - id: ch01-b75
          speaker: christopher_robin
          text: Not really.
        - id: ch01-b76
          speaker: pooh
          text: Well, perhaps it looks different from up here. You never know what bees will think.
        - id: ch01-b77
          speaker: narrator
          text: There was no wind to carry Pooh closer to the tree. He stayed exactly where he was. He could see the honey and smell the honey, but he could not reach it. After a while, he called down.
        - id: ch01-b78
          speaker: pooh
          text: Christopher Robin!
        - id: ch01-b79
          speaker: christopher_robin
          text: Hello!
        - id: ch01-b80
          speaker: pooh
          text: I think the bees suspect something.
        - id: ch01-b81
          speaker: christopher_robin
          text: What do you think they suspect?
        - id: ch01-b82
          speaker: pooh
          text: I don't know. But I have a feeling they're suspicious.
        - id: ch01-b83
          speaker: christopher_robin
          text: Maybe they think you want their honey.
        - id: ch01-b84
          speaker: pooh
          text: That could be it. You never can tell with bees.
        - id: ch01-b85
          speaker: narrator
          text: After another short silence, Pooh called again.
        - id: ch01-b86
          speaker: pooh
          text: Christopher Robin!
        - id: ch01-b87
          speaker: christopher_robin
          text: Yes?
        - id: ch01-b88
          speaker: pooh
          text: Is there an umbrella at your house?
        - id: ch01-b89
          speaker: christopher_robin
          text: I think there is.
        - id: ch01-b90
          speaker: pooh
          text: Please bring it here. Walk back and forth under me, look up now and then, and say, “Tut-tut, it looks like rain.” That ought to make our trick more convincing to the bees.
        - id: ch01-b91
          speaker: narrator
          text: Christopher Robin laughed quietly to himself. Silly old Bear, he thought. But he did not say those words aloud, because he was so fond of Pooh. He simply went all the way home, found the umbrella, and carried it back to the oak tree.
        - id: ch01-b92
          speaker: pooh
          text: There you are! I was starting to worry. I've discovered that the bees are definitely suspicious now.
        - id: ch01-b93
          speaker: christopher_robin
          text: Should I open the umbrella?
        - id: ch01-b94
          speaker: pooh
          text: Yes, but first we must think practically. The most important bee to fool is the Queen Bee. Can you tell which one she is from down there?
        - id: ch01-b95
          speaker: christopher_robin
          text: No.
        - id: ch01-b96
          speaker: pooh
          text: That's too bad. All right. You walk back and forth saying, “Tut-tut, it looks like rain.” I'll help by singing the sort of song a cloud might sing. Ready? Go!
        - id: ch01-b97
          speaker: narrator
          text: Christopher Robin walked up and down, wondering whether it really would rain, while Pooh began his Cloud Song.
        - id: ch01-b98
          speaker: pooh
          text: How sweet to be a Cloud, floating in the Blue! Every little cloud always sings aloud. How sweet to be a Cloud, floating in the Blue! It makes him very proud to be a little cloud.
        - id: ch01-b99
          speaker: narrator
          text: The bees went on buzzing just as suspiciously as before. Some of them left their nests and flew all around the little black cloud when it began a second verse of the song. One bee even settled on the cloud's nose for a moment, then got up and flew away again.
        - id: ch01-b100
          speaker: pooh
          text: Christopher—ow!—Robin!
          emotion: surprised
        - id: ch01-b101
          speaker: christopher_robin
          text: Yes?
        - id: ch01-b102
          speaker: pooh
          text: I've been thinking, and I've reached a very important decision. These are the wrong kind of bees.
        - id: ch01-b103
          speaker: christopher_robin
          text: Are they?
        - id: ch01-b104
          speaker: pooh
          text: Completely wrong. And the wrong kind of bees must make the wrong kind of honey. Don't you think so?
        - id: ch01-b105
          speaker: christopher_robin
          text: Do they?
        - id: ch01-b106
          speaker: pooh
          text: Yes. So I've decided to come down.
        - id: ch01-b107
          speaker: christopher_robin
          text: How will you do that?
        - id: ch01-b108
          speaker: narrator
          text: Pooh had not thought of that part. If he released the string, he would fall with a bump, and he did not like that idea at all. He thought for a long time before he spoke.
        - id: ch01-b109
          speaker: pooh
          text: Christopher Robin, you'll have to shoot the balloon. Did you bring your gun?
        - id: ch01-b110
          speaker: christopher_robin
          text: Of course. But shooting it will ruin the balloon.
        - id: ch01-b111
          speaker: pooh
          text: If you don't shoot it, I'll have to let go. That would ruin me.
        - id: ch01-b112
          speaker: narrator
          text: Once Pooh explained it that way, Christopher Robin understood. He aimed very carefully at the balloon and fired.
        - id: ch01-b113
          speaker: pooh
          text: Ow!
          emotion: surprised
        - id: ch01-b114
          speaker: christopher_robin
          text: Did I miss?
        - id: ch01-b115
          speaker: pooh
          text: You didn't miss exactly. You just missed the balloon.
        - id: ch01-b116
          speaker: christopher_robin
          text: I'm so sorry.
        - id: ch01-b117
          speaker: narrator
          text: Christopher Robin took careful aim and fired once more. This time the shot struck the balloon instead of Pooh. The air began to come out little by little, and Winnie-the-Pooh slowly floated all the way down to the ground below.
        - id: ch01-b118
          speaker: narrator
          text: Pooh's arms had grown so stiff from gripping the string that they pointed straight up for more than a week. Whenever a fly landed on his nose, he had to blow it away. And I think—but I can't be certain—that this is why everyone always called him Pooh.
        - id: ch01-b119
          speaker: christopher_robin
          text: Is that the end of the story?
        - id: ch01-b120
          speaker: narrator
          text: That's the end of this one. There are more.
        - id: ch01-b121
          speaker: christopher_robin
          text: Are they about Pooh and me?
        - id: ch01-b122
          speaker: narrator
          text: And Piglet, and Rabbit, and all your friends. Don't you remember them?
        - id: ch01-b123
          speaker: christopher_robin
          text: I remember, but when I try to remember, I forget.
        - id: ch01-b124
          speaker: narrator
          text: What about the day Pooh and Piglet tried to catch a Heffalump?
        - id: ch01-b125
          speaker: christopher_robin
          text: They didn't catch it, did they?
        - id: ch01-b126
          speaker: narrator
          text: No.
        - id: ch01-b127
          speaker: christopher_robin
          text: Pooh couldn't catch it because he hasn't any brain. Did I catch it?
        - id: ch01-b128
          speaker: narrator
          text: That comes later in the story.
        - id: ch01-b129
          speaker: narrator
          text: Christopher Robin nodded.
        - id: ch01-b130
          speaker: christopher_robin
          text: I do remember. Pooh doesn't remember very well, so he likes hearing it again. Then it becomes a real story instead of only something he's trying to remember.
        - id: ch01-b131
          speaker: narrator
          text: That's exactly how I feel.
        - id: ch01-b132
          speaker: narrator
          text: Christopher Robin gave a deep sigh. He picked his Bear up by one leg and walked toward the door, dragging Pooh behind him. When he reached the door, he turned around.
        - id: ch01-b133
          speaker: christopher_robin
          text: Are you coming to watch me have my bath?
        - id: ch01-b134
          speaker: narrator
          text: I might.
        - id: ch01-b135
          speaker: christopher_robin
          text: I didn't hurt Pooh when I shot him, did I?
        - id: ch01-b136
          speaker: narrator
          text: Not even a little.
        - id: ch01-b137
          speaker: narrator
          text: Christopher Robin nodded and went out. A moment later, I heard Winnie-the-Pooh going up the stairs behind him. Bump, bump, bump.
