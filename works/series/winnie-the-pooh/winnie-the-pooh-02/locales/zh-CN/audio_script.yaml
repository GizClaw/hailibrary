audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 咚咚咚地下楼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 爱德华熊来了。他跟在克里斯托弗·罗宾身后，用后脑勺磕着每一级台阶，咚、咚、咚地下楼。在他所知道的办法里，下楼只能这样走。有时他也觉得，一定还有另一种走法，只要能暂停片刻，不再磕脑袋，静下来想一想就行。可他始终没能停下，转念又觉得，或许别的办法根本不存在。
        - id: ch01-b02
          speaker: narrator
          text: 不管怎么说，他已经到了楼下。现在，我可以把他介绍给你了。他就是维尼噗。我第一次听到这个名字，也问了你正想问的问题。
        - id: ch01-b03
          speaker: narrator
          text: 可我以为维尼是个男孩子呀？
        - id: ch01-b04
          speaker: christopher_robin
          text: 我原来也是这么想的。
        - id: ch01-b05
          speaker: narrator
          text: 那就不能叫他维尼吧？
        - id: ch01-b06
          speaker: christopher_robin
          text: 我没有这么叫他。
        - id: ch01-b07
          speaker: narrator
          text: 可你明明说过，他就叫维尼呀。
        - id: ch01-b08
          speaker: christopher_robin
          text: 他叫维尼——噗。中间那个“尼”是什么意思，你不知道吗？
        - id: ch01-b09
          speaker: narrator
          text: 啊，我现在懂了。我赶紧这么回答。希望你也懂了，因为这件事不会再有别的解释。
        - id: ch01-b10
          speaker: narrator
          text: 维尼噗下楼以后，有时想随便玩个什么游戏，有时更愿意安安静静坐在炉火前，听别人讲故事。今天晚上，他想听的正好是故事。克里斯托弗·罗宾替他开了口。
        - id: ch01-b11
          speaker: christopher_robin
          text: 我们来讲个故事，好不好？
        - id: ch01-b12
          speaker: narrator
          text: 什么好不好？
        - id: ch01-b13
          speaker: christopher_robin
          text: 你能不能特别特别好心，给维尼噗讲一个？
        - id: ch01-b14
          speaker: narrator
          text: 我想我能。他爱听哪一种？
        - id: ch01-b15
          speaker: christopher_robin
          text: 要讲他自己的事。他就是这样的一只熊。你愿不愿意特别特别好心地讲一个？
        - id: ch01-b16
          speaker: narrator
          text: 那我试试。于是，我就讲了起来。
    - id: ch02
      title: 树梢上的蜂蜜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 从前，很久很久以前，也就是大约上星期五，维尼噗独自住在森林里。他家门楣上用金字写着“桑德斯”，所以他就住在这个名字底下。克里斯托弗·罗宾听到这里，打断了故事。
        - id: ch02-b02
          speaker: christopher_robin
          text: 什么叫住在名字底下？
        - id: ch02-b03
          speaker: narrator
          text: 就是名字写在门的上方，他住在门里面。克里斯托弗·罗宾说，维尼噗还是不大明白。
        - id: ch02-b04
          speaker: pooh
          text: 现在我明白了。
        - id: ch02-b05
          speaker: narrator
          text: 一个低沉沙哑的声音这样说。好，那我接着讲。
        - id: ch02-b06
          speaker: narrator
          text: 有一天，维尼噗出门散步，走到森林中央的一块空地上。空地正中长着一棵大橡树，树顶不断传来响亮的嗡嗡声。噗挨着树脚坐下来，把脑袋埋进两只爪子中间，一声不响地认真思考。
        - id: ch02-b07
          speaker: pooh
          text: 这阵嗡嗡声肯定有名堂。谁也不会毫无缘故地一直嗡呀嗡。有嗡嗡声，就说明有谁在嗡。据我所知，会这样嗡的东西，一定是蜜蜂。
        - id: ch02-b08
          speaker: narrator
          text: 他又想了很久。
        - id: ch02-b09
          speaker: pooh
          text: 我只知道蜜蜂做蜜蜂，是为了酿蜂蜜。蜂蜜酿出来呢，当然是为了让我吃。
        - id: ch02-b10
          speaker: narrator
          text: 他站起身，开始爬树。爬呀，爬呀，他一边往上挪，一边给自己唱歌。
        - id: ch02-b11
          speaker: pooh
          text: 熊儿爱蜂蜜，是不是稀奇？嗡！嗡！嗡！究竟为什么？
        - id: ch02-b12
          speaker: narrator
          text: 他再爬一点，又爬一点，最后又多爬了一点点，随后想出另一首歌。
        - id: ch02-b13
          speaker: pooh
          text: 这念头实在有趣。假如熊儿就是蜜蜂，它们会把蜂窝筑在树底。假如蜜蜂就是熊儿，我们就不用爬完这么多级楼梯。
        - id: ch02-b14
          speaker: narrator
          text: 噗爬到这里，已经相当累了，这才唱起这首抱怨歌。眼看就要到达树顶，他只需把脚踩上前面那根树枝。可是脚还没站稳，咔嚓一声，树枝断了。
        - id: ch02-b15
          speaker: pooh
          text: 哎呀，救命！要是我刚才没有踩上那根树枝就好了……
        - id: ch02-b16
          speaker: narrator
          text: 他先掉下十英尺，重重落到下一根树枝上。那句话还没来得及说完，身子又从树枝上弹了出去，一口气掉下二十英尺，撞上更低处的树枝。
        - id: ch02-b17
          speaker: pooh
          text: 你瞧，我本来另有一个打算……我真的是另有打算……
        - id: ch02-b18
          speaker: narrator
          text: 他一边想解释，一边倒栽葱翻了个跟头，砰地砸到三十英尺下的另一根树枝上。随后，他想承认这件事的确有点什么，却又来不及说完，身体已经从接下来的六根树枝间飞快地滑了下去。
        - id: ch02-b19
          speaker: pooh
          text: 当然，这件事确实不大顺利……我想，我已经知道原因了……
        - id: ch02-b20
          speaker: narrator
          text: 他告别最后一根树枝，在空中转了三圈，十分优美地飞进荆豆丛。
        - id: ch02-b21
          speaker: pooh
          text: 这一切都是因为我太爱蜂蜜了。哎呀，救命！
        - id: ch02-b22
          speaker: narrator
          text: 噗爬出荆豆丛，掸掉鼻子上的尖刺，再次开动脑筋。他最先想到的人，就是克里斯托弗·罗宾。
        - id: ch02-b23
          speaker: christopher_robin
          text: 他想到的是我吗？
        - id: ch02-b24
          speaker: narrator
          text: 克里斯托弗·罗宾问得又敬畏又小心，几乎不敢相信。对，就是你。他没再说话，只是眼睛越睁越大，脸也越来越红。
    - id: ch03
      title: 蓝气球和一小片黑云
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 维尼噗去找克里斯托弗·罗宾。他的朋友住在森林另一边的一扇绿门后面。
        - id: ch03-b02
          speaker: pooh
          text: 早上好，克里斯托弗·罗宾。不知道你手边有没有气球这种东西？
        - id: ch03-b03
          speaker: christopher_robin
          text: 气球？
        - id: ch03-b04
          speaker: pooh
          text: 对。我来的路上一直在想，克里斯托弗·罗宾身边会不会刚好有气球。我只是想着气球，顺便这样问问自己。
        - id: ch03-b05
          speaker: christopher_robin
          text: 你拿气球做什么？
        - id: ch03-b06
          speaker: narrator
          text: 噗转头看看四周，确定没有人偷听，便用爪子拢住嘴，压低声音说出答案。
        - id: ch03-b07
          speaker: pooh
          text: 蜂蜜！
        - id: ch03-b08
          speaker: christopher_robin
          text: 可气球弄不到蜂蜜呀！
        - id: ch03-b09
          speaker: pooh
          text: 我能弄到。
        - id: ch03-b10
          speaker: narrator
          text: 事情赶得很巧。前一天，克里斯托弗·罗宾刚去朋友小猪家参加过聚会，那里正好有气球。他分到一只绿色的大气球。兔子家的一个亲戚分到一只蓝色的大气球，可那孩子实在太小，本来就不该来参加聚会，离开时把气球也忘下了。所以，克里斯托弗·罗宾把绿色和蓝色的气球一起带回了家。
        - id: ch03-b11
          speaker: christopher_robin
          text: 你要哪一只？
        - id: ch03-b12
          speaker: narrator
          text: 噗把脑袋放在两爪之间，想得非常仔细。
        - id: ch03-b13
          speaker: pooh
          text: 事情是这样的。拿气球去找蜂蜜，最要紧的是别让蜜蜂知道我来了。绿色气球看着像树的一部分，它们也许不会注意。蓝色气球看着像天空的一部分，它们也可能不会注意。现在的问题是，这两种办法里，哪一种更有可能成功？
        - id: ch03-b14
          speaker: christopher_robin
          text: 那气球下面的你呢？蜜蜂看不见吗？
        - id: ch03-b15
          speaker: pooh
          text: 也许看得见，也许看不见。蜜蜂的事，谁也说不准。我可以装成一小片黑云，这就能骗过它们。
        - id: ch03-b16
          speaker: christopher_robin
          text: 那你该拿蓝气球。
        - id: ch03-b17
          speaker: narrator
          text: 事情就这么定了。他们带上蓝气球出发，克里斯托弗·罗宾也像每次出门那样带着枪，以防万一。噗领着他来到自己熟悉的一片烂泥地，在泥里滚过来，又滚过去，一直滚到浑身上下都变成了黑色。
        - id: ch03-b18
          speaker: narrator
          text: 接着，他们把气球吹得要多大有多大，两个人一起抓住下面的绳子。克里斯托弗·罗宾突然把手松开，噗熊便轻盈地升上天空。他一直飘到和树梢相同的高度，停在那里，离大树大约还有二十英尺。
        - id: ch03-b19
          speaker: christopher_robin
          text: 好哇！
          emotion: happy
        - id: ch03-b20
          speaker: pooh
          text: 棒不棒？你看我像什么？
        - id: ch03-b21
          speaker: christopher_robin
          text: 像一只抓着气球的熊。
        - id: ch03-b22
          speaker: pooh
          text: 不像蓝天里的一小片黑云吗？
        - id: ch03-b23
          speaker: christopher_robin
          text: 不大像。
        - id: ch03-b24
          speaker: pooh
          text: 好吧，也许从我这里看不一样。再说，蜜蜂的事，谁也说不准。
    - id: ch04
      title: 蜜蜂起了疑心
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可那天一点风也没有，没法把噗吹得离大树近一些，他只能悬在那里。他已经看见蜂蜜了，也闻到了蜂蜜香，伸手却还差那么一点，怎么都够不着。过了一会儿，他用一种声音很响的悄悄话朝下面喊。
        - id: ch04-b02
          speaker: pooh
          text: 克里斯托弗·罗宾！我觉得蜜蜂开始怀疑了！
        - id: ch04-b03
          speaker: christopher_robin
          text: 喂！它们怀疑什么？
        - id: ch04-b04
          speaker: pooh
          text: 我不知道。可我心里有个声音说，它们正在起疑心！
        - id: ch04-b05
          speaker: christopher_robin
          text: 也许它们猜到你想拿蜂蜜。
        - id: ch04-b06
          speaker: pooh
          text: 可能吧。蜜蜂的事，谁也说不准。
        - id: ch04-b07
          speaker: narrator
          text: 四周又安静了一会儿，噗再次叫他。
        - id: ch04-b08
          speaker: pooh
          text: 克里斯托弗·罗宾，你家有雨伞吗？
        - id: ch04-b09
          speaker: christopher_robin
          text: 应该有。
        - id: ch04-b10
          speaker: pooh
          text: 请你把雨伞拿来，撑着它来回走，偶尔抬头看我一眼，再说“啧啧，看样子要下雨了”。这样会让我们更容易骗过蜜蜂。
        - id: ch04-b11
          speaker: narrator
          text: 克里斯托弗·罗宾听了，暗自笑了一声，心想噗真是只傻熊。不过他太喜欢噗了，没有让噗听见这句话。他照着吩咐回到家里，找到雨伞，又把它带回大树下。噗一看见他，立刻从高处喊了起来。
        - id: ch04-b12
          speaker: pooh
          text: 你终于回来了！我都开始担心了。我已经发现，蜜蜂现在绝对起了疑心。
        - id: ch04-b13
          speaker: christopher_robin
          text: 我要撑开雨伞吗？
        - id: ch04-b14
          speaker: pooh
          text: 要，不过等一下，我们得讲究实际。最该骗过的是蜂王。你从下面看得出哪一只是蜂王吗？
        - id: ch04-b15
          speaker: christopher_robin
          text: 看不出。
        - id: ch04-b16
          speaker: pooh
          text: 真可惜。那你就撑着伞走来走去，一边说“啧啧，看样子要下雨了”。我来唱一首云儿会唱的歌。开始吧！
        - id: ch04-b17
          speaker: narrator
          text: 克里斯托弗·罗宾来回走着，猜想天会不会下雨。维尼噗则唱了起来。
        - id: ch04-b18
          speaker: pooh
          text: 做一朵云儿多甜蜜，飘在蓝天里！每一朵小小的云儿，总是放声唱不停。做一朵云儿多甜蜜，飘在蓝天里！当一朵小小的云儿，他心里得意极了。
        - id: ch04-b19
          speaker: narrator
          text: 可蜜蜂发出的嗡嗡声，听起来还是和刚才一样充满怀疑。有几只甚至飞出了蜂窝，绕着这朵黑云打转。云儿开始唱第二段时，一只蜜蜂还落在云的鼻子上，停了一小会儿，才重新飞起来。
        - id: ch04-b20
          speaker: pooh
          text: 克里斯托弗……哎哟！……罗宾。我刚才仔细想过，已经拿定了一个很重要的主意。这些蜜蜂的种类不对。
        - id: ch04-b21
          speaker: christopher_robin
          text: 是吗？
        - id: ch04-b22
          speaker: pooh
          text: 完全不对。那它们酿的蜂蜜肯定也不对，你不觉得吗？
        - id: ch04-b23
          speaker: christopher_robin
          text: 是这样吗？
        - id: ch04-b24
          speaker: pooh
          text: 是的。所以我想下来。
        - id: ch04-b25
          speaker: christopher_robin
          text: 你要怎么下来？
        - id: ch04-b26
          speaker: narrator
          text: 这个问题，噗还没想过。松开绳子，他就会砰地摔下去，他一点也不喜欢这个办法。想了很久，他终于有了主意。
        - id: ch04-b27
          speaker: pooh
          text: 克里斯托弗·罗宾，你得开枪打气球。你带枪了吗？
        - id: ch04-b28
          speaker: christopher_robin
          text: 当然带了。可是开枪会把气球弄坏。
        - id: ch04-b29
          speaker: pooh
          text: 可你不开枪，我就只能松手。那样弄坏的会是我。
        - id: ch04-b30
          speaker: narrator
          text: 这样一说，克里斯托弗·罗宾就明白了。他仔细瞄准气球，开了一枪。
        - id: ch04-b31
          speaker: pooh
          text: 哎哟！
          emotion: surprised
        - id: ch04-b32
          speaker: christopher_robin
          text: 我打偏了吗？
        - id: ch04-b33
          speaker: pooh
          text: 也不能说完全打偏了。不过你没有打中气球。
        - id: ch04-b34
          speaker: christopher_robin
          text: 真对不起。
        - id: ch04-b35
          speaker: narrator
          text: 克里斯托弗·罗宾连忙道歉，再开了一枪。这一回，子弹终于击中了气球。气球里的空气一点点漏出去，维尼噗也跟着越降越低，最后慢慢飘回地面。
        - id: ch04-b36
          speaker: narrator
          text: 噗在天上抓着气球绳太久，两条胳膊都僵住了。落地以后，它们仍旧直挺挺地举在空中，过了一个多星期也没能放下来。每当有只苍蝇飞来，落在他的鼻子上，他没法用爪子赶，只能鼓起嘴把苍蝇吹走。我不敢肯定，不过我想，也许大家一直叫他“噗”，就是这个缘故。
    - id: ch05
      title: 真正的故事
      blocks:
        - id: ch05-b01
          speaker: christopher_robin
          text: 故事讲完了吗？
        - id: ch05-b02
          speaker: narrator
          text: 这个讲完了，后面还有别的。
        - id: ch05-b03
          speaker: christopher_robin
          text: 也是讲噗和我的故事吗？
        - id: ch05-b04
          speaker: narrator
          text: 还会讲小猪、兔子和你们所有人。你不记得了？
        - id: ch05-b05
          speaker: christopher_robin
          text: 我记得。可一想把它记起来，我就忘了。
        - id: ch05-b06
          speaker: narrator
          text: 你还记得噗和小猪去捉长鼻怪的那天吗？
        - id: ch05-b07
          speaker: christopher_robin
          text: 他们没有捉到，是不是？
        - id: ch05-b08
          speaker: narrator
          text: 没有。
        - id: ch05-b09
          speaker: christopher_robin
          text: 噗捉不到，因为他没有脑子。那我呢？我捉到了吗？
        - id: ch05-b10
          speaker: narrator
          text: 等故事讲到那里，你就知道了。
        - id: ch05-b11
          speaker: narrator
          text: 克里斯托弗·罗宾点点头。
        - id: ch05-b12
          speaker: christopher_robin
          text: 我记得这件事，只是噗记得不太清楚，所以他才喜欢听别人再讲一遍。这样一来，它就是一个真正的故事了，不再只是脑袋里想要记住、却又会忘掉的一段回忆。
        - id: ch05-b13
          speaker: narrator
          text: 我也是这么觉得。
        - id: ch05-b14
          speaker: narrator
          text: 克里斯托弗·罗宾深深叹了口气，抓住熊的一条腿，把他从地上提起来，然后一路朝门边走去。噗没有自己走，只是跟在他身后，被他拖过地板。到了门口，克里斯托弗·罗宾停下来，转身问我。
        - id: ch05-b15
          speaker: christopher_robin
          text: 你来看我洗澡吗？
        - id: ch05-b16
          speaker: narrator
          text: 也许吧。
        - id: ch05-b17
          speaker: christopher_robin
          text: 我刚才开枪，没有把他打疼吧？
        - id: ch05-b18
          speaker: narrator
          text: 一点也没有。
        - id: ch05-b19
          speaker: narrator
          text: 他点点头，走了出去。没过一会儿，我听见维尼噗跟在他后面，用后脑勺磕着台阶，咚、咚、咚地上楼去了。
