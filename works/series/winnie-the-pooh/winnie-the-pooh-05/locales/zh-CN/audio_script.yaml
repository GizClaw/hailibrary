audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    eeyore:
      display_name: 屹耳
      tts:
        delivery: 低沉悲观，用郑重口气说出冷幽默
        timbre: 沙哑厚重
        pace: 缓慢
        pitch: 低
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 博学自信，喜欢一本正经地详细解释
        timbre: 洪亮沉稳
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 屹耳的尾巴不见了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 灰驴屹耳独自待在森林一个长满蓟草的角落。他把两只前蹄远远分开，脑袋偏到一边，正在想事情。有时他忧伤地问自己“为什么”，有时又想“为何如此”，还有时想的是“鉴于哪个”。当然，偶尔他自己也不知道在想什么。
        - id: ch01-b02
          speaker: narrator
          text: 这时，维尼噗咚咚地走了过来。屹耳很高兴，因为他终于可以停一停，不必再想那些事了。他用阴郁的声音向噗问好。
        - id: ch01-b03
          speaker: eeyore
          text: 你好吗？
        - id: ch01-b04
          speaker: pooh
          text: 那你好吗？
        - id: ch01-b05
          speaker: narrator
          text: 屹耳把头从这边摇到那边。
        - id: ch01-b06
          speaker: eeyore
          text: 不怎么好。我已经很久没有过一点儿好的感觉了。
          emotion: sad
        - id: ch01-b07
          speaker: pooh
          text: 哎呀，那可真叫人难过。来，让我仔细看看你。
        - id: ch01-b08
          speaker: narrator
          text: 屹耳低头望着地面，一动不动。噗绕着他走了一整圈，忽然吃了一惊。
        - id: ch01-b09
          speaker: pooh
          text: 咦，你的尾巴出了什么事？
        - id: ch01-b10
          speaker: eeyore
          text: 它出了什么事？它根本不在了！
          emotion: surprised
        - id: ch01-b11
          speaker: pooh
          text: 你能肯定吗？
        - id: ch01-b12
          speaker: eeyore
          text: 尾巴要么在，要么不在，这怎么可能弄错？你的尾巴就不在！
        - id: ch01-b13
          speaker: pooh
          text: 那么，那里现在有什么？
        - id: ch01-b14
          speaker: eeyore
          text: 什么也没有。让我自己瞧瞧。
        - id: ch01-b15
          speaker: narrator
          text: 屹耳慢慢转向尾巴刚才还在的地方，可他总也追不上那个地方，只好又朝相反的方向转。他转了一整圈，回到原处，低下脑袋，从两条前腿中间望过去。最后，他长长地叹了口气。
        - id: ch01-b16
          speaker: eeyore
          text: 我看你说得没错。
          emotion: sad
        - id: ch01-b17
          speaker: pooh
          text: 我当然没说错。
        - id: ch01-b18
          speaker: eeyore
          text: 这下许多事情都有了说明。一切都解释得通了。难怪。
        - id: ch01-b19
          speaker: pooh
          text: 你一定把尾巴落在什么地方了。
        - id: ch01-b20
          speaker: eeyore
          text: 一定是有谁把它拿走了。
        - id: ch01-b21
          speaker: narrator
          text: 屹耳沉默了很久，又低沉地加了一句。
        - id: ch01-b22
          speaker: eeyore
          text: 他们就是干得出这种事。
        - id: ch01-b23
          speaker: narrator
          text: 噗觉得应该说点有用的话，可怎么也想不出该说什么。那么，不如去做一件有用的事吧。他郑重地望着屹耳。
        - id: ch01-b24
          speaker: pooh
          text: 屹耳，我，维尼噗，一定替你把尾巴找回来。
        - id: ch01-b25
          speaker: eeyore
          text: 谢谢你，噗。你才算真正的朋友。不像有些人。
        - id: ch01-b26
          speaker: narrator
          text: 于是，维尼噗出发去寻找屹耳的尾巴。
    - id: ch02
      title: 到百亩林去
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那是森林里一个明媚的春日早晨。柔软的小云在蓝天上快活地玩耍。它们轮流跳到太阳前面，好像想把太阳熄灭，又忽然溜开，让下一朵也来试试。太阳就在云朵之间勇敢地发着光。
        - id: ch02-b02
          speaker: narrator
          text: 一片小树林整年都披着冷杉。如今，旁边的山毛榉刚换上嫩绿的花边，这片树林一比，显得又老气又寒酸。
        - id: ch02-b03
          speaker: narrator
          text: 熊就这样一路前进。他穿过一丛丛杂木和矮林，走下铺满金雀花和石南的开阔山坡，又踏过溪流乱石嶙峋的河床。接着，他爬上陡峭的砂岩坡，再一次钻进石南丛。等他终于走到百亩林，已经又累又饿了。猫头鹰就住在那里。
        - id: ch02-b04
          speaker: pooh
          text: 要是有谁对所有事情都懂一点儿，那一定是猫头鹰。他准能对某些事情懂一点儿。不然，我就不叫维尼噗了。可我明明就叫维尼噗。所以，事情就是这样。
        - id: ch02-b05
          speaker: narrator
          text: 猫头鹰住在栗树居。这是一所古色古香、很有魅力的宅邸。熊觉得，它比森林里任何人的家都要气派。为什么呢？因为别人的门上没有的东西，这里有两样，既有门环，又有铃绳。
        - id: ch02-b06
          speaker: narrator
          text: 门环下面挂着一块告示，写的是“如须回达请按铃”。铃绳下面也有一块，写的是“如不须回达请敲们”。两块告示上都有错字。
        - id: ch02-b07
          speaker: narrator
          text: 这些字是克里斯托弗·罗宾写的，因为森林里只有他会拼字。猫头鹰虽然懂得不少，会读，会写，还会把自己的名字写成“头猫鹰”，可一碰上“麻疹”和“黄油吐司”这种娇贵的词，他就会完全乱套。
        - id: ch02-b08
          speaker: narrator
          text: 噗先从左往右读了两块告示，又怕漏掉什么，特意从右往左再读一次。为了绝对保险，他一边敲门环一边拉门环，又一边拉铃绳一边敲铃绳。然后，他放开嗓子喊了起来。
        - id: ch02-b09
          speaker: pooh
          text: 猫头鹰！我需要一个回答！现在说话的是熊！
        - id: ch02-b10
          speaker: narrator
          text: 门打开了，猫头鹰从里面探出头来。
        - id: ch02-b11
          speaker: owl
          text: 你好，噗。近来怎么样？
        - id: ch02-b12
          speaker: pooh
          text: 情形可怕又悲伤。我的朋友屹耳把尾巴丢了，现在正为这件事难过。你能不能行行好，告诉我怎么替他找回来？
        - id: ch02-b13
          speaker: owl
          text: 遇到这种情况，惯常的处置程序如下。
        - id: ch02-b14
          speaker: pooh
          text: “灌肠的厨子成雪”是什么意思？我是脑袋很小的熊，词一长，我就糊涂了。
        - id: ch02-b15
          speaker: owl
          text: 意思就是你该做什么。
        - id: ch02-b16
          speaker: pooh
          text: 只要是这个意思，我就不介意。
        - id: ch02-b17
          speaker: owl
          text: 该做的事情是这样的。第一步，悬赏。然后……
    - id: ch03
      title: 猫头鹰的铃绳
      blocks:
        - id: ch03-b01
          speaker: pooh
          text: 请等一下。刚才那个东西，我们要对它做什么？你正要告诉我的时候，忽然打了个喷嚏。
        - id: ch03-b02
          speaker: owl
          text: 我没有打喷嚏。
        - id: ch03-b03
          speaker: pooh
          text: 你打了，猫头鹰。
        - id: ch03-b04
          speaker: owl
          text: 对不起，噗，我没有。一个人不可能打了喷嚏却不知道。
        - id: ch03-b05
          speaker: pooh
          text: 可要是什么东西都没被喷出来，你也不会知道那是喷嚏呀。
        - id: ch03-b06
          speaker: owl
          text: 我说的是，第一步，悬赏。
        - id: ch03-b07
          speaker: pooh
          text: 你看，你又打了。
          emotion: sad
        - id: ch03-b08
          speaker: owl
          text: 悬——赏！也就是写一张告示，告诉大家，谁找回屹耳的尾巴，我们就送给他一大份什么东西。
        - id: ch03-b09
          speaker: pooh
          text: 明白了，明白了。说到一大份什么东西，每天早晨这个时候，我一般也会来一小份什么东西。
        - id: ch03-b10
          speaker: narrator
          text: 噗的心思已经飘远了。他眼巴巴地望向猫头鹰客厅角落里的食橱。
        - id: ch03-b11
          speaker: pooh
          text: 一小口炼乳，或者别的什么。也许再舔上一口蜂蜜……
        - id: ch03-b12
          speaker: owl
          text: 那么，我们把告示写好，再贴到森林里的每个地方。
        - id: ch03-b13
          speaker: pooh
          text: 舔一口蜂蜜。或者不舔，也得看情况。
        - id: ch03-b14
          speaker: narrator
          text: 熊深深地叹了口气，拼命想听清猫头鹰的话。可是猫头鹰一直说个不停，用的词越来越长。绕了一大圈，他终于又讲回了开头。那张告示应该请克里斯托弗·罗宾来写。
        - id: ch03-b15
          speaker: owl
          text: 我家门上的两块告示就是他写的。你看见了吗，噗？
        - id: ch03-b16
          speaker: narrator
          text: 猫头鹰讲了这么久，噗一直闭着眼睛，一会儿回答“是”，一会儿回答“不是”。上一回他刚说过“是，是”，这次便轮到了另一个答案。
        - id: ch03-b17
          speaker: pooh
          text: 没有，我完全没看见。
        - id: ch03-b18
          speaker: narrator
          text: 其实，噗根本不知道猫头鹰问的是什么。猫头鹰听了，有点儿惊讶。
        - id: ch03-b19
          speaker: owl
          text: 你没看见？那就现在来看吧。
        - id: ch03-b20
          speaker: narrator
          text: 他们一起走到门外。噗先看看门环，再看看门环下面的告示。接着，他又看看铃绳，再看看铃绳下面的告示。他看得越来越久，也越来越觉得，自己以前曾在别的什么地方见过类似的东西。那是在什么时候呢？他一时还想不起来。
        - id: ch03-b21
          speaker: owl
          text: 很漂亮的铃绳，对不对？
        - id: ch03-b22
          speaker: narrator
          text: 噗点点头。
        - id: ch03-b23
          speaker: pooh
          text: 它让我想起一样东西，可我怎么也想不起是什么。你在哪里找到它的？
        - id: ch03-b24
          speaker: owl
          text: 我在森林里偶然碰见的。它挂在一丛灌木上。我一开始以为那里住着人，就拉了一下，可是什么也没发生。于是我再用力一拉，它就掉进了我手里。看起来没人需要，我便把它带回了家，然后……
        - id: ch03-b25
          speaker: pooh
          text: 猫头鹰，你弄错了。有人需要它。
        - id: ch03-b26
          speaker: owl
          text: 谁需要？
        - id: ch03-b27
          speaker: pooh
          text: 屹耳。我的好朋友屹耳。他……他很喜欢它。
        - id: ch03-b28
          speaker: owl
          text: 他喜欢这根铃绳？
        - id: ch03-b29
          speaker: pooh
          text: 它原来就连在他身上。
          emotion: sad
    - id: ch04
      title: 是我找到了尾巴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 说完这些话，噗把那根铃绳从钩子上解了下来，一路带回去交给屹耳。克里斯托弗·罗宾又把这条尾巴钉回了它本来就该在的位置。
        - id: ch04-b02
          speaker: narrator
          text: 屹耳高兴得在森林里十分快活地从这边蹦到那边，还不停地摇着失而复得的尾巴。维尼噗看着看着，肚子里忽然有了一种奇怪的感觉。他只好赶紧回家，吃点东西撑住自己。
        - id: ch04-b03
          speaker: narrator
          text: 半个小时以后，噗擦了擦嘴，得意地给自己唱起一首歌。
        - id: ch04-b04
          speaker: pooh
          text: 尾巴是谁找到的？“是我，”噗说道，“一点三刻找到。其实才十点三刻。是我找到了尾巴！”
          emotion: happy
