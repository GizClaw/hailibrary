audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    eeyore:
      display_name: Eeyore
      tts:
        delivery: gloomy and dryly resigned
        timbre: low and rough
        pace: slow
        pitch: low
    owl:
      display_name: Owl
      tts:
        delivery: dignified and confidently instructive
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: Eeyore's Missing Tail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Eeyore, the old gray donkey, stood alone in a thistly corner of the
            forest. His front feet were planted wide apart, his head leaned to one
            side, and he was thinking about things. Sometimes he sadly wondered,
            "Why?" Sometimes it was, "What for?" And sometimes it was, "Because of
            which?" Then there were times when he wasn't quite sure what he was
            thinking about at all.
        - id: ch01-b02
          speaker: narrator
          text: >-
            So when Winnie-the-Pooh came stumping by, Eeyore was glad to stop
            thinking for a while. He greeted Pooh in his gloomiest voice.
        - id: ch01-b03
          speaker: eeyore
          text: >-
            How do you do?
        - id: ch01-b04
          speaker: pooh
          text: >-
            And how are you?
        - id: ch01-b05
          speaker: narrator
          text: >-
            Eeyore slowly shook his head from side to side.
        - id: ch01-b06
          speaker: eeyore
          text: >-
            Not very how. I haven't felt how at all for a very long time.
          emotion: sad
        - id: ch01-b07
          speaker: pooh
          text: >-
            Oh, dear. I'm sorry. Let me take a look at you.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Eeyore stared sadly at the ground while Pooh walked all the way around
            him. Then Pooh noticed something.
        - id: ch01-b09
          speaker: pooh
          text: >-
            Why, Eeyore! What happened to your tail?
          emotion: surprised
        - id: ch01-b10
          speaker: eeyore
          text: >-
            What happened to it? It isn't there!
          emotion: surprised
        - id: ch01-b11
          speaker: pooh
          text: >-
            Are you certain?
        - id: ch01-b12
          speaker: eeyore
          text: >-
            A tail is either there or it isn't. There's no mistaking that. And
            yours isn't there!
        - id: ch01-b13
          speaker: pooh
          text: >-
            Then what is there?
        - id: ch01-b14
          speaker: eeyore
          text: >-
            Nothing.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Eeyore decided to look. He turned slowly toward the place where his
            tail had been not long before. He couldn't catch up with it, so he
            turned the other way until he was back where he started. At last he
            lowered his head and peered between his front legs. A long, sad sigh
            came out of him.
        - id: ch01-b16
          speaker: eeyore
          text: >-
            I believe you're right.
          emotion: sad
        - id: ch01-b17
          speaker: pooh
          text: >-
            Of course I'm right.
        - id: ch01-b18
          speaker: eeyore
          text: >-
            That accounts for a great deal. Now everything makes sense. No wonder.
          emotion: sad
        - id: ch01-b19
          speaker: pooh
          text: >-
            You must have left it someplace.
        - id: ch01-b20
          speaker: eeyore
          text: >-
            Someone must have taken it.
        - id: ch01-b21
          speaker: narrator
          text: >-
            After a long silence, Eeyore added one more gloomy thought.
        - id: ch01-b22
          speaker: eeyore
          text: >-
            Just like them.
          emotion: sad
        - id: ch01-b23
          speaker: narrator
          text: >-
            Pooh felt he should say something helpful, but he couldn't think what
            to say. So he chose to do something helpful instead.
        - id: ch01-b24
          speaker: pooh
          text: >-
            Eeyore, I, Winnie-the-Pooh, will go and find your tail.
        - id: ch01-b25
          speaker: eeyore
          text: >-
            Thank you, Pooh. You really are a friend. Not like some.
        - id: ch01-b26
          speaker: narrator
          text: >-
            And off went Winnie-the-Pooh to look for Eeyore's tail.
    - id: ch02
      title: Across the Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            It was a fine spring morning. Small, soft clouds played across the blue
            sky. Now and then one skipped in front of the sun as if it meant to put
            the sun out. Then it slid away so the next cloud could have a turn. The
            sun shone bravely through them and between them.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One little wood had worn its dark fir trees all year. Now it looked old
            and shabby beside the beeches in their pretty new lace of green leaves.
            Pooh marched through woods and thickets. He went down open slopes among
            gorse and heather, crossed rocky streambeds, and climbed steep banks of
            sandstone back into the heather. At last he reached the Hundred Acre
            Wood, tired and hungry. That was where Owl lived.
        - id: ch02-b03
          speaker: pooh
          text: >-
            If anyone knows anything about anything, Owl knows something about
            something. Otherwise my name isn't Winnie-the-Pooh. But it is. So there
            you are.
    - id: ch03
      title: Owl's Advice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Owl lived at The Chestnuts, a charming old house. It looked grander than
            anyone else's house to Pooh because it had both a knocker and a bell
            rope. Below the knocker was a notice that meant, "Please ring if an
            answer is required." Below the bell rope was another that meant,
            "Please knock if an answer is not required." At least, that was what
            they were supposed to mean. The first one said, "Ples ring if an rnser
            is reqird." The second said, "Plez cnoke if an rnsr is not reqid."
        - id: ch03-b02
          speaker: narrator
          text: >-
            Christopher Robin had written the notices. He was the only one in the
            forest who could spell. Owl was wise in many ways, and he could read and
            write and spell his own name, though he spelled it W-O-L. But delicate
            words like "measles" and "buttered toast" made all his spelling fall to
            pieces.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Pooh studied both notices very carefully from left to right. Then he
            read them from right to left, in case he had missed anything. To be
            quite sure, he knocked and pulled the knocker, pulled and knocked the
            bell rope, and called as loudly as he could.
        - id: ch03-b04
          speaker: pooh
          text: >-
            Owl! I need an answer! This is Bear speaking!
        - id: ch03-b05
          speaker: narrator
          text: >-
            The door opened, and Owl looked out.
        - id: ch03-b06
          speaker: owl
          text: >-
            Hello, Pooh. How are things?
        - id: ch03-b07
          speaker: pooh
          text: >-
            Terrible and sad. My friend Eeyore has lost his tail, and he's moping
            about it. Would you please tell me how I can find it for him?
        - id: ch03-b08
          speaker: owl
          text: >-
            Well, the customary procedure in a case like this is as follows.
        - id: ch03-b09
          speaker: pooh
          text: >-
            What does "crustimoney proceed-cake" mean? I'm a Bear of Very Little
            Brain, and long words bother me.
        - id: ch03-b10
          speaker: owl
          text: >-
            It means the thing you ought to do.
        - id: ch03-b11
          speaker: pooh
          text: >-
            Oh. If that's what it means, I don't mind.
        - id: ch03-b12
          speaker: owl
          text: >-
            Here is what you do. First, issue a reward. Then—
        - id: ch03-b13
          speaker: pooh
          text: >-
            Wait a moment. What do we do to that thing you just said? You sneezed
            exactly when you were going to tell me.
        - id: ch03-b14
          speaker: owl
          text: >-
            I did not sneeze.
        - id: ch03-b15
          speaker: pooh
          text: >-
            Yes, you did, Owl.
        - id: ch03-b16
          speaker: owl
          text: >-
            I beg your pardon, Pooh, but I didn't. A person can't sneeze without
            knowing it.
        - id: ch03-b17
          speaker: pooh
          text: >-
            Well, a person can't know about it unless something has been sneezed.
        - id: ch03-b18
          speaker: owl
          text: >-
            I said, "First, issue a reward."
        - id: ch03-b19
          speaker: pooh
          text: >-
            There! You're doing it again.
          emotion: sad
        - id: ch03-b20
          speaker: owl
          text: >-
            A reward! We make a notice promising a large something to whoever finds
            Eeyore's tail.
        - id: ch03-b21
          speaker: pooh
          text: >-
            I understand. And speaking of large somethings, I usually have a small
            something around this time of morning. Just a mouthful of condensed
            milk, perhaps, with a lick of honey.
        - id: ch03-b22
          speaker: narrator
          text: >-
            Pooh gazed hopefully at the cupboard in the corner of Owl's parlor.
        - id: ch03-b23
          speaker: owl
          text: >-
            Then we write the notice and put copies all around the forest.
        - id: ch03-b24
          speaker: pooh
          text: >-
            A lick of honey. Or perhaps not, as the case may be.
        - id: ch03-b25
          speaker: narrator
          text: >-
            Pooh sighed deeply and tried very hard to listen. Owl kept talking. His
            words grew longer and longer. Pooh listened as they went on and on,
            trying not to think about the cupboard or the honey that might not be
            in it. At last Owl arrived back where he had begun. The right person to
            write the notice, he explained, was Christopher Robin.
        - id: ch03-b26
          speaker: owl
          text: >-
            He wrote the notices on my front door. Did you notice them, Pooh?
        - id: ch03-b27
          speaker: narrator
          text: >-
            For some time, Pooh had been sitting with his eyes shut, answering Owl
            with "yes" and "no" in turn. His last answer had been yes, so now he
            gave the other one, though he had no idea what Owl meant.
        - id: ch03-b28
          speaker: pooh
          text: >-
            No, not at all.
        - id: ch03-b29
          speaker: owl
          text: >-
            You didn't see them? Come outside and look now.
          emotion: surprised
    - id: ch04
      title: The Bell Rope
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            They went outside. Pooh looked at the knocker and the notice under it.
            Then he looked at the bell rope and its notice. The longer he stared at
            that rope, the more certain he felt that he had seen something like it
            somewhere before.
        - id: ch04-b02
          speaker: owl
          text: >-
            A handsome bell rope, isn't it?
        - id: ch04-b03
          speaker: narrator
          text: >-
            Pooh nodded.
        - id: ch04-b04
          speaker: pooh
          text: >-
            It reminds me of something, but I can't remember what. Where did you
            find it?
        - id: ch04-b05
          speaker: owl
          text: >-
            I happened across it in the forest. It was hanging over a bush. At
            first I thought someone lived there, so I rang it. Nothing happened. I
            rang much harder, and it came off in my hand. Nobody seemed to want it,
            so I brought it home, and—
        - id: ch04-b06
          speaker: pooh
          text: >-
            Owl, you made a mistake. Somebody did want it.
        - id: ch04-b07
          speaker: owl
          text: >-
            Who?
        - id: ch04-b08
          speaker: pooh
          text: >-
            Eeyore. My dear friend Eeyore. He was... he was fond of it.
        - id: ch04-b09
          speaker: owl
          text: >-
            Fond of it?
        - id: ch04-b10
          speaker: pooh
          text: >-
            Attached to it.
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: >-
            With that, Pooh unhooked the rope and carried it back to Eeyore.
            Christopher Robin nailed it into its proper place again. Eeyore frisked
            around the forest and waved his tail with delight. He was so happy that
            Pooh began to feel quite funny. Pooh had walked a long way, solved a
            difficult problem, and missed the small something he usually ate in the
            morning. Now he hurried home for a little something to keep himself
            going.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Half an hour later, Pooh wiped his mouth and proudly sang a song to
            himself.
        - id: ch04-b13
          speaker: pooh
          text: |-
            Who found the tail?
            "I," said Pooh,
            At a quarter to two.
            Though really it was quarter to eleven.
            I found the tail!
