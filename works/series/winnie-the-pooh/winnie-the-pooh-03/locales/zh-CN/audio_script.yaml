audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    rabbit:
      display_name: 兔子
      tts:
        delivery: 机灵利落，讲究规矩，偶尔一本正经地挑剔
        timbre: 明亮清脆
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 森林里的小调和沙土坡上的洞
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，爱德华熊在森林里散步。朋友们都叫他维尼噗，或者干脆叫他噗。他走得很快活，嘴里还得意地哼着一支新编的小调。
        - id: ch01-b02
          speaker: narrator
          text: 这支歌是当天早晨做强身运动时想出来的。噗站在镜子前，身子往上伸到最高，就唱“啦啦啦，啦啦啦”。他再弯腰去碰脚趾，就变成“啦啦啦，啦啦——哎哟，救命！——啦”。早饭以后，他一遍一遍地练，总算把整支歌牢牢记住了。
        - id: ch01-b03
          speaker: pooh
          text: 啦啦啦，啦啦啦，啦啦啦，啦啦啦，隆咚嘀哩咚咚。嘀哩哩，嘀哩哩，嘀哩哩，嘀哩哩，隆咚咚嘀哩咚。
        - id: ch01-b04
          speaker: narrator
          text: 噗边走边唱，脚步轻快得很。他猜着其他人这会儿都在做什么，又想知道，要是自己变成了别人，心里会是什么滋味。想着想着，他走到一片沙土坡前。坡上有个很大的洞。
        - id: ch01-b05
          speaker: pooh
          text: 啊哈！隆咚嘀哩咚咚。照我懂的道理，这个洞表示兔子。兔子表示有人陪我。有人陪我，就表示有吃的，也有人听我哼歌，还有诸如此类的好事。隆咚咚嘀哩咚。
        - id: ch01-b06
          speaker: narrator
          text: 他弯下腰，把头探进洞里，朝里面喊了一声。
        - id: ch01-b07
          speaker: pooh
          text: 家里有人吗？
        - id: ch01-b08
          speaker: narrator
          text: 洞里忽然窸窸窣窣地响了一阵，随后一点声音也没有了。噗只好问得更响。
        - id: ch01-b09
          speaker: pooh
          text: 我刚才问，家里有人吗？
        - id: ch01-b10
          speaker: rabbit
          text: 没有！别喊那么响，我第一次就听清楚了。
        - id: ch01-b11
          speaker: pooh
          text: 真麻烦。这里真的谁都不在吗？
        - id: ch01-b12
          speaker: rabbit
          text: 谁也不在。
        - id: ch01-b13
          speaker: narrator
          text: 噗把脑袋缩回来，站在那里仔细想了一会儿。既然有人开口说了“谁也不在”，里面就一定有个人才对。他觉得这个道理不会错，便重新把头伸进洞里。
        - id: ch01-b14
          speaker: pooh
          text: 你好，兔子。刚才是你吧？
        - id: ch01-b15
          speaker: rabbit
          text: 不是。
        - id: ch01-b16
          speaker: narrator
          text: 兔子这次特意换了一种声音。
        - id: ch01-b17
          speaker: pooh
          text: 可我听着很像兔子的声音呀。
        - id: ch01-b18
          speaker: rabbit
          text: 我觉得不像。至少我不是有意让它像的。
        - id: ch01-b19
          speaker: pooh
          text: 哦。
        - id: ch01-b20
          speaker: narrator
          text: 噗又把头缩回去想了一遍，再一次伸进洞里。
        - id: ch01-b21
          speaker: pooh
          text: 那么，麻烦你告诉我，兔子去哪儿了？
        - id: ch01-b22
          speaker: rabbit
          text: 他去找自己的好朋友噗熊了。
        - id: ch01-b23
          speaker: pooh
          text: 可我就是我呀！
          emotion: surprised
        - id: ch01-b24
          speaker: rabbit
          text: 哪个我？
        - id: ch01-b25
          speaker: pooh
          text: 我就是噗熊。
        - id: ch01-b26
          speaker: rabbit
          text: 你能肯定？
          emotion: surprised
        - id: ch01-b27
          speaker: pooh
          text: 肯定，肯定得很。
        - id: ch01-b28
          speaker: rabbit
          text: 哦，那就进来吧。
        - id: ch01-b29
          speaker: narrator
          text: 噗把身子往洞里推，挤呀，挤呀，又挤呀，费了好大一番力气，终于进了兔子的家。
    - id: ch02
      title: 十一点钟的一点东西
      blocks:
        - id: ch02-b01
          speaker: rabbit
          text: 你说对了，真的是你。见到你很高兴。
        - id: ch02-b02
          speaker: narrator
          text: 兔子说这话时，还把噗全身上下打量了一遍。
        - id: ch02-b03
          speaker: pooh
          text: 那你一开始以为是谁？
        - id: ch02-b04
          speaker: rabbit
          text: 我也说不准。森林里的事，你是知道的。不能什么人都放进家里，总得小心一点。你想不想吃上一口？
        - id: ch02-b05
          speaker: narrator
          text: 噗最喜欢在上午十一点吃一点东西。看到兔子摆出盘子和杯子，他高兴极了。
        - id: ch02-b06
          speaker: rabbit
          text: 你的面包要配蜂蜜，还是炼乳？
        - id: ch02-b07
          speaker: pooh
          text: 两种都要。可是面包就不用麻烦了，谢谢。
        - id: ch02-b08
          speaker: narrator
          text: 噗觉得后面那句能让自己显得不那么贪心。接下来的好长一阵，他只顾吃东西，一句话也没说。等盘子空了，他才用黏糊糊的嗓音哼起歌，慢慢站起身来。他亲热地握了握兔子的爪子，说自己该继续上路了。
        - id: ch02-b09
          speaker: rabbit
          text: 一定要走吗？
        - id: ch02-b10
          speaker: pooh
          text: 如果……如果你……那我还可以再留一会儿。
        - id: ch02-b11
          speaker: narrator
          text: 噗拼命朝食品柜那边看，希望兔子能明白他的意思。
        - id: ch02-b12
          speaker: rabbit
          text: 其实我正准备出门。
        - id: ch02-b13
          speaker: pooh
          text: 哦，那我也走吧。再见。
        - id: ch02-b14
          speaker: rabbit
          text: 好吧，再见。只要你真的不想再吃一点。
        - id: ch02-b15
          speaker: pooh
          text: 还有吃的吗？
        - id: ch02-b16
          speaker: narrator
          text: 噗问得飞快。兔子揭开每只盘子的盖子，看了看。
        - id: ch02-b17
          speaker: rabbit
          text: 没有，已经没有了。
        - id: ch02-b18
          speaker: pooh
          text: 我就知道。那我真的该走了。再见。
        - id: ch02-b19
          speaker: narrator
          text: 噗转身往洞外爬。他用两只前爪拼命拉，两只后爪使劲推。过了一会儿，鼻子先回到了外面的天地。接着露出来的是耳朵，然后是两只前爪，再然后是肩膀。可到了这里，他忽然一动也不动了。
        - id: ch02-b20
          speaker: pooh
          text: 哎哟，救命！我最好还是退回去。
        - id: ch02-b21
          speaker: narrator
          text: 可他退不回去。
        - id: ch02-b22
          speaker: pooh
          text: 真麻烦。那我只好接着往前了。
        - id: ch02-b23
          speaker: narrator
          text: 可他也出不去。
        - id: ch02-b24
          speaker: pooh
          text: 两边我都动不了！哎哟，救命，真麻烦！
    - id: ch03
      title: 噗卡住了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 兔子这时候也想出门走走。前门已经被噗塞满，他只好走后门，再绕到洞口外面看看噗。
        - id: ch03-b02
          speaker: rabbit
          text: 你好。你卡在这里了吗？
        - id: ch03-b03
          speaker: pooh
          text: 没——没有。我歇一歇，想想事情，再哼一会儿歌。
        - id: ch03-b04
          speaker: rabbit
          text: 把一只爪子递过来。
        - id: ch03-b05
          speaker: narrator
          text: 噗伸出爪子。兔子抓紧以后，拉了又拉，使了好大的劲。
        - id: ch03-b06
          speaker: pooh
          text: 哎哟！你弄疼我了！
        - id: ch03-b07
          speaker: rabbit
          text: 看来事情很清楚。你确实卡住了。
        - id: ch03-b08
          speaker: pooh
          text: 都怪你家的前门造得不够大。
          emotion: angry
        - id: ch03-b09
          speaker: rabbit
          text: 都怪你刚才吃得太多。我当时已经这么想了，只是没好意思开口。我们俩当中，有一个人吃过了头。我很清楚，那个人绝对不是我。好吧，好吧，我这就去找克里斯托弗·罗宾。
        - id: ch03-b10
          speaker: narrator
          text: 克里斯托弗·罗宾住在森林另一头。兔子把他带回来，他一眼就看见了噗露在洞外的前半截。
        - id: ch03-b11
          speaker: christopher_robin
          text: 你这只傻熊。
        - id: ch03-b12
          speaker: narrator
          text: 这句话说得那么亲热，大家马上又觉得事情有希望了。
        - id: ch03-b13
          speaker: pooh
          text: 我刚才正开始担心呢。兔子的前门可能再也不能用了。要是真变成那样，我会非常难过的。
          emotion: sad
        - id: ch03-b14
          speaker: rabbit
          text: 我也会很难过。
        - id: ch03-b15
          speaker: christopher_robin
          text: 谁说他再也不能用前门？他当然还能用。
        - id: ch03-b16
          speaker: rabbit
          text: 那就好。
        - id: ch03-b17
          speaker: christopher_robin
          text: 噗，如果我们拉不出你，也许能从这边把你推回去。
        - id: ch03-b18
          speaker: narrator
          text: 兔子挠着胡须，认真琢磨起这个办法。他提醒大家，要是从这边把噗推回去，噗可就彻底回到兔子家里了。当然，没有谁会比兔子更高兴见到噗，也没有谁比他更愿意让噗待着。可是，有些人住在树上，有些人住在地底下，这件事总不能不考虑，而且……
        - id: ch03-b19
          speaker: pooh
          text: 你的意思是，我会永远待在里面？
        - id: ch03-b20
          speaker: rabbit
          text: 我的意思是，你都已经出来这么远了，现在放弃多可惜。
        - id: ch03-b21
          speaker: narrator
          text: 克里斯托弗·罗宾点了点头。他想到了唯一的办法。
        - id: ch03-b22
          speaker: christopher_robin
          text: 我们只能等你重新瘦下来。
        - id: ch03-b23
          speaker: pooh
          text: 变瘦得花多长时间？
        - id: ch03-b24
          speaker: christopher_robin
          text: 我想，大概要一个星期。
        - id: ch03-b25
          speaker: pooh
          text: 可我不能卡在这里整整一个星期！
        - id: ch03-b26
          speaker: christopher_robin
          text: 你当然能待在这里，傻熊。现在难办的是怎么让你出来。
    - id: ch04
      title: 卡得很紧的一个星期
      blocks:
        - id: ch04-b01
          speaker: rabbit
          text: 这一个星期，我们可以念书给你听。我还希望这几天别下雪。还有啊，老伙计，你在我家里占掉的地方可真不少。你的两条后腿正好伸在里面，反正也什么都没做。我可以把它们当成架子，用来晾毛巾吗？那样会方便得很。
        - id: ch04-b02
          speaker: pooh
          text: 一个星期！那我吃什么？
          emotion: sad
        - id: ch04-b03
          speaker: christopher_robin
          text: 恐怕什么都不能吃，这样才会瘦得更快。不过我们一定给你念书。
        - id: ch04-b04
          speaker: narrator
          text: 噗想叹气，却发现身子塞得太紧，连叹气都办不到。一滴眼泪从眼角滚了下来。
        - id: ch04-b05
          speaker: pooh
          text: 那你们能不能念一本支撑人的书？就是那种能帮助一只卡得特别紧、挤得特别难受的熊，还能给他一点安慰的书？
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 就这样过了整整一个星期。克里斯托弗·罗宾每天坐在噗的北边，给他念那种能支撑他的书。兔子待在噗的南边，把洗好的衣服一件件晾到他的后腿上。夹在两人中间的噗，感觉自己的身子越来越细，一天比一天苗条。
        - id: ch04-b07
          speaker: narrator
          text: 一个星期终于过去了。克里斯托弗·罗宾合上书，站起身来。
        - id: ch04-b08
          speaker: christopher_robin
          text: 就是现在！
        - id: ch04-b09
          speaker: narrator
          text: 他两手握紧噗的两只前爪。兔子从后面抓住克里斯托弗·罗宾。兔子的所有亲戚和朋友，又一个接一个地抓住兔子。大家排成长长的一串，同时用尽力气往外拉。
        - id: ch04-b10
          speaker: pooh
          text: 哎哟！
        - id: ch04-b11
          speaker: narrator
          text: 很长一段时间里，噗只能喊出这一声。后来，他又换了一声。
        - id: ch04-b12
          speaker: pooh
          text: 哦！
        - id: ch04-b13
          speaker: narrator
          text: 紧接着，一切突然动了起来。
        - id: ch04-b14
          speaker: pooh
          text: 啵！
        - id: ch04-b15
          speaker: narrator
          text: 噗像一只瓶塞从瓶口蹦出来似的，一下子冲出了洞。克里斯托弗·罗宾、兔子，还有兔子所有的亲朋好友，全都翻着跟头朝后倒去，横七竖八地摔在地上。最后，维尼噗落到了他们最上面。他终于自由啦！
    - id: ch05
      title: 你这只傻熊
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 噗站起来，对帮助他的朋友们点点头，算是谢过大家。然后，他又沿着森林里的路散起步来，嘴里依旧得意地哼着自己的小调。
        - id: ch05-b02
          speaker: narrator
          text: 克里斯托弗·罗宾没有马上离开。他留在原地，满怀疼爱地看着噗越走越远，心里轻轻说了一句。
        - id: ch05-b03
          speaker: christopher_robin
          text: 你这只傻熊！
