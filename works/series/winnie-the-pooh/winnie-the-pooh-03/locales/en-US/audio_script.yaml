audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    rabbit:
      display_name: Rabbit
      tts:
        delivery: brisk and particular
        timbre: light and crisp
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: In Which Pooh Goes Visiting and Gets into a Tight Place
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Edward Bear, whom his friends called Winnie-the-Pooh, or just Pooh, was walking through the forest one day and humming proudly. He had made up the hum that very morning while doing his Stoutness Exercises in front of the mirror. “Tra-la-la, tra-la-la,” he sang as he stretched as high as he could. Then came “Tra-la-la, tra-la—oh, help!—la,” when he tried to touch his toes. After breakfast, he had repeated the hum until he knew it by heart. Now he could sing the whole thing properly.
        - id: ch01-b02
          speaker: pooh
          text: >-
            Tra-la-la, tra-la-la, tra-la-la, tra-la-la, rum-tum-tiddle-um-tum. Tiddle-iddle, tiddle-iddle, tiddle-iddle, tiddle-iddle, rum-tum-tum-tiddle-um.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Pooh walked along happily, wondering what everyone else was doing and what it might feel like to be somebody else. Then he came to a sandy bank with a large hole in it.
        - id: ch01-b04
          speaker: pooh
          text: >-
            Aha! Rum-tum-tiddle-um-tum. If I know anything at all, that hole means Rabbit. And Rabbit means company. And company means food, and someone to listen to my humming, and things like that. Rum-tum-tum-tiddle-um.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He bent down, put his head into the hole, and called inside.
        - id: ch01-b06
          speaker: pooh
          text: >-
            Is anyone home?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Something scuffled inside the hole. Then everything went quiet.
        - id: ch01-b08
          speaker: pooh
          text: >-
            I said, is anyone home?
        - id: ch01-b09
          speaker: rabbit
          text: >-
            No! And you don't have to shout. I heard you perfectly well the first time.
        - id: ch01-b10
          speaker: pooh
          text: >-
            Bother. So there isn't anyone there at all?
        - id: ch01-b11
          speaker: rabbit
          text: >-
            Nobody.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Pooh pulled his head out and thought about that. Somebody had to be in there, because somebody had said “Nobody.” He put his head back into the hole.
        - id: ch01-b13
          speaker: pooh
          text: >-
            Hello, Rabbit. Is that you?
        - id: ch01-b14
          speaker: rabbit
          text: >-
            No.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Rabbit tried a different sort of voice this time.
        - id: ch01-b16
          speaker: pooh
          text: >-
            But doesn't that sound like Rabbit?
        - id: ch01-b17
          speaker: rabbit
          text: >-
            I don't think it does. At least, it isn't supposed to.
        - id: ch01-b18
          speaker: pooh
          text: >-
            Oh.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Pooh took his head out for another think. Then he put it in again.
        - id: ch01-b20
          speaker: pooh
          text: >-
            Would you please tell me where Rabbit has gone?
        - id: ch01-b21
          speaker: rabbit
          text: >-
            He's gone to visit his friend Pooh Bear. They're great friends.
        - id: ch01-b22
          speaker: pooh
          text: >-
            But I am Pooh Bear!
          emotion: surprised
        - id: ch01-b23
          speaker: rabbit
          text: >-
            What sort of “I” are you?
        - id: ch01-b24
          speaker: pooh
          text: >-
            The Pooh Bear sort.
        - id: ch01-b25
          speaker: rabbit
          text: >-
            Are you certain?
          emotion: surprised
        - id: ch01-b26
          speaker: pooh
          text: >-
            Completely certain.
        - id: ch01-b27
          speaker: rabbit
          text: >-
            Oh. Well, come in, then.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Pooh pushed and pushed and pushed through the hole until at last he was inside. Rabbit looked him over from top to bottom.
        - id: ch01-b29
          speaker: rabbit
          text: >-
            You were right. It really is you. I'm glad to see you.
        - id: ch01-b30
          speaker: pooh
          text: >-
            Who did you think I was?
        - id: ch01-b31
          speaker: rabbit
          text: >-
            I wasn't sure. You know what the Forest is like. I can't let just anyone walk into my house. I have to be careful. Would you like a little something to eat?
        - id: ch01-b32
          speaker: narrator
          text: >-
            Pooh always enjoyed a little something at eleven in the morning. He was very pleased when Rabbit brought out plates and mugs.
        - id: ch01-b33
          speaker: rabbit
          text: >-
            Would you like honey or condensed milk with your bread?
        - id: ch01-b34
          speaker: pooh
          text: >-
            Both, please. But you needn't bother with the bread.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Pooh had said “both” because he was excited. He left out the bread so he wouldn't seem greedy. For a long while after that, he said nothing at all. He was much too busy with the honey and condensed milk. At last, he began humming again in a rather sticky voice. Then he stood up, shook Rabbit warmly by the paw, and said he really must be going on.
        - id: ch01-b36
          speaker: rabbit
          text: >-
            Must you?
        - id: ch01-b37
          speaker: pooh
          text: >-
            Well, I could stay a little longer, if there were—if you wanted—
        - id: ch01-b38
          speaker: narrator
          text: >-
            Pooh tried very hard to look toward the pantry.
        - id: ch01-b39
          speaker: rabbit
          text: >-
            Actually, I was just about to go out.
        - id: ch01-b40
          speaker: pooh
          text: >-
            Oh. Then I'll be on my way. Goodbye.
        - id: ch01-b41
          speaker: rabbit
          text: >-
            Goodbye, then, if you're sure you won't have anything else.
        - id: ch01-b42
          speaker: pooh
          text: >-
            Is there anything else?
        - id: ch01-b43
          speaker: narrator
          text: >-
            Pooh asked that very quickly. Rabbit lifted the covers from the dishes.
        - id: ch01-b44
          speaker: rabbit
          text: >-
            No. There isn't.
        - id: ch01-b45
          speaker: pooh
          text: >-
            That's what I thought. Well, goodbye. I really must go.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Pooh began climbing out through the hole. He pulled with his front paws and pushed with his back paws. Little by little, his nose appeared in the open air. Then his ears came through. Next came his front paws, and after them, his shoulders. He kept pulling and pushing. And then—
        - id: ch01-b47
          speaker: pooh
          text: >-
            Oh, help! I had better go back.
        - id: ch01-b48
          speaker: narrator
          text: >-
            He tried to go back.
        - id: ch01-b49
          speaker: pooh
          text: >-
            Oh, bother! I'll have to keep going forward.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He tried to go forward.
        - id: ch01-b51
          speaker: pooh
          text: >-
            I can't go either way! Oh, help and bother!
        - id: ch01-b52
          speaker: narrator
          text: >-
            By now, Rabbit wanted to take a walk too. Since his front door was full, he went out the back and came around to look at Pooh.
        - id: ch01-b53
          speaker: rabbit
          text: >-
            Hello. Are you stuck?
        - id: ch01-b54
          speaker: pooh
          text: >-
            N-no. I'm only resting. And thinking. And humming a little.
        - id: ch01-b55
          speaker: rabbit
          text: >-
            Give me your paw.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Pooh reached out one paw. Rabbit pulled and pulled and pulled.
        - id: ch01-b57
          speaker: pooh
          text: >-
            Ow! That hurts!
        - id: ch01-b58
          speaker: rabbit
          text: >-
            The truth is, you are stuck.
        - id: ch01-b59
          speaker: pooh
          text: >-
            This is what happens when people don't make their front doors big enough.
          emotion: angry
        - id: ch01-b60
          speaker: rabbit
          text: >-
            This is what happens when someone eats too much. I noticed it while we were eating, but I was too polite to say anything. I could see that one of us was eating far too much, and I knew perfectly well that it wasn't me. Well, well. There's no use arguing about it now. I'll go and fetch Christopher Robin.
          emotion: angry
        - id: ch01-b61
          speaker: narrator
          text: >-
            Christopher Robin lived at the far end of the Forest. Rabbit brought him back, and Christopher Robin saw the front half of Pooh sticking out of the bank.
        - id: ch01-b62
          speaker: christopher_robin
          text: >-
            Silly old Bear.
        - id: ch01-b63
          speaker: narrator
          text: >-
            He said it so lovingly that everyone began to feel hopeful again.
        - id: ch01-b64
          speaker: pooh
          text: >-
            I was starting to worry that Rabbit would never get to use his front door again. I would hate that.
          emotion: sad
        - id: ch01-b65
          speaker: rabbit
          text: >-
            So would I.
        - id: ch01-b66
          speaker: christopher_robin
          text: >-
            Never use his front door? Of course he'll use it again.
        - id: ch01-b67
          speaker: rabbit
          text: >-
            Good.
        - id: ch01-b68
          speaker: christopher_robin
          text: >-
            Pooh, if we can't pull you out, perhaps we can push you back in.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Rabbit scratched his whiskers and thought it over. If they pushed Pooh all the way back, then Pooh would be back inside Rabbit's house. Of course, nobody was happier to see Pooh than Rabbit was. But there was still the problem of where everybody lived. Some people had homes in trees, while others had homes underground, and—
        - id: ch01-b70
          speaker: pooh
          text: >-
            Do you mean I might never get out?
          emotion: surprised
        - id: ch01-b71
          speaker: rabbit
          text: >-
            I mean you've already made it this far. It would be a shame to waste that.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Christopher Robin nodded.
        - id: ch01-b73
          speaker: christopher_robin
          text: >-
            Then there's only one thing we can do. We'll have to wait until you're thin again.
        - id: ch01-b74
          speaker: pooh
          text: >-
            How long does that take?
        - id: ch01-b75
          speaker: narrator
          text: >-
            Pooh asked anxiously.
        - id: ch01-b76
          speaker: christopher_robin
          text: >-
            About a week, I think.
        - id: ch01-b77
          speaker: pooh
          text: >-
            But I can't stay here for a whole week!
        - id: ch01-b78
          speaker: christopher_robin
          text: >-
            You can stay there easily enough, silly old Bear. Getting you out is the difficult part.
        - id: ch01-b79
          speaker: rabbit
          text: >-
            We'll read to you. I only hope it doesn't snow. And, old fellow, you're taking up quite a lot of room inside my house. Would you mind if I used your back legs to hang my towels on? They're already there, doing nothing, and they would be very convenient.
        - id: ch01-b80
          speaker: pooh
          text: >-
            A week! But what will I do about meals?
          emotion: sad
        - id: ch01-b81
          speaker: christopher_robin
          text: >-
            I'm afraid you can't have meals. You'll get thin faster that way. But we will read to you.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Pooh started to sigh, but he was wedged too tightly even for that. A tear rolled down from his eye.
        - id: ch01-b83
          speaker: pooh
          text: >-
            Then could you read me a Sustaining Book? The kind that would help and comfort a Wedged Bear in Great Tightness?
          emotion: sad
        - id: ch01-b84
          speaker: narrator
          text: >-
            So for one whole week, Christopher Robin sat at Pooh's north end and read exactly that kind of comforting, sustaining book. At Pooh's south end, inside the house, Rabbit hung his washing over Pooh's back legs. And there in the middle, between the reading and the washing, Pooh could feel himself growing slimmer and slimmer. At last, the end of the week arrived. Christopher Robin decided it was time and gave the word.
        - id: ch01-b85
          speaker: christopher_robin
          text: >-
            Now!
        - id: ch01-b86
          speaker: narrator
          text: >-
            Christopher Robin took hold of Pooh's front paws. Rabbit held on to Christopher Robin. All of Rabbit's friends and relations held on to Rabbit. Then everyone pulled together. For a long time, Pooh could only cry out.
        - id: ch01-b87
          speaker: pooh
          text: >-
            Ow!
        - id: ch01-b88
          speaker: narrator
          text: >-
            They kept pulling.
        - id: ch01-b89
          speaker: pooh
          text: >-
            Oh!
        - id: ch01-b90
          speaker: narrator
          text: >-
            Then, all at once, Pooh came out like a cork flying from a bottle.
        - id: ch01-b91
          speaker: pooh
          text: >-
            Pop!
        - id: ch01-b92
          speaker: narrator
          text: >-
            Christopher Robin, Rabbit, and all of Rabbit's friends and relations tumbled backward, head over heels. Winnie-the-Pooh landed right on top of them. He was free!
        - id: ch01-b93
          speaker: narrator
          text: >-
            Pooh nodded his thanks to his friends. Then he continued his walk through the forest, humming proudly to himself.
        - id: ch01-b94
          speaker: narrator
          text: >-
            Christopher Robin watched him go with love and said to himself, “Silly old Bear!”
