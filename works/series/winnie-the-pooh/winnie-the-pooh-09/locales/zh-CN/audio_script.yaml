audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 小心谨慎，紧张时语速加快，鼓起勇气时格外认真
        timbre: 轻柔稚嫩
        pace: 轻快而富有变化
        pitch: 高
    rabbit:
      display_name: 兔子
      tts:
        delivery: 自信干脆，安排事情时郑重又急切
        timbre: 明亮清晰
        pace: 偏快
        pitch: 中高
    kanga:
      display_name: 袋鼠妈妈
      tts:
        delivery: 温柔镇定，捉弄别人时仍像一位耐心的母亲
        timbre: 温暖柔和
        pace: 从容
        pitch: 中等
    roo:
      display_name: 小袋鼠豆豆
      tts:
        delivery: 活泼天真，兴奋时声音短促明快
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 高
    eeyore:
      display_name: 屹耳
      tts:
        delivery: 阴沉缓慢，抱怨时仍一本正经
        timbre: 低沉沙哑
        pace: 缓慢
        pitch: 低
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 郑重自信，喜欢卖弄学问
        timbre: 浑厚清晰
        pace: 从容
        pitch: 中低
    rabbit_relations:
      display_name: 兔子的亲朋好友
      tts:
        delivery: 七嘴八舌，容易紧张，行动总是跟着队伍
        timbre: 轻细而参差
        pace: 偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 克里斯托弗·罗宾率领探险队去寻找北极
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个晴朗的日子，噗一步一顿地走向森林顶端。他特意走这一趟，是想看看自己的朋友克里斯托弗·罗宾到底还对熊感不感兴趣。就在那天早上，他吃了一顿很简单的早餐，不过是一两块蜂巢，上面薄薄抹着橘子酱。吃着吃着，他忽然想出一首新歌。歌的第一句是，嘿哟，熊的日子真快活。
        - id: ch01-b02
          speaker: narrator
          text: 唱到这里，他挠了挠头。开头的确很好，可第二句是什么呢？噗把“哟”唱了两三遍，没能得到一点帮助。他又想，也许把开头换成“嗨呀，熊的日子真快活”，整首歌就会好起来。可唱完以后，他发现并没有。最后他决定，飞快地把第一句连唱两遍。这样，也许还没来得及思考，第三句和第四句就会自己从嘴里跑出来，那一定会成为一首好歌。
        - id: ch01-b03
          speaker: pooh
          text: 嘿哟！熊的日子真快活！嘿哟！熊的日子真快活！下雨下雪我都不发愁，因为崭新的鼻头沾满了蜜稠。下雪融雪我也不在意，因为干净的熊掌沾满了蜂蜜！嘿哟，一只熊！嘿哟，一只噗！再过一两个钟头，我还要吃点东西补一补！
        - id: ch01-b04
          speaker: narrator
          text: 噗对这首新歌满意极了，走向森林顶端的一路上，他一遍又一遍地唱着。可唱着唱着，他忽然想到，要是自己再唱得久一点，很快就该吃点东西了。到那时，歌词里说“再过一两个钟头”就不是真的了。一首好歌当然应该是真的。于是，他闭上嘴里的歌词，只留下曲调，改成一路轻轻哼着走。
        - id: ch01-b05
          speaker: narrator
          text: 克里斯托弗·罗宾坐在门外，正穿着一双大靴子。噗一看见靴子，就知道一场历险要来了。他赶紧用爪背擦掉鼻子上的蜂蜜，把自己收拾得尽量齐整，好让人一看就知道，他什么事都准备好了。
        - id: ch01-b06
          speaker: pooh
          text: 早上好，克里斯托弗·罗宾！
        - id: ch01-b07
          speaker: christopher_robin
          text: 你好，噗熊。这只靴子我怎么也穿不上。你能靠在我背后吗？我一使劲拉，就会往后摔倒。
        - id: ch01-b08
          speaker: pooh
          text: 那可不好。
        - id: ch01-b09
          speaker: narrator
          text: 噗立刻坐到克里斯托弗·罗宾身后，把两只脚牢牢抵在地面上，再用全身力气顶住他的后背。克里斯托弗·罗宾也使劲向后靠着噗，同时抓住靴子，一下又一下地往上拉。他拉了又拉，这一次没有仰面摔倒，终于把那只不听话的大靴子穿到了脚上。
        - id: ch01-b10
          speaker: pooh
          text: 好了。接下来做什么？
        - id: ch01-b11
          speaker: christopher_robin
          text: 我们大家要去探险。谢谢你，噗。
        - id: ch01-b12
          speaker: pooh
          text: 去探险险吗？我从没参加过这种事。我们上哪儿去探险险？
        - id: ch01-b13
          speaker: christopher_robin
          text: 是探险，你这只傻熊。中间有个“险”字。我们要去发现北极。
        - id: ch01-b14
          speaker: pooh
          text: 噢，我知道。可是北极是什么？熊擅长发现它吗？
        - id: ch01-b15
          speaker: narrator
          text: 噗其实不知道。克里斯托弗·罗宾自己也不太确定，只说北极就是一样等着人去发现的东西。
        - id: ch01-b16
          speaker: christopher_robin
          text: 熊当然擅长。兔子、袋鼠妈妈，还有大家，也都擅长。探险就是所有人排成长长的一队。你去叫大家准备好，我来检查我的枪。每个人还要带上给养。
        - id: ch01-b17
          speaker: pooh
          text: 给什么？
        - id: ch01-b18
          speaker: christopher_robin
          text: 吃的东西。
        - id: ch01-b19
          speaker: pooh
          text: 噢，我还以为你说的是“给痒”呢。我这就去告诉他们。
        - id: ch01-b20
          speaker: narrator
          text: 噗走了。他最先碰见兔子。
        - id: ch01-b21
          speaker: pooh
          text: 你好，兔子。是你吗？我有个口信。我们大家要和克里斯托弗·罗宾去探险险！
        - id: ch01-b22
          speaker: rabbit
          text: 我们先假装不是我，看看会怎样。你的口信，我会替你交给他的。不过，坐上这个探险险以后，它是什么样？
        - id: ch01-b23
          speaker: pooh
          text: 我想，是一种船。我们要去发现一根极，也可能是一只鸡。总之，我们要发现它。还要带上吃的东西，想吃时就吃。我要去小猪家了。请你通知袋鼠妈妈。
        - id: ch01-b24
          speaker: rabbit
          text: 原来是那一种。好吧，我们要去，是不是？
        - id: ch01-b25
          speaker: narrator
          text: 噗离开兔子，匆匆赶到小猪家。小猪正坐在门口的地上，开心地吹着一朵蒲公英。他想知道那件事会在今年发生，明年发生，将来某一天发生，还是永远也不会发生。蒲公英刚刚告诉他，答案是“永远不会”。可现在，小猪怎么也想不起“那件事”究竟是什么，只好暗暗希望，它千万别是什么好事。就在这时，噗走到了他面前。
        - id: ch01-b26
          speaker: pooh
          text: 小猪，我们大家要去探险险，还带着吃的。我们要去发现一样东西。
        - id: ch01-b27
          speaker: piglet
          text: 什么东西？不会很凶猛吧？
        - id: ch01-b28
          speaker: pooh
          text: 克里斯托弗·罗宾没说它凶猛，只说中间有个“险”字。
        - id: ch01-b29
          speaker: piglet
          text: 我不是怕它们的脖子，我怕它们的牙齿。不过，克里斯托弗·罗宾也去，我就什么都不怕。
        - id: ch01-b30
          speaker: narrator
          text: 不久，大家都在森林顶端集合了，探险险正式出发。克里斯托弗·罗宾和兔子走在最前面，接着是小猪和噗。后面跟着袋鼠妈妈，豆豆坐在她的口袋里。猫头鹰走在一旁，再往后是屹耳。至于兔子的亲朋好友，他们排成长长的一串，跟在整个队伍最后。
        - id: ch01-b31
          speaker: rabbit
          text: 我没请他们，是他们自己来的。他们总这样。让他们排在屹耳后面吧。
        - id: ch01-b32
          speaker: eeyore
          text: 要我说，这让人很不安。我本来不想参加这个探……噗说的那个东西。我来，只是给大家面子。既然我在队尾，就请让我好好待在最后。可每次我想坐下歇一会儿，都得先拨开兔子六七个小亲戚。这哪里是什么探……不管它叫什么。这只是一团乱哄哄的声音。
        - id: ch01-b33
          speaker: owl
          text: 我懂屹耳的意思。要是你问我……
        - id: ch01-b34
          speaker: eeyore
          text: 我谁也没问。我是在告诉大家。找北极也好，跟蚁窝末尾的一截玩采坚果和五月花也好，对我都一样。
        - id: ch01-b35
          speaker: christopher_robin
          text: 跟上！
        - id: ch01-b36
          speaker: pooh
          text: 跟上！
        - id: ch01-b37
          speaker: piglet
          text: 跟上！
        - id: ch01-b38
          speaker: owl
          text: 跟上！
        - id: ch01-b39
          speaker: rabbit
          text: 我们出发了，我得到前面去。
        - id: ch01-b40
          speaker: eeyore
          text: 好吧，走就走。只是出了事别怪我。
        - id: ch01-b41
          speaker: narrator
          text: 他们就这样出发去找那根极。一路上，大家聊这聊那，只有噗没说话。他正在编歌。第一节终于编好，他便告诉小猪。小猪问，是什么的第一节。噗说是自己的歌。小猪又问，是哪一首歌。噗说就是这一首。小猪还是不明白，追问到底是哪一首。噗只好请他仔细听，听了自然会知道。可小猪马上反问，噗怎么知道自己没有在听。这个问题把噗难住了，他答不出来，只好直接唱起歌来。
        - id: ch01-b42
          speaker: pooh
          text: 大家一起去发现那根极，猫头鹰、小猪、兔子都到齐。听猫头鹰、小猪、兔子说，它是一样等人发现的东西。屹耳、克里斯托弗·罗宾和噗，还有兔子的亲友也上了路。可那根极在哪里，谁也说不清楚。嘿！为猫头鹰、兔子和大家欢呼！
        - id: ch01-b43
          speaker: christopher_robin
          text: 嘘！我们要走进一个危险的地方了。
        - id: ch01-b44
          speaker: narrator
          text: 克里斯托弗·罗宾回头对噗说了声“嘘”。噗立刻转向小猪，也说“嘘”。小猪再转过去，嘘了袋鼠妈妈。袋鼠妈妈把这声提醒交给猫头鹰，口袋里的豆豆也十分小声地对自己连说了好几遍。最后，猫头鹰转过头，郑重其事地对屹耳说了声“嘘”。
        - id: ch01-b45
          speaker: eeyore
          text: 嘘！
        - id: ch01-b46
          speaker: rabbit_relations
          text: 嘘！嘘！快往后传！
        - id: ch01-b47
          speaker: narrator
          text: 兔子的亲朋好友吓了一跳，赶紧一个嘘下一个，一直传到队伍尽头。最后那个家伙也是所有亲友里最小的一个。他发现整支探险队好像都在对自己说“嘘”，一下慌了神，头朝下钻进地面的一条裂缝。他在里面待了整整两天，直到危险过去，才急急忙忙跑回家。从那以后，他和姑妈一起安静地过日子，再也不乱跑了。他的名字叫亚历山大甲虫。
        - id: ch01-b48
          speaker: narrator
          text: 探险队已经来到一条小溪旁。溪水夹在高高的岩石河岸之间，弯弯曲曲地向前冲，一会儿翻滚，一会儿跌落。克里斯托弗·罗宾看一眼就知道，这里是个危险的地方。他告诉大家，这种地方最适合藏下一场埋伏。
        - id: ch01-b49
          speaker: pooh
          text: 什么样的伏？像金雀花丛吗？
        - id: ch01-b50
          speaker: owl
          text: 亲爱的噗，难道你不知道埋伏是什么？埋伏就是一种出其不意。有人突然跳出来扑向你，那就是埋伏。
        - id: ch01-b51
          speaker: piglet
          text: 猫头鹰，噗是在私下里问我，你不用……我正要告诉他，埋伏就是一种出其不意。噗，要是有人忽然扑向你，那就是埋伏。
        - id: ch01-b52
          speaker: pooh
          text: 金雀花丛有时也会让人出其不意。有一回我从树上掉下来，一丛金雀花忽然扑向我。我花了六天，才把刺全拔掉。
        - id: ch01-b53
          speaker: owl
          text: 我们说的不是金雀花丛。
        - id: ch01-b54
          speaker: pooh
          text: 我说的是。
        - id: ch01-b55
          speaker: narrator
          text: 说完金雀花，大家又十分小心地沿着小溪往上走。他们从一块石头跨到另一块石头，每一步都很谨慎。走了一阵，两边高高的溪岸渐渐敞开。溪水两旁各露出一条平坦的草地，正好让大家坐下来歇脚。克里斯托弗·罗宾一看见，就叫整个队伍停下。所有人都坐下来休息。
        - id: ch01-b56
          speaker: christopher_robin
          text: 我们现在把给养全吃掉吧，这样就不用背那么多了。大家都有吃的吗？
        - id: ch01-b57
          speaker: pooh
          text: 把什么全吃掉？
        - id: ch01-b58
          speaker: piglet
          text: 就是我们带来的东西。
        - id: ch01-b59
          speaker: pooh
          text: 这个主意好。
        - id: ch01-b60
          speaker: eeyore
          text: 除了我，大家都有。和平常一样。我只是随便问问，你们中间大概没有谁正好坐在一棵蓟草上吧？
        - id: ch01-b61
          speaker: pooh
          text: 我好像坐着一棵。哎哟！没错，我刚才真坐在上面。
        - id: ch01-b62
          speaker: eeyore
          text: 谢谢你，噗。要是你已经用完那棵蓟草，就轮到我了。你们要知道，人坐在蓟草上，对它一点好处也没有，会把它的生气全压没。下次大家都记住吧。只要稍微体谅一下，稍微替别人想一想，一切都会变得很不一样。
        - id: ch01-b63
          speaker: narrator
          text: 噗站起来以后，屹耳便挪到他的位置，低头吃起那棵蓟草。等克里斯托弗·罗宾吃完午饭，他悄悄对兔子说了几句话。兔子连声答应，神情也显得格外重要。两个人沿着小溪往上走了一段，离开其他伙伴，因为克里斯托弗·罗宾不愿让大家听到接下来的问题。
        - id: ch01-b64
          speaker: christopher_robin
          text: 兔子，我只是想问……你大概也不知道北极长什么样吧？我以前知道，可现在好像忘了。
        - id: ch01-b65
          speaker: rabbit
          text: 你可问到我了。说来也巧，我以前也知道，现在也忘了。我想，它应该就是一根插在地里的杆子。它既然叫极，肯定是根杆子。是杆子，就得插在地上，因为没有别的地方能插。
        - id: ch01-b66
          speaker: christopher_robin
          text: 我也是这么想的。
        - id: ch01-b67
          speaker: rabbit
          text: 问题只有一个。它到底插在哪里？
        - id: ch01-b68
          speaker: christopher_robin
          text: 我们找的就是这个。
        - id: ch01-b69
          speaker: narrator
          text: 他们回到大家身边。小猪仰面躺在草地上，睡得十分安稳。豆豆正在溪里洗自己的脸和爪子。袋鼠妈妈骄傲地向每个人解释，这是豆豆第一次不用人帮忙，自己动手洗脸。与此同时，猫头鹰正给她讲一件很有趣的往事，故事里塞满了“百科全书”和“杜鹃花”这样的长词。可袋鼠妈妈一句也没有听进去。
        - id: ch01-b70
          speaker: eeyore
          text: 我不赞成洗洗涮涮。什么耳朵后面也要洗，全是现代人的胡闹。噗，你怎么想？
        - id: ch01-b71
          speaker: pooh
          text: 我觉得……
        - id: ch01-b72
          speaker: narrator
          text: 可噗才刚刚开口，我们就永远也听不到他的答案了。先是豆豆突然发出一声尖叫，接着溪水里响起“扑通”一声，最后，袋鼠妈妈又惊慌地大叫起来。原来豆豆洗着脸和爪子，一不小心掉进了水里。刚才还安安静静休息的伙伴们，一下全朝溪边看去。
        - id: ch01-b73
          speaker: eeyore
          text: 瞧吧，洗洗涮涮就是这种结果。
        - id: ch01-b74
          speaker: rabbit
          text: 豆豆掉进水里了！下游的人快找样东西横在溪上！
          emotion: fearful
        - id: ch01-b75
          speaker: roo
          text: 快看我游泳！
          emotion: happy
        - id: ch01-b76
          speaker: narrator
          text: 豆豆本来还在水潭中央，转眼就被急流推着往前漂。他来不及抓住任何东西，便顺着一道小瀑布冲了下去，扑通一声落进下面那个水潭。
        - id: ch01-b77
          speaker: kanga
          text: 亲爱的豆豆，你没事吧？你真的没事吗？
          emotion: fearful
        - id: ch01-b78
          speaker: roo
          text: 没事！看我游……
          emotion: happy
        - id: ch01-b79
          speaker: narrator
          text: 话还没说完，豆豆又从下一道瀑布跌进另一个水潭。一下子，每个人都忙着帮忙。小猪彻底醒了，在岸上不停地跳，嘴里反复喊着怎么办。猫头鹰赶紧向大家解释，遇到这种突然又短暂的落水，最要紧的是让头留在水面上。袋鼠妈妈沿着岸边一个劲儿往下跳，一遍遍确认豆豆是不是真的没事。可豆豆无论漂进哪个水潭，给她的回答都一样，他只顾得意地叫大家快看他游泳。
        - id: ch01-b80
          speaker: eeyore
          text: 又是洗洗涮涮。小豆豆，抓住我的尾巴，你就没事了。
        - id: ch01-b81
          speaker: narrator
          text: 屹耳也想出了自己的办法。他转过身，背对着出事的地方，把长尾巴垂进豆豆最先掉落的那个水潭。他一边小声抱怨大家非要洗洗涮涮，一边叫豆豆抓住尾巴。可是豆豆早已漂到下游去了。克里斯托弗·罗宾和兔子匆匆从屹耳身边跑过，还在朝更前面的人大声呼喊。
        - id: ch01-b82
          speaker: christopher_robin
          text: 别怕，豆豆，我来啦！
        - id: ch01-b83
          speaker: narrator
          text: 可噗没有光喊，他已经找到了能用的东西。在豆豆下方两个水潭远的地方，噗拿着一根长杆，稳稳站在水边。袋鼠妈妈赶到他身旁，握住长杆的另一头。他们两人一起把它横在水潭下方。豆豆顺着水漂过来，嘴里还在得意地冒着“看我游泳”。他撞上了长杆，终于抓住它，沿着杆子爬出水面。
        - id: ch01-b84
          speaker: roo
          text: 你们看见了吗？噗，你看见我游泳了吗？我刚才那样就叫游泳！兔子，你看见了吗？小猪，你猜我刚才做了什么？我在游泳！克里斯托弗·罗宾，你看见我……
          emotion: happy
        - id: ch01-b85
          speaker: narrator
          text: 豆豆一上岸，袋鼠妈妈便一边责备他，一边忙着把他的脸、爪子和全身擦干。豆豆根本顾不上挨骂，逢人便问，有没有看见他游泳。可是，克里斯托弗·罗宾一句也没有听进去。他没有看豆豆，只是一直看着噗，还有噗手里的那根长杆。
        - id: ch01-b86
          speaker: christopher_robin
          text: 噗，你从哪儿找到这根杆子的？
        - id: ch01-b87
          speaker: pooh
          text: 我就是找到了。我想它应该能派上用场，所以把它捡起来了。
        - id: ch01-b88
          speaker: christopher_robin
          text: 噗，探险结束了。你发现了北极！
          emotion: surprised
        - id: ch01-b89
          speaker: pooh
          text: 噢，原来我找到北极了！
        - id: ch01-b90
          speaker: narrator
          text: 等大家带着豆豆回到屹耳身边，才发现他还坐在原来的地方，尾巴依然泡在水里。他背对着刚才那场忙乱，好像什么也没有改变。
        - id: ch01-b91
          speaker: eeyore
          text: 谁叫豆豆快一点。我的尾巴冷了。我本来不想提，可还是提一句。我不想抱怨，可它就是冷了。
        - id: ch01-b92
          speaker: roo
          text: 我来啦！你看见我游泳了吗？
        - id: ch01-b93
          speaker: eeyore
          text: 噢，原来你来了。跟我想的一模一样，我的尾巴已经一点知觉也没有。水把它泡得完全麻木了。事情就是这样。既然没有谁在意，我想大概也没什么关系。
        - id: ch01-b94
          speaker: christopher_robin
          text: 可怜的老屹耳，我来给你擦干。
        - id: ch01-b95
          speaker: narrator
          text: 克里斯托弗·罗宾拿出自己的手帕，认真替屹耳擦起尾巴。他擦得很用力，希望那条冷冰冰、失去知觉的尾巴能快点恢复过来。
        - id: ch01-b96
          speaker: eeyore
          text: 谢谢你。只有你懂得尾巴。其他人不肯想，他们没有想象力。在他们眼里，尾巴不是尾巴，只是身后多出来的一小截。
        - id: ch01-b97
          speaker: christopher_robin
          text: 别放在心上，屹耳。现在好些了吗？
        - id: ch01-b98
          speaker: eeyore
          text: 也许又有一点像尾巴了。你明白吧，它又像是属于我的了。
        - id: ch01-b99
          speaker: pooh
          text: 你好，屹耳。
        - id: ch01-b100
          speaker: eeyore
          text: 你好，噗。谢谢你问候。再过一两天，我大概就能重新用它了。
        - id: ch01-b101
          speaker: pooh
          text: 用什么？我刚才没有在谈什么呀。
        - id: ch01-b102
          speaker: eeyore
          text: 又是我弄错了。我以为你在为我麻木的尾巴难过，还问能不能帮忙。
        - id: ch01-b103
          speaker: pooh
          text: 没有，那不是我说的。也许是别人说的。
        - id: ch01-b104
          speaker: eeyore
          text: 那你见到他时，替我谢谢他。
        - id: ch01-b105
          speaker: narrator
          text: 噗听不懂屹耳在说什么，只好不安地望向克里斯托弗·罗宾，希望朋友替自己解释清楚。
        - id: ch01-b106
          speaker: christopher_robin
          text: 噗发现了北极。多棒呀，是不是？
          emotion: happy
        - id: ch01-b107
          speaker: narrator
          text: 听见克里斯托弗·罗宾当着所有伙伴这样宣布，噗谦虚地低下头，看着自己刚刚发现的那根北极。那根长杆刚才还横在水潭上，帮助豆豆爬出了水。
        - id: ch01-b108
          speaker: eeyore
          text: 就是这根杆子？这就是我们一直在找的东西？
        - id: ch01-b109
          speaker: christopher_robin
          text: 对，就是这根杆子。
        - id: ch01-b110
          speaker: pooh
          text: 对，这就是我们找的东西。
        - id: ch01-b111
          speaker: eeyore
          text: 噢。好吧，不管怎么说，至少没有下雨。
        - id: ch01-b112
          speaker: narrator
          text: 大家把长杆郑重地插进地里。克里斯托弗·罗宾找出一张字条，牢牢系在杆子上。这样一来，往后无论谁经过这里，都会知道字条上写的三句话。第一句是“北极”。第二句是“噗发现于此”。最后一句是“噗找到了它”。
        - id: ch01-b113
          speaker: narrator
          text: 北极发现以后，大家便一起回家了。我想，豆豆回去以后，大概洗了一个热水澡，然后直接上床睡觉。不过，这件事我也不是十分确定。噗回到了自己的家。他想起自己今天做成的大事，心里非常骄傲。为了让自己恢复精神，他又吃了一点东西。
