  chapters:
    - id: ch01
      title: In Which Christopher Robin Leads an Expotition to the North Pole
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One fine day, Pooh climbed to the top of the Forest to see whether Christopher Robin cared about Bears at all. Over breakfast that morning, with marmalade spread lightly on a honeycomb or two, Pooh had thought of a new song. It began, “Sing Ho! for the life of a Bear.” Then he scratched his head. It was a very good first line, but what should come next? He tried singing “Ho” a few times. That did not help. Perhaps “Hi for the life of a Bear” would be better. He tried that too, and it wasn't.
        - id: ch01-b02
          speaker: pooh
          text: >-
            Very well. I'll sing the first line twice, very quickly. Then perhaps the third and fourth lines will come out before I have time to think. That will make it a Good Song. Here goes!
        - id: ch01-b03
          speaker: pooh
          text: |-
            Sing Ho! for the life of a Bear!
            Sing Ho! for the life of a Bear!
            I don't much mind if it rains or snows,
            'Cause I've got lots of honey on my nice new nose.
            I don't much care if it snows or thaws,
            'Cause I've got lots of honey on my nice clean paws!
            Sing Ho! for a Bear!
            Sing Ho! for a Pooh!
            And I'll have a little something in an hour or two!
        - id: ch01-b04
          speaker: narrator
          text: >-
            Pooh liked the song so much that he sang it all the way up the Forest. As he went, he thought about that last line. If he kept singing much longer, it really would be time for his little something. Then the song would be saying something that was no longer true. That would never do, so Pooh changed the song into a hum.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Christopher Robin sat outside his door, pulling on his Big Boots. Big Boots meant an Adventure. Pooh wiped the honey from his nose, made himself as neat as he could, and tried to look Ready for Anything.
        - id: ch01-b06
          speaker: pooh
          text: >-
            Good morning, Christopher Robin!
        - id: ch01-b07
          speaker: christopher_robin
          text: >-
            Hi, Pooh Bear. I can't get this boot on.
        - id: ch01-b08
          speaker: pooh
          text: >-
            That's too bad.
        - id: ch01-b09
          speaker: christopher_robin
          text: >-
            Would you lean against me, please? I keep pulling so hard that I fall over backward.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Pooh sat down, planted his feet, and pushed against Christopher Robin's back. Christopher Robin pushed back and tugged and tugged until the boot went on.
        - id: ch01-b11
          speaker: pooh
          text: >-
            That's done. What comes next?
        - id: ch01-b12
          speaker: christopher_robin
          text: >-
            Everyone is going on an Expedition. Thanks, Pooh.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Christopher Robin stood and brushed himself off. Pooh leaned forward eagerly.
        - id: ch01-b14
          speaker: pooh
          text: >-
            An Expotition? I've never been on one of those. Where are we going on it?
        - id: ch01-b15
          speaker: christopher_robin
          text: >-
            Expedition, silly old Bear. There's an “x” in it. We're going to discover the North Pole.
        - id: ch01-b16
          speaker: pooh
          text: >-
            Oh! I know. What exactly is the North Pole?
        - id: ch01-b17
          speaker: narrator
          text: >-
            Pooh did not really know, and Christopher Robin was not entirely sure either.
        - id: ch01-b18
          speaker: christopher_robin
          text: >-
            It's a thing you discover.
        - id: ch01-b19
          speaker: pooh
          text: >-
            I see. Are Bears good at discovering one?
        - id: ch01-b20
          speaker: christopher_robin
          text: >-
            Of course. Rabbit and Kanga and everyone will be good at it too. An Expedition means a long line of everybody. Go tell the others to get ready while I check my gun. Everyone must bring Provisions.
        - id: ch01-b21
          speaker: pooh
          text: >-
            Bring what?
        - id: ch01-b22
          speaker: christopher_robin
          text: >-
            Things to eat.
        - id: ch01-b23
          speaker: pooh
          text: >-
            Oh, good! I thought you said Provisions. I'll tell them.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Pooh stumped away and met Rabbit first.
        - id: ch01-b25
          speaker: pooh
          text: >-
            Hello, Rabbit. Is that you?
        - id: ch01-b26
          speaker: rabbit
          text: >-
            Let's pretend it isn't and see what happens.
        - id: ch01-b27
          speaker: pooh
          text: >-
            I have a message for you.
        - id: ch01-b28
          speaker: rabbit
          text: >-
            I'll pass it along to him.
        - id: ch01-b29
          speaker: pooh
          text: >-
            We're all going on an Expotition with Christopher Robin!
        - id: ch01-b30
          speaker: rabbit
          text: >-
            What will it be when we're on it?
        - id: ch01-b31
          speaker: pooh
          text: >-
            Some kind of boat, I think. We're going to discover a Pole. Or perhaps a Mole. Anyway, we're going to discover it.
        - id: ch01-b32
          speaker: rabbit
          text: >-
            So we are, are we?
        - id: ch01-b33
          speaker: pooh
          text: >-
            Yes. And we must bring Pro... things to eat, in case we want to eat them. I'm going to Piglet's now. Will you tell Kanga?
        - id: ch01-b34
          speaker: narrator
          text: >-
            Pooh hurried down to Piglet's house. Piglet sat outside, blowing happily at a dandelion and wondering whether something would happen this year, next year, sometime, or never. He had just found out it would be never. Now he was trying to remember what “it” was and hoping it wasn't anything nice.
        - id: ch01-b35
          speaker: pooh
          text: >-
            Piglet! We're all going on an Expotition, with things to eat. We're going to discover something.
        - id: ch01-b36
          speaker: piglet
          text: >-
            What are we discovering?
        - id: ch01-b37
          speaker: pooh
          text: >-
            Oh, just something.
        - id: ch01-b38
          speaker: piglet
          text: >-
            It isn't anything fierce, is it?
        - id: ch01-b39
          speaker: pooh
          text: >-
            Christopher Robin never said it was fierce. He only said it had an “x.”
        - id: ch01-b40
          speaker: piglet
          text: >-
            Their necks don't worry me. It's their teeth. But if Christopher Robin is coming, I won't mind anything.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Before long, everyone was ready at the top of the Forest, and the Expotition set out. Christopher Robin and Rabbit led the way. Piglet and Pooh marched behind them. Next came Kanga, carrying Roo in her pocket, with Owl beside her. Eeyore followed after Owl. Then, stretching out at the very end, came a long line of Rabbit's friends-and-relations.
        - id: ch01-b42
          speaker: rabbit
          text: >-
            I didn't invite them. They simply came. They always do. They can march at the back, after Eeyore.
        - id: ch01-b43
          speaker: eeyore
          text: >-
            Here's what I say. It's unsettling. I didn't want to come on this Expo-whatever-Pooh-called-it. I only came to be obliging. But here I am. If I'm the end of it, then let me be the end. Every time I sit down for a little rest, I have to sweep away half a dozen of Rabbit's smaller friends-and-relations. That isn't an Expo-anything. It's a Confused Noise. That's what I say.
        - id: ch01-b44
          speaker: owl
          text: >-
            I understand Eeyore's point. If you ask me—
        - id: ch01-b45
          speaker: eeyore
          text: >-
            I'm not asking. I'm telling everyone. We can hunt for the North Pole, or we can play “Here We Go Gathering Nuts and May” with the back end of an ant's nest. It makes no difference to me.
        - id: ch01-b46
          speaker: narrator
          text: >-
            A shout came from the front of the line.
        - id: ch01-b47
          speaker: christopher_robin
          text: >-
            Come on!
        - id: ch01-b48
          speakers: [pooh, piglet]
          ensemble: duo
          text: >-
            Come on!
        - id: ch01-b49
          speaker: owl
          text: >-
            Come along!
        - id: ch01-b50
          speaker: rabbit
          text: >-
            We're moving. I must get to the front.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Rabbit hurried up to Christopher Robin.
        - id: ch01-b52
          speaker: eeyore
          text: >-
            All right. We're going. Just Don't Blame Me.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Off they all went to discover the Pole. As they walked, they chatted about one thing and then another. Pooh was the only quiet one. He was making up another song in his head, and that took all his attention. At last the first verse was ready, and he turned to Piglet.
        - id: ch01-b54
          speaker: pooh
          text: >-
            I've finished the first verse.
        - id: ch01-b55
          speaker: piglet
          text: >-
            The first verse of what?
        - id: ch01-b56
          speaker: pooh
          text: >-
            My song.
        - id: ch01-b57
          speaker: piglet
          text: >-
            What song?
        - id: ch01-b58
          speaker: pooh
          text: >-
            This one.
        - id: ch01-b59
          speaker: piglet
          text: >-
            Which one do you mean?
        - id: ch01-b60
          speaker: pooh
          text: >-
            Listen, Piglet, and you'll hear it.
        - id: ch01-b61
          speaker: piglet
          text: >-
            How do you know I wasn't listening already?
        - id: ch01-b62
          speaker: narrator
          text: >-
            Pooh had no answer to that, so he sang.
        - id: ch01-b63
          speaker: pooh
          text: |-
            They all set out to discover the Pole,
            Owl and Piglet and Rabbit and all.
            It's a Thing you Discover, or so I've been told,
            By Owl and Piglet and Rabbit and all.
            Eeyore, Christopher Robin, and Pooh,
            And Rabbit's relations all came too.
            But nobody knew where the Pole might be.
            Sing Hey! for Owl and Rabbit and all!
        - id: ch01-b64
          speaker: christopher_robin
          text: >-
            Quiet, Pooh! We're coming to a Dangerous Place.
        - id: ch01-b65
          speaker: pooh
          text: >-
            Quiet, Piglet!
        - id: ch01-b66
          speaker: piglet
          text: >-
            Quiet, Kanga!
        - id: ch01-b67
          speaker: kanga
          text: >-
            Quiet, Owl!
        - id: ch01-b68
          speaker: narrator
          text: >-
            Roo whispered “Quiet” to himself several times.
        - id: ch01-b69
          speaker: owl
          text: >-
            Quiet, Eeyore!
        - id: ch01-b70
          speaker: eeyore
          text: >-
            QUIET!
          emotion: angry
        - id: ch01-b71
          speakers: [rabbit_relative_1, rabbit_relative_2, rabbit_relative_3]
          ensemble: chorus
          text: >-
            Quiet! Quiet! Pass it down!
        - id: ch01-b72
          speaker: narrator
          text: >-
            Rabbit's friends-and-relations hurriedly whispered the warning to one another, all the way down the line. At last it reached the smallest relative of all. Poor Alexander Beetle thought the entire Expotition was telling him, and only him, to be quiet. It upset him so much that he buried himself headfirst in a crack in the ground. He stayed there for two whole days, waiting for the danger to pass. Then he rushed home and lived quietly with his aunt from that day onward.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Ahead of them, a stream twisted and tumbled between high rocky banks. Christopher Robin saw at once that it was dangerous.
        - id: ch01-b74
          speaker: christopher_robin
          text: >-
            This is exactly the sort of place for an Ambush.
        - id: ch01-b75
          speaker: pooh
          text: >-
            What kind of bush? A gorse bush?
        - id: ch01-b76
          speaker: narrator
          text: >-
            Pooh whispered the question to Piglet, but Owl heard him.
        - id: ch01-b77
          speaker: owl
          text: >-
            My dear Pooh, surely you know what an Ambush is.
        - id: ch01-b78
          speaker: piglet
          text: >-
            Owl, that was a private whisper. You didn't need to—
        - id: ch01-b79
          speaker: owl
          text: >-
            An Ambush is a kind of Surprise.
        - id: ch01-b80
          speaker: pooh
          text: >-
            A gorse bush can surprise you too.
        - id: ch01-b81
          speaker: piglet
          text: >-
            As I was about to tell Pooh, an Ambush is a sort of Surprise.
        - id: ch01-b82
          speaker: owl
          text: >-
            When people suddenly jump out at you, that is an Ambush.
        - id: ch01-b83
          speaker: piglet
          text: >-
            There you are, Pooh. If people jump at you all at once, it's an Ambush.
        - id: ch01-b84
          speaker: pooh
          text: >-
            Then I do know what an Ambush is. A gorse bush Ambushed me once. I fell out of a tree, and it sprang at me all at once. Afterward, it took me six whole days to get every prickle out.
        - id: ch01-b85
          speaker: owl
          text: >-
            We are not discussing gorse bushes.
          emotion: angry
        - id: ch01-b86
          speaker: pooh
          text: >-
            I am.
        - id: ch01-b87
          speaker: narrator
          text: >-
            They moved very cautiously upstream, picking their way from one rock to the next. After they had gone some distance, the high banks widened on both sides. That left a level strip of grass beside the water on each bank, just wide enough for everyone to sit down and rest. The moment Christopher Robin saw it, he called a halt. The whole Expotition stopped and settled on the grass.
        - id: ch01-b88
          speaker: christopher_robin
          text: >-
            We should eat all the Provisions now. Then we won't have so much to carry.
        - id: ch01-b89
          speaker: pooh
          text: >-
            Eat all the what?
        - id: ch01-b90
          speaker: piglet
          text: >-
            Everything we brought.
        - id: ch01-b91
          speaker: narrator
          text: >-
            Piglet began at once.
        - id: ch01-b92
          speaker: pooh
          text: >-
            That's an excellent idea.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Pooh began too.
        - id: ch01-b94
          speaker: christopher_robin
          text: >-
            Has everyone got something?
        - id: ch01-b95
          speaker: narrator
          text: >-
            Christopher Robin's mouth was full when he asked.
        - id: ch01-b96
          speaker: eeyore
          text: >-
            Everyone except me. As Usual. I don't suppose one of you happens to be sitting on a thistle?
        - id: ch01-b97
          speaker: pooh
          text: >-
            I think I am. Ow! Yes, I was. I wondered what that was.
          emotion: surprised
        - id: ch01-b98
          speaker: narrator
          text: >-
            Pooh stood and looked behind him.
        - id: ch01-b99
          speaker: eeyore
          text: >-
            Thank you, Pooh. If you're finished with it.
        - id: ch01-b100
          speaker: narrator
          text: >-
            Eeyore moved to Pooh's place and started eating the thistle.
        - id: ch01-b101
          speaker: eeyore
          text: >-
            Sitting on thistles does them no Good, you know. It takes all the Life out of them. You might remember that another time, all of you. A little Consideration for a thistle, a little Thought for Others, makes all the difference.
        - id: ch01-b102
          speaker: narrator
          text: >-
            As soon as Christopher Robin finished his lunch, he leaned close and whispered to Rabbit. Rabbit answered, “Yes, yes, of course,” in a very important way. Then the two of them walked a little way upstream, where the others could not hear.
        - id: ch01-b103
          speaker: christopher_robin
          text: >-
            I didn't want the others to hear. Rabbit, do you know what the North Pole looks like?
        - id: ch01-b104
          speaker: rabbit
          text: >-
            Well now, that's quite a question.
        - id: ch01-b105
          speaker: christopher_robin
          text: >-
            I knew once. I've just sort of forgotten.
        - id: ch01-b106
          speaker: rabbit
          text: >-
            How funny. I knew once too, but I've sort of forgotten as well.
        - id: ch01-b107
          speaker: christopher_robin
          text: >-
            Maybe it's simply a pole stuck in the ground.
        - id: ch01-b108
          speaker: rabbit
          text: >-
            It must be a pole, or they wouldn't call it one. And a pole ought to be stuck in the ground. Where else could you stick it?
        - id: ch01-b109
          speaker: christopher_robin
          text: >-
            That's what I thought.
        - id: ch01-b110
          speaker: rabbit
          text: >-
            The only question is, where is it stuck?
        - id: ch01-b111
          speaker: christopher_robin
          text: >-
            That's what we're trying to find.
        - id: ch01-b112
          speaker: narrator
          text: >-
            They went back to the others. Piglet was stretched out on his back, sleeping peacefully. Roo had gone to the stream and was washing his face and paws. Kanga proudly explained to everyone that this was the very first time he had washed his face all by himself. Meanwhile, Owl was telling Kanga an Interesting Anecdote. It was full of long words such as “Encyclopedia” and “Rhododendron.” Kanga was not listening to it.
        - id: ch01-b113
          speaker: eeyore
          text: >-
            I don't approve of all this washing. This modern behind-the-ears nonsense. What do you think, Pooh?
        - id: ch01-b114
          speaker: pooh
          text: >-
            Well, I think—
        - id: ch01-b115
          speaker: narrator
          text: >-
            We never found out what Pooh thought. Before he could finish, Roo gave a sudden squeak. Then came a splash from the stream and a loud cry of alarm from Kanga. Every peaceful thing that had been happening beside the water stopped at once.
        - id: ch01-b116
          speaker: eeyore
          text: >-
            So much for washing.
        - id: ch01-b117
          speaker: rabbit
          text: >-
            Roo fell in!
          emotion: surprised
        - id: ch01-b118
          speaker: narrator
          text: >-
            Rabbit and Christopher Robin raced down the bank to help.
        - id: ch01-b119
          speaker: roo
          text: >-
            Look at me! I'm swimming!
          emotion: happy
        - id: ch01-b120
          speaker: narrator
          text: >-
            Roo bobbed in the middle of the pool. Then the current swept him over a little waterfall and into the next pool.
        - id: ch01-b121
          speaker: kanga
          text: >-
            Roo, darling, are you all right?
          emotion: fearful
        - id: ch01-b122
          speaker: roo
          text: >-
            Yes! Watch me swi—
          emotion: happy
        - id: ch01-b123
          speaker: narrator
          text: >-
            Over the next waterfall he went, into another pool.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Everyone found something to do. Piglet was wide awake in an instant. He jumped up and down, making little “Oh, I say!” noises. Owl began explaining that in a case of Sudden and Temporary Immersion, the Important Thing was to keep the Head Above Water. Kanga raced along the bank beside Roo. At every pool she anxiously asked whether he was quite sure he was all right. And wherever Roo happened to be at that moment, he answered by calling, “Look at me swimming!”
        - id: ch01-b125
          speaker: narrator
          text: >-
            Eeyore turned around and lowered his tail into the first pool. With his back to the trouble, he grumbled to himself.
        - id: ch01-b126
          speaker: eeyore
          text: >-
            All this washing. Grab my tail, little Roo, and you'll be all right.
        - id: ch01-b127
          speaker: narrator
          text: >-
            Christopher Robin and Rabbit hurried past him, calling to everyone farther downstream.
        - id: ch01-b128
          speaker: christopher_robin
          text: >-
            Hold on, Roo! I'm coming!
        - id: ch01-b129
          speaker: rabbit
          text: >-
            Somebody put something across the stream farther down!
        - id: ch01-b130
          speaker: narrator
          text: >-
            But Pooh was already getting something. He had gone two pools below Roo and found a long pole. He stood there with it held firmly in both paws. When Kanga reached him, she took one end, and the two of them stretched the pole across the lower part of the pool. Roo drifted toward them, still bubbling proudly, “Look at me swimming!” Then he floated against the pole, caught hold of it, and climbed safely out of the water.
        - id: ch01-b131
          speaker: roo
          text: >-
            Did you see me swim? Pooh, did you see? That's what I was doing. Swimming! Rabbit, did you see me? Hello, Piglet! Guess what I was doing! I was swimming! Christopher Robin, did you see me—
          emotion: happy
        - id: ch01-b132
          speaker: narrator
          text: >-
            Kanga scolded Roo while she rubbed him down, but he was too excited to stop talking. He asked Pooh, Rabbit, Piglet, and Christopher Robin whether each of them had seen him swimming. Christopher Robin did not answer. He was no longer watching Roo at all. He was staring at Pooh and the long pole still held in Pooh's paws.
        - id: ch01-b133
          speaker: christopher_robin
          text: >-
            Pooh, where did that pole come from?
        - id: ch01-b134
          speaker: narrator
          text: >-
            Pooh looked down at the pole in his paws.
        - id: ch01-b135
          speaker: pooh
          text: >-
            I found it. I thought it might be useful, so I picked it up.
        - id: ch01-b136
          speaker: christopher_robin
          text: >-
            Pooh, the Expedition is finished. You found the North Pole!
        - id: ch01-b137
          speaker: pooh
          text: >-
            Oh!
          emotion: surprised
        - id: ch01-b138
          speaker: narrator
          text: >-
            After Roo was safely out, everyone made their way back upstream. Eeyore had not moved. He was still sitting where they had left him, with his tail hanging down into the cold water of the first pool.
        - id: ch01-b139
          speaker: eeyore
          text: >-
            Will somebody tell Roo to hurry? My tail is getting cold. I don't want to mention it. Still, I am mentioning it, because there it is. My tail is cold.
        - id: ch01-b140
          speaker: roo
          text: >-
            Here I am!
        - id: ch01-b141
          speaker: eeyore
          text: >-
            Oh. There you are.
        - id: ch01-b142
          speaker: roo
          text: >-
            Did you see me swimming?
        - id: ch01-b143
          speaker: narrator
          text: >-
            Eeyore pulled his tail from the water and swished it from side to side.
        - id: ch01-b144
          speaker: eeyore
          text: >-
            Just as I expected. All the feeling is gone. The water has numbed it completely. That's what it has done. Numbed it. Still, as long as nobody else minds, I suppose it's all right.
        - id: ch01-b145
          speaker: christopher_robin
          text: >-
            Poor Eeyore. I'll dry it for you.
        - id: ch01-b146
          speaker: narrator
          text: >-
            Christopher Robin took out his handkerchief and rubbed Eeyore's tail.
        - id: ch01-b147
          speaker: eeyore
          text: >-
            Thank you, Christopher Robin. You're the only one who seems to understand anything about tails. The others don't think. That's the trouble with them. They have no imagination. To them, a tail isn't really a tail at all. It's nothing more than a Little Bit Extra at the back.
        - id: ch01-b148
          speaker: christopher_robin
          text: >-
            Never mind, Eeyore. Is that any better?
        - id: ch01-b149
          speaker: narrator
          text: >-
            Christopher Robin rubbed as hard as he could.
        - id: ch01-b150
          speaker: eeyore
          text: >-
            It's beginning to feel like a tail again. It Belongs now, if you know what I mean.
        - id: ch01-b151
          speaker: pooh
          text: >-
            Hello, Eeyore.
        - id: ch01-b152
          speaker: narrator
          text: >-
            Pooh came over carrying his pole.
        - id: ch01-b153
          speaker: eeyore
          text: >-
            Hello, Pooh. Thank you for asking, but I should be able to use it again in a day or two.
        - id: ch01-b154
          speaker: pooh
          text: >-
            Use what?
        - id: ch01-b155
          speaker: eeyore
          text: >-
            The thing we're talking about.
        - id: ch01-b156
          speaker: pooh
          text: >-
            I wasn't talking about anything.
        - id: ch01-b157
          speaker: narrator
          text: >-
            Pooh looked puzzled.
        - id: ch01-b158
          speaker: eeyore
          text: >-
            My mistake again. I thought you were telling me how sorry you felt about my tail being numb, and asking whether there was anything you could do to help me.
        - id: ch01-b159
          speaker: pooh
          text: >-
            No. That wasn't me. Perhaps it was somebody else.
        - id: ch01-b160
          speaker: narrator
          text: >-
            Pooh thought a moment before offering this suggestion.
        - id: ch01-b161
          speaker: eeyore
          text: >-
            Then thank him for me when you see him.
        - id: ch01-b162
          speaker: narrator
          text: >-
            Pooh looked anxiously at Christopher Robin.
        - id: ch01-b163
          speaker: christopher_robin
          text: >-
            Pooh found the North Pole! Isn't that wonderful?
          emotion: happy
        - id: ch01-b164
          speaker: narrator
          text: >-
            Pooh looked modestly at the ground.
        - id: ch01-b165
          speaker: eeyore
          text: >-
            Is that it?
        - id: ch01-b166
          speaker: christopher_robin
          text: >-
            Yes.
        - id: ch01-b167
          speaker: eeyore
          text: >-
            Is that what we came to find?
        - id: ch01-b168
          speaker: pooh
          text: >-
            Yes.
        - id: ch01-b169
          speaker: eeyore
          text: >-
            Oh. Well, at least it didn't rain.
        - id: ch01-b170
          speaker: narrator
          text: >-
            They carried the pole to a good place and stuck it firmly in the ground. Christopher Robin made a message and tied it onto the pole for everyone to see. It said, “North Pole. Discovered by Pooh. Pooh found it.”
        - id: ch01-b171
          speaker: narrator
          text: >-
            With the North Pole standing there and the message tied to it, the Expotition was truly over. Everyone turned around and went home again. I think Roo was given a hot bath and sent straight to bed, though I cannot be completely sure.
        - id: ch01-b172
          speaker: narrator
          text: >-
            Pooh went back to his own house. Feeling very proud of what he had done, he had a little something to revive himself.
