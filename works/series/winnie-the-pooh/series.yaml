cover_prompt: |-
  A wordless cover scene in an English woodland of the 1920s shows Christopher Robin sharing a quiet expedition with his toy-animal friends. Christopher Robin is a small boy with straight fair hair, a pale smock, short trousers, socks, and strap shoes; Pooh is a honey-colored teddy bear with simple stitched features and no clothing, Piglet a tiny pink cloth pig, Eeyore a worn gray stuffed donkey with a pinned-on tail, and Rabbit an alert brown woodland rabbit. They cross a shallow stream on stepping stones while Pooh carefully passes a small jar of honey toward Piglet, making friendship and help the focal action. An old oak, bluebells, and a modest wooden bridge establish the Hundred Acre Wood without reproducing any later commercial map or design. Use a low child-height three-quarter view with the group in the lower half and generous calm woodland sky above the canopy. Base every figure on the public-domain text and period toys, with no resemblance to Disney or any other film, animation, or branded adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
