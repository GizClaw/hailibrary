audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 小心谨慎，紧张时语速加快，鼓起勇气时格外认真
        timbre: 轻柔稚嫩
        pace: 轻快而富有变化
        pitch: 高
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 郑重自信，喜欢卖弄学问
        timbre: 浑厚清晰
        pace: 从容
        pitch: 中低
    eeyore:
      display_name: 屹耳
      tts:
        delivery: 阴郁缓慢，总把失望说得郑重其事
        timbre: 低沉粗哑
        pace: 缓慢
        pitch: 低
    roo:
      display_name: 豆豆
      tts:
        delivery: 活泼稚气，兴奋时急着把话说出来
        timbre: 清脆幼嫩
        pace: 明快
        pitch: 高
    kanga:
      display_name: 袋鼠妈妈
      tts:
        delivery: 温柔稳重，带着自然的照料口吻
        timbre: 柔和温暖
        pace: 平稳
        pitch: 中等
  chapters:
    - id: ch01
      title: 一次特别的宴会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳重新照进森林，还带来了山楂花香。溪流找回了自己清秀的模样，欢快地叮咚作响。一个个小水洼躺在那里，梦见自己见识过的生活和做过的大事。温暖宁静的林中，布谷鸟小心地试着嗓子，再听听自己喜不喜欢。斑鸠则懒洋洋、舒舒服服地抱怨，一切都是另一个家伙的错，不过也没有多大关系。就在这样的日子里，克里斯托弗·罗宾用自己特有的方式吹了一声口哨，猫头鹰便从百亩林飞来，看看有什么事。
        - id: ch01-b02
          speaker: christopher_robin
          text: 猫头鹰，我要办一次宴会，而且是特别的宴会。噗在洪水里救了小猪，就是为了那件事。
        - id: ch01-b03
          speaker: owl
          text: 噢，原来这次宴会是为了噗救小猪那件事，是吗？
        - id: ch01-b04
          speaker: christopher_robin
          text: 对，就是为了那件事。宴会就在明天，请你尽快告诉噗，再把所有人都通知到。你现在就去告诉他们，好吗，猫头鹰？
        - id: ch01-b05
          speaker: owl
          text: 噢，就在明天，是吗？
        - id: ch01-b06
          speaker: narrator
          text: 猫头鹰本想说一句很有智慧的话，好让自己显得格外有帮助，可他一句也想不出，只好飞去通知大家。他第一个去找的人就是噗。
        - id: ch01-b07
          speaker: owl
          text: 噗，克里斯托弗·罗宾要办宴会。
        - id: ch01-b08
          speaker: pooh
          text: 噢！会有那种小小的、上面涂着粉红糖霜的蛋糕吗？
        - id: ch01-b09
          speaker: narrator
          text: 猫头鹰觉得，谈论粉红糖霜小蛋糕这种事有失身份，便把克里斯托弗·罗宾的话原原本本告诉噗，又飞去找屹耳。噗却越想越多。他先想，别的动物会不会都知道这是特别的“噗的宴会”。克里斯托弗·罗宾有没有告诉大家“浮熊号”、“噗的脑子号”，还有那些由他发明、又由他亲自乘过的了不起的船？接着他又担心，万一大家把这些全忘了，谁也弄不清宴会为什么举行，那该多糟。越是这样担心，宴会在他脑子里就越搅越乱，像一场处处都不对劲、什么都不顺的梦。那个梦在他的脑袋里自己唱了起来，一遍又一遍，最后变成了一首忧心歌。
        - id: ch01-b10
          speaker: pooh
          text: 为噗欢呼三声！为谁？为噗！可他做了什么？我还当你早就知道。他救了朋友，没让朋友被水泡。为熊欢呼三声！在什么地方？不是在哪里，是为了熊！他自己不会游水，却把朋友救了回来。他救了谁？哎呀，请你认真听清，我从头到尾说的都是噗。说的是谁？说的是噗！对不起，我怎么总是把这件事忘记。
        - id: ch01-b11
          speaker: pooh
          text: 话说噗是一只脑子大得不得了的熊。请你再说一遍！他的脑子大得不得了。什么东西大得不得了？这个嘛，他平时吃得很多，至于他到底会不会游水，我也实在说不妥。不过他确实漂了起来，坐着一艘自己发明的船而来。坐着一艘什么？这个嘛，与其说是船，不如说是只罐儿。
        - id: ch01-b12
          speaker: pooh
          text: 所以现在，让我们衷心为他欢呼三声。衷心欢呼哪三声？愿他年复一年同我们长久相伴，越来越健康，越来越聪明，也越来越富有！为噗欢呼三声！为谁？为噗！为熊欢呼三声！在什么地方？不是在哪里，是为了熊！为奇妙的小熊维尼欢呼三声！不过，谁能告诉我，他究竟做了什么事？
        - id: ch01-b13
          speaker: narrator
          text: 噗心里正唱着，猫头鹰已经找到了屹耳。
        - id: ch01-b14
          speaker: owl
          text: 屹耳，克里斯托弗·罗宾要办宴会。有一份给你的邀请。
        - id: ch01-b15
          speaker: eeyore
          text: 真有意思。我想，他们会把踩过的零碎东西送一点下来给我。真仁慈，真体贴。不必客气，千万别提。你说有一份邀请？那是什么样的东西？又是谁把它掉下来的？
        - id: ch01-b16
          speaker: owl
          text: 邀请不是吃的东西。它是请你明天来参加宴会！
        - id: ch01-b17
          speaker: eeyore
          text: 你说的是小猪，就是耳朵老在激动的小家伙。我会告诉他的。
        - id: ch01-b18
          speaker: owl
          text: 不，不是小猪，是你！我当然肯定。克里斯托弗·罗宾亲口说了，所有人，要我告诉所有人，一个也不能漏。
        - id: ch01-b19
          speaker: eeyore
          text: 所有人，除了屹耳？
        - id: ch01-b20
          speaker: owl
          text: 是所有人。
        - id: ch01-b21
          speaker: eeyore
          text: 啊，那一定是弄错了。不过即使如此，我还是会来。只是明天下雨的话，可别把责任怪到我头上。
    - id: ch02
      title: 噗的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天没有下雨。克里斯托弗·罗宾用几块长木板搭了一张长桌，大家围着坐下。他坐在一头，噗坐在另一头。一边依次是猫头鹰、屹耳和小猪，另一边是兔子、豆豆和袋鼠妈妈。兔子的亲朋好友则在草地上到处找地方待着，满怀希望地等着，看有没有人同他们说话，有没有人从桌上掉下什么东西，或者有没有人忽然想问他们现在几点钟。这是豆豆有生以来第一次参加宴会，他兴奋极了，刚一坐下就说起话来。
        - id: ch02-b02
          speaker: roo
          text: 你好，噗！
        - id: ch02-b03
          speaker: pooh
          text: 你好，豆豆！
        - id: ch02-b04
          speaker: narrator
          text: 豆豆在座位上蹦了一会儿，又尖声向小猪问好。小猪正忙着吃东西，没有工夫说话，只朝他挥了挥爪子。
        - id: ch02-b05
          speaker: roo
          text: 你好，屹耳！
        - id: ch02-b06
          speaker: eeyore
          text: 马上就会下雨，不信你等着瞧。
        - id: ch02-b07
          speaker: narrator
          text: 豆豆照屹耳说的等着瞧，想看看雨会不会不下。雨果然没有下，于是他又尖声向猫头鹰问好。猫头鹰慈祥地叫他“小家伙”，接着继续告诉克里斯托弗·罗宾，他的一位朋友险些遇上的一场意外。克里斯托弗·罗宾根本不认识那位朋友。
        - id: ch02-b08
          speaker: kanga
          text: 亲爱的，先喝完牛奶，再说话。
        - id: ch02-b09
          speaker: narrator
          text: 豆豆一边喝着牛奶，一边想说自己可以同时喝牛奶和讲话。结果牛奶呛住了他，大家只好拍了他好半天的背，又替他擦了好半天。等大家差不多都吃够了，克里斯托弗·罗宾拿勺子敲了敲桌子。所有人都停止说话，安静下来。只有豆豆还在打完最后几个响亮的嗝，又努力装出那声音是兔子的某位亲戚发出来的样子。
        - id: ch02-b10
          speaker: christopher_robin
          text: 这次宴会，是因为某个人做了一件事才举行的。我们全都知道那个人是谁。因为他做了那件事，所以这是他的宴会。我还准备了一件礼物送给他，就在这里……咦，礼物到底在哪儿呢？
        - id: ch02-b11
          speaker: narrator
          text: 克里斯托弗·罗宾还在寻找，屹耳郑重地咳了一声，开始讲话。
        - id: ch02-b12
          speaker: eeyore
          text: 朋友们，也包括各位零碎人物，能在我的宴会上见到大家，我非常愉快。或者我该说，到目前为止，我一直很愉快。我做的那件事实在算不了什么。你们任何一位都会做同样的事，当然，兔子、猫头鹰、袋鼠妈妈和噗除外。我的话也不包括小猪和豆豆，因为他们太小了。只是碰巧由我做了而已。不消说，我做那件事，绝不是为了得到克里斯托弗·罗宾现在正在寻找的东西。到桌子下面找找。我那样做，只因为我觉得，我们大家都应该尽力帮助别人。我觉得，我们大家都应该……
        - id: ch02-b13
          speaker: roo
          text: 嗝——呃！
        - id: ch02-b14
          speaker: kanga
          text: 豆豆，亲爱的！
        - id: ch02-b15
          speaker: roo
          text: 是我吗？
        - id: ch02-b16
          speaker: piglet
          text: 噗，屹耳到底在说什么？我还以为这是你的宴会。
        - id: ch02-b17
          speaker: pooh
          text: 我不知道。原先我也以为是我的，可现在大概不是了。
        - id: ch02-b18
          speaker: piglet
          text: 我宁愿这是你的，也不愿是屹耳的。
        - id: ch02-b19
          speaker: pooh
          text: 我也是。
        - id: ch02-b20
          speaker: roo
          text: 嗝——呃！
        - id: ch02-b21
          speaker: eeyore
          text: 正——如——我——刚——才——所——说！我刚才正说到这里，却被种种响亮的声音打断了。我觉得……
        - id: ch02-b22
          speaker: christopher_robin
          text: 找到了！把它传给那个傻乎乎的老噗吧。这份礼物就是给噗的。
          emotion: happy
        - id: ch02-b23
          speaker: eeyore
          text: 给噗的？
          emotion: surprised
        - id: ch02-b24
          speaker: christopher_robin
          text: 当然。他是全世界最好的熊。
        - id: ch02-b25
          speaker: eeyore
          text: 我早该料到。不过说到底，也没什么可抱怨的。我还有朋友呢。就在昨天，还有人同我说过话。兔子撞到我身上，还说了一声“讨厌”，那是上星期，还是上上星期来着？这就是交际生活，总有事情发生。
        - id: ch02-b26
          speaker: narrator
          text: 谁也没再听屹耳说话。大家七嘴八舌地催噗打开礼物，问他里面是什么。有人说自己早就知道，也有人马上说他才不知道。噗当然在尽可能快地拆，可他没有剪断绳子，因为谁也说不准一截绳子什么时候会派上用场。最后，礼物终于拆开了。
        - id: ch02-b27
          speaker: narrator
          text: 噗一看清礼物，高兴得差点摔倒。那是一只特别的铅笔盒。里面有写着B的铅笔，B代表熊。有写着HB的铅笔，代表助人为乐的熊，还有写着BB的铅笔，代表勇敢的熊。盒里有削铅笔的小刀，也有一块橡皮，写错的字可以用它擦掉。还有一把尺子，能画出直线，让那些字沿着线往前走。尺子上标着一英寸一英寸的刻度，万一想知道什么东西有多少英寸，就能用它来量。蓝铅笔、红铅笔和绿铅笔也在里面，可以用三种颜色写下特别的话。所有这些可爱的东西，都分别装在铅笔盒自己的小口袋里。只要把盒子一扣，它就会咔嗒一声合上。而这一切，全都属于噗。
        - id: ch02-b28
          speaker: pooh
          text: 噢！谢谢你。
          emotion: happy
        - id: ch02-b29
          speaker: narrator
          text: 除了屹耳，所有人都望着噗，发出一片高兴的惊叹。噗实在太高兴，只能用熊那种低低的声音咕哝出一句谢谢。
        - id: ch02-b30
          speaker: eeyore
          text: 写字这回事，铅笔啦，还有乱七八糟的东西啦。要是问我，人们未免把它们看得太了不起。全是傻玩意儿，根本没什么用。
    - id: ch03
      title: 我们说再见
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，宴会结束了。大家都向克里斯托弗·罗宾说过“再见”和“谢谢你”。噗和小猪一起踏着金色的暮光，若有所思地往家走。很长一段路上，他们谁也没有说话，只是安静地走着。最后，还是小猪先开了口。
        - id: ch03-b02
          speaker: piglet
          text: 噗，你早晨醒来以后，对自己说的第一句话是什么？
        - id: ch03-b03
          speaker: pooh
          text: 早饭吃什么？那你会说什么，小猪？
        - id: ch03-b04
          speaker: piglet
          text: 我会对自己说，真想知道今天会发生什么让人兴奋的事。
        - id: ch03-b05
          speaker: narrator
          text: 噗听完以后，若有所思地点了点头。他觉得小猪早晨说的话和自己早晨说的话其实并没有分别。
        - id: ch03-b06
          speaker: pooh
          text: 其实是一回事。
        - id: ch03-b07
          speaker: christopher_robin
          text: 后来发生了什么？什么时候？就是第二天早晨。
        - id: ch03-b08
          speaker: narrator
          text: 我告诉他，我不知道后来发生了什么。
        - id: ch03-b09
          speaker: christopher_robin
          text: 以后你能想一想，再讲给我和噗听吗？噗很想听。
        - id: ch03-b10
          speaker: narrator
          text: 我说，如果他们非常想听，也许可以。克里斯托弗·罗宾马上告诉我，噗确实很想听。接着他深深叹了口气，抓住熊的一条腿把它提起来，朝门口走去。小熊维尼倒着身子，一路拖在他身后。到了门边，克里斯托弗·罗宾又回过头来。
        - id: ch03-b11
          speaker: christopher_robin
          text: 来看我洗澡吗？
        - id: ch03-b12
          speaker: narrator
          text: 我说，也许吧。
        - id: ch03-b13
          speaker: christopher_robin
          text: 噗的铅笔盒比我的更好吗？
        - id: ch03-b14
          speaker: narrator
          text: 我告诉他，噗的铅笔盒没有比他的更好，两只盒子一模一样。他听了便点点头，走了出去。片刻以后，我听见小熊维尼跟在他身后，一阶一阶，咚、咚、咚地上了楼梯。
