  chapters:
    - id: ch01
      title: In Which Christopher Robin Gives Pooh a Party, and We Say Good-bye
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, the sun came back over the Forest and brought the scent of may with it. The streams tinkled happily now that they had found their own pretty shapes again. Little pools lay dreaming about the life they had seen and the big things they had done. In the warm, quiet Forest, the cuckoo carefully tried out his voice and listened to see if he liked it. The wood-pigeons complained gently in their lazy, comfortable way. Everything was the other fellow's fault, they said, though it did not matter very much. On just such a day, Christopher Robin gave a special whistle of his own. Owl flew out of the Hundred Acre Wood to see what he wanted.
        - id: ch01-b02
          speaker: christopher_robin
          text: >-
            Owl, I'm going to have a party.
        - id: ch01-b03
          speaker: owl
          text: >-
            Oh, you are, are you?
        - id: ch01-b04
          speaker: christopher_robin
          text: >-
            And it will be a special party. It's because Pooh saved Piglet from the flood.
        - id: ch01-b05
          speaker: owl
          text: >-
            Ah. So that's the reason, is it?
        - id: ch01-b06
          speaker: christopher_robin
          text: >-
            Yes. Please tell Pooh right away, and tell everybody else too. The party is tomorrow.
        - id: ch01-b07
          speaker: owl
          text: >-
            Tomorrow, is it? I see.
        - id: ch01-b08
          speaker: christopher_robin
          text: >-
            So you'll go and tell them, Owl?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Owl was trying to be as helpful as possible. He searched for something very wise to say, but nothing came to him. So he flew off to spread the news. Pooh was the first person he found.
        - id: ch01-b10
          speaker: owl
          text: >-
            Pooh, Christopher Robin is having a party.
        - id: ch01-b11
          speaker: pooh
          text: >-
            Oh! Will there be those little cakes with pink sugar icing?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Pooh could see that Owl expected a little more from him, which was why he asked about the cakes. Owl thought pink sugar icing was far beneath such an important conversation. Instead of discussing it, he told Pooh exactly what Christopher Robin had said. Then he flew away to find Eeyore.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A party for Pooh! How grand! Pooh wondered whether everyone would know it was a special Pooh Party. Had Christopher Robin told them about The Floating Bear, and the Brain of Pooh, and all the wonderful ships Pooh had invented and sailed? It would be awful if everybody had forgotten. Perhaps no one would quite know what the party was for. The more Pooh thought about it, the more the party tangled itself up in his mind, the way a dream does when nothing goes right. Soon the dream began singing itself over and over, until it turned into an Anxious Pooh Song.
        - id: ch01-b14
          speaker: pooh
          text: |-
            Three cheers for Pooh!
            For who?
            For Pooh!
            Why? What did he do?
            I thought you knew.
            He saved his friend from a wetting!

            Three cheers for Bear!
            For where?
            For Bear!
            He couldn't swim,
            but he rescued him!
            He rescued who?
            Oh, please listen. I'm talking about Pooh!
            About who?
            About Pooh!
            I'm sorry. I keep forgetting.

            Well, Pooh was a Bear of Enormous Brain.
            Say that again!
            Of enormous brain.
            Of enormous what?
            Well, he ate a lot,
            and whether he could swim or not,
            he managed to float
            on a sort of boat.
            On a sort of what?
            Well, a sort of pot.

            So give him three hearty cheers!
            Three hearty whiches?
            And hope he'll stay for years and years,
            growing in health and wisdom and riches!
            Three cheers for Pooh!
            For who?
            For Pooh!
            Three cheers for Bear!
            For where?
            For Bear!
            Three cheers for wonderful Winnie-the-Pooh!
            Somebody tell me, what did he do?
        - id: ch01-b15
          speaker: narrator
          text: >-
            While all this was going on inside Pooh, Owl was speaking to Eeyore.
        - id: ch01-b16
          speaker: owl
          text: >-
            Eeyore, Christopher Robin is having a party.
        - id: ch01-b17
          speaker: eeyore
          text: >-
            Very interesting. I suppose someone will send me whatever gets stepped on and left over. Very kind. Very thoughtful. No need to mention it.
        - id: ch01-b18
          speaker: owl
          text: >-
            There is an invitation for you.
        - id: ch01-b19
          speaker: eeyore
          text: >-
            What does it look like?
        - id: ch01-b20
          speaker: owl
          text: >-
            An invitation!
        - id: ch01-b21
          speaker: eeyore
          text: >-
            Yes, I heard you. Who dropped it?
        - id: ch01-b22
          speaker: owl
          text: >-
            It isn't food. It means you're being asked to the party tomorrow.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Eeyore slowly shook his head.
        - id: ch01-b24
          speaker: eeyore
          text: >-
            You mean Piglet. The small one with the excited ears. That's Piglet. I'll let him know.
        - id: ch01-b25
          speaker: owl
          text: >-
            No, Eeyore! I mean you!
        - id: ch01-b26
          speaker: eeyore
          text: >-
            You're quite sure?
        - id: ch01-b27
          speaker: owl
          text: >-
            Of course I am. Christopher Robin told me to invite all of them. Every one.
        - id: ch01-b28
          speaker: eeyore
          text: >-
            Every one except Eeyore?
        - id: ch01-b29
          speaker: owl
          text: >-
            Every one.
        - id: ch01-b30
          speaker: eeyore
          text: >-
            Ah. No doubt somebody made a mistake. Even so, I shall come. Only don't blame me when it rains.
        - id: ch01-b31
          speaker: narrator
          text: >-
            It did not rain. Christopher Robin built a long table from long pieces of wood, and everyone sat around it. Christopher Robin took one end and Pooh took the other. Owl, Eeyore, and Piglet sat between them along one side. Rabbit, Roo, and Kanga sat between them on the other. Rabbit's friends and relations spread themselves over the grass nearby. They waited hopefully. Perhaps someone would speak to them. Perhaps someone would drop something, or even ask them the time.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Roo had never been to a party before, and he was very excited. The moment everyone sat down, he started talking.
        - id: ch01-b33
          speaker: roo
          text: >-
            Hello, Pooh!
          emotion: happy
        - id: ch01-b34
          speaker: pooh
          text: >-
            Hello, Roo!
        - id: ch01-b35
          speaker: narrator
          text: >-
            Roo bounced up and down in his seat for a while. Then he tried again.
        - id: ch01-b36
          speaker: roo
          text: >-
            Hello, Piglet!
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: >-
            Piglet was too busy to answer, so he waved a paw.
        - id: ch01-b38
          speaker: roo
          text: >-
            Hello, Eeyore!
        - id: ch01-b39
          speaker: narrator
          text: >-
            Eeyore gave him a gloomy nod.
        - id: ch01-b40
          speaker: eeyore
          text: >-
            It'll rain soon. You wait and see.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Roo looked to see. It did not rain.
        - id: ch01-b42
          speaker: roo
          text: >-
            Hello, Owl!
        - id: ch01-b43
          speaker: owl
          text: >-
            Hello there, my little fellow.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Owl said it in a kindly way, then went right back to telling Christopher Robin about an accident. It had nearly happened to a friend of Owl's whom Christopher Robin did not know.
        - id: ch01-b45
          speaker: kanga
          text: >-
            Finish your milk first, dear. Then you can talk.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Roo was already drinking his milk. He tried to explain, without stopping, that he could drink and talk at the same time. It did not work. Kanga had to pat him on the back and dry him for quite a long time afterward.
        - id: ch01-b47
          speaker: narrator
          text: >-
            When everyone had almost eaten enough, Christopher Robin banged his spoon on the table. Every voice stopped. The only sound left was Roo finishing a loud round of hiccups while trying to look as though one of Rabbit's relations had made them.
        - id: ch01-b48
          speaker: christopher_robin
          text: >-
            We're having this party because someone did something. We all know who it was, and this is his party because of what he did. I have a present for him, and here it is.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Christopher Robin felt around for the present. Then he leaned close and whispered.
        - id: ch01-b50
          speaker: christopher_robin
          text: >-
            Where did it go?
        - id: ch01-b51
          speaker: narrator
          text: >-
            While Christopher Robin searched, Eeyore gave an impressive cough and began a speech. Partway through it, he raised one front leg to his mouth and offered Christopher Robin a loud whisper about looking under the table.
        - id: ch01-b52
          speaker: eeyore
          text: >-
            Friends, including the assorted extra ones, it is a great pleasure to see you at my party. Or perhaps I should say it has been a pleasure so far. What I did was nothing. Any of you would have done it, except Rabbit, Owl, Kanga, and Pooh. Piglet and Roo are too small, so naturally I don't mean them either. Still, any of you would have done the same. It simply happened to be Me. And I certainly did not do it because I hoped to receive whatever Christopher Robin is looking for now. Try under the table. No, I did what I did because we should all help whenever we can. I feel that we should all...
        - id: ch01-b53
          speaker: roo
          text: >-
            H-hup!
        - id: ch01-b54
          speaker: kanga
          text: >-
            Roo, dear!
        - id: ch01-b55
          speaker: roo
          text: >-
            Was that me?
          emotion: surprised
        - id: ch01-b56
          speaker: piglet
          text: >-
            Pooh, what is Eeyore talking about?
        - id: ch01-b57
          speaker: pooh
          text: >-
            I don't know.
          emotion: sad
        - id: ch01-b58
          speaker: piglet
          text: >-
            I thought this was your party.
        - id: ch01-b59
          speaker: pooh
          text: >-
            So did I, at first. I suppose it isn't after all.
          emotion: sad
        - id: ch01-b60
          speaker: piglet
          text: >-
            I'd rather have your party than Eeyore's.
        - id: ch01-b61
          speaker: pooh
          text: >-
            Yes. So would I.
        - id: ch01-b62
          speaker: roo
          text: >-
            H-hup!
        - id: ch01-b63
          speaker: eeyore
          text: >-
            As I was saying before those loud noises interrupted me, I feel that...
          emotion: angry
        - id: ch01-b64
          speaker: christopher_robin
          text: >-
            I found it! Pass it down to silly old Pooh. It's for Pooh!
          emotion: happy
        - id: ch01-b65
          speaker: eeyore
          text: >-
            For Pooh?
          emotion: surprised
        - id: ch01-b66
          speaker: christopher_robin
          text: >-
            Of course. He's the best bear in the whole world.
        - id: ch01-b67
          speaker: eeyore
          text: >-
            I should have known. After all, I can't complain. I have my friends. Why, somebody spoke to me only yesterday. And was it last week, or the week before, when Rabbit bumped into me and said, “Bother”? That's the social life for you. Always something happening.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Nobody was listening to Eeyore now. Everyone else called for Pooh to open the present. They asked what it was, claimed they already knew, or told one another they did not know at all. Pooh was opening it as quickly as he possibly could. Still, he would not cut the string. You never knew when a piece of string might be Useful. At last, he got it undone.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Pooh was so delighted by what he saw that he nearly fell over. It was a Special Pencil Case. Some pencils were marked “B” for Bear. Others were marked “HB” for Helping Bear, or “BB” for Brave Bear. There was a knife for sharpening every pencil. There was an india-rubber for rubbing out anything Pooh spelled wrong. A ruler made straight lines for the words to walk on. It had inches marked along it too, in case Pooh ever wanted to know how many inches something was. Blue Pencils, Red Pencils, and Green Pencils could say special things in blue and red and green. Every lovely thing rested in a little pocket of its own. The Special Case closed with a click whenever you clicked it. And every bit of it was for Pooh.
        - id: ch01-b70
          speaker: pooh
          text: >-
            Oh!
          emotion: surprised
        - id: ch01-b71
          speakers: [piglet, christopher_robin, kanga, roo]
          ensemble: chorus
          text: >-
            Oh, Pooh!
          emotion: happy
        - id: ch01-b72
          speaker: pooh
          text: >-
            Thank you.
          emotion: happy
        - id: ch01-b73
          speaker: eeyore
          text: >-
            All this business about writing. Pencils and so forth. Overrated, if you ask me. Silly stuff. Nothing to it.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Later, after everyone had said good-bye and thanked Christopher Robin, Pooh and Piglet walked home together through the golden evening. They were thoughtful, and for a long while neither one spoke.
        - id: ch01-b75
          speaker: piglet
          text: >-
            Pooh, when you wake up in the morning, what's the first thing you say to yourself?
        - id: ch01-b76
          speaker: pooh
          text: >-
            What's for breakfast? What do you say, Piglet?
        - id: ch01-b77
          speaker: piglet
          text: >-
            I wonder what exciting thing will happen today?
        - id: ch01-b78
          speaker: narrator
          text: >-
            Pooh considered this and nodded.
        - id: ch01-b79
          speaker: pooh
          text: >-
            It's the same thing.
        - id: ch01-b80
          speaker: christopher_robin
          text: >-
            And what happened?
        - id: ch01-b81
          speaker: narrator
          text: >-
            When?
        - id: ch01-b82
          speaker: christopher_robin
          text: >-
            The next morning.
        - id: ch01-b83
          speaker: narrator
          text: >-
            I don't know.
        - id: ch01-b84
          speaker: christopher_robin
          text: >-
            Could you think about it and tell Pooh and me sometime?
        - id: ch01-b85
          speaker: narrator
          text: >-
            I could, if you wanted it very much.
        - id: ch01-b86
          speaker: christopher_robin
          text: >-
            Pooh does.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Christopher Robin sighed deeply. He picked up his bear by one leg and walked toward the door, with Winnie-the-Pooh trailing behind him. At the doorway, he turned back.
        - id: ch01-b88
          speaker: christopher_robin
          text: >-
            Are you coming to watch me have my bath?
        - id: ch01-b89
          speaker: narrator
          text: >-
            I might.
        - id: ch01-b90
          speaker: christopher_robin
          text: >-
            Was Pooh's pencil case any better than mine?
        - id: ch01-b91
          speaker: narrator
          text: >-
            It was exactly the same. Christopher Robin nodded and went out.
        - id: ch01-b92
          speaker: narrator
          text: >-
            A moment later, I heard Winnie-the-Pooh going up the stairs behind him. Bump, bump, bump.
