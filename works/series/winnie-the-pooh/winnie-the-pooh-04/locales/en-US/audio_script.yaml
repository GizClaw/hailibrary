audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    piglet:
      display_name: Piglet
      tts:
        delivery: eager and delicately expressive
        timbre: small and bright
        pace: lightly quick
        pitch: high
  chapters:
    - id: ch01
      title: Piglet's Grand House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Piglet lived in a very grand house in the middle of a beech tree. The
            beech tree stood in the middle of the forest, and Piglet lived right in
            the middle of the house. Beside his door was a broken piece of board.
            On it were the words, "TRESPASSERS W."
        - id: ch01-b02
          speaker: narrator
          text: >-
            Christopher Robin once asked what those words meant. Piglet told him
            they were his grandfather's name, and that the board had been in the
            family for a very long time.
        - id: ch01-b03
          speaker: christopher_robin
          text: >-
            But nobody can be named Trespassers W.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Piglet said somebody certainly could, because his grandfather had been.
            Trespassers W was short for Trespassers Will, which was short for
            Trespassers William. His grandfather had two names in case he lost one.
            If one name went missing, he would still have the other. Trespassers
            came from an uncle, while William came from Trespassers himself.
        - id: ch01-b05
          speaker: christopher_robin
          text: >-
            I've got two names.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Christopher Robin said this as if it were nothing unusual at all.
        - id: ch01-b07
          speaker: piglet
          text: >-
            Well, there you are. That proves it.
    - id: ch02
      title: Tracks in the Snow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One fine winter day, Piglet was sweeping the snow away from his front
            door. When he looked up, he saw Winnie-the-Pooh. Pooh was walking around
            and around in a circle, with his mind on something else. Piglet called
            to him, but Pooh kept right on walking.
        - id: ch02-b02
          speaker: piglet
          text: >-
            Hello! What are you doing, Pooh?
        - id: ch02-b03
          speaker: pooh
          text: >-
            I'm hunting.
        - id: ch02-b04
          speaker: piglet
          text: >-
            What are you hunting?
        - id: ch02-b05
          speaker: pooh
          text: >-
            I'm following something.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Pooh made this sound very mysterious. Piglet came nearer.
        - id: ch02-b07
          speaker: piglet
          text: >-
            What sort of something?
        - id: ch02-b08
          speaker: pooh
          text: >-
            That's what I keep asking myself. I say, "What?"
        - id: ch02-b09
          speaker: piglet
          text: >-
            And what do you think you'll tell yourself?
        - id: ch02-b10
          speaker: pooh
          text: >-
            I won't know until I catch up with it. Here, look down. What do you see?
        - id: ch02-b11
          speaker: narrator
          text: >-
            Pooh pointed at the snow in front of him.
        - id: ch02-b12
          speaker: piglet
          text: >-
            Tracks. Paw prints. Oh, Pooh! Could it be a... a... a Woozle?
        - id: ch02-b13
          speaker: narrator
          text: >-
            A little squeak of excitement slipped out of Piglet.
        - id: ch02-b14
          speaker: pooh
          text: >-
            It could be. Sometimes paw prints belong to a Woozle, and sometimes they
            don't. There's no way to be certain just from looking at the marks. Paw
            prints are like that.
        - id: ch02-b15
          speaker: narrator
          text: >-
            With that, Pooh went on following the tracks. Piglet watched for a
            minute or two and then hurried after him. Soon Pooh stopped short. He
            leaned over the marks in the snow, looking puzzled.
        - id: ch02-b16
          speaker: piglet
          text: >-
            What's wrong?
        - id: ch02-b17
          speaker: pooh
          text: >-
            Here's the funny part. There are two animals now. Another whatever-it-is
            has joined the first whatever-it-was, and they're traveling together.
            So now the two of them are going along in company. Would you come with
            me, Piglet, just in case they turn out to be Hostile Animals?
        - id: ch02-b18
          speaker: narrator
          text: >-
            Piglet gave his ear a pleasant little scratch. He said he had nothing
            else to do before Friday, so he would be delighted to come, especially
            if it really was a Woozle.
        - id: ch02-b19
          speaker: pooh
          text: >-
            You mean if they really are two Woozles.
        - id: ch02-b20
          speaker: narrator
          text: >-
            Piglet repeated that he was free until Friday. Then the two friends set
            off together.
    - id: ch03
      title: More and More Woozles
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A small grove of larch trees stood nearby. The two creatures, if that
            was what they were, seemed to have walked all the way around it. So Pooh
            and Piglet walked around it too.
        - id: ch03-b02
          speaker: narrator
          text: >-
            As they went, Piglet told Pooh how Grandfather Trespassers W used to get
            the stiffness out of himself after he had been tracking. He also
            explained how, in his later years, his grandfather had suffered from
            shortness of breath. Piglet had several other interesting things to say
            about him as they walked.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Pooh wondered what a grandfather might be like. Perhaps the two
            creatures ahead of them were really two grandfathers. If they were,
            perhaps he would be allowed to take one home and keep it. He tried to
            imagine what Christopher Robin would say about that. All the while, the
            tracks continued ahead of them.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Suddenly Pooh stopped and pointed straight in front of him.
        - id: ch03-b05
          speaker: pooh
          text: >-
            Look!
          emotion: surprised
        - id: ch03-b06
          speaker: piglet
          text: >-
            What is it?
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: >-
            Piglet jumped. Then, so nobody would think he had been frightened, he
            jumped up and down a few more times as if he were exercising.
        - id: ch03-b08
          speaker: pooh
          text: >-
            The tracks! A third animal is walking with the other two!
          emotion: surprised
        - id: ch03-b09
          speaker: piglet
          text: >-
            Pooh! Could this one be another Woozle?
        - id: ch03-b10
          speaker: pooh
          text: >-
            No, because these marks are different. So it could be two Woozles and
            one Wizzle. Or perhaps it's two Wizzles and one Woozle. We'd better keep
            following them.
        - id: ch03-b11
          speaker: narrator
          text: >-
            They went on. By now they felt a little uneasy. What if those three
            animals meant to be hostile? Piglet very much wished Grandfather T. W.
            were here instead of somewhere else. Pooh began to think how nice it
            would be to meet Christopher Robin. Quite by accident, of course, and
            only because Pooh liked him so much.
        - id: ch03-b12
          speaker: narrator
          text: >-
            All at once, Pooh stopped again. He licked the end of his nose to cool
            himself, because he felt hotter and more anxious than he ever had in his
            life. There were four animals ahead of them now.
        - id: ch03-b13
          speaker: pooh
          text: >-
            Can you see them, Piglet? There are three Woozles, as it were, and one
            Wizzle, as it was. Another Woozle has joined them!
        - id: ch03-b14
          speaker: narrator
          text: >-
            It certainly looked that way. The tracks crossed over one another here
            and tangled together there. But every so often, four separate sets of
            paw prints showed plainly in the snow, one set after another.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Piglet licked the end of his own nose, but it did not comfort him much.
        - id: ch03-b16
          speaker: piglet
          text: >-
            I think I've just remembered something. It's something I forgot to do
            yesterday, and I won't be able to do it tomorrow. So I really ought to
            go home and do it now.
        - id: ch03-b17
          speaker: pooh
          text: >-
            We can do it this afternoon. I'll come and help you.
        - id: ch03-b18
          speaker: piglet
          text: >-
            Oh, it can't be done in the afternoon. It's a very particular morning
            sort of thing. You have to do it in the morning, if possible between...
            What time would you say it is?
        - id: ch03-b19
          speaker: pooh
          text: >-
            About twelve.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Pooh looked up at the sun.
        - id: ch03-b21
          speaker: piglet
          text: >-
            Yes, between twelve and twelve-oh-five. So, dear old Pooh, if you'll
            excuse me... What's that?
          emotion: surprised
    - id: ch04
      title: The Tracks Explained
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Pooh looked toward the sky. A whistle sounded again. This time he looked
            into the branches of a large oak tree and saw one of his friends.
        - id: ch04-b02
          speaker: pooh
          text: >-
            It's Christopher Robin.
        - id: ch04-b03
          speaker: piglet
          text: >-
            Ah, then you'll be fine. Christopher Robin will keep you safe. Goodbye!
        - id: ch04-b04
          speaker: narrator
          text: >-
            Piglet trotted home as fast as he could, very glad to be out of danger
            again. Christopher Robin climbed slowly down from the tree.
        - id: ch04-b05
          speaker: christopher_robin
          text: >-
            Silly old Bear, what were you doing? First you walked around the grove
            twice by yourself. Then Piglet caught up with you, and you both went
            around once more. And then you were about to go around a fourth time...
        - id: ch04-b06
          speaker: pooh
          text: >-
            Wait just a moment.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Pooh held up one paw. Then he sat down and thought as thoughtfully as he
            knew how. He placed his paw inside one of the prints. He scratched his
            nose twice. Then he stood up.
        - id: ch04-b08
          speaker: pooh
          text: >-
            Yes. Now I understand.
        - id: ch04-b09
          speaker: pooh
          text: >-
            I have been Foolish and Deluded. I am a Bear of No Brain at All.
          emotion: sad
        - id: ch04-b10
          speaker: christopher_robin
          text: >-
            You're the Best Bear in All the World.
          emotion: calm
        - id: ch04-b11
          speaker: pooh
          text: >-
            Am I?
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: >-
            Pooh's face suddenly brightened.
        - id: ch04-b13
          speaker: pooh
          text: >-
            Well, at least it's almost time for lunch.
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: >-
            So Pooh went home to have it.
