audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 认真敏感，偶尔带一点不服气
        timbre: 细小明亮
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 小猪的气派住宅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小猪的家十分气派，坐落在一棵山毛榉树的正中央。那棵树又长在森林的正中央，而小猪自己，就住在房子的正中央。这几个“正中央”，一个也不能少。屋旁有块断掉的木牌，上面只剩“擅入者威……”几个字。
        - id: ch01-b02
          speaker: narrator
          text: 克里斯托弗·罗宾问过那几个字是什么意思。小猪说，那是祖父的名字，在他们家传了许多年。克里斯托弗·罗宾可不相信谁会叫“擅入者威”。小猪却说，祖父当然就叫这个。“擅入者威”是“擅入者威尔”的简称，而“擅入者威尔”又是“擅入者威廉”的简称。祖父准备了两个名字，丢掉一个还能剩一个。“擅入者”取自一位叔叔，“威廉”又取自“擅入者”。
        - id: ch01-b03
          speaker: christopher_robin
          text: 我也有两个名字呀。
        - id: ch01-b04
          speaker: piglet
          text: 你瞧，这正好证明我说得对。
        - id: ch01-b05
          speaker: narrator
          text: 一个晴朗的冬日，小猪正在清扫门前的雪。他抬起头，看见维尼噗绕着一个圈子不停地走，脑子里还想着别的事情。小猪喊了他一声，噗却没有停下。
        - id: ch01-b06
          speaker: piglet
          text: 你好！你到底在做什么呀？
        - id: ch01-b07
          speaker: pooh
          text: 我在打猎。
        - id: ch01-b08
          speaker: piglet
          text: 你在打什么呢？
        - id: ch01-b09
          speaker: pooh
          text: 我正追踪一样东西。
        - id: ch01-b10
          speaker: narrator
          text: 噗说得神神秘秘，小猪立刻凑近了一点。
        - id: ch01-b11
          speaker: piglet
          text: 那你追的是什么东西？
        - id: ch01-b12
          speaker: pooh
          text: 这也正是我在问自己的。我问自己，它究竟是什么呢？
        - id: ch01-b13
          speaker: piglet
          text: 你觉得自己会给出什么答案？
        - id: ch01-b14
          speaker: pooh
          text: 等我赶上它，才能回答。你先看看这里。地上有什么？
        - id: ch01-b15
          speaker: piglet
          text: 是脚印，是爪子的印子。噢，噗！会不会是一只长、长、长鼻怪？
        - id: ch01-b16
          speaker: narrator
          text: 小猪兴奋得轻轻叫出了声。
        - id: ch01-b17
          speaker: pooh
          text: 有这个可能。有时爪印是长鼻怪留下的，有时又不是。爪印这种东西，很难说得准。
    - id: ch02
      title: 两只长鼻怪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 噗说完便接着追。小猪看了一两分钟，也赶紧跑到他身边。没过多久，噗突然停住，低头研究那些脚印，越看越迷惑。
        - id: ch02-b02
          speaker: piglet
          text: 出了什么事？
        - id: ch02-b03
          speaker: pooh
          text: 这可奇怪了。现在好像有两只动物。原来的那一只，不管它是什么，又碰到了一只别的东西。它们正在一起往前走。小猪，你愿意跟我来吗？万一它们不太友好，我们也好有个伴。
        - id: ch02-b04
          speaker: narrator
          text: 小猪很有风度地挠挠耳朵。他说，自己一直到星期五都没有事情，很乐意一同前往，特别是万一那真是一只长鼻怪。
        - id: ch02-b05
          speaker: pooh
          text: 你应该说，万一那真是两只长鼻怪。
        - id: ch02-b06
          speaker: piglet
          text: 不管怎样，我到星期五以前都有空。
        - id: ch02-b07
          speaker: narrator
          text: 两个朋友就这样出发了。附近有一小片落叶松林。要是那两只动物当真是长鼻怪，它们显然一直绕着这片林子转圈。脚印走到哪里，噗和小猪就跟到哪里，也绕着林子一圈圈地走。
        - id: ch02-b08
          speaker: narrator
          text: 为了打发时间，小猪一路说个不停。他说，祖父擅入者威每次追踪以后，都会用一套办法活动僵硬的筋骨。祖父到了晚年还常常气短，此外又有许多值得一提的事情。噗听着听着，心里想的却是，祖父到底长什么样。他们如今追的，会不会根本就是两位祖父？如果真有两位，自己能不能领一位回家养着？克里斯托弗·罗宾看见了，又会说什么呢？他们各自想着这些，前面的脚印还是没有断。
        - id: ch02-b09
          speaker: narrator
          text: 噗突然站住，激动地指向前方。
        - id: ch02-b10
          speaker: pooh
          text: 快看那边！
        - id: ch02-b11
          speaker: piglet
          text: 那边有什么？
        - id: ch02-b12
          speaker: narrator
          text: 小猪吓得跳了起来。为了让人看出自己一点也不怕，他又上下跳了两三回，仿佛只是在活动身体。
        - id: ch02-b13
          speaker: pooh
          text: 你看这些脚印！又来了一只动物，现在一共有三只了！
        - id: ch02-b14
          speaker: piglet
          text: 噗，你觉得新来的也是长鼻怪吗？
        - id: ch02-b15
          speaker: pooh
          text: 不是，它的脚印不同。可能有两只长鼻怪，外加一只弯鼻怪。也可能有两只弯鼻怪，外加一只长鼻怪。我们还是继续追吧。
    - id: ch03
      title: 四只动物的脚印
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们继续绕着小树林走，心里开始有些不安。前面那三只动物说不定怀着敌意。小猪多么希望祖父擅入者威没有待在别处，而是恰好就在身边。噗也觉得，要是能忽然遇见克里斯托弗·罗宾，一定很不错。当然，那必须是一次完全偶然的相遇。他这样想，只是因为自己特别喜欢克里斯托弗·罗宾，绝不是为了别的缘故。
        - id: ch03-b02
          speaker: narrator
          text: 噗猛地又停了下来。他从来没有这么热，也没有这么担心过，只好舔舔鼻尖，让自己凉快一点。因为这一次，他们前面已经有了四只动物。
        - id: ch03-b03
          speaker: pooh
          text: 小猪，你看见了吗？这里像是三只长鼻怪和一只弯鼻怪。又有一只长鼻怪加入它们了！
        - id: ch03-b04
          speaker: narrator
          text: 眼前的脚印正是这样。它们一会儿彼此交叉，一会儿搅在一起，可每隔一段路，就能清楚地数出四套爪印。
        - id: ch03-b05
          speaker: piglet
          text: 我想起来了。我刚刚记起一件要紧事。昨天我忘了做，明天又不能做，所以现在必须回去完成。
        - id: ch03-b06
          speaker: narrator
          text: 小猪也学着噗舔了舔鼻尖。他原本希望这样能舒服一点，可惜几乎没有用处。
        - id: ch03-b07
          speaker: pooh
          text: 那就等下午再做吧，我可以陪你。
        - id: ch03-b08
          speaker: piglet
          text: 不行，那件事下午做不了。它特别讲究，必须在上午完成，最好是在一个很短的时间里。你看现在几点？
        - id: ch03-b09
          speaker: pooh
          text: 看太阳的位置，大概十二点了。
        - id: ch03-b10
          speaker: piglet
          text: 对，我刚才正要说，必须在十二点到十二点零五分之间做。所以，老朋友，要是你不介意，我就先……那是什么声音？
        - id: ch03-b11
          speaker: narrator
          text: 噗先望向天空。哨声又响了一次，他便抬头看向一棵大橡树，在枝叶间认出了一位朋友。
        - id: ch03-b12
          speaker: pooh
          text: 原来是克里斯托弗·罗宾。
        - id: ch03-b13
          speaker: piglet
          text: 那我就放心了。有他陪着，你肯定很安全。再见！
        - id: ch03-b14
          speaker: narrator
          text: 小猪说完再见，便用最快的速度一路小跑回家。他很高兴，因为自己终于又远离了所有危险。
    - id: ch04
      title: 最好的熊
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 克里斯托弗·罗宾慢慢爬下树来。
        - id: ch04-b02
          speaker: christopher_robin
          text: 你这只傻熊，刚才究竟在忙什么？你先独自绕了两圈，小猪追来以后，你们又走了一圈。刚才你正要开始第四圈呢。
        - id: ch04-b03
          speaker: pooh
          text: 请等一下，我得想一想。
        - id: ch04-b04
          speaker: narrator
          text: 噗举起一只爪子，然后坐下来，用自己能够做到的最认真方式思考。他把爪子放进一个脚印里试了试，又挠了两下鼻子，这才重新站起来。
        - id: ch04-b05
          speaker: pooh
          text: 对，我现在全明白了。我又傻又糊涂，原来我是一只完全没有脑子的熊。
        - id: ch04-b06
          speaker: christopher_robin
          text: 可你是全世界最好的熊呀。
          emotion: calm
        - id: ch04-b07
          speaker: narrator
          text: 克里斯托弗·罗宾柔声安慰他。噗听了，立刻又有了希望。
        - id: ch04-b08
          speaker: pooh
          text: 我真的是吗？
        - id: ch04-b09
          speaker: narrator
          text: 转眼间，噗的心情亮堂起来，刚才的沮丧全不见了。他又想起了一件重要的事。
        - id: ch04-b10
          speaker: pooh
          text: 不管怎么说，差不多已经到午饭时间了。
        - id: ch04-b11
          speaker: narrator
          text: 于是，噗回家吃午饭去了。
