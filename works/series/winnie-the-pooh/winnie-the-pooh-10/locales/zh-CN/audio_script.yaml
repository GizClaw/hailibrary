audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 小心谨慎，紧张时语速加快，鼓起勇气时格外认真
        timbre: 轻柔稚嫩
        pace: 轻快而富有变化
        pitch: 高
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 郑重自信，喜欢卖弄学问
        timbre: 浑厚清晰
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 小猪被水团团围住
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雨不停地下，一天接着一天。小猪活了三岁，也许已经四岁，反正他从来没见过这么多雨。
        - id: ch01-b02
          speaker: piglet
          text: 要是刚开始下雨时，我在噗家、克里斯托弗·罗宾家，或者兔子家就好了。那样一直有人陪我，不会只有我自己守在这里，猜雨什么时候停。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 他望着窗外，想象自己正和噗谈论这场雨。
        - id: ch01-b04
          speaker: piglet
          text: 噗，你以前见过这么大的雨吗？
        - id: ch01-b05
          speaker: pooh
          text: 没见过。小猪，这场雨真是糟透了。
        - id: ch01-b06
          speaker: piglet
          text: 不知道克里斯托弗·罗宾那边怎么样。
        - id: ch01-b07
          speaker: pooh
          text: 我看可怜的兔子家差不多全淹了。
        - id: ch01-b08
          speaker: narrator
          text: 小猪觉得，若能这样和朋友说说话，洪水才算一件值得经历的事。眼前的景象确实惊心动魄。他常用鼻子拱着玩的干沟，已经灌满水，变成了小溪。那些从前踩着水花就能跨过的小溪，现在滚滚流着，成了大河。至于那条真正的河，他们以前常在两岸的陡坡中间玩耍。如今河水早已冲出河床，到处铺展开来，仿佛哪儿都想占一点地方。小猪望着越涨越高的水，甚至担心它很快会连自己的床也占去。
        - id: ch01-b09
          speaker: piglet
          text: 一只很小很小的动物，被水围在正中间，实在叫人不安。克里斯托弗·罗宾和噗能爬树，袋鼠妈妈能跳，兔子能打洞，猫头鹰能飞。屹耳也能一直大声叫，等别人去救他。可我什么办法也没有。
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 雨没有一点要停的意思，水每天都升高一点。起初还在屋外，后来慢慢爬上墙，现在眼看就要碰到小猪的窗口。可小猪一直待在屋里，仍旧什么也没做。他实在想不出办法，只好把朋友们一个个想过去，猜猜他们落到同样的处境，会怎样让自己脱险。
        - id: ch01-b11
          speaker: piglet
          text: 噗的脑子不大灵，可他做的傻事最后总会变成好事。猫头鹰懂得很多，被水围住也知道该怎么办。兔子没在书里学过，却总有聪明主意。袋鼠妈妈只要担心豆豆，根本不用想，就会做出对的事。
        - id: ch01-b12
          speaker: piglet
          text: 屹耳本来就那么不快活，大概不会在意这场洪水。可是，克里斯托弗·罗宾会怎么做呢？
        - id: ch01-b13
          speaker: narrator
          text: 这一想，小猪记起克里斯托弗·罗宾讲过的故事。故事里有一个人困在荒岛上。他在纸上写了些什么，把纸装进瓶子，再把瓶子扔进大海，等别人发现。小猪忽然想到，自己也可以送出一只瓶子。只要有人捡到，或许就会赶来救他。他赶紧离开窗口，把家里没有进水的每一处地方都找了一遍，终于找到一支铅笔、一小片还干着的纸，还有一只正好带软木塞的瓶子。
        - id: ch01-b14
          speaker: piglet
          text: 纸的这一面写“救命，小猪，就是我”，另一面写“是我小猪，救命救命”。这样别人一定看得明白。
        - id: ch01-b15
          speaker: narrator
          text: 小猪把纸装进瓶子，使劲塞紧瓶塞。他把身子探出窗口，既要伸得足够远，又不能掉进水里，然后用力把瓶子扔了出去。只听扑通一声，瓶子沉了一下，很快又浮上水面。
        - id: ch01-b16
          speaker: narrator
          text: 小猪守在窗口，一直盯着瓶子慢慢漂向远处，眼睛都看酸了。他不敢把目光移开，生怕一眨眼就会把它弄丢。有时水面上的小点还是那只瓶子，有时他又怀疑，自己追着看的只是一道波纹。忽然间，小点彻底不见了。小猪知道自己再也看不见那个瓶子，也知道为了救自己，能做的事已经全做完了。接下来，只能等别人看见那张纸。
        - id: ch01-b17
          speaker: piglet
          text: 现在得靠别人想办法了。但愿他们快一点，不然我只好下水，可我根本不会游泳。真希望噗在这里。两个人待在一起，总是亲热得多。
          emotion: sad
    - id: ch02
      title: 噗和浮熊号
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雨刚开始下时，噗正在睡觉。雨不停地下，他也不停地睡。前一天实在把他累坏了。
        - id: ch02-b02
          speaker: narrator
          text: 噗发现北极以后非常得意。他问克里斯托弗·罗宾，还有没有别的极，可以留给一只脑子不大灵的熊去发现。
        - id: ch02-b03
          speaker: christopher_robin
          text: 还有南极。我想东极和西极也有，只是大家不太爱谈它们。
        - id: ch02-b04
          speaker: narrator
          text: 噗一听说还有东极和西极，立刻兴奋起来，提议大家再组织一次探险险，专门去发现东极。可克里斯托弗·罗宾已经想好另一件事，要和袋鼠妈妈一起做，不能陪他。于是噗独自出发了。讲述者已经忘了他最后到底找到东极没有，只记得噗回家时累极了。他坐下来吃晚饭，才吃了不过半个多钟头，还没来得及吃完，便在椅子上沉沉睡去，睡了又睡，怎么也不醒。
        - id: ch02-b05
          speaker: narrator
          text: 梦里，噗真的到了东极。那里铺着世上最冷的冰雪。他钻进一个蜂窝睡觉，可两条腿装不下，只能留在外面。东极的野生长鼻怪来了，把他腿上的毛全啃走，拿去给小宝宝做窝。毛越少，噗的腿越冷。
        - id: ch02-b06
          speaker: narrator
          text: 噗忽然痛得叫了一声，醒了。他仍坐在椅子上，两只脚却泡在水里，屋里四周也都是水。他哗啦哗啦蹚到门口，看了一眼外面。
        - id: ch02-b07
          speaker: pooh
          text: 事情严重了。我得赶快逃难。
        - id: ch02-b08
          speaker: narrator
          text: 噗先抱起最大的一罐蜂蜜，爬到远离水面的一根宽树枝上，这才算完成第一次逃难。接着，他又爬回已经进水的屋子，抱起第二罐，再逃到同一根树枝上。他就这样上上下下，每次救出一罐。等整场逃难终于结束，噗晃着两条腿坐在树上，身旁整整齐齐排着十罐蜂蜜。现在，他和最要紧的东西都安全了。
        - id: ch02-b09
          speaker: narrator
          text: 两天过去，噗还坐在原来的树枝上，还是晃着两条腿，不过身旁只剩四罐蜂蜜。第三天，他仍旧坐在那里，身边只剩最后一罐。第四天，噗还坐在树枝上……
        - id: ch02-b10
          speaker: narrator
          text: 就在第四天早晨，一只瓶子从树下漂过。那正是小猪送出的瓶子，可噗不知道。他远远望见，立刻把它当成了一罐蜂蜜，大喊一声便扑进水里。噗在水中挣扎着追上瓶子，一把抓住，又费了好大力气才回到树边。他浑身湿透，满以为救回了蜂蜜。可打开瓶子一看，里面没有蜂蜜，只有一张纸。
        - id: ch02-b11
          speaker: pooh
          text: 真讨厌，白白弄湿了。这张纸跑进瓶子里做什么？
        - id: ch02-b12
          speaker: narrator
          text: 噗拿出纸，认认真真地看。上面有好几个英文字母P。
        - id: ch02-b13
          speaker: pooh
          text: 这一定是一封口信。每一个P都表示Pooh，所以它是专门送给我的重要口信。可惜我不会读。我得找克里斯托弗·罗宾、猫头鹰或者小猪，请这些聪明的读书人告诉我写了什么。可是我又不会游泳，真讨厌。
        - id: ch02-b14
          speaker: narrator
          text: 噗想到了一个办法。对一只脑子很不灵光的熊来说，这个办法确实不错。
        - id: ch02-b15
          speaker: pooh
          text: 瓶子能浮，罐子也能浮。只要找一只足够大的罐子，我就能坐在上面。
        - id: ch02-b16
          speaker: narrator
          text: 他找出最大的罐子，牢牢塞住罐口。既然所有的船都有名字，噗决定把自己的船叫作“浮熊号”。他把船放进水里，跟着跳了下去。
        - id: ch02-b17
          speaker: narrator
          text: 开头那一小会儿，噗和“浮熊号”谁也弄不清谁应该在上面。试过一两个姿势以后，他们终于安排妥当。罐子浮在下面，噗神气地骑在上面，两只脚拼命划水，朝森林顶端漂去。
    - id: ch03
      title: 噗的脑子号
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 克里斯托弗·罗宾住在森林最高处。雨不断地下，水却淹不到他家。他从山顶往下看，山谷四周全是水，景象有趣极了。不过雨太大，他大多留在屋里想事情。
        - id: ch03-b02
          speaker: narrator
          text: 每天早晨，他都会撑起雨伞走出门，在水刚刚涨到的地方插下一根木棍。第二天再去，头一天的木棍已经淹得看不见了，他便沿路走到新的水边，再插一根，然后转身回家。水离家越来越近，他每天要走的路也比前一天短。第五天早晨，水已经从四面八方围住了他的家。克里斯托弗·罗宾知道，自己有生以来第一次站在一座真正的岛上。这当然叫人兴奋。
        - id: ch03-b03
          speaker: narrator
          text: 猫头鹰就在这天飞过水面，来向朋友问好。
        - id: ch03-b04
          speaker: christopher_robin
          text: 猫头鹰，这不是很好玩吗？我现在住在岛上了！
          emotion: happy
        - id: ch03-b05
          speaker: owl
          text: 近来的大气状况十分不利。
        - id: ch03-b06
          speaker: christopher_robin
          text: 你说的是什么状况？
        - id: ch03-b07
          speaker: owl
          text: 我是说，一直在下雨。
        - id: ch03-b08
          speaker: christopher_robin
          text: 对，雨确实一直在下。
        - id: ch03-b09
          speaker: owl
          text: 洪水水位已经升到史无前例的高度。
        - id: ch03-b10
          speaker: christopher_robin
          text: 你说什么升高了？
        - id: ch03-b11
          speaker: owl
          text: 我是说，到处都有很多水。不过趋势正在迅速好转，随时都可能转晴——
        - id: ch03-b12
          speaker: christopher_robin
          text: 你见到噗了吗？
        - id: ch03-b13
          speaker: owl
          text: 我没见到。刚才我正要说，天气随时都可能转晴——
        - id: ch03-b14
          speaker: christopher_robin
          text: 我一直惦记噗，希望他平安。小猪大概和他在一起。你看他们会不会有事？
        - id: ch03-b15
          speaker: owl
          text: 我想不会有事。你听我说，天气随时都可能转晴——
        - id: ch03-b16
          speaker: christopher_robin
          text: 请你快去看看吧。噗的脑子不大灵，也许会做傻事。可我那么爱他，你明白吗？
        - id: ch03-b17
          speaker: owl
          text: 当然明白。我马上去，很快就回来。
        - id: ch03-b18
          speaker: narrator
          text: 猫头鹰飞走了，没过多久又飞回来。
        - id: ch03-b19
          speaker: owl
          text: 噗现在不在家。他原先一直坐在屋外的树枝上，身边有九罐蜂蜜，可他已经离开了。
        - id: ch03-b20
          speaker: christopher_robin
          text: 噗，你到底到哪里去了？
          emotion: fearful
        - id: ch03-b21
          speaker: pooh
          text: 我就在你后面。
        - id: ch03-b22
          speaker: narrator
          text: 那个低沉的声音就在他身后。克里斯托弗·罗宾猛地回头，看见噗好端端站在那里。他又惊又喜，只来得及喊出朋友的名字，便和噗一起扑上前，紧紧抱住对方。过了好一会儿，克里斯托弗·罗宾才平静下来，重新说得出话。他马上问噗，洪水这样大，他到底是怎样来到岛上的。
        - id: ch03-b23
          speaker: pooh
          text: 我坐船来的。有人装在瓶子里，送给我一封很重要的口信。水进了我的眼睛，我读不了，只好坐船把它带来给你。
        - id: ch03-b24
          speaker: narrator
          text: 噗骄傲地递出那张纸。克里斯托弗·罗宾一读，发现这是小猪的求救信。
        - id: ch03-b25
          speaker: pooh
          text: 那里面一句也没提到噗吗？
        - id: ch03-b26
          speaker: narrator
          text: 克里斯托弗·罗宾把信念给他听。噗这才明白，纸上的P不是Pooh，而是Piglet。
        - id: ch03-b27
          speaker: pooh
          text: 原来那些P说的都是小猪。我还以为它们说的是噗呢。
        - id: ch03-b28
          speaker: christopher_robin
          text: 我们必须马上救他！我还以为小猪和你在一起。猫头鹰，你能背着他飞回来吗？
        - id: ch03-b29
          speaker: owl
          text: 我认为不能。我怀疑自己的背部肌肉承受不了他的重量。
        - id: ch03-b30
          speaker: christopher_robin
          text: 那就请你马上飞去告诉小猪，救援很快就到。我和噗来想办法，尽快赶过去。别再说了，快飞吧！
        - id: ch03-b31
          speaker: narrator
          text: 猫头鹰还在琢磨下一句话，却已经被催得飞走了。克里斯托弗·罗宾和噗朝小岛岸边走去，他要看看噗的船。
        - id: ch03-b32
          speaker: pooh
          text: 我得提前说明，它不是普通的船。有时候它的确是一艘船，有时候却更像一场意外。这得看情形。
        - id: ch03-b33
          speaker: christopher_robin
          text: 要看什么情形？
        - id: ch03-b34
          speaker: pooh
          text: 要看我在它上面，还是在它下面。
        - id: ch03-b35
          speaker: narrator
          text: 噗骄傲地指给他看“浮熊号”。那艘船和克里斯托弗·罗宾想象中的船完全不同，怎么看都只像一只塞紧的大罐子。可他看得越久，越觉得能坐着它穿过洪水的噗，实在是一只又勇敢又聪明的熊。克里斯托弗·罗宾越这样想，噗就越谦虚。他低头瞧着自己的鼻子，装作没有发现朋友在赞叹自己，也装作自己一点不勇敢、一点不聪明。
        - id: ch03-b36
          speaker: christopher_robin
          text: 可是这艘船太小，连我们两个也坐不下。
          emotion: sad
        - id: ch03-b37
          speaker: pooh
          text: 等救到小猪，就是三个人了。
        - id: ch03-b38
          speaker: christopher_robin
          text: 那就更挤了。噗熊，我们到底该怎么办？
        - id: ch03-b39
          speaker: narrator
          text: 这时，噗熊，也就是小熊维尼、小猪的朋友、兔子的伙伴、北极发现者、屹耳的安慰者和尾巴寻找者，说出了一句聪明极了的话。克里斯托弗·罗宾张着嘴，瞪大眼睛。他简直不敢相信，这还是自己认识和喜爱了那么久的那只脑子很不灵光的熊。
        - id: ch03-b40
          speaker: pooh
          text: 我们可以坐你的雨伞去救小猪。
        - id: ch03-b41
          speaker: narrator
          text: 克里斯托弗·罗宾只送给他一个问号。噗把这句话说了第二遍，朋友便送给他两个问号。等噗第三次说完，克里斯托弗·罗宾心里冒出了整整六个惊叹号。他终于看出，这个办法真的行得通。
        - id: ch03-b42
          speaker: narrator
          text: 克里斯托弗·罗宾撑开伞，把伞尖朝下放进水里。伞浮住了，却摇摇晃晃。噗先爬进去，正准备宣布一切顺利，便喝了一小口完全不想喝的水。他只好蹚回岸边。等两个人一起坐进去，伞反倒稳稳当当，不再摇了。
        - id: ch03-b43
          speaker: christopher_robin
          text: 这艘船就叫“噗的脑子号”。
        - id: ch03-b44
          speaker: narrator
          text: “噗的脑子号”立刻启航，一边优雅地打转，一边驶向西南方。
        - id: ch03-b45
          speaker: narrator
          text: 你一定能想象，小猪终于望见这艘船时有多高兴。许多年以后，他总爱回想那场可怕的洪水，也爱想象自己当时身处非常巨大的危险。可是说真的，在被洪水围住的那些日子里，他真正遇到危险的时间并不长，只有获救前的最后半小时。那场危险也不是洪水直接带来的，而是来安慰他的猫头鹰带来的。
        - id: ch03-b46
          speaker: narrator
          text: 猫头鹰飞到小猪家以后，落在房子旁边的一根树枝上，隔着窗口陪他说话。为了安慰小猪，他讲起一个非常长的故事。故事说的是猫头鹰的一位姑妈，有一回竟然弄错了，生下一只海鸥蛋。究竟怎么会发生这种事，猫头鹰讲了一句又一句，迟迟讲不到结果。整个故事越拉越长，就像这个正在说下去的句子一样，拐了许多弯，仍旧看不见尽头。
        - id: ch03-b47
          speaker: narrator
          text: 小猪趴在窗口听着，本来就没抱多少获救的希望。猫头鹰还在不停地说，小猪却安安静静、自自然然地睡着了。他的身体一点点滑出窗口，越来越靠近下面的水，最后只剩几根脚趾还勾着窗沿。就在这万分凑巧的时候，猫头鹰忽然发出一声响亮的尖叫。那不是他发现小猪要掉下去了，只是故事里那位姑妈当时说的一句话。可这一叫正好惊醒小猪，让他及时发现自己正挂在窗口。
        - id: ch03-b48
          speaker: narrator
          text: 小猪赶紧把自己缩回安全的地方，还没忘记接着听故事。
        - id: ch03-b49
          speaker: piglet
          text: 真有意思。你的姑妈后来怎么样了？
        - id: ch03-b50
          speaker: narrator
          text: 也就在这时，小猪抬眼望向水面，终于看见前来救他的好船“噗的脑子号”。克里斯托弗·罗宾是船长，噗熊是大副。他们坐在那把倒扣的伞里，一边打着转，一边穿过洪水，正朝小猪驶来。克里斯托弗·罗宾和噗又一次在最需要的时候出现了。小猪看见朋友们来救自己，心里的欢喜，你当然完全想象得到。故事确实讲完了。刚才那一大段讲得实在太累，讲述者决定就停在这里。
