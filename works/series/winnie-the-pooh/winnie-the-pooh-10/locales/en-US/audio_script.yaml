audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    piglet:
      display_name: Piglet
      tts:
        delivery: eager and delicately expressive
        timbre: small and bright
        pace: lightly quick
        pitch: high
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    owl:
      display_name: Owl
      tts:
        delivery: grand and instructive
        timbre: full and feathery
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: In Which Piglet Is Entirely Surrounded by Water
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It rained and it rained and it rained. Piglet had never seen so much rain in his whole life, and he was goodness knows how old. Three, perhaps, or maybe four. The rain went on for days and days and days.
        - id: ch01-b02
          speaker: piglet
          text: >-
            If only I'd been at Pooh's house when the rain began. Or at Christopher Robin's, or Rabbit's. Then I'd have had someone with me all this time. Instead, I'm here by myself with nothing to do but wonder when it will stop.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Looking out his window, Piglet imagined a nice conversation with Pooh.
        - id: ch01-b04
          speaker: piglet
          text: >-
            Have you ever seen rain like this, Pooh?
        - id: ch01-b05
          speaker: pooh
          text: >-
            Isn't it terrible, Piglet?
        - id: ch01-b06
          speaker: piglet
          text: >-
            I wonder what it's like over by Christopher Robin's house.
        - id: ch01-b07
          speaker: pooh
          text: >-
            Poor old Rabbit must be nearly flooded out by now.
        - id: ch01-b08
          speaker: narrator
          text: >-
            That would have been a fine thing to talk about, with Pooh answering and Piglet having someone there to hear him. There wasn't much use in having an exciting flood if you had nobody to share it with. And the flood really was exciting. The dry little ditches where Piglet often nosed around had turned into streams. The streams he used to splash across were rivers. The river where they had played so happily between the steep banks had spread right out of its bed and was taking up room everywhere. Piglet began to wonder if it might soon take up room in his bed too.
        - id: ch01-b09
          speaker: piglet
          text: >-
            It is rather worrying to be a Very Small Animal Entirely Surrounded by Water. Christopher Robin and Pooh could climb trees. Kanga could jump away, Rabbit could burrow, and Owl could fly. Eeyore could... well, he could make a loud noise until someone rescued him. But here I am, with water all around me, and I can't do anything.
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: >-
            Still the rain came down. Each day the water rose a little higher, until it was almost at Piglet's window. He still had not thought of anything to do.
        - id: ch01-b11
          speaker: piglet
          text: >-
            Now, Pooh hasn't much Brain, but he never gets hurt. He does foolish things, and somehow they come out right. Owl doesn't exactly have Brain either, but he Knows Things. He'd know the Right Thing to Do if water surrounded him. Rabbit hasn't learned from books, but he can always make a Clever Plan. Kanga isn't Clever, but she'd be so worried about Roo that she'd do a Good Thing without stopping to think. And Eeyore is always miserable, so he wouldn't mind this. But what would Christopher Robin do?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Then Piglet remembered one of Christopher Robin's stories. A man stranded on a desert island had written a message, sealed it in a bottle, and thrown it into the sea. Someone might find Piglet's bottle too and come to rescue him. He left the window and searched through every corner of his house that the water had not reached. At last he found a pencil, a small scrap of dry paper, and a bottle with a cork.
        - id: ch01-b13
          speaker: piglet
          text: |-
            Help!
            Piglet. That's me.
            It's me, Piglet. Help! Help!
        - id: ch01-b14
          speaker: narrator
          text: >-
            Piglet had written on both sides of the paper. He slipped it into the bottle and pushed the cork in as tightly as he could. Then he leaned far out the window, but not far enough to fall, and hurled the bottle as far as he could. Splash! After a moment it bobbed up again. Piglet watched it drift slowly away until his eyes hurt. Sometimes he thought he could still see the bottle. Sometimes he was only watching a ripple. At last he knew it was gone, and he had done everything he could to save himself.
        - id: ch01-b15
          speaker: piglet
          text: >-
            Now somebody else must do something. I hope they do it soon. If they don't, I'll have to swim, and I can't. So I really hope they hurry.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Piglet let out one very long sigh.
        - id: ch01-b17
          speaker: piglet
          text: >-
            I wish Pooh were here. It's so much friendlier with two.
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: >-
            When the rain began, Pooh was asleep. It rained and rained and rained, while Pooh slept and slept and slept. He had worn himself out that day. You may remember that he had discovered the North Pole. He was so proud of it that he had asked Christopher Robin whether there were any more Poles for a Bear of Little Brain to discover.
        - id: ch01-b19
          speaker: christopher_robin
          text: >-
            There's a South Pole. I suppose there must be an East Pole and a West Pole too, though people don't like to mention those.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Pooh was thrilled. He wanted everyone to set out on an Expotition to discover the East Pole. Christopher Robin, however, had thought of something else to do with Kanga. So Pooh went looking for it alone. Did he discover the East Pole? I have forgotten. But by the time he got home, he could hardly keep his eyes open. In the middle of supper, after eating for just over half an hour, he fell fast asleep in his chair.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Soon Pooh began to dream. He was at the East Pole, the coldest sort of Pole, covered in the coldest snow and ice. He had found a beehive to sleep inside, but his legs would not fit, so they had to stay outside. Wild Woozles from the East Pole came along and nibbled all the fur from Pooh's legs to make nests for their young. The more they nibbled, the colder his legs became. Then Pooh woke with a loud cry. He was still in his chair, but his feet were in water, and water was everywhere around him. He splashed over to his door and peered outside.
        - id: ch01-b22
          speaker: pooh
          text: >-
            This is Serious. I need to Escape.
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: >-
            Pooh took his largest honey pot and escaped with it to a wide branch high above the water. Then he climbed back down and escaped with another pot. When the whole Escape was over, Pooh sat on the branch with his legs dangling. Ten pots of honey sat beside him.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Two days later, Pooh still sat there, dangling his legs. Four honey pots remained beside him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Three days later, Pooh was still on the branch. Now there was one pot.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Four days later, there was Pooh...
        - id: ch01-b27
          speaker: narrator
          text: >-
            And on the morning of that fourth day, Piglet's bottle floated past. Pooh gave a mighty shout of “Honey!” and plunged into the water. He grabbed the bottle and fought his way back to the tree.
        - id: ch01-b28
          speaker: pooh
          text: >-
            Bother! I got all wet for nothing. And why is there paper in here?
        - id: ch01-b29
          speaker: narrator
          text: >-
            He pulled out the paper and studied it.
        - id: ch01-b30
          speaker: pooh
          text: >-
            Why, it's a Missage. That letter is a “P,” and there's another “P,” and another one. “P” means Pooh, so this must be a very important Missage for me. But I can't read it. I'll have to find Christopher Robin, or Owl, or Piglet. One of those Clever Readers can tell me what it says. The trouble is, I can't swim. Bother!
        - id: ch01-b31
          speaker: narrator
          text: >-
            Then Pooh had an idea. For a Bear of Very Little Brain, I think it was a good one.
        - id: ch01-b32
          speaker: pooh
          text: >-
            If a bottle floats, a jar should float too. And if the jar is very big, I can sit on top of it.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Pooh took his biggest jar and corked it shut.
        - id: ch01-b34
          speaker: pooh
          text: >-
            Every boat needs a name. Mine shall be The Floating Bear.
        - id: ch01-b35
          speaker: narrator
          text: >-
            He dropped his boat into the water and jumped after it. For a while, Pooh and The Floating Bear could not agree on which one belonged on top. They tried a position, then another. At last they settled it. The Floating Bear stayed underneath, while Pooh sat proudly astride it and paddled hard with his feet.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Christopher Robin lived at the very top of the Forest. It rained and rained and rained, but the water could not reach his house. He rather enjoyed looking down at all the water in the valleys. Still, the rain fell so hard that he spent most of his time indoors, thinking about things.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Each morning, Christopher Robin opened his umbrella and walked to the edge of the flood. He pushed a stick into the ground to mark the spot. The next morning, the water had covered it, and he could not see it at all. He marked the new edge with another stick and walked home. Day by day, there was less distance to walk. On the fifth morning, water lay on every side of him. For the first time in his life, Christopher Robin was on a real island. That was very exciting indeed.
        - id: ch01-b38
          speaker: narrator
          text: >-
            That same morning, Owl flew across the water to visit him.
        - id: ch01-b39
          speaker: christopher_robin
          text: >-
            Owl, look! Isn't this fun? I'm on an island!
          emotion: happy
        - id: ch01-b40
          speaker: owl
          text: >-
            The atmospheric conditions have been most unfavorable lately.
        - id: ch01-b41
          speaker: christopher_robin
          text: >-
            The what?
        - id: ch01-b42
          speaker: owl
          text: >-
            I mean, it has been raining.
        - id: ch01-b43
          speaker: christopher_robin
          text: >-
            Yes. It certainly has.
        - id: ch01-b44
          speaker: owl
          text: >-
            The flood has risen to a height never recorded before.
        - id: ch01-b45
          speaker: christopher_robin
          text: >-
            The who?
        - id: ch01-b46
          speaker: owl
          text: >-
            There is water almost everywhere.
        - id: ch01-b47
          speaker: christopher_robin
          text: >-
            Yes, there is.
        - id: ch01-b48
          speaker: owl
          text: >-
            However, matters should improve very shortly. At any moment—
        - id: ch01-b49
          speaker: christopher_robin
          text: >-
            Have you seen Pooh?
        - id: ch01-b50
          speaker: owl
          text: >-
            No. As I was saying, at any moment—
        - id: ch01-b51
          speaker: christopher_robin
          text: >-
            I hope he's safe. I've been thinking about him. Piglet is probably with him. Do you think they're both all right?
        - id: ch01-b52
          speaker: owl
          text: >-
            I should think so. You see, at any moment—
        - id: ch01-b53
          speaker: christopher_robin
          text: >-
            Please go and check, Owl. Pooh has very little brain, and he may do something foolish. I love him so much. You understand, don't you?
        - id: ch01-b54
          speaker: owl
          text: >-
            Of course. I'll go now and be right back.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Owl flew away. Before long, he returned.
        - id: ch01-b56
          speaker: owl
          text: >-
            Pooh is not at home.
        - id: ch01-b57
          speaker: christopher_robin
          text: >-
            He's not there?
          emotion: surprised
        - id: ch01-b58
          speaker: owl
          text: >-
            He was there. He had been sitting outside his house on a tree branch with nine honey pots. But he has gone now.
        - id: ch01-b59
          speaker: christopher_robin
          text: >-
            Oh, Pooh! Where are you?
        - id: ch01-b60
          speaker: pooh
          text: >-
            Here I am.
        - id: ch01-b61
          speaker: narrator
          text: >-
            A growly voice had spoken just behind Christopher Robin.
        - id: ch01-b62
          speaker: christopher_robin
          text: >-
            Pooh!
          emotion: happy
        - id: ch01-b63
          speaker: narrator
          text: >-
            They ran straight into each other's arms. Once Christopher Robin could talk again, he asked how Pooh had reached the island.
        - id: ch01-b64
          speaker: pooh
          text: >-
            I came on my boat. Someone sent me a Very Important Missage in a bottle. Water got in my eyes, so I couldn't read it. I brought it here for you. On my boat.
        - id: ch01-b65
          speaker: narrator
          text: >-
            With a great deal of pride, Pooh handed over the missage he had carried all that way on his boat. Christopher Robin unfolded the damp little paper and read it.
        - id: ch01-b66
          speaker: christopher_robin
          text: >-
            This is from Piglet!
          emotion: surprised
        - id: ch01-b67
          speaker: pooh
          text: >-
            Doesn't it say anything about Pooh?
        - id: ch01-b68
          speaker: narrator
          text: >-
            Pooh leaned over Christopher Robin's shoulder as the message was read aloud.
        - id: ch01-b69
          speaker: christopher_robin
          text: |-
            Help!
            Piglet. That's me.
            It's me, Piglet. Help! Help!
        - id: ch01-b70
          speaker: pooh
          text: >-
            Oh. So those “P”s mean Piglet. I thought they meant Pooh.
        - id: ch01-b71
          speaker: christopher_robin
          text: >-
            We have to save him right away! I thought he was with you. Owl, can you carry Piglet here on your back?
        - id: ch01-b72
          speaker: owl
          text: >-
            I fear not. After giving the matter serious thought, I doubt that the necessary muscles of the back—
        - id: ch01-b73
          speaker: christopher_robin
          text: >-
            Then fly to Piglet now. Tell him we're coming to rescue him. Pooh and I will make a plan and get there as fast as we can. Please don't explain, Owl. Just hurry!
        - id: ch01-b74
          speaker: narrator
          text: >-
            Owl flew off, still thinking of what he might have said.
        - id: ch01-b75
          speaker: christopher_robin
          text: >-
            All right, Pooh. Where is your boat?
        - id: ch01-b76
          speaker: narrator
          text: >-
            They started down toward the island's shore.
        - id: ch01-b77
          speaker: pooh
          text: >-
            I should explain that it isn't an ordinary boat. Sometimes it's a Boat, and sometimes it's more like an Accident. It depends.
        - id: ch01-b78
          speaker: christopher_robin
          text: >-
            What does it depend on?
        - id: ch01-b79
          speaker: pooh
          text: >-
            Whether I'm on top of it or underneath it.
        - id: ch01-b80
          speaker: christopher_robin
          text: >-
            Oh. Then where is it?
        - id: ch01-b81
          speaker: pooh
          text: >-
            There!
        - id: ch01-b82
          speaker: narrator
          text: >-
            Pooh proudly pointed to The Floating Bear. It was certainly not the boat Christopher Robin had pictured. He looked at the huge corked jar, and then at Pooh. The longer he looked, the more he thought what a Brave and Clever Bear Pooh was. Pooh could tell what his friend was thinking. He lowered his eyes modestly and did his best to pretend there was nothing Brave or Clever about him.
        - id: ch01-b83
          speaker: christopher_robin
          text: >-
            But your boat is too small for both of us.
          emotion: sad
        - id: ch01-b84
          speaker: pooh
          text: >-
            For all three of us, once we have Piglet.
        - id: ch01-b85
          speaker: christopher_robin
          text: >-
            Then it's even smaller. Oh, Pooh Bear, what can we do?
        - id: ch01-b86
          speaker: narrator
          text: >-
            And then Pooh Bear himself spoke. This was Winnie-the-Pooh, Friend of Piglet's, Rabbit's Companion, Pole Discoverer, Eeyore's Comforter and Tail-finder. He said something so clever that Christopher Robin could only stare, his mouth open and his eyes wide. Could this truly be the same Bear of Very Little Brain he had known and loved for so long?
        - id: ch01-b87
          speaker: pooh
          text: >-
            We could go in your umbrella.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Christopher Robin said nothing.
        - id: ch01-b89
          speaker: pooh
          text: >-
            We could go in your umbrella.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Christopher Robin still said nothing at all.
        - id: ch01-b91
          speaker: pooh
          text: >-
            We could go in your umbrella.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Suddenly Christopher Robin understood. They really could. He opened the umbrella, turned it upside down, and lowered it into the water with its point beneath them. It floated, though it rocked from side to side. Pooh climbed in first. He had just begun to say that all was well when the umbrella tipped and proved him wrong. After swallowing a little water he had never asked for, Pooh waded back to shore. Then Pooh and Christopher Robin climbed in together. With their weight balanced, the umbrella did not wobble anymore.
        - id: ch01-b93
          speaker: christopher_robin
          text: >-
            I shall name this boat The Brain of Pooh.
        - id: ch01-b94
          speaker: narrator
          text: >-
            The Brain of Pooh set sail at once toward the southwest, turning gracefully around and around.
        - id: ch01-b95
          speaker: narrator
          text: >-
            You can imagine how happy Piglet was when the ship finally came into view. Years later, he liked to remember that he had faced Very Great Danger during the Terrible Flood. In truth, his only real danger came during the last half hour.
        - id: ch01-b96
          speaker: narrator
          text: >-
            Owl had arrived and perched on a branch of Piglet's tree to comfort him. He began a very long story about an aunt who had once laid a seagull's egg by mistake. The story went on and on. Piglet listened from his window with very little hope. Quietly and naturally, he fell asleep. Slowly he slipped out toward the water until only his toes held him there.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Just then, Owl gave a sudden, tremendous squawk. It was part of his story, since that was the sound his aunt had made. The squawk woke Piglet with just enough time to jerk himself back to safety.
        - id: ch01-b98
          speaker: piglet
          text: >-
            How interesting! And what did she do then?
        - id: ch01-b99
          speaker: narrator
          text: >-
            And then—well, you can imagine Piglet's joy. Across the water came the good ship Brain of Pooh, with Christopher Robin as Captain and Pooh Bear as First Mate, sailing to his rescue. Christopher Robin and Pooh together again.... And that really is the end of the story. After that last sentence, I am very tired. I think I shall stop here.
