audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    piglet:
      display_name: Piglet
      tts:
        delivery: earnest and slightly timid
        timbre: light and squeaky
        pace: gently quick
        pitch: high
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    friend_one:
      display_name: First Friend
      tts:
        delivery: eager and curious
        timbre: light and clear
        pace: natural
        pitch: medium
    friend_two:
      display_name: Second Friend
      tts:
        delivery: eager and curious
        timbre: warm and clear
        pace: natural
        pitch: medium-high
    friend_three:
      display_name: Third Friend
      tts:
        delivery: eager and curious
        timbre: soft and clear
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: The Name Pooh
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If you've read another book about Christopher Robin, you may remember that he once had a swan. Or perhaps the swan had Christopher Robin. I'm not sure which. Anyway, Christopher Robin called the swan Pooh.
        - id: ch01-b02
          speaker: narrator
          text: That was a long time ago. When we said good-bye, we took the name with us because we didn't think the swan would need it anymore.
        - id: ch01-b03
          speaker: narrator
          text: Later, Edward Bear wanted an exciting name all his own. Christopher Robin answered right away, without even stopping to think. He said the bear was Winnie-the-Pooh, and so he was. Now that I've explained the Pooh part, I'll tell you about the rest.
    - id: ch02
      title: Winnie at the Zoo
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: You can't spend much time in London without visiting the Zoo. Some people start at the entrance called Way In. Then they hurry past every cage until they reach the exit called Way Out. But the nicest people go straight to the animal they love best, and they stay there.
        - id: ch02-b02
          speaker: narrator
          text: That's what Christopher Robin does. He goes to the Polar Bears and whispers something to the third keeper from the left. Doors are unlocked. We make our way along dark passages and climb steep stairs. At last, we reach one special cage. Its door opens, and something brown and furry trots out.
        - id: ch02-b03
          speaker: christopher_robin
          text: Oh, Bear!
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: Christopher Robin runs straight into the bear's arms. This bear is named Winnie, which proves that Winnie is a very good name for a bear. The funny part is, we can't remember whether Winnie was named after Pooh or Pooh was named after Winnie. We knew once, but now we've forgotten.
    - id: ch03
      title: What About Piglet?
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: I had written that much when Piglet looked up at me.
        - id: ch03-b02
          speaker: piglet
          text: But what about me?
        - id: ch03-b03
          speaker: narrator
          text: My dear Piglet, the whole book is about you.
        - id: ch03-b04
          speaker: piglet
          text: Then it must be about Pooh.
        - id: ch03-b05
          speaker: narrator
          text: You see how it is. Piglet is jealous because he thinks Pooh is getting one grand introduction all to himself. Pooh is the favorite, of course. There's no point pretending otherwise. Still, Piglet gets to do plenty of things that Pooh misses.
        - id: ch03-b06
          speaker: narrator
          text: You can't take Pooh to school without everyone noticing. Piglet is so small that he can slip into your pocket. It's comforting to feel him there when you aren't quite sure whether two times seven is twelve or twenty-two.
        - id: ch03-b07
          speaker: narrator
          text: Now and then, Piglet slips out and takes a good look inside the inkpot. That's how he has managed to get more education than Pooh. Pooh doesn't mind at all.
        - id: ch03-b08
          speaker: pooh
          text: Some people have brains, and some people don't. That's simply how it is.
        - id: ch03-b09
          speaker: narrator
          text: And now all the others have begun asking the same thing.
        - id: ch03-b10
          speakers: [friend_one, friend_two, friend_three]
          ensemble: chorus
          text: What about us?
        - id: ch03-b11
          speaker: narrator
          text: So perhaps I'd better stop writing introductions and get on with the book.
