audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 认真敏感，偶尔带一点不服气
        timbre: 细小明亮
        pace: 稍快
        pitch: 高
    others:
      display_name: 其他伙伴
      tts:
        delivery: 七嘴八舌，急着得到注意
        timbre: 轻快活泼的群声
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 维尼噗这个名字
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要是你读过另一本讲克里斯托弗·罗宾的书，也许还记得，他从前有一只天鹅。当然，也可能是天鹅有一个克里斯托弗·罗宾，这事我可分不清。他一直管那只天鹅叫“噗”。后来大家告别了，觉得天鹅不会再需要这个名字，就把名字带了回来。
        - id: ch01-b02
          speaker: narrator
          text: 过了很久，爱德华熊想要一个听起来很神气、只归自己用的名字。克里斯托弗·罗宾连想都没想，立刻替他拿定了主意。
        - id: ch01-b03
          speaker: christopher_robin
          text: 你就叫维尼噗。
        - id: ch01-b04
          speaker: narrator
          text: 从此，他真的成了维尼噗。“噗”是怎么来的，现在已经说清楚了。接下来，还得讲讲“维尼”这一半。
    - id: ch02
      title: 动物园里的维尼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 在伦敦住上一阵，少不了要去动物园。有些人从叫“往里走”的门进园，匆匆经过所有笼子，一直赶到叫“往外走”的门。可最可爱的人不是这样。他们会直接去找最喜欢的动物，然后留在那儿。
        - id: ch02-b02
          speaker: narrator
          text: 克里斯托弗·罗宾每次进动物园，都会直奔北极熊。他对着左边数来第三位饲养员轻声说几句，门上的锁便一一打开。我们走过黑暗的通道，爬上很陡的楼梯，最后来到一只特别的笼子前。
        - id: ch02-b03
          speaker: narrator
          text: 笼门打开，一个棕色、浑身毛茸茸的家伙小跑出来。克里斯托弗·罗宾一看见它，便高兴地叫了起来。
        - id: ch02-b04
          speaker: christopher_robin
          text: 啊，熊熊，是你呀！
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: 他一边叫，一边扑进熊的怀里。
        - id: ch02-b06
          speaker: narrator
          text: 这只熊的名字正是维尼。看来，“维尼”很适合做熊的名字。可有件事真有意思，我们已经想不起，到底是维尼跟着噗取了名，还是噗跟着维尼取了名。以前我们是知道的，只是现在忘掉了……
    - id: ch03
      title: 小猪也要一篇引言
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我写到这儿，小猪抬起头，尖着嗓子问我。
        - id: ch03-b02
          speaker: piglet
          text: 那我怎么办？
        - id: ch03-b03
          speaker: narrator
          text: 亲爱的小猪，这本书讲的全是你的故事。
        - id: ch03-b04
          speaker: piglet
          text: 可它从头到尾也都有噗的事呀。
        - id: ch03-b05
          speaker: narrator
          text: 你听出来了吧？小猪有点吃醋。他觉得噗把一篇气派极了的引言全占去了。噗当然最受宠，这没什么可否认的。不过，有不少噗赶不上的事情，小猪却能赶上。
        - id: ch03-b06
          speaker: narrator
          text: 比方说，你要带噗去上学，谁都会发现。小猪却小得很，悄悄一钻就进了口袋。等你弄不清七乘二是十二还是二十二，只要伸手摸到他，心里立刻就安稳了。
        - id: ch03-b07
          speaker: narrator
          text: 小猪偶尔还会爬出口袋，好好看看墨水瓶。就这样，他学到的东西比噗还多。噗一点也不在意。他总是这么说。
        - id: ch03-b08
          speaker: pooh
          text: 有些人有脑子，有些人没有。事情就是这样。
        - id: ch03-b09
          speaker: others
          text: 那我们呢？
        - id: ch03-b10
          speaker: narrator
          text: 现在，其他伙伴也都问起来了。看来，最好的办法大概是不再写引言，马上开始讲这本书。
        - id: ch03-b11
          speaker: narrator
          text: 这篇引言写到这里，署名是A. A. M.
