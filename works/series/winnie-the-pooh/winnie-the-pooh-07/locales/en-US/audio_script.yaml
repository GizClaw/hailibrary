          text: >-
            Not my balloon. Look, Piglet!
        - id: ch01-b177
          speaker: narrator
          text: >-
            Piglet turned sadly to watch. Eeyore picked up the piece of balloon with his teeth and lowered it very carefully into the pot. Then he lifted it back out and placed it on the ground. He picked it up once more and carefully returned it to the pot, showing them exactly how well the two presents worked together.
        - id: ch01-b178
          speaker: pooh
          text: >-
            You're right! It goes in!
          emotion: surprised
        - id: ch01-b179
