          emotion: happy
        - id: ch01-b181
          speaker: pooh
          text: >-
            I'm very glad I thought of giving you a Useful Pot for keeping things in.
          emotion: happy
        - id: ch01-b182
          speaker: piglet
          text: >-
            And I'm very glad I thought of giving you Something to keep in a Useful Pot.
          emotion: happy
        - id: ch01-b183
          speaker: narrator
          text: >-
            Eeyore wasn't listening. He kept taking the balloon out and putting it back in, as happy as he could be.
        - id: ch01-b184
