audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and warmly conversational
        timbre: clear and gentle
        pace: unhurried
        pitch: medium
    pooh:
      display_name: Winnie-the-Pooh
      tts:
        delivery: simple and good-natured
        timbre: soft and round
        pace: leisurely
        pitch: medium-low
    piglet:
      display_name: Piglet
      tts:
        delivery: eager and delicately expressive
        timbre: small and bright
        pace: lightly quick
        pitch: high
    eeyore:
      display_name: Eeyore
      tts:
        delivery: dry and mournfully deliberate
        timbre: low and slightly rough
        pace: slow
        pitch: low
    owl:
      display_name: Owl
      tts:
        delivery: dignified and confidently explanatory
        timbre: resonant and feathery
        pace: measured
        pitch: medium-low
    christopher_robin:
      display_name: Christopher Robin
      tts:
        delivery: bright and wholehearted
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: In Which Eeyore Has a Birthday and Gets Two Presents
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Eeyore, the old gray Donkey, stood beside the stream, staring at his reflection in the water.
        - id: ch01-b02
          speaker: eeyore
          text: >-
            Pathetic. That's what it is. Pathetic.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He walked slowly twenty yards down the stream, splashed across, and came slowly back along the other bank. Then he studied his reflection once more.
        - id: ch01-b04
          speaker: eeyore
          text: >-
            Just as I expected. I don't look any better from this side. But nobody minds. Nobody cares. Pathetic. That's what it is.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Something crackled in the bracken behind him, and Pooh came out.
        - id: ch01-b06
          speaker: pooh
          text: >-
            Good morning, Eeyore.
        - id: ch01-b07
          speaker: eeyore
          text: >-
            Good morning, Pooh Bear. If it really is a good morning. I have my doubts.
        - id: ch01-b08
          speaker: pooh
          text: >-
            Why? What's wrong?
        - id: ch01-b09
          speaker: eeyore
          text: >-
            Nothing, Pooh Bear. Nothing at all. We can't all do it, and some of us don't. That's all.
        - id: ch01-b10
          speaker: pooh
          text: >-
            Can't all do what?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Pooh rubbed his nose.
        - id: ch01-b12
          speaker: eeyore
          text: >-
            Be cheerful. Sing and dance. Go around the mulberry bush.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Pooh thought for a long while.
        - id: ch01-b14
          speaker: pooh
          text: >-
            Which mulberry bush do you mean?
        - id: ch01-b15
          speaker: eeyore
          text: >-
            Bonhommy. That's a French word meaning bonhommy. I'm not complaining. I'm only pointing it out.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Pooh sat on a large stone and tried to understand. It sounded like a riddle, and riddles were hard for a Bear of Very Little Brain. So instead, he sang Cottleston Pie.
        - id: ch01-b17
          speaker: pooh
          text: >-
            Cottleston, Cottleston, Cottleston Pie. A fly can't bird, but a bird can fly. Ask me a riddle and this I reply. Cottleston, Cottleston, Cottleston Pie.
        - id: ch01-b18
          speaker: narrator
          text: >-
            That was the first verse. Eeyore didn't actually say he disliked it, so Pooh kindly sang him the second one.
        - id: ch01-b19
          speaker: pooh
          text: >-
            Cottleston, Cottleston, Cottleston Pie. A fish can't whistle, and neither can I. Ask me a riddle and this I reply. Cottleston, Cottleston, Cottleston Pie.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Eeyore still said nothing. Pooh quietly hummed the third verse to himself.
        - id: ch01-b21
          speaker: pooh
          text: >-
            Cottleston, Cottleston, Cottleston Pie. Why does a chicken? I don't know why. Ask me a riddle and this I reply. Cottleston, Cottleston, Cottleston Pie.
        - id: ch01-b22
          speaker: eeyore
          text: >-
            That's right. Keep singing. Umty-tiddly, umty-too. Gather your nuts in May. Have a lovely time.
        - id: ch01-b23
          speaker: pooh
          text: >-
            I am having one.
        - id: ch01-b24
          speaker: eeyore
          text: >-
            Some people can.
        - id: ch01-b25
          speaker: pooh
          text: >-
            But what is the matter?
        - id: ch01-b26
          speaker: eeyore
          text: >-
            Is something supposed to be the matter?
        - id: ch01-b27
          speaker: pooh
          text: >-
            You seem awfully sad, Eeyore.
        - id: ch01-b28
          speaker: eeyore
          text: >-
            Sad? Why would I be sad? It's my birthday. The happiest day of the whole year.
        - id: ch01-b29
          speaker: pooh
          text: >-
            Your birthday?
          emotion: surprised
        - id: ch01-b30
          speaker: eeyore
          text: >-
            Of course. Surely you can tell. Look at all my presents.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Eeyore waved one foot from side to side.
        - id: ch01-b32
          speaker: eeyore
          text: >-
            And look at that birthday cake, with candles and pink sugar.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Pooh looked to the right. Then he looked to the left.
        - id: ch01-b34
          speaker: pooh
          text: >-
            Presents? A birthday cake? Where are they?
        - id: ch01-b35
          speaker: eeyore
          text: >-
            You can't see them?
        - id: ch01-b36
          speaker: pooh
          text: >-
            No.
        - id: ch01-b37
          speaker: eeyore
          text: >-
            Neither can I. That was a joke. Ha ha.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Pooh scratched his head. This was all rather puzzling.
        - id: ch01-b39
          speaker: pooh
          text: >-
            Is today truly your birthday?
        - id: ch01-b40
          speaker: eeyore
          text: >-
            It is.
        - id: ch01-b41
          speaker: pooh
          text: >-
            Oh! Then many happy returns of the day, Eeyore.
        - id: ch01-b42
          speaker: eeyore
          text: >-
            And many happy returns to you, Pooh Bear.
        - id: ch01-b43
          speaker: pooh
          text: >-
            But today isn't my birthday.
        - id: ch01-b44
          speaker: eeyore
          text: >-
            No. It's mine.
        - id: ch01-b45
          speaker: pooh
          text: >-
            Then why did you wish me many happy returns?
        - id: ch01-b46
          speaker: eeyore
          text: >-
            Why shouldn't I? You don't want to be miserable on my birthday too, do you?
        - id: ch01-b47
          speaker: pooh
          text: >-
            Oh. Now I understand.
        - id: ch01-b48
          speaker: eeyore
          text: >-
            It's bad enough being miserable myself. No presents. No cake. No candles. Nobody taking proper notice of me. But if everyone else plans to be miserable too...
          emotion: sad
        - id: ch01-b49
          speaker: narrator
          text: >-
            Eeyore was almost breaking down as he said it. Hearing about the missing presents, cake, and candles was too much for Pooh.
        - id: ch01-b50
          speaker: pooh
          text: >-
            Stay right there!
        - id: ch01-b51
          speaker: narrator
          text: >-
            Pooh turned and hurried home as fast as he could. He felt that poor Eeyore must have some sort of present right away. Once Eeyore had something for his birthday, Pooh could take his time and think of a proper present afterward.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Outside his house, Pooh found Piglet jumping up and down, trying to reach the knocker.
        - id: ch01-b53
          speaker: pooh
          text: >-
            Hello, Piglet.
        - id: ch01-b54
          speaker: piglet
          text: >-
            Hello, Pooh. What are you trying to do?
        - id: ch01-b55
          speaker: pooh
          text: >-
            I was about to ask you that.
        - id: ch01-b56
          speaker: piglet
          text: >-
            I'm trying to reach the knocker. I came over to...
        - id: ch01-b57
          speaker: pooh
          text: >-
            I'll knock for you.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Pooh reached up and knocked. Then he began telling Piglet about Eeyore.
        - id: ch01-b59
          speaker: pooh
          text: >-
            I just saw him, and he's in a Very Sad Condition. It's his birthday, but no one has noticed. He's terribly gloomy. You know how Eeyore is. He was standing there, and... Whoever lives here is taking a long time to answer.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Pooh knocked once more.
        - id: ch01-b61
          speaker: piglet
          text: >-
            Pooh, this is your house.
        - id: ch01-b62
          speaker: pooh
          text: >-
            Oh! So it is. Well, let's go inside.
        - id: ch01-b63
          speaker: narrator
          text: >-
            They went in. Pooh immediately checked the cupboard for a very small jar of honey. There was one, so he took it down.
        - id: ch01-b64
          speaker: pooh
          text: >-
            This will be my present for Eeyore. What will you give him?
        - id: ch01-b65
          speaker: piglet
          text: >-
            Could the honey be from both of us?
        - id: ch01-b66
          speaker: pooh
          text: >-
            No. That wouldn't be a good plan.
        - id: ch01-b67
          speaker: piglet
          text: >-
            All right. Then I'll give him a balloon. I have one left from my party. Shall I go get it now?
        - id: ch01-b68
          speaker: pooh
          text: >-
            That's a Very Good Idea, Piglet. A balloon is exactly what Eeyore needs. No one can stay uncheered when there's a balloon.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Piglet trotted off one way. Pooh went the other way, carrying his jar of honey.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The day was warm, and Pooh had a long walk ahead. He hadn't even gone halfway when a funny feeling began at the very tip of his nose. It crept all over him, trickled right through him, and ran out through the bottoms of his feet. It felt exactly as though someone inside him were reminding him that now was the time for a little something to eat.
        - id: ch01-b71
          speaker: pooh
          text: >-
            Dear, dear. I didn't realize it was so late.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Pooh sat down and opened the honey jar.
        - id: ch01-b73
          speaker: pooh
          text: >-
            It's lucky I brought this. Many bears would go walking on a warm day without thinking to bring a little something.
        - id: ch01-b74
          speaker: narrator
          text: >-
            He began to eat the honey. When only the last lick remained inside the jar, he took it too. Then, with the empty pot in his paws, he tried to remember where he had been going before the little something interrupted him.
        - id: ch01-b75
          speaker: pooh
          text: >-
            Let me see. Where was I going? Ah, yes. Eeyore.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Pooh slowly got up. Then it came back to him all at once. He had eaten Eeyore's birthday present.
        - id: ch01-b77
          speaker: pooh
          text: >-
            Bother! What am I going to do? I have to give him something.
        - id: ch01-b78
          speaker: narrator
          text: >-
            For a little while, Pooh couldn't think of anything at all. Then he looked at the pot and began to see how an empty honey jar might still become a birthday present.
        - id: ch01-b79
          speaker: pooh
          text: >-
            It's still a very nice pot, even without the honey. If I wash it, and someone writes A Happy Birthday on it, Eeyore can keep things inside. That could be Useful.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Pooh happened to be passing the Hundred Acre Wood, so he went in to visit Owl, who lived there.
        - id: ch01-b81
          speaker: pooh
          text: >-
            Good morning, Owl.
        - id: ch01-b82
          speaker: owl
          text: >-
            Good morning, Pooh.
        - id: ch01-b83
          speaker: pooh
          text: >-
            Many happy returns of Eeyore's birthday.
        - id: ch01-b84
          speaker: owl
          text: >-
            Oh, so that's what today is.
        - id: ch01-b85
          speaker: pooh
          text: >-
            What present are you giving him, Owl?
        - id: ch01-b86
          speaker: owl
          text: >-
            What are you giving him, Pooh?
        - id: ch01-b87
          speaker: pooh
          text: >-
            A Useful Pot for Keeping Things In. And I wanted to ask you...
        - id: ch01-b88
          speaker: owl
          text: >-
            Is this the pot?
        - id: ch01-b89
          speaker: narrator
          text: >-
            Owl took it from Pooh's paw.
        - id: ch01-b90
          speaker: pooh
          text: >-
            Yes, and I was going to ask...
        - id: ch01-b91
          speaker: owl
          text: >-
            Someone has been keeping honey in here.
        - id: ch01-b92
          speaker: pooh
          text: >-
            You can keep anything in it. That's what makes it Very Useful. Now, what I wanted to ask...
        - id: ch01-b93
          speaker: owl
          text: >-
            You should put A Happy Birthday on it.
        - id: ch01-b94
          speaker: pooh
          text: >-
            That's exactly what I wanted! My spelling is Wobbly. It's good spelling, but it Wobbles, and all the letters end up in the wrong places. Would you write A Happy Birthday for me?
        - id: ch01-b95
          speaker: owl
          text: >-
            This is a nice pot. Could it be a present from both of us?
        - id: ch01-b96
          speaker: pooh
          text: >-
            No. That wouldn't be a good plan. I'll wash it, and then you can do the writing.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Pooh washed every bit of honey from the pot and dried it carefully. While he worked, Owl licked the end of his pencil and privately wondered how the word birthday ought to be spelled.
        - id: ch01-b98
          speaker: owl
          text: >-
            Can you read, Pooh?
        - id: ch01-b99
          speaker: narrator
          text: >-
            Owl sounded a little anxious.
        - id: ch01-b100
          speaker: owl
          text: >-
            Christopher Robin wrote a notice outside my door about knocking and ringing. Can you read that?
        - id: ch01-b101
          speaker: pooh
          text: >-
            Christopher Robin told me what it said first. After that, I could read it.
        - id: ch01-b102
          speaker: owl
          text: >-
            Then I'll tell you what my writing says, and after that you'll be able to read it.
        - id: ch01-b103
          speaker: narrator
          text: >-
            Owl wrote a long row of letters on the pot. They said, “HIPY PAPY BTHUTHDTH THUTHDA BTHUTHDY.” Pooh watched with admiration.
        - id: ch01-b104
          speaker: owl
          text: >-
            I'm writing A Happy Birthday.
        - id: ch01-b105
          speaker: pooh
          text: >-
            It certainly is a nice long one.
        - id: ch01-b106
          speaker: owl
          text: >-
            Well, to be precise, it says A Very Happy Birthday with love from Pooh. Naturally, a long message takes quite a lot of pencil.
        - id: ch01-b107
          speaker: pooh
          text: >-
            Oh, I see.
        - id: ch01-b108
          speaker: narrator
          text: >-
            While Pooh and Owl were busy, Piglet had gone home for Eeyore's balloon. He pressed it tightly against himself so the wind couldn't carry it away, then ran as fast as he could. He wanted to reach Eeyore before Pooh did. That way, he could be the first to give Eeyore a present, just as though nobody else had needed to tell him about the birthday. Piglet kept thinking of how pleased Eeyore would be when he saw the balloon. With all those thoughts in his head, he forgot to watch the path. Suddenly, one foot dropped into a rabbit hole, and Piglet fell flat on his face.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Bang!
        - id: ch01-b110
          speaker: narrator
          text: >-
            Piglet lay there, trying to understand what had happened. At first, he thought the whole world had blown up. Then he wondered if only the Forest part of the world had gone. After that, he thought perhaps only Piglet himself had blown up. Maybe he was all alone on the moon, or somewhere just as far away, and would never see Christopher Robin, Pooh, or Eeyore again.
        - id: ch01-b111
          speaker: piglet
          text: >-
            Even if I am on the moon, I don't have to stay facedown forever.
        - id: ch01-b112
          speaker: narrator
          text: >-
            He carefully stood and looked around. He was still in the Forest.
        - id: ch01-b113
          speaker: piglet
          text: >-
            Well, that's strange. What could have made that enormous bang? I couldn't possibly make a noise like that just by falling over. But where has my balloon gone? And why is that little piece of damp cloth lying there?
        - id: ch01-b114
          speaker: narrator
          text: >-
            It was the balloon.
        - id: ch01-b115
          speaker: piglet
          text: >-
            Oh, dear! Oh, dear, oh, dearie, dearie, dear! It's too late to turn back now, and I haven't got another balloon at home. Perhaps Eeyore doesn't really like balloons quite as much as everyone thinks he does.
          emotion: sad
        - id: ch01-b116
          speaker: narrator
          text: >-
            Piglet went on, much more sadly now. When he reached the stream, he called to Eeyore.
        - id: ch01-b117
          speaker: piglet
          text: >-
            Good morning, Eeyore!
        - id: ch01-b118
          speaker: eeyore
          text: >-
            Good morning, Little Piglet. If it really is a good morning, which I doubt. Not that it matters.
        - id: ch01-b119
          speaker: piglet
          text: >-
            Many happy returns of the day!
        - id: ch01-b120
          speaker: narrator
          text: >-
            Eeyore stopped staring into the stream and turned toward Piglet.
        - id: ch01-b121
          speaker: eeyore
          text: >-
            Say that once more.
        - id: ch01-b122
          speaker: piglet
          text: >-
            Many happy...
        - id: ch01-b123
          speaker: eeyore
          text: >-
            Wait.
        - id: ch01-b124
          speaker: narrator
          text: >-
            Eeyore balanced on three legs and carefully lifted the fourth toward his ear.
        - id: ch01-b125
          speaker: eeyore
          text: >-
            I did this yesterday. It's quite simple. It helps me hear better.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Eeyore fell down for the third time while trying. He got back onto his feet, managed to hold his hoof against his ear, and pushed the ear forward so it would be ready to listen.
        - id: ch01-b127
          speaker: eeyore
          text: >-
            There. I've done it. What did you say?
        - id: ch01-b128
          speaker: piglet
          text: >-
            Many happy returns of the day.
        - id: ch01-b129
          speaker: eeyore
          text: >-
            You mean me?
        - id: ch01-b130
          speaker: piglet
          text: >-
            Of course I do, Eeyore.
        - id: ch01-b131
          speaker: eeyore
          text: >-
            My birthday?
        - id: ch01-b132
          speaker: piglet
          text: >-
            Yes.
        - id: ch01-b133
          speaker: eeyore
          text: >-
            I'm having an actual birthday?
        - id: ch01-b134
          speaker: piglet
          text: >-
            Yes, Eeyore, and I brought you a present.
        - id: ch01-b135
          speaker: narrator
          text: >-
            Eeyore carefully lowered the right hoof from his right ear. Then he turned all the way around and, with a great deal of difficulty, began lifting his left hoof to his left ear.
        - id: ch01-b136
          speaker: eeyore
          text: >-
            I need to hear that with this ear. Go ahead.
        - id: ch01-b137
          speaker: piglet
          text: >-
            A present!
        - id: ch01-b138
          speaker: eeyore
          text: >-
            For me again?
        - id: ch01-b139
          speaker: piglet
          text: >-
            Yes.
        - id: ch01-b140
          speaker: eeyore
          text: >-
            And it's still my birthday?
        - id: ch01-b141
          speaker: piglet
          text: >-
            Of course it is.
        - id: ch01-b142
          speaker: eeyore
          text: >-
            So I'm continuing to have a real birthday?
        - id: ch01-b143
          speaker: piglet
          text: >-
            Yes, Eeyore. I brought you a balloon.
        - id: ch01-b144
          speaker: eeyore
          text: >-
            A balloon? You did say balloon? One of those big colored things that you blow up? Cheerfulness and dancing and everyone rushing about?
          emotion: surprised
        - id: ch01-b145
          speaker: piglet
          text: >-
            Yes, but I'm afraid... I'm terribly sorry, Eeyore. I fell down while I was running to bring it to you.
        - id: ch01-b146
          speaker: eeyore
          text: >-
            Dear, dear. How unfortunate. You probably ran too fast. You didn't hurt yourself, did you, Little Piglet?
        - id: ch01-b147
          speaker: piglet
          text: >-
            No, but I... I... Oh, Eeyore, I burst the balloon!
          emotion: sad
        - id: ch01-b148
          speaker: narrator
          text: >-
            A very long silence followed.
        - id: ch01-b149
          speaker: eeyore
          text: >-
            My balloon?
        - id: ch01-b150
          speaker: narrator
          text: >-
            Piglet nodded.
        - id: ch01-b151
          speaker: eeyore
          text: >-
            My birthday balloon?
        - id: ch01-b152
          speaker: piglet
          text: >-
            Yes, Eeyore. Here it is, with many happy returns of the day.
          emotion: sad
        - id: ch01-b153
          speaker: narrator
          text: >-
            Piglet sniffled a little as he held out the present. All he could give Eeyore now was that small piece of damp red cloth that had once been the balloon.
        - id: ch01-b154
          speaker: eeyore
          text: >-
            Is this really it?
          emotion: surprised
        - id: ch01-b155
          speaker: narrator
          text: >-
            Piglet nodded.
        - id: ch01-b156
          speaker: eeyore
          text: >-
            This is my present?
        - id: ch01-b157
          speaker: narrator
          text: >-
            Piglet nodded again.
        - id: ch01-b158
          speaker: eeyore
          text: >-
            The balloon?
        - id: ch01-b159
          speaker: piglet
          text: >-
            Yes.
        - id: ch01-b160
          speaker: eeyore
          text: >-
            Thank you, Piglet. If you don't mind me asking, what color was it when it was still a balloon?
        - id: ch01-b161
          speaker: piglet
          text: >-
            Red.
        - id: ch01-b162
          speaker: eeyore
          text: >-
            I was only wondering. Red. My favorite color. And how big was it?
        - id: ch01-b163
          speaker: piglet
          text: >-
            About as big as I am.
        - id: ch01-b164
          speaker: eeyore
          text: >-
            Just wondering. About the size of Piglet. My favorite size. Well, well.
          emotion: sad
        - id: ch01-b165
          speaker: narrator
          text: >-
            Piglet felt thoroughly miserable and had no idea what to say. He kept opening his mouth to begin a sentence. Each time, he decided that particular sentence wouldn't help and closed it again. Then he heard someone shouting from the far side of the river. Pooh was coming toward them.
        - id: ch01-b166
