          text: >-
            Why, I believe my Balloon will fit inside that Pot!
          emotion: surprised
        - id: ch01-b175
          speaker: pooh
          text: >-
            Oh, no, Eeyore. Balloons are far too big for pots. You hold a balloon by the...
