audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和亲切，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 从容而富有变化
        pitch: 中等
    christopher_robin:
      display_name: 克里斯托弗·罗宾
      tts:
        delivery: 天真自然，想到什么便说什么
        timbre: 清澈稚嫩
        pace: 轻快
        pitch: 中高
    pooh:
      display_name: 维尼噗
      tts:
        delivery: 慢吞吞又坦然，认真说出自己的简单道理
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低
    piglet:
      display_name: 小猪
      tts:
        delivery: 小心谨慎，紧张时语速加快，鼓起勇气时格外认真
        timbre: 轻柔稚嫩
        pace: 轻快而富有变化
        pitch: 高
    eeyore:
      display_name: 屹耳
      tts:
        delivery: 阴沉缓慢，抱怨时仍一本正经
        timbre: 低沉沙哑
        pace: 缓慢
        pitch: 低
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 郑重自信，喜欢卖弄学问
        timbre: 浑厚清晰
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 屹耳的生日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老灰驴屹耳站在溪边，看着水里的自己。他转过身，沿着溪水慢吞吞走了二十码，又哗啦哗啦蹚到对岸。接着，他从那边慢吞吞走回来，再往水里照了照。
        - id: ch01-b02
          speaker: eeyore
          text: 可悲。就是这么回事。跟我原先想的一样，从这一边看，也没好到哪儿去。可谁也不介意，谁也不在乎。可悲，就是这么回事。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 就在这时，屹耳身后的蕨丛里传来一阵窸窣声，枝叶分开，噗从里面钻了出来。
        - id: ch01-b04
          speaker: pooh
          text: 早上好，屹耳。
        - id: ch01-b05
          speaker: eeyore
          text: 早上好，噗熊。假如这也算好早晨的话。可我很怀疑。
        - id: ch01-b06
          speaker: pooh
          text: 怎么啦？
        - id: ch01-b07
          speaker: eeyore
          text: 没什么，噗熊，没什么。我们不可能个个都欢天喜地，个个都唱歌跳舞，围着桑树转圈圈。有些人就是不能。事情就是这么简单。
        - id: ch01-b08
          speaker: narrator
          text: 噗揉着鼻子，问他说的是哪棵桑树。屹耳只阴沉沉地往下讲，说那叫亲亲热热，是个法国词，意思就是亲亲热热。他并没有抱怨，不过事情就是这样。噗在大石头上坐下来，努力想懂这番话。听着听着，他觉得这很像一道谜语。可一只脑筋很小的熊从来不大擅长猜谜，于是他不猜了，改唱起《科特斯顿馅饼》。
        - id: ch01-b09
          speaker: pooh
          text: 科特斯顿，科特斯顿，科特斯顿馅饼。苍蝇不会鸟，鸟儿会飞行。你若出谜叫我猜，我就这样应。科特斯顿，科特斯顿，科特斯顿馅饼。
        - id: ch01-b10
          speaker: narrator
          text: 第一节唱完了。屹耳并没有真的开口说自己不喜欢，于是噗非常好心，决定接着唱第二节给他听。
        - id: ch01-b11
          speaker: pooh
          text: 科特斯顿，科特斯顿，科特斯顿馅饼。鱼儿不会吹口哨，我也吹不成。你若出谜叫我猜，我就这样应。科特斯顿，科特斯顿，科特斯顿馅饼。
        - id: ch01-b12
          speaker: narrator
          text: 第二节也唱完了，屹耳还是一句话也没说。于是，噗只好轻轻哼起第三节，把它唱给自己听。
        - id: ch01-b13
          speaker: pooh
          text: 科特斯顿，科特斯顿，科特斯顿馅饼。小鸡为何，我不知道为何。你若出谜叫我猜，我就这样应。科特斯顿，科特斯顿，科特斯顿馅饼。
        - id: ch01-b14
          speaker: eeyore
          text: 对，就该这样。唱吧。哼哩嘀嗒，哼哩嘟，大家去采五月果。你好好快活吧。
        - id: ch01-b15
          speaker: pooh
          text: 我正快活着呢。可是屹耳，到底出了什么事？你看起来很伤心呀。
        - id: ch01-b16
          speaker: eeyore
          text: 伤心？我为什么要伤心？今天是我的生日，是一年里最高兴的一天。我有什么好伤心的？
        - id: ch01-b17
          speaker: pooh
          text: 你的生日？
          emotion: surprised
        - id: ch01-b18
          speaker: eeyore
          text: 当然。难道你看不出来？看看我收到的这些礼物。再看看生日蛋糕，上面有蜡烛，还有粉红糖霜。
        - id: ch01-b19
          speaker: narrator
          text: 屹耳把一只脚从左边挥到右边，像是在展示那些东西。噗先转头看右边，再转头看左边，可是什么也没找到。
        - id: ch01-b20
          speaker: pooh
          text: 礼物？生日蛋糕？它们到底在哪儿？
        - id: ch01-b21
          speaker: eeyore
          text: 你看不见吗？那就对了，我也看不见。这是个笑话。哈，哈！
        - id: ch01-b22
          speaker: narrator
          text: 噗有点弄不懂，便挠了挠头。他又认真问了一次，今天到底是不是真是屹耳的生日。屹耳说，当然是真的。噗这才放下心来，祝他年年都有快乐的今天。
        - id: ch01-b23
          speaker: eeyore
          text: 也祝你年年都有快乐的今天，噗熊。
        - id: ch01-b24
          speaker: pooh
          text: 可今天不是我的生日呀。
        - id: ch01-b25
          speaker: eeyore
          text: 不是你的，是我的。可那又有什么关系？难道在我的生日，你也非得整天不快活吗？没有礼物，没有蛋糕，也没有蜡烛。根本没人正经注意到我。光是我自己不快活，就已经够糟了。可要是大家也全都跟着不快活……
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: 屹耳说得几乎要撑不住了，噗再也听不下去。他大声叫屹耳留在原地，自己转过身，尽快往家跑。无论是什么东西，他都得马上找一样礼物送给可怜的屹耳。至于真正合适的礼物，可以以后再慢慢想。
    - id: ch02
      title: 蜂蜜罐变成礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 噗回到自家门外，看见小猪一蹦一跳，正想够到门环。小猪说自己刚好过来，噗便好心地伸手替他敲门。等候的时候，噗讲起了屹耳的悲惨处境。今天是屹耳的生日，可谁也没注意，他只好一个人阴沉沉地待在那里。可是说着说着，噗纳闷起来，住在这里的人怎么迟迟不开门。他又敲了一次。
        - id: ch02-b02
          speaker: piglet
          text: 可是噗，这是你自己的家呀！
        - id: ch02-b03
          speaker: pooh
          text: 噢，还真是。那我们进去吧。
        - id: ch02-b04
          speaker: narrator
          text: 两人进了屋。噗做的头一件事，就是打开食橱，看看里面还有没有一小罐蜂蜜。果然还剩一罐，他把它取下来，说要把它当作礼物送给屹耳。
        - id: ch02-b05
          speaker: piglet
          text: 我不能也把这罐蜂蜜送给他吗？就说这是我们俩一起送的礼物？
        - id: ch02-b06
          speaker: pooh
          text: 不能，这可不是个好主意。小猪，你自己打算送他什么？
        - id: ch02-b07
          speaker: piglet
          text: 那我送他一只气球吧。上次聚会还剩下一只，我现在就去拿。
        - id: ch02-b08
          speaker: pooh
          text: 小猪，这个主意非常好。气球正是屹耳需要的东西，它一定能让他打起精神。谁只要有了气球，就不可能还打不起精神。
        - id: ch02-b09
          speaker: narrator
          text: 小猪小跑着往一个方向去了，噗抱着蜂蜜罐往另一个方向走。天气很暖和，要走的路又很远。还没走到一半，一种古怪又熟悉的感觉就爬上噗的全身。它从鼻尖开始，淌过整个身子，再从脚底溜出去，好像他身体里有人提醒他说，噗，现在该吃一点儿什么了。
        - id: ch02-b10
          speaker: pooh
          text: 哎呀，我还不知道已经这么晚了。幸亏我随身带了一点儿什么。许多熊在这样的暖天出门，根本不会想到要带吃的呢。
        - id: ch02-b11
          speaker: narrator
          text: 噗坐下来，揭开罐盖，吃起了蜂蜜。等他把罐子里面最后一点也舔干净，才开始回想，自己原本要到哪里去。啊，对了，他要去找屹耳。噗慢慢站起身。就在这一刻，他猛然记起来，刚才让自己吃光的，正是屹耳的生日礼物。
        - id: ch02-b12
          speaker: pooh
          text: 真麻烦！我现在该怎么办？我非得送屹耳一样东西不可。
        - id: ch02-b13
          speaker: narrator
          text: 噗想了好一会儿，终于觉得，罐子虽然空了，却还是一只很漂亮的罐子。只要把它洗干净，再请谁写上生日快乐，屹耳就能拿它装东西。那说不定很有用。噗这时正好经过百亩林，于是走进去拜访住在那里的猫头鹰。
        - id: ch02-b14
          speaker: pooh
          text: 早上好，猫头鹰。祝屹耳的生日年年快乐。你准备送他什么？
        - id: ch02-b15
          speaker: owl
          text: 原来今天是他的生日？那么，你准备送什么？
        - id: ch02-b16
          speaker: pooh
          text: 我要送他一只装东西用的实用罐。我正想请你帮我一件事。
        - id: ch02-b17
          speaker: narrator
          text: 猫头鹰没等他说完，就从他爪子里接过罐子。他转着罐子看了一圈，发现有人用它装过蜂蜜。噗认真说明，它不只可以装蜂蜜，而是什么都能装。这正是它非常实用的地方。可噗刚要再说自己的请求，猫头鹰又抢先开了口。
        - id: ch02-b18
          speaker: owl
          text: 既然这是生日礼物，你应该在罐子上写一句生日快乐。
        - id: ch02-b19
          speaker: pooh
          text: 我就是想请你写这个。我的拼字总会摇晃。那些字本来拼得很好，可一晃起来，字母就跑错了地方。你能替我写一句生日快乐吗？
        - id: ch02-b20
          speaker: owl
          text: 这只罐子真不错。我不能也送这只罐子吗？就算是我们俩一起送的？
        - id: ch02-b21
          speaker: pooh
          text: 不能，这可不是个好主意。现在我先把罐子洗干净，然后你就能在上面写字了。
        - id: ch02-b22
          speaker: narrator
          text: 噗把罐子里里外外洗干净，又仔细擦干。猫头鹰在旁边舔着铅笔尖，努力回想生日这个词到底该怎么拼。他越想越不放心，便问噗会不会认字，还提起门外那张讲敲门和拉铃的告示。那是克里斯托弗·罗宾写的。
        - id: ch02-b23
          speaker: pooh
          text: 克里斯托弗·罗宾先告诉我那张告示写的是什么，然后我就会读了。
        - id: ch02-b24
          speaker: owl
          text: 那我也可以先告诉你。等我写完以后，你就会读了。罐子上写的是，绳日怏乐，绳日块乐，绳曰快乐。
        - id: ch02-b25
          speaker: narrator
          text: 猫头鹰真的写了起来。噗站在一旁，看着那一长串歪歪扭扭的字，佩服得不得了。他说，生日快乐几个字原来能写得这么长。
        - id: ch02-b26
          speaker: owl
          text: 其实，我当然不只写了生日快乐。我写的是，祝你生日非常快乐，爱你的噗。要写这么长的一句话，自然得费掉不少铅笔。
    - id: ch03
      title: 爆掉的气球
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时候，小猪已经回家拿到了屹耳的气球。他把气球紧紧抱在怀里，免得它飞走，又使出全身力气赶路。他想抢在噗前面，把礼物第一个送给屹耳。这样一来，看上去就像这个主意全是自己想出来的，根本没受过谁的提醒。小猪只顾想着屹耳会多么高兴，完全没看脚下。突然，他一脚踩进兔子洞，脸朝下摔在地上。只听一声巨响，气球爆了。
        - id: ch03-b02
          speaker: narrator
          text: 小猪趴在那里，怎么也猜不出发生了什么。起先，他以为整个世界都炸掉了。过了一会儿，他又觉得，也许炸掉的只是森林。再后来，他怀疑其实只有自己炸了，如今正孤零零待在月亮上，再也见不到克里斯托弗·罗宾、噗和屹耳。可就算到了月亮，也不用一直脸朝下趴着。于是他小心站起来，朝周围一看。自己还在森林里，那只气球却不见了，地上只剩一片湿漉漉的破布。那就是气球。
        - id: ch03-b03
          speaker: piglet
          text: 哎呀！哎呀，哎呀呀，哎呀呀呀！现在回去已经太迟了，我也没有另一只气球。再说，也许屹耳本来就没有那么喜欢气球。
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: 小猪继续往前跑，只是现在跑得相当难过。他一路来到屹耳所在的溪边，看见屹耳仍在望着水里的自己，便远远向他问好。
        - id: ch03-b05
          speaker: eeyore
          text: 早上好，小小猪。假如这也算得上好早晨的话。可我很怀疑。不过，也没有谁会在乎这件事。
        - id: ch03-b06
          speaker: piglet
          text: 屹耳，祝你年年都有快乐的今天。
        - id: ch03-b07
          speaker: narrator
          text: 屹耳不再看水里的自己，转过身盯着小猪，叫他把刚才的话再说一遍。可是小猪刚开口，屹耳又让他等一等。他用三条腿站着，小心地把第四只蹄子举向耳朵。他说自己昨天练过，这很容易。等到第三次摔倒以后，他终于把耳朵朝前推好了。
        - id: ch03-b08
          speaker: eeyore
          text: 好了，这下成功了，我现在能听清了。来吧，你刚才对我说什么？
        - id: ch03-b09
          speaker: piglet
          text: 祝你年年都有快乐的今天。
        - id: ch03-b10
          speaker: eeyore
          text: 这句话是说我吗？今天是我的生日吗？我真的在过一个生日？
        - id: ch03-b11
          speaker: piglet
          text: 当然是说你，屹耳。今天真是你的生日，而且我还给你带来了一件礼物。
        - id: ch03-b12
          speaker: narrator
          text: 屹耳把右蹄从右耳边放下来，转过身，又费了好大的劲举起左蹄。他说，这个消息也得让另一只耳朵听见，然后才请小猪继续讲。
        - id: ch03-b13
          speaker: piglet
          text: 对，还是你的生日，你还在过一个真正的生日。我给你带来的礼物是一只气球。
        - id: ch03-b14
          speaker: eeyore
          text: 气球？你刚才真的说了气球？就是那种吹起来又大又鲜艳，叫人欢天喜地、唱歌跳舞，一会儿这里、一会儿那里的东西？
          emotion: surprised
        - id: ch03-b15
          speaker: piglet
          text: 对，就是那种东西。可我拿着它跑来送给你的时候，不小心摔了一跤。屹耳，真对不起，我把气球弄爆了。
          emotion: sad
        - id: ch03-b16
          speaker: narrator
          text: 小猪说完以后，四周沉默了很久很久。屹耳终于开口，先问爆掉的是不是他的气球，又问那是不是他自己的生日气球。小猪说不出话，只能一次次点头。他轻轻抽着鼻子，把那片湿漉漉的破布递给屹耳，又磕磕绊绊地祝他年年都有快乐的今天。
        - id: ch03-b17
          speaker: eeyore
          text: 就是这一片东西吗？这就是我的礼物，就是那只气球？谢谢你，小猪。希望你不介意我问一声，它还没爆掉、还真是一只气球的时候，是什么颜色？
        - id: ch03-b18
          speaker: piglet
          text: 那只气球原来是红色的。
        - id: ch03-b19
          speaker: eeyore
          text: 我只是随便问问。原来是红色，那正是我最喜欢的颜色。它原来有多大？
        - id: ch03-b20
          speaker: piglet
          text: 差不多跟我一样大。
        - id: ch03-b21
          speaker: eeyore
          text: 我只是随便问问。差不多跟小猪一样大，那正是我最喜欢的大小。好吧，好吧，也只能这样了。
          emotion: sad
        - id: ch03-b22
          speaker: narrator
          text: 屹耳低声对自己说，红色是他最喜欢的颜色，小猪那么大正是他最喜欢的大小。小猪听得难受极了，完全不知道还能说什么。他一次次张开嘴，想讲点什么，又一次次觉得那些话说出来也没有用。就在他还在犹豫的时候，河对岸忽然传来了噗的喊声。小猪转头一看，噗已经到了。
    - id: ch04
      title: 两件合在一起的礼物
      blocks:
        - id: ch04-b01
          speaker: pooh
          text: 屹耳，祝你年年都有快乐的今天！我给你带来了一件小小的生日礼物。
        - id: ch04-b02
          speaker: eeyore
          text: 谢谢你，噗，我正在年年快乐呢。至于礼物，我已经收到过了。
        - id: ch04-b03
          speaker: narrator
          text: 噗兴奋地说，自己也带来了一件小礼物。他哗啦哗啦蹚过溪水，走到屹耳身边。小猪坐在不远处，两手托着脑袋，还在独自抽鼻子。
        - id: ch04-b04
          speaker: pooh
          text: 这是一只装东西用的实用罐。上面写着，祝你生日非常快乐，爱你的噗。那些字就是这个意思。它可以拿来装东西。瞧！
        - id: ch04-b05
          speaker: narrator
          text: 屹耳一看见这只空罐子，立刻来了精神，而且越看越激动。他忽然发现，两件礼物好像正好能合在一起。
        - id: ch04-b06
          speaker: eeyore
          text: 哎呀！我看，我的气球刚刚好可以放进这只罐子里。
          emotion: happy
        - id: ch04-b07
          speaker: pooh
          text: 不会的，屹耳。气球太大了，绝对放不进罐子。拿到一只气球以后，你应该把它握在手里，然后……
        - id: ch04-b08
          speaker: eeyore
          text: 别人的气球也许太大，我的可不一样。看着吧，小猪！
        - id: ch04-b09
          speaker: narrator
          text: 小猪忧伤地转过头去看。屹耳用牙叼起那只爆掉的气球，小心翼翼地放进罐子。然后，他又把气球叼出来，放在地上。接着，他再一次把它叼起，小心翼翼地放回罐子。
        - id: ch04-b10
          speaker: pooh
          text: 真的可以！它放进去了！
          emotion: surprised
        - id: ch04-b11
          speaker: piglet
          text: 真的可以！而且还能拿出来！
          emotion: happy
        - id: ch04-b12
          speaker: eeyore
          text: 可不是吗？它能放进去，也能拿出来。进进出出，简直再容易不过了。
          emotion: happy
        - id: ch04-b13
          speaker: pooh
          text: 屹耳，我真高兴。幸亏我想到了送你一只实用罐，让你可以把东西装进去。
          emotion: happy
        - id: ch04-b14
          speaker: piglet
          text: 我也真高兴。幸亏我想到了送你一样东西，让你可以把它放进这只实用罐。
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 可屹耳根本没在听他们说话。他的心思全在两件生日礼物上。屹耳把气球从罐子里拿出来，放到外面，再叼起来放回罐里。他就这样一遍又一遍地玩着，高兴得不能再高兴了。
        - id: ch04-b16
          speaker: christopher_robin
          text: 可是，那我什么礼物也没送给屹耳吗？
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: 故事讲完后，克里斯托弗·罗宾难过地问起自己的礼物。我告诉他，他当然也送了。我提醒他说，那是一件小小的东西，只是一时怎么也想不起名字。他没有等我想完，马上替我说了出来。
        - id: ch04-b18
          speaker: christopher_robin
          text: 我想起来了。我送了他一盒画东西用的颜料。可我为什么没有在早晨送给他呢？
        - id: ch04-b19
          speaker: narrator
          text: 我告诉他，那天早晨他忙着替屹耳准备生日聚会，所以没能在早晨送出颜料。后来，屹耳还有一只淋着糖霜的生日蛋糕。蛋糕上插着三根蜡烛，还用粉红糖霜写着屹耳的名字。听到这里，克里斯托弗·罗宾终于想起来了。
        - id: ch04-b20
          speaker: christopher_robin
          text: 对，我想起来了。蛋糕、蜡烛和粉红糖霜，这些事情我全都记得清清楚楚了。
