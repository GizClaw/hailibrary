    description: "A ten-year-old girl who notices small details, dislikes being treated as a little child, and acts quickly when she has chosen a purpose."
  - id: grandma
    description: "Lin's practical grandmother, a careful sewer with dry humor who keeps useful things longer than their stories stay easy to tell."
  - id: aunt_mei
    description: "Lin's tired but cheerful aunt, home from the hospital with her newborn daughter."
  - id: baby
    description: "Lin's newborn cousin, whose arrival changes the household before she can say a word."
