audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静细致
        timbre: 温暖清晰
        pace: 从容
        pitch: 中
    lin:
      display_name: 林澄
      tts:
        delivery: 敏锐克制
        timbre: 清亮女孩声线
        pace: 自然偏快
        pitch: 中高
    grandma:
      display_name: 外婆
      tts:
        delivery: 务实幽默
        timbre: 柔和年长女声
        pace: 不疾不徐
        pitch: 中低
    mom:
      display_name: 妈妈
      tts:
        delivery: 忙碌亲切
        timbre: 明亮成年女声
        pace: 自然
        pitch: 中
    aunt_mei:
      display_name: 小姨
      tts:
        delivery: 疲惫温柔
        timbre: 轻柔成年女声
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 会响的铁盒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |+
            林澄在外婆家听见的第一场雨，不在窗外，在床底下。

            她把手伸进那片凉凉的黑里，指尖碰到一个圆东西。往外一拖，里面立刻哗啦一响，像有一把硬糖滚过铁皮。那声音把她吓得缩回手，也把正在阳台收衣服的外婆叫了进来。

        - id: ch01-b02
          speaker: grandma
          text: 你找什么呢？
        - id: ch01-b03
          speaker: narrator
          text: |+
            外婆抱着一摞半干的床单，眼镜上沾了几点雨。

        - id: ch01-b04
          speaker: lin
          text: 我的充电线。
        - id: ch01-b05
          speaker: narrator
          text: 林澄趴在地板上说，
        - id: ch01-b06
          speaker: lin
          text: |+
            它昨天掉下去了。这个不是我弄进去的。

        - id: ch01-b07
          speaker: grandma
          text: 这个比你早来好多年。
        - id: ch01-b08
          speaker: narrator
          text: |+
            

            外婆放下床单，和她一起把铁盒拖出来。盒盖原先大概是蓝绿色的，现在褪得像阴天的河，上面印着一圈模糊的小白花，边沿还有一块棕红的锈。外婆用围裙擦了擦灰，却没有马上开。

            林澄已经十岁了。近来大人总说她要当姐姐了，好像表妹一出生，她就会突然明白怎样抱孩子、怎样让孩子别哭。她对那句你大了有一点喜欢，也有一点厌烦。眼前这只不肯开口的盒子，倒比那些话有意思。

        - id: ch01-b09
          speaker: lin
          text: 里面是什么？
        - id: ch01-b10
          speaker: narrator
          text: |+
            她问。

        - id: ch01-b11
          speaker: grandma
          text: 没用完的东西。
        - id: ch01-b12
          speaker: narrator
          text: |+
            外婆说。

        - id: ch01-b13
          speaker: lin
          text: 没用完，为什么放床底？
        - id: ch01-b14
          speaker: narrator
          text: |-
            

            外婆瞥她一眼：
        - id: ch01-b15
          speaker: grandma
          text: 你那根没用完的充电线又为什么跑到床底？
        - id: ch01-b16
          speaker: narrator
          text: |+
            

            林澄笑了。外婆用拇指抵住盒盖，铁皮轻轻一弹。几十颗纽扣在里面挤着：贝壳白、蜜糖黄、墨水蓝；有的亮，有的磨花了；有两孔的、四孔的，还有一颗木头做的长扣子。最上面躺着一颗深绿色的大纽扣，四个孔像四只安静的眼睛。

            林澄正要捏起它，外婆的手先盖住了盒子。

        - id: ch01-b17
          speaker: grandma
          text: |+
            手上有灰。

        - id: ch01-b18
          speaker: lin
          text: |+
            纽扣还怕灰？

        - id: ch01-b19
          speaker: grandma
          text: 有一颗怕。
        - id: ch01-b20
          speaker: narrator
          text: 外婆从底下摸出一枚小小的珍珠扣，放进掌心。它不比绿豆大多少，光却软软地贴在上面。
        - id: ch01-b21
          speaker: grandma
          text: |+
            你妈妈小时候有件白衬衫，领口就用这个。她第一次上台唱歌，紧张得把最上面那颗揪掉了，攥在手里唱完整首。后来我在她掌心里找到它，全是汗。

        - id: ch01-b22
          speaker: lin
          text: 妈妈会紧张？
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: |+
            林澄坐直了。

        - id: ch01-b24
          speaker: grandma
          text: |+
            她那天说不紧张。

        - id: ch01-b25
          speaker: lin
          text: |+
            那她为什么揪纽扣？

        - id: ch01-b26
          speaker: grandma
          text: 你可以下次问她。
        - id: ch01-b27
          speaker: narrator
          text: |+
            外婆把珍珠扣放回去，嘴角动了一下。

            林澄重新看那盒纽扣。它们不再像一堆备用零件。每一颗都像刚刚被人按住，没有滚到故事外面去。


    - id: ch02
      title: 三颗留下来的纽扣
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |+
            雨大起来，阳台的铁栏杆发出细细的嗒嗒声。外婆把床单搭在椅背上。林澄忘了充电线，盘腿坐在地毯上，一颗一颗挑。

            她举起一颗扁扁的红扣子。

        - id: ch02-b02
          speaker: lin
          text: |+
            这个呢？

        - id: ch02-b03
          speaker: grandma
          text: 你舅舅七岁那年有件红雨衣。
        - id: ch02-b04
          speaker: narrator
          text: 外婆说，
        - id: ch02-b05
          speaker: grandma
          text: |+
            他嫌帽子遮眼，冒雨跑回来，雨衣少了一颗扣，鞋里多了两条小鱼。

        - id: ch02-b06
          speaker: lin
          text: |+
            鞋里怎么会有鱼？

        - id: ch02-b07
          speaker: grandma
          text: 他踩进沟里，先捞鱼，忘了捞纽扣。
        - id: ch02-b08
          speaker: narrator
          text: |+
            

            林澄笑得红扣子差点掉进暖气缝。外婆伸手接住，动作快得不像七十岁的人。

            一颗蓝玻璃扣来自外公的旧毛衣。外公去照全家福那天，坚持把毛衣穿反，因为他说正面的补丁应该藏在相机看不见的地方。相片洗出来后，领子歪着，蓝扣子却亮得像一小滴水。

            那颗木头长扣子属于外婆自己。很多年前，她坐长途车去另一座城学缝衣。车窗漏风，她把大衣扣得严严的。到站时，长扣子只剩一根线吊着。她没舍得剪掉，就一路用手护着它，走到裁缝铺才重新缝牢。

        - id: ch02-b09
          speaker: lin
          text: 那你后来为什么剪下来？
        - id: ch02-b10
          speaker: narrator
          text: |+
            林澄问。

        - id: ch02-b11
          speaker: grandma
          text: |+
            大衣穿破了。

        - id: ch02-b12
          speaker: lin
          text: |+
            你还留着扣子。

        - id: ch02-b13
          speaker: grandma
          text: 木头没破。
        - id: ch02-b14
          speaker: narrator
          text: |+
            外婆答得很快，仿佛这已经说明一切。

            林澄把三颗扣子排在膝盖上：红的、蓝的、木头的。她喜欢这些故事，却又生出一点不服气。所有纽扣都认识大人小时候的样子，只有她像最后才进门的客人。

        - id: ch02-b15
          speaker: lin
          text: 有没有我的？
        - id: ch02-b16
          speaker: narrator
          text: |+
            

            外婆低头翻了半天，找出一颗淡黄色的小熊扣。林澄一眼认出它来自自己三岁时的背带裤。她记不得裤子，却记得照片里那个圆脸孩子总被妈妈拿来给亲戚看。

        - id: ch02-b17
          speaker: lin
          text: 我不要这个。
        - id: ch02-b18
          speaker: narrator
          text: |-
            她说。

            外婆的手停在半空：
        - id: ch02-b19
          speaker: grandma
          text: |+
            为什么？

        - id: ch02-b20
          speaker: lin
          text: 因为我什么都不记得。那不是我的故事，是你们讲给我的。
        - id: ch02-b21
          speaker: narrator
          text: |+
            

            屋里只剩雨声。外婆没有说你小时候多可爱，也没有劝她收下。她把小熊扣放回铁盒，盖子没合，留了一条窄缝。

        - id: ch02-b22
          speaker: grandma
          text: 那就等一颗你记得的。
        - id: ch02-b23
          speaker: narrator
          text: |+
            她说。

            林澄从那条窄缝里看了看小熊扣，伸手把盒盖按紧。她还是想要一颗自己记得的纽扣，却不愿借走别人的故事。至少这个决定，是她自己做的。


    - id: ch03
      title: 一件来不及买的衣服
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |+
            傍晚，妈妈打来视频。屏幕里的小姨梅梅靠在医院的白枕头上，怀里露出一团皱皱的红脸。新生的小表妹闭着眼，嘴巴一动一动，像在梦里尝什么味道。

        - id: ch03-b02
          speaker: mom
          text: 姐姐看你啦。
        - id: ch03-b03
          speaker: narrator
          text: |-
            妈妈把手机凑近婴儿。

            林澄下意识退了半步。
        - id: ch03-b04
          speaker: lin
          text: |+
            她看不见吧。

        - id: ch03-b05
          speaker: mom
          text: 过两天就回外婆家住。
        - id: ch03-b06
          speaker: narrator
          text: 妈妈说，
        - id: ch03-b07
          speaker: mom
          text: 你不是说要送她礼物？
        - id: ch03-b08
          speaker: narrator
          text: |+
            

            林澄确实说过。她原计划用攒下的钱买一件印着小兔子的外套，还在手机里存了图片。可那家店已经缺货，别的款式她都觉得像临时替代。她不想让大人又替她选一个，说宝宝都能穿。

            视频结束后，她闷闷地坐回铁盒旁。外婆已把一块奶油色的软布铺在桌上，旁边放着纸样、尺子和线轴。

        - id: ch03-b09
          speaker: lin
          text: 这是什么？
        - id: ch03-b10
          speaker: narrator
          text: |+
            林澄问。

        - id: ch03-b11
          speaker: grandma
          text: 原来想做条小毯子。
        - id: ch03-b12
          speaker: narrator
          text: 外婆用手背试了试布，
        - id: ch03-b13
          speaker: grandma
          text: |+
            现在看，够做一件小外套。

        - id: ch03-b14
          speaker: lin
          text: |+
            没有小兔子。

        - id: ch03-b15
          speaker: grandma
          text: 你可以继续等那家店。
        - id: ch03-b16
          speaker: narrator
          text: |+
            

            外婆说得平平的，林澄却听出了挑战。她把手机里的图片放大给外婆看。兔耳朵帽子、粉色拉链、胸口一张笑脸，确实很可爱；可屏幕熄灭后，桌上只剩那块可以摸到的布。

        - id: ch03-b17
          speaker: lin
          text: 我们做得完吗？
        - id: ch03-b18
          speaker: narrator
          text: |+
            她问。

        - id: ch03-b19
          speaker: grandma
          text: 我一个人，今晚做不完。
        - id: ch03-b20
          speaker: narrator
          text: 外婆把尺子递给她，
        - id: ch03-b21
          speaker: grandma
          text: 两个人，也不一定。
        - id: ch03-b22
          speaker: narrator
          text: |-
            

            林澄接过尺子。

            她负责按住纸样，外婆沿边画线。她剪第一刀时太靠里，外婆没有替她抢走剪刀，只把那一小段线重新画宽。剪刀咔嚓咔嚓往前走，雨声渐渐退远了。她们把前片、后片和袖子排在桌上，像拼一只还不会动的小动物。

            缝纫机从柜子里搬出来。外婆踩下踏板，针急促地上下闪。林澄不敢靠太近，只负责在布边将要歪时轻轻提醒。到缝袖口，她试着踩了几下，机器忽然蹿快，针脚歪出一条斜线。

            她马上松脚。
        - id: ch03-b23
          speaker: lin
          text: 拆掉吧。
        - id: ch03-b24
          speaker: narrator
          text: |-
            

            外婆看了看：
        - id: ch03-b25
          speaker: grandma
          text: |+
            袖口会折进去。看不见。

        - id: ch03-b26
          speaker: lin
          text: 我看得见。
        - id: ch03-b27
          speaker: narrator
          text: |+
            

            外婆把拆线器交给她。细线一截一截被挑出来，比缝上去慢得多。林澄拆到一半，手心出了汗，想说算了。可她想起妈妈那枚被汗攥住的珍珠扣，便换了个握法，继续挑。

            夜里十点，外套终于有了样子。奶油色的身子，淡蓝色的包边，两只小袖子软软垂着。外婆拿出两片宽宽的软粘扣带。它们会沿着四边缝牢，藏在交叠的衣襟内侧，不留能被宝宝扯下的小零件。

        - id: ch03-b28
          speaker: grandma
          text: 用这个合上衣襟。
        - id: ch03-b29
          speaker: narrator
          text: 外婆说，

        - id: ch03-b30
          speaker: grandma
          text: 明天再缝完。
        - id: ch03-b31
          speaker: narrator
          text: |-
            

            她又把铁盒推过来：
        - id: ch03-b32
          speaker: grandma
          text: 还可以为纪念布片选一颗扣子。
        - id: ch03-b33
          speaker: narrator
          text: |+
            

            林澄立刻看中了深绿色的大纽扣。奶油色布衬得它很醒目，像雨后的一片叶子。她拿起它，才发现外婆没有伸手。

        - id: ch03-b34
          speaker: lin
          text: |+
            这颗是谁的？

        - id: ch03-b35
          speaker: narrator
          text: 外婆把线头捻在指间。

        - id: ch03-b36
          speaker: grandma
          text: |+
            你妈妈五岁时，邻居送过她一件绿毛衣。她穿到袖子短了一大截，还不肯脱。后来拆毛衣，别的扣子都拿去用了，只剩这一颗。

        - id: ch03-b37
          speaker: narrator
          text: |+
            林澄捏紧绿扣子。她喜欢它，可它讲的还是别人的故事。她把扣子放在一小块奶油色布上，没有马上拿针。


    - id: ch04
      title: 还没缝好的粘扣带
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |+
            第二天下午，小姨和宝宝提前回来了。门一开，屋里一下子挤满了声音：塑料袋响，保温壶响，妈妈说鞋别挡路，舅舅说他只停五分钟却提了三袋东西。宝宝被裹在浅灰色毯子里，脸比视频里小得多。

            外套还差两片软粘扣带没有缝牢。

            林澄把它藏在自己身后。她原本想等所有线头都剪干净，再郑重地拿出来。可外婆忙着扶小姨坐下，妈妈忙着给宝宝换尿布，没有人注意她。

            宝宝忽然哭了。不是视频里细细的一声，而是整张脸涨红，拳头举到耳边，像在抗议所有灯光和手。林澄抱着外套站在客厅中央，不知道该靠近还是让开。

        - id: ch04-b02
          speaker: aunt_mei
          text: 把窗帘拉一点。
          emotion: calm
        - id: ch04-b03
          speaker: narrator
          text: |+
            小姨说，声音很轻。

            林澄立刻去拉。屋里暗下来，宝宝的哭声也慢慢短了。小姨看见她手里的衣服。

        - id: ch04-b04
          speaker: aunt_mei
          text: |+
            你做的？

        - id: ch04-b05
          speaker: lin
          text: 我和外婆。
        - id: ch04-b06
          speaker: narrator
          text: 林澄说，
        - id: ch04-b07
          speaker: lin
          text: 还没好。
        - id: ch04-b08
          speaker: narrator
          text: |-
            

            小姨摸了摸淡蓝的边，眼睛弯起来。
        - id: ch04-b09
          speaker: aunt_mei
          text: 她也还没长好呢，先试试。
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: |+
            

            外婆把衣服轻轻披在宝宝身上。尺寸正合适，但两边衣襟滑开，像两扇不肯关的小门。

        - id: ch04-b11
          speaker: mom
          text: 还要把粘扣带缝好。
        - id: ch04-b12
          speaker: narrator
          text: |+
            妈妈说。

            桌上摆着宽宽的软粘扣带，旁边是绿纽扣和奶油色布片。

            宝宝抓住了她的小指。那只手小得惊人，抓得却很认真。林澄不敢动。她低头看见外套胸前空着的位置，忽然明白自己不需要从铁盒里找一个过去的位置。她正在桌边、窗帘旁和这只小手里，留下今天。

            她没有把这句话说出来。

        - id: ch04-b13
          speaker: lin
          text: 外套用软粘扣带。
        - id: ch04-b14
          speaker: narrator
          text: 她对外婆说，
        - id: ch04-b15
          speaker: lin
          text: |+
            绿扣子留给布片。

        - id: ch04-b16
          speaker: narrator
          text: 外婆只问：
        - id: ch04-b17
          speaker: grandma
          text: |+
            舍得？

        - id: ch04-b18
          speaker: lin
          text: 它会收在铁盒里，不让宝宝碰到。
        - id: ch04-b19
          speaker: narrator
          text: |-
            

            林澄坐到窗边，把线穿进针眼。外婆没有接过去，只替她把线尾打结。第一针从布背后钻出来，偏了一点。林澄把针退回去，再来一次。

            妈妈举起手机想拍照。林澄摇头：
        - id: ch04-b20
          speaker: lin
          text: 等我缝好。
        - id: ch04-b21
          speaker: narrator
          text: |+
            

            林澄沿着四边，把一片宽粘扣带缝平。外婆把另一片固定在另一边衣襟上。两片软布轻轻一压，外套就合好了，没有任何会松脱的小扣子。宝宝在淡蓝色衣领上方动了动下巴。

        - id: ch04-b22
          speaker: lin
          text: 现在是她的故事了？
        - id: ch04-b23
          speaker: narrator
          text: |-
            林澄问。

            外婆把铁盒放到她身边。
        - id: ch04-b24
          speaker: grandma
          text: |+
            衣服是她的。故事是你们一起开始的。


    - id: ch05
      title: 今天的纽扣
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |+
            宝宝睡着后，屋里终于安静。小姨靠在沙发上喝汤，妈妈和舅舅在厨房压低声音争论谁洗碗。林澄把用过的针线收回木盒，照外婆的规矩数了两遍针。

            林澄拿回绿纽扣和那块奶油色布。她先在碎布上练了三次，第四次终于把绿扣子缝稳。反面的线结像一小撮乱草，她没有拆。

            林澄把布片放进铁盒，旧纽扣围在它旁边。

        - id: ch05-b02
          speaker: grandma
          text: 这颗是谁的？
        - id: ch05-b03
          speaker: narrator
          text: |-
            外婆问。

            林澄学着她先前的语气说：
        - id: ch05-b04
          speaker: lin
          text: "一颗我记得的。\n\n"
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: |
            外婆笑出声，把盒盖合上。哗啦一响，旧纽扣碰着新布片。

            卧室里，宝宝哼了一声。林澄起身去看。宝宝睡在小姨怀里，奶油色外套叠好放在椅子上，软粘扣带安全地藏在衣襟内侧。身后，外婆挪动铁盒，盒里轻轻响了一下。
