audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 亲切细腻，像在身边讲故事, timbre: 温暖清晰, pace: 舒缓自然, pitch: 中}
    lin:
      display_name: 林澄
      tts: {delivery: 敏锐直率，带一点十岁孩子的倔强, timbre: 清亮女孩声线, pace: 自然偏快, pitch: 中高}
    grandma:
      display_name: 外婆
      tts: {delivery: 务实从容，偶尔带一点干脆的幽默, timbre: 柔和年长女声, pace: 不疾不徐, pitch: 中低}
    mom:
      display_name: 妈妈
      tts: {delivery: 忙碌亲切, timbre: 明亮成年女声, pace: 自然, pitch: 中}
    aunt_mei:
      display_name: 小姨
      tts: {delivery: 疲惫温柔, timbre: 轻柔成年女声, pace: 舒缓, pitch: 中}
  chapters:
    - id: ch01
      title: 会响的铁盒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            林澄在外婆家听见的第一场雨，不在窗外，在床底下。她趴在地上找充电线，手伸进凉凉的黑里，碰到一个圆东西。往外一拖，里面立刻哗啦一响，像一把硬糖滚过铁皮。林澄吓得缩回手。这响声也把正在阳台收衣服的外婆叫了进来。外婆怀里抱着半干的床单，眼镜上还沾着几点雨。
        - id: ch01-b02
          speaker: grandma
          text: 你找什么呢？
        - id: ch01-b03
          speaker: lin
          text: 我的充电线，昨天掉下去了。这个可不是我弄进去的。
        - id: ch01-b04
          speaker: grandma
          text: 这个比你早来好多年。
        - id: ch01-b05
          speaker: narrator
          text: 她们一起拖出铁盒。盒盖原先大概是蓝绿色的，现在褪得像阴天的河。上面绕着模糊的小白花，边沿还锈了一块。外婆擦掉灰，却没急着开。
        - id: ch01-b06
          speaker: narrator
          text: 林澄十岁了。最近大人总说她要当姐姐了，好像表妹一出生，她就该自动学会抱孩子、哄孩子。“你大了”这句话，她有点喜欢，也有点烦。眼前这只不开口的盒子，反倒有意思多了。
        - id: ch01-b07
          speaker: lin
          text: 里面是什么？没用完，为什么还放床底？
        - id: ch01-b08
          speaker: grandma
          text: 没用完的东西。你那根没用完的充电线，又为什么跑到床底？
        - id: ch01-b09
          speaker: narrator
          text: |-
            林澄笑了。外婆用拇指抵住盒盖，盒盖轻轻弹开。里面挤着几十颗纽扣：贝壳白、蜜糖黄、墨水蓝；有亮的，有磨花的；有两孔、四孔的，还有一颗木头长扣。最上面的深绿色大纽扣，四个孔像四只安静的眼睛。林澄刚伸手，外婆就先盖住了盒子。
        - id: ch01-b10
          speaker: grandma
          text: 手上有灰。
        - id: ch01-b11
          speaker: lin
          text: 纽扣还怕灰？
        - id: ch01-b12
          speaker: grandma
          text: 有一颗怕。
        - id: ch01-b13
          speaker: narrator
          text: 外婆从盒底摸出一枚比绿豆大不了多少的珍珠扣，光软软地贴在上面。
        - id: ch01-b14
          speaker: grandma
          text: 你妈妈小时候有件白衬衫，领口就用这个。她第一次上台唱歌，紧张得把最上面那颗揪下来，攥在手里唱完整首。后来我在她掌心里找到它，全是汗。
        - id: ch01-b15
          speaker: lin
          text: 妈妈也会紧张？
          emotion: surprised
        - id: ch01-b16
          speaker: grandma
          text: 她那天可说自己不紧张。
        - id: ch01-b17
          speaker: lin
          text: 那她为什么揪纽扣？
        - id: ch01-b18
          speaker: grandma
          text: 下次你自己问她。
        - id: ch01-b19
          speaker: narrator
          text: 外婆把珍珠扣放回去，嘴角轻轻动了一下。林澄再看那些纽扣，它们已经不是一堆备用零件了。每一颗都像刚被人按住，这才没有滚到故事外面去。
    - id: ch02
      title: 三颗留下来的纽扣
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雨越下越大，阳台栏杆嗒嗒地响。外婆把半干的床单搭到椅背上。林澄早忘了充电线，盘腿坐在地毯上，先举起一颗扁扁的红扣子。
        - id: ch02-b02
          speaker: lin
          text: 这个呢？
        - id: ch02-b03
          speaker: grandma
          text: 你舅舅七岁那年有件红雨衣。他嫌帽子遮眼，冒雨跑回来，雨衣少了一颗扣，鞋里倒多了两条小鱼。
        - id: ch02-b04
          speaker: lin
          text: 鞋里怎么会有鱼？
        - id: ch02-b05
          speaker: grandma
          text: 他踩进沟里，先顾着捞鱼，忘了捞纽扣。
        - id: ch02-b06
          speaker: narrator
          text: |-
            林澄笑得差点把红扣子掉进暖气缝，外婆一把接住，手快得不像七十岁的人。

            蓝玻璃扣来自外公的旧毛衣。照全家福那天，他非把毛衣反穿，好让补丁躲开相机。照片里领子歪着，蓝扣子却亮得像一小滴水。

            木头长扣是外婆的。很多年前，她坐长途车去另一座城学缝衣。车窗漏风，她把大衣扣得严严的。下车时，长扣只剩一根线吊着。她舍不得剪，就用手一路护到裁缝铺，进门先把它缝牢。
        - id: ch02-b07
          speaker: lin
          text: 那后来为什么又剪下来了？
        - id: ch02-b08
          speaker: grandma
          text: 大衣穿破了。
        - id: ch02-b09
          speaker: lin
          text: 可你还留着扣子。
        - id: ch02-b10
          speaker: grandma
          text: 木头没破。
        - id: ch02-b11
          speaker: narrator
          text: 外婆答得干脆，好像这就够了。林澄把红的、蓝的、木头的三颗扣子排在膝盖上。她喜欢这些故事，心里却有点不服气。所有纽扣都认识大人小时候的样子，只有她像最后才进门的客人。
        - id: ch02-b12
          speaker: lin
          text: 有没有我的？
        - id: ch02-b13
          speaker: narrator
          text: 外婆找出一颗淡黄色的小熊扣。林澄认得，它来自自己三岁时的背带裤。裤子她不记得，只记得照片里那个圆脸孩子，总被妈妈拿给亲戚看。
        - id: ch02-b14
          speaker: lin
          text: 我不要这个。
        - id: ch02-b15
          speaker: narrator
          text: 外婆的手停在半空。
        - id: ch02-b16
          speaker: grandma
          text: 为什么？
        - id: ch02-b17
          speaker: lin
          text: 因为我什么都不记得。那不是我的故事，是你们讲给我的。
          emotion: sad
        - id: ch02-b18
          speaker: narrator
          text: 屋里只剩雨声。外婆没说她小时候多可爱，也没劝她收下，只把小熊扣放回去，盒盖留着一条窄缝。
        - id: ch02-b19
          speaker: grandma
          text: 那就等一颗你记得的。
        - id: ch02-b20
          speaker: narrator
          text: 林澄从窄缝里又看了一眼，然后亲手按紧盒盖。她还是想要一颗自己记得的纽扣，却不愿借走别人的故事。至少这个决定，是她自己做的。
    - id: ch03
      title: 一件来不及买的衣服
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 傍晚，妈妈从医院打来视频。小姨靠着白枕头，怀里露出一张皱皱的红脸。小表妹闭着眼，嘴巴一动一动，像在梦里尝什么味道。
        - id: ch03-b02
          speaker: mom
          text: 姐姐看你啦。
        - id: ch03-b03
          speaker: narrator
          text: 妈妈把手机凑近宝宝。林澄下意识退了半步。
        - id: ch03-b04
          speaker: lin
          text: 她看不见吧？
        - id: ch03-b05
          speaker: mom
          text: 过两天她就回外婆家住。你不是说要送她礼物？
        - id: ch03-b06
          speaker: narrator
          text: |-
            林澄确实说过要送礼物。她原想用攒的钱买一件小兔子外套，图片都存好了。可店里缺货，别的款式都像临时凑数。她也不想让大人随便替她选一件，再说“宝宝都能穿”。

            视频挂断后，林澄闷闷地坐回铁盒旁。外婆已经在桌上铺开奶油色软布，旁边摆着纸样、尺子和线轴。
        - id: ch03-b07
          speaker: lin
          text: 这是什么？
        - id: ch03-b08
          speaker: narrator
          text: 外婆用手背试了试布。
        - id: ch03-b09
          speaker: grandma
          text: 原来想做条小毯子。现在看，够做一件小外套。
        - id: ch03-b10
          speaker: lin
          text: 没有小兔子。
        - id: ch03-b11
          speaker: grandma
          text: 你可以继续等那家店。
        - id: ch03-b12
          speaker: narrator
          text: 外婆说得平平的，林澄却听出了挑战。她把手机图片放大。兔耳朵帽子、粉色拉链、胸口的笑脸确实可爱。可屏幕一黑，桌上剩下的，是一块真的能摸到的布。
        - id: ch03-b13
          speaker: lin
          text: 我们做得完吗？
        - id: ch03-b14
          speaker: grandma
          text: 我一个人，今晚做不完。两个人嘛，也不一定。
        - id: ch03-b15
          speaker: narrator
          text: |-
            外婆把尺子递给林澄，她接了过来。

            林澄按纸样，外婆画线。第一刀剪得太靠里，外婆没抢剪刀，只把线重新画宽。剪刀咔嚓往前走，雨声慢慢退远。裁好的前片、后片和袖子，像一只还不会动的小动物。

            她们把缝纫机从柜子里搬出来。外婆踩下踏板，针飞快地上下闪。林澄不敢靠太近，只在布边快要歪时轻声提醒。缝到袖口，她试着踩了几下，机器猛地蹿快，针脚歪出一道斜线。她马上松开脚。
        - id: ch03-b16
          speaker: lin
          text: 拆掉吧。
        - id: ch03-b17
          speaker: grandma
          text: 袖口会折进去。看不见。
        - id: ch03-b18
          speaker: lin
          text: 我看得见。
        - id: ch03-b19
          speaker: narrator
          text: |-
            外婆把拆线器递给她。拆线比缝线慢多了。林澄手心冒汗，差点想算了。可她想起妈妈汗手里的珍珠扣，换了个握法，又继续挑。

            到晚上十点，外套终于有了样子：奶油色衣身，淡蓝色包边，两只软袖子。外婆拿出两片宽宽的软粘扣带。它们会沿着四边缝牢，藏在交叠的衣襟内侧，不留能被宝宝扯下来的小零件。
        - id: ch03-b20
          speaker: grandma
          text: 用这个合上衣襟，明天再缝完。纪念布片呢，还可以挑一颗纽扣。
        - id: ch03-b21
          speaker: narrator
          text: 林澄立刻看中了深绿色大纽扣。奶油色布衬得它很醒目，像雨后的一片叶子。她拿起纽扣，这才发现外婆没有伸手。
        - id: ch03-b22
          speaker: lin
          text: 这颗是谁的？
        - id: ch03-b23
          speaker: narrator
          text: 外婆把线头捻在指间。
        - id: ch03-b24
          speaker: grandma
          text: 你妈妈五岁时，邻居送过她一件绿毛衣。她穿到袖子短了一大截，还不肯脱。后来拆了毛衣，别的扣子都拿去用了，只剩这一颗。
        - id: ch03-b25
          speaker: narrator
          text: 林澄捏紧绿扣子。她很喜欢它，可它讲的还是别人的故事。她把扣子放到一小块奶油色布上，没有马上拿针。
    - id: ch04
      title: 还没缝好的粘扣带
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            第二天下午，小姨和宝宝提前回来了。门一开，塑料袋、保温壶和说话声一起挤进屋里。妈妈说鞋别挡路，舅舅说只待五分钟，手里却提着三袋东西。宝宝裹在浅灰色毯子里，脸比视频里小得多。

            外套还差两片软粘扣带没缝牢。林澄把它藏在身后，想等线头都剪干净再郑重送出去。可外婆忙着扶小姨坐下，妈妈忙着给宝宝换尿布，没人注意她。宝宝忽然哭了。那可不是视频里细细的一声，她整张脸都涨红了，拳头举在耳边，像在抗议所有灯光和手。林澄抱着外套站在客厅中央，不知该靠近还是让开。
        - id: ch04-b02
          speaker: aunt_mei
          text: 把窗帘拉一点。
        - id: ch04-b03
          speaker: narrator
          text: 小姨声音很轻。林澄马上去拉，屋里暗下来，宝宝的哭声也慢慢短了。小姨这才看见她手里的衣服。
        - id: ch04-b04
          speaker: aunt_mei
          text: 你做的？
        - id: ch04-b05
          speaker: lin
          text: 我和外婆一起做的。还没好。
        - id: ch04-b06
          speaker: aunt_mei
          text: 她也还没长好呢。先试试。
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: |-
            小姨摸了摸淡蓝色的边，疲惫的眼睛弯起来。外婆把衣服轻轻披到宝宝身上。大小正好，可两边衣襟一直滑开，像两扇关不住的小门。
        - id: ch04-b08
          speaker: mom
          text: 还要把粘扣带缝好。
        - id: ch04-b09
          speaker: narrator
          text: |-
            桌上摆着宽宽的软粘扣带，旁边是绿纽扣和奶油色布片。

            宝宝抓住林澄的小指。那只手小得惊人，抓得却很认真。林澄不敢动。她忽然明白，自己不用从铁盒里找一个过去的位置。今天就在这张桌边、这道窗帘旁、这只小手里。她正在亲手把它留下来。这些话，她没有说出口。
        - id: ch04-b10
          speaker: lin
          text: 外套用软粘扣带。绿扣子留给布片。
        - id: ch04-b11
          speaker: grandma
          text: 舍得？
        - id: ch04-b12
          speaker: lin
          text: 它会收在铁盒里，不让宝宝碰到。
        - id: ch04-b13
          speaker: narrator
          text: 林澄坐到窗边，自己把线穿进针眼。外婆没有接过去，只替她把线尾打结。第一针从布背后钻出来，偏了一点。林澄退回去重来。妈妈举起手机想拍照，她摇摇头。
        - id: ch04-b14
          speaker: lin
          text: 等我缝好。
        - id: ch04-b15
          speaker: narrator
          text: 林澄沿四边缝平一片粘扣带，外婆固定另一片。轻轻一压，外套就合好了，没有会松脱的小扣子。宝宝在淡蓝色衣领上方动了动下巴。
        - id: ch04-b16
          speaker: lin
          text: 现在是她的故事了？
        - id: ch04-b17
          speaker: narrator
          text: 外婆把铁盒放到林澄身边。
        - id: ch04-b18
          speaker: grandma
          text: 衣服是她的。故事，是你们一起开始的。
    - id: ch05
      title: 今天的纽扣
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            宝宝睡着后，屋里终于安静了。小姨在沙发上喝汤，妈妈和舅舅在厨房压低声音争谁洗碗。林澄收好针线，照外婆的规矩数了两遍针。

            她拿回绿纽扣和奶油色布片，先在碎布上练了三次。第四次，终于把纽扣缝稳。反面的线结像一小撮乱草，她没拆。她把布片放进铁盒，旧纽扣围到了它身边。
        - id: ch05-b02
          speaker: grandma
          text: 这颗是谁的？
        - id: ch05-b03
          speaker: narrator
          text: 林澄学着外婆刚才那种干脆的语气。
        - id: ch05-b04
          speaker: lin
          text: 一颗我记得的。
        - id: ch05-b05
          speaker: narrator
          text: 外婆笑出了声，合上盒盖。哗啦一下，旧纽扣碰着新布片。卧室里，宝宝轻轻哼了一声。林澄去看她。奶油色外套叠在椅子上，软粘扣带安全地藏在衣襟内侧。身后，外婆挪了一下铁盒。盒子里，又轻轻响了一声。
