audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and composed
        timbre: warm and clear
        pace: measured
        pitch: medium
    lin:
      display_name: Nora
      tts:
        delivery: alert and firm
        timbre: clear young girl voice
        pace: naturally brisk
        pitch: medium-high
    grandma:
      display_name: Grandma June
      tts:
        delivery: practical with dry humor
        timbre: soft older woman voice
        pace: unhurried
        pitch: medium-low
    mom:
      display_name: Mom
      tts:
        delivery: busy and affectionate
        timbre: bright adult woman voice
        pace: natural
        pitch: medium
    aunt_mei:
      display_name: Aunt May
      tts:
        delivery: tired and gentle
        timbre: soft adult woman voice
        pace: relaxed
        pitch: medium
  chapters:
    - id: ch01
      title: Weather Under the Bed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |+
            The first storm Nora heard at Grandma June's apartment was under the guest-room bed.

            She had flattened one cheek against the floor and reached into the cool dark for her charging cable. Her fingertips struck something round. When she pulled, the thing answered with a bright metal rattle, as if a pocketful of hard candy had rolled down a fire escape.

            Nora jerked back. Grandma June appeared in the doorway with damp sheets piled in her arms and three raindrops shining on her glasses.

        - id: ch01-b02
          speaker: grandma
          text: What are you hunting?
        - id: ch01-b03
          speaker: narrator
          text: |2+
             she asked.

        - id: ch01-b04
          speaker: lin
          text: My cable. It fell back there last night.
        - id: ch01-b05
          speaker: narrator
          text: " Nora pointed beneath the bed. "
        - id: ch01-b06
          speaker: lin
          text: |+
            I didn't put that thing there.

        - id: ch01-b07
          speaker: grandma
          text: That thing was here before you were.
        - id: ch01-b08
          speaker: narrator
          text: |+
            

            Together they tugged out a round tin. It had once been turquoise, but years had faded it to the color of a cloudy pond. Cream flowers circled the lid, and a thumbprint of rust marked one hinge. Grandma wiped away the dust with her apron. She did not open it.

            At ten, Nora had recently become old enough for adults to tell her she was old enough. Her new cousin would come home from the hospital in two days, and everyone said Nora would be the big girl now. The phrase pleased her for half a second, then pinched. It seemed to mean that she should know how to hold a baby and make one stop crying without anybody showing her.

            The silent tin was more interesting.

        - id: ch01-b09
          speaker: lin
          text: |+
            What's inside?

        - id: ch01-b10
          speaker: grandma
          text: |+
            Things I didn't finish using.

        - id: ch01-b11
          speaker: lin
          text: Then why are they under the bed?
        - id: ch01-b12
          speaker: narrator
          text: |-
            

            Grandma raised one eyebrow. 
        - id: ch01-b13
          speaker: grandma
          text: Why is your unfinished charging cable under there?
        - id: ch01-b14
          speaker: narrator
          text: |+
            

            Nora laughed. Grandma pressed her thumb to the lid. It sprang open with a soft pop.

            Buttons crowded the tin: shell white, honey yellow, ink blue. Some gleamed. Others were scratched cloudy. There were buttons with two holes and buttons with four, a narrow wooden toggle, and one large green button that looked up with four quiet eyes.

            Nora reached for it. Grandma's hand covered the tin first.

        - id: ch01-b15
          speaker: grandma
          text: |+
            Dusty fingers.

        - id: ch01-b16
          speaker: lin
          text: |+
            Buttons don't mind dust.

        - id: ch01-b17
          speaker: grandma
          text: One of them might.
        - id: ch01-b18
          speaker: narrator
          text: " Grandma dug near the bottom and lifted a pearl button no bigger than a lentil. Light rested softly on its curved face. "
        - id: ch01-b19
          speaker: grandma
          text: |+
            This came from your mother's white concert blouse. At her first solo, she worried the top button loose and held it in her fist through the whole song. I found it in her wet palm afterward.

        - id: ch01-b20
          speaker: lin
          text: Mom got scared?
        - id: ch01-b21
          speaker: narrator
          text: |2+
             Nora sat up.

        - id: ch01-b22
          speaker: grandma
          text: |+
            She claimed she wasn't.

        - id: ch01-b23
          speaker: lin
          text: |+
            Then why did she pull off her button?

        - id: ch01-b24
          speaker: grandma
          text: You can ask her.
        - id: ch01-b25
          speaker: narrator
          text: |2+
             Grandma's mouth bent at one corner.

            Nora looked into the tin again. The buttons no longer seemed like spare parts. Each one appeared to have been stopped just before it rolled out of a story.


    - id: ch02
      title: Three That Stayed
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |+
            Rain ticked against the balcony rail. Grandma draped the damp sheets over chair backs, and Nora forgot her charging cable. She sat cross-legged on the rug and chose a flat red button.

        - id: ch02-b02
          speaker: lin
          text: |+
            This one?

        - id: ch02-b03
          speaker: grandma
          text: |+
            Your uncle's raincoat. He was seven, and the hood kept falling over his eyes. He came home with one button missing and two minnows in his boots.

        - id: ch02-b04
          speaker: lin
          text: |+
            How did fish get into his boots?

        - id: ch02-b05
          speaker: grandma
          text: He stepped in the creek. He remembered to rescue the fish and forgot to rescue the button.
        - id: ch02-b06
          speaker: narrator
          text: |+
            

            Nora laughed so hard that the red button nearly dropped through the heating grate. Grandma caught it with a hand too quick to belong to anybody's idea of an old lady.

            A blue glass button had belonged to Grandpa's favorite sweater. On the day of a family photograph, he wore the sweater backward because the patched elbow looked better on the side away from the camera. In the finished picture, his collar leaned sideways, but the blue button shone like a bead of water.

            The wooden toggle belonged to Grandma herself. Long ago, she had taken a bus to another city to learn dressmaking. Cold air leaked through the window, so she fastened her brown coat to the throat. When the bus arrived, the toggle hung by one thread. She guarded it in her fist all the way to the tailor shop and sewed it back before she took off her coat.

        - id: ch02-b07
          speaker: lin
          text: Why did you cut it off later?
        - id: ch02-b08
          speaker: narrator
          text: |2+
             Nora asked.

        - id: ch02-b09
          speaker: grandma
          text: |+
            The coat wore out.

        - id: ch02-b10
          speaker: lin
          text: |+
            But you kept the button.

        - id: ch02-b11
          speaker: grandma
          text: The wood didn't wear out.
        - id: ch02-b12
          speaker: narrator
          text: |2+
             Grandma said it briskly, as if that settled the matter.

            Nora lined the three buttons across her knee: red, blue, brown. She liked the stories, but something in her tightened. Every button knew what the adults had been like before they were adults. Nora felt like a guest who had arrived after all the good chairs were taken.

        - id: ch02-b13
          speaker: lin
          text: Is there one from me?
        - id: ch02-b14
          speaker: narrator
          text: |+
            

            Grandma searched and found a pale yellow button shaped like a bear. Nora recognized it from the overalls she had worn at three. She could not remember the overalls. She only remembered the photograph of her round toddler face, which Mom displayed to relatives whenever she wanted Nora to groan.

        - id: ch02-b15
          speaker: lin
          text: "I don't want that one,"
        - id: ch02-b16
          speaker: narrator
          text: |2-
             Nora said.

            Grandma's hand stopped between them. 
        - id: ch02-b17
          speaker: grandma
          text: |+
            Why not?

        - id: ch02-b18
          speaker: lin
          text: Because I don't remember it. That's your story about me.
        - id: ch02-b19
          speaker: narrator
          text: |+
            

            Only the rain spoke for a moment. Grandma did not say how adorable Nora had been. She did not tell her to be grateful. She returned the bear button to the tin and left the lid resting on a narrow crack.

        - id: ch02-b20
          speaker: grandma
          text: "Then we'll wait for one you remember,"
        - id: ch02-b21
          speaker: narrator
          text: |2+
             she said.

            The answer bothered Nora more than an argument would have. She had wanted the tin to prove she already belonged. Grandma made it sound as if her place had not happened yet.


    - id: ch03
      title: The Coat They Could Touch
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |+
            That evening, Mom called from the hospital. On the screen, Aunt May lay against a white pillow with a wrinkled red face tucked beside her. The baby's eyes were closed. Her mouth worked in sleep as if she were tasting a secret.

        - id: ch03-b02
          speaker: mom
          text: "Your cousin is meeting you,"
        - id: ch03-b03
          speaker: narrator
          text: |2-
             Mom said, bringing the phone closer.

            Nora leaned away without meaning to. 
        - id: ch03-b04
          speaker: lin
          text: |+
            She can't see me, can she?

        - id: ch03-b05
          speaker: mom
          text: She'll be at Grandma's in two days. Didn't you say you had a present?
        - id: ch03-b06
          speaker: narrator
          text: |+
            

            Nora had said that. She had saved enough allowance for a jacket with rabbit ears on the hood. The picture waited in her phone. But the store had sold out, and every other jacket felt like something chosen at the last minute. Nora did not want an adult to buy one and say that babies could wear anything.

            After the call, she found Grandma spreading cream-colored cloth over the dining table. A paper pattern, ruler, chalk, and spools of thread waited beside it.

        - id: ch03-b07
          speaker: lin
          text: |+
            What's that for?

        - id: ch03-b08
          speaker: grandma
          text: I planned to make a small blanket.
        - id: ch03-b09
          speaker: narrator
          text: " Grandma rubbed the cloth between two fingers. "
        - id: ch03-b10
          speaker: grandma
          text: |+
            There's enough for a coat.

        - id: ch03-b11
          speaker: lin
          text: |+
            It won't have rabbit ears.

        - id: ch03-b12
          speaker: grandma
          text: You can keep waiting for the store.
        - id: ch03-b13
          speaker: narrator
          text: |+
            

            Grandma's voice was flat, but Nora heard the dare inside it. She enlarged the saved picture. The pink zipper and smiling rabbit face looked perfect while the screen glowed. When it went dark, only the cream cloth remained under her hand.

        - id: ch03-b14
          speaker: lin
          text: |+
            Can we finish in time?

        - id: ch03-b15
          speaker: grandma
          text: I can't finish tonight alone.
        - id: ch03-b16
          speaker: narrator
          text: " Grandma held out the ruler. "
        - id: ch03-b17
          speaker: grandma
          text: "Together, we still might not."
        - id: ch03-b18
          speaker: narrator
          text: |-
            

            Nora took it.

            She held the paper pattern while Grandma drew around it. Nora's first cut wandered inside the chalk line. Grandma did not take the scissors away. She redrew that short edge a little narrower, and Nora continued. Snip by snip, the storm moved farther off. They arranged two front pieces, a back, and two sleeves on the table. The parts looked like a small animal that had not learned to stand.

            Grandma lifted her sewing machine from the cabinet. The needle flashed when she pressed the pedal. Nora stayed clear and watched the cloth edge. Whenever it began to drift, she tapped the table once. At the cuff, Grandma let her try.

            The machine leaped. A line of stitches ran crooked across the cloth.

            Nora pulled her foot away. 
        - id: ch03-b19
          speaker: lin
          text: |+
            Take it out.

        - id: ch03-b20
          speaker: grandma
          text: "The cuff folds over it,"
        - id: ch03-b21
          speaker: narrator
          text: " Grandma said. "
        - id: ch03-b22
          speaker: grandma
          text: |+
            No one will see.

        - id: ch03-b23
          speaker: lin
          text: I will.
        - id: ch03-b24
          speaker: narrator
          text: |+
            

            Grandma passed her the seam ripper.

            Removing the little stitches took far longer than making them. Halfway through, Nora's palm grew damp and she wanted to leave the rest. Then she thought of Mom's pearl button, held through an entire song in a sweaty fist. She changed her grip and picked out the next stitch.

            At ten that night, the coat had a shape. It had a cream body, pale blue edging, and two soft sleeves. Grandma pushed the button tin across the table.

        - id: ch03-b25
          speaker: grandma
          text: Choose.
        - id: ch03-b26
          speaker: narrator
          text: |+
            

            Nora reached at once for the large green button. Against the cream cloth, it looked like a leaf after rain. She lifted it, then noticed that Grandma had not moved.

        - id: ch03-b27
          speaker: lin
          text: Whose was this?
        - id: ch03-b28
          speaker: narrator
          text: |-
            

            Grandma rolled a thread end between her fingers. 
        - id: ch03-b29
          speaker: grandma
          text: "Your mother had a green sweater when she was five. A neighbor gave it to her. She wore it until the sleeves stopped halfway down her arms. When I unraveled the sweater, I used the other buttons. This one stayed."
        - id: ch03-b30
          speaker: narrator
          text: |+
            

            Nora closed her fingers around it. She loved the button. Suddenly she did not want to fasten it to a coat that a baby would spit up on, pull, and outgrow.

        - id: ch03-b31
          speaker: lin
          text: |+
            Do you have new ones?

        - id: ch03-b32
          speaker: grandma
          text: In the drawer.
        - id: ch03-b33
          speaker: narrator
          text: |+
            

            The new white buttons were identical. They sat in straight rows inside a clear packet, without rust or scratches or anything a person remembered. Nora placed the green button on the coat, then removed it. She tried a white one and removed that too.

            Grandma threaded a needle and waited.


    - id: ch04
      title: The Missing Button
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |+
            Aunt May and the baby came home a day early. The door opened, and the apartment filled with noise: shopping bags crackling, a thermos knocking against the wall, Mom warning everyone about the shoes, Uncle Rob promising he would stay only five minutes while carrying in three bags.

            The coat still needed its button.

            Nora hid it behind her back. She had planned to clip every thread and present it properly. But Grandma was helping Aunt May sit down, and Mom was changing the baby. No one noticed Nora in the middle of the room.

            Then the baby cried. It was not the thin sound from the phone. Her whole face turned red. Her fists rose beside her ears as if she objected to every lamp and hand. Nora stood holding the coat, unsure whether to step closer or disappear.

        - id: ch04-b02
          speaker: aunt_mei
          text: Could someone close the curtain halfway?
        - id: ch04-b03
          speaker: narrator
          text: |2+
             Aunt May asked. Her voice was almost lost beneath the crying.

            Nora moved first. The room softened, and soon the cries grew shorter. Aunt May saw the coat in Nora's arms.

        - id: ch04-b04
          speaker: aunt_mei
          text: |+
            Did you make that?

        - id: ch04-b05
          speaker: lin
          text: Grandma and I did. It isn't finished.
        - id: ch04-b06
          speaker: narrator
          text: |-
            

            Aunt May touched the pale blue edge. Her tired eyes curved. 
        - id: ch04-b07
          speaker: aunt_mei
          text: Neither is she. Let's try it.
        - id: ch04-b08
          speaker: narrator
          text: |+
            

            Grandma laid the coat lightly over the baby. It fit, but the two front pieces slipped apart like doors that would not stay closed.

        - id: ch04-b09
          speaker: mom
          text: "It needs a button,"
        - id: ch04-b10
          speaker: narrator
          text: |2+
             Mom said.

            Nora had two answers in her pocket: the old green button and a smooth new white one. She felt the tiny chip in the green edge, then the perfect circle of the white.

            The baby caught Nora's smallest finger. The hand was astonishingly small, but its grip was serious. Nora did not move. She saw the empty place on the coat and understood that she did not need the tin to give her a piece of the past. She was here at the table, beside the curtain, inside this small hand's grasp, making today.

            She did not say any of that.

        - id: ch04-b11
          speaker: lin
          text: "Use the green one,"
        - id: ch04-b12
          speaker: narrator
          text: |2-
             she told Grandma.

            Grandma asked only, 
        - id: ch04-b13
          speaker: grandma
          text: |+
            Sure?

        - id: ch04-b14
          speaker: lin
          text: "If it falls off, we'll look for it together."
        - id: ch04-b15
          speaker: narrator
          text: |-
            

            Nora sat by the window and pushed the thread toward the needle's eye. Grandma did not take it from her. She only knotted the end after Nora got it through. The first stitch came up crooked. Nora drew it back and tried again.

            Mom lifted her phone for a picture. Nora shook her head. 
        - id: ch04-b16
          speaker: lin
          text: When I'm done.
        - id: ch04-b17
          speaker: narrator
          text: |+
            

            The needle traveled through the four holes. With every pull, the green button settled closer to the cream cloth. Grandma showed Nora how to wind the thread beneath it and tie two knots.

            Nora clipped the thread and fastened the coat. The baby's chin moved. The green button rose and fell with her breath.

        - id: ch04-b18
          speaker: lin
          text: Is it hers now?
        - id: ch04-b19
          speaker: narrator
          text: |2-
             Nora asked.

            Grandma set the tin beside her. 
        - id: ch04-b20
          speaker: grandma
          text: |+
            The coat is hers. She'll have to make the story.


    - id: ch05
      title: What Filled the Space
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |+
            After the baby fell asleep, the apartment quieted. Aunt May drank soup on the sofa. Mom and Uncle Rob argued in whispers about who would wash the dishes. Nora returned the needles to their wooden case and counted them twice, the way Grandma had taught her.

            Without the green button, a bright turquoise circle showed on the bottom of the tin. The empty spot was more noticeable than any button around it.

        - id: ch05-b02
          speaker: lin
          text: "It looks wrong,"
        - id: ch05-b03
          speaker: narrator
          text: |2+
             Nora said.

        - id: ch05-b04
          speaker: grandma
          text: It'll be a jumble again soon.
        - id: ch05-b05
          speaker: narrator
          text: " Grandma nudged the red button and wooden toggle closer. "
        - id: ch05-b06
          speaker: grandma
          text: Tins are poor at remembering places.
        - id: ch05-b07
          speaker: narrator
          text: |+
            

            Nora considered the metal pin on her backpack. Her class had received it on a fall field trip. She touched the clasp, then left it where it was. A pin was not a button, and she still needed it.

            The new white button remained in her pocket. It had been the green button's replacement. Now it had no job.

        - id: ch05-b08
          speaker: lin
          text: Can this go in?
        - id: ch05-b09
          speaker: narrator
          text: |2-
             Nora asked.

            Grandma reached for it, but Nora pulled her hand back. 
        - id: ch05-b10
          speaker: lin
          text: Wait.
        - id: ch05-b11
          speaker: narrator
          text: |+
            

            She found a scrap of the cream cloth and cut an uneven circle. Three times she practiced. On the fourth, she sewed the white button firmly to the scrap. The knots on the back looked like a nest built in a hurry. She left them.

            Nora placed the scrap in the tin. It covered the turquoise circle exactly.

        - id: ch05-b12
          speaker: grandma
          text: Whose button is that?
        - id: ch05-b13
          speaker: narrator
          text: |2-
             Grandma asked.

            Nora borrowed Grandma's brisk voice. 
        - id: ch05-b14
          speaker: lin
          text: Something I didn't finish using.
        - id: ch05-b15
          speaker: narrator
          text: |-
            

            Grandma laughed and shut the lid. Old buttons and the new one rattled together.

            From the bedroom came a small grunt. Nora went to look. The cream coat rested on the side of the cradle, its green button facing the door. As Nora approached, the button caught the night-light. It gleamed once, then settled against the soft cloth as the baby breathed.
