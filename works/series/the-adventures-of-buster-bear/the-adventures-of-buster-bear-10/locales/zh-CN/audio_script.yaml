audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏爽快，带着顽皮的笑意
        timbre: 清亮灵活
        pace: 偏快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐狸雷迪
      tts:
        delivery: 狡猾自负，恼怒时尖刻凶狠
        timbre: 略显沙哑而锐利
        pace: 中等偏快
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 顽皮活泼，取笑别人时轻快大胆
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高音
    blacky_the_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 警觉多疑，说话直截了当
        timbre: 粗亮而有穿透力
        pace: 中等
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 爱整洁又随和，说话朴实轻松
        timbre: 温和清亮
        pace: 中等
        pitch: 中音
    uncle_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 老练诙谐，乡音自然亲切
        timbre: 松弛微哑
        pace: 从容
        pitch: 中低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 热心爽朗，提主意时干脆利落
        timbre: 清朗结实
        pace: 中等偏快
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 好奇活跃，追问时急切明快
        timbre: 清脆响亮
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十章　熊巴斯特成了英雄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小水獭乔在微笑池讲了那件新鲜事。农夫布朗家的男孩连熊巴斯特都没看见，只见到他的脚印，就转身逃走了。这个消息很快传遍绿草地和绿森林，那里所有的动物都知道了。
        - id: ch01-b02
          speaker: narrator
          text: 彼得兔当然帮着到处传。这样的事交给彼得，准错不了。不过，其他动物也一样卖力。他们怕那男孩怕了太久，现在听说绿森林里终于有谁能让男孩也尝到他们受过的那种惊吓，简直乐坏了。熊巴斯特就这样一下子成了大家心里的英雄。
        - id: ch01-b03
          speaker: narrator
          text: 可不是谁都相信小乔。乌鸦布莱基不信，因为他太了解农夫布朗家的男孩，想不出那男孩害怕会是什么样。红狐狸雷迪也不信，不过他只是不愿意信。他既嫉妒熊巴斯特，又害怕熊巴斯特，便装出一个字也不相信的样子。
        - id: ch01-b04
          speaker: narrator
          text: 雷迪赞成布莱基的说法。他们非要亲眼看见农夫布朗家的男孩害怕，才肯相信。其他动物差不多全信了，个个欢天喜地。其实，他们也很怕又大又强壮的巴斯特。可他们更怕农夫布朗家的男孩，因为谁也不了解他，更弄不懂他。他以前设过陷阱，想捉住他们中的一些，还用那支可怕的枪追猎过另一些。
        - id: ch01-b05
          speaker: narrator
          text: 如今，是他们自己中间的一员吓住了农夫布朗家的男孩。大家一想起这件事就很自豪，也真把熊巴斯特看成了英雄。他们想方设法让巴斯特知道，大家都愿意跟他做朋友，甚至特意绕路去帮他的忙。大家每次碰面，说来说去都是巴斯特有多聪明、多了不起。
        - id: ch01-b06
          speaker: narrator
          text: 浣熊博比正在欢笑溪里洗晚餐。他最爱干净，做什么都仔仔细细，十分讲究，一边洗还一边说起自己的打算。
        - id: ch01-b07
          speaker: bobby_coon
          text: 这回，那男孩大概会躲着绿森林走了。我们也不用整天提防他啦。
        - id: ch01-b08
          speaker: billy_mink
          text: 他往后肯定也不敢再设下任何陷阱来捉我了。
        - id: ch01-b09
          speaker: narrator
          text: 水貂比利说这话时得意极了。负鼠比利大叔听到消息，也有个愿望。
        - id: ch01-b10
          speaker: uncle_billy_possum
          text: 俺真盼熊老弟去一趟农夫布朗家的鸡舍，把那男孩吓得从此不敢靠近。要是他肯帮这个忙，俺一定记在心上。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 要不，咱们大家一起去找熊巴斯特吧。得告诉他，他做了这件事，我们有多感激。
        - id: ch01-b12
          speaker: little_joe_otter
          text: 这个主意真棒！走，我们马上就去！
          emotion: happy
        - id: ch01-b13
          speaker: blacky_the_crow
          text: 哇，哇，哇！我看先别急。等我们自己瞧明白了，再说这件事到底是真是假。
        - id: ch01-b14
          speaker: little_joe_otter
          text: 这事本来就是真的！难道你以为我在说假话？
          emotion: angry
        - id: ch01-b15
          speaker: blacky_the_crow
          text: 相信，当然相信，没人怀疑你的话。
        - id: ch01-b16
          speaker: narrator
          text: 布莱基说得客气极了，可他的话还没说完。
        - id: ch01-b17
          speaker: blacky_the_crow
          text: 但你也说了，那男孩并没见到熊巴斯特，只看见一个脚印。也许他不知道那是谁留下的。就算知道了，他也不一定害怕。我倒有个办法，能让大家亲眼看看，他究竟怕不怕熊巴斯特。
        - id: ch01-b18
          speaker: sammy_jay
          text: 快说，是什么办法？
        - id: ch01-b19
          speaker: narrator
          text: 松鸦萨米急着追问。布莱基却摇摇头，又眨了眨眼。
        - id: ch01-b20
          speaker: blacky_the_crow
          text: 现在告诉你们，就不算秘密了。我还要再想一想。明天太阳一出来，你们就在大山核桃树下等我，也把能叫来的动物全叫来。到那个时候，说不定我会把办法讲出来。
