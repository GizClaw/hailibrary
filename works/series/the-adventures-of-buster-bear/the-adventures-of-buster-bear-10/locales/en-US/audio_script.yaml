  chapters:
    - id: ch01
      title: Buster Bear Becomes a Hero
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Joe Otter had told everyone at the Smiling Pool how Farmer Brown's boy ran away from Buster Bear without even seeing him. Before long, the news had traveled across the Green Meadows and through the Green Forest. Peter Rabbit helped it along, of course. You can always count on Peter to spread news. Everyone else passed it on too.
        - id: ch01-b02
          speaker: narrator
          text: For a long time, they had all been afraid of Farmer Brown's boy. Now, just the thought that someone in the Green Forest could frighten him tickled them almost to pieces. In no time at all, most of them were calling Buster Bear a hero.
        - id: ch01-b03
          speaker: narrator
          text: A few still doubted Little Joe's story. Blacky the Crow was one of them. He knew Farmer Brown's boy so well that he could not imagine the boy being frightened. Reddy Fox doubted too, but only because he did not want the story to be true. He was jealous of Buster Bear, and afraid of him at the same time.
        - id: ch01-b04
          speaker: narrator
          text: So Reddy acted as if he did not believe a single word. He agreed with Blacky that he would need to see Farmer Brown's boy show fear before he believed it. Almost everyone else accepted the story. There was great rejoicing all across the Green Forest.
        - id: ch01-b05
          speaker: narrator
          text: Most of them feared Buster because he was so big and strong. But Farmer Brown's boy frightened them even more. They did not know or understand him. In the past, he had set traps for some of them and hunted others with his terrible gun.
        - id: ch01-b06
          speaker: narrator
          text: They were very proud that one of their own had actually scared him. Soon they treated Buster like a true hero. They went out of their way to be friendly and do him favors. Whenever any of them met, they talked about how clever and how great Buster Bear was.
        - id: ch01-b07
          speaker: narrator
          text: Bobby Coon spoke while he washed his dinner in the Laughing Brook. Bobby was always very neat and particular about washing his food.
        - id: ch01-b08
          speaker: bobby_coon
          text: Maybe Farmer Brown's boy will stay out of the Green Forest now. Then we won't have to keep watching for him all the time.
        - id: ch01-b09
          speaker: billy_mink
          text: And now he won't dare put out any more traps for me!
        - id: ch01-b10
          speaker: narrator
          text: Billy Mink gloated over that thought. When Unc' Billy Possum heard the news, he had a favor of his own in mind.
        - id: ch01-b11
          speaker: unc_billy_possum
          text: Ah surely wish Brer Bear would go up by Farmer Brown's henhouse. If he scared Farmer Brown's boy away from there, Ah would appreciate that favor mighty much.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: Why don't we all go see Buster together and tell him how grateful we are for what he did?
        - id: ch01-b13
          speaker: little_joe_otter
          text: That's a wonderful idea! Let's go right now.
        - id: ch01-b14
          speaker: narrator
          text: Then Blacky the Crow cut in with three loud caws.
        - id: ch01-b15
          speaker: blacky_crow
          text: I say we wait until we can see for ourselves whether the story is really true.
        - id: ch01-b16
          speaker: little_joe_otter
          text: It is true! Are you saying you don't believe me?
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Blacky answered with perfect politeness.
        - id: ch01-b18
          speaker: blacky_crow
          text: Certainly not. No one is questioning your word. But you told us Farmer Brown's boy never saw Buster Bear. He only saw a footprint. Maybe he didn't know whose footprint it was. If he had known, perhaps he wouldn't have run. I have a plan that will let us find out whether he really is afraid of Buster.
        - id: ch01-b19
          speaker: sammy_jay
          text: What kind of plan?
        - id: ch01-b20
          speaker: narrator
          text: Sammy Jay leaned into the question eagerly. Blacky only shook his head and winked.
        - id: ch01-b21
          speaker: blacky_crow
          text: If I told you now, it wouldn't be a secret. I need time to think it through. Meet me at the Big Hickory-tree tomorrow morning at sun-up. Bring everyone you can. Then perhaps I'll tell you.
