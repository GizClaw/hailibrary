  chapters:
    - id: ch01
      title: Little Joe Otter Takes Grandfather Frog's Advice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Make an enemy your friend, and you will have much less fear and worry. Little Joe Otter learned that when he followed Grandfather Frog's advice.
        - id: ch01-b02
          speaker: narrator
          text: Little Joe would never have said he was afraid of Buster Bear. No one likes to admit to being afraid, and Little Joe least of all. He truly had plenty of courage. Few of the little people in the Green Forest or on the Green Meadows wanted to quarrel with him, because he could fight very well when he had to. Everyone along the Laughing Brook and in the Smiling Pool usually let him have his own way.
        - id: ch01-b03
          speaker: narrator
          text: But always getting your own way can make you selfish, careless of others, and hard to live with. Little Joe had gotten his own way too often. Grandfather Frog knew it. After Little Joe spoke to him disrespectfully, Grandfather Frog shook his head with a very serious look.
        - id: ch01-b04
          speaker: grandfather_frog
          text: Too bad. Too bad! Chug-a-rum! Little Joe is such a fine young fellow. It is too bad that his selfish carelessness is spoiling his good nature.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: Grandfather Frog did not show it, but he was delighted when he heard that Buster had outsmarted Little Joe. He found it so funny that he could hardly keep a straight face. Still, he looked as grave and solemn as ever when he gave Little Joe some advice. He told him to make friends with anyone bigger, stronger, and smarter than he was.
        - id: ch01-b06
          speaker: narrator
          text: It was sensible advice. Little Joe only sniffed and went away, saying that he would get even with Buster yet. But Little Joe was usually cheerful and full of fun. Once he got home and his temper cooled, he began to understand the joke on himself. He had worked hard to scare the fish away from the little pools so Buster could not catch them. All that time, he had been driving those fish straight into Buster's paws.
        - id: ch01-b07
          speaker: narrator
          text: After a while, Little Joe grinned. At first the grin was a little embarrassed. Then it grew into a laugh.
        - id: ch01-b08
          speaker: little_joe_otter
          text: I think Grandfather Frog is right. The best thing I can do is make friends with Buster Bear. I'll try tomorrow morning.
        - id: ch01-b09
          speaker: narrator
          text: Very early the next morning, Little Joe went to the best fishing pool he knew in the Laughing Brook. He caught the biggest trout he could find. The fish was so big and fat that it made his mouth water, because fat trout were his favorite food. But Little Joe did not take even one bite.
        - id: ch01-b10
          speaker: narrator
          text: Instead, he carefully set the trout on an old log where Buster would be sure to see it if he came that way. Then Little Joe hid close by to watch. Buster was late that morning. Little Joe began to think he would never come.
        - id: ch01-b11
          speaker: narrator
          text: Once, Little Joe almost lost the fish. He turned his head for only a moment. When he looked again, the trout had disappeared. Buster could not have crept up and taken it. Someone that big could never have slipped out of sight again so quickly.
        - id: ch01-b12
          speaker: narrator
          text: Little Joe dashed to the log and peered over the other side. There was the fat trout. Beside it stood his smallest cousin, Shadow the Weasel, a terrible thief who was bad through and through. Little Joe sprang at him angrily, but Shadow was too quick and darted away.
        - id: ch01-b13
          speaker: narrator
          text: Little Joe put the fish back on the log and waited. This time, he never looked away from it.
        - id: ch01-b14
          speaker: narrator
          text: At last, just as Little Joe was about to give up, he saw Buster Bear shuffling toward the Laughing Brook. Buster suddenly stopped and sniffed. One of the Merry Little Breezes had carried the smell of that fat trout to him.
        - id: ch01-b15
          speaker: narrator
          text: Buster walked straight over to the fish. His nose wrinkled, and his eyes shone with pleasure.
        - id: ch01-b16
          speaker: buster_bear
          text: Now, who could have been thoughtful enough to leave this fine breakfast here for me?
        - id: ch01-b17
          speaker: little_joe_otter
          text: It was me. I caught it especially for you.
        - id: ch01-b18
          speaker: narrator
          text: Little Joe's voice came out rather faintly.
        - id: ch01-b19
          speaker: buster_bear
          text: Thank you. I think you and I are going to be friends.
        - id: ch01-b20
          speaker: narrator
          text: Buster's eyes twinkled more brightly than ever.
        - id: ch01-b21
          speaker: little_joe_otter
          text: I... I hope so.
