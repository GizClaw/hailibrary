audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 老成温和，讲道理时沉着而略带幽默
        timbre: 低厚圆润
        pace: 缓慢从容
        pitch: 中低音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 第六章　小水獭乔听从青蛙爷爷的劝告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 若能把仇敌变成朋友，从此也就不必担心害怕了。小水獭乔听了青蛙爷爷的劝告，后来果然明白了这个道理。不过，他绝不会承认自己害怕熊巴斯特。谁愿意承认害怕呢？小乔尤其不愿意。其实，他确实很有勇气。绿森林和绿草地上的小动物，很少有谁愿意主动跟他争吵。因为真打起来，小乔可是个厉害的对手。住在欢笑溪里、溪岸上，还有微笑池里的邻居，更是什么事都由着他的性子。
        - id: ch01-b02
          speaker: narrator
          text: 可是，凡事总由着自己的性子，并不是好事。时间一久，人很容易只顾自己，不替别人着想，也会变得越来越难相处。小乔就是太任性了。那天，他对青蛙爷爷很不尊敬。青蛙爷爷心里明白，只是严肃地摇了摇头。
        - id: ch01-b03
          speaker: grandfather_frog
          text: 真可惜。真可惜！实在太可惜了！咕咚呱！小乔这么好的年轻小伙子，却因为自私又莽撞，把自己的好脾气都糟蹋了。真可惜。
        - id: ch01-b04
          speaker: narrator
          text: 后来，青蛙爷爷听说熊巴斯特比小乔棋高一着，心里着实高兴。可他一点儿也没露出来。这件事太有趣，他差点儿憋不住笑，却还是板着脸，郑重地劝小乔，碰上比自己高大、强壮又聪明的家伙，最好跟对方做朋友。这话很合常理，小乔却哼了一声，转身就走，还说早晚要找巴斯特算账。
        - id: ch01-b05
          speaker: narrator
          text: 其实，小乔平时脾气很好，也爱玩闹。回到家以后，他的怒气慢慢消了，这才发现，整件事实在有点儿好笑。他费了那么大劲，把欢笑溪一个个小水潭里的鱼全吓跑，原想让巴斯特一条也捉不到。可从头到尾，他竟然一直在把鱼赶进巴斯特的爪子里。想着想着，小乔咧开了嘴。起初，他笑得还有点儿难为情，后来终于哈哈大笑起来，连眼泪都笑出来了。
        - id: ch01-b06
          speaker: little_joe_otter
          text: 我看，青蛙爷爷说得没错。我现在最该做的，就是跟熊巴斯特交朋友。明天一早，我就去试试。
        - id: ch01-b07
          speaker: narrator
          text: 第二天天刚亮，小乔就来到欢笑溪最好的捕鱼水潭，捉了一条他能找到的最大鳟鱼。那条鱼又大又肥，馋得他直流口水。肥鳟鱼可是他最爱吃的东西。不过，他连一口也没尝，而是把鱼小心地放在一截老树干上。巴斯特只要从这里经过，一定能看见。放好以后，小乔藏到附近，悄悄等着。
        - id: ch01-b08
          speaker: narrator
          text: 那天早晨，巴斯特来得真迟。小乔左等右等，觉得他大概永远也不会来了。有一回，小乔只把头转开一小会儿，再回头时，鳟鱼竟然不见了。他差点儿就把鱼弄丢。可鱼不可能是巴斯特拿走的。巴斯特那么大，绝不可能悄悄拿了鱼，又这么快躲得无影无踪。
        - id: ch01-b09
          speaker: narrator
          text: 小乔飞快地蹿到树干旁，往另一边一看，肥鳟鱼果然在那里。他个头最小的表亲，鼬鼠影子，也在那里。影子是个惯偷，而且坏透了。小乔气冲冲地扑过去，可影子动作太快，一闪身就逃走了。
        - id: ch01-b10
          speaker: narrator
          text: 小乔把鱼重新放好，又等了起来。这一回，他的眼睛一下也没离开那条鱼。眼看就要放弃时，他终于看见巴斯特拖着脚步，慢吞吞地走向欢笑溪。巴斯特突然站住，抽了抽鼻子。原来，一缕快乐小微风把肥鳟鱼的香味送到了他那里。他马上朝鱼走去，鼻子一皱一皱的，眼睛也欢喜得直发亮。
        - id: ch01-b11
          speaker: narrator
          text: 巴斯特把心里的疑问大声说了出来。
        - id: ch01-b12
          speaker: buster_bear
          text: 是哪位这么贴心，已经替我准备好一顿美味的早餐了？
        - id: ch01-b13
          speaker: narrator
          text: 小乔听见以后，声音却有些发虚。
        - id: ch01-b14
          speaker: little_joe_otter
          text: 是我。这条鱼是我特意捉来送给你的。
        - id: ch01-b15
          speaker: buster_bear
          text: 谢谢你。
        - id: ch01-b16
          speaker: narrator
          text: 巴斯特说这话时，两只眼睛比刚才更亮了。
        - id: ch01-b17
          speaker: buster_bear
          text: 我看，我们会成为朋友的。
        - id: ch01-b18
          speaker: little_joe_otter
          text: 我……我也希望如此。
