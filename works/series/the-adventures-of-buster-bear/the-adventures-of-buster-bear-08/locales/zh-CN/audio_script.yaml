audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朝气十足，困惑时直率而略显急躁
        timbre: 清亮活泼的少年音
        pace: 轻快自然
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 第八章　农夫布朗家的男孩吓得头发直竖
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 只因突如其来的古怪惊吓，农夫布朗家的男孩头发直竖啦。
        - id: ch01-b02
          speaker: narrator
          text: 头发忽然竖起来，这事听着挺滑稽的，对不对？可农夫布朗家的男孩去欢笑溪钓鱼，却一条也没钓着的那一天，他头上的头发真的竖了起来。
        - id: ch01-b03
          speaker: narrator
          text: 能让毛发竖起来的，只有生气和害怕。猎犬鲍泽，还有一些小动物，一生气，后颈和背上的毛就会根根竖起。黑猫咪的尾巴也会炸毛，看着足足粗了一倍。它生气或害怕时，都会这样。
        - id: ch01-b04
          speaker: narrator
          text: 可农夫布朗家的男孩不一样。能让他头发竖起来的，只有一件事。既然他没有生气，那自然是害怕了。
        - id: ch01-b05
          speaker: narrator
          text: 这样的事，以前从没发生过。其实，农夫布朗家的男孩没有多少真正害怕的东西。这次要不是眼前的发现来得太突然，他说不定也不会怕。
        - id: ch01-b06
          speaker: narrator
          text: 他在岸上看到那些鳟鱼头，马上就明白，已经有别人来捉过鱼了，难怪自己一条也钓不到。可水貂比利这么小，吃得下那么多鳟鱼吗？他根本没有想到小水獭乔，心里怎么也琢磨不明白。
        - id: ch01-b07
          speaker: narrator
          text: 他边走边想，这到底是怎么回事？来到欢笑溪岸边一片泥泞的地方，他猛然看见一样东西，眼睛瞪得几乎要蹦出来。就在那一刻，他觉得头发一下子竖了起来。至少，他后来是这么说的。
        - id: ch01-b08
          speaker: narrator
          text: 他看见了什么？你猜猜看。软泥里只有一只脚印。对，先生，就是一只脚印，没有别的东西。可那是农夫布朗家的男孩见过的最大脚印，而且像是几分钟前才留下的。
        - id: ch01-b09
          speaker: narrator
          text: 那是熊巴斯特的脚印。
        - id: ch01-b10
          speaker: narrator
          text: 农夫布朗家的男孩不知道熊巴斯特已经搬来绿森林。他也从没听说这里有熊。眼前的脚印让他吃惊得不敢相信自己的眼睛。天气明明很暖，他身上却泛起一阵奇怪的寒意。
        - id: ch01-b11
          speaker: narrator
          text: 不知怎么回事，他现在一点也不想遇见熊巴斯特。要是带着那杆可怕的枪，也许还不一样。偏偏枪没在身边，于是他马上拿定主意，今天不再钓鱼了。
        - id: ch01-b12
          speaker: narrator
          text: 他还觉得，好像有谁一直盯着自己，可四周一个人影也看不到。其实，果然有人在看他。小水獭乔和熊巴斯特都躲在一旁，格外小心，不让他发现。
        - id: ch01-b13
          speaker: narrator
          text: 回家的路上，农夫布朗家的男孩穿过绿森林，一路走，一路不停地回头。直到走出森林边缘，他才敢长长地舒一口气。他没有跑，可他心里一直想跑。
        - id: ch01-b14
          speaker: buster_bear
          text: 哈！我看他刚才是害怕了！
        - id: ch01-b15
          speaker: narrator
          text: 熊巴斯特说得一点儿也没错。
