audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: easygoing and good-humored
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: lively and quick to react
        timbre: light and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Farmer Brown's Boy Feels His Hair Rise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a sudden, strange surprise that made Farmer Brown's boy's hair rise.
        - id: ch01-b02
          speaker: narrator
          text: Hair rising all at once sounds funny, doesn't it? But that was exactly what happened on the day Farmer Brown's boy went fishing in the Laughing Brook and caught nothing at all.
        - id: ch01-b03
          speaker: narrator
          text: Hair stands up for two reasons. It might be anger, or it might be fear. When Bowser the Hound gets angry, the hair along his neck and back sometimes bristles. The same thing happens to some of the other little people. And you know how Black Pussy's tail can puff up until it looks twice its usual size. That may happen from anger or from fear.
        - id: ch01-b04
          speaker: narrator
          text: But Farmer Brown's boy was different. Anger would not make the hair on his head rise. That left only fear.
        - id: ch01-b05
          speaker: narrator
          text: His hair had never done such a thing before. Very little truly frightened Farmer Brown's boy. Even this might not have scared him if his discovery had not caught him by surprise.
        - id: ch01-b06
          speaker: narrator
          text: The trout heads on the bank told him that another fisherman had been there first. No wonder he could not catch anything. Yet little Billy Mink could never have eaten so many trout, and Little Joe Otter did not enter his thoughts at all. He simply could not solve the puzzle.
        - id: ch01-b07
          speaker: narrator
          text: He kept turning the mystery over in his mind, trying to understand it. Then he reached a little muddy spot on the bank of the Laughing Brook. Something there made his eyes open so wide they looked ready to pop right out of his head. At that very moment, he felt his hair rise. At least, that was how he told it afterward.
        - id: ch01-b08
          speaker: narrator
          text: What had he seen? What do you think it was? Why, just a footprint in the soft mud. Yes, sir, that was all. But it was the biggest footprint Farmer Brown's boy had ever seen, and it looked only a few minutes old.
        - id: ch01-b09
          speaker: narrator
          text: It was Buster Bear's footprint.
        - id: ch01-b10
          speaker: narrator
          text: No one had told Farmer Brown's boy that Buster Bear now lived in the Green Forest. In fact, he had never heard of any bear living there. He stared at the print and struggled to believe what his own eyes showed him. The day was warm, but a queer little chill crept over him.
        - id: ch01-b11
          speaker: narrator
          text: Meeting Buster Bear no longer seemed like a pleasant idea. Perhaps Farmer Brown's boy would have felt differently with his terrible gun in hand. He had left it behind, though, and all at once he had fished enough for one day.
        - id: ch01-b12
          speaker: narrator
          text: Then came another strange feeling. Someone seemed to be watching him, even though nobody was in sight. And someone was. Little Joe Otter and Buster Bear had their eyes on him, while taking great care not to be seen.
        - id: ch01-b13
          speaker: narrator
          text: Farmer Brown's boy started home through the Green Forest. Again and again, he glanced behind him. Only when he reached the edge of the forest did he finally take a long breath. He had walked the whole way, but he had wanted to run.
        - id: ch01-b14
          speaker: buster_bear
          text: Huh! I think he was scared!
        - id: ch01-b15
          speaker: narrator
          text: And Buster Bear was exactly right.
