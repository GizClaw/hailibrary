audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 憨厚直率，满足时带着含混的咕哝
        timbre: 低沉浑厚
        pace: 稍慢
        pitch: 低音
    farmer_browns_boy:
      display_name: 农夫布朗的儿子
      tts:
        delivery: 直率活泼，受惊时声音紧促
        timbre: 清亮的少年嗓音
        pace: 中等偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十章　熊巴斯特带走了农夫布朗儿子的铁皮桶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 问题来了。熊巴斯特偷了农夫布朗儿子的铁皮桶吗？偷，就是拿走属于别人的东西。巴斯特发现桶里的浆果时，明明知道那是别人的，却还是故意吃了。这些浆果当然算是他偷的。
        - id: ch01-b02
          speaker: narrator
          text: 他很清楚，一定有人采好了浆果，才会把它们装进桶里。谁听说过蓝莓会长在铁皮桶里呢？所以，巴斯特拿走那些浆果，的确是偷。可是铁皮桶不一样。他虽然把桶带走了，却不是有意的。其实，他根本不想要那只桶。
        - id: ch01-b03
          speaker: narrator
          text: 事情要从头说起。巴斯特在老牧场的大灌木底下，发现了一只装满香甜浆果的大铁皮桶。他连想也没想，根本没管自己该不该吃。
        - id: ch01-b04
          speaker: narrator
          text: 巴斯特实在太喜欢浆果了。贪吃的小眼睛刚看见那满满一桶，他就忘掉了所有别的事，心里只惦记着鼻子底下的这顿美餐。至于不问自取是对是错，他压根儿没放在心上。
        - id: ch01-b05
          speaker: narrator
          text: 那么多浆果堆在一起，他一辈子也没见过。他只要吃呀，吃呀，再吃呀就行了。于是，他真的吃了起来。
        - id: ch01-b06
          speaker: narrator
          text: 铁皮桶很快就被弄翻了，可巴斯特才不在意这种小事。他把滚出来的浆果一扫而光，又把鼻子伸进桶里，想把剩下的也吃干净。
        - id: ch01-b07
          speaker: narrator
          text: 正在这时，他听见一点儿动静，好像有人走过来了。巴斯特猛地抬头细听。也不知道是怎么弄的，后来连他自己都没想明白，桶柄竟然从耳朵后面滑了下去，牢牢卡住了。
        - id: ch01-b08
          speaker: narrator
          text: 这已经够糟了。偏偏就在这一刻，一个尖厉又气恼的声音响了起来。
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: 嘿，你！快从那儿滚开！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 巴斯特一听就知道，这是农夫布朗儿子的声音。他当场吓得差点儿发了疯。那只可怕的铁皮桶紧紧罩住他的头，害得他什么也看不见。
        - id: ch01-b11
          speaker: narrator
          text: 什么也看不见，自然就逃不了。可巴斯特现在最想做的，偏偏就是赶快逃走。别看他个头那么大，力气那么足，只要附近有人，他就又胆小又腼腆。
        - id: ch01-b12
          speaker: narrator
          text: 巴斯特低吼着，呜咽着，又尖叫起来。他想往后退，从桶里挣脱，可怎么也退不出来。他拼命甩头，桶还是不掉。接着，他又想用爪子把桶扯下来，却连桶边都抓不住。
        - id: ch01-b13
          speaker: narrator
          text: 就在这时，农夫布朗的儿子又大叫了一声。这一声里全是恐惧。要不是巴斯特自己也吓坏了，他也许就能听出来。
        - id: ch01-b14
          speaker: narrator
          text: 原来，农夫布朗的儿子这才认出，眼前是熊巴斯特。刚才第一次喊的时候，他还以为那是住在老牧场里过夏天的一头小牛。
        - id: ch01-b15
          speaker: narrator
          text: 等他看清巴斯特，吓得一点儿也不比巴斯特轻。他又惊又怕，连逃跑都忘了。那声惊叫过后，他只会站在原地，一动不动地瞪着巴斯特。
        - id: ch01-b16
          speaker: narrator
          text: 巴斯特更慌了，发疯似的抓挠着头上那个可怕的东西。突然，铁皮桶滑了下来，他终于又能看见了。
        - id: ch01-b17
          speaker: narrator
          text: 他惊恐地看了农夫布朗的儿子一眼，接着发出一声震天的吼叫。
        - id: ch01-b18
          speaker: buster_bear
          text: 嗷呜！
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: 巴斯特拔腿就往绿森林奔去，两条腿能跑多快就跑多快。我告诉你，他跑得可真快！他根本顾不上找路，只管从灌木丛里横冲直撞，好像那些枝枝杈杈全都不存在。
        - id: ch01-b20
          speaker: narrator
          text: 可最好笑的还在后头。巴斯特把铁皮桶也带走了！千真万确，他带着农夫布朗儿子的大铁皮桶逃跑了！
        - id: ch01-b21
          speaker: narrator
          text: 原来，桶从他头上滑下来时，桶柄还套在脖子上。于是，巴斯特就这么挂着一只桶，一路跑远了。
        - id: ch01-b22
          speaker: narrator
          text: 他根本不想要它。只要能把桶弄掉，他什么都肯拿来换。可他实在没有办法，只好把它带走。
        - id: ch01-b23
          speaker: narrator
          text: 这样一来，我们又回到了开头的问题。巴斯特算不算偷了农夫布朗儿子的铁皮桶呢？你怎么想？
