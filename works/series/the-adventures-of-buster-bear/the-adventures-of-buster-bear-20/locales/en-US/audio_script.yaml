audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and energetic
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Buster Bear Carries Off the Pail of Farmer Brown's Boy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Did Buster Bear steal the pail that belonged to Farmer Brown's boy? That is the question. Stealing means taking something that belongs to someone else. Buster certainly stole the berries he found inside the pail. He ate them on purpose, and he knew somebody must have picked them. After all, who ever heard of blueberries growing in a tin pail?
        - id: ch01-b02
          speaker: narrator
          text: The pail itself was another matter. Buster took it, but he never meant to. The truth is, he did not want that pail at all.
        - id: ch01-b03
          speaker: narrator
          text: Here is how it happened. Buster found a big tin pail filled to the brim with delicious berries. It sat in the shade of a large bush in the Old Pasture. He never stopped to wonder whether he had any right to those berries. He loved them so much that the moment his greedy little eyes saw that full pail, he forgot everything except the feast right under his nose.
        - id: ch01-b04
          speaker: narrator
          text: Right and wrong never entered his mind. He had never seen so many berries together in his life. All he had to do was eat and eat and eat. So that is exactly what he did.
        - id: ch01-b05
          speaker: narrator
          text: Of course, Buster knocked over the pail, but such a little thing did not bother him. He gobbled up every berry that rolled out. Then he pushed his nose down into the pail to reach the ones still inside.
        - id: ch01-b06
          speaker: narrator
          text: Just then, he heard a small noise. It sounded as though someone was coming. Buster jerked up his head to listen, and somehow, though he never knew quite how it happened, the pail's handle slipped behind his ears and caught there.
        - id: ch01-b07
          speaker: narrator
          text: That was bad enough. But at that very moment, a shrill, angry voice rang out.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: Hey, you! Get away from there!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: Buster knew that voice at once. It belonged to Farmer Brown's boy. Buster nearly had a fit. The dreadful pail was stuck over his head, and he could not see a thing. He could not run away, either, though that was what he wanted more than anything. Buster may be big and strong, but he is terribly shy whenever people are near.
        - id: ch01-b10
          speaker: narrator
          text: Buster growled, whined, and squealed. He tried backing out of the pail, but it stayed put. He shook his head, but the pail would not come off. He even tried to pull it away, but he could not get hold of it.
        - id: ch01-b11
          speaker: narrator
          text: Then Farmer Brown's boy yelled again. If Buster had not been so frightened, he might have realized that this second yell came from fear. The boy had just discovered that the creature in front of him was Buster Bear.
        - id: ch01-b12
          speaker: narrator
          text: When the boy first shouted, he thought he was chasing away one of the young cattle that spent the summer in the Old Pasture. Then he saw Buster. Now the boy was every bit as frightened as the bear. Surprise and fear held him still. He could not even run. After that second yell, all he could do was stand there and stare.
        - id: ch01-b13
          speaker: narrator
          text: Meanwhile, Buster clawed more wildly than ever at the horrible thing covering his head. Suddenly, the pail slipped off, and he could see again. He shot one frightened glance at Farmer Brown's boy. Then he gave a mighty "Woof!" and raced toward the Green Forest as fast as his legs could carry him. And let me tell you, that was very fast indeed.
        - id: ch01-b14
          speaker: narrator
          text: Buster did not stop to choose a path. He crashed straight through the bushes as though they were nothing at all. But the funniest part was that he took the pail with him!
        - id: ch01-b15
          speaker: narrator
          text: Yes, sir, Buster Bear ran away with Farmer Brown's boy's big tin pail. When it slipped from his head, the handle stayed caught around his neck. So off he ran with the pail hanging there. He did not want it. He would have given anything to be rid of it. But he carried it away because he could not help himself.
        - id: ch01-b16
          speaker: narrator
          text: And that brings us right back to our question. Did Buster steal Farmer Brown's boy's pail? What do you think?
