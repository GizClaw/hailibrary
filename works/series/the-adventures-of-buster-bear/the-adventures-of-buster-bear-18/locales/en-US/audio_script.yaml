  chapters:
    - id: ch01
      title: Somebody Else Goes Berrying
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Isn't it funny how two people can think of the very same thing at the very same time, while neither one knows what the other is thinking? That is what happened on the day Buster Bear first decided to go berrying.
        - id: ch01-b02
          speaker: narrator
          text: Buster was walking through the Green Forest, telling himself how hungry he was for berries. He felt sure there must be some up in the Old Pasture. At that same time, someone else was thinking about berries and the Old Pasture too.
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: Mother, if I pick the berries tomorrow, will you make me a berry pie?
        - id: ch01-b04
          speaker: narrator
          text: Mrs. Brown answered at once.
        - id: ch01-b05
          speaker: mrs_brown
          text: Yes, I will.
        - id: ch01-b06
          speaker: narrator
          text: That night, Farmer Brown's boy went to bed very early so he could rise early the next morning. All night long, he dreamed about berries and berry pies.
        - id: ch01-b07
          speaker: narrator
          text: He woke before jolly, round, red Mr. Sun was ready to get up. By the time the first Jolly Little Sunbeams came dancing across the Green Meadows, the boy was ready to leave for the Old Pasture. He carried a big tin pail. In the bottom was his lunch, wrapped in paper. He meant to stay until the pail was full, even if filling it took all day.
        - id: ch01-b08
          speaker: narrator
          text: The Old Pasture is a very large place. It lies at the foot of the Big Mountain and reaches a little way up the mountainside. Many people could pick berries there all day and never see one another, unless they wandered around a great deal. The bushes grow so thick that no one can see very far in any direction.
        - id: ch01-b09
          speaker: narrator
          text: Mr. Sun had climbed a little way into the sky when Farmer Brown's boy reached the pasture. He smiled down on all the Great World, and the whole world seemed to smile back. The boy began to whistle. Then he stopped.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: If I whistle, everyone will know exactly where I am. They will keep out of sight, and I will never get to know the little folks while they are hiding from me.
        - id: ch01-b11
          speaker: narrator
          text: Farmer Brown's boy was beginning to understand something Peter Rabbit and the other little people learn almost as soon as they can walk. If you do not want to be seen, you must not be heard.
        - id: ch01-b12
          speaker: narrator
          text: So the boy did not whistle, though he wanted to. He tried not to make even the tiniest sound as he followed an old cow path. It led toward a place where he knew the berries grew thick and very large. All the way, he kept both his eyes and his ears wide open.
        - id: ch01-b13
          speaker: narrator
          text: That was how he heard a faint little cry. If he had been whistling, he would have missed it completely. He stopped and listened. He had never heard a cry quite like it. At first, he could not tell what it was or where it came from. But he knew one thing for certain. Someone was frightened.
        - id: ch01-b14
          speaker: narrator
          text: He stood perfectly still and listened as hard as he could. Then the cry came again.
        - id: ch01-b15
          speaker: master_stickytoes
          text: Help! Help! Help!
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: The voice was very faint, and it sounded terribly afraid. The boy waited for another minute or two, but he heard nothing more. He set down his pail and began searching in a hurry. He looked here, there, and everywhere.
        - id: ch01-b17
          speaker: narrator
          text: He felt sure the cry had come from somewhere on the ground. He peered behind bushes. He looked behind logs and stones. He was just about to give up when he rounded a little turn in the old cow path.
        - id: ch01-b18
          speaker: narrator
          text: Right in front of him was little Mr. Gartersnake. And what do you think Mr. Gartersnake was doing? I do not like to tell you, but he was trying to swallow one of Stickytoes the Tree Toad's children.
        - id: ch01-b19
          speaker: narrator
          text: Farmer Brown's boy did not allow that. He made little Mr. Gartersnake let Master Stickytoes go. Then he held the snake until Master Stickytoes was safely out of reach.
