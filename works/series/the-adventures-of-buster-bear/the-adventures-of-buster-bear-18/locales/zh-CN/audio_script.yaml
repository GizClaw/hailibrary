audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗的儿子
      tts:
        delivery: 诚恳活泼，话里带着少年人的好奇
        timbre: 清亮自然
        pace: 轻快
        pitch: 中高音
    master_stickytoes:
      display_name: 小黏脚少爷
      tts:
        delivery: 稚嫩轻细，受惊时短促急切
        timbre: 细小清亮
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十八章　又有人去采浆果
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 两个人偏偏在同一个时候想到同一件事，却谁也不知道对方正在想什么，这不是很有趣吗？熊巴斯特头一回想去采浆果的那天，正好就是这样。
        - id: ch01-b02
          speaker: narrator
          text: 巴斯特在绿森林里走来走去，嘴里念叨着自己有多馋浆果，还认定老牧场里准能找到一些。就在这时，另一个人也想到了浆果，也想到了老牧场。
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: 我要是明天把浆果采回来，您能给我烤一个浆果派吗？
        - id: ch01-b04
          speaker: narrator
          text: 农夫布朗的儿子这样问母亲，布朗太太当然答应了。那天晚上，他早早就上了床，打算第二天一早起来。可睡着以后，他整整一夜都在梦见浆果和浆果派。
        - id: ch01-b05
          speaker: narrator
          text: 快活的、圆滚滚的红太阳先生还没觉得该起床，他已经醒了。第一批快乐的小阳光跳着舞越过绿草地时，他也准备好了，马上就要动身去老牧场。
        - id: ch01-b06
          speaker: narrator
          text: 他手里提着一只大铁皮桶。桶底还有一份午饭，用纸包着。他已经拿定主意，非得装满这只桶才回家。哪怕要采上一整天，他也愿意。
        - id: ch01-b07
          speaker: narrator
          text: 老牧场可大了。它就在大山脚下，还有一小片顺着山坡伸到了大山上。许多人可以在里面采上一整天的浆果，彼此连面都碰不见，除非他们四处走得很远。
        - id: ch01-b08
          speaker: narrator
          text: 那里的灌木挤得密密的，无论往哪边看，都看不出多远。农夫布朗的儿子赶到时，红太阳先生已经在天空爬上了一小段。他笑眯眯地望着整个大世界，整个大世界好像也正对着他笑。
        - id: ch01-b09
          speaker: narrator
          text: 农夫布朗的儿子刚吹起口哨，忽然又闭上了嘴。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: 我要是吹口哨，大家就会知道我在哪儿，然后全都躲起来。总是连面都见不着，我还怎么跟他们交朋友呢？
        - id: ch01-b11
          speaker: narrator
          text: 彼得兔和绿草地、绿森林里的小居民，差不多刚学会走路就懂得一个道理。农夫布朗的儿子这时也开始明白了。不想让人看见，就别让人听见。
        - id: ch01-b12
          speaker: narrator
          text: 他很想吹口哨，还是忍住了。接着，他沿一条旧牛径往前走，脚下尽量不出一点声响。那条路通向他熟悉的地方，那里的浆果又密又多，一颗颗还大得很。他一路睁大眼睛，也竖起耳朵，仔细留意四周。
        - id: ch01-b13
          speaker: narrator
          text: 正因为这么安静，他才听见一声细小的呼救。声音轻得几乎听不见。刚才要是一直吹着口哨，他肯定会错过。他立刻停下来听。这种叫声，他以前从没听过。
        - id: ch01-b14
          speaker: narrator
          text: 起初，他既听不出那是什么，也分不清声音从哪儿来。不过有一点不会错，那是有人吓坏了，正在求救。他一动不动，拼命听着。
        - id: ch01-b15
          speaker: master_stickytoes
          text: 救命！救命！救命！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 叫声又轻又害怕。农夫布朗的儿子等了一两分钟，却再也没听见。他放下铁皮桶，急忙四处寻找。那声音准是从地面附近传来的，于是他探头看过一丛丛灌木后面，又去查看倒木和石头背后。
        - id: ch01-b17
          speaker: narrator
          text: 他几乎就要放弃了。可绕过旧牛径上的一个小弯以后，他看见小袜带蛇先生就在眼前。你猜他在做什么？唉，我实在不愿告诉你。他正想吞掉树蟾黏脚的一只小树蟾。
        - id: ch01-b18
          speaker: narrator
          text: 农夫布朗的儿子当然不会让他得逞。他迫使小袜带蛇先生放开小黏脚少爷，又一直按住袜带蛇先生，直到小黏脚少爷逃到安全的地方，再也够不着了。
