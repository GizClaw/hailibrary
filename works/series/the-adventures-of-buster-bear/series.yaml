cover_prompt: |-
  A wordless cover scene in the early-twentieth-century American countryside shows a large black bear standing knee-deep in a bright woodland brook as he reaches one broad paw toward a trout flashing beneath the water. The bear has thick glossy black fur, a broad rounded head, small alert ears, a tan muzzle, and curious brown eyes, while a sleek dark-brown otter watches from a mossy bank beside a silver fish. A freckle-faced farm boy in simple 1910s clothes pauses far back among the trees, surprised but safe, as a blue jay and red squirrel look down from nearby branches. The bear's careful attempt to catch the trout is the clear focal action, suggesting both appetite and comic woodland adventure without menace. Use a wide child-height view with the brook curving through pines, ferns, stones, and sunlit meadow beyond, keeping the main figures prominent in the lower middle and leaving calm open sky and soft canopy at the top. Keep the animals anatomically believable, the rural setting appropriate to the 1910s, and every figure friendly and independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
