audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    blacky_the_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 警觉多疑，说话直截了当
        timbre: 粗亮而有穿透力
        pace: 中等
        pitch: 中低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 好奇活跃，追问时急切明快
        timbre: 清脆响亮
        pace: 偏快
        pitch: 中高音
    chatterer_red_squirrel:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，得意时顽皮又大胆
        timbre: 细亮轻快
        pace: 急促
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十五章　熊巴斯特不再是英雄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有些人原本被大家当成勇敢的英雄，后来却让大家发现，他并没有想象中那么勇敢。这样的英雄，就算跌下神坛了。熊巴斯特正是这样。
        - id: ch01-b02
          speaker: narrator
          text: 小水獭乔曾经告诉大家，农夫布朗家的男孩光是看见巴斯特留下的一只大脚印，就害怕了。有些小动物一听，马上把巴斯特捧成了英雄。住在绿森林里的动物竟能吓跑那个男孩，这可是头一回，真真正正的头一回。难怪大家又敬佩巴斯特，又为他骄傲。
        - id: ch01-b03
          speaker: narrator
          text: 直到后来，大家亲眼看见巴斯特迎面遇上农夫布朗家的男孩。男孩转身就跑，能跑多快跑多快。可是巴斯特呢？他也逃了，跑得甚至比男孩更快。最后，他藏到了绿森林最深处，躲进了能找到的最偏僻的地方。
        - id: ch01-b04
          speaker: narrator
          text: 这事很难相信，却是真的。大家对巴斯特的敬意一下子少了许多。事情往往就是这样。他们开始在背后说巴斯特的坏话。有些家伙遇见他时，还当着他的面说，或者故意提高嗓门，非让他听见不可。
        - id: ch01-b05
          speaker: narrator
          text: 乌鸦布莱基和松鸦萨米最不肯放过他。他们会飞，根本不怕巴斯特，又最爱看别人难受。两个家伙满森林地找，找到巴斯特以后，就停在安全的树梢上，冲他尖声唱起来。
        - id: ch01-b06
          speakers: [blacky_the_crow, sammy_jay]
          ensemble: duo
          text: 熊巴斯特高又壮，牙齿尖来爪子长。纵有这般好模样，照样逃跑终日藏！
        - id: ch01-b07
          speaker: narrator
          text: 一天里，这样的尖叫声总要钻进巴斯特耳朵十来回。他气得磨牙，抬头怒视树上的两个家伙。可除了瞪眼，他还能怎么办？他碰不到他们，只好硬生生忍下来。
        - id: ch01-b08
          speaker: narrator
          text: 后来，红松鼠喋喋也来捣乱。他躲在一棵大松树上，待在巴斯特刚好够不着的地方，也扯开嗓门唱了起来。
        - id: ch01-b09
          speaker: chatterer_red_squirrel
          text: 熊巴斯特高又壮，牙齿尖来爪子长。纵有这般好模样，照样逃跑终日藏！
        - id: ch01-b10
          speaker: narrator
          text: 巴斯特这回可忍不下去了。一声又低沉又愤怒的咆哮从他喉咙里滚出来，听得喋喋身上一阵阵发抖。巴斯特随即攀住树干，猛然追了上去。喋喋吓得尖叫，掉头就往树顶蹿。直到这时，他才知道巴斯特原来也会爬树！
        - id: ch01-b11
          speaker: narrator
          text: 巴斯特爬树的本领其实高明得很，碰上这样粗壮的大树，爬起来更是拿手。他愤怒地吼着，一路朝喋喋逼近。
        - id: ch01-b12
          speaker: narrator
          text: 喋喋恨不得把刚才那些话全收回来。他为什么就不能闭紧嘴巴呢？他逃到了树梢最高处，怕得牙齿格格作响。再低头一瞧，巴斯特的大嘴正越逼越近。喋喋吓得身子一晃，差点掉下树去。
        - id: ch01-b13
          speaker: narrator
          text: 更糟的是，附近没有一棵树离得够近，他根本跳不过去。这一回，喋喋是真的遇上大麻烦了。偏偏还没有谁能来救他。
