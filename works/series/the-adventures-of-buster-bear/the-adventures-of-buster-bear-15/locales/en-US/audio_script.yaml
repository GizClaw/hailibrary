audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: skeptical and blunt
        timbre: dry and raspy
        pace: deliberate
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: noisy and gleefully teasing
        timbre: bright and sharp
        pace: brisk
        pitch: high
    chatterer_red_squirrel:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: impudent and quick-tongued
        timbre: small and chattery
        pace: rapid
        pitch: high
  chapters:
    - id: ch01
      title: Buster Bear Is a Fallen Hero
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A fallen hero is someone everybody once thought was very brave, until he proves he is not as brave as they believed. That was what happened to Buster Bear.
        - id: ch01-b02
          speaker: narrator
          text: Little Joe Otter had told everyone that Farmer Brown's boy ran away at the mere sight of one of Buster's huge footprints. At once, some of the Green Forest people made Buster their hero. Never before had anyone from the Green Forest made Farmer Brown's boy run away. They were proud of Buster, and they treated him with great respect.
        - id: ch01-b03
          speaker: narrator
          text: Then they saw Buster Bear meet Farmer Brown's boy face to face. The boy did run as fast as he could, but so did Buster. In fact, Buster ran even faster. He hid in the loneliest place he could find, deep in the Green Forest.
        - id: ch01-b04
          speaker: narrator
          text: It was hard to believe, but it was true. Right away, everyone lost much of their respect for Buster. That is often what happens when people find out a hero is less brave than they thought. They began saying unkind things about him among themselves. Some even said those things to his face, or made sure he could hear them.
        - id: ch01-b05
          speaker: narrator
          text: Blacky the Crow and Sammy Jay were the worst. They could fly, so Buster could not reach them, and they loved making others uncomfortable. They would search the Green Forest until they found him. Then, safe in the treetops, they would screech down at him.
        - id: ch01-b06
          speakers: [blacky_crow, sammy_jay]
          ensemble: duo
          text: Buster Bear is big and strong. His teeth are big, his claws are long. But even so, he runs away, and hides himself the whole long day!
        - id: ch01-b07
          speaker: narrator
          text: Buster heard that rhyme again and again, a dozen times a day. He ground his teeth and glared up at the two birds, but he could do nothing else. He could not get near them. All he could do was stand there and endure their teasing.
        - id: ch01-b08
          speaker: narrator
          text: Then impudent little Chatterer the Red Squirrel called out the same rhyme from a big pine tree, just beyond Buster's reach.
        - id: ch01-b09
          speaker: chatterer_red_squirrel
          text: Buster Bear is big and strong. His teeth are big, his claws are long. But even so, he runs away, and hides himself the whole long day!
        - id: ch01-b10
          speaker: narrator
          text: That was more than Buster could stand. He let out a deep, angry growl that sent little shivers through Chatterer. Then Buster suddenly began climbing the tree after him.
        - id: ch01-b11
          speaker: narrator
          text: Chatterer gave a frightened shriek and raced for the top. He had never known that Buster could climb. But Buster was a splendid climber, especially on a tree as big and sturdy as that pine. Up he came, growling angrily as he followed Chatterer.
        - id: ch01-b12
          speaker: narrator
          text: How Chatterer wished he had kept quiet! He scrambled to the very top, so frightened that his teeth chattered. When he looked down and saw Buster's great mouth coming closer and closer, he nearly fell from the tree in terror.
        - id: ch01-b13
          speaker: narrator
          text: Worst of all, no other tree stood close enough for Chatterer to jump into. This time, he truly was in trouble, and there was no one to help him.
