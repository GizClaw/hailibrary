audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏爽快，带着顽皮的笑意
        timbre: 清亮灵活
        pace: 偏快
        pitch: 中高音
    reddy_fox:
      display_name: 红狐狸雷迪
      tts:
        delivery: 狡猾自负，恼怒时尖刻凶狠
        timbre: 略显沙哑而锐利
        pace: 中等偏快
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 顽皮活泼，取笑别人时轻快大胆
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 老成温和，讲道理时沉着而略带幽默
        timbre: 低厚圆润
        pace: 缓慢从容
        pitch: 中低音
    blacky_the_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 警觉多疑，说话直截了当
        timbre: 粗亮而有穿透力
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第九章　小水獭乔有个天大的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小水獭乔兴奋得快要炸开了，简直没法让自己安静下来。他觉得，自从彼得兔头一回在绿森林发现熊巴斯特的脚印，就再没有比这更了不得的消息。不到万不得已，他连一分钟也不愿把它闷在肚子里，于是赶紧朝微笑池游去。
        - id: ch01-b02
          speaker: narrator
          text: 他知道水貂比利、麝鼠杰里、青蛙爷爷和斑点龟准在那里，也盼着能碰见几个住在绿森林里的小动物。果然，彼得兔正站在微笑池的一边，冲池塘另一边的红狐狸雷迪做鬼脸。当然啦，彼得这样做可一点儿也不好。红翼鸫夫妇也来了，乌鸦布莱基则坐在大山核桃树上。
        - id: ch01-b03
          speaker: narrator
          text: 小水獭乔径直游到大岩石旁，一口气爬上最高的地方。他满脸兴奋，两只眼睛闪闪发亮。大家一看他的模样，马上就知道一定发生了什么事。
        - id: ch01-b04
          speaker: billy_mink
          text: 嘿，快看小水獭乔！这回他准是终于聪明过熊巴斯特一回啦。
        - id: ch01-b05
          speaker: narrator
          text: 小乔好脾气地冲比利扮个鬼脸，又摇了摇头。
        - id: ch01-b06
          speaker: little_joe_otter
          text: 不对，比利，你完全猜错了。我看呀，谁也别想聪明过熊巴斯特。
        - id: ch01-b07
          speaker: narrator
          text: 雷迪翻起嘴唇，露出不怀好意的狞笑。
        - id: ch01-b08
          speaker: reddy_fox
          text: 别这么早下定论！我跟他还没完呢。
          emotion: angry
        - id: ch01-b09
          speaker: peter_rabbit
          text: 吹牛大王！吹牛大王！
        - id: ch01-b10
          speaker: narrator
          text: 雷迪隔着微笑池，狠狠瞪着彼得。
        - id: ch01-b11
          speaker: reddy_fox
          text: 彼得兔，我跟你也没完！总有一天，你会尝到厉害！
          emotion: angry
        - id: ch01-b12
          speaker: peter_rabbit
          text: 雷迪雷迪，狡猾又机灵，嗡嗡飞的小虫也捉不成！
        - id: ch01-b13
          speaker: narrator
          text: 彼得故意拿这首顺口溜取笑他。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 咕咚咕咚！那些事，我们早就知道了。现在大家想听的，是小水獭乔到底有什么话要说。
        - id: ch01-b15
          speaker: little_joe_otter
          text: 是消息，是个天大的消息！
        - id: ch01-b16
          speaker: grandfather_frog
          text: 先说出来，我们才知道它到底有多大。快说，是什么？
        - id: ch01-b17
          speaker: narrator
          text: 青蛙爷爷已经有些不耐烦了。小水獭乔慢慢环顾四周，看着那一张张急切的脸。可他偏要用最慢、最叫人着急的腔调，把话拖得长长的。
        - id: ch01-b18
          speaker: little_joe_otter
          text: 农夫布朗家的男孩，害怕熊巴斯特。
        - id: ch01-b19
          speaker: narrator
          text: 足足有一会儿，谁也没有说话。接着，乌鸦布莱基从大山核桃树的栖枝上俯下身，目不转睛地盯住小乔，这才开了口。
        - id: ch01-b20
          speaker: blacky_the_crow
          text: 我不信，连一个字也不信。农夫布朗家的男孩根本不怕绿森林、绿草地或微笑池里的任何人，你又不是不知道。明明是我们大家都怕他。
        - id: ch01-b21
          speaker: narrator
          text: 小乔也气呼呼地瞪着布莱基。
        - id: ch01-b22
          speaker: little_joe_otter
          text: 你爱信不信，我才不管。反正这事千真万确。
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: 于是，小乔把那天清早的事讲给大家听。他说，自己和熊巴斯特一起在欢笑溪捕鱼，农夫布朗家的男孩也在那里钓鱼。可男孩连一条鳟鱼也没钓到，因为在他赶到以前，鱼不是早被捉走，就是已经吓跑了。
        - id: ch01-b24
          speaker: narrator
          text: 小乔接着说，男孩后来在软泥里发现了熊巴斯特的脚印。他立刻收起钓竿，再也不钓了，转身就往家走。回去的一路上，他不停地朝身后张望，眼里始终带着害怕。
        - id: ch01-b25
          speaker: little_joe_otter
          text: 这下你们还敢说他不害怕吗？他总算知道了，他跑到我们住的地方东游西逛时，我们心里是什么滋味。这还不算天大的消息？现在，我们也能跟他把账算平啦！
        - id: ch01-b26
          speaker: blacky_the_crow
          text: 除非让我自己亲眼看见，否则我绝不会相信！
