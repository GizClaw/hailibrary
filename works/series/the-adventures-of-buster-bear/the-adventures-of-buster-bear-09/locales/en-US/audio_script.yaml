audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: lively and quick to react
        timbre: light and crisp
        pace: brisk
        pitch: medium-high
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: curious and lightly teasing
        timbre: bright and smooth
        pace: quick
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sharp and boastful
        timbre: wiry and nasal
        pace: quick
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: playful and boldly teasing
        timbre: youthful and bright
        pace: lively
        pitch: high
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: gruff and commanding
        timbre: deep and gravelly
        pace: slow
        pitch: low
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: skeptical and blunt
        timbre: dry and raspy
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Little Joe Otter Has Great News to Tell
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Joe Otter was nearly bursting with excitement. He could hardly contain himself. He felt he had the greatest news anyone had heard since Peter Rabbit first found Buster Bear's tracks in the Green Forest. Little Joe could not keep such news to himself for one minute longer than he had to.
        - id: ch01-b02
          speaker: narrator
          text: So he hurried to the Smiling Pool. He felt sure he would find Billy Mink, Jerry Muskrat, Grandfather Frog, and Spotty the Turtle there. He also hoped that some of the other little people from the Green Forest might be visiting.
        - id: ch01-b03
          speaker: narrator
          text: Sure enough, Peter Rabbit stood on one side of the pool, making faces at Reddy Fox on the other side. That was not nice of Peter, of course. Mr. and Mrs. Redwing were there too, while Blacky the Crow sat in the Big Hickory-tree.
        - id: ch01-b04
          speaker: narrator
          text: Little Joe swam straight to the Big Rock and climbed to its highest point. His eyes sparkled, and he looked so excited that everyone knew at once that something had happened.
        - id: ch01-b05
          speaker: billy_mink
          text: Hey, look at Little Joe! Maybe, for once, he has managed to outsmart Buster Bear!
        - id: ch01-b06
          speaker: narrator
          text: Little Joe made a good-natured face at Billy and shook his head.
        - id: ch01-b07
          speaker: little_joe_otter
          text: No, Billy. You've got it all wrong. I don't think anyone can outsmart Buster Bear.
        - id: ch01-b08
          speaker: narrator
          text: Reddy Fox pulled his lips back in an unpleasant grin.
        - id: ch01-b09
          speaker: reddy_fox
          text: You'd better not be so sure. I'm not finished with him yet.
          emotion: angry
        - id: ch01-b10
          speaker: peter_rabbit
          text: Boaster! Boaster!
        - id: ch01-b11
          speaker: narrator
          text: Reddy glared across the Smiling Pool at Peter.
        - id: ch01-b12
          speaker: reddy_fox
          text: I'm not finished with you either, Peter Rabbit. One of these days, you'll learn that for yourself!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Peter only taunted him with a rhyme.
        - id: ch01-b14
          speaker: peter_rabbit
          text: Reddy, Reddy, smart and sly, couldn't catch a buzzing fly!
        - id: ch01-b15
          speaker: grandfather_frog
          text: Chug-a-rum! We know all about that. What we want to hear is the news Little Joe came to tell.
        - id: ch01-b16
          speaker: little_joe_otter
          text: It is news, and it's wonderful news!
          emotion: happy
        - id: ch01-b17
          speaker: grandfather_frog
          text: We'll decide how wonderful it is after we hear it. Now, what happened?
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Little Joe looked around at all the eager faces. Then he spoke as slowly as he could, making everyone wait for every word.
        - id: ch01-b19
          speaker: little_joe_otter
          text: Farmer Brown's boy is afraid of Buster Bear.
        - id: ch01-b20
          speaker: narrator
          text: For a whole minute, no one said a word. Then Blacky leaned down from his perch in the Big Hickory-tree and stared very hard at Little Joe before he spoke.
        - id: ch01-b21
          speaker: blacky_crow
          text: I don't believe you. I don't believe a single word of it. Farmer Brown's boy isn't afraid of anyone in the Green Forest, on the Green Meadows, or in the Smiling Pool. You know that. Every one of us is afraid of him.
        - id: ch01-b22
          speaker: narrator
          text: Little Joe glared right back at Blacky.
        - id: ch01-b23
          speaker: little_joe_otter
          text: I don't care whether you believe me. It's true!
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: Then Little Joe told them what had happened early that morning. He and Buster Bear had been fishing together in the Laughing Brook. Farmer Brown's boy had been fishing there too, but he had not caught a single trout. By the time he arrived, the trout had either been caught or frightened away.
        - id: ch01-b25
          speaker: narrator
          text: Little Joe told them how the boy found one of Buster Bear's footprints in the soft mud. The boy stopped fishing at once and headed home. All the way, he kept looking behind him with fear in his eyes.
        - id: ch01-b26
          speaker: little_joe_otter
          text: Now try telling me he isn't afraid! For once, he knows how we feel when he prowls around our homes. Isn't that great news? Now we can get even with him!
          emotion: happy
        - id: ch01-b27
          speaker: blacky_crow
          text: I'll believe that when I see it for myself!
