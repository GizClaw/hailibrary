audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: easygoing and good-humored
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Buster Bear Has a Fine Time
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Buster Bear had never enjoyed himself so much since coming down from the Great Woods to live in the Green Forest. Just then, though, he was over in the Old Pasture. It lay right beside the Green Forest, so he had not gone far. And where do you think he had settled himself? In the middle of an enormous patch of blueberries, bigger and finer than any he had seen before.
        - id: ch01-b02
          speaker: narrator
          text: Give Buster all the berries he can eat, and he could hardly ask for more. Well, he might ask for honey. Nothing in the world is quite as good as honey to him. Still, berries are a very close second. He is not fussy about the kind, either. Raspberries, blackberries, blueberries—each one makes him happy.
        - id: ch01-b03
          speaker: buster_bear
          text: Mmm! My, my, these berries are good!
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: That came out in his deepest, grumbly-rumbly voice. Sitting back on his haunches, Buster pulled off berries as fast as he could. His small eyes sparkled with pleasure. Sometimes a leaf or an unripe berry slipped into his mouth with the big, ripe ones. Did he bother to pick it out? Oh, no! He chewed the whole mouthful together and happily patted his stomach.
        - id: ch01-b05
          speaker: narrator
          text: He had reached the pasture at daybreak, just as jolly, round, red Mr. Sun was getting out of bed. His plan was to leave again before the sun rose far into the blue, blue sky. For all his size and strength, Buster is shy. He does not want to run into Farmer Brown, Farmer Brown's boy, or any other two-legged creature called a man. Strange as it may sound, those creatures frighten him. Out in the pasture, he knew he might meet one much more easily than he would deep in the forest.
        - id: ch01-b06
          speaker: narrator
          text: That was why he meant to hurry. He would find some berries, eat what he could, and be back among the trees before Farmer Brown's boy was properly out of bed. Then he found this wonderful patch. Hunger drove every fear from his mind, along with everything else. The berries tasted far too good to leave. He ate and ate and ate.
        - id: ch01-b07
          speaker: narrator
          text: A fellow as big as Buster takes a lot of filling. On and on he ate, yet every bite only made him want another. Perhaps you know how that feels. Soon he was roaming from patch to patch all across the Old Pasture. The time never entered his thoughts. When you are having a good time, it can be the hardest thing in the world to remember.
        - id: ch01-b08
          speaker: narrator
          text: All the while, jolly, round, red Mr. Sun kept climbing through the blue, blue sky. He could see the whole Great World below him and everything going on in it. When he spotted Buster in the Old Pasture, enjoying himself so thoroughly, he smiled.
        - id: ch01-b09
          speaker: narrator
          text: But there was something else in that pasture, and seeing it made Mr. Sun smile wider still. Farmer Brown's boy was picking blueberries and dropping them into a big tin pail. He knew nothing about Buster being close by. Buster knew nothing about the boy being close by. And Mr. Sun had a feeling that if they happened to meet, something funny would follow.
        - id: ch01-b10
          speaker: buster_bear
          text: Mmm, mmm.
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: With his mouth still full, Buster shuffled toward the next patch. Then he stopped with a small gasp of surprise and delight. A shiny object sat directly ahead, full of the finest, biggest, bluest berries imaginable! Not a leaf was mixed in, and not one berry was green.
        - id: ch01-b12
          speaker: narrator
          text: His greedy little eyes blinked rapidly. He looked again to make sure. No, he was not dreaming. Here were real berries, ready for him to take. First he studied the shiny container carefully. It did not seem dangerous. One great paw reached out and nudged it. Over it went, and a heap of berries spilled onto the ground. There could be no doubt now. The thing was harmless.
        - id: ch01-b13
          speaker: narrator
          text: A soft sigh of perfect happiness came from Buster. He would finish every single berry, and after that, he would head home to the Green Forest.
