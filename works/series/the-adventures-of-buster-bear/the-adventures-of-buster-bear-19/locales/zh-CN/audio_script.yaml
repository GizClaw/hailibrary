audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 憨厚直率，满足时带着含混的咕哝
        timbre: 低沉浑厚
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十九章　熊巴斯特快活极了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 熊巴斯特离开大森林，住进绿森林以后，还从来没有像今天这样快活过。他这会儿虽然不在绿森林，却也没有走远。他来到了老牧场。老牧场有一边，正好挨着绿森林。
        - id: ch01-b02
          speaker: narrator
          text: 你猜巴斯特待在老牧场的什么地方？他正坐在一大片蓝莓中间。那片蓝莓又大又密，是他一辈子见过的最好的一片！
        - id: ch01-b03
          speaker: narrator
          text: 巴斯特最喜欢的，就是能放开肚皮吃浆果。当然，要是有蜂蜜，那又另当别论。在他心里，什么也比不上蜂蜜。不过，除了蜂蜜，就数浆果最好。他才不挑呢。覆盆子也好，黑莓也好，蓝莓也好，哪一种都能让他心满意足。
        - id: ch01-b04
          speaker: buster_bear
          text: 唔——唔——，哎呀呀，这些浆果可真好吃！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 巴斯特用低沉的、呼噜咕噜的嗓音嘟囔着。他一屁股坐在那里，贪心地把浆果一把把捋下来，两只小眼睛乐得直发亮。有时候，叶子和青浆果会混着又大又熟的浆果，一起进了他的嘴。他一点儿也不介意，更不会费事把它们挑出来，只管全部嚼下去，还快活得直拍肚皮。
        - id: ch01-b06
          speaker: narrator
          text: 巴斯特来到老牧场时，快活的、圆滚滚的红太阳先生才刚刚起床。他原本打定主意，要趁红太阳先生还没在蓝蓝的天空中爬得太高，赶紧回到绿森林。
        - id: ch01-b07
          speaker: narrator
          text: 别看巴斯特个头大，力气足，他其实非常胆小腼腆。他可不想遇见农夫布朗、农夫布朗的儿子，或是其他那些叫作“人”的两条腿生灵。说来有趣，巴斯特真的很怕他们。他总觉得，在老牧场里碰见人的机会，要比在绿森林深处大得多。
        - id: ch01-b08
          speaker: narrator
          text: 所以，巴斯特出发找浆果时，心里早就盘算好了。他要赶紧吃，能吃多少就吃多少，然后趁农夫布朗的儿子刚刚起床，马上回绿森林去。
        - id: ch01-b09
          speaker: narrator
          text: 可是，一找到那片浆果，他就把害怕和别的一切全忘了。巴斯特饿得厉害，浆果又实在太好吃。他忍不住吃了又吃，吃了还吃。你也知道，他是个大家伙，要填饱那么大的肚子，可得吃下不少东西。
        - id: ch01-b10
          speaker: narrator
          text: 巴斯特不停地吃，越吃反倒越想吃。那种滋味，你一定也明白。他就这样从一片浆果丛逛到另一片，一次也没有想起时辰。不知怎么，人只要过得快活，世上最难记住的偏偏就是时间。
        - id: ch01-b11
          speaker: narrator
          text: 快活的、圆滚滚的红太阳先生在蓝蓝的天空中越爬越高。他俯看整个大世界，把正在发生的一切都瞧得清清楚楚。他看见熊巴斯特在老牧场里吃得那么痛快，忍不住笑了。
        - id: ch01-b12
          speaker: narrator
          text: 接着，红太阳先生又看见了别的东西，嘴上的笑容更大了。农夫布朗的儿子也在老牧场里，正往一只大铁皮桶里装蓝莓。可他不知道熊巴斯特就在附近，熊巴斯特也不知道他就在附近。红太阳先生却觉得，要是他们碰巧遇上，准会发生一件好笑的事。
        - id: ch01-b13
          speaker: buster_bear
          text: 唔——唔——，唔——唔——。
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 巴斯特嘴里塞得满满的，一面嘟囔，一面走向另一片浆果丛。忽然，他又惊又喜，轻轻吸了一口气。就在面前，有个亮闪闪的东西。里面装得满满的，全是最好、最大、最蓝的蓝莓！没有一片叶子，也没有一颗青的。
        - id: ch01-b15
          speaker: narrator
          text: 巴斯特贪吃的小眼睛飞快地眨了好几下。他又看了一遍。没错，他不是在做梦，那些全是真的浆果，只管拿来吃就行。
        - id: ch01-b16
          speaker: narrator
          text: 他仔细打量着那个盛浆果的亮东西。看上去，它一点儿危险也没有。巴斯特伸出一只大爪子，轻轻推了推。那东西一下翻倒，许多浆果滚了出来。果然，它不会伤害他。
        - id: ch01-b17
          speaker: narrator
          text: 巴斯特幸福得轻轻叹了口气。他决定把这些浆果一颗不剩地吃掉，然后就回绿森林的家。
