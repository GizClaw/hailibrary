audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    chatterer_red_squirrel:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: quick and saucy, turning breathless when frightened
        timbre: bright and nimble
        pace: lively
        pitch: high
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: deep and forceful with a gruff playfulness
        timbre: heavy and rumbling
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Chatterer the Red Squirrel Jumps for His Life
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Chatterer the Red Squirrel does not often feel afraid. That is one reason he can be so impudent and saucy. Every now and then, though, a terrible fear takes hold of him. It happens when he knows Shadow the Weasel is hunting him, because Shadow can follow him anywhere. Nearly all the little people of the Green Forest and the Green Meadows feel fear sometimes. Chatterer feels it less often than most. He trusts himself to hide from danger or run away.
        - id: ch01-b02
          speaker: narrator
          text: But now Chatterer clung to a small branch near the top of a tall pine in the Green Forest. Below him, Buster Bear's big, sharp teeth came closer and closer. Deep, angry growls made Chatterer's hair stand on end, and he was too frightened to think.
        - id: ch01-b03
          speaker: narrator
          text: If only he had kept quiet instead of saying hateful things to Buster! If only he had known Buster could climb! If only he had picked a tree close enough to another tree for him to leap across! But Chatterer had said those hateful things. He had chosen a tree that stood all alone. And Buster Bear could climb. Chatterer was in terrible trouble, and he had no one to blame but himself. That is usually how it is when someone gets into trouble.
        - id: ch01-b04
          speaker: narrator
          text: Buster climbed nearer and nearer, and his voice grew deeper and angrier. Chatterer gave a frightened little gasp. He looked one way, then the other, but saw no escape. What should he do? What could he do? The ground seemed a terrible distance below. If only he had wings like Sammy Jay! But he did not have wings.
        - id: ch01-b05
          speaker: buster_bear
          text: Gr-r-r-r! I'll teach you some manners! You'll learn to respect your betters! I'll swallow you whole. That's what I'll do. Gr-r-r-r!
          emotion: angry
        - id: ch01-b06
          speaker: chatterer_red_squirrel
          text: Oh!
          emotion: fearful
        - id: ch01-b07
          speaker: buster_bear
          text: Gr-r-r-r! I'll eat every bit of you, right down to the last hair on your tail!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Buster scrambled a little closer.
        - id: ch01-b09
          speaker: chatterer_red_squirrel
          text: Oh! Oh!
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: Chatterer ran to the very tip of the little branch. If only he had known the truth! Buster could not reach him so high up, because the top of the tree was too small for such a big fellow. But Chatterer never thought of that. He looked once more at those great teeth below. Then he shut his eyes and jumped. He jumped straight out toward the ground, far below.
        - id: ch01-b11
          speaker: narrator
          text: It was a long, long, long way down to the ground. It certainly looked as if a little fellow like Chatterer must be killed by such a fall. But Old Mother Nature had taught him that she had given him certain things to help him at just such a time. One was the power to spread himself very flat, and that was exactly what he did.
        - id: ch01-b12
          speaker: narrator
          text: Chatterer stretched his arms and legs as far as they would go. With his body spread so flat, the air held him up a little. He did not fall as fast or strike as hard as he would have otherwise. His funny little tail helped too, the same tail he loved to jerk while he scolded. It kept him balanced and stopped him from tumbling over and over.
        - id: ch01-b13
          speaker: narrator
          text: Down, down, down Chatterer sailed, until he landed safely on his feet. He struck the ground pretty hard, of course, and for one second he completely lost his breath. But it was only one second. Then he raced away as fast as a frightened squirrel could go. Buster Bear watched him and grinned.
        - id: ch01-b14
          speaker: buster_bear
          text: I didn't catch him this time, but I reckon I frightened him well enough. And I taught him a lesson.
