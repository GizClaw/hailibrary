audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    chatterer_red_squirrel:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，得意时顽皮又大胆
        timbre: 细亮轻快
        pace: 急促
        pitch: 高音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十六章　红松鼠喋喋拼命一跳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红松鼠喋喋很少感到害怕，所以他才总是那么目中无人，说起话来也尖酸刻薄。不过，有时巨大的恐惧也会猛地抓住他。比如，知道黄鼠狼影子正在找他时，他就会害怕。因为喋喋心里明白，自己能去的地方，影子也都能去。绿森林和绿草地上的小动物差不多都有害怕的时候，喋喋却比谁都少。他太相信自己的本事了，总觉得遇见危险，藏也藏得住，逃也逃得掉。
        - id: ch01-b02
          speaker: narrator
          text: 可这一次，喋喋紧紧攀在绿森林里一棵高大松树近顶处的细枝上。下面，熊巴斯特锋利的大牙越来越近。耳边一声声低沉而愤怒的咆哮，吓得喋喋浑身的毛都竖了起来，脑子也不会转了。
        - id: ch01-b03
          speaker: narrator
          text: 他只盼自己刚才能闭紧嘴巴，没对巴斯特说那些可恨的话。也盼自己早知道巴斯特会爬树。要是当初选了一棵靠近别的树的松树，他现在还能跳过去逃命。偏偏他骂也骂了，选的树又孤零零地立着，巴斯特还真的会爬！喋喋闯下了最糟糕的祸，怪不了别人，只能怪自己。惹上麻烦的人，多半都是这样。
        - id: ch01-b04
          speaker: narrator
          text: 巴斯特越爬越近，吼声也越来越低沉，越来越愤怒。喋喋吓得倒吸一口气，慌忙朝两边张望，可哪里都没有出路。怎么办？到底还能怎么办？地面远得吓人。要是他有松鸦萨米那样的翅膀就好了，可他偏偏没有。
        - id: ch01-b05
          speaker: buster_bear
          text: 呜——吼——吼！今天我非得教会你什么叫规矩！看你以后还敢不敢对比你高明的人无礼！我要把你整个吞进肚子里！呜——吼——吼！
          emotion: angry
        - id: ch01-b06
          speaker: chatterer_red_squirrel
          text: 啊，我要没命了！
          emotion: fearful
        - id: ch01-b07
          speaker: buster_bear
          text: 呜——吼——吼！我要把你吃得干干净净，连尾巴上的最后一根毛都不剩！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 巴斯特说着，又往上攀近了一点。
        - id: ch01-b09
          speaker: chatterer_red_squirrel
          text: 啊，这下可怎么办！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 喋喋一口气跑到那根细枝的最末梢。他要是知道真相，就不会这么害怕了。树顶的枝干太细，根本承受不了巴斯特那样的大块头，巴斯特其实够不着他。可是喋喋哪里想得到这些？他又朝下面那些大牙看了一眼，随即闭紧双眼，纵身跳了出去。他竟然朝着远远的地面直落下去！
        - id: ch01-b11
          speaker: narrator
          text: 地面离他太远、太远、太远了。小小的喋喋从这么高的地方摔下去，看起来准会没命。幸好，大自然老妈妈早就教过他，她给了他几样应付这种危险的本领。其中一样，就是把身体尽量摊平。喋喋立刻照着做了。
        - id: ch01-b12
          speaker: narrator
          text: 他把四肢全都向外伸开。身体这么一摊，空气便稍稍托住了他，落下去的速度慢了些，撞到地面时也不会那么重。他那条滑稽的小尾巴也派上了用场。平时训斥别人，喋喋最爱甩动这条尾巴。现在，它帮他稳住身子，没有让他在空中翻来滚去。
        - id: ch01-b13
          speaker: narrator
          text: 喋喋向下飘啊，飘啊，飘啊，最后双脚着了地。当然，他撞得很重，有一瞬间完全喘不过气来。可也只有那么一瞬间。紧接着，他拼尽全力飞奔而去。受惊的松鼠能跑多快，他就跑多快。熊巴斯特望着他逃走，咧嘴笑了。
        - id: ch01-b14
          speaker: buster_bear
          text: 这次是没抓住他，不过他也该吓得够呛了。我还让他好好长了个记性。
