audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and energetic
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Farmer Brown's Boy Lunches on Berries
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When trouble comes, though it's not your fault, the best thing you can do is smile and say, "I'm mighty glad it isn't worse. It isn't so bad!"
        - id: ch01-b02
          speaker: narrator
          text: That was what Farmer Brown's boy said after Buster Bear ate the berries he had worked so hard to pick, then ran off with the pail. The boy was learning to be something of a philosopher. That means he was learning to accept bad luck cheerfully and notice right away how much worse it could have been.
        - id: ch01-b03
          speaker: narrator
          text: When he first heard someone in the bushes beside his hidden pail, he felt sure it was one of the cows or young cattle that spent the summer in the Old Pasture. He worried that the animal would foolishly kick the pail over and spill the berries. So he hurried back to chase it away. He never imagined that anyone might eat the berries.
        - id: ch01-b04
          speaker: narrator
          text: Then he shouted, and Buster Bear burst into sight, fighting to pull the pail off his head. Farmer Brown's boy was too frightened to move. But then Buster tore through the brush in even greater fear. The boy watched him race away, and his own courage began coming back at once.
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: If he's that scared of me, then I don't think I need to fear him. My berries are gone, but finding that out was worth it. There are lots more berries on the bushes. I only have to pick them. It could have been worse.
        - id: ch01-b06
          speaker: narrator
          text: He walked over to the spot where he had left the pail. Only then did he remember seeing Buster carry it away around his neck. The boy gave a funny little whistle of disappointment. Now he understood that even if he picked more berries, he had nothing to carry them in.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: This is worse than I thought! That bear has cost me the berry pie Mother promised me.
        - id: ch01-b08
          speaker: narrator
          text: Then he pictured how funny Buster had looked with the pail dangling around his neck, and he began to laugh. Since he was learning to be a philosopher, he tried once more to look on the bright side.
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: It could have been worse. Yes, it surely could. That bear might have tried to eat me instead of the berries! I'll eat the lunch I left by the spring, and then I'll head home. I can pick berries another day.
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy chuckled happily over Buster's terrible fright as he tramped back to the spring. Before racing off to save his berries, he had left two thick sandwiches on a flat stone.
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: Oh, those sandwiches are going to taste good! I'm glad they're so big and thick. I've never been this hungry in my life. Hello!
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: He cried out because the flat stone had come into view, and the sandwiches were gone. No, sir, not even one single crumb remained. While the boy was away, Old Man Coyote had found those two thick sandwiches and gobbled them up.
        - id: ch01-b13
          speaker: narrator
          text: Farmer Brown's boy knew nothing about Old Man Coyote. He rubbed his eyes and searched everywhere for the missing sandwiches. He even looked up into the trees, as though they might be hanging there. They had vanished completely, and Old Man Coyote had left no sign that he had visited. The boy stood with his mouth open, staring first one way and then another.
        - id: ch01-b14
          speaker: narrator
          text: Instead of getting angry, he slowly began to smile.
        - id: ch01-b15
          speaker: farmer_browns_boy
          text: I suppose somebody else was hungry, too. I wonder who it was. The Old Pasture doesn't seem to be the place for me today. I'll fill myself up with berries, and then I'll go home.
        - id: ch01-b16
          speaker: narrator
          text: So Farmer Brown's boy made his whole lunch out of blueberries. Then, feeling rather foolish about the day, he set off for home. He would have to tell about all the strange things that had happened to him in the Old Pasture. As he trudged along, he stopped two or three times and thoughtfully scratched his head.
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: I guess I'm not as smart as I thought. I still have a great deal to learn.
        - id: ch01-b18
          speaker: narrator
          text: And that is the end of Buster Bear's adventures in this book. Can you guess why? Old Mr. Toad insists that I write a book about his adventures. He is such a good friend to us all that I am going to do exactly that.
