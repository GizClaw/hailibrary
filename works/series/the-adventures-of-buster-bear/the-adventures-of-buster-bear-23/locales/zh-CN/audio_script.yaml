audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朝气十足，困惑时直率而略显急躁
        timbre: 清亮活泼的少年音
        pace: 轻快自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十三章　农夫布朗家的男孩拿浆果当午餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 事情再不如意，笑一笑总最要紧。笑着说声：“我真庆幸，还不算糟，没糟透顶！”
        - id: ch01-b02
          speaker: narrator
          text: 农夫布朗家的男孩发现，辛辛苦苦采来的浆果让熊巴斯特偷吃了，连桶也被带跑了。这时候，他说的正是这番话。
        - id: ch01-b03
          speaker: narrator
          text: 你瞧，他已经学着做一个颇有几分哲人气度的人了。遇上坏事，他也能高高兴兴地接受，还会马上想到，事情原本可能比眼下糟得多。
        - id: ch01-b04
          speaker: narrator
          text: 他刚听见藏浆果桶的灌木丛里有动静时，认准了那是夏天住在老牧场的一头母牛或一只小牛。他怕那个笨家伙踢翻桶，撒掉所有浆果，就急忙赶去撵它。他根本没想到，来的家伙会想吃浆果。
        - id: ch01-b05
          speaker: narrator
          text: 男孩大喊一声，熊巴斯特突然冒了出来，拼命想甩掉扣在头上的桶。男孩吓得一动也不敢动。可他接着看见，巴斯特撞开灌木逃走了，竟然比自己还害怕。他的胆气一点点回来了。
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: 他这么怕我，那我大概也不用怕他。浆果虽然丢了，可发现他怕我，也算值得。灌木上还有的是，我再采就行。事情本来可能更糟呢。
        - id: ch01-b07
          speaker: narrator
          text: 男孩走到原先放桶的地方，这才想起巴斯特逃跑时，把挂在脖子上的桶也带走了。他吹了一声又短又懊恼的口哨。就算再采浆果，现在也没有东西可装了。
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: 这可比我想的还糟。那头熊害我吃不成妈妈答应做的浆果派了。
        - id: ch01-b09
          speaker: narrator
          text: 可他一想起巴斯特脖子上套着桶的滑稽模样，又笑了起来。你知道的，他正学着做个哲人，于是又换了个想法。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: 事情本来可能更糟。真的，那头熊本可以不吃浆果，反倒来吃我。我去吃留在泉边的午饭吧，吃完就回家。浆果改天再采也不迟。
        - id: ch01-b11
          speaker: narrator
          text: 想到熊巴斯特吓得那么厉害，男孩一路快活地低声笑着，走回泉边。他去抢救浆果桶时，把两块厚厚的三明治留在了一块平石上。
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: 哎呀，那两块三明治一定香极了。幸亏做得又大又厚。我这辈子从没这么饿过。咦！
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 最后那声“咦”，他真的喊出了口。平石已经在眼前，本该放在那里的三明治却没了。是的，先生，两块厚三明治连一丁点儿碎屑也没剩下。
        - id: ch01-b14
          speaker: narrator
          text: 原来男孩离开以后，老郊狼发现了三明治，一口气全吞进了肚子。可男孩对老郊狼的事一无所知。
        - id: ch01-b15
          speaker: narrator
          text: 他揉揉眼睛，到处瞪着看，甚至抬头往树上找，仿佛三明治会挂在枝头。它们消失得干干净净，就像从来没有过。老郊狼也很仔细，半点痕迹都没留下。
        - id: ch01-b16
          speaker: narrator
          text: 男孩张着嘴，傻乎乎地看看这边，又看看那边。他不但没发火，那张长满雀斑的脸上反而慢慢有了笑容。
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: 看来还有别人也饿了。会是谁呢？今天这老牧场大概不适合我待。我拿浆果填饱肚子，就回家去。
        - id: ch01-b18
          speaker: narrator
          text: 于是，农夫布朗家的男孩吃了一顿蓝莓午餐。随后，他带着几分难为情踏上归途，准备把自己在老牧场遇见的种种怪事讲给家里人听。
        - id: ch01-b19
          speaker: narrator
          text: 一路拖着脚步走回去时，他有两三次停下来，若有所思地挠挠头。最后，他终于承认了一件事。
        - id: ch01-b20
          speaker: farmer_browns_boy
          text: 看来我没自己想的那么聪明，要学的东西还多着呢。
        - id: ch01-b21
          speaker: narrator
          text: 熊巴斯特在这本书里的历险，到这里就结束了。你猜为什么？因为蟾蜍老先生坚持要我写一本讲他历险的书。他是我们大家的好朋友，所以我打算照他说的办。
