audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    farmer_brown:
      display_name: 农夫布朗
      tts:
        delivery: 爽朗实在，说起话来胸有成竹
        timbre: 温暖浑厚
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十三章　农夫布朗家的男孩遇上熊巴斯特
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 假如你在林中走着走着，迎面碰见熊巴斯特，你会怎么办？可要说实话。要是我呀，一定拼命往远处跑。
        - id: ch01-b02
          speaker: narrator
          text: 农夫布朗家的男孩真遇见熊巴斯特时，就是这么做的。绿森林里许多小动物，还有几个从绿草地赶来的家伙，全都亲眼看见了。
        - id: ch01-b03
          speaker: narrator
          text: 事情要从男孩有一回去欢笑溪说起。他匆匆回到家，一条鱼也没带回来。他告诉大家，自己在绿森林深处的溪岸边见到了一个大脚印。那片地很泥泞，他认定留下脚印的是一头熊。可是大家听完都笑他，农夫布朗笑得尤其厉害。
        - id: ch01-b04
          speaker: farmer_brown
          text: 怎么可能？绿森林里好多好多年没来过熊了。打从我祖父还是个小男孩起，这儿就没有过熊。那可是很久、很久、很久以前的事。你想找熊先生，就得到大森林去。我不知道那个脚印是谁留下的，可绝不会是熊。依我看，是你凭空想出来的。
        - id: ch01-b05
          speaker: narrator
          text: 说完这些，农夫布朗又笑了好一阵。可这件事恰好说明，人很容易弄错。拿自己根本不了解的事来取笑别人，也实在很傻。熊巴斯特的确搬进了绿森林，男孩也的确看见了他的脚印。
        - id: ch01-b06
          speaker: narrator
          text: 只是父亲笑得太久，又取笑了他太多回，男孩后来也不免怀疑，也许真是自己看错了。所以，他听见乌鸦布莱基和松鸦萨米在林边闹得不可开交时，压根儿没想到熊巴斯特，只想过去瞧瞧出了什么事。
        - id: ch01-b07
          speaker: narrator
          text: 布莱基和萨米一看见男孩过来，就往绿森林深处又挪了一点，嘴里还在激动地尖声叫嚷。他们知道男孩会跟上，便想把他引到萨米早晨见过巴斯特的地方。这样一来，他们就能弄清小水獭乔的话是真是假。农夫布朗家的男孩，当真害怕熊巴斯特吗？
        - id: ch01-b08
          speaker: narrator
          text: 四周早已藏满了来看热闹的小动物。有的躲在树后，有的缩在树桩后，有的藏到浓密的枝叶底下，还有的待在树梢。一双双眼睛睁得溜圆，都等着看会发生什么。
        - id: ch01-b09
          speaker: narrator
          text: 他们怎么想，也想不出哪件事比眼前这一幕更刺激。大家一直以为，农夫布朗家的男孩谁也不怕，什么也不怕。小动物们大多很怕他，自然很难相信，哪怕巴斯特是个那么高大、那么强壮的家伙，也真能叫男孩害怕。他们一心盯着男孩，谁都没注意到，巴斯特正从另一个方向走来。
        - id: ch01-b10
          speaker: narrator
          text: 熊巴斯特走起路来轻得很。别看他个头那么大，脚步却能不发出一丁点儿声音。就这样，谁也没瞧见他，谁也没听见他。
        - id: ch01-b11
          speaker: narrator
          text: 农夫布朗家的男孩刚从一棵枝叶浓密的小铁杉这边迈出来，熊巴斯特恰好从同一棵小树的另一边走出来。一个男孩，一头大熊，就这么面对面站在了一起！
        - id: ch01-b12
          speaker: narrator
          text: 所有小动物都屏住了呼吸，连乌鸦布莱基和松鸦萨米也一样。有那么短短一会儿，整座绿森林静极了，连最轻微的声音都听不见。
        - id: ch01-b13
          speaker: narrator
          text: 接下来，会发生什么呢？
