audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: hearty and matter-of-fact
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Farmer Brown's Boy and Buster Bear Meet
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Suppose you met Buster Bear while you were walking through the woods. What would you do? Tell the truth now. I would run as fast as I could!
        - id: ch01-b02
          speaker: narrator
          text: That was exactly what Farmer Brown's boy did when he met Buster Bear. A great many little people from the Green Forest, along with some from the Green Meadows, saw it happen.
        - id: ch01-b03
          speaker: narrator
          text: It all began one day when the boy hurried home from the Laughing Brook without any fish. He said he had found a huge footprint in the mud beside the brook, deep in the Green Forest. He was sure a Bear had made it. But everyone laughed at him. Farmer Brown laughed harder than anyone.
        - id: ch01-b04
          speaker: farmer_brown
          text: Why, there hasn't been a Bear in the Green Forest for years and years! Not since my grandfather was a little boy, and that was a very long time ago. If you want to find Mr. Bear, you'll have to go all the way to the Great Woods. I don't know what left that footprint, but it couldn't have been a Bear. You must have imagined it.
        - id: ch01-b05
          speaker: narrator
          text: Then Farmer Brown laughed some more. But people can be wrong, especially when they laugh at something they know nothing about. Buster Bear really had moved into the Green Forest, and the boy really had seen his footprint.
        - id: ch01-b06
          speaker: narrator
          text: Still, Farmer Brown teased him so much that the boy finally began to wonder if he had been mistaken. Later, when he heard Blacky the Crow and Sammy Jay raising a terrible fuss near the edge of the forest, Buster Bear never entered his mind. He simply went over to find out what was happening.
        - id: ch01-b07
          speaker: narrator
          text: As soon as Blacky and Sammy saw him coming, they moved a little deeper into the Green Forest and kept screaming as excitedly as ever. They were sure he would follow. Their plan was to lead him to the place where Sammy had seen Buster that morning. Then they could discover whether Little Joe Otter had told the truth. Was Farmer Brown's boy really afraid of Buster Bear?
        - id: ch01-b08
          speaker: narrator
          text: Other little people were hiding everywhere. Some crouched behind trees and stumps. Some peered from under thick branches, and some watched from the treetops. Their round eyes opened wide as they waited to see what would happen.
        - id: ch01-b09
          speaker: narrator
          text: Nothing they could remember had ever been so exciting. They had come to believe that Farmer Brown's boy feared no one and nothing. Most of them were very afraid of him, so it was hard to imagine that even a great, big, strong fellow like Buster Bear could frighten him. They were all watching the boy so closely that no one noticed Buster coming from the other direction.
        - id: ch01-b10
          speaker: narrator
          text: Buster walked very softly. Though he was big, he could move without making the tiniest sound. So no one saw or heard him as Farmer Brown's boy stepped from behind one side of a thick little hemlock tree. At that very moment, Buster Bear stepped from behind the other side.
        - id: ch01-b11
          speaker: narrator
          text: There they stood, face to face!
        - id: ch01-b12
          speaker: narrator
          text: Everyone held their breath, even Blacky the Crow and Sammy Jay. For one short moment, the Green Forest was so still that not the slightest sound could be heard.
        - id: ch01-b13
          speaker: narrator
          text: What was going to happen?
