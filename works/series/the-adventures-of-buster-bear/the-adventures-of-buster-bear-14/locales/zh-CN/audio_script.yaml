audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朝气十足，困惑时直率而略显急躁
        timbre: 清亮活泼的少年音
        pace: 轻快自然
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    blacky_the_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 警觉多疑，说话直截了当
        timbre: 粗亮而有穿透力
        pace: 中等
        pitch: 中低音
    uncle_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 老练诙谐，乡音自然亲切
        timbre: 松弛微哑
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十四章　发生了一件意想不到的事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 乌鸦布莱基和松鸦萨米站在一棵大树的树梢，低头盯着下面，连气都不敢出。另一棵树上，灰松鼠快乐杰克和表弟红松鼠喋喋也屏住了呼吸。负鼠比利大叔从空心树里探出脑袋，浣熊博比透过藏身的空心树桩朝外看，红狐狸雷迪伏在一堆灌木枝后面，彼得兔则直挺挺地坐在茂密的铁杉枝下，眼睛睁得溜圆，耳朵竖得笔直。他们和其他能看见这一幕的小动物一样，全都屏住了呼吸。
        - id: ch01-b02
          speaker: narrator
          text: 这是绿森林里从没有过的紧张时刻。农夫布朗家的男孩刚从小铁杉这边迈出来，熊巴斯特正好从另一边走出来。他们谁也不知道对方就在附近。就这样，男孩和大熊面对面站了整整一分钟，彼此望着对方的眼睛。大家守在四周，一边看，一边等。仿佛整座绿森林都不敢喘气。
        - id: ch01-b03
          speaker: narrator
          text: 接着，事情终于发生了。是的，先生，真的发生了！农夫布朗家的男孩张开嘴，猛地放声大叫。
        - id: ch01-b04
          speaker: farmer_browns_boy
          text: 啊——！
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 这一声来得那么突然，声音又那么响亮，红松鼠喋喋吓得差点从树上掉下来，红狐狸雷迪也猛然跳起，随时准备逃跑。那一声绝不会听错，分明是吓出来的。男孩一边叫，一边转身朝家里飞奔。大家从来没见他跑得这样快。
        - id: ch01-b06
          speaker: narrator
          text: 彼得兔被雷迪追赶，必须抢先逃回亲爱的老荆棘丛时，也会这样没命地跑。那时彼得能跑多快，就跑多快，你也知道，那已经是他最快的速度了。男孩也一样。他中途绊倒了一回，可一眨眼就爬起来，继续往前冲。他一次也没回头，根本不看巴斯特有没有追来。这下谁也不能怀疑，他害怕了，而且怕得厉害。
        - id: ch01-b07
          speaker: narrator
          text: 小动物们全都探着身子，望着男孩跑远。小水獭乔兴奋得跳来跳去。
        - id: ch01-b08
          speaker: little_joe_otter
          text: 看见了吧？我怎么说的？我不是早就说过，他害怕熊巴斯特吗？
          emotion: happy
        - id: ch01-b09
          speaker: blacky_the_crow
          text: 小乔，你说得对！我真不该怀疑你。快瞧他跑呀！哇，哇，哇！
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: 接下来的一两分钟里，谁也没再想起熊巴斯特。忽然，身后传来一声巨响。大家赶紧转过头，朝另一个方向望去。
        - id: ch01-b11
          speaker: narrator
          text: 他们看见了什么呢？熊巴斯特竟然也在逃跑！他跑得比农夫布朗家的男孩还快一倍，一会儿撞上树干，一会儿冲破灌木丛，一会儿又跳过横在地上的倒木。几乎一眨眼的工夫，他就跑得没影了。绿森林里的小动物见过那么多事情，可没有一件比这更叫他们吃惊。
        - id: ch01-b12
          speaker: narrator
          text: 松鸦萨米看看乌鸦布莱基，布莱基看看红松鼠喋喋，喋喋又看看快乐杰克。快乐杰克望着彼得兔，彼得望着负鼠比利大叔，比利大叔望着浣熊博比。接下来，博比望向土拨鼠约翰尼，约翰尼望向红狐狸雷迪，雷迪望向臭鼬吉米，吉米望向水貂比利，最后，比利望向小水獭乔。整整一分钟，没有谁说得出话来。后来，小乔古怪地抽了一口气。
        - id: ch01-b13
          speaker: little_joe_otter
          text: 怎——怎么会！我看熊巴斯特也害怕了！
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: 负鼠比利大叔低声笑了起来。
        - id: ch01-b15
          speaker: uncle_billy_possum
          text: 俺看你这回又说对啦，水獭老弟。瞧着确实像是这么回事。熊老弟要是没被吓着，那准是忽然想起一件要紧事，正火急火燎地赶去料理呢。
        - id: ch01-b16
          speaker: narrator
          text: 这下，大家全都笑了起来。
