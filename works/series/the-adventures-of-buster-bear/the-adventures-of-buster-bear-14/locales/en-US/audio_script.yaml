  chapters:
    - id: ch01
      title: A Surprising Thing Happens
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: High in a tall tree, Blacky the Crow and Sammy Jay looked down and held their breath. In another tree, Happy Jack the Gray Squirrel and his cousin Chatterer the Red Squirrel did the same. Unc' Billy Possum poked his head from a hollow tree and held his breath too. Bobby Coon watched through a hole in the hollow stump where he was hiding. Reddy Fox lay flat behind a brush pile. Peter Rabbit sat straight up beneath a thick hemlock branch, his eyes and ears wide open. They all held their breath, along with every other little person who could see what was happening.
        - id: ch01-b02
          speaker: narrator
          text: This was the most exciting moment the Green Forest had ever known. Farmer Brown's boy had stepped from behind one side of a little hemlock tree at the very moment Buster Bear stepped from behind the other. Neither one had known the other was near. Now they stood face to face. For a whole minute, they stared into each other's eyes while everyone watched and waited. It felt as though the whole Green Forest were holding its breath.
        - id: ch01-b03
          speaker: narrator
          text: Then it happened. Yes, something really happened at last. Farmer Brown's boy opened his mouth and let out a sudden, enormous yell!
        - id: ch01-b04
          speaker: farmer_browns_boy
          text: Aaaah!
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: The yell came so suddenly and sounded so loud that Chatterer nearly tumbled from the tree. Reddy Fox sprang to his feet, ready to run. No one could mistake that cry. Farmer Brown's boy was frightened. As he yelled, he turned and raced for home faster than anyone had ever seen him run.
        - id: ch01-b06
          speaker: narrator
          text: He ran the way Peter Rabbit runs when he must reach the dear Old Briar-patch before Reddy Fox catches him. In other words, he ran as fast as he possibly could. Once he tripped and fell. In a flash, he scrambled up and rushed on. He never once looked back to see whether Buster Bear was chasing him. There could be no doubt about it. The boy was very, very afraid.
        - id: ch01-b07
          speaker: narrator
          text: Everyone leaned forward to watch him. Little Joe Otter danced about in excitement.
        - id: ch01-b08
          speaker: little_joe_otter
          text: See? I told you! Didn't I say Farmer Brown's boy was afraid of Buster Bear?
          emotion: happy
        - id: ch01-b09
          speaker: blacky_crow
          text: You were right, Little Joe! I shouldn't have doubted you. Just look at him run! Caw, caw, caw!
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: For a minute or two, everyone forgot all about Buster Bear. Then a tremendous crash made them whirl around and look the other way.
        - id: ch01-b11
          speaker: narrator
          text: And what do you suppose they saw? Buster Bear was running away too! In fact, he was going twice as fast as Farmer Brown's boy. He bumped against trees, smashed through bushes, and leaped over logs. Almost at once, he disappeared from sight. Of all the things the little people of the Green Forest had ever seen, this was surely the most surprising.
        - id: ch01-b12
          speaker: narrator
          text: Sammy Jay stared at Blacky the Crow. Blacky stared at Chatterer, and Chatterer at Happy Jack. Happy Jack looked at Peter Rabbit, Peter at Unc' Billy Possum, and Unc' Billy at Bobby Coon. Bobby looked at Johnny Chuck, Johnny at Reddy Fox, Reddy at Jimmy Skunk, and Jimmy at Billy Mink. At last, Billy looked at Little Joe Otter. For a whole minute, not one of them could speak. Then Little Joe made a funny little gasp.
        - id: ch01-b13
          speaker: little_joe_otter
          text: Why... why, I think Buster Bear is afraid too!
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: Unc' Billy Possum chuckled.
        - id: ch01-b15
          speaker: unc_billy_possum
          text: Ah believe yo' are right again, Brer Otter. It surely looks that way. If Brer Bear isn't scared, then he must have remembered something mighty important and hurried off to take care of it!
        - id: ch01-b16
          speaker: narrator
          text: Then everyone began to laugh.
