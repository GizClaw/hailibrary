audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and excitable
        timbre: bright and piercing
        pace: quick
        pitch: high
    blacky_the_crow:
      display_name: Blacky the Crow
      tts:
        delivery: loud and eager
        timbre: rough and ringing
        pace: brisk
        pitch: medium-low
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: gruff and expressive
        timbre: deep and furry
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Sammy Jay Makes Things Worse for Buster Bear
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: Thief, thief, thief! Thief, thief, thief!
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay screamed at the top of his lungs as he followed Buster Bear across the Old Pasture toward the Green Forest. He had never screamed so loudly, or sounded so excited. The little people of the Green Forest, the Green Meadows, and the Smiling Pool heard Sammy cry thief so often that they usually paid little attention. But that morning, every one of them stopped what he was doing and pricked up his ears.
        - id: ch01-b03
          speaker: narrator
          text: Sammy's cousin, Blacky the Crow, happened to be flying along the edge of the Old Pasture. The moment he heard Sammy, he turned to find out what was happening. Then he spotted Buster racing toward the Green Forest as fast as he could go, and he understood why Sammy was so excited.
        - id: ch01-b04
          speaker: narrator
          text: Blacky was so surprised that he almost forgot to flap his wings. Around Buster's neck hung something that looked very much like a tin pail. No wonder Sammy was making such a fuss! Blacky beat his wings hard and flew after him.
        - id: ch01-b05
          speaker: narrator
          text: That was how they reached the edge of the Green Forest. Buster ran with all his might. Sammy flew close behind him, still shouting.
        - id: ch01-b06
          speaker: sammy_jay
          text: Thief, thief, thief!
        - id: ch01-b07
          speaker: narrator
          text: Blacky hurried after Sammy and called as loudly as he could.
        - id: ch01-b08
          speaker: blacky_the_crow
          text: Caw, caw, caw! Everybody, come here! Come on! Come on!
        - id: ch01-b09
          speaker: narrator
          text: Poor Buster! He had already been frightened almost to death up in the Old Pasture. The pail had caught over his head just as Farmer Brown's boy yelled at him. Then its handle slipped around his neck, and he could not get it off. He had to carry the pail as he ran, which made everything worse.
        - id: ch01-b10
          speaker: narrator
          text: Now all his neighbors in the Green Forest would see the trouble he was in and laugh at him. That was more than Buster could bear. He felt humiliated, which means he felt ashamed. Yes, sir, Buster felt ashamed in front of his neighbors.
        - id: ch01-b11
          speaker: narrator
          text: More than anything, he wanted to be alone. Then no one could watch while he tried to get rid of that dreadful pail. But Buster was so big that finding a hiding place was not easy. Once he reached the Green Forest, he kept going until he came to its deepest, darkest, loneliest part. There he crawled beneath the thickest hemlock tree he could find.
        - id: ch01-b12
          speaker: narrator
          text: It did no good. Sammy and Blacky had sharp eyes, and they saw where Buster went. They flew straight into the tree above his hiding place and screamed and screamed.
        - id: ch01-b13
          speaker: narrator
          text: Before long, Ol' Mistah Buzzard came floating down from the blue, blue sky. He settled on a nearby dead tree where he could watch everything. The moment he saw the tin pail around Buster's neck, he began to grin.
        - id: ch01-b14
          speaker: narrator
          text: Then more birds arrived. Redtail the Hawk came, along with Scrapper the Kingbird, Redwing the Blackbird, Drummer the Woodpecker, Welcome Robin, Tommy Tit the Chickadee, Jenny Wren, Redeye the Vireo, and ever so many others.
        - id: ch01-b15
          speaker: narrator
          text: They came from the Old Orchard and the Green Meadows, and even from down by the Smiling Pool. Sammy and Blacky's voices carried a long way, and anyone who heard them hurried over, certain that something exciting must be happening.
        - id: ch01-b16
          speaker: narrator
          text: Soon Buster heard light footsteps. He peeked out and saw Billy Mink, Peter Rabbit, Jumper the Hare, Prickly Porky, Reddy Fox, and Jimmy Skunk. Even timid little Whitefoot the Wood Mouse had found a spot where he could watch without being seen. Of course, Chatterer the Red Squirrel and Happy Jack the Gray Squirrel were there too.
        - id: ch01-b17
          speaker: narrator
          text: They all sat in a great circle around Buster. Each one chose a place where he felt safe but could still see him. Every one of them laughed at Buster and made fun of him.
        - id: ch01-b18
          speaker: sammy_jay
          text: Thief, thief, thief!
        - id: ch01-b19
          speaker: narrator
          text: Sammy kept screaming until his throat was sore. Worst of all, Buster knew that everyone knew Sammy was telling the truth. That awful pail was the proof.
        - id: ch01-b20
          speaker: buster_bear
          text: I wish I'd never even thought about berries.
