audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 憨厚直率，满足时带着含混的咕哝
        timbre: 低沉浑厚
        pace: 稍慢
        pitch: 低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 爱管闲事又兴奋，叫喊时尖锐响亮
        timbre: 清脆尖亮
        pace: 明快急促
        pitch: 高音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 机灵好事，招呼同伴时响亮有力
        timbre: 粗哑洪亮
        pace: 中等偏快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十一章　松鸦萨米让熊巴斯特雪上加霜
      blocks:
        - id: ch01-b01
          speaker: sammy_jay
          text: 小偷！小偷！小偷！小偷！小偷！小偷！
        - id: ch01-b02
          speaker: narrator
          text: 熊巴斯特穿过老牧场，朝绿森林飞奔。松鸦萨米一路紧追，扯着嗓子尖叫。他从没叫得这么响，也从没显得这么激动。
        - id: ch01-b03
          speaker: narrator
          text: 绿森林、绿草地和微笑池的小居民们早就听惯萨米喊小偷，平常根本不当回事。可这天早晨，听见叫声的家伙全都放下手里的事，竖起耳朵听了起来。
        - id: ch01-b04
          speaker: narrator
          text: 萨米的表兄乌鸦布莱基正巧沿着老牧场边缘飞过。他一听见萨米的声音，马上转过身，飞来看看出了什么事。
        - id: ch01-b05
          speaker: narrator
          text: 布莱基看到巴斯特正拼命往绿森林跑，立刻明白萨米为什么那么激动了。他惊讶得差点忘了扇翅膀。巴斯特的脖子上，竟然挂着一只铁皮桶！这下难怪萨米会大叫。布莱基用力拍起翅膀，也追了上去。
        - id: ch01-b06
          speaker: narrator
          text: 他们一路到了绿森林边缘。巴斯特在前面没命地跑，萨米贴在后面飞，叫声一刻也不停。
        - id: ch01-b07
          speaker: sammy_jay
          text: 小偷！小偷！小偷！
        - id: ch01-b08
          speaker: narrator
          text: 乌鸦布莱基跟在更后面，一边使劲追，一边放开粗哑的大嗓门喊了起来。
        - id: ch01-b09
          speaker: blacky_crow
          text: 哇！哇！哇！大家快来呀！快来！快来！
        - id: ch01-b10
          speaker: narrator
          text: 可怜的巴斯特！刚才在老牧场上，铁皮桶套住他的脑袋，农夫布朗家的男孩又冲他大喊，已经把他吓得半死。后来，桶柄滑到脖子上，害他甩也甩不掉，只能挂着桶逃跑，事情就更糟了。
        - id: ch01-b11
          speaker: narrator
          text: 如今，绿森林里的邻居还要看见他这副狼狈样，围着他取笑，巴斯特实在受不了。他觉得丢脸极了。是的，先生，他觉得自己在邻居面前出了大丑。
        - id: ch01-b12
          speaker: narrator
          text: 他只想躲到一个谁也看不见的地方，独自想办法弄掉那只可怕的铁皮桶。可是巴斯特个头太大，哪有那么容易藏起来？他只好一直跑进绿森林最深、最暗、最僻静的地方，钻到能找到的最茂密的铁杉底下。
        - id: ch01-b13
          speaker: narrator
          text: 可这一点用也没有。萨米和布莱基眼睛尖，早就看见他了。他们竟然飞进巴斯特藏身的那棵树，在他的头顶拼命叫喊。
        - id: ch01-b14
          speaker: narrator
          text: 没过多久，老秃鹰先生从蓝蓝的天空中缓缓落下，停在一棵枯树上。那个位置正合适，周围的一切都看得见。他一瞧见巴斯特脖子上的铁皮桶，马上咧嘴笑了。
        - id: ch01-b15
          speaker: narrator
          text: 接着，红尾鹰、霸鹟斯克拉珀、红翼鸫雷德温、啄木鸟德拉默、知更鸟韦尔科姆、山雀汤米、鹪鹩珍妮、绿鹃雷德艾，还有许许多多别的鸟儿，也全都赶来了。
        - id: ch01-b16
          speaker: narrator
          text: 他们有的来自老果园，有的来自绿草地，甚至还有的从微笑池畔赶来。萨米和布莱基的叫声传得很远，大家一听，就知道准有热闹可看，于是急忙飞了过来。
        - id: ch01-b17
          speaker: narrator
          text: 不一会儿，巴斯特听见一阵轻轻的脚步声。他探头一看，水貂比利、彼得兔、野兔杰波、豪猪普里克利、红狐狸雷迪和臭鼬吉米也来了。
        - id: ch01-b18
          speaker: narrator
          text: 就连胆小的小白足林鼠，也躲在一个能看见大家、大家却看不见他的地方，悄悄往外瞧。红松鼠喋喋和灰松鼠快乐杰克当然也在场。
        - id: ch01-b19
          speaker: narrator
          text: 他们围着巴斯特坐成一个大圆圈。每个人都挑了个安全又看得清楚的地方。大家坐在那里笑个不停，全都拿巴斯特取乐。
        - id: ch01-b20
          speaker: sammy_jay
          text: 小偷！小偷！小偷！
        - id: ch01-b21
          speaker: narrator
          text: 萨米一直叫到嗓子都疼了。最糟的是，巴斯特心里明白，大家也都知道萨米说的是实话。那只可恶的铁皮桶就是证据。
        - id: ch01-b22
          speaker: buster_bear
          text: 真希望我从来没打过那些浆果的主意。
