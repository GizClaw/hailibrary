audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: good-natured and thoughtful, with bursts of force
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, teasing, and self-assured
        timbre: bright and piercing
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Buster Bear Has a Fit of Temper
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A temper is a bad, bad thing when once it gets away. There is nothing else quite like it for spoiling a pleasant day.
        - id: ch01-b02
          speaker: narrator
          text: Buster Bear was in a terrible temper. Yes, sir, this was the worst fit of temper anyone had ever seen in the Green Forest. And worst of all, his neighbors were there to watch. Animals had come from the Green Forest, the Green Meadows, and the Smiling Pool. Losing your temper when no one is near is bad enough. Letting it master you in front of everyone is a sorry sight indeed.
        - id: ch01-b03
          speaker: narrator
          text: Most of the time, Buster was one of the most good-natured people in the world. It took a lot to make him angry. Chatterer the Red Squirrel, Sammy Jay, and Reddy Fox all lost their tempers far more quickly. But once Buster's temper broke loose, everyone had better watch out.
        - id: ch01-b04
          speaker: narrator
          text: That day, Buster felt he had put up with more than enough. First came the fright in the Old Pasture. Then the pail slipped behind his ears and stuck fast, so he had to run all the way to the Green Forest with it hanging around his neck. He knew how ridiculous he must look, and the pail was terribly uncomfortable. Then Sammy Jay called everyone nearby to come and stare at him. To Buster, it seemed as though every creature from the forest, the meadows, and the Smiling Brook was sitting all around his hiding place, laughing at him. No self-respecting bear could bear any more.
        - id: ch01-b05
          speaker: narrator
          text: Buster burst from his hiding place with an angry roar. He charged one way, then another, roaring as loudly as he could. He looked terrifying. Everyone who could fly took to the air. Everyone who could climb scrambled upward. The swift runners fled. A few who could do none of those things hid nearby, trembling and hoping Buster would not find them. Almost at once, Buster was alone. At least, he could not see anyone.
        - id: ch01-b06
          speaker: narrator
          text: Then Buster turned all his anger on the tin pail. He swatted it and tugged at it, growling the whole time. He dropped to the ground and raked at it with his hind feet. At last, the handle snapped. Buster was free!
        - id: ch01-b07
          speaker: narrator
          text: He shook himself, then sprang upon the helpless pail. One blow from his great paw sent it clattering into a tree. He tried to bite it. Then he battered it back and forth until it lay completely flat. No one looking at it now could have guessed that it had ever been a pail.
        - id: ch01-b08
          speaker: narrator
          text: Only then did Buster's usual good nature return. He thought over everything that had happened. Little by little, shame showed on his face.
        - id: ch01-b09
          speaker: buster_bear
          text: I—I suppose that thing wasn't to blame. I should have known better than to stick my head inside it.
        - id: ch01-b10
          speaker: narrator
          text: Buster spoke slowly and thoughtfully.
        - id: ch01-b11
          speaker: sammy_jay
          text: You got exactly what you deserved for stealing Farmer Brown's boy's berries. You should know by now that stealing never leads to anything good.
        - id: ch01-b12
          speaker: narrator
          text: Sammy Jay had returned and was watching from the top of a tree. Buster looked up at him and grinned. His eyes began to twinkle.
        - id: ch01-b13
          speaker: buster_bear
          text: You would know all about that, Sammy Jay. I hope you never forget it.
        - id: ch01-b14
          speaker: sammy_jay
          text: Thief! Thief! Thief!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: Sammy screamed the words and flew away.
