audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 憨厚直率，满足时带着含混的咕哝
        timbre: 低沉浑厚
        pace: 稍慢
        pitch: 低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 爱管闲事又兴奋，叫喊时尖锐响亮
        timbre: 清脆尖亮
        pace: 明快急促
        pitch: 高音
  chapters:
    - id: ch01
      title: 第二十二章　熊巴斯特大发脾气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 脾气一旦撒开来，可真是糟糕透顶。任你日子多么快活，转眼也会败尽兴致。
        - id: ch01-b02
          speaker: narrator
          text: 熊巴斯特正在大发脾气。是的，先生，绿森林里从来没有谁像他这样发过这么大的脾气。
        - id: ch01-b03
          speaker: narrator
          text: 更糟的是，绿森林的邻居全来了，绿草地和微笑池也来了好大一群家伙，个个都看见了。独自发脾气，身边没人瞧见，已经够糟了。要是当着大家的面，让怒火完全管住自己，哎呀呀，那副样子可真难看。
        - id: ch01-b04
          speaker: narrator
          text: 平日里，巴斯特的脾气好极了，轻易不会动怒。他远不像红松鼠喋喋、松鸦萨米或红狐狸雷迪那样一点就着。
        - id: ch01-b05
          speaker: narrator
          text: 可他一旦发起火来，再也管不住自己，那可得小心了！巴斯特觉得，这一天受的罪早就到了极限，甚至还多出了一点。
        - id: ch01-b06
          speaker: narrator
          text: 他先是在老牧场受了一场惊吓。接着，铁皮桶又滑到耳朵后面，紧紧卡住，害他只能把桶挂在脖子上，一路跑回绿森林。
        - id: ch01-b07
          speaker: narrator
          text: 这已经够难受了。巴斯特心里明白，自己那副样子一定可笑极了，脖子上的桶也让他很不舒服。偏偏萨米还把附近所有人都叫来看他，这下他再也忍不住了。
        - id: ch01-b08
          speaker: narrator
          text: 巴斯特只觉得，住在绿森林、绿草地和微笑溪附近的家伙，全都围在藏身处外面，笑话他，拿他取乐。任何一只有自尊心的熊，都受不了这种事。
        - id: ch01-b09
          speaker: narrator
          text: 巴斯特怒吼一声，猛地冲了出去。他忽而冲向这边，忽而扑向那边，还使出浑身力气咆哮！那模样真是可怕极了。
        - id: ch01-b10
          speaker: narrator
          text: 会飞的，全飞走了。会爬树的，全爬上了树。腿脚快的，也全都跑了。
        - id: ch01-b11
          speaker: narrator
          text: 还有几个既不会飞、不会爬树、又跑不快的，只好躲起来，吓得浑身发抖，生怕让巴斯特找到。
        - id: ch01-b12
          speaker: narrator
          text: 一眨眼，巴斯特身边已经一个人也没有了。至少，他一个也看不见。
        - id: ch01-b13
          speaker: narrator
          text: 接着，他把满腔怒气全撒在铁皮桶上。他怒声低吼着，对那只桶又拍又扯，还躺到地上，用两只后脚狠狠抓挠。
        - id: ch01-b14
          speaker: narrator
          text: 终于，桶柄断了，巴斯特自由了！他抖抖身子，马上跳到那只毫无还手之力的桶上。
        - id: ch01-b15
          speaker: narrator
          text: 他挥起一只大巴掌，把桶打得当啷一声撞上树干，又张嘴去咬。随后，他继续把桶拍来打去，直到桶被砸得扁平。任谁也猜不出，那东西从前竟是一只桶。
        - id: ch01-b16
          speaker: narrator
          text: 直到这时，巴斯特才恢复了平日的好脾气。他把事情从头到尾想了一遍，脸上渐渐露出羞愧的神色。
        - id: ch01-b17
          speaker: buster_bear
          text: 我——我想，这不能怪那个东西。早知道我就不该把脑袋伸进去。
        - id: ch01-b18
          speaker: narrator
          text: 巴斯特说得很慢，像是在认真琢磨这件事。
        - id: ch01-b19
          speaker: narrator
          text: 松鸦萨米已经飞了回来，正站在一棵树梢上看着他。
        - id: ch01-b20
          speaker: sammy_jay
          text: 你偷了农夫布朗家男孩的浆果，落到这个下场也是活该。你早该知道，偷东西绝不会有好结果。
        - id: ch01-b21
          speaker: narrator
          text: 巴斯特抬起头，咧嘴笑了，眼里还闪着调皮的光。
        - id: ch01-b22
          speaker: buster_bear
          text: 这件事你最该明白，萨米。但愿你永远记得。
        - id: ch01-b23
          speaker: sammy_jay
          text: 小偷！小偷！小偷！
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: 萨米尖叫着飞走了。
