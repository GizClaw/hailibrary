audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朝气十足，困惑时直率而略显急躁
        timbre: 清亮活泼的少年音
        pace: 轻快自然
        pitch: 中高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 第七章　农夫布朗家的男孩倒霉透顶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 农夫布朗家的男孩迈着大步穿过绿森林，嘴里快活地吹着口哨。他心情轻松时总爱吹口哨，而去钓鱼的时候，他的心情一定轻松。他喜欢钓鱼，就像小水獭乔、水貂比利和熊巴斯特喜欢捕鱼一样。
        - id: ch01-b02
          speaker: narrator
          text: 这一天，他正赶往欢笑溪。他相信，只要顺着溪水一路钓到微笑池，回家时准能带回许多肥美的鳟鱼。欢笑溪里哪些水潭藏着鳟鱼，他全都知道。这样的早晨，鳟鱼也该饿了。想到这里，他的口哨吹得更欢了，听起来真叫人高兴。
        - id: ch01-b03
          speaker: narrator
          text: 到了第一个小水潭，他仔细装好鱼饵，又格外小心地藏好身子，生怕让潭里可能藏着的鳟鱼看见，这才下钩。要成为钓鱼好手，必须有足够的耐心，这个道理他早就懂。没有鱼马上上钩，他也不灰心，只是安安静静地等着哪条傻鳟鱼来咬钩。
        - id: ch01-b04
          speaker: narrator
          text: 他钓了又钓，等了又等。可是，别说有鱼上钩，就连鱼饵也没被轻轻碰一下。过了很久，他只好收起鱼钩，向下一个水潭走去。
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: 要么是鳟鱼没胃口了，要么是它们忽然全变聪明了。
        - id: ch01-b06
          speaker: narrator
          text: 到了下一个水潭，事情还是一样。他耐心地守着，真是非常、非常有耐心，却连最轻微的一下咬钩也没等到。他拖着脚步走向第三个水潭，长满雀斑的脸上皱起了眉。这种怪事从前可没发生过，他怎么也想不通。
        - id: ch01-b07
          speaker: narrator
          text: 昨天夜里，他满脑子想的都是今天要吃的煎鳟鱼，还梦见了那顿香喷喷的大餐。可要是再不赶紧钓到几条鱼，这顿丰盛的美餐就只能留在梦里了。
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: 要不是我知道没有别人来这里钓鱼，我真要以为今天一早有人来过了。他不是把鱼全钓光了，就是把鱼吓得都躲了起来。我还从来没这么倒霉过。咦，这是什么？
        - id: ch01-b09
          speaker: narrator
          text: 小水潭旁边的岸上，竟然摆着三颗鳟鱼头。他低头瞪着它们，眉头皱得更紧了。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: 果然有人来这里捉过鱼，而且他的运气比我好多了。
        - id: ch01-b11
          speaker: narrator
          text: 他望望欢笑溪的上游，又望望下游，再朝四面仔细找了一遍，可哪里都没有人。他捡起一颗小鱼头，放在眼前看了又看。
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: 这鱼头不是用刀切掉的，是被牙咬掉的！难道是水貂比利这个坏家伙，害我一条鱼也钓不到？
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 接下来，他一边沿着欢笑溪往下走，一边留神寻找水貂比利的踪迹。他又看见了两三颗鳟鱼头，却没找到别的痕迹，自己仍旧一条鱼也没钓到。他越想越糊涂。比利那么小，真能把所有的鱼都捉光或吓跑吗？他又怎么吃得下这么多？
        - id: ch01-b14
          speaker: narrator
          text: 何况，他从没见过比利这样乱丢鱼头。比利偶尔会捉到太多鱼，吃不完的时候，总会把剩下的藏起来。农夫布朗家的男孩越往下走，心里的疑团就越大，浑身也有种说不出的古怪感觉。
        - id: ch01-b15
          speaker: narrator
          text: 可他不知道，还有一件事会让他觉得更古怪。两个比他早到的捕鱼者，一直躲在暗处看着他，还在偷偷发笑。他们正是小水獭乔和熊巴斯特。
