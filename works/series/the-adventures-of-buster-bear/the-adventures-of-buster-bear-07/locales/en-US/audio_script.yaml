  chapters:
    - id: ch01
      title: Farmer Brown's Boy Has No Luck at All
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy tramped through the Green Forest, whistling merrily. He always whistled when he felt lighthearted, and a fishing trip always made him feel that way. He loved fishing every bit as much as Little Joe Otter, Billy Mink, or Buster Bear.
        - id: ch01-b02
          speaker: narrator
          text: That morning, he was heading for the Laughing Brook. He felt sure that by the time he followed it down to the Smiling Pool, he would have plenty of fine trout to take home. He knew every little pool where the trout liked to hide, and the morning seemed just right for hungry fish. So he kept on tramping and whistling, and his whistle was good to hear.
        - id: ch01-b03
          speaker: narrator
          text: At the first little pool, he baited his hook with great care. Then he made sure that no trout could see him and began to fish. Farmer Brown's boy had learned long ago that a good fisherman needs plenty of patience. When he did not get the quick bite he expected, he was not discouraged at all.
        - id: ch01-b04
          speaker: narrator
          text: He stayed very quiet and waited for some foolish trout to take the hook. He fished and fished, but not one trout gave him even the tiniest nibble. After a long while, he moved toward the next pool, muttering to himself.
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: Either those trout aren't hungry anymore, or they've gotten very clever.
        - id: ch01-b06
          speaker: narrator
          text: The same thing happened at the next pool. He waited patiently, then waited some more, but all that patience brought him nothing. There was not even the faintest nibble. When he trudged on again, a puzzled frown had settled over his freckled face. This had never happened before, and he could not understand it.
        - id: ch01-b07
          speaker: narrator
          text: All the night before, he had dreamed about the delicious fried trout he would eat for dinner. Now, unless he caught some fish very soon, that splendid dinner would stay nothing more than a dream.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: If I didn't know that no one else fishes here, I'd think somebody came this morning and caught every trout. Or maybe they scared the fish into hiding. I've never had such bad luck in my life. Hello! What's this?
        - id: ch01-b09
          speaker: narrator
          text: On the bank beside the next little pool lay the heads of three trout. Farmer Brown's boy stared down at them with a scowl. Now he was more puzzled than ever.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: Somebody has been fishing here, and they've had much better luck than I have.
        - id: ch01-b11
          speaker: narrator
          text: He looked up the Laughing Brook and down it. He looked this way and that, but he could not see anyone. Then he picked up one of the little heads and studied it closely.
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: This wasn't cut off with a knife. It was bitten off! I wonder if that scamp Billy Mink is the one who spoiled my fun.
        - id: ch01-b13
          speaker: narrator
          text: From then on, Farmer Brown's boy watched closely for any sign of Billy Mink. He found two or three more trout heads, but no other clue. Worse still, he caught no fish at all. The whole thing puzzled him more and more.
        - id: ch01-b14
          speaker: narrator
          text: Little Billy Mink could hardly have caught or frightened every trout, and surely he could not have eaten so many. Besides, Farmer Brown's boy had never known Billy to leave fish heads scattered around. Billy sometimes caught more fish than he could eat, but he usually hid the extra ones.
        - id: ch01-b15
          speaker: narrator
          text: The farther Farmer Brown's boy followed the Laughing Brook, the more puzzled he became. The mystery made him feel very queer. He would have felt queerer still if he had known that two fishermen who got there before him were watching the whole time and chuckling to themselves.
        - id: ch01-b16
          speaker: narrator
          text: Those two fishermen were Little Joe Otter and Buster Bear.
