audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏爽快，带着顽皮的笑意
        timbre: 清亮灵活
        pace: 偏快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 老成温和，讲道理时沉着而略带幽默
        timbre: 低厚圆润
        pace: 缓慢从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第五章　青蛙爷爷讲常理
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 再麻烦的事，只要按常理想一想，往往就容易解决了。谁要是懂得许多朴素的道理，别人就会把他当成很有智慧的人。邻居们不光敬重他，遇到事情，还总要跑来请他出主意。青蛙爷爷就是这样。大家都说他年纪很大，也很有智慧。其实，他只是很懂常理。不过，常理也正是最可贵的智慧。
        - id: ch01-b02
          speaker: narrator
          text: 小水獭乔这才明白，自己到底没能聪明过熊巴斯特。他原本想搅黄巴斯特在欢笑溪捉鱼的好事，叫他一条鱼也捉不到。没想到，他反而帮巴斯特省了力气，让人家想吃多少鱼就能捉到多少。小乔越想越气，气冲冲地一路去了微笑池。
        - id: ch01-b03
          speaker: narrator
          text: 水貂比利先留下来，把巴斯特放在岸上的肥鱼吃掉，然后也去了微笑池。
        - id: ch01-b04
          speaker: narrator
          text: 两个伙伴一到微笑池，就爬上大岩石。小乔坐在那里生气，生气，还是生气。青蛙爷爷终于问他到底怎么了。小乔不肯说，比利却把事情从头到尾讲了出来。说到巴斯特怎样聪明过了小乔，比利觉得实在太好笑。虽然他忍了又忍，最后还是笑出了声。青蛙爷爷跟着笑起来，一直在旁边听着的麝鼠杰里也笑了。
        - id: ch01-b05
          speaker: narrator
          text: 这一下，小乔比刚才更生气了。他把熊巴斯特骂了一顿，又冲着水貂比利、青蛙爷爷和麝鼠杰里说了许多难听的话。谁叫他们都在笑巴斯特聪明呢。
        - id: ch01-b06
          speaker: little_joe_otter
          text: 他就是个仗着个头大欺负人的恶霸，还是个小偷！
          emotion: angry
        - id: ch01-b07
          speaker: grandfather_frog
          text: 咕咚呱！他也许真会欺负别人。个头特别大的家伙，确实很容易这样。我虽然没见过熊巴斯特，可听了那些传闻，猜也猜得出他有多大。不过，你说他是小偷，我可不明白。
        - id: ch01-b08
          speaker: little_joe_otter
          text: 他捉了我的鱼，还把鱼吃了！这还不算小偷吗？
          emotion: angry
        - id: ch01-b09
          speaker: billy_mink
          text: 那些鱼算你的，跟算我的一样没道理。
        - id: ch01-b10
          speaker: little_joe_otter
          text: 那好，就说是我们的鱼！这样你总满意了吧？他偷了我们的鱼，所以他照样是小偷，对不对？
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 青蛙爷爷抬起头，看了看又圆又亮、笑呵呵的太阳先生，又慢慢眨了一下自己那只鼓鼓的大眼睛。
        - id: ch01-b12
          speaker: grandfather_frog
          text: 瞧，一只傻绿蝇飞过来了。它是谁的？
        - id: ch01-b13
          speaker: little_joe_otter
          text: 谁的也不是！傻绿蝇跟我的……我是说，跟我们的鱼有什么关系？
          emotion: angry
        - id: ch01-b14
          speaker: grandfather_frog
          text: 没有关系，一点儿也没有。我只是希望它飞近一点，让我一口吞掉。等我捉到它，它才是我的。只要我没捉到，它就不属于谁。照你的说法，熊巴斯特要是碰巧经过，把它捉走了，那不就成了偷我的东西吗？
        - id: ch01-b15
          speaker: little_joe_otter
          text: 当然不是！这想法也太蠢了！您真是年纪越大越糊涂。
          emotion: angry
        - id: ch01-b16
          speaker: grandfather_frog
          text: 那么，你告诉我，你们还没捉到的鱼，跟我还没捉到的傻绿蝇，到底有什么不同？
        - id: ch01-b17
          speaker: narrator
          text: 这一下，小乔一句话也答不上来。
        - id: ch01-b18
          speaker: grandfather_frog
          text: 小水獭乔，听我一句劝。碰上比你高大、比你强壮、又比你聪明的家伙，最好跟他做朋友。以后你就会明白，这么做才合算。
