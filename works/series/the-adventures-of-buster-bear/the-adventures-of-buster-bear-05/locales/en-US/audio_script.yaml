  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: lively and quick to react
        timbre: light and crisp
        pace: brisk
        pitch: medium-high
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: playful and mischievous
        timbre: smooth and bright
        pace: quick
        pitch: medium-high
