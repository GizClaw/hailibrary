  chapters:
    - id: ch01
      title: Grandfather Frog's Common-Sense
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Nothing smooths out trouble quite like common sense. People with plenty of plain common sense are often thought very wise. Their neighbors respect them, look up to them, and keep coming to them for advice.
        - id: ch01-b02
          speaker: narrator
          text: That is how everyone feels about Grandfather Frog. He is very old, and his neighbors say he is very wise. The truth is, he simply has a great deal of common sense. And after all, that may be the best kind of wisdom there is.
        - id: ch01-b03
          speaker: narrator
          text: Little Joe Otter had tried to spoil Buster Bear's fishing in the Laughing Brook. But Buster had been too smart for him. Instead of making things harder, Little Joe had made it easier for Buster to catch all the fish he wanted. When Little Joe realized that, he stormed off toward the Smiling Pool in a terrible rage.
        - id: ch01-b04
          speaker: narrator
          text: Billy Mink stayed just long enough to eat the fat fish Buster had left on the bank. Then Billy headed for the Smiling Pool too.
        - id: ch01-b05
          speaker: narrator
          text: At the Smiling Pool, Little Joe and Billy climbed onto the Big Rock. Little Joe sat there and sulked. He sulked and sulked until Grandfather Frog finally asked what was wrong. Little Joe refused to say, so Billy told the whole story.
        - id: ch01-b06
          speaker: narrator
          text: When Billy reached the part about Buster being too smart for Little Joe, he could not help laughing. Grandfather Frog laughed too. So did Jerry Muskrat, who had been listening nearby.
        - id: ch01-b07
          speaker: narrator
          text: Their laughter made Little Joe angrier than ever. He said all sorts of unkind things about Buster Bear. Then he said unkind things about Billy Mink, Grandfather Frog, and Jerry Muskrat, just because they had laughed at how Buster had outsmarted him.
        - id: ch01-b08
          speaker: little_joe_otter
          text: All Buster ever does is push others around and take what isn't his!
          emotion: angry
        - id: ch01-b09
          speaker: grandfather_frog
          text: Chug-a-rum! He may be a bully. Very big people often are, and from everything I've heard, Buster Bear must be big enough. But I don't see what makes him a thief.
        - id: ch01-b10
          speaker: little_joe_otter
          text: He took the fish I was after and ate them! How can you say that isn't stealing?
          emotion: angry
        - id: ch01-b11
          speaker: billy_mink
          text: You didn't own those fish. I had just as much claim to them as you did.
        - id: ch01-b12
          speaker: little_joe_otter
          text: All right, they were ours! Is that better? Buster took them from both of us, so he's still a thief!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Grandfather Frog looked up at jolly, round, bright Mr. Sun. Slowly, he winked one of his great, goggly eyes.
        - id: ch01-b14
          speaker: grandfather_frog
          text: Here comes a foolish green fly. Who does that fly belong to?
        - id: ch01-b15
          speaker: little_joe_otter
          text: It doesn't belong to anyone! But why are you talking about green flies when we're talking about my fish? Our fish, I mean!
          emotion: angry
        - id: ch01-b16
          speaker: grandfather_frog
          text: Nothing at all. I was only hoping the fly would come close enough for me to snap him up. Then he would belong to me. Until I catch him, he doesn't belong to anyone. But I suppose if Buster Bear came by and caught him, Little Joe would say Buster had stolen him from me.
        - id: ch01-b17
          speaker: little_joe_otter
          text: No, of course not! That's ridiculous. Maybe old age is making you foolish.
        - id: ch01-b18
          speaker: grandfather_frog
          text: Then tell me this. What is the difference between fish you haven't caught and green flies I haven't caught?
        - id: ch01-b19
          speaker: narrator
          text: Little Joe could not think of a single word to say.
        - id: ch01-b20
          speaker: grandfather_frog
          text: Take my advice, Little Joe Otter. Always make friends with those who are bigger, stronger, and smarter than you. You'll find that it pays.
