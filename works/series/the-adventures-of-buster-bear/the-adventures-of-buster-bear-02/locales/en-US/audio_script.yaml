  chapters:
    - id: ch01
      title: Little Joe Otter Gets Even with Buster Bear
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Joe Otter was in a terrible rage. That was a bad way to begin such a beautiful day, and he knew it. Still, who could blame him for being angry when his breakfast was taken just as he was ready to eat? At least, that was how Little Joe told the story to Billy Mink. He may not have told it exactly as it happened, but he had been badly frightened at the time.
        - id: ch01-b02
          speaker: little_joe_otter
          text: I was sitting beside one of the little pools on the bank of the Laughing Brook. I had caught a fat trout, and I was just about to eat it. Then that great big bully Buster Bear came along! He took my trout and ate it as though it were his own. I hate him! Someday, I'm going to get even with him!
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: That was not a kind thing to say, and Little Joe was not feeling kind at all. His temper could be very short, especially when he was hungry. And that morning, he had eaten no breakfast.
        - id: ch01-b04
          speaker: narrator
          text: Buster had not really taken the fish away from Little Joe. But to Little Joe, it came to the same thing. When Buster invited him to come back for the trout, Buster knew perfectly well that Little Joe would never dare.
        - id: ch01-b05
          speaker: billy_mink
          text: Where is Buster now?
        - id: ch01-b06
          speaker: little_joe_otter
          text: He's somewhere farther up the Laughing Brook. I hope he falls in and drowns!
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: Billy Mink could not help laughing. The thought of huge Buster Bear drowning in the Laughing Brook was much too funny. Nowhere in the brook was the water deep enough, except at the Smiling Pool. That was out on the Green Meadows, and no one had ever known Buster to go there.
        - id: ch01-b08
          speaker: billy_mink
          text: Come on. Let's find out what he's doing.
        - id: ch01-b09
          speaker: narrator
          text: At first, Little Joe wanted no part of that. But before long, his curiosity became stronger than his fear, and he agreed to go. The two little scamps in brown coats made their way down the Laughing Brook, taking great care to stay out of sight. They had not gone far when Billy stopped and whispered.
        - id: ch01-b10
          speaker: billy_mink
          text: Shh! There he is.
        - id: ch01-b11
          speaker: narrator
          text: Sure enough, Buster Bear sat close beside a little pool. He was staring hard into the water.
        - id: ch01-b12
          speaker: little_joe_otter
          text: What is he doing? He hasn't moved for the longest time.
        - id: ch01-b13
          speaker: narrator
          text: Just then, one of Buster's big paws flashed into the pool. He scooped out a trout that had wandered too close.
        - id: ch01-b14
          speaker: billy_mink
          text: Why, he's catching fish!
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: That was exactly what Buster was doing, and anyone could see that he was having great fun. After eating the trout, he moved on toward the next little pool.
        - id: ch01-b16
          speaker: little_joe_otter
          text: Those fish belong to us! He has no right to catch them!
          emotion: angry
        - id: ch01-b17
          speaker: billy_mink
          text: But how can we make him stop?
        - id: ch01-b18
          speaker: little_joe_otter
          text: I know how! I'll chase the fish out of every little pool and stir up all the mud. Then let's see how many fish he catches. Watch me pay Buster Bear back!
        - id: ch01-b19
          speaker: narrator
          text: The idea had popped into Little Joe's head all at once. He slipped quickly into the water and swam straight to the pool Buster would try next. Little Joe frightened the fish, and they darted away in every direction.
        - id: ch01-b20
          speaker: narrator
          text: Then he churned up the mud until the clear little pool was cloudy from bank to bank. The water grew so dirty that Buster could not have seen a fish right under his nose. Little Joe did the same thing in the next pool, and then in the one after that.
        - id: ch01-b21
          speaker: narrator
          text: Buster Bear's fishing was over for that day.
