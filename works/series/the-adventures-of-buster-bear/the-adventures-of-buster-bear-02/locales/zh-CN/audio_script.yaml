audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏爽快，带着顽皮的笑意
        timbre: 清亮灵活
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二章　小水獭乔找熊巴斯特算账
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一天明明很美好，小水獭乔却一早就气坏了。他也知道，这可不是个好开头。可早餐刚要入口就叫人夺走，换成谁不会生气呢？小乔对水貂比利就是这么说的。他讲的也许不完全是实情，不过那时候，他的确吓得不轻。
        - id: ch01-b02
          speaker: little_joe_otter
          text: 我当时就在欢笑溪岸边，坐在一个小水潭旁边。我刚捉到一条肥鳟鱼，正要吃，那个又大又坏的熊巴斯特就来了。他抢走我的鱼，吃得像那条鱼本来就是他的！我恨他！这笔账，我早晚要跟他算！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 这种话当然不好听，小乔心里的念头也一点儿不好。可他有时就是脾气急，肚子饿的时候尤其如此。别忘了，这一回，他偏偏连早餐也没吃上。
        - id: ch01-b04
          speaker: narrator
          text: 其实，巴斯特并没有真的从小乔手里抢走鳟鱼。可是照小乔的想法看，那跟硬抢没什么分别。巴斯特叫他回来取鱼时，明明知道他根本不敢做这种事。
        - id: ch01-b05
          speaker: billy_mink
          text: 那他现在在哪儿？
        - id: ch01-b06
          speaker: little_joe_otter
          text: 还在欢笑溪上游什么地方。真希望他掉进水里淹死！
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 比利一听，实在憋不住，笑了起来。大块头熊巴斯特会淹死在欢笑溪里？光是想想就太好笑了。整条溪中，只有下游的微笑池有足够深的水。可微笑池在绿草地上，从来没人见巴斯特去过那里。
        - id: ch01-b08
          speaker: billy_mink
          text: 咱们去瞧瞧，看他在干什么。
        - id: ch01-b09
          speaker: narrator
          text: 小乔起初说什么也不肯去，最后却还是好奇胜过了害怕。他终于答应了。两个披着棕褐色皮毛的小淘气便沿欢笑溪往下游走，一路藏好身子，万分小心，不让谁看见。他们没走多远，比利就压低了声音。
        - id: ch01-b10
          speaker: billy_mink
          text: 嘘！他在那儿。
        - id: ch01-b11
          speaker: narrator
          text: 果然，熊巴斯特就坐在一个小水潭旁边，眼睛一眨不眨地盯着水里。他坐了好半天，始终一动不动。
        - id: ch01-b12
          speaker: little_joe_otter
          text: 他到底在干什么？
        - id: ch01-b13
          speaker: narrator
          text: 话音刚落，巴斯特的一只大爪子闪电般探进水里，把一条游得太近的鳟鱼捞了出来。
        - id: ch01-b14
          speaker: billy_mink
          text: 他在钓鱼！
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: 没错，巴斯特就是在钓鱼，而且钓得开心极了。他吃完刚捉到的鳟鱼，又朝下一个小水潭走去。
        - id: ch01-b16
          speaker: little_joe_otter
          text: 那些鱼是我们的！他凭什么捉我们的鱼！
          emotion: angry
        - id: ch01-b17
          speaker: billy_mink
          text: 可我想不出有什么办法能拦住他。
        - id: ch01-b18
          speaker: narrator
          text: 就在这时，一个主意忽然跳进了小乔的脑袋。
        - id: ch01-b19
          speaker: little_joe_otter
          text: 我有办法！我要赶走每个小水潭里的鱼，再把水全搅浑。到时候，看他还能捉到几条！你等着瞧，我这就跟熊巴斯特算账去。
        - id: ch01-b20
          speaker: narrator
          text: 小乔飞快地滑进水里，径直游向巴斯特接下来要去的那个小水潭。潭里的鱼受了惊，顿时四散逃开。小乔又搅起潭底的泥，把水弄得浑浊不堪。现在，就算一条鱼待在巴斯特鼻子底下，他也别想看见。
        - id: ch01-b21
          speaker: narrator
          text: 接着，小乔又赶到下一个水潭，再下一个水潭。每到一处，他都赶散鱼群，把潭水搅浑。熊巴斯特这一天的鱼，就这样再也钓不成了。
