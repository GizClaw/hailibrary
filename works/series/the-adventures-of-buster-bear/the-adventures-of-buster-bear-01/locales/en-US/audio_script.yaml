audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: easygoing and good-humored
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and noisy
        timbre: bright and piercing
        pace: quick
        pitch: high
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: lively and quick to react
        timbre: light and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Buster Bear Goes Fishing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Early one morning, Buster Bear lay on his comfortable bed of leaves and yawned. He watched the first sunbeams slip through the Green Forest and chase away the Black Shadows. Then he yawned again, slowly stood up, and gave himself a shake.
        - id: ch01-b02
          speaker: narrator
          text: Buster walked to a big pine tree. He stood on his hind legs, reached as high as he could, and scratched the bark with his great claws. Then he gave such a huge yawn that his jaws seemed ready to crack. At last, he sat down to decide what he wanted for breakfast.
        - id: ch01-b03
          speaker: narrator
          text: As he thought about what might taste best, Buster listened to the Green Forest waking up. Far away, he heard Sammy Jay screaming.
        - id: ch01-b04
          speaker: sammy_jay
          text: Thief! Thief!
        - id: ch01-b05
          speaker: narrator
          text: Buster grinned.
        - id: ch01-b06
          speaker: buster_bear
          text: I wonder if somebody stole Sammy's breakfast, or if Sammy stole somebody else's. I suppose Sammy is the thief.
        - id: ch01-b07
          speaker: narrator
          text: Chatterer the Red Squirrel was scolding as fast as his tongue could go. He was getting himself terribly worked up.
        - id: ch01-b08
          speaker: buster_bear
          text: Chatterer must have gotten out of bed the wrong way this morning.
        - id: ch01-b09
          speaker: narrator
          text: Blacky the Crow was cawing at the top of his lungs. From the sound of it, Buster knew Blacky was up to some kind of mischief. He also heard the sweet voices of happy little singers, and he liked hearing them.
        - id: ch01-b10
          speaker: narrator
          text: But one sound caught Buster's attention most of all. It was a merry, low, silvery laugh that went on and on until he felt like laughing too. That was the voice of the Laughing Brook. As Buster listened, he suddenly knew exactly what he wanted for breakfast. In his deep, grumbly-rumbly voice, he announced his plan to no one in particular.
        - id: ch01-b11
          speaker: buster_bear
          text: I'm going fishing. Yes, sir, that's what I'll do. I want some fat trout for breakfast.
        - id: ch01-b12
          speaker: narrator
          text: Buster shuffled over to the Laughing Brook and headed straight for a little pool he knew. As he came close, he took great care not to make even the tiniest sound.
        - id: ch01-b13
          speaker: narrator
          text: But even at that early hour, another fisherman had reached the pool first. And who do you think it was? Little Joe Otter, of course. He had already caught a fine, fat trout and was climbing up the bank with the fish in his mouth.
        - id: ch01-b14
          speaker: narrator
          text: The sight of that trout made Buster's mouth water. Little Joe sat down on the bank, ready to enjoy his breakfast. He had not seen Buster and had no idea that anyone else was nearby.
        - id: ch01-b15
          speaker: narrator
          text: Very softly, Buster tiptoed forward until he stood right behind Little Joe.
        - id: ch01-b16
          speaker: buster_bear
          text: Woof, woof! That trout looks mighty fine. I wouldn't mind having it myself.
        - id: ch01-b17
          speaker: narrator
          text: Little Joe gave a frightened squeal. Without even turning to see who had spoken, he dropped the trout and dived headfirst into the Laughing Brook. Buster sprang forward and caught the fat trout with one big paw just before it slipped back into the water.
        - id: ch01-b18
          speaker: buster_bear
          text: Here's your trout, Mr. Otter. Come on out and get it.
        - id: ch01-b19
          speaker: narrator
          text: Little Joe had poked his head above the water to see who had frightened him. But he would not come out. The truth was, he was afraid. Instead, he snarled at Buster and called him every bad name he could think of.
        - id: ch01-b20
          speaker: little_joe_otter
          text: You thief! You're terrible! You're bad, bad, bad!
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: Buster did not seem bothered at all. He chuckled as though the whole thing were a wonderful joke, then invited Little Joe once more to come and take his fish. Little Joe only turned his back and swam away down the Laughing Brook in a terrible rage.
        - id: ch01-b22
          speaker: buster_bear
          text: It would be a shame to waste such a fine fish. What should I do with it?
        - id: ch01-b23
          speaker: narrator
          text: While Buster was wondering, he ate the whole trout. Then he started down the Laughing Brook to catch some fish for himself.
