audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 憨厚笃定，说话时带一点自得
        timbre: 浑厚而略带呼噜声
        pace: 稍慢
        pitch: 低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 尖锐响亮，警觉而爱嚷嚷
        timbre: 清亮尖细
        pace: 快
        pitch: 高音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一章　熊巴斯特去钓鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 清晨，第一缕阳光钻进绿森林，慢慢赶走黑影子。熊巴斯特舒舒服服地躺在树叶床上，看着阳光，张嘴打了个哈欠。过了一会儿，他又打一个，这才慢吞吞地爬起来，把全身抖了抖。
        - id: ch01-b02
          speaker: narrator
          text: 巴斯特走到一棵大松树前，用两条后腿站直，尽力往高处伸，再用大爪子抓了抓树皮。抓完以后，他又打了个大哈欠，嘴巴张得像是连下巴都要裂开了。随后，他坐下来想，今天早餐该吃什么呢？
        - id: ch01-b03
          speaker: narrator
          text: 他一时拿不定主意，就听起了四周的动静。绿森林里的小居民一个接一个醒来，到处都是新一天的声音。很远的地方，松鸦萨米忽然尖声嚷了起来。
        - id: ch01-b04
          speaker: sammy_jay
          text: 有小偷！有小偷！
        - id: ch01-b05
          speaker: narrator
          text: 巴斯特咧嘴笑了。他心里猜着，不知道是别人偷了萨米的早餐，还是萨米偷了别人的早餐。
        - id: ch01-b06
          speaker: buster_bear
          text: 我看呀，那个小偷多半就是萨米自己。
        - id: ch01-b07
          speaker: narrator
          text: 红松鼠喋喋也醒了。他的舌头飞快，数落起来没完没了，还把自己气得火冒三丈。巴斯特听了一阵，觉得喋喋今天准是一早起来就处处不顺心。
        - id: ch01-b08
          speaker: narrator
          text: 接着，乌鸦黑黑扯开嗓门呱呱大叫。巴斯特一听就知道，黑黑又在捣鬼。林子里的小歌手们也唱起来了，那些甜美的歌声听着真舒服。可最吸引巴斯特的，是一阵轻轻的、银铃似的笑声。
        - id: ch01-b09
          speaker: narrator
          text: 那笑声一直响个不停，笑呀，笑呀，听得巴斯特也想跟着笑。原来，那是欢笑溪在歌唱。巴斯特听着溪水的声音，忽然拿定了主意。
        - id: ch01-b10
          speaker: buster_bear
          text: 我要去钓鱼。对，就这么办！早餐我要吃几条肥鳟鱼。
        - id: ch01-b11
          speaker: narrator
          text: 巴斯特拖着脚步来到欢笑溪，径直走向一个熟悉的小水潭。快到水边时，他放轻脚步，小心得一点儿声音也没有。他起得已经够早了，可水潭边竟然有人比他先到，还捉住了一条肥美的鳟鱼。
        - id: ch01-b12
          speaker: narrator
          text: 那位钓鱼人正是小水獭乔。他叼着鳟鱼爬上岸，在水边坐好，准备享用早餐。巴斯特一看见那条鱼，口水都快流出来了。小乔却没发现他，也不知道附近还有别人。
        - id: ch01-b13
          speaker: narrator
          text: 巴斯特踮起脚尖，悄悄走到小乔背后，然后用最深沉、最响亮的呼噜嗓音开了口。
        - id: ch01-b14
          speaker: buster_bear
          text: 呜，呜！这条鳟鱼可真肥。要是让我拿来吃，我当然不会反对。
        - id: ch01-b15
          speaker: narrator
          text: 小乔吓得尖叫起来。他连头都没回，也没看看是谁在说话，就扔下鳟鱼，一头扎进欢笑溪。鱼正要滑回水里，巴斯特猛地扑过去，伸出一只大爪子，把它接了个正着。
        - id: ch01-b16
          speaker: narrator
          text: 小乔从水里露出脑袋，想看看刚才是谁吓了他。巴斯特便招呼他过去。
        - id: ch01-b17
          speaker: buster_bear
          text: 水獭先生，你的鳟鱼在我这里呢。过来拿吧。
        - id: ch01-b18
          speaker: narrator
          text: 小乔不肯过去。其实，他根本不敢过去。他朝巴斯特龇牙怒吼，骂巴斯特是小偷，还把能想到的坏话全骂了一遍。
        - id: ch01-b19
          speaker: little_joe_otter
          text: 你这个偷鱼的小偷！你真是个坏家伙！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 巴斯特毫不在意，反倒咯咯直笑，觉得这件事有趣极了。他又请小乔来拿鱼。小乔却背过身去，气冲冲地顺着欢笑溪游走了。
        - id: ch01-b21
          speaker: buster_bear
          text: 这么好的一条鱼，要是白白糟蹋了，多可惜呀。我到底该拿它怎么办呢？
        - id: ch01-b22
          speaker: narrator
          text: 巴斯特嘴上还在琢磨，已经把整条鳟鱼吃得干干净净。吃完以后，他沿着欢笑溪继续往下走，打算亲自再捉几条鱼。
