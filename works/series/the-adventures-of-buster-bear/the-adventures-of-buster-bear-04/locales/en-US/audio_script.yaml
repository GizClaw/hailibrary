audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: easygoing and good-humored
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: lively and quick to react
        timbre: light and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Little Joe Otter Supplies Buster Bear with a Breakfast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Getting even just for spite doesn't always pay. In fact, it can turn around and work against you.
        - id: ch01-b02
          speaker: narrator
          text: That is how Little Joe Otter happened to give Buster Bear the best breakfast he'd had in a long time. Did Little Joe mean to feed him? Oh, my, no! All along, Little Joe thought he was stopping Buster from getting any breakfast at all.
        - id: ch01-b03
          speaker: narrator
          text: Little Joe didn't know Buster well enough yet. Buster was every bit as clever as he was, and perhaps a little cleverer. But Little Joe was feeling spiteful and selfish. He and Billy Mink had enjoyed the Laughing Brook all to themselves for so long that they believed no one else had any right to fish there.
        - id: ch01-b04
          speaker: narrator
          text: Bobby Coon sometimes caught a few small fish there, but they didn't mind him. Farmer Brown's boy came fishing too, and that made Little Joe and Billy very angry. Still, they were too afraid of him to interfere. Buster was different. When they learned that he could fish, they decided something had to be done. Or at least, Little Joe did.
        - id: ch01-b05
          speaker: little_joe_otter
          text: He'll come back tomorrow morning. I'll watch for him, and the moment he shows up, I'll chase away every fish, just like I did today. That ought to teach him to stay away from our fish.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Before daylight the next morning, Little Joe hid near the little pool where Buster had frightened him. Sure enough, as the Jolly Sunbeams began creeping through the Green Forest, Buster came straight toward the pool.
        - id: ch01-b07
          speaker: narrator
          text: Little Joe slipped into the water and drove every fish out. Then he churned up the mud until the water was so cloudy that no one could see the bottom. He hurried down to the next pool and did the same thing there.
        - id: ch01-b08
          speaker: narrator
          text: But Buster Bear was very smart indeed. He had guessed the day before that Little Joe was the one who spoiled his fishing. This time, he came only close enough for Little Joe to spot him. Buster felt sure the otter would be watching.
        - id: ch01-b09
          speaker: narrator
          text: Then Buster turned away from the pool and hurried far down the Laughing Brook. He found a place where the water barely covered his feet. There he sat and chuckled to himself.
        - id: ch01-b10
          speaker: narrator
          text: Everything went just as Buster expected. Little Joe chased the frightened fish from the pools above. With the otter behind them and nowhere else to go, they swam downstream toward Buster.
        - id: ch01-b11
          speaker: narrator
          text: When the fish reached the shallow water, Buster only had to scoop them onto the bank. What fun he had! It didn't take him long to catch all the fish he could eat. Then he set aside one fine, fat trout and waited.
        - id: ch01-b12
          speaker: narrator
          text: After a while, Little Joe Otter came along, chuckling because he thought he had spoiled Buster's fishing. He kept looking back to see whether Buster was following. He never noticed Buster waiting ahead until the bear spoke.
        - id: ch01-b13
          speaker: buster_bear
          text: Thank you kindly for the fine breakfast. I saved this fat trout for you, to make up for the one I ate yesterday. I hope we can go fishing together often.
        - id: ch01-b14
          speaker: narrator
          text: Buster spoke in his deepest, most grumbly-rumbly voice. Then he went away laughing so hard that he could hardly stop.
        - id: ch01-b15
          speaker: narrator
          text: Little Joe couldn't think of a single word to say. He was so surprised and angry that he went off alone to sulk.
        - id: ch01-b16
          speaker: narrator
          text: Billy Mink had watched it all. He ate the fat trout.
