audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 机灵敏捷，受惊或生气时急促有力
        timbre: 年轻明亮
        pace: 偏快
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏爽快，带着顽皮的笑意
        timbre: 清亮灵活
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第四章　小水獭乔给熊巴斯特送来早餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 只为赌气去报复，往往不值得。说不定到头来，反倒帮了别个。
        - id: ch01-b02
          speaker: narrator
          text: 事情偏偏就是这样。小水獭乔竟让熊巴斯特吃上了很久以来最丰盛的一顿早餐。当然，他一点儿也不想请巴斯特吃早餐。他还一直以为，自己正设法让巴斯特饿肚子呢。
        - id: ch01-b03
          speaker: narrator
          text: 小乔和巴斯特还不大熟。他不知道，巴斯特跟自己一样聪明，说不定还要聪明一点。这一回，说到底都是赌气和自私惹出的麻烦。小乔和水貂比利独占欢笑溪的鱼太久了，觉得谁也不该来这里捉鱼。浣熊博比偶尔捉走几条小鱼，他们并不在意。农夫布朗家的男孩有时也来钓鱼，那倒总会把他们气坏。可他们太怕那个男孩，什么也不敢做。
        - id: ch01-b04
          speaker: narrator
          text: 等他们发现熊巴斯特也会捉鱼，就觉得非拦住他不可。至少，小乔是这么想的。
        - id: ch01-b05
          speaker: little_joe_otter
          text: 他明天早晨准会再来。我就在这里守着，一见他过来，马上把鱼全赶走，就像今天这样。这样总能给他一个教训，叫他别再碰我们的鱼！
        - id: ch01-b06
          speaker: narrator
          text: 第二天一早，天还没亮，小乔就藏在那个小水潭附近。昨天，巴斯特正是在那里把他吓得够呛。快乐的阳光才悄悄钻进绿森林，他果然看见巴斯特直奔小水潭而来。小乔立刻溜进水里，把鱼全赶出水潭，又把潭底的泥巴搅起来。水一下变得浑浊不堪，连潭底都看不见了。接着，他赶到下一个小水潭，又照样来了一遍。
        - id: ch01-b07
          speaker: narrator
          text: 可熊巴斯特聪明得很。他前一天就猜到了，是谁坏了自己捉鱼的好事。这天早晨，他只往前走到一个刚刚好的地方。要是小乔在监视他，就一定能看见他来了。巴斯特早料到小乔会躲在那里。
        - id: ch01-b08
          speaker: narrator
          text: 随后，巴斯特没有再往小水潭走。他赶到欢笑溪下游很远的一处浅滩，那里的水刚刚没过脚面。他坐下来，一个人咯咯地笑。接下来的事，跟他料想的一点不差。小乔从上游水潭里赶出来的鱼受了惊，只好顺着欢笑溪往下游游。小乔在后面追，它们根本没有别的路可走。
        - id: ch01-b09
          speaker: narrator
          text: 鱼群一游到巴斯特守着的地方，他伸爪一捞，就能把鱼甩上岸。多好玩啊！没过多久，他便捉够了自己能吃下的鱼。巴斯特还特意留下一条肥美的鳟鱼，然后坐在那里等候。
        - id: ch01-b10
          speaker: narrator
          text: 又过了一会儿，小水獭乔来了。他想起自己害得巴斯特捉不成鱼，忍不住暗暗发笑。他一路只顾着回头，想看看巴斯特有没有追上来。直到巴斯特开口，他才发现对方早就在这里等着自己了。
        - id: ch01-b11
          speaker: buster_bear
          text: 真要谢谢你，请我吃了这么丰盛的一顿早餐。我给你留了一条肥鳟鱼，正好补上昨天被我吃掉的那条。以后咱们可要常常一起捉鱼啊！
        - id: ch01-b12
          speaker: narrator
          text: 巴斯特用自己最低沉、最粗隆隆的声音说完，便一路大笑着走了，笑得怎么也停不下来。小乔一个字也说不出。他又吃惊又生气，只好独自跑到一边生闷气。水貂比利一直在旁边看着。最后，那条肥鳟鱼进了比利的肚子。
