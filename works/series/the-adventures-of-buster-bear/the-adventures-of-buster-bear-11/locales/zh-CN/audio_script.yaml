audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    blacky_the_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 警觉多疑，说话直截了当
        timbre: 粗亮而有穿透力
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十一章　乌鸦布莱基说出他的计划
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 布莱基爱做梦，布莱基爱计谋。他的嗓门响当当，事情只要不顺当，布莱基就会哇哇嚷！
        - id: ch01-b02
          speaker: narrator
          text: 这话一点也不假。乌鸦布莱基一天到晚都在做梦、想计谋，而且十有八九想的是恶作剧。绿草地和绿森林的动物都知道，他是大家当中最聪明、最机灵的几个之一。
        - id: ch01-b03
          speaker: narrator
          text: 布莱基就爱热闹，总盼着有事情发生。事情越惊险，他越高兴。这样，他那副粗哑的大嗓门就能派上用场了。那嗓门一扯开，可真叫响！
        - id: ch01-b04
          speaker: narrator
          text: 这会儿，布莱基坐在微笑池边的大山核桃树梢上，低头看着聚在下面的动物们，心里快活极了。他觉得自己非常重要，而布莱基最喜欢的，正是这种受人重视的滋味。
        - id: ch01-b05
          speaker: narrator
          text: 大家都是应他的邀请来的。他们要听听布莱基的计划，亲眼弄清楚农夫布朗家的男孩到底怕不怕熊巴斯特。
        - id: ch01-b06
          speaker: narrator
          text: 微笑池的大岩石上，坐着小水獭乔、水貂比利和麝鼠杰里。青蛙爷爷坐在一片宽大的绿荷叶上，斑点龟坐在另一片荷叶上。
        - id: ch01-b07
          speaker: narrator
          text: 池子这边的岸上，有彼得兔、野兔杰波、草地鼠丹尼、土拨鼠约翰尼、臭鼬吉米、负鼠比利大叔、花栗鼠条纹和蟾蜍老先生。另一边有红狐狸雷迪、獾迪格和浣熊博比。树上还坐着红松鼠喋喋、灰松鼠快乐杰克和松鸦萨米。
        - id: ch01-b08
          speaker: narrator
          text: 布莱基等了一会儿，确信不会再有人来，便使劲清了清嗓子，开始讲话。
        - id: ch01-b09
          speaker: blacky_the_crow
          text: 朋友们，请听我说。
        - id: ch01-b10
          speaker: narrator
          text: 大家全咧嘴笑了。布莱基耍过太多鬼把戏，谁也不能算他真正的朋友。也许松鸦萨米除外，这个同样爱恶作剧的家伙正是他的表兄。不过谁也没出声，布莱基就继续往下说。
        - id: ch01-b11
          speaker: blacky_the_crow
          text: 小水獭乔跟我们讲过，那天他看见农夫布朗家的男孩在欢笑溪边发现了熊巴斯特的脚印，便急急忙忙赶回家。那男孩一路不停地回头看，好像很害怕。
        - id: ch01-b12
          speaker: blacky_the_crow
          text: 他可能真的怕了，也可能没有。说不定他当时心里想着别的事。你们信了小乔讲的话，就把熊巴斯特当成了英雄。我并不是不信，可我得亲眼看到那男孩逃走，才能确定他真的怕熊巴斯特。
        - id: ch01-b13
          speaker: blacky_the_crow
          text: 现在听听我的计划。明天一大早，松鸦萨米和我会在绿森林边上闹出很大的动静。农夫布朗家的男孩好奇心那么重，肯定会跑来看看发生了什么。
        - id: ch01-b14
          speaker: blacky_the_crow
          text: 接着，我们会把他引到熊巴斯特那里。要是他转身就逃，我会第一个承认，熊巴斯特确实像你们有些人说的那样，是个了不起的英雄。
        - id: ch01-b15
          speaker: blacky_the_crow
          text: 这个办法很简单。你们都藏在能看见事情经过的地方，就可以亲眼判断小水獭乔说得对不对。你们觉得怎么样？
        - id: ch01-b16
          speaker: narrator
          text: 大家马上七嘴八舌地议论起来。计划这么简单，所有动物都赞成。事情听起来又那么刺激，大家也都答应到场。
        - id: ch01-b17
          speaker: narrator
          text: 只有青蛙爷爷和斑点龟不打算去，他们不愿离开微笑池那么远。就这样，大家说定了。第二天早晨，布莱基就要试一试他的计划。
