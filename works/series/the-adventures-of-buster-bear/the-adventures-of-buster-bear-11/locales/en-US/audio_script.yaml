audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: skeptical and blunt
        timbre: dry and raspy
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Blacky the Crow Tells His Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Blacky is a dreamer! Blacky is a schemer! His voice is strong. When things go wrong, Blacky is a screamer!
        - id: ch01-b02
          speaker: narrator
          text: It is true. Blacky the Crow is always dreaming up plans, and nearly every plan has some mischief in it. He is one of the smartest little people in the Green Meadows and the Green Forest. Everyone knows it. Blacky loves excitement. He wants something to be happening, and the more exciting it is, the happier he is. Then he gets to use that harsh voice of his. And how he uses it!
        - id: ch01-b03
          speaker: narrator
          text: That day, Blacky sat at the top of the Big Hickory-tree beside the Smiling Pool. He looked down at all the little people gathered below, and he felt very happy. Most of all, he felt important. Blacky dearly loves that feeling. Everyone had come because he had invited them to hear his plan. He meant to find out whether Farmer Brown's boy was truly afraid of Buster Bear.
        - id: ch01-b04
          speaker: narrator
          text: Little Joe Otter, Billy Mink, and Jerry Muskrat sat on the Big Rock in the Smiling Pool. Grandfather Frog rested on his big green lily pad, and Spotty the Turtle sat on another one.
        - id: ch01-b05
          speaker: narrator
          text: On one bank stood Peter Rabbit, Jumper the Hare, Danny Meadow Mouse, Johnny Chuck, Jimmy Skunk, Unc' Billy Possum, Striped Chipmunk, and Old Mr. Toad. Across the pool were Reddy Fox, Digger the Badger, and Bobby Coon. Up in the Big Hickory-tree sat Chatterer the Red Squirrel, Happy Jack the Gray Squirrel, and Sammy Jay.
        - id: ch01-b06
          speaker: narrator
          text: Blacky waited until he was certain no one else was coming. Then he cleared his throat as loudly as he could and began.
        - id: ch01-b07
          speaker: blacky_crow
          text: Friends, we are here to settle a question.
        - id: ch01-b08
          speaker: narrator
          text: Everyone grinned. Blacky had played so many clever tricks that hardly anyone was truly his friend. The one exception might have been Sammy Jay, Blacky's cousin and another lover of mischief. Still, nobody interrupted, so Blacky continued.
        - id: ch01-b09
          speaker: blacky_crow
          text: Little Joe Otter told us what he saw. Farmer Brown's boy found Buster Bear's footprint beside the Laughing Brook, then hurried home. The whole way back, he kept looking behind him as though he were scared.
        - id: ch01-b10
          speaker: blacky_crow
          text: Maybe he was frightened, and maybe he wasn't. He could have had something else on his mind. You all believe Little Joe's story, so you have turned Buster Bear into a hero. I am not saying the story is false. But I will feel much more certain when I watch Farmer Brown's boy run away from Buster myself. So here is what we will do.
        - id: ch01-b11
          speaker: blacky_crow
          text: Very early tomorrow morning, Sammy Jay and I will make a terrible racket near the edge of the Green Forest. Farmer Brown's boy is very curious. He is sure to come and find out what all the noise is about. Then we will lead him straight to Buster Bear.
        - id: ch01-b12
          speaker: blacky_crow
          text: If the boy runs away, I will be the first to admit that Buster Bear is as great a hero as some of you think. The plan is simple. You can all hide nearby and watch. Then you can decide for yourselves whether Little Joe Otter was right. Well, what do you say?
        - id: ch01-b13
          speaker: narrator
          text: At once, everybody started talking together. The plan was so simple that they all agreed to it. Better still, it promised plenty of excitement, so almost everyone promised to come.
        - id: ch01-b14
          speaker: narrator
          text: Grandfather Frog and Spotty the Turtle were the only ones who would not be there. They did not care to travel so far from the Smiling Pool.
        - id: ch01-b15
          speaker: narrator
          text: And so they agreed that Blacky would put his plan to the test the very next morning.
