audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 第三章　熊巴斯特大惑不解
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 熊巴斯特搬进绿森林以后，还没有哪一天像今天这么开心。他先在欢笑溪的小水潭边，突然把小水獭乔吓了一跳。小乔连刚捉到的肥鳟鱼都掉了。巴斯特觉得这件事实在好笑，吃鱼的时候一直低声乐个不停。吃完那条肥鳟鱼，他就去给自己再捉几条。
        - id: ch01-b02
          speaker: narrator
          text: 没过多久，巴斯特来到另一个小水潭。他怕惊动鱼儿，就轻手轻脚地摸到潭边，挨着水坐下，浑身一动不动。巴斯特早就知道，捉鱼可得有耐心。除非你像小水獭乔一样，在水里和鱼儿一样自在，还能游得飞快，追上它们。
        - id: ch01-b03
          speaker: narrator
          text: 巴斯特静得连眼睫毛也不动，简直像一截老树桩。也许鱼儿也把他当成了树桩。很快，两三条鱼就游到他身边。别看巴斯特身子又大、模样又笨重，只要他愿意，那双大爪子可快得很。说时迟，那时快，一只大爪子猛地挥出去，眨眼就把一条傻乎乎的鱼捞上了岸。
        - id: ch01-b04
          speaker: narrator
          text: 巴斯特的小眼睛亮了起来。他咂着嘴，继续往下一个小水潭走。他知道，留在头一个水潭也没用了。那里的鱼早吓坏了，很久很久都不会回来。到了下一个水潭，同样的事又来了一遍。巴斯特的兴致越来越高。捉鱼有趣，吃鱼就更有趣了。早餐能吃上刚捉的新鲜鳟鱼，还有什么比这更美呢？难怪他心里那么痛快！
        - id: ch01-b05
          speaker: narrator
          text: 可三条鳟鱼还填不饱熊巴斯特的肚子，他便又去找下一个水潭。谁知这里不像先前的水潭那样清澈漂亮，根本看不到潭底，更别提看清有没有鱼了。整潭水浑得厉害，就像刚有人把潭底的泥全搅起来。
        - id: ch01-b06
          speaker: buster_bear
          text: 哼！在这里捉鱼根本没用，只会白费工夫。我还是到下一个水潭试试吧。
        - id: ch01-b07
          speaker: narrator
          text: 巴斯特走到下一个水潭，发现水还是一样浑。他再去一个，那里也没好多少。巴斯特只好坐下来挠挠头。这到底是怎么回事？真让人想不明白。没错，先生，这事实在叫人想不明白。他满腹疑心，往左看看，又往右瞧瞧，可一个影子也没看见。四周静悄悄的，只有欢笑溪还在笑个不停。巴斯特听着听着，总觉得溪水是在笑话他。
        - id: ch01-b08
          speaker: buster_bear
          text: 这可真奇怪，太奇怪了。看来今天没法再捉鱼啦。我怎么也想不明白。幸好刚才已经捉到了几条。瞧这个样子，好像有人想要……哈！
        - id: ch01-b09
          speaker: narrator
          text: 一个念头忽然跳进巴斯特脑袋里。他先低声笑，接着放声大笑起来。
        - id: ch01-b10
          speaker: buster_bear
          text: 我敢说，一定是水獭乔那个小淘气在捉弄我。他这是要报我吃掉那条肥鳟鱼的仇！
        - id: ch01-b11
          speaker: narrator
          text: 巴斯特一向喜欢好笑的事，就算自己成了笑话也一样喜欢。他笑得停不下来，只好用两只手捧住肚子。这可比小水獭乔那样大发脾气好多了。
        - id: ch01-b12
          speaker: buster_bear
          text: 水獭先生，你可真聪明！你的确聪明，不过聪明的可不只你一个。
        - id: ch01-b13
          speaker: narrator
          text: 巴斯特仍旧笑个不停。他转身走开，开始琢磨一个能胜过小水獭乔的办法。
