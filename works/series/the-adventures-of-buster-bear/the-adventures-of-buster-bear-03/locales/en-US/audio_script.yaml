audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: easygoing and good-humored
        timbre: deep and rumbling
        pace: unhurried
        pitch: low
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: lively and quick to react
        timbre: light and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Buster Bear Is Greatly Puzzled
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Buster Bear had not had this much fun since he came to live in the Green Forest. It began beside a little pool in the Laughing Brook. Buster surprised Little Joe Otter so badly that Little Joe dropped the fat trout he had just caught. Buster thought it was a wonderful joke. He chuckled all the while he ate that trout. When it was gone, he headed down the brook to do some fishing of his own.
        - id: ch01-b02
          speaker: narrator
          text: Before long, Buster reached another little pool. He crept toward it as quietly as he could so he would not scare the fish. Then he sat close to the water and became perfectly still.
        - id: ch01-b03
          speaker: narrator
          text: Buster had learned long ago that fishing takes patience. Little Joe Otter could chase fish through the water because he swam as naturally as they did, and nearly as fast. Buster could not fish that way. He had to wait.
        - id: ch01-b04
          speaker: narrator
          text: He did not move so much as an eyelash. Sitting there, he looked almost like the stump of an old tree. Perhaps the fish mistook him for one. Soon, two or three of them swam right up beside him.
        - id: ch01-b05
          speaker: narrator
          text: Buster might look big and clumsy, but when he wants to move one of those huge paws, almost nothing is quicker. One paw flashed out. In less than a wink, it scooped a foolish fish onto the bank.
        - id: ch01-b06
          speaker: narrator
          text: Buster's little eyes twinkled. He smacked his lips and moved on to the next pool. There was no point in staying where he was. The other fish were so frightened that they would not return for a long, long time.
        - id: ch01-b07
          speaker: narrator
          text: The same thing happened at the next pool. Now Buster was in splendid spirits. Catching fish was fun, and eating them was even better. Could there be a finer breakfast than trout caught fresh from the brook? No wonder Buster felt good.
        - id: ch01-b08
          speaker: narrator
          text: Still, three trout were not enough to fill Buster Bear's stomach. He went along to another little pool.
        - id: ch01-b09
          speaker: narrator
          text: This pool was different. The others had been so clear and beautiful that Buster could see the bottom and tell whether any fish were there. This water was much too muddy to see through. It looked as though someone had just stirred up all the mud on the bottom.
        - id: ch01-b10
          speaker: buster_bear
          text: Huh! There's no use fishing here. I'd only be wasting my time. I'll go try the next pool.
        - id: ch01-b11
          speaker: narrator
          text: So Buster went on. But the next pool was just as muddy. He tried another one, and that pool was no better.
        - id: ch01-b12
          speaker: narrator
          text: Buster sat down and scratched his head. This was puzzling. Yes, sir, it was very puzzling indeed. He glanced one way, then the other, watching for anything suspicious. No one was there. Everything was still except the Laughing Brook, chuckling as it flowed. Somehow, Buster felt as though the Brook were laughing at him.
        - id: ch01-b13
          speaker: buster_bear
          text: This is mighty strange. It looks like my fishing is over for today, and I can't make sense of it. At least I caught those other trout. But this looks as if somebody is trying to... Ha!
        - id: ch01-b14
          speaker: narrator
          text: A sudden thought had popped into Buster's head. First he chuckled. Then the chuckle grew into a laugh.
        - id: ch01-b15
          speaker: buster_bear
          text: I'll bet that scamp Little Joe Otter muddied these pools to pay me back for eating his fat trout!
        - id: ch01-b16
          speaker: narrator
          text: Buster always enjoyed a good joke, even when the joke was on him. He laughed so hard that he had to hold his sides. That was much better than flying into a rage, as Little Joe had done.
        - id: ch01-b17
          speaker: buster_bear
          text: You're pretty smart, Mr. Otter. Yes, you're pretty smart. But you aren't the only one who knows a trick or two.
        - id: ch01-b18
          speaker: narrator
          text: Still chuckling, Buster Bear went away to think of a plan for getting the best of Little Joe Otter.
