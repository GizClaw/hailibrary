audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    blacky_the_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 警觉多疑，说话直截了当
        timbre: 粗亮而有穿透力
        pace: 中等
        pitch: 中低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 好奇活跃，追问时急切明快
        timbre: 清脆响亮
        pace: 偏快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 朝气十足，困惑时直率而略显急躁
        timbre: 清亮活泼的少年音
        pace: 轻快自然
        pitch: 中高音
    chatterer_red_squirrel:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，取笑别人时又快又得意
        timbre: 清脆而活泼
        pace: 明快
        pitch: 高音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十二章　农夫布朗家的男孩和熊巴斯特都起了好奇心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天才刚刚亮，乌鸦布莱基就飞上了绿森林边缘最高的那棵树。那棵树离农夫布朗的家最近。他坐在树顶，两眼一直盯着屋子的后门，一刻也没移开。
        - id: ch01-b02
          speaker: narrator
          text: 布莱基在等谁呢？他等的是农夫布朗家的男孩。男孩每天都要从那扇门出来，到牛棚里挤牛奶。这时候，松鸦萨米正悄悄穿过绿森林，到处寻找熊巴斯特。只要找到了，他就能在该行动的时候告诉表兄布莱基，巴斯特到底在哪里。
        - id: ch01-b03
          speaker: narrator
          text: 等了一阵，后门终于开了。农夫布朗家的男孩走出来，一手提着一只奶桶。布莱基立刻在林边的树木间飞来飞去，扯开他的大嗓门叫个不停。
        - id: ch01-b04
          speaker: blacky_the_crow
          text: 哇，哇，哇！哇，哇，哇！
        - id: ch01-b05
          speaker: narrator
          text: 男孩朝树林那边看了看。他的确很想知道，布莱基为什么闹得这么厉害，可他并没有过去。不，他提着奶桶，径直朝牛棚走去。
        - id: ch01-b06
          speaker: narrator
          text: 这下，布莱基可糊涂了。他虽然聪明又精明，却从来不用工作，只要找够自己吃的东西就行，所以他根本不明白什么叫责任。男孩不来绿森林，反倒去了牛棚，这究竟是怎么回事？
        - id: ch01-b07
          speaker: narrator
          text: 布莱基叫得更响，也叫得更卖力。最后，他的嗓子彻底哑了，再也叫不出声。可农夫布朗家的男孩连脚步都没停，还是走进了牛棚。
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: 乌鸦先生，我真想知道你干吗闹得这么厉害。不过我得先喂牛，再把牛奶挤完。
        - id: ch01-b09
          speaker: narrator
          text: 绿森林和绿草地的其他小动物一直躲在附近，把这一切都看得清清楚楚。男孩刚走进牛棚，红松鼠喋喋就忍不住笑出了声。
        - id: ch01-b10
          speaker: chatterer_red_squirrel
          text: 哈，哈，哈！布莱基，你这个计划可真了不起呀！哈，哈，哈！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 布莱基一个字也说不出来，只好垂下了脑袋。布莱基平常可很少这样低着头。
        - id: ch01-b12
          speaker: sammy_jay
          text: 要不再等等吧。也许他从牛棚出来以后，就会到我们这边来。
        - id: ch01-b13
          speaker: narrator
          text: 萨米这时已经飞到了布莱基身旁。大家听了他的主意，便继续等下去。左等右等，男孩像是永远也不会出来了。可他终于露了面。布莱基和萨米立刻一起大叫，能闹多响就闹多响。
        - id: ch01-b14
          speaker: narrator
          text: 男孩先把两桶牛奶送进屋，又马上走了出来。这一次，他直奔绿森林。那些叫声已经把他的好奇心全勾起来了。他一分钟也不愿多等，非得弄明白是怎么回事。
        - id: ch01-b15
          speaker: narrator
          text: 可是，好奇的不只农夫布朗家的男孩。还有一个家伙也听见了布莱基和萨米的叫声。他听了又听，到底忍不住了，觉得自己也非去看个究竟不可。
        - id: ch01-b16
          speaker: narrator
          text: 就在男孩朝绿森林出发的时候，那个家伙也动身了。他朝布莱基和萨米闹得最响的地方走去，每一步都落得极轻，一点声音也没有。
        - id: ch01-b17
          speaker: narrator
          text: 那个悄悄走来的家伙，正是熊巴斯特。
