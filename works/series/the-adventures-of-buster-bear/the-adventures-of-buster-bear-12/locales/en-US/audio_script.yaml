  chapters:
    - id: ch01
      title: Farmer Brown's Boy and Buster Bear Grow Curious
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: As soon as there was enough light to see, Blacky the Crow took his place at the top of the tallest tree near Farmer Brown's house. He sat on the edge of the Green Forest and kept his eyes fixed on the back door. What was he waiting for? He wanted Farmer Brown's boy to come out and head for the barn to milk the cows.
        - id: ch01-b02
          speaker: narrator
          text: While Blacky watched, Sammy Jay moved quietly through the Green Forest in search of Buster Bear. When the right moment came, Sammy would tell his cousin Blacky exactly where Buster was.
        - id: ch01-b03
          speaker: narrator
          text: After a while, the back door opened. Farmer Brown's boy stepped outside with a milk pail in each hand. At once, Blacky flew around among the trees by the forest's edge and screamed as loudly as he could.
        - id: ch01-b04
          speaker: blacky_crow
          text: Caw, caw, caw! Caw, caw, caw!
        - id: ch01-b05
          speaker: narrator
          text: Farmer Brown's boy looked toward the trees. He did wonder what all the noise meant, but he did not go over to find out. No, sir. He walked straight toward the barn.
        - id: ch01-b06
          speaker: narrator
          text: Blacky could not understand it. Clever and shrewd as he was, he knew nothing about duty. Blacky never had work to do except finding enough food to eat. So when the boy chose the barn instead of the Green Forest, Blacky was completely puzzled.
        - id: ch01-b07
          speaker: narrator
          text: Blacky called louder and harder than before. He kept it up until his voice was too hoarse to make another scream. Still, Farmer Brown's boy went on toward the barn.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: I'd sure like to know why you're making all that noise, Mr. Crow. But first I have to feed the cows and milk them.
        - id: ch01-b09
          speaker: narrator
          text: All this time, the other little people of the Green Forest and Green Meadows had been hiding nearby, watching everything. As soon as Farmer Brown's boy vanished into the barn, Chatterer the Red Squirrel laughed out loud.
        - id: ch01-b10
          speaker: chatterer_red_squirrel
          text: Ha, ha, ha! What a wonderful plan you had, Blacky! Ha, ha, ha!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Blacky had no answer at all. He simply hung his head, and Blacky hardly ever did that.
        - id: ch01-b12
          speaker: sammy_jay
          text: Maybe he'll come over here after he comes out again. We could wait and see.
        - id: ch01-b13
          speaker: narrator
          text: Sammy had joined Blacky, and the others agreed to wait. It began to seem as if Farmer Brown's boy would never leave the barn. At last, though, he came out. Blacky and Sammy immediately started calling and making as much noise as they could.
        - id: ch01-b14
          speaker: narrator
          text: The boy carried both pails of milk into the house. Then he came outside once more and headed straight for the Green Forest. By now, he was so curious about the commotion that he could not wait any longer to learn what it meant.
        - id: ch01-b15
          speaker: narrator
          text: But Farmer Brown's boy was not the only one burning with curiosity. Someone else had heard Blacky and Sammy shouting. He had listened until he could not bear the mystery for one more minute. He simply had to find out what was happening.
        - id: ch01-b16
          speaker: narrator
          text: So, just as Farmer Brown's boy set off for the Green Forest, that other listener began moving toward the place where Blacky and Sammy were making such a racket. He placed each foot softly and made no sound at all.
        - id: ch01-b17
          speaker: narrator
          text: That silent listener was Buster Bear.
