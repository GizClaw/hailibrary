  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    blacky_crow:
      display_name: Blacky the Crow
      tts:
        delivery: skeptical and blunt
        timbre: dry and raspy
        pace: deliberate
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp and noisy
        timbre: bright and piercing
        pace: quick
        pitch: high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: cheerful and straightforward
        timbre: youthful and clear
