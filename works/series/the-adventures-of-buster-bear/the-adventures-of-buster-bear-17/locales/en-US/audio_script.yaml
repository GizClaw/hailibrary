audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    buster_bear:
      display_name: Buster Bear
      tts:
        delivery: deep and thoughtful with a grumbly warmth
        timbre: rich and rumbling
        pace: unhurried
        pitch: low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: lively and mischievous
        timbre: bright and sharp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Buster Bear Goes Berrying
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Buster Bear often talks to himself when he thinks no one is near enough to hear. It has become a habit. That is not necessarily a bad thing, unless the habit goes too far. Any habit can cause trouble when it goes too far.
        - id: ch01-b02
          speaker: narrator
          text: Just imagine that you have a real secret. Nobody else knows it, and you want to keep it that way. If you often talk to yourself, you might say the secret aloud without thinking. Someone might happen to hear you, and then your secret would not be a secret anymore. That is how a harmless habit can turn into a bad one.
        - id: ch01-b03
          speaker: narrator
          text: Buster had lived alone in the Great Woods for such a long time that his habit of talking to himself had grown stronger and stronger. It kept him from feeling lonely. When he moved down to the Green Forest, all his habits came with him. Habits always seem to follow you wherever you go. And in the Green Forest, Buster had many more neighbors than he had known in the Great Woods.
        - id: ch01-b04
          speaker: buster_bear
          text: Let me think. What could tempt my appetite? I haven't felt as hungry as I should lately. I need something different. Yes, sir, a change is just what I need. There is something I ought to be eating at this time of year, something I used to have but haven't had here. Ha! Now I know. Fresh fruit! It must be berry time, and I had forgotten all about it.
        - id: ch01-b05
          speaker: buster_bear
          text: My, my, my! Those berries would taste good. If I were back in the Great Woods, I could eat all I wanted. Mmm! My mouth waters just thinking about them. There should be plenty up in the Old Pasture. If only I weren't afraid someone might see me, I would go there.
        - id: ch01-b06
          speaker: narrator
          text: Buster sighed, and then he sighed once more. He kept thinking about the berries he was sure were growing in the Old Pasture. The more he thought, the more he wanted them. It felt as if he had never wanted berries so badly in his life. He wandered around, unable to settle down. He was hungry for berries, and nothing else would do. Before long, he started talking to himself again.
        - id: ch01-b07
          speaker: buster_bear
          text: If I weren't afraid someone would spot me, I would go to the Old Pasture this minute. I can almost taste those berries.
        - id: ch01-b08
          speaker: narrator
          text: As Buster spoke, he licked his lips hungrily. Then his face suddenly brightened.
        - id: ch01-b09
          speaker: buster_bear
          text: I know what I'll do! Tomorrow, I'll go up there at the very first peep of day. I can eat all the berries I want and return to the Green Forest before Farmer Brown's boy, or anyone else I'm afraid of, has a chance to see me. Yes, sir, that is exactly what I'll do. My, I wish morning would hurry up and come!
        - id: ch01-b10
          speaker: narrator
          text: Buster had no idea that someone had heard every word. That someone was Sammy Jay. At last, Buster lay down for a nap. Sammy flew away, chuckling to himself.
        - id: ch01-b11
          speaker: sammy_jay
          text: I think I'll pay a visit to the Old Pasture tomorrow morning. If Buster keeps to his plan, something interesting just might happen.
        - id: ch01-b12
          speaker: narrator
          text: Sammy was watching very early the next morning. The first Jolly Little Sunbeams had reached the Green Meadows, but they had not yet begun to creep into the Green Forest. Then Sammy saw a big, dark shape slip out from the place where the Green Forest meets the Old Pasture.
        - id: ch01-b13
          speaker: narrator
          text: The dark shape moved quickly and quietly, as though it were in a great hurry. Sammy knew exactly who it was. Buster Bear was on his way to pick berries. Sammy waited until the light grew a little stronger and he could see more clearly. Then he set off for the Old Pasture too.
