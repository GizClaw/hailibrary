audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 浑厚直爽，快活时笑意十足
        timbre: 低沉宽厚
        pace: 稍慢而有力
        pitch: 低音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 好奇活跃，追问时急切明快
        timbre: 清脆响亮
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十七章　熊巴斯特去采浆果
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 熊巴斯特以为周围没人偷听时，很爱跟自己说话。这是他的习惯。只要不过头，这习惯并不坏。可任何习惯一过头，都会变坏。
        - id: ch01-b02
          speaker: narrator
          text: 比方说，你藏着一个真正的秘密，除了你，谁也不知道，你也不想让任何人知道。可你偏偏习惯自言自语，一不留神，就把秘密大声说给自己听了。这时说不定恰好有人在旁边，又恰好听见。这样一来，秘密可就没了。本来不坏的习惯，过了头便会惹出这样的麻烦。
        - id: ch01-b03
          speaker: narrator
          text: 巴斯特独自在大森林里住了很久。为了不觉得寂寞，他自言自语的习惯越来越深。后来搬到绿森林，他自然也把所有习惯一起带来了。习惯就是这样，不管你去哪儿，它们都会跟着。可绿森林里的邻居，要比大森林里多得多。
        - id: ch01-b04
          speaker: buster_bear
          text: 让我想想，让我好好想想，有什么东西能勾起胃口呢？我的胃口不大对劲，得换换口味。对，先生，非换不可。每年这个时候，我本该吃上一样东西，现在却没吃到。从前我常吃，如今却没有。哈，我知道了！我要吃新鲜水果。没错，就是新鲜水果！眼下差不多该到浆果成熟的时候了，我竟然忘得一干二净。哎呀，哎呀，浆果吃起来该有多香啊！
        - id: ch01-b05
          speaker: buster_bear
          text: 要是还在大森林里，我想吃多少就有多少。嗯——！光是想想，口水就要流出来了。老牧场准有浆果，而且一定多得很。要不是怕被人看见，我早就去了。
        - id: ch01-b06
          speaker: narrator
          text: 巴斯特叹了一口气，又叹了一口。他认定老牧场里正长着浆果，越想就越想吃。这辈子，他好像从没像现在这么馋过浆果。他坐立不安，只好走来走去。肚子是饿了，可他只想吃浆果，别的东西一样也不想碰。过了一会儿，他又开口了。
        - id: ch01-b07
          speaker: buster_bear
          text: 要不是怕人看见，我现在就去老牧场。那些浆果，我仿佛都尝到味儿了。
        - id: ch01-b08
          speaker: narrator
          text: 巴斯特馋得舔了舔嘴唇，忽然眼睛一亮。
        - id: ch01-b09
          speaker: buster_bear
          text: 有办法了！明天天边刚透出第一点亮光，我就去老牧场。我可以尽管吃，吃够了再赶回绿森林。这样，农夫布朗的儿子，还有那些让我害怕的人，谁也看不见我。对，就这么办。唉，明天早晨怎么还不快来呀！
        - id: ch01-b10
          speaker: narrator
          text: 巴斯特不知道，刚才有人一直在听。那人不是别人，正是松鸦萨米。后来，巴斯特终于躺下打起盹来，萨米便飞走了，一路暗自偷笑。
        - id: ch01-b11
          speaker: sammy_jay
          text: 我看，明天早晨我也得去老牧场瞧瞧。只要巴斯特不改主意，说不定就有好玩的事情看了。
        - id: ch01-b12
          speaker: narrator
          text: 第二天一大早，萨米就留心守望起来。第一批快乐的小阳光刚刚照到绿草地，还没悄悄钻进绿森林，他便看见一个又大又黑的身影，从绿森林和老牧场相接的地方溜了出来。
        - id: ch01-b13
          speaker: narrator
          text: 那身影走得又快又轻，像在急着赶路。萨米一眼就认出来了。没错，那是熊巴斯特，他要去采浆果。
        - id: ch01-b14
          speaker: narrator
          text: 萨米没有立刻跟上去。他等了一会儿，等到天色更亮，眼前看得更清楚些，随后也朝老牧场出发了。
