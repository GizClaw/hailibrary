audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着含蓄的幽默
        timbre: 温暖清晰的中低音
        pace: 舒展而富于变化
        pitch: 中
    stalky:
      display_name: 斯托基
      tts:
        delivery: 自信狡黠，随时像在部署作战
        timbre: 清亮而有韧性的少年音
        pace: 明快
        pitch: 中高
    beetle:
      display_name: 甲虫
      tts:
        delivery: 机智好辩，笑意常藏在话里
        timbre: 稍厚的少年音
        pace: 中等偏快
        pitch: 中
    mcturk:
      display_name: 麦克特克
      tts:
        delivery: 冷峭直接，激动时带鲜明的爱尔兰腔调
        timbre: 瘦硬略带沙哑的少年音
        pace: 中等
        pitch: 中高
    king:
      display_name: 金先生
      tts:
        delivery: 尖刻自负，训斥时步步紧逼
        timbre: 干硬的男声
        pace: 偏快
        pitch: 中高
    chaplain:
      display_name: 学校牧师
      tts:
        delivery: 温吞含蓄，说话不紧不慢
        timbre: 温和的中年男声
        pace: 偏慢
        pitch: 中低
    mason:
      display_name: 梅森先生
      tts:
        delivery: 认真急切，情绪容易显在声音里
        timbre: 略紧的男声
        pace: 中等偏快
        pitch: 中
    prout:
      display_name: 普劳特先生
      tts:
        delivery: 郑重迂直，总像在宣讲责任与品格
        timbre: 浑厚略显沉闷的中年男声
        pace: 偏慢
        pitch: 中低
    hartopp:
      display_name: 小哈托普先生
      tts:
        delivery: 清醒温和，揶揄时不动声色
        timbre: 轻细清楚的男声
        pace: 舒缓
        pitch: 中高
    macrea:
      display_name: 麦克雷先生
      tts:
        delivery: 务实爽直，偶尔带冷冷的玩笑
        timbre: 沉稳结实的男声
        pace: 中等
        pitch: 中低
    orrin:
      display_name: 奥林
      tts:
        delivery: 好胜冲动，受气时直冲冲地嚷出来
        timbre: 明亮粗实的少年音
        pace: 偏快
        pitch: 中高
    harrison:
      display_name: 哈里森
      tts:
        delivery: 认真强硬，困惑时藏不住慌乱
        timbre: 稳重的青年男声
        pace: 中等
        pitch: 中
    craye:
      display_name: 克雷
      tts:
        delivery: 克制谨慎，被激怒时语气发紧
        timbre: 清晰的青年男声
        pace: 中等
        pitch: 中
    junior_boy:
      display_name: 低年级男生
      tts:
        delivery: 诚实困惑，急着把事情解释清楚
        timbre: 稚嫩清亮的男孩声
        pace: 中等偏快
        pitch: 高
    foxy:
      display_name: 福克西军士
      tts:
        delivery: 简短利落，带着校务军士的威严
        timbre: 粗硬的中年男声
        pace: 中等
        pitch: 低
    headmaster:
      display_name: 校长
      tts:
        delivery: 冷静老练，温和话音里藏着不容躲闪的锋芒
        timbre: 深沉清晰的老年男声
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 牧师书房里的议论
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 星期六晚上，四位舍监都来到学校牧师的书房抽烟。三只石楠木烟斗和一支雪茄和气地冒着烟，可见约翰·吉列特牧师调停得很成功。自从那只死猫被发现，金先生动不动便认定别人存心冒犯他。约翰牧师既要做众人的朋友，又要在中间挡住冲突，忙了整整一星期，才让大家重新和好。他身材肥胖，脸刮得干净，只留两撇大胡子，脾气好得什么也撼不动。不喜欢他的人却说，他是个诡计多端的耶稣会士。此刻，他慈祥地看着自己的成果。四个受尽折磨的男人坐在一起谈话，话里居然没有多少恶意。
        - id: ch01-b02
          speaker: chaplain
          text: 我先请诸位记住，我没有指控任何人。不过每逢有人直接对五号自修室采取行动，事情绕到最后，采取行动的那个人多少总会丢些脸。我说的只是这个反复出现的结果。
        - id: ch01-b03
          speaker: king
          text: 这话我不认。为了甲虫的灵魂，我天天都把那个无法无天的小子，还有他的两个同党，一起碾成粉末。
        - id: ch01-b04
          speaker: chaplain
          text: 那就先说两年前。你和普劳特追查他们在棚屋过夜、擅闯私地的事，还记得达布尼上校吗？
        - id: ch01-b05
          speaker: narrator
          text: 另外几个人都笑了。金先生可不喜欢人家提起那次偷猎风波。
        - id: ch01-b06
          speaker: chaplain
          text: 这是第一回。后来他们住在你楼上，我早说过那叫自己钻进狮子窝。你嫌他们弄出怪声，把他们赶走，当晚你的书房就给砸了。
        - id: ch01-b07
          speaker: king
          text: 那是兔蛋干的。他从路上来，醉得不成样子，跟那几个男孩有什么关系？
        - id: ch01-b08
          speaker: chaplain
          text: 最后一回，他们觉得有人污蔑他们不爱干净。所有男孩对这种话都格外敏感。好极了，你来看看每次的回报有多恰当。你那一舍叫了他们一星期臭鬼，接着一只死猫就在你舍里最叫你难受的地方发臭。巧合的长臂又伸出来了。总之，你指控他们擅闯私地。经过一连串荒唐的机缘，他们也许在幕后，也许不在，最后你和普劳特反倒像擅闯者。你把他们赶走，自己的书房便有一阵子住不了人。现在两边都摆出来了，你怎么说？
        - id: ch01-b09
          speaker: king
          text: 猫死在怀特寝室正中央的双层地板下面。谁也不可能撬开那里却不留痕迹，连我舍里的男孩也办不到。还有，那晚兔蛋醉得格外厉害。
        - id: ch01-b10
          speaker: chaplain
          text: 我只说他们运气出奇地好。我喜欢那三个孩子，他们也肯对我说几句真话。他们叫我神父，我听着很受用。大家相安无事，我也不用听那些编出来的偷窃忏悔。
        - id: ch01-b11
          speaker: prout
          text: 你说梅森那件事？我一直觉得他们做得很不像话。梅森也许看错了，可他诚心诚意，出发点是好的。校长本该仔细查清楚。
        - id: ch01-b12
          speaker: chaplain
          text: 这一点我不能同意。他听见一句说他们偷东西的蠢话，马上就信了，又听信另一个男孩，半点都没调查。说真的，他吃什么苦头都不冤。
        - id: ch01-b13
          speaker: prout
          text: 他们故意伤害梅森最可贵的感情。只要来告诉我一声，什么事都不会有。可他们偏要利用梅森不了解他们，一步一步把他引进去。
        - id: ch01-b14
          speaker: king
          text: 也许吧，可我就是不喜欢梅森。你夸他的那一点，正是我不喜欢他的地方。他总是出发点很好。
        - id: ch01-b15
          speaker: hartopp
          text: 本校传统里的罪过可不包括偷窃，至少不偷自己人。
        - id: ch01-b16
          speaker: macrea
          text: 你那一舍从诺瑟姆的穷选民手里抢过七头牛。你身为舍监，说这话是不是太绝对了？
        - id: ch01-b17
          speaker: hartopp
          text: 正因为这样。抢牛、拆门、偶尔偷猎，再去悬崖捕鹰，这些才救了我们。
        - id: ch01-b18
          speaker: prout
          text: 可这些事给全校造成的损害，远远超过……
        - id: ch01-b19
          speaker: hartopp
          text: 超过任何被压下去的丑闻？不错。农夫们恨透了我们。可再多这种花样，我也宁肯应付它们，不愿应付另外那些过错。
        - id: ch01-b20
          speaker: prout
          text: 那三个孩子也许算不上坏，可他们不像普通男孩。他们不正常，依我看，心性也不健全。他们那些把戏造成的道德影响，一定会给更大的祸害开路。我简直不知道该用什么办法管住他们。也许我应该把他们拆开，不让他们继续待在一起。
        - id: ch01-b21
          speaker: macrea
          text: 你当然能拆。不过他们六年来一直一道升班。换成我，我不会这么做。
        - id: ch01-b22
          speaker: king
          text: 他们还老说那个社论式的我们，听着就烦。问科克兰作文在哪里，他会说，我们还没全写完，我们马上交。另外两个也是这样。
        - id: ch01-b23
          speaker: hartopp
          text: 那个我们很管用。我教他们三角学。麦克特克还懂一点，甲虫对正弦余弦却一窍不通。他放心抄斯托基的，斯托基倒是一见数学就高兴。
        - id: ch01-b24
          speaker: prout
          text: 你怎么不制止？
        - id: ch01-b25
          speaker: hartopp
          text: 考试自然会算账。到时候甲虫交白卷，只能指望英文把他救回来。我看他上我的课，多半都在写诗。
        - id: ch01-b26
          speaker: king
          text: 真希望上帝让他把写诗的力气分一点给哀歌体。除了斯托基，我从没见过比他更糟的野蛮六步格。
        - id: ch01-b27
          speaker: chaplain
          text: 他们的自修室分工合作。斯托基管数学，麦克特克管拉丁文，甲虫包三个人的英文和法文。上个月甲虫进医务室以后……
        - id: ch01-b28
          speaker: prout
          text: 他是在装病。
        - id: ch01-b29
          speaker: chaplain
          text: 很可能是在装病。不过不论他是真病还是假病，那段日子已经把他们怎样合作说明白了。甲虫一不在，另外两个人翻译《穷青年传奇》的水平马上就掉了下去。
        - id: ch01-b30
          speaker: prout
          text: 这太不道德了。我一向反对自修室制度。
        - id: ch01-b31
          speaker: hartopp
          text: 哪间自修室的男孩不互相帮忙？只是五号室把它做成了一套制度。他们干什么都有一套。
        - id: ch01-b32
          speaker: chaplain
          text: 他们自己也承认。我见过甲虫和斯托基把麦克特克一路赶上楼，逼他把《墓园挽歌》改写成哀歌体，自己却出去踢球。
        - id: ch01-b33
          speaker: prout
          text: 这就是有组织的抄袭。
        - id: ch01-b34
          speaker: hartopp
          text: 才不是。你不能教母牛拉小提琴。
        - id: ch01-b35
          speaker: prout
          text: 他们的意图就是抄袭。
        - id: ch01-b36
          speaker: chaplain
          text: 可那些话是他们在忏悔的秘密里告诉我们的，对吧？
        - id: ch01-b37
          speaker: prout
          text: 是你说亲耳听见他们分派功课的，吉列特。
        - id: ch01-b38
          speaker: chaplain
          text: 天哪，别让我去做王室证人。哈托普也有份。要是孩子们发现我告密，我珍惜的那份交情就毁了。
        - id: ch01-b39
          speaker: prout
          text: 你对这件事太软弱了。把他们拆开一阵，对大家都会更好吧？
        - id: ch01-b40
          speaker: macrea
          text: 你尽管拆。这样我们正好看看吉列特那套理论灵不灵。
        - id: ch01-b41
          speaker: chaplain
          text: 聪明点，普劳特。别招惹他们，不然灾祸会找上你，还会连累我。我太胖了，经不起坏男孩折腾。你要去哪儿？
        - id: ch01-b42
          speaker: prout
          text: 胡说，他们不敢。我只是要认真想一想。他们有抄袭的意图，我得弄清自己的责任。
        - id: ch01-b43
          speaker: chaplain
          text: 他真可能把这事交给男孩们凭良心处理。都怪我。我总忘记教师不是普通人。记住，要出乱子了。
    - id: ch02
      title: 回到公共教室
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 祸事果然从天而降。三个人还在为死猫那场大战得意，普劳特先生突然闯进五号自修室。他先把抄袭说成滔天大罪，狠狠训斥一通，又命他们星期一搬回公共教室自习。他们先轮流独骂，接着一齐大骂，闹了整整一个本该安宁的安息日。因为他们被定下的那种罪，多多少少也是所有自修室每天都在做的惯例。
        - id: ch02-b02
          speaker: stalky
          text: 光骂没用。咱们只能跟全舍混在一起。书塞进储物柜，晚自习坐十二号教室。
        - id: ch02-b03
          speaker: narrator
          text: 他舍不得地看着舒适的房间。墙裙、模板花纹和印花布帘，都是麦克特克领着布置的。
        - id: ch02-b04
          speaker: mcturk
          text: 赫菲会像条脏老猎狗一样闯进教室，看咱们有没有捣鬼。他这些日子一刻也不肯放松本舍。那可真有意思。
        - id: ch02-b05
          speaker: beetle
          text: 他还会说，为什么不去看板球？我喜欢强壮健康的男孩。别窝在教室里发霉，要关心本舍。呸！
        - id: ch02-b06
          speaker: stalky
          text: 对，咱们就去关心本舍，好好关心一回。他已经一年没把咱们放进教室，这一年咱们学了不少。等做完以后，他那一舍准会漂亮极了。还记得公学小说里的彼列吗？我要当彼列。
        - id: ch02-b07
          speaker: beetle
          text: 那我当玛门，开一门放高利贷的生意。书上说每所学校都有，一先令每星期收一便士。赫菲听了准受不了。火鸡，你当路西法。
        - id: ch02-b08
          speaker: mcturk
          text: 我要做什么？
        - id: ch02-b09
          speaker: stalky
          text: 领导阴谋、秘密结社和抵制。把赫菲老说的暗中策划真的做出来。走！
        - id: ch02-b10
          speaker: narrator
          text: 三个人被贬回教室，全舍照例用一半同情、一半取笑的态度欢迎他们。五号室的人素来不与众人往来，平时只关起门过自己的生活。如今他们被迫回到大家中间，反倒处处惹人注意。每个男孩都想看看这三个惯犯失去自修室以后会怎样，三个人也立刻让全舍知道，他们并不打算安静服刑。
        - id: ch02-b11
          speaker: stalky
          text: 真像从前。年轻的朋友们，我们敬爱的舍监把咱们赶出了住处，只好来陪大家玩一阵。
        - id: ch02-b12
          speaker: orrin
          text: 活该！你们这帮抄袭鬼！
        - id: ch02-b13
          speaker: stalky
          text: 亲爱的奥林，这样说话可不行。咱们还怎么维持快活的威望？
        - id: ch02-b14
          speaker: narrator
          text: 三个人亲亲热热地围住奥林，把他推到敞开的窗前，再拉下窗框，正好卡住他的后颈。他们动作飞快，又用细绳把他的两个拇指反绑在背后。他两脚踢得太凶，他们索性把鞋也脱了。几分钟后，普劳特先生恰好在那里发现他。奥林的脑袋像架在断头台上，全身动弹不得。四周一群男孩笑得不停抽搐，却没有一个肯伸手帮忙。
        - id: ch02-b15
          speaker: narrator
          text: 斯托基已经在楼上一间教室召集盟友，准备抵挡报复。奥林很快带着一队人冲上来，教室立刻化成一团尘雾。男孩们在雾里扭打、跺脚、呼喊、号叫。混乱中，一张课桌被拖跑，一团扭在一起的人踉跄着撞裂门板，一扇窗户打碎了，连煤气灯头也掉了下来。三个人趁乱溜到走廊，又把每个经过的人叫进来，撵上楼去参战。
        - id: ch02-b16
          speaker: stalky
          text: 救援！金舍，十二号教室！普劳特舍需要救援！麦克雷舍、哈托普舍，全来救援！
        - id: ch02-b17
          speaker: narrator
          text: 低年级生像分蜂一样涌出来，问也不问便投入混战。
        - id: ch02-b18
          speaker: stalky
          text: 头一晚就干成这样，不坏。普劳特大概要生气，咱们最好弄个不在场证明。
        - id: ch02-b19
          speaker: narrator
          text: 于是他们一直坐在金先生的栏杆上，直到晚自习。
        - id: ch02-b20
          speaker: stalky
          text: 只要让各舍混着打起来，十有八九会有蠢货挑起真正的大战。你好啊，奥林，你这副样子真叫人摸不着头脑。
        - id: ch02-b21
          speaker: orrin
          text: 都是你们这群畜生挑起来的！我们每人罚抄两百行，赫菲还在到处找你们。马尔帕斯把我的眼睛打成这样了！
          emotion: angry
        - id: ch02-b22
          speaker: stalky
          text: 我真喜欢你说是我们挑的。先叫人抄袭鬼的是谁？等你的婴儿脑袋懂了因果，就会知道拿五号室开玩笑不划算。
        - id: ch02-b23
          speaker: beetle
          text: 你欠我的一先令呢？
        - id: ch02-b24
          speaker: narrator
          text: 斯托基看不见身后的普劳特，却立刻接住了这场戏。
        - id: ch02-b25
          speaker: stalky
          text: 我只欠九便士，你这老高利贷鬼。
        - id: ch02-b26
          speaker: mcturk
          text: 还有利息。甲虫每借一先令，每星期收半便士。甲虫，你一定发财了。
        - id: ch02-b27
          speaker: stalky
          text: 可甲虫只借了我六便士。十九号借的，对吧？
        - id: ch02-b28
          speaker: beetle
          text: 对。可早先那一先令的利息你也没付。
        - id: ch02-b29
          speaker: stalky
          text: 你不是拿了我的表作抵押吗？
        - id: ch02-b30
          speaker: beetle
          text: 少废话。不给利息，我就算复利。你的借据还在我手里！
        - id: ch02-b31
          speaker: stalky
          text: 你真是个冷血的放债鬼。
        - id: ch02-b32
          speaker: mcturk
          text: 嘘！
        - id: ch02-b33
          speaker: narrator
          text: 普劳特走到身边，麦克特克还故意吓了一跳。
        - id: ch02-b34
          speaker: prout
          text: 刚才教室里出了那种丢脸的乱子，我倒没看见你们几个。
        - id: ch02-b35
          speaker: stalky
          text: 什么乱子，先生？我们刚从金先生那里回来。还有，您给我的课桌已经砸坏了，教室又满地墨水，晚自习我坐哪里？
        - id: ch02-b36
          speaker: prout
          text: 自己另找座位。难道还要我像奶妈一样照顾你？甲虫，你平常也借钱给同伴吗？
        - id: ch02-b37
          speaker: beetle
          text: 不常借，先生。
        - id: ch02-b38
          speaker: prout
          text: 这是很坏的习惯。我原以为至少我这一舍没有这种事。就算我对你的评价这样低，也没想到你还有这毛病。
        - id: ch02-b39
          speaker: beetle
          text: 借钱给别人也有错吗，先生？
        - id: ch02-b40
          speaker: prout
          text: 我不跟你争论道德。你一共借给科克兰多少？
        - id: ch02-b41
          speaker: beetle
          text: 我……我不大清楚。
        - id: ch02-b42
          speaker: prout
          text: 刚才听着倒很肯定。
        - id: ch02-b43
          speaker: mcturk
          text: 我想是两先令四便士。
        - id: ch02-b44
          speaker: narrator
          text: 麦克特克冷冷地鄙视了甲虫一眼。两先令四便士恰好是五号室那笔乱账的数目。他们把斯托基次好的礼拜日长裤拿去当了，麦克特克和甲虫都说，这笔钱该算作自己的份额。斯托基却坚持了两个学期，说那是他促成典当应得的佣金。无论算谁的，钱当然早就花在五号室的一顿私宴上了。
        - id: ch02-b45
          speaker: prout
          text: 那你不许再放债。是两先令四便士，对吗，科克兰？
        - id: ch02-b46
          speaker: narrator
          text: 斯托基从没说过那个数目，此刻也继续一声不出。他知道，只要让普劳特自己把故事补齐，这场戏就会演得更好。普劳特摸遍衣袋，居然真的找出一枚两先令银币和四便士。对三个正在盘算下一顿吃什么的男孩来说，那些钱落进手里的声音，比舍监关于道德的判断实在得多。
        - id: ch02-b47
          speaker: prout
          text: 把科克兰的借据交给我，这事便不再追究。钱从你的零用钱里扣，科克兰。收据立刻送到我书房。
        - id: ch02-b48
          speaker: narrator
          text: 他们才不在乎这钱最后从谁的零用钱里扣。离学期结束还远，五号室的公款又总是不够用。饿肚子的时候，一次拿到两先令四便士，在哪一天都胜过把同样的钱分成六星期，每周只领六便士。普劳特以为自己当场终止了一门恶劣生意，三个人看到的却是一笔及时送到手里的现金。
        - id: ch02-b49
          speaker: beetle
          text: 可借据到底是什么东西？我只在书上见过。
        - id: ch02-b50
          speaker: stalky
          text: 那你现在非造一张不可。
        - id: ch02-b51
          speaker: beetle
          text: 咱们的墨水明天才会变黑。他看得出来吗？
        - id: ch02-b52
          speaker: mcturk
          text: 他正烦着，看不出。斯托基，写一句我欠你两先令四便士，再签名。我替你从普劳特手里弄出钱，你不该感激吗？斯托基本来就不会还。嗨，你这蠢货！
        - id: ch02-b53
          speaker: narrator
          text: 甲虫顺手把钱交给了财务总管斯托基。多年的规矩没那么容易改。
    - id: ch03
      title: 放债调查委员会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 普劳特收下借据，便向甲虫细讲放债的罪恶。他说，放债和强制板球之外的一切东西一样，会败坏各舍，毁掉男孩之间的友爱，让少年变得冷酷又工于算计，还会替一切邪恶打开大门。讲到最后，他问甲虫还知不知道别的例子。若是知道，就该说出来，用这件事证明自己确实后悔了，而且不必提任何人的姓名。
        - id: ch03-b02
          speaker: narrator
          text: 甲虫说自己不知道，至少不能十分确定。他又问，自己怎能出卖朋友？舍里当然也许到处都有这种事。说到这里，他装出痛苦又谨慎的神色，却坚持不敢断言。他做这门生意的时候，从没碰见谁公开跟他竞争。不过，既然普劳特先生认为这件事关系全舍荣誉，也许交给舍长们处理更好。普劳特恰好认为这关系重大。甲虫就靠这些吞吞吐吐的话，一直拖到晚自习过半。
        - id: ch03-b03
          speaker: beetle
          text: 要是这样他还不相信全舍已经烂透了，那我就是好几个荷兰佬。先生，我刚才去了普劳特先生的书房。他说我想坐哪里都行。哦，他的感情简直往外滴。是，先生，我只想蘸一点科克兰的墨水。
        - id: ch03-b04
          speaker: narrator
          text: 祈祷结束后，哈里森和克雷两位高年级舍长怒气冲冲地拦住他们。
        - id: ch03-b05
          speaker: harrison
          text: 甲虫，你们又把赫菲怎么了？他一整晚都在训我们。
        - id: ch03-b06
          speaker: mcturk
          text: 他那清明宁静的殿下为什么训你们？
        - id: ch03-b07
          speaker: harrison
          text: 因为甲虫借钱给斯托基，后来又告诉他，舍里到处都在放债。
        - id: ch03-b08
          speaker: beetle
          text: 别来这一套。我说的是实话。他问这种事多不多，我说我不知道。
        - id: ch03-b09
          speaker: mcturk
          text: 他现在认定你们全是肮脏的放债鬼。幸好没认定你们是贼。他那颗认真尽责的脑袋一旦装进念头，就再也拿不出来。
        - id: ch03-b10
          speaker: stalky
          text: 都是好心，都是为了大家。脑袋卡进排水管，完整忏悔藏在左靴里，本舍荣誉严重受损。
        - id: ch03-b11
          speaker: harrison
          text: 闭嘴！每次我们来训你们，最后总像是你们在训我们。
        - id: ch03-b12
          speaker: craye
          text: 你们太无礼了。
        - id: ch03-b13
          speaker: stalky
          text: 普劳特已经解决了我和甲虫的私事。现在是你们来干涉，我只看得见你们无礼。我们几个聪明用功的小家伙，还眨眼工夫就被舍长找上门。
        - id: ch03-b14
          speaker: mcturk
          text: 他们还没学会分寸，就去招惹本来能帮忙维护本舍荣誉的人。
        - id: ch03-b15
          speaker: craye
          text: 我们才不要你们帮忙！
        - id: ch03-b16
          speaker: beetle
          text: 那还缠着我们做什么？你们平日把舍务管得那么松，普劳特才会以为这里是放债窝。我只借钱给斯托基，案子已经结了。剩下的是你们的事。
        - id: ch03-b17
          speaker: stalky
          text: 如今看来，全舍有一场有组织的阴谋。也许连低年级生都在超出财力地互相借钱。这个可不归我们管，我们只是普通士兵。
        - id: ch03-b18
          speaker: mcturk
          text: 还奇怪我们为什么不愿同本舍来往吗？我们本来安守在自修室，现在却被拖进这种丢脸的事。
        - id: ch03-b19
          speaker: stalky
          text: 你们还在楼梯上威吓我们，为的全是自己该管的事。别忘了，我们不是舍长。
        - id: ch03-b20
          speaker: beetle
          text: 刚才你们还说要用舍长身份揍我们。要是以为这样还能问出什么，那就错了。晚安。
        - id: ch03-b21
          speaker: narrator
          text: 三个人说完晚安，便咚咚跑上楼。他们没有给两位舍长留下追问的机会。三道背影从头到脚都写满了受冤后的美德，仿佛真正遭到无理盘问的是他们，真正失职的则是眼前这两个本该管理全舍的高年级生。
        - id: ch03-b22
          speaker: harrison
          text: 可我们到底做了什么？
        - id: ch03-b23
          speaker: craye
          text: 我不知道。只要同他们打交道，事情总会变成这样。他们说得太像真的。
        - id: ch03-b24
          speaker: narrator
          text: 普劳特先生又把两个好男孩叫进书房。他成功地让自己和两颗无辜的脑袋一起蒙着眼，又往迷惑里沉下十英寻。他大谈应该采取哪些步骤和措施，又谈本舍，以及大家对本舍应有的风气和忠诚，最后叫两位舍长讲究策略地处理。于是他们盘问甲虫，问他是否还同任何别的放债机构有关。甲虫立刻去找舍监，质问哈里森和克雷凭什么重提一桩已经由他和舍监解决的事情。说到受冤后的清白，没有哪个男孩比得上甲虫。
        - id: ch03-b25
          speaker: narrator
          text: 普劳特这才想到，自己对这个犯错的男孩也许不够公平。甲虫毕竟从没否认罪责，也没设法减轻它。他把哈里森和克雷叫来，很温和地斥责他们，不该用那种口气对待一个已经悔改的罪人。两位舍长回到自修室，嘴里全是绝望的话。接着，他们在全舍展开仓促的调查，把低年级生逼得几乎歇斯底里。他们挨个追问钱从哪里来，借给了谁，什么时候归还。男孩们只好翻出每一笔买糖、赔窗户和兑换邮政汇票的小账。两位舍长像发现大案一样记录，最后却只挖出了小男孩之间自然而必然存在的小额借贷。
        - id: ch03-b26
          speaker: junior_boy
          text: 上星期六我打破窗户挨了罚，小桑顿借我一便士，我在凯特铺子花了。后来舅舅寄来五先令，大雷又向我借两便士，放假前会还。我们不知道这样也有错。
        - id: ch03-b27
          speaker: narrator
          text: 两位舍长在这种解释里跋涉了好几个钟头，既没有查出真正的高利贷，也没有找到任何接近甲虫那种豪华利率的东西。学校除了强制运动，本来就没有尊敬舍长的传统。高年级生干脆叫他们少管闲事，无论如何也不肯出来作证。他们公开说哈里森是个蠢货，克雷也是个蠢货，不过最蠢的还是两人的舍监。调查没有恢复秩序，反而让全舍的人都开始谈论一件原本不存在的大案。
        - id: ch03-b28
          speaker: narrator
          text: 一舍人马被彻底搅乱以后，无论人人的良心多么清白，也会分成一簇簇小圈子。暮色里有人偷偷聚会，储藏室里开起委员会，走廊上也挤着窃窃私语的人群。偏偏还有三个坏男孩装出无比秘密的模样，从这一群溜到另一群。他们根本不必小心时，偏要大喊当心。刚把临时编出的鸡毛蒜皮当作秘密说完，又紧跟一句千万别告诉别人。一张极其逼真的阴谋网，就这样罩住了全舍。
        - id: ch03-b29
          speaker: narrator
          text: 几天后，普劳特渐渐觉得自己活在一片四处伏击的空气里。秘密从每一面包围着他。沉重的脚步还没有走到，警报已经抢先传开。他留神去听时，背后总有人压低声音交换口令。麦克特克和斯托基编出许多荒诞无聊的暗语，这些话像火扫过枯草，很快传遍了全舍。
        - id: ch03-b30
          speaker: stalky
          text: 你觉得舍里这种事多不多？
        - id: ch03-b31
          speaker: mcturk
          text: 这个嘛，人总不能太不小心。
        - id: ch03-b32
          speaker: narrator
          text: 这成了一个难得的笑话，也是高利贷调查委员会唯一的实际成果。对一个良知仁厚、用心善良的舍监，它会起什么作用并不难想象。普劳特也不爱隔着很远听见麦克特克把自己叫作人望普劳特。更让他不安的是，有传闻说某个得不到他信任的男孩，常在暮色里的教室讲一些不同寻常的故事。就连精心又温柔的礼貌也不能叫他放心。斯托基待他的方式，正像一个聪明的大人哄着一个迷惑的小孩。
        - id: ch03-b33
          speaker: prout
          text: 本舍的风气变坏了。你们注意到了吗？我并不是在指控谁。
        - id: ch03-b34
          speaker: narrator
          text: 普劳特从不明说自己在指控什么，可反过来说，他每一句话又都像在指控。他怀着世上最良好的用心，把两位舍长一步步逼到健康男孩所能达到、最接近神经烦躁的地步。最糟糕的是，他们偶尔也开始怀疑，斯托基一伙反复声称普劳特是个阴沉的蠢驴，或许真的有几分道理。他们明知不该这样想，却再也不能轻易把这个念头赶走。
        - id: ch03-b35
          speaker: prout
          text: 我不是听见小事就慌张的人。我愿意让全舍自己寻得救赎，只用一只手轻轻引路。可如今这里缺少敬意，荣誉和风气都低落了，甚至有一股冷酷。
        - id: ch03-b36
          speaker: narrator
          text: 普劳特说话时，书房的门半开着。二十副清亮的嗓子托着一支歌，从附近一间教室隐隐约约传来。低年级生很喜欢这支曲子，歌词当然是甲虫写的。歌里一遍又一遍赞美赫菲的高贵和他快活的人望。每个字表面都很规矩，合在一起却正好能把舍监磨得难受。
        - id: ch03-b37
          speakers: [orrin, junior_boy]
          ensemble: duo
          text: 哦，普劳特是位大贵族！我们的赫菲是位大贵族！他为了自己快活的人望，干的事情真不少，不干可就糟！
    - id: ch04
      title: 白旗与凯旋
      blocks:
        - id: ch04-b01
          speaker: prout
          text: 明理的人不会反对一首歌，可一根稻草也能显出风向。你们身为本舍领袖，能查出是谁在直接影响他们吗？
        - id: ch04-b02
          speaker: harrison
          text: 当然能。这一切都是五号室回到教室后开始的。克雷，你也知道，别装作看不见。
        - id: ch04-b03
          speaker: craye
          text: 他们有时确实叫人很难办。哈里森主要是说他们那种态度。
        - id: ch04-b04
          speaker: prout
          text: 也就是说，他们妨碍你们履行职责？
        - id: ch04-b05
          speaker: craye
          text: 倒也没有，先生。他们只站在旁边咧嘴笑，还动不动嗤一声。
        - id: ch04-b06
          speaker: prout
          text: 啊。
        - id: ch04-b07
          speaker: craye
          text: 我想最好让他们回自修室，对全舍都有好处。他们年纪不小了，不适合在教室里晃荡。
        - id: ch04-b08
          speaker: prout
          text: 他们还比奥林、弗林特和另外十几个男孩年轻。
        - id: ch04-b09
          speaker: craye
          text: 可他们不一样。他们很有影响，又能不动声色地搅乱事情，让人抓不到把柄。真要抓时，反倒更麻烦。
        - id: ch04-b10
          speaker: prout
          text: 你们都认为该让他们回去？
        - id: ch04-b11
          speaker: narrator
          text: 两位舍长坚决赞同。哈里森后来对克雷解释，斯托基一伙已经削弱了他们的权威。那三个人个头太大，不能再靠揍来管。高利贷那件事又让两个舍长出了大丑，全校都把他们当笑话。哈里森下学期还要参加桑赫斯特考试，那些疯疯癫癫的事害他少做了一半功课。只要三个人回到自修室，他们也许就能清静一点。
        - id: ch04-b12
          speaker: mcturk
          text: 你好，哈里森。还撑得住吗？熬过去。你看着有点忧郁。监督本舍荣誉很累吧？最近又挖出多少空鸟窝？
        - id: ch04-b13
          speaker: harrison
          text: 听着，我们已经建议普劳特让你们回自修室。
        - id: ch04-b14
          speaker: mcturk
          text: 见鬼，你们真敢这么干！你们凭什么插手我们同舍监的事？谁知道你们利用地位，在背后对他说了多少坏话。如今又特意告诉我，你们偷偷安排了我们什么时候、怎样回去。我真不知道该怎么办。
        - id: ch04-b15
          speaker: craye
          text: 这太不公平了！
        - id: ch04-b16
          speaker: mcturk
          text: 确实。舍长是一回事，助教是另一回事，你们倒两样都包了。
        - id: ch04-b17
          speaker: harrison
          text: 可我们以为你们会高兴啊，火鸡。回去会舒服得多，真的。
        - id: ch04-b18
          speaker: narrator
          text: 麦克特克转开脸，仿佛要藏起感情。随后，他在储藏室找到另外两人。
        - id: ch04-b19
          speaker: mcturk
          text: 他们垮了，已经病了！他们求着赫菲放咱们回五号室。可怜的小家伙！
        - id: ch04-b20
          speaker: stalky
          text: 这是橄榄枝，是白旗。仔细想想，咱们确实把他们弄得够糊涂。
        - id: ch04-b21
          speaker: narrator
          text: 那天茶点刚过，普劳特便把他们叫去。他说，三个人若要荒废功课、毁掉前程，那完全是他们自己的事。不过有一件事必须明白，他再也不能容忍他们在教室里多待一个钟头。他不愿想象，自己得花多少时间，才能消除他们恶劣影响留下的痕迹。至于甲虫究竟怎样迎合了少年想象中卑下的一面，他日后还会查清。甲虫尽可以放心，假如普劳特发现任何腐蚀灵魂的后果，这件事绝不会就此结束。
        - id: ch04-b22
          speaker: beetle
          text: 什么事情的后果，先生？
        - id: ch04-b23
          speaker: narrator
          text: 麦克特克暗中踢了他的脚踝，怪他被普劳特钓住。普劳特说甲虫心里清楚，又说自己暂代父母，必须保护那些没受污染的伙伴，最后交还了自修室钥匙。
        - id: ch04-b24
          speaker: beetle
          text: 那个想象中卑下的一面到底是什么？
        - id: ch04-b25
          speaker: mcturk
          text: 你为什么总得替自己辩白？我真该踢破你的脚踝。怎么谁都能套出你的话？
        - id: ch04-b26
          speaker: beetle
          text: 他没套话。我准是在不知道的时候挠中了哪里。早知道还能再磨几下，可惜迟了。他到底指什么？
        - id: ch04-b27
          speaker: stalky
          text: 别管。我早说过，咱们能把这里变成快乐的小家，只是没想到这么快。
        - id: ch04-b28
          speaker: narrator
          text: 事情过后，普劳特在教员休息室里无比坚定地说，约翰牧师的判断错了。不错，他已经让那三个男孩回了自修室。面对哈托普对这场不道德妥协的取笑，他先叫大家等一等。就他那一舍而言，过去十天没有一分钟安生日子。可他仍说，送三个人回去并不表示自己改变了看法。那是为了公正对待其他男孩，也是为了保护自己。
        - id: ch04-b29
          speaker: hartopp
          text: 你对抄袭向来那么坚决，却肯妥协，真不道德。
        - id: ch04-b30
          speaker: chaplain
          text: 等等。我们过去十天都忍得肝肠寸断。你老实说，从那以后有过一分钟安生日子吗？
        - id: ch04-b31
          speaker: prout
          text: 就我那一舍而言，没有。可你看错了他们。为了别人，也为了保护自己，我只能送他们回去。他们的道德影响根本无法形容。
        - id: ch04-b32
          speaker: narrator
          text: 于是，普劳特一点一点讲出自己的故事。他先说甲虫怎样经营放债生意，自己又怎样及时制止。接着说甲虫暗示全舍都可能卷了进去，害舍长们不得不调查。最后，他说到本舍风气怎样一天天败坏，连两位最可靠的舍长都被逼得走投无路，亲自来求他把三个人赶走。
        - id: ch04-b33
          speaker: king
          text: 甲虫扮放债人，倒是新鲜。我事后也听见过一点传闻，不过没有打听。我从不干涉。
        - id: ch04-b34
          speaker: hartopp
          text: 只要甲虫算最简单的复利时少错三处，我愿意白送他五先令。
        - id: ch04-b35
          speaker: mason
          text: 你也上当了，跟我一模一样！
        - id: ch04-b36
          speaker: hartopp
          text: 所以你真的办了调查？
        - id: ch04-b37
          speaker: prout
          text: 是那男孩自己暗示，舍里这种事很多。
        - id: ch04-b38
          speaker: chaplain
          text: 暗示这一手，他早练到顶了。不过本舍荣誉后来怎样？
        - id: ch04-b39
          speaker: prout
          text: 他们只用一个星期，就把本舍的风气彻底败坏了。我为了树立那种风气，努力了好多年。连我舍里的舍长都不得不来求救。男孩们本来不愿告彼此的状，可那两个孩子实在无路可走，只能求我赶走他们。你说三个人信任你，他们也许会对你讲另一套故事。至于我，他们尽管照自己的路下地狱去吧。我已经受够他们了。
        - id: ch04-b40
          speaker: narrator
          text: 普劳特怨恨地表示，那三个人大可以照自己的路下地狱去。真正带着笑容下地狱的却是约翰牧师。他离开休息室，径直去了五号室。那里的男孩刚收拾完一顿愉快的小宴，花费恰好是两先令四便士。三个人正准备开始晚自习，约翰牧师便走了进来。
    - id: ch05
      title: 神父来问真相
      blocks:
        - id: ch05-b01
          speaker: stalky
          text: 进来，神父。快坐最好的椅子。这十天咱们只在公事场合见过您。
        - id: ch05-b02
          speaker: chaplain
          text: 你们当时在服刑，我不跟罪犯来往。
        - id: ch05-b03
          speaker: mcturk
          text: 可我们已经恢复身份了。普劳特先生回心转意啦。
        - id: ch05-b04
          speaker: beetle
          text: 我们的品格没留下一点污痕。那段插曲真痛苦，神父。
        - id: ch05-b05
          speaker: chaplain
          text: 那就认真想想。我今晚正为你们的品格而来。照本校的说法，你们究竟把普劳特先生那一舍弄成了什么样？这不是笑话。他说你们把风气败坏到底，只好送你们回来。是真的吗？
        - id: ch05-b06
          speaker: mcturk
          text: 句句属实，神父。
        - id: ch05-b07
          speaker: chaplain
          text: 别耍嘴皮子。我常说，全校没有谁比你们三个更能造成好影响，也没有谁更能造成坏影响。我不爱跟小孩子谈那些还听不懂的伦理，可也不愿相信你们在把低年级生带坏。普劳特觉得你们用什么办法腐蚀了伙伴。
        - id: ch05-b08
          speaker: beetle
          text: 普劳特先生的念头太多了。这回又是哪一个？
        - id: ch05-b09
          speaker: chaplain
          text: 黄昏时，他听见你压低声音讲故事。他一推门，奥林就叫你闭嘴，说太恶心了。怎么解释？
        - id: ch05-b10
          speaker: beetle
          text: 您借我的《被围困的城市》还记得吗？我照那个意思，写一所大雾里的学校，被死去学生的鬼围住。鬼会把人从寝室床上拖走，名字全是真的。讲时当然要压低声音，再一个个念名字。奥林不喜欢，他们谁也没让我说完。最后一段才真可怕。
        - id: ch05-b11
          speaker: chaplain
          text: 那你为什么不向普劳特解释，反而让他一直以为……
        - id: ch05-b12
          speaker: mcturk
          text: 神父老爷，解释没有用。他不得到这个印象，也会得到另一个。
        - id: ch05-b13
          speaker: stalky
          text: 他全是出于最好的动机，还暂代父母呢。
        - id: ch05-b14
          speaker: chaplain
          text: 你们这几个小魔鬼！那放债生意也是他的另一个印象？
        - id: ch05-b15
          speaker: stalky
          text: 我们稍微帮了一点忙。我确实欠甲虫两先令四便士，至少他这么说，不过从没打算还。我们在楼梯上争了几句，普劳特正好撞进来。他像个快活的公爵，当场替我付了钱，再从我的零用钱扣掉。甲虫也给了他一张借据。后来怎样，我就不知道了。
        - id: ch05-b16
          speaker: beetle
          text: 我一向太诚实。他先有了一个印象，我本该纠正。可我不能完全确定，他那一舍没有人人放债。舍长们应该知道得更多，他们可是公学荣誉的守护神。
        - id: ch05-b17
          speaker: mcturk
          text: 等调查完，他们果然全知道了。那两个最认真、最善良、最正直的男孩，把全舍翻了个底朝天，全出于最好的动机。
        - id: ch05-b18
          speaker: stalky
          text: 他们自己说得又清楚又响亮。
        - id: ch05-b19
          speaker: chaplain
          text: 我看你们三个将来都免不了上绞架。
        - id: ch05-b20
          speaker: mcturk
          text: 可我们什么也没做，都是普劳特先生自己做的。您读过日本摔跤手的书吗？我舅舅从海军寄来一本。
        - id: ch05-b21
          speaker: chaplain
          text: 别岔开话题，火鸡。
        - id: ch05-b22
          speaker: mcturk
          text: 我是在举例，就跟讲道时一样。书里的日本摔跤手有个诀窍。他们先让对手把全身的力气都使出来，自己却不硬顶。等对手再也收不住，他们只要轻轻一扭，那个人便会用自己的力气把自己摔倒。那招叫什么涩步威奇，也许又叫床之间，反正是差不多的怪名字。普劳特先生就是这种摔跤手，他是自己把自己摔倒的，不能算我们的错。
        - id: ch05-b23
          speaker: beetle
          text: 您真以为我们到处腐蚀低年级生？他们本来就没有心灵，有也早坏完了。我自己也做过低年级生。
        - id: ch05-b24
          speaker: chaplain
          text: 我原以为知道你们能坏到什么程度。可你们费尽力气堆出一整套对自己不利的旁证，别人相信了，你们也怪不得谁。
        - id: ch05-b25
          speaker: stalky
          text: 我们谁也不怪。我们没说过普劳特一句坏话。我们爱他，他根本不知道我们有多爱他。
        - id: ch05-b26
          speaker: chaplain
          text: 你们藏得真好。可想过没有，一开始是谁害你们被赶出去的？
        - id: ch05-b27
          speaker: stalky
          text: 是普劳特先生赶的。
        - id: ch05-b28
          speaker: chaplain
          text: 其实是我。我无意这样，可我说的几句话，恐怕让他得了一个印象。
        - id: ch05-b29
          speaker: narrator
          text: 五号自修室的三个人听完，立刻放声大笑。事情原来是约翰牧师无意间给了普劳特第一个印象，普劳特再凭那个印象，把他们赶进公共教室。而他们又利用他后来每一个印象，让整舍人陪着折腾了十天。约翰牧师原本想提醒朋友避开灾祸，最后却亲手把朋友推进了灾祸。这个圆圈完整得叫三个人无法忍住笑声，也把麦克特克刚才那个日本摔跤手的比方证明得再清楚不过。
        - id: ch05-b30
          speaker: mcturk
          text: 您看，您的事也完全一样。他很容易得到一个印象。不过别以为我们不爱他，他身上一盎司恶意也没有。
    - id: ch06
      title: 明目张胆的不公平
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 门上响了两下。
        - id: ch06-b02
          speaker: foxy
          text: 校长要五号自修室的人立刻去书房。
        - id: ch06-b03
          speaker: chaplain
          text: 嚯！我看有些人要大难临头了。
        - id: ch06-b04
          speaker: stalky
          text: 我的老天，普劳特先生去告诉校长了！他真像一艘两头都能开火的道德炮艇。舍内争端还把校长扯进来，不公平。
        - id: ch06-b05
          speaker: chaplain
          text: 我建议你们带本练习簿，垫在安全可靠的地方。
        - id: ch06-b06
          speaker: beetle
          text: 他只打肩膀，练习簿拍起来会像该死的谷仓门。晚安，神父。咱们要倒霉了。
        - id: ch06-b07
          speaker: narrator
          text: 彼列、玛门和路西法又一次站在校长面前。可这回要对付的这个人，比三个人合起来还要狡猾。普劳特已经用沉重而忧伤的语气，对校长讲了整整半小时。他只看见全舍风气败坏，舍长束手无策，三个男孩始终在旁边露出无辜的脸。可那些被舍监漏掉的东西，校长全都看见了。他明白他们没有直接做下可以逐条定罪的事，也明白一切混乱都从他们那里发端。
        - id: ch06-b08
          speaker: headmaster
          text: 你们一直在烦扰普劳特先生。舍监留在这里，不是让男孩过分烦扰的。我不喜欢为这种事情费心，可如今你们又来烦扰我。这是很严重的过错，明白吗？
        - id: ch06-b09
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 明白，先生。
        - id: ch06-b10
          speaker: headmaster
          text: 那么，因为你们占用了我的时间，我也打算出于私人的理由来烦扰你们。只是你们的个头已经太大，不能再用藤条抽了。我只好另想办法表示不满。比如每人罚抄一千行，禁足一个星期，再加上几样差不多的东西。你们确实已经太大，不能挨藤条了，对吧？
        - id: ch06-b11
          speaker: stalky
          text: 哦，不，先生。
        - id: ch06-b12
          speaker: headmaster
          text: 好极了，那我们尽力而为。我真希望你们别再来烦我。
        - id: ch06-b13
          speaker: narrator
          text: 夏季学期禁足一个星期可不是小事。校长却没有多说，真的拿起了藤条。他抽得公平、持久又均匀，落条时还略微往回一带。可三个人感受最深的，并不是那种彻底的打法，而是他每抽一下便停下来讲几句话。这种从容讲话的不公平，比藤条本身更叫人难受。
        - id: ch06-b14
          speaker: headmaster
          text: 在下层阶级，这会叫我被控人身攻击。你们应当珍惜自己的特权。凡事都有一个限度，甲虫，人得靠经验找出它。私人报复越过限度，就不再安全。别动。它迟早会撞上更高的权威，而那权威早就研究透了这种动物。麦克特克，过来。就连我也曾在阿卡迪亚住过。这种明目张胆的不公平，应该很合你的脾气。好了，就这些。去告诉舍监，我已经正式用藤条抽过你们。
        - id: ch06-b15
          speaker: mcturk
          text: 我的老天，这才是真家伙！普鲁士人贝茨的眼力直得要命。
        - id: ch06-b16
          speaker: stalky
          text: 我主动要求挨藤条，不接受罚抄，是不是很狡猾？
        - id: ch06-b17
          speaker: beetle
          text: 胡扯，一开始就注定要挨。我看他那个老眼神就知道。我差一点真哭出来。
        - id: ch06-b18
          speaker: stalky
          text: 我也没真的笑出来。
        - id: ch06-b19
          speaker: beetle
          text: 去盥洗室看看伤吧。一个人举镜子，另外两个歪过身子瞧。
        - id: ch06-b20
          speaker: narrator
          text: 三个人到了盥洗室，一个举着镜子，另外两个歪过身子察看，照这个办法忙了大约十分钟。每个人肩上的鞭痕都又红又整齐。他们认真比较了一遍。论彻底，论效率，再论那种像艺术家手笔一样清晰的轮廓，三个人的伤势没有一分一毫的差别。
        - id: ch06-b21
          speaker: prout
          text: 你们在下面做什么？
        - id: ch06-b22
          speaker: stalky
          text: 我们刚挨了校长的藤条，先生，正在洗血。校长叫我们告诉您，我们本来正要去报告。
        - id: ch06-b23
          speaker: stalky
          text: 赫菲这回得一分！
        - id: ch06-b24
          speaker: mcturk
          text: 这个可怜虫总该得点分，他也配。从开场到现在，咱们害他足足瘦了一英石半。
        - id: ch06-b25
          speaker: beetle
          text: 可为什么咱们一点也不恨校长？他说这是明目张胆的不公平。可不就是吗！
        - id: ch06-b26
          speaker: mcturk
          text: 亲爱的老兄。
        - id: ch06-b27
          speaker: narrator
          text: 麦克特克说完便不再解释。斯托基却笑得只能扶住洗脸池。
        - id: ch06-b28
          speaker: beetle
          text: 你这个可笑的蠢驴！笑什么？
        - id: ch06-b29
          speaker: stalky
          text: 我在想，这件事到底有多么明目张胆地不公平！
