    boy_2: {display_name: Second Boy, tts: {delivery: "cautious and solemnly playful", timbre: "youthful and light", pace: moderate, pitch: medium}}
  chapters:
    - id: ch01
      title: A Warning in the Chaplain's Study
      blocks:
        - {id: ch01-b01, speaker: narrator, text: "Four house-masters came to the chaplain's study for a Saturday-night smoke. Three pipes and one cigar filled the room, but their friendly talk proved Reverend John Gillett's skill. Since the dead-cat affair, King had been quick to see insults. For a week the fat, mustached, even-tempered chaplain had worked to restore peace, and now he smiled at four sorely tried men who were speaking with little malice."}
        - {id: ch01-b02, speaker: reverend_john, text: "I accuse the boys of nothing. I only notice that whenever anyone acts directly against Number Five study, the person who acts generally ends up humiliated."}
        - {id: ch01-b03, speaker: king, text: "I deny it. I crush that ridiculous Beetle daily for his soul's good, and I deal with the other two as well."}
        - {id: ch01-b04, speaker: reverend_john, text: "Think back two years. You and Prout pursued them for huts and trespass. Have you forgotten Colonel Dabney? Then you drove them from the rooms over your study for making vile noises, and that very evening your study was wrecked."}
        - {id: ch01-b05, speaker: narrator, text: "The others laughed. King disliked remembering how he had once looked like a poacher."}
        - {id: ch01-b06, speaker: king, text: "Rabbits-Eggs wrecked it from the road while he was horribly drunk. What has that to do with Number Five?"}
        - {id: ch01-b07, speaker: reverend_john, text: "Only this. Each punishment suits the offense. After your house called them stinkers, a dead cat chose the one hidden place where it could plague you most. You accused them of trespass and somehow you and Prout became the trespassers. You evicted them and your own study became unlivable. Coincidence has a very long arm."}
        - {id: ch01-b08, speaker: king, text: "The cat lay under doubled floorboards in White's dormitory. No boy could have lifted those boards without leaving a mark. And Rabbits-Eggs truly was extraordinarily drunk."}
        - {id: ch01-b09, speaker: reverend_john, text: "Then fortune favors the three. Personally, I like them, and I value the little confidence they give me. They call me Padre and leave me in peace, so they do not offer me false confessions of theft."}
        - {id: ch01-b10, speaker: prout, text: "You mean Mason's affair. It was scandalous. The Head should have investigated it. Mason may be mistaken, but he is sincere and means well."}
        - {id: ch01-b11, speaker: reverend_john, text: "Mason believed a silly accusation of theft and accepted one boy's evidence without inquiry. Frankly, he deserved what followed."}
        - {id: ch01-b12, speaker: prout, text: "They wounded his best feelings on purpose. One word to me would have stopped it, but they chose to draw him on."}
        - {id: ch01-b13, speaker: king, text: "I dislike Mason for the very reason you praise him. He means well."}
        - {id: ch01-b14, speaker: hartopp, text: "Theft is not in our criminal tradition, at least not theft from one another."}
        - {id: ch01-b15, speaker: macrea, text: "That is broad talk from the master of a house that carried off seven cattle from Northam."}
        - {id: ch01-b16, speaker: hartopp, text: "Exactly. Cattle raids, lifted gates, a little poaching, and hawk-hunting save us. I would rather manage any amount of ingenious mischief than certain quieter offenses."}
        - {id: ch01-b17, speaker: prout, text: "Those three are abnormal and unsound. Their performances prepare the way for worse harm. I may have to separate them."}
        - {id: ch01-b18, speaker: macrea, text: "They have gone through school together for six years. I would not care to try it."}
        - {id: ch01-b19, speaker: king, text: "Their royal we annoys me. Ask Corkran for his prose and he says, 'We haven't finished it. We'll bring it soon.' The other two do the same."}
        - {id: ch01-b20, speaker: hartopp, text: "That we has power. McTurk may understand my trigonometry, but Beetle knows no more of sines and cosines than an animal. He calmly copies Stalky, who delights in mathematics."}
        - {id: ch01-b21, speaker: prout, text: "Why don't you stop him?"}
        - {id: ch01-b22, speaker: hartopp, text: "Examinations stop him. Beetle submits blank pages and trusts his English to save him. I suspect he writes verse during my lessons."}
        - {id: ch01-b23, speaker: king, text: "I wish he spent that energy on elegiacs. Except for Stalky, he writes the vilest barbarous hexameters I know."}
        - {id: ch01-b24, speaker: reverend_john, text: "The study divides its work. Stalky does mathematics, McTurk Latin, and Beetle English and French. When Beetle was in the sick-house last month, their French translations clearly declined."}
        - {id: ch01-b25, speaker: prout, text: "He was pretending illness. The arrangement is systematic cheating, and I have always opposed private studies."}
        - {id: ch01-b26, speaker: hartopp, text: "Every study contains boys who help each other. Number Five has merely made a system of it. You cannot teach a cow to play the violin."}
        - {id: ch01-b27, speaker: reverend_john, text: "Besides, they confessed under a seal of confidence. Do not make me a witness. If they learn I informed on them, I lose a relationship I value."}
        - {id: ch01-b28, speaker: prout, text: "Your attitude is weak. It would be better to break up the study for a while."}
        - {id: ch01-b29, speaker: macrea, text: "Do it, then. We shall see whether Gillett's theory is right."}
        - {id: ch01-b30, speaker: reverend_john, text: "Leave them alone, Prout, or disaster will catch you, and they will be annoyed with me. I am too fat to be harried by bad boys."}
        - {id: ch01-b31, speaker: prout, text: "They would not dare. I must think out my duty, because in intention they cheated."}
        - {id: ch01-b32, speaker: reverend_john, text: "He may put them on their honor, and I am the fool who gave him the notion. I shall never again forget that a master is not an ordinary man. There will be trouble."}
    - id: ch02
      title: Back Among the House
      blocks:
        - {id: ch02-b01, speaker: narrator, text: "Trouble came from a clear sky while the boys still celebrated the cat war. Prout entered Number Five, lectured them on cheating, and ordered them into the public form-rooms on Monday. Their supposed offense was common to nearly every study, so they raged alone and together through Sunday."}
        - {id: ch02-b02, speaker: stalky, text: "Cursing won't help. We're all in the same boat. Back we go to the house, with a locker in the form-room and a seat at prep in Number Twelve."}
        - {id: ch02-b03, speaker: narrator, text: "He looked sadly around the comfortable study that McTurk, their leader in art, had decorated with a painted border, stencils, and patterned curtains."}
        - {id: ch02-b04, speaker: mcturk, text: "Heffy will lumber into the room like a dirty old retriever to see if we're plotting. He never leaves his house alone now. It will be delightful."}
        - {id: ch02-b05, speaker: beetle, text: "Why aren't you watching cricket? I like a strong, healthy boy. Don't mope indoors. Why don't you care about your house? Yah!"}
        - {id: ch02-b06, speaker: stalky, text: "Why don't we care? Let's begin. We'll take endless interest in the house. He hasn't put us there for a year, and we've learned plenty. Remember Belial in one of those school stories? I shall be Belial."}
        - {id: ch02-b07, speaker: beetle, text: "I'll be Mammon and lend money at a penny a week on every shilling. That happens in all the school stories and should shake Heffy's mind. Turkey can be Lucifer."}
        - {id: ch02-b08, speaker: mcturk, text: "What must Lucifer do?"}
        - {id: ch02-b09, speaker: stalky, text: "Lead conspiracies, secret clubs, and boycotts. Practice the stealthy intrigue Heffy always talks about."}
        - {id: ch02-b10, speaker: narrator, text: "The house greeted their fall with jokes and sympathy. Since the three normally kept apart, everyone found them especially interesting."}
        - {id: ch02-b11, speaker: stalky, text: "Just like old times. We've come to play with you, young friends, because our beloved house-master threw us out."}
        - {id: ch02-b12, speaker: orrin, text: "Serves you right, you cheats!"}
        - {id: ch02-b13, speaker: stalky, text: "That won't do, dear Orrin. We cannot preserve our glorious reputation if you say such things."}
        - {id: ch02-b14, speaker: narrator, text: "They closed around Orrin, pushed him through an open window, lowered the sash onto his neck, tied his thumbs behind him, and removed his shoes when he kicked. Prout found him trapped and helpless among boys who were helpless with laughter."}
        - {id: ch02-b15, speaker: narrator, text: "Stalky gathered allies upstairs. Orrin soon charged in with a boarding party. Dust filled the room as boys wrestled and yelled. A desk vanished, fighters split a door panel, a window broke, and a gas jet fell. The three escaped and sent every passer-by into the battle."}
        - {id: ch02-b16, speakers: [stalky, beetle, mcturk], ensemble: chorus, text: "Rescue! Kings to Number Twelve! Prouts, Macreas, and Hartopps, come to the rescue!"}
        - {id: ch02-b17, speaker: narrator, text: "Juniors swarmed upstairs without asking questions and joined the fight. The three sat on King's railings until prep to establish an alibi."}
        - {id: ch02-b18, speaker: stalky, text: "Mix the houses into one scuffle and some fool always begins a real row. Hullo, Orrin. You look confused."}
        - {id: ch02-b19, speaker: orrin, text: "It was your fault! We each have two hundred lines, Heffy is hunting you, and Malpas gave me this eye!", emotion: angry}
        - {id: ch02-b20, speaker: stalky, text: "Who called us cheats? Can't your little mind join cause to effect? One day you'll learn that joking with Number Five doesn't pay."}
        - {id: ch02-b21, speaker: beetle, text: "Where is the shilling you owe me?"}
        - {id: ch02-b22, speaker: narrator, text: "Stalky could not see Prout behind him, but he followed the lead without a tremor."}
        - {id: ch02-b23, speaker: stalky, text: "I owed only ninepence, you old money-lender."}
        - {id: ch02-b24, speaker: mcturk, text: "You forgot the interest. Beetle charges a halfpenny a week on every shilling."}
        - {id: ch02-b25, speaker: beetle, text: "Pay me, or I'll charge interest on the interest. I have your written promise!"}
        - {id: ch02-b26, speaker: mcturk, text: "Hush!"}
        - {id: ch02-b27, speaker: prout, text: "I did not see you in that disgraceful riot. Beetle, do you commonly lend money to your companions?"}
        - {id: ch02-b28, speaker: beetle, text: "Not ordinarily, sir."}
        - {id: ch02-b29, speaker: prout, text: "It is a disgraceful habit. Even with my opinion of you, I did not imagine this vice. How much have you lent Corkran?"}
        - {id: ch02-b30, speaker: beetle, text: "I don't quite know, sir."}
        - {id: ch02-b31, speaker: mcturk, text: "I believe it is two shillings and fourpence."}
        - {id: ch02-b32, speaker: narrator, text: "That was the exact sum McTurk and Beetle claimed from pawning Stalky's second-best Sunday trousers. Stalky called it his commission and had spent it on food for the study."}
        - {id: ch02-b33, speaker: prout, text: "You will cease money-lending. Your influence is bad enough without buying power over your companions. Bring me Corkran's promise to pay. Corkran, I shall deduct this from your allowance."}
        - {id: ch02-b34, speaker: narrator, text: "To their joy, Prout paid two shillings and fourpence from his pocket. A lump sum mattered far more to hungry boys than weekly coins."}
        - {id: ch02-b35, speaker: beetle, text: "What is a promise to pay? I have only read about one."}
        - {id: ch02-b36, speaker: stalky, text: "Now you must make one."}
        - {id: ch02-b37, speaker: mcturk, text: "Write that you owe two shillings and fourpence and sign it. Aren't you grateful I got the money? Stalky would never have paid. Why, you idiot!"}
        - {id: ch02-b38, speaker: narrator, text: "From long habit, Beetle had handed the cash to Stalky, treasurer of Number Five. In exchange for the freshly made promise, Prout explained at length that lending money corrupted houses, destroyed friendship, made boys cold and calculating, and opened every door to evil. At last he asked whether Beetle knew of other cases. If he did, then naming them would prove his repentance. Beetle need not mention names, Prout assured him. Beetle answered with painful delicacy. How could he give evidence against friends? The house might be full of the practice, but he was not in a position to say. He had encountered no open competition in his trade. If Prout truly regarded it as a question of the house's honor, perhaps the prefects were better placed to investigate. Prout agreed that the honor of the house was exactly what concerned him."}
        - {id: ch02-b39, speaker: beetle, text: "I can't be certain, sir. I could hardly give evidence against my friends. The house might be full of it, though I have met no open competitor. If the honor of the house is involved, perhaps the prefects would know better."}
        - {id: ch02-b40, speaker: narrator, text: "Beetle kept Prout occupied until halfway through prep, then returned glowing with success."}
        - {id: ch02-b41, speaker: beetle, text: "If he doesn't now believe the whole house is rotten with lending, I'm several Dutchmen. He is dripping with emotion."}
    - id: ch03
      title: The Usury Commission
      blocks:
        - {id: ch03-b01, speaker: narrator, text: "After prayers, Harrison and Craye, the senior house-prefects, stopped the three on the way to the dormitories."}
        - {id: ch03-b02, speaker: harrison, text: "What have you done to Heffy now, Beetle? He has lectured us all evening about you lending Stalky money and claiming money-lending fills the house."}
        - {id: ch03-b03, speaker: beetle, text: "I claimed nothing. He asked whether there was much of it, and I truthfully said I didn't know."}
        - {id: ch03-b04, speaker: mcturk, text: "He thinks you are filthy usurers. Be glad he doesn't think you're burglars. Once an idea enters his conscientious head, it never leaves."}
        - {id: ch03-b05, speaker: stalky, text: "A well-meaning man. Did everything for the best. Head in a drainpipe and a full confession hidden in the left boot. Very bad for the honor of the house."}
        - {id: ch03-b06, speaker: harrison, text: "Stop it. Whenever we come to correct you, you behave as if you are correcting us."}
        - {id: ch03-b07, speaker: craye, text: "You are much too insolent."}
        - {id: ch03-b08, speaker: stalky, text: "The insolence seems to be yours. You are interfering in a private matter between Beetle and me after Prout settled it."}
        - {id: ch03-b09, speaker: mcturk, text: "Clever little scholars become prefects before they learn tact. Then they trouble boys who could help them guard the honor of the house."}
        - {id: ch03-b10, speaker: craye, text: "We do not want your help!", emotion: angry}
        - {id: ch03-b11, speaker: beetle, text: "Then why bother us? You have watched the house so badly that Prout believes it is a nest of money-lenders. I admitted lending to Stalky and no one else. The rest belongs to you."}
        - {id: ch03-b12, speaker: stalky, text: "Now we discover an organized conspiracy. For all we know, younger boys borrow beyond their means. We are only ordinary members, not prefects."}
        - {id: ch03-b13, speaker: mcturk, text: "We kept quietly to our study until we were expelled. Now you drag us into this shameful business and bully us on the stairs."}
        - {id: ch03-b14, speaker: beetle, text: "You even threatened to beat us. If you expect that approach to win our help, you are mistaken. Good night."}
        - {id: ch03-b15, speaker: narrator, text: "They marched upstairs wearing injured virtue like a uniform."}
        - {id: ch03-b16, speaker: harrison, text: "What in the world have we done?"}
        - {id: ch03-b17, speaker: craye, text: "I don't know. It always ends this way with them. They sound so horribly reasonable."}
        - {id: ch03-b18, speaker: narrator, text: "Prout called the prefects back and sank his own mind and theirs another ten fathoms into blind confusion. He spoke grandly of steps and measures, the tone of the house, and loyalty both in the house and toward it. Then he urged them to handle the matter tactfully. Harrison and Craye obeyed by demanding whether Beetle had any connection with another lending establishment. Beetle promptly went to Prout and asked by what right they had reopened a matter already settled between culprit and house-master. No boy could perform injured innocence better. It occurred to Prout that he might have treated Beetle unfairly, since the supposed culprit had neither denied nor excused his offense. He summoned Harrison and Craye and gently reproved their manner toward a repentant sinner. When the prefects returned to their room, they used the language of despair."}
        - {id: ch03-b19, speaker: narrator, text: "Then the prefects began a headlong inquiry through the house. They drove the younger boys nearly into hysterics and uncovered, with tremendous ceremony, the natural little system of loans that exists wherever small boys live together. One child had borrowed a penny after being fined for a broken window and spent it at the tuck shop. Another had lent twopence from a five-shilling postal order sent by an uncle. Repayment would come before the holidays. Neither lender nor borrower had imagined there was anything wrong. Harrison and Craye had to hear every date, every penny, every promise, and every visit to Keyte's."}
        - {id: ch03-b20, speaker: thornton_minor, text: "Harrison, you see, I lent a penny last Saturday because I had been fined for the broken window, and it was spent at Keyte's. I didn't know that was wrong. Wray Major borrowed twopence after my uncle sent me five shillings, but he'll repay it before the holidays."}
        - {id: ch03-b21, speaker: narrator, text: "For hours the prefects waded through similar stories. They found no usury and nothing remotely like Beetle's splendid rate of interest. The older boys felt no traditional respect for prefects outside compulsory games. They refused every demand for evidence and told the investigators plainly to mind their own business. Their judgment was short and unanimous. Harrison was one idiot, Craye was another, and their house-master was the greatest idiot of all."}
        - {id: ch03-b22, speaker: narrator, text: "Even a house with a clean conscience breaks into knots and private circles when it is thoroughly disturbed. There were little meetings in the twilight, committees in box-rooms, and conferences along the corridors. Through every group moved three wicked boys with an immense show of secrecy. They cried warnings when no caution was needed. They whispered, 'Don't tell,' immediately after sharing worthless confidences invented on the spot. A fine atmosphere of plots and secret intrigue soon wrapped the entire house."}
        - {id: ch03-b23, speaker: narrator, text: "Within a few days, Prout realized that he moved through an atmosphere of perpetual ambush. Mysteries surrounded him on every side. Warnings ran ahead of his heavy feet, while passwords were muttered behind his attentive back. Stalky and McTurk invented absurd, useless phrases that swept through the house like fire through dry grass. The only practical result of the great inquiry into usury became a solemn exchange between one boy and another."}
        - {id: ch03-b24, speaker: boy_1, text: "Do you think there is much of it going on in the house?"}
        - {id: ch03-b25, speaker: boy_2, text: "Well, one cannot be too careful, you know."}
        - {id: ch03-b26, speaker: narrator, text: "Imagine the effect on a humane and conscientious house-master. A man who had sincerely devoted himself to winning his pupils' respect did not enjoy hearing himself described, even from a distance, as Popularity Prout by a dark, scowling Celt with a fluent tongue. Rumors also reached him that unusual stories were being whispered in the form-rooms between the lights by a boy he did not trust. Even elaborate, tender politeness could not soothe him. Stalky wrapped Prout in the kind of courtesy a wise grown man might offer to a bewildered child, and every gentle word made Prout more uneasy."}
        - {id: ch03-b27, speaker: prout, text: "The tone of the house has changed for the worse. Have you noticed? I accuse no one. I prefer the house to save itself, with only a light hand on the reins, but there is less reverence and a hardness in matters touching its honor."}
        - {id: ch03-b28, speaker: narrator, text: "Prout never accused anyone directly, yet somehow he never did anything else. With the finest intentions in the world, he had reduced the prefects to a state as close to nervous irritation as healthy boys could reach. Worst of all, there were moments when Harrison and Craye privately wondered whether Stalky and his companions might possess a grain of truth in their endlessly repeated claim that Prout was a gloomy ass."}
        - {id: ch03-b29, speakers: [boy_1, boy_2, orrin, thornton_minor], ensemble: chorus, text: "Oh, Prout is a nobleman! Our Heffy is a nobleman! He does an awful lot, because his giddy popularity would suffer if he did not!"}
        - {id: ch03-b30, speaker: narrator, text: "Twenty clear voices carried Beetle's song through an open door. The younger boys liked the tune."}
        - {id: ch03-b31, speaker: prout, text: "No sensible man objects to a song, but small signs reveal the wind. Can you trace this to any direct influence? I ask you as heads of the house."}
        - {id: ch03-b32, speaker: harrison, text: "There is no doubt, sir. It began when Number Five entered the form-rooms. Craye knows it too."}
        - {id: ch03-b33, speaker: craye, text: "They make our work difficult. It is mostly their manner. They watch, grin, and turn up their noses. The house would be better if they returned to their study."}
        - {id: ch03-b34, speaker: prout, text: "They are younger than Orrin, Flint, and a dozen others. Do they prevent you from doing your duty?"}
        - {id: ch03-b35, speaker: craye, text: "Not exactly. But they influence everyone and upset things quietly. When we try to grasp what they have done, there is nothing we can hold."}
        - {id: ch03-b36, speaker: narrator, text: "Both prefects strongly recommended sending them back. Later Harrison explained the reasons to Craye. Number Five had weakened their authority. The three were too large to beat, had made a public exhibition of both prefects over the money-lending business, and turned them into a joke throughout the school. Harrison hoped to enter Sandhurst next term, but their lunacy had already destroyed half his working time. If they returned to their own study, perhaps everyone else could have a little peace."}
        - {id: ch03-b37, speaker: mcturk, text: "Hullo, Harrison. Still bearing up? Good. Live it down. You look thoughtful. Is guarding the house's honor exhausting? Found any imaginary crimes lately?"}
        - {id: ch03-b38, speaker: harrison, text: "We recommended that Prout let you return to your study."}
        - {id: ch03-b39, speaker: mcturk, text: "You did what? Who are you to interfere between us and our house-master? Perhaps you use your office to prejudice him against us. Now you admit making secret arrangements behind our backs. I hardly know what we should do."}
        - {id: ch03-b40, speaker: craye, text: "That is horribly unfair!", emotion: angry}
        - {id: ch03-b41, speaker: mcturk, text: "It is. A prefect is one thing and a junior master another, but you combine them. You recommend everything, even when and how we may return."}
        - {id: ch03-b42, speaker: harrison, text: "We thought you would like it, Turkey. We truly did. You will be much more comfortable there."}
        - {id: ch03-b43, speaker: narrator, text: "McTurk turned away as though overcome. Then he found Stalky and Beetle in a box-room."}
        - {id: ch03-b44, speaker: mcturk, text: "They're broken. They've begged Heffy to send us back. Poor little devils!"}
        - {id: ch03-b45, speaker: stalky, text: "The olive branch and the white flag together! We really have bewildered them."}
    - id: ch04
      title: Number Five Restored
      blocks:
        - {id: ch04-b01, speaker: narrator, text: "After tea, Prout summoned the three. If they chose to ruin their futures by neglecting work, he announced, that was entirely their affair. Their presence in the public rooms, however, could not be tolerated another hour. He did not care to think how long he would spend removing every trace of their evil influence. He would later discover exactly how far Beetle had fed the baser side of youthful imagination. If he found any soul-corrupting consequences, Beetle could be certain that the matter would not end there."}
        - {id: ch04-b02, speaker: beetle, text: "Consequences of what, sir?"}
        - {id: ch04-b03, speaker: narrator, text: "For once Beetle was honestly confused, and McTurk quietly kicked his ankle for allowing Prout to draw him in. The house-master continued without explaining. Beetle knew perfectly well what was intended. Their career beneath his eye had been both evil and brief. Since he stood in the place of a parent to all their still-uncorrupted companions, he was bound to take precautions. The sermon ended only when he returned the key to Number Five."}
        - {id: ch04-b04, speaker: beetle, text: "What was that business about the baser imagination?"}
        - {id: ch04-b05, speaker: mcturk, text: "You are always trying to justify yourself. I hope I skinned your ankle. Why let everyone draw you?"}
        - {id: ch04-b06, speaker: beetle, text: "I must have troubled him somehow without knowing. If I'd known earlier, I could have pressed harder. What a pity. What did he mean?"}
        - {id: ch04-b07, speaker: stalky, text: "Never mind. I said we could make it a happy little house. I only didn't expect to do it so quickly."}
        - {id: ch04-b08, speaker: narrator, text: "In Common-room, Prout firmly declared Reverend John mistaken. He had indeed allowed the boys back."}
        - {id: ch04-b09, speaker: hartopp, text: "Even with your views on cheating? What an immoral compromise."}
        - {id: ch04-b10, speaker: reverend_john, text: "We have shown heartbreaking restraint for ten days. Now confess. Have you known one happy minute since you moved them?"}
        - {id: ch04-b11, speaker: prout, text: "Not where my house is concerned. But you misjudge them. For justice to the others and in self-defense, I had to send them back. Their moral influence was unspeakable."}
        - {id: ch04-b12, speaker: narrator, text: "Piece by piece, Prout told the whole story. He began with Beetle's usury and the sinister written promise to pay. He described the warning signs, the inquiry, the changed tone of his house, and the moral damage done in a single week. He ended with the extraordinary appeal from Harrison and Craye, because boys did not willingly complain about other boys."}
        - {id: ch04-b13, speaker: king, text: "Beetle playing Shylock is new. I heard rumors afterward, but carefully refused to investigate."}
        - {id: ch04-b14, speaker: hartopp, text: "I would gladly pay him five shillings if he could solve one compound-interest problem with fewer than three enormous mistakes."}
        - {id: ch04-b15, speaker: mason, text: "Why, why, why! They tricked you exactly as they tricked me!"}
        - {id: ch04-b16, speaker: hartopp, text: "And so you held an inquiry?"}
        - {id: ch04-b17, speaker: narrator, text: "Hartopp's voice covered Mason's words before Prout understood them."}
        - {id: ch04-b18, speaker: prout, text: "The boy himself hinted that a great deal of lending existed in the house. They lowered in one week what I have struggled for years to build. My own house-prefects begged me to remove them, and boys do not willingly complain of one another. You say they trust you, Gillett, so perhaps they will give you a different account. As far as I am concerned, they may go to the devil in their own way. I am sick and tired of them."}
        - {id: ch04-b19, speaker: narrator, text: "Instead, the smiling Reverend John went to the devils. Number Five had finished a pleasant meal bought with Prout's two shillings and fourpence and had settled to prep."}
        - {id: ch04-b20, speaker: stalky, text: "Come in, Padre. Take the best chair. We've seen you only officially these last ten days."}
        - {id: ch04-b21, speaker: reverend_john, text: "You were under sentence. I do not associate with criminals."}
        - {id: ch04-b22, speaker: mcturk, text: "We are restored. Mr. Prout has relented."}
        - {id: ch04-b23, speaker: beetle, text: "Our characters remain spotless. It was a painful episode."}
        - {id: ch04-b24, speaker: reverend_john, text: "Then consider your spotless characters. What have you been doing to Prout's house? This is not a joke. He says you lowered its tone so far that he had to send you back. Is that true?"}
        - {id: ch04-b25, speaker: mcturk, text: "Every word, Padre."}
        - {id: ch04-b26, speaker: reverend_john, text: "Do not be flippant. You three have great power for good or evil. I don't preach morals because young animals take years to understand them, but I will not have you corrupting juniors. Prout believes you have done exactly that."}
        - {id: ch04-b27, speaker: beetle, text: "Mr. Prout has many beliefs. Which one is troubling him now?"}
        - {id: ch04-b28, speaker: reverend_john, text: "He heard you whispering a story at twilight. When he opened the door, Orrin said it was too horrible to continue. Explain."}
        - {id: ch04-b29, speaker: beetle, text: "Remember The Beleaguered City you lent me? I changed the city into the College in a fog. Ghosts of dead boys surround it and drag fellows from their dormitory beds. The names are real, and you whisper them. Orrin hated it, and no one has let me reach the dreadful ending."}
        - {id: ch04-b30, speaker: reverend_john, text: "Why didn't you explain that to Prout instead of leaving him with such an impression?"}
        - {id: ch04-b31, speaker: mcturk, text: "Explanations are useless with Prout. If he loses one impression, he immediately finds another."}
        - {id: ch04-b32, speaker: stalky, text: "Always with the best motives. He stands in place of our parents."}
        - {id: ch04-b33, speaker: reverend_john, text: "You young demons! Was the money-lending another of his impressions?"}
        - {id: ch04-b34, speaker: stalky, text: "We helped a little. Beetle says I owed two shillings and fourpence, though I never meant to pay. We argued where Prout could hear. He paid cash like a duke, though he will stop it from my allowance, and Beetle supplied the proper paper."}
        - {id: ch04-b35, speaker: beetle, text: "I was too truthful. I might have corrected his impression, but I couldn't be certain the house wasn't full of lending. The prefects ought to know. They are the splendid guardians of public schools."}
        - {id: ch04-b36, speaker: mcturk, text: "By the end they knew everything. Harrison and Craye turned the house upside down with the purest motives."}
        - {id: ch04-b37, speaker: reverend_john, text: "My private impression is that all three of you will certainly be hanged."}
        - {id: ch04-b38, speaker: mcturk, text: "We did nothing. Prout did it. Japanese wrestlers let the other fellow do all the work, then wriggle and make him upset himself. Prout is that kind of wrestler. It isn't our fault."}
        - {id: ch04-b39, speaker: beetle, text: "Did you think we corrupted the juniors? They have no minds to corrupt, and if they did, the damage was done years ago. I used to be a junior."}
        - {id: ch04-b40, speaker: reverend_john, text: "I thought I knew the normal limits of your wickedness. If you build all the evidence against yourselves, you cannot blame people for believing it."}
        - {id: ch04-b41, speaker: stalky, text: "We blame no one and have said nothing against Prout. We love him. He has no idea how much."}
        - {id: ch04-b42, speaker: reverend_john, text: "You hide your love well. Have you wondered who caused your expulsion from the study?"}
        - {id: ch04-b43, speaker: stalky, text: "Mr. Prout expelled us."}
        - {id: ch04-b44, speaker: reverend_john, text: "I caused it. I did not intend to, but something I said gave him the impression."}
        - {id: ch04-b45, speakers: [stalky, beetle, mcturk], ensemble: chorus, text: "Ha, ha, ha!"}
        - {id: ch04-b46, speaker: mcturk, text: "The same thing happened to you, Padre. He gathers impressions quickly. But don't doubt our love for him. There isn't an ounce of vice in the man."}
    - id: ch05
      title: Higher Authority
      blocks:
        - {id: ch05-b01, speaker: narrator, text: "A double knock sounded at the door."}
        - {id: ch05-b02, speaker: foxy, text: "The Head wants Number Five study in his study at once."}
        - {id: ch05-b03, speaker: reverend_john, text: "It appears that a great deal of trouble is coming for someone."}
        - {id: ch05-b04, speaker: stalky, text: "Prout has told the Head! That's bringing a battleship into a house quarrel. It isn't fair."}
        - {id: ch05-b05, speaker: reverend_john, text: "I recommend a copybook placed over a safe and dependable part of the body."}
        - {id: ch05-b06, speaker: beetle, text: "He strikes across the shoulders. A book would slam like a barn door. Good night, Padre. We're done for."}
        - {id: ch05-b07, speaker: narrator, text: "Once more Belial, Mammon, and Lucifer stood in the presence of the Head. This time they faced a man subtler than all three put together. Prout had already talked to him, heavily and sadly, for half an hour. Beneath the house-master's solemn account, the Head had seen the whole hidden pattern of the affair and understood every turn that Prout himself had missed."}
        - {id: ch05-b08, speaker: head, text: "You have been bothering Mr. Prout. House-masters are not here for boys to bother more than necessary. These affairs now bother me, which is serious. Do you understand?"}
        - {id: ch05-b09, speakers: [stalky, beetle, mcturk], ensemble: chorus, text: "Yes, sir."}
        - {id: ch05-b10, speaker: head, text: "Then I intend to bother you on private grounds because you invaded my time. You are much too old to cane, so perhaps a thousand lines each, a week confined to the grounds, and several similar punishments will show my displeasure. You are too old to cane, aren't you?"}
        - {id: ch05-b11, speaker: stalky, text: "Oh no, sir."}
        - {id: ch05-b12, speaker: narrator, text: "A week confined to school during summer was no small matter."}
        - {id: ch05-b13, speaker: head, text: "Very good. Then we shall do what we can. I wish you would not bother me."}
        - {id: ch05-b14, speaker: narrator, text: "His stroke was fair, sustained, and perfectly even, with a slight drawing motion at the end. Yet the pain was not what the boys felt most strongly. His real unfairness lay in stopping between strokes to deliver calm observations. Each sentence advanced a little, paused for the cane, and then continued as though the interruption belonged naturally to the grammar."}
        - {id: ch05-b15, speaker: head, text: "Among the lower classes, this might be called assault. You should value your privileges. Experience teaches that private wars can be pursued only so far. Sooner or later, you collide with a higher authority who has studied the animal. I too lived in Arcadia, McTurk. There is a flagrant injustice here that should appeal to your nature. That is all. Tell your house-master that I formally caned you."}
        - {id: ch05-b16, speaker: mcturk, text: "That was business! The Prussian Bates has a devilishly straight eye."}
        - {id: ch05-b17, speaker: stalky, text: "Wasn't I clever to ask for the caning instead of all those punishments?"}
        - {id: ch05-b18, speaker: beetle, text: "Nonsense. We were marked for it from the beginning. I knew his look. I nearly cried."}
        - {id: ch05-b19, speaker: stalky, text: "I didn't exactly smile either."}
        - {id: ch05-b20, speaker: beetle, text: "Let's go to the washroom and inspect the damage. One can hold the mirror while the other two squint."}
        - {id: ch05-b21, speaker: narrator, text: "They followed this plan for ten minutes. The red marks were perfectly level. No one had received a pennyworth more or less than another. The thoroughness, efficiency, and clean outline showed the hand of an artist."}
        - {id: ch05-b22, speaker: prout, text: "What are you doing down there?"}
        - {id: ch05-b23, speaker: narrator, text: "The splashing had drawn Prout to the top of the stairs."}
        - {id: ch05-b24, speaker: stalky, text: "The Head has caned us, sir, and we're washing off the blood. He told us to inform you. We were just coming to report. That's one score for Heffy."}
        - {id: ch05-b25, speaker: mcturk, text: "Poor devil, he deserved one score. Since this began, we've sweated a stone and a half off him."}
        - {id: ch05-b26, speaker: beetle, text: "Why aren't we angry with the Head? He admitted it was a flagrant injustice, and it was!"}
        - {id: ch05-b27, speaker: mcturk, text: "My dear fellow."}
        - {id: ch05-b28, speaker: narrator, text: "McTurk offered no further answer. Stalky laughed until he had to grip the edge of a basin."}
        - {id: ch05-b29, speaker: beetle, text: "You are a ridiculous ass. What are you laughing at?"}
        - {id: ch05-b30, speaker: stalky, text: "I'm thinking about the flagrant injustice of it!"}
