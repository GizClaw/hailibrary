    king: {display_name: Mr. King, tts: {delivery: "cutting, self-satisfied, and theatrical", timbre: "crisp and nasal", pace: brisk, pitch: medium-high}}
    foxy: {display_name: Sergeant Foxy, tts: {delivery: "watchful, practical, and military", timbre: "dry and seasoned", pace: steady, pitch: medium-low}}
    head: {display_name: The Head, tts: {delivery: "composed, penetrating, and quietly humorous", timbre: "authoritative and smooth", pace: measured, pitch: low}}
    reverend_john: {display_name: Reverend John, tts: {delivery: "genial, shrewd, and gently admonishing", timbre: "full and mellow", pace: measured, pitch: medium-low}}
