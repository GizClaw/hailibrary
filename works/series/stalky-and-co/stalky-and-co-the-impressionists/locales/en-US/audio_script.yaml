    macrea: {display_name: Mr. Macrea, tts: {delivery: "relaxed, dry, and observant", timbre: "smooth and restrained", pace: measured, pitch: medium-low}}
    mason: {display_name: Mr. Mason, tts: {delivery: "earnest, excitable, and halting", timbre: "tight and reedy", pace: uneven, pitch: medium-high}}
