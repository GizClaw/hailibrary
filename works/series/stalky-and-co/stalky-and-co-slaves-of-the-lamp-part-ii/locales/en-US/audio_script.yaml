  chapters:
    - id: ch01
      title: Part II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Infant who once told the novelist Eustace Cleaver how Boh Na Ghee was captured had inherited a rich baronetcy with an enormous income. He left the Army and became a country landowner under his mother's watchful eye. She meant to see that he married the right girl. While he was still new to the place, however, he gave the local volunteers a full-sized rifle range two miles long across the middle of his estate. The neighboring families lived in fierce seclusion among woods full of pheasants, and they decided he was mad. The gunfire upset their poultry. Respectable magistrates and decent men shut him out until some county daughter could bring him back to proper thinking.
        - id: ch01-b02
          speaker: narrator
          text: The Infant answered by filling his house with carefully chosen old schoolmates home on leave. The local young women might admire those agreeable Army men from a distance. Whenever a troopship came in, Beetle knew it from the invitations. Sometimes the guests were old friends. Sometimes they were huge, blushing young officers whom he remembered as tiny boys in the Lower Second. The Infant and his elders taught those juniors everything a man ought to know about the Army.
        - id: ch01-b03
          speaker: infant
          text: I had to leave the service, but all my vast experience must not be lost to future generations.
        - id: ch01-b04
          speaker: narrator
          text: He was thirty that summer when an urgent telegram called Beetle to his grand house. It said the troopship Tamar had brought in an excellent catch and ordered him to come.
        - id: ch01-b05
          speaker: narrator
          text: The party had plainly been collected for Beetle's benefit. Captain Dickson of the Native Infantry was balding and battered, with ague shaking him behind an unconquerable red nose. He was still Dick Four. Tertius, another Native Infantry captain, had a fair mustache, a face like white glass, and delicate hands. Abanazar had grown enormous and well cared for. He was clean-shaven, soft-voiced, catlike, and now decorated the Indian Political Service. McTurk was lean, Irish, and burned blue-black by the suns of the Telegraph Department.
        - id: ch01-b06
          speaker: narrator
          text: The thick green doors of the bachelors' wing shut tightly, which was fortunate. The men dressed wherever they pleased, in the corridor or in one another's rooms. They talked, called, shouted, and sometimes waltzed in pairs to songs invented by Dick Four. Between them lay sixty years of mixed work to sort through. India had shifted the scenes around them too quickly for long meetings. They had caught one another at a dinner here, a camp or race meeting there, then at some distant rest house or railway station. Those encounters had been enough to keep them from losing touch. The Infant sat on the banisters and drank it all in with hungry envy. He enjoyed his title, but his heart wanted the old days.
        - id: ch01-b07
          speaker: narrator
          text: Their talk became a cheerful jumble of private news, provincial affairs, imperial business, old school lists, and new policies. A Burmese gong finally roared, and they went down what felt like a quarter mile of stairs. The Infant's mother had known them all as boys. She greeted them as if school had ended only last week, though fifteen years had passed since she had lent Beetle a gray princess skirt for their pantomime.
        - id: ch01-b08
          speaker: narrator
          text: Dinner might have come from the Arabian Nights. It was served in an eighty-foot hall among painted ancestors and great pots of flowering roses. More wonderful to men home from India, the whole enormous room was heated by steam. When dinner ended, the little mother understood exactly what her guests wanted. She called them boys, said they would need time to talk, and wished them good night. They gathered around an apple-wood fire in a gigantic polished steel grate beneath a mantel ten feet high. The Infant formed a circle around them with strange liqueurs and the particular kind of cigarette that serves best as an introduction to a man's own pipe.
        - id: ch01-b09
          speaker: dick_four
          text: Oh, this is bliss. It's the first time I've been warm since I came home.
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: Dick Four had been packed onto a sofa under a rug. Everyone else crowded close to the fire except the Infant, who had lived at home long enough to take exercise when he felt cold. Englishmen on the island favored that grim amusement.
        - id: ch01-b11
          speaker: mcturk
          text: Say one word about cold baths or brisk walks and I'll kill you, Infant. My liver is bad too. Remember when we thought it a treat to leave our beds on Sunday morning, even when a summer thermometer only showed fifty-seven, and bathe off the Pebbleridge? Ugh!
        - id: ch01-b12
          speaker: tertius
          text: What I can't understand is how we used to boil ourselves pink in the lavatories, then come upstairs with every pore open into snow or a black frost. Yet I don't remember one of us dying.
        - id: ch01-b13
          speaker: mcturk
          text: Speaking of baths, Beetle, remember the bath in Number Five on the night Rabbits-Eggs threw stones at King? What I'd give to see old Stalky now! He's the only man from our two studies who isn't here.
        - id: ch01-b14
          speaker: dick_four
          text: Stalky is the great man of his century.
        - id: ch01-b15
          speaker: beetle
          text: How do you know that?
        - id: ch01-b16
          speaker: dick_four
          text: How do I know? If you'd ever been trapped in a tight place with Stalky, you wouldn't ask.
        - id: ch01-b17
          speaker: beetle
          text: I haven't seen him since the Pindi camp in eighty-seven. He was doing well then, about seven feet tall and four feet wide.
        - id: ch01-b18
          speaker: tertius
          text: Adequate fellow. Infernally adequate.
        - id: ch01-b19
          speaker: narrator
          text: Tertius pulled his mustache and looked into the fire.
        - id: ch01-b20
          speaker: infant
          text: He nearly got court-martialed and ruined in Egypt in eighty-four. We sailed out together, both raw recruits. I looked raw. Stalky didn't.
        - id: ch01-b21
          speaker: mcturk
          text: What did he do?
        - id: ch01-b22
          speaker: infant
          text: Almost nothing. His colonel sent him with twenty soldiers to wash or groom camels behind Suakin. Stalky wandered five miles inland, ran into the Fuzzies, managed a brilliant retreat, and killed eight of them. He knew he had no right to be that far out, so he struck first. His colonel was furious, and Stalky sent him a letter complaining that his operations had received too little support. He sounded like one fat brigadier abusing another. Then he joined the Staff Corps.
        - id: ch01-b23
          speaker: abanazar
          text: That is entirely Stalky.
        - id: ch01-b24
          speaker: beetle
          text: You met him too?
        - id: ch01-b25
          speaker: abanazar
          text: Oh, yes. I arrived at the end of that particular epic. Haven't any of you heard it?
        - id: ch01-b26
          speaker: narrator
          text: Beetle, McTurk, and the Infant had not. They asked for the story with great politeness.
        - id: ch01-b27
          speaker: tertius
          text: There isn't much to tell. We got into trouble in the Khye-Kheen Hills a couple of years ago, and Stalky pulled us out. That's all.
        - id: ch01-b28
          speaker: narrator
          text: McTurk looked at Tertius with an Irishman's full contempt for a Saxon who could not tell a story.
        - id: ch01-b29
          speaker: mcturk
          text: Heavens! And men like you govern Ireland. Aren't you ashamed, Tertius?
        - id: ch01-b30
          speaker: tertius
          text: I can't tell a yarn. I can add bits once somebody else starts talking. Ask Dick.
        - id: ch01-b31
          speaker: dick_four
          text: I knew you'd fail. Give me a whiskey and soda. I've had lemon squash and quinine while you fellows bathed in champagne, and my head is humming like a top.
        - id: ch01-b32
          speaker: narrator
          text: Dick Four wiped his ragged mustache above the drink. His teeth chattered as he began.
        - id: ch01-b33
          speaker: dick_four
          text: You know the Khye-Kheen and Malôt expedition. We frightened both tribes into surrender with a force they dared not fight. A collection of hairy villains, who controlled their men no better than I did, promised us everything without firing a shot. That was the evidence your people trusted, Pussy dear.
        - id: ch01-b34
          speaker: abanazar
          text: I was at Simla.
        - id: ch01-b35
          speaker: dick_four
          text: Never mind. You're one of the same breed. Your Political idiots called the country peaceful because of those worthless treaties. Then the Government behaved like its usual foolish self. It began making a road and trusted the local people to supply the workers. Remember that, Pussy. The men who had missed the campaign thought the excitement was over and wanted to return to India. I'd seen two little risings before, and I didn't trust the quiet.
        - id: ch01-b36
          speaker: dick_four
          text: By great cleverness I got command of a road patrol. No digging for me, only a respectable march up and down with a guard. Most of the troops had already been withdrawn. I built my little force around about forty Pathans, chiefly new recruits from my own regiment, and stayed at base camp while the road parties worked according to the Political survey. The other fellows who had missed the first campaign expected no more trouble and were impatient to return to India. Two earlier frontier rows had taught me to be suspicious.
        - id: ch01-b37
          speaker: tertius
          text: We had some splendid sing-songs in that camp too.
        - id: ch01-b38
          speaker: dick_four
          text: My subaltern was a pious little animal who disliked the songs, so he got pneumonia. I searched the camp and found Tertius making speeches as a deputy quartermaster, a job he was never made for. Six or eight men from the old College were there, as we always are when the frontier rises. I'd heard Tertius was dependable, so I told him to take off those staff-officer breeches and come with me. He volunteered at once. The authorities agreed, and off we went with forty Pathans to inspect the road parties.
        - id: ch01-b39
          speaker: dick_four
          text: Macnamara's party was next to last. You remember old Mac, the engineer who tortured a fiddle at Umballa. Stalky's party was farthest up the road with some of his favorite Sikhs. Mac believed he was safe.
        - id: ch01-b40
          speaker: tertius
          text: Stalky is practically a Sikh. Whenever he can, he takes his men to pray at the Golden Temple in Amritsar as regularly as a clock.
        - id: ch01-b41
          speaker: dick_four
          text: Don't interrupt. We went about forty miles beyond Mac before I found Stalky. My men pointed out, politely but firmly, that the whole country was rising. What sort of country was it, Beetle? I'm no poet, thank heaven. You might call it hellish. One moment we were buried to our necks in snow. The next we were rolling down a mountainside. The friendly inhabitants who were supposed to work on the road sat behind rocks and shot at us instead. It was the same old story.
        - id: ch01-b42
          speaker: dick_four
          text: We hurried on to find Stalky. I trusted him to choose good cover. At dusk we discovered his road party tucked into an old Malôt stone fort with a watchtower at one corner. The fort stood above the road they had blasted from the cliff fifty feet below. Under that road the ground dropped five or six hundred feet into a gorge half a mile wide and several miles long. Men across the gorge were carefully finding our range.
        - id: ch01-b43
          speaker: dick_four
          text: I hammered on the gate and dashed inside. There was Stalky, sitting on the ground among his men and eating, wrapped in an old sheepskin coat stiff with grease and blood. I'd glimpsed him only once in three months, but he greeted us as if we'd met yesterday. He waved one hand, perfectly serene.
        - id: ch01-b44
          speaker: stalky
          text: Hello, Aladdin. Hello, Emperor. You've arrived just in time for the show.
        - id: ch01-b45
          speaker: dick_four
          text: His Sikhs looked badly knocked about. I asked where the rest of his command was and what had happened to his subaltern.
        - id: ch01-b46
          speaker: stalky
          text: This is the whole command. If you mean young Everett, he's dead. His body is in the watchtower. They attacked the road party last week and killed him and seven men. We've been shut in here for five days. I expect they allowed you through so they could finish you too. The whole country is up. It looks as though you've walked into a first-rate trap.
        - id: ch01-b47
          speaker: dick_four
          text: Stalky grinned. Tertius and I couldn't see the joke. We had brought no food for our men, and he had only four days' rations left for his. That was what came of trusting Pussy's foolish Politicals when they called the people friendly.
        - id: ch01-b48
          speaker: dick_four
          text: To make us thoroughly comfortable, Stalky led us up the tower to Everett. The body lay in a foot of snow that had blown indoors. The little fellow looked like a girl of fifteen, with no hair at all on his face. A bullet had passed through his temple, and afterward the Malôts had left their sign on him. Stalky unbuttoned the tunic and showed us a strange cut shaped like a sickle across his chest. Remember the white snow lying on Everett's eyebrows, Tertius? Remember the moment Stalky shifted the lamp and its moving light made the dead boy look alive?
        - id: ch01-b49
          speaker: tertius
          text: Yes. And I remember Stalky's horrible face, with his nostrils spread the way they used to when he bullied a small boy. What a delightful evening that was.
          emotion: fearful
        - id: ch01-b50
          speaker: dick_four
          text: We held a council of war above Everett's body. Stalky said the Malôts and Khye-Kheens had put aside their old blood feud to attack us together. The men across the gorge were Khye-Kheens. Half a mile away by a bullet's path, they had built stone shelters below the crest and meant to sleep there while they starved us. The Malôts were scattered in front. There was no useful cover behind the fort, or they would have occupied that too.
        - id: ch01-b51
          speaker: dick_four
          text: Stalky worried less about the Malôts, though he called them treacherous curs. I could not understand why the two tribes did not join forces and rush us. There were at least five hundred men outside. Stalky explained that the tribes were enemies at home and still distrusted each other. They had tried one charge, but he had thrown two blasting charges among them. That discouraged them.
        - id: ch01-b52
          speaker: dick_four
          text: Darkness had fallen when the meeting ended. Stalky remained perfectly easy.
        - id: ch01-b53
          speaker: stalky
          text: You're in command now. You won't object if I do whatever seems necessary to bring more food into the fort, will you?
        - id: ch01-b54
          speaker: dick_four
          text: Of course not.
        - id: ch01-b55
          speaker: dick_four
          text: Then the lamp went out. Tertius and I did not care to remain beside Everett, so we felt our way down the tower stairs and returned to our men. Stalky had vanished. I supposed he was counting supplies. The enemy fired at us through the night. Tertius and I took turns staying awake in case they charged.
        - id: ch01-b56
          speaker: dick_four
          text: Morning came without Stalky. There wasn't a trace of him. I spoke to his senior Indian officer, Rutton Singh, a magnificent old Sikh from near Jullunder with white whiskers. He only grinned and said everything was well. Stalky had slipped out of the fort twice before and would return without a scratch. Rutton seemed to think he was some invulnerable holy man. I still put everyone on half rations and ordered the men to open more firing holes.
        - id: ch01-b57
          speaker: dick_four
          text: At noon a tremendous snowstorm stopped the enemy's fire. We answered cautiously because ammunition was desperately short. We fired fewer than five shots an hour, though we usually hit someone. While I was talking with Rutton Singh, Stalky came down from the watchtower. His eyes looked swollen, and dark red ice coated his sheepskin.
        - id: ch01-b58
          speaker: stalky
          text: You can't depend on a snowstorm. Get outside quickly and take whatever you can find. The Khye-Kheens and Malôts are having a little disagreement just now.
        - id: ch01-b59
          speaker: dick_four
          text: I sent Tertius with twenty Pathans. They pushed through the snow until they found a rough camp eight hundred yards away. Only a few guards remained beside the fire with half a dozen sheep. Tertius's men killed the guards, took the sheep and all the grain they could carry, and returned without a shot fired at them. The falling snow hid everyone else.
        - id: ch01-b60
          speaker: dick_four
          text: At dinner, Stalky pulled mutton from a cleaning rod with his teeth.
        - id: ch01-b61
          speaker: stalky
          text: That will do. There is no point risking more men. The Khye-Kheens and Malôts are holding a council at the top of the gorge. These grand coalitions never seem very sound.
        - id: ch01-b62
          speaker: dick_four
          text: Do you know what that madman had done? Tertius and I dragged the truth out of him piece by piece. Beneath the watchtower was an underground room once used as a grain cellar. When Stalky blasted the cliff for the road, one charge broke a hole through the cellar wall. Any other man would have sealed it. Because he was Stalky, he kept it open for his own private use. The tower stairs dropped into that cellar, and he laid Everett's body directly over the stairwell. Each time he used the hidden way, he had to lift the corpse aside and replace it afterward. His Sikhs feared the body and would not approach the place, so no one discovered the passage.
        - id: ch01-b63
          speaker: dick_four
          text: Stalky had crawled through the hole and dropped onto the road. In darkness and a screaming snowstorm, he climbed over the edge, worked down to the bottom of the gorge, crossed the half-frozen stream, and followed a path he had found up the far side. That brought him onto the Khye-Kheens' right flank. He crossed a ridge behind them, walked half a mile under its cover, and came out on their left where the gorge grew shallow. A regular track there connected their camp with the Malôts.
        - id: ch01-b64
          speaker: dick_four
          text: At about two in the morning, a Khye-Kheen saw him. Stalky killed the man without noise. Then he cut the Malôt sickle mark into the body, just like the mark on Everett.
        - id: ch01-b65
          speaker: stalky
          text: I used no more force than I had to. If he'd called out, I would have died. I'd only done that sort of work once before. That was when I first tested the path. Infantry can use it perfectly well.
        - id: ch01-b66
          speaker: dick_four
          text: I asked him about the first man.
        - id: ch01-b67
          speaker: stalky
          text: That happened the night after they killed Everett. I went out to find an escape route for my men, and somebody discovered me. I killed him privately and threw him down among some rocks. Later I thought the body might be useful. If I found it again, I could add the Malôt mark and let the Khye-Kheens decide what that meant. So I went back the next night and did it.
        - id: ch01-b68
          speaker: stalky
          text: The Khye-Kheens are deeply offended that the Malôts committed two wicked murders after swearing to end every blood feud. I hid behind their shelters early this morning and watched them. They all left for a conference at the head of the gorge. They're extremely annoyed. I can understand why.
        - id: ch01-b69
          speaker: narrator
          text: Dick Four reminded them how Stalky let his words fall one at a time.
        - id: ch01-b70
          speaker: infant
          text: My God!
          emotion: surprised
        - id: ch01-b71
          speaker: narrator
          text: The full design had suddenly opened before the Infant.
        - id: ch01-b72
          speaker: mcturk
          text: Dear man!
          emotion: happy
        - id: ch01-b73
          speaker: narrator
          text: McTurk purred with delight.
        - id: ch01-b74
          speaker: tertius
          text: Stalky stalked. That's the whole explanation.
        - id: ch01-b75
          speaker: dick_four
          text: No, it isn't. Remember how he insisted he'd merely used his luck? Remember Rutton Singh clutching his boots and bowing in the snow while all our men shouted?
        - id: ch01-b76
          speaker: tertius
          text: Not one of our Pathans called it luck. They said Stalky should have been born a Pathan. We nearly had a fight inside the fort when Rutton Singh claimed him for the Pathans. The old Sikh was furious with our Pathan officer. Stalky only wagged one finger, and both men stopped.
        - id: ch01-b77
          speaker: tertius
          text: Rutton already had half his sword out. He swore he would burn the body of every Khye-Kheen and Malôt he killed. That angered our Muslim officer. He was willing to fight men of his own faith, but he would not let a Sikh spoil another Muslim's chance of Paradise. Stalky poured out Pashto and Punjabi by turns. Where did he learn his Pashto, Beetle?
        - id: ch01-b78
          speaker: beetle
          text: Forget the languages, Dick. Tell us what he meant.
        - id: ch01-b79
          speaker: dick_four
          text: I can address a clever Pathan when I need to, but I can't make Pashto puns and finish an argument with a filthy story. Stalky played those two old warriors like a concertina. He said the Khye-Kheens and Malôts would arrange a joint attack that night to prove they still trusted each other. But neither tribe would press the attack hard because of those little accidents.
        - id: ch01-b80
          speaker: dick_four
          text: His plan was to leave at dusk with his Sikhs, crawl along that dreadful goat track, and get behind the Khye-Kheen position. Once the attack was under way, he would fire a few long shots into the Malôts.
        - id: ch01-b81
          speaker: stalky
          text: That should distract them and stir things up. Then you fellows can come out and clear away what's left. We'll meet at the head of the gorge. After that, I suggest we return to Mac's camp and get something to eat.
        - id: ch01-b82
          speaker: infant
          text: You were the officer in command?
        - id: ch01-b83
          speaker: dick_four
          text: I was three months senior to Stalky and two months senior to Tertius. But we all came from the old College. It may be the only little action on record where no one was jealous of anyone else.
        - id: ch01-b84
          speaker: tertius
          text: We weren't jealous, but Rutton Singh and Gul Sher Khan began another quarrel. Gul said no Sikh alive knew how to stalk, and Koran Sahib ought to take Pathans who understood mountain work. Rutton replied that Koran Sahib knew every Pathan was born to desert and every Sikh was a gentleman, even if a Sikh couldn't crawl on his stomach.
        - id: ch01-b85
          speaker: tertius
          text: Stalky answered with some old woman's proverb that folded both men over laughing. He said Sikhs and Pathans could settle their claims against the enemy later. He was taking his own Sikhs on this climb because Sikhs could shoot. And they can. Give each one a mule-load of cartridges and he's content.
        - id: ch01-b86
          speaker: dick_four
          text: Out he went. As soon as darkness fell and he'd slept a little, Stalky led thirty Sikhs down the tower stairs. Every man saluted young Everett, whose body had been propped against the wall. Stalky's last words warned them not to tumble over the black edge of nothing.
        - id: ch01-b87
          speaker: dick_four
          text: Soon after nine, the joint attack began. Khye-Kheens fired from across the gorge, and Malôts fired in front. They shouted at one another to come forward and cut our unbelieving throats. Then they crept up toward the gate, called our Pathans traitors, and invited them to join the holy war.
        - id: ch01-b88
          speaker: dick_four
          text: A young Pathan from Dera Ismail jumped onto the wall to abuse them in return. He came down sobbing like a child because a bullet had struck him squarely in the center of the hand. I've never known a man take a wound there without bitter tears. The shock seems to run through every nerve in the body. The others still crowded forward, longing to answer the insults. Tertius took the wounded man's rifle and used its stock to knock eager heads down, keeping everyone at the firing holes. The dear boys wanted us to open the gate and rush the enemy all together. That would have ruined our plan.
        - id: ch01-b89
          speaker: dick_four
          text: Near midnight, Stalky's rifles began their wop, wop, wop across the valley. The main Malôt force was hidden from us by a fold of ground, but we heard the cursing. Stalky was hitting them fast. Naturally they swung around and fired whole volleys at their faithless Khye-Kheen allies. Within ten minutes, both sides of the gorge were fighting furiously.
        - id: ch01-b90
          speaker: dick_four
          text: When we could make out the ground, the valley was a fine confusion. The Khye-Kheens had poured out of their stone shelters to punish the Malôts. Through my glasses I saw Stalky slip behind them. That was excellent. The Khye-Kheens had to run along the hillside to the shallow head of the gorge before they could cross. The Malôts were delighted to see their enemies attacked from behind.
        - id: ch01-b91
          speaker: dick_four
          text: I decided to comfort the Khye-Kheens from our side. I brought out every man and charged what we'll politely call the Malôt left flank. If the tribes had forgotten their quarrel, they could still have swallowed us alive. But they had spent half the night shooting one another and simply kept at it. It was the strangest sight I've ever seen.
        - id: ch01-b92
          speaker: dick_four
          text: Whenever our men closed on the Malôts, the Malôts fired even harder at the Khye-Kheens to prove they were our friends. Then they ran a few hundred yards up the valley, stopped, and fired again. Stalky saw what we were doing and copied it on the other side. The Khye-Kheens behaved in exactly the same way.
        - id: ch01-b93
          speaker: tertius
          text: You've forgotten that Stalky played Arrah, Patsy, Mind the Baby on his bugle to hurry us along.
        - id: ch01-b94
          speaker: mcturk
          text: He did?
          emotion: surprised
        - id: ch01-b95
          speaker: narrator
          text: McTurk roared the question. Somehow every man began singing the old tune, and Dick Four's story stopped until they had finished.
        - id: ch01-b96
          speaker: tertius
          text: He certainly did. No one from the Aladdin company could forget that tune. Go on, Dick.
        - id: ch01-b97
          speaker: dick_four
          text: In the end we drove both tribes into one another on level ground at the head of the valley. The whole crowd spun away through a blinding snowstorm, fighting, stabbing, and swearing. They were heavy, hairy fellows, so we did not chase them.
        - id: ch01-b98
          speaker: dick_four
          text: Stalky took one prisoner, an old retired Indian soldier with twenty-five years' service who immediately produced his discharge papers. He was a splendid old rascal and had spent the early part of the day trying to make his own men charge us. After the battle he was sullen with them for proving cowards. Rutton Singh wanted to bayonet him. Sikhs cannot understand how a man can serve the Government honestly for years and then take up arms against it. Stalky rescued the prisoner from Rutton, held on to him firmly, and treated him as though he might have some useful purpose later.
        - id: ch01-b99
          speaker: dick_four
          text: Back at the fort, we buried Everett. Stalky refused to let us blow the place up. Then we left. We had lost only ten men altogether.
        - id: ch01-b100
          speaker: beetle
          text: Only ten out of seventy? How were they killed?
        - id: ch01-b101
          speaker: dick_four
          text: The enemy rushed the fort early that night, and a few Malôts came over the gate. For a minute it was close, but the recruits handled it beautifully. Luckily we had no badly wounded men to carry, because Macnamara's camp was forty miles away. We marched as though the devil chased us.
        - id: ch01-b102
          speaker: dick_four
          text: Halfway there, old Rutton Singh collapsed. We laid him across four rifles and Stalky's overcoat. Stalky, his prisoner, and two Sikhs carried him. After that I fell asleep while walking. You can do it once your legs are numb enough. Mac said the whole force entered camp snoring and dropped exactly where it halted. His men carried us into the tents like sacks of grain.
        - id: ch01-b103
          speaker: dick_four
          text: When I woke, Stalky was asleep with his head on Rutton Singh's chest. Stalky slept twenty-four hours. I managed only seventeen, though I was beginning to come down with dysentery.
        - id: ch01-b104
          speaker: tertius
          text: Beginning? Nonsense. You had dysentery before we ever reached Stalky's fort.
        - id: ch01-b105
          speaker: dick_four
          text: You're in no position to talk. Every time you saw Macnamara, you threw your sword at him and demanded an immediate court-martial. The only way to quiet you was to place you under arrest every half hour. You were delirious for three days.
        - id: ch01-b106
          speaker: tertius
          text: I don't remember any of that. I do remember my orderly bringing me milk.
        - id: ch01-b107
          speaker: mcturk
          text: And how was Stalky?
        - id: ch01-b108
          speaker: narrator
          text: McTurk pulled hard at his pipe as he asked.
        - id: ch01-b109
          speaker: dick_four
          text: Stalky was as peaceful as a Brahmini bull. Poor Mac had no idea what to do. I was foul with dysentery. Tertius was raving. Half the men had frostbite. Mac's orders told him to break camp and return before winter.
        - id: ch01-b110
          speaker: dick_four
          text: Stalky had not turned a hair. With Rutton Singh's advice and help, he took half of Mac's supplies, politely saving Mac the trouble of hauling them back to the plains. He added every cartridge he could reach. Then he gathered all his Sikhs, his precious prisoner, and a disreputable collection of followers whom he and the prisoner had talked into service. With sixty men of one sort or another, and nothing else but his own tremendous nerve, he marched straight back toward the fort and the closing snow. Poor Mac, already at the end of his engineer's wits, nearly cried with relief when Stalky departed.
        - id: ch01-b111
          speaker: dick_four
          text: You see, no written order specifically told Stalky to come in before snow closed the passes. Mac worships orders. So does Stalky, whenever they serve him.
        - id: ch01-b112
          speaker: tertius
          text: He told me he was going to the Engadine. He sat on my cot, smoked a cigarette, and made me laugh until I cried. Macnamara sent the rest of us down to the plains the next day. We were a traveling hospital.
        - id: ch01-b113
          speaker: dick_four
          text: Stalky called Macnamara a gift from heaven. I often saw him in Mac's tent listening to that dreadful fiddle. Between tunes he coaxed picks, shovels, and dynamite cartridges out of Mac by the armful. That was the last we saw of him. A week later the passes closed, and I don't believe Stalky wanted anyone to find him just then.
        - id: ch01-b114
          speaker: abanazar
          text: He certainly did not.
        - id: ch01-b115
          speaker: narrator
          text: Abanazar laughed. Dick Four raised one thin, dry hand, blue veins showing across the back.
        - id: ch01-b116
          speaker: dick_four
          text: Wait, Pussy. Your turn comes later. I returned to my regiment. Five months afterward, in spring, I took two companies on detachment. Officially we were watching friends across the border. In truth, we were recruiting.
        - id: ch01-b117
          speaker: dick_four
          text: One foolish young corporal brought a small blood feud inherited from his aunt into those hills, so the local gentlemen refused to join my regiment. The corporal had taken proper short leave to conduct his family business, and that part was regular enough. Unfortunately, the man he stalked was the uncle of my favorite orderly. The timing was disgraceful. I knew Harris of the Ghuznees would cover the same district three months later and recruit every fine fellow I had marked for myself. The whole company condemned the corporal. They felt he might at least have postponed those disgusting family romances until our ranks were full.
        - id: ch01-b118
          speaker: dick_four
          text: The creature still had some professional honor. One of his aunt's clan came secretly at night. If I accepted safe conduct, he would show me a fine collection of recruits. I crossed the border at once. Ten miles beyond it, in a dry ravine, my guide showed me about seventy armed men standing as straight as a company on parade.
        - id: ch01-b119
          speaker: dick_four
          text: One man stepped forward, turned an old bugle in his hands like an actor searching for his eyeglass, and played the opening of Arrah, Patsy, Mind the Baby. He could go no farther.
        - id: ch01-b120
          speaker: narrator
          text: Dick Four could go no farther either. The old friends sang the song twice, then once again, and afterward repeated it.
        - id: ch01-b121
          speaker: dick_four
          text: The bugler said he carried a note from the owner of that song, but I must prove I knew the rest. So I finished the tune on his bugle. Then he gave me this letter. I saved it because I knew you'd all want to see. Don't snatch. I'll read it.
        - id: ch01-b122
          speaker: stalky
          text: Fort Everett, February nineteenth. Dear Dick, or Tertius. The bearer commands seventy-five recruits. They are genuine devils, but they wish to begin better lives. They have been lightly polished and may turn out well after a thorough boiling. Please give thirty to my adjutant. He is God's own fool, but he will need men this spring. Keep the rest yourself.
        - id: ch01-b123
          speaker: stalky
          text: You may like to know that my road now reaches the far end of the Malôt country. Every headman and priest involved in last September's affair spent a month breaking road stone from his own house. A forty-foot mound covers Everett's grave and should make a useful base for future surveying. Rutton Singh sends his best respects. I am arranging treaties. My prisoner, who also sends his respects, now holds the local rank of Khan Bahadur. A. L. Corkran.
        - id: ch01-b124
          speaker: narrator
          text: Roaring, shouting, laughter, and perhaps tears followed the letter.
        - id: ch01-b125
          speaker: dick_four
          text: That was all. I escorted the men over the border as quickly as possible. They missed home at first. Then they recognized some of my soldiers from the Khye-Kheen fight and cheered up. They became excellent troops. I had found them more than three hundred miles from Fort Everett. Now, Pussy, tell them what happened to Stalky afterward.
        - id: ch01-b126
          speaker: narrator
          text: Abanazar gave a small, nervous, official laugh meant to mislead them.
        - id: ch01-b127
          speaker: abanazar
          text: There wasn't much more. I was at Simla that spring when Stalky came out of the snow and began writing directly to the Government.
        - id: ch01-b128
          speaker: dick_four
          text: Like a king writing to another king.
        - id: ch01-b129
          speaker: abanazar
          text: My story now, Dick. He had done a great many forbidden things and had practically committed the Government to all sorts of action.
        - id: ch01-b130
          speaker: mcturk
          text: He had pledged the Government's credit, had he?
        - id: ch01-b131
          speaker: abanazar
          text: More or less. The awkward part was that every forbidden step was wonderfully useful and perfectly reasoned. His promises and arrangements fitted the Government's needs as neatly as though he had been reading secret information from every department. Of course, isolated beyond the snow, he could not possibly have seen any of it. That made the convenience far more embarrassing. The officials could condemn his authority, but they could hardly deny the value of what he had done.
        - id: ch01-b132
          speaker: tertius
          text: Nonsense. I'd back Stalky against the Foreign Office any day.
        - id: ch01-b133
          speaker: abanazar
          text: Under cover of building that road and being trapped by snow, he did nearly everything except mint coins stamped with his own face and title. He dealt with tribes, punished leaders, arranged labor, gathered men, and left the State tied to results it had never ordered. Then he explained the whole performance in a report so astonishing that Von Lennaert first tore at his hair and then stopped to gasp. At last, this was what he said.
        - id: ch01-b134
          speaker: von_lennaert
          text: Who is this unknown Warren Hastings? He must be destroyed. Officially destroyed! The Viceroy will never accept it. This is unheard of. His Excellency must destroy the man in person. Order him to Simla and send him the sharpest possible rebuke.
          emotion: angry
        - id: ch01-b135
          speaker: abanazar
          text: I sent an enormous official rebuke. At the same moment, I sent him a private telegram.
        - id: ch01-b136
          speaker: infant
          text: You did?
          emotion: surprised
        - id: ch01-b137
          speaker: abanazar
          text: Yes, I did. It was a curious coincidence after Dick's story, because the old pantomime ending came straight back into my head. I wrote, Aladdin now has got his wife. Your Emperor is appeased. I think you'd better come to life. We hope you've all been pleased. The message was encouraging but carefully noncommittal. It told Stalky that an old friend had seen the official storm and was still watching. Its one defect was the line about his Emperor. The Viceroy remained very far indeed from appeased.
        - id: ch01-b138
          speaker: abanazar
          text: Stalky came down from his mountain stronghold and wandered up to Simla in his own time. There he was prepared for sacrifice.
        - id: ch01-b139
          speaker: beetle
          text: But surely the Commander-in-Chief should have handled that.
        - id: ch01-b140
          speaker: abanazar
          text: His Excellency believed that personally exploding at one junior captain proved he held the reins of empire. Von Lennaert encouraged the belief. I sometimes think he planted it.
        - id: ch01-b141
          speaker: beetle
          text: The breed must have changed since my time.
        - id: ch01-b142
          speaker: abanazar
          text: Perhaps. Stalky was summoned for punishment like a naughty little boy brought before his schoolmaster. I have reason to think His Excellency's hair stood on end. For a full hour he poured his anger over one junior captain. Stalky stood rigidly at attention in the center of the room. Behind the Viceroy, Von Lennaert silently acted as if he were smoothing down the furious man's raised topknot. Stalky later swore that he kept his eyes lowered through the entire performance because one glance at Von Lennaert would have made him laugh aloud.
        - id: ch01-b143
          speaker: infant
          text: Then why wasn't Stalky publicly ruined?
        - id: ch01-b144
          speaker: abanazar
          text: Why indeed? The official answer was mercy. His Excellency would give the young officer one last chance to repair his ruined career rather than break his father's heart. Stalky had no father, but facts like that never troubled the ceremony. He behaved with all the crushed innocence of an entire orphan asylum and accepted the gracious pardon. Then he came directly to my office, sat opposite me without speaking, and spent ten full minutes breathing through his nose while his nostrils spread wider and wider.
        - id: ch01-b145
          speaker: stalky
          text: Pussy, if I believed that basket-hanger governed India, I'd become a Russian citizen tomorrow. Nobody understands me. This affair has broken my heart, and only six months of shooting leave in India can mend it. Can you arrange that, Pussy?
        - id: ch01-b146
          speaker: mcturk
          text: Ha! He remembered the basket-hanger!
          emotion: happy
        - id: ch01-b147
          speaker: abanazar
          text: He got his leave in three and a half minutes. Seventeen days later, he returned in disgrace to Rutton Singh with orders to hand his command to Cathcart MacMonnie.
        - id: ch01-b148
          speaker: dick_four
          text: Observe that carefully. One Political colonel sent to command thirty Sikhs on a hilltop. Observe, my children.
        - id: ch01-b149
          speaker: abanazar
          text: Cathcart was a Political, but not a fool. For six months he allowed Stalky to hunt within fifteen miles of Fort Everett. Stalky, Cathcart, Rutton Singh, and the old prisoner became as close as thieves. Then Stalky drifted back to his regiment. I have not seen him since.
        - id: ch01-b150
          speaker: mcturk
          text: I have.
        - id: ch01-b151
          speaker: narrator
          text: McTurk swelled with pride. Everyone turned toward him at once.
        - id: ch01-b152
          speaker: mcturk
          text: It was at the start of this hot season. I was camped in the Jullunder country and walked straight into Stalky in a Sikh village. He occupied the one chair of honor while half the population bowed on the ground before him. A dozen Sikh babies crowded across his knees. An ancient, fierce-looking woman kept clapping him on the shoulder, and a garland of flowers hung around his neck. In the middle of that royal reception, he told me in the most ordinary way that he was recruiting.
        - id: ch01-b153
          speaker: mcturk
          text: We ate together that night, but he never mentioned the fort. He did say that if I needed supplies, I should call myself Koran Sahib's brother. I did, and the Sikhs refused my money.
        - id: ch01-b154
          speaker: dick_four
          text: Ah! That must have been one of Rutton Singh's villages.
        - id: ch01-b155
          speaker: narrator
          text: For a while they smoked without speaking.
        - id: ch01-b156
          speaker: mcturk
          text: Did Stalky ever tell you how he made Rabbits-Eggs throw those stones at King?
        - id: ch01-b157
          speaker: dick_four
          text: No.
        - id: ch01-b158
          speaker: narrator
          text: McTurk told him. Dick Four nodded when the old school trick was clear.
        - id: ch01-b159
          speaker: dick_four
          text: I see. He used almost exactly the same trick again. There is no one else like Stalky.
        - id: ch01-b160
          speaker: beetle
          text: That's where you're wrong. India is full of Stalkies from Cheltenham, Haileybury, and Marlborough, men we hear nothing about. When a truly great war comes, the surprises will begin.
        - id: ch01-b161
          speaker: dick_four
          text: Who will be surprised?
        - id: ch01-b162
          speaker: beetle
          text: The other side. The gentlemen who travel to the front in first-class railway carriages. Imagine Stalky loose in southern Europe with enough Sikhs and a fair chance of loot. Think about it quietly.
        - id: ch01-b163
          speaker: infant
          text: There may be something in that, but you're too much of an optimist, Beetle.
        - id: ch01-b164
          speaker: beetle
          text: I have the right to be. I'm responsible for the whole thing. Don't laugh. Who wrote Aladdin now has got his wife?
        - id: ch01-b165
          speaker: tertius
          text: What has that song to do with any of it?
        - id: ch01-b166
          speaker: beetle
          text: Everything.
        - id: ch01-b167
          speaker: infant
          text: Prove it.
        - id: ch01-b168
          speaker: narrator
          text: And Beetle has.
