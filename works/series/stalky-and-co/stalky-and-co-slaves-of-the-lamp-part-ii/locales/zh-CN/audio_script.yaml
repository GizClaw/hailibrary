        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 下篇
      blocks:
      - id: ch01-b01
        speaker: narrator
        text: 当年给小说家尤斯塔斯·克利弗讲博·纳·吉被俘故事的那个“小猫”，后来继承了从男爵爵位、大片地产和一笔巨款。他离开军队做了乡绅，母亲守在身边，一心要替他物色合适的姑娘。可他不懂乡绅的规矩，竟从自家领地正中划出两英里长的实弹靶场，送给当地志愿军。邻居们躲在雉鸡成群的树林里，觉得他简直疯了。枪声惊了他们的家禽，于是本郡的太平绅士和体面人都不再同他来往，等着哪位千金把他领回正途。
      - id: ch01-b02
        speaker: narrator
        text: 小猫的报复，就是把宅子塞满休假回国的老同学。他还会精挑细选，专挑那些和气可亲、前程却一个比一个叫人担心的家伙。骑自行车经过的邻家姑娘们，只能从远处看上一眼。每逢小猫的请帖送到，我就知道运兵船又进港了。有时他搬出的是我们同年的旧友，有时则是些脸红腼腆的巨人。我离校时，他们还只是低二班里毫不起眼的小跟班。如今，小猫和前辈们要亲自向他们说明，军中男子究竟负有怎样的全部本分。
      - id: ch01-b03
        speaker: kitten
        text: 我是不得不离开军队，可我这一肚子经验，总不能就这么断送给后人。
      - id: ch01-b04
        speaker: narrator
        text: 他说这话时才满三十岁。那年夏天，一封不容拒绝的电报把我召到他的男爵城堡。电报说，他捞到了一网好货，是原“塔玛号”整整一船人，叫我快去。
      - id: ch01-b05
        speaker: narrator
        text: 这批客人确实不寻常，显然专门挑来让我高兴。狄克森上尉在土著步兵中服役，头顶微秃，身体已经垮了，只有红鼻子依旧百折不挠。他躲在那只鼻子后面打着摆子，大家叫他狄克四。另一个土著步兵上尉蓄着金黄小胡子，脸白得像玻璃，双手脆弱得吓人。谁喊“小三”，他都会快活地答应。阿巴纳扎身躯大得惊人，保养得很好，显然多年没上过战场。他脸刮得干净，说话轻柔，走动像猫。如今他虽替印度政务部门增光，骨子里还是从前那个阿巴纳扎。最后一位是清瘦的爱尔兰人麦克特克，电报局的烈日把他的脸晒成了蓝黑色。
      - id: ch01-b06
        speaker: narrator
        text: 幸亏单身汉侧翼的呢绒门关得严。我们常常随便穿着衣服，在走廊和彼此房里谈笑呼喊，兴起时还两两起舞，唱狄克四自己编的歌。我们之间足有六十年的杂色经历，正等着大家一件件筛拣。这些年，印度的布景飞快变换，我们偶尔会在一顿晚餐、一处营地或一场赛马会碰面，也会在内地的驿站旅舍或火车站偶然相逢。因此，大家始终没有彻底断了彼此的消息。小猫坐在楼梯扶手上，眼红又饥渴地把一切听进去。他喜欢自己的从男爵爵位，心里却一直向往从前的日子。
      - id: ch01-b07
        speaker: narrator
        text: 大家的声音嘈杂又快活。个人、地方和帝国的大事全搅在一处，旧日点名册的片段不断撞上最新政策。直到缅甸大锣轰然一响，热闹的谈话才被截断。我们走下那道仿佛足有四分之一英里长的楼梯，去见小猫的母亲。我们还在学校时她就认识大家，如今招呼起来，仿佛那段日子只过去了一个星期。可她当年笑出眼泪、借我一条灰色公主裙演业余戏剧，算起来已经是十五年前的事了。
      - id: ch01-b08
        speaker: narrator
        text: 那顿晚饭简直像从《一千零一夜》里搬出来的。八十英尺长的大厅里挂满祖先画像，一盆盆玫瑰开得正盛。不过，在这些奢华东西当中，最让我们这些从印度回来的人惊叹的，还是房里的蒸汽暖气。饭后，小个子母亲起身告辞。
      - id: ch01-b09
        speaker: kitten_mother
        text: 你们这些孩子要说话，我就先道晚安啦。
      - id: ch01-b10
        speaker: narrator
        text: 我们围到苹果木炉火旁。亮钢炉栅大得惊人，上面的壁炉台足有十英尺高。小猫拿出各种古怪的利口酒，把我们围在中间，又备好一种最适合给烟斗开场的香烟。
      - id: ch01-b11
        speaker: dick_four
        text: 啊，这才叫享福！回国以后，我还是头一回觉得暖和。
      - id: ch01-b12
        speaker: narrator
        text: 狄克四躺在沙发上，身上裹满毯子。除了小猫，我们几乎都贴到了火边。小猫在家住久了，一觉得冷，竟会去活动身体。这种阴森可怕的消遣，岛国上的英国人却很热衷。
      - id: ch01-b13
        speaker: mcturk
        text: 你敢提一个字的冷水澡和快步走，我就杀了你，小猫。我也有肝病。还记得吗？从前星期日一早爬出被窝，夏天若有五十七华氏度就算享受，然后还得跑到卵石滩外洗澡。呃！
      - id: ch01-b14
        speaker: tertium
        text: 我一直想不通。咱们那时候怎么会先到盥洗室，把自己烫得通红，再浑身毛孔大开地上楼，迎着新雪或冻黑的严霜？可我记得，一个人也没死。
      - id: ch01-b15
        speaker: mcturk
        text: 说起洗澡，甲虫，还记得五号自修室那一回吗？就是“兔子蛋”整治金先生的晚上。如今只要能见老斯托基一面，我什么都肯给。两间自修室的人，就缺他了。
      - id: ch01-b16
        speaker: dick_four
        text: 斯托基是本世纪最了不起的人。
      - id: ch01-b17
        speaker: beetle
        text: 你怎么知道？
      - id: ch01-b18
        speaker: dick_four
        text: 我怎么知道？你要是跟他一起陷进过险境，就不会这么问。
      - id: ch01-b19
        speaker: beetle
        text: 八七年品第营地以后，我就没见过他。那时他正走运，已经长到七英尺高、四英尺厚了。
      - id: ch01-b20
        speaker: tertium
        text: 能干。能干得吓人。
      - id: ch01-b21
        speaker: kitten
        text: 八四年在埃及，他差点上军事法庭，被革职。我跟他坐同一艘运兵船出发，跟他一样生嫩。只是我露了怯，他没有。
      - id: ch01-b22
        speaker: mcturk
        text: 怎么回事？
      - id: ch01-b23
        speaker: kitten
        text: 也没什么。他的上校给他二十个英国兵，叫他在萨瓦金后方洗东西，或是刷骆驼，差不多就是那种差事。他却往内地深入五英里，跟“绒毛佬”交上了手。他指挥了一场漂亮的撤退，还收拾了八个。他知道自己无权跑那么远，就抢先给气得口吐白沫的上校写信，抱怨自己行动时得到的支援太少。老天，那口气简直像一个肥旅长在痛骂另一个。后来他就进了参谋团。
      - id: ch01-b24
        speaker: abanazar
        text: 这，完完全全就是斯托基。
      - id: ch01-b25
        speaker: beetle
        text: 你也碰见过他？
      - id: ch01-b26
        speaker: abanazar
        text: 哦，是的。那场史诗的尾声，我也在场。你们不知道吗？
      - id: ch01-b27
        speaker: narrator
        text: 小猫、麦克特克和我都不知道，于是客客气气地请他说明白。
      - id: ch01-b28
        speaker: tertium
        text: 没什么大不了的。两年前，我们在开—钦山里遇到麻烦，是斯托基把大家带出来的。就这些。
      - id: ch01-b29
        speaker: narrator
        text: 麦克特克盯着小三，眼里全是爱尔兰人对笨嘴拙舌的撒克逊人的鄙视。
      - id: ch01-b30
        speaker: mcturk
        text: 天哪！爱尔兰竟然让你们这种人统治。小三，你就不害臊？
      - id: ch01-b31
        speaker: tertium
        text: 我不会讲故事。别人开口胡吹时，我倒能插几句。问狄克四吧。
      - id: ch01-b32
        speaker: dick_four
        text: 我就知道你不会。先给我一杯威士忌苏打。你们拿香槟洗澡的时候，我一直喝柠檬饮料和氨化奎宁，脑袋转得像陀螺。
      - id: ch01-b33
        speaker: narrator
        text: 他抹了抹杯沿上方那截残破的胡子，牙齿仍在格格打战，随后讲了起来。
      - id: ch01-b34
        speaker: dick_four
        text: 开—钦—马洛特远征，你们都知道吧？我们拉出一支他们不敢交手的野战部队，把他们的魂都吓掉了。两个结盟对付我们的部落一枪没放就来投降。那群毛茸茸的恶棍，管束手下的本事不比我强，却又保证又发誓。就凭这点靠不住的证据，亲爱的小猫，你们政务官便说当地已经平定。
      - id: ch01-b35
        speaker: abanazar
        text: 我当时在西姆拉。
      - id: ch01-b36
        speaker: dick_four
        text: 别管，反正是一丘之貉。你们拿着不值两便士半的条约，就宣布当地已经平定。政府照例发了蠢，开始修路，还指望本地人出劳力。那些没赶上战事的人以为再不会出事，急着回印度。可这种小乱子我见过两次，心里不踏实，就使尽聪明，替自己弄到道路巡逻队的差事。不必铲土，只要带卫队体面地来回巡视。能撤的部队全撤了，我留在大本营，以本团四十来个帕坦兵为核心，大半还是新兵，再让一队队筑路工人按政务部门的勘测深入山里。
      - id: ch01-b37
        speaker: tertium
        text: 营里还办过几场很不错的合唱会。
      - id: ch01-b38
        speaker: dick_four
        text: 我的少尉是个虔诚的小畜生，不喜欢合唱会，于是害了肺炎。我只好在营里四处找人，发现小三挂着助理副军需长的名头在那里高谈阔论。上帝知道，他根本不适合那差事。大本营里还有六七个老学院的人。边境一有乱子，我们总是人多势众。我听说小三是匹稳当的老驮马，就直截了当地告诉他，必须脱掉那条副军需长裤子来帮我。他当场报名。我们跟上面说妥，便带四十个帕坦兵沿路查看筑路队。
      - id: ch01-b39
        speaker: dick_four
        text: 倒数第二队是麦克纳马拉的。还记得那个在安巴拉把小提琴拉得要命的工兵老麦克吧？最后一队是斯托基的。他带几个心爱的锡克兵，守在道路最前端。麦克相信他不会有事。
      - id: ch01-b40
        speaker: tertium
        text: 斯托基本人就是个锡克人。只要办得到，他总会像钟表一样准时，定期带手下去阿姆利则金庙祷告。
      - id: ch01-b41
        speaker: dick_four
        text: 别插嘴，小三。离开老麦克又走了四十英里，我才找到斯托基。手下很客气，却很坚定地告诉我，乡里正在起事。那地方不是齐脖深的雪，就是让人顺山沟滚下去。甲虫若来写，大概会叫它鬼地方。答应给筑路队出劳力的善良居民都躲在岩石后放冷枪。我们只好全速去找斯托基。
      - id: ch01-b42
        speaker: dick_four
        text: 我猜斯托基一定躲得很好。黄昏时，我们果然找到他和筑路队。他们舒舒服服地缩在一座马洛特人的旧石堡里，严实得像虫子钻进毯子。堡角有座瞭望塔，俯视着从悬崖炸出的道路，路面低了五十英尺，再往下五六百英尺，是半英里宽、两三英里长的峡谷。峡谷对面有人正按章法测算我们的距离。我砸门钻进去，一脚绊在斯托基身上。他穿着油腻染血的旧羊皮袄，蹲在地上同手下吃饭。三个月前我只匆匆见过他半分钟，这时却像昨天才分手。他从容地挥挥手。
      - id: ch01-b43
        speaker: stalky
        text: 你好，阿拉丁！你好，皇帝！你们正赶上开场。
      - id: ch01-b44
        speaker: dick_four
        text: 你的队伍呢？少尉呢？
      - id: ch01-b45
        speaker: stalky
        text: 都在这里了，剩下的全在这里。小埃弗里特已经死了，尸体在瞭望塔里。他们上星期袭击筑路队，杀了他和七个人。我们被围了五天。我看，他们让你进来，是想连你也一网打尽。全国都反了，你这是一头走进了上等圈套。
      - id: ch01-b46
        speaker: narrator
        text: 斯托基咧嘴笑了，狄克四和小三却看不出有什么可笑。他们没带自己部队的口粮，斯托基的粮食也只够四天。政务官曾告诉大家，当地人很友善。
      - id: ch01-b47
        speaker: dick_four
        text: 为了让我们住得更舒服，他领我们上瞭望塔去看可怜的埃弗里特。尸体躺在一英尺深的积雪里，脸上没有一根胡子，看着像个十五岁的姑娘。他太阳穴中了弹，可马洛特人还没有放过他，在尸体上留下了自己的记号。斯托基解开他的军装，胸前露出一道奇怪的镰刀形伤口。小三，还记得他眉毛上全是雪吗？还记得斯托基把灯挪动时，光影一晃，他看上去简直又活过来了吗？
      - id: ch01-b48
        speaker: tertium
        text: 记得。不过我也记得斯托基那张可怕的脸。他鼻孔全张开，跟从前欺负小跟班时一模一样。那真是个美妙的夜晚。
      - id: ch01-b49
        speaker: dick_four
        text: 我们就在埃弗里特的尸体旁开军事会议。斯托基说，马洛特人和开—钦人放下世仇，一起起事，打算先收拾我们。峡谷对面的是开—钦人，子弹飞过来约有半英里。他们在山脊下垒出一排石垒，睡在那里，只等我们饿死。马洛特人则遍布正面。堡后没有好掩体，否则他们也会守在那里。斯托基更提防开—钦人，说马洛特人只是些奸诈的野狗。两边合计至少五百人，却始终不肯合力冲进来，因为他们在家乡本是世仇，谁也不信谁。唯一一次试着冲锋，斯托基把两包炸路用的药料扔进人群，多少败了他们的兴。
      - id: ch01-b50
        speaker: stalky
        text: 现在归你指挥。为了给堡里补粮，我要是自行采取任何必要行动，你大概不会介意吧？
      - id: ch01-b51
        speaker: dick_four
        text: 当然不会。
      - id: ch01-b52
        speaker: narrator
        text: 灯随即灭了。狄克四和小三不愿陪着埃弗里特，只得摸黑爬下塔梯。斯托基已经不见，他们猜他去清点储备了。两个人提防敌人冲锋，在四处飞来的枪弹中轮流熬到天亮。
      - id: ch01-b53
        speaker: dick_four
        text: 天亮后，斯托基连影子也没有。我去找他的土著高级军官拉坦·辛格商量。那是个来自贾朗达尔一带的白胡子老人，气派非凡。他只是咧嘴笑，说一切安好。照他的说法，斯托基先前已经两次离开石堡，谁也不知道去了什么地方。他认定斯托基一定会毫发无伤地回来，还暗示斯托基是某种刀枪不入的古鲁。尽管他如此笃定，我还是叫全队把口粮减半，又派人赶快在墙上凿出射击孔。
      - id: ch01-b54
        speaker: narrator
        text: 中午前后，没完没了的暴雪落下来，敌人的枪声终于停了。堡里弹药短缺得厉害，大家回击得很节省，每小时恐怕不到五枪，不过通常每一枪都能打中一个人。狄克四正同拉坦·辛格说话，忽然看见斯托基从瞭望塔走下来。他眼圈微微浮肿，身上那件旧羊皮袄结满暗红色的冰，颜色就像葡萄酒。
      - id: ch01-b55
        speaker: stalky
        text: 这种暴风雪靠不住。赶紧出去，能抢多少就抢多少。开—钦人和马洛特人眼下闹了点摩擦。
      - id: ch01-b56
        speaker: narrator
        text: 狄克四赶紧叫小三带二十个帕坦兵出去。他们在大雪里折腾了一阵，撞上一处离堡大约八百码的营地。那里只有几个人看守，营火旁拴着六只羊。他们解决了守卫，抢走六只羊和所有能背动的粮食，然后平安回堡。没有一个敌人朝他们开枪。雪下得实在太密，四下仿佛一个人也没有。
      - id: ch01-b57
        speaker: stalky
        text: 这些就够了，没必要拿人命冒险。两族正在峡谷尽头开大会。这个所谓的联盟，看来不怎么牢靠。
      - id: ch01-b58
        speaker: dick_four
        text: 你们知道那疯子做了什么吗？瞭望塔下面有间地下粮窖。斯托基炸路时，从侧面炸穿了一个洞。他偏偏是斯托基，所以把洞留着以后用，还把埃弗里特的尸体压在塔通往粮窖的楼梯口。每次进出，他都得把尸体搬开，再照原样放回去。锡克兵当然不敢靠近。
      - id: ch01-b59
        speaker: dick_four
        text: 他从洞里钻出去，落到那条从悬崖炸出的道路上。接着在黑夜和呼啸的暴雪里，他沿山沟边缘下到谷底，涉过半冻结的小河，再顺一条自己发现的小径爬上对面，出现在开—钦人右翼。随后他翻过一道跟敌军后方平行的山脊，在山脊后走了半英里，又从阵线左边出来。那里峡谷变浅，马洛特和开—钦两营之间有条正规的通道。凌晨两点左右，一个开—钦人终于发现了他。斯托基没让对方发出声音，把人杀掉，丢在原处，胸口还刻上了埃弗里特身上的马洛特记号。
      - id: ch01-b60
        speaker: stalky
        text: 我已经尽量节省了。他要是喊出声，我就死定了。这种事我从前只做过一回，这也是第一次试那条路。步兵走完全没问题。
      - id: ch01-b61
        speaker: dick_four
        text: 那你杀的第一个人呢？
      - id: ch01-b62
        speaker: stalky
        text: 那是他们杀掉埃弗里特后的第二夜。我出去给手下找退路，被人发现，只好私下扭断他的脖子，把他扔下几块岩石。后来我想到，若能找回尸体，给他加上马洛特人的记号，便可以留给开—钦人自己推断。所以下一晚我又出去照办了。
      - id: ch01-b63
        speaker: stalky
        text: 开—钦人受了很大震动。两族明明发过誓，要放下彼此所有的血仇，马洛特人竟然又做出这两桩卑劣的事。今早我伏在他们的石垒后面亲眼看着。他们已经全去了峡谷尽头商议，个个气得厉害。也难怪。
      - id: ch01-b64
        speaker: narrator
        text: 斯托基说这些话时，一个字一个字往外丢。
      - id: ch01-b65
        speaker: kitten
        text: 我的天！
        emotion: surprised
      - id: ch01-b66
        speaker: mcturk
        text: 亲爱的人哪！
      - id: ch01-b67
        speaker: tertium
        text: 斯托基出手跟踪了。事情就是这么简单。
      - id: ch01-b68
        speaker: dick_four
        text: 他可不承认。他一直说自己只是善用了运气。拉坦·辛格抓住他的靴子，趴在雪里膜拜，我们的人也一起欢呼。
      - id: ch01-b69
        speaker: tertium
        text: 我们的帕坦兵谁也不信那是运气。他们发誓说，斯托基本该生作帕坦人。拉坦·辛格却说斯托基是帕坦人，我们差点在堡里打起来。老头对我的杰马达尔气得要命，斯托基只摇摇手指，两人才闭嘴。
      - id: ch01-b70
        speaker: tertium
        text: 老拉坦·辛格的刀都拔出一半了。他还发誓，每杀一个开—钦人或马洛特人，就要把尸体烧掉。这一下可把我的杰马达尔惹火了。他并不介意跟信奉同一宗教的人交战，却绝不肯断送穆斯林同胞进入天堂的机会。两人眼看又要动手，斯托基只好轮番用普什图语和旁遮普语，叽里咕噜地劝他们。甲虫，他到底在哪里学会普什图语的？
      - id: ch01-b71
        speaker: beetle
        text: 别管他说什么话，狄克。讲大意。
      - id: ch01-b72
        speaker: dick_four
        text: 我偶尔也能跟狡猾的帕坦人说几句，可我不会用普什图语说双关，更不会像他那样拿荤故事收尾。他摆布那两条老战犬，像拉手风琴。斯托基断定，两族为了证明彼此信得过，当晚一定会联手攻堡，却不会真打到底，因为出了那些小意外，他们已经彼此猜疑。
      - id: ch01-b73
        speaker: stalky
        text: 黄昏时，我带锡克兵爬出去，沿那条山羊道绕到开—钦人后面。等进攻打热闹了，我们朝马洛特人远远放几枪。这会分散他们的心思，让他们更加激动。随后你们出来收拾残局，大家在峡谷尽头会合。办完以后，我建议回麦克营地找点吃的。
      - id: ch01-b74
        speaker: kitten
        text: 当时是你指挥？
      - id: ch01-b75
        speaker: dick_four
        text: 我的军龄比斯托基长三个月左右，比小三长两个月。可我们都出自老学院。我敢说，有记载的小型战斗里，只有这一场没有人嫉妒别人。
      - id: ch01-b76
        speaker: tertium
        text: 我们没有，可古尔·谢尔·汗和拉坦·辛格又吵起来了。杰马达尔说，锡克人根本不懂跟踪，“《古兰经》先生”应该带熟悉山地活计的帕坦人出去。拉坦·辛格说，“《古兰经》先生”明明知道，帕坦人生来就是逃兵，锡克人才是绅士，就算不擅长贴地爬也一样。
      - id: ch01-b77
        speaker: tertium
        text: 斯托基插了一句不知从哪儿学来的妇人谚语，逗得两人弯腰大笑。他说以后可以拿敌人来比高低，这次爬山却要带自己的锡克兵，因为他们枪打得准。这倒是真的。每人分到一骡子弹药，他们便心满意足了。
      - id: ch01-b78
        speaker: dick_four
        text: 天一黑，斯托基先睡了一小会儿，再带三十个锡克兵从塔里下去。每个人经过靠墙支起的小埃弗里特时都敬了礼。我最后听见他说的是“小心，要摔下去了”，随后他们一个接一个，从黑洞洞的虚空边缘落下去。
      - id: ch01-b79
        speaker: dick_four
        text: 九点刚过，联军开始进攻。峡谷对面是开—钦人，正面是马洛特人。两边远远朝我们开枪，互相催促着来割异教徒的喉咙。接着他们散开推进到门前，照老法子骂帕坦兵是叛徒，邀他们参加圣战。一个来自德拉伊斯梅尔的年轻兵跳上墙头回骂，下来时却哭得像个孩子。一颗子弹正中他的手掌。手掌中弹，所有神经都像被搔到，谁也忍不住。小三接过他的枪，专打外面那些人的脑袋，不让他们再骚扰射击孔。我们的小伙子个个想开门冲出去，可这不合计划。
      - id: ch01-b80
        speaker: dick_four
        text: 快到午夜，我终于听见峡谷对面传来斯托基的马蒂尼步枪声，一下，又一下，又一下。马洛特人那边立刻爆出一片咒骂。他们的主力藏在山坡的一道褶皱后面，我们从堡里看不见。斯托基正在后方狠狠干他们。于是马洛特人十分自然地向右转过半身，对他们眼里背信弃义的开—钦盟友打出一轮猛烈而正规的齐射。
      - id: ch01-b81
        speaker: dick_four
        text: 斯托基搅局还不到十分钟，峡谷两侧已经打成一团。等我们看清时，谷里乱得像锅粥。开—钦人从上方石垒涌出来，要惩罚马洛特人。我用望远镜看见斯托基已经悄悄滑到他们后面。开—钦人只好沿山腰跑到峡谷变浅处，准备渡过去打马洛特人。马洛特人一看他们背后受袭，简直高兴坏了。
      - id: ch01-b82
        speaker: dick_four
        text: 我觉得这时也该安慰一下开—钦人，就把全队从堡里拉出去，排成冲锋步前进，把姑且称作马洛特左翼的那一伙撵得一团糟。其实即便到了这时候，他们若肯抛开争执，仍能把我们生吞。可两边已经互相打了半夜，谁也不肯停。我们只要冲向马洛特人，他们便更起劲地朝开—钦人开枪，好证明自己站在我们这边，随后又沿峡谷跑上几百码，停下来继续打。斯托基看懂我们的把戏，也在峡谷那边照样来了一遍。老天，开—钦人竟做出一模一样的反应。
      - id: ch01-b83
        speaker: tertium
        text: 你忘了，他还用军号吹《帕齐呀，看好孩子》，催我们快走。
      - id: ch01-b84
        speaker: mcturk
        text: 他真吹了？
        emotion: surprised
      - id: ch01-b85
        speaker: narrator
        text: 不知怎么，我们所有人都唱了起来，故事只好停住。阿拉丁剧团里，没有一个人会忘记那支曲子。
      - id: ch01-b86
        speaker: tertium
        text: 当然吹了。对，就是《帕齐》。接着讲吧，狄克。
      - id: ch01-b87
        speaker: dick_four
        text: 最后，我们把两群人赶到谷口的平地，让他们迎面撞在一起。暴雪遮天蔽日，他们滚成一团，厮打、捅刺、咒骂。他们人多，身上又毛茸茸的，我们没有追。
      - id: ch01-b88
        speaker: dick_four
        text: 斯托基抓到一个俘虏，是服役二十五年、领养老金退伍的老印度兵，连退伍证都带着。那是个豪爽有趣的老家伙，白天还在逼手下冲击我们，此刻正气他们胆小。拉坦·辛格想拿刺刀捅他。锡克人无法明白，一个人既然堂堂正正替政府服过役，怎么还能反过来打政府。斯托基救下俘虏，牢牢留在身边。我想，他另有打算。
      - id: ch01-b89
        speaker: dick_four
        text: 回到堡里以后，我们埋葬了小埃弗里特。斯托基无论如何不肯把那座石堡炸掉。随后大家才撤离。整场战斗算下来，我们总共只损失十个人。
      - id: ch01-b90
        speaker: beetle
        text: 七十个人只损失十个。那些人是怎么没的？
      - id: ch01-b91
        speaker: dick_four
        text: 前半夜敌人曾经冲进堡里，几个马洛特人翻过了大门。有一两分钟，局面相当吃紧，不过那批新兵应付得很漂亮。幸亏没有重伤员需要抬走，因为大家还得走四十英里，才能回到麦克纳马拉营地。老天，我们走得真快。半路上，老拉坦·辛格终于撑不住了。大家把四支步枪并在一起，上面铺好斯托基的大衣，把老人吊在上面抬着走。斯托基、他的俘虏和两个锡克兵轮流做抬夫。
      - id: ch01-b92
        speaker: dick_four
        text: 后来我走着走着睡着了。腿麻透以后，一个人在行军时真的能够睡觉。麦克发誓，我们全都打着呼噜走进他的营地，队伍一停，所有人便原地倒下。他的人只好像拖一袋袋鹰嘴豆似的，把我们一个个拖进帐篷。我醒来时，看见斯托基正枕着老拉坦·辛格的胸膛睡觉。他一口气睡了二十四小时。我只睡了十七小时，不过我那时正要发痢疾。
      - id: ch01-b93
        speaker: tertium
        text: 什么正要发？胡扯！我们进堡以前，你已经得了痢疾。
      - id: ch01-b94
        speaker: dick_four
        text: 得了吧。你每次见到麦克纳马拉，都拿剑朝他扔，要求立刻开战地军事法庭。唯一让你安静的法子，是每半小时逮捕你一次。你足足疯了三天。
      - id: ch01-b95
        speaker: tertium
        text: 我一个字也不记得。不过勤务兵喂我牛奶，我倒记得。
      - id: ch01-b96
        speaker: mcturk
        text: 斯托基后来怎么样？
      - id: ch01-b97
        speaker: dick_four
        text: 他安详得像头婆罗门公牛。可怜的老麦克用尽皇家工兵的脑筋，也不知道该拿局面怎么办。我的痢疾已经烂透了，小三还在说胡话，队伍里一半的人都有冻伤，偏偏麦克又奉命必须在入冬前撤掉营地，带队归队。毫发无伤的斯托基便替他解决麻烦，拿走一半给养，省得费力运回平原，又拿走营里能够找到的全部弹药。
      - id: ch01-b98
        speaker: dick_four
        text: 在拉坦·辛格建议和协助下，斯托基领着全部锡克兵、宝贝俘虏，以及他和俘虏诱来的一群放荡跟班，徒步返回石堡。他手里有六十个各式各样的人，还有他那张厚脸皮。他一走，麦克高兴得几乎要哭。没有一道明令要求斯托基必须在大雪封山前撤回。麦克最看重命令，斯托基也一样，只要那命令合他的意。
      - id: ch01-b99
        speaker: tertium
        text: 他告诉我，他要去恩加丁。他坐在我的行军床上抽烟，逗得我笑出眼泪。第二天，麦克纳马拉把我们全赶下平原。我们简直是一所会走路的医院。
      - id: ch01-b100
        speaker: dick_four
        text: 斯托基对我说，麦克纳马拉简直是上天送给他的救星。我常见他坐在麦克的帐篷里，耐心听麦克拉小提琴。每逢一支曲子停下，他便趁着间歇连哄带骗，从麦克手里一把又一把地弄走十字镐、铁锹和炸药筒。那是我们最后一次见他。大约一星期以后，山口被大雪彻底封住。我想那阵子的斯托基，也根本不愿意再让外面的人找到。
      - id: ch01-b101
        speaker: abanazar
        text: 他不愿意。他可一点也不愿意。哈，哈！
      - id: ch01-b102
        speaker: dick_four
        text: 先等等，小猫，到了地方自然让你接。我回本团五个月后，开春带两个连出发，名义上照看边界那边的朋友，其实是去招兵。偏有个蠢下士从姨妈家继承了一桩无聊血仇，还把它带进山区，当地好汉便不肯投我的部队。那下士请短假去处理，这完全合规矩，可他杀的偏偏是我心爱勤务兵的叔叔，实在不像话。
      - id: ch01-b103
        speaker: dick_four
        text: 再过三个月，伽色尼团的哈里斯就会扫过那里，把我看中的人全抢走。大家都恨那下士，觉得他至少该等我们招满两个连，再谈那桩恶心的恋爱。好在那畜生还剩一点职业情分。他叫姨妈族里的人连夜来找我，说只要我接受安全担保，就带我去看一批美人。
      - id: ch01-b104
        speaker: dick_four
        text: 我立刻窜过边界，向另一边深入大约十英里。带路的游匪把我领进一道干河床，指给我看七十来个人。他们手里拿着各式各样的武器，队伍却站得像女王陛下麾下一个训练有素的连。接着，其中一人从队列里走出来，摸摸索索地转出一把旧军号。那副样子就像闹剧演员满台寻找自己的单片眼镜。他举起号，吹起《帕齐呀，看好孩子》，却只吹到一半便停下了。
      - id: ch01-b105
        speaker: narrator
        text: 狄克四也只能讲到这里，因为大家又把老歌从头唱了两遍，随后为了重唱，又唱了一遍。
      - id: ch01-b106
        speaker: dick_four
        text: 那人解释说，我若知道这支曲子余下的部分，他就交给我一封信，信是那首歌的主人写的。于是，孩子们，我拿过他的军号，把熟悉的老曲子完整吹完，这才得到了信。我知道你们都爱看那熟悉而还没完全定形的笔迹。别抢，我念给你们听。
      - id: ch01-b107
        speaker: stalky
        text: 埃弗里特堡，二月十九日。亲爱的狄克或小三，持信人统领七十五名新兵，个个是地道的恶鬼，却愿意改过。他们已经稍加打磨，再下锅煮一煮，也许能够成材。请拨三十人给我的副官。他虽是上帝亲造的蠢驴，今年春天也需要人手，其余归你。
      - id: ch01-b108
        speaker: stalky
        text: 你或许会有兴趣知道，我已把道路修到马洛特地区尽头。所有牵涉去年九月事件的头人和祭司，各服一个月劳役，还得从自家房屋拆石头供应筑路。埃弗里特坟上已经筑起四十英尺高的土丘，日后正好做三角测量基点。拉坦·辛格向你致最诚挚的色兰。我正在缔结几项条约，也已授予那位俘虏地方官衔。他同样向你致以色兰。A·L·科克兰。
      - id: ch01-b109
        speaker: dick_four
        text: 好啦，这就是全部。
      - id: ch01-b110
        speaker: narrator
        text: 吼叫、喊闹和笑声终于平息，其中大概也夹着眼泪。
      - id: ch01-b111
        speaker: dick_four
        text: 我尽快护送那伙人过了边界。他们起初有些想家，可一认出我手下几个参加过开—钦冲突的人，立刻振作起来，后来果真成了一批极好的兵。从埃弗里特堡到我发现他们的地方，足足隔着三百多英里。现在，小猫，该由你讲斯托基的后半段了，就讲你亲眼见到的那些事。
      - id: ch01-b112
        speaker: narrator
        text: 阿巴纳扎发出一阵略显紧张、很能骗人的官场笑声。他那白白胖胖的模样，看起来只像一只毛茸茸的波斯猫。
      - id: ch01-b113
        speaker: abanazar
        text: 没什么大不了。那年春天，我正在西姆拉。咱们的斯托基终于从大雪封住的山地里钻出来，随后便越过寻常的层层官署，开始直接同政府通信。
      - id: ch01-b114
        speaker: dick_four
        text: 一派君王作风。
      - id: ch01-b115
        speaker: abanazar
        text: 现在轮到我了，狄克。他做了一大堆不该做的事，还从法律解释上把政府押给了各种行动。
      - id: ch01-b116
        speaker: mcturk
        text: 拿国家信用作抵押，是吧？
      - id: ch01-b117
        speaker: abanazar
        text: 差不多。最为难的是，每件事都该死的方便，理由还周全得不得了。样样来得恰到好处，像是他看过内部情报。当然，他绝不可能看过。
      - id: ch01-b118
        speaker: tertium
        text: 呸！无论哪一天，我都押斯托基胜过外交部。
      - id: ch01-b119
        speaker: abanazar
        text: 他能想到的事几乎全做了，只差铸一批印着自己头像和名号的钱币。每一项行动，他都拿修筑那条该死的道路和大雪封住山口作借口。他送来的报告更是惊人。冯·莱纳特读着读着，起先只是两手揪住头发，后来简直气喘吁吁。
      - id: ch01-b120
        speaker: von_lenart
        text: 这个不知名的沃伦·黑斯廷斯是谁？必须杀掉！必须在公事上杀掉！总督绝不会容忍。闻所未闻！必须由阁下亲自杀掉。叫他来，狠狠训斥一顿。
        emotion: angry
      - id: ch01-b121
        speaker: abanazar
        text: 于是我发了一封长得没完的公文训斥，同时又拍去一封私电。
      - id: ch01-b122
        speaker: kitten
        text: 你？
        emotion: surprised
      - id: ch01-b123
        speaker: abanazar
        text: 是我，没什么了不起。不过听完你的故事，这倒真巧。我的电文是这样写的。阿拉丁如今娶新娘，皇帝的怒气已消光。我劝你还是还魂吧，但愿诸君看得欢畅。
      - id: ch01-b124
        speaker: abanazar
        text: 真怪，那首老歌怎么会跳进脑子里。这几句既不表态，又很能鼓舞人。唯一的缺点，是他那位皇帝的怒气远没有消。斯托基离开山中堡垒，不慌不忙来到西姆拉，准备被供上祭坛的尖角。
      - id: ch01-b125
        speaker: beetle
        text: 可照理说，总司令才是……
      - id: ch01-b126
        speaker: abanazar
        text: 总督阁下有个念头。他以为只要像金先生当年训咱们那样，把一个小小的初级上尉痛骂一顿，就算亲自掌着帝国缰绳。冯·莱纳特当然只管鼓励。我甚至不能肯定，这念头不是他塞给总督的。
      - id: ch01-b127
        speaker: beetle
        text: 那他们的品种跟我那时候相比，已经变了。
      - id: ch01-b128
        speaker: abanazar
        text: 也许吧。斯托基像犯错的小男孩一样被送去挨骂。我有理由相信，总督气得头发全竖起来。他足足训了斯托基一个钟头。斯托基站在屋子中央立正。据他发誓说，冯·莱纳特在后面默默打手势，假装替总督抚平竖起的头发。斯托基不敢抬眼，否则一定会笑出来。
      - id: ch01-b129
        speaker: kitten
        text: 那斯托基为什么没有被公开革职？
      - id: ch01-b130
        speaker: abanazar
        text: 为什么呢？为了给他机会挽救那段见鬼的事业，也免得伤透他父亲的心。斯托基根本没有父亲，不过那不重要。他表现得像萨纳瓦尔孤儿院似的，总督阁下便开恩饶了他。后来他到我的办公室，在对面坐了十分钟，鼻孔一张一鼓，终于开口。
      - id: ch01-b131
        speaker: stalky
        text: 小猫，要是我以为那个编篮子的……
      - id: ch01-b132
        speaker: mcturk
        text: 哈！他还记得那件事。
      - id: ch01-b133
        speaker: stalky
        text: 要是我以为那个只值两安那的编篮匠治理着印度，我发誓明天就入籍做俄国人。我是个不被理解的女人，这件事伤透了我的心，非得在印度休六个月狩猎假才能养好。小猫，你看我请得到吗？
      - id: ch01-b134
        speaker: abanazar
        text: 大约三分半钟以后，他就把六个月的狩猎假请到了。十七天后，他再次回到拉坦·辛格怀里，身上可怕地背负着这场公开训斥带来的耻辱。他同时奉到命令，要把自己的指挥权和其他事务移交给卡思卡特·麦克莫尼。
      - id: ch01-b135
        speaker: dick_four
        text: 孩子们，请注意！一个政务部门的上校，带着三十名锡克兵，守在一座山顶上。请注意！
      - id: ch01-b136
        speaker: abanazar
        text: 卡思卡特当然并不蠢，哪怕他确实是个政务官。所以接下来的六个月，他索性让斯托基在离埃弗里特堡十五英里以内自由打猎。我一直听说，斯托基和拉坦·辛格，还有那个被他救下的老俘虏，三个人亲密得像一窝贼。后来斯托基大概就这么闲逛着回了自己的部队。从那以后，我再也没有见过他。
      - id: ch01-b137
        speaker: mcturk
        text: 可我见过。
      - id: ch01-b138
        speaker: narrator
        text: 麦克特克这句话说得满怀骄傲。听见他竟然见过斯托基，大家立刻齐刷刷转过身，全都望向了他。
      - id: ch01-b139
        speaker: mcturk
        text: 就在今年热季初。我在贾朗达尔河间地带扎营，撞见斯托基坐在一座锡克村里。他占着全村唯一的贵宾椅，半村人趴在面前，膝上坐了十来个锡克娃娃，一个老泼妇拍着他肩膀，他脖子上还套着花环。他说自己在招兵。
      - id: ch01-b140
        speaker: mcturk
        text: 那晚我们一起吃饭，他一个字也没提石堡。不过他告诉我，要是缺给养，最好自称“《古兰经》先生”的兄弟。我照办了，锡克人果然不肯收钱。
      - id: ch01-b141
        speaker: dick_four
        text: 啊，那准是拉坦·辛格的村子之一。
      - id: ch01-b142
        speaker: narrator
        text: 听到这里，大家都不说话了，只默默地抽了一阵烟。麦克特克回头望着许多年前的旧日时光，忽然又想起一件事。
      - id: ch01-b143
        speaker: mcturk
        text: 斯托基有没有告诉你，“兔子蛋”那晚是怎样整治金先生的？
      - id: ch01-b144
        speaker: dick_four
        text: 没有。
      - id: ch01-b145
        speaker: narrator
        text: 麦克特克便把那件事讲给他听。狄克四点点头。
      - id: ch01-b146
        speaker: dick_four
        text: 明白了。他只是把那一招原样又用了一遍。没人比得上斯托基。
      - id: ch01-b147
        speaker: beetle
        text: 你正是在这里弄错了。印度到处都有斯托基，有切尔滕纳姆、黑利伯里和马尔伯勒出来的家伙，我们对他们一无所知。等真有一场大乱子，惊喜才会开始。
      - id: ch01-b148
        speaker: dick_four
        text: 谁会惊喜？
      - id: ch01-b149
        speaker: beetle
        text: 另一边。就是那些坐头等车厢上前线的先生们。想一想，把斯托基放到欧洲南边，给他足够的锡克兵，再给一个还算合理的劫掠机会。静下来好好想想。
      - id: ch01-b150
        speaker: kitten
        text: 这话有些道理，可你太乐观了，甲虫。
      - id: ch01-b151
        speaker: beetle
        text: 我当然有权乐观。整件事不就是我一手造成的吗？别笑。“阿拉丁如今娶新娘”是谁写的，嗯？
      - id: ch01-b152
        speaker: tertium
        text: 那跟这件事有什么关系？
      - id: ch01-b153
        speaker: beetle
        text: 关系大了。
      - id: ch01-b154
        speaker: kitten
        text: 证明给我看。
      - id: ch01-b155
        speaker: narrator
        text: 我已经证明了。
