  chapters:
    - id: ch01
      title: The Aladdin Company
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The music-room at the top of Number Five shook with an Aladdin rehearsal. Dickson Quartus, whom everyone called Dick Four, played Aladdin. He was also stage-manager, ballet-master, half the orchestra, and much of the writer, because the company had packed the show with jokes about the school. They would perform it next week in the downstairs study shared by Aladdin, Abanazar, and the Emperor of China. Across the landing lived the Slave of the Lamp, Princess Badroulbadour, and Widow Twankay, so the entire company could be gathered in moments. Wearing pink tights, a blue tinsel jacket, and a plumed hat, Dick Four pounded first the piano and then his banjo while the ballet stamped around him. He drove the whole affair with the confidence of a senior who had passed his Army Preliminary and hoped to enter Sandhurst in spring.
        - id: ch01-b02
          speaker: narrator
          text: At last Aladdin won his princess, Abanazar lay poisoned on the floor, and Widow Twankay finished her dance. Everyone agreed the show would somehow work when the night came.
        - id: ch01-b03
          speaker: tertius
          text: But what are we doing for the last song? We need something that will really send them out cheering.
        - id: ch01-b04
          speaker: narrator
          text: Tertius, the Emperor, was a tall fair-haired boy with the faintest possible mustache. He tugged at it with great determination.
        - id: ch01-b05
          speaker: abanazar
          text: What about John Peel? Or Drink, Puppy, Drink?
        - id: ch01-b06
          speaker: narrator
          text: Abanazar smoothed his loose lilac pajamas. They called him Pussy. He always looked half asleep, and his slow, gentle smile suited the Wicked Uncle perfectly.
        - id: ch01-b07
          speaker: dick_four
          text: Those are worn out. We might as well sing Grandfather's Clock. Stalky, what was that tune you hummed during prep last night?
        - id: ch01-b08
          speaker: narrator
          text: Stalky played the Slave of the Lamp. In black tights and a black doublet, with a silk half-mask pushed onto his forehead, he lay along the top of the piano and whistled a lively music-hall tune. Dick Four tipped his head, squinted down his large red nose, and tried the melody on the banjo.
        - id: ch01-b09
          speaker: dick_four
          text: Give me that once more and I'll have it. Now sing the words.
        - id: ch01-b10
          speaker: stalky
          text: Arrah, Patsy, mind the baby! Arrah, Patsy, mind the child! Wrap him in an overcoat, he's surely going wild! Arrah, Patsy, mind the baby! Just you mind the child awhile! He'll kick and bite and cry all night! Arrah, Patsy, mind the child!
        - id: ch01-b11
          speaker: dick_four
          text: Ripping! Absolutely ripping! But there won't be a piano on the night. We'll have to play it on the banjos while we dance. Tertius, try it with me.
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: The Emperor swept back his pea-green sleeves of state and joined Dick Four on a heavy nickel-plated banjo.
        - id: ch01-b13
          speaker: abanazar
          text: That's all very well, but I'm supposed to be dead then, right in the middle of the stage.
        - id: ch01-b14
          speaker: dick_four
          text: That's Beetle's problem. Beetle, make something up. Don't leave us standing here all night. You have to get Pussy out of sight and bring everyone back dancing at the end.
        - id: ch01-b15
          speaker: narrator
          text: Beetle was Widow Twankay. He wore a gray skirt and a wig of chestnut sausage curls set crookedly above spectacles mended with an old bootlace. He told the two banjo players to begin again, then swung one leg to the beat as the music grew louder.
        - id: ch01-b16
          speaker: beetle
          text: Um. Ah. Here we are. Aladdin now has won his wife.
        - id: ch01-b17
          speaker: narrator
          text: Dick Four sang the new line back to him.
        - id: ch01-b18
          speaker: tertius
          text: Your Emperor is appeased!
        - id: ch01-b19
          speaker: narrator
          text: Tertius threw out his chest to deliver it.
        - id: ch01-b20
          speaker: beetle
          text: Now Pussy jumps up and says, I think I'd better come to life. Then we all take hands, come forward, and sing, We hope you've all been pleased. Do you follow?
        - id: ch01-b21
          speaker: dick_four
          text: We follow. Good enough. What do we sing for the final ballet? Remember, it's four kicks and a turn.
        - id: ch01-b22
          speaker: beetle
          text: John Short will ring the curtain down, and ring the prompter's bell. We hope you know before you go that we all wish you well.
        - id: ch01-b23
          speaker: dick_four
          text: Ripping again! Now let's have the Widow's scene with the Princess. Hurry up, Turkey.
        - id: ch01-b24
          speaker: narrator
          text: McTurk came forward in a violet silk skirt and a flirtatious blue turban, slouching like a boy thoroughly ashamed of himself. Stalky climbed off the piano and gave him an unemotional kick.
        - id: ch01-b25
          speaker: stalky
          text: Play up, Turkey. This is serious business.
        - id: ch01-b26
          speaker: narrator
          text: Then authority knocked at the door. It was Mr. King in gown and mortarboard, taking a Saturday evening prowl before dinner.
        - id: ch01-b27
          speaker: king
          text: A locked door! What is the meaning of this? And what, may I ask, is the purpose of these very peculiar clothes?
          emotion: angry
        - id: ch01-b28
          speaker: abanazar
          text: It's the pantomime, sir. The Head gave us permission.
        - id: ch01-b29
          speaker: narrator
          text: As the only Sixth-form boy there, Abanazar answered. Dick Four stood firm, supported by the knowledge that his tights fitted him well. Beetle tried to disappear behind the piano. A borrowed gray skirt, a spotted bodice padded without much method with punishment papers, and patched spectacles did not make him dignified. Besides, his conscience was uneasy for other reasons.
        - id: ch01-b30
          speaker: king
          text: Of course. Useless foolery, just when your doubtful careers hang in the balance. And here is the old criminal gang, the allied forces of disorder. Corkran.
        - id: ch01-b31
          speaker: narrator
          text: Stalky smiled politely.
        - id: ch01-b32
          speaker: king
          text: McTurk.
        - id: ch01-b33
          speaker: narrator
          text: McTurk scowled.
        - id: ch01-b34
          speaker: king
          text: And naturally, the unspeakable Beetle. Our friend Gigadibs. Come out from behind that piano, you ink-stained clown. I suppose you provide the miserable verses for this performance. Do you consider yourself a poet?
        - id: ch01-b35
          speaker: beetle
          text: He's found one of them.
        - id: ch01-b36
          speaker: narrator
          text: Beetle thought it silently when he saw the color rising along King's cheekbone.
        - id: ch01-b37
          speaker: king
          text: I have just enjoyed reading a little composition of yours about me. It even attempts to rhyme. So you despise me, do you, Master Gigadibs? No explanations, please. I know it was not openly meant for me to read. I laughed at it. Yes, laughed. Paper pellets thrown by an ink-stained boy cannot disturb my perfect calm. And you are still very much a boy, Master Gigadibs.
        - id: ch01-b38
          speaker: beetle
          text: I wonder which one he found.
        - id: ch01-b39
          speaker: narrator
          text: That thought was silent too. Beetle had sent many lampoons into the school since learning that rhyme could carry a sharp correction.
        - id: ch01-b40
          speaker: narrator
          text: To prove how calm he was, King slowly tore Beetle to pieces with words. He mocked everything from the boy's loose shoelaces to his repaired spectacles. A poet's life at a large school was hard, and King had a vicious tongue. His own extravagant insults restored his good humor. He pictured Beetle ending as a filthy pamphlet writer, dying alone in an attic. He scattered a few insults over McTurk and Stalky as well, reminded Beetle to appear for judgment when summoned, and went down to Common-room to enjoy his triumph again.
        - id: ch01-b41
          speaker: king
          text: The worst part is that I waste such jewels of sarcasm on their thick heads. My wit is miles above those boys, I'm sure.
        - id: ch01-b42
          speaker: narrator
          text: King announced this loudly over his soup.
        - id: ch01-b43
          speaker: chaplain
          text: Well, I can't speak for Corkran's opinion of your style. But young McTurk reads Ruskin for pleasure.
        - id: ch01-b44
          speaker: king
          text: Nonsense. He only does that to show off. I do not trust that dark Celt.
        - id: ch01-b45
          speaker: chaplain
          text: He does nothing of the sort. I visited their study unofficially the other night, and McTurk was repairing the backs of four separate numbers of Fors Clavigera.
        - id: ch01-b46
          speaker: mason
          text: I know nothing about what they do privately. But bitter experience has taught me to leave Number Five study alone. Those boys are completely without souls.
        - id: ch01-b47
          speaker: narrator
          text: The other masters laughed, and Mason blushed.
    - id: ch02
      title: A Council of War
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Up in the music-room, the language was fierce. Only Stalky remained unmoved on top of the piano.
        - id: ch02-b02
          speaker: stalky
          text: That little swine Manders Minor must have shown King your verses. He's always creeping around after him. Go and kill him. Which poem was it, Beetle?
        - id: ch02-b03
          speaker: beetle
          text: I don't know. One was about King trying to make the small boys like him. The other put him in hell, telling the Devil he was a Balliol man. Both of them rhymed properly, I swear. By gum, perhaps Manders showed him both! I'll correct the little beast's rhythm for him.
        - id: ch02-b04
          speaker: narrator
          text: Beetle fought his way out of the skirt, rushed down two flights, and found a small pink-and-white boy in the form-room beside King's study, directly below Number Five. He chased Manders along the passage and into the Lower Third form-room. That room belonged to Manders's friends. Beetle returned much battered and untidy.
        - id: ch02-b05
          speaker: narrator
          text: He found McTurk, Stalky, and the rest of the pantomime company in his study, deep in an unlimited feast. There was coffee, cocoa, buns, hot new bread, sardines, sausage, ham-and-tongue paste, pilchards, three kinds of jam, and several pounds of Devonshire cream. Term would end in less than a month, and the studies had been starving for weeks.
        - id: ch02-b06
          speaker: beetle
          text: My hat! Who paid for all this, Stalky?
        - id: ch02-b07
          speaker: stalky
          text: You did.
        - id: ch02-b08
          speaker: beetle
          text: Confound you! You haven't pawned my Sunday trousers, have you?
        - id: ch02-b09
          speaker: stalky
          text: Keep calm. It was only your watch.
        - id: ch02-b10
          speaker: beetle
          text: My watch? I lost that weeks ago, out on the Burrows. It was the day we tried to shoot the old ram and our pistol burst.
        - id: ch02-b11
          speaker: stalky
          text: It fell out of your pocket because you're horribly careless. Turkey and I kept it safe. I've worn it for a week and you never noticed. I took it into Bideford after dinner today and got thirteen shillings and sevenpence. Here's the pawn ticket.
        - id: ch02-b12
          speaker: narrator
          text: Once Beetle knew his Sunday trousers were safe, he showed neither surprise nor anger. Abanazar watched from behind a thick slice of bread covered with cream and jam.
        - id: ch02-b13
          speaker: abanazar
          text: That's about as cool as anything I've ever heard.
        - id: ch02-b14
          speaker: mcturk
          text: You gave him the ticket, Stalky? You pawned his watch and gave him the ticket? You complete beast! Last month you two sold my watch, and I never saw any ticket.
          emotion: angry
        - id: ch02-b15
          speaker: stalky
          text: That was your fault. You locked your trunk, and we spent half the afternoon hammering it open. If you'd behaved like a Christian, Turkey, we might have pawned yours too.
        - id: ch02-b16
          speaker: abanazar
          text: Good heavens, you fellows really are communists. Still, let's thank Beetle for the feast.
        - id: ch02-b17
          speaker: stalky
          text: That's horribly unfair. I did all the work of pawning it. Beetle didn't even know he owned a watch. Oh, by the way, Rabbits-Eggs drove me into Bideford this afternoon.
        - id: ch02-b18
          speaker: narrator
          text: Rabbits-Eggs was the local carrier, a man who seemed as ancient as the Devon rocks. Stalky had invented the ugly nickname.
        - id: ch02-b19
          speaker: stalky
          text: He was fairly drunk, or he would never have let me ride with him. He's a little afraid of me for some reason. But I promised peace between us and gave him a shilling. He stopped at two pubs on the way back, so he'll be roaring drunk tonight. Beetle, stop trying to read. This is a council of war. And what happened to your collar?
        - id: ch02-b20
          speaker: beetle
          text: I chased Manders into the Lower Third room. All his horrible little friends piled on top of me.
        - id: ch02-b21
          speaker: narrator
          text: Beetle had a jar of pilchards in front of him and a book behind it.
        - id: ch02-b22
          speaker: mcturk
          text: You ass. Anyone could have told you where Manders would run.
        - id: ch02-b23
          speaker: beetle
          text: I didn't think.
        - id: ch02-b24
          speaker: narrator
          text: Beetle meekly scooped up pilchards with a spoon. McTurk yanked his collar into place.
        - id: ch02-b25
          speaker: mcturk
          text: Of course you didn't. You never do. And don't drip oil all over my Fors, or I'll strangle you.
        - id: ch02-b26
          speaker: beetle
          text: Shut up, you Irish old woman. It isn't your Fors. It's one of mine.
        - id: ch02-b27
          speaker: narrator
          text: The book was a thick brown volume from the late eighteen-sixties. King had once thrown it at Beetle's head so that the boy could discover where the nickname Gigadibs came from. Beetle had calmly kept it, and inside it he had found several things. He understood only part of the poetry, but the verses lived with him and fed on him, as the oily pages showed. Soon he drifted far from the study among Browning's marvelous men and women. McTurk brought him back by hammering the pilchard spoon on his head. Beetle snarled.
        - id: ch02-b28
          speaker: mcturk
          text: Beetle! King has oppressed you, insulted you, and bullied you. Don't you feel anything about it?
        - id: ch02-b29
          speaker: beetle
          text: Leave me alone. If he has, I suppose I can write more poetry about him.
        - id: ch02-b30
          speaker: stalky
          text: Mad. Completely mad. You visitors may observe that Beetle reads an ass named Browning, while McTurk reads another ass named Ruskin.
        - id: ch02-b31
          speaker: mcturk
          text: Ruskin is not an ass. He's almost as good as the Opium Eater. He says we're children of noble races trained by the art around us. That means me, and it means the way I decorated this study when you two savages wanted brackets and Christmas cards. Child of a noble race, close that book or I'll push a pilchard down your neck.
        - id: ch02-b32
          speaker: stalky
          text: It's two against one.
        - id: ch02-b33
          speaker: narrator
          text: Beetle obeyed the law that had ruled the three companions through six stormy years and shut the book. Their visitors watched with delight. Number Five study was famous for containing more kinds of madness than the rest of the school together. As far as their private code allowed friendship with outsiders, the three were generous and civil to the neighbors across the landing.
        - id: ch02-b34
          speaker: beetle
          text: Very well. What nonsense do you want now?
        - id: ch02-b35
          speaker: mcturk
          text: King. War.
        - id: ch02-b36
          speaker: narrator
          text: McTurk nodded toward a little wooden West African war-drum on the wall, a present from an uncle in the Navy.
        - id: ch02-b37
          speaker: beetle
          text: Then King will turn us out of the study again. Mason threw us out merely for playing that thing.
        - id: ch02-b38
          speaker: abanazar
          text: Merely playing it? We couldn't hear ourselves speak across the landing. And what did being turned out gain you?
        - id: ch02-b39
          speaker: beetle
          text: We had to live in the form-rooms for a week, and they were freezing.
        - id: ch02-b40
          speaker: mcturk
          text: Yes, but rats filled Mason's rooms every day we were gone. It took him a whole week to understand the connection. He hates rats. The moment he allowed us back, they vanished. Mason is a little nervous of us now, and there was no evidence.
        - id: ch02-b41
          speaker: stalky
          text: Of course there wasn't. I climbed onto the roof and dropped the creatures down his chimney. But the real question is whether our reputations can survive another study row just now.
        - id: ch02-b42
          speaker: beetle
          text: Don't trouble about mine. King says I haven't got one.
        - id: ch02-b43
          speaker: stalky
          text: I'm not thinking about you, you old bat. You aren't trying for the Army. I don't want to be expelled, and even the Head is becoming rather wary of us.
        - id: ch02-b44
          speaker: mcturk
          text: Rubbish. The Head only expels boys for filthy behavior or stealing. But I'd forgotten that you and Beetle are thieves. Regular burglars.
        - id: ch02-b45
          speaker: narrator
          text: The visitors gasped. Stalky explained with a broad grin.
        - id: ch02-b46
          speaker: stalky
          text: Manders saw Beetle and me breaking open McTurk's trunk in the dormitory last month when we took his watch. Naturally he sneaked to Mason. Mason decided it was theft and solemnly took up the case, partly to pay us back for the rats.
        - id: ch02-b47
          speaker: mcturk
          text: That put Mason exactly where we wanted him. We treated him kindly because he was a new master who wanted the boys to trust him. Sadly, he likes drawing conclusions. Stalky went to his study, pretended to cry, and promised to reform if Mason would forgive him. Mason refused. He said duty required him to report Stalky to the Head.
        - id: ch02-b48
          speaker: beetle
          text: The revengeful swine! He was still angry about those rats. Then I cried too. Stalky confessed that he'd been a professional thief for all six years he'd been at school, and said I'd taught him like Fagin. Mason went pale with joy. He thought he had us trapped.
        - id: ch02-b49
          speaker: dick_four
          text: Magnificent! We never heard any of this.
        - id: ch02-b50
          speaker: stalky
          text: Of course not. Mason kept it very quiet. He wrote down everything we said on punishment paper. There was nothing too wild for him to believe.
        - id: ch02-b51
          speaker: beetle
          text: Then he gave all forty pages to the Head, along with a prayer he made up on the spot. I helped him with a lot of the details.
        - id: ch02-b52
          speaker: abanazar
          text: And then what happened, you lunatics?
        - id: ch02-b53
          speaker: beetle
          text: We were summoned. Stalky asked for the depositions to be read aloud, and the Head knocked him straight into a wastepaper basket. Then he gave each of us eight enormous strokes for taking unheard-of liberties with a new master. When we left, I could see the Head's shoulders shaking. Now Mason can't look at us during second lesson without blushing. Sometimes we all stare until he almost melts. He's terribly sensitive.
        - id: ch02-b54
          speaker: mcturk
          text: He had read Eric, or Little by Little, so we gave him St. Winifred's, or the World of School. At St. Winifred's, they spend every free moment stealing, unless they're praying or getting drunk in public houses. That was only a week ago. The Head called our work constructive devilry, and he is still a little suspicious of us. Stalky planned the whole thing.
        - id: ch02-b55
          speaker: stalky
          text: There's no point quarreling with a master unless you can make an ass of him. Mason didn't understand Number Five before. Now he does. So, my dearly beloved listeners, we have the strong and persevering Mr. King on our hands. He went far out of his way to start this fight.
        - id: ch02-b56
          speaker: narrator
          text: Stalky lay comfortably on the hearthrug, folded his legs under him, pulled the black silk mask over his face, and addressed the company like a judge.
        - id: ch02-b57
          speaker: stalky
          text: King has oppressed Beetle, McTurk, and me separately whenever he could catch one of us. But now he has insulted all of Number Five in the music-room, before these officers of the Ninety-third who look like hairdressers. Benjamin, we must make him cry, I surrender!
        - id: ch02-b58
          speaker: narrator
          text: Stalky's reading did not include Browning or Ruskin.
        - id: ch02-b59
          speaker: mcturk
          text: Besides, King is a Philistine and a basket-hanger. He wears a tartan necktie. Ruskin says any man who wears a tartan necktie will certainly be damned forever.
        - id: ch02-b60
          speaker: tertius
          text: Bravo, McTurk. I thought he was only a beast.
        - id: ch02-b61
          speaker: mcturk
          text: He is that too, but he's worse. In his window he hangs a china basket with blue ribbons and a pink kitten painted on it, just to grow musk. Remember the old oak carving I rescued from Bideford Church while they were restoring it? Ruskin says anyone who restores a church is an absolute sweep. I glued the carving up here, and King asked whether we'd made it with a fret saw. He is the King of basket-hangers!
        - id: ch02-b62
          speaker: narrator
          text: McTurk turned his ink-stained thumb down over an imaginary arena filled with defeated Kings, then appealed to Beetle as another child of a noble race.
        - id: ch02-b63
          speaker: beetle
          text: Well, he did come from Balliol. But I'm giving the beast one chance. I can always make him jump with another poem. He can't report me to the Head, because the poem makes him ridiculous. Stalky's right about that. Still, he gets his chance.
        - id: ch02-b64
          speaker: narrator
          text: Beetle opened Browning on the table, ran a finger down the page, and chose a passage at random. He read of six generals crossing the white Kremlin pavement toward the Czar with the most innocent footsteps.
        - id: ch02-b65
          speaker: stalky
          text: That's no use. Find another one.
        - id: ch02-b66
          speaker: mcturk
          text: Wait. I know what comes next.
        - id: ch02-b67
          speaker: narrator
          text: Looking over Beetle's shoulder, McTurk followed the six generals as they all took snuff, unfolded their sashes like handkerchiefs, and used that soft cloth to hold where a steel chain might break, leaving no mark upon the Czar's white neck.
        - id: ch02-b68
          speaker: beetle
          text: Goodness, what a sentence! And there, finally, is the full stop.
        - id: ch02-b69
          speaker: stalky
          text: I didn't understand one word of it.
        - id: ch02-b70
          speaker: mcturk
          text: More fool you. Let me translate. Those six fellows strangled the Czar and left no evidence. That's the end of King.
        - id: ch02-b71
          speaker: beetle
          text: King gave me this very book, too. Listen. There's a great text in Galatians. Once you trip on it, it brings twenty-nine separate damnations, with one certain to catch you if another fails. And then there's Setebos! Setebos! and Setebos! He thinks he lives in the cold of the moon.
        - id: ch02-b72
          speaker: dick_four
          text: King has just come back from dinner. Manders Minor is with him.
        - id: ch02-b73
          speaker: beetle
          text: That's the safest place for Manders at present.
        - id: ch02-b74
          speaker: stalky
          text: Then the rest of you had better leave. It isn't fair to drag you into a study war, and we can't afford witnesses.
        - id: ch02-b75
          speaker: dick_four
          text: Are you starting now?
        - id: ch02-b76
          speaker: stalky
          text: At once, if not sooner. Strong, persevering King. We'll make him surrender. Off you go, Benjamin.
        - id: ch02-b77
          speaker: narrator
          text: Stalky put out the gas. The pantomime company withdrew to its own neat, roomy study, full of expectation.
        - id: ch02-b78
          speaker: dick_four
          text: When Stalky blows through his nose like a horse, he's on the warpath. I wonder what King will get.
        - id: ch02-b79
          speaker: tertius
          text: Beans. Number Five generally settles every account in full.
        - id: ch02-b80
          speaker: abanazar
          text: As a prefect, ought I to notice any of this officially?
        - id: ch02-b81
          speaker: dick_four
          text: It has nothing to do with you, Pussy. If you interfered, Number Five would turn on us, and then we'd never get any work done. Listen. They've started.
    - id: ch03
      title: The War-Drum
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That West African drum had been built to send signals over estuaries and river deltas. Number Five was forbidden to wake it anywhere near the school. Now McTurk and Beetle rubbed its top with scientific care, and a deep, ruinous hum filled every passage. The sound rose into the blare of savage trumpets in pursuit. McTurk struck the side, which was polished with the blood of old sacrifices, and the roar broke into short coughing cries like a wounded gorilla in its forest.
        - id: ch03-b02
          speaker: narrator
          text: Then came King. He took the stairs three at a time, his gown making a dry whir behind him. Across the landing, the pantomime company squeaked with excitement. Number Five's door crashed open. King stumbled into the dark room and cursed the musicians by all the gods of Balliol and quiet rest.
        - id: ch03-b03
          speaker: dick_four
          text: They're turned out for a week. King says the key must be in his study within five minutes. Brutes, barbarians, savages, children! He's rather upset. Arrah, Patsy, mind the baby!
        - id: ch03-b04
          speaker: narrator
          text: Dick Four held his door open a crack and whispered the report while dancing a silent war-dance around the knob. King went downstairs. Beetle and McTurk lit the gas and turned to consult Stalky, but Stalky had disappeared.
        - id: ch03-b05
          speaker: beetle
          text: This looks like a horrible mess. Spending a week in the form-rooms does us no good at all.
        - id: ch03-b06
          speaker: mcturk
          text: You owl, haven't you noticed that Stalky isn't here? Take the key down and look miserable. King will only lecture you for half an hour. I'm going to read in the lower form-room.
        - id: ch03-b07
          speaker: beetle
          text: Why is it always me?
        - id: ch03-b08
          speaker: mcturk
          text: Wait and see. I don't know what Stalky means to do any more than you do, but he means something. Go down there and draw King's fire. You're used to it.
        - id: ch03-b09
          speaker: narrator
          text: The key had barely turned in the door when the lid of the coal box rose carefully. The box also served as the window seat. Even for wiry Stalky, hiding inside had been a squeeze, with his head between his knees and his stomach somewhere beneath his right ear. He took a battered catapult and a handful of buckshot from a table drawer. Then he used a duplicate key, opened the window without a sound, and knelt facing the road.
        - id: ch03-b10
          speaker: narrator
          text: Beyond him stood trees bent by the wind, the dark flats of the Burrows, and the white breakers falling nine rows deep along the Pebbleridge. Far down the steep Devon lane came the carrier's rough horn. A ghost of melody trembled inside it, like wind in a gin bottle trying to sing, It's a way we have in the Army.
        - id: ch03-b11
          speaker: narrator
          text: Stalky smiled without opening his lips. At the very edge of his range, he fired. The old horse half turned in the shafts.
        - id: ch03-b12
          speaker: rabbits_eggs
          text: Where's he going to?
        - id: ch03-b13
          speaker: narrator
          text: Rabbits-Eggs hiccupped the question. Another piece of shot ripped through the rotten canvas cover with an angry zip.
        - id: ch03-b14
          speaker: stalky
          text: Got him.
        - id: ch03-b15
          speaker: narrator
          text: Stalky spoke under his breath. Down on the road, Rabbits-Eggs cursed into the quiet night and declared that he could see the cursed College boy attacking him.
    - id: ch04
      title: Stones Through the Window
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, King was speaking in a high, thin voice to Beetle. He had kept Manders Minor there to watch. King knew perfectly well how much it hurt a Fifth-form boy to be mocked before a younger fag.
        - id: ch04-b02
          speaker: king
          text: And so, Master Beetle, despite all the verses of which we are so proud, the moment we challenge even the humblest representative of authority, such as myself, we are turned out of our study. Is that not so?
        - id: ch04-b03
          speaker: beetle
          text: Yes, sir.
        - id: ch04-b04
          speaker: narrator
          text: Beetle wore a foolish little grin, though murder filled his heart. He had nearly lost hope. Still, experience had taught him that Stalky was most dangerous when no one could see him.
        - id: ch04-b05
          speaker: king
          text: You are not invited to offer an opinion, thank you. Out of our study we go, exactly as though we were no better than little Manders Minor. We are only ink-stained schoolboys, and schoolboys must be treated accordingly.
        - id: ch04-b06
          speaker: narrator
          text: Beetle suddenly listened. Rabbits-Eggs was swearing savagely in the road, and pieces of his language floated through the upper window. King believed strongly in fresh air. He crossed to the window in his gown, grand and commanding, and the gaslight made him perfectly visible.
        - id: ch04-b07
          speaker: rabbits_eggs
          text: I see him! I see him! Yes, you! You long-nosed, four-eyed, red-whiskered beggar! You're too old for games like this. Ow! Put a poultice on your nose, I tell you! Poultice that long nose!
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: Now Rabbits-Eggs had a visible enemy. Another shot had come from the darkness above. Beetle's heart leaped. Somewhere behind these wonders Stalky was at work, and revenge had become possible again. Beetle promised himself an immortal poem about King's nose. King threw the window fully open and rebuked the carrier with stern authority. But Rabbits-Eggs was far beyond fear or politeness. He climbed from his cart and bent beside the road.
        - id: ch04-b09
          speaker: narrator
          text: What followed moved as quickly as a dream. Manders cried out and put a hand to his head. A jagged flint flew through the window, struck him, and crashed against a row of handsomely bound books. A second stone skimmed across the writing table. Beetle made a devoted show of trying to stop it. During that effort he knocked over a student's lamp. Oil ran across King's papers and several valuable books before dripping onto the Persian rug.
        - id: ch04-b10
          speaker: narrator
          text: Broken glass covered the window seat. McTurk's hated china basket shattered, dropping its musk plant and a load of earth onto the red cushions. Blood poured from a cut on Manders's cheekbone. King used a number of remarkable words, every one of which Beetle stored away, then rushed out to find Sergeant Foxy and have Rabbits-Eggs thrown straight into jail.
        - id: ch04-b11
          speaker: beetle
          text: Poor fellow. Let it bleed for a while. That will keep you from having a fit.
        - id: ch04-b12
          speaker: narrator
          text: Beetle's sympathy was entirely false. He guided the blinded, howling Manders toward the door while carefully holding the boy's bleeding head over King's table and the papers spread upon it.
        - id: ch04-b13
          speaker: narrator
          text: Left alone with the wreckage, Beetle returned good for evil. He never explained how a complete set of Gibbon acquired long scars across its leather bindings, almost as though another flint had struck it. Nor did he explain how black ink and copying ink became mixed with Manders's blood on the tablecloth, why the large open gum bottle rolled in a half circle across the floor, or how more blood came to decorate the white china doorknob.
        - id: ch04-b14
          speaker: narrator
          text: King came raging back and found Beetle standing politely above the oily, smoking hearthrug.
        - id: ch04-b15
          speaker: beetle
          text: You never told me to leave, sir.
        - id: ch04-b16
          speaker: narrator
          text: Beetle offered this with the noble air of the boy who stood on the burning deck. King ordered him out into the darkness.
        - id: ch04-b17
          speaker: narrator
          text: Beetle hurried instead to a boot cupboard beneath the ground-floor stairs. He needed somewhere safe to release the laughter that was tearing him apart. Before he could draw breath for his first victorious shout, two hands closed around his throat and silenced him.
        - id: ch04-b18
          speaker: stalky
          text: Go to the dormitory and fetch my clothes. Bring them to the Number Five lavatory. I'm still wearing these tights. Don't run. Walk.
        - id: ch04-b19
          speaker: narrator
          text: Stalky hissed the instructions while sitting on Beetle's head. Beetle staggered into the next form-room and handed the errand to McTurk, who still knew nothing. Between gasps, Beetle gave him a wild summary of the campaign. Stone-faced McTurk fetched the clothes from the dormitory while Beetle lay panting on a bench.
        - id: ch04-b20
          speaker: narrator
          text: Then all three locked themselves inside Number Five lavatory. They opened every tap, filled the room with steam, and fell weeping into the baths. Piece by piece, they fitted the war together.
        - id: ch04-b21
          speaker: stalky
          text: Me! It was me! I waited in that coal box while you beat the drum so loudly I couldn't hear myself think. Then I peppered Rabbits-Eggs, and Rabbits-Eggs smashed up King. Wasn't it beautiful? Did you hear the glass break?
          emotion: happy
        - id: ch04-b22
          speaker: mcturk
          text: Why, he... he... he...
          emotion: surprised
        - id: ch04-b23
          speaker: narrator
          text: McTurk shrieked and pointed one shaking finger at Beetle.
        - id: ch04-b24
          speaker: beetle
          text: And I... I... I was there for all of it! I was in King's study while he lectured me!
          emotion: happy
        - id: ch04-b25
          speaker: stalky
          text: Oh, my soul!
          emotion: happy
        - id: ch04-b26
          speaker: narrator
          text: Stalky yelled and vanished under the bathwater.
        - id: ch04-b27
          speaker: beetle
          text: The broken glass was nothing! Manders has a hole in his head. The lamp went over and soaked the rug. Blood all over the books and papers. The gum! The gum! The gum! Then the ink! The ink! The ink! Oh, Lord!
          emotion: happy
        - id: ch04-b28
          speaker: narrator
          text: Stalky sprang out of the bath, pink from head to foot, and shook Beetle until the story became almost understandable. Then the tale flattened all three with laughter again.
        - id: ch04-b29
          speaker: stalky
          text: The moment I heard King go downstairs, I ran for the boot cupboard. Then Beetle fell in on top of me. The spare key is behind the loose board. There isn't one scrap of evidence against us.
        - id: ch04-b30
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: And King turned us out himself! Himself! Himself!
          emotion: happy
        - id: ch04-b31
          speaker: mcturk
          text: He can't possibly suspect us. Oh, Stalky, this is the most beautiful thing we've ever done.
          emotion: happy
        - id: ch04-b32
          speaker: beetle
          text: Gum! Great lumps of gum! Blood and ink all mixed together. I held that little beast's head over Monday's Latin exercises. How the lamp oil stank! And Rabbits-Eggs told King to poultice his nose. Did you really hit Rabbits-Eggs, Stalky?
          emotion: happy
        - id: ch04-b33
          speaker: stalky
          text: Of course I did. I peppered him everywhere. Did you hear the language he used? If I don't stop laughing, I'm going to be sick.
          emotion: happy
        - id: ch04-b34
          speaker: narrator
          text: Dressing took a long time. McTurk had to dance when he learned that the musk basket was broken. Beetle repeated all King's curses, improving them and adding rich new passages of his own.
        - id: ch04-b35
          speaker: stalky
          text: Shocking! Such wicked language for innocent boys like us to hear. What would they say at St. Winifred's, or the World of School? By gum, that reminds me. We owe the Lower Third something for sitting on Beetle when he chased Manders. Come along. It will give us an alibi, and if we let those little fellows off, they'll only be worse next time.
        - id: ch04-b36
          speaker: narrator
          text: Stalky collapsed again in a helpless heap with his trousers only half fastened.
    - id: ch05
      title: Everybody Paid in Full
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Lower Third had guarded its form-room for a full hour, which is a lifetime to a boy. By now the younger boys had returned to their ordinary Saturday evening occupations. Some cooked sparrows over the gas with rusty pen nibs. Some brewed dreadful drinks in little pots. Others skinned moles with pocketknives, tended paper trays of silkworms, or discussed the crimes of their elders with a freedom and sharpness that would have astonished their parents.
        - id: ch05-b02
          speaker: narrator
          text: Number Five struck without warning. Stalky overturned a bench packed with small boys and their cooking tools. McTurk attacked the disorderly lockers like a terrier digging after a rabbit. Beetle poured ink over every head he could not reach with a heavy classical dictionary. Three quick minutes destroyed silkworms, pet caterpillars, French exercises, school caps, partly prepared bones and skulls, and twelve pots of homemade sloe jam. The room looked as though three different storms had hit it at once.
        - id: ch05-b03
          speakers: [lower_third_1, lower_third_2, lower_third_3]
          ensemble: chorus
          text: Oh, you beastly cads! You think you're so funny!
          emotion: angry
        - id: ch05-b04
          speaker: stalky
          text: Whew! That's settled. Never let the sun go down while you're still angry. Strange little beasts, these fags. They have no idea how to work together.
        - id: ch05-b05
          speaker: narrator
          text: The three older boys drew breath outside the door while groans and insults followed them.
        - id: ch05-b06
          speaker: beetle
          text: Six of them sat on my head when I went after Manders. I warned them what would happen.
        - id: ch05-b07
          speaker: mcturk
          text: Everybody paid in full. That's a beautiful feeling. We probably shouldn't say much about King, should we, Stalky?
        - id: ch05-b08
          speaker: narrator
          text: They wandered calmly along the passage.
        - id: ch05-b09
          speaker: stalky
          text: Not much. We are injured innocents, naturally. Remember when Sergeant Foxy reported us because he suspected us of smoking in the bunkers? If I hadn't bought pepper and scattered it over our clothes, he'd have smelled the smoke. King made horrible jokes about that. He called us bird-stuffers in form for a week.
        - id: ch05-b10
          speaker: mcturk
          text: King hates the Natural History Society because little Hartopp is president. Nothing is allowed to happen in this school unless it glorifies King. But he must be a rotten ass if he thinks boys our age would go about stuffing birds like little fags.
        - id: ch05-b11
          speaker: beetle
          text: Poor old King. The other masters don't like him, and they'll tease him without mercy about Rabbits-Eggs. Goodness, how lovely! How beautiful! How holy! But you should have seen his face when the first stone came in. And then the earth from the basket!
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: All three became helpless again for five minutes. At last they recovered and went to Abanazar's study. The pantomime company received them with reverence.
        - id: ch05-b13
          speaker: stalky
          text: What's wrong?
        - id: ch05-b14
          speaker: narrator
          text: Stalky always noticed a new atmosphere at once.
        - id: ch05-b15
          speaker: abanazar
          text: You know what's wrong. If you're caught, you'll be expelled. King has gone completely mad.
        - id: ch05-b16
          speaker: stalky
          text: Who has? What for? Expelled for doing what? We only played the war-drum, and we've already been turned out for that.
        - id: ch05-b17
          speaker: abanazar
          text: Do you mean you didn't get Rabbits-Eggs drunk and pay him to throw stones into King's room?
        - id: ch05-b18
          speaker: stalky
          text: Pay him? No. I swear we did not do that.
        - id: ch05-b19
          speaker: narrator
          text: Stalky felt greatly relieved, because he disliked telling lies.
        - id: ch05-b20
          speaker: stalky
          text: What a filthy mind you have, Pussy. We've been downstairs taking a bath. Did Rabbits-Eggs really smash King's room? Strong and persevering King? How shocking!
        - id: ch05-b21
          speaker: abanazar
          text: Very shocking. King is practically foaming at the mouth. There's the bell for prayers. Come on.
        - id: ch05-b22
          speaker: stalky
          text: Wait a moment. What made Rabbits-Eggs attack King?
        - id: ch05-b23
          speaker: narrator
          text: As they went down the stairs, Stalky kept the conversation loud and cheerful.
        - id: ch05-b24
          speaker: beetle
          text: I know what happened. I was inside King's study.
        - id: ch05-b25
          speaker: tertius
          text: Be quiet, you ass!
        - id: ch05-b26
          speaker: beetle
          text: Oh, King has already gone down to prayers. Rabbits-Eggs was only a little drunk and swearing at his horse. King leaned out of the window and began lecturing him. So naturally Rabbits-Eggs threw stones at King.
        - id: ch05-b27
          speaker: narrator
          text: Beetle watched King's shadow on the wall as he spoke.
        - id: ch05-b28
          speaker: stalky
          text: Do you mean King started the whole thing?
        - id: ch05-b29
          speaker: narrator
          text: King was directly behind them. Every carefully chosen word flew up the stairwell like an arrow.
        - id: ch05-b30
          speaker: beetle
          text: I can only swear that King cursed like a dock worker. It was simply disgusting. I'm going to write to my father about it.
        - id: ch05-b31
          speaker: stalky
          text: You should report him to Mason. Mason understands how tender our consciences are. Wait, I need to tie my bootlace.
        - id: ch05-b32
          speaker: narrator
          text: The boys from the other study hurried ahead. They wanted no part in theatrical remarks made for King's benefit. McTurk stayed behind to sum up the affair while standing directly beneath the enemy's guns.
        - id: ch05-b33
          speaker: mcturk
          text: You see how it goes. First King bullies the little boys. Then he bullies the older boys. Then he bullies someone who doesn't even belong to the College, and that person hits back. It serves him perfectly right. Oh, I beg your pardon, sir. I didn't see you coming down the stairs.
        - id: ch05-b34
          speaker: narrator
          text: The black gown swept past like a thunderstorm. Behind it, three abreast and arm in arm, the whole Aladdin company rolled toward prayers with the most innocent intentions in the world.
        - id: ch05-b35
          speakers: [dick_four, tertius, abanazar, stalky]
          ensemble: chorus
          text: Arrah, Patsy, mind the baby! Arrah, Patsy, mind the child! Wrap him in an overcoat, he's surely going wild! Arrah, Patsy, mind the baby! Just you mind the child awhile! He'll kick and bite and cry all night! Arrah, Patsy, mind the child!
