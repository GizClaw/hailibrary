audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着含蓄的幽默
        timbre: 温暖清晰的中低音
        pace: 舒展而富于变化
        pitch: 中
    stalky:
      display_name: 斯托基
      tts:
        delivery: 自信狡黠，随时像在部署作战
        timbre: 清亮而有韧性的少年音
        pace: 明快
        pitch: 中高
    beetle:
      display_name: 甲虫
      tts:
        delivery: 机智好辩，笑意常藏在话里
        timbre: 稍厚的少年音
        pace: 中等偏快
        pitch: 中
    mcturk:
      display_name: 麦克特克
      tts:
        delivery: 冷峭直接，激动时带鲜明的爱尔兰腔调
        timbre: 瘦硬略带沙哑的少年音
        pace: 中等
        pitch: 中高
    king:
      display_name: 金先生
      tts:
        delivery: 尖刻自负，训斥时步步紧逼
        timbre: 干硬的男声
        pace: 偏快
        pitch: 中高
    dick_four:
      display_name: 狄克四
      tts:
        delivery: 爽快利落，像个忙碌而自信的舞台总管
        timbre: 明亮结实的青年男声
        pace: 明快
        pitch: 中
    emperor:
      display_name: 老三
      tts:
        delivery: 挺拔爽朗，带着刻意装出的男子气概
        timbre: 清朗的少年音
        pace: 中等
        pitch: 中
    kitten:
      display_name: 小猫
      tts:
        delivery: 慵懒温和，笑意慢悠悠的
        timbre: 柔和略低的青年男声
        pace: 偏慢
        pitch: 中低
    chaplain:
      display_name: 学校牧师
      tts:
        delivery: 温吞含蓄，说话不紧不慢
        timbre: 温和的中年男声
        pace: 偏慢
        pitch: 中低
    mason:
      display_name: 梅森先生
      tts:
        delivery: 认真急切，情绪容易显在声音里
        timbre: 略紧的男声
        pace: 中等偏快
        pitch: 中
    manders:
      display_name: 小曼德斯
      tts:
        delivery: 讨好怯弱，受惊时声音发尖
        timbre: 稚嫩的男孩声
        pace: 中等偏快
        pitch: 高
    rabbity:
      display_name: 兔蛋
      tts:
        delivery: 粗野含混，醉后大声叫骂
        timbre: 沙哑厚重的男声
        pace: 忽快忽慢
        pitch: 低
  chapters:
    - id: ch01
      title: 音乐室里的排练
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 五号楼顶层的音乐室挤满了《阿拉丁》剧组。狄克逊老四，大家都叫他狄克四，一个人包办阿拉丁、舞台监督、芭蕾指导和半支乐队。原来的本子早被重写，里面塞满了校内笑话，多半也是他的手笔。戏下星期就在楼下演。阿拉丁、阿巴纳扎和中国皇帝共用那间自修室，神灯精灵、巴德鲁巴杜尔公主和特万基寡妇则住在同层对面的五号自修室，召集全班人马十分方便。
        - id: ch01-b02
          speaker: narrator
          text: 芭蕾队踏步起舞，踩得地板直颤。狄克四穿着粉红棉紧身裤和蓝色金银丝短褂，戴一顶插羽毛的帽子，一会儿猛敲钢琴，一会儿猛弹班卓琴。他已经通过陆军预科考试，盼着明春进桑赫斯特军校。让这样一个高年级生来做整场游戏的主心骨，再合适不过。
        - id: ch01-b03
          speaker: narrator
          text: 排到阿拉丁如愿、阿巴纳扎中毒倒地、特万基寡妇跳完舞时，大家一致认为，正式演出的晚上自然会好起来。只是结尾还缺一首歌。
        - id: ch01-b04
          speaker: emperor
          text: 收尾唱什么？咱们得找支热闹的老调子。
        - id: ch01-b05
          speaker: kitten
          text: 《约翰·皮尔》怎么样？或者《喝吧，小狗，喝吧》？
        - id: ch01-b06
          speaker: narrator
          text: 小猫阿巴纳扎抚平松垮的淡紫睡裤。他永远像只醒了一半，那副柔和迟缓的笑，倒很适合演邪恶叔叔。
        - id: ch01-b07
          speaker: dick_four
          text: 都老掉牙了，还不如《祖父的大钟》。斯托基，你昨晚晚自习哼的那支是什么？
        - id: ch01-b08
          speaker: narrator
          text: 斯托基演的是神灯精灵。他穿一身黑色紧身衣和紧身短褂，黑绸半面具推在额头上。这会儿，他懒洋洋地躺在钢琴顶上，用口哨吹出一支十分上口的音乐厅小调。狄克四歪着头仔细听，眯起眼睛，从那只硕大的红鼻子上方往下看，想把调子摸出来。
        - id: ch01-b09
          speaker: dick_four
          text: 再吹一遍，我就能摸出调子。把歌词也唱出来。
        - id: ch01-b10
          speaker: stalky
          text: 哎呀，帕西，看好娃娃！哎呀，帕西，看好孩子！拿件大衣裹住他，他准要发疯啦！哎呀，帕西，看好娃娃！你且替我看一会儿！他整夜又踢又咬又哭闹！哎呀，帕西，看好孩子！
        - id: ch01-b11
          speaker: dick_four
          text: 妙极了！正式演出没有钢琴，得用班卓琴，一边弹一边跳。老三，你跟我试试。
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 皇帝拨开豌豆绿的长袖，拿起一把沉重的镀镍班卓琴，跟着狄克四弹起来。
        - id: ch01-b13
          speaker: kitten
          text: 可唱到这里，我已经死了，还直挺挺躺在舞台正中间呢。
        - id: ch01-b14
          speaker: dick_four
          text: 那就交给甲虫。甲虫，快编，别让大家等一整夜。先把小猫弄出灯光，再叫所有人跳着上场。
        - id: ch01-b15
          speaker: beetle
          text: 行，你们两个再弹一次。
        - id: ch01-b16
          speaker: narrator
          text: 甲虫扮特万基寡妇，灰裙子配栗色香肠卷假发，假发歪扣在那副用旧鞋带修过的眼镜上。他跟着敲打般的副歌甩起一条腿，两把班卓琴越弹越响。
        - id: ch01-b17
          speaker: beetle
          text: 嗯，啊，呃……阿拉丁如今娶到娇妻。
        - id: ch01-b18
          speakers: [beetle, dick_four]
          ensemble: duo
          text: 阿拉丁如今娶到娇妻。
        - id: ch01-b19
          speaker: emperor
          text: 你们的皇帝也消了气。
        - id: ch01-b20
          speaker: beetle
          text: 小猫，这时你跳起来，说你还是活过来为妙。接着咱们手拉手走到台前，祝各位看得称意。懂了吗？
        - id: ch01-b21
          speaker: dick_four
          text: 明白，够好了。再来末场芭蕾的副歌。四次踢腿，然后转一圈。
        - id: ch01-b22
          speaker: beetle
          text: 约翰·肖特要把大幕放，再把提词铃儿敲响。诸位临走想必已知道，我们祝大家万事吉祥。
        - id: ch01-b23
          speaker: dick_four
          text: 妙极了！现在排寡妇和公主那一场。快点，火鸡。
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: 麦克特克穿着紫绸裙，戴一顶俏皮的蓝头巾，没精打采地走上前，仿佛羞愧得无处可藏。斯托基从钢琴上爬下来，冷静地踢了他一脚。
        - id: ch01-b25
          speaker: stalky
          text: 好好演，火鸡。这可是正经事。
        - id: ch01-b26
          speaker: narrator
          text: 门上忽然响起一阵很有权威的敲击声。金先生穿着长袍，戴着方帽，趁星期六晚饭前来巡视了。
        - id: ch01-b27
          speaker: king
          text: 锁门！你们竟敢锁门！这里在干什么？还有这身……这身不男不女的打扮，到底是什么意思？
          emotion: angry
        - id: ch01-b28
          speaker: kitten
          text: 我们在演哑剧，先生。校长准许了。
        - id: ch01-b29
          speaker: narrator
          text: 在场的人当中，只有小猫是六年级生。狄克四仗着紧身衣十分合体，站在那里一动不动。甲虫却拼命往钢琴后面缩。他那条灰色公主裙是向一位走读生的母亲借来的，花布紧身上衣里还胡乱塞满了罚抄纸，整个人看上去实在可笑。更麻烦的是，他在别的事情上也心虚。
        - id: ch01-b30
          speaker: king
          text: 又是这一套！你们的前程眼看只剩一根线吊着，还有心思干这种蠢事。原来又是那伙惯犯，扰乱秩序的联军。科克兰，麦克特克，当然还有不可言说的甲虫，我们的吉加迪布斯朋友。
        - id: ch01-b31
          speaker: narrator
          text: 斯托基礼貌地微笑，麦克特克沉下脸。阿巴纳扎、皇帝和阿拉丁在金眼里多少还有点品格，便被放过了。
        - id: ch01-b32
          speaker: king
          text: 躲在乐器后面的墨水小丑，出来！这出玩意儿里的打油诗是你写的吧？你大概真把自己当诗人了？
        - id: ch01-b33
          speaker: beetle
          text: 他找到其中一首了。
        - id: ch01-b34
          speaker: king
          text: 我刚有幸读到一篇写给我的大作，姑且算它是大作吧，居然还想押韵。吉加迪布斯少爷，你瞧不起我，是不是？不必解释。我明白，表面上它不是写给我的。我可是笑着读完的。满身墨水的小男孩扔来的纸团，扰乱不了我的平静。说到底，我们还只是个男孩呀。
        - id: ch01-b35
          speaker: narrator
          text: 甲虫猜不出是哪一首。他发现韵文可以训人以后，早已向赏识他的公众发射过不少讽刺诗。金为了证明自己毫不生气，便慢条斯理地把甲虫撕成碎片，还始终叫他吉加迪布斯。他从松开的鞋带数落到修补过的眼镜。在大学校里当诗人本来就不容易，何况还要当着同伴受这种嘲弄。金那些挖苦话像野花一样一朵接一朵，直到说得尽兴，心情才真正好起来。他又活灵活现地描画甲虫的晚年，说他会成为恶毒的小册子作者，最后死在阁楼里。
        - id: ch01-b36
          speaker: narrator
          text: 金那条刻薄的舌头终于痛快了。他又顺手刺了麦克特克和斯托基几句，叫甲虫等候传唤受审，这才去了教员休息室。在那里，他又一次战胜了不在场的受害者，把自己的胜利讲给同事听。
        - id: ch01-b37
          speaker: king
          text: 最可惜的是，我把这么精妙的讽刺全浪费在几颗木头脑袋上了。他们根本不配听。
        - id: ch01-b38
          speaker: chaplain
          text: 这个嘛，科克兰懂不懂你的文体，我说不准。不过小麦克特克平时拿罗斯金消遣。
        - id: ch01-b39
          speaker: king
          text: 胡说！他只是拿来卖弄。我才不信那个阴沉的凯尔特人。
        - id: ch01-b40
          speaker: chaplain
          text: 他不是卖弄。前几晚我私下去了他们的自修室，亲眼看见他在给四本散期《给工人的信》粘书脊。
        - id: ch01-b41
          speaker: mason
          text: 他们私下怎么过，我不知道。但我吃过苦头，五号自修室那几个最好别惹。他们全是没心没肺的小魔鬼。
        - id: ch01-b42
          speaker: narrator
          text: 大家笑了，梅森涨红了脸。与此同时，音乐室里怒气冲天，骂声不停，只有斯托基还躺在钢琴上，一动也不动。
        - id: ch01-b43
          speaker: stalky
          text: 准是小曼德斯那头猪给金看的。他总爱献媚。去宰了他。甲虫，究竟是哪一首？
        - id: ch01-b44
          speaker: beetle
          text: 不知道。一首写他在小男孩中间求人望，另一首写他下了地狱，还告诉魔鬼自己是贝利奥尔学院的人。两首可都押得好好的。老天，也许小曼德斯全给他看了！我非去替他纠正一下音步不可。
    - id: ch02
      title: 五号的作战会议
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 甲虫下了两层楼，在金书房隔壁的教室里惊起那个粉白面皮的小男孩。他追着小曼德斯穿过走廊，一直闯进低三年级专供胡闹的教室。等他衣衫凌乱地回来，麦克特克、斯托基和剧组众人已经占了他的自修室，摆开一顿仿佛永远吃不完的热宴。桌上有咖啡、可可、圆面包、新出炉还冒热气的面包、沙丁鱼、香肠、火腿牛舌酱、小鲱鱼、三种果酱，还有至少三磅德文郡奶油。
        - id: ch02-b02
          speaker: beetle
          text: 我的帽子啊！斯托基，这是谁掏的钱？
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: 离学期结束已经不到一个月，各间自修室都饿了好几个星期。甲虫一头扑向食物。
        - id: ch02-b04
          speaker: stalky
          text: 你掏的。
        - id: ch02-b05
          speaker: beetle
          text: 混蛋！你没把我的星期日礼服拿去当吧？
        - id: ch02-b06
          speaker: stalky
          text: 别急，只当了你的表。
        - id: ch02-b07
          speaker: beetle
          text: 表？我早就丢了。好几个星期前，咱们在沙丘上想打那只老公羊，手枪炸掉那回就丢了。
        - id: ch02-b08
          speaker: stalky
          text: 是从你口袋里掉出来的。你真他妈粗心。我和麦克特克替你收着，我还戴了一个星期，你都没发现。今天晚饭后，我去比迪福德当了十三先令七便士。当票在这儿。
        - id: ch02-b09
          speaker: kitten
          text: 这份从容可真了不起。
        - id: ch02-b10
          speaker: narrator
          text: 小猫躲在厚厚一层奶油和果酱后面。甲虫听说礼服还在，既不生气，也不吃惊。麦克特克却火了。
        - id: ch02-b11
          speaker: mcturk
          text: 斯托基，你居然把当票给他？你真把他的表当了？你这头彻头彻尾的畜生！上个月你和甲虫也卖了我的表，我连当票的影子都没见到。
          emotion: angry
        - id: ch02-b12
          speaker: stalky
          text: 那是因为你把箱子锁了，害咱们砸了半下午。火鸡，你要肯像个基督徒那样做人，说不定咱们也会替你去当。
        - id: ch02-b13
          speaker: kitten
          text: 我的姑妈啊，你们真是一伙共产主义者。不过这顿饭还是该谢谢甲虫。
        - id: ch02-b14
          speaker: stalky
          text: 这不公平。费心跑去当铺的是我，甲虫压根不知道自己还有块表。对了，今天下午是兔蛋捎我去的比迪福德。
        - id: ch02-b15
          speaker: narrator
          text: 兔蛋是当地运货的车夫，老得像从早期德文纪地层里冒出来的一块化石。这个难听的名字正是斯托基替他起的，叫开以后，大家也就这么称呼他。
        - id: ch02-b16
          speaker: stalky
          text: 他醉得很像样，不然绝不会载我。也不知为什么，他还有点怕我。不过我发誓跟他讲和了，又给了他一先令。路上他在两家酒馆停过，今晚准会醉得大吼。甲虫，别又看书，咱们要开军事会议。你的领子怎么回事？
        - id: ch02-b17
          speaker: beetle
          text: 我把小曼德斯追进低三年级杂物间，他那群讨厌的小朋友全压到我身上了。
        - id: ch02-b18
          speaker: mcturk
          text: 你这头驴！傻子都知道曼德斯会往哪儿逃。
        - id: ch02-b19
          speaker: beetle
          text: 我没想到。
        - id: ch02-b20
          speaker: mcturk
          text: 你当然没想，你从来不想。别把油滴到我的《给工人的信》上，不然我掐死你！
        - id: ch02-b21
          speaker: beetle
          text: 闭嘴吧，你这个爱尔兰老妈子！这不是你那讨厌的《给工人的信》，是我的书。
        - id: ch02-b22
          speaker: narrator
          text: 那是一本六十年代末出版的棕脊厚书。金以前拿它砸过甲虫的头，好让他知道“吉加迪布斯”这个名字出自哪里。甲虫后来悄悄把书据为己有，也从里面看见了许多东西。那些只懂了四分之一的诗句跟他一起生活，也跟他一起吃饭，沾满油点的书页就是证明。他渐渐离开眼前的整个世界，随着书里那些奇妙的男人和女人自在漂流。直到麦克特克拿小鲱鱼勺敲他的头，他才咆哮着回过神来。
        - id: ch02-b23
          speaker: mcturk
          text: 甲虫！金压迫你，侮辱你，还欺负你。你一点感觉都没有吗？
        - id: ch02-b24
          speaker: beetle
          text: 别烦我。就算有这回事，我再写几首诗骂他不就完了。
        - id: ch02-b25
          speaker: stalky
          text: 疯了，彻底疯了！甲虫读一个叫勃朗宁的蠢货，麦克特克读一个叫罗斯金的蠢货，还有……
        - id: ch02-b26
          speaker: mcturk
          text: 罗斯金不是蠢货。他差不多跟《鸦片食者》一样好。他说，我们出自高贵的种族，又受周围艺术的熏陶。这说的就是我，还有我布置自修室的办法。你们两个獾只会挂搁板和圣诞卡。高贵种族的孩子，别看了，不然我把小鲱鱼塞进你脖子！
        - id: ch02-b27
          speaker: stalky
          text: 二对一。
        - id: ch02-b28
          speaker: narrator
          text: 斯托基说二对一，甲虫便服从了。这条法律由三个人共同遵守了六年，期间事故不断，却从来有效。甲虫合上书，客人们看得兴高采烈。五号自修室向来以疯法比全校加起来还多而出名，不过只要他们那套规矩允许同外人交朋友，他们对同层邻居倒一直客气又热心。
        - id: ch02-b29
          speaker: beetle
          text: 你们这回又想怎么胡闹？
        - id: ch02-b30
          speaker: mcturk
          text: 对金开战！
        - id: ch02-b31
          speaker: narrator
          text: 麦克特克朝墙上的西非小战鼓一甩头。那是他一位海军叔父送的。
        - id: ch02-b32
          speaker: beetle
          text: 那咱们又要被赶出自修室。上回只拿这东西哼了几声，梅森就把咱们赶走了。
        - id: ch02-b33
          speaker: kitten
          text: 只哼了几声？上帝啊！你们敲它的时候，咱们在隔壁连说话都听不见。再说，被赶走有什么好处？
        - id: ch02-b34
          speaker: beetle
          text: 咱们在教室里住了整整一星期，冷得要命。
        - id: ch02-b35
          speaker: mcturk
          text: 是啊。可咱们不在的时候，梅森房里天天爬满老鼠。他花了一星期才想通两件事的关系。他恨老鼠。刚让咱们回来，老鼠就没了。现在他有点怕咱们，可惜没有证据。
        - id: ch02-b36
          speaker: stalky
          text: 当然没有。那些畜生是我爬上屋顶，从他的烟囱扔下去的。不过眼下的问题是，咱们的品行还经得起一次自修室风波吗？
        - id: ch02-b37
          speaker: beetle
          text: 我的品行不用算。金已经发誓说我根本没有品行。
        - id: ch02-b38
          speaker: stalky
          text: 我本来就没想你。你又不考陆军，你这只老蝙蝠。我可不想被开除，而且校长已经有点防着咱们了。
        - id: ch02-b39
          speaker: mcturk
          text: 胡扯。除非干了下流事或者偷东西，校长从不开除人。不过我忘了，你和甲虫就是正经的窃贼。
        - id: ch02-b40
          speaker: narrator
          text: 客人们听见“窃贼”，全都倒吸一口气。斯托基却咧嘴大笑，替他们解释这则寓言。事情发生在上个月。他们要拿麦克特克的表，可麦克特克锁了箱子。小曼德斯正好看见斯托基和甲虫在宿舍里砸箱子，当然立刻跑去向梅森告密。梅森还记恨那些老鼠，便郑重其事地把事情当成一桩盗窃案来办。
        - id: ch02-b41
          speaker: mcturk
          text: 这正好把梅森送进咱们手心。咱们对他客气得很，因为他是新教师，正想赢得男孩们信任。可惜他太爱作推论。斯托基跑去他书房哭，说只要这次放过他，他一定改过。梅森不肯，说报告校长是他的职责。
        - id: ch02-b42
          speaker: beetle
          text: 那头记仇的猪，全是为了老鼠。后来我也哭了。斯托基承认，进校六年来他一直偷东西，还是我照费金那一套教他的。梅森高兴得脸都白了，以为咱们成了他的盘中餐。
        - id: ch02-b43
          speaker: dick_four
          text: 壮丽，太壮丽了！咱们从没听说过。
          emotion: surprised
        - id: ch02-b44
          speaker: stalky
          text: 当然听不到。梅森把事情瞒得很严。他把咱们所有口供都写在罚抄纸上，什么都肯信。
        - id: ch02-b45
          speaker: beetle
          text: 再加一段即席祷告，一起交给校长，足足四十页。我还帮了他不少忙。
        - id: ch02-b46
          speaker: kitten
          text: 后来呢，你们这群疯子？
        - id: ch02-b47
          speaker: beetle
          text: 后来咱们被叫去。斯托基要求念出那份证词，校长一拳把他打进废纸篓。接着咱们每人结结实实挨了八鞭，罪名是对新教师放肆得闻所未闻。出去时，我看见校长的肩膀一直在抖。梅森现在上第二节课都不敢看咱们，一看就脸红。咱们有时一直盯着他，直到他浑身冒汗。他实在太敏感了。
        - id: ch02-b48
          speaker: mcturk
          text: 梅森读过《埃里克，或循序渐进》，所以咱们特意送了他一部《圣温弗雷德，或学校的世界》。那里面的学生只要没在祈祷，也没去酒馆喝醉，就把所有闲工夫拿来偷东西。事情才过去一星期，难怪校长还防着咱们。他说咱们干的是“建设性的恶作剧”。整件事全是斯托基编出来的。
        - id: ch02-b49
          speaker: stalky
          text: 跟教师闹一场，却不能把他变成傻瓜，那还有什么意思？梅森以前不懂五号，现在他已经学会了。我的亲爱听众们，眼前还剩下那个坚强不屈的金。他不辞辛苦，特意跑到这里来挑起冲突。从前，他总是逐个私下收拾咱们，逮到谁就欺负谁。可今天不一样。他在音乐室里侮辱了整个五号，还当着这些第九十三团军官的面，虽然他们看起来倒像一群理发师。便雅悯，咱们必须叫他喊“我认输”。
        - id: ch02-b50
          speaker: mcturk
          text: 而且他是个非利士人，是个挂篮子的俗物，还系格子领带。罗斯金说，系格子领带的人一定永堕地狱。
        - id: ch02-b51
          speaker: emperor
          text: 好极了。我原先还以为他只是一头畜生。
        - id: ch02-b52
          speaker: mcturk
          text: 他当然也是，可还比畜生更糟。窗上挂着一只扎蓝丝带的瓷篮子，上面画粉红小猫，里面种麝香草。还记得我从比迪福德教堂弄来的旧橡木雕刻吗？罗斯金说，翻修教堂的全是彻头彻尾的混蛋。金进来以后，居然问那是不是咱们用线锯锯的。呸，他真是挂篮子之王！高贵种族的孩子，你赞成吗？
        - id: ch02-b53
          speaker: beetle
          text: 这个嘛，他毕竟出身贝利奥尔。不过我愿意给那畜生一次机会。我随时都能再写诗叫他跳脚，他又不能向校长告状，不然只会显得自己可笑。可他还是该有一次机会。
        - id: ch02-b54
          speaker: narrator
          text: 甲虫翻开桌上的书，手指沿着一页往下移，随意念起一段诗。诗里有个人在莫斯科恭顺地走向沙皇，踏过克里姆林宫的白石地，身边还跟着五位将军。
        - id: ch02-b55
          speaker: stalky
          text: 这段不行，换一个。
        - id: ch02-b56
          speaker: mcturk
          text: 等等，我知道后面。六个人同时取鼻烟，好借机把柔软的腰带像手帕一样展开。那腰带连钢链崩断的地方都能缠紧，还不会伤到高贵的白颈。老天，这是什么句子！好了，句号。
        - id: ch02-b57
          speaker: stalky
          text: 我一个字也没听懂。
        - id: ch02-b58
          speaker: mcturk
          text: 因为你蠢！那六个驳船夫勒死了沙皇，一点证据都没留下。金完蛋了。
        - id: ch02-b59
          speaker: beetle
          text: 那本书也是金给我的。《加拉太书》有一节伟大经文，一旦绊上就招来诅咒二十九种。这一种落空，另一种总会命中。塞特博斯，塞特博斯，还是塞特博斯！他想，塞特博斯住在月亮的寒冷里。
        - id: ch02-b60
          speaker: dick_four
          text: 金刚吃完饭回来，小曼德斯跟在后面。
        - id: ch02-b61
          speaker: beetle
          text: 那正是眼下对小曼德斯最安全的地方。
        - id: ch02-b62
          speaker: stalky
          text: 那么各位最好走了。把你们卷进自修室风波不公平，再说咱们不能留下证人。
        - id: ch02-b63
          speaker: dick_four
          text: 你们马上就动手？
        - id: ch02-b64
          speaker: stalky
          text: 只会更早，不会更晚。坚强不屈的金，叫他喊“我认输”。走吧，便雅悯。
    - id: ch03
      title: 战鼓响起
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 剧组满怀期待地退回自己宽敞整洁的自修室。
        - id: ch03-b02
          speaker: dick_four
          text: 斯托基一像马那样喷鼻子，就是上了战道。不知道金会吃什么苦头。
        - id: ch03-b03
          speaker: emperor
          text: 该吃的苦头。五号向来一分不少地还回去。
        - id: ch03-b04
          speaker: kitten
          text: 我是不是该以级长身份管一管？
        - id: ch03-b05
          speaker: dick_four
          text: 不关你的事，小猫。你真管了，他们就会跟咱们作对，咱们也别想做功课。听，开始了。
        - id: ch03-b06
          speaker: narrator
          text: 那面西非战鼓原本用来隔着河口和三角洲传递消息，学校严禁五号在有人听得见的地方唤醒它。麦克特克和甲虫很讲究方法，先仔细摩擦鼓面。低沉而毁灭性的嗡鸣立刻灌满整条走廊。不久，那声音变成号角般的狂啸，像野蛮的追兵正在逼近。麦克特克接着拍击鼓侧，那一面早被古老祭品的鲜血磨得光滑。轰鸣随即碎成一阵阵咳嗽似的短嚎，仿佛一只受伤的大猩猩正在故乡森林里呼叫。
        - id: ch03-b07
          speaker: narrator
          text: 鼓声之后，金的怒火随即到了。他一步跨三级楼梯往上冲，身上的长袍发出干涩的呼呼声。隔壁的阿拉丁一伙贴门听着，兴奋得直尖叫。房门轰然打开，金一头跌进黑暗。他以贝利奥尔学院和所有安宁之神的名义，把藏在里面的演奏者狠狠诅咒了一遍。
        - id: ch03-b08
          speaker: dick_four
          text: 赶出自修室一星期，五分钟内把钥匙送到他书房。畜生，野人，蛮子，小孩！他可真激动。哎呀，帕西，看好娃娃。
        - id: ch03-b09
          speaker: narrator
          text: 狄克四攀着门把手，悄声唱歌，跳起无声的战舞。金下楼以后，甲虫和麦克特克点亮煤气灯，正要跟斯托基商量，却发现他不见了。
        - id: ch03-b10
          speaker: beetle
          text: 麻烦大得没边了。在教室住一星期，对咱们一点好处也没有。
        - id: ch03-b11
          speaker: mcturk
          text: 你没看见斯托基不在吗，你这猫头鹰！把钥匙送下去，装出伤心的样子。金最多骂你半小时。我去低年级教室看书。
        - id: ch03-b12
          speaker: beetle
          text: 可为什么又是我？
          emotion: sad
        - id: ch03-b13
          speaker: mcturk
          text: 等着看吧。我也不知道斯托基打什么主意，可一定有事。下去替他吸引火力，反正你已经习惯了。
        - id: ch03-b14
          speaker: narrator
          text: 钥匙刚在门里转动，那只兼作窗座的煤箱盖就小心翼翼地抬了起来。斯托基身子再灵活，蜷在里面也紧得要命。他的脑袋夹在两膝之间，肚子几乎挤到了右耳下面。他舒展开来，从桌子抽屉里取出一把用旧的弹弓、一把大铅弹，还有自修室的备用钥匙。接着，他悄无声息地推起窗户，跪到窗边。
        - id: ch03-b15
          speaker: narrator
          text: 窗外铺开的是公路、被风吹斜的树木和沙丘上黝黑平坦的荒地。更远处，白浪一重接一重，在卵石脊岸边碎开。德文郡两道陡岸夹着一条小路，车夫沙哑的号角声正从那里传来。那里面隐约还有一点旋律，听着就像风灌进杜松子酒瓶，勉强想唱出《这是我们陆军的作风》。
        - id: ch03-b16
          speaker: narrator
          text: 斯托基抿嘴一笑，在射程极限处射出铅弹。老马套在车辕间，原地转了半圈。
        - id: ch03-b17
          speaker: rabbity
          text: 他要上哪儿去？
        - id: ch03-b18
          speaker: narrator
          text: 兔蛋打着酒嗝。又一颗铅弹嗖地穿透腐朽的帆布篷。
        - id: ch03-b19
          speaker: stalky
          text: 命中！
        - id: ch03-b20
          speaker: narrator
          text: 兔蛋冲着忍耐的黑夜破口大骂，坚持说自己看见了袭击他的那个该死学生。
    - id: ch04
      title: 金先生的书房
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 金特意把甲虫留下，当着小曼德斯的面慢慢玩弄。他很清楚，一个五年级生被交给低年级跟班取笑，会有多难受。
        - id: ch04-b02
          speaker: king
          text: 所以，甲虫少爷，尽管我们会写那些引以为荣的诗，一旦胆敢正面冲撞权威，哪怕只是我这样卑微的权威代表，最后还是会被赶出自修室。对不对？
        - id: ch04-b03
          speaker: beetle
          text: 是，先生。
        - id: ch04-b04
          speaker: narrator
          text: 甲虫脸上羞怯地笑着，心里却杀气腾腾。他几乎不抱希望，只守着一个屡试不爽的信念，斯托基看不见的时候才最危险。
        - id: ch04-b05
          speaker: king
          text: 不劳你评论，谢谢。我们被赶了出来，仿佛并不比小曼德斯高明。满身墨水的学生，当然只配这样处置。
        - id: ch04-b06
          speaker: narrator
          text: 甲虫忽然竖起耳朵。兔蛋正在外面的路上恶狠狠地咒骂，其中一些话从上层窗扇飘进了书房。金一向相信通风。他披着长袍，威风凛凛地走到窗边。屋里的煤气灯正照着他，让他在黑夜前显得格外清楚。
        - id: ch04-b07
          speaker: rabbity
          text: 我看见你了！就是你！你这个长鼻子、四只眼、姜黄胡子的混蛋！这么大年纪还干这种事。去给你的鼻子敷药吧！
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: 又一发铅弹从上方黑暗中射来。甲虫心花怒放。他知道斯托基正在这些显灵背后的某处活动。希望来了，复仇也有了指望，连“给鼻子敷药”这句建议都可以写进不朽的诗。金推开窗，厉声训斥兔蛋，可醉车夫已经不怕谁，也不想讨好谁。他从车上下来，弯腰在路旁摸索能扔的东西。
        - id: ch04-b09
          speaker: narrator
          text: 接下来的一切快得像梦。小曼德斯突然叫了一声，抬手捂住脑袋。一块带尖角的燧石从窗外弹进书架，狠狠撞在几本装帧华丽的小牛皮书上。另一块紧贴着写字台飞过去。甲虫热心地假装上前拦截，不料在努力中撞翻了一盏学生灯。灯油立刻淌过金的文件和几本精选好书，再油腻腻地滴到波斯地毯上。
        - id: ch04-b10
          speaker: narrator
          text: 窗座上到处是碎玻璃。麦克特克痛恨的那只瓷篮子也摔成碎片，里面的麝香草和泥土全泼在红色凸纹软垫上。小曼德斯的颧骨被划破，血一直往外流。金把自己会的每一个怪词都骂了出来，甲虫则把它们一一珍藏在心。接着，金冲出去找学校军士，要把兔蛋立刻投入监狱。
        - id: ch04-b11
          speaker: beetle
          text: 可怜的人！先让血流一会儿，能防中风。
        - id: ch04-b12
          speaker: narrator
          text: 甲虫熟练地按住那颗看不见东西的脑袋，让它悬在写字台和文件上方，然后领着嚎哭的小曼德斯往门口去。
        - id: ch04-b13
          speaker: narrator
          text: 独自留在废墟里以后，甲虫开始以德报怨。完整一套《吉本》的书脊为何被燧石一路划伤，桌布上的黑墨水和复写墨水为何同曼德斯的血混在一起，没塞瓶口的大罐胶水又为何沿着半圆滚过地板，白瓷门把上怎么添了更多曼德斯年轻的鲜血，他一句也没解释。暴怒的金回来时，只看见甲虫彬彬有礼地站在湿透的壁炉毯边，仿佛这一片狼藉都与他无关。
        - id: ch04-b14
          speaker: beetle
          text: 您还没有叫我走，先生。
        - id: ch04-b15
          speaker: narrator
          text: 甲虫的神情像坚守火场的卡萨比安卡。金把他赶进外面的黑暗。他却立刻钻进底层楼梯下的靴柜，放出差点把自己憋死的笑。第一声胜利欢呼还没喘完，两只手便掐住他，让他再也笑不出声。
        - id: ch04-b16
          speaker: stalky
          text: 去宿舍拿我的衣服，送到五号洗澡间。我还穿着紧身衣。别跑，走过去。
    - id: ch05
      title: 人人分文不少地付清
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 甲虫没有照斯托基的话慢慢走，而是踉跄着进了隔壁教室。他把取衣服的差事交给还蒙在鼓里的麦克特克，又歇斯底里地概述了一遍战况。麦克特克板着一张木头脸去宿舍取衣服，甲虫则坐在长凳上不停喘气。随后三个人躲进五号洗澡间，打开所有龙头，让蒸汽灌满屋子。他们笑得直流泪，一个接一个跌进浴缸，这才把各自看见的事情拼成完整战局。
        - id: ch05-b02
          speaker: stalky
          text: 是我！本人！就是我！你们敲鼓时，我等到连自己的念头都听不见，钻进煤箱，再去招惹兔蛋。兔蛋就拿石头轰金。美不美？你们听见玻璃碎了吗？
        - id: ch05-b03
          speaker: mcturk
          text: 难道他……他……他……
        - id: ch05-b04
          speaker: beetle
          text: 我……我……我一直都在里面！就在金的书房里挨训！
        - id: ch05-b05
          speaker: stalky
          text: 噢，我的灵魂！
          emotion: surprised
        - id: ch05-b06
          speaker: narrator
          text: 斯托基大吼一声，整个人沉进水里。
        - id: ch05-b07
          speaker: beetle
          text: 玻璃根本不算什么。小曼德斯的脑袋开了花，灯油泼了满地毯，血流在书上和文件上。还有胶水！胶水！胶水！墨水！墨水！墨水！上帝啊！
        - id: ch05-b08
          speaker: narrator
          text: 斯托基光着一身粉红跳出浴缸，把甲虫摇到勉强说得连贯。可甲虫讲出的故事又让他们全军覆没。
        - id: ch05-b09
          speaker: stalky
          text: 我听见金下楼，就马上逃进靴柜。甲虫一头摔到我身上。备用钥匙藏在那块松木板后面。半点证据都没有。
        - id: ch05-b10
          speaker: narrator
          text: 证据已经收拾得干干净净，连他们自己都觉得这局漂亮得难以相信。三个人泡在水里，越想越得意，终于一齐唱了起来。
        - id: ch05-b11
          speaker: mcturk
          text: 而且是金亲手赶咱们出去的，是他自己！他根本不可能怀疑咱们。斯托基，这是咱们干过最美的事。
          emotion: happy
        - id: ch05-b12
          speaker: beetle
          text: 胶水，一大坨一大坨！墨水和血混在一起。我按住那小畜生的脑袋，把星期一要交的拉丁文作文全抹遍了。那灯油真臭！兔蛋还叫金给鼻子敷药。斯托基，你打中兔蛋了吗？
        - id: ch05-b13
          speaker: stalky
          text: 当然打中了，浑身都招呼到了。你们没听见他骂吗？噢，我得停一停，不然马上要吐了。
        - id: ch05-b14
          speaker: narrator
          text: 他们穿衣服花了很久。麦克特克一听见那只麝香篮子碎了，就非得跳一阵舞，根本没法继续穿。甲虫则把金骂过的每一句脏话重新说了一遍，还不满足，又替金逐句修订，再加上自己浓墨重彩的增补。
        - id: ch05-b15
          speaker: stalky
          text: 太不像话了！对咱们这样的无辜男孩，影响多坏啊！不知道《圣温弗雷德，或学校的世界》里的人会怎么说。老天，这倒提醒我了。低三年级在甲虫追小曼德斯时袭击过他，咱们还欠他们一笔。走！塞缪尔，这就是不在场证明。再说，这回饶了他们，下回只会更坏。
        - id: ch05-b16
          speaker: narrator
          text: 低三年级已经给教室放了整整一小时的岗，对男孩来说，这简直是一辈子。此刻他们正忙着过星期六晚上。有人把生锈笔尖架在煤气上烤麻雀，有人在药膏罐里酿邪门饮料，有人用小刀剥鼹鼠皮，还有人照料纸盘里满满的蚕。他们也痛陈高年级生的罪恶，说得自由、流利又尖刻，要是父母听见，一定大吃一惊。
        - id: ch05-b17
          speaker: narrator
          text: 打击毫无预警地落下。斯托基掀翻一张挤满小男孩和炊具的长凳。麦克特克像猎犬掘兔洞一样洗劫那些杂乱的柜子。甲虫用《史密斯古典辞典》招呼够得着的脑袋，够不着的就泼上墨水。短短三分钟，许多蚕、宠物幼虫、法文练习、校帽、制作到一半的骨骼和头骨，还有十二罐自制黑刺李果酱，全都报销了。那是一场真正的大破坏，教室仿佛同时挨了三股方向相反的风暴。
        - id: ch05-b18
          speaker: stalky
          text: 呼，这就好了。绝不能让太阳带着你的怒气落山。低年级小鬼真怪，完全不懂协同作战。
        - id: ch05-b19
          speaker: beetle
          text: 我追小曼德斯进去时，有六个坐在我头上。不过我警告过他们会有什么下场。
        - id: ch05-b20
          speaker: mcturk
          text: 人人都分文不少地付清，感觉真美。不过金的事，咱们最好别说太多，对吧？
        - id: ch05-b21
          speaker: stalky
          text: 别说太多。咱们当然要走受伤无辜者的路线。还记得军士怀疑咱们在沙坑里抽烟，跑去报告咱们那回吗？要不是我想到买胡椒撒遍衣服，他早就闻出烟味了。金为那事刻薄了整整一星期，每次上课都故意叫咱们鸟类标本师。
        - id: ch05-b22
          speaker: mcturk
          text: 金恨博物学会，因为小哈托普是会长。在这学校里，干什么都非得歌颂金不可。不过他真是头烂透的蠢驴，居然以为咱们这年纪还会像低年级小鬼那样填鸟标本。
        - id: ch05-b23
          speaker: beetle
          text: 可怜的老金！他在教员休息室本来就不受欢迎，这回大家准会拿兔蛋的事把他笑死。老天，这一切多么可爱，多么美丽，又多么神圣！你们真该亲眼看看。第一块石头飞进来时，他那张脸简直没法形容。接着瓷篮摔碎，泥土全泼了出来。那才叫壮观！
        - id: ch05-b24
          speaker: narrator
          text: 三个人想到第一块石头、瓷篮里的泥土和金当时的脸，又一次笑瘫了整整五分钟，谁也说不出一句完整的话。好不容易能站起来以后，他们才去了阿巴纳扎的自修室。其他演员已经听到风声，迎接他们的是满屋敬畏。
        - id: ch05-b25
          speaker: stalky
          text: 怎么了？
        - id: ch05-b26
          speaker: kitten
          text: 你明明知道。要是被抓住，你们会被开除。金已经成了胡言乱语的疯子。
        - id: ch05-b27
          speaker: stalky
          text: 谁？什么事？凭什么开除？咱们只是敲了战鼓，为这事已经被赶出来了。
        - id: ch05-b28
          speaker: kitten
          text: 难道不是你们把兔蛋灌醉，再收买他用石头砸金的房间？
        - id: ch05-b29
          speaker: stalky
          text: 收买？绝对没有，我可以发誓咱们没收买他。小猫，你的心思真卑鄙！咱们几个一直在楼下洗澡，怎么会知道上面发生了什么？兔蛋居然用石头砸了那个坚强不屈的金？这也太不像话了！
        - id: ch05-b30
          speaker: kitten
          text: 糟透了。金气得口吐白沫。祷告铃响了，走吧。
        - id: ch05-b31
          speaker: narrator
          text: 祷告铃催着一行人下楼。经过金敞开的房门时，斯托基故意用响亮而愉快的声音继续谈这件事，好让屋里每一个字都听得清楚。
        - id: ch05-b32
          speaker: stalky
          text: 等一下。兔蛋为什么要砸金？
        - id: ch05-b33
          speaker: beetle
          text: 我知道，我当时就在他的书房。
        - id: ch05-b34
          speaker: emperor
          text: 闭嘴，你这头驴！
        - id: ch05-b35
          speaker: beetle
          text: 噢，他已经下楼祷告了。兔蛋只是有点醉，正在骂自己的马。金隔着窗子训他，兔蛋当然就拿石头砸金了。
        - id: ch05-b36
          speaker: stalky
          text: 这么说，是金先挑起来的？
        - id: ch05-b37
          speaker: narrator
          text: 其实金就在他们身后，正沿着楼梯下来。三个人每说出一个仔细掂量过的字，那字就像一支箭，越过楼梯直射到他身上。
        - id: ch05-b38
          speaker: beetle
          text: 我只能发誓，金骂起人来像个驳船夫，恶心得很。我打算写信告诉父亲。
        - id: ch05-b39
          speaker: stalky
          text: 最好报告梅森。他很了解咱们柔嫩的良心。等一下，我得系鞋带。
        - id: ch05-b40
          speaker: narrator
          text: 另一个自修室的人赶紧走到前面。他们可不愿被卷进这种舞台旁白。于是，只剩麦克特克倚着栏杆，在敌军炮口下总结局势。
        - id: ch05-b41
          speaker: mcturk
          text: 您瞧，他先欺负小孩子，再欺负大孩子，然后又欺负一个跟学校毫无关系的人，终于挨了报应。真他妈活该……对不起，先生，我没看见您正下楼。
        - id: ch05-b42
          speaker: narrator
          text: 金的黑袍像一场雷雨，从他们身边猛地卷了过去。《阿拉丁》的全体演员紧跟在他身后，排成三人一排，彼此挽着手，浩浩荡荡滚过大走廊去做祷告。他们脸上没有半点恶意，只怀着最纯洁无邪的用意，一路唱起那首刚刚排好的歌。
        - id: ch05-b43
          speakers: [dick_four, emperor, kitten, stalky]
          ensemble: chorus
          text: 哎呀，帕西，看好娃娃！哎呀，帕西，看好孩子！拿件大衣裹住他，他准要发疯啦！哎呀，帕西，看好娃娃，你且替我看一会儿！他整夜又踢又咬又哭闹！哎呀，帕西，看好孩子！
