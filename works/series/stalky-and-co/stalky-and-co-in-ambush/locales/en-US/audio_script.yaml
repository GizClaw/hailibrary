  chapters:
    - id: ch01
      title: The Hut in the Wuzzy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In summer, every sensible boy built himself a hut in the furze hill behind the College. The huts were cramped little holes cut into the prickly bushes, full of roots, stumps, and spikes. But they were forbidden, so to the boys they felt like palaces. For the fifth summer running, Stalky, McTurk, and Beetle had worked like beavers on a private retreat. They had not yet risen to the dignity of owning a study, and this was where they went to read, think, and smoke.
        - id: ch01-b02
          speaker: narrator
          text: Their house-master, Mr. Prout, saw nothing in the three boys that deserved much respect. Nor did Foxy, the clever red-haired school Sergeant, trust them. Foxy's business was to creep about in tennis shoes with binoculars and drop like a hawk on any boy doing wrong. Alone, Foxy would probably have found and raided the hut. He understood his quarry. But Mr. Prout, known among the boys as Hoofer because of his enormous feet, decided to investigate for himself.
        - id: ch01-b03
          speaker: narrator
          text: One peaceful afternoon, Stalky went to the hut hoping to forget Prout, settle down with a book by Surtees, and enjoy his new briar pipe. Instead, he found the prints of Hoofer's great shoes on the very floor. Robinson Crusoe could not have moved faster at the sight of a footprint. Stalky took away the pipes, swept up every loose match end, and went to warn his friends.
        - id: ch01-b04
          speaker: narrator
          text: But Stalky did not go straight to them. First he found little Mr. Hartopp, president of the Natural History Society, an institution Stalky normally despised. In his meekest manner, he asked to put forward himself, Beetle, and McTurk as members. He confessed a long-hidden love of first flowers, early butterflies, and newly arrived birds. If Mr. Hartopp approved, he said, the three of them were ready to begin their new scientific lives that very day.
        - id: ch01-b05
          speaker: narrator
          text: Hartopp was a master, so naturally he was suspicious. But he was also a true enthusiast. More than once, remarks from these boys, especially Beetle, had wounded his gentle soul. The sight of a repentant sinner delighted him. He graciously wrote all three names in his book.
        - id: ch01-b06
          speaker: narrator
          text: Only then did Stalky enter the house form-room. Beetle and McTurk were packing books inside their clothes for a quiet afternoon in the furze, or the wuzzy, as they called it.
        - id: ch01-b07
          speaker: stalky
          text: It's all up. I found Heffy's fairy footprints round our hut after dinner. Lucky they're so enormous.
        - id: ch01-b08
          speaker: beetle
          text: Confound it! You hid our pipes, didn't you?
        - id: ch01-b09
          speaker: stalky
          text: No, Beetle. Of course I left them in the middle of the floor. What a blind ass you are! Do you imagine you're the only person who can think? The pipes are safe, but the hut isn't. Hoofer will be watching it now.
        - id: ch01-b10
          speaker: mcturk
          text: Bother, and likewise blow. That's a lovely business. Now we'll be under suspicion for the rest of the term.
        - id: ch01-b11
          speaker: narrator
          text: McTurk thoughtfully pulled the books back out from his clothes. The boys carried their libraries wedged between belt and collar.
        - id: ch01-b12
          speaker: stalky
          text: Why should we be suspected? Heffy has found a hut, that's all. He and Foxy can watch it as long as they like. It has nothing to do with us. We only have to stay away from that part of the hill for a while.
        - id: ch01-b13
          speaker: beetle
          text: Then where are we supposed to go? You chose that place, too. And I wanted to read this afternoon.
        - id: ch01-b14
          speaker: narrator
          text: Stalky sat on a desk and drummed his heels against the bench.
        - id: ch01-b15
          speaker: stalky
          text: Beetle, you gloomy brute, sometimes I think I'll have to give you up entirely. Has your Uncle Stalky ever forgotten you? After I saw Heffy's man-tracks marching round our hut, I found little Hartopp waving a butterfly net. I soothed him. I told him Beetle would read papers to the Bug-hunters, and Turkey adored butterflies. So now we're all members.
        - id: ch01-b16
          speaker: beetle
          text: And what earthly good does that do us?
        - id: ch01-b17
          speaker: stalky
          text: Turkey, kick him.
        - id: ch01-b18
          speaker: narrator
          text: Members of the Natural History Society had much wider bounds in the interests of science. As long as they kept clear of houses, they could wander almost anywhere they pleased, with Mr. Hartopp responsible for their behavior. Beetle began to understand just as McTurk began kicking him.
        - id: ch01-b19
          speaker: beetle
          text: I'm an ass, Stalky! Peace, Turkey. I admit it. I'm an ass.
        - id: ch01-b20
          speaker: stalky
          text: Don't stop kicking him, Turkey. Isn't your Uncle Stalky a great man?
        - id: ch01-b21
          speaker: beetle
          text: A great man.
        - id: ch01-b22
          speaker: mcturk
          text: Bug-hunting is still a filthy business. How does anyone even begin?
        - id: ch01-b23
          speaker: stalky
          text: Like this. The younger boys know all about Natural History. Here's young Braybrooke's botany case.
        - id: ch01-b24
          speaker: narrator
          text: He reached into the younger boys' lockers, threw out a tangle of dead roots, and fitted the slide into place.
        - id: ch01-b25
          speaker: stalky
          text: That gives a fellow a wonderfully professional look. Here's Clay Minor's geological hammer for Beetle. Turkey, you'd better steal yourself a butterfly net.
        - id: ch01-b26
          speaker: mcturk
          text: I will do nothing of the kind. Beetle, give me the hammer.
        - id: ch01-b27
          speaker: beetle
          text: All right. I'm not proud. Stalky, throw down that net from the top of the lockers.
        - id: ch01-b28
          speaker: stalky
          text: It's collapsible, too. These little brutes live in luxury. The handle folds like a fishing rod. Upon my sainted Sam, we look like complete Bug-hunters! Now listen. We'll hunt butterflies along the cliffs, where hardly anyone goes, and we'll move fast. Beetle, leave your book here.
        - id: ch01-b29
          speaker: beetle
          text: Not likely. I'm not losing all my fun for a pack of filthy butterflies.
        - id: ch01-b30
          speaker: stalky
          text: Then you'll sweat horribly. You may as well carry my Jorrocks, too. It can't make you much hotter.
        - id: ch01-b31
          speaker: narrator
          text: They all sweated. Stalky set a quick trot westward below the furze hills and drove them over one steep combe after another. Rabbits fled and bright butterflies fluttered past without so much as a glance from the new naturalists. McTurk's remarks about geology could not possibly be repeated.
        - id: ch01-b32
          speaker: mcturk
          text: Are you taking us all the way to Clovelly?
        - id: ch01-b33
          speaker: narrator
          text: At last they dropped onto the short, springy turf. Below them the sea droned. Inland, a light summer wind moved through the trees. The combe ahead was half full of old, tall furze glowing with flowers. Brambles and a thick wood of mixed trees and hollies stood above it. Golden bloom seemed to fill half the valley right to the cliff edge. The open grassy slope nearest them bristled with warning boards.
        - id: ch01-b34
          speaker: stalky
          text: A ferocious old fellow owns this place. Listen to this. Prosecuted with the utmost rigour of the law. G. M. Dabney, Colonel and Justice of the Peace, with all the rest of his titles. No sane chap would trespass here, would he?
        - id: ch01-b35
          speaker: mcturk
          text: He'd have to prove we'd done damage before he could prosecute us. You can't prosecute a man merely for trespass. Those boards are nonsense.
        - id: ch01-b36
          speaker: stalky
          text: Good, because this looks exactly right. Beetle, don't walk straight across, you blind lunatic! Anyone could see us from half a mile away. Come this way, and fold up that wretched net.
        - id: ch01-b37
          speaker: narrator
          text: Beetle took off the ring and stuffed the net into his pocket. He shortened the handle to a two-foot stick and slipped the cane ring around his waist. Stalky led them inland to the edge of the wood, about a quarter of a mile from the sea, and stopped at the brambles.
        - id: ch01-b38
          speaker: stalky
          text: Now we can go down through the furze without showing ourselves at all. Beetle, crawl ahead and explore. Sniff that! There's a beastly smell of fox nearby.
        - id: ch01-b39
          speaker: narrator
          text: Beetle went into the gorse on hands and knees, except when he needed one hand to save his spectacles. Between grunts of pain, he announced that he had found a fair fox track. That pleased Stalky, who rewarded him with a pinch from behind. They crawled down the tunnel. It was plainly a highway for the animals of the combe. To their enormous joy, it ended at the cliff edge in a few square feet of dry turf, completely walled and roofed by gorse.
        - id: ch01-b40
          speaker: stalky
          text: By gum, there's nothing to do here but lie down. Look at this!
        - id: ch01-b41
          speaker: narrator
          text: He pushed apart the tough stems, opening a window onto distant Lundy and the deep sea nosing lazily at the pebbles two hundred feet below. Young jackdaws squawked from the ledges. An unseen nest of hawks hissed and chattered. Stalky carefully spat onto the back of a young rabbit sunning itself on a ledge where only a cliff rabbit could stand. Gray and black gulls screamed at the jackdaws. Birds nested throughout the sweet-smelling bloom, singing until the shadow of a circling hawk passed over them. Across the combe, rabbits thumped and played on the bare grass.
        - id: ch01-b42
          speaker: stalky
          text: Whew! Talk about natural history. This is the real thing. Isn't it splendid? Good old sea!
        - id: ch01-b43
          speaker: narrator
          text: He spat once more in approval and fell silent. McTurk and Beetle took out their books and lay on their stomachs, chins in their hands. The sea snored and gurgled below. The birds, startled at first by these three new animals, returned to their work. The boys read in the rich, warm, sleepy quiet.
    - id: ch02
      title: The Fox and Colonel Dabney
      blocks:
        - id: ch02-b01
          speaker: stalky
          text: Hullo. There's a keeper.
        - id: ch02-b02
          speaker: narrator
          text: Stalky cautiously closed his book and looked through the gorse. A man carrying a gun appeared against the eastern sky.
        - id: ch02-b03
          speaker: stalky
          text: Confound him. He's going to sit down.
        - id: ch02-b04
          speaker: beetle
          text: He'd swear we were poaching, too. What use would pheasant eggs be to us? They're always rotten anyway.
        - id: ch02-b05
          speaker: stalky
          text: We'd better move up to the wood. We don't want Colonel Dabney troubled about us quite so soon. Up the tunnel, and keep quiet. The keeper may have followed us.
        - id: ch02-b06
          speaker: narrator
          text: Beetle was already well up the tunnel when they heard him give a gasp beyond description. A heavy body crashed through the furze.
        - id: ch02-b07
          speaker: keeper
          text: Ah! You little red rascal! I see you!
        - id: ch02-b08
          speaker: narrator
          text: The keeper raised his gun and fired both barrels toward them. Pellets showered the dry stems as a huge fox plunged between Stalky's legs and went over the cliff edge. The boys said nothing until they reached the wood. They were scratched, ragged, and hot, but no one had seen them.
        - id: ch02-b09
          speaker: stalky
          text: That was close. I swear some of those pellets went through my hair.
        - id: ch02-b10
          speaker: beetle
          text: Did you see that fox? I nearly put my hand on him. He was enormous, and what a stink! Hullo, Turkey. What's wrong? Did he hit you?
        - id: ch02-b11
          speaker: narrator
          text: McTurk's narrow face had gone white as pearl. His mouth, usually half open, was clamped shut, and his eyes blazed. The others had seen him like this only once before, during a miserable time of civil war.
        - id: ch02-b12
          speaker: mcturk
          text: Do you understand that what he did was nearly murder?
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: His voice grated as he pulled prickles from his head.
        - id: ch02-b14
          speaker: stalky
          text: But he didn't hit us. I thought it was rather a lark. Where are you going?
        - id: ch02-b15
          speaker: mcturk
          text: I'm going to the house, if there is one. I'm going to tell Colonel Dabney.
          emotion: angry
        - id: ch02-b16
          speaker: stalky
          text: Are you mad? He'll say it served us right, report us to the College, and get us publicly whipped. Turkey, don't be an ass. Think about us!
        - id: ch02-b17
          speaker: mcturk
          text: You fool! Do you think I'm thinking about us? I'm thinking about the keeper.
          emotion: angry
        - id: ch02-b18
          speaker: beetle
          text: He's cracked.
        - id: ch02-b19
          speaker: narrator
          text: They followed miserably. This was a new Turkey, proud and stiff, with his nose in the air. He marched through a shrubbery and onto a lawn. There, a white-whiskered old gentleman was taking turns at putting golf balls and swearing powerfully.
        - id: ch02-b20
          speaker: mcturk
          text: Are you Colonel Dabney?
        - id: ch02-b21
          speaker: colonel_dabney
          text: I am. Who are you, and what the devil do you want? You've been disturbing my pheasants. Don't deny it. You have, and you needn't laugh!
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: At the word pheasants, McTurk's plain features twisted into a terrible sneer.
        - id: ch02-b23
          speaker: colonel_dabney
          text: You've been stealing birds' nests. Don't hide your hat. I can see you belong to the College. Your name and number, at once! You wanted to speak to me, did you? You saw my warning boards. You must have seen them. Damnable! Oh, damnable!
          emotion: angry
        - id: ch02-b24
          speaker: narrator
          text: The Colonel choked with feeling. McTurk's heel tapped the lawn, and he began to stammer. Both were certain signs that his temper was escaping. But why should the trespasser be angry?
        - id: ch02-b25
          speaker: mcturk
          text: Lo-look here, sir. Do you shoot foxes? If you don't, then your keeper does. We saw him! Call us anything you like, but this is an awful business. It ruins every good feeling between neighbors. A man ought to say clearly where he stands about preserving foxes. It's worse than murder, because the law gives you no remedy.
          emotion: angry
        - id: ch02-b26
          speaker: narrator
          text: McTurk was mixing together things he had heard from his father. The old gentleman made noises deep in his throat.
        - id: ch02-b27
          speaker: colonel_dabney
          text: Do you know who I am?
        - id: ch02-b28
          speaker: mcturk
          text: No, sorr, and I wouldn't care if you belonged to the Castle itself. Answer me as one gentleman to another. Do ye shoot foxes, or do ye not?
          emotion: angry
        - id: ch02-b29
          speaker: narrator
          text: Four years earlier, Stalky and Beetle had carefully kicked that Irish accent out of McTurk. Now they were sure he had gone mad or caught sunstroke. They expected the Colonel to destroy him, and the Head to do it all over again. A public whipping for all three seemed the smallest possible result. Yet the Colonel suddenly seemed to shrink.
        - id: ch02-b30
          speaker: colonel_dabney
          text: I do not.
        - id: ch02-b31
          speaker: mcturk
          text: Then dismiss your keeper. He isn't fit to live in the same county as a God-fearing fox. And it was a vixen, too, at this time of year!
        - id: ch02-b32
          speaker: colonel_dabney
          text: Did you come all the way up here simply to tell me that?
        - id: ch02-b33
          speaker: mcturk
          text: Of course I did, ye silly man! Wouldn't you have done the same for me if you'd seen it happen on my land?
          emotion: angry
        - id: ch02-b34
          speaker: narrator
          text: The College and the respect owed to elders vanished from McTurk's mind. He was back among the bare purple mountains of the rainy west coast. During his holidays he ruled four thousand wild acres, the only son of a three-hundred-year-old house, master of an unreliable fishing boat, and idol of his father's careless tenants. One landowner was speaking to another, and the old gentleman recognized him.
        - id: ch02-b35
          speaker: colonel_dabney
          text: I apologize. I apologize without reservation, to you and to the Old Country. Now, please tell me exactly what happened.
        - id: ch02-b36
          speaker: mcturk
          text: We were down in your combe.
        - id: ch02-b37
          speaker: narrator
          text: McTurk told the whole story. At moments he sounded like a schoolboy. Whenever the wickedness overcame him, he became an angry country gentleman again.
        - id: ch02-b38
          speaker: mcturk
          text: So you can see this can't be his first time. None of us wants to accuse another man's servant. But in this case, I thought I had to take the liberty.
        - id: ch02-b39
          speaker: colonel_dabney
          text: I see. Quite right, and you had good reason. Infamous! Absolutely infamous!
          emotion: angry
        - id: ch02-b40
          speaker: narrator
          text: They began walking side by side across the lawn, and now Colonel Dabney spoke to McTurk as one man to another.
        - id: ch02-b41
          speaker: colonel_dabney
          text: This is what comes of promoting a fisherman out of his lobster pots. A fisherman! He could ruin an archangel's reputation. Your father has brought you up properly. I'd be very pleased to know him. And these young gentlemen are your friends? English, of course. They came up with you? Extraordinary! With education as it is today, I would never have expected three boys to be so sound. Out of the mouths of babes, perhaps? No, not babes. Don't deny it. You're not! Sherry catches me under the liver, but what about beer and something to eat? Boys are generally dreadful nuisances, but exceptions prove the rule. And it was a vixen!
        - id: ch02-b42
          speaker: narrator
          text: A gray-haired housekeeper fed them on the terrace. Stalky and Beetle did nothing but eat. McTurk, bright-eyed, went on talking freely and grandly, while the Colonel continued to treat him like a brother.
        - id: ch02-b43
          speaker: colonel_dabney
          text: My dear man, of course you may return. Didn't I say exceptions prove the rule? You want the lower combe? Go anywhere you please, provided you leave my pheasants alone. The two things are perfectly compatible. I won't allow another gun there. Come and go as you like. I needn't see you, and you needn't see me. You've been well brought up. Have another beer. That man began as a fisherman, and by tonight he'll be a fisherman again. I wish I could drown him. I'll walk you to the Lodge. My people aren't exactly trained to boys, but they'll recognize you after this.
        - id: ch02-b44
          speaker: narrator
          text: With many compliments, he sent them out through the tall Lodge gate in the split-oak fence. They stopped outside. Even Stalky, who had played no more than second fiddle, stared at McTurk as if he came from another world. Two glasses of strong home-brewed beer had made McTurk melancholy. He strolled slowly with his hands in his pockets and began an Irish song that the other two had utterly forbidden.
        - id: ch02-b45
          speaker: mcturk
          text: Oh, Paddy dear, and did ye hear the news that's going round?
        - id: ch02-b46
          speaker: narrator
          text: At any other time Stalky and Beetle would have jumped on him. That song was anathema, almost witchcraft. But after what he had accomplished, they merely danced around him in silence and waited for him to return to earth.
        - id: ch02-b47
          speaker: narrator
          text: The tea bell rang while they were still half a mile from College. McTurk shivered himself awake. The glory of his holiday lands fell away, and he was a College boy speaking English again.
        - id: ch02-b48
          speaker: stalky
          text: Turkey, that was immense! I never knew you had it in you. You've won us a hut for the rest of the term where no one can possibly catch us. Fids! Oh, Fids, I gloat! Hear me gloat!
          emotion: happy
        - id: ch02-b49
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Ti-ra-la-la-i-tu! I gloat! Hear me!
          emotion: happy
        - id: ch02-b50
          speaker: narrator
          text: They spun on their heels and yodeled the recognized gloat, something very close to a primitive victory song. They hurried down the hill by the gasometer path just in time to meet Mr. Prout. He had spent the whole afternoon watching their empty hut in the wuzzy.
    - id: ch03
      title: The Pleasant Isle of Aves
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Mr. Prout's imagination always leaned toward the dark side of life, and he looked sourly at the three bright-eyed angels. Boys he understood attended house matches and could be found whenever they were wanted. McTurk openly mocked cricket, even house matches. Beetle's opinions about the honor of the house were dangerous. Worst of all, Prout could never tell when soft, smiling Stalky was laughing at him. Human nature being what it is, the three must have been doing wrong somewhere. Prout only hoped it was nothing very serious.
        - id: ch03-b02
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Ti-ra-la-la-i-tu! I gloat! Hear me!
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: One after another they whirled past him toward the dining hall. McTurk's voice cracked on the cry. And was there, or was there not, a definite smell of beer as they passed Mr. Prout?
        - id: ch03-b04
          speaker: narrator
          text: His house-master's conscience drove him to seek advice. If he had taken his pipe and his troubles to little Hartopp, who trusted boys and understood them, he might have avoided much confusion. Instead, fate took him to Mr. King. King was another house-master, no friend of Prout's, but a devoted enemy of Stalky and his companions.
        - id: ch03-b05
          speaker: king
          text: Ah-ha! Very curious. Boys in my house never dream of such things.
        - id: ch03-b06
          speaker: prout
          text: The trouble is, I have no exact proof.
        - id: ch03-b07
          speaker: king
          text: Proof? With the outrageous Beetle involved? Surely one does not need it. Can't the Sergeant provide what you lack? Foxy is considered equal to any slippery boy in my house. Of course they were smoking and drinking somewhere. Boys of that sort always do. They imagine it makes them manly.
        - id: ch03-b08
          speaker: prout
          text: But they have no followers in the school. In fact, they're rather brutal to their juniors.
        - id: ch03-b09
          speaker: narrator
          text: From a distance Prout had seen Beetle returning the butterfly net to a tearful younger boy, and returning it with interest.
        - id: ch03-b10
          speaker: king
          text: Exactly. They believe themselves above ordinary pleasures. Self-satisfied little animals! McTurk's Irish sneer alone would irritate me. And notice how carefully they avoid open offenses. It is deliberate insolence. I dislike interfering in another man's house, as you know, but those boys need a sharp lesson. It might cure their swollen opinion of themselves. If I were you, I would study their performances for a week. I flatter myself that I understand boys, and boys of that kind do not join the Bug-hunters for love of science. Tell the Sergeant to watch them. In my own walks, I may happen to watch them too.
        - id: ch03-b11
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Ti-ra-la-la-i-tu! I gloat! Hear me!
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: The cry came faintly along the corridor.
        - id: ch03-b13
          speaker: king
          text: Disgusting! Where do they learn those indecent noises? One sharp lesson is precisely what they need.
        - id: ch03-b14
          speaker: narrator
          text: The boys cared nothing about lessons for the next few days. They had Colonel Dabney's whole estate to explore. They moved through it with the stealth of Indians and the precision of burglars. They could enter through the Lodge gates on the upper road, where they took care to please the Lodge-keeper and his wife, then drop down the combe and return by the cliffs. Or they could begin at the combe and climb back to the road.
        - id: ch03-b15
          speaker: narrator
          text: They stayed away from the Colonel himself. He had already served his purpose, and they did not mean to wear out their welcome. They also avoided the skyline whenever cover was available. Their favorite refuge was the gorse shelter above the cliff. For its peace and safety, Beetle named it the Pleasant Isle of Aves. The pipes and tobacco were hidden on a handy ledge an arm's length down the cliff, and their position became legally perfect.
        - id: ch03-b16
          speaker: narrator
          text: Colonel Dabney had not invited them into his house. Therefore they did not need the school's special permission for a visit. He had simply opened his grounds to them. As lawful Bug-hunters, their wider bounds reached his notice boards below and his Lodge gates above. The boys were astonished by their own virtue.
        - id: ch03-b17
          speaker: stalky
          text: Even if none of that were true, suppose we were miles out of bounds. Nobody could reach us through this wuzzy unless he knew the tunnel. Isn't this better than hiding just behind the College and shaking every time we smoke? Isn't your Uncle Stalky a great man?
        - id: ch03-b18
          speaker: narrator
          text: Stalky lay flat on his back, looking into the blue sky. Beetle stretched along the cliff edge and spat thoughtfully.
        - id: ch03-b19
          speaker: beetle
          text: No. Turkey deserves the thanks. Turkey is the Great Man. Dear Turkey, you're making Heffles miserable.
        - id: ch03-b20
          speaker: mcturk
          text: Gloomy old ass.
        - id: ch03-b21
          speaker: narrator
          text: McTurk did not look up from his book.
        - id: ch03-b22
          speaker: stalky
          text: They certainly suspect us. Hoophats is naturally suspicious, and every time Foxy stalks a boy, he treats it like taking a sort of trophy.
        - id: ch03-b23
          speaker: beetle
          text: A scalp. Foxy is a cheerful Chingangook.
        - id: ch03-b24
          speaker: stalky
          text: Poor Foxy. He'll catch us one day. Last night in the Gym he told me, “I've got my eye on you, Mister Corkran. I'm warning you for your own good.” So I told him, “Take it off me, or you'll find yourself in trouble. I'm only warning you for your own good.” Foxy was furious.
        - id: ch03-b25
          speaker: beetle
          text: Foxy's only playing fair. Hefflelinga is the one with the wicked mind. I wouldn't be surprised if he thought we came back drunk.
        - id: ch03-b26
          speaker: stalky
          text: I've only been tipsy once, during the holidays, and it made me horribly sick. But upon my sacred Sam, having an animal like Hoof for a house-master is enough to drive anyone to drink.
        - id: ch03-b27
          speaker: mcturk
          text: If we went to matches, shouted, “Well hit, sir,” balanced on one leg, and grinned whenever Heffy said, “So ho, my sons. Is it thus?” If we answered “Yes, sir,” “No, sir,” “Oh, sir,” and “Please, sir,” like a pack of filthy little fags, then Heffy would think the world of us.
        - id: ch03-b28
          speaker: stalky
          text: It's too late to start doing that now.
        - id: ch03-b29
          speaker: beetle
          text: It doesn't matter. Hefflelinga means well, but he is an ass. We let him see that we think he's an ass, so naturally he doesn't love us. Last night after prayers he told me he stood in loco parentis.
        - id: ch03-b30
          speaker: stalky
          text: The deuce he did! That means he's preparing something especially mean. The last time he said that to me, I got three hundred lines for dancing the cachuca in Number Ten dormitory. In loco parentis, by gum! Still, what does it matter as long as you're happy? We're perfectly safe.
        - id: ch03-b31
          speaker: narrator
          text: They were safe, and that was what puzzled Prout, King, and Foxy. Boys with guilty consciences usually show it. They hurry nervously past the Fives Court and smile uneasily when questioned. They return untidy with only a moment to spare before roll call. They wink and giggle together, then scatter when a master approaches. Stalky and his friends had grown beyond all those signs of youth. They walked out calmly and returned in excellent order after strawberries and cream at the Lodge.
        - id: ch03-b32
          speaker: narrator
          text: The Lodge-keeper had been promoted to keeper in place of the murderous fisherman, and his wife made a great fuss over the boys. Her husband gave them a squirrel, which they presented to the Natural History Society. That neatly answered Hartopp when he asked what they had done for Science. Meanwhile Foxy searched the deep Devon lanes behind a lonely crossroads inn. It was curious that Prout and King, who were rarely friendly in the masters' room, kept walking together in the same northeastern direction. The Pleasant Isle of Aves lay due southwest.
        - id: ch03-b33
          speaker: stalky
          text: They're deep. Devilishly deep. Why do you suppose they keep hunting those particular woods?
        - id: ch03-b34
          speaker: beetle
          text: Because of me. I asked Foxy whether he'd ever tasted the beer at that inn. That was enough. He and Heffy had sniffed around our old hut for so long that I thought they'd enjoy a change.
        - id: ch03-b35
          speaker: stalky
          text: It can't go on forever. Heffy is swelling up like a thundercloud. King rubs his horrible hands and grins like a hyena. All that plotting is ruining King's character. He'll burst one day.
        - id: ch03-b36
          speaker: narrator
          text: The day arrived sooner than they expected. One afternoon, the Sergeant failed to appear at roll call, though it was his duty to collect boys in trouble.
        - id: ch03-b37
          speaker: stalky
          text: He's tired of hunting inns. He's gone to the top of the hill with his binoculars to spot us. I'm surprised he didn't think of it earlier. Did you notice Heffy staring when we answered our names? He's part of it too. Ti-ra-la-la-i-tu! I gloat! Hear me! Come along.
        - id: ch03-b38
          speaker: beetle
          text: Aves?
        - id: ch03-b39
          speaker: stalky
          text: Naturally, but I'm not smoking today, because I rather think we're going to be followed. We'll take the cliff path slowly and give Foxy time to move along above us.
        - id: ch03-b40
          speaker: narrator
          text: They strolled toward the swimming baths and soon caught up with King.
        - id: ch03-b41
          speaker: king
          text: Oh, don't allow me to interrupt. You're occupied with scientific research, no doubt. I trust you will enjoy yourselves, my young friends.
        - id: ch03-b42
          speaker: stalky
          text: You see? He can't keep a secret. He's following us to block our retreat. He'll wait at the baths until Heffy arrives. They've searched every place except the cliffs, and now they think they have us trapped. There's no need to hurry.
        - id: ch03-b43
          speaker: narrator
          text: They walked at ease across the combes until they reached Colonel Dabney's line of warning boards.
        - id: ch03-b44
          speaker: stalky
          text: Listen for a moment. Foxy is upwind and racing downhill. When you hear him inside the bushes, cross the open grass straight to Aves. They want to catch us in the act.
        - id: ch03-b45
          speaker: narrator
          text: At the right moment they crossed the grass in full view, dived into the gorse at right angles to the hidden tunnel, and settled inside Aves.
        - id: ch03-b46
          speaker: stalky
          text: What did I tell you?
        - id: ch03-b47
          speaker: narrator
          text: Stalky carefully put away the pipes and tobacco. The breathless Sergeant leaned on the fence and swept the furze with his binoculars. He might as well have tried to see through a sandbag. Before long Prout and King joined him, and the three held a conference.
        - id: ch03-b48
          speaker: stalky
          text: Aha! Foxy dislikes the warning boards, and he dislikes the thorns. We'll slip up the tunnel and go to the Lodge. Hullo! They've ordered Foxy into the bushes.
        - id: ch03-b49
          speaker: narrator
          text: The Sergeant pushed waist-deep through cracking, tossing furze. His own noise filled his ears. The boys reached the wood and watched through a belt of hollies.
        - id: ch03-b50
          speaker: stalky
          text: What a terrible noise! I don't think Colonel Dabney will enjoy it. I propose we visit the Lodge and get something to eat. We may as well watch the whole entertainment.
    - id: ch04
      title: The Poachers in the Combe
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Suddenly the new keeper trotted past them.
        - id: ch04-b02
          speaker: keeper
          text: Who be they down in combe-bottom, for Lord's sake? Master'll go crazy.
        - id: ch04-b03
          speaker: stalky
          text: Poachers, likely.
        - id: ch04-b04
          speaker: narrator
          text: Stalky answered in the broad Devon speech he used in battle.
        - id: ch04-b05
          speaker: keeper
          text: I'll poach them to rights!
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: The keeper dropped into the funnel-shaped combe. Soon it filled with voices, especially King's.
        - id: ch04-b07
          speaker: king
          text: Go on, Sergeant! Leave him alone, you there! The man is carrying out my orders.
          emotion: angry
        - id: ch04-b08
          speaker: keeper
          text: And who be you to give orders here, ginger whiskers? You come up to the master. Sergeant, climb out of that wuzzy! Yes, I know the boys you're after. They've got long ears and fuzzy bellies, and you carry them in your pockets after you've killed them. Come up to master, all of you. He'll teach you as much as you care to learn. You others stay on your own side of the fence.
          emotion: angry
        - id: ch04-b09
          speaker: king
          text: Explain yourself to the owner, Sergeant. You can explain everything.
        - id: ch04-b10
          speaker: narrator
          text: Evidently the Sergeant had surrendered to the stronger force. Behind the Lodge, Beetle lay full length on the grass and literally bit the earth in fits of joy. Stalky kicked him upright. Apart from one stray muscle twitching in a cheek, neither Stalky nor McTurk showed the least amusement.
        - id: ch04-b11
          speaker: narrator
          text: They knocked at the Lodge door, where they were always welcome.
        - id: ch04-b12
          speaker: lodge_wife
          text: Come right in and sit down, my little dears. They'll never touch my man. He'll poach them properly. Indeed he will! Have some fresh berries and cream. We Dartmoor folk never forget our friends. But those Bideford poachers have no hems to their clothes. Sugar, dears? My man has dug out a badger for you. It's boxed in the linhay.
        - id: ch04-b13
          speaker: stalky
          text: We'll take him when we've finished. You're busy with the washing today. We'll sit quietly and won't make extra work for you. Don't trouble about us. Yes, there is plenty of cream.
        - id: ch04-b14
          speaker: narrator
          text: The woman wiped her pink hands on her apron and left them in the parlor. Feet scraped on the gravel beyond the heavy diamond-shaped windowpanes. Then Colonel Dabney's voice rang out, clearer than a bugle.
        - id: ch04-b15
          speaker: colonel_dabney
          text: You can read, can't you? You have eyes in your head. Don't deny it. You have!
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: Beetle snatched a crocheted cloth from the polished horsehair sofa, stuffed it into his mouth, and rolled out of sight.
        - id: ch04-b17
          speaker: colonel_dabney
          text: You saw my warning boards. Your duty? Curse your impudence! Your duty was to stay off my land. Don't talk to me of duty. Why, you ill-made poacher, next you'll teach me my alphabet! Roaring like a bull through my bushes! Boys, is it? Keep your boys at home. I am not responsible for them, and I don't believe one word of your tale. You have a sneaking, secret, poaching look that could ruin an archangel's reputation. Don't deny it! A sergeant, are you? Then shame on you. The worst bargain Her Majesty ever made! A sergeant running around the countryside and poaching on his pension. Damnable! Oh, damnable! But I shall show mercy. I shall be humanity itself. Did you see those boards, or did you not? Don't deny it. You did. Silence, Sergeant!
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: Twenty-one years in the army had trained Foxy well. He fell silent.
        - id: ch04-b19
          speaker: colonel_dabney
          text: Now, march! My duty, indeed! A sergeant telling me my duty. Good Lord, here come more sergeants!
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: The tall Lodge gate slammed.
        - id: ch04-b21
          speaker: stalky
          text: It's King! It's King!
          emotion: happy
        - id: ch04-b22
          speaker: narrator
          text: Stalky gulped the words with his head buried in a horsehair cushion. McTurk was eating the rag carpet by the spotless fireplace. The sofa shook with Beetle's hidden laughter. Through the thick glass, the figures outside looked blue, twisted, and threatening.
        - id: ch04-b23
          speaker: king
          text: I protest against this outrage. The Sergeant was entirely within his duty. Allow me to give you my card.
          emotion: angry
        - id: ch04-b24
          speaker: stalky
          text: He's wearing flannels!
        - id: ch04-b25
          speaker: narrator
          text: Stalky buried his face once more.
        - id: ch04-b26
          speaker: king
          text: Most unfortunately, I do not have a card with me. My name is King. I am a house-master at the College, and I am fully prepared to answer for this man's conduct. We saw three boys.
        - id: ch04-b27
          speaker: colonel_dabney
          text: Did you see my warning boards?
        - id: ch04-b28
          speaker: king
          text: I admit that we did, but the circumstances were exceptional.
        - id: ch04-b29
          speaker: prout
          text: I stand in loco parentis. I am responsible for the boys in my charge.
        - id: ch04-b30
          speaker: narrator
          text: Prout's deep voice joined the argument, broken by his panting.
        - id: ch04-b31
          speaker: colonel_dabney
          text: You stand in what? You're responsible for them, are you? Then you set them a very bad example. A damned bad example, if I may say so. I don't own your boys. I have not seen them. If there were a boy grinning in every bush on my property, you would still have no right to come out of my combe this way and frighten every living thing. Don't deny it. You did! You should have come to the Lodge and spoken to me like Christians, instead of chasing your damned boys all through my covers. In loco parentis, indeed! I have not forgotten my Latin. Quis custodiet ipsos custodes? If masters trespass, how can anyone blame the boys?
          emotion: angry
        - id: ch04-b32
          speaker: prout
          text: If I might speak to you privately.
        - id: ch04-b33
          speaker: colonel_dabney
          text: I will have nothing private with you. You may be as private as you please on the far side of that gate. I wish you a very good afternoon.
          emotion: angry
        - id: ch04-b34
          speaker: narrator
          text: The gate slammed a second time. The boys waited until Colonel Dabney had gone back to the house. Then they fell into one another's arms and crowed because they could not breathe.
        - id: ch04-b35
          speaker: stalky
          text: Oh, my soul! My King! My Heffy! My Foxy! Nothing but zeal, Mr. Simple. Oh, I did boil the exciseman! We must leave, or we'll miss tea.
          emotion: happy
        - id: ch04-b36
          speaker: mcturk
          text: Ge-get the badger and make little Hartopp happy. Make everybody happy.
          emotion: happy
        - id: ch04-b37
          speaker: narrator
          text: McTurk sobbed with laughter as he felt for the door and kicked the helpless Beetle ahead of him. They found the badger in a foul-smelling box, left two half-crowns to pay for it, and staggered home. The badger grunted with a marvelous likeness to Colonel Dabney. Each time it did, they shrieked helplessly and dropped the box. They were still far from recovered when Foxy met them by the Fives Court and ordered them to their dormitory to wait until they were summoned.
        - id: ch04-b38
          speaker: beetle
          text: Then please take this box to Mr. Hartopp's rooms. At least we've done something for the Natural History Society.
        - id: ch04-b39
          speaker: foxy
          text: I'm afraid that won't save you, young gentlemen.
        - id: ch04-b40
          speaker: narrator
          text: Foxy's voice was terrible, for his mind had been badly shaken.
        - id: ch04-b41
          speaker: stalky
          text: All serene, Foxibus. We'll never abandon you. Hounds killing foxes inside cover is proof of vice, isn't it? No, you're right. I'm not quite well.
        - id: ch04-b42
          speaker: narrator
          text: Stalky had reached the hiccuping stage. Foxy wondered whether they had gone too far this time. They behaved as if very far gone, yet he could smell no liquor. It was not quite like them. Still, King and Prout had suffered the same dressing-down as Foxy, and that was some comfort.
    - id: ch05
      title: Moral Lepers
      blocks:
        - id: ch05-b01
          speaker: stalky
          text: Now we must control ourselves.
        - id: ch05-b02
          speaker: narrator
          text: Stalky rose from the bed where he had thrown himself.
        - id: ch05-b03
          speaker: stalky
          text: We are injured innocence, as usual. We have no idea why we've been sent up here. Do we?
        - id: ch05-b04
          speaker: mcturk
          text: No explanation. No tea. Public disgrace before the house. This is damned serious.
        - id: ch05-b05
          speaker: narrator
          text: His eyes still ran with tears of laughter.
        - id: ch05-b06
          speaker: beetle
          text: Wait until King loses his temper. He's a slandering old brute, and by now he'll be raving. Prout is too cautious to help us. Watch King. If he gives us an opening, appeal to the Head. That always makes the masters uncomfortable.
        - id: ch05-b07
          speaker: narrator
          text: They were called into Prout's study. King and Foxy stood there to support him, and Foxy held three canes under one arm. King smiled in triumph when he saw the undried tears on their faces. Then the questioning began.
        - id: ch05-b08
          speaker: narrator
          text: Yes, the boys said, they had walked along the cliffs. Yes, they had entered Colonel Dabney's grounds. Yes, they had seen the warning boards. At that, Beetle broke into a strangled little laugh. Why had they gone onto the Colonel's land?
        - id: ch05-b09
          speaker: beetle
          text: Well, sir, there was a badger.
        - id: ch05-b10
          speaker: narrator
          text: King hated the Natural History Society because he disliked Hartopp. He could hold himself back no longer. He told them not to add lying to their open insolence. But the badger was in Mr. Hartopp's rooms, the boys explained. The Sergeant had kindly carried it there. That proved the badger existed. The small defeat sent King's temper toward boiling point. His foot beat against the floor while Prout prepared his slow, heavy questions.
        - id: ch05-b11
          speaker: narrator
          text: The boys had found their pace now. The sparkle left their eyes. Their faces went empty, and their hands hung at their sides without a twitch. At the expense of one of their own countrymen, they were learning the habit of their race. Hide every emotion, then trap the outsider when the moment comes.
        - id: ch05-b12
          speaker: narrator
          text: So far, all went well. King pushed himself deeper into the trial. Prout sounded wounded, but King wanted revenge. Did they know the punishment for trespass? Stalky made a great show of uncertainty. He had, he said, heard something that might perhaps relate to the subject, but he thought...
        - id: ch05-b13
          speaker: narrator
          text: He stretched the unfinished sentence as far as it would go. Stalky did not want to play his winning card against such a weak opponent. King declared that he wanted no buts and cared nothing for evasions. The boys, however, might care to hear his opinion of them.
        - id: ch05-b14
          speaker: king
          text: Boys who creep, sneak, and lurk beyond bounds! Even the generous bounds of the Natural History Society, which you joined under false pretenses as a cover for misconduct, vice, villainy, and immorality!
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: Stalky thought that King would break cover in another minute. Then they could run him down before he escaped. King, swept along by his own words, called them filthy boys, moral lepers, evil speakers, liars, lazy bellies, and finally, young drunkards.
        - id: ch05-b16
          speaker: narrator
          text: He was only building toward his grand conclusion, and they knew it. But the accusation of drunkenness was the opening they needed. McTurk cut across him, and the others joined in.
        - id: ch05-b17
          speakers: [mcturk, stalky, beetle]
          ensemble: chorus
          text: I appeal to the Head, sir.
        - id: ch05-b18
          speaker: narrator
          text: It was their unquestioned right. Drunkenness meant a public whipping followed by expulsion. They had now been accused of it, so the case belonged to the Head and no one else.
        - id: ch05-b19
          speaker: king
          text: You have appealed to Caesar, and to Caesar you shall go. Even so, my young friends, you would be wiser to accept our decision.
        - id: ch05-b20
          speaker: narrator
          text: King sounded less certain now. The boys had heard his sentence about Caesar once or twice before in their careers.
        - id: ch05-b21
          speaker: mcturk
          text: Mr. Prout, may we mix with the rest of the school while we wait to see the Head?
        - id: ch05-b22
          speaker: narrator
          text: McTurk ignored King and spoke directly to his house-master. With that question, the affair rose to its grandest level. It also promised freedom from work. Moral leprosy required strict quarantine, and the Head never passed judgment until twenty-four cool hours had gone by.
        - id: ch05-b23
          speaker: king
          text: If you insist on maintaining this defiant attitude, there is no alternative.
        - id: ch05-b24
          speaker: narrator
          text: King looked lovingly at the canes beneath Foxy's arm. Ten minutes later the whole school knew. Stalky and Company had fallen at last, and drink had ruined them. They had returned blind drunk from some hut. Even now, the story said, they lay hopelessly intoxicated on the dormitory floor. A few brave boys crept upstairs to look and received boots around their heads from the criminals.
        - id: ch05-b25
          speaker: stalky
          text: We've caught him. King is stuck on the Caudine Toasting-fork. He'll have to prove every word of his charge now.
        - id: ch05-b26
          speaker: beetle
          text: Too much tickling makes him burst. Didn't I tell you he'd pop if we left him alone long enough?
        - id: ch05-b27
          speaker: mcturk
          text: And no preparation tonight, my fellow young drunkards. It's trigonometry night, too. Hullo, here comes our dear Foxy. Have you brought more tortures, Foxibus?
        - id: ch05-b28
          speaker: foxy
          text: I've brought you something to eat, young gentlemen.
        - id: ch05-b29
          speaker: narrator
          text: The Sergeant entered behind a crowded tray. His wars with the boys had never contained malice. Besides, he had begun to suspect that boys who let themselves be tracked so easily might have held something back. Foxy had served during the Mutiny, when early and correct information could save a man.
        - id: ch05-b30
          speaker: foxy
          text: I saw you hadn't eaten, and I asked Gumbly. He said you weren't exactly forbidden supplies, so I brought this up. This is your tin of potted ham, isn't it, Mr. Corkran?
        - id: ch05-b31
          speaker: stalky
          text: Foxibus, you're a brick. I didn't know you had so much... Beetle, what's the word?
        - id: ch05-b32
          speaker: beetle
          text: Bowels. Thank you, Sergeant. That potted ham belongs to young Carter, though.
        - id: ch05-b33
          speaker: foxy
          text: There was a C on the tin, so I thought it meant Corkran. This is a very serious affair, young gentlemen. I wondered whether you might have something to say for yourselves that you hadn't told Mr. King or Mr. Prout.
        - id: ch05-b34
          speaker: stalky
          text: We have heaps to say, Foxibus.
        - id: ch05-b35
          speaker: narrator
          text: Stalky answered through a full mouth.
        - id: ch05-b36
          speaker: foxy
          text: If that's so, perhaps I could mention it quietly to the Head when he questions me. I must take him the charges tonight, and they look bad as they stand.
        - id: ch05-b37
          speaker: beetle
          text: Atrociously bad. Twenty-seven cuts in the Gym before the whole school, followed by public expulsion. Wine is a mocker, and strong drink is raging.
        - id: ch05-b38
          speaker: foxy
          text: This is nothing to joke about. I have to take those charges to the Head. And perhaps you don't know that I followed you this afternoon, because I had my suspicions.
        - id: ch05-b39
          speaker: mcturk
          text: Did ye see the notice boards?
        - id: ch05-b40
          speaker: beetle
          text: Ye have eyes in your head. Don't attempt to deny it. Ye did!
        - id: ch05-b41
          speaker: stalky
          text: A sergeant running around poaching on his pension! Damnable! Oh, damnable!
        - id: ch05-b42
          speaker: foxy
          text: Good Lord!
          emotion: surprised
        - id: ch05-b43
          speaker: narrator
          text: The Sergeant sat down heavily on a bed.
        - id: ch05-b44
          speaker: foxy
          text: Where the devil were you? I should have known the whole thing was a trick.
        - id: ch05-b45
          speaker: stalky
          text: Oh, you clever maniac! You think we might not know you followed us? You thought you were stalking us, did you? We led you straight into the trap. Colonel Dabney, who is a very pleasant man, happens to be our own particular friend. We've visited for weeks, and he invited us. You and your duty! Curse your duty, sir! Your duty was to keep off his land.
        - id: ch05-b46
          speaker: beetle
          text: You'll never be able to hold your head up again. The younger boys will hoot at you.
        - id: ch05-b47
          speaker: stalky
          text: Think what this will do to your precious reputation.
        - id: ch05-b48
          speaker: narrator
          text: The Sergeant thought hard.
        - id: ch05-b49
          speaker: foxy
          text: Look here, young gentlemen. You surely aren't going to tell anyone, are you? Were Mr. Prout and Mr. King mixed up in it too?
        - id: ch05-b50
          speaker: stalky
          text: Foxibusculus, they were. They were singularly horrid, and Dabney treated them worse than he treated you. We heard every word. You escaped lightly. If I'd been Dabney, I would have locked you up. Perhaps I'll suggest that tomorrow.
        - id: ch05-b51
          speaker: foxy
          text: And the whole affair is going before the Head. Oh, good Lord!
        - id: ch05-b52
          speaker: beetle
          text: Every giddy word, my Chingangook. Why shouldn't it? We have done nothing wrong. We aren't poachers. We didn't rush about ruining the characters of innocent boys by saying they were drunk.
        - id: ch05-b53
          speaker: foxy
          text: I never said you were drunk. I only said you behaved very strangely when you came back with the badger. Mr. King may have understood my hint the wrong way.
        - id: ch05-b54
          speaker: mcturk
          text: Of course he did, and when he learns he's wrong, he'll put all the blame on you. We know King, even if you don't. I'm ashamed of you. You aren't fit to be a sergeant.
        - id: ch05-b55
          speaker: foxy
          text: Not against three thorough young devils like you, I'm not. I've been caught. I've been ambushed, horse, foot, and guns. There'll be no controlling the younger forms once they hear. Besides, the Head will send me to Colonel Dabney with a note, asking if he truly invited you.
        - id: ch05-b56
          speaker: stalky
          text: Then use the Lodge gate this time instead of chasing your damned boys. No, wait, that part was in the message for King. Well, Foxy?
        - id: ch05-b57
          speaker: narrator
          text: Stalky rested his chin on his hands and gazed happily at the victim.
        - id: ch05-b58
          speaker: mcturk
          text: Ti-ra-la-la-i-tu! I gloat! Hear me! Foxy brought us tea while we were moral lepers. Foxy has a heart. And Foxy served in the Army.
          emotion: happy
        - id: ch05-b59
          speaker: foxy
          text: I wish I'd had you young gentlemen in my company. I would have given you something to remember.
        - id: ch05-b60
          speaker: mcturk
          text: Silence at the court-martial. I speak for the prisoner. Besides, this story is far too good for all the other brutes in the College. They would never understand it. They play cricket and say, “Yes, sir,” “Oh, sir,” and “No, sir.”
        - id: ch05-b61
          speaker: stalky
          text: Never mind that. Go on with the trial.
        - id: ch05-b62
          speaker: mcturk
          text: Very well. Foxy is a good little chap when he doesn't think himself quite so clever.
        - id: ch05-b63
          speaker: stalky
          text: Never take your hounds out on a terribly windy day. I don't mind letting him go.
        - id: ch05-b64
          speaker: beetle
          text: Nor do I. Heffy is the only joy I want, Heffy and King.
        - id: ch05-b65
          speaker: foxy
          text: I had to do my duty.
        - id: ch05-b66
          speaker: mcturk
          text: Very well. The prisoner was led astray by bad companions while carrying out his duty, or words to that effect. You are dismissed with a reprimand, Foxy. We won't tell anyone about you. I swear it. The story would be bad for school discipline. Horribly bad.
        - id: ch05-b67
          speaker: foxy
          text: Knowing what I know about the young devils, I mean gentlemen, of this College, I'm very glad to hear it. But what am I supposed to tell the Head?
        - id: ch05-b68
          speaker: stalky
          text: Tell him anything you please, Foxy. We aren't the criminals.
        - id: ch05-b69
          speaker: narrator
          text: The Sergeant gathered up the tea things. Later that evening, when he carried the day's crime sheet to the Head, the Head was more than annoyed.
    - id: ch06
      title: An Abnormal Judgment
      blocks:
        - id: ch06-b01
          speaker: head
          text: Corkran, McTurk, and company. Bounds again, I see. Hullo! What is this? Suspicion of drinking? Whose charge is that?
        - id: ch06-b02
          speaker: foxy
          text: Mr. King's, sir. I caught them out of bounds, or at least that was how it looked. There's a good deal behind it, sir.
        - id: ch06-b03
          speaker: narrator
          text: The Sergeant was plainly troubled.
        - id: ch06-b04
          speaker: head
          text: Go on. Give me your version.
        - id: ch06-b05
          speaker: narrator
          text: The Head and the Sergeant had worked together for seven years. The Head knew that the value of Mr. King's statements depended greatly on the state of Mr. King's temper.
        - id: ch06-b06
          speaker: foxy
          text: I believed they were out of bounds along the cliffs, but it turned out they weren't. I saw them enter Colonel Dabney's woods. Then Mr. King and Mr. Prout came along. The truth is, sir, Colonel Dabney's people mistook the three of us for poachers. Words passed on both sides. The young gentlemen slipped home somehow, and they seemed highly amused. Colonel Dabney himself mistook Mr. King for a poacher, because the Colonel is strict. Later, in Mr. Prout's study, Mr. King seems to have made remarks about the boys' habits. That is why they appealed directly to you. I only said they were laughing, giggling, and acting above themselves. Since then, they have told me, in their amusing way, that Colonel Dabney had invited them into his woods.
        - id: ch06-b07
          speaker: head
          text: I see. Naturally, they did not tell their house-master that.
        - id: ch06-b08
          speaker: foxy
          text: They appealed as soon as Mr. King mentioned their habits, sir, and asked to wait in the dormitory for you. Since then, I have gathered that somehow they heard every word Colonel Dabney said when he mistook Mr. King and Mr. Prout for poachers. I should have known, when they led me onward, that they controlled the inner line of communication. If you ask me, sir, it was a complete trick, and they are upstairs gloating over it now.
        - id: ch06-b09
          speaker: narrator
          text: The Head saw the whole affair, down to the last tiny coin. His mouth moved slightly beneath his mustache.
        - id: ch06-b10
          speaker: head
          text: Send them to me at once, Sergeant. There is no need to delay this case.
        - id: ch06-b11
          speaker: narrator
          text: The three arrived under escort.
        - id: ch06-b12
          speaker: head
          text: Good evening. I need all your attention for a few minutes. You have known me for five years, and I have known you for twenty-five. I think we understand each other. Now I shall pay you a tremendous compliment. The brown cane, please, Sergeant. Thank you. You need not stay.
        - id: ch06-b13
          speaker: narrator
          text: Foxy handed it over and left.
        - id: ch06-b14
          speaker: head
          text: I am going to punish you without rhyme, Beetle, or reason. I know that Colonel Dabney invited you onto his land. I will not even send the Sergeant with a note to test your claim, because I am convinced that, on this occasion, you have told the exact truth. I also know you were not drinking. McTurk, remove that virtuous expression, or I shall fear you have misunderstood me. There is not one flaw in any of your characters. That is precisely why I am about to commit a howling injustice. Your reputations were injured, were they not? You were disgraced before your house? And you care very deeply for the honor of that house, don't you? Well, now I am going to lick you.
        - id: ch06-b15
          speaker: narrator
          text: At those words, each boy received six strokes.
        - id: ch06-b16
          speaker: head
          text: I think that covers the situation.
        - id: ch06-b17
          speaker: narrator
          text: The Head put away the cane and threw the written charge into the wastebasket.
        - id: ch06-b18
          speaker: head
          text: Here is something useful for later life. Whenever you meet a person who varies from the normal, deal with him in an abnormal way. That reminds me. There is a stack of paperbacks on that shelf. You may borrow them if you return them. Reading outdoors will not hurt them. They already smell rather strongly of tobacco. You will attend preparation as usual tonight. Good night.
        - id: ch06-b19
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Good night, sir, and thank you.
        - id: ch06-b20
          speaker: beetle
          text: I swear I'll pray for the Head tonight. Those final two strokes only flicked my collar. I saw a copy of Monte Cristo on the lower shelf. I claim it for our next visit to Aves.
        - id: ch06-b21
          speaker: mcturk
          text: Dear man! No confinement. No extra exercises. No beastly questions. Everything settled. Hullo! Why are King and Prout going in to see him?
        - id: ch06-b22
          speaker: narrator
          text: Whatever happened in that interview did nothing to smooth the feathers of King or Prout. When they came out of the Head's house, observers noticed that one man's nose was red and blue with emotion, while the other sweated heavily. That sight fully repaid the boys for the magnificent lecture the two masters then gave them.
        - id: ch06-b23
          speaker: narrator
          text: It appeared, to the boys' great surprise, that they had concealed important facts. They had committed both suppressio veri and suggestio falsi, two familiar gods against whom they often sinned. They were malignant in nature, untrustworthy in character, harmful and revolutionary in influence, and wholly given over to the devils of stubbornness, pride, and unbearable conceit. Ninth and last, they must take care. They must take very great care.
        - id: ch06-b24
          speaker: narrator
          text: They did take care, with the special care boys use when they mean to cause pain. They waited through one suffocating week until Prout and King had returned to their royal selves. Then came a house match, for their own house, with Prout taking part. They waited until he had put on his batting pads in the pavilion and stood ready to go out. King sat at the window keeping score. Outside, the three boys occupied a bench.
        - id: ch06-b25
          speaker: stalky
          text: I say, Beetle. Quis custodiet ipsos custodes?
        - id: ch06-b26
          speaker: beetle
          text: Don't ask me. I will have nothing private with you. You may be as private as you like at the other end of the bench, and I wish you a very good afternoon.
        - id: ch06-b27
          speaker: narrator
          text: McTurk yawned.
        - id: ch06-b28
          speaker: mcturk
          text: Well, you should have come to the Lodge like Christians instead of chasing your boys through the length and breadth of my covers. I think these house matches are all nonsense. Let's go to Colonel Dabney's and see whether he has caught any more poachers.
        - id: ch06-b29
          speaker: narrator
          text: That afternoon, there was joy in Aves.
