audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着含蓄的幽默
        timbre: 温暖清晰的中低音
        pace: 舒展而富于变化
        pitch: 中
    stalky:
      display_name: 斯托基
      tts:
        delivery: 自信狡黠，随时像在部署作战
        timbre: 清亮而有韧性的少年音
        pace: 明快
        pitch: 中高
    beetle:
      display_name: 甲虫
      tts:
        delivery: 机智好辩，笑意常藏在话里
        timbre: 稍厚的少年音
        pace: 中等偏快
        pitch: 中
    mcturk:
      display_name: 麦克特克
      tts:
        delivery: 冷峭直接，激动时带鲜明的爱尔兰腔调
        timbre: 瘦硬略带沙哑的少年音
        pace: 中等
        pitch: 中高
    prout:
      display_name: 普劳特先生
      tts:
        delivery: 谨慎多疑，努力维持师长威严
        timbre: 厚重略闷的男声
        pace: 偏慢
        pitch: 中低
    fox:
      display_name: 军士狐狸
      tts:
        delivery: 老练警觉，带军人的干脆
        timbre: 粗粝结实的男声
        pace: 中等
        pitch: 中低
    hartopp:
      display_name: 哈托普先生
      tts:
        delivery: 温和热心，认真得近乎天真
        timbre: 轻柔的男声
        pace: 从容
        pitch: 中
    colonel_dabney:
      display_name: 达布尼上校
      tts:
        delivery: 暴烈响亮，激动时爱尔兰口音浓重
        timbre: 洪亮苍老的男声
        pace: 急促多变
        pitch: 中低
    gamekeeper:
      display_name: 猎场看守
      tts:
        delivery: 粗直强硬，乡音浓重
        timbre: 粗哑的男声
        pace: 中等偏快
        pitch: 低
    lodge_woman:
      display_name: 门房女主人
      tts:
        delivery: 热情亲昵，乡音朴实
        timbre: 温厚明亮的女声
        pace: 中等
        pitch: 中
    king:
      display_name: 金先生
      tts:
        delivery: 尖刻自负，训斥时步步紧逼
        timbre: 干硬的男声
        pace: 偏快
        pitch: 中高
    headmaster:
      display_name: 校长
      tts:
        delivery: 镇定威严，冷幽默不露声色
        timbre: 深沉清楚的男声
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 刺窝暴露
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 夏天一到，只要是头脑正常的男孩子，都会到学校后面的金雀花山上搭窝棚。他们在带刺的灌木中心一点点削挖，弄出狭小的藏身处。里面满是树桩、断根和尖刺，进出都要挨扎，可校规越是不许，那里越像无上的乐园。斯托基、麦克特克和甲虫已经像海狸一样苦干了五个夏天。他们那时还没有尊贵到能拥有自己的自修室，所以这座窝棚就是他们退隐沉思的地方，也方便躲在里面抽烟。
        - id: ch01-b02
          speaker: narrator
          text: 舍监普劳特先生平日看着这三个人，怎么也找不出半点值得尊敬的品性。学校里红头发、心眼活络的军士狐狸更是从不信任他们。狐狸执行任务时会穿上网球鞋，挎着望远镜，像鹰一样扑向作恶的学生。要是这次由他独自出马，窝棚早就保不住了，因为他很懂自己的猎物。偏偏普劳特决定亲自查访。学生们因为他那双大脚，早给他取了“大脚怪”的外号。
        - id: ch01-b03
          speaker: narrator
          text: 一个安静的下午，斯托基在窝棚地上看见了那双大脚留下的印子。他立刻收好新烟斗，扫掉火柴头，赶去警告同伴。不过在找甲虫和麦克特克以前，他先去见了博物学会会长哈托普先生。
        - id: ch01-b04
          speaker: narrator
          text: 斯托基平时很瞧不起那个学会，这会儿却摆出自己最温顺的样子，请哈托普推荐他们三个人入会。他说，自己早就关心初开的花、最早出现的蝴蝶和新飞来的候鸟，只是一直把这份兴趣压在心里。只要哈托普肯给机会，他马上就愿意开始这种新生活。哈托普身为教师，自然知道事情可疑。可他又是个热心人，那颗柔软的小心灵常被偶然听见的三人议论刺痛，尤其受不了甲虫的话。最后，他还是宽厚地接纳了眼前这个悔过的罪人，把三个名字都写进名册。
        - id: ch01-b05
          speaker: narrator
          text: 接着，斯托基才到教室去。甲虫和麦克特克正把书塞进衣服，准备去他们称作“刺窝”的窝棚消磨下午。
        - id: ch01-b06
          speaker: stalky
          text: 全完了。午饭后，我在窝棚边看见赫菲那双仙女似的小脚。幸好，那双脚够大。
        - id: ch01-b07
          speaker: beetle
          text: 该死！烟斗藏好了吗？
        - id: ch01-b08
          speaker: stalky
          text: 当然藏了。难道我会把烟斗留在窝棚正中间？你这头瞎驴。现在那地方不能再去了，大脚怪准会盯住它。
        - id: ch01-b09
          speaker: mcturk
          text: 真讨厌，也真倒霉。干得漂亮，这下他们整个学期都要疑心咱们。
        - id: ch01-b10
          speaker: stalky
          text: 他不过发现了一座窝棚。他和狐狸只会盯着那里。咱们暂时别让人看见往那边走，这事就跟咱们没关系。
        - id: ch01-b11
          speaker: beetle
          text: 可咱们还能去哪儿？地方是你挑的，而且我下午本来想看书。
        - id: ch01-b12
          speaker: narrator
          text: 斯托基坐到课桌上，脚后跟敲着长凳。他骂甲虫垂头丧气，又宣布事情还没完。他看见脚印以后，正好碰见哈托普挥着捕蝶网，于是已经把一切安排妥了。
        - id: ch01-b13
          speaker: stalky
          text: 我告诉小哈托普，只要让你入会，你就肯给捉虫佬读论文。我还说你喜欢蝴蝶，火鸡。总之，咱们现在全是博物学家了。
        - id: ch01-b14
          speaker: beetle
          text: 那有什么用？
        - id: ch01-b15
          speaker: stalky
          text: 火鸡，踢他！
        - id: ch01-b16
          speaker: narrator
          text: 加入学会的用处大得很。博物学会会员为了科学，活动范围比别人大得多。只要不靠近民宅，他们几乎想往哪里走都行，而且哈托普先生会替他们担保品行端正。这层好处一说出来，斯托基的安排便完全清楚了。麦克特克照命令踢了甲虫几脚，甲虫一边护住挨踢的地方，一边终于明白，他们已经得到了一张走遍山野的通行证。
        - id: ch01-b17
          speaker: beetle
          text: 我是头驴，斯托基！讲和吧，火鸡。我承认自己是头驴。
        - id: ch01-b18
          speaker: stalky
          text: 别停。快说，你斯托基叔叔是不是个伟人？
        - id: ch01-b19
          speaker: beetle
          text: 是伟人。
        - id: ch01-b20
          speaker: mcturk
          text: 可捉虫还是件肮脏差事。鬼知道该怎么装？
        - id: ch01-b21
          speaker: narrator
          text: 斯托基转身打开几个低年级生的储物柜。那些小崽子个个精通博物学，装备正好齐全。他先拿出小布雷布鲁克的植物采集匣，把里面一团腐烂的根倒掉，再调好匣子上的滑板。接着，他找到小克莱的地质锤，又从柜顶取下一张能折叠的捕蝶网。那网做得像钓竿一样精巧。这一整套带在身上，足以让三个人从头到脚都显得很专业。
        - id: ch01-b22
          speaker: stalky
          text: 甲虫拿锤子，火鸡去弄捕蝶网。
        - id: ch01-b23
          speaker: mcturk
          text: 我死也不拿网。甲虫，把锤子给我。
        - id: ch01-b24
          speaker: beetle
          text: 行，我不摆架子。斯托基，把柜顶那张网扔下来。
        - id: ch01-b25
          speaker: stalky
          text: 这才对。网还能折起来，跟钓竿一样。现在咱们沿悬崖追蝴蝶，那边很少有人去。得快跑，书最好留下。
        - id: ch01-b26
          speaker: beetle
          text: 休想。我才不为几只脏蝴蝶，连自己的乐子也丢掉。
        - id: ch01-b27
          speaker: stalky
          text: 那你会热得要命。顺便把我的《乔罗克斯》也带上，反正不会更热。
    - id: ch02
      title: 鸟之乐岛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三个人果然热得要命。甲虫把自己的书藏在腰带和衣领之间，还替斯托基带上了那本《乔罗克斯》。斯托基领着他们快步向西，沿着金雀花山下面的悬崖一直跑，穿过一道又一道长满花丛的谷坳。兔子从脚边窜出去，豹纹蝶在眼前飞来飞去，这三位新入会的博物学家却一概不理。麦克特克拿着地质锤，倒是一路发表见解，只不过那些话实在粗野，一句也不能照样说给人听。
        - id: ch02-b02
          speaker: mcturk
          text: 咱们难道要一路跑到克洛韦利？
        - id: ch02-b03
          speaker: narrator
          text: 他们终于喘着气倒在一片短而有弹性的草地上。一边是悬崖下海水低低的轰鸣，一边是内陆树梢间轻柔的夏风。三个人俯望着一整道谷坳。半边长满高大的老金雀花，正开得最旺，从荆棘边一直铺到由各种树木和冬青组成的密林，仿佛半个山谷都燃起金色火焰，火一路烧到了悬崖边。他们这一侧却是没有遮掩的草坡，上面竖着一块又一块告示牌，生怕来人看不见。
        - id: ch02-b04
          speaker: stalky
          text: 这老家伙真凶。“必依法律最严厉之规定起诉。G·M·达布尼，上校、治安法官。”脑子正常的人都不会闯进去，对吧？
        - id: ch02-b05
          speaker: mcturk
          text: 想起诉，就得先证明人家造成了损害。光是走进去，告不了谁。全是吓人的废话。
        - id: ch02-b06
          speaker: stalky
          text: 那我就放心了。这地方正合用。甲虫，别直着走，半英里外都看得见你。往树林那边去，把那张讨厌的网收起来。
        - id: ch02-b07
          speaker: narrator
          text: 甲虫拆下网圈，把网塞进口袋，又把长柄缩成短棍。三人来到离海不远的树林边，准备钻进荆棘和金雀花。
        - id: ch02-b08
          speaker: stalky
          text: 从这里往下钻，谁也看不见。甲虫，你先探路。闻闻，附近有股臭狐狸味。
        - id: ch02-b09
          speaker: narrator
          text: 甲虫四肢着地钻进金雀花，只有眼镜快掉时才腾出一只手去扶。他被尖刺扎得不停哼哼，好一会儿才宣布，自己找到了一条还算不错的狐狸道。这个发现对他很及时，因为斯托基正从后面拧他，催他赶快往前。他们一个接一个沿着隧道向下爬。那显然是谷里各种动物共同使用的大路。最叫他们高兴的是，隧道尽头正好到了悬崖最边缘，那里有几平方英尺干燥草地，墙壁和顶棚都是密得无法穿透的金雀花。
        - id: ch02-b10
          speaker: stalky
          text: 乖乖！这里什么都干不了，只能躺着。看！
        - id: ch02-b11
          speaker: narrator
          text: 他收起小刀，拨开面前粗硬的枝条，就像推开一扇窗。远处的伦迪岛和深沉的大海一下全露了出来。海水在两百来英尺下懒洋洋地舔着卵石。崖架上的小寒鸦吵个不停，某处看不见的鹰巢里也传来嘶鸣。这个藏身处既干燥，又没有人能从陆地看见，眼前还像挂着一幅只属于他们的海景。
        - id: ch02-b12
          speaker: narrator
          text: 斯托基从容地往下吐了一口，竟正好落在一只晒太阳的小兔背上。那地方远在崖下，只有悬崖兔才能站稳。灰黑相间的大海鸥冲着寒鸦尖叫。四周一英亩又一英亩，全是香气浓得扑鼻的花丛，贴地筑巢的鸟藏在里面。盘旋的鹰影掠过又折回，鸟儿便一会儿歌唱，一会儿全体安静。谷坳对面光秃的草地上，兔子们却不管这些，仍旧跺着脚嬉闹。
        - id: ch02-b13
          speaker: stalky
          text: 呼！这才叫博物学。妙不妙？好一个老海！
        - id: ch02-b14
          speaker: narrator
          text: 他装好烟斗，又朝海吐了一口，便不再说话。甲虫和麦克特克早已趴着读书。海像在打鼾，喉咙里还咕噜作响。先前受惊的鸟儿渐渐各忙各的，三个男孩也在温暖、浓香、叫人昏昏欲睡的寂静里继续看书。
        - id: ch02-b15
          speaker: stalky
          text: 嘘，来了个猎场看守。他还带着枪。该死，他要坐下了。
        - id: ch02-b16
          speaker: beetle
          text: 他准会说咱们偷猎。可野鸡蛋有什么好偷的？反正总是坏的。
        - id: ch02-b17
          speaker: stalky
          text: 先退回树林。别这么快惊动达布尼上校。他也许一路跟着咱们。往隧道上爬，别出声。
        - id: ch02-b18
          speaker: narrator
          text: 甲虫刚爬到上面，突然发出一声怪叫。紧跟着，一个沉重的东西撞过金雀花，枝条轰然乱响。
        - id: ch02-b19
          speaker: gamekeeper
          text: 哎，你这红毛小坏蛋！我看见你了！
        - id: ch02-b20
          speaker: narrator
          text: 看守端起枪，朝声音传来的方向连放两筒。弹丸打得枯枝和尘屑四处飞。一只大狐狸从斯托基两腿之间冲出去，直奔悬崖边。
        - id: ch02-b21
          speaker: narrator
          text: 三个男孩一直逃进树林才敢开口。他们衣服破了，头发乱了，浑身发热，好在没有被人看见。
        - id: ch02-b22
          speaker: stalky
          text: 真险。我敢说，有几颗弹子擦着我头发过去了。
        - id: ch02-b23
          speaker: beetle
          text: 你们看见那只狐狸了吗？我的手差点按到它。真够大，也真够臭。火鸡，你怎么了？中弹了？
        - id: ch02-b24
          speaker: narrator
          text: 麦克特克瘦削的脸一下白得像珍珠。平日总半张着的嘴紧紧抿住，眼里烧着怒火。斯托基和甲虫从没见过他这副模样，只有以前那次几乎闹成内战的惨烈时刻可以相比。他一根根从头发里摘掉尖刺，用他们从没听过的刺耳声音问，两人知不知道刚才那一枪跟杀人一样恶劣。他生气的并不是自己差点中弹，而是看守竟然朝那只狐狸开枪。
        - id: ch02-b25
          speaker: stalky
          text: 可他没打中咱们。我倒觉得挺好玩。喂，你去哪儿？
        - id: ch02-b26
          speaker: mcturk
          text: 去找这里的宅子。我要把这事告诉达布尼上校。
          emotion: angry
        - id: ch02-b27
          speaker: stalky
          text: 你疯了？他只会说咱们活该，再告到学校去。到时候咱们得当众挨鞭子。火鸡，想想咱们！
        - id: ch02-b28
          speaker: mcturk
          text: 蠢货！你以为我在想咱们？我说的是那个看守。
          emotion: angry
        - id: ch02-b29
          speaker: narrator
          text: 甲虫苦着脸跟了上去，斯托基也只好同行。眼前分明是个全新的麦克特克。他忽然高傲起来，脸上棱角分明，头昂着，鼻子翘得老高，根本不理会朋友关于鞭子的警告。他分开冬青，领着两人穿过灌木园，一直走到宅子前面的草坪。一位白胡子老绅士正在那里打高尔夫。他拿着铁杆，一会儿认真推球，一会儿因为球不听话而破口大骂，劲头十足。
        - id: ch02-b30
          speaker: mcturk
          text: 请问，您是达布尼上校吗？
        - id: ch02-b31
          speaker: colonel_dabney
          text: 我就是。你们几个想干什么？刚才是你们惊了我的野鸡，别想抵赖！你是学校里的学生，我一眼就看得出。马上报姓名和学号。告示牌你也看见了，对不对？可恶，真是可恶透顶！
          emotion: angry
        - id: ch02-b32
          speaker: narrator
          text: 上校气得噎住。麦克特克的鞋跟不停敲地，说话也结巴起来。那是他快发脾气的两个信号。
        - id: ch02-b33
          speaker: mcturk
          text: 请听我说，先生。您打狐狸吗？要是您不打，您的看守却在打。我们亲眼看见了。您怎么骂我们都行，我不在乎，可这种事太骇人，会毁掉邻里间的情分。一个男人怎么对待猎物，应该说得清清楚楚。这比杀人还坏，因为法律根本管不了。
          emotion: angry
        - id: ch02-b34
          speaker: colonel_dabney
          text: 你知道我是谁吗？
        - id: ch02-b35
          speaker: mcturk
          text: 不知道，先生。就算您住在城堡里，我也不在乎。现在请您像绅士对绅士那样回答我，您到底打不打狐狸？
        - id: ch02-b36
          speaker: narrator
          text: 斯托基和甲虫吓得发抖。他们早年还踢过麦克特克，好让他改掉爱尔兰口音。如今那口音全回来了。他们以为上校会先杀他一次，校长再杀一次。可老人竟然软了下来。
        - id: ch02-b37
          speaker: colonel_dabney
          text: 我不打。
        - id: ch02-b38
          speaker: mcturk
          text: 那您就得解雇看守。他不配跟一只敬畏上帝的狐狸住在同一个郡。何况这时节，那还是只母狐！
        - id: ch02-b39
          speaker: colonel_dabney
          text: 你特意跑来，就是为了告诉我这个？
        - id: ch02-b40
          speaker: mcturk
          text: 当然了，你这傻老头。要是您在我的土地上看见这种事，难道不会来告诉我？
        - id: ch02-b41
          speaker: narrator
          text: 那一跺脚，把学校和对长辈应有的礼数全都跺没了。麦克特克仿佛又回到西部海岸那些多雨、荒凉的紫色群山。每逢假期，他在那里就是四千英亩荒地的总督，是一个传了三百年的家族的独子，是一条破旧渔船的主人，也是父亲手下那群散漫佃户心中的偶像。眼下站在草坪上的不再是冒犯师长的学生，而是一位地主，正在同身份相等的另一位地主说话。深渊对深渊发出呼唤，老绅士听懂了那声音。
        - id: ch02-b42
          speaker: colonel_dabney
          text: 我道歉，毫无保留地向你，也向故国道歉。现在请你把事情从头讲一遍，好吗？
        - id: ch02-b43
          speaker: narrator
          text: 麦克特克说，他们当时在上校的谷坳里，又把经过完整讲了一遍。他一会儿像个学生，一会儿又像个愤怒的乡绅。
        - id: ch02-b44
          speaker: mcturk
          text: 所以，他准不是头一次这样干。我们都不愿随便指控邻居家的雇工，可这一次，我只能冒昧来找您。
        - id: ch02-b45
          speaker: colonel_dabney
          text: 我明白，你有充分理由。太无耻了，真是无耻！
        - id: ch02-b46
          speaker: narrator
          text: 两人并肩在草坪上踱步，上校开始像一个男人对另一个男人那样同他说话。他越想越气，抱怨这就是把一个渔夫从捕龙虾的笼子旁提拔起来的后果，那种出身简直足以毁掉一位天使长的名声。他说麦克特克的父亲把儿子教养得很好，自己很想有幸结识那位父亲。接着，他才留意到斯托基和甲虫，认定这两位是英格兰人，又惊讶在如今的教育之下，三个男孩竟还能有这么扎实的根基。他本想引用“从婴孩口中”那句话，看看他们的个头，又觉得离婴孩实在太远。
        - id: ch02-b47
          speaker: colonel_dabney
          text: 雪利酒弄得我肝底下难受，不过啤酒怎么样？再来点吃的？男孩大多讨厌透顶，可凡事总有例外。何况，那还是只母狐！
        - id: ch02-b48
          speaker: narrator
          text: 一位灰发女管家在露台上摆出吃食和啤酒。斯托基和甲虫知道自己在这场交谈中只能拉第二小提琴，几乎一句话也没说，只顾埋头吃东西。麦克特克却喝得眼睛发亮，继续那种自由而高远的谈吐，仿佛不是刚从学校跑来的少年。上校始终把他当兄弟看待，同他谈土地、猎物和雇工，一点也没有再把三人当成掏鸟窝的学生。
        - id: ch02-b49
          speaker: colonel_dabney
          text: 老弟，你们以后尽管来。下头的谷坳也好，别处也好，哪儿都可以，只要别惊动我的野鸡。这两件事并不冲突。我也不会让第二杆枪留在这里。你们爱来就来，爱走就走，不必见我。那个看守从前是渔夫，今晚还得回去当渔夫！我送你们到门房，我手下的人以后会认得你们。
        - id: ch02-b50
          speaker: narrator
          text: 上校一路夸着他们，把他们送到高大的门房栅门。他还特意交代，以后手下的人都会认得这三位客人，不会再有人拦他们。公园的篱墙用劈开的橡木做成，三个人出了门便站在那里不动。一路上几乎没说过话的斯托基，也像望着另一个世界来的人一样望着麦克特克。刚才在草坪上，麦克特克竟凭一场怒火替他们赢来整片猎场，这实在超出两位朋友的想象。两大杯烈啤酒又勾起了他的愁绪，他把双手插进口袋，慢慢走着，低声哼起那首绝对禁唱的爱尔兰歌。
        - id: ch02-b51
          speaker: mcturk
          text: 啊，亲爱的帕迪，你可听见四处流传的消息？
        - id: ch02-b52
          speaker: narrator
          text: 平时，斯托基和甲虫早扑上去收拾他了。那首歌在他们中间等同于诅咒，简直犯了巫术之罪。这一次，看在他刚刚立下的大功上，两人没有动手，只默默围着他跳舞，等他自己从那片故乡的山地回到学校。直到离学校还有半英里时，下午茶铃忽然响起。麦克特克打了个寒噤，仿佛从梦里醒来。假日领地的荣光从他身上退去，他重新变成学校里的学生，也重新说回了标准英语。
        - id: ch02-b53
          speaker: stalky
          text: 火鸡，你刚才真了不得！我都不知道你还有这本事。你给咱们弄到一座能用到学期结束的窝棚，而且绝不会被抓。乐啊！听我得意！
        - id: ch02-b54
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 啼啦啦啦咿嘟！我得意！听我得意！
        - id: ch02-b55
          speaker: narrator
          text: 三人用脚后跟疯狂旋转，唱着那种近似原始凯歌的怪调，沿煤气罐旁的小路奔下山，正好碰见普劳特。普劳特整个下午都守在他们废弃的旧窝棚旁。
    - id: ch03
      title: 追查开始
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 普劳特的想象力总是朝人生阴暗的一面走。他只理解那些参加舍际比赛、每时每刻都有行踪可查的男孩。偏偏他亲耳听过麦克特克公开嘲笑板球，连舍际比赛也不放过。他知道甲虫对舍誉的看法很有煽动性。至于总带着温柔微笑的斯托基，他永远分不清那孩子什么时候正在笑话自己。因此，既然人性就是这样，他认定这三个眼神清澈的小天使准在什么地方干了坏事。他只希望事情别坏得太严重。
        - id: ch03-b02
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 啼啦啦啦咿嘟！我得意！听我得意！
        - id: ch03-b03
          speaker: narrator
          text: 斯托基像跳舞的苦行僧一样转进餐厅，甲虫张开双臂跟在后面，麦克特克唱到嗓子都劈了。三人旋转着从舍监身边飞驰过去。普劳特不禁怀疑，空气里是否真的飘着一股啤酒味。他的不幸在于，舍监的良心催他必须找同事商议。若是带着烟斗和烦恼去找信任男孩、也懂一点男孩的哈托普，也许还能免去日后的难堪。可命运偏偏把他领到了金先生那里。金同样是舍监，不是普劳特的朋友，却是斯托基一伙最热心的敌人。
        - id: ch03-b04
          speaker: king
          text: 啊哈，有意思！我舍里的学生可想不出这种事。
        - id: ch03-b05
          speaker: prout
          text: 可我没有确切证据。
        - id: ch03-b06
          speaker: king
          text: 对付那个惊世骇俗的甲虫，还需要证据？军士总能找出来。他们准是在什么地方抽烟喝酒，那一类男孩以为这样才像男人。
        - id: ch03-b07
          speaker: prout
          text: 可他们没有追随者，对低年级学生也确实很粗暴。
        - id: ch03-b08
          speaker: king
          text: 因为他们瞧不起普通乐趣。那几个自命不凡的小畜生，从不公然犯规，只会精心算计着无礼。照我看，应该盯他们一个星期，狠狠教训一顿，压一压那份自负。我虽不爱管别人舍里的事，不过军士可以留心，我散步时也能顺便看看。
        - id: ch03-b09
          speaker: narrator
          text: 走廊远处又传来“听我得意”的怪唱。金厌恶地问，他们从哪里学来这种下流声音，并断言他们正需要一次狠狠的教训。
        - id: ch03-b10
          speaker: narrator
          text: 接下来几天，三个男孩根本没把那场正在酝酿的教训放在心上。他们把达布尼上校整片产业都当成了游乐场，行动时像印第安人一样隐秘，认路时又像窃贼一样精确，很快把每条路线都探得清清楚楚。他们很用心地讨好了守门人夫妇。从此既可以由山上公路旁的门房大门进去，一路下到谷坳，再沿悬崖回来，也可以从谷坳出发，穿过树林爬回大路。哪条路有掩护，哪一段会在天际线上露出人影，他们全记在心里。
        - id: ch03-b11
          speaker: narrator
          text: 他们避开上校，免得来得太勤，失掉欢迎。他们也绝不在山脊上露面。悬崖边的新窝最受喜爱，甲虫把它命名为“鸟之乐岛”。烟斗和烟草藏在崖下一块伸手可及的岩架上，从此，他们在校规上无懈可击。
        - id: ch03-b12
          speaker: narrator
          text: 上校说他们可以随意出入整片土地，却并没有邀请他们进宅子。这一点极其要紧。既然他们不是专程去拜访上校，就不用按照学校关于访客的严格规定事先请假。他只是把自己的土地向他们开放，而他们作为合法的博物学会会员，放宽后的活动范围正好能抵达谷里的告示牌，也能抵达山上公路旁的门房大门。于是，从学校到鸟之乐岛的每一步都能得到规则上的解释。他们在那里躲着抽烟，却在校规上找不出破绽，连自己都惊讶于品德竟会如此高尚。
        - id: ch03-b13
          speaker: stalky
          text: 就算咱们真的越界好几英里，谁也抓不到这里，除非他知道隧道。总比躺在学校后头抽一口烟，就吓得魂都掉了强吧？你们斯托基叔叔是不是——
        - id: ch03-b14
          speaker: beetle
          text: 不是。这件事得谢火鸡。火鸡才是伟人。亲爱的火鸡，你可把赫菲害苦了。
        - id: ch03-b15
          speaker: mcturk
          text: 阴沉的老蠢货。
        - id: ch03-b16
          speaker: stalky
          text: 他们已经疑心咱们。大脚帽越来越多疑，狐狸每次追踪，都非得弄成一次剥头皮不可。
        - id: ch03-b17
          speaker: beetle
          text: 狐狸是个轻浮的钦加古克。
        - id: ch03-b18
          speaker: stalky
          text: 可怜的狐狸，总有一天会逮到咱们。昨晚他警告我，说正在盯着我，是为我好。我告诉他，最好赶快把眼睛挪开，不然要惹麻烦。我也是为他好。他气坏了。
        - id: ch03-b19
          speaker: beetle
          text: 对狐狸来说，这只是一场公平游戏。坏心眼的是赫菲。他大概真以为咱们喝醉了。
        - id: ch03-b20
          speaker: stalky
          text: 我只在假期醉过一次，吐得好惨。不过摊上大脚这种舍监，真能把人逼得借酒浇愁。
        - id: ch03-b21
          speaker: mcturk
          text: 只要咱们参加比赛，冲他说“好球，先生”，再单腿站着咧嘴，每句话都接“是，先生”“不，先生”“求您啦，先生”，赫菲准会把咱们看得不得了。
        - id: ch03-b22
          speaker: stalky
          text: 现在学已经晚了。
        - id: ch03-b23
          speaker: beetle
          text: 赫菲本意不坏，可他是头驴。咱们又明明白白让他知道，咱们觉得他是头驴，所以他不喜欢咱们。昨晚祷告后，他还说自己“代行父母之职”。
        - id: ch03-b24
          speaker: stalky
          text: 他真这么说？那就是在酝酿一桩格外卑鄙的坏事。上回他说这话，是因为我在宿舍跳舞，罚我抄三百行。不过只要咱们快活，有什么要紧？咱们好得很。
        - id: ch03-b25
          speaker: narrator
          text: 他们确实好得很，也正因如此，普劳特、金和狐狸怎么都猜不透。一般做贼心虚的男孩总会露出马脚。他们匆匆溜过墙手球场，受盘问时会紧张地笑，回来时衣服凌乱，掐着最后一点时间才赶上点名。他们彼此点头、眨眼、偷笑，一见老师走近便四散逃开。可斯托基和他的同盟早过了会显出这些稚嫩征兆的年纪。他们悠悠闲闲走出学校，沿着合法路线到门房吃一份草莓和奶油，再衣着整齐、精神十足地回来，从不给追查者一点像样的线索。
        - id: ch03-b26
          speaker: narrator
          text: 原来的守门人已经接替那个杀气腾腾的渔夫，当上猎场看守。他妻子十分宠爱三个男孩，每次他们到门房，都拿草莓、奶油和别的食物招待。男人还送给他们一只松鼠。三人把松鼠献给博物学会，正好堵住哈托普的嘴。哈托普本来还想问，他们入会以后究竟替科学做过什么，这下反而被一举将死，连盘问都无法继续。与此同时，狐狸忠心耿耿地搜索东北方一家偏僻十字路口客店后面的德文郡小巷。那里的岔路又深又多，足够他浪费许多时间。更有意思的是，平时在教师休息室里都很少友好相处的普劳特和金，竟也结伴朝那个错误的方向散步。真正的鸟之乐岛却在学校正西南方，安安静静地等着三个男孩。
        - id: ch03-b27
          speaker: stalky
          text: 他们真是深得见鬼。为什么老搜那片猎场？
        - id: ch03-b28
          speaker: beetle
          text: 因为我问狐狸，有没有喝过那里的啤酒。这足够让他振作一下。他们在咱们旧窝棚旁嗅了那么久，也该换地方了。
        - id: ch03-b29
          speaker: stalky
          text: 不过这不能永远继续。赫菲黑得像雷雨云，金一直搓手，笑得像鬣狗。这事太腐蚀他的品德，他迟早会炸开。
    - id: ch04
      title: 设伏
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那一天来得比预料中更早。某天下午点名时，专抓缺席者的军士没有出现。
        - id: ch04-b02
          speaker: stalky
          text: 客店搜腻了吧。他拿着望远镜爬上山顶，准备找咱们。刚才答名时，赫菲还斜眼看咱们，他也有份。走！
        - id: ch04-b03
          speaker: beetle
          text: 去鸟岛？
        - id: ch04-b04
          speaker: stalky
          text: 当然。不过今天不抽烟，我觉得有人跟踪。沿悬崖慢慢走，给狐狸足够时间，让他在山顶跟咱们并排前进。
        - id: ch04-b05
          speaker: narrator
          text: 他们先溜达到游泳池，很快追上了金先生。
        - id: ch04-b06
          speaker: king
          text: 哦，别让我打扰你们。当然是在做科学研究吧？祝你们玩得愉快，我的年轻朋友。
        - id: ch04-b07
          speaker: stalky
          text: 看见了吧？他根本守不住秘密。他会在游泳池截断退路，等赫菲过来。他们把别处都搜遍了，以为这回能把咱们装进瓶子。不用着急。
        - id: ch04-b08
          speaker: narrator
          text: 三人悠闲地穿过谷坳，来到一排告示牌前。
        - id: ch04-b09
          speaker: stalky
          text: 听着。狐狸在上风头，正飞快下山。等听见灌木响，咱们就笔直穿过草地，进鸟岛。他们想抓个人赃并获。
        - id: ch04-b10
          speaker: narrator
          text: 他们先同隧道成直角钻进花丛，又公然跑过草地，最后躺进鸟岛，一动不动。
        - id: ch04-b11
          speaker: stalky
          text: 我说什么来着？
        - id: ch04-b12
          speaker: narrator
          text: 他小心收起烟斗和烟草。军士喘着气靠上篱笆，举起望远镜，一寸一寸搜索金雀花，可那就像要看穿一只沙袋。过了一会儿，普劳特和金也到了，三个人站在一起商量。
        - id: ch04-b13
          speaker: stalky
          text: 狐狸怕告示牌，也怕尖刺。咱们从隧道溜上去，到门房吃东西。看，他们把狐狸派进猎场了。
        - id: ch04-b14
          speaker: narrator
          text: 军士齐腰陷在金雀花里。枝条又硬又密，随着他前进不断噼啪折响，整片灌木都在摇晃。他的耳边全是自己制造的声音，根本听不出三名猎物早已从真正的隧道撤走。男孩们顺利爬到上方，抵达树林的庇护处，然后隔着一道冬青带往下看。他们看得见狐狸艰难前进，狐狸却连他们的一片衣角也看不见。
        - id: ch04-b15
          speaker: stalky
          text: 响得真够厉害。达布尼上校准不会喜欢。咱们进门房吃点东西，顺便把热闹看完。
        - id: ch04-b16
          speaker: narrator
          text: 新任猎场看守忽然从他们身边小跑过去，问谷底是谁，说主人知道了非发疯不可。
        - id: ch04-b17
          speaker: stalky
          text: 几个偷猎的。
        - id: ch04-b18
          speaker: gamekeeper
          text: 我非把这帮偷猎鬼治服帖不可！
        - id: ch04-b19
          speaker: narrator
          text: 看守冲下漏斗形谷坳。起初只是金雀花断裂的噼啪声，随后响起军士的辩解、看守的喝骂，还有篱笆外面两位舍监焦急的叫喊。很快，整个山谷都塞满了各种声音，其中金先生喊得最响。他隔着告示牌指挥军士继续向前，还想命令猎场看守别妨碍学校的人执行职责。
        - id: ch04-b20
          speaker: king
          text: 往前走，军士！你别碰他，他是在执行我的命令！
        - id: ch04-b21
          speaker: gamekeeper
          text: 你算哪个，也敢在这儿发号施令？红胡子，跟我去见主人！你，从刺窝里出来！哦，我认得你们追的男孩。他们有两只长耳朵，毛茸茸的肚皮，死了以后就被你们塞进口袋。都去见主人！另外两个人留在篱笆外头。
        - id: ch04-b22
          speaker: king
          text: 向地主解释，军士！你可以解释！
        - id: ch04-b23
          speaker: narrator
          text: 军士显然已经向优势兵力投降。甲虫在门房后面的草地上笑得浑身抽搐，连泥都咬进嘴里。斯托基把他踢起来。他和麦克特克努力板着脸，只有一小块面部肌肉偶尔跳一下。
        - id: ch04-b24
          speaker: narrator
          text: 他们绕到门房后面，先让甲虫把嘴里的泥吐干净，又强迫彼此把脸上的笑收住，这才敲响门。这里一向欢迎他们，而且今天门房女主人显然已经知道，自己的丈夫正在谷里收拾几个偷猎者。男孩们走进起居室时，没有人把他们同外面那场追捕联系起来。
        - id: ch04-b25
          speaker: lodge_woman
          text: 快进来坐，我的小宝贝们。他们碰不了我男人，他会把那些偷猎鬼治得服服帖帖。这里有新鲜莓子和奶油。咱们达特穆尔人从不忘朋友。要糖吗？我男人还给你们挖到一只獾，就在棚屋的箱子里。
        - id: ch04-b26
          speaker: stalky
          text: 吃完我们就带走。您今天要洗衣服吧？别费心招待，奶油已经多得很。
        - id: ch04-b27
          speaker: narrator
          text: 女人用围裙擦着洗衣服洗得粉红的双手，放心地退了出去，把三人独自留在整洁的起居室里。外面的碎石路先传来一阵杂乱脚步，有人被推着往前走，也有人气喘吁吁地跟在后面。接着，达布尼上校比军号还嘹亮的声音直冲进屋。三个男孩不用看也知道，猎场看守已经把军士押到了主人面前。
        - id: ch04-b28
          speaker: colonel_dabney
          text: 你认得字吗？脑袋上长眼睛了吗？别想抵赖，你看见告示牌了！你的职责？你的职责是滚出我的土地！你还敢教我什么叫职责？你在灌木里吼得像公牛，却说是在追男孩。那就把男孩留在家里，我不管你们的男孩！我一个字也不信。你满眼都是偷偷摸摸的偷猎神气，足够毁掉一位天使长的名声！你还是军士？那更丢脸。女王陛下在你身上做了最亏本的买卖。领着养老金，还满乡偷猎！不过我会宽恕你。现在回答，你到底看没看见告示牌？闭嘴，军士！
          emotion: angry
        - id: ch04-b29
          speaker: narrator
          text: 军士还想说明自己在执行学校交给他的任务，可二十一年的军旅生涯已经在他身上留下了深深的印记。上校一声“闭嘴”，他本能地服从，立刻把所有解释咽了回去。门房里面，甲虫死死咬着钩针编的椅背罩，才没有发出声音。斯托基和麦克特克也只能把脸埋进家具，任凭肩膀不停发抖。
        - id: ch04-b30
          speaker: colonel_dabney
          text: 现在，齐步走！
        - id: ch04-b31
          speaker: narrator
          text: 高大的栅门砰地关上，军士被赶到了外面。上校站在门内喘着粗气，还在难以置信地念叨，一个军士竟敢跑到他的土地上教训他什么叫职责。话音未落，碎石路上又传来急促脚步。门房里三个男孩刚刚缓过一口气，立刻又听出第二批人到了。这一次不只有金，后面还有同样跑得气喘吁吁的普劳特。
        - id: ch04-b32
          speaker: stalky
          text: 是金！是金！
        - id: ch04-b33
          speaker: narrator
          text: 斯托基把脸埋进马鬃靠垫。麦克特克趴在壁炉前咬地毯。甲虫藏在沙发后，笑得整张沙发一起起伏。厚玻璃外的人影又蓝又扭曲。
        - id: ch04-b34
          speaker: king
          text: 我抗议这种暴行！这个人完全是在尽职。请允许我递上名片。可惜我没带，不过我叫金，是学校的舍监。他的一切行动都由我负责。我们刚才看见三个——
        - id: ch04-b35
          speaker: colonel_dabney
          text: 你到底看见我的告示牌没有？
        - id: ch04-b36
          speaker: king
          text: 我承认看见了，可当时情形特殊——
        - id: ch04-b37
          speaker: prout
          text: 我代行父母之职，对自己管辖的男孩负有责任。
        - id: ch04-b38
          speaker: colonel_dabney
          text: 代什么？那我只能说，你给男孩树了个坏透的榜样！你们的男孩不归我，我也没见过他们。就算每丛灌木里都藏着一个咧嘴笑的男孩，你们也没权利这样闯进谷里，把一切惊得乱七八糟。你们该像基督徒一样先到门房来，不该追着那些该死的男孩，把我的猎场踩个遍。你说你代行父母之职？我的拉丁文也没忘。谁来监督监督者？老师都擅闯私地，又怎么责怪男孩？
          emotion: angry
        - id: ch04-b39
          speaker: prout
          text: 能否让我私下同您谈谈？
        - id: ch04-b40
          speaker: colonel_dabney
          text: 我跟你没什么可私下谈的！出了那道门，你爱怎么私下就怎么私下。祝你下午愉快！
          emotion: angry
        - id: ch04-b41
          speaker: narrator
          text: 栅门第二次砰地关上。等上校回宅子以后，三个男孩抱成一团，笑得像鸡叫，几乎喘不上气。
        - id: ch04-b42
          speaker: stalky
          text: 哦，我的灵魂！我的金！我的赫菲！我的狐狸！一个个全是热心，纯洁又热心！咱们快走，不然赶不上下午茶。
        - id: ch04-b43
          speaker: mcturk
          text: 带上那只獾，让小哈托普高兴。叫大家都高兴。
        - id: ch04-b44
          speaker: narrator
          text: 三人到棚屋去，在一只臭气熏天的箱子里找到了那只獾。他们留下两个半克朗当作价钱，合力抬起箱子，踉踉跄跄往学校走。偏偏獾在箱子里的哼声像达布尼上校像得出奇。每哼一声，他们便想起上校骂人的腔调，笑得手脚发软，路上把箱子掉了两三回。到了墙手球场边，军士迎上来，传达命令，叫他们回宿舍待着，等候传唤。这时三人还远远没有恢复正常。
        - id: ch04-b45
          speaker: beetle
          text: 请把箱子送到哈托普先生房里吧。至少咱们替博物学会做了一件事。
        - id: ch04-b46
          speaker: fox
          text: 这怕是救不了你们，年轻的先生们。
        - id: ch04-b47
          speaker: stalky
          text: 一切平安，狐狸比乌斯。咱们永远不会抛弃你。在猎场里放猎狗咬狐狸，更能说明一个人品行败坏，对吧？不，你说得对，我有点不舒服。
        - id: ch04-b48
          speaker: narrator
          text: 狐狸心里乱极了。他怎么看都觉得，这三个男孩像是醉得很厉害。他们站不稳，说话断断续续，还会毫无缘故地笑起来，可身上偏偏一点酒味也没有。而且这种轻易露出破绽的样子，又实在不大像他们。狐狸隐约觉得哪里不对，只是一时还理不清。想到金和普劳特挨了与自己同样的训斥，甚至挨得更重，倒也多少算一点安慰。
    - id: ch05
      title: 道德麻风病人
      blocks:
        - id: ch05-b01
          speaker: stalky
          text: 现在得收住。咱们是受冤枉的清白人，一直都是。咱们根本不知道为什么被赶到宿舍，对吧？
        - id: ch05-b02
          speaker: mcturk
          text: 不解释，不给下午茶，还当着全舍羞辱咱们。这事严重得很。
        - id: ch05-b03
          speaker: beetle
          text: 忍住，等金发作。那个诽谤成性的老混蛋准会大发一场爱尔兰疯。普劳特太谨慎，盯住金。他只要给机会，咱们就向校长申诉。那一招总叫他们难受。
        - id: ch05-b04
          speaker: narrator
          text: 三人被叫进舍监书房。金和狐狸站在普劳特身旁，狐狸腋下夹着三根藤条。金看到男孩们脸上还有没擦干的笑泪，得意地冷笑起来。
        - id: ch05-b05
          speaker: narrator
          text: 审问开始了。他们承认沿悬崖走过，也承认进了达布尼上校的土地，还看见了告示牌。说到告示牌，甲虫忍不住噗嗤一声。普劳特问，他们为什么进去。
        - id: ch05-b06
          speaker: stalky
          text: 嗯，先生，那里有一只獾。
        - id: ch05-b07
          speaker: narrator
          text: 金一向讨厌博物学会，立刻叫他们别在无礼之外再添撒谎。可那只獾此刻就在哈托普房里，还是军士亲手送去的。獾的问题就这样解决了，金却因短暂受挫更加愤怒。普劳特慢吞吞准备下个问题时，男孩们听见金一脚一脚跺着地板。
        - id: ch05-b08
          speaker: narrator
          text: 三个人的神情随即全收住了。他们已经找到稳定的步调。眼睛不再发亮，面孔一片空白，手垂在两旁，连指尖都不动。刚才那些没擦干的笑泪也仿佛不再说明什么。普劳特还以为他们终于懂得处境严重，金则把沉默当成心虚。其实，他们正拿一个同胞做学费，学习本民族最重要的一课。无论心里多么得意，都先把一切情绪藏起来。敌手正在气头上时不要急着反击，也不要替他指出脚下的陷阱。只需等到恰当的时机，让他自己越走越远，越说越重，直到再也无法收回，然后把这个异族诱进早已张开的圈套。
        - id: ch05-b09
          speaker: narrator
          text: 到这里为止，一切都很顺利。普劳特还在为自己的学生痛心，金却只想报复，于是越来越放肆地插手审判。他先问，三个人知不知道擅闯私地会受什么惩罚。斯托基做出一副犹豫不决的好模样，承认自己仿佛听说过一点相关的事，不过他以为——说到这里，他故意把句子拖住，拖得不能再拖。面对这样的敌手，他不愿太早把受邀进入猎场这张王牌亮出来。
        - id: ch05-b10
          speaker: king
          text: 我不想听你的“不过”，也不想听你闪烁其词。有些男孩偷偷爬出去，偷偷溜出去，甚至潜到博物学会范围以外。他们假装入会，只为掩护恶行、恶习和种种不道德的事！
        - id: ch05-b11
          speaker: narrator
          text: 斯托基心想，金很快就会冲出掩护，到时他们便能扑上去咬住他。果然，金被自己的词句越推越远。他称这种男孩满身疮痂，是道德上的麻风病人，是搬弄是非者、骗子和懒汉，最后终于说，他们还是刚刚起步的酒鬼。
        - id: ch05-b12
          speaker: mcturk
          text: 先生，我向校长申诉。
        - id: ch05-b13
          speaker: beetle
          text: 先生，我向校长申诉。
        - id: ch05-b14
          speaker: stalky
          text: 先生，我向校长申诉。
        - id: ch05-b15
          speaker: narrator
          text: 三句话一模一样，先后落下，立刻切断了金那串冒着白沫的辱骂。向校长申诉是他们无可争辩的权利。所谓刚刚起步的酒鬼，已经不只是一般的无礼或越界。酗酒的惩罚是先公开鞭打，然后开除出校。既然老师已经当面提出这项指控，案子便只归校长，也只能由校长审理。金这时才发现，自己方才不是在蓄势收尾，而是一脚踏进了他们等候已久的圈套。
        - id: ch05-b16
          speaker: king
          text: 既然上告凯撒，那就去凯撒那里。不过，我的年轻朋友，你们若肯接受我们的裁决，会明智得多。
        - id: ch05-b17
          speaker: mcturk
          text: 在见校长以前，我们还可以跟学校里其他人交往吗，先生？
        - id: ch05-b18
          speaker: narrator
          text: 他只问自己的舍监，不理金。局势立刻被抬到最高处。道德麻风病人必须隔离，而校长通常会冷静二十四小时再作判决，这也意味着他们不用做功课。
        - id: ch05-b19
          speaker: king
          text: 如果你们坚持这种蔑视权威的态度，那便没有别的办法了。
        - id: ch05-b20
          speaker: narrator
          text: 十分钟后，消息已经传遍全校。人人都说，斯托基一伙这回终于栽了，而且栽在喝酒上。有人说，他们偷偷找到了另一座窝棚，从那里回来时已经烂醉如泥。又有人说，他们眼下还无可救药地醉倒在宿舍地板上，连人都认不清。传言每经过一张嘴，罪行便严重一层。几个胆大的学生偷偷摸上楼，想亲眼看看三个酒鬼，却只看见所谓罪犯精神十足地守在里面。他们刚探进脑袋，便各自挨了几靴子，被毫不客气地踢回楼下。
        - id: ch05-b21
          speaker: stalky
          text: 咱们逮住他了，把他叉在考丁峡谷的烤肉叉上！金必须把指控证明得叫人眼花缭乱才行。
        - id: ch05-b22
          speaker: beetle
          text: 我早说过，挠得太多，他就会爆。只要让他自己闹，他准会砰地炸开。
        - id: ch05-b23
          speaker: mcturk
          text: 连晚自习都免了，噢，你们这些刚起步的酒鬼。而且今晚还是三角学。看，亲爱的狐狸又来了。狐狸比乌斯，又来施刑吗？
        - id: ch05-b24
          speaker: fox
          text: 我给你们带了点吃的，年轻的先生们。我看你们一直没吃东西，便问了冈布利。他说，你们并没有被彻底断绝供应。这罐肉酱火腿是科克兰先生的吧？
        - id: ch05-b25
          speaker: stalky
          text: 狐狸比乌斯，你真够朋友。我以前还不知道你有这么多……甲虫，那个词叫什么？
        - id: ch05-b26
          speaker: beetle
          text: 慈悲心肠。谢谢您，军士。不过那是小卡特的火腿酱。
        - id: ch05-b27
          speaker: fox
          text: 上面有个C，我还以为是科克兰的。这事很严重，年轻的先生们。我不清楚，不过你们也许有些事，没有告诉金先生和普劳特先生。
        - id: ch05-b28
          speaker: stalky
          text: 有，多得很呢，狐狸比乌斯。
        - id: ch05-b29
          speaker: fox
          text: 要真是这样，校长问起时，也许可以由我安安静静替你们说明。今晚我得把指控送过去，眼下看起来，这件事很不妙。
        - id: ch05-b30
          speaker: beetle
          text: 不妙得可怕。先在体育馆里当着全校抽二十七鞭，再公开开除。“酒能使人亵慢，浓酒使人喧嚷。”
        - id: ch05-b31
          speaker: fox
          text: 这可不是玩笑。我得把指控送给校长。而且你们也许不知道，今天下午我一直在跟踪你们，因为我起了疑心。
        - id: ch05-b32
          speaker: mcturk
          text: 你看见告示牌了吗？
        - id: ch05-b33
          speaker: beetle
          text: 你脑袋上长着眼睛，别想抵赖。你看见了！
        - id: ch05-b34
          speaker: stalky
          text: 一个军士！领着养老金还满乡偷猎！可恶，真是可恶！
        - id: ch05-b35
          speaker: fox
          text: 上帝啊！你们到底躲在哪里？我早该知道，这准是个圈套。
          emotion: surprised
        - id: ch05-b36
          speaker: stalky
          text: 你还以为自己是在跟踪咱们？咱们明明白白把你领进了套。达布尼上校是咱们最要好的朋友，已经邀请咱们去那里好几个星期了。至于你的职责，你的职责就是滚出他的猎场。
        - id: ch05-b37
          speaker: beetle
          text: 你这辈子再也抬不起头了。低年级学生都会朝你起哄。想想你那叫人眼花缭乱的威望！
        - id: ch05-b38
          speaker: narrator
          text: 军士重重坐到一张床上，开始拼命思考。他参加过印度兵变，知道在危险局面里，越早得到准确情报越有价值。现在他终于明白，下午根本不是自己在跟踪三个男孩，而是三个男孩有意让他看见，再把他带到预定地点。他们自己掌握着猎场内部的交通线，知道真正的隧道，也知道怎样从他眼皮底下消失。他还得考虑明天全校知道以后，低年级学生会怎样看待他的威望。那个年纪的学生本来就难管，若知道军士被三个男孩骗进金雀花，还被当作偷猎贼赶走，以后的追查就更难办。想到这里，他收起审问的口气，很诚恳地问，这件事总不至于真被说出去吧。毕竟普劳特和金不是也在里面吗？
        - id: ch05-b39
          speaker: mcturk
          text: 他们当然在，而且格外可恶，挨的骂比你还狠。每个字咱们都听见了。说真的，你算轻易逃过一劫。换成我，我会把你关起来。也许明天可以向上校提议。
        - id: ch05-b40
          speaker: fox
          text: 可整件事都得报给校长。噢，上帝啊！
        - id: ch05-b41
          speaker: beetle
          text: 一个叫人眼花缭乱的字也不会漏。为什么不报？咱们没做错，不是偷猎贼，也没败坏无辜男孩的名誉，说他们喝醉。
        - id: ch05-b42
          speaker: fox
          text: 那话不是我说的。我只说，你们带着獾回来时举止古怪，又笑又闹。也许金先生听错了意思。
        - id: ch05-b43
          speaker: mcturk
          text: 他当然听错了。等他发现错了，准会把责任全推给你。你不了解金，咱们了解。你根本不配当军士。
        - id: ch05-b44
          speaker: fox
          text: 有你们三个道行十足的小魔鬼在，我确实不配。我中了伏击，人马枪炮全中了计。以后低年级学生也管不住了。校长还会给我一封信，叫我送给上校，确认你们有没有受邀。
        - id: ch05-b45
          speaker: stalky
          text: 那你这回最好走门房大门，别再追着那些该死的男孩。怎么样，狐狸？
        - id: ch05-b46
          speaker: mcturk
          text: 啼啦啦啦咿嘟！我得意！听我得意！咱们成了道德麻风病人，狐狸还给咱们送茶。狐狸有一颗心，也当过兵。
        - id: ch05-b47
          speaker: fox
          text: 真希望几位年轻先生当年在我连里。那我准会给你们一点好东西。
        - id: ch05-b48
          speaker: mcturk
          text: 战地军事法庭肃静！我是被告辩护人。这件事太妙，不能告诉学校里其他畜生。他们永远不会懂，只会打板球，再说“是，先生”“噢，先生”“不，先生”。
        - id: ch05-b49
          speaker: stalky
          text: 那个先不管。继续。
        - id: ch05-b50
          speaker: mcturk
          text: 好。只要狐狸别觉得自己太聪明，他就是个好小伙。
        - id: ch05-b51
          speaker: stalky
          text: 大风天气莫把猎犬带出去。放他一马，我没意见。
        - id: ch05-b52
          speaker: beetle
          text: 我也没意见。我唯一的乐趣是赫菲和金。
        - id: ch05-b53
          speaker: fox
          text: 我只是奉命办事。
        - id: ch05-b54
          speaker: mcturk
          text: 好吧，就说你执行职务时受坏同伴引诱。狐狸，训诫后释放。咱们不会说出你的事，我发誓。传出去对学校纪律太不利。
        - id: ch05-b55
          speaker: fox
          text: 照我对学校里这些小魔……年轻先生们的了解，听见这话我很高兴。不过我该怎么向校长说？
        - id: ch05-b56
          speaker: stalky
          text: 随你的便。咱们又不是罪犯。
    - id: ch06
      title: 校长的非常办法
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 晚饭后，军士照例带着当天的违纪记录去见校长。他知道自己答应不泄露男孩们替他保密的事，却也必须把金的正式指控交上去，所以一路都在想怎样把真实经过说明白。校长翻开记录，一眼看见科克兰和麦克特克一伙的名字，先看到又一次越界，接着便看到更严重的“怀疑饮酒”。他立即停下来，问这项指控是谁提出的。
        - id: ch06-b02
          speaker: fox
          text: 金先生的，校长。我抓到他们越界，至少当时看起来如此。可背后还有许多事。
        - id: ch06-b03
          speaker: headmaster
          text: 说下去。把你的说法讲来听听。
        - id: ch06-b04
          speaker: narrator
          text: 校长和军士已经共事了大约七年。他很清楚，金先生的陈述往往在极大程度上取决于金先生当时的脾气。军士此刻明显心神不宁，说话不像平时那么干脆，所以校长没有只看纸上的“越界”和“怀疑饮酒”，而是叫他把自己亲眼见到的事从头讲清楚。军士便按照先后顺序，把跟踪、猎场里的冲突和书房里的指控一件件报告出来。
        - id: ch06-b05
          speaker: fox
          text: 我原以为他们越界到了悬崖边，后来才发现并没有。他们进了达布尼上校的树林。金先生和普劳特先生也来了。结果，上校的人把我们三个当成偷猎贼，双方说了些话。那几位年轻先生不知怎么先回了学校，情绪极其愉快。后来金先生又被上校本人当成偷猎贼。上校规矩很严。
        - id: ch06-b06
          speaker: fox
          text: 接着，金先生在普劳特先生的书房里，说了些关于他们习惯的话，他们便要求直接见您。我只说他们又笑又闹，有点得意忘形。后来他们用一种诙谐的方式告诉我，是上校邀请他们进树林的。
        - id: ch06-b07
          speaker: headmaster
          text: 我明白。他们当然没把这件事告诉舍监。
        - id: ch06-b08
          speaker: fox
          text: 金先生一提到他们的习惯，他们当场就向您申诉，还要求回宿舍等候。我后来又听出来，上校误把金先生和普劳特先生当偷猎贼时说的话，他们每个字都听见了。他们把我引进圈套，自己有内部交通线。要问我的看法，这显然是一场伏击。他们如今还在宿舍里得意呢。
        - id: ch06-b09
          speaker: narrator
          text: 校长听到这里便全明白了，连最后一分一厘都看得清清楚楚。三个男孩故意让军士在山顶看见他们，又利用隐蔽通道把追踪者引进达布尼上校的土地。金和普劳特在不知道他们受邀的情况下闯进去，回来后又因恼怒作出最严重的指控。现在，猎物、猎人和设伏的路线已经全对上了。校长胡子下面的嘴微微抽动，却没有真的笑出来。
        - id: ch06-b10
          speaker: headmaster
          text: 马上叫他们来。这个案子不必等。
        - id: ch06-b11
          speaker: narrator
          text: 三个男孩很快在军士押送下走进校长房间。他们已经准备好陈述受邀的事实，也准备好控诉金的诽谤，可校长根本没叫他们开口。他看了看三张一本正经的脸，先请他们全神贯注几分钟。那语气太平静，三人一时猜不出接下来究竟是宣判无罪，还是另有一种他们没料到的处置。
        - id: ch06-b12
          speaker: headmaster
          text: 你们认识我五年，我认识你们却有二十五年。彼此都很了解。现在，我要给你们极大的赞美。军士，拿棕色那根藤条，谢谢，你不必等。
        - id: ch06-b13
          speaker: headmaster
          text: 我要处决你们，既没有诗韵，甲虫，也没有理由。我知道你们受邀进入达布尼上校的猎场，甚至不准备写信核实，因为我确信，这一次你们严格遵守了事实。我也知道你们没喝酒。麦克特克，收起那副道貌岸然的脸，不然我会担心你没听懂。
        - id: ch06-b14
          speaker: headmaster
          text: 你们的品格完美无瑕，所以我要制造一桩骇人的不公。你们的名誉受损了，是不是？当着全舍受辱了，是不是？你们还格外关心本舍荣誉，是不是？很好。现在我要揍你们。
        - id: ch06-b15
          speaker: narrator
          text: 话音一落，校长便真的动手。三个人谁也没有机会继续申辩，每人结结实实分到六鞭。这不是因为越界，也不是因为喝酒，更不是因为他们说了假话。校长正是因为知道他们无罪，才用一桩公开承认的“不公”，把设伏、申诉、两位舍监的失态以及三个男孩过分完美的胜利一并结清。
        - id: ch06-b16
          speaker: headmaster
          text: 我想，这就把整件事处理完了。
        - id: ch06-b17
          speaker: narrator
          text: 校长收起棕色藤条，把那份写着越界和饮酒嫌疑的书面指控揉过去，直接扔进废纸篓。这一下说明得很清楚，案子到这里已经结束。三个男孩不会因那项严重指控再受审，两位舍监也不能继续追究他们在猎场里的行动。
        - id: ch06-b18
          speaker: headmaster
          text: 以后若发现谁偏离常态，就永远用偏离常态的办法对付他。这条经验日后有用。对了，架子上有一堆平装书，可以借去读，只要看完放回。拿到户外也读不坏，虽说都有一股烟草味。今晚照常去晚自习。晚安。
        - id: ch06-b19
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 晚安，谢谢您，先生。
        - id: ch06-b20
          speaker: beetle
          text: 我发誓，今晚一定替校长祷告。最后两鞭只扫到衣领。下层架子上有一本《基督山伯爵》，我看见了。下次去鸟岛归我！
        - id: ch06-b21
          speaker: mcturk
          text: 真是亲爱的好人。不禁足，不罚抄，也没有讨厌的盘问，全解决了。金和普劳特进去找他干什么？
        - id: ch06-b22
          speaker: narrator
          text: 金和普劳特随后一同进了校长宅。没有人听见里面那场谈话的原话，可无论校长用了什么方式，都没能抚平两人凌乱的羽毛。他们出来时，眼尖的学生立刻发现，一个人的鼻子因为激动而红一块蓝一块，另一个则大汗淋漓。两位舍监显然都受了一场不轻的训话。这副景象落进三个男孩眼里，足够补偿校长刚才赐给他们的六鞭。
        - id: ch06-b23
          speaker: narrator
          text: 看来，两位舍监在上报时隐瞒了重要事实。他们没有交代自己闯入私人猎场、被地主逐出的经过，却让“饮酒”的暗示继续成立。这便既犯了“隐瞒真相”，又犯了“暗示虚假”。这两尊大名鼎鼎的神，平日正是他们常请出来审判男孩的，如今却落回自己头上。此外，他们还被判定性情恶毒，品格不可信，影响有害而且带有颠覆性，任由任性、骄傲和最令人无法忍受的自负占据心灵。第九点，也是最后一点，他们必须当心，而且务必非常当心。
    - id: ch07
      title: 鸟岛欢腾
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 三个男孩果然很当心，正如男孩子准备伤人时才会有的那种耐心。他们没有立刻拿上校的话去刺激两位舍监，而是熬过令人窒息的一星期，等普劳特和金从那次训斥中恢复，重新摆出王者般的气派。他们还特意等到一场舍际比赛，而且正好是自己宿舍的比赛。普劳特也要上场，已经在会所里绑好护腿，站着准备出去。金坐在窗边记分，能够清清楚楚听见外面的声音。三个男孩便在窗下的一条长凳上坐好。
        - id: ch07-b02
          speaker: stalky
          text: 我说，甲虫，谁来监督监督者？
        - id: ch07-b03
          speaker: beetle
          text: 别问我。我跟你没什么可私下谈的。长凳另一头，你爱怎么私下就怎么私下。祝你下午愉快。
        - id: ch07-b04
          speaker: narrator
          text: 麦克特克打了个哈欠。
        - id: ch07-b05
          speaker: mcturk
          text: 你们原该像基督徒一样到门房去，不该为了追那些男孩，把我的猎场踩个遍。我看舍际比赛全是胡扯。咱们去找达布尼上校，看看他又逮住偷猎贼没有。
        - id: ch07-b06
          speaker: narrator
          text: 那天下午，鸟之乐岛上一片欢腾。
