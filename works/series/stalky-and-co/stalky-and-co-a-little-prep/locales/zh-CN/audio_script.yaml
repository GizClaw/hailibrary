  chapters:
    - id: ch01
      title: 越界的雪茄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 复活节学期才开学一个月，走读生大斯泰森就染上了白喉。传染源查到城外一座农舍，校长气得重新划定界限，比从前窄了许多。他严令级长痛打每个越界的学生，还说自己也会格外关照。斯泰森被隔离在母亲家里，拉低了全校的健康平均数。早祷后，校长在体育馆提起他，简直找不出够难听的话。接着，校长给两百多位忧心的家长和监护人各写一封信，学校还是照常运转。疫情没有传开。可一天夜里，一辆双轮马车停到校长门前。第二天早晨，校长不见了，把一切都交给资深舍监金先生。他常去伦敦，学生们坚信他是去贿赂官员，好提前弄到陆军考试的试题清样。不过这一回，他离开得格外久。
        - id: ch01-b02
          speaker: stalky
          text: 那只老奸巨猾的鸟儿准是在外面惹事，被抓以后还报了假名。
        - id: ch01-b03
          speaker: beetle
          text: 他犯了什么事？
        - id: ch01-b04
          speaker: stalky
          text: 八成踢了帕维剧院的门卫。罚四十先令，不交就关一个月。可我真盼他回来。金先生整天讲鞭子、蝎子、公学精神和学问，我受够了。
        - id: ch01-b05
          speaker: mcturk
          text: 他还说我们是粗鄙又物质化的中产阶级野蛮人，只为分数读书，全校连一个学者都没有。
        - id: ch01-b06
          speaker: stalky
          text: 这么过一下午，人都病恹恹的，屋里还臭。出去抽烟吧。我有好东西，上回放假从老爹那里顺来的印度雪茄。不过这家伙比烟斗厉害，我也有点怕。咱们按议事会的规矩轮着抽，躲到猴场路那架旧耙后面去。
        - id: ch01-b07
          speaker: beetle
          text: 那里已经越界了，近来又管得要命。再说，这烟准会让我们全吐出来。闻着就是十足的威风臭死人牌。
        - id: ch01-b08
          speaker: stalky
          text: 你会吐，我可不会。火鸡，你去不去？
        - id: ch01-b09
          speaker: mcturk
          text: 去就去。
        - id: ch01-b10
          speaker: narrator
          text: 二对一，甲虫也只能戴帽出门。走廊公告牌前围着一群学生，小个子校务军士福克西的手臂上缠着宽宽的黑纱。点名表之间，钉着一张报纸剪报。
        - id: ch01-b11
          speaker: stalky
          text: 福克西布斯，你这是给谁戴孝？
        - id: ch01-b12
          speaker: foxey
          text: 他从前在我的团里。你们看公告。
        - id: ch01-b13
          speaker: narrator
          text: 斯托基读到，老邓肯在一处山口执行任务时阵亡了。他脱下帽子。报道说，邓肯以非凡的勇气重新集合部下，遗体也被抢了回来。
        - id: ch01-b14
          speaker: stalky
          text: 是肥母猪邓肯。他当然会那么干。遗体抢回来就好。福克西，有时候他们会把尸首砍碎，对吧？他算学校死掉的第几个？
        - id: ch01-b15
          speaker: foxey
          text: 惨得很。邓肯先生是第九个，也是我从前那个团的。他刚进学校时，还没有小格雷三世高。
        - id: ch01-b16
          speaker: narrator
          text: 三个男孩快步走进雨里。斯托基边踩泥水边想，中弹和战场上那一整套事，到底是什么滋味。甲虫猜事情出在印度，又问冒雨坐在树篱下挨冻呕吐究竟有什么好。斯托基叫他闭嘴，反问斯托基叔叔什么时候害过他。这位领袖当然不爱细谈从前的败绩。他们钻过滴水的树篱，落在泡透的土块间，坐上锈迹斑斑的旧铁耙。雪茄里的硝石噼啪直响，他们把拇指和食指并在一起，小心夹着雪茄，一个接一个地传。
        - id: ch01-b17
          speaker: stalky
          text: 幸亏没一人来一支，是不是？
        - id: ch01-b18
          speaker: narrator
          text: 斯托基说着直打哆嗦，牙关咬得死紧。话音才落，他就把肚里的东西全摆到大家面前。甲虫浑身冒出黏冷的汗，麦克特克也绝望地献上自己的一份，倒在冰冷的铁条上。斯托基觉得这鬼东西不对劲，还问甲虫是不是往上面滴过墨水。甲虫连回答的力气都没有。
        - id: ch01-b19
          speaker: beetle
          text: 我早就说了。斯托基，你这个蠢货！
        - id: ch01-b20
          speaker: mcturk
          text: 我吐，你吐，他吐。好，我们一块儿吐！
        - id: ch01-b21
          speaker: narrator
          text: 三个人身上软绵绵的，肚子里也空空的，只能趴在冰冷的铁耙上。铁锈给他们的大衣印出一块块红方格。被丢掉的烟蒂就在三只冻僵的鼻子底下冒着臭气。谁也没有听见一点脚步声，可校长本人忽然就站在了他们面前。那个本该在伦敦贿赂考官的人，穿着一身荒唐的旧花呢衣服，头上还戴着一顶猎鹿帽。
        - id: ch01-b22
          speaker: headmaster
          text: 很好。我早该猜到是你们。现在回学校，替我问候金先生，请他格外格外用心地抽你们一顿。每人再抄五百行，明天下午五点交。禁足一星期。现在尤其不能越界，请务必用心。
        - id: ch01-b23
          speaker: narrator
          text: 校长来的时候没有一点声音，离开时也照样轻巧。他转过身，一下翻过滴着雨水的树篱，便从三个男孩眼前消失了。等他走进那条深深的小路，树篱另一边又传来一阵女人低低的说话声。三个人这才明白，校长刚才并不是一个人在那里。
        - id: ch01-b24
          speaker: mcturk
          text: 你这个普鲁士恶棍！斯托基，全怪你犯蠢。
        - id: ch01-b25
          speaker: beetle
          text: 宰了他！可我不行，我又要吐了。金先生一定会高兴得不得了。
        - id: ch01-b26
          speaker: narrator
          text: 斯托基一句话也没说，连轻声嘀咕都没有。三个人回到学校，领受了校长命令他们领受的东西。金先生果然快活得不得了。按这三个男孩在学校的高年资历，如果没有校长的特别命令，原本还轮不到他亲自动手。幸好，他并不精通这门温柔的艺术。三人回到自修室，坐下来抄那五百行罚文。甲虫无礼地引用了本学期正在死啃的那出莎士比亚戏，感叹金先生的欲望远远超过本领。
        - id: ch01-b27
          speaker: beetle
          text: 真是欲望远远胜过本领。
        - id: ch01-b28
          speaker: stalky
          text: 说得对。校长要把咱们交给级长，那才叫永生难忘的一顿呢。
        - id: ch01-b29
          speaker: mcturk
          text: 事情糟得连架都不值得吵。斯托基，你已经被我们革出教门了。你就是头十足的蠢驴。
        - id: ch01-b30
          speaker: stalky
          text: 我哪知道校长会来？他穿成那样，在那里做什么？总有一天，我非跟他算平这笔账。
        - id: ch01-b31
          speaker: mcturk
          text: 他好好的。你撞见他和大斯泰森的母亲调情，还害咱们当着那个瘦寡妇的面领罚。现在你满意了？
        - id: ch01-b32
          speaker: beetle
          text: 你已经死了。我们把你的马刺砍掉，盾牌倒挂。一个月都不许你煮茶。
        - id: ch01-b33
          speaker: narrator
          text: 麦克特克又反复数着格外格外、一星期禁足和五百行罚抄，问斯托基怎么还好意思为这件事吵架。他招呼甲虫一起来掐死这个畜生。斯托基抓起《维吉尔》，朝他们扔了过去。
    - id: ch02
      title: 老生归来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 校长第二天回来，一句也没解释去向。他看见五百行罚文已经等着他，也看出学校在金先生摄政时松散了些。金先生总是高高在上，对着学生的头顶，绕着头顶，越过头顶，滔滔不绝地讲公学精神和古老学府的传统。他几乎什么也没做成，只让两百五十颗年轻的心强烈地痛恨起别的学校。校长回来两天后，金先生撞见仍在禁足、却永远找得出消遣的三个人在走廊玩弹珠，便说自己一点也不惊讶。这正是这种品性的人做得出的事。
        - id: ch02-b02
          speaker: beetle
          text: 可校规没说不能玩弹珠。这游戏很好玩。
        - id: ch02-b03
          speaker: narrator
          text: 甲虫膝盖上沾满白垩和灰尘，这句顶嘴又给他添了二百行罚抄。金先生还命他去找最近的级长，听候裁决和屠宰。他来到体育总级长弗林特的自修室。甲虫坏笑着问自己该怎么回话，还提醒弗林特，金先生正气得厉害。
        - id: ch02-b04
          speaker: beetle
          text: 金先生叫我来，因为我在走廊玩弹珠，还喊了两句玩法。
        - id: ch02-b05
          speaker: flint
          text: 这跟我有什么关系？校长若贴出禁止弹珠的告示，我才能管。光凭舍监报告，我不能动手。金先生也清楚。
        - id: ch02-b06
          speaker: narrator
          text: 甲虫把这道神谕原原本本、一点糖也不加地带回去。金先生立刻去找弗林特理论。弗林特在学校已经待了七年半，中间还去过伦敦的补习班。他在那里想家，又回到校长身边，等着陆军考试前最后的打磨。还有四五个高年级生走过差不多的路，另外也有人因为气势压人，在别处待不下去，经校长整治后才变得像样。这个毕业班可不能空手摆弄，金先生很快就懂了。他责问弗林特，是不是故意纵容人在窗下玩公立小学的游戏，然后着实说了一大堆。弗林特礼貌地听完，只说按学校惯例，没有校长的直接命令，级长不能处理全校的事。接着双方又说了许多，火气也一点点冒了上来。
        - id: ch02-b07
          speaker: flint
          text: 他这一星期都在自找麻烦，现在总算找到了。要不是他不停训人，甲虫根本不会想到玩弹珠。
        - id: ch02-b08
          speaker: perowne
          text: 这我们都知道。可他骂级长的话，足够咱们好好闹一场。他说咱们是补习班退货，是管教不良的半大小子。
        - id: ch02-b09
          speaker: flint
          text: 别胡扯。金先生是咱们最好的古典文科教员。他忙着补课和陆军考试，拿一场争吵去烦校长也不公平。我还告诉金先生，咱们根本不是什么公学，只是一家分红百分之四的有限公司。我父亲还是股东呢。
        - id: ch02-b10
          speaker: wenner
          text: 这跟我们有什么关系？
        - id: ch02-b11
          speaker: flint
          text: 关系就是，咱们闹起来等于妨碍自己。董事会雇金先生来教我们，咱们不是考进陆军，就是滚蛋。其他那些话都是空的。这下明白了吗？
        - id: ch02-b12
          speaker: narrator
          text: 也许校长闻到了空气里快要打雷的味道。晚饭后，他叼着雪茄，照礼节敲过门，若有所思地走进弗林特的自修室。他常在级长房里消磨晚间刚开始的一段时光，所以没人起疑。他扬起一边眉毛，问是不是在开级长会议。大家说只是随便聊聊，请他坐安乐椅。校长陷进那张半躺椅，默默抽了一阵，这才承认，自己就是那个拿着弓弦的哑巴。所有年轻的脸立刻严肃起来。这句话表示，他们中有人要退出所有比赛，参加额外补课。日后也许能因此考进桑赫斯特，眼下却会毁掉校橄榄球队的第一十五人。
        - id: ch02-b13
          speaker: headmaster
          text: 既然你们都在，我就来割下自己的一磅肉吧。埃克塞特比赛之前，我就应该把你们从球队里抽出来。不过，打败埃克塞特是我们的神圣职责。但愿老生们没有保持训练。现在念名单。先是弗林特，你的问题出在欧几里得几何，得跟我练演绎题。佩罗恩，你要加练机械制图。道森去找金先生补拉丁文，文纳跟我补德文。怎么样，第一十五人被我毁得厉害吗？
        - id: ch02-b14
          speaker: flint
          text: 恐怕全毁了。不能等学期结束吗，先生？
        - id: ch02-b15
          speaker: headmaster
          text: 不能。今年的桑赫斯特考试会很勉强。
        - id: ch02-b16
          speaker: dawson
          text: 最后还不是给那些阿富汗人砍碎。竞争怎么会这么厉害？
        - id: ch02-b17
          speaker: headmaster
          text: 这倒提醒我了。克兰德尔要随老生队回来。抢回邓肯遗体时，他伤得不轻。
        - id: ch02-b18
          speaker: narrator
          text: 佩罗恩问的是不是当炮兵的大克兰德尔。校长说不是，是土著步兵团里那个小克兰德尔，他差不多在佩罗恩入校前就离开了。报纸上只写了肥母猪邓肯，没说克兰德尔做了什么。校长便拿出克兰德尔母亲从印度寄来的报纸，问大家想不想听。他很会朗读，把那四分之一栏密密麻麻的报道念完后，所有人都客气地道了谢。佩罗恩说，克兰德尔真给老学校长了脸，可惜没能救下肥母猪。校长又提起，五年前也在这个学期，他把邓肯从所有比赛中撤下来补课。临走前，他问弗林特打算把体育总管交给谁，却拒绝替他挑下一任。
        - id: ch02-b19
          speaker: headmaster
          text: 我听人背后说，普鲁士人贝茨是只老奸巨猾的鸟儿。他才不替新体育总级长负责。你们自己商量。晚安。
        - id: ch02-b20
          speaker: flint
          text: 就是这样一个人，你们还想拿女校式的小争吵去烦他。现在第一十五人散了，咱们得从第二十五人里找人，把大队逼着认真打。
        - id: ch02-b21
          speaker: narrator
          text: 弗林特这番道理被十分急迫地传遍全校。第一十五人已经被校长拆得七零八落，他们必须把碎片捡起来，否则老生队根本不用打就会获胜。所以第二十五人全被提上来，整个大队也被逼着认真比赛。弗林特相信，学校里一定还藏着一大堆人才，赶在比赛前还能把他们磨出来。就连平常故意装作瞧不起橄榄球的斯托基和麦克特克，也在一场大队赛里认真打了一回。他们的热情还没来得及冷下来，便立刻被升进正选。队帽带来的尊严，又逼着他们多少保持一点好品行。比赛队每星期至少苦练四天，全校终于看见了希望。
        - id: ch02-b22
          speaker: narrator
          text: 学期最后一周，老生们陆续回来。学校欢迎他们的热度，恰好跟每个人的分量相配。离校一年、却已经摆足架子的桑赫斯特和伍尔维奇军校学员，只从旧同学那里得到一句轻松的问候。民兵少尉稍微受人尊重，但大家知道他们还不算十足的真金。陆军考试落榜后去经商或进银行的叛徒，看在旧情上也有人接待，却绝不会得到过分奉承。可那些真正走过世界、已经长成军官和绅士的少尉，陪校长悠然走来时，学生们就敬慕得一声不响，自动向两边让开。要是其中有人抓住弗林特，笑他从讨厌的小跟班长成了这副样子，这位体育总级长身上便立刻像罩上一圈光。
        - id: ch02-b23
          speaker: narrator
          text: 老生们会跟红脸的小个子福克西在走廊里走来走去，谈老部队的消息。他们会闯进教室，深深闻一口记忆里的墨水和石灰味，再找到低年级的侄子或表弟，塞给他们一大笔零花钱。他们还会闯入体育馆，叫福克西把新来的学生拉上器械展示。不过，他们主要还是来找校长。校长是所有老生的听罪神父兼总代理人。有人在普利茅斯惹上了糕点铺的女儿，有人得到一小笔遗产却信不过律师，有人站在前程的岔路口，也有人被放债人追赶，或被卷进团里的争斗。他们都把麻烦带给校长。校长会用绝不该让小男孩听见的话，告诉他们怎么绕过去，怎么走出来，或怎么从麻烦底下钻过去。于是他们挤满校长住宅，抽他的雪茄，喝酒祝他健康。
        - id: ch02-b24
          speaker: headmaster
          text: 烟别停。你们越缺训练，对我们越有利。我已经用补课毁掉第一十五人了。
        - id: ch02-b25
          speaker: sapper
          text: 可我们也是临时凑的。克兰德尔即使能上，还得要个替补。
        - id: ch02-b26
          speaker: headmaster
          text: 他来信说能上，明早就到。我恐怕得让他行使老生权利，回从前的宿舍睡一晚。
        - id: ch02-b27
          speaker: gunner
          text: 贝茨老爷，您袖子里藏着什么？快招吧，我认得您眼里那道光。
        - id: ch02-b28
          speaker: purvis
          text: 还看不出吗？让克兰德尔住回宿舍，是给学生摆一个活榜样，好发挥道德影响。对不对，校长老爷？
        - id: ch02-b29
          speaker: headmaster
          text: 正是。珀维斯，你知道得太多了。七九年我就为这个抽过你。
        - id: ch02-b30
          speaker: purvis
          text: 是的，先生。我私下觉得，您还在藤条上抹过白垩。
        - id: ch02-b31
          speaker: headmaster
          text: 没有。不过我眼力很准，可能让你误会了。
        - id: ch02-b32
          speaker: narrator
          text: 校长说自己没有往藤条上抹白垩，不过他的眼力一向很准，所以也许才让珀维斯有了那种误会。这句话顿时打开了新一轮回忆的闸门。吸烟室里的每个人都开始抢着讲起从前的学校旧事。
    - id: ch03
      title: 比赛与秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比赛当天早晨，从前的小克兰德尔，如今已是普通印度部队的克兰德尔中尉，从埃克塞特赶来了。级长们早就把校长在弗林特房里念过的报道传遍全校，所以他沿学校正面一路走过去，一路都有欢呼迎着他。普劳特一舍得知他要行使老生的权利，回旧宿舍住一夜，甲虫便冲进隔壁金先生的一舍，在敌人的大教室里来回表演了一场眼馋死你们，最后迎着飞舞的墨水瓶撤退了。
        - id: ch03-b02
          speaker: stalky
          text: 理那些废物干什么？克兰德尔换衣服时，我帮他拉球衣，还给他系鞋带。他两条胳膊紫得吓人。今晚他会讲受伤的事。
        - id: ch03-b03
          speaker: beetle
          text: 你脸皮可真厚。
        - id: ch03-b04
          speaker: stalky
          text: 我没想就问了，他也没生气。他真了不起。今天我一定拼命打。快去告诉火鸡。
        - id: ch03-b05
          speaker: narrator
          text: 那是旧时代的橄榄球。争球队形挤得又紧又久，踢小腿是直接又有效的办法，全校都围在争球队形外面，一起大喊低下头，使劲推。越接近终场，大家就越顾不上体面。站得太靠近边线的走读生母亲，还听到了收费说明上绝不会写的话。没有人真的被抬下场，可终场哨一响，两队都觉得好受多了。甲虫替斯托基和麦克特克披上大衣。这两个替补在无数条腿纠缠的深处碰上，照斯托基的话说，已经彼此好好成全了一番。他们像两块木头似的昂然跟在两队后面。替补可不能跟那些浑身是毛的大汉平起平坐。
        - id: ch03-b06
          speaker: stettson
          text: 打得好！真漂亮！
        - id: ch03-b07
          speaker: narrator
          text: 他们走过墙边一辆小马车时，车里忽然传来一个沙哑的声音，大声称赞他们打得好。原来坐在车里的是大斯泰森。他的两颊雪白，眼窝深陷，人显得又瘦又虚弱。没耐性的车夫不想在这里停，可斯泰森偏要赶来看这场比赛。斯托基立刻停下脚步，问现在走近他还会不会有危险。斯泰森说自己已经好了。先前大家不许他出门，可这场比赛他非来不可。他还注意到斯托基的嘴肿得很漂亮。
        - id: ch03-b08
          speaker: stalky
          text: 斯泰森，现在靠近你安全了吗？
        - id: ch03-b09
          speaker: stettson
          text: 安全了，我已经好啦。他们先前不让我出门，可这场比赛我非来不可。你的嘴肿得真漂亮。
        - id: ch03-b10
          speaker: stalky
          text: 火鸡踩了一脚。你康复就好，因为我们还欠你一笔账。你和你那些黏膜把我们害惨了。
        - id: ch03-b11
          speaker: stettson
          text: 我听说了。校长告诉我的。
        - id: ch03-b12
          speaker: stalky
          text: 校长？什么时候？
        - id: ch03-b13
          speaker: stettson
          text: 我生病的时候，校长一直住在我家。你们先回学校吧，站在这里闲扯，我的小腿要僵了。我那时候神志不清，家里人说我一直喊他，所以他就来了。有一天夜里，我的喉咙全堵住了。医生说我眼看就要死，他们往我喉咙里插了一根管子还是什么东西，然后校长把里面堵着的东西吸了出来。医生说，校长这么做，本来应该也染上白喉。所以他一直留在我家，没有回学校。医生还说，要是再晚二十分钟，我就死了。
        - id: ch03-b14
          speaker: beetle
          text: 我的帽子！这可真够英雄的。
        - id: ch03-b15
          speaker: mcturk
          text: 够英雄？该把你吊死！
        - id: ch03-b16
          speaker: stalky
          text: 校长该得维多利亚十字勋章。想想看，他现在原本可能已经死了，连葬礼都办完了。可他偏偏没死，也没有染上白喉。他还壮得像一只老乌鸫，一闪身就从树篱上钻了过去。还跟我们说格外格外。五百行罚抄，禁足一星期，一切太平！
        - id: ch03-b17
          speaker: beetle
          text: 我在书里读过类似的事。乖乖，真是个人物。你们想想！
        - id: ch03-b18
          speaker: mcturk
          text: 我正在想！
        - id: ch03-b19
          speaker: narrator
          text: 麦克特克说自己正在想。紧接着，他爆发出一声狂野的爱尔兰呼号，叫整支球队都回过头来看。斯托基急得直跳，叫他赶快闭上大嘴。他要大家把事情全都交给斯托基叔叔，他会把校长放在烤面包上端上来。他还警告甲虫，在自己允许前，要是敢吐露一个字，就宰了他。他觉得自己已经抓到校长最短的那根头发，把这位老奸巨猾的鸟儿死死攥在手里了。现在，大家只要装作什么也没发生。
        - id: ch03-b20
          speaker: stalky
          text: 闭上你的大嘴！这事交给斯托基叔叔。甲虫，我没准许以前，你敢说一个字，我就宰了你。我们抓到他最短的头发，把他攥死了。现在装作什么也没发生。
        - id: ch03-b21
          speaker: narrator
          text: 根本不需要装。全校正忙着为平局欢呼。球员洗澡时，学生们顾不上脚上还穿着泥靴，把洗手间周围挤得水泄不通。每次看见小克兰德尔，他们就再欢呼一次。早祷后，声音更厉害了。老生们穿着晚礼服，公然捻着胡子，也来参加。他们不跟教师站在一起，却沿级长前面的墙排成一列。校长点名时，还按他们当年在校的称呼，分大、小、三世，一个个叫到。
        - id: ch03-b22
          speaker: headmaster
          text: 这一切都很好，可男孩们有些失控，迟早会惹麻烦。克兰德尔，你最好早点睡。宿舍里的孩子在等你。你以后不论爬到多高，也不会再得到今晚这样绝对的崇拜。
        - id: ch03-b23
          speaker: crandall
          text: 崇拜见鬼去吧。我还想抽完雪茄，先生。
        - id: ch03-b24
          speaker: headmaster
          text: 全是纯金。到荣耀等着你的地方去吧，小克兰德尔。
    - id: ch04
      title: 黑暗里的故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这场封圣礼的场地，是一间摆着十张床的阁楼宿舍。它通过没有门的入口，跟另外三间宿舍相通。煤气灯在没有油漆的松木盥洗架上方摇晃。穿堂风不停地尖啸，光秃秃的窗外，大海一下下拍打着佩布尔里奇。克兰德尔打着哈欠，又摸了摸自己伤痕累累的小腿。他觉得旧床还是那张旧床，恐怕连床垫都没换过。
        - id: ch04-b02
          speaker: crandall
          text: 还是那张旧床，床垫恐怕也是旧的。一切都没变。啊，我真瘸了！没想到你们打得这么狠。每个人都给我们留了点纪念。
        - id: ch04-b03
          speaker: narrator
          text: 几分钟后，孩子们不再拘束。克兰德尔转身祈祷。他已有几年没做这仪式，不知为什么，大家反倒更自在了。
        - id: ch04-b04
          speaker: crandall
          text: 对不起，我忘了关煤气灯。
        - id: ch04-b05
          speaker: dorm_captain
          text: 您别动，沃辛顿会关。
        - id: ch04-b06
          speaker: narrator
          text: 十二岁的沃辛顿早等着显本领。他从床上跃到灯架旁，又踩着盥洗架跳了回来。
        - id: ch04-b07
          speaker: crandall
          text: 他睡着的时候，你们怎么办？
        - id: ch04-b08
          speaker: dorm_captain
          text: 往他领口里塞一根冰凉的高尔夫球杆。
        - id: ch04-b09
          speaker: crandall
          text: 我当小辈时，他们塞的是湿海绵。咦，怎么回事？
        - id: ch04-b10
          speaker: narrator
          text: 黑暗里忽然挤满了耳语。有毯子拖过地板，有赤脚踩在木板上，抗议、窃笑和威胁从三间相通的宿舍一起涌进来。有人压低嗓子叫蠢货安静，有人说那就坐地上，有人发誓绝不准别人坐自己的床，还有人在黑里提醒大家当心漱口杯。宿舍级长终于开口，开头差点说出斯托基的名字，又赶快改口说是科克兰的主意。那语气表明，他很清楚斯托基有多放肆。
        - id: ch04-b11
          speaker: dorm_captain
          text: 科克兰说，也许您愿意讲讲抢回邓肯遗体的事。
        - id: ch04-b12
          speakers: [stalky, beetle, mcturk, junior_boy]
          ensemble: chorus
          text: 讲吧，讲给我们听！
        - id: ch04-b13
          speaker: crandall
          text: 没什么可讲的。你们这些家伙，大冷天跑到外面干什么？
        - id: ch04-b14
          speaker: junior_boy
          text: 别管我们。讲肥母猪吧。
        - id: ch04-b15
          speaker: narrator
          text: 克兰德尔侧过身，对着看不见的一代学生讲了起来。
        - id: ch04-b16
          speaker: crandall
          text: 大约三个月前，邓肯负责押送一车军饷，要去卡拉巴格附近一个叫皮尔森堡的地方。那辆车上全是要发给部队的卢比，总共五千银卢比。阿弗里迪人听说军饷正在路上，便在离堡垒两英里的地方伏击了整队人。他们打散护卫，邓肯也受了伤。护卫总共还不到二十名印度兵，阿弗里迪人却多得数不清。我当时碰巧负责守皮尔森堡。我听见枪声，正准备带人出去看看，邓肯那些逃回来的部下就赶到了。于是我们一起折回去。
        - id: ch04-b17
          speaker: junior_boy
          text: 我就在皮尔森堡出生！那地方用我叔叔的名字命名。
        - id: ch04-b18
          speaker: dorm_captain
          text: 你和你叔叔都闭嘴。克兰德尔，别理他。
        - id: ch04-b19
          speaker: crandall
          text: 好，不理他。那些逃回来的兵提过有一名军官，可我一直弄不清究竟发生了什么。直到我看见空地上那辆车的轮子底下躺着一个人。他用一只胳膊撑起身子，还在拿左轮手枪不停开火。那些护卫丢下了车，可阿弗里迪人天生多疑。他们以为撤退是个圈套，是故意引他们追赶，而那辆军饷车就是诱饵。所以他们暂时把邓肯一个人留在那里，没有扑上去。可等他们看清我们人少，平地上就成了一场赛跑，看谁先赶到邓肯身边。我们跑，他们也跑。最后我们赢了。我们冲到车边，近身打了一阵，他们才退走。
        - id: ch04-b20
          speaker: crandall
          text: 我一直冲到他面前，才知道这个人跟我来自同一所学校。军队里叫邓肯的人太多了，光听名字，我当然想不起他是谁。可看到脸就认出来了。他几乎一点也没变。可怜的老家伙，子弹从肺里穿过去，他渴得厉害。我给他喝了水，然后坐在他身边。说来真奇怪，他忽然看着我，喊了一声太妃糖。我就叫他肥母猪，还说但愿他没有受伤。我记得大概就是这么一句。可过了一两分钟，他就死了。他的头始终枕在我膝上，一直没有再抬起来。好了，外面那些家伙快要冻死了，叫他们回床上去吧。
        - id: ch04-b21
          speaker: dorm_captain
          text: 马上就回。可您的伤是怎么来的？
        - id: ch04-b22
          speaker: crandall
          text: 我们把遗体运回堡垒时，他们又来进攻，所以又打了一小仗。
        - id: ch04-b23
          speaker: junior_boy
          text: 您杀人了吗？
        - id: ch04-b24
          speaker: crandall
          text: 杀了吧，多半杀了。晚安。
        - id: ch04-b25
          speakers: [stalky, beetle, mcturk, junior_boy]
          ensemble: chorus
          text: 晚安。谢谢您，克兰德尔。太谢谢您了。
        - id: ch04-b26
          speaker: narrator
          text: 看不见的人群退走，本宿舍也安静下来。过了一会儿，斯托基用一种从未有过的敬重语气开了口。
        - id: ch04-b27
          speaker: stalky
          text: 克兰德尔，假如一个男孩得白喉快死了，喉咙堵得严严实实。医生插进一根管子，另一个人把里面的东西吸出来。您怎么看？
        - id: ch04-b28
          speaker: crandall
          text: 我只听说过一例。那个人是医生，他救的是个女人。
        - id: ch04-b29
          speaker: stalky
          text: 这个不是女人，只是个男孩。
        - id: ch04-b30
          speaker: crandall
          text: 那就更了不起了。这几乎是一个人能做的最勇敢的事。怎么了？
        - id: ch04-b31
          speaker: stalky
          text: 没什么，我只是听说有人做过。那个人算勇士吗？换成您，会怕吗？
        - id: ch04-b32
          speaker: crandall
          text: 他当然是勇士。我也当然会怕。谁都会怕，明知道自己可能死于白喉啊。
        - id: ch04-b33
          speaker: narrator
          text: 斯托基听完这个回答，刚要开口。可他那句话忽然在中间断掉，只剩下一声闷哼。原来甲虫差点当场开口，把他们拼命保守的那个秘密引爆。斯托基立刻跳下床，麦克特克也跟了上去。两个人一起坐到甲虫头上，赶在他把话说出来之前，把那颗地雷死死压住了。
    - id: ch05
      title: 一点儿晚自习
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天是学期最后一天。这一天只安排了几场无关紧要的考试，却以愤怒和战争开了头。金先生发现，自己宿舍里几乎所有学生都打开了宿舍之间的门，跑去听克兰德尔讲故事。金先生的一舍在那排长长的校舍里，跟普劳特一舍中间只隔着一栋。他便吵吵嚷嚷、满肚子委屈地去向校长申诉。他一向不赞成让那些所谓见过世面的青年，来污染少年的道德。校长说很好，他会处理。
        - id: ch05-b02
          speaker: crandall
          text: 真对不起。我想自己没讲什么不该听的。别让他们因为我惹麻烦。
        - id: ch05-b03
          speaker: headmaster
          text: 别担心，惹麻烦的是教师，不是男孩。不过普劳特和金先生都不赞成这样大规模的宿舍集会，舍监总得得到支持。何况学期已经这么晚了，只罚两个宿舍根本不会有什么效果。我们得公平，把每个人都算进去。让我想想。复活节假期里，他们人人都有假期作业，当然，谁也不会看一眼。那就今晚让全校上一场正式晚自习。级长和自修室学生除外，其他人全都参加。教员休息室也得派一位教师去看管。我们必须一视同仁。
        - id: ch05-b04
          speaker: crandall
          text: 学期最后一晚上晚自习？我猜准有好戏。
        - id: ch05-b05
          speaker: narrator
          text: 消息传开时，学校里有人正在打包的箱子间嬉闹，有人沿走廊大喊大叫，还有人在教室里幸灾乐祸。一听到晚自习，人人都又惊又怒。天下没有哪所学校会在学期最后一晚上晚自习。这件事荒谬又暴虐，在他们看来，等于同时推翻了法律、宗教和道德。他们当然会走进教室，也会带上那些可耻的假期作业。不过说到这里，大家都笑了起来。他们开始纷纷猜测，教员休息室究竟会派哪个人来对付他们。
        - id: ch05-b06
          speaker: narrator
          text: 教师们抽了签，结果抽中梅森先生。他轻信，热心，又深爱青少年。别的教师都不愿管这场晚自习，因为这所学校缺少那种靠传统压住一切的稳定力量。习惯了古老学府的人，偶尔会觉得这里实在桀骜难驯。四间长教室里，坐满了所有级别低于自修室学生的男孩。他们用雷鸣般的掌声欢迎梅森。梅森才咳了两声，大家就用押韵的歪诗，向他概述大不列颠婚姻法。那是照以色列大祭司的记载，再由万军首领加上评注的版本。低年级生还提醒他，这是最后一天，所以他必须凡事当玩笑。
        - id: ch05-b07
          speaker: narrator
          text: 梅森冲过去斥责他们。低四班和高三班马上异口同声地呕吐起来，又响亮又逼真。梅森先生竟然做起了天底下最徒劳的事，跟他们讲道理。后排有个大胆的灵魂叫他发言不先举手，所以该罚抄五十行。梅森一向自负英语完美，这句话真的刺伤了他。他正想办法找出那个罪犯，隔了三间教室的高二班和低二班又熄掉煤气灯，开始抛墨水瓶。这真是一场愉快又提神的晚自习。自修室学生和级长在远处听着一阵阵回声，教员休息室里那些正吃甜点的人也笑了。
        - id: ch05-b08
          speaker: stalky
          text: 八点半了。再闹下去，校长就会上来。先通知各自修室，再通知宿舍。快！
        - id: ch05-b09
          speaker: narrator
          text: 斯托基根本不让甲虫发挥他的戏剧才能，也不给麦克特克拖长腔调的机会。三个人冲进一间又一间自修室，把消息用最短的话讲完，看出对方听明白了，便半句评论都不等，立刻冲去下一间。那场邪门的晚自习还在越闹越凶，声音一阵高过一阵。他们赶到弗林特门口时，恰好撞见梅森朝走廊飞奔而来。
        - id: ch05-b10
          speaker: stalky
          text: 他去叫校长了。快走！
        - id: ch05-b11
          speaker: narrator
          text: 斯托基看出梅森是去叫校长，立刻催着两个伙伴快走。三人并排冲进十二号教室，跑得气喘吁吁。斯托基顾不上先把气喘匀，一连用尽力气大喊三声校长。这三声呼喊竟让满教室的骚乱停了一瞬。趁着这一点寂静，斯托基一跃跳上课桌，站在全班面前。
        - id: ch05-b12
          speaker: stalky
          text: 我们以为校长在伦敦，其实大斯泰森得白喉时，他把堵在那家伙喉咙里的东西吸了出来。别闹了，你们这些蠢驴！没有校长，斯泰森早死了，校长自己也可能送命。克兰德尔说，这是活人能做的最勇敢的事。校长还不知道我们已经知道！
        - id: ch05-b13
          speaker: narrator
          text: 斯托基说到最后，嗓音忽然破了。麦克特克和甲虫从一张课桌跳到另一张，一遍又一遍地重复这个消息，直到它牢牢打进每一个低年级学生心里。刚才还排山倒海的骚乱停了下来。随后，校长走进教室，梅森跟在他身后。照一向的规矩，校长目光所到之处，没有学生敢说话，也没有学生敢动弹。他等着那片充满敬畏的寂静降临。可这一次，迎接他的却是欢呼。那声音稳定，持续不断，没有一点要停的意思。校长是个聪明人。他什么也没说，只转过身走了。各班这才安静下来，也开始觉得有一点害怕。
        - id: ch05-b14
          speaker: stalky
          text: 没事，他不能把你们怎么样。又不像老卡尔顿那次，咱们把课桌全掀了。继续！听，自修室也在欢呼！
        - id: ch05-b15
          speaker: narrator
          text: 斯托基发出一声大叫，像火箭一样冲出去，发现弗林特和级长们也快要把走廊屋顶掀翻了。一家分红百分之四的有限公司，它的校长正沿着平日庄严如圣徒的早祷路线往前走。四间等候处罚的教室一起向他欢呼，连他最信任的级长也在欢呼。这时候，他既可以追问缘故，也可以维持尊严继续向前。他选了后一种。资深舍监金先生像只激动的猫一样瞪着眼，向脸色苍白、浑身发抖的数学教师指出，某些办法，谢天谢地不是他的办法，通常会引起某些结果。老生们十分体贴，没去参加那次点名。全校学生在体育馆里列好队，校长这才冷冰冰地开了口。
        - id: ch05-b16
          speaker: headmaster
          text: 我很少弄不懂你们，可今晚确实不明白。你们在晚自习做完那番蠢事，居然还认为我值得欢呼。现在我来证明，你们错了。
        - id: ch05-b17
          speakers: [stalky, beetle, mcturk, flint]
          ensemble: chorus
          text: 好！好！好！
        - id: ch05-b18
          speaker: headmaster
          text: 够了。你们什么奖励也得不到。小男孩们假期里每人替我抄三百行。他们不喜欢小男孩这个称呼，不过我不再理会他们。高年级每人抄一千行，返校当天晚上交给我。此外，为了你们对梅森先生做的那些事，明天发路费的时候，我要把高年级全体抽一遍。这当然也包括我上楼时亲眼看见的那三个自修室学生。当时他们正在教室课桌上跳舞。级长在点名以后留下。
        - id: ch05-b19
          speaker: stalky
          text: 乖乖，多贪吃的人！
        - id: ch05-b20
          speaker: narrator
          text: 全校学生这回一声不响，沉默地离开体育馆。不过没有人真的走远。大家全都聚在门外，挤成一团，屏住气等着看校长会怎么处置留下的级长，也等着看这场突如其来的欢呼最后会有什么结果。
        - id: ch05-b21
          speaker: headmaster
          text: 弗林特，请解释一下你的行为。
        - id: ch05-b22
          speaker: flint
          text: 先生，您冒着生命危险，救了一个快死于白喉的人。学校知道以后，您还能指望大家怎样呢？
        - id: ch05-b23
          speaker: headmaster
          text: 好，我明白了。那么，刚才那些声音并不是为了向我放肆。这件事的性质变了。我可以默许不道德，却不能容忍无礼。不过你们要记住，这并不能替那些学生对梅森先生的冒犯开脱。假期里的罚抄这次可以免掉，但明早的鞭子仍然照旧。
        - id: ch05-b24
          speaker: narrator
          text: 消息一公布，全校都沉浸在惊奇和敬仰之中，看着校长一路走回住宅。这个人才真值得敬畏。他很少动藤条，可只要动手，便极其科学。要处置一百个男孩，那一定会变成一部史诗，而且是一部宏伟极了的史诗。校长回到吸烟室，哼了一声，脱下长袍。克兰德尔这才告诉他，大家已经知道那件事了。
        - id: ch05-b25
          speaker: crandall
          text: 没事了，校长老爷。我们现在都知道了。刚才我从我们队里那个替补口中听说的。昨晚在宿舍里，他问我，要是有人把白喉病人喉咙里的东西吸出来，这种行为该怎么看。我当时根本不知道他说的是您。那个狡猾的小畜生，满脸雀斑，还有那双眼睛。他好像叫科克兰。
        - id: ch05-b26
          speaker: headmaster
          text: 多谢，我认识他。就算我没看见那三个，也会把他们算进去。
        - id: ch05-b27
          speaker: sapper
          text: 要不是老学校今天已经闹得太欢，有点得意忘形，我们准会亲手把您抬过整条走廊。贝茨，您到底怎么能去冒这样的险？您明明知道自己也可能染上白喉。要是您真的病了，或者丢了命，那我们这些人该怎么办？
        - id: ch05-b28
          speaker: squadron_leader
          text: 我一直知道，您一个人抵得上我们二十个。现在更确信了。
        - id: ch05-b29
          speaker: gunner
          text: 可他不配管学校。答应以后别再这样，贝茨老爷。您要冒这种险，我们走也走得不安心。
        - id: ch05-b30
          speaker: crandall
          text: 贝茨老爷，您不会真把高年级全抽一遍吧？
        - id: ch05-b31
          speaker: headmaster
          text: 我已经说过，我能默许不道德，却不能容忍无礼。就算有我支持梅森，他在学校的日子也已经够难过了。再说，高尔夫俱乐部里的人都听见他们唱那首亚伦与摩西。走读生的家长一定会跑来投诉。所以不管怎样，体面总得维持。
        - id: ch05-b32
          speakers: [sapper, squadron_leader, gunner, crandall]
          ensemble: chorus
          text: 我们来帮忙。
        - id: ch05-b33
          speaker: narrator
          text: 第二天，高年级学生一个接一个地走进去挨藤条。他们的大衣都搭在臂弯里，载他们去车站的四轮马车已经停在下面的路上，每个人的路费也摆在桌上。校长先从斯托基、麦克特克和甲虫开始，忠实地款待了他们。三个人领了路费，向校长道别，祝他假期愉快，还跟他握了手。
        - id: ch05-b34
          speaker: headmaster
          text: 这是你们的路费。再见，假期愉快。
        - id: ch05-b35
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 再见，谢谢您，先生。
        - id: ch05-b36
          speaker: narrator
          text: 他们同校长握了手。
        - id: ch05-b37
          speaker: stalky
          text: 今天早晨，欲望没怎么胜过本领。咱们吃到了奶油尖儿。等几个人出来，再真正为他欢呼。
        - id: ch05-b38
          speaker: crandall
          text: 不必为了我们等。我们现在就开始。
        - id: ch05-b39
          speaker: narrator
          text: 欢呼如果只响在走廊里，也还罢了。可声音很快就蔓延进体育馆，连那些正排着队、等候挨打的学生也跟着欢呼起来。校长试着维持秩序，最后终于绝望地放弃了。剩下还没挨打的人一拥而上，争着抢着要同他握手。等学生们登上四轮马车，所有人仍然一心一意地欢呼。车夫没有听到命令，却明白了那无声的示意，赶着马车驶出校门，拐进了诺瑟姆狭窄的街道。斯托基坐在御者座上，终于开始领着大家打拍子。
        - id: ch05-b40
          speaker: stalky
          text: 我不是说过要跟他算平吗？现在都跟斯托基叔叔打拍子！
        - id: ch05-b41
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 这是我们陆军的规矩，这是我们海军的规矩，这是我们公学的规矩，任谁也不能否认！
