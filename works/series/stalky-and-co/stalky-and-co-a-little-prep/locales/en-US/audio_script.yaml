  chapters:
    - id: ch01
      title: Out of Bounds
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Easter term was only a month old when Stettson major, a day-boy, caught diphtheria. The Head was furious. The illness had been traced to a farmhouse beyond the school limits, so he drew the bounds tighter, told the prefects to thrash anyone who crossed them, and promised to deal with offenders himself. After prayers he told the whole school exactly what he thought of Stettson for lowering its record of good health. Then he wrote two hundred letters to anxious families and ordered everyone else to carry on.
        - id: ch01-b02
          speaker: narrator
          text: The infection went no farther. But one night a dog-cart stopped at the Head's door, and by morning he was gone. Mr. King, the senior house-master, took charge. The Head often went to London, where the boys firmly believed he bribed officials for early copies of the Army examination papers. This time he stayed away much longer than usual.
        - id: ch01-b03
          speaker: stalky
          text: Crafty old bird. He's probably gone on a spree and landed in jail under a false name.
        - id: ch01-b04
          speaker: narrator
          text: Stalky offered this theory to his allies one wet afternoon in their study.
        - id: ch01-b05
          speaker: beetle
          text: What did they lock him up for?
        - id: ch01-b06
          speaker: stalky
          text: Forty shillings or a month for kicking the doorman at the Pavilion in the shins. Bates always enjoys himself in town. I wish he were back, though. I'm sick of King's punishments and his speeches about school spirit and scholarship.
        - id: ch01-b07
          speaker: mcturk
          text: He says we're the crude, material middle classes, reading only for marks, with not one scholar in the school.
        - id: ch01-b08
          speaker: narrator
          text: McTurk quoted King while thoughtfully burning holes in the mantelpiece with a hot poker.
        - id: ch01-b09
          speaker: stalky
          text: That's a miserable way to spend the afternoon, and it stinks. Let's go out for a smoke. Look what I've got.
        - id: ch01-b10
          speaker: narrator
          text: He held up a long Indian cheroot stolen from his father during the holidays. It was stronger than a pipe, so he proposed they share it, passing it around as they lay hidden behind an old harrow on the Monkey-farm Road.
        - id: ch01-b11
          speaker: beetle
          text: That's out of bounds, and the rules are horribly strict now. Besides, we'll be sick.
        - id: ch01-b12
          speaker: narrator
          text: Beetle sniffed the cigar and pronounced it a magnificent stinker.
        - id: ch01-b13
          speaker: stalky
          text: You may be sick. I won't. What do you say, Turkey?
        - id: ch01-b14
          speaker: mcturk
          text: We might as well go, I suppose.
        - id: ch01-b15
          speaker: stalky
          text: Put your cap on, then. That's two against one. Beetle, you're coming.
        - id: ch01-b16
          speaker: narrator
          text: In the corridor they found boys gathered at the notice-board with Foxy, the school sergeant. A wide black band circled Foxy's arm. Between the call-over lists someone had pinned a newspaper cutting.
        - id: ch01-b17
          speaker: stalky
          text: More rules about bounds, I expect. Hello, Foxy. Who are you mourning?
        - id: ch01-b18
          speaker: foxy
          text: He served in my old regiment.
        - id: ch01-b19
          speaker: narrator
          text: Foxy nodded at the notice. Stalky read it, took off his cap, and saw that Duncan, whom the boys had called Fat-Sow Duncan, had been killed on duty at a distant mountain pass. The report said he had rallied his men with conspicuous gallantry and that his body had been recovered.
        - id: ch01-b20
          speaker: stalky
          text: Of course he rallied them. And they got the body back. That's good. Sometimes they cut the dead to pieces, don't they, Foxy?
        - id: ch01-b21
          speaker: foxy
          text: Horribly.
        - id: ch01-b22
          speaker: stalky
          text: Poor old Fat-Sow. I was still a junior when he left. How many old boys have we lost now?
        - id: ch01-b23
          speaker: foxy
          text: Mr. Duncan makes nine. He came here when he was no bigger than little Grey tertius. He was in my old regiment too. Nine from the school so far, Mr. Corkran.
        - id: ch01-b24
          speaker: narrator
          text: The three boys hurried out into the rain.
        - id: ch01-b25
          speaker: stalky
          text: I wonder what it feels like to be shot. Where did it happen, Beetle?
        - id: ch01-b26
          speaker: beetle
          text: Somewhere in India. There's always fighting out there. But honestly, Stalky, why sit under a hedge and be sick? It's freezing, it's soaking wet, and we're certain to be caught.
        - id: ch01-b27
          speaker: stalky
          text: Oh, be quiet. Has your Uncle Stalky ever led you into trouble?
        - id: ch01-b28
          speaker: narrator
          text: Like many leaders, Stalky preferred not to remember past defeats. They squeezed through a dripping hedge, crossed a field of waterlogged earth, and settled on the rusty harrow. The cheroot sputtered as it burned. They held it carefully between finger and thumb and passed it from one to another.
        - id: ch01-b29
          speaker: stalky
          text: Lucky we didn't have one each, isn't it?
        - id: ch01-b30
          speaker: narrator
          text: He spoke through chattering teeth and immediately proved his point by being violently sick. The others followed.
        - id: ch01-b31
          speaker: beetle
          text: I warned you. Oh, Stalky, you idiot!
        - id: ch01-b32
          speaker: mcturk
          text: I am sick, you are sick, he is sick. We are all sick.
        - id: ch01-b33
          speaker: narrator
          text: McTurk made a lesson of it, then collapsed across the cold iron.
        - id: ch01-b34
          speaker: stalky
          text: Something's wrong with that filthy cigar. Beetle, did you spill ink on it?
        - id: ch01-b35
          speaker: narrator
          text: Beetle could not answer. Empty and helpless, all three lay across the harrow. Rust stamped red squares on their coats, and the abandoned cigar end smoked beneath their icy noses. They heard no approach. Suddenly the Head stood over them, though he was supposed to be in London. He wore old tweeds and a deerstalker and looked almost absurd.
        - id: ch01-b36
          speaker: head
          text: Ah. Very good. I might have known it would be you three. Go back to the College with my compliments to Mr. King. Ask him to give each of you an extra-special licking. Then you will write five hundred lines for me, finished by five tomorrow. You are gated for a week as well. This is a particularly bad moment to break bounds. Be sure to say extra-special.
        - id: ch01-b37
          speaker: narrator
          text: He slipped back over the hedge as quietly as he had arrived. From the deep lane came a murmur of women's voices.
        - id: ch01-b38
          speaker: mcturk
          text: You Prussian brute! Stalky, this is entirely your stupid fault.
          emotion: angry
        - id: ch01-b39
          speaker: beetle
          text: Kill him! Go on, kill him!
          emotion: angry
        - id: ch01-b40
          speaker: stalky
          text: I can't. I'm going to be sick again. I could bear that, but King will enjoy this horribly. Extra-special!
        - id: ch01-b41
          speaker: narrator
          text: Stalky had nothing to say, not even under his breath. They returned to school and received the punishment ordered for them. King enjoyed it thoroughly. Their seniority normally protected them from his cane unless he had special instructions, though luckily he was not skilled with it.
        - id: ch01-b42
          speaker: beetle
          text: Strange how his ambition runs so far ahead of his ability.
        - id: ch01-b43
          speaker: narrator
          text: Beetle adapted a line from the Shakespeare play they were studying. Back in their study, they began the five hundred lines.
        - id: ch01-b44
          speaker: stalky
          text: You're quite right, Beetle. If the Head had sent us to a prefect, we'd have had a punishment worth remembering.
        - id: ch01-b45
          speaker: narrator
          text: His voice had become silky and eager to please.
        - id: ch01-b46
          speaker: mcturk
          text: We're not even going to quarrel with you. This is too bad for an ordinary quarrel. But understand this, Stalky. You've been cast out. You're simply an ass.
        - id: ch01-b47
          speaker: stalky
          text: How could I know the Head would catch us? And why was he dressed like that?
        - id: ch01-b48
          speaker: beetle
          text: Don't change the subject.
        - id: ch01-b49
          speaker: stalky
          text: It was Stettson major's fault anyway. If he hadn't caught diphtheria, none of it would have happened. Still, don't you think it was odd, the Head appearing there?
        - id: ch01-b50
          speaker: beetle
          text: Be quiet. You're dead to us. We've cut off your spurs, turned your shield upside down, and you shouldn't be allowed to make tea for a month.
        - id: ch01-b51
          speaker: stalky
          text: Stop talking at me. I want to know why the Head was there.
        - id: ch01-b52
          speaker: mcturk
          text: Stop? We're gated for a week! King thrashed us, we have five hundred lines, and now we can't go out. Do you expect us to kiss you?
          emotion: angry
        - id: ch01-b53
          speaker: stalky
          text: Leave off for one minute. I mean to find out what the Head was doing.
        - id: ch01-b54
          speaker: mcturk
          text: You already found him alive and well, making love to Stettson major's mother. That was her voice in the lane. So we were ordered a licking in front of a day-boy's mother, and a skinny old widow at that. Anything more you'd like to investigate?
        - id: ch01-b55
          speaker: stalky
          text: I don't care. One day I'll pay him back for this.
        - id: ch01-b56
          speaker: mcturk
          text: You're doing splendidly so far. An extra-special licking, a week's gating, five hundred lines, and now you want to fight about it. Beetle, help me grab him!
        - id: ch01-b57
          speaker: narrator
          text: Stalky had flung his Virgil at them, and the study dissolved into battle.
    - id: ch02
      title: King and the Prefects
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Head returned the next day without explaining where he had been. Their lines were ready, and the school was slightly loose after Mr. King's rule. King had spent his time lecturing above, around, and beyond the boys about school spirit and the traditions of ancient schools. Whenever something happened, he treated it as an opportunity for another speech. His lofty words traveled over their heads. His only real achievement was to give two hundred and fifty boys a fierce dislike of every other school in England.
        - id: ch02-b02
          speaker: narrator
          text: Two days later he found Stalky and company, still gated but never short of ideas, playing marbles in the corridor. He declared that he was not surprised. Such conduct was exactly what he expected from boys with their low moral character.
        - id: ch02-b03
          speaker: beetle
          text: There isn't a rule against marbles, sir. It's a very interesting game.
        - id: ch02-b04
          speaker: narrator
          text: Chalk and dust whitened Beetle's knees. King gave him two hundred lines for insolence and ordered him to report to the nearest prefect for judgment and punishment.
        - id: ch02-b05
          speaker: beetle
          text: Flint, King sent me here because I played marbles in the corridor and shouted the proper calls.
        - id: ch02-b06
          speaker: narrator
          text: They were behind the closed door of Flint's study. Flint was Head of the Games.
        - id: ch02-b07
          speaker: flint
          text: What does he imagine I can do about that?
        - id: ch02-b08
          speaker: beetle
          text: I don't know. What shall I tell him? He's rather angry.
        - id: ch02-b09
          speaker: flint
          text: If the Head posts a rule against marbles, I can act. I can't punish the whole school because a house-master reports it. King knows that as well as I do.
        - id: ch02-b10
          speaker: narrator
          text: Beetle delivered this answer to King without softening a word. King immediately went to see Flint himself. Flint had spent seven and a half years at the College, apart from six months with a London crammer. Homesickness had brought him back for the Head's final preparation before the Army examination. Four or five other seniors had been through much the same process. There were also boys whom other schools had rejected because their personalities overwhelmed everyone around them. The Head had worked on those difficult boys until they turned into quite decent young men. This was no ordinary Sixth Form, and it could not be handled roughly or carelessly. King soon discovered that.
        - id: ch02-b11
          speaker: king
          text: Am I to understand that you mean to allow elementary-school games directly below your window, Flint? If that is your decision, I can only say this.
        - id: ch02-b12
          speaker: narrator
          text: He said a great deal more, while Flint listened with careful politeness.
        - id: ch02-b13
          speaker: flint
          text: If the Head calls a prefects' meeting, sir, we must deal with it. But the school's custom is clear. Prefects don't make rules for the whole school without a direct order from the Head.
        - id: ch02-b14
          speaker: narrator
          text: Both of them said much more, and both began to lose their tempers. After tea Flint told the story at an informal prefects' meeting in his study.
        - id: ch02-b15
          speaker: flint
          text: King has been asking for this quarrel all week, and now he has it. If he hadn't kept lecturing us, that young devil Beetle would never have thought of playing marbles.
        - id: ch02-b16
          speaker: perowne
          text: We know that, but it isn't the point. By your account, King has insulted the prefects enough to deserve a first-class row. He called us crammer failures and badly controlled overgrown boys. Prefects can't let that pass.
        - id: ch02-b17
          speaker: flint
          text: Nonsense. King is the best classical coach we have, and it isn't fair to trouble the Head with this. He's buried in extra lessons and Army work already. Besides, we aren't a public school. We're a limited company paying four percent. My father owns shares in it.
        - id: ch02-b18
          speaker: venner
          text: What has that got to do with anything?
        - id: ch02-b19
          speaker: flint
          text: We'd only be interfering with ourselves. We have to pass into the Army or leave, don't we? The Council pays King to teach us. All the rest is empty talk.
        - id: ch02-b20
          speaker: narrator
          text: Perhaps the Head sensed a storm. After dinner he carried his cheroot to Flint's study, though he visited prefects so often that no one suspected a purpose. He knocked as custom required and wandered in thoughtfully.
        - id: ch02-b21
          speaker: head
          text: A prefects' meeting?
        - id: ch02-b22
          speaker: narrator
          text: One eyebrow lifted knowingly.
        - id: ch02-b23
          speaker: flint
          text: Not exactly, sir. We're only talking. Would you like the easy chair?
        - id: ch02-b24
          speaker: head
          text: Thank you. What luxurious infants you are.
        - id: ch02-b25
          speaker: narrator
          text: He settled into Flint's broad half-couch and smoked in silence. Then he admitted that he had come as the executioner. The young faces became serious. It meant he would remove some prefects from games for extra tuition. That might bring success at Sandhurst later, but it would wreck the First Fifteen now.
        - id: ch02-b26
          speaker: head
          text: Yes, I've come for my pound of flesh. I should have taken you before the Exeter match, but of course it is our sacred duty to beat Exeter.
        - id: ch02-b27
          speaker: perowne
          text: Isn't the Old Boys' match sacred too, sir?
        - id: ch02-b28
          speaker: narrator
          text: It was the great event of Easter term.
        - id: ch02-b29
          speaker: head
          text: We must hope the Old Boys are out of training. Here is the list. Flint comes to me for Euclid deductions. Perowne needs extra mechanical drawing. Dawson goes to Mr. King for Latin, and Venner comes to me for German. Have I hurt the First Fifteen badly?
        - id: ch02-b30
          speaker: narrator
          text: He smiled sweetly.
        - id: ch02-b31
          speaker: flint
          text: You've ruined it, sir. Can't you leave us alone until term ends?
        - id: ch02-b32
          speaker: head
          text: Impossible. Sandhurst will be a very close thing this year.
        - id: ch02-b33
          speaker: dawson
          text: And after all that work, those Afghans will only cut us to pieces. You wouldn't expect so much competition for the chance.
        - id: ch02-b34
          speaker: head
          text: That reminds me. Crandall is coming with the Old Boys. I've invited twenty, though we'll still have a weak team. He may not be much use. He was badly knocked about while recovering poor Duncan's body.
        - id: ch02-b35
          speaker: perowne
          text: Crandall major, the Gunner?
        - id: ch02-b36
          speaker: head
          text: No, the younger one, Toffee Crandall. He's in a native infantry regiment. He was almost before your time.
        - id: ch02-b37
          speaker: perowne
          text: The newspapers never mentioned him. We read about Fat-Sow, of course. What did Crandall do?
        - id: ch02-b38
          speaker: head
          text: His mother sent me an Indian paper. The report describes a rather hefty piece of work, as you boys say. Shall I read it?
        - id: ch02-b39
          speaker: narrator
          text: The Head knew how to read aloud. He gave the close-packed quarter-column its proper weight, and the room listened closely to the account of Crandall's action. When it ended, everyone thanked him with the careful politeness boys used when they had been deeply impressed but did not intend to show too much feeling.
        - id: ch02-b40
          speaker: perowne
          text: Good for the old College! It's a pity he wasn't in time to save Fat-Sow. Duncan makes nine of ours in three years, doesn't he?
        - id: ch02-b41
          speaker: head
          text: Yes. And five years ago this term, I took Duncan off games for extra lessons. Flint, whom will you make Head of the Games after you?
        - id: ch02-b42
          speaker: flint
          text: I haven't decided. Who would you choose, sir?
        - id: ch02-b43
          speaker: head
          text: No, thank you. I've heard it whispered behind my back that the Prussian Bates is a crafty bird. He will not take responsibility for choosing the next Head of the Games. Decide among yourselves. Good night.
        - id: ch02-b44
          speaker: flint
          text: And that's the man you wanted to bother with a petty schoolroom quarrel.
        - id: ch02-b45
          speaker: perowne
          text: I was only teasing you, Flint. You're much too easy to provoke.
        - id: ch02-b46
          speaker: flint
          text: Never mind that. The First Fifteen is broken up. We must rebuild it or the Old Boys will walk over us. Move the Second Fifteen up and make the whole school play seriously. There must be talent somewhere, and we have until the match to polish it.
        - id: ch02-b47
          speaker: narrator
          text: The school heard the case so urgently that even Stalky and McTurk, who pretended to despise football, played one Big-Side game with real effort. They were promoted before their enthusiasm cooled. Once they had their caps, dignity required them to keep trying. The team practiced at least four days a week, and hope returned.
        - id: ch02-b48
          speaker: narrator
          text: In the final week the Old Boys arrived, and the warmth of each welcome matched his standing. Cadets from Sandhurst and Woolwich, gone only a year and full of importance, were greeted with cheerful questions about the academy. Militia officers received more respect, though everyone knew they were not quite the true metal. Men who had failed for the Army and entered banks or business were welcomed for old times without excessive fuss. Then came real officers who had traveled to the world's ends and returned without any swagger. As they walked beside the Head, the boys divided silently to let them pass.
        - id: ch02-b49
          speaker: narrator
          text: If one of those men seized Flint and cried that he had been a tiny junior only yesterday, Flint seemed to glow with a visible halo. The visitors paced the corridor with little red-coated Foxy and traded news of their old regiments. They burst into classrooms and breathed in the remembered smells of ink and whitewash. They found young cousins and nephews in the lower forms and astonished them with large gifts of money. Then they invaded the gymnasium and made Foxy put the newest boys through their exercises on the bars.
        - id: ch02-b50
          speaker: narrator
          text: Mostly they talked with the Head. In manhood they proved what they had shouted as boys. The Prussian Bates truly was a crafty bird. An officer tangled with a girl in Plymouth, another suspicious of lawyers after inheriting money, a third uncertain which road ambition should take, a spender chased by lenders, or a proud man caught in a regimental quarrel all brought their trouble to him. In language unsuitable for children, the Head found each man a quiet safe path around, beneath, or out of it. They crowded his house, smoked his cigars, and drank his health as old boys had done wherever they met across the world.
        - id: ch02-b51
          speaker: head
          text: Please keep smoking. The farther you are from match condition, the better for us. I've already weakened the First Fifteen with extra lessons.
        - id: ch02-b52
          speaker: engineer
          text: We're only a scratch side. Have you told the boys we'll need a substitute even if Crandall plays?
        - id: ch02-b53
          speaker: head
          text: He wrote that he would play, so his wounds cannot be too bad. He arrives tomorrow morning.
        - id: ch02-b54
          speaker: engineer
          text: The younger Crandall, who brought Duncan's body back? Where will he sleep? We've already taken over your whole house, Head Sahib.
        - id: ch02-b55
          speaker: narrator
          text: A squadron commander of Bengal Lancers, home on leave, asked the question.
        - id: ch02-b56
          speaker: head
          text: He will have to use his old dormitory. Old Boys may claim that privilege. Yes, little Crandall minor will sleep there once more.
        - id: ch02-b57
          speaker: gunner
          text: Bates Sahib, you're planning something. Admit it. I know that look in your eye.
        - id: ch02-b58
          speaker: narrator
          text: The Gunner dropped a heavy arm around the Head's neck.
        - id: ch02-b59
          speaker: purvis
          text: Can't you see it? Crandall goes back to the dormitory as an example for the boys. It's all for moral effect. Isn't that right, Head Sahib?
        - id: ch02-b60
          speaker: head
          text: It is. You know too much, Purvis. I caned you for that in 1879.
        - id: ch02-b61
          speaker: purvis
          text: You did, sir. I've always believed you put chalk on the cane.
        - id: ch02-b62
          speaker: head
          text: No. But my aim is very straight. Perhaps that confused you.
        - id: ch02-b63
          speaker: narrator
          text: That opened a flood of fresh memories, and everyone began telling tales from school.
    - id: ch03
      title: The Match and Stettson's Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Lieutenant R. Crandall of an ordinary Indian regiment arrived from Exeter on the morning of the match. The prefects had spread the meaning of the report the Head had read, so cheers followed Crandall all along the College front. When Prout's house learned he would spend one night in his old dormitory, Beetle rushed into King's neighboring house and performed a triumphant dance through its main classroom. Inkpots flew after him as he escaped.
        - id: ch03-b02
          speaker: stalky
          text: Why pay attention to those idiots? I spoke to Crandall upstairs while he changed. I pulled down his sweater for him. His arms are slashed all over with horrible purple scars. He's going to tell us the story tonight. I asked him while I laced his boots.
        - id: ch03-b03
          speaker: narrator
          text: Stalky wore the black jersey, white shorts, and black stockings of the Old Boys' substitute and looked magnificent.
        - id: ch03-b04
          speaker: beetle
          text: You really have no shame. I wish I'd dared to ask him.
        - id: ch03-b05
          speaker: stalky
          text: It came out before I could stop it. He wasn't angry at all. He's a splendid fellow. I'm going to play harder than I've ever played. Tell Turkey.
        - id: ch03-b06
          speaker: narrator
          text: The football belonged to a rougher age. Scrimmages stayed locked for ages, with a mass of legs and shoulders driving against one another. Kicking an opponent's shins was direct and useful. Around every struggle, the school shouted for the players to lower their heads and push. Near the end, all sense of decency vanished. Mothers of day-boys who stood too near the touchline heard language never printed in the program. Nobody was actually carried away from the field, but every man on both teams felt happier when time was called.
        - id: ch03-b07
          speaker: narrator
          text: Beetle helped Stalky and McTurk into their coats. The two had met deep inside the many-legged scrimmage and, as Stalky put it, had done each other proud. They followed the teams with stiff swaggering steps. Substitutes could not claim equality with the hairy veterans. Near the wall they passed a pony carriage, and a rough weak voice praised their play.
        - id: ch03-b08
          speaker: narrator
          text: It was Stettson major, pale-faced and hollow-eyed. He had fought his way to the field under the guard of an impatient coachman.
        - id: ch03-b09
          speaker: stalky
          text: Hello, Stettson. Is it safe to stand near you yet?
        - id: ch03-b10
          speaker: stettson
          text: Oh yes, I'm well enough. They wouldn't let me out before today, but I had to see the match. Your mouth looks badly swollen.
        - id: ch03-b11
          speaker: stalky
          text: Turkey stepped on it by accident on purpose. I'm glad you're better, because you owe us. You and your infected throat landed us in a lovely mess.
        - id: ch03-b12
          speaker: stettson
          text: I heard about that. The Head told me.
        - id: ch03-b13
          speaker: stalky
          text: He did? When?
        - id: ch03-b14
          speaker: mcturk
          text: Come on toward the College. My leg will stiffen if we stand here talking.
        - id: ch03-b15
          speaker: stalky
          text: Be quiet, Turkey. I want the answer. Well, Stettson?
        - id: ch03-b16
          speaker: stettson
          text: The Head stayed at our house the whole time I was ill.
        - id: ch03-b17
          speaker: stalky
          text: Why? Why was he neglecting the College? We thought he was in London.
        - id: ch03-b18
          speaker: stettson
          text: I was delirious, and they said I kept calling for him.
        - id: ch03-b19
          speaker: stalky
          text: What cheek! You're only a day-boy.
        - id: ch03-b20
          speaker: stettson
          text: He came anyway, and he practically saved my life. One night my throat closed up and the doctor said I was dying. They put some kind of tube into my throat, and the Head sucked the blockage out.
        - id: ch03-b21
          speaker: stalky
          text: Ugh! I wouldn't have done that.
        - id: ch03-b22
          speaker: stettson
          text: The doctor said the Head should have caught diphtheria too. That's why he stayed at our house instead of returning. The doctor says I would have died twenty minutes later.
        - id: ch03-b23
          speaker: narrator
          text: The coachman had orders to move on. He snapped the whip and nearly drove over the three boys.
        - id: ch03-b24
          speaker: beetle
          text: My word. That's fairly heroic.
          emotion: surprised
        - id: ch03-b25
          speaker: mcturk
          text: Fairly heroic? You should be hanged for saying that!
          emotion: angry
        - id: ch03-b26
          speaker: narrator
          text: McTurk's knee struck Beetle in the back and sent him into Stalky, who kicked him back again.
        - id: ch03-b27
          speaker: stalky
          text: The Head deserves the Victoria Cross. He might have been dead and buried by now. But there he was, hopping through the hedge like a strong old blackbird. Extra-special licking, five hundred lines, and a week gated. Perfectly calm about it all!
        - id: ch03-b28
          speaker: beetle
          text: I've read about something like that in a book. What a man! Think of doing it!
          emotion: surprised
        - id: ch03-b29
          speaker: mcturk
          text: I am thinking!
        - id: ch03-b30
          speaker: narrator
          text: He gave a wild Irish yell that made the teams look back.
        - id: ch03-b31
          speaker: stalky
          text: Shut your enormous mouth. Leave this to your Uncle Stalky, and I'll serve the Head up properly. Beetle, if you say one word before I permit it, I'll kill you. I've got him by the very shortest hairs. Now look as if nothing happened.
        - id: ch03-b32
          speaker: narrator
          text: Guile was unnecessary. Everyone was busy cheering the drawn match. The school crowded around the washrooms without caring what muddy boots did to the floors while the team washed. Every glimpse of Crandall brought another cheer. After prayers the noise rose higher still, because the Old Boys appeared in evening clothes and openly twisted their mustaches. Instead of standing beside the masters, they arranged themselves along the wall immediately before the prefects. When the Head called the roll, he included them too, using their old school names as majors, minors, and tertiuses.
        - id: ch03-b33
          speaker: head
          text: This is all very fine, but the boys are getting out of control. I fear there will be trouble later. You should go to bed early, Crandall. The dormitory will be waiting up for you. However high you rise in the Army, you will never again receive such complete worship.
        - id: ch03-b34
          speaker: crandall
          text: Confound their worship. I want to finish my cigar, sir.
        - id: ch03-b35
          speaker: head
          text: Their admiration is pure gold. Go where glory is waiting, Crandall minor.
    - id: ch04
      title: Crandall in the Dormitory
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Crandall's triumph took place in an attic dormitory with ten beds, joined through open doorways to three more rooms. Gaslight flickered above plain pine washstands. Drafts whistled without pause, and beyond the bare windows the sea beat against Pebbleridge.
        - id: ch04-b02
          speaker: crandall
          text: The same old bed, and probably the same mattress. Everything is just as it was. Oh, I am stiff! I had no idea you fellows could play like that. You have left every one of us something to remember.
        - id: ch04-b03
          speaker: narrator
          text: He rubbed his battered shin. The boys needed a few minutes before they felt comfortable with their hero. Strangely, they relaxed when Crandall turned and said his prayers, though he had neglected that habit for years.
        - id: ch04-b04
          speaker: crandall
          text: Oh, I'm sorry. I forgot to turn off the gas.
        - id: ch04-b05
          speaker: dormitory_prefect
          text: Don't trouble yourself. Worthington does it.
        - id: ch04-b06
          speaker: narrator
          text: Worthington, a twelve-year-old in a nightshirt who had waited for this chance to show off, jumped from his bed to the gas bracket and returned by stepping on a washstand.
        - id: ch04-b07
          speaker: crandall
          text: What do you do when he's asleep?
        - id: ch04-b08
          speaker: dormitory_prefect
          text: Push a cold golf club down his back.
        - id: ch04-b09
          speaker: crandall
          text: We used a wet sponge when I was the junior here. Hello, what's going on now?
        - id: ch04-b10
          speaker: narrator
          text: Darkness filled with whispers, dragging blankets, bare feet on boards, muffled complaints, giggles, and threats. Boys told one another to sit on the floor, keep off private beds, and mind the tooth glass.
        - id: ch04-b11
          speaker: dormitory_prefect
          text: Corkran said you might tell us what happened when you recovered Duncan's body.
        - id: ch04-b12
          speakers: [dormitory_prefect, worthington, small_fag]
          ensemble: chorus
          text: Yes, please. Tell us the story.
        - id: ch04-b13
          speaker: crandall
          text: There isn't much to tell. Why are you all hopping around in the cold?
        - id: ch04-b14
          speakers: [dormitory_prefect, worthington, small_fag]
          ensemble: chorus
          text: Never mind us. Tell us about Fat-Sow.
        - id: ch04-b15
          speaker: narrator
          text: Crandall turned on his pillow and spoke to the unseen crowd.
        - id: ch04-b16
          speaker: crandall
          text: About three months ago, Duncan commanded a treasure escort carrying five thousand silver rupees for the troops. He was taking the cart toward Fort Pearson, near Kalabagh.
        - id: ch04-b17
          speaker: small_fag
          text: I was born there! The fort was named after my uncle.
        - id: ch04-b18
          speaker: dormitory_prefect
          text: Be quiet, you and your uncle. Go on, Crandall.
        - id: ch04-b19
          speaker: crandall
          text: Well, the Afridis learned that the treasure was moving. They ambushed the party a couple of miles from the fort and cut the escort to pieces. Duncan was wounded, and his men ran. There were fewer than twenty Sepoys and a great many Afridis.
        - id: ch04-b20
          speaker: crandall
          text: As it happened, I was in command at Fort Pearson. I heard the shooting and was about to investigate when Duncan's men reached us. We all turned back together. They tried to tell me about an officer, but I did not understand until I saw someone beneath the cart wheels, out in the open. He was holding himself on one arm and firing a revolver.
        - id: ch04-b21
          speaker: crandall
          text: The escort had abandoned the cart. The Afridis are very suspicious, so they thought the retreat might be a trick and the treasure might be bait. That was why they left Duncan alone at first. As soon as they saw how few of us were coming, both sides raced across the open ground to reach him. We ran, they ran, and we arrived first. After some close fighting, they withdrew.
        - id: ch04-b22
          speaker: crandall
          text: I did not know Duncan was one of our old boys until I stood over him. There are many Duncans in the service, so the name had meant nothing. He hardly looked changed. A bullet had gone through his lungs, and he was desperately thirsty. I gave him water and sat beside him. The funny thing is, he looked up and said, Hello, Toffee. I answered, Hello, Fat-Sow. I hope you aren't badly hurt, or something like that. A minute or two later he died without lifting his head from my knees.
        - id: ch04-b23
          speaker: crandall
          text: You boys out there will freeze to death. Go back to bed.
        - id: ch04-b24
          speakers: [dormitory_prefect, worthington, small_fag]
          ensemble: chorus
          text: In a minute. What about your cuts? How were you wounded?
        - id: ch04-b25
          speaker: crandall
          text: That happened while we carried the body to the fort. They attacked again, and there was another fight.
        - id: ch04-b26
          speaker: worthington
          text: Did you kill anyone?
        - id: ch04-b27
          speaker: crandall
          text: Yes, probably. Good night.
        - id: ch04-b28
          speakers: [dormitory_prefect, worthington, small_fag]
          ensemble: chorus
          text: Good night, Crandall. Thank you very much.
        - id: ch04-b29
          speaker: narrator
          text: The invisible crowd slipped away. In Crandall's own dormitory, blankets rustled as everyone returned to bed. For a while the room stayed silent.
        - id: ch04-b30
          speaker: stalky
          text: Crandall, may I ask you something?
        - id: ch04-b31
          speaker: narrator
          text: Stalky's voice held a kind of reverence none of his friends had ever heard from him.
        - id: ch04-b32
          speaker: crandall
          text: What is it?
        - id: ch04-b33
          speaker: stalky
          text: Suppose someone found a fellow dying of diphtheria, with his throat completely blocked. The doctors put in a tube, and this fellow sucked the infection out. What would you call that?
        - id: ch04-b34
          speaker: crandall
          text: Let me think. I've heard of only one case, and the man was a doctor. He did it to save a woman.
        - id: ch04-b35
          speaker: stalky
          text: This wasn't a woman. It was only a boy.
        - id: ch04-b36
          speaker: crandall
          text: Then it was finer still. That is about the bravest thing a man can do. Why do you ask?
        - id: ch04-b37
          speaker: stalky
          text: I heard about someone doing it. That's all.
        - id: ch04-b38
          speaker: crandall
          text: Then he is a brave man.
        - id: ch04-b39
          speaker: stalky
          text: Would you be afraid to do it?
        - id: ch04-b40
          speaker: crandall
          text: Of course. Anyone would. Imagine choosing to die of diphtheria.
        - id: ch04-b41
          speaker: stalky
          text: Well, then. Look here!
        - id: ch04-b42
          speaker: narrator
          text: His sentence ended in a grunt. Beetle was about to explode the secret at once, so Stalky leaped from bed. He and McTurk sat on Beetle's head.
    - id: ch05
      title: The Last Night of Term
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning was the last day of term. Its few examinations mattered to nobody, but the day began with anger and war. Mr. King had discovered that nearly every boy in his house had unlocked the connecting dormitory doors and gone to hear Crandall's story. King never approved of young men of the world corrupting boyhood, so he went loudly to the Head with his injury and complaint. The Head promised to deal with it.
        - id: ch05-b02
          speaker: crandall
          text: I'm terribly sorry, sir. I don't think I told them anything unsuitable. Please don't punish them because of me.
        - id: ch05-b03
          speaker: head
          text: It isn't the boys who cause trouble. It is the masters.
        - id: ch05-b04
          speaker: narrator
          text: The smallest shadow of a wink crossed his face.
        - id: ch05-b05
          speaker: head
          text: Still, Prout and King object to dormitory meetings on that scale, and house-masters must be supported. It is too late in term to punish only two houses, so fairness requires that everyone be included. The boys have holiday work for Easter, which naturally none of them will touch. Tonight the whole school, except prefects and study-boys, will do ordinary preparation. Common-room must provide the supervising master. We must be fair to all.
        - id: ch05-b06
          speaker: crandall
          text: Preparation on the last night? Whew! I expect they'll make a little trouble.
        - id: ch05-b07
          speaker: narrator
          text: The school had been playing among packed trunks, shouting through corridors, and celebrating victories in enemy classrooms. It met the news with disbelief and rage. No school anywhere did preparation on the last night of term. This was tyranny against law, faith, and morals. The boys would enter the classrooms and bring their despised holiday work, but each smiled while wondering which master Common-room would send against them.
        - id: ch05-b08
          speaker: narrator
          text: The duty fell to Mr. Mason, an enthusiastic and trusting man who loved youth. No other master wanted it. The College lacked the restraining weight of old traditions, and teachers used to orderly ancient schools sometimes found its boys rebellious.
        - id: ch05-b09
          speaker: narrator
          text: Four long classrooms held everyone below study-boy rank, and all four received Mason with thunderous applause. Before he had cleared his throat twice, they sang him a rhythmic account of British marriage law. The words came from the rules set down by the High Priest of the Israelites and comments attributed to the leader of the host. The lower forms reminded Mason that it was the last day and therefore he must take everything as a joke. When he hurried across to rebuke them, the Lower Fourth and Upper Third began being sick together, loudly and with great realism.
        - id: ch05-b10
          speaker: narrator
          text: Mason tried the most useless thing possible and reasoned with them. A bold voice from the back told him to take fifty lines for speaking without raising his hand. Mason prided himself on perfect English, and the imitation wounded him deeply. While he hunted for the culprit, two younger forms three classrooms away turned off the gas and threw inkpots. It was an energetic and enjoyable preparation. Far away, prefects and study-boys heard the uproar, while the masters smiled over dessert.
        - id: ch05-b11
          speaker: narrator
          text: Stalky watched the time until half past eight.
        - id: ch05-b12
          speaker: stalky
          text: If this lasts much longer, the Head will come upstairs. We'll tell the studies first and the dormitories afterward. Move quickly.
        - id: ch05-b13
          speaker: narrator
          text: He gave Beetle no chance to perform and McTurk no time to drawl. The three rushed from study to study, told the secret, and left the instant they saw it had been understood. They never waited for an answer. All the while, the wicked noise of preparation grew deeper. At Flint's door they met Mason running toward the corridor.
        - id: ch05-b14
          speaker: stalky
          text: He's gone to fetch the Head. Hurry!
        - id: ch05-b15
          speaker: narrator
          text: The three burst side by side into Number Twelve, breathless.
        - id: ch05-b16
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: The Head is coming!
        - id: ch05-b17
          speaker: narrator
          text: The warning silenced the room for one moment. Stalky jumped onto a desk.
        - id: ch05-b18
          speaker: stalky
          text: When we thought the Head was in London, he was sucking the diphtheria out of Stettson major's throat. Stop fooling, you asses, and listen! Stettson would have died if the Head hadn't done it. The Head might have died himself. Crandall says it's the bravest thing any living man can do, and the Head doesn't know that we know!
        - id: ch05-b19
          speaker: narrator
          text: Stalky's voice broke. McTurk and Beetle leaped from desk to desk, driving the news into the younger forms. Then came a pause. Mason entered with the Head behind him. By every rule of school life, no boy spoke or moved beneath the Head's eye. He expected the silence of awe. Instead, steady cheering filled the room and would not stop. Because he was wise, he turned and left. The classrooms fell quiet and a little frightened.
        - id: ch05-b20
          speaker: stalky
          text: It's all right. He can't do very much. You didn't tear up the desks the way we did when old Carleton supervised us. Keep cheering! Listen, the studies have started too!
        - id: ch05-b21
          speaker: narrator
          text: Stalky shot into the corridor with a yell and found Flint and the prefects raising the roof.
        - id: ch05-b22
          speaker: narrator
          text: A Head whose limited company paid four percent had few choices when four rooms of boys awaiting punishment and all his trusted prefects cheered him toward prayers. He could demand an explanation, or walk on with dignity. King glared like an excited cat and told the pale, trembling Mason that certain methods, though certainly not King's, always produced certain results. The Old Boys stayed away from call-over out of tact. In the gymnasium, the Head addressed the assembled school with icy control.
        - id: ch05-b23
          speaker: head
          text: I usually understand you. Tonight I do not. After your idiotic behavior during preparation, some of you appear to consider me a suitable person to cheer. I shall prove that I am not.
        - id: ch05-b24
          speaker: narrator
          text: Three crashing cheers answered him. The Head glared beneath the gaslights.
        - id: ch05-b25
          speaker: head
          text: That is enough. You will gain nothing by it. The Lower School will write three hundred lines each during the holidays. I shall take no more notice of them. The Upper School will write one thousand lines each, to be shown on the evening you return. And there is more.
        - id: ch05-b26
          speaker: stalky
          text: My word, what an appetite he has.
        - id: ch05-b27
          speaker: narrator
          text: Stalky whispered it to his neighbors.
        - id: ch05-b28
          speaker: head
          text: Because of your conduct toward Mr. Mason, I shall cane the entire Upper School tomorrow as I give out journey money. That includes the three study-boys I found dancing on classroom desks. Prefects will remain after call-over.
        - id: ch05-b29
          speaker: narrator
          text: The school filed out silently, then gathered outside the gymnasium to learn what would happen next.
        - id: ch05-b30
          speaker: head
          text: Now, Flint, will you explain the prefects' conduct?
        - id: ch05-b31
          speaker: flint
          text: Well, sir, if you save a fellow's life while risking your own, when he's dying of diphtheria, and the College discovers it, what can you expect?
        - id: ch05-b32
          speaker: head
          text: I see. Then the noise was not intended as insolence. I may overlook immorality, but I cannot tolerate impudence. Still, it does not excuse their behavior toward Mr. Mason. I will cancel the lines this once, but remember that the canings remain.
        - id: ch05-b33
          speaker: narrator
          text: When the news spread, the school stared at the Head in wonder and admiration as he crossed to his house. Here was a man worthy of respect. On the rare occasions when he used the cane, he did it with great skill. The punishment of a hundred boys would be tremendous.
        - id: ch05-b34
          speaker: crandall
          text: It's all right, Head Sahib. We know now. Our substitute asked my opinion of what you did last night in the dormitory. I didn't realize he meant you. A crafty young creature, freckled, with remarkable eyes. Corkran, I think.
        - id: ch05-b35
          speaker: narrator
          text: The Head removed his gown with a grunt in his smoking-room.
        - id: ch05-b36
          speaker: head
          text: Oh, I know him, thank you. Yes. I would have included those three even if I had not caught them.
        - id: ch05-b37
          speaker: engineer
          text: If the College weren't already overexcited, we'd carry you through the corridor on our shoulders. Bates, how could you take that risk? You might have caught it, and what would we have done without you?
        - id: ch05-b38
          speaker: squadron_commander
          text: I always knew you were worth twenty of us. Now I know it for certain.
        - id: ch05-b39
          speaker: gunner
          text: He isn't fit to run a school. Promise us you'll never do such a thing again, Bates Sahib. We can't leave comfortably if you're going to risk your life like that.
        - id: ch05-b40
          speaker: crandall
          text: Bates Sahib, you aren't really going to cane the whole Upper School, are you?
        - id: ch05-b41
          speaker: head
          text: As I said, I can overlook immorality, but not impudence. Mason has a difficult enough position even with my support. Besides, the men at the golf club heard the boys singing that song about Aaron and Moses. Parents of day-boys will complain. Decency must be maintained.
        - id: ch05-b42
          speakers: [engineer, squadron_commander, gunner, crandall]
          ensemble: chorus
          text: Then we're coming to help.
        - id: ch05-b43
          speaker: narrator
          text: The next morning, the Upper School went in one boy after another. Each carried his overcoat over his arm, ready to leave the moment the business was finished. Down in the road, the coaches waited to take everyone to the station. Inside, the journey money lay in neat readiness on the table. The Head began with Stalky, McTurk, and Beetle. He kept his promise and treated all three faithfully.
        - id: ch05-b44
          speaker: head
          text: Here is your journey money. Good-bye, and have pleasant holidays.
        - id: ch05-b45
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Good-bye, sir. Thank you.
        - id: ch05-b46
          speaker: narrator
          text: They shook hands with him.
        - id: ch05-b47
          speaker: stalky
          text: His ambition didn't run far ahead of his performance this morning. We got the very best of it. Let's wait until a few more fellows come out, then we'll cheer him properly.
        - id: ch05-b48
          speaker: crandall
          text: Please don't wait for us. The Old Boys are beginning now.
        - id: ch05-b49
          speaker: narrator
          text: Cheering in the corridor was one thing. Then it spread to the gymnasium, and the boys waiting for punishment joined in. At last the Head gave up in despair. The remaining boys rushed at him only to shake his hand. After that they devoted themselves seriously to cheering until the coaches were waved away from the school without a word being heard.
        - id: ch05-b50
          speaker: stalky
          text: Didn't I say I'd pay him back? Now everyone together. Take the time from your Uncle Stalky. It's a way we have in the Army, it's a way we have in the Navy, it's a way we have at the public schools, which nobody can deny!
