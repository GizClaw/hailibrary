audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着含蓄的幽默
        timbre: 温暖清晰的中低音
        pace: 舒展而富于变化
        pitch: 中
    stalky:
      display_name: 斯托基
      tts:
        delivery: 自信狡黠，随时像在部署作战
        timbre: 清亮而有韧性的少年音
        pace: 明快
        pitch: 中高
    beetle:
      display_name: 甲虫
      tts:
        delivery: 机智好辩，笑意常藏在话里
        timbre: 稍厚的少年音
        pace: 中等偏快
        pitch: 中
    mcturk:
      display_name: 麦克特克
      tts:
        delivery: 冷峭直接，激动时带鲜明的爱尔兰腔调
        timbre: 瘦硬略带沙哑的少年音
        pace: 中等
        pitch: 中高
    king:
      display_name: 金先生
      tts:
        delivery: 尖刻自负，训斥时步步紧逼
        timbre: 干硬的男声
        pace: 偏快
        pitch: 中高
    chaplain:
      display_name: 学校牧师
      tts:
        delivery: 温吞含蓄，说话不紧不慢
        timbre: 温和的中年男声
        pace: 偏慢
        pitch: 中低
    prout:
      display_name: 普劳特先生
      tts:
        delivery: 诚恳敏感，训话时努力维持庄重
        timbre: 浑厚略显疲惫的中年男声
        pace: 中等偏慢
        pitch: 中低
    richards:
      display_name: 理查兹
      tts:
        delivery: 朴实健谈，带着老水手的笃定
        timbre: 粗厚的成年男声
        pace: 中等
        pitch: 低
    orin:
      display_name: 奥林
      tts:
        delivery: 一本正经却底气不足
        timbre: 清直的少年音
        pace: 中等
        pitch: 中
    junior:
      display_name: 低年级生
      tts:
        delivery: 稚气急促，受惊时容易发尖
        timbre: 单薄的男孩声
        pace: 偏快
        pitch: 高
    rattrey:
      display_name: 拉特雷
      tts:
        delivery: 好胜强硬，被激怒时直冲出口
        timbre: 结实的少年音
        pace: 偏快
        pitch: 中
    mcrea:
      display_name: 麦克雷先生
      tts:
        delivery: 严正务实，争辩时毫不含糊
        timbre: 清晰沉稳的男声
        pace: 中等
        pitch: 中低
    hartopp:
      display_name: 小哈托普先生
      tts:
        delivery: 宽厚清醒，话里带温和的讽意
        timbre: 柔和的中年男声
        pace: 中等偏慢
        pitch: 中
    oake:
      display_name: 奥克
      tts:
        delivery: 老练谨慎，说话简短直接
        timbre: 略哑的成年男声
        pace: 中等
        pitch: 中低
    lena:
      display_name: 莉娜
      tts:
        delivery: 爽利泼辣，打趣时毫不客气
        timbre: 明亮的年轻女声
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 从两本坏书到一场坏玩笑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那两本书是斯托基一位未婚姑妈寄来的，扉页还写着祝最亲爱的阿蒂十六岁生日快乐。麦克特克下令拿去抵押，甲虫从比迪福德回来，把书摔在五号自修室的窗台上。巴斯特布尔只肯为两本书出九便士，说《埃里克，或循序渐进》和《圣温弗雷德》一样，根本没人想要。
        - id: ch01-b02
          speaker: beetle
          text: 我对你姑妈也没什么好感。子弹还快打光了呢，亲爱的阿蒂。
        - id: ch01-b03
          speaker: narrator
          text: 斯托基马上扑过去要打架。麦克特克把他压住，坐在他头上，一声声叫他心地纯洁的好孩子，直到两边讲和。他们欠下的拉丁文作文已经多得吓人，外面又是七月里火烫的下午，按说三个人都该去看舍际板球赛。可他们重新翻开那两本书，又去找书里那些亲密而邪门的老朋友。
        - id: ch01-b04
          speaker: mcturk
          text: 找到了。体罚给埃里克造成了极坏的影响。他心里烧着的不是悔恨，也不是懊恼。甲虫，记住这句。烧着的是羞耻和强烈的愤慨，他还怒目而视。哎哟，好一个坏孩子埃里克！咱们找他开始喝酒那段吧。
        - id: ch01-b05
          speaker: stalky
          text: 等等，这里更妙。书上说六年级是所有公学的守护神。可这帮家伙既拦不住学生喝酒偷东西，也拦不住他们半夜把低年级生从窗户放出去。学生想干什么就干什么。天哪，没去圣温弗雷德，咱们少了多少乐子！
        - id: ch01-b06
          speaker: prout
          text: 我很遗憾，本舍竟有人对本舍的比赛这样漠不关心。
        - id: ch01-b07
          speaker: narrator
          text: 普劳特先生只要愿意，走路可以一点声音也没有。男孩们可不把这当美德。他连门也不敲，猛然闯进来，又添一桩罪。他满脸疑心地盯着三个人，说看见他们躲在自修室里闷坐，实在非常遗憾。
        - id: ch01-b08
          speaker: mcturk
          text: 先生，我们午饭以后一直在外面。
        - id: ch01-b09
          speaker: narrator
          text: 麦克特克说得有气无力。舍际比赛看哪一场都一样，而他们这星期选中的活动，恰好是用室内靶枪打兔子。
        - id: ch01-b10
          speaker: beetle
          text: 先生，球飞过来时我看不见。我的大眼镜在球网练习场不知砸坏过多少次，我后来才获准不参加。就算去捡球，我也帮不上忙。
        - id: ch01-b11
          speaker: prout
          text: 大吃大喝倒像是你的长处。吃喝，还有私下酿东西。你们三个为什么就不能关心本舍的荣誉？
        - id: ch01-b12
          speaker: narrator
          text: 这句话他们早听腻了。本舍的荣誉正是普劳特的软肋，三个人都知道往哪里戳最疼。
        - id: ch01-b13
          speaker: stalky
          text: 先生，如果您命令我们下去，我们当然会去。
        - id: ch01-b14
          speaker: narrator
          text: 斯托基客气得能把人逼疯。普劳特却不肯再上当。上回有场重要比赛，他命令三人到场，他们便离开众人，在来宾面前立正站了半小时，还买通低年级生告诉客人，他们是普劳特暴政下的受害者。偏偏普劳特十分敏感。教员休息室里又总为小事结党争吵。金和麦克雷不断告诉他，只有运动才能救学生，没人管的孩子一定会走上邪路。若能照自己的性情办事，普劳特原会是个体谅人的舍监，可同事从不让他这样做。少年又看得出是谁在背后推动他的热心。
        - id: ch01-b15
          speaker: mcturk
          text: 先生，我们一定得去吗？
        - id: ch01-b16
          speaker: prout
          text: 我不愿命令你们去做每个思想端正的孩子都该高高兴兴去做的事。我很遗憾。
        - id: ch01-b17
          speaker: narrator
          text: 他摇摇晃晃地走了，心里隐约觉得自己把好种子撒进了一片贫瘠土地。
        - id: ch01-b18
          speaker: beetle
          text: 他真以为那套话会有用？
        - id: ch01-b19
          speaker: stalky
          text: 他已经疯了。金在休息室里数落他，说他没把我们管上正道。麦克雷又满嘴纪律。老赫菲夹在中间，汗一直往下淌。前几天我去地下室偷面包，听见管事奥克跟普劳特家的理查兹谈这事。
        - id: ch01-b20
          speaker: mcturk
          text: 奥克怎么说？
        - id: ch01-b21
          speaker: stalky
          text: 他说他们吵得比一窝小寒鸦还响，说起话来像当仆人都没长耳朵。他们议论老普劳特替舍里的男孩做过什么，漏做了什么，还说自己的孩子全都顶好，普劳特的全坏透了。你们知道奥克那种说法。理查兹气坏了。他一直恨金，这是为什么？
        - id: ch01-b22
          speaker: beetle
          text: 还用问吗？金上课总拐着弯拿普劳特取笑，可惜一半学生蠢得听不出来。记得上星期二他说散漫舍吧？说的就是我们。听说他还常在自己舍里讲些恶毒话，拿普劳特舍开玩笑。
        - id: ch01-b23
          speaker: mcturk
          text: 我们到这里可不是为了掺和他们的争吵。点名以后谁去游泳？金在板球场点名。走吧。
        - id: ch01-b24
          speaker: narrator
          text: 麦克特克怒冲冲地抓起草帽，领头出门。他们及时赶到凉亭。烈日把亭子烤得滚烫，对面就是灰蒙蒙的卵石滩。只听金说话，再看看他的神情，便知道他那一舍正在胜利大道上昂首前进。
        - id: ch01-b25
          speaker: king
          text: 啊哈，散漫舍的几件珍宝终于来了。我猜你们觉得板球配不上自己吧？照我今天下午所见，你们舍里不少人似乎也这么想。请问三位高贵人物，喝茶以前准备怎样安顿自己？
        - id: ch01-b26
          speaker: narrator
          text: 一群穿法兰绒运动服的男孩低声窃笑。
        - id: ch01-b27
          speaker: stalky
          text: 下去游泳，先生。
        - id: ch01-b28
          speaker: king
          text: 怎么忽然这样爱干净？从你们身上可看不出迹象。我若没记错，当然也许是我记错了，就在不久以前……
        - id: ch01-b29
          speaker: beetle
          text: 五年前，先生。
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 金的脸沉了下来。
        - id: ch01-b31
          speaker: king
          text: 你们中间有一位，当年就是所谓的怕水鬼。不错，一个怕水鬼。现在倒想洗一洗了？很好。干净从来不会伤害一个孩子，也不会伤害一个学舍。现在办正事。
        - id: ch01-b32
          speaker: narrator
          text: 金转身点名。三个人随后往露天海水浴场走去，麦克特克仍在生气。
        - id: ch01-b33
          speaker: mcturk
          text: 甲虫，你为什么非要回他那句话？
        - id: ch01-b34
          speaker: beetle
          text: 拿怕水来挖苦人太不公平。那还是我第一个学期。不会游泳的时候，许多人都怕水。
        - id: ch01-b35
          speaker: mcturk
          text: 对呀，你这头驴。可他马上看出那话戳疼你了。绝不能接金的话。
        - id: ch01-b36
          speaker: beetle
          text: 可那本来就不公平，斯托基。
        - id: ch01-b37
          speaker: stalky
          text: 我的帽子啊！你在这里待了六年，竟然还盼着公平。得了吧，你这个抖抖索索的白痴。
        - id: ch01-b38
          speaker: narrator
          text: 一群也去浴场的金舍男孩追在后面叫喊，求他们为了本舍荣誉，好歹洗干净一点。
        - id: ch01-b39
          speaker: stalky
          text: 这就是金唠叨出来的结果。不是他把这个念头塞进那些小畜生脑袋，他们根本想不到。现在这笑话够说几个星期了。别理他们。
        - id: ch01-b40
          speaker: narrator
          text: 那群男孩越靠越近，嘴里反复喊着一个侮辱人的词，最后还故意捏住鼻子，挪到上风处。
        - id: ch01-b41
          speaker: beetle
          text: 真漂亮。下一步，他们该说我们整舍都发臭了。
        - id: ch01-b42
          speaker: narrator
          text: 游泳回来后，三个人头发湿漉漉的，四肢发懒，心里已经同全世界和解。可一进走廊，甲虫的话便应验了。一个普通的二年级下班小鬼远远伸直胳膊，递来一块包得仔细的肥皂，上面说是金舍全体敬赠。
        - id: ch01-b43
          speaker: stalky
          text: 等一下。尼克松，谁叫你来的？拉特雷和怀特吗？谢谢，不必回答。
        - id: ch01-b44
          speaker: mcturk
          text: 硬把这种鬼把戏塞到别人身上，真恶心。有什么道理？又哪里好笑？
        - id: ch01-b45
          speaker: beetle
          text: 可这事一定会闹到学期结束。
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: 甲虫悲哀地摇头，他自己也把不知多少笑话用得磨破了皮。几天以后，全校已经认定普劳特舍的人从不洗澡，所以个个臭气熏天。课堂上，金看见本舍一个学生故意做手势避开甲虫，脸上便绽出满意的肥润笑容。
        - id: ch01-b47
          speaker: king
          text: 我的甲虫，你身上似乎粘着某种缺陷。不然伯顿大为什么要把衣襟从你身边收开？姑且这么说吧。我承认自己还蒙在鼓里，哪一位肯好心指点我？
        - id: ch01-b48
          speaker: narrator
          text: 半个班自然都抢着为他解释。
        - id: ch01-b49
          speaker: king
          text: 奇了，真是奇了！不过各舍都有自己的传统，我绝不愿干涉。我们倒是偏爱洗澡。甲虫，接着从“jugurtha tamen”往下念，也请你尽量少做那些一眼便看穿的瞎猜。
        - id: ch01-b50
          speaker: narrator
          text: 普劳特舍气坏了，因为羞辱他们的已经不只是金舍。麦克雷舍和哈托普舍也加入进来，遇到普劳特舍的男孩便学着捏鼻子，把那个笑话一遍遍喊给他们听。晚饭以后，全舍召开大会，除了级长，人人都到场。级长们其实也同情这件事，只是碍于身份，不能参加这样的集会。会场里群情激愤。有人站起来宣读一份决议，可惜句子写得文法不通。随后又有一个接一个的人发表演说。每一篇都从“诸位，我们今天为此事集会”开始，说到中间便换着说法痛斥别舍，最后又一律落到“这实在太可恶了”。自从有学校以来，各舍召开大会，大概从来都是这个样子。
        - id: ch01-b51
          speaker: narrator
          text: 五号自修室也来了，照旧摆出宽厚恩主的架势。最后，瘦长下颌的麦克特克终于开口。
        - id: ch01-b52
          speaker: mcturk
          text: 你们咿呀唠叨，翻过来倒过去就是这几句话，有什么用？金舍只会因为把你们逗得团团转而得意，金也一样。再说，奥林那份决议里全是病句，这又会让他得意。
        - id: ch01-b53
          speaker: orin
          text: 我本来以为你和甲虫会替我改好，然后我们再贴到走廊里。
        - id: ch01-b54
          speaker: beetle
          text: Par si je le connai。我才不碰这桩biznai。那只会叫金舍更加得意。火鸡说得没错。
        - id: ch01-b55
          speaker: orin
          text: 那么斯托基肯不肯？
        - id: ch01-b56
          speaker: narrator
          text: 斯托基鼓起两颊，学着庞大固埃故事里的巴汝奇，斜眼从鼻梁上往下瞧。
        - id: ch01-b57
          speaker: stalky
          text: 哦，你们这帮卑微的唠叨鬼！
        - id: ch01-b58
          speakers: [orin, junior, rattrey]
          ensemble: chorus
          text: 你们三个真是下流的叛徒！
          emotion: angry
        - id: ch01-b59
          speaker: narrator
          text: 三个人在满屋咒骂声中走了出去。
        - id: ch01-b60
          speaker: mcturk
          text: 全是废话。去拿室内靶枪，咱们打兔子。
    - id: ch02
      title: 屋檐下的通道
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三把靶枪和装着弹丸的火帽都在斯托基的箱子里。箱子放在三人的阁楼寝室。这间三床小屋通向十床大寝室，再连着一大片寝室，几乎贯穿全校。普劳特舍旁边依次是麦克雷舍、金舍和哈托普舍。各舍之间虽有锁门隔开，屋内格局却完全一样，因为学校原是一排十二幢大房子，上面盖着同一条笔直屋顶。
        - id: ch02-b02
          speaker: narrator
          text: 他们回去时，斯托基的床已经从老虎窗边拉开。理查兹的后半截身子，正从墙上一只两英尺见方的柜子里伸出来。
        - id: ch02-b03
          speaker: stalky
          text: 这是什么？以前怎么没见过？胖子，你在干什么？
        - id: ch02-b04
          speaker: richards
          text: 给脸盆装水，科克兰少爷。本来装了这东西，是要让我少费力气。可一点也没有。
        - id: ch02-b05
          speaker: mcturk
          text: 看上去确实没有。喂，小心别卡在里面。
        - id: ch02-b06
          speaker: narrator
          text: 理查兹喘着气退出来，说自己够不到。
        - id: ch02-b07
          speaker: richards
          text: 那是水阀，麦克特克少爷。上个假期，各舍的水管都抬高了一层，沿着屋檐底下铺过去。我这样壮实的人钻不进去，也够不着阀门。
        - id: ch02-b08
          speaker: stalky
          text: 我来试试。
        - id: ch02-b09
          speaker: richards
          text: 往左边挪，科克兰少爷。摸黑往左找。
        - id: ch02-b10
          speaker: narrator
          text: 斯托基扭着身子钻进去，看见一根长铅管伸进三角形的暗道，远远消失。头顶是屋顶的椽木铺板，脚下是棱角锋利的搁栅，一边则是老虎窗下粗糙的板条灰泥墙。
        - id: ch02-b11
          speaker: stalky
          text: 真是个怪地方。它通到哪里？
        - id: ch02-b12
          speaker: richards
          text: 从这头一直通到那头，科克兰少爷，水管都在屋檐下面。摸到总阀了吗？金先生装这套东西，是不想让我们从楼下提水。可我太宽厚，做不了钻洞的活。谢谢您啦。
        - id: ch02-b13
          speaker: narrator
          text: 水从柜里的龙头喷出来。脸盆一满，感激不尽的理查兹便摇摇摆摆走了。三个男孩坐在床沿，睁大眼睛盘算这处宝藏能派多少用场。两层楼下，全舍愤怒的嗡嗡声传上来，仲夏午后的寝室静得出奇。
        - id: ch02-b14
          speaker: mcturk
          text: 这扇小门以前一直糊着纸。早知道有它就好了！
        - id: ch02-b15
          speaker: stalky
          text: 我提议下去探一遍。现在没人会上楼，连岗哨也不用放。
        - id: ch02-b16
          speaker: narrator
          text: 三个人爬进洞，斯托基领头，又顺手关门。他们四肢着地，踏上一条又黑又脏的路。里面散着灰泥、刨花和泥水匠留下的各种垃圾。暗道约三英尺宽，只有每扇老虎窗旁的柜缝透进一点光。
        - id: ch02-b17
          speaker: stalky
          text: 这里是麦克雷舍，我看见巴恩斯箱子上的名字了。甲虫，别弄那么响。我们能一直爬到学校尽头。走！现在进金舍了，我看见拉特雷箱子的一角。这些鬼木板真硌膝盖。
        - id: ch02-b18
          speaker: narrator
          text: 他们听见他的指甲刮过灰泥。
        - id: ch02-b19
          speaker: beetle
          text: 那是楼下的天花板，小心。弄破以后，灰泥会掉进下面的寝室。
        - id: ch02-b20
          speaker: mcturk
          text: 那就弄破。
        - id: ch02-b21
          speaker: stalky
          text: 然后马上被抓？才不。我能把胳膊从木板中间伸进去很深。
        - id: ch02-b22
          speaker: narrator
          text: 斯托基把手伸进搁栅，直没到肘部。可留在那里也没别的用处。他们决定回去商量，还承认应该感谢金装了这套水管。
        - id: ch02-b23
          speaker: narrator
          text: 三个人爬出来，互相掸掉尘土，把靶枪顺着裤腿藏好，赶到德文郡一条幽深无人的小路。路旁灌木浓密，偶尔真能打到小兔。他们倒在疯长的接骨木下，各自说起心思。
        - id: ch02-b24
          speaker: stalky
          text: 你们知道，我们可以随便把靶枪藏在那条暗道里。
        - id: ch02-b25
          speaker: narrator
          text: 甲虫哼了一声，随即呛得喉咙咕噜作响。离开寝室以后，他一直没说话。
        - id: ch02-b26
          speaker: beetle
          text: 你们读过一本叫《一所房子的历史》之类的书吗？我前几天从图书馆借的。作者是个法国女人，姓维奥莱什么，不过已经译成英文。书很有意思，专讲房子怎样造出来。
        - id: ch02-b27
          speaker: stalky
          text: 你要是急得满头大汗，非弄懂不可，就去看看海岸警卫队新盖的房子。
        - id: ch02-b28
          speaker: beetle
          text: 我的帽子啊，我正要去。谁给我两便士？
        - id: ch02-b29
          speaker: stalky
          text: 别胡闹。留在这里，别跑到太阳下折腾。
        - id: ch02-b30
          speaker: beetle
          text: 给我两便士。
        - id: ch02-b31
          speaker: mcturk
          text: 甲虫，你不是在生什么闷气吧？
        - id: ch02-b32
          speaker: narrator
          text: 麦克特克认真问着，把铜板递给他。三人结盟以来，斯托基常会独自调兵遣将，麦克特克偶尔也会，只有甲虫从没单独行动过。
        - id: ch02-b33
          speaker: beetle
          text: 没有，我只是在想事情。
        - id: ch02-b34
          speaker: stalky
          text: 那我们也去。
        - id: ch02-b35
          speaker: beetle
          text: 不要你们。
        - id: ch02-b36
          speaker: mcturk
          text: 别理他。他一定又让一首诗折腾得病重了。他会一路念到卵石滩，再回自修室全吐出来。
        - id: ch02-b37
          speaker: stalky
          text: 那他要两便士干什么？他越来越会自作主张了。喂，有只兔子。不，不是。老天，是猫！你先开枪。
        - id: ch02-b38
          speaker: narrator
          text: 二十分钟后，一个把草帽推到脑后的男孩，两手插在口袋里，看着工人在半成的小屋里进出。他掏出一种凶烈烟草，靠它从前院一路混进屋内，又问了许多问题。等斯托基和麦克特克闯回自修室时，甲虫正埋头研究维奥莱-勒-杜克和几张图纸。
        - id: ch02-b39
          speaker: mcturk
          text: 好了，把你那篇讨厌的史诗拿出来吧。我们刚才玩得痛快极了。
        - id: ch02-b40
          speaker: beetle
          text: 什么史诗？我去海岸警卫队那边了。
        - id: ch02-b41
          speaker: stalky
          text: 没写诗？那我们就宰了你。你袖子里藏着东西。你一用这种腔调，我就知道。
        - id: ch02-b42
          speaker: beetle
          text: 你们的甲虫叔叔，是个伟人。
        - id: ch02-b43
          speaker: stalky
          text: 不，他一点也不伟大。他是在骗自己。火鸡，掐死他！
        - id: ch02-b44
          speaker: narrator
          text: 甲虫被压到地板上，喉咙里咕噜直响。
        - id: ch02-b45
          speaker: beetle
          text: 是个伟人！你们都是没用的唠叨鬼。小心我的领带！我才伟大，我得意。哎哟，听我说！
        - id: ch02-b46
          speaker: stalky
          text: 亲爱的甲虫，我们爱你，你还是个诗人。我若叫过你打油狗，现在道歉。不过你也知道，独自办事，你非弄砸不可。
        - id: ch02-b47
          speaker: beetle
          text: 我有个主意。
        - id: ch02-b48
          speaker: stalky
          text: 不告诉斯托基叔叔，你就会毁掉整件事。快吐出来，小宝贝，让我们看看怎么办。你一走，我就知道你有主意，火鸡还说是诗呢。
        - id: ch02-b49
          speaker: beetle
          text: 我弄懂房子怎样造了。先让我起来。一间房的地板搁栅，也就是楼下那间房的天花板搁栅。
        - id: ch02-b50
          speaker: stalky
          text: 别说得那么肮脏又专门。
        - id: ch02-b51
          speaker: beetle
          text: 工人就是这么说的。地板铺在我们爬过的那些竖木板上，可到了隔墙那里，地板便断了。只要钻到隔墙背后，就能把东西塞进地板下面，夹在地板和楼下的板条灰泥天花板之间。看，我画了图。
        - id: ch02-b52
          speaker: narrator
          text: 甲虫摊开从工地带回来的粗糙草图，把隔墙、地板、搁栅和下面的天花板一处处指给两个伙伴看。这张图画得不漂亮，却已足够让盟友们茅塞顿开。现代学校的课程里，没有哪一门会教学生房屋建筑。他们每天住在这些房间里，从来没有想过脚下的地板和楼下的天花板究竟是空心还是实心，也没有想过隔墙后面还留着能塞进东西的缝隙。男孩一离开自己那一点切身兴趣，便会像他所崇拜的野人一样无知。可一旦眼前有了真正要办的事，他也有野人一样随机应变的本领。现在，他们不只知道暗道能藏靶枪，也知道那条路通向每一舍的地板下面。
        - id: ch02-b53
          speaker: stalky
          text: 明白。我刚才把胳膊伸进去过。然后呢？
        - id: ch02-b54
          speaker: beetle
          text: 然后，他们不是总叫我们臭鬼吗？我们可以往下面塞点东西。硫黄也好，别的臭东西也好，把他们熏出去。一定有办法。
        - id: ch02-b55
          speaker: stalky
          text: 臭东西？老天，有了！真正臭得吓人的东西。火鸡，就是今天下午，就在甲虫走后不久。她正合适！
          emotion: happy
        - id: ch02-b56
          speaker: mcturk
          text: 到我怀里来吧，我容光焕发的孩子。哦，福妙无比的一天！卡鲁！卡莱！她行，她一定行！
          emotion: happy
        - id: ch02-b57
          speaker: narrator
          text: 麦克特克唱起来，两个人抱在一起跳舞。
        - id: ch02-b58
          speaker: beetle
          text: 等等，我还没听懂。
        - id: ch02-b59
          speaker: mcturk
          text: 亲爱的人儿，可它一定会懂。哦，阿蒂，我灵魂纯洁的少年，咱们把害人臭怪的故事讲给亲爱的雷吉吧。
        - id: ch02-b60
          speaker: stalky
          text: 点名以后再讲。走！
        - id: ch02-b61
          speaker: narrator
          text: 点名时，他们沿体育馆四壁站到自己的位置。奥林生硬地告诉他们，全舍还要开一次会。斯托基心思全在别处，只回答让他们尽管开。奥林又说，这次会议讨论的正是他们三个。斯托基叫他替自己问好，听见点名便高声答到，随即冲下走廊。三个人像玩疯的小山羊一样蹦跳腾挪，连跑带跃，把快要憋炸的甲虫一直领到兔子出没的深路。他们走到那堆石头前，从下面拖出一只刚被打死的猫。甲虫直到这时才看清先前所有话的意思，立刻高声感谢上天，让世界上有斯托基和麦克特克这样英明的战士。
        - id: ch02-b62
          speaker: stalky
          text: 养得挺肥的老太太，对吧？你们猜，放在密闭地方，要多久才会稍稍有点味道？
        - id: ch02-b63
          speaker: mcturk
          text: 稍稍有点味道？你这个粗鄙畜生。一只可怜的小猫想钻进金舍寝室的地板下面死掉，你就不能放过她，还用脏话追着她跑？
        - id: ch02-b64
          speaker: beetle
          text: 她为什么偏要死在地板下面？
        - id: ch02-b65
          speaker: stalky
          text: 等他们找到她，就不会操心这个了。
        - id: ch02-b66
          speaker: mcturk
          text: 猫也可以看国王嘛。猫咪，你还不知道自己能给三个心灵纯洁、品格高尚的孩子帮多大忙。
        - id: ch02-b67
          speaker: beetle
          text: 他们非得像九号楼那只死老鼠一样，掀开地板找她。大巫术，顶大的巫术！呸，老天，我真希望自己能不笑。
        - id: ch02-b68
          speaker: mcturk
          text: 臭啊！嗨，臭气，黏糊糊的臭气！而且这一切还是为了本舍的荣誉！
        - id: ch02-b69
          speaker: narrator
          text: 三个人又笑得缠成一团，滚下路坡。
        - id: ch02-b70
          speaker: stalky
          text: 他们还在开会讨论我们。好了，把她身上的弹丸取出来，赶紧走。越早安顿好越妙。
        - id: ch02-b71
          speaker: narrator
          text: 三个人合力用小刀做了一番阴森的工作，把留在猫身上的弹丸一颗颗取出来。接着，他们又合力带着尸体匆匆赶回学校。至于一路上究竟是谁把那只猫扣在胸前，千万不要追问。他们一路飞跑，斯托基一路安排整个行动的先后次序。午后的阳光大片落在床前的小毯上，眼看着三个男孩和一把雨伞先后消失在寝室墙里。暗道中满是灰泥和木屑，他们挤到金舍上方，找准十床大寝室中央的位置，用胳膊和雨伞把猫向地板深处推进去。五分钟以后，三个人重新从墙里钻出来，彼此替对方从头到脚掸掉尘土。他们洗净双手，梳好头发，恢复成体面模样，这才一同下楼。
        - id: ch02-b72
          speaker: mcturk
          text: 你确定推得够远？
        - id: ch02-b73
          speaker: stalky
          text: 我用整条胳膊再加甲虫的雨伞把她推进去，加起来足有六英尺。她稳稳躺在金舍十床大寝室正中央。等她开始冒气，金舍、哈托普舍、麦克雷舍，全会被她熏出来。你们的斯托基叔叔真是伟人。甲虫，你懂他有多伟大吗？
        - id: ch02-b74
          speaker: beetle
          text: 可主意最初是我的，只是……
        - id: ch02-b75
          speaker: stalky
          text: 没有斯托基叔叔，你就办不成，对吧？
        - id: ch02-b76
          speaker: mcturk
          text: 他们已经叫我们一个星期臭鬼了。哦，这回可有他们受的！
        - id: ch02-b77
          speaker: narrator
          text: 走廊上又传来拖长的“臭鬼”叫声。
        - id: ch02-b78
          speaker: stalky
          text: 而她就在那儿，正在准备惊喜。再过一会儿，她会在梦里向他们低语。然后，她会散出香气。老天，她会香成什么样！请你们认真想上两分钟。
        - id: ch02-b79
          speaker: narrator
          text: 斯托基叫两位伙伴认真想象两分钟。于是三个人几乎一路沉默着回到自修室，谁也不敢先开口。门一关，他们终于笑了起来。那种笑只有男孩才笑得出。他们把额头抵在桌面上笑，又伏到地板上笑。有的人把腰折在椅背上，有的人两手攀着书架，仍旧笑个不停。他们想起金舍送来的肥皂，想起楼下那群人正在一本正经地开会谴责五号，又想起那只猫正安稳地等待开花，笑得连气也接不上。直到三个人浑身瘫软，奥林才代表全舍走进来。
        - id: ch02-b80
          speaker: stalky
          text: 别管我们，奥林，坐吧。你不知道我们多尊敬、多钦佩你。你那纯洁高尚的年轻额头上，全是天真少年时代的梦想，真迷人。
        - id: ch02-b81
          speaker: orin
          text: 全舍让我把这个交给你们。
        - id: ch02-b82
          speaker: narrator
          text: 他把折好的纸放在桌上，摆出可怕的神情退了出去。
        - id: ch02-b83
          speaker: beetle
          text: 是决议！谁来念？我笑得想吐，眼睛也看不见了。
        - id: ch02-b84
          speaker: narrator
          text: 斯托基提防地闻了闻，猛地展开纸。
        - id: ch02-b85
          speaker: stalky
          text: 呸，听着。本舍怀着痛心与鄙夷，注意到五号自修室各成员对最近十二号教室会议中侮辱普劳特舍的言论态度冷漠。甲虫，“indifference”有几个f？
        - id: ch02-b86
          speaker: beetle
          text: 爱写几个写几个。
        - id: ch02-b87
          speaker: stalky
          text: 这里只写了一个。并特此通过决议，对该自修室予以谴责。没了。
        - id: ch02-b88
          speaker: beetle
          text: 而且她的血还流了我一衬衫！
        - id: ch02-b89
          speaker: mcturk
          text: 我也沾了一身猫味，洗了两遍还有。
        - id: ch02-b90
          speaker: stalky
          text: 我把她栽到开花的位置时，差点折断甲虫的雨伞！
    - id: ch03
      title: 臭气转向
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到这一步，眼前的局面已经无法用语言形容，笑声却还能勉强应付。三个人想到那份决议，又想到金舍地板下正在慢慢开花的东西，怎么也停不下来。当晚，同寝室的人想向三人示威，准备仗着人多给他们一点教训。三个人却毫不退让，当场挺身迎战。
        - id: ch03-b02
          speaker: beetle
          text: 你们的问题就在这里。你们是一群不会动脑子的蠢驴，脑子还不如麻雀多。这话我们已经讲过许多遍了，对吧？
        - id: ch03-b03
          speaker: junior
          text: 我们要在寝室里把你们三个揍一顿。你们老是像级长那样教训人。
          emotion: angry
        - id: ch03-b04
          speaker: stalky
          text: 不，你们不会。因为你们知道真动了手，迟早会吃更大的亏。我们不着急，等得起，也会慢慢报自己的小仇。你们已经把自己弄成了嚎叫的蠢驴。明天金看到那份宝贝决议，你们就懂了。明晚以前，要是你们还不又恶心又后悔，我就把帽子吃掉。
        - id: ch03-b05
          speaker: narrator
          text: 第二天午饭铃还没响，普劳特舍便悲哀地看清了错误。金只要遇见落单的普劳特舍学生，立刻摆出格外惊恐的模样。他问，他们是不是想靠一项全体通过的决议把他赶出学校？对于学校治理，他们还有什么高见，好让他马上照办？他无论如何也不敢得罪他们，只是非常遗憾地担心，自己舍里那些从不通过决议却肯洗澡的学生，也许会稍稍笑话他们。
        - id: ch03-b06
          speaker: narrator
          text: 金快活极了。他舍里的男孩沐浴在他的笑脸恩宠里，让受误导的普劳特舍整整一下午赎罪。男孩们走到哪里，金的学生便在哪里重复舍监的讥讽，把那份决议变成新的笑料。普劳特自己阴沉而迟钝，努力想把整件事的是非曲直理出头绪，却越想越糊涂。为什么别人偏要叫他这一舍臭鬼？为什么自己舍里的学生会用一份决议，把原先的小事闹得更大？这确实只是一件小事，可他受过的教育告诉他，一根稻草也能显出风向，无火不会有烟。他满怀不平地到教员休息室找金理论。偏偏金那天兴致勃勃，嘴里全是轻巧的戏谑。他不正面回答，只抓住普劳特话里的每一处犹豫，绕着他一圈又一圈地舞出辩论花样，让普劳特一句也抓不住。
        - id: ch03-b07
          speaker: narrator
          text: 到就寝时分，级长巡查以前，斯托基走遍各寝室。
        - id: ch03-b08
          speaker: stalky
          text: 现在你们还有什么可说？福斯特、卡顿、芬奇、朗布里奇、马林、布雷特！我听见金怎么训你们了。他把你们割成满地干草，你们只会扭动身子，咧嘴傻笑，嘴里全是“是，先生”“不是，先生”“求您了，先生”。你们和你们的决议！呃！
        - id: ch03-b09
          speaker: junior
          text: 闭嘴吧，斯托基。
        - id: ch03-b10
          speaker: stalky
          text: 绝不。你们真是一群光彩照人的决议家，事情办得漂亮极了。下回也许能懂点事，不来打扰我们。
        - id: ch03-b11
          speaker: narrator
          text: 全舍都发起火来，七嘴八舌地说，如果五号自修室一开始肯帮忙，这场错误根本不会发生。
        - id: ch03-b12
          speaker: orin
          text: 可你们几个太自负了。走进会场时还趾高气扬，好像我们全是白痴。
        - id: ch03-b13
          speaker: stalky
          text: 你们本来就是。我们一直想把这件事敲进你们的厚脑壳。算了，我们原谅你们。打起精神，生来是蠢驴也不是你们的错。
        - id: ch03-b14
          speaker: narrator
          text: 斯托基灵巧地绕到敌军侧翼，跳上床。就在那夜，喜气洋洋的金舍第一次尝到了悲苦。也许是地板下面的穿堂风作怪，死猫没有折磨正下方的寝室，反而侵入了右边一间。气味跟着气流悄悄飘去，与其说是刺鼻的恶臭，不如说是一种淡蓝色的感觉。可少年鼻子敏锐，舌头又干净利落，一丝若有若无的味道已经完全足够。那间寝室究竟对金先生说了什么，金先生又怎样回答，礼数要求我们拿好几层浸过石炭酸的床单把它遮起来。金真心以自己的学舍为荣。只要关系到学生的舒适，他一向挑剔得很。所以他亲自来了，亲自嗅了嗅，也亲自说了不少话。
        - id: ch03-b15
          speaker: narrator
          text: 次日早晨，寝室里一个男孩悄悄告诉麦克雷舍的知心朋友，他们那里出了麻烦，金还想把事情瞒住。偏偏那男孩又有一个知心朋友，是普劳特舍里满头乱发、天性恶毒的低年级生。他套出秘密，立刻用蝙蝠般尖利的童声喊遍走廊。
        - id: ch03-b16
          speaker: junior
          text: 他们整整一个星期都叫我们臭鬼。哈兰德小说，他们那间寝室臭得根本睡不了。走啊！
        - id: ch03-b17
          speaker: narrator
          text: 一声呐喊，一声咆哮，普劳特舍的低年级生投入战争。第一堂课与第二堂课之间，大约五十个十二岁孩子在金窗外的碎石地混战，整支曲子的主旋律只有两个字，臭鬼。
        - id: ch03-b18
          speaker: stalky
          text: 听，海上报时炮响了！祷告时我就看出他蔚蓝的额头笼着阴云。她要来啦，玛丽姐姐。她……
        - id: ch03-b19
          speaker: beetle
          text: 现在已经闹成这样，等她真正抬起头，开始留心四周，会怎么样？
        - id: ch03-b20
          speaker: stalky
          text: 甲虫，不要说粗俗笑话。我们只要像绅士一样，不去掺和这场争吵。
        - id: ch03-b21
          speaker: mcturk
          text: 只是一朵枯萎的小花。我的贺拉斯呢？我不懂，她为什么先去熏拉特雷的寝室。我们不是从怀特那间下面打通的吗？
        - id: ch03-b22
          speaker: stalky
          text: 小家伙活泼得很，大概正到处嬉戏。
        - id: ch03-b23
          speaker: beetle
          text: 我的姑妈啊！第二堂课的金一定讨人喜欢极了，我的贺拉斯也一个字没预习。走！
        - id: ch03-b24
          speaker: narrator
          text: 他们已经到教室外，离铃响不到五分钟，金随时会来。麦克特克用胳膊挤进一群扭打的低年级生，揪出哈兰德的知心朋友桑顿三号，逼他重讲一遍。故事很简单，只是不时被哭声打断，因为金舍已有许多人为他造谣而揍过他。
        - id: ch03-b25
          speaker: mcturk
          text: 没什么。他不过说金舍发臭，就这些。
        - id: ch03-b26
          speaker: stalky
          text: 一点也不新鲜。我们几年前就知道，只是不肯到处喊臭鬼。他们没礼貌，我们可有。火鸡，抓个低年级生来确认一下。
        - id: ch03-b27
          speaker: narrator
          text: 麦克特克长臂一伸，抓住一个匆忙而不安的二年级下班男孩。
        - id: ch03-b28
          speaker: junior
          text: 麦克特克，求你放开我。我不臭，我发誓不臭！
          emotion: fearful
        - id: ch03-b29
          speaker: beetle
          text: 做贼心虚！谁说你臭了？
        - id: ch03-b30
          speaker: stalky
          text: 你怎么看？
        - id: ch03-b31
          speaker: narrator
          text: 斯托基一脚把小男孩送进甲虫怀里。
        - id: ch03-b32
          speaker: beetle
          text: 嗅，嗅。他确实臭。我看是麻风病，也许是鹅口疮，说不定两样都有。拿走吧。
        - id: ch03-b33
          speaker: narrator
          text: 铃声响时，金照例站在舍门口一两分钟。
        - id: ch03-b34
          speaker: king
          text: 说真的，甲虫少爷，我们实在感谢你的诊断。它既显出你心灵天生不洁，也显出你对这些信口开河的疾病何等无知，两方面同样替你争光。不过，我们会从别处检验你的学识。
        - id: ch03-b35
          speaker: narrator
          text: 那堂课欢乐极了。金急着把甲虫割得遍体鳞伤，竟忘了罚抄，还赠给他许多价值无量的形容词，留待以后使用。甲虫十分满意，第三堂小哈托普的代数课上，他全心写起一首《麻风病院》。午饭后，金照原定安排带本舍去卵石滩外游泳。他很想取消，因为普劳特舍全体列在墙手球场边，不怀好意地欢呼。
        - id: ch03-b36
          speaker: narrator
          text: 金舍的人一走，至少半个学校都涌进那间染疫寝室，各自用鼻子作出判断。死猫已经在那里待了十二个钟头，功力大有长进。探子们回来报告时说得绘声绘色，仿佛一处已经鏖战到第五天的战场，也远远没有那间寝室壮烈。
        - id: ch03-b37
          speaker: stalky
          text: 我的乖乖，她真替自己争气。你们闻过这样的气味吗？她还根本没到怀特寝室下面呢。
        - id: ch03-b38
          speaker: beetle
          text: 会到的，给她时间。她会像一株发昏的忍冬，到处绕着攀爬。这帮嚎叫的麻风病人！任何学舍都无权把自己变成正派人鼻孔里的恶臭。
        - id: ch03-b39
          speaker: mcturk
          text: 高尚又纯洁的孩子们，你们心里可烧着悔恨和懊恼？
        - id: ch03-b40
          speaker: narrator
          text: 他们赶去迎接从海边归来的金舍。金已经抛下队伍先走，众人说话再没有顾忌。舍队前面，一群混合各舍的散兵忽进忽退，散开以后又重新聚拢，一面尖叫，一面把各种辱骂投向刚洗过澡的队伍。两侧则跟着高年级生组成的重装步兵。他们接二连三投出笑话，全是石器时代最简单、最原始的那一类，却正适合眼前情形。整个队伍像被嘲笑声夹在中间向前走。斯托基、麦克特克和甲虫也加入进去，可他们不肯像旁人那样兴奋，反而故意显得冷静疏远，甚至带着一点替受害者难过的神情。
        - id: ch03-b41
          speaker: stalky
          text: 可他们看起来很正常。不可能是拉特雷吧？拉特雷？亲爱的拉特雷，他好像在为什么事不高兴。听着老兄，上星期你送我们肥皂，我们可没记仇。高兴点，你能挺过去。我看只是几个低年级生有毛病，不过你们舍确实太松懈。
        - id: ch03-b42
          speaker: mcturk
          text: 你们不会真要回舍里吧？你们想象不到上面多臭。平时老躲在屋里发霉，自然闻不出。现在刚洗过澡，又呼吸了新鲜空气，连你们自己也受不了。最好到沙丘上扎营，我们替你们弄点稻草好吗？
        - id: ch03-b43
          speaker: narrator
          text: 受害者们巴不得不要回舍，可最后还是在亲爱同学齐唱的《约翰·布朗的尸体》中匆匆进门，把自己严严实实封锁在教室里。斯托基立刻拿粉笔在门上画了一个大十字，旁边又写上“主啊，怜悯我们”，特意留给金回来发现。
        - id: ch03-b44
          speaker: narrator
          text: 当晚风向一变，腐尸气味又飘进麦克雷舍的寝室。穿着睡衣的男孩们猛砸两舍之间那道锁住的门，苦苦请求金舍的人洗澡。第二天，五号自修室去上第二堂课时，每个人衣服里带的樟脑都不下半磅。金十分警觉，硬是不肯开口问他们为什么，只胡言乱语地训斥了一阵，便把三个人赶出去。甲虫于是回到自修室，安安静静又写完了一首诗。
    - id: ch04
      title: 人人都听见了金先生
      blocks:
        - id: ch04-b01
          speaker: stalky
          text: 他们开始用石炭酸了，马尔帕斯告诉我的。金以为问题出在下水道。
        - id: ch04-b02
          speaker: mcturk
          text: 她可需要很多石炭酸。让他们试试也没坏处，至少金没空再作恶。
        - id: ch04-b03
          speaker: stalky
          text: 我刚才闻了一下，他简直想杀我。可前几天伯顿大对着我闻，他一点不介意。亚历山大从前朝我们教室喊臭鬼，他也不制止，直到我们替他们治了病。他只会咧嘴笑。甲虫，他刚才为什么冲你吐白沫？
        - id: ch04-b04
          speaker: beetle
          text: 那是我暗藏玄机的玩笑。我把他架到烤面包上烤了。你们知道，他总爱说那位博学的利普修斯。
        - id: ch04-b05
          speaker: mcturk
          text: 就是那个四岁时便如何如何的人？
        - id: ch04-b06
          speaker: beetle
          text: 对。他每次听说我写诗就要讲。我刚坐下，便悄悄问伯顿大，我们博学的莱普修斯近来怎样。老伯顿笑得像猫头鹰。他根本不懂我在影射什么，金却听得明明白白。这才是他把我们扔出去的真原因。你们感激吗？现在闭嘴，我要写《博学的利普修斯之歌》。
        - id: ch04-b07
          speaker: stalky
          text: 别写粗俗东西。这样喜庆的日子，我不愿显得粗俗。
        - id: ch04-b08
          speaker: beetle
          text: 全世界也不肯。什么字能同臭气押韵？
        - id: ch04-b09
          speaker: narrator
          text: 午餐时，金在教员休息室尖刻地谈起心思淫秽的男孩，说他们把仅有的一点邪恶才华全用来瓦解纪律、腐蚀同伴，摆弄肮脏意象，毁掉敬畏之心。
        - id: ch04-b10
          speaker: prout
          text: 可你那一舍叫我们臭鬼时，你似乎没这样看。要不是你保证从不干涉别人的学舍，我几乎会相信，这场胡闹正是你随口几句话挑起来的。
        - id: ch04-b11
          speaker: narrator
          text: 普劳特已经忍耐许久，因为金每逢吃饭，都把坏脾气一起带来。
        - id: ch04-b12
          speaker: chaplain
          text: 你自己也对甲虫说过吧？什么不肯洗澡，什么怕水鬼。那天我正在凉亭记分。
        - id: ch04-b13
          speaker: king
          text: 也许说过，不过只是玩笑。我不可能装作记得对小男孩随口说过的每句话，而且我很清楚，甲虫根本没有感情可受伤害。
        - id: ch04-b14
          speaker: chaplain
          text: 也许吧。不过他，或者他们几个，反正是一回事，偏有魔鬼般的本领，能找出一个人最软弱的地方。我宁可特意绕点路去安抚五号自修室。这也许显得软弱，可据我所知，全校只有我没被他们那些殷勤逼疯。
        - id: ch04-b15
          speaker: king
          text: 这与问题无关。有事发生时，我自信能独自对付他们。可本该执掌绝对而宽厚正义的人，若从道义上支持他们，我的命就实在太苦了。我最厌恶的，便是自己人之间任何近似不忠的行为。
        - id: ch04-b16
          speaker: narrator
          text: 众人从眼角互相打量，普劳特涨红了脸。
        - id: ch04-b17
          speaker: prout
          text: 我绝对否认。事实上，我承认自己也不喜欢那三个人。所以若说我……
        - id: ch04-b18
          speaker: king
          text: 你还要纵容多久？
        - id: ch04-b19
          speaker: mcrea
          text: 可若有人有错，责任明明在你，金。你不能把自己舍里的臭气，也算到他们头上。我想你偏爱这个古老纯正的盎格鲁-撒克逊字眼。我的学生现在也在抱怨。
        - id: ch04-b20
          speaker: hartopp
          text: 还能怎样？你知道男孩是什么。他们当然会利用这个在他们看来由上天赐下的机会。金，你的寝室究竟怎么了？
        - id: ch04-b21
          speaker: narrator
          text: 金先生解释说，他平生给自己定下的唯一准则，就是决不干涉别人的学舍。因此，他也希望别人不要过于明目张胆地干涉他的学舍。大家也许有兴趣知道，他已经采取了一切在自己可怜的判断看来足以处理此事的措施。不仅如此，他还不求补偿地自掏腰包，花了一笔不愿公开数目的钱购买消毒剂。他这样做，是因为痛苦而且极其痛苦的经验早已告诉他，学校的管理松弛、拖沓又无能。该采取行动的时候，管理总是迟迟不动。等一个舍监自己花钱、自己处理了问题，别人却坐下来追问他为什么这样做。他甚至可以补充一句，这种管理几乎同某些如今竟有意坐下来审判他行为的学舍一样松弛。说到这里，他又从眼前这桩气味问题讲到自己多年的教育生涯，概括了一遍历来的工作、经验和包括学位在内的资历，仿佛这些都能证明寝室里的臭气不是他的责任。最后，他带着受了不公审判的神情摔门离开。牧师听完，只能疲倦地叹一口气。
        - id: ch04-b22
          speaker: chaplain
          text: 唉，我们的生活会把人缩小，叫人变得琐碎。愿上帝帮助所有教师，他们需要帮助。
        - id: ch04-b23
          speaker: prout
          text: 我承认不喜欢那几个男孩，也从不装成坚强的人。不过我想不出，为什么只因金碰巧惹恼了他们，我就该对斯托基他们采取措施。
        - id: ch04-b24
          speaker: hartopp
          text: 他掉进自己挖的坑里了。当然不用管，普劳特。没人指控你懒得管事，故意挑动一舍去斗另一舍。
        - id: ch04-b25
          speaker: chaplain
          text: 叫人琐碎的生活啊。我要批改法文练习了。到晚饭时，金会胜过一个倒霉的十三岁孩子，再把自己每句光辉妙答讲给我们听，一切便又太平。
        - id: ch04-b26
          speaker: prout
          text: 可那三个人呢？他们的心思真有那么淫秽？
        - id: ch04-b27
          speaker: hartopp
          text: 胡说。你只要想一想就懂，金所说那股早熟的恶臭意象洪流，全从金那里整批借来。是他养大了为钢箭添翼的羽毛，他当然不喜欢。到吸烟室坐坐。偷听男孩不大公平，不过他们现在多半正在外面狠狠干金舍。小小心灵，最容易让小事取悦。
        - id: ch04-b28
          speaker: narrator
          text: 教员休息室旁边有一间阴暗小屋，除了挂长袍，平时再没有别的用途。窗上镶着毛玻璃，从里面什么也看不见，碎石地上的谈话却几乎句句都能听清。几位先生刚进去，外面便传来五号自修室那三个人轻巧而谨慎的脚步声。
        - id: ch04-b29
          speaker: mcturk
          text: 拉特雷！金先生在附近吗？我有一件……
        - id: ch04-b30
          speaker: rattrey
          text: 不在，他出去了。
        - id: ch04-b31
          speaker: mcturk
          text: 啊，博学的利普修斯出去透气了？殿下熏香去了。全校再没有哪股臭气比金舍更猛烈，人人都不知所措，只有金知道。他把低年级生逐个私下洗净，在希实本的鱼池里替他们沐浴，腰间还围着围裙。
        - id: ch04-b32
          speaker: narrator
          text: 麦克特克爬上栏杆，像一只永不疲倦的白嘴鸦般演说。一只高尔夫球噗地打进碎石。
        - id: ch04-b33
          speaker: rattrey
          text: 闭嘴，你这个发疯的爱尔兰人！
          emotion: angry
        - id: ch04-b34
          speaker: mcturk
          text: 发火没用。我们是来同你说笑的。来吧，甲虫，他们都在家，你能把他们的发条上足。
        - id: ch04-b35
          speaker: beetle
          text: 那位华丽的臭气大王在哪里？心灵纯洁、品格高尚的孩子，如今在他舍边露面可不安全。他出去了？没关系，我替他办。拉特雷，眼下我暂代父母之职。年轻朋友，我有几句话传授给你，我们要共同谈一会儿。
        - id: ch04-b36
          speaker: mcrea
          text: 这句是送给你的，普劳特。
        - id: ch04-b37
          speaker: narrator
          text: 普劳特听得噗了一声。甲虫绷紧嗓子，用上了金最爱的开场。
        - id: ch04-b38
          speaker: beetle
          text: 我再说一遍，拉特雷少爷，我们要谈谈。谈的绝不是臭气，因为那是可憎而淫秽的词。若你许可，我相信你会许可，我们就研究这场潜在堕落突然暴露的下流骚动。最叫我震惊的，不是你背着一身腐败招摇时公开表现的无耻，而是你陶醉在自身恶臭里那种犬儒式的不道德。我绝不愿干涉别人的学舍。
        - id: ch04-b39
          speaker: narrator
          text: 演说不时被高尔夫球打断，好在拉特雷的球一向很差。
        - id: ch04-b40
          speaker: prout
          text: 老天，这根本就是金。
        - id: ch04-b41
          speaker: hartopp
          text: 一行不差，一字不差。听着。
        - id: ch04-b42
          speaker: beetle
          text: 要说你们臭，就像某些卑贱阶层的淫荡之徒所断言的那样，实在比什么都没说还少。你们亲爱的舍监不在这里，我对他的敬意却无人能及。让我说明你们感染本舍的臭气，那个古老纯正的盎格鲁-撒克逊字眼，到底怎样粗鄙、空前庞大、骇人恶臭。哎呀，后面忘了，本来美极了。拉特雷，我们这样费力教你，你不感激吗？别人根本不肯花这番力气，可我们很感激你。
        - id: ch04-b43
          speaker: mcturk
          text: 是啊，我们感激得恶心。那块肥皂可没忘。我们很有礼貌，拉特，你为什么没礼貌？
        - id: ch04-b44
          speaker: stalky
          text: 正在劝诫臭气鬼吗？恐怕他们已经病入膏肓，来不及悔改。拉特雷，怀特，佩罗恩，马尔帕斯！没人回答，太叫人痛心。把死人抬出来吧，你们这群生鼻疽的麻风病人！
        - id: ch04-b45
          speaker: rattrey
          text: 你觉得自己很好笑，是吧？不过是地板下死了一只老鼠。我们明天就掀地板。
        - id: ch04-b46
          speaker: stalky
          text: 别把罪推给可怜的哑巴畜生，何况它已经死了。我痛恨搪塞。凭我的灵魂发誓……
        - id: ch04-b47
          speaker: beetle
          text: 等等，小哈托普一辈子也没说过凭我的灵魂发誓。
        - id: ch04-b48
          speaker: prout
          text: 啊！
        - id: ch04-b49
          speaker: stalky
          text: 凭我的名誉，先生。我本以为你会更像样些，拉特雷。为什么不能像男子汉一样承认错误？我可曾对你显出一点不信任？
        - id: ch04-b50
          speaker: hartopp
          text: 那不是残酷，是男孩气，只是男孩气。
        - id: ch04-b51
          speaker: stalky
          text: 就是这个学舍，这座敞口粪坑，竟敢叫我们臭鬼。如今它又想躲到一只死老鼠后面。拉特雷，你令我恼怒，叫我厌恶，让我烦躁得说不出话。感谢上天，我是个性情平和的人。
        - id: ch04-b52
          speaker: prout
          text: 这句说的是你，麦克雷。
        - id: ch04-b53
          speaker: mcrea
          text: 恐怕是，恐怕是。
        - id: ch04-b54
          speaker: stalky
          text: 否则面对你这张嘲弄的脸，我几乎克制不住自己。
        - id: ch04-b55
          speaker: beetle
          text: 当心！
        - id: ch04-b56
          speaker: narrator
          text: 甲虫已经看见金顺着走廊扬帆而来。
        - id: ch04-b57
          speaker: king
          text: 小朋友们，你们在这里做什么？我方才有个稍纵即逝的念头，若我错了请纠正，要是发现你们站在我的学舍门外，我就要用可怕的痛苦和惩罚临幸你们。
        - id: ch04-b58
          speaker: narrator
          text: 隔墙后偷听的人一齐噎住。
        - id: ch04-b59
          speaker: beetle
          text: 先生，我们正要出去散步。
        - id: ch04-b60
          speaker: king
          text: 途中停下来同拉特雷说话？
        - id: ch04-b61
          speaker: rattrey
          text: 是，先生。我们一直在扔高尔夫球。
        - id: ch04-b62
          speaker: hartopp
          text: 老拉特比我想的更懂外交。到现在为止，每句都严格属实。普劳特，留意其中的伦理。
        - id: ch04-b63
          speaker: king
          text: 哦，你在同他们玩？我一点也不羡慕你挑选同伴的眼光。我还以为，他们又在散布近日那些淫秽言论。我郑重劝你，今后每一步都慎重选择。把高尔夫球捡起来。
        - id: ch04-b64
          speaker: narrator
          text: 金继续走了。
    - id: ch05
      title: 地板下的证据
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天，理查兹奉命掀开一间寝室的地板。他在海军里做过木匠，学校里那些零碎修缮一向交给他。金先生已经认定，地板下面必定死了什么东西，所以这项差事非做不可。
        - id: ch05-b02
          speaker: king
          text: 我们不必为这种微不足道的插曲荒废全部功课，虽然我知道，小事最能取悦小心灵。不错，我已下令午饭后由理查兹拆地板。某一类所谓头脑一定觉得趣味无穷，可无论本舍还是别舍，任何学生只要出现在寝室楼梯上，立刻罚抄三百行。
        - id: ch05-b03
          speaker: narrator
          text: 男孩们遵守了命令，没有聚在寝室楼梯上。可命令没有说他们不能等在金舍外面，所以学校里多数人都在那里守候。理查兹早已答应，只要有了结果，就从阁楼窗口高声报告。如果情况允许，他还会把找到的尸体举起来给大家看。所有人仰头等着，猜测地板下面到底是什么。理查兹在那间死亡寝室里跪着忙了好一阵，撬开地板，忍受着越来越厉害的气味。最后，他把脸伸出阁楼窗口，那张脸已经涨成紫红色。
        - id: ch05-b04
          speaker: richards
          text: 是只猫，一只死猫！
        - id: ch05-b05
          speaker: mcturk
          text: 去他的猫！那是上学期留下的死低年级生。为金的死低年级生欢呼三声！
        - id: ch05-b06
          speaker: narrator
          text: 众人放声欢呼。
        - id: ch05-b07
          speakers: [orin, junior, rattrey]
          ensemble: chorus
          text: 亮出来！让我们看一眼！送给捉虫佬！猫看了国王一眼，就死啦！呼！呀！嗷！喵呜！嘶！
        - id: ch05-b08
          speaker: narrator
          text: 理查兹再次从窗口露面。
        - id: ch05-b09
          speaker: richards
          text: 她已经……死了很久啦。
        - id: ch05-b10
          speaker: narrator
          text: 全校轰然大笑。斯托基等笑声停到他精心选好的那一刻，才开口。
        - id: ch05-b11
          speaker: stalky
          text: 好了，出去散步吧。这事实在叫人恶心。我真希望麻风病院别再做一次。
        - id: ch05-b12
          speaker: rattrey
          text: 做什么？
          emotion: angry
        - id: ch05-b13
          speaker: stalky
          text: 每次想逃掉洗澡，就杀一只可怜无辜的猫。本来就很难分清你们和猫。我还是喜欢猫，她没有你们那么香。甲虫，你准备做什么？
        - id: ch05-b14
          speaker: beetle
          text: Je vais gloater。我要得意整个该死的下午。Jamais j’ai gloaté comme je gloaterai aujourd’hui。Nous bunkerons aux bunkers。
        - id: ch05-b15
          speaker: narrator
          text: 大家一致认为，这个安排很好。
        - id: ch05-b16
          speaker: narrator
          text: 后来，地下室里的煤气灯忽明忽暗，一排排靴子整齐立在架上。理查兹坐在一堆擦鞋刷中间，把自己的发现讲得有声有色。听众是教员休息室的奥克、饭厅的冈布利，还有洗衣房里漂亮的莉娜。
        - id: ch05-b17
          speaker: richards
          text: 可不是，她那模样坏得吓人。我差点让她熏吐了。可我把她刨出来，一切收拾得整整齐齐，虽说她闻起来活像船底污水舱。
        - id: ch05-b18
          speaker: lena
          text: 可怜东西，我猜她捉老鼠时死了。
        - id: ch05-b19
          speaker: richards
          text: 那她捉老鼠的办法，就跟上帝造出的所有猫都不同。我撬开最上面那块地板，她仰面躺着。我用扫帚柄翻过她，背上全是从天花板板条缝蹭来的灰泥。她脑袋下面还有个小灰泥枕头，是仰面滑进去时在头前推起来的。世上没有猫仰面捉老鼠。有人把她一直往里推，推到不能再推。猫不会给自己做枕头再躺下死。她被推进去时，身子还正要变冷。
        - id: ch05-b20
          speaker: lena
          text: 哦，你聪明得活不长啦，胖子。快结婚吧，让人教你一点规矩。
        - id: ch05-b21
          speaker: narrator
          text: 莉娜已经同冈布利订婚。
        - id: ch05-b22
          speaker: richards
          text: 有些姑娘还没出生，我已经学过一点东西。我在女王陛下的海军服过役，那里会教人睁眼看东西。莉娜，管你自己的事。
        - id: ch05-b23
          speaker: oake
          text: 你刚才告诉我们的，全是真的？
        - id: ch05-b24
          speaker: richards
          text: 别问我，我就不拿谎话回答你。一个弹孔从这边干净穿到那边，两根护心肋骨也像柳条一样断了。我把她翻过来时亲眼看见。话已经到舌尖，我差点说出去。可是，他说我们从不洗澡。他还任凭那些该死的男孩叫我们臭鬼。我说，他活该倒这个该死的大霉！
        - id: ch05-b25
          speaker: narrator
          text: 理查兹朝一只新送来的靴子吐了口唾沫，咯咯笑着继续干活。
