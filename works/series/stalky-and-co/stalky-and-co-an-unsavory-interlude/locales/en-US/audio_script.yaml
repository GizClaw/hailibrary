  chapters:
    - id: ch01
      title: The Honor of the House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Stalky's unmarried aunt sent him two books for his sixteenth birthday. She wrote inside them, “To dearest Artie.” McTurk promptly decided they should be pawned, and Beetle carried them to Bastable's shop in Bideford. He returned to Number Five study with bad news. Bastable would lend only ninepence on both. Eric, or Little by Little was almost as worthless as St. Winifred's.
        - id: ch01-b02
          speaker: beetle
          text: I don't think much of your aunt, Artie dear. And we're nearly out of cartridges.
        - id: ch01-b03
          speaker: narrator
          text: Stalky sprang at him. McTurk sat on Stalky's head and called him a pure-minded boy until peace returned. The three were badly behind with a Latin composition. It was a blazing July afternoon, and they were supposed to be watching a house cricket match. Instead, they opened the books and renewed a very intimate and very unholy acquaintance with them.
        - id: ch01-b04
          speaker: mcturk
          text: Here we are. Corporal punishment had the worst effect on Eric. He burned, not with regret, but with shame and violent anger. Make a note of that, Beetle. Then he glared. Oh, you naughty Eric! Now let's find the part where he starts drinking.
        - id: ch01-b05
          speaker: stalky
          text: Wait. Here's another beauty. It says the Sixth Form protects the whole public school. But this lot can't stop boys drinking, stealing, letting younger boys out through windows at night, or doing anything else they please. Think what we've missed by not going to St. Winifred's!
        - id: ch01-b06
          speaker: prout
          text: I am sorry to find boys of my house showing so little interest in their matches.
        - id: ch01-b07
          speaker: narrator
          text: Mr. Prout could move silently when he chose, though boys saw no virtue in that. He had opened the study door without knocking, which was another offense, and now he watched them suspiciously.
        - id: ch01-b08
          speaker: prout
          text: I am very sorry indeed to see you lounging in your study.
        - id: ch01-b09
          speaker: mcturk
          text: We've been outside ever since dinner, sir.
        - id: ch01-b10
          speaker: narrator
          text: McTurk sounded tired. One house match seemed exactly like another. Their own amusement that week was shooting rabbits with small saloon pistols.
        - id: ch01-b11
          speaker: beetle
          text: I can't see a ball coming, sir. My spectacles were smashed so often at the practice nets that I was excused. I wasn't even useful as a younger boy fetching balls.
        - id: ch01-b12
          speaker: prout
          text: Food is probably more to your taste. Food and brewing drinks. Why can none of you care about the honor of your house?
        - id: ch01-b13
          speaker: narrator
          text: They had heard that phrase until they were sick of it. The honor of the house was Prout's sore spot, and they knew exactly how to touch it.
        - id: ch01-b14
          speaker: stalky
          text: If you order us to the match, sir, naturally we'll go.
        - id: ch01-b15
          speaker: narrator
          text: His politeness was maddening, but Prout knew better than to give that order. He had tried it once at a great match. The three boys had stood stiffly at attention for half an hour where every visitor could see them. Younger boys, paid for the work, pointed them out as victims of Prout's tyranny. Prout was a sensitive man.
        - id: ch01-b16
          speaker: narrator
          text: In the Common-room's tiny alliances, King and Macrea had persuaded him that games alone could save boys. Neglected boys were lost boys, and boys must be disciplined. Left alone, Prout might have been a sympathetic house-master. He was never left alone, and the boys knew exactly who had stirred up his new zeal.
        - id: ch01-b17
          speaker: mcturk
          text: Must we go down to the match, sir?
        - id: ch01-b18
          speaker: prout
          text: I do not wish to order you to do something that a right-minded boy should do gladly. I am sorry.
        - id: ch01-b19
          speaker: narrator
          text: He lumbered out, vaguely believing he had planted good seed in poor soil.
        - id: ch01-b20
          speaker: beetle
          text: What use does he suppose that was?
        - id: ch01-b21
          speaker: stalky
          text: He's cracked. King lectures him in Common-room for not keeping us up to standard, Macrea babbles about discipline, and old Heffy sits between them sweating. I heard Oke telling Richards all about it in the basement when I went down to steal some bread.
        - id: ch01-b22
          speaker: mcturk
          text: What did Oke say?
        - id: ch01-b23
          speaker: narrator
          text: McTurk threw Eric into a corner.
        - id: ch01-b24
          speaker: stalky
          text: He said they made more noise than a nest of jackdaws and talked as though their servants had no ears. They picked apart everything old Prout had done or failed to do. Their own boys were splendid, of course, while his were terribly bad. Oke talked just like that, and Richards grew furious. Richards has some grudge against King. I wonder why.
        - id: ch01-b25
          speaker: beetle
          text: King makes sly remarks about Prout during lessons. Half the fellows are too stupid to understand him. Remember what he said about the “Casual House” on Tuesday? He meant us. They say he mocks Prout's house even when he talks to his own boys.
        - id: ch01-b26
          speaker: mcturk
          text: We didn't come here to join their quarrels. Who wants a swim after roll-call? King is taking it by the cricket field. Come on.
        - id: ch01-b27
          speaker: narrator
          text: McTurk grabbed his straw hat and led the way. They reached the sun-baked pavilion opposite the gray Pebbleridge just before roll-call. King's voice and manner told them his house was winning.
        - id: ch01-b28
          speaker: king
          text: Ah! At last, the ornaments of the Casual House. Cricket is beneath you, I believe. Judging by this afternoon, many others in your house agree. And what do your noble selves intend to do until tea?
        - id: ch01-b29
          speaker: narrator
          text: The boys in cricket clothes sniggered.
        - id: ch01-b30
          speaker: stalky
          text: We're going down to bathe, sir.
        - id: ch01-b31
          speaker: king
          text: And what inspired this sudden passion for cleanliness? Nothing about you particularly suggests it. Indeed, unless my memory fails, only a short time ago...
        - id: ch01-b32
          speaker: beetle
          text: Five years ago, sir.
        - id: ch01-b33
          speaker: narrator
          text: Beetle answered hotly, and King scowled.
        - id: ch01-b34
          speaker: king
          text: One of you was what we call a water-funk. Yes, afraid of the water. And now you wish to wash. Excellent. Cleanliness never hurt a boy, or a house. We shall continue with roll-call.
        - id: ch01-b35
          speaker: mcturk
          text: Why in the world did you answer him, Beetle?
        - id: ch01-b36
          speaker: narrator
          text: They walked toward the large open sea baths.
        - id: ch01-b37
          speaker: beetle
          text: It wasn't fair to remind me that I was afraid of the water. It was my first term. Heaps of boys are afraid before they learn to swim.
        - id: ch01-b38
          speaker: mcturk
          text: Yes, you ass, but you showed him he'd hurt you. Never answer King.
        - id: ch01-b39
          speaker: beetle
          text: It still wasn't fair, Stalky.
        - id: ch01-b40
          speaker: stalky
          text: My hat! Six years here, and you still expect fairness. You're a dithering idiot.
        - id: ch01-b41
          speaker: narrator
          text: A group from King's house was also going to the baths. They called after the three, begging them to wash for their house's honor.
        - id: ch01-b42
          speaker: stalky
          text: That's what King's meddling does. Those little animals would never have invented this without him. Now they'll keep it up for weeks. Ignore them.
        - id: ch01-b43
          speaker: narrator
          text: The boys came closer, shouting an insulting word. At last they moved upwind and held their noses with great ceremony.
        - id: ch01-b44
          speaker: beetle
          text: That's lovely. Next they'll say our whole house stinks.
        - id: ch01-b45
          speaker: narrator
          text: When the three came back, their hair was wet and they were peaceful after the swim. Beetle's prediction had already come true. In the corridor, Nixon, a very ordinary younger boy, held out a carefully wrapped piece of soap at arm's length. It came with the compliments of King's house.
        - id: ch01-b46
          speaker: stalky
          text: Wait. Don't hit him. Nixon, who told you to do this? Rattray and White? Thank you. There is no reply.
        - id: ch01-b47
          speaker: mcturk
          text: I'm sick of this rubbish being pushed at a fellow. Where's the sense in it? Where's the joke?
        - id: ch01-b48
          speaker: beetle
          text: It'll last until the end of term.
        - id: ch01-b49
          speaker: narrator
          text: Beetle shook his head sadly. He knew what it was to have a joke worn out on him. Within days, the school accepted it as fact that Prout's house never washed and therefore smelled. During class, one of King's boys drew away from Beetle with meaningful gestures, and Mr. King smiled richly.
        - id: ch01-b50
          speaker: king
          text: Something seems to be wrong with you, Beetle. Why else would Burton Major draw away as if protecting the hem of his clothes? I admit I do not understand. Would someone kindly enlighten me?
        - id: ch01-b51
          speaker: narrator
          text: Half the class kindly did so.
        - id: ch01-b52
          speaker: king
          text: Extraordinary. Most extraordinary. Still, every house has its traditions, and I would never interfere with them. We happen to favor washing. Continue from Jugurtha tamen, Beetle, and try to avoid your more outrageous guesses.
        - id: ch01-b53
          speaker: narrator
          text: Prout's house was furious when Macrea's and Hartopp's houses joined the insult. After dinner, every boy except the prefects attended an angry house meeting. The prefects sympathized, but their dignity kept them away. Badly written resolutions were read aloud. Speeches began with “Gentlemen, we have met on this occasion,” and ended with “It's a beastly shame,” as school speeches always had.
        - id: ch01-b54
          speaker: narrator
          text: Number Five study watched with its usual air of generous superiority. At last McTurk stood up, all narrow jaws and contempt.
        - id: ch01-b55
          speaker: mcturk
          text: You chatter, shout, and babble. That's all you can do. King's house will gloat because they've made you angry, and King will gloat with them. Besides, Orrin's resolution is stuffed with bad grammar. King will gloat over that too.
        - id: ch01-b56
          speaker: orrin
          text: I thought you and Beetle might correct it. Then we could post it in the corridor.
        - id: ch01-b57
          speaker: beetle
          text: Not if I know it. I'm not touching your business. It would only give King's house more reason to gloat. Turkey is right.
        - id: ch01-b58
          speaker: orrin
          text: Then won't Stalky help us?
        - id: ch01-b59
          speaker: narrator
          text: Stalky puffed his cheeks and squinted down his nose like Panurge.
        - id: ch01-b60
          speaker: stalky
          text: Oh, you miserable babblers!
        - id: ch01-b61
          speakers: [orrin, junior_1, junior_2]
          ensemble: chorus
          text: You three are beastly traitors!
          emotion: angry
        - id: ch01-b62
          speaker: narrator
          text: The three left under a storm of curses.
        - id: ch01-b63
          speaker: mcturk
          text: This is pointless. Let's get our saloon pistols and shoot rabbits.
    - id: ch02
      title: A Road Behind the Walls
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Three saloon pistols and a store of tiny bulleted caps lay in Stalky's trunk. The trunk stood in their three-bed attic dormitory. That room opened into a ten-bed dormitory, which connected with a long chain of rooms running nearly the entire length of the College. Macrea's house came next to Prout's, then King's, then Hartopp's. Locked doors divided the houses, but inside they had the same plan. The College had once been twelve large houses in a terrace, all beneath one straight roof.
        - id: ch02-b02
          speaker: narrator
          text: They found Stalky's bed pulled away from the wall beside the dormer window. The back half of Richards stuck out of a two-foot cupboard in the wall.
        - id: ch02-b03
          speaker: stalky
          text: What's this? I've never noticed it. What are you doing in there, Fatty?
        - id: ch02-b04
          speaker: richards
          text: Filling the basins, Master Corkran. These new pipes have been saving me trouble. Yes.
        - id: ch02-b05
          speaker: mcturk
          text: It certainly looks easy. Careful, or you'll get stuck.
        - id: ch02-b06
          speaker: narrator
          text: Richards backed out, puffing.
        - id: ch02-b07
          speaker: richards
          text: I can't reach it. That's the stopcock, Master McTurk. Last holidays they carried all the water pipes one floor higher and ran them under the slope of the eaves. But old Richards is too thick around the middle to crawl in after it.
        - id: ch02-b08
          speaker: stalky
          text: Let me try.
        - id: ch02-b09
          speaker: narrator
          text: Stalky dived into the opening.
        - id: ch02-b10
          speaker: richards
          text: Wriggle left, Master Corkran. Keep left and feel in the dark.
        - id: ch02-b11
          speaker: narrator
          text: Stalky squirmed left and saw a lead pipe vanishing into a triangular tunnel. Rafters and roof boards formed the top. Sharp joists made the floor, and rough wooden studs backed the plaster wall beneath the dormer.
        - id: ch02-b12
          speaker: stalky
          text: This is a curious place. How far does it go?
        - id: ch02-b13
          speaker: richards
          text: From end to end, Master Corkran, all under the eaves. Have you reached the stopcock? Mr. King had it fitted so we needn't carry water upstairs for the basins. There's no room there for a strong, well-fed man like me. Thank you, Master Corkran.
        - id: ch02-b14
          speaker: narrator
          text: Water spurted from the tap just inside the cupboard. Richards filled the basins and waddled gratefully away. The boys sat on their beds, wide-eyed, thinking about what they had found. Two floors below came the murmur of their angry house. Nothing is as still as a dormitory on a midsummer afternoon.
        - id: ch02-b15
          speaker: mcturk
          text: The little door must have been papered over before. If only we'd known about it sooner!
        - id: ch02-b16
          speaker: stalky
          text: Let's explore. No one comes up here at this hour, so we won't need a lookout.
        - id: ch02-b17
          speaker: narrator
          text: Stalky led them inside and pulled the door shut. On hands and knees, they started along a dark, dirty road filled with plaster, wood shavings, and every scrap builders leave behind. It was about three feet wide. Only weak light around the cupboard doors, one beside each dormer, broke the darkness.
        - id: ch02-b18
          speaker: stalky
          text: Here's Macrea's house. I can see Barnes's name on his trunk through the crack. Quiet, Beetle! This goes all the way through the College. Come on. Now we're in King's house. There's part of Rattray's trunk. These boards are murdering my knees.
        - id: ch02-b19
          speaker: narrator
          text: His fingernails scraped over plaster.
        - id: ch02-b20
          speaker: beetle
          text: That's the ceiling below us. Be careful. If we break it, the plaster will drop into the dormitory underneath.
        - id: ch02-b21
          speaker: mcturk
          text: Let's break it.
        - id: ch02-b22
          speaker: stalky
          text: And get caught at once? No, thanks. Look, I can push my hand a long way between these boards.
        - id: ch02-b23
          speaker: narrator
          text: Stalky drove his arm between the joists up to the elbow.
        - id: ch02-b24
          speaker: stalky
          text: There's no point staying here. Let's go back and think. It's a filthy little road, but I must thank King for his waterworks.
        - id: ch02-b25
          speaker: narrator
          text: They crawled out, brushed one another clean, slipped the pistols down a trouser leg, and hurried to a deep, empty Devon lane where a boy might sometimes shoot a young rabbit. Beneath the thick elder bushes, they lay down and thought aloud.
        - id: ch02-b26
          speaker: stalky
          text: We could hide our pistols in that tunnel perfectly.
        - id: ch02-b27
          speaker: narrator
          text: Beetle snorted, choked, and gurgled. He had been quiet since they left the dormitory.
        - id: ch02-b28
          speaker: beetle
          text: Have either of you read a book called The History of a House, or something like that? I borrowed it from the library. A Frenchwoman wrote it, Violet somebody. It's translated, and it's very interesting. It explains how houses are built.
        - id: ch02-b29
          speaker: stalky
          text: If you're desperate to learn that, go look at the new coastguard cottages.
        - id: ch02-b30
          speaker: beetle
          text: My hat, I will! Someone give me twopence.
        - id: ch02-b31
          speaker: stalky
          text: Nonsense. Stay here, and don't wander in the sun.
        - id: ch02-b32
          speaker: beetle
          text: Give me twopence.
        - id: ch02-b33
          speaker: mcturk
          text: Beetle, you aren't upset about something, are you?
        - id: ch02-b34
          speaker: narrator
          text: McTurk handed over the coins, but his voice was serious. Stalky often made plans alone, and McTurk sometimes did. In the whole history of their alliance, Beetle never had.
        - id: ch02-b35
          speaker: beetle
          text: No. I'm thinking.
        - id: ch02-b36
          speaker: stalky
          text: Then we'll come with you.
        - id: ch02-b37
          speaker: beetle
          text: I don't want you.
        - id: ch02-b38
          speaker: mcturk
          text: Leave him alone. A poem has taken him badly. He'll go babbling to the Pebbleridge and cough it all up in the study later.
        - id: ch02-b39
          speaker: stalky
          text: Then why did he need the twopence? He's becoming much too independent. Hullo, a rabbit! No, it's a cat. You shoot first.
        - id: ch02-b40
          speaker: narrator
          text: Twenty minutes later, Beetle stood with his straw hat pushed back and his hands in his pockets, watching workmen move around an unfinished cottage. He produced some ferocious tobacco. That gained him entry, and inside he asked question after question.
        - id: ch02-b41
          speaker: mcturk
          text: Let's hear your horrible epic.
        - id: ch02-b42
          speaker: narrator
          text: McTurk and Stalky burst into the study after an excellent adventure of their own. Beetle was buried in Viollet-le-Duc and a pile of drawings.
        - id: ch02-b43
          speaker: beetle
          text: Epic? What epic? I went down to the coastguard cottages.
        - id: ch02-b44
          speaker: stalky
          text: No poem? Then we shall kill you, Beetle. You're hiding something. I know that tone.
        - id: ch02-b45
          speaker: beetle
          text: Your Uncle Beetle is a great man.
        - id: ch02-b46
          speaker: stalky
          text: No, he certainly is not. You're deceiving yourself. Sit on him, Turkey!
        - id: ch02-b47
          speaker: narrator
          text: They knocked him to the floor.
        - id: ch02-b48
          speaker: beetle
          text: A great man! You two are useless babblers. Mind my tie! I am the Great Man. I gloat. Ow! Listen to me!
        - id: ch02-b49
          speaker: stalky
          text: Dear Beetle, we love you, and you're a poet. If I ever called you a dog, I apologize. But you know you can't do anything alone without spoiling it.
        - id: ch02-b50
          speaker: beetle
          text: I've got an idea.
        - id: ch02-b51
          speaker: stalky
          text: And you'll ruin it unless you tell Uncle Stalky. Out with it, darling, and we'll see what can be done. I knew you had a plan when you left. Turkey insisted it was a poem.
        - id: ch02-b52
          speaker: beetle
          text: I learned how houses are built. Let me up. The joists holding one floor are also the joists above the ceiling of the room below.
        - id: ch02-b53
          speaker: stalky
          text: Don't be disgustingly technical.
        - id: ch02-b54
          speaker: beetle
          text: That's what the builder told me. Floorboards lie across the joists, but they stop at each dividing wall. If you get behind that wall, as we did in the attic, you can push anything you like under the floor. It goes between the boards above and the plaster ceiling below. Look at my drawing.
        - id: ch02-b55
          speaker: narrator
          text: The rough sketch was enough. Modern schools taught the boys nothing about architecture, and none of them had ever wondered whether floors and ceilings were solid. Beyond his own interests, a boy could be as ignorant as the savage he admired. He could also be just as resourceful.
        - id: ch02-b56
          speaker: stalky
          text: I understand. That's where I pushed my hand. What next?
        - id: ch02-b57
          speaker: beetle
          text: They've called us stinkers all week. We could push something underneath. Sulphur, perhaps, or anything that smelled truly awful. Then we could stink them out. There must be a way.
        - id: ch02-b58
          speaker: narrator
          text: Beetle watched Stalky examine the drawing.
        - id: ch02-b59
          speaker: stalky
          text: Stinks? By gum, I have it! Truly horrible stinks! Turkey, think about this afternoon, just after Beetle left. She's exactly what we need!
          emotion: happy
        - id: ch02-b60
          speaker: mcturk
          text: Come into my arms, my shining boy! Oh, glorious day! Calloo, callay! She will do it. She will!
          emotion: happy
        - id: ch02-b61
          speaker: narrator
          text: Stalky and McTurk embraced and danced.
        - id: ch02-b62
          speaker: beetle
          text: Wait. I don't understand.
        - id: ch02-b63
          speaker: mcturk
          text: Dear man, you soon will. Artie, my pure young soul, let us introduce our darling Reggie to the Pestiferous Stinkadores.
        - id: ch02-b64
          speaker: stalky
          text: Not until after roll-call. Come on!
        - id: ch02-b65
          speaker: orrin
          text: The house is holding another meeting.
        - id: ch02-b66
          speaker: narrator
          text: Orrin spoke stiffly as they took their places along the gymnasium walls.
        - id: ch02-b67
          speaker: stalky
          text: Let them hold it.
        - id: ch02-b68
          speaker: orrin
          text: This one is about you three.
        - id: ch02-b69
          speaker: stalky
          text: Fine. Give them my love. Here, sir!
        - id: ch02-b70
          speaker: narrator
          text: He answered roll-call and tore down the corridor. The boys bounded, dodged, capered, and played like children as they led a nearly bursting Beetle to the rabbit lane. Beneath a heap of stones lay the newly killed body of a cat. At last Beetle understood. He loudly thanked heaven for putting warriors as wise as Stalky and McTurk into the world.
        - id: ch02-b71
          speaker: stalky
          text: She's a well-fed old lady. How long before she grows rather fragrant in a closed space?
        - id: ch02-b72
          speaker: mcturk
          text: Rather fragrant? What a coarse brute you are. Can't a poor cat crawl beneath King's dormitory and die without these nasty suggestions?
        - id: ch02-b73
          speaker: beetle
          text: What will they think she was doing under the floor?
        - id: ch02-b74
          speaker: stalky
          text: Once they find her, they won't worry about that.
        - id: ch02-b75
          speaker: mcturk
          text: A cat may look at a king!
        - id: ch02-b76
          speaker: narrator
          text: McTurk rolled down the bank laughing at his own joke.
        - id: ch02-b77
          speaker: mcturk
          text: Poor pussy, you have no idea how useful you'll be to three pure, high-minded boys.
        - id: ch02-b78
          speaker: beetle
          text: They'll have to lift the floor, just as they did in Number Nine when that rat died. Powerful medicine! Oh, I wish I could stop laughing.
        - id: ch02-b79
          speaker: mcturk
          text: Stinks! Thick, clammy stinks! And all for the honor of the house!
        - id: ch02-b80
          speaker: narrator
          text: The joke sent all three sliding down the bank in a tangle.
        - id: ch02-b81
          speaker: stalky
          text: And they're holding a meeting about us! Come on. We must remove the bullet and hurry. The sooner she's planted, the better.
        - id: ch02-b82
          speaker: narrator
          text: Working together with a penknife, they did the ugly job. One of them buttoned the corpse inside his clothes, though no one need ask which. Then they raced back while Stalky laid out the plan.
        - id: ch02-b83
          speaker: narrator
          text: Afternoon sunlight lay in broad patches across the bed rugs. Three boys and an umbrella vanished into the dormitory wall. Five minutes later they came out, brushed off their clothes, washed their hands, combed their hair, and went downstairs.
        - id: ch02-b84
          speaker: mcturk
          text: Are you certain you pushed her far enough?
        - id: ch02-b85
          speaker: stalky
          text: Of course. I drove her the full length of my arm and Beetle's umbrella. That's nearly six feet. She's right under the middle of King's large ten-bed dormitory. A fine central position. Once she truly begins, she'll drive out King's boys, Hartopp's boys, and Macrea's too. Admit that Uncle Stalky is a great man, Beetle.
        - id: ch02-b86
          speaker: beetle
          text: I had the idea first. Only...
        - id: ch02-b87
          speaker: stalky
          text: But you couldn't have managed it without Uncle Stalky.
        - id: ch02-b88
          speaker: mcturk
          text: They've called us stinkers for a week. Just wait until they get their share!
        - id: ch02-b89
          speaker: narrator
          text: A cry of “Stinker!” rang along the corridor.
        - id: ch02-b90
          speaker: stalky
          text: And there she lies, preparing her surprise. Soon she'll whisper in their dreams. Then she'll breathe on them. My goodness, how she'll breathe! Be kind enough to think about it in silence.
        - id: ch02-b91
          speaker: narrator
          text: They reached the study almost quietly. Then they began to laugh as only boys can. They laughed with their foreheads on the table and their bodies on the floor. They doubled over chair backs, clung to shelves, and laughed until they went limp.
        - id: ch02-b92
          speaker: narrator
          text: Orrin entered in the middle of it, representing the house.
        - id: ch02-b93
          speaker: stalky
          text: Don't mind us, Orrin. Sit down. You cannot imagine how deeply we respect you. That pure, noble forehead, filled with the dreams of innocent boyhood, is wonderfully attractive.
        - id: ch02-b94
          speaker: orrin
          text: The house sent me to give you this.
        - id: ch02-b95
          speaker: narrator
          text: He laid a folded paper on the table and withdrew with terrible dignity.
        - id: ch02-b96
          speaker: beetle
          text: It's their resolution! Someone read it. I'm too helpless with laughter to see.
        - id: ch02-b97
          speaker: narrator
          text: Stalky opened the paper and gave it a careful sniff.
        - id: ch02-b98
          speaker: stalky
          text: Listen. “The house observes with pain and contempt the indiference shown by Number Five study toward the insults offered to Mr. Prout's house at the recent meeting. The house therefore censures Number Five study.” Beetle, how many f's belong in indifference?
        - id: ch02-b99
          speaker: beetle
          text: Two would be best.
        - id: ch02-b100
          speaker: stalky
          text: They only used one. That's the entire resolution.
        - id: ch02-b101
          speaker: beetle
          text: And she bled all the way down my shirt!
        - id: ch02-b102
          speaker: mcturk
          text: I still smell of cat, though I washed twice.
        - id: ch02-b103
          speaker: stalky
          text: And I nearly snapped Beetle's umbrella while planting her where she could blossom!
        - id: ch02-b104
          speaker: narrator
          text: Words failed them, but laughter did not. That night, boys in their dormitory tried to organize a beating for the three. Number Five came out to meet them.
        - id: ch02-b105
          speaker: beetle
          text: Your trouble is simple. You're a pack of thoughtless asses without the brains of sparrows. We've explained that often enough.
        - id: ch02-b106
          speaker: junior_1
          text: We'll give all three of you a dormitory licking. You order us about as though you were prefects.
          emotion: angry
        - id: ch02-b107
          speaker: stalky
          text: No, you won't. You know we'd repay you sooner or later, and we are in no hurry. We can wait for revenge. You've made complete fools of yourselves. As soon as King sees your precious resolution tomorrow, you'll discover how foolish. If you aren't miserable by tomorrow night, I'll eat my hat.
    - id: ch03
      title: The Cat Begins to Speak
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before the next day's dinner bell, Prout's house understood its mistake. King received stray Prout boys with exaggerated terror. Were they planning to dismiss him from the College by unanimous resolution? How did they wish the school governed, so he could obey at once? He would never dream of offending them. Still, he feared that his own clean and resolution-free house might laugh.
        - id: ch03-b02
          speaker: narrator
          text: King was happy. His boys warmed themselves in his approval and made that afternoon a long punishment for Prout's house. Prout himself looked dark and puzzled. He tried to decide why his house had been called stinkers and only confused himself further. It was a small matter, but he had been taught that straws showed the wind and smoke proved a fire. He approached King in Common-room with a grievance. King met him with airy jokes and danced circles around every argument.
        - id: ch03-b03
          speaker: stalky
          text: Well, what have you all got to say now? Foster, Carton, Finch, Longbridge, Marlin, Brett! King made hay of you. All you could do was twist, grin, and say, “Yes, sir,” “No, sir,” and “Please, sir.” What a splendid band of resolution-makers!
        - id: ch03-b04
          speaker: narrator
          text: At bedtime Stalky made a tour of the dormitories before the prefects arrived.
        - id: ch03-b05
          speaker: junior_2
          text: Oh, shut up, Stalky.
        - id: ch03-b06
          speaker: stalky
          text: Not a chance. You made a lovely mess. Perhaps next time you'll have the decency to leave us alone.
        - id: ch03-b07
          speaker: narrator
          text: The house grew angry. Many voices insisted the disaster could never have happened if Number Five had helped at the beginning.
        - id: ch03-b08
          speaker: orrin
          text: You three are horribly conceited. You marched into the meeting as if the rest of us were idiots.
        - id: ch03-b09
          speaker: stalky
          text: That's exactly what you are. We've been trying to beat that fact into your thick heads. Never mind. We forgive you. You can't help being asses.
        - id: ch03-b10
          speaker: narrator
          text: With the enemy's flank neatly turned, Stalky hopped into bed.
        - id: ch03-b11
          speaker: narrator
          text: That night brought the first sorrow to the triumphant house of King. Under-floor drafts carried the cat's warning not into the dormitory above her, but into the next one. At first it was less a sharp smell than a pale blue feeling in the air. That was enough for the sensitive noses and clean tongues of boys. Decency must cover with disinfected sheets everything that dormitory said to Mr. King, and everything he said in return. He truly loved his house and cared fiercely for its comfort. He came, he sniffed, and he spoke.
        - id: ch03-b12
          speaker: narrator
          text: Next morning, one boy whispered to his closest friend in Macrea's house that King's dormitory had a secret trouble. That friend told a wild-haired younger boy in Prout's house. The Prout boy pulled out every detail and then cried the news down the corridor in a voice like a squeaking bat.
        - id: ch03-b13
          speaker: thornton
          text: They've called us stinkers all week, but Harland Minor says the boys in his dormitory can't sleep because of the smell. Come on!
        - id: ch03-b14
          speaker: narrator
          text: "With one shout, Prout's younger boys charged into the war. Between first and second lesson, about fifty twelve-year-olds fought and danced on the gravel beneath King's windows. Every part of their song returned to one word: stinker."
        - id: ch03-b15
          speaker: stalky
          text: Hear the warning cannon at sea! King's noble forehead looked cloudy at prayers. She is coming, Sister Mary. She is coming.
        - id: ch03-b16
          speaker: narrator
          text: Number Five was collecting books for second lesson, Latin with King.
        - id: ch03-b17
          speaker: beetle
          text: If they make this noise now, what will happen when she truly wakes up?
        - id: ch03-b18
          speaker: stalky
          text: No vulgar answers, Beetle. We shall keep clear of the quarrel like gentlemen.
        - id: ch03-b19
          speaker: mcturk
          text: Only a little faded flower. Where is my Horace? I don't understand why she attacked Rattray's dormitory first. Didn't we put her beneath White's?
        - id: ch03-b20
          speaker: stalky
          text: She's a playful little creature. I suppose she's romping everywhere.
        - id: ch03-b21
          speaker: beetle
          text: My aunt! King will be cheerful in class, and I haven't prepared a single line of Horace. Come on.
        - id: ch03-b22
          speaker: narrator
          text: They reached the classroom door five minutes before the bell. King might appear at any instant. McTurk drove into a swarm of fighting younger boys, pulled out Thornton, Harland's friend, and ordered him to tell the story. The boy's simple account kept breaking into tears. King's house had already beaten him for slander.
        - id: ch03-b23
          speaker: mcturk
          text: It's nothing serious. He only says King's house stinks.
        - id: ch03-b24
          speaker: stalky
          text: Old news! We knew that years ago. We simply had too many manners to run about yelling “stinker.” Grab one of King's younger boys, Turkey, and let us test the report.
        - id: ch03-b25
          speaker: narrator
          text: McTurk's long arm caught an anxious boy from the Lower Second.
        - id: ch03-b26
          speaker: lower_second_boy
          text: Please let me go, McTurk. I don't smell. I swear I don't!
          emotion: fearful
        - id: ch03-b27
          speaker: beetle
          text: What a guilty conscience! Who accused you?
        - id: ch03-b28
          speaker: stalky
          text: What do you think, Beetle?
        - id: ch03-b29
          speaker: narrator
          text: Stalky kicked the small boy gently into Beetle's arms.
        - id: ch03-b30
          speaker: beetle
          text: Sniff, sniff. He does smell. I think it's leprosy, or thrush. Possibly both. Take it away.
        - id: ch03-b31
          speaker: king
          text: Master Beetle, we are deeply grateful for your diagnosis. It reflects almost as much honor on the natural sickness of your mind as on your miserable ignorance of those diseases. We shall now test your knowledge in other subjects.
        - id: ch03-b32
          speaker: narrator
          text: King usually appeared at his house door just as the bell rang. The lesson was lively. In his haste to cut Beetle apart, King forgot to give him extra work. Better still, he supplied many priceless adjectives for future use. During third lesson, algebra with little Hartopp, Beetle worked seriously on a poem called The Lazar-house.
        - id: ch03-b33
          speaker: narrator
          text: After dinner, King took his house to bathe in the sea by the Pebbleridge. He had promised them long ago, though now he wished he could escape it. Every boy in Prout's house lined up by the Fives Court and cheered with purpose. While King was away, at least half the school invaded the infected dormitory and judged for themselves. The cat had strengthened greatly in twelve hours. The spies reported that a battlefield after five days could not have been more magnificent.
        - id: ch03-b34
          speaker: stalky
          text: My word, she's doing splendidly. Have you ever smelled anything like it? And she hasn't even reached White's dormitory yet.
        - id: ch03-b35
          speaker: beetle
          text: She will. Give her time. She'll climb through the place like a wild honeysuckle. What dreadful Lazarites! No school house has the right to make itself a stench in the nostrils of decent...
        - id: ch03-b36
          speaker: mcturk
          text: High-minded, pure-souled boys. Tell me, do you burn with remorse and regret?
        - id: ch03-b37
          speaker: narrator
          text: They hurried to meet King's house returning from the sea. King had left his boys, so everyone could speak freely. A mixed crowd from every house darted and reformed around them, screaming insults. Older boys marched along the sides and threw one ancient joke after another. Stalky, McTurk, and Beetle joined with distant, almost sorrowful dignity.
        - id: ch03-b38
          speaker: stalky
          text: They look perfectly normal. Surely it can't be Rattray. Rattray? Dear Rattray? No answer. He seems upset. Listen, old man, we don't hold that piece of soap against you. Cheer up. You'll live it down. Perhaps only a few younger boys are affected. Your house is terribly slack, though.
        - id: ch03-b39
          speaker: mcturk
          text: You aren't going back indoors, are you? You cannot imagine the reek up there. Since you usually live in stale air, perhaps you wouldn't notice. But after your lovely wash and the clean sea breeze, even you might suffer. Camp on the Burrows instead. We'll find you straw. Shall we?
        - id: ch03-b40
          speaker: narrator
          text: King's boys wanted nothing more than to get inside. They hurried to their form-room while affectionate schoolmates sang John Brown's Body, then barricaded the door. Stalky immediately chalked a large cross upon it and wrote, “Lord, have mercy upon us.” He left it for King.
        - id: ch03-b41
          speaker: narrator
          text: That night the wind changed. A carrion smell drifted into Macrea's dormitories. Boys in nightshirts hammered on the locked dividing door and begged King's house to wash. Next morning, each boy of Number Five carried nearly half a pound of camphor in his clothes. King was too wary to ask why. He spluttered at them and threw them out of class, leaving Beetle free to finish another poem in the study.
        - id: ch03-b42
          speaker: stalky
          text: Malpas says they're using carbolic acid now. King thinks the drains are responsible.
        - id: ch03-b43
          speaker: mcturk
          text: She'll need a great deal of carbolic. Still, there's no harm in trying. It keeps King occupied.
        - id: ch03-b44
          speaker: stalky
          text: I thought he'd murder me when I sniffed in class. He didn't object when Burton Major sniffed at me last week. He never stopped Alexander shouting “Stinker!” into our room before we treated them. He only grinned. Beetle, why was he foaming at you?
        - id: ch03-b45
          speaker: beetle
          text: Ah, that was my subtle joke. I toasted him nicely. You know his endless speeches about the learned Lipsius.
        - id: ch03-b46
          speaker: mcturk
          text: The one who did something remarkable at four years old?
        - id: ch03-b47
          speaker: beetle
          text: That's the man. King mentions him whenever he hears I've written a poem. As I sat down, I whispered to Burton, “How is our learned Lepsius?” Burton grinned without understanding, but King understood perfectly. That's why he threw us out. Aren't you grateful? Now be quiet. I'm writing The Ballad of the Learned Lipsius.
        - id: ch03-b48
          speaker: stalky
          text: Avoid anything coarse. I would hate to be coarse on such a happy occasion.
        - id: ch03-b49
          speaker: beetle
          text: Never in the world. What rhymes with stenches?
    - id: ch04
      title: King Hears His Own Voice
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At lunch in Common-room, King spoke bitterly to Prout about boys with dirty minds. They twisted their few poisonous talents, he said, to weaken discipline, corrupt other boys, spread foul images, and destroy respect.
        - id: ch04-b02
          speaker: prout
          text: You showed no concern when your house called us stinkers. If you had not repeatedly assured me that you never interfere with another man's house, I might almost suspect that remarks of yours began this nonsense.
        - id: ch04-b03
          speaker: narrator
          text: Prout had suffered enough. King always brought his temper to meals.
        - id: ch04-b04
          speaker: chaplain
          text: You spoke to Beetle yourself, didn't you? Something about his not bathing and being afraid of the water? I was keeping score at the pavilion that day.
        - id: ch04-b05
          speaker: king
          text: Perhaps I did, as a joke. I cannot remember every remark I make among small boys. And I know perfectly well that Beetle has no feelings to injure.
        - id: ch04-b06
          speaker: chaplain
          text: Perhaps not. But he and his friends have a devilish gift for finding a man's weak spot. I admit I take special care to keep peace with Number Five. It may be softness, but I am the only master they have not driven mad with their attentions.
        - id: ch04-b07
          speaker: king
          text: That has nothing to do with the matter. I can manage those boys alone when necessary. But if people who ought to give open and absolute justice support them, then my position is a hard one indeed. Nothing disgusts me more than disloyalty among ourselves.
        - id: ch04-b08
          speaker: narrator
          text: The Common-room glanced sideways at one another. Prout reddened.
        - id: ch04-b09
          speaker: prout
          text: I deny that completely. In fact, I personally dislike all three boys. Therefore it would not be fair to...
        - id: ch04-b10
          speaker: king
          text: How long do you intend to permit this?
        - id: ch04-b11
          speaker: macrea
          text: Surely any blame belongs to you, King. You cannot hold those boys responsible for the stink in your house, if we may use your good plain word. My dormitories smell it now.
        - id: ch04-b12
          speaker: hartopp
          text: What else can you expect? Boys will use an opportunity dropped straight from heaven. What exactly is wrong in your dormitories, King?
        - id: ch04-b13
          speaker: narrator
          text: King explained at length. Since he never interfered with another man's house, he expected the same courtesy. He had taken every step his poor judgment suggested. He had even spent his own money on disinfectants without asking repayment. Bitter experience had taught him that the College was slow, careless, and badly managed. Some houses now judging him were almost as badly managed. He recited his career, listed his degrees, and marched out, slamming the door.
        - id: ch04-b14
          speaker: chaplain
          text: Ah, ours is a life that shrinks a man. God help all schoolmasters. They need it.
        - id: ch04-b15
          speaker: prout
          text: I admit I dislike those boys, and I know I'm not a strong man. But I see no reason to punish Stalky and the others merely because King is annoyed by... by...
        - id: ch04-b16
          speaker: hartopp
          text: By falling into the hole he dug himself. Certainly not, Prout. Nobody accuses you of setting houses against one another through laziness.
        - id: ch04-b17
          speaker: chaplain
          text: A shrinking life indeed. I must correct French exercises. Before dinner, King will crush some unlucky thirteen-year-old. Then he'll repeat every brilliant answer to us, and everything will be right again.
        - id: ch04-b18
          speaker: prout
          text: But are those three truly so foul-minded?
        - id: ch04-b19
          speaker: hartopp
          text: Nonsense. Think for one minute, Prout. Every bit of the “early flood of disgusting imagery” that annoys King came directly from King himself. He raised the feather that guides the arrow. Naturally he dislikes being struck. Come into the smoking-room. We should not listen to boys, but they ought to be tormenting King's house outside by now. Little minds enjoy little things.
        - id: ch04-b20
          speaker: narrator
          text: The dingy room beside Common-room held nothing but masters' gowns. Its windows were frosted, so no one could see out, but nearly every word from the gravel came through. A light, careful step approached from Number Five.
        - id: ch04-b21
          speaker: mcturk
          text: Rattray! Is Mr. King anywhere nearby? I've got a...
        - id: ch04-b22
          speaker: narrator
          text: McTurk left the sentence carefully unfinished. Rattray's study faced the gravel.
        - id: ch04-b23
          speaker: rattray
          text: No. He's gone out.
        - id: ch04-b24
          speaker: mcturk
          text: Ah, the learned Lipsius is taking the air. His Royal Highness has gone to fumigate.
        - id: ch04-b25
          speaker: narrator
          text: McTurk climbed onto the railings and spoke like a rook that never tired.
        - id: ch04-b26
          speaker: mcturk
          text: Now nowhere in the College was there a stink like the stink of King's house. It stank mightily, and nobody understood it except King. He washed the younger boys one by one in the fishpools of Hesbon, wearing an apron around his waist.
        - id: ch04-b27
          speaker: rattray
          text: Shut up, you mad Irishman!
          emotion: angry
        - id: ch04-b28
          speaker: narrator
          text: A golf ball shot through the gravel.
        - id: ch04-b29
          speaker: mcturk
          text: Anger won't help, Rattray. We've come to amuse you. Beetle, they're all home. You can wind them up.
        - id: ch04-b30
          speaker: beetle
          text: Where is the Great Lord of Stink? A pure and high-minded boy risks his health near this house. He's gone? Never mind. I'll serve as your guardian, Rattray. I have a few words for you, my young friend. We shall talk together for a while.
        - id: ch04-b31
          speaker: narrator
          text: In the hidden room, Macrea whispered that Beetle had borrowed one of Prout's favorite phrases. Prout spluttered when Beetle changed to a strained imitation of King's voice.
        - id: ch04-b32
          speaker: beetle
          text: I repeat, Master Rattray, we shall confer. We shall not discuss stinks, because stink is a loathsome and indecent word. With your permission, which I trust you grant, we shall examine this ugly eruption of hidden wickedness. What troubles me is not merely that you stagger outside beneath a load of decay. It is the shameless pleasure you take in your horrible aromas. I would never interfere with another man's house.
        - id: ch04-b33
          speaker: prout
          text: Good Lord. That truly is King.
        - id: ch04-b34
          speaker: hartopp
          text: Word for word and letter for letter. Keep listening.
        - id: ch04-b35
          speaker: beetle
          text: To say you stink, as certain low fellows claim, is to say almost nothing. While your beloved house-master is away, a man whom I respect beyond measure, allow me to explain the unmatched horror of the stenches with which you have infected this house. I believe in the good old plain word, stenches, sir. Oh, bother, I've forgotten the rest. It was beautiful. Aren't you grateful, Rattray? Most fellows would never work so hard to improve you.
        - id: ch04-b36
          speaker: mcturk
          text: We're terribly grateful. We remember the soap, and we're polite. Why aren't you polite, Rat?
        - id: ch04-b37
          speaker: stalky
          text: Hullo! Lecturing the Whiffers? I'm afraid they're too wicked to repent. Rattray! White! Perowne! Malpas! Nobody answers. How distressing. Bring out your dead, you diseased lepers!
        - id: ch04-b38
          speaker: narrator
          text: Stalky trotted up with his cap over one eye. His final cry broke through Rattray's dignity.
        - id: ch04-b39
          speaker: rattray
          text: You think you're funny. It's only a dead rat or something beneath the floor. We're lifting the boards tomorrow.
        - id: ch04-b40
          speaker: stalky
          text: Don't blame a poor speechless animal, especially a dead one. I hate dishonesty. Upon my soul, Rattray...
        - id: ch04-b41
          speaker: beetle
          text: Stop there. Hartopp has never said “upon my soul” in his entire little life.
        - id: ch04-b42
          speaker: narrator
          text: Hidden nearby, Prout softly pointed out that hit to Hartopp.
        - id: ch04-b43
          speaker: stalky
          text: Upon my word, sir, I expected better from you. Why not confess like a man? Have I ever shown that I lacked confidence in you?
        - id: ch04-b44
          speaker: hartopp
          text: It isn't cruelty. It's simply boy. Nothing but boy.
        - id: ch04-b45
          speaker: narrator
          text: Hartopp seemed to answer a question no one had asked.
        - id: ch04-b46
          speaker: stalky
          text: And this was the house, the open sewer, that dared call us stinkers! Now it hides behind a dead rat. You annoy me, Rattray. You disgust me. You irritate me beyond words. Thank heaven I possess an even temper.
        - id: ch04-b47
          speaker: prout
          text: That one belongs to you, Macrea.
        - id: ch04-b48
          speaker: macrea
          text: I fear it does.
        - id: ch04-b49
          speaker: stalky
          text: Otherwise I could hardly control myself before your mocking face.
        - id: ch04-b50
          speaker: beetle
          text: Watch out!
        - id: ch04-b51
          speaker: narrator
          text: Beetle had seen King sailing down the corridor.
        - id: ch04-b52
          speaker: king
          text: And what are my little friends doing here? I had a passing notion, though you may correct me, that if I found you outside my house, I would give you severe punishment.
        - id: ch04-b53
          speaker: narrator
          text: Every master behind the frosted window choked at the familiar phrase.
        - id: ch04-b54
          speaker: beetle
          text: We were just leaving for a walk, sir.
        - id: ch04-b55
          speaker: king
          text: And you paused to speak to Rattray on the way?
        - id: ch04-b56
          speaker: rattray
          text: Yes, sir. We've been throwing golf balls.
        - id: ch04-b57
          speaker: narrator
          text: Rattray came out of the study. Hartopp quietly praised his diplomacy. Every word was true.
        - id: ch04-b58
          speaker: king
          text: So you were playing with them. I cannot admire your choice of companions. I feared they were indulging in the dirty talk they have lately spread everywhere. In future, choose your path very carefully. Pick up those golf balls.
        - id: ch04-b59
          speaker: narrator
          text: King walked on.
    - id: ch05
      title: What Lay Beneath the Floor
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Next day, Richards received orders to lift a dormitory floor because King believed something had died beneath it. Richards had once been a carpenter in the Navy, and the College gave him its odd repair jobs.
        - id: ch05-b02
          speaker: king
          text: We need not abandon all work over a petty event, though I know small things delight small minds. I have ordered Richards to lift the boards after lunch. Certain so-called intellects will find it fascinating. However, any boy from any house caught on the dormitory stairs will receive three hundred lines.
        - id: ch05-b03
          speaker: narrator
          text: No boys gathered on the stairs. Nearly all of them waited outside King's house instead. Richards had been commanded to call the news from the attic window and, if possible, display the body.
        - id: ch05-b04
          speaker: richards
          text: It's a cat! A dead cat!
        - id: ch05-b05
          speaker: narrator
          text: His purple face appeared at the window. He had spent a long time on his knees in that chamber of death.
        - id: ch05-b06
          speaker: mcturk
          text: Cat, nothing! It's a dead younger boy left from last term. Three cheers for King's dead boy!
        - id: ch05-b07
          speaker: narrator
          text: The school cheered with all its strength.
        - id: ch05-b08
          speakers: [junior_1, junior_2, junior_3]
          ensemble: chorus
          text: Show us! Let us see it! Give it to the Bug-hunters! The cat looked at King and died! Hiss! Yowl! Miaow!
        - id: ch05-b09
          speaker: narrator
          text: Richards appeared again.
        - id: ch05-b10
          speaker: richards
          text: She's been... dead a long time.
        - id: ch05-b11
          speaker: narrator
          text: He stopped himself suddenly. The whole school roared.
        - id: ch05-b12
          speaker: stalky
          text: Come along for a walk. The whole affair is disgusting, and I truly hope the Lazar-house never does it again.
        - id: ch05-b13
          speaker: kings_boy
          text: Does what?
          emotion: angry
        - id: ch05-b14
          speaker: stalky
          text: Kills an innocent cat whenever it wants an excuse not to wash. It's difficult enough to tell you apart already. Personally, I prefer the cat. She doesn't smell quite so strong. Beetle, what are your plans?
        - id: ch05-b15
          speaker: beetle
          text: I am going to gloat. I shall gloat all this blessed afternoon. Never have I gloated as I shall gloat today. We shall hide among the bunkers.
        - id: ch05-b16
          speaker: narrator
          text: The proposal pleased them, and away they went.
        - id: ch05-b17
          speaker: narrator
          text: Down in the basement, gaslight flickered over long racks of boots. Richards stood among his blacking brushes and told the story to Oke from Common-room, Gumbly from the dining hall, and Lena from the laundry.
        - id: ch05-b18
          speaker: richards
          text: Yes, she was in a shocking state. Nearly made me sick, I tell you. But I rooted her out and left everything shipshape, though she smelled worse than a ship's bilge.
        - id: ch05-b19
          speaker: lena
          text: Poor creature must have died while hunting mice.
        - id: ch05-b20
          speaker: richards
          text: Then she hunted differently from every cat God ever made. When I lifted the top board, she lay flat on her back. I turned her with the broom handle, and her back was covered in plaster from between the laths. Beneath her head was a little pillow of plaster, pushed ahead as she slid along. No cat hunts mice on its back, Lena. Someone shoved her as far under that floor as they could. Cats don't make pillows before they die. She was pushed in there when she was only beginning to grow cold.
        - id: ch05-b21
          speaker: lena
          text: Oh, you're much too clever to live, Fatty. Go and marry someone who can teach you sense.
        - id: ch05-b22
          speaker: narrator
          text: Lena was promised to Gumbly.
        - id: ch05-b23
          speaker: richards
          text: I learned a thing or two before certain young women were born. I served in the Queen's Navy, where a man learns to use his eyes. You mind your own work, Lena.
        - id: ch05-b24
          speaker: oke
          text: Do you truly mean everything you've told us?
        - id: ch05-b25
          speaker: richards
          text: Ask me no questions, and I'll tell you no lies. There was a clean bullet hole straight through her and two ribs by the heart snapped like twigs. I saw them when I turned her over. Those boys are clever, yes, but not too clever for old Richards. The truth was right on the tip of my tongue upstairs. But King said we never washed. He let his damned boys call us stinkers. So it serves him damned well right!
        - id: ch05-b26
          speaker: narrator
          text: Richards spat onto a fresh boot, bent to his work, and chuckled.
