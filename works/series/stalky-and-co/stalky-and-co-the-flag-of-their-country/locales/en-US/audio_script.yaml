  chapters:
    - id: ch01
      title: The Old Brigade
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Winter mornings were bitterly cold. Stalky and Beetle stayed drowsing until the last possible moment before call-over in the gas-lit gym. McTurk always made an elaborate toilet, whatever the weather, so he escaped their habit. The other two were often late. Every lateness earned a black mark, and three black marks in one week meant defaulters' drill. That was how Stalky and Beetle came to spend hour after hour under Sergeant Foxy's command.
        - id: ch01-b02
          speaker: foxy
          text: Don't imagine this is any pleasure for me. I'd much rather be smoking a quiet pipe in my quarters. But it seems I have the Old Brigade on my hands again this afternoon. If only I had you regularly, Master Corkran.
        - id: ch01-b03
          speaker: stalky
          text: You have had me regularly for nearly six weeks, you old glutton. Number from the right!
        - id: ch01-b04
          speaker: foxy
          text: Not quite so fast, please. I am commanding this drill. Left, half turn. Slow march.
        - id: ch01-b05
          speaker: narrator
          text: Twenty-five sleepy old offenders filed into the gymnasium. Foxy ordered them to collect dumbbells quietly, return to their places, number in low voices, and separate the odd numbers from the even. Then they bent from the hips and followed his time. The dumbbells rose, fell, clashed, and came back together. Every boy knew this weary game by heart.
        - id: ch01-b06
          speaker: foxy
          text: Very good. I shall be sorry when any of you return to punctual habits. Put the dumbbells away quietly. Now we'll attempt some simple drill.
        - id: ch01-b07
          speaker: stalky
          text: Ugh! I know your simple drill.
        - id: ch01-b08
          speaker: foxy
          text: It would be highly discreditable if you did not, Master Corkran. Even so, the drill isn't as easy as it looks.
        - id: ch01-b09
          speaker: stalky
          text: Bet you a shilling I can drill them as well as you can, Foxy.
        - id: ch01-b10
          speaker: foxy
          text: We can test that later. For now, imagine you aren't defaulters. Imagine you're half a company on parade and I'm your commanding officer. There's nothing to laugh at. If you're lucky, most of you will drill for half your lives. Try to do me some credit. Goodness knows you've practiced long enough.
        - id: ch01-b11
          speaker: narrator
          text: He formed them into fours. They marched, wheeled, and countermarched, caught by the force of moving together under orders. Foxy was right. They had done this for a very long time. Then the gym door opened, and McTurk came in with an elderly gentleman. Foxy was leading a wheel and did not notice them.
        - id: ch01-b12
          speaker: foxy
          text: Not bad. Not half bad. The pivot man only marks time, Master Swayne. Now, Master Corkran, you claim to know the drill. Take command, reverse my orders one by one, and return them to their former formation.
        - id: ch01-b13
          speaker: general_collinson
          text: What's this? What's going on here?
        - id: ch01-b14
          speaker: foxy
          text: Only a little drill, sir.
        - id: ch01-b15
          speaker: general_collinson
          text: Excellent! I wish there were more of it. Please don't let me interrupt. You were about to hand command to someone, weren't you?
        - id: ch01-b16
          speaker: narrator
          text: The visitor sat in the freezing gym, his breath white in the air. A whisper passed along the rear rank. This was General Collinson, a member of the College Council.
        - id: ch01-b17
          speaker: stalky
          text: I'm going to make a mess of it. I know I am.
        - id: ch01-b18
          speaker: swayne
          text: That's Collinson, K.C.B. He commanded the Pompadours, my father's old regiment.
        - id: ch01-b19
          speaker: foxy
          text: What was that?
        - id: ch01-b20
          speaker: general_collinson
          text: Take your time. I know exactly how it feels. This is your first drill, eh?
        - id: ch01-b21
          speaker: stalky
          text: Yes, sir. Company, attention! Dress!
        - id: ch01-b22
          speaker: narrator
          text: Hearing his own command echo through the gym gave Stalky back his confidence. He faced the wheel about, sent it back, broke it into fours, and restored the line without one mistake. Punishment time had long since ended, but nobody cared. They were supporting Stalky, while Stalky fought the deadly fear that his voice might crack.
        - id: ch01-b23
          speaker: general_collinson
          text: That boy does you credit, Sergeant. Good drill, and good material. Yet I've just had lunch with your Head, and he never mentioned a cadet corps here.
        - id: ch01-b24
          speaker: foxy
          text: We don't have one, sir. This is only a little drill.
        - id: ch01-b25
          speaker: mcturk
          text: But you can see how keen they are, can't you?
        - id: ch01-b26
          speaker: general_collinson
          text: Why aren't you drilling too, Willy?
        - id: ch01-b27
          speaker: mcturk
          text: I'm not punctual enough. The Sergeant only accepts the very best of us.
        - id: ch01-b28
          speaker: foxy
          text: Dismiss! Break off! Sir, I ought to explain that—
        - id: ch01-b29
          speaker: general_collinson
          text: You ought to have a cadet corps. And you shall have one, if my recommendation carries any weight with the Council. I haven't been so pleased in years. Boys with a spirit like this should set an example to the whole school.
        - id: ch01-b30
          speaker: mcturk
          text: They certainly do.
        - id: ch01-b31
          speaker: general_collinson
          text: Bless my soul, is it so late? My carriage has waited half an hour. Nothing beats seeing things for oneself. Which way is the exit, Willy? And who was the boy who commanded?
        - id: ch01-b32
          speaker: mcturk
          text: Corkran, I think.
        - id: ch01-b33
          speaker: general_collinson
          text: You should know him. That's the sort of boy worth cultivating. Quite unusual. Twenty-five boys drilling from pure love of it, when they'd much rather be playing cricket! It would be shameful to waste such fine material. I believe I can carry this proposal.
        - id: ch01-b34
          speaker: narrator
          text: It was the deepest winter, but grown people who have lived abroad make little mistakes about cricket. McTurk did not correct him.
        - id: ch01-b35
          speaker: stalky
          text: Who was your friend with the white whiskers?
        - id: ch01-b36
          speaker: mcturk
          text: General Collinson. He shoots with my father sometimes. He's a fairly decent old fellow. He says I ought to cultivate you, Stalky.
        - id: ch01-b37
          speaker: stalky
          text: Did he tip you?
        - id: ch01-b38
          speaker: narrator
          text: McTurk displayed one whole golden sovereign. Stalky, the boys' treasurer, promptly took possession of it.
        - id: ch01-b39
          speaker: stalky
          text: Excellent. We'll have a tremendous feast. You had outrageous cheek, Turkey, talking about our keenness and punctuality.
        - id: ch01-b40
          speaker: beetle
          text: Didn't he know you were all defaulters?
        - id: ch01-b41
          speaker: mcturk
          text: Not a bit. He came to lunch with the Head, then wandered around alone. I thought I'd show him the drill. Once I saw how delighted he was, I wasn't going to cool his enthusiasm. He might have kept the sovereign.
        - id: ch01-b42
          speaker: beetle
          text: Foxy was delighted too. Did you see him turn pink behind the ears? It was a glorious victory for him, and we supported him beautifully. Let's go to Keyte's for cocoa and sausages.
        - id: ch01-b43
          speaker: narrator
          text: They caught Foxy hurrying to tell the story to Mr. Keyte. Keyte had once been a cavalry troop sergeant-major. Now the war-worn veteran was the local postmaster and confectioner.
        - id: ch01-b44
          speaker: stalky
          text: You owe us something, Foxy.
        - id: ch01-b45
          speaker: foxy
          text: I'm deeply grateful, Master Corkran. In business matters I've sometimes had to oppose you over bounds, smoking, and the like. Outside business, I couldn't ask for a more trustworthy young gentleman to help me out of trouble. You handled that drill beautifully. If only you'd attend regularly from now on—
        - id: ch01-b46
          speaker: beetle
          text: But he'd have to be late three times every week. You can't expect a fellow to do that merely to please you.
        - id: ch01-b47
          speaker: foxy
          text: True enough. Still, if you and Master Beetle could manage it, you'd have a great advantage when the cadet corps is formed. The General is sure to recommend one.
        - id: ch01-b48
          speaker: narrator
          text: At Keyte's shop, the boys helped themselves almost as they pleased. Keyte was too deep in military talk with Foxy to watch them.
        - id: ch01-b49
          speaker: stalky
          text: I make our total seven shillings and sixpence, but you'd better count it yourself.
        - id: ch01-b50
          speaker: keyte
          text: No need. I'd trust your word any day, Master Corkran. So the General served in the Pompadours, Sergeant? We were stationed beside them at Umballa once, I believe.
        - id: ch01-b51
          speaker: stalky
          text: Is this tin of ham and tongue one shilling and sixpence, or one and four?
        - id: ch01-b52
          speaker: keyte
          text: Call it one and four, Master Corkran. Of course, Sergeant, I'd gladly give my time if it helped, but I'm too old now. I'd like to watch a drill again.
        - id: ch01-b53
          speaker: mcturk
          text: Come on, Stalky. He isn't hearing a word. Throw him the money.
        - id: ch01-b54
          speaker: stalky
          text: I need change for the sovereign, you ass. Keyte! Private Keyte! Corporal Keyte! Troop Sergeant-Major Keyte! Will you change a sovereign?
        - id: ch01-b55
          speaker: keyte
          text: Yes, yes, certainly. Seven and six.
        - id: ch01-b56
          speaker: narrator
          text: Keyte stared into the distance, pushed the silver across, and disappeared into the dark back room.
        - id: ch01-b57
          speaker: beetle
          text: Those two will talk about the Mutiny until tea-time.
        - id: ch01-b58
          speaker: stalky
          text: Keyte fought at Sobraon. Listen to him tell that story sometime. He leaves Foxy nowhere.

    - id: ch02
      title: The Volunteer Corps
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Head sat over a pile of letters, his face giving nothing away. At last he asked the Reverend John Gillett what he thought of the Council's proposal.
        - id: ch02-b02
          speaker: chaplain
          text: It's a good idea. No one can deny that. An admirable idea, really.
        - id: ch02-b03
          speaker: head
          text: We agree that far. What else?
        - id: ch02-b04
          speaker: chaplain
          text: I have doubts. The better I know boys, the less I claim to understand their moods. Still, I shall be very surprised if this plan succeeds. It isn't the temper of the school. We prepare boys for the Army already.
        - id: ch02-b05
          speaker: head
          text: In this matter, my duty is to carry out the Council's wishes. They demand a volunteer cadet corps, so a volunteer cadet corps will be supplied. I have suggested that we delay buying uniforms until the boys can drill. General Collinson is sending fifty lethal weapons, as he calls them. They are shortened Snider rifles, all safely plugged.
        - id: ch02-b06
          speaker: chaplain
          text: A sensible precaution in a school where loaded saloon pistols are used so freely.
        - id: ch02-b07
          speaker: head
          text: Then the only expense will be the Sergeant's time.
        - id: ch02-b08
          speaker: chaplain
          text: And if it fails, you will receive the blame.
        - id: ch02-b09
          speaker: head
          text: Without question. I shall put a notice in the corridor this afternoon.
        - id: ch02-b10
          speaker: chaplain
          text: Then I shall watch what happens.
        - id: ch02-b11
          speaker: narrator
          text: Soon Foxy was struggling with a noisy crowd around the new rifle rack in the gymnasium.
        - id: ch02-b12
          speaker: foxy
          text: Keep your hands off the new rack. And continual snapping won't improve even a condemned Snider, Master Swayne. Uniforms may come when we're proficient. For now, we drill. I am taking the names of volunteers. Put that rifle down, Master Hogan!
        - id: ch02-b13
          speaker: boy_one
          text: What are you going to do, Beetle?
        - id: ch02-b14
          speaker: beetle
          text: I've had every bit of drill I want, thank you.
        - id: ch02-b15
          speaker: stalky
          text: After everything you've learned? Come on, don't desert us. They'll make you a corporal within a week.
        - id: ch02-b16
          speaker: beetle
          text: I'm not entering the Army.
        - id: ch02-b17
          speaker: hogan
          text: Wait a moment, Foxy. Where do you mean to drill us?
        - id: ch02-b18
          speaker: foxy
          text: Here in the gym, until you're ready and able to go onto the road.
        - id: ch02-b19
          speaker: hogan
          text: With all the Northam cads staring at us? No, thank you, Foxibus.
        - id: ch02-b20
          speaker: foxy
          text: We needn't settle that now. Learn the drill first, and we'll decide the rest later.
        - id: ch02-b21
          speaker: ansell
          text: What's all this about a ridiculous cadet corps?
        - id: ch02-b22
          speaker: foxy
          text: It will save time at Sandhurst. Arrive with a good grounding, and you'll be released from drill early.
        - id: ch02-b23
          speaker: ansell
          text: I don't object to learning drill. I do object to wandering around the countryside with a toy Snider. Perowne, what will you do? Hogan is joining.
        - id: ch02-b24
          speaker: perowne
          text: I don't know if I have time. I already have endless extra tuition.
        - id: ch02-b25
          speaker: ansell
          text: Count this as extra tuition. It won't take us long to master the drill.
        - id: ch02-b26
          speaker: hogan
          text: Learning it is easy enough. But what about marching in public?
        - id: ch02-b27
          speaker: narrator
          text: Hogan could not foresee that three years later he would die in the Burmese sunlight outside Minhla Fort.
        - id: ch02-b28
          speaker: mcturk
          text: Afraid the uniform won't flatter your creamy complexion?
        - id: ch02-b29
          speaker: hogan
          text: Shut up, Turkey. You aren't going into the Army.
        - id: ch02-b30
          speaker: mcturk
          text: No, but I'll send substitutes. Morrell! Wake! You two little fellows by the rack are volunteering.
        - id: ch02-b31
          speaker: narrator
          text: The younger boys had been too shy to offer before. Now they blushed and edged toward the Sergeant.
        - id: ch02-b32
          speaker: foxy
          text: I don't want the little fellows, not at first. I need some of the Old Brigade, the defaulters, to stiffen the ranks.
        - id: ch02-b33
          speaker: mcturk
          text: Don't be ungrateful, Sergeant. They're almost as large as the recruits the Army accepts nowadays.
        - id: ch02-b34
          speaker: narrator
          text: McTurk read the newspapers and used general information as sharply as he used his knuckles. But even he did not know that Wake minor would become an officer in the Egyptian Army before he was thirty.
        - id: ch02-b35
          speaker: narrator
          text: Hogan, Swayne, Stalky, Perowne, and Ansell gathered beside the vaulting horse. As usual, Stalky laid down the law. Many boys were waiting to follow their lead, and Foxy watched anxiously.
        - id: ch02-b36
          speaker: mcturk
          text: Foxy dislikes my recruits, Beetle. Find him a few more.
        - id: ch02-b37
          speaker: narrator
          text: Beetle happily seized two more small boys, neither much taller than a carbine.
        - id: ch02-b38
          speaker: beetle
          text: Here you are, Foxy. More food for powder. Defend your homes, you young brutes, and hurry up about it.
        - id: ch02-b39
          speaker: mcturk
          text: He still isn't happy. The way we treat our Army is the way we treat our Navy.
        - id: ch02-b40
          speakers: [mcturk, beetle]
          ensemble: duo
          text: And both of them lead to disaster, which nobody can deny!
        - id: ch02-b41
          speaker: narrator
          text: They had found the verse in an old volume of Punch, and it seemed made for the occasion.
        - id: ch02-b42
          speaker: foxy
          text: Be quiet, young gentlemen. If you can't help, at least don't hinder me.
        - id: ch02-b43
          speaker: narrator
          text: Foxy kept watching the council by the horse. Carter, White, and Tyrrell, all influential boys, had joined it. Everyone else fingered the rifles without deciding.
        - id: ch02-b44
          speaker: stalky
          text: Wait. Can't we throw out everyone who isn't serious before we begin?
        - id: ch02-b45
          speaker: foxy
          text: Certainly. Anyone who means to join will remain here. Everyone else will leave and close the door quietly.
        - id: ch02-b46
          speaker: narrator
          text: Half a dozen earnest volunteers rushed the mockers, who barely escaped into the corridor.
        - id: ch02-b47
          speaker: beetle
          text: Why didn't you join?
        - id: ch02-b48
          speaker: mcturk
          text: Why didn't you?
        - id: ch02-b49
          speaker: beetle
          text: What use would it be? Neither of us is entering the Army. Besides, I know everything except the manual of arms. I wonder what they're doing in there.
        - id: ch02-b50
          speaker: mcturk
          text: Making terms with Foxy. Didn't you hear Stalky say they'll do it their way, whether Foxy likes it or not? They'll use him as a tutor. They're going to Sandhurst or the Shop within a year. They'll learn drill, then drop the corps instantly. Do you imagine boys with all their extra tuition volunteer for amusement?
        - id: ch02-b51
          speaker: beetle
          text: I thought I might write a poem making fun of them. The Ballad of the Dog-Shooters, perhaps.
        - id: ch02-b52
          speaker: mcturk
          text: You can't. King will attack the corps like a cartload of bricks. Nobody consulted him, and he's sniffing around the notice now. Let's tempt him.
        - id: ch02-b53
          speaker: narrator
          text: They wandered meekly toward their house-master.
        - id: ch02-b54
          speaker: king
          text: Dear me! I expected to find you learning to fight for your country.
        - id: ch02-b55
          speaker: mcturk
          text: I believe the company is full, sir.
        - id: ch02-b56
          speaker: beetle
          text: A terrible pity.
        - id: ch02-b57
          speaker: king
          text: Forty brave defenders, then? How noble. How devoted. Perhaps this enthusiasm springs from a wish to avoid normal duties. No doubt they will demand special privileges, like the Choir and the Natural History Society. We mustn't call them Bug-hunters, of course.
        - id: ch02-b58
          speaker: mcturk
          text: I expect so, sir. The Head hasn't announced anything, but naturally he will.
        - id: ch02-b59
          speaker: king
          text: Naturally. Yet the house-masters, a necessary but neglected part of school life, may have something to say. Youthful life isn't entirely weapons and war supplies. Education happens to be one of our purposes too.
        - id: ch02-b60
          speaker: mcturk
          text: What a perfectly consistent pig. You always know exactly where he stands. Did you see him leap at that bait about the Head and special privileges?
        - id: ch02-b61
          speaker: beetle
          text: Confound him. He might have supported the plan. I could have written a beautiful ballad against it. Now I'll have to be an enthusiastic supporter. We can still torment Stalky in the study, can't we?
        - id: ch02-b62
          speaker: mcturk
          text: Certainly. But everywhere else we must support the corps with all our hearts. Can't you make a catchy Latin-style epigram about King's opposition?
        - id: ch02-b63
          speaker: narrator
          text: Beetle was working at that noble task when Stalky returned, hot from his first practice.
        - id: ch02-b64
          speaker: mcturk
          text: Here comes our ramrod-stuffer! Where's your dead dog? Is your motto Defence or Defiance?
        - id: ch02-b65
          speaker: stalky
          text: Defiance!
        - id: ch02-b66
          speaker: narrator
          text: Stalky sprang on him at the word.
        - id: ch02-b67
          speaker: stalky
          text: Listen, Turkey. You mustn't mock the corps. We've arranged everything. Foxy swears he won't take us outside until we ask him to.
        - id: ch02-b68
          speaker: mcturk
          text: A disgusting display of infants copying their elders!
        - id: ch02-b69
          speaker: stalky
          text: Have you managed to provoke King, Beetle?
        - id: ch02-b70
          speaker: beetle
          text: Not quite, but Turkey just gave you a fair sample of his style.
        - id: ch02-b71
          speaker: stalky
          text: Then listen to your Uncle Stalky, who is a great man. Foxy will let each of us command the corps in turn. That way we'll all learn to handle half a company. When we reach the military colleges, we'll finish drill early. We have combined education with wholesome amusement.
        - id: ch02-b72
          speaker: mcturk
          text: I knew you'd turn it into extra tuition, you cold-blooded brute. Don't you want to die for your country?
        - id: ch02-b73
          speaker: stalky
          text: Not if I can possibly avoid it. So neither of you may ridicule the corps.
        - id: ch02-b74
          speaker: beetle
          text: We decided that years ago. King will do all the ridiculing for us.
        - id: ch02-b75
          speaker: stalky
          text: Then you must ridicule King, my poet. Write a good catchy limerick and have the little boys sing it.
        - id: ch02-b76
          speaker: beetle
          text: You attend to volunteering, and stop shaking the table.
        - id: ch02-b77
          speaker: stalky
          text: Soon King won't have anything to seize on.

    - id: ch03
      title: Behind Locked Doors
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A few days later, Beetle and McTurk discovered what Stalky meant. They went to watch the drill and found the gym door locked, with Wake minor standing guard.
        - id: ch03-b02
          speaker: mcturk
          text: What magnificent cheek!
        - id: ch03-b03
          speaker: wake
          text: You mustn't look through the keyhole.
        - id: ch03-b04
          speaker: mcturk
          text: Mustn't I? You little beast, I was the one who made you volunteer.
        - id: ch03-b05
          speaker: wake
          text: I can't help that. My orders are to let no one watch.
        - id: ch03-b06
          speaker: mcturk
          text: And suppose we interfere? Suppose we kill you on the spot?
        - id: ch03-b07
          speaker: wake
          text: Then I must give the corps the name of anyone who disturbed me at my post. After drill they'll deal with him under martial law.
        - id: ch03-b08
          speaker: beetle
          text: What a brute Stalky is.
        - id: ch03-b09
          speaker: narrator
          text: Neither boy doubted who had invented the system.
        - id: ch03-b10
          speaker: beetle
          text: You think you're a regular centurion, don't you?
        - id: ch03-b11
          speaker: narrator
          text: Inside came the crash and rattle of rifles striking the floor.
        - id: ch03-b12
          speaker: wake
          text: My orders say I mustn't talk except to explain my orders. They'll thrash me if I disobey.
        - id: ch03-b13
          speaker: narrator
          text: McTurk and Beetle looked at one another, shook their heads, and walked away.
        - id: ch03-b14
          speaker: beetle
          text: I swear Stalky really is a great man. At least this secret-society business will drive King mad.
        - id: ch03-b15
          speaker: narrator
          text: It troubled far more people than King. The corps members kept as silent as oysters whenever anyone asked what happened behind the locked door. Boys who had laughed at the new corps now wanted desperately to see it, but no question, threat, or trick drew an answer. Foxy had sworn no vow, so he carried his complaints to Keyte. He could describe what the volunteers did, but he could not make sense of why they did it in secret or why they refused the ordinary public display that was supposed to be the point of a cadet corps.
        - id: ch03-b16
          speaker: foxy
          text: I've never met such nonsense. They've tiled their lodge, with inner and outer guards complete. Then they begin work, keen as mustard.
        - id: ch03-b17
          speaker: keyte
          text: But what is all that for?
        - id: ch03-b18
          speaker: foxy
          text: To learn drill. You never saw anything like it. After I dismiss them, they stay and practice tricks. But they refuse absolutely to go outdoors. The whole thing is preposterous. If you form a cadet corps, then behave like one instead of hiding behind locked doors.
        - id: ch03-b19
          speaker: keyte
          text: What do the authorities say?
        - id: ch03-b20
          speaker: foxy
          text: That's another mystery. The Head gives me no help. Sometimes I think he's laughing at me. Thank heaven I was never a Volunteer sergeant, though I've always had the decency to pity them.
        - id: ch03-b21
          speaker: keyte
          text: I'd like to see these boys. From what you've told me, I can't understand what they're trying to do.
        - id: ch03-b22
          speaker: foxy
          text: Don't ask me, Major. Ask that freckled Corkran. He's their commander-in-chief.
        - id: ch03-b23
          speaker: narrator
          text: No one could refuse a veteran of Sobraon, especially when he was also the only pastry-cook within bounds. By invitation, Keyte came leaning on a stick and trembling with age. He sat in a corner to watch.
        - id: ch03-b24
          speaker: keyte
          text: They shape well. Very well indeed.
        - id: ch03-b25
          speaker: foxy
          text: This isn't the thing they're really after. Wait until I dismiss them.
        - id: ch03-b26
          speaker: narrator
          text: At the order to break off, the ranks did not move. That was when the real private lesson began. Perowne stepped out, faced the company, and opened a red drill book fastened with metal clasps. He refreshed his memory with quick glances at the pages and commanded for ten minutes. The boys obeyed him without hesitation. Ansell took his turn after Perowne, and Hogan followed Ansell. Every future officer was learning not merely to stand in a rank but to control one. Years afterward, Perowne would be shot by his own men in Equatorial Africa. Here, he was only a schoolboy practicing command with his friends in a locked gymnasium.
        - id: ch03-b27
          speaker: narrator
          text: Then Stalky put down his rifle, filled his lungs, and poured a storm of insults over the company.
        - id: ch03-b28
          speaker: foxy
          text: Hold hard, Master Corkran! That language isn't in any drill book.
        - id: ch03-b29
          speaker: stalky
          text: That's all right, Sergeant. A man never knows what he may need to say to his soldiers. For pity's sake, stand upright without leaning on one another, you bleary-eyed, hollow-bellied gutter-snipes! I take no pleasure in combing you out. Someone should have done it before you arrived, you militia broom-thieves!
        - id: ch03-b30
          speaker: keyte
          text: That's the old touch. We know it! But where did the boy learn it?
        - id: ch03-b31
          speaker: foxy
          text: From his father or his uncle. Don't ask me. Half these boys must have been born within hearing of barracks. Since this volunteering began, I've heard more back-talk than I heard in a year of service.
        - id: ch03-b32
          speaker: stalky
          text: There's a man in the rear rank standing as if his stomach were in the pawnshop. Yes, you, Private Ansell!
        - id: ch03-b33
          speaker: narrator
          text: For three full minutes Stalky took Ansell apart, first in sweeping insults and then detail by detail. This too was training. A man who expected to command soldiers had to keep his temper while a furious voice searched for every weakness and mocked it. Keyte listened with tears of delighted memory in his old eyes. Foxy listened with the weary knowledge that the boys had picked up genuine barrack-room methods somewhere beyond his control. Then Stalky suddenly dropped the parade-ground fury and returned to his everyday voice.
        - id: ch03-b34
          speaker: stalky
          text: First blood to me! You went red, Ansell, and you wriggled.
        - id: ch03-b35
          speaker: ansell
          text: I couldn't stop myself going red. I don't think I wriggled.
        - id: ch03-b36
          speaker: stalky
          text: Your turn now.
        - id: ch03-b37
          speaker: narrator
          text: Stalky returned to the ranks.
        - id: ch03-b38
          speaker: keyte
          text: Lord, this is better than a play!
        - id: ch03-b39
          speaker: narrator
          text: Ansell also had military relatives, so the art was familiar to him. His style was nothing like Stalky's blazing attack. He spoke in a slow, lazy drawl, considering each insult before letting it fall. Yet he traveled just as far down into Stalky's private weaknesses. The ranks stood still and watched to see whether their leader could endure the treatment he had just given another boy.
        - id: ch03-b40
          speaker: ansell
          text: Blood to me! You couldn't endure it either.
        - id: ch03-b41
          speaker: narrator
          text: Stalky had turned crimson, and his rifle shook in his hands.
        - id: ch03-b42
          speaker: stalky
          text: I didn't expect to mind, but after a while I became furious. Curious, isn't it?
        - id: ch03-b43
          speaker: hogan
          text: Excellent training for the temper.
        - id: ch03-b44
          speaker: narrator
          text: They returned the rifles to the rack.
        - id: ch03-b45
          speaker: foxy
          text: Did you ever see the like of that?
        - id: ch03-b46
          speaker: keyte
          text: I know little about Volunteers, but that's the strangest performance I've seen. Still, I understand what they want. Lord, how often I was dressed down in my day! They shape extremely well.
        - id: ch03-b47
          speaker: foxy
          text: If I could only take them outdoors, Major, I could do anything with them. Perhaps they'll change their minds when the uniforms arrive.
        - id: ch03-b48
          speaker: narrator
          text: By then the corps had to give something to the school's curiosity. Three different guards had been attacked at their posts, and three times the corps had met afterward and punished the offenders under its own martial law. Instead of discouraging interference, every secret punishment made the rest of the school more furious. What possible use was a cadet corps that nobody was allowed to see? King congratulated the members on being invisible defenders of the nation, and for once their cleverness gave them no answer to his mockery. Foxy grew sulky and restless because all his good drilling remained hidden. Even some volunteers began to wonder aloud whether Stalky's policy could last. The question of uniforms was drawing near. If uniforms were issued, the boys would be forced to put them on, and once dressed as cadets they could hardly remain behind a locked door. They had reached the point where they would have to yield something. Then, as often happens, an event from outside the school settled the matter for them.

    - id: ch04
      title: The Flag
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Head informed the Council that its recommendation had been carried out and that, as far as he knew, the boys were drilling. He did not mention their conditions. General Collinson was delighted and told his friends. One friend had another friend, a zealous, intelligent, and supremely patriotic Member of Parliament named Raymond Martin. Mr. Martin wanted to do the greatest possible good in the shortest possible time.
        - id: ch04-b02
          speaker: narrator
          text: Unfortunately, we can choose our friends but cannot answer for every friend they admire. If General Collinson's own friend had brought Raymond Martin to meet him, the General would have measured the visitor for himself and much might have been prevented. Instead the man was only described to him, and no two people ever see a third person in exactly the same way. The description Collinson received was badly wrong. Still, Martin was a Member of Parliament, a faultless Conservative, and the old soldier kept an English soldier's respect for anyone belonging to that final court of appeal. Martin was traveling into the West Country to spread political light through somebody's supposedly dark constituency. His friends suggested that the new school corps would make an admirable subject. Armed with Collinson's recommendation, he could speak a few informal words to the boys, the sort of words boys would understand and welcome.
        - id: ch04-b03
          speaker: general_collinson
          text: In my day, people didn't talk to boys very much.
        - id: ch04-b04
          speaker: narrator
          text: He was told that education had changed everything. The boys of today were the men of tomorrow. An early impression might last forever, especially now, with the country going to the dogs.
        - id: ch04-b05
          speaker: general_collinson
          text: Quite right. The boys of today do make the men of tomorrow. That's remarkably well said. I'll write to the Head.
        - id: ch04-b06
          speaker: narrator
          text: The Head replied that he would be delighted to receive Mr. Martin, keep him overnight, and let him address the school on any subject he believed would interest them. If the M.P. had never faced this particular kind of British youth, the Head felt sure he would find it interesting.
        - id: ch04-b07
          speaker: head
          text: I don't believe that last statement is far wrong. Do you know anything about Raymond Martin?
        - id: ch04-b08
          speaker: chaplain
          text: I was at college with a man of that name. As I remember him, he had no shape or substance, but he was desperately earnest.
        - id: ch04-b09
          speaker: head
          text: He will lecture the College on Patriotism next Saturday.
        - id: ch04-b10
          speaker: chaplain
          text: If our boys hate one thing above all others, it is losing a Saturday evening. Patriotism cannot compete with brewing cocoa in their studies.
        - id: ch04-b11
          speaker: head
          text: Neither can art. Do you remember our Evening with Shakespeare, or the humorous gentleman with the magic lantern?
        - id: ch04-b12
          speaker: narrator
          text: The Head's eyes twinkled.
        - id: ch04-b13
          speaker: beetle
          text: Who on earth is Raymond Martin, M.P.? Why do these brutes always arrive on Saturday?
        - id: ch04-b14
          speaker: mcturk
          text: O Romeo, Romeo, wherefore art thou Romeo? Well, he can't be worse than last term's Shakespeare woman. Stalky, are you properly patriotic? If not, this fellow means to cure you.
        - id: ch04-b15
          speaker: stalky
          text: I hope he doesn't consume the entire evening. I suppose attendance is compulsory.
        - id: ch04-b16
          speaker: mcturk
          text: I wouldn't miss it. Plenty of fellows thought the Romeo woman dull, but I liked her. Remember when she began hiccupping? Perhaps he'll hiccup too. Whoever reaches the gym first must save seats for the other two.
        - id: ch04-b17
          speaker: narrator
          text: Mr. Raymond Martin arrived at the Head's house with brisk, cheerful confidence, watched by many eyes.
        - id: ch04-b18
          speaker: mcturk
          text: He looks rather common. I wouldn't be surprised if he were a Radical. I heard him quarrel with the driver over the fare.
        - id: ch04-b19
          speaker: beetle
          text: That was his patriotism showing.
        - id: ch04-b20
          speaker: narrator
          text: After tea, the three joined the rush and secured a hidden corner. Every gas jet burned. The Head's official desk stood on a small platform, surrounded by chairs for the masters. Foxy entered with full official dignity and leaned a cloth-wrapped staff against the desk. No master had arrived yet, so the school greeted him noisily.
        - id: ch04-b21
          speakers: [boy_one, boy_two]
          ensemble: duo
          text: What's that, Foxy? Why are you stealing the gentleman's umbrella? We don't birch boys here, we cane them! Take away that ornament! Number from the right!
        - id: ch04-b22
          speaker: narrator
          text: The Head and masters entered, ending the performance.
        - id: ch04-b23
          speaker: mcturk
          text: At least the Common Room hates this as much as we do. Watch King squirm and try to escape.
        - id: ch04-b24
          speaker: beetle
          text: Where is the mighty Martin? Punctuality, my dear listeners, is the image of war—
        - id: ch04-b25
          speaker: stalky
          text: Be quiet. Here comes the great duke. Good heavens, what a throat!
        - id: ch04-b26
          speaker: narrator
          text: Mr. Martin wore evening dress. He was tall, broad, pink and white, and undeniably heavy about the throat. Beetle's comment had still been coarse.
        - id: ch04-b27
          speaker: mcturk
          text: Look at him turning his back while he talks to the Head. Shocking manners before an audience. He's a Philistine, a Bopper, a Jebusite, and a Hivite.
        - id: ch04-b28
          speaker: narrator
          text: McTurk leaned back and sniffed. The Head introduced the visitor in a few colorless words. Martin accepted the applause as his due, so the boys applauded harder. It took him some time to begin.
        - id: ch04-b29
          speaker: narrator
          text: He knew nothing of the school, its traditions, or the inheritance carried quietly by its boys. The latest count showed that eight boys in ten had been born outside England, in camps, in military stations, or on the high seas. Three quarters were sons of officers from one service or another. They bore the names of families that had served for generations, and most expected to enter the same profession as their fathers. War and service were not bright new ideas waiting for a public speaker to reveal them. They were part of family life, spoken of sparingly because they were understood. The Head could have told Martin this and much more. But after enduring an hour-long dinner with his guest, he decided to say nothing at all. Mr. Raymond Martin already appeared to know more than anyone could teach him.
        - id: ch04-b30
          speaker: raymond_martin
          text: Well, boys! I suppose you know why I've come. I seldom have the chance to speak to boys. I suppose boys today are much like the boys of my own youth, though some people consider boys rather funny creatures.
        - id: ch04-b31
          speaker: mcturk
          text: This man is the whole herd of Gadarene swine.
        - id: ch04-b32
          speaker: raymond_martin
          text: You must remember that you won't always be boys. You will grow into men. The boys of today are the men of tomorrow, and the fair fame of our glorious native land will depend upon tomorrow's men.
        - id: ch04-b33
          speaker: stalky
          text: If he continues, it will become my painful duty to make fun of this fellow.
        - id: ch04-b34
          speaker: mcturk
          text: You can't. He isn't charging money for his performance.
        - id: ch04-b35
          speaker: narrator
          text: Martin told them to consider the duties and responsibilities ahead. Life was not all games. He named several and then, to complete his ruin, added marbles.
        - id: ch04-b36
          speaker: raymond_martin
          text: Yes, boys. Life is not all marbles.
        - id: ch04-b37
          speaker: narrator
          text: One tight gasp passed through the gym. Among the younger boys it rose almost into a shriek of horror. Martin had not merely made a poor joke. By naming marbles as though they belonged beside the games of the College, he had proved himself a heathen and an outcast beyond the farthest boundary of tolerance. In the boys' judgment, he had condemned himself without help from anyone. Stalky bowed his head into his hands beneath the weight of it. McTurk, bright-eyed and cheerful, drank in every disastrous word. Beetle nodded with solemn approval, giving the speaker exactly the respectful attention that made the performance more ridiculous.
        - id: ch04-b38
          speaker: raymond_martin
          text: Some of you expect soon to receive the Queen's commission and wear a sword. I myself know something of such duties, for I am a major in a Volunteer regiment. I am pleased that you have founded a corps here. Such an establishment encourages the proper healthy spirit and will greatly benefit the country you love.
        - id: ch04-b39
          speaker: narrator
          text: He suggested that some boys before him were already looking eagerly toward the day when they would lead soldiers against England's enemies and stand beneath fire in all the pride of youth. He did not understand how deeply boys hide such hopes. Their reserve goes down farther than outsiders imagine, because a boy's future may take several shapes and he does not expose his most serious dream even to his closest companion. Martin reached into that privacy with a large, healthy hand. Then he tore down every veil and trampled it beneath the well-intentioned feet of his eloquence. In his harsh voice he shouted little sacred matters such as the hope of Honor and the dream of Glory. The boys would not have spoken of these things to one another. Martin cheerfully assumed that none of them had ever thought about service, courage, death, or duty until he came to explain them.
        - id: ch04-b40
          speaker: narrator
          text: He pointed toward shining goals, but his pointing fingers seemed to smear the light from every horizon. With cries and broad gestures, he pushed into the most secret places of their minds. He ordered them to consider the deeds of their ancestors in a way that made them flush to the tips of their tingling ears. Some of them, he announced, might have had relatives who died defending their country. Quite a few boys remembered an old sword hanging in a passage or above the breakfast-room table at home. Since they were first tall enough to reach it, they had touched and examined it when no one was watching. The sword and the person who once carried it belonged to quiet family knowledge. Martin dragged that knowledge before a crowded gym and called on them to imitate those glorious examples. In extreme discomfort, the boys looked toward the walls, the floor, or anywhere except another boy's face.
        - id: ch04-b41
          speaker: narrator
          text: They were too young even to put their thoughts clearly into words. They only knew that a fat man who considered marbles a game was insulting something sacred. He drove toward the ending of his speech, which later delighted a meeting of voters. After many words, he reached for the cloth-wrapped staff and placed one hand inside his coat.
        - id: ch04-b42
          speaker: raymond_martin
          text: This is the solid symbol of our country and deserves all honor and reverence. No boy should look upon this flag unless he intends to add worthily to its imperishable glory!
        - id: ch04-b43
          speaker: narrator
          text: He shook out a large calico Union Jack. Its red, white, and blue stared across the gas-lit gym. Then he held it before the boys and waited for the thunder of applause that was meant to crown his speech. Nothing came. They only looked. Of course they had seen the flag before. It flew at the coastguard station. Through a telescope they had watched it hanging at half-mast after a ship went ashore on Braunton Sands. It appeared above the golf club, and a cheap printed version wrapped a certain striped sweet in Keyte's window. Yet the College itself never displayed one. The flag had no place in the visible machinery of their school days. The Head had never used it in a speech. Their fathers had never sat them down and declared its meaning. Like the swords at home, it belonged among matters understood without public explanation, shut up, sacred, and apart. What, in the name of everything vulgar, was Martin trying to do by waving that glaring object before them? One hopeful explanation occurred to the boys. Perhaps the man was drunk.
        - id: ch04-b44
          speaker: narrator
          text: The Head rescued the evening. He rose quickly to propose thanks, and the school applauded from sheer relief.
        - id: ch04-b45
          speaker: head
          text: I am sure you will all join me in offering Mr. Raymond Martin a very hearty vote of thanks for the most enjoyable address he has given us.
        - id: ch04-b46
          speaker: narrator
          text: No one ever settled what happened next. The Head always denied doing it, or said something must have troubled his eye. Every boy present remained convinced that after the word enjoyable, he gave them one open and solemn wink. Martin received every cheer he expected.
        - id: ch04-b47
          speaker: raymond_martin
          text: Without vanity, I believe my few words reached their hearts. I never knew boys could cheer like that.
        - id: ch04-b48
          speaker: narrator
          text: Martin left as the prayer bell rang. The boys lined the wall. The flag remained open on the desk, while Foxy gazed proudly at it, deeply moved by the speech. The masters stood too far back to see the glaring offense. A prefect stepped out, rolled the flag swiftly, and threw it into a locker for gloves and fencing foils. At once a low satisfied murmur rose into quick volleys of clapping.
        - id: ch04-b49
          speaker: narrator
          text: In the dormitories, every boy agreed. Raymond Martin had been born in a gutter and educated at a school where people played marbles. Among many other names, they called him a Flopshus Cad, an Outrageous Stinker, and, in Stalky's phrase, a Jelly-Bellied Flag-Flapper.

    - id: ch05
      title: Disbanded
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On Monday the cadet corps formed up with shame in every face. Even then, wise silence might have saved it.
        - id: ch05-b02
          speaker: foxy
          text: After that fine speech on Saturday, you ought to take up your drill with renewed energy. I don't see how you can avoid marching outdoors now.
        - id: ch05-b03
          speaker: stalky
          text: Is there no way out of it, Foxy?
        - id: ch05-b04
          speaker: narrator
          text: Stalky's silky voice should have warned the Sergeant.
        - id: ch05-b05
          speaker: foxy
          text: Not after Mr. Martin gave us that flag so generously. Before leaving, he told me the corps could use it as its own. It's a handsome flag.
        - id: ch05-b06
          speaker: narrator
          text: Without a word, Stalky returned his rifle to the rack and stepped out. Hogan and Ansell followed. Perowne hesitated.
        - id: ch05-b07
          speaker: perowne
          text: Look here, shouldn't we at least—?
        - id: ch05-b08
          speaker: foxy
          text: I'll fetch it from the locker in a moment. Then we can—
        - id: ch05-b09
          speaker: stalky
          text: Come on! What the devil are you waiting for? Dismiss! Break off!
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: Rifle after rifle crashed into the rack, drowning Foxy's voice as every boy left the ranks.
        - id: ch05-b11
          speaker: foxy
          text: What in the world—? I may have to report this to the Head.
        - id: ch05-b12
          speaker: stalky
          text: Then report it, and be damned to you!
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: Stalky's lips were white. He ran out.
        - id: ch05-b14
          speaker: beetle
          text: Something strange happened. I was in the study writing a beautiful poem about the Jelly-Bellied Flag-Flapper. Stalky came in. I said hello, and he cursed me like a bargee. Then he began sobbing. He put his head on the table and howled. Shouldn't we do something?
        - id: ch05-b15
          speaker: mcturk
          text: Perhaps he's hurt himself somehow.
        - id: ch05-b16
          speaker: narrator
          text: They found Stalky with unnaturally bright eyes, whistling between his teeth.
        - id: ch05-b17
          speaker: stalky
          text: Did I fool you, Beetle? I thought I would. Wasn't it a perfect trick? Didn't you believe I was crying? Didn't I perform it beautifully? You fat old ass!
        - id: ch05-b18
          speaker: narrator
          text: He pulled Beetle's ears and cheeks in the torment the boys called milking.
        - id: ch05-b19
          speaker: beetle
          text: I knew perfectly well you were crying. Why aren't you at drill?
        - id: ch05-b20
          speaker: stalky
          text: Drill? What drill?
        - id: ch05-b21
          speaker: beetle
          text: Don't play the clever fool. Drill in the gym.
        - id: ch05-b22
          speaker: stalky
          text: There isn't any drill. The volunteer cadet corps is broken up, disbanded, dead, putrid, corrupt, and stinking. If you keep looking at me like that, Beetle, I'll kill you too. Oh, and I'm going to be reported to the Head for swearing.
