  chapters:
    - id: ch01
      title: 受罚学生的检阅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冬天一来，清晨冷得扎人。斯托基和甲虫总拖到最后一刻，才爬起来去煤气灯照着的体育馆点名。麦克特克倒从不这样，他不管什么时候都要把自己梳洗得周周正正，实在叫人讨厌。斯托基和甲虫当然常常迟到。迟到一次记一个黑点，一周凑够三个，就得接受福克西的受罚操练。两个人积得勤，常常一练就是几个钟头。
        - id: ch01-b02
          speaker: foxey
          text: 别以为我乐意做这事。我宁可安安静静待在屋里抽烟斗。可今天下午，看来老旅又归咱们了。科克兰少爷，要是能把您收进正规军，我可真高兴。
        - id: ch01-b03
          speaker: narrator
          text: 福克西摆出当年练兵场上的威风，动手整理队列。
        - id: ch01-b04
          speaker: stalky
          text: 你这老馋鬼，差不多六个星期都在摆布我们。全体从右翼开始报数！
        - id: ch01-b05
          speaker: foxey
          text: 别急，现在带操的人是我。向左转一半！慢步走！
        - id: ch01-b06
          speaker: narrator
          text: 二十五个懒汉全是惯犯，排着队进了体育馆。福克西叫他们安静领出要用的哑铃，再安静回到原位，从右翼开始小声报数。单数向前一步，双数留在原地，然后上身从髋部向前俯，动作要紧跟他的节拍。哑铃整整齐齐地举起、落下、碰在一起，又同时归位。这套烦人的把戏，他们早就练熟了，谁也不用多想。
        - id: ch01-b07
          speaker: foxey
          text: 非常好。等你们哪天又能按时到，我一定舍不得你们。把哑铃安静放回去。现在来一点简单操法。
        - id: ch01-b08
          speaker: stalky
          text: 得了，那套简单操法我熟得很。
        - id: ch01-b09
          speaker: foxey
          text: 您要是还不熟，那才丢人。可这套动作也没看上去那么容易。
        - id: ch01-b10
          speaker: stalky
          text: 赌一先令，我带操不比你差。
        - id: ch01-b11
          speaker: foxey
          text: 待会儿就知道了。现在把自己当成参加检阅的半个连，不是什么受罚学生。我是你们的指挥官。这没什么可笑的。运气好，你们多数人以后得操练半辈子。给我争点脸吧，你们练得可够久了。
        - id: ch01-b12
          speaker: narrator
          text: 队伍编成四列纵队，先向前走，再转向，又按口令反向行进。二十五个人原本只是来受罚，可当脚步和动作变得整齐划一，那种秩序像有魔力，把每个人都牢牢摄住。刚才还懒懒散散的惯犯，这时全神贯注，谁也不想破坏队形。福克西说得没错，他们确实练得够久了。体育馆的门忽然打开，麦克特克领着一位老先生走进来。军士正忙着让队伍转向，根本没有看见。
        - id: ch01-b13
          speaker: foxey
          text: 不算坏，一点也不坏。斯韦恩少爷，转向时站在轴心的人只能原地踏步。好了，科克兰少爷，您不是说懂操法吗？劳驾接过指挥，把我的口令一步步反过来，让他们恢复原来的队形。
        - id: ch01-b14
          speaker: collinson
          text: 这是怎么回事？你们在做什么？
        - id: ch01-b15
          speaker: foxey
          text: 只是在做一点操练，先生。
        - id: ch01-b16
          speaker: narrator
          text: 福克西一下结巴了，却没有解释这些孩子为什么在这里。
        - id: ch01-b17
          speaker: collinson
          text: 好极了！我只盼这样的操练再多一点。别让我打断你们。你刚才正要把指挥交给别人，是不是？
        - id: ch01-b18
          speaker: narrator
          text: 老先生坐下来，呼出的白气一团团飘在冰冷的空气里。斯托基低声说，自己准会搞砸。后排告诉他，来客是学院理事科林森将军，还指挥过大斯韦恩父亲从前所在的粉红团。斯托基更难受了。
        - id: ch01-b19
          speaker: collinson
          text: 慢慢来。我知道第一次带操是什么滋味。这是头一回吧？
        - id: ch01-b20
          speaker: stalky
          text: 是，先生。立正！向右看齐！
        - id: ch01-b21
          speaker: narrator
          text: 斯托基痛苦地吸了口气。可自己的口令一在体育馆里回荡，他的信心就回来了。队伍转身，向后展开，拆成四列纵队，又准确无误地恢复横队。原本规定的受罚时间早已过去，可谁都没有想到这件事，更没人想离开。二十四个人都在给斯托基撑腰，尽力把每个动作做齐。斯托基自己却怕得要命，只怕指挥到一半，嗓音忽然破掉。
        - id: ch01-b22
          speaker: collinson
          text: 他给你长脸了，军士。带得好，兵也好。真奇怪，我刚和你们校长吃过午饭，他竟没说学院里还有学生军团。
        - id: ch01-b23
          speaker: foxey
          text: 我们没有学生军团，先生。这只是一点操练。
        - id: ch01-b24
          speaker: mcturk
          text: 可他们不是很热心吗？
        - id: ch01-b25
          speaker: collinson
          text: 威利，你怎么没参加？
        - id: ch01-b26
          speaker: mcturk
          text: 哦，我还不够守时。军士只挑我们当中的精英。
        - id: ch01-b27
          speaker: foxey
          text: 解散！散开！先生，我本来应该告诉您，这其实……
        - id: ch01-b28
          speaker: collinson
          text: 你们就该有一支学生军团。只要我的建议在理事会还有一点分量，这件事就一定办成。我很久没这么高兴了。这样热心的孩子，应该给全校做榜样。
        - id: ch01-b29
          speaker: mcturk
          text: 他们确实做了榜样。
        - id: ch01-b30
          speaker: narrator
          text: 将军忽然发现时间已晚，出租马车白等了半个钟头。他请麦克特克带路，又问刚才带操的孩子是谁。
        - id: ch01-b31
          speaker: mcturk
          text: 好像姓科克兰。
        - id: ch01-b32
          speaker: collinson
          text: 你该认识他，这样的孩子值得结交。二十五个孩子，我敢说他们宁可去打板球，却凭着一腔热爱在这里操练。浪费这么好的材料太可惜了。我想，我能让理事会通过这件事。
        - id: ch01-b33
          speaker: narrator
          text: 当时正是隆冬，可在国外住久了的成年人常犯这种小错，麦克特克也没有纠正。他回到自修室，告诉斯托基，白络腮胡子是科林森将军，有时会找他父亲打猎，还说他该同斯托基结交。
        - id: ch01-b34
          speaker: stalky
          text: 他赏你钱了吗？
        - id: ch01-b35
          speaker: narrator
          text: 麦克特克亮出一枚足金镑币。斯托基身为财务主管，立刻把钱收了过去。
        - id: ch01-b36
          speaker: stalky
          text: 这下咱们能痛饮一顿了。火鸡，你把我们吹成又热心又守时的人，脸皮可真够厚。
        - id: ch01-b37
          speaker: beetle
          text: 那老家伙根本不知道我们是受罚学生？
        - id: ch01-b38
          speaker: mcturk
          text: 一点也不知道。我见他独自在学校里闲逛，就想领他看看这套滑稽操练。后来他那么高兴，我当然不好给他的热情泼冷水。说出真相，他也许就不赏这一镑了。
        - id: ch01-b39
          speaker: beetle
          text: 老福克西耳朵后面都红了，这下可风光透了。我们给他撑得多漂亮！走，下山去凯特店里喝可可、吃香肠。
        - id: ch01-b40
          speaker: narrator
          text: 他们追上匆匆下山的福克西。他正急着把奇遇说给凯特听。凯特从前是骑兵军士长，打过不少仗，如今做了当地邮政局长，也开糖果店。
        - id: ch01-b41
          speaker: stalky
          text: 你欠我们点什么。
        - id: ch01-b42
          speaker: foxey
          text: 科克兰少爷，我实在感激。公事上，我有时不得不严厉。可抛开越界、抽烟那些事，要是我陷进困境，再找不到比您更靠得住的年轻绅士。您带操确实漂亮。往后要是肯按时来……
        - id: ch01-b43
          speaker: beetle
          text: 那他每星期就得迟到三次。你不能指望一个人专为讨你高兴，非得这么干吧？
        - id: ch01-b44
          speaker: foxey
          text: 这倒也是。可您和甲虫少爷要是能想法做到，等学生军团成立，就占大便宜了。我看将军一定会提议。
        - id: ch01-b45
          speaker: narrator
          text: 三个男孩喝着可可，吃着香肠，随心所欲地洗劫了凯特的店。这个老头儿很熟悉他们，平常也由着他们胡闹。此刻他更顾不上柜台，一门心思同福克西谈军旅旧事，问科林森将军是不是待过粉红团，又说起自己从前驻扎在安巴拉的日子。斯托基隔着柜台大声报账，他也只是心不在焉地应付。
        - id: ch01-b46
          speaker: stalky
          text: 我算过了，我们一共拿了七先令六便士。不过你最好自己点点。
        - id: ch01-b47
          speaker: kates
          text: 不用。科克兰少爷说多少，我就信多少。军士，他真在粉红团待过吗？我记得我们有一回在安巴拉同他们一起驻扎。
        - id: ch01-b48
          speaker: stalky
          text: 这罐火腿牛舌到底是一先令六便士，还是一先令四便士？我弄不清。
        - id: ch01-b49
          speaker: kates
          text: 就算一先令四便士吧。军士，要是我这点时间能派上用场，我当然乐意，可我太老了。我倒真想再看看操练。
        - id: ch01-b50
          speaker: mcturk
          text: 得了吧，斯托基，他根本没听你说。把钱扔过去。
        - id: ch01-b51
          speaker: stalky
          text: 我要把一镑换开，你这蠢驴。凯特列兵！凯特下士！凯特骑兵军士长！你肯不肯给我换开一镑？
        - id: ch01-b52
          speaker: kates
          text: 肯，当然肯。七先令六便士。
        - id: ch01-b53
          speaker: narrator
          text: 凯特心不在焉地推出银币，转眼消失在后屋的黑暗里。
        - id: ch01-b54
          speaker: beetle
          text: 这两个人会一直聊印度兵变，聊到喝茶。
        - id: ch01-b55
          speaker: stalky
          text: 老凯特参加过索布拉昂战役。哪天得听他讲讲，比福克西强多了。
    - id: ch02
      title: 一支秘密军团
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 校长那张一向叫人看不透的脸，此刻正俯在一摞信件上。他读完以后，问约翰·吉莱特牧师怎么看。
        - id: ch02-b02
          speaker: gillette
          text: 这是个好主意，确实值得赞许。
        - id: ch02-b03
          speaker: headmaster
          text: 这一点我们都承认。然后呢？
        - id: ch02-b04
          speaker: gillette
          text: 我只是有点疑虑。我越了解男孩子，越不敢说能跟上他们的心思。可这项计划真能办成，我还是会大吃一惊。它不合本校的性情。我们本来就在为陆军培养学生。
        - id: ch02-b05
          speaker: headmaster
          text: 这件事上，我只管执行理事会的意思。他们要一支志愿学生军团，我们就给他们一支。不过我已经说了，练好以前不用花钱买制服。科林森将军会送来五十件致命武器。他说是截短的斯奈德步枪，枪膛全都仔细堵死了。
        - id: ch02-b06
          speaker: gillette
          text: 堵死很有必要。本校使用装弹室内手枪的次数，可不少。
        - id: ch02-b07
          speaker: headmaster
          text: 所以除了军士的时间，不会再花钱。
        - id: ch02-b08
          speaker: gillette
          text: 可事情办砸了，挨骂的是你。
        - id: ch02-b09
          speaker: headmaster
          text: 那当然。我今天下午会在走廊贴出告示，接下来……
        - id: ch02-b10
          speaker: gillette
          text: 我等着看结果。
        - id: ch02-b11
          speaker: narrator
          text: 不久，新枪架已经进了体育馆。福克西守在旁边，叫学生们别再碰。可一群闹哄哄的孩子围着他不停摆弄，连枪膛已经堵死的斯奈德步枪，也禁不起他们反复扳动枪机。有人追问制服什么时候发，有人把枪拿在手里不肯放。福克西一边抢救步枪，一边解释，眼下只登记志愿加入的姓名，先练最基本的操法。等大家真正熟练以后，才会发制服。
        - id: ch02-b12
          speaker: boy
          text: 甲虫，你打算怎么办？
        - id: ch02-b13
          speaker: beetle
          text: 我练过的操已经够多了，多谢。
        - id: ch02-b14
          speaker: stalky
          text: 什么？你学了那么多，现在反倒不干？来吧，别当叛徒。一个星期就能升你做下士。
        - id: ch02-b15
          speaker: beetle
          text: 我又不准备进陆军。
        - id: ch02-b16
          speaker: narrator
          text: 甲虫碰了碰眼镜。霍根放下手里的步枪，问福克西准备带他们到哪儿操练。
        - id: ch02-b17
          speaker: foxey
          text: 就在体育馆。等你们练到合格，能拉出去的时候，再上大路。
        - id: ch02-b18
          speaker: hogan
          text: 让诺瑟姆那些下等人全盯着我们看？那可不行。
        - id: ch02-b19
          speaker: foxey
          text: 这一点先不强求。你们先把操法学会，以后再谈。
        - id: ch02-b20
          speaker: ansell
          text: 这支滑稽学生军团到底怎么回事？
        - id: ch02-b21
          speaker: foxey
          text: 到了桑赫斯特军校，能替你省很多时间。基础先打好，入学以后就能提早免掉操练。
        - id: ch02-b22
          speaker: ansell
          text: 学操法我不在乎。可我不想扛着玩具步枪，跑到乡下扮蠢货。佩罗恩，你呢？霍根要参加。
        - id: ch02-b23
          speaker: perowne
          text: 我不知道有没有时间，加课已经没完没了。
        - id: ch02-b24
          speaker: ansell
          text: 那就把这个也当加课。操法没多久就能死记下来。
        - id: ch02-b25
          speaker: hogan
          text: 动作好学，可当众行进怎么办？
        - id: ch02-b26
          speaker: narrator
          text: 霍根并不知道，三年以后，自己会死在缅甸敏拉堡外的阳光下。
        - id: ch02-b27
          speaker: mcturk
          text: 怎么，怕制服衬坏你那张奶油似的脸？
        - id: ch02-b28
          speaker: hogan
          text: 闭嘴，火鸡。你又不打算进陆军。
        - id: ch02-b29
          speaker: mcturk
          text: 不打算。不过我要派替身。莫雷尔、韦克！枪架边那两个低年级跟班，你们得志愿加入。
        - id: ch02-b30
          speaker: narrator
          text: 两个小家伙本来害羞，不敢报名。这时他们涨红了脸，侧着身子往福克西面前挪。
        - id: ch02-b31
          speaker: foxey
          text: 开头我不想要小孩子。我想要几个老旅的，就是那些受罚学生，好把队伍撑硬一点。
        - id: ch02-b32
          speaker: mcturk
          text: 别不知感恩，军士。现在陆军里收的人，也就差不多这么大。
        - id: ch02-b33
          speaker: narrator
          text: 麦克特克常读当年的报纸，拿报上的消息刺人，就像拿鼻夹刺人一样狠，什么事都很难瞒过他。不过他还不知道，小韦克不到三十岁便会成为埃及军队的少校。另一边，霍根、斯韦恩、斯托基、佩罗恩和安塞尔围在跳马旁认真商量，由斯托基照例发号施令。福克西很清楚，这几个人一旦作出决定，其他人多半会跟着走。许多还在犹豫的学生也都摸着步枪，暗中等他们表态，所以军士始终不安地盯着跳马那边。
        - id: ch02-b34
          speaker: mcturk
          text: 福克西嫌我招来的新兵太小。甲虫，你再替他找几个。
        - id: ch02-b35
          speaker: narrator
          text: 甲虫马上又抓来两个低年级跟班。他们每个人都没一支卡宾枪高。
        - id: ch02-b36
          speaker: beetle
          text: 给你，两份炮灰。小畜生们，为你们的炉边和家园而战吧，动作快点！
        - id: ch02-b37
          speaker: mcturk
          text: 他还是不高兴。
        - id: ch02-b38
          speakers: [beetle, mcturk]
          ensemble: duo
          text: 我们对待陆军的办法，正是我们对待海军的办法。两种办法都把灾难招来，这是谁也不能否认的话！
        - id: ch02-b39
          speaker: narrator
          text: 这是他们从一本旧杂志里翻出的诗，眼下正合用。福克西叫他们帮不上忙就别捣乱，眼睛仍盯着跳马旁的会议。又有几个很有影响的学生加入进去，其他人迟疑着摆弄步枪。
        - id: ch02-b40
          speaker: stalky
          text: 等一下。正式开始以前，能不能把那些废物赶出去？
        - id: ch02-b41
          speaker: foxey
          text: 当然。愿意加入的人留在这里，不打算加入的请出去，顺手安静关好门。
        - id: ch02-b42
          speaker: narrator
          text: 六七个态度认真的家伙立即朝他们扑来。甲虫和麦克特克勉强护住衣领，险些没来得及逃进走廊。体育馆的门在身后关上，里面的人开始同福克西议条件，外面的两个人隔着门听见斯托基那句爱怎样怎样，立刻明白军团成员并不是忽然生出了献身的热情。
        - id: ch02-b43
          speaker: beetle
          text: 你为什么不参加？
        - id: ch02-b44
          speaker: mcturk
          text: 那你为什么不参加？
        - id: ch02-b45
          speaker: beetle
          text: 有什么用？我们又不进陆军。我也早懂操法了，除了持枪动作。真不知道他们在里面做什么。
        - id: ch02-b46
          speaker: mcturk
          text: 他们在跟福克西订条约。你没听见斯托基说，我们就这么办，他不喜欢也随他吗？这些人不到一年就要进桑赫斯特或伍尔维奇军校。他们会把福克西当补习老师，学会操法，然后立刻扔掉军团。加课已经那么多，难道还真会为了好玩参加志愿军？
        - id: ch02-b47
          speaker: beetle
          text: 我本想写首诗挖苦他们，题目就叫《打狗队之歌》。你觉得呢？
        - id: ch02-b48
          speaker: mcturk
          text: 写不成。没人问过金先生，他准会把军团骂得狗血淋头。这会儿他就在告示牌边嗅来嗅去。走，咱们引他上钩。
        - id: ch02-b49
          speaker: narrator
          text: 两个人装出最温顺的样子，漫不经心地走到金先生面前。
        - id: ch02-b50
          speaker: king
          text: 怎么回事？我还以为你们正在学习为国作战。
        - id: ch02-b51
          speaker: mcturk
          text: 我想连队已经满员了，先生。
        - id: ch02-b52
          speaker: beetle
          text: 真是太遗憾了。
        - id: ch02-b53
          speaker: king
          text: 那么，我们已经有四十位英勇的保卫者了？真高尚，真忠诚！我猜这份热情后面，也许藏着逃避日常责任的心思。他们一定会得到特殊待遇，就像唱诗班和博物学会一样。当然，不能叫人家捉虫子的。
        - id: ch02-b54
          speaker: mcturk
          text: 我想会的，先生。校长还没说，不过他当然会说。
        - id: ch02-b55
          speaker: king
          text: 他当然会。我的甲虫，你也许忘了，舍监在我们这套微不足道的生存安排里，是不可或缺却常受冷落的一环。舍监也可能对这事说几句。年轻人的人生，并不全是武器和战争物资。顺便提醒一句，我们还有教育这个目标。
        - id: ch02-b56
          speaker: narrator
          text: 走出金先生听得见的地方以后，麦克特克柔声称赞这头猪始终如一，永远知道该从哪里下手。他果然咬住了校长和特殊待遇那只饵。
        - id: ch02-b57
          speaker: beetle
          text: 该死，他至少该厚道一点，支持这项计划。我原本能写首极妙的歌去挖苦军团，现在倒得装成一个滑稽的热心拥护者。不过回自修室拿斯托基开心，总不犯禁吧？
        - id: ch02-b58
          speaker: mcturk
          text: 当然不犯。不过在学校里，咱们得拼命拥护军团。你可以照卡图卢斯的路数，写首滑稽短诗，专门讽刺金先生反对军团。
    - id: ch03
      title: 锁门操练
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 甲虫正忙着写这首高尚作品，斯托基结束第一次操练，浑身发热地回来了。
        - id: ch03-b02
          speaker: mcturk
          text: 喂，我的通条塞子！你的死狗呢？口令是保卫，还是反抗？
        - id: ch03-b03
          speaker: stalky
          text: 反抗！
        - id: ch03-b04
          speaker: narrator
          text: 斯托基说完便扑向麦克特克。两个人扭打一阵，才暂时停手。
        - id: ch03-b05
          speaker: stalky
          text: 听着，火鸡，你不能挖苦军团。我们安排得妙极了。福克西发过誓，除非我们自己愿意，他绝不会拉我们出去公开操练。甲虫，你把金先生引上钩了吗？
        - id: ch03-b06
          speaker: beetle
          text: 不完全算。不过你刚才那句话，很像他那种亲切可爱的口吻。
        - id: ch03-b07
          speaker: stalky
          text: 那就听你斯托基叔叔说。他是个伟大人物。还有，福克西答应让我们轮流指挥全团，一个接一个，人人单独来。这样一来，我们至少都能学会怎样指挥半个连。等进了伍尔维奇，就能提早免掉操练。亲爱的听众们，我们这就把教育和有益身心的娱乐合在一起了。
        - id: ch03-b08
          speaker: mcturk
          text: 我早知道你会把它弄成某种加课，你这个冷血畜生。难道不想为你那滑稽国家献身？
        - id: ch03-b09
          speaker: stalky
          text: 能躲过去，我才不想。所以你们不准挖苦军团。
        - id: ch03-b10
          speaker: beetle
          text: 我们几年前就决定好了。金先生自然会替我们挖苦。
        - id: ch03-b11
          speaker: stalky
          text: 那你就去挖苦金先生，我的滑稽诗人。编首顺口的打油诗，叫低年级生唱。
        - id: ch03-b12
          speaker: beetle
          text: 你只管参加志愿军，别碰我的桌子。
        - id: ch03-b13
          speaker: stalky
          text: 他抓不到任何把柄。
        - id: ch03-b14
          speaker: narrator
          text: 当时谁也没懂这句话。几天以后，甲虫和麦克特克想看军团操练，却发现体育馆锁着门，门外还有一个低年级生站岗。
        - id: ch03-b15
          speaker: mcturk
          text: 好大的胆子。
        - id: ch03-b16
          speaker: wake
          text: 不许从钥匙孔往里看。
        - id: ch03-b17
          speaker: mcturk
          text: 我倒喜欢这句话。韦克，你这小畜生可是我叫来参加志愿军的。
        - id: ch03-b18
          speaker: wake
          text: 没办法。我的命令是不许任何人往里看。
        - id: ch03-b19
          speaker: mcturk
          text: 要是我们偏要看呢？要是我们真把你宰了呢？
        - id: ch03-b20
          speaker: wake
          text: 我的命令是，谁来妨碍我站岗，我就把他的名字报告军团。操练结束，他们会按照军法处置他。
        - id: ch03-b21
          speaker: beetle
          text: 斯托基真是头畜生！
        - id: ch03-b22
          speaker: narrator
          text: 两个人一点也没怀疑这办法是谁想出来的。体育馆里传来枪托触地的撞击声。
        - id: ch03-b23
          speaker: beetle
          text: 你把自己当成滑稽的百夫长了？
        - id: ch03-b24
          speaker: wake
          text: 我的命令是，除了说明命令以外不准说话。我要是多嘴，他们会揍我。
        - id: ch03-b25
          speaker: narrator
          text: 麦克特克和甲虫互看一眼，摇摇头走了。过了很久，甲虫才开口。
        - id: ch03-b26
          speaker: beetle
          text: 我发誓，斯托基真是个伟大人物。还好，这套秘密会社的名堂准能把金先生逼疯。
        - id: ch03-b27
          speaker: narrator
          text: 烦恼的不只金先生。军团成员个个守口如瓶，外人问什么也问不出来。体育馆的门总是锁着，操练时还有哨兵把守，像真正的秘密会社。只有没发过誓的福克西肯开口。他越想越觉得荒唐，便去找懂行的凯特，把攒下的苦水全倒了出来。
        - id: ch03-b28
          speaker: foxey
          text: 我这辈子没见过这种胡闹。他们先把地方锁得严严实实，内哨外哨全有，然后才开始练。那股热心劲儿，简直像芥末一样呛人。
        - id: ch03-b29
          speaker: kates
          text: 可他们究竟图什么？
        - id: ch03-b30
          speaker: foxey
          text: 就为了学操法。您从没见过这样的事。我宣布解散，他们才开始练那些花招。可叫他们出去公开操练，他们死也不肯。我说，既然是学生军团，就该有军团的样子，不能躲在锁死的门后面。
        - id: ch03-b31
          speaker: kates
          text: 校方怎么说？
        - id: ch03-b32
          speaker: foxey
          text: 这又把我难住了。我去找校长，他一点忙也不帮。有时我觉得他是在拿我开心。谢天谢地，我没当过志愿军军士，不过以前我还一直体谅他们。如今我很庆幸自己做到过。
        - id: ch03-b33
          speaker: kates
          text: 我倒想看看。光听你讲，猜不出他们要做什么。
        - id: ch03-b34
          speaker: foxey
          text: 别问我，军士长。去问那个满脸雀斑的小科克兰，他才是这帮人的大元帅。
        - id: ch03-b35
          speaker: narrator
          text: 索布拉昂的老战士开口相求，又是界内唯一的糕点师，谁都不会拒绝。凯特便应邀来到体育馆，拄着手杖，老得颤巍巍的，坐在角落观看。每次队形变换，他都低声说，样子不错，相当不错。
        - id: ch03-b36
          speaker: foxey
          text: 这还不是他们真正想练的。等我宣布解散再看。
        - id: ch03-b37
          speaker: narrator
          text: 散开的口令一出，队伍仍然纹丝不动。佩罗恩出列，转身面对众人。他不时瞟一眼一本红封皮、带金属搭扣的书，凭它唤醒记忆，带队练了十分钟。后来，佩罗恩会在赤道非洲被自己的部下枪杀。现在，他的每一道口令都得到绝对服从。安塞尔接替了他，霍根又接替安塞尔。最后，斯托基放下步枪，深吸一口气，劈头盖脸朝全连喷出一阵足以让人枯萎的辱骂。
        - id: ch03-b38
          speaker: foxey
          text: 慢一点，科克兰少爷。操典里可没有这一套。
        - id: ch03-b39
          speaker: stalky
          text: 没事，军士。谁知道以后得对部下说些什么。看在老天份上，你们就不能站直吗？别再互相靠着，你们这群烂眼睛、鲱鱼肚子的阴沟耗子。我可不愿意替你们梳毛。来这里以前就该有人替你们收拾好，你们这帮民兵扫帚贼！
        - id: ch03-b40
          speaker: kates
          text: 还是那个老味道，我们熟得很。可他从哪儿学来的？
        - id: ch03-b41
          speaker: foxey
          text: 从他父亲或者叔叔那里吧，别问我。他们一半人大概都生在能听见军营喊话的地方。自从志愿军这场胡闹开始，我听到的顶嘴话，比从前服役一年听到的还多。
        - id: ch03-b42
          speaker: stalky
          text: 后排那个家伙，你站得像把肚子押进当铺了。对，就是你，安塞尔列兵。
        - id: ch03-b43
          speaker: narrator
          text: 斯托基把安塞尔从头到脚痛骂了三分钟，终于恢复平常语气。
        - id: ch03-b44
          speaker: stalky
          text: 哈，第一滴血归我。安塞尔，你脸红了，还在扭来扭去。
        - id: ch03-b45
          speaker: ansell
          text: 脸红这事我管不了，不过我不觉得自己扭了。
        - id: ch03-b46
          speaker: stalky
          text: 好，现在轮到你。
        - id: ch03-b47
          speaker: kates
          text: 老天，这比看戏还好玩。
        - id: ch03-b48
          speaker: narrator
          text: 安塞尔也有亲戚在军中。他慢吞吞地开口，用那副懒洋洋又爱琢磨的腔调，一路探进人格深不见底的地方。没过多久，斯托基已经满脸通红，手里的步枪明显发抖。
        - id: ch03-b49
          speaker: ansell
          text: 这滴血归我！你也顶不住。
        - id: ch03-b50
          speaker: stalky
          text: 我本来也没觉得自己顶得住。不过听上一阵，真会气得要命。怪不怪？
        - id: ch03-b51
          speaker: hogan
          text: 用来磨脾气倒很好。
        - id: ch03-b52
          speaker: narrator
          text: 动作迟缓的霍根把步枪放回枪架。
        - id: ch03-b53
          speaker: foxey
          text: 军士长，您以前见过这种事吗？
        - id: ch03-b54
          speaker: kates
          text: 志愿军我不太懂，可这么怪的场面，一辈子也没见过。不过他们想干什么，我看懂了。老天，我这一辈子被点出来臭骂过多少回！他们练得不错，实在相当不错。
        - id: ch03-b55
          speaker: foxey
          text: 要是能把他们带到外面，我想练成什么样都行。也许制服一发下来，他们就会改主意。
        - id: ch03-b56
          speaker: narrator
          text: 到了这时，军团确实该稍稍满足全校的好奇心了。站岗的哨兵先后三次受欺负，军团也毫不含糊，三次把肇事者抓来执行军法。全校因此怒气冲天，四处追问，一支谁也看不见、只能隔门听见枪托声的学生军团，究竟有什么用。金先生还特意恭贺他们有了看不见的保卫者，他们却挡不住这番讥刺，也抓不到回击的办法。福克西一天比一天阴沉烦躁，几名成员也公开怀疑，继续躲在锁死的门后是否明智。更要命的是，制服已经快送到了。制服一旦发下来，他们就非穿不可，也再难拒绝走上大路。可人生常常这样，难题会突然从外面得到解决。
    - id: ch04
      title: 国会议员的演说
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 校长早已正式通知理事会，他们的建议已经执行。据他所知，孩子们正在操练，至于怎样操练，他一个字也没说。科林森将军十分高兴，又把消息告诉一位朋友。那位朋友另有一位朋友，是个热心、聪明、尤其爱国的国会议员，总想用最短的时间做出最大的好事。可朋友的朋友究竟是什么人，谁也说不准。若是当面介绍，将军一眼也许就能看清斤两。偏偏那人只经别人转述，传到将军耳中的画像已经走样。
        - id: ch04-b02
          speaker: narrator
          text: 这位无可指摘的保守党议员正要到西部乡间，给一个选区的蒙昧选民传播光明。将军身为英国军人，心底总对终审法庭里的成员怀着敬意。既然那位议员途经学校，何不带上将军的推荐，顺路谈谈这支新成立、值得赞美的学生军团？将军的朋友说，不必弄得多正式，只要同孩子们稍微谈谈，讲一点他们听得懂的话。这位议员正是最合适的人。
        - id: ch04-b03
          speaker: collinson
          text: 我小时候，大人可不怎么跟孩子讲话。
        - id: ch04-b04
          speaker: narrator
          text: 朋友说时代变了，教育普及了。今天的孩子就是明天的男人，少年时留下的印象往往跟人一辈子。何况国家正在一天天败坏。
        - id: ch04-b05
          speaker: collinson
          text: 你说得很对。
        - id: ch04-b06
          speaker: narrator
          text: 当时，这个岛国正要开始格莱斯顿先生五年的统治，将军很不喜欢眼前的局面。他答应写信给校长，还觉得今天的孩子就是明天的男人这句话讲得极好。
        - id: ch04-b07
          speaker: headmaster
          text: 我十分欢迎久仰大名的雷蒙德·马丁先生，请他在学校住一夜。他想讲什么，只要自认能引起学生兴趣，都可以。要是他从没面对过这一类英国青年，我相信这会是一次很有趣的经历。
        - id: ch04-b08
          speaker: narrator
          text: 信寄出去以后，校长私下对约翰牧师说，最后一句恐怕离真相不远，又问他是否认识雷蒙德·马丁。
        - id: ch04-b09
          speaker: gillette
          text: 我读大学时有个同学叫这名字。记得他混沌空虚，不具形体，可热心得要命。
        - id: ch04-b10
          speaker: headmaster
          text: 下星期六，他要对全校讲爱国主义。
        - id: ch04-b11
          speaker: gillette
          text: 我们的孩子最恨星期六晚上被人占用。要跟他们的煮茶聚会争，爱国主义赢不了。
        - id: ch04-b12
          speaker: headmaster
          text: 艺术也赢不了。还记得莎士比亚之夜，还有那个带幻灯机的滑稽先生吗？
        - id: ch04-b13
          speaker: narrator
          text: 校长眼里闪着笑意。等演讲告示贴上走廊，甲虫看见星期六又被占了，立刻问这个国会议员究竟是哪路鬼东西。
        - id: ch04-b14
          speaker: mcturk
          text: 噢，罗密欧，罗密欧，你为什么偏偏是罗密欧？但愿这位别像上学期那个那么糟。
        - id: ch04-b15
          speaker: beetle
          text: 斯托基，你够爱国吗？要是不够，这家伙要来把你变得爱国。
        - id: ch04-b16
          speaker: stalky
          text: 只盼他别占掉整个晚上。看来我们非听不可。
        - id: ch04-b17
          speaker: mcturk
          text: 我才不肯错过。很多人觉得那个演罗密欧的女人无聊，我可不觉得。我喜欢她！还记得她演到一半打嗝吗？没准这人也会打嗝。谁先到体育馆，就替另外两个占座。
        - id: ch04-b18
          speaker: narrator
          text: 雷蒙德·马丁先生坐车来到校长住宅时，无数双眼睛从校园各处盯着他。大家早已知道，星期六的晚上要交到这个陌生人手里，自然要先看看他究竟是什么模样。他倒没有半点紧张，从马车上下来时显得爽快、活泼又和气，仿佛对自己即将面对的听众很有把握。
        - id: ch04-b19
          speaker: mcturk
          text: 瞧着有点像个粗汉，没准是激进党。他为了车钱骂了车夫，我听见了。
        - id: ch04-b20
          speaker: beetle
          text: 那是他的滑稽爱国主义。
        - id: ch04-b21
          speaker: narrator
          text: 喝过茶，三个男孩跟着人群抢座，选了一个隐秘、看不见的角落。所有煤气灯都亮着。远处小台子上摆着校长的公用书桌，马丁先生会站在那里高谈阔论，周围一圈椅子留给教师。福克西带着一身公差气派进来，把一根裹布的棍子斜靠在书桌旁。权威人物还没到，全校立刻鼓掌喝彩，问他拿的是什么，为什么偷人家的雨伞，又提醒他说学校不用桦条，只用藤条，还有人喊从右翼开始报数。直到校长和教师入场，示威才停。
        - id: ch04-b22
          speaker: beetle
          text: 有一点还不错，教员休息室跟我们一样恨这场东西。瞧金先生怎样扭来扭去，想逃掉这趟差事。
        - id: ch04-b23
          speaker: stalky
          text: 那个雷蒙德气味十足的马丁在哪儿？守时，亲爱的听众们，是战争的形象……
        - id: ch04-b24
          speaker: beetle
          text: 闭嘴，滑稽公爵来了。老天，好大一块喉垂！
        - id: ch04-b25
          speaker: narrator
          text: 马丁先生穿着晚礼服，脖颈果然粗大。他身材高大宽阔，脸色白里透红。
        - id: ch04-b26
          speaker: mcturk
          text: 看他跟校长说话时那个背，正对着听众，礼数坏透了。他到底是非利士人、波帕人、耶布斯人，还是希未人？
        - id: ch04-b27
          speaker: narrator
          text: 校长用几句平淡的话介绍了演讲人。马丁先生把掌声当成献给自己的，学生们便拍得更响。他等了很久才能开口。他不了解学校，也不了解这里的传统。他不知道，最近一次统计显示，百分之八十的学生生在海外的军营、驻地或大海上，百分之七十五是军官的儿子，准备继承父业。校长本来能把这些事告诉他。可陪他吃过一小时的晚饭以后，校长决定什么也不说。马丁先生似乎已经懂得太多。
        - id: ch04-b28
          speaker: martin
          text: 好吧，孩子们。我想，你们知道我为什么来，是不是？我很少有机会跟男孩子讲话。我猜，你们和我小时候差不多，都是同一种人。虽然也有人觉得，男孩子颇为古怪。
        - id: ch04-b29
          speaker: narrator
          text: 那句拖长又刺耳的孩子们，让每一根年轻的神经都不舒服。
        - id: ch04-b30
          speaker: mcturk
          text: 这个人就是那群冲进海里的猪。
        - id: ch04-b31
          speaker: martin
          text: 你们要记住，自己不会永远是男孩子。你们会长成男人，因为今天的孩子，就是明天的男人。祖国光荣而美好的名声，就要靠明天的男人来守住。
        - id: ch04-b32
          speaker: stalky
          text: 亲爱的听众们，他要是继续这么讲，我只好痛苦地挖苦这个粗汉了。
        - id: ch04-b33
          speaker: mcturk
          text: 你办不到。他演罗密欧又没收钱。
        - id: ch04-b34
          speaker: martin
          text: 所以，你们应当想想，未来的人生会带来哪些义务和责任。人生并不全是板球、足球和其他游戏。对，人生也不全是弹珠。
        - id: ch04-b35
          speaker: narrator
          text: 空气里响起一声绷紧的抽气。低年级生几乎尖叫起来，所有人都惊骇得发抖。他是个异教徒，已经越过宽容最远的边界，当着全人类亲口判了自己的罪。斯托基把头埋进手里。麦克特克双眼发亮，句句听得津津有味。甲虫却庄严地点头赞同。
        - id: ch04-b36
          speaker: martin
          text: 你们当中有些人，再过几年也许会盼望得到女王授予军官委任状的荣誉，佩上一柄军刀。我本人是志愿军某团的少校，对这些职责很有经验。听说学校成立了志愿军团，我非常高兴。这样的机构能培养正确、健康的精神，也会让我们热爱并引以为豪的国家大大受益。
        - id: ch04-b37
          speaker: martin
          text: 我相信，在座有人正期待，甚至焦急地盼望着率领部下，迎向英国敌人的枪弹。你们会在青春盛年，昂首面对尸横遍野的战场。
        - id: ch04-b38
          speaker: narrator
          text: 男孩子的矜持比姑娘深十倍，因为盲目的天性只为一个目的造就姑娘，却要为几个目的造就男人。马丁先生伸出一只健康的大手，把一层层帷幕扯下来，再用善意滔滔的双脚从上面踏过去。他沙哑地喊着荣誉的希望、光荣的梦想。这些很小又很重的事，男孩连对最亲密的朋友也不会提，更不会拿出来供人观看。他却轻松地认定，自己开口以前，他们根本没有想过。他伸出手指，给他们看那个闪亮的目标，却在指点时把天边原有的光辉全弄模糊了。他越讲越响，不住挥动双臂，闯进他们灵魂里最隐秘的地方。他还吩咐他们该怎样去想祖先的功业，仿佛那些记忆也要由他来解释。孩子们坐在下面，连耳朵都羞得发红发麻，却不能说出自己为什么难受。
        - id: ch04-b39
          speaker: martin
          text: 也许你们中间有些人，已经有亲人为保卫祖国而死。你们应当仿效那些光辉的榜样。
        - id: ch04-b40
          speaker: narrator
          text: 不少人想起家里走廊中，或早餐室餐桌上方挂着的一柄旧剑。自从会走路起，他们就偷偷看过，也偷偷摸过，却很少开口问那把剑的来历。如今马丁先生把这种记忆拖到煤气灯下，命令他们把它叫作光辉榜样。人人都极不自在，目光四处躲闪。他们的年纪甚至不允许自己把这些念头清清楚楚地说给自己听。他们只凶狠地感觉到，自己受了一个胖子的侮辱，而那个胖子竟然还把弹珠当成游戏。
        - id: ch04-b41
          speaker: narrator
          text: 马丁先生没有察觉听众的厌恶，还以为那些僵硬的脸和冻结的寂静，正说明自己的话已经打动了他们。他一步步走向演说的高潮，把声音抬得更高，手臂挥得更有力量。后来，他在一次选民大会上又用过同一段话，还获得了压倒性的成功。可此刻，孩子们只是红着脸，在座位上坐立不安，心里满是酸涩的厌恶。他说了一句又一句，仿佛只要说得足够多，就能替他们说明他们自己。终于，他伸手拿起那根裹布的棍子，又把另一只手伸进胸前，准备亮出整场演说最后的东西。
        - id: ch04-b42
          speaker: martin
          text: 这就是我们国家真正的象征，值得你们献上一切尊敬和崇仰！哪个孩子不愿为它不朽的光彩再添光辉，哪个孩子就不配看这面旗！
        - id: ch04-b43
          speaker: narrator
          text: 他把旗猛地抖开。一面硕大的印花布联合王国旗，红白蓝三色刺眼地瞪着众人。马丁先生等着雷鸣般的掌声，为自己的努力加冕。
        - id: ch04-b44
          speaker: narrator
          text: 全校默默看着，没有一个人鼓掌。他们当然认得这东西。海岸警卫站有，从望远镜里看见双桅船搁浅在布朗顿沙洲时，也见过它降到半旗。高尔夫俱乐部屋顶上有，凯特橱窗里也有，某种条纹糖果每只盒子外面都包着印有它的纸。可学校从来不悬挂这面旗，它不属于他们每天生活的安排。校长从没拿它说过什么，父亲们也不曾借它向孩子们宣讲。它一直被封闭在别处，神圣而疏远。看在世间一切下流事物的份上，这个人到底想干什么？为什么要把如此可怕的东西在他们眼前挥来挥去？就在大家难受得无处可逃时，一个让人快活的念头忽然冒了出来。也许他喝醉了。
        - id: ch04-b45
          speaker: narrator
          text: 校长一直坐在一旁看着。沉默拖得再也不能更长时，他迅速起身提议致谢，总算救下了场面。他才一动，全校就像忽然得到许可，终于能从难堪里脱身，立刻如释重负地疯狂鼓掌。那掌声既热烈又长久，马丁先生听来当然只有一种意思。
        - id: ch04-b46
          speaker: headmaster
          text: 我相信，大家一定愿意同我一起，向雷蒙德·马丁先生表示十分热烈的感谢，感谢他给我们带来这场无比愉快的演讲。
        - id: ch04-b47
          speaker: narrator
          text: 直到今天，也没人知道事实究竟如何。校长发誓自己绝没做过那种事。就算做了，也一定只是眼睛里进了东西。可在场的人都坚信，他说完无比愉快以后，曾公开而庄严地眨了一次眼。马丁先生则如数收下了掌声。
        - id: ch04-b48
          speaker: martin
          text: 我不是自夸，不过我想，这几句话确实说进了他们心里。我从不知道男孩子能这样欢呼。
    - id: ch05
      title: 旗帜与解散
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 祈祷铃响时，马丁先生离开，孩子们靠墙列队。旗还摊在书桌上。福克西自豪地看着它，他已经被演讲深深打动。校长和教师站在台子后面，看不见那件刺眼的冒犯。一名级长走出队伍，飞快卷起旗，又同样飞快地把它扔进存放拳击手套和花剑的柜子。
        - id: ch05-b02
          speaker: narrator
          text: 就像碰到了什么机关，一阵满足的低语立刻沿队伍响起，接着变成密集迅疾的掌声。旗终于离开眼前，大家才觉得那场难堪真正结束。回到宿舍，他们又把演说从头议论了一遍，没有一个人持不同意见。雷蒙德·马丁先生毫无疑问生在阴沟，养在一所玩弹珠的公立小学。他还是瘪皮下等货、无耻臭虫和晃旗子的果冻肚皮，最后这个称呼来自斯托基。庞大的词库里还有不少更厉害的称呼，只是不便写下来。
        - id: ch05-b03
          speaker: narrator
          text: 下个星期一，志愿学生军团列队时情绪低落，人人满脸羞惭。即使到了这一步，只要福克西谨慎地保持沉默，事情也许还有转机。
        - id: ch05-b04
          speaker: foxey
          text: 前晚听了那么精彩的演说，你们今天操练，应该拿出焕然一新的劲头。我看你们也没法再逃避公开行进了。
        - id: ch05-b05
          speaker: stalky
          text: 那么，我们躲不过去了，福克西？
        - id: ch05-b06
          speaker: narrator
          text: 斯托基的声音古老又丝滑，本该给福克西敲响警钟。
        - id: ch05-b07
          speaker: foxey
          text: 躲不过。人家那么慷慨地送来旗。今天早晨离开以前，他亲口告诉我，让军团把它当自己的旗，完全没有问题。那面旗很漂亮。
        - id: ch05-b08
          speaker: narrator
          text: 斯托基一言不发，把步枪放回架上，走出队列。霍根和安塞尔跟着照做。佩罗恩迟疑起来。
        - id: ch05-b09
          speaker: perowne
          text: 听我说，我们是不是应该……
        - id: ch05-b10
          speaker: foxey
          text: 我一会儿就从柜子里把旗拿出来，然后我们可以……
        - id: ch05-b11
          speaker: stalky
          text: 走！你们到底还在等什么鬼东西？解散！散开！
          emotion: angry
        - id: ch05-b12
          speaker: foxey
          text: 怎么？什么？这到底是……
          emotion: surprised
        - id: ch05-b13
          speaker: narrator
          text: 一支支斯奈德步枪接连砸进枪架，沉重的撞击声响成一片，把军士的声音彻底淹没。刚才还排得整整齐齐的队伍转眼散掉，男孩们一个接一个退出队列。没人再提学操法的好处，也没人肯等福克西把那面漂亮的旗从柜子里拿出来。
        - id: ch05-b14
          speaker: foxey
          text: 我不知道自己是不是非得把这件事报告校长。
        - id: ch05-b15
          speaker: stalky
          text: 去报告吧，见你的鬼去！
          emotion: angry
        - id: ch05-b16
          speaker: narrator
          text: 斯托基的嘴唇白得没有一点血色。他喊完便跑了出去。
        - id: ch05-b17
          speaker: beetle
          text: 怪事！我本来在自修室写一首妙得不得了的诗，骂那个晃旗子的果冻肚皮。斯托基进来，我跟他打招呼，他却像个粗汉一样把我臭骂一顿，然后哭得一塌糊涂。他把脑袋压在桌上，放声嚎啕。我们是不是该做点什么？
        - id: ch05-b18
          speaker: mcturk
          text: 也许他不知怎么把自己伤着了。
        - id: ch05-b19
          speaker: narrator
          text: 两个人找到斯托基时，他的眼睛亮得出奇，正从牙缝间吹口哨。
        - id: ch05-b20
          speaker: stalky
          text: 骗到你了吗，甲虫？我就知道能骗到。这个饵下得怎么样？你是不是真以为我在哭？我演得棒不棒？哦，你这头肥老驴！
        - id: ch05-b21
          speaker: narrator
          text: 斯托基一边说，一边扯甲虫的耳朵和脸颊，使出那套叫作挤奶的手法。
        - id: ch05-b22
          speaker: beetle
          text: 我知道你在哭。你为什么没去操练？
        - id: ch05-b23
          speaker: stalky
          text: 操练？什么操练？
        - id: ch05-b24
          speaker: beetle
          text: 别故意装成一个聪明的蠢货。体育馆里的操练。
        - id: ch05-b25
          speaker: stalky
          text: 因为根本没有操练。志愿学生军团完了，解散了，死了，腐烂了，坏透了，臭不可闻。甲虫，你再这样看我，我也把你宰了。哦，对了，我还会因为骂人被报告给校长。
