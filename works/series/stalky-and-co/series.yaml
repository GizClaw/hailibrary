cover_prompt: |-
  A wordless cover scene on the north Devon coast in the late nineteenth century shows three English schoolboys slipping through flowering gorse above a blue-gray sea while pretending to collect natural-history specimens. A freckled, deep-set-eyed boy leads with alert confidence, a lean sharp-faced boy follows with a geological hammer, and a bespectacled boy carries a folded butterfly net and books tucked against his dark school clothes. Behind them, a red-haired school sergeant with binoculars searches near their hidden hut, unaware that the boys have circled around him. The focal action is the trio exchanging a quick conspiratorial glance as they duck behind the golden gorse. Use a wide child-height three-quarter view with the boys forming a strong foreground triangle, the school buildings small in the distance, and generous calm coastal sky at the top. Keep the clothing, tools, cliffs, and vegetation credible to an English boarding school in the 1890s, with lively but restrained expressions and no threatening action. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
