      display_name: 学生丙
      tts:
        delivery: 顽皮随性，附和众人时毫不拘束
        timbre: 稍亮的少年音
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 最后一次进城
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 离放假只剩几天，期末考试已经到了眼前。比考试更要紧的是，甲虫主编的校刊也赶着出刊。斯托基和麦克特克又哄又骗，再加上自修纪律毫不留情，才把他推上主编的位置。甲虫上任以后才发现，自己和历任主编没有两样。他负责所有苦活，两位朋友只负责在一旁挑毛病。斯托基为了虔诚纪念斯庞奇，给刊物取名《斯威灵福德爱国者》。麦克特克却嫌它远远比不上拉斯金和德·昆西。
        - id: ch01-b02
          speaker: narrator
          text: 真正关照这份校刊的只有校长，而且他关照的方式很特别。他准许甲虫随意进出自己的书房，既不拦他读什么，也不特意推荐什么。那儿有宽大的扶手椅、银墨水台和用不完的纸笔。棕色书脊一排排立着，烟草香里藏着一整套古代戏剧，还有哈克卢特的航海记。两个叫普希金和莱蒙托夫的俄罗斯作家，也在那里，不过读到的是法文译本。皮科克那些醉人又迷离的小故事中间，还会忽然穿插几首奇异的歌谣。
        - id: ch01-b03
          speaker: narrator
          text: 书架上还有博罗的《拉文格罗》，以及一部长得很古怪、号称译自某种原作的诗，名叫《鲁拜集》。校长说，它真正的时代还没有到来。几百卷诗集里，甲虫见到克拉肖、德莱顿、亚历山大·史密斯、莱蒂蒂娅·兰登和莉娅·西格妮。他也翻到弗莱彻和那座紫岛，还有邓恩与马洛的《浮士德》。等他发现《莪相》、《尘世乐园》、《卡吕冬的阿塔兰忒》和罗塞蒂，立刻把消息带给麦克特克。麦克特克为此足足陶醉了三天，而这还只是书架上的一小部分。
        - id: ch01-b04
          speaker: narrator
          text: 校长有时会借口审查校刊，慢慢踱进书房。他从这位诗人那里读一节，又从那位那里读一节，替甲虫打开一条又一条新路。他叼着雪茄，眼睛半闭，呼吸得很慢。他谈起当世那些大人物，也谈起早已停刊的杂志。那都是他们年轻狂放时亲手办起来的。校长说到那些年月，仿佛所有行星都还是刚刚亮起的小星星，正在毫不关心的虚空里寻找各自的位置。而他认识那些人，就像年轻人彼此认识一样。
        - id: ch01-b05
          speaker: narrator
          text: 有了这些谈话，正经功课当然全被忘在脑后。甲虫心里塞满了新的事情和新的韵律，却把它们悄悄藏着，只肯在午后讲给麦克特克听。两个人沿着海滩散步，绕过无敌舰队沉船留下的残骸。他们迈着高傲而从容的步子，迎着一排排滚来的长浪，把刚刚发现的诗句高声吟诵出来。
        - id: ch01-b06
          speaker: narrator
          text: 三个学期接连过去，舍监始终不信任他们，所以三个人一个也没当上级长。级长靠本事选出，手里能拿白蜡木手杖，还能在种种限制下使用它。
        - id: ch01-b07
          speaker: stalky
          text: 不过咱们落选以后，跟六年级闹出的笑话，比过去七年里任何人都多。
        - id: ch01-b08
          speaker: narrator
          text: 斯托基得意地摸着脖子上的硬立领。照规矩，只有六年级能戴这种领子。要是去年那些厉害人物还在，不出五分钟就会命令他们摘掉。可这一届六年级大多年轻得很，偏偏又聪明过人。他们是舍监的宠儿，也太看重自己的体面，不肯公开招惹这三个足智多谋的家伙。于是三个人把帽子死死扣在脑后，不再像普通五年级那样歪到一只眼睛上方。他们平日穿漆皮靴，星期日系精心打好的古怪领带，也始终没人斥责。
        - id: ch01-b09
          speaker: narrator
          text: 麦克特克准备在春天投考库珀山学院，斯托基则要进桑赫斯特。校长已经分别看过他们的准备，也明白两个人的脾气。他说，只要他们放假以后别彻底垮掉，录取便是十拿九稳。校长很会调教年轻人，就像善于训练小马的人一样。他一旦看准学生的成色，便很少走眼。
        - id: ch01-b10
          speaker: narrator
          text: 那天，校长单独把甲虫叫到一旁，告诉他未来的安排，又给了许多很好的忠告。可甲虫兴奋得脸色发白，转身就一路冲回自修室。等他面对两个朋友，那些忠告已经一个字也想不起来。他脑子里只剩下那件不可思议的事，急着把消息完整讲给他们听。
        - id: ch01-b11
          speaker: mcturk
          text: 一上来就给你一年一百镑？胡扯！
        - id: ch01-b12
          speaker: beetle
          text: 还替我付出海的船票！都定好了。校长说，他早就在训练我干这行，我却一点也不知道。刚进报馆当然不能马上写文章，得先填电报，再拿剪刀剪报纸。
        - id: ch01-b13
          speaker: stalky
          text: 哎哟，剪刀手！你准能弄得乱七八糟。不过这确实是你最后一个学期了。整整七年哪，诸位最亲爱的听众，尽管咱们没当上级长。
        - id: ch01-b14
          speaker: mcturk
          text: 这七年过得不坏。离开老学院，我会舍不得。你们不会吗？
        - id: ch01-b15
          speaker: narrator
          text: 他们望向海面。清澈的冬日阳光下，白沫沿着卵石滩翻卷。
        - id: ch01-b16
          speaker: stalky
          text: 明年这时候，咱们会在哪里？
        - id: ch01-b17
          speaker: mcturk
          text: 五年以后在哪里，才真有意思。
        - id: ch01-b18
          speaker: beetle
          text: 我要走的事只有咱们知道。校长肯定没告诉别人。普劳特今天还冲我哼哼，说我下学期要是懂事些，也许能当级长。呸！他一定缺级长缺得厉害。
        - id: ch01-b19
          speaker: mcturk
          text: 临走以前，跟六年级狠狠干一场吧。
        - id: ch01-b20
          speaker: stalky
          text: 真像肮脏的小学生。那有什么意思？
        - id: ch01-b21
          speaker: mcturk
          text: 为了道义上的影响。还可以留下不朽传统，诸如此类。
        - id: ch01-b22
          speaker: stalky
          text: 不如去比迪福德把欠账还了。我父亲特地给了我三镑，我欠的还不到三十先令。甲虫，去找校长请假，就说你要校订《斯威灵福德爱国者》。
        - id: ch01-b23
          speaker: beetle
          text: 我的确要校订。这是最后一期，我想把它办得像样些。趁校长还没去吃午饭，我现在就去。
        - id: ch01-b24
          speaker: narrator
          text: 十分钟后，三个人并排骑车出发。他们蒙受特别恩准，不必参加五点点名，所以从午后到天黑，整段时间都归自己支配。不巧的是，金先生也走在同一条路上。他看见学生，从来没有不挖苦几句的时候。可甲虫今天的心已经飞到海外，哪怕路上排着一整旅金先生，也休想搅乱他的好心情。
        - id: ch01-b25
          speaker: king
          text: 啊哈，诸位朋友在钻研轻松文学哪。普通数学怎么配得上你们这么高的才智，是不是？
        - id: ch01-b26
          speaker: narrator
          text: 甲虫想着那一年一百镑，朝空处微笑。
        - id: ch01-b27
          speaker: king
          text: 既然大家公认自己无能，你们只好躲进不准确小说的花径。不过清算的日子快到了，我的甲虫。我亲自拟了几道小小的拉丁散文题。你平时再会骗人，这次恐怕也躲不过。对，就是拉丁散文。等试卷发下来，你们就会明白，乌尔比安正合你的需要。啊哈，我们的朋友说，天渐渐亮了。等着瞧吧！
        - id: ch01-b28
          speaker: narrator
          text: 甲虫还是毫无反应。他虽然骑车走在学院外的路上，心里却已经站在一艘轮船的甲板上。出海的船票由别人付钱，那艘船正载着他驶向辽阔又奇妙的世界，离熟悉的伦迪岛足有千里之遥。金先生发现所有讥刺都打在空处，只得咆哮一声，把他丢在路上。
        - id: ch01-b29
          speaker: beetle
          text: 他什么也不知道。下学期，再下个学期，他还会批练习，唠叨不停，在小孩子面前卖弄。
        - id: ch01-b30
          speaker: narrator
          text: 甲虫沿着学院背后长满金雀花的陡坡追上同伴。他们正在朝煤气罐顶上扔石子。满身煤灰的煤气工叫他们住手，又给埋在两丛金雀花之间的地下旋塞上油。
        - id: ch01-b31
          speaker: stalky
          text: 煤气佬，那东西是干什么的？
        - id: ch01-b32
          speaker: gasman
          text: 给厨房开煤气。我要是不开，你们几位小少爷晚上只能点蜡烛念书。
        - id: ch01-b33
          speaker: stalky
          text: 唔，那我明白了。
        - id: ch01-b34
          speaker: narrator
          text: 斯托基听完，只发出这一声，随后至少沉默了整整一分钟。等小路转过一个弯，他们迎面撞上金舍的高级级长塔尔克。塔尔克个子不高，头发却雪白。他属于那种因为太聪明而不能不提拔的学生。可一当上级长，他便总是热心得过了头，判断事情又很不可靠。每次把局面弄得无法收拾，最后都要跑去求校长替他撑住威信。
        - id: ch01-b35
          speaker: tulke
          text: 喂！你们几个上哪儿去？
        - id: ch01-b36
          speaker: narrator
          text: 三个人根本不理他，因为他们手里有合法的外出证。塔尔克在五号自修室这伙人手下吃过许多亏，这回却以为终于抓住了把柄。他越想越有把握，于是气冲冲地追着又问了一遍。
        - id: ch01-b37
          speaker: stalky
          text: 关你屁事？
        - id: ch01-b38
          speaker: tulke
          text: 听着，我不……我不许五年级这样骂我！
          emotion: angry
        - id: ch01-b39
          speaker: mcturk
          text: 那就赶紧召集级长会议。
        - id: ch01-b40
          speaker: narrator
          text: 塔尔克气得说不出话。这正是他的弱点。
        - id: ch01-b41
          speaker: stalky
          text: 不该这样冲五年级嚷嚷。太没风度。
        - id: ch01-b42
          speaker: mcturk
          text: 有话快说呀，小宝贝。
        - id: ch01-b43
          speaker: tulke
          text: 我……我要知道，你们越界出来做什么？
        - id: ch01-b44
          speaker: narrator
          text: 他郑重地挥了挥白蜡木手杖。
        - id: ch01-b45
          speaker: stalky
          text: 啊，这才问对了。刚才怎么不这么说？
        - id: ch01-b46
          speaker: tulke
          text: 好，我现在问了。你们在干什么？
        - id: ch01-b47
          speaker: stalky
          text: 我们正在欣赏你，塔尔克。我们觉得你真是个好得不得了的家伙，对不对？
        - id: ch01-b48
          speakers: [beetle, mcturk]
          ensemble: duo
          text: 对！对！
        - id: ch01-b49
          speaker: narrator
          text: 一辆载着几个姑娘的双轮马车飞驰过拐角。斯托基立刻摆出祈祷的姿势，跪倒在塔尔克面前。塔尔克的脸一下变了颜色。
        - id: ch01-b50
          speaker: tulke
          text: 我有理由相信……
        - id: ch01-b51
          speaker: beetle
          text: 肃静！肃静！塔尔克有理由相信！为塔尔克欢呼三声！
        - id: ch01-b52
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 好！好！好！
        - id: ch01-b53
          speaker: stalky
          text: 都怪我们太仰慕你。你知道我们多爱你吗？我们爱得觉得你该回家死掉。你实在太好了，不配活在人世。
        - id: ch01-b54
          speaker: mcturk
          text: 没错。请务必赏脸死一死。想想看，你做成标本会多漂亮。
        - id: ch01-b55
          speaker: narrator
          text: 塔尔克恶狠狠地瞪了他们一眼，大步走远。
        - id: ch01-b56
          speaker: stalky
          text: 这下准有级长会议。事情牵涉六年级的荣誉嘛。塔尔克整个下午都会写便条，卡森喝完茶就会传我们过去。他们不敢不追究。
        - id: ch01-b57
          speaker: mcturk
          text: 赌一先令，他会跟踪咱们。他是金先生的宠儿，只要抓到咱们越界，两边都有战利品。咱们可得规规矩矩。
        - id: ch01-b58
          speaker: beetle
          text: 那就去约太太家最后大吃一顿。咱们大约欠她十先令。玛丽知道我们要走，准会哭得伤心。
        - id: ch01-b59
          speaker: stalky
          text: 上回玛丽狠狠抽了我脑袋一下。
        - id: ch01-b60
          speaker: mcturk
          text: 谁叫你没躲开。不过她通常还会回亲一个。走吧，去约太太家。
        - id: ch01-b61
          speaker: narrator
          text: 小店开在一条狭窄横街的尽头，窗格用酒瓶底镶成，一半卖奶品，一半做饭馆。两百年的老屋颜色深沉，缩在街角。他们从当小跟班起就常来这里，吃过不知多少顿，也惹过不知多少麻烦。店里人看着他们一年年长大，彼此早已熟得像一家人。
        - id: ch01-b62
          speaker: stalky
          text: 妈妈，我们来还债，也来告别。还有，我们快饿死了。
        - id: ch01-b63
          speaker: narrator
          text: 斯托基一把搂住女店主粗壮的腰。
        - id: ch01-b64
          speaker: mrs_yoe
          text: 哎呀，还来跟我调情！真不害臊。
        - id: ch01-b65
          speaker: mcturk
          text: 要是玛丽在，俺看你们才不敢这么干。
        - id: ch01-b66
          speaker: mary
          text: 谁拿俺的名字胡说八道？
        - id: ch01-b67
          speaker: narrator
          text: 里门打开，玛丽端着一碗奶油走进来。她金发蓝眼，脸颊红得像苹果。麦克特克亲了她一下，甲虫也镇定地照做，两个人马上各挨一巴掌。
        - id: ch01-b68
          speaker: stalky
          text: 能亲女主人，就甭去亲女佣。
        - id: ch01-b69
          speaker: narrator
          text: 他厚着脸皮朝约太太眨眼，一边翻看架上的果酱。
        - id: ch01-b70
          speaker: mary
          text: 这边还有谁想再挨一下？
        - id: ch01-b71
          speaker: stalky
          text: 不咧！俺自有人肯送上门。
        - id: ch01-b72
          speaker: mary
          text: 可不是俺，你这小活宝！
        - id: ch01-b73
          speaker: stalky
          text: 俺又没求你。诺瑟姆有的是姑娘，阿普尔多尔也有。
        - id: ch01-b74
          speaker: narrator
          text: 他哼了一声，半是轻蔑，半是回味，正好替这句话收尾。
        - id: ch01-b75
          speaker: mary
          text: 哎呀，你这辈子准没好下场。你闻奶油干什么？
        - id: ch01-b76
          speaker: stalky
          text: 坏咧。你闻闻。
        - id: ch01-b77
          speaker: narrator
          text: 玛丽没留神，果然凑过去闻。
        - id: ch01-b78
          speaker: stalky
          text: 这叫比迪福德的亲嘴。
        - id: ch01-b79
          speaker: narrator
          text: 斯托基毫发无损地亲到了。
        - id: ch01-b80
          speaker: stalky
          text: 永远不嫌多。
        - id: ch01-b81
          speaker: mary
          text: 你这个坏家伙！
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: 玛丽笑得说不成句。
        - id: ch01-b83
          speaker: stalky
          text: 诺瑟姆的更好，味儿更足，而且俺们还能讨回来。
        - id: ch01-b84
          speaker: narrator
          text: 麦克特克一本正经地拉着约太太跳华尔兹，把她转得喘不过气。等大家坐下来吃奶油凝块、果酱和热面包，甲虫才把伤心消息告诉玛丽。
        - id: ch01-b85
          speaker: beetle
          text: 对咧。以后你再也见不着俺们了，玛丽。俺们要去当牧师，当传教士。
        - id: ch01-b86
          speaker: mcturk
          text: 稳住，老伙计！塔尔克真跟来了，正沿街往上走。
        - id: ch01-b87
          speaker: mrs_yoe
          text: 他们从没禁止俺们招待你们。别动，俺的小亲亲们。
        - id: ch01-b88
          speaker: narrator
          text: 约太太滚进里屋算账去了。
        - id: ch01-b89
          speaker: stalky
          text: 玛丽，你爱俺不？
        - id: ch01-b90
          speaker: mary
          text: 当然咧！你才这么高，俺就告诉过你咧！
        - id: ch01-b91
          speaker: stalky
          text: 瞧见街上那个人没有？他打出生到现在，还没让任何姑娘亲过。哎呀，真丢人！
        - id: ch01-b92
          speaker: mary
          text: 关俺什么事？顺其自然，总有一天会轮到他。你该不会真想叫俺亲他吧？
        - id: ch01-b93
          speaker: stalky
          text: 你肯亲，我就给你半克朗。
        - id: ch01-b94
          speaker: narrator
          text: 半克朗对玛丽·约很值钱，可一次好玩的恶作剧更值钱。她明明已经动了心，还是装作迟疑，没立刻答应。
        - id: ch01-b95
          speaker: mcturk
          text: 你怕咧。
        - id: ch01-b96
          speaker: beetle
          text: 哎呀，诺瑟姆的姑娘可不会犹豫。何况你还这么俊！
        - id: ch01-b97
          speaker: narrator
          text: 麦克特克牢牢用一只脚抵住里门，免得约太太回来得不是时候。玛丽已经下定决心。塔尔克沿街走到店外，忽然被这个高挑的德文姑娘挡住去路。德文郡的人从不吝惜亲吻，那本来是太阳底下最宜人的地方。塔尔克毫不知情，还很有礼貌地往旁边躲。玛丽略微想了想，伸出一只大手，稳稳按在他的肩上。
        - id: ch01-b98
          speaker: mary
          text: 俺的小亲亲，你这是上哪儿去呀？亲俺一个！学院里没教你礼貌吗？
        - id: ch01-b99
          speaker: narrator
          text: 斯托基把手帕死死塞进嘴里。塔尔克的脸一下涨得通红。他倒抽一口气，转过身。玛丽郑重又尽职地亲了他两下，这位倒霉的级长拔腿就逃。
        - id: ch01-b100
          speaker: stalky
          text: 亲了？
        - id: ch01-b101
          speaker: mary
          text: 亲咧！可哎呀，我的小乖乖，他哪像个学院生。俺看他都快哭咧。
        - id: ch01-b102
          speaker: mcturk
          text: 反正我们不会。你那样大喊也吓不哭我们。试试看。
        - id: ch01-b103
          speaker: narrator
          text: 于是玛丽把他们三个挨个打了一遍。他们走出店门，耳朵还火辣辣的。
        - id: ch01-b104
          speaker: stalky
          text: 我看级长会议开不成了。
        - id: ch01-b105
          speaker: beetle
          text: 怎么会不开！要是他亲了她，咱们就咬定他道德败坏，行为公然猥亵。照搬金先生抓到我看《唐璜》时的那套演说。
        - id: ch01-b106
          speaker: mcturk
          text: 他当然亲了她。就在大街中间，还戴着舍帽！
        - id: ch01-b107
          speaker: stalky
          text: 下午三点五十七分，记下来。甲虫，你到底什么意思？
        - id: ch01-b108
          speaker: beetle
          text: 他是个诚实的小畜生，也许会说是她亲了他。
        - id: ch01-b109
          speaker: stalky
          text: 那又怎么样？
        - id: ch01-b110
          speaker: beetle
          text: 那才妙呢！这就说明六年级连自己都保护不了，任人欺负，任人强吻，非得雇保姆看着才行。咱们把话悄悄传遍学院，六年级有苦头吃，我们怎么都能尝到甜头！
        - id: ch01-b111
          speaker: stalky
          text: 好家伙！最后一个学期收尾收得真漂亮。现在你去把那份破报纸弄完，火鸡和我帮忙。咱们走后门，别惊动兰德尔。
        - id: ch01-b112
          speaker: beetle
          text: 那你们可别扮该死的花园山羊，四处胡闹。
    - id: ch02
      title: 铅字与黑暗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 甲虫很清楚，这两人嘴里的帮忙到底是什么意思。不过能在盟友面前显一显自己的重要，他也很乐意。兰德尔印刷所后面的小阁楼是他一个人的领地。在满身油墨的学徒指点下，他学会了怎样在字盘之间绕来绕去，多少有些曲折地找到自己要的铅字。他已经自认是排字专家。每次站在那里，他甚至能看见将来的自己执掌《泰晤士报》的模样。
        - id: ch02-b02
          speaker: narrator
          text: 校刊版面已经锁在版框里，平平放在一张石面桌上，旁边也摆好了校样。正常的编辑只要对着校样检查就够了，甲虫却宁死也不肯这样做。他拿起一把木槌和一副镊子，先敲掉那些用途神秘的木楔，再亲手松开整个版框。他从铅字中间一路读下去，这里挑出一个字母，那里重新塞进一个字母，还常常停下来，为自己写在校刊上的文章暗暗发笑。
        - id: ch02-b03
          speaker: mcturk
          text: 等你真靠这个吃饭，就不会这样卖弄了。这些字上下颠倒，左右又反着，对吧？让我试试能不能读。
        - id: ch02-b04
          speaker: beetle
          text: 滚开！你要真懂那么多，就去读架子上那些版框。
        - id: ch02-b05
          speaker: mcturk
          text: 架子上的版框？别摆出这副该死的行家样子。
        - id: ch02-b06
          speaker: narrator
          text: 麦克特克和斯托基走开，在印刷所里到处翻，几乎没放过任何东西。几分钟后，斯托基叫甲虫过去看一个眼熟的版框。
        - id: ch02-b07
          speaker: beetle
          text: 这是金先生的拉丁散文考卷，《反维勒斯：第一次审理》。这下可有乐子了！
        - id: ch02-b08
          speaker: mcturk
          text: 想想那些灵魂纯洁、志趣高尚的孩子吧。他们肯拿眼珠换一次偷看的机会！
        - id: ch02-b09
          speaker: stalky
          text: 不行，亲爱的威利，那会伤害善良老师的心。作弊是不对的，你可不能干。
        - id: ch02-b10
          speaker: mcturk
          text: 反正这些鬼东西我也看不懂。再说学期结束我们就走，对咱们毫无影响。
        - id: ch02-b11
          speaker: stalky
          text: 还记得“体贴的花花公子”怎么改斯普拉根那篇猎犬追猎记吗？咱们也替金先生的牛奶加点糖。看看甲虫能拿他得意的镊子做些什么。
        - id: ch02-b12
          speaker: narrator
          text: 斯托基想起那次著名的恶作剧，浑身上下都被一种邪恶的喜悦照亮。他当然不是想偷看试题，那对三个即将离校的人毫无用处。他想到的是另一种更体贴、更能回报金先生多年教导的办法。
        - id: ch02-b13
          speaker: beetle
          text: 我不知道拉丁散文还能歪到哪儿去，不过可以试试。瞧，把 aliud 和 Asiae 换个位置。再把句号往后挪，用后面的大写字母起句。好极了！这三行还能整块搬上去。
        - id: ch02-b14
          speaker: stalky
          text: 这是那位著名猎手最负盛名的科学休息法之一。
        - id: ch02-b15
          speaker: mcturk
          text: 等等，这里有个 vol。voluntate quidnam，孤零零地待着。
        - id: ch02-b16
          speaker: beetle
          text: 我来收拾它。把 Quidnam 放到 Dolabella 后面。
        - id: ch02-b17
          speaker: stalky
          text: 亲爱的老多拉贝拉，可别弄坏他。西塞罗这篇散文真够恶劣。咱们替他……
        - id: ch02-b18
          speaker: mcturk
          text: 喂，另一个版框上也有好东西。来首荒唐颂歌怎么样？Qui，quis……对了，Quis multa gracilis。
        - id: ch02-b19
          speaker: beetle
          text: 拿来。这边的牛奶已经加完糖了。
        - id: ch02-b20
          speaker: narrator
          text: 几分钟紧张忙碌之后，金先生的题目已经面目全非。
        - id: ch02-b21
          speaker: stalky
          text: 绝不要无缘无故抽打猎犬。
        - id: ch02-b22
          speaker: beetle
          text: Quis munditiis？这个真不错。再看这个问号，多漂亮！Heu quoties fidem！那家伙听着又着急又激动。Cui flavam religas in rosa，就是谁的香味被贬进玫瑰。Mutatosque Deos flebit in antro。
        - id: ch02-b23
          speaker: stalky
          text: 沉默的诸神在洞里哭泣。我敢拿命保证，贺拉斯跟塔尔克一样，都得有人照料。
        - id: ch02-b24
          speaker: narrator
          text: 改完西塞罗以后，他们又忠心耿耿地替贺拉斯编辑。一个词被搬到另一行，一个问号落进意想不到的地方，完整的诗句渐渐变成谁也解释不了的奇观。三个人越干越投入，完全忘了回校的时间，直到阁楼里黑得连铅字都看不清，才终于肯停手。
        - id: ch02-b25
          speaker: beetle
          text: 啊哈，我们的朋友说，天渐渐亮了。乌尔比安正合我的需要，是吗？金先生要能从那里面看出意思，我就是蓝眼睛的蹲蹲怪。
        - id: ch02-b26
          speaker: narrator
          text: 三个人从阁楼窗户溜进熟悉的后巷，朝三英里外的学院飞奔。可他们修订古典作品花的时间太久了。等他们喘着气停在煤气罐后的金雀花丛里，下午茶和锁门时间至少已经过去十分钟。学院在下面灯火通明。
        - id: ch02-b27
          speaker: mcturk
          text: 没用了。赌一先令，福克西就在墙手球场边的灯下等迟到的人。真讨厌，校长给了咱们长假，辜负他可不大好。
        - id: ch02-b28
          speaker: stalky
          text: 且让我从本人知识的保税仓库里提取一言。
        - id: ch02-b29
          speaker: mcturk
          text: 得了，别学乔罗克斯。咱们能冲过去吗？
        - id: ch02-b30
          speaker: stalky
          text: 拉德克利夫先生也谴责主教式长靴，还极力主张用香槟和杏子酱擦靴筒。煤气佬下午拧的那东西在哪儿？
        - id: ch02-b31
          speaker: narrator
          text: 他们听见斯托基在湿漉漉的草地里来回摸索。不久，一场大奇迹就在眼前出现。海边那间海岸警卫队小屋的灯先灭了。高尔夫俱乐部一排明亮的窗户跟着消失，随后两家旅馆的正面也沉进黑暗。散落各处的别墅先是昏暗，接着闪烁几下，终于一盏也看不见。最后，学院里成片的灯光也全部熄灭。三个人被留在狂风呼啸、黑得像墨的冬夜里。
        - id: ch02-b32
          speaker: stalky
          text: 烫坏我的腰子。真是霜冻，大丽花都死啦！快跑！
        - id: ch02-b33
          speaker: narrator
          text: 三个人压低身子，飞快穿过不断滴水的金雀花丛。黑暗里的学院像一只发怒的蜂巢，嗡嗡声从四面八方涌来，餐厅里所有人都在齐声喊着要煤气。他们冲到那条分隔自修室的下沉小路边，像子弹一样跳进暗沟，又像男孩一样从另一边弹起，直奔自修室。不到两分钟，三个人已经换下湿衣服，穿上干燥的裤子和外套。他们还故意套着拖鞋，大摇大摆地混进餐厅人群，好像早就一直待在里面。
        - id: ch02-b34
          speakers: [boy, boy_2, boy_3]
          ensemble: chorus
          text: 煤气！煤气！煤气！
        - id: ch02-b35
          speaker: stalky
          text: 黑得要命，还有股奶酪味。煤气佬准是散步去了，福克西得去找他。
        - id: ch02-b36
          speaker: narrator
          text: 餐厅活像南美革命的中心。离得最近的舍监普劳特正在努力恢复秩序，粗野的孩子却趁乱把一小块一小块黄油弹得到处都是。麦克特克又拧开小跟班们的茶炉，滚烫的水把许多人烫得像半熟一样，他们这回是真心实意地哭叫。四年级和三年级甲班用刀柄敲出节奏，齐唱校歌《伙伴万岁》。低年级学生发出蝙蝠一样的尖叫，还互相抢夺食物。二百五十个精力旺盛、一心想要更多光明的男孩，寻找起来确实非常认真。
        - id: ch02-b37
          speaker: narrator
          text: 一股难闻的煤气味告诉大家，供应恢复了。斯托基敞着背心，撑得像刚吃饱，坐在也许是第四杯茶前。
        - id: ch02-b38
          speaker: stalky
          text: 这就妥了。喂，庞波尼乌斯，我来啦！
        - id: ch02-b39
          speaker: narrator
          text: 全校学生之首卡森从级长桌走来。他简单正直，也是第一橄榄球队的主力。他用沙哑的公事口吻，请三个人半小时后到自己的自修室。
        - id: ch02-b40
          speakers: [boy, boy_2, boy_3]
          ensemble: chorus
          text: 级长会议！级长会议！
        - id: ch02-b41
          speaker: narrator
          text: 各桌嘶嘶起哄，还模仿白蜡木手杖抽下来时的动作。
        - id: ch02-b42
          speaker: stalky
          text: 咱们怎么逗他们？甲虫，这回看你的。
        - id: ch02-b43
          speaker: beetle
          text: 你们只要别笑。我会用金先生的腔调接管塔尔克的道德问题，而且要严肃处理。忍不住就别看我，不然我也会炸掉。
        - id: ch02-b44
          speaker: stalky
          text: 明白，没问题。
        - id: ch02-b45
          speaker: narrator
          text: 麦克特克全身肌肉绷紧，眼皮垂下来，半掩住双眼。这是准备战斗的信号。
    - id: ch03
      title: 级长会议
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 八九个高年级学生围坐在卡森的自修室里。那间屋子收拾得一丝不苟，却俗气得同样无可挑剔。所有人都努力摆出庄重严肃的神情。塔尔克在六年级中间并不讨人喜欢，有几个级长也早已领教过斯托基一伙的手段。他们暗自怀疑，塔尔克也许已经出了洋相，把大家拖进了麻烦。可是无论如何，六年级的尊严必须维护。
        - id: ch03-b02
          speaker: carson
          text: 听着，我们叫你们来，是想告诉你们，你们对六年级放肆得太久，我们已经忍够了。听说今天下午，你们在去比迪福德的路上咒骂塔尔克。这样不行。就这些。
        - id: ch03-b03
          speaker: stalky
          text: 你们真客气。不过我们也有权利。你们不能只因为碰巧当上级长，就学舍监的样子，随便把高年级学生叫来训斥。我们不是小跟班，卡森。这套拿去对付小戴维斯吧，对我们不管用。
        - id: ch03-b04
          speaker: mcturk
          text: 我们没当上级长，只因为老普劳特发疯。你明明知道。你真是一点分寸都没有。
        - id: ch03-b05
          speaker: beetle
          text: 等等。级长会议必须向校长报告。我想知道，这件事是不是校长替塔尔克撑腰？
        - id: ch03-b06
          speaker: carson
          text: 这个……这不完全是级长会议。我们只是叫你们来警告一下。
        - id: ch03-b07
          speaker: beetle
          text: 可所有级长都在。那跟级长会议有什么分别？
        - id: ch03-b08
          speaker: stalky
          text: 好家伙！原来你们只想训我们一顿，却特意在全校面前、下午茶的时候来传话，让大家以为这是级长会议。卡森，你会惹上麻烦的。
        - id: ch03-b09
          speaker: mcturk
          text: 秘密勾当，秘密勾当。可疑得要命。
        - id: ch03-b10
          speaker: narrator
          text: 六年级不安地互相看着。两个学期里，塔尔克已经召集过三次级长会议，闹得校长亲自通知他们，维持纪律是六年级自己的责任，不许一次次借校长的权威吓人。眼下看来，他们一开头就走错了。可在他们看来，任何思想端正的学生，都应该先把会议是否合法放在一边，老老实实接受这座法庭的震慑。甲虫偏偏抓住程序不放，这当然还是放肆。
        - id: ch03-b11
          speaker: norton
          text: 反正你们三个就该挨揍！
        - id: ch03-b12
          speaker: beetle
          text: 就因为我们妨碍塔尔克谈情说爱，是吗？
        - id: ch03-b13
          speaker: narrator
          text: 塔尔克的脸立刻变成浓浓的黑刺李色。甲虫得到了一股高贵的灵感。
        - id: ch03-b14
          speaker: beetle
          text: 哦，那可不行！你们该打的已经打过了。我们因为咒骂塔尔克被叫来，只受警告就能走。对吧？现在该轮到他受审了。
        - id: ch03-b15
          speaker: tulke
          text: 我……我……别让那个小魔鬼开始唠叨。
          emotion: fearful
        - id: ch03-b16
          speaker: carson
          text: 有话就规规矩矩说。
        - id: ch03-b17
          speaker: beetle
          text: 我当然会。我们去比迪福德时，看见六年级这件装饰品在路上闲荡，眼神很不对劲。那时我们还不知道他为什么急着拦我们。到了三点五十五分，我们在约家店里，亲眼看见塔尔克大白天戴着舍帽，在人行道上跟一个女人搂抱亲嘴。这样够规矩了吗？
        - id: ch03-b18
          speaker: tulke
          text: 我没有！不是我！
        - id: ch03-b19
          speaker: beetle
          text: 我们亲眼看见了！卡森，我接着规规矩矩地说。他嘴上还热着她的吻，就偷偷溜回来，召集这个根本不是级长会议的级长会议，说要维护六年级的荣誉。可我们怎么知道，六年级还有多少人卷进了这桩可憎的丑事？
        - id: ch03-b20
          speaker: mcturk
          text: 没错，这正是我们想知道的。
        - id: ch03-b21
          speaker: stalky
          text: 我们本来想私下找你谈，卡森，可你偏要开会。
        - id: ch03-b22
          speaker: narrator
          text: 六年级全都吃惊得答不上话。甲虫读过的那些近代诗人并没有白读。就在这一刻，一条崭新的道路仿佛被闪电当空劈开，忽然展现在他面前。他小心模仿金先生滔滔不绝的雄辩，越说越顺，发挥得超过了自己，连他本人都有一点害怕。
        - id: ch03-b23
          speaker: beetle
          text: 这件事最可怕的，不只是道德败坏，更是公然无耻。现在进一趟比迪福德，简直不可能不撞上某位级长病态的恋情。诺顿，别笑，我不是在说笑。一个人到底在罪孽里陷得多深，才会当着全城人的面搂抱情妇？你们不是最讲体面吗？他至少也该等到天黑。可他没等。你没等，塔尔克。你这个放纵无度的小畜生！
        - id: ch03-b24
          speaker: carson
          text: 行了，先住嘴。塔尔克，这究竟是怎么回事？
        - id: ch03-b25
          speaker: tulke
          text: 听着，我真的很抱歉。我没想到甲虫会来这一手。
        - id: ch03-b26
          speaker: beetle
          text: 因为你自己毫无体面，就以为我也没有！
          emotion: angry
        - id: ch03-b27
          speaker: stalky
          text: 你想拿一个阴谋把整件事遮过去，对不对？
        - id: ch03-b28
          speaker: mcturk
          text: 这是对我们三个人的直接侮辱。你的心真肮脏，塔尔克。
        - id: ch03-b29
          speaker: carson
          text: 再这样闹，我就把你们推出门。
          emotion: angry
        - id: ch03-b30
          speaker: stalky
          text: 这更证明了确实有阴谋。
        - id: ch03-b31
          speaker: narrator
          text: 斯托基摆出一副贞洁烈士的神情。
        - id: ch03-b32
          speaker: tulke
          text: 我只是沿街走着，我发誓！后来……后来有个女人走过来亲了我。我真的很抱歉，可不是我亲她。
        - id: ch03-b33
          speaker: narrator
          text: 屋里忽然一片安静。斯托基吹出一声又长又圆的口哨，里面全是轻蔑、惊讶和嘲弄。
        - id: ch03-b34
          speaker: tulke
          text: 我以荣誉起誓。哦，快叫他别说了。
          emotion: sad
        - id: ch03-b35
          speaker: mcturk
          text: 很好，那我们当然只能接受你的说法。
        - id: ch03-b36
          speaker: norton
          text: 见鬼！这里的首席级长可不是你，麦克特克。
          emotion: angry
        - id: ch03-b37
          speaker: mcturk
          text: 好吧，你们比我们更了解塔尔克。我只是代表我们三个人说话。我们接受他的话。不过我要是也在这么恶心的场面里被人抓住，再拿同一套话解释，真不知道你们会怎么说。可既然塔尔克拿荣誉起誓……
        - id: ch03-b38
          speaker: stalky
          text: 还有塔尔库斯……对不起，是亲吻。塔尔吻当然是个有荣誉的人。
        - id: ch03-b39
          speaker: beetle
          text: 原来六年级出去散步，连自己都保护不了，免不了叫人亲。这事甜不甜美？告诉小跟班们，会不会很叫人愉快？我们当然不是级长，可我们也没怎么让人亲过。这种事根本不会进入咱们脑子，对不对，斯托基？
        - id: ch03-b40
          speaker: stalky
          text: 哦，当然不会！
        - id: ch03-b41
          speaker: narrator
          text: 斯托基转开脸，藏住过分激动的表情。麦克特克脸上只有高傲的轻蔑，还有一点疲倦。
        - id: ch03-b42
          speaker: prefect
          text: 你们知道得倒不少。
        - id: ch03-b43
          speaker: beetle
          text: 没办法，谁叫你们把这事塞到我们鼻子底下。整件事已经够卑劣、够可耻了。我真不知道谁更难看，是碰巧被抓到的塔尔克，还是那些没被抓到的人。至于我们，只因为打断他们的私情，就被叫来站着挨训。
        - id: ch03-b44
          speaker: carson
          text: 见鬼，我只想警告你们一句。
        - id: ch03-b45
          speaker: beetle
          text: 警告？你来警告我们？卡森，事情已经揭露到这个地步，你还有什么资格警告我们？这实在太过分了。走，咱们到干净的地方去。
        - id: ch03-b46
          speaker: narrator
          text: 门在他们受辱的清白身后砰然关上。
        - id: ch03-b47
          speaker: stalky
          text: 哦，甲虫！甲虫！金甲虫！你到底怎么做到的？
          emotion: happy
        - id: ch03-b48
          speaker: narrator
          text: 回到自修室，斯托基抽泣着扑上甲虫的胸口。麦克特克两手抱住甲虫的脑袋，照着一首老歌的节拍摇他的脖子。
        - id: ch03-b49
          speaker: mcturk
          text: 小嘴儿漂亮，比樱桃李子更甜。总是喜洋洋，从不愁眉苦脸，像在说，跟我走，亲亲，快来呀！美味，美味，美味美味呀！
          emotion: happy
        - id: ch03-b50
          speaker: beetle
          text: 小心，别砸碎我的眼镜。刚才多辉煌！我用《埃里克》的腔调训他们，训得漂亮吧？听出我偷了金先生哪些话没有？哎呀，糟了！有个形容词没用，淫秽！我怎么会忘？那也是金先生最爱用的词。
        - id: ch03-b51
          speaker: mcturk
          text: 不要紧。他们很快就会派人来，求我们别告诉全校。这对他们可是要命的大事。可怜的六年级，可怜的老六年级！
        - id: ch03-b52
          speaker: stalky
          text: 缺德的小畜生。给我们这种灵魂纯洁的孩子树了什么榜样！
        - id: ch03-b53
          speaker: narrator
          text: 卡森自修室里的六年级还目瞪口呆地坐着，怒视着快要哭出来的塔尔克。
        - id: ch03-b54
          speaker: carson
          text: 好啊，塔尔克。你把事情弄成了最糟的烂摊子。
        - id: ch03-b55
          speaker: tulke
          text: 为……为什么那个小魔鬼甲虫开口以前，你们不揍他？
          emotion: sad
        - id: ch03-b56
          speaker: prefect
          text: 我早知道要闹起来，可你偏要开会，塔尔克。
        - id: ch03-b57
          speaker: norton
          text: 是啊，你给我们带来的好处可真多。本来该我们训他们，结果他们进来把我们骂得抬不起头。甲虫把我们说成一群恶棍，挂起来晾干，又学舍监摔门出去。全怪你。
        - id: ch03-b58
          speaker: tulke
          text: 可我没亲她。
        - id: ch03-b59
          speaker: norton
          text: 蠢货！你还不如说是你亲的，再一口咬定。现在他们会告诉全校，甲虫还会编一大堆该死的歪诗和绰号。
        - id: ch03-b60
          speaker: tulke
          text: 可见鬼，真是她亲了我！
        - id: ch03-b61
          speaker: norton
          text: 我想的不是你，是我们。我去他们自修室，看看能不能叫他们闭嘴。
        - id: ch03-b62
          speaker: narrator
          text: 诺顿找到甲虫时，语气忽然变得很讨好。
        - id: ch03-b63
          speaker: norton
          text: 塔尔克为了这件事非常难过。所以我来求你们，尤其是你，甲虫，别把它传遍全校。你们资历这么老，应该明白为什么。
        - id: ch03-b64
          speaker: beetle
          text: 这回又是谁亲他了？唔，看来我非得再去跟六年级谈谈。
        - id: ch03-b65
          speaker: norton
          text: 完全没必要，亲爱的朋友。我向你保证，你想说什么，我替你带去。
        - id: ch03-b66
          speaker: narrator
          text: 可那个漏掉的形容词实在太诱人。诺顿回到尚未散会的自修室时，甲虫脸色苍白，冷若冰霜，超然物外地跟在后面。
        - id: ch03-b67
          speaker: beetle
          text: 看来，诸位很担心我们会怎样处理刚刚揭露的这种……呃……淫秽。为了学院的荣誉，我们已经决定，对这些……呃……淫秽守口如瓶。这个消息要是能让诸位安心，那么……呃……现在你们知道了。
        - id: ch03-b68
          speaker: narrator
          text: 他猛地转身，昂首望着群星，庄严地走回自修室。斯托基和麦克特克并排躺在桌上，擦着笑出来的眼泪。两个人都已经笑软了，根本动弹不得。
    - id: ch04
      title: 最后一次进攻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 拉丁散文试卷取得的成功，远远超过他们最狂野的梦想。斯托基和麦克特克由校长另外授课，不参加考试，甲虫却兴致勃勃地来了。
        - id: ch04-b02
          speaker: king
          text: 我想，这对你只是桩副业吧？升入更高境界以前的最后一次表演，也是你对古典作品的最后一次进攻。看来这份试卷已经把你难倒了。
        - id: ch04-b03
          speaker: narrator
          text: 金先生一边分发试卷，一边摆出学究式的得意神情。他显然等着看甲虫在最后一次拉丁文考试里出丑。甲虫接过那张熟悉又陌生的试卷，故意皱紧眉头，像第一次见到似的逐行研究那些已经被他们彻底打乱的印刷文字。
        - id: ch04-b04
          speaker: beetle
          text: 我完全看不出头尾。这到底是什么意思？
        - id: ch04-b05
          speaker: king
          text: 不，不！我们正指望你说出它的意思。这是考试，我的甲虫，不是猜谜。你会发现，你的同伴要理解……
        - id: ch04-b06
          speaker: narrator
          text: 塔尔克离开座位，把自己的试卷放到讲桌上。金先生一看，再一读，脸色顿时绿得吓人。
        - id: ch04-b07
          speaker: narrator
          text: 甲虫只想着，斯托基错过了多少好戏。他倒要看看金先生怎样脱身。
        - id: ch04-b08
          speaker: king
          text: 看来，甲虫刚才的话里确实有一点道理。我倾向于认为，可敬的兰德尔一定把试卷排得乱七八糟。甲虫，你自称编辑，也许可以给全班讲讲什么叫版框。
        - id: ch04-b09
          speaker: beetle
          text: 什么，先生？给谁的班讲？这个句子里根本没有动词，而且这首颂歌也不知道怎么全变了。
        - id: ch04-b10
          speaker: king
          text: 在你主动批评以前，我正要说，排版时一定出了事故。印刷工只凭天生的智慧重新排过。我们的兰德尔，显然不是研究西塞罗或贺拉斯的权威。
        - id: ch04-b11
          speaker: beetle
          text: 把责任推给兰德尔，真够卑鄙。金先生写题时一定醉得像猫头鹰。
        - id: ch04-b12
          speaker: king
          text: 不过，我们可以用口授把错误改正。
        - id: ch04-b13
          speakers: [boy, boy_2, boy_3]
          ensemble: chorus
          text: 不行，先生！那会占考试时间。考试只许两个钟头，这不公平。印好的卷子才算考试。那要怎么评分？全是兰德尔的错，反正不是我们的错！
        - id: ch04-b14
          speaker: narrator
          text: 金先生当然认定，这一阵抗议是学生们串通好了，存心动摇他的权威。他没有立刻开始口授，反而站在讲桌前发表演说，告诉学生应该怀着怎样的精神面对考试。大家只能坐着听，宝贵的考试时间一点点过去。等这场风暴刚刚平息，甲虫马上又伸手把它扇了起来。
        - id: ch04-b15
          speaker: king
          text: 嗯？你刚才对麦克拉根说了什么？
        - id: ch04-b16
          speaker: beetle
          text: 我只说，试卷发下来以前，应该先检查一遍，先生。
        - id: ch04-b17
          speaker: boy
          text: 说得好！
        - id: ch04-b18
          speaker: narrator
          text: 金先生立刻追问，甲虫是不是想亲自肩负维持学院传统的责任。他又顺势讲起知识、责任和服从。他对知识的热忱足足吞掉一刻钟，试卷上的拉丁文却还一个字都没写。坐在考场里的级长们已经不再掩饰自己的厌烦，可金先生仍旧滔滔不绝。
        - id: ch04-b19
          speaker: narrator
          text: 考试结束以后，他们又聚在五号自修室。学期已经到了尽头，屋里的东西大多收拾完毕，四周被拆得空空荡荡。这个住了许多年的地方眼看就不再属于他们。甲虫坐在最后留下的杂物中间，兴致勃勃地把考场上的每一个难堪场面讲给两个朋友听。
        - id: ch04-b20
          speaker: beetle
          text: 那段时间真荒唐。他胡扯，我就让他继续扯。后来他口授了大约一半多拉贝拉那一伙。
        - id: ch04-b21
          speaker: stalky
          text: 亲爱的老多拉贝拉，我的朋友。后来呢？
        - id: ch04-b22
          speaker: beetle
          text: 后来每隔一个词，我们当然都要问怎么拼。他又胡扯了许多，还咒骂我和麦克拉根。麦克配合得像个好汉。他也骂兰德尔，骂“没有学问的中产阶级化成实质的无知”，还骂“对区区分数的贪欲”。真是一场最后的表演，最后的进攻，一桩荒唐副业。
        - id: ch04-b23
          speaker: stalky
          text: 不过他写试卷时当然醉得昏天黑地。你应该解释过吧？
        - id: ch04-b24
          speaker: beetle
          text: 当然。我告诉塔尔克，道德败坏的级长和酩酊大醉的舍监，都是合乎逻辑的推论。他差点哭出来。自从玛丽那件事以后，他每次见到我们都害羞得要命。
        - id: ch04-b25
          speaker: narrator
          text: 塔尔克把这份羞怯一直保持到最后一刻。学期终于结束，旅费已经发到每个人手里，男孩们带着行李，吵吵嚷嚷地挤进送他们去车站的马车。车夫等着出发，级长们也在彼此招呼。塔尔克本想跟着他们赶快上车，三个人却温柔而坚决地拦住他，强迫他再多等一会儿，把七年来最后一点玩笑好好开完。
        - id: ch04-b26
          speaker: stalky
          text: 你看，塔尔克，你也许是个级长，可我已经离开学院了。明白吗，亲爱的塔尔克？
        - id: ch04-b27
          speaker: tulke
          text: 明白。别记仇，斯托基。
        - id: ch04-b28
          speaker: stalky
          text: 斯托基？你这小崽子，好大的胆子！我现在是科克兰先生，你只是个肮脏的小学生。
        - id: ch04-b29
          speaker: narrator
          text: 斯托基早已换好离校的全套行头。他头戴高顶礼帽，脖子上围着挺括的硬领，脚上套着鞋罩，身上是一件高腰的鼻烟色大衣。七年的学院生活已经结束，他故意把自己打扮得气派十足，仿佛只要踏上马车，便立刻成了有资格训斥小学生的成年人。
        - id: ch04-b30
          speaker: mcturk
          text: 还是个坏得出奇的道德败坏之徒。真不知道你怎么好意思，把自己的陪伴强加给我们这些心灵纯洁的孩子。
        - id: ch04-b31
          speaker: norton
          text: 快来，塔尔克！
        - id: ch04-b32
          speaker: stalky
          text: 对，我们就来。挪过去，给我们腾地方，你们这些学院生。下学期，你们还得全回来，继续说“是，先生”“哦，先生”“不，先生”“求您了，先生”。不过告别以前，我们要讲个小故事。走吧，迪基，我们都准备好了。把帽盒踢到座位下面，别挤着你们的斯托基叔叔。
        - id: ch04-b33
          speaker: mcturk
          text: 多么可爱的一群年轻人，志趣又高尚，想找也找不到更好的了。道德上是有一点瑕疵，不过男孩终归是男孩。卡森，别装作气鼓鼓的，根本没用。你们下学期还得回学院，我们三个却要从这里走向各自的前程。可在马车终于载着大家慢慢驶向车站以前，这最后一段路上总得有个合适的告别。现在请科克兰先生赏脸，开讲塔尔克和玛丽·约的故事！
