  chapters:
    - id: ch01
      title: The Last Term
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The holidays were only days away. There were final examinations to survive, but Beetle cared much more about the last issue of the College paper. Stalky and McTurk had coaxed him into becoming editor, and study rules had finished the job. Now Beetle did the work while his friends criticized it. Stalky called the paper the Swillingford Patriot, after Sponge, and McTurk said it was poor stuff beside Ruskin or De Quincey.
        - id: ch01-b02
          speaker: narrator
          text: Only the Head took a real interest, though his methods were unusual. He opened his brown-bound, tobacco-scented library to Beetle, forbidding nothing and recommending nothing. Beetle settled into a deep armchair beside a silver inkstand, with endless pens and paper ready to hand. The shelves held scores of old dramatists and Hakluyt's voyages. There were French translations of Russian writers called Pushkin and Lermontoff, and bewildering little tales broken up by unusual songs, written by a man named Peacock. Beetle found Borrow's Lavengro and an odd translated poem called the Rubaiyat, which the Head said had not yet found its proper place in the world. There was poetry by Crashaw, Dryden, Alexander Smith, L. E. L., Lydia Sigourney, Fletcher, Donne, and Marlowe. Best of all for McTurk, when Beetle carried the news to him, there were Ossian, The Earthly Paradise, Atalanta in Calydon, and Rossetti.
        - id: ch01-b03
          speaker: narrator
          text: Sometimes the Head drifted in under the excuse of censoring the school paper. He would open one book, read a verse, then reach for another, and suddenly a whole new road opened before Beetle. He breathed slowly over his cigar, his eyes half closed, and spoke of great men who were still alive. He remembered journals, long dead now, that those men had founded in the riot of their youth. He had known them before the world knew them, when all the planets seemed like small newly lighted stars trying to find their places in an uncaring darkness.
        - id: ch01-b04
          speaker: narrator
          text: Regular lessons suffered. Beetle's head was crowded with rhythms and ideas. He shared them only with McTurk, while the two marched around the wreck of the Armada ship on the sands and shouted poetry against the ridged sea.
        - id: ch01-b05
          speaker: narrator
          text: For three terms, their house-master's experienced distrust had kept all three boys from becoming prefects. That honor went by merit. It brought the right to carry a ground-ash and, within limits, to use it.
        - id: ch01-b06
          speaker: stalky
          text: Still, we've made sport of the Sixth more often since they passed us over than anyone has in seven years.
        - id: ch01-b07
          speaker: narrator
          text: Stalky proudly touched his neck, which was circled by the stiffest upright collar he could find. Custom allowed only the Sixth to wear such collars. In other years, prefects like Pussy, Abanazar, or Dick Four would have stripped them off within five minutes. This year's Sixth said nothing. Most were clever young favorites of the house-masters, and they guarded their dignity too carefully to risk an open fight with the resourceful three. So Stalky and his friends wore Sixth-form collars without permission. They pushed their caps to the very backs of their heads instead of wearing them slightly over one eye like proper Fifth-form boys. They displayed patent-leather boots on weekdays and astonishing made-up ties on Sundays, and no one rebuked them.
        - id: ch01-b08
          speaker: narrator
          text: McTurk would try for Cooper's Hill in spring, and Stalky for Sandhurst. The Head had told both that they were safe unless they collapsed completely over the holidays. When it came to training and judging his colts, he was rarely wrong. That same day he took Beetle aside and gave him a great deal of excellent advice. Beetle remembered none of it. He raced straight up to the study, white with excitement, and poured out a tale so astonishing that it required an act of faith from his friends.
        - id: ch01-b09
          speaker: mcturk
          text: You start on a hundred pounds a year? Rubbish!
        - id: ch01-b10
          speaker: beetle
          text: And they pay my passage out! It's settled. The Head says he's been training me for this for ages, and I never guessed. I won't begin by writing, of course. First I'll fill in telegrams and cut pieces out of newspapers with scissors.
        - id: ch01-b11
          speaker: stalky
          text: Scissors! You'll make a horrible mess. But this is your last term too. Seven years, my dear listeners, and never prefects.
        - id: ch01-b12
          speaker: mcturk
          text: They weren't bad years. I'll be sorry to leave the old College. Won't you?
        - id: ch01-b13
          speaker: narrator
          text: They looked out at the sea foaming along the Pebbleridge in the clear winter light.
        - id: ch01-b14
          speaker: stalky
          text: I wonder where we'll all be this time next year.
        - id: ch01-b15
          speaker: mcturk
          text: Or this time five years from now.
        - id: ch01-b16
          speaker: beetle
          text: Keep my leaving quiet. The Head hasn't told anyone. Prout said today that I might be a prefect next term if I behaved more reasonably. He must be short of prefects.
        - id: ch01-b17
          speaker: mcturk
          text: Let's finish with one last row against the Sixth.
        - id: ch01-b18
          speaker: stalky
          text: Dirty little schoolboys. What's the use?
        - id: ch01-b19
          speaker: mcturk
          text: Think of the moral effect. We could leave an immortal tradition behind us.
        - id: ch01-b20
          speaker: stalky
          text: Better go into Bideford and pay our debts. Father sent me three pounds for that very purpose, and I don't owe more than thirty shillings. Beetle, ask the Head for leave. Tell him you need to correct the Swillingford Patriot.
        - id: ch01-b21
          speaker: beetle
          text: I do need to. It's my last issue, and I want it to look decent. I'll catch him before lunch.
        - id: ch01-b22
          speaker: narrator
          text: Ten minutes later they wheeled their bicycles out in line. The Head had excused them from the five o'clock roll call, and the whole afternoon lay open. Unfortunately, so did Mr. King, who never let them pass without a speech. But that day even an army of Kings could not spoil Beetle's happiness.
        - id: ch01-b23
          speaker: king
          text: Ah! Enjoying light literature, my friends? Ordinary mathematics cannot satisfy such soaring minds, can it?
        - id: ch01-b24
          speaker: narrator
          text: Beetle smiled into space and thought of his hundred pounds a year. King's sarcasm reached his ears, but it had no power to follow him where his thoughts had gone.
        - id: ch01-b25
          speaker: king
          text: Your obvious incompetence hides among the flowers of inaccurate fiction. But judgment is coming, Beetle mine. I have prepared a few simple questions in Latin prose, and even your practiced evasions will not escape them. Yes, Latin prose. Ulpian serves your need, does he? Elucescebat, says our friend. We shall see!
        - id: ch01-b26
          speaker: narrator
          text: Beetle still gave no sign. In his mind he stood aboard a steamer with his passage paid, moving toward the wide and wonderful world a thousand leagues beyond Lundy Island. The school path, the coming examination, and King's voice had all fallen far behind him. King saw only the vacant smile and finally let him go with a snarl.
        - id: ch01-b27
          speaker: beetle
          text: He has no idea. Next term he'll still be correcting exercises, lecturing, and showing off before the small boys. And the term after that.
        - id: ch01-b28
          speaker: narrator
          text: Beetle caught up with the others on the steep furze-covered hill behind the College. At the gasometer they tossed pebbles onto the roof until the grimy gas-man ordered them to stop. Then they watched him oil a valve sunk between two furze bushes.
        - id: ch01-b29
          speaker: stalky
          text: Cokey, what's that valve for?
        - id: ch01-b30
          speaker: cokey
          text: It turns the gas on to the kitchens. If I didn't open it, you young gentlemen would be studying by candlelight.
        - id: ch01-b31
          speaker: narrator
          text: Stalky said nothing for nearly a minute.
    - id: ch02
      title: The Road to Bideford
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Around the next bend they met Tulke, the senior prefect of King's house. He was a small white-haired boy of the sort that had to be promoted because of its cleverness. After promotion, that same sort generally appealed to the Head whenever zeal carried its authority too far. Tulke demanded to know where they were going, but the three gave him no notice at all. They were out on lawful leave and had nothing to fear. Tulke had endured many insults from Number Five study, and now he believed he had finally caught them breaking bounds.
        - id: ch02-b02
          speaker: tulke
          text: Where are you fellows going? Answer me!
        - id: ch02-b03
          speaker: stalky
          text: What the devil has it got to do with you?
        - id: ch02-b04
          speaker: narrator
          text: Stalky gave him his sweetest smile.
        - id: ch02-b05
          speaker: tulke
          text: Look here, I'm not going to let a Fifth-form boy swear at me!
          emotion: angry
        - id: ch02-b06
          speaker: mcturk
          text: Then run along and call a prefects' meeting.
        - id: ch02-b07
          speaker: narrator
          text: McTurk knew Tulke's weakness. The prefect choked with rage.
        - id: ch02-b08
          speaker: stalky
          text: Don't shout at the Fifth like that. It's shockingly bad form.
        - id: ch02-b09
          speaker: mcturk
          text: Come on, ducky. Say what you mean.
        - id: ch02-b10
          speaker: tulke
          text: I want to know what you three are doing out of bounds.
        - id: ch02-b11
          speaker: narrator
          text: He flourished his ground-ash to make the question official.
        - id: ch02-b12
          speaker: stalky
          text: Ah, now we understand. Why didn't you ask that the first time?
        - id: ch02-b13
          speaker: tulke
          text: I'm asking now. What are you doing?
        - id: ch02-b14
          speaker: stalky
          text: We're admiring you, Tulke. We think you're a magnificent fellow. Don't we?
        - id: ch02-b15
          speakers: [beetle, mcturk]
          ensemble: duo
          text: We do! We do!
        - id: ch02-b16
          speaker: narrator
          text: A dogcart full of girls swept around the corner just as Tulke tried to explain his suspicions. Stalky instantly dropped to his knees before the prefect, clasping himself into the attitude of prayer. The girls could see everything, and Tulke turned a deep, embarrassed color.
        - id: ch02-b17
          speaker: tulke
          text: I have reason to believe...
        - id: ch02-b18
          speaker: beetle
          text: Hear this! Hear this! Tulke has reason to believe! Three cheers for Tulke!
        - id: ch02-b19
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Hip, hip, hooray! Hip, hip, hooray! Hip, hip, hooray!
        - id: ch02-b20
          speaker: stalky
          text: It's only our wild admiration. We love you so much, Tulke, we think you ought to go home and die. You're far too good to live.
        - id: ch02-b21
          speaker: mcturk
          text: Please do die for us. Think how handsome you'd look stuffed.
        - id: ch02-b22
          speaker: narrator
          text: Tulke marched away, glaring.
        - id: ch02-b23
          speaker: stalky
          text: That means a prefects' meeting for certain. He'll spend the afternoon writing notes, and Carson will summon us after tea. The honor of the Sixth is at stake. They can't ignore that.
        - id: ch02-b24
          speaker: mcturk
          text: Bet you a shilling he follows us. He's King's pet. If he catches us outside bounds, they'll both have our scalps. We must be models of virtue.
        - id: ch02-b25
          speaker: beetle
          text: Then let's have one last feast at Mother Yeo's. We owe her about ten shillings, and Mary will cry when she hears we're leaving.
        - id: ch02-b26
          speaker: stalky
          text: Mary gave me a tremendous slap on the head last time.
        - id: ch02-b27
          speaker: mcturk
          text: Only because you didn't duck. She generally kisses you afterward. Let's go.
        - id: ch02-b28
          speaker: narrator
          text: Mother Yeo's was half dairy and half eating house, a dark old place with little bottle-glass windows at the top of a narrow side street. The house had stood there for two hundred years and seemed to have brewed itself dark with age. The boys had supported the place since the days when they were fags. By now they were not merely customers. Mother Yeo and Mary received them as troublesome members of the family who were always welcome home.
        - id: ch02-b29
          speaker: stalky
          text: We've come to pay our debts, Mother, and say goodbye. And we're terribly hungry.
        - id: ch02-b30
          speaker: narrator
          text: He slid an arm around the mistress's enormous waist.
        - id: ch02-b31
          speaker: mother_yeo
          text: Aie! Making love to me, are you? Shame on you.
        - id: ch02-b32
          speaker: mcturk
          text: We wouldn't dare if Mary were here.
        - id: ch02-b33
          speaker: narrator
          text: McTurk slipped into the broad North Devon speech that the three used whenever a campaign took them among the local people. At that moment the inner door opened. Mary came through with a bowl of cream in her hands, fair-haired, blue-eyed, and rosy-cheeked as an apple.
        - id: ch02-b34
          speaker: mary
          text: Who's been using my name?
        - id: ch02-b35
          speaker: narrator
          text: McTurk kissed her. Beetle calmly did the same, and Mary cuffed them both.
        - id: ch02-b36
          speaker: stalky
          text: Never kiss the maid when you can kiss the mistress.
        - id: ch02-b37
          speaker: narrator
          text: He winked shamelessly at Mother Yeo and began investigating the jam shelf as though nothing improper had happened. Mary, who knew exactly where his attention was, offered him the chance to have his head slapped like the others.
        - id: ch02-b38
          speaker: mary
          text: Glad to see one of you has learned not to ask for another slap.
        - id: ch02-b39
          speaker: stalky
          text: No fear. I can find girls enough to give me kisses. There are girls in Northam, yes, and Appledore too.
        - id: ch02-b40
          speaker: narrator
          text: With his back still turned, Stalky ended with a sound that no writing could reproduce. It was half a sniff of contempt for Mary's challenge and half a warm recollection of the girls at Northam and Appledore.
        - id: ch02-b41
          speaker: mary
          text: Aie, you'll never come to a good end. What are you doing, sniffing that cream?
        - id: ch02-b42
          speaker: stalky
          text: It's gone bad. Smell it.
        - id: ch02-b43
          speaker: narrator
          text: Mary leaned over without thinking.
        - id: ch02-b44
          speaker: stalky
          text: Bideford kiss.
        - id: ch02-b45
          speaker: narrator
          text: He stole the kiss and escaped without a blow.
        - id: ch02-b46
          speaker: mary
          text: You... you... you...
          emotion: happy
        - id: ch02-b47
          speaker: narrator
          text: Mary bubbled with laughter.
        - id: ch02-b48
          speaker: stalky
          text: The Northam girls do it better. Their kisses are richer, and they give them back too.
        - id: ch02-b49
          speaker: narrator
          text: McTurk solemnly took Mother Yeo around the room in a waltz until she was breathless. Meanwhile Beetle told Mary their sad news. Then everyone settled down to a final feast of hot bread, jam, and thick clotted cream.
        - id: ch02-b50
          speaker: beetle
          text: Yes, you'll never see us again, Mary. We're going away to become parsons and missionaries.
        - id: ch02-b51
          speaker: mcturk
          text: Steady! Tulke really did follow us. He's coming up the street now.
        - id: ch02-b52
          speaker: mother_yeo
          text: They never barred you from coming here. Sit still, my little dears.
        - id: ch02-b53
          speaker: narrator
          text: Mother Yeo rolled into the back room to settle their account.
        - id: ch02-b54
          speaker: stalky
          text: Mary, do you love me?
        - id: ch02-b55
          speaker: narrator
          text: His voice was suddenly full of tragedy.
        - id: ch02-b56
          speaker: mary
          text: Indeed I do! I've told you so since you were this high.
        - id: ch02-b57
          speaker: stalky
          text: See that boy coming up the street? He's never been kissed by any kind of girl in his life. Oh, Mary, it's shameful.
        - id: ch02-b58
          speaker: mary
          text: What's that to do with me? It'll happen naturally one day, I suppose. You don't truly want me to kiss him, do you?
        - id: ch02-b59
          speaker: stalky
          text: I'll give you half a crown if you do.
        - id: ch02-b60
          speaker: narrator
          text: Half a crown meant a great deal to Mary Yeo, and a good joke meant even more. Still, she hesitated. Tulke was a stranger, after all, and the request went beyond the ordinary cuffs and kisses she traded with the boys she knew.
        - id: ch02-b61
          speaker: mcturk
          text: You're afraid.
        - id: ch02-b62
          speaker: beetle
          text: A Northam girl wouldn't think twice, and you're such a fine girl too.
        - id: ch02-b63
          speaker: narrator
          text: That settled it, because Mary's courage had been questioned at exactly the right moment. Her face took on a determined look. McTurk braced one foot against the inner door so Mother Yeo could not return at the wrong time. Outside, Tulke came up the street without any idea of the plot waiting for him. He found the pavement blocked by a tall daughter of Devon, from the pleasant county where kisses came easily. He politely tried to step around her. Mary considered him for a moment, then laid one large hand upon his shoulder.
        - id: ch02-b64
          speaker: mary
          text: Where are you going, my dear?
        - id: ch02-b65
          speaker: narrator
          text: Stalky stuffed a handkerchief into his mouth and watched Tulke turn scarlet.
        - id: ch02-b66
          speaker: mary
          text: Give me a kiss! Don't they teach you manners at the College?
        - id: ch02-b67
          speaker: narrator
          text: Tulke gasped and tried to wheel away. Mary took her task seriously. She kissed him twice, slowly and conscientiously, before releasing him. The miserable prefect fled up the street. Mary came back into the shop with honest wonder in her eyes, as if she had discovered some strange new species of schoolboy.
        - id: ch02-b68
          speaker: stalky
          text: Did you kiss him?
        - id: ch02-b69
          speaker: narrator
          text: Stalky handed her the coin.
        - id: ch02-b70
          speaker: mary
          text: Indeed I did! But, oh, my little body, he's no proper College boy. He looked ready to cry.
        - id: ch02-b71
          speaker: mcturk
          text: We wouldn't cry. You couldn't make us cry like that. Try it.
        - id: ch02-b72
          speaker: narrator
          text: Mary accepted McTurk's challenge and cuffed all three of them around the head. The boys finally left the shop with tingling ears, their debts paid and their last meal at Mother Yeo's behind them.
        - id: ch02-b73
          speaker: stalky
          text: I don't think there'll be much of a prefects' meeting now.
        - id: ch02-b74
          speaker: beetle
          text: Of course there will. Our story is that he kissed her. That makes him a cynically immoral hog, guilty of blatant indecency. Remember King's speech when he caught me reading Don Juan.
        - id: ch02-b75
          speaker: mcturk
          text: Naturally Tulke kissed her. Right in the street, wearing his house cap!
        - id: ch02-b76
          speaker: stalky
          text: Time, three fifty-seven. Make a note. But what if he tells the truth, Beetle?
        - id: ch02-b77
          speaker: beetle
          text: Then it gets even better! If he admits she kissed him, the Sixth cannot defend themselves from being ravished in the street. They need nursemaids. We only have to whisper that around the College. Either answer gives us jam!
        - id: ch02-b78
          speaker: stalky
          text: By gum, our last term is ending beautifully. Now finish your old paper. Turkey and I will help. We'll enter the printing office by the back, so Randall needn't be disturbed.
        - id: ch02-b79
          speaker: beetle
          text: Then don't behave like garden goats.
    - id: ch03
      title: The Printer's Loft
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Beetle knew exactly what their help was worth, but he did not mind displaying his importance before his allies. Randall's little printing loft felt like his private territory. Up there, behind the office and away from the street, he could already imagine himself controlling the Times. An ink-stained apprentice had taught him, by a rather winding route, how to find letters in the type case. On that modest evidence Beetle considered himself an expert compositor.
        - id: ch03-b02
          speaker: narrator
          text: The school paper lay locked in its metal formes on a stone-topped table, with a printed proof beside it. Beetle could have marked the mistakes on that proof, but no true professional would dream of such a thing. He took up a mallet and a pair of tweezers. First he knocked out the mysterious wooden wedges that held a forme tight. Then he picked out a letter here and fitted another one there, reading the backward lines as he worked and stopping often to chuckle over his own contributions to the paper.
        - id: ch03-b03
          speaker: mcturk
          text: You won't show off like this when printing is your living. The type reads upside down and backward, doesn't it? Let me try.
        - id: ch03-b04
          speaker: beetle
          text: Get away. If you're so clever, read the formes in that rack.
        - id: ch03-b05
          speaker: mcturk
          text: Formes in a rack! What does that mean? Stop being so horribly professional.
        - id: ch03-b06
          speaker: narrator
          text: McTurk and Stalky wandered through the office and investigated nearly everything.
        - id: ch03-b07
          speaker: stalky
          text: Come here a moment, Beetle. What's this? It looks familiar.
        - id: ch03-b08
          speaker: beetle
          text: That's King's Latin prose examination. In Verrem, actio prima. What a glorious chance!
        - id: ch03-b09
          speaker: mcturk
          text: Think of all those honest, noble boys who would give their eyes for one look at it.
        - id: ch03-b10
          speaker: stalky
          text: No, Willie dear. Cheating would hurt our kind teachers. You wouldn't do that, would you?
        - id: ch03-b11
          speaker: mcturk
          text: I couldn't read the beastly thing anyway. Besides, we're leaving, so it can't help us.
        - id: ch03-b12
          speaker: stalky
          text: Remember how the Considerate Bloomer improved Spraggon's account of the Puffington Hounds? We must sweeten Mr. King's milk. Let's see what Beetle can do with those precious tweezers.
        - id: ch03-b13
          speaker: beetle
          text: Latin prose is already hard to ruin, but we'll try. I'll trade aliud and Asiae between these sentences. Move that full stop, begin again at the next capital, and... hurrah! These three whole lines can shift together.
        - id: ch03-b14
          speaker: stalky
          text: One of those scientific pauses for which that famous huntsman is so rightly celebrated.
        - id: ch03-b15
          speaker: mcturk
          text: Wait. Here's voluntate quidnam sitting by itself.
        - id: ch03-b16
          speaker: beetle
          text: I'll fix it. Quidnam goes after Dolabella.
        - id: ch03-b17
          speaker: stalky
          text: Good old Dolabella. Don't hurt him. Cicero wrote vile prose, didn't he? He ought to thank us for...
        - id: ch03-b18
          speaker: mcturk
          text: Hello! Here's an ode in another forme. Qui... quis... It's Quis multa gracilis.
        - id: ch03-b19
          speaker: stalky
          text: Bring it here. We've sweetened the milk enough. Never whip your hounds more than necessary.
        - id: ch03-b20
          speaker: beetle
          text: Quis munditiis? That question mark looks splendid. Heu quoties fidem! Now the fellow sounds terribly worried. Cui flavam religas in rosa. Whose flavor is tied up in a rose. Mutatosque Deos flebit in antro.
        - id: ch03-b21
          speaker: stalky
          text: Mute gods weeping in a cave. Upon my Sam, Horace needs looking after as badly as Tulke.
        - id: ch03-b22
          speaker: narrator
          text: They corrected Horace with great care until darkness covered the type.
        - id: ch03-b23
          speaker: beetle
          text: So Ulpian serves my need, does he? If King can make sense of this paper now, I'm a blue-eyed squatteroo.
        - id: ch03-b24
          speaker: narrator
          text: They slipped from the loft window into a back alley they knew well and began the three-mile run to school. Revising the classics had held them longer than they realized. By the time they reached the furze behind the gasometer, all three were blown and breathless. The College lights twinkled below them, safe and warm, but tea and lock-up were already at least ten minutes past.
        - id: ch03-b25
          speaker: mcturk
          text: It's hopeless. Foxy will be waiting under the lamp by the Fives Court. The Head gave us long leave, and I don't like breaking it.
        - id: ch03-b26
          speaker: stalky
          text: Let me draw from the bonded warehouse of my knowledge...
        - id: ch03-b27
          speaker: mcturk
          text: Oh, stop quoting Jorrocks. Can we run for it?
        - id: ch03-b28
          speaker: stalky
          text: Mr. Radcliffe condemned bishops' boots and recommended cleaning tops with champagne and apricot jam. Now, where is that valve Cokey was turning this afternoon?
        - id: ch03-b29
          speaker: narrator
          text: They heard Stalky feeling around in the wet bushes. Then a miracle began below. First the lights in the Coastguard cottages near the sea went out. Next the brilliantly lit windows of the Golf Club disappeared, followed by the shining fronts of the two hotels. Scattered villas dimmed one by one. Their lamps twinkled weakly and vanished. Last of all, the College lights died. The whole shore was left in the pitch darkness of a windy winter night.
        - id: ch03-b30
          speaker: stalky
          text: Blister my kidneys, it is a frost. The dahlias are dead! Run!
        - id: ch03-b31
          speaker: narrator
          text: They plunged through the dripping gorse while the College buzzed below like an angry hive. From every dining room came the same enormous cry for gas. The boys reached the edge of the sunken path that separated them from their study. They dropped down that wall like bullets, rebounded like boys, and raced inside. In less than two minutes they had stripped off their wet things and changed into dry trousers and coats. Then, wearing slippers with exaggerated innocence, they joined the crowd in the dining hall. In darkness and uproar, it looked like the center of a South American revolution.
        - id: ch03-b32
          speaker: stalky
          text: Hellishly dark, and it smells of cheese! Gas! Gas! Cokey must have gone walking. Foxy will have to find him.
        - id: ch03-b33
          speaker: narrator
          text: Stalky pushed into the shouting crowd and added his own voice to the demand for gas. Prout, the nearest house-master, tried to restore order while unseen boys flicked pats of butter through the darkness. McTurk quietly opened the younger boys' tea urn, so that several were partly scalded and wept with genuine misery. The Fourth and Upper Third hammered knife handles and launched into Vive la Compagnie, the school song. Smaller forms gave thin, batlike shrieks and raided one another's food. Two hundred and fifty well-fed boys in search of more light could be remarkably earnest investigators.
        - id: ch03-b34
          speakers: [class_boy_1, class_boy_2, class_boy_3]
          ensemble: chorus
          text: Gas! Gas! Gas!
        - id: ch03-b35
          speaker: narrator
          text: At last a dreadful smell announced that the gas was flowing again. Stalky sat with his waistcoat open over what might have been his fourth cup of tea.
        - id: ch03-b36
          speaker: stalky
          text: And that's settled. Hello, here comes Pomponius Ego.
        - id: ch03-b37
          speaker: narrator
          text: Carson, head of the school and a solid member of the First Fifteen, crossed from the prefects' table. He was a simple, straight-minded fellow, and he made the invitation in the husky official voice required by the dignity of his office. Number Five must attend in his study in half an hour. All along the tables, boys hissed the news and gave wild imitations of what a ground-ash did to its victim.
        - id: ch03-b38
          speakers: [class_boy_1, class_boy_2, class_boy_3]
          ensemble: chorus
          text: Prefects' meeting! Prefects' meeting!
        - id: ch03-b39
          speaker: stalky
          text: How are we going to play this? It's your turn, Beetle.
        - id: ch03-b40
          speaker: beetle
          text: All you have to do is keep a straight face. I'll deal with young Tulke's immorality in King's own style, and I'll be deadly serious. If you must laugh, don't look at me, or I'll burst.
        - id: ch03-b41
          speaker: stalky
          text: I understand. All right.
        - id: ch03-b42
          speaker: narrator
          text: Every muscle in McTurk's long frame went stiff, and his eyelids dropped halfway. That was his signal for war.
    - id: ch04
      title: The Prefects' Meeting
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Eight or nine seniors sat in a solemn ring of chairs around Carson's severely respectable study. Every face was carefully set. Tulke was not popular even among his own side, and several prefects had enough experience of Stalky and Company to suspect that he might have made a fool of himself. Yet they could not admit that now. Whatever they thought of Tulke, the dignity of the Sixth had to be defended.
        - id: ch04-b02
          speaker: carson
          text: Look here, you fellows. We've called you in because you've been much too cheeky to the Sixth for some time, and we've had enough. Tulke says you cursed and swore at him on the Bideford road this afternoon. We're going to show you that you can't do that. That's all.
        - id: ch04-b03
          speaker: stalky
          text: That's very kind, but we have a few rights too. Being prefects doesn't let you drag senior boys in and lecture them whenever you please, like house-masters. We aren't fags, Carson. You might treat young Davies this way, but you can't treat us so.
        - id: ch04-b04
          speaker: mcturk
          text: Only Prout's foolishness kept us from being prefects long ago, and you know it. You have no tact at all.
        - id: ch04-b05
          speaker: beetle
          text: Wait. A prefects' meeting has to be reported to the Head. Does the Head support Tulke in this affair?
        - id: ch04-b06
          speaker: carson
          text: Well, this isn't exactly a prefects' meeting. We only asked you here to warn you.
        - id: ch04-b07
          speaker: beetle
          text: Every prefect is here. What's the difference?
        - id: ch04-b08
          speaker: stalky
          text: By gum, Carson! You summoned us in front of the whole school at tea and made everyone think this was a prefects' meeting. Now you say it's only a private scolding? You'll get yourself into trouble.
        - id: ch04-b09
          speaker: mcturk
          text: A secret little affair. Very suspicious.
        - id: ch04-b10
          speaker: narrator
          text: The Sixth glanced uneasily at one another. Tulke had already called three prefects' meetings in two terms. At last the Head had told the Sixth that they were expected to maintain discipline themselves instead of repeatedly threatening boys with his authority. Now Carson had admitted that this gathering was not official, though all the prefects were present. They had blundered before their case even began. Any properly obedient boy would have overlooked the legal point and allowed the solemn court to frighten him. Beetle's objection was pure cheek, but it had struck home.
        - id: ch04-b11
          speaker: naughten
          text: Well, you fellows deserve a licking!
        - id: ch04-b12
          speaker: narrator
          text: The careless remark gave Beetle a noble inspiration.
        - id: ch04-b13
          speaker: beetle
          text: For interrupting Tulke's love affair, you mean?
        - id: ch04-b14
          speaker: narrator
          text: Tulke turned the dark purple of a ripe sloe.
        - id: ch04-b15
          speaker: beetle
          text: Oh no, you don't! You've had your turn. You accused us of swearing and planned to dismiss us with a warning. Now you're going to hear from us.
        - id: ch04-b16
          speaker: tulke
          text: I... I... Don't let that little devil start talking!
        - id: ch04-b17
          speaker: carson
          text: If you have something to say, Beetle, say it decently.
        - id: ch04-b18
          speaker: beetle
          text: Decently? Very well. On our way to Bideford, we met this ornament of the Sixth lurking on the road with an ugly look. We didn't know why he wanted to stop us. But at five minutes to four, from Yeo's shop, we saw Tulke in full daylight, wearing his house cap, kissing and hugging a woman on the pavement. Is that decent enough for you?
        - id: ch04-b19
          speaker: tulke
          text: I didn't! I wasn't!
        - id: ch04-b20
          speaker: beetle
          text: We saw you. Then you crept back with her kisses hot on your lips and called this meeting that isn't a meeting, all to defend the honor of the Sixth. And how do we know how many other prefects are involved in this abominable affair?
        - id: ch04-b21
          speaker: mcturk
          text: Yes. That is exactly what we want to know.
        - id: ch04-b22
          speaker: stalky
          text: We meant to speak to you quietly, Carson. But you insisted on gathering everyone.
        - id: ch04-b23
          speaker: narrator
          text: The Sixth were too shocked to answer. A new road had opened in Beetle's mind, bright and straight as if heaven itself had split the clouds for him. He modeled every pause and phrase on Mr. King's classroom speeches and charged forward, surpassing and surprising even himself.
        - id: ch04-b24
          speaker: beetle
          text: The cynical immorality is bad enough, but the blatant indecency is worse. We can't walk into Bideford without stumbling over a prefect's unwholesome romance. Don't laugh, Naughten. I know very little about such things, but a fellow must be deep in sin before he embraces his paramour before the whole city. He could at least wait until dark. But Tulke didn't. You incontinent little animal!
        - id: ch04-b25
          speaker: carson
          text: Stop a moment. Tulke, what is this about?
        - id: ch04-b26
          speaker: tulke
          text: Look, I'm terribly sorry. I never imagined Beetle would turn it against me like this.
        - id: ch04-b27
          speaker: beetle
          text: You thought that because you have no decency, I had none either!
        - id: ch04-b28
          speaker: stalky
          text: So you tried to hide everything with a conspiracy?
        - id: ch04-b29
          speaker: mcturk
          text: You have insulted all three of us. What a filthy mind, Tulke.
        - id: ch04-b30
          speaker: carson
          text: If you keep this up, I'll throw you outside.
          emotion: angry
        - id: ch04-b31
          speaker: stalky
          text: There. That proves it's a conspiracy.
        - id: ch04-b32
          speaker: narrator
          text: Stalky wore the patient innocence of a martyr.
        - id: ch04-b33
          speaker: tulke
          text: I swear I was only walking down the street. I'm awfully sorry it happened, but a woman came up and kissed me. I never kissed her!
        - id: ch04-b34
          speaker: narrator
          text: Silence followed. Then Stalky gave one long, liquid whistle full of disbelief, amazement, and contempt.
        - id: ch04-b35
          speaker: tulke
          text: On my honor! Oh, make him stop talking.
        - id: ch04-b36
          speaker: mcturk
          text: Very well. Naturally, we must accept your word.
        - id: ch04-b37
          speaker: naughten
          text: Confound you, McTurk! You aren't the head prefect here.
          emotion: angry
        - id: ch04-b38
          speaker: mcturk
          text: You know Tulke better than we do. I speak only for ourselves. We accept his word. Still, if I had been caught in such a disgusting position and offered Tulke's excuse, I wonder what you would have said. But on Tulke's word of honor...
        - id: ch04-b39
          speaker: stalky
          text: And Tulkiss, pardon me, is an honorable man.
        - id: ch04-b40
          speaker: beetle
          text: So the Sixth cannot protect themselves from being kissed on an ordinary walk! What a cheerful thing to tell the younger boys. We aren't prefects, but this never happens to us. We never even think about it. Do we, Stalky?
        - id: ch04-b41
          speaker: stalky
          text: Oh, never.
        - id: ch04-b42
          speaker: narrator
          text: Stalky turned away to hide his face. McTurk showed only distant contempt and a little weariness.
        - id: ch04-b43
          speaker: prefect
          text: You fellows seem to know a great deal about it.
        - id: ch04-b44
          speaker: beetle
          text: We can't help that when you push it under our noses. The whole affair is vile and disgraceful. I can't decide who comes out worse, Tulke because he was caught, or the others because they weren't. And now we must stand here being lectured because we interrupted their intrigues.
        - id: ch04-b45
          speaker: narrator
          text: Beetle's voice had fallen into a lazy copy of King's most poisonous classroom manner, the gentle rain that follows a thunderstorm. He sounded almost tired by the filth he had been forced to examine. Then he wheeled fiercely upon Stalky and McTurk, as if they too had somehow failed in their duty.
        - id: ch04-b46
          speaker: carson
          text: Hang it, I only meant to give you a warning.
        - id: ch04-b47
          speaker: narrator
          text: With that, Carson handed himself bound to the enemy.
        - id: ch04-b48
          speaker: beetle
          text: You warn us? Carson, after what we've exposed here, what possible right have you to warn anyone? This is too much. Let's go somewhere clean.
        - id: ch04-b49
          speaker: narrator
          text: They slammed the door behind their outraged innocence. The moment they reached Number Five, Stalky threw himself against Beetle's heaving chest.
        - id: ch04-b50
          speaker: stalky
          text: Oh, Beetle! Golden Beetle! How in the world did you do it?
          emotion: happy
        - id: ch04-b51
          speaker: narrator
          text: McTurk wrapped both arms around Beetle's head and rocked it from side to side while he sang an old refrain.
        - id: ch04-b52
          speaker: mcturk
          text: Pretty lips, sweeter than cherry or plum. Always look jolly and never look glum. Seem to say, come away, kissy, come, come! Yummy-yum! Yummy-yum! Yummy-yum-yum!
          emotion: happy
        - id: ch04-b53
          speaker: beetle
          text: Careful! You'll break my spectacles. Wasn't it glorious? Didn't I give them a splendid school-story sermon? Did you catch everything I borrowed from King? Oh, blast! I forgot one adjective, obscene. That's one of King's favorites too.
        - id: ch04-b54
          speaker: mcturk
          text: Never mind. They'll send an ambassador in a minute to beg us not to tell the school. This is desperately serious for them. Poor Sixth. Poor old Sixth.
        - id: ch04-b55
          speaker: stalky
          text: Immoral young rascals. What an example for pure-minded boys like us.
        - id: ch04-b56
          speaker: narrator
          text: Back in Carson's study, the Sixth remained where Beetle had left them. They sat stunned, the meeting still not formally ended, and turned their anger toward Tulke. He stood at the center of their disaster, close to tears and still unable to see why telling the exact truth had made matters worse.
        - id: ch04-b57
          speaker: carson
          text: Well, Tulke, you've made a thoroughly ghastly mess of this.
        - id: ch04-b58
          speaker: tulke
          text: Why didn't you thrash that little devil Beetle before he started talking?
          emotion: sad
        - id: ch04-b59
          speaker: prefect
          text: I knew there would be trouble, but you insisted on this meeting.
        - id: ch04-b60
          speaker: naughten
          text: And what good did it do? They came here and lectured us when we meant to lecture them. Beetle treated us like criminals. Then they hung us out to dry and slammed the door like house-masters. This is all your fault, Tulke.
        - id: ch04-b61
          speaker: tulke
          text: But I didn't kiss her.
        - id: ch04-b62
          speaker: naughten
          text: You ass! It would have been ten times better if you'd claimed you did and stood by it. Now they'll tell the whole school, and Beetle will invent horrible rhymes and nicknames.
        - id: ch04-b63
          speaker: tulke
          text: But she kissed me!
        - id: ch04-b64
          speaker: narrator
          text: Away from his lessons, Tulke's mind moved slowly. The fact that Mary had kissed him seemed to answer every accusation, though it was precisely the answer Number Five had prepared for him.
        - id: ch04-b65
          speaker: naughten
          text: I'm thinking about the rest of us, not you. I'll go to their study and try to make them keep quiet.
        - id: ch04-b66
          speaker: narrator
          text: Naughten found Beetle and began as pleasantly as he could.
        - id: ch04-b67
          speaker: naughten
          text: Tulke is badly upset. I've come to ask you fellows, especially you, Beetle, not to spread this through the school. Boys as senior as you can see why.
        - id: ch04-b68
          speaker: beetle
          text: Who kissed him this time? Hmm. I suppose I'll have to speak to the Sixth again.
        - id: ch04-b69
          speaker: naughten
          text: There's no need at all, my dear fellow. Give me any message, and I'll carry it.
        - id: ch04-b70
          speaker: narrator
          text: Naughten was eager to carry any message because another appearance by Beetle could only do more damage. But Beetle could not resist the chance to use his missing adjective. Naughten returned to the meeting with Beetle at his heels, pale, cold, distant, and grand. Stalky and McTurk stayed behind to wait for the result.
        - id: ch04-b71
          speaker: beetle
          text: You appear uneasy about what action we may take after this final revelation of the obscene. Perhaps it will comfort you to know that, for the honor of the school, we have decided to remain silent about these obscenities. There. You have our word.
        - id: ch04-b72
          speaker: narrator
          text: Beetle turned with his head among the stars and marched back to Number Five. Stalky and McTurk lay side by side on the table, wiping their eyes and too weak with laughter to move.
    - id: ch05
      title: The Final Examination
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Latin prose paper succeeded beyond their wildest hopes. Stalky and McTurk were excused from every examination because they took extra lessons with the Head, but Beetle attended this one with particular eagerness. King moved through the room handing out the ruined papers, entirely unaware that his questions no longer said what he had written.
        - id: ch05-b02
          speaker: king
          text: I suppose this is merely a side task for you, Beetle mine. One final performance before you rise into higher spheres? A last assault upon the classics? The paper seems to have defeated you already.
        - id: ch05-b03
          speaker: narrator
          text: Beetle frowned at the print.
        - id: ch05-b04
          speaker: beetle
          text: I can't make head or tail of it. What is this supposed to mean?
        - id: ch05-b05
          speaker: king
          text: No, no. We depend on you to supply the meaning. This is an examination, not a guessing game. Your classmates will have no difficulty in...
        - id: ch05-b06
          speaker: narrator
          text: Tulke rose, carried his paper to the desk, and laid it before King. King read it and turned a sickly green.
        - id: ch05-b07
          speaker: beetle
          text: Stalky is missing a treat. I wonder how King will escape this.
        - id: ch05-b08
          speaker: narrator
          text: Beetle kept the thought to himself.
        - id: ch05-b09
          speaker: king
          text: There may be a small amount of truth in Beetle's observation. I suspect the worthy Randall dropped the type out of its forme, if any of you know what that means. Beetle, since you claim to be an editor, perhaps you can explain formes to the class.
        - id: ch05-b10
          speaker: beetle
          text: Whose form, sir? This sentence hasn't even got a verb, and the ode looks completely different.
        - id: ch05-b11
          speaker: king
          text: Before you volunteered that criticism, I was about to explain that the type must have suffered an accident. The printer evidently rebuilt the paper by instinct. Randall is no authority on Cicero or Horace.
        - id: ch05-b12
          speaker: beetle
          text: That's rather low, blaming Randall. King must have been drunk as an owl when he wrote it.
        - id: ch05-b13
          speaker: narrator
          text: Beetle whispered this to the boy beside him.
        - id: ch05-b14
          speaker: king
          text: We can correct the mistake by dictating the proper text.
        - id: ch05-b15
          speakers: [maclagan, class_boy_1, class_boy_2, class_boy_3]
          ensemble: chorus
          text: No, sir! Dictation takes away our examination time. We only have two hours. It isn't fair. This was supposed to be a printed paper. How will you mark us? Randall made the mistake, not us. An examination is an examination!
        - id: ch05-b16
          speaker: narrator
          text: The chorus of objections naturally convinced King that the class was trying to undermine his authority. Instead of beginning the dictation at once, he delivered a lecture on the spirit in which honest boys should approach examinations. The speech used up still more of the allotted two hours. Whenever the storm of protest began to fade, Beetle watched for a chance to stir it fresh.
        - id: ch05-b17
          speaker: king
          text: What was that, Beetle? What were you saying to MacLagan?
        - id: ch05-b18
          speaker: beetle
          text: I only said someone should have checked the papers before handing them out, sir.
        - id: ch05-b19
          speaker: maclagan
          text: Hear, hear!
        - id: ch05-b20
          speaker: narrator
          text: King demanded to know whether Beetle had personally appointed himself guardian of the school's traditions. He spoke at length about discipline, scholarship, and respect, and his passion for knowledge consumed another fifteen minutes of the examination. Even the prefects, who normally supported authority, began to show unmistakable signs of boredom.
        - id: ch05-b21
          speaker: narrator
          text: Later, in a half-dismantled Number Five study, Beetle reported the triumph.
        - id: ch05-b22
          speaker: beetle
          text: It was a glorious time. King spluttered, and I kept him spluttering. At last he dictated about half of Dolabella and company.
        - id: ch05-b23
          speaker: stalky
          text: Good old Dolabella, my dear friend. Go on.
        - id: ch05-b24
          speaker: beetle
          text: Naturally we asked how to spell nearly every other word, and that made him splutter again. He cursed me, MacLagan, Randall, the materialized ignorance of the uneducated middle classes, and the lust for mere marks. You might call it one final exhibition, a last assault, a glorious side task.
        - id: ch05-b25
          speaker: stalky
          text: But of course he was blind drunk when he wrote the paper. I hope you explained that.
        - id: ch05-b26
          speaker: beetle
          text: Certainly. I told Tulke that an immoral prefect and a drunken house-master were the only reasonable conclusions. He nearly cried. He's terribly shy of us since Mary kissed him.
        - id: ch05-b27
          speaker: narrator
          text: Tulke kept that modesty to the very end of term. At last the journey money was paid out, trunks and hatboxes were packed, and the boys began filling the horse-drawn brakes that would carry them to the station. Just before departure, Stalky, Beetle, and McTurk tenderly prevented Tulke from joining his friends.
        - id: ch05-b28
          speaker: stalky
          text: You see, Tulke, you may be a prefect, but I have left the College. Do you understand, dear Tulke?
        - id: ch05-b29
          speaker: tulke
          text: Yes, I understand. Don't hold a grudge, Stalky.
        - id: ch05-b30
          speaker: stalky
          text: Stalky? Curse your impudence, you young cub! I am Mister Corkran now, and you are a dirty little schoolboy.
        - id: ch05-b31
          speaker: narrator
          text: Stalky stood magnificent in a top hat, stiff collar, spats, and a high-waisted snuff-colored overcoat.
        - id: ch05-b32
          speaker: mcturk
          text: A frabjously immoral schoolboy too. You should be ashamed to force your company on pure-minded young men like us.
        - id: ch05-b33
          speaker: naughten
          text: Come on, Tulke!
        - id: ch05-b34
          speaker: narrator
          text: Naughten called from the prefects' brake.
        - id: ch05-b35
          speaker: stalky
          text: Yes, we're coming. Move over and make room, you Collegers. You must all return next term with your yes sir, no sir, and please sir. But before we say goodbye, we have a little story for you. Drive on, Dickie. We're ready. Push that hatbox under the seat, and don't crowd your Uncle Stalky.
        - id: ch05-b36
          speaker: mcturk
          text: As fine a group of high-minded youngsters as anyone could wish to see. Slightly immoral, perhaps, but boys will be boys. Don't look so stiff, Carson. Mister Corkran will now tell you the story of Tulke and Mary Yeo!
