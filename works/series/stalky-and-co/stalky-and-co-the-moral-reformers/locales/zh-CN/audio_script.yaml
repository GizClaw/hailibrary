audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏从容，带着含蓄的幽默
        timbre: 温暖清晰的中低音
        pace: 舒展而富于变化
        pitch: 中
    stalky:
      display_name: 斯托基
      tts:
        delivery: 自信狡黠，随时像在部署作战
        timbre: 清亮而有韧性的少年音
        pace: 明快
        pitch: 中高
    beetle:
      display_name: 甲虫
      tts:
        delivery: 机智好辩，笑意常藏在话里
        timbre: 稍厚的少年音
        pace: 中等偏快
        pitch: 中
    mcturk:
      display_name: 麦克特克
      tts:
        delivery: 冷峭直接，激动时带鲜明的爱尔兰腔调
        timbre: 瘦硬略带沙哑的少年音
        pace: 中等
        pitch: 中高
    chaplain:
      display_name: 学校牧师
      tts:
        delivery: 温吞含蓄，说话不紧不慢
        timbre: 温和的中年男声
        pace: 偏慢
        pitch: 中低
    headmaster:
      display_name: 校长
      tts:
        delivery: 冷静老练，温和话音里藏着不容躲闪的锋芒
        timbre: 深沉清晰的老年男声
        pace: 从容
        pitch: 低
    cruell:
      display_name: 克卢尔
      tts:
        delivery: 畏缩怯弱，受逼迫时声音发颤
        timbre: 单薄稚嫩的男孩声
        pace: 偏慢
        pitch: 高
    sefton:
      display_name: 塞夫顿
      tts:
        delivery: 粗横自负，失势后惊惧狼狈
        timbre: 粗重的青年男声
        pace: 中等偏快
        pitch: 中低
    campbell:
      display_name: 坎贝尔
      tts:
        delivery: 装腔傲慢，慌乱时语气发虚
        timbre: 光滑清楚的青年男声
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 牧师的第十军团
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 普劳特把校长请来，胜负也就再清楚不过了。五号室输了，却并不怨恨，也没觉得自己吃了什么亏。既然普劳特不肯守游戏规矩，竟然把校长搬来，他们至少已经痛痛快快闹过一场。约翰牧师一有空，又来到五号室，坐下同他们谈心。
        - id: ch01-b02
          speaker: narrator
          text: 学校教员休息室里住的全是单身汉。教师的自修室又特意散布在学生自修室和教室中间，所以教师只要愿意，学生的一举一动都能看清。五号室花了几年工夫，小心考察约翰牧师，终于认定他是位绅士。他进门以前先敲学生的门，进来以后也守客人的本分，从不摆出执法官误闯进来的架子。他不会唠叨说教，更不会把闲谈中听来的私话带进公事。普劳特永远是个十足的讨厌鬼，金先生来访只为报仇，就连小个子哈托普说起博物学，也很少忘掉教师的职分。只有约翰牧师，是他们真心盼望、真心喜欢的客人。
        - id: ch01-b03
          speaker: narrator
          text: 这会儿，他正坐在屋里唯一的扶手椅上，牙齿间叼着一管弯曲的石楠木烟斗。三层下巴堆在牧师领上，活像一条和气的鲸鱼，一口一口往外喷烟。五号室的三个孩子围着他，大谈他们眼里的人生，尤其谈到最近那件高利贷风波，还有他们被叫去见校长的全部经过。
        - id: ch01-b04
          speaker: chaplain
          text: 每星期挨一顿鞭子，对你们很有好处。再说，照你们自己的讲法，你们当然完全占理。
          emotion: happy
        - id: ch01-b05
          speaker: stalky
          text: 那还用说，神父！他要是肯让我们开口，我们本来能证明。可他根本不肯。校长就是只老奸巨猾的鸟儿。
        - id: ch01-b06
          speaker: chaplain
          text: 他早把你们看透了。你们也确实费了不少功夫，才挣到那顿鞭子。
          emotion: happy
        - id: ch01-b07
          speaker: beetle
          text: 不过他是真公道。他不会早上抽一个学生，下午又跑来给他讲道。
        - id: ch01-b08
          speaker: mcturk
          text: 他也讲不了。谢天谢地，他又不是牧师。
        - id: ch01-b09
          speaker: narrator
          text: 五号室一向对牧师兼任校长这种人意见很大。他们觉得，手里既握着鞭子，又拿着讲道的权力，实在太不公平。所以一谈到这件事，他们随时都乐意同自家这位牧师认真辩上一场。
        - id: ch01-b10
          speaker: chaplain
          text: 别的学校，差不多都是牧师做校长。
        - id: ch01-b11
          speaker: stalky
          text: 那对学生不公平，会把人闷坏，也会把人弄得死犟。当然，先生，您不一样。您跟我们一样，都是这学校里的人。我说的是普通牧师。
        - id: ch01-b12
          speaker: chaplain
          text: 我就是再普通不过的牧师。哈托普先生也受过圣职。
        - id: ch01-b13
          speaker: beetle
          text: 可他进学校以后才受圣职，我们还看着他去考试呢。那就没关系。您想想，要是校长忽然去受圣职呢！
        - id: ch01-b14
          speaker: chaplain
          text: 那会怎么样，甲虫？
        - id: ch01-b15
          speaker: beetle
          text: 一年之内，学校准得垮掉，一点疑问也没有。
        - id: ch01-b16
          speaker: chaplain
          text: 你怎么会知道？
        - id: ch01-b17
          speaker: stalky
          text: 我们在这里快六年了，学校里的事，很少有我们不知道的。就连您也比我晚来一个学期。我还记得您第一次上课，问我们都叫什么。按资历算，只有金先生、普劳特先生和校长比我们老。
        - id: ch01-b18
          speaker: chaplain
          text: 是啊，教员休息室里换过不少人。
        - id: ch01-b19
          speaker: beetle
          text: 他们来了，又走了，全都结婚去了。走得好极了！
        - id: ch01-b20
          speaker: chaplain
          text: 原来甲虫不赞成结婚？
        - id: ch01-b21
          speaker: beetle
          text: 不赞成，神父，别拿我开心。我放假见过一些舍监结了婚的学校。真是吓人。婴儿、长牙、麻疹，全塞在学校正中间。舍监太太还办茶会，茶会呀！还请学生去吃早饭。
        - id: ch01-b22
          speaker: stalky
          text: 那还不是最糟的。舍监把宿舍扔给级长，自己不管。我听说有的学校，学生宿舍和舍监住宅隔着厚绿呢门，中间还有一英里长的走廊。学生爱干什么就干什么。
        - id: ch01-b23
          speaker: chaplain
          text: 这可真是撒旦在斥责罪恶。
        - id: ch01-b24
          speaker: stalky
          text: 胡闹本身没什么不好，神父，您明白我们的意思。可日子一久，事情就会越滚越大。先是没人管，接着大家越做越过分，最后轰的一声闹出大乱子。报纸也登了，一大群学生被开除。事情总是这样收场。
        - id: ch01-b25
          speaker: mcturk
          text: 而且被开除的总是没犯事的人。神父，喝可可吗？
        - id: ch01-b26
          speaker: chaplain
          text: 不喝，多谢，我正抽烟呢。总是没犯事的人？请继续说吧，我的斯托基。
        - id: ch01-b27
          speaker: stalky
          text: 然后大家就喊，谁能想到，孩子怎么这么吓人，这么坏！照我看，祸根就是舍监结了婚。
        - id: ch01-b28
          speaker: chaplain
          text: 丹尼尔来断案了。
        - id: ch01-b29
          speaker: mcturk
          text: 本来就是。我放假见过的那些家伙也这么说。让学生家长看起来，一幢体面的独立住宅，再有一位体面的太太管家，当然很漂亮。其实根本不是那么回事。舍监一分心，级长手里的权力又大得过头，慢慢地，一切就都烂掉了。您瞧，我们这里还不是普通学校。除了斯托基这种乖孩子，我们也会收下那些被补习班淘汰的货色。学校自然非这样做不可，才能打出名声。到头来，总有办法把那些人塞进桑赫斯特军校，对不对？
        - id: ch01-b30
          speaker: chaplain
          text: 不错，火鸡。你说起话来，真像一本书。
        - id: ch01-b31
          speaker: mcturk
          text: 所以我们要的教师也该跟别处不同。我们本来就不是普通学校。
        - id: ch01-b32
          speaker: beetle
          text: 我还听人说，舍监结婚也会招来欺凌。
        - id: ch01-b33
          speaker: chaplain
          text: 我得承认，要照看你们，你们差不多能占掉一个单身汉的全部时间。不过，你们有没有想过，教员休息室这个世界，有时候离你们实在太近了？
        - id: ch01-b34
          speaker: stalky
          text: 不怎么觉得，至少夏天不觉得。我们能去的地方很大，他们也常让我们自己待着。
        - id: ch01-b35
          speaker: chaplain
          text: 比如现在，我坐在你们自修室里，其实很碍事吧？
        - id: ch01-b36
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 一点也不碍事，神父。别走，先生。您什么时候来，我们都高兴。
        - id: ch01-b37
          speaker: narrator
          text: 三个人的声音真诚得不能再真诚，任何人听了都不会怀疑。他们确实不把约翰牧师当一个闯进来的教师。约翰牧师听得十分欢喜，脸上微微红了起来，又低头给那管石楠木烟斗装满烟丝。
        - id: ch01-b38
          speaker: beetle
          text: 再说，教员们在哪里，我们通常也知道。先生，昨晚十点以后，您不是从低年级宿舍穿过去了吗？
        - id: ch01-b39
          speaker: chaplain
          text: 我去找你们舍监抽烟，只是抄近路经过。可没有去给他灌输什么看法。
        - id: ch01-b40
          speaker: beetle
          text: 今早我闻到一点烟草味。您的烟比普劳特先生的冲，我一闻就知道。
        - id: ch01-b41
          speaker: chaplain
          text: 天哪！
        - id: ch01-b42
          speaker: narrator
          text: 约翰牧师说这话时有些心不在焉。多年以后，甲虫才懂得，牧师赞叹的与其说是他的观察力，不如说是他的天真。那些宿舍一排排狭长明亮，没有窗帘，也没有内门。不管夜里什么时候，总会有教师从中穿过，到彼此房里串门。因为单身汉总比有家室的人睡得晚。甲虫从没想到，这种一夜不停的走动，也许本来就另有用意。
        - id: ch01-b43
          speaker: chaplain
          text: 说回欺凌。你们刚做低年级生的时候，不也给整得很惨吗？
        - id: ch01-b44
          speaker: beetle
          text: 那时我们大概也是几个可恶的小畜生。可当年的恶霸真够凶，费尔伯恩、大嘴曼塞尔，还有他们那一伙。
        - id: ch01-b45
          speaker: stalky
          text: 记得大嘴叫我们三只瞎老鼠吗？他逼我们爬上柜子唱歌，还拿墨水瓶往我们身上扔。那才叫恶霸。
        - id: ch01-b46
          speaker: mcturk
          text: 不过现在已经没有那种事了。过去那些恶霸和他们的花样，早就都消失了。
        - id: ch01-b47
          speaker: chaplain
          text: 你们错就错在这里。只要自己眼下没受伤，就总爱说一切都很好，过去的坏事也已经消失。可我有时候会怀疑，欺凌真的已经从学校里绝迹了吗？
        - id: ch01-b48
          speaker: beetle
          text: 低年级生彼此欺负得厉害。高年级忙着准备考试，该有别的事操心。
        - id: ch01-b49
          speaker: stalky
          text: 怎么，您觉得出什么事了？
        - id: ch01-b50
          speaker: chaplain
          text: 我只是起了疑心。可你们三个还算有点脑子，眼睛却真不管用。上星期在公共教室里，你们只顾着给舍监找麻烦，鼻子底下的事也没看见。
        - id: ch01-b51
          speaker: beetle
          text: 什么事？我发誓，我们什么也没看见。
        - id: ch01-b52
          speaker: chaplain
          text: 那我劝你们亲自去看看。一个小家伙总缩在角落里哭，身上衣服穿得像一堆破布，从来不肯做功课，又是全校出了名最脏的走廊警报。几个迹象全落在同一个孩子身上，这里面一定有什么地方不对劲。
        - id: ch01-b53
          speaker: mcturk
          text: 是克卢尔。
        - id: ch01-b54
          speaker: chaplain
          text: 对，就是克卢尔。他来我这里学法语，这是他进学校的第一个学期。他天生就不怎么聪明，如今又被人打得快成白痴了。甲虫，他跟你当初一样，眼看就要被折腾成一摊废物。
        - id: ch01-b55
          speaker: beetle
          text: 不会吧。他们常装傻，好少挨几次训。这一套我懂。
        - id: ch01-b56
          speaker: chaplain
          text: 我没亲眼看见他挨打。
        - id: ch01-b57
          speaker: beetle
          text: 真会欺负人的，从不当众动手。费尔伯恩就从不在别人看着的时候碰我。
        - id: ch01-b58
          speaker: mcturk
          text: 这事不值得吹，甲虫。我们当年谁没挨过？
        - id: ch01-b59
          speaker: beetle
          text: 可我比谁挨得都多。神父，您要找一个欺凌方面的权威，就来问我。开瓶钻、刷子操用的钥匙、敲脑壳、拧胳膊、摇摇睡、阿格阿格，还有其他一切花样，我全都亲自领教过。
        - id: ch01-b60
          speaker: chaplain
          text: 我正需要这位权威，也需要借你们三个人的威势，让它停下来。
        - id: ch01-b61
          speaker: mcturk
          text: 那哈里森和克雷怎么办？他们可是普劳特先生的宠儿。我们连副级长都不是。
        - id: ch01-b62
          speaker: chaplain
          text: 我仔细想过这一层。可是反过来看，多数欺凌也不过是做事的人没有动脑子。
        - id: ch01-b63
          speaker: mcturk
          text: 才不是。恶霸就是爱欺负人。他们上课想花样，回宿舍便拿人试。
        - id: ch01-b64
          speaker: chaplain
          text: 不管怎么说，要是捅到级长那里，也许又会闹成宿舍风波。你们已经有过一次了。别笑，听我说。我请我的第十军团悄悄接手这件事。先让小克卢尔至少看起来干净、体面一点。
        - id: ch01-b65
          speaker: stalky
          text: 我可不替他洗澡。
        - id: ch01-b66
          speaker: chaplain
          text: 还要让他体面起来，懂得一点自重。至于另一个孩子，不管那是谁，你们尽可以发挥自己的影响力。你们愿意用什么办法都行，去劝他住手。事情就交给你们了。晚安，孩子们。
    - id: ch02
      title: 小山羊引来老虎
      blocks:
        - id: ch02-b01
          speaker: stalky
          text: 好吧，我们怎么办？
        - id: ch02-b02
          speaker: beetle
          text: 克卢尔巴不得有个清静地方待着。要不让他来做我们自修室的低年级杂役？
        - id: ch02-b03
          speaker: mcturk
          text: 不行！那小畜生脏得要命，会把什么都弄乱。我们也不来埃里克那套肉麻亲昵。难道你还想搂着他的脖子到处走？
        - id: ch02-b04
          speaker: beetle
          text: 至少他能把果酱罐舔干净，还有那口煮焦了粥的锅。现在可脏死了。
        - id: ch02-b05
          speaker: stalky
          text: 这不行。找出那个一直欺负他的快乐丑角，让那家伙也快活快活，事情就解决了。可我们待在公共教室时，怎么没看出来？
        - id: ch02-b06
          speaker: beetle
          text: 也许是一大群低年级生合伙跟他过不去。他们有时候就这么干。
        - id: ch02-b07
          speaker: mcturk
          text: 那就把宿舍里所有低年级生都踢一遍，碰运气。走吧。
        - id: ch02-b08
          speaker: stalky
          text: 别急。这事不能闹出动静。那个人一直做得很隐秘，不然我们早看见了。先四处闻闻味儿，有把握再动手。
        - id: ch02-b09
          speaker: narrator
          text: 他们在宿舍里一间教室接一间教室地找，把每一个可疑的低年级生和高年级生都点了一遍。照甲虫的主意，他们又查看盥洗室和储物间，仍旧一无所获。似乎所有人都在该在的地方，偏偏只有克卢尔不见了。斯托基走到一扇自修室门外，忽然停下脚步。门板后面传出细细的尖声，歌声里混着哭泣，听来又远又闷。
        - id: ch02-b10
          speaker: cruell
          text: 美丽的凯蒂，清晨一路轻盈走来……
        - id: ch02-b11
          speaker: sefton
          text: 大声点，小混蛋！不然我拿书砸你。
          emotion: angry
        - id: ch02-b12
          speaker: cruell
          text: 提着一罐牛奶……哦，坎贝尔，求求你，别打！她走向集市……
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: 一本书砸上柔软的身体，屋里立刻响起尖叫。
        - id: ch02-b14
          speaker: beetle
          text: 原来是住自修室的高年级生，难怪我们一直没发现。塞夫顿和坎贝尔都是壮实的大个子，不会很好对付。而且自修室不是公共教室，门一关，别人就不能随随便便闯进去看。
        - id: ch02-b15
          speaker: mcturk
          text: 畜生！这有什么好玩的？克卢尔大概给他们当杂役。
          emotion: angry
        - id: ch02-b16
          speaker: stalky
          text: 幸好他们不是级长。塞夫顿和坎贝尔，坎贝尔和塞夫顿。好啊，其中一个还是补习班来的小狗。
        - id: ch02-b17
          speaker: narrator
          text: 两人十七八岁，早熟，脸上也长满了毛。父母已经对他们绝望，只盼六个月扎实突击，或许还能侥幸把他们塞进桑赫斯特军校，这才送他们来。名义上，他们属于普劳特的宿舍，实际上却由校长亲自盯着。校长一向谨慎，从不把新来的陌生学生提为级长，两个人因此认定学校亏待了他们。塞夫顿在伦敦一家补习班待过三个月，讲起那里的冒险，总比实情精彩得多。坎贝尔衣着品味高雅，词汇也丰富，于是跟着他一起傲然俯视世上其他人。这才是他们第二个学期。学校早就见惯了学生口中的补习班小狗，只拿一种很叫人难堪的冷淡对待他们。可两人的络腮胡和上唇胡须，确实威风得不容否认。塞夫顿甚至有一把真正的剃刀。
        - id: ch02-b18
          speaker: mcturk
          text: 咱们进去劝劝？我没怎么跟他们打过交道，不过我敢拿帽子打赌，坎贝尔是个胆小鬼。
        - id: ch02-b19
          speaker: stalky
          text: 不行，那叫直接引语。我喜欢间接引语。再说，直接进去，我们的道德影响力往哪儿摆？
        - id: ch02-b20
          speaker: beetle
          text: 胡扯。你到底想怎么办？
        - id: ch02-b21
          speaker: stalky
          text: 我想跟他们开个玩笑。先安静！
        - id: ch02-b22
          speaker: narrator
          text: 斯托基把两只手深深插进口袋，望着窗外的大海，从牙缝里吹起口哨。接着，一只脚开始敲地，一边肩膀耸了起来。他猛地转身，跳起短促又急快的双步舞。这是斯托基思考时的战舞。他抿紧嘴唇，张开鼻孔，身体跟着快步的节奏摇摆，在空教室里来回跳了整整三趟。他最后停在目瞪口呆的甲虫面前，拿指关节轻轻敲他的脑袋。甲虫一下下低头承受。麦克特克抱起一边膝盖，前后摇晃。隔壁的克卢尔还在哭嚎，仿佛一颗心都快碎了。
        - id: ch02-b23
          speaker: stalky
          text: 甲虫是祭品。真替你难过。还记得高尔顿的《旅行的艺术》吗？还有那只一叫就引来老虎的小山羊？
        - id: ch02-b24
          speaker: beetle
          text: 该死！非得有我才办得成吗？
        - id: ch02-b25
          speaker: stalky
          text: 恐怕是的，亲爱的甲虫。你得让火鸡和我欺负一顿，嚎得越响越好。火鸡，弄一根三柱门柱，再拿截箱绳来。我们照高尔顿的法子，把甲虫捆成猎物。还记得茉莉费尔伯恩逼我们脱鞋斗鸡，把膝盖捆在一起吗？
        - id: ch02-b26
          speaker: beetle
          text: 那可疼得要命。
        - id: ch02-b27
          speaker: stalky
          text: 当然疼。火鸡会把你撞得满地滚。记住，我们三个闹翻了，是我骗你干的。手帕给我。
        - id: ch02-b28
          speaker: narrator
          text: 斯托基拿过甲虫的手帕，三个人动手把甲虫捆成斗鸡的姿势。门柱从肘弯和膝弯之间横穿过去，两只膝盖又用箱绳扎在一起。斯托基伸手一推，甲虫立刻失去平衡，侧着身体滚倒在地，弄得全身都是灰。
        - id: ch02-b29
          speaker: stalky
          text: 火鸡，把他头发揉乱。你也蹲下。小山羊一叫，老虎就兴奋。你们只管骂，装作气得我浑身冒汗。我拿门柱逗你们。甲虫，你得哭。
        - id: ch02-b30
          speaker: beetle
          text: 好嘞！半眨眼我就能进入状态。
        - id: ch02-b31
          speaker: stalky
          text: 开始。记住小山羊怎么叫。
        - id: ch02-b32
          speaker: beetle
          text: 住手，你们这些畜生！放开我！你们快把我膝盖勒断了！卑鄙的混蛋，快住手，这一点也不好玩！
          emotion: fearful
        - id: ch02-b33
          speaker: stalky
          text: 揍他，火鸡！踢他，把他滚过去！别装孬，甲虫。火鸡，再来一脚！
          emotion: angry
        - id: ch02-b34
          speaker: mcturk
          text: 他根本没真哭。蜷起来，甲虫，不然我一脚把你踢进壁炉挡板！
          emotion: angry
        - id: ch02-b35
          speaker: narrator
          text: 甲虫的抗议声装得极像，简直是一件艺术品。三个人又喊又骂，又踢又滚，合力造出一阵可怕的喧闹。诱饵果然把猎物引来了。塞夫顿和坎贝尔推门走进来，看见甲虫侧躺在地上，脑袋顶着壁炉挡板，眼睛里全是泪。麦克特克还在用脚尖一下下捅他的背。
        - id: ch02-b36
          speaker: sefton
          text: 喂，这是什么开心玩意儿？
        - id: ch02-b37
          speaker: stalky
          text: 只是甲虫。他装疼。我怎么都叫不动火鸡认真收拾他。
        - id: ch02-b38
          speaker: narrator
          text: 塞夫顿一看见这种玩法，马上上前踢了两个孩子。他的脸一下亮了起来，显然已经完全上钩。
        - id: ch02-b39
          speaker: sefton
          text: 行，我来管他们。你们两个起来斗鸡，把门柱给我，我来逗。真是个好玩意儿！坎贝尔，来，咱们好好整他们。
          emotion: happy
        - id: ch02-b40
          speaker: mcturk
          text: 斯托基，你明明说自己也要斗鸡。来呀！
          emotion: angry
        - id: ch02-b41
          speaker: stalky
          text: 你居然信了，只能怪你更蠢！
        - id: ch02-b42
          speaker: campbell
          text: 你们几个闹翻了？
        - id: ch02-b43
          speaker: stalky
          text: 闹翻？我只是在教育他们。塞菲，你懂斗鸡吗？
        - id: ch02-b44
          speaker: sefton
          text: 我懂不懂？我在城里麦克拉根那里补习时，我们就在他客厅斗鸡。小麦克拉根一个字都不敢说。我们在那里完全像成年人一样。来，我教你们。
        - id: ch02-b45
          speaker: beetle
          text: 我不能起来吗？
        - id: ch02-b46
          speaker: stalky
          text: 少废话，你这个胖蠢货。你要跟塞菲斗。
        - id: ch02-b47
          speaker: beetle
          text: 他会宰了我！
        - id: ch02-b48
          speaker: campbell
          text: 把他们拖进我们的自修室，那里又安静又舒服。我跟火鸡斗，这比小克卢尔好玩。
        - id: ch02-b49
          speaker: sefton
          text: 好！他们脱鞋，我们穿鞋。
          emotion: happy
        - id: ch02-b50
          speaker: narrator
          text: 这个提议正中下怀。塞夫顿和坎贝尔很快被放倒在自己的自修室地板上。斯托基把两个大个子滚到一把扶手椅后面，让他们紧挨着躺好，自己准备亲自指挥这场所谓的斗牛。
        - id: ch02-b51
          speaker: stalky
          text: 塞菲，你手腕真粗，手帕捆不住。这里有箱绳吗？
        - id: ch02-b52
          speaker: sefton
          text: 墙角多得很，快点！甲虫，别哭了。咱们要狠狠干一场。输家得唱歌赞美赢家。你不是自称可恶的诗人吗？我给你一点诗意瞧瞧。
        - id: ch02-b53
          speaker: narrator
          text: 塞夫顿扭动身体，在坎贝尔身旁摆好了姿势。门柱又快又准地穿过四肢自然形成的弯角，两个人的手腕也被绷得紧紧的箱绳捆牢。扶手椅后面，麦克特克装作遭到出卖，仍在不停地破口大骂，用辱骂声给整个过程伴奏。斯托基把坎贝尔和塞夫顿安置妥当，这才大步走向自己的同伴，路过门边时顺手把门锁了。
        - id: ch02-b54
          speaker: stalky
          text: 这就齐活了。
        - id: ch02-b55
          speaker: narrator
          text: 塞夫顿才骂出半句，甲虫的假眼泪便突然停了。麦克特克也笑着从扶手椅后站起身。两人一道扑过去，把敌人的膝盖和脚踝捆得更紧。斯托基安稳地坐进扶手椅，脸上带着最温和的微笑，欣赏眼前的景象。一个被绑成斗鸡姿势的人，也许就是世上最无助的东西。他向后一靠，看着那两个绝妙的蠢驴，笑得几乎再也笑不动。
        - id: ch02-b56
          speaker: stalky
          text: 小山羊一叫，老虎就兴奋。你们两个可真是绝妙的蠢驴！
          emotion: happy
    - id: ch03
      title: 道德劝化
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个俘虏先是愣在那里，怎么也不肯相信眼前的变化。过了好一会儿，他们才终于明白，自己刚才兴冲冲走进来的时候，已经一头落进了圈套。
        - id: ch03-b02
          speaker: sefton
          text: 等我们起来，一定让你们挨这辈子最狠的一顿揍！事情完了，看你们还能从哪边嘴角笑。你们到底想干什么？
          emotion: angry
        - id: ch03-b03
          speaker: mcturk
          text: 马上就知道。少骂几句。我们只想问，你们两个大块头畜生，为什么一直欺负克卢尔？
        - id: ch03-b04
          speaker: sefton
          text: 不关你们的事。
        - id: ch03-b05
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 你们为什么欺负克卢尔？
        - id: ch03-b06
          speaker: narrator
          text: 三个人轮流把同一个问题问了一遍又一遍。语调不变，措辞不变，问完就从头再来。他们对这种手艺熟得很，也深知没有一个孩子经得住永远不变的同一句追问。正是这种机械而无休止的重复，构成了欺凌最折磨人的部分。
        - id: ch03-b07
          speaker: campbell
          text: 因为我们高兴！快放开我们。
          emotion: angry
        - id: ch03-b08
          speaker: stalky
          text: 好。现在我们也要欺负你们，因为我们高兴。我们会像你们对克卢尔那样公平。他拿你们没办法，你们也拿我们没办法。很有意思吧？
        - id: ch03-b09
          speaker: sefton
          text: 没办法？你们等着瞧！
        - id: ch03-b10
          speaker: beetle
          text: 这就证明你们从没真正被人开过玩笑。当众挨一顿打，哪能比得上一场温柔的玩笑？我赌一先令，你们会哭，也会什么都答应。
        - id: ch03-b11
          speaker: sefton
          text: 小甲虫，等我起来，我非把你打个半死。这一点我现在就能答应。
        - id: ch03-b12
          speaker: beetle
          text: 可先被打个半死的是你们。你们对克卢尔用过敲脑壳吗？
        - id: ch03-b13
          speakers: [beetle, mcturk, stalky]
          ensemble: chorus
          text: 你们对克卢尔用过敲脑壳吗？
        - id: ch03-b14
          speaker: narrator
          text: 问到第二十遍，供词终于出来了。
        - id: ch03-b15
          speaker: sefton
          text: 用过，该死的！
          emotion: angry
        - id: ch03-b16
          speaker: stalky
          text: 那你们就得挨敲。
        - id: ch03-b17
          speaker: narrator
          text: 他们立刻照着古老的经验敲了起来。这不是装样子，也不是闹着玩。就算旧日的茉莉费尔伯恩亲自来做，也未必能做得更漂亮。
        - id: ch03-b18
          speaker: stalky
          text: 你们叫克卢尔做过刷子操吗？
        - id: ch03-b19
          speaker: narrator
          text: 这一次，答案来得很快。斯托基便照着表，一点也不多，一点也不少，让他们足足做了五分钟刷子操。捆绳紧紧勒着，两个人就连扭动一下也做不到。至于这种所谓刷子操，其实从头到尾根本不用刷子。
        - id: ch03-b20
          speaker: stalky
          text: 你们对克卢尔用过钥匙吗？
        - id: ch03-b21
          speaker: campbell
          text: 没有，真的没有！我发誓！
          emotion: fearful
        - id: ch03-b22
          speaker: stalky
          text: 那就让你先尝尝。以后真用上时，你就知道是什么滋味。
        - id: ch03-b23
          speaker: narrator
          text: 所谓钥匙的刑罚，其中一把真正的钥匙也没有，可它痛得厉害。两个人被牢牢捆住，除了翻滚，什么也做不了。他们勉强熬了几分钟，嘴里骂出来的话越来越难听，三个人终于只好拿手帕堵住他们的嘴。
        - id: ch03-b24
          speaker: stalky
          text: 再问下一样。你们两个抓住克卢尔的时候，给他用过开瓶钻吗？老实回答。
        - id: ch03-b25
          speaker: sefton
          text: 用过！该死的蠢货，放过我们吧！
          emotion: fearful
        - id: ch03-b26
          speaker: narrator
          text: 于是他们立刻挨了开瓶钻。这种刑罚和开瓶钻毫无关系，却比钥匙还痛。袭击一轮轮有条不紊地进行，又始终悄无声息。每一种新刑罚之间，都是一阵接一阵无情而叫人昏乱的追问。只要回答不到点子上，那条黄褐色手帕就会重新塞进他们嘴里。身体的疼痛和永远重复的问题一起压上来，两个人的神经一点一点垮了。
        - id: ch03-b27
          speaker: stalky
          text: 这就是你们对克卢尔做过的全部事情？火鸡，把布拿出来，让他们答。
        - id: ch03-b28
          speaker: campbell
          text: 是的，我发誓只有这些。斯托基，你们快把我们弄死了！
          emotion: fearful
        - id: ch03-b29
          speaker: stalky
          text: 这正是克卢尔当时对你们说的话，我亲耳听见了。现在才让你们见识真正的欺凌。塞夫顿，我最不喜欢你竖着硬领、穿着漆皮靴来到这里，还以为能教我们几手。你真觉得自己能教我们什么？把布拿出来，让他回答。
        - id: ch03-b30
          speaker: sefton
          text: 不能！
          emotion: angry
        - id: ch03-b31
          speaker: stalky
          text: 他说不能。摇他睡觉，让坎贝尔看着。
        - id: ch03-b32
          speaker: narrator
          text: 要用三个孩子和两只拳击手套，才能把一个孩子摇睡。再说一遍，这种做法和它的名字毫不相干。塞夫顿被摇得两眼发直，气也喘不上来，喉咙里只能咯咯作响。他恶心得厉害，眼前天旋地转，只能软在那里。
        - id: ch03-b33
          speaker: campbell
          text: 我的姑妈呀！
          emotion: fearful
        - id: ch03-b34
          speaker: stalky
          text: 把他收起来，换坎贝尔。这才叫欺凌。对了，坎贝尔，你为什么欺负克卢尔？把布取出来。
        - id: ch03-b35
          speaker: campbell
          text: 我不知道。求你饶了我！我发誓，咱们讲和。别摇我！
          emotion: fearful
        - id: ch03-b36
          speaker: stalky
          text: 小山羊一叫，老虎就兴奋。他说不知道。甲虫，把他架好。拳击手套给我，布也塞上。
        - id: ch03-b37
          speaker: narrator
          text: 屋里忽然安静下来，只剩身体撞动的声音。三个人不多不少，把坎贝尔结结实实地摇了六十四下。
        - id: ch03-b38
          speaker: campbell
          text: 我觉得我要死了！
          emotion: fearful
        - id: ch03-b39
          speaker: stalky
          text: 他说他要死了。把他收起来，轮到塞夫顿。对了，塞夫顿，你为什么欺负克卢尔？
        - id: ch03-b40
          speaker: narrator
          text: 塞夫顿立刻给出了回答，可那句话难听得根本无法付印。斯托基听完以后，那张还长着细细茸毛的少年脸庞，却连一丁点也没有发红。
        - id: ch03-b41
          speaker: stalky
          text: 火鸡，给他来个阿格阿格！
        - id: ch03-b42
          speaker: narrator
          text: 麦克特克马上动手，塞夫顿当场被做成了一个阿格阿格。他花了将近十八年才积攒下来的全部人生经验，本来都可以任他调用，可在这件事上，他似乎一点也不知道该怎么珍惜和运用。
        - id: ch03-b43
          speaker: stalky
          text: 他说我们是卑鄙鬼。把他收起来，换坎贝尔。坎贝尔，你为什么欺负克卢尔？
        - id: ch03-b44
          speaker: narrator
          text: 这一次，坎贝尔的神经已经疼得绷紧，滚烫的眼泪终于落了下来。他不住求饶，低声下气地许诺和平。只要三个人肯停下折磨，他再也不会碰他们一根手指。可追问又开始了，中间还夹着一点点身体上的劝说。斯托基问一句，等他答一句，再把答案认真转述给另外两个人，仿佛正在办一件最讲规矩的公事。
        - id: ch03-b45
          speaker: stalky
          text: 你好像很疼。你疼吗？
        - id: ch03-b46
          speaker: campbell
          text: 疼，疼死了！
          emotion: fearful
        - id: ch03-b47
          speaker: stalky
          text: 你服了吗？
        - id: ch03-b48
          speaker: campbell
          text: 服了！我发誓服了，快住手！
          emotion: fearful
        - id: ch03-b49
          speaker: stalky
          text: 你谦卑了吗？谦卑得要命吗？还会欺负克卢尔吗？还会欺负别人吗？原来说要给我们的那顿毒打呢？你懂欺凌吗？我们是不是教了你很多？你感激吗？
        - id: ch03-b50
          speaker: campbell
          text: 是，我谦卑得要命！我再也不欺负克卢尔，也不欺负别人。不会打你们了，我发誓！我一点也不懂。你们教了我很多，我感激！
          emotion: fearful
        - id: ch03-b51
          speaker: stalky
          text: 很好。可你为什么欺负克卢尔？
        - id: ch03-b52
          speaker: campbell
          text: 因为我是恶霸。你们要我说的就是这个吧？
          emotion: sad
        - id: ch03-b53
          speaker: stalky
          text: 他说自己是恶霸，说得没错。把他放墙角。坎贝尔的玩笑结束了。现在轮到塞夫顿。
        - id: ch03-b54
          speaker: sefton
          text: 魔鬼！你们这些小魔鬼！
          emotion: angry
        - id: ch03-b55
          speaker: narrator
          text: 几只熟练的膝盖顶住塞夫顿，把他当成一只球，从地毯这头一直踢到那头。他一边滚，一边还在叫骂，嘴里喊出来的许多话，比小魔鬼三个字难听得多。
        - id: ch03-b56
          speaker: stalky
          text: 小山羊一叫，老虎就兴奋。我们来把你打扮漂亮。你的剃须东西放在哪儿？
        - id: ch03-b57
          speaker: narrator
          text: 坎贝尔说出了地方。甲虫去取水，麦克特克打肥皂沫。
        - id: ch03-b58
          speaker: stalky
          text: 塞菲，我们替你刮胡子。最好别动，不然会割伤。我以前可没给别人刮过。
        - id: ch03-b59
          speaker: sefton
          text: 不要！求你们，千万别刮！
          emotion: fearful
        - id: ch03-b60
          speaker: stalky
          text: 变得有礼貌了？我只刮一边可爱的络腮胡。
        - id: ch03-b61
          speaker: sefton
          text: 只要不刮，我就跟你们讲和。等我起来，免掉你们那顿打，我发誓！
          emotion: fearful
        - id: ch03-b62
          speaker: stalky
          text: 还要刮掉我们引以为傲的半边小胡子。听见没有，他好心免掉我们的毒打了。
        - id: ch03-b63
          speaker: beetle
          text: 长胡子不能直接刮。得先剪短，才能动刀。
        - id: ch03-b64
          speaker: mcturk
          text: 我可不找剪刀。用火柴不行吗？他本来就是头猪，燎一燎正合适。别动！不过，只弄掉一半。
        - id: ch03-b65
          speaker: beetle
          text: 没问题。我把肥皂沫涂到正中间，剩下的一半就能烧掉。
        - id: ch03-b66
          speaker: narrator
          text: 少年人稀薄的第一撇小胡子呼地烧起来，一直烧到上唇正中的肥皂边界。斯托基用大拇指擦去烧焦的残茬。这个剃法一点也不温柔，却完全达到了目的。接着他们把塞夫顿翻过来，火柴和剃刀一齐上阵，另一边的络腮胡也没了。斯托基把剃须镜拿到他面前，又取出了堵嘴的布，等着听他开口。可是塞夫顿一句话也说不出来，只能惊恐而绝望地望着镜中那张左右残缺、极不相称的脸。两颗硕大的眼泪顺着脸颊滚下来。
        - id: ch03-b67
          speaker: stalky
          text: 塞夫顿，你为什么欺负克卢尔？
        - id: ch03-b68
          speaker: sefton
          text: 别管我！你们这些该死的恶霸，别管我！我受得还不够吗？
          emotion: sad
        - id: ch03-b69
          speaker: mcturk
          text: 他说我们必须别管他。
        - id: ch03-b70
          speaker: beetle
          text: 他还说我们是恶霸，可我们明明还没开始。塞菲真不知感恩。老天，你现在可不只是丑得一塌糊涂。
        - id: ch03-b71
          speaker: stalky
          text: 他说自己受够了。他错了。
        - id: ch03-b72
          speaker: mcturk
          text: 来，接着干！快乐的纳西索斯，可别爱上自己的倒影！
        - id: ch03-b73
          speaker: campbell
          text: 饶了他吧，他也哭了。
        - id: ch03-b74
          speaker: narrator
          text: 塞夫顿终于哭得像个十二岁的孩子。他身上的疼痛、心里的羞耻、被撕破的虚荣，还有那种彻底无能为力的感觉，一起化成眼泪，不停地流下来。
        - id: ch03-b75
          speaker: campbell
          text: 你愿意讲和，对吧，塞夫顿？你斗不过这些小魔鬼。
        - id: ch03-b76
          speaker: mcturk
          text: 亲爱的坎贝尔，别这么没礼貌，不然你还得挨。
        - id: ch03-b77
          speaker: campbell
          text: 可你们本来就是魔鬼。
        - id: ch03-b78
          speaker: stalky
          text: 就因为一点欺凌？跟你们给克卢尔的一样。你们拿他开这种玩笑有多久了，一个学期？
        - id: ch03-b79
          speaker: campbell
          text: 我们又不是一直打他！
        - id: ch03-b80
          speaker: beetle
          text: 抓得到就打，还特意四处找他。因为他是个可恶的小畜生，对吧？我还不知道这一套吗？如今你们也成了可恶的畜生，所以挨着他挨过的东西。只因为我们高兴。
        - id: ch03-b81
          speaker: campbell
          text: 我们从没真欺负他，不像你们现在这样。
        - id: ch03-b82
          speaker: beetle
          text: 呸！恶霸从来都说那不是真的欺凌。茉莉费尔伯恩也不是来真的，他只不过随便打几下。他们全这么说。只不过把人的魂从身体里踢出去，只不过逼得人躲进储物间哭，把脑袋塞进大衣里哭。一天写三封信回家，求家里赶快把自己接走。不错，你这畜生，我也干过这些事。坎贝尔，你从没真正受过欺凌。那么早就讲和，我真替你遗憾。
        - id: ch03-b83
          speaker: campbell
          text: 我可一点也不遗憾！不过你小心些，别再那么打了，你真的快把塞夫顿打死了。
        - id: ch03-b84
          speaker: narrator
          text: 甲虫一激动，想也不想就挥起门柱，这时候塞夫顿已经大声求饶。甲虫忽然转身问他，来这里以前到底在哪儿上学。塞夫顿结结巴巴地说，自己有个家庭教师。甲虫一听更有把握了。这个人这辈子从没挨过欺凌，也从没这样哭过。塞夫顿侧身倒在地上，泪痕从干掉的肥皂沫上犁出两道沟。门柱啪的一声，又落在他弯曲的身体上。
        - id: ch03-b85
          speaker: beetle
          text: 你说我瞎，还说我是畜生。那就先说眼睛。我看得见吗？我的眼睛漂亮吗？是温柔的淡褐色，对不对？
        - id: ch03-b86
          speaker: sefton
          text: 你看得见，我发誓！眼睛很漂亮，是淡褐色！
          emotion: fearful
        - id: ch03-b87
          speaker: beetle
          text: 骗子！明明是天蓝色。是不是天蓝色？
        - id: ch03-b88
          speaker: sefton
          text: 是，是天蓝色！
          emotion: fearful
        - id: ch03-b89
          speaker: beetle
          text: 你的主意一分钟一变，得好好学学。
        - id: ch03-b90
          speaker: stalky
          text: 你真动火了，甲虫。别急。
        - id: ch03-b91
          speaker: beetle
          text: 我也受过这一套。现在再说说，你为什么骂我是畜生。
        - id: ch03-b92
          speaker: sefton
          text: 讲和！我认输！放过我，我服了，我受不了！
          emotion: fearful
        - id: ch03-b93
          speaker: mcturk
          text: 呸，我们才刚上手。
        - id: ch03-b94
          speaker: beetle
          text: 他们当初肯定没放过克卢尔。
        - id: ch03-b95
          speaker: stalky
          text: 认罪，道歉，快！
        - id: ch03-b96
          speaker: narrator
          text: 塞夫顿躺在地板上无条件投降。他认了罪，也道了歉，姿态甚至比坎贝尔还要卑微。他保证从此再也不碰任何人一根手指，这辈子都会小心谨慎、温顺老实地过日子。
        - id: ch03-b97
          speaker: stalky
          text: 看来非接受不可。好，塞夫顿，你服了。甲虫住手。不过放你们以前，你和坎贝尔得照克卢尔那样，唱一首《科勒雷恩的凯蒂》。
        - id: ch03-b98
          speaker: campbell
          text: 这不公平，我们已经投降了。
        - id: ch03-b99
          speaker: stalky
          text: 正因为投降了，才得照我们说的做。克卢尔也会照做。要是不投降，那才要真正受欺凌。现在唱颂歌，赞美征服者，快点。
        - id: ch03-b100
          speakers: [campbell, sefton]
          ensemble: duo
          text: 美丽的凯蒂，清晨一路轻盈走来，提着一罐牛奶，走向集市……
          emotion: sad
        - id: ch03-b101
          speaker: narrator
          text: 三位征服者舒舒服服地坐进椅子。坎贝尔和塞夫顿彼此看了一眼，可谁也没能从对方那副狼狈模样里找到一点安慰。他们只得照克卢尔刚才的样子，唱完那支《科勒雷恩的凯蒂》。歌声像一阵凄惨的哀号。
        - id: ch03-b102
          speaker: stalky
          text: 唱得坏透了。要是你们没投降，我们就有痛苦的责任拿书砸你们，罚你们唱走调。好了，起来吧。
        - id: ch03-b103
          speaker: narrator
          text: 斯托基解开了两个人的绳子，可被捆了那么久以后，他们的四肢一时根本不听使唤，过了好几分钟仍站不起来。坎贝尔先勉强起身，脸上挤出一个笑。塞夫顿则踉踉跄跄走到桌边，把头埋进臂弯，抽泣得浑身发抖。两个人身上一点斗志也没有了，只剩下惊愕、疼痛和羞耻。
        - id: ch03-b104
          speaker: campbell
          text: 能不能让他在喝茶前把胡子刮干净？求你了。再过十分钟就打铃。
        - id: ch03-b105
          speaker: narrator
          text: 斯托基摇了摇头。他原本打算亲自押着这个只刮了半边脸的人去吃饭，让他就这样走进饭厅。麦克特克坐在椅子里不停打哈欠，甲虫忙着擦脸。方才那场劝化既让人兴奋，也很费力，三个人全都汗流浃背。
        - id: ch03-b106
          speaker: stalky
          text: 我要是懂这方面的事，一定给你们上一堂道德课。
        - id: ch03-b107
          speaker: mcturk
          text: 别唠叨，他们已经投降了。这种道德劝化可真耗人。
        - id: ch03-b108
          speaker: stalky
          text: 你们没看出我们有多温和吗？我们本来可以叫克卢尔进来，让他亲眼看看你们。也可以把整件事告诉学校里的几个家伙。那样你们不管走到哪里，都会有人在后面起哄，你们的日子也就没法过了。可这些事我们一样也不做。我们是严格的道德劝化者。所以，只要你们两个不往外说，别人就永远不会知道。
        - id: ch03-b109
          speaker: campbell
          text: 我发誓，你真是个好汉。我想，我对克卢尔确实相当残忍。
        - id: ch03-b110
          speaker: stalky
          text: 看起来是这样。不过塞菲不用歪着胡子进饭厅。他可以刮干净。你感激吗，塞夫顿？
        - id: ch03-b111
          speaker: narrator
          text: 埋在臂弯里的脑袋没有抬起来，也没有回答。三个人凑近一看，才发现塞夫顿已经沉沉睡着了。一声鼾从胳膊底下传出来，鼾声里面竟然还混着没有止住的抽泣。
        - id: ch03-b112
          speaker: mcturk
          text: 这倒奇怪。我看他不是厚脸皮，就是装睡。
        - id: ch03-b113
          speaker: beetle
          text: 不是装的。茉莉费尔伯恩收拾我一个钟头左右以后，我有时也会倒在一张长凳上，砰的一下就睡过去，身体根本撑不住。可怜的魔鬼！不过，谁叫他刚才骂我是个可恶的诗人。
        - id: ch03-b114
          speaker: stalky
          text: 好了，走吧。再见，坎贝尔。记住，你不说，就没人会知道。
        - id: ch03-b115
          speaker: narrator
          text: 按说这时候该跳一场胜利的战舞，像斯托基想出计策时那样来回跳上几趟。可三个人实在累坏了，谁也提不起腿。回到自己的自修室以后，他们几乎趴在茶杯上睡着，连喝茶和庆祝的力气都没有。他们就这样昏昏沉沉地一直睡到晚自习。
    - id: ch04
      title: 道德改革家
      blocks:
        - id: ch04-b01
          speaker: headmaster
          text: 这封信离奇得不能再离奇。天下父母都无可救药地疯了吗？你看她到底是什么意思？
        - id: ch04-b02
          speaker: narrator
          text: 校长把一封密密麻麻写了八页的信递给约翰牧师。
        - id: ch04-b03
          speaker: chaplain
          text: 信上说，他是母亲唯一的儿子，而且母亲还是寡妇。最不讲道理的就是这一类。要是这八页指控里有一半是真的，他现在就应该躺在医务室里。可他身体好得叫人生气，怎么看也不像受了那么重的伤。倒是确实刮了胡子，这一点我亲眼注意到了。
        - id: ch04-b04
          speaker: headmaster
          text: 他母亲说，那胡子是别人逼他刮的。多么可爱，又多么有益！
        - id: ch04-b05
          speaker: chaplain
          text: 反正不用你亲自给她回信。我在这所学校里待着，平常很少不知道各个角落出了什么事，可这一回，我确实怎么也猜不出来。
        - id: ch04-b06
          speaker: headmaster
          text: 要我说，别想安抚她。既然我们非收那些补习班来的小狗不可……
        - id: ch04-b07
          speaker: chaplain
          text: 今天上午，他来我这里加课，身体很好，而且格外规矩。
        - id: ch04-b08
          speaker: headmaster
          text: 那么事情很简单。既然我们不得不收这些补习班来的小狗，要么由他们来教育这所学校，要么由学校来教育他们。这一回显然是学校教育了他们。我还是更喜欢我们自己的办法。
        - id: ch04-b09
          speaker: chaplain
          text: 你认为事情是这样？
        - id: ch04-b10
          speaker: headmaster
          text: 我敢肯定。而且他企图败坏学校的名声，无论如何也不能原谅。
        - id: ch04-b11
          speaker: chaplain
          text: 我正准备抓住这一点跟他谈。
        - id: ch04-b12
          speaker: narrator
          text: 两位自以为已经猜中全部真相的占卜官隔着那封密密麻麻的八页长信，显得十分满意，彼此心照不宣，又轻轻眨了眨眼睛。
        - id: ch04-b13
          speaker: narrator
          text: 几天以后，事情已经安静下来。约翰牧师选好时机，又敲开五号自修室的门，来看他的第十军团。
        - id: ch04-b14
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 神父，您怎么一直没来？
        - id: ch04-b15
          speaker: chaplain
          text: 我一直在观察时机、季节、事件和人，当然，还有孩子。如今我对自己的第十军团非常满意，所以特地来向他们致意。今天早上上课，克卢尔一个字的功课也没做，反倒在教室里扔起墨水团。为了这种闻所未闻的胆大妄为，他现在正在罚抄五十行。
        - id: ch04-b16
          speaker: beetle
          text: 这可不能怪我们。是您叫我们除掉那股压力的。低年级生就是这么麻烦。
        - id: ch04-b17
          speaker: chaplain
          text: 我还见过比他大五岁的学生扔墨水团。就在不久前，我罚过那么一个人抄两百行。说起来，那些罚抄后来交了吗？
        - id: ch04-b18
          speaker: beetle
          text: 交了吗，火鸡？
        - id: ch04-b19
          speaker: stalky
          text: 神父，先别追究那两百行。您难道没觉得，克卢尔现在看上去比从前干净了一点吗？
        - id: ch04-b20
          speaker: mcturk
          text: 我们真是一群了不起的道德改革家。
        - id: ch04-b21
          speaker: beetle
          text: 全是斯托基干的。不过，这玩笑确实有趣。
        - id: ch04-b22
          speaker: chaplain
          text: 我已经注意到了，不只是克卢尔，好几个角落里都发生了道德改革。我不是早就告诉过你们吗？只要你们肯认真用自己的影响力，你们三个人比学校里任何别的孩子都更有影响。
        - id: ch04-b23
          speaker: stalky
          text: 经常动用影响力有点累，至少用我们这套道德劝化法很累。再说，您看，它只让克卢尔越来越放肆。
        - id: ch04-b24
          speaker: chaplain
          text: 我想的不是克卢尔。我想的是另外那些人，斯托基。
        - id: ch04-b25
          speaker: mcturk
          text: 我们没在另外那些人身上费多少事，对吧？
        - id: ch04-b26
          speaker: chaplain
          text: 可我从一开始就在他们身上费了心。
        - id: ch04-b27
          speaker: stalky
          text: 这么说，先生，您知道？
        - id: ch04-b28
          speaker: narrator
          text: 约翰牧师没有马上作答，只把一口烟慢慢向下喷去。那烟落在三个人中间，他这才继续开口。
        - id: ch04-b29
          speaker: chaplain
          text: 人们常说，孩子彼此教育起来，比我们这些教师能够做的、或者胆敢去做的还要多。假如我用上了你们也许用过、也许根本没用过的那些道德劝化手段的一半，那事情会变成什么样呢？
        - id: ch04-b30
          speaker: mcturk
          text: 全是出于世上最好的动机。神父，可别忘了我们虔诚的动机。
        - id: ch04-b31
          speaker: chaplain
          text: 那我现在就该在比迪福德监狱里受苦了，对不对？借用校长在一件我们已经约好忘掉的小事里说过的话，这在我看来，是明目张胆的不公。你们这些小罪人笑什么？难道我说得不是真的吗？我可不打算留下来挨你们叫嚷。我往这座罪恶洞穴里探头，只是想问一句，有没有人肯跟我到山脊下面去游泳。不过看你们的样子，大概是不肯了。
        - id: ch04-b32
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: 谁说不肯！等半眨眼，神父老爷！我们拿上毛巾，就跟您一起去！
          emotion: happy
