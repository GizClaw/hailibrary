  chapters:
    - id: ch01
      title: The Tenth Legion
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was no hiding the defeat. Prout had won, though Number Five did not begrudge him the victory. He had broken their rules by bringing in the Head, but they had enjoyed the fight while it lasted.
        - id: ch01-b02
          speaker: narrator
          text: The Reverend John soon came to talk it over. At this school the masters' rooms stood among the boys' studies and classrooms, so an unmarried master could know a great deal about the boys if he cared to. Number Five had tested the chaplain for years. He always knocked before entering, behaved like a guest, never preached at them, and never used a private confidence in official business. Prout was a nuisance, King came only to punish, and even gentle Hartopp remembered that he was a master. The Reverend John was different. Number Five loved to see him.
        - id: ch01-b03
          speaker: narrator
          text: He sat in their only armchair with a bent briar pipe between his teeth. His chin rested in folds above his clerical collar, and he puffed like a friendly whale while the boys explained life as they saw it, especially their recent interview with the Head about moneylending.
        - id: ch01-b04
          speaker: chaplain
          text: One good licking every week would improve you enormously. Still, as you say, you were entirely in the right.
        - id: ch01-b05
          speaker: narrator
          text: His eyes twinkled, and his whole body shook with laughter.
        - id: ch01-b06
          speaker: stalky
          text: Rather, Padre! We could have proved it too, if he'd allowed us to speak. But he wouldn't. The Head's a knowing old bird.
        - id: ch01-b07
          speaker: chaplain
          text: He understands you perfectly. And you certainly worked hard enough to earn that licking.
        - id: ch01-b08
          speaker: beetle
          text: But he's awfully fair. He doesn't thrash a fellow in the morning and preach at him in the afternoon.
        - id: ch01-b09
          speaker: mcturk
          text: He can't. He isn't ordained, thank goodness.
        - id: ch01-b10
          speaker: narrator
          text: Number Five had strong opinions about clergymen who were also headmasters, and they were always ready to argue the matter with their own pastor.
        - id: ch01-b11
          speaker: chaplain
          text: Nearly every other school has a clergyman for its Head.
        - id: ch01-b12
          speaker: stalky
          text: That's not fair on the boys. It makes them sulky. You're different, sir. You belong to the school, just as we do. I mean ordinary clergymen.
        - id: ch01-b13
          speaker: chaplain
          text: I'm a very ordinary clergyman. And Mr. Hartopp is ordained too.
        - id: ch01-b14
          speaker: beetle
          text: Yes, but he took Orders after he came here. We saw him go up for the examination, so that's all right. Just imagine if the Head went and got ordained!
        - id: ch01-b15
          speaker: chaplain
          text: What would happen then, Beetle?
        - id: ch01-b16
          speaker: beetle
          text: The school would fall to pieces within a year, sir. There's no question about it.
        - id: ch01-b17
          speaker: chaplain
          text: And how do you know that?
        - id: ch01-b18
          speaker: narrator
          text: The Reverend John was smiling.
        - id: ch01-b19
          speaker: stalky
          text: We've been here almost six years. There aren't many things about the school we don't know. Why, you arrived the term after I did, sir. I remember your first lesson, when you asked our names. Only King, Prout, and the Head have been here longer than us, in that sense.
        - id: ch01-b20
          speaker: chaplain
          text: Yes, the Common-room has changed a great deal.
        - id: ch01-b21
          speaker: beetle
          text: They came, and then they went away to get married. Good riddance too!
        - id: ch01-b22
          speaker: chaplain
          text: So our Beetle disapproves of marriage?
        - id: ch01-b23
          speaker: beetle
          text: Don't tease me, Padre. I've met boys during the holidays who have married housemasters. It's awful. They have babies and teething and measles right inside the school. Then the masters' wives hold tea parties and invite the boys to breakfast. Tea parties, Padre!
        - id: ch01-b24
          speaker: stalky
          text: That part doesn't matter so much. The trouble is that those housemasters leave their houses alone and let the prefects manage everything. One boy told me his school had thick doors and a passage about a mile long between the boys' house and the master's private house. The boys could do anything they liked.
        - id: ch01-b25
          speaker: chaplain
          text: Satan rebuking sin, with a vengeance.
        - id: ch01-b26
          speaker: stalky
          text: Larks are all right. You know what we mean, Padre. Things get worse and worse until there's a tremendous scandal. It reaches the newspapers, and a lot of boys are expelled.
        - id: ch01-b27
          speaker: mcturk
          text: Always the wrong boys. Don't forget that. Cocoa, Padre?
        - id: ch01-b28
          speaker: narrator
          text: McTurk lifted the kettle.
        - id: ch01-b29
          speaker: chaplain
          text: No, thank you. I'm smoking. Always the wrong boys, you say? Continue, my Stalky.
        - id: ch01-b30
          speaker: stalky
          text: Then everyone cries, Who would have thought it? What shocking, wicked boys! I say it all starts with married housemasters.
        - id: ch01-b31
          speaker: chaplain
          text: A Daniel has come to judgment.
        - id: ch01-b32
          speaker: mcturk
          text: But it does start there. Boys have told me the same thing. A separate house and a nice lady in charge look lovely to parents. In truth, the master gets distracted, the prefects get far too much power, and the whole house goes rotten. Besides, this isn't an ordinary school. We accept the boys rejected by crammers as well as good little boys like Stalky. We have to, if we're going to build our name, and somehow we get them into Sandhurst.
        - id: ch01-b33
          speaker: chaplain
          text: True, Turkey. You speak like a book.
        - id: ch01-b34
          speaker: mcturk
          text: So we need a different kind of master from other schools, don't we? We aren't like them.
        - id: ch01-b35
          speaker: beetle
          text: A boy told me that married houses lead to all kinds of bullying too.
        - id: ch01-b36
          speaker: chaplain
          text: I admit that you three need most of one unmarried man's time. But don't you ever feel that the Common-room is too close to you?
        - id: ch01-b37
          speaker: stalky
          text: Not really, at least in summer. Our boundaries are large, and they leave us alone a good deal.
        - id: ch01-b38
          speaker: chaplain
          text: Yet here I am in your study, getting in your way.
        - id: ch01-b39
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: You aren't in the way, Padre. Please stay, sir. We're always glad when you come.
        - id: ch01-b40
          speaker: narrator
          text: Their voices were plainly sincere. The Reverend John colored with pleasure and filled his pipe again.
        - id: ch01-b41
          speaker: beetle
          text: Besides, we generally know where the Common-room is. You came through our lower dormitories after ten last night, didn't you, sir?
        - id: ch01-b42
          speaker: chaplain
          text: I went to smoke with your housemaster. I didn't tell him anything about you. I merely took a shortcut through the dormitories.
        - id: ch01-b43
          speaker: beetle
          text: I smelled tobacco this morning. Yours is stronger than Prout's, so I knew.
        - id: ch01-b44
          speaker: chaplain
          text: Good heavens!
        - id: ch01-b45
          speaker: narrator
          text: He spoke absently. Years passed before Beetle understood that this was less a tribute to his observation than to his innocence. The long, bright dormitories had no inner doors. Masters crossed them at every hour while visiting one another, because bachelors stayed awake later than married men. Beetle had never guessed that this constant traffic might also keep watch over the boys.
        - id: ch01-b46
          speaker: chaplain
          text: We were speaking of bullying. You three suffered badly when you were fags, didn't you?
        - id: ch01-b47
          speaker: beetle
          text: We must have been awful little creatures then. But what bullies they were! Fairburn, Gobby Maunsell, and that whole gang.
        - id: ch01-b48
          speaker: stalky
          text: Remember when Gobby called us the Three Blind Mice? He made us stand on the lockers and sing while he threw inkpots at us. Those fellows really were bullies.
        - id: ch01-b49
          speaker: mcturk
          text: There's none of that now.
        - id: ch01-b50
          speaker: chaplain
          text: That is where you're mistaken. We all like to believe everything is fine once we are no longer being hurt. Sometimes I wonder whether bullying has truly disappeared.
        - id: ch01-b51
          speaker: beetle
          text: The little boys bully one another horribly, but the upper forms are studying for examinations. They have other things to think about.
        - id: ch01-b52
          speaker: stalky
          text: Why? What have you noticed?
        - id: ch01-b53
          speaker: narrator
          text: Stalky watched the chaplain's face.
        - id: ch01-b54
          speaker: chaplain
          text: I have doubts. Honestly, for three fairly intelligent boys, you notice remarkably little. Last week you were living in the form-rooms, too busy tormenting your housemaster to see what was under your noses.
        - id: ch01-b55
          speaker: beetle
          text: What do you mean, sir? I swear we saw nothing.
        - id: ch01-b56
          speaker: chaplain
          text: Then start looking. When a small boy whimpers in corners, wears his clothes like rags, never works, and is famous as the dirtiest little warning in the school, something is wrong.
        - id: ch01-b57
          speaker: mcturk
          text: You mean Clewer.
        - id: ch01-b58
          speaker: chaplain
          text: Yes. He comes to me for French. This is his first term. He isn't naturally quick, but someone has hammered him until he's almost an idiot.
        - id: ch01-b59
          speaker: beetle
          text: Oh, no. Little boys pretend to be stupid so they won't get more punishments. I know that trick.
        - id: ch01-b60
          speaker: chaplain
          text: I have never actually seen anyone hurt him.
        - id: ch01-b61
          speaker: beetle
          text: A real bully never does it before witnesses. Fairburn never touched me when anyone was watching.
        - id: ch01-b62
          speaker: mcturk
          text: Don't boast, Beetle. We all took our share.
        - id: ch01-b63
          speaker: beetle
          text: I took more than anyone. If you need an expert on bullying, Padre, ask me. Corkscrews, brush-drill, the Key, head-knuckling, arm-twisting, rocking, Ag Ags. I know all of it.
        - id: ch01-b64
          speaker: chaplain
          text: I do need your expertise. More exactly, I need your authority to stop it. All three of you.
        - id: ch01-b65
          speaker: mcturk
          text: Why not ask Harrison and Craye? Abana and Pharpar are Prout's favorites. We aren't even sub-prefects.
        - id: ch01-b66
          speaker: chaplain
          text: I considered that. But most bullying begins with thoughtlessness.
        - id: ch01-b67
          speaker: mcturk
          text: It does not. Bullies enjoy it. They plan it during lessons and practice it in the dormitories.
        - id: ch01-b68
          speaker: chaplain
          text: Never mind. Taking this to the prefects might cause another house quarrel, and you've had one already. Listen instead of laughing. I ask my own Tenth Legion to handle it quietly. Make Clewer reasonably clean, decent, and able to respect himself.
        - id: ch01-b69
          speaker: stalky
          text: I'm certainly not washing him.
        - id: ch01-b70
          speaker: narrator
          text: Stalky whispered it under his breath.
        - id: ch01-b71
          speaker: chaplain
          text: As for the other boy, whoever he is, use your influence in any way you please to discourage him. That is all. I leave it with you. Good night, my children.
    - id: ch02
      title: The Bleating of the Kid
      blocks:
        - id: ch02-b01
          speaker: stalky
          text: Well, what are we going to do?
        - id: ch02-b02
          speaker: narrator
          text: The three stared at one another after the chaplain left.
        - id: ch02-b03
          speaker: beetle
          text: Young Clewer would give anything for somewhere quiet. Suppose we made him our study fag?
        - id: ch02-b04
          speaker: mcturk
          text: No. He's a filthy little brute. He'd ruin everything, and we aren't having any sentimental school-story nonsense. Do you want to walk around with your arm around his neck?
        - id: ch02-b05
          speaker: beetle
          text: He could clean the jam jars, at least. And that burned porridge pan is disgusting.
        - id: ch02-b06
          speaker: stalky
          text: Not good enough. We only need to find the merry joker who's bullying him and make that fellow happy. But why didn't we see anything while we were living in the form-rooms?
        - id: ch02-b07
          speaker: beetle
          text: Perhaps a whole group of little boys has turned against Clewer. That happens sometimes.
        - id: ch02-b08
          speaker: mcturk
          text: Then we'll kick every junior in the house until we find the right one. Come on.
        - id: ch02-b09
          speaker: stalky
          text: Keep calm. We mustn't make a public affair of it. Whoever is doing this has been quiet, or we'd have noticed. We'll walk around and sniff until we're certain.
        - id: ch02-b10
          speaker: narrator
          text: They searched every house form-room and accounted for each junior and senior they suspected. At Beetle's suggestion, they inspected the washrooms and box-rooms too. They looked wherever a frightened small boy might have hidden and wherever an older boy might have worked mischief unseen. Nothing appeared wrong. Everyone seemed present except Clewer.
        - id: ch02-b11
          speaker: stalky
          text: That's odd. Good gracious!
        - id: ch02-b12
          speaker: narrator
          text: He stopped outside a study door. A thin, tearful voice came through the panels.
        - id: ch02-b13
          speaker: clewer
          text: As beautiful Kitty one morning was tripping.
        - id: ch02-b14
          speaker: sefton
          text: Louder, you little devil, or I'll throw a book at you!
        - id: ch02-b15
          speaker: clewer
          text: With a pitcher of milk. Oh, Campbell, please don't! To the fair of...
        - id: ch02-b16
          speaker: narrator
          text: A book struck something soft, and Clewer squealed.
        - id: ch02-b17
          speaker: beetle
          text: I never guessed it was a study boy. That explains why we missed it. Sefton and Campbell are big fellows to tackle, and we can't simply walk into their study as we could enter a form-room.
        - id: ch02-b18
          speaker: mcturk
          text: What swine. Where is the fun in that? Clewer must be fagging for them.
        - id: ch02-b19
          speaker: stalky
          text: At least they aren't prefects. Sefton and Campbell. Campbell and Sefton. One of them is a crammer's pup.
        - id: ch02-b20
          speaker: narrator
          text: Both were hairy, early-grown youths of seventeen or eighteen. Despairing parents had sent them to the school in hope that six months of hard preparation might squeeze them into Sandhurst. Officially they belonged to Prout's house, but the Head watched them himself. Since he never made strange newcomers prefects, they believed the school had wronged them. Sefton had spent three months with a London crammer and improved every tale he told about it. Campbell had expensive clothes and a ready vocabulary. He followed Sefton's example and looked down on everyone else. This was only their second term. The school knew the type it called crammers' pups and had greeted them with a reserve they found insulting. Still, their whiskers and mustaches impressed the younger boys beyond question. Sefton even owned a real razor, a magnificent proof of manhood in his own eyes.
        - id: ch02-b21
          speaker: mcturk
          text: Shall we go in and discourage them? I hardly know them, but I would wager Campbell is a coward.
        - id: ch02-b22
          speaker: stalky
          text: No. That's too direct. I prefer doing things indirectly. Besides, where would our moral influence be then?
        - id: ch02-b23
          speaker: beetle
          text: Rubbish. What are you planning?
        - id: ch02-b24
          speaker: narrator
          text: Beetle turned into the empty Lower Number Nine form-room next door.
        - id: ch02-b25
          speaker: stalky
          text: Me? I want to play with them. Be quiet while I think.
        - id: ch02-b26
          speaker: narrator
          text: Stalky pushed his hands into his pockets and stared through the window at the sea. He whistled between his teeth. Then one foot began tapping. His shoulder lifted, he spun around, and he started his short, quick double-shuffle, the war-dance he performed whenever a plan was forming. Three times he crossed the room with tight lips, wide nostrils, and a marching sway. Then he stopped before silent Beetle and gently rapped his knuckles on Beetle's head. Beetle bowed beneath each tap. McTurk held one knee and rocked. Through the wall, Clewer howled as if his heart were breaking.
        - id: ch02-b27
          speaker: stalky
          text: Beetle will be the sacrifice. I'm sorry, Beetle. Remember Galton's Art of Travel, and the kid whose bleating attracted the tiger?
        - id: ch02-b28
          speaker: beetle
          text: Oh, curse it. Must I? I've been the sacrifice before. Can't you manage without me?
        - id: ch02-b29
          speaker: stalky
          text: Afraid not, dear Beetle. Turkey and I must bully you. The louder you howl, the better. Turkey, find a stump and some box-rope. We'll tie him up for the kill, Galton-fashion. Remember when Molly Fairburn made us cock-fight barefoot and tied our knees?
        - id: ch02-b30
          speaker: beetle
          text: That hurt like sin.
        - id: ch02-b31
          speaker: stalky
          text: Of course it did. You're very clever, Beetle. Turkey will knock you all over the room. Remember, we three have quarreled, and I've tricked you into this. Give me your handkerchief.
        - id: ch02-b32
          speaker: narrator
          text: They trussed Beetle for cock-fighting, with a stump set across the bends of his elbows and knees. Then they tied his knees together with box-rope. One push from Stalky rolled him sideways through the dust.
        - id: ch02-b33
          speaker: stalky
          text: Mess up his hair, Turkey. Now get down beside him. You two are so furious with me that you can only swear. I'll stir you up with another stump. Beetle, you'll have to cry.
        - id: ch02-b34
          speaker: beetle
          text: Right. Give me half a moment and I'll work myself into it.
        - id: ch02-b35
          speaker: stalky
          text: Begin. Remember, the bleating of the kid excites the tiger.
        - id: ch02-b36
          speaker: beetle
          text: Stop, you brutes! Let me up! You've nearly cut my knees off. You filthy cads, stop it! This isn't a joke!
        - id: ch02-b37
          speaker: narrator
          text: His protest was a fine piece of acting.
        - id: ch02-b38
          speaker: stalky
          text: Give it to him, Turkey! Kick him and roll him over! Kill him! Don't lose your nerve, Beetle. Kick him again, Turkey!
        - id: ch02-b39
          speaker: mcturk
          text: He isn't truly crying. Roll over properly, Beetle, or I'll kick you into the fireplace!
        - id: ch02-b40
          speaker: narrator
          text: The three made a dreadful noise, and the bait drew their prey.
        - id: ch02-b41
          speaker: sefton
          text: Hallo! What's this splendid joke?
        - id: ch02-b42
          speaker: narrator
          text: Sefton and Campbell entered. Beetle lay on his side with his head against the fender, weeping freely, while McTurk prodded his back with a foot.
        - id: ch02-b43
          speaker: stalky
          text: It's only Beetle. He's pretending to be hurt, and I can't make Turkey attack him properly.
        - id: ch02-b44
          speaker: narrator
          text: Sefton kicked both bound boys at once, and his face brightened.
        - id: ch02-b45
          speaker: sefton
          text: I'll take care of them. Get up and cock-fight, both of you. Give me that stump and I'll teach them. Come on, Campbell. Let's cook them.
        - id: ch02-b46
          speaker: narrator
          text: McTurk turned on Stalky with a stream of abuse.
        - id: ch02-b47
          speaker: mcturk
          text: You promised you'd cock-fight too, Stalky. Come on!
        - id: ch02-b48
          speaker: stalky
          text: Then you were an ass to believe me!
        - id: ch02-b49
          speaker: campbell
          text: Have you fellows quarreled?
        - id: ch02-b50
          speaker: stalky
          text: Quarreled? I'm educating them. Seffy, do you know anything about cock-fighting?
        - id: ch02-b51
          speaker: sefton
          text: Do I know? At Maclagan's crammer in London we cock-fought in his drawing-room, and little Maclagan never dared object. Of course, we were treated like men there. I'll show you how it's done.
        - id: ch02-b52
          speaker: beetle
          text: Can't I get up now?
        - id: ch02-b53
          speaker: narrator
          text: Stalky sat on Beetle's shoulder.
        - id: ch02-b54
          speaker: stalky
          text: Stop complaining, you fat idiot. You're going to fight Seffy.
        - id: ch02-b55
          speaker: beetle
          text: He'll kill me!
        - id: ch02-b56
          speaker: campbell
          text: Drag them into our study. It's quiet there. I'll fight Turkey. This is much better than young Clewer.
        - id: ch02-b57
          speaker: sefton
          text: Agreed. Shoes off for them, shoes on for us.
        - id: ch02-b58
          speaker: narrator
          text: McTurk and Beetle were thrown onto the study floor, and Stalky rolled them behind an armchair.
        - id: ch02-b59
          speaker: stalky
          text: I'll tie you two and direct the bullfight. Good gracious, Seffy, your wrists are too thick for a handkerchief. Have you any box-rope?
        - id: ch02-b60
          speaker: sefton
          text: Plenty in the corner. Hurry. Stop sniveling, Beetle. This will be a glorious campaign. The losers must sing songs praising the winners. You claim to be a poet, Beetle. I'll give you poetry.
        - id: ch02-b61
          speaker: narrator
          text: Sefton wriggled into place beside Campbell. Stalky swiftly pushed the stumps through the bends of their arms and knees, then tied their wrists with stretched box-rope. Behind the chair, McTurk kept up a storm of insults, sounding bound, betrayed, and furious. When Campbell and Sefton were helpless, Stalky crossed to his friends and locked the study door.
        - id: ch02-b62
          speaker: stalky
          text: There. Everything is ready.
        - id: ch02-b63
          speaker: sefton
          text: What the devil are you doing?
        - id: ch02-b64
          speaker: narrator
          text: Beetle's false tears stopped at once. McTurk rose behind the chair with a smile. Together, they tightened the ropes around their enemies' knees and ankles until escape was impossible. Stalky drew the armchair into position, sat down, and admired the whole scene with his mildest smile. Nothing in the world is much more helpless than a boy trussed for cock-fighting. Sefton and Campbell had walked eagerly into the trap and supplied the rope themselves.
        - id: ch02-b65
          speaker: stalky
          text: The bleating of the kid excites the tiger. Oh, you marvelous asses!
        - id: ch02-b66
          speaker: narrator
          text: He leaned back and laughed until he had no breath left. The prisoners understood very slowly.
    - id: ch03
      title: Moral Suasion
      blocks:
        - id: ch03-b01
          speaker: sefton
          text: When we get loose, we'll give you the finest licking of your lives! You won't laugh then. What the deuce is this supposed to mean?
          emotion: angry
        - id: ch03-b02
          speaker: mcturk
          text: You'll understand in a moment. And stop swearing. We want to know why two hulking swine like you have been bullying Clewer.
        - id: ch03-b03
          speaker: sefton
          text: That's none of your business.
        - id: ch03-b04
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Why did you bully Clewer?
        - id: ch03-b05
          speaker: narrator
          text: Each boy asked the same question in turn, over and over, with maddening sameness. They understood the work.
        - id: ch03-b06
          speaker: sefton
          text: Because we chose to! Now let us up.
        - id: ch03-b07
          speaker: narrator
          text: Even then, Sefton and Campbell did not grasp the game.
        - id: ch03-b08
          speaker: stalky
          text: Then we'll bully you because we choose to. We'll be exactly as fair as you were to Clewer. He was helpless against you, and you're helpless against us. Curious, isn't it?
        - id: ch03-b09
          speaker: sefton
          text: Helpless? Wait until we get free.
        - id: ch03-b10
          speaker: beetle
          text: That proves no one has ever properly played with you. A public thrashing is nothing beside a quiet joke like this. I bet a shilling you'll cry and promise us anything.
        - id: ch03-b11
          speaker: sefton
          text: Listen, young Beetle. When I get up, I'll half kill you. I promise you that.
          emotion: angry
        - id: ch03-b12
          speaker: beetle
          text: You'll be half killed first. Did you give Clewer head-knuckles?
        - id: ch03-b13
          speaker: mcturk
          text: Did you give Clewer head-knuckles?
        - id: ch03-b14
          speaker: narrator
          text: The one unchanging question came twenty times. No boy can endure that essential torment of bullying forever.
        - id: ch03-b15
          speaker: sefton
          text: We did, confound you!
        - id: ch03-b16
          speaker: stalky
          text: Then we'll knuckle you.
        - id: ch03-b17
          speaker: narrator
          text: They did it with all the skill they had learned in their own miserable early years. Each knew exactly where the pain lay and exactly how a bully kept it going. Head-knuckling was no small matter, and Molly Fairburn himself could hardly have improved their method.
        - id: ch03-b18
          speaker: beetle
          text: Did you give Clewer brush-drill?
        - id: ch03-b19
          speaker: narrator
          text: This confession came sooner. Stalky timed five minutes by his watch while they delivered brush-drill, a punishment that used no brush. Bound as they were, the victims could not even twist away.
        - id: ch03-b20
          speaker: mcturk
          text: Did you give Clewer the Key?
        - id: ch03-b21
          speaker: campbell
          text: No, we didn't! I swear we never did!
          emotion: fearful
        - id: ch03-b22
          speaker: stalky
          text: Then we'll show you what it would have felt like if you had.
        - id: ch03-b23
          speaker: narrator
          text: The torture called the Key involved no key at all, but it hurt intensely. After several minutes, their language grew so wild that the boys gagged them.
        - id: ch03-b24
          speaker: beetle
          text: Did you give Clewer corkscrews?
        - id: ch03-b25
          speaker: sefton
          text: Yes! Curse your stupid souls! Leave us alone, you cads!
          emotion: angry
        - id: ch03-b26
          speaker: narrator
          text: So they were corkscrewed. That torture used no corkscrew, and it was worse than the Key.
        - id: ch03-b27
          speaker: narrator
          text: The careful method and silence of each attack began to break the prisoners' nerve. There was none of the cheerful noise of a school scuffle, only deliberate work. Between punishments came the same pitiless rain of questions, never changing and never allowing thought to settle. Whenever an answer wandered from the point, dirty yellow-brown handkerchiefs went back into their mouths.
        - id: ch03-b28
          speaker: stalky
          text: Is that everything you did to Clewer? Take out their gags, Turkey, and let them answer.
        - id: ch03-b29
          speaker: campbell
          text: Yes, I swear that's all. You're killing us, Stalky!
          emotion: fearful
        - id: ch03-b30
          speaker: stalky
          text: Those are the exact words Clewer used to you. I heard him. Now we'll show you what real bullying is. Sefton, you came here in high collars and shiny boots, thinking you could teach this school something. Do you believe you can teach us anything about bullying? Take out his gag.
        - id: ch03-b31
          speaker: sefton
          text: No, I don't!
          emotion: angry
        - id: ch03-b32
          speaker: stalky
          text: He says no. Rock him to sleep. Campbell may watch.
        - id: ch03-b33
          speaker: narrator
          text: Rocking a boy to sleep required three boys and two boxing gloves, though it had nothing to do with sleep. They rocked Sefton until his eyes fixed, his breath came in gasps and crows, and sickness and dizziness overcame him.
        - id: ch03-b34
          speaker: campbell
          text: My aunt!
          emotion: fearful
        - id: ch03-b35
          speaker: narrator
          text: Campbell watched from his corner and turned white.
        - id: ch03-b36
          speaker: stalky
          text: Put Sefton away and bring Campbell forward. Now this is bullying. Oh, I nearly forgot. Campbell, why did you bully Clewer? Let him answer.
        - id: ch03-b37
          speaker: campbell
          text: I don't know. Please let me off! I'll make peace, I swear. Don't rock me!
          emotion: fearful
        - id: ch03-b38
          speaker: stalky
          text: The bleating of the kid excites the tiger. He says he doesn't know. Set him up, Beetle. Give me the glove and put his gag in.
        - id: ch03-b39
          speaker: narrator
          text: Without speaking, they rocked Campbell sixty-four times.
        - id: ch03-b40
          speaker: campbell
          text: I think I'm going to die!
          emotion: fearful
        - id: ch03-b41
          speaker: stalky
          text: He thinks he's dying. Put him away and bring Sefton. Oh, I forgot. Sefton, why did you bully Clewer?
        - id: ch03-b42
          speaker: narrator
          text: Sefton's answer could not be printed, but it did not bring the faintest color to Stalky's soft young cheek.
        - id: ch03-b43
          speaker: stalky
          text: Give him an Ag Ag, Turkey.
        - id: ch03-b44
          speaker: narrator
          text: McTurk did so at once. Nearly eighteen years of painfully bought experience were now offered to Sefton, but he showed no gratitude.
        - id: ch03-b45
          speaker: mcturk
          text: He calls us sweeps. Put him away.
        - id: ch03-b46
          speaker: stalky
          text: Campbell again. And I nearly forgot. Campbell, why did you bully Clewer?
        - id: ch03-b47
          speaker: narrator
          text: Campbell's tears came then, hot and helpless. His nerves were raw, and pride had gone out of him. He appealed for mercy and promised complete peace. If they stopped, he would never raise a hand against any of them. The questions continued in the same measured voices, helped along by small physical persuasions whenever he hesitated.
        - id: ch03-b48
          speaker: stalky
          text: You seem hurt, Campbell. Are you hurt?
        - id: ch03-b49
          speaker: campbell
          text: Yes. Awfully!
          emotion: fearful
        - id: ch03-b50
          speaker: mcturk
          text: He says he's hurt. Are you broken?
        - id: ch03-b51
          speaker: campbell
          text: Yes, yes! I swear I am. Please stop!
          emotion: fearful
        - id: ch03-b52
          speaker: beetle
          text: He says he's broken. Are you humble?
        - id: ch03-b53
          speaker: campbell
          text: Yes, I am!
        - id: ch03-b54
          speaker: stalky
          text: He says he's humble. Are you extremely humble?
        - id: ch03-b55
          speaker: campbell
          text: Yes, I am extremely humble!
        - id: ch03-b56
          speaker: mcturk
          text: He says he's extremely humble. Will you bully Clewer again?
        - id: ch03-b57
          speaker: campbell
          text: No! No!
          emotion: fearful
        - id: ch03-b58
          speaker: beetle
          text: Or bully anyone else?
        - id: ch03-b59
          speaker: campbell
          text: No. I swear I won't.
        - id: ch03-b60
          speaker: stalky
          text: What about the licking you and Sefton promised us?
        - id: ch03-b61
          speaker: campbell
          text: I won't give it to you. I swear I won't!
        - id: ch03-b62
          speaker: mcturk
          text: Do you claim to know anything about bullying?
        - id: ch03-b63
          speaker: campbell
          text: No, I don't!
        - id: ch03-b64
          speaker: beetle
          text: Haven't we taught you a great deal?
        - id: ch03-b65
          speaker: campbell
          text: Yes, yes!
        - id: ch03-b66
          speaker: stalky
          text: And aren't you grateful?
        - id: ch03-b67
          speaker: campbell
          text: Yes, I am grateful!
        - id: ch03-b68
          speaker: stalky
          text: He is grateful. Put him away. Oh, I forgot. Campbell, why did you bully Clewer?
        - id: ch03-b69
          speaker: narrator
          text: Campbell began crying again.
        - id: ch03-b70
          speaker: campbell
          text: Because I was a bully. That's what you want me to say, isn't it?
          emotion: sad
        - id: ch03-b71
          speaker: stalky
          text: He says he's a bully, and he's right. Put him in the corner. No more games for Campbell. Now bring Sefton.
        - id: ch03-b72
          speaker: sefton
          text: You devils! You young devils!
          emotion: angry
        - id: ch03-b73
          speaker: narrator
          text: Sefton said much more while skillful knees punted him across the carpet.
        - id: ch03-b74
          speaker: stalky
          text: The bleating of the kid excites the tiger. We're going to make you beautiful. Campbell, where are his shaving things?
        - id: ch03-b75
          speaker: narrator
          text: Campbell told them.
        - id: ch03-b76
          speaker: stalky
          text: Beetle, bring water. Turkey, make lather. Seffy, we're going to shave you, so lie very still unless you want to be cut. I've never shaved anyone before.
        - id: ch03-b77
          speaker: sefton
          text: Don't! Please don't!
          emotion: fearful
        - id: ch03-b78
          speaker: stalky
          text: Becoming polite, are we? I only mean to remove one sweet little whisker.
        - id: ch03-b79
          speaker: sefton
          text: I'll make peace if you don't. I swear I'll forgive the licking when I get up!
          emotion: fearful
        - id: ch03-b80
          speaker: stalky
          text: And we'll take half that mustache you're so proud of. He says he'll forgive us. How kind of him.
        - id: ch03-b81
          speaker: narrator
          text: McTurk laughed into the bright metal shaving cup and held Sefton's head between Stalky's knees.
        - id: ch03-b82
          speaker: beetle
          text: Wait. A razor won't take long hairs. We must cut the mustache short before we scrape it.
        - id: ch03-b83
          speaker: stalky
          text: I'm not hunting for scissors. Would a match work? Give me the matchbox. He's a hog, so we may as well singe him. Lie still!
        - id: ch03-b84
          speaker: narrator
          text: Stalky lit a match, then stopped his hand.
        - id: ch03-b85
          speaker: stalky
          text: But I only want to remove half.
        - id: ch03-b86
          speaker: beetle
          text: That's easy. I'll put lather up to the middle, and you burn everything beyond it.
        - id: ch03-b87
          speaker: narrator
          text: The thin first mustache of youth flared away up to the line of lather at the center of Sefton's lip. Stalky rubbed off the burned stubble with his thumb. It was not a gentle shave, but it achieved its purpose completely.
        - id: ch03-b88
          speaker: stalky
          text: Now for the whisker on the other side. Turn him over.
        - id: ch03-b89
          speaker: narrator
          text: Between match and razor, that whisker disappeared too.
        - id: ch03-b90
          speaker: stalky
          text: Give him his mirror and take out the gag. I want to hear what he says.
        - id: ch03-b91
          speaker: narrator
          text: Sefton said nothing. He stared at the crooked ruin in horror and despair. Two heavy tears rolled down his cheeks.
        - id: ch03-b92
          speaker: stalky
          text: Oh, I forgot. Sefton, why did you bully Clewer?
        - id: ch03-b93
          speaker: sefton
          text: Leave me alone! You infernal bullies, leave me alone! Haven't I suffered enough?
          emotion: sad
        - id: ch03-b94
          speaker: mcturk
          text: He says we should leave him alone.
        - id: ch03-b95
          speaker: beetle
          text: He calls us bullies when we have hardly begun. You're ungrateful, Seffy. You look like an atrocity and a half.
        - id: ch03-b96
          speaker: stalky
          text: He says he's had enough. He is mistaken.
        - id: ch03-b97
          speaker: mcturk
          text: Back to work, then. Come along, my splendid Narcissus. Try not to fall in love with your reflection.
    - id: ch04
      title: The Surrender
      blocks:
        - id: ch04-b01
          speaker: campbell
          text: Let him off. He's crying too.
        - id: ch04-b02
          speaker: narrator
          text: Sefton wept like a twelve-year-old from pain, shame, wounded vanity, and complete helplessness.
        - id: ch04-b03
          speaker: campbell
          text: You'll make peace, won't you, Sefton? You can't stand against these young devils.
        - id: ch04-b04
          speaker: mcturk
          text: Don't be rude, dear Campbell, or you'll receive another turn.
        - id: ch04-b05
          speaker: campbell
          text: But you are devils, you know.
        - id: ch04-b06
          speaker: stalky
          text: For doing a little bullying, just as you bullied Clewer? How long have you played these games with him? The whole term?
        - id: ch04-b07
          speaker: campbell
          text: We didn't hit him every time.
        - id: ch04-b08
          speaker: beetle
          text: Only whenever you could catch him. I know how that works.
        - id: ch04-b09
          speaker: campbell
          text: Perhaps we did.
        - id: ch04-b10
          speaker: beetle
          text: And you went looking for him because he was such an awful little beast. I know that too. Well, now you're awful beasts, and you're getting what he got, simply because we choose.
        - id: ch04-b11
          speaker: campbell
          text: We never truly bullied him the way you've bullied us.
        - id: ch04-b12
          speaker: beetle
          text: Of course not. Bullies never do. Molly Fairburn only knocked us about a little. That's always what they say. They only kick the soul out of a boy until he hides in the box-room and cries with his head buried in the coats. He writes home three times a day, begging to be taken away. I did that myself. You've never been properly bullied, Campbell. I'm sorry you surrendered.
        - id: ch04-b13
          speaker: campbell
          text: I'm not sorry. Look out, though. You're killing Sefton.
        - id: ch04-b14
          speaker: narrator
          text: Campbell could find humor even then. In his excitement, Beetle had been dropping the stump on Sefton's foot without thinking, and Sefton was shouting for mercy.
        - id: ch04-b15
          speaker: beetle
          text: And you, Sefton. You were never bullied either. Where were you before you came here?
        - id: ch04-b16
          speaker: sefton
          text: I had a private tutor.
        - id: ch04-b17
          speaker: beetle
          text: Naturally. You never cried in your life before, but you're crying now. Aren't you?
        - id: ch04-b18
          speaker: sefton
          text: Can't you see that, you blind beast?
          emotion: angry
        - id: ch04-b19
          speaker: narrator
          text: Sefton rolled onto his side. Tears cut tracks through the dried shaving lather. The cricket stump cracked against his curved rear.
        - id: ch04-b20
          speaker: beetle
          text: I'm blind, am I? And a beast? Be quiet, Stalky. I'm going to entertain our friend in Molly Fairburn's style. I think I can see. Can't I see, Sefton?
        - id: ch04-b21
          speaker: mcturk
          text: An excellent point. You had better agree that Beetle can see.
        - id: ch04-b22
          speaker: sefton
          text: You can! I swear you can!
          emotion: fearful
        - id: ch04-b23
          speaker: beetle
          text: Aren't my eyes lovely?
        - id: ch04-b24
          speaker: narrator
          text: The stump rose and fell steadily through the questioning.
        - id: ch04-b25
          speaker: sefton
          text: Yes, they are lovely!
        - id: ch04-b26
          speaker: beetle
          text: A gentle hazel color, aren't they?
        - id: ch04-b27
          speaker: sefton
          text: Yes. Oh, yes!
        - id: ch04-b28
          speaker: beetle
          text: What a liar. They're sky-blue, aren't they?
        - id: ch04-b29
          speaker: sefton
          text: Yes! Sky-blue!
        - id: ch04-b30
          speaker: beetle
          text: You change your mind every minute. You must learn better. We still need to discuss your calling me a beast.
        - id: ch04-b31
          speaker: stalky
          text: You're in a fine rage, Beetle. Keep calm.
        - id: ch04-b32
          speaker: beetle
          text: This was done to me.
        - id: ch04-b33
          speaker: sefton
          text: Peace! Please, make peace! I give in! Let me off! I'm broken. I can't bear any more!
          emotion: fearful
        - id: ch04-b34
          speaker: mcturk
          text: Just as we were getting skilled at it.
        - id: ch04-b35
          speaker: beetle
          text: I swear they never let Clewer off.
        - id: ch04-b36
          speaker: stalky
          text: Confess and apologize. Quickly.
        - id: ch04-b37
          speaker: narrator
          text: Still on the floor, Sefton surrendered without conditions. He apologized and yielded more abjectly even than Campbell. He promised never to touch anyone again. From that moment onward, he said, he would move gently through all the remaining days of his life.
        - id: ch04-b38
          speaker: stalky
          text: I suppose we must accept that. Very well, Sefton. You're broken. Beetle, stop now. Before we untie you, though, you and Campbell will sing Kitty of Coleraine, exactly as Clewer had to.
        - id: ch04-b39
          speaker: campbell
          text: That's unfair. We've surrendered.
        - id: ch04-b40
          speaker: stalky
          text: Of course you have. That means you'll do what we tell you, just as Clewer did. If you had not surrendered, we would really bully you. Since you have surrendered, you sing songs honoring the conquerors. Do you follow, Seffy? Begin.
        - id: ch04-b41
          speaker: narrator
          text: The three victors settled luxuriously into chairs. Campbell and Sefton looked at each other, found no comfort there, and began Kitty of Coleraine together.
        - id: ch04-b42
          speakers: [sefton, campbell]
          ensemble: duo
          text: As beautiful Kitty one morning was tripping, with a pitcher of milk to the fair of Coleraine.
        - id: ch04-b43
          speaker: narrator
          text: Their miserable wailing died away.
        - id: ch04-b44
          speaker: stalky
          text: Vile. If you hadn't surrendered, duty would require us to throw books at you for singing out of tune. Now then.
        - id: ch04-b45
          speaker: narrator
          text: He untied them, but for several minutes neither could stand. Their cramped limbs would not obey them. Campbell rose first with an uncertain smile, trying to discover what manner of peace now existed. Sefton staggered to the table, dropped his head onto his folded arms, and shook with sobs. Neither had any fight left. Their swagger had vanished, leaving only astonishment, misery, and shame.
        - id: ch04-b46
          speaker: campbell
          text: Could he shave the rest clean before tea, please? The bell rings in ten minutes.
        - id: ch04-b47
          speaker: narrator
          text: Stalky shook his head. He intended to escort the half-shaved Sefton into the meal. McTurk yawned from his chair, while Beetle wiped his wet face. Excitement and effort had left all three dripping.
        - id: ch04-b48
          speaker: stalky
          text: If I knew anything about morality, I swear I would give you a moral lecture.
        - id: ch04-b49
          speaker: mcturk
          text: Don't preach. They've surrendered. This business of moral persuasion exhausts a fellow.
        - id: ch04-b50
          speaker: stalky
          text: Don't you see how gentle we have been? We might have brought Clewer in to look at you. The bleating of the tiger excites the kid. But we didn't do that. We could tell a few boys what happened, and soon the whole school would hoot at you. Life would become unbearable. We won't do that either. We are strictly moral persuaders. Unless you or Sefton tells, no one else will know.
        - id: ch04-b51
          speaker: campbell
          text: I swear you're a decent fellow. I suppose I was rather brutal to Clewer.
        - id: ch04-b52
          speaker: stalky
          text: It looked that way. But perhaps Seffy should not enter hall with crooked whiskers. The younger boys might learn something bad from seeing him. He may shave properly. Aren't you grateful, Sefton?
        - id: ch04-b53
          speaker: narrator
          text: Sefton did not raise his head. He was fast asleep.
        - id: ch04-b54
          speaker: mcturk
          text: That's strange. It seems cheeky. Perhaps he's pretending.
        - id: ch04-b55
          speaker: narrator
          text: A snore mingled with a sob.
        - id: ch04-b56
          speaker: beetle
          text: No, he isn't pretending. After Molly Fairburn had worked on me for an hour, I sometimes fell dead asleep on a bench. Poor devil. Still, he called me a beastly poet.
        - id: ch04-b57
          speaker: stalky
          text: We'd better go. Goodbye, Campbell. Remember, if you keep quiet, everyone else will too.
        - id: ch04-b58
          speaker: narrator
          text: Stalky lowered his voice so he would not wake Sefton. There ought to have been a war-dance after such a victory, with Stalky shuffling across the floor and the others admiring the campaign. All three were too utterly tired. Back in their own study, they nearly fell asleep over their teacups, then slept without stirring until preparation.
    - id: ch05
      title: The Moral Reformers
      blocks:
        - id: ch05-b01
          speaker: head
          text: This is a most extraordinary letter. Are all parents incurably mad? What do you make of it?
        - id: ch05-b02
          speaker: narrator
          text: The Head handed the Reverend John eight pages covered in close writing.
        - id: ch05-b03
          speaker: chaplain
          text: The only son of his mother, and she a widow. That is the least reasonable kind.
        - id: ch05-b04
          speaker: narrator
          text: The chaplain read on with pursed lips.
        - id: ch05-b05
          speaker: chaplain
          text: If half these accusations were true, he ought to be in the sick-house. Instead, he is disgustingly healthy. He has certainly shaved. I noticed that.
        - id: ch05-b06
          speaker: head
          text: Under compulsion, his mother says. Delightful! And very good for him!
        - id: ch05-b07
          speaker: chaplain
          text: You aren't the one who must answer her. Usually I know what has happened in this school, but this mystery defeats me.
        - id: ch05-b08
          speaker: head
          text: If you asked me, I would advise against trying to appease her. When we are forced to accept crammers' pups...
        - id: ch05-b09
          speaker: head
          text: He was perfectly healthy during extra tuition with me this morning. Unusually well behaved too.
        - id: ch05-b10
          speaker: narrator
          text: The Head had spoken the second thought almost to himself.
        - id: ch05-b11
          speaker: chaplain
          text: Crammers' pups either educate the school, or, as in this case, the school educates them. I prefer our own methods.
        - id: ch05-b12
          speaker: head
          text: You think that explains it?
        - id: ch05-b13
          speaker: narrator
          text: One of the Head's eyebrows lifted.
        - id: ch05-b14
          speaker: chaplain
          text: I'm certain. And nothing excuses the boy for trying to give the College a bad name.
        - id: ch05-b15
          speaker: head
          text: That is exactly the argument I intend to use with him.
        - id: ch05-b16
          speaker: narrator
          text: The two wise men exchanged a wink and left the matter there.
        - id: ch05-b17
          speaker: narrator
          text: A few days later, after watching what happened around the school, the Reverend John visited Number Five again.
        - id: ch05-b18
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Why haven't you come before, Padre?
        - id: ch05-b19
          speaker: chaplain
          text: I have been watching times and seasons, events and men, and boys. I am pleased with my Tenth Legion and offer my compliments. Clewer threw ink-balls during class this morning instead of working. He is now writing fifty lines for unheard-of audacity.
        - id: ch05-b20
          speaker: beetle
          text: You can't blame us, sir. You told us to remove the pressure. That's the trouble with little boys.
        - id: ch05-b21
          speaker: chaplain
          text: I have known boys five years older than Clewer to throw ink-balls. I gave one such boy two hundred lines, not long ago. Now that I think of it, were those lines ever handed in?
        - id: ch05-b22
          speaker: beetle
          text: Were they ever handed in, Turkey?
        - id: ch05-b23
          speaker: narrator
          text: Beetle's face showed perfect innocence.
        - id: ch05-b24
          speaker: stalky
          text: Don't you think Clewer looks a little cleaner, Padre?
        - id: ch05-b25
          speaker: mcturk
          text: We're tremendous moral reformers.
        - id: ch05-b26
          speaker: beetle
          text: Stalky planned everything, but it was a fine lark.
        - id: ch05-b27
          speaker: chaplain
          text: I have noticed moral improvement in several places. Didn't I tell you that, if you chose to use it, you had more influence than any boys in the school?
        - id: ch05-b28
          speaker: stalky
          text: Our kind of moral persuasion is too exhausting to use often. And all it did was make Clewer cheeky.
        - id: ch05-b29
          speaker: chaplain
          text: I wasn't thinking about Clewer. I meant the other people, Stalky.
        - id: ch05-b30
          speaker: mcturk
          text: We hardly troubled ourselves about the other people, did we?
        - id: ch05-b31
          speaker: chaplain
          text: But I did, from the very beginning.
        - id: ch05-b32
          speaker: stalky
          text: Then you knew, sir?
        - id: ch05-b33
          speaker: narrator
          text: The Reverend John answered with a downward puff of smoke.
        - id: ch05-b34
          speaker: chaplain
          text: They say boys educate one another more than we masters can or dare. If I had used even half the moral persuasion that you may or may not have used...
        - id: ch05-b35
          speaker: mcturk
          text: We had the finest motives in the world. Don't forget our pious motives, Padre.
        - id: ch05-b36
          speaker: chaplain
          text: Then I suppose I would now be wasting away in Bideford jail. To borrow the Head's words from a small matter we have agreed to forget, that seems like flagrant injustice. What are you young sinners laughing at? Isn't it true? I refuse to stay here and be shouted at. I only entered this den of wickedness to ask whether anyone wanted to come swimming off the Ridge. Clearly, you don't.
        - id: ch05-b37
          speakers: [stalky, beetle, mcturk]
          ensemble: chorus
          text: Don't we! Give us half a moment, Padre Sahib, to fetch our towels, and we're with you!
