audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    lasse:
      display_name: 小拉塞
      tts:
        delivery: 天真勇敢，遇险时显出孩子气的害怕，回家后又神气十足
        timbre: 清亮稚嫩的男孩声
        pace: 适中偏快
        pitch: 高
    gardener:
      display_name: 园丁
      tts:
        delivery: 朴实直率，责备孩子时严厉却不失宽厚
        timbre: 粗厚温和的老年男声
        pace: 适中偏慢
        pitch: 中低
    nukku_matti:
      display_name: 努库·马蒂
      tts:
        delivery: 神秘慈爱，像哄孩子入睡般轻柔从容
        timbre: 低沉柔和的老年男声
        pace: 舒缓
        pitch: 低
    dream_boy:
      display_name: 梦孩儿
      tts:
        delivery: 轻灵快活，提问时带一点顽皮的逗弄
        timbre: 轻盈清澈的男孩声
        pace: 适中
        pitch: 高
    dream_child_1:
      display_name: 小梦一
      tts:
        delivery: 明亮纯真，歌唱般流畅
        timbre: 清脆的童声
        pace: 适中
        pitch: 高
    dream_child_2:
      display_name: 小梦二
      tts:
        delivery: 温柔纯真，歌唱般流畅
        timbre: 柔亮的童声
        pace: 适中
        pitch: 中高
    dream_child_3:
      display_name: 小梦三
      tts:
        delivery: 欢快纯真，歌唱般流畅
        timbre: 明净的童声
        pace: 适中
        pitch: 高
    brother:
      display_name: 哥哥
      tts:
        delivery: 亲切爽朗，呼唤弟弟时自然响亮
        timbre: 清朗的少年声
        pace: 适中偏快
        pitch: 中高
    sister:
      display_name: 姐姐
      tts:
        delivery: 亲切活泼，语气自然明快
        timbre: 清甜的少女声
        pace: 适中偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 豌豆荚舰队
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个名叫拉尔斯的小男孩。因为年纪小，大家都叫他小拉塞。可别小看他，他勇敢得很，还曾坐着豌豆荚船周游世界呢。那是一个夏天，花园里的豆荚长得又绿又长。小拉塞钻进比帽子还高的豆秧里，专挑又长又直的，一连摘了十七只。他以为没人瞧见。这个念头可有点傻，因为上帝在任何地方都看得见。
        - id: ch01-b02
          speaker: narrator
          text: 园丁正好扛着枪走来，听见豌豆地里窸窸窣窣地响。
        - id: ch01-b03
          speaker: gardener
          text: “准是麻雀。嘘！嘘！怎么一只也不飞出来？等着，我装上子弹，把这些麻雀打下来。”
        - id: ch01-b04
          speaker: narrator
          text: 可小拉塞没有翅膀，只有两条小腿。他吓得赶紧从豆秧里爬出来，站到小路上。
        - id: ch01-b05
          speaker: lasse
          text: “好园丁，原谅我吧！我只是想找几只漂亮的船。”
        - id: ch01-b06
          speaker: gardener
          text: “这回就算了。下次小拉塞还想进豌豆地找船，可得先问过我。”
        - id: ch01-b07
          speaker: lasse
          text: “我一定先问。”
        - id: ch01-b08
          speaker: narrator
          text: 拉塞来到岸边，用针挑开豆荚，再小心分成两半。他折下许多细树枝，给划船的人当座位，又把豆荚里的豌豆装进船里，当作远航的货物。有几只豆荚不小心破了，也有些始终完好，最后刚好做成十二只船。不过在拉塞眼里，它们不是小船，而是大战舰。舰队里有三艘战列舰、三艘巡航舰、三艘双桅横帆船，还有三艘纵帆船。最大的战列舰叫“赫拉克勒斯号”，最小的纵帆船叫“跳蚤号”。十二艘船一齐下水，昂首漂在浪上，神气得不输真正的巨舰。
        - id: ch01-b09
          speaker: narrator
          text: 舰队该去周游世界了。远处的大岛就是亚洲，大石头是非洲，小岛是美洲，一颗颗小石头是波利尼西亚，脚下这片出发的岸则是欧洲。整支舰队就这样离开港口，向世界各地远航。战列舰笔直驶往亚洲，巡航舰去非洲，双桅横帆船奔向美洲，纵帆船开往波利尼西亚。只有小拉塞留在欧洲，把一颗颗石子扔进茫茫大海。
        - id: ch01-b10
          speaker: narrator
          text: 欧洲岸边还停着爸爸的船，一条刷得雪白的漂亮真船。爸爸妈妈一再不许拉塞上去，他却把这条规矩忘了，只想着自己也该到世界别处看看。他爬上船，望着已经变成小黑点的豌豆荚舰队。
        - id: ch01-b11
          speaker: lasse
          text: “我只划出去一点点，真的只是一点点。等我在亚洲海岸截住‘赫拉克勒斯号’，马上就划回欧洲。”
        - id: ch01-b12
          speaker: narrator
          text: 他摇了摇拴船的绳子，绳子竟然松开了。咔嚓，哗啦，男子汉说干就干，小拉塞这便掌起了舵。他以为自己很会划船。在家时，他常把台阶当成船，把爸爸的大手杖当成桨。可真要划起来，他才发现船里连一支桨也没有。桨全锁在船屋里，他先前根本没留意这是一条空船。没有桨还想去亚洲，可没那么容易。
        - id: ch01-b13
          speaker: narrator
          text: 船已经离岸一段路。风从陆地吹来，把它越推越远。拉塞想不出办法，害怕得哭起来，可岸上一个人也没有，更没有谁听见他的哭声。白桦树上只有一只孤零零的大乌鸦，园丁的黑猫蹲在树下，正等着捉乌鸦。它们各忙各的，谁也不关心那个漂向大海的小男孩。
        - id: ch01-b14
          speaker: narrator
          text: 拉塞终于明白，自己不听爸爸妈妈的话，偷偷上船，实在错得厉害。爸爸妈妈明明警告过他那么多次，可现在后悔已经晚了。他回不了岸，说不定会在茫茫大海中失踪。接下来到底该怎么办？他又喊了很久，直到一点力气也没有，还是无人回应。于是，他合起两只小手。
        - id: ch01-b15
          speaker: lasse
          text: “慈爱的上帝，请不要生小拉塞的气。”
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 说完，他便沉沉睡去。虽然外面还是明亮的白昼，老努库·马蒂却已经坐在“梦乡”岸边，拿一根长长的钓竿钓小孩子。他听见拉塞对上帝说的那几句低语，马上把小船钓到面前，又轻轻抱起孩子，让他睡上一张铺满玫瑰花瓣的床。
        - id: ch01-b17
          speaker: nukku_matti
          text: “去陪陪小拉塞吧，别让他一个人寂寞。”
    - id: ch02
      title: 梦中的世界之旅
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 努库·马蒂叫来的是一个梦孩儿。他小得不得了，甚至比拉塞还小。他有一双蓝眼睛和一头金发，戴着镶银边的红帽子，白外套的领口缀满珍珠。这个小家伙走到拉塞身边，准备陪他玩一场。
        - id: ch02-b02
          speaker: dream_boy
          text: “你想不想周游世界？”
        - id: ch02-b03
          speaker: lasse
          text: “想，我很想去。”
        - id: ch02-b04
          speaker: dream_boy
          text: “那就坐你的豌豆荚船出发。你乘‘赫拉克勒斯号’，我乘‘跳蚤号’。”
        - id: ch02-b05
          speaker: narrator
          text: 两人离开“梦乡”，转眼便到了世界另一端的亚洲海岸。冰海在这里穿过白令海峡，流进太平洋。冬雾深处，探险家诺登舍尔德正乘着“维加号”，在冰层间寻找通道。这里冷得厉害，巨大的冰山闪着怪异的光。鲸鱼只能待在冰下，因为它们用笨重的脑袋撞不开冰层。荒凉的岸上到处是雪，一直铺到视线尽头。披着蓬松毛皮的灰衣小人来来往往，坐着狗拉的小雪橇穿过积雪。
        - id: ch02-b06
          speaker: dream_boy
          text: “我们就在这里上岸吗？”
        - id: ch02-b07
          speaker: lasse
          text: “不要。鲸鱼会一口吞了我们，大狗也会咬我们。还是去世界的另一个地方吧。”
          emotion: fearful
        - id: ch02-b08
          speaker: dream_boy
          text: “好啊，美洲离这儿不远。”
        - id: ch02-b09
          speaker: narrator
          text: 话刚说完，他们已经到了美洲。这里阳光灿烂，天气很暖。高大的棕榈树沿岸排成一行行，树梢挂满椰子。肤色红得像铜的人们骑马飞驰在无边的绿色草原上，朝野牛射箭。野牛则转过身，用尖角冲向他们。一条巨大的眼镜蛇爬上棕榈树干，猛地扑住树下吃草的小羊驼。咔嚓一声，小羊驼就没命了。
        - id: ch02-b10
          speaker: dream_boy
          text: “我们在这儿靠岸怎么样？”
        - id: ch02-b11
          speaker: lasse
          text: “不行。野牛会用角顶我们，大蛇也会吃掉我们。换个地方吧。”
          emotion: fearful
        - id: ch02-b12
          speaker: dream_boy
          text: “那就去波利尼西亚，离这儿只有一小段路。”
        - id: ch02-b13
          speaker: narrator
          text: 一眨眼，他们来到波利尼西亚。这里像芬兰的热水浴一样闷热。岸边长着胡椒、肉桂、生姜、番红花，还有咖啡树和茶树，全是名贵的香料和作物。皮肤棕褐、耳朵长长、嘴唇厚厚的人们在脸上涂着吓人的色彩，正到高高的竹林里围猎一头黄斑老虎。老虎突然回身反扑，利爪扎进一个人的身体，其余人顿时全逃散了。
        - id: ch02-b14
          speaker: dream_boy
          text: “要不要在这里上岸？”
        - id: ch02-b15
          speaker: lasse
          text: “不要。你没看见胡椒旁边那头老虎吗？我们去世界的另一个地方。”
          emotion: fearful
        - id: ch02-b16
          speaker: dream_boy
          text: “可以呀，非洲离我们不远。”
        - id: ch02-b17
          speaker: narrator
          text: 他说完，他们就到了非洲。两只小船停在一条大河的入海口，河岸绿得像最碧绿的天鹅绒。再往远处看，是一片无边无际的沙漠。空气泛着黄光，太阳热啊，热得仿佛要把大地烧成灰。当地人的皮肤黑得像煤玉，骑着高大的骆驼穿越沙海。狮子渴得大声咆哮，巨大的鳄鱼从河里探出灰色蜥蜴般的脑袋，张着满是锋利白牙的大嘴。
        - id: ch02-b18
          speaker: dream_boy
          text: “我们这次上岸吗？”
        - id: ch02-b19
          speaker: lasse
          text: “还是不要。太阳会烧焦我们，狮子和鳄鱼也会把我们吃掉。再去别处看看吧。”
          emotion: fearful
        - id: ch02-b20
          speaker: dream_boy
          text: “那我们回欧洲。”
    - id: ch03
      title: 欧洲的煎薄饼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 转眼间，两人回到一片清凉、熟悉又亲切的岸边。高高的白桦树垂着叶子，老乌鸦坐在树梢，园丁的黑猫在树下悄悄爬行。不远处那幢房子，小拉塞似乎见过。房子旁有座花园，园里有一畦挂满长豆荚的豌豆。穿绿外套的老园丁来回走动，想着黄瓜熟了没有。菲拉克斯在台阶上叫，看见拉塞就摇尾巴。老斯蒂娜在院里挤牛奶。一位眼熟的太太披着方格羊毛披肩，正去晒衣草地看衣裳白了没有。还有一位熟悉的先生，穿着黄色夏装，叼着长烟斗，要去查看收割工有没有割完黑麦。一个男孩和一个女孩沿着岸边跑来。
        - id: ch03-b02
          speakers: [brother, sister]
          ensemble: duo
          text: “小拉塞！快回家吃黄油面包！”
        - id: ch03-b03
          speaker: dream_boy
          text: “这地方怎么样，我们上岸吗？”
        - id: ch03-b04
          speaker: narrator
          text: 梦孩儿问着，还顽皮地眨了眨蓝眼睛。
        - id: ch03-b05
          speaker: lasse
          text: “跟我一起去。我请妈妈给你黄油面包，再来一杯牛奶。”
        - id: ch03-b06
          speaker: dream_boy
          text: “你先等一等。”
        - id: ch03-b07
          speaker: narrator
          text: 小拉塞看见厨房门敞开着，里面传出轻轻的滋滋声，好听极了，就像有人拿木勺把黄色面糊搅进滚烫的平底锅。
        - id: ch03-b08
          speaker: dream_boy
          text: “要不，我们这会儿划回波利尼西亚？”
          emotion: happy
        - id: ch03-b09
          speaker: lasse
          text: “才不回去，欧洲正在煎薄饼呢。”
        - id: ch03-b10
          speaker: narrator
          text: 拉塞想跳上岸，可身子动不了。原来梦孩儿用一条花链把他绑住了。紧接着，所有的小梦都围拢过来。成千上万个小孩子手拉着手，把他圈在中间，唱起一支歌。
        - id: ch03-b11
          speakers: [dream_child_1, dream_child_2, dream_child_3]
          ensemble: chorus
          text: “世界宽广又辽远，小拉塞呀，拉塞。哪怕乘船过海面，你也猜不出彼岸究竟离你有多远，拉塞呀，小拉塞。你尝过严寒酷暑，小拉塞呀，拉塞。无论身在何方土，上帝从来都眷顾，拉塞呀，小拉塞。那里也有万千人，人人都是上帝珍，小拉塞呀，拉塞。若有天使来带路，小拉塞呀，拉塞，纵然远赴天涯处，野兽四下在游荡，也没有谁能伤你。可请你说，每次远游，看遍世上众多国，难道不是故乡好？拉塞呀，小拉塞。”
    - id: ch04
      title: 从梦乡回家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小梦们唱完歌，蹦蹦跳跳地散开了。努库·马蒂把拉塞送回小船。拉塞一动不动地躺了很久，耳边还响着家里炉火上平底锅的滋滋声。那声音越来越清楚，越来越近。他终于醒过来，揉了揉眼睛。
        - id: ch04-b02
          speaker: narrator
          text: 他还躺在睡着时的那条船里。原来风已经换了方向。一阵风把船吹出岸，另一阵又把它送回来。拉塞当作煎饼声的，其实是海浪冲刷岸边石头时低低的呢喃。不过，他也没有全猜错。清澈蔚蓝的大海真像一口大锅，上帝的太阳整天在里面给乖孩子烙饼。
        - id: ch04-b03
          speaker: narrator
          text: 小拉塞揉去眼里的睡意，坐起来四下一看，什么都和原来一样。乌鸦还停在白桦树上，猫还蹲在草地上，豌豆荚舰队也散落在岸边。有几艘船已经沉没，还有几艘被水送回陆地。“赫拉克勒斯号”带着亚洲的货物归来，“跳蚤号”也从波利尼西亚返航，世界的其他地方仍留在原处，一点也没有挪动。
        - id: ch04-b04
          speaker: narrator
          text: 拉塞不知道该怎么想。他从前常常去过“梦乡”那座熟悉的岩洞，却不懂梦会耍什么花招。不过，他才懒得为这些事伤脑筋。拉塞收好自己的船，沿岸向家里走去。哥哥和姐姐远远跑来迎他。
        - id: ch04-b05
          speakers: [brother, sister]
          ensemble: duo
          text: “拉塞，你这么久跑到哪儿去了？快回家吃黄油面包！”
        - id: ch04-b06
          speaker: narrator
          text: 厨房门开着，里面传来一阵奇怪的滋滋声。园丁站在大门边，正给莳萝、欧芹、胡萝卜和欧洲防风草浇水。
        - id: ch04-b07
          speaker: gardener
          text: “喂，小拉塞这么久上哪儿去了？”
        - id: ch04-b08
          speaker: narrator
          text: 小拉塞把身子挺得笔直，站得硬邦邦的。
        - id: ch04-b09
          speaker: lasse
          text: “我坐着豌豆荚船周游世界去了。”
        - id: ch04-b10
          speaker: gardener
          text: “噢，原来是这样！”
          emotion: surprised
        - id: ch04-b11
          speaker: narrator
          text: 小拉塞已经忘了梦境之国，可你没有忘。你知道那里确实存在。你见过美丽的岩洞，见过永不褪色的明亮银墙和永不黯淡的闪亮钻石。甜美的黄昏微光里，总有一阵轻柔的音乐低低回响，从来不曾停息。幸福梦境之国里的奇思妙想，轻盈得像仙子，永远不会衰老。它们如同头顶灿烂的群星，永远年轻。也许，那些翅膀曾飞过你的枕边，你还瞥见过它们飘忽的影子。也许你遇到过同一个梦孩儿。他有蓝眼睛和金头发，戴镶银边的红帽子，白外套的领口钉满珍珠。也许，他带你看过世界上所有的国度和人，走过冰冷荒原与灼热沙漠，见过肤色各异的人，也见过海里和林中的野兽。你学会了许多事，最后又欢欢喜喜地回到家。是啊，谁知道呢？也许你也曾坐着一只豌豆荚船，周游过辽阔的世界。
        - id: ch04-b12
          speaker: narrator
          text: 这个故事选自扎卡里亚斯·托佩柳斯。
