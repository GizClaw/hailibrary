  chapters:
    - id: ch01
      title: The Pea-Shell Fleet
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a little boy named Lars. Because he was so small, everyone called him Little Lasse. Yet he was a brave little man, for he sailed around the world in a pea-shell boat.
        - id: ch01-b02
          speaker: narrator
          text: It was summer, and long green pea pods hung in the garden. Lasse crept into the pea bed, where the stalks stood higher than his cap. He chose seventeen pods, each one as long and straight as he could find.
        - id: ch01-b03
          speaker: narrator
          text: Perhaps he thought nobody could see him. That was foolish, because God sees everywhere. Soon the gardener came along with his gun over one shoulder. He heard a rustle among the peas.
        - id: ch01-b04
          speaker: gardener
          text: That must be a sparrow. Shoo! Shoo!
        - id: ch01-b05
          speaker: narrator
          text: No sparrow flew out. Little Lasse had no wings, only two small legs. The gardener decided he would load his gun and shoot the sparrows.
        - id: ch01-b06
          speaker: gardener
          text: Just wait. I'll load my gun, and then I'll shoot those sparrows.
        - id: ch01-b07
          speaker: narrator
          text: That frightened Lasse. He crawled from the pea bed onto the path.
        - id: ch01-b08
          speaker: lasse
          text: Please forgive me, dear gardener. I only wanted some fine boats.
        - id: ch01-b09
          speaker: gardener
          text: I'll forgive you this time. But next time, Little Lasse must ask before he goes looking for boats in the pea bed.
        - id: ch01-b10
          speaker: lasse
          text: I will.
        - id: ch01-b11
          speaker: narrator
          text: Lasse went down to the shore. With a pin, he opened each pod and carefully split it in two. He broke tiny pieces from sticks and made seats for rowers. The peas went back into the little boats as cargo. Some pods broke as he worked, but others stayed whole. When everything was ready, he had twelve boats.
        - id: ch01-b12
          speaker: narrator
          text: They were not ordinary boats now. They were mighty warships. Lasse had three ships of the line, three frigates, three brigs, and three schooners. The largest ship was Hercules. The smallest schooner was The Flea. He set all twelve on the water, and they floated as proudly as great ships riding the ocean waves.
        - id: ch01-b13
          speaker: narrator
          text: Now the fleet must travel around the world. To Lasse, the big island across the water was Asia. A large stone became Africa, a small island became America, and a scattering of little stones became Polynesia. The shore where he stood was Europe.
        - id: ch01-b14
          speaker: narrator
          text: Off the whole fleet sailed toward distant lands. The ships of the line headed straight for Asia. The frigates sailed to Africa, the brigs to America, and the schooners to Polynesia. Lasse stayed behind in Europe, tossing small stones into the great sea.
        - id: ch01-b15
          speaker: narrator
          text: A real boat rested on Europe's shore. It was his father's own boat, beautifully painted white, and Lasse climbed inside. His father and mother had forbidden him to do that, but he forgot. He wanted very much to visit another part of the world.
        - id: ch01-b16
          speaker: lasse
          text: I'll row out only a little way. The pea-shell boats have gone so far that they look like specks. I'll catch Hercules on the coast of Asia, and then I'll row straight home to Europe.
        - id: ch01-b17
          speaker: narrator
          text: He shook the rope that held the boat. Strangely enough, it came loose. Ditsch, ratsch, a man is a man, and Little Lasse took command.
        - id: ch01-b18
          speaker: narrator
          text: He knew how to row, or thought he did. Many times he had rowed on the steps at home, pretending the steps were a boat and his father's big stick was an oar. But when he looked around this real boat, there were no oars. They were locked in the boathouse, and Lasse had never noticed the boat was empty. Rowing to Asia without oars was not so easy after all.
        - id: ch01-b19
          speaker: narrator
          text: The boat was already away from shore. A wind from the land pushed it farther out. Lasse grew frightened and began to cry, but nobody stood on the shore to hear him. A large crow sat alone in the birch tree. Beneath it, the gardener's black cat waited to catch the crow. Neither one cared that Little Lasse was drifting out to sea.
        - id: ch01-b20
          speaker: narrator
          text: Now Lasse bitterly regretted disobeying his parents after all their warnings. It was too late to get back to land. Perhaps he would be lost on the great sea. What could he do?
        - id: ch01-b21
          speaker: narrator
          text: He called until he was tired, but still no one heard. Then he folded his two little hands.
        - id: ch01-b22
          speaker: lasse
          text: Good God, please don't be angry with Little Lasse.
        - id: ch01-b23
          speaker: narrator
          text: Then he fell asleep.
    - id: ch02
      title: The Dream Voyage Begins
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Though it was still daylight, old Nukku Matti sat on the shore of the Land of Nod, fishing for little children with his long fishing rod. He heard Lasse's quiet prayer. At once, he drew the boat toward him and laid the boy to sleep on a bed of rose leaves.
        - id: ch02-b02
          speaker: nukku_matti
          text: Go and play with Little Lasse, so he won't feel lonely.
        - id: ch02-b03
          speaker: narrator
          text: Nukku Matti spoke to one of the Dreams. It was a dream-boy, even smaller than Lasse. He had blue eyes, fair hair, a red cap with a silver band, and a white coat with pearls around the collar. He came up to Lasse.
        - id: ch02-b04
          speaker: dream_boy
          text: Would you like to sail around the world?
        - id: ch02-b05
          speaker: lasse
          text: Yes, I would like that.
        - id: ch02-b06
          speaker: narrator
          text: Lasse answered in his sleep.
        - id: ch02-b07
          speaker: dream_boy
          text: Then come with me. We'll sail in your pea-shell boats. You can take Hercules, and I'll take The Flea.
        - id: ch02-b08
          speaker: narrator
          text: Away they sailed from the Land of Nod. Before long, Hercules and The Flea reached the Asian coast at the far end of the world. There, the Arctic Ocean runs through the Bering Strait into the Pacific.
        - id: ch02-b09
          speaker: narrator
          text: Through the distant winter mist, they could see the explorer Nordenskiöld aboard his ship, the Vega, searching for a passage through the ice. The cold was bitter, colder than cold. Huge icebergs glittered with a strange light. Great whales had to live beneath the ice because their clumsy heads could not break a hole through it.
        - id: ch02-b10
          speaker: narrator
          text: Snow covered the dreary shore as far as anyone could see. Small gray-clad people moved across that endless white land. They wore shaggy skins and rode through the deep drifts in little sledges pulled by dogs.
        - id: ch02-b11
          speaker: dream_boy
          text: Shall we go ashore here?
        - id: ch02-b12
          speaker: lasse
          text: No. I'm afraid the whales might swallow us, and the big dogs might bite us. Let's sail to another part of the world.
          emotion: fearful
        - id: ch02-b13
          speaker: dream_boy
          text: Very well. America isn't far away.
        - id: ch02-b14
          speaker: narrator
          text: The dream-boy in the red cap with the silver band had hardly spoken before they were there. Sunshine poured down, and the air was very warm. Tall palms stood in rows along the shore, with coconuts high among their branches.
        - id: ch02-b15
          speaker: narrator
          text: Copper-red men galloped across the enormous green prairies and shot arrows at buffalo. The buffalo turned to meet them with sharp horns. Nearby, an enormous cobra climbed a tall palm. It sprang onto a little llama grazing below. Knaps! The little llama was finished.
        - id: ch02-b16
          speaker: dream_boy
          text: Shall we land here?
        - id: ch02-b17
          speaker: lasse
          text: No. I'm afraid the buffalo will charge us, and that huge snake will eat us. Let's go somewhere else.
          emotion: fearful
        - id: ch02-b18
          speaker: dream_boy
          text: All right. Polynesia is only a little way from here.
        - id: ch02-b19
          speaker: narrator
          text: In the very same moment, they arrived.
    - id: ch03
      title: Hot Lands and Homeward Waters
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Polynesia felt as warm as a hot bath in Finland. Precious spices grew along the shore. There were pepper plants, cinnamon trees, ginger and saffron, along with coffee and tea plants.
        - id: ch03-b02
          speaker: narrator
          text: Brown people with long ears, thick lips, and faces painted in frightening colors hunted a yellow-spotted tiger among the tall bamboo. The tiger turned on them and sank its claws into one man. All the others fled.
        - id: ch03-b03
          speaker: dream_boy
          text: Shall we go ashore here?
        - id: ch03-b04
          speaker: lasse
          text: No. Can't you see that tiger by the pepper plant? Let's sail to another part of the world.
          emotion: fearful
        - id: ch03-b05
          speaker: dream_boy
          text: We can do that. Africa is quite near.
        - id: ch03-b06
          speaker: narrator
          text: As soon as the blue-eyed dream-boy said it, they were there. They dropped anchor at the mouth of a great river. Its banks were as green as the greenest velvet, but a vast desert began a little farther away.
        - id: ch03-b07
          speaker: narrator
          text: The air was yellow. The sun blazed as if it meant to burn the earth to ashes, and the people were as black as polished jet. They rode tall camels across the wide desert. Thirsty lions roared in the heat. Great crocodiles rose from the river, lifting gray heads like lizards and opening mouths full of sharp white teeth.
        - id: ch03-b08
          speaker: dream_boy
          text: Shall we land here?
        - id: ch03-b09
          speaker: lasse
          text: No. The sun would burn us, and the lions and crocodiles would eat us. Let's travel to another part of the world.
          emotion: fearful
        - id: ch03-b10
          speaker: dream_boy
          text: Then we can sail back to Europe.
        - id: ch03-b11
          speaker: narrator
          text: With that, Europe appeared. Its shore was cool, familiar, and friendly. The tall birch stood there with drooping leaves. The old crow perched at the top, and the gardener's black cat crept below.
        - id: ch03-b12
          speaker: narrator
          text: Not far away stood a house Lasse had seen before. Beside it lay a garden, and in the garden was a pea bed with long pods just like the ones he knew. An old gardener in a green coat walked about, wondering whether the cucumbers were ripe yet.
        - id: ch03-b13
          speaker: narrator
          text: Fylax barked on the steps and wagged his tail when he saw Lasse. Old Stina milked the cows in the farmyard. A very familiar lady in a checked woolen shawl was going to the bleaching green to see whether the clothes were ready.
        - id: ch03-b14
          speaker: narrator
          text: A well-known gentleman in a yellow summer coat walked by with a long pipe in his mouth. He was off to see whether the reapers had cut the rye. On the shore, a boy and girl ran and called to Lasse.
        - id: ch03-b15
          speakers: [brother, sister]
          ensemble: duo
          text: Little Lasse! Come home for bread and butter!
        - id: ch03-b16
          speaker: dream_boy
          text: Shall we land here?
        - id: ch03-b17
          speaker: narrator
          text: The dream-boy blinked his blue eyes mischievously.
        - id: ch03-b18
          speaker: lasse
          text: Come with me. I'll ask Mother to give you bread and butter and a glass of milk.
        - id: ch03-b19
          speaker: dream_boy
          text: Wait a moment.
        - id: ch03-b20
          speaker: narrator
          text: Now Lasse saw the open kitchen door. From inside came a low, pleasant sizzling, just like yellow batter being stirred with a wooden ladle into a hot frying pan.
        - id: ch03-b21
          speaker: dream_boy
          text: Perhaps we should sail back to Polynesia now?
          emotion: happy
        - id: ch03-b22
          speaker: lasse
          text: No. They're frying pancakes in Europe right now.
        - id: ch03-b23
          speaker: narrator
          text: Lasse tried to jump ashore, but he could not move. The dream-boy had bound him with a chain of flowers.
    - id: ch04
      title: The Song of the Dreams
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then all the little Dreams gathered around him. There were thousands upon thousands of them, all looking like little children. They formed a ring around Lasse and began to sing.
        - id: ch04-b02
          speakers: [dream_1, dream_2, dream_3, dream_4]
          ensemble: chorus
          text: The world is very, very wide, Little Lasse, Lasse. Though you've sailed beyond the tide, you can never tell how wide it is on the other side, Lasse, Little Lasse.
        - id: ch04-b03
          speakers: [dream_1, dream_2, dream_3, dream_4]
          ensemble: chorus
          text: You have found it cold and hot, Little Lasse, Lasse. But there is no land where God is not, Lasse, Little Lasse. Many people live there as they do here, and every one of them is dear to God, Lasse, Little Lasse.
        - id: ch04-b04
          speakers: [dream_1, dream_2, dream_3, dream_4]
          ensemble: chorus
          text: When His angel is your guide, Little Lasse, Lasse, no harm can come to you, even far across the tide, where the wild beasts wander.
        - id: ch04-b05
          speakers: [dream_1, dream_2, dream_3, dream_4]
          ensemble: chorus
          text: But tell us, when you roam, isn't home the best of all the lands you've seen, Lasse, Little Lasse?
        - id: ch04-b06
          speaker: narrator
          text: When their song was over, the Dreams skipped away. Nukku Matti carried Lasse back to the boat. The boy lay perfectly still for a long while. He could still hear the frying pan sizzling over the fire at home. The sizzling sounded plain and very near. At last he woke and rubbed his eyes.
        - id: ch04-b07
          speaker: narrator
          text: He was lying in the same boat where he had fallen asleep. The wind had changed. One wind had carried the boat away from shore, and another had brought it back while he slept. The sound he had mistaken for a frying pan was the quiet murmur of waves washing over the stones.
        - id: ch04-b08
          speaker: narrator
          text: Yet he was not entirely mistaken. The clear blue sea is like a great pan where God's sun spends the whole day making cakes for good children.
        - id: ch04-b09
          speaker: narrator
          text: Lasse rubbed the sleep from his eyes and looked around. Everything was just as before. The crow sat in the birch, the cat waited on the grass, and the pea-shell fleet lay near the shore.
        - id: ch04-b10
          speaker: narrator
          text: Some ships had sunk, while others had drifted back to land. Hercules had returned with its cargo from Asia. The Flea had come home from Polynesia. All the other parts of the world stood exactly where Lasse had left them.
        - id: ch04-b11
          speaker: narrator
          text: Little Lasse did not know what to think. He had visited that grotto in the Land of Nod many times, yet he knew nothing about the tricks dreams can play. He did not puzzle over it for long. He gathered his boats and walked along the shore toward the house.
    - id: ch05
      title: Home from Around the World
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: His brother and sister ran out to meet him, calling while they were still some distance away.
        - id: ch05-b02
          speakers: [brother, sister]
          ensemble: duo
          text: Where have you been all this time, Lasse? Come home and have some bread and butter!
        - id: ch05-b03
          speaker: narrator
          text: The kitchen door stood open. A strange sizzling came from inside. Near the gate, the gardener watered the dill and parsley, the carrots and parsnips.
        - id: ch05-b04
          speaker: gardener
          text: Well now, where has Little Lasse been for so long?
        - id: ch05-b05
          speaker: narrator
          text: Lasse drew himself up very straight before he answered.
        - id: ch05-b06
          speaker: lasse
          text: I sailed around the world in a pea-shell boat.
        - id: ch05-b07
          speaker: gardener
          text: Oh!
          emotion: surprised
        - id: ch05-b08
          speaker: narrator
          text: Little Lasse has forgotten Dreamland. But you have not forgotten it, because you know it is there. You remember its lovely grotto and the bright silver walls whose shine never fades. You remember the sparkling diamonds that never grow dim, and the music that never stops its soft, low murmur through the sweet evening twilight.
        - id: ch05-b09
          speaker: narrator
          text: Dreamland's light, fairy fancies never grow old. Like the glorious stars above us, they stay forever young. Perhaps you once caught a glimpse of their airy wings as they fluttered around your pillow.
        - id: ch05-b10
          speaker: narrator
          text: Perhaps you met the same blue-eyed, fair-haired dream-boy. He wore a red cap with a silver band and a white coat with pearls around the collar. Perhaps he took you to see every kind of country and people in the world. He may have shown you frozen wastelands and burning deserts, people of many colors, and wild creatures living in the sea and in the woods.
        - id: ch05-b11
          speaker: narrator
          text: Perhaps he showed you all those things so that you could learn a great deal, yet still come gladly home.
        - id: ch05-b12
          speaker: narrator
          text: Who knows? Perhaps you, too, once sailed around the wide world in a pea-shell boat.
