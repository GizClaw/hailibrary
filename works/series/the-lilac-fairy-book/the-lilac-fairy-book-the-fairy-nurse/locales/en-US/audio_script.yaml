    child_1:
      display_name: Older Child
      tts:
        delivery: direct and earnest
        timbre: clear and youthful
        pace: conversational
        pitch: high
    child_2:
      display_name: Younger Child
      tts:
        delivery: open and easily startled
        timbre: soft and youthful
        pace: conversational
