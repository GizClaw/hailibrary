audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    manawyddan:
      display_name: Manawyddan
      tts:
        delivery: thoughtful, steadfast, and quietly commanding
        timbre: deep and clear
        pace: measured
        pitch: medium-low
    pryderi:
      display_name: Pryderi
      tts:
        delivery: loyal, bold, and quick to act
        timbre: youthful and resonant
        pace: conversational
        pitch: medium
    rhiannon:
      display_name: Rhiannon
      tts:
        delivery: intelligent, warm, and resolute
        timbre: rich and clear
        pace: measured
        pitch: medium
    kieva:
      display_name: Kieva
      tts:
        delivery: gentle, practical, and sincere
        timbre: soft and clear
        pace: conversational
        pitch: medium-high
    scholar:
      display_name: Scholar
      tts:
        delivery: courteous, curious, and persuasive
        timbre: lean and weathered
        pace: measured
        pitch: medium
    priest:
      display_name: Priest
      tts:
        delivery: dignified, disapproving, and persuasive
        timbre: mature and rounded
        pace: measured
        pitch: medium-low
    bishop:
      display_name: Bishop
      tts:
        delivery: commanding, guarded, and increasingly urgent
        timbre: full and authoritative
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Empty Land
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Prince Manawyddan and his friend Pryderi had become wanderers. Manawyddan's brother had been killed, and another man had taken his throne. The prince was full of sorrow, but Pryderi kept his courage. He told his friend not to lose heart, because he knew a way out of his trouble.
        - id: ch01-b02
          speaker: manawyddan
          text: What way do you mean?
        - id: ch01-b03
          speaker: pryderi
          text: Marry my mother, Rhiannon. I will give her my fair lands as a dowry, and you can become their lord. No woman has more sense than she does. She was the loveliest of women when she was young, and she is still beautiful now.
        - id: ch01-b04
          speaker: manawyddan
          text: No man ever had a better friend. Come, let us find Rhiannon and see the lands where she lives.
        - id: ch01-b05
          speaker: narrator
          text: They started on their way, but word of their coming reached the women first. Rhiannon and Pryderi's wife, Kieva, hurried to prepare a feast. When Manawyddan arrived, he saw that every word Pryderi had said about his mother was true. He asked Rhiannon to marry him, and she gladly agreed. They married at once, without any delay.
        - id: ch01-b06
          speaker: narrator
          text: Afterward, all four rode out hunting together. Rhiannon stayed beside Manawyddan, and Kieva beside Pryderi. Their love was so great that they never wished to part, by night or by day.
        - id: ch01-b07
          speaker: narrator
          text: One day, after the hunt, they sat together in a green meadow. Without warning, thunder crashed above them. A wall of mist swept between them, hiding each one from the others. They sat trembling until the darkness lifted and daylight returned.
        - id: ch01-b08
          speaker: narrator
          text: Then they looked around. The cattle and herds were gone. So were the houses, the people, and even the smoke from their fires. Of everyone who had gathered in that green place, only the four of them remained.
        - id: ch01-b09
          speaker: manawyddan
          text: Where has everyone gone? What became of all my people?
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: They searched the hall and found no one. They searched the castle and found no one there either. Wild beasts had taken over the abandoned homes. For a whole year, the four lived on animals that Manawyddan and Pryderi hunted, along with honey gathered by bees among the mountain heather. At first, they wanted nothing more. But when the next year began, they grew tired of that life.
        - id: ch01-b11
          speaker: manawyddan
          text: We cannot live this way forever. Let us go to England, learn a trade, and earn what we need.
    - id: ch02
      title: Three Trades in England
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The four left Wales and settled in Hereford. There they made saddles, and Manawyddan decorated the trappings with blue enamel. The people of the town liked their work so much that they stopped buying anyone else's saddles. At last, the other saddlers joined together and planned to kill Manawyddan and his companions.
        - id: ch02-b02
          speaker: narrator
          text: When Pryderi learned of the plot, he was furious and wanted to stay and fight. Manawyddan persuaded him to leave instead. That night, they slipped away to another city.
        - id: ch02-b03
          speaker: pryderi
          text: What trade should we try here?
        - id: ch02-b04
          speaker: manawyddan
          text: We will make shields.
        - id: ch02-b05
          speaker: pryderi
          text: But do either of us know how?
        - id: ch02-b06
          speaker: manawyddan
          text: We can learn by trying.
        - id: ch02-b07
          speaker: narrator
          text: They copied the shapes of shields they had seen and covered their new shields with enamel. Once again, their work prospered. Soon, no one in the city bought a shield unless Manawyddan and Pryderi had made it. Then the shield-makers joined together, just as the saddlers had, and plotted to kill them. A warning reached the friends in time, and they escaped by night to another town.
        - id: ch02-b08
          speaker: manawyddan
          text: This time, let us make shoes. Surely the shoemakers will not be bold enough to fight us.
        - id: ch02-b09
          speaker: narrator
          text: Pryderi looked down on such a peaceful trade.
        - id: ch02-b10
          speaker: pryderi
          text: I know nothing at all about making shoes.
        - id: ch02-b11
          speaker: manawyddan
          text: I do. I will teach you how to stitch them. We can buy leather that is already dressed and make our shoes from that.
        - id: ch02-b12
          speaker: narrator
          text: Manawyddan found the finest leather in town. Then he hired a goldsmith to make the clasps. He stayed and watched until every clasp was finished, learning the goldsmith's work for himself. Before long, people called him the Maker of Gold Shoes. His shoes sold so well that the town's own shoemakers could sell none of theirs. Furious, they too joined together to kill the newcomers.
        - id: ch02-b13
          speaker: manawyddan
          text: Pryderi, we will stay in England no longer. It is time to return to Dyved.
        - id: ch02-b14
          speaker: narrator
          text: So they traveled back to their lands at Narberth. They gathered their dogs around them and lived by hunting for another year.
    - id: ch03
      title: The Enchanted Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then, one morning, something strange happened. Manawyddan and Pryderi set out to hunt and released their dogs. The animals ran ahead until they reached a small bush. There they suddenly backed away in fear and returned to their masters with the hair standing up along their backs.
        - id: ch03-b02
          speaker: pryderi
          text: We must find out what is hiding in that bush.
        - id: ch03-b03
          speaker: narrator
          text: A boar stepped out, its hide as white as snow on the mountains. The men urged their dogs forward, but the boar stood against them for a long time. At last it turned and ran. It fled into a newly built castle that stood where no building had ever been before. The dogs raced in after it.
        - id: ch03-b04
          speaker: narrator
          text: Manawyddan and Pryderi watched and listened, but no dog came back. They heard nothing from the boar either.
        - id: ch03-b05
          speaker: pryderi
          text: I am going inside to learn what happened to the dogs.
        - id: ch03-b06
          speaker: manawyddan
          text: That would be a foolish thing to do. Whoever enchanted this land must have put the castle here.
        - id: ch03-b07
          speaker: pryderi
          text: I cannot abandon my dogs.
        - id: ch03-b08
          speaker: narrator
          text: Pryderi entered the castle. He found no person or animal inside, not even the boar or the dogs. In the courtyard stood a fountain edged with marble, and on its rim rested a golden bowl covered in beautiful workmanship. The sight of it delighted him so much that he forgot the dogs. He reached out and seized the bowl.
        - id: ch03-b09
          speaker: narrator
          text: At once, both hands stuck fast to the gold, and both feet clung to the marble beneath him. Pryderi could not move. Despair came over him.
        - id: ch03-b10
          speaker: narrator
          text: Manawyddan waited until the day was nearly gone. As the sun sank, he returned home, thinking Pryderi must have wandered far away.
        - id: ch03-b11
          speaker: rhiannon
          text: Where is your friend? And where are the dogs?
        - id: ch03-b12
          speaker: narrator
          text: Manawyddan told her about the boar, the strange castle, and Pryderi's decision to enter it.
        - id: ch03-b13
          speaker: rhiannon
          text: Then you have lost a good friend.
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: Rhiannon went straight to the castle. The gate stood open, and she passed through it. In the middle of the courtyard, she saw Pryderi standing beside the golden bowl and hurried to him.
        - id: ch03-b15
          speaker: rhiannon
          text: Pryderi, what are you doing here?
        - id: ch03-b16
          speaker: narrator
          text: As she spoke, Rhiannon laid one hand on the bowl. She too became stuck and could not say another word. Thunder sounded overhead. A veil of darkness dropped around mother and son, and the castle vanished with both of them inside.
        - id: ch03-b17
          speaker: narrator
          text: When Kieva realized that neither her husband nor his mother was coming back, her grief was so deep that she no longer cared whether she lived or died. Manawyddan grieved too.
        - id: ch03-b18
          speaker: manawyddan
          text: We should not remain here. We have lost our dogs, and now we cannot find enough food. Let us return to England, where it will be easier to live.
        - id: ch03-b19
          speaker: narrator
          text: Kieva went with him.
        - id: ch03-b20
          speaker: kieva
          text: What work will you do this time?
        - id: ch03-b21
          speaker: manawyddan
          text: I will make shoes again.
        - id: ch03-b22
          speaker: narrator
          text: Manawyddan bought the best leather in town and had gilded clasps made for the shoes. Everyone came to buy from him, while the other shoemakers sat idle. Soon they banded together in anger and planned to kill him. Luckily, word reached Manawyddan in time. He and Kieva left town one night and went back to Narberth, taking a sheaf of wheat with them.
    - id: ch04
      title: The Thief in the Wheat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Manawyddan carried a sheaf of wheat home with him. At Narberth, he sowed it in three separate fields. While the wheat grew, he hunted and fished, so he and Kieva had more than enough to eat. The months passed, and harvest time came. One evening, he visited the farthest field and found the wheat ripe.
        - id: ch04-b02
          speaker: manawyddan
          text: I will harvest this field tomorrow.
        - id: ch04-b03
          speaker: narrator
          text: But when he returned the next morning, every ear of wheat was gone. Only bare straw remained. Dismayed, he hurried to the second field. Its grain was still there, ripe and golden.
        - id: ch04-b04
          speaker: manawyddan
          text: Then I will harvest this one tomorrow.
        - id: ch04-b05
          speaker: narrator
          text: The next morning, that grain had vanished too. Again, he found nothing but bare straw.
        - id: ch04-b06
          speaker: manawyddan
          text: At least one field remains, and it is finer than the other two. I will watch it tonight. Whoever stole the first two harvests will come for this one as well, and then I will see who the thief is.
        - id: ch04-b07
          speaker: narrator
          text: He hid near the field and waited. The hours passed in such deep silence that he nearly fell asleep. Then, at midnight, the loudest commotion in the world broke out. Manawyddan peered from his hiding place and saw a vast army of mice, too many to count or measure.
        - id: ch04-b08
          speaker: narrator
          text: A mouse climbed every stalk. Its weight bent the straw down, and then it bit off the ear of wheat and carried it away. There was not a single stalk without a mouse upon it.
        - id: ch04-b09
          speaker: narrator
          text: Manawyddan rushed at them in a fury. But he could no more catch those mice than he could catch gnats or birds in the air. Only one lagged behind. He overtook it, bent down, and caught it by the tail. Then he put it inside his glove and tied a string tightly across the opening.
        - id: ch04-b10
          speaker: narrator
          text: Back in the hall, Manawyddan lit a fire and hung the glove from a peg. Kieva was sitting nearby.
        - id: ch04-b11
          speaker: kieva
          text: What have you put in there?
        - id: ch04-b12
          speaker: manawyddan
          text: A thief I caught stealing from me.
        - id: ch04-b13
          speaker: kieva
          text: What sort of thief is small enough to fit inside your glove?
        - id: ch04-b14
          speaker: narrator
          text: Manawyddan explained how the wheat had disappeared from two fields. Then he told Kieva how he had kept watch and seen the army of mice.
        - id: ch04-b15
          speaker: manawyddan
          text: This one was slower than the rest, so now it is trapped in my glove. Tomorrow I will hang it. I only wish I had caught them all.
          emotion: angry
        - id: ch04-b16
          speaker: kieva
          text: It is certainly a wonder. Still, a man of your rank should not hang a low creature like a mouse. Leave it alone and set it free.
        - id: ch04-b17
          speaker: manawyddan
          text: If I could catch every one of them, I would hang them all. I have this one, and this one will hang.
          emotion: angry
        - id: ch04-b18
          speaker: kieva
          text: I have no reason to defend the creature. I only want to save you from doing something beneath your dignity.
        - id: ch04-b19
          speaker: manawyddan
          text: If I knew any reason to spare it, I would listen to you. But I know of none, so I mean to kill it.
        - id: ch04-b20
          speaker: kieva
          text: Then do as you have decided.
    - id: ch05
      title: Three Offers for a Mouse
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Manawyddan climbed a hill and planted two forked sticks at its top. While he worked, he saw a scholar in torn clothing walking toward him. Seven years had passed since Manawyddan had seen any person or animal in that land, so the sight astonished him.
        - id: ch05-b02
          speaker: scholar
          text: Good day, my lord.
        - id: ch05-b03
          speaker: manawyddan
          text: And good day to you, scholar. Where have you come from?
        - id: ch05-b04
          speaker: scholar
          text: I have been singing in England. Why do you ask?
        - id: ch05-b05
          speaker: manawyddan
          text: Because no one has visited this place in seven years.
        - id: ch05-b06
          speaker: scholar
          text: I go wherever I please. But what are you building there?
        - id: ch05-b07
          speaker: manawyddan
          text: A gallows. I caught a thief stealing from me, and I am going to hang it.
        - id: ch05-b08
          speaker: scholar
          text: What kind of thief? That creature in your hand looks like a mouse. It is not fitting for a man of your rank to touch such a thing. Let it go.
        - id: ch05-b09
          speaker: manawyddan
          text: I will not. I caught it robbing me, and it will meet a thief's punishment.
        - id: ch05-b10
          speaker: scholar
          text: My lord, I would rather give you the pound I received in alms than watch a man like you do such work. Take it and free the mouse.
        - id: ch05-b11
          speaker: manawyddan
          text: I will neither free it nor sell it.
        - id: ch05-b12
          speaker: scholar
          text: As you wish, my lord.
        - id: ch05-b13
          speaker: narrator
          text: The scholar went on his way. Manawyddan was setting a crossbar across the two forked sticks when a priest rode past.
        - id: ch05-b14
          speaker: priest
          text: Good day, my lord. What are you doing?
        - id: ch05-b15
          speaker: manawyddan
          text: I am hanging a thief I caught stealing from me.
        - id: ch05-b16
          speaker: priest
          text: What sort of thief is it?
        - id: ch05-b17
          speaker: manawyddan
          text: It has the shape of a mouse. It robbed me, and it will be punished as a thief.
        - id: ch05-b18
          speaker: priest
          text: My lord, I would rather buy its freedom than see you touch such a creature.
        - id: ch05-b19
          speaker: manawyddan
          text: I will not sell it, and I will not let it go.
        - id: ch05-b20
          speaker: priest
          text: A mouse is worth nothing, of course. But to keep you from lowering yourself this way, I will pay you three pounds for it.
        - id: ch05-b21
          speaker: manawyddan
          text: No price will buy it. The mouse deserves to hang, and hang it shall.
        - id: ch05-b22
          speaker: priest
          text: Very well, my lord, if that is what you want.
        - id: ch05-b23
          speaker: narrator
          text: The priest rode away. Manawyddan tied a noose around the mouse's neck and was about to pull it tight. Just then, a bishop approached with a great company behind him. Packhorses carried seven enormous loads.
        - id: ch05-b24
          speaker: bishop
          text: What are you doing there?
        - id: ch05-b25
          speaker: manawyddan
          text: Hanging a thief I caught in the act of robbing me.
        - id: ch05-b26
          speaker: bishop
          text: Is that not a mouse in your hand?
        - id: ch05-b27
          speaker: manawyddan
          text: Yes. That mouse is the thief.
        - id: ch05-b28
          speaker: bishop
          text: Since I have arrived in time to see its punishment, I will pay you seven pounds to spare it. A man of your standing should not touch such a creature. Untie it and let it go.
        - id: ch05-b29
          speaker: manawyddan
          text: I will not free it.
        - id: ch05-b30
          speaker: bishop
          text: Then I will give you twenty-four pounds.
        - id: ch05-b31
          speaker: manawyddan
          text: I would not release it for twice that amount.
        - id: ch05-b32
          speaker: bishop
          text: Take every horse you see, along with all seven loads they carry.
        - id: ch05-b33
          speaker: manawyddan
          text: No. The mouse stays with me.
        - id: ch05-b34
          speaker: bishop
          text: Name the price that will make you release it, and I will pay.
    - id: ch06
      title: The Bishop's Secret
      blocks:
        - id: ch06-b01
          speaker: manawyddan
          text: First, you must free Rhiannon and Pryderi from the spells upon them.
        - id: ch06-b02
          speaker: bishop
          text: It will be done.
        - id: ch06-b03
          speaker: manawyddan
          text: I will not release the mouse yet. You must also lift the enchantment from all my lands.
        - id: ch06-b04
          speaker: bishop
          text: That will be done too.
        - id: ch06-b05
          speaker: manawyddan
          text: I still will not free it until you tell me who this mouse truly is.
        - id: ch06-b06
          speaker: bishop
          text: She is my wife.
        - id: ch06-b07
          speaker: manawyddan
          text: Why did she come to steal from me?
        - id: ch06-b08
          speaker: bishop
          text: She came to ruin you. I was the one who enchanted your lands, because I wanted vengeance for my friend Gwawl, son of Clud. I also cast the spell on Pryderi. Gwawl had been tricked in the game of Badger in the Bag, and I meant to avenge him.
        - id: ch06-b09
          speaker: bishop
          text: My people were angry too. When they heard that you had returned to live here, they begged me to turn them into mice so they could eat your wheat. The men of my household destroyed your first field and then your second.
        - id: ch06-b10
          speaker: bishop
          text: On the third night, my wife and her ladies asked to become mice as well, so they could share in the revenge. I granted their wish. If my wife had not been ill and slow, you never could have caught her.
        - id: ch06-b11
          speaker: bishop
          text: But you did catch her. So I will bring back Pryderi and Rhiannon, and I will lift the spell from your lands. Now you know who the mouse is. Set her free.
        - id: ch06-b12
          speaker: manawyddan
          text: Not until you swear that no one will take revenge for this. You must promise that Pryderi, Rhiannon, and I will all be safe.
        - id: ch06-b13
          speaker: bishop
          text: I grant what you ask. You were wise to demand it, because otherwise all the trouble would have fallen on your head. Now release my wife.
        - id: ch06-b14
          speaker: manawyddan
          text: I will not free her until Pryderi and Rhiannon stand here beside me.
        - id: ch06-b15
          speaker: bishop
          text: Look. Here they come now.
        - id: ch06-b16
          speaker: narrator
          text: Manawyddan reached out both hands to greet his friends. Then Pryderi and Rhiannon sat joyfully with him on the grass.
        - id: ch06-b17
          speaker: bishop
          text: My lord, you have received everything you asked for. Will you free my wife now?
        - id: ch06-b18
          speaker: manawyddan
          text: Gladly.
        - id: ch06-b19
          speaker: narrator
          text: Manawyddan loosened the cord from the mouse's neck. As soon as he did, the bishop struck her with his staff. The mouse became a young woman, more beautiful than any woman they had ever seen.
        - id: ch06-b20
          speaker: bishop
          text: Look across your land. You will find it farmed and filled with people again, just as it was long ago.
        - id: ch06-b21
          speaker: narrator
          text: Manawyddan looked. Wheat grew in the fields once more. Cows and sheep grazed along the hillsides, and huts stood ready for the people who lived there. He was satisfied at last, though he still had one question for the bishop.
        - id: ch06-b22
          speaker: manawyddan
          text: What exactly did your spells do to Pryderi and Rhiannon?
        - id: ch06-b23
          speaker: bishop
          text: Pryderi had to carry the gate knockers from my palace around his neck. Rhiannon had to carry the collars of my donkeys around hers.
        - id: ch06-b24
          speaker: narrator
          text: The bishop smiled as he spoke.
