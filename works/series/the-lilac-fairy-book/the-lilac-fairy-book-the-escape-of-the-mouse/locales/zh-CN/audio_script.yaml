audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    manawydan:
      display_name: 玛纳威丹
      tts:
        delivery: 历经忧患而沉着机敏，决断时坚定有力
        timbre: 沉稳宽厚的成年男声
        pace: 适中偏缓
        pitch: 中低
    pryderi:
      display_name: 普里德里
      tts:
        delivery: 坦率勇敢，行动果决，激动时语速稍快
        timbre: 明亮有力的年轻男声
        pace: 适中
        pitch: 中
    rhiannon:
      display_name: 里安农
      tts:
        delivery: 聪慧端庄，关切亲人时真挚急切
        timbre: 温润清晰的成年女声
        pace: 适中
        pitch: 中
    cigfa:
      display_name: 基耶娃
      tts:
        delivery: 温柔敏锐，悲伤时克制，劝说时诚恳
        timbre: 清澈柔和的年轻女声
        pace: 适中
        pitch: 中高
    scholar:
      display_name: 学者
      tts:
        delivery: 谦恭谨慎，劝阻时恳切而不失分寸
        timbre: 略显疲惫的成年男声
        pace: 适中
        pitch: 中
    priest:
      display_name: 祭司
      tts:
        delivery: 庄重客气，出价时从容而坚持
        timbre: 清楚平稳的成年男声
        pace: 适中偏缓
        pitch: 中低
    bishop:
      display_name: 主教
      tts:
        delivery: 起初威严镇定，谈判受制后坦白而急切
        timbre: 浑厚有威仪的成年男声
        pace: 适中偏缓
        pitch: 低
  chapters:
    - id: ch01
      title: 浓雾后的荒原
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛纳威丹王子和好友普里德里四处漂泊。玛纳威丹的兄弟被人杀害，王位也落入别人手中，他一直沉在悲苦里。普里德里却没有灰心，还想出了一个办法，要帮朋友走出困境。
        - id: ch01-b02
          speaker: manawydan
          text: “你说的是什么办法？”
        - id: ch01-b03
          speaker: pryderi
          text: “娶我的母亲里安农吧，那片美丽的土地也会成为你的领地，我把它作为嫁妆送给她。再也找不到比她更聪慧的夫人了。她年轻时美貌无人能及，如今依然动人。”
        - id: ch01-b04
          speaker: manawydan
          text: “你真是我最好的朋友。走，我们现在就去里安农的领地。”
        - id: ch01-b05
          speaker: narrator
          text: 两人立刻上路，他们到来的消息却先一步传了过去。里安农和普里德里的妻子基耶娃备好宴席迎接他们。玛纳威丹见到里安农，知道普里德里没有半句夸大，便向她求婚。里安农高兴地答应了，他们马上举行了婚礼。
        - id: ch01-b06
          speaker: narrator
          text: 从那以后，里安农陪着玛纳威丹，基耶娃陪着普里德里，四个人总是一同骑马打猎，日夜都舍不得分开。他们彼此信赖，情谊一天比一天深厚。
        - id: ch01-b07
          speaker: narrator
          text: 一天，他们打猎归来，坐在绿地上歇息。忽然，一声霹雳震得人耳朵发疼，一堵浓雾落在四人中间，谁也看不见谁。他们浑身发抖，只能坐着等待。黑暗终于散去，天又亮了，眼前的世界却完全变了。
        - id: ch01-b08
          speaker: narrator
          text: 原本遍地都是牛羊和房屋，如今没有屋舍，没有牲畜，没有人，也没有一缕炊烟。整片绿地上，只剩他们四个。
        - id: ch01-b09
          speaker: manawydan
          text: “人都去了哪里？连我的随从也不见了！”
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: 他们搜遍厅堂，又找遍城堡，一个人也没找到。其余房屋里除了野兽，也什么都没有。整整一年，玛纳威丹和普里德里靠打猎供大家吃肉，他们还吃蜜蜂采了山间石南花蜜酿出的蜂蜜。起先四人不觉得缺什么，到了第二年，终于厌倦了这种生活。
        - id: ch01-b11
          speaker: manawydan
          text: “我们不能永远这样活着。去英格兰吧，学一门能养活自己的手艺。”

    - id: ch02
      title: 三门手艺
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 四人离开威尔士，到了赫里福德，开始制作马鞍。玛纳威丹还做出蓝色珐琅饰件，装在马具上。城里人太喜欢他们的马鞍了，再也不肯买别人的货。当地马鞍匠没有了生意，便联合起来，打算杀死他们。
        - id: ch02-b02
          speaker: narrator
          text: 普里德里听到风声，顿时怒不可遏，执意要留下来同那些工匠交战。玛纳威丹好不容易劝住了他，四人连夜搬到另一座城。
        - id: ch02-b03
          speaker: pryderi
          text: “这一回，我们靠什么手艺谋生？”
        - id: ch02-b04
          speaker: manawydan
          text: “做盾牌。”
        - id: ch02-b05
          speaker: pryderi
          text: “可是，我们会做盾牌吗？”
        - id: ch02-b06
          speaker: manawydan
          text: “动手试试，自然就知道了。”
        - id: ch02-b07
          speaker: narrator
          text: 他们照着见过的盾牌做，也在上面镶了珐琅。生意很快兴旺起来，城里人买盾牌，只肯买他们做的。结果，盾牌匠也像先前的马鞍匠一样，合谋要他们的命。他们提前听见消息，再一次趁夜逃走。
        - id: ch02-b08
          speaker: manawydan
          text: “这次改做鞋吧。鞋匠总不至于胆大到敢来杀我们。”
        - id: ch02-b09
          speaker: pryderi
          text: “做鞋我可是一点都不会。”
        - id: ch02-b10
          speaker: narrator
          text: 普里德里嘴上这样说，心里还觉得做鞋太安稳，很看不上这门手艺。
        - id: ch02-b11
          speaker: manawydan
          text: “我会做，也可以教你缝。我们买来鞣好的皮革，直接拿来做鞋。”
        - id: ch02-b12
          speaker: narrator
          text: 玛纳威丹走遍全城，找来最好的皮革，又请金匠打造鞋扣。他守在旁边仔细看，顺便把金匠的本事也学会了。没过多久，人人都叫他“金鞋匠”。只要他还有鞋卖，就没人肯去照顾城里其他鞋匠的生意。那些工匠又气又恨，也联合起来要杀他们。
        - id: ch02-b13
          speaker: manawydan
          text: “英格兰不能再待了。我们回迪韦德去。”
        - id: ch02-b14
          speaker: narrator
          text: 他们回到纳伯斯的领地，重新召来猎犬，又像从前那样打了一年猎。

    - id: ch03
      title: 消失的城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一年后，一件怪事发生了。一天清晨，普里德里和玛纳威丹出去打猎，放开猎犬在前面跑。猎犬来到一丛矮树旁，忽然害怕地缩了回来，逃到主人身边，背上的毛全竖了起来。
        - id: ch03-b02
          speaker: pryderi
          text: “那片树丛里一定藏着什么，我们非看个明白不可。”
        - id: ch03-b03
          speaker: narrator
          text: 树丛里冲出一头野猪，浑身雪白，就像山巅的积雪。两人催猎犬追上去，野猪停下来抵挡了许久，最后转身逃进一座新建的城堡。那里从前分明没有任何建筑。猎犬也追进了城堡。两位主人等了又等，听了又听，却再没看见野猪和猎犬，也没听到半点声音。
        - id: ch03-b04
          speaker: pryderi
          text: “我要进城堡找一找，弄清猎犬去了哪里。”
        - id: ch03-b05
          speaker: manawydan
          text: “千万别进去，这太不明智了。有人对这片土地施了魔法，这座突然出现的城堡必定也是他放在这里的。”
        - id: ch03-b06
          speaker: pryderi
          text: “我不能扔下自己的猎犬不管。”
        - id: ch03-b07
          speaker: narrator
          text: 普里德里走进城堡，里面没有人，也没有野兽，猎犬和野猪全都不见了。庭院里只有一眼泉水，四周砌着大理石。泉边摆着一只雕刻精美的金碗，普里德里一看就喜欢得不得了，连猎犬都忘了。他上前握住金碗，双手立刻粘在碗上，双脚也粘在石板上。他再也动不了，心中只剩绝望。
        - id: ch03-b08
          speaker: narrator
          text: 玛纳威丹一直等到太阳快要落山。他以为普里德里走远后迷了路，只好独自回家。
        - id: ch03-b09
          speaker: rhiannon
          text: “你的朋友呢？猎犬又在哪里？”
        - id: ch03-b10
          speaker: narrator
          text: 玛纳威丹把经过告诉了她。
        - id: ch03-b11
          speaker: rhiannon
          text: “你已经失去了一位好朋友。”
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: 里安农赶到城堡，从敞开的大门走进去。她看见普里德里站在庭院中央，急忙向他跑去。
        - id: ch03-b13
          speaker: rhiannon
          text: “你站在这里做什么？”
        - id: ch03-b14
          speaker: narrator
          text: 她问话时把手放上金碗，话音才落，也被牢牢粘住，再说不出一个字。紧接着，雷声轰鸣，一层黑幕罩住两人。城堡消失了，里安农和普里德里也跟着不见了。
        - id: ch03-b15
          speaker: narrator
          text: 基耶娃等不到丈夫和婆婆回来，悲痛得连自己的死活都不在乎了。玛纳威丹心里也承受着同样的悲伤，却还是劝她离开。
        - id: ch03-b16
          speaker: manawydan
          text: “这里不能再住下去了。猎犬全丢了，我们连食物也找不到。去英格兰吧，在那里更容易谋生。”
        - id: ch03-b17
          speaker: narrator
          text: 两人就这样上了路。
        - id: ch03-b18
          speaker: cigfa
          text: “到了英格兰，你准备做什么？”
        - id: ch03-b19
          speaker: manawydan
          text: “还是做鞋，跟从前一样。”
        - id: ch03-b20
          speaker: narrator
          text: 玛纳威丹买来城中最好的皮革，又请人打造镀金的鞋扣。人人争着买他的鞋，别的鞋匠没了生意，便气愤地联合起来，想要杀死他。玛纳威丹及时听到消息，连夜带基耶娃离开，回到了纳伯斯。

    - id: ch04
      title: 麦田里的鼠群
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 玛纳威丹带回一捆麦子，分种在三块田里。等待麦子生长时，他靠打猎和捕鱼过活，得到的食物不但够两人吃，还有富余。几个月后，收获季节到了。他在傍晚来到最远的麦田，看见麦穗已经熟透。
        - id: ch04-b02
          speaker: manawydan
          text: “明天就来收割这一块。”
        - id: ch04-b03
          speaker: narrator
          text: 第二天，他再到田里，眼前只剩一地光秃秃的麦秆。他吃惊地赶往第二块田，那里的麦穗金黄饱满，也已经熟了。
        - id: ch04-b04
          speaker: manawydan
          text: “那就明天来收这块田。”
        - id: ch04-b05
          speaker: narrator
          text: 可到了第二天，麦穗又全不见了，田里依旧只剩秃秃的麦秆。
        - id: ch04-b06
          speaker: manawydan
          text: “幸好还剩最后一块，而且长得比前两块更好。今晚我就守在这里。偷走前两块麦子的人一定还会来，这次我要亲眼看看他是谁。”
        - id: ch04-b07
          speaker: narrator
          text: 他藏好身子，静静等着。时间一点点过去，四周没有任何声音，玛纳威丹差点睡着。到了午夜，忽然响起世间最喧闹的声音。他往外一看，只见数也数不清的老鼠像一支大军，涌进了麦田。
        - id: ch04-b08
          speaker: narrator
          text: 每只老鼠都爬上一根麦秆，用身体把它压弯，再咬下麦穗带走。整块田里，没有一根麦秆是空着的。
        - id: ch04-b09
          speaker: narrator
          text: 玛纳威丹气得扑向鼠群。可老鼠像小飞虫，也像空中的鸟，他一只也追不上。只有一只落在后面，被他赶上。他揪住它的尾巴，塞进手套，再用细绳扎紧手套口。回到基耶娃住的厅堂，他生起火，把手套挂在木钉上。
        - id: ch04-b10
          speaker: cigfa
          text: “你带回来的是什么？”
        - id: ch04-b11
          speaker: manawydan
          text: “一个被我当场捉住的贼。”
        - id: ch04-b12
          speaker: cigfa
          text: “什么贼这么小，竟然装得进一只手套？”
        - id: ch04-b13
          speaker: manawydan
          text: “我告诉你是怎么回事。”
        - id: ch04-b14
          speaker: narrator
          text: 玛纳威丹把两块麦田怎样被毁，自己又怎样守住最后一块田，全讲给基耶娃听。
        - id: ch04-b15
          speaker: manawydan
          text: “这只老鼠跑得比别的慢，现在就在手套里。明天我就绞死它。真希望其他老鼠也全被我捉住！”
          emotion: angry
        - id: ch04-b16
          speaker: cigfa
          text: “这事真奇怪。不过你身份高贵，亲手绞死这样一只小爬虫，实在不好看。别碰它了，放它走吧。”
        - id: ch04-b17
          speaker: manawydan
          text: “要是捉得到那些老鼠，我会把它们全部绞死。如今只有这一只落在我手里，我绝不会饶它！”
          emotion: angry
        - id: ch04-b18
          speaker: cigfa
          text: “说实话，我没有别的理由替它求情，只是不愿别人因为这件事嘲笑你。”
        - id: ch04-b19
          speaker: manawydan
          text: “只要有一个该救它的理由，我就会听你的。可现在半点理由也没有，所以我一定要取它的性命。”
        - id: ch04-b20
          speaker: cigfa
          text: “那就按你的意思办吧。”

    - id: ch05
      title: 老鼠的赎价
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 玛纳威丹登上一座小山，在山顶立起两根分杈的木棍。他正忙着，忽然看见一个衣衫破旧的学者朝自己走来。整整七年，这片土地上都没出现过一个人或一头牲畜，所以玛纳威丹惊讶极了。
        - id: ch05-b02
          speaker: scholar
          text: “大人，您好。”
        - id: ch05-b03
          speaker: manawydan
          text: “你好，学者。你是从哪里来的？”
        - id: ch05-b04
          speaker: scholar
          text: “我一直在英格兰卖唱，现在从那里过来。大人为什么这样问？”
        - id: ch05-b05
          speaker: manawydan
          text: “因为七年来，从没有人到这里来过。”
        - id: ch05-b06
          speaker: scholar
          text: “我想去哪里就去哪里。大人这是在做什么？”
        - id: ch05-b07
          speaker: manawydan
          text: “我要绞死一个被我当场捉住的贼！”
        - id: ch05-b08
          speaker: scholar
          text: “是什么样的贼？我看您手里好像只是一只老鼠。您这样有身份的人，不该亲手碰这种爬虫，还是把它放了吧。”
        - id: ch05-b09
          speaker: manawydan
          text: “我绝不放它！它偷了我的东西，就该受盗贼该受的刑罚。”
          emotion: angry
        - id: ch05-b10
          speaker: scholar
          text: “大人，我实在不忍心看您做这种事。您若肯放它，我愿把乞讨得来的一镑钱全送给您。”
        - id: ch05-b11
          speaker: manawydan
          text: “我不放，也不卖。”
        - id: ch05-b12
          speaker: scholar
          text: “那就由大人决定吧。”
        - id: ch05-b13
          speaker: narrator
          text: 学者走远了。玛纳威丹把横木架在两根木棍上，正要做成绞架，一个祭司骑马从旁边经过。
        - id: ch05-b14
          speaker: priest
          text: “大人，您好。您在这里做什么？”
        - id: ch05-b15
          speaker: manawydan
          text: “我要绞死一个被我当场捉住的贼。”
        - id: ch05-b16
          speaker: priest
          text: “那贼是什么模样？”
        - id: ch05-b17
          speaker: manawydan
          text: “是个长得像老鼠的东西。它偷了我的财物，理当受罚。”
        - id: ch05-b18
          speaker: priest
          text: “我不愿看您亲手碰这种爬虫。让我花钱把它赎下来吧。”
        - id: ch05-b19
          speaker: manawydan
          text: “我不会卖，也不会放。”
        - id: ch05-b20
          speaker: priest
          text: “老鼠本来一文不值，可您碰它有损身份。我出三镑钱，请您把它交给我。”
        - id: ch05-b21
          speaker: manawydan
          text: “出多少钱都没用。它犯了罪，非被绞死不可。”
        - id: ch05-b22
          speaker: priest
          text: “既然大人执意如此，那就这样办吧。”
        - id: ch05-b23
          speaker: narrator
          text: 祭司也离开了。玛纳威丹把细绳套上老鼠的脖子，刚要收紧，一位主教带着大队随从经过。队伍后面，还有许多驮着沉重行李的马。
        - id: ch05-b24
          speaker: bishop
          text: “你在做什么？”
        - id: ch05-b25
          speaker: manawydan
          text: “绞死一个被我当场捉住的贼。”
        - id: ch05-b26
          speaker: bishop
          text: “可你手里的东西，不就是一只老鼠吗？”
        - id: ch05-b27
          speaker: manawydan
          text: “不错，贼就是它。”
        - id: ch05-b28
          speaker: bishop
          text: “既然正好让我赶上，我出七镑钱赎它。你身份尊贵，不要亲手碰这种爬虫。解开绳子，放它走吧。”
        - id: ch05-b29
          speaker: manawydan
          text: “我不会放。”
        - id: ch05-b30
          speaker: bishop
          text: “那我出二十四镑。”
        - id: ch05-b31
          speaker: manawydan
          text: “就算再加一倍，我也不答应。”
        - id: ch05-b32
          speaker: bishop
          text: “如果钱还不够，眼前所有马匹，还有七驮行李，我全送给你。”
        - id: ch05-b33
          speaker: manawydan
          text: “我还是不放。”
        - id: ch05-b34
          speaker: bishop
          text: “那你究竟要什么？只要肯放它，无论什么条件我都答应。”
        - id: ch05-b35
          speaker: manawydan
          text: “先解除里安农和普里德里身上的魔法。”
        - id: ch05-b36
          speaker: bishop
          text: “我答应。”
        - id: ch05-b37
          speaker: manawydan
          text: “这还不够。笼罩我全部领地的魔法，也必须解除。”
        - id: ch05-b38
          speaker: bishop
          text: “这一条我也答应。”
        - id: ch05-b39
          speaker: manawydan
          text: “我仍然不能放。你还得告诉我，这只老鼠究竟是谁。”
        - id: ch05-b40
          speaker: bishop
          text: “她是我的妻子。”
        - id: ch05-b41
          speaker: manawydan
          text: “她为什么跑来毁我的麦田？”
        - id: ch05-b42
          speaker: bishop
          text: “她来这里，就是为了毁掉你的收成。对你的领地施魔法的人也是我。克吕德之子格瓦乌尔是我的朋友，我要替他报仇。普里德里身上的魔法同样出自我手，因为格瓦乌尔在那场‘袋中獾’游戏里受了戏弄。”
        - id: ch05-b43
          speaker: bishop
          text: “我的臣民也为此愤怒。他们知道你回来居住，就一再求我把他们变成老鼠，好吃掉你的麦子。头两夜，毁掉麦田的是我家中的男人。第三夜，我的妻子和她的侍女也求我把她们变成老鼠，一起去复仇，我便答应了。”
        - id: ch05-b44
          speaker: bishop
          text: “我的妻子正在生病，脚步比别的老鼠慢，不然你绝不可能追上她。如今她落在你手里，我愿意归还普里德里和里安农，也解除领地上的魔法。她的身份我已经说了，现在请你放了她。”
        - id: ch05-b45
          speaker: manawydan
          text: “我还不能放她。你必须发誓，从今往后，绝不因为这件事再向普里德里、里安农或我寻仇。”
        - id: ch05-b46
          speaker: bishop
          text: “我答应。你提出这一条十分明智，不然灾祸还会落到你头上。现在可以放了我的妻子吧？”
        - id: ch05-b47
          speaker: manawydan
          text: “等普里德里和里安农亲自来到我面前，我才会放她。”
        - id: ch05-b48
          speaker: bishop
          text: “看，他们已经来了。”
        - id: ch05-b49
          speaker: narrator
          text: 玛纳威丹伸出双手迎接他们。普里德里和里安农欢欢喜喜地走来，一起坐在草地上。
        - id: ch05-b50
          speaker: bishop
          text: “大人，你想要的不是都已经得到了吗？现在请放了我的妻子吧！”
        - id: ch05-b51
          speaker: manawydan
          text: “我很愿意。”
        - id: ch05-b52
          speaker: narrator
          text: 玛纳威丹解开老鼠颈上的绳子。主教同时用手杖轻轻敲了她一下，老鼠立刻变成一位年轻女子，美得世间无双。
        - id: ch05-b53
          speaker: bishop
          text: “看看你的领地。田里重新有人耕种，百姓也回来了，一切都恢复了从前的模样。”
        - id: ch05-b54
          speaker: narrator
          text: 玛纳威丹望向四周。田野里长着麦子，牛羊在山坡上吃草，百姓居住的小屋也重新出现。他心里十分满足，却还有一件事想问。
        - id: ch05-b55
          speaker: manawydan
          text: “你究竟对普里德里和里安农施了什么魔法？”
        - id: ch05-b56
          speaker: bishop
          text: “普里德里一直挂在我宫门上，成了门环。里安农呢，一直把我那些驴子的项圈套在颈上。”
        - id: ch05-b57
          speaker: narrator
          text: 主教说完，微微笑了。
