audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    ian:
      display_name: 伊恩
      tts:
        delivery: 诚恳坚韧，历经奇遇仍保有年轻人的坦率
        timbre: 清朗结实的青年男声
        pace: 适中
        pitch: 中
    stranger:
      display_name: 陌生猎人
      tts:
        delivery: 简洁爽快，语气平稳
        timbre: 沉稳的成年男声
        pace: 适中
        pitch: 中低
    mother:
      display_name: 伊恩的母亲
      tts:
        delivery: 贫困生活磨出的严厉与火爆
        timbre: 粗哑有力的中年女声
        pace: 适中偏快
        pitch: 中低
    farmer:
      display_name: 农夫
      tts:
        delivery: 淳朴热情，谈起庄稼时直截了当
        timbre: 厚实朴素的成年男声
        pace: 适中
        pitch: 中低
    princess:
      display_name: 浪底国王之女
      tts:
        delivery: 温柔而坚定，悲伤时克制，作出选择时庄严果决
        timbre: 清澈柔韧的年轻女声
        pace: 舒缓
        pitch: 中高
    robber_captain:
      display_name: 强盗头子
      tts:
        delivery: 冷酷多疑，命令短促凶狠
        timbre: 低沉粗粝的成年男声
        pace: 适中偏快
        pitch: 低
    robber_1:
      display_name: 强盗甲
      tts:
        delivery: 粗暴贪婪，容易发怒
        timbre: 沙哑的成年男声
        pace: 快
        pitch: 中低
    robber_2:
      display_name: 强盗乙
      tts:
        delivery: 粗暴贪婪，叫嚷时急躁
        timbre: 浑厚的成年男声
        pace: 快
        pitch: 中
    robber_3:
      display_name: 强盗丙
      tts:
        delivery: 粗暴贪婪，脾气凶横
        timbre: 尖硬的成年男声
        pace: 快
        pitch: 中高
    first_sister:
      display_name: 第一位姐妹
      tts:
        delivery: 亲切从容，像早已知道来客的命运
        timbre: 温和成熟的女声
        pace: 舒缓
        pitch: 中
    second_sister:
      display_name: 第二位姐妹
      tts:
        delivery: 热心明快，指点道路时清楚利落
        timbre: 清亮的成年女声
        pace: 适中
        pitch: 中
    bird_keeper:
      display_name: 飞鸟看守人
      tts:
        delivery: 深思熟虑，言语简短而笃定
        timbre: 安静低沉的青年男声
        pace: 适中偏慢
        pitch: 中低
    bird_1:
      display_name: 小鸟一
      tts:
        delivery: 忠诚机敏，回应主人时轻快恭敬
        timbre: 轻盈明亮的中性声线
        pace: 适中偏快
        pitch: 高
    bird_2:
      display_name: 小鸟二
      tts:
        delivery: 忠诚机敏，回应主人时轻快恭敬
        timbre: 清脆柔和的中性声线
        pace: 适中偏快
        pitch: 中高
    bird_3:
      display_name: 小鸟三
      tts:
        delivery: 忠诚机敏，回应主人时轻快恭敬
        timbre: 透亮活泼的中性声线
        pace: 适中偏快
        pitch: 高
    weaver:
      display_name: 织布匠
      tts:
        delivery: 好客健谈，独居生活使他格外珍惜陪伴
        timbre: 温厚平实的成年男声
        pace: 适中
        pitch: 中
    king:
      display_name: 浪底国王
      tts:
        delivery: 威严武断，面对众人时习惯发号施令
        timbre: 洪亮端正的成年男声
        pace: 适中偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 鹿引向强盗的小屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，爱尔兰有个年轻人，名叫伊恩。一天，他牵着一匹强壮的挽马走在路上，手里还握着缰绳。他心里一直惦记母亲。做渔夫的父亲葬身海上以后，母子俩穷得厉害。伊恩正愁该做些什么，才养得活自己和母亲，忽然有人从后面按住了他的肩膀。
        - id: ch01-b02
          speaker: stranger
          text: “渔夫的儿子，你愿意把这匹马卖给我吗？”
        - id: ch01-b03
          speaker: narrator
          text: 伊恩回头一看，路上站着一个陌生人。他手里拿着枪，肩上停着猎鹰，脚边还跟着一条狗。
        - id: ch01-b04
          speaker: ian
          text: “你打算用什么来换？把你的枪、猎鹰和狗都给我，行吗？”
        - id: ch01-b05
          speaker: stranger
          text: “行，都归你。”
        - id: ch01-b06
          speaker: narrator
          text: 陌生人牵走了马，伊恩带着换来的东西回家。母亲一听经过，抄起手里的棍子就打，一直打到胳膊发酸。
        - id: ch01-b07
          speaker: mother
          text: “这顿打就是要你记住，以后不准再卖我的东西！”
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 伊恩一句也没有回，忍着满身疼痛上了床。到了夜里，他悄悄起来，带着枪离开了家。他心想，再也不要留下来挨打。于是他走啊，走啊，不停地走，直到天又亮了。肚子饿起来，他四下寻找可以果腹的东西，恰好看见不远处有座农舍。伊恩上前敲门，农夫和妻子热情地请他进屋，一起吃早饭。
        - id: ch01-b09
          speaker: farmer
          text: “你带着枪，这下可好了。每天傍晚都有一头鹿来吃我的庄稼，我一直抓不住它。一定是好运把你送来的。”
        - id: ch01-b10
          speaker: ian
          text: “我愿意留下，替你把那头鹿打下来。”
        - id: ch01-b11
          speaker: narrator
          text: 当晚，伊恩藏在庄稼地边等候。鹿一出现，他就举枪瞄准。手指正要扣下扳机，眼前的鹿却变成一个黑发垂腰的女人，惊得他险些把枪扔了。可他再看，那里又是一头正在吃庄稼的鹿。这样的变化接连出现三次。最后，鹿逃过荒野，伊恩紧紧追了上去。
        - id: ch01-b12
          speaker: narrator
          text: 鹿在前面跑，伊恩在后面追。他们不停地跑啊，跑啊，终于来到一间小屋，屋顶铺满了石南草。鹿猛地一跃，跳上屋顶，在谁也看不见的地方伏下身来。
        - id: ch01-b13
          speaker: princess
          text: “渔夫的儿子，快进屋去。趁现在还有机会，尽管吃，尽管喝。”
        - id: ch01-b14
          speaker: narrator
          text: 伊恩走进去，只见桌上有酒有饭，屋里却空无一人。这里原来是强盗的巢穴，他们还在外面作恶。伊恩吃饱以后，躲到一只大木桶后面。很快，石南丛里传来脚步，细枝一根根折断。二十四个高大凶恶的男人回来了。
        - id: ch01-b15
          speakers: [robber_1, robber_2, robber_3]
          ensemble: chorus
          text: “谁吃了我们的晚饭？这些饭本来就不够我们自己吃！”
          emotion: angry
        - id: ch01-b16
          speaker: robber_captain
          text: “是木桶底下那个人。去四个人杀了他，再回来吃饭睡觉。明早还要早早赶路。”
        - id: ch01-b17
          speaker: narrator
          text: 四个强盗杀了伊恩，把尸体丢在那里，便和同伴一起睡下。天刚亮，他们全都出门远行。等强盗走得无影无踪，鹿从屋顶下来，对着死去的伊恩摇摇头。一滴蜡从它耳中落在伊恩身上，他立刻活了过来，身体也完好如初。
        - id: ch01-b18
          speaker: princess
          text: “相信我。还像先前那样吃喝，不会有灾祸落到你身上。”
          emotion: calm
        - id: ch01-b19
          speaker: narrator
          text: 伊恩听从鹿的话，又吃又喝，随后躲在木桶底下沉沉睡去。傍晚，强盗们拖着疲惫的身体回来了。这一天他们的好运忽然走到尽头，几乎什么也没抢到，因此比昨天更加暴躁。
        - id: ch01-b20
          speakers: [robber_1, robber_2, robber_3]
          ensemble: chorus
          text: “怎么又有人吃了我们的晚饭？”
          emotion: angry
        - id: ch01-b21
          speaker: robber_captain
          text: “还是木桶底下的人。再去四个杀掉他。不过先杀昨晚那四个骗子。他们要是真动了手，这个人怎么可能还活着？”
        - id: ch01-b22
          speaker: narrator
          text: 伊恩第二次被杀。剩下的强盗吃过晚饭，躺下睡到早晨。阳光刚碰到他们的脸，他们就全都起身，匆匆出门。鹿随后走进屋，把能治愈伤口的蜡滴到死去的伊恩身上，他又和从前一样健康。这时候，他已经不怕会发生什么了，因为深信鹿一定会照看自己。
        - id: ch01-b23
          speaker: narrator
          text: 到了晚上，先前的事第三次发生。又有四个强盗因为没能真正杀死伊恩而被处死，伊恩也第三次遭到杀害。可这回屋里一点食物都没留下。强盗们饿得几乎发疯，彼此大声争吵，接着便动起手来。他们越打越凶，直到所有人都横倒在地板上，一个也没有活下来。

    - id: ch02
      title: 三次错过的相会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 鹿进屋救活伊恩，带他来到一间白色小屋。屋里住着一位老妇人和她瘦削黝黑的儿子。
        - id: ch02-b02
          speaker: princess
          text: “我只能陪你走到这里。明天正午，到那边的教堂来见我。”
        - id: ch02-b03
          speaker: narrator
          text: 鹿跃过小溪，消失在树林中。第二天，伊恩前往教堂。老妇人却早已赶到，把一根叫作“伤痛之刺”的魔棍塞进门缝，故意让他过门时擦到。伊恩顿时困得站不住，倒在地上沉沉睡去。黝黑的年轻人躲在一旁，看见最美的音乐也唤不醒他，看见一个姑娘俯身触碰他，他仍没有反应。
        - id: ch02-b04
          speaker: narrator
          text: 姑娘弯腰守在伊恩身边，见一切都是徒劳，神情越来越悲伤。她等了很久，最后只得放弃。临走前，她抬起伊恩的一条胳膊，在内侧写下自己的名字，也就是“浪底国王之女”。
        - id: ch02-b05
          speaker: princess
          text: “我明天还会来。”
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 伊恩根本听不见。姑娘伤心地走后，他才醒过来。黝黑的年轻人把她来过的事告诉了他，却隐瞒了胳膊上的名字。第二天早晨，伊恩再次去教堂，发誓无论如何也不睡着。可他急着进门，手掌碰到伤痛之刺，立刻倒下，又被睡意牢牢裹住。
        - id: ch02-b07
          speaker: narrator
          text: 乐声第二次充满四周。姑娘迈着轻轻的脚步走进来，把伊恩的头放在自己膝上，又取出一把金梳子，慢慢替他梳理头发。可不管她怎样等，伊恩的眼睛始终紧闭。姑娘终于哭了起来。离开以前，她把一只制作精美的盒子放进他的衣袋。
        - id: ch02-b08
          speaker: narrator
          text: 第三天，伊恩还是遭遇了同样的事。姑娘来到熟睡的年轻人身边，哭得比前两次更加伤心。她说，这是他们最后一次相见的机会。此后，不会再有人准许她前来，她必须回到自己的家。
        - id: ch02-b09
          speaker: narrator
          text: 她刚走，伊恩便醒了。黝黑的年轻人告诉他，这一生都不可能再见到那位姑娘。寒意一直钻进伊恩心里，可他明白，自己是中了魔法才睡着，并不是有意失约。
        - id: ch02-b10
          speaker: ian
          text: “就算找遍整个世界，我也一定要找到她！”
        - id: ch02-b11
          speaker: narrator
          text: 黝黑的年轻人听了放声嘲笑，伊恩理也不理，当即出发寻找姑娘。他追着太阳的方向，一天又一天地走下去，直到鞋底磨出窟窿，双脚也满是伤口。沿途只有在树上筑巢的鸟，连一只山羊、一只兔子都没有。他还是不停地向前走啊，走啊。走了不知多久，前方忽然出现一座小屋，门外站着一个女人。

    - id: ch03
      title: 通往浪底国度的路
      blocks:
        - id: ch03-b01
          speaker: first_sister
          text: “渔夫的儿子，愿你平安。我知道你在寻找谁。进来吃饭休息吧，明天我会尽力帮你，再送你上路。”
        - id: ch03-b02
          speaker: narrator
          text: 伊恩在她家休息了一整天。女人用药膏治好了他脚上的伤。天亮以后，伊恩准备动身，她送来一双到处都是破洞的棕色旧鞋。
        - id: ch03-b03
          speaker: first_sister
          text: “我要你去找我的妹妹。平常要走一年零一天才能到她家，穿上这双鞋却只要一眨眼。到了以后，把鞋甩下来，让鞋尖朝着熟悉的地方，鞋跟朝着未知的地方，它们自然会回到我这里。”
        - id: ch03-b04
          speaker: narrator
          text: 伊恩照她说的去做，事情果然分毫不差。第二个女人临别时也给了他一双鞋。
        - id: ch03-b05
          speaker: second_sister
          text: “再去找我们的第三个姐妹。她的儿子掌管天上的飞鸟，每晚都是他送鸟儿入睡。他很聪明，说不定能帮你。”
        - id: ch03-b06
          speaker: narrator
          text: 伊恩谢过她，很快来到第三个女人家里。她待他很好，却想不出主意，只能留他吃饭，等儿子安顿好所有鸟儿以后回家。飞鸟的看守人听母亲讲完伊恩的故事，沉思了许久，忽然说自己饿了，晚饭要吃家里的母牛。母牛被宰杀，肉煮熟以后，人们又用红色的牛皮做成一只口袋。
        - id: ch03-b07
          speaker: bird_keeper
          text: “带上你的枪，钻进这只口袋。”
        - id: ch03-b08
          speaker: narrator
          text: 伊恩带着枪钻进口袋，把狗和猎鹰留在外面。看守人收紧袋口的绳子，把皮袋放在一旁，回去继续吃饭。一只鹰忽然穿过敞开的门飞进屋，用利爪抓起皮袋，带着它越过天空，一直飞到一座岛上。那里什么吃的也没有。伊恩等了又等，以为自己就要活活饿死，这才想起姑娘放进衣袋的盒子。他一揭开盒盖，三只小得出奇的鸟便扑扇着翅膀飞了出来。
        - id: ch03-b09
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: “好主人，有什么事要我们替您办？”
        - id: ch03-b10
          speaker: ian
          text: “带我去浪底国王的国度。”
        - id: ch03-b11
          speaker: narrator
          text: 一只小鸟飞到伊恩头顶，另外两只分别停在他的左右肩膀。伊恩闭起眼睛，只过了一瞬间，便已经站在海底的国度。三只鸟随即飞走，留下年轻人独自环顾这个陌生地方。他想到那位让自己找遍整个世界的姑娘就住在这里，一颗心不由得怦怦直跳。
        - id: ch03-b12
          speaker: narrator
          text: 伊恩走过一条条街，来到一个织布匠家门前。织布匠刚停下手里的活，正在门口歇息。
        - id: ch03-b13
          speaker: weaver
          text: “一看就知道你是外乡人。进来吧，我给你拿些吃的喝的。”
        - id: ch03-b14
          speaker: narrator
          text: 伊恩正愁无处可去，便进屋和他聊到天黑。
        - id: ch03-b15
          speaker: weaver
          text: “请在这里住下吧。我喜欢有人作伴，一个人实在太寂寞了。角落里那张床就给你睡。”
        - id: ch03-b16
          speaker: narrator
          text: 伊恩一觉睡到天亮。织布匠告诉他，城里当天要举办赛马，胜者将娶国王的女儿。伊恩激动得浑身发抖，开口时连声音也颤了。
        - id: ch03-b17
          speaker: ian
          text: “这样的奖赏可真了不得。我想去看看那场比赛。”
        - id: ch03-b18
          speaker: weaver
          text: “这很容易，谁都能去。我本想带你一起，可惜答应过国王，今天要把这匹布织好。”
        - id: ch03-b19
          speaker: ian
          text: “那真遗憾。”
        - id: ch03-b20
          speaker: narrator
          text: 伊恩说得客气，心里却很高兴，因为他正想一个人行动。他走进屋后的树林，再次打开盒子。三只小鸟马上飞了出来。

    - id: ch04
      title: 三场无人领奖的赛马
      blocks:
        - id: ch04-b01
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: “好主人，这一次要我们做什么？”
        - id: ch04-b02
          speaker: ian
          text: “带来世上最好的马、最华丽的衣服，再给我一双玻璃鞋。”
        - id: ch04-b03
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: “主人，您要的东西已经到了。”
        - id: ch04-b04
          speaker: narrator
          text: 东西果然全在眼前，华美得伊恩从未见过。他换好衣服，骑上骏马，来到众多骑手为大赛集合的场地，在他们中间占了一个位置。那里尽是赢过许多比赛的好马，可伊恩的坐骑一开跑就把它们远远甩在身后，第一个冲过终点。
        - id: ch04-b05
          speaker: narrator
          text: 公主等着胜者前来迎娶自己，却始终不见人影。伊恩已经回到树林，脱下华服，换回旧衣。他又叫盒子在衣袋里变出金子，回去送给织布匠，还说这些钱来自赛马的胜者，是为了答谢织布匠的收留。
        - id: ch04-b06
          speaker: narrator
          text: 一直没有人来要求迎娶公主，国王只好下令举行第二场比赛。伊恩穿得比第一天更加华丽，再次轻松超过所有对手，却还是没有领取奖赏。第三天，同样的事情又发生了。这一次，王国里的百姓似乎全都聚集到赛场，人人心中都充满好奇，想知道那位连胜三次的神秘骑手到底是谁。
        - id: ch04-b07
          speaker: king
          text: “既然他不肯自己来，就把他带到我面前。”
        - id: ch04-b08
          speaker: narrator
          text: 见过胜者面孔的使者走遍城中大街小巷，许多天后，终于在织布匠的小屋里发现伊恩。可仙女让他变得浑身肮脏，面目丑陋，模样古怪。使者们不相信他会是赛马胜者，反而认定他是个杀人无数、屡次逃脱的恶徒，把他押到国王面前。
        - id: ch04-b09
          speaker: king
          text: “不错，这一定就是那个强盗。立刻搭起绞架，当着全国百姓的面吊死他，让所有人看见罪人该受怎样的惩罚。”
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 绞架搭在高高的平台上。伊恩登上台阶，走到顶端，转身发表死刑犯按惯例要说的临终讲话。无论有罪无罪，到了这里都免不了这番话。说着说着，他无意间抬起一条胳膊。公主坐在父王身旁，一眼认出自己写下的名字。她尖叫着站起来，所有人都望向了她。
        - id: ch04-b11
          speaker: princess
          text: “住手，快住手！要是你们吊死这个人，王国里的每一个人都要跟着死！”
          emotion: fearful
        - id: ch04-b12
          speaker: narrator
          text: 她冲上高台，紧紧握住伊恩的手。
        - id: ch04-b13
          speaker: princess
          text: “父王，他不是强盗，也不是杀人犯。他就是三场赛马的胜者，也是替我解开魔咒的人。”
        - id: ch04-b14
          speaker: narrator
          text: 公主不等国王回答，直接把伊恩带进王宫。伊恩在大理石浴池里洗去全身污垢。仙女的法术随之消失。换上公主送来的华服以后，他足以和爱尔兰任何一位国王的女儿相配。

    - id: ch05
      title: 公主的选择
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 伊恩来到王宫的大厅，公主正在那里等他。两人有太多经历想告诉彼此，能独处的时间却少得可怜。公主的父王、前来做客和求婚的王子，还有王国里的所有百姓，仍旧留在原来的地方，等着她回去。公主和伊恩只得一起沿着长廊返回。
        - id: ch05-b02
          speaker: princess
          text: “你到底是怎么找到我的？”
        - id: ch05-b03
          speaker: ian
          text: “是你放进盒子里的鸟儿带我来的。”
        - id: ch05-b04
          speaker: narrator
          text: 他们走进挤满人群的露天空地，再也来不及多说。公主停下脚步，转身面对那些前来求婚的国王和王子。
        - id: ch05-b05
          speaker: princess
          text: “诸位国王，今天若是你们中的一个被杀，其他人一定都会逃走。伊恩却把性命交给我，相信我会救他。他接连三次被砍下头颅，仍没有退缩。所以，我宁愿嫁给他，也不愿嫁给你们这些远道而来的求婚者。许多国王试过替我解除魔咒，没有一个成功。只有渔夫的儿子伊恩做到了。”
        - id: ch05-b06
          speaker: narrator
          text: 这个关于渔夫儿子和魔鹿的故事，选自《西部高地民间故事》。
