  chapters:
    - id: ch01
      title: The Trade He Chose
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago in the land of Erin, a widow lived with her only son. He was a clever boy, and she saved enough money to send him to school. When he was old enough, she offered to apprentice him in any trade he chose. But he refused every honest trade. He meant to become a thief.
        - id: ch01-b02
          speaker: narrator
          text: His mother was deeply sorry when she heard him say it. Still, she knew her son well. If she tried to stop him from having his way, she would only make him more determined. So she answered that thieves ended by hanging at the bridge of Dublin. Then she left him alone and hoped that, as he grew older, he might grow wiser too.
        - id: ch01-b03
          speaker: narrator
          text: One day she was going to church to hear a famous preacher. She begged her son to come. By then, the neighbours called him the Shifty Lad because of all his tricks. He laughed and said sermons were not for him. Then he offered her one promise.
        - id: ch01-b04
          speaker: shifty_lad
          text: Whatever trade you first hear named after you leave the church, that will be my trade for the rest of my life.
        - id: ch01-b05
          speaker: narrator
          text: That promise gave the poor woman a little comfort. Her heart felt lighter as she said goodbye. When the Shifty Lad judged that the sermon must be nearly over, he hid among some bushes beside a narrow path that led straight to his mother's house. Presently she came along, still thinking about all the good things the preacher had said. Then, from very close beside her ear, a changed voice suddenly shouted.
        - id: ch01-b06
          speaker: shifty_lad
          text: Robbery! Robbery! Robbery!
        - id: ch01-b07
          speaker: narrator
          text: The sudden cry made her jump. She searched on every side, but the naughty boy had changed his voice and hidden himself so well that she neither knew him nor saw him. Once she turned the corner, he sprang from the bushes. He raced through the wood, reached home first, and stretched himself comfortably before the fire.
        - id: ch01-b08
          speaker: shifty_lad
          text: Well, did you hear any news?
        - id: ch01-b09
          speaker: mother
          text: No. I came straight away from church and spoke to nobody.
        - id: ch01-b10
          speaker: shifty_lad
          text: Then nobody mentioned a trade to you?
        - id: ch01-b11
          speaker: mother
          text: Ye-es. On the path, a voice called, “Robbery! Robbery! Robbery!” That was all.
        - id: ch01-b12
          speaker: shifty_lad
          text: That is quite enough. I told you I would take the first trade you heard. Robbery will be mine.
        - id: ch01-b13
          speaker: mother
          text: Then you will end by hanging at the bridge of Dublin.
        - id: ch01-b14
          speaker: narrator
          text: She could not sleep that night. She lay in the darkness thinking about her son. If he must be a thief, she thought, he had better be a good one. But who could teach him? At last an answer came to her. She rose before sunrise and set out for the home of the Black Rogue, also called the Gallows Bird. He was such a wonderful thief that everyone had been robbed by him, yet no one had ever caught him.
        - id: ch01-b15
          speaker: mother
          text: Good morning. My son wants to learn your trade. Would you teach him?
        - id: ch01-b16
          speaker: black_rogue
          text: If the boy is clever, I will try. If anyone can make him a first-rate thief, I can. But teaching a fool is useless, and I cannot bear fools.
        - id: ch01-b17
          speaker: mother
          text: He is not stupid. I will send him here after dark tonight.
        - id: ch01-b18
          speaker: narrator
          text: The Shifty Lad leaped for joy when she told him.
        - id: ch01-b19
          speaker: shifty_lad
          text: I will be the best thief in all Erin!
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: His mother shook her head and murmured again about the bridge of Dublin, but he paid no attention.
    - id: ch02
      title: The Hallowe'en Robbery
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Every evening after dark, the Shifty Lad went to the Black Gallows Bird and learned one new trick after another. In time, his master allowed him to come along and watch while he worked. At last there came a day when the Black Rogue decided his pupil had grown clever enough to help with a great robbery.
        - id: ch02-b02
          speaker: black_rogue
          text: A rich farmer on the hill has sold all his fat cattle for a great deal of money. He bought lean cattle cheaply, and they are in his cowhouse, but he has not paid for them yet. Tomorrow he will take the money to market. Tonight, while the house is quiet, we will hide in the loft and get into his chest.
        - id: ch02-b03
          speaker: narrator
          text: There was no moon that Hallowe'en night. In the farmhouse, people burned nuts, tried to catch apples from a tub of water with their hands tied, and played every sort of game. The Shifty Lad grew thoroughly tired of waiting for the merrymakers to leave and the household to go to bed. His master was more used to the work. He tucked himself into the hay and went to sleep, telling the boy to wake him when the company had gone.
        - id: ch02-b04
          speaker: narrator
          text: The boy could keep still no longer. He crept down into the cowshed and loosened the ropes around the cattle's heads. The animals began kicking one another and bellowing so loudly that the whole company ran out from the farmhouse to secure them again. While the room stood empty, the Shifty Lad slipped inside, scooped up a large handful of nuts, and returned to the loft. Through all the commotion, the Black Rogue was still asleep.
        - id: ch02-b05
          speaker: narrator
          text: At first the boy shut his eyes too. Before long, though, he sat up. He took a large needle and thread from his pocket and stitched the hem of his master's coat to a heavy bullock hide hanging behind him. Downstairs, the cattle were secure again. When the people discovered their nuts were gone, they gathered by the fire and began telling stories.
        - id: ch02-b06
          speaker: shifty_lad
          text: I think I will crack a nut.
        - id: ch02-b07
          speaker: black_rogue
          text: You will do no such thing. They will hear you.
        - id: ch02-b08
          speaker: shifty_lad
          text: I do not care. I have never passed Hallowe'en without cracking one.
        - id: ch02-b09
          speaker: narrator
          text: He cracked the shell.
        - id: ch02-b10
          speaker: merrymaker
          text: Someone is cracking nuts in the loft! Come quickly, and we will catch him.
        - id: ch02-b11
          speaker: narrator
          text: The warning was loud enough for the Black Rogue to hear. He dashed from the loft, dragging the hide that had been sewn to his coat.
        - id: ch02-b12
          speaker: farmer
          text: He is stealing my hide!
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: Everyone darted after him. He was too swift for them, though the heavy hide dragged behind and cost him a great deal of time. At last he managed to tear it from his coat. Then he flew like a hare until he reached his old hiding place. While the chase went on, the Shifty Lad climbed down and searched the farmhouse. Behind a load of straw, hidden under loaves of bread and one great cheese, he found the chest filled with gold and silver.
        - id: ch02-b14
          speaker: narrator
          text: He slung the heavy money bags over his shoulders. He took the loaves and the great cheese under his arm as well, then quietly set out for the Black Rogue's house. By the time he arrived, his master had escaped the chase and was waiting for him in a fury.
        - id: ch02-b15
          speaker: black_rogue
          text: So you are here at last, you villain! I will have my revenge on you.
          emotion: angry
        - id: ch02-b16
          speaker: shifty_lad
          text: There is no harm done. I brought back everything you wanted.
          emotion: calm
        - id: ch02-b17
          speaker: narrator
          text: He set down the money, bread, and cheese.
        - id: ch02-b18
          speaker: black_rogues_wife
          text: Ah, the boy is the better thief.
        - id: ch02-b19
          speaker: black_rogue
          text: Yes. You are the clever one.
        - id: ch02-b20
          speaker: narrator
          text: They divided the spoil. The Black Gallows Bird took one half, and the Shifty Lad took the other.
    - id: ch03
      title: The Sheep, the Kid, and the Bull
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A few weeks later, the Black Gallows Bird heard of a wedding near the town. Friends were sending the bridegroom presents. A rich farmer near the moor decided that a fine fat sheep would be useful to a young couple starting a home. He ordered his shepherd to bring the best one down from the mountain flock.
        - id: ch03-b02
          speaker: narrator
          text: The shepherd climbed to the flock and chose the largest, fattest sheep, the one with the whitest fleece. He tied its feet together and laid it across his shoulder, for he had a long way to go. That day the Shifty Lad happened to be wandering over the moor. He saw the man on the road that passed the Black Rogue's cabin. The sheep was heavy, and the shepherd was in no hurry. The boy knew he could take a shorter way through the bushes and reach his master before the man even came in sight.
        - id: ch03-b03
          speaker: shifty_lad
          text: I wager I can steal the sheep from that man before he passes this cabin.
        - id: ch03-b04
          speaker: black_rogue
          text: Can you indeed? I wager one hundred silver pieces that you cannot.
        - id: ch03-b05
          speaker: shifty_lad
          text: Then I will try.
        - id: ch03-b06
          speaker: narrator
          text: He vanished into the bushes and ran hard until he entered a wood the shepherd had to cross. There he stopped, pulled off one of his shoes, smeared it all over with mud, and set it squarely in the path. When everything was ready, he slipped behind a rock to wait. Before long, the burdened shepherd came up the path, noticed the lonely shoe, and bent to examine it.
        - id: ch03-b07
          speaker: shepherd
          text: That is a good shoe, though it is filthy. If I had its mate, cleaning it would be worth the trouble.
        - id: ch03-b08
          speaker: narrator
          text: The shepherd dropped the muddy shoe and continued on his way. Hidden nearby, the Shifty Lad smiled at what he had heard. He picked up the first shoe, crept around by a shorter path, and set his other shoe down where the man was sure to see it. A few minutes later, the shepherd reached that place and stared at the clean second shoe.
        - id: ch03-b09
          speaker: shepherd
          text: Why, this matches the muddy shoe! I will fetch the first one, and then I shall have a sound pair.
        - id: ch03-b10
          speaker: narrator
          text: He laid the sheep on the grass and went back. The Shifty Lad put on both shoes, lifted the sheep, and carried it home. The Black Rogue paid him the hundred silver pieces.
        - id: ch03-b11
          speaker: narrator
          text: When the shepherd reached the farmhouse that night, he told his master the whole tale. The farmer scolded him for being stupid and careless. He ordered him back to the mountain the next day to fetch a kid, which would now have to serve as the wedding gift. But the Shifty Lad was watching again. He hid in the wood, and the moment the man drew near with the kid on his shoulders, the boy began to bleat exactly like a sheep. Not even the sheep's own mother could have known the difference.
        - id: ch03-b12
          speaker: shepherd
          text: My sheep must have worked its feet loose and wandered after me!
        - id: ch03-b13
          speaker: narrator
          text: He put the kid down on the grass and hurried away in the direction of the bleating. As soon as he was out of sight, the boy ran back, picked up the kid, and carried it to the Black Gallows Bird. The shepherd could hardly believe his eyes when he returned from hunting for the sheep and found the kid gone too. He was afraid to go home with almost the same tale he had told the day before. He searched the wood through and through until night was nearly upon him. At last there was no help for it. He had to return and confess to his master.
        - id: ch03-b14
          speaker: narrator
          text: The farmer was furious over this second loss. This time he ordered the shepherd to drive one of the great bulls down from the mountain. If he lost that animal too, the farmer warned, he would lose his job along with it. Again, the Shifty Lad kept watch and saw the man pass on his way uphill. When the shepherd came back, slowly driving the great bull before him, the boy called to his master.
        - id: ch03-b15
          speaker: shifty_lad
          text: Come quickly into the wood. We will take the bull as well.
        - id: ch03-b16
          speaker: black_rogue
          text: And how are we supposed to manage that?
        - id: ch03-b17
          speaker: shifty_lad
          text: Easily. Hide on one side and baa like a sheep. I will go to the other side and bleat like a kid. Leave the rest to me.
        - id: ch03-b18
          speaker: narrator
          text: The shepherd drove the bull slowly along. Then a loud sheep's call sounded far off among the bushes on one side, and a weak little kid answered from the other.
        - id: ch03-b19
          speaker: shepherd
          text: Those must be the sheep and kid I lost. Yes, they must be!
        - id: ch03-b20
          speaker: narrator
          text: Certain that he had found both missing animals, the shepherd hastily tied the bull to a tree. He hurried off among the bushes and searched until he was worn out. Of course, while he followed the false cries, the two thieves untied the bull, drove it home, and killed it for meat. When the shepherd finally returned to the tree, the bull was gone. Once more, he had to face his master and confess that he had been tricked.
    - id: ch04
      title: The Gallows on the Hill
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After that, the Black Rogue and the Shifty Lad became bolder and bolder. They stole many cattle, sold them, and grew rich. One day, as they returned from market with their pockets full of money, they passed a gallows on a hilltop.
        - id: ch04-b02
          speaker: shifty_lad
          text: Let us stop and examine that gallows. I have never seen one close at hand, though people say every thief ends there.
        - id: ch04-b03
          speaker: narrator
          text: Not another person was in sight. The two thieves stopped beneath the gallows and carefully examined every piece of it, from the upright posts to the loose hanging rope.
        - id: ch04-b04
          speaker: shifty_lad
          text: I wonder what hanging feels like. I ought to find out, in case I am caught someday. I will go first, and then you can try.
        - id: ch04-b05
          speaker: narrator
          text: He fastened the loose cord securely around his neck and gave the other end to the Black Rogue.
        - id: ch04-b06
          speaker: shifty_lad
          text: Pull me clear of the ground. When I have had enough, I will shake my legs. That will mean you must lower me.
        - id: ch04-b07
          speaker: narrator
          text: The Black Rogue pulled on the rope until the boy's feet left the earth. In less than half a minute, the Shifty Lad's legs began to shake. Remembering the signal, his master quickly lowered him to safety. When the boy could speak again, his face was rather purple and his voice came out in an odd murmur.
        - id: ch04-b08
          speaker: shifty_lad
          text: You cannot imagine the feeling! If you had tried it before, you would never have let me go first. It is the most pleasant thing I have ever done. I shook my legs from pure delight. You would have done the same.
        - id: ch04-b09
          speaker: black_rogue
          text: If it is so pleasant, let me try. Tie the knot tightly. I do not want to fall and break my neck.
        - id: ch04-b10
          speaker: shifty_lad
          text: I will make it safe. Whistle when you have had enough, and I will bring you down.
        - id: ch04-b11
          speaker: narrator
          text: The Shifty Lad pulled until the Black Rogue hung as high as the rope allowed.
        - id: ch04-b12
          speaker: shifty_lad
          text: Remember to whistle when you want to come down. But if you enjoy it as much as I did, shake your legs!
        - id: ch04-b13
          speaker: narrator
          text: At once, the Black Rogue's legs shook and kicked. The boy watched from below and laughed with all his heart.
        - id: ch04-b14
          speaker: shifty_lad
          text: How funny you look! If only you could see yourself! When you have had enough, whistle, and I will lower you.
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: He rocked with laughter, but no whistle came. Soon the kicking stopped. The Black Gallows Bird was dead, exactly as the Shifty Lad had intended.
        - id: ch04-b16
          speaker: narrator
          text: The boy left the body on the gallows and went home to the Black Rogue's wife. He told her that her husband was dead and said he was ready to marry her, if she wished it. But the woman had loved the Black Rogue, thief though he was. The offer filled her with horror. She shrank away from the Shifty Lad and called on the people nearby to pursue him. He had to flee to another part of the country, far from anyone who knew about his deeds.
    - id: ch05
      title: The King's Trap
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: If his mother heard any of this, perhaps she hoped her son was finally tired of stealing and ready for honest work. In truth, he loved the danger and the tricks. Life without them seemed dull. He carried on as before and taught new friends to be as wicked as he was. Together they began robbing the king's storehouses.
        - id: ch05-b02
          speaker: narrator
          text: The king took the advice of his Wise Man and sent soldiers to catch the whole band. For a long while they tried in vain. The Shifty Lad was too clever for them all. Whenever the soldiers laid one trap, he laid a better one. At last, one night, he crept into a barn where some soldiers lay sleeping and killed them. Then he persuaded the villagers that the other soldiers would certainly kill them before morning unless they struck first. So when the sun rose, not one soldier in the village remained alive.
        - id: ch05-b03
          speaker: narrator
          text: News of the dead soldiers soon reached the king's ears. He was furious and summoned the Wise Man to take counsel with him. The Wise Man proposed inviting every person in the countryside to a splendid ball. A thief as bold and shameless as this one would certainly come among the guests, he said. And once there, the fellow would be unable to resist asking the king's daughter to dance.
        - id: ch05-b04
          speaker: king
          text: Your plan is good.
        - id: ch05-b05
          speaker: narrator
          text: The king prepared a feast and a ball, and everyone in the countryside came, including the Shifty Lad. After the guests had eaten and drunk their fill, they crowded toward the ballroom. At the doorway, the Wise Man carried a bottle of black ointment inside his robes. As the Shifty Lad passed, he secretly touched one tiny black spot onto the boy's cheek near his ear.
        - id: ch05-b06
          speaker: narrator
          text: The Shifty Lad felt nothing when the ointment touched him. But as he approached the king's daughter to ask for a dance, he caught sight of the black spot in a silver mirror. In an instant, he understood who had marked him and why. He gave no sign that he knew. Instead, he danced so beautifully that the princess was delighted with him. When the dance ended, he bowed low to his partner, left her, and mingled again with the crowd filling the doorway.
        - id: ch05-b07
          speaker: narrator
          text: As he passed the Wise Man, he stole the bottle without being noticed. He put two black spots on the Wise Man's face, then marked twenty other men with one spot each. Afterward, he slipped the bottle back into the Wise Man's robe.
        - id: ch05-b08
          speaker: narrator
          text: After a while, he went back to the princess and asked for the honour of another dance. She agreed. During the dance, he stooped down as if he needed to tie the ribbons on his shoe. The princess took another bottle from her pocket, one the Wise Man had given her, and put a second black spot on his cheek. But she was not as skilful as the Wise Man had been, and this time the Shifty Lad felt the touch of her fingers.
        - id: ch05-b09
          speaker: narrator
          text: As soon as their dance ended, the Shifty Lad moved among the same twenty men and added a second spot to every face. He put two more spots on the Wise Man as well. Then he returned the bottle to the princess's pocket.
        - id: ch05-b10
          speaker: narrator
          text: At last the ball ended. The king ordered every door shut and commanded a search for the man with two black marks on his cheek. The chamberlain moved among the guests and soon found just such a man. He was about to arrest him and take him before the king when he noticed a second marked face, then a third. One after another, he counted twenty men with the same two spots. Even the Wise Man's face was marked.
        - id: ch05-b11
          speaker: narrator
          text: The chamberlain hurried to tell the king. The king sent first for the Wise Man and then for his daughter.
        - id: ch05-b12
          speaker: king
          text: The thief must have stolen your bottle.
        - id: ch05-b13
          speaker: wise_man
          text: No, my lord. I still have it here.
        - id: ch05-b14
          speaker: narrator
          text: He held it out.
        - id: ch05-b15
          speaker: king
          text: Then he must have taken yours.
        - id: ch05-b16
          speaker: princess
          text: No, Father. Mine is safe in my pocket.
        - id: ch05-b17
          speaker: narrator
          text: She produced her bottle. The three of them stared at one another in silence.
    - id: ch06
      title: The Apple Chooses
      blocks:
        - id: ch06-b01
          speaker: king
          text: The man who managed this is cleverer than most. If he reveals himself, he may marry the princess. While I live, he will govern half my kingdom, and after my death he will rule it all. Announce my offer in the ballroom and bring the fellow here.
        - id: ch06-b02
          speaker: narrator
          text: The attendant obeyed. To his astonishment, twenty men with black spots stepped forward instead of one.
        - id: ch06-b03
          speakers: [shifty_lad, marked_man_1, marked_man_2, marked_man_3]
          ensemble: chorus
          text: I am the man you want!
        - id: ch06-b04
          speaker: narrator
          text: The attendant was every bit as confused as the chamberlain had been. Since every man made the same claim, he told all twenty to follow him into the king's presence. The question was too difficult for the king to settle, so he called his council together. For hours they talked and argued without reaching any answer. In the end, they found a plan they might just as well have thought of at the beginning.
        - id: ch06-b05
          speaker: narrator
          text: This was their plan. A child would be brought to the palace, and the king's daughter would place an apple in her hands. Then the little girl would be led into a room where the twenty marked men sat in a ring. No one would tell her whom to choose. Whichever man received the apple from the child would be declared the winner and would marry the princess.
        - id: ch06-b06
          speaker: king
          text: He may not be the true man. Then again, perhaps he will be. In any case, this is the best we can do.
        - id: ch06-b07
          speaker: narrator
          text: The princess herself led a little girl into the room where the twenty men were seated in a ring. The child stood in the middle for a moment and looked carefully from one face to the next. Then she held the apple out to the Shifty Lad. He was winding a thin shaving of wood around his finger, and the mouthpiece of a bagpipe hung from his neck.
        - id: ch06-b08
          speaker: chamberlain
          text: You must not have anything that the other men do not have.
        - id: ch06-b09
          speaker: narrator
          text: He sent the child outside for a moment. He took away the shaving and the mouthpiece, then moved the Shifty Lad to another seat. When the girl returned, she recognized him and walked straight to him with the apple.
        - id: ch06-b10
          speaker: chamberlain
          text: The child has chosen this man twice. The test was fair, and we repeated it.
        - id: ch06-b11
          speaker: narrator
          text: The chamberlain motioned for the Shifty Lad to kneel before the king. The child had found him once when he stood out from the rest, and then found him again after his place and appearance had been changed. The king accepted the choice. In this strange way, the Shifty Lad won the king's daughter, and the two were married the very next day.
    - id: ch07
      title: The Bridge of Dublin
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: A few days after the wedding, the bride and bridegroom went walking together. Their path came down to a river, and a bridge crossed the water.
        - id: ch07-b02
          speaker: shifty_lad
          text: What bridge is this?
        - id: ch07-b03
          speaker: princess
          text: This is the bridge of Dublin.
        - id: ch07-b04
          speaker: shifty_lad
          text: Is it really? Many a time, after one of my tricks, my mother said I would end by hanging at the bridge of Dublin.
        - id: ch07-b05
          speaker: princess
          text: If you want her prophecy to come true, let me tie my handkerchief around your ankle. I can hold you while you hang over the bridge wall.
          emotion: happy
        - id: ch07-b06
          speaker: shifty_lad
          text: That sounds like fine fun, but you are not strong enough to hold me.
        - id: ch07-b07
          speaker: princess
          text: Oh, yes I am. Let us try.
        - id: ch07-b08
          speaker: narrator
          text: At last he agreed to the game. The princess tied her handkerchief tightly around his ankle and let him hang down over the wall of the bridge. She held the other end while they both laughed, jesting about the princess and her great strength.
        - id: ch07-b09
          speaker: shifty_lad
          text: Now pull me up again!
        - id: ch07-b10
          speaker: narrator
          text: Just as he called, a great cry went up that the palace was burning. The princess turned with a start and let go of the handkerchief. The Shifty Lad fell, struck his head on a stone, and died at once.
        - id: ch07-b11
          speaker: narrator
          text: So his mother's prophecy came true after all.
