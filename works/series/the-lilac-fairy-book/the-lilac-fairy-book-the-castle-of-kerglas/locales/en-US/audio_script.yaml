  chapters:
    - id: ch01
      title: The Road to Kerglas
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peronnik was a poor simple boy with no family and no home. Without the kindness of the villagers, he would have starved. They fed him whenever he asked. At night, he found a heap of straw, burrowed into it like a lizard, and slept. Yet he was never unhappy. He thanked everyone who helped him, and sometimes sang for them. He could copy a lark so perfectly that no one could tell the boy from the bird.
        - id: ch01-b02
          speaker: narrator
          text: One evening, after hours of wandering through a forest, Peronnik grew very hungry. The trees thinned, and he saw a small farmhouse. At its door stood the farmer's wife, holding the big bowl from which her children had eaten supper.
        - id: ch01-b03
          speaker: peronnik
          text: I'm hungry. Could you give me something to eat?
        - id: ch01-b04
          speaker: farmers_wife
          text: You may have whatever you can find in this bowl.
        - id: ch01-b05
          speaker: narrator
          text: There was not much left after every member of the family had dipped a spoon into the bowl. Peronnik did not mind. He scraped up what remained and ate with such a hearty appetite that it seemed like the finest meal he had ever tasted.
        - id: ch01-b06
          speaker: peronnik
          text: This must be the finest flour, mixed with the richest milk, and stirred by the best cook in the whole countryside.
        - id: ch01-b07
          speaker: narrator
          text: He meant only to speak to himself, but the woman heard him.
        - id: ch01-b08
          speaker: farmers_wife
          text: Poor innocent boy. He hardly knows what he's saying. Still, I'll cut him a slice from my new wheaten loaf.
        - id: ch01-b09
          speaker: narrator
          text: She cut him a slice of the fresh wheaten loaf. Peronnik ate every crumb and declared that no one less than the bishop's own baker could have made it. That compliment pleased the farmer's wife so much that she gave him butter to spread on another piece. He was still eating it on the doorstep when an armed knight rode up.
        - id: ch01-b10
          speaker: knight
          text: Can you direct me to the castle of Kerglas?
        - id: ch01-b11
          speaker: farmers_wife
          text: Kerglas? Are you truly going there?
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Her face turned pale.
        - id: ch01-b13
          speaker: knight
          text: I am. I've ridden hard for three months from a country far away just to reach this place.
        - id: ch01-b14
          speaker: farmers_wife
          text: But why do you want to go to Kerglas?
        - id: ch01-b15
          speaker: knight
          text: I am searching for the golden basin and the diamond lance kept in that castle.
        - id: ch01-b16
          speaker: peronnik
          text: That basin and lance must be worth a great deal.
        - id: ch01-b17
          speaker: knight
          text: They are worth more than every crown in the world. The basin gives you any fine food you can imagine. Drink from it, and it cures the most dangerous illness. Touch it to a dead person's mouth, and that person lives again. The lance can cut through any stone or metal.
        - id: ch01-b18
          speaker: peronnik
          text: Who owns such wonders?
        - id: ch01-b19
          speaker: farmers_wife
          text: A magician called Rogear, who lives in the castle. He rides by here every day on a black mare, with a thirteen-month-old colt following behind. No one attacks him because he always carries that lance.
        - id: ch01-b20
          speaker: knight
          text: True, but a spell forbids him to use it inside Kerglas. The moment he enters, both treasures are locked in a dark cellar that only one key can open. That is where I mean to fight him.
        - id: ch01-b21
          speaker: farmers_wife
          text: You will never defeat him, Sir Knight. More than a hundred gentlemen have passed this house on the same quest, and not one ever returned.
        - id: ch01-b22
          speaker: narrator
          text: She shook her head. The journey sounded impossible to her, but the knight was not discouraged in the least.
        - id: ch01-b23
          speaker: knight
          text: I know what happened to them. They did not have instructions from the hermit of Blavet, as I do.
        - id: ch01-b24
          speaker: peronnik
          text: What did the hermit tell you?
        - id: ch01-b25
          speaker: knight
          text: First comes an enchanted wood filled with voices and terrors meant to frighten me off the path. Most men before me lost their way there and died from cold, hunger, or exhaustion.
        - id: ch01-b26
          speaker: peronnik
          text: And if you get safely through the wood?
        - id: ch01-b27
          speaker: knight
          text: Then I meet a dwarf fairy guarding an apple tree with a fiery needle that burns anything it touches to ashes. I must take one apple.
        - id: ch01-b28
          speaker: peronnik
          text: What comes after that?
        - id: ch01-b29
          speaker: knight
          text: I must pluck the flower that laughs, though a lion with vipers for a mane guards it. Then I cross the dragons' lake and face a black man. He has an iron ball that never misses and always flies back to his hand. Beyond him lies the valley of pleasure, where even men who passed every earlier trial left their bones. If I escape that valley, I reach a river with one ford. A lady dressed in black will be waiting there. She will ride behind me and tell me what to do next.
        - id: ch01-b30
          speaker: farmers_wife
          text: No one could do all that.
        - id: ch01-b31
          speaker: knight
          text: Those are trials for men. Remember that.
        - id: ch01-b32
          speaker: narrator
          text: He reminded her that these dangers were matters for men, then galloped down the path she showed him. The woman watched him go with a sigh. She gave Peronnik still more food and wished him good night. Peronnik got up and was opening the gate into the forest when the farmer arrived.
        - id: ch01-b33
          speaker: farmer
          text: My cattle boy ran away, and I need another. Will you stay and tend the herd?
        - id: ch01-b34
          speaker: narrator
          text: Peronnik loved his freedom and had no love at all for work. Then he remembered how well he had eaten in this house. That settled the matter, and he agreed to stay.
    - id: ch02
      title: The Colt Who Knew the Way
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At sunrise, Peronnik gathered the cattle and led them to rich pasture beside the forest. He cut a hazel switch to keep them together. The work was harder than it looked. Each time he fetched one cow from the trees, another wandered off.
        - id: ch02-b02
          speaker: narrator
          text: One troublesome black cow caused more trouble than all the others together. While chasing her deep among the trees, Peronnik heard hoofbeats. He peered through the leaves and saw the giant Rogear seated on his black mare, with the thirteen-month-old colt trotting behind. The golden bowl hung from a chain around the giant's neck. In his hand, the diamond lance gleamed like fire. Peronnik watched until all three disappeared. Then he searched everywhere for the track they had followed, but there was not a mark of it.
        - id: ch02-b03
          speaker: narrator
          text: The same thing happened many times. Rogear always appeared and vanished along a path Peronnik could never find. Before long, the boy grew so used to seeing the giant that he no longer troubled to hide. Yet every glimpse of those two shining treasures made his wish to own them stronger.
        - id: ch02-b04
          speaker: narrator
          text: One evening, Peronnik sat alone at the forest's edge when a white-bearded man stopped beside him.
        - id: ch02-b05
          speaker: peronnik
          text: Are you looking for the road to Kerglas?
        - id: ch02-b06
          speaker: bryak
          text: I know that road very well.
        - id: ch02-b07
          speaker: peronnik
          text: You've been there, and the magician didn't kill you?
        - id: ch02-b08
          speaker: bryak
          text: Rogear has nothing to fear from me. I am Bryak, his elder brother. Even I would lose myself in the enchanted wood, so whenever I visit him, I call his colt to guide me.
        - id: ch02-b09
          speaker: narrator
          text: Bryak bent down, drew three circles on the earth, and whispered words too softly for Peronnik to hear. Then he spoke aloud.
        - id: ch02-b10
          speaker: bryak
          text: Colt, free to run and free to eat. Colt, gallop fast until we meet.
        - id: ch02-b11
          speaker: narrator
          text: At once the colt came frisking toward him. Bryak slipped a halter over its neck and jumped onto its back.
        - id: ch02-b12
          speaker: narrator
          text: Peronnik kept the whole adventure secret from the people at the farm. He understood one thing very clearly. If he ever hoped to reach Kerglas, first he must catch the colt that knew the hidden road. Unfortunately, he had not heard the words Bryak whispered, and he could not copy the three circles properly. Calling the colt by magic was impossible. He would have to invent another way to catch it.
        - id: ch02-b13
          speaker: narrator
          text: While the cows grazed, he turned the problem over in his mind all day. He felt certain that once he was on the colt's back, he could somehow overcome every later danger. Meanwhile, he meant to be ready when his chance came. At night, after everyone was asleep, he worked in secret. He mended an old halter from the stable, twisted hemp into a rope for binding the colt's feet, and made a net like those used to snare birds. He roughly sewed scraps of cloth into a pocket. Into it went glue and lark feathers, a string of beads, an elderwood whistle, and a slice of bread rubbed all over with bacon fat.
        - id: ch02-b14
          speaker: narrator
          text: Peronnik went to the path Rogear always used and crumbled the bread along one side. Then he hid in the bushes close by and waited. Rogear, the mare, and the colt appeared at their usual hour. Peronnik watched anxiously. Suppose the trick was useless. Suppose the mare, not the colt, stopped for the crumbs. But no. The mare carried Rogear safely around the bend while the colt followed with its nose near the ground. It caught the rich smell of bacon and began greedily licking up every piece. The little animal had never tasted anything so good.
        - id: ch02-b15
          speaker: narrator
          text: It was so busy searching for more that it never heard Peronnik creep close. Suddenly the halter was around its neck, the rope was around its feet, and Peronnik was on its back.
        - id: ch02-b16
          speaker: narrator
          text: The hobbled colt went as fast as the ropes allowed and turned into the wildest part of the forest. Peronnik sat trembling at the strange sights around him. At one moment, the earth seemed to split open just ahead, and he stared into a pit with no bottom. At the next, trees burst into flame and surrounded him with fire. When the colt crossed a stream, the water rose and threatened to sweep him away. At the foot of a mountain, enormous rocks came rolling down as if they meant to crush both colt and rider.
        - id: ch02-b17
          speaker: narrator
          text: Peronnik never learned whether these horrors were real or imagined. He pulled his knitted cap over his eyes and trusted the colt to follow the right road.
        - id: ch02-b18
          speaker: narrator
          text: At last they left the forest and came onto a wide plain where the air blew fresh and strong. Peronnik dared to lift his cap and peek. To his great relief, the enchantments seemed to be over. Then he noticed men's skeletons scattered across the ground, each lying near the bones of a horse, and a shiver of horror ran through him. Gray shapes were trotting away in the distance. He could not be sure, but they looked very much like wolves.
    - id: ch03
      title: The Apple and the Laughing Flower
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The plain looked vast, but it did not take the colt long to cross. Soon it entered a shady park. In the middle stood a single apple tree, its branches bowed right down to the ground beneath the weight of the fruit. The korigan stood guard before it. He was a little fairy man, armed with a fiery sword that reduced everything it touched to ashes.
        - id: ch03-b02
          speaker: narrator
          text: At the sight of Peronnik, the korigan shrieked and raised the sword. Peronnik stayed at a safe distance and politely lifted his cap.
        - id: ch03-b03
          speaker: peronnik
          text: Please don't be alarmed, my prince. I'm going to Kerglas because the noble Rogear has asked me there on business.
        - id: ch03-b04
          speaker: korigan
          text: He asked you? Then who are you?
        - id: ch03-b05
          speaker: peronnik
          text: Why, I'm the new servant he hired. You surely know that.
        - id: ch03-b06
          speaker: korigan
          text: I know nothing of the kind. You may be a robber.
        - id: ch03-b07
          speaker: peronnik
          text: Then perhaps servant is the wrong word. I'm only a bird-catcher. But please don't hold me up. His Highness is waiting, and he lent me this colt so I could reach the castle quickly.
        - id: ch03-b08
          speaker: narrator
          text: Only then did the korigan look properly at the colt. He knew it belonged to Rogear, and he began to wonder whether the young man might be telling the truth. He examined the animal first, then studied its rider. Peronnik wore such an innocent, vacant expression that he hardly seemed capable of inventing any story at all. Even so, the dwarf was not fully satisfied. He demanded to know what use a magician could have for a bird-catcher.
        - id: ch03-b09
          speaker: peronnik
          text: He needs one badly. He says birds are eating all his grain and every piece of fruit in his garden.
        - id: ch03-b10
          speaker: korigan
          text: And just how will you stop them?
        - id: ch03-b11
          speaker: narrator
          text: Peronnik showed him the snare and claimed no bird could escape it.
        - id: ch03-b12
          speaker: korigan
          text: Prove it. Blackbirds and thrushes are eating all my apples. Set your snare and catch them, and I'll let you pass.
        - id: ch03-b13
          speaker: peronnik
          text: That's a fair bargain.
        - id: ch03-b14
          speaker: narrator
          text: Peronnik jumped down and fastened the colt to a tree. Then he began setting the trap. He attached one end of the net to the apple tree and called for the korigan to hold the other end while he took out the pegs. The dwarf did exactly as he was told. Without warning, Peronnik tossed the noose over his neck and pulled it tight. In an instant, the korigan was held as firmly as any bird he wanted Peronnik to snare.
        - id: ch03-b15
          speaker: narrator
          text: The dwarf screamed with rage and fought to loosen the rope, but every pull only tightened the knot. He had set his fiery sword down on the grass, and Peronnik had carefully placed the net on the other side of the tree. The weapon was out of reach. Nothing stopped Peronnik from plucking an apple, climbing onto the colt, and leaving the korigan to his fate.
        - id: ch03-b16
          speaker: narrator
          text: Beyond the plain lay a narrow valley and a grove filled with fragrant roses, yellow broom, and pink honeysuckle. Above them towered a marvelous scarlet pansy with a strange face. This was the flower that laughs. Anyone who looked at it began laughing too.
        - id: ch03-b17
          speaker: narrator
          text: Peronnik's heart beat high. He had safely reached the second trial. Still, he looked quite calmly at the lion pacing back and forth before the grove, even though living vipers twisted and curled in place of its mane. He stopped the colt and took off his cap. Simple as he was, he knew that when dealing with someone greater than yourself, a cap is more useful in your hand than on your head. He wished every kind of good fortune to the lion and its family. Then he politely asked whether this was the road to Kerglas.
        - id: ch03-b18
          speaker: lion
          text: What business do you have at Kerglas?
        - id: ch03-b19
          speaker: narrator
          text: The lion growled and showed his teeth. Peronnik pretended to be terrified.
        - id: ch03-b20
          speaker: peronnik
          text: With all respect, I serve a lady who is Rogear's friend. She is sending him larks for a pie.
        - id: ch03-b21
          speaker: lion
          text: Larks? I haven't tasted one in a hundred years! Are you carrying many?
        - id: ch03-b22
          speaker: peronnik
          text: As many as this bag can hold.
        - id: ch03-b23
          speaker: narrator
          text: He opened the bag of glue and feathers. Then he turned away and sang exactly like a lark.
        - id: ch03-b24
          speaker: lion
          text: Let me see those birds. I must find out if they're fat enough for my master.
        - id: ch03-b25
          speaker: peronnik
          text: Gladly, but if I open the bag, every bird will fly out.
        - id: ch03-b26
          speaker: lion
          text: Open it only wide enough for me to look inside.
        - id: ch03-b27
          speaker: narrator
          text: That was exactly what Peronnik had been hoping to hear. He held the bag while the lion carefully opened it and pushed its head all the way inside, expecting a fine mouthful of larks. Instead, the sticky mass of glue and feathers clung to its face. Before the lion could drag its head out again, Peronnik pulled the cord tight and tied it in a knot no man could undo. Then he quickly plucked the flower that laughs, leaped onto the colt, and rode away as fast as it could carry him.
    - id: ch04
      title: The Dragons and the Valley of Pleasure
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The path led straight to the lake of the dragons. The colt knew it well and plunged in without hesitating. Dragons came from every side to devour Peronnik.
        - id: ch04-b02
          speaker: narrator
          text: This time he did not bother with his cap. He scattered his beads across the water like black grain thrown to ducks. Each dragon swallowed one, rolled onto its back, and died. Peronnik reached the farther shore safely.
        - id: ch04-b03
          speaker: narrator
          text: The valley of the black man now lay ahead. From a long way off, Peronnik saw its guardian chained by one foot to a rock at the entrance. In one hand he held the iron ball that never missed its target and always returned to its master's grasp. Six eyes stared from his head. They usually kept watch in turns and were never all closed at once. At that moment, all six were wide open. Peronnik knew that one glimpse of him would be enough to send the deadly ball flying.
        - id: ch04-b04
          speaker: narrator
          text: Peronnik hid the colt behind a thick screen of bushes. Then he crawled along a ditch until he could crouch beside the very rock to which the black man was chained. The day was hot, and after a while the guardian began to grow sleepy. Two eyes closed. Peronnik started to sing very gently. Almost at once, a third eye shut. He continued the soft song. The lid of the fourth eye dropped heavily, followed by the fifth and then the sixth. At last, every eye was closed and the black man was completely asleep.
        - id: ch04-b05
          speaker: narrator
          text: Peronnik tiptoed back to the colt. He led it over soft moss, past the sleeping guard, and into the valley of pleasure.
        - id: ch04-b06
          speaker: narrator
          text: It was the most tempting garden imaginable. Ripe fruit hung so close that it almost touched his mouth. Instead of water, the fountains ran with wine. Flowers sang to him in soft little voices. Farther along, tables stood ready with every kind of food, while girls danced across the grass and called for him to come and join them.
        - id: ch04-b07
          speaker: narrator
          text: Peronnik heard every sweet invitation, and he scarcely knew what he was doing. His hands allowed the colt to slow. He greedily breathed in the smell of all those dishes and raised his head for a better look at the dancers. In another instant, he would have stopped altogether. Then he would have been lost, just like the travelers whose bones lay behind him.
        - id: ch04-b08
          speaker: narrator
          text: Just in time, the golden bowl and diamond lance rose before his mind like a vision. He pulled the elderwood whistle from his pocket and blew it loudly enough to drown every sweet sound in the garden. He ate what remained of the bread and bacon, calming his craving for the enchanted fruit. Then he fixed his eyes firmly on the colt's ears so he could no longer see the dancers.
        - id: ch04-b09
          speaker: narrator
          text: So he reached the garden's end. At last, he saw Kerglas. A river lay between him and the castle, with only one ford. Would the lady be waiting, as the knight had said? Yes. She sat on a rock in a black satin dress, her face dark as a Moorish woman's.
        - id: ch04-b10
          speaker: narrator
          text: Peronnik rode up, removed his cap more politely than ever, and asked whether she wished to cross.
        - id: ch04-b11
          speaker: lady_in_black
          text: I have been waiting for you to help me. Come close, so I can sit behind you.
        - id: ch04-b12
          speaker: narrator
          text: Peronnik offered his arm, and she sprang lightly onto the colt. As they crossed the ford, she questioned him.
        - id: ch04-b13
          speaker: lady_in_black
          text: Do you know how to kill the magician?
        - id: ch04-b14
          speaker: peronnik
          text: I thought a magician could never die, so no one could kill him.
        - id: ch04-b15
          speaker: lady_in_black
          text: Persuade him to taste your apple, and he will die. If the apple is not enough, I will touch him with one finger. I am the plague.
        - id: ch04-b16
          speaker: peronnik
          text: But after he dies, how can I open the cellar and take the basin and lance? I have no key.
        - id: ch04-b17
          speaker: lady_in_black
          text: The flower that laughs opens every door and lights every darkness.
        - id: ch04-b18
          speaker: narrator
          text: As the lady finished speaking, the colt stepped out of the ford onto the opposite bank. Peronnik now knew how to overcome Rogear and how to reach the hidden treasures. Together, he and the lady advanced toward the castle.
    - id: ch05
      title: The Fall of Rogear
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In front of the castle entrance stood a kind of tent held up by poles. Rogear sat beneath it, basking in the warm sun. He soon noticed the familiar colt approaching with Peronnik in front and the lady behind. The giant lifted his head and thundered at them in a voice that seemed to shake the air.
        - id: ch05-b02
          speaker: rogear
          text: Why, that is the idiot riding my thirteen-month-old colt!
          emotion: surprised
        - id: ch05-b03
          speaker: peronnik
          text: Greatest of magicians, you are quite right.
        - id: ch05-b04
          speaker: rogear
          text: How did you catch him?
        - id: ch05-b05
          speaker: peronnik
          text: I repeated what your brother Bryak taught me at the forest's edge. I said, "Colt, free to run and free to eat. Colt, gallop fast until we meet." He came at once.
        - id: ch05-b06
          speaker: rogear
          text: So you know my brother. Why did he send you here?
        - id: ch05-b07
          speaker: peronnik
          text: He sent you two gifts that just arrived from the country of the Moors. They are the apple of delight and the woman of submission. Eat the apple, and you will never want anything else. Take the woman as your servant, and you will never want another.
        - id: ch05-b08
          speaker: rogear
          text: Give me the apple, then, and tell the woman to get down.
        - id: ch05-b09
          speaker: narrator
          text: Peronnik handed over the apple and told the lady to climb down. Rogear took a bite. The very first taste made the giant stagger on his feet. Then the lady reached out and touched him with one long yellow finger. Rogear fell to the ground, dead.
        - id: ch05-b10
          speaker: narrator
          text: Peronnik left the magician lying where he had fallen and entered the palace with the flower that laughs in his hand. Door after door flew open at his approach. He passed through fifty of them before he came to a long flight of steps. They went so far downward that they seemed to lead into the very depths of the earth.
        - id: ch05-b11
          speaker: narrator
          text: Peronnik followed the stairs all the way down. At the bottom, a silver door blocked his path. It had no keyhole and no bar that he could move. He held the laughing flower high. Slowly, the silver door swung back. Beyond it was a deep cavern, but there was no darkness inside. The golden basin and diamond lance gave off such a brilliant light that the cave shone as brightly as day.
        - id: ch05-b12
          speaker: narrator
          text: Peronnik ran toward the treasures without wasting a moment. He lifted the basin by its chain and hung it around his neck, then gripped the diamond lance in his hand. As soon as both were his, the ground began to shake beneath his feet. An awful rumbling rose around him. In an instant, the entire palace disappeared, and Peronnik found himself standing beside the same forest where he had once led the farmer's cattle to graze.
    - id: ch06
      title: The Besieged City
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Darkness was already coming on, but Peronnik never considered returning to the farm. Instead, he followed the road toward the court of the duke of Brittany. When he passed through the town of Vannes, he stopped at a tailor's shop. There he bought a beautiful suit of brown velvet and a white horse. He paid for both with a handful of gold he had picked up while walking through one of the corridors at Kerglas.
        - id: ch06-b02
          speaker: narrator
          text: Dressed as a gentleman, Peronnik rode on to Nantes. At that very moment, the French were besieging the city.
        - id: ch06-b03
          speaker: narrator
          text: A little way from the city walls, Peronnik stopped his horse and looked around. The countryside was bare for miles in every direction. The enemy had cut down every tree and burned every blade of grain. There was no food left anywhere outside the walls. Simple as Peronnik might be, he understood what that meant. Inside the closed gates, men were dying of hunger.
        - id: ch06-b04
          speaker: narrator
          text: Peronnik was still gazing at the ruined land in horror when a trumpeter appeared high on the city wall. The man raised his trumpet and blew a long, loud blast. Then he called out the duke's promise for everyone inside and outside Nantes to hear.
        - id: ch06-b05
          speaker: trumpeter
          text: The duke will adopt as his heir whoever drives the French from this country!
        - id: ch06-b06
          speaker: narrator
          text: The trumpeter sounded the call from all four sides of Nantes. At the final call, Peronnik had ridden as close to the city as he could.
        - id: ch06-b07
          speaker: peronnik
          text: You can put away your trumpet. I will free the city from its enemies.
        - id: ch06-b08
          speaker: narrator
          text: A soldier ran toward him, waving a sword. Peronnik turned and touched him with the magic lance. The man fell dead at once.
        - id: ch06-b09
          speaker: narrator
          text: The soldiers following him stopped where they stood, amazed by what they had seen. They were certain the strange lance had not pierced their comrade's armor. There was no wound at all. Even so, he lay dead as surely as if the weapon had gone straight through his heart. Before the men had time to recover from their astonishment, Peronnik called out to them.
        - id: ch06-b10
          speaker: peronnik
          text: Now you know what happens to my enemies. Watch what I can do for my friends.
        - id: ch06-b11
          speaker: narrator
          text: He bent down and pressed the golden basin to the fallen soldier's mouth. The man sat up, alive and well. Then Peronnik jumped his horse across the trench and rode through the city gate, which opened just wide enough to admit him.
    - id: ch07
      title: The Deliverance of Brittany
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: News of the death and sudden return to life traveled quickly through every street of Nantes. The wonders Peronnik had performed put fresh courage into the starving garrison. The soldiers no longer felt helpless behind their walls. They declared that they were ready and able to fight, as long as the young stranger led them.
        - id: ch07-b02
          speaker: narrator
          text: The battle began, and whenever a Breton soldier fell, Peronnik brought the golden basin to him and restored him to life. His own force could rise again, while the enemy could not. Before long, he had an army large enough and strong enough to drive the French out of the country. Peronnik had kept the promise he made beneath the walls. He delivered Brittany.
        - id: ch07-b03
          speaker: narrator
          text: No one knows what became of the basin and the lance. Some say the sorcerer Bryak stole them again. Anyone who wants those treasures now must seek them just as Peronnik did.
