audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    peronnik:
      display_name: 佩罗尼克
      tts:
        delivery: 天真直率，装傻周旋时一本正经，得意时仍不张扬
        timbre: 清亮朴实的年轻男声
        pace: 适中偏轻快
        pitch: 中高
    farmer_wife:
      display_name: 农妇
      tts:
        delivery: 心地厚道，谈到魔法时忧惧而郑重
        timbre: 温和结实的成年女声
        pace: 适中
        pitch: 中
    knight:
      display_name: 骑士
      tts:
        delivery: 自信庄重，讲述危险时坚定从容
        timbre: 洪亮沉稳的成年男声
        pace: 适中
        pitch: 中低
    farmer:
      display_name: 农夫
      tts:
        delivery: 简短直接，不爱多说废话
        timbre: 粗实的成年男声
        pace: 适中
        pitch: 中低
    bryak:
      display_name: 布里亚克
      tts:
        delivery: 老练自若，念咒时低沉神秘
        timbre: 苍老干涩的男声
        pace: 偏慢
        pitch: 低
    korigan:
      display_name: 科里甘
      tts:
        delivery: 多疑易怒，受骗前傲慢而不耐烦
        timbre: 尖细紧绷的成年男声
        pace: 偏快
        pitch: 高
    lion:
      display_name: 毒蛇鬃毛的狮子
      tts:
        delivery: 威吓时低沉凶狠，馋嘴时急切贪婪
        timbre: 粗哑浑厚的成年男声
        pace: 偏慢
        pitch: 低
    lady_plague:
      display_name: 黑衣妇人
      tts:
        delivery: 冷静简洁，谈论死亡时毫无波澜
        timbre: 幽冷清晰的成年女声
        pace: 舒缓
        pitch: 中低
    rogear:
      display_name: 罗热阿
      tts:
        delivery: 威严自负，声音带着巨人的压迫感
        timbre: 洪亮厚重的成年男声
        pace: 偏慢
        pitch: 低
    trumpeter:
      display_name: 号手
      tts:
        delivery: 面向远处高声宣告，清楚有力
        timbre: 嘹亮的成年男声
        pace: 适中偏慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 金盆与钻石长矛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 佩罗尼克是个无依无靠的穷傻子。村里人心善，他来讨吃的，总肯分给他一点，要不然他早就饿死了。夜里困了，他便找一堆稻草，掏个洞，像蜥蜴一样钻进去。他虽然傻，却从不觉得日子苦。谁给了他饭，他一定诚心道谢，有时还唱一阵云雀的歌。他学得那么像，谁也听不出哪一声是人，哪一声是鸟。
        - id: ch01-b02
          speaker: narrator
          text: 一天，佩罗尼克在森林里转了好几个钟头。到了傍晚，他饿得厉害，恰好看见不远处有一座小农舍。门口站着一位农妇，手里端着孩子们吃过晚饭的大碗。
        - id: ch01-b03
          speaker: peronnik
          text: “我肚子饿了。能给我一点吃的吗？”
        - id: ch01-b04
          speaker: farmer_wife
          text: “碗里若还找得到什么，你就吃吧。”
        - id: ch01-b05
          speaker: narrator
          text: 每个人的勺子都在碗里舀过，剩得实在不多。佩罗尼克却吃得很香，觉得自己从没尝过这么好的饭。
        - id: ch01-b06
          speaker: peronnik
          text: “这一定用了最好的面粉和最浓的牛奶，还得是全乡手艺最高的厨子亲手搅出来的。”
        - id: ch01-b07
          speaker: narrator
          text: 他本来只说给自己听，农妇却听见了。
        - id: ch01-b08
          speaker: farmer_wife
          text: “可怜的傻孩子，连自己说了什么都不明白。还是给他切一片新烤的小麦面包吧。”
        - id: ch01-b09
          speaker: narrator
          text: 佩罗尼克把面包吃得一屑不剩，还说只有主教家的面包师才烤得出这种滋味。农妇听得高兴，又拿黄油给他抹上。就在他坐在门槛上继续吃时，一名全副武装的骑士到了。
        - id: ch01-b10
          speaker: knight
          text: “请问，去凯尔格拉斯城堡该走哪条路？”
        - id: ch01-b11
          speaker: farmer_wife
          text: “凯尔格拉斯？您当真要到那里去？”
          emotion: fearful
        - id: ch01-b12
          speaker: knight
          text: “不错。我从极远的国家赶来，马不停蹄地走了三个月，才到了这里。”
        - id: ch01-b13
          speaker: farmer_wife
          text: “可您去凯尔格拉斯做什么？”
        - id: ch01-b14
          speaker: knight
          text: “我要找城堡里的金盆和钻石长矛。”
        - id: ch01-b15
          speaker: narrator
          text: 佩罗尼克一听，立刻抬起头来。
        - id: ch01-b16
          speaker: peronnik
          text: “那只盆和那支长矛，准是贵得不得了。”
        - id: ch01-b17
          speaker: knight
          text: “把天下的王冠全加起来，也比不上它们。金盆能变出你想得到的任何美食。喝下盆里的水，再重的病也能治好。就是死去的人，只要嘴唇碰到金盆，也会活过来。那支钻石长矛更厉害，石头也好，金属也好，它都能穿透。”
        - id: ch01-b18
          speaker: peronnik
          text: “这么神奇的宝物，究竟是谁的？”
        - id: ch01-b19
          speaker: farmer_wife
          text: “主人是住在城堡里的魔法师罗热阿。他每天骑着黑母马从这里经过，后面跟着一匹十三个月大的小马驹。没人敢碰他，因为那支长矛从不离手。”
        - id: ch01-b20
          speaker: knight
          text: “不过他身上有一道咒。只要进了凯尔格拉斯城堡，他便不能使用长矛。每次他回去，金盆和长矛都会收进黑暗的地窖，那扇门只有一把钥匙能开。我正要进城堡跟他决斗。”
        - id: ch01-b21
          speaker: farmer_wife
          text: “骑士老爷，您打不过他的。一百多位贵族都为这两件宝物从我家门前经过，可没有一个人回来。”
        - id: ch01-b22
          speaker: knight
          text: “这我知道。可他们没有得到布拉韦隐士的指点，我得到了。”
        - id: ch01-b23
          speaker: peronnik
          text: “隐士怎么说？”
        - id: ch01-b24
          speaker: knight
          text: “我要先穿过一片魔法森林。林中到处是怪声，会吓唬我，引我走错路。以前那些人多半在那里迷了路，最后不是冻死、饿死，就是活活累死。”
        - id: ch01-b25
          speaker: peronnik
          text: “要是您平安穿过去了呢？”
        - id: ch01-b26
          speaker: knight
          text: “接下来，我会碰到一个拿着烈火针的仙怪。那根针碰到什么，什么就会化成灰。小矮人守着一棵苹果树，我必须摘到一只苹果。”
        - id: ch01-b27
          speaker: peronnik
          text: “然后还有什么？”
        - id: ch01-b28
          speaker: knight
          text: “然后要摘下会笑的花，守着它的狮子长着毒蛇鬃毛。再往前是龙湖，还有一个黑人。他的铁球百发百中，扔出去又会自己飞回手里。闯过这些，才到欢乐谷。有人过了前面所有险关，最后仍把骨头留在那里。要是我走得出去，就会到一条只有一处浅滩的河边。一位黑衣妇人坐在那里。她会骑到我身后，再告诉我后面的路。”
        - id: ch01-b29
          speaker: narrator
          text: 骑士停下时，农妇只是摇头。
        - id: ch01-b30
          speaker: farmer_wife
          text: “这一连串险事，您怎么可能全都办到？”
        - id: ch01-b31
          speaker: narrator
          text: 骑士却提醒她，这些不过是男人办的事，随后沿着农妇所指的小路飞驰而去。农妇望着他的背影叹了口气，又给佩罗尼克添了些食物，向他道过晚安。佩罗尼克吃完站起身，正要打开通往森林的栅门，农夫本人从外面回来了。
        - id: ch01-b32
          speaker: farmer
          text: “我原先的放牛娃逃了。现在正缺一个孩子照看牛群，你愿不愿意留下？”
        - id: ch01-b33
          speaker: narrator
          text: 佩罗尼克喜欢自由，也讨厌干活。可想起刚吃过的好东西，他还是答应了。

    - id: ch02
      title: 认路的小马驹
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 太阳刚升起，佩罗尼克便仔仔细细拢好牛群，把它们赶到森林边缘草木肥美的牧场。他一路还削了根榛木棍，用来约束这些不听话的家伙。这差事远没有看起来容易。牛总爱钻进树林，他才赶回一头，另一头又跑了。那头最淘气的黑牛尤其难管，惹出的麻烦比其余的牛加起来还多，一次竟把他引进林中很远。
        - id: ch02-b02
          speaker: narrator
          text: 这时传来马蹄声。佩罗尼克隔着树叶一看，巨人罗热阿骑在黑母马上，小马驹跟在后面。金盆用链子挂在巨人颈上，他手里的钻石长矛像火一般发亮。可巨人刚一走远，林中便找不到半点路径。
        - id: ch02-b03
          speaker: narrator
          text: 后来，这一幕一次次出现。佩罗尼克渐渐见惯了，连藏也不藏，只是每看见一回，就更想得到那两件宝物。
        - id: ch02-b04
          speaker: narrator
          text: 一天傍晚，他独自坐在森林边缘，一个白胡子男人停在身旁。
        - id: ch02-b05
          speaker: peronnik
          text: “您也在找去凯尔格拉斯的路吗？”
        - id: ch02-b06
          speaker: bryak
          text: “那条路，我熟悉得很。”
        - id: ch02-b07
          speaker: peronnik
          text: “您去过那里，竟然没被魔法师杀掉？”
          emotion: surprised
        - id: ch02-b08
          speaker: bryak
          text: “罗热阿不用怕我。我是他哥哥，巫师布里亚克。我每次去看他都从这里走。可连我也会在魔法森林里迷路，所以我得把那匹小马驹叫来，让它带路。”
        - id: ch02-b09
          speaker: narrator
          text: 布里亚克弯下身，在地上画了三个圆圈，又低低念了些佩罗尼克听不清的话。最后，他放开声音念道。
        - id: ch02-b10
          speaker: bryak
          text: “小马驹，自在跑，自在吃，快快飞奔来相会。”
        - id: ch02-b11
          speaker: narrator
          text: 小马驹立刻出现了，欢快地蹦跳着奔向巫师。布里亚克把笼头往它颈上一套，一跃骑到背上。佩罗尼克回农场后，对这场奇遇一个字也没提，心里却想得明白，要到凯尔格拉斯，第一步就是捉住这匹认得路的马。可巫师低声念的咒语，他半句也没听清，地上那三个圆圈也怎么都画不出来。想召来小马驹，他只能另想办法。
        - id: ch02-b12
          speaker: narrator
          text: 他整天一边放牛，一边琢磨怎么引来小马驹。他相信，只要坐到马背上，别的危险总能应付。每天夜里，等众人睡熟，他便偷偷做准备。他补好马厩里的一副旧笼头，搓出绊马腿的麻绳，编了一张捕鸟网。又把几块布缝成口袋，装进胶、云雀羽毛、一串珠子、一支接骨木哨子，还有一片抹了咸肉油的面包。
        - id: ch02-b13
          speaker: narrator
          text: 准备妥当，他来到罗热阿每天经过的小路旁，把面包捏碎，撒在路边，自己藏进灌木丛。巨人、母马和小马驹果然准时来了。佩罗尼克心里七上八下。要是母马吃了面包呢？要是这个法子根本没用呢？
        - id: ch02-b14
          speaker: narrator
          text: 母马驮着罗热阿安然走了过去，很快消失在拐角。小马驹一路低着头，忽然闻见香味，便停下来贪婪地舔起面包屑。那滋味真香，它简直不明白，以前怎么从没有人喂过自己。小家伙吃得入迷，只顾四下嗅闻更多碎屑，没听见佩罗尼克悄悄走近。等它觉察，笼头已经套在颈上，麻绳缠住了腿，再一转眼，佩罗尼克也坐到了背上。
        - id: ch02-b15
          speaker: narrator
          text: 小马驹被绊着四蹄，仍尽力快跑，一头钻进森林最荒僻的地方。眼前怪象不断，佩罗尼克吓得发抖。有时大地裂开，露出无底深渊。有时树木忽然着火，把他们围在火海里。渡溪时，河水猛涨，仿佛要将他卷走。到了山脚，巨石又滚滚冲来，仿佛要把人和马一起压碎。
        - id: ch02-b16
          speaker: narrator
          text: 佩罗尼克一辈子也没弄清，这些是真的，还是自己眼中的幻象。他把针织帽拉下来蒙住双眼，把道路全交给小马驹。终于，他们冲出森林，来到一片风势清劲的辽阔平原。
        - id: ch02-b17
          speaker: narrator
          text: 佩罗尼克偷偷往外一看，魔法似乎消失了。他刚松口气，又看见人的骸骨散在平原上，旁边还有马的骨架，不由得浑身发冷。远处几个灰影正小跑着离开。那会是什么？难道真是狼？

    - id: ch03
      title: 三道险关
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 平原虽大，小马驹却很快穿了过去，走进一座浓荫覆盖的园子。园中只有一棵苹果树，果实沉甸甸的，把枝条压到地面。树前站着一个科里甘，也就是小仙怪。它手里那把烈火剑，碰到什么便会把什么烧成灰。它看见佩罗尼克，尖叫一声，举剑便要动手。年轻人摘下帽子，若无其事地停在稍远处。
        - id: ch03-b02
          speaker: peronnik
          text: “殿下，您别惊慌。尊贵的罗热阿叫我去办事，我正要赶到凯尔格拉斯。”
        - id: ch03-b03
          speaker: korigan
          text: “罗热阿请你？你到底是什么人？”
        - id: ch03-b04
          speaker: peronnik
          text: “我是他新雇的仆人。您当然知道这件事。”
        - id: ch03-b05
          speaker: korigan
          text: “我根本不知道。谁晓得你是不是强盗？”
        - id: ch03-b06
          speaker: peronnik
          text: “那是我说得不对。我不算仆人，只是个捕鸟人。求您别耽搁我，魔法师殿下正等着呢。他还把小马驹借给我，好叫我快些到城堡。”
        - id: ch03-b07
          speaker: narrator
          text: 科里甘听到这里，才第一次认真看向小马驹。它当然认得魔法师的马，于是觉得佩罗尼克的话或许不假。它先绕着马仔细打量，又转头端详骑手。那张脸又天真又呆滞，怎么看也不像能编出一整套谎话。可小矮人心里的疑团并没有全消，仍旧拦着路，非要问清罗热阿为什么需要一个捕鸟人。
        - id: ch03-b08
          speaker: peronnik
          text: “听起来，他急需有人帮忙。凯尔格拉斯的谷物，还有园子里的果实，都快叫鸟吃光了。”
        - id: ch03-b09
          speaker: korigan
          text: “你这个好汉打算怎么对付它们？”
        - id: ch03-b10
          speaker: narrator
          text: 佩罗尼克拿出捕鸟网，说没有任何鸟能从里面逃脱。
        - id: ch03-b11
          speaker: korigan
          text: “那正好让我瞧瞧真假。乌鸫和鸫鸟快把我的苹果吃完了。你要真捉得到它们，我就放你过去。”
        - id: ch03-b12
          speaker: peronnik
          text: “这很公平。”
        - id: ch03-b13
          speaker: narrator
          text: 佩罗尼克跳下马，把小马驹拴在树边，再把网的一头固定到树干上。他请科里甘握住另一头，说自己要取木桩。小矮人刚照办，佩罗尼克便猛地甩出绳套，套住它的脖子，用力一收。想捉鸟的科里甘，反而像鸟一样落进网里。
        - id: ch03-b14
          speaker: narrator
          text: 科里甘气得尖声怒叫，拼命伸手去解脖子上的绳子，可它越是拉扯，绳结反倒收得越紧。烈火剑早被它随手放在草上，捕鸟网又让佩罗尼克特意拴到了树的另一侧。如今谁也拦不住他了。他从容摘下一只苹果，重新骑上小马驹，把愤怒的小矮人留在那里，任凭它自己想办法脱身。
        - id: ch03-b15
          speaker: narrator
          text: 他们离开平原，进入一条窄谷。林中满是芬芳的花木，玫瑰五颜六色，金雀花一片明黄，忍冬泛着粉红。上方高高耸立着一朵深红三色堇，花脸上带着奇怪的神情。它就是会笑的花，谁看见它，谁也忍不住笑。
        - id: ch03-b16
          speaker: narrator
          text: 第二道考验终于到了。佩罗尼克心跳得厉害，脸上却很镇定。守花的狮子在林前来回巡视，鬃毛竟是一条条不断扭动的毒蛇。佩罗尼克勒住马，摘下帽子。他虽傻，却知道面对比自己强大的家伙，帽子拿在手里比戴在头上有用。他先祝狮子和全家好运，才问去凯尔格拉斯是不是走这条路。
        - id: ch03-b17
          speaker: lion
          text: “你到凯尔格拉斯去干什么？”
        - id: ch03-b18
          speaker: peronnik
          text: “请您别见怪。我服侍的夫人是尊贵的罗热阿的朋友。她派我送几只云雀过去做肉馅饼。”
        - id: ch03-b19
          speaker: lion
          text: “云雀？我有一百年没吃过了！你带了多少？”
        - id: ch03-b20
          speaker: peronnik
          text: “装了满满一口袋。”
        - id: ch03-b21
          speaker: narrator
          text: 他说着打开那个装满胶和羽毛的口袋，又背对狮子，学起云雀的歌声。
        - id: ch03-b22
          speaker: lion
          text: “快拿来给我看看！我要替主人瞧瞧，这些鸟够不够肥。”
        - id: ch03-b23
          speaker: peronnik
          text: “我倒很愿意，可袋口一开，鸟会全飞掉的。”
        - id: ch03-b24
          speaker: lion
          text: “那就开一条缝，只让我往里面看。”
        - id: ch03-b25
          speaker: narrator
          text: 佩罗尼克等的正是这句话。他托住口袋，狮子小心打开袋口，把整个脑袋伸进去，想大吃一口。胶和羽毛一下黏了满头。狮子还没来得及把脑袋拔出来，佩罗尼克已收紧袋绳，打了一个谁也解不开的死结。他飞快摘下会笑的花，骑马离开。
        - id: ch03-b26
          speaker: narrator
          text: 前面的路很快通到龙湖边，他们必须从水里游过去。小马驹走惯了这条路，一到岸边就跳进湖中，没有半点迟疑。群龙看见佩罗尼克，立刻从四面八方游来，张口要把他吞下。这一回，他连摘帽行礼也顾不上了，只管抓起随身带来的珠子，一颗颗扔进水里，就像拿黑色谷粒喂鸭子。每条龙吞下一颗珠子，便翻过肚皮，当场死去。佩罗尼克再没遇到别的阻碍，稳稳到了对岸。
        - id: ch03-b27
          speaker: narrator
          text: 第三道险关是一座山谷。守在谷口的黑人有一只脚被铁链拴在岩石上，手中握着百发百中的铁球。铁球扔出去，总会回到他的掌心。他头上长着六只眼睛，从不一起闭上，而是轮流监视。眼下六只全睁着。佩罗尼克知道，只要被看见，铁球就会飞来。
        - id: ch03-b28
          speaker: narrator
          text: 他把小马驹藏到灌木后，沿着沟爬过去，蜷伏在锁链拴着的那块岩石旁。天气很热，黑人渐渐犯困。两只眼睛闭上时，佩罗尼克轻轻唱起歌。第三只也闭上了，他继续唱。第四只眼皮沉沉落下，接着是第五只和第六只。黑人终于睡熟了。

    - id: ch04
      title: 欢乐谷与黑衣妇人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 佩罗尼克踮着脚回到小马驹身边，牵它踏过柔软的苔藓，从沉睡的黑人身旁溜进欢乐谷。那是一座让人沉醉的花园。果实一直垂到嘴边，喷泉流淌着美酒，花朵用细小温柔的声音唱歌。前方的桌子摆满食物，还有姑娘在草地上跳舞，招呼他一起玩。
        - id: ch04-b02
          speaker: narrator
          text: 佩罗尼克听着歌声，不知不觉放慢了小马驹。他贪婪地嗅着菜香，又抬头想看清舞姿。只差一瞬，他就会完全停住，像从前那些人一样，再也走不出去。
        - id: ch04-b03
          speaker: narrator
          text: 再过片刻，佩罗尼克就会停下，再也走不动了。偏在这时，金盆和钻石长矛像一道幻象，突然浮现在他心头。他一下醒过神，赶紧从口袋里摸出哨子，用力吹响，好压过周围甜美的声音。又把剩下的面包和咸肉全吃下去，压住魔法果实勾起的馋意。从此，他两眼只牢牢盯着小马驹的耳朵，一眼也不再看那些跳舞的姑娘。
        - id: ch04-b04
          speaker: narrator
          text: 他终于走到花园尽头。凯尔格拉斯城堡就在远处，中间隔着一条河，只有一处可以涉水而过。隐士说的妇人会在吗？她果然坐在岩石上，穿着黑缎长裙，脸庞有摩尔女子那样的肤色。
        - id: ch04-b05
          speaker: narrator
          text: 佩罗尼克骑到近前，摘下帽子。这一回，他比任何时候都更有礼貌，问她是不是想过河。
        - id: ch04-b06
          speaker: lady_plague
          text: “我一直在等你帮我。靠近一点，让我坐到你身后。”
        - id: ch04-b07
          speaker: narrator
          text: 佩罗尼克依言伸出手臂，妇人轻盈地跨上小马驹。两人涉过浅滩时，她开口问道。
        - id: ch04-b08
          speaker: lady_plague
          text: “你知道怎样杀死那个魔法师吗？”
        - id: ch04-b09
          speaker: peronnik
          text: “魔法师不是不会死吗？我以为谁也杀不了他。”
        - id: ch04-b10
          speaker: lady_plague
          text: “哄他尝一口苹果，他就会死。要是这样还不够，我再用手指碰他一下。我就是瘟疫。”
        - id: ch04-b11
          speaker: peronnik
          text: “就算杀了他，我也没有钥匙。藏在地窖里的金盆和长矛，又要怎么取出来？”
        - id: ch04-b12
          speaker: lady_plague
          text: “会笑的花能打开每一道门，也能照亮所有黑暗。”
        - id: ch04-b13
          speaker: narrator
          text: 说完这句话，他们已经到了对岸，继续往城堡走。入口前搭着一座柱子支起的帐篷，罗热阿坐在下面晒太阳。巨人看见自己的小马驹驮着佩罗尼克和妇人，猛地抬头，声音如雷鸣般响起。
        - id: ch04-b14
          speaker: rogear
          text: “这不是那个傻子吗？他竟敢骑我那匹十三个月大的小马驹！”
        - id: ch04-b15
          speaker: peronnik
          text: “最伟大的魔法师，您认得一点也没错。”
        - id: ch04-b16
          speaker: rogear
          text: “你到底怎么捉到它的？”
        - id: ch04-b17
          speaker: peronnik
          text: “我把您哥哥布里亚克在森林边念的话学了一遍。我只说，小马驹，自在跑，自在吃，快快飞奔来相会。它马上就来了。”
        - id: ch04-b18
          speaker: rogear
          text: “你认识我哥哥？他叫你来这里做什么？”
        - id: ch04-b19
          speaker: peronnik
          text: “他刚从摩尔人的国度得到两件礼物，派我来送给您。一件叫欢愉之果，吃下以后再也不会渴求别的东西。另一件叫顺从之女，收她做仆人以后，您也不会再想要别的人。”
        - id: ch04-b20
          speaker: rogear
          text: “把苹果给我，再叫那个女人下来。”
        - id: ch04-b21
          speaker: narrator
          text: 佩罗尼克照办了。罗热阿才咬下第一口，身子便摇晃起来。黑衣妇人长长的黄色手指随即碰到他，巨人倒在地上，死了。

    - id: ch05
      title: 凯尔格拉斯的宝物
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 佩罗尼克把魔法师留在帐篷下，带着会笑的花进入宫殿。他每向前一步，门便自行打开。整整五十道门过后，眼前出现一条长长的阶梯，仿佛一直通往大地腹中。
        - id: ch05-b02
          speaker: narrator
          text: 他沿着长阶不断往下走，最后来到一扇银门前。门上既没有门闩，也找不到钥匙孔。佩罗尼克把会笑的花高高举过头顶，沉重的银门便缓缓向后退开。门后是一座深邃的洞窟，金盆和钻石长矛正放在里面。两件宝物光芒四射，把原本幽暗的洞穴照得如同白昼。
        - id: ch05-b03
          speaker: narrator
          text: 佩罗尼克跑上前，把连在金盆上的链子挂到颈间，又拿起钻石长矛。宝物刚一到手，脚下猛然震动，四周响起可怕的轰鸣。整座宫殿一下消失了。他再睁眼，自己竟站在从前放牛的森林旁边。
        - id: ch05-b04
          speaker: narrator
          text: 天色渐暗，佩罗尼克却没回农场，而是踏上通往布列塔尼公爵宫廷的大路。经过瓦讷时，他走进裁缝铺，买了一套漂亮的棕色天鹅绒衣裳，又买下一匹白马。他用来付钱的金币，是离开凯尔格拉斯时从走廊里捡来的。
        - id: ch05-b05
          speaker: narrator
          text: 换好衣裳，骑上白马，他一路来到南特。那时，法国人正包围着这座城。离城还有一段路，佩罗尼克停下来张望。方圆数英里一片荒芜。敌人砍光了树，也烧光了谷物。他虽然是个傻子，也明白城里的人正在挨饿，一个接一个地死去。
        - id: ch05-b06
          speaker: narrator
          text: 他惊恐地望着这一切。忽然，一名号手出现在城墙上，响亮的号声传向远方。
        - id: ch05-b07
          speaker: trumpeter
          text: “公爵有令！谁能把法国人赶出这片国土，公爵就收谁做自己的继承人！”
        - id: ch05-b08
          speaker: narrator
          text: 号手朝城的四面各吹一遍。吹到最后一遍，佩罗尼克已经骑到离城墙尽可能近的地方，便高声回答。
        - id: ch05-b09
          speaker: peronnik
          text: “别再吹了。我会亲手把这座城从敌人手里救出来。”
        - id: ch05-b10
          speaker: narrator
          text: 一个士兵挥舞长剑，朝他飞奔过来。佩罗尼克掉转马头，只用钻石长矛在那人身上轻轻一碰。士兵当场倒地，没了气息。跟在后面的人一下全站住了，惊得不敢相信自己的眼睛。他们看得清清楚楚，同伴身上的铠甲根本没有被刺穿，可那人偏偏死了，就像长矛已经扎进他的心脏。
        - id: ch05-b11
          speaker: narrator
          text: 众人还没从惊讶中回过神，佩罗尼克又开口了。
        - id: ch05-b12
          speaker: peronnik
          text: “你们已经见识了我的敌人会怎样。现在看看，我能为朋友做些什么。”
        - id: ch05-b13
          speaker: narrator
          text: 他俯下身，把金盆贴到死去士兵的嘴边。那人立刻坐起，身体完好如初。佩罗尼克随即纵马跳过壕沟，从为他敞开的城门进入南特。

    - id: ch06
      title: 解救布列塔尼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 佩罗尼克带来的两件宝物竟有这样的力量，消息很快传遍全城。原本被饥饿和围困压得灰心的守军，又重新有了勇气。他们纷纷站出来说，愿意听从这位年轻陌生人的号令，在他的率领下与围城的敌人交战。
        - id: ch06-b02
          speaker: narrator
          text: 战斗开始后，每一个倒下的布列塔尼人，都能借助金盆重新活过来。这样一来，佩罗尼克手下的军队不但没有减少，反而很快强大到足以击退法国人。他终于把围城的敌军赶出这片土地，兑现了自己在城外许下的诺言，解救了自己的国家。
        - id: ch06-b03
          speaker: narrator
          text: 后来，金盆和钻石长矛去了哪里，再没有人知道。有人说，巫师布里亚克设法把它们偷了回去。谁还想拥有这两件宝物，就得像佩罗尼克一样，亲自去寻找。
        - id: ch06-b04
          speaker: narrator
          text: 这个故事选自埃米尔·苏韦斯特的《布列塔尼传说》。
