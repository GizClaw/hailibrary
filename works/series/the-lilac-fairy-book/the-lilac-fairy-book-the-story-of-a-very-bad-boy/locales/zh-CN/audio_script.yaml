audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    toueno:
      display_name: 图埃诺—布埃诺
      tts:
        delivery: 懒散而机灵，骗人时一本正经又暗藏得意
        timbre: 清亮灵活的少年男声
        pace: 适中偏快
        pitch: 中高
    mother:
      display_name: 母亲
      tts:
        delivery: 贫苦而精明，打趣儿子时亲昵爽快
        timbre: 略显苍老的温厚女声
        pace: 适中
        pitch: 中
    wolf:
      display_name: 狼
      tts:
        delivery: 狡猾沉着，心里盘算时带着自负
        timbre: 粗哑低沉的成年男声
        pace: 稍慢
        pitch: 低
    eldest_brother:
      display_name: 大哥
      tts:
        delivery: 自作聪明又强硬，发怒时咄咄逼人
        timbre: 厚重偏硬的成年男声
        pace: 适中
        pitch: 中低
    second_brother:
      display_name: 二弟
      tts:
        delivery: 贪心急切，容易上当又不肯吃亏
        timbre: 清晰偏紧的成年男声
        pace: 适中偏快
        pitch: 中
    youngest_brother:
      display_name: 三弟
      tts:
        delivery: 轻率自满，说出坏主意时格外兴奋
        timbre: 明亮偏薄的年轻男声
        pace: 偏快
        pitch: 中高
    beggar:
      display_name: 乞丐
      tts:
        delivery: 朴实热切，对飞来好运毫不怀疑
        timbre: 沙哑单薄的成年男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 揪住狼尾巴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，法国正中央有一座小村庄，村里住着一对穷苦母子。母亲是个寡妇，儿子约莫十五岁，本名安托万，人人却只叫他图埃诺—布埃诺。刮风的夜里，他们的破屋摇摇晃晃，仿佛随时会倒下来，把两人压在下面。图埃诺已经到了该干活的年纪，却整天低着头在街上闲逛，周围发生什么都不留心。
        - id: ch01-b02
          speaker: mother
          text: “我这孩子呀，你可真是笨得出奇。照这样下去，你一辈子也揪不住狼尾巴。”
        - id: ch01-b03
          speaker: narrator
          text: 一天，母亲叫图埃诺去森林捡干树叶，给两人的床铺得厚一些。叶子还没捡够，大雨就落了下来。他躲进一棵空心树，里面又干燥又舒服，很快便睡熟了。后来，一阵像狗挠门的声音把他惊醒。他莫名地害怕起来，轻轻抬头一看，一只浑身长毛的大野兽正从头顶往下退，尾巴先伸进树洞。
        - id: ch01-b04
          speaker: toueno
          text: “这准是大家常说的狼。”
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 图埃诺缩进角落，身子蜷得不能再小。狼沿着树洞里面，一点一点倒退下来。他吓得像石头一样僵硬，连气都不敢喘。忽然，他想到一个也许能救命的办法。母亲曾经说过，狼不能弓起后背，也不能扭头看身后。图埃诺快得像闪电一样伸出手，揪住狼尾巴，使劲往自己这边一拉。随后他钻出树洞，一路把狼拖回了母亲的小屋。
        - id: ch01-b06
          speaker: toueno
          text: “妈妈，你总说我太笨，揪不住狼尾巴。现在你看看！”
          emotion: happy
        - id: ch01-b07
          speaker: mother
          text: “好吧，好吧，天下还真是什么稀奇事都有。既然你把它捉来了，咱们就派个用场。把上星期死掉的公羊皮从箱子里拿出来，咱们把狼缝进去。明天赶到集市上，它就是一只顶漂亮的公羊。”
        - id: ch01-b08
          speaker: narrator
          text: 母亲嘴上这么说，人却始终站得远远的。狼又狡猾又聪明，大概听懂了，却装作毫不知情，任他们缝上羊皮。
        - id: ch01-b09
          speaker: wolf
          text: “我想走，随时都走得了，何必着急。”
        - id: ch01-b10
          speaker: narrator
          text: 羊皮从狼头上套下去，裹得它又热又难受。缝皮时，好几根手指和好几个鼻子凑到它嘴边，它也忍住了，没有一口咬下去。第二天集市正热闹，图埃诺赶着这只披羊皮的狼出现了。农夫们纷纷围上来，一个比一个出价高，都说从未见过这样高大漂亮的牲口。经过好一番讨价还价，三兄弟终于花了一大笔钱买下了它。
        - id: ch01-b11
          speaker: narrator
          text: 三兄弟每人都有一大群羊，可哪一只都比不上新买的公羊。大哥的牧场最近，他便先把它带回自己的羊圈。
        - id: ch01-b12
          speaker: eldest_brother
          text: “今晚让它留在我这里。明天咱们再商量，哪片牧场最合它的胃口。”
        - id: ch01-b13
          speaker: narrator
          text: 狼听见这话，咧嘴一笑，把头昂得更高了。
    - id: ch02
      title: 公羊与复活口哨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天一早，大哥头一个去看羊圈，顿时吓坏了。羊全都死在地上，只有一只不见踪影，原来狼连肉带骨全吃光了。直到这时，他才明白角落里蜷着的根本不是公羊。那只狼哪里不能弓背、不能回头？它正斜眼盯着他，随时可能扑上来。
        - id: ch02-b02
          speaker: narrator
          text: 大哥假装什么都没看见。他想起二弟从前捉弄过自己，正好借这个机会报复，于是只说这只公羊不肯吃他田里的草，最好赶去河边的牧场，那里放着二弟自己的羊群。二弟急忙吞下这个诱饵，当晚就把狼赶进父亲留给自己的羊群。第二天早上，他的羊也全死了。可二弟同样没有作声，又任由三弟的羊群遭到相同的厄运。后来三人碰面，才说出各自的损失。他们决定尽快把这畜生送还图埃诺，再狠狠揍他一顿，于是每人带上一根鞭子，怒气冲冲地找上门去。
        - id: ch02-b03
          speaker: narrator
          text: 这时，图埃诺正坐在邻居的李子树上吃熟果子。他远远看见三兄弟，立刻跳下树，飞奔回小屋。
        - id: ch02-b04
          speaker: toueno
          text: “妈妈，他们带着狼找来了，已经什么都知道啦！他们准会杀了我，也许连你都不放过。你照我的话做，躺在地上装死。不管发生什么，千万别出声。”
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 几秒钟后，三兄弟闯进小屋。他们看见母亲直挺挺躺在地上，图埃诺跪在旁边，正朝她耳朵使劲吹口哨。
        - id: ch02-b06
          speaker: eldest_brother
          text: “你这无赖，又在耍什么花样？”
          emotion: angry
        - id: ch02-b07
          speaker: toueno
          text: “我还能做什么？朋友们，我是世上最不幸的人。最好的母亲死了，往后我可怎么活呀！”
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: 图埃诺用手蒙住脸，呜呜地哭起来。大哥却不明白，他为什么一直吹口哨。
        - id: ch02-b09
          speaker: eldest_brother
          text: “你哭就哭，干吗吹得这么响？”
        - id: ch02-b10
          speaker: toueno
          text: “这是最后的希望。听说这只口哨能让死人活过来，我原本还盼着……”
        - id: ch02-b11
          speaker: narrator
          text: 他又埋下脸，从指缝偷看。三兄弟的六只眼睛已经睁得像碟子一样大。
        - id: ch02-b12
          speaker: toueno
          text: “快看！她刚才好像动了！鼻翼也在抽动。口哨的法力果然还在！”
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: 图埃诺俯下身，吹得比刚才更加响亮。母亲的手脚先显出一点活气，没过多久，连头也能抬起来了。三兄弟亲眼看着一个死人恢复生命，惊得半晌讲不出话。过了好一阵，大哥终于回过神来，转身对男孩开了口。
        - id: ch02-b14
          speaker: eldest_brother
          text: “小子，你明知是狼，还把它当公羊卖给我们，实在坏透了。我们本来要狠狠教训你。只要你交出这只口哨，我们就饶你一次，从此不来找麻烦。”
        - id: ch02-b15
          speaker: toueno
          text: “这是我唯一的宝贝，实在舍不得。可你们这么想要……好吧，那就拿去吧。”
        - id: ch02-b16
          speaker: narrator
          text: 图埃诺装出万分为难的样子，把口哨交给大哥。三兄弟欢天喜地地回家。走在路上，三弟突然冒出一个主意。
        - id: ch02-b17
          speaker: youngest_brother
          text: “咱们的妻子又懒又爱抱怨，害得大家一天到晚不得安生。回去就把她们杀掉，再用口哨救活。她们受过这场惊吓，以后准能记住教训。”
        - id: ch02-b18
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: “真聪明！除了你，谁能想出这种办法！”
        - id: ch02-b19
          speaker: narrator
          text: 三个丈夫高高兴兴地打倒各自的妻子，女人当场便死了。接着，他们一个接一个拿起口哨，使出全身力气去吹，吹得肺都快裂开，女人却还是冷冰冰、直挺挺地躺着，眼皮一下也没动。三个人渐渐脸色发白，浑身发冷。他们做梦也没料到会变成这样，本来更不想真害死妻子。过了好一阵，他们终于明白，再吹下去也没有用，自己又中了图埃诺的诡计。三个人沉着脸站起来，拿起一只大口袋，原路返回那间小屋。
    - id: ch03
      title: 口袋里的主教
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这一回，图埃诺正在睡觉，直到三兄弟进门才睁开眼。他们一句话也不说，抓起他塞进口袋，扎紧袋口，由大哥扛在肩上。三人朝远处的河边走去，要把这个坏小子淹死。
        - id: ch03-b02
          speaker: narrator
          text: 河离那里很远，天气又热，图埃诺还沉得要命，比一整捆麦子都重。三兄弟轮流扛着，照样累得筋疲力尽，渴得喉咙冒烟。路边终于出现一家小酒馆，他们像得救似的把口袋扔在长凳上，赶紧进去喝点东西。谁也没有留意，凳子另一头的阴凉里坐着一个乞丐。图埃诺的耳朵却很尖，他听见有人正在吃东西。农夫们一走进酒馆，他便在袋子里低声呻吟。
        - id: ch03-b03
          speaker: beggar
          text: “可怜的孩子，你怎么了？他们为什么把你关在袋子里？”
        - id: ch03-b04
          speaker: toueno
          text: “他们非要我当主教，我不答应，就把我关起来了。”
        - id: ch03-b05
          speaker: beggar
          text: “哎呀，当主教也不算坏事啊。”
          emotion: surprised
        - id: ch03-b06
          speaker: toueno
          text: “我没说它不好，可我自己实在不愿意。你要是想戴主教冠，只管解开袋子，换你进来。”
        - id: ch03-b07
          speaker: beggar
          text: “那可再好不过了！”
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 乞丐弯腰解开大结，放出图埃诺，自己钻进袋子。三兄弟喝完回来，照原先的打算把口袋扔进河里。他们哪里知道，淹死的不是图埃诺—布埃诺，而是那个乞丐。
    - id: ch04
      title: 河底的集市
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天早上，三个妻子下了葬。三兄弟从墓地回来的路上，迎面看见图埃诺—布埃诺赶着一大群肥壮漂亮的羊。眼前这个人昨天明明已经被他们扔进河里，如今却活得好好的。三人盯着他看，惊得齐齐站住了脚。
        - id: ch04-b02
          speakers: [eldest_brother, second_brother, youngest_brother]
          ensemble: chorus
          text: “你这恶棍！昨天明明把你淹死了，今天怎么又好端端地回来，还带着这么多羊？”
          emotion: surprised
        - id: ch04-b03
          speaker: toueno
          text: “这事确实有点古怪。你们大概不知道，这个世界下面还有另一个世界，比这里美得多，也富裕得多。你们把我扔进河里，正好送我去了那里。起先我有点不习惯，后来四处一看，发现落下去的地方旁边正在开羊市。”
        - id: ch04-b04
          speaker: toueno
          text: “有个人告诉我，那座城每天都有地方卖马或卖牛。我要是恰好从马市那边落下去，现在准已经发了大财。可惜我落在羊市旁，只能带回这些羊。好在那里的羊一分钱也不要。”
        - id: ch04-b05
          speaker: eldest_brother
          text: “那河里哪一点正在马市上方，你真的知道？”
        - id: ch04-b06
          speaker: toueno
          text: “我亲眼看过，怎么可能不知道？”
        - id: ch04-b07
          speaker: eldest_brother
          text: “既然如此，你就得把我们扔进马市上方的河水里。否则，我们一定要替死掉的羊群和妻子报仇。”
          emotion: angry
        - id: ch04-b08
          speaker: toueno
          text: “那好。你们找来三只口袋，跟我到伸向河面的岩石上去。我从那里把你们扔下去，你们差不多会直接落在马背上。”
        - id: ch04-b09
          speaker: narrator
          text: 三兄弟果然钻进各自的口袋。图埃诺把他们一个接一个扔进河里。从此，再也没有人见过他们，世上也再没人知道他们究竟落进了哪一个集市。
        - id: ch04-b10
          speaker: narrator
          text: 这个故事选自保罗·塞比约的《奥弗涅口头文学》。
