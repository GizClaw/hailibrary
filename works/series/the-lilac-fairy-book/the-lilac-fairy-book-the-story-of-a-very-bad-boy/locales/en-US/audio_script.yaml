  chapters:
    - id: ch01
      title: The Wolf by the Tail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, in a little village in the very middle of France, there lived a widow and her only son. He was about fifteen and his name was Antoine, though everyone called him Toueno-Boueno. They were terribly poor. On windy nights, their hut shook around them so hard that they expected the walls to fall in and crush them. But Toueno-Boueno did not go out to work as a boy his age should. He spent his days wandering along the street, staring at the ground and noticing nothing around him.
        - id: ch01-b02
          speaker: mother
          text: My dear boy, you really are very, very foolish. One thing is certain. You will never catch a wolf by the tail.
        - id: ch01-b03
          speaker: narrator
          text: His mother would say this with a laugh. Then one day, she sent Antoine into the forest to gather enough dry leaves to make beds for them both. Before he had finished, heavy rain began to fall. He climbed into the hollow trunk of a tree, where it was so dry and comfortable that he soon fell fast asleep.
        - id: ch01-b04
          speaker: narrator
          text: After a while, a sound woke him. It was like a dog scratching at a door. Antoine suddenly felt frightened, though he did not know why. He lifted his head very carefully. Right above him, a great hairy animal was coming down the hollow tree, tail first.
        - id: ch01-b05
          speaker: toueno_boueno
          text: That must be the wolf everyone talks about.
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: He squeezed himself into a corner and tried to become as small as he could. The wolf came slowly down inside the tree. Antoine was so terrified that he felt like stone and hardly dared breathe. Then an idea came to him. His mother had once told him that a wolf could not bend its back or turn its head to look behind. Quick as lightning, Antoine reached up, seized the wolf's tail, and pulled it toward him.
        - id: ch01-b07
          speaker: narrator
          text: Antoine climbed out of the tree and dragged the animal all the way to his mother's hut.
        - id: ch01-b08
          speaker: toueno_boueno
          text: Mother, you always said I was too foolish to catch a wolf by the tail. Well, look at me now!
          emotion: happy
        - id: ch01-b09
          speaker: mother
          text: Well, well. Wonders truly never end.
        - id: ch01-b10
          speaker: narrator
          text: His mother was careful to stay a safe distance from the wolf.
        - id: ch01-b11
          speaker: mother
          text: Since you really have caught him, perhaps we can make him useful. Bring me the skin of the ram that died last week. It is in the chest. We will sew the wolf into it. He will look like a splendid ram, and tomorrow we can take him to the fair and sell him.
        - id: ch01-b12
          speaker: narrator
          text: The wolf was cunning and clever. He may well have understood every word, but he decided not to show it. He let them sew the ram's skin around him.
        - id: ch01-b13
          speaker: wolf
          text: I can escape whenever I choose. There is no need to hurry.
        - id: ch01-b14
          speaker: narrator
          text: So the wolf stayed perfectly still. The skin was pulled over his head, making him hot and uncomfortable. Fingers and noses came very close to his mouth, but he fought the urge to snap them off.
        - id: ch01-b15
          speaker: narrator
          text: The fair was crowded the next day when Toueno-Boueno arrived with his wolf dressed as a ram. Farmers gathered around. One offered more money, then another offered still more. They all said they had never seen such a magnificent animal. After a great deal of bargaining, three brothers bought him for a good sum.
    - id: ch02
      title: Three Ruined Flocks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Each brother owned a large flock of sheep, though none of their sheep seemed as large or fine as the animal they had just bought.
        - id: ch02-b02
          speaker: eldest_brother
          text: My flock is closest. We will leave our new ram in that fold tonight. Tomorrow, we can decide which pasture suits him best.
        - id: ch02-b03
          speaker: narrator
          text: The wolf heard him, grinned, and carried his head a little higher.
        - id: ch02-b04
          speaker: narrator
          text: Early the next morning, the eldest brother went to look over his farm. He visited the sheepfold first. Every sheep lay dead before him except one, which the wolf had eaten, bones and all. At once, the farmer understood. The creature curled in the corner and pretending to sleep was no ram. It was a wolf. And in truth, the wolf could bend his back and turn his head as much as he pleased. He was watching the farmer from the corner of one eye and might leap at him at any moment.
        - id: ch02-b05
          speaker: narrator
          text: The eldest brother pretended not to notice. He remembered a trick his second brother had played on him and saw a fine chance for revenge.
        - id: ch02-b06
          speaker: eldest_brother
          text: This ram will not touch the grass in my field. You had better take him to the riverside pasture, where your flock is feeding.
        - id: ch02-b07
          speaker: narrator
          text: The second brother eagerly took the bait. That evening, the wolf was driven down to the field where he kept the sheep their father had left him. By morning, every one of those sheep was dead too. But the second brother also said nothing. He allowed the youngest brother's sheep to meet the same fate.
        - id: ch02-b08
          speaker: narrator
          text: Only then did the three brothers meet and admit what had happened to their flocks. They agreed to take the animal straight back to Toueno-Boueno and give the boy a thorough beating.
        - id: ch02-b09
          speaker: narrator
          text: Antoine was sitting in a neighbor's plum tree, eating ripe fruit, when he saw the three young farmers coming. He swung down from the branch and flew home to the hut.
        - id: ch02-b10
          speaker: toueno_boueno
          text: Mother! The farmers are almost here, and they have brought the wolf back. They know the truth. They will kill me, and perhaps they will kill you too. But if you do exactly what I say, I may be able to save us both. Lie on the floor and pretend you are dead. Whatever happens, do not speak.
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: A few seconds later, the three brothers entered the hut, each carrying a whip. They found the woman stretched out on the floor. Toueno knelt beside her, whistling loudly into her ears.
    - id: ch03
      title: The Whistle That Raised the Dead
      blocks:
        - id: ch03-b01
          speaker: eldest_brother
          text: What are you up to now, you rascal?
        - id: ch03-b02
          speaker: toueno_boueno
          text: What am I doing? Oh, my poor friends, I am the most miserable person alive! I have lost the best mother in the world. I do not know what will become of me.
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: He hid his face in his hands and sobbed again.
        - id: ch03-b04
          speaker: eldest_brother
          text: Then why are you whistling at her like that?
        - id: ch03-b05
          speaker: toueno_boueno
          text: It is my only chance. People say this whistle can bring the dead back to life. I was hoping it might—
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: Toueno buried his face in his hands once more. But he peeped between his fingers and saw all six of the brothers' eyes open as wide as saucers.
        - id: ch03-b07
          speaker: toueno_boueno
          text: Look! I am certain her body moved! And now her nostrils are twitching. Ah, the whistle still has its power!
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: He bent over his mother and whistled louder. Her feet and hands began to move. Soon she could even lift her head. The farmers were so amazed to see her return to life that none of them could speak for some time. At last, the eldest faced the boy.
        - id: ch03-b09
          speaker: eldest_brother
          text: Listen carefully. There is no doubt that you are a young villain. You knew that animal was a wolf when you sold it to us as a ram. We came here today to punish you for it. But give us that whistle, and we will forgive you and leave you alone.
        - id: ch03-b10
          speaker: toueno_boueno
          text: This whistle is my only treasure, and it means a great deal to me. Still, if you want it so badly, I suppose I cannot say no.
        - id: ch03-b11
          speaker: narrator
          text: He pretended to hesitate, then held out the whistle. The eldest brother tucked it into his pocket.
        - id: ch03-b12
          speaker: narrator
          text: The three brothers went home full of joy. As they walked, the youngest told the others about a wonderful idea.
        - id: ch03-b13
          speaker: youngest_brother
          text: Our wives are lazy, they are always grumbling, and they make our lives miserable. Let us teach them a lesson. As soon as we get home, we will kill them. We can bring them straight back to life, of course, but what a fright they will have!
        - id: ch03-b14
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: What a clever plan! No one else would ever have thought of it.
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: So the three husbands cheerfully knocked down their three wives, and the women fell dead. One after another, the men tried the whistle. They blew until it seemed their lungs would burst. But the women lay cold and stiff, without so much as moving an eyelid.
        - id: ch03-b16
          speaker: narrator
          text: The husbands turned pale. They had never imagined this would happen and had meant no harm. After a while, they understood that the whistle was useless. The boy had tricked them again. Their faces grew stern. They took a large sack and set off once more for the hut.
    - id: ch04
      title: The Sack on the Bench
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: This time, Toueno had no chance to escape. He was asleep and only opened his eyes when the brothers came in. No one said a word. They pushed him into the sack, tied its mouth, and the eldest threw it over his shoulder. Then they all set out for the river, where they meant to drown the boy.
        - id: ch04-b02
          speaker: narrator
          text: The river was a long way off. The day was very hot, and Antoine weighed more than a whole sheaf of corn. The brothers took turns carrying him, but they still grew tired and thirsty. When they saw a little roadside tavern, they gratefully dropped the sack on a bench and went inside for a drink.
        - id: ch04-b03
          speaker: narrator
          text: They never noticed the beggar sitting in the shade at the far end of the bench. But Toueno's sharp ears heard someone eating nearby. The moment the farmers were inside, he began to groan softly.
        - id: ch04-b04
          speaker: beggar
          text: What is wrong, poor boy? Why have they shut you in there?
        - id: ch04-b05
          speaker: narrator
          text: The beggar moved a little closer.
        - id: ch04-b06
          speaker: toueno_boueno
          text: They want to make me a bishop, and I refuse.
        - id: ch04-b07
          speaker: beggar
          text: Dear me! Being a bishop does not sound so bad.
        - id: ch04-b08
          speaker: toueno_boueno
          text: I never said it was bad. I simply would not like it. But if you fancy wearing a bishop's mitre, untie this sack and climb in where I am.
        - id: ch04-b09
          speaker: beggar
          text: Nothing would please me more.
        - id: ch04-b10
          speaker: narrator
          text: The beggar bent down and loosened the great knot. So when the brothers returned and carried the sack away, the man inside was the beggar, not Toueno-Boueno. It was the beggar they threw into the river.
    - id: ch05
      title: The Fair Beneath the River
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The three wives were buried the next morning. As their husbands came home from the cemetery, they met Toueno-Boueno driving a magnificent flock of sheep. The farmers stopped in astonishment.
        - id: ch05-b02
          speakers: [eldest_brother, second_brother, youngest_brother]
          ensemble: chorus
          text: You scoundrel! We drowned you yesterday, and here you are today, alive and well!
          emotion: surprised
        - id: ch05-b03
          speaker: toueno_boueno
          text: It does seem strange, does it not? But perhaps you have never heard about the other world beneath this one. It is much more beautiful and far richer than ours. That is where you sent me when you threw me into the river.
        - id: ch05-b04
          speaker: toueno_boueno
          text: At first, everything felt a little strange. Then I looked around to see what was happening. Close to the place where I landed, there was a sheep fair. Someone there told me that every day, horses or cattle were sold somewhere in the town. If only you had dropped me over the horse fair, I might have made my fortune! Instead, I had to settle for these sheep, and down there they cost nothing.
        - id: ch05-b05
          speakers: [eldest_brother, second_brother, youngest_brother]
          ensemble: chorus
          text: Do you know the exact place in the river above the horse fair?
        - id: ch05-b06
          speaker: toueno_boueno
          text: Of course I know it. I saw the place with my own eyes.
        - id: ch05-b07
          speakers: [eldest_brother, second_brother, youngest_brother]
          ensemble: chorus
          text: Then you must throw us into the river right above that horse fair. Do it, or we will take revenge for our dead flocks and our murdered wives.
        - id: ch05-b08
          speaker: toueno_boueno
          text: Very well. Bring three sacks and come with me to the rock that reaches out over the river. I will throw you in from there, and you will land almost on the horses' backs.
        - id: ch05-b09
          speaker: narrator
          text: Toueno threw all three brothers into the river. They were never seen again, so no one ever learned which fair they had fallen into.
