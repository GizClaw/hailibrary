audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    toueno_boueno:
      display_name: Toueno-Boueno
      tts:
        delivery: quick-witted, sly, and boldly self-assured
        timbre: clear and youthful
        pace: conversational
        pitch: medium-high
    mother:
      display_name: Toueno-Boueno's Mother
      tts:
        delivery: practical, amused, and sharp
        timbre: warm and weathered
        pace: conversational
        pitch: medium
    wolf:
      display_name: The Wolf
      tts:
        delivery: cunning, watchful, and dryly confident
        timbre: rough and resonant
        pace: measured
        pitch: low
    eldest_brother:
      display_name: The Eldest Brother
      tts:
        delivery: forceful, proud, and calculating
        timbre: firm and full
        pace: measured
        pitch: medium-low
    second_brother:
      display_name: The Second Brother
      tts:
        delivery: eager, wary, and plainspoken
        timbre: clear and sturdy
        pace: conversational
        pitch: medium
    youngest_brother:
      display_name: The Youngest Brother
      tts:
        delivery: excitable, smug, and impulsive
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
