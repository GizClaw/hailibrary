audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 年老虚弱，临终嘱咐时郑重慈爱
        timbre: 苍老低沉的男声
        pace: 缓慢
        pitch: 低
    mother:
      display_name: 母亲
      tts:
        delivery: 病弱温柔，临终话语轻而清楚
        timbre: 苍老柔和的女声
        pace: 缓慢
        pitch: 中低
    girl:
      display_name: 姑娘
      tts:
        delivery: 善良坚韧，受苦时克制，重获希望后明朗柔和
        timbre: 清澈柔韧的年轻女声
        pace: 适中
        pitch: 中高
    brother:
      display_name: 哥哥
      tts:
        delivery: 自私嫉妒，发怒时凶狠急躁，谎言说得刻意恭敬
        timbre: 偏硬的成年男声
        pace: 适中偏快
        pitch: 中低
    neighbor:
      display_name: 邻居
      tts:
        delivery: 朴实客气，开口求人时爽快
        timbre: 温和的成年女声
        pace: 适中
        pitch: 中
    village_youth:
      display_name: 村中青年
      tts:
        delivery: 随和直白，闲谈时自然轻快
        timbre: 清亮的年轻男声
        pace: 适中
        pitch: 中
    sister_in_law:
      display_name: 嫂子
      tts:
        delivery: 娇纵贪心，抱怨时委屈而尖刻
        timbre: 尖亮的成年女声
        pace: 偏快
        pitch: 高
    wife_slave:
      display_name: 嫂子的奴仆
      tts:
        delivery: 谨慎顺从，回话简短
        timbre: 平实的成年男声
        pace: 适中
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 善良果断，温和时真诚，悲痛或愤怒时仍吐字清楚
        timbre: 清朗稳重的年轻男声
        pace: 适中
        pitch: 中
    prince_slave:
      display_name: 王子的奴仆
      tts:
        delivery: 忠实机敏，禀报时恭敬简洁
        timbre: 清晰的成年男声
        pace: 适中偏快
        pitch: 中
    attendant:
      display_name: 随从
      tts:
        delivery: 恭敬急切，询问时气息稍促
        timbre: 年轻有力的男声
        pace: 偏快
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严急躁，好奇时直接，心虚时略显迟疑
        timbre: 洪亮厚实的成年男声
        pace: 适中
        pitch: 低
    queen:
      display_name: 王后
      tts:
        delivery: 端庄克制，忧虑或心虚时声音放轻
        timbre: 成熟柔和的女声
        pace: 适中偏慢
        pitch: 中
    passerby:
      display_name: 镇上路人
      tts:
        delivery: 随口谈论新鲜事，语气自然
        timbre: 朴实的成年男声
        pace: 适中
        pitch: 中
    grey_snake:
      display_name: 小灰蛇
      tts:
        delivery: 机敏友善，指引时笃定，惜别时含蓄
        timbre: 轻柔灵巧的中性声音
        pace: 适中
        pitch: 中高
    pursuing_snake:
      display_name: 追赶的蛇
      tts:
        delivery: 急迫多疑，问话短促
        timbre: 沙哑偏冷的中性声音
        pace: 快
        pitch: 中低
    snake_father:
      display_name: 蛇父
      tts:
        delivery: 年长厚道，感激中带稳重威严
        timbre: 低缓温厚的男声
        pace: 偏慢
        pitch: 低
    snake_mother:
      display_name: 蛇母
      tts:
        delivery: 慈爱热情，惜别时真挚伤感
        timbre: 柔和成熟的女声
        pace: 适中偏慢
        pitch: 中
    ring_voice:
      display_name: 戒指之声
      tts:
        delivery: 轻细神秘，回应迅速而恭敬
        timbre: 细小明亮的中性声音
        pace: 适中
        pitch: 高
  chapters:
    - id: ch01
      title: 祝福与南瓜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，棕榈林下有一间茅屋，住着一对老夫妻和一儿一女。一家人和睦地过了许多年。后来父亲病重，自知快要离世，便把两个孩子叫到身边。当地人没有床，他只能躺在地上。
        - id: ch01-b02
          speaker: father
          text: “儿子，我没有牛群留给你。家里也只有眼前这点东西，你知道我们很穷。你自己选吧，是要我的祝福，还是要我的财物？”
        - id: ch01-b03
          speaker: brother
          text: “我当然要财物。”
        - id: ch01-b04
          speaker: narrator
          text: 父亲点点头，又转向站在哥哥身旁的女儿。
        - id: ch01-b05
          speaker: father
          text: “那你呢？”
        - id: ch01-b06
          speaker: girl
          text: “我要您的祝福。”
        - id: ch01-b07
          speaker: narrator
          text: 父亲给了姑娘许多祝福，当夜便去世了。母亲和两个孩子为他哀悼了整整七天，又依照本族世代相传的习俗将他安葬。可一家人才刚刚度过服丧的日子，悲伤还没有散去，母亲也染上了当地常见的疾病。
        - id: ch01-b08
          speaker: mother
          text: “我要离开你们了。儿子，你先选吧，是要祝福，还是要财物？”
        - id: ch01-b09
          speaker: brother
          text: “我当然要财物。”
        - id: ch01-b10
          speaker: mother
          text: “女儿，你呢？”
        - id: ch01-b11
          speaker: girl
          text: “我要您的祝福。”
        - id: ch01-b12
          speaker: narrator
          text: 母亲也给了她许多祝福，当夜去世。两个孩子再次守满哀悼的日子。服丧期一结束，哥哥便叫妹妹把父母留下的东西全搬到茅屋外面，随后一件一件尽数拿走。他只给妹妹剩下一口小锅，还有一只用来舂粮食的臼。可姑娘连一粒可以放进臼里的粮食都没有，只能又饿又伤心地坐在空荡荡的屋里。就在这时，邻居敲响了门。
        - id: ch01-b13
          speaker: neighbor
          text: “我的锅在火上裂了。借你的锅煮顿晚饭吧，我拿一把粮食来谢你。”
        - id: ch01-b14
          speaker: narrator
          text: 姑娘高兴地答应了。邻居借走锅，送来一把粮食，她当晚自己也终于有饭吃。第二天，又一个女人来借锅，接着是第三个、第四个。村里的锅从没有像那阵子一样，一个接一个地出事。每个借锅的人都会送来粮食，姑娘靠这些粮食渐渐吃得丰润起来。一天傍晚，她在墙角捡到一粒南瓜籽，便把它种在自家井边。种子抽出嫩芽，瓜藤很快长大，结了许多南瓜。
        - id: ch01-b15
          speaker: narrator
          text: 后来，一个村中青年路过哥哥居住的地方。哥哥游手好闲，生活很不顺心，碰见青年便问起妹妹。
        - id: ch01-b16
          speaker: brother
          text: “我妹妹近来怎么样？”
        - id: ch01-b17
          speaker: village_youth
          text: “她过得很好，人也长得白白胖胖。村里的女人借她的臼和锅，给她的食物多得根本吃不完。”
        - id: ch01-b18
          speaker: narrator
          text: 青年走后，哥哥妒火中烧，当即动身赶回茅屋。天亮以前，他看见锅和臼放在屋外，便把两样东西搭在肩上偷走了，还为自己的聪明十分得意。妹妹醒来，原想用锅煮些粮食做早饭，却到处找不到锅和臼。她猜是夜里来了贼，只得转身去看南瓜是否成熟。瓜藤上果实累累，沉甸甸的重量几乎压断了藤架。她吃掉自己需要的，把其余南瓜全拿到村里换粮。女人们从没吃过这样甜的南瓜，叫她每天有多少便送多少来。姑娘换得的粮食越来越多，不但足够自己吃，还换回一口锅和一只臼，觉得自己已经很富足。
        - id: ch01-b19
          speaker: narrator
          text: 嫂子也听说了那棵瓜藤，叫奴仆带一把谷粒去买南瓜。姑娘起初说，藤上的果实只剩下很少几个，实在不能再卖。后来听说来人是哥哥家的奴仆，她改变了主意，亲自走到瓜藤下面，替嫂子摘下最大也最熟的一只。
        - id: ch01-b20
          speaker: girl
          text: “把这只送给你的女主人。谷粒留下吧，这南瓜是我送她的。”
        - id: ch01-b21
          speaker: narrator
          text: 嫂子看见那个又大又熟的南瓜，高兴极了。尝过以后，她认定这是自己一生吃过最美味的东西。整个夜晚，她脑子里再也容不下别的。第二天一早，她又叫来一个奴仆，因为这个有钱的女人家中奴仆很多。可姑娘刚刚看过瓜藤，南瓜确实已经全部吃完，只得让他空手回去。傍晚，哥哥从很远的地方打猎归来，发现妻子正在流泪。
        - id: ch01-b22
          speaker: brother
          text: “你为什么哭？”
        - id: ch01-b23
          speaker: sister_in_law
          text: “我拿粮食叫人去你妹妹那里买南瓜，她却不肯卖，还说一个也没有。可她明明肯卖给别人。”
          emotion: sad
        - id: ch01-b24
          speaker: brother
          text: “先睡吧。明天我去拔掉她的瓜藤，看她还敢不敢这样对你。”
        - id: ch01-b25
          speaker: narrator
          text: 天亮前，哥哥来到妹妹家，见她正在舂粮，便责问为何不把南瓜卖给自己的妻子。
        - id: ch01-b26
          speaker: girl
          text: “上一批已经吃完，下一批还没长出来。前天她的奴仆来时，只剩四只，我白送了他一只，连粮食都没有收。”
        - id: ch01-b27
          speaker: brother
          text: “我不信！你一定全卖给了别人。我要砍掉这棵瓜藤！”
          emotion: angry
        - id: ch01-b28
          speaker: girl
          text: “你要砍它，就连我的手一起砍吧！”
        - id: ch01-b29
          speaker: narrator
          text: 姑娘冲到瓜藤旁，伸手把它紧紧抓住。哥哥追上来，只砍了一刀，瓜藤和妹妹的手便一齐落地。随后，他闯进屋里，把能找到的东西全都拿走，又把茅屋卖给一个早就想买下它的朋友。姑娘从此连一个容身之处也没有。她仔细洗净手臂，在伤口上敷好附近生长的疗伤树叶，再用布把叶子和手臂紧紧裹住。做完这些，她逃进森林深处藏了起来，免得哥哥再次找到她。

    - id: ch02
      title: 树上的眼泪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姑娘在森林里走了整整七天，只吃头顶树上结的果子。每到夜里，她就爬上树，把身子安稳地藏进缠绕粗枝的藤蔓间。这样一来，狮子、老虎和豹子都碰不到她。第七天清晨，她从栖身的树上醒来，看见森林边缘的小镇升起炊烟。那些茅屋反而叫她比先前更加孤苦无依。附近没有一条溪流，她口渴得厉害，只想喝一口装在葫芦里的奶。可失去一只手以后，她还能靠什么换来东西呢？这个念头夺走了她最后一点勇气，她坐在高高的树上，放声痛哭。
        - id: ch02-b02
          speaker: narrator
          text: 国王的儿子那天一早出城打鸟。太阳晒热以后，他困倦了，便叫随从们继续打猎，只留下一个奴仆陪伴。王子在树下睡了很久，忽然有又湿又咸的水滴落在脸上，把他惊醒。
        - id: ch02-b03
          speaker: prince
          text: “怎么回事，下雨了吗？你去看看。”
        - id: ch02-b04
          speaker: prince_slave
          text: “主人，没有下雨。”
        - id: ch02-b05
          speaker: prince
          text: “那就爬上树，看看水是从哪里来的。”
        - id: ch02-b06
          speaker: narrator
          text: 奴仆上去看过，回来禀报，树上坐着一位美丽的姑娘，落在王子脸上的一定是她的泪水。
        - id: ch02-b07
          speaker: prince
          text: “她为什么哭？”
        - id: ch02-b08
          speaker: prince_slave
          text: “我不敢问。也许，她愿意告诉您。”
        - id: ch02-b09
          speaker: narrator
          text: 王子十分惊奇，亲自爬上树，温和地问姑娘出了什么事。她只哭得更厉害。
        - id: ch02-b10
          speaker: prince
          text: “你究竟是凡间女子，还是森林里的精灵？”
        - id: ch02-b11
          speaker: girl
          text: “我是凡间女子。”
        - id: ch02-b12
          speaker: narrator
          text: 她慢慢说着，用藤蔓的叶子擦了擦眼睛。
        - id: ch02-b13
          speaker: prince
          text: “那你为什么这样伤心？”
        - id: ch02-b14
          speaker: girl
          text: “我有太多事情可以哭了，多得你根本猜不到。”
        - id: ch02-b15
          speaker: prince
          text: “跟我回去吧，我家离这里不远。到我父母那里去，我是国王的儿子。”
        - id: ch02-b16
          speaker: girl
          text: “既然这样，你为什么会在森林里？”
        - id: ch02-b17
          speaker: prince
          text: “我每个月都和朋友们来这里打一次鸟。今天我累了，叫他们先走，自己留下歇息。可你为什么住在树上？”
        - id: ch02-b18
          speaker: narrator
          text: 姑娘再次流泪，把母亲去世后的一切全告诉了他。
        - id: ch02-b19
          speaker: girl
          text: “我不能跟你下去。我不愿让任何人看见我。”
          emotion: sad
        - id: ch02-b20
          speaker: prince
          text: “这件事交给我，我会想办法。”
        - id: ch02-b21
          speaker: narrator
          text: 王子从树上荡到较低的枝头，命奴仆赶快回镇里，带四个强壮的男人和一乘带帘的轿子来。奴仆走后，姑娘爬下树，藏进地面的灌木丛。轿子很快送到，就停在她藏身之处旁边。王子支开几个轿夫，叫他们去把自己的随从找来。等众人走远，他让姑娘坐进轿中，把帘子严严实实地合上，自己也从另一边上轿，等候随从回来。
        - id: ch02-b22
          speaker: attendant
          text: “王子殿下，您怎么了？”
        - id: ch02-b23
          speaker: prince
          text: “我大概病了，浑身发冷。”
        - id: ch02-b24
          speaker: narrator
          text: 王子示意轿夫起程，又拉上帘子。众人抬着他们穿过森林，一直进入他的宅邸。他随即派奴仆去告诉父王母后，自己发烧，想喝些热粥，请他们尽快送来。消息让国王和王后十分忧虑，一锅热粥马上煮好，送到所谓的病人那里。王宫正在举行议事会，会议一结束，国王便带着大臣前来探望，还替王后捎话，说她稍后也会赶来。
        - id: ch02-b25
          speaker: narrator
          text: 王子故意装病，是想先让父母为他担忧，心肠也跟着软下来。第二天，他说自己已经好些，坐着轿子隆重地前往王宫，沿路都有人击鼓。他在台阶下走出轿子，由一个奴仆举着大伞遮在头顶，再一步步登上台阶，走进父母所在的阴凉暗室。
        - id: ch02-b26
          speaker: prince
          text: “昨天我在森林遇见一位姑娘，我想娶她。我瞒着随从，用轿子把她带回了家。请你们答应吧。哪怕她只有一只手，世上也没有别的女子比她更合我的心意。”
        - id: ch02-b27
          speaker: narrator
          text: 国王和王后自然更想要一个双手健全、又能带来财富的儿媳，可他们不忍开口拒绝儿子，只得说一切由他作主，并叫人立即筹备婚宴。姑娘几乎不敢相信自己会有这样的好运。为了报答众人给她的恩情，她在公婆身边处处帮忙，待人又和气，他们很快也真心疼爱起她来。后来，她生下一个孩子。没过多久，国王派王子出门巡视王国中几座遥远的城镇，把那里出了差错的事情一一纠正。

    - id: ch03
      title: 再入森林
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子刚离开，姑娘的哥哥恰好进城。他早把妻子带来的钱财挥霍一空，已经穷困潦倒。在街上，他听见一个路人谈到王子的婚事。
        - id: ch03-b02
          speaker: passerby
          text: “你听说了吗？王子娶了一个少一只手的女人。”
        - id: ch03-b03
          speaker: brother
          text: “他是在哪里找到她的？”
        - id: ch03-b04
          speaker: passerby
          text: “在森林里。”
        - id: ch03-b05
          speaker: narrator
          text: 哥哥马上猜出那是妹妹。他想到自己想尽办法害她，她如今却比自己过得好，气得发誓还要加害她。当天下午，他进宫求见国王，来到王座前，以额触地跪拜。
        - id: ch03-b06
          speaker: brother
          text: “陛下，您的仁慈叫人骗了。王子娶的断手女人其实是女巫。她先后嫁过三个丈夫，又施邪术把他们全害死。镇上的人才砍去她一只手，把她逐进森林。她和我来自同一个镇子，我说的句句是真。”
        - id: ch03-b07
          speaker: narrator
          text: 国王越听，脸色越阴沉。他性情急躁，遇事不肯停下来细想，也没有派人去姑娘的家乡查访。那些真正认识她的人，本可以告诉国王，她过去怎样辛苦劳作，又过着怎样贫穷的生活。可国王轻信了哥哥的一派谎言，还让王后也信以为真。两人一同商议该怎么办，最后决定也把儿媳赶出镇外。可这样的惩罚仍不能叫哥哥满足。
        - id: ch03-b08
          speaker: brother
          text: “杀掉她！她胆敢嫁给王子，这是她应得的。她一死，就再也害不了别人。”
          emotion: angry
        - id: ch03-b09
          speakers: [king, queen]
          ensemble: duo
          text: “不能杀她。儿子回来一定会杀死我们。照别人从前的办法，把她赶出城去。”
        - id: ch03-b10
          speaker: narrator
          text: 哥哥只好接受这个结果。姑娘深爱丈夫，可眼下孩子比世间一切都更牵动她的心。只要把儿子抱在怀中，别的苦难似乎都没有那么要紧。她用仅剩的一只手抱着孩子，颈上挂一口做饭的小陶罐，离开那座有巨大孔雀羽扇、成群奴仆和象牙座椅的宅邸，独自走进森林。
        - id: ch03-b11
          speaker: narrator
          text: 她不知该去哪里，走累后便坐在树下哄孩子睡觉。忽然，一条蛇从灌木下爬来。
        - id: ch03-b12
          speaker: girl
          text: “这下我没命了。”
          emotion: fearful
        - id: ch03-b13
          speaker: narrator
          text: 她吓得不敢动。蛇转眼来到身边，竟然开口说话。
        - id: ch03-b14
          speaker: grey_snake
          text: “打开陶罐，让我藏进去。你替我遮住太阳，我以后替你挡雨。”
        - id: ch03-b15
          speaker: narrator
          text: 姑娘让蛇钻进罐中，盖好盖子。很快，另一条蛇追了过来。
        - id: ch03-b16
          speaker: pursuing_snake
          text: “你刚才看见一条小灰蛇从这里经过吗？”
        - id: ch03-b17
          speaker: girl
          text: “看见了，它爬得很快。”
        - id: ch03-b18
          speaker: pursuing_snake
          text: “那我得赶快追上去。”
        - id: ch03-b19
          speaker: narrator
          text: 追赶的蛇走远后，罐子里传出声音。
        - id: ch03-b20
          speaker: grey_snake
          text: “放我出来吧。现在我安全了。你这是要去哪里？”
        - id: ch03-b21
          speaker: girl
          text: “我自己也不知道，只是在森林里四处走。”
        - id: ch03-b22
          speaker: grey_snake
          text: “跟我来吧，我们一起回家。”
        - id: ch03-b23
          speaker: narrator
          text: 姑娘跟着小灰蛇穿过森林，沿绿色小径来到一座大湖边。
        - id: ch03-b24
          speaker: grey_snake
          text: “太阳这么热，你又走了很远。带孩子去那片树荫下洗个澡吧，树枝一直伸到水面上，很凉快。”
        - id: ch03-b25
          speaker: girl
          text: “好，我这就去。”
        - id: ch03-b26
          speaker: narrator
          text: 母子俩一同下了水。孩子快活地拍着水，嘴里高兴地咿呀叫着。忽然，他用力一蹬，整个身子掉进湖里，一直向下沉去。姑娘慌忙在芦苇之间到处寻找，却怎么也摸不到孩子，只得满心恐惧地回到岸边。
        - id: ch03-b27
          speaker: girl
          text: “我的孩子不见了！他一定淹死了，我再也见不到他了！”
          emotion: fearful
        - id: ch03-b28
          speaker: grey_snake
          text: “再去找一次。每个地方都摸一遍，连水里那些树根也别漏掉，他也许卡在那里。”
        - id: ch03-b29
          speaker: narrator
          text: 姑娘立刻转身下水，用完好的那只手到处摸索。她摸过水草和树根，连手指都伸进最细小的缝隙里。那缝窄得几乎连一只螃蟹也藏不进去，可依旧没有孩子的踪影。
        - id: ch03-b30
          speaker: girl
          text: “还是没有！失去他，我怎么活下去？”
          emotion: sad
        - id: ch03-b31
          speaker: grey_snake
          text: “把另一条胳膊也伸进去。”
        - id: ch03-b32
          speaker: girl
          text: “那有什么用？这条胳膊根本没有手，什么也摸不到。”
        - id: ch03-b33
          speaker: narrator
          text: 姑娘虽然不明白，仍照小蛇说的做了，把那条没有手的胳膊探进水里。就在这一刹那，受伤的手臂竟碰到一个又圆又软的东西。它正躺在一丛芦苇当中，被夹在两块石头之间。
        - id: ch03-b34
          speaker: girl
          text: “我的孩子！我的孩子！”
          emotion: surprised
        - id: ch03-b35
          speaker: narrator
          text: 她把孩子抱出水面。孩子还在笑，既没受伤，也不害怕。
        - id: ch03-b36
          speaker: grey_snake
          text: “这次找到他了吗？”
        - id: ch03-b37
          speaker: girl
          text: “找到了！而且你看，我的手也重新长出来了！”
          emotion: happy
        - id: ch03-b38
          speaker: narrator
          text: 姑娘喜极而泣。小蛇等她哭了一会儿，才继续说。
        - id: ch03-b39
          speaker: grey_snake
          text: “现在去我家吧。你救过我，我们全家都要报答你。”
        - id: ch03-b40
          speaker: girl
          text: “你让我的手长回来，已经给得太多了。”
        - id: ch03-b41
          speaker: grey_snake
          text: “快走吧，别让太阳落山。”
        - id: ch03-b42
          speaker: narrator
          text: 小蛇爬得飞快，姑娘几乎追不上。过了很久，他们来到小蛇在树上的家。它平日若不陪父母外出旅行，就住在这里。小蛇把自己的全部历险都讲给父母听，还说起自己怎样从仇敌口中逃生。蛇父母感激不尽，恨不得把一切好东西都拿来款待恩人。他们让姑娘躺在粗藤编成的吊床上休息。那些藤从树枝垂到树枝，姑娘舒舒服服地躺着，终于消除了沿途的疲惫。蛇父母替她照看孩子，请猴子朋友敲开椰子，给孩子喝里面的奶汁，又设法用尾巴捆着小果子送给母亲。姑娘终于觉得自己平安了，心也安定下来。可她没有忘记丈夫，常想让他看看儿子，有时整夜醒着，猜他此刻身在何处。

    - id: ch04
      title: 两座空坟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就这样，几个星期过去了。那么王子在哪里呢？原来，他到了王国最远的边境以后，害了一场重病。几位好心人照料他，却不知道他的身份，所以国王和王后始终没有得到儿子的消息。病愈后，王子设法回到家乡，走进父亲的宫殿。他看见一个陌生男人站在王座后，手里挥着孔雀羽扇。那人正是妻子的哥哥，已经深得国王宠信，可王子对先前的一切毫不知情。那场病把他折磨得又瘦又弱，肩膀像老人一样佝偻。父母盯着他看了片刻，竟仿佛在看一个从未见过的陌生人。
        - id: ch04-b02
          speaker: prince
          text: “你们这么快就忘记我了吗？”
        - id: ch04-b03
          speaker: narrator
          text: 国王和王后听见声音，惊叫着奔来，不住追问他出了什么事。王子没有回答。
        - id: ch04-b04
          speaker: prince
          text: “我的妻子好吗？”
        - id: ch04-b05
          speaker: narrator
          text: 沉默片刻后，王后终于开口。
        - id: ch04-b06
          speaker: queen
          text: “她死了。”
        - id: ch04-b07
          speaker: prince
          text: “死了？那我的孩子呢？”
          emotion: surprised
        - id: ch04-b08
          speaker: queen
          text: “他也死了。”
        - id: ch04-b09
          speaker: narrator
          text: 王子默默站了一会儿。
        - id: ch04-b10
          speaker: prince
          text: “带我去看他们的坟墓。”
        - id: ch04-b11
          speaker: narrator
          text: 国王原本有些心虚，听见这句话又放下心来。他早为儿子备好两座漂亮坟墓，好让儿子看过以后，永远、永远猜不到妻子的真正遭遇。几个月来，他和王后总是彼此安慰，说自己没有听从哥哥的主意处死姑娘，已经十分善良，也十分仁慈。可到了这一刻，这番话不知为什么忽然不再那么可信了。
        - id: ch04-b12
          speaker: narrator
          text: 国王带头穿过宫殿后面的庭院，又从一道门走进美丽的花园。树下的一片绿地上立着两座华丽的坟墓。王子独自上前，把头抵住冰冷的墓石，失声痛哭。父母默默站在身后，心里泛起一阵奇怪的刺痛。连他们自己也说不清，那是不是因为羞愧。很久以后，王子转身从父母身旁走过，回到宫里，叫奴仆送来丧服。整整七天，没有人见过他。七天以后，他又出门打猎，帮助父亲治理百姓，却再也没人敢在他面前提起妻子和儿子。
        - id: ch04-b13
          speaker: narrator
          text: 又一个清晨，姑娘想念丈夫，整夜未睡。她终于向小灰蛇提出告别。
        - id: ch04-b14
          speaker: girl
          text: “你们全家待我太好。现在我已经恢复健康，想回去打听丈夫的消息，看看他是不是还在为我难过。”
        - id: ch04-b15
          speaker: narrator
          text: 小蛇听了很伤心，却没有挽留。
        - id: ch04-b16
          speaker: grey_snake
          text: “是啊，你该回去了。去向我父母告别吧。他们若送你礼物，别的都不要，只收下父亲的戒指和母亲的匣子。”
        - id: ch04-b17
          speaker: narrator
          text: 姑娘去向蛇父母告别。他们一想到就要失去这位客人，哭得十分伤心，又捧出许多金银珠宝，叫她尽管拿走，带多少都可以，好留作对他们一家的纪念。姑娘却摇了摇头，把眼前那堆闪闪发亮的宝物推到一边。
        - id: ch04-b18
          speaker: girl
          text: “我永远不会忘记你们。不过，我只想收下那枚小戒指和那只旧匣子。”
          emotion: sad
        - id: ch04-b19
          speaker: narrator
          text: 两条老蛇惊慌地对望。戒指和匣子偏偏是他们最不愿送出的东西。
        - id: ch04-b20
          speakers: [snake_father, snake_mother]
          ensemble: duo
          text: “你为什么偏要这两件东西？是谁告诉你的？”
        - id: ch04-b21
          speaker: girl
          text: “没有谁，只是我自己想要。”
        - id: ch04-b22
          speakers: [snake_father, snake_mother]
          ensemble: duo
          text: “不是的，一定是我们的儿子说了。既然它答应了，就该照办。缺食物、衣裳或房屋时，你告诉戒指，它会替你找到。伤心或遇险时，你告诉匣子，它会把事情料理好。”
        - id: ch04-b23
          speaker: narrator
          text: 蛇父母一同祝福她。姑娘抱起孩子，踏上归途。

    - id: ch05
      title: 棕榈树下的宫殿
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 姑娘走了很久，终于来到丈夫和公公居住的城镇附近。她在棕榈林下停住，对戒指说自己想要一座房子。
        - id: ch05-b02
          speaker: ring_voice
          text: “已经预备好了，女主人。”
        - id: ch05-b03
          speaker: narrator
          text: 细小古怪的声音吓了她一跳。回头一看，身后竟立着一座用上好木料建成的美丽宫殿，一排奴仆手持高高的长扇，在门前俯身向她行礼。姑娘走了很远的路，又累又喜，赶紧进了宫殿。她在一间屋里发现水果和牛奶，饱饱地吃过一顿晚饭，便倒在一堆柔软的垫子上，让孩子睡在身旁，自己也沉沉睡去。
        - id: ch05-b04
          speaker: narrator
          text: 她从此安静地住下来。孩子一天比一天高，身子也越来越强壮，很快便会四处跑，还学会了说话。这样一座宫殿几乎转眼之间就出现在城外，邻居们当然议论不休。他们为那位住在里面、从不露面的富贵夫人编出各式各样的故事。后来，国王带着王子从战场归来，其中一些传闻也传到了国王耳中。
        - id: ch05-b05
          speaker: king
          text: “棕榈树下那座房子实在奇怪。我得查清里面的女人是谁。说不定根本没有什么贵夫人，只有一伙想夺我王位的叛贼。明天我带儿子和重臣过去，一定要进门看看。”
        - id: ch05-b06
          speaker: narrator
          text: 第二天日出后，王子的妻子站在屋后小丘上，看见一团尘土穿过城镇，正朝自己这边涌来。片刻以后，她又隐约听见了鼓声，那鼓声宣告国王正在驾临。她望着走近棕榈林的人群，心跳得越来越快。丈夫会不会也在他们中间？不管怎样，她不能让这些人在屋外立刻认出自己。她只来得及叫戒指备好食物，便跑回屋里，用一幅金色薄纱遮住头脸，再牵着孩子到门口等候。
        - id: ch05-b07
          speaker: narrator
          text: 没过几分钟，那支浩浩荡荡的队伍便来到宫殿门前。姑娘牵着孩子迎上去，向国王和同行的人行礼，请他们全都进屋歇息。
        - id: ch05-b08
          speaker: king
          text: “好，你在前面带路，我们跟着。”
        - id: ch05-b09
          speaker: narrator
          text: 姑娘带众人走进一间幽暗的长屋。屋中摆着一张大桌，桌上全是金杯。一只只篮子里装满椰枣、椰子，还有各种已经熟透的金黄果实。国王与王子坐在软垫上，由奴仆在旁服侍。大臣们只能站在他们身后，其中就有姑娘自己的哥哥。
        - id: ch05-b10
          speaker: narrator
          text: 姑娘一眼认出了哥哥。她心里明白，自己所有的不幸都源自这个人，他从一开始便恨她。可她把这些念头藏在心里，脸上没有显出丝毫异样。国王向她问起城里的消息，她也没有立刻回答，只请一路奔波的众人先吃喝休息。
        - id: ch05-b11
          speaker: girl
          text: “各位走了远路，一定又饿又渴。请先吃喝，等歇过来，我再把消息告诉陛下。”
        - id: ch05-b12
          speaker: king
          text: “说得有理。”
        - id: ch05-b13
          speaker: narrator
          text: 屋里安静了一阵。国王吃饱喝足，放下杯子。
        - id: ch05-b14
          speaker: king
          text: “夫人，我已经休息好了。现在请告诉我，你是谁，从哪里来。先坐下再说吧。”

    - id: ch06
      title: 故事说完以后
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 姑娘低头行过礼，在猩红的大软垫上坐下，又把睡在墙角的男孩抱到膝上，开始讲述自己一生的遭遇。哥哥越听越想逃出这座房子，躲进森林深处。可他的职责是站在国王身后挥动孔雀羽扇，为国王赶走苍蝇。若是擅自离开岗位，王宫卫士一定会把他抓住。他没有别的办法，只能僵在原地。对他还算幸运的是，国王听故事听得太入神，根本没有发现羽扇已经停下，苍蝇正落在那头浓密的卷发上跳舞。
        - id: ch06-b02
          speaker: narrator
          text: 故事一段一段讲下去。姑娘始终没有看王子一眼，哪怕隔着面纱也没有。王子却完全相反，他的目光从来没有离开过这个讲故事的人。等她说到自己孤零零坐在树上哭泣，眼泪落到树下那个人脸上时，王子终于再也忍不住，猛地跳到她和熟睡的孩子身边。
        - id: ch06-b03
          speaker: prince
          text: “她就是我的妻子！他们骗了我。原来你没有死，孩子也没有死！这究竟是怎么回事？他们为什么骗我？我的宅子本来很安全，你又为什么离开？”
          emotion: surprised
        - id: ch06-b04
          speaker: narrator
          text: 王子说完，转过身愤怒地望向父亲。姑娘请他先让自己把故事讲完，那样所有事情自然都会明白。她揭开面纱，接着说起哥哥怎样来到王宫，诬告她是杀死三个丈夫的女巫，又怎样劝国王把她杀死，免得她继续害人。
        - id: ch06-b05
          speaker: girl
          text: “不过，陛下没有杀我。如果我一直留在你的宅子里，就不会遇见小蛇，也不会重新长出这只手。所以把过去的事忘了吧，让我们重新快乐地生活。你看，我们的儿子都长成大孩子了。”
          emotion: calm
        - id: ch06-b06
          speaker: king
          text: “那要怎样处置你的哥哥？”
        - id: ch06-b07
          speaker: narrator
          text: 国王暗暗庆幸，在这件事里，总算还有人做得比他更坏。
        - id: ch06-b08
          speaker: girl
          text: “把他赶出城去。”
        - id: ch06-b09
          speaker: narrator
          text: 这个故事选自E·斯蒂尔的《斯瓦希里故事集》。
