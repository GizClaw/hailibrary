  chapters:
    - id: ch01
      title: Blessing or Property
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: An old couple lived in a hut beneath a grove of palm trees. They had a son and a daughter, and for many years the four of them were happy. Then the father fell gravely ill. Knowing he would soon die, he called his children to where he lay on the floor, since no one in that country had beds.
        - id: ch01-b02
          speaker: father
          text: My son, I am poor, as you know. I have no cattle to leave you, only the few things in this house. Which will you choose, my blessing or my property?
        - id: ch01-b03
          speaker: brother
          text: I choose the property, of course.
        - id: ch01-b04
          speaker: narrator
          text: The father nodded, then turned to the girl beside her brother.
        - id: ch01-b05
          speaker: father
          text: And what do you choose?
        - id: ch01-b06
          speaker: girl
          text: I choose your blessing.
        - id: ch01-b07
          speaker: narrator
          text: Her father blessed her many times. He died that night. His wife and children mourned him for seven days and buried him according to their people's custom. The mourning had scarcely ended when the mother caught a disease that was common in that country.
        - id: ch01-b08
          speaker: mother
          text: I must leave you now. But first, my son, tell me what you choose, my blessing or my property?
        - id: ch01-b09
          speaker: brother
          text: The property, of course.
        - id: ch01-b10
          speaker: mother
          text: And you, my daughter?
        - id: ch01-b11
          speaker: girl
          text: I choose your blessing.
        - id: ch01-b12
          speaker: narrator
          text: Her mother gave her many blessings, and that night she too died.
        - id: ch01-b13
          speaker: narrator
          text: When the mourning days ended, the brother ordered his sister to carry everything their father and mother had owned outside the hut. She obeyed and set out each possession. He gathered them up and took them away. All he left her was a little cooking pot and a vessel for cleaning corn, though she had no corn to put in it. So she sat alone in the empty hut, sad and hungry, until a neighbor knocked at her door.
        - id: ch01-b14
          speaker: neighbor
          text: My pot cracked in the fire. Lend me yours for my supper, and I will give you a handful of corn.
        - id: ch01-b15
          speaker: narrator
          text: The girl gladly lent her the pot, and the handful of corn gave her supper that night. The next day another woman needed the pot. Then another came, and another after that. Never had so many village cooking pots cracked or broken at once. Every borrower paid the girl in corn. Before long she had plenty to eat and grew quite plump. One evening she found a single pumpkin seed lying in a corner. She planted it beside her well. It sprang up into a strong vine and covered itself with pumpkins.
        - id: ch01-b16
          speaker: narrator
          text: Meanwhile, her idle brother had fallen on hard times. One day a young man from their village met him while passing through that country.
        - id: ch01-b17
          speaker: brother
          text: Have you heard any news of my sister?
        - id: ch01-b18
          speaker: village_youth
          text: She is plump and doing well. The women borrow her corn vessel and her cooking pot, and they give her more food than she can eat.
        - id: ch01-b19
          speaker: narrator
          text: The young man went on his way, but envy filled the brother. He set out at once and reached the hut before dawn. The pot and corn vessel stood outside. He slung them over his shoulders and left, very pleased with his cleverness.
        - id: ch01-b20
          speaker: narrator
          text: When the girl woke, she could not find the pot she needed for breakfast.
        - id: ch01-b21
          speaker: girl
          text: A thief must have taken them while I slept. I will see whether any pumpkins are ripe.
        - id: ch01-b22
          speaker: narrator
          text: The pumpkins were not only ripe, there were so many that their weight nearly broke the vine. She ate as much as she wanted and carried the rest into the village to exchange for corn. The women declared that they had never tasted sweeter pumpkins. They asked her to come back every day with all she could gather. Soon she was earning more corn than she needed for herself. She traded some of it for another cooking pot and another corn-cleaning vessel. With those treasures in her hut, she thought herself quite rich.
    - id: ch02
      title: The Hand Beneath the Pumpkin Vine
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Her brother's wife also heard about the pumpkins. She sent a slave with a handful of grain to buy one. At first the girl said she had too few left to spare, but when she learned who had sent him, she chose the largest, ripest pumpkin on the vine.
        - id: ch02-b02
          speaker: girl
          text: Take this to your mistress. Tell her to keep the corn. The pumpkin is my gift.
        - id: ch02-b03
          speaker: narrator
          text: Her brother's wife was delighted. It was the finest pumpkin she had ever tasted, and she thought about it all night. Early the next morning, she called another slave and sent him to ask for one more. But the girl had just checked the vine and told him they were all gone, so he returned with nothing.
        - id: ch02-b04
          speaker: narrator
          text: That evening the brother came home from a distant hunting trip and found his wife crying.
        - id: ch02-b05
          speaker: brother
          text: What has happened?
        - id: ch02-b06
          speaker: brothers_wife
          text: I sent grain to your sister to buy a pumpkin. She refused me and claimed she had none, though she sells them to everyone else.
          emotion: sad
        - id: ch02-b07
          speaker: brother
          text: Never mind it tonight. Go to sleep. Tomorrow I will tear up her pumpkin vine and punish her for treating you this way.
        - id: ch02-b08
          speaker: narrator
          text: Before sunrise he went to his sister's hut and found her cleaning corn.
        - id: ch02-b09
          speaker: brother
          text: Why did you refuse to sell my wife a pumpkin yesterday?
        - id: ch02-b10
          speaker: girl
          text: The old pumpkins are gone, and the new ones have not grown yet. When her slave came two days ago, only four were left. I gave him one and would not take his corn.
        - id: ch02-b11
          speaker: brother
          text: I do not believe you. You sold them all to other people. I am cutting down this vine!
          emotion: angry
        - id: ch02-b12
          speaker: girl
          text: If you cut down my pumpkin vine, you will have to cut off my hand with it!
        - id: ch02-b13
          speaker: narrator
          text: The girl ran to the vine and held it tight. Her brother followed. With one blow, he cut through the pumpkin vine and her hand as well.
        - id: ch02-b14
          speaker: narrator
          text: Leaving her beside the ruined vine, he went into the hut and took away everything he could find. Then he sold the hut itself to a friend who had wanted it for a long time. His sister had lost her hand, her possessions, and her home. She carefully bathed her wounded arm. Healing leaves grew nearby, so she laid them over the wound and tied them in place with a cloth. Then she went deep into the forest to hide before her brother could return and harm her again.
        - id: ch02-b15
          speaker: narrator
          text: For seven days she wandered through the forest with nowhere to go. She had no food except the fruit hanging from the trees above her. Each evening, as darkness came, she climbed high into the branches. Thick vines bound the great limbs together, and she tucked herself securely among them for the night. Up there, lions, tigers, and panthers could not reach her.
        - id: ch02-b16
          speaker: narrator
          text: On the seventh morning, she woke among the branches and saw smoke rising from a little town at the edge of the forest. The sight of its huts made her feel lonelier and more helpless than ever. No streams ran through that part of the forest. She was terribly thirsty and longed for a drink of milk from a gourd. But milk had to be earned, and how could she earn anything with only one hand? At that thought, the last of her courage failed. She sat in the tree and wept bitterly.
        - id: ch02-b17
          speaker: narrator
          text: The king's son had come from the town at dawn to shoot birds. When the sun grew hot, he became tired.
        - id: ch02-b18
          speaker: prince
          text: I will rest beneath this tree. The rest of you may go on shooting. This slave will stay with me.
        - id: ch02-b19
          speaker: narrator
          text: His attendants left, and the prince slept for a long time. Then something wet and salty fell on his face and woke him.
        - id: ch02-b20
          speaker: prince
          text: What was that? Is it raining? Go and see.
        - id: ch02-b21
          speaker: princes_slave
          text: No, master. There is no rain.
        - id: ch02-b22
          speaker: prince
          text: Then climb the tree and find out what it is.
        - id: ch02-b23
          speaker: narrator
          text: The slave climbed up. When he came down, he reported that a beautiful girl was sitting in the tree. Her tears must have fallen on the prince's face.
        - id: ch02-b24
          speaker: prince
          text: Why was she crying?
        - id: ch02-b25
          speaker: princes_slave
          text: I do not know. I was afraid to ask her, but perhaps she will tell you.
        - id: ch02-b26
          speaker: narrator
          text: Wondering greatly, the prince climbed the tree himself.
        - id: ch02-b27
          speaker: prince
          text: What troubles you?
        - id: ch02-b28
          speaker: narrator
          text: The girl only sobbed harder, so he spoke again.
        - id: ch02-b29
          speaker: prince
          text: Are you a woman, or are you a spirit of the forest?
        - id: ch02-b30
          speaker: girl
          text: I am a woman.
        - id: ch02-b31
          speaker: narrator
          text: She slowly wiped her eyes with a leaf from the vine around her.
        - id: ch02-b32
          speaker: prince
          text: Then tell me why you are crying.
        - id: ch02-b33
          speaker: girl
          text: I have more reasons to cry than you could ever imagine.
          emotion: sad
        - id: ch02-b34
          speaker: prince
          text: Come home with me. It is not far. You can stay with my father and mother. I am a king's son.
        - id: ch02-b35
          speaker: girl
          text: Then what are you doing here?
          emotion: surprised
        - id: ch02-b36
          speaker: prince
          text: Once a month, my friends and I hunt birds in this forest. I grew tired today and sent them on without me. But why are you living in this tree?
        - id: ch02-b37
          speaker: narrator
          text: The question brought back her tears. She told him everything that had happened since her mother died.
        - id: ch02-b38
          speaker: girl
          text: I cannot go down with you. I do not want anyone to see me.
          emotion: sad
        - id: ch02-b39
          speaker: prince
          text: Leave that to me. I know how to hide you.
        - id: ch02-b40
          speaker: narrator
          text: The prince promised to arrange everything. He swung down to a lower branch and ordered his slave to hurry into town. The man was to return with four strong bearers and a litter enclosed by curtains. Once the slave had gone, the girl climbed carefully from the tree and hid on the ground among the bushes. Before long, the slave came back with the men and the litter. They lowered it beside the bushes where she lay concealed.
        - id: ch02-b41
          speaker: prince
          text: All of you go and fetch my attendants. I do not want to remain here any longer.
        - id: ch02-b42
          speaker: narrator
          text: When the men were out of sight, he told the girl to climb into the litter and close the curtains tightly. He entered from the other side. Presently his attendants ran up, breathless.
        - id: ch02-b43
          speakers: [attendant_1, attendant_2]
          ensemble: duo
          text: What is wrong, son of a king?
        - id: ch02-b44
          speaker: prince
          text: I think I am ill. I feel cold.
        - id: ch02-b45
          speaker: narrator
          text: He signaled the bearers, drew the curtains, and was carried through the forest and straight into his own house.
    - id: ch03
      title: The Prince's Bride
      blocks:
        - id: ch03-b01
          speaker: prince
          text: Tell my father and mother that I have a fever and need some gruel. Ask them to send it at once.
        - id: ch03-b02
          speaker: narrator
          text: The slave hurried to the king's palace with the message. Both the king and queen were deeply troubled to hear that their son had a fever. A pot of hot gruel was prepared at once and carried to his house. The king was sitting in council, but as soon as the meeting ended, he and his ministers went to see the sick prince. The queen sent word that she would follow a little later.
        - id: ch03-b03
          speaker: narrator
          text: The prince had only pretended to be ill so that his parents would feel tender toward him. The next day he declared himself better. Drums sounded along the road as his litter carried him in state to the palace. At the steps, he got out and walked beneath a great parasol into the cool, dark room where his parents sat.
        - id: ch03-b04
          speaker: prince
          text: Yesterday I met a girl in the forest, and I want to marry her. I brought her secretly to my house in a litter. Please give us your consent. No other woman pleases me as she does, even though she has only one hand.
        - id: ch03-b05
          speaker: narrator
          text: Of course, the king and queen would have preferred a daughter-in-law with two hands. They also wished their son's bride could bring riches into the family. But they loved the prince too much to tell him no. They said he might choose for himself, and preparations for the wedding feast began immediately.
        - id: ch03-b06
          speaker: narrator
          text: The girl could hardly believe her good fortune. She was grateful for every kindness and treated her husband's parents so pleasantly while making herself so useful that they soon loved her.
        - id: ch03-b07
          speaker: narrator
          text: In time she had a baby. Soon afterward, the king sent the prince on a journey to distant towns, where he was to put right the things that had gone wrong.
        - id: ch03-b08
          speaker: narrator
          text: Once the prince had left, the girl's brother happened to enter the town. He had wasted all the wealth his wife brought him through foolish, reckless living, and now he was poor. As he passed along the street, he overheard a man speaking.
        - id: ch03-b09
          speaker: townsman
          text: Have you heard? The king's son married a woman who is missing one hand.
        - id: ch03-b10
          speaker: brother
          text: Where did he find such a woman?
        - id: ch03-b11
          speaker: townsman
          text: He found her in the forest.
        - id: ch03-b12
          speaker: narrator
          text: The cruel brother knew at once that the woman must be his sister. Rage seized him. The girl he had tried to ruin was now far better off than he was, and he swore to harm her. That afternoon he went to the palace and asked to see the king. Once admitted, he knelt and touched his forehead to the ground. The king told him to rise and explain why he had come.
        - id: ch03-b13
          speaker: brother
          text: Your kind heart has been deceived, O king. Your son married a one-handed woman, but do you know how she lost that hand? She is a witch. She married three husbands and killed each one with her magic. The people of her town cut off her hand and drove her into the forest. I know this is true because I come from the same town.
        - id: ch03-b14
          speaker: narrator
          text: The king listened, and his face grew dark. He had a quick temper, and he did not stop to ask whether the tale made sense. He never sent messengers to the girl's old town. If he had, the people there could have told him about her poverty, her hard work, and the life she had truly led. Instead, he believed every lying word. He made the queen believe the story as well. They discussed what should be done and finally decided to drive their daughter-in-law out of town. Even that was not enough for her brother.
        - id: ch03-b15
          speaker: brother
          text: Kill her. She deserves no less for daring to marry the king's son. Then she can never hurt anyone again.
          emotion: angry
        - id: ch03-b16
          speakers: [king, queen]
          ensemble: duo
          text: We cannot kill her. Our son would certainly kill us. We will do what her townspeople did and send her away.
        - id: ch03-b17
          speaker: narrator
          text: The envious brother had to accept their answer.
        - id: ch03-b18
          speaker: narrator
          text: The poor girl loved her husband dearly. Just then, however, her baby meant more to her than everything else in the world. As long as she could carry him with her, she felt that none of the rest mattered very much. She settled her son on one arm and hung a small clay cooking pot from her neck. Then she walked away from her home. She left behind the slaves, the great peacock fans, and the seats made of ivory, and once again she plunged alone into the forest.
    - id: ch04
      title: The Grey Snake's Gift
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: She wandered without knowing where she was going. After a while she grew tired and sat beneath a tree, soothing her baby to sleep. Suddenly a snake slid from the bushes toward her.
        - id: ch04-b02
          speaker: girl
          text: I am going to die.
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: She stayed perfectly still, too frightened to move. The snake reached her side and, to her amazement, spoke.
        - id: ch04-b04
          speaker: grey_snake
          text: Open your clay pot and let me hide inside. Save me from the sun, and I will save you from the rain.
        - id: ch04-b05
          speaker: narrator
          text: She opened the pot. The little grey snake slipped in, and she replaced the lid. Soon another snake came winding after him.
        - id: ch04-b06
          speaker: pursuing_snake
          text: Did a little grey snake pass this way just now?
        - id: ch04-b07
          speaker: girl
          text: Yes. It was moving very quickly.
        - id: ch04-b08
          speaker: pursuing_snake
          text: Then I must hurry if I am to catch it.
        - id: ch04-b09
          speaker: narrator
          text: The second snake rushed on. Once it was out of sight, a voice came from the pot.
        - id: ch04-b10
          speaker: grey_snake
          text: You can uncover me now.
        - id: ch04-b11
          speaker: narrator
          text: She lifted the lid, and the grey snake slid swiftly to the ground.
        - id: ch04-b12
          speaker: grey_snake
          text: I am safe. Now tell me, where are you going?
        - id: ch04-b13
          speaker: girl
          text: I cannot tell you because I do not know. I am only wandering through the forest.
        - id: ch04-b14
          speaker: grey_snake
          text: Then follow me. We will go home together.
        - id: ch04-b15
          speaker: narrator
          text: The girl followed him through the forest and along green paths until they reached a great lake. There they stopped.
        - id: ch04-b16
          speaker: grey_snake
          text: The sun is hot, and you have walked a long way. Take your baby into the water beneath those overhanging branches and cool yourselves.
        - id: ch04-b17
          speaker: girl
          text: Yes, I will.
        - id: ch04-b18
          speaker: narrator
          text: The girl agreed, and she and the baby went into the cool water. He splashed with delight and crowed at every shining drop. Then he gave a sudden spring, slipped from her, and sank down, down, down. His mother plunged after him. She searched between the reeds and all through the water, but the baby was nowhere to be found. Full of terror, she made her way back to the bank and cried out to the snake.
        - id: ch04-b19
          speaker: girl
          text: My baby is gone! He has drowned, and I will never see him again!
          emotion: fearful
        - id: ch04-b20
          speaker: grey_snake
          text: Go back into the water. Feel everywhere, even around the roots of the trees. He may be caught there.
        - id: ch04-b21
          speaker: narrator
          text: She hurried back. With her whole hand, she searched every place and pushed her fingers into cracks too small for a crab to hide in.
        - id: ch04-b22
          speaker: girl
          text: He is not here. How can I live without him?
          emotion: sad
        - id: ch04-b23
          speaker: grey_snake
          text: Put your other arm into the water too.
        - id: ch04-b24
          speaker: girl
          text: What good can that do? There is no hand on that arm to feel with.
        - id: ch04-b25
          speaker: narrator
          text: Still, she obeyed. At once her wounded arm touched something soft and round between two stones in a clump of reeds.
        - id: ch04-b26
          speaker: girl
          text: My baby! My baby!
          emotion: happy
        - id: ch04-b27
          speaker: narrator
          text: She lifted him from the water. He was laughing merrily, not hurt or frightened at all.
        - id: ch04-b28
          speaker: grey_snake
          text: Have you found him now?
        - id: ch04-b29
          speaker: girl
          text: Yes! And look. I have my hand again!
          emotion: surprised
        - id: ch04-b30
          speaker: narrator
          text: Pure joy brought tears to her eyes. The snake let her cry for a little while before he spoke.
        - id: ch04-b31
          speaker: grey_snake
          text: Now we will go to my family. All of us want to repay your kindness to me.
        - id: ch04-b32
          speaker: girl
          text: You have already done more than enough by giving me back my hand.
        - id: ch04-b33
          speaker: narrator
          text: The snake only smiled.
        - id: ch04-b34
          speaker: grey_snake
          text: We must hurry before the sun sets.
        - id: ch04-b35
          speaker: narrator
          text: He wriggled away so fast that the girl could barely keep up.
    - id: ch05
      title: The House in the Tree
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last they reached the snake's home in a tree, where he lived whenever he was not traveling with his parents. He told his family everything that had happened and how the girl had saved him from his enemy.
        - id: ch05-b02
          speaker: narrator
          text: The father and mother snakes could not do enough for the woman who had saved their son. They made her lie down in a hammock woven from the strong vines that stretched between the branches. There she could finally rest after all her wandering. The snakes watched her baby and gave him coconut milk, after persuading their monkey friends to crack the hard shells. They even learned to carry small fruits to his mother by tying them into their tails. For the first time since her exile, she felt peaceful and safe.
        - id: ch05-b03
          speaker: narrator
          text: Yet she never forgot her husband. She often wished she could show him their son, and some nights she lay awake wondering where he was.
        - id: ch05-b04
          speaker: narrator
          text: Many weeks passed this way. And what had become of the prince?
        - id: ch05-b05
          speaker: narrator
          text: At the farthest border of the kingdom, the prince had fallen seriously ill. Some kind people took him in and nursed him, but they did not know who he was. Because of that, no message about his illness ever reached the king and queen. When his strength returned, he slowly made his way home. He entered his father's palace and saw a strange man standing behind the throne, holding the fan of peacock feathers. The man was his wife's brother, whom the king now treated with great favor. The prince had never seen him before, and of course he knew nothing about what had happened in his absence.
        - id: ch05-b06
          speaker: narrator
          text: For a moment his parents only stared. Illness had left him so thin and weak that his shoulders bent like an old man's.
        - id: ch05-b07
          speaker: prince
          text: Have you forgotten me already?
        - id: ch05-b08
          speaker: narrator
          text: At the sound of his voice, they cried out and ran to him. Questions poured from them. What had happened? Why did he look so ill? He answered none of them.
        - id: ch05-b09
          speaker: prince
          text: How is my wife?
        - id: ch05-b10
          speaker: narrator
          text: No one spoke for a moment. Then the queen answered.
        - id: ch05-b11
          speaker: queen
          text: She is dead.
        - id: ch05-b12
          speaker: prince
          text: Dead? And my child?
          emotion: surprised
        - id: ch05-b13
          speaker: queen
          text: He is dead too.
        - id: ch05-b14
          speaker: narrator
          text: The prince stood silent.
        - id: ch05-b15
          speaker: prince
          text: Show me where they are buried.
        - id: ch05-b16
          speaker: narrator
          text: The king had been feeling uncomfortable, but this request gave him courage. He had prepared two beautiful tombs for his son to see. Surely they would keep the prince from ever guessing what had truly been done to his wife. During all those months, the king and queen had repeatedly told each other how good and merciful they had been. After all, they had refused the brother's demand to kill her. But with their grieving son before them, their mercy no longer seemed so certain.
        - id: ch05-b17
          speaker: narrator
          text: The king led the way across the courtyard, through a gate, and into a beautiful garden behind the palace. In a green space beneath the trees stood two splendid tombs. The prince walked toward them alone. He leaned his head against the cold stone and burst into tears. His father and mother remained behind him in silence. A strange pain stirred inside them, one they did not quite understand. Could it be that they were ashamed of themselves?
        - id: ch05-b18
          speaker: narrator
          text: After a while, the prince turned from the tombs. Without speaking to his parents, he passed them and went back into the palace. He ordered the slaves to bring him mourning clothes. For seven days, he remained alone and no one saw him. At the end of that time he began to go hunting again, and he helped his father govern the people. But no one in the palace dared speak to him about his wife or his little son.
        - id: ch05-b19
          speaker: narrator
          text: One morning, after the girl had spent the whole night thinking about her husband, she spoke to her friend the snake.
        - id: ch05-b20
          speaker: girl
          text: All of you have been so kind to me. But I am well now, and I want to go home. I must learn what has happened to my husband and whether he still mourns for me.
        - id: ch05-b21
          speaker: narrator
          text: The snake's heart grew sad, but he did not try to stop her.
        - id: ch05-b22
          speaker: grey_snake
          text: Yes, you must go. Say farewell to my father and mother. If they offer you a gift, take only my father's ring and my mother's casket.
        - id: ch05-b23
          speaker: narrator
          text: The parent snakes wept when they heard she was leaving. They offered her all the gold and jewels she could carry as a remembrance. She shook her head and pushed the shining treasure away.
        - id: ch05-b24
          speaker: girl
          text: I could never forget you. But the only keepsakes I will take are that little ring and the old casket.
          emotion: sad
        - id: ch05-b25
          speaker: narrator
          text: The two snakes looked at each other in dismay. Those were the only gifts they had hoped to keep. After a pause, they questioned her.
        - id: ch05-b26
          speakers: [father_snake, mother_snake]
          ensemble: duo
          text: Why do you want the ring and casket? Who told you about them?
        - id: ch05-b27
          speaker: girl
          text: No one told me. I simply took a fancy to them.
        - id: ch05-b28
          speaker: narrator
          text: The old snakes shook their heads.
        - id: ch05-b29
          speakers: [father_snake, mother_snake]
          ensemble: duo
          text: That is not so. Our son told you, and what he said must be done. Whenever you need food, clothing, or a house, ask the ring and it will provide them. If you are unhappy or in danger, ask the casket and it will put matters right.
        - id: ch05-b30
          speaker: narrator
          text: They both blessed her. Then she picked up her baby and went on her way.
    - id: ch06
      title: The Palace Beneath the Palms
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: She walked a long way and finally drew near the town where her husband and his father lived. In a palm grove outside the town, she stopped and asked the ring for a house.
        - id: ch06-b02
          speaker: ring_voice
          text: It is ready, mistress.
        - id: ch06-b03
          speaker: narrator
          text: The strange little whisper made her jump. She looked behind her and saw a beautiful palace built from the finest woods. A row of slaves stood at the door, bowing with tall fans in their hands. She was tired enough to welcome any shelter and entered gladly. In one room she found a good supper of fruit and milk waiting for her. When she had eaten, she stretched out on a mound of soft cushions. Her baby lay beside her, and the two of them slept.
        - id: ch06-b04
          speaker: narrator
          text: She lived there quietly. Each day her baby grew taller and stronger. Soon he could run and even talk. The neighbors had plenty to say about the house that had appeared so quickly outside town. They invented every sort of tale about the rich lady who lived there but was never seen.
        - id: ch06-b05
          speaker: narrator
          text: In time the king and prince returned from the wars, and some of those tales reached the king.
        - id: ch06-b06
          speaker: king
          text: There is something very strange about that house under the palms. I mean to discover who this hidden lady is. Perhaps there is no lady at all, only conspirators plotting to seize my throne. Tomorrow my son, my chief ministers, and I will demand to enter.
        - id: ch06-b07
          speaker: narrator
          text: Soon after sunrise the next day, the prince's wife was standing on a small hill behind her house. She saw a cloud of dust moving through the town. A moment later, the faint roll of drums reached her. Those drums announced that the king was coming, and soon she could make out a crowd approaching the palm grove. Her heart began to pound. Could her husband be somewhere among them? Whatever the answer, they must not discover who she was before she had heard why they had come.
        - id: ch06-b08
          speaker: narrator
          text: She asked the ring to prepare food, ran inside, and wrapped her head and face in a veil of golden gauze. Holding her child's hand, she waited at the door. When the procession arrived, she stepped forward.
        - id: ch06-b09
          speaker: girl
          text: Please come inside and rest.
        - id: ch06-b10
          speaker: king
          text: Gladly. Lead the way, and we will follow.
        - id: ch06-b11
          speaker: narrator
          text: She led them into a long, shadowy room. A table had been spread with golden cups and baskets overflowing with dates, coconuts, and every sort of ripe yellow fruit. The king and the prince settled onto cushions, and slaves brought food and drink to them. The ministers stood behind their rulers as they ate. Among those ministers, the veiled woman recognized her own brother, holding the great fan of peacock feathers.
        - id: ch06-b12
          speaker: girl
          text: He has caused all my suffering. He has hated me from the beginning.
        - id: ch06-b13
          speaker: narrator
          text: These thoughts stayed hidden. When the king asked for news of the town, she answered courteously.
        - id: ch06-b14
          speaker: girl
          text: You have traveled far. Eat and drink first, for you must be hungry and thirsty. Then I will tell you my news.
        - id: ch06-b15
          speaker: king
          text: That is sensible.
        - id: ch06-b16
          speaker: narrator
          text: For some time, the room was quiet as they ate. At last the king spoke again.
        - id: ch06-b17
          speaker: king
          text: Lady, I have finished and feel refreshed. Now please sit down and tell me who you are and where you came from.
        - id: ch06-b18
          speaker: narrator
          text: She bowed and sat on a large scarlet cushion. Her little boy had fallen asleep in a corner, and she lifted him onto her lap. Then she began the story of her life.
        - id: ch06-b19
          speaker: narrator
          text: As her brother listened, he longed to slip out of the house and hide in the forest. But his duty was to wave the peacock-feather fan above the king and keep away the flies. If he abandoned his post, the royal guards would seize him. He had no choice but to remain and hear every word. Luckily for him, the king was too absorbed in the story to notice that the fan had stopped moving. Flies danced freely on top of the king's thick, curly hair.
        - id: ch06-b20
          speaker: narrator
          text: The veiled storyteller continued without once looking at the prince. He, however, never took his eyes from her. When she reached the moment when she had wept in the tree, he could bear it no longer.
        - id: ch06-b21
          speaker: prince
          text: You are my wife!
          emotion: surprised
        - id: ch06-b22
          speaker: narrator
          text: He sprang to her side, where she sat with the sleeping child.
        - id: ch06-b23
          speaker: prince
          text: They lied to me. You are alive, and so is our son! What happened? Why did they deceive me? Why did you leave the house where you were safe?
          emotion: surprised
        - id: ch06-b24
          speaker: narrator
          text: He turned a fierce look on his father.
        - id: ch06-b25
          speaker: girl
          text: Let me finish. Then you will understand.
        - id: ch06-b26
          speaker: narrator
          text: She threw back her veil. Then she told how her brother had gone to the palace, accused her of witchcraft, and urged the king to kill her.
        - id: ch06-b27
          speaker: girl
          text: But the king would not kill me. And if I had remained in your house, I would never have met the snake or regained my hand. Let us put it behind us and be happy again. Look how big our son has grown.
          emotion: calm
        - id: ch06-b28
          speaker: king
          text: And what should we do with your brother?
        - id: ch06-b29
          speaker: narrator
          text: The king was relieved that someone had behaved worse than he had.
        - id: ch06-b30
          speaker: girl
          text: Send him out of the town.
