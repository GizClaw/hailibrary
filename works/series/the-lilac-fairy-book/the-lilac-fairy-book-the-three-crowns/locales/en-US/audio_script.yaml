  chapters:
    - id: ch01
      title: The Enchanted Boat
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king with three daughters. The two eldest were proud and always quarreling. The youngest was as good as her sisters were bad. Three princes came to court them. Two were every bit as proud as the elder princesses, while the youngest prince was as lovable as the youngest daughter.
        - id: ch01-b02
          speaker: narrator
          text: One day, the king, his daughters, and the three princes walked toward the lake below the palace lawn. They met a poor beggar on the way. The king gave him nothing. The two elder princesses and their sweethearts gave him nothing either. But the youngest princess and her true love gave what they could, and they gave him kind words too. Those kind words were best of all.
        - id: ch01-b03
          speaker: narrator
          text: At the water's edge stood the most beautiful boat any of them had ever seen.
        - id: ch01-b04
          speaker: eldest_princess
          text: I mean to sail in that splendid boat.
        - id: ch01-b05
          speaker: second_princess
          text: And so do I.
        - id: ch01-b06
          speaker: youngest_princess
          text: I would rather stay here. That boat may be enchanted.
        - id: ch01-b07
          speaker: narrator
          text: The others talked her into boarding. Her father was about to step in after her when a man only seven inches tall sprang onto the deck and ordered him back. The king and the princes reached for their swords, but all the strength had gone from their arms. They could not draw a single blade.
        - id: ch01-b08
          speaker: narrator
          text: Seven Inches unfastened the boat's silver chain and pushed away from shore. Then he grinned at the four helpless men.
        - id: ch01-b09
          speaker: seven_inches
          text: Say farewell to your daughters and your brides for a while. Young prince, you have nothing to fear. You will win your princess back in good time, and you will both be as happy as the day is long. Bad people would not be rich even if they rolled naked in gold. Goodbye.
        - id: ch01-b10
          speaker: narrator
          text: The boat sailed off. The princesses stretched their hands toward the shore, but they could not speak. In less time than a cat takes to lick her ear, the boat had crossed the lake. The men could not move to follow.
        - id: ch01-b11
          speaker: narrator
          text: They watched Seven Inches lift each princess from the boat and lower her in a basket down a draw-well. No one had ever seen an opening there before. As soon as the last princess vanished, strength returned to the men. They raced around the lake to the well. A white basket hung from a silk rope wound around the windlass.
        - id: ch01-b12
          speaker: youngest_prince
          text: Lower me first. I will rescue them or die trying.
        - id: ch01-b13
          speaker: second_prince
          text: No. The second princess is mine, so this turn belongs to me.
        - id: ch01-b14
          speaker: eldest_prince
          text: I am the eldest. I go before either of you.
        - id: ch01-b15
          speaker: narrator
          text: The others yielded. The eldest prince climbed into the basket, and they lowered him until the rope went slack a hundred perches below. They waited two hours. When he gave no pull on the rope, they went to dinner.
        - id: ch01-b16
          speaker: narrator
          text: Guards watched the well all night. The second prince went down the next morning, but he did not return or signal to be raised. On the third day, at last, the youngest prince took his turn and stepped into the waiting basket.
    - id: ch02
      title: The Kingdom Below
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Down and down the youngest prince went, perch after perch, as the silk rope unwound above him. The dark around him was like a great pot with its lid shut. At last he saw a glimmer far beneath his feet. Soon the basket touched ground, and he climbed out through what looked like a great limekiln.
        - id: ch02-b02
          speaker: narrator
          text: Beyond it lay woods and green fields, a castle on a lawn, and a bright sky above everything.
        - id: ch02-b03
          speaker: youngest_prince
          text: I must be in Tir-na-n-Oge. Let me see who lives in that castle.
        - id: ch02-b04
          speaker: narrator
          text: He crossed the fields and lawn. No guard stopped him, and no servant welcomed him, but the great hall door stood open. Each room he entered was finer than the last. In the finest room of all, a magnificent dinner waited on a table.
        - id: ch02-b05
          speaker: narrator
          text: The prince was very hungry, yet he was too well mannered to eat without an invitation. He sat beside the fire. Before long, he heard footsteps. Seven Inches entered, holding the youngest princess by the hand. The prince and princess flew into each other's arms.
        - id: ch02-b06
          speaker: seven_inches
          text: Why have you not begun your dinner?
        - id: ch02-b07
          speaker: youngest_prince
          text: Sir, I thought it polite to wait until someone invited me.
        - id: ch02-b08
          speaker: seven_inches
          text: The other princes had no such thought. Each began eating without permission. When I told them they had made themselves far too free, they answered me rudely. They do not feel hungry now. Look in the corners. They are marble instead of flesh and blood.
        - id: ch02-b09
          speaker: narrator
          text: Two stone statues stood there, one in each corner. The prince was frightened, but he dared not speak. Seven Inches seated him at dinner between himself and the youngest princess. The prince might have been as happy as the day was long, if only he had not seen those stone men whenever he looked up.
        - id: ch02-b10
          speaker: narrator
          text: The next morning, Seven Inches pointed toward the sun.
        - id: ch02-b11
          speaker: seven_inches
          text: Set out that way. By evening, tired and hungry, you will reach a giant's castle and find the second princess. Tomorrow evening you will find the eldest princess. Bring them both here. There is no need to ask their masters. Perhaps, if those princesses reach home, they will learn to see poor people as flesh and blood like themselves.
    - id: ch03
      title: The Giants' Castles
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The prince set off. At sunset, tired and hungry indeed, he reached the first giant's castle. The second princess was overjoyed to see him and gave him an excellent supper. Then she heard the giant at the gate and quickly hid the prince in a closet.
        - id: ch03-b02
          speaker: narrator
          text: The giant came in, sniffing the air again and again.
        - id: ch03-b03
          speaker: first_giant
          text: By my life, I smell fresh meat.
        - id: ch03-b04
          speaker: second_princess
          text: That must be the calf I had killed today.
        - id: ch03-b05
          speaker: first_giant
          text: Ah, yes. Is my supper ready?
        - id: ch03-b06
          speaker: second_princess
          text: It is ready.
        - id: ch03-b07
          speaker: narrator
          text: Before the giant left the table, he ate three quarters of a calf and drank a flask of wine. Even then, he sniffed the air once more.
        - id: ch03-b08
          speaker: first_giant
          text: I can still smell fresh meat.
        - id: ch03-b09
          speaker: second_princess
          text: You are tired. Go to bed.
        - id: ch03-b10
          speaker: first_giant
          text: When are you going to marry me? You have kept me waiting far too long.
        - id: ch03-b11
          speaker: second_princess
          text: On Saint Tibb's Eve.
        - id: ch03-b12
          speaker: first_giant
          text: If only I knew how far away that was.
        - id: ch03-b13
          speaker: narrator
          text: With that, the giant fell asleep with his head in his dish. After breakfast the next day, he went out. The second princess sent the prince onward to her eldest sister's castle.
        - id: ch03-b14
          speaker: narrator
          text: At the second castle, the eldest princess was just as glad to see the prince. She gave him supper, but soon the second giant came to the gate. Once again, the princess hid the prince in a closet. The giant entered and sniffed around the room.
        - id: ch03-b15
          speaker: second_giant
          text: There is fresh meat in this castle. I can smell it.
        - id: ch03-b16
          speaker: eldest_princess
          text: You smell the calf that was killed today. Sit down. Your supper is waiting.
        - id: ch03-b17
          speaker: narrator
          text: The second giant ate as greedily as the first. Even after his huge supper, he suspected that someone else was near. The eldest princess told him he was sleepy and sent him to bed. He asked when she meant to marry him, and she promised him Saint Tibb's Eve. The giant wondered when that day might come. Then he fell asleep.
        - id: ch03-b18
          speaker: narrator
          text: The next day passed, and the prince stayed hidden until the giant was snoring again that night. Then the eldest princess woke him. Quietly, they went to the stables, saddled two fine horses, and rode out into the field.
        - id: ch03-b19
          speaker: narrator
          text: The horses' heels struck the stones outside the gate. The giant woke and strode after them, roaring and shouting. The louder he shouted, the faster the horses ran. Yet as dawn broke, he was only twenty perches behind.
        - id: ch03-b20
          speaker: narrator
          text: Seven Inches had not sent the prince away empty-handed. The prince pulled up his horse and threw a short, sharp knife over his shoulder. At once, a thick wood sprang up between the riders and the giant. The horses caught the wind ahead of them, and the wind behind could not catch them.
        - id: ch03-b21
          speaker: narrator
          text: Near the first giant's castle, the second princess waited beneath a high hedge with a fine horse under her. But the pursuing giant was already in sight, roaring like a hundred lions. The other giant rushed out, and now both of them joined the chase.
        - id: ch03-b22
          speaker: narrator
          text: For every two bounds the horses made, the giants made three. When the giants came within seventy perches, the prince stopped again and threw a second knife behind him. The level field sank away. A quarry a quarter of a mile deep opened between them, with black water at the bottom.
        - id: ch03-b23
          speaker: narrator
          text: Before the giants could find a way around, the prince and princesses reached the magician's kingdom. Its tall thorn hedge opened by itself for anyone Seven Inches chose to admit. The three sisters rejoiced to be together again, until the elder two saw their sweethearts standing as stone statues.
        - id: ch03-b24
          speaker: narrator
          text: As they wept, Seven Inches entered and touched both statues with his rod. Marble became flesh and blood, and life returned. There was hugging and kissing all around. Then everyone sat down to breakfast, with Seven Inches at the head of the table.
    - id: ch04
      title: The Crowns and the Broken Basket
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After breakfast, Seven Inches led them to another room. Heaps of gold, silver, diamonds, silks, and satins filled it. On a table lay three sets of crowns. In every set, a gold crown rested inside a silver crown, and the silver crown rested inside one of copper.
        - id: ch04-b02
          speaker: narrator
          text: Seven Inches gave one set to each princess.
        - id: ch04-b03
          speaker: seven_inches
          text: You may all go to the bottom of the pit now. Stir the basket, and the watchers above will pull you up. Ladies, keep your crowns safe. You must wear them when you marry, and all three weddings must happen on the same day. If you marry separately, or marry without your crowns, a curse will follow. Remember my warning.
        - id: ch04-b04
          speaker: narrator
          text: They thanked him respectfully and walked arm in arm toward the draw-well. A sky and sun shone over them. Ahead rose an ivy-covered wall so high that they could not see its top. An arch opened through the wall, and the bottom of the well lay inside it. The youngest couple walked last.
        - id: ch04-b05
          speaker: youngest_princess
          text: I am sure those two princes mean to harm you. Hide these crowns under your cloak. If they make you go up last, do not climb into the basket. Put a large stone or something else heavy inside, and see what they do.
        - id: ch04-b06
          speaker: narrator
          text: Inside the dark cave, they placed the eldest princess in the basket and stirred it. Up she went. The basket returned for the second princess, and then for the youngest. Before the youngest princess rose, she put her arms around her prince's neck, kissed him, and wept a little.
        - id: ch04-b07
          speaker: narrator
          text: At last the youngest prince's turn came. He put a heavy stone in the basket and stepped aside to listen. The basket climbed about twenty perches. Then it came crashing down like thunder. The stone shattered into tiny pieces.
        - id: ch04-b08
          speaker: narrator
          text: The prince could do nothing but return to the castle. He found the finest food and drink there, a soft bed of bog down, and gardens and lawns for long walks. But no matter where he searched, he never caught sight of Seven Inches. Before a week had passed, he was weary of the place and lonely for his true love. By the end of a month, he did not know what to do with himself.
        - id: ch04-b09
          speaker: narrator
          text: One morning, he noticed a beautiful snuffbox on a table in the treasure room. He did not remember seeing it before. He picked it up and opened it. Seven Inches stepped out onto the table.
        - id: ch04-b10
          speaker: seven_inches
          text: Prince, I believe you are growing tired of my castle.
        - id: ch04-b11
          speaker: youngest_prince
          text: If my princess were here, and I could see you now and then, I would never have a gloomy day.
          emotion: sad
        - id: ch04-b12
          speaker: seven_inches
          text: You have stayed long enough, and they need you in the world above. Guard your bride's crowns. Whenever you need my help, open this snuffbox. Now walk down the garden and come back when you feel tired.
        - id: ch04-b13
          speaker: narrator
          text: The prince followed a gravel path between two quickset hedges. He walked with his eyes on the ground, thinking of one thing and another. When he finally looked up, he stood outside a smith's gate he knew well, only a mile from his princess's palace. His clothes were ragged, but the crowns were safe beneath his old cloak.
    - id: ch05
      title: The Smith's New Hand
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The smith came out and looked him over.
        - id: ch05-b02
          speaker: smith
          text: A strong fellow like you should not be idle when there is so much work waiting. Can you handle a hammer and tongs? Help me in the forge. I will give you food, a place to sleep, and a few coins once you earn them.
        - id: ch05-b03
          speaker: youngest_prince
          text: You need not ask twice. I want nothing more than work to do.
        - id: ch05-b04
          speaker: narrator
          text: The prince took up the hammer and pounded a red-hot bar while the smith turned it on the anvil to shape a set of horseshoes. They had not worked long when a tailor came in, sat down, and began sharing the news.
        - id: ch05-b05
          speaker: tailor
          text: You have heard that the two elder princesses refused to marry until their youngest sister had her crowns and her sweetheart. When they were pulling that young man up, the windlass somehow came loose. Afterward, the well, the rope, and the windlass vanished as cleanly as a mark from your palm.
        - id: ch05-b06
          speaker: tailor
          text: The two elder princes gave their sweethearts and the king no peace until everyone agreed to a wedding this morning. I went to watch. The elder brides looked splendid, with three crowns each, gold inside silver and silver inside copper. Their youngest sister stood there looking miserable.
        - id: ch05-b07
          speaker: tailor
          text: Everything was ready. The two bridegrooms strutted toward the altar rail, proud as could be. Then the floorboards opened two yards wide beneath their feet. Down they fell among the dead men and coffins in the vault. The princesses shrieked. People ran about and peered into the hole until the clerk opened the vault door. Up came the princes with their fine clothes thick with cobwebs and mold.
        - id: ch05-b08
          speaker: narrator
          text: The king had stopped the wedding.
        - id: ch05-b09
          speaker: king
          text: There is no sense trying again until my youngest daughter has her three crowns and can marry with her sisters. Whoever brings me three crowns like the others may marry her. If he does not want the bride, another man may take his place, and I will make the crown maker's fortune.
        - id: ch05-b10
          speaker: smith
          text: I wish I could make them. I studied the princesses' crowns after they came home. No blacksmith or whitesmith alive could copy such work.
        - id: ch05-b11
          speaker: youngest_prince
          text: A faint heart never won a fair lady. Go to the palace and ask for a quarter pound each of gold, silver, and copper. Bring one crown as a pattern. I pledge my head that you will have exactly what the king wants by morning.
        - id: ch05-b12
          speaker: smith
          text: Do you truly mean that?
          emotion: surprised
        - id: ch05-b13
          speaker: youngest_prince
          text: I do. Go on. The worst they can do is refuse.
        - id: ch05-b14
          speaker: narrator
          text: The smith obtained the gold, silver, copper, and pattern crown. At nightfall, the prince shut the forge door. Neighbors crowded into the yard and heard him hammering without pause until daybreak. Every so often, he tossed scraps of gold, silver, and copper through the window. The idlers scrambled after them, cursing one another while they prayed for the workman's success.
        - id: ch05-b15
          speaker: narrator
          text: Just before sunrise, the prince opened the door. He carried the three crowns his true love had given him. The people shouted and cheered. The smith asked him to come to the palace, but the prince refused. So the smith set off with the whole townland behind him.
        - id: ch05-b16
          speaker: narrator
          text: The king rejoiced when he saw the crowns.
        - id: ch05-b17
          speaker: king
          text: But you are already married, smith. What are we to do now?
        - id: ch05-b18
          speaker: smith
          text: Your Majesty, I did not make these crowns. A big fellow entered my service yesterday, and the work is his.
        - id: ch05-b19
          speaker: king
          text: Daughter, will you marry the man who made them?
        - id: ch05-b20
          speaker: youngest_princess
          text: Let me look at the crowns first, Father.
        - id: ch05-b21
          speaker: narrator
          text: The moment she examined them, she knew them. She guessed that her true love had sent them.
        - id: ch05-b22
          speaker: youngest_princess
          text: I will marry the man these crowns came from.
    - id: ch06
      title: Three Weddings
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The king turned to the eldest prince.
        - id: ch06-b02
          speaker: king
          text: Take my best coaches to the smith's forge and bring the bridegroom home.
        - id: ch06-b03
          speaker: narrator
          text: The eldest prince was too proud to like the errand, but he could not refuse. At the forge, he saw the youngest prince standing by the door and crooked a finger for him to approach the coach.
        - id: ch06-b04
          speaker: eldest_prince
          text: Are you the fellow who made those crowns?
        - id: ch06-b05
          speaker: youngest_prince
          text: Yes, I am.
        - id: ch06-b06
          speaker: eldest_prince
          text: Then brush some of that dirt off yourself and climb in. The king wants to see you. I pity the princess.
        - id: ch06-b07
          speaker: narrator
          text: The youngest prince entered the carriage. On the road, he opened the snuffbox. Seven Inches stepped out and stood upon his thigh.
        - id: ch06-b08
          speaker: seven_inches
          text: What trouble have you found now?
        - id: ch06-b09
          speaker: youngest_prince
          text: Master, please send me back to the forge and fill this carriage with paving stones.
        - id: ch06-b10
          speaker: narrator
          text: It happened at once. The prince was back in the forge, while the horses pulled a carriage that had suddenly grown very strange and heavy.
        - id: ch06-b11
          speaker: narrator
          text: In the palace yard, the king opened the door himself to honor his new son-in-law. A shower of little stones poured over his powdered wig and silk coat and knocked him down. Some people gasped, while others laughed. The king wiped blood from his forehead and glared at the eldest prince.
        - id: ch06-b12
          speaker: eldest_prince
          text: My lord, I am very sorry, but this was not my fault. I watched the young smith enter the carriage, and we did not stop once on the way.
        - id: ch06-b13
          speaker: king
          text: You must have treated him rudely. You, second prince, go and fetch the young smith. Be polite to him.
        - id: ch06-b14
          speaker: second_prince
          text: You may count on me.
        - id: ch06-b15
          speaker: narrator
          text: Some people could not be pleasant even if they tried. The second messenger was no more civil than the first. When his carriage returned and the king opened its door, a shower of mud fell over him.
        - id: ch06-b16
          speaker: king
          text: This will never do. The fox never found a better messenger than himself.
        - id: ch06-b17
          speaker: narrator
          text: The king washed and changed his clothes. Then he went to the forge himself and asked the prince to ride with him. The prince requested the other carriage. Halfway to the palace, he opened the snuffbox once more.
        - id: ch06-b18
          speaker: youngest_prince
          text: Master, I would like to be dressed according to my true rank now.
        - id: ch06-b19
          speaker: seven_inches
          text: And so you shall be. Now I must say farewell. Stay as good and kind as you have always been, and love your wife. That is all the advice I will give you.
        - id: ch06-b20
          speaker: narrator
          text: Seven Inches vanished. When the carriage door opened in the palace yard, the youngest prince stepped out as finely dressed as anyone could make him. His first act was to run to his bride and embrace her.
        - id: ch06-b21
          speaker: narrator
          text: Everyone was full of joy except the two elder princes. The weddings followed without much delay, and all three couples married on the same day. Soon the two elder couples left for their own courts. The youngest prince and princess stayed with the old king, and they were as happy as the happiest married couple you ever heard of in a story.
