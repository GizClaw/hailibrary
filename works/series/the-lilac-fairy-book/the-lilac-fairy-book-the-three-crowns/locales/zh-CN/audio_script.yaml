audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严直率，受挫时脾气明显却不失长者气度
        timbre: 浑厚的老年男声
        pace: 适中
        pitch: 低
    eldest_princess:
      display_name: 大公主
      tts:
        delivery: 骄傲任性，说话总带着理所当然的口气
        timbre: 明亮偏冷的年轻女声
        pace: 适中偏快
        pitch: 中高
    second_princess:
      display_name: 二公主
      tts:
        delivery: 任性却比姐姐稍柔和，遇险时反应敏捷
        timbre: 清晰柔亮的年轻女声
        pace: 适中
        pitch: 中高
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 善良聪慧，对心上人真挚而坚定
        timbre: 温柔清亮的年轻女声
        pace: 适中
        pitch: 中高
    eldest_prince:
      display_name: 大王子
      tts:
        delivery: 傲慢强硬，失势时仍掩不住轻蔑
        timbre: 洪亮偏硬的年轻男声
        pace: 适中
        pitch: 中低
    second_prince:
      display_name: 二王子
      tts:
        delivery: 自负急躁，对人缺少耐心和礼数
        timbre: 清朗偏尖的年轻男声
        pace: 适中偏快
        pitch: 中
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 善良勇敢，待人谦逊，危急时果断沉着
        timbre: 清朗温厚的年轻男声
        pace: 适中
        pitch: 中
    seven_inches:
      display_name: 七英寸
      tts:
        delivery: 神秘机敏，训诫恶人时锋利，对善良者温和
        timbre: 清亮而有穿透力的成年男声
        pace: 轻快而从容
        pitch: 中高
    giant_1:
      display_name: 第一名巨人
      tts:
        delivery: 粗野多疑，嗅到猎物时步步紧逼
        timbre: 粗重低沉的成年男声
        pace: 稍慢
        pitch: 低
    smith:
      display_name: 铁匠
      tts:
        delivery: 朴实爽直，对不可思议的手艺又惊又喜
        timbre: 厚实有力的成年男声
        pace: 适中
        pitch: 中低
    tailor:
      display_name: 裁缝
      tts:
        delivery: 爱讲见闻，叙说热闹场面时绘声绘色
        timbre: 清晰活跃的成年男声
        pace: 适中偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 魔船与深井
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，膝下有三个女儿。两个姐姐又骄傲又爱争吵，她们有多坏，小女儿就有多善良。后来，三个王子来到宫廷，分别向三位公主求婚。两个年长王子的脾气正配两个姐姐，小王子则和小公主一样可爱。
        - id: ch01-b02
          speaker: narrator
          text: 一天，他们一行人一起走向草坪尽头的湖边，路上遇见一个穷乞丐。国王、两个大公主和她们的心上人什么也没给。只有小公主和小王子送了东西，还说了几句暖心的话。这份善意，比施舍本身更珍贵。
        - id: ch01-b03
          speaker: narrator
          text: 他们沿着草坪往下走，到了尽头的湖边，发现那里停着一条船，美得简直一辈子也没见过。两个姐姐一看见它，马上就说要坐船游湖。小公主心里却有些不安，她总觉得这条漂亮的船来得蹊跷。
        - id: ch01-b04
          speaker: eldest_princess
          text: “这么漂亮的船，我一定要坐！”
        - id: ch01-b05
          speaker: second_princess
          text: “我也要坐船游湖！”
        - id: ch01-b06
          speaker: youngest_princess
          text: “我不想上去。万一这条船中了魔法呢？”
        - id: ch01-b07
          speaker: narrator
          text: 大家再三相劝，小公主只好登船。国王正要跟上，甲板上突然跳出一个只有七英寸高的小人，命令他退后。四个男人伸手拔剑，可胳膊里的力气全没了，哪怕剑是玩具，他们也拔不出来。
        - id: ch01-b08
          speaker: narrator
          text: 小人解开银链，把船撑离岸边，还朝他们咧嘴一笑。
        - id: ch01-b09
          speaker: seven_inches
          text: “暂且跟你们的女儿和新娘告别吧。小王子，你不用怕。时候到了，你会救回公主，从此快活得像白昼一样长。坏人哪怕赤身躺在金子里，也不算富有。再会。”
        - id: ch01-b10
          speaker: narrator
          text: 船飞快地越过湖面，连猫舔一只耳朵的工夫都没用到。三位公主朝岸上伸出双手，却一句话也说不出。四个男人眼睁睁看着七英寸扶她们下船，又用一只白篮子把她们一个个放进辘轳井。那地方从前根本没有井口。直到最后一位公主消失，他们才恢复力气。
        - id: ch01-b11
          speaker: narrator
          text: 他们绕着湖狂奔，一口气赶到井边。白篮子还挂在辘轳的绸绳上。小王子说，不论是死在下面，还是救回公主，都要先放他下去。二王子却说该轮到自己，大王子又仗着年长，抢先进了篮子。众人把他越放越深，直到看不见人。绸绳放下足有一百竿长，终于松了。他们等了两个钟头，始终没有收到拉绳的信号，只好去吃饭。卫兵守了一夜。第二天，二王子也下去了，第三天才轮到小王子。
        - id: ch01-b12
          speaker: narrator
          text: 小王子一竿又一竿地降下去，四周黑得像一口盖严的大锅。终于，下方出现微光，没过多久，他双脚着地，从一座大石灰窑里爬了出来。眼前竟有树林、碧绿的田野、草坪上的城堡，还有一整片明亮的天空。
        - id: ch01-b13
          speaker: youngest_prince
          text: “我这是到了青春之国。去看看城堡里住着谁吧。”
        - id: ch01-b14
          speaker: narrator
          text: 他穿过田野和草坪，城堡外既没人阻拦，也没人迎接，宽大的正门却敞开着。王子走过一间比一间华美的屋子，最后来到最堂皇的大厅。中央的桌上摆着丰盛的饭菜。他虽然饿极了，没受邀请却不肯吃，只在火边等候。没多久，脚步声响起，七英寸牵着小公主进来，两位恋人立刻扑进彼此怀里。
        - id: ch01-b15
          speaker: seven_inches
          text: “你怎么不吃饭？”
        - id: ch01-b16
          speaker: youngest_prince
          text: “先生，等主人相请才动筷子，这才合乎礼数。”
        - id: ch01-b17
          speaker: seven_inches
          text: “另外两个王子可没这么想。他们没有得到允许，坐下便吃。我告诉他们，主人还没开口，他们这样未免太不把自己当外人。他们却只拿恶话回敬我。现在嘛，他们大概一点也不觉得饿了。”
        - id: ch01-b18
          speaker: narrator
          text: 七英寸指向两个墙角。那里各立着一尊石像，原来两个王子已经从有血有肉的人变成了大理石。小王子吓坏了，却不敢多说。七英寸让他坐在自己和新娘中间吃饭。若不是总能看见墙角里的两个石头人，他本来可以快活得像白昼一样长。
        - id: ch01-b19
          speaker: seven_inches
          text: “今天就这样过去吧。明早朝太阳的方向走。傍晚又累又饿时，你会在一个巨人的城堡找到二公主。再过一天的傍晚，你会找到大公主。把她们一起带回来，不用问她们的主人答不答应。也许回家以后，她们会明白，穷人也跟自己一样有血有肉。”
    - id: ch02
      title: 逃离巨人的城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小王子照着指点出发，一路走了很远。太阳落山时，他果然又累又饿地赶到第一座城堡。二公主见到他，别提有多欢喜，连忙摆出一顿丰盛的晚饭。可晚饭还没安安稳稳地吃完，她就听见巨人到了大门口，只好赶紧把王子藏进壁橱。
        - id: ch02-b02
          speaker: giant_1
          text: “拿我的命担保，我闻见鲜肉味了。”
        - id: ch02-b03
          speaker: second_princess
          text: “那是我今天叫人宰的小牛。晚饭已经好了。”
        - id: ch02-b04
          speaker: narrator
          text: 巨人一顿饭吞下四分之三头小牛，又喝掉一瓶酒，吃完还说鲜肉味没散。
        - id: ch02-b05
          speaker: second_princess
          text: “你只是困了，快去睡吧。”
        - id: ch02-b06
          speaker: giant_1
          text: “你到底什么时候嫁给我？你让我等得太久了。”
        - id: ch02-b07
          speaker: second_princess
          text: “等圣蒂布永远不到的前夜吧。”
        - id: ch02-b08
          speaker: giant_1
          text: “真想知道那天还有多远。”
        - id: ch02-b09
          speaker: narrator
          text: 巨人的脑袋一头栽进盘子，睡着了。第二天早饭后，他出了门。二公主便送小王子去大姐的城堡。那里也发生了同样的事。等夜里巨人鼾声大作，大公主叫醒睡着的王子。两人跑进马厩，给两匹骏马上好鞍，骑着马冲出城堡，奔进原野。
        - id: ch02-b10
          speaker: narrator
          text: 马蹄撞响门外的石头，巨人马上追来。他吼得越响，两匹马跑得越快。天刚亮，他已经追到二十竿外。王子勒住马，把七英寸给他的短刀向后一扔，一片密林立刻拔地而起，挡住巨人。
        - id: ch02-b11
          speaker: narrator
          text: 两人迎着前方的风飞奔，身后的风都追不上他们。到了另一座城堡附近，二公主已经骑着好马，在高树篱下等着。可第一个巨人又追了上来，吼声像一百头狮子。第二个巨人也冲出城堡，加入追赶。
        - id: ch02-b12
          speaker: narrator
          text: 两名巨人紧追不放。马每跳两下，巨人就跨三步。距离只剩七十竿时，王子再次停下，反手扔出第二把刀。平坦的原野整个塌陷，双方之间化成一座四分之一英里深的石坑，坑底尽是黑水。等巨人绕过大坑，三人早已穿过高高的荆棘篱笆。那道篱笆会为七英寸愿意放行的人自动敞开，他们终于回到了他的国土。
        - id: ch02-b13
          speaker: narrator
          text: 三姐妹重新相见，欢喜极了。可两个姐姐很快看见各自的恋人化成了石像，又伤心得流下眼泪。七英寸走进来，拿魔杖轻轻一碰，两尊石像重新有了血肉和生命。众人又是拥抱，又是亲吻，随后一起坐下吃早饭，七英寸坐在桌子的上首。
        - id: ch02-b14
          speaker: narrator
          text: 饭后，他带他们走进另一间屋子。那里没有别的东西，只有一堆堆金子、银子、钻石、绸缎和软缎。桌上放着三套王冠，每套都是金冠套在银冠里，银冠又套在铜冠里。七英寸依次拿起三套王冠，给每位公主一套。
        - id: ch02-b15
          speaker: seven_inches
          text: “你们可以回到深坑底下了。摇一摇篮子，上面的人就会把你们拉上去。一定收好王冠，同一天戴着它们成婚。要是分开办婚礼，或是不戴王冠，诅咒就会跟来。记住我的话。”
    - id: ch03
      title: 留在地下的王子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 众人恭恭敬敬地向七英寸告别，随后手挽着手走到辘轳井底。一路上，他们头顶仍然有天空和太阳。面前立着一道爬满常春藤的高墙，墙顶高得根本看不见，墙下开着一道拱门，井底就在拱门里面。小公主和小王子走在队伍最后。
        - id: ch03-b02
          speaker: youngest_princess
          text: “那两个王子不会安好心。把这些王冠藏在斗篷下面。要是你不得不留到最后，别坐进篮子。放一块大石头进去，看看他们要做什么。”
        - id: ch03-b03
          speaker: narrator
          text: 进了黑洞，他们先让大公主坐进篮子，摇动篮身，上面立刻把她拉了上去。篮子再次放下，接走二公主，第三次才轮到小公主。临走前，她搂住王子的脖子，吻了他，还流了几滴泪。最后，小王子没有进去，只把一块大石头放进篮子，自己躲到一边听着。
        - id: ch03-b04
          speaker: narrator
          text: 篮子上升大约二十竿，忽然从上方掉下来，轰隆一声，像雷一样砸回井底。里面的石头也摔成无数碎块。小公主果然猜对了，那两个王子真想害死他。
        - id: ch03-b05
          speaker: narrator
          text: 小王子没有别的路可走，只好独自回到城堡。他把城堡内外找了个遍。那里随时有最好的饭菜和美酒，夜里睡的是铺着沼泽鸟绒的软床，白天也能在花园和草坪间走很长的路。可无论高处低处，他始终看不见七英寸的影子。不到一周，他便因为思念小公主而厌倦。一个月过去，更不知道该拿自己怎么办。
        - id: ch03-b06
          speaker: narrator
          text: 一天早晨，他走进藏宝室，看见桌上放着一只精美的鼻烟盒。他怎么也记不起以前是否见过。王子把盒子拿到手里，轻轻一开，七英寸便从里面走出来，站到了桌上。
        - id: ch03-b07
          speaker: seven_inches
          text: “王子，你是不是住腻我的城堡了？”
        - id: ch03-b08
          speaker: youngest_prince
          text: “要是公主在我身边，又能偶尔见到你，我就永远不会觉得凄凉。”
          emotion: sad
        - id: ch03-b09
          speaker: seven_inches
          text: “你在这里待得够久了，上面正需要你。一定保管好你新娘的王冠。以后不管什么时候需要我，只要打开这只鼻烟盒。现在到花园里走走，等累了再回来。”
        - id: ch03-b10
          speaker: narrator
          text: 王子沿着一条碎石小路走去，两边都是整齐的灌木篱笆。他低着头，心里东想西想。再次抬头时，竟已经站在一家熟悉的铁匠铺门外。从前他常常经过这里，离小公主的王宫只有一英里。他身上的衣服破烂得不能再破，王冠却好好藏在旧斗篷下。
        - id: ch03-b11
          speaker: smith
          text: “你这么一个高大壮实的小伙子，怎么能游手好闲？这里还有这么多活儿要做。你会使锤子和火钳吗？进来搭把手吧。我管你每天吃饭，也给你地方睡觉。等你真正干出了活，再给你几个便士。”
        - id: ch03-b12
          speaker: youngest_prince
          text: “不必再说了。我正想找点事做。”
        - id: ch03-b13
          speaker: narrator
          text: 王子接过锤子，卖力敲打一根烧得通红的铁条。铁匠用火钳夹着它，在铁砧上来回翻动，准备打成一副马蹄铁。锤声一下接着一下。两人才干了一会儿，一名裁缝走进来。他坐下以后便聊开了，讲起王宫当天发生的新闻。
    - id: ch04
      title: 铁匠铺里的三重王冠
      blocks:
        - id: ch04-b01
          speaker: tailor
          text: “你们都听说了吧？两位大公主原本不肯成婚，一定要等小妹带着王冠、等她的心上人回来。可大家往上拉那位准新郎时，辘轳不知怎么突然松了。从那以后，井、绳子和辘轳全不见了，就像你手掌心里从来没有这些东西。”
        - id: ch04-b02
          speaker: tailor
          text: “那两个王子不停缠着公主和国王，闹得大家片刻不得安宁，终于求得允许，把婚礼定在今天早晨。我因为好奇也跑去看了。两个新娘穿着华丽的礼服，头上戴着金、银、铜三顶相套的王冠。小公主却独自在一旁伤心地站着。”
        - id: ch04-b03
          speaker: tailor
          text: “两个新郎神气活现地走进来，趾高气扬地走向圣坛围栏。脚下的地板突然裂开两码宽，他们一下掉进地下墓室，落在死人和棺材中间。小姐们放声尖叫，众人又跑又冲，争着往下面瞧。幸亏教堂执事很快打开墓室，两位王子才爬出来，华服上盖满足有一英寸厚的蛛网和霉斑。”
        - id: ch04-b04
          speaker: narrator
          text: 国王因此推迟了婚礼，还当众宣布了自己的决定。
        - id: ch04-b05
          speaker: king
          text: “我算是看明白了。小女儿没有取回自己的三重王冠、不能跟姐姐们一起成婚，这场婚礼想办也办不成。谁能拿来一套跟姐姐们相同的王冠，我便把小女儿嫁给谁。要是那个人不想娶她，自然会有别人愿意娶，我也会赏他一份家业。”
        - id: ch04-b06
          speaker: smith
          text: “我要是做得出就好了。那些王冠我仔细看过，世上不论打铁的还是打金银的，恐怕都仿不了。”
        - id: ch04-b07
          speaker: youngest_prince
          text: “胆小的人可娶不到美人。你现在就去王宫，要四分之一磅金、四分之一磅银，再要四分之一磅铜。还得借一套王冠回来作样品。拿我的脑袋担保，明天早晨，我会把他们真正想要的东西交到你手里。”
        - id: ch04-b08
          speaker: smith
          text: “你真有把握？”
          emotion: surprised
        - id: ch04-b09
          speaker: youngest_prince
          text: “千真万确。去吧，最坏也不过失败一次。”
        - id: ch04-b10
          speaker: narrator
          text: 长话短说，铁匠果然从王宫取来四分之一磅金、四分之一磅银和四分之一磅铜，还借来一套王冠作样品。入夜，王子关上铺门。邻居们挤满院子，听他从黑夜敲到天明。窗口时不时飞出金银铜的碎片，闲汉们一面争抢咒骂，一面又替里面的工匠祈求好运。
        - id: ch04-b11
          speaker: narrator
          text: 太阳正想着要升起来时，王子打开门，拿出了小公主交给他的那套三重王冠。外面立刻欢声震天。铁匠请他一起去王宫，他却拒绝了。铁匠独自出发，全乡的人都跟在后面。国王看到那些王冠，果然喜出望外。
        - id: ch04-b12
          speaker: king
          text: “可你已经成了家，这件事该怎么办？”
        - id: ch04-b13
          speaker: smith
          text: “陛下，这些王冠不是我做的。昨天来了个大个子，在我这里做工，是他做出来的。”
        - id: ch04-b14
          speaker: king
          text: “女儿，你愿意嫁给做出王冠的人吗？”
        - id: ch04-b15
          speaker: youngest_princess
          text: “先让我看看，父亲。”
        - id: ch04-b16
          speaker: narrator
          text: 小公主接过来仔细看了看，一眼就认出了自己的王冠，也猜到一定是心上人送来的。
        - id: ch04-b17
          speaker: youngest_princess
          text: “这些王冠来自谁，我就嫁给谁。”
    - id: ch05
      title: 三场婚礼
      blocks:
        - id: ch05-b01
          speaker: king
          text: “大王子，乘我最好的马车去铁匠铺，把新郎接回来。”
        - id: ch05-b02
          speaker: narrator
          text: 大王子傲慢得很，十分不愿意接这样一个新郎，却不能拒绝国王。他乘车来到铁匠铺，看见小王子站在门前，只远远招手，叫他自己走到马车旁。
        - id: ch05-b03
          speaker: eldest_prince
          text: “就是你打出了这些王冠？既然是你，也许该先把自己刷干净些，再坐进那辆马车。国王要见你。唉，我真可怜那位公主。”
        - id: ch05-b04
          speaker: narrator
          text: 小王子坐进车厢。马车一路驶向王宫，走到半路，他打开鼻烟盒。七英寸立刻从里面走出来，稳稳站在他的腿上。
        - id: ch05-b05
          speaker: seven_inches
          text: “这次又有什么麻烦？”
        - id: ch05-b06
          speaker: youngest_prince
          text: “主人，请送我回铁匠铺，再把这辆马车装满铺路石。”
        - id: ch05-b07
          speaker: narrator
          text: 话音刚落，事情便成了。王子已经回到铺里，车厢却装满了铺路石。连拉车的马也弄不懂刚才发生了什么。马车驶进庭院，国王为了尊重新女婿，亲自来开车门。他才转动把手，小石子便劈头盖脸砸上扑过粉的假发和丝衣，把他压倒在地。众人吓得不轻，也有人忍不住发笑。国王擦去额头上的血，怒气冲冲地看向大王子。
        - id: ch05-b08
          speaker: eldest_prince
          text: “陛下，出了这样的意外，我实在很抱歉，可这不是我的错。我亲眼看见那个年轻铁匠坐进车厢。从铁匠铺到这里，我们一路都没停过，连一小会儿也没有。”
        - id: ch05-b09
          speaker: king
          text: “一定是你对他无礼了。二王子，你去接年轻铁匠，记得客气。”
        - id: ch05-b10
          speaker: second_prince
          text: “您放心。”
        - id: ch05-b11
          speaker: narrator
          text: 可有些人再怎么努力也学不会和气。二王子到了铁匠铺，对小王子一点不比哥哥客气。等马车回宫，国王第二次亲手打开车门，一股烂泥顿时从里面倾泻出来，迎头浇在他身上。
        - id: ch05-b12
          speaker: king
          text: “不能再这样了。狐狸要找使者，也找不到比自己更合适的。”
        - id: ch05-b13
          speaker: narrator
          text: 国王只好洗净身子，换好衣服，亲自来到铁匠铺，客客气气地请小王子跟自己回宫。小王子答应了，却请求坐在另一辆马车里。两辆车走到半路，他再次打开鼻烟盒。
        - id: ch05-b14
          speaker: youngest_prince
          text: “主人，现在请让我穿上与自己身份相称的衣服。”
        - id: ch05-b15
          speaker: seven_inches
          text: “如你所愿。现在，我也该向你告别了。以后继续像从前那样善良，像从前那样厚道，还要一直好好爱你的妻子。这就是我能给你的全部忠告。”
          emotion: calm
        - id: ch05-b16
          speaker: narrator
          text: 七英寸说完便消失了。马车到达王宫庭院，车门一开，小王子走了出来。他衣着华美，已经恢复了王子的模样，浑身上下精致得不能再精致。他下车后做的第一件事，就是奔向新娘，把她紧紧抱住。
        - id: ch05-b17
          speaker: narrator
          text: 宫里人人都满心欢喜，只有另外两个王子高兴不起来。三对新人没有再耽搁，遵照七英寸的嘱咐，在同一天戴着三重王冠举行了婚礼。不久，两个姐姐各自跟丈夫回到自己的宫廷。小公主和小王子留在老国王身边。他们过得幸福极了，就像你在故事里听说过的最幸福的夫妻一样。
        - id: ch05-b18
          speaker: narrator
          text: 这个故事选自《西部高地故事集》。
