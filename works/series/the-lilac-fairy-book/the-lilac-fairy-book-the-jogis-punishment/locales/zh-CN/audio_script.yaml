audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老民间故事，机敏处带克制的讥诮
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    rahmatabad_king:
      display_name: 拉赫马塔巴德国王
      tts:
        delivery: 尊崇圣人却胆怯轻信，受惊时慌乱急促
        timbre: 浑厚而略显虚弱的成年男声
        pace: 适中
        pitch: 中低
    jogi:
      display_name: 苦行僧
      tts:
        delivery: 表面庄严神秘，谎言中透出阴沉与操控欲
        timbre: 干涩低沉的成年男声
        pace: 缓慢
        pitch: 低
    rahmatabad_princess:
      display_name: 拉赫马塔巴德公主
      tts:
        delivery: 聪慧勇敢，羞怯时轻柔，坦白经历时真诚坚定
        timbre: 清澈柔韧的年轻女声
        pace: 适中
        pitch: 中高
    dilaram_prince:
      display_name: 迪拉拉姆王子
      tts:
        delivery: 勇敢谨慎，待人温和，作出决断时果断有力
        timbre: 明朗沉稳的年轻男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 圣人面具下的恶念
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，一位苦行僧来到古城拉赫马塔巴德。他看上去道行高深，就住在城外的一棵树下。他常常几天不吃不喝，身子一动也不动，只有手指不停拨弄念珠。人们很快传开了他的圣名。百姓每天赶来求他赐福，看他修行，也等着他愿意开口时听一番教诲。
        - id: ch01-b02
          speaker: narrator
          text: 后来，国王也成了常客。他向苦行僧请教，还求他祷告，让上天赐给自己一个儿子。日子一久，国王满脑子都是这位圣人，只想把他留给自己，便在附近建起一座小圣堂，添了几间屋子，又用高墙围住小院。等一切准备妥当，国王恳请苦行僧搬进去，从此只见国王、王后和亲自挑选来传承教诲的弟子。苦行僧答应了，靠着国王的供养生活，名声也一天胜过一天。
        - id: ch01-b03
          speaker: narrator
          text: 国王没有儿子，却有一个女儿。公主长成了世上最美丽的姑娘，早已许配给邻国迪拉拉姆的王子，只是还没有成婚。以她的身份和美貌，本来就该深居简出。她除了王宫庭苑哪里也不能去，即使到宫苑走动，也总有人严密守护。听说那位圣人的奇迹和斋戒以后，她满心好奇，很想亲眼看看他，也同他说说话。一天傍晚，公主终于找到机会，独自去了圣堂。
        - id: ch01-b04
          speaker: narrator
          text: 可惜，苦行僧远没有外表那样圣洁。他刚看见公主，就被她的美貌迷住，心里盘算起怎样娶她为妻。公主却十分机敏。她从他的眼神中看出了欲念，立刻站起来，拢紧面纱，飞奔而去。
        - id: ch01-b05
          speaker: narrator
          text: 苦行僧也拔腿追赶，可他根本不是公主的对手。眼看怎么也追不上，他气得失去理智，竟朝她掷出长矛，刺伤了她的腿。勇敢的公主弯腰从伤口中拔出长矛，只停了一瞬，又继续奔跑，直到平安回到宫中。她悄悄洗净伤口，仔细包扎妥当，谁也没告诉。因为她明白，父亲若知道她擅自出宫，必定会严厉惩罚她。
    - id: ch02
      title: 箱中的公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，国王去探望苦行僧。苦行僧不但不开口，连看都不肯看他。
        - id: ch02-b02
          speaker: rahmatabad_king
          text: “您出了什么事？今天为什么不肯同我说话？”
        - id: ch02-b03
          speaker: jogi
          text: “我没什么可讲的。就算讲了，你也不会想听。”
        - id: ch02-b04
          speaker: rahmatabad_king
          text: “怎么会呢？无论您说什么，我都看得很重。”
        - id: ch02-b05
          speaker: narrator
          text: 苦行僧还是扭着脸坐在那里。国王越追问，他越沉默，也越显得神秘。直到国王再三恳求，他才终于开了口。
        - id: ch02-b06
          speaker: jogi
          text: “既然这样，我就告诉你。城里藏着一个怪物。你要是不除掉它，它会把全城的人一个不剩地杀死。”
        - id: ch02-b07
          speaker: narrator
          text: 国王一向容易受惊，这时脸色一下变白了。
        - id: ch02-b08
          speaker: rahmatabad_king
          text: “怪物？那是什么可怕的东西？我要怎样认出它、抓住它？请您指点我。只要您肯帮忙，我一定照您的话去做。”
          emotion: fearful
        - id: ch02-b09
          speaker: jogi
          text: “它确实可怕。外表是个美丽姑娘，其实却是恶鬼。昨晚它来找我。我定睛一看，它的美貌马上消失了，嘴里长出骇人的尖牙，眼睛亮得像火炭，纤细的手指也变成了巨大的利爪。若不是我有这身修行，早被它吞掉了。”
        - id: ch02-b10
          speaker: narrator
          text: 国王吓得半晌说不出话。
        - id: ch02-b11
          speaker: rahmatabad_king
          text: “可我见到它时，怎样才能把它认出来？”
        - id: ch02-b12
          speaker: jogi
          text: “去找一个腿上有长矛伤口的美丽姑娘。找到以后，把她牢牢看住，再来告诉我。下一步该做什么，我会教你。”
        - id: ch02-b13
          speaker: narrator
          text: 国王急忙回去，命所有士兵走遍城里城外，搜寻一个腿上有长矛伤口的姑娘。搜查整整持续了两天。后来，众人不知怎么查明，整个国境内唯一腿上有这种伤的人竟是公主。国王又惊又乱，慌忙跑去找苦行僧，反复保证其中一定有错。可苦行僧早料到会有这一刻，答案也早已准备好了。
        - id: ch02-b14
          speaker: jogi
          text: “她不是你的女儿。你真正的女儿出生时就被偷走了，眼前这个只是化成她模样的恶鬼。你想怎样都行，可你若不听我的劝告，她会杀死你们所有人。”
        - id: ch02-b15
          speaker: narrator
          text: 苦行僧神情庄严，语气又没有一丝动摇，国王的理智就这样被蒙蔽了。他发誓，无论苦行僧说什么都相信，无论叫他做什么都照办。
        - id: ch02-b16
          speaker: narrator
          text: 苦行僧让国王暗中派来两个木匠。木匠一到，他便叫他们当场造一只大箱子，榫缝接合得十分精巧，水和空气都透不进去。箱子一做好，他又叫国王连夜带来公主。两人把可怜的姑娘塞进去，用一根根长钉牢牢封死箱盖，再合力抬到河边，推进水流之中。
        - id: ch02-b17
          speaker: narrator
          text: 回到住处，苦行僧叫来两个弟子，谎称自己得到神启，知道河上会漂来一只装着珍宝的箱子。他叫弟子到很远的下游守候，见到箱子随着水波起伏打转，就悄悄截住，尽快送来。其实，他已经决定亲手杀死公主。两个弟子立刻出发，一面觉得差事古怪，一面又赞叹师父竟能知道这样的秘密。
    - id: ch03
      title: 河岸上的奇遇
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天破晓，迪拉拉姆王子正带着许多大臣、侍从和猎手在河岸边打猎。他骑在马上，看见一只大箱子随着水流一起一伏，打着转缓缓漂来。王子一声令下，五六个人便跳进水中，把箱子拖到岸上。大家全围了过来，想知道里面究竟有什么。
        - id: ch03-b02
          speaker: narrator
          text: 王子的好奇心一点也不比别人少，不过他生性谨慎。动手开箱之前，他让大多数人退后，只留几个人拔出长剑守在近旁，以防里面突然跳出猛兽、精怪或巨人。众人准备妥当，全都屏住呼吸。王子这才用匕首撬开箱盖，猛地掀到一边。箱中躺着一位活生生、仍在呼吸的少女，那是他生平见过最美丽的姑娘。
        - id: ch03-b03
          speaker: narrator
          text: 公主差点闷死在箱里，好在很快醒了过来。等她能够坐起，王子便问她是谁，为什么会被人关进箱子，放到河上漂流。四周全是陌生人，公主羞红了脸，身子也在发抖，这才回答他。
        - id: ch03-b04
          speaker: rahmatabad_princess
          text: “我是拉赫马塔巴德的公主。把我装进这只箱子的，正是我的父亲。”
        - id: ch03-b05
          speaker: dilaram_prince
          text: “那么，我就是迪拉拉姆的王子。”
        - id: ch03-b06
          speaker: narrator
          text: 两个年轻人惊讶极了。他们早已由双方父亲订下婚约，却从没见过面，没想到第一次相逢竟会是这番情形。王子被公主的美貌和端庄深深打动，便召来大臣，当着众人的面提出要求，执意立刻迎娶这位已经赢得他心的姑娘。
        - id: ch03-b07
          speaker: narrator
          text: 大臣们就在河岸上为两人举行了婚礼。随后，新婚夫妇一同回到王子的宫殿。王子的父亲，也就是迪拉拉姆的老国王，听完这段奇遇，欣然迎接他们。宫中余下的一整天都在设宴欢庆。等宴席终于散去，新娘才告诉丈夫，他们正站在共同生活的开端，可她还有许多遭遇没来得及细说。
        - id: ch03-b08
          speaker: rahmatabad_princess
          text: “在我们开始共同生活以前，你还应该知道后来那些事。那天，我偷偷出宫去见苦行僧。从那以后发生的一切，我现在全都告诉你。”
        - id: ch03-b09
          speaker: narrator
          text: 公主没有隐瞒，把苦行僧怎样起了恶念、刺伤她，又怎样欺骗父亲的经过，全说了出来。
        - id: ch03-b10
          speaker: narrator
          text: 第二天早晨，王子召来首席大臣，要他把宫中那只用锁链拴着的大猴子关进原来的箱子，再送到河里漂流，并一路暗中察看箱子的去向。人们捉来猴子，把它塞进箱中。几个仆人把箱子推下河，又隔着很远悄悄跟在后面。
    - id: ch04
      title: 苦行僧的惩罚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 苦行僧的两个弟子一直守在下游，眼巴巴地等着箱子。他们等得快要厌烦，甚至开始怀疑师父说的话到底对不对。到了第二天，那只大箱子终于出现了，仍旧在水面上一起一伏，打着转缓缓漂来。两个弟子立刻欣喜若狂，只当这又一次证明了师父非凡的智慧，也证明他果然能知晓常人不知道的秘密。
        - id: ch04-b02
          speaker: narrator
          text: 两人费了不少力气才截住箱子，又尽可能迅速而隐秘地抬回师父的住处。苦行僧早已等得焦躁不耐，脾气越来越坏。箱子刚被送进屋，他就命弟子放下，然后出去等候，让他独自开启这只神奇的箱子。
        - id: ch04-b03
          speaker: jogi
          text: “记住，就算里面传来叫喊或别的动静，不管听起来多么吓人，你们也绝不能进来。”
        - id: ch04-b04
          speaker: narrator
          text: 苦行僧说着，走向一间小壁橱。那里藏着一根丝绳，是他预备拿来勒死公主的。两个弟子服从命令，走到外面，把所有门都紧紧关上。
        - id: ch04-b05
          speaker: narrator
          text: 不一会儿，屋里传出震天的喧闹声，苦行僧也高声呼救。弟子们却不敢进去。师父明明说过，无论听见什么，他们都不能进门。两人只好坐在外面，一边等，一边猜里面发生了什么。
        - id: ch04-b06
          speaker: narrator
          text: 后来，屋中忽然彻底安静了，而且久久没有声息。弟子们终于决定进去看看。通往院子的门刚一打开，一只巨大的猴子便迎面扑来，险些把他们撞倒。猴子从两人身边冲过，飞快地逃进旷野。
        - id: ch04-b07
          speaker: narrator
          text: 两个弟子小心地走进屋里。来到苦行僧住处的门前，他们只见师父的尸体横在门槛上，已经被那只猴子撕得支离破碎。
        - id: ch04-b08
          speaker: narrator
          text: 这件事很快传扬开来，也传进了公主和丈夫耳中。公主得知仇敌已死，便同父亲重归于好。
        - id: ch04-b09
          speaker: narrator
          text: 这个故事，是由费罗兹普尔的坎贝尔少校讲述的。
