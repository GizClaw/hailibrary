audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    jogi:
      display_name: The Jogi
      tts:
        delivery: controlled, secretive, and falsely solemn
        timbre: dry and resonant
        pace: slow
        pitch: medium-low
    rajah:
      display_name: The Rajah of Rahmatabad
      tts:
        delivery: earnest, anxious, and easily shaken
        timbre: full and dignified
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Holy Man of Rahmatabad
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a jogi came to the ancient city of Rahmatabad. He looked like a holy man, and he made his home beneath a tree outside the city. For days at a time he sat without food or drink. He never moved, except to turn a string of beads through his restless fingers.
        - id: ch01-b02
          speaker: narrator
          text: Word of his holiness soon spread. Every day, people from the city crowded around him. Some wanted his blessing. Some watched him pray. Others hoped he might feel willing to teach them.
        - id: ch01-b03
          speaker: narrator
          text: Before long, even the rajah heard about the jogi. He began visiting often, asking for advice and begging the holy man to pray that he might be given a son. As the days passed, the rajah could think of little else. He wanted the jogi all to himself.
        - id: ch01-b04
          speaker: narrator
          text: So the rajah built a small shrine nearby. It had one or two rooms and a little courtyard shut in by high walls. When it was finished, he begged the jogi to live there. No one else would visit, apart from the rajah, his queen, and any pupils the jogi chose to carry on his teaching.
        - id: ch01-b05
          speaker: narrator
          text: The jogi agreed. For some time he lived on the king's generosity, while his fame for godliness grew greater every day.
        - id: ch01-b06
          speaker: narrator
          text: Now, the rajah had no son, but he did have a daughter. As she grew older, she became more beautiful than anyone who saw her could believe. Long before, her father had promised her in marriage to the son of the neighboring rajah of Dilaram. They were not married yet, and she lived the quiet, guarded life expected of a princess in her position.
        - id: ch01-b07
          speaker: narrator
          text: Of course, the princess heard about the holy man. She heard of his miracles and his long fasts, and she longed to see him and speak with him. But she was allowed nowhere beyond the palace grounds, and even there guards stayed close beside her.
        - id: ch01-b08
          speaker: narrator
          text: At last, one evening, she found her chance. Alone, she slipped away to the hermit's shrine.
        - id: ch01-b09
          speaker: narrator
          text: Sadly, the hermit was not nearly as holy as he appeared. The moment he saw the princess, her marvelous beauty filled him with love. At once, he began secretly planning how to make her his wife.
        - id: ch01-b10
          speaker: narrator
          text: But the princess had a sharp mind as well as a lovely face. She saw the love in the jogi's eyes and understood it at once. She sprang up, pulled her veil around her, and ran from the shrine as fast as she could.
        - id: ch01-b11
          speaker: narrator
          text: The jogi chased her, but he could not keep up. Furious that she was escaping, he hurled a lance after her. It struck her in the leg.
        - id: ch01-b12
          speaker: narrator
          text: The brave princess stopped only long enough to pull the lance from the wound. Then she ran on until she was safely home. There she washed the wound and bandaged it in secret. She told no one where she had been, because she knew her father would punish her severely for slipping away.
    - id: ch02
      title: The Jogi's Lie
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day, the king went to visit the jogi. But the holy man would not speak to him or even look his way.
        - id: ch02-b02
          speaker: rajah
          text: Has something happened? Why won't you talk to me?
        - id: ch02-b03
          speaker: jogi
          text: Anything I could tell you would only trouble you.
        - id: ch02-b04
          speaker: rajah
          text: But I listen to your every word. Whatever it is, I want to know.
        - id: ch02-b05
          speaker: narrator
          text: Still the jogi kept his face turned away. The more the king urged him to speak, the more silent and mysterious he became. Only after a great deal of persuasion did he answer.
        - id: ch02-b06
          speaker: jogi
          text: Then I must warn you. There is a creature in this city that will kill every person here unless you destroy it first.
        - id: ch02-b07
          speaker: narrator
          text: The king was easily frightened. His face went pale.
        - id: ch02-b08
          speaker: rajah
          text: A creature? What kind? Tell me how to find it and capture it. I will do exactly as you say.
          emotion: fearful
        - id: ch02-b09
          speaker: jogi
          text: It is terrible indeed. It looks like a beautiful girl, but it is truly an evil spirit. It visited me last evening. As I watched, its beauty turned hideous. Its teeth grew into dreadful fangs, its eyes burned like fiery coals, and huge claws burst from its slender fingers. If I were not what I am, it might have devoured me.
        - id: ch02-b10
          speaker: narrator
          text: Fear almost robbed the king of his voice. At last, he managed another question.
        - id: ch02-b11
          speaker: rajah
          text: But how can I recognize such a monster?
          emotion: fearful
        - id: ch02-b12
          speaker: jogi
          text: Find a beautiful young woman whose leg has been pierced by a lance. Have her locked away, then return. I will tell you the next step.
        - id: ch02-b13
          speaker: narrator
          text: The king hurried away. Soon all his soldiers were searching the country for a girl wounded in the leg. They searched for two days. Then, somehow, they learned that the only person with such a wound was the princess herself.
        - id: ch02-b14
          speaker: narrator
          text: Deeply troubled, the king rushed to the jogi. He insisted there had to be some mistake. But the jogi had expected this and already knew what he would say.
        - id: ch02-b15
          speaker: jogi
          text: That creature is not truly your daughter. Your child was stolen when she was born, and this evil spirit took her shape. Do as you please, but if you reject my advice, she will kill every one of you.
        - id: ch02-b16
          speaker: narrator
          text: The jogi looked so solemn and sounded so certain that the king could no longer see wisely. He promised to believe every word and obey every command.
        - id: ch02-b17
          speaker: narrator
          text: The jogi told him to send two carpenters in secret. When they arrived, he ordered them to build a great chest. Its joints had to fit so cleverly that neither air nor water could get inside.
        - id: ch02-b18
          speaker: narrator
          text: They made the chest there and then. Once it was ready, the jogi told the king to bring the princess after dark. Together, the two men forced the poor young woman inside. They hammered down the lid with long nails, carried the chest to the river, and pushed it into the current.
        - id: ch02-b19
          speaker: narrator
          text: As soon as he returned, the jogi called two of his pupils. He pretended that a vision had shown him a chest floating on the river with something precious inside. He told them to wait far downstream. When it came bobbing and turning with the tide, they must seize it and bring it back quickly and secretly.
        - id: ch02-b20
          speaker: narrator
          text: The jogi had now decided to kill the princess himself. His pupils knew nothing of that. They set out at once, amazed by their strange task and even more impressed that their master could receive such secret knowledge.
    - id: ch03
      title: The Chest on the River
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Dawn was breaking the next morning when the brave young prince of Dilaram happened to be hunting beside the river. A great company rode with him, including wazirs, attendants, and huntsmen.
        - id: ch03-b02
          speaker: narrator
          text: As the prince rode along, he saw a large chest on the water. It drifted slowly with the tide, bobbing and turning as it came. He rose in his saddle and gave an order. Half a dozen men plunged into the river and dragged the chest onto the bank.
        - id: ch03-b03
          speaker: narrator
          text: Everyone crowded close, eager to see what was inside, and the prince was as curious as any of them. Yet he was cautious too. Before opening it himself, he ordered most of the company to stand back. The few who remained drew their swords, ready in case the chest held a savage beast, a djinn, or a giant.
        - id: ch03-b04
          speaker: narrator
          text: When all were prepared, the prince forced up the lid with his dagger and flung it open. There, alive and breathing, lay the loveliest young woman he had ever seen.
        - id: ch03-b05
          speaker: narrator
          text: The princess was half smothered after being shut inside the chest, but she soon recovered. When she could sit up, the prince asked who she was, why she had been imprisoned, and how she had come to be floating down the river.
        - id: ch03-b06
          speaker: narrator
          text: Blushing and trembling among so many strangers, she explained that she was the princess of Rahmatabad. Her own father, she said, had placed her in the chest.
        - id: ch03-b07
          speaker: narrator
          text: Then the young man told her that he was the prince of Dilaram. Both stared in astonishment. Their fathers had promised them to each other, though they had never met. Now they had seen one another for the first time in circumstances stranger than either could have imagined.
        - id: ch03-b08
          speaker: narrator
          text: The prince was deeply touched by her beauty and modest manner. He summoned his wazirs and declared that he wished to marry at once the lovely princess who had completely won his heart.
        - id: ch03-b09
          speaker: narrator
          text: So they were married then and there on the riverbank. Afterward they went to the prince's palace. When everyone heard their story, the prince's father, the old rajah, welcomed them warmly. The rest of the day passed in feasting and celebration.
        - id: ch03-b10
          speaker: narrator
          text: But after the banquet, the bride spoke privately with her husband. They stood at the very beginning of married life, she told him, and there was more he needed to hear. Until then, he had not given her time to tell the whole tale.
        - id: ch03-b11
          speaker: narrator
          text: She hid nothing. She told him everything that had happened since the evening she slipped away to visit the wicked jogi.
    - id: ch04
      title: The Prince's Plan
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the prince called for his chief wazir. A great monkey lived chained in the palace, and the prince ordered the wazir to shut it inside the same chest in which the princess had been found.
        - id: ch04-b02
          speaker: narrator
          text: Then the chest was to be carried back to the river and set afloat once more. The prince also commanded his men to follow it and watch where it went.
        - id: ch04-b03
          speaker: narrator
          text: The monkey was caught and placed inside. Some palace servants took the chest down to the water and pushed it into the stream. Then, keeping far behind so they would not be seen, they followed it on its way.
        - id: ch04-b04
          speaker: narrator
          text: Meanwhile, the jogi's two pupils waited and waited. They grew tired of staring at the river and began to wonder whether their master could have been wrong.
        - id: ch04-b05
          speaker: narrator
          text: On the second day, they finally spotted the great chest. Slowly it floated toward them, bobbing and turning with the tide. Joy swept over them. Surely this was fresh proof of their master's marvelous wisdom.
        - id: ch04-b06
          speaker: narrator
          text: It was not easy, but they managed to pull the chest from the river. Then they carried it back to the jogi's house as swiftly and secretly as they could.
        - id: ch04-b07
          speaker: narrator
          text: By then, the jogi had grown cross and impatient. As soon as the pupils arrived with the chest, he told them to set it down and wait outside while he opened the magical treasure alone.
        - id: ch04-b08
          speaker: jogi
          text: You may hear screams or other frightening sounds. No matter what happens, do not enter this house.
        - id: ch04-b09
          speaker: narrator
          text: As he spoke, the jogi walked toward a closet. Inside lay the silken cord with which he meant to strangle the princess.
        - id: ch04-b10
          speaker: narrator
          text: The two pupils obeyed. They went out and shut every door tightly behind them.
    - id: ch05
      title: The Jogi's Punishment
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Before long, a terrible uproar burst from within the house. The pupils heard the jogi shouting desperately for help. Yet they did not dare go in. Had he not commanded them to stay outside, no matter what alarming sounds they heard?
        - id: ch05-b02
          speaker: narrator
          text: So they sat there, waiting and wondering. At last, everything became still. The silence continued for so long that they finally decided to enter and make sure all was well.
        - id: ch05-b03
          speaker: narrator
          text: The moment they opened the door into the courtyard, a huge monkey leaped straight at the doorway. It nearly knocked them over as it rushed past and escaped into the open fields.
        - id: ch05-b04
          speaker: narrator
          text: Then the pupils stepped into the room. On the threshold of his own dwelling, they found the jogi's body torn to pieces.
        - id: ch05-b05
          speaker: narrator
          text: The tale soon spread, as tales always do. In time it reached the princess and her husband.
        - id: ch05-b06
          speaker: narrator
          text: When the princess knew that her enemy was dead, she made peace with her father.
