        delivery: 强硬好斗，执行惩罚时冷酷直接
        timbre: 结实的年轻男声
        pace: 适中偏快
        pitch: 中
    youth_2:
      display_name: 青年乙
      tts:
        delivery: 强硬好斗，执行惩罚时冷酷直接
        timbre: 略显低沉的年轻男声
        pace: 适中偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 基农的败绩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 乌斯克河畔的卡利恩城堡里，亚瑟王坐在大厅中央的青灯心草座椅上。火焰色绸缎铺在椅面，肘下垫着红缎靠垫。欧文、基农和凯陪在近旁。大厅另一头，桂妮薇儿王后与侍女们靠窗而坐，正用金线在白衣上绣奇异的花纹。
        - id: ch01-b02
          speaker: arthur
          text: “我有些倦了。饭菜备好以前，让我睡一会儿吧。你们彼此讲些故事，凯去厨房取一壶蜂蜜酒，再带些肉来。”
        - id: ch01-b03
          speaker: narrator
          text: 大家吃喝过后，年纪最长的基农开口了。
        - id: ch01-b04
          speaker: kynon
          text: “我是父母唯一的儿子，他们把我看得比什么都重，我却不肯留在家里。我那时总以为，天下没有我办不到的壮举。谁也拦不住我。我在故乡经历许多冒险，次次取胜，便辞别父母，出门游历。我翻山越岭，穿过荒漠，也渡过河流，最后走进一座美丽的山谷。谷中林木繁茂，一条小路贴着溪岸伸向远处。我顺路走了一整天，傍晚来到一座城堡。堡前有两个黄衣青年，各自握着一张象牙弓。箭杆是鲸骨做的，尾端饰着孔雀羽毛。他们腰间还挂着金匕首，刀柄同样由鲸骨制成。”
        - id: ch01-b05
          speaker: kynon
          text: “附近有个衣着华贵的男人。他转身陪我走向城堡，堡里的人全聚在大厅。窗边坐着二十四位姑娘，其中最不美的一个，也胜过桂妮薇儿最美的模样。有人牵走我的马，有人替我解开铠甲，把它连同宝剑和长矛洗净，擦得像白银一样亮。我洗浴以后，换上他们送来的背心和紧身上衣，和那个男人一同坐到银桌前。我一生从没吃过那样丰盛的宴席。”
        - id: ch01-b06
          speaker: kynon
          text: “起初谁也不说话。等我吃到半饱，主人终于问起我的来历。我报上自己和父亲的名字，又说故乡已无人能够胜我，所以出来寻找一个能击败我的人。他听了，只是笑。”
        - id: ch01-b07
          speaker: castle_host
          text: “我可以让你找到想找的东西，只怕那打击会叫你承受不住。你若不是空口夸耀无人能胜，果真想试自己的勇气，今晚就在这里睡下。明早一定早起，沿山谷向上走。到了树林，转进右边的岔路，一直走到一片草地。草地中央有座土丘，丘上站着一个黑人。他身量抵得上两个白人，只有一只脚，一只眼睛长在额头正中。他的铁棒，两个白人合力也难举起。四周有一千头不同的野兽在吃草，因为他正是树林的守护者。你想找的冒险该往哪里去寻，他会告诉你。”
        - id: ch01-b08
          speaker: kynon
          text: “那一夜长得像没有尽头。天还没亮，我就披挂上马，赶到那片草地。黑人果然站在丘顶，而且远比我想象的强壮。凯呀，那根铁棒，便是我们四个勇士抬起来也会吃力。他等我先开口，我便问，四周那么多野兽，他靠什么把它们制伏。”
        - id: ch01-b09
          speaker: forest_guardian
          text: “小个子，我让你亲眼瞧瞧。”
        - id: ch01-b10
          speaker: kynon
          text: “他抡起铁棒敲向一头雄鹿的脑袋，打得那鹿放声嘶鸣。群兽听见鸣声，立刻从四面飞奔而来，多得像天上的星星。我被它们挤在中间，几乎连站立的地方也没有。那里不但有寻常走兽，还有蛇和龙，另有许多形貌古怪的猛兽，犄角竟长在我从没见过长角的部位。黑人没有再挥动铁棒，只看了它们一眼，命它们回去吃草。所有野兽便在他面前俯下身子，像封臣拜见自己的领主。”
        - id: ch01-b11
          speaker: forest_guardian
          text: “你的问题已经有了答案，我的本领你也见过了。还想知道什么？”
        - id: ch01-b12
          speaker: kynon
          text: “我向他打听道路，他忽然动怒，像是有心阻拦。直到我说明身份，他才平静下来。”
        - id: ch01-b13
          speaker: forest_guardian
          text: “沿这条路走到草地尽头，再穿过树林登上山顶。那里有片空地，中央长着一棵高树。树下有泉，泉边是一块大理石板，石板上放着系银链的银碗。舀起泉水泼上石板，你会听见一声震天霹雳，仿佛天地都在巨响中颤抖。雷后是又大又密的冰雹，凶猛得叫人几乎无法活命。太阳重新出来时，树叶已经全落在地上。然后群鸟会飞到枝头，唱出你从未听过的美妙歌声。歌声最动听的时候，一阵低语和哀诉会沿山谷传来。一个穿黑天鹅绒、骑黑马的骑士将手持缀着黑旗的长矛，催马与你交战。你若逃跑，他会追上你。你若留在原地，他会把你击落马下。无论选哪一条路，都躲不过他。若这场冒险还不算麻烦，你余生也不必再寻找麻烦了。”
        - id: ch01-b14
          speaker: kynon
          text: “我告别守护者，登上林间山顶，那里每一样东西都与他说的一模一样。我来到树下的泉边，用银碗舀满清水，全部泼向大理石板。雷声随即炸响，比我料想的更响亮。雷后落下的冰雹，也比我料想的更沉重。说真的，凯呀，每颗雹子都能穿透皮肉，直到撞上骨头才会停下。我让马侧身迎着冰雹，自己俯伏在马颈上，再把盾牌举起来，同时护住它的头和我的头。”
        - id: ch01-b15
          speaker: kynon
          text: “雹暴一停，树上已没有半片叶子。天空碧蓝，阳光明亮，各种鸟儿落满枝头。它们的歌声，是我此前此后都不曾听过的美妙声音。我正听得入神，一阵喃喃哀诉慢慢逼近。”
        - id: ch01-b16
          speaker: fountain_knight
          text: “骑士啊，你为何来到这里？我做过什么恶事得罪了你，让你这样害我？我的领地里，不论人还是牲畜，碰上那场冰雹便没有一个能活下来。”
        - id: ch01-b17
          speaker: kynon
          text: “黑马骑士随即从谷中出现，手里紧握着长矛，矛上飘着黑旗。我们立刻迎面冲向对方。我拼尽全力，却很快被他击落在地。那骑士抓住我的马缰，牵着马扬长而去，只把我独自留下，甚至不屑剥走我的铠甲。我满怀悲伤地走下山，经过黑人所在的草地时，羞愧得几乎要融成地上的一摊水。”
        - id: ch01-b18
          speaker: kynon
          text: “那晚我仍住在先前的城堡。人们像上次一样替我沐浴，又摆下丰盛宴席，却没有一个人问我在山顶遭遇了什么。第二天早晨醒来，我看见一匹栗色马已经配好鞍具，正在等我。我系紧铠甲，骑着它返回自己的宫廷。那匹马至今还养在我的马厩里，拿全不列颠任何一匹马来，我也不肯交换。凯呀，世上怕是没人讲过这样有损自己颜面的冒险。更奇怪的是，此后我遇到那么多人，却再没找到一个知道那黑人、黑骑士和冰雹的人。”
        - id: ch01-b19
          speaker: owen
          text: “我们为什么不去找出那个地方？”
        - id: ch01-b20
          speaker: kai
          text: “凭我朋友的手起誓，你嘴上常常说得漂亮，行动却未必跟得上。”
        - id: ch01-b21
          speaker: guenevere
          text: “凯，你竟这样对欧文说话，还不如把你吊死。”
          emotion: angry
        - id: ch01-b22
          speaker: kai
          text: “夫人，我没有恶意。你有多赞赏欧文，我也一样赞赏他。”
        - id: ch01-b23
          speaker: narrator
          text: 这时亚瑟醒了，问自己是不是睡了一会儿。欧文说，陛下确实小睡过。亚瑟又问是否该去用饭，欧文答说时候已到。洗手的号角很快响起，国王与众人入席。宴后，欧文悄然离开，备好了坐骑和武器。

    - id: ch02
      title: 泉边的黑骑士
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第一缕阳光出现时，欧文便独自启程。他走过荒漠，翻越高山，也渡过一道道河流。基农一路经历过的事情，全都一一落到他身上。最后，欧文站在那棵落尽叶子的树下，听枝头鸟儿歌唱。最美的歌声中，哀诉沿着山谷而来。黑骑士出现了，催马向他直冲。两人恶战不休，长矛双双折断，便拔出宝剑继续厮杀。欧文抓住机会，一剑劈开对手的头盔，刺穿了他的头颅。
        - id: ch02-b02
          speaker: narrator
          text: 黑骑士自知伤势致命，掉头逃走。欧文一路紧追，直到眼前出现一座辉煌的城堡。对手飞驰过横跨护城河的桥，冲进大门。可他刚一安全入堡，吊桥就被拉了起来，恰好从中间夹住欧文的坐骑。马的前半身在城里，后半身还在城外。欧文既下不了马，也想不出脱身的办法。
        - id: ch02-b03
          speaker: narrator
          text: 城门上的小门忽然打开，门后是一条高楼夹立的街道。一个金发鬈曲的少女探出头，叫欧文把门打开。
        - id: ch02-b04
          speaker: owen
          text: “凭我的忠诚起誓，我从这边打不开门，正像你没法把我放出去。”
        - id: ch02-b05
          speaker: luned
          text: “只要照我说的做，我会尽力救你。戴上这枚戒指，让宝石贴住掌心，再把手指合紧。只要戒指不露出来，它就会把你藏住。里面的人商议以后会来抓你处死，找不见你，他们一定很懊恼。我会站到那边的上马石上。你看得见我，我却看不见你。走到我身旁，把手搭在我肩上，我去哪里，你就跟到哪里。”
        - id: ch02-b06
          speaker: narrator
          text: 少女离开后，城里的人果然出来搜寻，要把欧文抓去处死。他们遍寻不着，十分懊恼，只好回到堡内。欧文随即走近少女，把手搭在她肩上，由她领进一间宽敞的屋子。四壁绘满绚丽的颜色，还装点着金像。少女给他食物和饮料，又送来洗浴的清水与更换的衣服。欧文躺到柔软床上，盖着猩红毯子和毛皮，安心睡着了。
        - id: ch02-b07
          speaker: narrator
          text: 半夜，一阵巨大的哭喊将他惊醒。他穿好衣服来到大厅，见少女站在那里。
        - id: ch02-b08
          speaker: owen
          text: “发生了什么？”
        - id: ch02-b09
          speaker: luned
          text: “城堡的主人死了，人们正抬着他的遗体去教堂。”
        - id: ch02-b10
          speaker: narrator
          text: 人们正把死去的骑士抬往教堂，欧文从未见过那样庞大的送葬队伍。遗体后面跟着世间最美丽的夫人。她的哭声比男人们的呼喊更响，也压过了号角的长鸣。欧文望着她，就在这一刻爱上了她。
        - id: ch02-b11
          speaker: owen
          text: “她是谁？”
        - id: ch02-b12
          speaker: luned
          text: “她是我的女主人，泉水伯爵夫人，也是昨天被你杀死的骑士的妻子。”
        - id: ch02-b13
          speaker: owen
          text: “说真的，她是我在世上最爱的人。”
        - id: ch02-b14
          speaker: luned
          text: “她也会深深爱上你。”
        - id: ch02-b15
          speaker: narrator
          text: 卢内德随后走进女主人的寝室。她开口说话，伯爵夫人却不作声。
        - id: ch02-b16
          speaker: luned
          text: “夫人，您怎么了？”
        - id: ch02-b17
          speaker: fountain_lady
          text: “卢内德，我这样悲痛，你为何一直躲着我？”
          emotion: sad
        - id: ch02-b18
          speaker: luned
          text: “人已经死去，东西也已经失去，您再这样哀痛下去，真的好吗？”
        - id: ch02-b19
          speaker: fountain_lady
          text: “世上没有男人比得上他。你竟说出这种话，我真想把你赶走。”
          emotion: angry
        - id: ch02-b20
          speaker: luned
          text: “夫人，请听我一句。您独自守不住这片领地，必须找个人来帮助您。”
        - id: ch02-b21
          speaker: fountain_lady
          text: “我要到哪里去找？”
        - id: ch02-b22
          speaker: luned
          text: “泉水守不住，一切都会失去。除了亚瑟王宫廷的骑士，没有人有本领守卫那里。我去替您寻找一位。若不能带回一个像前任守卫那样的勇士，就让灾祸落在我头上。”
        - id: ch02-b23
          speaker: fountain_lady
          text: “那就去吧。让我看看你能不能兑现诺言。”
        - id: ch02-b24
          speaker: narrator
          text: 卢内德骑上一匹白色小母马出发，假称前往亚瑟的宫廷，其实只找了地方躲藏起来。她算准来回一趟需要多少天，便藏了多少天，随后才走出藏身处，回到女主人面前。伯爵夫人热情迎接她，立刻问起宫廷的消息。
        - id: ch02-b25
          speaker: luned
          text: “消息再好不过。我的使命已经完成，与我同来的骑士，您想何时见他？”
        - id: ch02-b26
          speaker: fountain_lady
          text: “明日正午。我会把全城的人召集起来。”
        - id: ch02-b27
          speaker: narrator
          text: 第二天正午，欧文穿上锁子甲，外面再披一件华美的斗篷，脚上的皮鞋用金扣系紧。他跟随卢内德穿过城堡，来到夫人的寝室。伯爵夫人见他们如约出现，心中很是欢喜，可她没有立刻接受这位陌生骑士，只把欧文从头到脚细细打量了一遍。
        - id: ch02-b28
          speaker: fountain_lady
          text: “卢内德，这位骑士看起来可不像刚走过远路。”
        - id: ch02-b29
          speaker: luned
          text: “夫人，那有什么要紧？”
        - id: ch02-b30
          speaker: fountain_lady
          text: “我确信，把我丈夫的灵魂赶出身体的人，就是他。”
        - id: ch02-b31
          speaker: luned
          text: “若他不比您的丈夫强大，便取不了他的性命。事情已经过去，再也没有办法挽回。”
        - id: ch02-b32
          speaker: fountain_lady
          text: “你们先出去，让我自己想一想。”
        - id: ch02-b33
          speaker: narrator
          text: 第二天早晨，伯爵夫人召集臣民来到城堡庭院。她告诉众人，丈夫死后，领地已经无人守卫。
        - id: ch02-b34
          speaker: fountain_lady
          text: “现在由你们来选。要么你们中有一个娶我，要么准许我亲自另选领主，别让这片土地无人做主。”
        - id: ch02-b35
          speaker: narrator
          text: 城中首领退到一角商议。过了一会儿，为首的人走上前来。
        - id: ch02-b36
          speaker: city_leader
          text: “为了大家的安宁和安全，最好由您亲自选择丈夫。”
        - id: ch02-b37
          speaker: narrator
          text: 欧文被召到夫人面前。他欣然接受她伸出的手，两人当即举行婚礼，伯爵领的臣民也都向新领主宣誓效忠。从那天起，欧文接替前任伯爵，每天守卫那眼会招来雷电和冰雹的泉水。凡是前来挑战的骑士，都被他击落马下。他将那些骑士交付的赎金分给自己的男爵。这样的日子过了整整三年，世上再没有一个人比欧文更受爱戴。

    - id: ch03
      title: 亚瑟来访与失约
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三年期满时，格瓦尔赫迈陪在亚瑟身边，看出国王满面愁容。
        - id: ch03-b02
          speaker: gwalchmai
          text: “陛下，出了什么事？”
        - id: ch03-b03
          speaker: arthur
          text: “我在为欧文悲伤。他已经离开我三年。若第四年过去还不回来，我便活不下去了。一定是克莱德诺之子基农讲的故事，让我失去了他。我要亲自带领家臣寻找欧文。他若死了，我替他复仇。他若被囚禁，我救他出来。他若还活着，我带他回家。”
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: 亚瑟带着三千名家臣出发寻找欧文，又请基农沿途引路。到了基农从前留宿的城堡，那两个青年仍在原处射箭，黄衣男人也还站在一旁。他一看见亚瑟便迎上前问候，把国王和全部随从请进堡中。那座城堡广大得不可思议，三千人一同住进去，竟像只有二十个人那样宽松，丝毫不显拥挤。
        - id: ch03-b05
          speaker: narrator
          text: 日出时，众人离开城堡。他们先找到森林守护者，随后登上山顶，来到泉水、银碗和树前。
        - id: ch03-b06
          speaker: kai
          text: “陛下，让我来泼水，也让我最先迎战随之而来的冒险。”
        - id: ch03-b07
          speaker: arthur
          text: “去吧。”
        - id: ch03-b08
          speaker: narrator
          text: 凯把水泼上石板。雷声、冰雹、鸟鸣和黑骑士全都如前出现。冰雹砸死了亚瑟手下许多人。凯迎战黑骑士，却被击落马下。骑士离去后，亚瑟命众人原地扎营。
        - id: ch03-b09
          speaker: narrator
          text: 第二天早晨，凯再次请求迎战黑骑士，想再试一回能否取胜。亚瑟应允，可他仍旧被击落马下。黑骑士的长矛刺破他的头盔，划开皮肤，一直抵到头骨。凯的骄傲受了重挫，只得回到营里。此后，亚瑟带来的骑士一个接一个上前交战，却没有任何人能够取胜。到最后，尚未出战的只剩亚瑟本人和格瓦尔赫迈。
        - id: ch03-b10
          speaker: gwalchmai
          text: “陛下，让我去迎战他吧！”
        - id: ch03-b11
          speaker: arthur
          text: “好，由你去。”
        - id: ch03-b12
          speaker: narrator
          text: 格瓦尔赫迈用一件长袍遮住自己和坐骑，因此在场的人谁也认不出他。他与黑骑士从早到晚整整打了一天，谁也不能把对方击落马下。第二天，两人再战，结果仍然不分胜负。到了第三天，搏斗变得格外凶猛。他们同时跌落在地，随即站起身来，继续徒步挥剑。最后，黑骑士朝对手头上重重劈下一剑，头盔顿时从格瓦尔赫迈的脸上脱落。
        - id: ch03-b13
          speaker: owen
          text: “我不知道是你，格瓦尔赫迈。拿走我的剑和铠甲吧。”
          emotion: surprised
        - id: ch03-b14
          speaker: gwalchmai
          text: “不，是你赢了，欧文。该由你拿走我的剑。”
        - id: ch03-b15
          speaker: narrator
          text: 欧文不肯接受。亚瑟从二人身后走来。
        - id: ch03-b16
          speaker: arthur
          text: “把剑都交给我吧。你们谁也没有胜过谁。”
        - id: ch03-b17
          speaker: narrator
          text: 欧文转身搂住亚瑟的脖子。第二天，亚瑟准备带众人返回，欧文却拦住了他。
        - id: ch03-b18
          speaker: owen
          text: “陛下，我离开您的这三年，一直在为您准备宴席。我知道您一定会来找我。请您和部下留下，多住些时日。”
        - id: ch03-b19
          speaker: narrator
          text: 众人一同骑马来到泉水夫人的城堡，在那里休息宴饮了三个月。临行时，亚瑟恳请夫人准许欧文随他返回不列颠，也只住三个月。她心中十分痛苦，仍旧答应了。欧文重新与老友相聚，实在太快活，三年竟像一场梦一样过去。他早忘了自己答应离开的只是三个月。
        - id: ch03-b20
          speaker: narrator
          text: 一天，欧文正在卡利恩城堡用餐。一名骑栗色马的少女进入大厅，径直来到他面前，俯身褪走他手上的戒指。
        - id: ch03-b21
          speaker: messenger
          text: “叛徒和负心人，就该得到这样的报应。”
          emotion: angry
        - id: ch03-b22
          speaker: narrator
          text: 少女拨转马头，径直离开了大厅。欧文听见这句话，终于想起自己忘掉的一切。他又悲伤，又羞愧，回房收拾行装，黎明便独自启程。他没有返回泉水夫人的城堡，因为心情太过沉重，只在遥远的荒野里漫无目的地流浪。身体日渐瘦弱，头发也越来越长。野兽成了他的朋友，他甚至睡在它们身旁。后来，他又渴望看见人的面孔，便走进一座山谷，在湖边沉睡过去。这里属于另一位寡居的伯爵夫人。

    - id: ch04
      title: 药膏与狮子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 正好到了伯爵夫人散步的时辰，她带着侍女来到湖边。众人见那里躺着一个男人，一动也不动，都以为他已经死了，吓得纷纷后退。等她们压下恐惧，鼓起勇气走近，伸手碰了碰，才发现他还有一息尚存。伯爵夫人立刻赶回城堡，取来一瓶珍贵药膏，交给一名侍女。
        - id: ch04-b02
          speaker: widowed_countess
          text: “牵来那边吃草的马，再拿一套男装，放在他身旁。把药膏涂在他心口附近，只要还有一点生命，这药就能救醒他。他若动了，你便躲进灌木，看看他会怎样。”
        - id: ch04-b03
          speaker: narrator
          text: 侍女带着药瓶，依照女主人的吩咐一一办妥。药膏涂下去不久，那男人的手臂开始活动，随后缓慢地站了起来。他虚弱得只能一步一步向前挪，终于来到马旁，从鞍上取下那套男装穿好，又忍着全身的疼痛爬上马背。侍女一直藏在附近的灌木里观看，等他坐稳以后才走出来问候。欧文重新见到人的面孔，心中十分欢喜，立刻问她眼前是谁的城堡。
        - id: ch04-b04
          speaker: countess_maiden
          text: “城堡属于一位寡居的伯爵夫人。丈夫给她留下两处伯爵领地，可她原本广阔的土地只剩下这些了。一名年轻伯爵逼她嫁给自己，她不肯，土地便被他夺走。”
        - id: ch04-b05
          speaker: owen
          text: “这实在令人惋惜。”
        - id: ch04-b06
          speaker: narrator
          text: 欧文虚弱得再也说不出什么。侍女领他进入城堡，生起火，送来食物。他在那里受了三个月照料，身体终于复原，甚至比从前更加英俊。一天中午，堡外响起兵器碰撞的声音。
        - id: ch04-b07
          speaker: owen
          text: “外面是什么声音？”
        - id: ch04-b08
          speaker: countess_maiden
          text: “就是我提过的那个伯爵。他带着大军来抢走我的女主人。”
        - id: ch04-b09
          speaker: owen
          text: “请夫人借我一匹马，再借我铠甲。”
        - id: ch04-b10
          speaker: narrator
          text: 侍女前去传话。伯爵夫人带着几分苦涩笑了。
        - id: ch04-b11
          speaker: widowed_countess
          text: “我不借，干脆送给他。我还会给他从没拥有过的良马、铠甲和武器，虽然不知道这些东西能派上什么用场。至少，它们不会落到敌人手里。”
        - id: ch04-b12
          speaker: narrator
          text: 马被牵来，欧文骑出城堡，两个侍童跟在身后。前方敌军已经扎营。
        - id: ch04-b13
          speaker: owen
          text: “那个伯爵在哪里？”
        - id: ch04-b14
          speakers: [page_1, page_2]
          ensemble: duo
          text: “就在竖着四面黄旗的队伍中。”
        - id: ch04-b15
          speaker: owen
          text: “你们到城门口等我。”
        - id: ch04-b16
          speaker: narrator
          text: 欧文高声挑战，伯爵上前迎战。两人打得十分激烈，欧文终于击败对手，驱赶着他穿过城门，直入大厅。
        - id: ch04-b17
          speaker: owen
          text: “夫人请看，这就是您那神奇药膏换来的报答。”
        - id: ch04-b18
          speaker: narrator
          text: 他命年轻伯爵跪在夫人面前，逼他发誓归还夺走的一切。随后，欧文告辞，再度进入荒野。穿过一片树林时，一阵响亮的吼叫传来。他拨开灌木，看见一头狮子站在大土丘上，土丘旁有块岩石。岩石附近，一条蛇正设法逼近土丘。蛇每动一下，狮子便从岩石旁扑出来，阻止它继续向前。
        - id: ch04-b19
          speaker: narrator
          text: 欧文拔出宝剑，一下斩掉蛇头，随后继续赶路。狮子却跟了上来，像一条猎犬似的绕着他嬉戏，而且很快证明自己远比猎犬有用。傍晚，它用嘴衔来一根根粗大的木柴，让欧文能够生火，又咬死一头肥鹿，给他充作晚餐。欧文点起火，剥下鹿皮，割下一部分架在火上烤，把剩下的鹿肉全留给狮子吃。
        - id: ch04-b20
          speaker: narrator
          text: 等肉烤熟时，附近传来低沉的叹息。
        - id: ch04-b21
          speaker: owen
          text: “你是谁？”
        - id: ch04-b22
          speaker: luned
          text: “我是卢内德。”
        - id: ch04-b23
          speaker: narrator
          text: 声音来自一座洞穴。洞口让灌木与垂下的绿藤遮得严严实实，欧文先前根本没有发现。
        - id: ch04-b24
          speaker: owen
          text: “你为什么被关在这里？”
        - id: ch04-b25
          speaker: luned
          text: “那个娶了泉水夫人又将她抛下的骑士害我受了囚禁。侍童们说他的坏话，我却告诉他们，世上没有活人能与他相比。他们便把我拖进洞里，说除非那个人在限期前赶来救我，否则我就必须死。后天便是期限。他叫欧文，是乌里恩的儿子。可我找不到人把危险告诉他，否则他一定会来救我。”
        - id: ch04-b26
          speaker: narrator
          text: 欧文听后没有表明身份，只分了些烤肉给卢内德，叫她安心等待。随后他带着狮子出发，来到平原另一头的一座大城堡。人们出来牵走他的马，把马安置在食槽边。狮子也跟进马厩，卧在草料上。堡中人人热情善良，却又满怀忧愁，仿佛死亡正笼罩着他们。等众人吃喝完毕，欧文才请求伯爵说明悲伤的缘故。
        - id: ch04-b27
          speaker: mountain_earl
          text: “昨天，我两个儿子外出打猎，被山里的怪物抓走了。他发誓，除非我把女儿嫁给他，否则绝不放人。”
        - id: ch04-b28
          speaker: owen
          text: “那件事绝不能发生。这个怪物是什么模样？”
        - id: ch04-b29
          speaker: mountain_earl
          text: “形貌像人，身量却是巨人。与其交出女儿，我宁可让他杀了我的儿子。”
          emotion: sad
        - id: ch04-b30
          speaker: narrator
          text: 第二天一早，一阵巨大喧声惊醒了城堡里的每一个人。大家奔出去看，才发现巨人已经押着伯爵的两个儿子来到城外。欧文迅速穿好铠甲，提起武器出门迎战，狮子寸步不离地跟在脚边。巨人的重击一下接着一下落在欧文身上。狮子看见主人受创，立刻扑向巨人的喉咙。那怪物费了很大力气，才勉强把它赶开。
        - id: ch04-b31
          speaker: giant
          text: “若不是这头狮子，我打败你根本不费力气。”
        - id: ch04-b32
          speaker: narrator
          text: 欧文听后深感羞愧。他觉得自己竟不能只凭手中宝剑战胜巨人，便把狮子关进城堡的一座高塔，独自回来继续战斗。可狮子听着外面一下重过一下的兵器撞击，知道主人处境不妙。它沿塔身一路向上攀爬，终于来到塔顶，从通往屋顶的门跃上城墙，又从城墙纵身跳到地面。一声怒吼过后，它直扑巨人。怪物挨了狮子一掌，当场倒地身亡。
        - id: ch04-b33
          speaker: narrator
          text: 城堡里的悲伤顿时化为欢庆。伯爵恳求欧文留下赴宴，他却说还有别的事，便骑马返回囚禁卢内德的地方，狮子照旧跟在脚边。

    - id: ch05
      title: 卢内德获救
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 欧文赶到时，一堆烈火已经燃起。两个青年正押着卢内德出来，要把她投入火中。
        - id: ch05-b02
          speaker: owen
          text: “住手！你们给她定了什么罪？”
        - id: ch05-b03
          speakers: [youth_1, youth_2]
          ensemble: duo
          text: “她夸口说，世上没人比得上欧文。我们把她关进洞里，约定只有欧文本人能够救她。他若不能在期限前出现，她就得死。如今期限已过，欧文连影子也没有。”
        - id: ch05-b04
          speaker: owen
          text: “欧文确实是位好骑士。他若知道这姑娘身陷险境，一定会来救她。请让如今的我代他应战。”
        - id: ch05-b05
          speakers: [youth_1, youth_2]
          ensemble: duo
          text: “我们答应。”
        - id: ch05-b06
          speaker: narrator
          text: 战斗立刻开始。两个青年武艺高强，步步紧逼。狮子见欧文陷入苦战，便扑上来相助。青年打手势叫双方停下。
        - id: ch05-b07
          speakers: [youth_1, youth_2]
          ensemble: duo
          text: “首领，我们约定的是只和你一人交战。那头猛兽可比你更难对付。”
        - id: ch05-b08
          speaker: narrator
          text: 欧文把狮子关进先前囚禁卢内德的洞穴，又搬来石头堵住洞口。可是与巨人的恶战已经耗去他太多力气，两个青年又武艺高强，把他逼得比刚才更加凶险。狮子看出主人危急，发出一声震天怒吼，猛力撞破堵在洞口的石堆。它从洞里扑向两个青年，把他们双双杀死。经历这一切以后，卢内德终于得救了。
        - id: ch05-b09
          speaker: narrator
          text: 卢内德与欧文一同回到泉水夫人的领地。后来，欧文带着夫人前往亚瑟王的宫廷。两人在那里幸福地生活，直到生命终结。
        - id: ch05-b10
          speaker: narrator
          text: 这个故事选自《马比诺吉昂》。
