        pace: 适中偏慢
        pitch: 中
    city_leader:
      display_name: 城中首领
      tts:
        delivery: 代表众人郑重陈词，稳妥清楚
        timbre: 成熟厚实的男声
        pace: 适中
        pitch: 中低
    gwalchmai:
      display_name: 格瓦尔赫迈
