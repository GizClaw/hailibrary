audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    arthur:
      display_name: 亚瑟王
      tts:
        delivery: 宽厚威严，面对亲近的骑士时坦率自然
        timbre: 沉稳洪亮的成年男声
        pace: 适中偏慢
        pitch: 中低
    kynon:
      display_name: 基农
      tts:
        delivery: 阅历丰富，讲起旧日败绩时坦白而郑重
        timbre: 坚实略显沧桑的成年男声
        pace: 适中
        pitch: 中低
    kai:
      display_name: 凯
      tts:
        delivery: 直率锐利，偶尔出言刻薄，自尊心很强
        timbre: 清楚有力的成年男声
        pace: 适中偏快
        pitch: 中
    owen:
      display_name: 欧文
      tts:
        delivery: 勇敢诚挚，意气昂扬，悔恨时低沉克制
        timbre: 明亮坚定的年轻男声
        pace: 适中
        pitch: 中
    guenevere:
      display_name: 桂妮薇儿王后
      tts:
        delivery: 高贵从容，维护朋友时言辞锋利
        timbre: 清澈端庄的成年女声
        pace: 适中
        pitch: 中
    castle_host:
      display_name: 城堡主人
      tts:
