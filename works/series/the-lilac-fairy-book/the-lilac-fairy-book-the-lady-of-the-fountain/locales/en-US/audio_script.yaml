  chapters:
    - id: ch01
      title: Kynon's Adventure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the great hall of Caerleon upon Usk, King Arthur sat on green rushes covered with flame-colored silk. A red satin cushion rested beneath his elbow. His knights Owen, Kynon, and Kai sat with him. At the far window, Queen Guenevere and her maidens embroidered strange golden patterns on white cloth.
        - id: ch01-b02
          speaker: arthur
          text: I am tired. I mean to sleep until the food is ready. Tell one another stories while you wait, and Kai can bring you mead and meat from the kitchen.
        - id: ch01-b03
          speaker: narrator
          text: After they had eaten and drunk, Kynon, the oldest of the knights, began his tale.
        - id: ch01-b04
          speaker: kynon
          text: I was my parents' only son, and they treasured me. But staying at home did not satisfy me. I believed there was no deed in the world too great for me. No one could stop me. Once I had won many adventures in my own country, I said farewell to my parents and went out to see the world.
        - id: ch01-b05
          speaker: kynon
          text: I crossed mountains, deserts, and rivers until I came to a lovely valley filled with trees. A path followed a stream through it. I walked there all day. That evening I reached a castle guarded by two young men in yellow. Each held an ivory bow and arrows made from whalebone, with peacock feathers for wings. Golden daggers with whalebone hilts hung at their sides.
        - id: ch01-b06
          speaker: kynon
          text: A richly dressed man stood near them. He turned and walked beside me toward the castle, and we entered a hall where everyone who lived there had gathered. Twenty-four maidens sat together in one window. Even the least beautiful among them was fairer than Guenevere at her fairest. Some of the household took charge of my horse. Others unfastened my armor, then washed the armor, my sword, and my spear until everything shone like silver.
        - id: ch01-b07
          speaker: kynon
          text: I washed and put on the vest and doublet they gave me. Then the lord and I sat before a silver table. I had never eaten a finer feast. Until then, neither he nor the maidens had spoken. When I had eaten enough to quiet my hunger, he asked who I was. I gave him my name and my father's, and told him why I had come. I was tired of mastering every man at home. I wanted to find a man who could master me. He smiled.
        - id: ch01-b08
          speaker: castle_lord
          text: I could show you what you seek, if I were not afraid the answer might distress you.
        - id: ch01-b09
          speaker: narrator
          text: That answer made Kynon sorrowful, and for the first time he doubted himself. The lord saw it.
        - id: ch01-b10
          speaker: castle_lord
          text: If you truly mean to test your courage, and this is more than an idle boast that no one can defeat you, then I do have something to show you. But you must sleep in this castle tonight. In the morning, rise early and follow the road upward through the valley until you reach a wood. There a path branches off to the right. Follow it to a grassy clearing with a mound in its center.
        - id: ch01-b11
          speaker: castle_lord
          text: On that mound stands a black man bigger than any two white men. He has one eye in the middle of his forehead and only one foot. His iron club is so heavy that two white men could scarcely lift it. A thousand beasts of every kind graze around him. He guards the wood, and he will tell you how to find the adventure you seek.
        - id: ch01-b12
          speaker: kynon
          text: The night seemed endless. Before dawn I armed myself, mounted, and rode to the grassy clearing. The black man stood on the mound exactly as I had been told. He was even mightier than I had imagined. And Kai, that club would have burdened four of our warriors. He waited in silence, so I asked what power he held over all the beasts crowding around him.
        - id: ch01-b13
          speaker: guardian
          text: I will show you, little man.
        - id: ch01-b14
          speaker: kynon
          text: He struck a stag on the head with his club, and it gave a great bray. Animals came running at the sound, as countless as the stars. I could barely stand among them. There were serpents and dragons, and strange beasts with horns where I had never seen horns grow. The black man merely looked at them and ordered them back to their feeding. Every beast bowed before him like a vassal before his lord.
        - id: ch01-b15
          speaker: guardian
          text: There, little man. I have answered your question and shown you my power. What else do you want to know?
        - id: ch01-b16
          speaker: narrator
          text: Kynon asked which way he should go. The guardian grew angry and seemed determined to stop him. Only after Kynon told him who he was did the anger pass.
        - id: ch01-b17
          speaker: guardian
          text: Follow the path to the head of this clearing, then climb through the wood to the top. You will come to an open place with a tall tree. Beneath it is a fountain. Beside the fountain lies a marble slab, and on that slab is a silver bowl fastened to a silver chain.
        - id: ch01-b18
          speaker: guardian
          text: Dip the bowl into the fountain and cast the water on the slab. A great crash of thunder will make heaven and earth seem to tremble. Then hail will fall so hard and thick that you may scarcely survive it. Afterward the sun will shine once more, but every leaf from the tree will be lying on the ground. A flight of birds will settle on the bare branches and sing more sweetly than any birds you have ever heard.
        - id: ch01-b19
          speaker: guardian
          text: Just when their song is sweetest, you will hear a grieving voice coming up the valley. A knight in black velvet will appear on a black horse. His lance carries a black pennon, and he will spur straight at you. Run, and he will catch you. Stay, and he will throw you from your horse. If that adventure brings you no trouble, you need never hunt for trouble again.
        - id: ch01-b20
          speaker: kynon
          text: I left the guardian and climbed to the top of the wood. Everything was as he had promised. I filled the silver bowl from the fountain and emptied it over the marble. The thunder was far louder than I had expected, and the hail far more savage. Truly, Kai, each stone struck through skin and flesh down to the bone.
        - id: ch01-b21
          speaker: kynon
          text: I turned my horse's flank to the storm, bent across his neck, and held my shield over both our heads. When the hail ended, the sky was blue again and the sun shone. Not one leaf remained on the tree. Birds of every kind covered its branches, singing more sweetly than anything I had heard before or have heard since.
        - id: ch01-b22
          speaker: narrator
          text: As Kynon listened, a murmuring voice drew nearer.
        - id: ch01-b23
          speaker: black_knight
          text: Knight, why have you come here? What wrong did I ever do you, that you would bring such ruin upon me? Across all my lands, no man or beast caught in that storm has lived.
        - id: ch01-b24
          speaker: kynon
          text: The knight rode out of the valley on his black horse, gripping the lance with its black pennon. We charged each other at once. I fought as well as I could, but he quickly defeated me and threw me to the ground. Then he seized my horse by the bridle and rode off with it, leaving me where I had fallen. He did not even bother to strip away my armor.
        - id: ch01-b25
          speaker: kynon
          text: I walked sadly back down the hill. Kai, when I reached the guardian's clearing, my shame was so great that I nearly melted into a pool. I slept again at the castle. They bathed me and fed me, and no one asked what had happened. In the morning I found a saddled bay horse waiting. I put on my armor and returned to my own court. That horse still stands in my stable, and I would not trade it for any horse in Britain.
        - id: ch01-b26
          speaker: kynon
          text: No man ever told an adventure more damaging to his own honor. Yet in all the years since, I have never met another man who knew anything of the guardian, the black knight, or the storm.
    - id: ch02
      title: Owen and the Black Knight
      blocks:
        - id: ch02-b01
          speaker: owen
          text: Should we not go and find this place for ourselves?
        - id: ch02-b02
          speaker: kai
          text: By my friend's hand, Owen, your tongue often promises things your deeds would never carry out.
        - id: ch02-b03
          speaker: guenevere
          text: Kai, you would be better hanged than speaking that way to a man like Owen.
          emotion: angry
        - id: ch02-b04
          speaker: kai
          text: I meant no harm, my lady. You do not praise Owen more highly than I do.
        - id: ch02-b05
          speaker: narrator
          text: As Kai spoke, Arthur woke and asked whether he had slept for a little while.
        - id: ch02-b06
          speaker: owen
          text: Yes, my lord. You certainly have.
        - id: ch02-b07
          speaker: arthur
          text: Is it time for us to eat?
        - id: ch02-b08
          speaker: owen
          text: It is, my lord.
        - id: ch02-b09
          speaker: narrator
          text: The washing horn sounded. The king and all his household sat down to their meal. When it ended, Owen quietly left them and prepared his horse and weapons.
        - id: ch02-b10
          speaker: narrator
          text: At the first light of sunrise, he rode away. He crossed deserts, climbed over mountains, and passed across rivers. Everything that had happened to Kynon now happened to Owen in turn. At last he poured the water and endured the storm. He stood beneath the tree, now stripped of all its leaves, and listened to the wonderful song of the birds. Then the grieving voice came toward him. Owen turned and saw the black knight galloping to meet him.
        - id: ch02-b11
          speaker: narrator
          text: They fought fiercely until both lances broke. Then they drew their swords. Owen struck through the knight's helmet and into his skull.
        - id: ch02-b12
          speaker: narrator
          text: Knowing the wound would kill him, the black knight fled. Owen followed close behind until they reached a splendid castle. The wounded man dashed over the bridge that crossed the moat and passed through the gate. As soon as he was safe, the drawbridge was pulled up. It caught Owen's horse in the middle, with half the animal inside the gate and half outside. Owen could not dismount. He could not go forward or back, and he had no idea what to do.
        - id: ch02-b13
          speaker: narrator
          text: A small door opened in the castle gate. Beyond it Owen saw a street lined with tall houses. A maiden with curling golden hair looked out.
        - id: ch02-b14
          speaker: luned
          text: Open the gate, Owen.
        - id: ch02-b15
          speaker: owen
          text: By my honor, I can no more open it from here than you can set me free!
        - id: ch02-b16
          speaker: luned
          text: Then I will try to release you, if you follow my directions. Put on this ring with its stone against your palm, and close your fingers tightly. As long as you hide the ring, it will hide you.
        - id: ch02-b17
          speaker: luned
          text: The men inside will first gather and decide what to do. Then they will come to take you to your death, and they will be bitterly disappointed when they cannot find you. I will stand on that horse block over there. You will be able to see me, though I cannot see you. Come close, lay your hand on my shoulder, and follow wherever I lead you.
        - id: ch02-b18
          speaker: narrator
          text: Luned went away. The castle men came out to search for Owen, found no one, and returned inside in great distress. Then Owen approached Luned, placed his hand on her shoulder, and followed her.
        - id: ch02-b19
          speaker: narrator
          text: She led him into a large room painted in rich colors and decorated with golden images. She brought him food and drink, water for washing, and fresh clothes. Owen lay on a soft bed beneath scarlet cloth and fur, and slept gladly.
        - id: ch02-b20
          speaker: narrator
          text: In the middle of the night, a great outcry woke him. He dressed quickly and went into the hall, where Luned stood waiting.
        - id: ch02-b21
          speaker: owen
          text: What has happened?
        - id: ch02-b22
          speaker: luned
          text: The lord of this castle has died. They are carrying his body to the church.
        - id: ch02-b23
          speaker: narrator
          text: Owen had never seen so vast a crowd. The dead knight's body was carried toward the church, and behind it walked the most beautiful woman in the world. Her cry of grief rose louder than the shouting men and the braying trumpets around her. Owen watched her pass through the crowd, and as he looked at her, he loved her.
        - id: ch02-b24
          speaker: owen
          text: Who is that lady?
        - id: ch02-b25
          speaker: luned
          text: She is my mistress, the Lady of the Fountain. She was the wife of the man you killed yesterday.
        - id: ch02-b26
          speaker: owen
          text: Truly, she is the woman I love above all others.
        - id: ch02-b27
          speaker: luned
          text: And she will come to love you greatly too.
    - id: ch03
      title: The Lady of the Fountain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Luned left Owen. After a while, she went to her mistress's chamber, but the grieving lady would not answer her.
        - id: ch03-b02
          speaker: luned
          text: Mistress, what troubles you?
        - id: ch03-b03
          speaker: lady_of_fountain
          text: Luned, why have you stayed away from me while I grieve?
          emotion: sad
        - id: ch03-b04
          speaker: luned
          text: Is it wise to mourn so bitterly for someone dead, or for anything else already lost to you?
        - id: ch03-b05
          speaker: lady_of_fountain
          text: No man in the world was his equal. I would gladly banish you for saying such a thing.
          emotion: angry
        - id: ch03-b06
          speaker: luned
          text: Please do not be angry, my lady. Listen to my advice. You know you cannot protect these lands alone. You must find someone who can help you.
        - id: ch03-b07
          speaker: lady_of_fountain
          text: And how am I to do that?
        - id: ch03-b08
          speaker: luned
          text: I will tell you. If no one defends the fountain, everything will be lost. Only a knight from Arthur's court can guard it. I will ride there to find one, and woe to me if I return without a warrior who can defend the fountain as well as its former guardian did.
        - id: ch03-b09
          speaker: lady_of_fountain
          text: Then go, and prove that you can do what you promise.
        - id: ch03-b10
          speaker: narrator
          text: Luned set out on a white palfrey and pretended she was riding all the way to King Arthur's court. She did not go there at all. Instead, she found a hiding place and stayed out of sight for exactly as many days as the journey there and back would have taken. When those days were over, she left her hiding place and went in to see her mistress.
        - id: ch03-b11
          speaker: lady_of_fountain
          text: What news have you brought from the court?
        - id: ch03-b12
          speaker: luned
          text: The best news. I have succeeded. When would you like me to present the knight who returned with me?
        - id: ch03-b13
          speaker: lady_of_fountain
          text: Tomorrow at midday. I will call all the people of the town together.
        - id: ch03-b14
          speaker: narrator
          text: At noon the next day, Owen put on his coat of mail. Over it he wore a splendid mantle, and golden clasps fastened the leather shoes on his feet. He followed Luned to her mistress's chamber.
        - id: ch03-b15
          speaker: narrator
          text: The lady was very glad to receive them. But she studied Owen closely.
        - id: ch03-b16
          speaker: lady_of_fountain
          text: Luned, this knight does not look much like a man who has just finished a long journey.
        - id: ch03-b17
          speaker: luned
          text: What harm is there in that, my lady?
        - id: ch03-b18
          speaker: lady_of_fountain
          text: I believe this is the very man who drove the soul from my husband's body.
        - id: ch03-b19
          speaker: luned
          text: If he had not been stronger than your husband, he could never have killed him. Nothing can undo that now, or change anything else that has already happened.
        - id: ch03-b20
          speaker: lady_of_fountain
          text: Leave me, both of you. I must consider this.
        - id: ch03-b21
          speaker: narrator
          text: They went out. The next morning, the lady summoned her people to the castle courtyard. She told them that with her husband dead, no one remained to defend her lands.
        - id: ch03-b22
          speaker: lady_of_fountain
          text: You must choose. Either one of you will take me as his wife, or you will allow me to choose a new lord, so that my lands are not left without a master.
        - id: ch03-b23
          speaker: narrator
          text: The leading men of the city gathered in a corner to discuss her words. After a while, their leader stepped forward.
        - id: ch03-b24
          speaker: city_leader
          text: For the peace and safety of us all, we have decided that you should choose a husband for yourself.
        - id: ch03-b25
          speaker: narrator
          text: The lady summoned Owen into her presence. She offered him her hand, and he accepted it with joy. They were married without delay. The leading men and all the people of the earldom received Owen as their new lord and paid homage to him.
        - id: ch03-b26
          speaker: narrator
          text: From that day onward, Owen guarded the fountain just as the former earl had done. Whenever a knight came along the road and challenged its defender, Owen met him and threw him from his horse. The defeated knight paid a ransom, which Owen divided among his barons. Three years passed in this way. Throughout those lands, no man in the world was more beloved than Owen.
    - id: ch04
      title: Arthur Finds Owen
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At the end of those three years, Gwalchmai was with Arthur and noticed that the king was deeply sad.
        - id: ch04-b02
          speaker: gwalchmai
          text: My lord, has something happened to trouble you?
        - id: ch04-b03
          speaker: arthur
          text: Oh, Gwalchmai, I grieve for Owen. He has been lost to me for three years. If a fourth year passes without him, I cannot live. Kynon son of Clydno told the tale that drew him away. I will take my household and find him. If he is dead, I will avenge him. If he is imprisoned, I will free him. If he lives, I will bring him home.
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: Arthur set out in search of Owen with three thousand men from his household, taking Kynon as their guide. They reached the castle from Kynon's tale. The young men were shooting in the same place as before, and the same man in yellow stood nearby. As soon as he saw Arthur, he greeted the king and invited him in. They all entered together. The castle was so vast that the king's three thousand men seemed no more than twenty.
        - id: ch04-b05
          speaker: narrator
          text: At sunrise, Arthur left with Kynon leading the way. They passed the guardian of the wood and climbed to the fountain, the silver bowl, and the tree.
        - id: ch04-b06
          speaker: kai
          text: My lord, let me cast the water on the slab and face whatever adventure comes first.
        - id: ch04-b07
          speaker: arthur
          text: You may do it.
        - id: ch04-b08
          speaker: narrator
          text: Kai cast the water onto the slab. Everything happened just as Kynon had described. Thunder shook the hill. The savage hailstorm followed and killed many of Arthur's men. Then the sky cleared, the birds came to the tree, and their song filled the wood. The black knight appeared after them. Kai rode out to meet him, fought him, and was thrown from his horse. The knight went away, and Arthur's company made camp where they stood.
        - id: ch04-b09
          speaker: narrator
          text: The next morning, Kai asked to try again. Arthur agreed. Again the black knight unhorsed him. This time the knight's lance broke through Kai's helmet and cut him to the bone. Kai returned to camp with his pride humbled.
        - id: ch04-b10
          speaker: narrator
          text: One knight after another fought the stranger, but none could defeat him. At last, only Arthur and Gwalchmai remained. Arthur began to take up his weapons.
        - id: ch04-b11
          speaker: gwalchmai
          text: Oh, my lord, please let me fight him!
        - id: ch04-b12
          speaker: arthur
          text: Very well. Go and fight.
        - id: ch04-b13
          speaker: narrator
          text: Gwalchmai threw a robe over both himself and his horse so that no one would know who he was. He rode out against the black knight. They fought for the whole day, and neither warrior could throw the other. They returned to the contest the next morning. The second day passed exactly like the first, with neither one gaining the victory.
        - id: ch04-b14
          speaker: narrator
          text: On the third day, they fought so fiercely that both fell to the ground at once. They rose and continued on foot. At last the black knight struck Gwalchmai's head, knocking the helmet away from his face.
        - id: ch04-b15
          speaker: owen
          text: Gwalchmai! I had no idea it was you. Take my sword and my armor.
          emotion: surprised
        - id: ch04-b16
          speaker: gwalchmai
          text: No, Owen. You are the victor. You must take my sword.
        - id: ch04-b17
          speaker: narrator
          text: Owen refused.
        - id: ch04-b18
          speaker: arthur
          text: Give both swords to me. Neither of you has defeated the other.
        - id: ch04-b19
          speaker: narrator
          text: Owen turned, saw Arthur behind them, and threw his arms around the king's neck.
        - id: ch04-b20
          speaker: narrator
          text: The next day Arthur was ready to order the journey home, but Owen stopped him.
        - id: ch04-b21
          speaker: owen
          text: My lord, during these three years away from you, I have been preparing a feast. I always knew you would come searching for me. Please stay here awhile with all your men.
        - id: ch04-b22
          speaker: narrator
          text: They all rode together to the Lady of the Fountain's castle. For three whole months, Arthur and his company rested there and feasted with Owen. When the time came for them to leave, Arthur went to the lady and begged her to let Owen return with him to Britain. He asked to keep Owen there for only three months. The request filled her heart with pain, but she gave Owen permission to go.
        - id: ch04-b23
          speaker: narrator
          text: Owen was so happy among his old companions that the promised three months became three years, and the years passed like a dream.
        - id: ch04-b24
          speaker: narrator
          text: One day, as Owen ate in the hall at Caerleon upon Usk, a damsel rode in on a bay horse. She came straight to him, bent down, and pulled the ring from his hand.
        - id: ch04-b25
          speaker: avenging_damsel
          text: This is how a traitor and a faithless man should be treated.
          emotion: angry
        - id: ch04-b26
          speaker: narrator
          text: She turned her horse and rode out. Her words brought back everything Owen had forgotten. Filled with sorrow and shame, he went to his chamber and prepared to leave.
        - id: ch04-b27
          speaker: narrator
          text: He departed at dawn, but his heart was too heavy to return to his wife. Instead he wandered far into the wild. His body grew thin and weak, and his hair grew long. Wild beasts became his companions, and he slept beside them. At last he longed to see a human face again. He came down into a valley and fell asleep beside a lake in the lands of a widowed countess.
    - id: ch05
      title: The Healing Balm
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The countess was taking her usual walk with her maidens when they saw Owen lying beside the lake. He lay so still that they drew back in terror, believing him dead. Once they mastered their fear, they approached, touched him, and discovered that he still lived. The countess hurried to her castle and returned with a flask of precious balm. She gave it to one of her maidens.
        - id: ch05-b02
          speaker: widowed_countess
          text: Take the horse grazing over there and a suit of men's clothing. Leave them beside this man, then pour some of the balm close to his heart. If any life remains, it will restore him. If he moves, hide in those bushes and watch what he does.
        - id: ch05-b03
          speaker: narrator
          text: The maiden took the flask and did exactly as her mistress had told her. Soon Owen began to move his arms. Then he slowly rose to his feet. Step by painful step, he crept toward the horse. He lifted the clothes from its saddle, dressed himself, and struggled onto the animal's back. When he was finally seated, the maiden came out of the bushes and greeted him. Owen was glad to see another person. He asked whose castle stood before them.
        - id: ch05-b04
          speaker: countess_maiden
          text: It belongs to a widowed countess. Her husband left her two earldoms, but that is all she has left of her once-great lands. A young earl has seized the rest because she refused to marry him.
        - id: ch05-b05
          speaker: owen
          text: That is a great pity.
        - id: ch05-b06
          speaker: narrator
          text: He said nothing more because he was too weak to speak. The maiden led him to the castle, lit a fire, and brought him food. They cared for him there for three months, until he was more handsome than ever.
        - id: ch05-b07
          speaker: narrator
          text: At noon one day, Owen heard the clash of weapons outside the castle and asked the maiden what it meant.
        - id: ch05-b08
          speaker: countess_maiden
          text: It is the earl I told you about. He has come with a great army to carry my mistress away.
        - id: ch05-b09
          speaker: owen
          text: Ask your mistress to lend me a horse and armor.
        - id: ch05-b10
          speaker: narrator
          text: The maiden carried his request to the countess. The lady laughed bitterly.
        - id: ch05-b11
          speaker: widowed_countess
          text: I will not lend them. I will give him a horse, armor, and weapons finer than any he has ever owned, though I cannot imagine what use they will be to him. Perhaps, at least, that will keep them from my enemies.
        - id: ch05-b12
          speaker: narrator
          text: They brought out the horse. Owen rode toward the great army with two pages behind him.
        - id: ch05-b13
          speaker: owen
          text: Where is the earl?
        - id: ch05-b14
          speakers: [page_one, page_two]
          ensemble: duo
          text: He is in that company beneath the four yellow standards.
        - id: ch05-b15
          speaker: owen
          text: Wait for me at the castle gate.
        - id: ch05-b16
          speaker: narrator
          text: Owen called out a challenge to the earl, who left his army and came to meet him. They fought hard, but Owen overcame his enemy. He drove the earl before him all the way to the castle gate, through the entrance, and into the hall. There Owen ordered him to kneel before the countess.
        - id: ch05-b17
          speaker: owen
          text: Here is the reward your blessed balm has earned.
        - id: ch05-b18
          speaker: narrator
          text: Owen made the defeated earl swear to return everything he had stolen from her.
        - id: ch05-b19
          speaker: young_earl
          text: I swear that all I took from you will be restored.
    - id: ch06
      title: The Lion and the Giant
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Afterward Owen departed into the wilderness. While he was passing through a wood, he heard loud cries beyond the bushes. He pushed the branches aside and saw a lion near a great mound and a rock. Each time the lion tried to move toward the mound, a serpent darted out from the rock and stopped it.
        - id: ch06-b02
          speaker: narrator
          text: Owen drew his sword, cut off the serpent's head, and continued on his way. The lion followed him, playing around him like a greyhound. It soon proved far more useful than one. That evening it carried great logs in its mouth for a fire, then killed a fat buck for their meal.
        - id: ch06-b03
          speaker: narrator
          text: Owen made the fire, skinned the buck, and set part of the meat to roast. He gave the rest to the lion. As he waited for his supper to cook, he heard deep sighs nearby.
        - id: ch06-b04
          speaker: owen
          text: Who is there?
        - id: ch06-b05
          speaker: luned
          text: It is Luned.
        - id: ch06-b06
          speaker: narrator
          text: Her voice came from a cave so well hidden by bushes and trailing green plants that Owen had not noticed it.
        - id: ch06-b07
          speaker: owen
          text: Luned! What are you doing in there?
          emotion: surprised
        - id: ch06-b08
          speaker: luned
          text: I am a prisoner because of the knight who married the Lady of the Fountain and then deserted her. The pages spoke badly of him. I told them no living man was his equal, so they dragged me here. They swore I would die unless he came to save me by an appointed day. That day is the day after tomorrow.
        - id: ch06-b09
          speaker: luned
          text: His name is Owen son of Urien. I have no one to carry word of my danger to him. If he knew, I am certain he would rescue me.
        - id: ch06-b10
          speaker: narrator
          text: Owen held his peace and did not tell her who he was. He passed some of the roasted meat into the cave and urged her to keep her courage. Then he set out across the plain toward a great castle, with the lion following behind. Men came to receive Owen and took his horse to a manger. The lion followed the horse inside and settled down upon the straw.
        - id: ch06-b11
          speaker: narrator
          text: Everyone within the castle received Owen with generous hospitality and great kindness. Yet sorrow lay over the whole household so heavily that anyone entering might have believed death was already among them. Owen waited until they had eaten and drunk. Then he turned to the earl and asked him to explain why every person in the castle was grieving.
        - id: ch06-b12
          speaker: mountain_earl
          text: Yesterday a monster from those mountains captured my two sons while they were hunting. He refuses to release them unless I give him my daughter as his wife.
        - id: ch06-b13
          speaker: owen
          text: That must never happen. What sort of creature is he?
        - id: ch06-b14
          speaker: mountain_earl
          text: He has the shape of a man but the height of a giant. Better that he kill my sons than that I surrender my daughter to him.
          emotion: sad
        - id: ch06-b15
          speaker: narrator
          text: Early the next morning, a great uproar woke the castle. The giant had arrived with the two young men. Owen quickly armed himself and went out. The lion followed close behind.
        - id: ch06-b16
          speaker: narrator
          text: The giant struck Owen with terrible blows. When the lion saw its master suffering, it flew at the monster's throat. The giant struggled to beat it away.
        - id: ch06-b17
          speaker: giant
          text: Fighting you would be easy if that lion were not helping you.
        - id: ch06-b18
          speaker: narrator
          text: Owen felt ashamed that his own sword had not been enough. He took the lion into a castle tower, shut it inside, and returned to the combat.
        - id: ch06-b19
          speaker: narrator
          text: From the sound of the blows, the lion knew the battle was going badly for Owen. It climbed higher and higher until it reached the top of the tower, where a door opened onto the roof. From the tower it sprang onto the castle walls, and from the walls down to the ground. With a great roar, it leaped upon the giant. The monster fell dead beneath the blow of its paw.
        - id: ch06-b20
          speaker: narrator
          text: The sorrow in the castle turned to joy. The earl begged Owen to remain for a feast, but the knight had other work to do. He rode back toward Luned's prison, and the lion followed at his heels.
    - id: ch07
      title: Luned's Deliverance
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: When Owen reached the cave, a great fire was burning. Two young men were leading Luned toward the flames.
        - id: ch07-b02
          speaker: owen
          text: Stop! What crime do you charge her with?
        - id: ch07-b03
          speaker: accuser_one
          text: She boasted that no man in the world was equal to Owen. We imprisoned her in this cave and agreed that only Owen himself could free her.
        - id: ch07-b04
          speaker: accuser_two
          text: If he did not come by the appointed day, she was to die. Her time has passed, and there is still no sign of him.
        - id: ch07-b05
          speaker: owen
          text: Owen is truly a good knight. If he had known this maiden was in danger, he would have come to rescue her. But I beg you, accept me as his champion instead.
        - id: ch07-b06
          speakers: [accuser_one, accuser_two]
          ensemble: duo
          text: We accept.
        - id: ch07-b07
          speaker: narrator
          text: The fight began. The two young men fought well and pressed Owen hard. The lion saw his master's danger and rushed to help him. At once the young men signaled for the combat to stop.
        - id: ch07-b08
          speaker: accuser_one
          text: Chieftain, we agreed to fight you alone. That beast is a harder opponent for us than you are.
        - id: ch07-b09
          speaker: narrator
          text: Owen shut the lion inside the cave where Luned had been held, then piled stones across the entrance so it could not follow him. But the battle with the giant had already tested his strength severely. The two young men fought skillfully. Once they began again, they pressed Owen even harder than they had before.
        - id: ch07-b10
          speaker: narrator
          text: The lion saw Owen's danger. It gave a great roar, burst through the stones, and sprang upon the young men. It killed them both. At last, Luned was free.
        - id: ch07-b11
          speaker: narrator
          text: Luned rode beside Owen as they returned to the lands of the Lady of the Fountain. From there, Owen took the lady with him to King Arthur's court. They made their home among his old companions, and there they lived happily until they died.
