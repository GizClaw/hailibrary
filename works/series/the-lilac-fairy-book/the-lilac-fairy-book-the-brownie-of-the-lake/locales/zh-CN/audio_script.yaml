audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    jegu:
      display_name: 杰居
      tts:
        delivery: 朴实憨厚，面对精灵时惊讶而诚恳
        timbre: 粗朴低沉的年轻男声
        pace: 适中偏慢
        pitch: 中低
    brownie:
      display_name: 湖中精灵
      tts:
        delivery: 机敏自信，施展法术时带着顽皮和得意
        timbre: 清亮灵巧的成年男声
        pace: 轻快
        pitch: 中高
    barbaik:
      display_name: 巴尔拜克
      tts:
        delivery: 骄傲任性，得意时轻快，发怒时尖锐有力
        timbre: 明亮清脆的年轻女声
        pace: 适中偏快
        pitch: 中高
    passerby:
      display_name: 路人
      tts:
        delivery: 随口打趣，带着乡间看热闹的笑意
        timbre: 爽朗的成年男声
        pace: 适中
        pitch: 中
    dwarf_two:
      display_name: 绿衣小矮人甲
      tts:
        delivery: 活泼灵巧，合唱时清楚有力
        timbre: 清脆的年轻男声
        pace: 轻快
        pitch: 高
    dwarf_three:
      display_name: 绿衣小矮人乙
      tts:
        delivery: 热闹爽快，合唱时节奏鲜明
        timbre: 明亮的年轻女声
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 湖边的约定
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，法国有个叫雅尔姆·里乌的人。他有的是钱，还有一座很大的农庄，日子过得又快活又知足。哪怕走上一整天，恐怕也找不到比他更称心的人。最让他得意的，是女儿巴尔拜克。她舞跳得轻盈，衣裳也比方圆乡野间的姑娘都漂亮。
        - id: ch01-b02
          speaker: narrator
          text: 每逢节日，巴尔拜克便戴上绣花帽，穿起五层长短相叠的衬裙，再扣好银扣鞋。女人们看了眼红，在背后说什么，她根本不理。只要自己衣裳最华美，请她跳舞的小伙子最多，她就满意了。
        - id: ch01-b03
          speaker: narrator
          text: 想娶她的人不少。最痴心的，是她父亲手下的领班杰居。可杰居举止粗鲁，长得又实在难看。巴尔拜克不肯跟他说话，还常和别人一起笑话他。杰居当然听见了这些事，心里十分难过。他本来可以离开农庄，去别处找份活儿，却怎么也舍不得走。离开这里，他就再也见不到巴尔拜克了。要是见不到她，活着还有什么意思呢？
        - id: ch01-b04
          speaker: narrator
          text: 一天傍晚，杰居把马从田里赶回来，路过一片小湖，停下来让它们喝水。他干了一整天，累得把手搭在一匹马的鬃毛上。正想着巴尔拜克，旁边的荆豆丛里忽然有人说话。
        - id: ch01-b05
          speaker: brownie
          text: “杰居，出了什么事？你还用不着灰心呢。”
        - id: ch01-b06
          speaker: narrator
          text: 杰居惊讶地抬起头，忙问是谁。
        - id: ch01-b07
          speaker: brownie
          text: “是我，湖中精灵。”
        - id: ch01-b08
          speaker: jegu
          text: “那你躲在哪儿？”
        - id: ch01-b09
          speaker: brownie
          text: “仔细看看芦苇，里面那只绿色小青蛙就是我。我想变什么就能变什么。要是我愿意，还能让谁都看不见我。这个本领可更难。”
        - id: ch01-b10
          speaker: jegu
          text: “那就变成你们族人平常的模样，让我瞧瞧。”
        - id: ch01-b11
          speaker: brownie
          text: “好啊，既然你想看。”
        - id: ch01-b12
          speaker: narrator
          text: 青蛙跳上一匹马的背，眨眼变成了浑身穿绿衣的小矮人。杰居有些害怕。精灵叫他放心，说自己不会伤害他，还很愿意帮他的忙。
        - id: ch01-b13
          speaker: jegu
          text: “可你为什么这样关心我？”
        - id: ch01-b14
          speaker: brownie
          text: “因为去年冬天，你帮过我一次，我一直记着。白麦国那些心肠狠毒的科里甘精灵向我们宣战，只因他们说我们是人类的朋友。我们只好逃到远方，起初还化成各种动物藏起来。后来一半因为习惯，一半为了好玩，我们还是常常变形。我就是这么认识你的。”
        - id: ch01-b15
          speaker: jegu
          text: “你怎么会认识我？”
        - id: ch01-b16
          speaker: brownie
          text: “三个月前，你在河边田里掘土，看见一只欧亚鸲困在网里，还记得吗？”
        - id: ch01-b17
          speaker: jegu
          text: “当然记得。我把网解开，放它飞走了。”
        - id: ch01-b18
          speaker: brownie
          text: “那只鸟就是我。从那天起，我发誓要做你的朋友。你想娶巴尔拜克，我就帮你娶到她，让你看看我是不是言而有信。”
        - id: ch01-b19
          speaker: jegu
          text: “我的小精灵，你若能办成这件事，除了灵魂，我什么都肯给你！”
        - id: ch01-b20
          speaker: brownie
          text: “交给我吧。用不了几个月，你会成为农庄的主人，也会娶到巴尔拜克。”
        - id: ch01-b21
          speaker: jegu
          text: “你到底打算怎么做？”
        - id: ch01-b22
          speaker: brownie
          text: “这是我的事，也许以后再告诉你。这段日子，你吃你的，睡你的，什么都别操心。”
        - id: ch01-b23
          speaker: narrator
          text: 杰居觉得这可太容易了。他脱下帽子，诚心谢过精灵，便领着马回农庄去了。

    - id: ch02
      title: 巴尔拜克的愿望
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天是节日。巴尔拜克想早点做完活儿，赶去远处参加舞会，所以比平常起得早。她先去打扫牛棚，却发现新稻草已经铺好，草架装满干草，牛也挤过奶了，奶桶还排得整整齐齐。
        - id: ch02-b02
          speaker: barbaik
          text: “准是杰居做的。他一定盼着我陪他跳一支舞。”
        - id: ch02-b03
          speaker: narrator
          text: 她在门外遇见杰居，特意停下来谢他帮忙。杰居却粗声粗气地说，自己根本不知道她在讲什么。可他越是这样否认，巴尔拜克越相信，除了他绝不会有别人。
        - id: ch02-b04
          speaker: narrator
          text: 从此，同样的怪事每天都来。牛棚从没这样干净过，奶牛也从没养得这样肥。每天早晚，巴尔拜克都会看到陶罐里装满牛奶，旁边放着一磅新搅好的黄油，上面还用叶子装饰得漂漂亮亮。几个星期后，她早已习惯了，只赶在做早饭前起床。
        - id: ch02-b05
          speaker: narrator
          text: 没过多久，连早饭也有人替她做好。她下楼时，屋子扫净了，家具擦亮了，炉火烧起来了，饭菜也已经摆好。她只需摇响大铃，把田里的雇工叫回来吃饭。她还是以为这一切出自杰居之手，心想，一个爱睡懒觉又贪玩乐的姑娘，若有这样的丈夫，那可太方便了。
        - id: ch02-b06
          speaker: narrator
          text: 后来，巴尔拜克只要说出愿望，事情便会替她办妥。风太冷，太阳太毒，她生怕出门坏了自己的容貌，就跑到附近的泉水边，轻声许愿。
        - id: ch02-b07
          speaker: barbaik
          text: “让我的搅乳桶全都装满吧，再把洗好的湿衣裳晾到树篱上。”
        - id: ch02-b08
          speaker: narrator
          text: 说完，她便不用再想这两件事。要是黑麦面包难烤，炉子又迟迟不热，她也只要低声念上一句。
        - id: ch02-b09
          speaker: barbaik
          text: “两个钟头以后，我要看见六条面包摆在面包箱上面的搁板上。”
        - id: ch02-b10
          speaker: narrator
          text: 两个钟头一到，六条面包果然摆在那里。要是她嫌路上泥泞，不想走那么远去莫尔莱赶集，前一天晚上还会大声说出更长的愿望。
        - id: ch02-b11
          speaker: barbaik
          text: “我该已经从莫尔莱回来了呀！奶罐已经卖空，黄油碗放在罐里，木盘上有一磅野樱桃，赚来的钱也装进围裙口袋了。”
        - id: ch02-b12
          speaker: narrator
          text: 第二天一起床，空奶罐果真立在床脚，黄油碗就在里面。木盘盛着黑樱桃，围裙口袋里还有六枚新银币。巴尔拜克把所有功劳都算在杰居身上。到了后来，连心里想一想，她也觉得离不开他。
        - id: ch02-b13
          speaker: narrator
          text: 湖中精灵见时机成熟，便叫杰居去求婚。这回巴尔拜克没有粗鲁地转身离开，而是耐心听完。杰居在她眼里依旧又丑又笨，可这个丈夫一定很有用。她可以像小姐一样，天天睡到早饭上桌。至于白天，她想做的事太多，只怕一天还不够长。她会穿上随愿望出现的华美衣裳，到邻居家串门，叫她们嫉妒得要命，还能想跳多少舞就跳多少舞。杰居会一直替她干活，替她攒钱，照看所有事情。
        - id: ch02-b14
          speaker: narrator
          text: 于是，她摆出教养良好的样子，说婚事全听父亲安排。她明明知道，老里乌已经说过许多次，自己去世以后，再没有谁比杰居更能把农庄经营好。

    - id: ch03
      title: 婚后的真相
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二个月，巴尔拜克嫁给了杰居。几天后，老里乌突然去世，农庄里的一切都落到杰居肩上。没有老主人在，原先容易的事情忽然样样难办。好在湖中精灵又来帮忙。他一个抵得上十个雇工，犁地、播种、收割，样样都做。
        - id: ch03-b02
          speaker: narrator
          text: 活儿若是赶得急，精灵还会叫朋友来。天刚发亮，田野里就有一群小矮人忙碌，有的拿锄，有的拿叉，有的挥镰。等普通人起床时，活儿早已做完，小矮人也一个不见了。精灵要的报酬，始终只有一碗肉汤。
        - id: ch03-b03
          speaker: narrator
          text: 可巴尔拜克从成婚那天就发现，过去一连几星期、几个月替她做好的那些事情全停了。她又惊讶又愤怒，责怪杰居懒惰。杰居只是瞪着她，压根儿听不懂她在抱怨什么。湖中精灵站在一旁，忍不住大笑起来。
        - id: ch03-b04
          speaker: brownie
          text: “原来你说的是那些事！那都是我为了杰居才替你做的。如今我还有别的活儿要忙，你也早该自己照管家里了。”
        - id: ch03-b05
          speaker: narrator
          text: 巴尔拜克气坏了。每天清晨，她不得不在天亮前起床，挤完牛奶再去赶集。每天夜里，她又得熬到半夜，把黄油搅出来。湖中精灵先让她盼着过上轻松享乐的日子，如今却把一切收回，她心里装满了怒火。再看杰居的红脸、斜眼和乱糟糟的头发，她的怒气便加了一倍。
        - id: ch03-b06
          speaker: barbaik
          text: “都怪你这个可恶的小矮人！没有你，我绝不会嫁给那个男人。现在我本该还在舞会上，小伙子们会送我坚果和樱桃，还会说我是全教区最美的姑娘。可如今，只有丈夫能送我东西，我也只能跟丈夫跳舞。我永远都不会原谅你！”
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 巴尔拜克嘴上虽凶，需要帮忙时，却最懂得把傲气收起来。有人请她参加一场婚礼，她就去求精灵弄匹马，让她骑去赴宴。精灵竟答应了，还叫她到小矮人的城里，把自己想要的东西一项项说清楚。
        - id: ch03-b08
          speaker: narrator
          text: 巴尔拜克满怀期待地上了路。小矮人的城市并不远。到了那里，她看见他们正在一片宽阔的绿地上商议事情，便兴冲冲地径直走上前去。
        - id: ch03-b09
          speaker: barbaik
          text: “朋友们，听我说！请借给我一匹黑马。它得有眼睛、嘴巴、耳朵，还要有缰绳和马鞍。”
        - id: ch03-b10
          speaker: narrator
          text: 她才说完，黑马便出现在眼前。巴尔拜克立刻跨上马背，朝举行婚礼的村子走去。她讨厌每天那些做不完的活计，如今总算能丢开它们，痛痛快快放一天假。她一路只顾高兴，什么异样也没有留心。
        - id: ch03-b11
          speaker: narrator
          text: 可一路上，行人一看见她的马就笑。她正纳闷，终于听清一个男人在对同伴打趣。
        - id: ch03-b12
          speaker: passerby
          text: “快看哪，农庄主太太把马尾巴卖掉了！”
        - id: ch03-b13
          speaker: narrator
          text: 巴尔拜克回头一瞧，马果真没有尾巴。她只记得要眼睛、嘴巴、耳朵、缰绳和马鞍，偏偏忘了说尾巴。坏心眼的小矮人完全照她的话办，一样不多给。
        - id: ch03-b14
          speaker: barbaik
          text: “算了，反正很快就能到了。”
        - id: ch03-b15
          speaker: narrator
          text: 她抖动缰绳，想催马飞奔。可那匹马只肯一步一步慢慢走，无论如何也不肯加快。一路上，人们拿她说的每句笑话，她只好全听着。傍晚回到农庄，她比先前更生气，决心一有机会便找湖中精灵报仇。这个机会很快就来了。

    - id: ch04
      title: 谷仓里的报复
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那时正是春天，小矮人一年一度的庆典快到了。湖中精灵来问杰居，能不能带朋友们到大谷仓里吃晚饭，再在那里跳舞。杰居一直想报答精灵，自然满口答应。
        - id: ch04-b02
          speaker: narrator
          text: 他吩咐巴尔拜克把最好的桌布铺进谷仓，多做小面包和薄饼，还要留下当天早晨挤出的全部牛奶。他知道妻子恨小矮人，还以为她会拒绝。可巴尔拜克一句话也没说，照吩咐备好了晚餐。
        - id: ch04-b03
          speaker: narrator
          text: 一切准备停当，小矮人们穿着崭新的绿衣，欢欢喜喜地拥进来，在桌边坐下。才一转眼，他们全都惨叫着跳了起来，又尖声喊着往外逃。巴尔拜克在他们脚下藏了一盘盘烧红的炭，把那些可怜的小脚趾全烫伤了。
        - id: ch04-b04
          speaker: barbaik
          text: “这一下，够你们记上好一阵子了。”
        - id: ch04-b05
          speaker: narrator
          text: 她阴沉沉地笑着。可没过片刻，小矮人们便抱着大罐的水回来了。他们把水泼上炭火，随后手拉起手，绕着火堆跳舞，一同唱了起来。
        - id: ch04-b06
          speakers: [brownie, dwarf_two, dwarf_three]
          ensemble: chorus
          text: “里乌太太，狠心肠，烫伤我们小脚掌。从此离开你家门，厄运缠住你们一家人。”

    - id: ch05
      title: 精灵离去以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 就在那天晚上，小矮人们离开这里，从此再也没有回来。失去他们相助，杰居一天比一天穷，最后在困苦中死去。至于巴尔拜克，她后来能在莫尔莱的集市上找到一份活儿，竟也觉得庆幸了。
        - id: ch05-b02
          speaker: narrator
          text: 这个故事选自E.苏韦斯特的《布列塔尼炉边故事》。
