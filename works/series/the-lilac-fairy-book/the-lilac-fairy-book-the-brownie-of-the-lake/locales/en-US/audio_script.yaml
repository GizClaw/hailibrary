  chapters:
    - id: ch01
      title: The Frog in the Reeds
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time in France, there lived a man named Jalm Riou. He had a large farm, plenty of money, and a daughter named Barbaik. With all that, no man could have been happier. Barbaik was the finest dancer in the countryside and dressed better than any other girl. On holidays she wore an embroidered cap, five petticoats that grew shorter layer by layer, and shoes with silver buckles. The women whispered about her, but Barbaik did not care. Her clothes were the finest, and she always had the most partners.
        - id: ch01-b02
          speaker: narrator
          text: Many young men wanted to marry her. None wanted it more than Jegu, her father's head farmhand. But Jegu was very ugly, and his manners were rough. Barbaik wanted nothing to do with him. Worse still, she often joined the others in making fun of him.
        - id: ch01-b03
          speaker: narrator
          text: Jegu heard about it, of course, and it made him miserable. Still, he would not leave the farm. He could easily have looked for work elsewhere, but then he would never see Barbaik at all. To him, what was life worth without that?
        - id: ch01-b04
          speaker: narrator
          text: One evening, Jegu was leading the horses home from the fields. On the way, he stopped beside a little lake so they could drink. He was tired after his long day's work. With one hand resting on a horse's mane, he waited for the animals to finish and spent the whole time thinking about Barbaik. Then a voice called to him from the nearby gorse.
        - id: ch01-b05
          speaker: brownie
          text: What's troubling you, Jegu? Don't give up yet.
        - id: ch01-b06
          speaker: narrator
          text: Jegu looked up in surprise and asked who was there.
        - id: ch01-b07
          speaker: brownie
          text: It's me, the brownie of the lake.
        - id: ch01-b08
          speaker: jegu
          text: But where are you?
        - id: ch01-b09
          speaker: brownie
          text: Look carefully among the reeds. I'm the little green frog. I can take any shape I please. I can even turn invisible, and that's much harder.
        - id: ch01-b10
          speaker: jegu
          text: Then let me see the shape your family usually wears.
        - id: ch01-b11
          speaker: brownie
          text: Certainly, if that's what you want.
        - id: ch01-b12
          speaker: narrator
          text: The frog leaped onto a horse's back and changed into a tiny dwarf dressed from head to foot in green. The sight frightened Jegu, and he drew back. The brownie told him there was nothing to fear. He would never hurt him. In fact, he hoped Jegu might find him useful.
        - id: ch01-b13
          speaker: jegu
          text: Why would you care what happens to me?
        - id: ch01-b14
          speaker: brownie
          text: Because you helped me last winter, and I've never forgotten it. The spiteful fairies from the White Corn country declared war on my people because they say we're friends to human beings. We had to flee far away and hide as animals at first. Later, we kept changing shapes partly from habit and partly for amusement. That's how I came to know you.
        - id: ch01-b15
          speaker: jegu
          text: How did that happen?
          emotion: surprised
        - id: ch01-b16
          speaker: brownie
          text: Three months ago, when you were digging beside the river, did you find a robin caught in a net?
        - id: ch01-b17
          speaker: jegu
          text: Yes, I remember. I opened the net and set it free.
        - id: ch01-b18
          speaker: brownie
          text: I was that robin. I vowed then to be your friend. Since you want to marry Barbaik, I'll prove it by helping you win her.
        - id: ch01-b19
          speaker: jegu
          text: Little brownie, if you can do that, I'll give you anything but my soul.
        - id: ch01-b20
          speaker: brownie
          text: Leave it all to me. In a few months, you'll be master of both the farm and Barbaik.
        - id: ch01-b21
          speaker: jegu
          text: But how will you manage it?
        - id: ch01-b22
          speaker: brownie
          text: That's my concern. Perhaps I'll tell you later. For now, eat, sleep, and don't worry about a thing.
        - id: ch01-b23
          speaker: narrator
          text: Jegu declared that nothing could be easier. Then he took off his hat, thanked the little dwarf with all his heart, and led the horses back to the farm.
    - id: ch02
      title: Wishes at the Spring
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning was a holiday. Barbaik woke earlier than usual so she could finish her chores before leaving for a dance some distance away. She went first to clean the cowhouse. To her amazement, someone had already laid fresh straw, filled the racks with hay, milked the cows, and set the pails in a neat row.
        - id: ch02-b02
          speaker: narrator
          text: Barbaik decided Jegu must have done it in hopes of earning a dance with her. When she met him outside the door, she stopped and thanked him for helping. Jegu answered roughly that he had no idea what she was talking about. But Barbaik took that denial as proof. She became more certain than ever that no one else could have done it.
        - id: ch02-b03
          speaker: narrator
          text: The same thing happened every day. The cowhouse had never been cleaner, and the cows had never been fatter. Morning and evening, Barbaik found her earthen pots full of milk. Beside them sat a whole pound of freshly churned butter decorated with leaves. After a few weeks, this wonderful state of affairs no longer surprised her. She grew used to it and stayed in bed until the last moment, getting up only in time to make breakfast.
        - id: ch02-b04
          speaker: narrator
          text: Soon she did not even have to make breakfast. One morning she came downstairs to find the whole house swept, every piece of furniture polished, the fire burning, and the food ready. Her only task was to ring the great bell that called the laborers in from the fields to eat. She gave Jegu the credit again. A husband like that, she thought, could be very useful to a girl who preferred lying in bed and amusing herself.
        - id: ch02-b05
          speaker: narrator
          text: After that, Barbaik only had to speak a wish and it came true. When cold wind or hot sun threatened her complexion, she ran to the nearby spring and spoke softly.
        - id: ch02-b06
          speaker: barbaik
          text: I want my churns filled and my wet linen spread along the hedge to dry.
        - id: ch02-b07
          speaker: narrator
          text: Then she could forget the work completely. If the rye dough felt too hard to bake, or the oven was too slow to heat, she murmured another wish.
        - id: ch02-b08
          speaker: barbaik
          text: I want my six loaves sitting on the shelf above the bread box.
        - id: ch02-b09
          speaker: narrator
          text: Two hours later, all six loaves sat on the shelf. And when she felt too lazy to walk the long, dirty road to market, she announced her wish aloud the night before.
        - id: ch02-b10
          speaker: barbaik
          text: Why can't I be home from Morlaix already, with my milk pot empty, my butter bowl inside it, a pound of wild cherries on my wooden plate, and my earnings in my apron pocket?
        - id: ch02-b11
          speaker: narrator
          text: In the morning, the empty milk pot stood at the foot of her bed with the butter bowl tucked inside. The black cherries lay on the wooden plate, and six new pieces of silver waited in her apron pocket. Barbaik believed Jegu was responsible for every bit of it. She had grown so used to having her wishes obeyed that before long, she could not do without him even in her thoughts.
        - id: ch02-b12
          speaker: narrator
          text: At that point, the brownie told Jegu it was time to ask her again. This time Barbaik did not turn rudely away. She listened patiently until he finished. In her eyes, he was still as ugly and awkward as ever, but he would be an extremely useful husband. She could sleep until breakfast like a young lady, and even a whole day would scarcely hold everything she planned to enjoy. Beautiful dresses would appear whenever she wished for them. She could visit neighbors who would be dying of envy and dance as often as she liked. Jegu would always be there to work for her, save for her, and watch over her.
        - id: ch02-b13
          speaker: narrator
          text: So Barbaik answered as a well-brought-up daughter should. She said the choice belonged to her father and that she would do whatever pleased him. But she already knew what his answer would be. Old Riou had often said that when he was gone, there was no one as capable as Jegu of carrying on the farm.
    - id: ch03
      title: The Truth after the Wedding
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They married the following month. A few days later, old Riou died quite suddenly. Jegu now had every part of the farm to oversee by himself, and somehow the work did not seem nearly as easy as it had while the old farmer was alive. Once again the brownie came to his aid. He was better than ten laborers. He plowed, sowed, and harvested. Whenever a job had to be finished in a hurry, he called in some of his friends. As soon as daylight appeared, a host of little green dwarfs could be seen across the fields, hard at work with hoes, forks, and sickles. By the time ordinary people were up and about, everything was finished and the little workers had disappeared.
        - id: ch03-b02
          speaker: narrator
          text: For all that work, the only payment the brownie ever asked for was a bowl of broth. Barbaik, meanwhile, had noticed something from the very day of her marriage. All the tasks that had once done themselves had stopped. Surprise quickly turned to rage. She complained bitterly to Jegu about his laziness. He only stared at her because he did not understand what she meant. The brownie, who was standing nearby and heard it all, burst out laughing.
        - id: ch03-b03
          speaker: brownie
          text: I did all those favors, not Jegu. I did them for his sake. Now I have other work to do, and it's time you took care of your own house.
        - id: ch03-b04
          speaker: narrator
          text: Barbaik was furious. Every morning she had to rise before dawn, milk the cows, and make the trip to market herself. Every night she had to sit up until midnight to finish churning the butter. Through all those long hours, her heart was full of rage against the brownie who had led her to expect an easy life filled with pleasure. Then she would look at Jegu's red face, crossed eyes, and untidy hair, and her anger would double.
        - id: ch03-b05
          speaker: barbaik
          text: If it weren't for you, you miserable dwarf, I never would have married that man! I would still be going to dances. Young men would bring me nuts and cherries and tell me I was the prettiest girl in the parish. Now I can receive presents only from my husband, and I can dance only with my husband. Oh, you wretched dwarf, I will never forgive you. Never!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: Her words were fierce, but no one knew better than Barbaik how to swallow her pride when it suited her. An invitation to a wedding arrived, and she badly wanted to go. So she begged the brownie to find her a horse to ride. To her great delight, he agreed. He told her to visit the city of the dwarfs and tell them precisely what she wanted.
        - id: ch03-b07
          speaker: narrator
          text: Barbaik hurried off, full of excitement. The journey was short. When she reached the city, the dwarfs were holding council in a broad green space. She went straight to them.
        - id: ch03-b08
          speaker: barbaik
          text: Listen, my friends. Please lend me a black horse with eyes, a mouth, ears, a bridle, and a saddle.
        - id: ch03-b09
          speaker: narrator
          text: The moment she finished speaking, the horse appeared. Barbaik mounted and rode toward the village where the wedding was being held. At first she was so delighted to have a holiday from the work she hated that she noticed nothing else. Before long, though, it struck her as strange that people all along the busy roads laughed whenever they looked at her horse. At last, she caught the words of one man speaking to another.
        - id: ch03-b10
          speaker: passerby
          text: Look there! The farmer's wife must have sold her horse's tail!
        - id: ch03-b11
          speaker: narrator
          text: Barbaik twisted around in the saddle. It was true. Her horse had no tail. She had forgotten to ask for one, and the wicked dwarfs had followed her instructions exactly.
        - id: ch03-b12
          speaker: barbaik
          text: Well, at least I'll be there soon.
        - id: ch03-b13
          speaker: narrator
          text: She shook the reins and tried to make the horse gallop. It was no use. The animal refused to move faster than a walk. Barbaik had to listen to every joke people made about her for the rest of the way. She returned to the farm that evening angrier than ever. By then, she was fully determined to take revenge on the brownie whenever she found the chance. That chance came very soon.
    - id: ch04
      title: The Dwarfs' Feast
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Spring had come, and it was just the season when the dwarfs held their festival. One day, the brownie asked Jegu for permission to bring his friends to supper in the great barn and let them dance there afterward. Jegu was only too pleased to do anything for the brownie. He ordered Barbaik to spread her finest tablecloths in the barn, bake a great quantity of little loaves and pancakes, and save every drop of milk the cows gave that morning.
        - id: ch04-b02
          speaker: narrator
          text: Jegu expected Barbaik to refuse. He knew perfectly well how much she hated the dwarfs and thought she would never agree to serve them. But she said nothing at all. She laid the tables, baked the food, saved the milk, and prepared the supper exactly as he had ordered.
        - id: ch04-b03
          speaker: narrator
          text: When everything was ready, the dwarfs bustled in wearing brand-new green suits. They were happy and merry as they took their places around the table. But in the very next moment, every one of them sprang up with a cry and ran away screaming. Barbaik had hidden pans of hot coals beneath their feet, and all their poor little toes were burned.
        - id: ch04-b04
          speaker: barbaik
          text: You won't forget that in a hurry.
        - id: ch04-b05
          speaker: narrator
          text: Barbaik smiled grimly to herself. She was sure they would remember her revenge. But almost at once, the dwarfs came back carrying great pots of water. They poured the water over the burning coals. Then they joined hands and danced in a ring around the drowned fire as they sang.
        - id: ch04-b06
          speakers: [brownie, dwarf_two, dwarf_three]
          ensemble: chorus
          text: Wicked traitor, Barne Riou, you have burned our poor toes through. Now we hurry from your hall. May bad luck fall upon you all.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: That very evening, the dwarfs left the country forever. Without their help, Jegu grew poorer and poorer until at last he died of misery.
        - id: ch04-b08
          speaker: narrator
          text: Barbaik was glad to find work in the market at Morlaix.
