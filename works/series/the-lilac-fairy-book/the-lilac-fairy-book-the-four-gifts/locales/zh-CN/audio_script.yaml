audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    barbaik:
      display_name: 巴尔拜克
      tts:
        delivery: 精明强硬，谈到钱财时急切刻薄
        timbre: 粗硬低沉的成年女声
        pace: 适中偏快
        pitch: 中低
    tephany:
      display_name: 特法妮
      tts:
        delivery: 善良率真，受苦时克制，醒悟后坚定
        timbre: 清澈柔和的年轻女声
        pace: 适中
        pitch: 中高
    denis:
      display_name: 德尼
      tts:
        delivery: 年轻自负，谈论自己时兴致勃勃，逐利时直白
        timbre: 明亮结实的年轻男声
        pace: 适中
        pitch: 中
    fairy:
      display_name: 仙女
      tts:
        delivery: 看似衰弱却洞悉人心，温和中带一点戏谑
        timbre: 苍老而清晰的女声
        pace: 舒缓
        pitch: 中低
    neighbor_1:
      display_name: 邻人甲
      tts:
        delivery: 爱议论，话中带着讥讽
        timbre: 清楚的成年女声
        pace: 适中偏快
        pitch: 中
    neighbor_2:
      display_name: 邻人乙
      tts:
        delivery: 爱议论，随声附和而尖刻
        timbre: 略显尖细的成年女声
        pace: 适中偏快
        pitch: 中高
    young_lord:
      display_name: 年轻贵族
      tts:
        delivery: 骄纵自信，把自己的意愿视作理所当然
        timbre: 华亮有力的年轻男声
        pace: 适中
        pitch: 中
    portress:
      display_name: 守门修女
      tts:
        delivery: 冷淡粗厉，不耐烦地赶走来客
        timbre: 干涩的成年女声
        pace: 适中偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 铜针
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 古老的布列塔尼，从前也叫康沃尔。那里有个女人名叫巴尔拜克·布里斯，和侄女特法妮一起经营农场。从清早到夜晚，人们总能在田间或乳品房看见她们，挤奶、做黄油、喂家禽。她们自己不停手，也盯着别人干活，不许任何人偷懒。巴尔拜克从不给自己留一点休息和思量的工夫，渐渐竟把钱财本身看得比什么都重。她只肯让自己和特法妮吃最少不了的食物，穿最少不了的衣服。她尤其痛恨穷人，总说那种懒虫根本不配活在世上。
        - id: ch01-b02
          speaker: narrator
          text: 一天，她发现特法妮在牛棚外和年轻的德尼说话。德尼是普洛韦村的短工，按天领工钱。巴尔拜克怒火中烧，一把攥住侄女的胳膊，把她狠狠扯开。
        - id: ch01-b03
          speaker: barbaik
          text: “你也不害臊！这人穷得像只耗子，你却把时间浪费在他身上。只要你愿意，多的是小伙子抢着给你买银戒指！”
          emotion: angry
        - id: ch01-b04
          speaker: tephany
          text: “德尼活干得好，您明明知道。他也在攒钱，很快就能租一座农场，自己当家。”
          emotion: angry
        - id: ch01-b05
          speaker: barbaik
          text: “胡说！他活到一百岁也攒不够。我宁愿看着你进坟墓，也不许你嫁给一个把全部家当背在身上的穷鬼。”
          emotion: angry
        - id: ch01-b06
          speaker: tephany
          text: “只要年轻又有力气，家当多不多有什么要紧？”
        - id: ch01-b07
          speaker: barbaik
          text: “钱财竟然不要紧？你真蠢到瞧不起钱了吗？若是德尼教会你这种话，从今以后不许你再理他。他敢再来农场，我就叫人赶他走。现在去把衣服洗了，再摊开晾好！”
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 特法妮不敢违抗，只得沿着小路走向河边，心里像压了一块沉甸甸的石头。
        - id: ch01-b09
          speaker: tephany
          text: “姨妈比石头还硬，硬上一千倍。雨水久了，还能把石头磨掉一点。我就算哭一辈子，她也不会心软。和德尼说话是我唯一的快乐。不能见他，我还不如进修道院。”
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 特法妮一路想着姨妈的狠心，终于来到河岸。她解开那一大包待洗的床单和衣物，正准备动手，忽然听见手杖笃笃敲地。这个声音让她抬起头来，只见面前站着一个从没见过的小老太婆。
        - id: ch01-b11
          speaker: tephany
          text: “老奶奶，您要坐下歇一会儿吗？”
        - id: ch01-b12
          speaker: narrator
          text: 特法妮一边问，一边把包袱挪开，给她腾出地方。
        - id: ch01-b13
          speaker: fairy
          text: “一个人若只有天空可以遮头，想在哪里歇脚都行。”
        - id: ch01-b14
          speaker: tephany
          text: “您一直孤零零的吗？难道没有朋友愿意请您进屋？”
        - id: ch01-b15
          speaker: narrator
          text: 老太婆摇了摇头。
        - id: ch01-b16
          speaker: fairy
          text: “他们早就死了，已经死去很久很久。如今肯把我当朋友的，只有心地善良的陌生人。”
        - id: ch01-b17
          speaker: narrator
          text: 特法妮沉默片刻，把自己午饭吃的小面包和咸猪肉递了过去。
        - id: ch01-b18
          speaker: tephany
          text: “这些给您。至少今天，您能好好吃一顿。”
        - id: ch01-b19
          speaker: narrator
          text: 老太婆接过食物，久久望着她。
        - id: ch01-b20
          speaker: fairy
          text: “肯帮助别人，就该有人来帮助你。吝啬的巴尔拜克不许你同普洛韦来的小伙子说话，你的眼睛才会哭得这样红。别难过，你是个好姑娘。我送你一件东西，让你每天都能见他一回。”
        - id: ch01-b21
          speaker: tephany
          text: “您怎么会知道？”
          emotion: surprised
        - id: ch01-b22
          speaker: narrator
          text: 女乞丐竟知道她所有的事，特法妮惊呆了，可老太婆只顾往下说。
        - id: ch01-b23
          speaker: fairy
          text: “收好这根长铜针。你一把它别上衣服，布里斯大娘就得出门，到田里数卷心菜。针还在身上，你就是自由的。等它回到盒里，你姨妈才会回来。”
        - id: ch01-b24
          speaker: narrator
          text: 老太婆说完便站起身，朝特法妮点点头，忽然消失了。特法妮像石头一样呆立在原地。要不是那根铜针还握在手中，她准以为自己做了一场梦。正因为有这件信物，她才明白送来礼物的不是寻常老妇，而是一位能预知未来的仙女。随后她忽然瞥见那包待洗的衣物，想起已经耽误许久，赶紧使足力气洗了起来。

    - id: ch02
      title: 羽毛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天傍晚，又到了德尼照例等在牛棚阴影里的时候。特法妮把铜针别上衣服。就在同一刻，巴尔拜克拿起那双萨博木鞋，穿过果园，径直走向田里种卷心菜的那块地。特法妮脚步轻快，心也一样轻快。她跑出屋子，同德尼欢欢喜喜地过了一晚。许多天里，铜针都这样帮助她。可是终于有一天，她渐渐察觉到一件叫人伤心的事。
        - id: ch02-b02
          speaker: narrator
          text: 起初，两个人都觉得相聚的时间过得飞快。可德尼教完了自己会唱的所有歌曲，又把发财和成为大人物的计划从头到尾说尽，便再也没话可讲了。他和许多人一样，只爱自己说，不肯听别人说。有时他甚至根本不来，第二晚才推说不得不进城办事。特法妮从来不责怪他，心里却没有受骗。她看得明明白白，德尼已经不像从前那样在乎她了。
        - id: ch02-b03
          speaker: narrator
          text: 她的心越来越沉，脸色越来越白。一天傍晚，她又没等到德尼，只好扛起水罐，慢慢走向泉边。送她铜针的仙女站在路上，瞧了她一眼，淘气地笑起来。
        - id: ch02-b04
          speaker: fairy
          text: “我的漂亮姑娘想见情郎就见情郎，怎么看上去还不如从前快活？”
        - id: ch02-b05
          speaker: tephany
          text: “他已经厌倦我了，总找借口躲开。老奶奶，光能见到他还不够。我得会逗他开心，把他留在身边。他那么聪明，求您也让我变聪明吧。”
          emotion: sad
        - id: ch02-b06
          speaker: fairy
          text: “你要的是聪明吗？好，把这根羽毛插在头发里，你就会像所罗门王一样有智慧。”
        - id: ch02-b07
          speaker: narrator
          text: 特法妮高兴得脸颊发红。她回家把羽毛插进蓝丝带里，当地姑娘一向都这样打扮。不一会儿，外面传来德尼快活的口哨。姨妈还安安稳稳地数着卷心菜，她便赶去相会。这一次，她的话叫德尼惊得说不出声。世上仿佛没有她不懂的事。布列塔尼各地的歌，她全会唱，还能当场编出新歌。德尼简直怀疑，眼前的人还是不是那个安静的姑娘。她从前总急着学会他能教的一切，现在却像是换了个人。她或许突然疯了，身体里还住进了恶灵。无论如何，德尼依旧夜夜回来，却发现她每一晚都比前一晚更加聪明。
        - id: ch02-b08
          speaker: narrator
          text: 邻人很快也议论起来。特法妮忍不住戴着羽毛，去见那些嫌她衣着寒酸的人，还编出许多笑话取笑他们。那些人听见后都摇着头。
        - id: ch02-b09
          speakers: [neighbor_1, neighbor_2]
          ensemble: duo
          text: “她就是一只刻薄的小母猫。谁娶了她，谁就会发现，握缰绳、赶马车的人准是她！”
        - id: ch02-b10
          speaker: narrator
          text: 德尼没过多久也赞同了。他无论去哪里，都要自己做主。特法妮的嘴太厉害，叫他渐渐害怕。她从前取笑别人，他会发笑。如今他却涨红脸，浑身不自在，总担心下一个就轮到自己。
        - id: ch02-b11
          speaker: narrator
          text: 一天傍晚，德尼说自己片刻也不能留。他答应过别人，要去参加邻村的舞会。特法妮辛苦了一整天，本来只盼着和他安静相处一个钟头。她再三挽留，德尼却不听，她终于恼了。
        - id: ch02-b12
          speaker: tephany
          text: “我知道你为什么非去不可。佩南吕的阿齐莉耶也会参加舞会！”
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 阿齐莉耶是方圆许多英里内最美的姑娘，和德尼自幼相识。
        - id: ch02-b14
          speaker: denis
          text: “不错，她会去。为了看阿齐莉耶跳舞，走再远的路也值得。”
        - id: ch02-b15
          speaker: narrator
          text: 德尼看见特法妮吃醋，心里很得意。
        - id: ch02-b16
          speaker: tephany
          text: “那你去吧！”
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: 她回到屋里，砰的一声甩上门，独自坐在火边，盯着红红的余烬。她扯下羽毛，双手捂住脸，痛哭起来。
        - id: ch02-b18
          speaker: tephany
          text: “男人想要的是美貌，聪明有什么用？我早该求自己变美。可惜已经晚了，德尼再也不会回来。”
          emotion: sad

    - id: ch03
      title: 项链
      blocks:
        - id: ch03-b01
          speaker: fairy
          text: “既然你那么想要美貌，我就把它送给你。”
        - id: ch03-b02
          speaker: narrator
          text: 特法妮转过头，只见老太婆拄着手杖站在身旁。
        - id: ch03-b03
          speaker: fairy
          text: “把这串项链扣在脖子上。只要戴着它，你便是全世界最美的女人。”
        - id: ch03-b04
          speaker: narrator
          text: 特法妮欢喜地轻叫一声，接过项链扣好，跑到屋角照镜子。这一回，她再也不怕阿齐莉耶，也不怕任何姑娘。谁还能像她这样美丽白皙呢？镜中的脸让她有了主意。她匆忙换上最好的衣裙，穿好带扣皮鞋，赶往舞会。
        - id: ch03-b05
          speaker: narrator
          text: 半路上，一辆华美的马车迎面而来，车中坐着一位年轻人。
        - id: ch03-b06
          speaker: young_lord
          text: “好美的姑娘！我的国家里没有一个人能与她相比。她必须做我的新娘，别人都不成！”
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 马车堵住了狭窄的道路。特法妮虽然万般不愿，也只能停下。她直视年轻人的双眼。
        - id: ch03-b08
          speaker: tephany
          text: “高贵的老爷，您走您的路，让我也走自己的路。我只是穷苦的农家姑娘，只会挤奶、割干草和纺线。”
        - id: ch03-b09
          speaker: young_lord
          text: “你如今是农家姑娘，我却能把你变成贵妇人。”
        - id: ch03-b10
          speaker: narrator
          text: 他拉住特法妮的手，要领她上车。
        - id: ch03-b11
          speaker: tephany
          text: “我不想当贵妇人。我只愿做德尼的妻子。”
        - id: ch03-b12
          speaker: narrator
          text: 她甩开那只手，奔向道路与麦田之间的沟渠，想藏进田里。年轻人看破了她的打算，向随从示意。随从们立即抓住她，把她塞进车厢。车门砰然关上，马匹受鞭，疾驰而去。
        - id: ch03-b13
          speaker: narrator
          text: 一个钟头后，马车抵达一座富丽堂皇的城堡。特法妮坐着不肯动，随从便把她抬下车，扛进大厅。年轻人还派人去请神父，好立刻举行婚礼。他不停地许诺，做了他的妻子便能拥有各种漂亮东西，想哄特法妮露出笑容。可她一句也没听，只顾打量四周，寻找逃走的办法。那实在不容易。三扇大门全都闩得死死的，来时经过的门还带着弹簧锁。幸好羽毛仍在发间。凭着它的智慧，她发现木护墙上有道细小的裂缝，里面隐约透出一缕微光。她碰了碰别住衣裙的铜针。大厅里所有人马上都去数卷心菜了，她便穿过藏在护墙后的小门，根本不知道它通向哪里。
        - id: ch03-b14
          speaker: narrator
          text: 夜已经深了，特法妮疲惫不堪。她走到一座修道院门前，庆幸终于有地方可以投宿。
        - id: ch03-b15
          speaker: tephany
          text: “请问能让我在这里住到天亮吗？”
        - id: ch03-b16
          speaker: portress
          text: “这里不是收留乞丐的地方。快走！”
        - id: ch03-b17
          speaker: narrator
          text: 可怜的姑娘拖着沉重的脚步，沿路慢慢走下去。一盏灯火和几声狗吠告诉她，前面有一座农场。屋前聚着一群人，有两三个女人，还有农场主的几个儿子。农场主的妻子听见她只求一张床过夜，心便软了，正要请她进屋。那几个年轻人却被她的美貌迷昏了头，争着要为她做得最多，吵着吵着便动起手来。女人们被这场骚乱吓坏了，转而把一连串难听的骂名全砸向特法妮。
        - id: ch03-b18
          speaker: narrator
          text: 特法妮沿最近的小路逃进树林，想借夜色甩掉他们，可追赶的脚步转眼就到了身后。她吓得两腿发抖，忽然想起项链，便用尽力气扯断搭扣，套在沟里一头哼哼叫的猪脖子上。脚步声立刻离开她，追那头猪去了。项链一落下，她那迷人的美貌也随之消失。
        - id: ch03-b19
          speaker: narrator
          text: 她茫然地继续走，连自己正去往哪里也不知道。走着走着，她忽然发现姨妈的屋子就在附近，不禁又惊讶又欢喜。接下来的几天，她始终又累又苦，每天的活计几乎都撑不下来。更糟的是，德尼也很少到她身边来了。
        - id: ch03-b20
          speaker: denis
          text: “我事情多得很。只有富人才有空把时间浪费在闲聊上。”

    - id: ch04
      title: 珍珠
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 日子一天天过去，特法妮的脸色越来越苍白，人人看得见，唯独姨妈毫无察觉。水罐如今沉得几乎让她扛不动，可每天早晚，她仍要走到泉边打水。有时单是把罐子提上肩膀，便几乎耗尽了她所有力气。一天黄昏，她照常走下去，一路低声对自己说话。
        - id: ch04-b02
          speaker: tephany
          text: “我怎么这样傻？我不该求随时都能见德尼，因为他很快便厌了我。我也不该求伶俐的口才，因为他会害怕。美貌更不该求，它只给我带来灾祸。我该求财富。有了钱，我和别人都能过得轻松些。要是我敢再向仙女开口，这一次一定能选对。”
          emotion: sad
        - id: ch04-b03
          speaker: fairy
          text: “放心吧。回家后摸摸右边的衣袋，里面有一只小盒子。用盒里的药膏擦眼睛，你会看见，自己身上本来就藏着无价之宝。”
        - id: ch04-b04
          speaker: narrator
          text: 声音仿佛就在特法妮的肘边，老太婆本人却看不见。特法妮完全不懂这句话究竟是什么意思，还是飞快地跑回农场，欢欢喜喜地伸手摸索右边衣袋。小盒子果然在那里，里面也装着仙女所说的珍贵药膏。她正要把药膏抹上眼睛，巴尔拜克·布里斯突然走进房间。
        - id: ch04-b05
          speaker: narrator
          text: 自从巴尔拜克总得丢下手里的活计，不知不觉跑去数卷心菜，农场里便事事不顺。她始终不明白自己为什么非去不可，心里越来越恼火。偏偏她脾气太坏，一个短工也不肯留下来帮忙。如今看见侄女安安静静地站在镜子前，她顿时爆发了。
        - id: ch04-b06
          speaker: barbaik
          text: “原来我去田里时，你就在做这种事！难怪农场快毁了。丫头，你这样懒散，难道不害臊吗？”
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 特法妮结结巴巴地想解释，巴尔拜克却气得近乎发狂，抬手就打了她一记耳光。特法妮又委屈，又迷茫，情绪再也压不住。她转过脸，放声哭了。可是每一滴眼泪落下来，都变成一颗浑圆明亮的珍珠。巴尔拜克看见这个奇迹，惊叫着跪到地上，把珍珠一颗颗捡起来。
        - id: ch04-b08
          speaker: narrator
          text: 她还没捡完，房门便开了。德尼走进屋，也跪了下来。
        - id: ch04-b09
          speaker: denis
          text: “珍珠！这些当真全是珍珠吗？”
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: 他抬头一看，还有更加美丽的珍珠正从特法妮脸上滚下来。
        - id: ch04-b11
          speaker: barbaik
          text: “千万别让邻居听见，德尼。你当然能分一份，别人却一颗也别想拿。哭吧，亲爱的，接着哭。这也是为你好呀！”
        - id: ch04-b12
          speaker: narrator
          text: 巴尔拜克张开围裙去接珍珠，德尼也捧起帽子，守在特法妮面前。两人贪婪的模样叫姑娘几乎喘不过气。她再也受不了了，只想冲出大厅。巴尔拜克却攥紧她的胳膊，不许她走，还说尽自己能想到的温柔话，只盼姑娘因此哭得更凶。特法妮却拼尽全副力气，硬生生收住眼泪，又把双眼擦干。
        - id: ch04-b13
          speaker: barbaik
          text: “这么快就哭完了？亲爱的，再试试吧。德尼，稍微打她几下，会不会管用？”
        - id: ch04-b14
          speaker: narrator
          text: 德尼摇了摇头。
        - id: ch04-b15
          speaker: denis
          text: “第一次有这些就够了。我进城问问，每颗珍珠究竟值多少钱。”
        - id: ch04-b16
          speaker: barbaik
          text: “我也去。”
        - id: ch04-b17
          speaker: narrator
          text: 巴尔拜克从不信任别人，生怕受到欺骗，于是同德尼一道出门，只把特法妮留在屋里。

    - id: ch05
      title: 最后的选择
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 特法妮静静坐在椅子上，双手紧紧绞在一起，仿佛还在竭力压住什么。过了许久，她终于抬起一直望着地面的眼睛。炉边昏暗的角落里，仙女正带着嘲弄的神情注视她。特法妮浑身一颤，猛然站起，取出羽毛、铜针和药膏盒，一起递给老太婆。
        - id: ch05-b02
          speaker: tephany
          text: “所有东西都在这里，它们本来就是您的。请别让我再看见它们。可是它们教给我的道理，我已经明白了。别人尽管拥有财富、美貌和聪明吧。我只愿做从前那个贫穷的农家姑娘，为自己爱的人努力干活，别的什么也不要。”
        - id: ch05-b03
          speaker: fairy
          text: “不错，你已经懂了。从今以后，你会过上安宁的日子，也会嫁给心爱的人。说到底，你想得到那些礼物，并不是为了自己，而是为了他。”
        - id: ch05-b04
          speaker: narrator
          text: 从那以后，特法妮再也没有见过老太婆。德尼曾想拿她的泪珠去换钱，她最终还是原谅了他。后来，他渐渐成为一个好丈夫，也肯踏踏实实承担属于自己的那份活计。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事选自埃米尔·苏韦斯特的《布列塔尼炉边故事》。
