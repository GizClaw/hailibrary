audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    tephany:
      display_name: Tephany
      tts:
        delivery: earnest, sensitive, and increasingly self-aware
        timbre: light and clear
        pace: conversational
        pitch: medium-high
    barbaik:
      display_name: Barbaik Bourhis
      tts:
        delivery: sharp, forceful, and grasping
        timbre: dry and mature
        pace: brisk
        pitch: medium-low
    denis:
      display_name: Denis
      tts:
        delivery: confident, talkative, and self-important
        timbre: youthful and clear
        pace: conversational
        pitch: medium
    fairy:
      display_name: Old Woman
      tts:
        delivery: knowing, playful, and gently mysterious
        timbre: aged and delicate
        pace: unhurried
        pitch: medium-high
    young_lord:
      display_name: Young Lord
      tts:
        delivery: assured, admiring, and entitled
        timbre: polished and resonant
        pace: measured
        pitch: medium-low
    portress:
      display_name: Convent Portress
      tts:
        delivery: curt, suspicious, and unwelcoming
        timbre: rough and mature
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: Barbaik's Command
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago in Brittany, in a place once called Cornwall, a woman named Barbaik Bourhis lived on a farm with her niece, Tephany. From early morning until late at night, the two worked in the fields and dairy. They milked cows, made butter, fed the fowls, and made sure everyone else kept busy too.
        - id: ch01-b02
          speaker: narrator
          text: Barbaik never left herself time to rest or think of anything beyond the farm. Before long, she loved money simply because it was money. She gave herself and Tephany no more food or clothing than they truly needed. Poor people were even worse in her eyes. She hated them and said the world had no room for such lazy creatures.
        - id: ch01-b03
          speaker: narrator
          text: So you can imagine her anger when she found Tephany outside the cowhouse one day, talking to young Denis. He was only a day laborer from the village of Plover. Barbaik seized her niece by the arm and jerked her away.
        - id: ch01-b04
          speaker: barbaik
          text: Aren't you ashamed of wasting your time on a man as poor as a rat? A dozen others would gladly buy you silver rings if you gave them the chance.
          emotion: angry
        - id: ch01-b05
          speaker: tephany
          text: You know Denis works hard. He saves his money too. Soon he'll have enough to take a farm of his own.
          emotion: angry
        - id: ch01-b06
          speaker: barbaik
          text: Nonsense! He'll be a hundred before he saves enough for a farm. I'd rather see you in your grave than married to a man whose whole fortune is on his back.
          emotion: angry
        - id: ch01-b07
          speaker: tephany
          text: Why should fortune matter when we're young and strong?
        - id: ch01-b08
          speaker: narrator
          text: Barbaik was so shocked that she scarcely let Tephany finish.
        - id: ch01-b09
          speaker: barbaik
          text: Why should fortune matter? Can you truly be foolish enough to scorn money? If Denis taught you that, you are never to speak to him again. If he shows his face here, I'll have him thrown off the farm. Now go wash the clothes and spread them out to dry.
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Tephany did not dare refuse. Heavy-hearted, she took the path down to the river.
        - id: ch01-b11
          speaker: tephany
          text: She's harder than these rocks. Rain can wear stone away in time, but I could cry forever and she still wouldn't care. Talking to Denis is my only pleasure. If I can't see him, I may as well enter a convent.
          emotion: sad
    - id: ch02
      title: The Copper Pin
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Tephany reached the riverbank and began unfolding the great bundle of linen. Then she heard a stick tapping the ground. She looked up and saw a little old woman she had never met.
        - id: ch02-b02
          speaker: tephany
          text: Would you like to sit and rest, Granny? I can move my bundle aside.
        - id: ch02-b03
          speaker: fairy
          text: When the sky is your only roof, you rest wherever you please.
        - id: ch02-b04
          speaker: tephany
          text: Are you all alone, then? Don't you have friends who would welcome you into their homes?
        - id: ch02-b05
          speaker: narrator
          text: The old woman shook her head.
        - id: ch02-b06
          speaker: fairy
          text: They died long, long ago. Now my only friends are kind-hearted strangers.
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: Tephany was silent for a moment. Then she held out the small loaf and bacon meant for her own dinner.
        - id: ch02-b08
          speaker: tephany
          text: Please take these. At least you'll have a good meal today.
        - id: ch02-b09
          speaker: narrator
          text: The old woman accepted the food and studied Tephany's face.
        - id: ch02-b10
          speaker: fairy
          text: Those who help others deserve help themselves. Your eyes are red because that miser Barbaik forbade you to speak to the young man from Plover. Cheer up. You're a good girl, and I'll give you a way to see him every day.
        - id: ch02-b11
          speaker: tephany
          text: You can do that?
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: The old woman went on as if she had not heard.
        - id: ch02-b13
          speaker: fairy
          text: Take this long copper pin. Whenever you fasten it in your dress, Mother Bourhis will have to leave the house and count her cabbages. She cannot return while you wear it. Put the pin back in its case, and only then can she come home.
        - id: ch02-b14
          speaker: narrator
          text: The old woman rose, nodded to Tephany, and vanished. Tephany stood as still as stone. Without the pin in her hand, she would have believed it was a dream. Now she knew the stranger had been no ordinary beggar, but a fairy who could see the days ahead. Then she noticed the waiting clothes and scrubbed them with all her strength to make up for lost time.
        - id: ch02-b15
          speaker: narrator
          text: The next evening, Denis waited in the cowhouse shadow as usual. Tephany fixed the pin in her dress. At that very moment, Barbaik put on her wooden shoes, crossed the orchard, and went straight to the cabbage plot. Tephany ran outside with a light heart and spent a happy evening with Denis. The same thing happened for many days. Then she began to notice something that made her deeply sad.
    - id: ch03
      title: The Feather of Wisdom
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At first, the hours with Tephany seemed to fly for Denis too. He taught her every song he knew and described all his plans to become rich and important. After that, he had nothing left to say. Denis was like many people who love to talk about themselves but never care to listen. Sometimes he never came at all. The next evening, he would claim that business had taken him into town. Tephany never accused him or told him she knew better. Even so, she could see plainly that he no longer cared for her as he once had.
        - id: ch03-b02
          speaker: narrator
          text: Her heart grew heavier each day, and her cheeks grew pale. One evening, after waiting for Denis in vain, she lifted her water pot onto her shoulder and slowly walked toward the spring. The fairy stood on the path ahead. She looked at Tephany and gave a mischievous little laugh.
        - id: ch03-b03
          speaker: fairy
          text: Why, my pretty girl doesn't look any happier, even though she can meet her sweetheart whenever she likes.
        - id: ch03-b04
          speaker: tephany
          text: He's tired of me. He keeps finding reasons to stay away. Oh, dear Granny, seeing him isn't enough. I need to interest him so he'll want to stay. He's so clever. Please help me become clever too.
          emotion: sad
        - id: ch03-b05
          speaker: fairy
          text: Is that what you want? Then put this feather in your hair, and you'll be as wise as Solomon himself.
        - id: ch03-b06
          speaker: narrator
          text: Tephany blushed with delight. At home, she tucked the feather into the blue ribbon worn by girls in that country. Almost at once, Denis came whistling merrily. Barbaik was safely counting cabbages, so Tephany hurried out.
        - id: ch03-b07
          speaker: narrator
          text: Her conversation left Denis speechless. There seemed to be nothing she did not know. She could sing songs from every corner of Brittany, and she could make up new ones herself. Denis could hardly believe this was the quiet girl who had once been so eager to learn everything he could teach her. Was she truly Tephany, or someone else? Perhaps she had suddenly gone mad. Perhaps an evil spirit had entered her. Whatever the answer, he returned night after night, only to find her wiser than before.
        - id: ch03-b08
          speaker: narrator
          text: Soon the neighbors were whispering among themselves. Tephany could not resist wearing the feather around people who looked down on her because of her poor clothes. With the feather in place, she made one clever joke after another at their expense. Naturally, those people heard every jest that had been made about them, and they shook their heads over the change in her.
        - id: ch03-b09
          speaker: narrator
          text: They called her a spiteful little cat. They said any man who married her would soon find Tephany holding the reins and driving him like a horse. Before long, Denis began to agree. He always wanted to be master wherever he went. Her sharp tongue frightened him now. When she laughed at other people, he no longer joined her. He turned red and uneasy, wondering when she would laugh at him.
        - id: ch03-b10
          speaker: narrator
          text: One evening, Denis said he could not stay even a moment. He had promised to attend a dance in the next village. Tephany's face fell. She had worked hard all day and had looked forward to one quiet hour with him. She pleaded with him, but he would not change his mind. At last, she lost her temper.
        - id: ch03-b11
          speaker: tephany
          text: Oh, I know why you refuse to miss that dance. Aziliez of Pennenru will be there.
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: Aziliez was the loveliest girl for miles, and she and Denis had known each other since childhood.
        - id: ch03-b13
          speaker: denis
          text: Yes, Aziliez will be there. Anyone would travel a long way just to see her dance.
        - id: ch03-b14
          speaker: narrator
          text: Denis was pleased to see Tephany jealous.
        - id: ch03-b15
          speaker: tephany
          text: Then go!
          emotion: angry
        - id: ch03-b16
          speaker: narrator
          text: Tephany rushed inside and slammed the door.
    - id: ch04
      title: The Necklace of Beauty
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Alone and miserable, Tephany sat by the fire and stared into its red embers. She tore the feather from her hair, buried her face in her hands, and sobbed.
        - id: ch04-b02
          speaker: tephany
          text: What good is cleverness when men only want beauty? That's the gift I should have asked for. But now it's too late. Denis will never return.
          emotion: sad
        - id: ch04-b03
          speaker: fairy
          text: Since you want beauty so badly, you shall have it. Fasten this necklace around your neck. As long as you wear it, you will be the most beautiful woman in the world.
        - id: ch04-b04
          speaker: narrator
          text: The old woman was standing beside her, leaning on her stick. Tephany gave a joyful cry, took the necklace, and snapped its clasp shut. She ran to the little mirror in the corner. Now she feared neither Aziliez nor any other girl. Surely no one could be as fair and white as the face before her.
        - id: ch04-b05
          speaker: narrator
          text: The sight gave her an idea. She hurried into her best dress and buckled shoes, then set out for the dance. On the road, she met a fine carriage with a young man seated inside.
        - id: ch04-b06
          speaker: young_lord
          text: What a beautiful girl! No maiden in my country can compare with her. She, and no one else, will be my bride.
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: The carriage filled the narrow road, leaving Tephany no way around it. Against her wishes, she had to stop. She looked directly at the young man.
        - id: ch04-b08
          speaker: tephany
          text: Go on your way, my lord, and let me go on mine. I'm only a poor farm girl. I milk cows, make hay, and spin.
        - id: ch04-b09
          speaker: young_lord
          text: You may be a peasant now, but I will make you a great lady.
        - id: ch04-b10
          speaker: narrator
          text: He took her hand and tried to lead her toward the carriage.
        - id: ch04-b11
          speaker: tephany
          text: I don't want to be a great lady. I only want to marry Denis.
        - id: ch04-b12
          speaker: narrator
          text: She tore her hand free and ran toward the ditch beside the cornfield, hoping to hide. The young lord guessed her plan. At his signal, his attendants seized her and forced her into the coach. The door slammed, and the horses galloped away.
        - id: ch04-b13
          speaker: narrator
          text: An hour later, they reached a splendid castle. Tephany refused to move, so the attendants lifted her from the carriage and carried her into the great hall. At once, someone was sent to fetch a priest and perform the marriage ceremony. The young lord tried to coax a smile from her. He told her about all the beautiful things she would own as his wife. Tephany would not listen. While he spoke, she looked around the hall for some way to escape.
        - id: ch04-b14
          speaker: narrator
          text: Escape did not look easy. Three great doors were tightly barred, and the door through which she had entered had sprung shut behind her. But the feather was still in her hair. With its wisdom, she noticed a crack in the wooden paneling. A faint thread of light shone through it. Tephany touched the copper pin that fastened her dress, and at once everyone in the hall had to go and count the cabbages. Left alone, she found the little hidden door in the paneling and slipped through. She had no idea where it would lead her.
    - id: ch05
      title: The Trouble with Beauty
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Night had fallen by then, and Tephany was exhausted. She did not know where the hidden passage had taken her, but she was thankful when she reached the gate of a convent. She asked the woman at the gate if she might stay there until morning.
        - id: ch05-b02
          speaker: portress
          text: This is no place for beggars. Be off with you.
          emotion: disgusted
        - id: ch05-b03
          speaker: narrator
          text: Tephany dragged herself back along the road. At last, a light and a barking dog told her that a farm was near. Two or three women and the farmer's sons stood before the house. When their mother heard Tephany asking for a bed, her kind heart softened, and she was about to invite the girl inside.
        - id: ch05-b04
          speaker: narrator
          text: But Tephany's beauty had turned the young men's heads. Each wanted to be the one who did the most for her. They began arguing, and their angry words soon became blows. The other women were frightened by the fight and blamed the stranger who had caused it. They hurled insults at Tephany until she ran down the nearest path, hoping to lose everyone in the darkness beneath the trees. Within moments, she heard the young men chasing after her.
        - id: ch05-b05
          speaker: narrator
          text: Fear made her legs tremble. Then she remembered the necklace. With a great effort, she broke its clasp and threw it around the neck of a pig grunting in a ditch. The footsteps behind her stopped. Then they raced after the pig instead, because the necklace's beauty no longer belonged to Tephany.
        - id: ch05-b06
          speaker: narrator
          text: Tephany hurried onward, scarcely knowing where the road was taking her. At last, to her amazement and joy, she recognized the land near her aunt's house. She was home again. For several days afterward, she was so weary and unhappy that she could barely finish her work. Matters only grew worse because Denis hardly came near her.
        - id: ch05-b07
          speaker: denis
          text: I'm too busy. Only rich people can afford to waste their time talking.
        - id: ch05-b08
          speaker: narrator
          text: Tephany grew paler as the days passed. Everyone noticed except Barbaik. The water pot was almost too heavy for her, yet every morning and evening she carried it to the spring. Often she could scarcely raise it to her shoulder. One sunset, she whispered to herself as she followed the familiar path.
        - id: ch05-b09
          speaker: tephany
          text: How could I have chosen so foolishly? Freedom to meet Denis was useless because he soon tired of me. A quick tongue only frightened him. Beauty brought me nothing but trouble. I should have asked for riches. They make life easier for you and for everyone around you. If I dared ask the fairy for that gift, I would choose more wisely this time.
          emotion: sad
        - id: ch05-b10
          speaker: fairy
          text: Your wish is granted. When you reach home, look in your right-hand pocket. You will find a little box. Rub the ointment inside it on your eyes, and you will see that you carry a priceless treasure within yourself.
        - id: ch05-b11
          speaker: narrator
          text: The fairy's voice seemed to come from Tephany's elbow, though the old woman could not be seen. Tephany did not understand her meaning at all. Still, she ran home as quickly as she could and searched her right-hand pocket. There was the small box, just as promised.
    - id: ch06
      title: Tears of Pearl
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Tephany opened the precious little box and was just about to rub the ointment on her eyes when Barbaik entered. Ever since the pin had begun driving her away from her work to count cabbages, everything on the farm had gone wrong. Barbaik never understood why she had to abandon her work or waste so many hours in the cabbage patch. Her temper had become so foul that she could not persuade a single laborer to stay. Now she found her niece standing quietly before the mirror.
        - id: ch06-b02
          speaker: barbaik
          text: So this is what you do while I'm out in the fields! No wonder the farm is ruined. Aren't you ashamed to behave this way?
          emotion: angry
        - id: ch06-b03
          speaker: narrator
          text: Tephany tried to stammer an excuse, but Barbaik was nearly wild with rage. Her only answer was a hard box on the ears. Tephany was hurt, confused, and far too upset to control herself any longer. She turned away and burst into tears. Then, through those tears, she saw something astonishing. Every drop that fell from her eyes had become a round, shining pearl.
        - id: ch06-b04
          speaker: narrator
          text: Barbaik saw it too. With a cry of wonder, she dropped to her knees and snatched the pearls from the floor. She was still gathering them when the door opened and Denis came in.
        - id: ch06-b05
          speaker: denis
          text: Pearls? Are those truly pearls?
          emotion: surprised
        - id: ch06-b06
          speaker: narrator
          text: Denis knelt beside Barbaik. When he looked up, he saw even finer pearls rolling down Tephany's cheeks.
        - id: ch06-b07
          speaker: barbaik
          text: Don't let the neighbors hear about this, Denis. You may have your share, of course, but no one else gets a single pearl. Keep crying, my dear. Go on. This is for your own good as well as ours.
        - id: ch06-b08
          speaker: narrator
          text: Barbaik stretched out her apron to catch the pearls, while Denis held out his hat beneath Tephany's face. The sight of their greed made Tephany feel half choked. She could bear almost no more and tried to rush from the room. Barbaik caught her by the arm before she could escape. Then the woman who had just struck her began pouring out every tender phrase she could think of, hoping the gentle words would make the girl weep even harder. With a great effort, Tephany forced back her tears and wiped her eyes dry.
        - id: ch06-b09
          speaker: barbaik
          text: Has she stopped already? Oh, try once more, my dear. Denis, do you think a little beating would help?
        - id: ch06-b10
          speaker: narrator
          text: Denis shook his head.
        - id: ch06-b11
          speaker: denis
          text: That's enough for the first time. I'll go to town and learn what each pearl is worth.
        - id: ch06-b12
          speaker: barbaik
          text: Then I'm coming with you.
        - id: ch06-b13
          speaker: narrator
          text: Barbaik trusted no one and feared being cheated. She left with Denis, and Tephany remained behind.
    - id: ch07
      title: The Last Gift
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Tephany sat perfectly still in her chair. Her hands were clasped so tightly that she seemed to be forcing something back inside herself. For a long while, her eyes stayed fixed on the floor. At last, she looked up. The fairy stood in a dark corner near the hearth, silently watching her with a mocking look. Tephany trembled at the sight and sprang to her feet. She gathered the feather, the copper pin, and the little box, then held all three toward the old woman.
        - id: ch07-b02
          speaker: tephany
          text: Take them all back. They belong to you, and I never want to see them again. But I have learned what they were meant to teach me. Other people may keep riches, beauty, and wit. I want only to be the poor farm girl I always was, working hard for the people I love.
        - id: ch07-b03
          speaker: fairy
          text: Yes, you have learned your lesson. Now you will live peacefully and marry the man you love. After all, it was never yourself you were thinking of. It was him.
        - id: ch07-b04
          speaker: narrator
          text: Tephany never saw the old woman again. Though Denis had been ready to sell the pearls made from her tears, she forgave him for what he had done. In time, he became a good husband who worked beside her and always did his fair share of every task on their farm.
