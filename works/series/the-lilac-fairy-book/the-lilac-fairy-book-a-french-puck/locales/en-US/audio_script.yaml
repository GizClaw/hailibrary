  chapters:
    - id: ch01
      title: The Midnight Trickster
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the mountain pastures and valleys of central France, there once lived a mischievous spirit. He loved playing tricks on everyone, especially shepherds and cowboys. No one ever knew when they were safe from him. He could turn himself into a man, a woman, or a child. He could become a stick, a goat, or even a ploughshare.
        - id: ch01-b02
          speaker: narrator
          text: There was only one shape he could not copy properly. That was a needle. He could make himself look like one, but no matter how hard he tried, he could never form the eye. Any woman would have spotted the trick at once, and he knew it.
        - id: ch01-b03
          speaker: narrator
          text: We will call this naughty sprite Puck. His favorite time for mischief was around midnight, when the shepherds and cowherds were fast asleep after a long day's work. Puck would creep into the cowsheds, unfasten the chains holding the animals in their stalls, and let those chains crash to the ground.
        - id: ch01-b04
          speaker: narrator
          text: However tired the cowboys were, that terrible clanging always woke them. They would drag themselves to the stable and fasten every chain again. The moment they returned to bed, down came the chains once more. Puck kept it up until morning.
        - id: ch01-b05
          speaker: narrator
          text: On other nights, he braided the mane and tail of one horse together with those of another. The next morning, the grooms spent hours trying to untangle them. All the while, Puck hid in the hayloft, peeping out and enjoying every moment.
    - id: ch02
      title: A Sheep on William's Shoulders
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One evening, more than eighty years ago, a man named William was walking beside a stream. He noticed a sheep bleating loudly. It must have wandered away from its flock, he thought. He decided to take it home until he could find its owner.
        - id: ch02-b02
          speaker: narrator
          text: William went over to the sheep. It looked too tired to walk, so he lifted it onto his shoulders and carried on. The animal was quite heavy. Still, William was a merciful man, and he staggered forward beneath his load as best he could.
        - id: ch02-b03
          speaker: william
          text: It isn't much farther now.
        - id: ch02-b04
          speaker: narrator
          text: He had just reached an avenue of walnut trees when a voice called from somewhere above his head. William jumped.
        - id: ch02-b05
          speaker: overhead_voice
          text: Where are you?
        - id: ch02-b06
          speaker: narrator
          text: Then the sheep on his shoulders answered.
        - id: ch02-b07
          speaker: puck
          text: Right here, riding on a donkey's shoulders!
        - id: ch02-b08
          speaker: narrator
          text: A moment later, the sheep was on the ground, and William was racing home as fast as his legs could take him. Behind him came a laugh that still sounded a little like a bleat. He tried not to listen, but the words rang in his ears.
        - id: ch02-b09
          speaker: puck
          text: Oh, what fun that was! What wonderful fun!
          emotion: happy
    - id: ch03
      title: The Forgotten Thread
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Puck made sure he did not always play his tricks in the same place. He moved from village to village, and everyone trembled at the thought that they might be his next victim. After a while, shepherds and cowboys no longer amused him. He began looking for someone new to torment.
        - id: ch03-b02
          speaker: narrator
          text: At last, he heard about a young couple who had gone to the nearest town to buy everything they needed for their new home. Puck felt certain they would forget something important. He waited until they were jogging home in their cart, then changed himself into a fly so he could hear them talk.
        - id: ch03-b03
          speaker: narrator
          text: For a long while, their conversation bored him. They talked about their wedding the next month and decided who should be invited. Then the bride began thinking about her wedding dress and gave a little scream.
        - id: ch03-b04
          speaker: bride
          text: Oh, no! How could I be so foolish? I forgot to buy all the different colors of thread to match my clothes!
          emotion: surprised
        - id: ch03-b05
          speaker: bridegroom
          text: Oh, dear, that's bad luck. Didn't you say the dressmaker is coming tomorrow?
        - id: ch03-b06
          speaker: bride
          text: Yes, I did.
        - id: ch03-b07
          speaker: narrator
          text: Suddenly, she screamed again, but this time it sounded very different.
        - id: ch03-b08
          speaker: bride
          text: Look! Over there, look!
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: The bridegroom looked toward the side of the road. There lay a great ball of thread in many colors. In fact, it held every color found in the dresses tied to the back of their cart.
        - id: ch03-b10
          speaker: bridegroom
          text: What amazing luck! You'd think a fairy had left it here just for us.
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: He jumped down from the cart and picked it up.
        - id: ch03-b12
          speaker: bride
          text: Maybe a fairy did leave it.
          emotion: happy
        - id: ch03-b13
          speaker: narrator
          text: The girl laughed. As she did, she thought she heard her own laughter echo from the horse. Of course, that could not possibly be true.
    - id: ch04
      title: The Perfect Colored Thread
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The dressmaker was delighted when the couple gave her the thread. Every color matched the cloth perfectly. Better still, the thread never tangled itself into knots or kept snapping the way thread so often did.
        - id: ch04-b02
          speaker: narrator
          text: She finished much sooner than she had expected. The bride made her promise to come to the church and see the wedding dress being worn.
    - id: ch05
      title: Crick! Crack!
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A great crowd gathered for the wedding. The young couple were loved throughout the neighborhood, and both their families were very rich. The church doors stood open. Far down the chestnut avenue, everyone could see the bride approaching.
        - id: ch05-b02
          speakers: [man_1, man_2]
          ensemble: duo
          text: What a beautiful girl!
        - id: ch05-b03
          speakers: [woman_1, woman_2]
          ensemble: duo
          text: And what a lovely dress!
        - id: ch05-b04
          speaker: narrator
          text: The men called out in admiration, while the women whispered to one another. Then the bride entered the church and took the hand of the bridegroom, who was waiting for her. At that very moment, a sharp noise rang out.
        - id: ch05-b05
          speaker: narrator
          text: Crick! Crack! Crick! Crack!
        - id: ch05-b06
          speaker: narrator
          text: The wedding clothes dropped straight to the ground, leaving the bride terribly embarrassed.
        - id: ch05-b07
          speaker: narrator
          text: But a little thing like that did not stop the ceremony. People immediately offered the young bride cloak after cloak. Even so, she was so distressed that she could barely hold back her tears.
        - id: ch05-b08
          speaker: narrator
          text: One guest was more curious than all the others. She stayed behind to inspect the dress, determined to discover what had caused the disaster if she could.
        - id: ch05-b09
          speaker: curious_guest
          text: The thread must have been rotten. Let me see if I can break it.
        - id: ch05-b10
          speaker: narrator
          text: She searched and searched, but she could not find a single piece of it.
        - id: ch05-b11
          speaker: narrator
          text: The thread had vanished!
