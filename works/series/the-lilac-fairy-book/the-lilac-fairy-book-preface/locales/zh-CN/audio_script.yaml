audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机敏从容，带克制的诙谐和自嘲
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    lady:
      display_name: 宴会上的女士
      tts:
        delivery: 礼貌好奇，语气轻快自然
        timbre: 清亮柔和的成年女声
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 宴席上的难题
      blocks:
        - id: ch01-b01
          speaker: lady
          text: “您眼下在办什么案子？最近补的牙多吗？近来又劝化了哪些人？”
        - id: ch01-b02
          speaker: narrator
          text: 宴会上，女士们会这样问碰巧坐在身边的男士吗？不管那人是律师、牙医，还是牧师？我不知道她们会不会用这些问题，表示自己关心席间邻座的营生。可她们要是不认识我，或同我不熟，通常总会问另一句话。
        - id: ch01-b03
          speaker: lady
          text: “您现在还在写什么吗？”
        - id: ch01-b04
          speaker: narrator
          text: 这就像问画家现在还画不画，或者问律师眼下有没有案子。有时，她们还会问得更明白。
        - id: ch01-b05
          speaker: lady
          text: “那么，您现在写的是什么？”
        - id: ch01-b06
          speaker: narrator
          text: 仿佛我非得写点什么不可。其实我确实在写，只是不愿让人提醒。这个问题不好答，因为问话的美人连半个铜板也不在乎答案。就算我说：“夫人，我正在写一篇论文，要证明常态先于观念图腾主义。”这话倒是真的，她听完却还是不明白。最好的办法，看来是告诉她，我已经彻底放弃纯文学，准备写一本《马铃薯早疫成因》。这种可悲的灾害，眼看会让我们失去最主要的食用块根。这样一来，她永远也发现不了真相。
        - id: ch01-b07
          speaker: lady
          text: “您是不是除了童话书，别的什么也不写？”
        - id: ch01-b08
          speaker: narrator
          text: 有一位仙女般的小姐，和其他人一样，偏偏绕不开我那可厌的营生，就这样问过我。还有一位法国绅士，是教育家，也是研究玛丽女王肖像的专家。他寄来一篇自己写的报纸文章，说我专门创作童话书，此外什么也不干。后来他来到英国拜访我，才发现我对玛丽女王肖像的了解，还比他多一点。
    - id: ch02
      title: 谁写了这些童话
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 说实话，我一辈子从没写过什么童话书，只有《普里吉奥王子》《里卡多王子》和《仙宫故事》这三部例外。最后一部讲的也是那位普里吉奥。借这个机会，我愿把它们推荐给没听说过的父母和监护人。它们是几本可怜的小书，却是我亲笔写的。里面有许多浪漫奇遇。王子总能娶到该娶的公主，从此幸福地生活下去。邪恶的女巫、继母、家庭教师和女管家却不会受酷刑，只会拿着丰厚年金退隐乡间。
        - id: ch02-b02
          speaker: narrator
          text: 我厌恶残忍，从不把坏继母塞进木桶，让她连人带桶滑下山坡。里卡多王子的确杀死了黄侏儒，可那是双方持剑的公平决斗。那侏儒战斗到死，愿他的亡灵安息！
        - id: ch02-b03
          speaker: narrator
          text: 我这番坦白，不只是在替自己的童话书做广告。顺便说一句，它们并没有绝版。如果书商这样告诉你，他嘴里便没有真话。我还要把功劳还给真正应得的人。这些童话书几乎全是兰夫人的心血。故事来自法语、德语、葡萄牙语、意大利语、西班牙语、加泰罗尼亚语和其他语言，都是她翻译、改编的。
        - id: ch02-b04
          speaker: narrator
          text: 按马克·吐温的说法，我在伊甸园里扮演亚当。夏娃干活，亚当监督。我也监督。我找故事，提建议，总之只管监督，并不凭自己的脑袋把故事写出来。可所有童话书都算到了我名下。这份名声传遍欧洲的育儿室，还传到了美利坚合众国，真是“一项我生来无福承受的荣誉重担”。它压着我，简直要我的命。伯利勋爵娶来的乡村姑娘，也承受不了做斯坦福镇伯利庄园女主人的种种烦恼。
    - id: ch03
      title: 比文字更古老的故事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大多数故事，其实没有真正的作者。埃及象形文字、克里特符号、塞浦路斯音节文字和各种字母还没发明时，世界各地的人已经在讲它们了。故事比读写更古老。在人类还没有教育可争的时候，它们便像野花一样长出来。祖母讲给孙辈，孙辈做了祖母，又把同样的老故事讲给新一代。
        - id: ch03-b02
          speaker: narrator
          text: 荷马知道这些故事，拿其中五六个编成了《奥德赛》。直到公元前八百年左右，希腊的全部历史都像一串童话。忒修斯、赫拉克勒斯、俄狄浦斯、米诺斯和珀耳修斯的故事，合起来就是一部童话总集。莎士比亚也取走一些，放进《李尔王》和别的戏剧。他再伟大，也不可能独自想出这些故事。
        - id: ch03-b03
          speaker: narrator
          text: 女士先生们坐下来写童话，让人漂漂亮亮地打好字，再寄给朗文公司出版时，应该记住这一点。他们以为新写一篇童话很容易。其实不可能。谁也写不出全新的童话，只能把古老又古老的故事重新拼合装扮，替人物换上新衣。萨克雷小姐在《五位老朋友》中就做得十分出色。哪位十四岁的大姑娘读到这篇序言，一定要坚持让人送她一本。
        - id: ch03-b04
          speaker: narrator
          text: 可那三百六十五位一心要写新童话的作者，实在令人厌烦。他们开篇总写一个小男孩或小女孩走出门去，碰见报春花、栀子花和苹果花的仙子，也就是“花儿、果实，还有别的长翅膀的东西”。这些仙子想逗人发笑，偏偏失败了。她们又想说教，这次倒成功了。真正的仙子从不说教，也不讲俚语。故事末尾，孩子一觉醒来，发现刚才只是一场梦。
        - id: ch03-b05
          speaker: narrator
          text: 新童话就是这个样子。但愿我们能躲过这一切，哪一种都不要碰上！
    - id: ch04
      title: 这些故事从哪里来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我们的故事几乎全都很古老。有些来自爱尔兰，属于那座岛屿还不像今天这样，既因遭受的不公闻名，也因满目苍翠著称的年代。有些来自亚洲，我猜它们早于雅利安人的入侵。还有一些来自莫伊达特、诺伊达特、莫勒和阿德纳默亨。那里的海流像宽阔清澈的河，锯齿般的山岭泛着蓝色，人们还记得查理王子。
        - id: ch04-b02
          speaker: narrator
          text: 有些故事来自葡萄牙，赫斯珀里得斯的花园就在那里长着金色果实。有些来自荒莽的威尔士，曾有人在亚瑟王的宫廷里讲过。另一些则来自威尔士人的同族，也就是布列塔尼人的炉边。书中还有一位斯堪的纳维亚学者托佩利乌斯创作的现代故事。
        - id: ch04-b03
          speaker: narrator
          text: 所有故事都由兰夫人翻译或改编，只有几篇例外。坎贝尔少校从普什图语译出了《瑜伽行者的惩罚》和《莫蒂》。哈丁小姐根据托佩利乌斯的作品，译了《勇敢的沃尔特怎样猎狼》《小拉塞》和《树莓虫》。同一位作者的《海王的礼物》，则由克里斯蒂小姐翻译。
        - id: ch04-b04
          speaker: narrator
          text: 有人向编者提议，孩子、父母和监护人想必会喜欢《灰色真实鬼故事书》。编者知道孩子们一定喜欢，也很愿意把书送给他们。可是慈爱又忧心的母亲和好心的姨妈姑妈是否中意，他可没有十足把握。
        - id: ch04-b05
          speaker: narrator
          text: 编者还不到十二岁时，知道的真实鬼故事已经足够装满一本书。上床以前，听故事纯粹是享受。到了就寝时分，甚至再往后，滋味可就不全是快乐了。那时他并不怕黑，因为他想：“要是鬼就在这里，我们也看不见它。”可是后来，年长而见多识广的人告诉他，鬼会自带光亮而来。这话千真万确。那时的感受，就不是父母愿意让年轻人经受的了。
        - id: ch04-b06
          speaker: narrator
          text: 正因如此，《灰色真实鬼故事书》大概永远也不会有请福特先生绘制插图的那一天。
