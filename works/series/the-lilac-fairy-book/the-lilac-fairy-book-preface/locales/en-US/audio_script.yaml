audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    dinner_guest:
      display_name: Dinner Guest
      tts:
        delivery: polite and casually inquisitive
        timbre: light and clear
        pace: conversational
        pitch: medium
    nymph:
      display_name: The Nymph
      tts:
        delivery: direct and innocently certain
        timbre: bright and poised
        pace: conversational
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Awkward Question
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At dinner parties, do ladies turn to the lawyer beside them and ask questions like these?
        - id: ch01-b02
          speaker: dinner_guest
          text: What cases are keeping you busy just now?
        - id: ch01-b03
          speaker: narrator
          text: Or do they question a dentist this way?
        - id: ch01-b04
          speaker: dinner_guest
          text: Have you been filling many teeth lately?
        - id: ch01-b05
          speaker: narrator
          text: And do they ask a clergyman about his work too?
        - id: ch01-b06
          speaker: dinner_guest
          text: Whom have you converted recently?
        - id: ch01-b07
          speaker: narrator
          text: I cannot say whether ladies show such interest in the occupations of the strangers seated beside them at a welcoming table. But when they do not know me, or know me only slightly, they nearly always have one question.
        - id: ch01-b08
          speaker: dinner_guest
          text: Are you writing anything at the moment?
        - id: ch01-b09
          speaker: narrator
          text: They might as well ask a painter whether he is painting, or a lawyer whether he has any cases. Sometimes the question is even more exact.
        - id: ch01-b10
          speaker: dinner_guest
          text: So, what are you writing now?
        - id: ch01-b11
          speaker: narrator
          text: They seem sure I must be writing something. And I am, though I dislike being reminded of it. The question is awkward because the fair questioner does not care a bawbee about my answer. Nor would my true reply make matters much clearer.
        - id: ch01-b12
          speaker: narrator
          text: I might tell her, “Madam, I am working on a treatise to prove that Normal came before Conceptional Totemism.” That would be perfectly true and perfectly obscure.
        - id: ch01-b13
          speaker: narrator
          text: A better answer is that I have abandoned mere literature. Instead, I am considering a book called “The Causes of Early Blight in the Potato,” about the melancholy danger that may rob us of our chief edible root. The questioner would never discover the truth.
        - id: ch01-b14
          speaker: narrator
          text: One nymph, like all the others, could not stay away from the dreadful subject of my occupation.
        - id: ch01-b15
          speaker: nymph
          text: You only ever write fairy books, don't you?
        - id: ch01-b16
          speaker: narrator
          text: A French gentleman once made the same mistake. He was an educator and an expert on portraits of Queen Mary. In a newspaper article, he declared that I did nothing but compose fairy books. Then he visited me in England and found that I knew rather more about portraits of Queen Mary than he did.
    - id: ch02
      title: Who Made the Fairy Books
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The truth is that I have never written a fairy book in my life, except “Prince Prigio,” “Prince Ricardo,” and “Tales from a Fairy Court,” which is the court of that same Prigio.
        - id: ch02-b02
          speaker: narrator
          text: Since I have the chance, I recommend these poor fairy books of my own to parents and guardians who may not know them. They are full of romantic adventures. The princes always marry the proper princesses and live happily ever after.
        - id: ch02-b03
          speaker: narrator
          text: The wicked witches, stepmothers, tutors, and governesses are never punished cruelly. They retire to the country with generous pensions. I hate cruelty. I have never put a wicked stepmother into a barrel and sent her sliding down a hill.
        - id: ch02-b04
          speaker: narrator
          text: Prince Ricardo did kill the Yellow Dwarf, it is true. But it was a fair fight, and Ricardo had his sword in hand. Peace to the dwarf's ashes. He died in harness.
        - id: ch02-b05
          speaker: narrator
          text: These confessions do advertise my own fairy books. And those books are not out of print. If your bookseller claims they are, he is not telling the truth. But I also mean to give the proper person her proper credit.
        - id: ch02-b06
          speaker: narrator
          text: Almost all the work on the fairy books was done by Mrs. Lang. She translated and adapted the tales from French, German, Portuguese, Italian, Spanish, Catalan, and other languages.
        - id: ch02-b07
          speaker: narrator
          text: My own part was like Adam's part in the Garden of Eden, according to Mark Twain. Eve did the work. Adam supervised. I supervise too. I discover where the stories are, offer advice, and, in short, supervise. I do not invent the stories myself.
        - id: ch02-b08
          speaker: narrator
          text: Yet I have gained a European reputation in nurseries and in the United States of America for writing every one of the fairy books. It is “the burden of an honour unto which I was not born.” That burden weighs on me and is killing me.
        - id: ch02-b09
          speaker: narrator
          text: It is like the great worry of being the wife of the Lord of Burleigh, of Burleigh House by Stamford Town. That life proved too much for the village maiden whom the lord married.
    - id: ch03
      title: Stories Older Than Writing
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In fact, nobody truly wrote most of these stories. People were telling them all over the world before Egyptian hieroglyphics, Cretan signs, Cyprian syllabaries, or alphabets had been invented.
        - id: ch03-b02
          speaker: narrator
          text: The tales are older than reading and writing. They sprang up like wildflowers before people had any education to quarrel about. Grandmothers told them to grandchildren. When those grandchildren became grandmothers, they passed the same old tales to another generation.
        - id: ch03-b03
          speaker: narrator
          text: Homer knew these stories. He made the “Odyssey” from half a dozen of them. The history of Greece down to about eight hundred years before Christ is one long chain of fairy tales.
        - id: ch03-b04
          speaker: narrator
          text: The tales of Theseus, Heracles, Oedipus, Minos, and Perseus make up a whole Cabinet des Fées, a collection of fairy tales. Shakespeare borrowed from the old stories too and placed pieces of them in “King Lear” and other plays. Great as he was, even Shakespeare could not have invented them.
        - id: ch03-b05
          speaker: narrator
          text: Ladies and gentlemen should remember that when they sit down to compose fairy tales, have them neatly typed, and send them to Messrs. Longman and Company for publication. They imagine that making a new fairy tale is easy. They are wrong. It is impossible.
        - id: ch03-b06
          speaker: narrator
          text: Nobody can write a new fairy tale. All anyone can do is mix and dress up the old, old stories, then give the characters new clothes. Miss Thackeray did that beautifully in “Five Old Friends.” If any grown-up girl of fourteen reads this preface, she should insist on receiving a copy.
    - id: ch04
      title: New Tales and Old
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Still, the three hundred and sixty-five authors who attempt new fairy tales are very tiresome. They always begin with a little boy or girl who goes outside and meets fairies belonging to polyanthuses, gardenias, and apple blossoms. These are flowers and fruits, and other winged things.
        - id: ch04-b02
          speaker: narrator
          text: These fairies try to be amusing and fail. Or they try to preach and succeed. Real fairies never preach, and they never use slang. In the end, the little boy or girl wakes and discovers that everything was a dream.
        - id: ch04-b03
          speaker: narrator
          text: Those are the new fairy stories. May we be spared every one of them!
        - id: ch04-b04
          speaker: narrator
          text: Nearly all our stories are old. Some come from Ireland, from a time before the island was as famous for her wrongs as for her green countryside. Some come from Asia and were probably made before the Aryan invasion.
        - id: ch04-b05
          speaker: narrator
          text: Others come from Moydart, Knoydart, Morar, and Ardnamurchan. There the sea streams run like broad, clear rivers, the saw-edged hills are blue, and people remember Prince Charlie.
        - id: ch04-b06
          speaker: narrator
          text: Some tales come from Portugal, where golden fruit grows in the Garden of the Hesperides. Some come from wild Wales and were told at Arthur's Court. Still others come from the hearths of the Welsh people's relatives, the Bretons. And there are modern stories by a learned Scandinavian named Topelius.
        - id: ch04-b07
          speaker: narrator
          text: Mrs. Lang translated or adapted all the stories except a few. Major Campbell made “The Jogi's Punishment” and “Moti” from the Pushtoo language. Miss Harding translated “How Brave Walter Hunted Wolves,” “Little Lasse,” and “The Raspberry Worm” from Topelius. Miss Christie translated “The Sea King's Gift” from that same author.
    - id: ch05
      title: The Ghost-Story Book
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Someone has suggested that children, parents, and guardians would enjoy “The Grey True Ghost-Story Book.” The editor knows the children would like it very much, and he would gladly give it to them.
        - id: ch05-b02
          speaker: narrator
          text: But he is less certain about the tastes of loving, anxious mothers and kind aunts. Before he was twelve, the editor knew enough true ghost stories to fill an entire volume.
        - id: ch05-b03
          speaker: narrator
          text: Those stories were pure joy until bedtime. Then, and afterward, they were not quite such unmixed pleasure. At first the editor was not afraid of the dark. He had a comforting thought.
        - id: ch05-b04
          speaker: narrator
          text: If a ghost is here in the dark, we cannot see him.
        - id: ch05-b05
          speaker: narrator
          text: But older and better-informed people said that ghosts carry their own light with them. That is only too true. After hearing it, a child feels the sort of emotions that parents do not want the young to suffer.
        - id: ch05-b06
          speaker: narrator
          text: And that is why Mr. Ford is never likely to illustrate “The Grey True Ghost-Story Book.”
