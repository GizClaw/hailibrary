audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    bernez:
      display_name: Bernez
      tts:
        delivery: earnest, brave, and openhearted
        timbre: clear and youthful
        pace: conversational
        pitch: medium
    wizard:
      display_name: Beggar Wizard
      tts:
        delivery: sly, calculating, and rough-edged
        timbre: dry and aged
        pace: deliberate
        pitch: low
    donkey:
      display_name: Donkey
      tts:
        delivery: cheerful, curious, and quick
        timbre: light and lively
        pace: brisk
        pitch: medium-high
    ox:
      display_name: Ox
      tts:
        delivery: gruff, knowing, and suspicious
        timbre: deep and heavy
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: A Tale Told by the Fire
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Some of you may have read a book called “Kenneth, or the Rear-Guard of the Grand Army.” If you have, you may remember the two Scottish children found in Russia. French soldiers cared for them and did all they could to shield them from the horrors of Napoleon's terrible retreat.
        - id: ch01-b02
          speaker: narrator
          text: One of those soldiers came from Brittany. He often tried to make the children forget how cold and hungry they were by telling tales from his homeland, a country full of wonders. The soldiers always gave the children the best and warmest place around the campfire. Even there, the bitter frost still made them shiver.
        - id: ch01-b03
          speaker: narrator
          text: That was when the Breton would begin. Plouhinec, he told them, was a little seaside town near Hennebonne. He would go on until Kenneth or Effie broke in with an eager question. Then he lost the thread of the tale as his mother had told it, so he had to start all over again. In this way, the story lasted a long while. By the end, the children were ready to be wrapped in whatever covers the soldiers could find and put to sleep. This is the story he told.
        - id: ch01-b04
          speaker: narrator
          text: Plouhinec stood beside the sea, with a bleak moor stretching all around it. No corn would grow there. The grass was too coarse to fatten any animal. Groves of fir trees rose here and there, and so many little pebbles covered the earth that it almost looked like a beach.
        - id: ch01-b05
          speaker: narrator
          text: On the far side of the moor stood two rows of enormous stones. Long ago, people said, the fairies called korigans had raised them. The stones were so tall and heavy that it seemed impossible even for all the fairies in the world to set them upright.
        - id: ch01-b06
          speaker: narrator
          text: Near this great avenue of stones, beside the little River Intel, lived a man named Marzinne and his sister, Rozennik. They always had black bread to eat, wooden shoes for their feet, and a pig to fatten. Their neighbors thought them rich, and better still, they thought so too.
        - id: ch01-b07
          speaker: narrator
          text: Rozennik was a pretty girl who knew how to make the best of everything. If she had wanted, she could have chosen a husband from among the young men of Plouhinec. But she cared only for Bernez, whom she had played with all her life. Bernez worked hard, but he was terribly poor. Marzinne told him roughly to find a wife somewhere else. No matter what her brother said, Rozennik still smiled and nodded at Bernez as before. When she passed him, she often turned her head and sang pieces of old songs over her shoulder.
    - id: ch02
      title: Voices at Midnight
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On Christmas Eve, all the men who worked for Marzinne or on the nearby farms gathered in his large kitchen. He always invited them on this particular night. First they would eat soup flavored with honey, and rich puddings would follow. A great wooden bowl stood in the middle of the table, with wooden spoons laid in a circle so each man could dip in when his turn came.
        - id: ch02-b02
          speaker: narrator
          text: The benches were full, and Marzinne was about to begin the meal when the door flew open. An old man entered and wished everyone a good appetite. The room fell quiet, and some faces showed fear. They all knew this beggar. People said he was a wizard who put spells on cattle, turned corn black, and made old people die of some unknown cause.
        - id: ch02-b03
          speaker: narrator
          text: Still, it was Christmas Eve. Besides, it seemed wiser not to offend a man who might cast spells. Marzinne invited him in, found him a place at the table, and gave him a wooden spoon like everyone else.
        - id: ch02-b04
          speaker: narrator
          text: There was little conversation after that. Everyone was relieved when supper ended. Then the beggar asked if he might sleep in the stable, saying he would die of cold if left outdoors. Marzinne gave permission rather unwillingly. He handed Bernez the key and told him to unlock the stable door.
        - id: ch02-b05
          speaker: narrator
          text: There was room enough for a dozen beggars inside. Its only occupants were an old donkey and a thin ox. Because the night was bitter, the wizard lay between them for warmth, with a sack of reeds beneath his head.
        - id: ch02-b06
          speaker: narrator
          text: He had walked a long way that day, and even wizards grow tired. In spite of the hard floor, he was almost asleep when midnight rang from the church tower of Plouhinec. The donkey lifted her head, shook her ears, and turned to the ox.
        - id: ch02-b07
          speaker: donkey
          text: Well, dear cousin, how have you been since we talked last Christmas Eve?
        - id: ch02-b08
          speaker: narrator
          text: The ox did not answer at once. He stared at the beggar with deep disgust.
        - id: ch02-b09
          speaker: ox
          text: Why should we talk when a worthless creature like him can hear every word?
          emotion: disgusted
        - id: ch02-b10
          speaker: donkey
          text: Oh, don't waste our time grumbling! Can't you see the wizard is asleep?
          emotion: happy
        - id: ch02-b11
          speaker: ox
          text: All his wicked tricks certainly haven't made him rich. He isn't even clever enough to know what good fortune could come to him a week from now.
        - id: ch02-b12
          speaker: donkey
          text: What good fortune do you mean?
        - id: ch02-b13
          speaker: ox
          text: Don't you know? Once every hundred years, the stones on Plouhinec heath go down to the river to drink. While they're gone, all the treasure beneath them lies uncovered.
        - id: ch02-b14
          speaker: donkey
          text: Ah, now I remember. But the stones hurry back so fast that they'll crush you unless you're holding both crowsfoot and five-leaved trefoil.
        - id: ch02-b15
          speaker: ox
          text: Even those aren't enough. Suppose you escape with treasure. It will crumble into dust unless you give a baptized soul in exchange. A Christian must die before you can enjoy the wealth of Plouhinec.
        - id: ch02-b16
          speaker: narrator
          text: The donkey was about to ask another question when her voice suddenly failed. Their time for speaking was over.
        - id: ch02-b17
          speaker: wizard
          text: Ah, my dear creatures, you'll make me richer than the richest men in Vannes or Lorient. I can't waste a moment. Tomorrow I begin hunting for those precious plants.
        - id: ch02-b18
          speaker: narrator
          text: The beggar had heard everything.
    - id: ch03
      title: The Two Magic Plants
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: He did not dare search near Plouhinec. Someone who knew the old tale might guess what he was doing. Instead, he traveled south, where the air was milder and plants stayed green.
        - id: ch03-b02
          speaker: narrator
          text: From the instant daylight came until the last glow faded from the sky, he searched every inch of ground where the magic plants might grow. He scarcely allowed himself a moment to eat or drink. At last, in a little hollow, he found the crowsfoot.
        - id: ch03-b03
          speaker: narrator
          text: That was a great success, but crowsfoot alone was useless. He still needed the trefoil, and his time was running out.
        - id: ch03-b04
          speaker: narrator
          text: He had nearly given up hope when, on the final day before he had to leave for Plouhinec, he spotted a small clump of trefoil half hidden beneath a rock. He tore up the plant and sat down, hardly able to breathe from excitement. Then he searched it eagerly. He tossed away leaf after leaf in disgust and had almost reached the end when he cried out with joy. The five-leaved trefoil was in his hand.
        - id: ch03-b05
          speaker: narrator
          text: The beggar scrambled to his feet and, without pausing, hurried onto the road that led north. Under the bright moon he walked steadily for hours. He did not know how many miles he had covered, and he no longer felt tired.
        - id: ch03-b06
          speaker: narrator
          text: By and by, the sun rose and the world began to stir around him. He stopped at a farmhouse door and asked for a cup of milk, a slice of bread, and permission to rest for a while in the porch. After that short rest, he continued his journey. Near sunset on New Year's Eve, he reached Plouhinec again.
    - id: ch04
      title: Bernez and the Cross
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: As the beggar passed the long rows of stones, he saw Bernez working with a chisel on the tallest stone of all.
        - id: ch04-b02
          speaker: wizard
          text: What are you doing there? Are you hollowing out a bed for yourself in that enormous pillar?
        - id: ch04-b03
          speaker: bernez
          text: No. I had no work today, so I decided to carve a cross on this stone. A holy sign can always do some good.
        - id: ch04-b04
          speaker: wizard
          text: I suppose you expect it to help you win Rozennik!
        - id: ch04-b05
          speaker: narrator
          text: The old man laughed. Bernez stopped carving for a moment and looked at him.
        - id: ch04-b06
          speaker: bernez
          text: So you know about that. The trouble is, Marzinne wants a brother-in-law with more pounds than I have pennies.
        - id: ch04-b07
          speaker: narrator
          text: The sorcerer glanced around to be sure no one could hear him, then lowered his voice.
        - id: ch04-b08
          speaker: wizard
          text: What if I gave you more pounds than Marzinne has ever imagined?
        - id: ch04-b09
          speaker: bernez
          text: You would give them to me?
          emotion: surprised
        - id: ch04-b10
          speaker: wizard
          text: Yes. I would.
        - id: ch04-b11
          speaker: bernez
          text: Then what must I do for the money?
        - id: ch04-b12
          speaker: narrator
          text: Bernez knew very well that a Breton peasant gives nothing for nothing.
        - id: ch04-b13
          speaker: wizard
          text: What I need from you takes only a little courage.
        - id: ch04-b14
          speaker: bernez
          text: If courage is all you need, tell me what to do. I'll do it. I'd risk thirty deaths for the chance.
        - id: ch04-b15
          speaker: narrator
          text: Bernez dropped his chisel as he spoke. Once the beggar saw that the young man would cause no trouble, he explained that the treasure beneath the stones would be uncovered during that very night. The stones would leave their places, and for a few short minutes, the two men could take enough treasure to make them rich for the rest of their lives.
        - id: ch04-b16
          speaker: narrator
          text: But the beggar said nothing about what would happen to a man without crowsfoot and trefoil. Bernez believed that they needed only courage and speed.
        - id: ch04-b17
          speaker: bernez
          text: Old man, I'm truly grateful for this chance. Whenever you need it, a pint of my blood will be yours. Let me finish this cross. It's nearly done. Then I'll meet you in the fir wood whenever you say.
        - id: ch04-b18
          speaker: wizard
          text: Be there without fail one hour before midnight.
        - id: ch04-b19
          speaker: narrator
          text: With that, the wizard went on his way.
    - id: ch05
      title: The Treasure Beneath the Stones
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At the appointed hour, the great church clock in Plouhinec rang out, and Bernez entered the fir wood. The beggar was already waiting for him. He had come prepared to carry away a great deal, with a bag in each hand and a third hanging around his neck.
        - id: ch05-b02
          speaker: wizard
          text: You came on time, but we don't need to start yet. Sit down and think about what you'll do when your pockets are full of gold, silver, and jewels.
        - id: ch05-b03
          speaker: bernez
          text: That won't take long. I'll give Rozennik everything she could want. She'll have every kind of dress, from cotton to silk, and every kind of good food, from white bread to oranges.
        - id: ch05-b04
          speaker: wizard
          text: The silver will pay for all that. What will you do with the gold?
        - id: ch05-b05
          speaker: bernez
          text: With the gold, I'll make Rozennik's family rich, along with every friend she has in the parish.
        - id: ch05-b06
          speaker: wizard
          text: That takes care of the gold. What about the jewels?
        - id: ch05-b07
          speaker: bernez
          text: I'll share the jewels with everyone in the world, so they can all be rich and happy. And I'll tell them it was Rozennik's wish.
        - id: ch05-b08
          speaker: wizard
          text: Hush. Midnight is almost here. We must go.
        - id: ch05-b09
          speaker: narrator
          text: Together they crept to the edge of the wood.
        - id: ch05-b10
          speaker: narrator
          text: At the first stroke of twelve, a tremendous noise rolled across the silent heath. The earth seemed to sway beneath the two watchers' feet. Then, in the moonlight, they saw the huge stones tear themselves from the ground. The stones hurried down the slope toward the river, knocking into one another in their haste.
        - id: ch05-b11
          speaker: narrator
          text: They passed the place where Bernez and the beggar stood, then vanished into the darkness. It was like watching a procession of giants.
        - id: ch05-b12
          speaker: wizard
          text: Quick!
        - id: ch05-b13
          speaker: narrator
          text: The wizard rushed toward the empty holes. Even in the darkness, they shone brightly with the treasure inside. He flung himself onto his knees and began filling the bags he had brought. All the while, he listened closely for the sound of the stones returning up the hill. Bernez moved more slowly, taking handfuls of everything he could see and putting them into his pockets.
        - id: ch05-b14
          speaker: narrator
          text: The sorcerer had just closed his third bag. He was wondering whether he could carry still more when a low rumble reached him, like a storm far away.
        - id: ch05-b15
          speaker: narrator
          text: The stones had finished drinking. They were racing home.
    - id: ch06
      title: The Baptized Stone
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: On they came, leaning slightly forward, with the tallest stone in front. They smashed everything in their path. Bernez stared at them in horror, unable to move.
        - id: ch06-b02
          speaker: bernez
          text: We're lost! They'll crush us to death!
          emotion: fearful
        - id: ch06-b03
          speaker: wizard
          text: They won't crush me. This crowsfoot and five-leaved trefoil will protect me. But to keep my riches, I had to offer the stones a Christian. An evil fate sent you into my path.
        - id: ch06-b04
          speaker: narrator
          text: The sorcerer held the magic plants out toward the charging stones. At once, the monstrous things divided to his right and left, as though they recognized a power stronger than their own. Then they closed ranks again as they came toward Bernez.
        - id: ch06-b05
          speaker: narrator
          text: The young man did not try to run. He knew there was no escape. He sank to his knees and shut his eyes.
        - id: ch06-b06
          speaker: narrator
          text: Suddenly, the leading stone stopped directly in front of him. None of the others could get past.
        - id: ch06-b07
          speaker: narrator
          text: This was the stone where Bernez had carved the cross. Now it was a baptized stone, and it had the power to save him.
        - id: ch06-b08
          speaker: narrator
          text: The tall stone stayed in front of the kneeling young man, blocking the way until every other stone had returned to its place. Only then did it move. It darted toward its own empty hole like a bird flying home.
        - id: ch06-b09
          speaker: narrator
          text: The beggar was staggering along beneath the weight of his treasure, certain that he was safe. When he saw the stone coming, he stretched out the magic plants. But the baptized stone was no longer bound by the spells that ruled the others. It went straight on and left the wizard crushed to powder among the heather.
        - id: ch06-b10
          speaker: narrator
          text: Bernez went home and showed his riches to Marzinne. This time, Marzinne accepted him as a brother-in-law. Bernez and Rozennik were married, and they lived happily ever after.
