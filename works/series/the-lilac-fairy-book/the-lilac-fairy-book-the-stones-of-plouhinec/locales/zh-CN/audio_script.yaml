audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    donkey:
      display_name: 驴子
      tts:
        delivery: 快活健谈，催促同伴时轻巧而亲热
        timbre: 明亮爽利的成年女声
        pace: 轻快
        pitch: 中高
    ox:
      display_name: 牛
      tts:
        delivery: 粗声直言，语气不耐烦又带着老成
        timbre: 低沉浑厚的成年男声
        pace: 偏慢
        pitch: 低
    wizard:
      display_name: 巫师
      tts:
        delivery: 阴沉狡猾，诱骗别人时刻意压低声音
        timbre: 干涩苍老的男声
        pace: 适中
        pitch: 中低
    bernez:
      display_name: 贝尔内兹
      tts:
        delivery: 朴实坦荡，谈到罗泽尼克时热切真诚
        timbre: 清朗结实的年轻男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 荒原上的传说
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你们也许读过《肯尼斯，又名〈大军后卫〉》。书里有两个苏格兰孩子，他们流落俄国以后，受到法国士兵照料。那场可怕的大撤退又冷又苦，士兵们总想法子让孩子少受一点罪。
        - id: ch01-b02
          speaker: narrator
          text: 有个布列塔尼士兵，常在营火边讲故乡的故事，好让孩子忘掉寒冷和饥饿。最暖和的位置总留给他们，可严寒还是冻得他们直发抖。每到这时候，士兵就会开口说，普卢伊内克是海边的一座小镇，靠近埃讷邦。等肯尼斯或埃菲心急地问上一句，他便忘了母亲当年是怎么讲的，只好从头再来。故事因此讲得很长，讲完时，孩子们也该裹上找得到的毯子衣物睡觉了。现在，我也把这个故事讲给你们听。
        - id: ch01-b03
          speaker: narrator
          text: 普卢伊内克四周是一片荒凉的石楠原。那里种不出庄稼，草又粗又硬，牲口怎么吃也养不肥。几片冷杉林散落在原野上，小石子密密铺了一地，看着几乎像海滩。荒原另一头立着两排巨石。当地人说，那是仙子，也就是科里甘，在很久以前竖起来的。石头那么高，那么重，仿佛全世界的仙子一起动手，也立不起它们。
        - id: ch01-b04
          speaker: narrator
          text: 离巨石阵不远，安泰尔河边住着马尔津和妹妹罗泽尼克。他们有足够的黑面包吃，有木鞋穿，还养得起一头猪。邻居觉得他们很富，他们自己也这样觉得。
        - id: ch01-b05
          speaker: narrator
          text: 罗泽尼克漂亮又能干，普卢伊内克的年轻人尽可以由她挑一个做丈夫。可她只喜欢从小一起长大的贝尔内兹。贝尔内兹干活很卖力，却穷得叮当响。马尔津粗声叫他到别处找妻子去。罗泽尼克可不管哥哥怎么说。她照旧向贝尔内兹微笑点头，从他身边走过时，还常回过头，越过肩头哼几句老歌。
        - id: ch01-b06
          speaker: narrator
          text: 圣诞前夜，马尔津手下和附近农庄的雇工都聚到他的大厨房里。每逢这个晚上，他们会受邀来吃蜂蜜浓汤和丰盛的布丁。桌子中央摆着大木盆，木勺围成一圈，大家轮流舀汤。长凳已经坐满，马尔津正要叫众人开吃，门忽然开了。一个老乞丐走进来，祝大家胃口大开。
        - id: ch01-b07
          speaker: narrator
          text: 屋里顿时安静下来，有几个人脸上还带着害怕。大家都认得他。据说他是个巫师，会咒坏牲口，让庄稼发黑，还会叫老人无缘无故死去。可那毕竟是圣诞前夜，得罪他也不好。马尔津只得请他坐下，给了他一把和别人一样的木勺。
        - id: ch01-b08
          speaker: narrator
          text: 从那以后，饭桌上便没有多少话了。饭一吃完，人人都松了口气。乞丐请求在牲口棚里睡一夜，说留在外面准会冻死。马尔津虽然不情愿，还是答应了，叫贝尔内兹拿钥匙开门。棚里只有一头老驴和一头瘦牛，再睡十二个乞丐也够宽敞。那夜冷得刺骨，巫师躺在两头牲口中间，把一袋芦苇当作枕头。

    - id: ch02
      title: 午夜的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 巫师当天赶了很远的路。巫师也会累，地面虽硬，他还是快要睡着了。这时，普卢伊内克教堂敲响午夜的钟声。驴子抬起头，抖抖耳朵，转向那头牛。
        - id: ch02-b02
          speaker: donkey
          text: “亲爱的表兄，去年圣诞前夜我们聊过以后，你这一年过得怎么样？”
        - id: ch02-b03
          speaker: narrator
          text: 牛没有马上回答。他满眼厌恶，盯着乞丐看了好一阵。
        - id: ch02-b04
          speaker: ox
          text: “这种没用的东西躺在旁边，能听见我们说的每句话，还有什么好谈的？”
        - id: ch02-b05
          speaker: donkey
          text: “别只顾着抱怨，时间都要叫你浪费了。你没看见吗？巫师睡着了。”
        - id: ch02-b06
          speaker: ox
          text: “他干了那么多坏事，也没给自己挣来财富。他还蠢得很，根本不知道再过一个星期，会有一场怎样的好运落到头上。”
        - id: ch02-b07
          speaker: donkey
          text: “什么好运？”
        - id: ch02-b08
          speaker: ox
          text: “你连这个也忘了吗？每隔一百年，普卢伊内克荒原上的巨石就会走到河里喝水。它们一离开，石头底下的财宝全会露出来。”
        - id: ch02-b09
          speaker: donkey
          text: “啊，我记起来了。可是它们转眼就会回来。手里要是没有一束毛茛和一株五叶苜蓿，人准会被活活压死。”
        - id: ch02-b10
          speaker: ox
          text: “有那两样也不够。就算平安出来了，如果不交出一个受过洗礼的灵魂，带走的财宝还是会化成尘土。必须有一个基督徒死去，普卢伊内克的财富才能真正归你。”
        - id: ch02-b11
          speaker: narrator
          text: 驴子还想再问，却忽然说不出话来。准许牲口交谈的时刻已经过去了。
        - id: ch02-b12
          speaker: wizard
          text: “我亲爱的畜生们，你们这下可要让我比瓦讷和洛里昂最富的人还富了。时间不能浪费，明天我就去找那两种宝贝草药。”
        - id: ch02-b13
          speaker: narrator
          text: 巫师果然什么都听见了。他不敢在普卢伊内克附近寻找，生怕知道传说的人看出他的用意，便一路往南走。那里的空气暖和，草木四季常青。从天亮到最后一缕霞光消失，他把魔草可能生长的地方一寸寸搜遍，连吃喝都几乎顾不上。终于，他在一个小洼地里找到毛茛。可只有毛茛，没有五叶苜蓿，依旧毫无用处。留给他的时间已经很少了。
        - id: ch02-b14
          speaker: narrator
          text: 他几乎绝望了。就在必须动身回普卢伊内克的前一天，他看见岩石下面藏着一小丛苜蓿。巫师激动得喘不过气，连根拔起那丛草，坐下来急急翻找。一片叶子，又一片叶子，都被他嫌恶地扔开。眼看就要翻到底，他突然欢呼起来。五叶苜蓿终于握在他手里。
        - id: ch02-b15
          speaker: narrator
          text: 乞丐一跃而起，沿着北去的大路快步赶路。明亮的月光陪了他几个钟头。他不知道已经走了多少英里，也感觉不到疲倦。太阳升起后，周围渐渐有了动静。他在一户农舍门口讨来一杯牛奶和一片面包，又在门廊歇了一会儿，随后继续走。除夕日落前，他终于回到普卢伊内克。

    - id: ch03
      title: 巫师的邀约
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 经过长长的巨石阵时，乞丐看见贝尔内兹拿着凿子，正在最高的巨石上刻东西。
        - id: ch03-b02
          speaker: wizard
          text: “你在那儿干什么？难道想在那根大石柱里给自己凿一张床？”
        - id: ch03-b03
          speaker: bernez
          text: “不是。今天碰巧没有活，我就来给这块石头刻个十字架。神圣的标记放在哪里都不会有坏处。”
        - id: ch03-b04
          speaker: wizard
          text: “我看啊，你是盼着它帮你娶到罗泽尼克。”
        - id: ch03-b05
          speaker: narrator
          text: 贝尔内兹停下手里的活，看了老头一会儿。
        - id: ch03-b06
          speaker: bernez
          text: “原来你也听说了。可惜马尔津想找的妹夫，得有数不清的英镑。我呢，只有几枚数得清的便士。”
        - id: ch03-b07
          speaker: wizard
          text: “要是我给你的英镑，比马尔津梦里见过的还多呢？”
        - id: ch03-b08
          speaker: narrator
          text: 巫师说得很轻，还四下看了看，确定没人偷听。
        - id: ch03-b09
          speaker: bernez
          text: “你能给我？”
        - id: ch03-b10
          speaker: wizard
          text: “对，我能。”
        - id: ch03-b11
          speaker: bernez
          text: “那我得为这笔钱做什么？”
        - id: ch03-b12
          speaker: narrator
          text: 贝尔内兹很清楚，布列塔尼农民从不会白送别人东西。
        - id: ch03-b13
          speaker: wizard
          text: “我只要你拿出一点胆量。”
        - id: ch03-b14
          speaker: bernez
          text: “如果只要胆量，你就直说该怎么做吧，我一定去办。哪怕要冒三十次丧命的险，我也不怕！”
        - id: ch03-b15
          speaker: narrator
          text: 贝尔内兹一激动，凿子落在了地上。乞丐看出他绝不会退缩，便告诉他，当天夜里巨石会离开，地下的财宝也会露出来。他们只要抓紧短短几分钟，就能拿到足以富裕一生的金银。他却没有说，手里没有毛茛和五叶苜蓿的人会怎样。贝尔内兹还以为，只需胆大手快就够了。
        - id: ch03-b16
          speaker: bernez
          text: “老人家，谢谢你把这个机会给我。往后只要你需要，我随时可以给你一品脱血。让我先把十字架刻完，已经快好了。你定个时辰，我准会去冷杉林里找你。”
        - id: ch03-b17
          speaker: wizard
          text: “午夜前一个钟头，一定要到。”
        - id: ch03-b18
          speaker: narrator
          text: 巫师说完便上路了。

    - id: ch04
      title: 金银与珠宝
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 教堂敲响约定的钟点，贝尔内兹走进树林。乞丐已经等在那里了，两手各提一只袋子，脖子上还挂着第三只。
        - id: ch04-b02
          speaker: wizard
          text: “你来得很准时。不过还不用马上走。先坐下来想想吧，等口袋里装满金子、银子和珠宝，你要拿它们做什么？”
        - id: ch04-b03
          speaker: bernez
          text: “这不用想很久。罗泽尼克想要什么，我就给她什么。衣服从棉布的买到丝绸的，好吃的从白面包买到橙子，样样都给她备齐。”
        - id: ch04-b04
          speaker: wizard
          text: “这些用银子就能买到。那金子怎么花？”
        - id: ch04-b05
          speaker: bernez
          text: “我会让罗泽尼克的亲戚，还有她在这个教区里的每一个朋友，全都富起来。”
        - id: ch04-b06
          speaker: wizard
          text: “金子也安排好了。珠宝呢？”
        - id: ch04-b07
          speaker: bernez
          text: “我要把珠宝分给世上的每一个人，让大家都富足快乐。我还要告诉他们，这都是罗泽尼克的心愿！”
        - id: ch04-b08
          speaker: wizard
          text: “嘘，快到午夜了。我们走。”
        - id: ch04-b09
          speaker: narrator
          text: 两个人悄悄来到树林边缘。十二点的第一声钟响落下，寂静的荒原突然传来巨响，他们脚下的大地也像是摇晃起来。借着月光，只见附近的巨石一块块离开原位，沿着山坡往河边走。它们彼此碰撞，砰砰作响，从两人藏身的地方经过，消失在黑暗里，就像一队巨人列队走了过去。
        - id: ch04-b10
          speaker: wizard
          text: “快！”
        - id: ch04-b11
          speaker: narrator
          text: 巫师低喝一声，冲向留下的空洞。洞里的财宝在夜色中闪闪发亮。他跪在地上，拼命把东西塞进袋子，同时竖起耳朵，听着山坡下有没有动静。贝尔内兹慢一些，只把看见的财宝一把把装进口袋。
        - id: ch04-b12
          speaker: narrator
          text: 巫师扎好第三只袋子，还在盘算能不能再多拿一点，忽然听见低沉的轰鸣，像是远方的风暴逼近了。

    - id: ch05
      title: 受过洗礼的石头
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 巨石已经喝足了水，正在赶回自己的位置。它们微微向前倾着身子，最高的石头走在最前面，一路撞碎所有挡路的东西。贝尔内兹看着它们冲来，吓得一动也不能动。
        - id: ch05-b02
          speaker: bernez
          text: “我们完了！它们会把我们压死！”
          emotion: fearful
        - id: ch05-b03
          speaker: wizard
          text: “我可不会。有毛茛和五叶苜蓿保护我。可是我要保住财富，就得把一个基督徒献给巨石。只能怪你的命不好，偏偏叫我遇见了你。”
        - id: ch05-b04
          speaker: narrator
          text: 巫师把两种魔草伸向迅速逼近的石群。那些庞然大物像是承认了更强的力量，立刻从他左右分开。可它们来到贝尔内兹面前，又合成一列。
        - id: ch05-b05
          speaker: narrator
          text: 贝尔内兹没有逃。他知道逃也没用，便跪在地上，闭起眼睛。就在这时，领头的高大巨石突然停住，直直立在他面前。后面的石头谁也没法越过它。
        - id: ch05-b06
          speaker: narrator
          text: 那正是贝尔内兹刻过十字架的石头。它已经受过洗礼，也因此有了救他的力量。
        - id: ch05-b07
          speaker: narrator
          text: 它守在年轻人身前，直到其余巨石都回到原位。随后，它像一只鸟那样飞向自己的石穴。路上，那个乞丐正背着沉重的财宝，摇摇晃晃地走着，还以为自己已经平安无事。
        - id: ch05-b08
          speaker: narrator
          text: 乞丐看见巨石逼近，赶紧举起魔草。可这块受过洗礼的石头，已经不受那些魔法束缚。它笔直冲回原位，把巫师碾成了石楠丛里的一撮粉末。

    - id: ch06
      title: 罗泽尼克的婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 贝尔内兹回到家，把自己的财富拿给马尔津看。这一次，马尔津不再拒绝让他做妹夫。贝尔内兹终于娶了罗泽尼克，两个人从此永远幸福地生活在一起。
        - id: ch06-b02
          speaker: narrator
          text: 这个故事选自埃米尔·苏韦斯特的《布列塔尼传说》。
