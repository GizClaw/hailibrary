audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 病弱而清醒，嘱托时庄重坚定
        timbre: 柔和虚弱的成年女声
        pace: 缓慢
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严朴直，对儿子说话时温和爽快
        timbre: 浑厚的成年男声
        pace: 适中
        pitch: 中低
    kilweh:
      display_name: 基尔韦
      tts:
        delivery: 年轻自信，求婚之志坚决，受挫时容易急躁
        timbre: 清朗有力的年轻男声
        pace: 适中偏快
        pitch: 中
    glewlwyd:
      display_name: 格勒维德
      tts:
        delivery: 守礼而机警，禀报时郑重
        timbre: 清晰稳健的成年男声
        pace: 适中
        pitch: 中低
    arthur:
      display_name: 亚瑟
      tts:
        delivery: 宽宏威严，承诺时坚定从容
        timbre: 洪亮沉稳的成年男声
        pace: 从容
        pitch: 中低
    kai:
      display_name: 凯
      tts:
        delivery: 果敢敏捷，话语直接，临敌时机智镇定
        timbre: 坚实锐利的成年男声
        pace: 适中偏快
        pitch: 中
    bedwyr:
      display_name: 贝德维尔
      tts:
        delivery: 沉着勇敢，合声时坚定有力
        timbre: 稳健的成年男声
        pace: 适中
        pitch: 中低
    gwrhyr:
      display_name: 格里尔
      tts:
        delivery: 谨慎聪敏，询问鸟兽时清楚而有礼
        timbre: 清亮的成年男声
        pace: 适中
        pitch: 中
    custennin:
      display_name: 库斯泰宁
      tts:
        delivery: 饱经苦难，警告来客时急切严肃
        timbre: 粗哑疲惫的成年男声
        pace: 适中
        pitch: 低
    custennin_wife:
      display_name: 库斯泰宁的妻子
      tts:
        delivery: 慈爱而忧惧，谈起孩子时压着悲痛
        timbre: 温厚沧桑的成年女声
        pace: 舒缓
        pitch: 中低
    olwen:
      display_name: 奥尔温
      tts:
        delivery: 温柔清醒，面对命运时坦然坚定
        timbre: 明净柔和的年轻女声
        pace: 适中
        pitch: 中高
    yspaddaden:
      display_name: 伊斯帕达登
      tts:
        delivery: 阴险暴躁，受伤时夸张怨毒，设难时步步紧逼
        timbre: 粗重阴沉的老年男声
        pace: 适中偏慢
        pitch: 低
    black_man:
      display_name: 黑衣人
      tts:
        delivery: 冷峻警惕，警告来客时简短郑重
        timbre: 低沉的成年男声
        pace: 适中
        pitch: 低
    giant_porter:
      display_name: 巨人城堡的守门人
      tts:
        delivery: 戒备森严，照规矩办事
        timbre: 粗厚的成年男声
        pace: 适中
        pitch: 低
    gwrnach:
      display_name: 格尔纳赫
      tts:
        delivery: 傲慢粗豪，见到好手艺时毫不掩饰赞叹
        timbre: 洪亮厚重的成年男声
        pace: 偏慢
        pitch: 低
    ousel:
      display_name: 乌鸫
      tts:
        delivery: 古老温和，回忆悠远岁月时不疾不徐
        timbre: 清脆而苍老的女声
        pace: 舒缓
        pitch: 中高
    stag:
      display_name: 雷丁弗雷的雄鹿
      tts:
        delivery: 沉静厚道，言语带着漫长岁月的重量
        timbre: 醇厚的成年男声
        pace: 舒缓
        pitch: 低
    owl:
      display_name: 库姆·考尔维德的猫头鹰
      tts:
        delivery: 苍老睿智，叙述往事时缓慢清楚
        timbre: 沙哑的老年男声
        pace: 缓慢
        pitch: 中低
    eagle:
      display_name: 格温修道院的鹰
      tts:
        delivery: 高傲而坦率，讲起旧战时仍有锋芒
        timbre: 高亢苍劲的老年男声
        pace: 适中
        pitch: 中高
    salmon:
      display_name: 林·利乌的鲑鱼
      tts:
        delivery: 深沉稳重，答复使者时坦荡可靠
        timbre: 深厚平稳的成年男声
        pace: 舒缓
        pitch: 低
    mabon:
      display_name: 马邦
      tts:
        delivery: 困顿却不屈，求自由时坚决有力
        timbre: 略带疲惫的年轻男声
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 命定的新娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王和王后生了个男孩，取名基尔韦。孩子出生不久，王后便病倒了。她无力照料儿子，就把他送到山里一位熟识的妇人那里。她盼着孩子能在风霜冷热中长大，练出强健的身体。基尔韦在那里过得很快活，常和伙伴们赛跑、爬山。冬天下雪时，会有携竖琴的旅人前来借宿，为孩子们唱起久远年代里的奇事。
        - id: ch01-b02
          speaker: narrator
          text: 可在父亲的宫廷里，变故早已来临。王后的病越来越重。临终前，她把国王叫到床边。
        - id: ch01-b03
          speaker: queen
          text: “我再也起不来了。以后你会另娶妻子，可我怕她叫你忘了自己的儿子。请你答应我，只有看见我的坟上长出一株开着两朵花的野蔷薇，你才能再娶。”
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 国王答应了。王后又要他照管坟墓，不许任何草木长在那里，国王也答应了。王后去世后，一连七年，他每天早晨都派人查看她的坟。七年过去，国王忘了这项嘱托。一天，他打猎经过墓地，看见坟上果真长着一株野蔷薇，开了两朵花。
        - id: ch01-b05
          speaker: king
          text: “看来，我该再娶一位妻子了。”
        - id: ch01-b06
          speaker: narrator
          text: 国王寻觅许久，终于再婚，却没有告诉新王后自己还有个儿子。就连他自己也几乎忘了。后来，新王后去拜访一位老妇人，才偶然听说此事。她十分欢喜，立即派使者到山里接回基尔韦。年轻人从此住进父亲的宫廷，年复一年，渐渐长大。一天，王后告诉他，预言早已定下，他将娶伊斯帕达登·彭考尔的女儿奥尔温为妻。基尔韦既骄傲又开心。他想，若自己还不是个男子汉，别人怎会谈起婚事？从早到晚，他只想着那位命定的新娘会是什么模样，连父亲交代的事情也忘了。
        - id: ch01-b07
          speaker: king
          text: “儿子，你究竟怎么了？我交代你的事情，你都忘记了。”
        - id: ch01-b08
          speaker: kilweh
          text: “继母说，我若娶妻，只能娶伊斯帕达登·彭考尔的女儿奥尔温。”
        - id: ch01-b09
          speaker: king
          text: “这不难。亚瑟王是你的表兄。去找他，请他替你修剪头发，再求他赐下这个恩典。”
        - id: ch01-b10
          speaker: narrator
          text: 基尔韦立刻出发。他骑着一匹四岁的菊花青马，马笼头由一枚枚金环相扣，马鞍也装饰着黄金。他手里握着两支银制长矛，矛尖却是精钢打造。肩头斜挂一只象牙战号，腰间还佩着一把金剑。两条灰色猎犬跑在前面，身上带着斑纹，胸口雪白，颈上各有一圈红宝石。左边的狗跃到右边，右边的又蹿向左边，像两只海燕绕着主人嬉戏。骏马每一只蹄子都扬起一块草皮，四块草皮也像四只燕子，在基尔韦头边忽上忽下。他披着紫色长袍，四个袍角各缀一只金苹果，每一只都价值百头牛。那马的脚步轻得连草叶也没有压弯，就这样一路来到亚瑟宫殿门前。
        - id: ch01-b11
          speaker: kilweh
          text: “有人守门吗？快来替我开门！”
        - id: ch01-b12
          speaker: glewlwyd
          text: “有人。我叫格勒维德，每年一月的第一天替亚瑟守门。其余日子另有别人，其中有个彭平吉翁，总用头走路，好省下两只脚。”
        - id: ch01-b13
          speaker: kilweh
          text: “那就开门吧。”
        - id: ch01-b14
          speaker: glewlwyd
          text: “我不能开。只有国王的儿子，或是带货来卖的行商，才准进去。不过别处会有人给狗喂食，给马添草。你也能在客房里吃到煎肉和甜酒。”
        - id: ch01-b15
          speaker: kilweh
          text: “我不要那些。你若不开门，我便连喊三声，让声音从康沃尔传到北方，再传到爱尔兰！”
        - id: ch01-b16
          speaker: glewlwyd
          text: “任你怎样叫喊，我也得先禀告亚瑟，才能放你进来。”
        - id: ch01-b17
          speaker: narrator
          text: 格勒维德进入大厅。亚瑟问门外有什么消息。
        - id: ch01-b18
          speaker: glewlwyd
          text: “我走过本岛，也走过海外，见过许多有王者气度的人。可门外这位客人的威仪，无人能比。”
        - id: ch01-b19
          speaker: arthur
          text: “你若是走进来的，就跑着回去。让每一个会睁眼闭眼的人都敬重他、服侍他。这样的人不该留在风吹雨打之中。”
        - id: ch01-b20
          speaker: narrator
          text: 格勒维德取下门闩，基尔韦骑着骏马进了宫。他先向这片土地的君主致敬，又向大厅里的所有人问候，无论地位最高还是最低，一个也没有漏下。亚瑟同样向他致意，请他坐到两位勇士之间。只要基尔韦愿意留在宫里，便会有乐师在面前奏乐，凡是一个生来该做国王的人应当享有的东西，亚瑟都会拿来款待他。
        - id: ch01-b21
          speaker: kilweh
          text: “我不是为吃喝而来。我想求一项恩典。你若答应，我会报答你，也会把你的美名传向四方。你若不答应，凡知道你名字的地方，我都会诉说你的无礼。”
        - id: ch01-b22
          speaker: arthur
          text: “在风能吹干、雨能润湿、太阳能巡行、海洋能环绕、大地能延展的地方，你所求的，我都赐给你。只有我的船和斗篷、誓言和长矛、盾牌和匕首，还有我的妻子桂妮薇，不能给你。”
        - id: ch01-b23
          speaker: kilweh
          text: “请你为我的头发赐福。”
        - id: ch01-b24
          speaker: narrator
          text: 亚瑟答应了，命人拿来金梳和银环剪刀，亲手替客人梳理头发。他越看越觉亲近，便问年轻人的身份。
        - id: ch01-b25
          speaker: kilweh
          text: “我是基利德的儿子基尔韦。”
        - id: ch01-b26
          speaker: arthur
          text: “原来你真是我的表弟。无论还想求什么，我都会答应。”
        - id: ch01-b27
          speaker: kilweh
          text: “请替我赢得伊斯帕达登·彭考尔的女儿奥尔温。我也向你的勇士们求助。索尔能整天单脚站立。奥索尔站上世间最高的山，也能在鸟儿振翅间把它踏平。克卢斯哪怕埋在地下，也听得见五十英里外的蚂蚁爬出巢穴。我向他们，也向凯、贝德维尔和你所有的勇士请求这项恩典。”
        - id: ch01-b28
          speaker: arthur
          text: “我没听说过这位姑娘，也不知道她的亲族。你若肯给我时间，我就派人寻找。”
        - id: ch01-b29
          speaker: narrator
          text: 基尔韦答应等到年底。可一年过去，使者们空手而归，他便对亚瑟说了许多粗暴的话。勇士中最大胆、脚程最快的凯站了出来。他能九夜不睡，也能在水下待上九天。
        - id: ch01-b30
          speaker: kai
          text: “鲁莽的小子，你竟敢这样对亚瑟说话？跟我们走。除非替你赢得那位姑娘，或是你亲口承认世上没有她，我们绝不与你分开。”

    - id: ch02
      title: 奥尔温与三支毒镖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 亚瑟派出五位最出色的勇士。独手的贝德维尔是凯的战友，在不列颠跑得仅次于亚瑟。金德利格走进陌生土地，也像在故乡一样认路。格里尔通晓所有语言。圭亚尔之子格瓦赫迈不达目的绝不回头。门乌能施法隐藏众人的身形，让他们看见别人，别人却看不见他们。加上凯与基尔韦，一行七人上了路。
        - id: ch02-b02
          speaker: narrator
          text: 他们来到一片辽阔平原，看见一座美丽城堡。城堡看似很近，众人却走到第三天傍晚才真正靠近。前方羊群漫无边际，一个牧羊人站在土丘上，身旁的大狗足有一匹九岁马那么大。
        - id: ch02-b03
          speakers: [kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: “牧人，那是谁的城堡？”
        - id: ch02-b04
          speaker: custennin
          text: “你们可真糊涂。全世界都知道，那是伊斯帕达登·彭考尔的城堡。”
        - id: ch02-b05
          speaker: kai
          text: “你又是谁？”
        - id: ch02-b06
          speaker: custennin
          text: “我是他的弟弟库斯泰宁，他待我狠毒极了。你们是什么人？来这里做什么？”
        - id: ch02-b07
          speakers: [kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: “我们奉亚瑟王之命，来找伊斯帕达登的女儿奥尔温。”
        - id: ch02-b08
          speaker: custennin
          text: “趁现在还来得及，赶快回头！从前也有人来完成这项使命，可没有一个活着回去。”
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: 牧羊人说着便要离开。基尔韦递给他一枚金戒指。他往手指上一套，戒指太小，只好收进手套，拿回家交给妻子。
        - id: ch02-b10
          speaker: custennin_wife
          text: “这戒指从哪里来的？这样的好运可从来不会落到你头上。”
        - id: ch02-b11
          speaker: custennin
          text: “今晚你就会见到主人。他是基利德之子基尔韦，亚瑟王的表弟。他来这里寻找奥尔温。”
        - id: ch02-b12
          speaker: narrator
          text: 妇人这才知道，基尔韦是自己的外甥。想到就要见到亲人，她的心不由得向他靠拢，一半为这场相逢欢喜，一半又为自己预感到的厄运难过。不久，门外传来脚步声，凯和其余的人进屋，一同吃喝。饭后，妇人走到一口箱子前，打开盖子。一个卷曲金发的年轻人竟从箱子里面走了出来。
        - id: ch02-b13
          speaker: gwrhyr
          text: “把他这样藏起来太可惜了。我知道他没有做过坏事。”
        - id: ch02-b14
          speaker: custennin_wife
          text: “伊斯帕达登已经杀了我的二十三个儿子。我不敢再指望保住这一个。”
          emotion: sad
        - id: ch02-b15
          speaker: kai
          text: “让他跟我走，做我的伙伴。只要我没有被杀，谁也别想杀他。”
        - id: ch02-b16
          speaker: narrator
          text: 妇人答应了，又问众人此行究竟为了什么。凯说，他们要替基尔韦求娶奥尔温，想知道怎样才能见到她。
        - id: ch02-b17
          speaker: custennin_wife
          text: “她每个星期六都来这里洗头，还把所有戒指留在盆里，从不派人回来取。”
        - id: ch02-b18
          speaker: kai
          text: “若是请她，她肯来吗？”
        - id: ch02-b19
          speaker: custennin_wife
          text: “她会来。不过，你们得先保证绝不伤害她，不然我不会去请。”
        - id: ch02-b20
          speakers: [kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: “我们保证。”
        - id: ch02-b21
          speaker: narrator
          text: 妇人把奥尔温请来了。她身穿火焰般鲜艳的丝袍，颈上戴着赤金项圈，祖母绿与红宝石在上面闪闪发亮。她的头发比金雀花更黄，肌肤比海浪的泡沫更白，双手比林间银莲花的花朵还要秀美。无论她走到哪里，每踏下一步，脚印里便生出四片白色三叶草。正因为这个奇迹，人们才叫她奥尔温。姑娘走进屋，在基尔韦身旁的长凳坐下。
        - id: ch02-b22
          speaker: kilweh
          text: “从第一次听见你的名字，我就爱上了你。你愿意跟我离开这个邪恶的地方吗？”
        - id: ch02-b23
          speaker: olwen
          text: “我不能瞒着父亲离开。我答应过他，而我的婚约一旦定下，他的寿命也就到了。命中注定的总会发生。你去向他求婚吧。他要你做什么，你都答应，便能得到我。只要拒绝一件，你就得不到我。到那时，你若能活着逃走，已经算幸运了。”
        - id: ch02-b24
          speaker: kilweh
          text: “我全都答应。”
        - id: ch02-b25
          speaker: narrator
          text: 奥尔温返回城堡，亚瑟的勇士跟着她走进大厅，说明要替基尔韦求亲。
        - id: ch02-b26
          speaker: yspaddaden
          text: “明天再来，我会给你们答复。”
        - id: ch02-b27
          speaker: narrator
          text: 众人听完答复，起身准备离开大厅。伊斯帕达登身旁放着三支毒镖，他突然抓起第一支，朝人群中央狠狠掷去。贝德维尔看得分明，伸手在半空接住毒镖，又使出更大的力气掷了回去。毒镖直直刺进伊斯帕达登的膝盖。
        - id: ch02-b28
          speaker: yspaddaden
          text: “真是个温柔的女婿！这一下害得我一辈子都要跛着走。愿打造毒镖的铁匠和锻造它的铁砧都受诅咒！”
          emotion: angry
        - id: ch02-b29
          speaker: narrator
          text: 当晚众人住在库斯泰宁家。第二天，他们又进城堡，要伊斯帕达登交出女儿，并答应把嫁妆留给他，否则便杀了他。
        - id: ch02-b30
          speaker: yspaddaden
          text: “她的四位高祖母和四位高祖父都还活着。我得先同他们商议。”
        - id: ch02-b31
          speaker: narrator
          text: 众人答应让他商议，转身准备去吃饭。伊斯帕达登又趁他们背朝自己，拿起身旁的第二支毒镖追着掷来。门乌及时接住，立即朝他掷了回去。毒镖扎进伊斯帕达登的胸口，穿透整个身体，从后背冒了出来。
        - id: ch02-b32
          speaker: yspaddaden
          text: “真是个温柔的女婿！这块铁咬得我像水蛭一样疼。愿烧红它的炉膛和铸造它的铁匠都受诅咒！”
          emotion: angry
        - id: ch02-b33
          speaker: narrator
          text: 第三天，众人又来到伊斯帕达登面前。他反倒警告他们不要再向自己投掷东西，除非真想送命。他的眉毛又长又沉，已经垂下来盖住双眼，便叫勇士们替他抬起眉毛，好好看一眼未来的女婿。可众人刚刚起身，他又抓住机会，拿起第三支，也是最后一支毒镖，猛地朝他们投去。基尔韦看准来势，一把接住毒镖，转身便掷了回去。它刺穿伊斯帕达登的一只眼球，又从头颅另一边透了出来。
        - id: ch02-b34
          speaker: yspaddaden
          text: “真是个温柔的女婿！愿锻造毒镖的火焰和打造它的人都受诅咒！”
          emotion: angry

    - id: ch03
      title: 巨人的宝剑
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了一夜，亚瑟的勇士们再次来到宫殿。他们警告伊斯帕达登不要再投毒镖，除非还想承受比眼下更深的痛苦，并叫他别再拖延，干脆交出女儿。伊斯帕达登这才问起，那位真正求娶自己女儿的人究竟在哪里。他要年轻人坐到跟前，让自己亲眼看看。基尔韦便搬来一把椅子坐下，与他面对面交谈。
        - id: ch03-b02
          speaker: yspaddaden
          text: “求娶我女儿的人，就是你吗？”
        - id: ch03-b03
          speaker: kilweh
          text: “正是我。”
        - id: ch03-b04
          speaker: yspaddaden
          text: “先保证你绝不对我做不公正的事。等你替我取来我想要的一切，才能娶我的女儿。”
        - id: ch03-b05
          speaker: kilweh
          text: “我愿意答应。说出你的要求吧。”
        - id: ch03-b06
          speaker: yspaddaden
          text: “看见那座山了吗？你得在一天里把它连根掘起，犁平土地，播下种子，再让谷物成熟。我要用那里的小麦为女儿的婚礼烤糕饼。”
        - id: ch03-b07
          speaker: kilweh
          text: “这很容易办到，虽然你以为不容易。”
        - id: ch03-b08
          speaker: narrator
          text: 基尔韦想起了奥索尔。那人站上世间最高的山，也能立刻把它踏成平地。伊斯帕达登不理会，继续提出条件。
        - id: ch03-b09
          speaker: yspaddaden
          text: “那片田里，我女儿出生时播下九蒲式耳亚麻籽，却连一根芽也没长。你要重新种出亚麻，让她在婚礼上戴上用它织成的面纱。”
        - id: ch03-b10
          speaker: kilweh
          text: “这也容易办到。”
        - id: ch03-b11
          speaker: yspaddaden
          text: “可后面的事，你一定办不到。你得带来格维兹纽·加兰希尔的篮子。那只篮子能让全世界的人吃饱，我要拿它摆你们的婚宴。你还得取来一只永远喝不空的酒角，还有一架只要没人叫停便永远演奏下去的竖琴。特鲁伊斯野猪两耳之间藏着梳子、剪刀和剃刀，你也得把它们取来，让我在婚礼那天整理头发。即使找齐这些，野猪也不会任你拿走。只有幼犬德鲁德温能追猎他。可世上只有坎特·埃温的狗链拴得住德鲁德温，也只有坎哈斯蒂尔的项圈扣得住那条狗链。”
        - id: ch03-b12
          speaker: kilweh
          text: “这些我都能办到，尽管你不相信。”
        - id: ch03-b13
          speaker: yspaddaden
          text: “就算取来这些，仍有你得不到的东西。全世界只有莫德隆之子马邦懂得怎样带着那条狗打猎。可马邦出生才三个夜晚，就有人从母亲与墙壁之间把他抱走了。直到如今，谁也不知道他被关在哪里，甚至不知道他究竟还活着，还是早已死去。哪怕你真能找到马邦，也只有巨人格尔纳赫的宝剑可以杀死那头野猪。你若取不到这把剑，就永远别想得到我的女儿。”
        - id: ch03-b14
          speaker: kilweh
          text: “我会有马，也会有主君亚瑟的骑士。我必将得到你的女儿，而你必将失去性命。”
        - id: ch03-b15
          speaker: narrator
          text: 两人的谈话就此结束。亚瑟的勇士带着基尔韦出发，一直走到世上最大的城堡。一个黑人出来迎接他们。众人问他从哪里来，城堡又属于谁。
        - id: ch03-b16
          speaker: black_man
          text: “全世界都知道，这是巨人格尔纳赫的城堡。进去做客的人，从没有一个活着回来。除非是带手艺来的工匠，谁也进不了门。”
        - id: ch03-b17
          speaker: narrator
          text: 勇士们没把警告放在心上，径直来到大门前。格里尔高声叫门。
        - id: ch03-b18
          speaker: giant_porter
          text: “我不开。”
        - id: ch03-b19
          speaker: kai
          text: “为什么不开？”
        - id: ch03-b20
          speaker: giant_porter
          text: “刀已经切进肉里，酒已经斟入角杯，大厅里正举行欢宴。今晚只准带手艺来的工匠入内。”
        - id: ch03-b21
          speaker: kai
          text: “那我当然能进去。世上没有人比我更会磨亮宝剑。”
        - id: ch03-b22
          speaker: narrator
          text: 守门人进去禀报。格尔纳赫听说后，要他把工匠带进来，因为自己的宝剑正需打磨。凯进门向巨人致意。
        - id: ch03-b23
          speaker: gwrnach
          text: “听说你会磨亮宝剑，是真的吗？”
        - id: ch03-b24
          speaker: kai
          text: “是真的。”
        - id: ch03-b25
          speaker: narrator
          text: 人们把巨人的宝剑交给凯。他从腋下取出磨刀石，问剑身要磨成银白还是青蓝。巨人随他决定。凯很快磨完一半，巨人看得惊叹不已。
        - id: ch03-b26
          speaker: gwrnach
          text: “像你这样有本事的人，竟没有伙伴，实在奇怪。”
        - id: ch03-b27
          speaker: kai
          text: “我有伙伴，尊贵的先生，只是他不会这门手艺。叫守门人出去吧，我告诉他怎么认人。那人的矛头会飞离矛杆，刺伤风，再落回原处。”
        - id: ch03-b28
          speaker: narrator
          text: 守门人走到外面，看见那支长矛的矛头果真离开矛杆，刺得风也流了血，随后又稳稳落回原处。他打开大门，贝德维尔走了进来。城门在他身后关上，留在外面的伙伴顿时议论纷纷。库斯泰宁的儿子戈雷乌终于说服守门人，也带着其余同伴进入城堡。他们没有露面，而是悄悄藏了起来。凯这时磨完了整把宝剑，交还给格尔纳赫。巨人用手仔细摸过剑身，称赞他的手艺，表示十分满意。
        - id: ch03-b29
          speaker: kai
          text: “是剑鞘让你的宝剑生锈了。交给我吧，我把两边的旧木片拆掉，换上新的。”
        - id: ch03-b30
          speaker: narrator
          text: 凯接过剑鞘，准备照自己所说的更换木片。他一手拿着剑鞘，一手握住刚磨亮的宝剑，绕到巨人身后，摆出要把剑插回鞘里的样子。格尔纳赫毫无防备。凯突然转动手腕，挥剑朝巨人的脖颈狠狠砍去。剑锋掠过，格尔纳赫的头立刻离开身体，滚落在地。藏在城堡里的勇士们这才现身。他们搜遍巨人的宝库，夺走其中的黄金与珠宝，最要紧的是带上那把只有它才能杀死特鲁伊斯野猪的宝剑，一同返回亚瑟宫廷。

    - id: ch04
      title: 寻找马邦
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 众人把经过告诉亚瑟，一同商议下一步。他们决定寻找莫德隆之子马邦，通晓鸟兽语言的格里尔也随队出发。走到一只乌鸫的巢前，格里尔向她询问。
        - id: ch04-b02
          speaker: gwrhyr
          text: “你知道莫德隆之子马邦的消息吗？他出生才三个夜晚，就有人从母亲与墙壁之间把他抱走了。”
        - id: ch04-b03
          speaker: ousel
          text: “我来到这里时还很幼小，旁边放着铁匠的铁砧。从此再没人用它做工，只有我每天傍晚啄上一口。如今，铁砧连榛子那么大的一块也没剩下。可这么久以来，我没听过你说的那个人。不过，有一族野兽比我更年长，我带你们去。”
        - id: ch04-b04
          speaker: narrator
          text: 乌鸫飞在前面，把他们带到雷丁弗雷的雄鹿那里。众人询问马邦，雄鹿摇了摇头。
        - id: ch04-b05
          speaker: stag
          text: “我初来这里时，平原空空荡荡，只有一株小橡树苗。它长成了有百根枝条的大树，如今又只剩一截枯桩。这些年里，我从没听过马邦。不过，你们既然是亚瑟的勇士，我就带你们去找一个比我更古老的动物。”
        - id: ch04-b06
          speaker: narrator
          text: 雄鹿一路奔跑，把他们带到库姆·考尔维德的猫头鹰面前。猫头鹰听见同样的问题，也摇了摇头。
        - id: ch04-b07
          speaker: owl
          text: “我刚来这里时，整道山谷还是一片浓密的林地。后来有一族人来到谷中，把所有树木连根拔光。许多年过去，原地又长出第二片树林。第二片树林消失以后，又长成了第三片，也就是你们此刻看见的这些树。再看看我的两只翅膀吧，它们已经衰老枯萎，简直像两截树桩。可经历了这么久，直到今天，我也没听过马邦的消息。我会带你们去见世上最古老、游历最广的动物，那就是格温修道院的鹰。”
        - id: ch04-b08
          speaker: narrator
          text: 猫头鹰用衰老的翅膀尽力飞翔，终于找到那只鹰。可鹰听过众人的问题，也摇了摇头。
        - id: ch04-b09
          speaker: eagle
          text: “我初来这里时，地上耸立着一块岩石。每天傍晚，我都站在岩顶，仰头啄食星辰。如今你们瞧，那块石头连一拃高都不到了！在这么漫长的岁月里，我只听过一次马邦的消息。那时我飞到林·利乌觅食，向水里一条鲑鱼俯冲，两只利爪深深抓进他的身体。他却拼命把我拖到水下，我好不容易才逃出来。后来，我召集所有族人，准备将他消灭。他向我求和，我便从他背上拔出五十支鱼叉。若是连这条鲑鱼也不知道马邦，我就真的想不出还有谁会知道了。我带你们去找他。”
        - id: ch04-b10
          speaker: narrator
          text: 众人跟着鹰前进。他飞得太高，常常让人看不清踪影。最后，鹰停在一潭深水上方，向河中呼唤。
        - id: ch04-b11
          speaker: eagle
          text: “林·利乌的鲑鱼，我奉亚瑟之命来问你，是否知道莫德隆之子马邦的消息？”
        - id: ch04-b12
          speaker: salmon
          text: “我知道多少，就告诉你们多少。每次涨潮，我都逆流游到格洛斯特城墙下。在那里，我见过世间别处从未有过的冤屈。请派两人坐到我背上，我带他们亲眼去看。”
        - id: ch04-b13
          speaker: narrator
          text: 凯和格里尔坐上鲑鱼的背，被驮到监牢墙下。石牢里面传出悲痛的哭声。
        - id: ch04-b14
          speaker: gwrhyr
          text: “是谁在这座石屋里哭泣？”
        - id: ch04-b15
          speaker: mabon
          text: “是我，莫德隆之子马邦。”
          emotion: sad
        - id: ch04-b16
          speaker: gwrhyr
          text: “金银能换你自由吗？还是必须战斗？”
        - id: ch04-b17
          speaker: mabon
          text: “只有战斗，才能让我重获自由。”
        - id: ch04-b18
          speaker: narrator
          text: 众人立刻派出使者，把发现马邦的消息带给亚瑟。亚瑟召集所有勇士，率领他们赶到格洛斯特城堡，向坚固的城墙发起猛烈进攻。与此同时，凯和贝德维尔坐到鲑鱼背上，由他驮着来到地牢门前。两人合力破开牢门，把马邦从石牢里救了出来。马邦终于恢复自由，随后与亚瑟一同回去。

    - id: ch05
      title: 猎取野猪的梳子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来的一天，格维希尔正在翻越一座山，忽然听到一阵凄厉的哭喊。他立刻循着声音赶去。在一道小山谷里，成片的石南丛燃起大火，火势越烧越猛，迅速逼近一座蚁丘。无数蚂蚁惊慌地来回奔逃，却不知道哪里才有活路。格维希尔可怜它们，赶紧扑灭大火。蚂蚁为报救命之恩，替他找来九蒲式耳亚麻籽，正是伊斯帕达登向基尔韦索要的东西。其余许多不可思议的任务，也由亚瑟和骑士们逐一完成。
        - id: ch05-b02
          speaker: narrator
          text: 亚瑟与骑士们也一一完成了其余奇难任务。最后，他们必须迎战特鲁伊斯野猪，夺走他两耳之间的梳子、剪刀和剃刀。这头野猪极难捕捉，交战时又凶猛无比，亚瑟的许多勇士都死在他的獠牙之下。
        - id: ch05-b03
          speaker: narrator
          text: 特鲁伊斯在国中上下四处奔逃，亚瑟带人一路紧追，终于把他追到塞文海。三名骑士趁野猪不备，突然扑上去抱住他的脚，一起将庞大的身体按进水中。混战里，一名骑士从他两耳之间夺走剃刀，另一名抢到了剪刀。可他们还没来得及抓住梳子，特鲁伊斯便猛力挣扎，把身上的人全都抖落。此后，不论是人、马还是猎犬，谁也追不上他。他一路逃进康沃尔，而亚瑟先前曾经发誓，决不让这头野猪踏进那里。
        - id: ch05-b04
          speaker: narrator
          text: 亚瑟不肯放弃誓言，亲自带着骑士追进康沃尔。先前从特鲁伊斯身上夺走剃刀和剪刀，已经付出了惨重代价。如今为了最后一把梳子，双方的争斗比先前还要凶险。勇士们一次次围上去，又一次次被发狂的野猪冲散。亚瑟最终占了上风，终于夺得梳子，并把特鲁伊斯一路逼到海边，赶进翻腾的海水。那头野猪究竟淹死了，还是从海里逃往了别处，直到今天也没有人知道。
        - id: ch05-b05
          speaker: narrator
          text: 到了最后，伊斯帕达登提出的每一项奇难任务都完成了。基尔韦启程去见他，同行的还有库斯泰宁最后活下来的儿子戈雷乌。两人把从特鲁伊斯两耳之间夺来的剃刀、剪刀和梳子全都带在手中，当面摆给伊斯帕达登看。随后，卡乌拿起这些来之不易的东西，按照伊斯帕达登先前的要求，替他剃去须发，仔细修整头发。
        - id: ch05-b06
          speaker: kilweh
          text: “现在，你的女儿归我了吗？”
        - id: ch05-b07
          speaker: yspaddaden
          text: “她归你了。可替你赢得她的是亚瑟，不是别人。是他召集勇士，是他带人寻找马邦，也是他追猎特鲁伊斯，替你完成了这些看似无人能办到的任务。若依我的心意，你永远别想得到她。可我的女儿一订下婚约，我的寿命便走到尽头，如今我必须失去性命。”
        - id: ch05-b08
          speaker: narrator
          text: 伊斯帕达登的话音刚落，站在一旁的戈雷乌便砍下了他的头。他的父亲库斯泰宁受尽兄长欺压，二十三个儿子也全被伊斯帕达登杀害。如今，最后活下来的儿子亲手结束了仇人的性命，一切仿佛早已由命运安排。奥尔温终于归于基尔韦。完成这场漫长使命以后，亚瑟的大军也不再停留，众人各自踏上归途，返回自己的国土。这个故事选自《马比诺吉昂》。
