  chapters:
    - id: ch01
      title: The Briar with Two Blossoms
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a king and queen had a son named Kilweh. Soon after his birth, the queen fell ill. She sent him to a woman in the mountains, where he would face every kind of weather, endure heat and cold, and grow tall and strong.
        - id: ch01-b02
          speaker: narrator
          text: Kilweh was happy with his nurse. He raced and climbed hills with the other children. On snowy winter days, a wandering harpist sometimes asked for shelter. In return, he sang of strange deeds from long ago.
        - id: ch01-b03
          speaker: narrator
          text: Meanwhile, everything had changed at his father's court. The queen grew steadily worse. When she knew she was dying, she called the king to her bedside.
        - id: ch01-b04
          speaker: queen
          text: I will never rise from this bed again. In time, you will wish to marry another woman. She may make you forget our son, so promise me this. Do not take another wife until you see a briar bearing two blossoms upon my grave.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: The king gave his word. She also asked him to keep anything from growing on her grave, and he promised that too. Soon afterward, she died. Every morning for seven years, the king sent a man to clear the grave. At the end of the seventh year, he forgot.
        - id: ch01-b06
          speaker: narrator
          text: One day, while hunting, the king rode past the burial place. A briar had grown there, and two blossoms opened upon it.
        - id: ch01-b07
          speaker: kilydd
          text: The time has come for me to marry again.
        - id: ch01-b08
          speaker: narrator
          text: After a long search, he found a wife. He said nothing to her about Kilweh and had almost forgotten his son. The new queen learned of the boy from an old woman, was delighted, and sent messengers to bring him home. Kilweh remained at his father's court as the years passed.
        - id: ch01-b09
          speaker: narrator
          text: One day his stepmother told him of a prophecy. He would win Olwen, daughter of Yspaddaden Penkawr, for his wife. Kilweh felt proud and glad. If people spoke of his marriage, he must be a man at last. All day he wondered what Olwen would be like.
        - id: ch01-b10
          speaker: narrator
          text: At last, he became so distracted that he forgot something his father had told him to do.
        - id: ch01-b11
          speaker: kilydd
          text: What is troubling you, my son?
        - id: ch01-b12
          speaker: narrator
          text: Kilweh's face turned red.
        - id: ch01-b13
          speaker: kilweh
          text: My stepmother says no woman but Olwen, the daughter of Yspaddaden Penkawr, can ever be my wife.
        - id: ch01-b14
          speaker: kilydd
          text: That should be easily settled. King Arthur is your cousin. Go to him. Ask him to cut your hair and grant you this favor.
        - id: ch01-b15
          speaker: narrator
          text: So Kilweh rode out on a four-year-old dapple-gray horse. Its bridle was made of linked gold, and there was gold on the saddle. He carried two silver spears with steel heads. An ivory war horn hung from his shoulder, and a golden sword rested at his side.
        - id: ch01-b16
          speaker: narrator
          text: Two brindled, white-breasted grayhounds ran before him in ruby collars. The left dog bounded right, and the right dog crossed left. They played like two sea swallows. His horse tossed four clods into the air, where they fluttered above and below his head like four more swallows.
        - id: ch01-b17
          speaker: narrator
          text: Kilweh wore a purple robe with a golden apple at every corner. Each apple was worth a hundred cows. Yet his horse stepped so lightly on the road to Arthur's palace that not one blade of grass bent beneath its feet.
    - id: ch02
      title: A Boon from Arthur
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the palace gate, Kilweh looked around for someone to let him in.
        - id: ch02-b02
          speaker: kilweh
          text: Is there a porter here?
        - id: ch02-b03
          speaker: glewlwyd
          text: There is. I serve as Arthur's porter every first day of January. Other men keep the gate for the rest of the year. One of them is Pennpingyon, who walks on his head to spare his feet.
        - id: ch02-b04
          speaker: kilweh
          text: Then open the gate.
        - id: ch02-b05
          speaker: glewlwyd
          text: I cannot. Only a king's son or a pedlar with goods to sell may enter. We can feed your dogs elsewhere and give your horse hay. You can have peppered meat, sweet wine, and a room for guests.
        - id: ch02-b06
          speaker: kilweh
          text: That will not satisfy me. If you keep this gate shut, I will give three shouts loud enough to be heard from Cornwall to the north, and all the way to Ireland.
        - id: ch02-b07
          speaker: glewlwyd
          text: Make whatever noise you please. You will not enter before I have spoken to Arthur.
        - id: ch02-b08
          speaker: narrator
          text: Glewlwyd went into the hall, where Arthur questioned him.
        - id: ch02-b09
          speaker: arthur
          text: What news have you brought from the gate?
        - id: ch02-b10
          speaker: glewlwyd
          text: I have traveled far across this island and through other lands. I have seen many men fit to be kings, but never one with the majesty of the youth waiting outside.
        - id: ch02-b11
          speaker: arthur
          text: If you walked in, run back. Let everyone who can open and close an eye honor him and serve him. Such a man should not be left standing in the wind and rain.
        - id: ch02-b12
          speaker: narrator
          text: Glewlwyd hurried back, lifted the bar, and Kilweh rode through the gate.
        - id: ch02-b13
          speaker: kilweh
          text: Greetings to you, ruler of this land, and greetings to everyone here, from the highest to the lowest.
        - id: ch02-b14
          speaker: arthur
          text: And greetings to you. Sit between two of my warriors. While you stay in my palace, you shall have minstrels and every honor owed to one born to be a king.
        - id: ch02-b15
          speaker: kilweh
          text: I did not come for food or drink. I came to ask a boon. Grant it, and I will repay you and carry your praise to the four winds of heaven. Refuse me, and wherever your name is known, I will tell people of your discourtesy.
        - id: ch02-b16
          speaker: arthur
          text: "You shall have whatever you ask, as far as the wind dries, the rain wets, the sun travels, the sea surrounds, and the earth extends. Only these are forbidden: my ship, my mantle, my word, my lance, my shield, my dagger, and Guinevere my wife."
        - id: ch02-b17
          speaker: kilweh
          text: I ask you to bless my hair.
        - id: ch02-b18
          speaker: arthur
          text: That boon is yours.
        - id: ch02-b19
          speaker: narrator
          text: Arthur ordered his men to bring a golden comb and scissors with silver loops. He combed Kilweh's hair, then looked closely at his guest.
        - id: ch02-b20
          speaker: arthur
          text: Tell me who you are. My heart warms to you, and I believe my own blood runs in your veins.
        - id: ch02-b21
          speaker: kilweh
          text: I am Kilweh, the son of Kilydd.
        - id: ch02-b22
          speaker: arthur
          text: Then you truly are my cousin, and I will grant any boon you ask.
        - id: ch02-b23
          speaker: kilweh
          text: Win Olwen, the daughter of Yspaddaden Penkawr, for me. I ask the same boon from all your warriors. I ask Sol, who can stand on one foot all day, and Ossol, who can flatten the world's highest mountain in the beat of a bird's wing. I ask Cluse, who could hear an ant leave its nest fifty miles away, even if he were buried underground. I ask Kai, Bedwyr, and every mighty man among you. Help me win Olwen.
        - id: ch02-b24
          speaker: arthur
          text: Kilweh, I have never heard of this maiden or her family. Give me time, and I will send messengers to search for her.
        - id: ch02-b25
          speaker: kilweh
          text: Gladly. You may have from tonight until the end of the year.
        - id: ch02-b26
          speaker: narrator
          text: The year ended, and Arthur's messengers returned without Olwen. Kilweh grew angry and spoke harshly to the king. Kai, the boldest of Arthur's warriors and the quickest on foot, answered him. Kai could pass nine nights without sleep and remain beneath the water for nine days.
        - id: ch02-b27
          speaker: kai
          text: You reckless youth! How dare you speak to Arthur that way? Come with us. We will stay beside you until we have won the maiden, or until you admit that no such woman lives anywhere in the world.
          emotion: angry
        - id: ch02-b28
          speaker: narrator
          text: Arthur sent his five best men with Kilweh. One-handed Bedwyr, Kai's brother in arms, was Britain's fastest man after Arthur. Kynddelig knew an unseen land as well as his own. Gwrhyr spoke every language. Gwalchmai never returned without what he sought. Menw could make the companions invisible while leaving their own sight clear.
        - id: ch02-b29
          speaker: narrator
          text: The seven reached a vast plain with a beautiful castle. It looked close, yet they rode for three days before drawing near. By then it was evening. An endless flock of sheep spread before the walls. A shepherd watched from a mound beside a dog as large as a nine-year-old horse.
    - id: ch03
      title: Olwen of the White Trefoils
      blocks:
        - id: ch03-b01
          speakers: [kilweh, kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: Shepherd, who owns that castle?
        - id: ch03-b02
          speaker: custennin
          text: You must be foolish indeed. Everyone in the world knows that it belongs to Yspaddaden Penkawr.
        - id: ch03-b03
          speaker: kilweh
          text: And who are you?
        - id: ch03-b04
          speaker: custennin
          text: My name is Custennin. Yspaddaden is my brother, though he has treated me cruelly. Now tell me who you are and why you have come.
        - id: ch03-b05
          speakers: [kilweh, kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: King Arthur sent us to seek Yspaddaden's daughter, Olwen.
        - id: ch03-b06
          speaker: narrator
          text: At those words, the shepherd cried out and rose as though he meant to leave them.
        - id: ch03-b07
          speaker: custennin
          text: Turn back while you still can! Other men have come on that quest, and not one escaped to tell what happened.
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: Kilweh held out a golden ring. Custennin tried it on his finger, but it was too small, so he tucked it into his glove. He went home and gave it to his wife.
        - id: ch03-b09
          speaker: custennins_wife
          text: Where did this ring come from? Good fortune like this never comes to you.
          emotion: surprised
        - id: ch03-b10
          speaker: custennin
          text: You will meet its owner this evening. He is Kilweh, son of Kilydd and cousin to King Arthur. He has come here to seek Olwen.
        - id: ch03-b11
          speaker: narrator
          text: His wife knew Kilweh was her nephew. She rejoiced at seeing him, but grieved over the doom she feared awaited him.
        - id: ch03-b12
          speaker: narrator
          text: Soon footsteps sounded outside. Kai and the others entered the house, and they all ate and drank. Afterward, Custennin's wife opened a chest. A young man with curling yellow hair climbed out.
        - id: ch03-b13
          speaker: gwrhyr
          text: It is a shame to hide him like this. I know he has done nothing wrong.
        - id: ch03-b14
          speaker: custennins_wife
          text: Yspaddaden has killed twenty-three of my sons. I have no hope that I can save this last one.
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: Sorrow filled Kai when he heard her.
        - id: ch03-b16
          speaker: kai
          text: Let him come with me as my comrade. No one will kill him unless I am killed beside him.
        - id: ch03-b17
          speaker: narrator
          text: The mother agreed, and the young man, Goreu, joined them.
        - id: ch03-b18
          speaker: custennins_wife
          text: What exactly have you come here to do?
        - id: ch03-b19
          speaker: kai
          text: We seek Olwen for this young man. Does she ever come here where we might see her?
        - id: ch03-b20
          speaker: custennins_wife
          text: Every Saturday she comes to wash her hair. She leaves all her rings in the washing vessel and never even sends anyone back to collect them.
        - id: ch03-b21
          speaker: kai
          text: If you call her, will she come?
        - id: ch03-b22
          speaker: custennins_wife
          text: She will, but I will not fetch her unless you promise that no one here will harm her.
        - id: ch03-b23
          speakers: [kilweh, kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: We give you our word.
        - id: ch03-b24
          speaker: narrator
          text: So Olwen came. She wore a robe of flame-colored silk and a collar of glowing gold set with emeralds and rubies. Her hair was yellower than broom flowers. Her skin was whiter than sea foam, and her hands were fairer than wood anemones. Four white trefoils sprang from the earth wherever she stepped. That was why she was called Olwen.
        - id: ch03-b25
          speaker: narrator
          text: She entered the house and sat on a bench beside Kilweh.
        - id: ch03-b26
          speaker: kilweh
          text: Olwen, I have loved you since the first moment I heard your name. Will you come away with me from this evil place?
        - id: ch03-b27
          speaker: olwen
          text: I cannot. I promised my father that I would not leave without his knowledge, because his life will end when I am betrothed. What must happen will happen, but listen to my advice. Ask my father for me. Agree to everything he demands, and you will win me. Refuse him anything, and you will lose me. Then you will be fortunate if you escape alive.
        - id: ch03-b28
          speaker: kilweh
          text: I promise to do all you have said.
        - id: ch03-b29
          speaker: narrator
          text: Olwen returned to the castle. Arthur's men followed her and entered the great hall.
        - id: ch03-b30
          speakers: [kilweh, kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: Greetings, Yspaddaden Penkawr. We have come to ask for your daughter Olwen as the wife of Kilweh, son of Kilydd.
        - id: ch03-b31
          speaker: yspaddaden
          text: Come back tomorrow. Then I will give you my answer.
        - id: ch03-b32
          speaker: narrator
          text: As they rose to leave, Yspaddaden snatched up one of three poisoned darts lying beside him and hurled it into their midst. Bedwyr saw it coming. He caught it and threw it back with such force that it pierced Yspaddaden's knee.
        - id: ch03-b33
          speaker: yspaddaden
          text: A gentle son-in-law indeed! I will always walk worse because of this outrage. Curse the smith who forged that dart, and curse the anvil beneath it!
          emotion: angry
        - id: ch03-b34
          speaker: narrator
          text: That night, the travelers slept at Custennin's house. The next day, they went back into Yspaddaden's hall.
        - id: ch03-b35
          speakers: [kilweh, kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: Give us your daughter and keep her dowry for yourself. If you refuse, we will kill you.
        - id: ch03-b36
          speaker: yspaddaden
          text: Her four great-grandmothers and four great-grandfathers are still alive. I must ask their advice.
        - id: ch03-b37
          speaker: kai
          text: Very well. We will go and eat while you do.
        - id: ch03-b38
          speaker: narrator
          text: As the men turned away, Yspaddaden threw his second dart. Menw caught it and sent it flying back. It struck Yspaddaden in the chest and came out through his back.
        - id: ch03-b39
          speaker: yspaddaden
          text: A gentle son-in-law indeed! This iron bites me like a horse leech. Curse the hearth that heated it, and the smith who shaped it!
          emotion: angry
        - id: ch03-b40
          speaker: narrator
          text: On the third day, Arthur's men returned once more.
        - id: ch03-b41
          speaker: yspaddaden
          text: Do not shoot at me again unless you wish to die. First lift my eyebrows. They have fallen over my eyes, and I want to see my son-in-law.
        - id: ch03-b42
          speaker: narrator
          text: The men rose to lift his brows. At that instant, Yspaddaden seized the last poisoned dart and flung it. Kilweh caught it and threw it back. The dart passed through Yspaddaden's eyeball and out the other side of his head.
        - id: ch03-b43
          speaker: yspaddaden
          text: A gentle son-in-law indeed! Curse the fire that forged this weapon, and curse the man who fashioned it!
          emotion: angry
        - id: ch03-b44
          speaker: narrator
          text: The next day, Arthur's men stood before him again.
        - id: ch03-b45
          speakers: [kilweh, kai, bedwyr, gwrhyr]
          ensemble: chorus
          text: Throw nothing more at us unless you want pain worse than you already suffer. Give us your daughter now, without another excuse.
        - id: ch03-b46
          speaker: yspaddaden
          text: Which one of you seeks my daughter? Let him sit here, where I can see him.
        - id: ch03-b47
          speaker: narrator
          text: Kilweh took a chair and faced him.
        - id: ch03-b48
          speaker: yspaddaden
          text: Are you the man who wants my daughter?
        - id: ch03-b49
          speaker: kilweh
          text: I am.
        - id: ch03-b50
          speaker: yspaddaden
          text: First, promise that you will do nothing unjust against me. Win everything I ask for, and only then may you marry her.
        - id: ch03-b51
          speaker: kilweh
          text: I give that promise willingly. Tell me what you require.
        - id: ch03-b52
          speaker: yspaddaden
          text: Look at that hill. In a single day, it must be torn up, plowed, and sown. The grain must ripen that same day, so I can bake its wheat into cakes for my daughter's wedding.
        - id: ch03-b53
          speaker: kilweh
          text: I can do it easily, though you may think I cannot.
        - id: ch03-b54
          speaker: narrator
          text: Kilweh was thinking of Ossol, beneath whose feet the highest mountain became a plain. Yspaddaden paid no attention and went on.
        - id: ch03-b55
          speaker: yspaddaden
          text: Now look at that field. When my daughter was born, nine bushels of flaxseed were sown there, but not one blade grew. Sow it again. My daughter must wear a veil spun from that flax on her wedding day.
        - id: ch03-b56
          speaker: kilweh
          text: I can do that easily too.
        - id: ch03-b57
          speaker: yspaddaden
          text: Even if you do, I have tasks you cannot finish. Bring me the basket of Gwyddneu Garanhir, which can feed the whole world, for your wedding feast. Bring the drinking horn that never empties, and the harp that plays until someone orders it to stop. Bring me the comb, scissors, and razor lying between the ears of Trwyth the boar, so I can arrange my hair for the wedding.
        - id: ch03-b58
          speaker: yspaddaden
          text: But Trwyth will never let a man take them unless Drudwyn the whelp hunts him. No leash in the world can hold Drudwyn except the leash of Cant Ewin, and no collar can hold that leash except the collar of Canhastyr.
        - id: ch03-b59
          speaker: kilweh
          text: I can gain all of those, though you believe I cannot.
        - id: ch03-b60
          speaker: yspaddaden
          text: Even then, one thing will defeat you. Only Mabon, son of Modron, can hunt with that dog. He was taken from his mother when he was three nights old. No one knows where he is, or whether he still lives. And even if you find him, only the sword of Gwrnach the giant can kill the boar. Without that sword, you will never have my daughter.
        - id: ch03-b61
          speaker: kilweh
          text: My lord Arthur will give me horses and knights. I will gain your daughter, and you will lose your life.
        - id: ch03-b62
          speaker: narrator
          text: With that, the long bargain between Kilweh and Yspaddaden Penkawr was ended.
    - id: ch04
      title: The Sword of Gwrnach
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Arthur's men and Kilweh set out again. They reached the largest castle in the world, where a dark-skinned man met them.
        - id: ch04-b02
          speaker: gwrhyr
          text: Where have you come from, good sir, and who owns that great castle?
        - id: ch04-b03
          speaker: black_man
          text: Everyone knows it is the castle of Gwrnach the giant. No guest who enters ever comes out alive. The gate opens only for a craftsman who brings his trade with him.
        - id: ch04-b04
          speaker: narrator
          text: Arthur's men cared little for this warning. They went straight to the gate.
        - id: ch04-b05
          speaker: gwrhyr
          text: Open the gate!
        - id: ch04-b06
          speaker: gwrnachs_porter
          text: I will not open it.
        - id: ch04-b07
          speaker: kai
          text: Why not?
        - id: ch04-b08
          speaker: gwrnachs_porter
          text: The knife is already in the meat, the drink is in the horn, and the hall of Gwrnach is full of feasting. Tonight, the gate will open for no one except a craftsman who can practice his trade.
        - id: ch04-b09
          speaker: kai
          text: Then I may enter. No man can polish a sword better than I can.
        - id: ch04-b10
          speaker: gwrnachs_porter
          text: I will tell Gwrnach what you claim and bring back his answer.
        - id: ch04-b11
          speaker: narrator
          text: The porter carried the message into the hall.
        - id: ch04-b12
          speaker: gwrnach
          text: Bring this man before me. My sword badly needs polishing.
        - id: ch04-b13
          speaker: narrator
          text: Kai was allowed inside. He greeted the giant, who studied him closely.
        - id: ch04-b14
          speaker: gwrnach
          text: Is it true that you know how to polish swords?
        - id: ch04-b15
          speaker: kai
          text: It is true.
        - id: ch04-b16
          speaker: narrator
          text: Gwrnach's sword was brought to him. Kai drew a whetstone from beneath his arm and took the blade in his hands.
        - id: ch04-b17
          speaker: kai
          text: Would you like the blade polished white or blue?
        - id: ch04-b18
          speaker: gwrnach
          text: Choose whichever you please.
        - id: ch04-b19
          speaker: narrator
          text: Kai quickly polished half the sword. Gwrnach marveled at the work.
        - id: ch04-b20
          speaker: gwrnach
          text: It surprises me that a craftsman like you travels without a companion.
        - id: ch04-b21
          speaker: kai
          text: I do have a companion, noble sir, though he knows nothing of this craft.
        - id: ch04-b22
          speaker: gwrnach
          text: What is his name?
        - id: ch04-b23
          speaker: kai
          text: Send the porter outside, and I will explain how to recognize him. The head of his lance will leap from its shaft, draw blood from the wind, and settle back upon the shaft again.
        - id: ch04-b24
          speaker: narrator
          text: The porter opened the gate. Bedwyr showed the sign Kai had described and was admitted. After the gate closed, Goreu persuaded the porter to let him and the other companions enter. Once inside, they hid.
        - id: ch04-b25
          speaker: narrator
          text: By then Kai had polished the entire blade. He placed it in Gwrnach's hand. The giant tested the edge and admired its shine.
        - id: ch04-b26
          speaker: gwrnach
          text: Your work is good. I am satisfied.
        - id: ch04-b27
          speaker: kai
          text: The trouble lies in your scabbard. Its rust has spoiled the sword. Give it to me, and I will remove the wooden lining and fit new pieces inside.
        - id: ch04-b28
          speaker: narrator
          text: Kai took the scabbard in one hand and the sword in the other. He stepped behind the giant as if he meant to slide the blade home. Instead, he struck Gwrnach across the neck. The giant's head rolled from his body.
        - id: ch04-b29
          speaker: narrator
          text: The companions took the gold and jewels from the castle. Then they carried Gwrnach's sword back to Arthur's court.
    - id: ch05
      title: The Oldest Creatures in the World
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The warriors told Arthur what had happened. They agreed to search next for Mabon, son of Modron. Gwrhyr joined them because he knew the languages of beasts and birds.
        - id: ch05-b02
          speaker: narrator
          text: They journeyed until they came to the nest of an ousel. Gwrhyr spoke to the little bird.
        - id: ch05-b03
          speaker: gwrhyr
          text: Do you know anything of Mabon, son of Modron? He was stolen when he was only three nights old, taken from between his mother and the wall.
        - id: ch05-b04
          speaker: ousel
          text: I was young when I first came here, and a smith's anvil stood in this place. No one has worked upon it since then. Every evening I have pecked at it, until now there is not even a piece as large as a nut. Through all those years, I have never heard of the man you seek. But some creatures are older than I am. I will lead you to them.
        - id: ch05-b05
          speaker: narrator
          text: The ousel flew ahead until she reached the stag of Redynvre. The travelers asked the stag about Mabon, but he shook his head.
        - id: ch05-b06
          speaker: stag
          text: When I first came here, the plain was bare except for a single young oak. I watched it grow into a tree with a hundred branches. Now only a withered stump remains, yet in all that time I have never heard of Mabon. Still, you are Arthur's men, so I will take you to an animal older than I am.
        - id: ch05-b07
          speaker: narrator
          text: The stag ran before them and led them to the owl of Cwm Cawlwyd. Once more, the travelers asked for news of Mabon. The owl also shook his head.
        - id: ch05-b08
          speaker: owl
          text: When I first came to this valley, it was a wooded glen. Then people arrived and tore every tree from the ground. A second forest grew after that, and then a third, the one you see today. Look at my wings. They have worn down to withered stumps. Yet until this moment, I had never heard the name Mabon.
        - id: ch05-b09
          speaker: owl
          text: I can still help you. I will guide you to the oldest creature in the world, the one who has traveled farthest. He is the eagle of Gwern Abbey.
        - id: ch05-b10
          speaker: narrator
          text: The owl flew ahead as fast as his old wings could carry him. At last, they found the eagle of Gwern Abbey. They asked whether he knew anything of Mabon, but the eagle shook his head.
        - id: ch05-b11
          speaker: eagle
          text: When I first came here, a high rock stood on this spot. Each evening I perched on its peak and pecked at the stars. Look at that rock now. It is not even a hand's span high. In all that time, I heard of Mabon only once.
        - id: ch05-b12
          speaker: eagle
          text: I had flown as far as Llyn Llyw in search of food. I swooped upon a salmon and drove my claws into him, but he dragged me under the water. I barely escaped. I called every eagle of my kindred to destroy him. The salmon made peace with me, and I pulled fifty fish spears from his back. If he knows nothing of the man you seek, then I cannot imagine who will. I will show you where he lives.
        - id: ch05-b13
          speaker: narrator
          text: The eagle flew so high that the travelers often lost sight of him. At last, he circled above a deep river pool and called down.
        - id: ch05-b14
          speaker: eagle
          text: Salmon of Llyn Llyw, I bring an embassy from Arthur. Do you know anything of Mabon, son of Modron?
        - id: ch05-b15
          speaker: salmon
          text: I will tell you everything I know. With every tide, I swim upriver until I reach the walls of Gloucester. There I have found a wrong unlike any I have found elsewhere. Let two of your company ride on my shoulders. Then you may learn whether I speak the truth.
        - id: ch05-b16
          speaker: narrator
          text: Kai and Gwrhyr climbed onto the salmon's shoulders. He carried them upriver and beneath the prison walls. From inside the stone building came the sound of terrible weeping.
        - id: ch05-b17
          speaker: gwrhyr
          text: Who is grieving inside this house of stone?
        - id: ch05-b18
          speaker: mabon
          text: I am Mabon, the son of Modron.
        - id: ch05-b19
          speaker: gwrhyr
          text: Can silver or gold buy your freedom, or must we win it through battle?
        - id: ch05-b20
          speaker: mabon
          text: Only fighting can set me free.
        - id: ch05-b21
          speaker: narrator
          text: A messenger told Arthur that Mabon had been found. Arthur brought his warriors and fiercely attacked Gloucester. As battle raged, the salmon carried Kai and Bedwyr to the dungeon gate. They broke it down and carried Mabon away. Free at last, he returned home with Arthur.
    - id: ch06
      title: The Winning of Olwen
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One day after this, Gwythyr was crossing a mountain when he heard a cry of distress. He hurried toward it and looked down into a little valley. The heather was burning, and the flames were spreading quickly toward an anthill. Ants rushed this way and that, with nowhere to escape.
        - id: ch06-b02
          speaker: narrator
          text: Gwythyr took pity on them and put out the fire. To thank him, the ants brought him the nine bushels of flaxseed that Yspaddaden had demanded from Kilweh.
        - id: ch06-b03
          speaker: narrator
          text: Arthur and his knights completed many of the other wonders in the same way. At last, only the battle with Trwyth remained. The comb, scissors, and razor lay between the boar's ears, and the warriors had to take them. Trwyth was terribly hard to catch. When Arthur's men finally brought him to battle, he fought with such fury that many warriors were killed.
        - id: ch06-b04
          speaker: narrator
          text: Trwyth raced up and down the country, with Arthur always behind him. The chase went on until they reached the Severn Sea. There, three knights caught the boar's feet by surprise and plunged him into the water. One warrior snatched away the razor. Another seized the scissors.
        - id: ch06-b05
          speaker: narrator
          text: Before anyone could grasp the comb, Trwyth shook them all off. No man, horse, or dog could catch him again until he reached Cornwall, though Arthur had sworn the boar would never enter that land.
        - id: ch06-b06
          speaker: narrator
          text: Arthur and his knights followed him into Cornwall. Winning the razor and scissors had been hard, but the struggle for the comb was fiercer still. In the end, Arthur prevailed. The comb was won, and Trwyth was driven into the sea. No one knows whether he drowned or where he went. His fate remains a mystery to this day.
        - id: ch06-b07
          speaker: narrator
          text: At last, every marvel Yspaddaden had demanded was accomplished. Kilweh set out for his castle with Goreu, son of Custennin. They carried the razor, scissors, and comb in their hands. When they arrived, Kaw shaved Yspaddaden and arranged his hair.
        - id: ch06-b08
          speaker: kilweh
          text: Is your daughter mine now?
        - id: ch06-b09
          speaker: yspaddaden
          text: She is yours. But Arthur won her for you, and no one else. I would never have given her to you freely, because now I must lose my life.
        - id: ch06-b10
          speaker: narrator
          text: As Yspaddaden spoke, Goreu, son of Custennin, cut off his head, just as fate had ordained. Olwen was won, and Arthur's warriors returned, each man to his own country.
