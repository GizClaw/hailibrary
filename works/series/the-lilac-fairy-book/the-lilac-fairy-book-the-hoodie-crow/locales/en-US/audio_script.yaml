audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    hoodie:
      display_name: Hoodie-Crow
      tts:
        delivery: earnest, proud, and steadfast
        timbre: clear and resonant
        pace: measured
        pitch: medium-low
    eldest_daughter:
      display_name: Eldest Daughter
      tts:
        delivery: blunt and dismissive
        timbre: bright and firm
        pace: brisk
        pitch: medium
    second_daughter:
      display_name: Second Daughter
      tts:
        delivery: sharp and impatient
        timbre: clear and firm
        pace: brisk
        pitch: medium-high
    youngest_daughter:
      display_name: Youngest Daughter
      tts:
        delivery: warm, determined, and sincere
        timbre: light and clear
        pace: conversational
