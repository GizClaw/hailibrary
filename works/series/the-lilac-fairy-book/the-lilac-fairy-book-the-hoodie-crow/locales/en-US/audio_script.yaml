  chapters:
    - id: ch01
      title: The Crow's Bride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a farmer with three hardworking daughters. They rose with the sun and did all the housework. One morning, they went to the river to wash clothes. A hoodie-crow settled in a nearby tree.
        - id: ch01-b02
          speaker: hoodie
          text: Farmer's daughter, will you marry me?
        - id: ch01-b03
          speaker: narrator
          text: He had asked the eldest, and she answered.
        - id: ch01-b04
          speaker: eldest_daughter
          text: I certainly won't. A hoodie-crow is an ugly brute.
        - id: ch01-b05
          speaker: narrator
          text: Offended, the bird flew away. The next day, he returned and asked the second daughter.
        - id: ch01-b06
          speaker: hoodie
          text: Farmer's daughter, would you marry me?
        - id: ch01-b07
          speaker: second_daughter
          text: No, indeed. The hoodie-crow is an ugly creature.
        - id: ch01-b08
          speaker: narrator
          text: Angrier than before, the hoodie flew off in a rage. After a night's rest, he hoped for better luck and returned to ask the youngest.
        - id: ch01-b09
          speaker: hoodie
          text: Farmer's daughter, will you marry me?
        - id: ch01-b10
          speaker: youngest_daughter
          text: Yes, I will. The hoodie-crow is a pretty creature.
        - id: ch01-b11
          speaker: narrator
          text: They married the next day. Far away, at the hoodie's house, he asked his bride a question.
        - id: ch01-b12
          speaker: hoodie
          text: Would you rather have me as a hoodie-crow by day and a man by night, or as a man by day and a hoodie-crow by night?
        - id: ch01-b13
          speaker: narrator
          text: The girl was astonished. She had thought he was always a crow, but she said nothing about that and answered.
        - id: ch01-b14
          speaker: youngest_daughter
          text: I would rather you were a man in the daytime and a hoodie-crow at night.
        - id: ch01-b15
          speaker: narrator
          text: And so he was. No one had seen a handsomer man or a more beautiful hoodie. His wife loved both forms and wanted nothing changed.
    - id: ch02
      title: Three Vanished Sons
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In time, they had a son and were delighted. That night, soft music crept toward the house. Every man fell asleep, and so did the mother. In the morning, the baby was gone.
        - id: ch02-b02
          speaker: narrator
          text: They searched high and low, but found nothing. The visiting farmer grieved and feared they might suspect him, since he had never wanted the hoodie for a son-in-law.
        - id: ch02-b03
          speaker: narrator
          text: Next year, the wife had another son. Watchers guarded every door, determined to stay awake. At the first note of music, they all fell asleep.
        - id: ch02-b04
          speaker: narrator
          text: The farmer came to see his grandson next morning and found everyone weeping. The second baby had vanished too.
        - id: ch02-b05
          speaker: narrator
          text: Another year passed, and it happened again. His wife was so unhappy that the hoodie decided to take her to another house, with her sisters for company.
        - id: ch02-b06
          speaker: narrator
          text: They set out together in a large coach. Before long, the hoodie turned to his wife.
        - id: ch02-b07
          speaker: hoodie
          text: Are you quite sure you haven't left anything behind?
        - id: ch02-b08
          speaker: youngest_daughter
          text: I forgot my coarse comb.
        - id: ch02-b09
          speaker: narrator
          text: As she felt her pocket, the coach became a bundle of withered sticks. Her husband turned back into a hoodie and flew away. Her sisters went home, but his wife followed.
    - id: ch03
      title: The Houses of Light
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: She saw the hoodie on a hilltop and hurried after him. When she reached the top, he was in the valley beyond. At night, tired and searching for shelter, she saw a little house full of light.
        - id: ch03-b02
          speaker: narrator
          text: A little boy stood at the door, and seeing him filled her heart with pleasure, though she did not know why. A woman welcomed and fed her, then gave her a soft bed. It seemed only a moment before the sun woke her.
        - id: ch03-b03
          speaker: narrator
          text: Next day, she chased the hoodie from hilltop to valley and back again. He always flew ahead before she arrived. Night came before she caught him.
        - id: ch03-b04
          speaker: narrator
          text: Again she hurried to a lighted house. Another little boy waited there, bringing her the same unexplained joy. A woman gave her food and a soft bed. At sunrise, she continued her search.
        - id: ch03-b05
          speaker: narrator
          text: The third day passed the same way. At a third small house, the woman who received her gave her a warning.
        - id: ch03-b06
          speaker: woman
          text: You must try to stay awake tonight. If the hoodie flies into this room, seize him before he can escape.
        - id: ch03-b07
          speaker: narrator
          text: The wife had walked far. She fought sleep but fell into a deep slumber. Hours later, the hoodie entered through a window and dropped a ring onto her hand.
        - id: ch03-b08
          speaker: narrator
          text: She woke and reached for him, but he was flying away. She caught only one wing feather. At dawn, she told the woman.
        - id: ch03-b09
          speaker: woman
          text: He has crossed the hill of poison. You cannot follow unless you wear horseshoes on your hands and feet. I will help you. Put on these men's clothes. Follow this road to the smithy, and learn there how to make the horseshoes you need.
        - id: ch03-b10
          speaker: narrator
          text: The girl thanked her, changed, and followed the road. Within days of hard work at the smithy, she could make horseshoes.
    - id: ch04
      title: Over the Hill of Poison
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Early one morning, she climbed the poison hill on hands and feet. Even in horseshoes she moved carefully, for one thorn in her flesh would kill her.
        - id: ch04-b02
          speaker: narrator
          text: Across the hill, she heard that her husband would marry a great lord's daughter that day. Everyone in town meant to watch a race except the stranger and the cook, who had to prepare the wedding supper.
        - id: ch04-b03
          speaker: narrator
          text: The cook loved races and hated missing this one. When he saw an unknown woman in the street, hope rose in him.
        - id: ch04-b04
          speaker: cook
          text: Will you prepare the wedding feast for me? When I come back from the race, I'll pay you well.
        - id: ch04-b05
          speaker: narrator
          text: She gladly agreed. From the kitchen, she could look into the great hall where the wedding company would eat. She cooked the whole feast and watched closely for the bridegroom's seat.
        - id: ch04-b06
          speaker: narrator
          text: Then she filled a plate with broth, dropped the ring and feather into it, and carried it to him herself. His first spoonful brought up the ring. A thrill passed through him. In the second spoonful, he saw the feather and sprang from his chair.
        - id: ch04-b07
          speaker: hoodie
          text: Who prepared this feast?
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: By then, the real cook had returned from the race, and they brought him before the bridegroom.
        - id: ch04-b09
          speaker: hoodie
          text: He may be the cook, but he did not make this meal.
        - id: ch04-b10
          speaker: narrator
          text: Questions were asked throughout the house, and soon the girl was summoned into the great hall.
    - id: ch05
      title: The Spells Fall Away
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The bridegroom knew her as soon as she entered. Before the great lord, his daughter, and all their guests, he made his choice.
        - id: ch05-b02
          speaker: hoodie
          text: This is the woman I married. She is my wife, and I will have no one else.
        - id: ch05-b03
          speaker: narrator
          text: At that very moment, every spell upon him fell away. Never again would he have to take the shape of a hoodie-crow. After all their sorrow and searching, husband and wife were happy indeed to stand together again.
    - id: ch06
      title: The Journey Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: They still had to cross the hill of poison. It took a long time, but neither of them minded. The wife went ahead a little way in her horseshoes. Then she took them off and tossed them back so her husband could put them on and follow. In this way, step by careful step, they both reached the other side.
        - id: ch06-b02
          speaker: narrator
          text: From there, they followed the same road the wife had traveled before. At each of the three houses, they stopped. And at each house, they took with them one of the little boys who had once filled her heart with such mysterious joy. The three lost sons were brought home at last.
        - id: ch06-b03
          speaker: narrator
          text: But the story never tells us who stole the children, or what the forgotten coarse comb had to do with any of it.
