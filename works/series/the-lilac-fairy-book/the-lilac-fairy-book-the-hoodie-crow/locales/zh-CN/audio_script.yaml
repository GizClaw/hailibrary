audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    hoodie_crow:
      display_name: 灰背鸦
      tts:
        delivery: 真诚坚定，受挫时有明显怒气，恢复人形后沉稳深情
        timbre: 清朗有力的年轻男声
        pace: 适中
        pitch: 中
    eldest_sister:
      display_name: 大姐
      tts:
        delivery: 直截了当，拒绝时毫不客气
        timbre: 明亮利落的年轻女声
        pace: 适中偏快
        pitch: 中高
    second_sister:
      display_name: 二姐
      tts:
        delivery: 爽快强硬，话里带着轻蔑
        timbre: 清脆有力的年轻女声
        pace: 适中
        pitch: 中高
    wife:
      display_name: 小女儿
      tts:
        delivery: 善良坚韧，温柔中藏着不肯放弃的勇气
        timbre: 柔和清亮的年轻女声
        pace: 适中
        pitch: 中高
    woman:
      display_name: 小屋里的女人
      tts:
        delivery: 亲切从容，指点迷途时清楚而可靠
        timbre: 温厚安定的成年女声
        pace: 舒缓
        pitch: 中
    cook:
      display_name: 厨子
      tts:
        delivery: 朴实急切，一心惦记着赛跑
        timbre: 厚实爽朗的成年男声
        pace: 适中偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 河边的求婚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位农夫养着三个女儿。姐妹三个勤快又能干，太阳才升起来，她们已经起床，把家里的活儿一件件做妥了。一天早晨，她们来到河边洗衣裳。一只灰背鸦飞近，停在旁边的树上。
        - id: ch01-b02
          speaker: hoodie_crow
          text: “农夫家的大女儿，你肯不肯嫁给我？”
        - id: ch01-b03
          speaker: eldest_sister
          text: “我可不肯。灰背鸦长得这么难看，我才不要嫁呢。”
        - id: ch01-b04
          speaker: narrator
          text: 灰背鸦觉得受了羞辱，张开翅膀飞走了。可第二天，他又来到河边，这回问的是二女儿。
        - id: ch01-b05
          speaker: hoodie_crow
          text: “农夫家的二女儿，你愿意做我的妻子吗？”
        - id: ch01-b06
          speaker: second_sister
          text: “当然不愿意。你这只灰背鸦，模样实在太丑了。”
        - id: ch01-b07
          speaker: narrator
          text: 这一次，灰背鸦气得更厉害，怒冲冲地走了。睡过一夜，他消了些气，心想，第三回说不定会有好运，便再次飞回老地方。
        - id: ch01-b08
          speaker: hoodie_crow
          text: “农夫家的小女儿，你愿意嫁给我吗？”
        - id: ch01-b09
          speaker: wife
          text: “我愿意呀。灰背鸦明明是个漂亮的好家伙。”
        - id: ch01-b10
          speaker: narrator
          text: 到了第二天，小女儿果真嫁给了灰背鸦。两人走了很远，来到灰背鸦自己的家。他有一件要紧事，想让新婚妻子替他选择。
        - id: ch01-b11
          speaker: hoodie_crow
          text: “你愿意让我白天是灰背鸦，夜里变成人，还是白天做人，夜里再变回灰背鸦？”
        - id: ch01-b12
          speaker: narrator
          text: 姑娘吃了一惊。她一直以为，丈夫无论白天黑夜，都只能是灰背鸦。可她没有把惊讶说出来，只认真回答了他。
        - id: ch01-b13
          speaker: wife
          text: “那就请你白天做人，到了夜里再做灰背鸦吧。”
        - id: ch01-b14
          speaker: narrator
          text: 从那以后，事情就照她说的发生了。白天的丈夫英俊得无人能比，夜里的灰背鸦也漂亮得世间少有。妻子爱着他的两副模样，从不希望他改变。

    - id: ch02
      title: 三个消失的孩子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来，夫妻俩有了一个儿子，两人都欢喜得很。可到了夜里，一阵轻柔的乐声悄悄飘近屋子。屋里的男人全睡着了，孩子的母亲也闭上了眼睛。等大家醒来，天已经亮了，婴儿却没了踪影。
        - id: ch02-b02
          speaker: narrator
          text: 众人从高处找到低处，哪儿都不见孩子。农夫恰好来看女儿，心里又悲伤又害怕。他曾经不愿让灰背鸦做女婿，如今外孙丢了，别人说不定会疑心是他偷走的。
        - id: ch02-b03
          speaker: narrator
          text: 第二年，妻子又生下一个儿子。这回，每一扇门外都安排了人看守。大家发誓，无论发生什么都不合眼。谁知乐声才响起第一个音符，所有人便沉沉睡去。
        - id: ch02-b04
          speaker: narrator
          text: 第二天早晨，农夫来探望外孙，看到的却是一屋子哭泣的人。就在他们熟睡的时候，第二个婴儿也消失了。
        - id: ch02-b05
          speaker: narrator
          text: 又过了一年，一切再次重演。妻子失去了第三个孩子，悲痛得再也受不住。灰背鸦决定带她搬到另一所房子去，还让她的两个姐姐一同上路，好在途中陪伴她。几个人坐进一辆宽大的马车，离开了原来的家。
        - id: ch02-b06
          speaker: narrator
          text: 马车才走出不远，灰背鸦忽然想起什么，转头问妻子。
        - id: ch02-b07
          speaker: hoodie_crow
          text: “你再想一想，真的什么也没有落下吗？”
        - id: ch02-b08
          speaker: wife
          text: “我的粗齿梳忘在家里了。”
        - id: ch02-b09
          speaker: narrator
          text: 她一面回答，一面摸了摸口袋。话音刚落，马车竟变成一捆枯枝，丈夫也重新成了灰背鸦，展翅飞远了。

    - id: ch03
      title: 追过一座座山
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个姐姐转身回家，小女儿却沿着灰背鸦飞去的方向追赶。有时，她能望见丈夫停在山顶，便加快脚步往上爬。可等她赶到山顶，灰背鸦已经飞进另一面的山谷。
        - id: ch03-b02
          speaker: narrator
          text: 天黑时，她累得再也走不动，只想找个地方歇脚。前方恰好有一间小屋，窗子透出明亮的灯光。她心里一喜，用剩下的力气赶到门前。
        - id: ch03-b03
          speaker: narrator
          text: 门口站着一个小男孩。她一看见他，心里就莫名地欢喜。屋里走出一个女人，热情地迎她进去，给她端来食物，又铺好柔软的床。她实在太累，才躺下一会儿似的，再睁眼时，太阳已经升起来了。
        - id: ch03-b04
          speaker: narrator
          text: 她离开小屋，又跟着灰背鸦翻山越谷。她追上山，他就飞进谷底。她下到谷底，他又停在另一座山顶。第二天夜里，她再次见到一间亮着灯的小屋。门口同样站着一个让她心生欢喜的男孩，随后也有一个女人请她吃饭，让她安睡。
        - id: ch03-b05
          speaker: narrator
          text: 第三天，追赶还是和前两天一样。等她在夜里走进小屋，屋里的女人却给了她一个不同的嘱咐。
        - id: ch03-b06
          speaker: woman
          text: “今晚千万别睡。灰背鸦要是飞进房间，你就赶紧抓住他。”
        - id: ch03-b07
          speaker: narrator
          text: 可她走了整整一天，身子早已疲倦到了极点。她拼命想睁着眼睛，最终还是睡熟了，而且一睡就是许多个钟头。
        - id: ch03-b08
          speaker: narrator
          text: 灰背鸦从窗口飞进来，把一枚戒指轻轻落在她的手上。她猛地惊醒，马上伸手去抓，可他已经飞向窗外。她只来得及从丈夫的翅膀上扯下一根羽毛。
        - id: ch03-b09
          speaker: narrator
          text: 黎明时分，她把夜里发生的事全都告诉了那个女人。女人听完，告诉她，灰背鸦已经去了一个极其危险的地方。
        - id: ch03-b10
          speaker: woman
          text: “他翻过了毒山。你要追过去，手脚上都得钉上马蹄铁，不然根本走不了。穿好这套男人的衣服，顺着门前的路一直走。找到铁匠铺以后，就在那里学着给自己打马蹄铁吧。”

    - id: ch04
      title: 越过毒山
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 姑娘谢过女人，换上男人的衣服，沿路找到了铁匠铺。她肯下苦功，只学了几天，就能亲手打出马蹄铁。一个清早，她把铁掌钉在双手双脚上，朝毒山出发了。
        - id: ch04-b02
          speaker: narrator
          text: 她四肢着地，一步步爬过山坡。有马蹄铁护着，仍得处处小心。只要摔上一跤，让有毒的尖刺扎进肉里，她就会丢掉性命。
        - id: ch04-b03
          speaker: narrator
          text: 她终于活着越过毒山，却听见一个可怕的消息。就在当天，她的丈夫要娶一位大贵族的女儿。
        - id: ch04-b04
          speaker: narrator
          text: 那天，镇上还要举行一场赛跑，几乎人人都打算去看。翻过毒山的外乡女人不去，另有一个厨子也走不开，因为婚宴得由他来准备。偏偏这厨子最爱看赛跑，一想到自己错过比赛，心里就难受。正在这时，他瞧见一个陌生女人沿街走来，顿时来了精神。
        - id: ch04-b05
          speaker: cook
          text: “你能不能替我把婚宴做好？等我看完赛跑回来，一定付给你一大笔工钱。”
        - id: ch04-b06
          speaker: narrator
          text: 姑娘很乐意，立刻接下了这件差事。厨房正对着宾客用餐的大厅。她在那里做好整桌宴席，又一直留意着新郎坐在哪个位置。
        - id: ch04-b07
          speaker: narrator
          text: 到了上菜的时候，她盛出一盘肉汤，把那枚戒指和那根羽毛一同放进汤里，再亲手送到新郎面前。

    - id: ch05
      title: 戒指与羽毛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 新郎舀起第一匙汤，一枚熟悉的戒指出现在匙中，他全身顿时一颤。再舀一匙，那根羽毛也露了出来。他立刻离开椅子，站起身来。
        - id: ch05-b02
          speaker: hoodie_crow
          text: “今天这桌婚宴，到底是谁做的？”
        - id: ch05-b03
          speaker: narrator
          text: 厨子已经看完赛跑回来了，众人便把他带到新郎面前。可新郎看了一眼，就知道眼前的人没有做过这些菜。
        - id: ch05-b04
          speaker: hoodie_crow
          text: “他确实是这里的厨子，可今天的宴席不是出自他的手。”
        - id: ch05-b05
          speaker: narrator
          text: 大家只好继续查问，最后把那个陌生姑娘叫进大厅。新郎一见到她，马上认出了自己的妻子。
        - id: ch05-b06
          speaker: hoodie_crow
          text: “她才是我真正娶过的妻子。除了她，我谁也不会要。”
        - id: ch05-b07
          speaker: narrator
          text: 他的话才说完，缠在身上的魔法便消失了。从这一刻起，他再也不会变成灰背鸦。夫妻终于重新相聚，心里无比欢喜。
        - id: ch05-b08
          speaker: narrator
          text: 回家的路仍要经过毒山，可两人一点也不在乎。妻子先穿着马蹄铁向前爬一段，再把铁掌扔回去，让丈夫钉到自己的手脚上。就这样一程接一程，他们总算平安翻过山去。
        - id: ch05-b09
          speaker: narrator
          text: 夫妻俩沿着妻子来时的路往回走，又依次停在那三间亮着灯的小屋。原来，每间屋里都有他们失去的一个儿子。他们把三个孩子全接了出来，一家人一同回到自己的家。
        - id: ch05-b10
          speaker: narrator
          text: 不过，这个故事从来没有告诉我们，三个孩子究竟是谁偷走的。它也没有解释，那把忘在家里的粗齿梳，跟后来发生的一切到底有什么关系。
