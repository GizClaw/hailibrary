audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    princess:
      display_name: The Youngest Princess
      tts:
        delivery: tender, resolute, and heartfelt
        timbre: clear and gentle
        pace: conversational
        pitch: medium-high
    eldest_sister:
      display_name: The Eldest Princess
      tts:
        delivery: poised and confident
        timbre: smooth and bright
        pace: conversational
        pitch: medium
    middle_sister:
      display_name: The Middle Princess
      tts:
        delivery: cheerful and assured
        timbre: light and clear
        pace: conversational
        pitch: medium-high
    prince:
      display_name: The Brown Bear of Norway
      tts:
        delivery: loving, grave, and steadfast
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    witch_daughter:
      display_name: The Witch's Daughter
      tts:
        delivery: proud, possessive, and sharp
        timbre: cool and cutting
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Prince Under Enchantment
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king in Ireland with three daughters, all of them lovely princesses. One day, as they walked with their father across the lawn, he teased them by asking whom they wished to marry.
        - id: ch01-b02
          speaker: eldest_sister
          text: I shall marry the king of Ulster.
        - id: ch01-b03
          speaker: middle_sister
          text: Then I shall marry the king of Munster.
        - id: ch01-b04
          speaker: princess
          text: I will marry no one but the Brown Bear of Norway.
        - id: ch01-b05
          speaker: narrator
          text: Her old nurse had often told her of an enchanted prince by that name. The princess had fallen in love with the thought of him, and only the night before, she had dreamed about him. Her sisters laughed and teased her until evening.
        - id: ch01-b06
          speaker: narrator
          text: That very night, she woke from sleep in a vast hall glowing with a thousand lamps. The richest carpets covered the floor, cloth of gold and silver hung upon the walls, and grand guests filled the room. Before her stood the beautiful prince from her dream. In a moment he was on one knee, telling her how dearly he loved her and asking her to become his queen. She did not have the heart to refuse him. Before that same evening ended, they were married.
        - id: ch01-b07
          speaker: prince
          text: My darling, you must know that I am enchanted. A sorceress wanted me to marry her beautiful daughter. When I refused, the mother turned me into a bear by day. I must stay that way until a lady freely marries me and then bears five years of terrible trials.
        - id: ch01-b08
          speaker: narrator
          text: In the morning, the princess woke alone and passed the day in sadness. But that evening, as soon as the great hall was lit, the folding doors flew open. The prince was beside her again, and they spent a happy evening together.
        - id: ch01-b09
          speaker: prince
          text: If you ever grow tired of me or lose your faith in me, we will be parted forever. Then I must marry the witch's daughter.
        - id: ch01-b10
          speaker: narrator
          text: The princess grew used to his absence by day. A happy year passed, and a beautiful little boy was born. Now her child kept her company whenever her husband was gone, and she was happier than ever.
        - id: ch01-b11
          speaker: narrator
          text: One sultry evening, the princess, the prince, and their child sat beside an open window. An eagle swept into the room, caught the baby's sash in its beak, and carried him high into the sky. The princess screamed. She was about to throw herself through the window after the child, but the prince caught her and looked at her very seriously. Then she remembered the warning he had given soon after their marriage. She stopped the cries and complaints that were already rising to her lips.
        - id: ch01-b12
          speaker: narrator
          text: She spent another lonely year before a beautiful little girl was born. This time, the princess watched everything. She never allowed a window to open more than a few inches.
        - id: ch01-b13
          speaker: narrator
          text: All her care did no good. One evening, while the family was happy together and the prince bounced the baby in his arms, a beautiful greyhound suddenly stood before them. It took the child straight from the father's hands and raced through the door before anyone could blink. The princess shouted and ran from the room after it. Servants were gathered in the next room, but every one of them swore that neither a dog nor a child had passed that way.
        - id: ch01-b14
          speaker: narrator
          text: She could not help feeling that her husband was to blame. Even so, she mastered herself and never reproached him.
        - id: ch01-b15
          speaker: narrator
          text: When their third child was born, the princess would hardly let a door or window stand open for a moment. Still, she could not keep the baby. One evening by the fire, a lady suddenly appeared beside them. The princess stared in fright. While she watched, the lady wrapped a shawl around the baby on the prince's lap and disappeared, either through the floor or up the broad chimney.
        - id: ch01-b16
          speaker: narrator
          text: This last loss kept the princess in bed for a month.
    - id: ch02
      title: The Burned Bearskin
      blocks:
        - id: ch02-b01
          speaker: princess
          text: My dear, I think I would feel better if I saw my father, mother, and sisters again. May I go home for a few days?
        - id: ch02-b02
          speaker: prince
          text: Yes. Whenever you wish to return, speak that wish as you lie down at night.
        - id: ch02-b03
          speaker: narrator
          text: The next morning, she woke in her own old room at her father's palace. She rang the bell. Before long, her mother, her father, and both of her married sisters were gathered around her. They laughed until tears ran down their faces, so great was their joy at finding her alive and safely home again.
        - id: ch02-b04
          speaker: narrator
          text: In time she told them everything. They did not know what she should do. She loved her husband as much as ever and felt sure he could not prevent the children from being taken. Yet she could not bear the thought of losing another child.
        - id: ch02-b05
          speaker: narrator
          text: Her mother and sisters sought advice from a wise woman who brought eggs to the castle. The woman said the prince had to put on his bearskin each morning. If the princess found and burned it, he would remain a man day and night, and the enchantment would end.
        - id: ch02-b06
          speaker: narrator
          text: They all urged her to follow this advice, and she promised. After eight days, her longing for her husband became too great. She made her wish that night and woke three hours later in his palace, with the prince watching over her. Their joy was great, and many happy days followed.
        - id: ch02-b07
          speaker: narrator
          text: Then she began to wonder why she had never minded his leaving each morning. She also remembered that every night, without fail, he gave her a sweet drink from a golden cup before bed.
        - id: ch02-b08
          speaker: narrator
          text: One night she pretended to drink it. In the morning she stayed awake and watched through nearly closed eyes as her husband slipped behind a panel in the wooden wall. The next night, she poured a little of the sleeping drink she had saved into his cup. He slept deeply.
        - id: ch02-b09
          speaker: narrator
          text: After midnight, she rose and passed through the panel. A beautiful brown bearskin hung in a corner. She carried it down to the parlor fire and burned it until nothing remained but fine ash. Then she returned to bed, kissed her husband's cheek, and fell asleep.
        - id: ch02-b10
          speaker: narrator
          text: She could have lived a hundred years and never forgotten the next morning. The prince stood over her with misery and anger in his face.
        - id: ch02-b11
          speaker: prince
          text: Unhappy woman, you have parted us forever! Why could you not wait five years? Now I must travel for three days to the witch's castle and marry her daughter, whether I wish it or not. The skin you burned was my protection. The egg seller who advised you was the witch herself. I will not reproach you. Your punishment will be hard enough. Farewell forever!
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: He kissed her for the last time and was gone the next moment, walking as quickly as he could. She shouted after him. When she saw it was useless, she dressed and ran in pursuit. He never stopped, slowed his pace, or looked behind him, but she kept him in sight. Whenever he was crossing a hill, she was struggling through the hollow behind him. Whenever he reached the hollow, she had only just gained the hill.
        - id: ch02-b13
          speaker: narrator
          text: She was nearly exhausted when sunset came. The prince turned down a lane and entered a little house. She crawled after him. Inside, he was kissing and hugging a beautiful little boy who sat on his knees.
        - id: ch02-b14
          speaker: prince
          text: Here is your eldest child, my poor darling. And that woman smiling beside us is the eagle who carried him away.
        - id: ch02-b15
          speaker: narrator
          text: In a moment, the princess forgot every sorrow. She caught her child in her arms, hugging him, laughing over him, and crying over him all at once. The woman who had once been the eagle washed the travelers' tired feet. Then she rubbed them with a healing ointment that drew every trace of soreness from their bones and left them feeling as fresh as daisies.
        - id: ch02-b16
          speaker: narrator
          text: Just before sunrise, the prince prepared to leave.
        - id: ch02-b17
          speaker: prince
          text: Take these scissors. Anything you cut with them will turn to silk. When the sun rises, I will forget you and the children. At sunset, my memory will return. Farewell!
        - id: ch02-b18
          speaker: narrator
          text: He had not gone far before she was following again, though she had to leave their boy behind. This day passed just as the one before it. Their shadows stretched ahead of them through the morning, then followed behind them in the evening. The prince never stopped, and neither did the princess. When the sun was setting, he turned down another lane. At the house there, they found their little daughter. Once more, sorrow gave way to joy and comfort until morning came.
        - id: ch02-b19
          speaker: narrator
          text: Before the third day's journey began, the prince gave the princess a comb. Whenever she used it, pearls and diamonds would fall from her hair. From sunset until sunrise he remembered his wife and children. But when the sun came up, the charm took hold again. All day he hurried onward and never once turned his eyes behind him. At sunset his memory returned, and that night they came to the place where their youngest baby had been kept.
        - id: ch02-b20
          speaker: narrator
          text: Before sunrise on the third morning, the prince spoke to her for the last time.
        - id: ch02-b21
          speaker: prince
          text: My poor wife, take this little hand reel. Its golden thread never ends. Take half of our wedding ring, too. If you reach my house and join your half to mine, I will remember you. Beyond us is a wood. The moment I enter it, I will forget everything between us, as if I had been born yesterday. Farewell forever, dear wife and child!
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: The sun rose, and he walked toward the wood. It opened before him and closed behind him. When the princess reached it, she found a barrier as solid as stone. She wrung her hands and wept. Then she gathered herself and called out.
        - id: ch02-b23
          speaker: princess
          text: Wood, by my three magic gifts, the scissors, the comb, and the reel, I command you to let me pass!
        - id: ch02-b24
          speaker: narrator
          text: The wood opened. She followed a path until she saw a palace and its lawn. At the forest's edge, close to the palace, stood a woodman's cottage.
    - id: ch03
      title: The Woman at the Lodge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The princess entered the lodge and asked the woodman and his wife to take her into their service. At first they refused.
        - id: ch03-b02
          speaker: princess
          text: I will ask for no wages. Whenever you wish, I will give you diamonds, pearls, silk, and golden thread.
        - id: ch03-b03
          speaker: narrator
          text: At that, the couple agreed to let her stay. Before long, news reached the lodge about a young prince who had just arrived at the palace. He was living there with the young mistress of the house, but he rarely went beyond its doors. Everyone who caught sight of him noticed the same thing. He moved about in silence and sorrow, like someone who could feel that something precious was lost but could not remember what it was.
        - id: ch03-b04
          speaker: narrator
          text: The servants and other conceited people from the great house noticed the beautiful young woman at the lodge. They began troubling her with their rude attention. The head footman was worst of all, so at last she invited him to tea.
        - id: ch03-b05
          speaker: narrator
          text: The footman was delighted by her invitation. He spent the day bragging about it to everyone in the servants' hall. When evening came, he strode into the lodge and was shown to the princess's private sitting room. The woodman and his wife had come to stand in such awe of their strange servant that they had given her two pleasant rooms of her own.
        - id: ch03-b06
          speaker: narrator
          text: The footman sat as stiff as a ramrod and spoke grandly about life at the castle while she prepared tea and toast.
        - id: ch03-b07
          speaker: princess
          text: Would you reach through the window and cut me one or two sprigs of honeysuckle?
        - id: ch03-b08
          speaker: narrator
          text: Glad to oblige her, he pushed his hand and head outside.
        - id: ch03-b09
          speaker: princess
          text: By the power of my magic gifts, let horns spring from his head and sing all the way to the lodge!
        - id: ch03-b10
          speaker: narrator
          text: At once, a pair of horns sprang from the front of his ears and curved until they met behind his head. The poor man bawled and roared. The servants he had boasted to came flocking down from the castle. They grinned and cheered, beating out tunes on tongs, shovels, and pans. The footman cursed and swore. His eyes looked ready to burst from his head, his face turned black, and he kicked his legs behind him like a madman.
        - id: ch03-b11
          speaker: narrator
          text: At last the princess pitied him and lifted the spell. The horns fell to the ground. He would have killed her then and there, but he was weak as water. His fellow servants carried him back to the great house.
        - id: ch03-b12
          speaker: narrator
          text: Somehow the story of the horns reached the prince, and he wandered down toward the lodge. The princess sat sewing at the window in the simple dress of a countrywoman. Even those plain clothes could not hide her beauty. The prince stopped and looked at her carefully. The longer he looked, the more puzzled he became. It was like trying to decide whether something had truly happened to him when he was very young or whether he had only dreamed it.
        - id: ch03-b13
          speaker: narrator
          text: The witch's daughter heard the tale as well and came to see this strange woman. She found the princess cutting a gown pattern from brown paper. Wherever the scissors moved, the paper became the richest silk she had ever seen. The witch's daughter watched greedily.
        - id: ch03-b14
          speaker: witch_daughter
          text: What price would you take for those scissors?
        - id: ch03-b15
          speaker: princess
          text: I want no money. Let me spend one night outside the prince's chamber.
        - id: ch03-b16
          speaker: narrator
          text: The proud lady flared with anger and nearly said something dreadful. But the scissors kept cutting, and each new inch of silk was richer than the last. She agreed to the bargain.
        - id: ch03-b17
          speaker: narrator
          text: That night, the princess entered the palace. The prince lay in such a dead sleep that nothing she did could wake him. Sighing and sobbing, she sang the same verse all night, but it was no use.
        - id: ch03-b18
          speaker: princess
          text: Four long years I was married to you. Three sweet babies I bore to you. Brown Bear of Norway, turn to me.
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: At the first light of dawn, the witch's daughter entered and led her away. As the princess left the palace, the footman with the vanished horns stuck out his tongue at her.
    - id: ch04
      title: Three Nights for Three Gifts
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The first night had brought no luck. The next day, the prince passed the lodge again. He looked at the princess and greeted her kindly, as a prince might greet a farmer's daughter, then went on. Soon the witch's daughter arrived and found the princess combing her hair. Pearls and diamonds were falling from it.
        - id: ch04-b02
          speaker: narrator
          text: The witch's daughter wanted the comb just as greedily as she had wanted the scissors. They struck the same kind of bargain. The princess gave up the comb for one more night outside the prince's chamber. Once again, he lay beyond her reach in a heavy sleep. She sang her verse through another night of sorrow, but he did not wake. At daybreak she had to leave the castle, and once more the footman was waiting at his post to enjoy his revenge.
        - id: ch04-b03
          speaker: narrator
          text: On the third day, the prince stopped to speak with the strange woman.
        - id: ch04-b04
          speaker: prince
          text: Is there anything I can do for you?
        - id: ch04-b05
          speaker: princess
          text: There is. Do you ever wake during the night?
        - id: ch04-b06
          speaker: prince
          text: Often. But for the last two nights, I heard a sweet song in my dreams and could not wake. I felt I had known and loved that voice in another world, long ago.
        - id: ch04-b07
          speaker: princess
          text: Did you drink a sleeping potion before bed on either night?
        - id: ch04-b08
          speaker: prince
          text: I drank something my wife gave me both evenings. I do not know if it was a sleeping potion.
        - id: ch04-b09
          speaker: princess
          text: You said you wished to help me. Tonight, taste no drink at all.
        - id: ch04-b10
          speaker: prince
          text: I will not.
        - id: ch04-b11
          speaker: narrator
          text: The prince continued his walk. Soon afterward, the great lady came by and saw the stranger winding endless golden thread from her hand reel. A third bargain was made.
        - id: ch04-b12
          speaker: narrator
          text: That evening, the prince lay awake at twilight, his mind deeply troubled. The door opened. His princess entered, sat beside his bed, and sang.
        - id: ch04-b13
          speaker: princess
          text: Four long years I was married to you. Three sweet babies I bore to you. Brown Bear of Norway, turn to me.
          emotion: sad
        - id: ch04-b14
          speaker: prince
          text: Brown Bear of Norway? I do not understand.
        - id: ch04-b15
          speaker: princess
          text: Do you not remember that I was your wife for four years?
        - id: ch04-b16
          speaker: prince
          text: I do not, though I truly wish it were so.
        - id: ch04-b17
          speaker: princess
          text: Do you not remember our three children, all still alive?
        - id: ch04-b18
          speaker: prince
          text: Show them to me. My thoughts are in a terrible confusion.
        - id: ch04-b19
          speaker: princess
          text: Find the half of our wedding ring hanging at your neck, and fit it against this half.
        - id: ch04-b20
          speaker: narrator
          text: He did. The instant the two halves met, the enchantment broke. His whole memory returned. He threw his arms around his wife's neck, and they both burst into tears.
    - id: ch05
      title: The Charm Is Broken
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A great cry rose outside. The castle walls split and cracked. Everyone inside fled in alarm, with the prince and princess among them.
        - id: ch05-b02
          speaker: narrator
          text: Everyone in the castle was terrified and hurried toward the open air. By the time the last of them had reached safety on the lawn, the whole building came crashing down. The fall made the earth tremble for miles around. No one ever saw the witch or her daughter again.
        - id: ch05-b03
          speaker: narrator
          text: Before long, the prince and princess had all three children with them. Together they set out for their own palace.
        - id: ch05-b04
          speaker: narrator
          text: The kings of Ireland, Munster, and Ulster soon came with their wives to visit. And may everyone who deserves such joy be as happy as the Brown Bear of Norway and his family.
