audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    eldest_princess:
      display_name: 大公主
      tts:
        delivery: 爽快自信，带着王室少女的从容
        timbre: 清亮柔和的年轻女声
        pace: 适中
        pitch: 中高
    second_princess:
      display_name: 二公主
      tts:
        delivery: 活泼直率，说话轻快自然
        timbre: 明净轻盈的年轻女声
        pace: 适中偏快
        pitch: 中高
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 温柔坚定，经历悲苦后更显坚韧
        timbre: 清澈温润的年轻女声
        pace: 适中
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 深情克制，受魔法驱使时沉郁疏离
        timbre: 温厚清晰的年轻男声
        pace: 稍慢
        pitch: 中低
    head_footman:
      display_name: 领班男仆
      tts:
        delivery: 傲慢卖弄，受挫时暴躁狼狈
        timbre: 偏尖而用力的成年男声
        pace: 适中偏快
        pitch: 中
    witch_daughter:
      display_name: 女巫的女儿
      tts:
        delivery: 高傲贪婪，言语冷硬而不耐烦
        timbre: 华丽偏冷的年轻女声
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 梦中的挪威棕熊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，爱尔兰有一位国王，三个女儿都很讨人喜欢。一天，父女四人在草坪散步，国王说笑着问女儿们想嫁给谁。
        - id: ch01-b02
          speaker: eldest_princess
          text: “我要嫁给阿尔斯特国王。”
        - id: ch01-b03
          speaker: second_princess
          text: “那我就嫁给芒斯特国王。”
        - id: ch01-b04
          speaker: youngest_princess
          text: “我只要挪威棕熊做丈夫，别人谁也不要。”
        - id: ch01-b05
          speaker: narrator
          text: 小公主的乳母常给她讲一位中了魔法的王子，还把他叫作挪威棕熊。公主听着这些故事，早已爱上了他。前一夜，她又刚好梦见这位王子，所以父亲一问，最先来到嘴边的就是他的名字。一个姐姐笑过，另一个又笑，大家拿这句话逗了她一整晚。可当天夜里，公主从睡梦中醒来，竟发现自己躺在一座大厅里。上千盏灯把四周照得通明，最名贵的地毯铺满地面，墙上挂着金银织锦，盛装宾客挤满了大厅。梦中那位俊美王子也在那里。还没等公主回过神，他已经单膝跪在她面前，诉说自己有多么爱她，请她做他的王后。公主不忍拒绝，两人当晚便成了婚。
        - id: ch01-b06
          speaker: prince
          text: “亲爱的，我中了魔法。有个女巫想让我娶她美丽的女儿。我不肯，她就罚我白天变成熊。只有一位姑娘自愿嫁给我，再陪我熬过五年的磨难，我才能恢复自由。”
        - id: ch01-b07
          speaker: narrator
          text: 第二天早晨，公主身边空空的，整日都很难过。直到大厅的灯亮起来，两扇门突然敞开，王子转眼又坐到了她身旁。
        - id: ch01-b08
          speaker: prince
          text: “无论遇上什么事，请你别厌倦我，也别失去对我的信任。否则我们会永远分开，我也非娶女巫的女儿不可。”
        - id: ch01-b09
          speaker: narrator
          text: 公主渐渐习惯了丈夫白天不在身边。夜晚来临，他们仍旧快乐地相守。这样过了整整一年，公主生下一个漂亮的男孩。她原本已经很幸福，如今更添一倍欢喜，因为白天见不到王子时，孩子会一直陪着她。
    - id: ch02
      title: 三个被带走的孩子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一个闷热的晚上，一家三口坐在开着的窗边。一只鹰忽然飞进来，叼住婴儿的腰带，把他带上天空。公主尖叫着要跳出窗口追赶，王子一把抱住她，神情严肃地望着她。她想起丈夫的告诫，把哭喊和怨言全咽了回去。孤单的一年过去，又有一个漂亮的小女儿来到她身边。这次公主处处留心，窗户从来只开一道小缝。
        - id: ch02-b02
          speaker: narrator
          text: 可她再小心也没有用。又一个幸福的晚上，王子正抱着婴儿轻轻逗弄，一条漂亮的灵缇犬突然站到他们面前。它从父亲手里叼走孩子，眨一下眼的工夫便冲出了门。公主这次大喊起来，跟着跑出房间。隔壁明明有几个仆人，可他们全都说，既没见孩子，也没见狗从门前经过。公主说不清为什么，心里总觉得丈夫要为此负责，到底还是忍住了，一句责怪他的话也没说。
        - id: ch02-b03
          speaker: narrator
          text: 第三个孩子出生后，公主几乎不许任何门窗敞开。一天晚上，夫妻俩带着孩子坐在炉边，一个女人凭空出现在面前。公主吓得只顾盯着她。那女人用披巾裹住王子膝上的婴儿，不知沉进了地底，还是从宽大的烟囱飞走了。公主这一病，足足卧床一个月。
        - id: ch02-b04
          speaker: youngest_princess
          text: “亲爱的，我想再见父王、母后和姐姐们一面。要是能回家住几天，我心里也许会好受些。”
          emotion: sad
        - id: ch02-b05
          speaker: prince
          text: “好，我送你回去。等你想回来的时候，夜里躺下以后说出这个心愿就好。”
        - id: ch02-b06
          speaker: narrator
          text: 第二天醒来，公主已经躺在父亲宫中从前的房间里。她拉响铃铛，没过多久，父母和已经出嫁的姐姐们全都围到床边。见她平安回来，大家欢喜得笑出了眼泪。过了一阵，公主把这些年发生的事从头到尾讲给家人。她依旧像从前一样深爱丈夫，也相信孩子被带走不是他的本意。可是，只要想到将来还可能有孩子被人从自己身边夺走，她便怕得难以承受。
        - id: ch02-b07
          speaker: narrator
          text: 母亲和姐姐们拿不定主意，便去请教一个常来宫里送鸡蛋的聪明女人。她们十分相信这个女人的智慧。那女人说，王子每天早晨都得披上一张熊皮。只要设法拿到熊皮，再用火烧掉，他白天黑夜就都只能做人，身上的魔法也会彻底结束。家人都劝公主照办，她最后答应了。八天以后，她实在思念丈夫，便在夜里说出回去的心愿。三个钟头后，她睁开眼，已经回到丈夫的宫殿，王子本人正在床边守着她。夫妻俩都欢喜极了，又安稳地过了许多天。
        - id: ch02-b08
          speaker: narrator
          text: 公主这才留意到，从前丈夫每天清早离开，她竟从没觉得奇怪。还有一件事也很古怪：每晚临睡前，王子总不会忘记用金杯给她一杯甜饮。一天夜里，她装作喝下，其实一滴也没沾，还偷偷把饮料留了下来。清晨，她十分清醒，便把眼睛眯成一条缝，看见王子打开护墙板上的暗门，从那里走了出去。第二天晚上，她把留下的几滴安眠甜饮掺进王子的杯子。等他沉沉睡去，公主在午夜后起身，穿过暗门，发现墙角挂着一张美丽的棕熊皮。她悄悄退回来，下楼走到客厅，把熊皮投进炉火正中，一直烧成细细的灰。随后，她回到丈夫身旁躺下，在他脸颊上亲了一下，这才睡着。
        - id: ch02-b09
          speaker: narrator
          text: 第二天早晨的情景，她就是活上一百年也忘不了。王子低头望着她，满脸都是痛苦和愤怒。
        - id: ch02-b10
          speaker: prince
          text: “你害得我们永远分开了！为什么不能等满五年？现在我必须走三天，到女巫的城堡娶她女儿。熊皮原本保护着我，可你把它烧了。给你出主意的卖蛋女人，就是女巫本人。我不再责怪你，因为你将受到的惩罚已经够重了。永别了！”
          emotion: angry
    - id: ch03
      title: 三天的追赶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子最后吻了妻子一次，转身便走，脚步快得不能再快。公主在后面大声呼喊，见他毫无反应，便急忙穿好衣服追上去。王子不歇息，也不回头。公主拼命跟在远处，不让他走出自己的视线。他到了山顶，她还在谷底；等他下到谷底，她才爬上山头。太阳开始下沉时，公主几乎连命都要跑掉了。王子终于拐进一条小路，走入一间小屋。她用尽最后的力气爬到门前，进去便看见丈夫抱着一个漂亮的小男孩，又亲又搂。
        - id: ch03-b02
          speaker: prince
          text: “我可怜的爱人，这就是我们的长子。旁边那位女人，就是当初把他带走的鹰。”
        - id: ch03-b03
          speaker: narrator
          text: 公主顿时忘了所有悲伤，紧紧抱住孩子，在他身上又亲又吻，一会儿哭，一会儿笑。屋里的女人替他们洗净双脚，又仔细抹上一种药膏。药才抹好，骨头里的酸痛就全消失了，疲惫的三个人又精神得像清晨的雏菊。第二天太阳升起以前，王子便起身准备继续赶路。
        - id: ch03-b04
          speaker: prince
          text: “收下这把剪刀吧，它也许能帮助你。无论什么料子，只要用它来裁，都会变成丝绸。太阳升起，我就会忘记你和孩子们；太阳落下，我才会重新想起来。永别了！”
        - id: ch03-b05
          speaker: narrator
          text: 王子还没走远，公主已经把男孩留在小屋，再次追进他的视线。这一天和前一天一模一样。清晨，两人的影子长长地走在前面；到了傍晚，影子又跟在他们身后。王子一步不停，公主也一步不停。太阳下山时，他拐进另一条小路，他们在那里找到了小女儿。一家人重新欢聚，互相安慰，直到天亮。第三天出发以前，王子送给公主一把梳子，告诉她只要用它梳头，珍珠和钻石就会从发间落下。白天的王子仍受魔法驱使，只顾向前走，连一眼也不肯回头看。到了夜里，他们终于找到了最小的孩子。
        - id: ch03-b06
          speaker: prince
          text: “我可怜的妻子，拿着这个小线轴吧，上面的金线永远用不完。这里还有我们婚戒的一半。要是你能到我家，把两半戒指合在一起，我就会认出你。前面那片树林会让我忘掉我们之间的一切，就像我昨天才出生。亲爱的妻子和孩子，永别了！”
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: 太阳升起，王子朝树林走去。树林在他面前打开，又在他身后闭合。公主赶到时，面前仿佛堵着石墙。她绞着双手哭了一阵，忽然想起三件礼物。
        - id: ch03-b08
          speaker: youngest_princess
          text: “树林啊，我凭剪刀、梳子和线轴的魔力命令你，让我过去！”
        - id: ch03-b09
          speaker: narrator
          text: 树林果然打开了。公主沿着里面的小径一直向前，终于看见一座宫殿和宫前的草坪。树林边缘还有一间守林人小屋，正好坐落在离宫殿最近的地方。她走进小屋，请守林人夫妇收留自己做佣人。两人起初不愿答应，公主便说自己不要一分工钱。只要他们想要，她还会送上珍珠、钻石、丝绸和金线。夫妇俩听了这些条件，这才同意让她住下来。
    - id: ch04
      title: 三件魔法礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 公主很快听说，一位刚到的年轻王子住在女主人的宫殿里。他很少外出，总是沉默又忧伤，像在寻找遗失的东西。宫里的仆人也注意到了小屋里的美丽女子，常厚着脸皮来烦她，其中领班男仆最难缠。公主终于请他来喝茶。他得意洋洋，到处吹嘘这场邀请。晚上，他在公主的起居室坐得笔直，摆出大人物的口气，大谈宫中排场。
        - id: ch04-b02
          speaker: youngest_princess
          text: “劳驾，把头和手伸出窗外，替我剪一两枝忍冬好吗？”
        - id: ch04-b03
          speaker: narrator
          text: 男仆喜滋滋地照办了。
        - id: ch04-b04
          speaker: youngest_princess
          text: “凭我三件魔法礼物的力量，让一对角从他头上长出来，把他钉在小屋上！”
        - id: ch04-b05
          speaker: narrator
          text: 话音刚落，两只角便从男仆的耳朵前方冒出来，又绕到脑后合在一起，把他牢牢卡在窗口。这个可怜虫立刻大喊大叫，吼得震天响。从前听他吹嘘的仆人们很快成群赶来，一面冲他龇牙大笑、高声喝彩，一面拿火钳、铁锹和平底锅敲出拍子。男仆咒骂不停，双眼几乎鼓出眼眶，脸也涨得乌黑，两条腿还在身后发疯似的乱踢。公主看了一阵，终于可怜起他，这才解开魔法。两只角掉到了地上。男仆恨不得当场杀死公主，无奈浑身软得像水，连站也站不起来，只能让同伴抬回宫殿。
        - id: ch04-b06
          speaker: narrator
          text: 不知经过谁的嘴，这件事传到了王子耳中。他散步来到小屋附近，看见公主正坐在窗边缝衣服。她身上只有一套乡下女子的衣裳，却怎么也遮不住美貌。王子仔细端详了许久，心里越来越困惑。他说不清眼前这个人是不是自己幼年时见过的，也说不清那一切会不会只是一场梦。女巫的女儿也听说了这个陌生女子，亲自赶来察看。她到达时，公主正用牛皮纸裁一件长袍的纸样。剪刀每动一下，裁过的纸就变成丝绸，而且一寸比一寸华美。
        - id: ch04-b07
          speaker: witch_daughter
          text: “你要什么才肯把剪刀给我？”
        - id: ch04-b08
          speaker: youngest_princess
          text: “我不要别的，只要在王子寝室外过一夜。”
        - id: ch04-b09
          speaker: narrator
          text: 女巫的女儿气得想骂人，可眼看丝绸越来越华美，贪心终于占了上风。她答应了条件。那一夜，公主进了宫殿，可王子已经睡得极沉，怎么也叫不醒。她叹息抽泣，反复唱了一夜，全然没有用。
        - id: ch04-b10
          speaker: youngest_princess
          text: “与你成婚整四年，为你生下三娇儿。挪威棕熊回头看，请你转身看看我。”
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: 天刚露出曙光，傲慢的女人就走进来，把公主领了出去。她离开宫殿时，那个长过角的男仆还守在一旁，故意冲她吐舌头。第一次尝试没有半点收获。第二天，王子又经过小屋。他看了看公主，像一位王子问候普通农家姑娘那样，和气地向她致意，然后继续向前。随后女巫的女儿也来了，正看见公主梳理头发。梳子每动一下，珍珠和钻石便从发间滚落。第二笔交易就这样做成了。可第二个夜晚依旧只有悲伤。天亮时，公主再次离开城堡，那个男仆也再次守在原处，痛痛快快地报了仇。
        - id: ch04-b12
          speaker: narrator
          text: 第三天，王子路过时停下脚步，问陌生女子自己能否帮她。公主先问他夜里会不会醒。
        - id: ch04-b13
          speaker: prince
          text: “我平常会醒。可这两夜，我总在梦里听见一首好听的歌，怎么也醒不过来。那声音像是来自另一个世界，我很久以前一定认识她，也爱过她。”
        - id: ch04-b14
          speaker: youngest_princess
          text: “这两晚睡前，你喝过安眠的甜饮吗？”
        - id: ch04-b15
          speaker: prince
          text: “喝过。我妻子两晚都给了我一杯东西，我不知道那是不是安眠甜饮。”
        - id: ch04-b16
          speaker: youngest_princess
          text: “既然你愿意帮我，今晚别人递来的饮料，你一口也别尝。”
        - id: ch04-b17
          speaker: prince
          text: “好，今晚我什么也不喝。”
        - id: ch04-b18
          speaker: narrator
          text: 王子继续散步。女巫的女儿随后到来，看见公主用线轴绕出无穷无尽的金线，于是第三笔交易也谈成了。
    - id: ch05
      title: 半枚婚戒
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天黄昏，王子心绪不宁地躺在床上。门一开，公主走到床边坐下，又唱起那首歌。
        - id: ch05-b02
          speaker: youngest_princess
          text: “与你成婚整四年，为你生下三娇儿。挪威棕熊回头看，请你转身看看我。”
          emotion: sad
        - id: ch05-b03
          speaker: prince
          text: “挪威棕熊？我听不懂你在说什么。”
        - id: ch05-b04
          speaker: youngest_princess
          text: “王子，你不记得了吗？我曾经做了你四年的妻子。”
        - id: ch05-b05
          speaker: prince
          text: “我不记得。可我真希望你说的是真的。”
        - id: ch05-b06
          speaker: youngest_princess
          text: “那我们三个还活着的孩子，你也不记得了吗？”
        - id: ch05-b07
          speaker: prince
          text: “让我见见他们吧。我的脑子现在乱成了一团。”
        - id: ch05-b08
          speaker: youngest_princess
          text: “找出挂在你颈间的半枚婚戒，把它和我的这一半合起来。”
        - id: ch05-b09
          speaker: narrator
          text: 两半戒指刚刚合拢，魔法立刻破除。王子的全部记忆都回来了。他一把抱住妻子，两个人放声痛哭。
        - id: ch05-b10
          speaker: narrator
          text: 外面突然响起一片喊叫，紧接着，城堡的墙壁发出断裂和崩开的巨响。里面所有人都吓坏了，纷纷寻找出路。王子和公主也跟着人群逃到外面。等每个人都平安站上草坪，整座城堡就在身后轰然倒塌，震得方圆数英里的大地都在颤抖。从那一天起，再也没有人见过女巫和她的女儿。
        - id: ch05-b11
          speaker: narrator
          text: 没过多久，三个孩子全都回到了父母身边。王子和公主带着他们启程，返回自己从前居住的宫殿。爱尔兰国王、芒斯特国王和阿尔斯特国王也很快带着各自的妻子前来看望这一家人。愿每一个配得上幸福的人，都能像挪威棕熊和他的家人一样幸福。
        - id: ch05-b12
          speaker: narrator
          text: 这个故事选自《西部高地故事集》。
