  chapters:
    - id: ch01
      title: When Fish Walked on Land
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: You may think fish have always been fish and have never lived anywhere but water. Yet the black people of Australia's sandy central desert tell a very different story. They say that long, long ago, you could meet fish roaming across the land and hunting all kinds of animals.
        - id: ch01-b02
          speaker: narrator
          text: Think about the shape of a fish, and you can imagine how hard that must have been. Those fish were clever enough to manage it, though. They might still be hunting on land today if something terrible had not happened.
    - id: ch02
      title: The Storm over the Camp
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the whole fish tribe came home exhausted from a hunting trip. They searched for a cool, pleasant place to camp. The day was very hot, so they settled beneath the branches of a great tree beside a river.
        - id: ch02-b02
          speaker: narrator
          text: They built a cooking fire at the very edge of a steep bank. Far below lay a deep pool. While their food cooked, the fish stretched out lazily under the tree. They were almost asleep when a huge black cloud, which none of them had noticed, covered the sun.
        - id: ch02-b03
          speaker: narrator
          text: Heavy raindrops began to fall, and the fire nearly went out. That was serious. In a wild country with no matches, starting another fire was very difficult. Then an icy wind rose, chilling the poor fish right through.
        - id: ch02-b04
          speaker: thuggai
          text: This cannot go on. If we don't get the fire burning again, the cold will kill us.
        - id: ch02-b05
          speaker: narrator
          text: Thuggai, the oldest fish in the tribe, ordered his sons to rub two sticks together and try to kindle a flame. They rubbed until they were worn out, but could not make a single spark.
        - id: ch02-b06
          speaker: biernuga
          text: Give them to me. I'll try!
        - id: ch02-b07
          speaker: narrator
          text: Biernuga, the bony fish, had no better luck. Kumbal the bream tried too, and then the others took their turns. No one could raise a spark.
        - id: ch02-b08
          speaker: thuggai
          text: There's no use trying anymore. The wood is soaked. We can only wait for the sun to return and dry it.
    - id: ch03
      title: Guddhu's Fire
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then the youngest member of the tribe stepped forward. He was a very little fish, no more than four inches long. He bowed before Thuggai.
        - id: ch03-b02
          speaker: little_fish
          text: Please ask my father, Guddhu the cod, to start the fire. He knows more magic than almost any fish.
        - id: ch03-b03
          speaker: narrator
          text: So Thuggai called on Guddhu. The cod peeled several pieces of bark from a tree and laid them over the smoldering ashes. Then he knelt beside the fire and blew on it for a long time.
        - id: ch03-b04
          speaker: narrator
          text: Slowly, the faint red glow grew stronger. The edges of the bark began to curl. When the tribe saw that, they pressed close together with their backs turned toward the cutting wind.
        - id: ch03-b05
          speaker: guddhu
          text: Move around to the other side. I need the wind to blow into the fire.
        - id: ch03-b06
          speaker: narrator
          text: After a while, the spark became a flame, and the fish heard a cheerful crackling.
        - id: ch03-b07
          speaker: guddhu
          text: Bring me more wood!
        - id: ch03-b08
          speaker: narrator
          text: Everyone ran to gather branches and piled them onto the fire. The flames jumped and roared and sputtered.
        - id: ch03-b09
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: We'll be warm very soon! Guddhu truly is a great fish!
        - id: ch03-b10
          speaker: narrator
          text: Once again, the whole tribe crowded around the fire, edging nearer and nearer to its heat.
    - id: ch04
      title: The Fire beneath the Water
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: All at once, the wind shrieked. A powerful blast swept down from the hills and blew the fire straight toward them.
        - id: ch04-b02
          speaker: narrator
          text: The fish sprang back in a hurry. They forgot that they were standing at the edge of the steep bank. Down they all fell, one tumbling over another, until the entire tribe rolled into the pool below.
        - id: ch04-b03
          speaker: narrator
          text: Oh, how cold it was in that dark water, so deep that sunlight never reached it! Then, in an instant, the fish felt warm again. The fierce wind had driven the fire after them, all the way to the bottom of the pool, and it was burning there as brightly as ever.
        - id: ch04-b04
          speaker: narrator
          text: The fish gathered around it just as they had done at the top of the bank. Its flames were every bit as hot. Unlike fires on land, that fire never went out. It kept burning forever.
        - id: ch04-b05
          speaker: narrator
          text: And that is why, on a frosty day, the water deep below the cold surface feels comfortable and pleasant. If you could dive down to it, you would be sorry you could not stay.
        - id: ch04-b06
          speaker: narrator
          text: So the people of Australia's central desert tell the story.
