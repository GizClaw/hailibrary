audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    thuggai:
      display_name: 萨盖
      tts:
        delivery: 年长稳重，发号施令时果断而有威望
        timbre: 苍老浑厚的男声
        pace: 适中偏慢
        pitch: 低
    biernuga:
      display_name: 比尔努加
      tts:
        delivery: 热心爽快，急着出力时干脆利落
        timbre: 清亮结实的成年男声
        pace: 适中偏快
        pitch: 中
    little_fish:
      display_name: 小鱼
      tts:
        delivery: 年幼而恭敬，说话清楚，带着对父亲的信任
        timbre: 轻细明亮的童声
        pace: 适中
        pitch: 高
    guddhi:
      display_name: 古迪
      tts:
        delivery: 眼见火势转旺，招呼同伴时响亮急切
        timbre: 清脆有力的成年中性声线
        pace: 快
        pitch: 中高
    fish_1:
      display_name: 鱼儿甲
      tts:
        delivery: 朴实直率，和同伴交谈时自然亲切
        timbre: 温和的成年中性声线
        pace: 适中
        pitch: 中
    fish_2:
      display_name: 鱼儿乙
      tts:
        delivery: 朴实直率，和同伴交谈时自然亲切
        timbre: 清朗的成年中性声线
        pace: 适中
        pitch: 中高
    fish_3:
      display_name: 鱼儿丙
      tts:
        delivery: 朴实直率，和同伴交谈时自然亲切
        timbre: 稍低而柔和的成年中性声线
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 从前在陆地上的鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你也许以为，鱼一直住在水里，从来都是今天这个模样。可是到了澳大利亚，去问问大陆中央沙漠里的原住民，他们讲的故事可完全不同。
        - id: ch01-b02
          speaker: narrator
          text: 他们说，很久很久以前，鱼儿生活在陆地上。它们到处行走，还会捕猎各种野兽。想想鱼的身体，你就知道这件事有多难，也会明白它们有多聪明。要不是后来出了可怕的事，也许直到今天，它们还在陆地上打猎。
        - id: ch01-b03
          speaker: narrator
          text: 有一天，整个鱼族出猎回来，全都累坏了。天气又热，它们想找个清凉舒服的地方扎营，最后选中河岸边的一棵大树。树下枝叶成荫，旁边却是陡峭的岸沿，岸底还有一潭深水。鱼儿就在岸沿生起火来做饭，然后懒洋洋地躺进树荫，眼看都要睡着了。

    - id: ch02
      title: 快要熄灭的火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 谁也没发现，一大片乌云已经遮住太阳。沉重的雨点落下来，差点浇灭了火。在没有火柴的荒野里，火一灭就很难重新点着，这可不是小事。偏偏又刮起冰冷的风，把可怜的鱼儿冻得浑身发僵。
        - id: ch02-b02
          speaker: thuggai
          text: “不能再这样下去了。要是点不着火，我们都会冻死。”
        - id: ch02-b03
          speaker: narrator
          text: 说话的是鱼族里最年长的萨盖。他叫儿子们拿两根木棍不停地摩擦，盼着擦出火苗。儿子们一直磨到没有力气，却连一颗火星也没磨出来。
        - id: ch02-b04
          speaker: biernuga
          text: “让我也来试一试！”
        - id: ch02-b05
          speaker: narrator
          text: 骨头鱼比尔努加也失败了。鳊鱼昆巴尔接着试，其他鱼儿也轮流上前，结果谁都没能生起火来。
        - id: ch02-b06
          speaker: thuggai
          text: “别再试了，木头全湿透了。大家只能在这里等太阳出来，把它晒干。”
        - id: ch02-b07
          speaker: narrator
          text: 这时，鱼族里年纪最小的一条鱼来到萨盖面前，恭恭敬敬地低下身子。它只有四英寸长。
        - id: ch02-b08
          speaker: little_fish
          text: “请我的父亲鳕鱼古杜来生火吧。他懂很多法术，比大多数鱼都高明。”
        - id: ch02-b09
          speaker: narrator
          text: 萨盖请来了古杜。古杜从树上剥下几片树皮，盖到冒着微烟的灰烬上。他跪在火堆边，一口接一口地吹了很久。那点微弱的红光慢慢变亮，树皮的边缘也卷了起来。其他鱼儿一看有了希望，立刻挤到旁边，背朝刺骨的冷风。古杜却叫它们站到另一边，好让风吹进火堆。没过多久，火星蹿成了火苗，欢快地噼啪响起来。
        - id: ch02-b10
          speaker: guddhi
          text: “大家快再拿些木柴来！”
        - id: ch02-b11
          speaker: narrator
          text: 鱼儿们一齐跑去拾柴，把木柴全堆上去。火焰越蹿越高，呼呼地烧着，不时爆出噼啪声。

    - id: ch03
      title: 潭底不灭的火
      blocks:
        - id: ch03-b01
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: “我们很快就暖和了，古杜真了不起！”
        - id: ch03-b02
          speaker: narrator
          text: 鱼儿们互相说着，又围到火边，越挤越近。忽然，一阵风尖叫着冲下山丘，把火焰直吹向它们。鱼儿吓得连忙后退，竟忘了身后就是陡岸。它们一个撞上一个，全都摔了下去，又翻滚着落进岸底的深潭。
        - id: ch03-b03
          speaker: narrator
          text: 那潭水真冷啊。阳光从来照不进幽暗的水底，鱼儿冻得受不了。可只过了一瞬，它们又暖和起来。原来狂风把那堆火也吹下了岸，一直送到潭底。火在那里照样烧得明亮。
        - id: ch03-b04
          speaker: narrator
          text: 鱼儿像在岸上一样，重新围到火边。火焰还是那么热，而且水底的火跟陆地上的不一样，它永远也不会熄灭，就这样一直烧了下去。
        - id: ch03-b05
          speaker: narrator
          text: 所以现在你知道了。霜冻的日子里，只要潜过冰冷的水面，到了深处，那里便温暖又舒服。可惜你不能一直待在水底，离开时准会舍不得。
        - id: ch03-b06
          speaker: narrator
          text: 这个故事来自澳大利亚民间。
