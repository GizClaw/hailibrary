  chapters:
    - id: ch01
      title: The Raven's Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A great battle was coming between every creature on earth and all the birds of the air. When the news spread, the king of Tethertown's son vowed that he would watch the fighting and return with word of who would be king. Yet he arrived almost too late. Every fight was over except the last, between a snake and a huge black raven. They struck each other fiercely. At last the snake gained the upper hand and began winding around the raven's neck. Before it could choke him, the king's son drew his sword and cut off the snake's head with one blow.
        - id: ch01-b02
          speaker: narrator
          text: The raven saw that his enemy was dead and thanked the young man.
        - id: ch01-b03
          speaker: raven
          text: You saved me today, so I will show you a wonder. Climb onto the roots of my wings.
        - id: ch01-b04
          speaker: narrator
          text: The king's son climbed on. Before the raven came to rest, they had crossed seven mountains, seven glens, and seven mountain moors.
        - id: ch01-b05
          speaker: raven
          text: Do you see that house? Go straight there. My sister lives inside, and she will welcome you well. If she asks whether you were at the battle of the birds, say you were. If she asks whether you saw one like me, say you did. But meet me here again in the morning.
        - id: ch01-b06
          speaker: narrator
          text: The prince went straight to the house and answered the raven's sister just as he had been told. That night he was given every kind of meat and drink, warm water for his feet, and a soft bed. In the morning, he met the raven again. Another long flight carried them over seven mountains, seven glens, and seven mountain moors to another sister's house. The next day passed in the same way. But when he came to the meeting place on the fourth morning, no raven was waiting. Instead, he found the handsomest young man anyone had ever seen. The stranger held a bundle in his hand.
        - id: ch01-b07
          speaker: kings_son
          text: Is there a raven nearby?
        - id: ch01-b08
          speaker: raven
          text: I am that raven. You freed me from the spells that held me, and this bundle is your reward. Go home by the road you came. Spend one night in each house as before, but do not open the bundle until you reach the place where you most wish to live.
        - id: ch01-b09
          speaker: narrator
          text: The king's son started back along the same road. He slept for one night in each of the houses, just as he had on the outward journey. At last he entered a thick wood near his father's home. He had walked a long way through the trees when the bundle suddenly seemed to grow heavier. First he set it beneath a tree to rest. Then curiosity got the better of him, and he decided to see what was inside.
        - id: ch01-b10
          speaker: narrator
          text: The string came loose easily. Out sprang a great castle surrounded by an orchard full of fruit, flowers, and birds of every kind. Everything was ready for him to live there. But now the castle stood in the middle of the forest. He wished he had waited until he reached the green valley beside his father's palace. There was no use wishing now. He sighed, looked up, and saw an enormous giant coming toward him.
        - id: ch01-b11
          speaker: giant
          text: This is a poor place to build your house, king's son.
        - id: ch01-b12
          speaker: kings_son
          text: It is. This is not where I wanted it.
        - id: ch01-b13
          speaker: giant
          text: What will you give me if I pack it back into the bundle?
        - id: ch01-b14
          speaker: kings_son
          text: What do you want?
        - id: ch01-b15
          speaker: giant
          text: Give me your first son when he is seven years old.
        - id: ch01-b16
          speaker: kings_son
          text: If I have a son, you shall have him.
        - id: ch01-b17
          speaker: narrator
          text: At once, the castle and orchard folded into the bundle again.
        - id: ch01-b18
          speaker: giant
          text: Now you take your road, and I will take mine. If you forget your promise, I will remember it.
        - id: ch01-b19
          speaker: narrator
          text: The king's son went on with a light heart. In the green valley near his father's palace, he slowly untied the bundle, afraid he might find only stones or rags. But everything appeared just as before. When he opened the castle door, the most beautiful maiden anyone had ever seen stood inside.
        - id: ch01-b20
          speaker: queen
          text: Come in, king's son. Everything is ready, and we will marry at once.
        - id: ch01-b21
          speaker: narrator
          text: And so they did.
    - id: ch02
      title: The Giant's Claim
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The maiden proved to be a good wife. The king's son became a king himself, and the two of them lived so happily that the giant and his bargain slipped entirely from his mind. Seven years and a day passed. Then one morning, the king stood high on the ramparts and saw the giant striding toward the castle. At once, the old promise came rushing back to him. He also remembered that he had never told the queen a word about it. There was no time left to hide the truth. He told her the whole story and hoped she might find a way through their trouble.
        - id: ch02-b02
          speaker: narrator
          text: The queen listened without a word. When the tale was done, she gave him one answer.
        - id: ch02-b03
          speaker: queen
          text: Leave the giant to me.
        - id: ch02-b04
          speaker: narrator
          text: Just then, the giant entered the hall and stood before them.
        - id: ch02-b05
          speaker: giant
          text: Bring me your son! You promised him to me seven years and a day ago.
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: The king looked at his wife. She nodded.
        - id: ch02-b07
          speaker: kings_son
          text: Let his mother prepare him first.
        - id: ch02-b08
          speaker: narrator
          text: The queen left the hall. She dressed the cook's son in the prince's clothes and brought him to the giant. The giant took the boy by the hand, and they set off together. Before they had gone far, he stopped and held out a stick.
        - id: ch02-b09
          speaker: giant
          text: If your father had this stick, what would he do with it?
        - id: ch02-b10
          speaker: cooks_son
          text: He would beat the dogs and cats that steal the king's meat.
        - id: ch02-b11
          speaker: giant
          text: You are the cook's son! Go home to your mother.
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: The giant turned and strode straight back to the castle.
        - id: ch02-b13
          speaker: giant
          text: Trick me again, and the highest stone will soon be the lowest.
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: The king and queen trembled, but they could not bear to surrender their child.
        - id: ch02-b15
          speaker: queen
          text: The butler's son is the same age as ours. The giant will not know the difference.
        - id: ch02-b16
          speaker: narrator
          text: She dressed that boy in the prince's clothes, and the giant led him down the road. Again he stopped and offered the child a stick.
        - id: ch02-b17
          speaker: giant
          text: If your father had this rod, what would he do with it?
        - id: ch02-b18
          speaker: butlers_son
          text: He would beat the dogs and cats that break the king's glasses.
        - id: ch02-b19
          speaker: giant
          text: You are the butler's son! Go home to your mother.
          emotion: angry
        - id: ch02-b20
          speaker: narrator
          text: He spun around and marched back to the castle in a rage.
        - id: ch02-b21
          speaker: giant
          text: Bring out your son now, or the highest stone will be the lowest!
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: This time, they brought him the true prince. His parents wept bitterly as the giant led their child away. They imagined that the boy must be suffering every kind of dreadful thing. In truth, the giant treated him like his own son. There was only one strict rule. The boy was never allowed to see the giant's daughters. The years passed, and the little prince grew into a big boy. One day, the giant told him he had a journey to make. He would be gone for many hours, and the boy must amuse himself alone until he returned.
        - id: ch02-b23
          speaker: narrator
          text: The boy wandered to the top of the castle, a place he had never seen. Music reached him there. He opened a nearby door and found a girl sitting beside a window with a harp in her hands.
        - id: ch02-b24
          speaker: giants_daughter
          text: Hurry away! I can see the giant coming. Return when he is asleep, because I need to speak with you.
        - id: ch02-b25
          speaker: narrator
          text: The prince obeyed. When midnight struck, he crept back to the top of the castle.
        - id: ch02-b26
          speaker: giants_daughter
          text: Tomorrow you will be offered either of my two sisters as your wife. Refuse them both and ask for me. My father will be furious. He wants me to marry the Green City's king's son, and I do not like that man at all.
        - id: ch02-b27
          speaker: narrator
          text: Then they parted.
    - id: ch03
      title: The Three Tasks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day, just as the girl had said, the giant called his three daughters and the young prince before him.
        - id: ch03-b02
          speaker: giant
          text: Son of Tethertown's king, it is time for us to part. Choose one of my two elder daughters. After the wedding, you may take her to your father's house.
        - id: ch03-b03
          speaker: kings_son
          text: Give me your youngest daughter instead.
        - id: ch03-b04
          speaker: narrator
          text: The giant's face darkened.
        - id: ch03-b05
          speaker: giant
          text: First, you must finish three tasks.
        - id: ch03-b06
          speaker: kings_son
          text: Tell me what they are. I will do them.
        - id: ch03-b07
          speaker: narrator
          text: The giant led him out to the cows' byre.
        - id: ch03-b08
          speaker: giant
          text: No man has swept this byre for a hundred years. Before I return at nightfall, clean it so well that a golden apple could roll from one end to the other. Fail, and you will pay with your blood.
        - id: ch03-b09
          speaker: narrator
          text: The prince swept and shoveled from morning onward. Yet the dirt before him seemed as endless as the ocean. No matter how hard he worked, the byre never looked closer to clean. He kept at it all day, until his arms ached and he could hardly move. At last, when he had no strength left, the giant's youngest daughter appeared in the doorway.
        - id: ch03-b10
          speaker: giants_daughter
          text: Put down your weariness.
        - id: ch03-b11
          speaker: narrator
          text: He knew he could die only once, so he lay on the floor and fell sound asleep. When he woke, the girl was gone. The byre was spotless from end to end. He sprang up in amazement just as the giant entered.
        - id: ch03-b12
          speaker: giant
          text: Have you cleaned the byre, king's son?
        - id: ch03-b13
          speaker: kings_son
          text: I have.
        - id: ch03-b14
          speaker: giant
          text: You worked quickly today. Tomorrow, thatch this byre with one feather from every different bird. If you fail, you will pay with your blood.
        - id: ch03-b15
          speaker: narrator
          text: Before the sun rose, the prince took his bow and quiver and hurried onto the moor to hunt for feathers. He searched the sky, the grass, and every place a bird might hide. But not one bird appeared that day. He ran this way and that for hour after hour, until at last he was exhausted and lost all hope.
        - id: ch03-b16
          speaker: kings_son
          text: I can only die once.
        - id: ch03-b17
          speaker: narrator
          text: At midday, the giant's daughter came to him.
        - id: ch03-b18
          speaker: giants_daughter
          text: Are you tired, king's son?
        - id: ch03-b19
          speaker: kings_son
          text: I am. I have wandered for hours, and all I brought down were two blackbirds of the same color.
        - id: ch03-b20
          speaker: giants_daughter
          text: Lay your weariness on the grass.
        - id: ch03-b21
          speaker: narrator
          text: He lay down on the grass as she told him and fell fast asleep. When he woke, the girl had vanished. The two blackbirds were still all he had managed to bring down, so he rose and returned to the byre. As he came near, he rubbed his eyes hard, certain that he must be dreaming. The whole roof was beautifully thatched with feathers from different birds, exactly as the giant had demanded. At the house door, the giant was waiting for him.
        - id: ch03-b22
          speaker: giant
          text: Have you thatched the byre, king's son?
        - id: ch03-b23
          speaker: kings_son
          text: I have.
        - id: ch03-b24
          speaker: giant
          text: You have been quick again, so here is your last task. Beside that loch stands a fir tree. A magpie's nest with five eggs rests at its top. Bring me those eggs for breakfast. If even one is cracked, you will pay with your blood.
    - id: ch04
      title: The Magpie's Nest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Before daylight, the prince ran down to the loch. The tree was easy to find. The rising sun reddened its trunk, and the first branch stood five hundred feet above the ground. He walked around it again and again, hunting for the smallest knot where his foot might rest. The bark was smooth. To reach the top, he would have to grip the trunk with his knees like a sailor. But he was a king's son, not a sailor, and that made all the difference.
        - id: ch04-b02
          speaker: narrator
          text: Staring would do no good, so he tried. He struggled up a few feet and slid down. He tried until his hands and knees were sore. Once he climbed a little higher and began to hope. Then he slipped so hard that his hands and knees hurt worse than ever. He leaned against the trunk to catch his breath, and the giant's daughter spoke behind him.
        - id: ch04-b03
          speaker: giants_daughter
          text: You cannot stop now.
        - id: ch04-b04
          speaker: kings_son
          text: Every time I climb, I slide straight down again.
        - id: ch04-b05
          speaker: giants_daughter
          text: Try once more.
        - id: ch04-b06
          speaker: narrator
          text: She pressed one finger against the smooth trunk and told him to set his foot upon it. When he stepped up, she placed another finger a little higher. She made one small foothold after another while he climbed above her. In this way, the prince rose past the first branch and went on until he reached the very top, where the magpie had built her nest.
        - id: ch04-b07
          speaker: giants_daughter
          text: Hurry with the nest! My father's breath is burning my back.
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: The prince scrambled down as fast as he could. At the top, the girl's little finger caught in a branch, and she had to leave it behind. She had no time to worry about that. The sun was already rising over the hills.
        - id: ch04-b09
          speaker: giants_daughter
          text: Listen carefully. Tonight my sisters and I will wear identical clothes, so you will not know which one I am. When my father tells you to go to your wife, choose the woman whose right hand has no little finger.
        - id: ch04-b10
          speaker: narrator
          text: The prince took the eggs to the giant, who nodded.
        - id: ch04-b11
          speaker: giant
          text: Prepare for your marriage. The wedding will be tonight, and I will call your bride to meet you.
        - id: ch04-b12
          speaker: narrator
          text: The giant sent for his three daughters. All three entered in green silk gowns made alike, with golden circlets around their heads. The prince studied them. Which one was the youngest? Then he noticed that the woman in the middle had no little finger on her right hand. He placed his hand on her shoulder.
        - id: ch04-b13
          speaker: giant
          text: You chose well this time too. Still, perhaps we shall meet another way.
        - id: ch04-b14
          speaker: narrator
          text: The giant forced a laugh as if the prince's success amused him. But the bride caught a dangerous gleam in her father's eye. His words had not been a joke, and she knew they could not safely remain in his house.
    - id: ch05
      title: The Flight on the Blue-Grey Mare
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The wedding took place that night. Giants and gentlemen filled the hall, and they danced until the whole house shook. At last, the guests grew tired and left. The prince and his bride were alone.
        - id: ch05-b02
          speaker: giants_daughter
          text: If we stay until dawn, my father will kill you. You are my husband now, and I will save you as I did before.
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: She cut an apple into nine pieces and carefully placed them around the house. Two went at the head of the bed, two at the foot, two by the kitchen door, two at the great door, and the last piece went outside. Then she waited until the giant's snores sounded through the house. She and the prince crept out without a sound and stole across to the stable. The girl led out the blue-grey mare, sprang onto its back, and her husband mounted behind her. They rode away into the night. It was not long before the giant woke.
        - id: ch05-b04
          speaker: giant
          text: Are you asleep?
        - id: ch05-b05
          speaker: apple_head
          text: Not yet.
        - id: ch05-b06
          speaker: narrator
          text: The giant rolled over and soon snored as loudly as before. After a while, he called again.
        - id: ch05-b07
          speaker: giant
          text: Are you asleep?
        - id: ch05-b08
          speaker: apple_foot
          text: Not yet.
        - id: ch05-b09
          speaker: narrator
          text: The answer satisfied him. Later, he called for a third time.
        - id: ch05-b10
          speaker: giant
          text: Are you asleep?
        - id: ch05-b11
          speaker: apple_kitchen
          text: Not yet.
        - id: ch05-b12
          speaker: narrator
          text: A few minutes passed, and he asked once more.
        - id: ch05-b13
          speaker: giant
          text: Are you asleep?
        - id: ch05-b14
          speaker: apple_outside
          text: Not yet.
        - id: ch05-b15
          speaker: narrator
          text: This time the answer came from beyond the house door. The giant guessed the truth and ran to the bedroom. The bed was cold and empty.
        - id: ch05-b16
          speaker: giants_daughter
          text: My father's breath is burning my back! Reach into the mare's ear and throw whatever you find behind us.
          emotion: fearful
        - id: ch05-b17
          speaker: narrator
          text: The prince found a twig from a sloe tree and tossed it behind him. At once, twenty miles of thornwood sprang up, so dense that hardly a weasel could squeeze through. The giant charged straight into it, and the thorns caught his hair and beard.
        - id: ch05-b18
          speaker: giant
          text: This is one of my daughter's tricks. If I had my great axe and wood-knife, I would soon cut a path through.
        - id: ch05-b19
          speaker: narrator
          text: The giant turned around and went all the way home for the tools. Then he carried the heavy axe and wood-knife back to the thornwood. It took him only a short time to chop a road through the tangled blackthorn. Once the path was open, he laid both tools beneath a tree so that he could chase the riders without their weight.
        - id: ch05-b20
          speaker: giant
          text: I will leave them here until I come back.
        - id: ch05-b21
          speaker: narrator
          text: A hoodie crow perched on a branch above him had heard every word.
        - id: ch05-b22
          speaker: hoodie_crow
          text: Leave them here, and we will steal them.
        - id: ch05-b23
          speaker: giant
          text: You will, will you? Then I must carry them home.
        - id: ch05-b24
          speaker: narrator
          text: He took the tools home and began his pursuit again. At midday, the girl felt him gaining on them.
        - id: ch05-b25
          speaker: giants_daughter
          text: My father's breath is burning my back! Search the mare's ear and throw behind us whatever you find.
          emotion: fearful
        - id: ch05-b26
          speaker: narrator
          text: The prince drew out a splinter of grey stone. When he threw it, twenty miles of solid rock rose between them and the giant.
        - id: ch05-b27
          speaker: giant
          text: Nothing is harder than my daughter's tricks. With my lever and crowbar, I could soon force a way through this rock.
        - id: ch05-b28
          speaker: narrator
          text: But the lever and crowbar were at his house. Once again, he had to turn away from the chase and go home for his tools. He brought them back to the great wall of stone and began to hew. Before long, he had broken a road through the rock as well.
        - id: ch05-b29
          speaker: giant
          text: I will leave these tools here.
        - id: ch05-b30
          speaker: hoodie_crow
          text: Leave them, and we will steal them.
        - id: ch05-b31
          speaker: giant
          text: Steal them if you like. I have no time to turn back.
        - id: ch05-b32
          speaker: giants_daughter
          text: My father's breath is burning my back! Look in the mare's ear, king's son, or we are lost.
          emotion: fearful
        - id: ch05-b33
          speaker: narrator
          text: The prince found a tiny bladder filled with water and flung it behind them. It became a great loch. The giant was striding so fast that he could not stop. He walked straight into the middle and drowned.
    - id: ch06
      title: The Bride by the Well
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The blue-grey mare raced on like the wind. The next day, the prince saw his father's house ahead.
        - id: ch06-b02
          speaker: giants_daughter
          text: Get down and go inside. Tell them you have married me. But do not let any person or animal kiss you. If one does, you will forget me completely.
        - id: ch06-b03
          speaker: kings_son
          text: I will do exactly as you say.
        - id: ch06-b04
          speaker: narrator
          text: He left his bride waiting at the gate and went inside alone. Everyone who met the long-lost prince welcomed him with joy. He remembered the warning well enough to tell his father and mother that they must not kiss him. But as he greeted them, his old greyhound bounded forward. The dog leaped against his neck and kissed him right on the mouth. In that instant, the prince's promise, his bride, and everything she had done vanished from his memory.
        - id: ch06-b05
          speaker: narrator
          text: She sat on a well near the gate all day, waiting and waiting, but the prince never returned. When darkness fell, she climbed into an oak tree above the well. There she spent the whole night, still waiting.
        - id: ch06-b06
          speaker: narrator
          text: At midday the next day, a shoemaker's wife came to draw water for her husband. She saw the girl's reflection in the well and mistook it for her own.
        - id: ch06-b07
          speaker: shoemakers_wife
          text: Why, I am wonderfully handsome!
          emotion: surprised
        - id: ch06-b08
          speaker: narrator
          text: She bent closer to admire herself. Her jug struck the stones and shattered, so she went home without any water. Her husband was angry.
        - id: ch06-b09
          speaker: shoemaker
          text: You have lost your senses. Daughter, you go and bring me a drink.
          emotion: angry
        - id: ch06-b10
          speaker: narrator
          text: The shoemaker's daughter took another jug and went to the well. When she looked into the water, she too thought the lovely face belonged to her. She leaned over to admire it, struck the jug against the stones, and broke it just as her mother had.
        - id: ch06-b11
          speaker: shoemaker
          text: Where is the water?
        - id: ch06-b12
          speaker: narrator
          text: She came back holding nothing but the jug's handle. This time, the shoemaker went himself. He too saw a woman's reflection. But he looked up to see where it came from and discovered the most beautiful woman in the world sitting above him.
        - id: ch06-b13
          speaker: shoemaker
          text: Come down. You may stay in my house for a while.
        - id: ch06-b14
          speaker: narrator
          text: The girl was glad to accept. Now the country's king was preparing to marry. Young men from the court crowded into the shoemaker's shop to buy fine wedding shoes. They saw the girl working there.
        - id: ch06-b15
          speaker: first_young_man
          text: You have a beautiful daughter.
        - id: ch06-b16
          speaker: shoemaker
          text: She is beautiful, but she is not my daughter.
        - id: ch06-b17
          speaker: first_young_man
          text: I would pay a hundred pounds to marry her.
        - id: ch06-b18
          speakers: [second_young_man, third_young_man]
          ensemble: duo
          text: So would I!
        - id: ch06-b19
          speaker: shoemaker
          text: Her choice is no business of mine.
        - id: ch06-b20
          speaker: narrator
          text: The young men pressed the shoemaker to ask whether she would choose one of them for a husband. They wanted her answer the next day. When he put the question to her, the girl said she would marry the man who came with his purse. The shoemaker hurried to the first young man with the news. That eager suitor paid him a hundred pounds for carrying the message and then went straight to the girl, who was waiting for him.
        - id: ch06-b21
          speaker: giants_daughter
          text: Is that you? I am thirsty. Bring me a drink from the well over there.
        - id: ch06-b22
          speaker: narrator
          text: The young man poured out the water, but then he could not move from the spot. Hours passed with him still standing there.
        - id: ch06-b23
          speaker: giants_daughter
          text: Take that foolish boy away. I have had enough of him.
        - id: ch06-b24
          speaker: narrator
          text: At her words, the spell released him and he could walk again. He hurried home, but shame kept him from telling the other young men what had happened. The next day, the second suitor arrived to try his luck. He waited until evening. When the shoemaker had gone out and the two of them were alone, the girl gave him a simple request.
        - id: ch06-b25
          speaker: giants_daughter
          text: See whether the door is latched.
        - id: ch06-b26
          speaker: narrator
          text: He hurried to obey, but the moment he touched the latch, his fingers stuck fast. He pulled and twisted, yet he could not free them. Hours passed before the shoemaker came home and the girl finally released the spell. The young man went away with his head hanging and told no one what had befallen him. Then it was the third suitor's turn. He too found himself trapped, with one foot fastened to the floor. The girl kept him there until she chose to set him free. Grateful to escape, he ran off without looking behind him.
        - id: ch06-b27
          speaker: giants_daughter
          text: Keep the purse of gold. I do not need it, and it will help you.
        - id: ch06-b28
          speaker: narrator
          text: The shoemaker took the money. Then he said he must carry the wedding shoes to the castle.
        - id: ch06-b29
          speaker: giants_daughter
          text: I wish I could see the king's son before he marries.
          emotion: sad
        - id: ch06-b30
          speaker: shoemaker
          text: Then come with me. All the servants are my friends. They will let you stand in the passage where the king's son and the whole company must pass.
    - id: ch07
      title: The Golden and Silver Pigeons
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: They went up to the castle. When the young men saw the girl in the passage, they led her into the banquet hall and poured her some wine. She had just raised the glass when a flame rose from it. Two pigeons sprang out of the fire, one golden and one silver. They circled the girl's head. Then three grains of barley dropped onto the floor, and the silver pigeon swooped down and swallowed them.
        - id: ch07-b02
          speaker: golden_pigeon
          text: If you had remembered how I cleaned the byre, you would have shared with me.
        - id: ch07-b03
          speaker: narrator
          text: Three more grains fell, and once again the silver pigeon ate them.
        - id: ch07-b04
          speaker: golden_pigeon
          text: If you had remembered how I thatched the byre, you would have shared with me.
        - id: ch07-b05
          speaker: narrator
          text: Three more grains dropped. For the third time, the silver pigeon swallowed them.
        - id: ch07-b06
          speaker: golden_pigeon
          text: If you had remembered how I brought down the magpie's nest, you would have shared with me.
        - id: ch07-b07
          speaker: narrator
          text: Then the prince understood. The pigeons had come to remind him of everything he had forgotten. His lost memory returned. He recognized his wife and kissed her. Since all the wedding preparations were already made, it seemed a shame to waste them. So the couple married for a second time and sat down together at the wedding feast.
