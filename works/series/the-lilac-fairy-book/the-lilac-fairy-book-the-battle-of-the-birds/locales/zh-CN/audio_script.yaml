audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 年轻坦率，遇险时坚韧，作出承诺时郑重
        timbre: 清朗结实的年轻男声
        pace: 适中
        pitch: 中
    raven:
      display_name: 渡鸦
      tts:
        delivery: 感恩而神秘，叮嘱时清楚郑重
        timbre: 略带沙哑的年轻男声
        pace: 适中偏慢
        pitch: 中低
    giant:
      display_name: 巨人
      tts:
        delivery: 威严强硬，发怒时声势逼人，自语时粗声低沉
        timbre: 洪亮厚重的成年男声
        pace: 偏慢
        pitch: 低
    queen:
      display_name: 王后
      tts:
        delivery: 聪慧果断，危急时压低声音，面对爱人时温柔坚定
        timbre: 清澈柔韧的年轻女声
        pace: 适中
        pitch: 中高
    cook_son:
      display_name: 厨子的儿子
      tts:
        delivery: 孩子气而老实，想到什么便直接回答
        timbre: 稚嫩清脆的男童声
        pace: 适中偏快
        pitch: 高
    steward_son:
      display_name: 管家的儿子
      tts:
        delivery: 孩子气而直率，回答时毫不迟疑
        timbre: 明亮稚嫩的男童声
        pace: 适中
        pitch: 高
    apple:
      display_name: 苹果
      tts:
        delivery: 神秘而简短，像从远处替人作答
        timbre: 轻柔朦胧的中性声音
        pace: 舒缓
        pitch: 中
    giant_daughter:
      display_name: 巨人的小女儿
      tts:
        delivery: 聪明勇敢，提醒危险时急切，谋划逃亡时冷静坚定
        timbre: 清亮温柔的年轻女声
        pace: 适中偏快
        pitch: 中高
    hooded_crow:
      display_name: 灰背鸦
      tts:
        delivery: 直截了当，带一点机灵的提醒意味
        timbre: 干脆略哑的成年男声
        pace: 适中偏快
        pitch: 中
    shoemaker_wife:
      display_name: 鞋匠妻子
      tts:
        delivery: 自得而轻快，误会水中倒影时满心惊喜
        timbre: 明亮朴实的成年女声
        pace: 适中
        pitch: 中高
    shoemaker:
      display_name: 鞋匠
      tts:
        delivery: 脾气直爽，待客时朴实厚道
        timbre: 粗实温暖的成年男声
        pace: 适中
        pitch: 中低
    suitor_one:
      display_name: 第一个年轻人
      tts:
        delivery: 热切自信，急于讨好心上人
        timbre: 明朗的年轻男声
        pace: 适中偏快
        pitch: 中
    suitor_two:
      display_name: 第二个年轻人
      tts:
        delivery: 殷勤顺从，做事时略显急切
        timbre: 清亮的年轻男声
        pace: 适中
        pitch: 中
    suitor_three:
      display_name: 第三个年轻人
      tts:
        delivery: 自信中带着拘谨，受挫后慌张
        timbre: 温和的年轻男声
        pace: 适中
        pitch: 中
    golden_dove:
      display_name: 金鸽
      tts:
        delivery: 清亮悠远，反复提醒时哀婉而坚定
        timbre: 轻柔空灵的年轻女声
        pace: 舒缓
        pitch: 高
  chapters:
    - id: ch01
      title: 渡鸦的报答
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大地上的走兽要和空中的飞鸟大战一场。泰瑟敦国王的儿子听到消息，非要亲眼看看最后谁会称王。可他赶到战场时，其他争斗都结束了，只剩一条蛇和一只大黑渡鸦。两边拼尽力气，蛇渐渐占了上风，眼看就要缠住渡鸦的脖子，把它活活勒死。王子拔剑一挥，斩掉了蛇头。
        - id: ch01-b02
          speaker: raven
          text: “你今天救了我，我也带你去见识一番。来，坐到我两边翅膀根上。”
        - id: ch01-b03
          speaker: narrator
          text: 王子坐稳以后，渡鸦一直向前飞，越过七座山峰、七道幽谷，又飞过七片山间荒原。
        - id: ch01-b04
          speaker: raven
          text: “看见那边的屋子了吗？一直走过去，我的一个姐姐住在那里。她会好好招待你。她若问你去没去过群鸟之战，你就说去过。她再问你有没有见过长得像我的，你就说见过。不过明早一定要回这里找我。”
        - id: ch01-b05
          speaker: narrator
          text: 王子照着做了。那天夜里，天下各种肉食和饮品都摆在他面前，还有热水洗脚，软床安睡。第二天和第三天也一模一样。到了第四次相会，渡鸦没有出现，等在那里的是世间最俊美的青年，手里还拿着一个包袱。
        - id: ch01-b06
          speaker: prince
          text: “附近那只渡鸦去哪儿了？”
        - id: ch01-b07
          speaker: raven
          text: “我就是那只渡鸦。你救我摆脱了缚住我的魔法，这个包袱是我给你的报答。照原路回去，每间屋子都住一夜。记住，走到你最想安家的地方以前，千万别打开它。”
        - id: ch01-b08
          speaker: narrator
          text: 王子踏上归途，一路和来时一样。后来，他走进父亲住所附近的密林。走了很久，包袱突然越来越沉。他把它放到树下，忍不住想，打开看看又有什么关系呢？绳结很容易便松开了。
        - id: ch01-b09
          speaker: narrator
          text: 包袱里竟冒出一座宏伟的城堡。周围的果园结满果实，鲜花盛开，各种鸟儿来回飞翔。这里什么都有，马上就能住人。可城堡偏偏落在森林正中。王子后悔极了。他原本只要再忍一会儿，就能在父亲王宫旁那片青翠的山谷里打开包袱。可现在后悔也迟了。他叹了口气，一抬头，看见一个高大的巨人迎面走来。
        - id: ch01-b10
          speaker: giant
          text: “王子，你选的盖房地方可真够糟。”
        - id: ch01-b11
          speaker: prince
          text: “是啊，我根本不想住在这儿。”
        - id: ch01-b12
          speaker: giant
          text: “要是我能把它重新装回包袱，你拿什么谢我？”
        - id: ch01-b13
          speaker: prince
          text: “你想要什么？”
        - id: ch01-b14
          speaker: giant
          text: “等你有了第一个儿子，孩子满七岁时，把他交给我。”
        - id: ch01-b15
          speaker: prince
          text: “如果我有儿子，他就是你的。”
        - id: ch01-b16
          speaker: narrator
          text: 他刚说完，城堡和果园就被重新裹进包袱。
        - id: ch01-b17
          speaker: giant
          text: “现在你走你的路，我走我的路。你会忘掉这个承诺，我可不会。”
        - id: ch01-b18
          speaker: narrator
          text: 王子心里轻快了，继续赶路。来到父亲王宫旁的青翠山谷，他慢慢解开包袱，生怕里面只剩石块破布。可城堡和果园又完整地出现了。他推开大门，世间最美丽的姑娘正站在里面。
        - id: ch01-b19
          speaker: queen
          text: “请进吧，王子。这里都准备好了，我们马上成婚。”
        - id: ch01-b20
          speaker: narrator
          text: 两人果真成了婚。姑娘是一位贤良的妻子，王子也继承王位，做了国王。他过得太幸福，早把巨人忘得干干净净。

    - id: ch02
      title: 七年后的约定
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 七年零一天过去了。一天早晨，国王站在城墙上，看见巨人大步朝城堡走来。他这才想起当年的承诺，也想起自己从没告诉过王后。事到如今，他只能说出真相，盼着妻子能想出办法。
        - id: ch02-b02
          speaker: queen
          text: “这件事交给我和巨人处理。”
        - id: ch02-b03
          speaker: narrator
          text: 王后话音刚落，巨人已经走进大厅，站到他们面前。
        - id: ch02-b04
          speaker: giant
          text: “把你的儿子带出来！七年零一天以前，你答应把他交给我。”
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 国王看向妻子。王后点了点头。
        - id: ch02-b06
          speaker: prince
          text: “先让孩子的母亲替他收拾好。”
        - id: ch02-b07
          speaker: narrator
          text: 王后离开大厅，给厨子的儿子换上小王子的衣服，把他领到巨人面前。巨人牵着孩子走了一段路，忽然停下，把一根棍子递到他眼前。
        - id: ch02-b08
          speaker: giant
          text: “这根棍子要是在你父亲手里，他会拿来做什么？”
        - id: ch02-b09
          speaker: cook_son
          text: “我父亲会拿它打那些偷吃国王肉食的猫和狗。”
        - id: ch02-b10
          speaker: giant
          text: “你是厨子的儿子！回你母亲那里去。”
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 巨人转身赶回城堡。
        - id: ch02-b12
          speaker: giant
          text: “你们再敢骗我，我就让城堡最高的石头落到最底下！”
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 国王和王后吓得发抖，却还是舍不得自己的孩子。
        - id: ch02-b14
          speaker: queen
          text: “管家的儿子和我们的孩子同岁。巨人认不出来。”
        - id: ch02-b15
          speaker: narrator
          text: 王后又给管家的儿子换上王子衣服。巨人牵着他上路，没走多远，又递出一根棍子。
        - id: ch02-b16
          speaker: giant
          text: “要是你父亲拿到这根棍子，他会用来做什么？”
        - id: ch02-b17
          speaker: steward_son
          text: “他会用它打那些弄碎国王杯子的猫和狗。”
        - id: ch02-b18
          speaker: giant
          text: “你是管家的儿子！回你母亲那里去。”
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: 巨人猛地转身，怒气冲冲地回到城堡。
        - id: ch02-b20
          speaker: giant
          text: “立刻把你们的儿子带出来！不然，我就让最高的石头落到最底下！”
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: 这一次，国王和王后只能交出真正的小王子。他们痛哭不止，以为孩子不知正在受什么折磨。其实巨人待他像亲儿子，衣食起居都不亏待他，只是不许他见自己的女儿们。

    - id: ch03
      title: 巨人的三件难事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小王子渐渐长大了。一天，巨人出门远行，让他独自消磨几个时辰。男孩在城堡里到处走，来到从没去过的顶层。忽然，他听见乐声，便推开身旁的门。窗边坐着一个抱竖琴的姑娘。
        - id: ch03-b02
          speaker: giant_daughter
          text: “快走，我看见父亲就要回来了。等他睡着以后再来，我有话告诉你。”
        - id: ch03-b03
          speaker: narrator
          text: 王子依言离开。午夜钟声一响，他又悄悄来到顶层。姑娘原来是巨人的小女儿。
        - id: ch03-b04
          speaker: giant_daughter
          text: “明天，父亲会叫你从我的两个姐姐里挑一个做妻子。你一定要说，两个都不要，你只要我。他会大发雷霆，因为他想把我嫁给绿城国王的儿子。可我一点也不喜欢那个人。”
        - id: ch03-b05
          speaker: narrator
          text: 两人就此分开。第二天，巨人果然把三个女儿和年轻的王子叫到面前。
        - id: ch03-b06
          speaker: giant
          text: “泰瑟敦国王的儿子，我们该分别了。从我的两个大女儿里选一个做妻子。婚礼过后的第二天，你就能带她回父亲家。”
        - id: ch03-b07
          speaker: prince
          text: “请把最小的女儿嫁给我。”
        - id: ch03-b08
          speaker: narrator
          text: 巨人的脸一下阴沉下来。
        - id: ch03-b09
          speaker: giant
          text: “那你得先替我办成三件事。”
        - id: ch03-b10
          speaker: prince
          text: “说吧，我一定办到。”
        - id: ch03-b11
          speaker: narrator
          text: 巨人把他带到牛棚。
        - id: ch03-b12
          speaker: giant
          text: “这座牛棚一百年没打扫了。今晚我回来时，你得把它收拾得干干净净，让一只金苹果能从这头滚到那头。办不到，就用你的血偿命。”
        - id: ch03-b13
          speaker: narrator
          text: 年轻人苦干了一整天，可这活儿像抽干大海一样，怎么也做不完。最后，他累得几乎动不了。巨人的小女儿这时来到门口。
        - id: ch03-b14
          speaker: giant_daughter
          text: “别再硬撑了，把疲惫放下吧。”
        - id: ch03-b15
          speaker: narrator
          text: 王子想，人反正只能死一次，便倒下睡着了。醒来时，姑娘已经不见，牛棚却干净得能让金苹果从一头滚到另一头。他惊讶地跳起来，巨人恰好走进来。
        - id: ch03-b16
          speaker: giant
          text: “王子，牛棚打扫好了吗？”
        - id: ch03-b17
          speaker: prince
          text: “打扫好了。”
        - id: ch03-b18
          speaker: giant
          text: “好。你今天既然这么能干，明天就拿每一种鸟的一根羽毛，给牛棚铺上屋顶。办不到，还是拿血偿命。”
        - id: ch03-b19
          speaker: narrator
          text: 天还没亮，年轻人就背着弓箭出去猎鸟。他走上荒原，可整整一天连一只鸟也没看见。他来回奔走了许久，累得筋疲力尽，终于灰了心。到了中午，巨人的女儿来了。
        - id: ch03-b20
          speaker: giant_daughter
          text: “王子，你累了吗？”
        - id: ch03-b21
          speaker: prince
          text: “累坏了。我转了几个时辰，只射到两只乌鸫，偏偏还是同一种颜色。”
        - id: ch03-b22
          speaker: giant_daughter
          text: “把疲惫留在草地上吧。”
        - id: ch03-b23
          speaker: narrator
          text: 王子躺下，很快睡熟。醒来后，姑娘又不见了。他回到牛棚，快走近时使劲揉了揉眼睛，还以为自己在做梦。屋顶铺得美极了，正合巨人的要求。巨人在门口等着。
        - id: ch03-b24
          speaker: giant
          text: “王子，牛棚的屋顶铺好了吗？”
        - id: ch03-b25
          speaker: prince
          text: “铺好了。”
        - id: ch03-b26
          speaker: giant
          text: “好。你既然这么能干，我再给你最后一件事。看见湖边那棵冷杉了吗？树顶有个喜鹊窝，里面有五颗蛋。明早把蛋拿来给我吃。只要裂开或摔破一颗，你就用血偿命。”
        - id: ch03-b27
          speaker: narrator
          text: 第二天天没亮，王子就跳下床，飞快跑到湖边。那棵冷杉并不难找，初升的太阳把树干照得通红。树高五百英尺，离地五百英尺才长出第一根树枝。他绕着树走了一圈又一圈，连最小的落脚树瘤也找不到，树皮光滑得厉害。要爬上去，只能像水手那样用膝盖夹住树干，一点点往上蹭。可王子毕竟不是水手，这差别实在太大了。
        - id: ch03-b28
          speaker: narrator
          text: 光站着看没有用，他只好一次次试。手掌和膝盖都磨疼了，他每次刚爬上几英尺就滑下来。有一回，他好不容易爬得更高，刚生出一点希望，又重重滑回地面。他靠着树干喘气，姑娘的声音从身边响起。
        - id: ch03-b29
          speaker: giant_daughter
          text: “现在还不能歇。”
        - id: ch03-b30
          speaker: prince
          text: “唉，我才爬上去，一转眼又掉下来了。”
        - id: ch03-b31
          speaker: giant_daughter
          text: “再试一次。”
        - id: ch03-b32
          speaker: narrator
          text: 她把一根手指贴在树上，让王子踩住，再把另一根手指放到更高的地方。她一根接一根地搭成阶梯，直到王子爬上树顶，来到喜鹊窝前。
        - id: ch03-b33
          speaker: giant_daughter
          text: “快把鸟窝拿下来！我父亲的气息已经灼到我背上了！”
          emotion: fearful
        - id: ch03-b34
          speaker: narrator
          text: 王子赶紧往下爬。姑娘的小指却勾在树顶的枝丫上，只能把那根手指留在那里。太阳已经越过群山，她急着赶时间，顾不上断指。
        - id: ch03-b35
          speaker: giant_daughter
          text: “听好。今晚我和两个姐姐会穿一样的衣裳，你分不出谁是谁。父亲叫你走到妻子身边时，你就找右手没有小指的那一个。”

    - id: ch04
      title: 婚礼后的逃亡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子把五颗鸟蛋交给巨人。巨人点了点头。
        - id: ch04-b02
          speaker: giant
          text: “准备成婚吧！婚礼今晚就办，我这就叫你的新娘来见你。”
        - id: ch04-b03
          speaker: narrator
          text: 三个女儿都被叫来。她们穿着同样的绿绸衣裳，头上戴着金环，一起走进屋里。王子看看这个，又看看那个，怎么也认不出小女儿。忽然，他注意到中间那位姑娘的手。她没有小指。王子走过去，把手搭在她肩上。
        - id: ch04-b04
          speaker: giant
          text: “这一次你也选对了。不过往后，我们说不定还会换一种方式见面。”
        - id: ch04-b05
          speaker: narrator
          text: 巨人装出笑脸，新娘却看见他眼中的寒光，知道危险快来了。婚礼就在当晚举行。大厅里满是巨人和贵客。众人不停跳舞，整座房子从上到下都在摇。最后，宾客终于倦了，纷纷离去，只剩王子和新娘。
        - id: ch04-b06
          speaker: giant_daughter
          text: “要是留到天亮，我父亲一定会杀你。可你已经是我的丈夫，我还会像从前那样救你。”
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 她把一只苹果切成九块。床头放两块，床脚放两块，厨房门口放两块，大门口放两块，屋外再放一块。听见巨人的鼾声以后，她和王子轻轻溜出屋子，穿过院子来到马厩。她牵出青灰色母马，跃上马背，丈夫坐在她身后。两人离开没多久，巨人就醒了。
        - id: ch04-b08
          speaker: giant
          text: “你们睡了吗？”
        - id: ch04-b09
          speaker: apple
          text: “还没有。”
        - id: ch04-b10
          speaker: narrator
          text: 回答来自床头的苹果。巨人翻过身，很快又打起鼾来。过了一阵，他再次开口。
        - id: ch04-b11
          speaker: giant
          text: “你们睡了吗？”
        - id: ch04-b12
          speaker: apple
          text: “还没有。”
        - id: ch04-b13
          speaker: giant
          text: “你们睡了吗？”
        - id: ch04-b14
          speaker: apple
          text: “还没有。”
        - id: ch04-b15
          speaker: narrator
          text: 这一次，声音从床脚传来，巨人便放了心。又过了一会儿，他第三次开口，厨房门口的苹果仍替两人回答。几分钟后，巨人第四次问道。
        - id: ch04-b16
          speaker: giant
          text: “你们睡了吗？”
        - id: ch04-b17
          speaker: apple
          text: “还没有。”
        - id: ch04-b18
          speaker: narrator
          text: 这回，回答声竟从屋门外传来。巨人猜到出了事，连忙跑进房间亲眼查看。床上冰冷而空荡！
        - id: ch04-b19
          speaker: giant_daughter
          text: “我父亲的气息已经灼到我背上了！把手伸进母马耳朵，摸到什么都扔到身后！”
          emotion: fearful
        - id: ch04-b20
          speaker: narrator
          text: 王子从马耳里摸出一根黑刺李树枝，回手一扔。身后立刻长出二十英里长的荆棘林，密得连黄鼠狼也钻不过去。巨人正大步猛追，一头扎进荆棘，头发和胡须全被扯住。
        - id: ch04-b21
          speaker: giant
          text: “这准是我女儿的把戏。只要拿来大斧和砍柴刀，我很快就能劈出路来。”
        - id: ch04-b22
          speaker: narrator
          text: 巨人赶回家取来工具，很快劈开黑刺李丛。他把斧头和刀放到一棵树下。
        - id: ch04-b23
          speaker: giant
          text: “先放在这儿，回来时再拿。”
        - id: ch04-b24
          speaker: narrator
          text: 树枝上的一只灰背鸦听见了。
        - id: ch04-b25
          speaker: hooded_crow
          text: “你敢留下，我们就敢偷走。”
        - id: ch04-b26
          speaker: giant
          text: “你们还真会偷。看来我只能送回家了。”
        - id: ch04-b27
          speaker: narrator
          text: 他把工具送回去，又重新追赶。到了中午，姑娘再次感觉父亲逼近。
        - id: ch04-b28
          speaker: giant_daughter
          text: “我父亲的气息又灼到我背上了！快摸母马耳朵，拿到什么就往后扔！”
          emotion: fearful
        - id: ch04-b29
          speaker: narrator
          text: 王子摸出一块灰色碎石，抛到身后。眨眼间，一道二十英里厚的坚硬岩壁挡住了巨人。
        - id: ch04-b30
          speaker: giant
          text: “我女儿的把戏，世上没有更难对付的。要是有撬杆和铁棍，我照样很快凿出一条路。”
        - id: ch04-b31
          speaker: narrator
          text: 工具不在身边，巨人只得回家去取。拿到以后，他没花多久就凿通了岩石。
        - id: ch04-b32
          speaker: giant
          text: “这回我要把工具留在这里。”
        - id: ch04-b33
          speaker: narrator
          text: 上方石头上又蹲着一只灰背鸦。
        - id: ch04-b34
          speaker: hooded_crow
          text: “留下吧，我们会把它们偷走。”
        - id: ch04-b35
          speaker: giant
          text: “想偷就偷，我没工夫再回家了。”
        - id: ch04-b36
          speaker: giant_daughter
          text: “我父亲又追上来了！快看看母马耳朵里还有什么，王子，不然我们就完了！”
          emotion: fearful
        - id: ch04-b37
          speaker: narrator
          text: 王子摸到一只装满水的小囊，立刻扔向身后。小囊落地，变成一片大湖。巨人一路疾冲，根本停不住脚，径直走到湖心，淹死了。
        - id: ch04-b38
          speaker: narrator
          text: 青灰色母马迎着风飞奔。第二天，王子远远看见了父亲的住所。
        - id: ch04-b39
          speaker: giant_daughter
          text: “你下马进去，告诉大家你已经娶我为妻。不过千万别让任何人或牲畜亲吻你，不然你会把我忘得一干二净。”
        - id: ch04-b40
          speaker: prince
          text: “我会照你的话做。”
        - id: ch04-b41
          speaker: narrator
          text: 王子把妻子留在门外。遇见他的人都来欢迎，他也特意告诉父母不要亲吻他。可问候之间，那只年老的猎犬扑到他颈上，舔了他的嘴。从这一刻起，他再也不记得巨人的女儿了。

    - id: ch05
      title: 井边的姑娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 巨人的女儿在大门附近的井台上坐了一整天。她等了又等，王子始终没来。天黑以后，她爬上那棵遮住井口的橡树，在树上躺了一夜。第二天醒来，她仍旧守在那里，等了又等。
        - id: ch05-b02
          speaker: narrator
          text: 第二天中午，住在井边的鞋匠妻子来打水给丈夫喝。她看见水里映着树上姑娘的脸，却以为那是自己的倒影。
        - id: ch05-b03
          speaker: shoemaker_wife
          text: “瞧啊，我原来这么漂亮！”
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: 她俯下身，想看得更清楚，水罐却撞上井石，摔得粉碎。她只好空手回去，丈夫见了很生气。
        - id: ch05-b05
          speaker: shoemaker
          text: “你一定是疯了！女儿，你去给我打水。”
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: 女儿到了井边，也把水中的影子当成自己的脸。她和母亲一样俯身去看，水罐又撞在井石上。她回来时，手中只剩一个水罐把手。
        - id: ch05-b07
          speaker: shoemaker
          text: “水到哪里去了？”
        - id: ch05-b08
          speaker: narrator
          text: 鞋匠只好亲自去井边。他也在水中看见女子的倒影，却抬头去找影子的来处。树上果然坐着世间最美丽的姑娘。
        - id: ch05-b09
          speaker: shoemaker
          text: “下来吧。你可以先住在我家里。”
        - id: ch05-b10
          speaker: narrator
          text: 姑娘正想找个住处，立刻下了树。这时候，这个国家的国王正准备成婚。宫廷里的年轻人纷纷来到鞋匠铺，购买婚礼上穿的漂亮鞋子。他们看见姑娘坐在那里做活，都很惊讶。
        - id: ch05-b11
          speaker: suitor_one
          text: “你有个这么漂亮的女儿。”
        - id: ch05-b12
          speaker: shoemaker
          text: “她确实漂亮，可她不是我的女儿。”
        - id: ch05-b13
          speaker: suitor_one
          text: “要是她肯嫁给我，我愿意拿出一百英镑。”
        - id: ch05-b14
          speakers: [suitor_two, suitor_three]
          ensemble: duo
          text: “我也愿意！”
        - id: ch05-b15
          speaker: shoemaker
          text: “她嫁给谁，我可做不了主。”
        - id: ch05-b16
          speaker: narrator
          text: 年轻人请鞋匠替他们问一问，让姑娘从中挑一个丈夫，第二天再告诉他们答案。鞋匠去问，姑娘说，谁随身带着钱袋来，她就愿意嫁给谁。鞋匠急忙找到最先开口的年轻人。那人回来，先给鞋匠一百英镑作报信的酬劳，才去见等候他的姑娘。
        - id: ch05-b17
          speaker: giant_daughter
          text: “是你吗？我口渴了，请你从那边的井里舀点水给我。”
        - id: ch05-b18
          speaker: narrator
          text: 年轻人把水倒出来，双脚却再也挪不动了。他只能站在原地，一站就是好几个时辰。
        - id: ch05-b19
          speaker: giant_daughter
          text: “把这个傻小子带走吧，我已经烦透他了。”
          emotion: disgusted
        - id: ch05-b20
          speaker: narrator
          text: 她一说完，年轻人就能走了。他赶紧回家，却没把遭遇告诉任何人。第二天，另一个年轻人来了。到了傍晚，鞋匠出门，只留下他们两人。
        - id: ch05-b21
          speaker: giant_daughter
          text: “去看看门闩插好了没有。”
        - id: ch05-b22
          speaker: narrator
          text: 年轻人赶忙去看，手指刚碰门闩就牢牢粘住。他被困了好几个时辰。鞋匠回来以后，姑娘才放他离开。他垂头丧气地回了家，对自己的遭遇只字不提。接着，第三个年轻人来了。他的一只脚牢牢粘在地板上，怎么拔也拔不动。直到姑娘替他解开，他才像得了大赦，飞快逃走，连头也不敢回。
        - id: ch05-b23
          speaker: giant_daughter
          text: “这袋金币你收下吧。我留着没用，你拿去还能让日子好过些。”
        - id: ch05-b24
          speaker: narrator
          text: 鞋匠收下钱，又说自己该把婚礼用的鞋送到城堡去了。
        - id: ch05-b25
          speaker: giant_daughter
          text: “王子成婚以前，我真想再看他一眼。”
          emotion: sad
        - id: ch05-b26
          speaker: shoemaker
          text: “那就跟我走吧。仆人们都是我的朋友，他们会让你站在过道里。王子和宾客都会从那里经过。”

    - id: ch06
      title: 两只鸽子唤回记忆
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 两人来到城堡。那些年轻人看见姑娘站在过道里，便把她领进摆好宴席的大厅，还给她倒了一杯酒。她正要举杯，杯中忽然升起一簇火焰。火焰里跃出两只鸽子，一只是金色，一只是银色。它们绕着姑娘的头顶一圈圈飞。这时，三粒大麦落到地上，银鸽俯冲下去，一口全吞了。
        - id: ch06-b02
          speaker: golden_dove
          text: “你若还记得我替你扫干净牛棚，就该把我的那份留给我。”
        - id: ch06-b03
          speaker: narrator
          text: 金鸽说话的时候，又有三粒大麦落下。银鸽和刚才一样，全都吃掉了。
        - id: ch06-b04
          speaker: golden_dove
          text: “你若还记得我替你铺好牛棚的屋顶，就该把我的那份留给我。”
        - id: ch06-b05
          speaker: narrator
          text: 第三回，三粒大麦再次落下，又被银鸽吃个干净。
        - id: ch06-b06
          speaker: golden_dove
          text: “你若还记得我替你取下喜鹊窝，就该把我的那份留给我。”
        - id: ch06-b07
          speaker: narrator
          text: 王子终于明白，两只鸽子是在提醒他记起那些被遗忘的往事。失去的记忆一下回到心里。他认出了妻子，走上前吻了她。
        - id: ch06-b08
          speaker: narrator
          text: 婚礼的一切都已经准备齐全，就这样白白浪费实在可惜。于是，王子和巨人的女儿第二次举行婚礼，又和满堂宾客一同坐下来享用喜宴。
