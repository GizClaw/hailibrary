audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: witty, reflective, and lightly theatrical
        timbre: warm and clear
        pace: measured
        pitch: medium
    monkey:
      display_name: Monkey
      tts:
        delivery: lively, courteous, and quick-witted
        timbre: bright and agile
        pace: conversational
        pitch: medium-high
    shark:
      display_name: Shark
      tts:
        delivery: hearty, persuasive, and easily puzzled
        timbre: deep and rough
        pace: steady
        pitch: low
    hare:
      display_name: Hare
      tts:
        delivery: brisk, clever, and politely sly
        timbre: light and crisp
        pace: quick
        pitch: high
    lion:
      display_name: Lion
      tts:
        delivery: proud, forceful, and sometimes weary
        timbre: deep and resonant
        pace: deliberate
        pitch: low
    donkey:
      display_name: Donkey
      tts:
        delivery: self-important, trusting, and deliberate
        timbre: full and earthy
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Breakfast Above the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a little town of low huts stood in a tiny green valley beneath a cliff. The people had wisely built beyond the reach of the highest tide a west wind could drive ashore.
        - id: ch01-b02
          speaker: narrator
          text: At the very edge of town grew an enormous tree. Half its branches spread above the huts, while the rest hung over the deep sea below the cliff. Sharks often came there to splash in the clear water.
        - id: ch01-b03
          speaker: narrator
          text: The tree was heavy with fruit. Every morning at sunrise, a big grey monkey sat among its highest branches, eating breakfast and chattering happily to himself.
        - id: ch01-b04
          speaker: narrator
          text: Once he had eaten the fruit on the town side, he swung toward the branches above the water. As he searched for a shady perch, he saw a shark below, staring up with hungry eyes.
        - id: ch01-b05
          speaker: monkey
          text: Is there something I can do for you, my friend?
        - id: ch01-b06
          speaker: shark
          text: Oh, would you throw me some of that delicious fruit? I would be so grateful. After fifty years of eating fish, I long for something different. I am terribly tired of salt.
        - id: ch01-b07
          speaker: monkey
          text: I do not care for salt either. Open your mouth, and I will toss you this lovely, juicy kuyu.
        - id: ch01-b08
          speaker: narrator
          text: The monkey plucked the fruit above his head. Hitting the shark's mouth was harder than he expected, even after the shark rolled onto his back. The first kuyu struck a tooth and splashed into the sea. His second throw landed neatly inside.
        - id: ch01-b09
          speaker: shark
          text: Ah, that is wonderful! Please send down another.
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: The monkey tired of picking kuyus long before the shark tired of eating them.
        - id: ch01-b11
          speaker: monkey
          text: It is late, and I must go home to my children. Come back at this time tomorrow, and I will give you another feast.
        - id: ch01-b12
          speaker: shark
          text: Thank you! You cannot imagine how happy you have made me.
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: The shark grinned with delight, showing every one of his great ugly teeth. Then he swam away into the shadows. He hoped he could sleep through the hours of waiting and wake when it was time for the monkey to return.
        - id: ch01-b14
          speaker: narrator
          text: The shark returned the next morning, and the next. For weeks, he and the monkey shared breakfast beneath the tree. The shark ate so many kuyus that it was a wonder any fruit remained. As they ate, the two became close friends. They told each other about their homes and their children, and they compared their ideas about everything children ought to learn.
        - id: ch01-b15
          speaker: narrator
          text: In time, the monkey grew dissatisfied with his green home in the palm grove beyond the town. He wanted to see the strange wonders beneath the sea that he had heard about from the shark. The shark saw this plainly. He began describing still greater marvels in his underwater country. The monkey listened from the branches, longing to see them for himself, and every day he grew a little gloomier.
        - id: ch01-b16
          speaker: shark
          text: I hardly know how to thank you for all your kindness. I have nothing here that I can offer you. But come home with me, and I will gladly give you anything there that catches your fancy.
        - id: ch01-b17
          speaker: monkey
          text: I would like nothing better!
        - id: ch01-b18
          speaker: narrator
          text: The monkey's teeth chattered, as they always did when he was pleased. Then he remembered the sea below him.
        - id: ch01-b19
          speaker: monkey
          text: But how could I reach your home? I could never travel through the water. Ugh, the very thought makes me ill!
        - id: ch01-b20
          speaker: shark
          text: Do not worry about that. Sit on my back, and I promise not one drop of water will touch you.
        - id: ch01-b21
          speaker: narrator
          text: They agreed on the plan. Just after breakfast the next morning, the shark swam beneath the tree. The monkey dropped neatly onto his back without making a splash.
        - id: ch01-b22
          speaker: narrator
          text: At first, the monkey clung tightly to his strange seat and felt afraid. After a few minutes, he began to enjoy himself enormously. He peered into the water and asked a thousand questions about the fish, the seaweed, and every oddly shaped thing that floated past them. The shark always supplied some kind of answer. He sounded so certain that the monkey never guessed many of those sights were just as new to his guide.
    - id: ch02
      title: The Heart Left Behind
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The sun rose and set six times. Then the shark suddenly spoke.
        - id: ch02-b02
          speaker: shark
          text: My friend, we are halfway there now. It is time I told you something.
        - id: ch02-b03
          speaker: monkey
          text: What is it? I hope nothing is wrong. You sound very serious.
        - id: ch02-b04
          speaker: shark
          text: Oh, no. It is only this. Just before we left, I heard that the sultan of my country was very ill. Nothing can cure him except a monkey's heart.
        - id: ch02-b05
          speaker: monkey
          text: I am very sorry for the poor man. Still, you should have told me before we set out.
        - id: ch02-b06
          speaker: shark
          text: What do you mean?
        - id: ch02-b07
          speaker: narrator
          text: The monkey now understood the whole plot. He did not answer at once. He had to think carefully about what to say.
        - id: ch02-b08
          speaker: shark
          text: Why have you gone so quiet?
        - id: ch02-b09
          speaker: monkey
          text: I was thinking what a shame it is that you waited until we left the land. If you had told me there, I could have brought my heart.
        - id: ch02-b10
          speaker: shark
          text: Your heart? Is it not here with you?
          emotion: surprised
        - id: ch02-b11
          speaker: monkey
          text: Of course not. Surely you know that whenever monkeys leave home, we hang our hearts on trees so they will not trouble us. Perhaps you think I made that up because I am afraid. Then let us hurry on. When we arrive, search for my heart. If you find it, you may kill me.
          emotion: calm
        - id: ch02-b12
          speaker: narrator
          text: The monkey said all this in a voice so calm and unconcerned that he fooled the shark completely. There was no tremble in his words to betray his fear. The shark believed that a monkey truly could leave his heart hanging on a tree, and he began to regret setting out in such haste.
        - id: ch02-b13
          speaker: shark
          text: There is no point going farther if you left your heart behind. We should return to the town, and you can fetch it.
        - id: ch02-b14
          speaker: narrator
          text: That was exactly what the monkey wanted, but he took care not to show his relief.
        - id: ch02-b15
          speaker: monkey
          text: Well, I am not sure. It is a very long journey. Still, perhaps you are right.
        - id: ch02-b16
          speaker: shark
          text: I know I am. I will swim as fast as I can.
        - id: ch02-b17
          speaker: narrator
          text: The shark turned around at once and swam with all his strength. He had taken six days to reach the middle of the journey, but now he hurried so fiercely that after only three full days they caught sight of the kuyu tree hanging above the water.
        - id: ch02-b18
          speaker: narrator
          text: With a sigh of relief, the monkey seized the nearest branch and swung himself up.
        - id: ch02-b19
          speaker: monkey
          text: Wait here for me. I am starving, so I must eat a little breakfast. Then I will look for my heart.
        - id: ch02-b20
          speaker: narrator
          text: He climbed deeper and deeper into the branches until the shark could no longer see him. Then he curled up and fell asleep.
        - id: ch02-b21
          speaker: shark
          text: Are you still there?
        - id: ch02-b22
          speaker: narrator
          text: The shark swam back and forth beneath the cliff, waiting and waiting. Before long, he grew tired of circling the same patch of water and became eager to set off. His shout woke the monkey with a start, but the monkey stayed hidden among the leaves and gave no answer.
        - id: ch02-b23
          speaker: shark
          text: Are you there?
          emotion: angry
        - id: ch02-b24
          speaker: monkey
          text: Oh, yes, I am here. I wish you had not awakened me. I was enjoying such a good nap.
        - id: ch02-b25
          speaker: shark
          text: Have you found it? We ought to be going.
        - id: ch02-b26
          speaker: monkey
          text: Going where?
        - id: ch02-b27
          speaker: shark
          text: To my country, of course, and you must bring your heart. You cannot have forgotten!
        - id: ch02-b28
          speaker: monkey
          text: My dear friend, I think you are losing your wits. Do you take me for a washerman's donkey?
        - id: ch02-b29
          speaker: shark
          text: Stop talking nonsense. What has a washerman's donkey got to do with this? And hurry, or we may be too late to save the sultan.
          emotion: angry
        - id: ch02-b30
          speaker: monkey
          text: Have you truly never heard about the washerman's donkey? Why, that is the animal with no heart. I am not feeling well enough to travel, and the sun is so high that I fear a sunstroke. If you like, come a little closer and I will tell you the story.
        - id: ch02-b31
          speaker: shark
          text: Very well. If you refuse to come, I may as well hear your story while I wait.
          emotion: angry
    - id: ch03
      title: The Donkey's First Visit
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And so the monkey began. Once, a washerman lived in the great forest on the far side of town. He owned a donkey who kept him company and carried him wherever he wished to go.
        - id: ch03-b02
          speaker: narrator
          text: For a while, the washerman and his donkey got along very well. Then the donkey became lazy and ungrateful for all her master's kindness. She ran several miles into the heart of the forest and made a new life there. With no loads to carry, she spent her days doing nothing but eating. She ate and ate until she grew so fat that she could barely move.
        - id: ch03-b03
          speaker: narrator
          text: One day, she tried a kind of grass she had never tasted before and wondered whether it was as good as yesterday's dinner. Just then, a hare came by.
        - id: ch03-b04
          speaker: narrator
          text: The hare thought the donkey was wonderfully fat. She left the path and hurried to tell her friend the lion. The lion had been very ill and was too weak to hunt. When the hare said that a fat donkey stood only a few hundred yards away, his eyes filled with tears of weakness and disappointment.
        - id: ch03-b05
          speaker: lion
          text: Why tell me about her? You know I cannot even walk as far as that palm tree.
          emotion: sad
        - id: ch03-b06
          speaker: hare
          text: Never mind. If you cannot go to your dinner, I will bring your dinner to you.
        - id: ch03-b07
          speaker: narrator
          text: The hare nodded farewell and returned to the donkey.
        - id: ch03-b08
          speaker: hare
          text: Good morning. Forgive me for disturbing you, but I have come on very important business.
        - id: ch03-b09
          speaker: donkey
          text: Indeed? How kind of you to make the journey. What is this important business?
        - id: ch03-b10
          speaker: hare
          text: My friend the lion has heard so much about your beauty and your fine character that he wants you to marry him. He is sorry he cannot ask you himself. He has been ill and is too weak to come.
        - id: ch03-b11
          speaker: donkey
          text: Poor lion, how dreadful! Please tell him I am honored by his offer. I will gladly become Queen of the Beasts.
        - id: ch03-b12
          speaker: hare
          text: Why not come and give him your answer yourself?
        - id: ch03-b13
          speaker: narrator
          text: The hare and the donkey set off side by side along the road to the lion's home. It took them a very long time. The donkey had eaten so much that she could only move at a slow plod. The hare could have run the whole distance in about five minutes, yet she had to creep along beside her companion. Keeping such an unnatural pace almost made the hare drop from weariness.
        - id: ch03-b14
          speaker: narrator
          text: At last they arrived. The lion was sitting upright at the entrance to his home, though he still looked pale and thin. The sight of her future husband made the donkey suddenly shy, and she hung her head. The hungry lion hid his purpose, put on his finest manners, and invited both visitors inside to make themselves comfortable.
        - id: ch03-b15
          speaker: hare
          text: I have another engagement, so I will leave you to get acquainted with your future husband.
        - id: ch03-b16
          speaker: narrator
          text: The hare winked at the lion and bounded away. The donkey expected that as soon as they were alone, the lion would talk about their marriage and decide where they should live. But he said nothing at all. Surprised by the silence, she raised her head. The lion was crouching in a corner, and his glaring eyes shone with a red light.
        - id: ch03-b17
          speaker: narrator
          text: With a great roar, the lion sprang at her. In that instant, the donkey had time to brace herself. She jumped aside and kicked him so hard that he shrieked with pain. Again and again, the lion slashed at her with his claws. But the donkey had strong teeth and could bite as well as the lion could, while he was still weak after his illness.
        - id: ch03-b18
          speaker: narrator
          text: At last, the donkey planted one final kick squarely against him. It knocked the lion right over, and he rolled across the cave floor, groaning with pain. The donkey did not wait to see whether he could stand. She ran as fast as her legs could carry her and disappeared into the forest.
        - id: ch03-b19
          speaker: narrator
          text: The hare had known what would happen. Instead of going to her other engagement, she had hidden in bushes behind the cave and listened to the whole battle. Once everything was quiet, she slipped from hiding and crept around the corner.
        - id: ch03-b20
          speaker: hare
          text: Well, Lion, did you kill her?
        - id: ch03-b21
          speaker: lion
          text: Kill her? She nearly killed me! I never knew a donkey could kick that hard. Still, my claws left their marks on her.
          emotion: angry
        - id: ch03-b22
          speaker: hare
          text: Dear me! Who would expect such a great fat creature to fight like that? Do not upset yourself. Lie still, and your wounds will soon mend.
        - id: ch03-b23
          speaker: narrator
          text: The hare said goodbye to her friend and went home to her family.
    - id: ch04
      title: The Donkey Comes Back
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Two or three weeks went by. The donkey's wounds healed, and only bare patches on her back showed where the lion's claws had struck. The lion recovered from his illness too, and soon he was as strong as ever. One morning, he was thinking that it was almost time to hunt for himself again. Then the vines outside his cave rustled, and the hare's head peeped through.
        - id: ch04-b02
          speaker: hare
          text: Ah, I need not ask how you are. But you must not exhaust yourself yet. Shall I bring you some dinner?
        - id: ch04-b03
          speaker: lion
          text: Bring me that donkey, and I will tear her in two!
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: The hare laughed, nodded, and set out on her errand. This time, the donkey had wandered much farther into the forest, and it took the hare a long while to find her. At last she spotted four hoofs waving in the air. The donkey lay beside a stream on a bed of soft, cool moss, rolling happily backward and forward.
        - id: ch04-b05
          speaker: hare
          text: Good morning.
        - id: ch04-b06
          speaker: narrator
          text: The donkey slowly got to her feet and turned to see who had come.
        - id: ch04-b07
          speaker: donkey
          text: Oh, it is you! Come and talk with me. What news do you have?
        - id: ch04-b08
          speaker: hare
          text: I cannot stay. The lion asked me to bring you for a visit because he is not well enough to visit you.
        - id: ch04-b09
          speaker: donkey
          text: I am not sure about that. He scratched me terribly the last time, and I was truly frightened.
          emotion: fearful
        - id: ch04-b10
          speaker: hare
          text: He was only trying to kiss you. Then you bit him, so naturally he lost his temper.
        - id: ch04-b11
          speaker: donkey
          text: If only I could be certain that was all he meant.
        - id: ch04-b12
          speaker: hare
          text: You can be certain. I know a great many lions. Now we must hurry.
        - id: ch04-b13
          speaker: narrator
          text: The donkey still did not want to go, but the hare's confident words persuaded her to set off. The lion saw the pair coming down the path and hid behind a large tree. The donkey walked past without seeing him, and the hare followed close behind. Then the lion sprang from hiding. With one blow of his paw, he stretched the poor foolish creature dead before him.
        - id: ch04-b14
          speaker: lion
          text: Take the meat away, skin it, and roast it. My appetite is not what it was, so I only want the heart. You may eat the rest or share it with your friends.
        - id: ch04-b15
          speaker: hare
          text: Thank you.
        - id: ch04-b16
          speaker: narrator
          text: The hare balanced the donkey across her back as well as she could. The body was far too large for her, and all four legs trailed along the ground. Even so, she managed to drag it to an open place some distance away. There she gathered what she needed, made a fire, skinned the donkey, and roasted the meat as the lion had ordered.
        - id: ch04-b17
          speaker: narrator
          text: As soon as it was cooked, the hare took out the heart and ate it. She had just swallowed the last bite when the lion, tired of waiting, came to find her.
        - id: ch04-b18
          speaker: lion
          text: I am hungry. Bring me the animal's heart. That is exactly what I want for supper.
        - id: ch04-b19
          speaker: hare
          text: But there is no heart.
        - id: ch04-b20
          speaker: narrator
          text: The hare looked up at him with a puzzled face.
        - id: ch04-b21
          speaker: lion
          text: Nonsense! Every animal has a heart. What are you talking about?
        - id: ch04-b22
          speaker: hare
          text: This is a washerman's donkey.
        - id: ch04-b23
          speaker: lion
          text: Well, what difference does that make?
        - id: ch04-b24
          speaker: hare
          text: Shame on you! You are a lion and fully grown, yet you ask such a question. If this donkey had possessed a heart, would she be lying here? The first time she came, she learned you meant to kill her, and she escaped. Then she came back. Would any creature with a heart return a second time? Would she?
        - id: ch04-b25
          speaker: lion
          text: No. She would not.
        - id: ch04-b26
          speaker: narrator
          text: The lion gave his answer slowly.
    - id: ch05
      title: The Monkey's Farewell
      blocks:
        - id: ch05-b01
          speaker: monkey
          text: So, do you still think I am a washerman's donkey?
        - id: ch05-b02
          speaker: narrator
          text: The monkey had reached the end of his story.
        - id: ch05-b03
          speaker: monkey
          text: You are mistaken. I am not. The sun is sinking now, so it is time for you to start home. The voyage will be pleasantly cool, and I hope you find the sultan feeling better. Farewell!
        - id: ch05-b04
          speaker: narrator
          text: The monkey disappeared among the green branches, and he was gone.
