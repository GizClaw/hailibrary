  chapters:
    - id: ch01
      title: Hemgard and Its Young Hero
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A little way back from the high road stands a house called Hemgard. Perhaps you remember the two lovely mountain ash trees beside the reddish-brown fence, the tall gate, and the garden. Its barberry bushes are always the first to grow green in spring, and in summer their branches bend beneath the weight of beautiful berries.
        - id: ch01-b02
          speaker: narrator
          text: Behind the garden is a hedge, where tall aspens rustle in the morning wind. Beyond the hedge runs a road. Beyond the road lies a wood, and beyond the wood, the wide world. On the other side of the garden is a lake. Past the lake stands a village, with meadows and fields stretching all around it, sometimes yellow and sometimes green.
        - id: ch01-b03
          speaker: narrator
          text: Walter's parents live in the pretty house with its white window frames, tidy porch, and clean steps, always scattered with finely cut juniper leaves. So do his brother Frederick, his sister Lotta, old Lena, Jonah, Caro and Bravo, Putte and Murre, and Kuckeliku. Caro has the doghouse, Bravo the stable, and Putte lives with the stableman. Murre stays here and there. Kuckeliku rules the henhouse as his kingdom.
        - id: ch01-b04
          speaker: narrator
          text: Walter is six, and he must soon begin school. He cannot read yet, but there are plenty of other things he can do. He can turn cartwheels, stand on his head, ride a seesaw, throw snowballs, play ball, and crow like a rooster. He can eat bread and butter and drink sour milk. He can tear his trousers, wear through his elbows, smash dishes, send balls through windowpanes, draw old men on important papers, walk across flower beds, make himself sick on gooseberries, and feel well again after a whipping.
        - id: ch01-b05
          speaker: narrator
          text: For all that, he has a good heart and a bad memory. He forgets what his father and mother have told him, so he often falls into trouble and adventure. You will hear about those adventures. First, though, I must tell you how brave he was, and how he went hunting wolves.
        - id: ch01-b06
          speaker: narrator
          text: One spring, shortly before Midsummer, Walter heard that many wolves were roaming the wood. The news delighted him. When his friends surrounded him, or when he was safe at home with his brother and sister, Walter was wonderfully brave.
        - id: ch01-b07
          speaker: walter
          text: One wolf? That's nothing. There ought to be four, at least.
        - id: ch01-b08
          speaker: narrator
          text: When he wrestled Klas Bogenstrom or Frithiof Waderfelt and struck one of them on the back, he announced what the blow meant.
        - id: ch01-b09
          speaker: walter
          text: That's how I'll hit a wolf!
        - id: ch01-b10
          speaker: narrator
          text: When he fired arrows at Jonas, and they rattled against the man's sheepskin coat, he boasted again.
        - id: ch01-b11
          speaker: walter
          text: If you were a wolf, that's exactly how I'd shoot you!
        - id: ch01-b12
          speaker: narrator
          text: Some people thought this brave boy boasted just a little. Still, Walter said it himself, so surely they had to believe him. Jonas and Lena would point him out together.
        - id: ch01-b13
          speakers: [jonas, lena]
          ensemble: duo
          text: Look, there goes Walter, the great wolf shooter!
        - id: ch01-b14
          speaker: narrator
          text: Other boys and girls joined in too.
        - id: ch01-b15
          speakers: [boy, girl]
          ensemble: duo
          text: There goes brave Walter! He's brave enough to fight four wolves!
        - id: ch01-b16
          speaker: narrator
          text: No one believed in Walter's courage more completely than Walter himself. One day, he prepared for a real wolf hunt. First he took his drum. One end was full of holes from the time he had stood on it to reach some rowan berries. Then he took his tin sword. That was slightly broken after his astonishingly brave battle through an entire enemy army of gooseberry bushes.
        - id: ch01-b17
          speaker: narrator
          text: He armed himself from head to foot with a popgun, a bow, and an air pistol. A piece of burnt cork went into his pocket so he could blacken a mustache on his face. A red rooster feather went into his cap to make him look fierce. In his trouser pocket he carried a clasp knife with a bone handle. Once the wolves were dead, he meant to cut off their ears. He thought doing it while they were alive would be cruel.
    - id: ch02
      title: The Road to the Mill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Luckily, Jonas was taking corn to the mill that day. Walter rode on top of the load while Caro ran beside them, barking. The moment they entered the wood, Walter peered carefully into every bush in case a wolf was hiding there. Then he asked Jonas whether wolves were afraid of drums.
        - id: ch02-b02
          speaker: jonas
          text: Why, of course they are.
        - id: ch02-b03
          speaker: narrator
          text: Naturally, that settled it. Walter beat his drum with all his strength for the rest of the ride through the wood.
        - id: ch02-b04
          speaker: narrator
          text: At the mill, Walter's first question was whether any wolves had been seen nearby lately.
        - id: ch02-b05
          speaker: miller
          text: Oh, yes. Last night they ate our fattest ram beside the old kiln, not far from here.
        - id: ch02-b06
          speaker: walter
          text: Oh! Do you think there were many of them?
        - id: ch02-b07
          speaker: miller
          text: We don't know.
        - id: ch02-b08
          speaker: walter
          text: Well, it doesn't really matter. I only asked because I need to decide whether Jonas should come. I can easily handle three wolves alone. But if there are more, I might not kill them all before they get away.
        - id: ch02-b09
          speaker: jonas
          text: If I were Walter, I'd go alone. That would be much more manly.
        - id: ch02-b10
          speaker: walter
          text: No, you'd better come too. There might be a great many.
        - id: ch02-b11
          speaker: jonas
          text: I haven't time. Besides, there can't be more than three. Walter can manage three perfectly well by himself.
        - id: ch02-b12
          speaker: walter
          text: Of course I can. But one might get behind me and bite my back, Jonas. That would make killing all three more troublesome. If I knew there were only two, I wouldn't care. I'd grab one in each hand and shake them the way Susanna shook me once.
        - id: ch02-b13
          speaker: jonas
          text: I'm sure there won't be more than two. There are never more than two when wolves kill children and rams. Walter can shake them without any help from me.
        - id: ch02-b14
          speaker: walter
          text: But with two, one could still slip away and bite my leg. My left hand isn't as strong as my right. You can come and carry a stout stick, just in case there really are two. If there's only one, I'll seize him with both hands and throw him straight onto his back. He can kick all he likes. I won't let go.
        - id: ch02-b15
          speaker: jonas
          text: Now that I think about it, I'm almost certain there will be only one. What would two wolves need with one ram? No, there can't possibly be more than one.
        - id: ch02-b16
          speaker: walter
          text: You should still come, Jonas. I can handle one wolf, naturally, but I'm not used to them yet. He might tear holes in my new trousers.
        - id: ch02-b17
          speaker: jonas
          text: Listen to that! I'm beginning to wonder whether Walter is as brave as everyone says. First he would fight four wolves. Then it was three, then two, and then one. Now he needs help with a single wolf. That will never do. What will people say? They may think Walter is a coward.
        - id: ch02-b18
          speaker: walter
          text: That's not true! I'm not frightened at all. It's only more fun with two people. I want someone there to watch me hit the wolf and see the dust fly out of its fur.
          emotion: angry
        - id: ch02-b19
          speaker: jonas
          text: Then take the miller's little Lisa. She can sit on a stone and watch.
        - id: ch02-b20
          speaker: walter
          text: No, she'd be frightened. And how would it look for a girl to go wolf hunting? Come with me, Jonas. You may have the skin, and I'll be satisfied with the ears and tail.
        - id: ch02-b21
          speaker: jonas
          text: No, thank you. Walter may keep the skin. I can see now that he really is afraid. Shame on such a hero!
        - id: ch02-b22
          speaker: narrator
          text: That struck Walter's pride in its tenderest spot.
        - id: ch02-b23
          speaker: walter
          text: I'll prove I'm not afraid!
        - id: ch02-b24
          speaker: narrator
          text: Walter gathered his drum, sword, rooster feather, clasp knife, popgun, bow, and air pistol. Then he set off all alone into the wood to hunt wolves.
    - id: ch03
      title: Alone by the Old Kiln
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was a beautiful evening, and birds sang from every branch. Walter walked very slowly and carefully. At each step he looked all around, watching for anything that might be hiding behind the stones. Something seemed to move in the ditch. Could it be a wolf?
        - id: ch03-b02
          speaker: walter
          text: I'd better beat the drum before I go any closer.
        - id: ch03-b03
          speaker: narrator
          text: Br-r-r! Walter began to drum. Something moved again. Then, with a loud caw, a crow flew out of the ditch. At once Walter found his courage again.
        - id: ch03-b04
          speaker: walter
          text: It's a good thing I brought my drum.
        - id: ch03-b05
          speaker: narrator
          text: He marched on with brave, firm steps. Soon he was close to the kiln where the wolves had killed the ram. Yet the nearer he came, the more dreadful the kiln appeared. It was so old and gray. Who could tell how many wolves were hiding inside? The very wolves that killed the ram might still be crouching in some corner.
        - id: ch03-b06
          speaker: narrator
          text: The place did not feel safe at all. No other person was anywhere nearby to be seen. Walter thought how horrible it would be to get eaten there in broad daylight. The longer he stared, the uglier and grayer the kiln became, and the more dreadful it seemed to end as a meal for wolves.
        - id: ch03-b07
          speaker: walter
          text: What if I go back and say I hit a wolf, but it escaped?
        - id: ch03-b08
          speaker: narrator
          text: His conscience answered at once.
        - id: ch03-b09
          speaker: conscience
          text: Shame on you! Don't you remember that a lie is one of the worst sins before God and man? Tell a lie today and say you struck a wolf, and tomorrow that wolf will surely eat you.
          emotion: angry
        - id: ch03-b10
          speaker: walter
          text: No. I'll go to the kiln.
        - id: ch03-b11
          speaker: narrator
          text: And he did go, though not right up to it. He stopped as soon as he could see the ram's blood staining the grass red. Tufts of wool lay there too, torn from the poor animal's back by the wolves. It was a dreadful sight.
        - id: ch03-b12
          speaker: walter
          text: I wonder what the ram thought while the wolves were eating him.
        - id: ch03-b13
          speaker: narrator
          text: At that very thought, a cold shiver ran from Walter's collar all the way down into his boots.
        - id: ch03-b14
          speaker: walter
          text: I'd better beat the drum again.
        - id: ch03-b15
          speaker: narrator
          text: He began to beat it, but now the drum sounded horrible. An echo rolled out of the kiln, almost like a wolf howling. The drumsticks went stiff in Walter's hands. They were coming now. He was certain of it.
        - id: ch03-b16
          speaker: narrator
          text: And sure enough, at that instant, a shaggy reddish-brown wolf's head peered from beneath the kiln.
        - id: ch03-b17
          speaker: narrator
          text: What did Walter do? Brave Walter, who could defeat four wolves alone, threw his drum far away, turned on his heels, and ran toward the mill as fast as he could.
    - id: ch04
      title: The Wolf Behind Walter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Alas, the wolf raced after him. Walter glanced back. It was faster than he was and only a few steps behind. Walter ran harder, but fear took hold of him until he could neither hear nor see anything else. He bounded over sticks, stones, and ditches. One by one, he lost his drumsticks, sword, bow, and air pistol.
        - id: ch04-b02
          speaker: narrator
          text: In his terrible hurry, his foot caught on a clump of grass. Down he fell, and the wolf leaped right on top of him.
        - id: ch04-b03
          speaker: narrator
          text: What a gruesome tale! You may think that was the end of Walter and all his adventures. What a pity that would have been. But things were not quite so bad, because this wolf was a friendly one. It did jump on Walter, but it only shook his coat and rubbed its nose against his face. Walter screamed. Oh, how terribly he screamed!
        - id: ch04-b04
          speaker: narrator
          text: Luckily, he had almost reached the mill, and Jonas heard his cry for help. Jonas ran over and pulled him to his feet.
        - id: ch04-b05
          speaker: jonas
          text: What happened? Why did Walter scream like that?
        - id: ch04-b06
          speaker: walter
          text: A wolf! A wolf!
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: Those were the only words Walter could manage.
        - id: ch04-b08
          speaker: jonas
          text: Where is this wolf? I don't see one anywhere.
        - id: ch04-b09
          speaker: walter
          text: Be careful! He's right here. He's bitten me to death!
          emotion: fearful
        - id: ch04-b10
          speaker: narrator
          text: Jonas began to laugh. He laughed so hard that his leather belt nearly burst.
        - id: ch04-b11
          speaker: narrator
          text: Well, well! Was this the wolf Walter meant to seize by the neck, shake, and throw on its back, however wildly it struggled? Take a closer look. It was his old friend, his own good Caro. The dog had probably found one of the ram's legs inside the kiln. When Walter beat his drum, Caro crawled out. When Walter ran away, Caro chased him, just as he often did when Walter wanted to romp and play.
        - id: ch04-b12
          speaker: jonas
          text: Down, Caro! You ought to be ashamed of yourself, putting such a mighty hero to flight!
        - id: ch04-b13
          speaker: narrator
          text: Walter stood up, feeling very foolish.
        - id: ch04-b14
          speaker: walter
          text: Down, Caro! It was only a dog after all. If he'd really been a wolf, I certainly would have killed him.
        - id: ch04-b15
          speaker: narrator
          text: Walter was relieved, but annoyed as well. Jonas offered him some comforting advice.
        - id: ch04-b16
          speaker: jonas
          text: Walter might boast a little less and do a little more. That would be my advice. Walter isn't a coward, is he?
        - id: ch04-b17
          speaker: walter
          text: Me, a coward? Just wait until we meet a bear, Jonas. I like fighting bears much better.
        - id: ch04-b18
          speaker: jonas
          text: Really? Are you starting again? Dear Walter, remember this. Cowards are the ones who boast. A truly brave person never talks about being brave.
