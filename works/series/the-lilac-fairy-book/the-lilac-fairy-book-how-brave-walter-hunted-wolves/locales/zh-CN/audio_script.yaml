audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    walter:
      display_name: 沃尔特
      tts:
        delivery: 六岁男孩的清脆童声，逞强时神气，害怕时慌乱
        timbre: 明亮稚嫩的男童声
        pace: 稍快而富于变化
        pitch: 高
    jonas:
      display_name: 约纳
      tts:
        delivery: 朴实机敏，调侃孩子时含笑却不刻薄
        timbre: 厚实清朗的成年男声
        pace: 适中
        pitch: 中低
    lena:
      display_name: 老莉娜
      tts:
        delivery: 亲切爽朗，打趣时直截了当
        timbre: 温厚略沙的老年女声
        pace: 适中
        pitch: 中
    boy:
      display_name: 男孩
      tts:
        delivery: 活泼好事，起哄时兴致勃勃
        timbre: 清亮的男童声
        pace: 稍快
        pitch: 高
    girl:
      display_name: 女孩
      tts:
        delivery: 天真爽快，跟伙伴一起打趣时满含笑意
        timbre: 清脆的女童声
        pace: 稍快
        pitch: 高
    miller:
      display_name: 磨坊主
      tts:
        delivery: 实在直率，说话简洁
        timbre: 粗粝稳重的成年男声
        pace: 适中
        pitch: 中低
    conscience:
      display_name: 沃尔特的良心
      tts:
        delivery: 严肃清楚，像孩子心里不容躲闪的告诫
        timbre: 清晰沉稳的成年女声
        pace: 稍慢
        pitch: 中
  chapters:
    - id: ch01
      title: 赫姆加德的小英雄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 离大路稍远的地方，有一幢名叫“赫姆加德”的房子。红褐色栅栏旁立着两株美丽的花楸树。高高的大门里面是一座花园，小檗灌木春天最早长出新叶，到了夏天，累累果实便压弯枝条。
        - id: ch01-b02
          speaker: narrator
          text: 花园后面有一道树篱，高高的白杨在晨风里沙沙作响。树篱后面是路，路后面是树林，树林后面便是辽阔的世界。花园另一边又是一片湖，湖那边有村庄，四周的草地和田野时而金黄，时而碧绿。
        - id: ch01-b03
          speaker: narrator
          text: 那幢漂亮房子的窗框雪白，门廊整整齐齐，台阶总是打扫得干干净净，上面还撒着切碎的杜松叶。沃尔特的父母住在这里。同住的还有他的哥哥弗雷德里克、妹妹洛塔、老莉娜、约纳、卡罗和布拉沃、普特和穆雷，以及库克利库。
        - id: ch01-b04
          speaker: narrator
          text: 卡罗住狗窝，布拉沃住马厩，普特跟马夫作伴，穆雷这儿住住、那儿待待。库克利库住在鸡舍，那就是它的王国。
        - id: ch01-b05
          speaker: narrator
          text: 沃尔特六岁，很快就要上学。他还不会读书，会的本领却不少。他会翻侧手翻、倒立、玩跷跷板、扔雪球、玩球、学公鸡打鸣，也会吃黄油面包、喝酸奶。他还会撕破裤子、磨穿衣袖、摔碎碗碟，把球扔穿窗玻璃，在重要文件上画老头，踩过花圃，吃醋栗吃到肚子疼。就算挨上一顿鞭子，他很快又能活蹦乱跳。
        - id: ch01-b06
          speaker: narrator
          text: 这个孩子心眼很好，记性却很坏。父母的告诫，他总是转头就忘，所以常常闯祸，也常遇上种种奇事。那些冒险以后还会一一讲到。不过眼下，先来听听他有多勇敢，又是怎样去猎狼的。
        - id: ch01-b07
          speaker: narrator
          text: 有一年春天，仲夏节快到了。沃尔特听说树林里来了许多狼，心里十分高兴。只要伙伴们围在身边，或者哥哥妹妹都在家，他就勇敢得出奇。
        - id: ch01-b08
          speaker: walter
          text: “一只狼算什么！至少也得来四只。”
        - id: ch01-b09
          speaker: narrator
          text: 他跟克拉斯·博根斯特伦或弗里蒂奥夫·瓦德费尔特摔跤，把人家按倒时，总要拿狼来比。
        - id: ch01-b10
          speaker: walter
          text: “等碰上狼，我也这么收拾它！”
        - id: ch01-b11
          speaker: narrator
          text: 他朝约纳射箭，箭头打在羊皮袄上噼啪作响，也要夸口。
        - id: ch01-b12
          speaker: walter
          text: “你要是狼，我就照这样射你！”
        - id: ch01-b13
          speaker: narrator
          text: 有人觉得这位勇敢的小伙子多少爱吹牛。不过，既然是他亲口说的，大家当然只好信了。至少沃尔特自己对此深信不疑。约纳和莉娜常拿他打趣。
        - id: ch01-b14
          speakers: [jonas, lena]
          ensemble: duo
          text: “瞧，射狼的沃尔特来了。”
        - id: ch01-b15
          speaker: narrator
          text: 别的孩子也跟着起哄。
        - id: ch01-b16
          speakers: [boy, girl]
          ensemble: duo
          text: “瞧，勇敢的沃尔特来了，他一个人敢打四只狼呢！”
        - id: ch01-b17
          speaker: narrator
          text: 最相信这番话的人，正是沃尔特自己。一天，他当真准备去猎狼。他带上一面鼓，鼓的一头破了几个洞。那是因为他有一回看中了一串花楸果，为了够到果子，竟爬上了鼓面。他还带了一把缺口的铁皮军刀。那道缺口也有来历。他曾凭着惊人的勇气，从一整支心怀敌意的醋栗灌木大军中杀出一条路来。
        - id: ch01-b18
          speaker: narrator
          text: 砰砰枪、弓箭和气手枪也全带齐了，真是武装到了牙齿。他在口袋里装一块烧焦的软木，预备给自己画上一圈黑胡子，又往帽子上插一根红色公鸡毛，好让自己显得威风凶猛。裤袋里还有一把骨柄折刀。等狼一死，他就立刻用刀割下狼耳朵。他觉得趁狼还活着便割耳朵，未免太残忍。
    - id: ch02
      title: 狼究竟有几只
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 正巧约纳要送谷子去磨坊，沃尔特便坐上装谷子的车，卡罗一路叫着跟在旁边。车一进树林，沃尔特就小心地四下张望，仔细查看灌木丛里是不是藏着狼。他还特意问约纳，狼怕不怕鼓声。
        - id: ch02-b02
          speaker: jonas
          text: “当然怕啦。”
        - id: ch02-b03
          speaker: narrator
          text: 那还用说。于是一路穿过树林，沃尔特都使出浑身力气，咚咚地敲鼓。
        - id: ch02-b04
          speaker: narrator
          text: 到了磨坊，他马上打听最近有没有狼来过。
        - id: ch02-b05
          speaker: miller
          text: “唉，当然有。昨天夜里，狼就在附近的烧炭窑旁，把我们最肥的公羊吃了。”
        - id: ch02-b06
          speaker: walter
          text: “啊？你觉得来了很多只吗？”
        - id: ch02-b07
          speaker: miller
          text: “我们也不知道。”
        - id: ch02-b08
          speaker: walter
          text: “那也没什么。我只是想知道，要不要带约纳一起去。三只狼，我一个人轻轻松松就能对付。可要是更多，恐怕我还没杀完，它们就逃光了。”
        - id: ch02-b09
          speaker: jonas
          text: “我要是沃尔特，就一个人去。那才像个男子汉。”
        - id: ch02-b10
          speaker: walter
          text: “不，你还是一起去吧。说不定来了很多只。”
        - id: ch02-b11
          speaker: jonas
          text: “我没空。再说，肯定不超过三只。沃尔特一个人就应付得了。”
        - id: ch02-b12
          speaker: walter
          text: “我当然行。可万一有一只从背后咬我，我杀起来不是要多费点事吗？如果最多只有两只，我才不怕。我一手抓一只，好好抖它们一顿，就像苏珊娜有一回抖我那样。”
        - id: ch02-b13
          speaker: jonas
          text: “我敢说不会超过两只。狼来咬孩子和公羊，从不会超过两只。没有我，沃尔特也能抖它们。”
        - id: ch02-b14
          speaker: walter
          text: “可要是有两只，其中一只也许会逃掉，再来咬我的腿。我的左手可没有右手那么有力。你就拿根结实的棍子跟我去吧，防备真有两只。要是只有一只，我两手这样一抓，就能把它活活摔个四脚朝天。随它怎么踢，我都按得住。”
        - id: ch02-b15
          speaker: jonas
          text: “仔细想想，那里多半只有一只狼。一只公羊，哪里用得着两只来吃？肯定至多一只。”
        - id: ch02-b16
          speaker: walter
          text: “可你还是跟我去吧，约纳。一只狼我当然对付得了，只是还不习惯跟狼打交道。万一它抓破我的新裤子呢？”
        - id: ch02-b17
          speaker: jonas
          text: “听我说，沃尔特好像没有大家讲的那么勇敢。起先要打四只，后来是三只、两只、一只，现在连一只也要人帮忙。那可不成！别人会怎么说？也许会以为沃尔特是个胆小鬼。”
        - id: ch02-b18
          speaker: walter
          text: “胡说！我一点也不怕。两个人去，只是更有意思。我想找个人看看我是怎么揍狼的，又怎么从它的皮毛里打出满天灰尘。”
        - id: ch02-b19
          speaker: jonas
          text: “那就带磨坊主家的小莉萨去。让她坐在石头上看。”
        - id: ch02-b20
          speaker: walter
          text: “不行，她肯定会害怕。哪有女孩子去猎狼的？你跟我去吧，狼皮给你，我只拿耳朵和尾巴。”
        - id: ch02-b21
          speaker: jonas
          text: “不，多谢。狼皮还是你自己留着吧。现在我看明白了，你就是害怕。呸，真不害臊！”
        - id: ch02-b22
          speaker: narrator
          text: 这句话正正刺中了沃尔特的自尊心。
        - id: ch02-b23
          speaker: walter
          text: “我会让你看看，我才不害怕！”
        - id: ch02-b24
          speaker: narrator
          text: 他拿起鼓、军刀、公鸡毛、折刀、砰砰枪和气手枪，独自朝树林走去猎狼。
    - id: ch03
      title: 炭窑里的狼头
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 傍晚很美，鸟儿在枝头歌唱。沃尔特却走得很慢，步步小心。每走一步，他都要朝四周看看，生怕石头后面埋伏着什么。沟里似乎有东西闪了过去。也许是狼。
        - id: ch03-b02
          speaker: walter
          text: “过去以前，我最好先敲一阵鼓。”
        - id: ch03-b03
          speaker: narrator
          text: “咚噜噜噜！”鼓声响起来，那东西又动了。“哇！哇！”一只乌鸦从沟里飞了出去。沃尔特马上又有了胆量。
        - id: ch03-b04
          speaker: walter
          text: “幸亏我把鼓带来了。”
        - id: ch03-b05
          speaker: narrator
          text: 他迈开英勇的步子，径直往前走，很快来到烧炭窑附近。狼正是在这里咬死了公羊。可他越走近，越觉得那座窑可怕。它灰沉沉的，又破又旧。谁知道里面藏着多少狼？也许吃掉公羊的那几只，此刻还蹲在某个角落里。这个地方一点也不安全。
        - id: ch03-b06
          speaker: narrator
          text: 附近连个人影也没有。在大白天被狼吃掉，实在太吓人了。他越想，老炭窑就显得越丑、越灰暗。一想到自己会变成狼的食物，他更是毛骨悚然。
        - id: ch03-b07
          speaker: walter
          text: “要不我回去，就说我打中了一只狼，可它逃掉了？”
        - id: ch03-b08
          speaker: conscience
          text: “呸！你忘了吗？无论在上帝还是在人们眼里，撒谎都是最坏的罪过之一。你今天撒谎，说自己打中过狼，明天狼准会把你吃掉。”
        - id: ch03-b09
          speaker: walter
          text: “不，我要去炭窑。”
        - id: ch03-b10
          speaker: narrator
          text: 他又往前走，却没敢走到炭窑跟前，只走到一个能看清地面的地方。公羊流下的鲜血把草染得通红，旁边还散着几绺羊毛，那是狼从这只可怜的动物背上撕下来的。眼前的景象实在怕人。
        - id: ch03-b11
          speaker: walter
          text: “狼吃它的时候，不知道这只公羊在想什么。”
        - id: ch03-b12
          speaker: narrator
          text: 一股寒意从沃尔特的衣领一直窜到靴子里。
        - id: ch03-b13
          speaker: walter
          text: “我还是敲敲鼓吧。”
        - id: ch03-b14
          speaker: narrator
          text: 他又敲起来。可这回鼓声听着十分可怕，炭窑里还荡出一阵回声，简直像狼在嗥叫。沃尔特手里的鼓槌僵住了。他心想，这下它们来了……
        - id: ch03-b15
          speaker: narrator
          text: 果然就在这一刻，炭窑下面探出一颗毛茸茸的红褐色狼头！
        - id: ch03-b16
          speaker: narrator
          text: 沃尔特怎么办？那位能独自对付四只狼的大英雄扔掉鼓，拔腿就逃，拼命朝磨坊跑去。
        - id: ch03-b17
          speaker: narrator
          text: 可狼在后面追他。沃尔特回头一看，它跑得比自己还快，只差几步就追上了。他只好再加快脚步。可恐惧已经压倒了一切，他什么也听不见，什么也看不见，只顾越过横在路上的树枝，踩过石块，跳过一道道沟渠，一路狂奔。鼓槌、军刀、弓和气手枪全丢了。慌乱中，他被一丛草绊倒。沃尔特摔在地上，狼一下扑到了他身上……
    - id: ch04
      title: 友善的狼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这故事真是吓人！你一定以为沃尔特完了，他的种种冒险也从此结束。那可太遗憾了。不过事情并没有这么糟，你也不用惊讶。原来这只狼十分友善。它确实扑到沃尔特身上，却只是扯了扯他的外套，又用鼻子蹭他的脸。沃尔特放声尖叫。是的，他叫得可怕极了！
        - id: ch04-b02
          speaker: narrator
          text: 幸好约纳听见了呼救声。沃尔特已经跑到离磨坊不远的地方，约纳赶来把他扶起。
        - id: ch04-b03
          speaker: jonas
          text: “出什么事了？你为什么叫得那么吓人？”
        - id: ch04-b04
          speaker: walter
          text: “狼！狼！”
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 沃尔特只能说出这两个字。
        - id: ch04-b06
          speaker: jonas
          text: “狼在哪儿？我怎么一只也没看见？”
        - id: ch04-b07
          speaker: walter
          text: “小心，它就在这里！它已经把我咬死了。”
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: 约纳大笑起来，笑得几乎要把皮腰带撑断。
        - id: ch04-b09
          speaker: narrator
          text: 哎呀呀，那就是狼吗？就是沃尔特要揪住脖子，抖上一顿，再摔个四脚朝天，任它怎么挣扎也不放手的狼吗？仔细看看吧。它是大家的老朋友，是那条善良的老卡罗。
        - id: ch04-b10
          speaker: narrator
          text: 我猜，卡罗准是在炭窑里找到了一条公羊腿。沃尔特一敲鼓，它便从炭窑里钻出来。沃尔特转身逃跑，它也跟在后面追，就像平时沃尔特想跟它嬉闹玩耍时，它常做的那样。
        - id: ch04-b11
          speaker: jonas
          text: “下去，卡罗！你把这么一位大英雄吓得逃跑，也该害臊啦！”
        - id: ch04-b12
          speaker: narrator
          text: 沃尔特爬起来，觉得自己傻透了。他松了口气，又有些恼火。
        - id: ch04-b13
          speaker: walter
          text: “下去，卡罗！原来只是一条狗。要真是狼，我肯定已经把它杀了……”
        - id: ch04-b14
          speaker: jonas
          text: “要是沃尔特肯听劝，少吹一点牛，多做一点事，那就好了。沃尔特可不是胆小鬼，对不对？”
        - id: ch04-b15
          speaker: walter
          text: “我？下回碰见熊，你就看着吧，约纳。其实我更喜欢跟熊打架。”
        - id: ch04-b16
          speaker: jonas
          text: “是吗？你怎么又来了？亲爱的沃尔特，记住，只有胆小鬼才吹嘘自己。真正勇敢的人，从来不把自己的勇敢挂在嘴上。”
        - id: ch04-b17
          speaker: narrator
          text: 这个故事，出自萨克里斯·托佩柳斯。
