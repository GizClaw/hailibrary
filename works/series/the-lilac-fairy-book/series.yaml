cover_prompt: |-
  A wordless cover shows a young traveler in a dark green cloak lifting a silver sword to free a great black raven from a coiling serpent on a windswept Highland moor. The raven spreads its broad wings above him while distant blue glens, stony ridges, and a small ancient castle establish a legendary preindustrial setting. A few lilac wildflowers bend in the foreground, echoing the book’s identity without forming symbols or lettering. The decisive upward sweep of the freed bird is the single focal action, with the traveler and serpent forming a clear triangular silhouette below it. Frame the scene from a gently low, wide viewpoint, leaving calm open twilight sky across the upper third for the cover title area. Keep the peril mild, with no wounds or gore, and make the original costumes, creature shapes, and landscape welcoming to children. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
