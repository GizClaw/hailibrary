  chapters:
    - id: ch01
      title: The Secret Marriage
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a rich old man with two sons. His wife was dead, so the elder son lived with him and helped manage the property. The young man rose early and worked hard all day. Every week, his father counted their earnings and rubbed his hands as the gold climbed higher in the strong iron chest.
        - id: ch01-b02
          speaker: father
          text: That chest will soon be full. I shall have to buy a bigger one.
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Money filled the old man's thoughts. He never noticed the new brightness in his son's face, or how the young man sometimes started when someone spoke, as though his mind had been far away.
        - id: ch01-b04
          speaker: narrator
          text: One market day, the father went into the city on business. He had not been there for at least three years. Everywhere he went, he met people he knew, and he stopped to speak with many of them. It was quite late by the time he turned into the inn yard and told an ostler to saddle his horse and bring it around at once. While he waited in the hall, the landlady came over for a gossip. They exchanged a few remarks about the weather and the vineyards. Then she asked whether his new daughter-in-law pleased him, and whether the marriage had surprised him.
        - id: ch01-b05
          speaker: father
          text: Daughter-in-law? Marriage? What are you talking about? I have no daughter-in-law, and I have heard of no recent wedding.
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: That was exactly what the curious landlady had hoped to discover. Still, she put on an alarmed face and fumbled with her apron.
        - id: ch01-b07
          speaker: landlady
          text: Oh dear, I hope I haven't caused trouble. I had no idea. Of course I would never have mentioned it, but...
        - id: ch01-b08
          speaker: father
          text: You have begun the story. Now you had better finish it.
          emotion: angry
        - id: ch01-b09
          speaker: landlady
          text: Well, your handsome son hasn't been riding into town every week for months merely to buy and sell. He never takes the shortest road, either. He crosses the river, goes over the hill, and passes the cottage of Miguel the vine-keeper. People say Miguel's daughter is the prettiest girl in the countryside, though she is much too pale for my taste.
        - id: ch01-b10
          speaker: narrator
          text: She paused and watched the father. He stared straight ahead with his teeth clenched.
        - id: ch01-b11
          speaker: father
          text: Go on.
          emotion: angry
        - id: ch01-b12
          speaker: landlady
          text: There is little more to say. One fine morning, the two of them went to the small church on the hill and married. My cousin serves the priest, and she learned all about it. But here is your horse, sir, and I must prepare supper for the market men. Good day.
        - id: ch01-b13
          speaker: narrator
          text: The horse knew the road home, and that was fortunate. The reins hung loose while its master paid no attention to the way. At the farm, the old man led the horse into the stable and went to find his son. The young man sat by the door, happily whistling as he cut a stick.
        - id: ch01-b14
          speaker: father
          text: I know everything. You deceived me. Get out of my sight. I am finished with you!
          emotion: angry
        - id: ch01-b15
          speaker: poor_brother
          text: But, Father—
        - id: ch01-b16
          speaker: father
          text: You are no son of mine. I have only one son now. Leave, or you will be sorry!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: He raised his whip. The young man drew back. His father's face was so red and his eyes bulged so terribly that the son feared he might collapse. There was no use staying. Perhaps the old man would listen in the morning, though deep inside, the son knew those words would never be withdrawn.
        - id: ch01-b18
          speaker: narrator
          text: He turned away slowly and followed a path that ended at a cave in the side of the hill. There he sat through the whole night, thinking about everything that had happened. He knew he had been wrong. There was no doubt of that, though he hardly understood how the secret had gone on so long. He had always meant to tell his father about the marriage. He felt certain that once the old man saw his wife, her great beauty and goodness would make him forgive her poverty. But every day, the son had waited for a better opportunity. Now this was the end of it all.
        - id: ch01-b19
          speaker: narrator
          text: Neither father nor son slept. At sunrise, the old man sent a messenger to the great city to fetch his younger son. When the young man arrived, his father told him plainly that he was now the only heir. All the land and money would be his, and he must come home to help manage the estate.
        - id: ch01-b20
          speaker: narrator
          text: The younger brother was delighted at the thought of becoming rich, for the two brothers had never cared much for one another. He would rather have remained in town, since country life soon bored him, but he kept that to himself and worked hard as his brother had done.
        - id: ch01-b21
          speaker: narrator
          text: Years passed. The harvests grew poorer, and the father stopped work on several fine houses he was building in the city because finishing them would consume all his savings. He would not even hear his elder son's name. At last he died without seeing him again, and left every field and every coin to the younger son, just as he had promised.
    - id: ch02
      title: The Unfinished Houses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the disinherited son and his wife had become poorer year after year. They were always searching for something they could do, and they never spent a penny unless they had to. Still, luck stayed against them. By the time his father died, the family scarcely had bread to eat or enough clothes to cover themselves. If the man had been alone, he would somehow have managed to go on. But he could not bear to watch his children growing weaker every day. At last, he swallowed his pride, crossed the mountains, and returned to the old home where his brother lived.
        - id: ch02-b02
          speaker: narrator
          text: The brothers had not stood face to face for many years. For a while, they looked at each other without speaking. Tears filled the elder brother's eyes, but he quickly blinked them away.
        - id: ch02-b03
          speaker: poor_brother
          text: Brother, I need not explain how poor I am. You can see it. I haven't come to beg for money. Please give me those unfinished houses in the city. I can make them watertight, and my wife and children can live there without paying rent. As they stand now, the houses bring you nothing.
        - id: ch02-b04
          speaker: narrator
          text: The younger brother pitied him and gave him the houses. The elder brother went away happy.
        - id: ch02-b05
          speaker: narrator
          text: Several more years passed with things much as they had been. Then the rich brother began to feel lonely. He was growing older, he thought, and the time had come to marry. The woman he chose was wealthy, but terribly greedy. No matter how much she owned, she always wanted more. She was also one of those unfortunate people who imagine that anything belonging to someone else must be finer than their own. Her husband often regretted the day he first saw her. Her mean, shabby behavior repeatedly made him ashamed. Yet he lacked the courage to stand up to her, so month by month she grew worse.
        - id: ch02-b06
          speaker: narrator
          text: A few months after the wedding, the bride went to the city to buy dresses. She had never visited it before. When her shopping was done, she decided to rest at the home of the sister-in-law she had never met.
        - id: ch02-b07
          speaker: narrator
          text: The house stood on a broad street and should have been magnificent. Instead, a rough wooden door sat beneath its carved stone entrance, and beautiful pillars led nowhere. The neighboring houses were just as unfinished, with water trickling down their walls. Most people would have turned away from such a miserable place. The rich woman saw only that a little money could make the houses splendid, and at once she wanted them for herself.
        - id: ch02-b08
          speaker: narrator
          text: With her mind fixed on gaining the property, she climbed the marble stairs and entered a small room. Her sister-in-law sat there making clothes for the children. The visitor seemed wonderfully interested in the houses and asked question after question about them. The poor family mistook that curiosity for kindness. They liked their new relation much better than they had expected to and began to hope the two households might become good friends.
        - id: ch02-b09
          speaker: narrator
          text: But the moment she reached home, she ordered her husband to take the houses back. They suited her perfectly, she said, and she could turn them into a palace as fine as the king's.
        - id: ch02-b10
          speaker: rich_brother
          text: You may buy houses somewhere else in town, but you cannot have those. I gave them to my brother long ago, and he has lived there for years.
        - id: ch02-b11
          speaker: narrator
          text: His wife burst into angry tears. She made such a noise that all the neighbors leaned from their windows to see what was wrong.
        - id: ch02-b12
          speaker: rich_brothers_wife
          text: This is absurd! It is completely unfair. Your gift means nothing. You gave those houses away while you were a bachelor. Now you are married, and I never agreed to any of it!
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: She went on lamenting all day and all night until her husband was nearly worried to death. At last, he gave in and did exactly what she wanted. He summoned his brother to court and demanded that the houses be returned, claiming now that he had only lent them. The evidence on both sides was heard, and the judge ruled that the houses belonged to the poor brother.
        - id: ch02-b14
          speaker: narrator
          text: That decision made the rich woman more furious than ever, and she swore she would not rest until she won. If one judge refused to give her the houses, then another judge must do it. The case was heard again and again until at last it reached the highest judge of all, in the city of Evora. By then, her husband was heartily tired of the affair and ashamed of the whole business. But his weakness had trapped him. He had failed to stop his wife at the beginning, and now he felt forced to go on.
        - id: ch02-b15
          speaker: narrator
          text: The brothers left for Evora on the same day. The rich brother rode a horse and carried plenty of food. The poor brother walked with nothing to eat but one piece of bread and four onions. The road crossed steep hills, so neither traveled quickly. When night came, both were glad to see lights shining from a house ahead.
    - id: ch03
      title: Trouble on the Road
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The lights came from a farmhouse. Its owner had planned a particularly good supper because it was his wife's birthday. He invited the rich traveler to come in and sit down, then took the man's horse to the stable himself. The poor brother timidly asked whether he might spend the night in some corner, and he made sure to say that he had brought his own supper. The farmer had little liking for humble folk and, on another night, might have turned him away. This time, though, he allowed the elder brother inside and pointed out a wooden chair where he could sit.
        - id: ch03-b02
          speaker: narrator
          text: Supper was soon on the table. The long ride had made the younger brother hungry, and he ate eagerly. But the farmer's wife refused every dish. At last, she announced that she wanted only one of the onions the poor traveler was cooking by the fire.
        - id: ch03-b03
          speaker: narrator
          text: He gave her one, of course, though after walking all day he would gladly have eaten it himself. Three onions made a small supper. Before long, everyone went to sleep, and the poor man settled as comfortably as he could in his corner.
        - id: ch03-b04
          speaker: narrator
          text: A few hours later, the farmer woke to his wife's cries and groans.
        - id: ch03-b05
          speaker: farmers_wife
          text: Oh, I feel terribly ill! I am sure I am dying. It was that onion. I wish I had never eaten it. It must have been poisoned!
          emotion: fearful
        - id: ch03-b06
          speaker: farmer
          text: If that man poisoned you, he will pay for it!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: The farmer seized a thick stick, rushed downstairs, and began beating the sleeping traveler, who had nothing with which to defend himself. The noise woke the rich brother. He leaped up and tore the stick from the farmer's hand.
        - id: ch03-b08
          speaker: rich_brother
          text: My brother and I are going to Evora for a lawsuit. Come with us and accuse him there if you believe he tried to rob or murder you. Do not kill him now, or you will bring trouble upon yourself.
        - id: ch03-b09
          speaker: farmer
          text: Perhaps you are right. But I will be glad when that fellow gets what he deserves.
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: The farmer went to the stable and brought out a horse for himself, along with the black Andalusian mare ridden by the rich brother. Fearing another beating, the poor brother set off at once on foot.
        - id: ch03-b11
          speaker: narrator
          text: Rain had fallen heavily through the night and showed no sign of stopping. Mud covered the road, and in places it was almost impossible to cross. One patch was so deep that a baggage mule had sunk into it. The animal pulled and struggled, but its master could not free it.
        - id: ch03-b12
          speaker: narrator
          text: The muleteer called desperately to the two horsemen, who were circling the swamp at a safe distance. They ignored him. So he spoke cheerfully to his mule instead, promising the poor animal that help must soon arrive.
        - id: ch03-b13
          speaker: narrator
          text: Help did arrive. Before long, the poor brother came trudging up, splashed with mud from head to foot, yet ready to do all he could for the mule and its master. First, the two men searched for stout logs of wood. They laid the logs across the marsh so they could reach the trapped animal without sinking themselves. By then, the mule's frantic struggles had snapped its bridle and left it buried even deeper than before.
        - id: ch03-b14
          speaker: narrator
          text: The poor man stepped carefully along the logs and managed to seize the mule's tail. With one desperate effort, the animal reached firm ground. But its tail came away in the poor man's hand.
        - id: ch03-b15
          speaker: narrator
          text: The muleteer flew into a rage. He forgot that without this stranger's help, he might have lost the whole mule.
        - id: ch03-b16
          speaker: muleteer
          text: You have ruined my animal! The law will make you pay for this!
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: The muleteer jumped onto the animal's back without another thought for the help he had received. The mule was so relieved to escape the choking mud that it did not seem to mind the loss of its tail. The ungrateful man rode away, leaving the poor brother to continue on foot. That evening, he reached an inn at Evora, where the rich brother and the farmer had already arrived for the night.
        - id: ch03-b18
          speaker: narrator
          text: The poor brother continued wearily, wondering what terrible adventure would find him next.
        - id: ch03-b19
          speaker: poor_brother
          text: One of these accusations will surely condemn me. If I must die, I would rather choose my own death than leave it to my enemies.
          emotion: sad
        - id: ch03-b20
          speaker: narrator
          text: When he entered Evora, he searched for a place where he could carry out his plan. He found one, but darkness had fallen, and he could not be certain it would work. So he curled up beneath a doorway and slept until morning.
    - id: ch04
      title: The Leap from the Wall
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Though it was winter, the sun rose in a clear sky, and its rays felt almost warm. The poor man got up from the doorway and shook himself. He intended that day to be the day of his death. Even so, and even though he would leave his wife and children behind, he felt almost cheerful. He had struggled for so long and had grown so very, very tired. He would not have minded the struggle if only he could have proved his innocence and triumphed over his enemies. But they had all been too clever for him, and he had no strength left to fight.
        - id: ch04-b02
          speaker: narrator
          text: He climbed the stone steps to the city battlements and paused to look around.
        - id: ch04-b03
          speaker: narrator
          text: Nearby lived an old man who was ill. That morning, he had begged to be carried outside and laid at the foot of the wall. There, the beams of the rising sun could fall upon him, and he could talk with his friends as they passed on their way to work. The sick man never guessed that directly over his head, on top of the battlements, stood another man who was taking his last look at that very same sun.
        - id: ch04-b04
          speaker: narrator
          text: Golden light touched the steeple across the way. The poor brother closed his eyes and sprang. He fell swiftly from the high wall, but he did not strike the ground. He landed on the sick man, who rolled over and died without a sound. The man who had jumped was not hurt at all. As he slowly stood, someone suddenly seized each of his arms.
        - id: ch04-b05
          speakers: [first_son, second_son]
          ensemble: duo
          text: You killed our father! You will come before the judge this instant and answer for it!
          emotion: angry
        - id: ch04-b06
          speaker: poor_brother
          text: Your father? I do not even know him. What do you mean?
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: The poor man was still bewildered by his sudden rush through the air. He did not know the dead man, and he could not understand why this fresh crime had fallen upon him. The sons gave him no reply at all. They simply hurried him through the streets to the courthouse. His brother, the muleteer, and the farmer had just arrived there too. All three were as angry as ever, and all three were talking at once.
        - id: ch04-b08
          speaker: narrator
          text: Then the judge entered and ordered silence.
        - id: ch04-b09
          speaker: judge
          text: I will hear each case separately.
        - id: ch04-b10
          speaker: narrator
          text: He motioned for the rich brother to begin. The rich man did not take long to state his case. He claimed that the unfinished houses had belonged to their father and had come to him with all the other property. Therefore, he said, the houses were his, and his elder brother had no right to refuse to return them.
        - id: ch04-b11
          speaker: narrator
          text: The poor brother answered just as simply. Years before, when his family had almost nothing, he had asked his brother for those unfinished houses. His brother had freely given them to him. Then the poor man produced the deed of gift, which plainly showed that he was their lawful owner.
    - id: ch05
      title: The Judge of Evora
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The judge listened quietly to both men. He asked several questions and examined what had been placed before him. When he was satisfied that he understood the whole dispute, he announced his decision.
        - id: ch05-b02
          speaker: judge
          text: The houses will remain with the man who received them, for they belong to him. And you brought this case although you knew your claim was wicked and unjust. You will lose the houses and pay your brother one thousand pounds in damages.
        - id: ch05-b03
          speaker: narrator
          text: The rich brother heard the judgment with rage in his heart. The poor brother could only feel surprised and grateful. But his troubles were not over. Now the farmer stepped forward.
        - id: ch05-b04
          speaker: narrator
          text: As the farmer told his story, the judge could hardly hide a smile. He asked whether the farmer's wife had died before he left home.
        - id: ch05-b05
          speaker: farmer
          text: I was in such a hurry to see justice done that I did not wait to find out.
        - id: ch05-b06
          speaker: narrator
          text: The poor brother then told the court exactly what had happened. He had been asleep when the farmer attacked him, and the onion had been freely given to the farmer's wife at her own request. Once again, the judge ruled in his favor. This time, twelve hundred pounds was to be paid to him.
        - id: ch05-b07
          speaker: narrator
          text: Next came the muleteer. The judge told him plainly that he had behaved meanly and ungratefully toward the man who helped him.
        - id: ch05-b08
          speaker: judge
          text: For that, you will pay the poor man fifty pounds. You will also give him the mule until its tail grows back.
        - id: ch05-b09
          speaker: narrator
          text: Last of all came the dead man's two sons.
        - id: ch05-b10
          speakers: [first_son, second_son]
          ensemble: duo
          text: This is the wretch who killed our father. We demand that he die too!
          emotion: angry
        - id: ch05-b11
          speaker: judge
          text: How did you kill him?
        - id: ch05-b12
          speaker: narrator
          text: The poor brother explained that he had leaped from the wall without knowing anyone lay below. When everyone had spoken, the judge gave his final judgment.
        - id: ch05-b13
          speaker: judge
          text: The accused man will sit beneath the wall. The dead man's sons may jump from the top, fall upon him, and kill him in the same way. If they refuse, they must pay eight hundred pounds for making a false accusation.
        - id: ch05-b14
          speaker: narrator
          text: The young men looked at each other. Slowly, both shook their heads.
        - id: ch05-b15
          speakers: [first_son, second_son]
          ensemble: duo
          text: We will pay the fine.
        - id: ch05-b16
          speaker: narrator
          text: The judge nodded. So the poor brother rode home on the mule and carried enough money back to his family to keep them comfortable for the rest of their lives.
        - id: ch05-b17
          speaker: narrator
          text: This tale comes from Portugal.
