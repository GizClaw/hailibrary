audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    father:
      display_name: 老父亲
      tts:
        delivery: 固执威严，发怒时急促而强硬
        timbre: 苍老厚重的男声
        pace: 适中
        pitch: 低
    poor_brother:
      display_name: 穷哥哥
      tts:
        delivery: 诚恳克制，困苦中仍保有善意
        timbre: 温和而略显疲惫的成年男声
        pace: 适中偏慢
        pitch: 中低
    rich_brother:
      display_name: 富弟弟
      tts:
        delivery: 软弱谨慎，讲理时简短直接
        timbre: 清晰平稳的成年男声
        pace: 适中
        pitch: 中
    innkeeper:
      display_name: 客店老板娘
      tts:
        delivery: 好奇多话，试探消息时故作迟疑
        timbre: 响亮圆润的中年女声
        pace: 适中偏快
        pitch: 中高
    rich_wife:
      display_name: 富太太
      tts:
        delivery: 贪婪任性，不如意时尖刻而爱哭闹
        timbre: 尖亮的成年女声
        pace: 快
        pitch: 高
    farmer:
      display_name: 农夫
      tts:
        delivery: 粗暴势利，动怒时咄咄逼人
        timbre: 粗哑结实的成年男声
        pace: 适中偏快
        pitch: 低
    farmer_wife:
      display_name: 农夫妻子
      tts:
        delivery: 娇气直白，难受时哭哭啼啼
        timbre: 偏细的成年女声
        pace: 适中
        pitch: 中高
    muleteer:
      display_name: 赶骡人
      tts:
        delivery: 起初焦急恳求，翻脸后蛮横急躁
        timbre: 粗粝的成年男声
        pace: 快
        pitch: 中低
    sick_man_son_1:
      display_name: 病人长子
      tts:
        delivery: 悲愤冲动，控诉时声音紧绷
        timbre: 有力的年轻男声
        pace: 快
        pitch: 中
    sick_man_son_2:
      display_name: 病人次子
      tts:
        delivery: 悲愤冲动，附和兄长时急切
        timbre: 清亮的年轻男声
        pace: 快
        pitch: 中高
    judge:
      display_name: 法官
      tts:
        delivery: 冷静威严，判案时清楚果断，略带机智
        timbre: 洪亮沉稳的成年男声
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 父子决裂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个富有的老头，妻子已经去世，膝下有两个儿子。长子跟他住在一起，帮他料理家业。年轻人每天很早起床，整天辛苦干活。每到周末，父亲便数一遍赚来的钱，看着铁箱里的金币越堆越高，乐得直搓手。
        - id: ch01-b02
          speaker: father
          text: “这只铁箱眼看就要满了。我得再买一只更大的。”
        - id: ch01-b03
          speaker: narrator
          text: 很长一段日子里，家里事事顺遂。老人满脑子都是钱，没注意到儿子的脸上越来越有光彩，也没发现别人同儿子讲话时，他有时会突然惊醒，仿佛心早就飞到了远方。儿子的变化就在他眼前，他却一次也没有问起。
        - id: ch01-b04
          speaker: narrator
          text: 有一天，老人为了办事进了城。他至少三年没来过了。那天正逢集市，他一路遇见许多熟人，等走进客店院子，天色已经很晚。老人叫马夫赶紧备马，自己站在厅里等候。老板娘凑过来闲聊，说过天气和葡萄园，忽然问他喜不喜欢新儿媳，又问那桩婚事是否让他吃惊。
        - id: ch01-b05
          speaker: father
          text: “儿媳？婚事？我根本不知道你在说什么！我没有儿媳，近来谁结了婚，我也从没听说。”
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: 好奇的老板娘正想探听这件事，却装出十分惊慌的模样。
        - id: ch01-b07
          speaker: innkeeper
          text: “哎呀，但愿我没有惹祸。我一点也不知道。要是知道，当然不会开口。可是……”
        - id: ch01-b08
          speaker: narrator
          text: 她说到这里便停下来，两手摆弄着围裙，仿佛窘迫得不知如何是好。其实她想知道的消息已经探到了。老人盯着她，心里突然冒出一个可怕的猜想。
        - id: ch01-b09
          speaker: father
          text: “话已经说到这里，你就得把后面的也说出来。”
        - id: ch01-b10
          speaker: innkeeper
          text: “您那位英俊的儿子，这几个月每星期进城，可不只是为了做买卖。他还总绕远路，骑马渡河、翻山，再经过葡萄园看守人米格尔的小屋。听说米格尔的女儿是这一带最漂亮的姑娘，不过依我看，她的脸色太白了些。”
        - id: ch01-b11
          speaker: narrator
          text: 老板娘偷眼看着农场主。老人直瞪前方，牙关咬得紧紧的，过了一会儿才低声催她。
        - id: ch01-b12
          speaker: father
          text: “继续说。”
        - id: ch01-b13
          speaker: innkeeper
          text: “也没多少了。一天早晨，两人去了山顶的小教堂，在那里成了婚。我表妹在神父身边做事，是她发现后告诉我的。先生，您的马来了，我还得赶着给集市上歇脚的人预备晚饭，先失陪啦。”
        - id: ch01-b14
          speaker: narrator
          text: 幸好马认得回家的路，脚下又稳。老人任缰绳松松垂在马颈上，一点也没留意它走的是哪条路。一路上，他都沉在刚刚听见的消息里。回到农舍，他把马牵进马厩，立刻去找儿子。长子正坐在门前削一根木棍，嘴里还快活地吹着口哨。老人冲到他跟前，怒火堵在胸口，气得连话都说不利索。
        - id: ch01-b15
          speaker: father
          text: “我全知道了。你一直在骗我！立刻滚出我的视线，我跟你从此一刀两断。”
          emotion: angry
        - id: ch01-b16
          speaker: poor_brother
          text: “可是，父亲——”
        - id: ch01-b17
          speaker: father
          text: “你不是我的儿子！如今我只有一个儿子了。滚，不然你不会有好下场！”
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 老人说着举起鞭子。长子见父亲满脸通红，眼珠几乎要迸出来，怕他突然发病倒地，只得向后退去。留下来也没有用。他还想着，也许到了第二天早晨，父亲的怒气消了，便肯听自己讲些道理。可在心底，他已经明白，父亲那些绝情的话恐怕永远不会收回。
        - id: ch01-b19
          speaker: narrator
          text: 长子慢慢转身，沿小路沉重地走到山坡上的洞穴，在那里坐了一夜。他知道自己做错了，却不明白事情怎么会闹到这一步。他本想把婚事告诉父亲，也深信父亲只要见到妻子，看到她的美丽和善良，就会原谅她的贫穷。可是他总等着更好的机会，一天拖过一天，如今一切都完了。

    - id: ch02
      title: 房屋之争
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那夜不只长子没有合眼，父亲也彻夜未眠。太阳一升起，老人便派人进城，把次子召回家。他说，从今往后次子是唯一的继承人，将得到全部土地和钱财，还要搬回家帮忙管理产业。
        - id: ch02-b02
          speaker: narrator
          text: 兄弟俩原本就没有多少情分，次子想到自己会成为这样一个富翁，自然十分高兴。可是若由他自己选择，他还是宁愿留在城里。乡下生活很快就叫他厌倦，他一心想念城市。这个念头他没有说出口，只是既来之则安之，像从前的哥哥一样从早到晚努力做事。
        - id: ch02-b03
          speaker: narrator
          text: 年复一年，田里的收成渐渐不如从前。老人在城里兴建的几所漂亮房子还没有完工，也只好下令停建，因为若要把它们全部盖好，家里多年的积蓄都会耗尽。老人始终不许任何人在面前提起长子的名字，直到去世也没有再见长子一面。他果然按照当初的许诺，把所有土地和钱财都留给了次子。
        - id: ch02-b04
          speaker: narrator
          text: 被赶走的长子却越来越穷。他和妻子四处找活，能省的钱一分也不乱花，可运气总跟他们作对。父亲去世时，一家人几乎没有面包果腹，也没有衣服蔽体。若只有自己，他总能设法熬下去。可是孩子们一天比一天虚弱，他实在无法继续站在旁边看着。最后，他只好咽下多年的骄傲，翻过群山，回到弟弟居住的老家。
        - id: ch02-b05
          speaker: narrator
          text: 兄弟二人已经许久没见。他们默默对望。哥哥眼中涌出泪水，又赶紧眨了回去。
        - id: ch02-b06
          speaker: poor_brother
          text: “弟弟，我有多穷，不用说你也看得出来。我不是来讨钱的。城里那些没盖完的房子，对你没有用处。你若肯送给我，我会补好屋顶，让妻子和孩子住进去，这样就能省下房租。”
        - id: ch02-b07
          speaker: narrator
          text: 弟弟听哥哥说完，望着他穷困的样子，心里生出怜悯。他没有索要钱财，也没有附加条件，就把哥哥所求的那几所房子送给了他。哥哥终于有了可以安置妻儿的地方，欢欢喜喜地回去了。
        - id: ch02-b08
          speaker: narrator
          text: 这样的日子又过了几年。富弟弟渐渐感到孤单，觉得自己年纪越来越大，也该娶妻了。他选中的女人很有钱，却贪得无厌，不论手里已经有多少，永远还想要更多。尤其不幸的是，她总认定别人拥有的东西一定比自己的好。她既吝啬又不体面，丈夫常后悔当初见到她，也常被她弄得抬不起头来。可他没有勇气管束妻子，只能看着她越来越不像话。
        - id: ch02-b09
          speaker: narrator
          text: 婚后几个月，富太太第一次进城买新衣。买完以后，她去探望素未谋面的嫂子。那几所房子在宽阔的街上，本该十分堂皇，可雕花石门廊里只有一扇粗木小门，漂亮的柱子排出去，尽头什么也没有。两旁的房子也没完工，雨水顺墙而下。
        - id: ch02-b10
          speaker: narrator
          text: 别人见了这种住处，只会赶紧转身。她却看出只要花些钱，房屋便能恢复原先设想的富丽模样，当场决定要弄到自己手里。她登上大理石楼梯，看见嫂子在小屋里给孩子缝衣服，便装出很感兴趣的样子，问了许多问题。哥哥一家还觉得这位新亲戚比想象中可亲，盼着能与她成为朋友。
        - id: ch02-b11
          speaker: narrator
          text: 可她一回到家，就径直去找丈夫，叫他立刻从哥哥手中收回房屋。她说，那些房子正合自己的心意，只要出钱修整，很容易就能改成和国王宫殿一样漂亮的住所。丈夫听后却不肯答应。
        - id: ch02-b12
          speaker: rich_brother
          text: “你可以去城里别处买房。这几所不能给你。我早就送给哥哥了，他们一家也在那里住了许多年。”
        - id: ch02-b13
          speaker: narrator
          text: 妻子顿时大哭大闹，吵得邻居们都从窗口探头张望。
        - id: ch02-b14
          speaker: rich_wife
          text: “太荒唐了，一点也不公平！你送房子时还是单身，那份赠礼根本不算数。后来你跟我结了婚，可我从没答应把房子送人！”
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 她从白天闹到夜里，丈夫几乎被折磨得要死，最后只好依她的意思上法院。他明明把房子送给了哥哥，如今却改口说只是借给哥哥居住。法官听完双方证词，仍判穷哥哥胜诉。富太太更加愤怒，发誓不得到房子绝不罢休。一个法官不给她，她就去找另一个。案子一次又一次重审，最后送到埃武拉城里最高的法官面前。丈夫早已对整件事又厌烦又羞愧，可他起初太软弱，没能制止妻子，如今陷入困境，也只能硬着头皮继续下去。

    - id: ch03
      title: 赶往埃武拉
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 兄弟俩同一天动身去埃武拉。弟弟骑着马，背囊里装着一路吃不完的食物。哥哥却只能步行，带在身上的只有一块面包和四个洋葱。道路翻过一座又一座山，两个人的速度都快不起来。夜幕降临时，他们看见前方不远的一扇窗里透出灯光，都松了一口气。
        - id: ch03-b02
          speaker: narrator
          text: 那是一位农夫的家。这天是他妻子的生日，家里正准备一顿格外丰盛的晚餐。农夫热情地请富弟弟进屋坐下，自己把他的马牵去马厩。穷哥哥怯生生地问，能否让他在屋里找个角落过夜，又赶紧说明自己带了晚饭，不会向主人讨吃的。农夫平日并不喜欢穷苦人，换个日子或许早就拒绝了。这一次他却答应下来，只抬手指给哥哥一把木椅。
        - id: ch03-b03
          speaker: narrator
          text: 弟弟骑马走了一天，饿得厉害，晚饭一上桌便吃得很开心。农夫的妻子却什么也不碰，最后偏说自己这顿晚饭只想吃穷人在火边烤的一个洋葱。哥哥当然把洋葱给了她，尽管走了整整一天之后，他自己也很想吃，而剩下三个洋葱实在少得可怜。后来众人陆续睡下，穷哥哥没有床，只能留在那个角落里，想办法让自己蜷得舒服一些。
        - id: ch03-b04
          speaker: narrator
          text: 几个钟头以后，农夫妻子的哭叫和呻吟惊醒了丈夫。
        - id: ch03-b05
          speaker: farmer_wife
          text: “哎哟，我难受极了，准是要死啦！一定是那个洋葱，我知道就是它。真不该吃下去，它准有毒。”
          emotion: fearful
        - id: ch03-b06
          speaker: farmer
          text: “那人要是给你下了毒，就得付出代价！”
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 农夫抓起粗棍奔下楼，对熟睡的穷哥哥一阵毒打。穷哥哥手无寸铁，根本不能抵挡。响动惊醒了富弟弟，他跳起来，一把夺下棍子。
        - id: ch03-b08
          speaker: rich_brother
          text: “我们正要去埃武拉打官司。你也一起去。他若企图抢劫或谋害你，你尽管到法官面前控告。可别现在把他打死，不然你自己也会惹上麻烦。”
        - id: ch03-b09
          speaker: farmer
          text: “好吧，也许你说得对。不过这家伙越早受罚，我越痛快。”
        - id: ch03-b10
          speaker: narrator
          text: 农夫去马厩牵出一匹马，又带出富弟弟的黑色安达卢西亚母马。穷哥哥怕再挨打，早已立刻步行上路。
        - id: ch03-b11
          speaker: narrator
          text: 大雨下了一整夜，丝毫没有停歇的意思。道路到处都是厚泥，一头驮着行李的骡子陷得尤其深，主人怎么拉也拉不出来。赶骡人向远处绕过泥沼的两个骑马人求助，他们理也不理。他只好故意快活地哄骡子振作，说只要再耐心等一等，一定会有人来帮忙。
        - id: ch03-b12
          speaker: narrator
          text: 来帮忙的果然是穷哥哥。他已经满身泥浆，却立刻和赶骡人寻找结实的圆木，铺到沼泽上。骡子拼命挣扎，早已挣断笼头，越陷越深。穷哥哥踩着圆木靠近，好不容易抓住它的尾巴。骡子拼死一挣，总算回到干地上，尾巴却断在了穷哥哥手里。
        - id: ch03-b13
          speaker: narrator
          text: 赶骡人看见断尾，顿时气得失去理智。他完全忘了没有这番帮助，整头骡子都会葬身泥潭，只顾大骂穷哥哥毁了牲口，还说一定要让法律叫他赔偿。然后，这个忘恩负义的家伙跳上骡背走了。骡子刚从令人窒息的泥浆里脱身，高兴得似乎根本不在乎少了尾巴。当天傍晚，一人一骡也到了埃武拉的客店，富弟弟和农夫已经在那里住下。

    - id: ch04
      title: 城墙下的意外
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 穷哥哥仍在疲惫地赶路，不知道前面还有什么灾祸。他悲伤地想，刚才那些事情无论哪一件，都足以让自己获罪。既然难逃一死，他宁愿亲自选择死法，也不肯把命交给仇人。
        - id: ch04-b02
          speaker: narrator
          text: 进城以后，他四处寻找适合执行计划的地方，最后终于找到了。可天太晚，四下又黑，他不能保证事情成功，只好蜷在一处门洞下睡到早晨。冬日的太阳从晴空升起，他站起来抖抖身体，阳光落在身上，几乎有了暖意。他打算这天结束生命，还要永远抛下妻儿，心里竟有些轻松。他挣扎了太久，实在太累、太累了。若能证明清白，胜过那些仇人，再累也不要紧。可他们个个比他精明，他已经没有力气继续争斗。
        - id: ch04-b03
          speaker: narrator
          text: 穷哥哥登上通往城墙垛口的石阶，停下来望向四周。附近恰好住着一个生病的老人。病人央求家人把自己抬出家门，安置在墙脚，好让初升太阳的光照在身上，也能同上工路过的朋友说几句话。他一点也不知道，头顶正上方的城墙上站着另一个人。那个人也望着同一轮太阳，却是在看生命里的最后一眼，随后便准备迎向等待自己的死亡。
        - id: ch04-b04
          speaker: narrator
          text: 对面教堂的尖顶刚被金光照亮，穷哥哥便闭上眼睛，向前纵身一跃。城墙很高，他飞快地穿过空中，却没有撞上地面，而是重重落在病人身上。病人翻倒在地，一声也没出便死了。跳墙的人反倒毫发无伤。他还不知道发生了什么，正慢慢从地上站起，两条胳膊突然被人紧紧抓住。
        - id: ch04-b05
          speakers: [sick_man_son_1, sick_man_son_2]
          ensemble: duo
          text: “你杀了我们的父亲，看见没有？你现在就跟我们去见法官，为这件事偿命！”
          emotion: angry
        - id: ch04-b06
          speaker: poor_brother
          text: “你们的父亲？可我根本不认识他。你们究竟在说什么？”
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: 他从高处猛坠下来，脑子还晕晕乎乎，根本想不明白为何又添了一项罪名。两个年轻人一句也不回答，只押着他穿过街道，赶到法院。弟弟、农夫和赶骡人刚刚抵达，人人都还怒气冲冲，正七嘴八舌地嚷个不停。法官走进来，命他们安静。
        - id: ch04-b08
          speaker: judge
          text: “我一个一个审。先从弟弟开始。”

    - id: ch05
      title: 法官的判决
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 富弟弟很快陈述完了案情。他说，那几所没盖完的房子是父亲连同其他产业一起留给自己的，哥哥却霸占着，拒绝交还。轮到穷哥哥时，他只用几句话说明，当年自己如何向弟弟求得那些房子，又当庭拿出赠契，证明房屋已经归自己所有。法官一直静静听着，随后问了几个问题，便作出判决。
        - id: ch05-b02
          speaker: judge
          text: “这些房子已经正式送给了你的哥哥，就应当继续归他所有，因为它们本来就是他的。至于你，你明知道这场控告恶毒又不公，却仍把它带到法庭上。因此，你不但得不到那些房子，还要另外付给哥哥一千镑，作为这次诬告的赔偿。”
        - id: ch05-b03
          speaker: narrator
          text: 富弟弟听完判决，心中充满怒火，穷哥哥却又惊又喜，对法官感激不尽。可他的麻烦还没有审完，接下来轮到农夫。法官听着农夫讲那个有毒洋葱的故事，几乎忍不住笑。他只问了一个要紧的问题：农夫离家赶来告状时，妻子是不是真的已经死了。
        - id: ch05-b04
          speaker: farmer
          text: “我急着赶来讨公道，没等着看她到底死没死。”
        - id: ch05-b05
          speaker: narrator
          text: 穷哥哥也把夜里的经过从头讲了一遍。法官再次判他胜诉，命农夫赔给他一千二百镑。接着，轮到赶骡人的控告。法官毫不客气地告诉他，穷哥哥救了困在泥潭里的骡子，他非但不感激，反而把意外断尾的责任全推到恩人身上，实在既刻薄又忘恩负义。
        - id: ch05-b06
          speaker: judge
          text: “你要付给这个穷人五十镑罚金，还要把骡子交给他。等骡子的尾巴重新长出来，你才能把它领回去。”
        - id: ch05-b07
          speaker: narrator
          text: 最后，轮到了病人的两个儿子。
        - id: ch05-b08
          speakers: [sick_man_son_1, sick_man_son_2]
          ensemble: duo
          text: “就是这个恶棍杀了我们的父亲。我们要求让他也偿命！”
          emotion: angry
        - id: ch05-b09
          speaker: judge
          text: “你是怎样杀死他的？”
        - id: ch05-b10
          speaker: narrator
          text: 穷哥哥便说，自己从城墙上跳下来时，并不知道下面有人。等所有人都讲完，法官宣布最后一项判决。
        - id: ch05-b11
          speaker: judge
          text: “让被告坐在城墙下面。死者的两个儿子从墙顶跳下来，落到他身上，把他砸死。他们若不肯这样做，就要为诬告付出八百镑。”
        - id: ch05-b12
          speaker: narrator
          text: 两个年轻人互相看了看，慢慢摇头。
        - id: ch05-b13
          speakers: [sick_man_son_1, sick_man_son_2]
          ensemble: duo
          text: “我们愿意付罚金。”
        - id: ch05-b14
          speaker: narrator
          text: 法官听见他们选择付钱，便点了点头。所有案子到这里终于审完。穷哥哥不但洗清了罪名，还骑着那头断了尾巴的骡子回到家中。他给妻子和孩子带回一大笔钱，足够全家人从此摆脱贫困，再也不必为面包和衣裳发愁，舒舒服服地度过余生。
        - id: ch05-b15
          speaker: narrator
          text: 这个故事改编自葡萄牙。
