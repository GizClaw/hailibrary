  chapters:
    - id: ch01
      title: A Cow, a Pig, and a Journey
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, when wonders of every kind still happened in Brittany, a young man named Houarn Pogamm and a girl named Bellah Postik lived in the village of Lanillis. They were cousins. Their mothers were such close friends that the children had shared a cradle as babies, then played and quarreled over their games as they grew.
        - id: ch01-b02
          speakers: [mother_1, mother_2]
          ensemble: duo
          text: When those two grow up, they will marry.
        - id: ch01-b03
          speaker: narrator
          text: That was what their mothers always said. But just as everyone began expecting a wedding, both mothers died. Houarn and Bellah had no money, so they became servants in the same household. Being together was better than being parted, but they longed for a cottage of their own. Before long, every meeting turned into another complaint about their hard lives.
        - id: ch01-b04
          speaker: houarn
          text: If we could buy one cow and a pig to fatten, I could rent a little ground from the master. Then we could marry.
        - id: ch01-b05
          speaker: bellah
          text: Yes, but times are so hard. The price of pigs went up again at the last fair.
          emotion: sad
        - id: ch01-b06
          speaker: houarn
          text: Then it is plain we'll be waiting a long time.
        - id: ch01-b07
          speaker: narrator
          text: Houarn turned back to his work. Still, the same worries came up whenever they met, until his patience finally ran out. One morning, he told Bellah he meant to leave and seek his fortune.
        - id: ch01-b08
          speaker: narrator
          text: Bellah was miserable. She wished she had tried harder to make the best of their life, and she begged him not to go. Houarn would not be moved.
        - id: ch01-b09
          speaker: houarn
          text: Birds keep flying until they find a field of corn. Bees keep going until they find flowers full of honey. Why should a man have less sense? I will search until I earn enough for our cow and our pig. If you love me, Bellah, don't stand in the way of the plan that will let us marry sooner.
        - id: ch01-b10
          speaker: narrator
          text: Bellah saw that nothing more would change his mind.
        - id: ch01-b11
          speaker: bellah
          text: Then go, if you must. But first, I will share with you everything my parents left me.
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: She went to her room, opened a small chest, and brought out a bell, a knife, and a little stick.
        - id: ch01-b13
          speaker: bellah
          text: This bell can be heard across any distance, but it rings only when someone we love is in terrible danger. The knife breaks every spell on anything it touches. And this stick can carry you wherever you wish. Take the knife to protect you from enchantment, and take the bell so I will know if you are in peril. I will keep the stick. Then, if you need me, I can fly to you.
        - id: ch01-b14
          speaker: narrator
          text: They wept for a while in each other's arms. Then Houarn set off toward the mountains.
        - id: ch01-b15
          speaker: narrator
          text: Beggars were plentiful in those days, just as they are now. Crowds followed Houarn through every village because his clothes had no holes, and they mistook him for a gentleman.
        - id: ch01-b16
          speaker: houarn
          text: I will never make a fortune here. This is a place to spend money, not earn it. I must go farther.
        - id: ch01-b17
          speaker: narrator
          text: He walked on to Pont-Aven, a pretty little town beside a river. While he sat on a bench outside an inn, he heard two muleteers talking as they loaded their animals. They spoke of the Groac’h who lived on the Isle of Lok.
        - id: ch01-b18
          speaker: houarn
          text: What is a Groac’h? I have never met one.
        - id: ch01-b19
          speaker: muleteer_1
          text: It is the name for the fairy who lives in the lake. They say she is richer than all the kings in the world together.
        - id: ch01-b20
          speaker: muleteer_2
          text: Many men have gone to the island after her treasure. Not one has ever returned.
        - id: ch01-b21
          speaker: narrator
          text: Houarn heard that and made up his mind at once.
        - id: ch01-b22
          speaker: houarn
          text: I will go there, and I will come back too.
        - id: ch01-b23
          speaker: narrator
          text: The muleteers stared. They begged him not to throw away his life on such madness. Houarn only laughed.
        - id: ch01-b24
          speaker: houarn
          text: Show me any other way to get a cow and a pig to fatten, and I will forget the island.
        - id: ch01-b25
          speaker: narrator
          text: The men knew of no other way. They shook their heads at his stubbornness and left him to his fate. Houarn went down to the sea and hired a boatman to carry him to the Isle of Lok.
    - id: ch02
      title: The Palace Beneath the Lake
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The island was large. A lake stretched almost all the way across it, joined to the sea by one narrow opening. Houarn paid the boatman, sent him away, and began walking around the water.
        - id: ch02-b02
          speaker: narrator
          text: Beneath a clump of yellow broom, he found a little blue boat shaped like a swan. Its head seemed tucked under its wing. Houarn had never seen such a boat, so he hurried over and stepped inside for a closer look. At once the swan woke. Its head rose, its feet paddled, and a moment later Houarn was in the middle of the lake.
        - id: ch02-b03
          speaker: narrator
          text: Once his surprise had passed, Houarn got ready to jump overboard and swim ashore. The swan guessed what he meant to do. It plunged under the water and carried him down to the palace of the Groac’h.
        - id: ch02-b04
          speaker: narrator
          text: Unless you have traveled beneath the sea and seen its wonders, you can hardly imagine that palace. Shells of blue, green, pink, lilac, and white flowed from one shade into another. Crystal stairways rose inside, and every step sang like a woodland bird beneath his foot. Around the palace lay gardens filled with the plants of the sea, bearing diamonds instead of flowers.
        - id: ch02-b05
          speaker: narrator
          text: In the great hall, the Groac’h rested on a golden couch. Her pink-and-white face matched the shells around her. Coral wound through her long black hair, and her green silk dress looked as if it had been made from the sea itself. Houarn stopped where he stood, dazzled by her beauty.
        - id: ch02-b06
          speaker: groach
          text: Come closer. Strangers are welcome here, especially handsome young men. There is no need to be shy. Tell me how you came here and what you want.
        - id: ch02-b07
          speaker: houarn
          text: My name is Houarn, and my home is Lanillis. I am trying to earn enough for a little cow and a pig to fatten.
        - id: ch02-b08
          speaker: groach
          text: That will be easy to arrange. You needn't trouble yourself about it. Come in and enjoy all I have.
        - id: ch02-b09
          speaker: narrator
          text: She led him into another hall, where the floor and walls were made of pearls. Tables along both sides held every kind of fruit and wine. As Houarn ate and drank, the Groac’h explained that her treasures came from wrecked ships. A magic current carried them all into her palace.
        - id: ch02-b10
          speaker: houarn
          text: No wonder people on land talk so much about you.
        - id: ch02-b11
          speaker: groach
          text: People always envy the rich.
        - id: ch02-b12
          speaker: houarn
          text: As for me, I would be satisfied with half your wealth.
        - id: ch02-b13
          speaker: groach
          text: You may have it, Houarn, if that is what you want.
        - id: ch02-b14
          speaker: houarn
          text: What can you mean?
          emotion: surprised
        - id: ch02-b15
          speaker: groach
          text: My husband, Korandon, is dead. If you wish, you may marry me.
        - id: ch02-b16
          speaker: narrator
          text: Houarn stared at her. Could someone so beautiful and so rich truly want him for a husband? He looked at her once more. Bellah vanished from his thoughts.
        - id: ch02-b17
          speaker: houarn
          text: Only a madman would turn down such an offer. I accept it gladly.
          emotion: happy
        - id: ch02-b18
          speaker: groach
          text: Then we should marry without delay.
        - id: ch02-b19
          speaker: narrator
          text: The Groac’h gave her servants their orders. When the ceremony was over, she asked Houarn to walk with her to a fishpond at the far end of the garden.
        - id: ch02-b20
          speaker: groach
          text: Come, lawyer! Come, miller! Come, tailor! Come, singer!
        - id: ch02-b21
          speaker: narrator
          text: She held out a steel net. At every call, a fish appeared and leaped into it. When the net was full, she carried the fish into a large kitchen and dropped them into a golden pot. Over the bubbling water, Houarn thought he heard small voices whispering.
        - id: ch02-b22
          speaker: houarn
          text: Groac’h, who is whispering inside that golden pot?
        - id: ch02-b23
          speaker: groach
          text: No one. You only hear the wood crackling.
        - id: ch02-b24
          speaker: narrator
          text: It sounded nothing like burning wood to Houarn.
        - id: ch02-b25
          speaker: houarn
          text: Listen. There it is again.
        - id: ch02-b26
          speaker: groach
          text: The water is heating up. It makes the fish jump.
        - id: ch02-b27
          speaker: narrator
          text: Soon the sounds grew louder, until the whispers seemed more like cries.
        - id: ch02-b28
          speaker: houarn
          text: What is making that noise?
        - id: ch02-b29
          speaker: groach
          text: Just the crickets by the hearth.
        - id: ch02-b30
          speaker: narrator
          text: She began to sing, drowning out every cry from the pot. Houarn said no more, but his happiness was gone. Something felt terribly wrong. Then he remembered Bellah.
        - id: ch02-b31
          speaker: houarn
          text: How could I forget her so quickly? What a wretch I am!
        - id: ch02-b32
          speaker: narrator
          text: He stood apart and watched while the Groac’h emptied the fish onto a plate. She told him to begin dinner, then went to fetch wine from her cellar in a cave.
        - id: ch02-b33
          speaker: narrator
          text: Houarn sat down and drew the knife Bellah had given him. The instant its blade touched the fish, the spell broke. Four men stood before him.
        - id: ch02-b34
          speakers: [rescued_1, rescued_2, rescued_3, rescued_4]
          ensemble: chorus
          text: Houarn, please save us, and save yourself too!
          emotion: fearful
        - id: ch02-b35
          speaker: narrator
          text: They hardly dared raise their voices.
        - id: ch02-b36
          speaker: houarn
          text: Then you were the ones crying inside the pot!
          emotion: surprised
        - id: ch02-b37
          speakers: [rescued_1, rescued_2, rescued_3, rescued_4]
          ensemble: chorus
          text: Yes. We came to seek our fortunes, just as you did. We agreed to marry the Groac’h, just as you did. As soon as each wedding ended, she changed us into fish. She did the same to every man before us. They are still in the pond, and soon you will be there with them.
        - id: ch02-b38
          speaker: narrator
          text: Houarn jumped as if he could already feel himself frying in the golden pot. He raced for the door, but the Groac’h had heard everything. She met him at the threshold and threw her steel net over his head. Through its mesh peered the eyes of a small green frog.
        - id: ch02-b39
          speaker: groach
          text: You can go and play with all the others.
        - id: ch02-b40
          speaker: narrator
          text: She carried the frog away and put him in the fishpond.
    - id: ch03
      title: The Bell and the Deer’s Leap
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At that very moment, Bellah was skimming milk in the farm dairy. The fairy bell began to ring wildly. Her face went pale. She knew Houarn was in danger.
        - id: ch03-b02
          speaker: narrator
          text: Bellah quickly changed out of her rough work dress, took the magic stick, and left the farm. Though her knees shook, she ran as fast as she could to the crossroads. There she planted the stick in the earth and repeated a verse her mother had taught her.
        - id: ch03-b03
          speaker: bellah
          text: Little staff of apple tree, over the earth and over the sea, up through the air, be a guide to me, and carry me wherever I may wander free.
        - id: ch03-b04
          speaker: narrator
          text: At once the stick became a fine little horse, with a rosette beside each ear and a feather on its forehead. It stood still until Bellah climbed onto its back, then set off faster and faster. Soon the trees and houses flashed by too quickly for her to see them clearly. Yet even that was not fast enough for Bellah.
        - id: ch03-b05
          speaker: bellah
          text: A swallow cannot match the wind, and the wind cannot match the lightning. But you, my horse, must be faster than them all if you love me. Part of my heart is suffering. The best part of my heart is in danger.
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: The horse heard her. It raced like a piece of straw driven by a storm until they reached the foot of a rock called the Deer’s Leap. There it stopped. No horse or mule ever born could climb that rock, and Bellah knew it. So she sang once more.
        - id: ch03-b07
          speaker: bellah
          text: Horse of Leon, given to me, over the earth and over the sea, up through the air, be a guide to me, and carry me wherever I may wander free.
        - id: ch03-b08
          speaker: narrator
          text: When the verse ended, the horse's front legs shortened and spread into wings. Its back legs became claws, and feathers covered its body. Bellah now sat on a great bird. It carried her to the top of the rock.
        - id: ch03-b09
          speaker: narrator
          text: There she found a nest made of clay and lined with dry moss. A tiny black and wrinkled man sat in its center. The sight of Bellah made him cry out in surprise.
        - id: ch03-b10
          speaker: korandon
          text: Ah! You are the pretty girl who was meant to come and save me!
          emotion: surprised
        - id: ch03-b11
          speaker: bellah
          text: Save you? Who are you, my little friend?
        - id: ch03-b12
          speaker: korandon
          text: I am the husband of the Groac’h of the Isle of Lok. She is the reason I am trapped here.
        - id: ch03-b13
          speaker: bellah
          text: But why are you sitting in this nest?
        - id: ch03-b14
          speaker: korandon
          text: I am sitting on six stone eggs. I cannot be free until they hatch.
        - id: ch03-b15
          speaker: narrator
          text: Bellah laughed when she heard that.
        - id: ch03-b16
          speaker: bellah
          text: You poor little rooster! How can I set you free?
        - id: ch03-b17
          speaker: korandon
          text: You must free Houarn. The Groac’h has him in her power.
        - id: ch03-b18
          speaker: bellah
          text: Tell me how! I would cross all Brittany on my knees if that is what it takes.
        - id: ch03-b19
          speaker: korandon
          text: First, disguise yourself as a young man. Then seek out the Groac’h. You must find a way to take the steel net hanging from her waist. Once you have it, shut her inside it forever.
        - id: ch03-b20
          speaker: bellah
          text: Where can I find a young man's clothes?
        - id: ch03-b21
          speaker: korandon
          text: I will provide them.
        - id: ch03-b22
          speaker: narrator
          text: Korandon pulled three red hairs from his head, blew them into the air, and muttered a few words. In a blink, four hairs had become four tailors. The first carried a cabbage, the second scissors, the third a needle, and the fourth an iron. Without waiting for instructions, they crossed their legs in the nest and began making Bellah a suit.
        - id: ch03-b23
          speaker: narrator
          text: One cabbage leaf became her coat and another her waistcoat. Her wide breeches needed two leaves, as fashion then required. The tailors cut a hat from the cabbage heart and shoes from its thick stem. When Bellah put everything on, she looked like a gentleman in green velvet lined with white satin.
        - id: ch03-b24
          speaker: narrator
          text: Bellah thanked the little men. After Korandon gave her a few more instructions, she climbed onto the great bird again and flew to the Isle of Lok. There she ordered it to become a stick once more. With the stick in her hand, she stepped into the blue swan boat, and it carried her down to the palace of shells.
    - id: ch04
      title: Bellah and the Steel Net
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Groac’h seemed delighted by her visitor. She told Bellah that she had never seen such a handsome young man. Before long, the fairy led her into the great hall, where fruit and wine always waited.
        - id: ch04-b02
          speaker: narrator
          text: Houarn's magic knife lay on the table. Without letting the Groac’h see, Bellah slipped it into the pocket of her green coat. Then she followed her hostess into the garden and over to the fishpond. Fish with sides that shone in a thousand colors darted through the water.
        - id: ch04-b03
          speaker: bellah
          text: Oh, what beautiful creatures! I could sit here and watch them forever.
        - id: ch04-b04
          speaker: narrator
          text: She settled on the bank, elbows on her knees and chin in her hands, as if she could think of nothing but the flashing fish.
        - id: ch04-b05
          speaker: groach
          text: Would you like to stay here forever?
        - id: ch04-b06
          speaker: bellah
          text: I would like nothing better.
        - id: ch04-b07
          speaker: groach
          text: Then all you need to do is marry me. Please don't refuse. I have fallen deeply in love with you.
        - id: ch04-b08
          speaker: bellah
          text: I won't refuse. But first you must let me use your net to catch one of those lovely fish.
        - id: ch04-b09
          speaker: groach
          text: Catching one is harder than it appears. Still, take the net and see how lucky you are.
        - id: ch04-b10
          speaker: narrator
          text: The Groac’h held out the net. Bellah seized it, spun around, and flung it over the witch's head.
        - id: ch04-b11
          speaker: bellah
          text: Let your body show what you truly are inside!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: In an instant, the lovely sea fairy became a hideous toad. She fought to tear the net apart, but the magic held. Bellah pulled it tighter, threw the sorceress into a pit, and rolled a great stone over the opening. Then she left the Groac’h there.
    - id: ch05
      title: The Spell Is Broken
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As Bellah approached the pond, a great procession of fish swam out to meet her. Their voices sounded rough and hoarse.
        - id: ch05-b02
          speakers: [rescued_1, rescued_2, rescued_3, rescued_4]
          ensemble: chorus
          text: Here is our lord and master, the one who saved us from the steel net and the golden pot!
        - id: ch05-b03
          speaker: bellah
          text: And I will give every one of you back your proper shape.
        - id: ch05-b04
          speaker: narrator
          text: Bellah drew the magic knife from her pocket. She was about to touch the first fish when she noticed a green frog kneeling beside her. Its tiny paws were crossed over its heart. Her throat tightened so painfully that she could barely speak.
        - id: ch05-b05
          speaker: bellah
          text: Houarn, is that really you? Is it you?
          emotion: fearful
        - id: ch05-b06
          speaker: houarn
          text: Yes, Bellah. It is me.
        - id: ch05-b07
          speaker: narrator
          text: His answer came as a frog's croak. Then the knife touched him, and he became a man again. Houarn sprang to his feet and wrapped Bellah in his arms.
        - id: ch05-b08
          speaker: bellah
          text: We must remember all the others.
        - id: ch05-b09
          speaker: narrator
          text: Bellah began touching the fish with the knife and returning each one to his true shape. There were so many that the work took a long while. Just as she finished, Korandon arrived from the Deer’s Leap in a little carriage. Six cockchafers pulled it, for the six stone eggs had hatched and changed into those insects.
        - id: ch05-b10
          speaker: korandon
          text: Here I am! You broke the spell that imprisoned me. Now come and claim your reward.
          emotion: happy
        - id: ch05-b11
          speaker: narrator
          text: Korandon climbed down from his carriage and led them into caves heaped with gold and jewels. He told Bellah and Houarn to take as much treasure as they wished.
        - id: ch05-b12
          speaker: narrator
          text: When their pockets were full, Bellah commanded her stick to become a winged carriage. It grew large enough to carry her, Houarn, and every man they had rescued back to Lanillis.
        - id: ch05-b13
          speaker: narrator
          text: Bellah and Houarn married the next day. They no longer needed to begin their life with only the cow and the pig they had wanted for so long. Their treasure let them buy land for miles around. They also gave each man freed from the Groac’h a small farm, where he lived happily for the rest of his days.
