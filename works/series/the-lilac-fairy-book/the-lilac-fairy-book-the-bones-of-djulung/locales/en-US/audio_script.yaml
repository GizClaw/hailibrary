  chapters:
    - id: ch01
      title: The Little Rainbow Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far away in the southern seas lay a beautiful island. Bright orchids linked the trees together, and the nights were nearly as warm and long as the days. Seven sisters lived there in a hut. Their parents were dead, and they had no brothers, so the eldest sister ruled the household. The others always did as she told them.
        - id: ch01-b02
          speaker: narrator
          text: Each girl had her own work. One cleaned the hut. Another carried water from a spring in the forest, and another cooked. The youngest had the hardest task. She cut all the wood and carried it home so the fire could burn without going out. The heat and the heavy loads tired her badly. Once the fire was fed and the next day's sticks were stacked in a corner, she often lay beneath a tree and fell fast asleep.
        - id: ch01-b03
          speaker: narrator
          text: One morning, she came staggering home with another bundle on her back. The river beside the hut looked so cool that she decided to bathe instead of taking her usual nap. She hurriedly dropped the wood by the fire, pushed a few sticks into the flames, and ran down to the water.
        - id: ch01-b04
          speaker: narrator
          text: She jumped in and began to dive, swim, and float. In that dark forest, the trees grew so thickly that hardly any sunlight reached her. After a while, she looked around and saw a tiny fish flashing with such brilliant colors that he seemed to be made from a rainbow.
        - id: ch01-b05
          speaker: youngest_sister
          text: I would love to keep that little fish as my pet.
        - id: ch01-b06
          speaker: narrator
          text: When the fish swam near again, she reached out and caught him. Then she followed a grassy path to a cave. A stream tumbled over the rocks in front of it and filled a basin below. She placed the fish in that basin. His name was Djulung-djulung. She promised to come back soon with something for him to eat, and then she went home.
    - id: ch02
      title: Rice for Djulung
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: By then, the rice for dinner was cooked. The eldest sister divided it among all seven girls in wooden bowls. The youngest left part of her serving untouched. As soon as no one was watching, she slipped away to the forest fountain where Djulung was swimming.
        - id: ch02-b02
          speaker: youngest_sister
          text: Look, Djulung! I remembered you.
        - id: ch02-b03
          speaker: narrator
          text: She dropped the rice into the water one grain at a time. Djulung swallowed every grain greedily, for he had never tasted anything so good.
        - id: ch02-b04
          speaker: youngest_sister
          text: That's everything for today. I'll bring you more tomorrow. Goodbye, Djulung.
        - id: ch02-b05
          speaker: narrator
          text: The girl kept the fish secret from her sisters. Each day, she saved half her rice for him and called him with a soft little song she had made. Sometimes she went hungry, but no one knew. She hardly minded when she saw how much Djulung enjoyed the food. The fish grew large and fat. The girl grew thin and weak, and every load of wood seemed heavier than the one before. At last, her sisters noticed the change.
        - id: ch02-b06
          speaker: narrator
          text: The six older girls talked it over and began watching her. One sister followed her through the forest. She saw the girl reach the fountain and feed Djulung all the rice saved from breakfast. Then she hurried home and told the others what she had seen. There was a lovely fat fish in the basin, she said, and anyone could catch him.
        - id: ch02-b07
          speaker: narrator
          text: The eldest sister went to the fountain and caught Djulung. The sisters boiled him for supper while the youngest was out gathering wood. She knew nothing about what they had done.
    - id: ch03
      title: The Bones Beneath the Fire
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next morning, the youngest sister returned to the cave as usual. She sang her little song, but Djulung did not answer. She sang a second time, and then a third. Still he did not come. She dropped to her knees and stared into the basin. The trees threw such a deep shadow over the water that she could see nothing below.
        - id: ch03-b02
          speaker: youngest_sister
          text: Djulung can't be dead. If he were, his body would be floating on top of the water.
        - id: ch03-b03
          speaker: narrator
          text: She stood and started home. Suddenly, she felt strangely tired.
        - id: ch03-b04
          speaker: youngest_sister
          text: What is happening to me?
        - id: ch03-b05
          speaker: narrator
          text: Somehow, she made it back to the hut. She sank into a corner and slept so deeply that no one could wake her for days.
        - id: ch03-b06
          speaker: narrator
          text: Early one morning, a rooster began crowing so loudly that she could sleep no longer. As he went on crowing, she seemed to understand him. He was telling her that Djulung was dead. Her sisters had killed and eaten him, and his bones were buried beneath the kitchen fire.
        - id: ch03-b07
          speaker: narrator
          text: The girl rose very quietly. She lifted the large stone beneath the fire and found the bones. Then she crept outside and carried them back to the cave by the fountain. There she dug a new hole and buried them again.
        - id: ch03-b08
          speaker: narrator
          text: As she scraped the earth with a stick, she sang to the bones. She asked them to grow into a tree, one so tall that it would reach into the heavens. Its leaves would cross the sea to another island, and the king there would find them.
    - id: ch04
      title: The Iron Tree
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: With no Djulung to feed, the girl soon grew strong and plump again. She could do her work as she had before, so her sisters stopped worrying about her. They never guessed that whenever she entered the forest to gather wood, she visited the tree. Every day it became taller and more marvelous.
        - id: ch04-b02
          speaker: narrator
          text: No one had ever seen a tree like it. Its trunk was iron. Its leaves were silk, its flowers were gold, and diamonds hung from its branches as fruit. One evening, without the girl knowing, a gentle breeze lifted a leaf and carried it across the sea. It came to rest at the feet of one of the king's attendants.
        - id: ch04-b03
          speaker: kings_attendant
          text: What a strange leaf! I've never seen anything like it. I must take it to the king.
        - id: ch04-b04
          speaker: narrator
          text: The attendant showed him the silken leaf. The king declared that he would not rest until he found the tree it came from. If he had to spend the rest of his life searching every island nearby, then that was what he would do.
        - id: ch04-b05
          speaker: narrator
          text: Luckily, he began with the nearest island. There in the forest, the iron tree suddenly stood before him. Its branches shone with leaves just like the one he had brought.
        - id: ch04-b06
          speaker: king
          text: What kind of tree can this be? How did it come to grow here?
        - id: ch04-b07
          speaker: narrator
          text: None of his attendants could answer. The party was about to leave the forest when a young boy passed them. The king stopped him and asked whether anyone lived nearby who might know about the tree.
        - id: ch04-b08
          speaker: boy
          text: Seven girls live in a hut down that way.
        - id: ch04-b09
          speaker: narrator
          text: The boy pointed toward the setting sun.
        - id: ch04-b10
          speaker: king
          text: Go and bring those girls to me. I will wait here.
        - id: ch04-b11
          speaker: narrator
          text: The boy ran to the hut. He told the sisters that a great chief had sent for them, a man who wore strings of jewels around his neck.
    - id: ch05
      title: The Girl Who Knew the Tree
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The six older sisters were pleased and excited, and they followed the boy at once. The youngest was busy and did not care about meeting strangers, so she stayed home to finish her work.
        - id: ch05-b02
          speaker: narrator
          text: The king welcomed the six girls eagerly. He asked them question after question about the iron tree. But they had never even heard that it existed, so they could tell him nothing. The eldest sister grew rather cross when she discovered that the tree was all he wanted to discuss.
        - id: ch05-b03
          speaker: eldest_sister
          text: We live right beside this forest, and even we know nothing about that tree. You can be certain no one else knows either.
        - id: ch05-b04
          speaker: king
          text: But the boy said seven girls lived here. I see only six of you.
        - id: ch05-b05
          speakers: [eldest_sister, second_sister, third_sister, fourth_sister]
          ensemble: chorus
          text: Oh, our youngest sister is still at home. She's always half asleep, and the only useful thing she does is cut firewood.
        - id: ch05-b06
          speaker: king
          text: Perhaps so, but perhaps she dreams. In any case, I mean to speak with her too.
        - id: ch05-b07
          speaker: narrator
          text: The king made a sign to one of his attendants. The man followed the same path the boy had taken and went to the hut.
        - id: ch05-b08
          speaker: narrator
          text: Before long, the attendant came back with the youngest girl walking behind him. The moment she reached the iron tree, it bent all the way down to the earth before her. She held out her hand, gathered some leaves and golden flowers, and presented them to the king.
        - id: ch05-b09
          speaker: king
          text: A maiden who can perform such wonders deserves to become the wife of the greatest chief.
        - id: ch05-b10
          speaker: narrator
          text: And so the king married her. He took her across the sea to his own home, and there they lived happily ever after.
