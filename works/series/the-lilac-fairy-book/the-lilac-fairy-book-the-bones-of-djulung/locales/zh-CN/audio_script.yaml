audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    youngest_sister:
      display_name: 小妹妹
      tts:
        delivery: 天真善良，面对小鱼时亲切活泼，失落时轻柔而疲惫
        timbre: 清澈柔和的少女声
        pace: 适中
        pitch: 中高
    attendant:
      display_name: 随从
      tts:
        delivery: 见到奇物时惊叹，向国王禀报时恭敬清楚
        timbre: 清晰的成年男声
        pace: 适中
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严急躁，好奇时直接，心虚时略显迟疑
        timbre: 洪亮厚实的成年男声
        pace: 适中
        pitch: 低
    boy:
      display_name: 小男孩
      tts:
        delivery: 机灵直率，回答简短自然
        timbre: 明亮的男孩声
        pace: 适中偏快
        pitch: 高
    eldest_sister:
      display_name: 大姐
      tts:
        delivery: 强势自负，不耐烦时语气生硬
        timbre: 偏硬的年轻女声
        pace: 适中偏快
        pitch: 中
    second_sister:
      display_name: 二姐
      tts:
        delivery: 听从大姐，议论小妹妹时轻慢直接
        timbre: 清亮的年轻女声
        pace: 适中
        pitch: 中高
    third_sister:
      display_name: 三姐
      tts:
        delivery: 随声附和，口气漫不经心
        timbre: 柔亮的年轻女声
        pace: 适中
        pitch: 中
    fourth_sister:
      display_name: 四姐
      tts:
        delivery: 随声附和，答话干脆
        timbre: 稍低的年轻女声
        pace: 适中偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 彩虹般的小鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 南方海上有一座美丽的岛。鲜艳的兰花攀过树梢，把树木一棵棵牵在一起。那里白天和黑夜一样长，天气也总是炎热。岛上住着姊妹七人。父母都已去世，家里又没有兄弟，一切便由大姐作主，妹妹们全都听她安排。
        - id: ch01-b02
          speaker: narrator
          text: 有人打扫屋子，有人去森林的泉边汲水，还有人负责烧饭。最小的妹妹领到的差事最苦。她每天都要砍柴背回家，好让灶里的火一直烧着。等她添过火，又把第二天的柴堆好，往往累得倒在树下，一下子就睡熟了。
        - id: ch01-b03
          speaker: narrator
          text: 一天早晨，她背着一捆柴，摇摇晃晃地走过茅屋旁边。河水清清凉凉，看得她真想跳进去。她决定不去睡觉了。她把柴往灶边一放，又往火里塞了几根，便跑到河边，纵身入水。
        - id: ch01-b04
          speaker: narrator
          text: 森林里树木浓密，阳光几乎照不进来。姑娘一会儿潜进水下，一会儿向前游，一会儿仰面漂着，浑身说不出的舒畅。游了一阵，她忽然发现身边有条小鱼。小鱼闪着灿烂的颜色，简直像一道彩虹变成的。
        - id: ch01-b05
          speaker: youngest_sister
          text: “要是能把它养在身边就好了。”
        - id: ch01-b06
          speaker: narrator
          text: 小鱼再次游近时，她伸手捉住了它，沿着青草小路跑到一座山洞前。洞外，一股溪水翻过岩石，落进水潭。她把小鱼放进潭中，给它取名朱隆朱隆，还答应很快带饭来看它。
        - id: ch01-b07
          speaker: narrator
          text: 回到家时，米饭已经煮好。大姐拿木碗给六个妹妹分饭。小妹妹特意留下一些，趁大家不注意，偷偷跑回森林的泉潭。朱隆正在水里游来游去。
        - id: ch01-b08
          speaker: youngest_sister
          text: “你看，我没有忘记你呀！”
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 她把米一颗一颗撒进水里。朱隆从没尝过这么香的东西，贪馋地全吞了下去。
        - id: ch01-b10
          speaker: youngest_sister
          text: “今天只有这么多，明天我再来看你。”
        - id: ch01-b11
          speaker: narrator
          text: 她向小鱼告别，沿小路回了家，却没有把这个秘密告诉姐姐们。从那以后，她每天都省下一半米饭，还编了一支小调，轻声唱着呼唤朱隆。就算自己饿肚子，她也不在意，只要看着小鱼吃得高兴就好。
        - id: ch01-b12
          speaker: narrator
          text: 朱隆越长越肥，身子也越来越大。姑娘却一天比一天瘦弱，肩上的柴仿佛一天比一天沉。姐姐们终于看出了异样。

    - id: ch02
      title: 灶火下的骨头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姐姐们商量一番，决定暗中盯住小妹妹。一个姐姐跟着她来到泉潭，看见她把早餐省下的米全喂给了朱隆。那姐姐赶回去，把见到的一切说了出来，还告诉大家，潭里有条肥美的大鱼，一捉就能捉到。
        - id: ch02-b02
          speaker: narrator
          text: 大姐亲自来到潭边，捉走朱隆，把它煮成了晚饭。那时，小妹妹还在林中，对这件事一点也不知道。
        - id: ch02-b03
          speaker: narrator
          text: 第二天早晨，她照旧来到山洞前，唱起那支小调。可是朱隆没有回应。她又唱一遍，再唱一遍，接着跪在潭边，向黑沉沉的水底望去。树影太浓，她什么也看不见。
        - id: ch02-b04
          speaker: youngest_sister
          text: “朱隆不会死。要是死了，它一定会浮到水面上。”
        - id: ch02-b05
          speaker: narrator
          text: 她站起来往家走，身子忽然疲倦得出奇。
        - id: ch02-b06
          speaker: youngest_sister
          text: “我到底是怎么了？”
        - id: ch02-b07
          speaker: narrator
          text: 她勉强撑回茅屋，倒在墙角，随即睡得不省人事。几天过去了，谁也没能叫醒她。
        - id: ch02-b08
          speaker: narrator
          text: 终于有一天清早，一只公鸡放声啼叫，把她从沉睡中吵醒。公鸡叫个不停，她听着听着，竟明白了它在说什么。朱隆已经死了。姐姐们杀了它，吃了它，骨头就埋在厨房的灶火下面。
        - id: ch02-b09
          speaker: narrator
          text: 姑娘轻轻起身，搬开灶下的大石，取出鱼骨，悄悄带回泉边。她在那里挖了个坑，把骨头重新埋进土中。她一边用木棍刨土，一边唱起歌来。
        - id: ch02-b10
          speaker: youngest_sister
          text: “朱隆的骨头，快快生长吧。长成一棵直入云天的大树，让叶子越过海面，落到另一座岛上，叫那里的国王亲手拾到。”
        - id: ch02-b11
          speaker: narrator
          text: 不再分出米饭喂鱼以后，姑娘很快恢复了健康，又能像从前那样干活。姐姐们便不再管她。她们从来没有猜到，小妹妹每次进森林捡柴，都会去探望那棵树。
        - id: ch02-b12
          speaker: narrator
          text: 那棵树越长越高，也越变越神奇。世上从来没有这样的树。树干是铁铸的，叶子是丝织的，花朵是金子打成的，枝头结的果实全是钻石。
        - id: ch02-b13
          speaker: narrator
          text: 一天傍晚，一阵轻风托起树上的一片叶子。姑娘毫不知情。那片叶子飘过大海，最后落在国王的一名随从脚边。

    - id: ch03
      title: 寻找铁树的国王
      blocks:
        - id: ch03-b01
          speaker: attendant
          text: “这片叶子真奇怪，我从来没见过。一定得拿给国王看看。”
          emotion: surprised
        - id: ch03-b02
          speaker: narrator
          text: 国王看见叶子，当场决定，非找到生出它的树不可。哪怕用余生走遍周围所有岛屿，他也不会罢休。幸好，他先去了离自己最近的那座岛。
        - id: ch03-b03
          speaker: narrator
          text: 国王走进森林，铁树忽然出现在眼前。树枝上覆满闪亮的叶子，和他随身带来的那片一模一样。
        - id: ch03-b04
          speaker: king
          text: “这是什么树？它怎么会长在这里？”
        - id: ch03-b05
          speaker: narrator
          text: 随从们谁也回答不了。众人正要离开森林，一个小男孩从旁边走过。国王叫住他，问附近有没有人家，自己可以去打听这棵树的来历。
        - id: ch03-b06
          speaker: boy
          text: “那边有间茅屋，里面住着七个姑娘。”
        - id: ch03-b07
          speaker: narrator
          text: 男孩伸手指向太阳落下的地方。
        - id: ch03-b08
          speaker: king
          text: “去把她们带来，我就在这里等。”
        - id: ch03-b09
          speaker: narrator
          text: 男孩飞奔到茅屋，告诉七姊妹，有位了不起的酋长召见她们，脖子上挂满了一串串珠宝。六个姐姐听了，又兴奋又欢喜，立刻跟男孩去了。小妹妹正忙着做事，也不愿见陌生人，便留在家里把活儿做完。
        - id: ch03-b10
          speaker: narrator
          text: 国王热切地迎接六个姑娘，接连问起铁树。可她们连听都没听说过，自然一句也答不上来。大姐发现国王召见她们只为这件事，心里很不高兴。
        - id: ch03-b11
          speaker: eldest_sister
          text: “我们就住在森林旁边。连我们都不知道，别人就更不可能知道。”
        - id: ch03-b12
          speaker: king
          text: “那男孩说你们有七个人，怎么只来了六个？”
        - id: ch03-b13
          speakers: [eldest_sister, second_sister, third_sister, fourth_sister]
          ensemble: chorus
          text: “最小的还在家里。她总像没睡醒一样，除了砍柴烧火，什么也做不了。”
        - id: ch03-b14
          speaker: king
          text: “就算是这样，也许她会做梦呢。不管怎样，我也要和她谈谈。”
        - id: ch03-b15
          speaker: narrator
          text: 国王向一名随从示意。那人沿着男孩刚才走过的小路，前往七姊妹的茅屋。

    - id: ch04
      title: 铁树低头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不久，随从回来了，小妹妹跟在他的身后。她一走到铁树前，大树便向下俯身，一直拜倒在她面前。
        - id: ch04-b02
          speaker: narrator
          text: 姑娘伸出手，从树上摘下几片丝叶，又摘下几朵金花，把它们送给国王。
        - id: ch04-b03
          speaker: king
          text: “能让这样的奇迹出现，她正配做世上最伟大酋长的妻子。”
        - id: ch04-b04
          speaker: narrator
          text: 国王就这样娶了姑娘，带她渡过大海，回到自己的家乡。从此以后，他们永远幸福地生活在一起。
        - id: ch04-b05
          speaker: narrator
          text: 这个故事选自A·F·麦肯齐的《民间传说》。
