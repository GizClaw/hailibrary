audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    moti:
      display_name: 莫蒂
      tts:
        delivery: 直率憨厚，嗓门洪亮，笨拙中带着理直气壮的自信
        timbre: 粗犷结实的青年男声
        pace: 适中
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 劳作多年后的疲惫与无奈，话说得干脆
        timbre: 沉厚朴实的中年男声
        pace: 适中偏慢
        pitch: 低
    afghan:
      display_name: 阿富汗马贩子
      tts:
        delivery: 精明强硬，被揭穿时藏着心虚
        timbre: 干涩有力的成年男声
        pace: 适中偏快
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 起初威严审慎，后来对莫蒂满怀惊叹与倚重
        timbre: 饱满端正的成年男声
        pace: 适中偏慢
        pitch: 中低
    messenger:
      display_name: 传令兵
      tts:
        delivery: 仓皇急迫，奔跑后气息短促
        timbre: 明亮紧张的青年男声
        pace: 快
        pitch: 中高
    enemy_king:
      display_name: 敌国国王
      tts:
        delivery: 原本自信傲慢，受惊后急促惶恐
        timbre: 响亮厚实的成年男声
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 五十枚银币
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个叫莫蒂的年轻人。他高大强壮，却笨手笨脚得无人能比。母亲把甜牛奶和凝乳放在地上晾凉，他那双大脚总会踩进碗里，不是砸碎，就是碰翻，天天闯祸。父亲终于忍无可忍。
        - id: ch01-b02
          speaker: father
          text: “莫蒂，这五十枚银币是家里多年攒下的。你拿着离开家，自己去谋生吧。要是有本事，索性挣下一份家业。”
        - id: ch01-b03
          speaker: narrator
          text: 初春的一个清晨，莫蒂扛起粗棍，唱着歌上路了。一路倒还顺利。一个炎热的傍晚，他进了一座城，住进旅人的驿店。你可能没见过这样的地方。它是一座高墙围起的方形大院，墙内一圈都是敞开的柱廊，人和牲口都能在那里歇宿。四角的塔楼里或许还有几间屋子，专留给那些有钱，或是骄傲得不肯挨着自家骆驼和马睡觉的人。莫蒂是乡下小伙，从小和牲口作伴，既不富有，也不骄傲。他向店主借来一张床，摆在一头老水牛旁边。那头水牛让他想起了家乡。不到五分钟，他便睡熟了。
        - id: ch01-b04
          speaker: narrator
          text: 半夜里，莫蒂觉得有人惊动了自己，猛然醒来。他伸手往枕下一摸，吓得魂都快没了，钱袋竟然不见了。他悄悄起身，在驿店里四处寻找，想看看还有谁醒着。他一路绊倒在人和牲口身上，反倒弄醒了好几个。接着，他躲在拱廊的阴影里，把整座驿店绕了一遍，却始终没找到一个像贼的人。正要放弃，他听见两个男人低声说话，其中一个还轻轻笑了。莫蒂从柱子后面探头一看，两个阿富汗马贩子正数着他袋里的银币。莫蒂看得清清楚楚，随后居然回到床上，接着睡了。
        - id: ch01-b05
          speaker: narrator
          text: 第二天，他跟着两个马贩子出了城，一直来到马市。他挑中马群里最好看的一匹，走上前去。
        - id: ch01-b06
          speaker: moti
          text: “这匹马卖吗？让我试着骑一圈怎么样？”
        - id: ch01-b07
          speaker: narrator
          text: 马贩子点了头。莫蒂手脚并用地爬上马背，两脚往马肚子上一磕，马儿便冲了出去。他这辈子从没骑过马，光是留在马背上就已经用尽力气，只好两手两脚一齐死死抱紧，哪里还管得住方向。那匹马爱往哪儿走就往哪儿走，很快便放开四蹄，径直跑回自己前几夜住过的驿店。
        - id: ch01-b08
          speaker: moti
          text: “好极了，这正合我的心意。”
        - id: ch01-b09
          speaker: narrator
          text: 马在食槽前自己停下，莫蒂从背上滚了下来。他立刻爬起，拴好马，还叫了一份早餐。两个阿富汗人很快追到，气喘吁吁地来讨马。莫蒂嘴里塞满米饭，嗓门却一点也不小。
        - id: ch01-b10
          speaker: moti
          text: “讨什么马？这是我的！我付了五十枚银币，才换来这么一匹好马，实在划算。”
        - id: ch01-b11
          speaker: afghan
          text: “胡说，这匹马归我们。”
        - id: ch01-b12
          speaker: narrator
          text: 一个马贩子伸手去解缰绳。莫蒂一把抄起粗棍。
        - id: ch01-b13
          speaker: moti
          text: “住手！再碰我的马，我就打破你们的脑袋！两个贼，别当我不认得。昨晚你们拿了我的钱，今天我牵走你们的马，这不是很公平吗？”
        - id: ch01-b14
          speaker: narrator
          text: 两人顿时有些心虚。可莫蒂死活不肯交出马，他们只好去告官，说莫蒂偷了马，既不归还，也不付钱。
    - id: ch02
      title: 盒子里的石榴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一名士兵把莫蒂召进王宫。国王问他为什么骑走别人的马。莫蒂说，那匹马是用五十枚银币换来的。马贩子却发誓，他们身上的钱来自别的买卖。双方越说越乱，国王心里其实认定莫蒂偷了马，于是想出一个办法。
        - id: ch02-b02
          speaker: king
          text: “我会把一样东西锁进这只盒子。要是莫蒂猜中，马归他。猜不中，马就还给你们。”
        - id: ch02-b03
          speaker: narrator
          text: 莫蒂答应了。国王独自从大殿后门出去，不久便抱着一件用布裹紧的东西回来。他把东西放进盒子，上了锁，再摆给众人看。
        - id: ch02-b04
          speaker: king
          text: “莫蒂，现在猜吧。”
        - id: ch02-b05
          speaker: narrator
          text: 国王打开后门时，莫蒂已经瞧见外面是座花园。国王还没回来，他便在心里细想，花园里什么东西能装进那只小盒子？也许是水果，也许是花。可国王抱得那么紧，不会是花。那就只剩水果或石头了。可他也不会拿干净漂亮的布去包一块脏石头，所以只能是水果。香味还不能太浓，否则国王一定担心自己闻出来。眼下这个季节，有什么水果香味不大呢？只要想明白这一点，谜底就有了。
        - id: ch02-b06
          speaker: narrator
          text: 莫蒂在父亲的园子里干惯了活，寻常水果全都认识。他已有答案，却不愿显得太容易。于是先皱着眉仰望屋顶，又把手指抵在额头，低头看着地面。装足了高深，他才慢慢望向国王。
        - id: ch02-b07
          speaker: moti
          text: “它刚从枝头摘下，又圆又红。盒子里是一只石榴！”
        - id: ch02-b08
          speaker: narrator
          text: 国王对水果一无所知，只知道它们吃起来不错。至于什么季节该结什么果子，他更是从来没有想过。国王想吃什么，随时吩咐人送来，而且总能如愿。所以莫蒂只凭一只锁好的盒子就说出答案，在他听来简直是奇迹。盒子里果然是一只石榴。国王认定，这不只证明莫蒂聪明，也证明他清白。国王惊叹不已，满殿的人自然都跟着夸奖。两个阿富汗马贩子垂头丧气，灰溜溜地离开了。莫蒂则牵走那匹马，留在宫廷里替国王当差。
    - id: ch03
      title: 马换来的老虎
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，一个风雨交加的夜晚，莫蒂回到驿店，发现心爱的马不见了。原地只留下一截断掉的笼头绳，谁也说不清马去了哪里。他把所有可能知情的人都问了一遍，仍没有结果，只好抓起断绳和粗棍，亲自出门寻找。他走啊走啊，一路出了城，又循着泥里的蹄印进了附近的森林。天越来越晚，四周也越来越暗，莫蒂却没有停下。暮色中，他突然撞见一只老虎，正心满意足地吃着他的马。
        - id: ch03-b02
          speaker: moti
          text: “你这个贼！”
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 莫蒂冲了上去。老虎惊得刚把骨头掉下，他的粗棍已经砰地砸在虎头上。那一下打得老虎眼前发黑，连气都喘不过来。莫蒂一边痛骂，一边不停抡棍，直到它站也站不稳。他用断绳套住虎颈，一路拖回驿店。
        - id: ch03-b04
          speaker: moti
          text: “你吃掉我的马，我至少要留下你。这样才公平。”
        - id: ch03-b05
          speaker: narrator
          text: 他照从前拴马的样子，把老虎的头和四脚捆得结结实实。夜已经深了，莫蒂往旁边一倒，呼呼大睡。第二天，驿店里的人睁开眼，看见一只活老虎牢牢拴在他们和牲口中间，吓得全乱了。它虽然被打得凄惨，到底还是一只老虎。男人们远远围成一堆又一堆，又议论，又惊叫，还不停埋怨店主，问他怎么能放这么危险的猛兽进来。可店主和他们一样心惊胆战。谁也不敢靠近那块地方，只敢远远望着。老虎愁苦地眨着眼，一会儿看看这个，一会儿看看那个。莫蒂却四仰八叉地躺在旁边，睡得正香，鼾声像雷一样响。
        - id: ch03-b06
          speaker: narrator
          text: 消息终于传到国王耳中，说莫蒂拿自己的马换来了一只活老虎。国王觉得这件事实在难以相信，便亲自赶到驿店，看传闻是真是假。好不容易有人壮着胆子叫醒莫蒂，告诉他国王来了。莫蒂打着哈欠爬起来，立刻兴高采烈地讲述经过，还得意地向主人展示自己的新宝贝。国王却一点也不欣赏。他叫来一名士兵，当场射死了老虎。驿店里除了莫蒂以外，所有人都大大松了一口气。
        - id: ch03-b07
          speaker: narrator
          text: 国王原先觉得莫蒂智慧过人，如今又认定他勇敢无比，便把他的薪俸加到一百倍。莫蒂也确信，自己是天底下最走运的人。
    - id: ch04
      title: 骑着小马去打仗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一两个星期后，国王召莫蒂进宫。邻国君主兵多势众，已经向他宣战。他既没有钱收买对方，也没有足够的士兵迎战，急得没了主意。
        - id: ch04-b02
          speaker: moti
          text: “若只是这点事，您不用发愁。把人马召集起来，我跟他们一起去，很快就让那个强盗学会讲理。”
        - id: ch04-b03
          speaker: narrator
          text: 国王听得重新有了精神，带莫蒂去马厩，让他随便挑选坐骑。满栏都是骏马，莫蒂却偏偏选了一匹瘦小难看的劣马。它平日只替其他马匹驮草送水，国王实在想不通。
        - id: ch04-b04
          speaker: king
          text: “那么多好马，你为什么选中这个小家伙？”
        - id: ch04-b05
          speaker: moti
          text: “陛下，我多半会从马背上掉下来。要是骑高头大马，不摔断脖子，也得摔断胳膊或腿。可这匹马离地面不远，我掉下来也伤不了多少。”
        - id: ch04-b06
          speaker: narrator
          text: 莫蒂出征时的模样滑稽极了。他唯一的武器就是那根粗棍。为了让自己在马背上坐稳，他还在两边脚踝上各绑了一块大石头。骑在那匹小马上，两块石头几乎擦着地。前面的骑兵虽然人数不多，倒是个个身披铠甲，骑着骏马，昂首向前。后面跟着一大群乱哄哄的步兵，手上拿着五花八门的兵器。国王和随从走在队伍最后。国王心里七上八下，怎么看都不像准备好去打一场仗。大军就这样出发了。
        - id: ch04-b07
          speaker: narrator
          text: 路途并不很远，可小马驮着莫蒂这个大汉，脚边还挂着两块巨石，没走多久便被骑兵甩远。步兵原本也能越过他，可他们并不想太早赶到战场，便故意拖慢脚步，给莫蒂留下充足的时间。他晃晃悠悠地走着，小马却越来越慢。莫蒂终于失去耐心，抡起粗棍，狠狠抽了它一下。小马顿时发了脾气，撒腿狂奔。一块石头先松开，卷着尘土滚到路边，莫蒂也险些跟着滚下去。他扔掉棍子，拼命抱住小马蓬乱的鬃毛。接着另一条腿上的石头也挣断绳子，轰隆隆滚进旁边的山沟。
        - id: ch04-b08
          speaker: narrator
          text: 前方的骑兵刚闪到两边，莫蒂便从中间冲过。他抱着马鬃，冲惹祸的小马大吼。
        - id: ch04-b09
          speaker: moti
          text: “等我逮住你！我非活剥了你的皮，拧断你的脖子，再砸碎你浑身每一根骨头！”
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 骑兵却以为这番狠话全是冲着敌人喊的，一个个听得心生敬佩，只觉得莫蒂勇气过人。他像一阵怒吼的旋风冲过队伍，许多战马也被这番动静吓坏了。有的乱跳，有的猛然直立，还有的接连尥起蹶子。骑兵费了好一番力气也没能让它们安静。没过几分钟，整支队伍都被受惊的马带着，紧紧追在莫蒂身后。
        - id: ch04-b11
          speaker: narrator
          text: 莫蒂仍遥遥领先。他经过一片蓖麻地，里面的植株足有十到十二英尺高，枝叶茂盛，却又青又软。他伸手抓住一株，想借力离开马背。不料蓖麻连根拔起，他只好继续飞驰，手里挥着整棵植株，活像举着一棵小树。
    - id: ch05
      title: 发疯的巨人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 敌军正列阵越过平原，他们的国王满怀信心，也在军中。突然，一名传令兵从前方拼命奔来。
        - id: ch05-b02
          speaker: messenger
          text: “陛下，快逃命！敌人来了！”
          emotion: fearful
        - id: ch05-b03
          speaker: enemy_king
          text: “到底出了什么事？”
        - id: ch05-b04
          speaker: messenger
          text: “不能再等了！敌军最前面有个发疯的巨人，正纵马飞奔。他拿一棵树当棍棒，还怒吼着要活剥人皮，拧断人的脖子，砸碎每一根骨头。后面还有大队人马。那股毁灭一切的旋风马上就要扑过来了，您快撤吧！”
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: 恰在这时，国王看见远处的尘云里，莫蒂正纵马疾驰而来。他骑的牲口实在太小，把他衬得像个真正的巨人。那株被他抡来抡去的蓖麻，远远望着也像一棵橡树。风把他的吼叫和咒骂一阵阵送来。身后，尘云随着雷鸣般的马蹄声向前滚动，云里还不时闪出兵器的寒光。敌国国王眼里看到这一切，耳中又听到那声势，以为一整团怒吼的巨人杀到了。他吓得掉转马头，全速逃命。全军也立刻跟在后面，有多快就逃多快。
        - id: ch05-b06
          speaker: narrator
          text: 只有一个胖军官徒步落在后面，怎么也追不上这场疯狂的溃逃。眼见莫蒂越冲越近，他吓得彻底没了办法，只能五体投地，趴倒在路上。莫蒂那匹小马本来就已经受惊，再看见地上突然多出一个人，更是受不了。它猛地闪向一旁，莫蒂便像一枚冲天火箭，嗖地飞过马头，正好落在胖军官身上。莫蒂很快站稳了脚，又把手里的蓖麻抡过头顶，大声向敌人叫阵。
        - id: ch05-b07
          speaker: moti
          text: “你的人马呢？全叫来，我要收拾他们！我的军团，快上！你们的国王在哪儿？把他带来！我的好汉已经赶到了。我们一人拔一棵树，把你们、你们的房屋和城镇，还有所有东西，全都砸平！来呀！”
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: 胖军官只能跪坐在地，双手合十，不住喘气。好不容易缓过气来，莫蒂便打发他去把国王带来。
        - id: ch05-b09
          speaker: narrator
          text: 莫蒂让他转告国王，只要肯讲道理，便能保住性命。可怜的胖军官匆匆去了。等到莫蒂一方的人马赶上来，列好队伍，尽力摆出最威武吓人的阵势，他也带着国王回来了。那位国王变得无比谦卑，不住赔礼道歉。他答应从此再也不发动战争，还愿意赔付一大笔钱。无论征服者提出什么要求，他都一概照办。
        - id: ch05-b10
          speaker: narrator
          text: 两边的军队都欢欢喜喜地回家了。这一仗真正成就了笨手笨脚的莫蒂，他从此飞黄腾达，活了很久。除了自家亲戚，人人都把他当作智慧、勇气和谨慎的源泉。只有他的亲戚始终想不明白，莫蒂到底做过什么，怎么就比世上的人都聪明了。这个故事来自普什图民间。
