  chapters:
    - id: ch01
      title: Fifty Pieces of Silver
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a young man called Moti. He was very big and strong, and he was also the clumsiest person you could imagine. His great feet were forever landing in the bowls of sweet milk or curds that his mother left cooling on the floor. He smashed things, knocked things over, and broke one thing after another. At last, his father could bear no more.
        - id: ch01-b02
          speaker: father
          text: Moti, here are fifty silver pieces. It took us years to save them. Take the money, go out into the world, and earn your living. Perhaps you can even make your fortune.
        - id: ch01-b03
          speaker: narrator
          text: Early one spring morning, Moti set off with his thick staff over his shoulder. He sang cheerfully as he walked, and for some time he managed very well.
        - id: ch01-b04
          speaker: narrator
          text: Then, on a hot evening, he reached a city and went into the travelers' serai to spend the night. A serai was a large square surrounded by a high wall. An open, covered walkway ran all around the inside, with room beneath it for people and animals. There might also be a few tower rooms at the corners for travelers too rich or proud to sleep beside their camels and horses.
        - id: ch01-b05
          speaker: narrator
          text: Moti was a country boy who had lived among cattle all his life. He was neither rich nor proud. He borrowed a bed from the innkeeper and placed it beside an old buffalo that reminded him of home. Within five minutes, he was sound asleep.
        - id: ch01-b06
          speaker: narrator
          text: In the middle of the night, something woke him. He reached under his pillow and discovered, to his horror, that his bag of money was gone. Moti rose quietly and prowled around to see who might still be awake. He did wake several men and animals by falling over them, but he crossed the shadowy arches of the whole serai without finding a likely thief.
        - id: ch01-b07
          speaker: narrator
          text: He was about to give up when he heard two men whispering. One of them laughed softly. Moti peered behind a pillar and saw two Afghan horse dealers counting the silver from his own bag. He did not challenge them or raise an alarm. After seeing exactly where his money had gone, Moti simply went back to bed.
    - id: ch02
      title: The Horse and the Pomegranate
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, Moti followed the Afghans beyond the city to the horse market, where they had put all their horses up for sale. He looked over the animals very carefully, chose the finest-looking one among them, and walked straight toward it.
        - id: ch02-b02
          speaker: moti
          text: Is this horse for sale? May I take it for a trial ride?
        - id: ch02-b03
          speaker: narrator
          text: The dealers agreed. Moti scrambled onto the horse, dug in his heels, and away they flew. He had never ridden a horse before. It took both hands and both legs just to stay on, so the animal went wherever it pleased. Soon it was racing at a deadly gallop straight back to the serai where it had spent the past few nights.
        - id: ch02-b04
          speaker: moti
          text: This suits me very well.
        - id: ch02-b05
          speaker: narrator
          text: The horse swept through the entrance and stopped by its own stall. Moti rolled off at once. He jumped up, tied the animal securely, and ordered breakfast. Before long, the two Afghans arrived, furious and out of breath. They demanded their horse back.
        - id: ch02-b06
          speaker: moti
          text: What are you talking about? This is my horse. I paid you fifty silver pieces for it, and I call that a bargain!
        - id: ch02-b07
          speaker: afghan_1
          text: That's nonsense! The horse belongs to us.
        - id: ch02-b08
          speaker: narrator
          text: The first Afghan began untying the bridle. Moti seized his staff.
        - id: ch02-b09
          speaker: moti
          text: Leave my horse alone, or I'll crack both your skulls! I know you thieves. You took my money last night, so I took your horse today. That's fair enough!
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: The Afghans looked uneasy when Moti accused them. Still, he was plainly determined to keep the horse, so they decided to appeal to the law instead of arguing with his staff. They went to the king and complained that Moti had stolen one of their horses and refused either to return it or pay for it.
        - id: ch02-b11
          speaker: narrator
          text: Soon a soldier came to summon Moti. Moti bowed before the king, who asked why he had galloped away on the horse. Moti insisted that he had exchanged fifty silver pieces for it. The dealers swore that the money they carried had come from selling other horses. Their quarrel grew so tangled that the king, who really believed Moti had stolen the animal, finally proposed a test.
        - id: ch02-b12
          speaker: king
          text: I will place something inside this box and lock it. If Moti guesses what it is, the horse belongs to him. If he fails, the horse belongs to you.
        - id: ch02-b13
          speaker: narrator
          text: Moti agreed. The king went alone through a small door at the back of the court. He soon returned with something wrapped tightly in a cloth beneath his robe. He slipped it into the box, locked it, and set the box where everyone could see.
        - id: ch02-b14
          speaker: king
          text: Now, Moti. Tell us what is inside.
        - id: ch02-b15
          speaker: narrator
          text: When the king opened that little door, Moti had noticed a garden beyond it. He began to reason. What could the king find in a garden that was small enough for the box? A flower seemed unlikely, because the king had held the bundle too tightly. It must be a fruit or a stone. But he would never wrap a dirty stone in such a clean cloth. So it had to be fruit.
        - id: ch02-b16
          speaker: narrator
          text: It could not have much fragrance, or the king would fear that Moti might smell it. What fruit with little scent was in season just then? Moti was a country boy who had worked in his father's garden, and he knew all the common fruits. He felt sure he could solve the riddle.
        - id: ch02-b17
          speaker: narrator
          text: To keep the answer from looking too easy, he stared at the ceiling with a puzzled face. Then he gazed wisely at the floor and pressed his fingers to his forehead. At last, he looked straight at the king and spoke very slowly.
        - id: ch02-b18
          speaker: moti
          text: It was freshly picked. It is round, and it is red. It is a pomegranate!
        - id: ch02-b19
          speaker: narrator
          text: The king knew nothing about fruit except that it tasted good. He ordered whatever fruit he wanted in any season, and someone always found it for him. To the king, Moti's answer seemed like a miracle. It also seemed perfect proof that Moti was innocent, for a pomegranate was exactly what lay inside the box.
        - id: ch02-b20
          speaker: narrator
          text: The king praised Moti's wisdom, and everyone else followed his example. The Afghans went away crestfallen. Moti kept the horse and entered the king's service.
    - id: ch03
      title: A Tiger in the Serai
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Not long afterward, Moti returned to the serai on a wet and stormy evening and found that his precious horse had wandered away. Only a broken halter cord remained, and no one knew where the animal had gone. Moti questioned everyone who might know. Then he took the cord and his great staff and set out to search.
        - id: ch03-b02
          speaker: narrator
          text: He tramped far beyond the city and into the nearby forest, following hoofprints through the mud. Evening deepened, but Moti kept going. In the gathering darkness, he suddenly came upon a tiger peacefully eating his horse.
        - id: ch03-b03
          speaker: moti
          text: You thief!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: Moti charged. The astonished tiger dropped a bone, and Moti's staff came crashing down on its head. The blow left the beast half stunned, scarcely able to see or breathe. Moti showered it with more blows and abuse until it could barely stand. Then he tied the broken halter around its neck and dragged it back to the serai.
        - id: ch03-b05
          speaker: moti
          text: You took my horse, so now I'll take you. That's fair enough!
        - id: ch03-b06
          speaker: narrator
          text: He bound the tiger securely by its head and heels, much as he used to tie the horse. The night was nearly over, so Moti threw himself down beside it and slept soundly.
        - id: ch03-b07
          speaker: narrator
          text: Imagine the terror when the people in the serai woke and found a tiger tethered among them and their animals. It was badly battered, but it was still a tiger. Men gathered in frightened groups, blaming the innkeeper for allowing such a dangerous beast inside. The innkeeper was every bit as troubled as they were.
        - id: ch03-b08
          speaker: narrator
          text: No one dared approach. The miserable tiger stood blinking at them while Moti lay stretched beside it, snoring like thunder.
        - id: ch03-b09
          speaker: narrator
          text: At last, word reached the king that Moti had traded his horse for a living tiger. Half convinced the tale was impossible, the king came to see for himself. Someone woke Moti and told him that his royal master had arrived. Moti rose with a yawn, then happily began explaining and showing off his new possession.
        - id: ch03-b10
          speaker: narrator
          text: The king did not share Moti's delight in the least. He called a soldier forward and ordered him to shoot the tiger. Everyone living in the serai was relieved to see the danger ended, except Moti. The king had already believed Moti the wisest of men. Now he believed Moti the bravest as well, and he raised his pay a hundredfold. Moti decided he must be the luckiest man alive.
    - id: ch04
      title: Moti Rides to War
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A week or two later, the king sent for Moti. This time, Moti found him in despair. A neighboring king with a much larger army had declared war. Moti's king had neither enough money to buy peace nor enough soldiers to fight. He did not know what to do.
        - id: ch04-b02
          speaker: moti
          text: If that's the whole trouble, don't worry. Call out your men and send me with them. We'll soon make this robber listen to reason.
        - id: ch04-b03
          speaker: narrator
          text: Those hopeful words revived the king. He led Moti to the royal stable and told him to choose any horse he wished. Fine horses filled the stalls, but Moti astonished him by selecting a poor little pony used to carry grass and water for the others.
        - id: ch04-b04
          speaker: king
          text: Why would you choose that miserable little animal?
        - id: ch04-b05
          speaker: moti
          text: Your Majesty, I may fall off in any number of ways. If I ride one of your great horses, I'll have so far to fall that I could break an arm or a leg, or even my neck. If I tumble off this little fellow, I can't hurt myself much.
        - id: ch04-b06
          speaker: narrator
          text: Moti made a very funny sight as he rode out to war. His staff was his only weapon. To help himself balance, he tied a huge stone to each ankle. The stones almost touched the ground on either side of the little pony.
        - id: ch04-b07
          speaker: narrator
          text: The king's cavalry was not very large, but the riders pranced along in armor on splendid horses. Behind them marched a great, disorderly crowd of foot soldiers carrying every sort of weapon they could find. Last came the king with his attendants. He looked nervous and deeply uneasy as his army set out.
        - id: ch04-b08
          speaker: narrator
          text: They did not have far to travel. Even so, the pony soon fell behind the cavalry beneath the weight of one heavy man and two enormous stones. It might have dropped behind the foot soldiers as well, but they were in no hurry to reach the battle. They held back and gave Moti plenty of time.
        - id: ch04-b09
          speaker: narrator
          text: Moti jogged more and more slowly until he lost patience and struck the pony a tremendous blow with his staff. The pony lost its temper and bolted. One stone came loose and rolled away in a cloud of dust. Moti almost followed it, but he clutched the ragged mane and stayed on. He dropped his staff and held tight for his life.
        - id: ch04-b10
          speaker: narrator
          text: Then the second rock broke free and went thundering down a ravine. The cavalry ahead barely had time to move aside as Moti dashed through, shouting savage threats at his runaway pony.
        - id: ch04-b11
          speaker: moti
          text: Just wait until I catch you! I'll skin you alive! I'll wring your neck! I'll break every bone in your body!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: The cavalry heard every dreadful word and thought Moti was threatening the enemy. They were filled with admiration for his courage. Their horses were badly startled by this howling whirlwind that had torn through their ranks. The animals plunged, reared, and kicked, and within minutes the whole troop was racing close behind Moti.
        - id: ch04-b13
          speaker: narrator
          text: Far ahead, Moti rushed wildly onward. He came to a field of castor-oil plants, ten or twelve feet high. They were thick and bushy, but their stems were green and soft. Hoping to pull himself off the pony, Moti grabbed one as he passed. Its roots tore out of the earth. He raced on with the whole plant waving in his hand like a young tree.
    - id: ch05
      title: The Whirlwind of Destruction
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The enemy army was advancing across the plain in battle order. Their king rode with them, confident and cheerful. Suddenly, a desperate rider came galloping from the front.
        - id: ch05-b02
          speaker: enemy_messenger
          text: Sire, save yourself! The enemy is coming!
          emotion: fearful
        - id: ch05-b03
          speaker: enemy_king
          text: What do you mean?
        - id: ch05-b04
          speaker: enemy_messenger
          text: Run at once, sire! There is no time. A mad giant is leading them at a furious gallop. He is waving a tree like a club and roaring that he'll skin us alive, wring our necks, and break every bone in our bodies. More riders are behind him. You must retreat before this whirlwind of destruction reaches us!
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: Just then, the king saw Moti far away, charging out of a cloud of dust. Against the tiny pony, Moti truly looked like a giant. He swung the castor-oil plant around him, and from across the plain came the sound of his furious shouting.
        - id: ch05-b06
          speaker: narrator
          text: Behind him, the dust cloud rolled forward with the thunder of many hoofbeats, and flashes of steel shone here and there. His curses and shouts came down the breeze. The sight and sound terrified the king. He thought a whole regiment of yelling giants was bearing down upon him. He wheeled his horse around and fled at full speed, and every one of his soldiers followed as fast as he could.
        - id: ch05-b07
          speaker: narrator
          text: Only one fat officer on foot could not keep pace with that wild retreat. As Moti galloped near, the officer threw himself flat on the ground in terror. The sudden movement was too much for the excited pony. It shied, and Moti shot over its head like a skyrocket. He landed squarely on top of his fat enemy.
        - id: ch05-b08
          speaker: narrator
          text: Moti sprang to his feet, swung the great plant around his head, and bellowed at the officer.
        - id: ch05-b09
          speaker: moti
          text: Where are your men? Bring them here, and I'll kill them! Come on, all my regiments! Where is your king? Bring him to me! My fine fellows are almost here. We'll each tear up a tree by the roots and flatten every one of you, along with your houses, your towns, and everything else! Come on!
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: The poor officer could only kneel with his hands clasped, gasping for breath. When he could finally speak, Moti sent him to fetch his king. The officer was to say that if the king behaved reasonably, Moti would spare his life.
        - id: ch05-b11
          speaker: narrator
          text: The officer hurried away with Moti's message. Meanwhile, Moti's own troops finally caught up. They arranged themselves so that their small force looked as fearsome as possible. Then the officer returned with his king. The defeated monarch was humble and apologetic. He promised never to make war again. He also promised a great sum of money and agreed to do whatever his conqueror demanded.
        - id: ch05-b12
          speaker: narrator
          text: With the war ended and the payment agreed, both armies went home rejoicing. That strange victory truly made the fortune of clumsy Moti. He lived a long life, and nearly everyone continued to honor him as a fountain of wisdom, courage, and good judgment.
        - id: ch05-b13
          speaker: narrator
          text: Only his own family could never understand what Moti had done to make people think he was wiser than anyone else.
