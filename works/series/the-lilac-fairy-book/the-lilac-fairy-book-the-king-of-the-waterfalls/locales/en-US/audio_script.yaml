  chapters:
    - id: ch01
      title: Three Games with the Gruagach
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When the young king of Easaidh Ruadh came into his kingdom, his first thought was how to amuse himself. All the sports he had loved suddenly seemed dull. He wanted something he had never tried before, and at last his face brightened.
        - id: ch01-b02
          speaker: king
          text: I know what I will do! I will go and play a game with the Gruagach.
        - id: ch01-b03
          speaker: narrator
          text: The Gruagach was a wicked sort of fairy with long, curly brown hair, and he lived not far from the king. The king was young and eager, but he was prudent too. His father had warned him on his deathbed to take great care when dealing with the fairies, whom people called the good people. So the king first went to a wise man of the countryside.
        - id: ch01-b04
          speaker: king
          text: I mean to play a game with the curly-haired Gruagach.
        - id: ch01-b05
          speaker: wizard
          text: Do you indeed? If you take my advice, you will choose someone else to play with.
        - id: ch01-b06
          speaker: king
          text: No. It is the Gruagach I intend to play.
        - id: ch01-b07
          speaker: wizard
          text: Well, if you are set on it, then go. But should you win, ask for the ugly, crop-headed girl who stands behind the door.
        - id: ch01-b08
          speaker: king
          text: I will remember.
        - id: ch01-b09
          speaker: narrator
          text: Before sunrise the king went to the Gruagach's house and found him sitting outside.
        - id: ch01-b10
          speaker: gruagach
          text: O king, what brings you here today? You are welcome, and you will be more welcome still if you play a game with me.
        - id: ch01-b11
          speaker: king
          text: That is exactly why I came.
        - id: ch01-b12
          speaker: narrator
          text: They began to play. For a while it looked as though the Gruagach would win. Then the game turned, and the king seemed certain to beat him. Back and forth it went, with neither able to hold the advantage for long. But when the game ended, the king was the winner.
        - id: ch01-b13
          speaker: gruagach
          text: What prize do you choose?
        - id: ch01-b14
          speaker: king
          text: I choose the ugly, crop-headed girl behind your door.
        - id: ch01-b15
          speaker: gruagach
          text: Why choose her? There are twenty other girls in my house, and every one is prettier!
          emotion: surprised
        - id: ch01-b16
          speaker: king
          text: They may be prettier, but she is the one I want for my wife. I will take no other.
        - id: ch01-b17
          speaker: narrator
          text: The Gruagach saw that the king would not change his mind. He went inside and ordered every maiden in the house to come out, one after another, and walk past the king. There were twenty of them. Out they came, some tall and some short, some dark and some fair, some plump and some thin.
        - id: ch01-b18
          speaker: maiden_1
          text: I am the girl you want. You would be a fool not to choose me!
        - id: ch01-b19
          speaker: narrator
          text: Each girl made the same claim. But the king chose none of them. At last the crop-headed girl appeared. She was so ugly that most men would have turned away from her.
        - id: ch01-b20
          speaker: king
          text: This is the one. We will marry at once, and then I will take you home.
        - id: ch01-b21
          speaker: narrator
          text: They were married at once, and then set off across a meadow toward the king's house. As they crossed the grass, the bride bent down and picked a sprig of shamrock growing among the green blades. When she stood upright again, all her ugliness had vanished. The most beautiful woman anyone had ever seen now walked beside the king.
        - id: ch01-b22
          speaker: narrator
          text: Before sunrise the next morning, the king jumped from bed and said he must play another game with the Gruagach.
        - id: ch01-b23
          speaker: queen
          text: If my father loses and you win again, accept only one prize. Ask for the shaggy young horse with the stick saddle.
        - id: ch01-b24
          speaker: king
          text: That is what I will ask for.
        - id: ch01-b25
          speaker: narrator
          text: At his door, the Gruagach was waiting.
        - id: ch01-b26
          speaker: gruagach
          text: Does your bride please you?
        - id: ch01-b27
          speaker: king
          text: How could she not? I would be very hard to please if she did not. Will you play another game today?
        - id: ch01-b28
          speaker: gruagach
          text: I will.
        - id: ch01-b29
          speaker: narrator
          text: Again they played, and once more the game swung from one to the other. Now the king appeared to be winning, and now the Gruagach. They played on until the contest was decided. Again the king had won.
        - id: ch01-b30
          speaker: gruagach
          text: Now, which prize will you have?
        - id: ch01-b31
          speaker: king
          text: The shaggy young horse with the stick saddle.
        - id: ch01-b32
          speaker: narrator
          text: The Gruagach said nothing when he heard the king's choice. His brow darkened as he went to the stable and led the horse outside. The creature's mane was rough and its coat was dull. The saddle looked like nothing more than a pair of sticks. The king cared for none of that. He swung his leg over the saddle and rode away like the wind.
        - id: ch01-b33
          speaker: narrator
          text: On the third morning, the king rose before dawn as usual. He had eaten and was preparing to leave when his wife stopped him.
        - id: ch01-b34
          speaker: queen
          text: I wish you would not play the Gruagach again. You have beaten him twice, but one day he will win. Then he will lay some trouble on you.
        - id: ch01-b35
          speaker: king
          text: Oh, I must have one more game. Only this one.
        - id: ch01-b36
          speaker: narrator
          text: He went back to the Gruagach's house. Joy filled the Gruagach when he saw the king coming, and this time they began without a word. Somehow the king's strength and skill had left him. The Gruagach soon won.
        - id: ch01-b37
          speaker: king
          text: Choose your prize, but do not be cruel. Do not ask me for something I cannot give.
        - id: ch01-b38
          speaker: gruagach
          text: Here is my prize. The crop-headed creature shall take your head and neck unless you bring me the Sword of Light from the house of the king of the oak windows.
        - id: ch01-b39
          speaker: king
          text: I will bring it to you.
        - id: ch01-b40
          speaker: narrator
          text: The young man spoke bravely. But once the Gruagach could no longer see him, he stopped pretending. His face grew dark, and his feet dragged as he walked home.
    - id: ch02
      title: The Sword of Light
      blocks:
        - id: ch02-b01
          speaker: queen
          text: You have brought nothing home tonight.
        - id: ch02-b02
          speaker: narrator
          text: The queen was waiting for him on the steps. She was so beautiful that the king had to smile when he saw her. Then he remembered what had happened, and his heart sank again.
        - id: ch02-b03
          speaker: queen
          text: What is wrong? Tell me your sorrow. I can share it with you, and perhaps I can help.
        - id: ch02-b04
          speaker: narrator
          text: The king told her everything while she stroked his hair.
        - id: ch02-b05
          speaker: queen
          text: There is no need to grieve. You have the best wife in Erin and the best horse in Erin. Do exactly as I tell you, and all will be well.
        - id: ch02-b06
          speaker: narrator
          text: The king let her comfort him. While he was still asleep the next morning, the queen dressed and prepared for his journey. She went first to the stable. There she fed and watered the shaggy brown horse, then saddled him. Most people thought the saddle was wood. They could not see the tiny sparks of gold and silver hidden in it. The queen fastened it lightly and led the horse to where the king waited before the house.
        - id: ch02-b07
          speaker: queen
          text: Good luck, and victory in every battle. I do not need to give you more instructions. Listen to the horse, and obey whatever he tells you.
        - id: ch02-b08
          speaker: narrator
          text: She kissed him before he mounted. The king climbed into the saddle, waved his hand, and began his journey. The brown horse went faster than the wind. Even the wild March wind raced after them and could not catch them. Mile after mile, the horse never stopped and never once looked behind. Deep in the darkness of night, they finally reached the castle of the king of the oak windows.
        - id: ch02-b09
          speaker: brown_horse
          text: Our journey ends here. The Sword of Light is in the king's own chamber. If you can take it without scrape or sound, that will be a good sign. The king is at supper now, so the room is empty. You will see a knob at the end of the sword. Grasp it and draw the blade very softly from its sheath. Go now. I will wait beneath the window.
        - id: ch02-b10
          speaker: narrator
          text: The young king crept quietly down the passage, stopping now and then to listen and make sure no one followed. At last he entered the king's chamber. The room was empty, just as the horse had promised. A strange white line of light showed him where the sword hung. He crossed the room on tiptoe, reached for the knob, and slowly began to draw the blade from its sheath.
        - id: ch02-b11
          speaker: narrator
          text: He scarcely dared breathe. One sound could bring everyone in the castle running. The sword slid quickly and silently through its sheath until only the point still touched. Then came a faint noise, like a knife's edge touching a silver plate. The king started so sharply that he nearly let go.
        - id: ch02-b12
          speaker: brown_horse
          text: Quick! Hurry!
        - id: ch02-b13
          speaker: narrator
          text: The king scrambled through the little window and leaped into the saddle.
        - id: ch02-b14
          speaker: brown_horse
          text: He heard that sound, and he will follow us. But we have a good start.
        - id: ch02-b15
          speaker: narrator
          text: Away they sped, on and on, until even the winds fell behind. At last the horse slowed.
        - id: ch02-b16
          speaker: brown_horse
          text: Look behind you. Who is following?
        - id: ch02-b17
          speaker: king
          text: A whole swarm of brown horses is racing after us.
        - id: ch02-b18
          speaker: brown_horse
          text: We can outrun those.
        - id: ch02-b19
          speaker: narrator
          text: The horse flew forward once more. After a time, he called to the king again.
        - id: ch02-b20
          speaker: brown_horse
          text: Look once more, O king. Who comes now?
        - id: ch02-b21
          speaker: king
          text: I see a swarm of black horses. One has a white face, and a man is riding him. It is the king of the oak windows.
        - id: ch02-b22
          speaker: brown_horse
          text: That white-faced horse is my brother, and he is faster than I am. He will rush past us. Have your sword ready. When his rider turns to look at you, cut off the man's head. No other sword in the world can do it.
        - id: ch02-b23
          speaker: king
          text: I will do as you say.
        - id: ch02-b24
          speaker: narrator
          text: The king listened with all his strength, trying to judge the distance by sound alone. When he knew the white-faced horse was close, he sat very straight and made ready. A roaring noise swept up behind him like a mighty storm. In the next instant, horse and rider rushed past. The king caught one glimpse of the rider's face turning back toward him, then struck almost blindly. He could not tell whether he had killed the man or only wounded him. But the head rolled free, and the brown horse caught it in his mouth.
        - id: ch02-b25
          speaker: brown_horse
          text: Jump onto my brother and ride home as fast as you can. I will follow as quickly as I am able.
        - id: ch02-b26
          speaker: narrator
          text: The king sprang forward and landed on the black horse, so near the tail that he nearly fell off again. He flung out an arm, caught wildly at the mane, and pulled himself forward into the saddle. Then the black horse carried him home at tremendous speed. Before the first red streaks crossed the sky, the king had reached his own house. The queen sat waiting for him, for sleep had stayed far from her eyes. She was glad when he entered, but said little. Instead she took her harp and softly sang the songs he loved until he went to bed soothed and happy.
    - id: ch03
      title: The Gruagach's Mole
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was broad daylight when the king woke. He leaped up at once.
        - id: ch03-b02
          speaker: king
          text: Now I must visit the Gruagach and learn whether his spell on me is broken.
        - id: ch03-b03
          speaker: queen
          text: Be careful. He will not greet you with his usual smile. He will come at you in a fury and demand to know whether you found the sword. Tell him you did. Then he will ask how you got it. Say that you could never have taken it without the knob. He will lift his head to inspect the knob. At that instant, stab the mole on the right side of his neck. Do not miss it. If the point fails to strike that mole, both you and I will die. The Gruagach is brother to the king of the oak windows. When he sees the sword in your hand, he will know that his brother must be dead.
        - id: ch03-b04
          speaker: narrator
          text: The queen made him repeat her instructions until he understood them. Then she kissed him and wished him good speed. Carrying the Sword of Light, the king returned to the same place where he and the Gruagach had played their three games. This time, just as the queen had warned, there was no friendly smile waiting for him.
        - id: ch03-b05
          speaker: gruagach
          text: Did you get the sword?
          emotion: angry
        - id: ch03-b06
          speaker: king
          text: I did.
        - id: ch03-b07
          speaker: gruagach
          text: How did you manage it?
        - id: ch03-b08
          speaker: king
          text: If the sword had not had a knob at the top, I could never have got it.
        - id: ch03-b09
          speaker: gruagach
          text: Give it here. I want to see.
        - id: ch03-b10
          speaker: narrator
          text: The Gruagach leaned forward. In a flash, the king swept the sword out from under his nose and drove its point into the mole. The Gruagach rolled dead upon the ground.
        - id: ch03-b11
          speaker: king
          text: At last I can live in peace.
        - id: ch03-b12
          speaker: narrator
          text: But he was mistaken. When he reached home, no wife or horses came to meet him. Instead, he found his servants tied together back to back. Cloths had been bound over their mouths so tightly that they could not speak. He hurried to loosen the ropes and pull away the cloths, then asked who had treated them in such an evil way.
        - id: ch03-b13
          speakers: [servant_1, servant_2]
          ensemble: duo
          text: The moment you left, a great giant came. He tied us as you found us, then carried away your wife and both your horses.
        - id: ch03-b14
          speaker: king
          text: Then I will not close my eyes or lay down my head until I bring my wife and my horses home.
        - id: ch03-b15
          speaker: narrator
          text: The king found the horses' tracks in the grass and followed them. By the time he reached a wood, darkness had fallen.
        - id: ch03-b16
          speaker: king
          text: I will sleep here, but first I must make a fire.
        - id: ch03-b17
          speaker: narrator
          text: He gathered fallen twigs, rubbed two dry sticks together, and kindled a flame. As the twigs cracked and the fire rose, a slim yellow dog pushed through the bushes. It laid its head on the king's knee, and the king stroked it.
        - id: ch03-b18
          speaker: yellow_dog
          text: Wuf, wuf! Your wife and horses were in a terrible state when the giant drove them through this forest last night.
        - id: ch03-b19
          speaker: king
          text: That is why I am here.
        - id: ch03-b20
          speaker: narrator
          text: Suddenly his courage failed. His face went white as he looked at the dog.
        - id: ch03-b21
          speaker: king
          text: I cannot fight that giant. I am afraid. Let me turn back for home.
          emotion: fearful
        - id: ch03-b22
          speaker: yellow_dog
          text: No, do not turn back. Eat, then sleep. I will keep watch over you.
        - id: ch03-b23
          speaker: narrator
          text: The king ate, lay down, and slept until the sun woke him.
        - id: ch03-b24
          speaker: yellow_dog
          text: It is time to go on. If danger comes close, call me and I will help you.
        - id: ch03-b25
          speaker: king
          text: Farewell. I will remember your promise.
        - id: ch03-b26
          speaker: narrator
          text: On he went, and on and on, until he reached a tall cliff where many sticks lay scattered on the ground. The day was almost gone. He decided to build a fire and rest there for the night. Again he gathered the sticks and kindled a flame. As the fire began to blaze, the hoary hawk of the grey rock flew down and settled on a branch above his head.
        - id: ch03-b27
          speaker: hoary_hawk
          text: Your wife and horses were in a terrible state when they passed this place with the giant.
        - id: ch03-b28
          speaker: king
          text: I will never find them. All this trouble will bring me nothing.
          emotion: sad
        - id: ch03-b29
          speaker: hoary_hawk
          text: Take heart. However bad things are, they can always be worse. Eat and sleep, and I will watch over you.
        - id: ch03-b30
          speaker: narrator
          text: The king did exactly as the hawk told him. He ate beside the fire, then lay down beneath the bird's branch and slept. All night the hoary hawk kept watch above him. When morning came, the king woke refreshed. The despair of the evening before had passed, and he felt brave enough to continue his search.
        - id: ch03-b31
          speaker: hoary_hawk
          text: Farewell. If danger comes close, call me and I will help you.
        - id: ch03-b32
          speaker: narrator
          text: The king walked on, and on and on, until dusk was falling. Then he came to a great river, with dry sticks scattered along its bank. He gathered them and made himself a third fire. After a while, a smooth brown head rose from the river and peered at him through the dusk. Then a long brown body followed it out of the water and onto the shore.
        - id: ch03-b33
          speaker: brown_otter
          text: Your wife and horses were in a terrible state when they crossed this river with the giant last night.
        - id: ch03-b34
          speaker: king
          text: I have searched and still not found them. I will gain nothing from all my trouble.
          emotion: sad
        - id: ch03-b35
          speaker: brown_otter
          text: Do not lose heart. Before noon tomorrow, you will see your wife. Eat and sleep now. I will watch over you.
        - id: ch03-b36
          speaker: narrator
          text: The king did as the otter told him. At sunrise he woke and saw the otter still lying on the bank.
        - id: ch03-b37
          speaker: brown_otter
          text: Farewell. If danger comes close, call me and I will help you.
        - id: ch03-b38
          speaker: narrator
          text: The otter slipped into the water, and the king continued on his way. He walked for hour after hour, leaving the river far behind. The land grew rougher as he went. At last the great split rock rose before him, and he knew he had reached the place the otter had promised he would find before noon.
    - id: ch04
      title: The Giant's Cavern
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After many hours, the king reached a high rock that a great earthquake had split in two. He threw himself down and looked over the edge. Far below, at the very bottom, he saw his wife and both horses. His heart leaped, and every fear left him.
        - id: ch04-b02
          speaker: narrator
          text: Yet he had to be patient. He could not climb straight down, for the walls of the split rock were smooth. Not even a goat could have found a place to set its feet. So the king rose and searched for another way. He went around through the wood, forcing his way between trees, scrambling across one rock after another, and wading through streams. At last the steep ground ended. He found himself on level earth, close beside the mouth of the cavern.
        - id: ch04-b03
          speaker: narrator
          text: His wife gave a shriek of joy the moment he entered the cavern. Then all at once she burst into tears. The giant had carried her far from home, and she had spent the whole time tired and badly frightened. Now the sight of her husband was almost more than she could bear. But the king did not understand why she wept when he had finally found her. He too was exhausted. The hard journey around the rocks had left him bruised, and weariness had made him a little cross.
        - id: ch04-b04
          speaker: king
          text: This is a poor welcome, when I have nearly killed myself trying to reach you.
        - id: ch04-b05
          speakers: [brown_horse, black_horse]
          ensemble: duo
          text: Pay no attention to him. Put him down safely in front of us, and give him food. He is exhausted.
        - id: ch04-b06
          speaker: narrator
          text: The queen followed the horses' advice. She settled the king safely on the ground in front of them and brought him food. He ate, then rested in the shelter of the cavern while his strength slowly returned. After a while, the light at the entrance changed. A long shadow stretched across the cave floor and crept toward them. Every heart began to beat with fear, for they knew the giant was coming home. The king hurried behind the horses and crouched low between their feet, where the giant would not see him.
        - id: ch04-b07
          speaker: giant
          text: I smell a stranger!
        - id: ch04-b08
          speaker: narrator
          text: The chasm was dark, and the giant could not see the king.
        - id: ch04-b09
          speaker: queen
          text: A stranger, my lord? No stranger ever comes here. Even the sun never enters this cave!
        - id: ch04-b10
          speaker: narrator
          text: The queen laughed brightly, walked up to the giant, and stroked the enormous hand hanging at his side.
        - id: ch04-b11
          speaker: giant
          text: Well, I cannot see anything. Still, it is very strange. Never mind. It is time to feed the horses.
        - id: ch04-b12
          speaker: narrator
          text: He lifted an armful of hay down from a shelf of rock and held a handful toward each horse. Both animals moved forward to meet him, leaving the hidden king behind them. The moment the giant's hands came close to their mouths, each horse made a snap and began to bite. The giant's groans and screams could have been heard a mile away. Then the horses wheeled around and kicked him, again and again, until they had no strength left to kick. At last the giant crawled away. He collapsed in a corner and lay there trembling while the queen went over to him.
        - id: ch04-b13
          speaker: queen
          text: You poor thing! They seem to have gone mad. It was dreadful to watch.
        - id: ch04-b14
          speaker: giant
          text: If my soul had been inside my body, they would surely have killed me.
        - id: ch04-b15
          speaker: queen
          text: Then it is very lucky your soul was elsewhere. But where is it? Tell me, so I can keep it safe for you.
        - id: ch04-b16
          speaker: giant
          text: It is up there in the Bonnach stone.
        - id: ch04-b17
          speaker: narrator
          text: He pointed to a stone balanced loosely on the edge of a rock.
        - id: ch04-b18
          speaker: giant
          text: Now leave me to sleep. I have a long way to go tomorrow.
        - id: ch04-b19
          speaker: narrator
          text: Soon snores came from the giant's corner. The queen lay down, and so did the horses, hiding the king between them where no one could see him.
        - id: ch04-b20
          speaker: narrator
          text: Before dawn, the giant rose and left. The queen ran straight to the Bonnach stone. She tugged and pushed until it sat firmly on its ledge and could not fall. It remained that way when the giant came home that evening. At the sight of his shadow, the king again crept down before the horses.
        - id: ch04-b21
          speaker: giant
          text: What have you done to the Bonnach stone?
        - id: ch04-b22
          speaker: queen
          text: I was afraid it might fall and break with your soul inside, so I pushed it farther back on the ledge.
        - id: ch04-b23
          speaker: giant
          text: My soul is not there. It is in the threshold. But now it is time to feed the horses.
        - id: ch04-b24
          speaker: narrator
          text: He brought them hay, and once again they bit and kicked him until he lay half dead on the ground.
        - id: ch04-b25
          speaker: narrator
          text: The next morning, the battered giant got to his feet and went out again. As soon as he disappeared, the queen hurried to the cavern entrance. She carefully washed all the stones in the threshold until they were clean. Moss grew in the cracks, and tiny flowers were hidden there too. She pulled the moss away and tended the little flowers, as though the whole place were precious to her. The day passed, and dusk had fallen by the time the giant's shadow announced his return.
        - id: ch04-b26
          speaker: giant
          text: You have been cleaning the threshold.
        - id: ch04-b27
          speaker: queen
          text: Was that not right, when your soul is kept there?
        - id: ch04-b28
          speaker: giant
          text: My soul is not in the threshold. Beneath it lies a stone. Under that stone is a sheep. Inside the sheep is a duck, inside the duck is an egg, and inside the egg is my soul. But it is late. I must feed the horses.
        - id: ch04-b29
          speaker: narrator
          text: The giant brought the hay. The horses bit and kicked him for the third time. If his soul had been in his body, they would have killed him then and there.
    - id: ch05
      title: The Soul in the Egg
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: It was still dark when the giant rose the following morning and went on his way. The king and queen did not wait for daylight. Together they ran to the entrance and began taking up the threshold while the two horses stood watching. Just as the giant had said, a heavy flagstone lay hidden underneath. The king and queen caught hold of its edges. They pulled, tugged, and strained against its weight until at last the stone shifted and gave way.
        - id: ch05-b02
          speaker: narrator
          text: The moment the flagstone came loose, something sprang out from beneath it. It moved so suddenly and rushed past them so fast that it nearly knocked both the king and queen to the ground. For an instant, neither could tell what had burst from the hiding place. Then the creature fled past them, and they saw it clearly. Just as the giant had said, it was a sheep, and it was already racing away.
        - id: ch05-b03
          speaker: king
          text: If only the slim yellow dog of the greenwood were here! He would soon catch that sheep.
        - id: ch05-b04
          speaker: narrator
          text: The moment he spoke, the slim yellow dog answered his call. It appeared from the forest with the struggling sheep held fast in its mouth. The dog brought the animal straight back to the king. With a single blow, the king killed the sheep. He and the queen quickly opened its body and searched inside. But before they could catch what was hidden there, a wild rush of wings struck past their faces and blinded them. The duck had escaped, and it flew swiftly away.
        - id: ch05-b05
          speaker: king
          text: If only the hoary hawk of the rock were here! He would soon catch that duck.
        - id: ch05-b06
          speaker: narrator
          text: As he spoke, the hoary hawk appeared above them with the duck in his mouth. The king swung his sword and cut off the duck's head. They took the egg from its body. But in his triumph, the king held it carelessly. It slipped from his fingers and rolled swiftly down the hill, straight into the river.
        - id: ch05-b07
          speaker: king
          text: If only the brown otter of the stream were here! He would soon bring back that egg.
        - id: ch05-b08
          speaker: narrator
          text: The next moment, the brown otter appeared, dripping wet, with the egg in his mouth. But a huge shadow was creeping beside him. It was the shadow of the giant.
        - id: ch05-b09
          speaker: narrator
          text: The king stood staring at the shadow as though he had turned to stone. He did not move as it came stealing closer. But the queen acted at once. She snatched the egg from the otter's mouth and crushed it between her two hands. At once the enormous shadow shrank. Then it stopped and lay perfectly still. The king and queen knew that the giant was dead, because they had found his soul and broken the egg that held it.
        - id: ch05-b10
          speaker: narrator
          text: The danger was over at last. The next day, the king and queen saddled the two faithful horses and mounted them for the journey home. They did not forget the friends who had guarded the king and answered him when he called. On the way, they visited the brown otter beside the stream, the hoary hawk at the grey rock, and the slim yellow dog in the greenwood. Then the king and queen rode on together toward their own house.
