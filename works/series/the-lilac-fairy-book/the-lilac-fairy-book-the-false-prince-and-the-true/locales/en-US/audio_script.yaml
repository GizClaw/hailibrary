  chapters:
    - id: ch01
      title: The Blow in the Tennis Court
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was summer, and the king had just woken from his midday sleep. In that hot country, everyone rose early and rested from twelve until three. Dressed in cool white clothes, he was crossing the hall on his way to the council chamber when several young nobles appeared. One of them stepped forward.
        - id: ch01-b02
          speaker: young_noble
          text: Sire, we were playing tennis this morning, with the prince and this gentleman among us. They quarreled over the game. The prince lost his temper and insulted his opponent again and again, until this gentleman struck him hard in the face. Blood ran from the prince's mouth and nose. We were so horrified that we might have killed the man on the spot for laying hands on the prince, but his grandfather, the duke, stopped us. He ordered us to bring the matter before you.
        - id: ch01-b03
          speaker: narrator
          text: The king listened closely to the whole account.
        - id: ch01-b04
          speaker: king
          text: I suppose the prince had no weapon with him. Otherwise, he would have used it.
        - id: ch01-b05
          speaker: young_noble
          text: He was armed, sire. He always carries a dagger in his belt. But when he saw the blood streaming down his face, he went into a corner of the court and began to cry. That was the strangest thing of all.
        - id: ch01-b06
          speaker: narrator
          text: The king went to the window and stood with his back to the room for several minutes. The young men waited without a word. When he turned around, his face was white and stern.
        - id: ch01-b07
          speaker: king
          text: I tell you solemnly, I would rather hear that the prince was dead, though he is my only son, than learn that he took such an injury without trying to avenge it. The gentleman who struck him will answer before my judges. He may plead his own cause, but after assaulting the heir to the crown, I hardly think he can escape death.
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: The accused young man lifted his head as though he meant to answer, but the king refused to hear him. He ordered the guards to arrest him. Still, the prisoner was allowed to visit any part of the city if the guards went with him. In fifteen days, he would be brought to trial before the highest judges in the land.
        - id: ch01-b09
          speaker: narrator
          text: Soldiers led the young man out of the king's presence. Many of his friends followed because he was a great favorite among them. During the next fourteen days, they urged him to go throughout the city and consult every kind of wise man. None could save him. No one could find an excuse for the blow he had given the prince.
    - id: ch02
      title: The Old Woman's Bargain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On the fourteenth night, the prisoner gave up hope and went for his last walk through the city. He wandered without knowing where he was going. His face looked so pale and desperate that none of his companions dared speak. After several hours, the little procession passed the gate of a monastery. An old woman came around a corner and stopped directly before him. She was bent nearly double, with so many wrinkles that she looked at least ninety years old. Only her eyes were as bright and quick as a girl's.
        - id: ch02-b02
          speaker: princess
          text: Sir, I know what has happened. I know you are searching for some way to save your life. No one but me can tell you how. I will do it, if you promise to do everything I ask.
        - id: ch02-b03
          speaker: narrator
          text: Her words seemed to roll a great weight from the prisoner's shoulders.
        - id: ch02-b04
          speaker: true_prince
          text: Oh, save me, and I'll do anything! It is so hard to leave this world and go out into the darkness.
        - id: ch02-b05
          speaker: princess
          text: You won't have to. You only need to marry me, and you will soon be free.
        - id: ch02-b06
          speaker: true_prince
          text: Marry you? But I'm not even twenty, and you must be at least a hundred! No, no, that is impossible.
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: He spoke before he had thought. Anger flashed in the old woman's eyes and made him uneasy, though her answer was brief.
        - id: ch02-b08
          speaker: princess
          text: As you wish. Since you refuse me, the crows may have you.
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: She hurried away down the street and left him there. Then the full horror of his approaching death swept over him. He understood that he had thrown away his only chance to live. If marriage was the price, then he must pay it. He raced after the old woman, though by then he could barely see her in the moonlight. Who would believe that a woman past ninety could move so fast? It looked more like flying than walking. At last he reached her side, breathless and exhausted.
        - id: ch02-b10
          speaker: true_prince
          text: Madam, forgive my hasty words. I was wrong, and I gratefully accept your offer.
        - id: ch02-b11
          speaker: princess
          text: Ah, I thought you would come to your senses. We have no time to waste. Follow me now.
        - id: ch02-b12
          speaker: narrator
          text: They went on swiftly and silently until they reached the small house where the priest lived. Before the priest, the old woman made the prisoner swear that she would be his wife. He took the oath in front of witnesses. Then she asked the priest and the guards to leave them alone for a while, and told the young man exactly what to do when he stood before the king and the judges the next morning.
    - id: ch03
      title: The True Heir
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The hall was so crowded that it overflowed when the prisoner entered. Everyone who saw him wondered why his face looked so bright on the morning of his trial. The king asked whether he had any defense against the high treason he had committed by striking the heir to the throne. If he had one, he must present it quickly. The young man bowed low before the king and judges, then answered in a clear voice.
        - id: ch03-b02
          speaker: true_prince
          text: My gracious king, and you nobles and wise men of this land, I place my cause in your hands without fear. I know you will listen, judge fairly, and let me finish before you give your decision.
        - id: ch03-b03
          speaker: true_prince
          text: You had been married to the queen for four years, sire, but you had no children, and this grieved you deeply. The queen saw your love fading from her, and day and night she searched for a way to end her trouble. While you were away fighting in distant lands, she secretly adopted a poor quarryman's baby. Then she sent word that you had a son. Only the priest who heard her confession knew the truth. A few weeks later, the queen fell ill and died, and the child was raised as a prince. Now, with your permission, I will speak about myself.
        - id: ch03-b04
          speaker: king
          text: What you have told me is so strange that I cannot imagine what else you have to reveal. Go on.
        - id: ch03-b05
          speaker: true_prince
          text: Soon after the queen died, you went hunting. While chasing a deer, you left all your attendants behind and came to a part of the country you did not know. You saw an orchard filled with pink and white apple blossoms. In one corner, a girl was tossing a ball. You rode over to ask the way, but when she turned toward you, her beauty drove everything else from your mind.
        - id: ch03-b06
          speaker: true_prince
          text: You returned to see her again and again, and at last you persuaded her to marry you. She believed you were only a poor knight. At your request, she agreed to keep the marriage secret. After the ceremony, you gave her three rings and a charm marked with a cross. Then you placed her in a cottage in the forest, where you thought the secret would be safe.
        - id: ch03-b07
          speaker: true_prince
          text: For several months, you visited the cottage every week. Then a rebellion in a distant part of the kingdom called you away. When you finally returned, the cottage was empty, and no one could tell you where your bride had gone. I can tell you now, sire.
        - id: ch03-b08
          speaker: narrator
          text: The young man paused and looked at the king, whose face had grown deeply red.
        - id: ch03-b09
          speaker: true_prince
          text: She went home to her father, the old duke who had once been your chamberlain. The cross on her breast told him at once who you were. When he heard his daughter's story, he was furious. He swore to hide her safely from you until you claimed her openly as your queen. In time, I was born. My grandfather raised me in one of his great houses. Here are the rings you gave my mother, and here is the cross. They will prove whether or not I am your son.
        - id: ch03-b10
          speaker: narrator
          text: As he spoke, the young man laid the rings and the cross at the king's feet. Nobles and judges crowded around to inspect every jewel, but the king stayed motionless on his seat. He had forgotten the hall of justice and all the people around him. He could see only the apple orchard as it had been twenty years before, with its pink and white blossoms and the beautiful girl playing with her ball. A sudden silence brought him back. He looked up and found every eye in the assembly fixed on him.
        - id: ch03-b11
          speaker: king
          text: It is true. This is my son, and the other is not. Let every man here swear that after my death, he will acknowledge this young man as king.
        - id: ch03-b12
          speaker: narrator
          text: One by one, they knelt before the true prince and took the oath. A message went to the false prince, ordering him never to appear at court again, though the king granted him a generous pension.
    - id: ch04
      title: A Promise Must Be Kept
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the ceremony ended, the king motioned for his newly found son to follow him into another room.
        - id: ch04-b02
          speaker: king
          text: Tell me how you learned all this.
        - id: ch04-b03
          speaker: narrator
          text: The king dropped into a carved chair filled with crimson cushions. The prince told him how he had met the old woman, and how she had brought him the rings and the cross from his mother. He explained that he had sworn before a priest to marry her because she had saved his life. Yet he did not want to do it. The difference in their ages was so great, and he would much rather accept a bride chosen for him by the king. His father listened, then frowned and answered sharply.
        - id: ch04-b04
          speaker: king
          text: You swore to marry her if she saved your life. Whatever happens, you must keep your promise.
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: The king struck a silver shield hanging nearby, and an equerry appeared at once.
        - id: ch04-b06
          speaker: king
          text: Find the priest who lives near the prison door. Ask him where the old woman who visited last night may be found. When you find her, bring her to the palace.
        - id: ch04-b07
          speaker: narrator
          text: It took some time to discover where the old woman lived, but at last the equerry brought her to the palace. She was received with all the royal honors due to the prince's bride. The guards exchanged astonished looks as the bent, wrinkled figure passed between their lines. They were even more amazed by the lightness of her step. She skipped up the palace stairs toward the great door, where the king stood waiting with the prince beside him.
        - id: ch04-b08
          speaker: narrator
          text: If the king and his son were shocked by the aged bride, neither showed it. With a solemn bow, the king took her hand and led her to the chapel. A bishop was waiting there, and the marriage ceremony was performed.
        - id: ch04-b09
          speaker: narrator
          text: During the following weeks, the prince was seldom seen at the palace. He spent every day hunting and trying to forget the old wife waiting at home. As for the princess, no one took any trouble over her. She passed her days alone in her apartments after firmly refusing the service of every lady-in-waiting the king had appointed for her.
        - id: ch04-b10
          speaker: narrator
          text: One night, the prince came home from an unusually long hunt. He was so tired that he went straight to bed. A strange noise woke him. Thinking a robber might have slipped inside, he leaped up and grabbed the sword beside him. Then he realized the sound came from the princess's room next door, where a torch was burning.
        - id: ch04-b11
          speaker: narrator
          text: The prince crept softly to the connecting door and peered into the torchlit room. The princess lay there quietly, wearing a crown of gold and pearls. Her bent back was gone, and not one wrinkle remained. Her face was whiter than snow and as fresh as the face of a girl of fourteen. He could hardly believe what he saw. Could that beautiful, beautiful creature really be his wife?
        - id: ch04-b12
          speaker: narrator
          text: As the prince stared in astonishment, the lady opened her eyes and smiled at him.
        - id: ch04-b13
          speaker: princess
          text: Yes, I truly am your wife. The enchantment has ended. Now I must tell you who I am and why I was made to look like an old woman.
    - id: ch05
      title: The Enchantment Ends
      blocks:
        - id: ch05-b01
          speaker: princess
          text: My father is the king of Granada, and I was born in the palace overlooking the plain of the Vega. When I was only a few months old, a wicked fairy who hated my parents put a spell on me. She bent my back and wrinkled my skin until I looked a hundred years old. Everyone found me so horrible that my father finally ordered my nurse to take me away from the palace. My nurse was the only person who cared for me. We lived together in this city on a small pension from the king.
        - id: ch05-b02
          speaker: princess
          text: When I was about three, an old man came to our house and begged my nurse to let him come inside and rest because he could walk no farther. She saw that he was very ill, so she put him to bed. She cared for him with such kindness that in time he became as strong as ever. To thank her for all she had done, he revealed that he was a wizard. He said he could grant anything she chose to ask for, except life or death.
        - id: ch05-b03
          speaker: princess
          text: More than anything in the world, my nurse wanted my wrinkled skin to disappear and the beauty I was born with to return. The wizard said that undoing another person's spell would be difficult, but he would do his best. He could promise one thing. Before my fifteenth birthday, I would be completely free of the enchantment if I found a man willing to swear that he would marry me just as I was.
        - id: ch05-b04
          speaker: princess
          text: You can imagine how hard that was. I looked so ugly that no one would glance at me a second time. My nurse and I were almost in despair. My fifteenth birthday was drawing near, and I had never so much as spoken to a man. At last, the wizard came to visit us again. He told us everything that had happened at court and described your danger. He instructed me to place myself in your way only after you had lost all hope. Then I was to offer to save your life if you would consent to marry me.
        - id: ch05-b05
          speaker: princess
          text: That is my whole history. Now you must ask the king to send messengers to Granada at once and tell my father about our marriage. I don't think he will refuse to bless us.
        - id: ch05-b06
          speaker: narrator
          text: And with that, the princess smiled.
