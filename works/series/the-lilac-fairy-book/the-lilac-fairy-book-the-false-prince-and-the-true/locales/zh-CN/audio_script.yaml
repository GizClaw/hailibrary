audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老民间故事，机敏处带克制的讥诮
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严冷峻，裁断时不容置疑，忆及往事时深沉克制
        timbre: 洪亮沉稳的成年男声
        pace: 适中偏慢
        pitch: 低
    young_noble:
      display_name: 年轻贵族
      tts:
        delivery: 恭敬谨慎，禀报时清楚郑重
        timbre: 清朗的年轻男声
        pace: 适中
        pitch: 中
    true_prince:
      display_name: 真王子
      tts:
        delivery: 年轻坦率，危急时焦灼，申辩时清晰坚定
        timbre: 明亮有力的年轻男声
        pace: 适中
        pitch: 中
    princess:
      display_name: 格拉纳达公主
      tts:
        delivery: 智慧果断，老妇形貌下声音古怪苍老，恢复真身后温柔从容
        timbre: 清澈而略带神秘感的年轻女声
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 一记耳光与一桩婚约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 盛夏的一天，国王刚睡完午觉。在炎热的地方，人们天一亮便起身做事，从正午歇到下午三点。国王换上一身凉爽的白衣，穿过大厅，准备去议事厅。忽然，一群年轻贵族挡在他面前，其中一个走上前来禀报。
        - id: ch01-b02
          speaker: young_noble
          text: “陛下，今早我们都在球场打网球。王子和这位先生也在。两人为球赛起了争执，王子发火了，对这位先生说了许多侮辱人的话。他忍无可忍，狠狠打了王子一记耳光，打得王子口鼻流血。我们吓坏了，险些当场杀死他。幸亏他的祖父公爵拦住大家，命我们把事情交给陛下裁断。”
        - id: ch01-b03
          speaker: narrator
          text: 国王一言不发地听完，随后问起王子当时有没有带兵器。
        - id: ch01-b04
          speaker: king
          text: “他若带了兵器，想必早就拔出来还击了吧？”
        - id: ch01-b05
          speaker: young_noble
          text: “陛下，他腰间一直佩着短剑。可他看见自己满脸是血，竟躲到球场角落里哭了起来。最奇怪的就是这件事。”
        - id: ch01-b06
          speaker: narrator
          text: 国王走到窗边，背朝众人站了好一会儿。满屋年轻人都不敢出声。等他转过身，脸色已经变得苍白而冷峻。
        - id: ch01-b07
          speaker: king
          text: “我说的是真心话。哪怕你们告诉我，王子已经死了，也好过让我知道，他受了这样的羞辱，却连报仇都不敢。他虽是我唯一的儿子，我也宁可听见他的死讯。至于打他的那个人，法官会听他亲自申辩。可他袭击了王位继承人，我看他很难保住性命。”
        - id: ch01-b08
          speaker: narrator
          text: 年轻人抬起头，刚要开口，国王却不给他机会，立刻命卫兵收押。不过，国王准他在卫兵看守下到城里任何地方去，并定在十五天后，由全国最高的法官审判他。
        - id: ch01-b09
          speaker: narrator
          text: 年轻人很得人心。离开王宫时，不但四周围着士兵，许多朋友也陪他一同走。接下来的十四天，他听从朋友劝告，拜访了各式各样的智者，只问一件事，怎样才能逃过死刑。可是，谁也找不出一个说得过去的理由，为他打王子的耳光开脱。
        - id: ch01-b10
          speaker: narrator
          text: 到了第十四夜，年轻人彻底绝望了。他在城里作最后一次漫步，走到哪里，连自己也不知道。他脸色惨白，神情绝望，同行的人都不敢同他说话。这支愁惨的小队伍走了几个钟头。来到一座修道院附近时，一名老妇忽然从街角转出，挡住去路。她身子干瘪，腰几乎弯成两折，满脸皱纹，看起来至少有九十岁。只有那双眼睛依旧明亮灵活，像少女一样。
        - id: ch01-b11
          speaker: princess
          text: “先生，你的遭遇我都知道。我也知道，你正在四处打听，怎样才能保住性命。世上只有我能回答这个问题，不过，你得先答应，无论我提出什么要求，你都会照办。”
        - id: ch01-b12
          speaker: narrator
          text: 年轻人听了，只觉得心头那块巨石忽然滚开了。
        - id: ch01-b13
          speaker: true_prince
          text: “请您救救我！只要能活下来，我什么都肯做。离开这个世界，独自走进黑暗，实在太可怕了。”
          emotion: fearful
        - id: ch01-b14
          speaker: princess
          text: “你不用走进黑暗。娶我为妻，你很快就能恢复自由。”
        - id: ch01-b15
          speaker: true_prince
          text: “娶您？可我还不到二十岁，您却……您至少有一百岁了！不，这怎么可能？”
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: 他想也没想，话便冲出了口。老妇眼中陡然闪过怒火，年轻人顿时有些不安。可她没有争辩，只冷冷丢下一句话。
        - id: ch01-b17
          speaker: princess
          text: “那就随你。既然你拒绝我，等着让乌鸦吃掉吧。”
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 老妇沿街匆匆离开。年轻人独自站着，忽然真切地感到了死亡的可怕。他终于明白，自己亲手扔掉了唯一的活命机会。他暗想，既然非这样不可，那就这样吧，随即飞奔着追了上去。借着月光，他也只能勉强看见老妇的身影。谁能想到，一个年过九十的老妇竟走得这样快，简直像在飞。年轻人追得气喘吁吁，终于赶到她身边。
        - id: ch01-b19
          speaker: true_prince
          text: “夫人，请原谅我刚才说的冒失话。我错了。您提出的条件，我愿意接受。”
        - id: ch01-b20
          speaker: princess
          text: “我早知道你会清醒过来。时间不多了，马上跟我走。”
        - id: ch01-b21
          speaker: narrator
          text: 她的声音听起来很古怪。两人飞快地走着，一路无话，最后停在神父居住的小屋门口。老妇要年轻人当着神父和见证人的面发誓，日后一定娶她，他照做了。随后，她请神父和卫兵暂时离开，把第二天到了国王和法官面前该说什么，一一告诉年轻人。
    - id: ch02
      title: 真王子的身世
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，审判大厅挤得水泄不通。犯人走进来时满面光彩，众人见了都很惊奇。国王问他，对于殴打王位继承人的叛国重罪，有没有话要辩解。如果有，就快说。年轻人深深鞠了一躬，声音清亮而镇定。
        - id: ch02-b02
          speaker: true_prince
          text: “仁慈的国王陛下，还有诸位贵族与贤达，我不怕把自己的命运交到你们手中。因为我相信，你们会耐心听完我的话，再公正地作出判决。”
        - id: ch02-b03
          speaker: true_prince
          text: “陛下，您同王后成婚四年，一直没有孩子，因此十分忧伤。王后看得出，您对她的情意也渐渐淡了，便日夜寻找办法，想结束这场不幸。后来，您到远方征战，她暗中收养了一个穷采石匠的婴儿，又派信使告诉您，说您有了儿子。除了听她忏悔的一位神父，谁也不知道真相。几星期后，王后病逝，那个婴儿就以王子的身份被抚养长大。接下来，请陛下准许我说说自己的身世。”
        - id: ch02-b04
          speaker: king
          text: “你刚才讲的事已经离奇得很，我实在想不出，后面还能有什么。不过，你继续说。”
        - id: ch02-b05
          speaker: true_prince
          text: “王后去世后不久，有一天，陛下外出狩猎。您追着一头鹿，把所有随从远远甩在身后，也来到了一片陌生的乡野。那里有一座果园，苹果花开得满园粉白。一个姑娘正在果园一角抛球玩，您便上前问路。可她一转过身，您看见她的美貌，其他事就全忘了。此后您一次又一次骑马去看她，最后说服她嫁给您。她只以为您是个贫穷的骑士，也答应照您的意思，把婚事保密。”
        - id: ch02-b06
          speaker: true_prince
          text: “婚礼以后，您送给她三枚戒指和一件带十字架的护身符，又把她安置在森林小屋里，以为这样就能藏住秘密。几个月里，您每星期都去看她。后来，远方爆发了叛乱，您不得不亲自前往。等您再来到小屋，屋里已经空了，谁也不知道您的新娘去了哪里。现在，我可以告诉您答案。”
        - id: ch02-b07
          speaker: narrator
          text: 年轻人停下来，望向国王。国王的脸一下子红了。
        - id: ch02-b08
          speaker: true_prince
          text: “她回到了父亲身边。她的父亲就是那位老公爵，曾做过您的宫廷侍从长。他看见女儿胸前的十字架，立刻认出了您的身份。听完女儿的经历，他勃然大怒，发誓要把她藏得好好的，除非有一天，您公开承认她是王后。后来，我出生了，由外祖父抚养，在他的一座大宅中长大。这是您送给母亲的三枚戒指，这是那枚十字架。它们能证明，我到底是不是您的儿子。”
        - id: ch02-b09
          speaker: narrator
          text: 年轻人把珠宝放到国王脚下。贵族和法官立刻围上去查验，只有国王一动不动。他早已忘了审判大厅，也忘了身边的人。眼前只剩二十年前那座开满苹果花的果园，还有那位抛球玩耍的美丽姑娘。四周突然静下来，国王抬起头，发现所有人都在望着他。
        - id: ch02-b10
          speaker: king
          text: “这一切都是真的。他才是我的儿子，另一个不是。所有在场的人都要发誓，等我死后，承认他为国王。”
        - id: ch02-b11
          speaker: narrator
          text: 众人一个接一个跪在年轻人面前，立下誓言。国王又派人给假王子送信，命他永远不得再到宫廷露面，但仍旧赐给他一笔优厚的年金。
        - id: ch02-b12
          speaker: narrator
          text: 仪式结束后，国王示意刚找回的儿子跟上，带他走进另一间屋子。国王坐进一张铺着深红软垫的雕花椅，要儿子告诉他，究竟怎样知道了这些秘密。
        - id: ch02-b13
          speaker: true_prince
          text: “昨夜，我遇见了一个老妇人。她从母亲那里替我带来了这些珠宝，也教我今天该怎样申辩。为了请她救我，我已经当着神父的面发誓娶她。可我们的年纪差得太远，我实在不愿履行婚约。我宁可请父王亲自替我挑选一位新娘。”
        - id: ch02-b14
          speaker: narrator
          text: 国王听完，立刻皱起眉头，严厉地看着儿子。
        - id: ch02-b15
          speaker: king
          text: “你发过誓，只要她救你，你就娶她。无论发生什么，你都必须信守诺言。”
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 国王敲响近旁悬挂的银盾，一名宫廷侍从立刻出现。
        - id: ch02-b17
          speaker: king
          text: “去找住在监狱门边的神父。问清昨夜拜访他的老妇住在哪里，找到以后，把她带到王宫来。”
    - id: ch03
      title: 王子的老新娘
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 人们找了好一阵，才打听到老妇的住处。她随宫廷侍从来到王宫时，大家按照王子新娘应得的礼节，以王室之仪迎接她。那个干瘪的老妇弯着腰，从卫兵队列之间走过。卫兵惊讶地互相看着，更让他们吃惊的是，她脚步轻盈，竟一路蹦跳着登上台阶。国王和王子都在宫门前等候。两人纵然被她苍老的模样惊了一下，脸上却没有流露出来。国王庄重地行礼，牵着她走进礼拜堂。主教已经在那里等着主持婚礼。
        - id: ch03-b02
          speaker: narrator
          text: 婚后的几个星期，大家很少看见王子。他整日外出打猎，只想忘掉家中的老妻。至于新王妃，谁也不关心她。国王派了侍女来服侍，她却全部谢绝，只独自待在房间里，一天又一天。
        - id: ch03-b03
          speaker: narrator
          text: 一天夜里，王子打猎比平时更久，回来时疲惫不堪，径直上楼睡了。后来，一阵怪声忽然把他惊醒。他以为有强盗潜入，立刻跳下床，抓起手边的宝剑。仔细一听，声音来自王妃的房间。隔壁燃着火把，亮堂堂的。王子轻轻走到门口，从门缝向里望去。
        - id: ch03-b04
          speaker: narrator
          text: 王妃安静地躺在那里，头上戴着镶珍珠的金冠。所有皱纹都消失了。她的肌肤比雪还白，面容娇嫩得像十四岁的少女。王子呆呆地看着，几乎无法相信，这个美丽得不可思议的人，竟然真是自己的妻子。
        - id: ch03-b05
          speaker: narrator
          text: 正在这时，少女睁开眼睛，朝他微微一笑。她像是已经看穿了王子的心思。
        - id: ch03-b06
          speaker: princess
          text: “是的，我的确是你的妻子。魔法已经解除了。现在，我要告诉你，我究竟是谁，又为什么会变成老妇人的模样。”
    - id: ch04
      title: 格拉纳达公主
      blocks:
        - id: ch04-b01
          speaker: princess
          text: “我的父亲是格拉纳达国王。我出生在那座俯瞰维加平原的王宫里。才几个月大时，一个憎恨我父母的恶仙女向我施下魔法。她压弯我的背，让我的皮肤布满皱纹，使我看起来像个百岁老人。人人见了都厌恶我，最后，父王命乳母把我带出王宫。世上只有乳母真正疼爱我。我们来到这座城里，靠父王给我的一小笔年金生活。”
        - id: ch04-b02
          speaker: princess
          text: “我大约三岁时，一个老人来到门前。他已经走不动了，请乳母让他进屋休息。乳母看出他病得很重，便扶他上床，细心照料，直到他恢复强健。老人为了报答她，坦白说自己是一位巫师。除了生与死，无论乳母想要什么，他都能赐予。”
        - id: ch04-b03
          speaker: princess
          text: “乳母最盼望的，就是让我身上的皱纹消失，恢复出生时的美貌。巫师说，我的不幸来自魔法，要解除它十分困难，不过他会尽力。他至少可以保证，只要在十五岁生日前，有一个男人肯发誓娶下我当时的模样，我就会恢复原貌。”
        - id: ch04-b04
          speaker: princess
          text: “你当然猜得到，这件事有多难。我那时丑得没人愿意看第二眼。十五岁生日越来越近，我甚至还没同一个男人说过话，乳母和我几乎绝望了。后来，巫师再次来访，把宫里的事情和你的遭遇告诉我们。他叫我等到你失去全部希望时，出现在你面前，提出救你一命，条件就是你答应娶我。”
        - id: ch04-b05
          speaker: princess
          text: “这便是我的全部身世。现在，请你让国王马上派使者去格拉纳达，把我们的婚事告诉父王。我想，他不会拒绝祝福我们。”
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: 这个故事，是根据一则葡萄牙故事改编的。
