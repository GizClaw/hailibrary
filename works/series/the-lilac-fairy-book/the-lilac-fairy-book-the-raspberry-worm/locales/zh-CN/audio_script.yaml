audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    lisa:
      display_name: 丽莎
      tts:
        delivery: 心地善良，活泼大胆，话语直率
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 中高
    aina:
      display_name: 艾娜
      tts:
        delivery: 细心敏感，惊奇时真挚自然
        timbre: 柔和的女孩声
        pace: 适中
        pitch: 中高
    big_sister:
      display_name: 姐姐
      tts:
        delivery: 稳重能干，叮嘱妹妹时亲切利落
        timbre: 温和清晰的年轻女声
        pace: 适中
        pitch: 中
    otto:
      display_name: 奥托
      tts:
        delivery: 淘气爱逗人，笑话别人时顽皮爽快
        timbre: 明亮的男孩声
        pace: 偏快
        pitch: 中
    raspberry_king:
      display_name: 覆盆子王
      tts:
        delivery: 慈祥庄重，讲述身世时从容，玩笑中带着机智
        timbre: 温厚而略显苍老的男声
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 一条小虫
      blocks:
        - id: ch01-b01
          speaker: lisa
          text: “呸，真叫人恶心！”
          emotion: disgusted
        - id: ch01-b02
          speaker: aina
          text: “呀，真叫人难受！”
          emotion: disgusted
        - id: ch01-b03
          speaker: big_sister
          text: “这回又出什么事了？”
        - id: ch01-b04
          speaker: lisa
          text: “有条虫子！”
          emotion: surprised
        - id: ch01-b05
          speaker: aina
          text: “就在覆盆子上！”
          emotion: surprised
        - id: ch01-b06
          speaker: otto
          text: “踩死它呀！”
        - id: ch01-b07
          speaker: big_sister
          text: “不过是一条可怜的小虫，你们也闹成这样。”
        - id: ch01-b08
          speaker: lisa
          text: “可是，那些覆盆子我们洗得很仔细呀。”
        - id: ch01-b09
          speaker: aina
          text: “它偏偏从那颗最大的里面爬出来了。”
        - id: ch01-b10
          speaker: lisa
          text: “万一有人已经把那颗果子吃了呢？”
        - id: ch01-b11
          speaker: aina
          text: “那个人不就连虫子也吞下去了吗？”
        - id: ch01-b12
          speaker: otto
          text: “吞下去又怎么了？”
        - id: ch01-b13
          speaker: lisa
          text: “那可是吃虫子呀！”
          emotion: disgusted
        - id: ch01-b14
          speaker: aina
          text: “一口下去，还会把它咬死呢。”
        - id: ch01-b15
          speaker: otto
          text: “你们倒是好好想想，多有意思！”
          emotion: happy
        - id: ch01-b16
          speaker: aina
          text: “快看，它爬到桌面上了！”
          emotion: surprised
        - id: ch01-b17
          speaker: big_sister
          text: “吹到一边去吧。”
        - id: ch01-b18
          speaker: otto
          text: “还是一脚踩扁省事！”
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 丽莎却摘下一片覆盆子叶，轻轻把小虫扫到叶面上，再托着它走到院子里。艾娜看见篱笆上有只麻雀，眼看就要扑下来吃虫子，赶紧接过叶片，把它送进树林，藏到一丛覆盆子底下。馋嘴的麻雀再也找不到它了。
        - id: ch01-b20
          speaker: narrator
          text: 一条小小的覆盆子虫，还有什么故事好讲呢？这样不起眼的东西，谁会拿三根稻草去换？不过，它的家可真叫人羡慕。那是一间清香、新鲜的深红色小屋，远远躲在安静的树林里，鲜花和绿叶围在四周。
        - id: ch01-b21
          speaker: narrator
          text: 午饭时间到了，大家吃的是覆盆子拌奶油。
        - id: ch01-b22
          speaker: big_sister
          text: “奥托，糖可别放得太多。”
        - id: ch01-b23
          speaker: narrator
          text: 可奥托哪里肯听。他盘子里的糖堆得像冬日里高高的雪堆，白茫茫一片，底下只露出一点点覆盆子的红色。
        - id: ch01-b24
          speaker: big_sister
          text: “覆盆子已经全吃完了，冬天的果酱还没做呢。要是能采回两篮子，晚上把果子洗好，明天放进大锅里熬，我们就有覆盆子果酱抹面包了。”
        - id: ch01-b25
          speaker: lisa
          text: “那就去树林里采吧！”
        - id: ch01-b26
          speaker: aina
          text: “好呀。你拿黄篮子，我拿绿篮子。”
        - id: ch01-b27
          speaker: big_sister
          text: “别走迷了路，天黑前要平安回来。”
        - id: ch01-b28
          speaker: otto
          text: “见到覆盆子虫，替我问声好。下次碰上它，我可要赏脸把它吃了。”

    - id: ch02
      title: 覆盆子林里迷了路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 艾娜和丽莎提着篮子出了门。树林又美又有趣。她们一会儿翻过倒下的树干，一会儿被树枝勾住，还得跟刺柏丛和成群的小飞虫交战。这些麻烦又算得了什么呢？两个姑娘穿着短裙，手脚很灵便，没多久就走到了树林深处。
        - id: ch02-b02
          speaker: narrator
          text: 林中有许多越橘和接骨木果，覆盆子却一颗也不见。她们走了又走，忽然来到一大片果林。简直让人不敢相信。这里从前被一场大火烧过，如今覆盆子丛一片接着一片，一直铺到目光尽头。每一丛都挂满又大又熟的深红果实，沉甸甸地压到了地上。两个小采果人从没见过这么丰盛的收获。
        - id: ch02-b03
          speaker: narrator
          text: 丽莎采一阵，艾娜也采一阵。丽莎吃几颗，艾娜也吃几颗。很快，两只篮子全满了。
        - id: ch02-b04
          speaker: aina
          text: “够啦，我们回家吧。”
        - id: ch02-b05
          speaker: lisa
          text: “再采一点点嘛。”
        - id: ch02-b06
          speaker: narrator
          text: 她们把篮子搁到地上，改用围裙兜果子。没过多久，两条围裙也塞满了。
        - id: ch02-b07
          speaker: lisa
          text: “这回真的该走了。”
        - id: ch02-b08
          speaker: aina
          text: “嗯，现在就回去。”
        - id: ch02-b09
          speaker: narrator
          text: 每个姑娘一手提篮子，一手兜着围裙，转身要回家。可她们从没走进大森林这么远，周围既没有路，也没有小径。没多久，两人就知道自己迷路了。
        - id: ch02-b10
          speaker: narrator
          text: 夕阳照着林子，树影越拉越长。鸟儿陆续飞回巢里，白天就要过去了。太阳终于沉到松树梢后面，整片森林又凉又暗。
        - id: ch02-b11
          speaker: narrator
          text: 两个姑娘怕了，脚下却没有停。她们盼着很快走出树林，看见自家烟囱冒出的烟。可是走了很久，天越来越黑。最后，她们来到一片长满灌木的空地。借着最后一点光，她们认了出来。这里正是刚才采满篮子和围裙的覆盆子林。她们绕了一大圈，又回到了原地。
        - id: ch02-b12
          speaker: narrator
          text: 她们累得再也走不动，坐到一块石头上哭了起来。
        - id: ch02-b13
          speaker: lisa
          text: “我饿得难受。”
        - id: ch02-b14
          speaker: aina
          text: “要是现在有两块好吃的肉三明治，该多好呀。”
        - id: ch02-b15
          speaker: narrator
          text: 艾娜话音刚落，就觉得手里突然多了东西。她低头一看，竟是一大块夹着鸡肉的面包三明治。
        - id: ch02-b16
          speaker: lisa
          text: “太奇怪了，我手上也变出了一块三明治！”
          emotion: surprised
        - id: ch02-b17
          speaker: aina
          text: “我也有。你敢不敢吃？”
        - id: ch02-b18
          speaker: lisa
          text: “当然敢。现在要是还有满满一杯牛奶就更好了！”
        - id: ch02-b19
          speaker: narrator
          text: 话才出口，丽莎的手指间就出现了一大杯牛奶。
        - id: ch02-b20
          speaker: aina
          text: “丽莎，丽莎！我手上也有一杯！这到底是怎么回事？”
          emotion: surprised
        - id: ch02-b21
          speaker: narrator
          text: 两个姑娘实在太饿，顾不得多想，香甜地吃完三明治，又喝光牛奶。艾娜吃饱了，打个哈欠，伸开双臂。
        - id: ch02-b22
          speaker: aina
          text: “现在要是有张又软又舒服的床，让我们睡一觉就好了。”
        - id: ch02-b23
          speaker: narrator
          text: 她身边立刻出现一张又软又舒服的小床，丽莎身旁也有一张。怪事一件接着一件，她们心里越发惊奇。可两个姑娘实在太累，困得睁不开眼，也就不再追究。两人钻进各自的小床，把被子一直拉过头顶，很快睡着了。

    - id: ch03
      title: 神奇的早餐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 再睁开眼时，太阳已经升得老高。夏天早晨的树林清新美丽，鸟儿在枝叶和树梢间飞来飞去。姑娘们这才吃惊地发现，昨夜真的睡在覆盆子丛中。她们互相看了看，又低头看床。小床是上等亚麻做的，上面盖满树叶和苔藓。
        - id: ch03-b02
          speaker: lisa
          text: “艾娜，你醒着吗？”
        - id: ch03-b03
          speaker: aina
          text: “我已经醒了。”
        - id: ch03-b04
          speaker: lisa
          text: “可我一定还在梦里。”
        - id: ch03-b05
          speaker: aina
          text: “不是做梦。这片覆盆子林里准住着一位好心的仙人。要是现在能有热咖啡，再来一块新鲜白面包蘸着吃，那就太好了。”
        - id: ch03-b06
          speaker: narrator
          text: 艾娜还没说完，身旁就多了一只小银盘。盘里放着鎏金咖啡壶、两只名贵瓷杯、一只精巧的水晶糖罐和一把银糖夹，还有新鲜的白面包。姑娘们把热咖啡倒进杯里，添上奶油，再用银夹放进糖，端起来尝了尝。她们这一辈子，从没喝过这么香的咖啡。
        - id: ch03-b07
          speaker: lisa
          text: “这些东西到底是谁送来的？我真想当面谢谢他。”
        - id: ch03-b08
          speaker: raspberry_king
          text: “是我送的，我的小姑娘们。”
        - id: ch03-b09
          speaker: narrator
          text: 声音从灌木里传来。孩子们转头一看，一位慈祥的小老头正从枝叶间走出来。他穿白外套，戴红帽子，左脚跛了，走路一瘸一拐。丽莎和艾娜惊讶得说不出话。
        - id: ch03-b10
          speaker: raspberry_king
          text: “小姑娘们，不用害怕。欢迎你们来到我的王国。昨晚睡得好吗？三明治吃得好吗？牛奶喝得也好吗？”
        - id: ch03-b11
          speaker: narrator
          text: 老头亲切地笑着，可他的嘴是歪的，没法好好笑出来。
        - id: ch03-b12
          speakers: [lisa, aina]
          ensemble: duo
          text: “都很好，真的很好。可是，您能不能告诉我们……”
        - id: ch03-b13
          speaker: narrator
          text: 她们想问老头是谁，又有点不敢开口。

    - id: ch04
      title: 覆盆子王的秘密
      blocks:
        - id: ch04-b01
          speaker: raspberry_king
          text: “我自己告诉你们吧。我是覆盆子王，这整片覆盆子王国都归我统治。我已经在这里活了一千多年。”
        - id: ch04-b02
          speaker: raspberry_king
          text: “可是，掌管森林、大海和天空的伟大神灵，不肯让我仗着王权和长寿变得骄傲。他规定，每过一百年，我就要有一天变成小小的覆盆子虫。从太阳升起到太阳落下，我只能用那副弱小无助的身子活着。”
        - id: ch04-b03
          speaker: raspberry_king
          text: “那一天，我的命就是小虫的命。鸟儿能吃了我，孩子能把我连果子一起摘走，也能一脚踩掉我这活了一千年的性命。昨天正好轮到我变身。我跟覆盆子一起被摘回去，要不是你们搭救，早就叫人踩死了。”
        - id: ch04-b04
          speaker: raspberry_king
          text: “我在草地上动弹不得，一直等到日落。你们把我从桌上扫出去时，我扭伤了脚。那时吓得太厉害，连嘴也歪了。天黑以后，我才恢复原样，立刻去找你们，想向你们道谢，也给你们一份回报。”
        - id: ch04-b05
          speaker: raspberry_king
          text: “没想到，你们两个已经来到我的国土。我便照自己能想到的办法款待你们，同时又处处小心，不敢突然现身把你们吓着。现在，我会从林中派一只鸟，让它领你们走上回家的路。再见了，小姑娘们。谢谢你们有一副善良的心。覆盆子王绝不会忘恩负义。”
        - id: ch04-b06
          speaker: narrator
          text: 孩子们同老头握手，也向他道谢。一想到自己救下了那条覆盆子虫，她们心里十分高兴。两个姑娘正要走，老头忽然回过身，歪着嘴露出顽皮的笑。
        - id: ch04-b07
          speaker: raspberry_king
          text: “替我向奥托问好。再见到他，我也要赏脸把他吃掉。”
        - id: ch04-b08
          speakers: [lisa, aina]
          ensemble: duo
          text: “请您千万别吃他！”
          emotion: fearful
        - id: ch04-b09
          speaker: raspberry_king
          text: “好吧，看在你们的份上，我饶了他。我不是个记仇的人。也请你们告诉奥托，他同样有一件礼物等着。再见。”

    - id: ch05
      title: 覆盆子王的礼物
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 两个姑娘放下心来，提起果子，跟着那只鸟跑过树林。周围很快亮堂起来，回家的路又平又清楚。她们简直想不明白，昨天怎么会在这里迷路。
        - id: ch05-b02
          speaker: narrator
          text: 等她们回到家，大家不知有多欢喜。所有人都找了她们一夜。姐姐也一夜没合眼，以为两个妹妹已经被狼吃掉了。
        - id: ch05-b03
          speaker: narrator
          text: 奥托迎了出来，手上提着一只篮子。
        - id: ch05-b04
          speaker: otto
          text: “你们快来看。有个老头刚送来这些东西，说是留给你们的。”
        - id: ch05-b05
          speaker: narrator
          text: 姑娘们朝篮子里一望，只见一对深红色宝石手镯躺在里面。手镯做成熟透的覆盆子形状，美丽极了，上面刻着“赠丽莎和艾娜”。旁边还有一枚覆盆子虫形状的钻石胸针，上面刻着“奥托，永远不要伤害弱小无助的生命”。
        - id: ch05-b06
          speaker: narrator
          text: 奥托看懂了这句话，脸上有点过意不去。不过，他觉得老头用这样的办法报复，实在很高尚。
        - id: ch05-b07
          speaker: narrator
          text: 覆盆子王也记着姐姐。她进屋摆饭桌时，发现了十一大篮极美的覆盆子。谁也不知道果子是怎么来的，可谁都猜得到。
        - id: ch05-b08
          speaker: narrator
          text: 于是，家里熬起了从来没人见过的那么多覆盆子果酱。你要是愿意去搭把手，说不定也能分到一点。因为直到今天，他们多半还在那里熬果酱呢。
