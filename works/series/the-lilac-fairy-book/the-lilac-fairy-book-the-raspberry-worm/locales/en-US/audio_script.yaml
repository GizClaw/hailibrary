  chapters:
    - id: ch01
      title: The Little Worm
      blocks:
        - id: ch01-b01
          speaker: lisa
          text: Phew!
        - id: ch01-b02
          speaker: aina
          text: Ugh!
        - id: ch01-b03
          speaker: big_sister
          text: What is it now?
        - id: ch01-b04
          speaker: lisa
          text: There's a worm!
        - id: ch01-b05
          speaker: aina
          text: It was on the raspberry!
        - id: ch01-b06
          speaker: otto
          text: Kill it!
        - id: ch01-b07
          speaker: big_sister
          text: All this fuss over one poor little worm!
        - id: ch01-b08
          speaker: lisa
          text: But we cleaned those raspberries so carefully.
        - id: ch01-b09
          speaker: aina
          text: It crawled right out of that very big one.
        - id: ch01-b10
          speaker: lisa
          text: What if someone had eaten that raspberry?
        - id: ch01-b11
          speaker: aina
          text: They would have swallowed the worm too.
        - id: ch01-b12
          speaker: otto
          text: So what?
        - id: ch01-b13
          speaker: lisa
          text: Eat a worm?
        - id: ch01-b14
          speaker: aina
          text: And kill it with a single bite!
        - id: ch01-b15
          speaker: otto
          text: Just imagine that!
        - id: ch01-b16
          speaker: aina
          text: Now it's crawling across the table!
        - id: ch01-b17
          speaker: big_sister
          text: Then blow it away.
        - id: ch01-b18
          speaker: otto
          text: Step on it!
        - id: ch01-b19
          speaker: narrator
          text: Lisa would not do that. She gently swept the worm onto a raspberry leaf and carried it into the yard. There, Aina spotted a sparrow on the fence, ready to swoop down on the helpless creature. She picked up the leaf and took it all the way to the wood. Beneath a raspberry bush, she hid the worm where the greedy sparrow could not find it.
        - id: ch01-b20
          speaker: narrator
          text: And really, what else can anyone say about a raspberry worm? Who would care three straws for such a wretched little thing? Still, wouldn't you like a home as pretty as its own? It lives inside a fresh, sweet-smelling cottage of deepest red, far off in the quiet wood among flowers and green leaves.
    - id: ch02
      title: Two Baskets of Raspberries
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: By then it was dinnertime, and everyone ate raspberries with cream.
        - id: ch02-b02
          speaker: big_sister
          text: Go easy on the sugar, Otto.
        - id: ch02-b03
          speaker: narrator
          text: But Otto's plate looked like a snowdrift in winter, with only a little patch of red beneath all that white.
        - id: ch02-b04
          speaker: big_sister
          text: Now we've eaten every raspberry. There won't be any left to preserve for winter. If we could gather two full baskets, we could clean them tonight and cook them tomorrow in the big preserving pan. Then we'd have raspberry jam for our bread.
        - id: ch02-b05
          speaker: lisa
          text: Come on. Let's pick some in the wood.
        - id: ch02-b06
          speaker: aina
          text: Yes, let's go. You take the yellow basket, and I'll take the green one.
        - id: ch02-b07
          speaker: big_sister
          text: Don't lose your way, and be sure you're home safely this evening.
        - id: ch02-b08
          speaker: otto
          text: Give my regards to the raspberry worm. Next time we meet, I'll honor him by eating him up.
        - id: ch02-b09
          speaker: narrator
          text: Aina and Lisa set off for the wood. Ah, how lovely it was there! Of course, climbing over fallen trees could be tiring. Branches caught their clothes, juniper bushes fought them at every step, and midges buzzed around them. None of it mattered. In their short dresses, the girls climbed easily and soon went deep among the trees.
        - id: ch02-b10
          speaker: narrator
          text: They found plenty of bilberries and elderberries, but not one raspberry. They wandered farther and farther. At last they came upon something that hardly seemed possible. Before them lay a vast raspberry wood. Fire had once swept through that part of the forest, and raspberry bushes had sprung up in its place. Now there were raspberry bushes upon raspberry bushes, stretching as far as they could see. Every one bent to the ground beneath huge, dark-red, ripe berries. Never had two little berry pickers found such riches.
        - id: ch02-b11
          speaker: narrator
          text: Lisa picked, and Aina picked. Lisa ate, and Aina ate. Before long, both baskets were full.
        - id: ch02-b12
          speaker: aina
          text: We should go home now.
        - id: ch02-b13
          speaker: lisa
          text: No, let's gather just a few more.
        - id: ch02-b14
          speaker: narrator
          text: They set down the baskets and filled their pinafores instead. Soon those were full too.
        - id: ch02-b15
          speaker: lisa
          text: Now we really should go home.
        - id: ch02-b16
          speaker: aina
          text: Yes. Home we go.
        - id: ch02-b17
          speaker: narrator
          text: Each girl carried a basket in one hand and held up her loaded apron with the other. Then they turned toward home. But that was easier said than done. They had never gone so far into the great wood before. They looked one way and then another, but no road appeared, and there was no path to follow. Soon they knew they were lost.
    - id: ch03
      title: A Night in the Wood
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Evening was closing in. In the last sunlight, the shadows of the trees reached farther and farther across the ground. The birds began flying home for the night. Then the sun slipped behind the tops of the pines. The great wood grew cool and dim.
        - id: ch03-b02
          speaker: narrator
          text: The girls were worried, but they kept walking steadily. Surely the trees would end soon, they thought. Then they would see smoke rising from the chimneys at home. Instead, darkness began to fall. After wandering for a long time, they reached a broad clearing covered in bushes. They peered through the dusk and discovered they had returned to the very same beautiful raspberry patch where they had filled their baskets and aprons. The girls were so weary that they sat on a stone and cried.
        - id: ch03-b03
          speaker: lisa
          text: I'm so hungry.
        - id: ch03-b04
          speaker: aina
          text: If only we had two good meat sandwiches.
        - id: ch03-b05
          speaker: narrator
          text: The moment she said it, Aina felt something in her hand. She looked down and found a large chicken sandwich. At the same instant, Lisa stared at her own hand.
        - id: ch03-b06
          speaker: lisa
          text: How strange! There's a sandwich in my hand too.
        - id: ch03-b07
          speaker: aina
          text: So there is. Do you dare eat yours?
        - id: ch03-b08
          speaker: lisa
          text: Of course I do. If only we had a nice glass of milk as well.
        - id: ch03-b09
          speaker: narrator
          text: At once, Lisa felt a large glass of milk between her fingers.
        - id: ch03-b10
          speaker: aina
          text: Lisa! Lisa! I'm holding a glass of milk! Isn't that strange?
        - id: ch03-b11
          speaker: narrator
          text: Strange or not, they were hungry. They ate every bite and drank all the milk. When they had finished, Aina yawned and stretched out her arms.
        - id: ch03-b12
          speaker: aina
          text: Oh, if only we had nice soft beds to sleep in.
        - id: ch03-b13
          speaker: narrator
          text: She had barely spoken when she felt a soft little bed beside her, and another stood beside Lisa. Each new wonder amazed them more than the last. Yet they were tired and sleepy, so they stopped trying to understand. They climbed into the little beds, pulled the coverlets over their heads, and quickly fell asleep.
    - id: ch04
      title: The Raspberry King
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When they woke, the sun was already high in the sky. The wood was beautiful in the summer morning, and birds darted through the branches and treetops. At first, the girls could only wonder at finding themselves asleep among the raspberry bushes. They looked at each other and then at their beds. The beds were made of the finest flax and covered with leaves and moss.
        - id: ch04-b02
          speaker: lisa
          text: Aina, are you awake?
        - id: ch04-b03
          speaker: aina
          text: Yes, I am.
        - id: ch04-b04
          speaker: lisa
          text: Then I must still be dreaming.
        - id: ch04-b05
          speaker: aina
          text: No, you aren't. There must be a good fairy somewhere among these raspberry bushes. Oh, if only we had hot coffee and a nice piece of white bread to dip in it.
        - id: ch04-b06
          speaker: narrator
          text: Before Aina finished speaking, she saw a little silver tray beside her. On it stood a gilded coffee pot, two cups of rare porcelain, a sugar bowl made of fine crystal, silver sugar tongs, and good fresh white bread. The girls poured out the coffee, added cream and sugar, and tasted it. Never in their lives had they drunk coffee so delicious.
        - id: ch04-b07
          speaker: lisa
          text: I wish I knew who gave us all of this.
        - id: ch04-b08
          speaker: raspberry_king
          text: I did, my little girls.
        - id: ch04-b09
          speaker: narrator
          text: The voice came from the bushes. The children turned in wonder and saw a kind-looking little old man limping toward them. He wore a white coat and a red cap, and his left foot was lame. Lisa and Aina were so astonished that neither of them could say a word.
        - id: ch04-b10
          speaker: raspberry_king
          text: Don't be frightened, little girls. Welcome to my kingdom. Did you sleep well? Have you had enough to eat and drink?
        - id: ch04-b11
          speaker: narrator
          text: He smiled kindly, though his crooked mouth kept him from laughing properly.
        - id: ch04-b12
          speakers: [lisa, aina]
          ensemble: duo
          text: Oh yes, we have. But please tell us...
        - id: ch04-b13
          speaker: narrator
          text: They wanted to ask who he was, but neither girl quite dared.
        - id: ch04-b14
          speaker: raspberry_king
          text: I will tell you who I am. I am the raspberry king, and I reign over this whole kingdom of raspberry bushes. I have lived here for more than a thousand years. But the great spirit who rules the woods, the sea, and the sky did not want royal power and long life to make me proud. So the spirit decreed that once in every hundred years, I must become a tiny raspberry worm. From sunrise until sunset, I live in that weak and helpless shape.
        - id: ch04-b15
          speaker: raspberry_king
          text: During those hours, my life depends on the worm's life. A bird can eat me. A child can pick me with the berries and trample my thousand years of life under one foot. Yesterday was the day of my transformation. I was carried away with a raspberry, and I would have been crushed to death if you had not saved my life.
        - id: ch04-b16
          speaker: raspberry_king
          text: I lay helpless in the grass until sunset. When I was swept away from your table, I twisted one of my feet, and terror made my mouth crooked. But evening came, and I could take my own shape again. I went looking for you because I wanted to thank you and give you a reward. Then I found both of you here in my kingdom. I welcomed you as well as I could without frightening you.
        - id: ch04-b17
          speaker: raspberry_king
          text: Now one of my birds will lead you home. Goodbye, little children, and thank you for your kind hearts. The raspberry king knows how to repay a kindness.
        - id: ch04-b18
          speaker: narrator
          text: The children shook hands with the old man and thanked him. They felt very glad that they had saved the life of the little raspberry worm. Just as they were about to leave, the old man turned around. A mischievous smile twisted his crooked mouth.
        - id: ch04-b19
          speaker: raspberry_king
          text: Give Otto my regards. Tell him that the next time I meet him, I shall honor him by eating him up.
        - id: ch04-b20
          speakers: [lisa, aina]
          ensemble: duo
          text: Oh, please don't do that!
          emotion: fearful
        - id: ch04-b21
          speaker: raspberry_king
          text: For your sake, I will forgive him. I don't hold grudges. Give him my regards, and tell him he can expect a gift from me too. Goodbye.
    - id: ch05
      title: Gifts from the Raspberry King
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Lighthearted now, the girls picked up their baskets and the berries in their aprons, then hurried through the wood after the bird. Before long, the trees around them began to grow brighter. The way looked so easy and plain that they could not understand how they had lost it the day before.
        - id: ch05-b02
          speaker: narrator
          text: You can imagine the joy when the two girls finally reached home. Everyone had been out looking for them. Big Sister had not been able to sleep at all, because she was afraid the wolves had eaten them.
        - id: ch05-b03
          speaker: narrator
          text: Otto came to meet them with a basket in his hand.
        - id: ch05-b04
          speaker: otto
          text: Look what an old man just left here for you.
        - id: ch05-b05
          speaker: narrator
          text: The girls looked inside. There lay a pair of beautiful bracelets made of dark-red precious stones. Each bracelet had the shape of a ripe raspberry, and an inscription said, “To Lisa and Aina.” Beside them was a diamond brooch shaped like a raspberry worm. Words on the brooch read, “Otto, never destroy the helpless!”
        - id: ch05-b06
          speaker: narrator
          text: Otto felt rather ashamed. He understood the message perfectly, but he thought the old man's revenge was a noble one.
        - id: ch05-b07
          speaker: narrator
          text: The raspberry king had remembered Big Sister too. When she went inside to set the table for dinner, she found eleven large baskets filled with the finest raspberries. No one knew how the baskets had arrived there, but everyone could guess who had sent them.
        - id: ch05-b08
          speaker: narrator
          text: Then began such a jam-making as no one had ever seen. If you would like to help, perhaps they might spare you a little. After all, they must surely be making jam to this very day.
