audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，幽默处带温和而克制的调侃
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    maurice_connor:
      display_name: 莫里斯·康纳
      tts:
        delivery: 风趣自信，醉后更加放纵，唱念时带着爱尔兰民间艺人的灵巧
        timbre: 明亮而略带沙哑的成年男声
        pace: 适中偏快
        pitch: 中
    paddy_dorman:
      display_name: 帕迪·多尔曼
      tts:
        delivery: 爽朗厚道，爱打趣，维持秩序时响亮利落
        timbre: 结实粗犷的成年男声
        pace: 适中
        pitch: 中低
    sea_lady:
      display_name: 绿发姑娘
      tts:
        delivery: 甜美从容，善于哄劝，歌唱时轻盈而富有诱惑力
        timbre: 清澈柔美的年轻女声
        pace: 舒缓
        pitch: 中高
    mother_connor:
      display_name: 康纳太太
      tts:
        delivery: 朴实直率，担忧儿子时悲切而带着滑稽的絮叨
        timbre: 苍老而有穿透力的女声
        pace: 适中偏快
        pitch: 中高
    dancer_1:
      display_name: 舞客甲
      tts:
        delivery: 兴致高昂，喝彩时爽快响亮
        timbre: 清朗的年轻男声
        pace: 快
        pitch: 中
    dancer_2:
      display_name: 舞客乙
      tts:
        delivery: 兴致高昂，喝彩时爽快响亮
        timbre: 明快的年轻女声
        pace: 快
        pitch: 中高
    dancer_3:
      display_name: 舞客丙
      tts:
        delivery: 兴致高昂，喝彩时爽快响亮
        timbre: 温厚的成年男声
        pace: 适中偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 风笛手莫里斯
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 莫里斯·康纳是明斯特所有风笛手里的王者，这话一点也不夸张。吉格舞曲也好，里尔舞曲也好，他能一支接一支吹个不停。《奥利斯特鲁姆进行曲》《雄鹰的口哨》《母鸡音乐会》，还有各种稀奇的小调，他也样样精通。
        - id: ch01-b02
          speaker: narrator
          text: 可他最了不起的本事，是一支神奇的曲调。只要它响起来，不论活物死物，全都得跳舞。莫里斯从哪里学来的，我也不知道。他把这个秘密守得很紧，从来不肯轻易说出口。
        - id: ch01-b03
          speaker: narrator
          text: 那曲子才响第一个音，听见的人无论老少，鞋子便像害了寒热病似的在脚上发抖。接着，两只脚自己走起来，走啊，走啊，越走越快，最后带着整个人腾空乱舞。大家一会儿飘到这里，一会儿甩到那里，像暴风卷起的草秆。除非乐声停下，否则谁也停不住。
        - id: ch01-b04
          speaker: narrator
          text: 方圆七个教区里，无论赶集、婚礼还是宴会，若少了盲眼莫里斯和他的风笛，便不值得再提。他那可怜的母亲总牵着他四处奔走，活像牵着一条狗。
        - id: ch01-b05
          speaker: narrator
          text: 这一天，母子俩来到伊弗拉半岛。这里海岸风急浪险，山势又陡。在爱尔兰，要想淹死在海里，或者留在陆地上摔断脖子，恐怕都找不到更合适的地方。
        - id: ch01-b06
          speaker: narrator
          text: 不过，巴林斯凯利格湾倒有一小片平地，很适合大家聚在一起玩乐。再往海边走，便是特拉弗拉斯卡洁净平滑的沙滩。月光下，那片沙子像一汪平静的夏海，边缘还留着细浪一样的卷纹。
        - id: ch01-b07
          speaker: narrator
          text: 莫里斯的风笛一响，四面八方的青年男女都赶来了。沙滩上难得听见风笛，大家立刻跳起舞来。那场舞真是好看。等莫里斯吹完一曲，喝彩声同时响起。
        - id: ch01-b08
          speakers: [dancer_1, dancer_2, dancer_3]
          ensemble: chorus
          text: “好曲子！吹得真好！”
          emotion: happy

    - id: ch02
      title: 一瓶威士忌
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 驼背的舞蹈教师帕迪·多尔曼也在场，负责维持秩序。他一向厚道，听完曲子便高声招呼莫里斯。
        - id: ch02-b02
          speaker: paddy_dorman
          text: “莫里斯，愿你的胳膊越来越有劲，风箱里永远顺风！听了这么好的曲子，怎么能让风笛手渴着呢？要真那样，伊弗拉可要丢尽脸了。这里上回闹出这么大的笑话，还是一星期里出了三个礼拜天的时候。风笛手，你喝酒吗？”
        - id: ch02-b03
          speaker: narrator
          text: 莫里斯把答案说得十分稳妥。毕竟，世上还从没有哪个风笛手或教书先生会拒绝一杯酒。
        - id: ch02-b04
          speaker: maurice_connor
          text: “喝，先生。”
        - id: ch02-b05
          speaker: paddy_dorman
          text: “那你想喝什么，莫里斯？”
        - id: ch02-b06
          speaker: maurice_connor
          text: “我不挑，只要不是生水，什么都喝。多尔曼先生，您要是不介意，能不能借我一杯威士忌？”
        - id: ch02-b07
          speaker: paddy_dorman
          text: “杯子我可没有，莫里斯。我这里只有一只酒瓶。”
        - id: ch02-b08
          speaker: maurice_connor
          text: “没关系。我的嘴正好能装下一杯，不多一滴，也不少一滴。我早就试过好多次啦。”
        - id: ch02-b09
          speaker: narrator
          text: 帕迪竟真把酒瓶交给了他。这个决定可不聪明。莫里斯的嘴一次或许只装得下一杯，可他喉咙底下还有个洞。一杯灌进去，又能再装一杯，接着还能再来一杯。等他把瓶子递回去，里面已经空空如也。
        - id: ch02-b10
          speaker: maurice_connor
          text: “这威士忌还真不坏。”
        - id: ch02-b11
          speaker: paddy_dorman
          text: “凭这见鬼的寒霜起誓！这只瓶子现在只剩下冷冰冰的安慰了。酒到底有多烈，我们只能听你说。你连一口样酒也没给大家留下！”
        - id: ch02-b12
          speaker: narrator
          text: 帕迪说得没错，莫里斯确实一滴也没剩。诸位先生女士，一口气喝完一整瓶威士忌，可不像喝一瓶水那么轻松。我这一辈子，只见过五个人喝完以后还能安然无恙。莫里斯虽然很能喝，却不是其中一个。
        - id: ch02-b13
          speaker: narrator
          text: 我可不是在责怪他。只是酒一进肚，理智往往就让了路。莫里斯呼地吹出一口气，那支神奇的曲调一下子从风笛里冲了出来。

    - id: ch03
      title: 群鱼狂舞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 接下来的舞，疯狂得叫人不敢相信。莫里斯自己也站不稳了。他一会儿倒向这条腿，一会儿又歪到另一条腿，像一艘撞上横浪的船，东摇西滚，还在拼命踩曲子的拍子。
        - id: ch03-b02
          speaker: narrator
          text: 连他的老母亲也跳个不停，一把老骨头轻得像最年轻的姑娘。可无论她跳得多快，其他人跳得多好，同沙滩上的景象一比，都不值得再说了。
        - id: ch03-b03
          speaker: narrator
          text: 整片沙滩挤满了各种各样的鱼。它们随着乐声蹦跳翻滚，海里还有越来越多的鱼着了曲子的魔，不断滚上沙滩，又跌回水中。大得吓人的螃蟹只拿一只螯撑住身体，像舞蹈教师一样飞快地打转。剩下的螯四处乱甩，好像根本不是长在自己身上的。
        - id: ch03-b04
          speaker: narrator
          text: 这景象真让人看傻了。说到这里，我得提一提弗洛伦斯·康里神父。炎炎夏日里，若能同他喝上一杯，你一定会觉得很快活。他还把群鱼跳舞编成了一首妙极了的歌。下面就是译成英语的歌词，要是不唱给你听，实在太可惜。
        - id: ch03-b05
          speaker: narrator
          text: |-
            大海豹摇摇晃晃，像海浪起伏荡漾，
            又像痛风的脚儿蹦跳。
            它们领着快活的鱼群，螃蟹龙虾和螯虾，
            铁了心要把舞来跳。
        - id: ch03-b06
          speaker: narrator
          text: |-
            鳕鱼张大嘴巴，吞下甜美的乐声，
            这情景实在奇妙。
            大菱鲆和鲽鱼混在圆滚滚的鱼群里，
            也一样欢腾雀跃。
        - id: ch03-b07
          speaker: narrator
          text: |-
            海鲂踏着轻盈的碎步，
            呆头无须鳕看它们蹦跳，也有了精神，尽情嬉闹。
            亮闪闪的鲭鱼纵身跃起，像一道道小彩虹，
            展翅飞上九霄。
        - id: ch03-b08
          speaker: narrator
          text: |-
            牙鳕和黑线鳕离开咸水牧场，
            也来参加这场舞蹈。
            扁脸的鳐鱼挤开老鲽鱼，
            鳎鱼却稳稳站牢。
        - id: ch03-b09
          speaker: narrator
          text: |-
            西鲱和鲱鱼成群结队，化作银光闪闪的阵雨，
            数目多得谁也比不了。
            又长又大的鳕鱼更是数不胜数，
            把整片海岸都堵掉。
        - id: ch03-b10
          speaker: narrator
          text: |-
            扇贝和牡蛎让两片贝壳喧闹碰击，
            像响板上下翻飞。
            连帽贝也走得干脆利落，岩石笑得几乎裂开，
            再也合不拢嘴。
        - id: ch03-b11
          speaker: narrator
          text: 从古到今，世上从没闹过这么大的动静。那声音简直像天和地要撞在一起。而这一切，全是莫里斯·康纳那支神奇的曲调闹出来的。

    - id: ch04
      title: 绿发姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 大家正闹到最高兴的时候，一位美丽的年轻姑娘竟在那群怪鱼中间跳起舞来。她美得像破晓的晨光，头上戴着一顶翘角帽。帽子下面，海水般碧绿的长发一直披到背后，却一点也不妨碍她跳舞。
        - id: ch04-b02
          speaker: narrator
          text: 她的牙齿像一排排珍珠，双唇红得如同珊瑚。身上的长裙闪着光，淡绿得像波浪卷起时中空的水色，上面还缀着一排排紫色和红色的海草。无论住在水下还是水上，哪位女士会不懂得打扮自己呢？
        - id: ch04-b03
          speaker: narrator
          text: 姑娘一路舞到莫里斯面前。这时候，莫里斯两脚翻飞，快得像一颗颗啤酒花。他的曲子还在响，世上就没有什么东西能够停下来。姑娘用蜜糖一样甜的嗓音，对他唱道。
        - id: ch04-b04
          speaker: sea_lady
          text: |-
            “我是尊贵的小姐，家住在深深海底。
            莫里斯·康纳，随我来吧，同我结为夫妻。
            银盘子，金碟子，全都送给你。
            只要你同我成婚，便做群鱼的皇帝。”
        - id: ch04-b05
          speaker: narrator
          text: 莫里斯脑袋里的酒劲正盛，听见这番抬举，便唱着回敬她。肯向盲眼风笛手求婚的小姐，可不是随处都能遇见。人家给他多大情面，他也该还人家多大体面。
        - id: ch04-b06
          speaker: maurice_connor
          text: |-
            “多谢您的美意，小姐。若我真是一位国王，
            守着金盘金碟吃饭，自然十分风光。
            您父亲的女儿这般可爱，我定能同她和睦相处，
            只是那咸涩的海水，我怎么也喝不下肚！”
        - id: ch04-b07
          speaker: narrator
          text: 姑娘吃惊地看着他，又像一位大学问家那样左右摇了摇头。
        - id: ch04-b08
          speaker: sea_lady
          text: “好啊，莫里斯！如果你还不算诗人，世上又到哪里去找诗呢？”
          emotion: surprised
        - id: ch04-b09
          speaker: narrator
          text: 两个人就这样一唱一和，没完没了地说着恭维话。他们的脚跟着乐声飞舞，舌头也转得一样快。鱼群还在不停地跳，四下里尽是噼啪乱响的声音。
        - id: ch04-b10
          speaker: narrator
          text: 莫里斯怕鱼群不高兴，不敢停下风笛。他也不知道这么多鱼一旦发怒，会用什么法子对付他。绿发姑娘则不停地用软话哄他，终于说动他答应结婚，到海里给大大小小的鱼当国王。
        - id: ch04-b11
          speaker: narrator
          text: 鱼群若想要一个能让大家跳舞的国王，莫里斯倒十分合适。只要喝的不是海水，无论哪条鱼来作伴，他也准能陪它喝个痛快。

    - id: ch05
      title: 海底传来的歌声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 康纳太太看见那个绿头发的怪物化作姑娘模样，领着自己的儿子走了。莫里斯和她亲亲热热，一边跳舞，一边穿过密密麻麻的鱼群，眼看就要走到海边。老妇人在后面大声哭喊，叫儿子快停下，快回来。
        - id: ch05-b02
          speaker: mother_connor
          text: “哎哟，我守寡还守得不够吗？如今他又要离开我，去娶那个满身鱼鳞的女人！谁知道以后我会不会成了无须鳕或者鳕鱼的外祖母？上帝救救我、可怜可怜我吧，这事也太违背天性了！”
          emotion: sad
        - id: ch05-b03
          speaker: mother_connor
          text: “说不定有一天，我会把自己的亲外孙配上一块咸黄油，煮熟了吃进肚里，还什么都不知道！莫里斯，莫里斯，你心里若还剩一点亲情和良心，就回到老母亲身边吧！是我把你养大，让你成了一个体面的基督徒！”
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 可怜的老妇人哭得那么哀伤，又那么动听，任谁听了都会觉得很受用。可是莫里斯已经来到水边，仍旧若无其事地吹着风笛，跳着舞。前方一道巨浪轰隆隆地涌来，眼看就要把他活活吞没。他看不见，也就不知道害怕。
        - id: ch05-b05
          speaker: narrator
          text: 康纳太太隔着满脸的泪水，却把巨浪看得清清楚楚。她的心痛得像世上最伤心的母亲，可两只脚还是为了保命，不停地跳啊，跳啊。莫里斯不肯停下那支神奇的曲调，她实在一点办法也没有。
        - id: ch05-b06
          speaker: narrator
          text: 莫里斯只是侧耳听着母亲的声音，还怕哭喊声搅乱自己的舞步。他转过头，只来得及答上一句话。
        - id: ch05-b07
          speaker: maurice_connor
          text: “嘘，别说了，母亲。我要到海底给群鱼当国王啦。以后每年到了今天，我都会送一块焦木漂到特拉弗拉斯卡，给您报个平安。您一看见它，就知道我还活得好好的，它也能给您带来好运。”
        - id: ch05-b08
          speaker: narrator
          text: 莫里斯再也来不及多说。绿发姑娘看见巨浪已经压到头顶，立刻用一件像宽大兜帽斗篷的东西把两个人裹住。浪头卷起来，足有他们两人那么高，随后轰然扑上沙滩。那阵冲击和咆哮，一直传到了克利尔角。
        - id: ch05-b09
          speaker: narrator
          text: 整整一年后的同一天，一块焦木果然漂上了特拉弗拉斯卡的岸。莫里斯住在海底，千里迢迢送来这样一件礼物，想得可真古怪。送一件长袍或者一双鞋，多少还算能给可怜的母亲穿用。不过，他说过要送焦木，便一直守着诺言。
        - id: ch05-b10
          speaker: narrator
          text: 一百多年里，每到约定的日子，焦木总会准时漂来，甚至还不止一百年。可后来，大家把那个日子忘了。或许正因为这样，人们才说莫里斯·康纳不再给母亲送报平安的信物了。
        - id: ch05-b11
          speaker: narrator
          text: 可怜的康纳太太连一块焦木也没能等到。失去儿子的悲伤，再加上生怕吃掉亲外孙的恐惧，让她在那场舞会三个星期后便离开了人世。也有人说，她其实是累死的。无论真相如何，她总算体体面面地葬在了自家亲人身边。
        - id: ch05-b12
          speaker: narrator
          text: 后来，在凯里海岸外航行的人，常会在寂静的夜里听见水下飘出音乐。有些人的耳力特别好，还能清清楚楚地听见莫里斯·康纳和着风笛唱歌。
        - id: ch05-b13
          speaker: maurice_connor
          text: |-
            “美丽的海岸，沙滩铺展，
            海水如水晶，细沙似钻石灿烂。
            若不是为了我美丽的姑娘，
            我永远也不会离开你身边。”
        - id: ch05-b14
          speaker: narrator
          text: 这个故事选自《南爱尔兰的童话与传说》。
