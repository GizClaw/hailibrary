  chapters:
    - id: ch01
      title: The King of the Pipers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Maurice Connor was the king of all the pipers in Munster, and king is no small word. He could play jigs and reels without end. He knew Ollistrum's March, the Eagle's Whistle, the Hen's Concert, and odd tunes of every kind. Yet one tune was more astonishing than all the rest. It could set anything dancing, whether it was alive or dead.
        - id: ch01-b02
          speaker: narrator
          text: How Maurice learned that tune, I cannot tell you. He was mighty careful never to say. At its very first note, the shoes on every listener began to shake as if they had a fever. Young or old, it made no difference. Then their feet went faster and faster beneath them, until away they flew, dancing wildly here and there like straw tossed in a storm. No one could stop while the music played.
        - id: ch01-b03
          speaker: narrator
          text: No fair, wedding, or feast in the seven surrounding parishes was worth talking about unless blind Maurice and his pipes were there. His poor mother led him from place to place, much as one might lead a dog.
        - id: ch01-b04
          speaker: narrator
          text: One day, Maurice and his mother were making their rounds through Iveragh. Now, Iveragh has stormy coasts and steep mountains. In all Ireland, you could hardly find a better place to drown at sea or break your neck on land, whichever you preferred. Even so, Ballinskellig Bay had a neat patch of ground made for merrymaking. Below it lay a clean, smooth strand. It looked like a calm summer sea under moonlight, with only the smallest waves curling across it.
    - id: ch02
      title: Whisky on the Strand
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Maurice's music drew young men and women there from every direction. It was not every day that bagpipes stirred the strand of Trafraska. The dancing began, and a prettier dance was never seen. When Maurice finally stopped, everyone praised him.
        - id: ch02-b02
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: Fine music, Maurice! Well played!
        - id: ch02-b03
          speaker: narrator
          text: Paddy Dorman, a hunchbacked dancing master, had come to keep order.
        - id: ch02-b04
          speaker: paddy
          text: More power to your elbow, Maurice, and a fair wind in the bellows! We can't let a piper go dry after music like that. It would disgrace Iveragh, and no such disgrace has happened here since the week with three Sundays. Tell me, piper, have you had a drink?
        - id: ch02-b05
          speaker: narrator
          text: Paddy was always a decent man. Maurice made sure to answer the question on the safe side, for no one ever knew a piper or a schoolmaster to refuse a drink.
        - id: ch02-b06
          speaker: maurice
          text: I will have one, sir.
        - id: ch02-b07
          speaker: paddy
          text: What would you like, Maurice?
        - id: ch02-b08
          speaker: maurice
          text: I'm not particular. I'll drink anything but raw water. Still, if it's all the same to you, Mister Dorman, perhaps you could lend me a glass of whisky.
        - id: ch02-b09
          speaker: paddy
          text: I have no glass, Maurice. Only the bottle.
        - id: ch02-b10
          speaker: maurice
          text: Don't let that trouble you. My mouth holds exactly one glass. I've tested it often enough.
        - id: ch02-b11
          speaker: narrator
          text: Paddy trusted him with the bottle, which was foolish indeed. He soon learned that Maurice's mouth might hold only one glass at a time, but the hole in his throat allowed for glass after glass.
        - id: ch02-b12
          speaker: maurice
          text: That wasn't bad whisky at all.
        - id: ch02-b13
          speaker: narrator
          text: He handed back an empty bottle.
        - id: ch02-b14
          speaker: paddy
          text: By the holy frost! There's cold comfort in that bottle now. We'll have to take your word for how strong the whisky was, because you haven't left us a drop to judge by.
        - id: ch02-b15
          speaker: narrator
          text: And sure enough, Maurice had not. Now, anyone knows that swallowing an honest bottle of whisky in one pull is nothing like drinking a bottle of water. In my whole life, I have known only five men who could do it without suffering afterward. Maurice Connor was not among them, though his head was strong enough. I do not blame him. But when drink goes in, good sense goes out. With one great puff, he blasted out his wonderful tune.
    - id: ch03
      title: The Dance of the Fishes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then came dancing beyond all belief. Maurice himself could not keep still. He staggered from one leg to the other and rolled like a ship in crossing seas, trying to keep time with his tune. His mother moved her old bones as lightly as the youngest girl there. Yet neither her dancing nor anyone else's was worth mentioning beside what happened down on the strand.
        - id: ch03-b02
          speaker: narrator
          text: Every inch of sand was covered with fish. They leaped and plunged to the music, while more tumbled in and out of the water every moment, all bewitched by that wonderful tune. The gathering grew thicker with every new wave. Enormous crabs spun on one claw as nimbly as dancing masters. Their other claws whirled and tossed about as if they belonged to someone else. It was an astonishing sight.
        - id: ch03-b03
          speaker: narrator
          text: Perhaps you have heard of Father Florence Conry, a most pleasant companion on a hot summer's day. He made such neat verses about those dancing fish that it would be a great pity not to tell you what they said.
        - id: ch03-b04
          speaker: narrator
          text: The great seals came rolling like ocean waves, or like sore feet trying to prance. They headed the merry company ashore, with crabs, lobsters, and crayfish behind them. The whole saltwater procession came tumbling and splashing in, every creature determined to dance.
        - id: ch03-b05
          speaker: narrator
          text: The gasping cod swallowed the sweet sounds and followed along. Turbot and flounder capered as gaily as all the rounder fish nearby. John Dories came tripping. Even the dull hake began to skip and frisk.
        - id: ch03-b06
          speaker: narrator
          text: Bright mackerel sprang upward like little rainbows flying toward heaven. Whiting and haddock left their saltwater pasture to join the dance. Flat-faced skates pushed old plaice aside, though the soles still kept their footing.
        - id: ch03-b07
          speaker: narrator
          text: Sprats and herrings poured in like silver showers, too many to count. Long, heavy ling came in such numbers that they crowded the shore and left scarcely room for the other dancers. Scallops and oysters rattled their two shells like castanets as they joined the uproar. Even the slow limpets moved plainly to the tune, and the rocks nearly split with laughter.
        - id: ch03-b08
          speaker: narrator
          text: Never before or since was there such a hullabaloo in this world. Heaven and earth seemed ready to crash together, and it was all because of Maurice Connor's wonderful tune.
    - id: ch04
      title: The Lady with Green Hair
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At the height of all this commotion, a beautiful young woman appeared among those strange dancing fish. She was as lovely as the dawn. A cocked hat sat upon her head, and beneath it streamed long green hair, the very color of the sea. It flowed behind her and never hindered her dancing.
        - id: ch04-b02
          speaker: narrator
          text: Her teeth shone like rows of pearls, and her lips were as red as coral. Her gown gleamed with the pale green of a curling wave. Little rows of purple and red seaweed decorated it, for no lady, above the water or beneath it, ever lacked a proper wish to dress herself well.
        - id: ch04-b03
          speaker: narrator
          text: At last she danced up to Maurice. His feet were flying as quickly as hops, because nothing in the world could stay still while his tune played. In a voice as sweet as honey, the lady sang to him.
        - id: ch04-b04
          speaker: sea_lady
          text: I am a lady of honor who lives beneath the sea. Come down with me, Maurice Connor, and marry me. You shall eat from silver plates and golden dishes. Once we are wed, you shall be king of all the fishes.
        - id: ch04-b05
          speaker: narrator
          text: The whisky was strong in Maurice's head, so he sang an answer just as grand. After all, not every lady would offer marriage to a blind piper. It was only right, he thought, to answer her courtesy with some of his own.
        - id: ch04-b06
          speaker: maurice
          text: Much obliged to you, madam. If I were a king with golden dishes and plates, I could dine in splendid state. I'm sure I could agree very well with your father's daughter. But drinking the salt water would never agree with me!
        - id: ch04-b07
          speaker: narrator
          text: The lady stared at him in amazement. She swung her head from side to side like a great scholar considering a difficult question.
        - id: ch04-b08
          speaker: sea_lady
          text: Well, Maurice, if you are not a poet, where in the world could poetry be found?
          emotion: surprised
        - id: ch04-b09
          speaker: narrator
          text: So they went on trading lofty compliments. Each answered the other while their feet moved as fast as their tongues. The fish danced on around them. Maurice could hear all their clattering, and he was afraid to stop playing. He did not know what so many fish might do if they grew angry with him.
        - id: ch04-b10
          speaker: narrator
          text: The green-haired lady kept coaxing Maurice with gentle speeches. At last she persuaded him to promise that he would marry her and reign over every fish, great or small. He was well suited to be their king if they wanted someone who could make them dance. And except for salt water, he could surely drink with any fish among them.
        - id: ch04-b11
          speaker: narrator
          text: Then Maurice's mother saw him dancing lovingly toward the water with that unnatural green-haired creature as his guide. They passed through the thick crowd of fish together. His mother called for him to stop and come back.
        - id: ch04-b12
          speaker: mother
          text: Oh, wasn't I enough of a widow already? Now there he goes, leaving me to marry that scaly woman! Who knows? I may become grandmother to a hake or a cod. Lord help and pity me, what an unnatural thing! Perhaps one day I'll boil and eat my own grandchild with a bit of salt butter and never know it. Maurice, Maurice, if you have any love or natural feeling left, come back to your own old mother. I raised you like a decent Christian!
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: The poor woman cried and sobbed so finely that hearing her would have done anyone good. Maurice soon reached the rim of the water. Still he played and danced as if nothing were wrong. A great thundering wave was racing toward him, ready to swallow him alive. But Maurice could not see it, so he felt no fear.
        - id: ch04-b14
          speaker: narrator
          text: His mother saw the wave clearly through the great tears rolling down her face. Her heart ached as deeply as any mother's heart ever ached for a son. Even then, she had to keep dancing for her very life. She could not help herself, because Maurice had never stopped playing his wonderful tune.
        - id: ch04-b15
          speaker: narrator
          text: Maurice merely turned one ear toward his mother's voice. He feared that listening might spoil his steps. Then he called back his only answer.
        - id: ch04-b16
          speaker: maurice
          text: Hush now, Mother. I'm going to be king of the fishes beneath the sea. To bring you luck and show that I'm alive and well, every year on this very day I'll send a piece of burned wood ashore at Trafraska.
        - id: ch04-b17
          speaker: narrator
          text: Maurice had no time for another word. The strange green-haired lady saw that the wave was upon them. She wrapped herself around him like a great hooded cloak. Then the wave curled twice as high as their heads and burst across the strand. Its rush and roar could be heard all the way to Cape Clear.
    - id: ch05
      title: Music Beneath the Water
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One year later, on that very day, a piece of burned wood washed ashore at Trafraska. It was a queer gift for Maurice to send from the bottom of the sea. A gown or a pair of shoes would have been more useful to his poor mother. Still, he had given his word, and he kept it.
        - id: ch05-b02
          speaker: narrator
          text: The burned wood returned on the appointed day every year for a good hundred years, and longer. At last, people forgot which day it was. Perhaps that is why they say Maurice Connor no longer sends his token of luck to his mother.
        - id: ch05-b03
          speaker: narrator
          text: Poor Mrs. Connor never lived to receive even one piece. Between losing Maurice and fearing that she might eat one of her own grandchildren, she died three weeks after the dance. Some say the dancing itself wore her out. Whatever the cause, she was decently buried among her own people.
        - id: ch05-b04
          speaker: narrator
          text: On still nights, sailors off the coast of Kerry have often heard music rising from beneath the water. Those with especially good ears could make out Maurice Connor singing these words along with his pipes.
        - id: ch05-b05
          speaker: maurice
          text: Beautiful shore, with your wide-spreading strand, your crystal water, and diamond sand. I never would have parted from you, except for the sake of my fair lady.
