audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着讲述古老童话，奇异处自然从容，悲喜处克制而温暖
        timbre: 温暖清晰的成年男声
        pace: 舒缓而富于变化
        pitch: 中低
    matte:
      display_name: 马特
      tts:
        delivery: 朴实稳重，带着老渔夫的幽默和少许抱怨
        timbre: 粗粙浑厚的老年男声
        pace: 不紧不慢
        pitch: 低
    maie:
      display_name: 玛伊
      tts:
        delivery: 心思活络而好强，有所求时执拗，辩解时机敏
        timbre: 清亮而略显尖细的老年女声
        pace: 适中偏快
        pitch: 中高
    student_1:
      display_name: 学生甲
      tts:
        delivery: 爽朗爱说笑，带着年轻人的自信
        timbre: 明亮的年轻男声
        pace: 轻快
        pitch: 中
    student_2:
      display_name: 学生乙
      tts:
        delivery: 随和风趣，讲奇闻时兴致勃勃
        timbre: 清朗的年轻男声
        pace: 适中偏快
        pitch: 中高
    student_3:
      display_name: 学生丙
      tts:
        delivery: 热情调皮，附和同伴时干脆自然
        timbre: 轻快的年轻男声
        pace: 较快
        pitch: 中
    fiddler:
      display_name: 琴师
      tts:
        delivery: 恭谨平和，答话简洁
        timbre: 清润的成年男声
        pace: 适中
        pitch: 中
    ahti:
      display_name: 海王阿赫蒂
      tts:
        delivery: 威严雷霆，发怒时像海浪轰鸣
        timbre: 深沉洪亮的成年男声
        pace: 缓慢而有压迫感
        pitch: 低
  chapters:
    - id: ch01
      title: 红色岩石上的心愿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个渔夫，姓萨尔蒙，教名马特。渔夫嘛，自然住在大海边。他的妻子叫玛伊，也没有比这更合适的名字了。冬天，他们住在岸边的小屋里。春天一到，他们就收拾好东西，搬去大海上一块远离陆地的红岩，整个夏天都住在那里，直到秋天来临才离开。红岩上的屋子比岸边那间还要小。门上没有铁锁，只有一根木闩。屋里砌着石头炉灶，屋外立着一根旗杆，屋顶还安着一只会转动的风向鸡。
        - id: ch01-b02
          speaker: narrator
          text: 红岩名叫阿赫托拉，还没有小城的广场大。石缝里长着一棵小花楸树和四丛赤杨。天晓得它们是怎么来的，也许是冬日风暴送来的。那里还有几簇摸着像天鹅绒的细草，几丛散开的芦苇，两棵黄色的艾菊，四棵红花和一棵漂亮的白花。不过，岩上最宝贵的，还是玛伊种在石缝里的三株大蒜。它们北面有石壁挡风，南面有阳光照着。这些虽然不多，却已经够玛伊当作一方香草园了。
        - id: ch01-b03
          speaker: narrator
          text: 好事都要凑成三样。马特和玛伊春天捕鲑鱼，夏天捕鲱鱼，冬天捕鳕鱼。星期六遇上好天气和顺风，他们就划船去最近的城里卖鱼，第二天去教堂。不过很多时候，夫妻俩一连几星期都独自守着这块岩石。陪着他们的，只有那条取了个气派名字的黄褐色小狗“王子”，几簇草木和花，一湾湾海水和水里的鱼，风雨欲来的天空，还有蓝色海面上雪白的浪尖。岩石离陆地很远。方圆几英里都看不见绿岛和人家，偶尔只有几块同样暗红的岩石露出水面，昼夜淋着海上的飞沫。
        - id: ch01-b04
          speaker: narrator
          text: 两个人都勤快肯干，守着穷苦的小屋，心里却快活知足。他们只要腌满几桶鱼，够一冬慢慢吃，再卖掉一点余货，给马特买烟草，给玛伊买一两磅咖啡，就觉得自己很富有。那咖啡里得多掺些烤麦和菊苣根，喝起来才有味道。家里还有面包、黄油、鱼、一桶啤酒和一罐脱脂酸奶，还能缺什么呢？可玛伊偏偏有个藏在心底的愿望，一刻也不让她安宁。她想要一头奶牛。
        - id: ch01-b05
          speaker: matte
          text: “要头奶牛干什么？它游不到这么远，我们的小船也载不动它。就算牛真的来了，咱们拿什么喂？”
        - id: ch01-b06
          speaker: maie
          text: “岩上有四丛赤杨，还有十六簇草呢。”
        - id: ch01-b07
          speaker: matte
          text: “对，还有三株大蒜。拿大蒜喂牛，真是再好不过了。”
        - id: ch01-b08
          speaker: maie
          text: “奶牛都爱吃咸鲱鱼。王子不就很爱吃鱼吗？”
        - id: ch01-b09
          speaker: matte
          text: “也许吧。不过要是天天喂咸鲱鱼，这头牛很快就会贵得养不起。王子可不一样，它连最后一口鱼肉都敢跟海鸥抢。老伴，别再想奶牛了。咱们的日子已经过得不错。”
        - id: ch01-b10
          speaker: narrator
          text: 玛伊叹了口气。她知道丈夫说得对，却打消不了养牛的念头。咖啡里的脱脂酸奶忽然没以前好喝了。她想着鲜奶油和新鲜黄油，觉得世上没有什么能跟它们相比。

    - id: ch02
      title: 学生们讲的海王
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，夫妻俩正在岸边收拾鲱鱼，王子忽然叫了起来。一只涂得五彩斑斓的小船朝岩石驶来，船上是三个出游的年轻学生。他们肚子饿了，想找些东西吃。
        - id: ch02-b02
          speakers: [student_1, student_2, student_3]
          ensemble: chorus
          text: “好心的大婶，给我们来一份凝乳吧！”
        - id: ch02-b03
          speaker: maie
          text: “唉，我要是有就好了！”
          emotion: sad
        - id: ch02-b04
          speaker: student_1
          text: “那就给我们一罐没撗过奶油的鲜奶。”
        - id: ch02-b05
          speaker: maie
          text: “要是我有鲜奶就好了！”
          emotion: sad
        - id: ch02-b06
          speakers: [student_1, student_2, student_3]
          ensemble: chorus
          text: “什么？你们连头奶牛都没有？”
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: 玛伊沉默了。这句话正好戳到她心上，她什么也答不出来。
        - id: ch02-b08
          speaker: matte
          text: “我们没有牛。不过有上好的熏鲱鱼，两个钟头就能做好。”
        - id: ch02-b09
          speaker: student_2
          text: “行，那就吃熏鲱鱼。”
        - id: ch02-b10
          speaker: narrator
          text: 学生们往岩石上一躺，等着火堆前的五十条银白鲱鱼慢慢烤熟。
        - id: ch02-b11
          speaker: student_1
          text: “海中间这块小石头叫什么？”
        - id: ch02-b12
          speaker: matte
          text: “阿赫托拉。”
        - id: ch02-b13
          speaker: student_1
          text: “那你们住在海王的国土上，应该什么都不缺才对。”
        - id: ch02-b14
          speaker: narrator
          text: 马特根本没听懂。他没读过《卡勒瓦拉》，也不知道芬兰古代神灵和英雄的歌谣。学生们便讲给他听。
        - id: ch02-b15
          speaker: student_2
          text: “阿赫蒂是一位威力无边的大王。他的国土就叫阿赫托拉。海底有他的岩石和堆满珍宝的宝库。他管着海里所有的鱼和动物，还养着世上最健美的牛、最矫健的马。它们都在海底吃草。”
        - id: ch02-b16
          speaker: student_3
          text: “只要讨得阿赫蒂高兴，人很快就会富起来。可跟他打交道一定要小心。他喜怒无常，脆弱得很。就算只往海里扔一块小石子，也可能得罪他。他会收回礼物，掀起风暴，把水手拖到海底。”
        - id: ch02-b17
          speaker: student_1
          text: “阿赫蒂还有最美的少女。她们给王后韦拉莫提着长裙拖尾。音乐一响，她们就梳起披散的长发，那些头发在水里闪闪发光。”
        - id: ch02-b18
          speaker: matte
          text: “几位大人，这些你们都亲眼见过吗？”
          emotion: surprised
        - id: ch02-b19
          speakers: [student_1, student_2, student_3]
          ensemble: chorus
          text: “就算没亲眼看到，也差不多了。这些都印在书上，书上印的当然都是真的。”
        - id: ch02-b20
          speaker: matte
          text: “这我可不敢肯定。”
        - id: ch02-b21
          speaker: narrator
          text: 马特边说边摇头。这时，火前的五十条鲱鱼已经烤熟。三个学生吃得好不痛快，竟然吃下了六个人的分量。他们又想起船上恰好带着几块冷肉，便全都拿来喂王子。王子高兴得用后腿坐起来，像小猫一样喵喵叫。饭后，学生们送给马特一枚闪亮的银币，还打开自己的烟草袋，让他装满一烟斗特别好的烟草。他们谢过主人的热情款待，坐船继续赶路。王子舍不得他们，蹲在岸边，眼巴巴地望着小船，嘴里一直呜咽。直到远处那片白帆最后一角也看不见，它还在那里望着。
        - id: ch02-b22
          speaker: narrator
          text: 玛伊始终没有开口，心里却没停下来。她的耳朵灵得很，已经把阿赫蒂的故事牢牢记住。她想，要是有一头神奇的奶牛，早晚都能挤奶，还不用管饲料，那该多好。她会在窗边装一块搁板，放满一盘盘鲜奶和凝乳。每天早上和晚上，她都能挤出又甜又香的牛奶。可她转念又想，这种好运怎么会轮到自己呢？
        - id: ch02-b23
          speaker: matte
          text: “你在想什么？”
        - id: ch02-b24
          speaker: maie
          text: “没想什么。”
        - id: ch02-b25
          speaker: narrator
          text: 其实玛伊正在回想小时候听过的魔法歌诀。那是一个瘸腿老人教的，据说能给捕鱼的人带来好运。她心想，我为什么不试一试呢？

    - id: ch03
      title: 风暴送来的红牛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这天正是星期六。马特从不在星期六晚上放鲱鱼网，因为他不肯在星期日捕鱼。到了傍晚，玛伊却想让他破一回例。
        - id: ch03-b02
          speaker: maie
          text: “咱们今晚就放这一回网吧。”
        - id: ch03-b03
          speaker: matte
          text: “不行，今晚是星期六。”
        - id: ch03-b04
          speaker: maie
          text: “昨晚风暴太大，我们没捕到多少鱼。今晚海面平得像镜子，风又把鲱鱼往岸边赶，正是时候。”
        - id: ch03-b05
          speaker: matte
          text: “可西北的天上有一道道云，王子今晚还吃了草。”
        - id: ch03-b06
          speaker: maie
          text: “什么？它没吃我的大蒜吧？”
          emotion: surprised
        - id: ch03-b07
          speaker: matte
          text: “大蒜没吃。不过明天日落前，天气一定会变坏。”
        - id: ch03-b08
          speaker: maie
          text: “你听我说。我们只在近岸放一张网，捕来的鱼刚好装满那半桶。桶口一直敞着，鱼会坏的。”
        - id: ch03-b09
          speaker: narrator
          text: 马特终于被说动了。两人带着网划到水最深的地方。玛伊开始哼那支魔法歌诀，又把歌词改成自己心里的愿望。
        - id: ch03-b10
          speaker: maie
          text: “长须飘飘的阿赫蒂，住在湛蓝的大海里。你有世上最好的珍宝，闪光的鱼儿也全归你。海底收藏着无比的珍珠，健美的海牛在绿草场上漫步。远近水域的大王，我不要你的金子、珍珠和白银。一落了单，两才成双。赐我一头牛吧，我拿一片月光和太阳的金子报答你。”
        - id: ch03-b11
          speaker: matte
          text: “你在哼什么？”
        - id: ch03-b12
          speaker: maie
          text: “没什么，只是几句老歌词，一直在我脑子里转。”
        - id: ch03-b13
          speaker: narrator
          text: 说完，她反而放大了声音。
        - id: ch03-b14
          speaker: maie
          text: “长须飘飘的阿赫蒂，住在湛蓝的大海里。你的牛群成百上千，求你赐给我一头奶牛。”
        - id: ch03-b15
          speaker: matte
          text: “这歌真傻。向海王求东西，当然应该求鱼。而且这种歌不该在星期日唱。”
        - id: ch03-b16
          speaker: narrator
          text: 玛伊只当没听见，船在水上呆了多久，她就唱了多久。马特划着沉重的船，一心想自己裂了缝的烟斗和那些好烟草，后来根本没听她唱什么。两人放好网，划回小岛，上床躺下。可一个想着自己亵渎了星期日，一个想着阿赫蒂的奶牛，谁也睡不着。
        - id: ch03-b17
          speaker: narrator
          text: 半夜左右，马特坐了起来。
        - id: ch03-b18
          speaker: matte
          text: “你听到什么没有？”
        - id: ch03-b19
          speaker: maie
          text: “没有。”
        - id: ch03-b20
          speaker: matte
          text: “屋顶的风向鸡转得不对劲。这不是好兆头，怕是要起风暴了。”
        - id: ch03-b21
          speaker: maie
          text: “都是你自己乱想。”
        - id: ch03-b22
          speaker: narrator
          text: 马特躺下去，很快又坐了起来。
        - id: ch03-b23
          speaker: matte
          text: “风向鸡现在吱吱叫了。”
        - id: ch03-b24
          speaker: maie
          text: “你又在胡思乱想。快睡吧。”
        - id: ch03-b25
          speaker: narrator
          text: 第三次，马特直接从床上跳了下来。
        - id: ch03-b26
          speaker: matte
          text: “听啊！风向鸡简直在放声大吼，像是肚子里烧着火。大风暴就要来了，我们得去收网。”
        - id: ch03-b27
          speaker: narrator
          text: 两人赶紧起床。夏夜黑得像十月，风向鸡咔咔作响，狂风从四面八方扑来。海面白得像雪，浪花直接打过渔屋。马特一辈子也没见过这样的夜晚。现在想推船入水、出海救网，那是万万不可能了。夫妻俩惊呆地站在门口，抱紧门框，白沫不住打在脸上。
        - id: ch03-b28
          speaker: matte
          text: “我是不是早就说过，星期日捕鱼不会有好运？”
          emotion: angry
        - id: ch03-b29
          speaker: narrator
          text: 马特说这话时心里很不高兴。玛伊早已吓得魂不守舍，连阿赫蒂和他的牛都一次也没有想起来。他们既救不了网，也不能出海，留在门口又只会不停挨海水打，只好重新进屋。两人一夜没睡，此刻困得眼皮发沉。他们很快便沉沉睡去，睡得那样深，好像孤零零的小屋外根本没有怒海在吼叫。等两人醒来，太阳已经升得很高，风暴完全停了。大海却还没有彻底平静，只剩银光闪烁的余波，一浪接一浪地涌上红色岩石。
        - id: ch03-b30
          speaker: maie
          text: “门外那是什么？”
        - id: ch03-b31
          speaker: matte
          text: “看着像一头大海豹。”
        - id: ch03-b32
          speaker: maie
          text: “我敢拿性命担保，那是头牛！”
          emotion: surprised
        - id: ch03-b33
          speaker: narrator
          text: 那的确是一头牛。一头健壮的红牛，长得肥肥壮壮，像是一辈子吃的都是菠菜。它在岸边悠闲地走来走去，步子又稳又平静。它看都不看那几簇可怜的小草，仿佛嫌这些食物太粗劣，根本配不上自己。马特站在那里，简直不敢相信自己的眼睛。可它看着是牛，两人走近查过，它也的的确确就是牛。玛伊马上拿来家伙挤奶。洁白香甜的牛奶不停流出，所有壶子、罐子和锅子很快都装满了。到最后，就连船里用来舀水的木勺也没落下。
        - id: ch03-b34
          speaker: narrator
          text: 马特想不明白牛是怎么来的，只好出去找渔网。他还没走多远，就看见网被冲上了岸，里面塞满鱼，一个网眼都露不出来。
        - id: ch03-b35
          speaker: matte
          text: “养牛当然好，可咱们拿什么喂它？”
        - id: ch03-b36
          speaker: maie
          text: “总能想到办法。”
        - id: ch03-b37
          speaker: narrator
          text: 牛自己就想到了。它去吃岸边茂盛的海草，身子一直都很健壮。除了王子，大家都认为它聪明。王子却对着它汪汪叫，因为它有了一个对手。

    - id: ch04
      title: 永远不够的好日子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 从那天起，红岩上像要流满牛奶和凝乳，每张渔网里也都塞满了鱼。马特和玛伊靠着这些好东西，吃得身宽体胖，一天比一天富。玛伊搅出大量黄油，马特雇了两个帮工来捕鱼。他面前的大海就像一只大鱼缸，想拉上多少鱼就有多少。红牛始终自己照顾自己，根本用不着他们费心。秋天，马特和玛伊离开岩石回陆地，红牛便一步步走进海里。第二年春天，夫妻俩回到岩上时，它已经站在那里等着他们了。
        - id: ch04-b02
          speaker: maie
          text: “旧屋连我们和帮工都住不下。我们得盖一所更好的房子。”
        - id: ch04-b03
          speaker: matte
          text: “是该盖了。”
        - id: ch04-b04
          speaker: narrator
          text: 马特盖起宽敞的新屋，门上安了真正的锁，又盖了鱼货仓库。他和帮工捕的鱼多得惊人，还把成吨的鲑鱼、鲱鱼和鳕鱼运到俄国和瑞典。
        - id: ch04-b05
          speaker: maie
          text: “家里人这么多，我忙得实在受不了。最好雇个姑娘来帮我。”
        - id: ch04-b06
          speaker: matte
          text: “那就雇一个。”
        - id: ch04-b07
          speaker: narrator
          text: 他们很快雇了一个女佣，可玛伊的心愿还在往上长。
        - id: ch04-b08
          speaker: maie
          text: “牛奶不够这么多人喝了。现在有女佣，照样花这些力气，她完全可以照顾三头牛。”
        - id: ch04-b09
          speaker: matte
          text: “好吧。你再去给精灵唱歌吧。”
        - id: ch04-b10
          speaker: narrator
          text: 马特的话让玛伊很不高兴。可星期日晚上，她还是划船出海，照旧唱起来。
        - id: ch04-b11
          speaker: maie
          text: “长须飘飘的阿赫蒂，住在湛蓝的大海里。你的牛群成百上千，求你赐给我三头奶牛。”
        - id: ch04-b12
          speaker: narrator
          text: 第二天早晨，岛上的牛由一头变成三头。它们全都吃海草，自己照料自己。
        - id: ch04-b13
          speaker: matte
          text: “这回你满足了吗？”
        - id: ch04-b14
          speaker: maie
          text: “要是再有两个女佣，还有几件更体面的衣服，我就满足了。你不知道吗？人家现在都叫我‘太太’呢。”
        - id: ch04-b15
          speaker: matte
          text: “好吧，好吧。”
        - id: ch04-b16
          speaker: narrator
          text: 玛伊又有了几个仆人，穿上了贵妇人的衣裳。但这还不算完美。
        - id: ch04-b17
          speaker: maie
          text: “咱们的夏季住宅还得好一点。你给我们盖一座两层楼，再运泥土来铺个花园。那边还要有座望海的小凉亭。晚上请个琴师来拉琴，再买一艘小汽船，风暴天也能载我们去教堂。”
        - id: ch04-b18
          speaker: matte
          text: “还有吗？”
        - id: ch04-b19
          speaker: narrator
          text: 马特嘴上这样问，还是把妻子要的一切全都办到了。岩上真的立起两层大房子，运来的泥土铺成了花园，能看海的小凉亭也盖好了。傍晚，琴师为他们拉琴。风浪不好时，小汽船便载他们去教堂。阿赫托拉岩变得气派非凡，玛伊也像个不得了的贵妇人。海里的海胆和鲱鱼看见这副景象，都奇怪得目瞪口呆。王子也过上了好日子。它顿顿吃牛排和奶油烤饼，最后浑身滚圆，胖得像一只黄油罐。
        - id: ch04-b20
          speaker: matte
          text: “现在你该满足了吧？”
        - id: ch04-b21
          speaker: maie
          text: “要是有三十头牛，我就满足了。这么大的家业，至少需要三十头。”
        - id: ch04-b22
          speaker: matte
          text: “那就找精灵要去。”
        - id: ch04-b23
          speaker: narrator
          text: 玛伊坐新汽船出海，再次向海王唱歌。第二天，岸边果然站着三十头牛，它们也都能自己找到食物。
        - id: ch04-b24
          speaker: maie
          text: “当家的，这块破岩石太挤了。这么多牛，我上哪儿给它们找地方？”
        - id: ch04-b25
          speaker: matte
          text: “没办法，只好把大海抽干。”
        - id: ch04-b26
          speaker: maie
          text: “胡说！谁能把大海抽干？”
          emotion: angry
        - id: ch04-b27
          speaker: matte
          text: “用新汽船试试。船上不是有水泵吗？”
        - id: ch04-b28
          speaker: narrator
          text: 玛伊知道丈夫在取笑她，脑子里却一直盘算这件事。海水抽不干，难道不能把海填起来吗？只要筑一道大堤，再堆上沙土和石头，小岛不就能扩大一倍了吗？

    - id: ch05
      title: 海王收回礼物
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 玛伊把汽船装满石头，开向大海。琴师也在船上，他拉出妙不可言的曲子。阿赫蒂、韦拉莫和海中所有的女儿都浮上水面，听起了音乐。
        - id: ch05-b02
          speaker: maie
          text: “浪花里闪得那么亮的是什么？”
        - id: ch05-b03
          speaker: fiddler
          text: “是海沫在阳光下发亮。”
        - id: ch05-b04
          speaker: maie
          text: “把石头丢下去。”
        - id: ch05-b05
          speaker: narrator
          text: 船上的人立刻抓起石头，往左右两边不停地扔。扑通，扑通，沉重的石头砸破闪亮的海沫，落向正在水下听琴的海中人。一块正正砸在韦拉莫的首席侍女鼻子上，另一块擦伤了海王后自己的脸颊。第三块咚地落在阿赫蒂脑袋旁，差一点就砸中了他，还一下扯掉了海王的半边胡子。海里顿时乱了套。刚才还在安静听琴的水流翻滚起来，海浪咕嘟咕嘟地冒泡，好像一锅水正在熊熊火上沸腾。
        - id: ch05-b06
          speaker: maie
          text: “这阵风是从哪里来的？”
        - id: ch05-b07
          speaker: narrator
          text: 话音还没落，大海忽然张开，一口吞下了整艘汽船。玛伊和船上的石头一起落入水中，她自己也像石头般往海底沉。她赶紧伸开手脚，拼命划水，一寸一寸往上浮，好不容易才重新露出水面。四周全是海水，汽船已经不见了。她忽然摸到琴师的小提琴，连忙抱紧它，把它当成浮具。正在这时，她发现身边浮着阿赫蒂那颗可怕的大脑袋。海王的脸就贴得那么近，可他威风的长胡子已经只剩下一半了。
        - id: ch05-b08
          speaker: ahti
          text: “你为什么拿石头砸我？”
          emotion: angry
        - id: ch05-b09
          speaker: maie
          text: “陛下，那只是个意外！您给胡子抹点熊油，它很快就能重新长好。”
        - id: ch05-b10
          speaker: ahti
          text: “好个妇人！你要的东西，我哪一样没给你？我给你的甚至比你要的还多。”
          emotion: angry
        - id: ch05-b11
          speaker: maie
          text: “是的，是的，陛下。多谢您赐给我那些牛。”
        - id: ch05-b12
          speaker: ahti
          text: “那你答应给我的太阳金子和月亮白银呢？”
        - id: ch05-b13
          speaker: maie
          text: “陛下，它们早早晚晚都洒在海面上。只有满天都是云的时候，您才看不到。”
        - id: ch05-b14
          speaker: narrator
          text: 玛伊这一句答得很狡猾。
        - id: ch05-b15
          speaker: ahti
          text: “我这就给你个教训！”
          emotion: angry
        - id: ch05-b16
          speaker: narrator
          text: 海王对着小提琴猛吹一口气。那口气一撞上琴，玛伊就像火箭一样冲上天，带着满身海水，以旋风般的速度飞回自己的小岛。可眼前的阿赫托拉，已经变回了从前的样子。那里没有两层大房子，没有花园和凉亭，也没有牛群、仆人和汽船。王子还像以前那么饿，正躺在地上啃一只乌鸦的尸体。马特也仍穿着那件破旧的灰上衣。他身边一个帮工也没有，只是独自坐在旧屋的台阶上，不紧不慢地补着渔网。
        - id: ch05-b17
          speaker: matte
          text: “天哪，老伴！你从哪里飞来的，怎么快得像旋风？还有，你怎么浑身湿透了？”
          emotion: surprised
        - id: ch05-b18
          speaker: narrator
          text: 玛伊惊讶地环顾四周。
        - id: ch05-b19
          speaker: maie
          text: “我们那座两层大房子呢？”
          emotion: surprised
        - id: ch05-b20
          speaker: matte
          text: “什么房子？”
        - id: ch05-b21
          speaker: maie
          text: “就是我们的大房子啊！还有花园、男佣女佣、三十头漂亮的牛、汽船，还有其他那一大堆东西呢？”
        - id: ch05-b22
          speaker: matte
          text: “你说的都是胡话，老伴。那几个学生真把你的脑子搅乱了。昨晚我们划船时，你一直唱那些傻歌。回来后你睡不着，直到天快亮才入睡。夜里起了大风暴。后来风暴停了，我不想叫醒你，就独自划船出去救渔网。”
        - id: ch05-b23
          speaker: maie
          text: “可我见到阿赫蒂了。”
        - id: ch05-b24
          speaker: matte
          text: “你一直躺在床上，做了些胡涂的梦。后来你梦游，自己走进了海里。”
        - id: ch05-b25
          speaker: maie
          text: “可小提琴明明就在这里。”
        - id: ch05-b26
          speaker: matte
          text: “这也叫小提琴？它只是一根旧木棍。好了，老伴，下回咱们都小心一点。星期日捕鱼，从来不会带来好运。”
        - id: ch05-b27
          speaker: narrator
          text: 这个故事选自Z·托佩利乌斯。
