  chapters:
    - id: ch01
      title: Ahtola and the Cow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a fisherman whose family name was Salmon and whose Christian name was Matte. He and his wife, Maie, lived beside the great sea. In winter they stayed in a small cottage on shore. Each spring they moved to a red rock far out at sea, and there they remained until autumn.
        - id: ch01-b02
          speaker: narrator
          text: Their summer cottage was smaller still. Its door had no iron lock, only a wooden bolt. Inside stood a hearth made of stone. A flagstaff rose beside the roof, and a weathercock turned above it. The rock itself was called Ahtola. From one end to the other, it was no larger than a town marketplace.
        - id: ch01-b03
          speaker: narrator
          text: A little rowan tree and four alder bushes grew in its cracks. Perhaps winter storms had carried them there. There were velvety tufts of grass, a few reeds, two yellow tansy plants, four red flowers, and one pretty white bloom. Maie's greatest treasures were three roots of garlic tucked into a sheltered cleft, with rock walls to the north and sunshine from the south. It was not much, but it served her as a garden.
        - id: ch01-b04
          speaker: narrator
          text: Matte and Maie fished for salmon in spring, herring in summer, and cod in winter. On a fine Saturday, with a helpful wind, they sailed to the nearest town to sell their catch and attend church the next day. Often, though, they spent weeks alone on Ahtola.
        - id: ch01-b05
          speaker: narrator
          text: Their only companion was a small yellow-brown dog with the grand name of Prince. Day after day, they looked at him, the grass and bushes, the few flowers, the bays and fish, the stormy sky, and the blue waves with their white crests. No green island or human home could be seen for miles. Here and there, another rock of the same red stone rose from the water, sprinkled with ocean spray by day and night.
        - id: ch01-b06
          speaker: narrator
          text: The couple were industrious and worked hard, yet they were happy in their poor hut. They counted themselves rich whenever they could salt enough casks of fish for winter and still have some catch left to sell. With that money, Matte bought tobacco. Maie bought a pound or two of coffee, with plenty of roasted grain and chicory mixed in for flavor. At home they had bread and butter, more fish, a cask of beer, and a jar of buttermilk. What else could two people need?
        - id: ch01-b07
          speaker: narrator
          text: Yet Maie had one secret longing that never left her. She wanted a cow.
        - id: ch01-b08
          speaker: matte
          text: What would you do with one? A cow couldn't swim all this way, and our boat couldn't carry her. Even if she reached the rock, we have nothing for her to eat.
        - id: ch01-b09
          speaker: maie
          text: We have four alder bushes and sixteen tufts of grass.
        - id: ch01-b10
          speaker: matte
          text: Of course we do. And don't forget our three garlic plants. A cow would find those delicious.
        - id: ch01-b11
          speaker: maie
          text: Cows like salt herring. Even Prince likes fish.
        - id: ch01-b12
          speaker: matte
          text: Perhaps, but a cow would cost us dearly if we fed her salt herring. Prince can fight the gulls for their last scraps. Forget the cow, mother. We are well off already.
        - id: ch01-b13
          speaker: narrator
          text: Maie sighed. She knew Matte was right, but she could not let go of the wish. Buttermilk no longer tasted good enough in her coffee. She kept thinking of sweet cream and fresh butter. Nothing in the world seemed finer.
    - id: ch02
      title: The Students and the Sea King
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, as Matte and Maie cleaned herring on the shore, Prince began to bark. A brightly painted boat came toward the rock with three young men aboard. They were students out for a boating trip, and they wanted something to eat.
        - id: ch02-b02
          speaker: student_1
          text: Good mother, bring us some junket!
        - id: ch02-b03
          speaker: maie
          text: Ah, if only I had some.
          emotion: sad
        - id: ch02-b04
          speaker: student_2
          text: Then bring us a can of fresh milk, and please don't skim off the cream.
        - id: ch02-b05
          speaker: maie
          text: If only I had that!
          emotion: sad
        - id: ch02-b06
          speaker: student_3
          text: What? You don't own a cow?
        - id: ch02-b07
          speaker: narrator
          text: The question struck Maie so deeply that she could not answer.
        - id: ch02-b08
          speaker: matte
          text: We have no cow, but we do have good smoked herring. We can cook them for you in a couple of hours.
        - id: ch02-b09
          speakers: [student_1, student_2, student_3]
          ensemble: chorus
          text: That will do nicely.
        - id: ch02-b10
          speaker: narrator
          text: The students stretched out on the rock while fifty silver-white herring turned on a spit before the fire.
        - id: ch02-b11
          speaker: student_1
          text: What do you call this little stone in the middle of the ocean?
        - id: ch02-b12
          speaker: matte
          text: Ahtola.
        - id: ch02-b13
          speaker: student_2
          text: Then you should never lack anything. You live in the Sea King's own realm.
        - id: ch02-b14
          speaker: narrator
          text: Matte had never read the Kalevala, the old Finnish songs about gods and heroes. He knew nothing about ancient sea gods, so the students explained.
        - id: ch02-b15
          speaker: student_3
          text: Ahti is a mighty king, and his realm is called Ahtola, just like your rock. Far below the waves, he has a rock of his own and a treasure house filled with good things. He rules every fish and every animal that lives in the deep.
        - id: ch02-b16
          speaker: student_1
          text: His cows are finer than any on land, and his horses are faster, though they graze beneath the ocean. If Ahti favors you, you can soon become rich. But take care. His temper changes quickly.
        - id: ch02-b17
          speaker: student_2
          text: Even a small stone tossed into the water might offend him. Then he takes back his gifts, whips the sea into a storm, and pulls sailors down into the depths.
        - id: ch02-b18
          speaker: student_3
          text: He also has the loveliest sea maidens. They carry the train of his queen, Wellamos. Whenever music sounds across the water, they rise and comb their long, flowing hair, and every strand glistens beneath the waves.
        - id: ch02-b19
          speaker: matte
          text: Have you gentlemen truly seen all that?
          emotion: surprised
        - id: ch02-b20
          speakers: [student_1, student_2, student_3]
          ensemble: chorus
          text: We have practically seen it. It is printed in a book, and whatever is printed must be true.
        - id: ch02-b21
          speaker: matte
          text: I'm not so certain about that.
        - id: ch02-b22
          speaker: narrator
          text: The herring were ready. The students ate enough for six people and gave Prince some cold meat from their boat. Delighted, he sat on his hind legs and mewed like a cat. Afterward, they paid Matte with a bright silver coin and shared some special tobacco for his pipe.
        - id: ch02-b23
          speaker: narrator
          text: They thanked Matte for his hospitality and sailed away. Prince missed them most of all. He sat on the shore with a mournful face, whining until the last little flash of their white sail disappeared in the distance. Maie had not spoken during the tale, but her good ears had caught every word about Ahti, and she took the whole story to heart.
        - id: ch02-b24
          speaker: maie
          text: A fairy cow would be wonderful. I could milk her every morning and evening without finding any feed. I could fill the shelf by the window with milk and junket. But such luck will never come to me.
        - id: ch02-b25
          speaker: matte
          text: What are you thinking about?
        - id: ch02-b26
          speaker: maie
          text: Nothing.
        - id: ch02-b27
          speaker: narrator
          text: All the while, she was turning over some magic fishing rhymes in her mind. Long ago, when she was a child, an old lame man had taught them to her and said they would bring fishermen luck. Perhaps one of those rhymes could bring another kind of luck. What if she tried?
    - id: ch03
      title: A Song on Saturday Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was Saturday. Matte never put out the herring net on Saturday evening, because he would not fish on Sunday. But as evening came, Maie spoke up.
        - id: ch03-b02
          speaker: maie
          text: Let us put out the net, just this once.
        - id: ch03-b03
          speaker: matte
          text: No. Tonight is Saturday night.
        - id: ch03-b04
          speaker: maie
          text: Last night was stormy, and we caught almost nothing. Tonight the sea is smooth as a mirror. With the wind this way, the herring are moving toward land.
        - id: ch03-b05
          speaker: matte
          text: I see streaks in the sky to the northwest, and Prince ate grass this evening.
        - id: ch03-b06
          speaker: maie
          text: He hasn't eaten my garlic, has he?
          emotion: surprised
        - id: ch03-b07
          speaker: matte
          text: No, but rough weather will be here by sunset tomorrow.
        - id: ch03-b08
          speaker: maie
          text: Listen. We'll set only one net, close to shore. Then we can fill our half-empty cask before the fish in it spoils.
        - id: ch03-b09
          speaker: narrator
          text: Maie kept urging him until Matte finally gave in. Together they carried the net to the boat and rowed away from the red shore. When they reached the deepest part of the water, Maie began humming the old fishing charm under her breath. But these were not quite the words she had learned in childhood. She changed them to fit the wish in her heart.
        - id: ch03-b10
          speaker: maie
          text: Oh, Ahti with the long, long beard, who lives beneath the deep blue sea. I hear that splendid treasures and glittering fish belong to you. Peerless pearls are stored below, and sleek sea cows graze in your green meadows.
        - id: ch03-b11
          speaker: maie
          text: King of all waters, I ask for neither gold nor pearls nor silver. One is odd and two is even, so give me a cow, bold Sea King. In return, I'll give you a slice of the moon and the sun's gold.
        - id: ch03-b12
          speaker: matte
          text: What are you humming there?
        - id: ch03-b13
          speaker: maie
          text: Only an old rhyme that keeps running through my head.
        - id: ch03-b14
          speaker: narrator
          text: Then she raised her voice.
        - id: ch03-b15
          speaker: maie
          text: Oh, Ahti with the long, long beard, who lives beneath the deep blue sea. A thousand cows are in your herd. I beg you, give one cow to me.
        - id: ch03-b16
          speaker: matte
          text: What a foolish song. If you beg the Sea King for anything, ask for fish. And Sunday is no time for magic songs.
        - id: ch03-b17
          speaker: narrator
          text: Maie pretended not to hear. She sang the same tune for as long as they stayed on the water. Matte rowed the heavy boat and thought about his cracked pipe and the students' fine tobacco. Soon they returned to Ahtola and went to bed.
        - id: ch03-b18
          speaker: narrator
          text: Neither of them slept. Matte worried because they had dishonored Sunday. Maie thought of Ahti's cow. Around midnight, the fisherman sat up.
        - id: ch03-b19
          speaker: matte
          text: Do you hear something?
        - id: ch03-b20
          speaker: maie
          text: No.
        - id: ch03-b21
          speaker: matte
          text: The weathercock is spinning on the roof. That means trouble. A storm is coming.
        - id: ch03-b22
          speaker: maie
          text: You're imagining it. Go back to sleep.
        - id: ch03-b23
          speaker: narrator
          text: Matte lay down, but soon he rose once more.
        - id: ch03-b24
          speaker: matte
          text: Now the weathercock is squeaking.
        - id: ch03-b25
          speaker: maie
          text: Nonsense. Go to sleep.
        - id: ch03-b26
          speaker: narrator
          text: He tried. Then, for the third time, he leaped out of bed.
        - id: ch03-b27
          speaker: matte
          text: Listen to it roar! It sounds as if there were a fire inside it. This is a tempest. We must bring in the net.
          emotion: fearful
        - id: ch03-b28
          speaker: narrator
          text: They both got up and opened the door. Though it was summer, the night was as dark as an October night. The weathercock creaked and shrieked above them, and the storm raged from every direction at once. The sea all around the rock was white with foam. Great sheets of spray flew clear over the fisherman's hut.
        - id: ch03-b29
          speaker: narrator
          text: In all his life, Matte could not remember another night like it. Launching the boat was unthinkable. If they tried to put to sea and rescue the net, the waves would take them at once. The couple could only stand stunned in the doorway. They held fast to the doorpost while wind-driven foam splashed across their faces.
        - id: ch03-b30
          speaker: matte
          text: Didn't I warn you? No good comes from fishing on Sunday.
          emotion: angry
        - id: ch03-b31
          speaker: narrator
          text: Maie was too frightened even to think about Ahti's cows. There was nothing they could do, so they went inside. Their eyes were heavy, and they slept soundly while the furious sea roared around their lonely home.
        - id: ch03-b32
          speaker: narrator
          text: When they woke, the sun was high. The tempest had ceased, and the sea rose in long silver swells against the red rock. Maie peered through the doorway.
        - id: ch03-b33
          speaker: maie
          text: What can that be?
        - id: ch03-b34
          speaker: matte
          text: It looks like a large seal.
        - id: ch03-b35
          speaker: maie
          text: As sure as I'm alive, it's a cow!
          emotion: surprised
        - id: ch03-b36
          speaker: narrator
          text: It was indeed a cow, a fine red one, fat and healthy, as though she had been fed spinach all her life. She wandered peacefully back and forth along the shore. To Maie's relief, she never so much as looked at the poor little tufts of grass. The cow passed them by as if such meager food were beneath her notice.
        - id: ch03-b37
          speaker: narrator
          text: Matte could hardly trust his eyes. He looked again and again, but the creature appeared to be a cow, and a cow she proved to be. Maie fetched her containers and began to milk the animal. One after another, every jug and pan was filled. At last she even used the boat's baler, and all of them brimmed with wonderfully delicious milk.
        - id: ch03-b38
          speaker: narrator
          text: Matte puzzled over the cow's arrival, then went to look for his lost net. He found it thrown onto shore and packed with so many fish that he could not see a single mesh.
        - id: ch03-b39
          speaker: matte
          text: Owning a cow is all very well, but what will we feed her?
        - id: ch03-b40
          speaker: maie
          text: We'll find a way.
        - id: ch03-b41
          speaker: narrator
          text: The cow found her own way. She ate the plentiful seaweed near the shore and stayed in excellent condition. Everyone thought her clever except Prince. He barked at his new rival.
    - id: ch04
      title: More and More
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: From that day, milk and dishes of junket overflowed on the red rock, and every net Matte cast came back full of fish. Fine food made both Matte and Maie plump, and the growing catch made them richer each day. Maie spent her time churning great quantities of fresh butter. There was too much fishing for Matte to manage alone, so he hired two men to work beside him.
        - id: ch04-b02
          speaker: narrator
          text: The sea before Matte seemed like a great fish tank. He had only to lower his nets and haul out as much as he needed, while the cow continued to find her own meals. In autumn, when Matte and Maie left Ahtola for their cottage on shore, the cow walked into the sea and vanished. The next spring, when their boat returned to the red rock, there she stood waiting for them.
        - id: ch04-b03
          speaker: maie
          text: We need a better house. This one is too small for us and the hired men.
        - id: ch04-b04
          speaker: matte
          text: Yes, we do.
        - id: ch04-b05
          speaker: narrator
          text: Matte built a large new cottage, and this door had a real lock. He added a separate storehouse for the catch. With two men working beside him, he brought in more fish than the family could ever use. Soon they were shipping tons of salmon, herring, and cod across the sea to Russia and Sweden.
        - id: ch04-b06
          speaker: maie
          text: All these people give me far too much work. I could use a girl to help me.
        - id: ch04-b07
          speaker: matte
          text: Then hire one.
        - id: ch04-b08
          speaker: narrator
          text: So they hired a servant girl. Before long, Maie found something else wanting.
        - id: ch04-b09
          speaker: maie
          text: We don't have enough milk for everyone. Now that I have a servant, she could care for three cows just as easily as one.
        - id: ch04-b10
          speaker: matte
          text: Very well. You can sing another song to the fairies.
        - id: ch04-b11
          speaker: narrator
          text: His irritated answer annoyed Maie. Even so, on Sunday night she rowed out and sang the charm again.
        - id: ch04-b12
          speaker: maie
          text: Oh, Ahti with the long, long beard, who lives beneath the deep blue sea. A thousand cows are in your herd. I beg you, give three cows to me.
        - id: ch04-b13
          speaker: narrator
          text: The next morning, three cows stood on the island instead of one. Like the first cow, they ate seaweed and looked after themselves.
        - id: ch04-b14
          speaker: matte
          text: Are you satisfied now?
        - id: ch04-b15
          speaker: maie
          text: I would be, if I had two servants to help me and some finer clothes. People call me Madam now, you know.
        - id: ch04-b16
          speaker: matte
          text: Well, well.
        - id: ch04-b17
          speaker: narrator
          text: Maie got several servants and clothes fit for a great lady. Still, perfection seemed to require a few more things.
        - id: ch04-b18
          speaker: maie
          text: We need a slightly better summer home. Build us a two-story house and bring soil for a garden. Put an arbor up high so we can enjoy the sea view. We should have a fiddler in the evenings, too, and a small steamer to carry us to church in stormy weather.
        - id: ch04-b19
          speaker: matte
          text: Is there anything else?
        - id: ch04-b20
          speaker: narrator
          text: Yet Matte did everything she wanted. He raised the two-story house, carried soil out to the bare rock, planted the garden, built the high arbor, hired the fiddler, and bought the little steamer. Ahtola and its mistress became so grand that even the sea urchins and herring stared in wonder. Prince dined on beefsteaks and cream scones until he was as round as a butter jar.
        - id: ch04-b21
          speaker: matte
          text: Are you satisfied now?
        - id: ch04-b22
          speaker: maie
          text: I would be, if I had thirty cows. A household like ours needs at least that many.
        - id: ch04-b23
          speaker: matte
          text: Go ask the fairies.
        - id: ch04-b24
          speaker: narrator
          text: Maie went out in the new steamer and sang to the Sea King. The next morning, thirty cows stood on the shore, all finding their own food.
        - id: ch04-b25
          speaker: maie
          text: Good man, this miserable rock is far too cramped. Where can I possibly put so many cows?
        - id: ch04-b26
          speaker: matte
          text: You'll have to pump the sea away.
        - id: ch04-b27
          speaker: maie
          text: Don't talk rubbish. Who could pump out the sea?
        - id: ch04-b28
          speaker: matte
          text: Try your new steamer. It has a pump.
        - id: ch04-b29
          speaker: narrator
          text: Maie knew he was making fun of her, but the problem stayed in her mind. She could never pump the sea dry. Perhaps she could fill part of it instead. With a great dam of sand and stones, she could make the island twice as large.
    - id: ch05
      title: Ahti Takes Back His Gifts
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Maie filled the steamer with a heavy load of stones and set out to begin her dam. The fiddler came with her. As the boat crossed the water, he played so beautifully that the music traveled down through the waves. Ahti and Queen Wellamos heard it, and all the daughters of the sea heard it too. The whole sea court rose to the surface to listen.
        - id: ch05-b02
          speaker: maie
          text: What is shining so brightly among the waves?
        - id: ch05-b03
          speaker: fiddler
          text: It is only sea foam glittering in the sun.
        - id: ch05-b04
          speaker: maie
          text: Throw out the stones.
        - id: ch05-b05
          speaker: narrator
          text: The people aboard began tossing the stones over the sides. Splash, splash, they fell to the left and right, straight into the shining foam. One struck the nose of Wellamos's chief lady-in-waiting. Another scraped the Sea Queen herself across the cheek. A third plunged down beside Ahti's head and tore away half of the Sea King's long beard.
        - id: ch05-b06
          speaker: narrator
          text: At once the sea heaved in confusion. The waves bubbled like water boiling in a pot.
        - id: ch05-b07
          speaker: maie
          text: Where did this sudden wind come from?
        - id: ch05-b08
          speaker: narrator
          text: The moment she spoke, the sea opened beneath the boat and swallowed the steamer whole. Maie went straight to the bottom like one of her stones. She spread her arms and legs and struggled upward until her head broke through the surface. The fiddler's instrument was floating nearby. She seized it with both hands and used it to keep herself above the water.
        - id: ch05-b09
          speaker: narrator
          text: Then the terrible head of Ahti appeared beside her. Half his beard was gone.
        - id: ch05-b10
          speaker: ahti
          text: Why did you throw stones at me?
          emotion: angry
        - id: ch05-b11
          speaker: maie
          text: Oh, Your Majesty, it was a mistake! Rub some bear grease on your beard. It will soon grow back.
          emotion: fearful
        - id: ch05-b12
          speaker: ahti
          text: Woman, did I not give you everything you asked for, and even more besides?
          emotion: angry
        - id: ch05-b13
          speaker: maie
          text: You did, Your Majesty. You truly did. Many thanks for the cows.
        - id: ch05-b14
          speaker: ahti
          text: Then where is the sun's gold and the moon's silver that you promised me?
          emotion: angry
        - id: ch05-b15
          speaker: maie
          text: Why, Your Majesty, they have been scattered over the sea by day and night, except whenever clouds covered the sky.
        - id: ch05-b16
          speaker: ahti
          text: I'll teach you to trick me!
          emotion: angry
        - id: ch05-b17
          speaker: narrator
          text: Ahti leaned close and blew one mighty puff against the fiddle. The blast caught the instrument and the woman clinging to it. Maie shot out of the water like a rocket, flew through the air at whirlwind speed, and landed back on her island.
        - id: ch05-b18
          speaker: narrator
          text: Prince lay there, as hungry as ever, gnawing the body of a crow. Matte sat alone on the old hut's steps in his ragged gray jacket, mending a net.
        - id: ch05-b19
          speaker: matte
          text: Good heavens, mother! Where have you come from at such speed, and why are you soaking wet?
          emotion: surprised
        - id: ch05-b20
          speaker: narrator
          text: Maie stared all around her in amazement.
        - id: ch05-b21
          speaker: maie
          text: Where is our two-story house?
          emotion: surprised
        - id: ch05-b22
          speaker: matte
          text: What house?
        - id: ch05-b23
          speaker: maie
          text: Our big house and flower garden! Where are the workers and servants, the thirty beautiful cows, the steamer, and everything else?
          emotion: surprised
        - id: ch05-b24
          speaker: matte
          text: You're talking nonsense, mother. Those students have turned your head. Last evening, while we rowed, you sang foolish songs. Then you couldn't sleep until early morning. A storm passed during the night. I let you rest while I rowed out alone to save the net.
        - id: ch05-b25
          speaker: maie
          text: But I saw Ahti.
        - id: ch05-b26
          speaker: matte
          text: You were in bed dreaming, mother. Then you walked into the water in your sleep.
        - id: ch05-b27
          speaker: maie
          text: But the fiddle is right there.
        - id: ch05-b28
          speaker: matte
          text: Some fiddle! That's nothing but an old stick. No, old woman, we will be more careful next time. Good luck never comes from fishing on Sunday.
