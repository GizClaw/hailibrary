  chapters:
    - id: ch01
      title: Bob White and Carol the Meadow Lark
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            “Bob—Bob White! Bob—Bob White! Bob—Bob White!” The clear, sweet call floated all the way to the dear Old Briar-patch. Before long, Peter couldn't resist it. He simply had to pay an early morning visit to one of his very best friends. At this time of year, that friend loved to whistle his own name—Bob White.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            I suppose Bob White has a nest. I wish he'd show it to me, but he keeps it terribly secret. Last year I searched until my feet were sore and never found a thing. Then one morning I met Mrs. Bob White taking fifteen babies for a walk. How could she possibly hide a nest with fifteen eggs in it?
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter left the Old Briar-patch and crossed the Green Meadows toward the Old Pasture. As he drew near the fence between the meadows and the pasture, he saw Bob White perched on one of the posts. Bob was whistling with all his might. Another bird sat on a nearby post. He was almost as large as Welcome Robin, and he too was telling the whole world how happy he was. It was Carol the Meadow Lark.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter watched his two friends so closely that he paid no attention to where he stepped. All at once, wings whirred almost under his nose. He stopped short and nearly squealed with fright. A moment later, he knew the bird was Mrs. Meadow Lark. She flew toward Carol, beating her sturdy little wings quickly, then sailing with them spread wide. She fluttered again to gain speed and sailed once more. The white outer feathers in her tail showed plainly. They reminded Peter of Sweetvoice the Vesper Sparrow's tail, only much larger.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter stayed still until Mrs. Meadow Lark landed on the fence beside Carol. He was about to hurry over for some gossip when he happened to look down. There, almost beneath his feet, was something so surprising that he squealed aloud. A nest held four of the prettiest eggs he had ever seen. They were white and covered with brown spots.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Without those eggs, Peter would never have noticed the nest. He could have looked straight at it and missed it completely. Dry brown grass formed it, and a little clump of dead grass bent over it until it was almost completely hidden. What surprised him most was the clever entrance. Even the way into the nest was concealed. A small tunnel through the grass led straight to it.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            Oh! This must be Mrs. Meadow Lark's nest. No wonder I can never find it when I search. I found it this time only by luck. What a wonderful way to hide a home! I certainly hope Jimmy Skunk isn't nearby.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter sat upright and anxiously searched in every direction. Jimmy Skunk was nowhere in sight, and Peter sighed with relief. He carefully walked around the nest and its little tunnel. Then he hurried toward the fence as fast as he could go.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            It's perfectly beautiful, Carol! And I won't tell anyone!
        - id: ch01-b10
          speaker: mrs_meadow_lark
          text: >-
            I certainly hope you won't! If I thought you'd tell one living soul about my nest, I'd never have another peaceful minute. Promise me, Peter. Cross your heart and promise you won't tell.
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: >-
            Peter promptly crossed his heart and promised not to tell a single soul. Mrs. Meadow Lark seemed to feel better after that. She flew back at once, and Peter turned to watch her. She vanished into the grass, but not where he had found the nest.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter waited several minutes. He thought she would rise into the air again, then fly over to the nest. He watched and watched, but waited in vain. At last, with a puzzled look on his face, he turned toward Carol on the fence.
        - id: ch01-b13
          speaker: narrator
          text: Carol's eyes twinkled, and he chuckled.
        - id: ch01-b14
          speaker: carol_meadow_lark
          text: >-
            I know exactly what you're wondering, Peter. Mrs. Meadow Lark was so worried about our nest, yet she didn't fly straight back to it. But she's much too clever to do anything that foolish. Someone might see her and discover our secret. From the place where she dropped into the grass, she walked to the nest. That's how we always go home. These days, we can never be too careful.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Then Carol poured out his happiness in song again, as though nothing had interrupted him.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Somehow, Peter had never noticed before how handsome Carol was. From a distance, no one would have guessed it. But now Carol faced Peter, showing a beautiful yellow throat and yellow waistcoat, with a broad black crescent across his breast. A yellow line ran above each eye. His back was brown with black markings. His whitish sides were covered in black spots and streaks, and the outer edges of his tail were white. Seen this close, he really was a handsome bird.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Now that Peter knew Carol's secret, he wanted more than ever to discover Bob White's home. He hurried to the post where Bob was still whistling with all his might.
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            Bob! I've just found Carol's nest, and I promised to keep it secret. If I promise the same thing about your nest, will you show it to me too?
        - id: ch01-b19
          speaker: narrator
          text: Bob threw back his head and laughed joyfully.
        - id: ch01-b20
          speaker: bob_white
          text: >-
            By now, Peter, you ought to know that some secrets must never be told to anyone. My nest is one of them. If you find it, that's fine. But I wouldn't show it even to my very best friend, and I don't believe I have a better friend than you.
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: From pure happiness, Bob whistled with all his strength.
        - id: ch01-b22
          speaker: bob_white
          text: Bob—Bob White! Bob—Bob White!
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: Peter felt disappointed and a little cross.
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            I could find it if I really wanted to. I don't suppose it's hidden any better than Mrs. Meadow Lark's nest, and I found that one. Some people aren't quite as clever as they imagine.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Bob White is sometimes called Quail and sometimes Partridge, though he is neither one. He chuckled heartily at Peter.
        - id: ch01-b26
          speaker: bob_white
          text: >-
            Go right ahead, old Mr. Curiosity. Hunt as much as you like. It makes me laugh when someone thinks he's clever, though he was really just lucky. You know you found Carol's nest by accident. If you happen to find mine too, I won't say a word.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Bob drew a long breath. He tipped his head so far back that his bill pointed into the blue, blue sky, and once again he whistled his name with all his might.
        - id: ch01-b28
          speaker: bob_white
          text: Bob—Bob White! Bob—Bob White!
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: >-
            As Peter looked up, he realized that Bob was the plumpest bird he knew. In fact, his body seemed almost round. Bob's tail was very short, and that made him look rounder still. The upper part of his coat was a handsome reddish brown, marked with dark streaks and light-colored edges. The same rich reddish brown covered his sides and the upper part of his breast. Underneath, his feathers were whitish, crossed by little bars of black.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Bob's throat was white, and a broad white stripe lay above each eye. Black bordered the white throat, and another black band separated it from the stripe over his eye. The top of his head was mixed black and brown. He was a handsome little fellow in his own modest way.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Suddenly, Bob stopped whistling. He looked down at Peter with a twinkle in his eye.
        - id: ch01-b32
          speaker: bob_white
          text: Why aren't you hunting for that nest, Peter?
        - id: ch01-b33
          speaker: peter_rabbit
          text: I'm going now.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Peter answered rather shortly. He knew that Bob also knew he had no idea where to begin. The nest might be somewhere on the Green Meadows, or it might be in the Old Pasture. Bob hadn't offered even the smallest hint.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Peter felt sure the nest wasn't far away. He also had a feeling it was somewhere on the Green Meadows, so that was where he began to search. He ran this way and that without the least idea where he was going. All the while, he felt very foolish. Of course he knew that Bob was watching from his post and chuckling to himself.
        - id: ch01-b36
          speaker: narrator
          text: >-
            It was very warm down on the Green Meadows, and Peter soon grew hot and tired. He decided to seek the shade of an old bramble-tangle in the Old Pasture. Just beyond the fence ran a path made by the cows. Farmer Brown's boy, Reddy Fox, and other visitors to the Old Pasture often used it too.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Peter scampered along that path, lipperty-lipperty-lip, heading for the bramble-tangle. He never glanced right or left. It didn't occur to him that looking could possibly do any good. After all, surely no one would build a nest close to a path where people passed back and forth every day.
        - id: ch01-b38
          speaker: narrator
          text: >-
            And so, in his happy-go-lucky way, Peter hurried straight past a clump of tall weeds growing close beside the path. He passed without the faintest suspicion that the very thing he had been searching for was cleverly hidden inside it.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Shrewd little Mrs. Bob White watched him pass, laughter in her eyes. She sat hidden in the weeds with sixteen white eggs beneath her. Peter went by without ever seeing her. She had chosen that spot because she knew it was the last place anyone would think to search. It seemed like the most dangerous place she could possibly choose, and that was exactly what made it the safest.
