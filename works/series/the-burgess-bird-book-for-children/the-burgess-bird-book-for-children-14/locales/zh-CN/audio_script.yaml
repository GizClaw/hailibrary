audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    meadow_lark_carol:
      display_name: 草地鹨卡罗尔
      tts:
        delivery: 快活机敏，笑声里带着自信
        timbre: 清亮圆润
        pace: 明快
        pitch: 中高音
    mrs_meadow_lark:
      display_name: 草地鹨太太
      tts:
        delivery: 谨慎敏锐，关切时语气急切
        timbre: 柔和清晰
        pace: 适中略快
        pitch: 中高音
    bob_white:
      display_name: 白喉鲍勃
      tts:
        delivery: 爽朗沉着，打趣时透着机灵
        timbre: 饱满温厚
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十四章　白喉鲍勃和草地鹨卡罗尔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            “鲍勃——白！鲍勃——白！鲍勃——白！”这声口哨又清亮又甜，一直飘进亲爱的老荆棘丛。兔子彼得听得再也坐不住了。他一定要去问候那位最要好的朋友。每到这个季节，那位朋友最喜欢吹着口哨告诉大家，自己名叫白喉鲍勃。
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            我猜白喉鲍勃一定有巢了。要是他肯带我去看看就好了，可他把巢藏得太神秘啦。去年我一直找到脚都疼了，还是没找到。后来有一天早晨，我却碰见鲍勃太太带着十五个宝宝散步。装着十五枚蛋的巢，她到底是怎么藏住的呢？
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得离开老荆棘丛，穿过绿草地，往老牧场走。快到两处之间的篱笆时，他看见白喉鲍勃站在一根篱柱上，正拼命吹口哨。不远处的另一根篱柱上，停着一只差不多和知更鸟迎客一样大的鸟。他也在向全世界唱出心里的快乐。那是草地鹨卡罗尔。
        - id: ch01-b04
          speaker: narrator
          text: >-
            彼得看得太专心，连脚下都忘了留意。忽然，几乎就在他鼻尖底下，传来扑棱棱一阵响。他猛地停下，吓得差点叫出声来。彼得马上认出，那是草地鹨太太。她正飞向唱歌的卡罗尔。
        - id: ch01-b05
          speaker: narrator
          text: >-
            她先用那双结实的小翅膀飞快地扇几下，接着把翅膀平展开来，一动不动地向前滑翔。然后，她再扑扇几下，等飞得够快了，又张开双翼向前滑去。她就这样一会儿振翅，一会儿滑翔。尾巴外侧的白羽清清楚楚，让彼得想起晚祷雀甜嗓的尾巴，只是她的尾巴大得多。
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得坐着没动，一直等草地鹨太太落到卡罗尔附近的篱笆上。他急着过去跟朋友们聊聊，刚要动身，却碰巧低头看了一眼。这一看，他当场叫了出来。几乎就在脚边，竟然藏着一座鸟巢，里面放着四枚他从没见过那么漂亮的蛋。蛋壳雪白，布满了褐色斑点。
        - id: ch01-b07
          speaker: narrator
          text: >-
            要不是看见这些蛋，彼得永远也发现不了那座巢，永远不会。它用枯黄的干草筑成，藏在一小丛倒伏的枯草下面，遮得严严实实。更让彼得吃惊的是，连入口也藏起来了。要到巢里去，得穿过一条真正的草叶小隧道。彼得的眼睛高兴得闪闪发亮。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            哎呀，这一定是草地鹨太太的巢！难怪我以前专门寻找，却怎么也找不到。这回能发现，全是我运气好。她竟然能把家藏成这样，实在太了不起了。但愿臭鼬吉米不在附近。
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: >-
            彼得直起身子，担心地朝四周看了又看。哪儿都没有臭鼬吉米，他这才松了口气。他小心地绕过鸟巢和那条草叶隧道，飞快地赶向篱笆。
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            卡罗尔，那座巢真是漂亮极了！你放心，我绝不会告诉任何人！
          emotion: happy
        - id: ch01-b11
          speaker: mrs_meadow_lark
          text: >-
            但愿你真的说到做到。要是你把我的巢告诉别人，我以后就一刻也别想安心了。彼得，你答应我，千万别说出去。你要划心保证，答应我谁也不告诉。
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: >-
            彼得立刻在胸前划了个十字，答应替她守住秘密。草地鹨太太好像放心了，马上飞了回去。彼得盯着她，只见她钻进草丛，却不是在他发现鸟巢的地方。
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得等了几分钟，以为她还会飞起来，再落到巢边。可是左等右等，她就是没有出现。他只好满脸疑惑地转过身，抬头望着卡罗尔。
        - id: ch01-b14
          speaker: narrator
          text: 卡罗尔眼里闪着笑意。他轻轻笑了起来，一看就知道彼得在纳闷什么。
        - id: ch01-b15
          speaker: meadow_lark_carol
          text: >-
            彼得，你是不是觉得，她那么担心我们的巢，怎么不直接飞回去呢？她才不会做那种傻事。要是有人看见她，不就会发现我们的秘密吗？她从刚才钻进草丛的地方，已经一路走回巢里了。我们回巢时总是这样走。如今呀，再小心也不算过分。
        - id: ch01-b16
          speaker: narrator
          text: >-
            说完，卡罗尔又唱起心里的快乐，仿佛他的歌从来没有停过。
        - id: ch01-b17
          speaker: narrator
          text: >-
            彼得到这时才发现，草地鹨卡罗尔原来这么英俊。卡罗尔正面对着他，鲜黄色的喉咙和背心看得一清二楚，胸前还有一道宽宽的黑色新月。两只眼睛上方各有一条黄纹。后背是带黑色花纹的褐色，身体两侧发白，点着黑斑，也带着一道道黑纹，尾巴的外缘则是白色。总的说来，他的确很漂亮。这样仔细一看，他可比远远望去时漂亮多了。
        - id: ch01-b18
          speaker: narrator
          text: >-
            彼得已经发现了卡罗尔的秘密，现在更想找到白喉鲍勃的家。他赶到鲍勃站着的篱柱下面，抬起头来问他。
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            鲍勃，我刚发现了卡罗尔的巢，也答应替他保密。要是我也答应替你保密，你能不能带我看看你的巢？
        - id: ch01-b20
          speaker: narrator
          text: 鲍勃仰起脑袋，快活地笑了。
        - id: ch01-b21
          speaker: bob_white
          text: >-
            彼得，你早该知道，有些秘密永远也不能告诉别人。我的巢就是这样的秘密。你自己找到，那当然可以。可就算是最好的朋友，我也不会带他去看。我想，我最好的朋友就是你了，彼得。
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: 他实在太快乐了，又用尽力气吹起口哨。
        - id: ch01-b23
          speaker: bob_white
          text: 我叫鲍勃——白，鲍勃——白！
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: 彼得很失望，还有点不高兴。
        - id: ch01-b25
          speaker: peter_rabbit
          text: >-
            只要我真想找，一定能找到。你的巢才不会比草地鹨太太的巢藏得更好，她的还不是被我发现了。有些人可没有自己想的那么聪明。
        - id: ch01-b26
          speaker: narrator
          text: >-
            有人把白喉鲍勃叫作鹌鹑，也有人叫他山鹑，可他其实两种都不是。听了彼得的话，他忍不住笑出了声。
        - id: ch01-b27
          speaker: bob_white
          text: >-
            去吧，爱管闲事的老先生。你想怎么找都行。有些人明明只是运气好，却以为自己很聪明，这才好笑呢。你也知道，卡罗尔的巢只是碰巧被你看见了。要是你碰巧也找到我的巢，我一句话都不说。
        - id: ch01-b28
          speaker: narrator
          text: >-
            白喉鲍勃深深吸了一口气，把头一直向后仰，嘴尖对准高高的蓝天。接着，他又用尽全身力气吹响自己的名字。
        - id: ch01-b29
          speaker: bob_white
          text: 我叫鲍勃——白，鲍勃——白！
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: >-
            彼得望着鲍勃，忽然觉得，这是自己认识的鸟儿里最圆胖的一只。他胖得身子几乎成了圆球，短短的尾巴又让他显得更圆了。鲍勃的上衣是漂亮的红褐色，上面带着深色条纹，羽毛边缘颜色很浅。他的身体两侧和胸脯上半部也是红褐色，下面发白，横着一道道黑色细纹。
        - id: ch01-b31
          speaker: narrator
          text: >-
            鲍勃的喉咙雪白，两眼上方各有一道宽宽的白纹。白喉咙四周镶着黑边，还有一条黑带把喉部和眼睛上方的白纹隔开。头顶是黑色和褐色相杂。这个小家伙并不张扬，可看起来真俊俏。
        - id: ch01-b32
          speaker: narrator
          text: 白喉鲍勃忽然停下口哨，眼睛里闪着顽皮的光。他低头看向彼得。
        - id: ch01-b33
          speaker: bob_white
          text: 彼得，你怎么还不去找那座巢呀？
        - id: ch01-b34
          speaker: peter_rabbit
          text: 我这就去。
        - id: ch01-b35
          speaker: narrator
          text: >-
            彼得回答得有点生硬。他知道，鲍勃早就看出来了，他根本不知道该往哪里找。鸟巢可能在绿草地上，也可能在老牧场里，鲍勃一点提示也没给。
        - id: ch01-b36
          speaker: narrator
          text: >-
            彼得觉得巢应该就在附近，而且多半在绿草地上。他便东跑跑，西跑跑，漫无目的地找起来。他越找越觉得自己很傻，因为鲍勃一定正在看着他，还在心里偷偷发笑。
        - id: ch01-b37
          speaker: narrator
          text: >-
            绿草地上很闷热，彼得渐渐又热又累。他决定到老牧场去，在一丛老刺藤下面的阴凉里歇一歇。篱笆另一边有条牛踩出来的小路。农夫布朗家的男孩、狐狸雷迪，还有别的访客，都常沿着它走进老牧场。
        - id: ch01-b38
          speaker: narrator
          text: >-
            彼得沿着这条小路，蹦蹦跳跳地奔向刺藤丛。他既不看左边，也不看右边。他觉得四处张望根本没有用。毕竟，谁会把巢筑在一条天天有人走来走去的小路旁边呢？
        - id: ch01-b39
          speaker: narrator
          text: >-
            就这样，彼得轻轻松松地跑过路边一丛高高的野草，完全没想到，自己正在寻找的东西就巧妙地藏在里面。精明的鲍勃太太伏在十六枚白色鸟蛋上，眼含笑意地看着他跑了过去。
        - id: ch01-b40
          speaker: narrator
          text: >-
            鲍勃太太特意把巢筑在这里，因为她知道，谁也不会想到要来这里寻找。这个地方看上去最危险，却正因为如此，成了最安全的地方。
