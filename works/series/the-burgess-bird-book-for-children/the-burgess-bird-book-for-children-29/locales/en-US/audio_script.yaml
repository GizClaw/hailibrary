audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, outspoken, and sharply expressive
        timbre: small and bright
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: The Constant Singers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mr. and Mrs. Redeye the Vireos lived in a maple tree at the edge of Farmer Brown's dooryard. Jenny Wren had told Peter Rabbit about their nest there, though he could almost have guessed it. All through the nesting season, Redeye spent much of his time in that tree. Whenever Peter visited the Old Orchard, no matter what time it was, he heard Redeye singing among the maple leaves. If singing showed how happy a bird was, Peter thought Redeye must be the happiest bird alive.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Redeye was a little fellow, about as big as one of the larger Warblers. He dressed as modestly as any of Peter's bird friends. There was nothing showy about his feathers. The top of his head was gray, with a dark border along each side, and a white line ran over each eye. He was white underneath and light olive-green everywhere else. The first time he came low enough for Peter to see him clearly, Peter understood his name at once. His eyes really were red. Yes, they truly were red, and that one fact set him apart from every other member of his family.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Redeye rarely came so close to the ground that Peter could see his eyes. He preferred the treetops, so Peter caught only an occasional glimpse of him among the leaves. But even when Peter did not see Redeye, he almost always heard him. The song seemed to go on without end.
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            When does Redeye ever find time to eat?
        - id: ch01-b05
          speaker: jenny_wren
          text: >-
            Redeye sings while he works. I should think he'd wear out his throat. Other birds stop everything else when they sing, but not Redeye. He keeps singing while he hunts for his meals. He pauses just long enough to swallow a worm or bug, then starts right up again as he looks for another. Still, I have to admit that the Redeyes build excellent nests. Have you seen theirs in the maple tree, Peter?
        - id: ch01-b06
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            I only dare go over there very early, before Farmer Brown's family wakes up. I haven't had much chance to look for it.
        - id: ch01-b08
          speaker: jenny_wren
          text: >-
            You probably couldn't see it anyway. They built it rather high above the ground, and the leaves are so thick that they hide it. The nest is a neat little basket, fastened in a fork near the very end of a branch. It's woven almost as beautifully as Goldy the Oriole's nest. How anyone has enough patience to weave a nest like that is beyond me.
        - id: ch01-b09
          speaker: peter_rabbit
          text: What do they make it from?
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            Strips of bark, plant down, spiderweb, grass, and bits of paper! Redeye simply loves having paper in his nest. I can't imagine why. He fusses over finding a scrap of paper just as much as Cresty the Flycatcher fusses over getting a piece of snakeskin. I peeked into that nest a few days ago, and unless I made a great mistake, Sally Sly the Cowbird has tricked the Redeyes. I'm sure I saw one of her eggs in there.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A few mornings after that talk about Redeye, Peter returned to the Old Orchard. He had barely come into sight when Jenny Wren's tongue began to fly.
        - id: ch01-b12
          speaker: jenny_wren
          text: >-
            What did I tell you, Peter Rabbit? What did I tell you? I knew I was right, and I was!
        - id: ch01-b13
          speaker: peter_rabbit
          text: What were you right about?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Peter sounded rather cross. He had no idea what Jenny meant.
        - id: ch01-b15
          speaker: jenny_wren
          text: >-
            Sally Sly did leave an egg in Redeye's nest. Now it has hatched, and I don't know what will happen to the Redeyes' own children. It's scandalous. Perfectly scandalous!
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            Jenny hopped about, jerked her tail, and worked herself into a small brown fury.
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            The Redeyes are wearing themselves down to feathers and bone trying to feed that ugly young Cowbird. Their own babies aren't getting half enough to eat. One has already died. That young brute kicked him out of the nest.
          emotion: angry
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            That's dreadful! If he behaves like that, why don't the Redeyes throw him out instead?
          emotion: surprised
        - id: ch01-b19
          speaker: jenny_wren
          text: >-
            They're too softhearted. I wouldn't be, if I were in their place. No, sir-ee! But they say he can't help being there. He's only a helpless baby, so they keep taking care of him.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            Then why don't they feed their own babies first and give him whatever is left?
        - id: ch01-b21
          speaker: jenny_wren
          text: >-
            Because he's twice as big as any of their own babies. He's so strong and greedy that he snatches food right out of the others' mouths. Since he gets most of the food, he's growing twice as fast as they are. I wouldn't be surprised if he kicks every one of them out before he's finished. Mr. and Mrs. Redeye are terribly upset about it, but they still feed him because they say it isn't his fault. It's a dreadful business, and the whole Orchard is talking about it. His mother is probably off somewhere enjoying herself, without caring one flip of her tail feathers what happens to him. I believe in being kindhearted, but you can carry a good thing too far. Thank goodness I'm not weak-minded enough to let anyone trick me that way.
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            Now that we're talking about Vireos, Redeye seems to be the only member of his family around here.
        - id: ch01-b23
          speaker: jenny_wren
          text: >-
            Listen! Don't you hear that warbling song far over in the big elm in front of Farmer Brown's house, where Goldy the Oriole has his nest?
        - id: ch01-b24
          speaker: narrator
          text: >-
            Peter stopped and listened. At first he heard nothing at all. As usual, Jenny made fun of him for having such big ears and not knowing how to use them better. After a while, he finally caught the distant song. The voice sounded something like Redeye's, but this song was smoother and sweeter, and it flowed along without so many breaks. Peter's face brightened when he recognized it.
        - id: ch01-b25
          speaker: peter_rabbit
          text: I hear it now!
          emotion: happy
        - id: ch01-b26
          speaker: jenny_wren
          text: >-
            That's Redeye's cousin, the Warbling Vireo. He sings better than Redeye does, and he likes hearing his own voice just as much. He starts when jolly Mr. Sun gets up and keeps going until Mr. Sun goes to bed. Even when the day is so hot that the rest of us stay quiet just to be comfortable, he keeps right on singing. And I don't know any bird more fond of the treetops. He doesn't seem to care at all for the Old Orchard. He stays in those tall trees beside the road. His nest is high in that big elm, just as high as Goldy the Oriole's. I haven't seen it myself, but Goldy told me about it. Why such a small bird wants to live so high above the ground is beyond me. Then again, I can't understand why anyone would want to live anywhere but the Old Orchard.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            Somehow I can't quite remember what Warble looks like.
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            He looks a great deal like his cousin Redeye. His coat is a duller olive-green, and underneath he's a little yellowish instead of white. His eyes aren't red, of course, and he's a bit smaller than Redeye. When you look at the whole family, though, they all look very much alike.
        - id: ch01-b29
          speaker: peter_rabbit
          text: >-
            That's certainly true, Jenny. They get me completely mixed up. If a few of them had bright colors, telling them apart would be much easier.
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            One of them does. His throat and breast are bright yellow, so they call him the Yellow-throated Vireo. You couldn't possibly mistake him.
        - id: ch01-b31
          speaker: peter_rabbit
          text: Does he sing too?
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            Of course he does. Every bird in that blessed family loves the sound of his own voice. It runs in the family. Sometimes my throat feels sore just from listening to them all day. Even a good thing becomes too much when there's more than enough of it. Gossip is the same way, and I've already wasted more time on you than I should. Now hop along, Peter, and don't bother me again today.
        - id: ch01-b33
          speaker: narrator
          text: Peter hopped away.
