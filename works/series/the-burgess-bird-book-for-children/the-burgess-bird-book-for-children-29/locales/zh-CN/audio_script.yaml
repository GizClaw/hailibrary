audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 细亮有穿透力
        pace: 快速紧凑
        pitch: 高音
  chapters:
    - id: ch01
      title: 枫树上唱个不停的红眼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            农夫布朗家门前的院子边上有一棵枫树，红眼绿鹃先生和太太就住在那里。鹪鹩珍妮早就告诉过兔子彼得，树上有他们的巢。不过，就算珍妮不说，彼得也能猜到。每逢筑巢育雏的时节，红眼总在那棵树上待很久。不管彼得一天里的什么时候来到老果园，都能听见他的歌声。彼得常想，要是歌声代表快乐，那红眼一定是所有鸟儿里最快活的一个。
        - id: ch01-b02
          speaker: narrator
          text: >-
            红眼个子不大，跟体形较大的林莺差不多，衣裳也十分朴素。他头顶是灰色的，两边各有一道近乎黑色的细边。双眼上方带着白纹，腹面雪白，其余地方则是浅浅的橄榄绿。直到有一回，红眼飞得够低，彼得才终于看清，他为什么会有这个名字。原来，他真的长着一双红眼睛。没错，单凭这双眼睛，就能把他和家族里的其他成员分开。
        - id: ch01-b03
          speaker: narrator
          text: >-
            可红眼很少来到离地面这么近的地方。他喜欢待在树梢，彼得只能偶尔看见他。不过，彼得虽然不常见到红眼，却几乎总能听见他。
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            红眼一直这样唱，到底什么时候才吃东西呀？
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得听着枫树上没完没了的歌声，实在想不明白。
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            红眼喜欢边干活边唱歌。要是换成我，早就担心自己把嗓子唱坏啦。别的鸟儿一唱歌，就顾不上别的事。红眼可不一样，他找食物的时候也一直唱，只有找到虫子，把它咽下去的那一小会儿才住嘴。刚咽完，他马上又唱着去找下一条。话说回来，红眼夫妇筑巢的手艺真是没得挑。彼得，你看见他们在枫树上搭的巢了吗？
        - id: ch01-b07
          speaker: narrator
          text: >-
            彼得摇了摇头。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            那边我可不敢随便去。只有一大早，农夫布朗一家还没醒，我才敢过去，所以一直没机会好好找。
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            就算你去了，多半也找不到。那个巢搭得很高，周围的叶子又密，早就把它挡严了。它像一只小篮子，牢牢系在树枝末端的枝杈里，编得几乎和金羽拟鹂的巢一样精巧。我真不懂，怎么会有谁耐得住性子，编出那样的巢。
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            他们用什么东西编的？
        - id: ch01-b11
          speaker: jenny_wren
          text: >-
            有树皮条、植物绒毛、蜘蛛网、草，还有碎纸片！红眼有个怪脾气，巢里一定要放一片纸。我可猜不出那有什么用。他挑那片纸，就跟冠冠霸鹟非要一片蛇皮一样。几天前，我往巢里瞥了一眼。除非我看错了，不然，狡猾莎莉牛鹂又把别人骗了。我敢肯定，红眼的巢里有她的一枚蛋。
    - id: ch02
      title: 红眼巢里的小恶棍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            几天后的一个早晨，彼得又来到老果园。他才刚露面，珍妮那张嘴就噼里啪啦地说开了。
        - id: ch02-b02
          speaker: jenny_wren
          text: >-
            兔子彼得，我那天怎么告诉你的？我就知道是这么回事，现在果然证实了！
        - id: ch02-b03
          speaker: peter_rabbit
          text: >-
            到底什么事证实了？
        - id: ch02-b04
          speaker: narrator
          text: >-
            彼得有点儿不耐烦。他根本不知道珍妮在说什么。
        - id: ch02-b05
          speaker: jenny_wren
          text: >-
            狡猾莎莉真的把蛋下在红眼巢里了，现在那只小牛鹂已经孵出来啦！红眼自己的孩子可怎么办？这简直太不像话了，实在太不像话了！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            珍妮气得跳来跳去，尾巴甩个不停，整只鸟简直成了一小团褐色的怒火。
        - id: ch02-b07
          speaker: jenny_wren
          text: >-
            红眼夫妇为了喂那个丑陋的小家伙，忙得只剩羽毛和骨头，可他们自己的孩子连一半食物都吃不到。已经有一只死了，就是那个小恶棍把他踢出巢的！
          emotion: angry
        - id: ch02-b08
          speaker: peter_rabbit
          text: >-
            太可怕了！他都做出这样的事了，红眼夫妇就该把他也扔出去。
          emotion: surprised
        - id: ch02-b09
          speaker: jenny_wren
          text: >-
            他们就是心太软。换成我，我可不会这样，绝对不会！可是他们说，小牛鹂会待在巢里又不是他的错，他也只是个没法照顾自己的孩子。所以，他们还是继续照料他。
        - id: ch02-b10
          speaker: peter_rabbit
          text: >-
            那就先喂自己的孩子呀，剩下的再给他，不行吗？
        - id: ch02-b11
          speaker: jenny_wren
          text: >-
            哪有那么容易？他的个头是其他孩子的两倍，又壮又贪吃，直接从他们嘴里抢食物。大部分吃的都让他吞了，他当然也长得快一倍。照这样下去，他把剩下的孩子全踢出巢，我也不会奇怪。红眼夫妇难过得不得了，可还是要喂他，因为他们总说，这不是他的错。
        - id: ch02-b12
          speaker: jenny_wren
          text: >-
            这件事糟透了，整个老果园都在议论。我看，小牛鹂的母亲准在什么地方四处闲逛，只顾自己玩得痛快，对孩子以后会怎么样，连尾羽尖儿都不在乎。我也赞成待人厚道，可好心过了头就不对了。谢天谢地，我可没有那么软弱糊涂，谁也别想这样占我的便宜。
          emotion: angry
        - id: ch02-b13
          speaker: peter_rabbit
          text: >-
            说到绿鹃，这附近好像只有红眼这一位吧？
    - id: ch03
      title: 树梢上的绿鹃一家
      blocks:
        - id: ch03-b01
          speaker: jenny_wren
          text: >-
            你先听！农夫布朗屋前有棵大榆树，金羽拟鹂把巢搭在上面。那边远远传来一支婉转的歌，你没有听见吗？
        - id: ch03-b02
          speaker: narrator
          text: >-
            彼得竖起耳朵。起初，他什么也没听见，珍妮照例取笑他，说他耳朵那么大，却不知道好好用。过了一会儿，彼得终于捕捉到了那支歌。声音跟红眼有一点儿像，却更流畅、更连绵，也更甜美。彼得一下高兴起来。
        - id: ch03-b03
          speaker: peter_rabbit
          text: >-
            这回我听见了！
          emotion: happy
        - id: ch03-b04
          speaker: jenny_wren
          text: >-
            那是红眼的表亲歌绿鹃。他唱得比红眼好，也一样爱听自己的歌声。从快活的太阳先生早晨起床，一直到晚上回去睡觉，他一整天都唱个不停。就算天气热得大家为了舒服些都不想出声，他照样唱。我从没见过谁像他那么喜欢树梢。
        - id: ch03-b05
          speaker: jenny_wren
          text: >-
            他好像一点儿也不稀罕老果园，只肯待在路边那些大树上。那棵大榆树上就有他的巢，搭得跟金羽拟鹂的巢一样高。我没亲眼见过，是金羽告诉我的。这样小的一只鸟，为什么偏要住到世界那么高的地方，我实在想不通。我也同样想不通，怎么会有谁肯住在老果园以外的地方。
        - id: ch03-b06
          speaker: peter_rabbit
          text: >-
            我怎么想不起歌儿长什么样了？
        - id: ch03-b07
          speaker: jenny_wren
          text: >-
            他很像表亲红眼，只是外衣的橄榄绿色更暗一点儿，腹面也不是白色，而是微微发黄。他当然没有红眼睛，个头还比红眼小一些。说到底，这一家子都长得差不多。
        - id: ch03-b08
          speaker: peter_rabbit
          text: >-
            这话你可说对了。他们弄得我晕头转向。要是其中几位穿得鲜艳一点儿，我认起来就容易了。
        - id: ch03-b09
          speaker: jenny_wren
          text: >-
            还真有一位。他的喉咙和胸脯都是亮黄色，所以叫黄喉绿鹃。你绝不可能认错他。
        - id: ch03-b10
          speaker: peter_rabbit
          text: >-
            黄喉绿鹃也爱唱歌吗？
        - id: ch03-b11
          speaker: jenny_wren
          text: >-
            那当然。这一家子里的每一位都爱听自己的声音，这是他们家的老脾气。有时候，光听他们从早唱到晚，我都觉得自己的嗓子疼。好东西虽好，可一旦多过了头，也叫人受不了。闲聊也是一样。我已经在你身上浪费太多时间了。现在快走吧，彼得，今天别再来烦我。
        - id: ch03-b12
          speaker: narrator
          text: >-
            彼得听完，便一跳一跳地走了。
