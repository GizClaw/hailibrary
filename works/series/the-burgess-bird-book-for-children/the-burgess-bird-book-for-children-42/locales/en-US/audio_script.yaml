audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    spooky_screech_owl:
      display_name: Spooky the Screech Owl
      tts:
        delivery: dry, knowing, and occasionally sharp
        timbre: small, husky, and rounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Learns Something About Spooky
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit likes winter. At least, he doesn't mind it very much, even though he has to work hard to find enough food to live on. Perhaps all that work is good for him. Without it, he might grow too fat to keep out of Reddy Fox's way.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When the snow lies deep, Peter must eat whatever he can find. Often there is hardly anything except the bark of young trees. That is when he gets into mischief, because no bark tastes better to him than the bark of young fruit trees. But when bark is stripped from all the way around a trunk, the tree dies. In spring and summer, the life-giving sap travels upward through the inner layer of bark. Take away a complete strip near the bottom, and the sap cannot rise. Then the tree cannot live.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Farmer Brown had planted a young orchard near the Old Orchard. Peter knew it well from his summer visits. Back then, sweet clover and other green food had been plentiful, so the young bark had never tempted him. Winter was different. Peter rarely had a full stomach, and he kept thinking about those trees. He knew he should stay away. Still, the more he thought, the more he felt he simply had to taste that tender bark. One evening, just at dusk, he set off for the young orchard.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter reached the orchard without trouble, and his eyes sparkled as he hopped to the nearest young tree. Then came a dreadful disappointment. Wire netting went all around its trunk. Peter couldn't take even one nibble of bark. He tried the next tree, but that one was protected too. He hurried on from tree to tree and found the same thing every time. Farmer Brown knew all about Peter's taste for the bark of young fruit trees. He had been wise enough to guard every tree in his new orchard.
        - id: ch01-b05
          speaker: narrator
          text: >-
            At last Peter gave up and hopped toward the Old Orchard. As he passed a certain big tree, a voice startled him.
        - id: ch01-b06
          speaker: spooky_screech_owl
          text: >-
            What's wrong, Peter? You don't look very happy.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Peter stopped at once and stared up into the big apple tree. He searched every bare branch, but saw no one anywhere. There wasn't a single leaf on the tree, so he could see straight through it. Peter blinked and began to feel foolish. He knew that if anyone had been sitting on one of those branches, he could not possibly have missed them.
        - id: ch01-b08
          speaker: spooky_screech_owl
          text: >-
            You're looking too high, Peter. Much too high.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The voice chuckled as it spoke. This time, it seemed to come right out of the tree trunk. Peter stared at the trunk itself. Suddenly he burst out laughing. Just a few feet above the ground was a good-sized hole. A funny little fellow had poked his head through it. He was watching Peter with big eyes, and his beak was hooked.
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            Spooky, you really fooled me! I should have known your voice, but I didn't.
        - id: ch01-b11
          speaker: narrator
          text: >-
            It was Spooky the Screech Owl. He climbed out of the hole, opened his wings, and flew without a sound to a perch just above Peter's head. Spooky was a little fellow, no more than eight inches high. Even so, there was no mistaking the family he belonged to. He looked so much like a small copy of Hooty the Great Horned Owl that Peter felt a little cold shiver run over him. Peter knew perfectly well that he had nothing in the world to fear from Spooky, but the likeness was still there.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Spooky's head looked almost as big around as his body, with hardly any neck between them. Bright reddish brown covered his upper feathers, crossed by little black streaks and bars. Underneath, he was whitish with marks of black and brown. A feather tuft rose on each side of his head. They looked like ears, but they were not ears at all.
        - id: ch01-b13
          speaker: narrator
          text: >-
            His round yellow eyes had a fierce, hungry look. His small bill was nearly hidden among the feathers of his face, though its hook was just like Hooty's. As Spooky settled on the branch, he turned his head until he was looking straight behind himself. Then he whipped it back so quickly that Peter thought it had gone all the way around. Spooky's eyes stay fixed in their sockets. He cannot move them from side to side. Whenever he wants to see to one side or the other, he has to turn his whole head.
        - id: ch01-b14
          speaker: spooky_screech_owl
          text: >-
            You still haven't told me why you're so unhappy, Peter.
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            Isn't an empty stomach reason enough for anyone to be unhappy?
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: Spooky chuckled.
        - id: ch01-b17
          speaker: spooky_screech_owl
          text: >-
            My stomach is empty too, Peter, but I'm not unhappy. Somewhere out there, I feel sure a fat Mouse is waiting for me.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Then Peter remembered something Jenny Wren had told him early in the spring. Spooky the Screech Owl lived all year long in a hollow tree. Peter wondered whether this was the very hollow she had meant. His curiosity grew so strong that, for the time being, he forgot all about his empty stomach.
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            Spooky, did you live in that hole all summer?
        - id: ch01-b20
          speaker: narrator
          text: Spooky nodded solemnly.
        - id: ch01-b21
          speaker: spooky_screech_owl
          text: >-
            I've made that hollow my home through summer and winter for three years.
        - id: ch01-b22
          speaker: narrator
          text: Peter's eyes opened very wide.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            And I never even guessed it until now! Did you raise a family in there?
          emotion: surprised
        - id: ch01-b24
          speaker: spooky_screech_owl
          text: >-
            I certainly did. Mrs. Spooky and I raised a family of four, and they were as fine-looking a group of youngsters as you could ever have seen. They have all gone out into the Great World now to make their own living. Two were dressed just like me, and the other two were gray.
        - id: ch01-b25
          speaker: peter_rabbit
          text: >-
            What did you say?
          emotion: surprised
        - id: ch01-b26
          speaker: spooky_screech_owl
          text: >-
            I said two looked like me, and the other two were gray.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            That's strange!
          emotion: surprised
        - id: ch01-b28
          speaker: spooky_screech_owl
          text: >-
            What is strange about it?
          emotion: angry
        - id: ch01-b29
          speaker: peter_rabbit
          text: >-
            Well, all four weren't dressed alike.
        - id: ch01-b30
          speaker: spooky_screech_owl
          text: >-
            There's nothing strange in that. We Screech Owls like variety. Some of us are gray, while others are reddish brown. You can't always tell who someone is by the color of their clothes.
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: >-
            Spooky snapped his bill with a sharp little crack. Peter nodded as though he understood perfectly, though he did not understand at all.
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            I'm very glad to find you living here. The Old Orchard can be lonely in winter. But with so few birds around, how do you find enough food?
        - id: ch01-b33
          speaker: spooky_screech_owl
          text: >-
            Birds? What do birds have to do with it?
          emotion: angry
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            Don't you live on birds?
        - id: ch01-b35
          speaker: spooky_screech_owl
          text: >-
            Certainly not. If I depended on birds every day, I would starve. I do catch a Sparrow now and then, but it is usually an English Sparrow. Whenever I catch one of Bully's family, I believe I'm doing the Old Orchard a favor.
        - id: ch01-b36
          speaker: spooky_screech_owl
          text: >-
            In winter, I live mostly on Mice and Shrews. When summer comes, I eat plenty of grasshoppers and other insects. If it weren't for me and the rest of my relatives, I believe Mice would soon overrun the Great World. Farmer Brown ought to be glad that I've made my home in the Old Orchard. I think he is glad. Farmer Brown's boy knows all about this hollow tree of mine, and he never disturbs me here.
        - id: ch01-b37
          speaker: spooky_screech_owl
          text: >-
            Now, if you'll excuse me, I'm going to Farmer Brown's young orchard. I should find a fat Mouse or two trying to eat the bark from those young trees.
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            Huh! They can try as much as they like, but they won't get any bark. I can tell you that.
        - id: ch01-b39
          speaker: narrator
          text: Spooky's round yellow eyes twinkled.
        - id: ch01-b40
          speaker: spooky_screech_owl
          text: >-
            Then I suppose you've been trying to get some of that bark yourself.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Peter did not answer. He only stood there looking guilty. Spooky chuckled once more, spread his wings, and flew away so soundlessly that he seemed more like a shadow drifting through the evening than a bird.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Peter set out for a certain swamp he knew, where he was sure to find enough bark to quiet his hunger.
