audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    spooky:
      display_name: 鸣角鸮幽灵
      tts:
        delivery: 机敏沉着，话里带着低低的幽默
        timbre: 低柔而清晰
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 新果园里的失望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得喜欢冬天，至少不怎么讨厌。虽然这个季节想活下去，他得费不少力气，可这也许是件好事。不然，他说不定会胖得躲不开狐狸雷迪。雪一深，彼得找到什么就吃什么。很多时候，他什么都找不到，只能啃小树的树皮。偏偏彼得最爱果树幼苗的嫩皮，所以一到这种时候，他就容易惹麻烦。
        - id: ch01-b02
          speaker: narrator
          text: >-
            你也许知道，一棵树要是被绕着树干剥掉整圈树皮，就会死去。原因很简单。春天和夏天，给树木带来生机的汁液要从树皮内层向上流。靠近树根的地方少了一整圈树皮，汁液便上不去，那棵树也只能死掉。
        - id: ch01-b03
          speaker: narrator
          text: >-
            农夫布朗在老果园附近栽了一片果树幼苗。彼得夏天去过那里许多次，对那片新果园熟悉得很。那时候，香甜的三叶草和别的绿叶到处都是，他从没想过要尝那些小树的皮。可眼下不一样，彼得已经很久不知道吃饱是什么滋味了。他明知道聪明的做法是离新果园远一点，心里却总惦记着鲜嫩的树皮。越想越觉得自己非吃一口不可。一天傍晚，天色刚暗下来，他便出发了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            彼得平安到了果园。他两眼放光，蹦向最近的一棵小树。可到了跟前，他才看见树干四周全围着铁丝网，连一小口树皮也啃不到。下一棵还是这样，再下一棵也一样。彼得急匆匆地从这棵跑到那棵，回回都失望。农夫布朗早知道他爱吃果树幼苗的皮，很有先见之明，已经把整片新果园保护好了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得只得放弃，跳进老果园。他经过一棵大树时，忽然听见一个声音，吓得一愣。
        - id: ch01-b06
          speaker: spooky
          text: 彼得，你怎么啦？看上去不大高兴呀。
        - id: ch01-b07
          speaker: narrator
          text: >-
            彼得猛地停住，抬头盯着大苹果树，可怎么看都找不到说话的人。树上一片叶子也没有，每根枝杈都看得清清楚楚。彼得眨着眼，觉得自己傻乎乎的。真有人坐在树枝上，他不可能看不见。
        - id: ch01-b08
          speaker: spooky
          text: 别看那么高，彼得。别看那么高。
        - id: ch01-b09
          speaker: narrator
          text: >-
            那声音轻轻笑着，这回像是从树干里传出来的。彼得盯住树干，忽然笑出了声。离地几英尺的地方有个挺大的树洞，一颗滑稽的小脑袋正从洞里探出来。那小家伙长着一双大眼睛，还有一张钩嘴。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 幽灵，这回你真把我骗到了！我本来该听出你的声音，可偏偏没听出来。
          emotion: surprised
    - id: ch02
      title: 树洞里的幽灵
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            原来，说话的是鸣角鸮幽灵。他从树洞里出来，翅膀没有发出一点儿声音，飞到彼得头顶正上方落下。幽灵是个身高还不到八英寸的小家伙，可一看就知道他属于哪一家。他简直像大角鸮胡啼的一个小小翻版，像得叫彼得身上掠过一阵寒颤，虽然他根本没有什么可怕的。
        - id: ch02-b02
          speaker: narrator
          text: >-
            幽灵的脑袋几乎跟身子一样粗，脖子像是完全不见了。他穿着鲜亮的红褐色衣裳，上面有细细的黑纹和黑色横斑。身体下面接近白色，带着黑色和褐色的细纹与横斑。脑袋两边各有一簇羽毛，看起来很像耳朵。有些人真把它们当成耳朵，那可就错了，那只是两簇羽毛。
        - id: ch02-b03
          speaker: narrator
          text: >-
            他有一双又圆又黄的眼睛，眼神凶猛又饥饿。小小的嘴几乎完全藏在脸上的羽毛里，却跟胡啼的嘴一样弯成钩。幽灵站稳以后，把脑袋一直转到能正眼看见身后，又飞快地转回来。动作快得叫彼得以为，那颗脑袋当真整整转了一圈。其实，幽灵的眼睛牢牢长在眼窝里，不能左右转动。他无论想看哪一边，都只能转动整个脑袋。
        - id: ch02-b04
          speaker: spooky
          text: 彼得，你还没说呢，为什么这么不高兴？
        - id: ch02-b05
          speaker: peter_rabbit
          text: 肚子空空的，还不够让谁不高兴吗？
        - id: ch02-b06
          speaker: narrator
          text: 彼得没好气地顶了一句，幽灵听了只是轻声发笑。
        - id: ch02-b07
          speaker: spooky
          text: >-
            我的肚子也空着呢，彼得，可我一点儿也不难过。我总觉得，什么地方正有一只胖老鼠等着我。
        - id: ch02-b08
          speaker: narrator
          text: >-
            彼得忽然想起早春时鹪鹩珍妮说过的话。她说，鸣角鸮幽灵一年四季都住在树洞里。好奇心一冒出来，彼得暂时连饥饿也忘了。
        - id: ch02-b09
          speaker: peter_rabbit
          text: 幽灵，整个夏天你都住在那个洞里吗？
        - id: ch02-b10
          speaker: narrator
          text: 幽灵郑重地点了点头。
        - id: ch02-b11
          speaker: spooky
          text: 不管夏天还是冬天，我在那个树洞里已经住了三年。
        - id: ch02-b12
          speaker: narrator
          text: 彼得吃惊得把眼睛瞪得老大。
        - id: ch02-b13
          speaker: peter_rabbit
          text: 我到今天居然都没猜到！你在里面养过一家孩子吗？
          emotion: surprised
    - id: ch03
      title: 四个不同的孩子
      blocks:
        - id: ch03-b01
          speaker: spooky
          text: >-
            当然养过。幽灵太太和我养大了四个孩子，你从没见过比他们更漂亮的小家伙。现在，他们都到大千世界里自己谋生去了。两个穿得跟我一样，另外两个是灰色的。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 什么？
          emotion: surprised
        - id: ch03-b03
          speaker: spooky
          text: 我说，两个穿得跟我一样，另外两个是灰色的。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 这可真怪。
        - id: ch03-b05
          speaker: spooky
          text: 哪里怪了？
          emotion: angry
        - id: ch03-b06
          speaker: peter_rabbit
          text: 就是说，四个孩子穿的衣裳竟然不一样。
        - id: ch03-b07
          speaker: narrator
          text: 幽灵有点儿恼了。他猛地一合钩嘴，发出轻轻的“咔”一声。
        - id: ch03-b08
          speaker: spooky
          text: >-
            这有什么好奇怪的？我们鸣角鸮就喜欢各有各的样子。有些是灰色，有些是红褐色。光看一个人衣裳的颜色，可猜不出他究竟是谁。
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: 彼得点点头，装得像是全明白了，其实一点儿也没弄懂。
        - id: ch03-b10
          speaker: peter_rabbit
          text: >-
            发现你住在这里，我真高兴。冬天的老果园相当冷清。现在鸟儿这么少，我真不知道你怎么找得到足够的食物。
        - id: ch03-b11
          speaker: spooky
          text: 鸟儿？这跟鸟儿有什么关系？
        - id: ch03-b12
          speaker: peter_rabbit
          text: 咦，你不是靠吃鸟儿过活的吗？
        - id: ch03-b13
          speaker: narrator
          text: 彼得问得一脸天真。幽灵听完，立刻尖刻地顶了回来。
    - id: ch04
      title: 像影子一样飞走
      blocks:
        - id: ch04-b01
          speaker: spooky
          text: >-
            当然不是！我要是每天指望着吃鸟儿，只怕早就饿死了。我偶尔会捉到一只麻雀，通常都是英国麻雀。每回逮住恶霸英国麻雀家的一员，我都觉得自己替老果园做了件好事。
        - id: ch04-b02
          speaker: spooky
          text: >-
            冬天里，我主要吃老鼠和鼩鼱。到了夏天，我还会吃许多蚱蜢和别的昆虫。要是没有我和我的亲戚，大千世界恐怕很快就会到处都是老鼠。农夫布朗该庆幸我搬来了老果园，我想他也确实高兴。农夫布朗家的男孩早知道我住在这个树洞里，可从来没有打扰过我。
        - id: ch04-b03
          speaker: spooky
          text: >-
            现在，请你原谅，我想我该飞到农夫布朗的新果园去了。那里准能找到一两只胖老鼠，他们这会儿大概也正在想方设法啃那些小树的树皮呢。
        - id: ch04-b04
          speaker: peter_rabbit
          text: 哼！他们尽管试，反正一口也吃不到，这我可以告诉你。
        - id: ch04-b05
          speaker: narrator
          text: 幽灵圆圆的黄眼睛里闪起笑意。
        - id: ch04-b06
          speaker: spooky
          text: 听你这么说，看来你自己也试过那些树皮了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            彼得一句话也没说，脸上的心虚却一望便知。幽灵又低低地笑起来，展开翅膀飞走了。他飞得一点儿声音也没有，与其说像一只鸟，倒更像一道随风飘过的影子。彼得随后动身去了一片自己熟悉的沼泽。他知道，在那里一定能找到足够的树皮，暂且填一填空空的肚子。
