audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 好奇朴实，发问时认真又直率
        timbre: 温暖敦实
        pace: 从容
        pitch: 中低音
    skimmer_tree_swallow:
      display_name: 树燕掠影
      tts:
        delivery: 活泼自信，受到质疑时容易着恼
        timbre: 明亮轻盈
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: sharp, knowing, and playfully teasing
        timbre: crisp and light
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: 第十五章　一只燕子和一只不是燕子的鸟
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            土拨鼠约翰尼和波莉住在老果园远处一角。他们的家藏在一棵老苹果树的根须之间，卧室深埋地下，要穿过长长的走廊才能到达。他们当初选中这里，正是因为那些横伸的树根只留下刚好够两只土拨鼠进出的空隙，谁也没法把洞口挖宽。狐狸雷迪和猎犬鲍泽都巴不得把他们从洞里挖出来，可树根挡住了他们。因此，约翰尼和波莉住得很安心。
        - id: ch01-b02
          speaker: narrator
          text: >-
            门前铺着一块闪亮的细沙，正好当一方舒服的门阶。约翰尼吃饱了肚子，又没事可做，就喜欢坐在那里。他坐在门阶上直起身子时，最近的邻居就在头顶约五英尺处。那是树燕掠影和他那位小巧整洁的太太。他们的家门是苹果树干上的一个小圆洞，那洞是几年前啄木鸟家的一位成员凿出来的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            约翰尼和掠影是最好的朋友。他爱看掠影从枝叶下倏地冲出来，盘旋、转弯，又轻轻滑翔。有时，掠影高高飞上蔚蓝蔚蓝的天空。有时，他又贴着草尖掠过。无论怎么飞，那双翅膀似乎永远不会疲倦。
        - id: ch01-b04
          speaker: narrator
          text: >-
            不过，约翰尼更爱听掠影聊天。掠影坐在自家门口，会说起老果园邻居们的新鲜事，也会讲他每年长途往返遥远的南方时，在外面的大世界里经历的种种奇遇。
        - id: ch01-b05
          speaker: narrator
          text: >-
            在约翰尼眼里，谁也没有掠影那么精神整洁。掠影胸前像雪一样白，后背和双翼泛着蓝绿色。可约翰尼一直想不通两件事，他的嘴为什么那么小，腿又为什么那么短。最后，约翰尼终于大着胆子问出了口。
        - id: ch01-b06
          speaker: skimmer_tree_swallow
          text: >-
            天哪，约翰尼！再大的嘴送给我，我也不要。我根本不知道拿它做什么，它只会碍事。我飞在天上时，就能捉到差不多所有食物。蚊子、苍蝇，还有各种长翅膀的小虫子，都是我的饭。我不用到树木和灌木上把它们啄下来，也不用去地面寻找，所以这么大一张嘴已经尽够啦。我的腿也是同样的道理。你见过我在地上走路吗？
        - id: ch01-b07
          speaker: narrator
          text: 约翰尼认真想了一会儿。
        - id: ch01-b08
          speaker: johnny_chuck
          text: 没有。听你这么一问，我还真没见过。
        - id: ch01-b09
          speaker: skimmer_tree_swallow
          text: 那你见过我在树枝间跳来跳去吗？
        - id: ch01-b10
          speaker: narrator
          text: 约翰尼又只好承认，自己从来没有见过。
        - id: ch01-b11
          speaker: skimmer_tree_swallow
          text: >-
            我的脚只有一个用处，就是休息时抓住树枝。我不靠它们走路，也不靠它们在枝头到处跳，所以长腿对我一点用也没有。大自然母亲就把我的腿生得很短。你瞧，我大部分时间都在空中度过。
        - id: ch01-b12
          speaker: johnny_chuck
          text: 那么，你那位表亲烟囱燕煤灰，应该也是一样吧？
        - id: ch01-b13
          speaker: skimmer_tree_swallow
          text: >-
            听听这话，就知道有些人懂得多么少！竟然把煤灰叫作燕子！约翰尼，你可得弄清楚，他跟我一点亲戚关系都没有。他是雨燕，不是燕子。
          emotion: angry
        - id: ch01-b14
          speaker: johnny_chuck
          text: 可他看起来就像燕子。
        - id: ch01-b15
          speaker: skimmer_tree_swallow
          text: >-
            他才不像！你只是碰巧看见他跟我们燕子一样，大部分时间都在天上飞，才觉得他像。我们燕子一家，绝不会承认那么难看的家伙是自家成员。
          emotion: angry
        - id: ch01-b16
          speaker: jenny_wren
          text: 啧、啧、啧、啧！我看呀，掠影这是嫉妒了。
        - id: ch01-b17
          speaker: narrator
          text: 鹪鹩珍妮恰好赶来，正好听见掠影最后那几句话。
        - id: ch01-b18
          speaker: skimmer_tree_swallow
          text: >-
            根本不是那么回事！烟囱雨燕煤灰到底有什么地方，能让一只燕子对他产生嫉妒？
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 珍妮神气地翘起尾巴，又朝约翰尼眨了眨眼。
        - id: ch01-b20
          speaker: jenny_wren
          text: 我说的是他飞翔的本领。
        - id: ch01-b21
          speaker: skimmer_tree_swallow
          text: >-
            他飞翔的本领？他这辈子就没有哪一天飞得像燕子！要说在空中姿态优美，谁也比不上我。这话就算由我自己来说，也没有错。至于飞得笨拙难看，那谁也比不过煤灰。
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: >-
            就在这时，头顶响起一阵尖厉的唧喳声。大家抬头一看，烟囱雨燕煤灰正在天上飞驰，仿佛世上再没有比这更快活的事。他先拼命扇动双翼，扇过一阵，又向前滑翔，就像你我穿着冰鞋滑过冰面。
        - id: ch01-b23
          speaker: narrator
          text: >-
            煤灰的姿态确实不算优美，可他能扭转身体，忽左忽右地转弯，还会在空中玩出各种各样的花样。有些动作，掠影连做梦都没想过自己能做。
        - id: ch01-b24
          speaker: jenny_wren
          text: >-
            煤灰能先用一边翅膀，再用另一边。你呢，两边翅膀非得一起用不可。你就算为了保命，也不能笔直向下飞进烟囱，这件事你自己很清楚。煤灰能用翅膀做到的事，你做不到，其他任何鸟也做不到。
        - id: ch01-b25
          speaker: skimmer_tree_swallow
          text: >-
            就算你说得对，我也连一丁点儿都不嫉妒他。
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: 掠影说完就倏地飞走了，飞到珍妮那张利嘴够不着的地方，免得继续挨她数落。
        - id: ch01-b27
          speaker: johnny_chuck
          text: 掠影和煤灰真的不是亲戚吗？
        - id: ch01-b28
          speaker: narrator
          text: 约翰尼和珍妮望着掠影在高空划出一个个轻盈的圆圈。珍妮点了点头。
        - id: ch01-b29
          speaker: jenny_wren
          text: >-
            千真万确，约翰尼。煤灰跟掠影没有亲缘关系，他属于一个完全不同的家族。他这个家伙怪有意思。你这一辈子见过那么窄的翅膀吗？还有他那条尾巴，小得简直不配叫尾巴。
        - id: ch01-b30
          speaker: narrator
          text: 约翰尼笑了起来。
        - id: ch01-b31
          speaker: johnny_chuck
          text: 他飞到那么高的天空里，前后两头看起来简直一模一样。他浑身都是黑色的吗？
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            他一点也不黑。他的羽毛是煤灰褐色，喉咙和胸前则微微发灰。再说那条小得可怜的尾巴，每根尾羽的末端都有一个又尖又硬的小尖头。煤灰会用这些尖头撑住身体，就像绒绒攀在树干上时，用自己的尾羽抵住树干、支住身体一样。
        - id: ch01-b33
          speaker: johnny_chuck
          text: 可我从没见煤灰停在树干上。除了天上，我没见他在别处待过。
        - id: ch01-b34
          speaker: jenny_wren
          text: >-
            你以后永远也不会在树干上见到他。他唯一肯落脚的地方，是烟囱里面或者空心树的里面。到了那里，他就紧紧攀住内壁，跟绒绒攀在树干上一模一样。
        - id: ch01-b35
          speaker: narrator
          text: 约翰尼听完这番话，脸上的神情分明还是不大相信。
        - id: ch01-b36
          speaker: johnny_chuck
          text: 既然这样，他在哪里筑巢？又在哪里睡觉？
        - id: ch01-b37
          speaker: jenny_wren
          text: >-
            在烟囱里呀，傻瓜。当然是在烟囱里。他在那里睡觉，也在那里筑巢。他把巢牢牢固定在烟囱的内壁上。那座巢是用细树枝做成的，像一只规规矩矩的小篮子。
        - id: ch01-b38
          speaker: johnny_chuck
          text: >-
            你是在拿胡话糊弄我吗？烟囱壁上连个托住鸟巢的小搁板都没有，他怎么把巢固定在那里？他要是从来不落地，又怎么收集筑巢的小树枝？这样的故事，你怎么能指望我相信？
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: 珍妮那双锐利的小眼睛顿时闪起了光。
        - id: ch01-b40
          speaker: jenny_wren
          text: >-
            你要是肯拿出一半心思好好用眼睛，就不用问树枝从哪儿来！你若留意煤灰贴着树梢飞过的样子，就会看见他用爪子抓住一根小枯枝，不停下来就把它折断。这就是他收集树枝的办法，聪明先生。他嘴里有一种黏糊糊的东西，既能把树枝粘在一起，也能用同样的办法把巢粘到烟囱壁上。你爱信不信，事情就是这样。
          emotion: angry
        - id: ch01-b41
          speaker: johnny_chuck
          text: >-
            我相信，珍妮，我真的相信。请你再告诉我，煤灰也是在空中取得所有食物的吗？
        - id: ch01-b42
          speaker: jenny_wren
          text: >-
            当然。他除了昆虫，别的什么也不吃，而且全是在空中飞行时捉住。好了，现在我得赶紧回去做家里的事了。
        - id: ch01-b43
          speaker: johnny_chuck
          text: >-
            等等，再告诉我最后一件事！大多数鸟都有近亲，煤灰难道一个近亲也没有吗？
        - id: ch01-b44
          speaker: jenny_wren
          text: >-
            他没有更亲近的亲戚了，最近的也只是某种远房表亲，有夜鹰轰鸣、三声夜鹰和蜂鸟小哼。
        - id: ch01-b45
          speaker: johnny_chuck
          text: 什么？我没听错吧？你刚才真的说了蜂鸟小哼吗？
          emotion: surprised
        - id: ch01-b46
          speaker: narrator
          text: 约翰尼简直不敢相信自己的耳朵，可他没有得到回答。鹪鹩珍妮早已走远，根本听不见他的声音了。
