audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: curious, plainspoken, and earnest
        timbre: warm and sturdy
        pace: relaxed
        pitch: medium-low
    skimmer_tree_swallow:
      display_name: Skimmer the Tree Swallow
      tts:
        delivery: lively, confident, and quick to take offense
        timbre: bright and airy
        pace: quick
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: sharp, knowing, and playfully teasing
        timbre: crisp and light
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: A Swallow and One Who Isn't
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Johnny and Polly Chuck had made their home between the roots of an old apple tree in a far corner of the Old Orchard. Their bedroom lay far underground, and they reached it through a long hallway. They had dug there because the spreading roots left just enough room for the Chucks to pass in and out. No one could dig the doorway any wider. Reddy Fox and Bowser the Hound would both have been delighted to dig them out if those roots had not stopped them. So Johnny and Polly felt quite safe.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Right outside their door, a smooth patch of shining sand made a very fine doorstep. Johnny loved to sit there whenever his stomach was full and there was nothing else to do. When he sat upright, his nearest neighbors were only about five feet above his head. They were Skimmer the Tree Swallow and his trim little wife. The entrance to their home was a small round hole in the apple tree's trunk. One of the Woodpeckers had cut it several years before.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Johnny and Skimmer were the best of friends. Johnny loved to watch Skimmer dart out from beneath the branches. Skimmer would wheel, turn, and glide on wings that never seemed to tire. One moment he was high in the blue, blue sky. The next, he was barely skimming the tops of the grass. Johnny liked their talks even better. Skimmer would sit in his doorway and share bits of gossip about the neighbors in the Old Orchard. Then he would tell Johnny about his adventures in the Great World during those long journeys to and from the faraway South.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As Johnny saw it, no one looked quite as trim and neat as Skimmer. His breast was snowy white, while his back and wings were blue-green. Yet Johnny always wondered about two things. Skimmer's bill was so small, and his legs were so short. At last he dared to ask why.
        - id: ch01-b05
          speaker: skimmer_tree_swallow
          text: >-
            Good gracious, Johnny! I wouldn't have a large bill for anything. I wouldn't know what to do with one, and it would always be in my way. You see, I catch nearly all my food up in the air while I'm flying. Mosquitoes, flies, and all kinds of little insects with wings make up my meals. I don't have to pick insects off trees or bushes, and I don't search for them on the ground. So why would I need any more bill than this? My legs work the same way. Have you ever seen me walking on the ground?
        - id: ch01-b06
          speaker: narrator
          text: Johnny stopped to think.
        - id: ch01-b07
          speaker: johnny_chuck
          text: No. Now that you mention it, I never have.
        - id: ch01-b08
          speaker: skimmer_tree_swallow
          text: And have you ever watched me hop around in a tree?
        - id: ch01-b09
          speaker: narrator
          text: Once again, Johnny had to admit that he had not.
        - id: ch01-b10
          speaker: skimmer_tree_swallow
          text: >-
            The only thing I need my feet for is perching while I rest. I don't use them for walking around, and I don't hop from branch to branch. Long legs would be no help at all, so Mother Nature made mine very short. You see, I spend almost all my time in the air.
        - id: ch01-b11
          speaker: johnny_chuck
          text: I suppose your cousin Sooty the Chimney Swallow is made the same way.
        - id: ch01-b12
          speaker: skimmer_tree_swallow
          text: >-
            That shows how little some people know! Imagine calling Sooty a Swallow! Johnny Chuck, you ought to know that he isn't related to me at all. He's a Swift, not a Swallow.
          emotion: angry
        - id: ch01-b13
          speaker: johnny_chuck
          text: But he looks like a Swallow.
        - id: ch01-b14
          speaker: skimmer_tree_swallow
          text: >-
            He does not! You only think so because he spends most of his time in the air, just as we Swallows do. Our family would never take in such a homely-looking fellow.
          emotion: angry
        - id: ch01-b15
          speaker: jenny_wren
          text: Tut, tut, tut! I do believe Skimmer is jealous.
        - id: ch01-b16
          speaker: narrator
          text: Jenny Wren had arrived just in time to hear Skimmer's last words.
        - id: ch01-b17
          speaker: skimmer_tree_swallow
          text: >-
            I am not! What could Sooty the Chimney Swift possibly have that would make any Swallow jealous?
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Jenny tipped her tail up in her saucy way and winked at Johnny.
        - id: ch01-b19
          speaker: jenny_wren
          text: The way he flies.
        - id: ch01-b20
          speaker: skimmer_tree_swallow
          text: >-
            The way he flies? He has never flown like a Swallow for one day in his life! No one is more graceful in the air than I am, if I may say so. And no one is more awkward than Sooty.
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: >-
            Just then, a shrill chatter sounded overhead. Everyone looked up and saw Sooty the Chimney Swift racing across the sky as though he were having the best time in the world. His wings beat furiously for a while. Then he glided very much as you or I would glide on skates. It was quite true that he was not graceful. But Sooty could twist and turn, and he could cut up all kinds of antics in the air. Some of them were things Skimmer had never even dreamed of doing.
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            Sooty can use first one wing and then the other. You always have to use both wings at once. And you couldn't fly straight down into a chimney if your life depended on it. You know perfectly well that you couldn't, Skimmer. Sooty can do things with his wings that you cannot do, and neither can any other bird.
        - id: ch01-b23
          speaker: skimmer_tree_swallow
          text: >-
            That may be true, but I am not even the tiniest bit jealous of him.
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: Skimmer darted away, safely beyond the reach of Jenny's sharp tongue.
        - id: ch01-b25
          speaker: johnny_chuck
          text: Is it really true that Skimmer and Sooty aren't related?
        - id: ch01-b26
          speaker: narrator
          text: Johnny and Jenny watched Skimmer trace airy circles high in the sky. Jenny nodded.
        - id: ch01-b27
          speaker: jenny_wren
          text: >-
            It's perfectly true, Johnny. Sooty belongs to a completely different family. He's a funny fellow. Have you ever seen wings so narrow? And that tail of his hardly deserves to be called a tail.
        - id: ch01-b28
          speaker: narrator
          text: Johnny laughed.
        - id: ch01-b29
          speaker: johnny_chuck
          text: When he's that high in the air, both ends of him look almost the same. Is he black all over?
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            He isn't black at all. His feathers are sooty brown, and they look rather gray around his throat and breast. Now, about that tail. Each feather ends in a little point that is sharp and stiff. Sooty uses those points to brace himself. Downy the Woodpecker does the same sort of thing with his tail feathers when he presses them against a tree trunk.
        - id: ch01-b31
          speaker: johnny_chuck
          text: >-
            But I've never seen Sooty on a tree trunk. I've never seen him anywhere except in the air.
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            And you never will see him there. The only places Sooty ever lands are inside a chimney or inside a hollow tree. Once he is in there, he clings to the side. That's just how Downy the Woodpecker clings to the trunk of a tree.
        - id: ch01-b33
          speaker: narrator
          text: Johnny looked as though he did not quite believe her.
        - id: ch01-b34
          speaker: johnny_chuck
          text: >-
            If that's true, where does he build his nest? And where does he sleep?
        - id: ch01-b35
          speaker: jenny_wren
          text: >-
            In a chimney, silly. In a chimney, of course! That's where he sleeps, and that's where he builds his nest. He makes a proper little basket out of twigs and fastens it right onto the inside wall of the chimney.
        - id: ch01-b36
          speaker: johnny_chuck
          text: >-
            Are you filling my head with nonsense? How could he fasten a nest to a chimney wall without a shelf to hold it? And if he never lands, how does he collect the little sticks? How do you expect me to believe a story like that?
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: Jenny's sharp little eyes flashed.
        - id: ch01-b38
          speaker: jenny_wren
          text: >-
            If you used your eyes even half the time, you wouldn't need to ask where those sticks come from. Watch Sooty when he flies close to the treetops. He grabs a little dead twig in his claws and snaps it off without stopping. That's how he gathers them, Mr. Smarty. A sticky substance from his mouth holds the twigs together and fixes the nest to the chimney wall. Believe me or don't. That's how he does it.
          emotion: angry
        - id: ch01-b39
          speaker: johnny_chuck
          text: >-
            I believe you, Jenny. Truly, I do. Please tell me, does Sooty catch all his food in the air too?
        - id: ch01-b40
          speaker: jenny_wren
          text: >-
            Of course he does. Sooty eats nothing but insects, and he catches them while he is flying through the air. Now I really must get back to my duties at home.
        - id: ch01-b41
          speaker: johnny_chuck
          text: >-
            Wait! Just one more thing. Doesn't Sooty have any close relatives, the way most birds do?
        - id: ch01-b42
          speaker: jenny_wren
          text: >-
            His closest relatives are only a sort of second cousin. They are Boomer the Nighthawk, Whippoorwill, and Hummer the Hummingbird.
        - id: ch01-b43
          speaker: johnny_chuck
          text: >-
            What? Did you really say Hummer the Hummingbird?
          emotion: surprised
        - id: ch01-b44
          speaker: narrator
          text: Johnny received no answer. Jenny Wren was already too far away to hear him.
