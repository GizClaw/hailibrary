audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 伶俐健谈，责备时尖锐却不失活泼
        timbre: 清脆灵巧
        pace: 轻快多变
        pitch: 高音
  chapters:
    - id: ch01
      title: 老果园里的陌生客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            伯劳屠夫并不是老果园里唯一的新来客。那里还来了一个陌生家伙，彼得很快发现，老果园里的鸟儿见了他，个个都有几分疑心。兔子彼得头一次看见他时，他正在远处的地上迈步行走，并不像许多小鸟那样跳来跳去。从那么远的地方望去，他全身黑沉沉的。他昂首走路的样子和一举一动，都让彼得想起拟八哥嘎嘎。彼得没仔细看，就把他认成了嘎嘎。其实，只要多看一眼，他便会发现这只鸟小得多。
        - id: ch01-b02
          speaker: narrator
          text: >-
            不久，陌生鸟飞上了一棵树。彼得看见他的尾巴只有嘎嘎的一半多一点儿，这才知道自己遇上了一只从没见过的鸟，好奇心马上被勾了起来，他想立刻弄清楚。彼得心里当然毫不怀疑，这一定是黑鸟家族的成员，可究竟是哪一位，他连一点儿头绪也没有。他想，珍妮鹪鹩一定知道答案，于是飞快地跑去找她。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 珍妮，黑鸟家族新搬来老果园的那一位是谁呀？
        - id: ch01-b04
          speaker: jenny_wren
          text: 老果园里根本没有新搬来的黑鸟。
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            明明有！我亲眼看见了，他现在还坐在那边的树上呢。他浑身都是黑的，不是黑鸟家族的还能是谁？
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            啧，啧，啧，啧，啧！他根本不是黑鸟，也不是黑色的。你过去仔细瞧清楚，再回来告诉我，你还觉不觉得他是黑的。
        - id: ch01-b07
          speaker: narrator
          text: >-
            珍妮说完便转过身，不再理睬彼得，自顾自找虫子去了。彼得没有别的办法，只好跳到一个能看清陌生鸟的地方，认认真真瞧了起来。阳光正照在那只鸟身上，珍妹果然没说错，他一点儿也不黑。彼得第一眼觉得，他身上大半是很深的绿色。可陌生鸟一动，有些地方又泛出浓浓的紫色。每换一个方向，羽毛的颜色仿佛也跟着变了，像拟八哥嘎嘎的羽毛一样闪着虹彩。
        - id: ch01-b08
          speaker: narrator
          text: >-
            陌生鸟全身点缀着细小的浅色斑点，腹部是深棕灰色。翅膀和尾巴也是同样的深棕灰色，上面还夹着一点儿浅黄褐色。最显眼的，是他那张颇大的黄嘴巴。
    - id: ch02
      title: 椋鸟斑斑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得赶回珍妮身边，脸上带着几分难为情。
        - id: ch02-b02
          speaker: peter_rabbit
          text: 你说得对，珍妮。他真的不是黑色的。
        - id: ch02-b03
          speaker: jenny_wren
          text: >-
            我当然说得对，我通常都是对的。他不但不是黑色的，跟黑鸟家族也没有亲戚关系。他根本不该待在老果园里。其实，要我说，他连这个国家都不该来。他是个外国佬，没错，就是个外国佬。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 可你还是没告诉我，他究竟是谁呀。
        - id: ch02-b05
          speaker: jenny_wren
          text: >-
            他是椋鸟斑斑，根本不是真正的美国鸟。斑斑和恶霸英国麻雀一样，都是从大洋那边来的。幸好他不像恶霸那么爱争斗。可话说回来，要是他根本没来，我们大家心里都会更舒坦。他占了黄翅扑翅鴷的一座旧屋，真正属于这里的鸟儿便少了一间房子。要是他家也像恶霸家那样越添越快，只怕我们当中很快就会有谁被挤出老果园。你看到他那张黄嘴巴了吗？
        - id: ch02-b06
          speaker: narrator
          text: 彼得点了点头。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 当然看到了。那张嘴那么显眼，谁会看不见呢？
        - id: ch02-b08
          speaker: jenny_wren
          text: >-
            说起那张嘴，还有件怪事呢。一到冬天，它就会变得差不多全黑。我们大多数鸟儿冬天都会换一身颜色不同的衣裳，可我们的嘴巴一年到头都是原来的颜色。
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            看来斑斑已经在这里安顿好了。你们也只能接受这件事，尽量往好处想。我现在只想知道，他到底有没有什么用处。
        - id: ch02-b10
          speaker: jenny_wren
          text: >-
            我猜他总会做一点儿好事吧。我见过他在地上啄食蚯蚓和蛴螬，可他也很喜欢谷物。要是他家变得非常兴旺，我看准会那样，他们吃掉农夫布朗的谷物，恐怕比消灭蠕虫和虫子补偿回来的还多。哟，快看！太平鸟潇洒和他的朋友们来了。
    - id: ch03
      title: 潇洒与樱桃鸟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一群衣着素雅、神态却颇为高贵的鸟儿落在一棵樱桃树上，马上毫不客气地吃起了农夫布朗的樱桃。他们跟讨喜蓝知更鸟差不多大，模样却完全不同。他们全身大多是漂亮、浓郁又柔和的灰褐色，每条尾巴末端都有一道黄带。额头、下巴和穿过双眼的纹路，黑得像天鹅绒。
        - id: ch03-b02
          speaker: narrator
          text: >-
            每只鸟头上都顶着一簇时髦的尖羽。多数鸟儿的翅膀上还有小小的红斑，活像封信用的火漆，太平鸟的英文名字正是这样来的。他们身材修长，衣着利落，个个像讲究打扮的俏公子。那份美丽安安静静，并不张扬。
        - id: ch03-b03
          speaker: narrator
          text: >-
            彼得看了一会儿，不禁担心农夫布朗还能剩下几颗樱桃。要说把自己的肚子塞得满满当当，彼得也很有本事。可这些鸟儿一颗接一颗地吞下樱桃，转眼就吃得不见踪影，连他都看得吃惊。彼得这才彻底明白，大家为什么常叫他们樱桃鸟。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 他们再多待一阵，农夫布朗就连一颗樱桃也剩不下了。
        - id: ch03-b05
          speaker: jenny_wren
          text: >-
            别担心，他们不会久留。要说四处游荡，没有谁比得过他们。我们大多数鸟儿都忙着照料孩子，蓝知更鸟先生和太太已经养起了第二窝宝宝，知更鸟先生和太太也有了第二窝蛋。可树上这些闲逛的家伙，直到现在还没开始考虑成家的事。他们的确很爱樱桃，不过农夫布朗还经得起他们吃掉的这点儿损失。樱桃也许少了一些，苹果反而会多一些。
        - id: ch03-b06
          speaker: peter_rabbit
          text: 吃掉他的樱桃，怎么反倒能让他多收苹果？
        - id: ch03-b07
          speaker: jenny_wren
          text: >-
            前些时候，绿色的小尺蠖眼看就要把整座果园吃个精光，他们正好来过这里。他们吃那些虫子时，也像现在大吃樱桃一样，一直吃到肚子滚圆。他们还很爱吃各种小果子，不过吃掉的大多是在野外生长的，对农夫布朗也好，对其他人也好，原本都没什么用。快看看，他们这会儿在干什么！
        - id: ch03-b08
          speaker: narrator
          text: >-
            五只太平鸟肩并肩坐在樱桃树的一根枝条上。一只鸟衔着一颗圆润饱满的樱桃，递给旁边的同伴。接到樱桃的鸟又把它递给下一只，就这样一个接一个传了下去。那颗樱桃一直传到队尾，又往回传了半程，才终于被其中一只吃掉。彼得看得放声大笑。
        - id: ch03-b09
          speaker: peter_rabbit
          text: 我这一辈子，还没见过这么有礼貌的鸟儿！
          emotion: happy
        - id: ch03-b10
          speaker: jenny_wren
          text: >-
            哼，我才不信这跟礼貌有什么关系。真相多半是他们个个都撑得太饱，谁都觉得肚子里装不下那颗樱桃，只好继续往下传。
        - id: ch03-b11
          speaker: peter_rabbit
          text: >-
            我还是觉得那就是有礼貌。第一只吃不下，原本可以把樱桃扔掉，可他却传给了同伴。
        - id: ch03-b12
          speaker: narrator
          text: 就在这时，太平鸟们飞走了。
    - id: ch04
      title: 温柔的一家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一直到盛夏，彼得才再次见到太平鸟潇洒。他偶然发现潇洒坐在一棵常青树的最高处，看起来像是在站岗。其实他真的在守卫自己的巢，那座巢就在这棵树上，只是彼得当时还不知道。夏天已经过了大半，彼得的朋友们多半结束了筑巢育雏，他也早就不再惦记鸟巢了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            过了一会儿，潇洒飞到一根较低的树枝上，太平鸟太太也来到他身边。接着，彼得看见了有生以来最美丽的景象之一。夫妻俩把嘴轻轻贴在一起，像是在亲吻，又细心地替对方理顺羽毛，活脱脱是一对亲密的小情鸟。彼得想不出还有哪对夫妻能像他们这样温柔恩爱。
        - id: ch04-b03
          speaker: narrator
          text: >-
            到了深秋，彼得又见到了太平鸟先生和太太。这一次，他们的孩子也都在身边。一家鸟儿待在一棵雪松树上，忙忙碌碌地啄下雪松果实，再一颗颗吃掉。那副劲头，跟初夏时五只太平鸟采食农夫布朗的樱桃一模一样。
        - id: ch04-b04
          speaker: narrator
          text: >-
            彼得当时并不知道，正因为这些鸟儿那么爱吃雪松果实，人们还常常把太平鸟叫作雪松鸟或雪松太平鸟。
