audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, knowing, and sharply playful
        timbre: bright and crisp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: The Stranger in the Orchard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Butcher the Shrike was not the only newcomer in the Old Orchard. Another stranger had arrived, and Peter Rabbit soon noticed that all the other birds seemed suspicious of him. When Peter first saw this bird, he was walking on the ground some distance away. He walked instead of hopping, and from that far off he looked completely black. The way he held himself and moved reminded Peter of Creaker the Grackle. Peter decided it was Creaker without taking a careful look. If he had looked, he would have seen that this bird was smaller.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Soon the stranger flew into a tree. Now Peter could see that his tail was barely more than half as long as Creaker's. This was someone Peter had never met, and at once he wanted to know more. He had no doubt that the stranger belonged to the Blackbird family. The trouble was, he could not guess which member of that family he was looking at. Peter decided that Jenny Wren would know, so he scampered away to find her.
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            Jenny, who is the new Blackbird who has moved into the Old Orchard?
        - id: ch01-b04
          speaker: jenny_wren
          text: >-
            There is no new Blackbird living in the Old Orchard.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            Yes, there is! I saw him myself, and I can still see him sitting in that tree over there. He is black, so he has to belong to the Blackbird family.
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            Tut, tut, tut, tut, tut! That bird is not a Blackbird, and he is not even black. Go over there and look at him properly. Then come back and tell me whether you still think he is black.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Jenny turned her back on Peter and began hunting for worms. Since she had left him no other choice, Peter hopped over to a place where he could see the stranger clearly. Sunlight fell straight on the bird, and Jenny was right. He was not black at all. Most of him looked very dark green at first. Then he moved, and patches of rich purple appeared. The color seemed to change each time he turned. Like Creaker the Grackle, he had feathers that caught the light and shimmered with different colors.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Tiny pale spots covered him. His underside was a dark brownish gray. His wings and tail matched, with small touches of buff, and his rather large bill was yellow.
    - id: ch02
      title: Speckles the Starling
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter hurried back to Jenny, looking rather sheepish.
        - id: ch02-b02
          speaker: peter_rabbit
          text: >-
            You were right, Jenny. He is not black after all.
        - id: ch02-b03
          speaker: jenny_wren
          text: >-
            Of course I was right. I usually am. He is not black, and he is not related to the Blackbird family. He has no business in the Old Orchard. If you ask me, he has no business in this country either. He is a foreigner. That is exactly what he is.
        - id: ch02-b04
          speaker: peter_rabbit
          text: >-
            But you still have not told me who he is.
        - id: ch02-b05
          speaker: jenny_wren
          text: >-
            That is Speckles the Starling, and he is not truly an American bird. Like Bully the English Sparrow, he came here from across the ocean. I am thankful Speckles is not as quarrelsome as Bully. Even so, the rest of us would feel better if he had not come. He has taken possession of one of Yellow Wing the Flicker's old homes. That leaves one fewer house for the birds who really belong here. If his family grows as quickly as Bully's family has, some of us may soon be crowded right out of the Old Orchard. Did you notice that yellow bill of his?
        - id: ch02-b06
          speaker: narrator
          text: Peter nodded.
        - id: ch02-b07
          speaker: peter_rabbit
          text: >-
            I certainly saw it. That bill was impossible to miss.
        - id: ch02-b08
          speaker: jenny_wren
          text: >-
            Here is the curious thing. In winter, his bill turns almost black. Most of us change the color of our suits for winter, but our bills stay the same.
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            Well, he seems settled here now. I suppose the rest of you will have to make the best of it. What I want to know is whether he does any good.
        - id: ch02-b10
          speaker: jenny_wren
          text: >-
            I suppose he must do some good. I have seen him picking up worms and grubs. But he is fond of grain too. If his family becomes very large, and I suspect it will, they may eat more of Farmer Brown's grain than they repay by destroying worms and bugs. Oh, look! There is Dandy the Waxwing with his friends.
    - id: ch03
      title: Dandy and the Cherrybirds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A flock of quietly dressed but distinguished-looking birds had landed in a cherry tree. At once they began helping themselves to Farmer Brown's cherries. They were about the size of Winsome Bluebird, though they looked nothing like him. Nearly all their feathers were a beautiful, rich, soft grayish brown. A yellow band crossed the tip of every tail. Each bird had velvety black on the forehead and chin and in a line through each eye.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Each bird wore a very stylish pointed cap. Most of them also had little red marks on their wings. Those marks looked like drops of sealing wax, and that was how the birds got the name Waxwings. They were slim, trim, and quite dandified. They did not show off with bright colors, but in their own quiet way they were truly beautiful.
        - id: ch03-b03
          speaker: narrator
          text: >-
            As Peter watched, he wondered whether Farmer Brown would have any cherries left. Peter could stuff his own stomach very well, but even he was amazed by how quickly those birds made the cherries disappear. Now he understood why people often called them Cherrybirds.
        - id: ch03-b04
          speaker: peter_rabbit
          text: >-
            If they stay much longer, Farmer Brown will not have a single cherry left.
        - id: ch03-b05
          speaker: jenny_wren
          text: >-
            Do not worry. They will not stay long. I do not know any birds who roam about as much as they do. Most of us have families to care for. Mr. and Mrs. Bluebird are raising a second family, and Mr. and Mrs. Robin already have a second set of eggs. Meanwhile, those wanderers up there have not even begun to think about making a home. They certainly love cherries, but Farmer Brown can afford to lose the ones they eat. Because of the Waxwings, he may end up with fewer cherries but more apples.
        - id: ch03-b06
          speaker: peter_rabbit
          text: >-
            How can eating his cherries give him more apples?
        - id: ch03-b07
          speaker: jenny_wren
          text: >-
            They came here earlier, when little green cankerworms were threatening to eat the whole orchard. The Waxwings filled themselves with those worms just as they are filling themselves with cherries now. They like small fruits, but most of the ones they eat grow wild and are no use to Farmer Brown or anyone else. Now watch what they are doing!
        - id: ch03-b08
          speaker: narrator
          text: >-
            Five Waxwings sat side by side on one branch of the cherry tree. One held a plump cherry and passed it to the bird beside him. That bird handed it to the next. The cherry traveled all the way to the end of the row and halfway back again before one of them finally ate it. Peter burst out laughing.
        - id: ch03-b09
          speaker: peter_rabbit
          text: >-
            I have never seen birds behave so politely in all my life!
          emotion: happy
        - id: ch03-b10
          speaker: jenny_wren
          text: >-
            Huh! I do not believe politeness had anything to do with it. Every one of them was probably so stuffed that he thought he had no room for one more cherry, so he passed it along.
        - id: ch03-b11
          speaker: peter_rabbit
          text: >-
            I still call it polite. The first bird could have dropped the cherry when he could not eat it, but he passed it to someone else.
        - id: ch03-b12
          speaker: narrator
          text: Just then, the Waxwings flew away.
    - id: ch04
      title: The Gentle Waxwings
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Peter did not see Dandy the Waxwing again until the very middle of summer. Then, quite by chance, he spotted Dandy perched on the very top of an evergreen tree. Dandy looked as if he were standing guard, and that was exactly what he was doing. His nest was hidden in that tree, though Peter did not know it at the time. Summer was already so far along that most of Peter's friends had finished nesting. By then, Peter had lost nearly all his interest in nests.
        - id: ch04-b02
          speaker: narrator
          text: >-
            After a while, Dandy flew down to a lower branch, and Mrs. Waxwing came to sit there beside him. Peter was then treated to one of the prettiest sights he had ever seen. The two birds rubbed their bills together as if they were kissing. They smoothed each other's feathers and looked like a perfect pair of little lovebirds. Peter could not think of any other couple who seemed so gentle and loving.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Late in the fall, Peter saw Mr. and Mrs. Waxwing again, and this time their family was with them. They were all in a cedar tree. The birds picked off the cedar berries and ate them as busily as those five Waxwings had picked and eaten Farmer Brown's cherries in early summer.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Peter did not know it then, but their fondness for cedar berries had given the Waxwings two other names: Cedarbirds and Cedar Waxwings.
