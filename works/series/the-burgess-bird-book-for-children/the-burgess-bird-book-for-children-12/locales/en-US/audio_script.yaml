  chapters:
    - id: ch01
      title: Some Unlikely Relatives
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For several days, Peter Rabbit had other things to do. Or rather, he had other things to stir up his curiosity. So he stayed away from the Old Orchard. When he finally returned, he found the whole neighborhood in an uproar. An angry meeting was under way both in and around the tree where Chebec and his quiet little wife lived. Every tongue seemed to be clattering at once. Peter knew something had happened, but no matter how hard he listened, he couldn't make head or tail of the noise.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At last, Peter caught Jenny Wren's attention.
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            What happened? Why is everyone making such a fuss?
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jenny was too excited to stay still for even a moment. Her bright little eyes flashed, and she held her tail higher than ever.
        - id: ch01-b05
          speaker: jenny_wren
          text: >-
            It's disgraceful! The whole feathered race ought to be ashamed, and somebody should do something. Just think of such a horrible creature wearing feathers! I'm ashamed of her. I truly am!
          emotion: angry
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            But what is this about? Please stop moving long enough to tell me. Who is this horrible creature?
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            Sally Sly the Cowbird. I hoped she wouldn't shame the Old Orchard this year, but she has. When Chebec and his wife came home from getting breakfast this morning, they found one of her eggs in their nest. They're terribly upset, and I don't blame them. If I were in their place, I'd throw that egg out. That's exactly what I'd do!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter blinked and stroked his whiskers. He was trying to understand what Jenny meant.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            Who is Sally Sly? Why would she put her egg there?
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            Goodness, Peter Rabbit! Don't you know who she is? She's part of the Blackbird family, and she's the laziest, sneakiest, most selfish, coldhearted good-for-nothing I know!
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: >-
            Jenny paused just long enough to catch her breath, then rushed on.
        - id: ch01-b12
          speaker: jenny_wren
          text: >-
            She left that egg with Chebec because she's too lazy to make her own nest and too selfish to raise her own children. Do you know what's going to happen when it hatches, Peter? Do you?
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter shook his head and admitted that he didn't.
        - id: ch01-b14
          speaker: jenny_wren
          text: >-
            That young Cowbird will be about twice the size of Chebec's own babies. It will be so big that it will take most of the food. Those poor little Chebecs will be robbed, no matter what their mother and father do. And Chebec and his wife are so tenderhearted that they'll wear themselves to skin and bone feeding the young wretch. They'll do it because the baby is an orphan with nobody else to care for it. Worse still, Sally may pull the same trick on other birds. She always picks the nest of someone smaller than she is. That's how sly she is. Nobody even saw her here. She slipped into the orchard while everyone was busy this morning, laid her egg, and slipped away again.
          emotion: angry
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            Did you really say she belongs to the Blackbird family?
        - id: ch01-b16
          speaker: narrator
          text: >-
            Jenny nodded hard.
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            She certainly does. Thank goodness she isn't in my family. If she were, I'd never be able to hold my head up. Just listen to Goldy the Oriole singing over in that big elm! I don't know how he can sing that way when one of his own relatives has just done something so shameful. It's strange that two members of one family can be so different. Mrs. Goldy builds one of the most wonderful nests I know, while Sally is too lazy to build any kind of nest. If I were Goldy, I would—
          emotion: angry
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            Wait! You said Sally Sly was a Blackbird. What does she have to do with Goldy the Oriole?
        - id: ch01-b19
          speaker: jenny_wren
          text: >-
            You don't see the connection? For someone who is always poking into everybody else's business, Peter, you have a lot to learn. Orioles, Meadow Larks, Grackles, and Bobolinks are all in the Blackbird family. They are related to Redwing the Blackbird, and Sally Sly the Cowbird is in that same family too.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Peter gasped.
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            I—I had no idea any of them were related!
          emotion: surprised
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            Well, they are. Why, there's Sally Sly right now!
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: >-
            Peter caught sight of a brownish-gray bird. She was about the same size as Mrs. Redwing and looked quite a bit like her. Sally was plainly trying not to be seen. The moment she knew she had been spotted, she flew toward the Old Pasture.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Late that afternoon, Peter happened to visit the Old Pasture and saw Sally again. She and several friends were walking busily right beside the cows' feet, where they seemed to be picking up food. One bird had a brown head, neck, and breast, while the rest of his coat shone glossy black. Peter guessed correctly that this was Mr. Cowbird. Once he saw how comfortably all of them stayed around the cows, he understood exactly why they were called Cowbirds.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Back in the Old Orchard, everyone felt sure Sally Sly was gone. The birds settled down again and returned to their own affairs and household cares. Jenny Wren did the same. With nobody left to talk to, Peter found a shady spot close to the old stone wall. He sat down there and thought about all the surprising things he had learned.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Before long, Goldy the Baltimore Oriole landed in the nearest apple tree. Peter thought he had never seen anyone dressed more beautifully. Goldy's head, neck, throat, and upper back were black. His lower back and breast were a rich, deep orange. Orange flashed on his shoulders too, while the rest of his wings were black and edged with white. His tail was both black and orange. Peter had heard people call him the Firebird. Now he understood the name. Goldy's song was every bit as rich and beautiful as his coat.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Mrs. Goldy soon joined him. Beside her handsome husband, she looked plainly dressed. She wore more brown than black, and wherever she had orange feathers, their color was softer and duller than his. She didn't waste a moment singing. Almost at once, her sharp eyes found a piece of string caught in the bushes directly above Peter's head. With a little cry of delight, she flew down and grabbed it. But the string was stuck. She tugged and pulled with all her strength, yet she couldn't work it free.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Goldy noticed her trouble. He stopped singing and flew down to help. Together they pulled and tugged until both birds had to rest and catch their breath.
        - id: ch01-b29
          speaker: mrs_goldy
          text: >-
            We simply have to get this string. I've searched everywhere, and this is the first piece I've found. It's exactly what we need to fasten our nest to the twigs. Once we tie it in, I won't worry about the nest tearing loose, no matter how hard the wind blows.
        - id: ch01-b30
          speaker: narrator
          text: >-
            They began again. They tugged and pulled, then pulled and tugged, until the string finally came free. Mrs. Goldy flew off triumphantly with it in her bill, and Goldy followed close behind.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Peter watched them fly to the top of a long, swaying branch in a great elm near Farmer Brown's house. Something like a bag hung there. Peter knew it had to be their nest.
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            Goodness! That nest must swing terribly when the wind blows. Wouldn't their babies fall out?
        - id: ch01-b33
          speaker: welcome_robin
          text: >-
            You don't need to worry about those babies.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Peter looked up and found Welcome Robin there just above him.
        - id: ch01-b35
          speaker: welcome_robin
          text: >-
            Mrs. Goldy builds one of the most remarkable nests I know. It's shaped like a deep pocket, with grass, string, hair, and bark woven together almost like cloth. The babies are quite safe down inside it, and they seem to enjoy the wind rocking them. I wouldn't want a home like that because I prefer mine on a firm base, but the Goldies like it.
        - id: ch01-b36
          speaker: welcome_robin
          text: >-
            Their nest may look dangerous, but it's one of the safest kinds I know. Snakes and cats never get all the way up there. Even most feathered nest robbers can't reach the eggs because they lie so deep inside. Some call Goldy the Golden Robin. He isn't a Robin at all, but I'd be very proud to have him in my family. He's every bit as useful as he is handsome, and that's saying a great deal. He simply loves caterpillars. Ah, Mrs. Robin is calling me. Good-bye, Peter.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Welcome Robin flew away, and Peter settled down once more to think about everything he had learned.
