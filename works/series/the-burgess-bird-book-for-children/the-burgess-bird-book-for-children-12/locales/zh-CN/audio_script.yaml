audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 伶俐健谈，责备时尖锐却不失活泼
        timbre: 清脆灵巧
        pace: 轻快多变
        pitch: 高音
    mrs_goldy:
      display_name: 金羽太太
      tts:
        delivery: 勤快利落，说话务实而坚定
        timbre: 柔和清脆
        pace: 明快
        pitch: 中高音
    welcome_robin:
      display_name: 报春知更鸟
      tts:
        delivery: 友善开朗，讲解时从容而笃定
        timbre: 清朗温厚
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十二章　意想不到的亲戚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            彼得这些天又有别的事情要忙。说得更准确些，是有别的事情勾起了他的好奇心，所以他好几天没去老果园。等他再来时，附近所有鸟儿都气愤不已。切贝克和他那位文静的小妻子住在一棵树上，此刻，树上树下正在开一场声讨大会。鸟儿们七嘴八舌，吵个不停。彼得知道一定出了事，可他拼命听了半天，也没听明白究竟是怎么回事。
        - id: ch01-b02
          speaker: narrator
          text: 好不容易，他总算让珍妮注意到了自己。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 出什么事了？大家为什么闹成这样？
        - id: ch01-b04
          speaker: narrator
          text: 珍妮激动得一刻也停不下来。她的小眼睛直冒火星，尾巴比平时翘得更高。
        - id: ch01-b05
          speaker: jenny_wren
          text: 太丢脸了！她给所有长羽毛的鸟儿丢了脸，这事非管不可！一想到那么卑鄙的家伙也长着羽毛，我就觉得羞耻！
          emotion: angry
        - id: ch01-b06
          speaker: peter_rabbit
          text: 到底怎么回事？你先安静一会儿，把事情告诉我。你说的那个卑鄙家伙到底是谁？
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            狡猾莎莉，就是那只牛鹂！我还盼着她今年别来老果园丢人现眼，她偏偏来了。切贝克夫妇今天早晨出去吃东西，回来时，竟在自己的巢里发现了她的一枚蛋。他们气坏了，谁能怪他们？换了我，干脆就把那枚蛋扔出去。对，我一定会把它扔出去！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 彼得眨眨眼，又捋着胡须，还是一头雾水。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 狡猾莎莉是谁？她为什么把蛋生在那里？
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            天哪，彼得，你连她都不知道？她是黑鸟家族的一员，也是我认识的家伙里最懒、最没用、最鬼祟、最没良心、最自私的一个！
        - id: ch01-b11
          speaker: narrator
          text: 珍妮停下来喘了一口气，马上又说了下去。
        - id: ch01-b12
          speaker: jenny_wren
          text: >-
            她懒得自己筑巢，又不肯照顾自己的孩子，才把蛋生在切贝克家。彼得，你知道那枚蛋孵出来以后会怎样吗？
        - id: ch01-b13
          speaker: narrator
          text: 彼得摇摇头，老实承认自己不知道。
        - id: ch01-b14
          speaker: jenny_wren
          text: >-
            那枚蛋孵出来以后，小牛鹂差不多会有切贝克家宝宝的两倍大。个头那么大，多半食物都会叫他抢走。切贝克夫妇再怎么努力，也护不住自己的孩子，眼看着这个大家伙把小切贝克们的食物抢走。偏偏他们心肠软，看这个小坏蛋是没人照看的孤儿，准会拼命喂他，把自己累得只剩皮包骨头。
          emotion: angry
        - id: ch01-b15
          speaker: jenny_wren
          text: >-
            最糟的是，莎莉还会对别的鸟用这一招，而且她每次都专挑比自己小的鸟儿下手。她狡猾极了，根本没人看见她在附近出现。今天早晨，大家都在忙，她偷偷溜进老果园，生下蛋，又偷偷溜走，谁也没抓住她。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 你说她也是黑鸟家族的？
        - id: ch01-b17
          speaker: narrator
          text: 珍妮使劲点了点头。
        - id: ch01-b18
          speaker: jenny_wren
          text: >-
            没错。谢天谢地，她不是我的亲戚，不然我再也抬不起头了。你听，大榆树上的金羽还在唱歌呢。我真不懂，他明知道自己的亲戚刚做出这种可耻的事，怎么还能唱得那么好听。
        - id: ch01-b19
          speaker: jenny_wren
          text: >-
            同一个家族的成员，竟会差得这么远。金羽太太筑的巢，是我见过最了不起的巢之一，莎莉却连一座巢也懒得筑。我要是金羽，我就——
        - id: ch01-b20
          speaker: peter_rabbit
          text: 等等！莎莉既然属于黑鸟家族，和金羽拟鹂有什么关系？
        - id: ch01-b21
          speaker: jenny_wren
          text: >-
            这你都不知道？你这么爱打听别人家的事，知道的倒真不多。拟鹂、草地鹨、拟八哥和食米鸟，全都属于黑鸟家族。他们每一个都是红翼黑鸟的亲戚，牛鹂莎莉也和他们是一家。所以，莎莉当然也是金羽的亲戚。
        - id: ch01-b22
          speaker: narrator
          text: 彼得倒吸了一口气，话都说不利索了。
        - id: ch01-b23
          speaker: peter_rabbit
          text: 我……我一点儿也不知道，原来这些鸟儿彼此都是亲戚。
        - id: ch01-b24
          speaker: jenny_wren
          text: 他们当然是。瞧，那不正是狡猾莎莉吗！
          emotion: surprised
        - id: ch01-b25
          speaker: narrator
          text: >-
            彼得瞥见一只灰褐色的鸟，觉得她有点像红翼太太。她和红翼太太个头差不多，模样也很相像。看得出来，她一直极力躲着大家。一发现自己被认出来，她立刻朝老牧场的方向飞走了。
        - id: ch01-b26
          speaker: narrator
          text: >-
            那天下午晚些时候，彼得恰巧也去了老牧场，又看见莎莉和几个同伴在牛脚边走来走去，忙着啄取食物。其中一只的头、颈和胸脯都是褐色，其余羽毛乌黑发亮。彼得猜那一定是牛鹂先生。看他们和那些牛相处得那么亲近，他这才明白，牛鹂的名字是怎么来的。
        - id: ch01-b27
          speaker: narrator
          text: >-
            鸟儿们确信莎莉已经离开老果园，便各自回去料理自己的事情和家务，珍妮也不例外。没人再陪彼得说话，他就在老石墙旁找了个阴凉处坐下，仔细琢磨今天听来的这些怪事。
        - id: ch01-b28
          speaker: narrator
          text: >-
            过了一会儿，巴尔的摩拟鹂金羽落在离彼得最近的苹果树上。彼得觉得，自己从没见过谁穿得这么漂亮。他的头、颈、喉部和上背都是黑色，下背和胸脯呈美丽的深橙色。肩头闪着一道橙色，翅膀其余部分都是黑色，还镶着白边，尾巴则是黑橙相间。彼得早就听人叫他“火鸟”，现在终于明白了缘故。他的歌声也和羽衣一样华美丰润。
        - id: ch01-b29
          speaker: narrator
          text: >-
            没过多久，金羽太太也来了。和俊美的丈夫相比，她穿得朴素多了，身上的褐色多于黑色，橙色也比较暗淡。她一点时间也没花在唱歌上，锐利的眼睛马上发现，彼得头顶的灌木里缠着一截细绳。她高兴地叫了一声，飞下来衔住绳子。可是绳子缠得很牢，她使出全部力气，又拖又拽，还是扯不下来。金羽发现妻子遇到了麻烦，立即停住歌声，飞下来帮忙。他们一起拖呀，拽呀，拽呀，拖呀，直到不得不停下来喘口气。
        - id: ch01-b30
          speaker: mrs_goldy
          text: >-
            这截绳子我们一定要拿到。我到处找绳子，这还是头一回找到。有了它，我们正好能把鸟巢牢牢系在树枝上。不管风刮得多猛，我都再也不用担心鸟巢会被扯落了。
        - id: ch01-b31
          speaker: narrator
          text: >-
            他们歇过气，又拖呀，拽呀，拽呀，拖呀，终于把绳子扯了下来。金羽太太得意地衔着绳子飞走，金羽也跟在后面。彼得看着他们飞到农夫布朗家附近的大榆树上，落在一根细长而摇摆不定的树枝顶端。他看见那里挂着一个像袋子似的东西，知道那一定就是他们的鸟巢。
        - id: ch01-b32
          speaker: peter_rabbit
          text: 我的天！起风时，他们待在上面一定会被颠得很厉害。我看他们的宝宝都要给甩出来了！
          emotion: surprised
        - id: ch01-b33
          speaker: welcome_robin
          text: 不用替他们担心。
        - id: ch01-b34
          speaker: narrator
          text: 彼得抬头一看，报春知更鸟就在上方。
        - id: ch01-b35
          speaker: welcome_robin
          text: >-
            金羽太太筑的巢，是我见过最了不起的巢之一。它像一个深深的口袋，用草、细绳、毛发和树皮织在一起，织得就像一块布。巢那么深，宝宝待在里面十分安全，而且他们似乎很喜欢让风摇来摇去。
        - id: ch01-b36
          speaker: welcome_robin
          text: >-
            我自己可不喜欢那样的家，因为我愿意把家安在牢固的地基上，不过金羽夫妇喜欢。那座巢看起来危险，其实是我见过最安全的鸟巢之一。蛇和猫绝对爬不了那么高，长羽毛的偷蛋贼也没几个能把那么深的蛋够出来。
        - id: ch01-b37
          speaker: welcome_robin
          text: >-
            金羽有时也叫金色知更鸟。他根本不是真正的知更鸟，可要真是我们家族的一员，我一定会觉得非常骄傲。他不光漂亮，还和自己的外表一样有用，这已经是很高的称赞了。他最喜欢的食物就是毛毛虫。知更鸟太太在叫我了。再见，彼得。
        - id: ch01-b38
          speaker: narrator
          text: 报春说完便飞走了。彼得又一次安安稳稳地坐好，一个人继续慢慢地细想今天听到和看到的这一切奇事。
