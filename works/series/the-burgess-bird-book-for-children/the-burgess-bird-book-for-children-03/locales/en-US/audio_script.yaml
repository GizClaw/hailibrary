audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, playful, and quick
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, sharp, and affectionate
        timbre: small and crisp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Jenny Has a Good Word for Some Sparrows
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The morning after Jenny and Mr. Wren fought with Bully the English Sparrow, Peter Rabbit was back in the Old Orchard. He simply had to know where Jenny would make her home. Only a very great danger could have kept him away. Peter was secretly afraid that, without their old house, Jenny and Mr. Wren might leave the orchard for good. So when he hopped over a low place in the old stone wall and heard Mr. Wren singing with all his might, he felt greatly relieved.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The song came from the far side of the orchard, well away from the home Bully and Mrs. Bully had chosen. Peter hurried across the orchard toward it. He found Mr. Wren at once, but Jenny was nowhere in sight. He was just about to ask where she was when he spotted her carrying a tiny stick in her bill. She flashed her sharp eyes at him without saying a word. With that stick in her mouth, she couldn't talk. Jenny vanished into a small hole in a thick branch of an old apple tree. She had hardly popped in before she popped right back out. Her mouth was empty now, and her tongue was free.
        - id: ch01-b03
          speaker: jenny_wren
          text: You should stop singing and come help me.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jenny spoke sharply. Mr. Wren obeyed. He stopped his song and went looking for a twig as tiny as the one Jenny had carried into the hole.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Well! You found another house very quickly, didn't you?
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            Of course we did. We can't waste our time sitting around the way certain people do.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Peter grinned and looked a little foolish, but he wasn't offended. Jenny often talked that way, and he was used to it.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Aren't you worried that Bully will try to throw you out of this house too?
        - id: ch01-b09
          speaker: narrator
          text: Jenny's little eyes flashed more sharply than ever.
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            Let him try! This doorway is so small that he couldn't get anything but his head through it. If he sticks his head inside while I'm home, I'll peck his eyes out!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: She sounded so fierce that Peter burst out laughing.
        - id: ch01-b12
          speaker: peter_rabbit
          text: I truly believe you would.
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            I certainly would. But I'm far too busy to stand here talking, Peter Rabbit. Mr. Wren, surely you can see that stick is much too big.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Jenny snatched the stick from Mr. Wren's mouth and dropped it on the ground. Mr. Wren meekly went to find another, and Jenny joined the search. As Peter watched, he understood why people so often called her a feathered busybody.
        - id: ch01-b15
          speaker: narrator
          text: >-
            For quite a while, Peter watched Jenny and Mr. Wren carry one stick and bit of straw after another through the little doorway. It began to look as though they meant to fill the entire inside of the tree. Just watching them work made Peter positively tired. Mr. Wren paused for a song now and then, but Jenny never wasted a minute. Somehow, she still found plenty of time to talk.
        - id: ch01-b16
          speaker: jenny_wren
          text: I expect Little Friend the Song Sparrow arrived some time ago.
        - id: ch01-b17
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            Yes. I saw him by the Laughing Brook just a day or two ago. He wouldn't admit it, but I'm certain he already has a nest with eggs in it.
        - id: ch01-b19
          speaker: narrator
          text: Jenny jerked her tail and nodded hard.
        - id: ch01-b20
          speaker: jenny_wren
          text: >-
            That's probably true. His journey isn't as long as ours, so naturally he arrives sooner. Have you ever seen two cousins as different as Little Friend and Bully? Everyone is fond of Little Friend.
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            You're right. Everyone loves him. The sound of his song makes me feel warm and happy inside. I think it does that for everyone. Why do we hardly ever see him in the Old Orchard?
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            He would rather live in a damp place with plenty of bushes. It would never do if we all wanted the same sort of home. Besides, Little Friend isn't a tree bird at all. He likes to stay on the ground or close to it. You'll never find his nest much more than a foot or two above the ground, and very often it sits right on the ground. Of course, I like Mr. Wren's song best. Even so, I must admit that Little Friend sings one of the happiest songs of anyone I know. And he's wonderfully modest, just like us Wrens.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Peter turned away to hide a smile. Little Friend the Song Sparrow was shy and retiring. He was content to fill the world with gladness through his song while keeping himself out of sight. Jenny, on the other hand, loved to be seen and heard.
        - id: ch01-b24
          speaker: narrator
          text: Jenny kept chattering as she searched for more nest material.
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            You've noticed that Little Friend and his wife dress very much alike, haven't you? They don't bother with bright colors, any more than we Wrens do. That shows good taste. I like the little brown caps they wear, and the way brown streaks run along their breasts and sides. They're very useful birds, too. It's a shame that troublesome Bully never learns anything from them. I suppose they remain here later in the fall than we do.
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            Yes. They stay until Jack Frost drives them away. I can't think of anyone we miss more after they leave.
        - id: ch01-b27
          speaker: jenny_wren
          text: Since we're talking about Sparrows, have you seen Whitethroat?
        - id: ch01-b28
          speaker: narrator
          text: >-
            Jenny had stopped to rest in the doorway of her new home. She looked down at Peter, whose face suddenly brightened.
        - id: ch01-b29
          speaker: peter_rabbit
          text: >-
            I certainly have! He stayed here for a few days while traveling north. I wish he would live here all year, but no place seems to please him like the Great Woods of the North. I could listen to his song all day. Do you know what it always sounds as if he's saying?
        - id: ch01-b30
          speaker: jenny_wren
          text: What does it sound like?
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            “I live happ-i-ly, happ-i-ly, happ-i-ly.” I suppose he really does, because he makes everyone else so happy.
        - id: ch01-b32
          speaker: narrator
          text: Jenny gave one of her firm nods.
        - id: ch01-b33
          speaker: jenny_wren
          text: >-
            I don't know Whitethroat as well as I know some birds. But whenever I've seen him in the South, he has behaved like a perfect gentleman. He's sociable, too. He enjoys traveling with other birds.
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            I've seen that myself. He nearly always has companions when he passes this way. Some Sparrows look so much alike that I can barely tell one from another. But Whitethroat is easy to know. He's one of the largest Sparrows, and he has that beautiful white throat. With his black-and-white cap and the bright yellow patch in front of each eye, he's a handsome bird. I've heard that the birds in his northern home dearly love him. They say he sings all the time.
        - id: ch01-b35
          speaker: jenny_wren
          text: >-
            I suppose Scratcher the Fox Sparrow has passed through as well. He started his journey before we did.
        - id: ch01-b36
          speaker: peter_rabbit
          text: >-
            Yes. He spent a night in the dear Old Briar-patch. He's a fine-looking bird, the biggest of all the Sparrows, and what a singer! I only wish his coat were a different color. It always makes me think of Reddy Fox, and I dislike anything that reminds me of him. While Scratcher was visiting, I learned something about him that I don't believe you know.
        - id: ch01-b37
          speaker: jenny_wren
          text: What did you learn?
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            When Scratcher searches among the leaves, he scratches with both feet at the same time. It really is funny to watch him do it.
        - id: ch01-b39
          speaker: jenny_wren
          text: >-
            Pooh! I knew that already. What do you think my eyes are for? I thought you had something new to tell me.
        - id: ch01-b40
          speaker: narrator
          text: Peter looked disappointed.
