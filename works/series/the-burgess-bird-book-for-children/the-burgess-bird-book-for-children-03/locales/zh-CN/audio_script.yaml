audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
    mr_wren:
      display_name: 鹪鹩先生
      tts:
        delivery: 热情勇敢，情绪来得直率
        timbre: 清亮饱满
        pace: 明快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第三章　珍妮替几只麻雀说好话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            打架风波过去一夜，第二天早晨，兔子彼得又跑进了老果园。他实在太想知道珍妮夫妇会到哪里安家了，除非遇上极大的危险，否则谁也拦不住他。彼得暗暗担心，他们住不回老房子，会一气之下离开老果园。幸好，他刚从老石墙的低处跳过去，就听见鹪鹩先生正放开嗓子唱歌。一听这歌声，他总算放下心来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            歌声在果园另一头，离恶霸夫妇安家的地方远着呢。彼得急忙赶过去，马上看见了鹪鹩先生，却没找到珍妮。他正要开口问她去了哪里，珍妮忽然出现了，嘴里还叼着一根细树枝。她那双尖亮的小眼睛冲彼得一闪，难得没说话。叼着东西的时候，她那张快嘴也只好歇一歇。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得看着珍妮钻进老苹果树一根粗枝上的小洞。她才进去，马上又探出身来。树枝放下了，她也终于能开口了。
        - id: ch01-b04
          speaker: jenny_wren
          text: 鹪鹩先生，别只顾唱了，快来帮忙。
        - id: ch01-b05
          speaker: narrator
          text: 鹪鹩先生听话地停住歌声，四处寻找和珍妮刚才那根一样细小的枝条。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 嘿，你们这么快就另找着房子了？
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            那还用说。我们可不能像我认识的某些家伙一样，坐在那里白白耗时间。
        - id: ch01-b08
          speaker: narrator
          text: >-
            彼得咧嘴一笑，模样有点儿难为情，却没有生气。反正珍妮这样的挖苦，他早就听惯了。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 要是恶霸来抢这所房子，你不怕他把你们赶出去吗？
        - id: ch01-b10
          speaker: narrator
          text: 珍妮眼里锐利的光闪得更亮了。
        - id: ch01-b11
          speaker: jenny_wren
          text: >-
            他尽管来！这个门洞这么小，他最多只能伸进一颗脑袋。我要是正在里面，他还敢把头探进来，我就啄瞎他的眼睛！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 珍妮说得凶极了，彼得忍不住笑出了声。
        - id: ch01-b13
          speaker: peter_rabbit
          text: 我看你还真做得出来。
        - id: ch01-b14
          speaker: jenny_wren
          text: >-
            我当然做得出来。兔子彼得，我忙着呢，没工夫停下来聊天。鹪鹩先生，你选的那根树枝太粗了，这还看不出来吗？
        - id: ch01-b15
          speaker: narrator
          text: >-
            珍妮从鹪鹩先生嘴里抢下树枝，扔到地上。鹪鹩先生一点儿也没反驳，只管去找别的，珍妮也加入进来。彼得这才明白，大家为什么常说珍妮是个长着羽毛的忙碌管家婆。
        - id: ch01-b16
          speaker: narrator
          text: >-
            接下来好一阵子，彼得看着珍妮夫妇一趟又一趟地飞，把小树枝和草茎衔进洞里。他们忙个不停，像是要把整棵树的肚子全都塞满。彼得光看着就累得够呛。鹪鹩先生时不时停下来唱上几句，珍妮却连一分钟也不肯浪费。不过，忙碌可一点儿也没耽误她说话，她照样能说个不停。
        - id: ch01-b17
          speaker: jenny_wren
          text: 歌带鹀小朋友应该早就回来了吧？
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            是啊。一两天前，我还在欢笑溪旁见过他。他自己不肯承认，可我敢说，他的巢早就筑好了，里面连蛋都有了。
        - id: ch01-b19
          speaker: narrator
          text: 珍妮猛地甩了甩尾巴，又用力点起头来。
        - id: ch01-b20
          speaker: jenny_wren
          text: >-
            我就知道。他不用像我们这样走那么远，所以总能早到。你这一辈子见过哪一对亲戚像小朋友和他的表亲恶霸这样，差得这么远吗？恶霸处处惹人讨厌，小朋友却谁见了都喜欢。
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            可不是嘛。小朋友一唱歌，我心里就说不出的高兴，大家听了大概都一样。奇怪的是，他怎么很少到老果园这边来呢？
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            他喜欢潮湿又长满灌木的地方。要是大家都挑同样的住处，那怎么行？小朋友本来就不住树上，他总爱待在地面附近。你找他的巢，绝不会在一两英尺以上，常常还会直接找到地上。说到歌声，我当然最喜欢鹪鹩先生唱的。不过，小朋友的歌确实是我听过最欢快的歌之一。他还特别谦逊，和我们鹪鹩很像。
        - id: ch01-b23
          speaker: narrator
          text: >-
            彼得赶紧把脸转开，免得珍妮看见他在偷笑。珍妮最喜欢让别人看见自己，也最喜欢让别人听见自己。歌带鹀小朋友可不一样。他腼腆又安静，只管用歌声给全世界带来快乐，自己却能躲起来就躲起来。
        - id: ch01-b24
          speaker: narrator
          text: 珍妮继续找筑巢的材料，嘴里也继续说着。
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            你也看出来了吧，小朋友和他太太穿得很像。他们跟我们鹪鹩一样，不爱那些鲜艳颜色，品位真不错。我喜欢他们头顶的棕色小帽子，还有胸前和身体两侧的棕色条纹。他们做的事也很有用。讨厌的恶霸要肯向他们学一学就好了。到了秋天，他们比我们走得晚，对吧？
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            对。霜杰克不来赶，他们就不肯走。等他们离开以后，我们惦记得最厉害的，恐怕就是他们了。
        - id: ch01-b27
          speaker: narrator
          text: 珍妮在新房门口停下来歇了片刻，低头看着彼得。
        - id: ch01-b28
          speaker: jenny_wren
          text: 说到麻雀一家，你见着白喉了吗？
        - id: ch01-b29
          speaker: narrator
          text: 彼得一听，脸上立刻有了光彩。
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            我当然见着了！他往北走的时候，在这里停了好几天。我真盼着他永远住下来，可他认定北方大森林才是最好的地方。他那首歌，我听上一整天也不烦。你知道吗，他每次唱起来，都像是在说一句话。
        - id: ch01-b31
          speaker: jenny_wren
          text: 你听着像是哪一句话？
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            “我过得快——活，快——活，真快——活。”他一定真的过得很快活，因为他的歌也能让别人那么快乐。
        - id: ch01-b33
          speaker: narrator
          text: 珍妮照她平常的样子，使劲点了点头。
        - id: ch01-b34
          speaker: jenny_wren
          text: >-
            我跟他不算很熟，不过在南方见过他几回。他每次都像一位真正的绅士。他也爱和大家来往，旅行的时候总喜欢有同伴。
        - id: ch01-b35
          speaker: peter_rabbit
          text: >-
            我也发现了。他经过这里时，身边几乎从来不缺伙伴。有些麻雀实在太像，我总分不清，可白喉很好认。他在麻雀一族里算是大个子，还有一片漂亮的白喉咙。头顶一道黑、一道白，两只眼睛前面各有一点亮黄色，真好看。听说在北方老家，大家都特别喜欢他，还说他一天到晚都在唱歌。
        - id: ch01-b36
          speaker: jenny_wren
          text: 刨叶狐色雀也经过这里了吧？他出发得也比我们早。
        - id: ch01-b37
          speaker: peter_rabbit
          text: >-
            来过。他还在亲爱的老蔷薇丛之家过了一夜。刨叶长得也漂亮，是麻雀一族里最大的，唱起歌来更是好听得不得了。我只嫌他的外衣颜色不好。那颜色老让我想到狐狸雷迪，我可不喜欢任何会叫我想起那家伙的东西。他来做客的时候，我发现了一件关于他的事。我敢说，这回你肯定不知道。
        - id: ch01-b38
          speaker: jenny_wren
          text: 你到底发现了什么？
        - id: ch01-b39
          speaker: peter_rabbit
          text: >-
            他在落叶里刨东西时，两只脚会一起往后蹬。那模样看起来真有趣！
        - id: ch01-b40
          speaker: jenny_wren
          text: >-
            呸，我早知道了！你当我的眼睛是摆设吗？我还以为你真能说出一件我不知道的事呢。
        - id: ch01-b41
          speaker: narrator
          text: 彼得听完，满脸都是失望。
