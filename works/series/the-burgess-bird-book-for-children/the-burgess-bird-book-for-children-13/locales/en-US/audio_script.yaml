audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, playful, and quick
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    striped_chipmunk:
      display_name: Striped Chipmunk
      tts:
        delivery: quick, knowing, and good-humored
        timbre: crisp and nimble
        pace: brisk
        pitch: high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, dry, and unhurried
        timbre: mellow and grounded
        pace: slow
        pitch: medium-low
    mrs_bobolink:
      display_name: Mrs. Bobolink
      tts:
        delivery: clever, cheerful, and self-possessed
        timbre: light and clear
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: More of the Blackbird Family
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit was dozing. Yes, sir, he was fast asleep. He hadn't meant to doze, but whenever Peter sits still for long and tries to think, he is almost sure to fall asleep. After a while he woke with a start. At first he couldn't tell what had awakened him. Then, as he sat blinking, a few rich notes floated down from the top of the nearest apple tree.
        - id: ch01-b02
          speaker: peter_rabbit
          text: That must be Goldy the Oriole.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter peeped out. He looked and looked, but Goldy was nowhere in sight. Instead, Peter saw a stranger about Goldy's size and shape. The bird looked so much like Goldy that Peter almost wondered whether Goldy had changed his clothes. Of course that couldn't be true, yet even the stranger's song sounded a little like Goldy's.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The stranger's head, throat, and back were black, just like Goldy's. His wings had the same white trimming. But the rest of his suit wasn't the beautiful orange that made Goldy so proud. It was a beautiful chestnut brown. Peter blinked and stared as hard as he could.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Who in the world can that be?
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter had spoken aloud without thinking. A sharp voice answered from so close beside him that he jumped.
        - id: ch01-b07
          speaker: striped_chipmunk
          text: Don't you know him?
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter spun around. Striped Chipmunk sat grinning at him from the top of the old stone wall.
        - id: ch01-b09
          speaker: striped_chipmunk
          text: >-
            That's Weaver the Orchard Oriole. If you've never met him, you certainly should. He's one of the nicest people in the whole Old Orchard, and I just love hearing him sing.
        - id: ch01-b10
          speaker: peter_rabbit
          text: Is he related to Goldy?
        - id: ch01-b11
          speaker: narrator
          text: Peter still sounded doubtful.
        - id: ch01-b12
          speaker: striped_chipmunk
          text: >-
            Of course he is. One good look ought to tell you that. He's Goldy's first cousin. And here comes Mrs. Weaver now. I hope they've decided to build in the Old Orchard this year.
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            I'm glad you told me who she is. I never would have guessed it.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Peter studied the newcomer. She looked nothing like Weaver. Her clothes were olive green and dull yellow, with white marks on her wings. Peter couldn't help thinking that she must find it much easier to hide among the green leaves than her handsome husband did.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Mrs. Weaver flew down to the ground and picked up a long blade of grass.
        - id: ch01-b16
          speaker: striped_chipmunk
          text: >-
            They're building here! There's no doubt about it. I'm glad. Have you ever seen their nest, Peter? No, of course you haven't. You said you'd never seen them before. Their nest is wonderful. They make nearly all of it from fine grass, weaving the pieces together in the most amazing way.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Do they make a hanging nest like Goldy's?
        - id: ch01-b18
          speaker: narrator
          text: Peter asked the question a little timidly.
        - id: ch01-b19
          speaker: striped_chipmunk
          text: >-
            It isn't as deep as Goldy's nest. They hang it between twigs near the end of a branch, but they fasten it more closely to the branch. It isn't deep enough to swing the way Goldy's does.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Peter had just opened his mouth to ask another question when a loud sniffing sound came from farther along the old stone wall. He didn't wait to hear it twice. He knew Bowser the Hound was coming.
    - id: ch02
      title: Jimmy Skunk Hunts for Eggs
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: Good-bye, Striped Chipmunk! This is no place for me.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Peter whispered the words and raced toward the dear Old Briar-patch. He was in such a hurry crossing the Green Meadows that he nearly ran into Jimmy Skunk before he saw him.
        - id: ch02-b03
          speaker: jimmy_skunk
          text: Why are you rushing so, Peter?
        - id: ch02-b04
          speaker: peter_rabbit
          text: >-
            Bowser the Hound nearly found me in the Old Orchard. I'm surprised he hasn't picked up my tracks already. He may do it any minute. I'm glad to see you, Jimmy, but I think I'd better keep moving.
        - id: ch02-b05
          speaker: jimmy_skunk
          text: >-
            There's no need to rush, Peter. No need at all. Stay and talk for a while. That old nuisance won't bother you when you're with me.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Jimmy never hurried himself. Peter hesitated. He wanted to gossip, but Bowser still made him nervous. Then Peter listened and heard nothing. Bowser's great voice wasn't telling the whole world that he had found Peter's tracks. So Peter decided to stay for a few minutes.
        - id: ch02-b07
          speaker: peter_rabbit
          text: What are you doing out here on the Green Meadows?
        - id: ch02-b08
          speaker: narrator
          text: Jimmy grinned.
        - id: ch02-b09
          speaker: jimmy_skunk
          text: >-
            Since you want to know, I'm looking for grasshoppers and grubs. I've also begun to think I might find some fresh eggs. I don't eat eggs very often, but now and then one tastes good.
        - id: ch02-b10
          speaker: peter_rabbit
          text: >-
            This seems like an odd place to hunt for eggs. When I want something, I look where I'm likely to find it.
        - id: ch02-b11
          speaker: jimmy_skunk
          text: Exactly, Peter. That's exactly why I'm here.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Jimmy nodded as though Peter had said something very wise. Peter looked puzzled because he was puzzled. Before he could ask what Jimmy meant, a rollicking song made them both look up.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The singer hovered in midair on quivering wings. His clothes looked much like Jimmy Skunk's, all black and white. In a few places the white was tinged with yellow, especially behind his neck. This was Bubbling Bob the Bobolink. And how he sang! His notes seemed to tumble over one another.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Jimmy rose a little on his hind legs and watched to see exactly where Bubbling Bob dropped into the grass. Then Jimmy began moving toward that spot. All at once Peter understood. Bubbling Bob always built his nest on the ground. Jimmy was hunting for Bob's eggs.
        - id: ch02-b15
          speaker: jimmy_skunk
          text: You haven't happened to see Mrs. Bob anywhere nearby, have you, Peter?
        - id: ch02-b16
          speaker: narrator
          text: Jimmy tried to make the question sound careless.
        - id: ch02-b17
          speaker: peter_rabbit
          text: >-
            No. And even if I had, I wouldn't tell you where she was. You ought to be ashamed of wanting to rob a beautiful singer like Bubbling Bob.
        - id: ch02-b18
          speaker: jimmy_skunk
          text: >-
            Pooh! What harm would it do? If I found the eggs, Bob and Mrs. Bob could just build another nest and lay more. They wouldn't be any worse off, and I would get a good breakfast.
        - id: ch02-b19
          speaker: peter_rabbit
          text: But think how much work it would take them to build another nest.
        - id: ch02-b20
          speaker: jimmy_skunk
          text: >-
            Why should that worry me? Anyone with so much time for singing can manage a little extra work.
        - id: ch02-b21
          speaker: peter_rabbit
          text: >-
            You're horrid, Jimmy Skunk. You're simply horrid. I hope you don't find even one egg!
          emotion: angry
    - id: ch03
      title: Two Clever Bobolinks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Peter turned once more toward the dear Old Briar-patch. Jimmy Skunk kept going toward the place where Bubbling Bob had vanished in the long grass. Peter traveled only a short way before sitting up to watch him.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Just before Jimmy reached that place, Bubbling Bob rose into the air again. He poured out his rollicking song as though his heart had room for nothing but happiness. Then he caught sight of Jimmy Skunk and grew terribly excited. He flew down into the grass a little farther away, rose again, and began to scold.
        - id: ch03-b03
          speaker: narrator
          text: >-
            It certainly looked as though Bob had dipped into the grass to warn Mrs. Bob. Jimmy must have thought so too, because he changed direction at once. Bob repeated the whole trick, and Jimmy followed again. Peter grew anxious. He knew how patient Jimmy could be, and he was afraid Jimmy would find the nest.
        - id: ch03-b04
          speaker: narrator
          text: >-
            At last Peter tired of watching and started again for the dear Old Briar-patch. Just before he reached it, a brown bird ran across the path in front of him. She reminded him a little of Mrs. Redwing and Sally Sly the Cowbird, though she was smaller. Then she flew up to the top of a dried mullein stalk left from the year before. It was Mrs. Bobolink. Peter knew her well, for they were very good friends.
        - id: ch03-b05
          speaker: peter_rabbit
          text: >-
            Oh! What are you doing here? Don't you know Jimmy Skunk is over there hunting for your nest? Aren't you worried to death? I certainly would be in your place.
          emotion: surprised
        - id: ch03-b06
          speaker: narrator
          text: Mrs. Bob chuckled.
        - id: ch03-b07
          speaker: mrs_bobolink
          text: >-
            Isn't he wonderful? And isn't he clever? Just look at him leading that black-and-white robber away.
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: >-
            Of course she meant Bubbling Bob, not Jimmy Skunk. Peter stared at her for a whole minute.
        - id: ch03-b09
          speaker: peter_rabbit
          text: Do you mean your nest isn't over there at all?
        - id: ch03-b10
          speaker: narrator
          text: Mrs. Bob chuckled even harder.
        - id: ch03-b11
          speaker: mrs_bobolink
          text: Of course it isn't over there.
        - id: ch03-b12
          speaker: peter_rabbit
          text: Then where is it?
        - id: ch03-b13
          speaker: mrs_bobolink
          text: >-
            I'm not telling. It isn't over there, and it isn't anywhere close to there. The real place is Bob's secret and mine, and we plan to keep it that way. Now I must find something to eat.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Mrs. Bob gave Peter a quick good-bye and flew to the far side of the dear Old Briar-patch.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Peter remembered seeing her run over the ground before she flew up to the old mullein stalk. He returned to the first place he had spotted her and searched through all the grass. He found nothing.
        - id: ch03-b16
          speaker: narrator
          text: >-
            You see, Mrs. Bobolink had fooled Peter every bit as cleverly as Bubbling Bob had fooled Jimmy Skunk.
