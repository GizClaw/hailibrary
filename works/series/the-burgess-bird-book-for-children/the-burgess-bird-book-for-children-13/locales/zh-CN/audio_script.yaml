audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 机灵健谈，话音爽快而热情
        timbre: 清脆灵巧
        pace: 明快
        pitch: 高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 慢条斯理，带着满不在乎的狡黠
        timbre: 圆润低沉
        pace: 舒缓
        pitch: 中低音
    bubbling_bob:
      display_name: 欢歌鲍勃
      tts:
        delivery: 欢快奔放，警告时急促有力
        timbre: 明亮饱满
        pace: 轻快多变
        pitch: 中高音
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 聪慧俏皮，说话从容而带笑意
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十三章　黑鸟家族的更多成员
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得打起了瞌睡。没错，他真的睡着了。他本来一点儿也没想睡，可只要安静地坐上很久，再试着专心琢磨事情，他十有八九就会睡过去。过了一阵，彼得猛地惊醒了。他起初不知道是什么把自己吵醒的，只坐在那里不停地眨眼睛。忽然，离他最近的苹果树梢上传来几声圆润悦耳的鸣唱。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 是金羽拟鹂。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得探头一看，却怎么也找不到金羽，倒看见了一个陌生人。他的大小和身形都与金羽相仿。除了衣裳颜色不同，简直像极了金羽。彼得乍看之下，差点以为金羽不知怎么换了一身衣服。当然，他知道那不可能。可陌生人的歌声也和金羽有几分相似，事情便像是真的一样。陌生人的头、喉咙和后背乌黑，翅膀也同样镶着白边。不过，金羽身上其余地方是他引以为傲的漂亮橙色，这位陌生人却穿着美丽的栗色衣裳。
        - id: ch01-b04
          speaker: narrator
          text: 彼得使劲眨巴着眼睛，又目不转睛地盯着那个陌生人看。他只顾着猜对方是谁，竟不知不觉把心里的话说出了声。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 这到底是谁呀？
        - id: ch01-b06
          speaker: striped_chipmunk
          text: 你不认识他吗？
        - id: ch01-b07
          speaker: narrator
          text: 尖细的声音就在彼得身边响起，吓得他跳了起来。他猛一转身，只见花栗鼠条纹坐在老石墙顶上，正冲他咧嘴笑。
        - id: ch01-b08
          speaker: striped_chipmunk
          text: >-
            那是果园拟鹂织匠。你要是不认识他，那可真该认识认识。他是老果园里最招人喜欢的居民之一，我最爱听他唱歌了。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 他……他和金羽是亲戚吗？
        - id: ch01-b10
          speaker: striped_chipmunk
          text: >-
            当然啦。你只要看上一眼，就该猜出来。他是金羽的嫡亲表兄弟。瞧，织匠太太也来了。我真希望他们今年已经决定在老果园里筑巢。
        - id: ch01-b11
          speaker: narrator
          text: >-
            彼得仔细打量着这位新来的鸟儿。她和织匠一点儿也不像，穿着橄榄绿和暗黄色的衣裳，翅膀上还带着白色斑纹。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 幸亏你告诉我她是谁，要不然我怎么也猜不出来。
        - id: ch01-b13
          speaker: narrator
          text: 彼得不由得想，她躲进绿叶丛里，一定比她那俊美的丈夫容易多了。正看着，织匠太太飞到地面，捡起一根长长的草叶。
        - id: ch01-b14
          speaker: striped_chipmunk
          text: >-
            他们真的要在这里筑巢，千真万确！这可太好啦。彼得，你见过他们的巢吗？当然没有，你刚才还说，以前从没见过他们。他们的巢真是个奇迹，一点儿也不夸张。整座巢几乎全用细草做成。他们能用顶了不起的办法，把草一根根编织在一起。
          emotion: happy
        - id: ch01-b15
          speaker: peter_rabbit
          text: 他们也像金羽那样，把巢吊起来吗？
        - id: ch01-b16
          speaker: striped_chipmunk
          text: >-
            不过没有金羽的巢那么深。他们把巢吊在树枝末梢的细枝之间，再把巢身更牢地缚在枝条上。巢不够深，所以不会像金羽的巢那样来回摇荡。
        - id: ch01-b17
          speaker: narrator
          text: >-
            彼得刚张开嘴，想再问一个问题，沿着老石墙稍远的地方忽然传来一声响亮的嗅闻。他根本没等第二声。只听一下，他就知道猎犬鲍泽来了。
        - id: ch01-b18
          speaker: peter_rabbit
          text: 再见，条纹！这里可不能久留。
        - id: ch01-b19
          speaker: narrator
          text: >-
            彼得拔腿就向亲爱的老荆棘丛跑。他急着赶到那里，匆匆穿过绿草地时，差点一头撞上臭鼬吉米才看见对方。
        - id: ch01-b20
          speaker: jimmy_skunk
          text: 彼得，你急什么？
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            猎犬鲍泽刚才差点在老果园里发现我。真奇怪，他竟然还没找到我的踪迹。我看他随时会追来。见到你真高兴，吉米，可我最好还是赶紧走。
        - id: ch01-b22
          speaker: jimmy_skunk
          text: >-
            别这么急，彼得。别急嘛，停下来聊一会儿。只要你和我待在一起，那个老讨厌鬼就不敢来烦你。
        - id: ch01-b23
          speaker: narrator
          text: >-
            吉米自己可是从来不着急的。彼得犹豫起来。他很想聊聊闲话，可心里仍在提防鲍泽。不过，他一直没听见鲍泽用洪亮的声音向全世界宣布找到了自己的踪迹，便决定停留几分钟。
        - id: ch01-b24
          speaker: peter_rabbit
          text: 你跑到绿草地来干什么？
        - id: ch01-b25
          speaker: jimmy_skunk
          text: >-
            你非知道不可的话，我在找蚱蜢和蛴螬。我还忽然觉得，说不定能找到几枚新鲜鸟蛋。我不常吃鸟蛋，不过偶尔吃一枚，味道也不错。
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            依我看，跑到绿草地找鸟蛋也太奇怪了。我要找一样东西，就会去最可能找到它的地方。
        - id: ch01-b27
          speaker: jimmy_skunk
          text: 正是这样，彼得，一点儿不错。所以我才来这里呀。
        - id: ch01-b28
          speaker: narrator
          text: >-
            吉米赞许地点了点头。彼得还是满脸困惑，他确实想不明白吉米的意思。还没等他再问，一阵欢快奔放的歌声便引得他们一齐抬头。歌手就在半空中，一边唱一边颤动着翅膀。他也穿着一身黑白，很像臭鼬吉米。不过，他有几处白羽泛着淡黄，后颈上尤其明显。原来是食米鸟欢歌鲍勃。瞧他唱得多起劲，一个个音符仿佛争先恐后地从嘴里滚落下来。
        - id: ch01-b29
          speaker: narrator
          text: >-
            吉米稍稍立起后腿，想看清鲍勃究竟落进了哪片草丛，随后便朝那里走去。彼得忽然明白了。他记得，欢歌鲍勃总把巢筑在地面上。原来吉米来到绿草地，就是想寻找鲍勃的鸟蛋。
        - id: ch01-b30
          speaker: jimmy_skunk
          text: 彼得，你没有碰巧在附近见过鲍勃太太吧？
        - id: ch01-b31
          speaker: narrator
          text: 吉米故意装出一副漫不经心的样子。
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            没有。就算见过，我也不会告诉你她在哪里。吉米，鲍勃唱得这么美，你却想偷他的鸟蛋，真该觉得害臊。
          emotion: angry
        - id: ch01-b33
          speaker: jimmy_skunk
          text: >-
            呸，这有什么要紧？我要是找到那些蛋，他和鲍勃太太只管再筑一座巢，多生几枚就是了。他们不会有任何损失，我却能美美地吃上一顿早饭。
        - id: ch01-b34
          speaker: peter_rabbit
          text: 可是你想想，他们还得花多少力气，才能再筑一座巢呀。
        - id: ch01-b35
          speaker: jimmy_skunk
          text: 那可不值得我操心。谁有那么多工夫唱歌，多干一点活也完全负担得起。
        - id: ch01-b36
          speaker: peter_rabbit
          text: 你真讨厌，吉米，实在太讨厌了。我就希望你一枚蛋也找不到。哼！
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: >-
            说完，彼得再次朝亲爱的老荆棘丛奔去，吉米却继续走向鲍勃消失的那片草地。彼得只走了一小段，便直起身子回头观察吉米。就在吉米快到鲍勃落下的地方时，鲍勃又飞上天空，放声唱起那欢快奔放的歌。他仿佛满心都是快乐，再也装不下别的东西。可一看见吉米，他顿时激动起来。他落进前方稍远的草丛，随即又飞起来，冲着吉米厉声责骂。
        - id: ch01-b38
          speaker: narrator
          text: >-
            看样子，鲍勃落进草丛，多半是要警告鲍勃太太。吉米显然也这么想，立刻改道朝那边走。鲍勃便把刚才的举动原样又来了一遍。彼得越来越焦急。他很清楚臭鼬吉米有多么耐心，也非常害怕吉米慢慢找下去，真会发现那座藏在地面上的鸟巢。
        - id: ch01-b39
          speaker: narrator
          text: >-
            过了一会儿，彼得看腻了，便继续往亲爱的老荆棘丛走。快到时，一只褐色的鸟从他面前横穿小路，又飞上去年留下的一株毛蕊花顶端。她使彼得想起红翼太太和牛鹂狡猾莎莉，只是个头比她们更小。原来是食米鸟鲍勃太太。彼得很熟悉她，因为他们是很要好的朋友。
        - id: ch01-b40
          speaker: peter_rabbit
          text: >-
            哎呀，你怎么会在这里？你不知道臭鼬吉米正在那边找你的巢吗？你一点也不担心？要是换了我，早就急死了。
        - id: ch01-b41
          speaker: narrator
          text: 鲍勃太太咯咯笑了。她说的当然是欢歌鲍勃，不是臭鼬吉米。
        - id: ch01-b42
          speaker: mrs_bob
          text: 他是不是很可爱？是不是特别聪明？你瞧，他正领着那个黑白相间的强盗往别处走呢。
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: 彼得盯着她，足足看了一分钟。
        - id: ch01-b44
          speaker: peter_rabbit
          text: 你是说，你们的巢根本不在那里？
        - id: ch01-b45
          speaker: narrator
          text: 鲍勃太太笑得更厉害了。
        - id: ch01-b46
          speaker: mrs_bob
          text: 当然不在那里。
        - id: ch01-b47
          speaker: peter_rabbit
          text: 那到底在哪里？
        - id: ch01-b48
          speaker: mrs_bob
          text: >-
            这可不能告诉你。反正不在那里，离那里也远着呢。到底在哪里，是鲍勃和我的秘密，我们打算一直保守下去，谁也不告诉。现在我得去找点东西吃了。
        - id: ch01-b49
          speaker: narrator
          text: 鲍勃太太匆匆向彼得道过别，便飞到了亲爱的老荆棘丛另一边。
        - id: ch01-b50
          speaker: narrator
          text: >-
            彼得想起，鲍勃太太飞上那株老毛蕊花以前，曾沿着地面跑过一段。他回到最初看见她的地方，在周围的草丛里到处寻找，却什么也没发现。你瞧，鲍勃太太骗过彼得的本领，一点儿也不比欢歌鲍勃骗过臭鼬吉米的本领差。
