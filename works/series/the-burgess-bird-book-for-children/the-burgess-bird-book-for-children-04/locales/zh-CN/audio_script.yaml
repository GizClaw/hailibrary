audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 随和实在，带一点憨厚的幽默
        timbre: 浑厚温暖
        pace: 从容
        pitch: 中低音
    chippy:
      display_name: 奇皮
      tts:
        delivery: 勤快爽朗，说话简洁利落
        timbre: 清亮轻巧
        pace: 明快
        pitch: 中高音
    sweetvoice:
      display_name: 甜嗓子
      tts:
        delivery: 温和开朗，忙碌时依然彬彬有礼
        timbre: 甜润清澈
        pace: 轻快自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第四章　奇皮、甜嗓子和小黑点
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            有一阵子，鹪鹩珍妮忙得连话也顾不上多说，只来得及数落鹪鹩先生。她怪他不肯好好干活，反倒花那么多时间唱歌。彼得看着夫妻俩不停往树洞里搬东西，觉得他们简直想拿破烂把整截树干塞得满满当当。
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            里面那些东西，筑六个巢都够了。他们准是觉得干活有趣，才一趟又一趟地往里搬。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得猜得还真不算离谱。这个季节晚些时候，他发现鹪鹩先生又筑了一个巢，明明根本用不上，这才知道是怎么回事。眼下，珍妮忙得没空理他，彼得便蹦蹦跳跳地去找土拨鼠约翰尼。约翰尼住在老果园最远的那个角落，家门开在一棵老苹果树盘结的树根之间。一路上，彼得还在琢磨麻雀一族的事。这一家子的成员明明那么多，为什么除了恶霸英国麻雀，其他成员很少出现在老果园里呢？
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            你好啊，土拨鼠约翰尼！你在老果园住了这么久，肯定知道答案。麻雀一族里，除了恶霸那个吵闹的讨厌鬼，为什么没有谁把巢筑在这里的树上？是不是恶霸把他们全赶跑了？
        - id: ch01-b05
          speaker: johnny_chuck
          text: 彼得，你的耳朵到底怎么了？你的眼睛又怎么了？
        - id: ch01-b06
          speaker: peter_rabbit
          text: 我的耳朵和眼睛好得很。哪一天也不比你的差。
        - id: ch01-b07
          speaker: narrator
          text: >-
            约翰尼咧嘴笑了，叫彼得仔细听。不远处的树上传来一串清亮的叫声：“唧，唧，唧，唧。”根本不用别人提醒，彼得就知道该往哪儿看。其实，他连看也不必看，一听就认出了这位相识多年、交情很深的老朋友。那是一只整整齐齐的小鸟，头顶红棕色，棕色的背羽间夹着黑纹，翅膀和尾巴也是淡棕色。他穿着灰背心，长着黑嘴巴，两只眼睛上方各有一道细细的白纹。彼得认识的小绅士里，再没有谁比他更精神了。他就是鸣雀奇皮，也是麻雀一族里最小的成员。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            我怎么把奇皮忘了！从我记事起，他就住在老果园。可我从没想过要找他的巢。约翰尼，他的巢也像恶霸的巢那样乱七八糟吗？
        - id: ch01-b09
          speaker: johnny_chuck
          text: >-
            那可差远了！奇皮夫妇已经两次在这棵老苹果树上筑巢。让我告诉你，他们的巢里一点儿破烂都没有。那小巢跟他们一样精致，绝不会比需要的更大一点。巢大多是用细细的干草根筑成的，里面还铺着马鬃。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 你说里面铺着什么？
        - id: ch01-b11
          speaker: narrator
          text: 彼得的口气听起来，像是怀疑约翰尼在捉弄他。
        - id: ch01-b12
          speaker: johnny_chuck
          text: >-
            真的是马鬃。天知道现在上哪儿找去，可他们就是找得到。奇皮正好来了，你自己问他吧。
        - id: ch01-b13
          speaker: narrator
          text: >-
            奇皮和奇皮太太轻快地从一棵树飞到另一棵树，一路向彼得他们这边靠近，最后落在彼得和约翰尼头顶正上方的一根枝条上。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 你们好啊！二位这么忙，巢还没有筑完吗？
        - id: ch01-b15
          speaker: chippy
          text: >-
            快完工了，只差马鬃。我们正要去农夫布朗家的牲口院里找。你们在附近见过吗？
        - id: ch01-b16
          speaker: narrator
          text: >-
            彼得和约翰尼一同摇了摇头。彼得还老实承认，就算亲眼看见马鬃，自己也认不出来。他常常发现狐狸雷迪和老郊狼外衣上掉下来的毛，也见过獾迪格和白尾鹿莱特富特身上的毛。他对这些都不陌生，可马身上长的毛，对他来说完全是另一回事。
        - id: ch01-b17
          speaker: chippy
          text: >-
            我们找的不是马身上的短毛，一定得是尾巴或马鬃上的长毛。用那种长毛铺鸟巢，才最舒服。
        - id: ch01-b18
          speaker: narrator
          text: >-
            奇皮夫妇去了很久，一直没有回来。可他们再次出现时，两只鸟嘴里各自衔着一根黑色长毛。他们终于找到了想要的东西，奇皮太太别提有多高兴了。她还特意向彼得解释，等这些长毛铺好，小巢很快就会准备妥当，迎接她打算产在里面的四枚漂亮小蛋。那些蛋是蓝色的，每一枚的一端都带着黑色斑点。彼得和约翰尼一起望着两位长羽毛的小朋友，看他们在苹果树远远伸出的一根枝条上，为那个小巢做最后的修整。彼得越看越喜欢。
        - id: ch01-b19
          speaker: peter_rabbit
          text: 奇皮和奇皮太太真叫人喜欢。
        - id: ch01-b20
          speaker: johnny_chuck
          text: >-
            谁不喜欢他们呢？大家有多喜欢奇皮夫妇，就有多讨厌恶霸夫妇。你知不知道，有人也叫他们树麻雀？大概是因为他们常在树上筑巢吧。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 奇皮可不该叫树麻雀。他有个表亲，名字就叫树麻雀。
        - id: ch01-b22
          speaker: johnny_chuck
          text: 我可从来没听说过这位表亲。
        - id: ch01-b23
          speaker: narrator
          text: >-
            彼得立刻咧嘴笑了。他终于有机会把一件新鲜事告诉约翰尼。只要能把别人不知道的事讲给人家听，彼得就再快活不过，这回他总算逮着了机会。
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            谁叫你整个冬天都在睡觉呢？要是你醒着，肯定认识树麻雀小黑点。他整个冬天都住在这里。你刚刚心血来潮，决定睡醒，他就动身回遥远的北方老家了。
        - id: ch01-b25
          speaker: johnny_chuck
          text: 为什么叫他小黑点？
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            因为他胸口正中有个圆圆的小黑点。我倒不知道大家为什么叫他树麻雀。他不像奇皮那样总待在树上，我反而常在矮灌木和地面上见到他。依我看，奇皮才更配得上树麻雀这个名字。对了，有人还叫小黑点冬日奇皮呢。
        - id: ch01-b27
          speaker: johnny_chuck
          text: >-
            这也太乱了！奇皮被叫作树麻雀，真正的树麻雀又被叫作奇皮，谁能不糊涂？
          emotion: surprised
        - id: ch01-b28
          speaker: peter_rabbit
          text: >-
            要是他们同时待在这里，也许真会弄乱。可奇皮刚来，小黑点就走。等奇皮刚走，小黑点又来了。这样安排挺好，尤其是他们长得很像。不过，小黑点稍微大些，胸口总有那个黑点，奇皮可没有。哎呀，我该回亲爱的老蔷薇丛之家了！再见，约翰尼。
        - id: ch01-b29
          speaker: narrator
          text: >-
            彼得吧嗒吧嗒地蹦走了，直奔亲爱的老蔷薇丛之家。就在他前方不远处，草里忽然飞起一只颜色较浅、身上带着条纹的棕色小鸟。小鸟展开尾巴时，彼得清清楚楚地看见，尾巴外缘长着两根白羽毛。只凭这两根羽毛，彼得就认出了另一位自己非常喜欢的小朋友。这是暮歌雀甜嗓子。整个麻雀一族里，只有他的尾巴上长着白羽毛。
        - id: ch01-b30
          speaker: peter_rabbit
          text: 到亲爱的老蔷薇丛之家来，给我唱支歌吧！
        - id: ch01-b31
          speaker: narrator
          text: >-
            甜嗓子听见彼得招呼，却又落回了草丛里。等彼得一路赶到他身边，甜嗓子正忙着从地上收拢干草，预备衔起满满一嘴，根本没有停下手里的活。
        - id: ch01-b32
          speaker: sweetvoice
          text: >-
            不行，现在真不行，兔子彼得。我忙着呢。我们的巢早就该筑好了。我要是不赶紧把这把草送过去，甜嗓子太太可要不耐烦了。
        - id: ch01-b33
          speaker: peter_rabbit
          text: 你的巢在哪儿？在树上吗？
        - id: ch01-b34
          speaker: narrator
          text: 彼得故意装出一副什么也不知道的样子。
        - id: ch01-b35
          speaker: sweetvoice
          text: >-
            这可是秘密。除了甜嗓子太太和我，谁也不知道鸟巢在哪儿。不过，我可以告诉你，它不在树上。再多透露一点吧，它就在奶牛博茜留下的一个蹄印里。
        - id: ch01-b36
          speaker: peter_rabbit
          text: 你说在什么里？
          emotion: surprised
        - id: ch01-b37
          speaker: sweetvoice
          text: >-
            在奶牛博茜的蹄印里。你还记得吧，今年早春，地面又湿又软，博茜走到哪里，哪里就会留下深深的脚印。这样的一个蹄印，用来安放鸟巢再合适不过。我们选中的这个，准是整片绿草原上最好的一个。好了，兔子彼得，你走吧，别再耽误我干活。我有太多事情要做，没工夫坐在这里聊天。等那位快活、浑圆、红彤彤的太阳先生到紫山后面睡下，我也许会去亲爱的老蔷薇丛之家边上，给你唱一会儿歌。我最喜欢在那个时候唱。
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            我会等着你。你有多爱唱，我就有多爱听。我觉得那是一天里最适合唱歌的时候。说错了，我是说，那是最适合听歌的时候。
        - id: ch01-b39
          speaker: narrator
          text: >-
            当然，彼得自己根本不会唱歌。当天晚上，甜嗓子果然来了。那时候，黑影刚刚从四周悄悄爬出来，慢慢铺上绿草原。甜嗓子停在彼得头顶的一丛荆棘尖上，把那支无比甜美的小歌唱了一遍又一遍。四周已经全黑了，他还是继续唱个不停。彼得并不知道，正因为甜嗓子有傍晚歌唱的习惯，大家才把他叫作暮歌雀。
