  chapters:
    - id: ch01
      title: Chippy, Sweetvoice, and Dotty
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For a while, Jenny Wren was too busy to talk to Peter. The only talking she did was to scold Mr. Wren for spending so much time singing instead of working. Back and forth the Wrens went with nesting material. It looked to Peter as though they meant to stuff the whole tree trunk with rubbish.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            They must have enough in there for half a dozen nests. I believe they carry it in just because they enjoy the work.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter was not far wrong. Later that season, he found Mr. Wren building another nest that he never used.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Since Jenny had no more time for him just then, Peter hopped over to see Johnny Chuck. Johnny's home was tucked between the roots of an old apple tree in a far corner of the Old Orchard. All the way there, Peter kept thinking about the Sparrow family. It was a very large family, yet it seemed strange how seldom he found any of them in the orchard. The one exception was Bully the English Sparrow.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            Hello, Johnny Chuck! You've lived here a long time, so perhaps you can explain something. Why don't any Sparrows but that noisy nuisance Bully build in the orchard trees? Did Bully drive all the others away?
        - id: ch01-b06
          speaker: narrator
          text: Johnny was sitting on his doorstep. He shook his head.
        - id: ch01-b07
          speaker: johnny_chuck
          text: >-
            Peter, what is wrong with your ears? And what is wrong with your eyes?
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            Nothing is wrong with them. My ears and eyes are as good as yours any day.
        - id: ch01-b09
          speaker: narrator
          text: Johnny grinned.
        - id: ch01-b10
          speaker: johnny_chuck
          text: Listen!
        - id: ch01-b11
          speaker: narrator
          text: >-
            Peter listened. From a tree only a little way off came a clear call. “Chip, chip, chip, chip.” No one had to tell Peter where to look. He knew that voice without seeing the singer. It belonged to one of his oldest and best friends in the Old Orchard. Chippy was a trim little gentleman with a red-brown cap and a brown back streaked with black. His wings and tail were brownish, his waistcoat was gray, his bill was black, and a tiny white line ran above each eye. Everyone called him Chippy, though his proper name was Chipping Sparrow. He was the smallest member of the Sparrow family.
        - id: ch01-b12
          speaker: narrator
          text: Peter looked a little foolish.
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            I forgot all about Chippy. Now that I think of it, he has been here for as long as I can remember. I've never seen his nest because I never thought to look for it. Is it as trashy as his cousin Bully's nest?
        - id: ch01-b14
          speaker: narrator
          text: Johnny laughed.
        - id: ch01-b15
          speaker: johnny_chuck
          text: >-
            Their nest is nothing like Bully's! Chippy and Mrs. Chippy have built in this very apple tree twice. Their nest hasn't a bit of trash in it. It's just as dainty as they are and no larger than it needs to be. They make it mostly from fine, dry little roots and line the inside with horsehair.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Did you say they use horsehair?
        - id: ch01-b17
          speaker: narrator
          text: Peter sounded as if he thought Johnny might be fooling him.
        - id: ch01-b18
          speaker: johnny_chuck
          text: >-
            It's true. Goodness knows where they find horsehair these days, but they always do. Here comes Chippy now. Ask him yourself.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Chippy and Mrs. Chippy flitted from tree to tree until they reached a branch right above Peter and Johnny.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            Hello! You two look very busy. Isn't your nest finished yet?
        - id: ch01-b21
          speaker: chippy
          text: >-
            We're almost finished. We only need the horsehair. We're flying to Farmer Brown's barnyard now to look for some. Have either of you seen any nearby?
        - id: ch01-b22
          speaker: narrator
          text: >-
            Peter and Johnny both shook their heads. Then Peter admitted he would not recognize horsehair even if he saw it. He had often found hairs shed from the coats of Reddy Fox and Old Man Coyote. He knew the hair of Digger the Badger and Lightfoot the Deer as well. But hair from a horse was altogether another matter.
        - id: ch01-b23
          speaker: chippy
          text: >-
            We don't want hair from a horse's coat. We need the long hair from its tail or mane. Nothing makes a nicer nest lining.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Chippy flew after Mrs. Chippy. They were gone a long time, but when they returned, each carried one long black hair. They had found exactly what they wanted.
        - id: ch01-b25
          speaker: narrator
          text: Mrs. Chippy was in high spirits and made sure Peter knew why.
        - id: ch01-b26
          speaker: mrs_chippy
          text: >-
            Our little nest will soon be ready for the four beautiful blue eggs I mean to lay there. Each one will have black spots at one end.
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: >-
            Peter and Johnny stood watching while their two little feathered friends worked. Far out on a branch of one of the apple trees, Chippy and Mrs. Chippy carefully put the finishing touches on their tiny nest.
        - id: ch01-b28
          speaker: peter_rabbit
          text: I just love Chippy and Mrs. Chippy.
        - id: ch01-b29
          speaker: johnny_chuck
          text: >-
            Everybody does. Folks love those two as much as they dislike Bully and his wife. Did you know Chipping Sparrows are sometimes called Tree Sparrows? I suppose it's because they so often put their nests in trees.
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            No, I didn't know that. But Chippy shouldn't be called a Tree Sparrow. He has a cousin whose proper name is Tree Sparrow.
        - id: ch01-b31
          speaker: narrator
          text: Johnny looked doubtful.
        - id: ch01-b32
          speaker: johnny_chuck
          text: I've never heard of that cousin.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Peter grinned. He was never happier than when he could tell someone something they did not know.
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            You would know him if you didn't sleep all winter. Dotty the Tree Sparrow stays here through the winter. He left for his home in the Far North about the time you finally decided to wake up.
        - id: ch01-b35
          speaker: johnny_chuck
          text: Why do you call him Dotty?
        - id: ch01-b36
          speaker: peter_rabbit
          text: >-
            He has a small, round black dot right in the middle of his breast. I don't know why anyone calls him Tree Sparrow. He doesn't stay in trees the way Chippy does. I see him much more often in low bushes or on the ground. Chippy has a better claim to the name. Come to think of it, I've also heard Dotty called the Winter Chippy.
        - id: ch01-b37
          speaker: johnny_chuck
          text: >-
            Goodness, what a muddle! Chippy is called a Tree Sparrow, and the Tree Sparrow is called Chippy. How does anyone keep them straight?
          emotion: surprised
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            It might be confusing if they were both here at the same time. But Chippy arrives just when Dotty leaves for the Far North, and Dotty comes back as Chippy goes away. That is a very good arrangement because the two birds look so much alike. Dotty is a little bigger than Chippy, though, and he always has that black spot on his breast. Chippy never does. Goodness gracious, I need to get back to the dear Old Briar-patch! Good-by, Johnny Chuck.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Away went Peter Rabbit, lipperty-lipperty-lip, toward the dear Old Briar-patch.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Just ahead of him, a rather pale little brown bird flew up out of the grass. The bird's feathers were streaked, and when he spread his tail, Peter saw a white feather on each outer edge. Those two white feathers were all Peter needed to recognize another little friend he loved. It was Sweetvoice the Vesper Sparrow, the only member of the Sparrow family with white feathers in his tail.
        - id: ch01-b41
          speaker: peter_rabbit
          text: Come over to the dear Old Briar-patch and sing for me!
        - id: ch01-b42
          speaker: narrator
          text: >-
            Sweetvoice dropped into the grass again. By the time Peter reached him, he was gathering a mouthful of dry grass.
        - id: ch01-b43
          speaker: sweetvoice
          text: >-
            I can't do it now, Peter Rabbit. I'm much too busy. Our nest should be finished already, and Mrs. Sweetvoice will lose patience if I don't carry this grass over there quickly.
        - id: ch01-b44
          speaker: peter_rabbit
          text: Where is your nest? Is it in a tree?
        - id: ch01-b45
          speaker: narrator
          text: Peter asked the question as innocently as he could.
        - id: ch01-b46
          speaker: sweetvoice
          text: >-
            I won't tell you that. No living soul knows where the nest is except Mrs. Sweetvoice and me. But I will tell you it isn't in a tree. And here's one more clue. It's in a hoofprint made by Bossy the Cow.
        - id: ch01-b47
          speaker: peter_rabbit
          text: Did you say it's in a what?
          emotion: surprised
        - id: ch01-b48
          speaker: sweetvoice
          text: >-
            A hoofprint made by Bossy the Cow. Early this spring, the ground was wet and soft, and Bossy left deep footprints everywhere she walked. One of them makes a wonderful place for a nest. I think we chose the very best hoofprint on all the Green Meadows. Now please run along, Peter. I have too much work to sit here and talk. Perhaps I'll visit the edge of the dear Old Briar-patch and sing for a while after jolly, round, red Mr. Sun goes to bed behind the Purple Hills. I love singing then.
        - id: ch01-b49
          speaker: narrator
          text: Sweetvoice had repeated the answer with a soft chuckle.
        - id: ch01-b50
          speaker: peter_rabbit
          text: >-
            I'll watch for you. You can't love singing any more than I love listening. I think that's the finest time of day for a song. I mean it's the finest time to hear one.
        - id: ch01-b51
          speaker: narrator
          text: Peter, of course, did not sing at all.
        - id: ch01-b52
          speaker: narrator
          text: >-
            That night, Sweetvoice kept his word. Just as the Black Shadows began creeping out across the Green Meadows, he perched on top of a bramble bush above Peter's head. There he sang the sweetest little song over and over. The light faded, but Sweetvoice went right on singing, even after it was quite dark.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Peter did not know it, but Sweetvoice's habit of singing in the evening is what gave him the name Vesper Sparrow.
