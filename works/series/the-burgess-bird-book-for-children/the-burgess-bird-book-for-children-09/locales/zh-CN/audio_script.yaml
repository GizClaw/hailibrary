audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    longbill:
      display_name: 长嘴丘鹬
      tts:
        delivery: 沉着友善，话里带着自信
        timbre: 温厚清晰
        pace: 从容
        pitch: 中音
    mrs_woodcock:
      display_name: 丘鹬太太
      tts:
        delivery: 温和爽快，语气亲切
        timbre: 柔和圆润
        pace: 适中
        pitch: 中高音
    teeter:
      display_name: 跷跷斑腹矶鹬
      tts:
        delivery: 活泼敏捷，焦急时急促有力
        timbre: 清脆明亮
        pace: 轻快
        pitch: 高音
    mrs_teeter:
      display_name: 跷跷太太
      tts:
        delivery: 温柔安定，带着轻松的机敏
        timbre: 轻柔清亮
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第九章　长嘴和跷跷
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            珍妮鹪鹩斩钉截铁地钻进了自家那扇圆门。彼得一看就知道，再等她出来聊天也是白费工夫。他还不想回亲爱的老荆棘丛，可老果园里的鸟儿个个都忙着呢，谁也没空陪他闲聊。眼下似乎只剩回家这一条路了。彼得抬起一只长长的后脚，挠了挠长耳朵，正努力琢磨还能去哪儿，忽然听见微笑池那边传来树蛙清亮的叫声。那是微笑池畔最甜美的一群小歌唱家。
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            有了，我就去微笑池！我已经有一阵子没到那边去了，正好跑过去向青蛙爷爷问声好，也去看看红翼黑鹂。红翼可是最早从南方回来的一批鸟，我却一直没去拜访他，实在太不像话啦。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得想到就走，一点时间也不耽搁，立刻蹦蹦跳跳地沿着绿森林边缘出发。他一直走到欢笑溪流出森林的地方。溪水从这里穿过绿草地，一路流向微笑池。两岸长满了灌木和小树，脚下有些地方又软又湿，泥泞得很。彼得并不怕弄湿脚，还是漫不经心地往前蹦。没想到，一个东西突然从他鼻子底下呼地飞了起来。彼得吓得猛然停住，两眼瞪得老大，只来得及看见一道褐色身影越过高高的灌木梢，转眼便消失了。
        - id: ch01-b04
          speaker: narrator
          text: 彼得定了定神，忍不住笑起来。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 原来是老朋友长嘴丘鹬！瞧我，把他都忘了。刚才他真把我吓了一跳。
        - id: ch01-b06
          speaker: mrs_woodcock
          text: 那你们正好扯平。你也吓了他一跳。我看见你来了，他可没看见。
        - id: ch01-b07
          speaker: narrator
          text: 彼得赶紧回头。丘鹬太太正躲在一丛草墩后面，探头看着他。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 我真不是故意的。他是不是吓得很厉害？
        - id: ch01-b09
          speaker: mrs_woodcock
          text: 至少他还敢回来。
        - id: ch01-b10
          speaker: narrator
          text: 她话音刚落，长嘴便从空中落下，停在彼得面前。
        - id: ch01-b11
          speaker: longbill
          text: >-
            我飞过灌木梢、快要看不见的时候认出了你，所以马上回来了。我小时候就学会了，受了惊，最好先飞走，再回头看看是不是真有危险。幸好来的只是你，彼得。我刚才正在这儿美美地吃饭，要是就这么丢下，实在舍不得。希望你不介意我继续吃。咱们可以趁我咽下每一口的空当儿聊天。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 当然不介意。
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得使劲朝四下细看，想知道长嘴究竟在吃什么好东西，却连一只虫子、一条蚯蚓也没找到。长嘴很有派头地走了两三步，彼得只好忍住笑。他看着气派十足，模样却很古怪。长嘴比讨喜知更鸟稍大，尾巴短，腿短，脖子也短，只有那张嘴长得出奇，简直把其他地方少掉的长度全补回来了。他背上的灰色、褐色、黑色和浅黄褐色混在一起，胸脯和下身则是漂亮的红褐色。最奇怪的还是脑袋。两只眼睛又大，位置又靠后，彼得甚至怀疑，他往后看会不会比往前看更容易。
        - id: ch01-b14
          speaker: narrator
          text: >-
            长嘴突然把嘴直扎进土里，一直扎到整张长嘴都看不见了。等他拔出来，彼得正好瞥见一截蚯蚓尾巴滑进他的喉咙。嘴扎过的地方留下一个整整齐齐的小圆洞。彼得这才发现，这样的小洞并不只有一个，四周的地面上到处都是。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 这些洞都是你钻的吗？
        - id: ch01-b16
          speaker: longbill
          text: 哪能全是我呀，有些是丘鹬太太钻的。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 难道每一个洞里都有蚯蚓？
        - id: ch01-b18
          speaker: narrator
          text: 长嘴点了点头。
        - id: ch01-b19
          speaker: longbill
          text: 那当然。要是不知道底下有蚯蚓，我们何必费劲钻洞呢？
        - id: ch01-b20
          speaker: narrator
          text: >-
            彼得想起讨喜知更鸟也会先侧耳细听，然后突然把嘴扎进土里，拉出一条蚯蚓。可讨喜捉的蚯蚓总是紧靠地面，长嘴找的却藏在泥土深处。彼得怎么也想不通，谁能知道它们躲在那里。况且，讨喜叼住蚯蚓时看得见，长嘴却什么也看不见。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 你就算知道下面有蚯蚓，怎么知道嘴已经碰到它了？嘴埋在土里，又怎么张开来捉住它呢？
        - id: ch01-b22
          speaker: narrator
          text: 长嘴轻声笑了。
        - id: ch01-b23
          speaker: longbill
          text: 这太容易了。我的嘴可是天底下最方便的一张。你看好啦！
        - id: ch01-b24
          speaker: narrator
          text: >-
            长嘴忽然把那张长嘴笔直伸到面前。只见上嘴尖抬了起来，嘴的其余部分却没有张开，甚至一动也没动。彼得从没见过这样的嘴，惊奇得目瞪口呆。
        - id: ch01-b25
          speaker: longbill
          text: >-
            我就是这么捉它们的。嘴碰到蚯蚓时，我能感觉出来。然后只要把上嘴尖一抬，一口夹住就行。我觉得现在脚底下就藏着一条，你瞧着，我这就把它捉出来。
        - id: ch01-b26
          speaker: narrator
          text: >-
            长嘴说完，便把嘴一点点钻进脚下的泥土，直到脑袋都快贴上地面。再把嘴拔出来时，果然有一条蚯蚓被他捉住了。
        - id: ch01-b27
          speaker: longbill
          text: 只有泥土松软的时候，我才能这样找吃的。所以地面一结冻，我就得往南飞。
        - id: ch01-b28
          speaker: peter_rabbit
          text: 真了不起。我想，没有别的鸟能这样找到藏在土里的蚯蚓吧。
        - id: ch01-b29
          speaker: longbill
          text: >-
            我的表亲杰克沙锥也能。他找蚯蚓的办法跟我一模一样，只是我们喜欢的地方不同。我爱待在灌木丛生的沼泽里，他却更喜欢湿漉漉的草甸。说不定你还认识他呢。
        - id: ch01-b30
          speaker: narrator
          text: 彼得点点头。
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            我认识。听你这么一说，你们还真像一家人，我以前却没想到他是你的亲戚。现在我得走啦。今天见到你真好，我一有机会就再来看你。
        - id: ch01-b32
          speaker: narrator
          text: >-
            彼得向长嘴夫妇道过别，继续沿欢笑溪走向微笑池。溪水流进池子的地方，有一小片铺满卵石的岸滩。一只纤秀利落的小鸟正贴着水边跑来跑去。他的腿相当长，嘴又细又长，褐灰色的背上带着黑色斑点和花纹，身上的白色小背心也整整齐齐地点着黑斑。每跑几步，他就停下来啄起一点东西，然后站上一会儿，用滑稽极了的姿势上下颠动。那身子在两条腿上平衡得恰到好处，前后摇摆起来，就像一副跷跷板。他正是彼得的老朋友，斑腹矶鹬跷跷。彼得一见他，便高高兴兴地向他问好。
        - id: ch01-b33
          speaker: teeter
          text: 皮特——威特！皮特——威特！
        - id: ch01-b34
          speaker: narrator
          text: >-
            跷跷转向彼得，一边上下颠动，一边不停地点头鞠躬。只有他才有这样的本事。彼得还没来得及再说一句，跷跷已经急匆匆地跑了过来。看他的样子，谁都知道一定出了什么叫他非常焦急的事。
        - id: ch01-b35
          speaker: teeter
          text: 兔子彼得，别动！千万别动！
          emotion: fearful
        - id: ch01-b36
          speaker: peter_rabbit
          text: 为什么？这里又没有危险，我怎么就不能动了？
        - id: ch01-b37
          speaker: narrator
          text: 这时，跷跷太太赶来，蹲在彼得面前的沙地上。
        - id: ch01-b38
          speaker: teeter
          text: >-
            谢天谢地，你总算停下来了！彼得，你刚才要是再走一步，就会正好踩到我们的蛋。真把我吓坏了。
          emotion: fearful
        - id: ch01-b39
          speaker: narrator
          text: 彼得听糊涂了。他明明没看见任何危险，也想不出脚下有什么不能走的理由。他盯着跷跷太太，脸上的困惑藏也藏不住。
        - id: ch01-b40
          speaker: peter_rabbit
          text: 可我什么都没看见呀。眼前只有一片沙地，哪里有鸟巢，哪里又有蛋？
        - id: ch01-b41
          speaker: narrator
          text: >-
            跷跷太太站起来，往旁边挪了一步。彼得终于看见了。沙地的小浅坑里只铺着几根草，四枚白蛋躺在其中，蛋壳上带着深色的大斑块。它们和周围的卵石实在太像了。要不是跷跷太太亲自指给他看，彼得无论如何也发现不了。他赶紧往后退了几步。跷跷太太悄悄回到蛋上，舒舒服服地安顿好。彼得忽然明白，要是没亲眼看见她坐下去，自己连她在那里也不会知道。她和四周的景物如此相像，谁会留意到她呢？
        - id: ch01-b42
          speaker: peter_rabbit
          text: >-
            哎呀，要不是你们及时提醒，我肯定已经踩上去了。幸亏没有踩着！可是这里什么遮挡也没有，你们怎么敢把蛋生在这样的地方呢？
        - id: ch01-b43
          speaker: narrator
          text: 跷跷太太轻轻笑了。
        - id: ch01-b44
          speaker: mrs_teeter
          text: >-
            彼得，这儿其实是天底下最安全的地方。蛋和周围的卵石太像，谁也瞧不见。只有像你刚才那样，有人从这里经过，没看见这些蛋，眼看就要踩上去时，它们才会遇到危险。不过，这种事很少发生。
