  chapters:
    - id: ch01
      title: Longbill and Teeter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jenny Wren had popped through her little round doorway so decisively that Peter knew there was no use waiting and hoping for more gossip. He wasn't ready to return home to the dear Old Briar-patch, but there seemed to be nothing else to do. Everyone in the Old Orchard was too busy for idle talk. Peter scratched one long ear with one long hind foot and tried to think of somewhere else to go. Just then, he heard the Hylas singing their clear “peep, peep, peep.” Those sweet singers lived at the Smiling Pool.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            That's where I'll go! I haven't visited the Smiling Pool in quite a while. I'll call on Grandfather Frog and Redwing the Blackbird. Redwing was one of the first birds back, and I've been terribly neglectful of him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once Peter had an idea, he never wasted time. He was off at once, lipperty-lipperty-lip. He kept close to the edge of the Green Forest until he reached the place where the Laughing Brook leaves the forest. From there, it runs through the Green Meadows on its way to the Smiling Pool. Bushes and young trees grew along both banks of the brook. The ground was soft and quite muddy in places, but Peter didn't mind getting his feet damp. He hopped along without a care.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Suddenly, something burst into the air right under his nose with a whistling sound. Peter stopped dead, his eyes nearly popping out. He caught one glimpse of a brown shape vanishing beyond the tall bushes. Then he chuckled.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            Well, I declare! I'd forgotten all about my old friend Longbill the Woodcock. He startled me for a moment.
        - id: ch01-b06
          speaker: mrs_woodcock
          text: >-
            Then you're even, because you startled him. I saw you coming, but Longbill didn't.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Peter turned quickly and saw Mrs. Woodcock peeking from behind a clump of grass.
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            I'm sorry. I truly didn't mean to frighten him. Do you think I scared him very badly?
        - id: ch01-b09
          speaker: mrs_woodcock
          text: Not badly enough to keep him away.
        - id: ch01-b10
          speaker: narrator
          text: Longbill himself dropped to the ground in front of Peter.
        - id: ch01-b11
          speaker: longbill_woodcock
          text: >-
            Just as I passed over the bushes, I recognized you, so I came straight back. When I was young, I learned that if something startles you, the best thing is to fly first and find out later whether there's any real danger. I'm glad it was only you, Peter. I was enjoying an excellent meal, and I wouldn't have liked leaving it. You won't mind if I keep eating, will you? We can talk between bites.
        - id: ch01-b12
          speaker: peter_rabbit
          text: Of course not. Go right ahead.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter stared all around, trying hard to discover what made such a fine meal. He couldn't see a single thing that looked good to eat. There wasn't even a bug or a worm crawling over the ground. Longbill took two or three steps in a stately fashion. Peter had to hide a smile. The bird carried himself as though he were very important, but at the same time, he was certainly odd-looking. He was a little larger than Welcome Robin. His tail was short, his legs were short, and his neck was short. But his bill was long enough to make up for all three. Gray, brown, black, and buff covered his back, while his breast and underside were a lovely reddish buff. The strangest part was his head. His eyes were very large, and they sat so far back that Peter wondered whether it was easier for Longbill to look behind himself than in front.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Without warning, Longbill drove his bill its full length into the earth. When he pulled it out, Peter saw the end of a worm slipping down his throat. A tidy round hole marked the spot. Now Peter noticed many little holes scattered nearby.
        - id: ch01-b15
          speaker: peter_rabbit
          text: Did you make every one of those little round holes?
        - id: ch01-b16
          speaker: longbill_woodcock
          text: Not all of them. Mrs. Woodcock made some.
        - id: ch01-b17
          speaker: peter_rabbit
          text: And did you find a worm in every hole?
        - id: ch01-b18
          speaker: narrator
          text: Longbill nodded.
        - id: ch01-b19
          speaker: longbill_woodcock
          text: >-
            Naturally. We wouldn't bother boring a hole unless we knew there was a worm waiting at the bottom.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Peter remembered watching Welcome Robin listen carefully, suddenly plunge his bill into the ground, and pull out a worm. But the worms Welcome caught were always close to the surface. Longbill's worms were deep in the earth, and Peter couldn't understand how anyone could possibly know they were there. And there was another mystery. Welcome could see when he had hold of a worm, but with his whole bill buried, Longbill couldn't see anything at all.
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            Even if you know a worm is down there, how can you tell when your bill reaches it? And how can you open your bill under the ground to catch it?
        - id: ch01-b22
          speaker: narrator
          text: Longbill chuckled.
        - id: ch01-b23
          speaker: longbill_woodcock
          text: >-
            That's simple. My bill is the handiest bill there is. Look at this!
        - id: ch01-b24
          speaker: narrator
          text: >-
            Longbill pointed his bill straight ahead. To Peter's amazement, he raised the tip of the upper half while the rest stayed closed.
        - id: ch01-b25
          speaker: longbill_woodcock
          text: >-
            That's how I catch them. I can feel when I reach a worm. Then I lift the top of my bill and grab it. I believe there's one beneath my feet right now. Watch.
        - id: ch01-b26
          speaker: narrator
          text: >-
            He bored down until his head almost touched the ground. When his bill came up again, it held a worm.
        - id: ch01-b27
          speaker: longbill_woodcock
          text: >-
            I can only do that in soft earth. That's why I must fly south as soon as the ground begins to freeze.
        - id: ch01-b28
          speaker: peter_rabbit
          text: >-
            That's wonderful. I suppose no one else can find worms hidden that way.
        - id: ch01-b29
          speaker: longbill_woodcock
          text: >-
            My cousin Jack Snipe can. He feeds just as I do, though he prefers marshy meadows to brushy swamps. Perhaps you've met him.
        - id: ch01-b30
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            Yes, I know him. Now that you mention it, I can see the family resemblance. I just never thought of him as your cousin. I must be going now. I'm very glad I found you, and I'll come calling again as soon as I can.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Peter said goodbye and followed the Laughing Brook down to the Smiling Pool. Right where the brook entered the pool, there was a little beach covered with pebbles. A slim, neat little bird hurried along the very edge of the water. He had fairly long legs and a long, slender bill. His back was brownish gray with black spots and markings, and more black spots dotted his neat white waistcoat. Every few steps, he stopped to pick up something. Then he stood still for a moment and bobbed up and down in the funniest way. His body seemed so perfectly balanced on his legs that it tipped back and forth like a seesaw. It was Peter's old friend Teeter the Spotted Sandpiper, and Peter greeted him with delight.
        - id: ch01-b33
          speaker: teeter_sandpiper
          text: Peet-weet! Peet-weet!
        - id: ch01-b34
          speaker: narrator
          text: >-
            Teeter turned toward Peter, bobbing and bowing in the way that only Teeter could. Before Peter could say another word, the little bird came running straight toward him. One look was enough to show that Teeter was very anxious about something.
        - id: ch01-b35
          speaker: teeter_sandpiper
          text: Don't move, Peter Rabbit! Stay right where you are!
        - id: ch01-b36
          speaker: peter_rabbit
          text: Why shouldn't I move?
        - id: ch01-b37
          speaker: narrator
          text: >-
            Peter saw no danger and couldn't imagine any reason to stand still. Then Mrs. Teeter hurried over and crouched in the sand directly in front of him.
        - id: ch01-b38
          speaker: teeter_sandpiper
          text: >-
            Thank goodness! One more step and you would have landed right on our eggs. You gave me a terrible fright.
          emotion: fearful
        - id: ch01-b39
          speaker: narrator
          text: >-
            Teeter was still bobbing and bowing as he spoke. Peter stared down at Mrs. Teeter, who sat just in front of him. He couldn't understand what Teeter meant, and his puzzled face plainly showed it.
        - id: ch01-b40
          speaker: peter_rabbit
          text: I don't see a nest. I don't see any eggs, either.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Mrs. Teeter stood up and stepped aside. There, in a little hollow in the sand, lay four white eggs marked with large dark blotches. Only a few bits of grass lined the hollow. The eggs looked so much like the pebbles around them that Peter never would have seen them in the world if Mrs. Teeter hadn't shown him. He quickly backed away by several steps. Mrs. Teeter slipped onto the eggs again and made herself comfortable. Then Peter realized something else. If he hadn't watched her settle there, he wouldn't have known she was there at all. She looked so much like everything around her that he never would have noticed her.
        - id: ch01-b42
          speaker: peter_rabbit
          text: >-
            My goodness! I surely would have stepped on those eggs if you hadn't stopped me. I'm so glad I didn't. But how can you dare to lay them out here in the open?
        - id: ch01-b43
          speaker: narrator
          text: Mrs. Teeter gave a soft chuckle.
        - id: ch01-b44
          speaker: mrs_teeter
          text: >-
            Why, this is the safest place anywhere, Peter. The eggs look so much like the pebbles that no one notices them. They're only in danger when someone comes along, as you did, and nearly steps on them without seeing them. That doesn't happen very often.
