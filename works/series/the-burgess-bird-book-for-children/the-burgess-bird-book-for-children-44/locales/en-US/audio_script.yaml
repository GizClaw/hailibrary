  chapters:
    - id: ch01
      title: Visitors from the Far North
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit had just asked Jumper the Hare whether anyone besides the Crossbills had come down from the Far North. Before Jumper could answer, a voice spoke from a tree just behind them.
        - id: ch01-b02
          speaker: piny_grosbeak
          text: I have.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The voice was so unexpected that Peter and Jumper both hopped in surprise. They spun around to see who had spoken. In the tree sat a bird a little smaller than Welcome Robin. At first, he looked as though he wore strawberry-red. A closer look showed slate-gray markings around his head, beneath his wings, and on his legs. His tail was brown. His brown wings were marked with black, white, and slate, and his bill was short and thick.
        - id: ch01-b04
          speaker: peter_rabbit
          text: Who are you?
        - id: ch01-b05
          speaker: narrator
          text: Peter's question was blunt and not at all polite, but the stranger did not seem bothered.
        - id: ch01-b06
          speaker: piny_grosbeak
          text: I'm Piny the Pine Grosbeak.
        - id: ch01-b07
          speaker: peter_rabbit
          text: Are you related to Rosebreast the Grosbeak? He nested in the Old Orchard last summer.
        - id: ch01-b08
          speaker: piny_grosbeak
          text: >-
            I certainly am. He's my own cousin. I've never met him, though. He never travels as far north as my home, and I never go down to the place where he spends winter. Still, everyone in the Grosbeak family is related.
        - id: ch01-b09
          speaker: peter_rabbit
          text: Rosebreast is a lovely bird. He's one of my very good friends.
        - id: ch01-b10
          speaker: piny_grosbeak
          text: Then you and I are sure to be good friends too.
        - id: ch01-b11
          speaker: narrator
          text: >-
            As Piny turned, Peter saw that his tail was clearly forked. It was not square across like Welcome Robin's tail. Piny whistled, and another bird soon joined him. She had the same shape as Piny, but instead of his bright red, she wore slaty-gray and olive-yellow. Piny introduced her as Mrs. Grosbeak.
        - id: ch01-b12
          speaker: mrs_grosbeak
          text: >-
            Isn't this lovely weather? I love the snow. I wouldn't feel at home if there were no snow around. Why, last spring I even built my nest before the snow in the Far North had melted. We certainly hated leaving our home up there, but food grew so scarce that we had no choice. We've only just arrived. Can you tell me whether there are any cedar trees, ash trees, or sumacs nearby?
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter quickly told her exactly where to find those trees. Then, a little timidly, he asked why she wanted them.
        - id: ch01-b14
          speaker: mrs_grosbeak
          text: >-
            They keep their berries all winter, and those berries are very good to eat. I thought there might be some around here. If we find enough, we'll stay for a while.
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            I hope you do stay. I want to know you better. Without all you birds from the Far North, the Green Forest would be a lonely place in winter. There are times when I like being by myself, but when I feel lonesome, I like knowing there's someone I can visit. Did you and Piny travel all the way here alone?
        - id: ch01-b16
          speaker: mrs_grosbeak
          text: >-
            Oh, no. A flock of our relatives is close by. We traveled with the Crossbills, so we had quite a party along the way.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Peter and Jumper stayed to gossip with the Grosbeaks for a while. Then Peter remembered that it was high time to return to his dear Old Briar-patch. He said good-by to his new friends and started through the Green Forest, lipperty-lipperty-lip.
    - id: ch02
      title: Another Touch of Red
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At the edge of the Green Forest, Peter decided to visit the weedy field. He wanted to see whether the Snowflakes, Tree Sparrows, and Horned Larks were there. They were, and Peter soon noticed another bird with them.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The newcomer was only a little bigger than Chicoree the Goldfinch. He twittered cheerfully while picking seeds from the top of a weed that stood above the snow. One look at him made Peter rub his eyes.
        - id: ch02-b03
          speaker: peter_rabbit
          text: >-
            Gracious goodness! Something must be wrong with my eyes, because I keep seeing red. I've already seen two birds dressed in red, and now there's another. It must be my eyes. I can hear Dotty the Tree Sparrow over there. I wonder if he'll look red too.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Peter hopped close enough to get a good look at Dotty. The Tree Sparrow was dressed exactly as he should be, and Peter felt relieved. His eyes were working perfectly well after all. He went back to study the happy little stranger, who was still busy gathering seeds from the top of the weed.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The top of the bird's head really was bright red. There could be no doubt about that. With his back turned, Peter would have mistaken him for one of his Sparrow friends if not for that cap. His back was grayish-brown, much like the backs of several Sparrows Peter knew. But just above his tail was a patch of pink, and none of the Sparrows Peter knew had anything like it.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Then the lively stranger faced him. Mischief twinkled in his bright eyes.
        - id: ch02-b07
          speaker: redpoll
          text: >-
            Well, what do you think of the way I look? Is something wrong with me? I was taught that staring is very rude. Maybe your mother forgot to teach you manners.
        - id: ch02-b08
          speaker: narrator
          text: Peter ignored the teasing and kept staring.
        - id: ch02-b09
          speaker: peter_rabbit
          text: My, you're pretty!
        - id: ch02-b10
          speaker: narrator
          text: >-
            The little stranger truly was pretty. His breast was pink, and the feathers below his breast were white. The middle of his throat was black, while reddish-brown streaks marked both of his sides. He looked quite pleased when he heard Peter's praise.
        - id: ch02-b11
          speaker: redpoll
          text: >-
            I'm glad you think so. I like pink myself. In fact, I like it very much. I suppose you've already met my friends Snipper the Crossbill and Piny the Grosbeak.
        - id: ch02-b12
          speaker: narrator
          text: Peter promptly bobbed his head up and down in agreement.
        - id: ch02-b13
          speaker: peter_rabbit
          text: >-
            I've just come from getting acquainted with them. From the way you talk, I suppose you must come from the Far North too. I'm only beginning to discover that many more birds make their homes up there than I ever dreamed of. If you please, I don't believe you and I have met before.
    - id: ch03
      title: Redpoll's Joke
      blocks:
        - id: ch03-b01
          speaker: redpoll
          text: >-
            I'm Redpoll. People call me that because of my red cap. And yes, I make my home in the Far North. There's nowhere else like it. You really ought to run up there sometime and get acquainted with all the folks who make their homes there and love it.
        - id: ch03-b02
          speaker: narrator
          text: Redpoll laughed at his own joke, but Peter did not understand what was funny.
        - id: ch03-b03
          speaker: peter_rabbit
          text: Is it very far? I'd dearly love to go.
        - id: ch03-b04
          speaker: narrator
          text: Redpoll laughed even harder.
        - id: ch03-b05
          speaker: redpoll
          text: >-
            Oh, yes, it's far. By the time you reached it, you'd probably be a very old, gray Rabbit. I think you'd better meet those of us who come down here now and then.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Redpoll gave a soft call. Almost at once, another red-capped bird joined him. She had no pink breast, and the streaks along her sides were heavier.
        - id: ch03-b07
          speaker: redpoll
          text: This is Mrs. Redpoll.
        - id: ch03-b08
          speaker: narrator
          text: Then the lively little bird turned to his mate.
        - id: ch03-b09
          speaker: redpoll
          text: >-
            I've been telling Peter that since he can't visit our beautiful Far North, he should get to know those of us who come here in winter. I'm sure he'll find us friendly.
        - id: ch03-b10
          speaker: peter_rabbit
          text: I'm sure I will. Do you eat nothing but seeds from these weeds?
        - id: ch03-b11
          speaker: narrator
          text: Redpoll answered with his usual happy laugh.
        - id: ch03-b12
          speaker: redpoll
          text: >-
            Hardly, Peter. We like seeds from the birches and alders, and we eat the seeds of evergreen trees whenever we can get them. Sometimes we find seeds left in cones that Snipper the Crossbill has opened but hasn't completely emptied. Sometimes he drops a few seeds for us. Oh, we always manage to find plenty to eat.
        - id: ch03-b13
          speaker: redpoll
          text: >-
            Some of our relatives are over there, and we need to join them. We'll see you again, Peter.
        - id: ch03-b14
          speaker: narrator
          text: Peter said he hoped they would.
    - id: ch04
      title: Moving as One
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Peter watched Mr. and Mrs. Redpoll fly over to join their relatives. Then, without warning, every one of the birds spread its wings at exactly the same moment and flew up into a nearby birch tree. It was as though someone had given them a signal.
        - id: ch04-b02
          speaker: narrator
          text: >-
            They sat in the birch tree for a minute or two. Then they all began picking tiny seeds from the birch tassels at once, just as if a second signal had passed among them. Not one bird seemed to start before another. Their movement looked like a drill, or as though the same thought had come to every one of them at the very same instant.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Peter chuckled over the sight all the way home. Somehow, he felt better because he had met the Redpolls. It was the very feeling that anyone lucky enough to meet them on a golden winter day was sure to have.
