audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jumper_the_hare:
      display_name: 野兔跳跳
      tts:
        delivery: 友善务实，说话沉着而有把握
        timbre: 温暖醇和
        pace: 从容
        pitch: 中低音
    piny_the_pine_grosbeak:
      display_name: 松雀松松
      tts:
        delivery: 随和坦荡，说话爽朗大方
        timbre: 清润厚实
        pace: 从容
        pitch: 中音
    mrs_pine_grosbeak:
      display_name: 松雀太太
      tts:
        delivery: 热情爽快，语气亲切利落
        timbre: 柔和清亮
        pace: 轻快
        pitch: 中音
    redpoll:
      display_name: 朱顶雀红顶
      tts:
        delivery: 活泼爱笑，带着俏皮的打趣
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 更多身穿红衣的朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            彼得刚问跳跳，除了交嘴雀，还有谁从遥远的北方来了。跳跳还没开口，他俩身后的一棵树上已经传来一个声音。
        - id: ch01-b02
          speaker: piny_the_pine_grosbeak
          text: 我呀，我就是从北方来的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这突如其来的回答，吓得彼得和跳跳一起蹦了起来。他们赶紧转身，想看看是谁在说话。树上停着一只比知更鸟迎迎略小的鸟。乍一瞧，他像是穿了一身草莓红。再仔细看，头部、翅膀下面和腿上还带着石板灰色的斑纹。他的尾巴是棕色的，棕色翅膀间杂着黑、白和石板灰，鸟喙粗厚而略短。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 你是谁？
        - id: ch01-b05
          speaker: narrator
          text: 彼得问得直冲冲的，一点儿也不客气。陌生鸟儿却毫不介意。
        - id: ch01-b06
          speaker: piny_the_pine_grosbeak
          text: 我叫松雀松松。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 去年夏天在老果园筑巢的锡嘴雀红胸，是你的亲戚吗？
        - id: ch01-b08
          speaker: piny_the_pine_grosbeak
          text: >-
            当然啦，他是我的嫡亲表兄弟。我们从来没见过，因为他不到我住的北方去，我也不到他过冬的南方去。不过，我们锡嘴雀家族的成员彼此都是亲戚。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 红胸长得很漂亮，我也很喜欢他。我们是好朋友。
        - id: ch01-b10
          speaker: piny_the_pine_grosbeak
          text: 那么，我们也一定会成为好朋友。
        - id: ch01-b11
          speaker: narrator
          text: >-
            松松说话时转过身去，彼得才发现他的尾巴分着明显的叉，并不像知更鸟迎迎那样末端平齐。松松吹了声口哨，几乎马上就有另一只身形相同的鸟飞来。她没有松松那身鲜红的羽毛，穿的是石板灰和橄榄黄。松松把她介绍给大家，说这位是松雀太太。
        - id: ch01-b12
          speaker: mrs_pine_grosbeak
          text: >-
            天气真好，是不是？我最喜欢雪了。周围没有雪，我反倒觉得不像在家。去年春天，遥远北方的雪还没融尽，我就已经把巢筑起来了。我们真舍不得离开那里，可食物越来越少，实在没有办法，只好动身。我们才刚刚到这儿。你能不能告诉我，附近有没有雪松、白蜡树或漆树？
        - id: ch01-b13
          speaker: narrator
          text: 彼得连忙把这几种树所在的地方仔细告诉她，接着又有点儿胆怯地问，她为什么要找它们。
        - id: ch01-b14
          speaker: mrs_pine_grosbeak
          text: >-
            因为那些树的浆果能在枝头留一整个冬天，而且吃起来很不错。我原先就想着，这附近应该能找到一些。要是果子够多，我们一定会留下来住上一阵。
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            真希望你们留下。我还想跟你们多熟悉熟悉呢。要不是你们这些从遥远北方来的朋友，冬天的绿森林就太冷清了。我有时喜欢独自待着，可寂寞的时候，只要知道还有朋友能去登门拜访，心里就很踏实。你和松松一路上是单独来的吗？
        - id: ch01-b16
          speaker: mrs_pine_grosbeak
          text: >-
            才不是呢。我们有一大群亲戚就在附近。一路上，我们还跟交嘴雀结伴同行。大家凑成一支队伍，可热闹啦。
        - id: ch01-b17
          speaker: narrator
          text: >-
            彼得和跳跳陪松雀夫妇聊了一会儿。后来彼得忽然想起，自己早该回亲爱的老蔷薇园了。他向新朋友道过别，便一蹦一跳地穿过绿森林。到了森林边缘，他决定顺路跑去杂草地，看看雪雀、树麻雀和角百灵在不在那里。他们果然都在，可彼得很快发现，他们身边还有一位新伙伴。一株杂草从雪面上伸出来，一只只比金翅雀菊苣大一点点的鸟儿停在草梢，一边快活地啾啾叫，一边忙着啄取种子。彼得看清以后，忍不住揉起眼睛。
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            我的天哪，我的眼睛肯定出毛病了，怎么满眼都是红色？我已经见过两只穿红衣的鸟，现在又来一只。树麻雀点点就在那边，我听到他的声音了。难道他看起来也会变红？
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: >-
            彼得蹦到足够近的地方，把点点仔仔细细地看了一遍。点点还是穿着他原本该穿的衣裳。彼得这才放下心来，他的眼睛好端端的，一点儿毛病也没有。于是，他又回过头，继续打量那只仍在草梢上忙着啄种子的快活小鸟。
        - id: ch01-b20
          speaker: narrator
          text: >-
            那只鸟的头顶鲜红鲜红的，绝不会看错。当时他背朝彼得，若不是那顶亮红的小帽子，彼得准会把他认成麻雀家族里的一位朋友。因为他的背是灰褐色的，彼得能想出好几种麻雀，都有一副相似的背。可是再仔细一看，小鸟的尾巴上方还有一块淡粉色羽毛。这可是彼得认识的麻雀全都没有的。
        - id: ch01-b21
          speaker: narrator
          text: 小鸟忽然转过身，一双明亮的眼睛调皮地闪着光。
        - id: ch01-b22
          speaker: redpoll
          text: >-
            怎么样，我这身打扮好看吗？我哪里不对劲？别人可教过我，盯着人家看很不礼貌。你妈妈大概忘了教你规矩吧。
        - id: ch01-b23
          speaker: narrator
          text: 彼得根本不理会这番话，还是盯着他看。
        - id: ch01-b24
          speaker: peter_rabbit
          text: 哎呀，你可真漂亮！
        - id: ch01-b25
          speaker: narrator
          text: >-
            这只小陌生鸟的确漂亮。他胸前的羽毛是粉红色，再往下则是一片白色。喉咙正中有一块黑斑，身体两侧还带着一道道红褐色的条纹。听到彼得这样赞叹，他看起来十分高兴。
        - id: ch01-b26
          speaker: redpoll
          text: >-
            你觉得我漂亮，我真高兴。我自己也很喜欢粉红色。你应该已经见过我的朋友交嘴雀剪嘴和松雀松松了吧？
          emotion: happy
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            我刚刚才认识他们。听你的口气，你也是从遥远的北方来的吧？我现在才知道，在那里安家的朋友比我梦里想到的还要多。可我好像还不认识你呢。
        - id: ch01-b28
          speaker: redpoll
          text: >-
            我是朱顶雀红顶，因为头上戴着红帽子，大家才这样叫我。没错，我的家就在遥远的北方。再没有什么地方能比得上那里了。你真该一路跑过去看看，认识认识那些住在那里、又打心眼里喜欢那里的朋友们。
        - id: ch01-b29
          speaker: narrator
          text: 红顶说完，便被自己的玩笑逗笑了。彼得却一点儿也没听懂。
        - id: ch01-b30
          speaker: peter_rabbit
          text: 那里很远吗？我可真想去看看。
        - id: ch01-b31
          speaker: narrator
          text: 彼得问得天真，红顶听了，笑得更厉害了。
        - id: ch01-b32
          speaker: redpoll
          text: >-
            是啊，远得很。恐怕等你跑到那里，已经变成一只又老又灰的兔子啦。你还是先认识我们这些偶尔会到这里来的北方朋友吧。
        - id: ch01-b33
          speaker: narrator
          text: >-
            红顶轻轻叫了一声，几乎马上就有另一只头戴红帽的鸟儿飞来，落在他身旁。她胸前没有红顶那样的粉红色，身体两侧的条纹也比他的更浓密。这就是朱顶雀太太。
        - id: ch01-b34
          speaker: redpoll
          text: >-
            这位是朱顶雀太太。我刚才正告诉彼得，他既然没法去我们美丽的遥远北方，就该认识认识冬天飞到这里来的北方朋友。我敢说，他会发现我们都很友善。
        - id: ch01-b35
          speaker: peter_rabbit
          text: 我也相信一定会的。请问，你们全靠这些杂草种子过活吗？
        - id: ch01-b36
          speaker: narrator
          text: 红顶又快活地笑起来。
        - id: ch01-b37
          speaker: redpoll
          text: >-
            哪能只吃这些呢，彼得。我们喜欢桦树和桤木的种子，也吃常青树的种子，只要能找到就吃。有时候，交嘴雀剪嘴啄开球果，却没把里面的种子全挑干净，我们就能从中找到一些。有时他还会掉几颗给我们。放心吧，我们总有办法找到足够的食物。那边有几位我们的亲戚，我们得去跟他们会合了。回头见，彼得。
        - id: ch01-b38
          speaker: narrator
          text: >-
            彼得说，他也盼着再见到他们，随后望着朱顶雀夫妇飞去加入伙伴。忽然间，仿佛有人发出了号令，所有朱顶雀都在同一瞬间展开翅膀，飞上一棵不远的桦树。没有哪一只早一点，也没有哪一只晚一点，他们起飞的时刻分毫不差。
        - id: ch01-b39
          speaker: narrator
          text: >-
            他们在桦树上停了一两分钟，接着又像听到另一道号令，一齐从桦树的穗子里啄取细小的种子。这一次也没有哪一只抢在前头。那情形简直像在操练，又像每一只鸟都在同一个瞬间想到了同一件事。
        - id: ch01-b40
          speaker: narrator
          text: >-
            彼得想着刚才那一幕，一路咯咯笑着回到家。不知怎的，认识了朱顶雀一家以后，他觉得心情也比先前更好了。凡是有幸在灿烂的冬日遇见他们的人，心里都会生出这样的欢喜。
