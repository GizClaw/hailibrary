  chapters:
    - id: ch01
      title: A Quiet Thicket
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit was sitting in a thicket of young trees at the edge of the Green Forest. The day was warm, and Peter felt lazy. He had nothing in particular to do. Since he knew no cooler place, he settled down there to doze and dream for a while.
        - id: ch01-b02
          speaker: narrator
          text: >-
            As far as Peter knew, he had the thicket all to himself. He had seen no one when he came in there. He had listened too, but not a sound suggested that anyone else was there. Everything was so quiet that Peter soon began to doze, though he had not meant to fall asleep at all.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter was a light sleeper. All little people who may have to run for their lives at any moment learn to sleep that way. After a while he woke with a start, wide awake in an instant. Something had roused him, but he could not tell what it was.
        - id: ch01-b04
          speaker: narrator
          text: >-
            His long ears stood straight up while he listened as hard as he could for any little sound of danger. His wobbly nose worked very fast, testing the air for the scent of an enemy. Peter waited, completely alert.
        - id: ch01-b05
          speaker: narrator
          text: >-
            For several minutes he heard nothing and saw nothing. Then a loud rustling came from the dry leaves near the outside of the thicket. That must have been what woke him. Peter was startled for just a moment. His ears quickly told him that someone was scratching among the leaves, and no one without feathers could scratch in quite that way.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Who could that be?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Peter crept softly toward the sound. When he peered between the young tree trunks, he saw the brown leaves flying in every direction. In the middle of them, a very busy bird was scratching for all he was worth. He was a little smaller than Welcome Robin, and every so often he stopped to pick up something he had uncovered.
        - id: ch01-b08
          speaker: narrator
          text: >-
            His head, throat, back, and breast were black, while underneath he was white. His sides were reddish brown. His tail was black and white, and the long feathers in his wings had white edges. Peter knew him. It was Chewink the Towhee, who was sometimes called Ground Robin.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Peter chuckled without making a sound and kept perfectly still. It was fun to watch someone who had no idea he was being watched. Chewink was clearly hungry, and he was finding a fine meal beneath those dead leaves. His feet were built for scratching, and he certainly knew how to use them.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter watched for some time. He was just deciding to show himself and enjoy a little morning gossip when he glanced beyond the edge of the thicket. There he saw something red. It was alive, and it was moving very slowly and carefully toward Chewink. Chewink was so busy with breakfast that he had forgotten everything else. Peter knew only one person with a coat that color. Reddy Fox was creeping closer, hoping to catch Chewink.
    - id: ch02
      title: Peter's Warning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            For a second or two, Peter could not decide what to do. He could not warn Chewink without letting Reddy know where he was. Peter might have stayed perfectly still and allowed Reddy to catch the bird. But the thought was so dreadful that he considered it for no more than a moment.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Suddenly Peter thumped the ground with his feet. All his friends knew that thump as his danger signal. Then he turned and scampered lipperty-lipperty-lip into a thick tangle of brambles nearby.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The moment Chewink heard the thump, he flew into a little tree. From there he saw Reddy Fox and began to scold him. Reddy looked toward the bramble-tangle where Peter had hidden, and snarled.
        - id: ch02-b04
          speaker: reddy_fox
          text: >-
            One of these days I'll catch you, Peter Rabbit. Then I'll pay you back for spoiling my breakfast!
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: >-
            Reddy did not even glance at Chewink. He turned and trotted away, trying his best to look dignified. Anyone watching might have thought that catching Chewink had never crossed his mind.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Chewink stayed on his perch until he was certain Reddy Fox had gone for good. Then he called softly to Peter.
        - id: ch02-b07
          speaker: chewink_towhee
          text: >-
            Towhee! Towhee! Chewink! Chewink! It's safe now, Peter Rabbit. Come out and talk to me. I want to tell you how grateful I am that you saved my life.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Chewink flew back to the ground, and Peter crept out of the bramble-tangle.
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            It was nothing, Chewink. I saw Reddy, and I knew you hadn't seen him, so of course I sounded the alarm. You would have done the same for me. But there's something about you I've often wondered.
        - id: ch02-b10
          speaker: chewink_towhee
          text: What have you been wondering about me?
        - id: ch02-b11
          speaker: peter_rabbit
          text: I've been wondering which bird family you belong to.
    - id: ch03
      title: Chewink's Family
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Chewink chuckled.
        - id: ch03-b02
          speaker: chewink_towhee
          text: >-
            I belong to a very big family. In fact, it's the biggest family among the birds. It's called the Finch and Sparrow family. There are a great many of us, and lots of us don't look much alike. Still, we're all members of the same family. You do know that Rosebreast the Grosbeak and Glory the Cardinal belong to it, don't you?
        - id: ch03-b03
          speaker: peter_rabbit
          text: >-
            No, I didn't know that. If you say so, I suppose it must be true. I can believe that more easily than I can believe you're related to the Sparrows.
        - id: ch03-b04
          speaker: chewink_towhee
          text: Well, I am related to them all the same.
        - id: ch03-b05
          speaker: peter_rabbit
          text: What were you looking for under the leaves when I first saw you?
        - id: ch03-b06
          speaker: chewink_towhee
          text: >-
            Oh, worms and bugs that hide down there. You'd be surprised how many of them live under dead leaves.
        - id: ch03-b07
          speaker: peter_rabbit
          text: Do you eat other things too?
        - id: ch03-b08
          speaker: chewink_towhee
          text: >-
            I eat berries and wild fruit when they're in season. I'm very fond of them. They give me something different to add to my meals.
        - id: ch03-b09
          speaker: peter_rabbit
          text: I've noticed that I hardly ever see you high in the treetops.
        - id: ch03-b10
          speaker: chewink_towhee
          text: >-
            That's because I like the ground better. I spend more time there than anywhere else.
        - id: ch03-b11
          speaker: peter_rabbit
          text: Then I suppose you build your nest on the ground.
        - id: ch03-b12
          speaker: narrator
          text: Chewink nodded.
        - id: ch03-b13
          speaker: chewink_towhee
          text: >-
            Of course I do. Actually, I have a nest right here in this thicket. Mrs. Towhee is sitting on it now. I expect she's worried and wondering what happened when you warned me about Reddy Fox. I'd better go tell her that I'm safe and put her mind at rest.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Peter was just about to ask whether he could come along and see the nest when a new voice interrupted them.
    - id: ch04
      title: Indigo and His Plainly Dressed Mate
      blocks:
        - id: ch04-b01
          speaker: indigo_bunting
          text: What are you two talking about?
        - id: ch04-b02
          speaker: narrator
          text: >-
            A little bird flitted down in front of Peter. He was about the size of a Sparrow, but lovelier than any Sparrow Peter knew. At first he seemed to be blue all over, and it was a wonderfully bright blue. When he paused, Peter could see that his wings and tail were mostly black. The blue shone brightest on his head and back. This was Indigo the Bunting.
        - id: ch04-b03
          speaker: chewink_towhee
          text: >-
            We were discussing our family. I was telling Peter that we belong to the largest family among all the birds.
        - id: ch04-b04
          speaker: peter_rabbit
          text: >-
            But you never mentioned Indigo. Are you telling me that he's in the same family too?
        - id: ch04-b05
          speaker: indigo_bunting
          text: >-
            I certainly am. I'm quite closely related to the Sparrow side of the family. Don't I look like a Sparrow to you?
        - id: ch04-b06
          speaker: narrator
          text: Peter gave Indigo a careful look.
        - id: ch04-b07
          speaker: peter_rabbit
          text: >-
            You do have a Sparrow's size and shape. Even so, I never would have thought of connecting you with the Sparrows.
        - id: ch04-b08
          speaker: mrs_indigo
          text: And what do you think of me?
        - id: ch04-b09
          speaker: narrator
          text: >-
            Another little brown bird flew up beside Indigo, nervously twitching her tail. She looked very much like a Sparrow. If Peter had not seen her beside her handsome mate, he would surely have mistaken her for one. She was Mrs. Indigo. Only her wings and tail showed any of the blue that made Indigo's coat so beautiful, and even there it was only a faint touch.
        - id: ch04-b10
          speaker: peter_rabbit
          text: >-
            I have to admit that you make the Sparrow connection much easier to believe. Don't you ever wish your coat were as handsome as Indigo's?
        - id: ch04-b11
          speaker: narrator
          text: Mrs. Indigo shook her head firmly.
        - id: ch04-b12
          speaker: mrs_indigo
          text: >-
            Never! Raising a family gives me enough to worry about already. If I wore a coat like his, I wouldn't have a moment's peace. You can't imagine how much I worry about Indigo sometimes. Peter Rabbit, you should be glad you don't have a coat like that. It draws far too much attention.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Peter tried to imagine himself in a bright blue coat. The very idea made him laugh aloud, and the others laughed with him.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Then Indigo flew to the top of a tall tree nearby and began to sing. His song was lively, and Peter enjoyed every bit of it. While he listened, Mrs. Indigo quietly slipped away without being noticed.
        - id: ch04-b15
          speaker: narrator
          text: >-
            When Peter looked around for Chewink, he had disappeared too. Chewink had gone to tell Mrs. Towhee that he was safe and that she had nothing to worry about.
