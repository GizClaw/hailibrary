audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    chewink:
      display_name: 棕胁唧鹀奇温
      tts:
        delivery: 爽朗随和，谈起家族时笃定而自豪
        timbre: 清脆结实
        pace: 明快自然
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾自负，恼怒时仍强装体面
        timbre: 略低而尖利
        pace: 不紧不慢
        pitch: 中音
    indigo:
      display_name: 靛蓝彩鹀蓝靛
      tts:
        delivery: 开朗大方，语气爽快自信
        timbre: 明亮悦耳
        pace: 轻快
        pitch: 中高音
    mrs_indigo:
      display_name: 蓝靛太太
      tts:
        delivery: 务实直率，话里带着操心家人的认真
        timbre: 柔和清晰
        pace: 自然利落
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十二章　彼得救了朋友，也长了见识
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得坐在绿森林边缘的一片幼树丛里。天气暖洋洋的，他浑身犯懒，又没有什么事非做不可。这里已经是他知道的最凉快的地方，于是他蹲下来，一会儿打盹儿，一会儿做白日梦。据彼得所知，这里只有他自己。进来时，他没看见任何人。竖起耳朵听听，也没有一点儿动静说明树丛里还藏着别人。四下静悄悄的，彼得原本压根儿没想睡觉，可没多久还是迷糊了起来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得睡觉一向很轻。像他这样随时可能要逃命的小家伙，当然得睡得轻。过了一阵，他猛然惊醒，立刻清醒得不能再清醒。一定有什么声音吵醒了他，可他又说不清那是什么。两只长耳朵直直竖着，拼命搜寻可能意味着危险的细小声响。小鼻子也飞快抽动，辨认空气里有没有敌人的气味。彼得全身戒备，一动不动地等着下一点动静。
        - id: ch01-b03
          speaker: narrator
          text: >-
            几分钟里，他什么也没听见，什么也没看见。忽然，小树丛外缘传来枯叶被翻动的沙沙巨响。准是这声音把他吵醒了。彼得起先吃了一惊，不过长耳朵马上听出来，是谁在落叶间刨东西。他知道，刨得出这种动静的，一定长着羽毛。
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            会是谁呢？
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得悄悄摸向声音传来的地方，从一排细细的树干之间往外看。铺在地上的褐色落叶一会儿飞向这边，一会儿飞向那边。叶子中间有个比知更鸟威尔科姆略小的家伙，忙得不可开交。他使足力气刨个不停，还不时低头捡起找到的食物。他的脑袋、喉咙、后背和胸脯都是黑色，腹面洁白，两胁红褐。尾巴黑白相间，翅膀上的长羽毛镶着白边。原来是棕胁唧鹀奇温，也就是大家有时所说的地面知更鸟。
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得无声地偷笑起来。他一动也不动，因为看着一个完全不知道自己正被瞧着的家伙，实在很有趣。奇温显然饿了，正在枯叶底下找到一顿丰盛的早餐。他的脚天生适合刨东西，他也确实很会用。彼得看了好一阵，正打算现身聊几句早间闲话，忽然看见小树丛外有一抹红色。那是个活物，正在缓慢而小心地靠近。奇温只顾忙活，只顾自己的早餐，早把周围的一切都忘了。彼得一眼认出，那件红外衣只可能属于狐狸雷迪。看得明明白白，雷迪正盼着捉住奇温。
        - id: ch01-b07
          speaker: narrator
          text: >-
            一两秒里，彼得不知道该怎么办。提醒奇温，就会让雷迪发现自己。当然，他也可以静静坐着，任凭奇温被抓走。可是这个念头太可怕了，他只想了一两秒便不肯再想。彼得猛地用脚跺响地面。这是他的危险信号，所有朋友都听得懂。随后，他转身飞奔，躲进身后不远处那片纠缠得密密实实的荆棘。
        - id: ch01-b08
          speaker: narrator
          text: >-
            听见那一声响，奇温立刻飞上一棵小树。他看见狐狸雷迪，马上责骂起来。雷迪转头瞪着那片荆棘，龇牙低吼。
        - id: ch01-b09
          speaker: reddy_fox
          text: >-
            兔子彼得，我迟早会逮住你！你害我丢了这顿早餐，这笔账我一定会跟你算！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: >-
            雷迪说完，连奇温看也没看，转身小跑着离开。他竭力摆出一副庄重体面的样子，好像自己从来没有过捉奇温当早餐的念头。奇温站在枝头，一直盯着他的背影，直到确定雷迪这回真的走远了，才放低声音呼唤彼得。
        - id: ch01-b11
          speaker: chewink
          text: >-
            拖威！拖威！奇温！奇温！现在安全啦，兔子彼得。出来跟我说说话吧。你救了我的命，我真不知道该怎样感谢你！
        - id: ch01-b12
          speaker: narrator
          text: >-
            奇温飞回地面，彼得也慢慢钻出荆棘。
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            这没什么。我看见了雷迪，也知道你没看见，那当然得给你报信。换成我遇到危险，你也会这样做。说起来，奇温，我一直有件事想不明白。
        - id: ch01-b14
          speaker: chewink
          text: >-
            我有什么事让你想不明白？
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            我一直想知道，你到底属于哪个家族。
        - id: ch01-b16
          speaker: narrator
          text: >-
            奇温笑了。
        - id: ch01-b17
          speaker: chewink
          text: >-
            我的家族可大了，是鸟类中最大的家族，也就是雀科家族。我们有许许多多成员，其中不少彼此长得一点儿也不像，可不管外表有多大差别，大家还是同一个家族。厚嘴雀玫胸和北美红雀华彩也是我们家的，这个你总知道吧？
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            我还真不知道。不过既然你说是，那一定没错。这倒不难相信。可要我相信你和那些麻雀也是亲戚，就难多了。
        - id: ch01-b19
          speaker: chewink
          text: >-
            可我偏偏就是。
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            我刚看见你时，你到底在刨什么？
        - id: ch01-b21
          speaker: chewink
          text: >-
            哦，就是躲在落叶底下的蚯蚓和小虫。你想都想不到，枯叶下面藏着多少虫子。
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            那你还吃别的东西吗？
        - id: ch01-b23
          speaker: chewink
          text: >-
            到了时节，我也吃浆果和野果。我很喜欢这些。有了它们，菜单上的吃食才不会天天一个样嘛。
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            我好像很少在树梢上见到你。
        - id: ch01-b25
          speaker: chewink
          text: >-
            我更喜欢待在地面上。我大部分时间都在这里度过，别的任何地方都没有地面待得久。
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            那么，你的巢也筑在地上喽？
        - id: ch01-b27
          speaker: narrator
          text: >-
            奇温点点头。
        - id: ch01-b28
          speaker: chewink
          text: >-
            当然。其实我的巢就在这片小树丛里，奇温太太这会儿正伏在巢中。她听见你发出信号，警告我提防狐狸雷迪，准会又担心又着急，一心想知道这边到底出了什么事。我得马上过去让她放心，告诉她我平安无事。
        - id: ch01-b29
          speaker: narrator
          text: >-
            彼得正想问能不能跟去看看鸟巢，一个陌生的声音忽然插了进来。
        - id: ch01-b30
          speaker: indigo
          text: >-
            你们两个在谈什么呢？
        - id: ch01-b31
          speaker: narrator
          text: >-
            话音刚落，一只麻雀大小的小鸟轻盈地飞到彼得面前。他比彼得认识的任何麻雀都漂亮。乍看之下，他仿佛通身都是蓝色，而且是那么明亮、那么好看的蓝。等他停了一瞬，彼得才发现，他的翅膀和尾巴大半是黑色，最鲜亮迷人的蓝色集中在头部和背上。原来是靛蓝彩鹀蓝靛。
        - id: ch01-b32
          speaker: chewink
          text: >-
            我们在说自己的家族。我正告诉彼得，我们属于鸟类中最大的家族。
        - id: ch01-b33
          speaker: peter_rabbit
          text: >-
            可你根本没提蓝靛。难道他也和你是一家？
        - id: ch01-b34
          speaker: indigo
          text: >-
            那当然。我和麻雀那一支还挺亲近呢。你看我不像麻雀吗？
        - id: ch01-b35
          speaker: narrator
          text: >-
            彼得仔细打量着蓝靛。
        - id: ch01-b36
          speaker: peter_rabbit
          text: >-
            你的大小和体形确实像。可不管怎么说，我怎么也想不到你会和麻雀是亲戚。
        - id: ch01-b37
          speaker: mrs_indigo
          text: >-
            那我呢？
        - id: ch01-b38
          speaker: narrator
          text: >-
            另一个声音问话时，一只褐色的小鸟飞到蓝靛身旁，紧张地抽动着尾巴。她实在太像麻雀了。要不是彼得亲眼看见她和那位英俊的伴侣待在一起，知道她正是蓝靛太太，一定会把她认作一只麻雀。蓝靛的外衣满是漂亮的蓝色，她身上却只有翅膀和尾巴带着一点儿淡淡的蓝。
        - id: ch01-b39
          speaker: peter_rabbit
          text: >-
            说到你，我倒很容易相信你和麻雀是亲戚。你有没有希望过，自己也穿得像蓝靛这么漂亮？
        - id: ch01-b40
          speaker: narrator
          text: >-
            蓝靛太太非常坚决地摇摇头。
        - id: ch01-b41
          speaker: mrs_indigo
          text: >-
            从来没有！养大一家孩子已经够让我操心了。要是我也穿着他那样的外衣，哪还能有片刻安宁？你不知道，我有时多替他担心。兔子彼得，你没有他那样的外衣，真该庆幸。那身颜色太容易惹人注意了。
        - id: ch01-b42
          speaker: narrator
          text: >-
            彼得想象了一下自己穿着鲜蓝色外衣的模样，光是这个念头就让他放声大笑，大家也跟着笑了起来。蓝靛随后飞上附近一棵高树的树梢，唱起一支轻快活泼的歌。彼得听得津津有味。蓝靛太太趁机悄悄溜走，谁也没注意。等彼得回头寻找奇温，奇温也不见了。他已经去告诉奇温太太，自己平安无事，她什么也不必担心。
