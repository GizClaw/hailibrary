audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    linnet:
      display_name: 紫朱雀红红
      tts:
        delivery: 爽朗自信，话里常带着亲切的笑意
        timbre: 清亮圆润
        pace: 明快自然
        pitch: 中高音
    chicoree:
      display_name: 金翅雀金金
      tts:
        delivery: 无忧无虑，欢快活泼，带着几分自得
        timbre: 清脆明亮
        pace: 轻快跳跃
        pitch: 高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十三章　华服先生与迟迟筑巢的鸟儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            珍妮鹪鹩和鹪鹩先生忙得团团转。兔子彼得实在想不出，世上还有谁会比他们更忙。巢里的七只蛋全都孵化了，七张小嘴整天等着吃东西。偏偏每一口食物，都得飞到远处找来，再衔回巢里。这下，他们连闲聊的工夫也没有了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            天刚亮到能看清东西，两口子就开始喂那些永远吃不饱的宝宝。他们一直忙到黑影从紫山间悄悄爬出来，自己却几乎连偶尔吃上一口的时间都没有。鸟宝宝长得快，每一只每天都需要许多食物，常常能吃下跟自身一样重的东西。这么多吃的，全靠爸爸妈妈一口一口找回来，塞进那些大张着的小嘴。
        - id: ch01-b03
          speaker: narrator
          text: >-
            珍妮嘴里衔着毛毛虫，才从圆圆的小门钻进家里，转眼又跳了出来。鹪鹩先生马上叼着蜘蛛或苍蝇进去接替她，随后又匆匆飞走，去找下一口吃的。彼得试着数他们飞了多少趟，可没多久便发现根本数不清，只好放弃。他不禁纳闷，哪儿来的那么多蚯蚓、小虫和蜘蛛，也越来越佩服那双能迅速找到它们的锐利眼睛。
        - id: ch01-b04
          speaker: narrator
          text: >-
            不用说，珍妮的脾气比从前更急了。她斩钉截铁地告诉彼得，自己没空闲聊，话说得再明白不过。彼得只得放弃从她那里打听那几件一直想知道的事，转身去找一个没那么忙的朋友。他刚蹦出不远，一阵甜美的歌声就勾住了他的耳朵。歌声里满是细碎的颤音，彼得先停下来听，接着便去找唱歌的那位。
        - id: ch01-b05
          speaker: narrator
          text: >-
            那只鸟就在布朗农夫家院子里，坐在一棵冷杉的最高梢上。此时天已大亮，彼得不敢过去。他本来以为，自己只能留在原地听歌了，没想到那位歌手飞进老果园，正好落在他的头顶上方。
        - id: ch01-b06
          speaker: linnet
          text: 你好啊，彼得！
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            你好，红红！我刚才还在猜，是谁唱得这么好听。我本来应该听得出来，可我太久没听你唱歌，一下子想不起你的曲调了。你肯到这边来真好，我正愁得不得了，非找个人聊聊不可呢。
        - id: ch01-b08
          speaker: narrator
          text: >-
            原来这位歌手正是紫朱雀红红。听了彼得的话，他放声笑了。
        - id: ch01-b09
          speaker: linnet
          text: >-
            我看你还是老样子，彼得。你一定还是满肚子好奇，也还是有问不完的问题。好吧，我已经来了，你想聊什么？
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            聊你。最近，我从那些长羽毛的朋友身上知道了好多怪有意思的事，还想再多知道一些。我正在理清谁和谁是亲戚，可知道得越多，越觉得自己对邻居们了解得太少。现在我连谁是谁的亲戚都不敢乱猜了。红红，你到底属于哪个家族？
        - id: ch01-b11
          speaker: narrator
          text: 红红朝彼得飞近一点儿，眼里闪着笑意。
        - id: ch01-b12
          speaker: linnet
          text: 你好好看看我，彼得。从头到脚仔细瞧瞧，说不定自己就能猜出来。
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得一本正经地打量起来。红红跟麻雀差不多大，身上大部分羽毛都是玫瑰红色。头顶的颜色最鲜艳，背部最深，胸前最浅，腹面微微发白。他的翅膀和尾巴是褐色的，羽毛外缘镶着玫瑰红，鸟喙又短又粗壮。
        - id: ch01-b14
          speaker: narrator
          text: >-
            彼得还没回答，红红太太便来了。她身上连一点儿漂亮的玫瑰红也没有。灰褐色的背上布满黑色纵纹，白色的胸腹和两胁带着褐色斑纹。要不是看见她跟红红在一起，彼得准会把她当成麻雀。她实在太像了，彼得便试着猜了一回。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 我猜你们属于麻雀家族。
        - id: ch01-b16
          speaker: linnet
          text: >-
            猜得很接近，彼得，很接近。我们属于这个家族的雀科一支，所以麻雀都是我们的嫡亲表亲。大家可能会把红红太太认成某位麻雀表亲，却绝不会认错我。像我这么大，还穿着玫瑰红外衣的，再没有第二位。就算你忘了我的歌，只要看看外衣的颜色，总能把我认出来。其实你真该记住我的曲调，因为没有哪支歌跟它一样。
        - id: ch01-b17
          speaker: linnet
          text: >-
            嘿，金金表弟来了！你见过比他更快活的家伙吗？依我看，他只顾着四处玩乐，到现在连筑巢都没想过。老果园里一半的居民已经儿女成群，我自己的巢里也有蛋了，这个冒失鬼却还在外面闲逛。是不是这样，金金？
        - id: ch01-b18
          speaker: chicoree
          text: 什么是不是这样？
        - id: ch01-b19
          speaker: narrator
          text: >-
            金翅雀金金落在红红附近。红红问他，是不是连筑巢的事都还没开始想。金金没有马上回答。他飞到草地上，几乎就在彼得鼻子底下，动手拆起一朵已经结籽的蒲公英。他把种子一颗颗从柔软的绒毛上啄下来，从头到尾一句话也没说。全部弄完以后，他才飞回树上，一边梳理羽毛，一边开口。
        - id: ch01-b20
          speaker: chicoree
          text: >-
            一点儿没错，那又怎么样？筑巢和操持家务，往后再想也来得及。金金太太和我大约到七月初才会考虑。眼下时节这么好，我们当然要尽情四处游玩。再说，我们喜欢用蓟花绒铺巢，可现在还没有蓟花绒呢。合适的食物不够多，也没必要急着养孩子。你知道，我们金翅雀主要吃种子，我敢说这一带没有谁比我们更爱吃种子。宝宝还小的时候当然得吃软食，不过夏天随时都能找到蚯蚓和小虫。等孩子们能自己觅食，就需要种子了。所以得等种子足够多，我们才会养育一家。现在嘛，我们正玩得快活。彼得，你觉得我的夏装怎么样？
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            漂亮极了！我在深秋常常见到你，冬天有时也能见到，可那时候我绝不会认出你们是同一只鸟。我还没见过谁能把模样变得这么彻底。那顶黑帽子真神气，戴在你头上再合适不过了。
        - id: ch01-b22
          speaker: narrator
          text: >-
            金金把脑袋歪向一边，好让黑帽子显得更惹眼。他头上除了帽子，其余地方和全身都是鲜黄色的。两只翅膀乌黑，每边各有两道白色横纹。尾巴也是黑色的，上面带着几块白斑。他比红红略小，在所有披羽毛的小家伙中，算得上衣着最神气的一位。光是看着他，就叫人觉得快活。
        - id: ch01-b23
          speaker: narrator
          text: >-
            彼得对金丝雀一无所知，这也不能怪他，因为金丝雀总是养在笼子里。要是他认识金丝雀，就会明白为什么金翅雀金金常被叫作野金丝雀了。
        - id: ch01-b24
          speaker: narrator
          text: >-
            这时，金金太太也飞来，落在英俊的伴侣身旁。谁都看得出，她对金金的欣赏一点儿不亚于彼得。她的翅膀和尾巴跟伴侣很像，只是颜色更偏褐色，不那么黑。她没有黑帽子，头部和后背呈灰褐色，泛着一点儿橄榄绿。腹面颜色较浅，还带着一抹黄色。总的说来，她穿得十分朴素。
        - id: ch01-b25
          speaker: narrator
          text: >-
            彼得想起金金的冬装，发现那身衣裳和金金太太现在穿的很相像，只有翅膀和尾巴仍旧保持着眼前的模样。金金则一直快活地啾啾叫，每隔一小会儿就唱上一段。欢乐仿佛装得太满，马上要从他身上冒出来了。
        - id: ch01-b26
          speaker: peter_rabbit
          text: 我想，我要是问你跟红红是不是同一家族，听起来一定很傻吧。
        - id: ch01-b27
          speaker: chicoree
          text: >-
            傻得很，彼得，傻得很。我不是叫金翅雀吗？他不是叫紫朱雀吗？我们当然是一家，而且还是个顶呱呱的家族。好了，我得去老牧场看看蓟草长得怎么样了。
        - id: ch01-b28
          speaker: narrator
          text: >-
            金金一边叫着“金金哩，啾金金哩，金金哩”，一边飞走了。金金太太跟在后面。他们飞行时在空中一起一伏，跟黄翅扑翅鴷飞起来的样子十分相像。
        - id: ch01-b29
          speaker: peter_rabbit
          text: >-
            就算金金不一遍遍叫自己的名字，光看这种飞法，我也认得出他们。真有意思，他们常常整个冬天都待在附近，却偏偏是最晚安家过日子的鸟之一。就像我以前对珍妮鹪鹩说过的那样，鸟儿真是一群古怪的家伙。
        - id: ch01-b30
          speaker: narrator
          text: >-
            珍妮鹪鹩恰好从彼得身边飞过，正赶着去给饥饿的宝宝再找一条蚯蚓。听见这句话，她马上训斥起彼得。
        - id: ch01-b31
          speaker: jenny_wren
          text: 啧、啧、啧、啧、啧！才不是那么回事，兔子彼得。根本不是！
