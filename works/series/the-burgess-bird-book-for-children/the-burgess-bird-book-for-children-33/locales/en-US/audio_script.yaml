audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, earnest, and quick to react
        timbre: warm and youthful
        pace: lively
        pitch: medium
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, knowing, and sharply playful
        timbre: bright and crisp
        pace: quick
        pitch: high
    linnet_purple_finch:
      display_name: Linnet the Purple Finch
      tts:
        delivery: friendly, amused, and gently teasing
        timbre: clear and mellow
        pace: measured
        pitch: medium-high
    chicoree_goldfinch:
      display_name: Chicoree the Goldfinch
      tts:
        delivery: carefree, cheerful, and proudly playful
        timbre: bright and musical
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Seven Hungry Babies
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jenny and Mr. Wren were as busy as two little birds could be. Peter could not imagine anyone busier. All seven eggs in their nest had hatched. That meant seven hungry mouths to fill. Feeding even one would have been work enough, but every bite for all seven had to be found somewhere and carried home.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There was hardly a moment left for gossip. From the first light of morning until the Black Shadows crept out from the Purple Hills, Jenny and Mr. Wren fed those babies. They barely had time to snatch a bite for themselves.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Young birds grow very fast, and fast growth takes a great deal of food. Each baby often ate its own weight in a single day. Think what that meant for two small parents with seven babies. Every worm, bug, and spider had to be hunted down, brought all the way back, and dropped into one of those wide-open mouths.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jenny would slip through the round doorway with a caterpillar, then hop right out again. Mr. Wren would take her place with a spider or a fly, and off he would hurry to find the next meal.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter tried to count how many times they came and went, but he soon gave it up as a hopeless job. The trips followed one another too quickly. He began to wonder where all those worms and bugs and spiders could possibly come from. Little by little, he gained great respect for eyes sharp enough to find them so fast.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Of course, Jenny was more short-tempered than ever. When Peter tried to gossip, she told him most emphatically that she had no time for it. At last he gave up trying to ask her the things he wanted to know. He hopped away to find someone who was not quite so busy.
    - id: ch02
      title: Linnet the Purple Finch
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter had not gone far when a song caught his attention. It was sweet and full of little trills. First he stopped to listen. Then he went looking for the singer.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He soon found him at the very top of a fir tree in Farmer Brown's yard. By then it was broad daylight, and Peter did not dare cross the yard. He had almost decided to stay where he was and simply listen when the singer flew into the Old Orchard and landed just above him.
        - id: ch02-b03
          speaker: linnet_purple_finch
          text: Hello there, Peter!
        - id: ch02-b04
          speaker: peter_rabbit
          text: >-
            Hello, Linnet! I was trying to work out who could sing that way. I should have known, but it has been so long since I heard your song that I couldn't quite remember it. I'm glad you came over. I've been longing to talk with someone.
        - id: ch02-b05
          speaker: narrator
          text: Linnet the Purple Finch laughed aloud.
        - id: ch02-b06
          speaker: linnet_purple_finch
          text: >-
            You haven't changed a bit, Peter. I suppose you're still just as curious and still asking question after question. Well, I'm here. What do you want to talk about?
        - id: ch02-b07
          speaker: peter_rabbit
          text: >-
            You. I've learned so many surprising things about my feathered friends lately that I want to learn more. I'm trying to understand which birds are related. But now I know so little that I don't even dare guess anymore. Linnet, what family are you in?
        - id: ch02-b08
          speaker: narrator
          text: Linnet flew down closer. His eyes twinkled.
        - id: ch02-b09
          speaker: linnet_purple_finch
          text: Take a good look at me, Peter. See if you can work it out for yourself.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Peter stared at Linnet very seriously and looked him over from head to tail. Linnet was about the size of a Sparrow. Most of his body was rose-red, but it was not the same shade everywhere. The color was brightest on his head, darkest across his back, and palest on his breast. Underneath, he was whitish. His wings and tail were brownish, with rose-red edging the outer feathers, and his bill was short and stout.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Before Peter could answer, Mrs. Linnet arrived. She had no rose-red at all. Her grayish-brown back was streaked with black, while brown spots and streaks marked her white breast and sides. If Peter had not seen her beside Linnet, he would certainly have thought she was a Sparrow.
        - id: ch02-b12
          speaker: peter_rabbit
          text: I think you must belong to the Sparrow family.
        - id: ch02-b13
          speaker: linnet_purple_finch
          text: >-
            That's very close, Peter. We're on the Finch branch of the family, so the Sparrows are our own cousins. Someone might mistake Mrs. Linnet for one of them, but no one can mistake me. No other bird my size has a rose-red coat like this. Even if you forget my song, you can always know me by my coat. Though you really ought to remember the song. There isn't another one quite like it.
    - id: ch03
      title: Chicoree Waits to Build
      blocks:
        - id: ch03-b01
          speaker: linnet_purple_finch
          text: >-
            Why, here comes Cousin Chicoree! Have you ever seen a happier fellow? I bet he's been enjoying himself so much that he hasn't even thought about building a nest. Half the birds in the Old Orchard already have growing families. I have a nest and eggs myself, but that madcap is still wandering around having fun. Isn't that right, Chicoree?
        - id: ch03-b02
          speaker: chicoree_goldfinch
          text: Isn't what right?
        - id: ch03-b03
          speaker: narrator
          text: Chicoree the Goldfinch perched close to Linnet.
        - id: ch03-b04
          speaker: linnet_purple_finch
          text: You haven't even started thinking about a nest yet, have you?
        - id: ch03-b05
          speaker: narrator
          text: >-
            Chicoree flew down into the grass almost beneath Peter's nose. He pulled apart a dandelion that had gone to seed, snipping each seed away from its soft down. He said nothing until the job was finished. Then he flew back into the tree near Linnet and began arranging his feathers.
        - id: ch03-b06
          speaker: chicoree_goldfinch
          text: >-
            That's true, but why should it matter? There will be plenty of time for nest-building and household cares later. Mrs. Goldfinch and I won't even begin thinking about them until around the first of July. For now, we're making the most of this beautiful season. We can roam wherever we please and enjoy ourselves.
        - id: ch03-b07
          speaker: chicoree_goldfinch
          text: >-
            Besides, we like to line our nest with soft thistledown, and there isn't any thistledown yet. It makes no sense to raise a family before the right food is ready, either. We Goldfinches live mostly on seeds. In fact, I doubt you'll find greater seed-eaters anywhere around here.
        - id: ch03-b08
          speaker: chicoree_goldfinch
          text: >-
            Of course, little babies need soft food, and worms and bugs are easy to find all summer. But once our children can hunt for themselves, they'll need seeds. So we wait until plenty of seeds will be ready for them. Meanwhile, we're having a wonderful time. What do you think of my summer suit, Peter?
        - id: ch03-b09
          speaker: peter_rabbit
          text: >-
            It's beautiful! You look nothing like the bird I see so often in late fall and sometimes in winter. I don't know anyone who changes more completely. That black cap looks especially fine on you.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Chicoree tilted his head to one side so Peter could get a better look at that black cap. The rest of his head and his whole body were bright yellow. His wings were black, with two white bars across each one. His black tail had white on it too. He was a little smaller than Linnet. Altogether, he was one of the smartest-looking little birds who wore feathers. Just seeing him was a delight.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Peter knew nothing about Canaries, since they were kept in cages. If he had, he would have understood why Chicoree the Goldfinch was often called the Wild Canary.
    - id: ch04
      title: The Royal Summer Suit
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mrs. Goldfinch now joined her handsome mate. It was plain that she admired him every bit as much as Peter did. Her wings and tail looked much like his, though hers were brownish instead of black. She wore no cap at all. Her head and back were grayish-brown with a touch of olive. Underneath she was lighter, with just a tinge of yellow. Next to Chicoree's royal colors, she was a very modestly dressed little bird.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Peter remembered Chicoree's winter suit. Except for the wings and tail, it looked much like the one Mrs. Goldfinch wore now.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Chicoree twittered happily the whole time and burst into song every few moments. He seemed to be bubbling over with joy.
        - id: ch04-b04
          speaker: peter_rabbit
          text: I suppose it would be foolish to ask whether you and Linnet belong to the same family.
        - id: ch04-b05
          speaker: chicoree_goldfinch
          text: >-
            Very foolish, Peter! My name is Goldfinch, and his is Purple Finch. Of course we're in the same family, and a fine family it is. Now I must visit the Old Pasture and see how the thistles are coming along.
        - id: ch04-b06
          speaker: narrator
          text: Chicoree flew away calling, “Chic-o-ree, per-chic-o-ree, chic-o-ree!” Mrs. Goldfinch followed him.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Mrs. Goldfinch followed close behind. As the two birds flew, they did not travel in a straight, level line. They rose and dipped through the air again and again, much as Yellow Wing the Flicker did.
        - id: ch04-b08
          speaker: peter_rabbit
          text: >-
            I could know them by that flight even if Chicoree didn't keep calling his own name. How funny that they often stay here all winter, yet they're among the very last birds to begin housekeeping. Just as I once told Jenny Wren, birds certainly are funny creatures.
        - id: ch04-b09
          speaker: jenny_wren
          text: >-
            Tut, tut, tut, tut, tut! They are no such thing, Peter Rabbit. No such thing at all!
        - id: ch04-b10
          speaker: narrator
          text: Jenny scolded as she flew past Peter, already hunting another worm for her hungry babies.
