audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, earnest, and quick to react
        timbre: warm and youthful
        pace: lively
        pitch: medium
    honker_goose:
      display_name: Honker the Goose
      tts:
        delivery: responsible, seasoned, and quietly friendly
        timbre: deep and resonant
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: The Voice from the Far North
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The leaves turned yellow, red, and brown. At first only a few fell. Then more came down each day, until the spruces, pines, hemlocks, firs, and cedars were the only trees still wearing green. Most of Peter's summer friends had gone, and some days he felt very lonely.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter's fur was growing thicker, and the grass on the Green Meadows had turned brown. He knew those signs. Rough Brother North Wind and Jack Frost were coming down from the Far North.
        - id: ch01-b03
          speaker: narrator
          text: >-
            There were few friends left for Peter to visit. Johnny Chuck was asleep for the winter in his little bedroom deep underground. Grandfather Frog was asleep too, and so was Old Mr. Toad.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter spent hours sitting quietly in the dear Old Briar-patch, listening. He did not know what he expected to hear. Still, he felt that some sound belonged to this time of year. So he listened, wondered, and listened again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Late one afternoon, a faint sound floated down from high in the sky. It grew louder as it came nearer. Peter had not heard anything like it all summer. Many voices were calling together, over and over, with long, ringing honks. Peter jumped.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            That's the sound I've been waiting for! Honker the Goose and his friends are coming. Oh, I hope they stop somewhere close enough for me to visit them.
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: >-
            Peter hopped to the edge of the briar-patch for a better view. Far above him, a flock of great birds flew steadily from the direction of the Far North. They formed the letter V across the sky. Their voices sounded tired after a long day's flight, and Peter knew the bird at the point was his old friend Honker.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The flock passed straight overhead, still calling as it went. As Peter stood below and listened, he felt the spirit of the Far North in those voices. It was a great, wild, lonely country that he had often heard about but never seen. Yet for that moment, its feeling seemed to come down from the sky with the weary travelers.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Suddenly Honker turned toward the Big River and began to glide downward. The others followed. Soon they vanished behind the trees along the riverbank, and Peter gave a happy little sigh.
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            They're staying there tonight. When the moon rises, I'll run over. I know where they'll come ashore. And now that Honker is here, winter can't be far behind. His voice promises winter just as surely as Winsome Bluebird's voice promises spring.
          emotion: happy
    - id: ch02
      title: The Geese Come Ashore
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter could hardly wait for the Black Shadows. The moment they crept across the Green Meadows, he started for the Big River. Honker and his friends had rested in the same place the year before, so Peter knew exactly where to go. He was certain they would choose that familiar resting place again.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He also knew the Geese would stay in the middle of the river until darkness made it safe to swim toward shore. Peter reached the bank just as Mistress Moon began spreading her silver light over the Great World. A sandy bar reached into the river there, and Peter crouched beside the place where it began.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Peter felt as if he had waited half the night, though only a little time had passed. Then a low signal came from the Black Shadows over the middle of the river. It was Honker's voice.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Thin silver lines appeared on the dark water and slowly drew nearer. Soon a dozen great shapes moved into the moonlight. Honker and his friends were swimming in. Every long neck stretched to its full height. Not one bird stopped listening for the smallest suspicious sound as the flock glided toward the sand.
        - id: ch02-b05
          speaker: narrator
          text: >-
            They came slowly, with Honker in front, and every movement showed how cautious they were. When they reached the sandy bar, they did not climb out at once. They stayed perfectly quiet for a while, looking along the shore and listening into the darkness. Only after Honker was certain the place was safe did he give another quiet signal.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Low gabbling began as the Geese relaxed and stepped onto the sand. All came out but one. That bird stayed on guard with his neck held straight and high, still watching while the others rested. Some of the flock swam among the rushes close to Peter and began to feed. Others settled on the sandy bar and carefully put their feathers in order. Honker himself came ashore close beside Peter.
        - id: ch02-b07
          speaker: peter_rabbit
          text: Oh, Honker, I'm so happy you've come back safe!
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: >-
            Honker started, then recognized Peter and came nearer. He looked handsome in the moonlight. His throat and the large patches on both sides of his head were white. The rest of his head and his long, slim neck were black, and so was his short tail.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Soft grayish-brown covered his back, wings, breast, and sides. White feathers circled the base of his tail, and a white collar stood out around his dark neck.
        - id: ch02-b10
          speaker: honker_goose
          text: >-
            Hello, Peter. It feels good to be welcomed by an old friend. And I truly am glad we reached this place safely. Hunters with terrible guns have been waiting at nearly every place where we tried to rest along the way. Because of them, finding enough time and safety to eat has been hard. What a relief it is to reach one resting place where there are no terrible guns.
        - id: ch02-b11
          speaker: peter_rabbit
          text: Have you traveled a long way?
        - id: ch02-b12
          speaker: honker_goose
          text: >-
            A very long way, Peter, and there is still a very long way ahead. I'll be thankful when the journey ends. Every bird with me depends on me to keep the flock safe. That is a great responsibility.
    - id: ch03
      title: News of Winter and Dippy
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: Is winter coming soon?
        - id: ch03-b02
          speaker: honker_goose
          text: >-
            Rough Brother North Wind and Jack Frost were close behind us. We always stay in the Far North as long as we can. Now our nesting place is frozen and buried in snow.
        - id: ch03-b03
          speaker: honker_goose
          text: >-
            During the first part of our journey, we traveled only a little ahead of the snow and ice. Then we came near the country where people make their homes. From that point on, we had to fly farther every day, because safe places to feed and rest were few and far apart. Now we must keep hurrying until we reach the faraway South and the place where we will spend the winter.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Wild, strange sounds suddenly rang out from the middle of the Great River. They sounded like crazy laughter. Peter jumped, but Honker only chuckled.
        - id: ch03-b05
          speaker: honker_goose
          text: >-
            That's Dippy the Loon. He spent the summer in the Far North, not far from us. He began his journey south shortly before we did.
        - id: ch03-b06
          speaker: peter_rabbit
          text: >-
            I wish he would swim over here. I'd like a good look at him, and I'd like to meet him.
        - id: ch03-b07
          speaker: honker_goose
          text: >-
            He might come, though I doubt it. Dippy and his mate prefer to keep to themselves. They don't need to go ashore to find food, either, because Dippy eats only fish.
        - id: ch03-b08
          speaker: honker_goose
          text: >-
            In some ways his long journey is easier than ours. Because his food is in the water, he can catch it without facing as much danger from the hunters' terrible guns. He spends nearly his whole life on the water and hardly needs the shore at all. But when he does get onto land, he is one of the most awkward fellows I know.
        - id: ch03-b09
          speaker: peter_rabbit
          text: Why is he any more awkward on land than you are?
        - id: ch03-b10
          speaker: narrator
          text: Peter's curiosity had awakened at once.
        - id: ch03-b11
          speaker: honker_goose
          text: >-
            Old Mother Nature gave Dippy very short legs and set them far back on his body. With his legs in that position, he cannot keep his balance well enough to walk normally. Whenever he must move over the ground, he has to push and pull himself along with help from both his wings and his bill. On shore, you can hardly imagine a more helpless bird.
        - id: ch03-b12
          speaker: honker_goose
          text: >-
            Put him in the water and he is a different fellow altogether. He is every bit as comfortable beneath the surface as he is on top. And how that bird can dive! If he sees the flash of a hunter's gun, he can slip beneath the water before the shot has time to reach him. That gives him an advantage over us Geese, because we cannot dive at all.
        - id: ch03-b13
          speaker: honker_goose
          text: >-
            Dippy could swim all the way across this river without coming up if he chose. Underwater he moves fast enough to catch fish. Those legs at the back of his body help him swim so quickly, and his feet work like two great paddles.
        - id: ch03-b14
          speaker: honker_goose
          text: >-
            He can even sink until nothing shows above the water but his head. I envy him for that. Escaping those dreadful hunters would be much easier for us Geese if we could sink the same way.
    - id: ch04
      title: A Bird Made for the Water
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: Does Dippy have a bill like yours?
        - id: ch04-b02
          speaker: honker_goose
          text: >-
            Of course not. Remember, he lives on fish. How could he hold a slippery fish with a broad bill like mine? His bill is strong, straight, and sharply pointed.
        - id: ch04-b03
          speaker: honker_goose
          text: >-
            Dippy is rather handsome, too, and he is almost as big as I am. His back, wings, tail, and neck are black, but in the sunshine those dark feathers can look bluish or greenish. His back and wings are patterned with white spots. White streaks run across his throat and along both sides of his neck, while his breast and everything below it are pure white.
        - id: ch04-b04
          speaker: honker_goose
          text: >-
            You really should meet him, Peter. There is no other bird quite like Dippy.
        - id: ch04-b05
          speaker: peter_rabbit
          text: >-
            I want to, but how can I if he never comes ashore? I suppose I'll have to know him only by his voice. I'll never forget that sound. It is almost as crazy as Old Man Coyote's voice, and that is saying a lot.
        - id: ch04-b06
          speaker: honker_goose
          text: >-
            I forgot one more thing. Dippy cannot rise into the air from land. He has to be on the water before he can take flight.
        - id: ch04-b07
          speaker: peter_rabbit
          text: But you can take off from land, can't you?
        - id: ch04-b08
          speaker: honker_goose
          text: >-
            Certainly. We Geese find a great deal of our food on land. When it is safe, we visit grain fields and eat the kernels shaken loose during harvest. We could never do that if we could not fly from the ground. Land or water makes no difference to us. We can rise from either one.
        - id: ch04-b09
          speaker: honker_goose
          text: >-
            Now, if you'll excuse me, Peter, I'm going to sleep for a while. I'm so tired, and tomorrow brings another long journey.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Peter politely wished Honker and his relatives good night. Then he left them in peace on the sandy bar in the Big River.
