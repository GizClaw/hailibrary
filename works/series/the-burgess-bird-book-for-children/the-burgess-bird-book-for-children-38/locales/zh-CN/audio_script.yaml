audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    honker_goose:
      display_name: 大雁洪克
      tts:
        delivery: 稳重坦率，长途领航者般警醒而可靠
        timbre: 浑厚洪亮
        pace: 沉稳适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 北方来的鸣声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            树叶先变黄、变红、变褐，接着便飘落下来。最初一天只有几片，后来一天比一天多。最后，除了云杉、松树、铁杉、冷杉和雪松，其他树木全都光秃秃了。彼得夏日里的羽族朋友也大多已经离开。有些日子，他心里别提多寂寞了。他身上的毛正一天天变厚，绿色草原上的青草已经枯黄。彼得很熟悉这些征兆。粗暴的北风老兄和初霜杰克就要从遥远的北方一路南下了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得如今没几个朋友可去拜访。土拨鼠约翰尼钻进地下深处的小卧室，开始睡他的冬觉。青蛙爷爷睡了，蟾蜍老先生也一样。彼得只好常常待在亲爱的荆棘老家，静静坐着，侧耳倾听。他不知道自己究竟在等什么，只觉得每年这个时候，总该有个声音出现。于是，他听了又听，心里也一直猜着自己在等什么。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天傍晚，一个漫长夏季里从没听见过的声音，从高高的天空飘了下来。起初很轻，后来越来越响。那是一声呼唤。可仔细听，又不是一个声音，而是许多个声音交织在一起：“嘎，嘎，嘎，嘎，嘎，嘎，嘎！”彼得一下跳了起来。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 我等的就是这个！大雁洪克和他的朋友们来啦。真希望他们停在我能去拜访的地方。
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得赶紧蹦到亲爱的荆棘老家边缘，好把天空看得更清楚。一群大鸟排成字母V，从遥远的北方稳稳飞来。听着他们的叫声，彼得知道，他们这一天已经飞了很远，全都累了。最前面领航的，正是他的老朋友洪克。雁群笔直飞过头顶。彼得听着那阵鸣声，心里仿佛也涌进了遥远北方的气息。那片土地广阔、荒凉，又寂寞。彼得从未亲眼见过，却已经听人说过许多回。
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得正仰头望着，洪克忽然转向大河，带着后面的雁群一起斜斜向下降落。不一会儿，他们便消失在大河岸边那一排树木后面。彼得这才快活地轻叹了一声。
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            他们今晚要在那里过夜。等月亮升起来，我就跑过去。我知道他们会从哪里上岸。洪克已经来了，冬天一定也不远啦。他的叫声预告冬天，就像蓝鸲知心的叫声预告春天一样准。
    - id: ch02
      title: 月光下的沙洲
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            彼得几乎等不及黑影爬上绿色草原。黑影刚刚出现，他便动身赶往大河。他很清楚，洪克和朋友们会回到去年歇脚的同一个地方，在那里休息过夜。他也知道，黑影没有把四周遮得足够安全以前，他们会一直留在河中央。彼得到达岸边时，温柔的月亮女士刚把银光洒向大千世界。河里横着一道沙洲，他便蹲在岸上，正对着沙洲的起头。
        - id: ch02-b02
          speaker: narrator
          text: >-
            彼得觉得自己好像等了半夜，其实才过了一小会儿。大河中央的黑影里传来一个低低的暗号，是洪克。接着，一道道细细的银线在水面移动，十来个巨大的身影很快游进月光。每只大鸟都把长颈伸得笔直，留神听着最细微的可疑声响。洪克领在最前面，大家慢慢靠近，处处小心。
        - id: ch02-b03
          speaker: narrator
          text: >-
            到了沙洲，他们没有马上上岸，而是安静地察看、倾听了好一阵。确认四下安全，洪克才又低低发出暗号。雁群放松警戒，嘴里轻声咕嘎起来。除了一只留下放哨，其余的都上了沙洲。那名守卫仍挺直脖子，留在原处警戒。有些雁游进水里的灯心草丛觅食，那片草丛离彼得坐的地方很近。另一些雁坐在沙洲上梳理羽毛。洪克亲自来到岸上，恰好就在彼得身边。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 洪克，看见你平平安安回到这里，我真高兴！
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: >-
            洪克微微一惊，可一认出彼得，马上便走到他身边。月光下，他显得十分神气。喉部和头部两侧各有一大片白羽，其余的头部和修长的颈子都是黑色，短尾巴也是黑的。背部、双翅、胸脯和身体两侧呈柔和的灰褐色。尾巴根部围着一圈白羽，颈上还像戴着一条白领圈。
        - id: ch02-b06
          speaker: honker_goose
          text: >-
            你好，彼得。一回来就有老朋友迎接，真叫人高兴。我也庆幸大家能平安到达。几乎每个歇脚处都有猎人拿着可怕的枪守候，我们想填饱肚子都很难。总算找到一个听不见枪声的地方，真能松口气了。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 你们已经飞了很远吗？
        - id: ch02-b08
          speaker: honker_goose
          text: >-
            很远，彼得，远得很。可我们前面还有很长很长的路。等这趟漫长的旅程终于结束，我才能真正放下心来。同行的伙伴都靠我保他们平安，这个责任可不轻。
        - id: ch02-b09
          speaker: peter_rabbit
          text: 冬天是不是很快就要来了？
        - id: ch02-b10
          speaker: honker_goose
          text: >-
            粗暴的北风老兄和初霜杰克紧跟在我们后面。你知道，我们总想尽量在遥远的北方多住些时候。可如今筑巢的地方已经冰封雪盖。刚出发时，我们一直只比冰雪快一点点。后来越接近人类居住的地方，每天就得飞得更远，因为能放心觅食、安心休息的地方实在太少，彼此还隔得很远。现在我们得继续赶路，一直飞到遥远的南方，回到过冬的家。
    - id: ch03
      title: 水上的潜鸟迪皮
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            就在这时，大河中央忽然传来一阵狂野又古怪的声音，打断了洪克的话。那声音就像有人发疯似的纵声大笑。彼得听见后吓得一跳，洪克却只轻轻笑了笑。
        - id: ch03-b02
          speaker: honker_goose
          text: >-
            那是潜鸟迪皮。他整个夏天都住在遥远的北方，离我们不远。他比我们早一点儿往南出发。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 真希望他游过来，让我好好看看，也跟他认识认识。
        - id: ch03-b04
          speaker: honker_goose
          text: >-
            他也许会来，不过我看希望不大。他和伴侣喜欢独来独往，也不用上岸找吃的。你知道，迪皮只吃鱼。长途迁徙时，他比我们轻松一些。他能在水里找到食物，不必为了吃东西冒那么大的风险，也不那么容易挨那些可怕猎人的枪子儿。他差不多一辈子都住在水上。可到了陆地上，我认识的家伙里，恐怕没有谁比他更笨拙。
        - id: ch03-b05
          speaker: peter_rabbit
          text: 他在陆地上为什么会比你更笨拙呢？
        - id: ch03-b06
          speaker: honker_goose
          text: >-
            这是因为大自然老妈妈给他的腿特别短，还把两条腿安在身体很靠后的地方。他走路时没法保持平衡，只好把翅膀和嘴也用上，才能在地面一点点挪动。到了岸上，他简直无助得难以想象。可一回到水里，他就完全变了一个样。水面上也好，水底下也好，他都像回到家一样自在。
        - id: ch03-b07
          speaker: honker_goose
          text: >-
            哎呀，那家伙潜水可真厉害！他一看见枪口闪光，就能抢在枪弹打到以前钻进水下。这一点比我们雁族占便宜，因为你知道，我们不会潜水。他要是愿意，可以从水底一口气游到大河对岸。他在水下游得飞快，甚至连鱼也追得上。他能游这么快，正是因为两条腿长在身体后面。你也知道，他那双脚根本就是两把大船桨。
        - id: ch03-b08
          speaker: honker_goose
          text: >-
            还有一件有趣的事。他想沉下去时，可以让身子直直沉进水里，水面上只露出一个脑袋。我真羡慕这个本事。要是我们雁族也能那样把身子沉进水里，躲开那些可怕的猎人就容易多了。
        - id: ch03-b09
          speaker: peter_rabbit
          text: 他的嘴也和你的一样吗？
        - id: ch03-b10
          speaker: honker_goose
          text: >-
            当然不一样。我不是已经告诉过你，他靠吃鱼过活吗？要是长着我这样扁阔的嘴，你想想，他怎么咬得住滑溜溜的鱼？他的嘴粗壮、笔直，尖端十分锋利。他长得还挺漂亮，个头差不多和我一样大。背部、双翅、尾巴和颈子都是黑色，阳光照上去会泛出蓝光或绿光。背和翅膀点缀着白斑，喉部和颈子两侧带着一道道白纹，胸脯和下半身则全是白色。彼得，你真该认识认识迪皮，因为再没有谁像他那样了。
    - id: ch04
      title: 迪皮的特别本领
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: >-
            我也想认识他。可他要是从不上岸，我怎么跟他结识呢？看来我只能凭声音认识他了。那个声音我肯定永远忘不了，听起来简直和郊狼老先生的叫声一样疯狂。能跟郊狼老先生相比，那已经很了不得啦。
        - id: ch04-b02
          speaker: honker_goose
          text: 对了，还有件事我忘了说。迪皮不能从陆地上起飞，他必须先待在水面上，才能飞到空中。
        - id: ch04-b03
          speaker: peter_rabbit
          text: 你能从陆地上起飞，对吧？
        - id: ch04-b04
          speaker: honker_goose
          text: >-
            我当然能。我们雁族有很多食物都得在陆地上找。只要四周安全，我们就会到谷田里去，捡拾收割时从谷穗上震落的谷粒。要是不能从地上起飞，我们当然也没法到那里觅食。对我们来说，从陆地起飞和从水面起飞一样容易，哪一种都不成问题。
    - id: ch05
      title: 明天还要远行
      blocks:
        - id: ch05-b01
          speaker: honker_goose
          text: 彼得，要是你不介意，我想睡一会儿。哎呀，我实在累坏了！明天还有很远的路要赶呢。
        - id: ch05-b02
          speaker: narrator
          text: 彼得很有礼貌地向洪克和他的亲族道了晚安，离开大河里的沙洲，让他们安安静静地休息。
