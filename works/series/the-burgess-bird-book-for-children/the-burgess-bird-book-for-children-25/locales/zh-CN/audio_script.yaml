audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    creeper_black_and_white_warbler:
      display_name: 黑白林莺爬爬
      tts:
        delivery: 尖细利落，自信中带着轻微调侃
        timbre: 纤细明亮
        pace: 偏快
        pitch: 高音
    mummer_yellow_throat:
      display_name: 黄喉地莺面具
      tts:
        delivery: 活泼顽皮，话里总带着淘气劲儿
        timbre: 轻盈清亮
        pace: 轻快
        pitch: 高音
    mrs_yellow_throat:
      display_name: 黄喉地莺太太
      tts:
        delivery: 亲切爽快，语气自然从容
        timbre: 轻柔清晰
        pace: 平稳
        pitch: 高音
    chut_chut_yellow_breasted_chat:
      display_name: 黄胸大林莺恰恰
      tts:
        delivery: 谨慎有力，嗓音富有音乐感
        timbre: 饱满响亮
        pace: 活泼多变
        pitch: 中高音
  chapters:
    - id: ch01
      title: 爬树的林莺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得从老果园的一棵苹果树旁经过，树上忽然传来一个细细的、略显尖厉的声音。
        - id: ch01-b02
          speaker: creeper_black_and_white_warbler
          text: >-
            兔子彼得，我都回来了，你至少也该说一句见到我很高兴吧。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得正跳得飞快，听见有人叫他，立刻停住脚步，抬头望去。就在他头顶上方的树枝上，一只小鸟正来回奔跑，一会儿跑在枝头上面，一会儿又绕到下面。他穿着黑白条纹的外衣，胸前还端端正正配着一件白背心。彼得才看清他，他就飞到树根附近，贴着树干直往上跑，还不时从树皮上啄点东西。这副爬树的样子，真像彼得冬日里的朋友褐旋木雀嘶嘶。
        - id: ch01-b04
          speaker: creeper_black_and_white_warbler
          text: >-
            我可是从南美洲一路赶回来的。你就这样迎接我，也太冷淡了吧。
        - id: ch01-b05
          speaker: narrator
          text: >-
            这只黑白相间的小鸟说话时，亮晶晶的眼睛直眨。他就是黑白林莺爬爬。
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            啊，爬爬！我不知道你在这儿。见到你，我当然高兴，简直高兴得不能再高兴了。你总是悄没声儿的，要不是你先开口，我恐怕根本看不见你。不过，我到现在还是很难相信，你真的是一只林莺。
          emotion: happy
        - id: ch01-b07
          speaker: creeper_black_and_white_warbler
          text: >-
            为什么？我看起来不像林莺吗？
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            像——模样是挺像，可你的做派一点儿也不像。
        - id: ch01-b09
          speaker: creeper_black_and_white_warbler
          text: >-
            那你倒说说，我哪里不像林莺？
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            我认识的其他林莺全都闲不住，一分钟也安静不了。他们老是这里飞飞，那里蹿蹿，再跳到别处去，我看着都累。你却完全不是这样。哪只林莺会像你一样，沿着树干往上跑，还在树枝上来回奔走？你为什么不跟他们一样飞来飞去呢？
        - id: ch01-b11
          speaker: narrator
          text: >-
            爬爬听了，明亮的眼睛闪起光来。
        - id: ch01-b12
          speaker: creeper_black_and_white_warbler
          text: >-
            因为我根本用不着。彼得，我告诉你一个秘密。其他林莺在叶子、细枝和空中找吃的，我发现的办法更省事。树干和粗枝上有许多小虫、昆虫和虫卵，我留在这里就能吃得很好，何必整天到处飞？除了啄木鸟、䴓和山雀汤米，也没有谁来跟我争。
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            说到这些鸟，他们都在树洞里做窝。你也是吗？
        - id: ch01-b14
          speaker: creeper_black_and_white_warbler
          text: >-
            我才不呢！我没听说过哪只林莺住在树洞里。我是在绿森林的地面上筑巢。有时把巢放在树根旁的小凹坑里，有时藏在树桩或岩石下面，也可能塞进一棵倒下的大树根底下。好啦，兔子彼得，我说得够多了。你高兴我回来，我也很开心。我自己能回来，同样开心。
        - id: ch01-b15
          speaker: narrator
          text: >-
            爬爬说完，又沿着树干往上跑。他一会儿停在这里，从树皮上啄点什么，一会儿又跑到那里，继续寻找自己的食物。就在这时，彼得看见了另一位老朋友。
    - id: ch02
      title: 黑面罩里的淘气眼睛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那位朋友脸上有一片黑色，活像戴着面罩，彼得一眼就认出他是黄喉地莺面具。面具刚钻进老石墙边的灌木丛，彼得便赶紧追过去。可等彼得到达那里，灌木间连一个影子也没有。他只好坐下来，还没想好该往哪边找，面具忽然凭空似的蹦到他面前。
        - id: ch02-b02
          speaker: narrator
          text: >-
            面具的喉咙和整个胸脯都是鲜亮的黄色，背部、两边翅膀和尾巴则是柔和的橄榄绿色。最醒目的地方，还是横过双颊、眼睛和额头的那片黑色。那不是真面罩，却跟面罩一模一样。
        - id: ch02-b03
          speaker: peter_rabbit
          text: >-
            你好呀，面具！
          emotion: happy
        - id: ch02-b04
          speaker: mummer_yellow_throat
          text: >-
            你也好呀，兔子彼得！
        - id: ch02-b05
          speaker: narrator
          text: >-
            面具才说完，就像出现时那样，眨眼间又消失了。彼得愣得眨了眨眼，连忙朝灌木丛四下张望，可不管怎么看，都找不到他藏在哪里。
        - id: ch02-b06
          speaker: mummer_yellow_throat
          text: >-
            你在找谁吗？
        - id: ch02-b07
          speaker: narrator
          text: >-
            这一回，面具偏偏从彼得最意想不到的地方冒了出来。
        - id: ch02-b08
          speaker: peter_rabbit
          text: >-
            拜托，你就不能安静地待一分钟吗？每次看见你都不到两秒钟，你叫别人怎么跟你说话？
        - id: ch02-b09
          speaker: mummer_yellow_throat
          text: >-
            谁请你跟我说话啦？
        - id: ch02-b10
          speaker: narrator
          text: >-
            面具一回嘴，又不见了。两秒钟后，他再次出现，明亮的小眼睛里全是淘气。彼得还没来得及说话，他已经唱起一支悦耳的小曲。面具实在太快乐了，彼得再想生气也气不起来。
        - id: ch02-b11
          speaker: peter_rabbit
          text: >-
            面具，有一点我特别喜欢。不管隔多远，只要还看得见你脸上的黑面罩，我就绝不会把你认成别的鸟。黄喉地莺太太到了吗？
        - id: ch02-b12
          speaker: mrs_yellow_throat
          text: >-
            当然到了。
        - id: ch02-b13
          speaker: narrator
          text: >-
            黄喉地莺太太从彼得眼前轻盈地飞过。她只停了短短一会儿，刚好让他从头到尾仔细看上一眼。她的衣裳和面具很相像，脸上却没有那副黑面罩。
        - id: ch02-b14
          speaker: narrator
          text: >-
            彼得正想说几句客气又好听的话，背后忽然响起两声又大又干脆的“恰！恰！”
        - id: ch02-b15
          speaker: narrator
          text: >-
            彼得猛地转身，又见到一位老朋友。那是黄胸大林莺恰恰，林莺家族里个头最大的一位。他比面具大出许多，很难叫人相信他们竟是嫡亲的表兄弟。可彼得知道他们确实是。他也绝不会把恰恰错认成别的林莺，因为恰恰足有某些麻雀那么大。
        - id: ch02-b16
          speaker: narrator
          text: >-
            恰恰的背部是深橄榄绿色，喉咙和胸脯则是美丽的鲜黄色。每只眼睛上方都有一道宽宽的白纹，下面还有一道细白纹。黄色胸脯以下，羽毛全是白色。
    - id: ch03
      title: 谨慎的歌唱家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            单看恰恰那副样子，谁都会以为他正怀疑彼得要伤害自己。他就是这么戒备。彼得要是不够了解这位朋友，恐怕真会觉得受了冒犯。可他知道，所有长羽毛的朋友当中，没有谁比恰恰更加谨慎。恰恰从不想当然地相信任何事，似乎时时刻刻都在防备危险，就连最要好的朋友也不例外。
        - id: ch03-b02
          speaker: narrator
          text: >-
            直到亲眼看够、心里认定这里没有危险，恰恰才肯走出来，跟彼得闲聊几句。可他跟其他林莺一样，一刻也待不住。他正讲着从遥远的墨西哥一路飞来的见闻，忽然飞上小树顶，唱起歌来。接着，他又飞进空中，两条腿垂在身下，尾巴滑稽地上下摆动。他一路唱着，慢慢落回灌木丛。歌声美极了，彼得赶忙告诉恰恰，自己非常喜欢。
        - id: ch03-b03
          speaker: narrator
          text: >-
            恰恰听了很高兴，干脆独自开了一场小小的音乐会。口哨、叫声和歌声接连从那副黄色的喉咙里传出来，花样多得叫彼得从未听过。音乐会一结束，恰恰忽然道了声再见，便钻进灌木间不见了。他在一丛丛灌木里继续寻找小虫，彼得还能听见远处传来尖亮的“恰！恰！”声。
        - id: ch03-b04
          speaker: peter_rabbit
          text: >-
            真不知道他把巢筑在哪里。他也像爬爬那样，把巢放在地上吗？
        - id: ch03-b05
          speaker: narrator
          text: >-
            彼得只是在想事情，却不知不觉说出了声。面具一直在附近飞来飞去，听见这话便回答了他。
        - id: ch03-b06
          speaker: mummer_yellow_throat
          text: >-
            不，恰恰不在地上筑巢，可我会。他的巢离地面也很近，通常只有两三英尺高，就搭在灌木或荆棘丛里。要是找到枝条纠缠得很密的荆棘丛，我有时也会把巢搭到几英尺高。不过大多数时候，我还是喜欢地面，把巢藏在灌木下面，或者放进一丛杂草里。对了，你见过我们的表亲小精灵北森莺了吗？
        - id: ch03-b07
          speaker: peter_rabbit
          text: >-
            还没有。
        - id: ch03-b08
          speaker: narrator
          text: >-
            彼得说完，便离开灌木丛，动身回家去了。
