audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    creeper_black_and_white_warbler:
      display_name: Creeper the Black and White Warbler
      tts:
        delivery: wiry, self-assured, and lightly teasing
        timbre: thin and bright
        pace: quick
        pitch: high
    mummer_yellow_throat:
      display_name: Mummer the Yellow-throat
      tts:
        delivery: playful, lively, and mischievous
        timbre: light and sparkling
        pace: quick
        pitch: high
    mrs_yellow_throat:
      display_name: Mrs. Yellow-throat
      tts:
        delivery: pleasant and matter-of-fact
        timbre: light and clear
        pace: steady
        pitch: high
    chut_chut_yellow_breasted_chat:
      display_name: Chut-Chut the Yellow-breasted Chat
      tts:
        delivery: cautious, emphatic, and richly musical
        timbre: full and ringing
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Three Cousins Quite Unlike
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit was passing an apple tree in the Old Orchard when a thin, wiry voice called down to him.
        - id: ch01-b02
          speaker: creeper_black_and_white_warbler
          text: >-
            Peter Rabbit, you might at least tell me you're glad I've come back.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter had been hopping along at a good pace. He stopped short and looked up. A small bird in a black-and-white striped coat and a white waistcoat was running along the limb above him, first on top and then underneath. The bird flew down near the foot of the tree and ran straight up the trunk, picking things from the bark as he went. He moved so much like Peter's winter friend Seep Seep the Brown Creeper that Peter could hardly miss the resemblance.
        - id: ch01-b04
          speaker: creeper_black_and_white_warbler
          text: >-
            This isn't much of a welcome for someone who's flown all the way from South America.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The little bird's eyes twinkled as he spoke.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            Oh, Creeper! I didn't know you were here. Of course I'm glad to see you. I'm as glad as I can be! You're so quiet that I might never have noticed you if you hadn't called. But I still have a hard time believing you're truly a Warbler.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Creeper was the Black and White Warbler, the name most people knew him by.
        - id: ch01-b08
          speaker: creeper_black_and_white_warbler
          text: >-
            Why is that? Don't I look like a Warbler?
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            Ye-es. You look like one, but you certainly don't behave like one.
        - id: ch01-b10
          speaker: creeper_black_and_white_warbler
          text: >-
            And just how do I fail to behave like a Warbler?
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            Every other Warbler I know is always on the move. They never seem able to stay still for even a minute. They flit here, there, and everywhere until I get tired just watching them. You don't do that at all. And Warblers don't usually run up tree trunks and along branches the way you do. Why aren't you always darting about like the others?
        - id: ch01-b12
          speaker: narrator
          text: Creeper's bright eyes sparkled.
        - id: ch01-b13
          speaker: creeper_black_and_white_warbler
          text: >-
            Because I don't need to. I'll tell you my secret, Peter. The other Warblers find their food among the leaves and twigs or catch it in the air. I've found an easier way. Tree trunks and big branches are covered with tiny worms, insects, and eggs. I can eat very well right here without flitting around all day. And I only have to share with the Woodpeckers, the Nuthatches, and Tommy Tit the Chickadee.
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            That makes me think of something. All those birds nest in holes in trees. Do you do that too?
        - id: ch01-b15
          speaker: creeper_black_and_white_warbler
          text: >-
            Certainly not! I don't know a single Warbler who does. I build my nest on the ground in the Green Forest. I may put it in a small hollow at the foot of a tree, under a stump or rock, or beneath the roots of a fallen tree. But I've talked long enough, Peter Rabbit. I'm glad you're happy to have me back, and I'm happy to be back myself.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Creeper went on up the trunk, stopping to pick something from the bark here and something else there. That was when Peter noticed another old friend nearby.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Just then Peter spotted another friend. The black mask across the bird's face made him easy to recognize. It was Mummer the Yellow-throat, darting into the bushes beside the old stone wall. Peter hurried over to find him.
        - id: ch01-b18
          speaker: narrator
          text: >-
            When Peter reached the spot, Mummer was nowhere in sight. Peter sat down, unsure where to look next. Then Mummer seemed to pop out of nowhere, right in front of him. His throat and breast were bright yellow, while his back, wings, and tail were soft olive-green. Most striking of all was the black band across his cheeks, eyes, and forehead. It looked exactly like a mask, though of course it was not one.
        - id: ch01-b19
          speaker: peter_rabbit
          text: Hello, Mummer!
        - id: ch01-b20
          speaker: mummer_yellow_throat
          text: Hello to you, Peter Rabbit!
        - id: ch01-b21
          speaker: narrator
          text: >-
            Mummer vanished as quickly as he had appeared. Peter blinked and searched the bushes, but he could not find him anywhere.
        - id: ch01-b22
          speaker: mummer_yellow_throat
          text: Looking for somebody?
        - id: ch01-b23
          speaker: narrator
          text: >-
            Mummer suddenly popped into sight in the last place Peter expected.
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            For goodness' sake, could you stay still for one minute? How can anyone talk to you when you're never in sight for more than two seconds?
        - id: ch01-b25
          speaker: mummer_yellow_throat
          text: Who said I wanted you to talk to me?
        - id: ch01-b26
          speaker: narrator
          text: >-
            Mummer slipped out of view again. Two seconds later he was back, his bright little eyes fairly shining with mischief. Before Peter could say a word, Mummer broke into a pleasant little song. He was so full of happiness that Peter could not stay cross with him, no matter how often he disappeared.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            I do like one thing about you, Mummer. I could never mistake you for another bird. I would know you from as far away as I could see that black mask. Is Mrs. Yellow-throat here yet?
        - id: ch01-b28
          speaker: mrs_yellow_throat
          text: Of course I am.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Mrs. Yellow-throat flitted directly across Peter's path. She stayed still just long enough for him to get one good look. Her colors were much like Mummer's, except that she wore no black mask.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Peter was about to say something polite when a loud, sharp call came from just behind him.
        - id: ch01-b31
          speaker: chut_chut_yellow_breasted_chat
          text: Chut! Chut!
        - id: ch01-b32
          speaker: narrator
          text: >-
            Peter spun around and found another old friend, Chut-Chut the Yellow-breasted Chat. He was the largest bird in the Warbler family. In fact, he was so much bigger than Mummer that it was hard to believe they were first cousins. Peter knew they were, though. He also knew he could never confuse Chut-Chut with another Warbler. Chut-Chut was as big as some Sparrows. His back was dark olive-green, and his throat and breast were a beautiful bright yellow. A broad white line ran above each eye, with a smaller white line below it. Beneath his yellow breast, all his feathers were white.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Just from watching Chut-Chut, anyone might have thought he suspected Peter of wanting to harm him. Peter could have felt offended if he had not known his friend so well. But Peter understood. None of his feathered friends was more cautious than Chut-Chut. He never took anything for granted. He always seemed to be watching for danger, even when he was with his very best friends.
        - id: ch01-b34
          speaker: narrator
          text: >-
            At last Chut-Chut decided there was nothing to fear and came out for a little gossip. Like every other Warbler, he could not stay still. He was right in the middle of telling Peter about his journey from far-off Mexico when he flew to the top of a small tree and began to sing. Then he launched himself into the air. His legs dangled, and his tail bobbed up and down in the funniest way. Still singing, he slowly dropped back into the thicket.
        - id: ch01-b35
          speaker: narrator
          text: >-
            It was a beautiful song, and Peter quickly told Chut-Chut how much he liked it.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Peter's praise pleased Chut-Chut so much that he gave a whole concert all by himself. Peter thought he had never heard such a variety of whistles, calls, and songs come from one yellow throat. When the concert ended, Chut-Chut suddenly said good-by and disappeared into the bushes. Farther along the thicket, Peter could still hear his sharp call as he hunted among the bushes for worms.
        - id: ch01-b37
          speaker: chut_chut_yellow_breasted_chat
          text: Chut! Chut!
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            I wonder where he makes his nest. Does he put it on the ground like Creeper does?
        - id: ch01-b39
          speaker: narrator
          text: >-
            Peter had spoken aloud without meaning to. Mummer, who had been darting about nearby the whole time, answered him.
        - id: ch01-b40
          speaker: mummer_yellow_throat
          text: >-
            No, Chut-Chut doesn't nest on the ground, but I do. His nest is close to the ground, usually only two or three feet above it. He puts it in bushes or briars. If I find a good thick tangle of briars, I may build several feet up too. Most of the time, though, I prefer the ground beneath a bush or in a clump of weeds. Have you seen our cousin Sprite the Parula Warbler yet?
        - id: ch01-b41
          speaker: peter_rabbit
          text: Not yet.
        - id: ch01-b42
          speaker: narrator
          text: After answering, Peter turned away from the thicket and started for home.
