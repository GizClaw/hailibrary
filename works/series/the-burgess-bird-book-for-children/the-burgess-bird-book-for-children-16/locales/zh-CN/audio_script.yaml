audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 好奇朴实，发问时认真又直率
        timbre: 温暖敦实
        pace: 从容
        pitch: 中低音
    skimmer_tree_swallow:
      display_name: 树燕掠影
      tts:
        delivery: 活泼自信，受到质疑时容易着恼
        timbre: 明亮轻盈
        pace: 轻快
        pitch: 中高音
    forktail_barn_swallow:
      display_name: 家燕叉尾
      tts:
        delivery: 爽朗自信，说话干脆又带着好胜心
        timbre: 清亮舒展
        pace: 轻快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 布朗家的男孩
      tts:
        delivery: 机敏果断，带着乡村少年的爽快劲儿
        timbre: 清朗结实
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十六章　老果园里的强盗
      blocks:
        - id: ch01-b01
          speaker: johnny_chuck
          text: 我不信。我才不信鹪鹩珍妮真知道自己在说什么呢。
        - id: ch01-b02
          speaker: narrator
          text: 土拨鼠约翰尼把这句话大声嘟囔了出来。树燕掠影又在自家门口坐稳，听见以后，马上问他。
        - id: ch01-b03
          speaker: skimmer_tree_swallow
          text: 珍妮究竟说了什么，让你这么不相信？
        - id: ch01-b04
          speaker: johnny_chuck
          text: 她说蜂鸟小哼和烟囱雨燕煤灰，勉强也算远房表亲。
        - id: ch01-b05
          speaker: skimmer_tree_swallow
          text: >-
            这本来就是真的，你不信也是真的。你跟花栗鼠条纹，还有灰松鼠懒杰克，不也都是亲戚吗？只看你的模样，谁能想到你属于松鼠家族？可你总不能不承认吧。
        - id: ch01-b06
          speaker: narrator
          text: 约翰尼想了想，慢慢点了点头。
        - id: ch01-b07
          speaker: johnny_chuck
          text: >-
            这倒没错。我看着不像，可我的确是松鼠家族的一员。这个世界真有意思，是不是？只看模样，还真瞧不出谁跟谁是亲戚。我才知道煤灰跟你没关系，跟小哼倒有亲戚。从今以后，我可不敢再乱猜了。我一直当紫崖燕啾啾是你的亲戚。既然煤灰不是，我还以为啾啾也不是呢。
        - id: ch01-b08
          speaker: skimmer_tree_swallow
          text: 啾啾当然是我们的亲戚。他是燕子家族里个头最大的，我们全都以他为荣，而且大家都喜欢他。
        - id: ch01-b09
          speaker: johnny_chuck
          text: >-
            他飞在高处时，看起来黑漆漆的，真有那么黑吗？他从不像你一样飞到下面来，叫人看个清楚。
        - id: ch01-b10
          speaker: skimmer_tree_swallow
          text: >-
            他确实从头到脚都穿着黑衣裳，不过，那是很漂亮的蓝黑色。太阳照到背上时，那里几乎会泛出紫光，所以有人叫他紫崖燕。啾啾是我认识的鸟儿里最爱热闹的一位。我喜欢像现在这样独门独户，他却最爱有伴，愿意跟许多同类一起住在一幢公寓里。
        - id: ch01-b11
          speaker: skimmer_tree_swallow
          text: >-
            他专门寻找有许多房间的大鸟屋。布朗家的男孩就在后院高杆顶上搭了一幢。那男孩费了不少力气，啾啾也没白住。要说有谁捉的苍蝇和飞虫比他更多，我还真不知道是谁。
        - id: ch01-b12
          speaker: forktail_barn_swallow
          text: 那么，我捉得不多吗？
        - id: ch01-b13
          speaker: narrator
          text: >-
            一个新声音忽然从空中落下来。一道轻盈的身影擦过约翰尼头顶，闪电般转身，又飞了回来。那是家燕叉尾，燕子家族里最英俊、飞起来也最轻巧的成员之一。
        - id: ch01-b14
          speaker: narrator
          text: >-
            叉尾贴着约翰尼飞过，让他有了一个绝好的机会，看清那一身漂亮羽毛。背上闪着钢蓝色的光，额头和喉部是栗褐色，喉下围着一道细细的黑领圈，腹部则由棕色渐渐变成浅黄褐色。可他身上最惹眼的还是尾巴，那道分叉深得让它看起来几乎像两条尾巴。
        - id: ch01-b15
          speaker: johnny_chuck
          text: 我离得再远，只要看见那条尾巴，也能认出他来。别的鸟哪有这样的尾巴！
        - id: ch01-b16
          speaker: skimmer_tree_swallow
          text: 本来就没有。啾啾是我们家族里个头最大的，叉尾则是最俊美的。
        - id: ch01-b17
          speaker: forktail_barn_swallow
          text: >-
            可别忘了我还有没有用。啾啾表哥确实会捉苍蝇和昆虫，不过哪一天都行，我愿意跟他比一场，看看到底谁捉得多。
        - id: ch01-b18
          speaker: narrator
          text: >-
            叉尾说完便飞走了，最后落在布朗农场主的谷仓顶上。约翰尼望着他，忽然想起一件一直没弄明白的事。
        - id: ch01-b19
          speaker: johnny_chuck
          text: >-
            真奇怪。我从长到能认人的时候起就认识叉尾了，却一直不知道他是怎么筑巢的。我见过他无数次贴着绿色草原飞，也常见他像刚才那样飞来老果园。可除了那座谷仓，我从没见他在别处停下。
        - id: ch01-b20
          speaker: skimmer_tree_swallow
          text: 因为他的巢就在那儿呀。
        - id: ch01-b21
          speaker: narrator
          text: 掠影忍不住咯咯笑了起来。约翰尼一下子瞪大了眼睛。
        - id: ch01-b22
          speaker: johnny_chuck
          text: 什么？他把巢筑在布朗农场主的谷仓上？
        - id: ch01-b23
          speaker: skimmer_tree_swallow
          text: >-
            不是谷仓上面，是谷仓里面。他正因为住在那里，才叫家燕。难怪你一直看不到他的巢。你去那座谷仓，抬头看看屋顶里面，准能在某处找到叉尾的家。
        - id: ch01-b24
          speaker: johnny_chuck
          text: 叫我去布朗农场主的谷仓？你以为我疯了吗？
          emotion: surprised
        - id: ch01-b25
          speaker: narrator
          text: 掠影又笑了。
        - id: ch01-b26
          speaker: skimmer_tree_swallow
          text: >-
            叉尾可不疯，他一天到晚都在那座谷仓里进进出出。要我说，我自己绝不会把家造在那种地方，他却似乎住得挺满意。那儿确实有一样好处，无论外面是什么天气，他的家总是暖和、干燥又舒服。
        - id: ch01-b27
          speaker: skimmer_tree_swallow
          text: >-
            不过，我绝不会跟他换。拿什么来都不换。我的家要在树洞里，巢里铺满羽毛。叉尾的巢就算也铺着羽毛，那还是泥巴和干草造的，我才不要。
        - id: ch01-b28
          speaker: johnny_chuck
          text: 叉尾看起来那么整洁、那么英俊，筑巢竟然会用泥巴？
          emotion: surprised
        - id: ch01-b29
          speaker: narrator
          text: 掠影点点头。
        - id: ch01-b30
          speaker: skimmer_tree_swallow
          text: 他真的会用。这一点，他跟报春知更鸟有点像。我——
        - id: ch01-b31
          speaker: narrator
          text: >-
            约翰尼再也没听见掠影后面想说什么。就在那一刻，掠影碰巧抬头看了一眼。他顿时吓得僵住，接着尖叫一声，猛冲进空中。一直在树洞里孵蛋的掠影太太听见叫声，也尖叫着冲出门口。
        - id: ch01-b32
          speaker: narrator
          text: >-
            有那么一会儿，约翰尼怎么也想不出究竟出了什么事。随后，一阵细微的窸窣声引着他抬头望去。在掠影家门口上方不远的树杈间，黑蛇先生把一部分身子盘在树枝上。他的头左右摇摆，眼睛发亮，分叉的舌头伸了又缩，正竭力往鸟巢里面窥探。
        - id: ch01-b33
          speaker: narrator
          text: >-
            在约翰尼看来，似乎只过了一眨眼，老果园里的每一只鸟就全赶到了。四下里尽是尖厉的叫喊声。鸟儿一个接一个俯冲向黑蛇先生，却又在最后一刻失去勇气，转身飞开。可怜的掠影和他那小巧的妻子急得发狂，几乎扑到黑蛇先生脸上，又赶在他出击以前迅速躲开，拼命想把他的注意引走。
        - id: ch01-b34
          speaker: narrator
          text: >-
            可黑蛇先生知道，这些鸟伤不了自己。他也知道，那个巢里藏着鸟蛋。除了雏鸟，他最爱吃的就是鸟蛋。他只恼火地嘶嘶叫了两三次，对掠影和朋友们理也不理，仍旧一点一点爬向巢口。
        - id: ch01-b35
          speaker: narrator
          text: >-
            最后，黑蛇先生爬到了能把头伸进门口的地方。掠影和掠影太太各自发出一声绝望的低鸣。他的脑袋才钻进老苹果树的洞口，斗士王霸鹟便凶猛地扑过去，狠狠啄了他一下。
        - id: ch01-b36
          speaker: narrator
          text: >-
            黑蛇先生立刻缩回头，凶狠地嘶叫着，又猛扑向离他最近的鸟儿。可他的头只要再次从洞口消失，斗士或者掠影的某个朋友，总会有一位比其他鸟更勇敢，马上冲上去狠狠啄他。这样的情形一连发生了好几次。在这段时间里，所有鸟儿始终尖声大叫，那声势只有激动起来的羽族才造得出来。
        - id: ch01-b37
          speaker: narrator
          text: >-
            约翰尼也跟鸟朋友们一样激动。他只顾死死盯着那个可恨的黑强盗，别的什么都看不见。忽然，身后近处响起了脚步声。他一回头，正好抬眼望进布朗家男孩的眼睛。约翰尼吓得头朝下钻进洞里，简直快疯了。
        - id: ch01-b38
          speaker: farmer_browns_boy
          text: 哈，哈！果然跟我猜的一样！
        - id: ch01-b39
          speaker: narrator
          text: >-
            那时，黑蛇先生正把头又一次伸进洞口。他已经下定决心，这一回非要夺到那些鸟蛋不可。布朗家的男孩扬起一根长长的细树条，正好猛抽在他身上。黑蛇先生挨了这一下，又听见男孩的声音，转眼便改了主意。他干脆松开攀住树枝的身子，整个儿掉了下去。
        - id: ch01-b40
          speaker: narrator
          text: >-
            黑蛇先生一碰到地面，就像箭一样逃向老石墙。布朗家的男孩紧紧追在后面。他没打算杀死黑蛇先生，只想狠狠吓唬他，让他不敢很快再到老果园来。他的办法果然奏效了。
        - id: ch01-b41
          speaker: narrator
          text: >-
            黑蛇先生才一消失，所有鸟儿立刻欢呼起来。听那份热闹，你准会以为救下掠影夫妇那些鸟蛋的是他们，而不是布朗家的男孩。
        - id: ch01-b42
          speaker: narrator
          text: 土拨鼠约翰尼听着他们欢呼，实在忍不住，笑了起来。
