audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: curious, earnest, and easily startled
        timbre: warm and sturdy
        pace: relaxed
        pitch: medium
    skimmer:
      display_name: Skimmer the Tree Swallow
      tts:
        delivery: friendly, confident, and informative
        timbre: light and clear
        pace: brisk
        pitch: medium-high
    forktail:
      display_name: Forktail the Barn Swallow
      tts:
        delivery: spirited, proud, and playful
        timbre: bright and smooth
        pace: quick
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: alert, bold, and good-natured
        timbre: youthful and clear
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Cousins Who Look Nothing Alike
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Johnny Chuck muttered aloud that he simply couldn't believe it. He was sure Jenny Wren didn't know what she was talking about. Skimmer the Tree Swallow had just settled once more in the doorway of his home, and he wanted to know exactly what Jenny had said.
        - id: ch01-b02
          speaker: johnny_chuck
          text: She says Hummer the Hummingbird is a kind of second cousin to Sooty the Chimney Swift.
        - id: ch01-b03
          speaker: skimmer
          text: >-
            Well, it's true whether you believe it or not. Is that any stranger than your being cousin to Striped Chipmunk and Nappy Jack the Gray Squirrel? No one would guess from looking at you that you belong to the Squirrel family, but you know you do.
        - id: ch01-b04
          speaker: narrator
          text: Johnny nodded and thought it over.
        - id: ch01-b05
          speaker: johnny_chuck
          text: >-
            Yes, I do belong to that family, even though I don't look like them. What a funny world this is. You really can't tell who someone's relatives are just by looking. Now I know Sooty isn't related to you, and he is related to Hummer, I'm never going to guess about relatives again. I always thought Twitter the Martin must be one of your family. But if Sooty isn't, perhaps Twitter isn't either.
        - id: ch01-b06
          speaker: skimmer
          text: >-
            Oh, Twitter certainly is. He's the biggest member of the Swallow family. We're all very proud of him, and everybody loves him.
        - id: ch01-b07
          speaker: johnny_chuck
          text: >-
            Is he really as black as he looks when he's circling high in the air? He never comes down here the way you do, so I can't get a proper look at him.
        - id: ch01-b08
          speaker: skimmer
          text: >-
            Yes, he wears black all over, but it's a beautiful blue-black. When sunlight falls on his back, the feathers look almost purple. That's why some people call him the Purple Martin. Twitter is one of the most sociable fellows I know. I like having a home to myself, like this one. Twitter wants company. He likes an apartment house filled with others of his own kind.
        - id: ch01-b09
          speaker: skimmer
          text: >-
            That's why he looks for a house with many rooms, like the one Farmer Brown's boy put on top of that tall pole in the back yard. And Twitter pays him well for all the work of putting it up. If any bird catches more flies and other winged insects than Twitter does, I don't know that bird.
    - id: ch02
      title: Forktail and His Barn Home
      blocks:
        - id: ch02-b01
          speaker: forktail
          text: What about me?
        - id: ch02-b02
          speaker: narrator
          text: >-
            A new voice spoke as a graceful bird skimmed over Johnny Chuck's head. In a flash the bird turned and came back. It was Forktail the Barn Swallow, the handsomest and one of the most graceful birds in the whole Swallow family.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Forktail passed so near that Johnny had a splendid look at him. His back shone steel blue. His forehead and throat were a rich chestnut brown, with a narrow black collar below. His underparts shaded from brown to buff. Most striking of all was his tail. Its fork was so deep that it almost looked like two tails.
        - id: ch02-b04
          speaker: johnny_chuck
          text: >-
            I could know Forktail from as far away as I could see him, just from that tail. No other tail looks anything like it.
        - id: ch02-b05
          speaker: skimmer
          text: >-
            There isn't another tail like it. Twitter may be the largest in our family, but Forktail is the handsomest.
        - id: ch02-b06
          speaker: forktail
          text: >-
            And what about how useful I am? Cousin Twitter catches plenty of flies and insects, that's true. But I'll compete with him any day and see which of us can catch more.
        - id: ch02-b07
          speaker: narrator
          text: >-
            With that, Forktail darted away. Johnny and Skimmer watched him land on top of Farmer Brown's barn.
        - id: ch02-b08
          speaker: johnny_chuck
          text: >-
            That's a funny thing. I've known Forktail ever since I was old enough to know anybody, but I've never learned how he builds his nest. I've watched him skim over the Green Meadows more times than I could count. He often visits the Old Orchard, just as he did now. Yet the only place I've ever seen him stop is that barn.
        - id: ch02-b09
          speaker: skimmer
          text: That's because he nests there.
        - id: ch02-b10
          speaker: johnny_chuck
          text: What? Are you telling me he builds his nest on Farmer Brown's barn?
          emotion: surprised
        - id: ch02-b11
          speaker: skimmer
          text: >-
            Not on the barn. He nests inside it. That's why he's called the Barn Swallow, and that's why you've never seen his nest. Go over to Farmer Brown's barn, look up under the roof, and you'll find Forktail's nest somewhere in there.
        - id: ch02-b12
          speaker: johnny_chuck
          text: Me, go over to Farmer Brown's barn? Do you think I've lost my mind?
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: Skimmer chuckled.
        - id: ch02-b14
          speaker: skimmer
          text: >-
            Forktail hasn't lost his mind, and he flies in and out of that barn all day. I wouldn't want to build in a place like that, but he seems to enjoy it. His home is warm, dry, and comfortable in every kind of weather. Even so, I wouldn't trade homes with him. No, sir, not for anything. I'd rather have a hollow in a tree, lined with feathers, than a nest made from mud and straw, even if that nest has a feather lining too.
        - id: ch02-b15
          speaker: johnny_chuck
          text: That neat, handsome Forktail actually puts mud in his nest?
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: Skimmer bobbed his head.
        - id: ch02-b17
          speaker: skimmer
          text: >-
            He certainly does. In that way, he's rather like Welcome Robin. I was going to say—
    - id: ch03
      title: The Robber in the Apple Tree
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Johnny Chuck never learned what Skimmer had been about to say. At that very moment, Skimmer happened to glance upward. For one instant he sat perfectly still, frozen with horror. Then he gave a shriek and shot out into the air.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Mrs. Skimmer had been sitting on her eggs inside the hollow tree all this time. The instant she heard her husband, she darted through the doorway, shrieking too. At first Johnny couldn't imagine what had frightened them.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Then he heard a faint rustle and looked toward a fork in the tree just above the entrance to Skimmer's home. Mr. Blacksnake was there, partly wound around a branch. His head swayed from side to side. His eyes glittered, and his forked tongue flicked in and out while he tried to peer down into the nest.
        - id: ch03-b04
          speaker: narrator
          text: >-
            It seemed to Johnny that every bird in the Old Orchard arrived within a minute. The air filled with shrieks and screams. One bird after another darted toward Mr. Blacksnake, only to lose courage at the final moment and turn away.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Poor Skimmer and his little wife were frantic. They did everything they could to pull the snake's attention away from the nest. Again and again they flew almost into his face, then escaped before he could strike.
        - id: ch03-b06
          speaker: narrator
          text: >-
            But Mr. Blacksnake knew the birds couldn't hurt him. He also knew there were eggs in that hollow. He liked eggs better than almost anything, except perhaps a meal of baby birds. He hissed angrily two or three times, but otherwise ignored Skimmer and all his friends. Slowly, he crept closer to the nest entrance.
    - id: ch04
      title: The Birds Fight Back
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At last Mr. Blacksnake reached a place where he could push his head through the doorway. As he leaned toward the hole, Skimmer and Mrs. Skimmer each gave a small cry. They had lost all hope.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The snake's head had barely vanished into the old apple tree when Scrapper the Kingbird struck him with all his might. Mr. Blacksnake jerked his head out at once. Hissing fiercely, he lashed out at the birds nearest him.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The same thing happened several times. Whenever Mr. Blacksnake put his head into the hollow, Scrapper or another friend braver than the rest swept in and pecked him viciously. All around them, the birds kept up the kind of screaming only excited feathered folk can make.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Johnny Chuck was every bit as excited as his feathered friends. He watched the hated black robber so closely that he saw nothing else. Then, without warning, a footstep sounded just behind him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Johnny turned his head and found himself looking straight into the eyes of Farmer Brown's boy. In a panic, Johnny dived headfirst down his hole.
    - id: ch05
      title: Farmer Brown's Boy to the Rescue
      blocks:
        - id: ch05-b01
          speaker: farmer_browns_boy
          text: Ha! I thought that was the trouble!
        - id: ch05-b02
          speaker: narrator
          text: >-
            Farmer Brown's boy held a long switch. Just as Mr. Blacksnake put his head through the doorway again, determined to get the eggs this time, the boy struck him with it.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The feel of that switch and the sound of the boy's voice changed the snake's mind in an instant. Mr. Blacksnake let go of the tree and dropped. The moment he touched the ground, he sped like a shot toward the safety of the old stone wall, with Farmer Brown's boy running after him.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Farmer Brown's boy wasn't trying to kill Mr. Blacksnake. He only wanted to frighten him so badly that he wouldn't hurry back to the Old Orchard. And that was exactly what he managed to do.
        - id: ch05-b05
          speaker: narrator
          text: >-
            As soon as Mr. Blacksnake disappeared, every bird began to rejoice. From the sound of them, anyone might have thought the birds had saved Mr. and Mrs. Skimmer's eggs themselves, instead of Farmer Brown's boy.
        - id: ch05-b06
          speaker: narrator
          text: Listening to all that celebration, Johnny Chuck simply had to smile.
