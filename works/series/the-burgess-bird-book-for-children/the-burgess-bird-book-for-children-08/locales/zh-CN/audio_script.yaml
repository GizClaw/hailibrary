audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 细亮有穿透力
        pace: 快速紧凑
        pitch: 高音
    pewee:
      display_name: 皮威林霸鹟
      tts:
        delivery: 温和友善，快活中带着天然的哀婉腔调
        timbre: 柔和清亮
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第八章　旧衣服与老房子
      blocks:
        - id: ch01-b01
          speaker: jenny_wren
          text: >-
            兔子彼得，我现在可不能再陪你聊啦。明天一大早，趁我出去吃早饭的时候，你到这儿来。我会告诉你，冠冠霸鹟要蛇族脱下来的旧衣服做什么。说“做什么”才对，不该问“为什么”。怎么会有谁愿意碰跟蛇有关的东西，我真是怎么也想不通。
        - id: ch01-b02
          speaker: narrator
          text: >-
            珍妮说完，转身钻进了家。彼得再也没什么可做，只好又往亲爱的老荆棘丛走。可绿森林就在老果园那一头，他到底没能抵住诱惑，还是绕了过去。他非看看那里有没有新鲜事不可。刚到林边，一个哀婉的声音便传了过来。
        - id: ch01-b03
          speaker: pewee
          text: 皮威！皮威！皮威！
        - id: ch01-b04
          speaker: narrator
          text: 彼得一听就乐了。
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            哎呀，是皮威！他在霸鹟家族里通常来得最晚，我还以为现在见不到他呢。是什么让他这么早就到了？
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得跟着声音，很快找到了皮威。只见皮威从一根枯枝上飞出去，在空中兜了个小圈，又恰好落回起飞的地方。霸鹟家族捕捉苍蝇时，都会这么飞。那根枯枝在绿森林一处幽暗又有些孤单的地方。皮威才落稳，几乎立刻又用那略带忧伤的声音叫了起来。
        - id: ch01-b07
          speaker: pewee
          text: 皮威！皮威！皮威！
        - id: ch01-b08
          speaker: narrator
          text: >-
            可彼得很清楚，皮威一点也不伤心。这种哀婉的叫声，恰恰是在说他有多快活。皮威比表亲切贝克稍大，模样却很相像。他的尾巴末端有个小缺口，嘴的上半部是黑色，下半部颜色浅淡。两边翅膀各有两道发白的横纹，而且翅膀比尾巴还长，这一点跟切贝克并不一样。不过，没有谁会把皮威认成他的哪位亲戚。道理再简单不过，他总把自己的名字一遍遍叫个不停。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 你今年是不是来得挺早？
        - id: ch01-b10
          speaker: narrator
          text: 皮威点了点头。
        - id: ch01-b11
          speaker: pewee
          text: >-
            是啊。今年春天特别暖和，我就稍微赶了赶路，跟斗士和冠冠两位表亲一起来了。我平常可不这么做。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 请问，大家为什么叫你林中皮威呢？
        - id: ch01-b13
          speaker: narrator
          text: 皮威快活地轻声笑了。
        - id: ch01-b14
          speaker: pewee
          text: >-
            大概因为我太喜欢绿森林了吧。这里安安静静，叫人觉得很自在，我最喜欢了。皮威太太和我都不爱热闹，住得太近的邻居，我们可不想要那么多。
        - id: ch01-b15
          speaker: narrator
          text: 彼得准备再次动身回亲爱的老荆棘丛，临走又问了一句。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 那我偶尔来看看你，你不会介意吧？
        - id: ch01-b17
          speaker: pewee
          text: 你想来多少次都行。来得越勤，我越欢迎。
        - id: ch01-b18
          speaker: narrator
          text: >-
            回到老荆棘丛，彼得把自己从霸鹟家族那里听来的事情，仔仔细细想了一遍。霸鹟们一天到晚捕捉各种飞虫，而那些昆虫最爱毁坏树木和其他正在生长的草木。彼得忽然明白，霸鹟家族帮着自然老妈妈照料这些植物，用处一定大得很。
        - id: ch01-b19
          speaker: narrator
          text: >-
            可他想得最多的，还是冠冠那个古怪的请求。整整一天，他足有十几次往老木头底下张望，盼着找到黑蛇先生脱掉的旧外套。冠冠想要这种东西，实在太奇怪了。彼得好奇得一刻也安生不下来。第二天早晨，快活的太阳先生还没踢掉身上的被子，他已经赶到了老果园。
        - id: ch01-b20
          speaker: narrator
          text: >-
            珍妮果然没有食言。她用自己那副忙忙乱乱的样子，扑到这边，又跳去那边，一面找早饭，一面说个不停。珍妮的舌头呀，就算她真想让它歇一会儿，恐怕也做不到。
        - id: ch01-b21
          speaker: jenny_wren
          text: 你找到蛇族的旧衣服了吗？
        - id: ch01-b22
          speaker: narrator
          text: 彼得摇摇头。珍妮根本不等他回答，也没给他留下开口的工夫，嘴里的话已经一股脑儿涌了出来。
        - id: ch01-b23
          speaker: jenny_wren
          text: >-
            冠冠和太太呀，非得在巢里放一片蛇皮不可。天知道他们为什么想要那东西！可他们偏偏就是想要，没有蛇皮，就好像连家也安顿不下来。也许他们觉得蛇皮能把强盗吓跑吧。换成我，只要想到自己得坐在那种东西上，每回进巢都准会冷得浑身打战。冠冠夫妇长得确实漂亮，这一点我承认。他们挑房子也很有眼光。照我看，比家族里的任何其他成员都聪明。可是蛇皮！呃！
          emotion: disgusted
        - id: ch01-b24
          speaker: peter_rabbit
          text: 对了，冠冠在哪儿筑巢？
        - id: ch01-b25
          speaker: jenny_wren
          text: 在树洞里呀，跟我们这些明白人一样。
        - id: ch01-b26
          speaker: narrator
          text: 彼得吃了一惊，脸上也明明白白地露了出来。
        - id: ch01-b27
          speaker: peter_rabbit
          text: 那个树洞是冠冠自己凿的吗？
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            天哪，当然不是！彼得，你的眼睛长到哪儿去了？哪只霸鹟的嘴看着像能凿木头？
        - id: ch01-b29
          speaker: narrator
          text: 珍妮不等彼得开口，又噼里啪啦地往下说。
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            啄木鸟一家那么喜欢造新房子，可帮了我们许多鸟的大忙。你看！绒啄木鸟这会儿就忙着造一座新房子呢。好极了，我就爱看这个。因为这说明到了明年，老果园里又会多出一座房子，可以让别的鸟来住。
        - id: ch01-b31
          speaker: jenny_wren
          text: >-
            我自己还是更喜欢老房子。我留意过，好些邻居也跟我一样。老房子自有一股安稳劲儿，不会像新房子那么招眼。只要墙壁还算结实，风吹不进来，雨也漏不进来，房子越老，我住着越满意。啄木鸟却似乎最偏爱新房子。就像我刚才说的，这对我们其他鸟可太好啦。
        - id: ch01-b32
          speaker: peter_rabbit
          text: 那么，除了你、冠冠和恶霸英国麻雀，还有谁住啄木鸟留下的老房子？
        - id: ch01-b33
          speaker: jenny_wren
          text: 讨喜蓝知更鸟呀，笨蛋！
          emotion: angry
        - id: ch01-b34
          speaker: narrator
          text: 彼得咧嘴一笑，显得有点难为情。
        - id: ch01-b35
          speaker: peter_rabbit
          text: 对呀，我怎么把讨喜忘了。
        - id: ch01-b36
          speaker: jenny_wren
          text: 还有掠水树燕。
        - id: ch01-b37
          speaker: peter_rabbit
          text: >-
            没错，我早该想起他。我发现他年年都喜欢住同一座房子。还有别的鸟吗？
        - id: ch01-b38
          speaker: narrator
          text: 珍妮又点了点头。
        - id: ch01-b39
          speaker: jenny_wren
          text: >-
            听说喳喳䴓也住老房子，不过他通常会到北方去筑巢。山雀汤米有时住老房子，有时他和山雀太太又挑剔起来，索性替自己造一座。黄翅扑翅鴷其实也是啄木鸟。他常常住老房子，不过也时常另造一座新的。再往下数，还有杀手雀鹰和幽灵鸣角鸮。
        - id: ch01-b40
          speaker: narrator
          text: 彼得听得瞪大了眼睛。他原先压根没想到，那两只鸟也会住进树洞。
        - id: ch01-b41
          speaker: peter_rabbit
          text: 我还以为他们根本不会在树洞里筑巢呢！
          emotion: surprised
        - id: ch01-b42
          speaker: jenny_wren
          text: >-
            他们当然会，真叫人遗憾！要是他们根本不筑巢，我们其他鸟才省心呢。可他们偏偏要筑。黄翅扑翅鴷住过的老房子，他们两个谁住都合适。杀手总要挑一座高高的房子，还会一年又一年回来住。幽灵可不讲究，只要屋子够大，住着舒服就成。他差不多一年到头都住在那里。
          emotion: angry
        - id: ch01-b43
          speaker: jenny_wren
          text: 好了，我得回去照看那些蛋。一个早晨说这么多，已经够啦。
        - id: ch01-b44
          speaker: peter_rabbit
          text: 噢，珍妮！
        - id: ch01-b45
          speaker: narrator
          text: 彼得忽然想到一件事。珍妮停下来，不耐烦地猛甩了一下尾巴。
        - id: ch01-b46
          speaker: jenny_wren
          text: 好吧，这回又是什么事？
        - id: ch01-b47
          speaker: peter_rabbit
          text: 你有两个家吗？
        - id: ch01-b48
          speaker: jenny_wren
          text: 天哪，当然没有！我要两个家做什么？照料一个家就够我忙的啦。
        - id: ch01-b49
          speaker: peter_rabbit
          text: >-
            那鹪鹩先生为什么整天往另一棵树的洞里搬树枝和干草？照我看，他搬进去的材料，都够造两三个巢了。
        - id: ch01-b50
          speaker: narrator
          text: 彼得得意扬扬地问完，珍妮却两眼闪着笑意，轻轻笑出了声。
        - id: ch01-b51
          speaker: jenny_wren
          text: >-
            鹪鹩先生就是一刻也不能闲着，真拿他没办法。他身上连一根懒惰的羽毛也没有。造那座巢，不过是给自己找点事情做，打发时间，也免得惹出什么麻烦。再说，他把那个树洞填满，别人就占不走了。你也知道，说不定什么时候，我们还会想搬家呢。再见啦，彼得。
        - id: ch01-b52
          speaker: narrator
          text: 珍妮最后猛甩一下尾巴，飞到自家那扇圆圆的小门前，一头钻了进去。
