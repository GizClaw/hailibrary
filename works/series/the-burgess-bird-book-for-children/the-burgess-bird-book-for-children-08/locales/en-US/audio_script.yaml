audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, playful, and quick
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, sharp, and affectionate
        timbre: small and crisp
        pace: quick
        pitch: high
    pewee:
      display_name: Pewee
      tts:
        delivery: gentle, cheerful, and retiring
        timbre: soft and plaintive
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Plaintive Voice in the Green Forest
      blocks:
        - id: ch01-b01
          speaker: jenny_wren
          text: >-
            I can't talk any longer now, Peter Rabbit. Come back bright and early tomorrow morning, while I'm out getting breakfast. Then I'll tell you about Cresty the Flycatcher and what he wants with the old clothes the Snake family has cast off. I should say what he wants, not why. I can't understand why anyone would want anything to do with Snakes.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Jenny Wren disappeared into her house. There was nothing for Peter to do but start once more for the dear Old Briar-patch. Yet on his way, he couldn't resist running over to the Green Forest beyond the Old Orchard. He just had to see whether anything new was happening there.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He had barely reached the forest when a plaintive voice called, “Pee-wee! Pee-wee! Pee-wee!” Peter chuckled happily.
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            Why, that's Pee-wee! He's usually one of the last Flycatchers to arrive. I didn't expect him yet. What could have brought him north so early?
        - id: ch01-b05
          speaker: narrator
          text: >-
            It didn't take Peter long to find Pewee. He only had to follow that voice. Soon he saw the bird dart from a dead twig and make a small circle through the air. It was the same kind of circle the other Flycatchers make while hunting flies. Pewee finished exactly where he had begun, back on the dead twig. This was a shady and rather lonely part of the Green Forest.
        - id: ch01-b06
          speaker: pewee
          text: Pee-wee! Pee-wee! Pee-wee!
        - id: ch01-b07
          speaker: narrator
          text: >-
            Almost at once, Pewee called his name in that plaintive way again. He sounded sad, but Peter knew he wasn't sad at all. That was simply how Pewee showed how happy he felt. He was a little bigger than his cousin Chebec, though the two looked much alike. A small notch marked the end of Pewee's tail. The upper half of his bill was black, while the lower half was light. Peter could see two whitish bars on each wing. He also noticed that Pewee's wings were longer than his tail, unlike Chebec's. But no one could truly mistake Pewee for any relative. He gave himself away by repeating his own name over and over.
        - id: ch01-b08
          speaker: peter_rabbit
          text: You're here early, aren't you?
        - id: ch01-b09
          speaker: narrator
          text: Pewee nodded.
        - id: ch01-b10
          speaker: pewee
          text: >-
            Yes. This spring has been unusually warm, so I hurried a little and arrived with my cousins Scrapper and Cresty. I don't often do that.
        - id: ch01-b11
          speaker: peter_rabbit
          text: If you please, why does everyone call you Wood Pewee?
        - id: ch01-b12
          speaker: narrator
          text: Pewee gave a happy chuckle.
        - id: ch01-b13
          speaker: pewee
          text: >-
            It must be because I love the Green Forest so much. It's quiet and restful here. Mrs. Pewee and I like to keep to ourselves, without too many close neighbors.
        - id: ch01-b14
          speaker: narrator
          text: Peter prepared to leave for the dear Old Briar-patch.
        - id: ch01-b15
          speaker: peter_rabbit
          text: You won't mind if I visit you now and then, will you?
        - id: ch01-b16
          speaker: pewee
          text: Come whenever you like. The more often, the better.
    - id: ch02
      title: Peter's Curious Search
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Back in the Old Briar-patch, Peter thought over everything he had learned about the Flycatcher family. He remembered how they were forever catching every sort of flying insect. Then a new thought suddenly came to him. These little birds must be very useful helpers. By catching those insects, they helped Old Mother Nature care for her trees and all the other growing things that insects so dearly loved to destroy.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Most of all, Peter kept thinking about Cresty's strange request. A dozen times that day, he caught himself peeping beneath old logs. Each time he hoped to find a coat Mr. Black Snake had cast off. It seemed such a funny thing for Cresty to ask for. Peter's curiosity simply wouldn't let him rest.
        - id: ch02-b03
          speaker: narrator
          text: >-
            So the next morning, Peter was up in the Old Orchard very early. He arrived before jolly Mr. Sun had even kicked off his bedclothes. Jenny Wren was as good as her word. While she searched for breakfast, she flitted and hopped this way and that in her usual fussy manner. All the while, she talked. Jenny couldn't have kept her tongue still even if she had wanted to.
        - id: ch02-b04
          speaker: jenny_wren
          text: Did you find any old Snake clothes?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Peter shook his head. Jenny went straight on without waiting for an answer.
        - id: ch02-b06
          speaker: jenny_wren
          text: >-
            Cresty and his wife insist on putting a piece of Snake skin in their nest. Goodness knows why! But they simply won't settle down to housekeeping without it. Maybe they think it frightens robbers away. If I had to sit on such a thing, I'd shiver every time I entered my nest. Cresty and his wife are a handsome pair, I'll admit. And they show more sense about choosing a house than any other Flycatchers, if you ask me. But Snake skins? Ugh!
          emotion: disgusted
        - id: ch02-b07
          speaker: peter_rabbit
          text: By the way, where does Cresty build his nest?
        - id: ch02-b08
          speaker: jenny_wren
          text: In a hole in a tree, like the rest of us sensible birds.
        - id: ch02-b09
          speaker: narrator
          text: Peter looked every bit as surprised as he felt.
        - id: ch02-b10
          speaker: peter_rabbit
          text: Does Cresty make the hole himself?
        - id: ch02-b11
          speaker: jenny_wren
          text: >-
            Goodness gracious, no! Where are your eyes, Peter? Have you ever seen a Flycatcher with a bill that could cut wood?
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: Jenny didn't wait for Peter to answer.
    - id: ch03
      title: The Old Houses of the Orchard
      blocks:
        - id: ch03-b01
          speaker: jenny_wren
          text: >-
            It's a good thing for many of us that the Woodpecker family loves new houses. Look at Downy the Woodpecker. He's working on a new one this very minute. I like seeing that, because next year someone else will have one more house here in the Old Orchard.
        - id: ch03-b02
          speaker: jenny_wren
          text: >-
            I prefer old houses myself, and I've noticed that several of my neighbors feel the same way. There's something settled about an old house. It doesn't draw attention the way a brand-new one does. As long as the walls are in reasonably good condition, and neither the rain nor the wind can get inside, the older it is, the better it suits me. The Woodpeckers seem to like new houses best. As I said before, that's a very good thing for the rest of us.
        - id: ch03-b03
          speaker: peter_rabbit
          text: >-
            Who uses those old Woodpecker houses besides you, Cresty, and Bully the English Sparrow?
        - id: ch03-b04
          speaker: jenny_wren
          text: Winsome Bluebird, stupid!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: Peter grinned and looked foolish.
        - id: ch03-b06
          speaker: peter_rabbit
          text: Of course. I completely forgot Winsome.
        - id: ch03-b07
          speaker: jenny_wren
          text: And Skimmer the Tree Swallow.
        - id: ch03-b08
          speaker: peter_rabbit
          text: >-
            That's right. I should have remembered him too. I've noticed that he likes using the same house year after year. Is there anyone else?
        - id: ch03-b09
          speaker: narrator
          text: Jenny nodded again.
        - id: ch03-b10
          speaker: jenny_wren
          text: >-
            I'm told Yank-Yank the Nuthatch uses an old house, though he usually goes north to nest. Tommy Tit the Chickadee sometimes takes one too. Other times, he and Mrs. Chickadee get fussy and build their own. Yellow Wing the Flicker is really a Woodpecker. He often moves into an old house, but he often makes a new one instead. Then there are Killy the Sparrow Hawk and Spooky the Screech Owl.
        - id: ch03-b11
          speaker: narrator
          text: Peter stared at her in surprise.
        - id: ch03-b12
          speaker: peter_rabbit
          text: I never thought those two nested in holes in trees!
          emotion: surprised
        - id: ch03-b13
          speaker: jenny_wren
          text: >-
            They certainly do, and I'm sorry to say it! The rest of us would be better off if they didn't nest at all. But they do, and either one is happy with an old house made by Yellow Wing the Flicker. Killy always chooses one high in a tree and returns to it each year. Spooky doesn't care where it is, as long as it's roomy enough. He lives there more or less all year.
          emotion: angry
        - id: ch03-b14
          speaker: jenny_wren
          text: >-
            Now I must get back to my eggs. I've talked quite enough for one morning.
    - id: ch04
      title: Mr. Wren's Extra Nest
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: Oh, Jenny!
        - id: ch04-b02
          speaker: narrator
          text: >-
            A sudden thought had come to Peter. Jenny stopped and jerked her tail impatiently.
        - id: ch04-b03
          speaker: jenny_wren
          text: Well, what is it now?
        - id: ch04-b04
          speaker: peter_rabbit
          text: Do you have two homes?
        - id: ch04-b05
          speaker: jenny_wren
          text: >-
            Goodness gracious, no! What would I do with two homes? One is all I can manage.
          emotion: surprised
        - id: ch04-b06
          speaker: peter_rabbit
          text: >-
            Then why does Mr. Wren spend all day carrying sticks and straw into a hole in another tree? It looks as though he's taken in enough to build two or three nests.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Peter sounded triumphant. Jenny Wren's eyes twinkled, and she laughed softly.
        - id: ch04-b08
          speaker: jenny_wren
          text: >-
            Bless his heart, Mr. Wren simply has to stay busy. There isn't a lazy feather on him. He's making that nest to fill his time and keep himself out of mischief. Besides, if he fills the hollow, no one else can take it. We might decide to move someday. Good-bye, Peter.
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: >-
            Jenny gave her tail one last sharp jerk. Then, without another word, she flew to the little round doorway of her house and popped straight inside.
