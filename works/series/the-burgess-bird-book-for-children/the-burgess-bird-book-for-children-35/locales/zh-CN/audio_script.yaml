audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 好奇朴实，发问时认真又直率
        timbre: 温暖敦实
        pace: 从容
        pitch: 中低音
    skimmer_tree_swallow:
      display_name: 树燕掠影
      tts:
        delivery: 活泼自信，受到质疑时容易着恼
        timbre: 明亮轻盈
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 伶俐健谈，责备时尖锐却不失活泼
        timbre: 清脆灵巧
        pace: 轻快多变
        pitch: 高音
  chapters:
    - id: ch01
      title: 第三十五章　屠夫与嗡嗡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            老果园附近有一棵荆棘树，兔子彼得常从树旁经过，却从没仔细看过。一天早晨，他在树下停下来歇脚，随意往上一望，竟看见了骇人的一幕。树枝的尖刺上牢牢挂着三只大蚱蜢、一只大飞蛾、两条大毛毛虫、一只蜥蜴、一只小老鼠，还有一只年幼的英国麻雀。难怪彼得以为自己在做梦！他怎么也猜不出，这些动物为什么会被钉在长长的尖刺上。眼前的景象让他心里很不舒服，他连忙赶往老果园，满心只想找个人说说这桩又怪又可怕的事。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得一进老果园，就看见土拨鼠约翰尼坐在远处角落的家门前。他跑过去，一口气把刚才看到的事情说完。约翰尼老实承认，自己从没听过这样的怪事。他认定彼得是在不知不觉中做了个梦。
        - id: ch01-b03
          speaker: skimmer_tree_swallow
          text: 你说错了，约翰尼。彼得根本没做梦。
        - id: ch01-b04
          speaker: narrator
          text: >-
            说话的是树燕掠影。他住在约翰尼家门上方的树洞里，刚才正好把彼得的话全听见了。
        - id: ch01-b05
          speaker: johnny_chuck
          text: 既然你这么清楚，那就解释给我们听听吧。
        - id: ch01-b06
          speaker: narrator
          text: 约翰尼的口气有些不高兴。
        - id: ch01-b07
          speaker: skimmer_tree_swallow
          text: >-
            这很简单。彼得碰巧找到了呆头伯劳屠夫的储藏室。那地方确实不大好看，不过食物多的时候，他懂得存下一些，也算很聪明了。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 伯劳屠夫是谁？我以前怎么从没见过他？
        - id: ch01-b09
          speaker: skimmer_tree_swallow
          text: >-
            他刚搬到这一带，你大概一直没留意。我在南方倒常看见他。瞧，他就在那边那棵树的最高处。
        - id: ch01-b10
          speaker: narrator
          text: >-
            彼得和约翰尼兴冲冲地望过去。树顶那只鸟乍看很像嘲鸫莫克，全身只有黑、灰、白三种颜色。等他转过头来，他们便看见他脸侧横着一道黑纹，嘴尖还带着钩。单凭这两处模样，他们就再也不会把他错认成莫克了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            两人正看着，屠夫忽然落进草里，叼起一只蚱蜢。他贴着地面不高的地方，以平稳均匀的姿势飞了好一段，接着猛地向上一冲，又回到两人最初看见他的那根栖木。他在那里吃掉蚱蜢，马上继续守望，寻找下一个猎物。
        - id: ch01-b12
          speaker: skimmer_tree_swallow
          text: >-
            他的眼睛真厉害！起飞以前，他一定早就看见了远处草里的蚱蜢，不然怎么会径直飞过去？他从不胡乱搜寻，白费时间和力气。只要坐在高处耐心守着，发现想要的东西再出手。我常看见他停在电线杆顶上。
        - id: ch01-b13
          speaker: skimmer_tree_swallow
          text: >-
            听说屠夫一来，恶霸英国麻雀就紧张得不得了，因为屠夫最爱吃英国麻雀。彼得，你在树刺上看到的，多半就是恶霸的一个孩子。依我看，屠夫最好把恶霸吓出老果园。那样一来，我们大家都能松口气。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 可他为什么非得把猎物钉在长刺上呢？
        - id: ch01-b15
          speaker: skimmer_tree_swallow
          text: >-
            有两个原因。有时他捉到太多蚱蜢和昆虫，一顿吃不完，就把它们插在刺上存起来。以后要是饿了，又恰好捉不到食物，仍然能好好吃上一餐。
        - id: ch01-b16
          speaker: skimmer_tree_swallow
          text: >-
            至于老鼠、麻雀和那些一口吞不下的东西，他也要钉在刺上，才方便撕碎。他的脚和爪子不够粗壮，按不住猎物，没法直接用带钩的嘴撕开。有时他把猎物挂在篱笆的铁丝刺上，有时也塞进两根树枝的杈口。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 他会杀掉很多鸟吗？
        - id: ch01-b18
          speaker: skimmer_tree_swallow
          text: >-
            不算多，而且他杀掉的鸟大多是英国麻雀。我们其余这些鸟早就学会躲着他了。他平时主要吃昆虫、蠕虫和毛毛虫，不过也很爱吃老鼠，捉到的还真不少。这一点很像杀手雀鹰。他还有一位表亲，叫北方灰伯劳。有时候，那位表亲会在冬天南下，模样跟他很相像。咦，那边又怎么啦？
        - id: ch01-b19
          speaker: narrator
          text: >-
            老果园不远处突然乱了起来。掠影立刻飞去查看，彼得也紧跟过去。他赶到时，恰好看到红松鼠喋喋绕着树干左躲右闪，一会儿藏到这边，一会儿又逃去那边。原来鸟儿们发现他想偷吃一窝幼鸟，正气冲冲地用尖嘴朝他扑去。
        - id: ch01-b20
          speaker: narrator
          text: 彼得看着喋喋的狼狈模样，忍不住轻声笑了。
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            我看，他这是罪有应得。真像我闯进黄胡蜂窝的那一回。我的天，这些鸟可气坏了！
        - id: ch01-b22
          speaker: narrator
          text: >-
            喋喋在树干两边躲来躲去，鸟儿们扯着嗓子尖叫，一次次向他俯冲。终于，他抓住机会，拔腿逃向旧石墙。只有一只鸟追得上他。那小家伙实在太小，几乎只比大昆虫强一点儿。他就是蜂鸟嗡嗡，一直把喋喋赶到了旧石墙边。
        - id: ch01-b23
          speaker: narrator
          text: >-
            没过多久，彼得头顶传来一阵嗡嗡声。他抬头一看，原来是嗡嗡本人落在一根细枝上。他在那里激动地吱吱叫了好一阵，因为他的嗓音原本就只有这么一点儿细小的吱吱声。
        - id: ch01-b24
          speaker: narrator
          text: >-
            彼得常看见嗡嗡从一朵花飞到另一朵花。每到一朵花前，他都能停在半空中一动不动，把长嘴伸进花心，寻找藏在里面的小昆虫，也吸食自己最爱的甜汁。可彼得还是头一次见他这样静静坐着。嗡嗡小得叫人很难相信他也是一只鸟。他背上闪着鲜亮的绿色，翅膀和尾巴呈棕色，微微泛紫，身体下方则是灰白色。
        - id: ch01-b25
          speaker: narrator
          text: >-
            最吸引彼得的，还是嗡嗡的喉咙。那里的羽毛有着奇妙的红宝石色，在阳光下闪闪发亮，真像一颗珠宝。嗡嗡抬起一边翅膀，用针一样细长的嘴梳理下面的羽毛，接着猛冲进空中。他的翅膀扇得太快，彼得完全看不见。眼睛看不见，耳朵却听得清清楚楚。那声音听起来很像蜜蜂在身边嗡嗡飞过，大家才叫他蜂鸟。
        - id: ch01-b26
          speaker: narrator
          text: >-
            几分钟后，嗡嗡飞了回来，这一次嗡嗡太太也跟他一起出现了。她的衣裳跟丈夫很像，只是少了那片美丽的红宝石色喉羽。她只停了一两分钟，就飞向一个怎么看都像苔藓小杯子的东西。那正是他们的巢。
        - id: ch01-b27
          speaker: narrator
          text: >-
            这时，珍妮鹪鹩正好经过。为了喂饱七个宝宝，她已经忙得累坏了，倒也乐意停下来歇一会儿，顺便聊上几句。彼得马上把自己刚刚发现的蜂鸟巢告诉了她。
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            这件事我早就知道啦。我天天在这些树上找吃的，怎么可能不知道邻居住在哪里？彼得，你可得听清楚，那是老果园里最精巧的鸟巢。整座巢都用植物绒毛做成，外面盖着一小片一小片的地衣。那种东西灰灰的，像苔藓，长在树皮上。盖好以后，鸟巢看起来就像树枝上的一个节疤。
        - id: ch01-b29
          speaker: jenny_wren
          text: >-
            喋喋跑到这棵树上，真是犯了大错。嗡嗡虽然小，却谁也不怕。他的嘴又尖，动作又快，谁吃过一次苦头，通常就不敢再来招惹他了。鹰家族里不管哪一位，他都敢冲上去攻击。嗡嗡身上啊，连一根胆小的羽毛也找不到！
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            到了冬天，他会飞去很远的南方吗？他这么小，怎么受得了那么长的旅程？
        - id: ch01-b31
          speaker: jenny_wren
          text: >-
            哼，路再远也难不倒嗡嗡！你根本不用替他那双翅膀操心。他会一直飞到南美洲，那里住着他好多好多亲戚。你真该看看他家的宝宝刚孵出来时有多小，连蜜蜂都比不上。可他们长得快极了，出壳才三个星期，就已经会飞啦。
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            我倒很庆幸，自己不用像蜂鸟太太那样，把食物一点点压进孩子们的喉咙里。
        - id: ch01-b33
          speaker: narrator
          text: 彼得听糊涂了，急忙追问。
        - id: ch01-b34
          speaker: peter_rabbit
          text: 把食物压进他们的喉咙里？这是什么意思？
        - id: ch01-b35
          speaker: jenny_wren
          text: >-
            就是话里的意思呀。嗡嗡太太把嘴一直伸进宝宝的喉咙，再把自己吞下去的食物压出来。我看，幸好那些宝宝的嘴很短。
        - id: ch01-b36
          speaker: peter_rabbit
          text: 他们的嘴真的很短吗？
          emotion: surprised
        - id: ch01-b37
          speaker: narrator
          text: 彼得惊讶得把眼睛睁得滚圆。
        - id: ch01-b38
          speaker: jenny_wren
          text: 刚孵出来的时候很短，不过很快就会长长。
        - id: ch01-b39
          speaker: peter_rabbit
          text: 嗡嗡太太通常有几个宝宝？
        - id: ch01-b40
          speaker: jenny_wren
          text: >-
            只有两个，就两个。那座小巢也只能装下两个。可是我的天哪，彼得，我不能再待在这儿闲聊啦。你根本想不到，照料七个宝宝有多费心！
        - id: ch01-b41
          speaker: narrator
          text: >-
            珍妮猛地一甩尾巴，飞走了。彼得也赶紧跑回去，把自己打听到的蜂鸟嗡嗡的一切，全都告诉了土拨鼠约翰尼。
