audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, skeptical, and slightly gruff
        timbre: sturdy and warm
        pace: moderate
        pitch: medium-low
    skimmer_swallow:
      display_name: Skimmer the Swallow
      tts:
        delivery: knowledgeable, brisk, and matter-of-fact
