  chapters:
    - id: ch01
      title: A Butcher and a Hummer
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A thorn tree grew not far from the Old Orchard. Peter Rabbit passed it often, but he had never paid much attention to it. Then one morning, he stopped beneath it to rest. When he happened to look up, he saw something astonishing.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Three big grasshoppers were fastened to the sharp thorns on one branch. So were a big moth, two big caterpillars, a lizard, a small mouse, and a young English Sparrow. No wonder Peter thought he must be dreaming. He couldn't imagine how all those creatures had come to be stuck on the long thorns.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The sight made Peter uncomfortable. He hurried on to the Old Orchard, bubbling over with the wish to tell someone about the strange and dreadful thing he had found in the thorn tree.
        - id: ch01-b04
          speaker: narrator
          text: >-
            In a far corner of the orchard, Johnny Chuck was sitting on his doorstep. Peter rushed over and told him the whole story. Johnny listened until Peter had finished. Then he said plainly that he had never heard of such a thing. Peter must have dreamed it without knowing, he decided.
        - id: ch01-b05
          speaker: skimmer_swallow
          text: >-
            No, Johnny. Peter wasn't dreaming at all.
        - id: ch01-b06
          speaker: narrator
          text: >-
            It was Skimmer the Swallow. He lived in a hole in the tree just above the entrance to Johnny's home, and he had heard everything Peter said.
        - id: ch01-b07
          speaker: johnny_chuck
          text: >-
            If you know all about it, then go ahead and explain it.
          emotion: angry
        - id: ch01-b08
          speaker: skimmer_swallow
          text: >-
            It's easy enough. Peter found the food store of Butcher the Loggerhead Shrike. I agree that it isn't pleasant to look at. Still, Butcher is clever to save food while there's plenty to catch.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            But who is Butcher the Shrike? I've never met him before.
        - id: ch01-b10
          speaker: skimmer_swallow
          text: >-
            He's new around here, so you probably haven't noticed him. I've often seen him in the South. Look, there he is now, right at the top of that tree over there.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Peter and Johnny looked eagerly. The bird was perched exactly where Skimmer had pointed. At first, he reminded them of Mocker the Mockingbird. He wore only black, gray, and white. But when he turned his head, they saw a black stripe along the side of his face and a hook at the tip of his bill. Those two things soon made them forget the likeness to Mocker.
        - id: ch01-b12
          speaker: narrator
          text: >-
            As they watched, Butcher flew down into the grass and picked up a grasshopper. Then he flew steadily along, just above the ground. Some distance away, he suddenly rose into the air and returned to the same perch. He ate the grasshopper there and began watching for something else to catch.
        - id: ch01-b13
          speaker: skimmer_swallow
          text: >-
            He certainly has remarkable eyes. He must have spotted that grasshopper in the grass before he took off, because he flew straight to it. Butcher doesn't waste his time and strength searching everywhere. He waits on a high perch until he sees what he wants. I've often seen him watching from the top of a telegraph pole.
        - id: ch01-b14
          speaker: skimmer_swallow
          text: >-
            I hear Bully the English Sparrow has been terribly nervous since Butcher arrived. Butcher is especially fond of English Sparrows. Peter, I suppose the one you found in the thorn tree was one of Bully's children. I hope Butcher frightens Bully away from the Old Orchard. The rest of us would be better off.
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            I still don't understand why Butcher puts the creatures he catches on those long thorns.
        - id: ch01-b16
          speaker: skimmer_swallow
          text: >-
            He does it for two reasons. If he catches more grasshoppers and insects than he can eat, he sticks the extra ones on the thorns. Then, if he gets hungry when there's nothing to catch, he knows where to find a meal.
        - id: ch01-b17
          speaker: skimmer_swallow
          text: >-
            Mice, Sparrows, and other things that are too big to swallow go on the thorns for another reason. Butcher can pull them apart more easily there. His feet and claws aren't big or strong enough to hold his catch while he tears at it with his hooked bill. Sometimes he uses the barbed wire on a fence instead. Sometimes he wedges his catch into the fork between two branches.
        - id: ch01-b18
          speaker: peter_rabbit
          text: Does Butcher kill many birds?
        - id: ch01-b19
          speaker: skimmer_swallow
          text: >-
            Not many, and most of the birds he catches are English Sparrows. The rest of us have learned to stay out of his way. He mostly eats insects, worms, and caterpillars, though he likes mice very much and catches a good many of them. In that way, he's a lot like Killy the Sparrow Hawk.
        - id: ch01-b20
          speaker: skimmer_swallow
          text: >-
            Butcher also has a cousin called the Great Northern Shrike. That cousin sometimes comes down here in winter and looks very much like him. Hello! What's going on now?
        - id: ch01-b21
          speaker: narrator
          text: >-
            A great commotion had started nearby in the Old Orchard. Skimmer flew over at once to find out what was happening, and Peter followed him. Peter arrived just in time to see Chatterer the Red Squirrel dodging around a tree trunk. He rushed from one side to the other, trying to escape the sharp bills of some furious birds. They had caught him attempting to rob a nest of its young.
        - id: ch01-b22
          speaker: narrator
          text: Peter chuckled.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            I guess Chatterer is getting what he deserves. This reminds me of the time I got into a Yellow Jacket's nest. My, those birds are angry!
        - id: ch01-b24
          speaker: narrator
          text: >-
            Chatterer kept dodging around the tree while the birds swooped at him, all of them screaming as loudly as they could. At last, he found his chance and ran for the old stone wall. Only one bird was quick enough to catch him. That bird was so tiny that he hardly seemed bigger than a large insect. It was Hummer the Hummingbird, and he chased Chatterer all the way to the wall.
        - id: ch01-b25
          speaker: narrator
          text: >-
            A moment later, Peter heard a humming sound just above his head. He looked up and saw Hummer himself land on a twig. Hummer stayed there, squeaking excitedly for several minutes. His voice was no more than a tiny squeak.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter had often watched Hummer dart from flower to flower. At each blossom, he could hold himself still in the air while he pushed his long bill deep inside. There he found the tiny insects and sweet juices he loved. But Peter had never seen him sit still before.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Hummer was such a mite that it was hard to believe he was a bird. His back shone bright green. His wings and tail were brownish, with a touch of purple, and he was whitish underneath. But Peter couldn't take his eyes off Hummer's throat. It was a wonderful ruby red, glittering in the sunlight like a jewel.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Hummer raised one wing and used his long, needlelike bill to smooth the feathers beneath it. Then he shot into the air. His wings moved too fast for Peter to see, but Peter could hear them. They beat so quickly that they sounded much like Bumble the Bee. That humming sound is why he is called the Hummingbird.
        - id: ch01-b29
          speaker: narrator
          text: >-
            A few minutes later, Hummer returned with Mrs. Hummer. She was dressed much as he was, except that she had no beautiful ruby throat. She stayed for only a minute or two. Then she darted over to something that looked exactly like a tiny cup made of moss. It was their nest.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Just then, Jenny Wren came by. All the work of feeding her seven babies had worn her out, so she was glad to rest for a few moments and gossip. Peter told her about the tiny nest he had discovered.
        - id: ch01-b31
          speaker: jenny_wren
          text: >-
            I know all about that! You don't think I search these trees for food without learning where my neighbors live, do you? Let me tell you, Peter, that is the daintiest nest in the whole Old Orchard.
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            It's made entirely of soft plant down. On the outside, it's covered with little pieces of the gray, mossy stuff that grows on tree bark. That stuff is called lichen. It makes the nest look just like a knot on the branch.
        - id: ch01-b33
          speaker: jenny_wren
          text: >-
            Chatterer made a big mistake when he came to this tree. Hummer may be tiny, but he isn't afraid of anyone under the sun. His bill is so sharp, and he moves so quickly, that hardly anybody bothers him twice. Why, Hummer will even attack any member of the Hawk family. There isn't one cowardly feather on him.
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            Does he travel very far south in winter? He's so tiny that I don't see how he could manage a very long trip.
        - id: ch01-b35
          speaker: jenny_wren
          text: >-
            Huh! A long distance doesn't trouble Hummer. Those wings can carry him perfectly well. He goes all the way to South America, where he has ever so many relatives.
        - id: ch01-b36
          speaker: jenny_wren
          text: >-
            You should see his babies when they hatch. They're no bigger than bees, but they grow amazingly fast. They can fly only three weeks after hatching. I'm glad I don't have to pump food down my youngsters' throats the way Mrs. Hummingbird does with hers.
        - id: ch01-b37
          speaker: narrator
          text: Peter looked puzzled.
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            What do you mean when you say she pumps food down their throats?
        - id: ch01-b39
          speaker: jenny_wren
          text: >-
            I mean exactly that. Mrs. Hummer puts her bill right down each baby's throat. Then she pumps up the food she has already swallowed. I suppose it's a good thing the babies have short bills.
        - id: ch01-b40
          speaker: peter_rabbit
          text: They really have short bills?
          emotion: surprised
        - id: ch01-b41
          speaker: jenny_wren
          text: >-
            Yes. Their bills are short when they hatch, though they don't stay short for very long.
        - id: ch01-b42
          speaker: peter_rabbit
          text: How many babies does Mrs. Hummer usually have?
        - id: ch01-b43
          speaker: jenny_wren
          text: >-
            Only two. Yes, just two. That's all her nest can hold. Goodness gracious, Peter, I can't stand here gossiping any longer. You have no idea how much work seven babies can be.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Jenny Wren gave her tail a jerk and flew away. Peter hurried back to tell Johnny Chuck everything he had learned about Hummer the Hummingbird.
