audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    melody_wood_thrush:
      display_name: Melody the Wood Thrush
      tts:
        delivery: gentle, modest, and deeply musical
        timbre: rich and flute-like
        pace: unhurried
        pitch: medium
    veery:
      display_name: Veery
      tts:
        delivery: friendly, earnest, and quietly joyful
        timbre: clear and bell-like
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Voices of the Dusk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jolly, round, red Mr. Sun was going to bed behind the Purple Hills. Black Shadows had begun creeping through the Green Forest and out over the Green Meadows. This was the hour Peter Rabbit loved best. He sat at the forest's edge and watched for the first little star to twinkle high in the sky. Peter felt at peace with all the Great World. It was the hour of peace, when the shining day was ending and everyone who had been busy could rest.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Most of Peter's feathered friends had settled down for the night. Their daytime cares were over and forgotten, and the whole Great World seemed hushed. Far away, Sweetvoice the Vesper Sparrow poured out his evening song. Deep in the Green Forest, Whip-poor-will called as though his life depended on saying, “Whip poor Will,” as many times as he could without a breath. Now and then, the sharp, rather harsh cry of Boomer the Nighthawk came from overhead as he hunted his supper in the air.
        - id: ch01-b03
          speaker: narrator
          text: >-
            For a while, those seemed to be the only feathered folk still awake. Peter couldn't help thinking that everyone who went to bed early missed the loveliest hour of the day. Then a song poured from a tree just behind him. It was so clear and sweet, and it suited that peaceful hour so perfectly, that Peter held his breath until it ended. He knew and loved the singer. It was Melody the Wood Thrush.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter hopped over to Melody's tree when the song was done. There was still enough light to see him near the top. Melody sat with his head tipped back. His soft, full throat throbbed as the flute-like notes flowed out. He was a little smaller than Welcome Robin. His coat was a lovely reddish brown, though not as bright as Brownie the Thrasher's. Underneath, he was white, with large black spots scattered thickly over his breast and sides.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Melody sang as if he wanted to pour all the joy of life into those notes. As Peter listened, a wonderful peace and pure happiness slowly came over him. He wouldn't have interrupted that song for anything in the world.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The Black Shadows reached far across the Green Meadows. Soon it was so dusky among the trees that Peter could barely see the singer above him. Still Melody sang, and the evening hush grew deeper. It seemed as though all the Great World were holding its breath to listen.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Several little stars were twinkling high above before Melody finally stopped and sought the safety of his hidden sleeping perch. Peter felt sure there was a nest somewhere nearby. He was just as sure that the nest held eggs, with Melody's little mate sitting on them. Peter believed Melody's love for her was one thing that had made the song so beautiful.
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            I'll run over here early tomorrow morning.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Peter was very good at staying out all night, and that was exactly what he did. Just before jolly, round, red Mr. Sun was ready to kick off his rosy blankets and begin his daily climb through the blue, blue sky, Peter set out for his home in the dear Old Briar-patch. His feathered friends were waking everywhere in the Green Forest, the Old Orchard, and the Green Meadows.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter had quite forgotten his plan to visit Melody. Then those beautiful flute-like notes sounded again and reminded him. He scampered straight back to the place where he had spent such a peaceful hour the evening before. Melody saw Peter at once. He dropped to the ground for a little talk while scratching through the leaves for his breakfast.
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            Oh, Melody, I love hearing you sing! No other song makes me feel the way yours does. It leaves me perfectly content, without a care or worry anywhere.
        - id: ch01-b12
          speaker: melody_wood_thrush
          text: >-
            Thank you, Peter. I'm glad you enjoy it, because singing is what I love most. It's how I let my feelings out. I love all the Great World so much that I simply have to say so. And I don't mean to boast, but everyone in the Thrush family has a good voice.
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            But yours is the finest of them all!
        - id: ch01-b14
          speaker: narrator
          text: >-
            Melody modestly shook his brown head.
        - id: ch01-b15
          speaker: melody_wood_thrush
          text: >-
            I wouldn't say that. My cousin Hermit's song may be even lovelier than mine. And then there's my other cousin, Veery. I think his song is wonderful.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Just then, Peter cared more about satisfying his curiosity than talking about songs.
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            Have you made your nest yet?
        - id: ch01-b18
          speaker: narrator
          text: >-
            Melody nodded.
        - id: ch01-b19
          speaker: melody_wood_thrush
          text: >-
            It's in a little tree close by, and Mrs. Wood Thrush is sitting on five eggs at this very minute. Isn't that just lovely?
        - id: ch01-b20
          speaker: narrator
          text: >-
            Now Peter nodded.
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            What did you use to build it?
        - id: ch01-b22
          speaker: melody_wood_thrush
          text: >-
            Rootlets, tiny twigs, weed stalks, leaves, and mud.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            Mud? Why, Welcome Robin puts mud in his nest too!
          emotion: surprised
        - id: ch01-b24
          speaker: melody_wood_thrush
          text: >-
            Well, Welcome Robin is my own cousin. So that really isn't so surprising.
        - id: ch01-b25
          speaker: peter_rabbit
          text: >-
            Oh, that's right. I'd forgotten he belongs to the Thrush family.
        - id: ch01-b26
          speaker: melody_wood_thrush
          text: >-
            He certainly does, even if his clothes look quite different from ours.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            You spoke about your cousin Hermit. I don't think I've ever met him.
        - id: ch01-b28
          speaker: melody_wood_thrush
          text: >-
            Then it's time you did. He likes to be alone, which is why he's called the Hermit Thrush. He's smaller than I am, and his brown coat isn't as bright. His tail is brighter than the rest of his coat, and his spotted waistcoat looks a good deal like mine. Some people say he's the most beautiful singer in the whole Thrush family. I'm glad you love my song, Peter, but you must hear Hermit. I truly think no song in all the Green Forest is more beautiful.
        - id: ch01-b29
          speaker: peter_rabbit
          text: >-
            Does he make the same kind of nest you do?
        - id: ch01-b30
          speaker: melody_wood_thrush
          text: >-
            No. He builds on the ground, and he doesn't use mud. Now, if you'll excuse me, Peter, I need to finish my breakfast and let Mrs. Wood Thrush come get hers.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Peter continued on his way to the dear Old Briar-patch and spent the whole day there. As evening drew near, he decided to go back and hear Melody sing once more. But just as he came close to the Green Forest, another song reached him from the direction of the Laughing Brook. It made Peter change his mind at once and sent him hurrying toward the brook instead.
        - id: ch01-b32
          speaker: narrator
          text: >-
            This song was very different from Melody's. Still, even if Peter had never heard it before, he would have known that only a member of the Thrush family could sing that way. As he approached the Laughing Brook, the lovely notes seemed to ring through the Green Forest like a bell. Melody's song had filled Peter with peace. This one stirred in him a feeling for the wonderful mystery of life. The very spirit of the Green Forest seemed to live inside it.
        - id: ch01-b33
          speaker: narrator
          text: >-
            It didn't take Peter long to find the singer. It was Veery. He had been given the name Wilson's Thrush, and some people also knew him as the Tawny Thrush.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Veery stopped singing the instant he heard Peter's feet pattering closer. A whistled “Wheeu! Wheeu!” greeted Peter. Then Veery saw there was no one here he needed to fear, and he came from beneath some ferns to meet Peter. He was smaller than Melody, about one-fourth smaller than Welcome Robin. His brown coat was not as bright as Melody's. His breast was faintly spotted with brown, while he was white below. His grayish-white sides had none of the spots that covered Melody's sides.
        - id: ch01-b35
          speaker: peter_rabbit
          text: >-
            I heard you singing, Veery, and I just had to come see you!
        - id: ch01-b36
          speaker: veery
          text: >-
            I hope you like my song. I love to sing at this hour, and I love knowing that others enjoy listening.
        - id: ch01-b37
          speaker: peter_rabbit
          text: >-
            Of course they do! I can't imagine anyone not loving it. I came all this way just to sit and listen for a while. Will you sing some more for me, Veery?
        - id: ch01-b38
          speaker: veery
          text: >-
            I certainly will, Peter. Going to bed wouldn't feel right unless I sang until dark. Evening is one of my favorite times. Singing is the only way I can show how happy I am, how much I love the Green Forest, and how glad I am simply to be home again.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Veery slipped out of sight. Almost at once, his bell-like notes began ringing through the Green Forest again. Peter stayed exactly where he was. He was content simply to listen. Inside himself, he felt all the joy of being alive and happy during the beautiful spring season. It was the very joy Veery expressed so wonderfully in his song.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The Black Shadows grew blacker. One by one, little stars appeared and twinkled down through the treetops. At last, Hooty the Owl's hunting call sounded from deep inside the Green Forest. Only then did Veery's song come to an end.
        - id: ch01-b41
          speaker: veery
          text: >-
            Good night, Peter.
        - id: ch01-b42
          speaker: peter_rabbit
          text: >-
            Good night, Veery.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Peter hopped back toward the Green Meadows for a feast of sweet clover.
