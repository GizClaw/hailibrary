audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    melody:
      display_name: 林鸫旋律
      tts:
        delivery: 温和谦逊，谈起歌唱时真挚而热情
        timbre: 柔润清澈，带有笛声般的圆亮感
        pace: 从容舒展
        pitch: 中高音
    veery:
      display_name: 维里
      tts:
        delivery: 坦率友善，话音里带着归家的喜悦
        timbre: 空灵明净，带有钟声般的回响感
        pace: 舒缓自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三十一章　暮色中的歌声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            快乐的红太阳先生红彤彤、圆滚滚的，正要躲到紫山后面睡觉。黑影已经悄悄爬遍绿森林，又慢慢铺过绿草地。这是兔子彼得一天中最喜欢的时辰。他坐在森林边上，望着高高的天空，等第一颗小星星在那里眨眼。忙了整整一个明亮的白昼，现在是宁静的时辰，也是整个大世界休息的时辰。彼得觉得自己和世上的一切都和睦相安，心里没有一点儿不安。
        - id: ch01-b02
          speaker: narrator
          text: >-
            长羽毛的朋友大多已经安顿下来，准备度过这个夜晚。白天的烦恼和忧虑都过去了，也都被忘了。整个大世界像是忽然安静下来。远处，晚歌雀甜音尽情唱着暮歌，因为这个时候正是他最爱歌唱的时辰。绿森林深处，三声夜鹰威尔不停地喊“鞭打可怜的威尔”，仿佛不换气能喊多少遍，真会关系到他的性命。头顶上，夜鹰轰鸣一边在空中捕捉晚餐，一边偶尔发出尖锐而粗厉的叫声。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得一度以为，只有他们还醒着。他想，早早睡下的鸟儿可错过了一天中最美的时光。就在这时，身后的树上流出一支清澈甜美的歌，和这宁静的时辰再相配不过。彼得屏住呼吸，一直听到歌声结束。他认识这位歌手，也很喜欢他。那是林鸫旋律。
        - id: ch01-b04
          speaker: narrator
          text: >-
            等歌声停下，彼得跳到传来歌声的树下。天色还够亮，他看见旋律坐在靠近树梢的枝头，脑袋向后仰着。每当笛声般的音符从喉咙里涌出来，那柔软丰满的喉咙便轻轻颤动。他比知更鸟威尔科姆略小，披着漂亮的红褐色外衣，只是没有弯嘴嘲鸫褐褐那么鲜亮。腹部洁白，胸口和身体两侧密密麻麻地布满了大大的黑斑。
        - id: ch01-b05
          speaker: narrator
          text: >-
            旋律仿佛要把生命中所有的欢乐都唱进那些音符。宁静和纯粹的幸福悄悄漫过彼得的心。他怎么也舍不得打断。
        - id: ch01-b06
          speaker: narrator
          text: >-
            黑影已经远远越过绿草地，森林里也越来越暗，彼得几乎看不清头顶那位甜美的歌手了。可是旋律还在唱。黄昏更加幽静，整个大世界仿佛都屏住呼吸，生怕漏听一个音符。直到好几颗小星星在高空亮起来，旋律才终于停下，躲进隐蔽安全的栖枝，准备在那里度过夜晚。
        - id: ch01-b07
          speaker: narrator
          text: >-
            彼得相信，附近一定藏着一个鸟巢，巢里也一定有旋律的小伴侣，正伏在那些蛋上。旋律刚才是在用歌声向她诉说自己的爱。这份爱意，一定也是那支歌如此美妙的原因之一。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            明天一早，我就回来看看。
        - id: ch01-b09
          speaker: narrator
          text: >-
            彼得一向喜欢在外面待上一整夜，这一晚他果然也没有回家。快乐的红太阳先生还没踢开玫瑰色的毯子，开始每天在湛蓝天空里的攀登，彼得就动身回亲爱的老蔷薇园。绿森林、老果园和绿草地上，到处都有长羽毛的朋友从睡梦中醒来。彼得早把探望旋律的打算忘得一干二净。直到那笛声般的美妙音符再次传入耳中，他才一下想起来，赶紧跑回昨晚安静地停留了一个小时的地方。
        - id: ch01-b10
          speaker: narrator
          text: >-
            旋律看见彼得，落到地上。他一边翻动落叶寻找早餐，一边陪彼得聊了起来。
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            旋律，我太爱听你唱歌了！再没有别的歌能让我有这样的感觉。听着你的歌，我心里满足极了，什么忧愁烦恼都没了。
          emotion: happy
        - id: ch01-b12
          speaker: melody
          text: >-
            谢谢你。你爱听，我真高兴，因为再没有什么事比唱歌更让我喜欢了。也只有用这种办法，我才能说出心里的感受。我爱整个大世界，这份爱藏也藏不住，非得唱给它听不可。鸫鸟一家都有好嗓子，我这么说可不是为了自夸。
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            可是你唱得最好！
        - id: ch01-b14
          speaker: narrator
          text: >-
            旋律摇了摇褐色的脑袋。
        - id: ch01-b15
          speaker: melody
          text: >-
            我可不敢这样说。我觉得表亲隐士的歌比我的还美。另一位表亲维里也唱得妙极了。
        - id: ch01-b16
          speaker: narrator
          text: >-
            可彼得这时更想知道鸟巢的事。
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            你的巢已经筑好了吗？
        - id: ch01-b18
          speaker: narrator
          text: >-
            旋律点点头。
        - id: ch01-b19
          speaker: melody
          text: >-
            就在附近的一棵小树上。此时此刻，林鸫太太正伏在五枚蛋上呢。多美好的事呀！
          emotion: happy
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            你们用什么东西筑巢？
        - id: ch01-b21
          speaker: melody
          text: >-
            细根、小树枝、草茎、树叶，还有泥巴。
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            泥巴？知更鸟威尔科姆筑巢也用泥巴！
          emotion: surprised
        - id: ch01-b23
          speaker: melody
          text: >-
            威尔科姆本来就是我的亲表亲，这有什么可惊讶的？
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            对呀，我忘了他也是鸫鸟家族的一员。
        - id: ch01-b25
          speaker: melody
          text: >-
            他当然是，只不过衣裳和我们其他成员很不一样。
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            你说的表亲隐士，我好像不认识。
        - id: ch01-b27
          speaker: melody
          text: >-
            那你早就该去认识他了。他很喜欢一个人待着，所以大家才叫他隐士鸫。他比我小，外衣的褐色也没有我的这么鲜亮，可他的尾巴却比外衣鲜艳。那件带斑点的背心倒和我的很像。有些朋友觉得，他才是鸫鸟一家最美的歌手。你喜欢我的歌，我当然很高兴，不过你一定得听隐士唱一回。我真心认为，整个绿森林里都找不到比那更美的歌声。
        - id: ch01-b28
          speaker: peter_rabbit
          text: >-
            他也筑和你一样的巢吗？
        - id: ch01-b29
          speaker: melody
          text: >-
            不一样。他把巢筑在地上，也不用泥巴。好了，请原谅，彼得。我得吃早餐，也该换林鸫太太来吃她的早餐了。
        - id: ch01-b30
          speaker: narrator
          text: >-
            彼得继续走回亲爱的老蔷薇园，在那里待了一整天。傍晚快到时，他决定再去听旋律唱歌。可是才走近绿森林，笑溪那边就传来另一支歌。彼得马上改变主意，匆匆赶往那个方向。这支歌和林鸫旋律的歌完全不同，可就算从前没听过，彼得也会知道，这样的歌只可能出自鸫鸟家族的一副歌喉。
        - id: ch01-b31
          speaker: narrator
          text: >-
            彼得越靠近笑溪，美妙的音符越像钟声一样，一阵阵响彻绿森林。旋律的歌曾让他心中充满安宁，这支歌却让他惊叹生命中那些奇妙而神秘的事。那歌声里回荡着的，正是绿森林的灵魂。
        - id: ch01-b32
          speaker: narrator
          text: >-
            彼得很快找到了歌手。原来是维里。有人叫他威尔逊鸫，也有人叫他黄褐鸫。
        - id: ch01-b33
          speaker: narrator
          text: >-
            彼得的脚步哒哒作响，歌声忽然停了。一声口哨似的“咻呜！咻呜！”迎接了他。维里看清来的是彼得，知道没有什么可怕的，便从一丛蕨叶下走出来问好。维里比旋律小，比知更鸟威尔科姆足足小了四分之一。他穿着褐色外衣，颜色不如表亲旋律鲜亮。胸前只有一些淡淡的褐斑，腹部洁白。灰白色的身体两侧也没有旋律身上那样的斑点。
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            我一听见你的歌，就非得跑来看看你不可！
        - id: ch01-b35
          speaker: veery
          text: >-
            希望你喜欢。我最爱在这个时辰歌唱，也喜欢想到别人愿意听。
        - id: ch01-b36
          speaker: peter_rabbit
          text: >-
            大家当然愿意！谁会不爱听呢？我大老远跑来，就是想坐一会儿，好好听你的歌。维里，你再唱一些给我听，好吗？
        - id: ch01-b37
          speaker: veery
          text: >-
            当然好，彼得。要是不一直唱到天黑，我连上床睡觉都觉得少了点儿什么。一天之中，我最爱的就是傍晚。能够回到这里，回到自己的家，我心里多么幸福。我爱绿森林，也为自己终于回来而欢喜。只有唱歌，我才能把这些心情全都表达出来。
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: >-
            维里闪身藏了起来。几乎就在同时，钟声般的音符再次响遍绿森林。彼得坐在原地，什么也不做，只管静静听着。在这个美丽的春天里，活着，又这样快乐，是多么幸福。维里把这份喜悦唱得那么动人，彼得也在自己心里真真切切地感受到了。
        - id: ch01-b39
          speaker: narrator
          text: >-
            黑影越来越浓。小星星一颗接一颗出现，隔着树梢向下眨眼。最后，猫头鹰胡迪捕猎时的叫声从森林深处传来，维里的歌停了。
        - id: ch01-b40
          speaker: veery
          text: >-
            晚安，彼得。
        - id: ch01-b41
          speaker: peter_rabbit
          text: >-
            晚安，维里。
        - id: ch01-b42
          speaker: narrator
          text: >-
            彼得跳回绿草地，去饱餐一顿甜美的苜蓿。
