audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    dotty_tree_sparrow:
      display_name: Dotty the Tree Sparrow
      tts:
        delivery: cheerful, friendly, and lightly musical
        timbre: small and silvery
        pace: lively
        pitch: high
    slaty_junco:
      display_name: Slaty the Junco
      tts:
        delivery: crisp, confident, and good-humored
        timbre: neat and clear
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Some Merry Seed-Eaters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit had just been reminded of Dotty the Tree Sparrow. At once, he began longing to find this little friend from the cold months. Peter wanted very much to learn how Dotty had fared through the summer.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At first, Peter had no idea where to look. Then he remembered a certain weedy field where bushes had been left growing along the edge. Dotty lived almost entirely on seeds, especially weed seeds. He dearly loved a weedy field with bushes close enough to hide in. Peter decided that was the place to try.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter hurried straight to the field. Sure enough, Dotty was there with a great many friends, and every one of them was busy eating breakfast. Some birds clung to the swaying weed stalks and carefully picked seeds from the tops. Others searched the ground and gathered the seeds that had fallen.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The day was bitterly cold, and rough Brother North Wind was doing his best to blow up another snow cloud. It wasn't the sort of day when Peter expected anyone to be in high spirits. Dotty was cheerful anyway. He was actually singing when Peter approached. All around him, his friends and relatives twittered as happily as though spring, not winter, had just begun.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dotty was almost as big as Little Friend the Song Sparrow, and at first glance the two looked somewhat alike. But Dotty's breast was a clear ashy gray, except for one little dark spot right in the middle. That tiny dot had given him his name. He also wore a chestnut cap almost exactly like Chippy the Chipping Sparrow's. Seeing it reminded Peter that people often called Dotty the Winter Chippy.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            Dotty, welcome back! Seeing you again does my heart good.
          emotion: happy
        - id: ch01-b07
          speaker: dotty_tree_sparrow
          text: >-
            Thank you, Peter. In some ways, it is good to be back. And it surely feels good to know an old friend is happy to see me.
          emotion: happy
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            Will you stay here all winter, Dotty?
        - id: ch01-b09
          speaker: dotty_tree_sparrow
          text: >-
            I hope I can. I will, unless the snow gets so deep that I can't find enough food. These weeds are tall, so it would take a great deal of snow to bury them. As long as their tops stand above the snow, I won't have to worry. Plenty of seeds stay in those tops all winter. But if the snow covers them, I'll have to move farther south.
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            Then I truly hope we don't get much snow. Goodness knows, there are already few enough neighbors around in winter. And I can't think of anyone I'd rather have living nearby than you, Dotty.
        - id: ch01-b11
          speaker: dotty_tree_sparrow
          text: >-
            Thank you again, Peter. I feel the same about you. I enjoy cold weather, and I like winter when there isn't too much ice or too many storms. Cold weather always makes me feel good. That's one reason I travel north to nest.
          emotion: happy
        - id: ch01-b12
          speaker: peter_rabbit
          text: >-
            Since you mentioned nests, do you build yours in a tree?
        - id: ch01-b13
          speaker: dotty_tree_sparrow
          text: >-
            Usually, I build on the ground or close to it. I'm really a ground bird, even though I'm called a Tree Sparrow. Most of us Sparrows spend our time on the ground or not far above it.
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            That's true. You know, I'm very fond of the Sparrow family. I love your cousin Chippy, who nests in the Old Orchard every spring. I wish he stayed through the winter. If you can manage it, I don't see why he can't.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Dotty gave a little tinkling laugh that was delightful to hear.
        - id: ch01-b16
          speaker: dotty_tree_sparrow
          text: >-
            Why, Cousin Chippy would starve! It all depends on food, Peter. You should know that by now. Chippy eats mostly worms and bugs, while I live almost entirely on seeds. That's the difference. He has to go where food is plentiful. I can find plenty here, so I stay.
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            Did you and your relatives make the trip from the Far North by yourselves?
        - id: ch01-b18
          speaker: dotty_tree_sparrow
          text: >-
            No. Slaty the Junco and his relatives traveled with us. We made a very merry party.
        - id: ch01-b19
          speaker: narrator
          text: Peter's ears shot up.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            Is Slaty here now?
        - id: ch01-b21
          speaker: slaty_junco
          text: >-
            I'm right here.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The voice came from directly behind Peter's back. It was so unexpected that Peter jumped. He spun around and found Slaty himself right there, chuckling merrily while he picked up seeds from the ground.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Slaty was nearly Dotty's size, but he looked slimmer and trimmer. In fact, he was one of the neatest-looking birds among all of Peter's friends. There was no mistaking him for any other bird. His head, throat, and breast were a clear slate color. Underneath, he was white. His sides were grayish, his outer tail feathers were white, and his flesh-colored bill looked almost white too.
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            Welcome, Slaty! Are you staying for the whole winter?
          emotion: happy
        - id: ch01-b25
          speaker: slaty_junco
          text: >-
            I certainly am. It would take very bad weather to make me leave. If the snow grows too deep, I'll simply visit Farmer Brown's barnyard. I can always find a meal there. Farmer Brown's boy is my good friend, and I know he won't let me starve, whatever the weather does.
        - id: ch01-b26
          speaker: slaty_junco
          text: >-
            I believe more snow is coming. I like snow. You know, some folks call me the Snowbird.
        - id: ch01-b27
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b28
          speaker: peter_rabbit
          text: >-
            I've heard that, though I think the name truly belongs to Snowflake the Snow Bunting.
        - id: ch01-b29
          speaker: slaty_junco
          text: >-
            You're quite right, Peter. I much prefer my own name, Junco. My, these seeds taste good!
        - id: ch01-b30
          speaker: narrator
          text: >-
            Slaty talked without pausing in his breakfast. All the while, he kept busily picking up seeds from the ground. They were so tiny that Peter couldn't even see what Slaty was finding.
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            If you enjoy it here so much, why not stay all year?
        - id: ch01-b32
          speaker: slaty_junco
          text: >-
            It becomes too warm. I can't stand hot weather. I'll choose cold weather every time.
        - id: ch01-b33
          speaker: peter_rabbit
          text: >-
            Is it really cold all summer where you nest in the Far North?
        - id: ch01-b34
          speaker: slaty_junco
          text: >-
            It isn't exactly cold, but it is much cooler than here. I don't travel as far north as Snowflake does. I go far enough to be comfortable. I can't understand how some folks bear hot weather.
        - id: ch01-b35
          speaker: dotty_tree_sparrow
          text: >-
            It's fortunate they can. Things would never work if everyone liked exactly the same food and weather. Imagine every bird eating nothing but seeds. There wouldn't be enough for us all, and many birds would starve. The worms and bugs would eat everything, too.
        - id: ch01-b36
          speaker: dotty_tree_sparrow
          text: >-
            So it is a very good thing that some birds live mostly on worms, bugs, and food like that. They leave the seeds for the rest of us. I think Old Mother Nature knew just what she was doing when she gave us different tastes.
        - id: ch01-b37
          speaker: narrator
          text: Peter nodded his approval.
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            You can always trust Old Mother Nature to know what's best. By the way, Slaty, where do you put your nest, and what do you build it with?
        - id: ch01-b39
          speaker: slaty_junco
          text: >-
            I usually make it from grass, moss, and little roots. Sometimes I line it with fine grass, and I use long hairs when I can find them. I often put it on the ground, and never very high above the ground. Dotty and I are alike that way.
        - id: ch01-b40
          speaker: slaty_junco
          text: >-
            It always seems easier to hide a nest there than anywhere else. Nothing matters more than keeping a nest well hidden. You need very sharp eyes to find mine, Peter Rabbit.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Just then, Dotty was taking seeds from the top of a weed when he suddenly cried out in alarm. In an instant, there came a quick flutter of many wings. Dotty, all his relatives, and Slaty left the open field together and sought shelter in the bushes along its edge.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Peter sat up very straight. He looked one way, then the other, searching for the danger. At first, he saw nothing suspicious. Then he caught a glimpse of Black Pussy, the cat from Farmer Brown's house. She was crouched flat among the weeds and had been creeping closer, hoping to catch one of those happy little seed-eaters.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Peter stamped one hind foot angrily. Then he set off in long jumps toward the dear Old Briar-patch, lipperty-lipperty-lip. The truth was that, big as Peter was, he felt a little afraid of Black Pussy himself.
