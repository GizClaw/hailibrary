audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    dotty:
      display_name: 树麻雀小黑点
      tts:
        delivery: 快活亲切，说话爽朗而真诚
        timbre: 清脆悦耳
        pace: 轻快
        pitch: 中高音
    slaty:
      display_name: 灯草鹀灰灰
      tts:
        delivery: 利落自信，带着怕热爱冷的爽快劲儿
        timbre: 清亮整洁
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 荒草地里的老朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            䴓喳喳刚提起树麻雀小黑点，兔子彼得就想起了这位寒冬里的小朋友。他忽然特别想找到小黑点，好好问一问，这个夏天他过得怎么样。可是，该去哪里找呢？彼得一时没了主意。想了一会儿，他才记起一片杂草丛生的田野，田边还长着一带灌木。小黑点几乎专吃种子，最爱杂草的种子。荒草地旁边又有灌木可以藏身，他多半就在那里。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得赶到那片田野，果然看见小黑点和一大群朋友。大家正忙着吃早饭。有的紧紧攀住草茎，从顶端的草穗里挑出种子，有的在地上捡散落的种子。天冷得很，粗暴的北风老兄还在使劲儿吹，想再吹来一团雪云。这样的天气，照理说谁也不会有好兴致。小黑点却快活极了，彼得走近时，他甚至还在唱歌。周围的亲友也欢欢喜喜地啾啾叫着，仿佛春天刚刚开始，而不是冬天已经来到。
        - id: ch01-b03
          speaker: narrator
          text: >-
            小黑点差不多和歌雀小歌手一样大，模样也有些相像。不过，他的胸脯是纯净的灰白色，别处没有一点杂色，只有正中央长着一粒深色的小斑点。这一点斑，就是他名字的来历。他头上还戴着一顶栗色小帽，跟栗背短翅雀奇皮的几乎一模一样。这身模样提醒了彼得，大家也常叫他“冬日奇皮”。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 小黑点，欢迎回来！见到你，我心里真痛快。
          emotion: happy
        - id: ch01-b05
          speaker: dotty
          text: >-
            谢谢你，彼得。回来确实挺好。知道老朋友见了我这么高兴，那就更好了。
          emotion: happy
        - id: ch01-b06
          speaker: peter_rabbit
          text: 你准备整个冬天都住在这里吗？
        - id: ch01-b07
          speaker: dotty
          text: >-
            我希望能留下。只要雪别积得太深，让我找不到足够的食物，我就不会走。这些杂草长得很高，要下很大的雪才能把它们完全盖住，那可不容易。草穗只要还露在雪外面，我就不用发愁，因为里面有不少种子会一直留到冬天。可要是雪把草穗也埋住了，我只好继续往南搬。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            那我真希望今年别下太多雪。天知道，冬天留在这里的伙伴本来就少。所有邻居当中，再没有谁比你更叫我喜欢了。
        - id: ch01-b09
          speaker: dotty
          text: >-
            彼得，谢谢你。这句好话我也要送给你。我喜欢冷天，也喜欢冬天，只要冰别结得太厚，天气别坏得太厉害就行。天气一冷，我就精神十足。这也是我去北方筑巢的原因之一。
    - id: ch02
      title: 小黑点为何留在冬天
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: 说到巢，你会把巢筑在树上吗？
        - id: ch02-b02
          speaker: dotty
          text: >-
            我通常把巢筑在地上，或者离地很近的地方。别看我叫树麻雀，其实我是地栖鸟。我们麻雀家族大多数成员，也都喜欢待在地面或靠近地面的地方，很少离开地面太远。
        - id: ch02-b03
          speaker: peter_rabbit
          text: >-
            这个我知道。我非常喜欢麻雀家族。你的表亲奇皮每年春天都在老果园筑巢，我特别喜欢他。要是他也能留下来过冬就好了，我一直想不通他为什么不留下。你既然能在这里过冬，他应该也能才对呀。
        - id: ch02-b04
          speaker: narrator
          text: 小黑点笑了。那笑声像银铃一样清脆，听着真悦耳。
        - id: ch02-b05
          speaker: dotty
          text: >-
            奇皮表亲要是留下，会饿死的。差别全在食物上，彼得，你现在也该明白啦。奇皮表亲主要吃蠕虫和昆虫，我却差不多只吃种子，这就让我们有了不同的去处。他必须飞到能找到充足食物的地方。我留在这里也能吃饱，自然不用走。
        - id: ch02-b06
          speaker: peter_rabbit
          text: 你和亲戚们是独自从遥远的北方飞来的吗？
        - id: ch02-b07
          speaker: dotty
          text: >-
            不是。灯草鹀灰灰和他的亲戚跟我们一道来的。大家一路上热热闹闹，可快活了。
        - id: ch02-b08
          speaker: narrator
          text: 彼得一听，耳朵立刻竖了起来。
        - id: ch02-b09
          speaker: peter_rabbit
          text: 灰灰现在也在这里吗？
        - id: ch02-b10
          speaker: slaty
          text: 当然在。
        - id: ch02-b11
          speaker: narrator
          text: >-
            声音突然从彼得背后传来，彼得一点儿防备也没有，吓得当场跳了起来。他回头一看，灰灰本人正在那里，一边快活地咯咯笑，一边低头捡种子吃。灰灰和小黑点差不多大，身形却更利落。在彼得的朋友里，他算得上最整洁、最精神的一个。更何况，他那身衣裳十分特别，谁也不会把他认成别的鸟。他的头、喉咙和胸脯都是纯净的石板灰色，腹部雪白，两胁灰蒙蒙的，尾巴外侧的羽毛也是白色。肉色的小嘴看上去几乎发白。
    - id: ch03
      title: 爱雪的灰灰
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: 欢迎！欢迎！你也要在这里住上一整个冬天吗？
          emotion: happy
        - id: ch03-b02
          speaker: slaty
          text: >-
            那当然。除非天气坏得实在不像话，不然谁也赶不走我。雪要是太深，我就飞到农夫布朗家的谷场去，那里总能捡到东西，好好吃上一顿。农夫布朗家的男孩是我的好朋友，不管天气多坏，他也不会眼看着我挨饿。我看还会再下些雪。那正合我意，我喜欢雪。你知道，大家有时也叫我“雪鸟”。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 我听过这个叫法。不过，我觉得“雪鸟”这个名字真正该属于雪鹀小雪花。
        - id: ch03-b04
          speaker: slaty
          text: >-
            说得对，彼得，一点儿不错。我还是更喜欢自己原来的名字，灯草鹀。哎呀，这些种子真香！
        - id: ch03-b05
          speaker: narrator
          text: 灰灰一面说，一面不停地啄食。那些种子小得连彼得也看不见。
        - id: ch03-b06
          speaker: peter_rabbit
          text: 你既然这么喜欢这里，为什么不一年到头都留下呢？
        - id: ch03-b07
          speaker: slaty
          text: 这里会变得太热。我最讨厌炎热的天气，什么时候我都宁愿要冷天。
        - id: ch03-b08
          speaker: peter_rabbit
          text: 难道你在遥远的北方筑巢，那里整个夏天都很冷吗？
        - id: ch03-b09
          speaker: slaty
          text: >-
            倒没有真的那么冷，不过比这里凉快多了。我筑巢的地方不像小雪花去得那么北，可也已经够远，住起来正好很舒服。我真不明白，有些伙伴怎么受得了炎热的天气。
        - id: ch03-b10
          speaker: dotty
          text: >-
            幸亏他们受得了。大家要是全喜欢同一种东西，那可糟了。假如所有鸟都只吃种子，种子根本不够分，我们当中许多都会饿死。蠕虫和昆虫也会把一切啃光。所以，有些鸟差不多只吃蠕虫和昆虫，把种子留给我们，实在是件大好事。大自然老妈妈让我们有不同的口味，一定早就把这些都想清楚了。
        - id: ch03-b11
          speaker: narrator
          text: 彼得听得连连点头，还摆出一副很有见识的模样。
        - id: ch03-b12
          speaker: peter_rabbit
          text: >-
            大自然老妈妈总知道怎样最好，信她准没错。对了，灰灰，你用什么筑巢，又把巢安在哪里？
    - id: ch04
      title: 藏得严实的巢
      blocks:
        - id: ch04-b01
          speaker: slaty
          text: >-
            我的巢通常用青草、苔藓和细根筑成。有时里面会再铺上一层细草。要是运气好，能找到长长的毛，我也会捡来铺在里面。我常把巢筑在地面，从来不会离地太高，这一点和小黑点很像。在我看来，地上的巢比筑在别处的都容易藏。巢一定要藏得严严实实，这件事再重要不过了。兔子彼得，我可告诉你，眼睛不够锐利，休想找到我的巢。
        - id: ch04-b02
          speaker: narrator
          text: >-
            就在这时，小黑点正站在一株杂草顶端，从草穗里啄出种子，忽然发出一声警报。无数翅膀立刻扑啦啦飞起。小黑点和他的亲戚，还有灰灰，全躲进田边的灌木丛里。彼得坐得笔直，朝这边看看，又向那边瞧瞧。起初，他什么可疑的东西也没发现。随后，他终于看见农夫布朗家的黑猫咪。她把身子压得低低的，藏在杂草中悄悄向前爬。原来，她正想趁大家吃得开心，捉住一只快活的食籽小鸟。
        - id: ch04-b03
          speaker: narrator
          text: >-
            彼得气愤地跺了跺脚，随即迈开长腿，朝亲爱的老蔷薇丛之家奔去。扑嗒扑嗒，扑嗒扑嗒！说实话，他的个头虽然比那些小鸟大得多，心里却也有点儿怕黑猫咪。
