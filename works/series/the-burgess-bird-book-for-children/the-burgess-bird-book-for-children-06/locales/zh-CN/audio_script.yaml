audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    dear_me_phoebe:
      display_name: 哎呀菲比霸鹟
      tts:
        delivery: 朴实爽快，叫声里略带哀怨
        timbre: 清瘦柔和
        pace: 从容自然
        pitch: 中高音
    chebec:
      display_name: 切贝克小霸鹟
      tts:
        delivery: 自信健谈，带一点得意和诙谐
        timbre: 尖细清脆
        pace: 明快利落
        pitch: 高音
  chapters:
    - id: ch01
      title: 第六章　老朋友有了新家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            每天都有新朋友来到老果园。清晨的鸟鸣声实在太多，彼得有好一阵子没发现，其中少了一位好朋友的声音。这倒也不能怪他。一天大清早，他啪嗒啪嗒地跑过欢笑溪上的小桥，忽然听见一声熟悉的啼叫。
        - id: ch01-b02
          speaker: dear_me_phoebe
          text: 哎呀！哎呀！哎呀！
        - id: ch01-b03
          speaker: narrator
          text: >-
            那声音听着颇有些哀怨。彼得猛地停住，差点儿一头栽过去。一株高高的枯毛蕊花顶上，坐着一个衣着朴素、模样却很利落的小家伙。他只比恶霸英国麻雀大一点点。背上的外衣是暗淡的橄榄褐色，腹部灰白，有几处微微泛黄。他的脑袋颜色很深，嘴巴乌黑，头顶的羽毛只翘起一点点，成了一簇小得不能再小的冠羽。翅膀和尾巴都是暗色的，翅膀上隐约带着几道白纹，尾巴两侧的外缘则是鲜明的白色。那条尾巴直直垂着，像是没有力气抬起来。
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            你好呀，哎呀！你怎么跑到这么远的下面来了？你刚回来以后，我就没再见过你。记得你是在知心蓝鸲回来后不久到的。
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得本想说，自己一直奇怪哎呀去了哪里，可他立刻住了口。他一向诚实，知道自己忙着迎接那么多朋友，根本没想起过哎呀。哎呀是一只东菲比霸鹟。他没马上回答，而是忽地飞上半空。那张黑色小嘴“咔嗒”一响，他兜个小圈，又落回原处。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 你刚才捉到苍蝇了？
        - id: ch01-b07
          speaker: dear_me_phoebe
          text: 哎呀！哎呀！当然捉到了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            哎呀每说一个词，长长的尾巴就摆一下。彼得差点儿以为，他的舌头和尾巴是不是连在一起。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 我明白了。你们一家叫霸鹟，准是因为你们习惯在空中捉苍蝇和小虫。
        - id: ch01-b10
          speaker: narrator
          text: >-
            哎呀点点头，几乎马上又飞到空中。彼得再次听见那张黑色小嘴“咔嗒”一响，接着哎呀便回到了毛蕊花顶上的栖枝。彼得还是想不明白，又问了一遍，他跑到这么远的下面来做什么。
        - id: ch01-b11
          speaker: dear_me_phoebe
          text: 菲比太太和我就住在这下面。我们把家安在这里，喜欢得很。
        - id: ch01-b12
          speaker: narrator
          text: >-
            彼得朝这边看看，又朝那边看看，四面八方全看遍了，脸上的表情滑稽极了。他既没看见菲比太太，也想不出这附近有哪一个地方能让他们筑巢。哎呀瞧着彼得忙活，不知道他究竟在找什么。
        - id: ch01-b13
          speaker: dear_me_phoebe
          text: 彼得，你找什么呢？
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            我在找菲比太太和你们的家呀。我可没听说你们会在地上筑巢，这附近也没有别的地方能安家啊。
        - id: ch01-b15
          speaker: narrator
          text: 哎呀轻声笑了起来。
        - id: ch01-b16
          speaker: dear_me_phoebe
          text: >-
            除了你，我不会告诉别人。不过，我们是多年的老朋友了，这个秘密可以让你知道。菲比太太和我们的家，就在你坐着的那座桥下面。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 我才不信呢！
        - id: ch01-b18
          speaker: narrator
          text: 哎呀从他的口气就听出来了，他并不是真的不信。
        - id: ch01-b19
          speaker: dear_me_phoebe
          text: 你自己去看看，不就知道了？
        - id: ch01-b20
          speaker: narrator
          text: >-
            彼得肚皮贴着桥面趴下来，想把脑袋探过桥边，看看桥底。可他的脖子不够长，也许是他不敢把身子探得那么远。试了好一会儿，他终于放弃了。听了哎呀的建议，他沿岸坡爬下去，一直来到欢笑溪边。哎呀先飞出去捉了另一只苍蝇，接着径直钻到桥下，落在桥面下的一小截石沿上。那里果然有个鸟巢。彼得越过巢沿，还能看见菲比太太的嘴巴和头顶。鸟巢底下是泥巴，外面覆着苔藓，里面铺着柔软的羽毛。
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            这地方真棒！你们怎么想到的？前两三年，你们一直住在农夫布朗家的棚子里，今年为什么搬走了？
        - id: ch01-b22
          speaker: dear_me_phoebe
          text: >-
            我们菲比霸鹟向来喜欢在桥下筑巢。你瞧，这样的地方很安全，我们又喜欢住在水边。有水的地方，总有许多昆虫飞来飞去，要吃饱肚子一点也不难。至于农夫布朗家的棚子，我们非搬不可。去年，那只讨厌的猫发现了鸟巢。为了不让宝宝落进她的爪子，我们吃足了苦头。她现在还没找到这里来，就算找到了，也拿我们没办法。
        - id: ch01-b23
          speaker: peter_rabbit
          text: 我猜你还是跟往常一样，是你们一家最早回来的吧？
        - id: ch01-b24
          speaker: dear_me_phoebe
          text: >-
            那当然，我们总是最先回来。冬天里，菲比太太和我不会像家族里其他成员那样，飞到遥远的南方。他们一直飞到热带，我们不用走那么远，也能找到足够的食物。所以，我们回得比他们早。他们抵达时，我们通常已经安顿下来，开始过小日子了。我的表弟“切贝克”小霸鹟，这时候也该到了。你在老果园里没听见他的消息吗？
        - id: ch01-b25
          speaker: peter_rabbit
          text: >-
            没有。说实话，我根本没留意他。我正要去老果园，这次一定睁大眼睛、竖起耳朵找切贝克。找到了，我就告诉你。再见。
        - id: ch01-b26
          speaker: dear_me_phoebe
          text: 哎呀！哎呀！再见，彼得。哎呀！
        - id: ch01-b27
          speaker: narrator
          text: >-
            彼得向老果园跑去。也许因为一路都在想着切贝克，他刚一到，最先听见的声音里就有切贝克的叫声。那个小家伙一遍又一遍喊着自己的名字，好像永远也听不够。彼得没费多少工夫便找到了他。切贝克坐在苹果树高处一根树枝的梢头，那里视野正好，苍蝇和其他会飞的小虫一出现，他就能瞧见。他的模样和菲比先生十分相像，只是个头更小，任谁看了都会知道他们是表兄弟。
        - id: ch01-b28
          speaker: chebec
          text: 切贝克！切贝克！切贝克！
        - id: ch01-b29
          speaker: narrator
          text: >-
            切贝克每叫一声，尾巴便摆一下。他不时从树枝上飞到空中，咬住一点小得不得了的东西，再回到栖枝上。彼得站在地面仰头望着，连他捉住的是什么都看不见。
        - id: ch01-b30
          speaker: peter_rabbit
          text: 你好呀，切贝克！真高兴你又回来了。今年还在老果园筑巢吗？
        - id: ch01-b31
          speaker: chebec
          text: >-
            当然啦。过去两三年，切贝克太太和我都在这里筑巢，我们从没想过去别处。她现在正忙着选地方。我想自己也该去帮忙，可我早就明白了，彼得，碰上这种事，最好一点意见也别有。等她选中合心意的地方，我再去帮她筑巢。回到老果园真好，我们又能打算一个新家了。这趟路远得吓人，反正我很高兴终于走完了。
        - id: ch01-b32
          speaker: peter_rabbit
          text: 我刚见过你的表亲菲比先生和菲比太太。他们已经有了鸟巢，巢里还有蛋呢。
        - id: ch01-b33
          speaker: chebec
          text: >-
            菲比霸鹟那一支可真古怪。整个家族里，只有他们受得了冷天。我真不明白，冷天气有什么好喜欢的。反正他们就是与众不同，连巢也从不筑在树上，不像我们其他成员那样。
        - id: ch01-b34
          speaker: peter_rabbit
          text: 你是家族里个头最小的吗？
        - id: ch01-b35
          speaker: narrator
          text: 彼得忽然发现，切贝克实在小得很。切贝克点点头。
        - id: ch01-b36
          speaker: chebec
          text: >-
            我就是最小的，所以大家才叫我小霸鹟。我的个头也许最小，可我告诉你，兔子彼得，不管他们谁能捉多少小虫和苍蝇，我捉的一点也不少。
        - id: ch01-b37
          speaker: narrator
          text: >-
            话一说完，切贝克就用行动证明了自己。他飞到空中，小嘴“咔嗒”一合，捉住一只小虫。接着，他敏捷地一转，又落回刚才那根栖枝。他摆着尾巴，再次尖声叫起来。
        - id: ch01-b38
          speaker: chebec
          text: 切贝克！切贝克！切贝克！
        - id: ch01-b39
          speaker: narrator
          text: >-
            切贝克一直尖声叫着，彼得忍不住琢磨，他究竟更爱捉苍蝇，还是更爱听自己的声音。不一会儿，他们俩都听见了切贝克太太的呼唤。声音从老果园中央某个地方传来。
        - id: ch01-b40
          speaker: chebec
          text: >-
            失陪了，彼得，我得马上过去。切贝克太太说，她找到了一个正合心意的筑巢地点。接下来我们可有得忙了。我们筑巢非常讲究。
        - id: ch01-b41
          speaker: peter_rabbit
          text: 你们也像报春知更鸟和菲比霸鹟那样，先用泥巴打底吗？
        - id: ch01-b42
          speaker: chebec
          text: >-
            泥巴？泥巴！我们当然不用！彼得，你得明白，我们对筑巢的材料挑剔得很。我们只用最细的根须、柔软的树皮条、植物纤维，还有蕨类植物上褐色的绒毛。要是找得到，也许再加一点毛发。不是我自夸，我们做出来的巢精巧得很。我们还会把它牢牢固定在杈口里，那杈口得由两三根向上生长的小树枝围成。好了，我必须走了，切贝克太太已经等得不耐烦啦。等我不这么忙的时候，你再来看我吧，彼得。
