audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, playful, and quick
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    dear_me_phoebe:
      display_name: Dear Me the Phoebe
      tts:
        delivery: plainspoken, alert, and friendly
        timbre: light and dry
        pace: brisk
        pitch: medium-high
    chebec:
      display_name: Chebec the Least Flycatcher
      tts:
        delivery: confident, energetic, and matter-of-fact
        timbre: small and sharp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: A Plaintive Voice by the Bridge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            New birds reached the Old Orchard every day. Early each morning, so many voices filled the air that Peter Rabbit did not notice one good friend was missing. Then, very early one morning, something reminded him. Peter was going lipperty-lipperty-lip across a little bridge over the Laughing Brook when he heard a plaintive call.
        - id: ch01-b02
          speaker: dear_me_phoebe
          text: Dear me! Dear me! Dear me!
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter stopped so fast that he nearly tumbled heels over head. On top of a tall, dead mullein stalk sat a trim little fellow, only a little bigger than Bully the English Sparrow. His clothes were sober. His back was dull olive-brown, and underneath he was grayish-white with faint touches of yellow. He had a dark head, a black bill, and the tiniest crest where his head feathers lifted. His dusky wings showed faint white bars, and the outside edges of his dusky tail were clearly white. That tail hung straight down as if he had no strength to lift it.
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            Hello, Dear Me! I'm delighted to see you. What brings you all the way down here? I haven't seen you since you arrived, just after Winsome Bluebird.
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter started to say he had wondered what had happened to Dear Me. Then he caught himself. Peter was honest, and he realized that in all the excitement of welcoming so many friends, he had not missed Dear Me at all. The Phoebe gave no answer right away. He darted into the air, and Peter heard that small black bill snap sharply shut. After making a short circle, Dear Me settled on the mullein stalk again.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Did you catch a fly just then?
        - id: ch01-b07
          speaker: dear_me_phoebe
          text: Dear me! Dear me! Naturally I did.
        - id: ch01-b08
          speaker: narrator
          text: >-
            With every word, Dear Me jerked his long, drooping tail. Peter almost wondered whether the bird's tongue and tail were somehow joined together.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            I suppose your habit of catching flies and bugs in the air is why your family is called the Flycatchers.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Dear Me nodded and almost at once flew out again. Peter heard another click from the little black bill. Then the bird came straight back to the same perch. Peter still wanted an answer to his first question, so he asked once more what Dear Me was doing so far down beside the brook.
        - id: ch01-b11
          speaker: dear_me_phoebe
          text: >-
            Mrs. Phoebe and I live down here now. We made our home here, and we like it very much.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter looked this way, that way, and every way, with the funniest look on his face. He could not see Mrs. Phoebe. He could not see a single place where Mr. and Mrs. Phoebe might build a nest.
        - id: ch01-b13
          speaker: dear_me_phoebe
          text: What are you trying to find?
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            Mrs. Phoebe and your home. I never thought you two would put a nest on the ground, but there doesn't seem to be anywhere else around here.
        - id: ch01-b15
          speaker: narrator
          text: Dear Me chuckled.
        - id: ch01-b16
          speaker: dear_me_phoebe
          text: >-
            I wouldn't tell just anyone, Peter. But we've known each other so long that I'll share our secret. Mrs. Phoebe and our home are right under the bridge you're sitting on.
        - id: ch01-b17
          speaker: peter_rabbit
          text: I don't believe it!
        - id: ch01-b18
          speaker: narrator
          text: Dear Me could tell from Peter's voice that he did not truly mean it.
        - id: ch01-b19
          speaker: dear_me_phoebe
          text: Then take a look for yourself.
    - id: ch02
      title: The Home Under the Bridge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter lay flat on his stomach and tried to stretch his head over the edge of the bridge far enough to see underneath. His neck was not long enough. Or perhaps he was afraid to lean over as far as he really could. At last he gave up. Dear Me suggested another way, so Peter crept carefully down the bank until he stood at the very edge of the Laughing Brook.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Dear Me darted away for another fly. Then he flew beneath the bridge and landed on a small stone ledge just under the floor. There was the nest, exactly as he had said. Above its rim, Peter could see Mrs. Phoebe's bill and the top of her head. Mud formed the base of the nest. Moss covered it, and feathers lined the inside.
        - id: ch02-b03
          speaker: peter_rabbit
          text: >-
            That's splendid! How did you ever think of building there? And why did you leave Farmer Brown's shed after making your home there for the last two or three years?
        - id: ch02-b04
          speaker: narrator
          text: Dear Me returned to his perch on the old mullein stalk.
        - id: ch02-b05
          speaker: dear_me_phoebe
          text: >-
            Oh, we Phoebes have always liked nesting under bridges. A spot like this is quite safe, and we like being near water. Insects are always flying around water, so finding enough food is easy. I left Farmer Brown's shed because that troublesome cat discovered our nest last year. We had a dreadful time keeping our babies out of her claws. She hasn't found us here. Even if she did, she couldn't bother us.
        - id: ch02-b06
          speaker: peter_rabbit
          text: I suppose you were the first one in your family to come back, as usual.
        - id: ch02-b07
          speaker: dear_me_phoebe
          text: >-
            Certainly. We're always first. Mrs. Phoebe and I don't travel as far south for the winter as the others in our family. They go all the way to the Tropics. We manage to find enough food without making such a long trip. That means we return before the others, and by the time they arrive, we have usually begun keeping house. My cousin Chebec the Least Flycatcher ought to be here by now. Haven't you heard anything from him in the Old Orchard?
        - id: ch02-b08
          speaker: peter_rabbit
          text: >-
            No, but honestly, I haven't been looking for him. I'm going to the Old Orchard now, and I'll keep both my eyes and ears open for Chebec. If I find him, I'll let you know. Good-bye!
        - id: ch02-b09
          speaker: dear_me_phoebe
          text: Dear me! Dear me! Good-bye, Peter. Dear me!
        - id: ch02-b10
          speaker: narrator
          text: Peter set off toward the Old Orchard.
    - id: ch03
      title: Chebec in the Old Orchard
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Perhaps Peter was thinking so hard about Chebec that, when he reached the Old Orchard, Chebec's was almost the first voice he heard. The little bird kept calling his own name again and again, as though he loved its sound. Peter soon found him near the tip of a high branch in an apple tree. From there, Chebec could watch for flies and other winged insects.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Chebec looked so much like Mr. Phoebe that anyone could tell they were cousins, though Chebec was smaller. He sat out in the open where he had a clear watch for anything flying past.
        - id: ch03-b03
          speaker: chebec
          text: Chebec! Chebec! Chebec!
        - id: ch03-b04
          speaker: narrator
          text: >-
            His tail jerked with every note. Now and then, he darted into the air and snapped up something so tiny that Peter could not see it at all from the ground below.
        - id: ch03-b05
          speaker: peter_rabbit
          text: >-
            Hello, Chebec! It's good to have you back. Will you build your home in the Old Orchard again this year?
          emotion: happy
        - id: ch03-b06
          speaker: chebec
          text: >-
            Of course. Mrs. Chebec and I have nested here for the past two or three years. We wouldn't consider any other place. She's searching for the right spot now. Perhaps I should be helping, but I learned long ago that with such matters, I'm better off having no opinion at all. Once Mrs. Chebec chooses exactly the place she wants, I'll help her build.
        - id: ch03-b07
          speaker: chebec
          text: >-
            It certainly feels good to be in the Old Orchard again, making plans for a home. Our journey was terribly long, and I'm glad it's finished.
        - id: ch03-b08
          speaker: peter_rabbit
          text: >-
            I just visited your cousins, Mr. and Mrs. Phoebe. Their nest is already built, and they already have eggs.
        - id: ch03-b09
          speaker: chebec
          text: >-
            Those Phoebes are a funny bunch. They're the only ones in our family who can bear cold weather. I can't imagine what they enjoy about it. They're odd in another way, too. They never put their nests in trees as the rest of us do.
        - id: ch03-b10
          speaker: peter_rabbit
          text: >-
            Are you the smallest member of the family?
        - id: ch03-b11
          speaker: narrator
          text: Peter had suddenly noticed what a very little fellow Chebec was. Chebec nodded.
        - id: ch03-b12
          speaker: chebec
          text: >-
            I am the smallest, and that's why I'm called the Least Flycatcher. I may be least in size, Peter Rabbit, but I can catch as many bugs and flies as any of them.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Chebec proved his claim at once. He shot into the air, his little bill snapped shut on an insect, and with one quick turn he was back on his former perch. He jerked his tail and began giving his sharp little call again.
        - id: ch03-b14
          speaker: chebec
          text: Chebec! Chebec! Chebec!
        - id: ch03-b15
          speaker: narrator
          text: >-
            He kept up that sharp little cry until Peter wondered which Chebec liked better, catching flies or hearing his own voice.
    - id: ch04
      title: A Particular Nest Builder
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After a while, both of them heard Mrs. Chebec calling from somewhere in the middle of the Old Orchard.
        - id: ch04-b02
          speaker: chebec
          text: >-
            Excuse me, Peter. I have to go right away. Mrs. Chebec says she has found exactly the place for our nest. Now we have plenty of work ahead, because we're very particular about how a nest is built.
        - id: ch04-b03
          speaker: peter_rabbit
          text: >-
            Do you begin with mud, the way Welcome Robin and your Phoebe cousins do?
        - id: ch04-b04
          speaker: chebec
          text: Mud? Certainly not!
          emotion: disgusted
        - id: ch04-b05
          speaker: chebec
          text: >-
            You should know, Peter, that we choose our nest materials very carefully. We use only the finest little roots, pieces of soft bark, plant fibers, the brown cotton that grows on ferns, and perhaps a little hair if we can find some. We make a dainty nest, even if I do say so myself. Then we fasten it firmly in the fork where two or three small upright branches meet.
        - id: ch04-b06
          speaker: chebec
          text: >-
            I must go now. Mrs. Chebec is growing impatient. Come and visit when I'm not so busy, Peter.
