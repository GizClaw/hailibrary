audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 好奇朴实，发问时认真又直率
        timbre: 温暖敦实
        pace: 从容
        pitch: 中低音
    skimmer_tree_swallow:
      display_name: 树燕掠影
      tts:
        delivery: 活泼自信，受到质疑时容易着恼
        timbre: 明亮轻盈
        pace: 轻快
        pitch: 中高音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 大胆张扬，带着得意的嘲弄
        timbre: 粗哑洪亮
        pace: 稍慢
        pitch: 中低音
    weaver_orchard_oriole:
      display_name: 果园拟鹂织匠
      tts:
        delivery: 敏锐热心，发现线索时果断肯定
        timbre: 圆润清亮
        pace: 明快
        pitch: 中高音
    chebec:
      display_name: 切贝克小霸鹟
      tts:
        delivery: 自信健谈，带一点得意和诙谐
        timbre: 尖细清脆
        pace: 明快利落
        pitch: 高音
    mrs_chebec:
      display_name: 切贝克太太
      tts:
        delivery: 文静务实，悲伤时仍然坚韧
        timbre: 轻柔清澈
        pace: 适中
        pitch: 高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 伶俐健谈，责备时尖锐却不失活泼
        timbre: 清脆灵巧
        pace: 轻快多变
        pitch: 高音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 聪明机警，得意时略显傲慢
        timbre: 清亮锐利
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十七章　又来了几个强盗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            老果园里的羽族都在欢呼。土拨鼠约翰尼听见以后，知道黑蛇先生已经走远，自己可以放心出来了。他正急着告诉树燕掠影，那个强盗还没吃到鸟蛋就被赶跑，自己心里有多高兴。可脑袋刚从家门口探出来，他就听出了不对。欢乐的大合唱中，夹着悲苦的哭声。那是报春知更鸟和知更鸟太太。在老果园里，再没有谁比他们更会把忧愁唱进声音里了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            约翰尼出来得正是时候，恰好看见鸟儿们全往知更鸟的家飞去。方才的欢呼转眼成了怒骂。大家喊着强盗、小偷、坏蛋，那阵势一点儿不比刚发现黑蛇先生企图洗劫掠影夫妇时小。可这次不可能还是黑蛇。布朗家的男孩早把他赶到另一个方向去了。
        - id: ch01-b03
          speaker: johnny_chuck
          text: 这回又出了什么事？
        - id: ch01-b04
          speaker: narrator
          text: 掠影还在跟妻子说着刚才那场惊吓，听约翰尼一问，马上转身。
        - id: ch01-b05
          speaker: skimmer_tree_swallow
          text: 我也不知道。我这就去弄清楚。
        - id: ch01-b06
          speaker: narrator
          text: >-
            掠影像一支箭似的飞走了，约翰尼留在原地耐心等着。远处的议论越来越急，愤怒的叫声也越来越响。只有报春和知更鸟太太没有发怒。他们的声音里只有哀伤，听起来仿佛两颗心都碎了。过了一会儿，掠影飞回来，急着把消息告诉妻子。
        - id: ch01-b07
          speaker: skimmer_tree_swallow
          text: >-
            知更鸟家的蛋全没了！四枚蛋都被打破吃掉了。知更鸟太太刚才离开鸟巢，过来帮我们赶黑蛇，偏偏有人趁那时候偷吃了蛋。老果园里的鸟当时全在这边，谁也没看见小偷。可能是红松鼠喋喋，可能是冠蓝鸦萨米，也可能是拟八哥嘎嘎，或者乌鸦布莱基。不管那家伙是谁，反正他看准鸟巢没人守着，便偷偷溜过去下了手。
        - id: ch01-b08
          speaker: narrator
          text: >-
            话音刚落，绿森林那边便传来一阵满带嘲弄的叫声。
        - id: ch01-b09
          speaker: blacky_crow
          text: 哇——哇——哇！
        - id: ch01-b10
          speaker: narrator
          text: >-
            老果园里安静了一瞬，紧接着又炸开了锅。如今大家心里再没有半点儿疑问，认定偷蛋的就是乌鸦布莱基。那些舌头动得飞快。鸟儿们把能想到的坏话全骂了出来，还纷纷发下吓人的誓，说下次只要在老果园逮住他，一定要好好收拾他。
        - id: ch01-b11
          speaker: blacky_crow
          text: 哇——哇——哇！
        - id: ch01-b12
          speaker: narrator
          text: >-
            布莱基的叫声从远处传来，听起来竟像在夸耀自己干得聪明。至少，他对自己的所作所为没有半点儿后悔。鸟儿们一个个又激动又愤怒，一面围着知更鸟夫妇，想方设法安慰他们，一面气愤地声讨布莱基。过了好一阵，这场声讨大会才散，大伙儿终于各自回家做事。
        - id: ch01-b13
          speaker: narrator
          text: >-
            谁知，他们才刚散开，另一声悲鸣又响了。切贝克夫妇的蛋也不见了！他们去知更鸟家参加声讨大会时，又有一个小偷看准机会，溜进无人看守的鸟巢，把蛋全偷走，然后逃得无影无踪。
        - id: ch01-b14
          speaker: narrator
          text: >-
            鸟儿们当然立刻赶去安慰切贝克夫妇，又把骂布莱基的那些威胁，对这个身份不明的新强盗全说了一遍。这次不会是布莱基，因为他的叫声一直从绿森林边缘传来。大家正激动地争论着是谁干的，果园拟鹂织匠忽然看见，切贝克的鸟巢下方，地上落着一根蓝白相间的羽毛。
        - id: ch01-b15
          speaker: weaver_orchard_oriole
          text: 一定是冠蓝鸦萨米！错不了，就是他！
        - id: ch01-b16
          speaker: narrator
          text: >-
            这根蓝白相间的羽毛把秘密泄露了，所有鸟都相信织匠找到了小偷。斗士王霸鹟领着大家，吵吵嚷嚷地搜遍老果园。可萨米早已没了踪影。他们很快放弃搜寻，谁也不敢离开自己的家太久，生怕那边也出事。知更鸟夫妇还在伤心啼哭，切贝克和他那小巧的妻子却几乎一句话也没说，只默默承受着这场不幸。
        - id: ch01-b17
          speaker: chebec
          text: >-
            不管怎样，也有一件好事。狡猾莎莉那枚蛋跟别的蛋一起没了。我们不用替她把那个麻烦的孤儿养大啦。
        - id: ch01-b18
          speaker: mrs_chebec
          text: >-
            这倒是真的。事情已经挽回不了，再怎么哭也没有用。坐在这里掉眼泪，只会白白浪费时间。走吧，切贝克，我们另找一个地方，再筑一座巢。下一回，我一分钟也不让鸟蛋离开眼睛。
        - id: ch01-b19
          speaker: narrator
          text: >-
            这时候，兔子彼得也赶来了。他恰好在骚乱最厉害时出现，当然非要知道全部经过不可。鹪鹩珍妮那张嘴飞快地动着，简直快要飞起来了，把事情一股脑儿说给他听。
        - id: ch01-b20
          speaker: jenny_wren
          text: 乌鸦布莱基的心跟他的外衣一样黑。他的表亲冠蓝鸦萨米也好不到哪儿去。他们一家子都是强盗。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 等等。布莱基和萨米是表亲？
          emotion: surprised
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            天哪，彼得，你连这都不知道？他们当然是表亲。他们看起来不太相像，却属于同一个家族。布莱基一身黑，做出多坏的事我都不奇怪。可萨米那么漂亮，竟也干这种可怕的事，我真想不通。不过，他没布莱基那么坏，因为他的确做了许多好事。他会吃掉许多毛毛虫和别的害虫，确实帮了不少忙。
        - id: ch01-b23
          speaker: jenny_wren
          text: >-
            再没有谁的眼睛比萨米更尖了。这一点，我得替他说句公道话。只要发现危险，他总会马上警告大家，已经用这个办法救过许多羽族朋友。要不是他有偷我们鸟蛋的坏习惯，我一句坏话都不会说他。就算有这个毛病，他还是比布莱基强。
        - id: ch01-b24
          speaker: jenny_wren
          text: >-
            听说布莱基也会消灭蛴螬和其他害虫，做一点儿好事，可他是个十足的同类相食者。他既爱吃鸟蛋，也爱吃雏鸟。这样闯下的祸，远比他在别处做的那点儿好事大。要我说，布莱基就是大胆、黑心又恶劣。
        - id: ch01-b25
          speaker: narrator
          text: >-
            珍妮忽然想起还有家务，照旧风风火火地钻进屋里。彼得又在附近等了一阵，可谁也不肯抽空跟他说话，于是动身到绿森林去找那里的朋友。没走多远，他就瞥见一道蓝色身影偷偷穿过树木，正想溜走。彼得立刻认了出来。那身蓝衣裳只有冠蓝鸦萨米才有。
        - id: ch01-b26
          speaker: narrator
          text: >-
            彼得抬头看向萨米刚飞走的树。半树高的枝杈里，藏着一座鸟巢。他心想，萨米刚才是在偷那里的蛋，还是那就是萨米自己的家？他立刻撒腿追去，一蹦一跃，能跑多快就跑多快。奔跑时，彼得碰巧回头一看，恰好看见冠蓝鸦太太轻轻落在巢上。这下，他知道自己发现了萨米的家，忍不住边跑边偷笑。
        - id: ch01-b27
          speaker: peter_rabbit
          text: 萨米，我知道你的秘密啦！
        - id: ch01-b28
          speaker: sammy_jay
          text: 那我希望你还有点儿君子风度，肯替我保密。
        - id: ch01-b29
          speaker: narrator
          text: 萨米没好气地嘟囔着，显然很不高兴。彼得却一本正经地点点头。
        - id: ch01-b30
          speaker: peter_rabbit
          text: 当然。我绝不会告诉别人。哎呀，萨米，你长得可真漂亮！
        - id: ch01-b31
          speaker: narrator
          text: >-
            这一夸，萨米马上露出了高兴的神气。他的确有点儿爱漂亮，也确实生得俊美。他只比报春知更鸟大一点儿。背上是灰蓝色，鲜蓝的尾羽横着细细的黑纹，边缘镶着白色。蓝色翅膀也带着黑白横纹。喉咙和胸脯是柔和的灰白色，颈上还围着一圈黑领子。
        - id: ch01-b32
          speaker: narrator
          text: >-
            萨米头顶还戴着一顶尖尖的帽子。这帽子方便得很，他想放下就能放下。一放下来，帽顶便一点儿也不尖了。彼得刚才还在夸他漂亮，这会儿看着看着，却忽然把话锋一转。
        - id: ch01-b33
          speaker: peter_rabbit
          text: 你为什么偷切贝克太太的蛋？
        - id: ch01-b34
          speaker: sammy_jay
          text: >-
            因为我爱吃蛋。谁把蛋留在那里，连个看守的都没有，就该想到蛋会丢。可你怎么知道是我拿的？
        - id: ch01-b35
          speaker: peter_rabbit
          text: 别问了，萨米。是一只小鸟告诉我的。
        - id: ch01-b36
          speaker: narrator
          text: >-
            彼得故意拿“一只小鸟”来逗他。萨米张嘴正要厉声回敬，却忽然看见了危险。方才那句尖刻的话顿时没了。他没有争辩，马上发出一声警告。
        - id: ch01-b37
          speaker: sammy_jay
          text: 快跑，彼得！快跑！红狐雷迪来了！
        - id: ch01-b38
          speaker: narrator
          text: >-
            彼得立刻一头钻进一大堆灌木枝条下面。在那里，红狐雷迪伤不到他。彼得一边等雷迪离开，一边想着刚刚救了自己的萨米。
        - id: ch01-b39
          speaker: peter_rabbit
          text: >-
            真奇怪，那么多好处和那么多坏处，怎么会全混在同一个家伙身上？萨米偷了切贝克的蛋，却又救了我的命。我敢肯定，要是切贝克夫妇或者别的羽族邻居碰上危险，他也一定会出声搭救。况且，春天里能让他偷蛋吃的日子只有短短一阵。总的说来，我猜他做的好事还是比坏事多。反正我愿意这么想。
        - id: ch01-b40
          speaker: narrator
          text: 彼得想得没错。冠蓝鸦萨米做的好事，的确比坏事多。
