audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    mourner_dove:
      display_name: 哀鸽莫纳
      tts:
        delivery: 温和从容，话音里带着轻柔的咕咕声
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中低音
    kitty_catbird:
      display_name: 灰猫嘲鸫咪咪
      tts:
        delivery: 顽皮机灵，话里常带轻松的逗趣
        timbre: 灵活而略带沙哑
        pace: 活泼
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三十四章　哀鸽莫纳与杜鹃
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一条长路从布朗农夫家的院场通向绿草地上的玉米田。一天清早，兔子彼得忽然想沿着这条路跑一趟，看看能遇见什么。路边有片砾石坡，布朗农夫曾从那里挖碎石，铺在自家房子附近的车道上。彼得经过旧石坑时，发现里面有谁正忙个不停。他猛地停住脚，直起身子看了起来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            原来是彼得十分喜爱的老朋友，哀鸽莫纳。他的身子只比知更鸟威尔科姆大一点儿，可脖颈细长，尾巴和翅膀也长，所以看起来大了不少。那副体形让彼得马上想起布朗农夫家养的鸽子。莫纳的背部是灰褐色的，有些地方泛着蓝灰。头顶和头部上方也呈蓝灰色。胸前红里带黄，往下渐渐变成柔和的浅黄褐色。嘴是黑的，脚却是红的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他尾巴正中的两根羽毛最长，颜色和后背一样。其余尾羽呈石板灰，带着窄窄的黑纹，末端镶白。翅膀上散着几处黑斑，两边耳朵下方也各有一块。最美的是细颈两侧的羽毛。阳光没照上去时，那里的颜色很像胸脯。快活的小阳光才一碰到，羽色就不停变幻，这便是虹彩。莫纳的美并不耀眼，却安静而耐看。
        - id: ch01-b04
          speaker: narrator
          text: >-
            不过，彼得盯着莫纳，并不是因为他的模样，而是因为他正在做的事。莫纳在石坑里走来走去，不时啄起一样东西，简直像在吃早饭。可彼得怎么也想不到，那里能有什么好吃的，石坑里连蚯蚓也没有。何况莫纳不爱吃蚯蚓，平时几乎只吃种子和谷粒。彼得糊涂了。好在只要开口就能问清楚，他从来不会独自苦想太久。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 你好啊，莫纳！你到底在里面忙什么？是在吃早饭吗？
        - id: ch01-b06
          speaker: mourner_dove
          text: >-
            当然不是，彼得。我的早饭早就吃完了。现在，我要捡几颗小石子，帮自己消化。
        - id: ch01-b07
          speaker: narrator
          text: 莫纳说着，啄起一颗小石子，咽了下去。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            天下竟有这种事！你一定是疯了，怎么会以为碎石能帮你消化？依我看，它只会把事情弄得更糟。
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: 莫纳轻轻地咕咕笑了几声，那笑声听起来十分悦耳。
        - id: ch01-b10
          speaker: mourner_dove
          text: >-
            你呀，又在拿自己衡量别人了。这是再傻不过的事，你到了今天总该明白了吧。一顿碎石早饭准会让你肚子疼得要命，这一点我完全相信。可你是你，我是我，我们俩差得远呢。
        - id: ch01-b11
          speaker: mourner_dove
          text: >-
            我吃的是谷粒和坚硬的种子，又没有牙齿，只能把它们整个吞下去。我的胃里有一部分叫作砂囊，专门磨碎、碾烂食物，好让身体消化。细小的石子和碎石能帮砂囊研磨食物，自然也就帮助了消化。
        - id: ch01-b12
          speaker: mourner_dove
          text: >-
            今天早晨，这些石子应该够用了。现在该去洗个尘土浴啦。小路那边有一块满是尘土的地方，我每天都去那里洗澡。
        - id: ch01-b13
          speaker: peter_rabbit
          text: 你要是不介意，我跟你一起去。
        - id: ch01-b14
          speaker: narrator
          text: >-
            莫纳当然不介意。彼得跟着他来到长路上那片尘土飞扬的地方，鸽太太也过来跟他们会合。她的衣裳跟莫纳很像，只是脖颈没有他那么美。鸽子夫妇在尘土里翻来扑去，把全身都洗了个痛快，同时跟彼得聊起了天。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 我常看见你待在地上。你的巢是不是也筑在地面上？
        - id: ch01-b16
          speaker: mourner_dove
          text: >-
            不是。鸽太太把巢筑在树上，不过通常离地面不太高。现在请你原谅，我们得回家了。她有两枚蛋要孵。她坐在蛋上时，我喜欢守在附近陪她，也向她说说情话。
        - id: ch01-b17
          speaker: narrator
          text: >-
            鸽子夫妇抖掉羽毛上松散的尘土，飞走了。彼得盯着他们，本想看看两只鸟究竟去哪里，可他们很快消失在几棵树后。于是，彼得跑向老果园。在那里，珍妮鹪鹩和鹪鹩先生仍旧忙得不可开交，一趟趟喂养一天天长大的孩子。珍妮连片刻也不肯停下来闲聊。
        - id: ch01-b18
          speaker: narrator
          text: >-
            彼得刚从鸽子夫妇那里知道了那么多新鲜事，心里装得满满当当，非得找谁说一说不可。恰好，旧石墙边的灌木丛里传来了喵喵声。那是灰猫嘲鸫咪咪。彼得赶忙钻进灌木寻找，才见到老朋友，一开口就讲起哀鸽莫纳。
        - id: ch01-b19
          speaker: kitty_catbird
          text: >-
            这可不算新闻，彼得。莫纳和他的妻子，我全都了解。他们人很好，可我得说，鸽太太是我认识的主妇当中最不会料理家务的一个。你从来没见过她的巢吧？
        - id: ch01-b20
          speaker: peter_rabbit
          text: 没见过。她的巢是什么样子？
        - id: ch01-b21
          speaker: narrator
          text: 咪咪笑了起来。
        - id: ch01-b22
          speaker: kitty_catbird
          text: >-
            那东西简直算不上一个巢，不过是几根小树枝搭起来的，而且少得可怜。我真不明白，它们怎么没有散架。幸好鸽太太每次只下两枚蛋。可就连这两枚蛋居然能一直留在巢里，也够叫我吃惊了。
        - id: ch01-b23
          speaker: kitty_catbird
          text: >-
            听，莫纳又在叫了。他明明那么快活，声音听起来却比谁都悲伤。只听那叫声，你准以为他正伤心，哪会想到他其实高兴得很。我每次听见，心里都觉得难过。
        - id: ch01-b24
          speaker: peter_rabbit
          text: 的确是这样，可我还是喜欢听他的声音。咦，那是谁？
        - id: ch01-b25
          speaker: narrator
          text: >-
            老果园的一棵树上传来一长串清亮的叫声：“阔——阔——阔——阔——阔——阔！”彼得整个春天还没听过这样的声音。
        - id: ch01-b26
          speaker: kitty_catbird
          text: 那是杜鹃。难道你连杜鹃都不认识？
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            我当然认识他，只是一时忘了他的叫声。咪咪，杜鹃太太是不是跟狡猾莎莉牛鹂一样坏，到处把蛋下进别的鸟巢？我听别人这样说过她。
        - id: ch01-b28
          speaker: kitty_catbird
          text: >-
            这话没有半个字是真的。她会自己筑巢，虽说那个巢不怎么样，也会亲自照料孩子。杜鹃一家会背上坏名声，全怪住在大海另一边的几个不中用的表亲。那里正是恶霸英国麻雀的故乡。要是传闻不假，那几个家伙确实跟狡猾莎莉一样坏。怪就怪在，坏名声一旦落到头上，怎么也甩不掉。
        - id: ch01-b29
          speaker: kitty_catbird
          text: >-
            还有人指责杜鹃，说他们会偷我们其他鸟的蛋。我跟他们做了那么多年的邻居，从没见他们干过这种事。真有这回事，我总该知道。我猜，这个坏名声也怪他们自己。他们总是悄无声息地穿来穿去，又尽量躲在看不见的地方。那副偷偷摸摸的样子，就像做了亏心事，生怕被人发现。其实，他们是非常有用的鸟。今年杜鹃夫妇回到老果园，布朗农夫真该高兴坏了。
        - id: ch01-b30
          speaker: peter_rabbit
          text: 为什么？
        - id: ch01-b31
          speaker: kitty_catbird
          text: 你看见那棵树上蛛网似的巢了吗？上面和周围爬满了毛茸茸的毛毛虫。
        - id: ch01-b32
          speaker: narrator
          text: >-
            彼得说自己看见了。他还见过许多一模一样的巢，也注意到那些毛毛虫会把附近的叶子全吃光。
        - id: ch01-b33
          speaker: kitty_catbird
          text: >-
            我敢说，那个巢周围不会有很多叶子被吃掉。那些家伙叫帐篷毛虫，能闯下大祸。我自己可受不了它们，浑身都是毛，几乎没有鸟肯碰。不过，杜鹃爱吃。瞧，他来了。好好看着吧。
        - id: ch01-b34
          speaker: narrator
          text: >-
            一只身形细长、看起来很像鸽子的鸟落在毛虫巢旁边。他的上身是褐灰色的，只泛着一点儿绿，下身洁白，两只翅膀呈红褐色。尾巴比哀鸽莫纳的还长一点儿。外侧尾羽乌黑，末端镶白，正中的羽毛则和后背同色。他的上嘴是黑的，下嘴却是黄色，所以大家叫他黄嘴杜鹃。他还有一位模样十分相像的表亲，只是整张嘴都是黑色，名叫黑嘴杜鹃。
        - id: ch01-b35
          speaker: narrator
          text: >-
            杜鹃一声不响，马上啄下那些毛茸茸的毛毛虫，一条条吞进肚里。把外面看得见的全吃光以后，他又在虫巢的丝网上啄出小洞，把藏在里面的毛毛虫一一叼出来。最后，他终于吃饱了，便像来时一样悄无声息地飞走，消失在旧石墙更远处的灌木丛中。
        - id: ch01-b36
          speaker: narrator
          text: >-
            过了一会儿，他们听见杜鹃在叫：“阔——阔——嚯——阔——阔——阔——阔——阔！”
        - id: ch01-b37
          speaker: kitty_catbird
          text: >-
            我猜，有些人听见以后，又会说天要下雨了。他们有个傻念头，以为杜鹃只在下雨前鸣叫，所以又管他叫雨鸦。其实根本不是那么回事。好了，彼得，今天早晨聊得够多啦。我得去看看灰猫嘲鸫太太怎么样了。
        - id: ch01-b38
          speaker: narrator
          text: >-
            咪咪钻进灌木丛，很快就不见了。彼得独自留在那里，再也找不到谁说话，便决定眼下最好的事，莫过于回到亲爱的老荆棘丛里去。
