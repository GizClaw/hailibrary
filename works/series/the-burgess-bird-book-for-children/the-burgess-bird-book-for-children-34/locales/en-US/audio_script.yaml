  chapters:
    - id: ch01
      title: Mourner the Dove and Cuckoo
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A long lane ran from Farmer Brown's barnyard down to his cornfield on the Green Meadows. Very early one morning, Peter Rabbit took it into his funny little head to run along that lane and see what he might find.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Beside the lane stood a gravelly bank. Farmer Brown had dug into it for gravel to spread on the road near his house. As Peter scampered past, he noticed someone busily moving about in the gravel pit. Peter stopped at once, sat up, and stared.
        - id: ch01-b03
          speaker: narrator
          text: >-
            It was Peter's old friend Mourner the Dove. His body was only a little larger than Welcome Robin's, but his slender neck, long wings, and still longer tail made him seem much bigger. His shape reminded Peter of the Pigeons at Farmer Brown's. Mourner's back was grayish-brown with shades of bluish-gray. The crown and upper part of his head were bluish-gray too. His reddish-buff breast softened to buff below. He had a black bill and red feet.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The two middle feathers in his tail were the longest and matched his back. The others were slaty-gray, crossed by little black bands and tipped with white. A few black spots marked his wings, and another black spot lay below each ear. But the loveliest feathers were on the sides of his slim neck. In shadow they looked much like his breast. When the Jolly Little Sunbeams touched them, their colors seemed to shift and change. That changing color is called iridescence. Mourner was lovely in a quiet way.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Yet Peter was not staring at Mourner's appearance. He was staring at what Mourner was doing. The Dove walked here and there, stopping every little while to pick up something. He looked as if he were having breakfast in the gravel pit, but Peter could not imagine finding anything good to eat there. There were not even any worms in that dry gravel. Besides, Mourner cared little for worms. He lived almost entirely on seeds and grains of many kinds. Peter was puzzled, but he never puzzled for long when he could use his tongue and ask a question.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            Hello, Mourner! What in the world are you doing down there? Are you eating breakfast?
        - id: ch01-b07
          speaker: mourner_dove
          text: >-
            Oh, no, Peter. Breakfast is over. I'm gathering a little gravel to help me digest it.
        - id: ch01-b08
          speaker: narrator
          text: Mourner picked up a tiny pebble and swallowed it.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            Well, I never! You must be out of your mind. Gravel won't help your stomach. I should think it would make things much worse.
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: >-
            Mourner gave the softest little cooing laugh. It was very pleasant to hear.
        - id: ch01-b11
          speaker: mourner_dove
          text: >-
            There you go again, Peter, judging everyone by yourself. By now you ought to know how foolish that can be. A meal of gravel would probably give you a terrible stomachache. But you are a Rabbit, and I am a Dove. That makes all the difference.
        - id: ch01-b12
          speaker: mourner_dove
          text: >-
            I eat grain and hard seeds, and I have no teeth. I must swallow my food whole. Part of my stomach is called the gizzard. It grinds and crushes the food so I can digest it. Tiny stones help the gizzard do that work. I have enough for this morning. Now it's time for my dust bath. I take one every day in a dusty patch over in the lane.
        - id: ch01-b13
          speaker: peter_rabbit
          text: If you don't mind, I'd like to come along.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Mourner did not mind at all, so Peter followed him over to the dusty place in the long lane. Mrs. Dove joined them there. She was dressed very much like Mourner, though the feathers on her neck were not quite so beautiful. The two Doves settled into the loose dust and worked it thoroughly through their feathers. All the while, they chatted with Peter.
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            I see you on the ground so often that I've wondered about your nest. Do you build it down here too?
        - id: ch01-b16
          speaker: mourner_dove
          text: >-
            No. Mrs. Dove builds in a tree, though usually not very high up. Now you'll have to excuse us. We must go home. She has two eggs to sit on, and while she sits, I like to stay nearby, keep her company, and make love to her.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The Doves shook every bit of loose dust from their feathers and flew away together. Peter watched closely, hoping to discover where their nest was, but the pair passed behind some trees and he lost sight of them. With nothing more to see in the lane, he decided to run up to the Old Orchard.
        - id: ch01-b18
          speaker: narrator
          text: >-
            There he found Jenny and Mr. Wren as busy as ever, feeding their growing family. Jenny would not stop for even a moment to gossip. Peter was bursting to tell someone all he had learned about Mr. and Mrs. Dove. Then he heard Kitty the Catbird meowing in the bushes beside the old stone wall and hurried over to find him. As soon as Peter reached him, he began telling Kitty about Mourner.
        - id: ch01-b19
          speaker: kitty_catbird
          text: >-
            That's old news, Peter. I know Mourner and his wife very well. They're pleasant neighbors, though Mrs. Dove may be the poorest housekeeper I know. You've never seen her nest, have you?
        - id: ch01-b20
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b21
          speaker: peter_rabbit
          text: No, I haven't. What does it look like?
        - id: ch01-b22
          speaker: narrator
          text: Kitty laughed.
        - id: ch01-b23
          speaker: kitty_catbird
          text: >-
            It hardly deserves to be called a nest. It's made of a few little sticks, and I cannot imagine how they stay together. It's lucky Mrs. Dove lays only two eggs. I'm amazed even those two manage to remain in it.
        - id: ch01-b24
          speaker: kitty_catbird
          text: >-
            Listen. That's Mourner calling now. He is such a happy fellow, but his voice sounds sadder than almost anyone's. If you heard him without knowing him, you'd think his heart was breaking. His call always makes me feel gloomy.
        - id: ch01-b25
          speaker: peter_rabbit
          text: That's true. Still, I like listening to him. Wait! Who's that?
        - id: ch01-b26
          speaker: narrator
          text: A long, clear call rang from a tree in the Old Orchard.
        - id: ch01-b27
          speaker: cuckoo
          text: Kow-kow-kow-kow-kow-kow!
        - id: ch01-b28
          speaker: narrator
          text: Peter had not heard a voice like it all spring.
        - id: ch01-b29
          speaker: kitty_catbird
          text: That's Cuckoo. Surely you know Cuckoo, Peter.
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            Of course I know him. I had only forgotten his call. Kitty, is it true that Mrs. Cuckoo acts like Sally Sly the Cowbird? I've heard that she lays her eggs in other birds' nests.
        - id: ch01-b31
          speaker: kitty_catbird
          text: >-
            Not one word of that is true. Mrs. Cuckoo builds a nest of her own, though it isn't much of a nest, and she cares for her own young. The Cuckoos got their bad name from some worthless cousins across the ocean, where Bully the English Sparrow came from. If the stories are true, those cousins really do behave as badly as Sally Sly.
        - id: ch01-b32
          speaker: kitty_catbird
          text: >-
            Once a bad name starts, it certainly sticks. Some birds even accuse the Cuckoos of stealing their eggs. I've lived beside them a long time, and I've never known them to steal one. Perhaps people suspect them because they slip about quietly and stay hidden whenever they can. They look as if they've done something wrong and don't want to be caught.
        - id: ch01-b33
          speaker: kitty_catbird
          text: >-
            The truth is, Cuckoos are very useful. Farmer Brown should be delighted that Mr. and Mrs. Cuckoo have returned to the Old Orchard this year.
        - id: ch01-b34
          speaker: peter_rabbit
          text: Why should Farmer Brown care?
        - id: ch01-b35
          speaker: kitty_catbird
          text: >-
            Look up in that tree. Do you see the webby nest with all those hairy caterpillars crawling on it and nearby?
        - id: ch01-b36
          speaker: narrator
          text: >-
            Peter said he could see it plainly. He had come across a great many of those cobwebby nests before. Around every one, he had noticed the same thing. The hungry caterpillars had eaten all the nearby leaves.
        - id: ch01-b37
          speaker: kitty_catbird
          text: >-
            I don't think you'll see many leaves eaten near that nest. Those are tent caterpillars, and they cause a great deal of damage. I cannot stand them because they're so hairy, and hardly any birds will touch them. Cuckoo likes them, though. Here he comes now. Watch him.
        - id: ch01-b38
          speaker: narrator
          text: >-
            A long, slim bird that looked rather like a Dove landed close to the caterpillars' nest. His upper parts were brownish-gray with a faint greenish tint, while his underparts were white. His wings were reddish-brown. His tail was a little longer than Mourner the Dove's. The outside tail feathers were black with white tips, and the middle ones matched his back.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The top half of his bill was black, but the bottom half was yellow. That was why he was called the Yellow-billed Cuckoo. He had a cousin who looked very much like him, except that the cousin's whole bill was black. That bird was called the Black-billed Cuckoo.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Cuckoo made no sound at all. He went straight to work, picking the hairy caterpillars from around the nest and swallowing them. When none remained in sight, he opened holes in the nest's silken web. Then he reached in and pulled out the caterpillars hidden inside. At last he had eaten his fill. Without a sound, he flew off just as quietly as he had come and disappeared among the bushes farther along the old stone wall.
        - id: ch01-b41
          speaker: narrator
          text: A moment later, his call came from the bushes.
        - id: ch01-b42
          speaker: cuckoo
          text: Kow-kow-how-kow-kow-kow-kow-kow!
        - id: ch01-b43
          speaker: kitty_catbird
          text: >-
            Some folks would say that means rain is coming. They have the silly idea that Cuckoo calls only before it rains, so they call him the Rain Crow. It simply isn't true. Well, Peter, I've spent enough of this morning gossiping. I must see how Mrs. Catbird is doing.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Kitty disappeared. With no one left to talk to, Peter decided the best thing he could do was go home to the dear Old Briar-patch.
