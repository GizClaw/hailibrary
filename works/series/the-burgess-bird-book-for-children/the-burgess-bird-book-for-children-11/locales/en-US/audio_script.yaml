audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, playful, and quick
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, sharp, and affectionate
        timbre: small and crisp
        pace: quick
        pitch: high
    yellow_wing:
      display_name: Yellow Wing
      tts:
        delivery: genial and energetic
        timbre: resonant and clear
        pace: brisk
        pitch: medium
    mrs_yellow_wing:
      display_name: Mrs. Yellow Wing
      tts:
        delivery: clear and summoning
        timbre: bright and ringing
        pace: measured
        pitch: medium-high
    redhead:
      display_name: Redhead
      tts:
        delivery: confident and teasing
        timbre: full and bright
        pace: relaxed
        pitch: medium
  chapters:
    - id: ch01
      title: Drummers and Carpenters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit had so many questions that he could hardly choose which one to ask first. But Yellow Wing the Flicker gave him no chance to begin. A clear, loud call came from the edge of the Green Forest.
        - id: ch01-b02
          speaker: mrs_yellow_wing
          text: Pe-ok! Pe-ok! Pe-ok!
        - id: ch01-b03
          speaker: yellow_wing
          text: Excuse me, Peter. Mrs. Yellow Wing is calling me.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Yellow Wing flew away. Peter watched him rise and dip through the air. He seemed to bound along in flight, much as Peter bounded over the ground.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            I could recognize him by that flight from as far away as I could see him. Somehow, he doesn't seem like a Woodpecker when he spends so much time on the ground. I'll have to ask Jenny Wren about him.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter started home for the dear Old Briar-patch. Two or three days passed before he had a chance to gossip with Jenny. When that chance finally came, the very first thing he asked was whether Yellow Wing was truly a Woodpecker.
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            He certainly is. Of course he's a Woodpecker. Why in the world would you think he wasn't?
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            He seems to spend more time on the ground than in the trees. I don't know any other Woodpecker that comes down to the ground at all.
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            Tut, tut, tut, tut! Stop and think, Peter. Haven't you ever seen Redhead on the ground?
        - id: ch01-b10
          speaker: narrator
          text: Peter blinked.
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            Ye-e-s. Now that you mention it, I have. I've seen him gathering beechnuts in the fall. Woodpeckers are a funny family. I just don't understand them.
        - id: ch01-b12
          speaker: narrator
          text: >-
            At that moment, a long, rolling rat-a-tat-tat sounded right above their heads.
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            There's another Woodpecker now. That's Downy, the smallest one in the whole family. Such a little fellow makes an enormous racket! He's a wonderful drummer, and just as fine a carpenter. In fact, he built the very house I'm living in.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Peter sat with his head tipped far back and tried to find Downy. At first, he could see nothing at all. Then he noticed a small movement on top of a dead limb. It was Downy's head, darting back and forth as he beat out his long roll.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Downy wore black and white, with a little scarlet patch on the back of his head. He was only a bit larger than a Sparrow, yet he was making a tremendous noise.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Is he cutting out a hole for a nest up there?
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            Gracious, Peter, what a silly question! Give us birds a little credit for common sense. If Downy made that much noise while cutting a nest hole, everyone who heard him would know exactly where to find it.
          emotion: angry
        - id: ch01-b18
          speaker: jenny_wren
          text: >-
            Downy has far too much sense for that. When he cuts a nest hole, he makes only the noise he must. You don't see wood chips flying, do you?
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            No-o. Now that you point it out, I don't. Is he looking for worms inside the wood?
        - id: ch01-b20
          speaker: narrator
          text: Jenny laughed aloud.
        - id: ch01-b21
          speaker: jenny_wren
          text: >-
            Not at all, Peter. He's simply drumming. That hollow limb makes a wonderful drum, and Downy is putting it to good use. Listen to him! You won't find a better drummer anywhere.
        - id: ch01-b22
          speaker: narrator
          text: Peter still wasn't satisfied. After a while, he dared to ask one more question.
        - id: ch01-b23
          speaker: peter_rabbit
          text: Why is he doing it?
        - id: ch01-b24
          speaker: jenny_wren
          text: >-
            Good land, Peter! Why do you run and jump in the spring? Why is Mr. Wren singing over there? Downy drums for exactly the same reason. He's happy. He can't run and jump, and he can't sing, but he can drum. And did you know that Downy is one of the most useful birds in the Old Orchard?
        - id: ch01-b25
          speaker: narrator
          text: >-
            Just then, Downy flew away. He had hardly disappeared before another drummer took his place. At first, Peter thought Downy had come back. Then he noticed that this new bird was just a little bigger. Jenny's sharp eyes knew him at once.
        - id: ch01-b26
          speaker: jenny_wren
          text: >-
            Well, look at that! It's Hairy. Did you ever see two cousins who looked more alike? If Hairy weren't larger, telling him from Downy would be very hard. Can you spot any other difference, Peter?
        - id: ch01-b27
          speaker: narrator
          text: >-
            Peter stared, blinked, and stared once more. Then he slowly shook his head.
        - id: ch01-b28
          speaker: peter_rabbit
          text: No, I can't.
        - id: ch01-b29
          speaker: jenny_wren
          text: >-
            That shows you still haven't learned how to use your eyes, Peter. Look at the outer feathers of Hairy's tail. They're completely white. Downy's outer tail feathers have little black bars across them.
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            Hairy is every bit as good a carpenter as Downy. For that matter, I don't know a single Woodpecker who isn't a fine carpenter. Where did you say Yellow Wing was making his home this year?
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            In the Big Hickory-tree beside the Smiling Pool. But I still don't understand why Yellow Wing spends so much time on the ground.
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            Ants. That's the whole reason. He loves ants as much as Old Mr. Toad does, and that's saying a lot. If Yellow Wing keeps this up, he'll become a ground bird instead of a tree bird. He already finds more than half his food on the ground. Speaking of drumming, have you ever heard him drum on a tin roof?
        - id: ch01-b33
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b34
          speaker: jenny_wren
          text: >-
            If there's a tin roof anywhere nearby and Yellow Wing can find it, he'll be perfectly happy. He certainly loves making noise, and tin makes the finest kind of drum.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Jenny stopped when a bird landed on the trunk of the very next tree. He was about the size of Sammy Jay. His whole head and neck were a beautiful deep red. His breast was pure white. His back was black almost to his tail, and there it turned white.
        - id: ch01-b36
          speaker: jenny_wren
          text: >-
            Hello, Redhead! How did you know we were talking about your family?
        - id: ch01-b37
          speaker: redhead
          text: >-
            Hello, chatterbox. I didn't know you were discussing my family, but I could have guessed you were discussing somebody's. Does that tongue of yours ever stop, Jenny?
        - id: ch01-b38
          speaker: narrator
          text: >-
            Redhead's eyes twinkled. Jenny was about to grow indignant and scold him, but she thought better of it. Instead, she tried to look dignified, which no member of the Wren family could possibly manage.
        - id: ch01-b39
          speaker: jenny_wren
          text: >-
            I was talking for Peter's sake. He has always believed that real Woodpeckers never come down to the ground. I was explaining that Yellow Wing is a true Woodpecker, even though he spends half his time down there.
        - id: ch01-b40
          speaker: narrator
          text: Redhead nodded.
        - id: ch01-b41
          speaker: redhead
          text: >-
            It's because of the ants. I don't know anyone who likes them as much as Yellow Wing, except Old Mr. Toad. I enjoy a few ants myself, but Yellow Wing nearly lives on them whenever he can.
        - id: ch01-b42
          speaker: redhead
          text: >-
            You may have noticed that I visit the ground sometimes too. I'm rather fond of beetles, and now and then a grasshopper tastes very good. I like variety. Yes, sir, I certainly do.
        - id: ch01-b43
          speaker: redhead
          text: >-
            Cherries, blackberries, raspberries, strawberries, and grapes all taste good to me. So do most other fruits. And when there isn't any fruit, I can always eat beechnuts and acorns.
        - id: ch01-b44
          speaker: narrator
          text: Jenny tossed her head and answered him sharply.
        - id: ch01-b45
          speaker: jenny_wren
          text: You forgot to mention the eggs belonging to some of your neighbors.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Redhead tried his best to look innocent. It didn't fool Peter. He saw Redhead give a guilty start, change the subject very suddenly, and fly away a moment later.
        - id: ch01-b47
          speaker: peter_rabbit
          text: Is it true that Redhead does something so dreadful?
        - id: ch01-b48
          speaker: narrator
          text: Jenny bobbed her head again and again, all the while jerking her little tail.
        - id: ch01-b49
          speaker: jenny_wren
          text: >-
            So I'm told. I've never caught him doing it myself, but I know others who have. They say he's no better than Sammy Jay or Blacky the Crow. But gracious goodness, I can't sit here gossiping forever!
        - id: ch01-b50
          speaker: narrator
          text: >-
            Jenny twitched her funny little tail, snapped her bright eyes at Peter, and disappeared into her house.
