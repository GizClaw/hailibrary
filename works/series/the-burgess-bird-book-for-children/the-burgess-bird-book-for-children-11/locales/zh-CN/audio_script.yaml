audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    yellow_wing:
      display_name: 黄翼扑动鴷
      tts:
        delivery: 爽朗友善，带着朴实的自豪
        timbre: 清亮结实
        pace: 适中
        pitch: 中音
    mrs_yellow_wing:
      display_name: 黄翼太太
      tts:
        delivery: 清脆爽朗，呼唤时干净有力
        timbre: 明亮清澈
        pace: 明快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 伶俐健谈，责备时尖锐却不失活泼
        timbre: 清脆灵巧
        pace: 轻快多变
        pitch: 高音
    redhead:
      display_name: 红头啄木鸟
      tts:
        delivery: 风趣随和，带一点自得和机敏
        timbre: 清朗饱满
        pace: 从容中带轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十一章　鼓手和木匠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得满肚子的问题挤在一起，正愁不知道先问哪一个，黄翼却没给他开口的机会。绿森林边上传来一声清亮又响亮的呼唤。
        - id: ch01-b02
          speaker: mrs_yellow_wing
          text: 皮——奥克！皮——奥克！皮——奥克！
        - id: ch01-b03
          speaker: yellow_wing
          text: 对不起，彼得，是黄翼太太在叫我。
        - id: ch01-b04
          speaker: narrator
          text: >-
            黄翼说完就飞走了。彼得望着他飞远，发现他一路一起一伏，就像彼得自己在地上蹦跳一样，黄翼是在空中蹦着走。彼得也动身回他亲爱的老蔷薇丛去了。一路上，他还在琢磨黄翼的事。
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            他这种飞法太特别了，隔得再远我也认得出来。可他总待在地上，怎么看都不像啄木鸟。我得问问珍妮鹪鹩。
        - id: ch01-b06
          speaker: narrator
          text: 两三天以后，彼得才有机会和珍妮聊聊。他一见到她，头一个问题就是，黄翼到底算不算真正的啄木鸟。
        - id: ch01-b07
          speaker: jenny_wren
          text: 当然算，他当然是啄木鸟。你究竟为什么觉得他不是？
        - id: ch01-b08
          speaker: peter_rabbit
          text: 他待在地上的时候，好像比待在树上的时候还多。我从来没见过别的啄木鸟落到地上。
        - id: ch01-b09
          speaker: jenny_wren
          text: 啧，啧，啧，啧！彼得，你好好想想！你就从来没见过红头待在地上吗？
        - id: ch01-b10
          speaker: narrator
          text: 彼得眨了眨眼，这才慢慢想了起来。
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            见——过。秋天，我见过他在地上捡山毛榉果。啄木鸟这一家子真奇怪，我怎么也弄不懂他们。
        - id: ch01-b12
          speaker: narrator
          text: >-
            话音刚落，一长串滚动的“嗒啦啦啦啦”声就在他们头顶响起来，绵长的鼓点一声接着一声。珍妮听见了，不由得轻声笑了。
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            又来了一只啄木鸟。那是绒绒，是他们全家最小的一个。别看他个头小，弄出的动静可真大。他打鼓很在行，做木匠也一样出色。我现在住的房子，就是他造的。
        - id: ch01-b14
          speaker: narrator
          text: >-
            彼得坐在那里，脑袋仰得高高的，找了半天才看见枯枝顶上有个小东西在动。那是绒绒的脑袋，正飞快地来回摆动，敲出一长串鼓声。绒绒穿着黑白两色的衣裳，后脑勺还有一小块鲜红的斑纹。他只比麻雀家族的一员大一点儿，声音却大得惊人。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 他是不是在上面凿洞做鸟巢？
        - id: ch01-b16
          speaker: narrator
          text: 彼得问得急切，珍妮却满脸不屑。
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            天哪，彼得，你怎么问得出这么傻的问题！你总该相信，我们鸟儿还有一点儿常识吧。他要是凿巢洞，所有听见声音的家伙不就全知道该去哪里找他的巢了吗？绒绒那颗小脑袋聪明着呢，才不会做这种蠢事。真正筑巢时，他能少弄一点声音，就一定少弄一点。你看见木屑飞下来了吗？
        - id: ch01-b18
          speaker: peter_rabbit
          text: 没——有。你这么一说，确实没有。难道他是在木头里找虫子？
        - id: ch01-b19
          speaker: narrator
          text: 珍妮听得放声大笑。
        - id: ch01-b20
          speaker: jenny_wren
          text: >-
            才不是呢，彼得。他就是在打鼓。那根树枝里面是空的，正是一面顶好的鼓，绒绒当然要好好敲一敲。你听！哪里还能找到比他更好的鼓手？
        - id: ch01-b21
          speaker: narrator
          text: 彼得还是没有弄明白。犹豫了一会儿，他又问了下去。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 可他为什么要打鼓呢？
        - id: ch01-b23
          speaker: jenny_wren
          text: >-
            我的天呀，彼得！春天来了，你为什么又跑又跳？那边的鹪鹩先生又为什么唱歌？绒绒打鼓也是一样，因为他快活。他不会跑，不会跳，也不会唱歌，可他会打鼓。对了，你知道吗？绒绒还是老果园里最有用的鸟儿之一呢。
        - id: ch01-b24
          speaker: narrator
          text: >-
            绒绒刚飞走，身影才从眼前消失，另一个鼓手就来到原处接替了他。彼得起先以为绒绒又回来了，仔细一看，才发现新来的鸟比绒绒稍稍大一点。珍妮的眼睛很尖，立刻认出了来者。
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            嘿，长毛来了！你见过长得这么像的表兄弟吗？要不是长毛比绒绒大一点儿，分清他们还真不容易。彼得，你能看出别的不同吗？
        - id: ch01-b26
          speaker: narrator
          text: 彼得瞪着眼看了一遍，眨眨眼，又看了一遍，最后慢慢摇头。
        - id: ch01-b27
          speaker: peter_rabbit
          text: 看不出来，我一点也看不出来。
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            那是因为你还不会好好用眼睛。看看他尾巴最外面的羽毛，全是白色的。绒绒外侧的尾羽上却有一道道黑纹。长毛和绒绒一样，木匠活儿做得很好。说到木匠活儿，我还真找不出啄木鸟家族里有哪一个做得不好。对了，你说黄翼今年把家安在哪儿？
        - id: ch01-b29
          speaker: peter_rabbit
          text: 就在微笑池边的大山核桃树上。可我还是想不通，黄翼为什么老待在地上。
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            为了蚂蚁，全是为了蚂蚁。黄翼爱吃蚂蚁，和老蟾蜍先生差不多，这可已经爱得不得了啦。他要是继续这样下去，就该从树上的鸟变成地上的鸟了。如今他吃的东西，大半都是从地面上找来的。说到打鼓，你听过黄翼在铁皮屋顶上敲吗？
        - id: ch01-b31
          speaker: narrator
          text: 彼得摇摇头。
        - id: ch01-b32
          speaker: jenny_wren
          text: >-
            只要附近有铁皮屋顶，又让黄翼找到了，他就会快活得不得了。他最爱弄出响声，而铁皮敲起来，正是一面再好不过的鼓。
        - id: ch01-b33
          speaker: narrator
          text: >-
            珍妮正说着，一只差不多和松鸦萨米一样大的鸟飞来，落在她所坐那棵树紧挨着的另一棵树上。新来的鸟，整个头部和颈部都是漂亮的深红色，胸脯洁白。背部的黑色一直延伸到尾巴开始的地方附近，那里又变成了白色。
        - id: ch01-b34
          speaker: jenny_wren
          text: 你好呀，红头！你怎么知道我们正说你们家的事？
        - id: ch01-b35
          speaker: redhead
          text: >-
            你好呀，话匣子。我可不知道你在说我们家。不过就算让我猜，我也猜得到你准在谈谁家的事。珍妮，你那张嘴有停下来的时候吗？
        - id: ch01-b36
          speaker: narrator
          text: >-
            珍妮一听，立刻气了起来，差点儿开口责骂。可她转念一想，还是忍住了。她努力摆出一本正经的模样，只可惜，鹪鹩家族里的任何成员，都不可能摆出那副神气。
        - id: ch01-b37
          speaker: jenny_wren
          text: >-
            我说这些，是为了让彼得长长见识。他总以为真正的啄木鸟从不到地上去。我正告诉他，黄翼虽然是啄木鸟，却有一半时间都待在地上。
        - id: ch01-b38
          speaker: narrator
          text: 红头点了点头。
        - id: ch01-b39
          speaker: redhead
          text: >-
            那都是因为蚂蚁。除了老蟾蜍先生，我没见过谁像黄翼那么爱吃蚂蚁。我自己也喜欢吃上几只，可黄翼只要找得到，简直能靠蚂蚁过日子。你们可能见过，我有时也下到地上。我很喜欢甲虫，偶尔来一只蚱蜢，味道也很好。我这个人就喜欢换着花样吃。没错，我就是喜欢各种各样的食物。樱桃、黑莓、覆盆子、草莓、葡萄，我都喜欢。其实大多数水果都很好吃。没有水果的时候，山毛榉果和橡子也不错。
        - id: ch01-b40
          speaker: narrator
          text: 珍妮把头一甩，尖刻地接了一句。
        - id: ch01-b41
          speaker: jenny_wren
          text: 可你怎么没说，有些邻居家的鸟蛋也在你的食谱上？
        - id: ch01-b42
          speaker: narrator
          text: >-
            红头竭力装出一脸无辜的样子，彼得却看见他心虚地惊跳了一下。他突然把话题岔开，没过多久就飞走了。
        - id: ch01-b43
          speaker: peter_rabbit
          text: 红头真的会做那么可怕的事吗？
        - id: ch01-b44
          speaker: narrator
          text: 珍妮飞快地点头，尾巴也猛甩了几下。
        - id: ch01-b45
          speaker: jenny_wren
          text: >-
            别人是这么告诉我的。我没有亲眼见过，不过我认识一些见过的鸟。他们都说，红头跟松鸦萨米和乌鸦布莱基一样坏。哎呀，我可不能一直坐在这里闲聊！
        - id: ch01-b46
          speaker: narrator
          text: 珍妮抖了抖那条滑稽的小尾巴，明亮的眼睛朝彼得一闪，便钻进自己的屋里不见了。那正是绒绒替她造的屋子。
