audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 细亮有穿透力
        pace: 快速紧凑
        pitch: 高音
    mocker:
      display_name: 反舌鸟莫克
      tts:
        delivery: 自信风趣，话音里常带着淘气的笑意
        timbre: 清越圆润，富于变化
        pace: 从容灵活
        pitch: 中高音
  chapters:
    - id: ch01
      title: 珍妮的大个子表亲
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一个春日的早晨，鹪鹩珍妮问兔子彼得，有没有见过她那位大个子表亲。彼得吃了一惊，这件事他一直忘不了。他想来想去，也想不出珍妮会有哪位大个子表亲。彼得知道的那些亲戚，个头几乎都跟她一样小。
        - id: ch01-b02
          speaker: narrator
          text: >-
            珍妮偏偏又是世上最没耐心的小家伙之一。
        - id: ch01-b03
          speaker: jenny_wren
          text: >-
            怎么啦，怎么啦，怎么啦，彼得？你的舌头丢了吗？这么简单的问题，也要想上一整天才回答？你到底见没见过我的大个子表亲？他早就该到这里了。
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            我不过是答得慢一点儿，你别发火呀。我正在想，你那位大个子表亲到底是谁。说实话，我恐怕根本不认识他。
        - id: ch01-b05
          speaker: jenny_wren
          text: >-
            不认识？你竟然说不认识！你当然认识他，想不认识都难。我说的是褐褐弯嘴嘲鸫！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得惊得一下跳离了地面。
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            什么？褐褐什么时候成了鹪鹩家的亲戚？
          emotion: surprised
        - id: ch01-b08
          speaker: jenny_wren
          text: >-
            从世上有鹪鹩和弯嘴嘲鸫的时候起，我们就是亲戚了。褐褐属于家族的一支，我属于另一支，所以他是我的远房表亲。有些人知道的事情可真少，少得叫人吃惊。
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            可我一直以为他是鸫鸟一家的。他看着明明很像鸫鸟呀。
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            长得像，不代表真的是。你早该学会了，不能只凭模样判断别人。每次听人把褐褐叫作褐鸫，我就来气。他身上连一滴鸫鸟的血都没有。还有，兔子彼得，你还是没回答我。他到底来了没有？
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            来了。昨天我还在老牧场边上见过他。他一会儿钻灌木丛，一会儿又在地上找东西。那条长尾巴上下左右甩个不停，好像怎么放都不合适。我从没见过谁那样摆弄自己的尾巴。
        - id: ch01-b12
          speaker: narrator
          text: >-
            珍妮咯咯笑了起来。
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            没错，那就是他。正因为他老把尾巴抽来甩去，英文名字才叫 Thrasher，意思就是“甩打者”。我猜，他穿上春天的新衣裳了吧？
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            新不新我可不知道，不过真好看。他的背、翅膀和尾巴都是漂亮的红褐色，我特别喜欢。那颜色衬得他的背心格外精神。背心是白色和浅黄褐色的，上面还有一道道深色条纹和斑点。珍妮，他从头到脚都穿得这么像鸫鸟，别人认错也不能全怪他们吧？
        - id: ch01-b15
          speaker: jenny_wren
          text: >-
            好吧，大概不能怪他们。可鸫鸟没有谁长着那么鲜亮的褐色外衣。褐褐确实很英俊，就算这话是我说的也一样。你看见他那张长嘴了吗？
        - id: ch01-b16
          speaker: narrator
          text: >-
            彼得点点头。
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            我还看见了，他的两边翅膀上各有两道白纹。
        - id: ch01-b18
          speaker: jenny_wren
          text: >-
            真难得，你看得还挺仔细。那你听见他唱歌了吗？
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            当然听见了！他还特意唱给我听呢。褐褐飞到一棵树的顶上，仰起脑袋放声歌唱。我认识的鸟儿里，没几只能唱得那么动听。他的嗓音真了不起，我想不出还有谁的歌会让我更爱听。他唱的时候，自己也快活得很，而且心里明白自己是个出色的歌手。对了，他那条长尾巴一直直直垂着，跟鹪鹩先生唱歌时一模一样。
          emotion: happy
        - id: ch01-b20
          speaker: jenny_wren
          text: >-
            那当然，这是我们家族的特点。我另外两个大个子表亲一唱歌，也会把尾巴这样垂下来。
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            什、什、什么？你还有两个大个子表亲？
          emotion: surprised
        - id: ch01-b22
          speaker: narrator
          text: >-
            彼得仰头瞪着珍妮，仿佛从来没见过她似的。
        - id: ch01-b23
          speaker: jenny_wren
          text: >-
            当然有。反舌鸟莫克和猫声鸟吉蒂，跟褐褐属于同一家族，所以也是我的远房表亲。
        - id: ch01-b24
          speaker: narrator
          text: >-
            彼得的脸顿时变得滑稽极了。他相信珍妮没有撒谎，可这个消息来得太突然，实在叫人难以相信。好几分钟里，他连下一个问题都问不出来。最后，彼得总算找回了自己的舌头，这才小心翼翼地开口。
        - id: ch01-b25
          speaker: peter_rabbit
          text: >-
            褐褐也跟莫克和吉蒂一样，会学其他鸟儿唱歌吗？
        - id: ch01-b26
          speaker: narrator
          text: >-
            珍妮用力摇了摇头。
        - id: ch01-b27
          speaker: jenny_wren
          text: >-
            不会。他对自己的歌已经满意得不得了。
    - id: ch02
      title: 格洛里的哨声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            珍妮刚说完，不远处的树上就传来了主红雀格洛里清亮的哨声。彼得马上把她的亲戚们全抛在脑后，飞快地跑向那棵树。格洛里实在太美了，只要有机会，彼得就一定要看看他。
        - id: ch02-b02
          speaker: narrator
          text: >-
            彼得坐在树下，一直仰头盯着枝叶，想从中瞧见格洛里那身漂亮的红衣裳。清脆甜美的哨声又响了一遍，把彼得的目光引向一根高高的树枝。可那里没有格洛里鲜艳夺目的红外衣，只有一只跟知更鸟威尔科姆差不多大的鸟。
        - id: ch02-b03
          speaker: narrator
          text: >-
            那只鸟穿着朴素的灰白色衣裳。翅膀上有两道白纹，尾巴两边最外侧也长着白色羽毛。他浑身上下利落又整洁。唱歌时，那条长尾巴直直垂着，就像褐褐唱歌时一样，只不过没有褐褐的尾巴那么长。
        - id: ch02-b04
          speaker: narrator
          text: >-
            彼得惊讶得直眨眼。陌生鸟儿忽然张开嘴，格洛里那好听的哨声又传了出来。接着，他低头望着彼得，眼睛里闪着淘气的光。
        - id: ch02-b05
          speaker: mocker
          text: >-
            这回我把你骗到了吧，彼得？你还以为马上就能看见主红雀格洛里，对不对？
        - id: ch02-b06
          speaker: narrator
          text: >-
            不等彼得回答，这位模样朴素的陌生客就开起了一场音乐会。这样的音乐会，全世界再没有谁办得到。从他那神奇的喉咙里，接连传出彼得熟悉的歌声。老果园里那些朋友的曲子，一支又一支，一声又一声地流淌出来。整场演出的最后，他才唱了一首完全属于自己的动听歌曲。
        - id: ch02-b07
          speaker: narrator
          text: >-
            彼得不用别人介绍，也认出了他。这就是反舌鸟莫克。
        - id: ch02-b08
          speaker: peter_rabbit
          text: >-
            啊，莫克，你究竟是怎么做到的？刚才的哨声，明明就像格洛里吹出来的。我以后再也不敢相信自己的耳朵啦。
          emotion: surprised
        - id: ch02-b09
          speaker: narrator
          text: >-
            莫克笑了。
        - id: ch02-b10
          speaker: mocker
          text: >-
            被我骗到的可不只你一个，彼得。只要我有心去骗，几乎谁都会上当。这样玩儿可有意思了。我的外表也许不太起眼，可要比唱歌，我不羡慕任何鸟。
        - id: ch02-b11
          speaker: peter_rabbit
          text: >-
            我觉得你长得很好看呀。今天早上我才明白，光凭外表，实在看不出谁是什么样。
        - id: ch02-b12
          speaker: mocker
          text: >-
            现在你又学会了另一件事。只听声音，也不一定认得出是谁，对吧？
        - id: ch02-b13
          speaker: peter_rabbit
          text: >-
            对。以后碰见长羽毛的朋友，我一定要亲眼看见，又亲耳听见，才敢确定是谁。莫克，你再给我唱一回，好不好？
    - id: ch03
      title: 莫克最珍爱的礼物
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            莫克真的又唱了起来。他一首接一首地唱，因为他显然打心底里喜欢唱歌。等莫克停下，彼得早已准备好了另一个问题。
        - id: ch03-b02
          speaker: peter_rabbit
          text: >-
            从前有人告诉我，在南方所有鸟儿当中，大家最喜欢你。真是这样吗？
        - id: ch03-b03
          speaker: mocker
          text: >-
            这话不该由我来说。不过我可以告诉你，彼得，南方的人们确实很喜欢我。那里有很多打扮得非常漂亮的鸟，他们根本不会飞到北边来。可是，不管他们的衣裳有多美，也没有哪一只像我这么受人喜爱。这全靠我的歌声。要让我来选，我宁愿有一副美妙的嗓子，也不要一身华丽的外衣。
        - id: ch03-b04
          speaker: narrator
          text: >-
            彼得点点头，好像完全赞同。可仔细一想，这就有点儿好笑了，因为彼得既没有华丽的外衣，也没有美妙的歌喉。莫克眼中又闪起了调皮的光。
        - id: ch03-b05
          speaker: mocker
          text: >-
            你看，金羽拟鹂太太就在那边。瞧我怎么捉弄她。
        - id: ch03-b06
          speaker: narrator
          text: >-
            莫克马上学起金羽先生遇到烦心事时的叫声，学得一点儿不差。金羽太太匆匆飞来，想知道究竟出了什么事。等她发现叫声来自莫克，顿时大发脾气，把他狠狠数落了一通。随后，她气呼呼地飞走了，那副模样简直就是“气愤”两个字。莫克和彼得都笑了，他们觉得这个玩笑有趣极了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            这时，彼得突然想起珍妮说过的话。
        - id: ch03-b08
          speaker: peter_rabbit
          text: >-
            珍妮说你是她的远房表亲。她说的是真的吗？
        - id: ch03-b09
          speaker: narrator
          text: >-
            莫克点了点头。
        - id: ch03-b10
          speaker: mocker
          text: >-
            是真的。我们是亲戚，只是各自属于同一家族的不同分支。
        - id: ch03-b11
          speaker: narrator
          text: >-
            说完，莫克忽然唱起了鹪鹩先生的歌。唱过以后，他告辞离开，去找莫克太太。因为照莫克的说法，他和太太该开始考虑筑巢了。
