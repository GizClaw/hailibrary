audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, impatient, and sharply amusing
        timbre: small and crisp
        pace: quick
        pitch: high
    mocker_mockingbird:
      display_name: Mocker the Mockingbird
      tts:
        delivery: confident, playful, and musically expressive
        timbre: clear and resonant
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Jenny Wren's Cousins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit never forgot the surprise Jenny Wren gave him one spring morning. She asked whether he had seen her big cousin. Peter paused. He could not think of any big cousin she might mean. Every cousin of Jenny's that he knew was almost as small as she was.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Jenny was one of the most impatient little people in the world.
        - id: ch01-b03
          speaker: jenny_wren
          text: >-
            Well, Peter? Have you lost your tongue? It shouldn't take all day to answer one simple question. Have you seen my big cousin? He ought to be here by now.
          emotion: angry
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            You don't have to be cross just because I'm slow. I'm trying to remember who your big cousin is. Honestly, Jenny, I don't think I know him.
        - id: ch01-b05
          speaker: jenny_wren
          text: >-
            You don't know him? Of course you do! Everybody knows him. I'm talking about Brownie the Thrasher.
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: Peter was so startled that he jumped right off the ground.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            Brownie the Thrasher? When did he become part of the Wren family?
          emotion: surprised
        - id: ch01-b08
          speaker: jenny_wren
          text: >-
            He has been our relative as long as there have been Wrens and Thrashers. Brownie is on one branch of the family, and I'm on another. That makes him my second cousin. Some people know amazingly little.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            But I always thought Brownie belonged with the Thrushes. He certainly looks like a Thrush.
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            Looking like a Thrush doesn't make him one. You should know by now that looks can fool you. It makes me so cross when anyone calls Brownie the Brown Thrush. He has no Thrush blood at all. Now answer me, Peter. Has he arrived yet?
          emotion: angry
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            Yes. I saw him only yesterday at the edge of the Old Pasture. One moment he was fussing around in the bushes, and the next he was down on the ground. All the while, he jerked that long tail up, down, and sideways, as though he couldn't decide where to put it. I've watched a great many birds, but I've never seen anyone twitch a tail the way Brownie does.
        - id: ch01-b12
          speaker: narrator
          text: Jenny giggled.
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            That sounds exactly like Brownie. He thrashes his tail around so much that people call him a Thrasher. I suppose he had on his new spring suit.
          emotion: happy
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            I couldn't tell whether his suit was new, but it looked very fine. His back was a beautiful reddish brown, and so were his wings and tail. Against all that warm brown, his white-and-buff waistcoat stood out clearly, right down to its dark streaks and spots. You must admit he is dressed so much like the Thrushes that anyone seeing him for the first time might make the same mistake I did.
        - id: ch01-b15
          speaker: narrator
          text: Jenny gave in, though she did it rather unwillingly.
        - id: ch01-b16
          speaker: jenny_wren
          text: >-
            I suppose someone might make that mistake. Still, no Thrush has a coat of such bright brown. Brownie is handsome, even if I am the one saying so. Did you see how long his bill is?
        - id: ch01-b17
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b18
          speaker: peter_rabbit
          text: I also saw two white bars on each wing.
        - id: ch01-b19
          speaker: jenny_wren
          text: >-
            I'm glad you noticed something. Did you hear him sing?
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            Hear him? He sang especially for me! First he flew right up to the top of a tree. Then he tipped back his head and sang the way very few birds can sing. Brownie has a wonderful voice. There is hardly anyone I would rather sit and listen to. He seemed to enjoy the song every bit as much as I did, and he acted as though he knew exactly what a good singer he was. While he sang, his long tail hung straight down, the same way Mr. Wren's does when he sings.
          emotion: happy
        - id: ch01-b21
          speaker: jenny_wren
          text: >-
            Of course it did. That runs in the family. My other two big cousins hold their tails the same way.
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            Wha-what did you say? You have more big cousins?
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: Peter stared at Jenny as though he had never seen her before.
        - id: ch01-b24
          speaker: jenny_wren
          text: >-
            Certainly I do. Mocker the Mockingbird and Kitty the Catbird belong to Brownie's family, so they are my second cousins too.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Peter's face looked very funny. He believed Jenny, but the news was so surprising and so hard to take in that he could not speak for several minutes. At last, he asked his next question very timidly.
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            Does Brownie copy other birds' songs the way Mocker and Kitty do?
        - id: ch01-b27
          speaker: narrator
          text: Jenny shook her head firmly.
        - id: ch01-b28
          speaker: jenny_wren
          text: No. Brownie is perfectly satisfied with his own song.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Before Jenny could say anything else, Glory the Cardinal's clear whistle sounded from a nearby tree. Peter forgot all about Jenny and her relatives. He scampered over at once, because Glory was so beautiful that Peter never missed a chance to see him.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Peter sat below the tree and searched for Glory's brilliant red coat. Then the same clear, sweet whistle came again. Peter looked toward an upper branch, but the bird he found there was not Glory at all. This stranger was about the size of Welcome Robin. He wore sober ashy gray, with two white bars on his wings and white feathers along the outer edges of his tail. He looked trim and neat. His long tail hung straight down as Brownie's did when he sang, though it was not quite as long.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Peter blinked and stared. The stranger opened his mouth, and out came Glory's own beautiful whistle. Then he looked down at Peter with mischief twinkling in his eyes.
        - id: ch01-b32
          speaker: mocker_mockingbird
          text: >-
            I fooled you, didn't I, Peter? You thought you were about to see Glory the Cardinal.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Without waiting for an answer, the plain gray stranger began a concert no other bird in the world could give. Song followed song, and note followed note. Peter heard the familiar calls and music of friend after friend from the Old Orchard, all pouring from that one wonderful throat. At last, the stranger finished with a lovely song that was entirely his own. By then Peter needed no one to tell him the singer's name. This was Mocker the Mockingbird.
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            Oh, Mocker! How in the world can you do that? I was certain I heard Glory whistling. After this, I won't know whether I can trust my own ears.
          emotion: surprised
        - id: ch01-b35
          speaker: narrator
          text: Mocker chuckled.
        - id: ch01-b36
          speaker: mocker_mockingbird
          text: >-
            You aren't the first bird or animal I've tricked, Peter. If I decide to fool someone, I can usually do it. It's great fun. I may not have a splendid coat, but I don't envy anyone else's singing.
          emotion: happy
        - id: ch01-b37
          speaker: peter_rabbit
          text: >-
            I think you look very nice. This morning I've been learning that you cannot tell much about anyone from looks alone.
        - id: ch01-b38
          speaker: mocker_mockingbird
          text: >-
            And now you know a voice can fool you too, don't you?
        - id: ch01-b39
          speaker: narrator
          text: Mocker chuckled again.
        - id: ch01-b40
          speaker: peter_rabbit
          text: >-
            Yes. From now on, I won't be sure who any feathered friend is until I both see and hear them. Please sing for me again, Mocker.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Mocker did. He gave Peter another song, and then another, and he kept singing because he clearly loved it. Peter listened until the last note ended. By then, he already had another question waiting.
        - id: ch01-b42
          speaker: peter_rabbit
          text: >-
            Someone once told me that people down South love you more than any other bird. Is that true?
        - id: ch01-b43
          speaker: mocker_mockingbird
          text: >-
            I shouldn't be the one to decide whether I am best loved. But I can tell you that people think a great deal of me down there. The South has many birds in very beautiful clothes. Some of them never come up here at all, so you have never even seen them. Still, not one of those fine-looking birds is loved more than I am, and it is all because of my voice. If I had to choose, I would rather have a beautiful voice than the finest coat.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Peter nodded as though he agreed completely. That was rather funny, when you remember that Peter had neither a fine coat nor a fine voice. Then mischief flashed in Mocker's eyes.
        - id: ch01-b45
          speaker: mocker_mockingbird
          text: >-
            There is Mrs. Goldy the Oriole. Watch me play a trick on her.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Mocker called out in a perfect copy of Goldy's voice when Goldy was worried. Mrs. Goldy hurried over at once to see what was wrong. The moment she discovered Mocker, she lost her temper and gave him a thorough scolding. Then she flew away, looking as indignant as a bird could look. Mocker and Peter laughed because they thought the trick was very funny.
        - id: ch01-b47
          speaker: narrator
          text: Suddenly Peter remembered what Jenny had told him.
        - id: ch01-b48
          speaker: peter_rabbit
          text: >-
            Was Jenny Wren telling the truth when she said you were her second cousin?
        - id: ch01-b49
          speaker: narrator
          text: Mocker nodded.
        - id: ch01-b50
          speaker: mocker_mockingbird
          text: >-
            Yes, Jenny and I are relatives. Each of us belongs to a different branch of the same family.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Then Mocker burst into Mr. Wren's own song. Afterward, he excused himself and went to find Mrs. Mocker. As he explained, it was time for the two of them to begin thinking about a nest.
