audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    snowflake_snow_bunting:
      display_name: Snowflake the Snow Bunting
      tts:
        delivery: cheerful, hardy, and matter-of-fact
        timbre: light and crisp
        pace: moderate
        pitch: medium-high
    wanderer_horned_lark:
      display_name: Wanderer the Horned Lark
      tts:
        delivery: friendly, confident, and lightly amused
        timbre: mellow and clear
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: More Friends Come With the Snow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Slaty the Junco had been right. More snow was coming. Rough Brother North Wind hurried one great cloud after another across the sky, and late that afternoon, white, feathery flakes began drifting down.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter Rabbit stayed snug in the dear Old Briar-patch. He did not stir all night. Instead, he crouched just inside the entrance of an old hole that Johnny Chuck's grandfather had dug long ago, right in the middle of the open patch.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Before morning, the snow stopped. Then Brother North Wind worked just as hard to drive the clouds away as he had worked to bring them.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jolly, round, bright Mr. Sun started his daily climb into the blue, blue sky and looked down on a world of white. It seemed as though every tiny snowflake twinkled back at every little sunbeam. The whole world around Peter was lovely that morning. He rejoiced at the sight and scampered out to find his breakfast.
        - id: ch01-b05
          speaker: narrator
          text: >-
            First he went to the weedy field where he had met Dotty the Tree Sparrow and Slaty the Junco the day before. They had arrived ahead of him. Both were having the best time imaginable as they picked seeds from the weed tops that rose above the snow. Peter quickly discovered that they were not the only birds looking for seeds there.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter soon saw another bird searching for seeds. He was about the same size as Dotty and Slaty, and he walked busily over the snow. The top of his head, his neck, and his back were soft rusty brown. His wings had some black, but they were mostly white. So were his outer tail feathers, breast, and underparts.
        - id: ch01-b07
          speaker: narrator
          text: >-
            It was Snowflake the Snow Bunting in his winter suit. Peter knew him at once. No other bird of that size and shape wore so much white. Snowflake had appeared so suddenly that he almost seemed to have fallen from the snow clouds with the flakes themselves. Of course, Peter had a question ready.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Are you staying here for the winter, Snowflake?
        - id: ch01-b09
          speaker: narrator
          text: >-
            Snowflake was so busy getting his breakfast that he did not answer right away. As Peter watched him search, he noticed something else. Snowflake never hopped as many small birds did. He always walked or ran. At last, the bird paused long enough to reply.
        - id: ch01-b10
          speaker: snowflake_snow_bunting
          text: >-
            Maybe I will, if this snow means to stay all winter.
        - id: ch01-b11
          speaker: peter_rabbit
          text: What difference does the snow make?
        - id: ch01-b12
          speaker: snowflake_snow_bunting
          text: >-
            I like snow, and I like cold weather. Once the snow starts vanishing, I naturally fly farther north. I don't mind bare ground. In fact, I'm glad when the wind clears a patch, because I can search there for seeds. But when the snow begins melting everywhere, I grow restless.
        - id: ch01-b13
          speaker: snowflake_snow_bunting
          text: >-
            I can't see how anyone can be happy in a place without snow and ice. You won't find me flying far down south. No, indeed! When nesting time comes, I follow Jack Frost all the way to his summer home. I nest on the shore of the Polar Sea, though I suppose you don't know where that is, Peter Rabbit.
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            If you love the cold, snow, and ice of the Far North so much, why come south at all? Why not live there the whole year?
        - id: ch01-b15
          speaker: narrator
          text: Snowflake twittered merrily before answering.
        - id: ch01-b16
          speaker: snowflake_snow_bunting
          text: >-
            Because I have to eat to stay alive, just like everyone else. If you see me down here, the northern snow has grown so deep that every seed is covered. I always watch the weather. The moment it looks as though there will be too much snow for me to find food, I move on.
        - id: ch01-b17
          speaker: snowflake_snow_bunting
          text: >-
            I hope I won't need to go any farther than this. But if you wake one morning and the snow has buried every weed head, don't expect to see me here.
        - id: ch01-b18
          speaker: wanderer_horned_lark
          text: Now that is what I call good common sense.
        - id: ch01-b19
          speaker: narrator
          text: >-
            A bird a little larger than Snowflake landed close by in the snow. At first glance, he seemed to be dressed almost entirely in soft chocolate brown. He immediately began running about in search of seeds. It was Wanderer the Horned Lark.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Peter greeted him with delight. Wanderer had an air of mystery about him, and Peter, as you know, loved a mystery. Peter had known the bird since his first winter, but he had never felt truly acquainted with him. Wanderer might visit two or three times in a winter, yet he rarely stayed more than a few days. There was never much time to learn about him. He and his relatives often arrived with the Snowflakes. The two families were close friends and traveled together a great deal.
        - id: ch01-b21
          speaker: narrator
          text: >-
            When Wanderer stretched up for seeds on a weed top, Peter got a good look at him. First, he noticed two small, hornlike tufts of black feathers above and behind Wanderer's eyes. Those tufts gave the Horned Lark his name. No other bird had anything quite like them.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Wanderer's forehead was yellow. So was the line above each eye, and so was his throat. A black mark curved down from each corner of his bill, passing just below the eye. The two marks nearly met a black band shaped like a crescent across his breast. Below it, his feathers were a dingy white, with dusky spots here and there. His back was brown and looked almost pink in places. His tail was black, though a little white showed along the edges whenever he flew. Put it all together, and Wanderer was a handsome little fellow.
        - id: ch01-b23
          speaker: peter_rabbit
          text: Does everyone in your family have those funny little horns?
        - id: ch01-b24
          speaker: wanderer_horned_lark
          text: No. Mrs. Lark doesn't have them.
        - id: ch01-b25
          speaker: peter_rabbit
          text: Well, I think they look very fine on you.
        - id: ch01-b26
          speaker: wanderer_horned_lark
          text: >-
            Thank you. I rather agree. You ought to see me in my summer suit.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            Does it look very different? This suit is already pretty enough.
        - id: ch01-b28
          speaker: snowflake_snow_bunting
          text: >-
            Nicely said, Peter! I agree that Wanderer's present suit is pretty enough for anyone. Still, his summer suit is even finer. It isn't very different, only brighter, and the black markings are stronger and easier to see. Wanderer is my neighbor in the Far North, so I know him very well.
        - id: ch01-b29
          speaker: wanderer_horned_lark
          text: >-
            Then you don't know anything bad about me, do you?
        - id: ch01-b30
          speaker: narrator
          text: Wanderer chuckled, and Snowflake nodded.
        - id: ch01-b31
          speaker: snowflake_snow_bunting
          text: >-
            Not one thing. I couldn't ask for a better neighbor. You should hear him sing, Peter. He sings while he's high in the air, and his song is truly pretty.
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            I would love to hear it. Why don't you sing for us now, Wanderer?
        - id: ch01-b33
          speaker: wanderer_horned_lark
          text: >-
            This isn't the season for singing. Besides, when you must spend every minute finding enough food, there is no time for a song.
        - id: ch01-b34
          speaker: peter_rabbit
          text: I don't understand why you never stay in one place when you come here.
        - id: ch01-b35
          speaker: wanderer_horned_lark
          text: >-
            Moving around makes it easier to find plenty to eat. I enjoy seeing new places, too. I wouldn't like being tied to one spot the way some birds are. Would you, Snowflake?
        - id: ch01-b36
          speaker: snowflake_snow_bunting
          text: I certainly wouldn't.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Just then, Peter noticed something he had never seen before.
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            Goodness! Each of your back toes has such a long claw!
          emotion: surprised
        - id: ch01-b39
          speaker: narrator
          text: >-
            Peter was right. Each claw on Wanderer's hind toes was about twice as long as any of his other claws. Peter looked at them but could not imagine what special use they might have. He was just about to ask Wanderer about them. At that very moment, however, Wanderer spotted a flock of his relatives some distance away. Before Peter could speak, the Horned Lark flew off to join them.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Perhaps that saved Wanderer some embarrassment. It was doubtful that even he knew why Old Mother Nature had given him such long hind claws.
