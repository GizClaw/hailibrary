audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    snowflake:
      display_name: 雪鹀小雪花
      tts:
        delivery: 爽朗快活，谈起冰雪时格外自豪
        timbre: 清脆轻盈
        pace: 明快
        pitch: 中高音
    wanderer:
      display_name: 角百灵漫游者
      tts:
        delivery: 随性自信，话里常带温和的幽默
        timbre: 温润清亮
        pace: 从容明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 雪后的早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            灰灰猜得一点儿不错，果然又下雪了。粗暴的北风老兄赶来一大团又一大团云。到了傍晚，洁白轻盈的雪花从天空慢慢飘下。兔子彼得整夜都没乱跑，一直安安稳稳地待在亲爱的老蔷薇丛之家。他只蹲在中央那片空地上，一个旧洞的入口里面。那个洞，还是土拨鼠约翰尼的祖父在很久以前挖的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            天亮以前，不知什么时候，雪停了。北风老兄又拼命吹起风来。他先前费了多大的力气吹来云团，现在就使出多大的力气把云吹走。太阳公公圆滚滚、亮堂堂的，快活地开始每天的行程，沿着湛蓝湛蓝的天空往上爬。他低头一看，大地已经变成一片白茫茫的世界。阳光落下来，仿佛每一朵小雪花都在朝每一缕阳光闪烁。眼前的一切美极了。彼得看得满心欢喜，蹦蹦跳跳地出门找早饭去了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他先跑到那片荒草地。头一天，他正是在那里遇见树麻雀小黑点和灯草鹀灰灰。他们已经到了，正从雪面上露出的草穗里啄种子，吃得十分开心。彼得很快发现，来找种子的还有另一只鸟。那只鸟跟小黑点和灰灰差不多大，在雪地上走走跑跑，忙个不停。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他的头顶、颈部和背部都是柔和的锈褐色。翅膀带一点黑色，却大半是白的，尾巴外侧也有白羽，胸脯和身体下面更是一片雪白。原来，这是穿着冬装的雪鹀小雪花。彼得一眼就认出了他，绝不会认错。别的鸟儿里，再没有谁身形和他相仿，身上却白得这么多。小雪花又来得这么突然，简直就像那些雪片一样，也是从雪云里落下来的。彼得一见到他，照例立刻有了问题要问。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 小雪花，你要留在这里过冬吗？
        - id: ch01-b06
          speaker: narrator
          text: >-
            小雪花正忙着吃早饭，没有马上搭话。彼得注意到，他不像许多小鸟那样蹦跳，而是用双脚走，有时也跑。过了一会儿，小雪花才停下来回答。
        - id: ch01-b07
          speaker: snowflake
          text: 要是这场雪会留上一整个冬天，说不定我也会留下。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 你留不留下，为什么要看雪呢？
        - id: ch01-b09
          speaker: snowflake
          text: >-
            因为我爱雪，也爱冷天。雪一开始消退，我自然就往更北的地方飞。光秃秃的地面我也喜欢。风把一处地方的雪吹开，让我能在地上找种子，我高兴还来不及呢。可要是四处的雪都开始融化，我心里就不踏实了。没有冰，没有雪，大家怎么还能住得那么满意？我可不肯飞到老远的南方去，谁也别想叫我去！
        - id: ch01-b10
          speaker: snowflake
          text: >-
            到了筑巢的季节，我会追着寒霜杰克一直向北走，追到他避暑的地方。我在北极海岸边筑巢，那可远得很。当然啦，彼得，你肯定不知道北极海在哪里。
    - id: ch02
      title: 小雪花的好见识
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: >-
            你这么爱遥远北方的严寒，又喜欢那里的冰雪，为什么还要往南飞？一年到头待在北方，不就好了吗？
        - id: ch02-b02
          speaker: snowflake
          text: >-
            因为我也得吃东西才能活呀，彼得。你在这里见到我，就说明北方的雪已经把种子全埋住了。我一直留神天气。只要看着像要下太多雪，害我找不到吃的，我就动身换地方。我希望不用飞得比这里更远。可是，哪天早晨你醒来，要是发现雪深得连草穗都埋没了，那就别找我啦。
          emotion: happy
        - id: ch02-b03
          speaker: wanderer
          text: 这才是实实在在的好见识。
        - id: ch02-b04
          speaker: narrator
          text: >-
            话音刚落，一只比小雪花稍大些的鸟落在旁边的雪地上。他乍看几乎通身都穿着柔软的巧克力褐色衣裳，一落地便立刻四处跑着找种子。原来是角百灵漫游者。彼得欢欢喜喜地向他问好。漫游者身上总带着一点神秘，而彼得最喜欢神秘的事。
        - id: ch02-b05
          speaker: narrator
          text: >-
            彼得出生后的第一个冬天就认识漫游者了，却一直没能真正熟悉他。漫游者每年冬天都会来，有时还来两三回，可每次很少住上几天。他和亲戚常常跟小雪花一家一同出现。两家是很要好的朋友，经常结伴旅行。
        - id: ch02-b06
          speaker: narrator
          text: >-
            漫游者伸长身子去够草穗上的种子，彼得正好仔细看看他。最显眼的，是他双眼上方偏后的两小簇黑羽，活像一对小角。这就是“角百灵”名字的来历，别的鸟可没有。他的前额、眼睛上方的细纹和喉部都是黄色的。从两边嘴角各伸出一道黑纹，弯过眼睛下面，差一点就和胸前的黑色月牙横带连在一起。
        - id: ch02-b07
          speaker: narrator
          text: >-
            横带下面是有些灰脏的白色，还散着几处暗斑。背部是褐色，有的地方微微泛粉。尾巴是黑的，飞起来时，边缘才露出一点白。合在一起看，漫游者真是个十分英俊的小家伙。
        - id: ch02-b08
          speaker: peter_rabbit
          text: 你们全家都长着那对有趣的小角吗？
        - id: ch02-b09
          speaker: wanderer
          text: 不，百灵太太就没有。
        - id: ch02-b10
          speaker: peter_rabbit
          text: 我觉得，这对小角长在你头上特别好看。
        - id: ch02-b11
          speaker: wanderer
          text: 谢谢。我自己也这么觉得。你还真该看看我穿夏装的模样。
        - id: ch02-b12
          speaker: peter_rabbit
          text: 夏装跟现在差得很多吗？我看你这身已经很漂亮了。
    - id: ch03
      title: 北方的好邻居
      blocks:
        - id: ch03-b01
          speaker: snowflake
          text: >-
            说得好，彼得，我完全赞成！漫游者这身衣裳已经漂亮得谁也比不上，不过，他的夏装确实还要好看些。式样没有多大变化，颜色却鲜亮多了，身上的黑色斑纹也会变得更浓、更醒目。漫游者是我在遥远北方的邻居，他的事，我可全知道。
        - id: ch03-b02
          speaker: wanderer
          text: 这么说，你从没发现我有什么坏处，对不对？
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 漫游者说着，咯咯笑了起来。小雪花点点头。
        - id: ch03-b04
          speaker: snowflake
          text: >-
            一点儿坏处也没有。想找个比他更好的邻居，那可找不到。彼得，你真该听听漫游者唱歌。他会飞到空中去唱，那歌声可好听了。
        - id: ch03-b05
          speaker: peter_rabbit
          text: 我可太想听了。漫游者，你为什么不在这里唱一首？
        - id: ch03-b06
          speaker: wanderer
          text: >-
            现在不是唱歌的季节。再说，我每一分钟都得忙着找吃的，哪还有时间唱歌？
        - id: ch03-b07
          speaker: peter_rabbit
          text: 还有一件事我不懂。你既然来了，为什么不在一个地方住下呢？
        - id: ch03-b08
          speaker: wanderer
          text: >-
            因为到处走一走，比较容易找到足够的食物，把肚子填饱。再说，我就是喜欢去没见过的新地方。像我认识的某些鸟那样，被拴在一个地方，哪儿也不去，我可不会觉得快活。小雪花，换成你，你愿意吗？
        - id: ch03-b09
          speaker: snowflake
          text: 我当然也不愿意。
        - id: ch03-b10
          speaker: narrator
          text: 就在这时，彼得忽然发现了一件过去从没留意过的事。
        - id: ch03-b11
          speaker: peter_rabbit
          text: 我的天哪！你两只脚的后趾上，怎么各有一只这么长的爪子？
          emotion: surprised
    - id: ch04
      title: 长长的后爪
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            彼得看得没错。漫游者的两只后爪，每一只都差不多有其他任何一只爪子的两倍长。可是，后爪长成这样究竟有什么特别用处，彼得怎么也看不出来。他正想问个明白，漫游者却突然发现远处有一群自己的亲戚，马上张开翅膀，飞过去和他们会合了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            这一飞，大概正好替漫游者免去了一点尴尬。因为就连他自己，恐怕也说不清，大自然老妈妈为什么送给他这样一双长长的后爪。
