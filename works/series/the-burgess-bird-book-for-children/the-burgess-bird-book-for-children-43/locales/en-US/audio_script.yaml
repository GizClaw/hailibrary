  chapters:
    - id: ch01
      title: Queer Feet and a Queerer Bill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit went into the Green Forest to visit his cousin, Jumper the Hare, who lived there all the time. Jumper's tracks were easy to find in the snow, and Peter followed them until he nearly ran into him. He had not seen Jumper because his coat was as white as the snow. Crouched beneath a small, snow-covered hemlock, Jumper looked like a little mound of snow.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            Oh, you startled me! I wish I had a winter coat like yours. It must help you hide from your enemies.
          emotion: surprised
        - id: ch01-b03
          speaker: jumper_the_hare
          text: >-
            It certainly does, Cousin Peter. If the air is still and can't carry my scent, nine times out of ten I only need to sit without moving. Reddy Fox has passed within a few feet of me without knowing I was there. I hope the snow stays all winter. When the ground is brown with dead leaves, my white coat can be seen from far away. Then I worry every minute.
        - id: ch01-b04
          speaker: narrator
          text: Peter chuckled.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            That's when I feel safest. I like snow, but my brown-gray coat stands out against it. Isn't the Green Forest lonely now that the birds have gone, Cousin Jumper?
        - id: ch01-b06
          speaker: narrator
          text: Jumper shook his head.
        - id: ch01-b07
          speaker: jumper_the_hare
          text: >-
            They haven't all gone, Peter. Strutter the Grouse and Mrs. Grouse are still here. I see them every day, and now they have snowshoes.
        - id: ch01-b08
          speaker: narrator
          text: Peter blinked, looking puzzled.
        - id: ch01-b09
          speaker: peter_rabbit
          text: Snowshoes? What do you mean?
          emotion: surprised
        - id: ch01-b10
          speaker: jumper_the_hare
          text: Come along, and I'll show you.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Jumper led the way, with Peter following close at his heels. Before long, they came upon tracks in the snow. Peter studied them. At first glance, they reminded him of the strange marks Farmer Brown's ducks made in the summer mud along the edge of the Smiling Pool.
        - id: ch01-b12
          speaker: peter_rabbit
          text: Those tracks look very odd. Who made them?
        - id: ch01-b13
          speaker: jumper_the_hare
          text: Keep following me, and you'll find out.
        - id: ch01-b14
          speaker: narrator
          text: >-
            They followed the tracks until they saw Strutter the Grouse just ahead. Peter's eyes opened wide when he realized Strutter had made those unusual marks.
        - id: ch01-b15
          speaker: jumper_the_hare
          text: Cousin Peter would like to see your snowshoes, Strutter.
        - id: ch01-b16
          speaker: narrator
          text: Strutter's bright eyes sparkled.
        - id: ch01-b17
          speaker: strutter_the_grouse
          text: >-
            He's as curious as ever, isn't he? I don't mind showing him. I think my snowshoes are quite wonderful myself.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Strutter lifted one foot and spread his toes apart for Peter to see. Along both sides of each toe grew rows of strange little hard points, all set close together. They nearly filled the spaces between his toes. Peter remembered seeing those same feet in summer. The toes had been smooth then, and each one had left a clear outline whenever Strutter walked across soft ground.
        - id: ch01-b19
          speaker: peter_rabbit
          text: How strange!
          emotion: surprised
        - id: ch01-b20
          speaker: strutter_the_grouse
          text: >-
            There's nothing strange about them. If Old Mother Nature hadn't given me something like this, I'd have a terrible time whenever snow covered the ground. With the same feet I have in summer, I'd sink right down into soft snow. I wouldn't be able to walk around at all. These snowshoes spread my weight, so I sink only a little and get along very nicely.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Strutter took three or four steps across the soft snow. Peter watched his broad feet stay close to the surface instead of sinking far down, and he immediately saw how useful those snowshoes were.
        - id: ch01-b22
          speaker: peter_rabbit
          text: My! I wish Old Mother Nature would give me snowshoes too.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Strutter and Jumper both laughed. For a moment Peter wondered what was so funny, and then he understood how impossible it would be for a rabbit to have anything like Strutter's snowshoes. Peter began laughing with them.
        - id: ch01-b24
          speaker: jumper_the_hare
          text: >-
            Cousin Peter was just saying that the Green Forest must be lonely for me now. He forgot that you and Mrs. Grouse stay here all winter. And he forgot something else. Most of the birds that spent the summer here have gone, but other birds come down from the Far North and take their places.
        - id: ch01-b25
          speaker: peter_rabbit
          text: Who comes down from the Far North?
        - id: ch01-b26
          speaker: jumper_the_hare
          text: >-
            Snipper the Crossbill, for one. I haven't seen him yet this winter, but I know he's here. This morning I found pine seeds on the snow beneath a certain tree.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            Huh! That proves nothing. The seeds may have fallen by themselves, or Chatterer the Red Squirrel may have dropped them.
        - id: ch01-b28
          speaker: jumper_the_hare
          text: >-
            Seeds don't simply fall at this time of year, and the signs tell me Chatterer hasn't been there. Let's go to that tree and see what we find.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Once again Jumper led the way, and Peter followed him through the snow. As they drew near that particular pine tree, a short, whistled note made them both look up. Near the top of the tree, a bird was busily working at a pine cone. He was about the size of Bully the English Sparrow. Dull red feathers covered his body, while his wings and tail were brownish black.
        - id: ch01-b30
          speaker: jumper_the_hare
          text: >-
            What did I tell you? There's Snipper now, and the next tree is full of his family and relatives. Look how they move among the branches. They don't hop or flit. They climb around instead. I don't know another bird near here that moves that way.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Just then, a seed dropped from above and landed on the snow almost in front of Peter's nose. Snipper himself came down after it at once. He picked up the seed and ate it without the least concern. Peter and Jumper stood only a foot or two away, but Snipper behaved as if they were a mile from him. The very first thing Peter noticed at such close range was Snipper's bill. The upper and lower halves crossed at the tips. It looked as though Snipper had struck something hard and twisted both tips sideways.
        - id: ch01-b32
          speaker: peter_rabbit
          text: Have you had an accident?
        - id: ch01-b33
          speaker: narrator
          text: Peter asked the question hesitantly. Snipper looked surprised.
        - id: ch01-b34
          speaker: snipper_the_crossbill
          text: Are you speaking to me? Why would you think that?
          emotion: surprised
        - id: ch01-b35
          speaker: peter_rabbit
          text: Your bill. How did the tips get bent across each other?
        - id: ch01-b36
          speaker: narrator
          text: Snipper laughed.
        - id: ch01-b37
          speaker: snipper_the_crossbill
          text: >-
            They aren't bent. Old Mother Nature made my bill this way, and I don't know what I'd do if it were shaped any differently.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Peter scratched one long ear, as he always did when something puzzled him.
        - id: ch01-b39
          speaker: peter_rabbit
          text: I can't understand how you pick up food with a bill like that.
        - id: ch01-b40
          speaker: snipper_the_crossbill
          text: And I couldn't get my food without it.
        - id: ch01-b41
          speaker: narrator
          text: Snipper saw that Peter truly did not understand, so he explained.
        - id: ch01-b42
          speaker: snipper_the_crossbill
          text: >-
            I live mostly on the seeds that grow inside pine cones and the cones of other trees. Of course, I eat some other food too, such as other seeds and the buds of trees. But the seeds hidden in evergreen cones are what I love best. If you've ever looked closely at one of those cones, you know those seeds aren't easy to reach. My crossed bill makes the job simple. I can snip the seeds out just as easily as birds with straight bills can pick up ordinary seeds. You see, the two crossed tips work very much like a pair of scissors.
        - id: ch01-b43
          speaker: peter_rabbit
          text: >-
            That really is wonderful. Snipper, why have I never seen you here during summer?
        - id: ch01-b44
          speaker: snipper_the_crossbill
          text: >-
            It's the same reason you don't see Snowflake, Wanderer the Horned Lark, and some other northern birds here in summer. Give me the Far North every time. I'd gladly stay there through the whole year, but sometimes there isn't enough food. That shortage is what brings me down here. And now, if you'll excuse me, I'd like to finish my breakfast.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Snipper flew back into the tree where the other Crossbills were feeding. Peter and Jumper stood watching them.
        - id: ch01-b46
          speaker: jumper_the_hare
          text: >-
            I suppose you know that Snipper has a cousin who looks almost exactly like him. There is just one easy difference to watch for. His cousin has two white bars across each wing, and he's called the White-winged Crossbill.
        - id: ch01-b47
          speaker: peter_rabbit
          text: >-
            I didn't know that, but I'm glad you told me. I'll watch for him. I still can't get over those remarkable bills. No one could mistake a Crossbill for any other bird. Is there anyone else from the Far North that I haven't met yet?
