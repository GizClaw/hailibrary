audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jumper_the_hare:
      display_name: 野兔跳跳
      tts:
        delivery: 友善务实，说话沉着而有把握
        timbre: 温暖醇和
        pace: 从容
        pitch: 中低音
    strutter_the_grouse:
      display_name: 松鸡阔步
      tts:
        delivery: 自豪爽朗，语气干脆实在
        timbre: 饱满清晰
        pace: 稳健
        pitch: 中低音
    snipper_the_crossbill:
      display_name: 交嘴雀剪嘴
      tts:
        delivery: 爽快自信，谈吐自然利落
        timbre: 明亮清澈
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 古怪的脚和更古怪的嘴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得来到绿森林，拜访一年到头都住在这里的表哥野兔跳跳。跳跳留在雪地上的足迹一点儿也不难找，彼得一路跟过去，终于追上了他。其实，彼得差一点儿撞到跳跳身上才看见他。原来，跳跳穿着一件跟雪一样白的冬衣，又蹲在一棵覆着雪的小铁杉下面，看上去就像一小堆雪。
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            哎呀，你把我吓了一跳！要是我也有这样的冬衣就好了。你躲起敌人来，一定方便得多。
          emotion: surprised
        - id: ch01-b03
          speaker: jumper_the_hare
          text: >-
            那当然啦，彼得表弟。只要没有风把我的气味送出去，十次里有九次，我只管一动不动地坐着就能躲过去。狐狸雷迪曾从离我几英尺远的地方走过，压根儿没想到我就在近旁。我真希望这场雪能在地上留一整个冬天。只有没雪的时候，我才格外担心。这一身白衬着满地褐色的枯叶，老远就会被看见，叫我一分钟也安不下心。
        - id: ch01-b04
          speaker: narrator
          text: 彼得听了，咯咯笑起来。
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            你最担心的时候，正是我最安心的时候。我喜欢雪，可我这身棕灰色的毛在雪地上太显眼了。跳跳表哥，鸟儿都走了，你独自住在绿森林里，不觉得冷清吗？
        - id: ch01-b06
          speaker: narrator
          text: 跳跳摇了摇头。
        - id: ch01-b07
          speaker: jumper_the_hare
          text: >-
            彼得，你也知道，鸟儿并没有全走呀。松鸡阔步和阔步太太还在这里，我天天都能看到他们。再说，他们如今还穿上雪鞋了呢。
        - id: ch01-b08
          speaker: narrator
          text: 彼得眨巴着眼睛，听糊涂了。
        - id: ch01-b09
          speaker: peter_rabbit
          text: 雪鞋？那是什么意思？
          emotion: surprised
        - id: ch01-b10
          speaker: jumper_the_hare
          text: 跟我来，我带你看看。
        - id: ch01-b11
          speaker: narrator
          text: >-
            跳跳走在前面，彼得紧跟在他的脚后。不久，他们发现了几串雪地脚印。乍一看，彼得便想起夏天时，农夫布朗的鸭子在微笑池塘岸边的泥地上留下的那些怪印子。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 这脚印真怪。是谁踩出来的？
        - id: ch01-b13
          speaker: jumper_the_hare
          text: 接着跟我走，你马上就会知道。
        - id: ch01-b14
          speaker: narrator
          text: >-
            他们循着脚印继续往前，没多久便看见松鸡阔步就在前方不远处。彼得这才发现，那些奇怪的脚印正是阔步留下的，惊得眼睛都瞪大了。
        - id: ch01-b15
          speaker: jumper_the_hare
          text: 阔步，彼得表弟想瞧瞧你的雪鞋。
        - id: ch01-b16
          speaker: narrator
          text: 阔步的亮眼睛闪了闪。
        - id: ch01-b17
          speaker: strutter_the_grouse
          text: >-
            他还是那么好奇，对吧？让他瞧瞧也没什么。说实话，连我自己都觉得这双雪鞋了不起。
        - id: ch01-b18
          speaker: narrator
          text: >-
            阔步抬起一只脚，把脚趾一根根张开，让彼得仔细看。每根脚趾两侧都长着一排古怪的角质小尖片，挨得紧紧的，几乎填满了趾间的空隙。彼得记得，夏天见到阔步时，这些脚趾还是光溜溜的。那时阔步踩过松软的地面，每一根脚趾都会留下清清楚楚的轮廓。
        - id: ch01-b19
          speaker: peter_rabbit
          text: 真滑稽！
          emotion: surprised
        - id: ch01-b20
          speaker: strutter_the_grouse
          text: >-
            这可没什么滑稽的。地上有雪时，要不是大自然母亲给了我这样的东西，我的日子就要难过了。要是脚还跟夏天时一模一样，我一踩上软雪就会一直陷下去，根本没法四处走动。有了这双雪鞋，我只会稍稍陷进去一点儿，走起来轻松多了。
        - id: ch01-b21
          speaker: narrator
          text: 阔步在雪地上走了三四步。彼得看见他只稍稍陷下去一点儿，马上就明白，这双雪鞋确实非常管用。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 天哪！真希望大自然母亲也送我一双雪鞋。
        - id: ch01-b23
          speaker: narrator
          text: >-
            阔步和跳跳一起笑了。过了一小会儿，彼得也跟着笑起来。因为他终于明白，兔子根本不可能长出阔步那样的雪鞋。
        - id: ch01-b24
          speaker: jumper_the_hare
          text: >-
            彼得表弟刚才还说，我一个人住在绿森林里一定很冷清。他忘了你和阔步太太整个冬天都会留在这里。他还忘了另一件事。夏天住在这里的鸟儿虽然大多飞走了，可别的鸟儿会从遥远的北方飞来，接替他们的位置。
        - id: ch01-b25
          speaker: peter_rabbit
          text: 都有谁呀？
        - id: ch01-b26
          speaker: jumper_the_hare
          text: >-
            比如交嘴雀剪嘴。今年冬天我还没见到他，不过我知道他来了。今天早晨，我在一棵树下的雪地上发现了一些松籽。
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            哼，这可证明不了什么。松籽也许是自己掉的，也许是红松鼠喋喋丢下的。
        - id: ch01-b28
          speaker: jumper_the_hare
          text: >-
            这个季节，松籽不会自己掉下来。我从周围的痕迹也看得出，喋喋没来过。咱们现在就过去瞧瞧。
        - id: ch01-b29
          speaker: narrator
          text: >-
            跳跳再次带路，彼得跟在后面。快到那棵松树时，一声短促的哨音让他们一起抬起了头。树梢附近有只鸟，正在忙着摆弄一枚松果。他跟恶霸英国麻雀差不多大，浑身披着暗红色的羽毛，翅膀和尾巴则是棕黑色的。
        - id: ch01-b30
          speaker: jumper_the_hare
          text: >-
            我说什么来着？剪嘴这会儿不就在那儿吗？旁边那棵树上还有他的一大群家人和亲戚。瞧他们在树枝间活动的样子多有趣。他们既不扑棱着飞，也不蹦跳，只是沿着树枝爬来爬去。我还不知道这一带有哪一种鸟也会这样呢。
        - id: ch01-b31
          speaker: narrator
          text: >-
            这时，一粒种子从上面掉下来，落在彼得鼻子前方不远的雪地上。剪嘴本人马上跟着飞下来，捡起种子就吃。他毫不在意彼得和跳跳就在一两英尺外，仿佛他们远在一英里之外。凑近一看，彼得首先注意到的就是剪嘴的嘴。上下两半的尖端交叉在一起，活像剪嘴撞过什么硬东西，把两个尖儿都撞歪了。
        - id: ch01-b32
          speaker: peter_rabbit
          text: 你……你是不是出了什么意外？
        - id: ch01-b33
          speaker: narrator
          text: 彼得问得有些迟疑。剪嘴吃惊地看着他。
        - id: ch01-b34
          speaker: snipper_the_crossbill
          text: 你是在跟我说话吗？你怎么会这么想？
          emotion: surprised
        - id: ch01-b35
          speaker: peter_rabbit
          text: 我说的是你的嘴。怎么扭成这样了？
        - id: ch01-b36
          speaker: narrator
          text: 剪嘴笑了。
        - id: ch01-b37
          speaker: snipper_the_crossbill
          text: >-
            我的嘴没有扭歪。大自然母亲把我造成这样。它要是长得不一样，我才不知道该怎么办呢。
        - id: ch01-b38
          speaker: narrator
          text: 彼得一遇到想不明白的事情，就会挠一只长耳朵。这回也一样。
        - id: ch01-b39
          speaker: peter_rabbit
          text: 我实在不明白。你长着这样的嘴，怎么捡得起食物呢？
        - id: ch01-b40
          speaker: snipper_the_crossbill
          text: 可我的嘴要不是这样，我才没法弄到食物呢。
        - id: ch01-b41
          speaker: narrator
          text: 剪嘴看出彼得是真的糊涂，便给他解释起来。
        - id: ch01-b42
          speaker: snipper_the_crossbill
          text: >-
            我主要靠松果和其他树木的球果里长出的种子生活。当然，我也吃些别的东西，比如其他种子和树芽。不过，我最爱吃的，还是常青树球果里的种子。你只要仔细看过那种球果，就会知道，藏在里面的种子可不容易取出来。不过有了这样的嘴，我一点儿也不为难。我能轻轻松松把种子剪出来，就像直嘴的鸟儿啄起种子一样容易。你瞧，我的嘴很像一把剪刀。
        - id: ch01-b43
          speaker: peter_rabbit
          text: >-
            这真了不起。剪嘴，你能不能告诉我，为什么夏天时我从没在这里见过你？
        - id: ch01-b44
          speaker: snipper_the_crossbill
          text: >-
            这跟你夏天见不到雪花、角百灵游游，还有其他几位朋友，是同一个缘故。要我挑地方，我每次都会选遥远的北方。我情愿一年到头都待在那里，只是那儿有时食物会不够吃，所以我现在才来到这里。要是你不介意，我得回去吃完早饭了。
        - id: ch01-b45
          speaker: narrator
          text: 剪嘴飞回那棵树上，跟其他正在取食的交嘴雀一起忙碌。彼得和跳跳站在下面，望着这群鸟儿。
        - id: ch01-b46
          speaker: jumper_the_hare
          text: >-
            你大概知道，剪嘴有一位表亲，长得几乎跟他一模一样。只有一点不同，他的两边翅膀上各有两道白斑，所以人们叫他白翅交嘴雀。
        - id: ch01-b47
          speaker: peter_rabbit
          text: >-
            我以前不知道，不过很高兴你告诉了我。我一定会留心找他。我还是忘不了那些古怪的嘴，实在太不可思议了。谁也不可能把交嘴雀错认成别的鸟。现在，还有哪一位从遥远北方来的客人，是我没有见过的吗？
