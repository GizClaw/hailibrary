cover_prompt: |-
  A wordless cover scene in a New England orchard in the early twentieth century shows a small brown-and-gray rabbit sitting upright beside a tumble-down stone wall as spring birds gather around him. A tiny warm-brown house wren perches close by with her tail cocked, while a blue-backed bluebird with a rusty breast and a robin with a dark head and reddish breast settle on blossoming apple branches. The rabbit looks up attentively as the wren sings, making the lively meeting between the woodland listener and his feathered neighbors the focal action. Beyond them lie a green meadow, a quiet pond edge, and the sunlit trees of a forest, suggesting the many bird homes explored through the year. Use a wide child-height view with the rabbit and nearest birds clearly readable in the lower middle, layered natural habitat behind them, and calm open morning sky across the top. Keep the animals anatomically believable, gentle, and child-friendly, with seasonally accurate plumage and a welcoming sense of discovery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
