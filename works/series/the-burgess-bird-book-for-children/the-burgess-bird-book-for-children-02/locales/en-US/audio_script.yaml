  chapters:
    - id: ch01
      title: The Old Orchard Bully
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit's eyes twinkled when Jenny Wren said she needed to inspect her old house and see whether it was still fit to live in.
        - id: ch01-b02
          speaker: peter_rabbit
          text: I can spare you the trouble.
        - id: ch01-b03
          speaker: narrator
          text: Jenny's voice turned very sharp.
        - id: ch01-b04
          speaker: jenny_wren
          text: What exactly do you mean by that?
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            Your old house already has someone living in it. Bully the English Sparrow moved in two months ago, and he has quite a family there now.
        - id: ch01-b06
          speakers: [jenny_wren, mr_wren]
          ensemble: duo
          text: What?
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: >-
            Jenny and Mr. Wren screamed together. They didn't even say good-by to Peter. They flew off in a great rage to find out whether his news was true. Before long, Peter heard both of them scolding as fast as their tongues could move, which was very fast indeed.
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            They won't accomplish much that way. They'll have to choose a new home this year. Every sharp tongue in the world couldn't force Bully the English Sparrow out. My, my, my, what a racket! I think I'll go see what's happening.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Peter hopped to a spot where he could see Jenny's old home clearly without straying too far from the safety of the old stone wall. Her home was a hole in one of the old apple trees. Mrs. Bully sat in the little round doorway and filled it almost completely. She was shrieking with excitement.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Nearby, Jenny and Mr. Wren hopped and fluttered from twig to twig. Their tails pointed almost straight toward the sky, and their tongues never stopped scolding. Bully flew savagely at one and then the other. His own harsh cries nearly drowned out their voices.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Bully was about one fourth larger than Mr. Wren, though he looked half again as big. His new spring suit might have been fairly handsome if it hadn't been so dirty. Bully loved dust baths, cared nothing about his appearance, and never took care of himself. His back was ashy, striped with black and chestnut. His brown wings each had a white bar. His throat and breast were black, the feathers below them were a dirty white, and he had white along the sides of his throat and chestnut on the back of his neck.
        - id: ch01-b12
          speaker: narrator
          text: >-
            As he hopped about, Bully ruffled his feathers and lifted his wings a little. That made him seem much larger than he truly was. He looked like a fierce little savage ready to fight.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The noise drew every other bird in the Old Orchard. They all screamed for Jenny and Mr. Wren to defend their rights. Not one had anything kind to say about Bully or his wife. It was certainly a disgraceful neighborhood quarrel.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Bully the English Sparrow was born to fight. Nothing pleased him more than being in the middle of a fight or some other fuss. He didn't care in the least that every neighbor stood against him.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Jenny and Mr. Wren were no cowards, but even together they were no match for Bully. He would fly fiercely at any watcher who came close enough, including birds twice his size. The others could have driven him out of the Old Orchard if they had truly tried. His bold manner and fierce appearance frightened them before they made the attempt.
        - id: ch01-b16
          speaker: narrator
          text: >-
            All this time, Mrs. Bully remained in the little round doorway, urging her husband on. As long as she stayed there, neither Jenny nor Mr. Wren could possibly get inside. The truth was that Mrs. Bully enjoyed every moment. She loved quarreling and fighting just as much as Bully did.
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            You sneaked in and stole my house! It belongs to me, and you'd better get out right now!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: >-
            Jenny shrieked each word and jerked her tail as she hopped about, always staying just beyond Bully's reach.
        - id: ch01-b19
          speaker: bully
          text: >-
            It used to be your house, but now it's mine, you little speck of nothing! Go ahead and try to throw us out. You never built this place, and you abandoned it when you flew south last fall. It belongs to me now, and nobody in the Old Orchard can make me leave!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: >-
            Bully rushed at Jenny like a little fury. Peter Rabbit nodded as he watched.
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            Bully is right about that much. I don't like him, and I never will, but he does have a right to the house. If you leave something behind for half a year, you can't expect to return and find it exactly as you left it.
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            My, my, my, listen to that awful noise! Why don't all the birds join together and chase Bully and Mrs. Bully out of the orchard? If they don't, I'm afraid Bully will chase them away instead. No one wants such quarrelsome neighbors. Those sparrows don't belong in this country anyway. We'd be much better off without them. Still, I have to admire their courage.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Bully kept darting savagely at one bird after another. He was having a wonderful time. No one else could say the same, except Mrs. Bully.
        - id: ch01-b24
          speaker: bully
          text: >-
            I'll show every one of you that I'm here to stay! If you don't like it, come and fight me. I'm not afraid of one of you, or even all of you together!
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: >-
            That was nothing but boasting, yet it worked. Bully made the other birds believe him. Not one dared face him in a fight. They called him a bully and shouted every bad name they knew, but their words did nothing to win back the Wrens' house. Bad names don't hurt anyone. Brave deeds are what count, not brave words.
        - id: ch01-b26
          speaker: narrator
          text: >-
            No one knows how long that shameful quarrel might have continued. Then, right in the middle of it, someone spotted Black Pussy. She was the cat from Farmer Brown's house, and she was creeping through the Old Orchard. Her tail twitched while her yellow eyes stared eagerly ahead.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Black Pussy had heard the terrible racket. She suspected that all the excitement might give her a chance to catch one of the feathered folk. At a time like that, you could always trust Black Pussy to appear.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The moment the birds discovered her, they forgot everything else. Bully led the way, with Jenny and Mr. Wren close behind. Every bird turned on Black Pussy. She was the enemy of them all, so their own quarrel vanished at once.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Only Mrs. Bully stayed behind in the little round doorway. She wasn't going to risk herself, though she added her cries to the general din. How those birds screamed and shrieked! They swooped almost into Black Pussy's face. Bully the English Sparrow and Jenny Wren went closer than any of the others.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Black Pussy hated having so much attention fixed on her. Now that the birds had found her, she knew she had no chance at all of catching one of the Old Orchard folk. Her tail still twitched angrily as she turned away. Then she left the orchard with as much dignity as she could manage.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The birds followed her all the way to the edge. They shrieked, screamed, called her dreadful names, and threatened all sorts of terrible things, just as though they could truly carry out those threats.
        - id: ch01-b32
          speaker: narrator
          text: >-
            At last, Black Pussy disappeared toward Farmer Brown's barn. The angry sound of the birds changed in a very funny way, and Peter Rabbit laughed aloud. Every voice now rang with triumph. Then the birds went back to their own affairs.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Jenny and Mr. Wren seemed to have forgotten Bully, his wife, and their old house. They flew to another part of the orchard, where they could talk everything over, rest, and catch their breath.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Peter waited to see whether they would come close enough for more gossip, but they never did. At last, he started home toward the dear Old Briar-patch.
        - id: ch01-b35
          speaker: narrator
          text: >-
            All the way home, Peter chuckled as he remembered how bravely Jenny and Mr. Wren had stood up for their rights.
