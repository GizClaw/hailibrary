audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
    mr_wren:
      display_name: 鹪鹩先生
      tts:
        delivery: 热情勇敢，情绪来得直率
        timbre: 清亮饱满
        pace: 明快
        pitch: 高音
    bully:
      display_name: 恶霸英国麻雀
      tts:
        delivery: 粗鲁好斗，总带着挑衅和夸耀
        timbre: 粗涩响亮
        pace: 急促有力
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二章　老果园里的恶霸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            鹪鹩珍妮刚说要去检查老房子，看看那里还能不能住，兔子彼得的眼睛就亮了起来。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 这趟麻烦，你不用费心了。
        - id: ch01-b03
          speaker: narrator
          text: 珍妮的声音一下子尖了。
        - id: ch01-b04
          speaker: jenny_wren
          text: 你到底是什么意思？
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            你们那所老房子已经有人住了。恶霸英国麻雀住进去足有两个月，如今连他的一大家子都在那里。
        - id: ch01-b06
          speakers: [jenny_wren, mr_wren]
          ensemble: duo
          text: 什么？
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: >-
            珍妮和鹪鹩先生尖叫一声，气冲冲地飞走了，连一句再见也没顾上说。他们要亲眼看看彼得的话是真是假。没过多久，彼得就听见两张利嘴使出最快的速度骂了起来。鹪鹩的舌头本来就快，这一回更是快得惊人。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            他们骂成这样也没有用。今年准得另找住处。就算把全世界最厉害的嘴都叫来，也别想让恶霸英国麻雀挪地方。天哪，听听这动静！我得过去瞧瞧。
        - id: ch01-b09
          speaker: narrator
          text: >-
            彼得说着便蹦了过去。他挑了个地方，既能看清珍妮的老家，又离安全的老石墙不太远。那所老家藏在一棵老苹果树的树洞里。此刻，恶霸太太坐在小圆门口，身子把门塞得满满的，还在兴奋地尖叫。珍妮和鹪鹩先生在附近的细枝间又跳又飞，尾巴几乎直指天空，嘴里一刻不停地责骂。恶霸本人更凶。他冲向珍妮，又扑向鹪鹩先生，粗厉的叫声几乎把他们都盖住了。
        - id: ch01-b10
          speaker: narrator
          text: >-
            其实，恶霸只比鹪鹩先生大四分之一，看上去却像大了一半。他本来还算长得不错，可他喜欢在尘土里洗澡，又从来不肯收拾自己，一身新换的春装总是脏兮兮的。他的背是灰白色，夹着黑色和栗色的条纹。褐色的两只翅膀上，各有一道白斑。喉部和胸脯乌黑，下面是污白色。喉咙两旁雪白，颈后则是栗色。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他蹦来蹦去，把羽毛全鼓起来，两只翅膀微微抬着，故意让自己显得更大，活像个好斗的小野蛮人。争吵声把老果园里的鸟全招来了。大家围在一旁纷纷高声叫喊，催珍妮夫妇守住自己的权利，谁也不肯替恶霸夫妇说一句好话。这场邻里争吵，实在太不像样了。
        - id: ch01-b12
          speaker: narrator
          text: >-
            恶霸英国麻雀天生爱打架。只要哪里有争斗，有吵闹，他身在其中就快活极了。所有邻居都反对他，他也根本不在乎。珍妮和鹪鹩先生并不胆小，可两人合力也斗不过他。只要有围观的鸟飞得稍近，恶霸照样凶狠地扑过去。哪怕对方比他大一倍，他也敢动手。
        - id: ch01-b13
          speaker: narrator
          text: >-
            大家若真一齐出力，原本可以赶走恶霸。可单是那股横冲直撞的气势，就把他们全吓住了。恶霸太太始终守着小圆门，为丈夫助威。她心里清楚，只要自己堵在那里，珍妮夫妇谁也进不去。说实话，她看得非常开心。她和丈夫一样爱争，也一样爱打。
        - id: ch01-b14
          speaker: jenny_wren
          text: >-
            你这个卑鄙的家伙！你是强盗！那是我的房子，赶快从里面滚出来！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 珍妮停在恶霸抓不到的地方，一边跳，一边骂。每说一个词，她的尾巴就猛甩一下。
        - id: ch01-b16
          speaker: bully
          text: >-
            从前是你的又怎么样？现在归我了，你这个小不点儿！你有胆量，就来赶我们走啊！房子又不是你造的。去年秋天你飞去南方，把它扔在这里不管。如今这就是我的家，老果园里没有谁能叫我搬出去！
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: 恶霸像一小团怒火，猛地朝珍妮冲了过去。彼得望着他，点点头，小声嘀咕起来。
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            这件事上，他倒没有说错。我不喜欢他，以后也不会喜欢，可他确实有权住在那里。谁把东西一丢就是半年，回来时就不能指望它还保持原样。天哪，他们吵得可真厉害！大家为什么不合力把恶霸夫妇赶出老果园？要是不赶，恐怕最后被赶走的就是他们自己。谁愿意挨着这种爱吵架的邻居住呢？他们本来就不属于这个国家。少了他们，大家都会过得更好。不过，这两只麻雀的胆量还真让我佩服。
        - id: ch01-b19
          speaker: narrator
          text: >-
            恶霸还在四处猛扑，玩得好不痛快。除了恶霸太太，别人可都没有他的好心情。
        - id: ch01-b20
          speaker: bully
          text: >-
            你们都给我记住，我既然住进老果园，就不会走了！不服气，为什么不来打？不管是一个个上，还是一起上，我一个也不怕！
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: >-
            这当然是吹牛，彻头彻尾的吹牛。偏偏大家都被他唬住了，真以为他什么都不怕，谁也不敢上前交手。他们只顾骂他恶霸，把能想到的难听话都叫出来，可这些话一点儿也不能帮珍妮夫妇夺回房子。骂人不会让人受伤。真正有用的是勇敢去做，而不是嘴上逞强。
        - id: ch01-b22
          speaker: narrator
          text: >-
            要不是后来突然出了件事，谁也不知道这场丢脸的争吵会闹到什么时候。就在大家吵得最凶时，有一只鸟发现黑猫咪正悄悄穿过老果园。她住在农夫布朗家里，此刻尾巴不停抽动，两只黄眼睛贪婪地盯着前方。她听见这里闹翻了天，猜想趁着众鸟慌乱，也许能抓住一个羽族成员。遇到这种机会，黑猫咪总会赶来。
        - id: ch01-b23
          speaker: narrator
          text: >-
            她一被发现，大家立刻忘了别的事。恶霸冲在最前面，珍妮和鹪鹩先生紧跟着他，所有鸟都把目标转向黑猫咪。面对共同的敌人，他们转眼就忘了刚才的争吵，方才还针锋相对，此刻已经一齐对付她了。只有恶霸太太还坐在自家门口。她不肯冒险出去，却也扯开嗓子加入了喧闹。
        - id: ch01-b24
          speaker: narrator
          text: >-
            鸟儿们又尖叫，又吵嚷，接连向下俯冲，几乎贴到了黑猫咪的脸。飞得最近的两个，正是恶霸英国麻雀和鹪鹩珍妮。
        - id: ch01-b25
          speaker: narrator
          text: >-
            黑猫咪最讨厌被这么多双眼睛盯着。既然已经暴露，她知道自己连半点儿机会也没有，再也抓不到老果园里的任何一位居民了。她的尾巴依旧气恼地抽动着。她转过身，尽量维持一副庄严的模样，离开了老果园。
        - id: ch01-b26
          speaker: narrator
          text: >-
            鸟儿们追了上去，一直追到果园边缘。他们一路尖叫，一路骂她，还威胁要做出种种可怕的事，仿佛自己真的办得到一样。
        - id: ch01-b27
          speaker: narrator
          text: >-
            黑猫咪终于朝农夫布朗的谷仓那边消失了。刚才充满怒气的鸟鸣也跟着变了调，变化有趣极了，惹得彼得放声大笑。每一声鸣叫都不再愤怒，反而充满胜利的欢欣。随后，众鸟各自回去忙自己的事。
        - id: ch01-b28
          speaker: narrator
          text: >-
            珍妮和鹪鹩先生似乎也忘了恶霸夫妇还占着自己的老房子。他们飞到老果园的另一边，把刚才的事从头到尾说了一遍，又停下来好好歇一歇，喘过刚才那口气。彼得留在原地等着，希望他们能飞近些，再陪自己聊几句。可他们一直没有过来。
        - id: ch01-b29
          speaker: narrator
          text: >-
            最后，彼得只好动身回到亲爱的老蔷薇丛之家。一路上，他想起珍妮和鹪鹩先生捍卫自己权利时的勇敢劲儿，仍旧忍不住暗自发笑。
