audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    sprite_parula_warbler:
      display_name: Sprite the Parula Warbler
      tts:
        delivery: lively, alert, and quietly self-assured
        timbre: delicate and clear
        pace: quick
        pitch: high
    fidget_myrtle_warbler:
      display_name: Fidget the Myrtle Warbler
      tts:
        delivery: restless, brisk, and teasingly direct
        timbre: light and crisp
        pace: quick
        pitch: high
    weechi_magnolia_warbler:
      display_name: Weechi the Magnolia Warbler
      tts:
        delivery: animated, friendly, and matter-of-fact
        timbre: bright and nimble
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Peter Gets a Lame Neck
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For several days, Peter Rabbit seemed to meet members of the Warbler family wherever he went. He was eager to know every one of them, so he did his best to remember how each bird looked. But there were so many, and some were dressed so much alike, that after a while Peter got hopelessly mixed up. At last he gave up the whole business as a bad job. Then, just as suddenly as they had arrived, most of the Warblers vanished. They had only stopped for a visit on their journey farther north.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter soon forgot all about the Warblers because he was so interested in the lives of his other feathered friends. One day he stopped to rest where the spruce trees grew in the Green Forest. That part of the forest was low and damp. Gray moss grew on many trees and hung down from their branches, making them seem much older than they truly were.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter was gazing idly at one hanging clump when a little bird landed on it and disappeared inside. At least, Peter thought it did. It happened so quickly that he wondered whether his eyes had tricked him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Of course Peter became deeply interested in that moss at once. He stared at it as hard as he could. At first it looked no different from a dozen other clumps nearby. Then he noticed that it was a little thicker, almost as if someone had woven it together. He hopped to one side for a better view. From there, he could see what looked like a small round opening in one side.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter blinked and stared to make certain. Soon a tiny feathered head popped out. A moment later, a dainty little Warbler flew from the hole and perched close beside him.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            Sprite! I'm so glad to see you! I missed you when your cousins came through, so I thought you'd gone north with them.
          emotion: happy
        - id: ch01-b07
          speaker: sprite_parula_warbler
          text: >-
            Well, I didn't go, and I'm not going any farther north. I'm staying right here.
        - id: ch01-b08
          speaker: narrator
          text: >-
            It was Sprite the Parula Warbler. As Peter looked at him, he could not help thinking that there was no daintier bird in the whole Warbler family. Sprite's coat was a soft bluish color with a yellowish patch right in the center of his back. Two white bars crossed each wing. His throat and breast were yellow, with a narrow bluish-black band between them. Along his sides, gray feathers mixed with brownish chestnut.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            Sprite, you really are beautiful. Why didn't I see you in the Old Orchard with your cousins?
        - id: ch01-b10
          speaker: sprite_parula_warbler
          text: >-
            Because I wasn't there. I like the Green Forest better, so I came straight here.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Sprite flitted from place to place as he answered. He simply could not keep still for a minute.
        - id: ch01-b12
          speaker: peter_rabbit
          text: >-
            Then what were you doing inside that clump of moss?
        - id: ch01-b13
          speaker: narrator
          text: >-
            A sudden idea had jumped into Peter's mind.
        - id: ch01-b14
          speaker: sprite_parula_warbler
          text: >-
            Oh, I was only taking a look at it.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Sprite tried his best to look innocent. Just then Peter glanced up and saw a tail slip through the round opening. He knew it belonged to Mrs. Sprite, and that one glimpse told him everything.
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            You have a nest in there! Don't try to deny it, Sprite. That's your nest, and what a lovely place you've chosen!
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: >-
            Sprite saw there was no use trying to fool Peter any longer.
        - id: ch01-b18
          speaker: sprite_parula_warbler
          text: >-
            Yes, Mrs. Sprite and I have a nest in there. We have only just finished it, and I think it's rather nice myself. We always build in moss like this. All we need to do is find a good thick clump, weave it together along the bottom, and line the inside with fine grass. Then our nest looks so much like all the other hanging moss that hardly anyone ever discovers it. I wouldn't trade nests with anybody I know.
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            Aren't you lonely over here by yourselves?
        - id: ch01-b20
          speaker: sprite_parula_warbler
          text: >-
            Not a bit. We aren't nearly as alone as you think. My cousin Fidget the Myrtle Warbler is nesting close by, and my cousin Weechi the Magnolia Warbler is nearby too. They have both started keeping house.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Peter was instantly full of excitement and curiosity.
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            Where are their homes? Tell me, and I'll go visit them right away.
        - id: ch01-b23
          speaker: sprite_parula_warbler
          text: >-
            Peter, you really should know better than to ask me for something like that. You've been around long enough to understand that no secret is more precious than the secret of a home. You happened to discover mine, and I suppose I can trust you not to tell anyone where it is. If you can find Fidget's and Weechi's homes for yourself, that's fine. But I certainly won't give away their hiding places.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Peter knew Sprite was quite right to protect his cousins' secrets. Even so, he could not think of going home without at least trying to find those nests. He put on his most innocent look and asked whether they were hidden in hanging clumps of moss too. But Sprite knew exactly what Peter was trying to do. He was far too clever to be fooled, and Peter learned nothing at all.
        - id: ch01-b25
          speaker: narrator
          text: >-
            For a long time Peter hopped this way and that. Every clump of moss he saw looked as if it simply must contain a nest. But though he looked and looked and looked, he never found another little round opening. There were more mossy clumps than he could count, and at last his neck began to ache from tipping his head back for so long.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter did not have as much patience as he might have had. After a while he quit searching and started toward home. On the higher ground just above that low, swampy place, he came among a great many young hemlock trees. These trees had no moss on them. Peter had given up his search and was thinking about something else when a black-and-gray bird darted across his path. It had a yellow cap, yellow sides, and a yellow patch where its tail began.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Those bright patches were enough. Peter knew at once that this was Fidget the Myrtle Warbler, one of the two birds he had spent so long seeking among the mossy trees.
        - id: ch01-b28
          speaker: peter_rabbit
          text: >-
            Fidget! Wait! I've been searching everywhere for you!
        - id: ch01-b29
          speaker: fidget_myrtle_warbler
          text: >-
            Here I am. You couldn't have searched everywhere, or you'd have found me sooner. What do you want?
        - id: ch01-b30
          speaker: narrator
          text: >-
            Fidget kept hopping and flitting as he spoke. He was never still for even a moment.
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            I want you to tell me where your nest is.
        - id: ch01-b32
          speaker: fidget_myrtle_warbler
          text: >-
            I could tell you, but I won't. Honestly, Peter, do you really think you should ask me that?
        - id: ch01-b33
          speaker: narrator
          text: >-
            Peter lowered his head before answering truthfully.
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            No, I shouldn't. But Sprite told me you had a nest somewhere near his, and I've stared up at moss until there's a crick in my neck.
        - id: ch01-b35
          speaker: fidget_myrtle_warbler
          text: >-
            Moss? What in the world makes you think I have anything to do with moss?
          emotion: surprised
        - id: ch01-b36
          speaker: peter_rabbit
          text: >-
            I... I thought your nest might be in it, just like your cousin Sprite's.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Fidget burst out laughing.
        - id: ch01-b38
          speaker: fidget_myrtle_warbler
          text: >-
            You'd get a much worse crick in your neck before you ever found my nest in a clump of moss! Moss may suit Cousin Sprite, but it doesn't suit me at all. Besides, I don't like those dark places where moss grows on the trees. I make my nest from twigs, grass, and weed stalks. Then I line it with hair, little roots, and feathers. Sometimes I even fasten the whole thing together with spider silk. And if you truly want to know, I like to put it in a small hemlock tree. My nest isn't far from here, but I still won't tell you exactly where it is. Have you seen our cousin Weechi?
        - id: ch01-b39
          speaker: peter_rabbit
          text: >-
            No. Is he somewhere nearby?
        - id: ch01-b40
          speaker: weechi_magnolia_warbler
          text: >-
            I'm right here.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Another voice had answered. Weechi the Magnolia Warbler dropped to the ground directly in front of Peter and stayed there for just a second.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The top of Weechi's head and the back of his neck were gray. A white stripe ran above each eye, and his cheeks were black. His throat was a clear yellow, with a black band just below it. From that band, black streaks ran down across his yellow breast. He had another patch of yellow where his tail began. The top of that tail was mostly black, while the feathers underneath were white.
        - id: ch01-b43
          speaker: narrator
          text: >-
            His wings were black and gray with two white bars. He was a little smaller than Fidget and every bit as restless.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Peter was itching to ask where Weechi's nest was. By now, though, he had learned his lesson, and wisely said nothing.
        - id: ch01-b45
          speaker: weechi_magnolia_warbler
          text: >-
            What were you two talking about?
        - id: ch01-b46
          speaker: fidget_myrtle_warbler
          text: >-
            Nests. I was explaining that Cousin Sprite may enjoy building in the hanging moss down there, but I certainly wouldn't.
        - id: ch01-b47
          speaker: weechi_magnolia_warbler
          text: >-
            Neither would I. I prefer to build a real nest, just as you do. By the way, Fidget, I stopped to look at your nest this morning. I found that we build very much alike, and we even choose the same sort of place for our homes. I suppose you know that I'm quite a close neighbor of yours?
        - id: ch01-b48
          speaker: fidget_myrtle_warbler
          text: >-
            Of course I do. In fact, I watched you begin your nest. Don't you think you put it a little too close to the ground?
        - id: ch01-b49
          speaker: weechi_magnolia_warbler
          text: >-
            Not too close, Fidget. Not at all. I don't need to live high up like some birds. Two or three feet above the ground suits me.
        - id: ch01-b50
          speaker: fidget_myrtle_warbler
          text: >-
            It suits me too.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Fidget and Weechi became so interested in discussing nests and the proper way to build them that they completely forgot Peter Rabbit was there. Peter sat nearby and listened for a while. But he was much more interested in seeing those nests than in hearing the two Warblers talk about them. At last he quietly slipped away to look for the nests himself.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Peter looked and looked. There were so many young hemlocks, and every one seemed just like the others. In the end, his patience ran out, and he gave up the search as a bad job.
