audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    sprite_parula_warbler:
      display_name: 北森莺小精灵
      tts:
        delivery: 活泼机敏，自信而谨慎
        timbre: 纤细清亮
        pace: 轻快
        pitch: 高音
    fidget_myrtle_warbler:
      display_name: 黄腰林莺坐立不安
      tts:
        delivery: 闲不住又爽快，话里带一点打趣
        timbre: 轻盈清脆
        pace: 偏快
        pitch: 高音
    weechi_magnolia_warbler:
      display_name: 木兰林莺维奇
      tts:
        delivery: 活跃友善，说话干脆实在
        timbre: 明亮灵巧
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 苔藓里的家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一连好几天，兔子彼得走到哪儿都能碰见林莺。他很想把每一位都认熟，便拼命记住他们各自的模样。可林莺实在太多，有些还穿得几乎一模一样。没过多久，彼得就彻底弄糊涂，只好承认自己办不到，不再白费力气。接着，他们就像来时那样，忽然又不见了。确切地说，是大多数林莺不见了。原来，他们只在这里歇歇脚，还要继续往更北的地方飞。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得忙着关心其他长羽毛朋友的事情，很快就把林莺忘在了脑后。一天，他来到绿森林里长着云杉的地方，停下来休息。这里地势低洼，又很潮湿。许多树上都生着灰色苔藓，一绺绺从枝头垂下来，把树木衬得比实际年岁苍老了许多。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得正随意望着一枝垂下来的苔藓，心里什么也没想。一只小鸟忽然落到上面，接着钻进去不见了。至少，他觉得自己看见的是这样。事情来得太突然，他实在拿不准是不是眼睛骗了自己。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这下彼得立刻来了兴致，瞪大眼睛，死死盯住那团苔藓。起初，它和旁边的十几团没有分别。看了一会儿，他才发现这一团稍微厚些，像是不知被谁细细编在了一起。他跳到旁边换个角度，好看得更清楚。果然，苔藓一侧像是有个圆圆的小洞。
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得眨眨眼，使劲看个清楚，好确认自己没有看错。一颗长着羽毛的小脑袋从圆洞里探了出来。紧接着，一只精巧玲珑的小林莺飞出洞口，落在离彼得很近的地方。
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            小精灵！见到你真高兴。你的表亲们路过时，我没看见你，还以为你也跟他们飞到遥远的北方去了呢。
          emotion: happy
        - id: ch01-b07
          speaker: sprite_parula_warbler
          text: >-
            我没去，也不打算再往北飞。我就留在这里。
        - id: ch01-b08
          speaker: narrator
          text: >-
            原来，他正是北森莺小精灵。彼得越看越觉得，整个林莺家族里再没有比他更秀气的鸟了。小精灵披着柔和的浅蓝色外衣，后背正中有一小块淡黄色。两边翅膀上各横着两道白纹。他的喉咙是黄色的，紧挨着下方有一圈窄窄的蓝黑色。胸脯又变回黄色，两胁则是灰褐中带着栗色。
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            小精灵，你真漂亮。你的表亲们都在老果园里，我怎么没在那里见到你？
        - id: ch01-b10
          speaker: sprite_parula_warbler
          text: >-
            因为我根本没去呀。我更喜欢绿森林，所以直接到这里来了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            小精灵说话时还在飞来跳去，一分钟也安静不了。
        - id: ch01-b12
          speaker: peter_rabbit
          text: >-
            那你刚才钻进那团苔藓做什么？
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得心里忽然冒出了一个猜想。
        - id: ch01-b14
          speaker: sprite_parula_warbler
          text: >-
            没做什么，不过随便看看。
        - id: ch01-b15
          speaker: narrator
          text: >-
            小精灵竭力装出若无其事的样子。偏在这时，彼得抬头看见一截尾巴钻进了圆洞。他认得那是小精灵太太的尾巴，只这一眼，什么都明白了。
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            你们把巢筑在里面啦！别否认，小精灵，我已经看见了。这个地方用来筑巢，简直好极了！
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: >-
            小精灵知道，再瞒下去也没有用。
        - id: ch01-b18
          speaker: sprite_parula_warbler
          text: >-
            没错，小精灵太太和我就把巢筑在里面。我们才刚刚完工，我自己也觉得它相当不错。我们一向在这样的苔藓里筑巢。只要找一团又密又厚的，把底部编结在一起，再在里面铺好细草就成了。这样一来，巢看上去和周围那些苔藓团一模一样，几乎没有谁找得到。凡是我认识的鸟，不管谁来跟我换巢，我都不换。
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            你们独自住在这儿，不觉得寂寞吗？
        - id: ch01-b20
          speaker: sprite_parula_warbler
          text: >-
            一点也不。我们没你想的那么孤单。我的表亲坐立不安黄腰林莺就在附近筑巢，另一位表亲维奇木兰林莺也住得很近。他们两家都已经过起日子了。
    - id: ch02
      title: 家的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            彼得听了，又兴奋又好奇。
        - id: ch02-b02
          speaker: peter_rabbit
          text: >-
            他们的家在哪儿？快告诉我，我马上去拜访。
        - id: ch02-b03
          speaker: sprite_parula_warbler
          text: >-
            彼得，你早该明白，不应该向我打听这种事。你在外面走了这么多地方，总该知道，没有什么秘密比一个家的秘密更宝贵。你只是碰巧发现了我的家，我想，我可以相信你不会把它的位置告诉别人。坐立不安和维奇的家，你若能凭自己找到，那当然没什么。可我绝不会替他们泄露秘密，更不会告诉你它们藏在哪里。
        - id: ch02-b04
          speaker: narrator
          text: >-
            彼得知道，小精灵不肯泄露表亲们的秘密，做得完全对。可要他连找都不找就回家，他又实在办不到。他装出一副十分天真的样子，问那两个巢是不是也藏在垂下来的苔藓里。小精灵机灵得很，一眼就看穿了他的心思。彼得什么也没能问出来。
        - id: ch02-b05
          speaker: narrator
          text: >-
            接下来好一阵子，彼得这里跳跳，那里蹦蹦。他看见每一团苔藓，都认定里面准藏着一个巢。可他找了又找，望了又望，始终找不到第二个圆圆的小洞。树上的苔藓团多得数也数不清。到最后，他仰着脑袋看得太久，连后颈都酸痛起来。
        - id: ch02-b06
          speaker: narrator
          text: >-
            彼得本来就没多少耐性，过了一会儿便放弃搜寻，动身回家。走到那片低洼湿地上方地势较高的地方，他进了一片幼小的铁杉林。这里的树上全都没有苔藓。彼得已经不再寻找鸟巢，脑子里正想着别的事，一只黑灰相间的小鸟忽然从面前轻盈地飞过。小鸟头顶戴着一顶黄帽子，两胁和尾巴根部也各有一块黄色。
        - id: ch02-b07
          speaker: narrator
          text: >-
            彼得只要看见这几处鲜亮的黄斑，就认出他是黄腰林莺坐立不安。原来，彼得在下面那片长满苔藓的森林里苦苦寻找的两位朋友之一，就在这里。
        - id: ch02-b08
          speaker: peter_rabbit
          text: >-
            坐立不安，等等！我到处都在找你！
        - id: ch02-b09
          speaker: fidget_myrtle_warbler
          text: >-
            我不就在这里吗？你要真找遍了每个地方，早该找到我了。找我有什么事？
        - id: ch02-b10
          speaker: narrator
          text: >-
            坐立不安边说边跳来飞去，片刻也没有停下。
        - id: ch02-b11
          speaker: peter_rabbit
          text: >-
            告诉我，你的巢在哪里。
        - id: ch02-b12
          speaker: fidget_myrtle_warbler
          text: >-
            我当然可以告诉你，可我偏不说。彼得，说句老实话，你真觉得这种事是你该问的吗？
        - id: ch02-b13
          speaker: narrator
          text: >-
            彼得垂下脑袋，老老实实地回答了他。
        - id: ch02-b14
          speaker: peter_rabbit
          text: >-
            不该。可是小精灵说，你就在离他不远的地方筑了巢。我盯着一团又一团苔藓看了那么久，后脖颈都扭得发僵啦。
        - id: ch02-b15
          speaker: fidget_myrtle_warbler
          text: >-
            苔藓团？你怎么会觉得，我跟苔藓团有什么关系？
          emotion: surprised
        - id: ch02-b16
          speaker: peter_rabbit
          text: >-
            我……我只是以为，你和表亲小精灵一样，也把巢筑在苔藓里。
        - id: ch02-b17
          speaker: narrator
          text: >-
            坐立不安放声笑了起来。
        - id: ch02-b18
          speaker: fidget_myrtle_warbler
          text: >-
            恐怕你把脖子扭得比现在还厉害，也休想在苔藓团里找到我的巢！苔藓也许很合表亲小精灵的心意，我却一点儿也不喜欢。再说，我也不爱苔藓长在树上的那些阴暗地方。我的巢用细枝、草和杂草茎搭成，里面铺上毛发、细根和羽毛。有时，我还会用蜘蛛丝把整个巢缠结牢固。你若真想知道，我喜欢把巢安在一棵小铁杉上。它离这里并不远，可具体在哪儿，我还是不会说。你见到我们的表亲维奇了吗？
    - id: ch03
      title: 铁杉林里的邻居
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: >-
            没有。他也在这附近吗？
        - id: ch03-b02
          speaker: weechi_magnolia_warbler
          text: >-
            我就在这里。
        - id: ch03-b03
          speaker: narrator
          text: >-
            原来，另一个声音就在近旁答了话。木兰林莺维奇从树上飞落到地面，就在彼得面前停了短短一小会儿。
        - id: ch03-b04
          speaker: narrator
          text: >-
            维奇的头顶和后颈是灰色的。眼睛上方有一道白纹，两颊则是黑色的。他的喉咙一片明黄，正下方横着一道黑带。一条条黑纹从那里向下伸去，越过黄色的胸脯。他的尾巴根部同样有一块黄色。尾巴上面大多为黑色，下面却是白色。
        - id: ch03-b05
          speaker: narrator
          text: >-
            维奇的翅膀黑灰相间，上面横着两道白纹。他比坐立不安稍小一些，却同样片刻也闲不住。
        - id: ch03-b06
          speaker: narrator
          text: >-
            彼得心里痒得厉害，真想立刻问问维奇把巢筑在哪里。不过到了这时候，他已经从刚才的事里得了教训。这一次，他很聪明地闭紧了嘴巴，一句话也没问。
        - id: ch03-b07
          speaker: weechi_magnolia_warbler
          text: >-
            你们刚才在谈什么？
        - id: ch03-b08
          speaker: fidget_myrtle_warbler
          text: >-
            在谈鸟巢。我正告诉彼得，小精灵也许喜欢下面那些垂挂的苔藓，我可不喜欢。
        - id: ch03-b09
          speaker: weechi_magnolia_warbler
          text: >-
            我也不喜欢。我和你一样，愿意正经搭一个巢。对了，坐立不安，今天早晨我还特意停下来，看了看你的巢。我发现咱们筑巢的办法很像，喜欢安家的地方也差不多。你应该知道，我就是一个离你很近的邻居吧？
        - id: ch03-b10
          speaker: fidget_myrtle_warbler
          text: >-
            我当然知道。其实，你才开始筑巢，我就在一旁看着。你不觉得那个巢离地面太近了吗？
        - id: ch03-b11
          speaker: weechi_magnolia_warbler
          text: >-
            不近，一点也不近。我不像有些家伙，非要住得高高在上。离地面两三英尺，正合我的心意。
        - id: ch03-b12
          speaker: fidget_myrtle_warbler
          text: >-
            我也这么想。
        - id: ch03-b13
          speaker: narrator
          text: >-
            坐立不安和维奇谈起鸟巢，又说起什么才是正确的筑巢方法。他们越谈越起劲，连兔子彼得还在旁边都忘了。彼得坐在那里听了一阵。可比起听两只林莺谈论鸟巢，他更想亲眼看看那两个巢。最后，他悄悄溜走，打算自己去找。
        - id: ch03-b14
          speaker: narrator
          text: >-
            彼得找了又找，可林子里的小铁杉实在太多，而且棵棵都长得差不多。他怎么也分辨不出哪一棵藏着鸟巢。到最后，彼得终于耗尽了耐性，只好承认这事办不成，彻底放弃搜寻。
