  chapters:
    - id: ch01
      title: The Watchman of the Old Orchard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A few days after Chebec and his wife began building their nest in the Old Orchard, Peter came by for one of his usual very early visits. Chebec was hard at work searching for just the right nest materials. He explained that Mrs. Chebec was very particular indeed about what their nest was made of. Even with all that work to do, he had time to share a piece of news with Peter.
        - id: ch01-b02
          speaker: chebec
          text: >-
            My fighting cousin and my handsomest cousin both arrived yesterday. Our family is well represented in the Old Orchard now.
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter slowly reached his long left hind foot over his back and thoughtfully scratched his long right ear. He couldn't remember which two cousins Chebec meant, but he didn't want to admit it. So he asked his question rather hesitantly.
        - id: ch01-b04
          speaker: peter_rabbit
          text: Did you say your fighting cousin?
        - id: ch01-b05
          speaker: chebec
          text: >-
            I certainly did. He's Scrapper the Kingbird. You know him, of course. The rest of us feel safe whenever he's nearby.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Of course I know Scrapper!
        - id: ch01-b07
          speaker: narrator
          text: Peter's face cleared as soon as he heard the name.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Where is he now?
        - id: ch01-b09
          speaker: narrator
          text: >-
            At that very moment, a tremendous racket burst out on the other side of the Old Orchard. Feathered folks came hurrying from every direction, all screaming as loudly as they could. Peter couldn't possibly stay out of excitement like that. He scampered toward the trouble as fast as his legs could carry him. When he arrived, Redtail the Hawk was flying up and down, then this way and that, as though he were desperately trying to escape someone.
        - id: ch01-b10
          speaker: narrator
          text: >-
            At first Peter couldn't see what was bothering Redtail. Then he spotted a bird with a white throat and breast, a black cap and back, and a broad white band across the tip of his tail. The smaller bird kept darting at Redtail as if he meant to tear every feather from the Hawk's coat.
        - id: ch01-b11
          speaker: narrator
          text: >-
            It was Scrapper. He was a little smaller than Welcome Robin, while Redtail looked like a giant beside him. Scrapper didn't care. He wasn't afraid, and he wanted everyone to know it, especially Redtail. That fearlessness is why he is called a Kingbird. Scrapper screamed that Redtail was a robber and called him every other bad name he could think of. The other birds shouted bad names too, but not one of them, not even Bully the English Sparrow, dared to help Scrapper attack the big Hawk.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Scrapper drove Redtail far enough away to satisfy himself. Then he returned to a dead branch, where all his feathered neighbors congratulated him.
        - id: ch01-b13
          speaker: scrapper
          text: >-
            Oh, I did nothing. Nothing at all. But I can promise you this. As long as I live here, I don't intend to let any member of the Hawk family hang around the Old Orchard.
        - id: ch01-b14
          speaker: narrator
          text: Peter admired Scrapper's courage, and Scrapper accepted all that praise quite modestly.
        - id: ch01-b15
          speaker: narrator
          text: >-
            As Peter gazed up, he noticed the tiny hook at the end of Scrapper's bill, just like the bills of the other flycatchers. Scrapper's slightly raised cap looked entirely black from below. If Peter had been close enough, though, he would have seen an orange-red patch hidden there.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Suddenly Scrapper shot into the air. His bill snapped with the same sharp sound Chebec's made when he caught a fly. This time the catch wasn't a fly. Peter clearly saw Scrapper snap up a bee. He had often heard Scrapper called the Bee Martin, and now he knew why.
        - id: ch01-b17
          speaker: peter_rabbit
          text: Do you eat nothing but bees?
        - id: ch01-b18
          speaker: scrapper
          text: >-
            Bless your heart, Peter, of course not! If I lived on bees, there wouldn't be any honey. I like bees very much, but they make up only a small part of my food. Most of the bees I catch are drones. Drones are useless, you know, because they don't do any work at all. I catch a worker only now and then, and only by accident. I eat every kind of flying insect, and some insects that don't fly. I'm one of Farmer Brown's best friends, if only he knew it.
        - id: ch01-b19
          speaker: scrapper
          text: >-
            People talk about the Hawk family's wonderful eyesight. Well, I'd like to meet the Hawk who can see better than I can. There's a fly far beyond that old apple tree. Watch me catch it.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Peter knew it was no use trying to see that fly. He couldn't have spotted one even a quarter as far away. Though he never saw it, he heard the sharp click of Scrapper's bill. When Scrapper returned, he kept opening and closing his mouth. That was enough for Peter. He knew Scrapper had caught the distant fly, and he knew from Scrapper's mouth that it had tasted good.
        - id: ch01-b21
          speaker: peter_rabbit
          text: Will you build your nest in the Old Orchard this year?
        - id: ch01-b22
          speaker: scrapper
          text: Of course I will. I—
        - id: ch01-b23
          speaker: narrator
          text: >-
            Scrapper broke off in the middle of his sentence when he spotted Blacky the Crow. At once he dashed out to meet him. Blacky saw Scrapper coming and was wise enough to act as though the Old Orchard had never interested him in the least. He turned suddenly and headed toward the Green Meadows instead.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Peter didn't wait for Scrapper to come back. It was getting high time for him to hurry home to the dear Old Briar-patch. Off he went, lipperty-lipperty-lip. Just as he was leaving the far corner of the Old Orchard, someone called his name. The voice called again, making it clear that it wanted Peter Rabbit.
        - id: ch01-b25
          speaker: cresty
          text: Peter! Oh, Peter Rabbit!
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter stopped short and sat very straight. He looked one way, then another, then another. He looked everywhere except in the right direction.
        - id: ch01-b27
          speaker: cresty
          text: Look up, right over your head.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The voice was rather harsh. Peter looked up, and in a flash he understood which bird Chebec had called the handsomest member of his family. It was Cresty the Great Crested Flycatcher.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Cresty was just a little bigger than Scrapper the Kingbird, though not quite as big as Welcome Robin, and his body was more slender. His throat and breast were gray, becoming bright yellow underneath. Grayish brown covered his back and head, with a touch of olive green. His pointed cap gave him a very distinguished look. He truly was both the largest and the handsomest of the Flycatcher family.
        - id: ch01-b30
          speaker: cresty
          text: >-
            You look as if you're in a hurry, Peter, so I won't keep you. I only want to ask one small favor.
        - id: ch01-b31
          speaker: peter_rabbit
          text: What is it?
        - id: ch01-b32
          speaker: narrator
          text: Peter was always glad to do someone a favor.
        - id: ch01-b33
          speaker: cresty
          text: >-
            While you're roaming around, you may find an old suit that Mr. Black Snake has cast off, or one from another member of the Snake family. If you do, please remember me and let me know. Will you, Peter?
        - id: ch01-b34
          speaker: peter_rabbit
          text: A—a—a what?
          emotion: surprised
        - id: ch01-b35
          speaker: cresty
          text: >-
            An old suit of clothes cast off by a member of the Snake family. Please don't forget, Peter. I have to go house hunting now, but if you happen to find one of those old Snake suits, you'll find me right here or somewhere nearby.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Cresty sounded a little impatient. Before Peter could say another word, Cresty flew away. Peter hesitated. First he looked toward the dear Old Briar-patch, and then he looked toward Jenny Wren's house. He simply couldn't understand why Cresty wanted an old cast-off suit from the Snake family, and he felt sure Jenny could explain it. At last his curiosity got the better of him. Back he scampered, lipperty-lipperty-lip, to the foot of the tree where Jenny lived.
        - id: ch01-b37
          speaker: peter_rabbit
          text: Jenny! Jenny Wren! Jenny Wren!
        - id: ch01-b38
          speaker: narrator
          text: >-
            No one answered. Peter could hear Mr. Wren singing in another tree, but he couldn't see him. Peter called once more.
        - id: ch01-b39
          speaker: peter_rabbit
          text: Jenny! Jenny Wren! Jenny Wren!
        - id: ch01-b40
          speaker: narrator
          text: Jenny popped her head out, and her little eyes flashed.
        - id: ch01-b41
          speaker: jenny_wren
          text: >-
            Peter Rabbit, didn't I tell you the other day not to disturb me? Didn't I tell you I have seven eggs in here and no time for gossip? Didn't I tell you? Didn't I? Didn't I?
          emotion: angry
        - id: ch01-b42
          speaker: peter_rabbit
          text: >-
            You certainly did, Jenny, and I'm sorry to bother you. I never would have done it, but I didn't know who else to ask.
        - id: ch01-b43
          speaker: jenny_wren
          text: Ask about what? What did you come here for?
        - id: ch01-b44
          speaker: peter_rabbit
          text: Snake skins.
        - id: ch01-b45
          speaker: jenny_wren
          text: >-
            Snake skins! What in the world are you talking about, Peter Rabbit? I never have anything to do with Snake skins, and I never want to. Ugh! Just thinking about them makes me shiver.
          emotion: disgusted
        - id: ch01-b46
          speaker: peter_rabbit
          text: >-
            No, you don't understand. Cresty the Flycatcher asked me to tell him if I found an old suit cast off by someone in the Snake family. He flew away before I could ask why he wanted it. So I came to you. You know everything, especially when it concerns your neighbors.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Jenny Wren couldn't decide whether to be pleased by that or annoyed. But Peter looked so innocent that she decided he was honestly trying to say something nice.
