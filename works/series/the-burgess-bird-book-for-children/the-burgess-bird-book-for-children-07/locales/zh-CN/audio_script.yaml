audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    chebec:
      display_name: 切贝克小霸鹟
      tts:
        delivery: 自信健谈，带一点得意和诙谐
        timbre: 尖细清脆
        pace: 明快利落
        pitch: 高音
    scrapper_kingbird:
      display_name: 斗士王霸鹟
      tts:
        delivery: 勇敢爽朗，自信中带着谦逊
        timbre: 清亮有力
        pace: 爽快利落
        pitch: 中高音
    cresty:
      display_name: 冠冠大冠霸鹟
      tts:
        delivery: 干脆直接，略带沙哑和急性子
        timbre: 粗粝清晰
        pace: 明快
        pitch: 中音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 细亮有穿透力
        pace: 快速紧凑
        pitch: 高音
  chapters:
    - id: ch01
      title: 第七章　老果园的守望者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            切贝克夫妇开始在老果园筑巢以后，没过几天，彼得又照常一大早来拜访。切贝克正忙着寻找筑巢的材料。他告诉彼得，切贝克太太对用料讲究得很。不过，再忙，他也有工夫说上一件新鲜事。
        - id: ch01-b02
          speaker: chebec
          text: >-
            昨天，我家那位最能打的表兄和模样最俊的表兄一起来了。现在我们家族在老果园里，成员可算相当齐全啦。
        - id: ch01-b03
          speaker: narrator
          text: >-
            切贝克说得十分自豪。彼得却把长长的左后脚慢吞吞地伸到背上，若有所思地挠着长长的右耳朵。他实在想不起那两位表兄是谁，又不大愿意承认，只好迟迟疑疑地问了一句。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 你刚才说，那位最能打的表兄？
        - id: ch01-b05
          speaker: chebec
          text: >-
            对呀，就是斗士王霸鹟，你当然认识。只要他在附近，我们其他鸟心里就踏实。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 我当然认识他！他现在在哪儿？
        - id: ch01-b07
          speaker: narrator
          text: >-
            彼得的脸一下子开朗起来。偏偏就在这时，老果园另一头猛然吵翻了天。鸟儿们从四面八方赶过去，一个个扯着嗓子尖叫。这样的热闹，怎么少得了彼得？他撒开腿，能跑多快就跑多快。赶到一看，红尾鹰忽上忽下，一会儿往这边，一会儿往那边，像是急着甩掉什么东西，或者什么人。
        - id: ch01-b08
          speaker: narrator
          text: >-
            彼得起先还不明白红尾鹰出了什么事。仔细一看，原来有只小鸟正一次又一次朝他猛冲。那只鸟的喉部和胸脯雪白，头顶和背部乌黑，尾巴末端还横着一道宽宽的白带。瞧那股狠劲儿，简直要把红尾鹰浑身的羽毛全拔光。
        - id: ch01-b09
          speaker: narrator
          text: >-
            小鸟只比报春知更鸟小一点，跟红尾鹰一比，简直像站在巨人面前。可他根本不在乎，因为他正是斗士。斗士毫不害怕，还非让所有人都知道不可，尤其要让红尾鹰知道。他这么无所畏惧，也难怪大家叫他王霸鹟。斗士一路高声痛骂红尾鹰是强盗，把能想到的难听话都骂了出来。其他鸟也跟着数落。可是，就连恶霸英国麻雀也不敢扑上去，帮他攻击那个庞然大物。
        - id: ch01-b10
          speaker: narrator
          text: >-
            斗士一直把红尾鹰赶到老果园远处，觉得足够远了，才心满意足地飞回来，落在一棵树的枯枝上。守在那里的鸟邻居们纷纷围上来，向这位勇敢的守望者道贺。
        - id: ch01-b11
          speaker: scrapper_kingbird
          text: >-
            没什么，我什么也没做。真的，一点儿也没有。不过，只要我还住在这里，就不许鹰族的家伙到老果园附近转悠。
        - id: ch01-b12
          speaker: narrator
          text: >-
            斗士接受大家的道贺时，始终谦虚得很。彼得听了，打心眼里佩服他的勇气。彼得抬头细看，还发现斗士跟别的霸鹟一样，嘴尖上有一个小得不能再小的钩。斗士微微竖起的冠羽看着全是黑色，可要是彼得能走近些，就会看见里面藏着一小块橙红。
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得坐在下面，正仰着脑袋看得入神，斗士忽然冲到空中。小嘴“咔嗒”一响，跟切贝克捕捉苍蝇时一模一样。可这回捉住的不是苍蝇，是一只蜜蜂。斗士把它叼住的一刹那，彼得看得清清楚楚。他早就听人叫斗士“吃蜂鸟”，这下总算明白了缘故。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 你平时只吃蜜蜂吗？
        - id: ch01-b15
          speaker: scrapper_kingbird
          text: >-
            哎哟，彼得，当然不是。我要真那么吃，哪里还会有蜂蜜？我确实很喜欢蜜蜂，可它们只占我食物中很小的一部分。我捉到的大多是雄蜂。你知道，雄蜂一点活儿也不干，没什么用。只有碰巧时，我才会误捉一只工蜂。会飞的昆虫，我什么都吃，不会飞的也吃一些。农夫布朗要是知道这些，就会明白我是他最好的朋友之一。
        - id: ch01-b16
          speaker: scrapper_kingbird
          text: >-
            大家都爱夸鹰族的眼力。可要是有哪只鹰看得比我还清楚，我真想知道他是谁。瞧，那棵老苹果树后面远远的地方，有一只苍蝇。看我去捉住它。
        - id: ch01-b17
          speaker: narrator
          text: >-
            彼得很有自知之明，根本没白费力气去找。他知道，哪怕那只苍蝇只在四分之一那么远的地方，自己也瞧不见。不过，他听见了斗士小嘴发出的清脆响声。斗士飞回来以后，嘴巴还不停地一张一合。彼得一看便明白，那只苍蝇已经进了斗士的肚子，而且滋味很不错。
        - id: ch01-b18
          speaker: peter_rabbit
          text: 今年你会在老果园筑巢吗？
        - id: ch01-b19
          speaker: scrapper_kingbird
          text: 那当然，我——
        - id: ch01-b20
          speaker: narrator
          text: >-
            斗士话没说完，忽然瞧见黑鸦，马上冲出去拦他。黑鸦一看斗士迎面飞来，立刻装出对老果园毫无兴趣的样子，机灵地转身飞向绿草地。
        - id: ch01-b21
          speaker: narrator
          text: >-
            彼得没有等斗士回来。时候已经不早了，他该赶回亲爱的老荆棘丛啦。于是，他又啪嗒啪嗒地上了路。才要离开老果园远处的一角，忽然有人在身后叫住了他。
        - id: ch01-b22
          speaker: cresty
          text: 彼得！喂，兔子彼得！
        - id: ch01-b23
          speaker: narrator
          text: >-
            彼得猛地停住，身子坐得笔直。他看看这边，看看那边，又看看另一边，哪边都看遍了，偏偏没看对地方。
        - id: ch01-b24
          speaker: cresty
          text: 抬头看看你脑袋上面！
        - id: ch01-b25
          speaker: narrator
          text: >-
            那声音有些沙哑。彼得抬起头，立刻认出了切贝克所说的那位俊美表兄。原来是冠冠大冠霸鹟。他比斗士大一点，却还没有报春知更鸟那么大，身材也更修长。喉部和胸脯呈灰色，往下渐渐变成鲜亮的黄色。头部和背部是灰褐色，还隐约泛着橄榄绿。头顶那簇尖尖的冠羽，让他的模样格外出众。他确实是霸鹟家族中最俊美、个头也最大的成员。
        - id: ch01-b26
          speaker: cresty
          text: >-
            你好像急着赶路，我就不留你了，彼得。我只想请你帮一个小忙。
        - id: ch01-b27
          speaker: peter_rabbit
          text: 什么忙？
        - id: ch01-b28
          speaker: narrator
          text: 彼得一向乐意帮别人的忙。
        - id: ch01-b29
          speaker: cresty
          text: >-
            你四处闲逛时，要是碰见黑蛇先生脱下来的旧衣服，或者蛇族其他成员脱下来的旧衣服，请你记得来告诉我。你愿意吗，彼得？
        - id: ch01-b30
          speaker: peter_rabbit
          text: 一……一……一件什么？
          emotion: surprised
        - id: ch01-b31
          speaker: cresty
          text: >-
            蛇族随便哪一位成员脱下来的旧衣服。可别忘了，彼得。我得去找房子了。你要是真找到一件，就到这里或附近来找我。
        - id: ch01-b32
          speaker: narrator
          text: >-
            冠冠说话时已经有些不耐烦。彼得还来不及再说一个字，他便飞走了。彼得站在原地犹豫不决，一会儿望望亲爱的老荆棘丛，一会儿又望望珍妮鹪鹩的家。蛇族脱下来的旧衣服，到底是怎么回事？他想不明白，却认定珍妮一定能告诉他。最后，好奇心占了上风。彼得转过身，啪嗒啪嗒地跑回珍妮安家的那棵树下。
        - id: ch01-b33
          speaker: peter_rabbit
          text: 珍妮！珍妮鹪鹩！珍妮鹪鹩！
        - id: ch01-b34
          speaker: narrator
          text: >-
            没有谁回答。彼得听见鹪鹩先生在另一棵树上唱歌，却看不见他。于是，彼得又喊了一遍。
        - id: ch01-b35
          speaker: peter_rabbit
          text: 珍妮！珍妮鹪鹩！珍妮鹪鹩！
        - id: ch01-b36
          speaker: narrator
          text: 这一回，珍妮探出头来。她的两只小眼睛简直要迸出火星。
        - id: ch01-b37
          speaker: jenny_wren
          text: >-
            前两天我不是告诉过你吗，兔子彼得，不许来打扰我？这里有七枚蛋，我根本没工夫闲聊，这话我是不是也说过？我没说吗，兔子彼得？没说吗？没说吗？
          emotion: angry
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            你说过，珍妮，当然说过。来打扰你，我很抱歉。我本来绝不会这么做，可我实在不知道还能去问谁。
        - id: ch01-b39
          speaker: jenny_wren
          text: 问谁做什么？你跑来找我，到底为了什么？
          emotion: angry
        - id: ch01-b40
          speaker: peter_rabbit
          text: 我是来问蛇皮的事。
        - id: ch01-b41
          speaker: jenny_wren
          text: >-
            蛇皮？蛇皮！你在说什么呀，兔子彼得？我从来不碰蛇皮，也一点都不想碰。呃！光是想想，我就浑身发抖。
          emotion: disgusted
        - id: ch01-b42
          speaker: peter_rabbit
          text: >-
            你没明白我的意思。我想知道，冠冠霸鹟为什么要我看见蛇族脱下来的旧衣服时，一定去通知他。他还没等我问清楚为什么需要那些东西，就飞走了。所以我才来找你。你什么都懂，尤其是邻居们的事，样样都懂。
        - id: ch01-b43
          speaker: narrator
          text: >-
            珍妮听了，脸上的神情很难分辨。她似乎因为这番恭维有点儿受用，又像因为彼得来打扰而有点儿生气。不过，彼得看上去那么天真，她最后认定，他是真心实意想说句好听的话。
