audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    yank_yank:
      display_name: Yank-Yank the Nuthatch
      tts:
        delivery: cheerful, confident, and lightly teasing
        timbre: crisp and friendly
        pace: moderate
        pitch: medium-high
    seep_seep:
      display_name: Seep-Seep the Brown Creeper
      tts:
        delivery: brief, busy, and intent
        timbre: thin and delicate
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Peter Discovers Two Old Friends
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Rough Brother North Wind and Jack Frost followed close behind Honker the Goose. In a single night, they changed Peter Rabbit's world into a new one, all pure white. By then, even the last slow traveler among Peter's feathered friends who wintered in the faraway South had hurried off. Still, Peter wasn't lonely. On the very first morning after the storm, Tommy Tit greeted him in a cheery voice. Tommy sounded every bit as happy as he ever had in summer.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter rather liked snow. He enjoyed running here and there through it, so he followed Tommy Tit to the Old Orchard. He felt sure he would find more company there, and he was right. Downy and Hairy the Woodpeckers were eating breakfast from a piece of suet. Farmer Brown's boy had thoughtfully fastened it in one of the apple trees for them. Sammy Jay was there too, and his blue coat had never looked finer than it did against the clean white snow.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Those were the only birds Peter had really expected to see. So when he hopped over the old stone wall and heard a nearly forgotten voice, he was delighted. It belonged to Yank-Yank the Nuthatch. His voice wasn't sweet, but it sounded cheerful and content. Peter hurried straight toward it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            On the trunk of an apple tree, Peter spotted a gray, black, and white bird about the size of Downy the Woodpecker. The top of Yank-Yank's head and the upper part of his back shone black. The rest of his back was bluish gray, while his cheeks and breast were white. His outer tail feathers were black, with white patches near the tips.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But Peter didn't need those colors to know his old friend. He could have recognized Yank-Yank from so far away that none of the colors in his coat showed at all. Yank-Yank was doing something astonishing, something no other bird could do. He was walking headfirst down the trunk and picking tiny insect eggs from the bark as he went. In that strange position, he seemed just as comfortable and unconcerned as if he were right side up.
        - id: ch01-b06
          speaker: narrator
          text: >-
            When Peter came near, Yank-Yank raised his head and called a greeting that sounded like his own name repeated. Then he turned and climbed up the tree as easily as he had come down.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            Yank-Yank, welcome home!
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter hurried up, quite out of breath. Yank-Yank turned until he was head down again, and his eyes twinkled as he looked at Peter below.
        - id: ch01-b09
          speaker: yank_yank
          text: >-
            You've got it wrong, Peter. This isn't my home. I've only come down for the winter. Home is where you raise your children, you know, and mine is in the Great Woods farther north. There's too much ice and snow up there now, so I'm spending the winter here.
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            Well, it's a sort of home anyway. It's your winter home, and I'm certainly glad you're back. The Old Orchard wouldn't feel the same without you. Did you have a good summer? And please, Yank-Yank, where did you build your home? What was it like?
        - id: ch01-b11
          speaker: yank_yank
          text: >-
            Yes, Mr. Curiosity, I had a very good summer. Mrs. Yank-Yank and I raised six children. That's much better than some folks manage, if I may say so. Our nest was made of leaves and feathers. It was inside a hole in a certain old stump, and nobody but Mrs. Yank-Yank and me knows where that stump is. Anything else you want to ask?
        - id: ch01-b12
          speaker: peter_rabbit
          text: >-
            Yes. How can you walk headfirst down a tree trunk without losing your balance and falling off?
        - id: ch01-b13
          speaker: narrator
          text: >-
            Yank-Yank gave a happy chuckle.
        - id: ch01-b14
          speaker: yank_yank
          text: >-
            I learned something long ago, Peter. The creatures who do best are the ones who use what they have instead of wishing for what someone else has. You've noticed the Woodpecker family has stiff tail feathers, haven't you? They brace those feathers against a tree while they climb. They depend on them so much that they won't move around a trunk without that support. When they want to come down, they have to back down.
        - id: ch01-b15
          speaker: yank_yank
          text: >-
            Old Mother Nature didn't give me stiff tail feathers. She gave me an excellent pair of feet instead, with three toes pointing forward and one pointing back. I learned to make the most of those feet when I was very young. Every toe has a sharp claw. As I climb up, the three front claws on each foot hook into the bark. When I want to come down, I simply twist one foot around. Then the claws on that foot hold me securely and keep me from falling.
        - id: ch01-b16
          speaker: yank_yank
          text: >-
            Going down is just as easy for me as going up. I can even travel right around the trunk with no trouble at all.
        - id: ch01-b17
          speaker: narrator
          text: >-
            To show Peter exactly what he meant, Yank-Yank ran around the apple tree trunk just above Peter's head. The moment he came back into sight, Peter was ready with another question.
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            Do you eat nothing but grubs, worms, insects, and insect eggs?
        - id: ch01-b19
          speaker: yank_yank
          text: >-
            Of course not! I like acorns, beechnuts, and some kinds of seeds too.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            But you're so little. How can you possibly eat anything as hard as an acorn or a beechnut?
        - id: ch01-b21
          speaker: narrator
          text: >-
            Yank-Yank laughed aloud.
        - id: ch01-b22
          speaker: yank_yank
          text: >-
            The next time I meet you over in the Green Forest, I'll show you how I do it. When I find a plump beechnut, I carry it to a narrow crack in a tree, one just wide enough to hold the nut firmly. Then I use this stout bill of mine to crack the shell. It's really quite simple once you know how. Breaking open a nut that way is sometimes called hatching. That's how I came by the name Nuthatch.
        - id: ch01-b23
          speaker: yank_yank
          text: >-
            Why, there's Seep-Seep! I haven't seen him since we were together up North. His home was close to mine.
        - id: ch01-b24
          speaker: narrator
          text: >-
            As Yank-Yank spoke, a small brown bird landed at the very bottom of the next tree. He was only a little bigger than Jenny Wren, but he didn't look at all like her. Jenny usually held her tail cocked up in the sauciest way. Seep-Seep's tail never pointed up at all. In fact, it bent downward because he braced it against the tree for support, just as the members of the Woodpecker family braced their tails.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Seep-Seep was grayish brown above and grayish white below. A narrow band of buffy white crossed each wing, and his bill curved slightly.
        - id: ch01-b26
          speaker: narrator
          text: >-
            He didn't stop for even a moment. He started up the trunk at once, going around and around as he climbed and picking little things to eat from beneath the bark. His way of climbing looked so much like creeping that Peter thought Seep-Seep was well named the Brown Creeper. Peter also knew there was no use trying to get him to talk. Seep-Seep wouldn't waste any of his time that way.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Around and around the trunk Seep-Seep went. As soon as he reached the top, he flew straight down to the foot of the next tree and began climbing again without a pause. He never spent time exploring the branches. He stayed close to the trunk. Now and then, he gave one thin little cry, but even then he never stopped to rest or look around.
        - id: ch01-b28
          speaker: seep_seep
          text: >-
            Seep! Seep!
        - id: ch01-b29
          speaker: narrator
          text: >-
            He worked as hard as if clearing every insect egg and grub from those trees depended on him alone.
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            Does he make his nest inside a hole in a tree?
        - id: ch01-b31
          speaker: narrator
          text: >-
            Yank-Yank shook his head.
        - id: ch01-b32
          speaker: yank_yank
          text: >-
            No, he doesn't. He looks for a tree or an old stump with a loose piece of bark hanging from it. Then he tucks his nest safely behind that bark. He makes the nest from little twigs, strips of bark, and moss. He's an odd little fellow, Peter. But in this whole great world, I don't know anyone who keeps more strictly to his own business than Seep-Seep the Brown Creeper.
        - id: ch01-b33
          speaker: yank_yank
          text: >-
            By the way, Peter, have you seen Dotty the Tree Sparrow?
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            Not yet, but I think he must be here. I'm glad you reminded me. I'll go and look for him.
