audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    yank_yank:
      display_name: 䴓喳喳
      tts:
        delivery: 快活自信，话里带着轻轻的打趣
        timbre: 清脆亲切
        pace: 适中
        pitch: 中高音
    seep_seep:
      display_name: 褐旋木雀嘶嘶
      tts:
        delivery: 简短忙碌，始终专心干活
        timbre: 纤细轻巧
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 雪后的老果园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            粗暴的北风老兄和初霜杰克，紧跟着大雁洪克来到了这里。一夜之间，兔子彼得熟悉的天地全变了。到处洁白一片，像是换了一个新世界。那些要去遥远南方过冬的羽族朋友，连走得最迟的也匆匆离开了。不过，彼得一点儿也不寂寞。暴风雪后的第一个早晨，他才出门，就听见山雀汤米快活地向他问好。汤米的精神还是那么好，跟夏天一模一样。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得本来就喜欢雪，也喜欢在雪地里到处跑。他跟着汤米来到老果园，心想那里一定还有别的伙伴。果然，啄木鸟唐尼和海里正在吃早饭。农夫布朗家的男孩很体贴，把一块板油系在苹果树上，留给他们吃。冠蓝鸦萨米也来了。他那身蓝衣裳映着雪地的纯白，比以往任何时候都漂亮。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得原本只料到会碰见这几位。谁知才蹦过老石墙，他又听见了一个几乎快要忘掉的声音。这声音谈不上甜美，却让人觉得快活又知足。那是䴓喳喳！彼得高兴极了，马上朝声音传来的方向赶去。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一棵苹果树的树干上，有只灰、黑、白三色的小鸟，个头和啄木鸟唐尼差不多。他的头顶和上背乌黑发亮，其余背部是蓝灰色。头部两侧和胸脯洁白，尾巴外侧的黑羽毛靠近末端处，还各有一块白斑。
        - id: ch01-b05
          speaker: narrator
          text: >-
            可彼得根本不用看清这身衣裳，也认得出喳喳。哪怕离得远到看不见颜色，他也不会认错。因为喳喳正在做一件别的鸟谁也办不到的事。他头朝下，沿着树干往下走，还一路从树皮上啄取小小的虫卵。身子明明倒了过来，他却一点儿也不在意，走得和正着身子时一样自在。
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得走近了，喳喳抬起头，叫了一声作为问候。那叫声听起来就像把自己的名字重复了一遍。接着，他一转身，又轻轻松松地向树上爬去。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 喳喳，欢迎回家！
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: >-
            彼得一路赶来，已经累得直喘气。喳喳重新转成头朝下的姿势，低头看着他，眼睛里闪着笑意。
        - id: ch01-b09
          speaker: yank_yank
          text: >-
            彼得，你可弄错啦。这里不是我的家，我只是到南边来过冬。养育孩子的地方才叫家呀。我的家在更北面的森林深处。那里现在冰雪太多，所以这个冬天，我才住到这里来。
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            可这里至少算你过冬的家呀！反正看见你回来，我真高兴。老果园要是少了你，感觉就不一样了。你这个夏天过得好吗？还有，你把家筑在什么地方？那个家是什么样的？
        - id: ch01-b11
          speaker: yank_yank
          text: >-
            好奇先生，我这个夏天过得很好。喳喳太太和我养大了六个孩子。容我说一句，这可比我认识的某些家伙强多了。我们的巢用叶子和羽毛筑成，藏在一个老树桩的洞里。至于是哪一个树桩，除了喳喳太太和我，谁也不知道。怎么样，你还想问什么？
    - id: ch02
      title: 喳喳头朝下的本领
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: >-
            当然想问！你头朝下在树干上走，为什么不会失去平衡，一头栽下来呢？
        - id: ch02-b02
          speaker: narrator
          text: 喳喳听了，开心地咯咯笑起来。
        - id: ch02-b03
          speaker: yank_yank
          text: >-
            彼得，我很早以前就明白了。谁能把自己已有的本领好好用起来，不把时间浪费在羡慕别人上，谁的日子就会过得最好。你见过啄木鸟爬树吧？他们的尾羽硬挺挺的，正好撑在树干上。可他们太依赖尾巴了，不撑住就不敢在树干上走动。要想下树，只能倒退着爬。
        - id: ch02-b04
          speaker: yank_yank
          text: >-
            大自然老妈妈没给我那种硬尾羽，却给了我一双好脚。每只脚有三根脚趾向前，一根向后，每根脚趾上都有尖爪。我还很小的时候，就学会怎样用好它们。上树时，我用两只脚前面的三根爪子钩住树皮。下树时，我只要把一只脚扭过来，让那只脚上的爪子牢牢抓住，就掉不下去了。
        - id: ch02-b05
          speaker: yank_yank
          text: >-
            所以呀，对我来说，下树和上树一样容易。就算绕着树干走一整圈，也同样轻松得很。
        - id: ch02-b06
          speaker: narrator
          text: >-
            为了让彼得亲眼看看，喳喳马上绕着苹果树干跑了一圈，就在彼得头顶上方。等他再次露出身影，彼得的下一个问题已经等着他了。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 你是不是只吃蛴螬、蠕虫、昆虫，还有虫卵？
        - id: ch02-b08
          speaker: yank_yank
          text: 才不是呢！橡子、山毛榉果，还有几种种子，我也很喜欢。
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            你这么小，橡子和山毛榉果却那么硬。我真不明白，你怎么可能吃得动。
        - id: ch02-b10
          speaker: narrator
          text: 喳喳听了，放声大笑。
        - id: ch02-b11
          speaker: yank_yank
          text: >-
            下次在绿色森林碰见你，我就做给你看。我找到一颗饱满的山毛榉果，会把它带到树上一条小裂缝那里。那条缝得不宽不窄，刚好把果子卡住。然后，我用这张结实的嘴把果壳敲开。懂得诀窍以后，一点儿也不难。这样把果壳“孵”开，正是我䴓喳喳名字的来历。
        - id: ch02-b12
          speaker: yank_yank
          text: >-
            嘿，那不是嘶嘶吗？自从我们在北方分开，我还没见过他呢。他的家离我家不远。
    - id: ch03
      title: 忙个不停的嘶嘶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            喳喳说着，一只棕色小鸟正好落在旁边那棵树的根部。他只比鹪鹩珍妮大一点儿，样子却完全不同。珍妮总把尾巴神气活现地向上翘，嘶嘶的尾巴却从不翘起来，反而朝下弯。因为褐旋木雀嘶嘶也像啄木鸟那样，要用尾巴撑住身体。
        - id: ch03-b02
          speaker: narrator
          text: >-
            嘶嘶的上半身是灰褐色，下半身是灰白色。每只翅膀上都横着一道淡黄白色的细纹，嘴巴则微微弯曲。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他一刻也没停，落下后马上沿着树干往上爬。他绕了一圈又一圈，一边向上，一边从树皮下面挑出东西来吃。那副模样真像贴着树干爬行。彼得心想，叫他褐旋木雀，再合适不过了。彼得也很清楚，想让嘶嘶停下来聊天，根本没用。嘶嘶才舍不得在闲谈上浪费时间。
        - id: ch03-b04
          speaker: narrator
          text: >-
            嘶嘶一圈一圈爬到树顶，立刻又飞落到下一棵树的根部，接着向上爬，连一下也不停。他从不把时间花在查看树枝上，只管紧贴着树干，从树皮下面寻找食物。偶尔，他会用细细的嗓子叫上一声。
        - id: ch03-b05
          speaker: seep_seep
          text: 嘶！嘶！
        - id: ch03-b06
          speaker: narrator
          text: >-
            可就连叫的时候，他也不肯停下来歇一刻，更不会四下张望。看他那股勤快劲儿，简直像是清理这些树上所有虫卵和蛴螬的差事，全都压在他一个人身上，非得由他独自干完不可。
    - id: ch04
      title: 树皮后面的家
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: 喳喳，他是不是也把巢筑在树洞里？
        - id: ch04-b02
          speaker: narrator
          text: 喳喳摇了摇头。
        - id: ch04-b03
          speaker: yank_yank
          text: >-
            不是。他会先找一棵树，或者一截老树桩，上面得有一片松动的树皮垂下来。接着，他把用细枝、树皮条和苔藓筑成的巢，稳稳塞到那片树皮后面。嘶嘶是个有趣的小家伙。整个大千世界里，我还没见过谁比他更专心管好自己的事。
        - id: ch04-b04
          speaker: yank_yank
          text: 对了，彼得，你见过树麻雀小黑点吗？
        - id: ch04-b05
          speaker: peter_rabbit
          text: >-
            还没有，不过我想他一定已经来了。幸亏你提醒我。我这就去找他。
