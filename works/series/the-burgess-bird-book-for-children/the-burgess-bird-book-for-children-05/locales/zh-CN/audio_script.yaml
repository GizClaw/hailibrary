audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
    winsome_bluebird:
      display_name: 知心蓝鸲
      tts:
        delivery: 温和从容，话里带着轻柔的笑意
        timbre: 柔和悦耳
        pace: 舒缓自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第五章　彼得发现了一件意想不到的事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            每天一大早，兔子彼得都会跑到老果园，跟鹪鹩珍妮和那里的其他朋友聊上一阵。这已经成了他的习惯。他从朋友们那里知道了许多从前不知道的事情，其中有些实在出乎意料。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得在老果园有两位相识多年、交情很深的朋友，一位是知心蓝鸲，一位是报春知更鸟。每到春天，他们差不多同时回来，不过知心通常会早几天。今年，地上还留着一片片积雪，知心就已经到了。他一向是甜美的春姑娘派来的报信使者。彼得第一次听见他那柔和悦耳的哨声时，觉得声音好像到处都听得见，却又说不出究竟从哪里传来。他纯粹是快活得忍不住了，两条长长的后腿一下踢得老高。
        - id: ch01-b03
          speaker: narrator
          text: >-
            几天后，报春站在一棵高树的最高处，欢欢喜喜地送来消息：“振作！振作！振作！振作！振作起来！”彼得一听就知道，春姑娘真的来了。彼得和大家一样喜欢知心和报春。他认识他们那么久，又和他们那么熟，自以为两位朋友的事没有一样不知道。谁敢说他其实并不了解他们，他准会气得不得了。
        - id: ch01-b04
          speaker: narrator
          text: 鹪鹩珍妮从家门里探出脑袋，又跟彼得聊了起来。
        - id: ch01-b05
          speaker: jenny_wren
          text: 栅栏上那两位表亲，长得可不怎么像，对不对？
        - id: ch01-b06
          speaker: peter_rabbit
          text: 哪两位表亲？
        - id: ch01-b07
          speaker: narrator
          text: 彼得睁大眼睛，直往珍妮看的方向瞧。
        - id: ch01-b08
          speaker: jenny_wren
          text: 就是坐在那边栅栏上的两个呀。彼得，你的眼睛长到哪儿去了？
        - id: ch01-b09
          speaker: narrator
          text: >-
            彼得把眼睛瞪得更大了。一根栅栏柱上坐着知心蓝鸲，另一根上坐着报春知更鸟。他皱着眉，实在想不明白。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 我只看见知心和报春，没看见什么表亲。他们俩根本不是亲戚。
        - id: ch01-b11
          speaker: jenny_wren
          text: >-
            啧，啧，啧，啧，啧，彼得！这种胡话是谁告诉你的？他们当然是亲戚，还是表亲呢。知心、报春、画眉美乐，还有其他所有画眉，全都属于同一个家族。他们自然都是表亲。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 什么？这怎么可能？
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 珍妮又说了一遍，彼得还是一脸不信。珍妮本来就容易发火，这下立刻生气了。
        - id: ch01-b14
          speaker: jenny_wren
          text: 你不信我，就去问他们当中的一个！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: >-
            珍妮缩回屋里，独自数落个不停。彼得想了又想，觉得她这个主意倒不错，便蹦到知心坐着的栅栏柱下面。
        - id: ch01-b16
          speaker: peter_rabbit
          text: 鹪鹩珍妮说你和报春是表亲。她一定是在胡说，对吧？
        - id: ch01-b17
          speaker: narrator
          text: 知心发出一阵轻轻的、温和的笑声，点了点头。
        - id: ch01-b18
          speaker: winsome_bluebird
          text: >-
            她没胡说，我们确实是表亲。那个爱管闲事的小家伙，说起别人的事来，回回都靠得住。有时候，我觉得她知道的别人家事情，比自己家的还多。报春和我看起来也许不大像，可我们就是表亲。你不觉得今年春天的报春格外神气吗？
        - id: ch01-b19
          speaker: peter_rabbit
          text: >-
            他可一点儿也不比你更神气，知心。我最喜欢你那件天蓝色的外衣了。蓝鸲太太为什么不穿得和你一样鲜亮？
        - id: ch01-b20
          speaker: winsome_bluebird
          text: 这件事，你去问鹪鹩珍妮吧。
        - id: ch01-b21
          speaker: narrator
          text: >-
            知心笑着飞走了。彼得还没来得及再说一个字，他已经落到农夫布朗家的屋顶上。彼得赶紧跑回珍妮家，告诉她，刚才不该怀疑她，以后也再不会了。道过歉，他又央求珍妮讲讲，为什么蓝鸲太太的衣裳不如知心的鲜亮。
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            蓝鸲太太和大多数做母亲的一样，整天忙个不停，哪有工夫照料漂亮衣裳？那可费心了。再说，只要知心在附近，大家就只顾看他。这样一来，蓝鸲太太进出鸟巢也不会有人注意。兔子彼得，我看你根本不知道知心的巢在哪里。
        - id: ch01-b23
          speaker: narrator
          text: >-
            彼得只好承认，他虽然费尽心思盯着知心，还是没能找出鸟巢在哪儿。不过，他已经有了一个猜想。
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            我猜就在农夫布朗家的男孩挂起来的那座小屋里。他们刚回来时，我看见蓝鸲先生和蓝鸲太太都进去过。后来知心也常在那附近，所以鸟巢准在那里。
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            所以，你猜鸟巢在那里！彼得，你猜得一点儿也不对，一点儿也不对。巢其实在那些旧栅栏柱中的一根里面。到底是哪一根，我不告诉你，留给你自己去找吧。蓝鸲太太很有眼光，一眼就认出了好房子。那根柱子上的洞，是附近数一数二的好洞。我要是早到一步，早就自己住进去了。可蓝鸲太太不但已经筑好巢，里面还有四枚蛋，我也只能搬到现在这所房子来。
        - id: ch01-b26
          speaker: jenny_wren
          text: >-
            彼得，只说给你听，我觉得蓝鸲一家筑巢比他们的表亲知更鸟一家聪明多了。房子就该有结实的墙，门口不大不小，能让人舒舒服服地进出。还有什么比这样的房子更好？
        - id: ch01-b27
          speaker: narrator
          text: 彼得点点头，仿佛完全明白有墙的房子好在哪里。珍妮的话又让他想起了一件事。
        - id: ch01-b28
          speaker: peter_rabbit
          text: >-
            那天，我看见报春知更鸟在取泥巴，还把泥巴衔走。没多久，知更鸟太太也来了。他们俩不停地来回搬泥巴，我最后都看腻了。他们到底拿泥巴做什么？
        - id: ch01-b29
          speaker: jenny_wren
          text: >-
            当然是筑巢呀，傻瓜。报春长着黑脑袋、漂亮的赤褐色胸脯、黑白相间的喉咙，还有一张黄嘴巴。更别提他总是昂首挺胸，神气得很，确实是个漂亮的小伙子。知更鸟太太也只比他略逊一点儿。可他们竟然甘心把家筑成那个样子，我怎么想也想不通。
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            大家总说鹪鹩先生和我往巢里塞了许多破烂。也许是吧，可我们的破烂干干净净，无非是小树枝和干净的草秆。产蛋以前，我还一定会铺上羽毛。不是我自夸，再没有谁比我更爱把屋子收拾干净了。
        - id: ch01-b31
          speaker: jenny_wren
          text: >-
            报春长得好看，歌唱得好听，谁都喜欢他。可说到料理家务，他和知更鸟太太实在脏得很。他们用泥巴打鸟巢的底，就是普普通通、随处可见的泥巴。然后，他们在外面盖上一层枯草。有时候，巢里面的泥墙上只铺着薄薄一点儿草。我常看见他们鸟巢里面的样子，当然知道。只要长着眼睛，谁都找得到他们的巢。我不止一次见过这样的巢被大雨冲垮，或者让狂风刮落。这种事可从来不会落到知心和我的头上。
        - id: ch01-b32
          speaker: narrator
          text: >-
            珍妮说完，又缩回屋里去了。彼得留在外面，等着她再次露面。报春知更鸟飞落到地上，跑了几步，忽然停住，把头歪向一边，仿佛正在仔细倾听。接着，他低下头，用力扯住了什么。一会儿，一条又长又不停扭动的蚯蚓便从土里出来了。报春一口吞下蚯蚓，又往前跑了几步，再次停住倾听。这一回，他转过身，向右跑了三四步，又从土里拉出一条蚯蚓。
        - id: ch01-b33
          speaker: peter_rabbit
          text: 他那样子，简直像能听见土里的蚯蚓。
        - id: ch01-b34
          speaker: narrator
          text: 彼得没留神，竟把心里的话说出了声。珍妮正好又从门口探出脑袋。
        - id: ch01-b35
          speaker: jenny_wren
          text: 他就是听得见。蚯蚓藏在土里，他要是听不见，又怎么找得到？
        - id: ch01-b36
          speaker: peter_rabbit
          text: 你也听得见吗？
        - id: ch01-b37
          speaker: jenny_wren
          text: >-
            我从来没试过，也不打算浪费时间去试。报春也许爱吃蚯蚓，可我喜欢更小、更精致的东西。幼小的蚱蜢、鲜嫩的小甲虫、小毛毛虫，还有各种虫子和蜘蛛，这些才合我的口味。
        - id: ch01-b38
          speaker: narrator
          text: 彼得一听这些东西也能当食物，忍不住做了个怪脸，赶紧把头转开，不让珍妮看见。
        - id: ch01-b39
          speaker: peter_rabbit
          text: 报春知更鸟只吃这些吗？
        - id: ch01-b40
          speaker: jenny_wren
          text: >-
            那当然不是！他还吃许多别的虫子，也特别爱吃水果，像草莓、樱桃，还有各种各样的小浆果。好了，我不能再停在这里跟你说个没完啦。彼得，你要是答应绝不告诉别人，我就告诉你一个秘密。
        - id: ch01-b41
          speaker: narrator
          text: >-
            彼得当然答应了。珍妮把身子向下探得那么低，他真不知道她怎么还能稳稳待在门口，不从上面摔下来。珍妮凑近他，压低声音，悄悄说出了自己的秘密。
        - id: ch01-b42
          speaker: jenny_wren
          text: >-
            我的巢里有七枚蛋。接下来一个多星期，你要是不常看见我，现在就知道为什么了。我得坐在那些蛋上，把它们暖得好好的。
