  chapters:
    - id: ch01
      title: Peter Learns Something He Hadn't Guessed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit had made a habit of running over to the Old Orchard very early each morning. He went to have a little gossip with Jenny Wren and his other friends who lived there. On those visits, Peter was learning a great many things, and some of them surprised him very much.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Two of Peter's oldest and best friends in the Old Orchard were Winsome Bluebird and Welcome Robin. Every spring, the two birds came back at nearly the same time, though Winsome was usually a few days ahead of Welcome. That year, patches of snow still lay on the ground when Winsome arrived. As always, he brought the first news of sweet Mistress Spring.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The first time Peter heard Winsome's soft, sweet whistle, it seemed to come from nowhere and everywhere at once. Peter kicked up his long hind legs for pure joy. A few days later, Welcome Robin called from the very top of a tall tree, “Cheer-up! Cheer-up! Cheer-up! Cheer-up! Cheer!” Then Peter knew that Mistress Spring had truly arrived.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter loved Winsome and Welcome, just as everyone did. He had known them so long that he thought there was nothing left to learn about either one. If anyone had said otherwise, Peter would have been quite offended.
        - id: ch01-b05
          speaker: jenny_wren
          text: Those cousins don't look much alike, do they?
        - id: ch01-b06
          speaker: narrator
          text: Jenny Wren poked her head out of her house as she spoke to Peter.
        - id: ch01-b07
          speaker: peter_rabbit
          text: What cousins?
        - id: ch01-b08
          speaker: narrator
          text: Peter stared hard in the same direction Jenny was looking.
        - id: ch01-b09
          speaker: jenny_wren
          text: Those two on the fence over there. Where are your eyes, Peter?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter looked harder still. Winsome Bluebird sat on one fence post, and Welcome Robin sat on another.
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            I only see Winsome and Welcome, and those two aren't related at all.
        - id: ch01-b12
          speaker: narrator
          text: Peter frowned, puzzled.
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            Tut, tut, tut, tut, tut, Peter! Who put such nonsense into your head? Of course they're related. They're cousins. I thought everyone knew that. They belong to the same family as Melody the Thrush and all the other Thrushes, so they're all cousins.
        - id: ch01-b14
          speaker: peter_rabbit
          text: What?
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: >-
            Peter looked as if he didn't believe one word. Jenny told him again, but he still looked doubtful. Jenny lost her temper, as she did very easily.
        - id: ch01-b16
          speaker: jenny_wren
          text: If you won't believe me, go and ask one of them!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: >-
            She vanished into her house, and Peter could hear her scolding to herself inside. The more he considered her advice, the better it seemed. So he hopped over to the fence post where Winsome Bluebird was sitting.
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            Jenny Wren says you and Welcome Robin are cousins. She doesn't know what she's talking about, does she?
        - id: ch01-b19
          speaker: narrator
          text: Winsome gave a soft, gentle chuckle and nodded.
        - id: ch01-b20
          speaker: winsome_bluebird
          text: >-
            Yes, we are cousins. You can always trust that little busybody to know what she's talking about. Sometimes I think she knows more about everyone else's affairs than her own. Welcome and I may not look much alike, but we're cousins all the same. Don't you think Welcome looks unusually fine this spring?
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            He doesn't look a bit finer than you do, Winsome. I love your sky-blue coat. Why doesn't Mrs. Bluebird wear a coat as bright as yours?
        - id: ch01-b22
          speaker: winsome_bluebird
          text: Go and ask Jenny Wren.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Winsome chuckled again. Before Peter could add another word, he flew to the roof of Farmer Brown's house.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Peter scampered all the way back to Jenny's house. He told her he was sorry he had doubted her, and he promised that he would never doubt her again. Then he begged Jenny to explain why Mrs. Bluebird wasn't dressed as brightly as Winsome was.
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            Mrs. Bluebird is like most mothers. She's much too busy to spend a lot of time caring for her clothes, and fine clothes need a great deal of care. Besides, whenever Winsome is nearby, his bright coat draws everyone's attention. That gives Mrs. Bluebird a chance to slip in and out of her nest without anyone noticing her. I don't believe you even know where their nest is, Peter Rabbit.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter had to admit that he didn't, though he had watched Winsome and tried his best to discover it.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            I think it's over in that little house Farmer Brown's boy put up. I saw both Mr. and Mrs. Bluebird go inside when they first arrived. Since then, I've seen Winsome around that house a great deal. So that's where I think their nest must be.
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            Oh, so that's what you think! Well, you're quite wrong, Peter. Quite wrong. Their nest is really inside one of those old fence posts. I won't tell you which one. You can find that out for yourself.
        - id: ch01-b29
          speaker: jenny_wren
          text: >-
            Mrs. Bluebird certainly has good sense. She knows a fine house when she finds one, and that hole is one of the best around here. If I had come sooner, I would have taken it myself. But Mrs. Bluebird had already built her nest there and laid four eggs, so I had no choice but to move in here.
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            Just between us, Peter, the Bluebirds have more sense about nests than their Robin cousins. Give me a house with strong walls and a doorway just large enough to pass through comfortably. Nothing beats that.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Peter nodded as if he understood every advantage of living in a house with walls.
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            That reminds me of something. The other day I saw Welcome Robin pick up mud and carry it away. Soon Mrs. Robin joined him and did the same thing. They kept going until I was tired of watching. What did they want with all that mud?
        - id: ch01-b33
          speaker: jenny_wren
          text: >-
            They were building their nest, of course, you silly rabbit. Welcome is certainly handsome, with his black head, lovely russet breast, black-and-white throat, and yellow bill. And then there's that proud way he holds himself. Mrs. Robin is only a little less handsome. How they can be satisfied with the kind of home they build is beyond me.
        - id: ch01-b34
          speaker: jenny_wren
          text: >-
            Folks say Mr. Wren and I put a great deal of trash in our nest. Perhaps we do, but at least ours is clean trash. We use sticks and clean straw, and before I lay my eggs, I line the nest with feathers. And if I may say so, you won't find a cleaner housekeeper than I am.
        - id: ch01-b35
          speaker: jenny_wren
          text: >-
            Welcome is handsome, he sings beautifully, and everyone loves him. But when it comes to keeping house, he and Mrs. Robin are simply dirty. They start their nest with mud. Plain, common, ordinary mud! Then they cover it with dead grass. Sometimes there's hardly enough grass to hide the mud walls inside. I've looked into their nests often, so I know.
        - id: ch01-b36
          speaker: jenny_wren
          text: >-
            Anyone with eyes can find a Robin's nest. More than once I've known heavy rain to wash one away, or a strong wind to blow one down. Nothing like that ever happens to Winsome Bluebird or to me.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Jenny went back inside her house, and Peter waited for her to come out again. Welcome Robin flew down to the ground. He ran a few steps, stood still, and tilted his head to one side as though he were listening. Then he bent down and began tugging at something. Before long, a long, wriggling angleworm came out of the earth. Welcome swallowed it, ran forward a few more steps, and stopped to listen once again. This time he turned and ran three or four steps to the right. There he pulled another worm out of the ground.
        - id: ch01-b38
          speaker: peter_rabbit
          text: He acts as though he can hear those worms underground.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Peter had spoken aloud without meaning to. Just then, Jenny poked her head through her doorway.
        - id: ch01-b40
          speaker: jenny_wren
          text: >-
            He can hear them. How else do you suppose he finds worms when they're hidden under the ground?
        - id: ch01-b41
          speaker: peter_rabbit
          text: Can you hear them too?
        - id: ch01-b42
          speaker: jenny_wren
          text: >-
            I've never tried, and I don't mean to waste my time doing it. Welcome may like eating worms, but I prefer something smaller and daintier. Give me young grasshoppers, tender young beetles, little caterpillars, bugs, and spiders.
        - id: ch01-b43
          speaker: narrator
          text: >-
            At the thought of such things as food, Peter had to turn his head so Jenny wouldn't see the face he made.
        - id: ch01-b44
          speaker: peter_rabbit
          text: Is that everything Welcome Robin eats?
        - id: ch01-b45
          speaker: narrator
          text: Peter tried to sound innocent. Jenny laughed.
        - id: ch01-b46
          speaker: jenny_wren
          text: >-
            Of course not! He eats plenty of other worms, and he dearly loves fruit. He'll eat strawberries, cherries, and all kinds of small berries. But I can't stay here talking any longer. I'll tell you a secret, Peter, if you promise not to repeat it.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Of course Peter promised. Jenny leaned so far down that he wondered how she kept from falling.
        - id: ch01-b48
          speaker: jenny_wren
          text: >-
            There are seven eggs in my nest. So if you don't see much of me for the next week or longer, you'll know the reason. I have to sit on those eggs and keep them warm.
