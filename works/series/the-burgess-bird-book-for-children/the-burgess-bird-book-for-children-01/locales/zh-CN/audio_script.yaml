audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
  chapters:
    - id: ch01
      title: 第一章　鹪鹩珍妮归来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            蹦跶、蹦跶、蹦蹦跶！兔子彼得贴着老果园一边那道坍塌的石墙，飞快地往前跑。清晨才刚开始，快活的太阳先生还没在蓝湛湛的天空里爬多高。彼得看惯了太阳先生早起。要是哪天没看见，反倒稀奇。谁叫他总爱在外头玩上一整夜，等别人快起床了，才回到亲爱的老蔷薇丛之家呢。这一夜他又没回去，可他一点儿也不困，连一丁点儿睡意都没有。温柔的春姑娘已经来了，到处都有新鲜事，他生怕漏掉一样。要是由着他的心意，他简直一刻也不会睡。于是天刚亮，他就跑来老果园，想弄清楚前一天有没有新客人到达。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 鸟儿可真古怪。
        - id: ch01-b03
          speaker: narrator
          text: 彼得从石墙低矮的地方一跃而过，进了老果园。一个尖利又责备人的声音立刻响了起来。
        - id: ch01-b04
          speaker: jenny_wren
          text: >-
            啧、啧、啧、啧、啧！兔子彼得，你这话一点儿根据也没有。鸟儿哪里古怪了？整个大世界里，就数我们最明白事理。
        - id: ch01-b05
          speaker: narrator
          text: 彼得赶紧收住跳到一半的大步，坐直身子，两眼亮了起来。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 鹪鹩珍妮！见到你太好了。你什么时候回来的？
          emotion: happy
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            鹪鹩先生和我刚到。谢天谢地，我们总算回来了！就在这一刻，能重新看见老果园，我心里说不出的庆幸。我这一辈子还从没这么高兴地见到一个地方。老果园啊，我终于又看见你了。我们离开这里仿佛已经过了好多好多年。
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 珍妮待在彼得头顶的树枝上，一刻不停地忙来忙去。除了她，再没有谁会这样忙个没完。
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            你既然这么喜欢老果园，为什么还要离开？所以我才说鸟儿古怪。你们从不肯老实待在一个地方，至少你们当中许多鸟都是这样。冠蓝鸦萨米、山雀汤米、啄木鸟鼓手，还有几位，多少有点儿头脑。他们就不会去作又远又傻的旅行。可其余的鸟——
        - id: ch01-b10
          speaker: jenny_wren
          text: >-
            啧、啧、啧、啧、啧！你根本不懂这件事。一个人偏要谈自己完全不懂的东西，那声音才最傻呢。
        - id: ch01-b11
          speaker: narrator
          text: 彼得听了，咯咯地笑起来。
        - id: ch01-b12
          speaker: peter_rabbit
          text: >-
            你这张嘴还是和从前一样尖。不过，再听见你这样说话，我可真高兴。要是听不见，大家一定会想念的。我先前还有些担心，怕你出了什么事，今年夏天回不来了。你那么了解我，当然知道舌头再尖也伤不了我。还是省点儿力气，回答几件我想知道的事吧。你要是真像嘴上说的那么爱老果园，究竟为什么要走？
        - id: ch01-b13
          speaker: narrator
          text: 珍妮明亮的眼睛一闪，立刻反问他。
        - id: ch01-b14
          speaker: jenny_wren
          text: 你为什么要吃东西？
        - id: ch01-b15
          speaker: peter_rabbit
          text: 因为我肚子饿。
        - id: ch01-b16
          speaker: jenny_wren
          text: 要是根本没有吃的，你还能吃什么？
        - id: ch01-b17
          speaker: peter_rabbit
          text: 这问题也太傻了。
        - id: ch01-b18
          speaker: jenny_wren
          text: >-
            它可不比你刚才的问题更傻。彼得，你多少也该相信鸟儿有点儿常识。我们和你一样，不吃东西就活不了。可到了冬天，老果园里没有大多数鸟儿能吃的东西，我们只好去有食物的地方。有些鸟碰巧能吃这里冬天找得到的食物，所以可以留下来。他们实在幸运。对，就是幸运。可是——
        - id: ch01-b19
          speaker: narrator
          text: 珍妮忽然停了下来。
        - id: ch01-b20
          speaker: peter_rabbit
          text: 可是什么？
        - id: ch01-b21
          speaker: jenny_wren
          text: >-
            我有时会想，你们这些总能待在家里的家伙，到底明不明白家是多么有福气的地方。我们南下才六个月，我却觉得像过了好多年。出门最好的一件事，就是终于能回家。我才不管这话听起来是不是有些矛盾，反正它是真的。阳光灿烂的南方不是家，就算我们在那里住的日子和这里一样多，也不是。这里才是家，哪里都比不上这里！怎么，鹪鹩先生？你说我还没看遍大世界？也许没有，可我要告诉你，我见过的地方已经够多了。我们一年要飞两次，每次足有一千英里，当然有资格说说自己的看法，何况我一路上一直睁大眼睛，什么都认真看了。你别假装还有别的地方更好，故意逗我。我了解你，亲爱的。回到这里，你和我一样快活。
        - id: ch01-b22
          speaker: narrator
          text: 从刚才到现在，鹪鹩先生始终放开嗓子，用尽全身力气歌唱。彼得听着那歌声，接了一句。
        - id: ch01-b23
          speaker: peter_rabbit
          text: 听他唱得这么起劲，准是和你一样快活。
        - id: ch01-b24
          speaker: narrator
          text: 珍妮满怀爱意地看向鹪鹩先生。她问完彼得，根本没等他回答，便又噼里啪啦地说了下去。
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            他这样唱给我听，多可爱呀！这支春天的歌多美，是不是？不过，我真希望他能小心一点儿。有时我真怕他用力过头，把自己累坏。你看看他现在！他唱得那么拼命，浑身都在发抖。他一向这样。我们鹪鹩有一个共同点，不管做什么，都要把全部力气使出来。干活时拼命干，鹪鹩先生唱歌时也拼命唱。
        - id: ch01-b26
          speaker: peter_rabbit
          text: 你责备起人来，也一样拼尽全力。
        - id: ch01-b27
          speaker: narrator
          text: 彼得顽皮地插了这句话。珍妮张嘴就要尖刻地回敬，最后却笑了。
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            我承认，自己确实常常责备人。可我要是不厉害一点儿，天知道还会有谁不来欺负我们。我最受不了别人占我们的便宜。
        - id: ch01-b29
          speaker: peter_rabbit
          text: 你们从阳光灿烂的南方回来，这一路过得愉快吗？
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            还算愉快。我们一路走得很从容。有些鸟中途一次也不停，一口气飞回来，我看他们到家时一定累坏了。我们一觉得累就休息，只在春姑娘后面慢慢跟着。还要离她远一点儿，万一她不得不往回退，我们才不会被寒霜杰克抓住。慢慢走还有个好处，我们能在路上换好新衣裳。你知道，出门回家，大家总盼着你带点儿新东西嘛。彼得，你觉得我的新衣裳怎么样？
        - id: ch01-b31
          speaker: narrator
          text: 珍妮一会儿点头，一会儿扭身转圈，把新衣裳展示给彼得看。她有多得意，谁都瞧得出来。
        - id: ch01-b32
          speaker: peter_rabbit
          text: 很好看。我本来就喜欢棕色。棕色和灰色是我最喜欢的两种颜色。
        - id: ch01-b33
          speaker: narrator
          text: 彼得自己的外套，恰好也是棕色和灰色的。
        - id: ch01-b34
          speaker: jenny_wren
          text: >-
            这大概是你说过最有道理的话了。鲜艳的颜色看得越多，我越觉得棕色好。棕色总是很得体，几乎配什么都合适，又整洁，又实用。要是忽然必须赶紧藏起来，穿棕色一下就能办到，穿得花花绿绿可没那么容易。别人的衣裳比我鲜艳，我从来不羡慕。因为穿得太鲜艳而发生的可怕事，我亲眼见过不少。
        - id: ch01-b35
          speaker: peter_rabbit
          text: 什么可怕的事？
        - id: ch01-b36
          speaker: jenny_wren
          text: >-
            我宁可不说。在遥远的南方，就是我们过冬的地方，有些羽族一年四季都住在那里。他们穿着我见过最鲜艳、最漂亮的衣裳，简直华丽得不得了。可我已经留意到，一遇上危险，可怕的事总会落到他们头上。原因很简单，他们根本藏不起来。换作我，宁愿穿得朴素整洁，心里安安稳稳，也不愿披一身华服，时时刻刻都不得安宁。我知道有几个家族，正因为衣裳太漂亮，一直遭到人类捕猎，现在几乎一个也没剩下。天哪，兔子彼得，我可不能整天坐在这儿跟你说话！我得查清楚老果园里还有谁回来了，再去看看我的老房子还适不适合居住。
