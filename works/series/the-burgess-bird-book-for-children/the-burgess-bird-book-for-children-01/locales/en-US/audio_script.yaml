audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, playful, and quick
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, sharp, and affectionate
        timbre: small and crisp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Jenny Wren Arrives
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Lipperty-lipperty-lip went Peter Rabbit, scampering behind the tumble-down stone wall along one side of the Old Orchard. Morning had barely begun. It was very, very early. Jolly, bright Mr. Sun was only starting his daily climb into the blue, blue sky. Seeing him rise was nothing unusual for Peter. It would have been more unusual if Peter had missed it. He was very good at staying out all night and returning to his home in the dear Old Briar-patch just as most folks were getting out of bed.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter had been out all night this time, too, but he wasn't the least teeny, weeny bit sleepy. Sweet Mistress Spring had arrived. So much was happening on every side that Peter was afraid he might miss something. If he could help it, he wouldn't have slept at all. He had come to the Old Orchard at that early hour to learn whether anyone new had arrived the day before.
        - id: ch01-b03
          speaker: peter_rabbit
          text: Birds certainly are funny creatures.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter said this as he hopped over a low part of the old wall and landed inside the orchard.
        - id: ch01-b05
          speaker: jenny_wren
          text: >-
            Tut, tut, tut, tut, tut! Peter Rabbit, you don't know a thing about it. Birds aren't funny at all. We're the most sensible folks in the whole wide world.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That sharp, scolding voice stopped Peter in the middle of a long hop. He sat up, and his eyes shone.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            Oh, Jenny Wren, I'm so glad you're here! When did you get back?
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: >-
            Jenny fussed about on a branch above him, just as only Jenny Wren could.
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            Mr. Wren and I have only just arrived, and thank goodness we're finally here at last. Never in my life have I been so thankful to see a place as I am to see the Old Orchard right now. It feels as if we left ages and ages ago.
          emotion: happy
        - id: ch01-b10
          speaker: peter_rabbit
          text: >-
            If you love it that much, why did you leave? That's just what I meant. You birds are funny. A lot of you never stay in one place. Sammy Jay, Tommy Tit the Chickadee, Drummer the Woodpecker, and a few others have some sense. They don't go off on long, foolish trips. But the rest of you—
        - id: ch01-b11
          speaker: jenny_wren
          text: >-
            Tut, tut, tut, tut, tut! You have no idea what you're talking about. Nothing sounds sillier than someone talking about a thing he knows nothing about.
        - id: ch01-b12
          speaker: narrator
          text: Peter chuckled.
        - id: ch01-b13
          speaker: peter_rabbit
          text: >-
            Your tongue is as sharp as ever, Jenny. Still, it's good to hear it. We would certainly miss that scolding of yours. I was starting to worry that something might have happened to you, and that you wouldn't come back this summer. You know me well enough to know your sharp tongue can't hurt me. So save your breath and tell me a few things I want to know. If you truly love the Old Orchard as much as you claim, why leave it at all?
        - id: ch01-b14
          speaker: narrator
          text: Jenny Wren's bright eyes flashed.
        - id: ch01-b15
          speaker: jenny_wren
          text: Why do you eat?
        - id: ch01-b16
          speaker: peter_rabbit
          text: Because I get hungry.
        - id: ch01-b17
          speaker: jenny_wren
          text: And what would you eat if there wasn't any food?
        - id: ch01-b18
          speaker: peter_rabbit
          text: That's a silly question.
        - id: ch01-b19
          speaker: jenny_wren
          text: >-
            It's no sillier than asking why I leave the Old Orchard. Give us birds credit for a little common sense, Peter. We can't live without eating any more than you can. In winter, most of us can't find any food here, so we go where it can be found. Birds that eat the kinds of food still available here are able to stay. They're lucky. That's exactly what they are—lucky. And yet—
        - id: ch01-b20
          speaker: narrator
          text: Jenny stopped there for a moment.
        - id: ch01-b21
          speaker: peter_rabbit
          text: And yet what?
        - id: ch01-b22
          speaker: jenny_wren
          text: >-
            Sometimes I wonder whether you folks who stay home all the time understand what a blessed place home is. We've been south for only six months, but it truly feels like ages. The best part of going away is coming home. I don't care if that sounds mixed up, because it's true. The sunny South isn't home, even if we spend as much time there as we do here. This is home, and there's no place like it! What's that, Mr. Wren? You say I haven't seen the whole Great World? Maybe not, but I've seen quite enough of it, let me tell you. Anyone who travels a thousand miles twice each year has earned the right to an opinion, especially anyone who uses her eyes as I do. There is no place like home. Don't tease me by pretending otherwise. My dear, I know you. You're every bit as delighted to be back as I am.
        - id: ch01-b23
          speaker: peter_rabbit
          text: He certainly sings as though he is.
        - id: ch01-b24
          speaker: narrator
          text: Mr. Wren had been singing with all his might through their whole conversation. Jenny looked over at him fondly as his song went on.
        - id: ch01-b25
          speaker: jenny_wren
          text: >-
            Isn't he a dear, singing to me that way? And isn't that the loveliest spring song? I only wish he would be careful. Sometimes I'm afraid he'll do too much. Just look at him! He's singing so hard that his whole body is shaking. He's always like that. We Wrens do everything with all our might. When we work, we work with all our might. When Mr. Wren sings, he sings with all his might.
        - id: ch01-b26
          speaker: peter_rabbit
          text: And when you scold, you scold with all your might.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Peter spoke mischievously. Jenny opened her mouth, ready with a sharp answer, but then she laughed instead.
        - id: ch01-b28
          speaker: jenny_wren
          text: >-
            I suppose I do scold a great deal. But if I didn't, goodness knows who would try to take advantage of us. I simply can't bear to have anyone do that.
        - id: ch01-b29
          speaker: peter_rabbit
          text: Was your journey from the sunny South pleasant?
        - id: ch01-b30
          speaker: jenny_wren
          text: >-
            It was pleasant enough. We took things rather easily and didn't rush. Some birds hurry straight through without stopping, but I should think they'd be tired to death by the time they arrive. We rest whenever we get tired. We simply follow behind Mistress Spring, staying far enough back that Jack Frost won't catch us if she has to turn around. That also gives us time to put on our new suits along the way. You know everyone expects you to have something new when you return home. Well, Peter, what do you think of mine?
        - id: ch01-b31
          speaker: narrator
          text: >-
            Jenny bobbed, twisted, and turned this way and that so Peter could see her new suit from every side. It was plain to anyone watching that she was very proud of it.
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            I like it very much. I'm especially fond of brown. Brown and gray are my favorite colors.
        - id: ch01-b33
          speaker: narrator
          text: You may remember that Peter's own coat was brown and gray. Those were the very colors he had just named as his favorites.
        - id: ch01-b34
          speaker: jenny_wren
          text: >-
            That's one of the most sensible things I've ever heard you say. The more bright colors I see, the more I prefer brown. It's always in good taste and goes well with almost everything. Brown looks neat, and it's useful too. If you suddenly need to get out of sight, you can do it in brown. Bright colors make that much harder. I never envy anyone whose clothes are brighter than mine. I've seen dreadful things happen all because someone wore bright colors.
        - id: ch01-b35
          speaker: peter_rabbit
          text: What dreadful things?
        - id: ch01-b36
          speaker: jenny_wren
          text: >-
            I'd rather not speak about them. Far down south, where we spent the winter, some feathered folks who live there all year wear the brightest, most beautiful suits I've ever seen. They're simply gorgeous. But I've noticed that when danger comes, those are the birds dreadful things happen to. They just can't get out of sight. For my part, I'd much rather dress simply and neatly and feel safe than wear wonderful clothes and never know a minute's peace. I know some families whose beautiful suits made men hunt them so much that hardly any of them are left. But gracious, Peter Rabbit, I can't sit here talking to you all day! I need to find out who else has reached the Old Orchard. Then I must look over my old house and see whether it's fit to live in.
