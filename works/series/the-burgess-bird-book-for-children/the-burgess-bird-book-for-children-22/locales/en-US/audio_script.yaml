  chapters:
    - id: ch01
      title: Some Feathered Diggers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit scampered along one bank of the Laughing Brook. He was eagerly watching for a high, gravelly bank, the kind Grandfather Frog had said Rattles the Kingfisher used for his home. If Peter had stopped to think, he would have known he was wasting his time. The Laughing Brook flowed through the Green Meadows. Those meadows were low, so of course there could be no high, gravelly bank beside the water. But Peter did not stop to think. He had seen Rattles fly down the brook, and in his usual heedless way, he simply took it for granted that Rattles must live somewhere downstream.
        - id: ch01-b02
          speaker: narrator
          text: >-
            At last Peter reached the place where the Laughing Brook entered the Big River. Of course, he had found no sign of Rattles's home. Then something else made him forget all about Rattles for a while. Just before the brook reached the river, it wound through a swamp filled with many tall trees and a great number of young ones. Big ferns grew everywhere, and they made splendid hiding places. Peter had always liked that swamp.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter had stopped to rest beneath a clump of ferns when a great bird landed in a tree only a little way from him. His first thought was that it must be a Hawk. Then he saw Mrs. Longlegs, and you can imagine how pleased and surprised he was. Somehow, Peter had always imagined that Longlegs the Blue Heron and his wife never landed anywhere except on the ground. Yet there Mrs. Longlegs was, perched high in a tree. Once Peter knew he had nothing to fear, he crept from his hiding place so he could see her better.
        - id: ch01-b04
          speaker: narrator
          text: >-
            In the same tree, just below Mrs. Longlegs, Peter saw a small platform made of sticks. He never suspected that it was a nest. It looked far too rough and far too loosely put together for that. He probably would not have thought about it again if Mrs. Longlegs had not settled herself right onto it while he watched. The platform hardly seemed large enough or strong enough to hold such a great bird, but somehow it did.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            Well, I've found the Longlegs nest! They may be fine fishermen, but they are dreadful nest builders. How does Mrs. Longlegs get on and off without kicking out the eggs?
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter sat there for a while and watched. He did not care to let Mrs. Longlegs know he was nearby, and there was no one for him to talk to. Before long he made up his mind to leave. Since the Big River was so close, he would go over and see whether Plunger the Osprey was fishing there again that day.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Plunger was nowhere in sight, and Peter was disappointed. He was about to turn back when he heard the harsh, rattling cry of Rattles the Kingfisher from beyond the swamp, farther up the river. At once Peter remembered why he had come and hurried toward the sound.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter came out of the swamp onto a little sandy beach. He squatted there for a moment, blinking because the sunshine was very bright out in the open. Then, only a little way beyond him, he saw a high sandy bank. His eager curiosity made him forget that an open beach was anything but safe for a Rabbit. He gave one hurried look this way and that to make sure no enemy was in sight. Then he raced along the water until he stood right at the foot of the bank.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Peter squatted down and searched eagerly for the kind of hole he imagined Rattles might dig. Instead of one hole, he found a great many, and every one was tiny. Rattles could never have gone in or out of any of them. In fact, they were no larger than the holes Downy the Woodpecker makes in trees. Peter stared at them and tried to imagine what could possibly have made so many little doorways in a sandy bank.
        - id: ch01-b10
          speaker: narrator
          text: >-
            As Peter sat staring and wondering, a neat little head appeared in one doorway. It had a very small bill and a snowy white throat. At first Peter mistook it for his old friend Skimmer the Tree Swallow. He was just about to ask what in the world Skimmer was doing in a place like that. Then the bird flew out with a lively twitter of greeting and circled over Peter's head. The moment Peter got a full look, he knew the truth. This was Banker the Bank Swallow, Skimmer's own cousin.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Banker was a little smaller than Skimmer and not nearly as handsome. Instead of Skimmer's rich steel-blue back, he wore sober grayish-brown, with darker wings and tail. A brownish band crossed his white breast, and his tail ended more squarely than the tails of other Swallows.
        - id: ch01-b12
          speaker: peter_rabbit
          text: Wh-what were you doing in there?
        - id: ch01-b13
          speaker: banker_bank_swallow
          text: Why, that's where I live.
        - id: ch01-b14
          speaker: peter_rabbit
          text: You mean your home is a hole in the ground?
          emotion: surprised
        - id: ch01-b15
          speaker: banker_bank_swallow
          text: Certainly. Why shouldn't it be?
        - id: ch01-b16
          speaker: narrator
          text: Banker snapped up a fly just above Peter's head.
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            I suppose there's no reason you shouldn't. It's just hard for me to imagine birds living in holes in the ground. I only learned today that Rattles the Kingfisher does, and I never thought any other bird did. Did you and Mrs. Banker dig this hole yourselves?
        - id: ch01-b18
          speaker: banker_bank_swallow
          text: >-
            Of course, though Mrs. Banker did her share too. At the far end, we made a fine little nest from straw and feathers. There are four white eggs inside, and Mrs. Banker is sitting on them now.
        - id: ch01-b19
          speaker: narrator
          text: >-
            By then the air seemed full of Banker's friends. They skimmed and circled this way and that. Again and again, they disappeared into the little holes along the bank or came darting out of them.
        - id: ch01-b20
          speaker: banker_bank_swallow
          text: >-
            Like my big cousin Twitter the Purple Martin, I enjoy company. We Bank Swallows build our homes close together. You said you just learned that Rattles lives in a bank. Do you know where his home is?
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            No. I was searching for it when I found your home. Can you tell me where it is?
        - id: ch01-b22
          speaker: banker_bank_swallow
          text: I can do better than tell you. I'll show you.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Banker darted some distance along the bank and hovered for a moment close to the top. Peter scampered after him and looked up. Just a few inches below the edge was another hole, much larger than all the Bank Swallow doorways he had left behind. While Peter stared, a head poked out. It had a long, sharp bill and a crest that looked as though every feather on top had been brushed the wrong way. There could be no mistake. It was Rattles himself.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Rattles was not at all pleased to see Peter. He burst from the hole and darted angrily at him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Peter had no wish to find out what that sharp, dagger-like bill would feel like. He took to his heels at once. He had seen the very thing he started out to find, and now he was quite content to go home.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter took a shortcut across the Green Meadows, and it led him past a certain tall, dead tree. A sharp cry of “Kill-ee, kill-ee, kill-ee!” made him look up just in time to see a trim, handsome bird. Its body was about the size of Sammy Jay's, though its longer wings and longer tail made it seem larger. One glance told Peter that the bird belonged to the Hawk family. In fact, it was the smallest member of that family, Killy the Sparrow Hawk. Killy was too small for Peter to fear, so Peter was filled with nothing more than lively curiosity. He sat up to watch.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Killy sailed out over the meadow grass. Suddenly he began beating his wings and held himself in one place in the air. Then he dropped straight down into the grass. An instant later he was up again, and Peter could see a fat grasshopper in his claws. Killy carried it back to the top of the tall, dead tree and ate it there. When he finished, he sat upright without moving. He was so still that he seemed to be part of the tree itself. All the while, his wonderful eyes searched the grass for another grasshopper or a careless Meadow Mouse.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Killy truly was trim and handsome enough for anyone to admire. Black bars crossed his reddish-brown back. His tail was reddish-brown too, with a black band near the end and a white tip. His slaty-blue wings were marked with little bars of black, while the longest feathers left white bars. Underneath, he was a lovely buff color spotted with black. His head was bluish, with a reddish patch right on top. There was one black mark before each ear and another behind it. His bill was rather short, but like the bills of all the other Hawks, it curved into a hook.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Peter sat admiring Killy for a while. Then, for the first time, he noticed a hole high in the trunk of the dead tree. It was just the sort of hole Yellow Wing the Flicker might have made, and probably had made. At once Peter remembered what Jenny Wren had told him. Killy made his nest in a hole exactly like that one.
        - id: ch01-b30
          speaker: peter_rabbit
          text: I wonder if that's Killy's home.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Just then Killy flew down and landed in the grass directly in front of Peter. He caught another fat grasshopper, and Peter hurried to ask his question.
        - id: ch01-b32
          speaker: peter_rabbit
          text: Is that hole up there your home?
        - id: ch01-b33
          speaker: killy_sparrow_hawk
          text: >-
            It certainly is, Peter. Mrs. Killy and I have lived there for three summers now.
        - id: ch01-b34
          speaker: peter_rabbit
          text: You seem to like grasshoppers very much.
        - id: ch01-b35
          speaker: killy_sparrow_hawk
          text: I do. They're fine eating when I can find enough of them.
        - id: ch01-b36
          speaker: peter_rabbit
          text: Are grasshoppers all you eat?
        - id: ch01-b37
          speaker: narrator
          text: Killy gave a shrill laugh.
        - id: ch01-b38
          speaker: killy_sparrow_hawk
          text: >-
            Of course not! I eat spiders, worms, and every sort of insect big enough to make a decent bite. But if you want to know what's truly good, give me a fat Meadow Mouse. Now and then I don't mind a Sparrow or another small bird, especially when I have hungry youngsters to feed. Still, through most of the season I live on grasshoppers, other insects, and Meadow Mice. I do plenty of good in this world, you know.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Peter told Killy that he supposed this was true. All the while, though, he kept thinking what a pity it was that Killy ever killed any of his feathered neighbors. As soon as he could do so politely, Peter said good-by. Then he hurried home to the dear Old Briar-patch.
        - id: ch01-b40
          speaker: narrator
          text: >-
            There he thought about how strange it was that a Hawk should nest in a hollow tree, while a Swallow dug a home in the ground.
