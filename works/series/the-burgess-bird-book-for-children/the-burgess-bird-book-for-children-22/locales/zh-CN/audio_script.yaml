audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    banker:
      display_name: 岸燕穴居者
      tts:
        delivery: 爽朗友善，说话干脆利落
        timbre: 轻盈清脆
        pace: 明快
        pitch: 高音
    killy:
      display_name: 杀手雀鹰
      tts:
        delivery: 自信爽快，带一点尖锐的幽默
        timbre: 清亮锐利
        pace: 中等偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 沼泽树上的鸟巢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得沿着欢笑溪的一边飞奔，一路急切地寻找青蛙爷爷说过的那种高高的沙砾岸坡。只要他肯停下来想一想，就会明白自己是在白费工夫。欢笑溪流过地势低平的绿草地，这里当然不会有那样的高岸。可彼得还是老样子，冒冒失失，根本没有动脑筋。他亲眼看见喀嗒顺着溪流飞走，就想当然地认定，喀嗒的家一定在下游某个地方。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得一直跑到欢笑溪汇入大河的地方，当然没有找到喀嗒的家。可另一番景象很快叫他忘了原来的目标。欢笑溪在汇入大河前，先蜿蜒穿过一片沼泽。那里有许多高大的树，也有数不清的小树。大片蕨草长得又密又高，躲在下面再合适不过，彼得一直很喜欢这个地方。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他躲进一丛蕨草休息，忽然看见一只大鸟落在附近的树上，吓得以为是鹰。看清那是长腿太太以后，他又惊讶又高兴。彼得一直以为，大蓝鹭长腿一家只会落在地面上。既然没有危险，他便悄悄爬出来，想瞧得仔细些。
        - id: ch01-b04
          speaker: narrator
          text: >-
            就在长腿太太落脚的那棵树上，在她下方不远处，有一个树枝搭成的小平台。它粗糙又松散，一点也不像鸟巢。彼得原本压根不会多想，直到长腿太太当着他的面伏上去，他才明白过来。那平台看着既小又不结实，仿佛根本托不住这样一只大鸟，偏偏真的托住了她。
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            真没想到，我找到长腿的巢了！长腿和长腿太太捕鱼很在行，搭巢的本事可真不怎么样。长腿太太每次上下鸟巢，怎么就不会把蛋踢出去呢？
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得留在附近看了一会儿。他不想让长腿太太发现自己的踪影，身边又没人陪他说话。既然已经离大河这么近，他便决定过去看看，鹗猛扎今天是不是又在捕鱼。
        - id: ch01-b07
          speaker: narrator
          text: >-
            可到了大河边，猛扎连影子也没有，彼得失望极了。他等了一会儿，差不多已经决定照着来路返回，忽然听见更上游的沼泽那边传来喀嗒刺耳的咔嗒声。这叫声让他总算想起自己此行的目的，立刻赶紧朝声音传来的方向跑去。
    - id: ch02
      title: 沙岸里的燕子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            彼得钻出沼泽，来到一小片沙滩上。外面的阳光十分耀眼，刺得他蹲在那里直眨眼。就在前方，他看见了一面高高的沙岸。好奇心一上来，他连自己站在危险的空旷处都忘了。兔子待在这种地方，四周没有遮掩，可一点也不安全。彼得匆匆左右看看，确定没有敌人，便沿着水边一直跑到沙岸脚下，蹲在那里寻找喀嗒会挖的那种洞。
        - id: ch02-b02
          speaker: narrator
          text: >-
            岸上没有一个大洞，倒有许许多多的小洞。这些洞并不比绒毛啄木鸟小绒凿出的树洞大，喀嗒无论如何也钻不进去。彼得想不出究竟是谁，或是什么东西挖出了它们。他正盯着洞口纳闷，一个小巧的脑袋探了出来。那只鸟嘴巴很小，喉部像雪一样白。彼得起初还以为是树燕掠水，正想问他怎么跑到了这里，洞里的鸟已经欢快地啾啾叫着飞出，在彼得头顶绕起圈来。
        - id: ch02-b03
          speaker: narrator
          text: >-
            彼得一看清全貌，马上认出这是掠水的嫡亲表弟，岸燕穴居者。穴居者比掠水略小，也远没有表哥那么漂亮。掠水有一身华美浓郁的钢蓝色羽毛，穴居者的背部却是朴素的灰褐色，翅膀和尾巴颜色稍深。他的胸前也不是通体雪白，而是横着一条褐色带子。尾端比燕子家族的其他成员更平直，差不多是方的。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 你……你……你刚才在洞里做什么？
        - id: ch02-b05
          speaker: banker
          text: 那就是我的家呀。
        - id: ch02-b06
          speaker: peter_rabbit
          text: 你……你……你是说，你住在地洞里？
          emotion: surprised
        - id: ch02-b07
          speaker: banker
          text: 当然。为什么不呢？
        - id: ch02-b08
          speaker: narrator
          text: 穴居者说着，顺口叼住了彼得头顶的一只苍蝇。彼得却越发好奇，眼睛瞪得滚圆。
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            我也说不出你为什么不能住在地洞里。可我总觉得，鸟儿住在地下很难想象。我才知道翠鸟喀嗒这样住，没想到还有别的鸟也一样。穴居者，这个洞是你自己挖的吗？
        - id: ch02-b10
          speaker: banker
          text: >-
            当然，不过我只是出了自己那份力，穴居者太太也干了她那一份。一直走到洞穴最深处，你才会看见一个舒服的小巢，那是我们用干草和羽毛搭成的。里面还有四枚白色的蛋，穴居者太太这会儿正在孵呢。
        - id: ch02-b11
          speaker: narrator
          text: >-
            这时候，空中仿佛到处都是穴居者的朋友。他们有的贴着地面掠过，有的绕着沙岸来回盘旋，还有的不断钻进一个个小洞，又从洞中飞出来。原来，这整面沙岸都是岸燕们的家。
        - id: ch02-b12
          speaker: banker
          text: >-
            我跟大表哥紫崖燕啁啾一样，都爱热热闹闹地住在一起。我们岸燕喜欢把家挨得很近。你说自己才知道喀嗒也住在岸坡里，那你知道他的家在哪儿吗？
        - id: ch02-b13
          speaker: peter_rabbit
          text: 我就是在找他的家，结果先发现了你们这里。你能告诉我他住在哪儿吗？
        - id: ch02-b14
          speaker: banker
          text: 我直接带你去看，这可比告诉你更好。
    - id: ch03
      title: 喀嗒守卫洞口
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            穴居者沿着沙岸向前飞出一段，在靠近岸顶的地方悬停片刻。彼得赶紧跑过去，仰头顺着穴居者停留的地方看。离岸顶只有几英寸的地方，果然还有一个洞。这个洞跟刚才那些岸燕的家完全不同，洞口大得多，喀嗒那样的大脑袋和长嘴正好能够进出。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他正仰头看着，一个长着尖利长嘴的脑袋突然探了出来。头顶那簇冠羽像是全被人梳反了，正是喀嗒本人。喀嗒见到彼得一点也不高兴。他立刻飞出洞口，气冲冲地直扑彼得。彼得可不想亲自尝尝那张匕首似的尖嘴，拔腿就跑。他出门寻找的东西已经亲眼看到了，现在十分满足，可以回家了。
    - id: ch04
      title: 枯树顶上的猎手
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            彼得抄近路穿过绿草地，走到一棵高高的枯树旁。忽然，一阵“基利——基利——基利！”的尖叫让他抬起头。他看见一只漂亮又利落的鸟，身体和冠蓝鸦萨米差不多大，只因翅膀和尾巴更长，显得更大一些。彼得只看一眼就知道，这是鹰家族的成员，而且是全家族里最小的一位，杀手雀鹰。杀手小得伤不了彼得，所以彼得一点也不怕。他直起身子坐好，兴致勃勃地看了起来。
        - id: ch04-b02
          speaker: narrator
          text: >-
            杀手滑翔到草地上空，忽然快速拍动翅膀，把身体定在空中同一个地方，接着一头落进草丛。他转眼又飞起来，爪中已经多了一只肥蚱蜢。他飞回高高的枯树顶端，在那里把蚱蜢吃掉。吃完以后，他直挺挺地坐着，一动不动，静得仿佛成了枯树的一部分。那双非凡的眼睛仍在搜寻下一只蚱蜢，或是哪只粗心的草地鼠。
        - id: ch04-b03
          speaker: narrator
          text: >-
            杀手的背部呈红褐色，横着道道黑纹。红褐色的尾巴靠近末端有一圈黑带，尾尖是白的。石板蓝色的翅膀也带着细小黑纹，最长的几根羽毛间露出一道道白纹。身体下面是漂亮的浅黄褐色，上面点着黑斑。他的头部泛蓝，正顶上有块红褐色斑纹，每只耳朵前后各有一块黑斑。那张嘴比较短，跟鹰家族的其他成员一样，弯成钩状。
        - id: ch04-b04
          speaker: narrator
          text: >-
            杀手的确英俊，任谁见了都会忍不住多看几眼。彼得正坐在那里欣赏着他，忽然第一次注意到树干高处有个洞。那洞很像黄翅扑翅鴷凿出来的，很可能正是他的手艺。彼得立刻想起鹪鹩珍妮曾说，杀手喜欢在这样的树洞里筑巢。
        - id: ch04-b05
          speaker: peter_rabbit
          text: 不知道那是不是杀手的家。
        - id: ch04-b06
          speaker: narrator
          text: >-
            恰好这时，杀手从树顶飞过来，一头落进彼得面前的草丛。等他再抬起身子，爪子已经牢牢抓住了另一只肥蚱蜢。机会难得，彼得赶紧问他。
        - id: ch04-b07
          speaker: peter_rabbit
          text: 上面那个洞是你的家吗？
        - id: ch04-b08
          speaker: killy
          text: 当然是，彼得。这个树洞是我们的老家，我和杀手太太已经连续三个夏天住在那里了。
        - id: ch04-b09
          speaker: peter_rabbit
          text: 你好像特别喜欢吃蚱蜢。
        - id: ch04-b10
          speaker: killy
          text: 没错。只要能吃个够，蚱蜢可是上好的美味。
        - id: ch04-b11
          speaker: peter_rabbit
          text: 你只吃蚱蜢这一种东西吗？
        - id: ch04-b12
          speaker: narrator
          text: 杀手发出一阵尖利的笑声。
        - id: ch04-b13
          speaker: killy
          text: >-
            那怎么可能！蜘蛛、虫子，还有各种大得足够让我好好咬上一口的昆虫，我都吃。可要说真正的美味，还得是肥肥的草地鼠。偶尔吃只麻雀或别的小鸟，我也不反对，尤其是家里还有一窝饿坏了的小家伙要喂。不过，把整个季节算下来，我吃得最多的还是蚱蜢、昆虫和草地鼠。你得知道，我在这个世界上做的好事多着呢。
    - id: ch05
      title: 两种古怪的家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            彼得嘴上说，他想大概确实如此。可他心里始终觉得，杀手竟会杀害那些长羽毛的邻居，实在太可惜了。等到终于有了合适的机会，彼得便客客气气地向杀手告别，匆匆回到亲爱的老荆棘丛。
        - id: ch05-b02
          speaker: narrator
          text: >-
            回到家里，他还在琢磨这件怪事。鹰家族的成员竟在空心树里筑巢，燕子家族的成员反倒在地里挖洞安家，真是怎么想都奇怪。
