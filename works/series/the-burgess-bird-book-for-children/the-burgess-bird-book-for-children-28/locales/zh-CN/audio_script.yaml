audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 细亮有穿透力
        pace: 快速紧凑
        pitch: 高音
    redcoat_tanager:
      display_name: 唐纳雀红衣
      tts:
        delivery: 温和敏感，受伤时气息虚弱而急促
        timbre: 清润柔和
        pace: 中速偏缓
        pitch: 中高音
    mrs_tanager:
      display_name: 唐纳雀太太
      tts:
        delivery: 关切体贴，焦急时语速明显加快
        timbre: 柔亮纤细
        pace: 中速
        pitch: 高音
    farmer_browns_boy:
      display_name: 农夫布朗的儿子
      tts:
        delivery: 善良沉稳，对动物说话轻柔耐心
        timbre: 清澈朴实
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 树梢上的玫瑰胸
      blocks:
        - id: ch01-b01
          speaker: peter_rabbit
          text: >-
            那是谁？
        - id: ch01-b02
          speaker: narrator
          text: >-
            兔子彼得竖起长耳朵，朝老果园的树梢望个不停。鹪鹩珍妮马上从家门里探出头，歪着脑袋仔细听了听，又低头看看彼得。她那双锐利的小眼睛闪了闪，像是已经猜到彼得又有什么弄不明白了。
        - id: ch01-b03
          speaker: jenny_wren
          text: >-
            我可没听见陌生的声音。兔子彼得，看你瞪着眼睛的样子，别人还以为你听见了什么了不得的新声音呢。
        - id: ch01-b04
          speaker: narrator
          text: >-
            就在这时，一棵树顶传来两三声尖尖的吱叫。
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            听，就在那儿！珍妮，你没听见吗？
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            天哪，你不会连这是谁都不知道吧？那是玫瑰胸。他和玫瑰胸太太来了好一阵子啦。谁会不认得那种尖尖的叫声？听得人心烦。明明能像玫瑰胸一样唱得那么好，干吗还要吱吱叫？我真不明白。
        - id: ch01-b07
          speaker: narrator
          text: >-
            话音刚落，鹪鹩先生也尖声数落起来。要说起数落人的本事，只有他和珍妮最拿手。彼得抬头看着珍妮，狡黠地眨了眨眼。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            明明能像鹪鹩先生那样唱歌，干吗还要这样数落人？我也想不明白。不过，你还是没告诉我玫瑰胸是谁。
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            当然是蜡嘴雀呀，笨蛋！你连玫瑰胸蜡嘴雀都不认识，准是从小又瞎又聋。听，好好听听他的歌！
        - id: ch01-b10
          speaker: narrator
          text: >-
            这个早晨美极了，老果园的歌手们都在唱出心里的欢喜，一支支歌交织在一起。近旁有一支歌稍响一些，也更清亮。歌声正是从刚才发出尖叫的那棵树上传来的。彼得猜想，珍妮指的就是它，可他越听越迷惑，还是分辨不出来。
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            你说的是报春知更鸟唱的歌吗？
        - id: ch01-b12
          speaker: narrator
          text: >-
            彼得问得有点儿难为情。他知道，珍妮那张厉害的嘴多半又要冲着自己来了。
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            才不是报春知更鸟！连两支歌都分不出来，你要那对长耳朵有什么用？两支歌是有点儿像，可只要耳朵管用，你马上就知道唱歌的不是他。这一支唱得更好。报春知更鸟让人振作，玫瑰胸唱的却是满心的快乐。兔子彼得，就算把全世界都给我，我也不要你那样的耳朵。
        - id: ch01-b14
          speaker: narrator
          text: >-
            彼得一想到珍妮顶着一对兔子长耳朵的模样，越想越觉得好玩，忍不住放声笑了起来。这一下，珍妮可恼火了。
        - id: ch01-b15
          speaker: jenny_wren
          text: >-
            你笑什么？不许笑我！我最受不了别人拿我取笑。
          emotion: angry
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            我没有笑你，真的没有。我只是忽然想到，要是你也长着我这样的长耳朵，模样一定很好玩。现在听你这么一说，我再仔细听听，那首歌确实跟报春知更鸟的不一样。
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            本来就不一样。唱歌的就是玫瑰胸。抬头看，他就在那棵树的最高处。现在瞧见了吗？他是不是很英俊？
    - id: ch02
      title: 蜡嘴雀夫妇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            彼得抬头看见一只比报春知更鸟稍小的鸟。他的头、喉咙和背部都是黑色的，黑翅膀上还有一片片白斑。最美的是胸前那片玫瑰红，衬着雪白的腹部，叫彼得赞叹得吸了一口气。他就是蜡嘴雀玫瑰胸。
        - id: ch02-b02
          speaker: peter_rabbit
          text: >-
            他真漂亮！跟他待在一起的又是谁？
          emotion: surprised
        - id: ch02-b03
          speaker: jenny_wren
          text: >-
            当然是蜡嘴雀太太，不然还能是谁？
        - id: ch02-b04
          speaker: narrator
          text: >-
            珍妮还在为刚才被彼得取笑而不痛快，所以说起话来颇不耐烦。
        - id: ch02-b05
          speaker: peter_rabbit
          text: >-
            我真猜不到是她。她跟玫瑰胸一点儿也不像。
        - id: ch02-b06
          speaker: narrator
          text: >-
            彼得说得没错。蜡嘴雀太太没有玫瑰红的胸脯。她身上大多是棕色和灰色，夹着几处浅黄褐色，胸前带着深色条纹，每只眼睛上方还有一道发白的细纹。总的看起来，她更像麻雀家族里个头较大的一员，不大像俊美的玫瑰胸的妻子。玫瑰胸站在一旁唱歌时，她一直忙个不停，专心啄下树上的嫩芽和花朵。
        - id: ch02-b07
          speaker: peter_rabbit
          text: >-
            她为什么要啄那些东西？
        - id: ch02-b08
          speaker: jenny_wren
          text: >-
            就跟你爱咬香甜的三叶草花和叶子一样。
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            难道他们就靠嫩芽和花过日子？我从没听过这样的事。
          emotion: surprised
        - id: ch02-b10
          speaker: jenny_wren
          text: >-
            啧、啧、啧、啧、啧！我认识的人里，就数你的傻问题最多。他们当然不能靠这些活着。嫩芽和花开不了多久，光吃这个，很快就要饿死啦。他们只是偶尔吃一点儿，给每天的食物换换口味，平常主要吃甲虫和昆虫。你去问农夫布朗的儿子，谁在马铃薯地里帮他的忙最多，他准会说是蜡嘴雀。他们最爱吃马铃薯甲虫。虽然也吃一点儿水果，可总的说来，说到替花园除虫，我认识的鸟儿里很少有谁比他们更有用。好了，兔子彼得，快走吧，别再烦我。
        - id: ch02-b11
          speaker: narrator
          text: >-
            彼得看见农夫布朗的儿子正穿过老果园，觉得自己确实早该离开了。他一颠一跳，飞快地跑向绿森林。
    - id: ch03
      title: 红衣受伤了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            刚到绿森林边缘，彼得就在地上看见一只拍翅挣扎的鸟，立刻把农夫布朗的儿子抛到脑后。那只鸟和红翅黑鹂差不多大，翅膀和尾巴乌黑发亮，身体其余地方全是耀眼的鲜红。就连北美红雀华彩也未必比他更美。他正是唐纳雀红衣。起初，彼得眼里只有那身惊人的红羽毛。他从没在这么近的地方见过红衣，忍不住看了又看。过了一会儿，他才突然发现红衣不对劲，赶紧跑过去看看出了什么事。
        - id: ch03-b02
          speaker: narrator
          text: >-
            红衣听见彼得踩过枯叶的窸窣声，马上拼命扑打翅膀，却怎么也飞不起来。
        - id: ch03-b03
          speaker: peter_rabbit
          text: >-
            红衣，你怎么了？出什么事啦？我是兔子彼得，你不用怕我。
        - id: ch03-b04
          speaker: narrator
          text: >-
            红衣认出了彼得，原先充满眼睛的恐惧渐渐退去。他终于不再拍翅挣扎，只能软软地趴在地上，一口接一口地喘着气。
        - id: ch03-b05
          speaker: redcoat_tanager
          text: >-
            啊，彼得，幸好来的是你！你不知道我有多高兴。我出了很可怕的意外，真不知道该怎么办。我飞不起来。一直留在地上，敌人准会抓住我。彼得，我该怎么办？到底该怎么办？
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: >-
            彼得听了，心里立刻充满同情。
        - id: ch03-b07
          speaker: peter_rabbit
          text: >-
            红衣，是什么意外？事情怎么会变成这样？
        - id: ch03-b08
          speaker: redcoat_tanager
          text: >-
            阔翅鹰想抓住我。我在树林里躲他，一时没看清前面，撞上了一根尖尖的枯枝。那根树枝刺穿了我的右翅膀。
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: >-
            红衣把右翅膀抬起来给彼得看。果然，一截小树枝从靠近肩膀的地方直穿过去，两头都露在翅膀外面，伤口还在微微流血。
        - id: ch03-b10
          speaker: redcoat_tanager
          text: >-
            哎呀，兔子彼得，我到底该怎么办？
          emotion: fearful
        - id: ch03-b11
          speaker: peter_rabbit
          text: >-
            是不是疼得很厉害？
        - id: ch03-b12
          speaker: narrator
          text: >-
            红衣点点头。
        - id: ch03-b13
          speaker: redcoat_tanager
          text: >-
            疼倒不要紧。我害怕的是，接下来会出什么事。
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: >-
            就在他们说话的时候，唐纳雀太太正在附近的树梢间飞来飞去，一声声焦急地呼唤。她的衣裳几乎全是浅橄榄绿色和黄绿色，跟漂亮的红衣完全不像，正如蜡嘴雀太太看起来一点儿也不像玫瑰胸一样。
        - id: ch03-b15
          speaker: mrs_tanager
          text: >-
            你不能稍微飞起来一点儿，先离开地面吗？兔子彼得，这样的意外太可怕了。我们的巢才搭好一半，要是红衣出了事，我真不知道怎么办。哎呀，有人来了！红衣，快躲起来！
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: >-
            唐纳雀太太飞到一旁不远的地方，发出一声声痛苦的哀鸣，仿佛那里才出了大事。彼得马上明白，她想把来人的注意力引向自己。红衣眼里又满是先前那种恐惧。他一路拼命往前扑腾，想找个东西钻到下面藏起来。可周围根本没有这样的地方，那身鲜红的羽毛也实在藏不住。沉重的脚步越来越近，彼得回头一看，原来是农夫布朗的儿子。
        - id: ch03-b17
          speaker: peter_rabbit
          text: >-
            别害怕，红衣。他不会伤害你，说不定还能帮你。
          emotion: calm
        - id: ch03-b18
          speaker: narrator
          text: >-
            彼得跑开一小段，直起身子坐在那里，要看看接下来会怎样。
    - id: ch04
      title: 温柔的援手
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            农夫布朗的儿子当然看见了红衣。那身鲜红太显眼了，只要长着眼睛，谁也不可能看不见。他也从红衣挣扎的样子看出，这只鸟遇上了大麻烦。男孩越走越近，红衣发现自己被看见了，又使出全身力气，想扑腾着逃走。农夫布朗的儿子一下就明白，他的一只翅膀出了问题，于是赶紧跑上前，把他捉住了。
        - id: ch04-b02
          speaker: farmer_browns_boy
          text: >-
            可怜的小家伙，你这么漂亮，却伤成了这样。这根树枝得马上取出来。
        - id: ch04-b03
          speaker: narrator
          text: >-
            农夫布朗的儿子看见那根尖利的树枝穿过红衣的肩头，一边轻声安慰，一边非常温柔地抚摸他。不知怎么的，在那只温柔的手掌下，红衣心里的恐惧消退了许多，也第一次生出了一点希望。他仔细看着眼前的男孩，终于明白，这不是要伤害他的敌人，而是来帮助他的朋友。
        - id: ch04-b04
          speaker: narrator
          text: >-
            男孩拿出小刀，小心地削断翅膀上方的树枝。然后，他尽量放轻动作，免得让红衣太疼，又从翅膀下方慢慢抽出剩下的半截。他仔细检查整只翅膀，想知道有没有骨头折断，幸好一根也没有。男孩又把红衣捧在手里待了几分钟，才轻轻放到树上，自己退开一小段距离。
        - id: ch04-b05
          speaker: narrator
          text: >-
            红衣从一根树枝跳到另一根，一直跳到树的半腰。他停在那里坐了好一阵子，像是害怕再试用受伤的翅膀。唐纳雀太太飞到他身旁，围着他忙前忙后，不停地跟他说话、哄着他、鼓励他，把他当成小宝宝一样百般照料。
        - id: ch04-b06
          speaker: narrator
          text: >-
            彼得一直留在原地，耐心等着。终于，他看见红衣展开那双黑翅膀，飞到了另一棵树上。接着，红衣一棵树一棵树地往前飞，每到一处都要停下来歇一会儿。唐纳雀太太始终陪着他。最后，他们一起消失在绿森林深处，再也看不见了。
        - id: ch04-b07
          speaker: peter_rabbit
          text: >-
            我就知道农夫布朗的儿子会帮助他。幸好他找到了红衣，我真高兴！
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: >-
            彼得欢欢喜喜地说完这番话，便转过身，动身回他心爱的老蔷薇丛去了。
