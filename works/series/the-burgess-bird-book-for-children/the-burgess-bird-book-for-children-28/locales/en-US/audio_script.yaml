  chapters:
    - id: ch01
      title: Peter Sees Rosebreast and Finds Redcoat
      blocks:
        - id: ch01-b01
          speaker: peter_rabbit
          text: Who's that?
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter Rabbit raised his long ears and gazed into the treetops of the Old Orchard. Jenny Wren promptly poked her head out of her doorway. She tipped her head to listen, then peered down at Peter with her sharp little eyes snapping.
        - id: ch01-b03
          speaker: jenny_wren
          text: >-
            I don't hear a voice I don't know. From the way you're staring, Peter Rabbit, anyone would think you'd heard something truly new and interesting.
        - id: ch01-b04
          speaker: narrator
          text: Two or three sharp, squeaky notes came from the top of a tree.
        - id: ch01-b05
          speaker: peter_rabbit
          text: There it is! Didn't you hear it that time, Jenny Wren?
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            Goodness, Peter Rabbit! Don't tell me you don't know that voice. It's Rosebreast. He and Mrs. Rosebreast have been here for quite a while. I thought everyone knew those sharp little squeaks. They get on my nerves. Why he makes a noise like that when he can sing so beautifully is beyond me.
        - id: ch01-b07
          speaker: narrator
          text: >-
            At that very moment, Mr. Wren began to scold. No one could scold quite the way he and Jenny could. Peter glanced up at Jenny and gave her a sly wink. Her complaint about Rosebreast's squeaking had given him an answer of his own.
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            And why anyone scolds like that when he can sing as well as Mr. Wren does is beyond me too. But you still haven't told me who Rosebreast is.
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            The Grosbeak, of course, you silly rabbit! If you don't know Rosebreast the Grosbeak, you must have gone through life both blind and deaf. Listen now. Just listen to his song!
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter listened closely. It was a beautiful morning, and birds all through the Old Orchard were pouring their joy into song. Many songs mingled in the air. One of them sounded a little louder and clearer than the rest because it came from a tree close at hand. It was the very tree that had sent down those squeaky notes only a few minutes before. Peter suspected this must be the song Jenny meant, but he could not be sure. He looked puzzled because he truly was puzzled.
        - id: ch01-b11
          speaker: peter_rabbit
          text: Do you mean the song Welcome Robin is singing?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter asked rather shyly. He already had a feeling that Jenny would make him sorry for getting the song wrong, and he waited for her sharp tongue to come down on him.
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            No, I do not mean Welcome Robin. What use are those long ears if they can't separate one song from another? It sounds a little like his song, but good ears would catch the difference at once. This song is better. Welcome Robin sings with good cheer, but Rosebreast sings with pure happiness. I wouldn't trade for ears like yours for anything in the world!
        - id: ch01-b14
          speaker: narrator
          text: Peter burst out laughing as he pictured tiny Jenny Wren wearing a pair of long rabbit ears.
        - id: ch01-b15
          speaker: jenny_wren
          text: What are you laughing at? Don't you dare laugh at me! I cannot stand being laughed at.
          emotion: angry
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            I wasn't laughing at you. Truly, Jenny. I was laughing at the picture in my head. You would look so funny with a pair of long ears like mine. But now that you've pointed it out, I can hear that the song really is quite different from Welcome Robin's.
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            Naturally it is. Rosebreast is singing at the very top of that tree. There he is now. Isn't he handsome?
        - id: ch01-b18
          speaker: narrator
          text: >-
            Peter looked up. The bird was a little smaller than Welcome Robin. His head, throat, and back were black, and white patches marked his black wings. But his breast made Peter gasp. It was a beautiful rose-red, while everything below it was white. This was Rosebreast the Grosbeak.
        - id: ch01-b19
          speaker: peter_rabbit
          text: He's lovely! And who is the bird beside him?
        - id: ch01-b20
          speaker: jenny_wren
          text: Mrs. Grosbeak, of course. Who else could she be?
        - id: ch01-b21
          speaker: narrator
          text: Jenny was still rather cross because Peter had laughed.
        - id: ch01-b22
          speaker: peter_rabbit
          text: I never would have guessed. She doesn't look anything like him.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Peter was right. Mrs. Grosbeak had none of Rosebreast's lovely rose color. Her feathers were mostly brown and grayish, with a little buff here and there. Dark streaks ran across her breast, and a whitish line showed above each eye. Altogether, she looked more like a large member of the Sparrow family than the wife of handsome Rosebreast. While Rosebreast went on singing, she stayed very busy picking buds and blossoms from the tree.
        - id: ch01-b24
          speaker: peter_rabbit
          text: Why is she picking those?
        - id: ch01-b25
          speaker: jenny_wren
          text: For the same reason you bite off sweet clover leaves and blossoms.
        - id: ch01-b26
          speaker: peter_rabbit
          text: You mean they eat nothing but buds and blossoms? I've never heard of that!
          emotion: surprised
        - id: ch01-b27
          speaker: jenny_wren
          text: >-
            Tut, tut, tut! No one I know asks as many silly questions as you do. Of course they don't live on buds and blossoms. They would soon starve, because buds and blossoms don't last long. They eat a few for variety. Most of their food is bugs and insects. Ask Farmer Brown's boy who gives him the most help in the potato patch. He'll say the Grosbeaks, because they love potato bugs. They eat some fruit too, but altogether they are as helpful in a garden as almost anyone I know. Now run along, Peter Rabbit, and stop bothering me.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Then Peter saw Farmer Brown's boy coming through the Old Orchard. He decided it was high time to leave, so away he bounded toward the Green Forest, lipperty-lipperty-lip. He had only just passed the edge of the forest when he caught sight of something on the ground. For the moment, it drove every thought of Farmer Brown's boy straight out of his head.
        - id: ch01-b29
          speaker: narrator
          text: >-
            A bird was fluttering on the ground. Not even Glory the Cardinal was more beautiful. He was about the size of Redwing the Blackbird. His wings and tail were pure black, and the rest of him was a splendid scarlet. It was Redcoat the Tanager.
        - id: ch01-b30
          speaker: narrator
          text: >-
            At first Peter had eyes only for Redcoat's wonderful beauty. He had seen this bird before, but never at such close range. Then the sight of all that fluttering began to mean something else. Peter suddenly understood that something was wrong with Redcoat, and he hurried forward to learn what the trouble might be.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Redcoat heard Peter's feet rustling through the dry leaves. He flapped and struggled to escape, but he could not rise from the ground.
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            Redcoat, what's wrong? Were you hurt? It's only Peter Rabbit. You have nothing to fear from me.
        - id: ch01-b33
          speaker: narrator
          text: The terror faded from Redcoat's eyes. He stopped struggling and lay there panting.
        - id: ch01-b34
          speaker: redcoat_tanager
          text: >-
            Oh, Peter, I'm so glad it's you! I've had a terrible accident, and I don't know what to do. I can't fly. If I stay here on the ground, an enemy is certain to find me. What can I do, Peter? What can I do?
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: Peter's heart filled with sympathy at once.
        - id: ch01-b36
          speaker: peter_rabbit
          text: What happened, Redcoat? What kind of accident was it?
        - id: ch01-b37
          speaker: redcoat_tanager
          text: >-
            Broadwing the Hawk tried to catch me. I was dodging him among the trees, and for one moment I didn't watch where I was going. I flew into a sharp dead twig, and it went straight through my right wing.
          emotion: sad
        - id: ch01-b38
          speaker: narrator
          text: >-
            Redcoat raised his right wing. Sure enough, a small stick stuck out on both sides, close to his shoulder. The wing was bleeding a little.
        - id: ch01-b39
          speaker: redcoat_tanager
          text: Oh, dear! What am I going to do, Peter Rabbit? What am I going to do?
          emotion: fearful
        - id: ch01-b40
          speaker: peter_rabbit
          text: Does it hurt terribly?
        - id: ch01-b41
          speaker: narrator
          text: Redcoat nodded.
        - id: ch01-b42
          speaker: redcoat_tanager
          text: The pain doesn't matter so much. I'm frightened of what may happen to me now.
          emotion: fearful
        - id: ch01-b43
          speaker: narrator
          text: >-
            All this time, Mrs. Tanager was flying anxiously through the treetops nearby and calling down to them. Her feathers were almost entirely light olive-green and greenish-yellow. Beside brilliant Redcoat, she seemed very plain indeed. She looked no more like him than Mrs. Grosbeak looked like Rosebreast.
        - id: ch01-b44
          speaker: mrs_tanager
          text: >-
            Can't you fly even a little way, just enough to leave the ground? Peter Rabbit, isn't this dreadful? Our nest is only half built. I don't know what I'll do if anything happens to Redcoat.
          emotion: fearful
        - id: ch01-b45
          speaker: mrs_tanager
          text: Someone is coming! Hide, Redcoat! You must hide!
          emotion: fearful
        - id: ch01-b46
          speaker: narrator
          text: >-
            Mrs. Tanager flew a little distance away and cried as if she were in terrible trouble. Peter understood that she was trying to draw the newcomer toward herself.
        - id: ch01-b47
          speaker: narrator
          text: >-
            The old terror returned to Redcoat's eyes. Poor Redcoat fluttered over the ground, trying desperately to find something he could hide beneath. But there was nowhere for him to crawl, and no hiding place could easily conceal that wonderful red coat. Then Peter heard the thud of heavy footsteps among the trees. He looked back and saw Farmer Brown's boy coming toward them.
        - id: ch01-b48
          speaker: peter_rabbit
          text: >-
            Don't be frightened, Redcoat. That's Farmer Brown's boy. I'm sure he won't harm you. He may even be able to help.
          emotion: calm
        - id: ch01-b49
          speaker: narrator
          text: Peter scampered a short way off, then sat up to see what would happen.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Of course Farmer Brown's boy noticed Redcoat. Anyone with eyes would have seen that brilliant scarlet coat against the ground. From the strange way Redcoat moved, the boy also saw that the bird was in serious trouble. When he came closer and Redcoat knew he had been discovered, the frightened bird tried harder than ever to flutter away. The boy understood at once that something was wrong with one wing. He ran forward and caught Redcoat.
        - id: ch01-b51
          speaker: farmer_browns_boy
          text: >-
            You poor little bird. You beautiful little thing. That cruel twig has gone right through your shoulder. We must take it out at once.
        - id: ch01-b52
          speaker: narrator
          text: Farmer Brown's boy stroked Redcoat very gently.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Somehow, beneath that gentle touch, much of Redcoat's fear slipped away. A little hope rose in his heart. He could see that the boy was a friend, not an enemy.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Farmer Brown's boy took out his knife. Very carefully, he cut off the twig above Redcoat's wing. Then he worked the remaining piece out from underneath, doing all he could to cause as little pain as possible. He gently examined the wing and found that no bones were broken.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Farmer Brown's boy held Redcoat gently for a few minutes. Then he carefully set him on a branch and moved a short distance away. Redcoat hopped upward from one branch to the next until he reached a place halfway up the tree. He stayed there for some time. After the pain and fright he had suffered, he seemed afraid to spread that injured wing and find out whether it could carry him.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Mrs. Tanager came close. She fussed over him, talked to him, and coaxed him, making as much of him as though he were a baby.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Peter stayed right where he was and watched. At last, Redcoat opened his black wings and flew to another tree. He flew onward from tree to tree, pausing to rest in each one before trying the next short flight. Mrs. Tanager went with him. At last the two birds disappeared among the trees of the Green Forest.
        - id: ch01-b58
          speaker: peter_rabbit
          text: I knew Farmer Brown's boy would help him. I'm so glad he found Redcoat!
          emotion: happy
        - id: ch01-b59
          speaker: narrator
          text: Then Peter started home to the dear Old Briar-patch.
