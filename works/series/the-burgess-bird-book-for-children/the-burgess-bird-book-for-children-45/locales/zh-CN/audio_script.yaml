audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jumper_the_hare:
      display_name: 野兔跳跳
      tts:
        delivery: 友善务实，说话沉着而有把握
        timbre: 温暖醇和
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 彼得遇见两个可怕的长羽毛猎手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得是喜欢冬天，可冬天里的日子一点儿也不好过。为了找够食物，他要跑许多地方，也就得冒更多的险。只要离开亲爱的老蔷薇园，无论白天还是黑夜，他都得睁大眼睛、竖起耳朵，时时提防危险。这个季节，狐狸雷迪常常找不到一顿像样的饭，大半时候都饿着肚子，到处追捕彼得。地上尽是白雪，灌木和小树也掉光了叶子，彼得很难把自己藏起来。所以每次出门，他心里总惦记着雷迪。
        - id: ch01-b02
          speaker: narrator
          text: >-
            还有一些猎手，比雷迪更叫彼得害怕。他们穿的不是毛皮大衣，而是一身羽毛，其中一个就是苍鹰恐怖。害怕恐怖的远不止彼得。长羽毛的朋友们只要听见这个名字，个个都会打寒颤。彼得第一次发现恐怖从遥远的北方飞来，而且可能整个冬天都不走时，一整天都没敢出去找吃的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那天一大早，彼得赶到绿森林，想去一片沼泽找早餐。他扑嗒、扑嗒、扑嗒地往前蹦，心里主要想着那顿盼望已久的早餐，眼睛和耳朵却也留意着四周可能出现的危险。忽然，一阵奇怪的感觉掠过全身。明明没看见异样，也没听见动静，他却觉得极大的危险就在近旁。这没有什么凭据，只是一种感觉。
        - id: ch01-b04
          speaker: narrator
          text: >-
            彼得早就学会了，遇到这种情形，应该先保住安全，再回头弄清原因。恐惧袭来时，他恰好经过一根粗大的空心木头。彼得连想都没想，一头就钻了进去。几乎就在同时，巨大的翅膀带着尖利的呼啸从他身后掠过。苍鹰恐怖只差那么一眨眼，就抓到彼得了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得的心怦怦猛跳，像是要撞破肋骨。他从木头里向外偷看，恐怖已经停在几英尺外的一根高树桩上。惊慌中的彼得觉得，这是自己见过的最大的鸟。其实，恐怖的个头和他熟悉的红尾鹰差不多。恐怖的确英俊，这一点谁也不能否认。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他的背泛着蓝色，脑袋近乎乌黑，每只眼睛上方一直到后面都有一道白纹。腹部生着漂亮的灰白波浪形横斑，尾巴上还有四条深色宽带。可是彼得一点儿也顾不上欣赏。他只能看见那双凶狠的眼睛，正盯着空心木头的入口。彼得哆嗦起来，仿佛一阵寒气透过全身。他很清楚，恐怖心里既没有怜悯，也没有温和。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 但愿松鸡先生和松鸡太太都不在附近。
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            彼得知道，恐怖最想抓到的，正是松鸡家族的成员。恐怖也明白，彼得一时半会儿不会出来，因此没在树桩上停留多久。看他飞去的方向，彼得猜他大概要到布朗农夫家的鸡场去。
        - id: ch01-b09
          speaker: narrator
          text: >-
            鹰族里谁也没有苍鹰恐怖那么大胆。他连布朗农夫鼻子底下的母鸡都敢抓。只要怀疑他就在附近，长毛和长羽毛的小家伙便会胆战心惊，所以“恐怖”这个名字再合适不过。他飞得飞快，很少有谁能逃掉。更可怕的是，他有时杀戮并不是为了果腹，只是因为喜欢。鼬鼠暗影也是这样。绿森林和绿草地的小居民都明白，猎手也要吃东西，所以能原谅为了生存而捕杀。可谁要是无缘无故夺走性命，他们绝不会原谅。因此，大家全都憎恨恐怖，他连一个朋友也没有。
        - id: ch01-b10
          speaker: narrator
          text: >-
            彼得在空心木头里躲了整整一天，直到黑影开始爬过绿森林，才敢踏出去。恐怖只在白天捕猎，现在已经不必怕他了。彼得终于又能想着自己的肚子，而那个肚子早就空得厉害。
        - id: ch01-b11
          speaker: narrator
          text: >-
            可他还不能马上填饱肚子。才走出不远，前面突然响起一声骇人的呼唤，打破了初夜的寂静：“呼——呜呜，呼——呜！”声音来得太突然，又凶猛极了。彼得差点儿跳起来逃命，可他认得这个声音，也知道此刻只有纹丝不动才安全。于是，他的心像早晨逃过恐怖时一样疯狂猛跳，身子却僵在原地，一动也不动。
        - id: ch01-b12
          speaker: narrator
          text: >-
            这是大角鸮胡啼捕猎时的叫声。他就是要把谁吓得跳起来逃跑，或者至少稍稍动一下。彼得早就知道这个把戏。整座绿森林里，胡啼的耳朵最灵敏。刚发出那声凶狠的呼唤，他就会竖起耳朵，凝神去听，看有没有哪个夜间活动的小家伙从睡梦中惊醒，弄出哪怕最轻微的声响。哪怕只是一片叶子沙沙作响，胡啼也会展开巨大的翅膀，无声地飞到那里。然后，那双能在暮色里看清一切的凶猛黄眼睛，就会找到猎物。
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得不敢动，唯恐自己怦怦的心跳也传进胡啼耳中。那可怕的叫声又响了一次，彼得再次拼命忍住，没有跳起来。几分钟过去，他仍盯着一根高高的枯树干，暗自猜着胡啼藏在哪里。就在这时，树干的顶端仿佛突然折断了。一只宽翼巨鸟像飘动的影子，无声无息地飞了出去。那正是胡啼。他刚才笔直地坐在枯树干顶上，看起来简直就是树干的一部分。
        - id: ch01-b14
          speaker: narrator
          text: >-
            彼得又等了好一阵，才敢稍稍挪动身子。直到绿森林远处传来胡啼的捕猎叫声，他才知道那个可怕的猎手真的去了别处。现在安全了，他总算可以再想想自己空空的肚子。
        - id: ch01-b15
          speaker: narrator
          text: >-
            冬天又过去了一些日子，积雪仍盖着绿森林，欢笑溪也依旧封在冰下。彼得来到森林里一个僻静的地方，忽然想起附近有一只红尾鹰从前用过的旧巢。他原本只是闲着没事，一时好奇，便跑去看看。谁知刚能望见那只巢，他就发现一只巨鸟正在巢上落下。彼得惊得心一下蹿到了喉咙口，因为那是胡啼太太。
        - id: ch01-b16
          speaker: narrator
          text: >-
            彼得立刻停在原地，竭尽全力不让身子挪动，连一丝声音也不敢发出。不久，胡啼本人飞来，停在近旁的一棵树上。彼得以前见过他很多次，可每次见到的，都只是月光下一道巨大的浮动黑影。这一回，他终于把胡啼看得清清楚楚。
        - id: ch01-b17
          speaker: narrator
          text: >-
            胡啼直挺挺地坐着，看上去和苍鹰恐怖一样高，身子却宽大得多。要是彼得知道其中的缘故，就会明白，那副巨大的模样多半来自一身蓬松羽毛。就像小表亲鸣角鸮幽灵一样，胡啼仿佛没有脖子，大脑袋像是直接安在肩膀上。脑袋两侧各竖着一大簇羽毛，像耳朵，也像犄角。他的喙又尖又弯。全身是红褐色，点缀着浅黄褐色和黑色的小斑纹，喉咙处还有一块白斑。他的腿上全是羽毛，两只脚也一直披着羽毛，直到那几只巨大的利爪。
        - id: ch01-b18
          speaker: narrator
          text: >-
            可彼得始终盯着胡啼那双又大又圆、凶猛的黄眼睛。他本以为胡啼只能在傍晚或有月亮的夜里看清东西，现在却隐隐觉得，即使天光大亮，胡啼也看得清清楚楚。他猜得完全没错。
        - id: ch01-b19
          speaker: narrator
          text: >-
            彼得在原地坐了很久，什么也不敢做。最初的惊恐平息下来以后，他开始琢磨，胡啼夫妇在那只旧巢上究竟做什么。他的好奇心越来越强，觉得自己无论如何也得弄明白。过了一会儿，胡啼小心翼翼地飞走了，免得惊动胡啼太太。彼得也不敢引起她的注意，便顺着来路悄悄退了回去。
        - id: ch01-b20
          speaker: narrator
          text: >-
            走得足够远，觉得大致安全以后，彼得便拼命飞奔。他既想离那个地方远一些，又想赶紧找个能回答问题的人。没过多久，他遇见表兄野兔跳跳，马上激动地把刚才看到的一切全讲了出来。跳跳一直听到他说完。
        - id: ch01-b21
          speaker: jumper_the_hare
          text: >-
            彼得表弟，你要是肯听我的劝，就离绿森林的那一带远远的。照你看到的情形，胡啼夫妇显然已经开始筑巢了。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 筑巢？现在就筑巢？温柔的春姑娘还要再过一个月才会来呀！
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: 彼得竟然怀疑自己的话，跳跳听了有些恼火。
        - id: ch01-b24
          speaker: jumper_the_hare
          text: >-
            我说的就是筑巢。大角鸮胡啼可不会等春姑娘。他和胡啼太太都觉得，照料家庭的操心事应该早点儿办完。每到这个时候，他们会找一只红尾鹰、乌鸦布莱基或红松鼠喋喋用过的旧巢，自己根本不费事筑巢。地上还结着冰、铺着雪时，胡啼太太就会下蛋。
        - id: ch01-b25
          speaker: jumper_the_hare
          text: >-
            那些孩子孵出来以后，为什么不会活活冻死，我可说不上来。可他们就是不会冻死。胡啼夫妇今年在这里筑巢，可不是什么好消息。许多长羽毛和长毛的小家伙都要倒霉。我一定离那一带远远的，也劝你这么做。
        - id: ch01-b26
          speaker: narrator
          text: >-
            彼得说，自己当然会离那里远远的，随后便动身回亲爱的老蔷薇园，想把这件事好好琢磨一番。新一年的筑巢季竟然已经开始了。这让他想起甜美的春姑娘就要回来，也想起那些很久以前飞往遥远南方、如今即将归来的长羽毛朋友。
        - id: ch01-b27
          speaker: narrator
          text: >-
            一阵强烈的思念掠过彼得心头。他非常想再听见知更鸟迎迎、讨喜蓝知更鸟和歌带鹀小朋友的声音，更盼望同鹪鹩珍妮亲亲热热地聊一阵。过去一年里，他已经从长羽毛的邻居那里学会了许多，可还是有许多事情想知道，而这些问题只有珍妮能回答。
        - id: ch01-b28
          speaker: narrator
          text: >-
            彼得如今才刚刚开始明白，世上没有谁能知道一切，尤其是关于鸟儿的一切。以后也永远不会有。
