audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick-spoken
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    hooty_great_horned_owl:
      display_name: Hooty the Great Horned Owl
      tts:
        delivery: fierce, commanding, and deliberate
        timbre: deep and resonant
        pace: slow
        pitch: low
    jumper_hare:
      display_name: Jumper the Hare
      tts:
        delivery: practical, knowing, and plainspoken
        timbre: lean and clear
        pace: moderate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Sees Two Terrible Feathered Hunters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit liked winter, but that did not make winter life easy. His first problem was finding enough food. That forced him to travel a great deal, and every extra trip brought extra danger. Whenever he left the dear Old Briar-patch, day or night, he could not relax for even a minute. He had to keep watching and listening.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Reddy Fox had trouble finding a good meal in winter, too. He was nearly always hungry and forever hunting Peter. Snow covered the ground, and the bushes and young trees had lost their leaves. Against all that white, Peter could not hide easily. As he traveled about looking for food, the thought of Reddy was always in his mind.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Yet Peter feared certain hunters even more than Reddy. They wore feathers instead of fur. One was Terror the Goshawk. Peter was not alone in fearing him. Every one of Peter's feathered friends shivered at that name. Peter would not soon forget the day he learned that Terror had come down from the Far North and might remain all winter. That discovery cost Peter a whole day of meals.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Early that morning, Peter had set out for the Green Forest. He hoped to find breakfast in a certain swamp. He hopped along, lipperty-lipperty-lip, thinking mostly about food, though his eyes and ears stayed alert. Then a strange feeling swept over him. Danger was close. He could neither see nor hear it, but he felt it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter had learned what to do when that feeling came. Find safety first. Look for the danger afterward. At that very moment he was passing a big hollow log. He did not stop to think. He plunged inside, and a sharp rush of great wings cut the air behind him. Terror the Goshawk had missed Peter by a fraction of a second.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter's heart thumped as though it might pound through his ribs. He peeped from the hollow log. Terror had landed on a tall stump only a few feet away. To frightened Peter, the Goshawk looked like the largest bird he had ever seen. He was not, of course. In truth, he was almost the same size as Redtail the Hawk, whom Peter knew well. And he was handsome. There was no denying that.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Terror's back was bluish, and his head looked nearly black. A white line ran over and behind each eye. Beautiful wavy bars of gray and white crossed his breast and all his underside. Four dark bands marked his tail. Yes, he was a handsome bird.
        - id: ch01-b08
          speaker: narrator
          text: >-
            But Peter did not care about that beauty. He saw only the fierce eyes fixed on the mouth of the hollow log. A cold shiver ran through him. There was no pity or gentleness in Terror.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            I hope Mr. and Mrs. Grouse aren't anywhere nearby.
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter knew that Terror would rather catch a member of the Grouse family than almost anyone else.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Terror did not stay on the stump for long. He knew Peter would not hurry out of that log. Soon he flew away. From the direction he took, Peter suspected that Terror was going to visit Farmer Brown's henyard. No member of the Hawk family was bolder. Terror would not hesitate to snatch a hen from almost under Farmer Brown's nose.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Terror was well named. The mere suspicion that he might be near struck fear into every furred and feathered heart. His wings were so swift that few could escape him, and he had no pity. He killed even when he did not need food, simply for the love of killing. Shadow the Weasel did the same. The little people of the Green Forest and Green Meadows forgave a hunter who killed to eat. They could not forgive needless killing. That was why everyone hated Terror and why he had no friends at all.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter stayed hidden in the log all day. He did not dare step outside until the Black Shadows began creeping through the Green Forest. Terror hunted only by day, so Peter knew that danger had passed. His thoughts returned to his stomach, which was very, very empty.
        - id: ch01-b14
          speaker: narrator
          text: >-
            But Peter was not going to fill it yet. He had traveled only a short way when a terrifying sound shattered the early evening silence just ahead of him.
        - id: ch01-b15
          speaker: hooty_great_horned_owl
          text: Whooo-hoo-hoo, whooo-hoo!
        - id: ch01-b16
          speaker: narrator
          text: >-
            The call came so suddenly and sounded so fierce that Peter nearly leaped up and ran for his life. But he knew that voice. He also knew his safest choice was to stay perfectly still. His heart pounded as wildly as it had that morning, yet Peter sat as if he could not move at all.
        - id: ch01-b17
          speaker: narrator
          text: >-
            That was Hooty the Great Horned Owl's hunting call. He had sent it out to frighten someone into jumping or running. Even the tiniest movement would serve his purpose. Peter knew the trick very well. No one in the Green Forest had ears as wonderful as Hooty's. The instant he gave that fierce call, he strained those ears to catch the faintest sound from some startled little sleeper of the night.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Even the rustle of one leaf would bring Hooty sweeping to the spot on great, silent wings. Then his fierce yellow eyes, made for seeing in the dusk, would find the victim.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Peter stayed still and worried that Hooty might even hear his pounding heart. Once more the terrible cry rang through the forest. Once more Peter nearly jumped, but he held himself motionless.
        - id: ch01-b20
          speaker: hooty_great_horned_owl
          text: Whooo-hoo-hoo, whooo-hoo!
        - id: ch01-b21
          speaker: narrator
          text: >-
            A few minutes later, Peter stared at a certain tall, dead tree stub and wondered where Hooty could be. Suddenly the top of the stub seemed to break away. A great, broad-winged bird floated off without a sound, like a drifting shadow. It was Hooty himself. He had been sitting perfectly straight on top of the stub, looking so much like part of the dead tree that Peter had not seen him.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Peter waited a long while before he dared move. At last he heard Hooty's call from a distant part of the Green Forest. Now he could safely think about his empty stomach again.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Later that winter, snow still covered the Green Forest and ice still bound the Laughing Brook. Peter happened to be exploring a lonely part of the woods when he remembered an old nest nearby. It had once belonged to Redtail the Hawk. Peter had no special purpose in mind. He was simply curious, so he ran over to take a look.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Just as the nest came into view, a great bird settled onto it. Peter's heart seemed to leap into his throat. He recognized Mrs. Hooty.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Peter stopped exactly where he was. He took great care not to move or make a sound. Before long, Hooty appeared and perched in a nearby tree. Peter had seen him many times, but only as a great shadow drifting through moonlight. Now Peter could study him clearly.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Sitting bolt upright, Hooty looked as tall as Terror the Goshawk, though his body seemed much bigger. If Peter had known the truth, he would have understood that Hooty's fluffy coat of feathers made him look much larger than he really was. Like his little cousin Spooky the Screech Owl, Hooty seemed to have no neck at all. His great head looked as though it rested directly on his shoulders.
        - id: ch01-b27
          speaker: narrator
          text: >-
            On each side of his head, a great tuft of feathers stood out like an ear or horn. His bill curved into a sharp hook. He was dressed from head to foot in reddish-brown, with small markings of buff and black, and a white patch showed at his throat. Feathers covered his legs. They even covered his feet right down to the great claws.
        - id: ch01-b28
          speaker: narrator
          text: >-
            More than anything else, Peter watched Hooty's great, round, fierce, yellow eyes. He had always thought Hooty could see only in the evening dusk or on moonlit nights. But as those eyes looked out across the forest, Peter felt sure that the Owl could see perfectly well even in broad daylight. Peter was quite right.
        - id: ch01-b29
          speaker: narrator
          text: >-
            For a long time Peter did not move. He dared not. Once his first fright passed, he began wondering what Hooty and Mrs. Hooty were doing at Redtail's old nest. Curiosity took hold of him. He simply had to find out.
        - id: ch01-b30
          speaker: narrator
          text: >-
            After a while, Hooty flew away. Peter waited for his chance, then slipped back the way he had come. He moved with the greatest care so Mrs. Hooty would not notice him. When he was far enough away to feel fairly safe, he scampered as fast as he could. He wanted to get away from that nest, and he wanted to find someone who could answer his questions.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Soon Peter met his cousin, Jumper the Hare. In great excitement, Peter told him everything he had seen. Jumper listened until the whole story was finished.
        - id: ch01-b32
          speaker: jumper_hare
          text: >-
            Take my advice, Cousin Peter. Stay away from that part of the Green Forest. From what you've told me, the Hooties have clearly begun nesting.
        - id: ch01-b33
          speaker: peter_rabbit
          text: >-
            Nesting? They can't be nesting! Gentle Mistress Spring won't arrive for another month!
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: >-
            Jumper answered rather crossly. He did not like having his word doubted.
        - id: ch01-b35
          speaker: jumper_hare
          text: >-
            I said nesting. Hooty the Great Horned Owl doesn't wait for Mistress Spring. He and Mrs. Hooty like to finish their household cares early.
          emotion: angry
        - id: ch01-b36
          speaker: jumper_hare
          text: >-
            Around this time of year, they find an old nest that belonged to Redtail the Hawk, Blacky the Crow, or Chatterer the Red Squirrel. They won't bother building one themselves. Then Mrs. Hooty lays her eggs while snow and ice are still here.
        - id: ch01-b37
          speaker: jumper_hare
          text: >-
            I don't know why their youngsters don't freeze to death when they hatch, but somehow they don't. I'm sorry the Hooties have a nest here this year. A lot of little folks in fur and feathers are going to have a bad time. I certainly mean to avoid that part of the Green Forest, and you should do the same.
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            I certainly will.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Peter started home to the dear Old Briar-patch to think over what he had learned. The new year's nesting season had already begun, even with snow on the ground and ice on the brook. That surprising discovery turned his thoughts toward sweet Mistress Spring. Soon his many feathered friends would return from the far-away South, where they had been for so long.
        - id: ch01-b40
          speaker: narrator
          text: >-
            How Peter longed to hear Welcome Robin, Winsome Bluebird, and Little Friend the Song Sparrow again. More than anything, he wanted a friendly bit of gossip with Jenny Wren.
        - id: ch01-b41
          speaker: narrator
          text: >-
            During the past year, Peter had learned a great deal about his feathered neighbors. Still, there were many more things he wanted to know, and some questions only Jenny Wren could answer. Peter was just beginning to understand that no one knows everything there is to know, especially about birds. And no one ever will.
