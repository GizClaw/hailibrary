audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and cheerfully impulsive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    strutter_ruffed_grouse:
      display_name: Strutter the Ruffed Grouse
      tts:
        delivery: grand, proud, and fond of showing off
        timbre: full and resonant
        pace: deliberate
        pitch: medium-low
    mrs_grouse:
      display_name: Mrs. Grouse
      tts:
        delivery: quietly pleased and self-assured
        timbre: soft and earthy
        pace: unhurried
        pitch: medium
    creaker_grackle:
      display_name: Creaker the Grackle
      tts:
        delivery: confident, dryly amused, and matter-of-fact
        timbre: sleek and slightly rasping
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: A Maker of Thunder and a Friend in Black
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit had the best of intentions. He meant to go straight home to the dear Old Briar-patch once he was safely away from the lonely part of the Green Forest where Redtail the Hawk lived. But before he was halfway there, a sound rolled through the forest from another direction. Peter stopped short and forgot all about home. It sounded like thunder far away. At first it came slowly. Then it beat faster and faster. Boom. Boom. Boom. Boom-boom-boom. Boo-boo-b-b-b-b-boom! It was like a long roll on a bass drum.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            That's Strutter the Ruffed Grouse! I'd forgotten all about him. I must pay him a visit and find out where Mrs. Grouse is. My, how Strutter can drum!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter headed at once toward the distant thunder. The nearer he came, the louder it grew, until it sounded more like real thunder than ever. Soon he stopped and listened. He wanted to tell exactly which part of the forest the noise came from. Then he remembered something.
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            I know where he is. There's a big hollow log covered with moss over that way. Mrs. Grouse once told me it was Strutter's thunder log.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter crept forward very, very carefully. He took pains not to make a sound. At last he found a place where he could peek out at the big mossy log. Sure enough, Strutter the Ruffed Grouse was there. He crouched at one end, resting, and looked like a fluffy ball of reddish-brown, black, and gray feathers.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Suddenly Strutter stood as tall as he could. He lifted his tail and opened it like a fan above his back. Gray edged the fan, then came a broad black band, followed by bands of gray, brown, and black. A wonderful black ruff circled his neck. He lowered his reddish-brown wings until their tips nearly touched the log. His rounded breast was buff-colored and marked with black. He was about the size of the little Bantam hens Peter had seen in Farmer Brown's henyard.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Strutter marched the length of the mossy log as proudly as anyone could. He made a perfect picture of pride, strutting very much like Tom Gobbler, the big Turkey cock. When he reached the other end, he suddenly let his tail fall and stretched to his full height. His wings began to beat slowly. Then they went faster and faster, until Peter could see only a blur. They seemed to meet above Strutter's back, though they did not quite strike his sides on the way down. Those racing wings made the thunder. The noise was so loud that Peter almost wanted to cover his ears.
        - id: ch01-b08
          speaker: narrator
          text: >-
            When the thunder ended, Strutter settled down to rest. His black ruff lay flat, and once again he looked like a ball of soft feathers. Peter watched him thunder several times before he dared to come out.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            Strutter, that was wonderful! It truly was wonderful!
        - id: ch01-b10
          speaker: narrator
          text: Peter meant every word. Strutter proudly pushed out his chest.
        - id: ch01-b11
          speaker: strutter_ruffed_grouse
          text: >-
            Mrs. Grouse says the very same thing. If I may say so myself, I don't know any bird who can make better thunder.
        - id: ch01-b12
          speaker: peter_rabbit
          text: Speaking of Mrs. Grouse, where is she?
        - id: ch01-b13
          speaker: strutter_ruffed_grouse
          text: >-
            She's taking care of things at home, as a good housewife should.
        - id: ch01-b14
          speaker: peter_rabbit
          text: Do you mean she has a nest with eggs in it?
        - id: ch01-b15
          speaker: narrator
          text: Strutter nodded proudly.
        - id: ch01-b16
          speaker: strutter_ruffed_grouse
          text: She has twelve eggs.
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            Then I suppose her nest is somewhere nearby, down on the ground.
        - id: ch01-b18
          speaker: strutter_ruffed_grouse
          text: >-
            It is on the ground, Peter, but I won't tell you where. It may be near here, or it may not. Would you like to hear me thunder again?
        - id: ch01-b19
          speaker: narrator
          text: >-
            Of course Peter said yes. That was all the excuse Strutter needed to show off once more. Peter stayed beside the thunder log for a while longer and tried to gossip with him. But it soon became clear that Strutter cared far more about making thunder than about talking. So Peter left him there and started home again.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            I would dearly like to know where that nest is. But Mrs. Grouse has probably hidden it so well that looking would do no good.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Peter scampered past a certain big tree. Brown dead leaves covered the ground all around it. There were no bushes there and no young trees. Peter did not once think of looking for a nest. To him, this was the last place in the world where a nest might be. Once he was well past the big tree, a soft chuckle came from among the leaves right at its foot. A head rose just a little. Two of the brightest eyes you could imagine twinkled as they watched Peter disappear.
        - id: ch01-b22
          speaker: mrs_grouse
          text: >-
            He never saw me. That's what comes from wearing a cloak the same color as these lovely brown leaves. He isn't the first to pass without seeing me, either. This is even better than trying to hide a nest. I'm certainly thankful to Old Mother Nature for the cloak she gave me. I wonder whether all twelve eggs will hatch. If they do, I'll have a family to be proud of.
          emotion: happy
        - id: ch01-b23
          speaker: narrator
          text: >-
            Mrs. Grouse settled onto her nest again. Meanwhile, Peter hurried along in his usual happy-go-lucky way until he reached the edge of the Green Forest. On the Green Meadows just beyond, he saw a black bird walking about in a stately way. Every now and then, the bird picked up something from the ground. He reminded Peter of Blacky the Crow, but Peter knew at once that it was not Blacky. This bird was no more than half as large.
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            Why, that's Creaker the Grackle. He was one of the first birds to come back this spring, and I ought to be ashamed that I haven't called on him. What a fine long tail he has! Jenny Wren told me he belongs to the Blackbird family. I suppose people call him Crow Blackbird because he looks so much like Blacky the Crow.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Peter hopped out and crossed the meadow toward Creaker. Just then Creaker turned, and the sunlight fell across his head and back.
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            Why! Why-ee! He isn't simply black. He's beautiful! All this time I thought he was plain, homely black.
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: >-
            Creaker truly was beautiful with the sun shining on him. His head and neck shone blue-black, and so did his throat and upper breast. His back gleamed a rich, brassy green. His wings and tail had much the same shining color as his head and neck. As Peter watched, all those colors seemed to keep changing. That play of changing color is called iridescence. Peter noticed something else too. Creaker's eyes were yellow, and at that moment Peter could not remember another bird with yellow eyes.
        - id: ch01-b28
          speaker: peter_rabbit
          text: Creaker, do you know how handsome you are?
        - id: ch01-b29
          speaker: creaker_grackle
          text: >-
            I'm glad you think so. I'm not vain, but there are very few birds whose coats I'd rather wear.
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            Is Mrs. Creaker's coat as handsome as yours?
        - id: ch01-b31
          speaker: narrator
          text: Peter asked the question rather timidly. Creaker shook his head.
        - id: ch01-b32
          speaker: creaker_grackle
          text: >-
            Not quite. She prefers plain black. A few feathers on her back shine like mine, but she says she has no time to stand in the sun showing off or to fuss over fine feathers.
        - id: ch01-b33
          speaker: peter_rabbit
          text: Where is she now?
        - id: ch01-b34
          speaker: narrator
          text: Creaker pulled a white grub from among the roots of the grass.
        - id: ch01-b35
          speaker: creaker_grackle
          text: >-
            She's at home. Our nest is in one of those pine trees along the edge of the Green Forest. Any day now, we'll have four hungry babies to feed, and then I'll have to keep busy. I believe every father should do his full share of caring for his family.
        - id: ch01-b36
          speaker: peter_rabbit
          text: I'm glad to hear you say that.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Peter nodded as if he were the best of fathers himself, though he was nothing of the kind.
        - id: ch01-b38
          speaker: peter_rabbit
          text: May I ask you something very personal, Creaker?
        - id: ch01-b39
          speaker: creaker_grackle
          text: >-
            Ask all the questions you please. I don't have to answer unless I choose to.
        - id: ch01-b40
          speaker: peter_rabbit
          text: Is it true that you steal other birds' eggs?
        - id: ch01-b41
          speaker: narrator
          text: Peter hurried the question out. Creaker's yellow eyes began to twinkle.
        - id: ch01-b42
          speaker: creaker_grackle
          text: >-
            That certainly is personal. I wouldn't exactly say that I steal eggs. But eggs are very good for my health, and if I find a nest with no one around, I sometimes help myself. The owner might never return. Then the eggs would spoil, and what a pity that would be.
        - id: ch01-b43
          speaker: peter_rabbit
          text: >-
            That's no excuse! I think you're every bit as bad as Sammy Jay and Blacky the Crow.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Creaker only chuckled. Peter's accusation did not seem to offend him at all. Just then he heard Mrs. Creaker calling him. He gave Peter a hurried goodbye, spread his wings, and headed toward the Green Forest. Once he was in the air, he looked plain black once more.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Peter watched until Creaker was out of sight. Then he turned once more toward the dear Old Briar-patch.
