audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    strutter_grouse:
      display_name: 松鸡阔步
      tts:
        delivery: 自信威风，喜欢炫耀，话音里带着骄傲
        timbre: 浑厚响亮
        pace: 稳健
        pitch: 中低音
    mrs_grouse:
      display_name: 松鸡太太
      tts:
        delivery: 温柔机警，带着藏住秘密后的轻快笑意
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中音
    creaker_grackle:
      display_name: 拟八哥嘎嘎
      tts:
        delivery: 从容健谈，机灵诙谐，偶尔理直气壮地狡辩
        timbre: 清亮饱满
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十九章　造雷者与黑衣朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得安全离开红尾鹰住的那片荒僻森林时，心里只有一个再好不过的打算，那就是径直赶回亲爱的老蔷薇丛。可是，他连一半路都没走完，绿森林另一个方向就传来一阵怪声。彼得猛地停住，顿时把家忘到了脑后。
        - id: ch01-b02
          speaker: narrator
          text: >-
            那声音像远处的雷，起先一下接一下，响得很慢，接着越来越快。轰——轰——轰——轰轰轰，轰、轰、轰轰轰轰轰轰轰轰——轰！听起来，就像低音大鼓上响起一长串滚奏。
        - id: ch01-b03
          speaker: narrator
          text: 彼得听明白了，忍不住笑起来。
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            是松鸡阔步！我怎么把他给忘了？我得去看看他，也问问松鸡太太在哪里。阔步打雷鼓的本领可真大！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得马上循声跑去。离得越近，那阵声音就越响，也越来越像真正的雷。他停下来仔细分辨声音究竟从哪里传来，忽然记起松鸡太太以前告诉过他，附近有一根长满苔藓的空心大木头，那正是阔步的雷鼓木。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 我知道他在哪里了！
        - id: ch01-b07
          speaker: narrator
          text: >-
            彼得没发出一点儿声响，轻手轻脚地摸到近处，终于找到一个能看清那根苔藓斑斑的空心木头的地方。他探头一望，果然看见披领松鸡阔步伏在木头一端休息。他浑身红褐、黑、灰三色的羽毛蓬松着，活像一个毛茸茸的圆球。
        - id: ch01-b08
          speaker: narrator
          text: >-
            忽然，阔步把身子挺到最高，翘起尾巴，完全撑开。那尾巴像一把竖在背上的扇子，外缘是灰色，往里有一条宽宽的黑带，后面又排着灰色、褐色和黑色的条纹。颈上的黑色披领也完全张开了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他把红褐色的翅膀垂下来，翼尖差点碰到木头。丰满的浅黄褐色胸脯高高挺着，上面带着黑斑。彼得瞧着，觉得他的个头跟布朗农夫鸡场里的小矮脚母鸡差不多。
        - id: ch01-b10
          speaker: narrator
          text: >-
            接着，阔步摆出你所能想象的最庄严的派头，从苔藓木头的一端一直走到另一端。他挺胸抬头，浑身都透着骄傲，跟大火鸡汤姆昂首阔步的样子简直一模一样。
        - id: ch01-b11
          speaker: narrator
          text: >-
            到了木头尽头，阔步放下尾巴，身子挺直，双翼开始拍动。先是慢慢地拍，随后越来越快，最后快得只看得见一片模糊的影子。翅膀抬起时像是在背上方碰到一起，落下时却没有打中身体两侧。
        - id: ch01-b12
          speaker: narrator
          text: >-
            雷声就是这样响起来的，而且响得彼得几乎要捂住耳朵。等雷声停下，阔步又伏在木头上，收平颈边的披领，重新变成一个蓬松的羽毛球。
        - id: ch01-b13
          speaker: narrator
          text: 彼得一连看了好几次，终于忍不住走了出来。
        - id: ch01-b14
          speaker: peter_rabbit
          text: 阔步，你真了不起！实在太了不起了！
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 彼得说得真心实意。阔步听了，得意地挺起胸膛。
        - id: ch01-b16
          speaker: strutter_grouse
          text: >-
            松鸡太太也是这么夸我的。不是我自己吹嘘，可要说打雷鼓，我真不知道还有谁能胜过我。
        - id: ch01-b17
          speaker: peter_rabbit
          text: 对了，松鸡太太在哪里？
        - id: ch01-b18
          speaker: strutter_grouse
          text: 她当然在料理家务。一个好主妇就该这样。
        - id: ch01-b19
          speaker: peter_rabbit
          text: 这么说，她已经有鸟巢和鸟蛋了？
        - id: ch01-b20
          speaker: narrator
          text: 阔步点点头，神气更足了。
        - id: ch01-b21
          speaker: strutter_grouse
          text: 她有十二枚蛋呢。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 那我来猜猜看，那座巢一定就在这附近的地面上吧？
        - id: ch01-b23
          speaker: strutter_grouse
          text: >-
            巢是在地面上，可究竟在哪里，我半个字也不会告诉你。也许离这里很近，也许一点儿也不近。你想不想再听一次雷鼓？
        - id: ch01-b24
          speaker: narrator
          text: >-
            彼得当然想听，阔步也正好有理由再炫耀一次。彼得又陪他聊了一会儿，可阔步只顾着打雷鼓，对谈话没多大兴趣。于是，彼得告辞回家去了。
        - id: ch01-b25
          speaker: peter_rabbit
          text: >-
            我真想知道那座巢藏在哪里。不过，松鸡太太一定藏得巧极了，去找也是白费力气。
        - id: ch01-b26
          speaker: narrator
          text: >-
            彼得边跑边想，没多久便经过一棵大树。树下没有灌木，也没有幼树，四周的地面只铺着一层棕褐色的枯叶。他连找一找的念头都没有。在彼得眼里，这可是天底下最不可能藏着鸟巢的地方。
        - id: ch01-b27
          speaker: narrator
          text: >-
            可等彼得走远以后，树脚下的落叶间传出了一声轻笑。一颗脑袋微微抬起来，两只明亮的眼睛闪着笑意，一直望着彼得消失。
        - id: ch01-b28
          speaker: mrs_grouse
          text: >-
            他完全没看见我。多亏这件外衣跟棕色落叶一模一样。从我旁边经过却没发现我的，他可不是第一个。这比费心藏起鸟巢还管用呢。我真该谢谢大自然老妈妈，送了我这么好的衣裳。
        - id: ch01-b29
          speaker: mrs_grouse
          text: >-
            不知道十二枚蛋能不能全部孵出来。要是每一枚都能孵化，我就会有一大家子值得骄傲的孩子啦。
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: >-
            松鸡太太笑着重新伏好。彼得对这一切毫不知情，还是那副无忧无虑的模样，一路匆匆赶到绿森林边缘。他朝前方的绿草地望去，看见一个黑色身影正庄重地来回走动，偶尔还低头啄起一点儿东西。
        - id: ch01-b31
          speaker: narrator
          text: >-
            彼得先想到了乌鸦布莱基，可这个身影还不到布莱基的一半大，当然不会是他。彼得很快认出了那位鸟朋友。
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            是拟八哥嘎嘎！他今年春天回来得那么早，我竟一直没去拜访，真不应该。瞧他那条长尾巴，多神气！珍妮说他属于黑鸟家族。大概是因为他长得像布莱基，大家才叫他乌鸦黑鸟吧。
        - id: ch01-b33
          speaker: narrator
          text: >-
            彼得跳出森林，向嘎嘎跑去。恰好在这时，嘎嘎转过身，阳光一下照亮了他的脑袋和背脊。彼得吃惊得揉起眼睛。
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            咦！原来他不只是一身黑色。他这么漂亮！我以前还以为，他穿的只是一件普普通通、毫不起眼的黑衣裳呢。
          emotion: surprised
        - id: ch01-b35
          speaker: narrator
          text: >-
            阳光下的嘎嘎的确漂亮。头、颈、喉咙和胸口上方泛着明亮的蓝黑色，背部闪着浓郁的铜绿色。翅膀和长尾巴则跟头颈差不多。彼得看着看着，只觉得那些颜色不停变幻。这种会随着光线变化的色泽，就叫虹彩。
        - id: ch01-b36
          speaker: narrator
          text: >-
            彼得还发现，嘎嘎有一双黄色的眼睛。他想了半天，也想不起自己还见过哪种黄眼睛的鸟。
        - id: ch01-b37
          speaker: peter_rabbit
          text: 嘎嘎，你知道自己有多英俊吗？
        - id: ch01-b38
          speaker: creaker_grackle
          text: >-
            你这么想，我很高兴。我可一点儿也不虚荣，不过说真的，能让我愿意交换衣裳的鸟，还真没有几个。
        - id: ch01-b39
          speaker: peter_rabbit
          text: 那……嘎嘎太太也跟你一样漂亮吗？
        - id: ch01-b40
          speaker: narrator
          text: 彼得问得有点儿胆怯。嘎嘎摇了摇头。
        - id: ch01-b41
          speaker: creaker_grackle
          text: >-
            不完全一样。她喜欢朴素的黑色。她背上也有几根像我这样闪光的羽毛，可她说，自己既没空站在阳光下卖弄，也没空照料漂亮衣裳。
        - id: ch01-b42
          speaker: peter_rabbit
          text: 她现在在哪里？
        - id: ch01-b43
          speaker: narrator
          text: 嘎嘎从草根间扯出一条白色蛴螬，这才回答。
        - id: ch01-b44
          speaker: creaker_grackle
          text: >-
            她在家。我们的巢就在那边，筑在绿森林边缘的一棵松树上。再过几天，家里大概就会有四个饿肚子的宝宝。到那时候，我可得忙起来了。我一直觉得，每个父亲都该尽到自己的本分，和妻子一起照顾家人。
        - id: ch01-b45
          speaker: peter_rabbit
          text: 听你这样说，我真高兴。
        - id: ch01-b46
          speaker: narrator
          text: >-
            彼得赞许地点着头，仿佛他自己是天下最尽责的父亲。可说实话，他根本不是。接着，他想起一件事，神情忽然变得认真起来。
        - id: ch01-b47
          speaker: peter_rabbit
          text: 嘎嘎，我能问一个很私人的问题吗？
        - id: ch01-b48
          speaker: creaker_grackle
          text: 你想问多少都可以。不过，我不想回答的问题，可没人能逼我说。
        - id: ch01-b49
          speaker: peter_rabbit
          text: 你真的会偷别的鸟的蛋吗？
        - id: ch01-b50
          speaker: narrator
          text: 彼得一口气问了出来。嘎嘎的黄眼睛里立刻闪起了笑意。
        - id: ch01-b51
          speaker: creaker_grackle
          text: >-
            这还真是个很私人的问题。我可不会说自己偷蛋，只不过，鸟蛋对我的身体很有好处。要是有座巢没人守着，我偶尔就自己拿几枚吃。巢主人说不定不会回来了。那样一来，蛋不是要坏掉吗？多可惜呀。
        - id: ch01-b52
          speaker: peter_rabbit
          text: >-
            这根本不是借口。我看你跟冠蓝鸦萨米和乌鸦布莱基一样，谁也不比谁好。
        - id: ch01-b53
          speaker: narrator
          text: >-
            嘎嘎听了只是轻声发笑，一点儿也没生气。正在这时，嘎嘎太太从远处叫他。他匆匆向彼得道别，张开双翼，朝绿森林飞去。
        - id: ch01-b54
          speaker: narrator
          text: >-
            一飞到空中，阳光下那些变幻的色彩便看不见了，嘎嘎又显得只是一身寻常的黑色。彼得目送他飞远，直到再也瞧不见，随后转过身，重新朝亲爱的老蔷薇丛走去。
