audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, earnest, and quick to react
        timbre: warm and youthful
        pace: lively
        pitch: medium
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, knowing, and sharply playful
        timbre: bright and crisp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: A Boom in the Daylight
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Boom! Peter Rabbit sprang as though someone had shot at him. Everything happened so suddenly and unexpectedly that he jumped before he had time to think. Then he looked foolish, and felt foolish too. He had been badly scared when there was really nothing at all to fear.
        - id: ch01-b02
          speaker: jenny_wren
          text: Ha, ha, ha! Why did you jump, Peter Rabbit? That was only Boomer the Nighthawk.
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            I know that as well as you do, Jenny Wren. Anyone can get cross after being startled. If I'd seen Boomer nearby, he wouldn't have made me jump. I just wasn't expecting it. And why is he out now? It isn't even dusk, and I thought he was a night bird.
        - id: ch01-b04
          speaker: jenny_wren
          text: >-
            He is. Well, he is an evening bird, which is nearly the same thing. But liking evening best doesn't mean he can't come out by daylight, does it?
        - id: ch01-b05
          speaker: peter_rabbit
          text: No-o. I suppose it doesn't.
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            Of course not. I see Boomer late in the afternoon almost every day, and on cloudy days I often see him early in the afternoon. He is a queer fellow, that Boomer. And what a mouth he has! I suppose a great big mouth is very useful when you must catch all your food in the air. Still, it certainly isn't pretty when he opens it wide.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            I've never seen any mouth look pretty wide open. And I've never noticed that Boomer's mouth was especially big.
        - id: ch01-b08
          speaker: jenny_wren
          text: >-
            It is big, whether you've noticed it or not. His bill is only a little thing, but behind it is an enormous mouth. I cannot imagine why people call him a Hawk when he isn't one at all. He is no more a Hawk than I am, and goodness knows I am not even related to the Hawk family.
        - id: ch01-b09
          speaker: peter_rabbit
          text: Didn't you tell me the other day that Boomer is related to Sooty the Chimney Swift?
        - id: ch01-b10
          speaker: narrator
          text: Jenny nodded with all her might.
        - id: ch01-b11
          speaker: jenny_wren
          text: >-
            I certainly did, Peter. I'm glad your memory is so good. Boomer and Sooty are something like second cousins. There goes Boomer now, high in the sky. I wish he'd dive and startle somebody else.
    - id: ch02
      title: Boomer Dives
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter leaned his head far back and peered upward. High against the deep blue sky, a bird was circling, then darting one way and another. From that great distance, he looked something like a greatly overgrown Swallow.
        - id: ch02-b02
          speaker: narrator
          text: >-
            As Peter watched, Boomer partly closed his wings and plunged toward the earth. He fell so fast that Peter held his breath. It seemed certain that Boomer would smash into the ground. But just before he reached it, his wings opened and swept him upward. At that very instant came the boom that had frightened Peter. The sound was the wind rushing through Boomer's large wing feathers as he stopped his dive.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The dive brought Boomer close enough for Peter to get a good look at him. His coat was a soft-looking mixture of brown and gray. His wings were brown, with a clear white patch on each one. Another white patch marked his throat, and a band of white crossed his tail near the end.
        - id: ch02-b04
          speaker: jenny_wren
          text: He is rather handsome, don't you think?
        - id: ch02-b05
          speaker: peter_rabbit
          text: He certainly is. Jenny, what kind of nest do Nighthawks build?
        - id: ch02-b06
          speaker: jenny_wren
          text: They don't build one.
        - id: ch02-b07
          speaker: narrator
          text: Jenny looked thoroughly scornful.
        - id: ch02-b08
          speaker: jenny_wren
          text: >-
            They don't build any kind of nest at all. But it cannot be because they're lazy. I don't know a single bird that hunts harder for a living than Boomer and Mrs. Boomer do.
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            But where does Mrs. Boomer lay her eggs if there's no nest? You must be mistaken, Jenny. Surely they have some kind of nest.
          emotion: surprised
        - id: ch02-b10
          speaker: jenny_wren
          text: >-
            Didn't I just tell you they have no nest? Mrs. Nighthawk lays only two eggs, so perhaps she thinks it isn't worth building one for such a small family. She simply puts the eggs on the bare ground or on a flat rock and leaves it at that. Still, she isn't quite as bad as Sally Sly the Cowbird. Mrs. Nighthawk does sit on her own eggs, and she is a good mother. But just think of those Nighthawk children growing up without any home at all! It doesn't seem right to me, and it never will. Now, have you ever seen Boomer sitting in a tree?
        - id: ch02-b11
          speaker: narrator
          text: Peter shook his head.
        - id: ch02-b12
          speaker: peter_rabbit
          text: I've seen him on the ground, but never in a tree. Why do you ask?
        - id: ch02-b13
          speaker: jenny_wren
          text: >-
            I wanted to find out how well you've been using your eyes. I thought you might have noticed something peculiar about the way he sits in a tree. But since you've never seen him there, I may as well tell you. Boomer sits lengthwise along a branch. He never sits across it the way the rest of us birds do.
        - id: ch02-b14
          speaker: peter_rabbit
          text: How funny! Is Boomer making that strange sound we hear now?
          emotion: surprised
        - id: ch02-b15
          speaker: jenny_wren
          text: >-
            Yes. He certainly likes using his voice. I've heard that some people call him Bullbat. Why anyone calls him either a Bat or a Hawk is more than I can understand. I suppose you know his cousin Whip-poor-will.
    - id: ch03
      title: Whip-poor-will's Whiskers
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: >-
            Of course I know him. When he starts shouting, "Whip poor Will," close by, he can nearly drive me crazy. That voice goes straight through me until I want to cover both ears. I don't know anyone else who can say one thing over and over, then say it over and over again, so many times without stopping for breath. Do you really mean that he is Boomer's cousin?
        - id: ch03-b02
          speaker: jenny_wren
          text: >-
            He is another kind of second cousin, just like Sooty the Chimney Swift. Boomer and Whip-poor-will look enough alike to be first cousins. Whip-poor-will has exactly the same sort of great mouth, and even his coat looks much like Boomer's. The difference is that Whip-poor-will has no white patches on his wings.
        - id: ch03-b03
          speaker: peter_rabbit
          text: I've noticed that. It's one way I can tell them apart.
        - id: ch03-b04
          speaker: jenny_wren
          text: >-
            So you noticed something after all! That does you credit, Peter. I wonder if you noticed Whip-poor-will's whiskers too.
        - id: ch03-b05
          speaker: peter_rabbit
          text: >-
            Whiskers? A bird with whiskers? You can make me believe plenty of things, Jenny Wren, but I cannot swallow that one.
          emotion: surprised
        - id: ch03-b06
          speaker: jenny_wren
          text: >-
            Nobody asked you to swallow his whiskers, and nobody wants you to. Why shouldn't a bird have whiskers when you have them yourself, Peter Rabbit? Whip-poor-will has them, whether you believe it or not. I expect they are even more useful to him than yours are to you. I know that if I had to catch all my food in the air, I'd want whiskers, and plenty of them, so the insects would get tangled there. I suppose that is exactly what Whip-poor-will uses his for.
        - id: ch03-b07
          speaker: peter_rabbit
          text: >-
            I beg your pardon, Jenny. If you say Whip-poor-will has whiskers, then of course he does. But does his family build a better nest than the Nighthawks do?
        - id: ch03-b08
          speaker: jenny_wren
          text: >-
            Not one bit better. Mrs. Whip-poor-will lays her eggs right on the ground. She usually chooses a dark and lonely place in the Green Forest, but there still isn't any nest. And just like Mrs. Nighthawk, she lays only two eggs. It is the same with another second cousin of theirs, Chuck-will's-widow.
    - id: ch04
      title: The Biggest Mouth of All
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: Who?
          emotion: surprised
        - id: ch04-b02
          speaker: narrator
          text: Peter wrinkled his forehead, and Jenny almost shouted the name at him.
        - id: ch04-b03
          speaker: jenny_wren
          text: Chuck-will's-widow! Don't you know Chuck-will's-widow?
        - id: ch04-b04
          speaker: narrator
          text: Peter shook his head.
        - id: ch04-b05
          speaker: peter_rabbit
          text: I've never even heard of that bird.
        - id: ch04-b06
          speaker: jenny_wren
          text: >-
            That's what comes of never traveling. If you'd ever visited the South the way I have, you would know Chuck-will's-widow. He looks a great deal like the other two birds we've been talking about, but his mouth is even bigger. What's more, his whiskers have branches. Now don't look at me as though you doubt it, Peter Rabbit. It is perfectly true.
        - id: ch04-b07
          speaker: jenny_wren
          text: >-
            His habits are just like his cousins' habits. He builds no nest, and Mrs. Chuck-will's-widow lays only two eggs right on the ground. I never knew birds so afraid of raising a proper family. Why, if the Wrens did no better than that, I don't know what would ever become of us.
        - id: ch04-b08
          speaker: narrator
          text: Jenny, you see, usually had a family of six or eight.
