audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
  chapters:
    - id: ch01
      title: 一声突如其来的轰鸣
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            “轰！”兔子彼得像挨了一枪似的，猛地蹦了起来。声音来得太突然，也太出人意料，他根本来不及想，身体先有了反应。等回过神来，他才发现什么危险也没有。刚才受惊的样子显得傻乎乎的，他自己也觉得傻透了。
        - id: ch01-b02
          speaker: jenny_wren
          text: 哈，哈，哈，哈！兔子彼得，你乱跳什么？那只是夜鹰轰鸣呀。
          emotion: happy
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            这我当然知道，鹪鹩珍妮。人冷不防受了惊，心里总会有点儿恼火。我要是早看见他在附近，才不会跳起来呢。偏偏这一下来得太突然。再说，天还没到黄昏，他怎么已经出来了？我一直以为他是夜鸟。
        - id: ch01-b04
          speaker: jenny_wren
          text: >-
            他本来就是夜鸟，至少是傍晚活动的鸟，反正差不多。可他喜欢傍晚，也不等于白天不能出来呀，对不对？
        - id: ch01-b05
          speaker: peter_rabbit
          text: 不——错，我想大概是这样。
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            本来就是这样。差不多每天下午晚些时候，我都能看见轰鸣。要是碰上阴天，下午才刚过一半，他就会露面。这个家伙真古怪，尤其是那张嘴，实在太大了！他每一口食物都得从空中捉，嘴大当然方便，可一张开来就真不好看。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 哪张嘴大张着会好看？反正我从没觉得轰鸣的嘴特别大。
        - id: ch01-b08
          speaker: narrator
          text: 彼得心里还在别扭，说起话来也不太客气。珍妮听了，马上尖锐地顶了回去。
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            你没留意，不代表他的嘴不大。他的喙只有一丁点儿，嘴巴却大得惊人。我也不懂大家为什么叫他鹰，他根本不是鹰。他跟鹰家族的关系并不比我近，而我连他们的远亲都算不上。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 我记得你前几天说过，轰鸣跟烟囱雨燕煤灰是亲戚。
        - id: ch01-b11
          speaker: narrator
          text: 珍妮使劲点起头来。
        - id: ch01-b12
          speaker: jenny_wren
          text: >-
            我是说过。彼得，难得你记得这么清楚。轰鸣和煤灰勉强算是远房表亲。快看，轰鸣正在高空呢。我真希望他再俯冲一次，去吓吓别人。
        - id: ch01-b13
          speaker: narrator
          text: >-
            彼得把脑袋向后仰到不能再仰。蓝得透亮的高空中，有只鸟远远看去，像一只大得出奇的燕子。他忽而绕着圈盘旋，忽而向这边冲，又猛地朝那边蹿。就在彼得盯着他时，他把双翅收起一半，箭一般射向地面。速度实在太快，彼得连气都不敢喘。眼看轰鸣就要撞上大地，把自己摔得粉身碎骨，他却在最后一刻忽然展开翅膀，转头向上飞去。又是一声“轰”！原来，他止住俯冲时，急速迎面的风从翅膀上那些较大的羽毛间穿过，便响起了这个声音。
        - id: ch01-b14
          speaker: narrator
          text: >-
            这一下俯冲让轰鸣飞得很近，彼得总算把他从头到尾瞧清了。他的外衣混着褐色和灰色，看上去柔软极了。两边褐色的翅膀上各有一块清楚的白斑，喉部也有一块白斑，尾巴靠近末端的地方还横着一道白带。
        - id: ch01-b15
          speaker: jenny_wren
          text: 他其实挺英俊的，你不觉得吗？
        - id: ch01-b16
          speaker: peter_rabbit
          text: 的确很英俊。珍妮，夜鹰会筑什么样的巢？
    - id: ch02
      title: 没有鸟巢的鸟
      blocks:
        - id: ch02-b01
          speaker: jenny_wren
          text: >-
            他们压根儿不筑巢，什么样的巢都不搭。可这绝不是因为懒。轰鸣和轰鸣太太为了糊口，一刻不停地在空中追着食物飞，我还不知道有哪种鸟会比他们捕食更卖力。
        - id: ch02-b02
          speaker: narrator
          text: 珍妮说起他们不筑巢的事，脸上满是鄙夷。
        - id: ch02-b03
          speaker: peter_rabbit
          text: >-
            没有巢，轰鸣太太把蛋下在哪儿？珍妮，你肯定弄错了。他们总得有个什么样的巢，一定有。
          emotion: surprised
        - id: ch02-b04
          speaker: jenny_wren
          text: >-
            我不是说了没有吗？反正夜鹰太太每次只下两枚蛋。也许她觉得，只为两枚蛋特意搭个巢，根本不值得。她把蛋直接下在地面上，或者找块平坦的岩石放下，这就算完事了。她倒不像狡猾莎莉牛鹂那么坏，因为她会亲自坐在蛋上孵化，也会好好照顾孩子。可是，你想想，那些夜鹰孩子从出生起竟然连个家也没有！这件事我现在觉得不对，以后也永远觉得不对。你见过轰鸣待在树上吗？
        - id: ch02-b05
          speaker: narrator
          text: 彼得摇了摇头。
        - id: ch02-b06
          speaker: peter_rabbit
          text: 我看见他待在地上，却从没在树上见过他。你为什么问这个？
        - id: ch02-b07
          speaker: jenny_wren
          text: >-
            我想看看你平时有没有好好用眼睛，还想知道你留意过他在树上的坐法没有。既然你从没在树上见过他，我就直接告诉你吧。他停在树枝上时，样子跟大多数鸟都不同。我们大家都是横着站在枝头，他却从不这样，总把整个身体顺着树枝停放。
        - id: ch02-b08
          speaker: peter_rabbit
          text: 真有趣！我们听见的那个怪声，也是轰鸣叫的吗？
          emotion: surprised
        - id: ch02-b09
          speaker: jenny_wren
          text: >-
            是呀，他可喜欢亮嗓子了。听说还有人叫他牛蝠，可为什么把他当成蝙蝠或者鹰，我怎么也想不通。你总认识他的表亲三声夜鹰吧？
        - id: ch02-b10
          speaker: peter_rabbit
          text: >-
            我当然认识。他一在近处扯着嗓子，反复喊“鞭打可怜的威尔”，简直能把人逼疯。那声音直往我耳朵深处钻，听得我恨不得把两只耳朵全堵住。我认识的人当中，可没有谁能把一句话说了一遍又一遍，再一遍又一遍，说上那么多次，中间还不用停下来喘一口气。他也是轰鸣的表亲吗？
        - id: ch02-b11
          speaker: jenny_wren
          text: >-
            对，他跟烟囱雨燕煤灰一样，也算轰鸣的远房表亲。他们长得实在很像，说是嫡亲表兄弟也有人相信。三声夜鹰也有同样的一张大嘴巴，身上的衣裳跟轰鸣很相似。两者最大的不同，就是三声夜鹰的翅膀上没有那些白斑。
        - id: ch02-b12
          speaker: peter_rabbit
          text: 这个我注意到了。我正是靠白斑分辨他们的。
        - id: ch02-b13
          speaker: jenny_wren
          text: >-
            原来你还看到了这个？值得夸奖，彼得，真值得夸奖。那么，三声夜鹰的胡须，你也留意到了吗？
        - id: ch02-b14
          speaker: peter_rabbit
          text: >-
            胡须！哪有鸟儿长胡须的？珍妮，你已经让我相信过不少稀奇事，可鸟长胡须这句话，我实在咽不下去。
          emotion: surprised
        - id: ch02-b15
          speaker: jenny_wren
          text: >-
            又没人叫你把胡须咽下去，也没人想让你咽。兔子彼得，你自己可以有胡须，鸟儿为什么不能有？三声夜鹰就是长着胡须，事情这么简单。你信也好，不信也好，它们照样长在那里。我看，他的胡须跟你的同样好用，没准儿还更有用。要是我所有的食物都得在半空中捉，我也想长出一大把胡须。那样一来，飞虫就会缠在胡须上，不容易从嘴边逃掉。三声夜鹰的胡须大概就是干这个的。
    - id: ch03
      title: 嘴巴更大的远房表亲
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: >-
            对不起，鹪鹩珍妮。既然你说三声夜鹰有胡须，那他当然就有。对了，他们筑巢的本事比夜鹰好一点儿吗？
        - id: ch03-b02
          speaker: jenny_wren
          text: >-
            一点儿也不。三声夜鹰太太也把蛋直接下在地上，不过她通常会待在绿森林里，专门找一处又暗又僻静的地方。她和夜鹰太太一样，每次只下两枚蛋。他们还有一位远房表亲，名叫卡罗琳夜鹰。他在筑巢这件事上，也是完全相同的做法。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 谁？
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: 彼得皱紧眉头。珍妮只好把那个名字大声喊给他听。
        - id: ch03-b05
          speaker: jenny_wren
          text: 卡罗琳夜鹰！你连卡罗琳夜鹰都不知道吗？
        - id: ch03-b06
          speaker: narrator
          text: 彼得摇了摇头。
        - id: ch03-b07
          speaker: peter_rabbit
          text: 我从来没听说过这种鸟。
        - id: ch03-b08
          speaker: jenny_wren
          text: >-
            这就是从不出远门的结果。你要是像我一样去过南方，自然会认识他。他的模样跟我们刚才说的那两位很像，嘴巴却比他们的还要大。不仅如此，他的胡须还会分出枝杈。兔子彼得，别露出那副不相信的样子，这可是真的。他的生活习惯跟表亲们完全一样，从来不筑巢，每次也只下两枚蛋。我从没见过谁这么害怕养起一个真正的大家庭。要是我们鹪鹩也只养这么几个孩子，真不知道这一族最后会变成什么样。
        - id: ch03-b09
          speaker: narrator
          text: >-
            珍妮说这番话，自然很有她自己的道理。你也知道，她可不像这些远房表亲，通常一次要养六到八个孩子。在她眼里，那才称得上一个真正的大家庭。
