audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    teacher_ovenbird:
      display_name: 灶巢鸟老师
      tts:
        delivery: 机敏认真，开口清楚有力，戒备时略显尖锐
        timbre: 清脆明亮
        pace: 明快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十八章　绿森林里的几处家园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            红狐雷迪没守多久。他朝躲在灌木枝条下的兔子彼得撂下几句狠话，想吓他出来，接着便小跑着去找田鼠了。彼得早已听惯这种威胁，根本不放在心上。他知道这里很安全，只要等雷迪走远再出来就行。
        - id: ch01-b02
          speaker: narrator
          text: >-
            等待的时候，彼得索性打了个小盹。醒来以后，他坐在那里想了一会儿，琢磨接下来去哪里。忽然，老牧场那边远远传来了乌鸦布莱基的叫声。彼得竖起耳朵，听着听着便笑了。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 雷迪已经回到老牧场了。布莱基在那边发现他啦。
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: >-
            彼得听得懂布莱基的话。你我听见的也许只是“哇！哇！”可绿森林和绿草地上的小居民只要听得见他的声音，就都明白了。布莱基是在一遍遍高喊：“狐狸！狐狸！”
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            不知道布莱基今年在哪里筑巢。去年，他住在绿森林边缘的一棵高松树上。我去看看吧，也许他在旧巢旁边另盖了一座新家。
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得很快跑到那棵高松树下。他坐在树底，脑袋仰得高高的，盯着布莱基的旧巢看了又看。奇怪的是，那座巢一点儿也不显旧，倒像刚刚修整过，几乎和新的一样。彼得正猜着这意味着什么，布莱基忽然飞回来，落在巢边。
        - id: ch01-b07
          speaker: narrator
          text: >-
            布莱基嘴里叼着东西，彼得却看不清是什么。几乎就在他落下的同时，一颗黑脑袋从巢边探出来，一只黑嘴迅速接走了那样东西。脑袋随即缩回巢里，布莱基也一声不响地飞走了。
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            那一定是布莱基太太。布莱基怕她离开巢里的蛋，特地给她送吃的。人人都说他是个黑心强盗，可他当丈夫倒真不错，比有些只听得见好话的家伙强多了。看来，再坏的家伙身上也有好处。
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            布莱基这个老滑头真够狡猾。平常数他最吵，回自己的巢却一点儿声音也没有。今年春天，我在这附近一次也没听见他叫。要是布朗家的男孩找到这里，肯定会来报他拔玉米的仇。我认识的聪明家伙不少，可谁也没有他聪明。就算他有那么多坏处，我还是忍不住喜欢他。
        - id: ch01-b10
          speaker: narrator
          text: >-
            彼得继续看着，布莱基又给太太送了两次食物。后来，他实在不想再一动不动地等下去，便打算到绿森林深处一个很少有人去的地方看看。彼得平常总避开那里，这一回纯粹是好奇，偏想亲眼瞧一瞧。布莱基重新住进旧巢，使他想起红尾鹰每年也会回到老巢。他很想弄清楚，红尾鹰今年是不是也回来了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            走到半路，一只身形利落的小鸟从地面飞起。他跳过几根树枝，又沿着一根枝条走了几步。因为心里实在太快活，他忽然仰起脑袋唱起来。一声“老师”接一声“老师”，每一声都比前一声更响。原来是灶巢鸟老师。
        - id: ch01-b12
          speaker: narrator
          text: 彼得见到老朋友，马上把红尾忘在了脑后。
        - id: ch01-b13
          speaker: peter_rabbit
          text: 老师！又见到你，我真高兴！
          emotion: happy
        - id: ch01-b14
          speaker: teacher_ovenbird
          text: 既然见到我这么高兴，你怎么不早点儿来？我已经回来好一阵了。
        - id: ch01-b15
          speaker: narrator
          text: 老师停下歌声，低头看着彼得。彼得有点儿难为情，说话也格外谦逊。
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            说实话，我最近总往老果园跑，一直在了解你们羽族。我学到了好多从前根本想不到的事，所以今天才有机会走到绿森林这么远的地方。老师，我还有件事想请教你。你肯告诉我吗？
        - id: ch01-b17
          speaker: teacher_ovenbird
          text: 那要看你问什么了。
        - id: ch01-b18
          speaker: narrator
          text: 老师带着几分怀疑，仔细瞧了瞧彼得。
        - id: ch01-b19
          speaker: peter_rabbit
          text: 我想知道，大家为什么叫你灶巢鸟。
        - id: ch01-b20
          speaker: teacher_ovenbird
          text: >-
            原来只是这个。因为老师太太和我筑出的巢很特别，有些人说那座巢像烤炉，就给我们取了灶巢鸟这个名字。要我说，这名字傻得很，跟金冠鸫一样傻。有些人也那么叫我，可我根本不是鸫，跟鸫科也没有亲缘关系。我是林莺，属于森莺。
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            我猜，他们觉得你的衣裳像鸫，才给你取了那个名字。橄榄绿色的外套，还有满是黑色条纹和斑点的白背心，看起来确实很像鸫科。要不是你比所有的鸫都小，我也差点儿认错。你只比鸣雀奇皮大一点儿，不过腿比他长。大概是因为你常在地面上走吧。
        - id: ch01-b22
          speaker: peter_rabbit
          text: >-
            我还是觉得叫你老师最好。只要听过你的歌，谁都不会再把你认错。对了，你刚才说巢筑在哪里来着？
        - id: ch01-b23
          speaker: teacher_ovenbird
          text: 我根本没说，而且也不打算告诉你。
        - id: ch01-b24
          speaker: peter_rabbit
          text: 那至少告诉我，巢是不是在树上，好不好？
        - id: ch01-b25
          speaker: narrator
          text: 老师眼里露出了笑意。
        - id: ch01-b26
          speaker: teacher_ovenbird
          text: >-
            这一点倒可以告诉你。我的巢不在树上，就在地面上。不是我自夸，那座巢藏得特别好，谁也未必能筑得更隐蔽。彼得，小心脚下！快停下！
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: >-
            老师最后几乎尖叫起来。彼得刚要往右边跳，惊得猛然停住。他面前有一小堆枯叶，像个小土丘。几英尺外，老师太太正在地面上来回扑腾，看起来像受了重伤。彼得完全弄不懂这是怎么回事，又动了动身子，像要再跳一步。老师立刻飞落到他面前，挡住了去路。
        - id: ch01-b28
          speaker: teacher_ovenbird
          text: 你要踩到我的巢了！
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: 彼得瞪着眼四处看。他压根儿没看见鸟巢，便把这话告诉了老师。
        - id: ch01-b30
          speaker: teacher_ovenbird
          text: >-
            巢就在你脚前面，在那一小堆叶子底下！我原本不想说，可再不告诉你，你准会一脚踩上去。
        - id: ch01-b31
          speaker: narrator
          text: >-
            彼得格外小心地绕过那一小堆树叶，又从另一边俯下身，探头往叶子底下看。老师说得没错，那里果然藏着一座巢，巢里还有四枚带斑点的蛋。
        - id: ch01-b32
          speaker: peter_rabbit
          text: >-
            老师，我保证谁也不告诉。我绝不会把你的秘密说出去。现在我懂了，大家为什么叫你灶巢鸟。不过，我还是最喜欢老师这个名字。
        - id: ch01-b33
          speaker: narrator
          text: >-
            彼得知道，只要自己还在附近，老师夫妇就放不下心，于是向他们告别，继续往红尾的旧巢走。快到那处僻静地方时，他一路留心察看树梢，唯恐红尾突然出现。没过多久，红尾真的出现在高高的蓝天上，展开翅膀，懒洋洋地绕着大圈。
        - id: ch01-b34
          speaker: narrator
          text: >-
            彼得立刻谨慎起来。他一路尽可能躲在枝叶和树干下面，踮着脚慢慢往前走，最后藏进一棵小铁杉下面，探头望见了红尾的旧巢。那座巢比他上次见到时大了许多。忽然，几只雏鸟一齐发出饥饿的叫声。红尾太太飞了过来，爪子里抓着一只田鼠。四颗滑稽的小脑袋全伸出了巢边。
        - id: ch01-b35
          speaker: peter_rabbit
          text: >-
            红尾果然又住进旧巢，连孩子都有了。这里可不适合我，越快离开越好。
        - id: ch01-b36
          speaker: narrator
          text: >-
            偏偏就在这时，红尾从湛蓝湛蓝的天空直落下来，停在近旁的一棵树上。彼得知道，眼下最安全的办法就是待在原地，连动也不要动。这样一来，他倒有机会把这位鹰家族里的大个子看得清清楚楚，也忍不住暗暗赞叹起来。
        - id: ch01-b37
          speaker: narrator
          text: >-
            红尾背上的羽毛是深灰褐色，里面夹着一抹抹栗色。胸口上方布满灰褐色和浅黄褐色的细纹，下方的纹路却少了许多。再往下，可以看见一片片黑色斑点和一道道横纹，到了最下面才渐渐收成白色。
        - id: ch01-b38
          speaker: narrator
          text: >-
            彼得看得最仔细的还是尾巴。那条尾巴是浓郁的红褐色，靠近末端有一道窄窄的黑带，尖端又带着白色。只看一眼，彼得就明白这只大鹰为什么名叫红尾了。
        - id: ch01-b39
          speaker: narrator
          text: >-
            红尾夫妇终于一起飞走，去给饥饿的孩子寻找更多食物。直到这时候，彼得才敢从藏身处悄悄地溜开。一觉得四周安全，他立刻朝家里飞跑，蹦呀蹦，蹦呀蹦，跑得要多快有多快。只有等绿森林里那处僻静地方远远落在身后，他才能真正安心。
        - id: ch01-b40
          speaker: narrator
          text: >-
            说实在的，彼得不用那么害怕。若在那里筑巢的是鹰家族里的另一位，他才更有理由担心。红尾和妻子有时确实会捉几个长羽毛或长毛的邻居，偶尔也抓一只鸡。不过，把他们做的好事和坏事放在一起比较，就会发现好处远远更多。
