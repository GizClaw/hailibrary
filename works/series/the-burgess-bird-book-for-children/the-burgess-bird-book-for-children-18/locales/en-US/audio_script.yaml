audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, friendly, and quick-witted
        timbre: light and warm
        pace: lively
        pitch: medium-high
    teacher_oven_bird:
      display_name: Teacher the Oven Bird
      tts:
        delivery: precise, proud, and slightly guarded
        timbre: clear and bright
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Some Homes in the Green Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Reddy Fox did not waste much time waiting for Peter Rabbit to come out from the brush pile where Sammy Jay's warning had sent him hiding. Reddy made some dreadful threats, hoping to scare Peter into the open, and then trotted off to hunt for Mice. Peter was used to those threats and paid no attention. He knew Reddy could not reach him beneath the brush. All Peter had to do was stay there until Reddy was far enough away for him to come out safely.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter passed the time with a short nap. When he woke, he sat wondering where to go next. Then Blacky the Crow called from the direction of the Old Pasture. Peter pricked up his ears and chuckled.
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            Reddy has gone back to the Old Pasture, and Blacky has spotted him there.
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter understood Blacky's call. You or I would have heard only, “Caw! Caw!” But every little person in the Green Forest and Green Meadows heard the warning, “Fox! Fox!”
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            I wonder where Blacky built his nest this year. Last year it was in a tall pine near the edge of the Green Forest. Maybe his new nest is close to the old one. I'll go see.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter scampered to the tall pine that held Blacky's old nest. He sat below it with his head tipped far back and stared up. The nest did not look so old after all. In fact, someone seemed to have repaired it until it was almost new again. Peter was still wondering what that could mean when Blacky himself landed close to its edge.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Blacky carried something in his bill, though Peter could not see what it was from the ground. Almost at once, a black head rose above the edge of the nest. A black bill took whatever Blacky had brought. Then the head vanished again, and Blacky flew away without making a sound.
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            That must have been Mrs. Blacky. Blacky brought her food so she could stay with the eggs up there. Everyone may call him a black-hearted robber, but he is certainly a good husband. Some birds have fine reputations and are not nearly as thoughtful. Even the worst folks have some good in them.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            And what a sly old rascal Blacky is! Usually he makes as much noise as anyone, but this time he came and went without a sound. I haven't heard him call near this tree once all spring. If Farmer Brown's boy found the nest, he might pay Blacky back for pulling up his corn. I know many clever people, but none quite as clever as Blacky the Crow. For all his bad ways, I can't help liking him.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter watched Blacky return twice more with food for Mrs. Blacky. Then he grew tired of sitting still for so long. He decided to visit a lonely part of the Green Forest where hardly anyone went. Peter usually stayed away from that place. Pure curiosity drew him there now. Finding Blacky in his old nest had reminded Peter that Redtail the Hawk also used his old nest year after year. He wanted to find out whether Redtail had come back to it this spring.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Halfway there, a neat little bird flew up from the ground. He hopped from branch to branch, walked along a limb, and then threw back his head in sheer happiness.
        - id: ch01-b12
          speaker: teacher_oven_bird
          text: >-
            Teacher, teacher, teacher, teacher, teacher!
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: >-
            Each call came a little louder than the one before. It was Teacher the Oven Bird. Peter was so delighted to see his old friend that he forgot all about Redtail.
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            Oh, Teacher! It is so good to see you again!
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: >-
            Teacher stopped singing and looked down at him.
        - id: ch01-b16
          speaker: teacher_oven_bird
          text: >-
            If you're so glad, why didn't you visit me sooner? I've been back for quite a while.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Peter looked rather foolish.
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            To tell the truth, Teacher, I've been visiting the Old Orchard so often and learning so many things that this is my first chance to come all the way over here in the Green Forest. I've discovered all kinds of things about you feathered folks that I never even guessed before. There is something I wish you would tell me, Teacher. Will you?
        - id: ch01-b19
          speaker: teacher_oven_bird
          text: >-
            That depends. What do you want to know?
        - id: ch01-b20
          speaker: narrator
          text: Teacher watched Peter with some suspicion.
        - id: ch01-b21
          speaker: peter_rabbit
          text: >-
            Why do people call you the Oven Bird?
        - id: ch01-b22
          speaker: teacher_oven_bird
          text: >-
            Is that all? Mrs. Teacher and I build a nest that some people think looks like an oven, so they call us Oven Birds. I think it's a silly name. Golden Crowned Thrush is just as silly, and some people call me that too. I am not a Thrush, or even a relative of the Thrush family. I am a Warbler, a Wood Warbler.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            Maybe they chose that name because your clothes look a little like a Thrush's. Your coat is olive-green, and your white waistcoat is covered with black streaks and spots. It certainly reminds me of the Thrush family. If you weren't so much smaller than every Thrush, I might almost take you for one myself. Why, you're only a little bigger than Chippy the Chipping Sparrow. Your legs are longer, though. I suppose you need them because you spend so much time walking on the ground.
        - id: ch01-b24
          speaker: peter_rabbit
          text: >-
            I still think Teacher is your best name. Once anyone hears your song, they could never mistake you for somebody else. By the way, where did you say your nest was?
        - id: ch01-b25
          speaker: teacher_oven_bird
          text: >-
            I didn't say, and I don't intend to.
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            Won't you at least tell me whether it's in a tree?
        - id: ch01-b27
          speaker: narrator
          text: Teacher's eyes twinkled.
        - id: ch01-b28
          speaker: teacher_oven_bird
          text: >-
            I suppose it won't hurt to tell you that much. No, it isn't in a tree. It's on the ground, and I must say, no one could hide a nest better. Oh, Peter! Watch where you're stepping! Watch your step!
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: >-
            Teacher fairly shrieked the warning as Peter started to hop to his right. Peter stopped short in sheer astonishment. A tiny mound of dead leaves lay just ahead of him. A few feet beyond it, Mrs. Teacher fluttered about on the ground as if she were badly hurt. Peter simply could not make sense of any of it. He tried once more to hop away, and Teacher flew straight down in front of him.
        - id: ch01-b30
          speaker: teacher_oven_bird
          text: >-
            You'll step right on my nest!
          emotion: fearful
        - id: ch01-b31
          speaker: narrator
          text: >-
            Peter stared. He could not see a nest anywhere, and he told Teacher so.
        - id: ch01-b32
          speaker: teacher_oven_bird
          text: >-
            It's beneath that little pile of leaves in front of your feet! I wasn't going to show you, but I had to. Otherwise you would have stepped on it.
          emotion: fearful
        - id: ch01-b33
          speaker: narrator
          text: >-
            Peter carefully walked around the leaves and peered underneath from the other side. Sure enough, a nest was tucked below them, holding four speckled eggs.
        - id: ch01-b34
          speaker: peter_rabbit
          text: >-
            I won't tell anyone, Teacher. I promise. Now I understand the name Oven Bird, but I still like Teacher better.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Peter felt sure that Mr. and Mrs. Teacher would be easier in their minds once he was gone. He said good-by and continued toward the lonely place where he knew Redtail the Hawk's old nest stood. As he drew near, he kept a sharp watch through the treetops for any glimpse of Redtail. Before long, he saw the big Hawk high in the blue sky, sailing lazily in great circles.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The sight of Redtail made Peter very, very cautious. He crept forward on tiptoe, keeping beneath cover as much as he possibly could. At last he reached a small hemlock tree. Peeping out from under its branches, he could see Redtail's old nest clearly. Right away he noticed that it had grown bigger since his last visit.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Suddenly, a whole chorus of hungry cries rang from the nest. Peter looked up and saw Mrs. Redtail approaching with a Mouse held in her claws. From where he sat, he could also see four funny little heads stretching above the edge of the nest to meet her.
        - id: ch01-b38
          speaker: peter_rabbit
          text: >-
            Redtail is using the old nest again, and he already has a family. This is no place for me. The sooner I leave, the better.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Just then Redtail himself dropped out of the blue, blue sky and landed in a nearby tree. Leaving now was impossible. Peter decided the best thing he could do was sit perfectly still where he was. His hiding place gave him a splendid view of Redtail, and in spite of his danger, Peter could not help admiring this great member of the Hawk family.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Redtail's upper coat was dark grayish-brown, mixed here and there with touches of chestnut. The top of his breast was streaked with grayish-brown and buff, while the lower part had only a few streaks. Below those were black spots and bars that ended in white. But Peter noticed the tail most of all. It was a rich reddish-brown, with a narrow black band near the end and a white tip. One look at it told Peter exactly why this great Hawk was called Redtail.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Peter did not dare steal away until both Redtail and Mrs. Redtail had gone in search of more food for their hungry youngsters. As soon as he felt it was safe to move, he headed home as fast as his legs could carry him, lipperty-lipperty-lip. He knew he would not feel safe until that lonely corner of the Green Forest lay far behind him.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The truth was that Peter had less reason to worry about Redtail than he would have had with some other Hawks. Redtail and his wife do sometimes catch one of their feathered or furry neighbors, and now and then they take a chicken. Even so, they do far more good than harm.
