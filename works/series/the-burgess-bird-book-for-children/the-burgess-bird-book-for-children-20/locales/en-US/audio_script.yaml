audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and cheerfully impulsive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    plunger_osprey:
      display_name: Plunger the Osprey
      tts:
        delivery: proud, forceful, and fiercely determined
        timbre: strong and rasping
        pace: brisk
        pitch: medium
    king_eagle:
      display_name: King Eagle
      tts:
        delivery: commanding, fierce, and unyielding
