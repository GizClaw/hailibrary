  chapters:
    - id: ch01
      title: Plunger Goes Fishing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit was curious, and he had what people call a wandering foot. He simply loved to roam. One morning that wandering foot carried him over to the bank of the Big River. Bushes grew thickly there, among tall grass, weeds, and tangled vines, so Peter felt quite safe. He liked to sit and gaze across the water. Where did all that water come from? Where was it going? And what kept it moving along?
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter was wondering about those very things when he glanced up into the blue, blue sky. A broad-winged bird was sailing overhead in wide, graceful circles. Peter crouched lower in his hiding place at once. He knew that bird belonged to the Hawk family. Experience had taught him that when a hook-billed, hook-clawed bird was nearby, the safest place for a Rabbit was out of sight.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Flat against the ground, Peter kept his eyes on the great bird circling high above the Big River. All at once, the stranger stopped moving forward. For a moment he seemed to hang in one place, beating his broad wings rapidly. Then he folded them and plunged straight toward the river. He struck the water with a tremendous splash and disappeared. Peter sat up as tall as he could to get a better look.
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            Why, that's Plunger the Osprey out fishing! He won't hurt me.
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            Plunger rose from the river, flapping his great wings. Peter looked eagerly at his curved claws, but they were empty. Perhaps the fish had been too deep. Perhaps it had seen Plunger and darted away just in time.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter could see Plunger splendidly now. He was a little bigger than Redtail the Hawk. His back was dark brown, while white marked his head and neck. Several narrow, dark bands crossed his grayish tail, and its tip was white. His underparts were white too, with light brown spots on his breast. Best of all, Peter could clearly see the huge, curved claws that served as Plunger's fishhooks.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Plunger climbed in a spiral, higher and higher, until he was far up in the blue. Then he spread his wings and sailed in wide circles once more. Before long he paused and dropped toward the water again. This time, just before he reached it, he opened his wings so quickly that only his feet got wet. Another fish had escaped.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Plunger did not seem discouraged at all. He was a true fisherman, and a true fisherman knows how to wait. Once more he climbed in great circles. Soon he was so high that Peter wondered how any bird could see a fish so far below. Peter did not know that looking down into water is easier from high above than from close beside it. He also did not know that few eyes are more wonderful than the eyes of the Hawk family. And Plunger the Osprey was a Hawk, though he was usually called the Fish Hawk.
    - id: ch02
      title: A Robber in the Air
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            For the third time, Plunger shot downward. As he had on his first try, he hit the river with a great splash and vanished beneath the surface. A moment later he came up again. Water flew from him in a silver spray as his wings beat heavily. This time a large, shining fish was gripped in his claws.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The fish was heavy. Peter could tell by the way Plunger flew. The Osprey turned toward a tall tree on the far bank of the Big River, ready to eat his breakfast there. He had not gone halfway when a harsh scream startled Peter.
        - id: ch02-b03
          speaker: narrator
          text: >-
            A huge bird with magnificent broad wings was swinging in tight circles around Plunger. His body and wings were dark brown, but his head and tail were snowy white. His powerful hooked bill was yellow, and so were his legs. Peter knew him instantly. No one could mistake King Eagle, often called Bald Head, even though his head was not bald at all.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Peter stared so hard that his eyes seemed ready to pop out. King Eagle was plainly after Plunger, and Peter could not understand why. He could hear the Eagle screaming, but he did not know what the screams meant. Plunger understood every word.
        - id: ch02-b05
          speaker: king_eagle
          text: >-
            Let go of that fish! Drop it now!
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            Plunger had no intention of giving up his catch if he could prevent it. The fish belonged to him. He had caught it himself, and he would not surrender it to a robber in the air, not even to King Eagle, unless he had no choice. He dodged, twisted, and turned as he climbed higher and higher.
        - id: ch02-b07
          speaker: plunger_osprey
          text: >-
            You robber! You thief! I won't let go! I caught this fish, and it belongs to me!
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            That heavy fish slowed Plunger down. He could not fly as swiftly or easily as he could with empty claws. Still he climbed. King Eagle climbed with him, circling close, screaming harshly, and threatening to strike with his cruel, curved claws. Peter grew so excited that he danced in place.
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            Oh, I hope Plunger gets away from that great robber! King of the air or not, a robber is exactly what he is.
        - id: ch02-b10
          speaker: narrator
          text: >-
            By then, Plunger and King Eagle were high above the Big River. King Eagle suddenly swept over Plunger and seemed to hang there. He held himself just as Plunger had done before diving after the fish. His next scream sounded fiercer than ever. Had Peter been close enough, he would have seen anger and determination in those sharp yellow eyes.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Plunger saw that look and knew exactly what it meant. King Eagle would allow no more delay. With one cry full of anger and bitter disappointment, Plunger opened his claws and let the big fish go.
    - id: ch03
      title: Plunger Tries Again
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Down fell the fish, flashing in the sunlight like a bar of silver. King Eagle partly folded his wings and dropped after it like a thunderbolt. Just before the fish reached the water, his great claws closed around it.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The Eagle spread his broad wings and tail to stop his fall. Then he carried the stolen fish in triumph to the very tree Plunger had been flying toward. There he ate his breakfast at his leisure. He seemed to enjoy it every bit as much as if he had caught it honestly.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Poor Plunger shook himself and screamed angrily once or twice. Then he seemed to decide that the wisest thing was to make the best of what had happened. After all, there were other fish in the river. He spread his wings and began circling over the Big River again, watching for one near the surface.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Peter stayed there until Plunger caught another fish and carried it away in triumph. King Eagle watched too. But now that he had eaten a good breakfast, he was willing to leave Plunger in peace and let him keep his catch.
    - id: ch04
      title: What Jenny Wren Knows
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Late that afternoon, Peter went to the Old Orchard. He simply had to tell Jenny Wren everything he had seen that morning.
        - id: ch04-b02
          speaker: jenny_wren
          text: >-
            King Eagle is called king only because he's so big, fierce, and strong. There is nothing kingly about the way he lives. He never thinks twice about robbing anyone smaller than he is. You saw him do it to Plunger.
        - id: ch04-b03
          speaker: jenny_wren
          text: >-
            He is very fond of fish. Once in a while, when Plunger isn't nearby for him to rob, he catches one himself. But he isn't much of a fisherman. He isn't particular about his meals, either. Plunger eats only the fresh fish he catches for himself. King Eagle will eat a dead fish he finds on the shore, and he doesn't seem to care how long it has been lying there.
        - id: ch04-b04
          speaker: peter_rabbit
          text: >-
            Does he eat nothing except fish?
        - id: ch04-b05
          speaker: narrator
          text: >-
            Peter asked the question quite innocently. Jenny's eyes began to twinkle.
        - id: ch04-b06
          speaker: jenny_wren
          text: >-
            If I were you, Peter, I wouldn't run across the Green Meadows while King Eagle could see me. I've heard that he likes Rabbit very much. In fact, he likes fresh meat of almost any kind. When he gets the chance, he even catches the babies of Lightfoot the Deer.
        - id: ch04-b07
          speaker: jenny_wren
          text: >-
            King Eagle flies so swiftly that even the Duck family fears him. A fat Duck is one of his favorite meals. Why, not even Honker the Goose is safe. He may be called king, but he rules by making others afraid. He is nothing but a white-headed old robber.
        - id: ch04-b08
          speaker: jenny_wren
          text: >-
            Still, I can say one good thing about him. He chooses one mate for life, and he stays loyal and true to her for as long as she lives. That can be a great many years.
        - id: ch04-b09
          speaker: jenny_wren
          text: >-
            And Peter, did you know that his mate is bigger than he is? Young Eagles are bigger than their parents during their first year away from the nest, and their heads aren't white. By the time their heads turn white, they are the same size as their parents.
        - id: ch04-b10
          speaker: peter_rabbit
          text: >-
            That sounds very strange. It's hard to believe.
        - id: ch04-b11
          speaker: jenny_wren
          text: >-
            Strange or not, it's true, whether you believe it or you don't.
        - id: ch04-b12
          speaker: narrator
          text: >-
            With that, Jenny Wren whisked out of sight into her home.
