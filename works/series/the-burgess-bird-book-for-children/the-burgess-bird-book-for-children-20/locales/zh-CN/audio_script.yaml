audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    plunger_osprey:
      display_name: 鹗猛扎
      tts:
        delivery: 骄傲强悍，遇到争夺时坚决而愤怒
        timbre: 粗粝有力
        pace: 明快
        pitch: 中音
    king_eagle:
      display_name: 鹰王
      tts:
        delivery: 威严强横，不容违抗
        timbre: 宽厚锐利
        pace: 沉稳
        pitch: 中低音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
  chapters:
    - id: ch01
      title: 猛扎捕鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得天生好奇，还有一双闲不住的脚，最喜欢到处走走看看。这天，他一路跑到了大河岸边。岸上长满灌木、高草和野草，藤蔓也缠得到处都是，正好能把彼得遮得严严实实。他觉得十分安全，便坐下来望着河水出神。他想知道，这么多水究竟从哪儿来，又要流到哪儿去，到底是什么推着它们一直向前。
        - id: ch01-b02
          speaker: narrator
          text: >-
            正想着，彼得抬头看了看湛蓝的天空。一只大鸟正在高处盘旋，宽阔的翅膀稳稳张开，一圈接着一圈，飞得从容又漂亮。彼得立刻伏低身子。他认得出来，那是鹰家族的一员。过去的经历早已教会他，只要附近出现这种弯嘴钩爪的鸟，最安全的办法就是躲好，千万别让对方瞧见。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得紧贴着地面，两眼一眨不眨地盯着那只鸟。大鸟忽然不再往前飞，只顾飞快拍动巨翼，看上去像是悬在半空。紧接着，他收起翅膀，呼地直冲河面，随着一大片水花消失在河里。彼得马上坐直身子，伸长脖子想看清楚。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 原来是鹗猛扎在捕鱼！那我就不用怕了。
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            猛扎拍动巨翼，从水里升了起来。彼得赶紧看向他的爪子，可里面什么也没有。也许那条鱼藏得太深，也许它及时发现猛扎，抢先逃掉了。现在彼得倒能好好看一看这位渔夫。他比红尾鹰略大，背部深褐，头颈间带着白羽。灰色的尾巴上横着几道窄窄的深色条纹，末端却是白的。身体下面同样雪白，只有胸口点着浅褐色斑点。最显眼的，还是那双弯曲的大爪子。那正是猛扎捕鱼用的鱼钩。
        - id: ch01-b06
          speaker: narrator
          text: >-
            猛扎盘旋着越升越高，到了蓝天深处，又张开翅膀绕起大圈。没过多久，他再次停住，朝河面直冲下来。可就在快碰到水时，他猛地展开巨翼，连身子都没有入水，最后只把双脚弄湿。第二条鱼也逃走了。
        - id: ch01-b07
          speaker: narrator
          text: >-
            猛扎一点儿也不灰心。真正的渔夫总有耐心。他重新盘旋上升，飞得那么高，彼得都不明白他怎么还能看见水里的鱼。彼得哪里知道，从高处往下看，反而比贴近水面看得更清楚。鹰家族又有一双世上少见的好眼睛。鹗猛扎也属于鹰家族，只不过大家更常叫他鱼鹰。
    - id: ch02
      title: 空中的强盗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            猛扎第三次冲向河面。这一回，他像第一次那样，轰然撞进水里，整只鸟都不见了。转眼间，他又冒出水面，吃力地拍着翅膀。满身河水被抖成银亮的飞沫，而那双大爪子里，终于牢牢抓住了一条闪闪发光的大鱼。
        - id: ch02-b02
          speaker: narrator
          text: >-
            那条鱼很沉，猛扎飞行的样子一看便知。他朝大河对岸的一棵高树飞去，准备在那里享用早餐。可还没飞到一半，一声刺耳的尖叫突然响起，把彼得吓了一跳。
        - id: ch02-b03
          speaker: narrator
          text: >-
            彼得抬头一瞧，另一只巨大的鸟正张着非凡的宽翼，绕着猛扎兜出一个个小圈。他的身躯和翅膀呈深褐色，头和尾巴却像雪一样白。大钩嘴金黄金黄，两条腿也是黄色。彼得立刻认出了他。这是鹰王，大家也叫他秃头，尽管他的脑袋根本不秃。
        - id: ch02-b04
          speaker: narrator
          text: >-
            彼得瞪大眼睛，眼珠子都快掉出来了。谁都看得出鹰王是在追赶猛扎，可彼得怎么也弄不明白原因。他听见鹰王不断尖叫，却听不懂叫声的意思。猛扎可听得一清二楚。
        - id: ch02-b05
          speaker: king_eagle
          text: 把鱼扔下！马上把那条鱼扔下来！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            只要还有一丝办法，猛扎就不肯放弃。这条鱼明明是他亲手捉到的，凭什么交给一个空中强盗？哪怕追来的是鹰王本人，他也要坚持到实在无路可走。猛扎一会儿躲闪，一会儿拧身，一会儿急转，拼命朝更高处飞去。
        - id: ch02-b07
          speaker: plunger_osprey
          text: 你这个强盗！小偷！我绝不扔下它！鱼是我捉的，它是我的！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            可爪子里的鱼太沉了。猛扎没办法像空着爪子时那样飞得又快又轻松。他不停向上飞，鹰王也一路跟上，在四周盘旋、厉声尖叫，还一次次伸出巨大凶狠的弯爪威胁他。彼得看得激动极了，在地上跳个不停。
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            但愿猛扎能逃过那个大强盗！就算大家叫他空中之王，他也还是一个强盗。
        - id: ch02-b10
          speaker: narrator
          text: >-
            两只鸟越飞越高，已经升到了大河上方的高空。鹰王忽然兜到猛扎头顶，也像猛扎捕鱼前那样悬停在那里。接下来的一声尖叫，比先前任何一声都要凶狠。彼得离得太远，没看见那双锐利的黄眼睛里装满怒火和决绝，猛扎却看见了。
        - id: ch02-b11
          speaker: narrator
          text: >-
            猛扎立刻明白，鹰王已经不许他再拖延下去。他又愤怒又失望，发出一声悲愤的尖叫，终于松开爪子，让那条大鱼掉了下去。
    - id: ch03
      title: 失鱼之后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            大鱼一路向下坠，在阳光里闪得像一根银条。鹰王半收双翼，如雷霆一般追了下去。就在鱼快要落进河里时，他伸出巨爪，一把将它抓住。
        - id: ch03-b02
          speaker: narrator
          text: >-
            鹰王随即张开宽翼和尾巴，止住下坠，得意扬扬地飞到猛扎原本要去的那棵树上。他在那里不慌不忙地吃起早餐，瞧上去津津有味，仿佛这条鱼是他凭真本事捉来的。
        - id: ch03-b03
          speaker: narrator
          text: >-
            可怜的猛扎抖了抖身子，又气恼地冲着空中尖叫了一两声。随后，他似乎决定不再跟这件倒霉事纠缠。河里又不是只有一条鱼，还是接受眼前的结果最明智。于是，他重新在大河上空绕圈滑翔，耐心寻找靠近水面的鱼。
        - id: ch03-b04
          speaker: narrator
          text: >-
            彼得一直留下来看着，直到猛扎又捉到一条鱼，带着收获扬扬得意地飞走。鹰王也看见了。不过，他已经吃过一顿饱饱的早餐，这回总算肯让猛扎安安静静地享用自己的鱼了。
    - id: ch04
      title: 珍妮眼中的鹰王
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            那天下午晚些时候，彼得跑到了老果园。他实在忍不住，非要把早晨亲眼见到的一切全都讲给鹪鹩珍妮听。
        - id: ch04-b02
          speaker: jenny_wren
          text: >-
            鹰王能被叫作王，只因为他长得大、性情凶、力气又强。他平日里的做派可一点儿也不像个王。只要对方比他弱小，他抢起来从来不会犹豫。你刚刚不是亲眼看见他抢猛扎了吗？
        - id: ch04-b03
          speaker: jenny_wren
          text: >-
            他特别爱吃鱼。偶尔猛扎不在附近，没东西可抢，他才会自己动手捉一条。可他的捕鱼本领实在不怎么样，吃鱼倒是一点儿也不挑。猛扎只吃自己刚捉到的新鲜鱼。鹰王呢，岸边捡到的死鱼也照吃不误，而且那条鱼死了多久，他好像根本不在乎。
        - id: ch04-b04
          speaker: peter_rabbit
          text: 难道他只吃鱼，别的什么都不吃吗？
        - id: ch04-b05
          speaker: narrator
          text: 彼得问得十分天真。珍妮眼里立刻闪起顽皮的光。
        - id: ch04-b06
          speaker: jenny_wren
          text: >-
            彼得，我劝你可别当着鹰王的面跑过绿草地。听说他很爱吃兔子呢。其实，只要是新鲜的肉，他什么都喜欢。只要有机会，他连轻蹄鹿家的小宝宝也会抓走。
        - id: ch04-b07
          speaker: jenny_wren
          text: >-
            他飞得太快，连鸭家族都怕他，肥鸭子更是他最爱吃的东西。就连大雁洪克，也未必逃得过他的利爪。他也许是个王，可他只会让大家害怕，靠恐惧来统治。他根本就是个白头老强盗。
        - id: ch04-b08
          speaker: jenny_wren
          text: >-
            不过，要说他的好处，倒也能找出一样。他一生只选一个伴侣。只要妻子还活着，他就始终忠诚地陪着她，而她能活上很多很多年。
        - id: ch04-b09
          speaker: jenny_wren
          text: >-
            对了，彼得，你知道鹰王的妻子比他还大吗？小鹰离开巢以后的第一年，个头甚至比父母更大，脑袋也不是白色。等他们的头变白，身体就会变得跟父母一样大了。
        - id: ch04-b10
          speaker: peter_rabbit
          text: 这也太奇怪了，真叫人难以相信。
        - id: ch04-b11
          speaker: jenny_wren
          text: 奇怪是奇怪，可它就是事实。你信也好，不信也好，事实都不会变。
        - id: ch04-b12
          speaker: narrator
          text: 珍妮说完，一转身钻进自己的家，眨眼就不见了。
