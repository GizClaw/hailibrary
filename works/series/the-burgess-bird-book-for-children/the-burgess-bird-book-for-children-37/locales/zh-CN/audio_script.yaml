audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    tommy_tit:
      display_name: 山雀汤米
      tts:
        delivery: 快活亲切，谈起本领时自信又风趣
        timbre: 清脆圆润，带悦耳的喉音
        pace: 轻快灵活
        pitch: 高音
  chapters:
    - id: ch01
      title: 夏去秋来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            漫长的夏天里，兔子彼得一直留心观察那些长羽毛的朋友，也知道了许多从前压根儿没有想到过的事。他看着鸟儿们捉去老果园树上的害虫，在农夫布朗的菜园里忙碌，还到处啄食数也数不清的杂草种子。彼得渐渐明白，羽族伙伴肩负着多么了不起的使命。正是有了他们，大千世界才这样美丽，才成了值得生活的地方。
        - id: ch01-b02
          speaker: narrator
          text: >-
            彼得看着鸟宝宝学习飞翔，又学习自己寻找食物，不知开怀大笑过多少回。整个夏天，他们都在彼得身边上学。他们要学着提防危险，学着善用眼睛和耳朵，还得学会一只鸟若想平安长大，就非懂不可的种种本领。
        - id: ch01-b03
          speaker: narrator
          text: >-
            秋天临近，朋友们开始结成鸟群，成群结队地四处游荡。这是夏天快要结束的最早征兆之一，彼得心里不免泛起淡淡的伤感。唱歌的季节已经过去，如今已经很少听见歌声。那些衣着最美的羽族朋友中，有许多也脱下华服，换上朴素的旅行装，准备长途飞到遥远的南方过冬。有几位刚换好衣裳时，彼得甚至没认出来。
        - id: ch01-b04
          speaker: narrator
          text: >-
            九月来了，白昼一天天变短。彼得的一些朋友向他告别，就要踏上漫长的旅程。他们多半打算不慌不忙，一程一程地走。每天都有几位悄然离开。彼得想到前路上的种种危险，总担心以后还能不能再见到他们。知更鸟迎客夫妇、蓝鸲知心夫妇，还有歌带鹀小朋友和妻子，一直留到初霜杰克来访以后。可渐渐地，连他们也不得不走了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            要不是旧友离去时，另一些朋友也从遥远的北方赶来，彼得这些日子准会过得又伤心又寂寞。他们整个夏天都在北方安家，有的只在南下途中停留几天，有的却要留下过冬。彼得忙着四处寻找他们，欢迎他们，日子一下又充实起来。
    - id: ch02
      title: 山雀汤米的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            还有少数老朋友一年四季都在这里。冠蓝鸦萨米、啄木鸟唐尼和海里都不走，还有彼得打心眼里喜欢的山雀汤米。
        - id: ch02-b02
          speaker: narrator
          text: >-
            春天时，汤米没有飞往北方，而是把家安在老果园附近。彼得没找到那个家，整个夏天只瞥见过他一两回。如今，照料家庭的种种操心事都结束了，一大群孩子也妥妥当当地开始独立生活。汤米和山雀太太不再守着那座筑在空心桦树桩里的温暖小屋。他们整日东飞飞，西转转，把欢乐撒得到处都是。彼得每回来到老果园都能遇见汤米，而汤米总乐意跟他聊几句开心话。没过多久，彼得就不再想念鹪鹩珍妮了。
        - id: ch02-b03
          speaker: narrator
          text: 一天，汤米头朝下攀在细枝上，正在啄取枝条底面的微小虫卵。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 汤米，你不怕冬天吗？
        - id: ch02-b05
          speaker: tommy_tit
          text: >-
            一点儿也不怕。我喜欢冬天，也喜欢冷天气。冷风一吹，从爪尖到嘴尖都舒坦极了。大多数鸟儿非得走那么远的路，我却不用，想想就觉得庆幸。彼得，我很久以前发现了一个秘密。你想听吗？
        - id: ch02-b06
          speaker: peter_rabbit
          text: 快说吧，汤米！你明知道我最爱听秘密了。
        - id: ch02-b07
          speaker: tommy_tit
          text: 那好，秘密就是，只要填饱肚皮，就能让脚趾头暖和。
        - id: ch02-b08
          speaker: narrator
          text: 彼得听糊涂了。
        - id: ch02-b09
          speaker: peter_rabbit
          text: 我……我实在不明白。你的肚皮跟脚趾头有什么关系？
        - id: ch02-b10
          speaker: narrator
          text: 汤米从喉咙里发出一串悦耳的轻笑。
        - id: ch02-b11
          speaker: tommy_tit
          text: >-
            嘀，嘀，嘀！我的意思是，只要有足够的东西吃，就能把寒气挡在外面。只要肯睁大眼睛去找，又不怕费点儿力气，总能找到不少吃的，至少我能。只有树上结满冰的时候，我才真正发愁。幸好农夫布朗家的男孩想得周到，会在树上挂一块板油给我。要不然，我准会比现在更怕那些冰暴。就像我刚才说的，食物充足，身上就暖和。
    - id: ch03
      title: 树木警察
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: 我还以为，是你身上的羽毛大衣替你保暖呢。
        - id: ch03-b02
          speaker: tommy_tit
          text: >-
            哦，羽毛当然有用。食物先在身体里生出热来，暖和的外衣再把热气留在身体里。可是，身体得先有热气才行，不然羽毛再厚也没有用。你自己不也一样吗，彼得？冬天里要是吃不饱，你从来不会真正暖和起来。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 这倒是真的，我以前碰巧从来没有想到过。可就算这样，我还是不明白，冬天树都秃了，你怎么能在树上找到足够的食物呢？
        - id: ch03-b04
          speaker: tommy_tit
          text: >-
            嘀嘀，嘀嘀，小山雀！这件事情交给我！兔子彼得，你现在总该知道，各种各样的虫子都会把卵产在树枝和树干上。要不是有我，那些卵会在那里待上一整个冬天，到了春天，就孵出蚜虫和蠕虫来。有时候，我一天就能找到并吃掉将近五百颗绿色小蚜虫的卵。春夏两季，那些小东西会惹出多大的祸呀！
        - id: ch03-b05
          speaker: tommy_tit
          text: >-
            树皮底下还藏着钻洞的小虫，另有些虫子会躲进树皮的小裂缝里，一睡就是整个冬天。哦，冬天里我有的是活儿可干。我是树木警察中的一员。啄木鸟唐尼和海里、褐旋木雀嘶嘶，还有䴓喳喳，也都是树木警察。要是我们整个冬天不留在这里认真当差，真不知道老果园会变成什么样子。
        - id: ch03-b06
          speaker: narrator
          text: >-
            汤米仍旧头朝下挂在细枝上，一颗颗啄食枝条底面的微小虫卵。身子朝上还是倒挂着，对他似乎毫无分别。他像一小团会动的黑白羽毛，只比鹪鹩珍妮大一点点。头顶、后颈和胸前乌黑发亮，头部和颈部两侧洁白，背部是灰白色，两胁泛着柔和的乳黄褐色，翅膀和尾羽都镶着白边。那张小嘴乌黑，两颗黑亮的小眼睛炯炯有神，闪烁不停，看着就叫人欢喜。
        - id: ch03-b07
          speaker: narrator
          text: >-
            彼得所有的朋友中，再没有谁比山雀汤米更快活。不管天气怎样，他身上的欢笑和幸福总会不停地咕嘟咕嘟冒出来。他是每个人的朋友，也仿佛认定每个人都是他的朋友。
    - id: ch04
      title: 春天的求爱呼唤
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: 有些鸟儿一年里别的时候从不唱歌，到了春天却会唱起来。汤米，你也有春天唱的歌吗？
        - id: ch04-b02
          speaker: tommy_tit
          text: >-
            唔，我不知道你会不会把它叫作歌。大概不会吧。不过到了春天，我会发出一声小小的求爱呼唤。听起来是这样，菲——比！菲——比！
        - id: ch04-b03
          speaker: narrator
          text: 那确实是彼得听过的最轻柔、最甜美的小哨声。汤米说它是求爱呼唤，实在再恰当不过。
        - id: ch04-b04
          speaker: peter_rabbit
          text: >-
            原来是你！春天里我常常听见这个声音，却一直不知道那是你的声音。你念“菲比”比那只名字就叫菲比的鸟还清楚，又比他轻柔甜美得多。我猜，这是因为你把它用口哨吹了出来。
        - id: ch04-b05
          speaker: tommy_tit
          text: >-
            我猜你猜对了。好了，我不能再聊下去啦，这些树还等着我照管。等冰雪一来，农夫布朗家的男孩准会为我挂出板油。我得让他觉得，那块板油是我靠劳动挣来的。
    - id: ch05
      title: 信任朋友
      blocks:
        - id: ch05-b01
          speaker: tommy_tit
          text: >-
            我一点儿也不怕农夫布朗家的男孩。无论从他手里拿食物，还是从别处拿，对我来说都一样。他知道我爱吃切碎的坚果仁。去年冬天，我每天都会飞到他手上吃东西。
        - id: ch05-b02
          speaker: narrator
          text: 彼得惊讶得把眼睛瞪得滚圆。
        - id: ch05-b03
          speaker: peter_rabbit
          text: 你跟他要好到了这种地步，竟敢坐在他手上？
          emotion: surprised
        - id: ch05-b04
          speaker: narrator
          text: 汤米使劲点了点戴着黑帽子的小脑袋。
        - id: ch05-b05
          speaker: tommy_tit
          text: 当然敢。为什么不敢？要是连朋友都不肯信任，交朋友还有什么用？你越信任朋友，彼此的交情就会越深。
        - id: ch05-b06
          speaker: peter_rabbit
          text: >-
            可我还是不明白，你怎么敢这样做。我知道农夫布朗家的男孩是我们所有小动物的朋友，我也不怎么怕他。不过，我可不敢靠得那么近，让他碰到我。
        - id: ch05-b07
          speaker: tommy_tit
          text: >-
            呸！这可不是对待真正朋友的办法。彼得，你根本不知道，能够信任一位朋友，心里会有多么踏实。我觉得农夫布朗家的男孩是我最好的朋友之一。真希望还有更多男孩女孩能像他一样。
