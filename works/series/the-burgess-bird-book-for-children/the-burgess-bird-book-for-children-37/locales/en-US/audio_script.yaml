audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, earnest, and quick to react
        timbre: warm and youthful
        pace: lively
        pitch: medium
    tommy_tit:
      display_name: Tommy Tit
      tts:
        delivery: merry, confident, and warmly conversational
        timbre: light and throaty
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Summer Lessons
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            All through the long summer, Peter Rabbit watched his feathered friends and learned things about their ways that he had never guessed. They cleared insect pests from the trees in the Old Orchard, worked in Farmer Brown's garden, and gathered countless weed seeds. Peter began to see what a wonderful part the birds played in keeping the Great World beautiful and worth living in.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He laughed heartily while the bird babies learned to fly and find food for themselves. All around him, they seemed to be going to school. They learned to watch for danger, use their eyes and ears, and master everything a bird needed to know in order to grow up.
    - id: ch02
      title: Farewells and Arrivals
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            As autumn came closer, Peter saw his friends gathering into flocks and wandering from place to place. It was one of the first signs that summer was nearly gone, and it made him a little sad. The Old Orchard had grown quieter too. He heard very few songs now because the singing season was over.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Many of the birds with the finest summer clothes had traded their bright finery for plain traveling suits. They were getting ready for the long journey to the far South, where they would spend the winter. Their new feathers changed them so much that Peter sometimes looked twice. Some were so different that he did not know them at first.
        - id: ch02-b03
          speaker: narrator
          text: >-
            September arrived, and the days grew shorter. One by one, Peter's friends said good-by and started away. Most planned to make the long journey in easy stages. Each day another bird slipped away, and when Peter thought about the dangers ahead, he wondered whether he would ever see them again.
        - id: ch02-b04
          speaker: narrator
          text: >-
            A few stayed even after Jack Frost's first visit. Welcome and Mrs. Robin lingered, along with Winsome and Mrs. Bluebird, and Little Friend the Song Sparrow and his wife. Before long, even they had to leave.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Those days would have felt very sad and lonely if new friends had not arrived as the old ones left. They came from the Far North, where they had made their summer homes. Some were only passing through and paused for a few days before continuing their journey. Others had come to stay. Peter kept busy looking for every new arrival and making each one welcome.
        - id: ch02-b06
          speaker: narrator
          text: >-
            A handful of old friends remained all year. Sammy Jay stayed. So did Downy and Hairy the Woodpeckers. And there was one more whom Peter dearly loved: Tommy Tit the Chickadee.
    - id: ch03
      title: Tommy Tit's Winter Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Tommy had not traveled north in the spring. He had built his home quite near the Old Orchard, though Peter had never found it and had caught only one or two glimpses of him. Now Tommy's household cares were over, and his good-sized family had made a proper start in life.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Tommy no longer cared about the snug little home he had made in a hollow birch stump. He and Mrs. Chickadee spent their days flitting this way and that, spreading good cheer wherever they went. Whenever Peter visited the Old Orchard, Tommy was there and ready for some merry gossip. Before long, Peter stopped missing Jenny Wren.
        - id: ch03-b03
          speaker: narrator
          text: >-
            One day, Tommy clung head downward from a twig and picked tiny insect eggs from underneath it. Peter watched him work.
        - id: ch03-b04
          speaker: peter_rabbit
          text: Don't you dread the winter, Tommy Tit?
        - id: ch03-b05
          speaker: tommy_tit
          text: >-
            Not at all! I like winter and cold weather. It makes me feel good from the tips of my claws right up to the tip of my bill. I'm glad I don't have to make the long journey that most birds do. I learned a secret a long time ago, Peter. Would you like to hear it?
        - id: ch03-b06
          speaker: peter_rabbit
          text: Please tell me, Tommy! You know how much I love secrets.
        - id: ch03-b07
          speaker: tommy_tit
          text: Here it is. Keep your stomach full, and you'll keep your toes warm.
        - id: ch03-b08
          speaker: narrator
          text: Peter looked puzzled.
        - id: ch03-b09
          speaker: peter_rabbit
          text: I don't quite understand what your stomach has to do with your toes.
        - id: ch03-b10
          speaker: narrator
          text: Tommy gave a lovely little throaty chuckle.
        - id: ch03-b11
          speaker: tommy_tit
          text: >-
            Dee, dee, dee! I mean that plenty of food keeps out the cold. If you use your eyes and don't mind a little work, you can find enough to eat. At least, I can. I only get truly worried when ice covers the trees.
        - id: ch03-b12
          speaker: tommy_tit
          text: >-
            Farmer Brown's boy is thoughtful enough to hang a piece of suet in a tree for me. Without that, I would dread those ice storms much more. Just as I said, plenty of food keeps you warm.
        - id: ch03-b13
          speaker: peter_rabbit
          text: I thought your feather coat was what kept you warm.
        - id: ch03-b14
          speaker: tommy_tit
          text: >-
            Oh, feathers help. Food makes heat, and a warm coat holds that heat inside your body. But the heat must be there first, or feathers won't do any good. It works the same way for you, Peter. You know you never feel truly warm in winter unless you have plenty to eat.
        - id: ch03-b15
          speaker: peter_rabbit
          text: >-
            That's true. I never thought about it before. Still, I don't see how you find enough food on the trees when they're bare in winter.
    - id: ch04
      title: A Policeman of the Trees
      blocks:
        - id: ch04-b01
          speaker: tommy_tit
          text: >-
            Dee, dee, Chickadee! Leave that little matter to me.
        - id: ch04-b02
          speaker: narrator
          text: Tommy chuckled before going on.
        - id: ch04-b03
          speaker: tommy_tit
          text: >-
            By now you ought to know that many kinds of bugs lay their eggs on tree trunks and twigs. Without me, those eggs would stay all winter and hatch into lice and worms in the spring. Sometimes I eat nearly five hundred eggs from those little green plant lice in a single day. They cause a great deal of harm in spring and summer.
        - id: ch04-b04
          speaker: tommy_tit
          text: >-
            There are also little worms that bore just under the bark, and other creatures sleep all winter in its tiny cracks. I search those hiding places while the trees are bare. There is plenty for me to find and plenty for me to do. I'm one of the policemen of the trees. Downy and Hairy the Woodpeckers help, and so do Seep-Seep the Brown Creeper and Yank-Yank the Nuthatch. If we didn't stay on duty all winter, I don't know what would happen to the Old Orchard.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Tommy hung upside down from the twig as he picked at the tiny eggs underneath. Whether he was right side up or head down made no difference to him. He looked like a lively little bundle of black and white feathers, not much bigger than Jenny Wren.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The top of his head, the back of his neck, and his coat shone black. His cheeks and the sides of his neck were white. His back was ash-gray, and his sides were a soft creamy buff. White edged the feathers of his wings and tail. His bill was tiny and black. His bright little black eyes snapped and twinkled in a way that was good to see.
        - id: ch04-b07
          speaker: narrator
          text: >-
            None of Peter's friends had a merrier heart than Tommy Tit. Happiness bubbled out of him in every kind of weather. He was a friend to everyone, and he seemed sure that everyone was his friend.
        - id: ch04-b08
          speaker: peter_rabbit
          text: >-
            I've noticed that some birds sing in spring even though they don't sing at any other time. Do you have a spring song, Tommy Tit?
        - id: ch04-b09
          speaker: tommy_tit
          text: >-
            Well, Peter, I don't know if you would call it a song. No, I don't think you would. But in spring I have a little love call. It sounds like this: Phoe-be! Phoe-be!
        - id: ch04-b10
          speaker: narrator
          text: >-
            It was the softest, sweetest little whistle. Tommy had been right to call it a love call.
        - id: ch04-b11
          speaker: peter_rabbit
          text: >-
            Why, I've heard that many times in spring, and I never knew it was you! You say Phoebe more clearly than the bird named Phoebe, and your call is much softer and sweeter. I suppose that's because you whistle it.
        - id: ch04-b12
          speaker: tommy_tit
          text: I suppose you're right.
    - id: ch05
      title: Trusting a Friend
      blocks:
        - id: ch05-b01
          speaker: tommy_tit
          text: >-
            Now I can't talk any longer. These trees need my attention. I want Farmer Brown's boy to know I've earned the suet I'm sure he'll put out when the snow and ice arrive. I'm not the least bit afraid of him. I would just as gladly take food from his hand as from anywhere else.
        - id: ch05-b02
          speaker: tommy_tit
          text: >-
            He knows I enjoy chopped nutmeats. Last winter, I ate from his hand every day.
        - id: ch05-b03
          speaker: narrator
          text: Peter's eyes opened very wide in surprise.
        - id: ch05-b04
          speaker: peter_rabbit
          text: >-
            Do you really mean that you and Farmer Brown's boy are such good friends that you dare to sit on his hand?
        - id: ch05-b05
          speaker: narrator
          text: Tommy nodded his little black-capped head with great energy.
        - id: ch05-b06
          speaker: tommy_tit
          text: >-
            Of course! Why shouldn't I? What is the use of having friends if you can't trust them? The more you trust them, the better friends they become.
        - id: ch05-b07
          speaker: peter_rabbit
          text: >-
            Even so, I don't understand how you dare. I know Farmer Brown's boy is a friend to all the little people, and I'm not very afraid of him myself. But I still wouldn't go close enough to let him touch me.
        - id: ch05-b08
          speaker: tommy_tit
          text: >-
            Pooh! That isn't how you show true friendship. You don't know what a comfortable feeling it is when you can trust a friend. Farmer Brown's boy is one of the best friends I have. I wish more boys and girls were like him.
