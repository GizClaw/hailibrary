  chapters:
    - id: ch01
      title: Redwing and Yellow Wing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter had come to the Smiling Pool especially to pay his respects to Redwing the Blackbird. As soon as he could leave without being rude, he said goodbye to Mrs. Teeter, who was sitting on her eggs, and to Teeter, who was still bobbing and bowing in his friendliest way. Then Peter hurried toward the place where the bulrushes grew.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Farther along the bank, someone sat at the very top of the Big Hickory-tree. From where Peter stood, the bird looked as if he were dressed entirely in black. He sang as though the whole great world held nothing but joy.
        - id: ch01-b03
          speaker: redwing
          text: Quong-ka-reee! Quong-ka-reee! Quong-ka-reee!
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: >-
            That song alone told Peter it was Redwing. No other bird had a song quite like it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The moment Redwing saw Peter, he left his high perch and flew down among the broken bulrushes. As he came, Peter caught sight of the beautiful red patch at the bend of each wing. Those patches had given Redwing his name.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter thought no one could ever mistake Redwing for another bird. Nobody else had shoulder patches as beautiful as those.
        - id: ch01-b07
          speaker: narrator
          text: Redwing came over and settled very close to Peter.
        - id: ch01-b08
          speaker: redwing
          text: What's the news, Peter Rabbit?
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            Not much, except that Teeter the Sandpiper has four eggs just a little way from here.
        - id: ch01-b10
          speaker: narrator
          text: Redwing chuckled.
        - id: ch01-b11
          speaker: redwing
          text: >-
            That's not news to me, Peter. Teeter is my neighbor. Did you think I wouldn't know where his nest is or what he's been doing? Very little happens around the Smiling Pool without my hearing about it.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter looked a little disappointed. There was nothing he liked better than being the one who brought his friends a piece of news, and Redwing had known this news already.
        - id: ch01-b13
          speaker: peter_rabbit
          text: I suppose you'll be building your own nest very soon, Redwing.
        - id: ch01-b14
          speaker: narrator
          text: Redwing gave a soft, happy, contented chuckle.
        - id: ch01-b15
          speaker: redwing
          text: No, Peter. I'm not going to build a nest.
        - id: ch01-b16
          speaker: peter_rabbit
          text: What?
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: Peter's two long ears stood straight up in astonishment. Redwing was still chuckling.
        - id: ch01-b18
          speaker: redwing
          text: >-
            No, I'm not going to build one. And here's a little secret for you. We already have four of the prettiest eggs ever laid.
        - id: ch01-b19
          speaker: narrator
          text: Peter fairly bubbled over with interest and curiosity.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            How wonderful! Where is your nest, Redwing? I'd love to see it. Mrs. Redwing must be sitting on those eggs, and that's why I haven't seen her. I should have guessed that birds who return as early as you would be among the first to make a home. Where is it? Please tell me!
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: Redwing's eyes twinkled.
        - id: ch01-b22
          speaker: redwing
          text: >-
            A secret which is known by three full soon will not a secret be. It isn't that I don't trust you, Peter. I know you wouldn't mean to let my secret slip. But you might let it out by accident. If you don't know it, you can't tell it.
        - id: ch01-b23
          speaker: mrs_redwing
          text: >-
            That's right, Redwing. I'm glad you have that much sense.
        - id: ch01-b24
          speaker: narrator
          text: Mrs. Redwing had arrived and settled close beside him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Peter couldn't help thinking that Old Mother Nature had treated Mrs. Redwing very unfairly when choosing her clothes. She was a little smaller than her handsome husband. She was such a plain, even homely, little bird that it was hard to believe she was a Blackbird at all. She wasn't black. Her feathers were grayish-brown, streaked with darker brown that looked almost black in places. She had no bright shoulder patches. In fact, she didn't have one bright feather anywhere.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter wanted to ask why she was dressed so plainly. He was too polite, so he decided to wait and ask Jenny Wren. Jenny would surely know.
        - id: ch01-b27
          speaker: peter_rabbit
          text: >-
            How do you do, Mrs. Redwing? I'm so glad to see you. I was wondering where you were. Where did you come from?
        - id: ch01-b28
          speaker: mrs_redwing
          text: >-
            Straight from my home. And though I say it myself, it's the best home we've ever had.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Redwing chuckled again. He was full of chuckles, and he had noticed Peter searching eagerly in every direction.
        - id: ch01-b30
          speaker: redwing
          text: >-
            I'll tell you this much, Peter. Our nest is somewhere in these bulrushes. If you can find it, we won't complain, even if you don't keep it secret.
        - id: ch01-b31
          speakers: [redwing, mrs_redwing]
          ensemble: duo
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: >-
            They knew Peter didn't like water. Their nest was hidden in a certain clump of brown, broken rushes, with water on every side.
        - id: ch01-b33
          speaker: narrator
          text: Without warning, Redwing shot into the air with a harsh cry.
        - id: ch01-b34
          speaker: redwing
          text: Run, Peter! Run! Reddy Fox is coming!
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: >-
            Peter didn't wait for another warning. Redwing's voice told him this was no joke. There was only one safe place nearby, an old hole that belonged to Grandfather Chuck. It ran between the roots of the Big Hickory-tree.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Peter didn't waste an instant getting there, and he was none too soon. Reddy Fox was so close behind that he pulled a few white hairs from Peter's tail as Peter plunged headfirst inside. Luckily, the opening was too small for Reddy to follow, and the tree roots kept him from digging it wider.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Peter sat for a long time in Grandfather Chuck's old house, wondering when it would be safe to come out. At first he heard Mr. and Mrs. Redwing scolding sharply. That told him Reddy was still nearby. After a while the scolding stopped. A few minutes later, Redwing began his happy song again.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Peter thought the song must mean Reddy Fox had gone away. Even so, he decided to sit there a little longer and make certain.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Peter was sitting directly beneath the Big Hickory-tree. Before long, he heard faint little noises. There were taps and scratches that sounded like claws. They seemed to come from just over his head, yet Peter knew he was alone in the hole. He couldn't make sense of it.
        - id: ch01-b40
          speaker: narrator
          text: >-
            At last Peter decided it was safe to peek outside. He pushed his head out very carefully. At that very moment, a little wood chip struck him squarely on the nose.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Peter hurriedly pulled his head back and stared at the chip lying just in front of the hole. Then two or three more chips fell. They had to be coming from somewhere above him in the Big Hickory-tree. At once, Peter's curiosity woke up, and he had to learn where they came from.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Redwing was singing so cheerfully that Peter felt sure there was no danger. He hopped outside and looked up to see where the chips had come from. Just a few feet above him was a round hole in the tree trunk.
        - id: ch01-b43
          speaker: narrator
          text: >-
            As Peter watched, a head with a long, strong bill poked through the opening. The bill held two or three little chips. Peter's heart gave a jump of glad surprise.
        - id: ch01-b44
          speaker: peter_rabbit
          text: Yellow Wing! My goodness, you startled me!
          emotion: surprised
        - id: ch01-b45
          speaker: narrator
          text: >-
            The chips dropped, and the head came farther out. Its sides and throat were a soft reddish tan. A black patch marked each side where the bill began. The top was gray, with a little band of bright red at the back. Peter couldn't mistake that head. It belonged to Yellow Wing the Flicker.
        - id: ch01-b46
          speaker: yellow_wing
          text: Hello, Peter! What are you doing here?
        - id: ch01-b47
          speaker: narrator
          text: Yellow Wing's eyes twinkled.
        - id: ch01-b48
          speaker: peter_rabbit
          text: >-
            Nothing. But I want to know what you're doing. Why are all those chips falling down?
        - id: ch01-b49
          speaker: yellow_wing
          text: >-
            I'm putting this old house of mine in order. It wasn't deep enough for me, so I'm making it deeper. Mrs. Yellow Wing and I couldn't find another house we liked. We've decided to live here again this year.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Yellow Wing came all the way out and flew down beside Peter. When he opened his wings, Peter saw beautiful golden-yellow feathers underneath. The undersides of his tail feathers were golden-yellow too. A broad black collar crossed his throat. From there to his tail, his body was dotted with black. Above his tail, the upper part of his body was pure white.
        - id: ch01-b51
          speaker: peter_rabbit
          text: >-
            My, you're a handsome fellow! I never knew before just how handsome you are.
          emotion: surprised
        - id: ch01-b52
          speaker: narrator
          text: Yellow Wing looked pleased. Perhaps Peter's praise had flattered him a little.
        - id: ch01-b53
          speaker: yellow_wing
          text: >-
            I'm glad you think so, Peter. I'm rather proud of my suit myself. I wouldn't trade coats with anyone else in my family.
        - id: ch01-b54
          speaker: narrator
          text: A sudden question came into Peter's mind.
        - id: ch01-b55
          speaker: peter_rabbit
          text: What family do you belong to?
        - id: ch01-b56
          speaker: narrator
          text: Peter asked the question abruptly.
        - id: ch01-b57
          speaker: yellow_wing
          text: The Woodpecker family.
