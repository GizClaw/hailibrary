audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    redwing:
      display_name: 红翼黑鹂
      tts:
        delivery: 快活自信，笑意里带着机灵
        timbre: 洪亮清澈
        pace: 明快
        pitch: 中高音
    mrs_redwing:
      display_name: 红翼太太
      tts:
        delivery: 端庄温和，话里透着聪慧
        timbre: 柔和清晰
        pace: 从容
        pitch: 中音
    yellow_wing:
      display_name: 黄翼扑动鴷
      tts:
        delivery: 爽朗友善，带着朴实的自豪
        timbre: 清亮结实
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十章　红翼和黄翼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            彼得来到微笑池，本来就是要拜访红翼黑鹂的。他陪坐在蛋上的跷跷太太说了一会儿话，又看着跷跷亲热地连连点头鞠躬。等到告辞不算失礼了，彼得才离开他们，匆匆奔向香蒲生长的地方。沿着微笑池岸再往前一点儿，长着一棵大山核桃树。高高的树梢上坐着一个远看浑身乌黑的家伙。他放开嗓子唱着，唱得那么欢，仿佛偌大的世界里除了快乐，什么也没有。
        - id: ch01-b02
          speaker: redwing
          text: 匡——卡——哩！匡——卡——哩！匡——卡——哩！
        - id: ch01-b03
          speaker: narrator
          text: >-
            这种歌声独一无二，彼得单凭歌声就知道是红翼。红翼也看见了他，立刻飞离高高的栖枝，落进一片倒伏的香蒲中。飞翔时，他两边翅膀弯上的红斑一下子亮了出来，那正是红翼这个名字的来历。彼得心想，再没有别的鸟长着这样漂亮的肩斑，谁也不会把他错认成别人。
        - id: ch01-b04
          speaker: redwing
          text: 兔子彼得，今天带来了什么新鲜消息？
        - id: ch01-b05
          speaker: narrator
          text: 红翼飞过来，挨着彼得坐下。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 也没什么大事。就是跷跷斑腹矶鹬有了四枚蛋，离这里不远。
        - id: ch01-b07
          speaker: narrator
          text: 红翼听完，咯咯地笑了。
        - id: ch01-b08
          speaker: redwing
          text: >-
            彼得，这哪算新闻呀？我就住在跷跷隔壁，怎么会不知道他的巢在哪儿，也不知道他家里的事呢？微笑池周围发生的事情，很少有能瞒过我的。
        - id: ch01-b09
          speaker: narrator
          text: 彼得最爱把新闻告诉别人。见红翼早就知道了，他难免有些失望，不过开口时仍旧客客气气。
        - id: ch01-b10
          speaker: peter_rabbit
          text: 红翼，我想你自己也快要筑巢了吧？
        - id: ch01-b11
          speaker: narrator
          text: 红翼轻轻笑了。这一声笑又快活，又满足。
        - id: ch01-b12
          speaker: redwing
          text: 不，彼得，我不打算筑巢。
        - id: ch01-b13
          speaker: peter_rabbit
          text: 什么？
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: 彼得惊得两只长耳朵一下子竖得笔直。
        - id: ch01-b15
          speaker: redwing
          text: 我确实不用筑巢。再悄悄告诉你吧，我们已经有四枚蛋了，而且一枚比一枚漂亮。
        - id: ch01-b16
          speaker: narrator
          text: 彼得顿时兴奋得满肚子都是好奇。
        - id: ch01-b17
          speaker: peter_rabbit
          text: >-
            太棒啦！你的巢究竟在哪儿？我可太想看看了。难怪我一直没见到红翼太太，原来她正在孵蛋。我早该想到，你们回来得那么早，当然也会早早安家。快告诉我吧，红翼，巢在哪儿？
        - id: ch01-b18
          speaker: narrator
          text: 红翼的眼睛里闪过顽皮的光。
        - id: ch01-b19
          speaker: redwing
          text: 秘密若让三人知，转眼便会众人知。彼得，不是我不信你。我知道你绝不会故意说出去，可万一不留神漏了嘴呢？只要你不知道，自然就没法告诉别人。
        - id: ch01-b20
          speaker: mrs_redwing
          text: 说得对，红翼。你能想到这一层，我真高兴。
        - id: ch01-b21
          speaker: narrator
          text: >-
            说话的是红翼太太，她刚刚落到红翼身边。彼得一看见她，就觉得大自然老妈妈给她挑衣裳时实在不公平。红翼太太比英俊的丈夫还小一点儿，模样十分朴素，甚至不大好看，很难叫人相信她也是一只黑鹂。首先，她一点儿也不黑。全身都是灰褐色，上面一道道深褐色条纹，有些地方几乎发黑。她肩上没有鲜艳的红斑，身上也找不出一根亮丽的羽毛。彼得很想问问，她为什么穿得这样朴素，可他太有礼貌了，只好忍住，打算以后去问见多识广的珍妮鹪鹩。珍妮肯定会知道答案。
        - id: ch01-b22
          speaker: peter_rabbit
          text: 红翼太太，你好！见到你真高兴。我还一直在想你去了哪里。你刚从哪儿来呀？
        - id: ch01-b23
          speaker: mrs_redwing
          text: 我刚从家里来。不是我自夸，那可是我们住过的最好的家。
        - id: ch01-b24
          speaker: narrator
          text: 红翼又咯咯笑出了声。他今天似乎怎么也笑不够。原来，他早就发现彼得正急急忙忙地朝每一个方向张望，想找出那座藏起来的鸟巢。
        - id: ch01-b25
          speaker: redwing
          text: >-
            彼得，我只能告诉你这么多。我们的巢就在这片香蒲丛里的某个地方。你若真能找到，就算你不替我们保守秘密，我们也不会埋怨你。
        - id: ch01-b26
          speaker: narrator
          text: >-
            红翼笑了，红翼太太也跟着笑。他们知道彼得不喜欢水，而鸟巢藏在一丛褐色的倒伏香蒲里，四面都被水围着。忽然，红翼厉声尖叫，猛地飞上天空。
        - id: ch01-b27
          speaker: redwing
          text: 快跑，彼得！快跑！红狐雷迪来了！
          emotion: fearful
        - id: ch01-b28
          speaker: narrator
          text: >-
            彼得从红翼的声音里听出，这绝不是玩笑。他没等第二次警告就拔腿逃命。附近唯一安全的地方，是大山核桃树根之间，土拨鼠爷爷留下的一处旧洞。彼得一点时间也不敢浪费，拼命往那里冲，可还是险些没能逃掉。他刚头朝下一猛子扎进洞口，雷迪就追到了脚后跟，还从彼得尾巴上扯下几根白毛。幸好洞口太小，雷迪钻不进来。交错的树根紧紧挡在那里，他也没法把洞刨大。
        - id: ch01-b29
          speaker: narrator
          text: >-
            彼得躲在土拨鼠爷爷的旧屋里，久久不敢出去，一直猜着什么时候才能安全露面。起先，他听见红翼夫妇在外面厉声斥骂，便知道雷迪还在附近。后来斥骂声终于停了。又过了几分钟，红翼重新唱起快活的歌。
        - id: ch01-b30
          speaker: peter_rabbit
          text: 听这歌声，雷迪应该已经走了。不过我还是多等一会儿，确定安全了再出去。
        - id: ch01-b31
          speaker: narrator
          text: >-
            彼得坐的地方，正好就在大山核桃树下面。过了一阵，头顶传来细细的响动。有轻轻的敲击声，也有爪子抓挠一样的沙沙声，听起来就在他的脑袋正上方。可是彼得知道，洞里明明只有自己。那些声音究竟从哪儿来呢？他完全想不通。最后，彼得觉得外面应该安全了，便小心翼翼地把脑袋探出洞口。刚一露头，一小片木屑就不偏不倚地砸在鼻尖上。彼得连忙缩回脑袋，瞪着落在洞口前的木屑。紧接着，又有两三片掉了下来。
        - id: ch01-b32
          speaker: narrator
          text: >-
            这些小木屑一定是从大山核桃树上掉下来的，彼得的好奇心立刻被勾了起来。红翼仍旧唱得很欢，他相信附近没有危险，便跳出洞口，仰起头寻找木屑的来处。就在头顶几英尺高的树干上，他发现一个圆圆的洞。彼得正盯着洞口，一颗脑袋忽然从里面伸了出来。那张又长又结实的嘴里，还衔着两三片小木屑。彼得又惊又喜，心头猛地一跳。
        - id: ch01-b33
          speaker: peter_rabbit
          text: 黄翼！天哪，你真把我吓了一跳！
          emotion: surprised
        - id: ch01-b34
          speaker: narrator
          text: >-
            木屑落了下来，那颗脑袋探得更远了些。脸颊和喉咙是柔和的淡红褐色，嘴根两旁各有一块黑斑。灰色的头顶后面，还围着一道鲜红的小色带。彼得绝不会认错，这正是扑动鴷黄翼。他那双眼睛正闪着笑意。
        - id: ch01-b35
          speaker: yellow_wing
          text: 你好，彼得！你怎么待在这里？
        - id: ch01-b36
          speaker: peter_rabbit
          text: 我没做什么。倒是你在忙什么呢？为什么掉下来这么多木屑？
        - id: ch01-b37
          speaker: yellow_wing
          text: >-
            我在修整自己的老房子。原来挖得不够深，我住着不满意，所以要再往下挖一些。黄翼太太和我一直没找到更合适的房子，就决定今年还住在这儿。
        - id: ch01-b38
          speaker: narrator
          text: >-
            黄翼整个钻出树洞，飞到彼得身边的地上。他一张开翅膀，彼得就看见翅膀底下是漂亮的金黄色，尾羽底下也是一样。黄翼的喉咙周围像戴着一圈宽宽的黑领。从这圈黑领开始，一直到尾巴，身上点满了黑色斑点。翅膀完全展开后，尾巴上方的背部还露出一片纯白。
        - id: ch01-b39
          speaker: peter_rabbit
          text: 哎呀，你可真漂亮！我以前怎么没发现你这么神气呢？
        - id: ch01-b40
          speaker: narrator
          text: 黄翼听了这番夸奖，显得十分高兴。也许，他心里还有一点儿受宠若惊。
        - id: ch01-b41
          speaker: yellow_wing
          text: >-
            你这么说，我很高兴，彼得。我自己也很喜欢这身衣裳。整个家族里，不管哪位亲戚拿他的衣裳来，我都不肯跟他换。
        - id: ch01-b42
          speaker: narrator
          text: 彼得忽然想起一个问题，冷不丁地问了出来。
        - id: ch01-b43
          speaker: peter_rabbit
          text: 你到底属于哪个家族？
        - id: ch01-b44
          speaker: yellow_wing
          text: 我属于啄木鸟家族。
