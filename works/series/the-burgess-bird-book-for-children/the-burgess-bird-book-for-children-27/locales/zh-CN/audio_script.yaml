audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 泼辣急切，说话尖锐而有活力
        timbre: 细亮有穿透力
        pace: 快速紧凑
        pitch: 高音
    kitty_catbird:
      display_name: 灰猫嘲鸫咪咪
      tts:
        delivery: 顽皮机灵，话里常带轻松的逗趣
        timbre: 灵活而略带沙哑
        pace: 活泼
        pitch: 中音
  chapters:
    - id: ch01
      title: 华彩来到老果园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得永远忘不了第一次见到北美红雀华彩的那个早晨，有些朋友也管这种鸟叫红鸟。彼得照例来到老果园，才跳过旧石墙，就听见一声清亮悦耳的长哨。他抬头一看，苹果树梢站着一只鸟。彼得猛地停住，惊喜得吸了一口气。他揉揉眼睛，再仔细瞧了瞧，还是不敢相信。原来，就连羽族里也能有这么美的鸟。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这位陌生客从头到脚都是红色，只有嘴根围着一小圈黑色，连嘴本身也是红的。头上那顶漂亮的红冠，又给他添了几分气派。更叫人吃惊的是，他还唱得一手好歌。彼得见过不少衣裳漂亮、歌声却不怎么样的鸟，这一位可不同。他的歌和外衣一样美，而那身外衣，已经是彼得见过最美的衣裳之一了。彼得马上跑去找鹪鹩珍妮。
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            珍妮，他是谁？那个漂亮的陌生客是谁？他的歌怎么也这么好听？
          emotion: surprised
        - id: ch01-b04
          speaker: jenny_wren
          text: >-
            他是北美红雀华彩。你见过比他更俊美的鸟吗？真希望他愿意留下。我很少眼红别人的好衣裳，可见到华彩，有时连我也会羡慕。我要是红雀太太，只怕还会嫉妒呢。她也在那棵树上，你看看他们俩差得有多远。
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得赶紧去看。红雀太太没有华彩那身耀眼的红衣。她的背是棕灰色，喉咙灰里带黑，胸前是一片暗淡的浅黄褐色，只微微透着红。翅膀和尾巴也带一点暗红。总的说来，她穿得十分朴素，模样却整洁利落，又十分秀气。而且，她虽然没有一身华美的衣裳，歌声可一点也不差。事实上，她几乎能和那位俊美的丈夫唱得一样好。
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            我发现，衣裳越漂亮的人，越爱整天惦记自己的打扮。真要干点正经事，他们往往就没什么用了。
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            华彩可不是那样。他的品性跟模样一样好，还是个再称职不过的丈夫。要是他们在这里安家，你就会看见，他照料宝宝时从不偷懒，该做的事一样也不会少。他们有时一年养两窝孩子。第一窝小家伙刚能离巢，华彩就会接过去照管，好让红雀太太什么也不用操心，安安心心孵第二窝蛋。他围着孩子们忙前忙后，仿佛全世界只有这几个孩子，难怪大家都喜欢他。失陪啦，彼得，我得去问问他们是不是真要留下。
        - id: ch01-b08
          speaker: narrator
          text: >-
            珍妮回来时兴奋得一刻也停不住。
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            彼得，他们喜欢这里！只要找到合适的地方筑巢，他们就会留下。我告诉他们，这里是全世界最好的住处。他们喜欢在常青树上安家，我看，他们已经瞧中农夫布朗家附近那几棵了。哎呀，有他们做邻居，咱们这里可要增色不少！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: >-
            红雀夫妇又吹长哨，又唱歌，心里的喜悦仿佛就要满出来。彼得坐在附近，听得连别的事情都忘了。要不是一位老朋友忽然出现，他大概会在那里坐上一整个早晨。
    - id: ch02
      title: 咪咪的百变歌声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            回来的老朋友是灰猫嘲鸫咪咪。站在一身红衣的华彩旁边，他活像一个穿着朴素、规规矩矩的小贵格会教徒。咪咪几乎全身都是深深的石板灰，只有头顶和尾巴是黑色的，尾巴根部正上方还露出一块栗色斑纹。他比报春知更鸟略小一点儿。老果园里再没有谁穿着这样一身衣裳，所以谁也不会把他错认成别的鸟。
        - id: ch02-b02
          speaker: narrator
          text: >-
            彼得一见咪咪，高兴得立刻把华彩忘了，赶忙跑去欢迎老朋友。咪咪已经钻进旧石墙边的灌木丛，可他正在发出古怪的叫声，彼得根本不用费力寻找。那声音像极了黑猫咪的喵喵叫，又粗厉，又难听。难怪大家会称他为灰猫嘲鸫。
        - id: ch02-b03
          speaker: narrator
          text: >-
            彼得没有马上钻进灌木，而是满怀期待地等在外面。过了几分钟，粗厉的叫声停了。同一个地方传来另一支歌，像是从老果园每位歌手那里各取了一小段，再拼到一起。歌声虽然不响，却迷人极了。里面有华彩清亮的长哨，也有歌带鹀小朋友叮铃般的曲调。彼得还听出了其他好几位朋友的声音。除此以外，歌里也夹着南方鸟儿的曲调，那是咪咪到南方过冬时学来的。当然，其中也少不了完全属于他自己的音符。
        - id: ch02-b04
          speaker: narrator
          text: >-
            等咪咪唱完，彼得才飞快地钻进灌木。粗厉的猫叫声马上又冒了出来。听起来，咪咪不像是欢迎彼得，倒像在骂他不该来。可那只是咪咪装出来的。他满肚子都是玩笑和顽皮的念头，最爱故意逗人。
        - id: ch02-b05
          speaker: narrator
          text: >-
            彼得找到他时，咪咪把羽毛全蓬了起来，身子几乎成了一个带着脑袋和尾巴的圆球，看上去困得眼睛都快睁不开了。可一见彼得，他便收紧羽毛，学着珍妮把尾巴高高翘起，一下子变得又瘦又利落。彼得认识的鸟儿当中，谁也不会比他更精神。跟刚才那个圆球相比，他简直不像同一只鸟。
        - id: ch02-b06
          speaker: narrator
          text: >-
            紧接着，咪咪又垂下尾巴，好像再也没有力气把它举起来。尾巴笔直地挂在那里，翅膀也跟着耷拉下来。才一眨眼，他就把自己弄得邋里邋遢。可那双眼睛一直闪着顽皮的光。彼得看得明明白白，咪咪一次次变换模样，纯粹是为了逗趣和使坏。
        - id: ch02-b07
          speaker: peter_rabbit
          text: >-
            我一直在想，你到底还回不回来。羽族朋友里，我最舍不得的恐怕就是你啦！
          emotion: happy
        - id: ch02-b08
          speaker: kitty_catbird
          text: >-
            谢谢你，彼得。你这么说真叫人高兴。你见到我很开心，我能回到这里就更开心了。
          emotion: happy
        - id: ch02-b09
          speaker: peter_rabbit
          text: >-
            你在南方过得愉快吗？
        - id: ch02-b10
          speaker: kitty_catbird
          text: >-
            还不错，还不错。对了，彼得，我在那里又学了几支新歌。想听听吗？
        - id: ch02-b11
          speaker: peter_rabbit
          text: >-
            当然想。不过，你哪里还需要新歌呀？除了仿声鸟模仿家，我从没见过谁像你这样爱学别人的曲子。
        - id: ch02-b12
          speaker: narrator
          text: >-
            听见模仿家的名字，咪咪脸上掠过了一小片阴云，不过转眼就不见了。
        - id: ch02-b13
          speaker: kitty_catbird
          text: >-
            他才真叫我羡慕。我模仿别人还算不错，可模仿家比我强得多。只要好好练下去，说不定有一天，我也能像他那么出色。我在南方常见到他，那家伙的确聪明。
        - id: ch02-b14
          speaker: peter_rabbit
          text: >-
            哼，你不用羡慕他。你自己已经是个了不起的模仿高手啦。还是快让我听听，你从南方学回了什么新曲子吧。
        - id: ch02-b15
          speaker: narrator
          text: >-
            咪咪脸上的阴云散了。他鼓起喉咙，开始歌唱。那是一支真正的混合曲，一副嗓子竟然接连唱出了那么多种声音，实在叫人难以相信。彼得一直听到最后一个音符落下，心里早已准备好了下一个问题。
    - id: ch03
      title: 菜园旁的新家
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: >-
            你打算在这附近筑巢吗？
        - id: ch03-b02
          speaker: kitty_catbird
          text: >-
            当然。灰猫嘲鸫太太在路上耽搁了一两天，希望她今天就能赶到。她一来，我们马上开工。我想把家安在这片灌木丛的某个地方。幸好农夫布朗还算明白事理，没有把灌木全清掉。这正是我喜欢的筑巢地点。离他的菜园不远，老果园又紧挨着这里，这样的地方再合适不过了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            彼得听得有点儿不明白。
        - id: ch03-b04
          speaker: peter_rabbit
          text: >-
            你为什么非要住在农夫布朗的菜园附近？
        - id: ch03-b05
          speaker: kitty_catbird
          text: >-
            因为我的食物有很大一部分要去那里找呀。农夫布朗有我做邻居，应该高兴才对。我偶尔会吃一点儿果子，可我在菜园和老果园里替他捉掉那么多虫子，早就十倍还清了。我一向以自己有用为荣。彼得，活在世上，没有什么比做个有用的人更要紧。
        - id: ch03-b06
          speaker: narrator
          text: >-
            彼得点点头，像是完全同意。可是，你知道，我也知道，彼得自己除了填满那只大肚子，几乎什么也不做。
