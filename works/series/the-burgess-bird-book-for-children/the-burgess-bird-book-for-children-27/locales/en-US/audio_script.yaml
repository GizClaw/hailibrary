  chapters:
    - id: ch01
      title: A New Friend and an Old One
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit never forgot the morning he first caught sight of Glory the Cardinal, whom some called Redbird. He had come up to the Old Orchard for his usual morning visit. Just as he hopped over the old stone wall, a beautiful, clear, ringing whistle drew his eyes to the top of an apple tree. Peter stopped short and gave a little gasp of pure astonishment and delight. Then he rubbed his eyes and looked again. He could hardly believe he was seeing what he thought he saw. Until that moment, he had never imagined that anyone, even among the feathered folk, could be quite so beautiful.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The stranger was dressed in red from head to tail, except for a little black around the base of his bill. Even the bill itself was red. On his head stood a beautiful red crest that made him look more distinguished still. And how that stranger could sing! Peter had often noticed that the birds with the finest clothes sometimes had the poorest songs. Not this bird. His song was every bit as beautiful as his coat, and that coat was one of the loveliest Peter had ever seen. Of course, Peter lost no time in hunting up Jenny Wren.
        - id: ch01-b03
          speaker: peter_rabbit
          text: >-
            Jenny, who is that beautiful stranger? And where did he learn such a lovely song?
        - id: ch01-b04
          speaker: jenny_wren
          text: >-
            That's Glory the Cardinal. Isn't he the loveliest bird you ever saw? I hope he stays. I hardly ever wish for anyone else's fine clothes, but Glory can make me feel a little envious. If I were Mrs. Cardinal, I might even be jealous. She's in the same tree. Just look at the difference!
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter looked eagerly into the tree. Mrs. Cardinal was very different from her brilliant red husband. Her back was brownish gray, her throat grayish black, and her breast a quiet buff with just a faint touch of red. Dull red tinged her wings and tail. All in all, she wore very sober clothes, though she was a trim and neat little person. Her plain dress did not keep her from singing. In fact, her song was nearly as fine as her handsome husband's.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            I've noticed that people in fine clothes often spend all their time thinking about them. Then they're not much help when real work needs doing.
        - id: ch01-b07
          speaker: jenny_wren
          text: >-
            Don't think that about Glory. He's as good as he is handsome, and he's a model husband. If they settle here, you'll see him do his full share with the babies. Sometimes they raise two families. Then, as soon as the first youngsters leave the nest, Glory looks after them while Mrs. Cardinal sits on the next eggs. He fusses over those youngsters as though they were the only children anywhere. Everyone loves him. Excuse me, Peter. I'm going to ask whether they plan to stay.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Jenny soon came back so excited that she could not keep still.
        - id: ch01-b09
          speaker: jenny_wren
          text: >-
            They like it here, Peter! If they find the right place for a nest, they're staying. I told them this is the best place in the world. They like to build in evergreens, and I think they're looking at those trees near Farmer Brown's house. Oh, they'll make this neighborhood finer!
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: >-
            Mr. and Mrs. Cardinal whistled and sang as though their hearts were bursting with joy. Peter stayed nearby and listened as if he had nothing else to do in the whole world. He probably would have sat there for the rest of the morning. Then he caught sight of an old friend he dearly loved, Kitty the Catbird, and his attention turned at once.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Beside the splendid Glory, Kitty looked like a plain little Quaker. He was nearly all dark, slaty gray. The top of his head was black, and so was his tail. Right at the base of that tail was one small patch of chestnut. Kitty was a little smaller than Welcome Robin. Still, there was no danger of mistaking him for anyone else, because no other bird wore clothes quite like his.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter was so pleased to discover that Kitty had returned that he forgot all about Glory and hurried over to welcome his old friend. Kitty had vanished into the bushes along the old stone wall, but Peter had no trouble finding him. Queer cries came from his hiding place, and they sounded very much like Black Pussy the Cat saying meow. They were harsh, unpleasant sounds. Now Peter understood perfectly why the bird making them was called the Catbird.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter did not rush into the bushes. He waited outside, expecting something more. After a few minutes, the harsh cries stopped. From the very same spot came a soft, charming song that seemed to hold pieces of nearly every song in the Old Orchard. Peter heard Glory's clear whistle. He heard the sweet tinkle of Little Friend the Song Sparrow. Notes from his other friends appeared too. Among them were songs of southern birds that Kitty had learned while spending the winter in the South. And woven through them all were notes that belonged to Kitty alone.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Peter listened until the last note faded. Then he scampered into the bushes. At once Kitty broke into those harsh cries again. Anyone listening might have thought Kitty was scolding Peter for coming to see him instead of being glad. But that was simply Kitty's way. He was always brimming with fun and mischief, and pretending was one of his greatest delights.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Peter found Kitty sitting with every feather puffed out. He looked almost like a round ball with a head and tail, and his face seemed positively sleepy. The instant he caught sight of Peter, he drew every feather down tight and cocked up his tail in Jenny Wren's manner. Now he looked as slim and trim as any bird Peter knew, hardly like the same bird at all. Then he let his tail fall as though he had no strength to hold it up. It hung straight down. He dropped his wings too, and in a moment he looked thoroughly disreputable. Yet his eyes twinkled and snapped through every change. Peter knew it was all pure fun and mischief.
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            I've been wondering whether you'd come back! Of all my feathered friends, I don't think there's anyone I would miss more.
          emotion: happy
        - id: ch01-b17
          speaker: kitty_catbird
          text: >-
            Thank you, Peter. That's very kind. If you're glad to see me, I'm even happier to be home again.
          emotion: happy
        - id: ch01-b18
          speaker: peter_rabbit
          text: Did you have a pleasant winter in the South?
        - id: ch01-b19
          speaker: kitty_catbird
          text: >-
            It was pleasant enough. And Peter, I learned some new songs down there. Would you like to hear them?
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            Of course I would, though you hardly need more songs. Mocker the Mockingbird is the only fellow I know who collects as many other birds' songs as you do.
        - id: ch01-b21
          speaker: narrator
          text: >-
            At Mocker's name, a little cloud passed over Kitty's face.
        - id: ch01-b22
          speaker: kitty_catbird
          text: >-
            Now there's a bird I truly envy. I can imitate others rather well, but Mocker does it better. If I practice hard enough, perhaps I'll be as good someday. I saw him often in the South, and he really is clever.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            Huh! There's no need to envy him. You're a fine imitator yourself. Come on, what new notes did you learn in the South?
        - id: ch01-b24
          speaker: narrator
          text: >-
            The little cloud left Kitty's face. His throat swelled, and he began to sing. The song was a regular medley, tumbling from one kind of note into another. It hardly seemed possible for so many different sounds to come from one small throat. Peter listened to every one of them. When the song ended, he already had another question waiting.
        - id: ch01-b25
          speaker: peter_rabbit
          text: Are you going to build your home somewhere nearby?
        - id: ch01-b26
          speaker: kitty_catbird
          text: >-
            I certainly am. Mrs. Catbird has been delayed for a day or two, but I hope she arrives today. As soon as she does, we'll start work. I think we'll choose a place somewhere in these bushes. I'm glad Farmer Brown has the sense to let them keep growing. They are exactly the sort of shelter I like for a nest. Farmer Brown's garden is close by, and the Old Orchard is right here too. That is just the combination that suits me.
        - id: ch01-b27
          speaker: narrator
          text: Peter was not quite sure what to make of that.
        - id: ch01-b28
          speaker: peter_rabbit
          text: Why do you want to live close to Farmer Brown's garden?
        - id: ch01-b29
          speaker: kitty_catbird
          text: >-
            Because that's where I'll find a good part of my living. Farmer Brown ought to be glad to have me nearby. Once in a while I may take a little fruit, but I pay him back ten times over. Just think of all the bugs and worms I catch in his garden and throughout the Old Orchard. I take pride in making myself useful. Peter, there is nothing in this world quite like being useful.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Peter nodded as though he fully agreed. But you and I know that Peter himself did very little besides filling his own big stomach.
