audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and cheerfully impulsive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, outspoken, and sharply practical
        timbre: small and crisp
        pace: quick
        pitch: high
    zee_zee_redstart:
      display_name: Zee Zee the Redstart
      tts:
        delivery: lively, musical, and always in motion
        timbre: bright and nimble
        pace: quick
        pitch: high
    sunshine_yellow_warbler:
      display_name: Sunshine the Yellow Warbler
      tts:
        delivery: friendly, sunny, and quietly proud
        timbre: light and clear
        pace: lively
        pitch: medium-high
    mrs_sunshine:
      display_name: Mrs. Sunshine
      tts:
        delivery: warm, purposeful, and discreet
        timbre: soft and clear
        pace: brisk
