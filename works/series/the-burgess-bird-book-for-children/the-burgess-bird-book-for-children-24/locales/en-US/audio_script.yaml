  chapters:
    - id: ch01
      title: The Warblers Arrive
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Of all Peter Rabbit's feathered friends, none puzzled him more than the Warblers. One morning, the Old Orchard was alive with little birds no bigger than Jenny Wren. So many had arrived together that Peter could hardly keep track of them.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            They never stop moving, Jenny. Before I can look at one long enough to know him, another one takes his place.
        - id: ch01-b03
          speaker: narrator
          text: >-
            And restless little birds they were. Not one stayed still for a moment. They flitted from tree to tree and twig to twig, then darted into the air again. Everywhere Peter looked, wings flashed among the branches. All the while, their endless chatter mixed with quick little pieces of song.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter would fix his eyes on one bird, only to find a completely different one in the same spot. Now and then, he recognized a Warbler who would stay nearby for the whole nesting season. Most of these little travelers were only resting and feeding in the Old Orchard. After a day or two, they would continue farther north to make their summer homes.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Jenny Wren did not seem very pleased to have them there. Some wore much brighter colors than her own plain feathers, and perhaps she envied them a little. Then there was all the food they ate. The newcomers were busy catching tiny insects, and Jenny may have worried that they would leave too few for her.
        - id: ch01-b06
          speaker: jenny_wren
          text: >-
            Why do they have to stop here? They could go somewhere else instead of eating food that belongs to honest birds who stay all summer. Have you ever seen such fidgety creatures? They don't sit still for one second. Just watching them wears me out!
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            Peter could not help chuckling when he heard that. Jenny herself was one of the most restless little birds he knew, always bustling from place to place. Peter felt quite differently about the visitors. He was delighted by all the Warblers filling the orchard, even though telling one from another gave him endless trouble.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Suddenly, a bird flashed down and caught a fly almost under Peter's nose. Before Peter could catch his breath, the bird was back in a tree.
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            That's Zee Zee the Redstart! I would recognize him anywhere. Jenny, do you know who he makes me think of?
          emotion: happy
        - id: ch01-b10
          speaker: jenny_wren
          text: Who?
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            Goldy the Oriole, only Zee Zee is much, much smaller. He's black, orange-red, and white like Goldy, though he doesn't have quite as much orange.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Zee Zee sat still for just one moment and spread his tail. His head, throat, and back were black. A black band crossed the end of his tail, with another black stripe running down its middle. The rest of the tail shone bright orange-red. Each wing had an orange-red band, and his sides were the same fiery color. Underneath, he was white with a touch of orange.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A moment later, Zee Zee was off again. He darted, dived, and whirled through the air in one quick turn after another. Each twist brought him another insect too tiny for Peter to see. Peter began to wonder how such a busy bird ever stayed still long enough to sleep at night. Zee Zee's voice was every bit as busy as his wings.
        - id: ch01-b14
          speaker: zee_zee_redstart
          text: Zee, zee, zee, zee!
        - id: ch01-b15
          speaker: narrator
          text: >-
            That was only one of his many calls. Sometimes he sang a beautiful little song. At other times, he seemed to be copying the voices of other Warblers.
        - id: ch01-b16
          speaker: peter_rabbit
          text: >-
            I hope Zee Zee stays here. I could watch him all day.
          emotion: happy
        - id: ch01-b17
          speaker: jenny_wren
          text: >-
            Oh, he'll stay. I just hope he doesn't choose the Old Orchard. If he does, feeding my big family will be that much harder. He and Mrs. Redstart will probably settle along the edge of the Green Forest. They like it there, and I'm thankful for that.
        - id: ch01-b18
          speaker: jenny_wren
          text: >-
            There goes Mrs. Redstart now. Look closely, Peter. The parts of Zee Zee's coat that shine bright orange-red are yellow on her. Her head is gray instead of black, and her back is olive-green with a gray tint. She isn't nearly as handsome, but you wouldn't expect her to be. Zee Zee does the singing and showing off while she does the work.
        - id: ch01-b19
          speaker: jenny_wren
          text: >-
            I expect she'll build their nest with hardly any help from him. Still, Zee Zee is a good father. I'll give him that. He'll do his share when it is time to feed the babies.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Just then, Peter saw a bird dressed all in yellow. He was about Zee Zee's size and was flitting among the bushes beside the old stone wall.
        - id: ch01-b21
          speaker: peter_rabbit
          text: There's Sunshine!
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: >-
            Peter scampered toward the yellow bird without even stopping to say goodbye to Jenny Wren. As soon as he was close enough to talk, he called out.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            Oh, Sunshine, I'm so glad you're back! Are you and Mrs. Sunshine going to live near here? I hope I'll be able to see you every day.
          emotion: happy
        - id: ch01-b24
          speaker: sunshine_yellow_warbler
          text: >-
            Hello, Peter! I'm just as glad to see you. We certainly plan to stay if we can find the right place for our nest. It feels wonderful to be back. We've traveled so far that we don't want to go another mile if we can help it. Have you seen Sally Sly the Cowbird this spring?
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b26
          speaker: peter_rabbit
          text: Yes, I have.
        - id: ch01-b27
          speaker: sunshine_yellow_warbler
          text: >-
            I'm sorry to hear that. She caused us a great deal of trouble last year, but we outsmarted her.
        - id: ch01-b28
          speaker: peter_rabbit
          text: How did you do that?
        - id: ch01-b29
          speaker: narrator
          text: Sunshine paused to pluck a tiny worm from a leaf.
        - id: ch01-b30
          speaker: sunshine_yellow_warbler
          text: >-
            She found our nest just after we finished it, before Mrs. Sunshine had laid an egg. You know what Sally did next, don't you?
        - id: ch01-b31
          speaker: peter_rabbit
          text: >-
            I can guess. She put one of her own eggs in your nest.
        - id: ch01-b32
          speaker: narrator
          text: Sunshine picked two or three more worms from the leaves.
        - id: ch01-b33
          speaker: sunshine_yellow_warbler
          text: >-
            That's exactly what she did, the lazy, good-for-nothing creature! But it gained her nothing at all. Her egg never hatched. We fooled her once, and if she tries the same trick this year, we'll fool her again.
          emotion: angry
        - id: ch01-b34
          speaker: peter_rabbit
          text: Did you throw her egg out?
        - id: ch01-b35
          speaker: sunshine_yellow_warbler
          text: >-
            No. Our nest was too deep for us to lift it out. So we built a second floor right on top of the egg and raised the sides of the nest. After that, we made sure Sally never got another chance to leave an egg there.
        - id: ch01-b36
          speaker: peter_rabbit
          text: >-
            Then you had a real two-story nest!
          emotion: surprised
        - id: ch01-b37
          speaker: narrator
          text: Peter's eyes opened very wide. Sunshine nodded.
        - id: ch01-b38
          speaker: sunshine_yellow_warbler
          text: >-
            Yes, sir, and it was a very fine nest, too. Mrs. Sunshine and I take great pride in our nest. No babies could have a softer, cozier home than ours.
        - id: ch01-b39
          speaker: peter_rabbit
          text: What do you use to build it?
        - id: ch01-b40
          speaker: sunshine_yellow_warbler
          text: >-
            We weave it from fine grass and soft fibers from plants. We add a little hair when we can find some, along with a few feathers. Most of all, we use plenty of that nice, soft fern cotton. For a warm, cozy nest, I don't know anything softer or better.
        - id: ch01-b41
          speaker: narrator
          text: >-
            All this time, Peter had been admiring Sunshine and thinking how perfectly his name suited him. At first glance, the little bird looked completely yellow, as though he had somehow caught the warm sunshine and held it in his feathers wherever he went. From the top of his head to his breast below, there was not one white feather on him.
        - id: ch01-b42
          speaker: narrator
          text: >-
            When Sunshine came close, Peter could see small reddish-brown streaks across his breast and underneath. His wings and tail were a little blackish. Except for those markings, he was yellow all over.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Before long, Mrs. Sunshine joined them. Her yellow was not as bright as her mate's, and the feathers on her back had an olive-green tint. Underneath, she was almost pure yellow, with none of Sunshine's reddish-brown streaks.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Mrs. Sunshine was glad to see Peter, but she could not stay and visit. She had already found exactly the place for their nest, and she told Sunshine the news. Of course, Peter begged them to tell him where it was.
        - id: ch01-b45
          speakers: [sunshine_yellow_warbler, mrs_sunshine]
          ensemble: duo
          text: >-
            That's our secret. We won't tell a living soul!
        - id: ch01-b46
          speaker: narrator
          text: >-
            If Peter had been less curious about meeting the other Warblers, he might have stayed to spy on the pair. Instead, he promised himself that he would come back and search for the nest after they had built it.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Then he hurried back among the trees. The busy little Warblers had made the Old Orchard wonderfully lively that morning, and Peter was eager to find more friends among them.
        - id: ch01-b48
          speaker: peter_rabbit
          text: >-
            Well, anyone can recognize Zee Zee by his black suit with its flame-colored patches. No other bird has one like it. And anyone can recognize Sunshine because no one else looks yellow all over. My, what a lively, lovely family these Warblers are!
          emotion: happy
