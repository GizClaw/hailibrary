audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    jenny_wren:
      display_name: 鹪鹩珍妮
      tts:
        delivery: 伶俐爽快，语气尖锐却不失亲切
        timbre: 清脆有力
        pace: 偏快而清楚
        pitch: 高音
    sunshine:
      display_name: 黄林莺阳光
      tts:
        delivery: 开朗热情，说话爽快而自信
        timbre: 明亮柔和
        pace: 轻快自然
        pitch: 中高音
    mrs_sunshine:
      display_name: 黄林莺阳光太太
      tts:
        delivery: 温和利落，话语简洁而机敏
        timbre: 柔和清亮
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 闲不住的林莺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            在所有长着羽毛的朋友当中，最叫兔子彼得分不清楚的，就是林莺一家。一天早晨，老果园里来了许多小鸟，个头都不比鹪鹩珍妮大。树上到处都是他们的身影。
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            他们一下子来这么多，又总是动个不停。我连一只都看不了多久，怎么可能认清谁是谁呀？
        - id: ch01-b03
          speaker: narrator
          text: >-
            这些小家伙实在闲不住，一刻也不肯安静。他们从这棵树飞到那棵树，又从这根细枝跳上另一根细枝，忽然还会冲进空中。叽叽喳喳的说话声从没停过，中间夹着一小段一小段的歌。彼得才把目光落到一只身上，还没来得及看清，另一只模样完全不同的鸟就占了原来的位置。偶尔，他也能认出一位老朋友。那样的朋友会留下来，度过整个筑巢季。可大多数林莺只停一两天，很快又要启程。他们还得继续向北赶路，到那里安顿夏天的家。
        - id: ch01-b04
          speaker: narrator
          text: >-
            珍妮好像不太欢迎他们。也许她有一点儿嫉妒。有些林莺穿得那么鲜艳，相比之下，珍妮自己实在是个再朴素不过的小个子。也许她担心的还是吃饭问题。客人来了这么多，又都忙着捕捉各种小虫。要是他们没给珍妮留下足够的虫子，她想轻轻松松吃上自己的每一顿饭，可就难了。
        - id: ch01-b05
          speaker: jenny_wren
          text: >-
            他们为什么非要停在这儿？去别处不也一样吗？我们这些老老实实留下来过夏天的鸟还要吃饭呢，他们偏来抢食。我这辈子都没见过这么坐不住的家伙。他们一刻也不停，我光看着都累！
        - id: ch01-b06
          speaker: narrator
          text: >-
            彼得听得直想笑，因为珍妮自己也是个片刻都闲不住、安静不下来的家伙。彼得倒很喜欢林莺们来访，哪怕要分辨他们谁是谁，已经叫他伤透了脑筋。忽然，一只鸟俯冲下来，几乎贴着彼得的鼻尖叼走一只苍蝇。彼得还没来得及喘上一口气，那鸟已经重新飞回树上。
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            是红尾林莺吱吱！不管他飞到哪儿，我都认得出来。珍妮，你猜他让我想起谁？
          emotion: happy
        - id: ch01-b08
          speaker: jenny_wren
          text: 谁？
        - id: ch01-b09
          speaker: peter_rabbit
          text: >-
            金羽拟鹂金羽呀。当然，吱吱比他小得多。他也穿着黑色、橙红色和白色，只是橙色少一点儿。
        - id: ch01-b10
          speaker: narrator
          text: >-
            吱吱张开尾巴，难得安静了一小会儿。他的头、喉咙和背部都是黑的。尾巴末端有一条黑带，中间也有一道黑纹，其余地方全是鲜亮的橙红色。两边翅膀上各有一条橙红色带子，身体两侧也是这个颜色。下身则是白色，还染着一点儿橙色。
        - id: ch01-b11
          speaker: narrator
          text: >-
            可他只停了那么一瞬，马上又飞进空中。他忽冲忽降，翻转盘旋，用各种姿势去捉那些小得连彼得也看不见的虫子。彼得真想知道，他晚上怎么能安静下来睡觉。吱吱的嗓子跟翅膀一样忙，常常一声声叫着“吱，吱，吱，吱”。这还只是他许多叫声中的一种。有时他会唱一支好听的小曲，有时又像是在模仿别的林莺。
        - id: ch01-b12
          speaker: peter_rabbit
          text: 真希望吱吱会留在这里。我怎么也看不够他。
        - id: ch01-b13
          speaker: jenny_wren
          text: >-
            他当然会留下，不过多半不会住在老果园，我也盼着他别住这儿。不然我得跟他抢虫子，想喂饱那一大家孩子就更难了。他和红尾林莺太太大概会住到绿森林边上。他们更喜欢那里，我正好谢天谢地。瞧，红尾林莺太太来了。你仔细看看，吱吱身上的橙红色，到了她身上变成了黄色。她的头不是黑色，而是灰色。背部是带灰的橄榄绿。她当然没有吱吱那么漂亮，不过这也不奇怪。唱歌和卖弄都让吱吱来，活儿却归她干。依我看，那座巢差不多得由她独自搭好，吱吱大概帮不了多少。不过我得替他说句公道话，他是个好父亲。孩子们出世以后，他会尽自己的那份力喂养他们。
    - id: ch02
      title: 一座两层鸟巢
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            就在这时，彼得看见了一只通身黄色的鸟。他和吱吱差不多大，正在老石墙边的灌木间飞来飞去。彼得立刻认出了阳光，高兴得喊出他的名字。他连一句再见都没顾上跟珍妮说，就飞奔过去，一直跑到能看清阳光在一丛丛灌木间穿梭的地方。
        - id: ch02-b02
          speaker: peter_rabbit
          text: >-
            阳光！看见你回来，我真高兴。希望你和阳光太太就在附近安家，这样我每天都能见到你们。
          emotion: happy
        - id: ch02-b03
          speaker: sunshine
          text: >-
            你好，彼得！我见到你也一样高兴。只要能找到最合适的地方筑巢，我们当然要留下。重新回来真好啊。我们已经飞了那么远，只要不用继续走，就一步也不想再往前了。对了，今年春天，你在附近见过狡猾莎莉牛鹂吗？
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: 彼得点了点头。
        - id: ch02-b05
          speaker: peter_rabbit
          text: 见过，我看见她了。
        - id: ch02-b06
          speaker: sunshine
          text: >-
            这可不是好消息。去年她给我们惹了不少麻烦，不过后来还是叫我们骗过去了。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 你们怎么骗她的？
        - id: ch02-b08
          speaker: narrator
          text: 阳光停下来，从一片叶子上啄起一条小虫。
        - id: ch02-b09
          speaker: sunshine
          text: >-
            我们刚刚把巢搭好，阳光太太连第一枚蛋都还没来得及下，莎莉就发现了我们的新家。接下来她做了什么，你当然知道。
        - id: ch02-b10
          speaker: peter_rabbit
          text: 我猜，她把自己的一枚蛋下进了你们的巢。
        - id: ch02-b11
          speaker: narrator
          text: 阳光又从叶子上啄走了两三条小虫。
        - id: ch02-b12
          speaker: sunshine
          text: >-
            猜对了。那个又懒又没用的家伙，干的正是这件事！可她什么好处也没捞到，一点儿都没有。那枚蛋根本没能孵出来。去年我们骗过了她，今年她要是再玩这一套，我们还会照样对付她。
        - id: ch02-b13
          speaker: peter_rabbit
          text: 你们怎么办的？把那枚蛋扔出去了吗？
        - id: ch02-b14
          speaker: sunshine
          text: >-
            没有。我们的巢太深了，我们根本没办法把那枚蛋弄出去。于是，我们直接在蛋的上面再铺一层巢底，又把鸟巢四周加高了一点儿。后来我们一直小心守着，再也没给她机会往巢里下第二枚蛋。
        - id: ch02-b15
          speaker: peter_rabbit
          text: 那不就成了一座真正的两层鸟巢吗？
          emotion: surprised
        - id: ch02-b16
          speaker: narrator
          text: 彼得把眼睛瞪得大大的。阳光点了点头。
        - id: ch02-b17
          speaker: sunshine
          text: >-
            正是，而且那座巢棒极了，这可不是我自夸。阳光太太和我最得意的，就是我们搭的巢。再没有哪家的鸟宝宝，能住上比那里更柔软、更舒适的家。
        - id: ch02-b18
          speaker: peter_rabbit
          text: 你们用什么筑巢？
        - id: ch02-b19
          speaker: sunshine
          text: >-
            用细草、植物上柔软的纤维，找得到时再添些毛发和几根羽毛。我们还总会用许多又好又软的蕨绒。我知道的东西里，没有什么比它更柔软、更舒服。
    - id: ch03
      title: 把阳光藏进羽毛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            彼得一直欣赏着阳光，越看越觉得这个名字取得贴切。乍看上去，他从头到脚都是黄色，仿佛想了个办法，把阳光捉住，藏进了羽毛。他身上连一根白羽毛都没有。等他飞近些，彼得才看见，他的胸口和下身有细细的红褐色条纹，翅膀和尾巴也略微发黑。除此之外，他全身都是黄色。
        - id: ch03-b02
          speaker: narrator
          text: >-
            不一会儿，阳光太太也来了。她的黄色没有阳光那么鲜亮，背部还带着一层橄榄绿。不过，她的下身几乎是纯净的黄色，没有阳光身上那些红褐色条纹。她见到彼得也很高兴，却没工夫停下来聊天。原来，她已经找到了最适合筑巢的地方，一来就把这个消息告诉了阳光。彼得当然马上央求他们，说出那个地方在哪里。可两个黄色的小家伙只朝他眨眨明亮的眼睛。
        - id: ch03-b03
          speakers: [sunshine, mrs_sunshine]
          ensemble: duo
          text: 那是我们的秘密，一个活着的灵魂也不能告诉。
        - id: ch03-b04
          speaker: narrator
          text: >-
            要是彼得没有那么好奇，也没有急着认识林莺家族里的其他成员，他或许会留下来，悄悄监视阳光夫妇。可这一次，他没有这样做，只在心里打定主意，等鸟巢搭好以后，一定回来寻找。随后，他匆匆钻回老果园的树木之间。那天早晨，忙碌的小林莺让整座果园都热闹起来，彼得还想看看他们当中有多少自己的老朋友。
        - id: ch03-b05
          speaker: peter_rabbit
          text: >-
            有一件事肯定不会错。谁看见那套黑色和火焰色的衣裳，都能认出红尾林莺吱吱，因为再没有别的鸟穿成那样。黄林莺阳光也很好认，别的鸟看起来都没有他这么一身金黄。天哪，这群林莺真是又活泼、又可爱！
          emotion: happy
