audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and observant storytelling
        timbre: clear and gently rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: eager, curious, and quick to wonder
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: knowing, gruff, and good-humored
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: A Fishing Party
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit sat at the edge of the Old Briar-patch, trying to decide what to do. Staying home would have been the wise and proper choice. But he could also go calling on friends he had not visited yet. Then a sharp, harsh rattle made him look up. A bird was flying straight toward the Smiling Pool, rattling as he went. He was about a third larger than Welcome Robin, and his head looked much too big for his body. That voice settled Peter's decision at once.
        - id: ch01-b02
          speaker: peter_rabbit
          text: >-
            That's Rattles the Kingfisher! I'll run over to the Smiling Pool and pay him a visit.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Off Peter went as fast as his long legs could carry him, lipperty-lipperty-lip. By the time he reached the back of the Smiling Pool, Rattles was out of sight. Peter did not know which way to turn. It was very early in the morning, and not even a ripple moved across the water. While he sat wondering where to go, a great bird with broad wings came slowly from the direction of the Big River. The bird seemed to have no neck at all, and two long legs stretched straight out behind him.
        - id: ch01-b04
          speaker: peter_rabbit
          text: >-
            Why, that's Longlegs the Great Blue Heron! Is he coming here? I certainly hope he is.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Peter stayed where he was and waited. Longlegs came closer and closer. When he was directly across the pool from Peter, he dropped his legs, folded his huge wings, and landed at the water's edge. In flight he had seemed to have no neck. Now he stretched it out until he appeared to be almost nothing but neck. His neck was so long that he had to fold it back over his shoulders whenever he flew. Peter had never before had such a fine chance to see him.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Longlegs stood fully four feet tall. His crown and throat were white. A black stripe ran from the base of his great bill, passed over his eye, and ended in two long, slender black feathers behind his head. His yellow bill was longer than his head, thick and pointed like a spear. His long neck was pale brownish-gray, and his back and wings were blue-gray. Rusty red colored the bends of his wings and the feathered parts of his legs. Below that, his legs and feet were black. Beautiful pearly-gray feathers hung over his breast, unlike any feathers Peter had seen on another friend. Even with those long legs and that long neck, Longlegs was graceful and handsome.
        - id: ch01-b07
          speaker: peter_rabbit
          text: >-
            What could have brought him to the Smiling Pool?
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter soon found out. Longlegs stood perfectly still with his neck at full height until he was certain there was no danger nearby. Then he waded a few steps into the pool. He folded his neck back over his shoulders until his bill almost rested on his breast, and he froze as if there were no life in him. Peter kept still too. After a while, he began to wonder whether Longlegs had fallen asleep. Peter's own patience was nearly gone. He was just about to leave and search for Rattles when Longlegs struck. His dagger-like bill flashed forward and down into the water.
        - id: ch01-b09
          speaker: narrator
          text: >-
            When Longlegs lifted his bill, a little fish was caught in it. He swallowed the fish headfirst. Peter nearly laughed aloud at the funny sight of Longlegs struggling to gulp it all the way down that long throat. Then the heron folded himself into the same position and became motionless again.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Peter no longer minded sitting still. He was so interested in this lone fisherman that leaving never entered his mind. Before long, Longlegs made another catch. This time it was a fat pollywog. Peter remembered watching Plunger the Osprey fishing in the Big River, and he thought about how differently the two fishermen worked.
        - id: ch01-b11
          speaker: peter_rabbit
          text: >-
            Plunger searches for fish, but Longlegs waits for fish to come to him. Does Longlegs ever go hunting for them?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Longlegs seemed to answer Peter's question. Apparently no more fish were coming near him. He rose to his full height and looked carefully in every direction to be sure all was safe. Then he began walking along the edge of the pool, setting down each foot slowly and quietly. He had taken only a few steps when his great bill darted down. He had caught a careless young Frog. A little farther along, he caught another pollywog. When he found a place he liked, he waded in once more and watched for fish.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Suddenly Peter remembered Rattles the Kingfisher. He had forgotten all about him. Rattles flew from the Big Hickory-tree on the bank and out over the Smiling Pool. He hovered for a moment, then plunged straight down, headfirst. A splash followed. A second later he was back in the air, shaking off the water in a silver spray. A little fish was held in his long, strong black bill.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Rattles carried the fish to a branch of the Big Hickory-tree that reached over the pool. He struck it against the branch until it was dead, then turned it around to swallow it headfirst. The fish was big for a fisherman of his size, and Rattles had a dreadful struggle getting it down. At last he managed it and settled in to watch for another. Full sunlight fell across him, and Peter gave a small gasp.
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            I never realized how handsome Rattles is!
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: >-
            Rattles was about the size of Yellow Wing the Flicker, though his large head made him seem bigger. The feathers on top stood in a crest, as if someone had brushed them the wrong way. His head, back, wings, and tail were bluish-gray. His throat and collar were white, with a small white spot in front of each eye. A bluish-gray belt crossed his breast, and below it he was white. Tiny white spots dotted his wings, and more white marked his tail. His long black bill was strong and sharp, much like Longlegs' bill. It seemed almost too large for him.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Before long, Rattles flew over the pool and dived again. This time he plunged very close to the place where Longlegs was waiting. Rattles caught a fish, as he almost always did. It was smaller than the first, so he swallowed it as soon as he returned to the Big Hickory-tree. He did not need to strike it against the branch.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Longlegs was thoroughly annoyed. He stood glaring angrily up at Rattles for a moment or two. That close dive had frightened away all the fish. At last, Longlegs seemed to decide that only one fisherman at a time could use the Smiling Pool. He spread his broad wings and folded his neck over his shoulders. Then he flew heavily toward the Big River, trailing his long legs behind him.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Rattles stayed at the Smiling Pool just long enough to catch one more little fish. Then, with another harsh rattle, he flew away down the Laughing Brook.
        - id: ch01-b20
          speaker: peter_rabbit
          text: >-
            I could recognize him anywhere by that rattle. No one else makes a sound like it. Where is he going now? He must have a nest, but what sort of nest does he build? Oh, there's Grandfather Frog on his green lily pad. Maybe he knows.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Peter hopped along the bank until he was close enough to speak to Grandfather Frog.
        - id: ch01-b22
          speaker: grandfather_frog
          text: >-
            What kind of nest does Rattles the Kingfisher build? Chug-arum, Peter Rabbit! I thought everyone knew that Rattles doesn't build a nest. At least, I wouldn't call it one. He lives in a hole in the ground.
        - id: ch01-b23
          speaker: peter_rabbit
          text: >-
            What? In the ground?
          emotion: surprised
        - id: ch01-b24
          speaker: narrator
          text: >-
            Peter stared as if he could not believe his ears. Grandfather Frog grinned, and his goggly eyes twinkled.
        - id: ch01-b25
          speaker: grandfather_frog
          text: >-
            Yes, Peter. Rattles lives in a hole in the ground.
        - id: ch01-b26
          speaker: peter_rabbit
          text: >-
            But... but what kind of hole is it?
        - id: ch01-b27
          speaker: grandfather_frog
          text: >-
            Just an ordinary hole.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Grandfather Frog's grin grew even broader. But Peter looked so puzzled that Grandfather Frog began to explain.
        - id: ch01-b29
          speaker: grandfather_frog
          text: >-
            Rattles usually chooses a high, gravelly bank near the water. Just below the top, he digs a hole straight into the bank. The passage is only wide enough for him and Mrs. Rattles to move through comfortably, and it runs straight in for several feet. I've heard that he makes a kind of bedroom at the far end. He needs a good-sized room because he usually has a good-sized family.
        - id: ch01-b30
          speaker: peter_rabbit
          text: >-
            Do you mean Rattles digs the hole himself?
        - id: ch01-b31
          speaker: narrator
          text: Grandfather Frog nodded.
        - id: ch01-b32
          speaker: grandfather_frog
          text: >-
            If Rattles doesn't dig it, Mrs. Kingfisher does. Those great bills work as picks as well as fish spears. The Kingfishers loosen the sand with their bills and scoop it away with their feet. I've never seen the inside of their home, but people say the bedroom is lined with fish bones. You may call that a nest if you wish. I don't.
        - id: ch01-b33
          speaker: peter_rabbit
          text: >-
            I'm going straight down the Laughing Brook to find that hole!
        - id: ch01-b34
          speaker: narrator
          text: >-
            Peter hurried off down the Laughing Brook so quickly that he forgot even to be polite enough to thank Grandfather Frog.
