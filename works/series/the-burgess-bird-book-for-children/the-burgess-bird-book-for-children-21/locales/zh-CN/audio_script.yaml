audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的讲故事口吻
        timbre: 温暖清亮
        pace: 舒缓中带轻快变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，偶尔带一点顽皮
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 老练幽默，说话慢条斯理
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 两位渔夫来到微笑池
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            兔子彼得坐在老荆棘丛边上，心里正犹豫。留在家里当然最明智，也最规矩，可他又想去看看那些还没拜访过的朋友。就在这时，一阵尖锐刺耳的咔嗒声传来。他抬头一瞧，有只鸟正朝微笑池飞去。这只鸟比知更鸟欢迎大了三分之一左右，脑袋却大得跟身子很不相称。一路飞，他还一路咔嗒咔嗒地叫。彼得一听，马上拿定了主意。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 是翠鸟喀嗒！我要去微笑池向他问个好。
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得迈开长腿，一蹦一跳，飞快奔向微笑池。可他早已看不见喀嗒了，来到池子后岸，也不知该往哪边走。清早的水面平平静静，连一丝波纹都没有。彼得正在盘算，一只翅膀宽阔的大鸟从大河方向缓缓飞来。那只鸟看着完全没有脖子，身后却直直伸着两条长腿。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 是大蓝鹭长腿！他会不会要来这里？真希望他是来这里的！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得留在原地等着。长腿越飞越近，到了彼得正对面的池岸，忽然放下两条长腿，收拢巨翼，稳稳落在岸边。刚才飞行时，他仿佛没有脖子。现在脖子一伸到头，整只鸟又像只剩下一条长脖子。原来，他的脖子实在太长，飞起来只能弯着收在肩头。彼得从没有这样好的机会，可以又近、又仔细地看清长腿。
        - id: ch01-b06
          speaker: narrator
          text: >-
            长腿站起来足有四英尺高。头顶和喉咙是白的。一道黑纹从大嘴根部越过眼睛，最后变成两根细长黑羽，从脑后垂下来。他那张黄嘴比脑袋还长，又粗又尖，活像一支长矛。长脖子是浅棕灰色，背部和翅膀泛蓝。翅膀弯折处和腿上有羽毛的地方呈锈红色，其余腿部和双脚都是黑的。胸前还垂着漂亮的珍珠灰长羽毛，彼得从没在其他鸟朋友身上见过。长腿的腿和脖子虽长得出奇，模样却优雅又英俊。
        - id: ch01-b07
          speaker: peter_rabbit
          text: 他跑到微笑池来，到底想做什么呢？
    - id: ch02
      title: 长腿耐心捕鱼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            答案很快就有了。长腿先把脖子伸到最高，一动不动地观察四周，直到确定附近没有危险，才往水里走了几步。接着，他把脖子弯回肩头，长嘴像是搁在胸前，浑身纹丝不动，简直像没有生命。彼得也坐得一动不动。过了好一阵，他都开始怀疑长腿是不是睡着了。彼得的耐心快要用完，正想继续去寻找喀嗒，长腿那把匕首似的嘴突然向前、向下一刺，快得如同闪电。
        - id: ch02-b02
          speaker: narrator
          text: >-
            长嘴从水里抬起来时，已经夹住一条小鱼。长腿让鱼头朝前，立刻往下吞。那条鱼要滑过他的长脖子可真不容易，他吞得又费劲又滑稽，彼得差点笑出声。鱼吃下去了，长腿又摆回原来的姿势，一动也不动。
        - id: ch02-b03
          speaker: narrator
          text: >-
            这下彼得愿意耐心等了。眼前这个孤零零的渔夫太有意思，他根本舍不得走。没多久，长腿再次出手，捉到一只胖蝌蚪。彼得想起自己在大河边看过鹗猛扎捕鱼。这两位渔夫，办法可太不一样了。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 猛扎会四处追着鱼找，长腿却守在这里，等鱼自己游过来。难道长腿从来不主动寻找猎物吗？
        - id: ch02-b05
          speaker: narrator
          text: >-
            长腿像是听见了这句话。他大概觉得不会再有鱼游过来，便挺直身子，警觉地朝左右看了看，然后沿着池边慢慢走。每一步都落得又轻又稳，半点声音也没有。才走几步，他的大嘴便闪电般扎下去，逮住了一只粗心的小青蛙。又走几步，他再捉到一只蝌蚪。找到合意的地方以后，他重新走进水中，又守着鱼去了。
    - id: ch03
      title: 喀嗒大显身手
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            彼得这才猛然想起，自己早把翠鸟喀嗒忘了。只见喀嗒从岸边的大山核桃树飞出，来到微笑池上空。他悬停了一下，便头朝下一猛子扎入水中。扑通一声过后，他转眼又飞上天空，抖落的水珠化作银亮飞沫。那张又长又粗的黑嘴里，已经衔着一条小鱼。
        - id: ch03-b02
          speaker: narrator
          text: >-
            喀嗒回到探向水面的树枝上，把鱼一次次摔在枝头，直到鱼不再动弹。他把鱼掉转过来，让鱼头朝前，再慢慢吞下去。这条鱼相对他的个头实在太大，害得他费了好大力气。好不容易把鱼咽下，喀嗒又守在枝头，等着捉下一条。阳光正好照亮他的全身，彼得惊讶得吸了一口气。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 原来喀嗒这么漂亮，我以前怎么从来没发现！
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: >-
            喀嗒的大小和扑动啄木鸟黄翅差不多，只因脑袋很大，才显得身形更大。头顶的羽毛竖成一簇冠羽，好像全被人梳反了。头、背、翅膀和尾巴都是蓝灰色的，喉咙洁白，脖子上还围着一圈白羽。两眼前方各有一个小小的白点。胸前横着一条蓝灰色带子，身体下面是白色的。翅膀点着细小白斑，尾巴也布满白色斑点。那张黑嘴跟长腿的嘴一样，又长、又粗、又尖，配上他的身子，几乎大过了头。
        - id: ch03-b05
          speaker: narrator
          text: >-
            过了一会儿，喀嗒再次飞向池面。这一次，他落水的地方离耐心守候的长腿很近。他又捉到一条鱼。喀嗒很少失手，而这条鱼比第一条小，他一回到树上便直接吞了下去，不必先在树枝上摔打。
        - id: ch03-b06
          speaker: narrator
          text: >-
            长腿可彻底恼火了。他抬头瞪着喀嗒，怒气冲冲地看了好一会儿。喀嗒入水时离得太近，已经把水里的鱼全吓跑。最后，长腿像是认定，微笑池一次只能容下一位渔夫。他展开宽大的翅膀，把长脖子弯折着收回肩头，两条长腿直直拖在身后，沉重地朝大河方向飞走了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            喀嗒继续留在微笑池边，等到又捉住一条小鱼，才发出刺耳的咔嗒声，沿着欢笑溪飞走了。
        - id: ch03-b08
          speaker: peter_rabbit
          text: >-
            不管在哪里，我一听这咔嗒声就能认出他。谁也发不出这样的声音。他现在去哪儿了呢？他一定有个巢，可他的巢会是什么样？咦，青蛙爷爷正坐在那边的绿睡莲叶上，也许他知道。
    - id: ch04
      title: 地洞里的家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得一路蹦到青蛙爷爷附近，离得足够近了，便开口问他。
        - id: ch04-b02
          speaker: peter_rabbit
          text: 翠鸟喀嗒筑的巢是什么样的？
        - id: ch04-b03
          speaker: grandfather_frog
          text: >-
            喀嗒筑的巢是什么样？咕咚呱，兔子彼得！我还以为谁都知道，喀嗒根本不筑巢。至少我可不把那东西叫作巢。他住在地洞里。
        - id: ch04-b04
          speaker: peter_rabbit
          text: 什么？
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: 彼得简直不敢相信自己的耳朵。青蛙爷爷咧嘴笑起来，两只鼓眼睛闪闪发亮。
        - id: ch04-b06
          speaker: grandfather_frog
          text: 没听错，喀嗒就是住在地洞里。
        - id: ch04-b07
          speaker: peter_rabbit
          text: 可……可……可那到底是什么样的洞？
          emotion: surprised
        - id: ch04-b08
          speaker: grandfather_frog
          text: 就是个普普通通的洞。
        - id: ch04-b09
          speaker: narrator
          text: 青蛙爷爷笑得更开了。看彼得还是满脸迷惑，他才接着解释。
        - id: ch04-b10
          speaker: grandfather_frog
          text: >-
            喀嗒通常会在水边找一处高高的沙砾岸坡，从靠近顶端的地方笔直往里挖。洞口不用太大，刚好够他和喀嗒太太舒舒服服地进出就行。不过这个洞会笔直向里延伸好几英尺。听说到了尽头，他还会挖出一间像卧室的地方，因为他们家通常有不少孩子。
        - id: ch04-b11
          speaker: peter_rabbit
          text: 你是说，这个洞真是他自己挖出来的？
        - id: ch04-b12
          speaker: narrator
          text: 青蛙爷爷点了点头。
        - id: ch04-b13
          speaker: grandfather_frog
          text: >-
            就算不是喀嗒挖的，也是翠鸟太太挖的。他们的大嘴既能当捕鱼的长矛，也能当挖土的镐。他们先用那张大嘴啄松沙土，再用脚把土刨出去。我自己从没见过他们家里面是什么样，不过听说那间卧室的地面铺满了鱼骨头。你愿意把它叫作巢，那就叫吧，反正我不愿意。
        - id: ch04-b14
          speaker: peter_rabbit
          text: 我要马上沿着欢笑溪往下游走，去找那个洞！
        - id: ch04-b15
          speaker: narrator
          text: 彼得说走就走。他离开得实在太匆忙，连该有礼貌地对青蛙爷爷说声谢谢都忘了。
