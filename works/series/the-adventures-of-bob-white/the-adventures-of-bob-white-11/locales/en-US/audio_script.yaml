audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and impulsive
        timbre: youthful and light
        pace: quick
        pitch: medium-high
    mrs_peter:
      display_name: Mrs. Peter
      tts:
        delivery: practical and caring
        timbre: gentle and clear
        pace: measured
        pitch: medium-high
    mrs_bob_white:
      display_name: Mrs. Bob White
      tts:
        delivery: tender and watchful
        timbre: soft and bright
        pace: measured
        pitch: high
  chapters:
    - id: ch01
      title: Watch Your Step!
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Watch your step. Make sure you know exactly what lies ahead. If you are careless, you may never take another step."
        - id: ch01-b02
          speaker: narrator
          text: "Peter Rabbit wasn't worried about his own last step, not while he was safe in the Old Briar-patch. What frightened him was the thought that one of Bob White's babies might never step again. Those babies always seemed to be right beneath his feet, and they made him terribly nervous. Whenever Peter moved, little Mrs. Bob or Mrs. Peter called out a warning."
        - id: ch01-b03
          speaker: mrs_bob_white
          text: "Peter, watch where you're stepping!"
          emotion: fearful
        - id: ch01-b04
          speaker: mrs_peter
          text: "Be careful! Don't tread on one of those little darlings!"
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: "So before each step, Peter searched for any tiny brown bird tucked beneath a brown leaf. He would never have hurt one for anything in the world. The danger wasn't nearly as great as their loving mother feared. Small as the babies were, they were quick and clever. But mothers often expect that something dreadful is about to happen to their little ones."
        - id: ch01-b06
          speaker: narrator
          text: "Peter heard that same warning twenty times a day."
        - id: ch01-b07
          speaker: mrs_bob_white
          text: "Watch your step!"
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: "Even so, Peter was glad that the Bob White family had moved into the dear Old Briar-patch. Now he could learn far more about Bob White and his children than he ever could have learned another way. Peter was always eager to learn, especially when the subject was other people."
        - id: ch01-b09
          speaker: narrator
          text: "He had never seen babies grow the way those little Bob Whites did. All fifteen of them seemed to be everywhere at once. Peter often wondered how their mother could possibly keep track of so many, but somehow she did."
        - id: ch01-b10
          speaker: narrator
          text: "Peter soon noticed that they obeyed the moment she called. Sometimes Redtail the Hawk sailed lazily over the Old Briar-patch. His sharp eyes watched for anything happening below that he didn't know about. Then little Mrs. Bob gave her warning, and every youngster crouched exactly where it stood. Not one moved again until she allowed it."
        - id: ch01-b11
          speaker: narrator
          text: "Old Redtail never once guessed that the Bob White family was there. And whenever Mrs. Bob called the babies to her, they came running at once. It was a beautiful thing to see."
        - id: ch01-b12
          speaker: narrator
          text: "Once all fifteen were nestled beneath her wings, Mrs. Bob told them about the Great World. She explained the dangers they would face when they were old enough to enter it, and what they should do when each danger came."
        - id: ch01-b13
          speaker: narrator
          text: "As the little Bob Whites darted here and there through the Old Briar-patch, they gathered tiny seeds. Peter had never imagined there were so many. He didn't eat tiny seeds himself, so he had never paid attention to them. Mrs. Bob led the babies around and showed them which seeds were good and which ones to leave alone. They needed only one lesson."
        - id: ch01-b14
          speaker: narrator
          text: "Now and then, they changed their meal by plucking tiny insects from leaves that hung close to the ground. Once in a while, two or more babies struggled over a worm. Peter always enjoyed watching them. He thought it was very funny."
        - id: ch01-b15
          speaker: narrator
          text: "After a few days, there wasn't a bug or worm left in the Old Briar-patch, at least not on the ground or close to it. The Bob White family had eaten every single one."
        - id: ch01-b16
          speaker: mrs_peter
          text: "I wish they would stay here forever. I can't stand bugs and worms. Just seeing them makes me feel all crawly."
          emotion: disgusted
        - id: ch01-b17
          speaker: narrator
          text: "But a growing family needs plenty to eat. At the end of a week, Mrs. Bob led her youngsters out onto the Green Meadows to hunt for bugs, worms, and seeds. She never took them far from the Old Briar-patch. If danger came, they could hurry back to its friendly shelter."
        - id: ch01-b18
          speaker: narrator
          text: "Every night, she brought them back to sleep beneath the friendly brambles. So Peter only had to watch his steps for a little while. When he no longer heard the warning each time he moved, he was truly sorry. Peter had grown very fond of the little Bob Whites."
