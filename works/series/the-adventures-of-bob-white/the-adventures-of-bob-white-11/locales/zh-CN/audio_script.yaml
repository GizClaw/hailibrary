audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    mrs_peter:
      display_name: 彼得太太
      tts:
        delivery: 温和细心，话音里带着沉着和体贴
        timbre: 柔和清亮
        pace: 从容自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 小心脚下
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            脚下每一步，都要看清楚，
            前面究竟有些什么。
            若是粗心大意踩错一步，
            从此便再也迈不开脚。
        - id: ch01-b02
          speaker: narrator
          text: 这几句话说的可不是兔子彼得。至少在老荆棘丛里，它不怕自己一脚踩错，从此再也不能走路。它怕的是另一件事，而且怕得要命。万一鹌鹑鲍勃家的哪个宝宝被踩伤，再也走不了，那可怎么办？
        - id: ch01-b03
          speaker: narrator
          text: 那十五只小家伙好像总在彼得脚边钻来钻去，弄得它每走一步都紧张。鲍勃太太和彼得太太轮流提醒它。不是喊“彼得，小心脚下”，就是叫它千万别踩着那些小宝贝。
        - id: ch01-b04
          speaker: narrator
          text: 彼得无论如何也不肯伤着任何一只小家伙。每次抬脚以前，它都瞪大眼睛，看清棕色的落叶底下有没有藏着棕色的小鸟。其实，小鹌鹑们又灵活又机敏，危险连鸟妈妈担心的一半都不到。可做妈妈的就是这样，总怕可怕的事会落到孩子头上。
        - id: ch01-b05
          speaker: narrator
          text: 所以那句“小心脚下”，彼得一天能听上二十遍。
    - id: ch02
      title: 听话的小鹌鹑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 虽说处处要小心，彼得仍旧很高兴鹌鹑鲍勃一家搬进亲爱的老荆棘丛。若不是住在一起，它哪有机会知道鹌鹑鲍勃和孩子们平时怎么生活？彼得向来爱学新鲜事，别人的事更是非弄明白不可。
        - id: ch02-b02
          speaker: narrator
          text: 十五只小鹌鹑长得飞快，又好像哪儿都有它们。彼得怎么也想不通，鲍勃太太怎样才能一只不少地照顾好。可她就是做得到。妈妈一叫，孩子们马上照办，一点儿也不耽搁。
        - id: ch02-b03
          speaker: narrator
          text: 有时，红尾鹰会懒洋洋地从老荆棘丛上空滑过去。它瞪着一双锐利的眼睛，想看看底下有没有自己不知道的动静。鲍勃太太只要发出警告，小鹌鹑们不管正待在哪里，立刻就地伏下，一动也不动。妈妈没说可以起来，它们谁也不动。
        - id: ch02-b04
          speaker: narrator
          text: 老红尾从来没猜到，这一家子就藏在下面。鲍勃太太再一召唤，孩子们转眼便全跑回她身旁。它们这么听话，实在招人喜欢。
        - id: ch02-b05
          speaker: narrator
          text: 等十五个孩子都偎进翅膀底下，鲍勃太太就给它们讲外面的大千世界。将来长大了，出去会碰到什么危险，又该怎么应付，她一样一样都讲给孩子们听。
        - id: ch02-b06
          speaker: narrator
          text: 小家伙们平时在老荆棘丛里到处跑，一路啄着细小的草籽。彼得自己不吃这种种子，从前压根儿没留意过。如今看小鹌鹑们一颗接一颗地找出来，它才知道这里竟有这么多。
        - id: ch02-b07
          speaker: narrator
          text: 鲍勃太太带着它们觅食，告诉它们哪种草籽最好，哪种不能碰。每一样教一次，它们就记牢了。它们还会从低垂的叶子上啄小虫，换换口味。偶尔找到一条蚯蚓，两三只小鹌鹑就抢成一团。彼得总爱看这场热闹，觉得有趣极了。
    - id: ch03
      title: 走向绿草地
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过几天，老荆棘丛的地面和低处就再也找不到小虫或蚯蚓了。鹌鹑鲍勃一家吃得干干净净，真是一只都没留下。
        - id: ch03-b02
          speaker: mrs_peter
          text: 真希望它们一直住在这里。我最不喜欢小虫和蚯蚓了，每次看见，身上就像也有虫子在爬。
        - id: ch03-b03
          speaker: narrator
          text: 可孩子们正在长大，不能吃不饱。过了一个星期，鲍勃太太领着它们走出老荆棘丛，到绿草地上寻找小虫、蚯蚓和草籽。不过她从不走远。万一有事，一家子随时都能跑回来，躲进老荆棘丛友善的枝条下面。
        - id: ch03-b04
          speaker: narrator
          text: 每到夜里，鲍勃太太仍会把孩子们带回来，让它们睡在亲切的荆棘底下。彼得处处小心脚下的日子，就这样没过多久便结束了。
        - id: ch03-b05
          speaker: narrator
          text: 后来，彼得走动时再也听不见那句提醒，心里反倒真有些难过。原来，它已经深深喜欢上那些小鹌鹑了。
