audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 枯叶下的小鹌鹑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 无心做下的残酷事情，会叫无辜的人白白受伤。
        - id: ch01-b02
          speaker: narrator
          text: 琼斯农夫的麦田里，有一座土拨鼠约翰尼很久以前造的旧屋。门洞里积着风吹来的枯黄落叶。那只可怜的小鹌鹑正伏在叶子底下，眼里含满了泪。它又害怕，又疼痛。
        - id: ch01-b03
          speaker: narrator
          text: 它眨着眼睛，想把泪水忍回去，也想弄清楚下一步该怎么办。可它的心已经乱透了。一个人要是慌得连刚才出了什么事、眼前又是什么情形都想不明白，就是它现在这个样子。
        - id: ch01-b04
          speaker: narrator
          text: 那天早晨，十月的天气美极了。小鹌鹑原本正和兄弟姐妹们高高兴兴地吃早餐，一条大狗却毫无预兆地扑来，要捉住它。它赶紧扇动迅捷有力的小翅膀，飞上天空。
        - id: ch01-b05
          speaker: narrator
          text: 就在飞起来的时候，它看见一个高大的两脚怪物，手里拿着一根棍子，直直对准了自己。小鹌鹑并不害怕。整个夏天，它见过许多两脚怪物，从没有谁伤害它。布朗农夫家的男孩天天来看它们兄弟姐妹，却连一次也没吓唬过它们。小鹌鹑早把这样的两脚怪物当成朋友了，对眼前这个当然也没有戒心。
    - id: ch02
      title: 可怕的喷火棍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可就在下一刻，那根棍子的末端蹿出了火和浓烟，还响起一声吓人的巨响。有什么东西击中了小鹌鹑，刺痛它，灼烧它，还撕开了它细嫩的皮肉。一边翅膀立刻失去了力气，它重重摔到地上。
        - id: ch02-b02
          speaker: narrator
          text: 小鹌鹑落地就拼命奔跑，直到找到这座旧屋。它钻进门洞，紧挨着棕色落叶伏好。大狗和两脚怪物到处找它时，它小小的心一直吓得怦怦直跳。现在，他们大概已经放弃，走远了。至少，它再也听不见一点儿动静。
        - id: ch02-b03
          speaker: narrator
          text: 小鹌鹑怎么也想不明白，这一切究竟是什么意思。它做错了什么？为什么那个两脚怪物要拿可怕的喷火棍杀它？外面还是那么美，日子里的欢乐却一下全没了，到处都叫它害怕。它如今该怎么办，又能怎么办？爸爸妈妈和兄弟姐妹在哪里？他们会不会也遇上了这种可怕的事？自己以后还能见到他们吗？
        - id: ch02-b04
          speaker: narrator
          text: 过了一会儿，远处传来一声哨响，听上去悲伤又焦急。那是爸爸鹌鹑鲍勃在召集全家。别处很快也响起回应。小鹌鹑知道，家人都平安，很快就会回到鲍勃身边。可是，它不敢出声回答。
        - id: ch02-b05
          speaker: narrator
          text: 它爬到门边，悄悄探头一看。那条大狗和拿着喷火棍的残忍两脚怪物，已经走到了田野另一边。小鹌鹑用力一跃，想像从前那样飞起来，可它只能无助地扑腾。受伤的翅膀毫无用处，只能拖在地上。那阵疼痛太厉害了，几乎叫它昏过去。
    - id: ch03
      title: 篱笆另一边
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小鹌鹑闭上眼睛，躺在那里喘了好几分钟。忽然，它想到一件更加吓人的事。要是狐狸雷迪、老郊狼先生或老红尾鹰正巧经过，自己没法飞，又该怎么逃命？
        - id: ch03-b02
          speaker: narrator
          text: 它多么希望自己不是孤零零的！只要能回到爸爸妈妈身边，也许他们就有办法帮忙。小鹌鹑挣扎着站起身，朝远处那声口哨走去。
        - id: ch03-b03
          speaker: narrator
          text: 这段路走得很慢。它虚弱得头昏，垂下的翅膀一路擦过坚硬的麦茬，疼得快要忍不住了。它一次次伏到地上，因为疲倦、伤痛和恐惧而喘个不停，又一次次站起来接着走。它渴极了，附近却找不到一滴水。
        - id: ch03-b04
          speaker: narrator
          text: 最后，小鹌鹑终于爬过一道篱笆。可它刚到另一边，就看见一个两脚怪物突然出现在正前方。
        - id: ch03-b05
          speaker: narrator
          text: 就在这一刻，小鹌鹑再也不抱任何希望了。
