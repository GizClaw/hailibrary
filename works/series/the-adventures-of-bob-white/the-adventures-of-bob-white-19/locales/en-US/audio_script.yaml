audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Frightened, Wounded and Alone
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Oh, cruel is the thoughtless deed that wounds another without need."
        - id: ch01-b02
          speaker: narrator
          text: "The poor little Bob White was crouching beneath the brown, dead leaves that had blown into the doorway of an old house. Johnny Chuck had made that house long ago in Farmer Jones's wheat field. Now the little bird hid there with tears in his eyes, frightened and in pain."
        - id: ch01-b03
          speaker: narrator
          text: "He tried to blink the tears away and decide what to do next, but he was too bewildered to think. When you are bewildered, you are so upset that you cannot make sense of what has happened or what is happening. That was exactly how this little Bob White felt."
        - id: ch01-b04
          speaker: narrator
          text: "That beautiful October morning, he had been happily gathering his breakfast with his brothers and sisters. Then, without any warning, a huge dog had threatened to catch him. The little Bob White had taken off on his swift, strong wings. As he rose, he saw a large two-legged creature aiming a stick at him. Even then, he wasn't afraid."
        - id: ch01-b05
          speaker: narrator
          text: "He had watched two-legged creatures like this one all summer, and none of them had hurt him. He had even begun to think of them as friends. After all, Farmer Brown's boy had watched him and the other young Bob Whites day after day. The boy had never once tried to frighten them. So why should this creature be any different?"
        - id: ch01-b06
          speaker: narrator
          text: "But fire and smoke had suddenly burst from the end of that stick, followed by a terrible noise. Something struck the little Bob White. It stung and burned and tore his tender flesh. One of his swift, strong wings would no longer work, and he fell hard to the ground."
        - id: ch01-b07
          speaker: narrator
          text: "He ran until he found this hiding place. His small heart went pit-a-pat, pit-a-pat with terror as he pressed close beneath the friendly brown leaves. The huge dog and the two-legged creature searched for him, but at last they gave up and went away. At least, he could no longer hear them."
        - id: ch01-b08
          speaker: narrator
          text: "What could it all mean? Why had this dreadful thing happened? What had he done to make the two-legged creature try to kill him with that terrible fire-stick? Outside, the day was still as beautiful as before, but all its joy was gone. Now the whole day seemed full of terror."
        - id: ch01-b09
          speaker: narrator
          text: "What was he supposed to do? What could he do? Where were his father and mother, his brothers and sisters? Were dreadful things happening to them too? Would he ever see any of them again?"
        - id: ch01-b10
          speaker: narrator
          text: "After a while, a sad, worried whistle came from far away. It was his father, Bob White, calling the family together. Other whistles answered. The wounded youngster knew the rest of the family was safe and would soon gather around Bob White. But he was too afraid to answer."
        - id: ch01-b11
          speaker: narrator
          text: "He crawled to the doorway and looked out. Far across the field, he could still see the huge dog and the cruel two-legged creature carrying the terrible fire-stick. The little Bob White tried to leap up and fly the way he always had. Instead, he could only flop helplessly. One useless wing dragged along the ground, and the pain was so great that he nearly fainted."
        - id: ch01-b12
          speaker: narrator
          text: "He shut his eyes and lay still for a few minutes, panting. Then another frightening thought came to him. What if Reddy Fox, Old Man Coyote, or Redtail the Hawk found him? Without his wings, how could he possibly get away?"
        - id: ch01-b13
          speaker: narrator
          text: "If only he weren't alone. If only he could reach his father and mother, perhaps they could help. He struggled onto his feet and started toward the far-off whistle."
        - id: ch01-b14
          speaker: narrator
          text: "He could move only slowly. He felt weak and faint, and his drooping wing caught on the stiff stubble as it dragged behind him. The pain sometimes seemed worse than he could bear. Again and again, he crouched down and panted from weariness, pain, and fear. Each time, he finally forced himself to go on."
        - id: ch01-b15
          speaker: narrator
          text: "He was terribly thirsty, but there was no water anywhere for him to drink. At last, he crawled beneath a fence. Then he stopped. Right in front of him stood another of those two-legged creatures."
        - id: ch01-b16
          speaker: narrator
          text: "At that very moment, the little Bob White gave up all hope."
