audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and impulsive
        timbre: youthful and light
        pace: quick
        pitch: medium-high
    mrs_peter:
      display_name: Mrs. Peter
      tts:
        delivery: warm and good-humored
        timbre: light and gentle
        pace: measured
        pitch: medium-high
    mrs_bob_white:
      display_name: Mrs. Bob White
      tts:
        delivery: bright and self-assured
        timbre: clear and pleasant
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: New Tenants for the Briar-patch
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "A neighbor who proves kind will find contentment and peace of mind."
        - id: ch01-b02
          speaker: mrs_peter
          text: "One, two, three, four—oh, dear! They move so fast that I can't count them. Aren't they precious? I'm so glad you brought them for us to see, Mrs. Bob. How many are there?"
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: "Peter and Mrs. Peter watched Bob White's tiny babies scamper toward shelter. One after another, they tucked themselves beneath their mother's wings, under the friendly brambles of the dear Old Briar-patch."
        - id: ch01-b04
          speaker: mrs_bob_white
          text: "There are fifteen."
        - id: ch01-b05
          speaker: narrator
          text: "Mrs. Bob White answered with pride. Fifteen tiny babies made a very fine family indeed."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "Goodness, what a family! How can you possibly keep track of every one? I'd be worried all the time."
          emotion: surprised
        - id: ch01-b07
          speaker: mrs_bob_white
          text: "They do take a great deal of care. That's why I brought them to the Old Briar-patch. I hope you and Mrs. Peter won't mind if we stay here awhile. Until they learn to fly, this is the safest place I know."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "We'd be delighted to have you! We don't own the dear Old Briar-patch, though we've lived here so long that it almost feels like ours. Anyone who wants to may live here, and we'd rather have you and your family than anyone else. But how did you travel very far with babies so small? Where did you come from?"
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: "Mrs. Bob's eyes twinkled."
        - id: ch01-b10
          speaker: mrs_bob_white
          text: "Of course you may ask. We didn't travel far at all. We came straight from our home here."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "But where was your home?"
        - id: ch01-b12
          speaker: narrator
          text: "Peter could hardly wait for the answer. Remember, he had spent a great deal of time trying to find the Bob Whites' home. At last, he was about to learn what all his searching had failed to uncover."
        - id: ch01-b13
          speaker: mrs_bob_white
          text: "It was just over there, in that little patch of weeds across the Crooked Little Path. It was very handy to the Old Briar-patch."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "What? You mean you've been living that close to us?"
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: "Peter almost shouted. Mrs. Bob nodded."
        - id: ch01-b16
          speaker: mrs_bob_white
          text: "I certainly have. Every day, while I sat on my eggs, I could see you from there."
        - id: ch01-b17
          speaker: peter_rabbit
          text: "But how could you dare build in such a dangerous spot? Reddy and Granny Fox passed within a few feet of you every day! I've never heard of anything so crazy."
          emotion: surprised
        - id: ch01-b18
          speaker: narrator
          text: "Peter stared at her. Even after hearing it from Mrs. Bob herself, he still looked as though he could hardly believe that her home had been so close."
        - id: ch01-b19
          speaker: mrs_bob_white
          text: "It was the safest spot on the Green Meadows. By now, Peter Rabbit, you should know that the safest hiding place is the one where no one will look. These babies are the proof. Day after day, I watched you, Reddy, Granny Fox, and Jimmy Skunk hunt for me, and I laughed quietly to myself. I knew none of you would imagine I could be foolish enough—and wise enough—to build where my home was so easy to find. So you never looked there. And I was right."
        - id: ch01-b20
          speaker: narrator
          text: "Mrs. Peter chuckled."
        - id: ch01-b21
          speaker: mrs_peter
          text: "You certainly were right, Mrs. Bob. That may be the cleverest thing I've ever heard. Peter ought to feel foolish if he doesn't already. I told him your home was none of his business, but he was so curious that he kept looking. And all that time, it was close by! Well, Peter, don't you feel foolish?"
        - id: ch01-b22
          speaker: peter_rabbit
          text: "Yes, my dear. I certainly do. But now I know where it was, and I'm satisfied. I'm glad Mrs. Bob brought her family to the dear Old Briar-patch. It will be great fun to watch those youngsters grow. And I can't help thinking they'll be much safer here than in the home they just left."
        - id: ch01-b23
          speaker: mrs_bob_white
          text: "That's exactly why I brought them. While they were still eggs, our old home was the safest place. Now they've hatched and can run around, they wouldn't be safe there for even a minute. Before long, they'll want to go out into the Great World. Then my real worries will begin. Raising such a large family is a great responsibility."
        - id: ch01-b24
          speaker: mrs_peter
          text: "It certainly is."
