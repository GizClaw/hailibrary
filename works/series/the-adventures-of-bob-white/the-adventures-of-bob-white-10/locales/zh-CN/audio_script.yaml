audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，遇到危险时略显慌张
        timbre: 年轻明亮
        pace: 偏快而灵活
        pitch: 中高
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 果断利落，聪明自信，话里带着爽快的锋芒
        timbre: 清脆明亮
        pace: 明快而干脆
        pitch: 中高
    mrs_peter:
      display_name: 彼得太太
      tts:
        delivery: 温和细心，话音里带着沉着和体贴
        timbre: 柔和清亮
        pace: 从容自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 十五个小房客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 待人处处有善意，心里自然常欢喜。
        - id: ch01-b02
          speaker: mrs_peter
          text: |-
            一、二、三、四……哎呀，它们跑得也太快了，我怎么数得过来！每一只都这么招人喜欢。鲍勃太太，你肯带它们来给我们看，我真高兴。到底有多少只呀？
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 彼得和小小的彼得太太一边看，一边怎么也数不清。那群小不点儿跑得飞快，转眼便钻进亲爱的老荆棘丛，藏到了妈妈的翅膀底下。
        - id: ch01-b04
          speaker: mrs_bob
          text: 一共十五只呢。
        - id: ch01-b05
          speaker: narrator
          text: 鲍勃太太答得十分自豪。彼得听见这个数目，吃惊极了。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 我的天，这一家子可真够大的！这么多宝宝，你怎么一个不落地照看好呢？要是换成我，恐怕早就操心得不得了啦。
          emotion: surprised
        - id: ch01-b07
          speaker: mrs_bob
          text: |-
            照料它们，确实很费心。所以我才带着它们搬到老荆棘丛来。

            我们想在这里住一阵子，你和彼得太太不会介意吧？孩子们还没学会飞，我想来想去，再没有比这里更安全的地方了。
        - id: ch01-b08
          speaker: peter_rabbit
          text: |-
            介意？我们高兴还来不及呢！虽说亲爱的老荆棘丛不属于我们，可住了这么久，我们差点儿把它当成自己的了。这里谁都可以来住，而我们最欢迎的，就是你们这一大家子。

            不过，这些宝宝还这么小，你也不可能带着它们走很远。能告诉我，你们是从哪儿来的吗？
    - id: ch02
      title: 近在眼前的家
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小小的鲍勃太太眼里闪起了笑意。
        - id: ch02-b02
          speaker: mrs_bob
          text: 告诉你当然没关系。我们根本没走多远，就是从附近的家里直接过来的。
        - id: ch02-b03
          speaker: narrator
          text: 彼得立刻追问起来。为了找出鹌鹑鲍勃的家，它先前可没少花工夫。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 那你们的家究竟在哪儿呀？
        - id: ch02-b05
          speaker: mrs_bob
          text: 就在那边。过了弯弯小径，那一小片杂草丛就是。你看，离老荆棘丛多近呀。
        - id: ch02-b06
          speaker: narrator
          text: 这个答案实在出乎彼得意料。它吃了一惊，声音一下子高了起来。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 什么？你们一直住得这么近？
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: 鲍勃太太点了点头。
        - id: ch02-b09
          speaker: mrs_bob
          text: 是啊。我每天坐在那里孵蛋，一抬头就能看见你。
        - id: ch02-b10
          speaker: peter_rabbit
          text: |-
            可你怎么敢把窝筑在那种危险的地方？雷迪和狐狸奶奶每天都从你旁边经过，离你才几步远！

            我还从没听过这么荒唐的事！
        - id: ch02-b11
          speaker: narrator
          text: 彼得盯着鲍勃太太，到了这会儿，还是不大敢相信。
    - id: ch03
      title: 最安全的藏身处
      blocks:
        - id: ch03-b01
          speaker: mrs_bob
          text: |-
            荒唐？那明明是绿草地上最安全的地方。兔子彼得，你到现在也该懂了。最安全的藏身处，就是谁都想不到要去找的地方。瞧瞧我的孩子们，这就是最好的证明。

            那些日子，我坐在窝里，看着你、雷迪、狐狸奶奶和臭鼬吉米四处找我，不知道暗暗笑过多少回。我心里清楚，你们谁也不会想到，我竟然会聪明得这样傻，把家安在一个一眼就能发现的地方。所以，你们根本不会去那里找。我果然猜对了。
        - id: ch03-b02
          speaker: narrator
          text: 彼得太太听完，咯咯地笑了。
        - id: ch03-b03
          speaker: mrs_peter
          text: |-
            鲍勃太太，你这主意一点儿也没错。这是我听过最聪明的办法了，亲爱的。

            彼得要是还不觉得自己傻，那它才真该害臊呢。我早就劝过它，别人把家安在哪里，和它一点儿关系也没有。可它偏偏好奇，怎么都不肯停下。谁想得到，你的家从头到尾就在我们旁边！彼得，这下你是不是觉得自己挺傻的？
        - id: ch03-b04
          speaker: peter_rabbit
          text: |-
            是的，亲爱的，我确实觉得自己挺傻。不过现在总算知道答案，我也心满意足了。

            鲍勃太太带着一家子搬来亲爱的老荆棘丛，我真高兴。以后看着这些小家伙慢慢长大，准有意思。而且我怎么想都觉得，这里比它们刚离开的那个家安全多了。
        - id: ch03-b05
          speaker: mrs_bob
          text: |-
            所以我才把它们带来呀。它们还只是蛋的时候，原来的窝最安全。如今它们孵出来了，又会到处跑，再留在那里，连一分钟都不安全。

            现在暂时还好。可过不了多久，它们大概就要闹着出去，看看外面的大千世界了。到了那时候，我才真的要操心呢。养大这么一群孩子，肩上的担子可不轻。
        - id: ch03-b06
          speaker: mrs_peter
          text: 可不是嘛。
