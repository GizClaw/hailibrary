audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and energetic
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    little_bob_white:
      display_name: Little Bob White
      tts:
        delivery: young, wary, and thoughtful
        timbre: light and clear
        pace: gentle
        pitch: high
  chapters:
    - id: ch01
      title: What Happened to the Little Bob White
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The little Bob White kept his eyes squeezed shut as Farmer Brown's boy carried him away. His heart was full of terror. But the boy held him with such care that, after a while, the warmth of that hand began to comfort him. Now and then, the boy softly smoothed the feathers on his little head."
        - id: ch01-b02
          speaker: farmer_browns_boy
          text: "You're a poor little fellow."
        - id: ch01-b03
          speaker: narrator
          text: "Farmer Brown's boy went straight home. There, he washed the little bird's wounds with great care. Then he set the broken bones of the wing back where they belonged. He laid thin strips of wood beside them and bound everything in place so the bones could not slip. It hurt terribly. The little Bob White had no idea what was happening, but he had already suffered so much that this added pain hardly seemed to matter. He never made a sound."
        - id: ch01-b04
          speaker: narrator
          text: "When the boy had finished, he placed the little Bob White in a box. Inside was a bed of soft, clean hay. There was a small dish of water close enough for the bird to reach by stretching out his head, and there was a handful of wheat. Then the boy left him alone. The little bird felt too sick and tired to do anything except settle into the hay and rest. He was still afraid of what might happen. Yet the boy's gentle touch had eased some of that fear. The strange bindings around his body made no sense to him, but much of the aching in his broken wing had faded."
        - id: ch01-b05
          speaker: narrator
          text: "He had been burning with thirst, so he drank the water gratefully. Then he made himself as comfortable as he could and soon fell asleep. Yes, Sir, he really was asleep! Fright and pain had worn him out so completely that he could not keep his eyes open. Farmer Brown's boy returned many times that day to see how he was doing. Each time, the boy moved very gently and whistled very softly. Before long, the little bird's heart no longer went pita-pat with fear."
        - id: ch01-b06
          speaker: narrator
          text: "By the next morning, the little Bob White felt much better. He was up bright and early, and he ate a good breakfast of the wheat the boy had left. Still, it felt very strange not to be able to move his wings. He could not raise them even the tiniest bit. Farmer Brown's boy had tied them against his sides with strips of cloth, so there was no chance for him to try to fly. That gave the broken wing time to heal and grow strong again."
        - id: ch01-b07
          speaker: narrator
          text: "The little Bob White had spent his whole life outdoors, and Farmer Brown's boy knew he could never be truly happy inside the house. So the boy built a wire pen in the henyard. At one end, he made a fine little shelter from pine boughs, where the bird could hide. He set down a small dish of fresh water, scattered wheat over the ground, and carried the little Bob White into the pen."
        - id: ch01-b08
          speaker: narrator
          text: "As soon as the bird was alone, he ran here and there to explore his new home. Nothing was wrong with his legs. After he had made his way around the whole pen, he began to think."
        - id: ch01-b09
          speaker: little_bob_white
          text: "I can't get out. But no one else can get in, either, so I'm safe. That's something to be thankful for. This two-legged creature is nothing like the one with the terrible fire-stick. I'm beginning to like him. I don't have to be afraid of Reddy Fox, Old Man Coyote, or Redtail the Hawk here. I suppose I'm much better off than I would be out on the Green Meadows when I can't fly. Maybe they'll let me go when my wing is well. But where are my father and mother? Where are my brothers and sisters? Did that terrible fire-stick hurt any of them?"
