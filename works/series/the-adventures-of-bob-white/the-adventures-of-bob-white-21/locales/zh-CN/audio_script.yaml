audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 坦率热心，激动时坚定有力
        timbre: 清亮的少年嗓音
        pace: 明快而富有变化
        pitch: 中高
    little_bob_white:
      display_name: 小鹌鹑
      tts:
        delivery: 稚嫩谨慎，渐渐流露出安心与希望
        timbre: 轻柔清脆的幼鸟嗓音
        pace: 稍快而自然
        pitch: 高
  chapters:
    - id: ch01
      title: 温暖的手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小鹌鹑心里怕得要命，一路紧闭着双眼，由布朗农夫家的男孩捧着它往家走。男孩的动作非常轻，手心又暖暖的。过了一会儿，小鹌鹑竟觉得没有那么害怕了。男孩还不时替它轻轻抚平头顶的羽毛。
        - id: ch01-b02
          speaker: farmer_browns_boy
          text: 你真是个可怜的小家伙。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 男孩径直回到家，小心地洗净小鹌鹑的伤口。他把翅膀里的断骨接回原位，再用一根根薄木片固定好，免得骨头错开。他的手已经尽量放轻了，可小鹌鹑还是疼得厉害，也完全不懂男孩在做什么。
        - id: ch01-b04
          speaker: narrator
          text: 不过，它先前已经受了太多苦。眼下再多疼一会儿，好像也不算什么了。它忍着痛，连一声也没有叫。
    - id: ch02
      title: 干草铺成的小床
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 伤口终于处理好了。男孩把小鹌鹑放进一只箱子，里面有柔软干净的干草，还有一小碟水和一把麦粒。那碟水离得很近，小鹌鹑只要伸伸头就能喝到。随后，男孩让它独自留在那里休息。
        - id: ch02-b02
          speaker: narrator
          text: 小鹌鹑病得不轻，也累坏了，只想伏在干草铺成的小床上歇一歇。它仍然担心接下来会发生什么，却不再像先前那样恐惧。男孩轻柔的手让它感到了一点安慰。它不明白身上为什么缠着这些古怪的东西，只知道折断的翅膀没有那么痛了。
        - id: ch02-b03
          speaker: narrator
          text: 它早已渴得浑身发烫，于是感激地喝了些水，又尽量舒服地卧下来，转眼便睡着了。没错，先生，它真的睡着了！又惊又痛地熬了那么久，它实在累得睁不开眼。这一天，布朗农夫家的男孩来了一次又一次，总要看看它好些了没有。他每回都轻手轻脚，还把口哨吹得很轻。慢慢地，小鹌鹑的心终于不再吓得怦怦乱跳。
    - id: ch03
      title: 不能动的翅膀
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了第二天早晨，小鹌鹑已经好多了。它早早起身，把留下的麦粒吃了个饱。可是，两只翅膀怎么一点也动不了？别说抬起来，连一丁点儿都挪不动。这可真古怪。
        - id: ch03-b02
          speaker: narrator
          text: 原来，布朗农夫家的男孩用布条把它的翅膀缚在身体两边，叫它连试飞都不能试。只有这样，那只折断的翅膀才能重新长好，再恢复原来的力气。
    - id: ch04
      title: 围栏里的新家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小鹌鹑从出生起就一直生活在户外。男孩明白，要是把它留在屋里，它怎么也不会真正快活。于是，他在鸡场里围了一座铁丝网小围栏，又在一头用松树枝搭起一座舒适的小棚子，让小鹌鹑随时都能藏在下面。他放好一小碟清水，又把麦粒撒在地上，这才将小鹌鹑送进围栏。
        - id: ch04-b02
          speaker: narrator
          text: 等到四周没人了，小鹌鹑马上跑来跑去，把新家仔细看了一遍。它的翅膀虽然受了伤，两条腿可一点毛病也没有。
        - id: ch04-b03
          speaker: little_bob_white
          text: 我出不去，可别人也进不来呀。这样我就安全了，这件事值得高兴。这个两脚怪物和拿可怕喷火棍的家伙一点也不一样，我已经开始喜欢他了。
        - id: ch04-b04
          speaker: little_bob_white
          text: 待在这里，我不用害怕红狐雷迪、老郊狼或红尾鹰。我现在又不能飞，这可比独自留在绿草原上好多了。也许等翅膀长好，他们就会放我走。
        - id: ch04-b05
          speaker: little_bob_white
          text: 不知道爸爸、妈妈和兄弟姐妹们都去了哪里。那根可怕的喷火棍，有没有打伤他们中的谁呢？
