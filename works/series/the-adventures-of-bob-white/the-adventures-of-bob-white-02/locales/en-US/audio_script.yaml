audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    bob_white:
      display_name: Bob White
      tts:
        delivery: bright and cheerful
        timbre: clear and ringing
        pace: brisk
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: quick and expressive
        timbre: light and youthful
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: smooth and sly
        timbre: warm and narrow
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Bob White Has Visitors
      blocks:
        - id: ch01-b01
          speaker: bob_white
          text: "Bob White! Bob White! I bid the world good cheer! Bob White! Bob White! I whistle loud and clear!"
        - id: ch01-b02
          speaker: narrator
          text: "That very morning, Bob White had happened over near the dear Old Briar-patch where Peter Rabbit lived. Peter had no idea Bob meant to stay nearby. For that matter, Bob probably had not known it himself. He had simply wandered that way and found that he liked the place. At last, he decided to look around for a spot where he could make his home."
        - id: ch01-b03
          speaker: narrator
          text: "Peter had known Bob for a long time. While roaming around, he had met Bob many times, and the two would always stop and chat. Whenever Peter heard that clear whistle from anywhere close enough, he made a point of calling on Bob. Bob was such a cheerful fellow that even a word or two with him left Peter feeling better."
        - id: ch01-b04
          speaker: narrator
          text: "So when Peter heard Bob whistle that spring morning, he hurried over to call on him, lipperty-lipperty-lip. The sound had come from close by, so Peter did not have far to go. Bob was perched on a fence post just beyond the Old Briar-patch."
        - id: ch01-b05
          speaker: peter_rabbit
          text: "Good morning, Bob. You're certainly cheerful today."
        - id: ch01-b06
          speaker: bob_white
          text: "Why shouldn't I be? I'm cheerful every day. That's the best way to get along in this world."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "Maybe you just don't have much to worry about. If you had to run for your life as often as I do, being cheerful might not come so easily."
        - id: ch01-b08
          speaker: narrator
          text: "Bob listened, and his bright little eyes began to twinkle. Peter seemed to think he was the only one with troubles."
        - id: ch01-b09
          speaker: bob_white
          text: "A lot of people think no one has worries except them. Look, Reddy Fox is coming this way. What do you think he wants?"
        - id: ch01-b10
          speaker: peter_rabbit
          text: "He wants me!"
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: "Peter answered at once. As he spoke, he got ready to race for the safety of the Old Briar-patch."
        - id: ch01-b12
          speaker: bob_white
          text: "No, he doesn't. Don't think you're so important, Peter. Reddy doesn't even know you're here. He heard me whistle, and he wants to catch me by surprise. He's after me, not you. So why are you rushing off?"
        - id: ch01-b13
          speaker: peter_rabbit
          text: "I—I think I should go now. I'll visit again when you don't have company!"
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: "Peter called the words over his shoulder. He was already hurrying back toward the dear Old Briar-patch."
        - id: ch01-b15
          speaker: narrator
          text: "Peter had barely reached the dear Old Briar-patch when Reddy Fox arrived at the fence where Bob was sitting. Reddy had heard the whistle too. Now he tried to make his voice sound as pleasant as he could."
        - id: ch01-b16
          speaker: reddy_fox
          text: "Good morning, Bob. I'm so glad to see you here. When I heard your whistle, I hurried over to welcome you. I hope you like this place enough to make it your home."
        - id: ch01-b17
          speaker: narrator
          text: "Bob's eyes twinkled more than ever. He knew why Reddy hoped he would settle there. Reddy wanted to discover Bob's home someday and make a good dinner out of Quail."
        - id: ch01-b18
          speaker: bob_white
          text: "How kind of you. It is pleasant here, and I may decide to stay. Everyone seems very neighborly. Peter Rabbit just stopped by."
        - id: ch01-b19
          speaker: narrator
          text: "Reddy looked all around in a sly way, with hunger showing in his eyes."
        - id: ch01-b20
          speaker: reddy_fox
          text: "Peter is always such a good neighbor. Is he still nearby? I'd like to give him my regards."
        - id: ch01-b21
          speaker: bob_white
          text: "No, Peter left in quite a hurry. Oh, look! Here comes Old Man Coyote. The neighbors here certainly are friendly. Why are you rushing off, Reddy?"
        - id: ch01-b22
          speaker: narrator
          text: "Reddy shot a quick glance toward Old Man Coyote."
        - id: ch01-b23
          speaker: reddy_fox
          text: "I have some important business to take care of over in the Green Forest. I hope I'll see you often, Bob."
        - id: ch01-b24
          speaker: bob_white
          text: "I hope so too."
        - id: ch01-b25
          speaker: narrator
          text: "Bob's answer was polite. He kept his final thought under his breath."
        - id: ch01-b26
          speaker: bob_white
          text: "But I hope I see you first."
