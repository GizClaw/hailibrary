audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    bob_white:
      display_name: 鹌鹑鲍勃
      tts:
        delivery: 快活机敏，从容中带着俏皮
        timbre: 清亮爽朗
        pace: 轻快而清楚
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，遇到危险时略显慌张
        timbre: 年轻明亮
        pace: 偏快而灵活
        pitch: 中高
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 表面亲切，话里藏着狡猾的试探
        timbre: 圆滑偏低
        pace: 从容，紧张时稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 新来的邻居
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            “鲍勃——怀特！鲍勃——怀特！愿世上人人欢喜！鲍勃——怀特！鲍勃——怀特！我的口哨又响又清晰！”
        - id: ch01-b02
          speaker: narrator
          text: |-
            就在那天早晨，鹌鹑鲍勃忽然想搬到老荆棘丛附近来住。兔子彼得就住在那里，可他当然不知道鲍勃来了。说起来，就连鲍勃自己，原先大概也没想到会住在这里。它只是偶然来到这一带，越看越喜欢，最后才拿定主意，要四处仔细找找，挑个合适的地方安家。
        - id: ch01-b03
          speaker: narrator
          text: |-
            彼得认识鲍勃已经很久了。他四处闲逛时碰见过鲍勃好几回，两位每次遇见都会停下来问候。只要听见鲍勃在不太远的地方吹口哨，彼得总会特意过去看看。这个快活的家伙有一种本事，哪怕只跟它聊上一两句，彼得的心情也会好起来。

            所以，那天春天的早晨，哨声一响，彼得就一蹦一跳地赶去拜访。他用不着走多远，鲍勃正坐在老荆棘丛附近的一根篱笆桩上等着呢。
        - id: ch01-b04
          speaker: peter_rabbit
          text: |-
            早上好！你今天心情可真不错。
        - id: ch01-b05
          speaker: bob_white
          text: |-
            为什么不快活呢？我一直都是这样。想在这个世界上好好过日子，只有让自己快活些才行。
        - id: ch01-b06
          speaker: peter_rabbit
          text: |-
            那是因为你没有多少烦恼吧。你要是也像我一样，三天两头就得拼命逃命，恐怕就没那么容易天天快活了。
        - id: ch01-b07
          speaker: narrator
          text: |-
            鲍勃明亮的小眼睛闪了闪。
        - id: ch01-b08
          speaker: bob_white
          text: |-
            好多人的毛病就在这里，总觉得天底下只有自己才有烦恼。你瞧，狐狸雷迪正朝这边来呢。你猜它来这儿是为了什么？
    - id: ch02
      title: 雷迪来了
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: |-
            它一定是来抓我的！
          emotion: fearful
        - id: ch02-b02
          speaker: narrator
          text: |-
            彼得立刻叫出了声，一边说，一边已经准备转身逃回老荆棘丛。
        - id: ch02-b03
          speaker: bob_white
          text: |-
            根本不是这么回事。彼得，别以为自己有那么重要。雷迪压根儿不知道你也在这里。它是听见了我的口哨，才想过来打我一个措手不及。它盯上的是我，不是你。你这么急着走干什么？
        - id: ch02-b04
          speaker: peter_rabbit
          text: |-
            我——我还是先走吧！等你没有别的客人，我再来看你！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: |-
            彼得边跑边回头大声喊。它才刚钻进亲爱的老荆棘丛，狐狸雷迪就赶到了鲍勃坐着的篱笆边。雷迪竭力让自己的声音听起来亲切极了。
        - id: ch02-b06
          speaker: reddy_fox
          text: |-
            早上好！能在这儿见到你，我可真高兴。我一听见口哨，就赶过来欢迎你。希望你特别喜欢这里，干脆留下来安个家。
    - id: ch03
      title: 热心的客人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            鲍勃的眼睛闪得比刚才更厉害了。它心里明白得很，雷迪为什么那么盼着自己在这里安家。雷迪想找到那个家，好在将来的某一天拿鹌鹑美美地吃上一顿。
        - id: ch03-b02
          speaker: bob_white
          text: |-
            你真是太客气了。这里确实挺不错，说不定我真的会留下呢。这里的每一位邻居看起来都很热心，兔子彼得刚刚还来拜访过我。
        - id: ch03-b03
          speaker: narrator
          text: |-
            雷迪狡猾地四下张望，眼睛里还露出一股馋相。
        - id: ch03-b04
          speaker: reddy_fox
          text: |-
            彼得一向很热心。他现在还在附近吗？我正想去跟他打个招呼呢。
        - id: ch03-b05
          speaker: bob_white
          text: |-
            不在了。彼得走得挺匆忙。嘿，老郊狼先生来了！这里的邻居果然都很热心。咦，雷迪，你怎么也急着走？
        - id: ch03-b06
          speaker: narrator
          text: |-
            雷迪连忙朝老郊狼先生来的方向瞥了一眼。
        - id: ch03-b07
          speaker: reddy_fox
          text: |-
            绿森林那边还有几件要紧事，等着我去处理。希望以后常常见到你，鹌鹑鲍勃。
        - id: ch03-b08
          speaker: bob_white
          text: |-
            我也这么希望。
        - id: ch03-b09
          speaker: narrator
          text: |-
            鲍勃客客气气地答完，又压低了声音。
        - id: ch03-b10
          speaker: bob_white
          text: |-
            不过，我希望每次都是我先看见你。
