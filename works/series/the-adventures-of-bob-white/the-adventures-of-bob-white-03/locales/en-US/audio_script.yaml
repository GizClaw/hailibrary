audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    bob_white:
      display_name: Bob White
      tts:
        delivery: bright and cheerful
        timbre: clear and ringing
        pace: brisk
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and impulsive
        timbre: youthful and light
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Bob Decides to Build a Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Old Man Coyote's call sounded very much like Reddy Fox's. He was as pleasant and polite as anyone could be. He told Bob White how glad he was that Bob had come to the Green Meadows, and how much he hoped Bob would stay. Bob was just as polite in return, but Old Man Coyote did not fool him. Bob had received much the same welcome from Reddy Fox. He knew why the old fellow was so pleased. Like Reddy, Old Man Coyote hoped to catch Bob one fine day."
        - id: ch01-b02
          speaker: narrator
          text: "Bob did not let that little matter trouble him. He had been hunted for as long as he could remember, so he knew how to look after himself. That was why he had taken care to sit on a fence post while he whistled. Neither Old Man Coyote nor Reddy Fox could reach him up there. But just after the coyote left, Bob saw someone else coming his way. This time, he did not wait to exchange polite greetings. Redtail the Hawk was coming, and a fence post was no place to receive a call from him."
        - id: ch01-b03
          speaker: narrator
          text: "Bob spread his wings and flew across to the dear Old Briar-patch. He dropped among the brambles, close to where Peter Rabbit was sitting."
        - id: ch01-b04
          speaker: bob_white
          text: "You didn't think I'd return your call this soon, did you, Peter?"
        - id: ch01-b05
          speaker: peter_rabbit
          text: "No, but I'm ever so glad you came. Did you have a nice visit with Reddy Fox?"
        - id: ch01-b06
          speaker: bob_white
          text: "Oh, very nice. He was ever so pleased to see me, and so was Old Man Coyote. I didn't stay to hear what Old Redtail had to say. Somehow, I think he would rather have seen me from much closer."
        - id: ch01-b07
          speaker: narrator
          text: "Bob gave a chuckle, then went on."
        - id: ch01-b08
          speaker: bob_white
          text: "You see, Peter, you aren't the only one who must keep his eyes open and his wits about him every minute. Just as many hunters are looking for me as for you. Even so, I won't let that make me any less cheerful. Whenever I whistle, I know someone will hear and come looking for me. Still, I whistle anyway. I simply have to. Life has its troubles, but it is worth living, and it is full of happiness too. Now, I have a secret to tell you."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "What is it?"
        - id: ch01-b10
          speaker: narrator
          text: "Peter leaned in eagerly, but Bob had one condition."
        - id: ch01-b11
          speaker: bob_white
          text: "Promise you won't tell a single soul."
        - id: ch01-b12
          speaker: peter_rabbit
          text: "Can't I tell Mrs. Peter? You know I never keep secrets from her."
        - id: ch01-b13
          speaker: bob_white
          text: "You may tell her, but she must promise to keep it secret too."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "I'll promise for both of us. Now, what is it?"
        - id: ch01-b15
          speaker: bob_white
          text: "I've decided to come over here and live."
        - id: ch01-b16
          speaker: peter_rabbit
          text: "Right here in the Old Briar-patch?"
          emotion: surprised
        - id: ch01-b17
          speaker: bob_white
          text: "No, but it will be nearby. I'm going back to the Old Pasture to get Mrs. Bob. Then we'll build a home right away."
        - id: ch01-b18
          speaker: peter_rabbit
          text: "Goody! Where will you build it?"
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: "Peter clapped his hands."
        - id: ch01-b20
          speaker: bob_white
          text: "Mrs. Bob will decide that."
        - id: ch01-b21
          speaker: peter_rabbit
          text: "And once she decides, you'll tell me where your new home is, won't you? Then I can come over and visit you there."
        - id: ch01-b22
          speaker: bob_white
          text: "That depends. You know, some things are better left unknown."
        - id: ch01-b23
          speaker: peter_rabbit
          text: "No, I don't know that at all. I'm your friend. What harm could it do if I knew where your home was?"
        - id: ch01-b24
          speaker: bob_white
          text: "Friends sometimes do the most harm without meaning to, especially when they talk too much. The way is clear now, so I must hurry back to the Old Pasture. I want to tell Mrs. Bob how nice it is here."
        - id: ch01-b25
          speaker: narrator
          text: "With that, Bob flew away. Peter stayed where he was, muttering to himself."
        - id: ch01-b26
          speaker: peter_rabbit
          text: "What did he mean about friends who talk too much? Could he have meant me?"
