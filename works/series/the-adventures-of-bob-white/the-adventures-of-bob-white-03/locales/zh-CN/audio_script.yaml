audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    bob_white:
      display_name: 鹌鹑鲍勃
      tts:
        delivery: 快活机敏，从容中带着俏皮
        timbre: 清亮爽朗
        pace: 轻快而清楚
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，遇到危险时略显慌张
        timbre: 年轻明亮
        pace: 偏快而灵活
        pitch: 中高
  chapters:
    - id: ch01
      title: 又一位热心的客人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            老郊狼先生的问候，听起来跟狐狸雷迪的那一套很像。它客气极了，说鲍勃来到绿草地，真叫它高兴，还一心盼着鲍勃能留下。要论彬彬有礼，谁也胜不过它。

            鹌鹑鲍勃待它也同样客气，可它会上当吗？才不会呢。它很清楚，老郊狼先生跟雷迪一样，见到自己这么高兴，不过是盼着哪天能抓住自己。
        - id: ch01-b02
          speaker: narrator
          text: |-
            鲍勃没让这点小事搅坏心情。打从记事起，它就过着有人追捕的日子。所以在吹响口哨以前，它早就留了个心眼，特意选中篱笆桩这个安全位置。待在那么高的地方，老郊狼先生够不着它，狐狸雷迪也够不着。

            老郊狼先生刚走，又有一个家伙直奔鲍勃这边来了。这一次，鲍勃可不肯留下来等对方开口。来的是红尾鹰，对它来说，篱笆桩可不是个适合会客的地方。
        - id: ch01-b03
          speaker: narrator
          text: |-
            鲍勃展开翅膀，飞到亲爱的老荆棘丛，落进一片荆棘里。兔子彼得正坐在附近。
        - id: ch01-b04
          speaker: bob_white
          text: |-
            彼得，没想到我这么快就来回访你吧？
        - id: ch01-b05
          speaker: peter_rabbit
          text: |-
            是没想到。不过能见到你，我还是高兴极了。狐狸雷迪来拜访你，那一趟还愉快吗？
        - id: ch01-b06
          speaker: bob_white
          text: |-
            愉快得很。它见到我可高兴了，老郊狼先生也是一样。至于老红尾，我没等着听它会说什么。不过我猜，要是能离我近一点，它一定看得更高兴。
        - id: ch01-b07
          speaker: narrator
          text: |-
            鲍勃说着，轻声笑了起来。
    - id: ch02
      title: 鲍勃的秘密
      blocks:
        - id: ch02-b01
          speaker: bob_white
          text: |-
            彼得，不是只有你才得时时睁大眼睛，处处机灵。想抓我的家伙，不比想抓你的少，可我不会为了这个少快活一点。每次吹口哨，我都知道准会有谁循声来找我，但我还是照样吹。我非吹不可。生活就算有那么多麻烦，也还是值得好好过，里面照样装满了快乐。

            对了，现在我有个秘密要告诉你。
        - id: ch02-b02
          speaker: peter_rabbit
          text: |-
            什么秘密？
        - id: ch02-b03
          speaker: narrator
          text: |-
            彼得一下子来了精神。鲍勃先叮嘱它。
        - id: ch02-b04
          speaker: bob_white
          text: |-
            你得答应我，谁也不告诉。
        - id: ch02-b05
          speaker: peter_rabbit
          text: |-
            连彼得太太也不能说吗？你知道的，我从来不瞒她秘密。
        - id: ch02-b06
          speaker: bob_white
          text: |-
            好吧，你可以告诉她，不过她也得答应保守秘密。
        - id: ch02-b07
          speaker: peter_rabbit
          text: |-
            那我替她答应，我自己也郑重答应。我们都会守住秘密。快说吧，到底是什么秘密？
        - id: ch02-b08
          speaker: bob_white
          text: |-
            我已经决定搬到这里来住了。
        - id: ch02-b09
          speaker: peter_rabbit
          text: |-
            就住在老荆棘丛里吗？
          emotion: surprised
        - id: ch02-b10
          speaker: bob_white
          text: |-
            不住在这里，不过离这儿不远。我要回老牧场接鲍勃太太，然后我们马上就安个家。
    - id: ch03
      title: 家要安在哪里
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: |-
            太好啦！那你们打算把家安在哪里？
          emotion: happy
        - id: ch03-b02
          speaker: narrator
          text: |-
            彼得高兴得拍起了手。
        - id: ch03-b03
          speaker: bob_white
          text: |-
            这个嘛，得由鲍勃太太决定。
        - id: ch03-b04
          speaker: peter_rabbit
          text: |-
            等她决定了，你会告诉我家在哪儿，让我过去拜访，对不对？
        - id: ch03-b05
          speaker: bob_white
          text: |-
            那可不一定。有些事情，还是不知道的好。
        - id: ch03-b06
          speaker: peter_rabbit
          text: |-
            我可不明白。我是你的朋友呀！让我知道你家在哪儿，能有什么坏处？
        - id: ch03-b07
          speaker: bob_white
          text: |-
            朋友不是故意的，却有时候最会带来麻烦，尤其是话太多的朋友。现在一路上没人了，我得赶紧回老牧场，告诉鲍勃太太这里有多好。
        - id: ch03-b08
          speaker: narrator
          text: |-
            话一说完，鲍勃就飞走了。彼得留在原地，小声嘟囔起来。
        - id: ch03-b09
          speaker: peter_rabbit
          text: |-
            话太多的朋友？它这是什么意思？该不会是在说我吧？
