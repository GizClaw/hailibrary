audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    hunter:
      display_name: 猎人
      tts:
        delivery: 随意而自鸣得意
        timbre: 结实粗朴
        pace: 不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 猎人的如意算盘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 事情还没有十足把握，就千万别先打如意算盘。到手的东西，往往比盼望的少，极少会比盼望的多。
        - id: ch01-b02
          speaker: narrator
          text: 猎人打中了鲍勃的一个孩子，暗自笑了起来。其实，他根本不缺这一口吃的，别的食物还多着呢。他只是把这叫作“乐趣”。他高高兴兴地走上前，准备捡起那只可怜的棕色小鸟。
        - id: ch01-b03
          speaker: narrator
          text: 鲍勃一家会有多难过，猎人连想也没有想过。也许他根本不觉得这些小鸟也有感受。他只顾着得意，觉得自己这一枪打得准，还想着马上能吃到这只小鸟。
        - id: ch01-b04
          speaker: narrator
          text: 可是，他走到小鹌鹑掉下去的地方一看，那里什么小鸟也没有。真的没有。地上除了几根羽毛，连它的影子都找不着。
        - id: ch01-b05
          speaker: narrator
          text: 原来，猎人的那一枪没有打死小鹌鹑，只打断了它一边翅膀，让它再也飞不起来。可它的腿没有受伤。身子一落地，它就拼命从麦茬中间跑走了。猎人还在原地寻找，它却早已不在那里。
    - id: ch02
      title: 沙地边的旧屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猎狗也跟着找。它的鼻子十分灵敏，很快闻到了小鹌鹑留下的气味，急匆匆地一路追过去。
        - id: ch02-b02
          speaker: narrator
          text: 说来也巧，小鹌鹑落地的地方附近，正好有一座土拨鼠约翰尼废弃的旧屋。门洞周围铺着一片沙地，而沙子留不住气味。
        - id: ch02-b03
          speaker: narrator
          text: 小鹌鹑年纪还小，鹌鹑该懂的事情，它还没有全学会，当然不知道沙子的用处。不过，它看见了敞开的门洞，便跑过黄沙，钻进门里，又顺着通道往下跑了一小段。
        - id: ch02-b04
          speaker: narrator
          text: 通道里有几片被风吹进来的干枯棕叶。小鹌鹑躲到叶子下面，紧贴地面伏好，又把羽毛紧紧收在身上。它本来就和枯叶差不多是一个颜色，这么一藏，更难被看见了。
        - id: ch02-b05
          speaker: narrator
          text: 它自己还不知道，这样做有多聪明。羽毛贴住身体，气味就不容易散出来。猎狗那只灵敏的鼻子，也就没法知道它躲在哪里。
    - id: ch03
      title: 失望的猎人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猎狗追到沙地边缘，气味一下就断了。它和猎人谁也没有想到，要往那个废弃的洞里看一看。他们找来找去，小鹌鹑始终伏在那里，一动也不动。
        - id: ch03-b02
          speaker: narrator
          text: 它断掉的翅膀疼得厉害，痛得眼里满是泪水。猎人终于不找了。因为，他已经急着想去杀更多的小鸟。
        - id: ch03-b03
          speaker: hunter
          text: 看来只是把它打伤了。八成会让狐狸叼走。下一只，我准能打死！
        - id: ch03-b04
          speaker: narrator
          text: 猎人说这话时，根本没有想过受伤会有多痛苦。说完，他就让猎狗继续往前，去寻找小鹌鹑的兄弟姐妹。自己端好那杆可怕的猎枪，只要看见其中任何一只，就准备立刻开火。
        - id: ch03-b05
          speaker: narrator
          text: 这位猎人觉得自己玩得十分痛快。可是，在土拨鼠约翰尼旧屋的通道里，那只棕色的小鹌鹑正虚弱地躺着。伤痛折磨着它，刚才那场可怕的惊吓也还没有过去。
        - id: ch03-b06
          speaker: narrator
          text: 光是受这么一场惊吓，就已经够糟了。如今它的一边翅膀又断了，觉得自己毫无办法。你还能想出比这更糟的事吗？
