audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    hunter:
      display_name: Hunter
      tts:
        delivery: careless and self-satisfied
        timbre: firm and rough
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Disappointed Hunter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "It never does to count upon a thing until you're sure. It's often less than you expect, but very seldom more."
        - id: ch01-b02
          speaker: narrator
          text: "The hunter who had shot one of Bob White's children chuckled. Of course, he didn't need that little bird at all. He already had plenty of other things to eat."
        - id: ch01-b03
          speaker: narrator
          text: "Still, he went forward eagerly to pick up the poor little brown bird. This was what he called sport. He never stopped to wonder how the Bob Whites must feel. Most likely, he didn't believe they had feelings. He was pleased with his successful shot, and pleased that he would have the little bird to eat."
        - id: ch01-b04
          speaker: narrator
          text: "But when he reached the spot where he had seen the little Bob White fall, the bird wasn't there. No, Sir. He found nothing but a few feathers."
        - id: ch01-b05
          speaker: narrator
          text: "You see, the hunter hadn't killed the little Bob White as he supposed. He had broken one wing, so the bird could no longer fly. But his legs were unharmed. The moment he struck the ground, he ran through the stubble as fast as he could. By the time the hunter began looking, the little Bob White was somewhere else entirely."
        - id: ch01-b06
          speaker: narrator
          text: "The hunter's dog joined the search. His wonderful nose soon caught the little Bob White's scent, and he followed it eagerly."
        - id: ch01-b07
          speaker: narrator
          text: "Near the place where the bird had fallen stood an old home of Johnny Chuck. Sand lay spread all around its entrance, and sand does not hold a scent. The young Bob White knew nothing about that. He had not lived long enough to learn everything a Bob White needs to know. But he did see the open doorway."
        - id: ch01-b08
          speaker: narrator
          text: "He dashed across the yellow sand, through the doorway, and a little way down the hall. There he hid beneath some dry brown leaves that had blown inside. His own color was almost the same as theirs. He crouched close to the ground and pulled his feathers tight against his body."
        - id: ch01-b09
          speaker: narrator
          text: "That was a very wise thing to do, although he didn't know it. With his feathers pressed close, he gave off less of the scent that might have led the dog's keen nose straight to him."
        - id: ch01-b10
          speaker: narrator
          text: "The dog lost the trail at the edge of the sand. Neither the dog nor the hunter thought of looking inside the old hole. They hunted and hunted while the little Bob White stayed perfectly still. His broken wing hurt dreadfully, and the aching pain filled his eyes with tears."
        - id: ch01-b11
          speaker: narrator
          text: "At last, the hunter stopped searching. He was too impatient to wait when he could be trying to kill another bird."
        - id: ch01-b12
          speaker: hunter
          text: "I guess I only wounded him. A fox will probably get him. I'll bet I kill the next one!"
        - id: ch01-b13
          speaker: narrator
          text: "He never once thought how dreadful it must be to lie there wounded. Instead, he sent his dog ahead to find the little Bob White's brothers and sisters. He carried his terrible gun ready to fire the instant one of them appeared."
        - id: ch01-b14
          speaker: narrator
          text: "The hunter believed he was having great sport. Meanwhile, in the hall of Johnny Chuck's old house, a little brown Bob White lay weak with pain and terrible fright. Such a fright would have been bad enough by itself. But his wing was broken too, and that left him feeling completely helpless. Can you imagine anything worse?"
