audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    bob_white:
      display_name: 鹌鹑鲍勃
      tts:
        delivery: 快活机敏，从容中带着俏皮
        timbre: 清亮爽朗
        pace: 轻快而清楚
        pitch: 中高
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 果断利落，聪明自信，话里带着爽快的锋芒
        timbre: 清脆明亮
        pace: 明快而干脆
        pitch: 中高
  chapters:
    - id: ch01
      title: 谁来挑选新家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            美丽的春天到了，鹌鹑鲍勃从老牧场接来鲍勃太太，带她下到绿草地。她一看这里，果然像鲍勃盼望的那样喜欢。

            其实，鲍勃心里早就挑好了地方。可它很聪明，一个字也没说。它知道，要让鲍勃太太满意，就得让她觉得，这个家是她亲自选的。老荆棘丛附近有多美，它也没提，只让她自己去发现。
        - id: ch01-b02
          speaker: narrator
          text: |-
            鲍勃太太正急着安顿下来。一到绿草地，她就认定，再也没有比这里更适合安家的地方了。

            这里景色漂亮，而鲍勃太太很有眼光，最懂得欣赏美景。吃的东西也多，将来有一群小嘴等着喂饱，这一点可太要紧了。这里还有许多藏身的好地方。更何况，她也喜欢这些邻居。
        - id: ch01-b03
          speaker: narrator
          text: |-
            鲍勃听了心里直乐，却没让太太看出来。它摆出一副认真的样子，说狐狸奶奶、狐狸雷迪、老郊狼先生和红尾鹰很快就会发现它们住在这里。那样一来，危险会一直跟在身边，它们就别想过上不操心的日子了。
        - id: ch01-b04
          speaker: mrs_bob
          text: |-
            这也不会比去年住在老牧场时更危险！你明明知道，不管我们把家安在哪里，危险都少不了。以前是这样，以后大概也一样。我们从前能骗过那些敌人，这一次照样能。就算你害怕，我也不怕。
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: |-
            鲍勃连忙解释，说自己才没有害怕。它可不愿让太太那样想。哎呀，当然不是！它只是把危险都说清楚，免得它们不小心出了岔子。
    - id: ch02
      title: 离小径最近的地方
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            鲍勃太太根本没顾上听完。她忙着到处查看，这里跑跑，那里瞧瞧，一双锐利的小眼睛不肯漏掉任何角落。

            鲍勃耐心地等着，眼里却藏着笑。它知道，太太只要拿定了主意，事情也就定了。没过多久，鲍勃太太低声叫它过去。鲍勃马上飞到了她身边。
        - id: ch02-b02
          speaker: mrs_bob
          text: |-
            我们就在这里安家。
        - id: ch02-b03
          speaker: narrator
          text: |-
            鲍勃挑剔地把周围看了一遍，这才开口。
        - id: ch02-b04
          speaker: bob_white
          text: |-
            亲爱的，这里是不是离弯弯小径太近了？狐狸雷迪和臭鼬蒂米经常走这条路，布朗农夫家的男孩也常来呀。
        - id: ch02-b05
          speaker: mrs_bob
          text: |-
            你这个傻瓜，离小径这么近，这里才是绿草地上最安全的地方！它们天天从这里经过，反倒想不到我们的家就藏在路边。

            你看看，这些野草这么密，能把窝遮得严严实实。那根倒下的旧篱笆桩，还能替我们护住一边。老荆棘丛也就在近旁，真有危险，我们很快就能钻进去，到了那里便安全了。
    - id: ch03
      title: 把敌人引到远处
      blocks:
        - id: ch03-b01
          speaker: mrs_bob
          text: |-
            鹌鹑鲍勃，你听好。只要你肯动动脑筋，跑到远处去吹口哨，谁也不会想到来这里找我们的窝。雷迪和那些家伙听见你的哨声，都会去你吹口哨的地方搜寻。所以，要把这里变成全世界最安全的地方，可就看你的了。明白吗？
        - id: ch03-b02
          speaker: narrator
          text: |-
            鲍勃听懂了太太的巧计，回答时温顺极了。
        - id: ch03-b03
          speaker: bob_white
          text: |-
            明白了，亲爱的。你真聪明，也真有办法。这样的地方，我自己怎么也想不到。不过我看，你说得完全没错。
        - id: ch03-b04
          speaker: mrs_bob
          text: |-
            我当然没错。现在，你飞到老荆棘丛另一边去吹口哨，我留在这里干活。我真想马上就开始。
        - id: ch03-b05
          speaker: narrator
          text: |-
            鲍勃佩服地望着棕褐色的小妻子。接着，它小心地躲在野草下面往前跑，一直跑到可以放心起飞的地方。然后，它展开翅膀，飞到亲爱的老荆棘丛另一边，吹起了口哨。那哨声吹得真好听，只有鹌鹑鲍勃才吹得出来。
