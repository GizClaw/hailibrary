  chapters:
    - id: ch01
      title: The Cunning of Mr. and Mrs. Bob White
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "In the beautiful springtime, Bob White brought Mrs. Bob down from the Old Pasture to the Green Meadows. She was every bit as delighted as he had hoped."
        - id: ch01-b02
          speaker: narrator
          text: "Bob already thought this was the best place anywhere for their new home. But he wisely kept that thought to himself. Mrs. Bob would never be satisfied unless she believed she had chosen the place. So he gave her no hint that he had a home in mind. He did not even tell her how lovely the Green Meadows were beside the dear Old Briar-patch. He simply let her discover that for herself."
        - id: ch01-b03
          speaker: narrator
          text: "Mrs. Bob was eager to begin housekeeping. The moment she reached the Green Meadows, she decided that this was the very place for a home. First, it was beautiful, and Mrs. Bob had an eye for beauty. Then there was plenty to eat. That mattered very much when they might soon have a great many little mouths to feed. There were good hiding places too. And, finally, Mrs. Bob liked the neighbors."
        - id: ch01-b04
          speaker: narrator
          text: "Bob was tickled, but he was careful not to show it. With a very serious manner, he reminded her that Granny Fox, Reddy Fox, Old Man Coyote, and Red-tail the Hawk would soon find out they lived there. Danger would always be close, he said, and they would never be entirely free from worry."
        - id: ch01-b05
          speaker: mrs_bob_white
          text: "It won't be any more dangerous than the Old Pasture where we built last year. You know perfectly well that we'll face danger wherever we make our home. It has always been that way, and I suppose it always will be. We've fooled our enemies before because we were clever enough, and we can fool them again. I'm not afraid, even if you are."
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: "Bob quickly told her that he was not afraid. He would not have Mrs. Bob believe that for anything in the world. Oh, no! He was only warning her about the dangers so they would make no mistake."
        - id: ch01-b07
          speaker: narrator
          text: "Mrs. Bob hardly listened. She was far too busy searching. She poked around, ran this way and that, and kept her sharp little eyes working all the while. Bob waited patiently with a twinkle in his eyes. He knew that once Mrs. Bob made up her mind, the matter was settled. Before long, she called softly to him, and he flew over to her."
        - id: ch01-b08
          speaker: mrs_bob_white
          text: "Here it is. This is where we'll build."
        - id: ch01-b09
          speaker: narrator
          text: "Bob studied the ground with a careful, critical eye."
        - id: ch01-b10
          speaker: bob_white
          text: "Don't you think this spot is a little too close to the Crooked Little Path, my dear? I've often seen Reddy Fox and Timmy Skunk using that path. And Farmer Brown's boy comes along here too."
        - id: ch01-b11
          speaker: mrs_bob_white
          text: "Why, that's exactly what makes this the safest spot on the Green Meadows, stupid. They'll never imagine that our home could be so close to the path they use. The weeds here are thick enough to hide our nest completely. And this old fence-post lying on the ground will protect us on one side."
        - id: ch01-b12
          speaker: mrs_bob_white
          text: "The Old Briar-patch is close by too. If we need it, we can hurry over there and be perfectly safe. Mark my words, Bob White. No one will ever think of searching here for our nest, as long as you use some common sense and do all your whistling far enough away."
        - id: ch01-b13
          speaker: mrs_bob_white
          text: "Reddy and the others will hunt around the place where they hear you whistle. That means you can make this the safest place in the whole world. Now do you understand?"
        - id: ch01-b14
          speaker: bob_white
          text: "Yes, my dear. You're very clever and very cunning. I would never have thought of choosing a place like this, but I believe you're quite right."
        - id: ch01-b15
          speaker: mrs_bob_white
          text: "I know I'm right. Now fly to the far side of the Old Briar-patch and whistle over there while I start working here. I want to get busy right away."
        - id: ch01-b16
          speaker: narrator
          text: "Bob looked at his little brown wife with admiration. Then he wisely ran beneath the weeds and grass until he was sure it was safe to fly. After that, he crossed to the other side of the dear Old Briar-patch. Once he was there, he began to whistle as only Bob White can."
