audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 表面亲切，话里藏着狡猾的试探
        timbre: 圆滑偏低
        pace: 从容，紧张时稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 为了爱情，也为了战争
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            常言道，情场战场无是非。其实这话并不对。世上有那么多不公平的事，本来一件也不该做。

            仇恨一旦当家，事情总会变成这样。奇怪的是，爱情有时也会做出不公平的事，过后还要为自己辩解。
        - id: ch01-b02
          speaker: narrator
          text: |-
            可鹌鹑鲍勃一点儿也不觉得，愚弄那些邻居有什么不公平。因为它既是为了爱情，也是为了战争。它爱羞怯的小小鲍勃太太，也爱它们的家。至于战争嘛，绿森林和绿草地上从来没有停过。

            住在那里的小家伙当然不这么称呼它。可情形谁都明白。大个子时时想抓住比自己小的，小个子呢，也得时时设法胜过大个子。
        - id: ch01-b03
          speaker: narrator
          text: |-
            所以，凡是来寻找它家的邻居，鲍勃都觉得应该骗上一骗。它这样想，也确实没有错。
    - id: ch02
      title: 把雷迪引错地方
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            鲍勃会停在一根篱笆桩上，吹响那只有它才会吹的口哨，叫全世界都知道鹌鹑鲍勃就在这里。

            不久，狐狸雷迪便沿着弯弯小径跑来了。它装得若无其事，好像只是出来走一走，对鲍勃的事半点儿也不关心。鲍勃也演了起来。它先朝四周仔细看看，仿佛在确定附近没有危险，再飞向一个很像筑窝地点的地方，一头藏进草里。
        - id: ch02-b02
          speaker: narrator
          text: |-
            鲍勃才从眼前消失，雷迪脸上便露出了狡猾的笑。
        - id: ch02-b03
          speaker: reddy_fox
          text: |-
            哈，原来你的窝藏在那儿！我这就过去好好瞧瞧。
        - id: ch02-b04
          speaker: narrator
          text: |-
            雷迪偷偷摸到那片草地，把尖鼻子伸进每一丛草，又挨个查看小灌木底下。

            鲍勃一直等到轻轻的脚步声逼近身边，才猛地飞起来。它那双小翅膀扑啦啦响成一片，听着就像真被吓坏了。飞到远处的篱笆桩上以后，它又焦急地叫个不停。
        - id: ch02-b05
          speaker: narrator
          text: |-
            雷迪听了，更认定鸟窝就在附近，于是翻来覆去地找。可真正的窝还在弯弯小径旁边的野草丛里。小小的鲍勃太太舒舒服服地坐在那些宝贝蛋上，听见鲍勃的声音，只管暗暗发笑。它在做什么，她心里再清楚不过了。
    - id: ch03
      title: 谁也找不到的窝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            臭鼬吉米来了，鲍勃也这样骗它。狐狸奶奶来了，鲍勃还是这样骗她。就连兔子彼得，也没能例外。

            它们盯着鲍勃，看它飞到哪里，再把那一带找了又找。每个家伙都认定，自己已经知道鲍勃的家藏在哪里。可搜寻过后，它们又都弄不明白，为什么偏偏找不见。
        - id: ch03-b02
          speaker: narrator
          text: |-
            吉米惦记的是窝里的蛋。雷迪和狐狸奶奶呢，想抓住鲍勃太太，或者等漂亮白蛋里的宝宝孵出来，再把小家伙们吞进肚子。

            只有彼得没有恶意。它想找到鸟窝，不过是因为好奇。要它伤害鲍勃太太，或者碰坏任何一枚蛋，就算拿全世界来换，它也不肯。
        - id: ch03-b03
          speaker: narrator
          text: |-
            可鲍勃明白，要是彼得知道了鸟窝的位置，说不定会在别人盯着它的时候跑来。到那时，可怕的事情就可能发生。

            所以鲍勃觉得，最好连彼得也一起瞒住，像骗过其他家伙那样，把它也骗过去。我看鲍勃做得对。你说呢？
