audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and self-satisfied
        timbre: sharp and smooth
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Bob Fools His Neighbors
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "People say that all is fair in love and war. Of course, that isn't true. Plenty of unfair things are done, and no one ought to do them."
        - id: ch01-b02
          speaker: narrator
          text: "That is always the way when hate is in charge. The strange thing is, love can behave unfairly too, and then try to excuse it. But Bob White saw nothing unfair about fooling his neighbors. Not one little bit. He was doing it for both love and war. He loved shy little Mrs. Bob and their home. And he was fighting the sort of war that never ends in the Green Forest and on the Green Meadows. The little people there do not call it war. Still, the big ones are always trying to catch someone smaller, while the little ones are always trying to outwit the big ones."
        - id: ch01-b03
          speaker: narrator
          text: "That was why Bob believed it was fair and right to fool any neighbor who went looking for his home. And it was."
        - id: ch01-b04
          speaker: narrator
          text: "Bob would perch on a fence post and whistle as only Bob White can. His call told the whole world that he was right there. Before long, Reddy Fox would come trotting along the Crooked Little Path. Reddy acted as though he were only taking a pleasant walk and cared nothing at all about Bob or what Bob was doing."
        - id: ch01-b05
          speaker: narrator
          text: "Bob would make a show of looking all around for danger. Then he would fly to a spot that seemed perfect for a nest and vanish into the grass."
        - id: ch01-b06
          speaker: reddy_fox
          text: "Ah, so that's where you've hidden your nest! I believe I'll go take a look."
        - id: ch01-b07
          speaker: narrator
          text: "Reddy would grin his sly grin and creep over to the place where Bob had disappeared. He pushed his pointed nose into every clump of grass and peered beneath every small bush."
        - id: ch01-b08
          speaker: narrator
          text: "Bob stayed hidden until Reddy's soft steps came very close. Then Bob burst into the air. His quick little wings made a tremendous noise, as if he were frightened half to death. He landed on a fence post far away and called out in the most worried voice he could manage."
        - id: ch01-b09
          speaker: narrator
          text: "Now Reddy felt certain the nest must be nearby, so he searched and searched. Meanwhile, little Mrs. Bob sat quite comfortably on those precious eggs. The real nest was in the weed patch beside the Crooked Little Path. As she listened to Bob calling, she chuckled to herself. She knew exactly what he was doing."
        - id: ch01-b10
          speaker: narrator
          text: "Bob played the same trick on Jimmy Skunk, Granny Fox, and even Peter Rabbit. They all watched Bob and hunted for the nest. Each one felt sure he knew exactly where Bob's home must be. Later, each one wondered why he could not find it."
        - id: ch01-b11
          speaker: narrator
          text: "Jimmy Skunk was after some of the eggs. Reddy Fox and Granny Fox hoped to catch Mrs. Bob, or to be ready when the babies came out of those beautiful white eggs."
        - id: ch01-b12
          speaker: narrator
          text: "Peter Rabbit was different. He only wanted to find the nest because he was curious. He would never have hurt Mrs. Bob or even one of her eggs."
        - id: ch01-b13
          speaker: narrator
          text: "But Bob understood the danger. If Peter learned where the nest was, he might go to visit while someone else was watching him. Then something dreadful could happen."
        - id: ch01-b14
          speaker: narrator
          text: "So Bob decided it was best to fool Peter just as he fooled the others. I think Bob was right. Don't you?"
