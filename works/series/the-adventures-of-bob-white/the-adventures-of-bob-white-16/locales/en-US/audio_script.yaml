audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: steady and good-humored
        timbre: deep and hearty
        pace: unhurried
        pitch: low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and energetic
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Farmer Brown's Boy Talks Things Over
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "There's nothing in the earth, the sea, or the sky that can compare with love."
        - id: ch01-b02
          speaker: narrator
          text: "If love ruled everywhere, there would be no terrible wars or prisons. There would be no dreadful poverty and no bitter quarrels between workers and the people they work for. On the Green Meadows and in the Green Forest, no one would fear people or suffer from traps and terrible guns. Love is a wonderful, mighty thing held inside one little four-letter word. If only we gave it a chance, it could bring joy and happiness to every heart forever."
        - id: ch01-b03
          speaker: narrator
          text: "Love was what made Farmer Brown's boy so indignant when his father hinted that he might take his gun and shoot Bob White and his family. The boy had become friends with the Bob Whites and had learned to love them. No one can bear to think of someone they love being hurt. He answered his father respectfully, but his face turned red, and there was anger in his voice."
        - id: ch01-b04
          speaker: narrator
          text: "Farmer Brown actually chuckled when he heard him. Then he turned and held out his big hand."
        - id: ch01-b05
          speaker: farmer_brown
          text: "Shake hands, son. I only said that to see how you'd answer. You used to be very fond of hunting, remember? I wanted to know which was stronger: your old desire to hunt and kill, or your belief in doing what is fair and right. You chose what was right, and that makes me very glad. Then you think we ought to protect the Bob Whites?"
        - id: ch01-b06
          speaker: narrator
          text: "The boy's face flushed again, but this time it was from pleasure."
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: "Oh, Dad, I'm so glad you don't really want to kill them for food!"
          emotion: happy
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: "I should have guessed you were only teasing. I used to enjoy going out with my gun, but I knew much less in those days. Searching for the birds was exciting, and then I could test whether I was able to hit them. To me, they were only wild creatures that tasted good. Catching such clever birds meant I had to outsmart them."
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: "I never stopped to think that birds had feelings. Watching them has taught me better. They love, work, and play. They feel fear and pain, happiness and sadness, just as people do. So how could I hurt them or stand by while someone else did? Why, I love them! I wouldn't have anything happen to them for the world."
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: "I'm terribly afraid that something will happen to one of them when hunting season starts. Isn't there anything we can do to help them?"
          emotion: fearful
        - id: ch01-b11
          speaker: farmer_brown
          text: "We can put up signs that warn hunters to stay off our farm and forbid any shooting here. If Bob White and his family are wise enough to remain on our land, I think they'll be safe. But if they cross onto someone else's land, they're likely to be shot, unless..."
        - id: ch01-b12
          speaker: narrator
          text: "Farmer Brown paused. His son eagerly finished the thought."
        - id: ch01-b13
          speaker: farmer_browns_boy
          text: "Unless I persuade the neighbors who own the nearby land to put up signs, keep hunters away, and promise not to shoot the Bob Whites themselves!"
        - id: ch01-b14
          speaker: narrator
          text: "Farmer Brown smiled."
        - id: ch01-b15
          speaker: farmer_brown
          text: "That's exactly right, son. Here's your chance to repay the little friends who have done so much for you. Tomorrow is Saturday, so you won't have school. You may spend the whole day talking to the neighbors and finding out what you can do to save Bob White and his family from the hunters."
        - id: ch01-b16
          speaker: farmer_brown
          text: "Listen! Bob would be a blessing even if all he gave us was his cheerful message. But along with that cheer, he helps us every day. A man who kills Bob White kills one of our finest friends and helpers. That gunshot harms us even more than it harms poor little Bob. Now let's go to the barn and start making those signs."
