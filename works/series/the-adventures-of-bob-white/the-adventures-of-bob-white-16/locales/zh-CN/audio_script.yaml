audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 认真好奇，带着少年人的坦率和活力
        timbre: 清朗自然
        pace: 明快而有思考感
        pitch: 中高
    farmer_brown:
      display_name: 布朗农夫
      tts:
        delivery: 朴实厚道，说话直爽而慈爱
        timbre: 浑厚温暖
        pace: 从容稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 没有什么能同爱相比
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 地上、海里，还是天上，没有什么能同爱相比。要是爱能遍及每一个地方，就不会再有可怕的战争和监狱，不会再有骇人的贫困，雇工与雇主之间也不会尖刻地争吵。
        - id: ch01-b02
          speaker: narrator
          text: 绿草原和绿森林里的动物，也就不必害怕人类，不必在陷阱和猎枪下受苦了。“爱”只是小小一个字，里面却装着了不起的力量。只要我们肯给爱一个机会，它就能把欢乐与幸福送进每一颗心里，而且永远留在那里。
    - id: ch02
      title: 父亲的试探
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 布朗农夫家的男孩心里有爱。所以，父亲一说也许会拿猎枪打死鹌鹑鲍勃一家，他马上愤愤不平。男孩早就同鲍勃一家交了朋友，也爱上了它们。谁能忍受自己所爱的朋友受到伤害呢？他没有忘记尊敬父亲，回答时仍旧恭恭敬敬，可脸已经涨红了，声音里也带着怒意。布朗农夫听完，居然呵呵笑了起来。他转过身，伸出那只大手。
        - id: ch02-b02
          speaker: farmer_brown
          text: 来，孩子，咱们握个手。我刚才只是想试试你，看看你会怎么回答。你从前很喜欢打猎，我想弄明白，你想杀生，或者试着杀生的那股劲儿，会不会压过心里的是非和公道。现在我知道不会了，真高兴。照你说，鲍勃一家已经值得我们保护了，是不是？
        - id: ch02-b03
          speaker: narrator
          text: 男孩的脸又红了。这一回，他是高兴得红了。
    - id: ch03
      title: 男孩懂得了什么
      blocks:
        - id: ch03-b01
          speaker: farmer_browns_boy
          text: 爸爸，你不是真想打死它们来吃，太好了！我早该想到，你是在逗我。我以前确实爱带着猎枪出去，那时我懂的事情没有现在多。找鸟很刺激，找到以后，我还想试试自己打不打得中。那时我只觉得，它们是可以吃的野物，又那么机灵，我非得比它们更机灵一点儿，才能捉到它们。
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 我根本没有想过，鸟儿也有感情。现在我亲眼看见了。它们会爱，会害怕，也会疼。它们做事，也玩耍，会高兴，也会难过，跟人一样。我不想伤害它们，也不许别人伤害它们，就像我不愿意让人受到伤害一样。我爱它们呀！无论如何，我都不愿鲍勃一家出事。可狩猎季就要开始了，我真怕它们当中有谁会遭殃。我们不能替它们做点儿什么吗？
    - id: ch04
      title: 保护鲍勃一家
      blocks:
        - id: ch04-b01
          speaker: farmer_brown
          text: 我们可以竖几块牌子，警告猎人不许踏进咱们的农场，也不许在这里开枪。只要鲍勃一家够机灵，肯待在我们的土地上，我想它们就安全了。可要是跑到别人家的地里，恐怕还是会挨枪子儿，除非我们能让别处也安全起来。
        - id: ch04-b02
          speaker: farmer_browns_boy
          text: 除非我能说服附近的地主也竖起牌子，不让猎人进去，还请他们答应，自己也不打鲍勃一家！
        - id: ch04-b03
          speaker: narrator
          text: 男孩急切地接上了父亲的话。布朗农夫笑了。
        - id: ch04-b04
          speaker: farmer_brown
          text: 一点儿不错，我的孩子。现在正是你报答它们的机会。那些小朋友帮了你那么多，你也可以为它们做点儿事。明天是星期六，不用上学。你有一整天，可以去问问邻居们，看看自己能不能救下鲍勃一家，让它们躲过猎人的枪。
        - id: ch04-b05
          speaker: farmer_brown
          text: 你听，哪怕鲍勃什么也不做，只送来那声欢快的问候，它也是我们的福气。可它不只给世界带来快乐，每一天还在帮我们的忙。谁打死鹌鹑鲍勃，谁就是杀死了我们最好的朋友和帮手之一。那一枪伤到我们，远比伤到可怜的小鲍勃更深。好了，咱们到谷仓去，琢磨琢磨那些牌子该怎么做吧。
