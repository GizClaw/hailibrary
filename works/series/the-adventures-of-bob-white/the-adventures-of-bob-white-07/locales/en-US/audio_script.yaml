  chapters:
    - id: ch01
      title: Bob White Finds That Mrs. Bob Is Right
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "You can often prevent a quarrel by letting someone else have their way. And you may find that the other person is just as likely to be right as you are. Bob White told Mrs. Bob that he supposed she was right about the place she had chosen for their home. But deep down, he wasn't sure at all. He would never have picked that spot himself. No, sir. Bob knew at least half a dozen places that seemed better and safer to him. Still, this home would belong even more to Mrs. Bob than to him. She was the one who would spend the long days there, sitting on the beautiful white eggs they hoped to have soon."
        - id: ch01-b02
          speaker: narrator
          text: "So Bob kept his thoughts to himself. He did worry a little because the new home stood so near the Crooked Little Path, where Reddy Fox and Granny Fox often passed. Yet he said nothing. He simply brought his share of grass, straw, and leaves for the nest. Mrs. Bob was very particular about how it should be built. An ordinary open nest would never do. Perhaps she understood exactly what Bob was thinking and knew that he did not approve of the place. She made a clever little roof of grass and straw over the nest, with a small entrance at one side. Once it was finished, only the sharpest eyes could ever have found it."
        - id: ch01-b03
          speaker: narrator
          text: "Of course Bob was proud of the nest. He was very proud indeed."
        - id: ch01-b04
          speaker: bob_white
          text: "My dear, this is the finest nest I have ever seen. I only hope that no one finds it."
        - id: ch01-b05
          speaker: narrator
          text: "Mrs. Bob gave him a sharp look."
        - id: ch01-b06
          speaker: mrs_bob
          text: "Why don't you admit that you wish I had put it somewhere else?"
        - id: ch01-b07
          speaker: narrator
          text: "Bob looked rather foolish."
        - id: ch01-b08
          speaker: bob_white
          text: "I still can't help thinking this is a very dangerous spot. But I do trust your judgment, my dear."
        - id: ch01-b09
          speaker: narrator
          text: "He added those last words in a hurry."
        - id: ch01-b10
          speaker: mrs_bob
          text: "Then be careful whenever you come this way. Whatever you do, never fly straight to the nest. Stay away unless I call you. When you do come, land in the long grass back there. Then walk over here beneath the grass and weeds, where no one can see you."
        - id: ch01-b11
          speaker: narrator
          text: "Bob promised to follow every word of her instructions. To prove it, he slipped away through the long grass and did not take flight until he was far from the nest. Then he flew beyond the dear Old Briar-path and whistled with all his might, simply because he was so happy."
        - id: ch01-b12
          speaker: narrator
          text: "Before long, fifteen beautiful white eggs lay in the nest among the weeds beside the Crooked Little Path. Then Bob grew more anxious than ever. Again and again, he saw Reddy Fox, Granny Fox, or Jimmy Skunk trotting along that path. Bob knew they had come to search for his nest. But not once did they think to look in that patch of weeds. It never occurred to them that anyone would build a home so close to a path they used all the time. Instead, they hunted and hunted everywhere else."
        - id: ch01-b13
          speaker: narrator
          text: "All the while, little Mrs. Bob sat on those white eggs. Her feathers were almost the same color as the brown grass and leaves around her. Even if the searchers had looked straight at her, they probably would not have seen her. Little by little, Bob had to admit to himself that Mrs. Bob was right. She had chosen the safest place on the Green Meadows for their home. It was safe because it was the very last place anyone would think to search. After that, Bob worried less. He spent all his spare time fooling the ones who were still looking for his home."
