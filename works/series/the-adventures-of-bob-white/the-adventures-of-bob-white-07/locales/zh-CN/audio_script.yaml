audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    bob_white:
      display_name: 鹌鹑鲍勃
      tts:
        delivery: 快活机敏，从容中带着俏皮
        timbre: 清亮爽朗
        pace: 轻快而清楚
        pitch: 中高
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 果断利落，聪明自信，话里带着爽快的锋芒
        timbre: 清脆明亮
        pace: 明快而干脆
        pitch: 中高
  chapters:
    - id: ch01
      title: 谁说得对
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            若肯让人遂心愿，一场争吵常可免。

            还有一件事，你也会慢慢发现。别人说得对的可能性，和你一样大。

            鹌鹑鲍勃嘴上说，太太选的地方很适合安家，心里却没有把握。要是让它来选，它绝不会挑这里。不，先生，它至少知道五六处地方，自认为比这里更好，也更安全。

            不过，这个家与其说是鲍勃的，还不如说是鲍勃太太的。不久以后，它们盼望的漂亮白蛋就要有了。到时候，整天守在家里孵蛋的可是她。
        - id: ch01-b02
          speaker: narrator
          text: |-
            鲍勃把意见留在了心里。新家紧挨着弯弯小径，狐狸雷迪和狐狸奶奶常从那里经过。它虽有点担心，却什么也没说，只管衔来干草、麦秆和树叶，做好自己该做的那一份。

            鲍勃太太对这个窝十分讲究。普通的露天鸟窝可不行。也许她早就猜到了鲍勃的心思，知道它其实并不赞成在这里筑窝。于是，她用干草和麦秆搭起小小的圆顶，只在一边留出入口。等窝造好，眼睛再尖也很难发现。
        - id: ch01-b03
          speaker: narrator
          text: |-
            鲍勃看着这个窝，当然很得意，简直得意极了。它要把这份欢喜好好说给太太听。
        - id: ch01-b04
          speaker: bob_white
          text: |-
            亲爱的，这么好的窝，我还是头一次见。只盼着谁也别发现它，千万别叫谁找到了。
    - id: ch02
      title: 鲍勃说出心事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            鲍勃太太目光锐利地盯住了它。
        - id: ch02-b02
          speaker: mrs_bob
          text: |-
            你其实巴不得把窝安在别处，对不对？为什么不肯痛痛快快地承认？
        - id: ch02-b03
          speaker: narrator
          text: |-
            鲍勃听了，有点儿不好意思，只好说了实话。
        - id: ch02-b04
          speaker: bob_white
          text: |-
            我总觉得这里太危险，怎么也放不下心。不过，亲爱的，我相信你的眼光，真的相信。
        - id: ch02-b05
          speaker: narrator
          text: |-
            后面这句话，鲍勃赶紧补得飞快。鲍勃太太可没跟它客气。
        - id: ch02-b06
          speaker: mrs_bob
          text: |-
            那你每次过来都要当心，无论如何也不许直接飞到这里。我不叫你，你就别靠近。真要来的时候，先飞进后面那片深草，再藏好身子，从草叶和野草底下一路走过来。
        - id: ch02-b07
          speaker: narrator
          text: |-
            鲍勃答应，一定照她的话做。为了叫太太放心，它马上躲进深草，悄悄往远处走。直到离窝很远，它才飞起来，越过亲爱的老荆棘丛，到了另一边。

            鲍勃心里实在太快活了，忍不住使出浑身力气吹起口哨。
    - id: ch03
      title: 最不会被寻找的地方
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            没过多久，弯弯小径旁的野草丛里，那个窝中便有了十五枚漂亮的白蛋。这一下，鲍勃比从前更不放心了。

            它一次又一次看见狐狸雷迪、狐狸奶奶或臭鼬蒂米沿着小径跑来，也知道它们是来找自己的窝。可它们从不曾到那片野草里看上一眼。谁能想到，会有鸟把窝筑在大家常走的小径旁边呢？所以，它们把别的地方找了又找，几乎全都搜遍了。
        - id: ch03-b02
          speaker: narrator
          text: |-
            在这段日子里，小小的鲍勃太太一直坐在白蛋上。她的外衣和褐色的干草、枯叶那么相像，就算那些家伙正眼望着她，多半也看不见。

            鲍勃渐渐明白，太太果然说对了。她选中的，正是绿草地上最安全的安家之处。这里最安全，就因为谁也不会想到来这里找。

            从那以后，鲍勃不再那么担心了。它把所有空闲时间都花在戏弄那些四处寻找它家的人身上。
