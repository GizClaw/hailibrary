audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    bob_white:
      display_name: 鹌鹑鲍勃
      tts:
        delivery: 快活机敏，从容中带着俏皮
        timbre: 清亮爽朗
        pace: 轻快而清楚
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，遇到危险时略显慌张
        timbre: 年轻明亮
        pace: 偏快而灵活
        pitch: 中高
  chapters:
    - id: ch01
      title: 阳光一样的邻居
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            谁只管好自己的事，又肯快快活活地做活儿？要问我愿意挑谁做邻居，我就挑这样的一个，而且永远愿意跟它住在近旁。

            兔子彼得遇见的鹌鹑鲍勃，正是这样的好邻居。鲍勃和鲍勃太太离开老牧场，在亲爱的老荆棘丛附近安了家。从此，它们跟彼得和小彼得太太便住得很近了。
        - id: ch01-b02
          speaker: narrator
          text: |-
            鲍勃很爱跟邻居来往，常常顺路过来，陪彼得说上一会儿话。彼得每回见到它都很高兴。鲍勃实在太快活了，只要有它在身旁，彼得的心情也会亮起来。快活的人就是有这样的本事，走到哪里，都像把阳光带到了哪里。
        - id: ch01-b03
          speaker: narrator
          text: |-
            不过，彼得只知道鲍勃的家在附近，却不知道确切的地方。是的，先生，鲍勃夫妇究竟把家藏在哪儿，它一点也不知道。这当然不是因为它没尽力。哎呀，要彼得忍住不去打听，简直就像要它忍住不呼吸。它天生就是这么好奇。
        - id: ch01-b04
          speaker: narrator
          text: |-
            彼得花了许多时间，到处寻找，结果还是白忙一场。起先，它颇有些不高兴，怪鲍勃不肯说出家的藏处。鲍勃却只是微微一笑。它告诉彼得，自己正是因为十分看重这个朋友，想永远跟彼得要好，才不能把秘密说出来。
        - id: ch01-b05
          speaker: peter_rabbit
          text: |-
            那你不是更该告诉我吗？朋友之间不该藏着秘密。要是连朋友都不能信，这还算什么朋友？
    - id: ch02
      title: 有些事不知道更好
      blocks:
        - id: ch02-b01
          speaker: bob_white
          text: |-
            彼得，要是我和家人因为你遭了殃，你会有什么感受？
        - id: ch02-b02
          speaker: peter_rabbit
          text: |-
            我一定难受死了！可你真以为我会眼看着你们受到伤害吗？你心里把我当成什么样的朋友了！
        - id: ch02-b03
          speaker: bob_white
          text: |-
            不，我知道你不会明明知道有危险，还故意让我们受害。可彼得，你也活了这么久，应该明白，无论什么时候，四面八方总有眼睛在看，有耳朵在听，也有鼻子在闻。
        - id: ch02-b04
          speaker: bob_white
          text: |-
            也许你觉得没人看见自己，可偏偏有人瞧见你来我家。也许狐狸雷迪偶然发现你的脚印，一路跟到了我家。真有可怕的事发生，错不在你，可事情却会因你而起。还记得我前几天说的吗？有些事情，还是不知道的好。
        - id: ch02-b05
          speaker: narrator
          text: |-
            彼得显出一副深思的模样，一边揪着胡须，一边把鲍勃的话翻来覆去想了半天，最后才开口。
        - id: ch02-b06
          speaker: peter_rabbit
          text: |-
            这个道理，我还是头一回听到。从前我真没这样想过。要是你们因为我出了任何事，我肯定一辈子都不会原谅自己。
        - id: ch02-b07
          speaker: bob_white
          text: |-
            你当然不会。要是我把家的位置说出去，结果害了家人，我也绝不会原谅自己。
    - id: ch03
      title: 宁愿听鲍勃吹口哨
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            彼得点了点头。不过，它马上又想到了一件事。
        - id: ch03-b02
          speaker: peter_rabbit
          text: |-
            可要是我碰巧自己找到了你家，你不会生气吧？
        - id: ch03-b03
          speaker: narrator
          text: |-
            鲍勃听了，笑起来。
        - id: ch03-b04
          speaker: bob_white
          text: |-
            当然不会。不过我还是劝你别特意去找。这样，就算有人跟踪你，我或家人后来真遇上了什么可怕的事，你心里也不用一直为这件事难受。
        - id: ch03-b05
          speaker: bob_white
          text: |-
            想拿我当晚餐的家伙，跟想拿你当晚餐的一样多。比起填进谁的肚子，我可宁愿坐在篱笆桩上吹口哨。
        - id: ch03-b06
          speaker: peter_rabbit
          text: |-
            我也宁愿你留在这儿。
