audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    bob_white:
      display_name: Bob White
      tts:
        delivery: bright and cheerful
        timbre: clear and ringing
        pace: brisk
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and earnest
        timbre: light and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Bob White and Peter Become Neighbors
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The best neighbor is someone who tends to his own business and does his work with a cheerful heart. That was just the kind of neighbor Peter Rabbit found in Bob White."
        - id: ch01-b02
          speaker: narrator
          text: "Bob and Mrs. Bob had left the Old Pasture and made a home near the dear Old Briar-patch. That made them neighbors of Peter and little Mrs. Peter. Bob often stopped by to talk, and Peter was always glad to see him. Bob was so cheerful that Peter felt better whenever he was around. Cheerful people are like sunshine that way."
        - id: ch01-b03
          speaker: narrator
          text: "Still, Peter did not know exactly where Bob and Mrs. Bob had built their home. It was not because he had failed to look. Oh, no! Peter could no more stop being curious than he could stop breathing. He searched here and he searched there. He spent a great deal of time on it, but every bit of that time was wasted. He found nothing at all. At first, it bothered him that Bob would not reveal the hiding place. Bob only smiled. He said he kept the secret because Peter mattered to him, and he wanted them always to be friends."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "But if we're friends, why won't you tell me where you live? Friends shouldn't have to keep secrets from each other. What kind of friendship is it if there's no trust?"
        - id: ch01-b05
          speaker: bob_white
          text: "Peter, how would you feel if you brought harm to me and my family?"
        - id: ch01-b06
          speaker: peter_rabbit
          text: "I'd feel terrible! But surely you don't think I'd ever let anyone hurt you. Is that what you think of your friend?"
        - id: ch01-b07
          speaker: narrator
          text: "For once, Bob spoke without his usual cheer."
        - id: ch01-b08
          speaker: bob_white
          text: "No, Peter. I know you wouldn't let anyone harm us if you knew about it. But you've lived long enough to know that eyes and ears and noses are everywhere. All the time, someone may be watching, listening, or smelling. You might wait until you were certain no one could see you and then come to my home. But what if someone saw you anyway? Or Reddy Fox might happen across your tracks and follow them straight to my door. If something dreadful happened to us, it would not be your fault because you never meant it to happen. Even so, you would have been the cause of it. Remember what I told you the other day. Some things are better left unknown."
        - id: ch01-b09
          speaker: narrator
          text: "Peter grew very thoughtful. He pulled at his whiskers while he considered what Bob had said."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "I never thought of it that way before. If anything happened to you because of me, I could never forgive myself."
        - id: ch01-b11
          speaker: bob_white
          text: "Of course you couldn't. And I could never forgive myself if anything happened to my family because I told someone where our home was. I would be the one who had put them in danger by giving away our hiding place."
        - id: ch01-b12
          speaker: narrator
          text: "Peter nodded."
        - id: ch01-b13
          speaker: peter_rabbit
          text: "But suppose I happened to find your home all by myself. You wouldn't be angry, would you?"
        - id: ch01-b14
          speaker: narrator
          text: "Bob White laughed."
        - id: ch01-b15
          speaker: bob_white
          text: "Of course not. But I'd still advise you not to go looking. If you do not search for my home, you will have nothing troubling your mind later. Someone might follow you, and then something dreadful might happen to me or my family. Just as many creatures would like to make a dinner of me as would like to make a dinner of you. I would much rather sit on a fence post and whistle than end up filling somebody's stomach."
        - id: ch01-b16
          speaker: peter_rabbit
          text: "And I'd much rather have you here."
