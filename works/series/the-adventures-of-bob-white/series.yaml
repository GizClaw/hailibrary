cover_prompt: |-
  A wordless cover scene on an early-twentieth-century New England farm shows a family of small ground-dwelling quail beside a sheltering briar patch. A handsome male bird with warm brown plumage, a crisp white throat and eye stripe, and bold black facial markings stands on a weathered fence post, while a softly mottled brown hen and their young scratch for seeds among the stubble below. A farm boy in plain period work clothes pauses at a respectful distance near the orchard edge, watching the birds with quiet delight. Make the male bird lifting his head to whistle the clear focal action, with the close-knit family and the boy's attentive pose supporting the book's spirit of courage, care, and good cheer. Use a wide child-height view across the meadow, orchard, split-rail fence, and distant farmhouse, keeping the figures low in the frame and leaving calm open sky at the top. Keep the birds anatomically convincing, the encounter gentle and child-friendly, and every figure independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
