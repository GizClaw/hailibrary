audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    hunter:
      display_name: Hunter
      tts:
        delivery: casual and self-satisfied
        timbre: firm and earthy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Beautiful October Morning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "It is a pity and a shame upon all people that human beings can find sport and pleasure in cruelty."
        - id: ch01-b02
          speaker: narrator
          text: "No day could have been more beautiful than that crisp October day. It was the kind of morning that made you feel glad all over just to be alive. Bob White felt it the moment he opened his eyes, very early that morning. The joy of living seemed to tingle through him, and he whistled because he was so happy. He loved the whole Great World. He felt sure the Great World loved him too, and he wanted to tell it so."
        - id: ch01-b03
          speaker: narrator
          text: "Old Mother West Wind had brought her Merry Little Breezes down from the Purple Hills in her big bag. When they tumbled out to play on the Green Meadows, they danced over to tell Bob that they loved him. That made him happier still."
        - id: ch01-b04
          speaker: narrator
          text: "Meanwhile, a man was tramping along the road toward Farmer Jones's home. He was glad too, but for a very different reason. A dog trotted at his heels. The man shifted a terrible gun from one shoulder to the other and spoke to the dog."
        - id: ch01-b05
          speaker: hunter
          text: "Looks like we'll have some sport today, old fellow."
    - id: ch02
      title: In Farmer Jones's Wheat-Field
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Farmer Brown's boy had tried to warn Bob White. If Bob had understood, he never would have done what he did next. But the warning had made no sense to him. When he decided to try his wings, he led his family straight over to Farmer Jones's land."
        - id: ch02-b02
          speaker: narrator
          text: "Bob had visited that farm many times before. Nothing bad had ever happened there, so he saw no reason to stay away. He flew straight to the stubble in Farmer Jones's wheat-field, with his family following. Before long, they were all busily gathering the grains of wheat scattered there. They were as happy with their breakfast as you or I would have been with ours."
        - id: ch02-b03
          speaker: narrator
          text: "Then, in the middle of breakfast, Bob's sharp ears caught the sound of footsteps. He stretched his neck above the stubble for a look. In that instant, every bit of gladness and brightness vanished from the day."
        - id: ch02-b04
          speaker: narrator
          text: "A dog was coming with his nose close to the ground. He was following the trail left by one of Bob's children as the young bird ran around gathering wheat. All at once, the dog stopped. He stood perfectly still, with his nose and one front leg pointing toward a single spot. Bob knew one of his children must be crouching close to the earth right there."
        - id: ch02-b05
          speaker: narrator
          text: "The dog stayed as still as a statue. Behind him, the man came forward slowly and carefully, holding the terrible gun ready. When he reached the dog, he ordered him ahead. The little Bob White hiding there had only one escape. On swift wings, the young bird shot into the air."
    - id: ch03
      title: The Terrible Gun
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Bang! The terrible gun went off, and the little brown bird dropped from the sky. That dreadful sound sent all the other young Bob Whites jumping into the air in terror. They had never heard anything like it before."
        - id: ch03-b02
          speaker: narrator
          text: "Bang! The gun fired once more. This time, only a few brown feathers drifted down to the ground. Bob and Mrs. Bob did not fly until after that second shot. They had learned from experience that once the gun had fired twice, they would probably be safe for a little while."
        - id: ch03-b03
          speaker: narrator
          text: "The Bob Whites scattered in every direction, just as they had been taught to do whenever danger came. Bob flew directly to Farmer Brown's wheat-field. After a while, he began to call. One by one, the members of his family called back. Every one answered except the little bird struck by the first shot."
        - id: ch03-b04
          speaker: hunter
          text: "Well, I got one."
        - id: ch03-b05
          speaker: narrator
          text: "The hunter loaded his terrible gun again. He actually looked happy as he went to help his dog search for the Bob White that had fallen at the first terrible bang."
