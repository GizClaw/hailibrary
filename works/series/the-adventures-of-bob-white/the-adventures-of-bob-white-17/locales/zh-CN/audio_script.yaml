audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    hunter:
      display_name: 猎人
      tts:
        delivery: 随意而自鸣得意
        timbre: 结实粗朴
        pace: 不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 明净的十月早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜啊，真是全人类的耻辱。人竟能从残忍中找到消遣，还以此为乐。
        - id: ch01-b02
          speaker: narrator
          text: 那是十月里一个清爽明净的日子，美得不能再美。这样的日子，单是活着，就叫人从头到脚都觉得快活。鹌鹑鲍勃一大早睁开眼睛，便感到生命的喜悦传遍全身。它高兴得吹起口哨，爱着整个大世界，也相信整个大世界都爱它。它真想把自己的心意告诉大世界。
        - id: ch01-b03
          speaker: narrator
          text: 西风妈妈用大口袋把欢乐的小微风从紫山带下来，让它们在绿草原上玩一整天。小微风翻滚着跑出口袋，又跳着舞来到鲍勃身边，说它们也爱它。鲍勃听了，更加快活。
        - id: ch01-b04
          speaker: narrator
          text: 同一时候，一个男人沿着大路朝琼斯农夫家走去。他也很高兴，不过原因完全不同。一条猎狗紧跟在他的脚边。男人把可怕的猎枪换到另一边肩头，对猎狗说了一句话。
        - id: ch01-b05
          speaker: hunter
          text: 老伙计，看来咱们今天有乐子了。
    - id: ch02
      title: 琼斯农夫的麦田
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 布朗农夫家的男孩警告过鲍勃。只要鲍勃听懂了，就绝不会做出接下来的事。偏偏它没有懂。它想活动一下翅膀，便领着一家大小，径直飞到了琼斯农夫的土地上。
        - id: ch02-b02
          speaker: narrator
          text: 鲍勃以前常来这里，每一次都平安无事，它自然觉得以后也可以想来就来。它带着全家落进收割过的麦田，忙着啄食散在麦茬间的麦粒。一家子吃得心满意足，就像你我面对一顿美味的早餐一样。
        - id: ch02-b03
          speaker: narrator
          text: 正吃着，鲍勃灵敏的耳朵捕捉到了脚步声。它把脖子伸过麦茬，探头一看。就在这一刻，这一天所有的欢乐与明亮都不见了。
        - id: ch02-b04
          speaker: narrator
          text: 一条猎狗低着头，把鼻子贴近地面，循着一个小鹌鹑四处跑着啄麦粒时留下的气味追来。忽然，猎狗停住了。它一动不动，鼻子和一只前腿直指着一处地方。鲍勃马上明白，自己的一个孩子就伏在那里，身子紧贴着地面。
        - id: ch02-b05
          speaker: narrator
          text: 猎狗像石像一样站着。那个男人从后面慢慢靠近，脚步十分小心，手里的猎枪已经举好。等他走到猎狗身边，便催它继续向前。藏在那里的小鹌鹑再也没有别的路。它展开飞快的翅膀，一下冲上天空。
    - id: ch03
      title: 可怕的猎枪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 砰！可怕的猎枪响了。那只棕色的小鸟从空中掉了下来。其余的小鹌鹑从没听过这么骇人的声响，全都吓得猛然飞起。
        - id: ch03-b02
          speaker: narrator
          text: 砰！第二枪又响了。这一回，只有几根棕色羽毛慢慢飘到地上。鲍勃和鲍勃太太有过经验，一直等到第二声枪响之后才起飞。它们知道，猎枪连响两次以后，自己多半能暂时安全一会儿。
        - id: ch03-b03
          speaker: narrator
          text: 鲍勃一家记得遇上危险时该怎么做，全都朝不同方向散开。鲍勃径直飞到布朗农夫的麦田。过了一会儿，它开始呼唤家人。一声，又一声，一家子陆续答应了它。只有中了第一枪、从天空落下的那个孩子，再也没有回答。
        - id: ch03-b04
          speaker: hunter
          text: 不管怎么说，总算打中了一只。
        - id: ch03-b05
          speaker: narrator
          text: 猎人重新给那杆可怕的猎枪装上弹药，又走过去，帮猎狗寻找第一枪后落下的那只鹌鹑。他的脸上，居然还带着喜色。
