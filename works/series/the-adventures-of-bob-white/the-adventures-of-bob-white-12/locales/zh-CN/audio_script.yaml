audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 果断利落，聪明自信，话里带着爽快的锋芒
        timbre: 清脆明亮
        pace: 明快而干脆
        pitch: 中高
  chapters:
    - id: ch01
      title: 谁都要上的学校
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            人人都得把学上，
            这条规矩天下一样。
            大自然母亲早就说过，
            世世代代都该这样。
        - id: ch01-b02
          speaker: narrator
          text: 学校有许多种，不管是哪一种，人人都得去。有些人听了也许会说，自己根本没有上学。其实，他们正在上一所最难的学校，只是自己不知道。这所学校就叫经验。在那里，我们学习怎么生活，也学习怎么照顾自己。
        - id: ch01-b03
          speaker: narrator
          text: 草地和森林里的小居民也要上这所学校。土拨鼠约翰尼和波莉的四个宝宝刚能到处跑，就在老果园里开了学。兔子彼得的孩子们在亲爱的老荆棘丛里上学，草地鼠丹尼和南妮的孩子们在绿草地上学。
        - id: ch01-b04
          speaker: narrator
          text: 绿森林里还有比利负鼠叔叔那一窝活泼的孩子，欢笑溪里也有小水獭乔那两个前途无量的宝宝。它们谁也躲不过这所学校。当然，十五只小鹌鹑才钻出蛋壳没多久，也开始上学了。
    - id: ch02
      title: 第一课
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小鹌鹑们的第一课，就是听爸爸妈妈的话。这也是所有小孩子头一个要学会的本领。小家伙们偎在鲍勃太太的翅膀下面，她便给它们讲起了道理。
        - id: ch02-b02
          speaker: mrs_bob
          text: 孩子们，你们看，大千世界里到处都有危险。像你们这样的小鹌鹑，更要处处小心。想平安长大，像爸爸那么英俊、那么聪明，我和爸爸一叫，你们就要立刻照办。
        - id: ch02-b03
          speaker: narrator
          text: 十五个孩子都想平安长大，也都想变得像爸爸一样英俊聪明。从那以后，鲍勃或鲍勃太太只要出声，它们马上听从，绝不耽搁。
        - id: ch02-b04
          speaker: narrator
          text: 亲爱的老荆棘丛本来很安全，鲍勃太太还是常常考考孩子们。危险信号一响，它们就得立刻伏下，身子一点儿也不能动。听见另一种叫声，它们又得用最快的速度跑回妈妈身边。
        - id: ch02-b05
          speaker: narrator
          text: 鲍勃太太一次次试过，直到确定每个孩子都能立刻听从，这才带着它们离开老荆棘丛，走进绿草地，来到青草和野草之间。
    - id: ch03
      title: 大千世界里的功课
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了绿草地，危险可就是真的了。鲍勃太太总要仔细讲给孩子们听。抬头看，老红尾鹰正在空中一圈圈盘旋，专找下面那些粗心大意的小家伙。
        - id: ch03-b02
          speaker: narrator
          text: 地面上也不能大意。狐狸雷迪、狐狸奶奶和老郊狼先生都在四处潜行。它们眼睛尖，耳朵灵，还有神奇的鼻子，时时都在寻找不留神的小居民。黑蛇先生和几个同族也会贴着草地，无声无息地滑过来。
        - id: ch03-b03
          speaker: narrator
          text: 小鹌鹑们只好一边跑来跑去，寻找小虫、蚯蚓和草籽，一边留意周围的每一点动静。只要传来一丁点儿陌生的声音，它们马上就地伏下，直到鲍勃太太发出信号，告诉大家已经平安了。
        - id: ch03-b04
          speaker: narrator
          text: 天上飞来的也不全是敌人。老秃鹫先生连小鹌鹑的一根羽毛都不会碰。鲍勃太太教孩子们认它的飞法。它能在空中一直滑翔，翅膀连一下也不扇，和老红尾鹰可不一样。
        - id: ch03-b05
          speaker: narrator
          text: 孩子们刚刚能飞一小段，妈妈又教它们随时看好最近的灌木和树木在哪里。要是危险突然从地面出现，它们就知道该往哪儿飞。到了晚上，它们也得懂得怎样找到最安全的过夜地方。
        - id: ch03-b06
          speaker: narrator
          text: 小鹌鹑们要学的东西可真多，一样也不能忘。哪怕只忘一次，也可能惹来可怕的后果。它们明白这一点，所以学过的本领全都牢牢记住了。
        - id: ch03-b07
          speaker: narrator
          text: 鹌鹑鲍勃也教了孩子们不少本领。它熟悉大千世界里的各种门道，又是天底下最好的爸爸。孩子们就这样一天天长大，大得再也挤不进鲍勃太太的翅膀底下。它们的翅膀变得又快又有力，已经可以展翅飞翔了。
        - id: ch03-b08
          speaker: narrator
          text: 原来，这段日子里，小鹌鹑们一直都在上学，自己却一点儿也不知道。
