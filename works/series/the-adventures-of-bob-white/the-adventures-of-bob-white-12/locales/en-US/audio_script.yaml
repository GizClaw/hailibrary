audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    mrs_bob_white:
      display_name: Mrs. Bob White
      tts:
        delivery: bright and self-assured
        timbre: clear and pleasant
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Little Bob Whites at School
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Everybody goes to school. That's a rule for one and all. Mother Nature decided long ago that this was how it ought to be."
        - id: ch01-b02
          speaker: narrator
          text: "Now, schools come in many different kinds, but every one of us attends one kind or another. Plenty of people would tell you they don't go to school at all. They may not realize it, but they do. Their school is the hardest one there is: the school of experience. That's where all of us learn how to live and how to look after ourselves."
        - id: ch01-b03
          speaker: narrator
          text: "The little people of the meadows and forests go to that school too. Johnny and Polly Chuck's four babies began their lessons in the Old Orchard as soon as they could scamper about. Peter Rabbit's children learned in the dear Old Briar-patch. Danny and Nanny Meadow Mouse raised their youngsters on the Green Meadows. Unc' Billy Possum's lively family learned in the Green Forest, and Little Joe Otter's two hopeful youngsters learned in the Laughing Brook. So naturally, all the little Bob Whites started school almost as soon as they came out of their shells."
        - id: ch01-b04
          speaker: narrator
          text: "Their very first lesson was to obey their parents. That's the first thing all little folks need to learn. One day, as the fifteen babies tucked themselves beneath her wings, Mrs. Bob explained why it mattered."
        - id: ch01-b05
          speaker: mrs_bob_white
          text: "You see, my dears, the Great World has dangers everywhere, especially for little Bob Whites. If you want to live long enough to grow as handsome and clever as your father, you must obey the instant either of us calls to you."
        - id: ch01-b06
          speaker: narrator
          text: "Every one of those fifteen little Bob Whites wanted to grow up handsome and clever like their father. So whenever Bob or Mrs. Bob called, each youngster took care to obey that very second."
        - id: ch01-b07
          speaker: narrator
          text: "They were quite safe inside the dear Old Briar-patch, but Mrs. Bob practiced with them anyway. Every little while, she gave her danger call. At once, they had to crouch down and stay perfectly still. Then she would use another call, and they had to race back to her as fast as their small legs could carry them. Only when she was certain they would obey at once did she lead them through the grasses and weeds of the Green Meadows."
        - id: ch01-b08
          speaker: narrator
          text: "Out there, the danger was real, and Mrs. Bob made sure they understood it. Above them, old Redtail the Hawk circled through the air, watching for careless little creatures below. On the ground, Reddy Fox, Granny Fox, and Old Man Coyote prowled about. Their eyes were sharp, their ears were keen, and their wonderful noses were always searching for heedless youngsters. Down among the grasses, Mr. Blacksnake and some of his cousins could glide along without a sound."
        - id: ch01-b09
          speaker: narrator
          text: "The little Bob Whites soon learned to keep watch while they darted here and there in search of bugs, worms, and seeds. If they heard even the smallest sound they didn't know, they crouched low and waited until Mrs. Bob gave the call that meant all was well."
        - id: ch01-b10
          speaker: narrator
          text: "She showed them how to tell Ol' Mistah Buzzard from old Redtail the Hawk. Ol' Mistah Buzzard wouldn't harm a feather on them, and they could know him by the way he sailed on and on without beating his wings."
        - id: ch01-b11
          speaker: narrator
          text: "As soon as their own wings could carry them a little way, she gave them another lesson. Wherever they went, they must notice the nearest trees and bushes. Then, if danger suddenly came along the ground, they would know exactly where to fly. She also showed them how to choose the safest spots for the night."
        - id: ch01-b12
          speaker: narrator
          text: "Oh, those little Bob Whites had so much to learn! They couldn't afford to forget even one lesson. A single forgotten warning could bring something dreadful. So they remembered. Bob White taught them many lessons too, because he knew the ways of the Great World and was the very best of fathers."
        - id: ch01-b13
          speaker: narrator
          text: "The little Bob Whites grew and grew. At last, they were too big to cuddle beneath Mrs. Bob's wings, and they could fly on wings that were swift and strong. Through it all, they had been going to school without ever knowing it."
