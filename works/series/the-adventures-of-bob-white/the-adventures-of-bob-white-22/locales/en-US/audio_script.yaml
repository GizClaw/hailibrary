  chapters:
    - id: ch01
      title: A Joyous Day for the Bob Whites
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Three times blessed is any girl or boy who brings joy to another heart."
        - id: ch01-b02
          speaker: narrator
          text: "One day, quite by chance, Bob White flew into a tree overlooking Farmer Brown's henyard. Down below, he found the young Bob White everyone had thought was dead. Bob spoke with him, then hurried back to the Green Meadows with a light heart. Little Mrs. Bob was waiting anxiously, and she flew out to meet him."
        - id: ch01-b03
          speaker: bob_white
          text: "Everything's all right! I found him in Farmer Brown's henyard."
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: "By him, Bob meant the young bird they had given up for dead. Mrs. Bob could hardly believe the news."
        - id: ch01-b05
          speaker: mrs_bob
          text: "What? What's a henyard, and why is he there?"
          emotion: surprised
        - id: ch01-b06
          speaker: bob_white
          text: "It's where Farmer Brown keeps a lot of big, foolish birds. Little Bob is being kept there."
        - id: ch01-b07
          speaker: mrs_bob
          text: "Oh, how awful! If he's a prisoner, how can everything be all right?"
        - id: ch01-b08
          speaker: bob_white
          text: "Because he's perfectly safe there. He wouldn't be safe here with us. He can't fly, you see. The shot from that terrible gun broke one of his wings. Farmer Brown's boy found him and has treated him very kindly. He set the broken wing, and I believe it will be as good as ever."
        - id: ch01-b09
          speaker: bob_white
          text: "You know what would happen if little Bob were here with a broken wing. Sooner or later, Reddy Fox, Redtail the Hawk, or someone else would catch him. But they can't reach him in that wire pen. Little Bob can't get out, but they can't get in, so he's safe."
        - id: ch01-b10
          speaker: bob_white
          text: "He and Farmer Brown's boy have become great friends. I watched little Bob eat right from the boy's hand. Do you know, I truly believe that boy is our friend and that we can trust him."
        - id: ch01-b11
          speaker: mrs_bob
          text: "Peter Rabbit is always saying the same thing. But after all those two-legged creatures have made us suffer, I still can't decide whether any of them can be trusted. I need to see it myself."
        - id: ch01-b12
          speaker: bob_white
          text: "Then you will. Tomorrow morning, you can go there while I stay here with the other youngsters. If we leave them alone, I'm afraid one of them will do something careless or foolish and go where the hunters with those terrible guns can find them."
        - id: ch01-b13
          speaker: narrator
          text: "The next morning, Mrs. Bob went to visit the young bird. She saw everything Bob had seen the day before. When she returned, a great weight had lifted from her mind. Bob had been right. Farmer Brown's boy had shown that he was a true friend, and there was nothing to fear from him."
        - id: ch01-b14
          speaker: narrator
          text: "The following day, Bob and Mrs. Bob brought the whole family. Farmer Brown's boy had scattered food just outside the henyard, where the hens couldn't reach it. Bob was clever enough to know that no hunter would dare search for them so near Farmer Brown's house."
        - id: ch01-b15
          speaker: narrator
          text: "Morning after morning, the Bob Whites came there for breakfast. Soon, they didn't even fly away when Farmer Brown and his boy stepped outside to watch them eat."
        - id: ch01-b16
          speaker: narrator
          text: "Then, one morning, something wonderful happened. Farmer Brown's boy lifted young Bob out of the pen. The little bird looked like himself again. The cloth strips that had held his broken wing in place were gone, and the wing was as good as ever. The boy carried him outside the henyard and gently set him on the ground."
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: "There you are! Go join your family now, and from this day on, keep away from hunters."
        - id: ch01-b18
          speaker: narrator
          text: "The boy laughed as young Bob scampered over to his brothers and sisters. What a fuss they made over him!"
        - id: ch01-b19
          speaker: narrator
          text: "All at once, Bob White flew to the top of a post. He threw back his head and whistled as loudly as he could."
        - id: ch01-b20
          speaker: bob_white
          text: "Bob White! Bob White! Bob White!"
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: "He simply had to tell the whole Great World about the joy in his heart, even though this wasn't the season when he usually whistled."
        - id: ch01-b22
          speaker: narrator
          text: "That is how Bob White and his entire family came to Farmer Brown's regularly for breakfast. No hunter ever had another chance to bring fright, suffering, and sorrow among them."
        - id: ch01-b23
          speaker: narrator
          text: "And that is all about Bob White and his family. Ol' Mistah Buzzard has flown all the way from Ol' Virginny so I can tell you about him and his adventures. I have promised to do that in the very next book."
