audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    bob_white:
      display_name: 鹌鹑鲍勃
      tts:
        delivery: 快活机敏，从容中带着俏皮
        timbre: 清亮爽朗
        pace: 轻快而清楚
        pitch: 中高
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 果断利落，聪明自信，话里带着爽快的锋芒
        timbre: 清脆明亮
        pace: 明快而干脆
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 坦率热心，激动时坚定有力
        timbre: 清亮的少年嗓音
        pace: 明快而富有变化
        pitch: 中高
    little_bob_white:
      display_name: 小鹌鹑
      tts:
        delivery: 稚嫩谨慎，渐渐流露出安心与希望
        timbre: 轻柔清脆的幼鸟嗓音
        pace: 稍快而自然
        pitch: 高
  chapters:
    - id: ch01
      title: 找到了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁能把欢乐送进别人心房，这样的男孩女孩，便有三重福享。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，鹌鹑鲍勃碰巧飞上一棵树。它低头一看，正好能望见布朗农夫家的鸡场。那只失踪的小鹌鹑竟然就在里面！鲍勃和它说了话，便赶紧飞回绿草地。鲍勃太太一直在那里焦急地等着，一见它回来，立刻迎了上去。鲍勃心头那块大石头，总算落了地。
        - id: ch01-b03
          speaker: bob_white
          text: 没事啦！我找到它了，就在布朗农夫家的鸡场里。
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: 它说的，当然是那只大家以为已经死掉的小鹌鹑。鲍勃太太简直不敢相信。
        - id: ch01-b05
          speaker: mrs_bob
          text: 什么？鸡场是什么地方？它跑到那里做什么去了？
          emotion: surprised
        - id: ch01-b06
          speaker: bob_white
          text: 鸡场就是布朗农夫养着许多傻乎乎的大鸟的地方。小鹌鹑给关在里头，成了一个囚犯。
        - id: ch01-b07
          speaker: mrs_bob
          text: 这还不可怕吗？它都成囚犯了，你怎么能说没事啦？
          emotion: fearful
    - id: ch02
      title: 安全的囚犯
      blocks:
        - id: ch02-b01
          speaker: bob_white
          text: 因为它在那里真的很安全，跟我们待在一起反而危险。它现在飞不了。那根可怕的喷火棍打断了它一边翅膀，是布朗农夫家的男孩发现了它，还一直好好照顾它。男孩替它固定了翅膀，我看哪，准能长得跟从前一样好。
        - id: ch02-b02
          speaker: bob_white
          text: 你也知道，它断着翅膀留在这里，根本没有多少活命的机会。红狐雷迪、红尾鹰，或是别的什么家伙，迟早会捉住它。鸡场里却有一道铁丝围栏。小鹌鹑出不去，那些家伙也进不来，所以它才安全呀。
        - id: ch02-b03
          speaker: bob_white
          text: 再说，它和布朗农夫家的男孩已经成了好朋友。我亲眼瞧见它从男孩手里啄东西吃。依我看，那个男孩真的是我们的朋友，我们可以相信他。
        - id: ch02-b04
          speaker: mrs_bob
          text: 兔子彼得总是这么说。可我们吃过那些两脚巨怪那么多苦头，我还是信不过它们。我非得亲眼看看不可。
        - id: ch02-b05
          speaker: bob_white
          text: 那你就去看。明天早晨，你到鸡场去，我留下照看其他孩子。要是我们都走了，没准哪个孩子一时粗心，犯了傻，偏偏跑到那些猎人的喷火棍跟前。
        - id: ch02-b06
          speaker: narrator
          text: 第二天早晨，鲍勃太太去看望小鹌鹑，也亲眼见到了鲍勃见过的一切。回来时，她心头的重担已经放下了。鲍勃说得一点没错。布朗农夫家的男孩的确是真正的朋友，用不着怕他。
    - id: ch03
      title: 一家人的早餐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了一天，鲍勃夫妇把全家都带到了鸡场。男孩特意在围栏外撒了食物，那些母鸡够不着，小鹌鹑们却正好能吃。鲍勃还明白一个道理，离布朗农夫家这么近，猎人绝不敢来找它们。
        - id: ch03-b02
          speaker: narrator
          text: 从那以后，一早又一早，一家人总会来到这里吃早餐。布朗农夫家的男孩走出来看它们吃，后来连布朗农夫本人也一起出来，站在一旁看着它们。可它们照旧低头吃早餐，连一只也没有飞走。
        - id: ch03-b03
          speaker: narrator
          text: 后来的一天早晨，一件奇妙的事发生了。男孩把小鹌鹑从围栏里抱出来。这时，缚住断翅的布条已经解下，小鹌鹑看起来又和从前一模一样，那只翅膀也完全长好了。男孩把它带到鸡场外，轻轻放在地上。
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: 好啦，快回到家人身边去吧。以后可一定要躲着猎人。
        - id: ch03-b05
          speaker: narrator
          text: 男孩笑着看小鹌鹑飞快跑向兄弟姐妹，重新回到大家中间。
    - id: ch04
      title: 满心的欢乐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一家人全围了上来，又叫又跑，欢喜得不得了。忽然，鹌鹑鲍勃飞上篱笆桩顶。它仰起脑袋，用尽全身力气吹起口哨。
        - id: ch04-b02
          speaker: bob_white
          text: 鲍勃——怀特！鲍勃——怀特！鲍勃——怀特！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 这个时节，鲍勃平常并不吹口哨。可这一次，它无论如何也忍不住，非得把满心的欢乐告诉整个大千世界。
        - id: ch04-b04
          speaker: narrator
          text: 从此，鹌鹑鲍勃一家每天都到布朗农夫家吃早餐。再也没有哪个猎人能把惊恐、痛苦和悲伤带进它们中间。
        - id: ch04-b05
          speaker: narrator
          text: 鹌鹑鲍勃和它一家的故事，到这里就讲完了。老秃鹫先生已经从老弗吉尼亚一路飞来，特意要我把它和它的历险讲给你听。我答应了，就在下一本书里开讲。
