audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，遇到危险时略显慌张
        timbre: 年轻明亮
        pace: 偏快而灵活
        pitch: 中高
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和机灵，打趣时带着顽皮的笑意
        timbre: 圆润沉稳
        pace: 从容而清楚
        pitch: 中低
  chapters:
    - id: ch01
      title: 谁在老荆棘丛外转悠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            惦记鹌鹑鲍勃和它那个秘密小家的，可不止兔子彼得一个。哎呀，当然不是！彼得发现，狐狸雷迪和狐狸奶奶几乎一天到晚都在亲爱的老荆棘丛外面转悠。

            起先，彼得怎么也想不通。一天早晨，它躲在荆棘丛里看着那两只狐狸，心里琢磨起来。它们明知道在这里根本抓不住彼得，所以不会是冲它来的。草地鼠丹尼很久没到这边了，也不可能是来找丹尼的。难道它们盯上了鲍勃？可只要狐狸还在近旁，鲍勃就不会留在地面上。鲍勃不落地，它们又怎么抓得到呢？
        - id: ch01-b02
          speaker: narrator
          text: |-
            彼得想得太出神了，只顾猜雷迪和狐狸奶奶为什么老往这里跑。臭鼬吉米悄悄来到它身后，它竟然没听见，也没看见。吉米突然大叫一声：“哇！”彼得吓得差点儿从自己的皮里跳出来。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 你为什么要这样吓我？
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: |-
            吉米咧嘴笑了。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: |-
            我只是想教你一件事。就算打瞌睡，也得把耳朵竖起来，留心听着周围的动静。
        - id: ch01-b06
          speaker: peter_rabbit
          text: |-
            我根本没打瞌睡！我是在看雷迪和狐狸奶奶。我想知道，它们为什么总往这边来。
          emotion: angry
        - id: ch01-b07
          speaker: jimmy_skunk
          text: |-
            你刚才那样，跟睡着了也差不多。要是溜到你身后的不是我，是我的表亲黄鼠狼影子呢？
        - id: ch01-b08
          speaker: narrator
          text: |-
            一想到黄鼠狼影子，彼得浑身打了个寒战。
    - id: ch02
      title: 狐狸在寻找什么
      blocks:
        - id: ch02-b01
          speaker: jimmy_skunk
          text: |-
            彼得，你也不小了，早该懂得这个道理。只顾着一件事，连别的动静都忘了留意，这可不安全。至于雷迪和狐狸奶奶为什么老往这边跑，你本来就应该猜得到。
        - id: ch02-b02
          speaker: peter_rabbit
          text: 为什么？
        - id: ch02-b03
          speaker: jimmy_skunk
          text: |-
            鲍勃不是在这附近有个窝吗？
        - id: ch02-b04
          speaker: peter_rabbit
          text: |-
            是——吧。我想它是有一个。那又怎么了？
        - id: ch02-b05
          speaker: jimmy_skunk
          text: |-
            你这个笨蛋，雷迪和狐狸奶奶就是在找那个窝呀。
        - id: ch02-b06
          speaker: narrator
          text: |-
            彼得困惑地瞪着吉米，过了一会儿才开口。
        - id: ch02-b07
          speaker: peter_rabbit
          text: |-
            它们找窝干什么？它们又不吃蛋，对吧？
        - id: ch02-b08
          speaker: jimmy_skunk
          text: |-
            可蛋会孵出小鸟呀，对不对？只要雷迪和狐狸奶奶找到那个窝，它们就会守着，等蛋孵成小鸟。到了那个时候嘛……我听别人说，再没有什么比鹌鹑雏儿更鲜美了。现在你明白了吗？
        - id: ch02-b09
          speaker: narrator
          text: |-
            彼得当然懂了，这下它全明白了。雷迪和狐狸奶奶每天都听见鲍勃在那一带吹口哨，所以知道鲍勃的家就在附近。原来事情就是这么简单。眼下，再没有什么想不通的了。
    - id: ch03
      title: 吉米也打起了主意
      blocks:
        - id: ch03-b01
          speaker: jimmy_skunk
          text: |-
            对了，你该不会碰巧知道那个窝藏在哪儿吧？
        - id: ch03-b02
          speaker: peter_rabbit
          text: |-
            不知道，我真的不知道！你干吗想知道？
        - id: ch03-b03
          speaker: narrator
          text: |-
            彼得说完，忽然很庆幸，自己并不知道鲍勃的窝藏在哪里。听见吉米这样问，它也马上起了疑心。吉米倒没有绕弯子，答得十分坦白。
        - id: ch03-b04
          speaker: jimmy_skunk
          text: |-
            我就老实说吧。我肚子饿了，很想吃上几只蛋。
        - id: ch03-b05
          speaker: peter_rabbit
          text: |-
            你不会真要偷鲍勃先生和鲍勃太太的蛋吧？臭鼬吉米，我还以为你不会做这种事呢！
        - id: ch03-b06
          speaker: narrator
          text: |-
            吉米又咧嘴笑了。
        - id: ch03-b07
          speaker: jimmy_skunk
          text: |-
            别激动，彼得。听说鲍勃太太会下好多好多蛋。要真是这样，少上几只，它根本不会发觉。
        - id: ch03-b08
          speaker: peter_rabbit
          text: |-
            臭鼬吉米，你真讨厌。就是讨厌！
          emotion: disgusted
        - id: ch03-b09
          speaker: jimmy_skunk
          text: |-
            这可不能怪我。大自然老妈妈让我爱吃蛋，就像它让狐狸雷迪爱吃兔子一样。你真的一点儿也不知道那个窝在哪里？
        - id: ch03-b10
          speaker: peter_rabbit
          text: |-
            不知道！就算我知道，也绝不会告诉你。
        - id: ch03-b11
          speaker: jimmy_skunk
          text: |-
            好吧，那就再见啦。我看，我还是自己去找找。鲍勃和它的太太，我一点儿也不想伤害。不过，它们的蛋嘛，我倒真想吃上两三只。
        - id: ch03-b12
          speaker: narrator
          text: |-
            说完，臭鼬吉米便慢悠悠地走了。它要去寻找鹌鹑鲍勃的窝。
