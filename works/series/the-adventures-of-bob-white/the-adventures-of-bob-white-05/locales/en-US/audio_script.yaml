audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: quick and curious
        timbre: light and youthful
        pace: brisk
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and teasing
        timbre: mellow and earthy
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Others Are Interested in Bob White
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Peter Rabbit was not the only one interested in Bob White and his hidden home. Oh, no! It seemed to Peter that Reddy Fox and Granny Fox spent most of their time prowling around the dear Old Briar-patch. At first, Peter could not understand why. One morning, he watched them and tried to work it out."
        - id: ch01-b02
          speaker: peter_rabbit
          text: "They can't be after me. They know they can't catch me in here. And they can't be looking for Danny Meadow Mouse, because he hasn't come this way in a long time. It can't be Bob White either. He won't stay on the ground with those two nearby, and that's the only place they could catch him."
        - id: ch01-b03
          speaker: narrator
          text: "Peter was so busy wondering what brought Reddy and Granny there again and again that he never saw or heard Jimmy Skunk creep up behind him."
        - id: ch01-b04
          speaker: jimmy_skunk
          text: "Boo!"
        - id: ch01-b05
          speaker: narrator
          text: "The sudden shout startled Peter so badly that he nearly jumped out of his skin."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "Why did you do that?"
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: "Peter was very indignant. Jimmy only grinned."
        - id: ch01-b08
          speaker: jimmy_skunk
          text: "Maybe that will teach you not to fall asleep without keeping your ears open."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "I was not asleep! I was watching Reddy and Granny Fox. I can't figure out why they come over here so often."
          emotion: angry
        - id: ch01-b10
          speaker: jimmy_skunk
          text: "Well, you might as well have been asleep. What if I had been my cousin Shadow the Weasel?"
        - id: ch01-b11
          speaker: narrator
          text: "Peter shivered at the very thought of meeting Shadow the Weasel that way. Jimmy went on."
        - id: ch01-b12
          speaker: jimmy_skunk
          text: "You're old enough to know better, Peter. It isn't safe to get so wrapped up in one thing that you forget to watch for everything else. And you really ought to know why Reddy and Granny keep coming this way."
        - id: ch01-b13
          speaker: peter_rabbit
          text: "Why do they?"
        - id: ch01-b14
          speaker: jimmy_skunk
          text: "Doesn't Bob White have a nest somewhere near here?"
        - id: ch01-b15
          speaker: peter_rabbit
          text: "Y-e-s. I suppose he does. But what does that have to do with it?"
        - id: ch01-b16
          speaker: jimmy_skunk
          text: "Why, Reddy and Granny are hunting for his nest, you silly Rabbit."
        - id: ch01-b17
          speaker: narrator
          text: "Peter stared at Jimmy for a moment, still puzzled."
        - id: ch01-b18
          speaker: peter_rabbit
          text: "What would they want with a nest? They don't eat eggs, do they?"
        - id: ch01-b19
          speaker: jimmy_skunk
          text: "Those eggs will hatch into little birds, won't they? If Reddy and Granny find the nest, they'll wait for the birds to hatch. Then, well, people say there is nothing tastier than young Quail. Do you understand now?"
        - id: ch01-b20
          speaker: narrator
          text: "Peter understood. Of course he did. Now it all made perfect sense. Reddy and Granny had heard Bob White whistling in that same place every day. His whistle told them that his home could not be far away."
        - id: ch01-b21
          speaker: jimmy_skunk
          text: "By the way, you don't happen to know where that nest is, do you?"
        - id: ch01-b22
          speaker: narrator
          text: "Jimmy tried to sound as if the answer did not matter much."
        - id: ch01-b23
          speaker: peter_rabbit
          text: "No, I don't!"
        - id: ch01-b24
          speaker: narrator
          text: "All at once, Peter was glad he did not know. He began to feel suspicious."
        - id: ch01-b25
          speaker: peter_rabbit
          text: "Why do you want to know?"
        - id: ch01-b26
          speaker: jimmy_skunk
          text: "Because I'm hungry for eggs."
        - id: ch01-b27
          speaker: narrator
          text: "Jimmy admitted it quite openly."
        - id: ch01-b28
          speaker: peter_rabbit
          text: "You wouldn't steal Mr. and Mrs. Bob White's eggs, would you? I thought you were better than that, Jimmy Skunk."
        - id: ch01-b29
          speaker: narrator
          text: "Jimmy grinned again."
        - id: ch01-b30
          speaker: jimmy_skunk
          text: "Don't get so worked up, Peter. I've heard that Mrs. Bob lays a great many eggs. If that's true, she would never miss just a few."
        - id: ch01-b31
          speaker: peter_rabbit
          text: "Jimmy Skunk, you're horrid! There!"
          emotion: disgusted
        - id: ch01-b32
          speaker: jimmy_skunk
          text: "You can't blame me. Old Mother Nature gave me a taste for eggs, just as she gave Reddy Fox a taste for Rabbit. Are you sure you have no idea where that nest is?"
        - id: ch01-b33
          speaker: peter_rabbit
          text: "No, I haven't! And if I did know, I wouldn't tell you."
        - id: ch01-b34
          speaker: jimmy_skunk
          text: "Well, so long. I think I'll look for it myself. I don't want Bob White or his wife to come to any harm. I'd just like two or three of their eggs."
        - id: ch01-b35
          speaker: narrator
          text: "With that, Jimmy Skunk ambled away to search for Bob White's nest."
