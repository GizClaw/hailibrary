audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and spirited
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    hunter:
      display_name: Hunter
      tts:
        delivery: confident and matter-of-fact
        timbre: sturdy and mature
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Farmer Brown's Boy Speaks His Mind
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "You can't always be certain whether things have gone badly or well."
        - id: ch01-b02
          speaker: narrator
          text: "Poor little Bob White was wounded and in pain when he crawled beneath the fence. He didn't know he had crossed onto Farmer Brown's land. Signs there warned hunters to stay away, because no shooting was allowed. Then Bob looked up and saw one of those two-legged creatures right in front of him, just like the creature with the terrible fire-stick. He gave up all hope. His heart was too sick, and he was hurting too badly, to recognize Farmer Brown's boy."
        - id: ch01-b03
          speaker: narrator
          text: "But Farmer Brown's boy was exactly who stood there. He had worried that some hunter might ignore his father's signs and come onto their land. So the moment he finished breakfast, he had gone down to the Green Meadows. He saw the hunter on Farmer Jones's land and heard the shot. With all his heart, he hoped the hunter had missed."
        - id: ch01-b04
          speaker: narrator
          text: "Now he looked down at the small, suffering bird and knew the shot had struck him. Fierce anger rose inside the boy. He forgot that he too had once hunted with a dreadful gun, before he learned to know and love the little people of the Green Meadows, the Green Forest, and the Old Pasture."
        - id: ch01-b05
          speaker: narrator
          text: "He bent down and lifted Bob White with the greatest care. Bob closed his eyes. He felt sure the end would come very soon."
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: "Oh, you poor little thing. You poor, poor little thing!"
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: "The boy looked at Bob's torn and broken wing. Then he glared fiercely across at the hunter. At that moment, the hunter noticed him and started walking over. He thought he might offer the boy money for permission to hunt on Farmer Brown's land. After all, he knew Bob White's whole family had flown there. When the hunter reached the fence, he saw the little bird in the boy's hands."
        - id: ch01-b08
          speaker: hunter
          text: "Well, hello! I believe you've got my bird there."
          emotion: surprised
        - id: ch01-b09
          speaker: farmer_browns_boy
          text: "He is certainly not your bird!"
          emotion: angry
        - id: ch01-b10
          speaker: hunter
          text: "Oh, but he is. I shot him a little while ago, and then he escaped. Hand him over now, young man."
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: "I won't do any such thing. Maybe this is the bird you shot, and you ought to be ashamed of that. But he isn't yours. He's mine. I found him here on our land, so if he belongs to anyone, he belongs to me."
        - id: ch01-b12
          speaker: narrator
          text: "The hunter almost snapped back at him. Then he remembered that he wanted this boy's permission to hunt on Farmer Brown's land. He stopped the angry answer before it came out and tried another approach."
        - id: ch01-b13
          speaker: hunter
          text: "Why not wring his neck? Get your father to let me shoot on your land, and I'll kill another bird for you. Then you'll have yourself a fine dinner."
        - id: ch01-b14
          speaker: narrator
          text: "Farmer Brown's boy went red in the face."
        - id: ch01-b15
          speaker: farmer_browns_boy
          text: "Don't you dare step across this fence! These Bob Whites are some of my very best friends. They've worked for me all summer. Do you think I'll stand by and let anyone hurt them now, if I can stop it? I certainly won't!"
          emotion: angry
        - id: ch01-b16
          speaker: farmer_browns_boy
          text: "Just look at how this poor little bird is suffering. And you call that sport. Bah! The law may let you hunt Bob Whites, but it's a bad law. It's a horrible law. Things might be different if these birds caused harm. They don't. They spend the whole summer working for us. They help us save our crops, and once those crops are harvested, we turn around and let people shoot them!"
          emotion: disgusted
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: "Well, no one can shoot them on this land. The sooner you leave, the happier I'll be."
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: "The hunter didn't become angry. Instead, he laughed in a good-natured way."
        - id: ch01-b19
          speaker: hunter
          text: "All right, sonny. I'll stay off your land. But there's no need to get so worked up. They're only birds. Birds were made for shooting."
        - id: ch01-b20
          speaker: farmer_browns_boy
          text: "No more than you were! They have feelings, just as you do. This poor little bird is trembling like a leaf in my hand. I won't wring his neck. I'm going to do my best to make him well again."
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: "With that, Farmer Brown's boy turned his back on the hunter and headed home. Poor little Bob White didn't understand what the boy had said. He had no more hope than before."
