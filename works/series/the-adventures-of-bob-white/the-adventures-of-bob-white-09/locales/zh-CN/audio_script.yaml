audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，遇到危险时略显慌张
        timbre: 年轻明亮
        pace: 偏快而灵活
        pitch: 中高
    mrs_bob:
      display_name: 鲍勃太太
      tts:
        delivery: 果断利落，聪明自信，话里带着爽快的锋芒
        timbre: 清脆明亮
        pace: 明快而干脆
        pitch: 中高
    mrs_peter:
      display_name: 彼得太太
      tts:
        delivery: 温和细心，话音里带着沉着和体贴
        timbre: 柔和清亮
        pace: 从容自然
        pitch: 中高
  chapters:
    - id: ch01
      title: 眼见也未必敢信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            一件事儿亲眼见，偏偏还是不敢信。那么还有什么事，能叫你相信？我真想问个清。

            有些事就是这样，实在太出人意料，怎么想都不像真的。你去问兔子彼得，或者小小的彼得太太，它们都能告诉你。有一回，它们费了好大的劲，才相信自己亲眼看见的情景。
        - id: ch01-b02
          speaker: narrator
          text: |-
            彼得知道，鹌鹑鲍勃的家就在亲爱的老荆棘丛附近。鲍勃亲口说过，而且每天也总在这一带活动，所以彼得相信它说的是实话。

            春光这么好，大家又都忙着照料自己的家。要不是家就在近旁，谁会一天又一天守在同一个地方呢？
        - id: ch01-b03
          speaker: narrator
          text: |-
            可彼得找来找去，连鲍勃家的影子也没瞧见。它盯着鲍勃，把鲍勃去过的地方挨个查遍了，鲍勃却始终把秘密守得严严实实。彼得什么也没弄明白，倒因为跑得太多，瘦了一圈。

            小小的彼得太太费尽口舌，想让它明白，这根本不关它的事。她很明白鲍勃太太为什么要藏好自己的家。她的宝宝还很小的时候，她也曾担惊受怕地熬过许多个钟头。
        - id: ch01-b04
          speaker: narrator
          text: |-
            到最后，彼得终于不找了。倒不是它不好奇了，而是能想到的地方，它全都找过。于是它认定，就算鲍勃真把窝筑在绿草地上，那窝也一定不在亲爱的老荆棘丛附近。
    - id: ch02
      title: 荆棘丛里的提醒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            后来有一天早晨，意想不到的事发生了。彼得正要跑去欢笑溪，老荆棘丛里忽然有人在它面前喊起来。
        - id: ch02-b02
          speaker: mrs_bob
          text: 兔子彼得，小心脚下！
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: |-
            彼得立刻停住，四下寻找说话的人。荆棘交错的枝条下面，站着小小的鲍勃太太。可彼得根本没看见她进来，不由得吃了一惊。
        - id: ch02-b04
          speaker: narrator
          text: 彼得惊讶地喊了一声“哎呀”，随即彬彬有礼地鞠了一躬，这才向她问好。
        - id: ch02-b05
          speaker: peter_rabbit
          text: |-
            你好，鲍勃太太！真高兴你来拜访我们。

            鲍勃还好吧？我好几天没见到它了，只听见过它吹口哨。那声音听起来，它的精神一定很不错。
        - id: ch02-b06
          speaker: mrs_bob
          text: |-
            它很好。

            不过彼得，求你一定要小心脚下。
          emotion: fearful
        - id: ch02-b07
          speaker: peter_rabbit
          text: 为什么？出什么事了？
        - id: ch02-b08
          speaker: narrator
          text: 彼得满脸困惑，低头瞧着自己的脚。就在这时，彼得太太听见它们说话，匆匆赶了过来。鲍勃太太一见她，更加焦急了。
        - id: ch02-b09
          speaker: mrs_bob
          text: 哎呀，彼得太太，你也要小心！千万、千万留神脚下！
          emotion: fearful
    - id: ch03
      title: 活过来的枯叶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            彼得太太和彼得一样，完全摸不着头脑。

            这时，小小的鲍勃太太发出一声轻柔又甜美的呼唤。忽然间，彼得和彼得太太觉得，铺在亲爱的老荆棘丛里的褐色枯叶全都一下子活了，竟然纷纷跑了起来。
        - id: ch03-b02
          speaker: narrator
          text: |-
            彼得的眼珠子都快瞪出来了。它揉了两遍眼睛，非得弄清自己看见的是不是真的。

            那究竟是什么？嗨，原来是一大家子最逗趣的小鸟！它们迈开小小的腿，能跑多快就跑多快，直奔鲍勃太太而去，一股脑儿全钻到她的翅膀底下躲了起来！
