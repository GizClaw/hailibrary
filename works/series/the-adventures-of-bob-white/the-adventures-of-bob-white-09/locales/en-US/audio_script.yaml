  chapters:
    - id: ch01
      title: Peter Has Hard Work Believing His Own Eyes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Sometimes you see a thing with your own eyes and still can't believe it's so. If you can't believe that, what can you believe? I'd truly like to know."
        - id: ch01-b02
          speaker: narrator
          text: "That does happen sometimes. A thing can be so surprising that it hardly seems true. Just ask Peter Rabbit or little Mrs. Peter. Both of them once had a hard time believing what they saw with their own eyes."
        - id: ch01-b03
          speaker: narrator
          text: "Peter knew Bob White had made his home somewhere near the dear Old Briar-patch. Bob had told him that much, and Bob was always close by. Why would he stay in one place, day after day? It was beautiful springtime, everyone was busy keeping house, and surely Bob's own home had to be near."
        - id: ch01-b04
          speaker: narrator
          text: "Even so, Peter searched and searched, and he never caught a glimpse of Bob's home. He kept watch on Bob, then went to every place Bob visited. It did no good. Bob's secret stayed safe, Peter was no wiser, and all that running around only made him thinner."
        - id: ch01-b05
          speaker: narrator
          text: "Little Mrs. Peter did her best to tell him it was none of his business. She understood why Mrs. Bob wanted a secret home. When her own babies were very small, Mrs. Peter had spent many anxious hours worrying about them."
        - id: ch01-b06
          speaker: narrator
          text: "Finally, Peter gave up, though Mrs. Peter had not persuaded him. He stopped only because he had looked everywhere he could think to look. If Bob White really had a nest in the Green Meadows, Peter decided, then it simply couldn't be near the dear Old Briar-patch."
        - id: ch01-b07
          speaker: narrator
          text: "Then, one morning, something surprising happened. Peter was about to run over to the Laughing Brook when someone right in front of him, there in the Old Briar-patch, called out."
        - id: ch01-b08
          speaker: mrs_bob_white
          text: "Peter Rabbit, watch where you put your feet!"
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: "Peter stopped short and looked around. There, beneath a tangle of brambles, sat little Mrs. Bob White. What a surprise! Peter had not even noticed her entering the dear Old Briar-patch."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "Oh!"
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: "Then Peter gave her a polite bow."
        - id: ch01-b12
          speaker: peter_rabbit
          text: "How are you, Mrs. Bob White? I'm glad you've come to visit us. I hope Bob is doing well. I haven't seen him for several days, but I've heard him whistle. He certainly sounds as if he's feeling fine."
        - id: ch01-b13
          speaker: mrs_bob_white
          text: "He is. But Peter, please, please watch where you step."
          emotion: fearful
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Why? Is something wrong?"
        - id: ch01-b15
          speaker: narrator
          text: "Peter looked down at his feet, completely puzzled. Just then Mrs. Peter heard them talking and hurried over. Mrs. Bob White grew more anxious than before."
        - id: ch01-b16
          speaker: mrs_bob_white
          text: "Oh, Mrs. Peter, please be careful where you step too!"
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: "Mrs. Peter was every bit as puzzled as Peter. Then little Mrs. Bob gave the softest, sweetest call."
        - id: ch01-b18
          speaker: narrator
          text: "All at once, the brown leaves carpeting the dear Old Briar-patch seemed to come alive and run. Peter's eyes nearly popped out of his head. He rubbed them twice, just to be sure he was truly seeing what he thought he saw."
        - id: ch01-b19
          speaker: narrator
          text: "And what did he see? A whole family of the funniest little birds! Their tiny legs carried them as fast as they could go, straight to the shelter of Mrs. Bob's wings."
