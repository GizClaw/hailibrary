  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and impulsive
        timbre: youthful and light
        pace: quick
        pitch: medium-high
    mrs_peter:
      display_name: Mrs. Peter
      tts:
        delivery: practical and caring
        timbre: gentle and clear
        pace: measured
        pitch: medium-high
