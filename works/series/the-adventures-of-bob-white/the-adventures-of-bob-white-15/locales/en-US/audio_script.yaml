audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and spirited
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: kindly and plainspoken
        timbre: warm and sturdy
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Good Friends in the Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "What does it mean to be indignant? It means being angry for a good reason. When you lose your temper just because things don't suit you, you're only angry. But when your anger rises because someone has been harmed or treated unfairly, even if that someone is you, then you're indignant."
        - id: ch01-b02
          speaker: narrator
          text: "Farmer Brown's boy spent every spare minute down in the garden, watching Bob White and his family. He was there so often that the Bob Whites came to see him as harmless, and perhaps even as a friend. They paid no attention to him. They simply went on with their work as though he weren't there."
        - id: ch01-b03
          speaker: narrator
          text: "Their work was to clear the garden of bugs, worms, and weed seeds, while filling their own stomachs. Farmer Brown's boy was delighted to see that the bugs and worms they liked best were the very ones that caused the most damage to the growing plants."
    - id: ch02
      title: The Secret of the Wheat Field
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Beyond the garden stood a field of wheat. Wheat, as you know, gives us the flour used to make bread. A certain little insect called the chinch bug is terribly hungry. When great numbers of them enter a wheat field, they can ruin the whole crop. They suck the juices from the wheat until the plants wilt and die."
        - id: ch02-b02
          speaker: narrator
          text: "Farmer Brown's neighbors had been complaining that chinch bugs were especially bad that year. One look at the wheat on their farms showed that this was true. Yet Farmer Brown's wheat looked as fine as wheat could look. There clearly weren't any chinch bugs in his field. Farmer Brown's boy often wondered why his father's wheat had escaped when the neighboring fields had not."
        - id: ch02-b03
          speaker: narrator
          text: "He had noticed that Bob White and his family spent a great deal of time among the wheat. Then one day, he saw Bob pick something from a wheat stem. He went closer to find out what it was. Bob scurried away, of course, but several chinch bugs were still on the plant."
        - id: ch02-b04
          speaker: narrator
          text: "At once, Farmer Brown's boy understood. Bob had been plucking those dreadful little bugs from the wheat and eating them. Now the boy also knew why their field was the finest for miles around. Bob White and his family searched for the chinch bugs and ate them as quickly as they appeared."
        - id: ch02-b05
          speaker: farmer_browns_boy
          text: "Hurrah for you! A farmer couldn't ask for better little helpers!"
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: "Farmer Brown's boy cried out with delight, then hurried away to tell his father what he had discovered."
    - id: ch03
      title: A Respectful Refusal
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Summer passed, and the cool, crisp days of autumn arrived. The wheat was harvested. The vegetables were gathered and stored away. Jack Frost had begun painting the maple trees red and yellow. The garden lay bare, and the stubble in the wheat field had turned golden brown."
        - id: ch03-b02
          speaker: narrator
          text: "The little feathered folk who disliked cold weather had followed Ol' Mistah Buzzard south to the sunshine. Striped Chipmunk, Chatterer the Red Squirrel, and Happy Jack the Gray Squirrel worked from morning to night, storing seeds and nuts for the long, cold winter. They were glorious days, and Bob White loved every one of them."
        - id: ch03-b03
          speaker: narrator
          text: "One morning, Farmer Brown spoke to his son. A kind little twinkle shone in his eyes."
        - id: ch03-b04
          speaker: farmer_brown
          text: "Son, those Bob Whites must be nice and fat after eating so well all summer. We've fed them from the farm, so perhaps it's time for them to feed us. Broiled Bob White on toast sounds mighty good. Shooting season starts next week. I suppose you'll take your gun out and bring a few home for us."
        - id: ch03-b05
          speaker: narrator
          text: "Farmer Brown's boy missed the twinkle in his father's eyes. His face turned red, and hot anger filled his heart. He was indignant, very indignant, that his father could even suggest such a thing. Still, he remembered to speak respectfully."
        - id: ch03-b06
          speaker: farmer_browns_boy
          text: "No, sir! Nothing in the world could make me shoot one of them. They don't owe us a thing. We're the ones who owe them. Without those birds, we wouldn't have harvested even half as much wheat, and our garden would be just as poor as our neighbors' gardens. I won't shoot them, and if I can stop anyone else from shooting them, I will. So there!"
          emotion: angry
