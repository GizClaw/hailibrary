audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 认真好奇，带着少年人的坦率和活力
        timbre: 清朗自然
        pace: 明快而有思考感
        pitch: 中高
    farmer_brown:
      display_name: 布朗农夫
      tts:
        delivery: 朴实厚道，说话直爽而慈爱
        timbre: 浑厚温暖
        pace: 从容稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 什么叫愤愤不平
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 所谓愤愤不平，是为了正当的缘故动怒。事情只是不合自己的心意，就发脾气，任由怒火冒出来，那不过是在生气。可要是别人受到了伤害，遭遇了不公，或者这样的事落在了自己身上，心里的怒火一下子涌起来，那才叫愤愤不平。
    - id: ch02
      title: 麦田里的小帮手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 布朗农夫家的男孩一有空，就待在菜园里看鹌鹑鲍勃一家。他去得太勤，鲍勃一家早就知道他不会伤害它们。就算还没把他当成朋友，也不再怕他了。它们根本不理会男孩，就当他不在那里，只管在他身边寻找小虫、毛虫和杂草籽，把自己的肚子填饱。男孩看得很高兴，因为它们最爱吃的，正是那些最会糟蹋庄稼的坏家伙。
        - id: ch02-b02
          speaker: narrator
          text: 菜园那边还有一片麦田。面包用的面粉，就是小麦磨成的。有一种叫麦蝽的小虫，怎么也吃不饱。一大群麦蝽钻进田里，会吸干麦苗的汁液，让麦苗枯萎死去，甚至毁掉整片庄稼。那一年，邻居们都在抱怨麦蝽闹得厉害。看看他们田里的麦子，男孩就知道情况确实很糟。奇怪的是，布朗农夫家的小麦却长得好极了，田里明明没有麦蝽。附近的麦田都受了害，为什么只有自家的田没事呢？男孩一直想不明白。
        - id: ch02-b03
          speaker: narrator
          text: 他渐渐发现，鲍勃一家常常在麦田里待很久。有一天，他看见鲍勃正从一根麦秆上啄着什么，便走近去瞧个明白。鲍勃当然赶紧跑开了。男孩低头查看那株麦子，竟然发现了几只麦蝽。原来鲍勃刚才是在啄这些可恶的小虫，把它们一只只吃下去。男孩终于明白了。方圆几英里之内，自家的小麦长得最好，正是因为麦蝽刚一出现，鲍勃一家就会立刻把它们找出来吃掉。
        - id: ch02-b04
          speaker: farmer_browns_boy
          text: 好哇！你们真是农夫能找到的最棒的小帮手！
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: 男孩欢呼着，赶紧跑去把这个发现告诉布朗农夫。
    - id: ch03
      title: 秋天来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 夏天过去了，清凉爽朗的秋日到了。小麦收割完了，蔬菜也采下来储藏好了。霜杰克把枫叶染成红色和黄色，菜园变得空荡荡的，麦田里的残茬则是一片金棕色。怕冷的羽族小家伙跟着秃鹰老爷，飞去了阳光灿烂的南方。花栗鼠条纹、红松鼠喋喋和灰松鼠快乐杰克，从早到晚忙着储藏种子和坚果，为漫长寒冷的冬天做准备。这样的日子真好，鹌鹑鲍勃喜欢其中的每一天。
    - id: ch04
      title: 男孩生气了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一天早晨，布朗农夫对儿子说起了鲍勃一家。说话的时候，他眼里闪着亲切的笑意，可男孩没有看出来。
        - id: ch04-b02
          speaker: farmer_brown
          text: 孩子，鲍勃一家吃了这么久的好东西，准都长胖了。我们用农场里的东西喂了它们一整个夏天，现在也该轮到它们喂饱我们了吧？把鹌鹑鲍勃烤好，放在吐司上，味道一定不错。下星期狩猎季就开始了，你该拿出猎枪，替我们打几只回来。
        - id: ch04-b03
          speaker: narrator
          text: 男孩的脸顿时涨得通红，心里燃起一股怒火。他是真的愤愤不平。一想到父亲竟然会暗示要打死这些小鸟，他就气愤极了。不过，即使气成这样，他也没有忘记应当尊敬父亲。
        - id: ch04-b04
          speaker: farmer_browns_boy
          text: 不，爸爸！不管拿什么来换，我也绝不会打死它们中的任何一只！它们根本不欠我们什么，是我们欠它们的。没有它们，我们连一半的小麦都收不到，菜园也会跟邻居家的一样糟。我不会打它们。只要我拦得住，我也绝不许别人打它们。就是这样！
          emotion: angry
