audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 认真好奇，带着少年人的坦率和活力
        timbre: 清朗自然
        pace: 明快而有思考感
        pitch: 中高
    farmer_brown:
      display_name: 布朗农夫
      tts:
        delivery: 朴实厚道，说话直爽而慈爱
        timbre: 浑厚温暖
        pace: 从容稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 数字也会说话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            别说你“讨厌”算术，
            嫌它枯燥又无趣。
            只要真心试一试，
            准有奇事等着你。
        - id: ch01-b02
          speaker: narrator
          text: 布朗农夫家的男孩以前就嫌算术又难又没意思，只会叫人费力。他不明白，在学校里费那么大劲儿做算术题，究竟有什么用。回到家，他也常为这件事抱怨。布朗农夫总是先听一会儿，再开口劝他。每次说起下面这句话，父亲眼里都会闪着笑意。
        - id: ch01-b03
          speaker: farmer_brown
          text: 孩子，等你再长大些，就会发现数字也能说话，还会告诉你许多奇妙的事。
        - id: ch01-b04
          speaker: narrator
          text: 男孩当然知道，父亲不是说数字真的能张嘴。可父亲到底是什么意思，他一直没弄懂，也懒得认真想。他还是一见算术题就皱眉，只希望老师别留那么难的功课。等漫长的暑假来了，他索性把数字和算术题全抛到了脑后。后来，他发现鹌鹑鲍勃一家正在园里吃小虫、毛虫和杂草籽，事情这才变了。
    - id: ch02
      title: 十二乘十七
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 从那以后，男孩每天都去菜园看它们。鲍勃一家很快看出他不会伤害它们，就不再理会他，只顾不停地在他四周走来走去，寻找种子、毛虫和小虫，好把肚子填饱。一天，男孩亲眼数着鲍勃吃下了十二条毛虫。他赶紧掏出一截短铅笔，又拿来一片小纸。
        - id: ch02-b02
          speaker: farmer_browns_boy
          text: 要是每只鹌鹑一顿都能吃掉十二条这种讨厌的毛虫，那总共是多少呢？我来算算。
        - id: ch02-b03
          speaker: narrator
          text: 男孩皱着眉头想起来。
        - id: ch02-b04
          speaker: farmer_browns_boy
          text: 鲍勃一只，鲍勃太太一只，还有十五只小鲍勃，一共十七只。每只吃十二条，就是十二乘十七。
        - id: ch02-b05
          speaker: narrator
          text: 他在纸片上写下数字，算了好几分钟。
        - id: ch02-b06
          speaker: farmer_browns_boy
          text: 一顿就是二百零四条毛虫。就算它们每天只吃一顿，三十天也能吃六千一百二十条。可是它们一天明明要吃好多顿，那岂不是……
        - id: ch02-b07
          speaker: narrator
          text: 男孩说不下去了。他瞪圆眼睛，看着纸片上的数字，惊奇得低低吹了一声口哨。
        - id: ch02-b08
          speaker: farmer_browns_boy
          text: 原来这些家伙天天在园里帮忙！难怪我的菜长得这么好！
          emotion: surprised
    - id: ch03
      title: 再算一算
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 男孩又坐下来，看鲍勃太太捕捉菜粉蝶。他知道，菜粉蝶产下的卵会孵成毛虫，把卷心菜糟蹋掉。只要鲍勃太太还在眼前，他就一只一只数着，看她能捉多少。接着，他又去数另一只鹌鹑捉到的黄瓜甲虫，还数了一只鹌鹑吃掉的蚱蜢。数完这些，他拿起小纸片，接着算了起来。
        - id: ch03-b02
          speaker: narrator
          text: 算出结果以后，男孩马上站起身，径直跑到玉米地里。布朗农夫正在那里干活。
    - id: ch04
      title: 算术说出的秘密
      blocks:
        - id: ch04-b01
          speaker: farmer_browns_boy
          text: 爸爸，我现在终于懂了。你以前说数字会说话，原来是这个意思！数字告诉我的事情，比我做梦能想到的还多呢！我算明白了，鹌鹑鲍勃一家就是我们最要好的朋友。附近数咱们家的菜园长得最好，正是因为有它们帮忙。那些棕色的小鸟一直在替咱们挣钱，可咱们从来都没想到！
          emotion: surprised
