audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: patient and quietly amused
        timbre: sturdy and warm
        pace: unhurried
        pitch: medium-low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: earnest and energetic
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Little Lesson in Arithmetic
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Don't say you hate arithmetic, or call it dull and dry. Give it an honest try, and what you find may astonish you."
        - id: ch01-b02
          speaker: narrator
          text: "Farmer Brown's boy used to feel just that way, though he doesn't anymore. At school, he could see no point in struggling with sums. To him, arithmetic was nothing but hard work, and he often complained about it at home. Farmer Brown would listen for a while before answering."
        - id: ch01-b03
          speaker: farmer_brown
          text: "If you live long enough, my son, you'll discover that figures can talk. And they can tell you the most wonderful things."
        - id: ch01-b04
          speaker: narrator
          text: "Whenever Farmer Brown said that, his eyes would twinkle. His boy knew he didn't mean that figures could truly speak aloud. Still, he never understood what his father did mean, and he wasn't curious enough to find out. He went right on scowling at his arithmetic and wishing the teacher would stop giving such difficult lessons. When the long summer vacation came, he forgot all about figures and sums. Then he discovered Bob White and his family helping clear the garden of bugs, worms, and weed seeds."
        - id: ch01-b05
          speaker: narrator
          text: "After that discovery, Farmer Brown's boy went down to the garden every day to watch the birds. They soon learned that he meant them no harm. Before long, they paid no attention to him and carried on with their work all around him, filling their stomachs with seeds, worms, and bugs. One day, as the boy watched, Bob White ate twelve caterpillars. The boy pulled out a stubby pencil and a scrap of paper."
        - id: ch01-b06
          speaker: farmer_browns_boy
          text: "Suppose every one of those Bob Whites eats twelve of those horrible worms at one meal. That would be... let me think."
        - id: ch01-b07
          speaker: narrator
          text: "He wrinkled his brow and began to count."
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: "There's Bob, Mrs. Bob, and fifteen young Bobs. That makes seventeen birds. If every bird eats twelve, I need to multiply twelve by seventeen."
        - id: ch01-b09
          speaker: narrator
          text: "He wrote the figures on his scrap of paper and worked at the sum for a few minutes."
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: "That's two hundred and four caterpillars in one meal. In a thirty-day month, they'd eat six thousand one hundred and twenty, even if they only ate once a day. But they eat ever so many meals every day, and that means..."
        - id: ch01-b11
          speaker: narrator
          text: "He stopped. His eyes grew round as he stared at the figures on the paper. Then, in sheer astonishment, he gave a low whistle."
        - id: ch01-b12
          speaker: farmer_browns_boy
          text: "No wonder my garden is doing so well with those fellows working in it!"
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: "Then he sat down and watched Mrs. Bob catch cabbage butterflies. He knew those butterflies laid the eggs that would hatch into worms and spoil the cabbages. He counted every one she caught while she was in sight. Next he counted the cucumber beetles another Bob White caught. Then he watched one more hunting grasshoppers. The boy covered his scrap of paper with more figures. As soon as he finished, he stood up and went straight to the cornfield, where Farmer Brown was working."
        - id: ch01-b14
          speaker: farmer_browns_boy
          text: "Now I understand what you meant when you said figures could talk. They've told me more than I ever imagined! They've shown me that the Bob Whites are our very best friends. We have the finest garden around because those birds made it that way. Why, those little brown birds are actually earning money for us, and we never even knew it!"
          emotion: surprised
