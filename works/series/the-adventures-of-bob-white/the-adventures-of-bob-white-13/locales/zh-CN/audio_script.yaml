audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
    farmer_brown:
      display_name: 布朗农夫
      tts:
        delivery: 朴实厚道，说话直爽而慈爱
        timbre: 浑厚温暖
        pace: 从容稳健
        pitch: 中低
    farmer_browns_boy:
      display_name: 布朗农夫家的男孩
      tts:
        delivery: 认真好奇，带着少年人的坦率和活力
        timbre: 清朗自然
        pace: 明快而有思考感
        pitch: 中高
  chapters:
    - id: ch01
      title: 菜园为什么这样好
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            凡事发生都有缘由，
            只要留心便能寻到。
            世上没有无缘无故，
            这句话可要牢牢记好。
        - id: ch01-b02
          speaker: narrator
          text: 一天早晨，一家人正坐在桌旁吃早餐，布朗农夫跟儿子说起了菜园。
        - id: ch01-b03
          speaker: farmer_brown
          text: 孩子，附近几家的菜园数咱们家的长得最好。往年我也没见过园子受虫害这么少。今年邻居们都说，小虫和毛虫比什么时候都厉害。他们想尽办法，菜还是快被吃光了。你把咱们的菜园照料得真不错，我为你骄傲。
        - id: ch01-b04
          speaker: narrator
          text: 男孩听得脸都红了，心里别提多高兴。自从种子下地，他就在园里下了许多苦功。他除杂草，也捉小虫和毛虫。可是有些邻居同样卖力，下的工夫一点儿不比他少，菜园却差不多全毁了。那些虫子实在太多，他们怎么也对付不了。为什么自己能成功，他们却不行？男孩怎么也想不明白。一定有个缘故，因为每件事都有缘故。
    - id: ch02
      title: 一部分缘故
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 早餐过后，男孩戴上旧草帽，到菜园里仔细看一看。他一路还在反复琢磨，自家的菜园为什么偏偏比别家的好。园子边上有块旧木板，他掀起一头往下看。老蟾蜍先生抬起眼皮，困倦地眨了眨眼，却又分明是在友好地向他打招呼。它的背心鼓得紧绷绷的，看着都不舒服。
        - id: ch02-b02
          speaker: narrator
          text: 男孩明白，那件背心里装的全是小虫和毛虫。他笑了笑，轻轻放下木板。
        - id: ch02-b03
          speaker: farmer_browns_boy
          text: 原来，这就是一部分缘故。
        - id: ch02-b04
          speaker: narrator
          text: 再往前走，他看见歌雀小友也在浆果丛间忙个不停。男孩忍不住轻声笑起来。
        - id: ch02-b05
          speaker: farmer_browns_boy
          text: 瞧，这又是一个缘故。
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: 他走到一条长菜畦尽头，坐下来认真想。老蟾蜍先生、歌雀小友，还有老果园里那么多羽毛小居民，的确帮了大忙。可往年它们也来帮过，那时虫子还远没有今年这么多，菜园却长得连今年一半都不如。它们的帮助，加上男孩自己的辛苦，只说明了一部分。一定还有什么，是他没有发现的。
    - id: ch03
      title: 鲍勃一家来干活
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 男孩想得太专心，坐在那里纹丝不动。没过多久，一双亮眼睛从浆果丛底下探出来，偷偷望着他。随后，一个棕、灰、白三色相间，又带着黑色斑纹的俊俏小家伙走到了他面前。正是鹌鹑鲍勃。
        - id: ch03-b02
          speaker: narrator
          text: 鲍勃低低唤了一声，鲍勃太太带着十五个孩子一口气全跑了出来。它又招呼一声，小家伙们马上散开，钻进菜苗间各自忙了起来。
        - id: ch03-b03
          speaker: narrator
          text: 男孩屏住呼吸，静静看着。因为他坐得一动不动，鹌鹑们根本没理会他。有几只像家里的母鸡那样，用爪子刨开泥土，再啄起一些小得看不清的东西。男孩虽然看不见，却知道那些是细小的种子。他和父亲种下的种子早已长成一棵棵壮实的菜蔬，所以眼前这些小种子，只会是杂草籽。
    - id: ch04
      title: 剩下的缘故
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 鲍勃自己在马铃薯藤间忙着。它离男孩很近，每一个动作都看得清楚。那些带条纹的甲虫，男孩捉了那么久，早已恨透了。现在，鲍勃正把它们一只只吃掉。
        - id: ch04-b02
          speaker: farmer_browns_boy
          text: 一、二、三、四、五、六、七、八、九、十、十一。
        - id: ch04-b03
          speaker: narrator
          text: 数到这里，鲍勃走去了看不见的地方。南瓜藤那边，鲍勃太太啄起小虫来，和鲍勃吃马铃薯甲虫一样快。其他孩子在忙些什么，男孩没有看见，可他已经猜到了。
        - id: ch04-b04
          speaker: farmer_browns_boy
          text: 哈，剩下的缘故也找到了！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 他得意之下喊出了声。只是一眨眼，鲍勃一家便全都没了踪影。
