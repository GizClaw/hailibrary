audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: hearty and approving
        timbre: deep and sturdy
        pace: measured
        pitch: low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: thoughtful and earnest
        timbre: youthful and clear
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: The Finest Garden Around
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Everything that happens has a reason, if only you look for it. That's a good thing to remember."
        - id: ch01-b02
          speaker: farmer_brown
          text: "Son, our garden looks finer than any other garden around. I can't remember another year when bugs and worms did so little damage here. Every one of our neighbors says they're worse than ever. Their gardens are being eaten up, no matter how hard they fight them. I'm proud of the care you've given ours."
        - id: ch01-b03
          speaker: narrator
          text: "Farmer Brown's boy flushed with pleasure. He had worked hard in that garden from the day the seeds went into the ground. He had fought the weeds, the bugs, and the worms at every turn. But he knew that some of the neighbors had worked just as hard. Even so, their gardens were almost ruined because the bugs and worms had been too much for them. Why had his own work succeeded when theirs had failed? He couldn't understand it. There had to be a reason. Everything had one."
    - id: ch02
      title: Parts of the Reason
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "After breakfast that morning, the boy put on his old straw hat and walked down to inspect the garden. All the way there, he kept wondering why it looked so much better than the others. An old board lay at the garden's edge. He raised one end and peeked beneath it. Old Mr. Toad looked up and gave him a sleepy but very friendly blink. His waistcoat bulged until it seemed much too tight for comfort. The boy smiled and gently lowered the board again. He knew exactly what made that waistcoat so tight. It was full of bugs and worms."
        - id: ch02-b02
          speaker: farmer_browns_boy
          text: "Well, there's one part of the reason."
        - id: ch02-b03
          speaker: narrator
          text: "A little farther along, he spotted Little Friend the Song Sparrow working busily among the berry bushes."
        - id: ch02-b04
          speaker: farmer_browns_boy
          text: "And there's another part."
        - id: ch02-b05
          speaker: narrator
          text: "The boy chuckled, then sat down at the end of a long row to think. Old Mr. Toad, Little Friend, and many birds from the Old Orchard had certainly helped his garden. But they had helped in other years too, when his garden had looked only half as good and there had been far fewer bugs and worms. Their help and his own hard work explained some of it. Still, he felt sure there was something else he hadn't found yet."
    - id: ch03
      title: The Bob Whites Go to Work
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "He thought so deeply that he sat perfectly still. Before long, two bright eyes peered at him from beneath a berry bush. Then a smart, neat little fellow stepped right out in front of him. He wore brown, gray, and white, with black trimmings. It was Bob White. Bob gave a soft call, and out hurried Mrs. Bob with fifteen children behind her. At one word from him, the whole family scattered among the plants and got to work."
        - id: ch03-b02
          speaker: narrator
          text: "Farmer Brown's boy held his breath and watched. The birds paid no attention to him at all because he stayed perfectly still. Some scratched at the soil just like the hens back home. Then they picked up things too tiny for him to see. Still, he knew what those little things were. Every seed that he and Farmer Brown had planted was now a great, strong plant. That meant the tiny seeds the birds were eating had to be weed seeds."
    - id: ch04
      title: The Rest of the Reason
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Bob was busy among the potato vines, close enough for the boy to see him clearly. He was eating the striped beetles that the boy had fought for so long and had learned to hate."
        - id: ch04-b02
          speaker: farmer_browns_boy
          text: "One, two, three, four, five, six, seven, eight, nine, ten, eleven."
        - id: ch04-b03
          speaker: narrator
          text: "The boy counted eleven beetles before Bob moved to a place where he could no longer be seen. Over among the squash vines, Mrs. Bob was picking off bugs just as fast as Bob had eaten the potato beetles. The boy didn't know exactly what the rest of the family was doing among the plants, but now he could make a very good guess."
        - id: ch04-b04
          speaker: farmer_browns_boy
          text: "That's the rest of the reason!"
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: "He cried out in triumph. In a twinkling, every Bob White had vanished."
