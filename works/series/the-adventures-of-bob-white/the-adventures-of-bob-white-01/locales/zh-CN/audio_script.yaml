audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 第一章　快乐的劳动者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            吹声口哨唱支歌，天天干活也快活。
        - id: ch01-b02
          speaker: narrator
          text: |-
            绿草地、绿森林和老果园里，住着许多羽毛小居民。它们早就明白，干活时唱唱歌，活儿也会做得更轻快。所以一到春天，它们忙着筑巢，四处便响起了歌声。大多数鸟儿会唱歌，其中有一只却爱吹口哨。那哨声又清亮又欢快，听见的人心里也亮堂起来。布朗农夫家的男孩常常停下来，学它吹上一声。每一次，它都会回他一声，从没让男孩失望过。
        - id: ch01-b03
          speaker: narrator
          text: |-
            这个爱吹口哨的小家伙十分俊俏，一身羽毛棕白黑三色相间。它的名字叫鹌鹑鲍勃。有人管它叫鹌鹑，也有人叫它山鹑。要是你去问它，它会马上明明白白地回答，自己就是鹌鹑鲍勃，别的名字都不认。小居民们全都认识它，也都喜欢它。大多数是爱听那欢快的口哨。可也有那么几个，像狐狸雷迪和红尾鹰，喜欢它的理由可不一样。只要它们本事够大，能抓住鲍勃，就能得到一顿美餐。
        - id: ch01-b04
          speaker: narrator
          text: |-
            布朗农夫家的男孩喜欢鲍勃，可不只是因为它的口哨好听。男孩发现，鲍勃既会吹口哨，又肯认真干活。论起农场上最勤快、最得力的帮手，它也在其中。

            男孩有一项差事，就是除掉杂草，再消灭那些啃庄稼的虫子。杂草从草籽里冒出来。要是没有草籽，地里自然不会长出杂草。害虫也一样，没有虫卵，就不会孵出虫子。可是田野里的草籽和虫卵，多得数不过来。整个夏天，男孩都得跟它们作战。无论谁来搭把手，他都十分感激。

            老蟾蜍先生会替他吃掉菜园里的毛虫和小虫，所以男孩很喜欢它。山雀汤米和别的羽毛小居民住在老果园里，会到苹果树间寻找小虫和虫卵，男孩也一样喜欢它们。想跟别人交朋友，最靠得住的办法，就是在别人需要时帮上一把。
        - id: ch01-b05
          speaker: narrator
          text: |-
            鹌鹑鲍勃也帮了不少忙。它会捉毛虫，捉小虫，还爱吃杂草籽。那些草籽躲进泥土里，它就用爪子刨出来，一粒接一粒地吞下去，直到小小的嗉囊装得满满的。等它再也吃不下了，便飞到离得最近的篱笆上，把自己的快乐吹给全世界听。活在世上是多么快活，能替这个大世界做一点事，又是多么值得高兴啊！

            在所有小居民当中，鲍勃给男孩的帮助数得上最大。它一天到晚不停地忙。鲍勃太太和一群小鲍勃也陪着它一起干活，一会儿在这里刨出草籽，一会儿又到那里啄走小虫。它们干起活来总是那么欢喜，那么有精神，连附近的每一个人也被它们感染，变得快活起来。

            更难得的是，鲍勃一直都是这副快活模样。看着它，你也许会以为，天下根本没有什么事能叫它发愁。其实，它当然也有烦恼，而且烦恼还不少呢！往后你就会听到，鲍勃到底要操心些什么。只是能不受影响的时候，它绝不肯让烦恼赶走自己的好心情。
        - id: ch01-b06
          speaker: narrator
          text: |-
            “鲍勃——怀特！鲍勃——怀特！”它用尽力气放声吹，口哨嘹亮又清脆。一生清白，从没做过亏心事，它真想叫所有人全都听一回。
        - id: ch01-b07
          speaker: narrator
          text: |-
            有一天，兔子彼得坐下来听那阵口哨。听着听着，他忽然记起，自己已经好一阵子没去看望鲍勃了。关于鲍勃，还有些事情他一直不知道，也很想弄个明白。彼得当即拿定主意，现在就去拜访鲍勃，顺便满足一下自己的好奇心。于是他上路了，一蹦一跳，一蹦一跳。
