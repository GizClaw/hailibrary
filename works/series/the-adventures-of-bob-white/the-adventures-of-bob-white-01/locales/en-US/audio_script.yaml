audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and friendly
        pace: measured
        pitch: medium
    bob_white:
      display_name: Bob White
      tts:
        delivery: bright and cheerful
        timbre: clear and ringing
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Cheerful Worker
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "A cheerful whistle or a song can help the day's work move along."
        - id: ch01-b02
          speaker: narrator
          text: "The little feathered folk of the Green Meadows, the Green Forest, and the Old Orchard learned that lesson long ago. That is why, when spring comes and they are busy building their homes, you will often hear them singing with all their might. Most of the birds sing. One of them whistles instead. His whistle is so clear and cheerful that it lifts the heart of everyone who hears it. Many times, Farmer Brown's boy has stopped to whistle back. Every time, an answer has come."
        - id: ch01-b03
          speaker: bob_white
          text: "Bob White! Bob White!"
        - id: ch01-b04
          speaker: narrator
          text: "The whistler is a handsome little fellow dressed in brown, white, and black. His name is Bob White. Some people call him a Quail, and some call him a Partridge. But ask him his name, and he will tell you right away that he is Bob White and nothing else. The other little people know him well. Most love him for his happy whistle. A few do not. Reddy Fox and Redtail the Hawk think of the fine meal he would make if they could only catch him."
        - id: ch01-b05
          speaker: narrator
          text: "Farmer Brown's boy loves Bob's whistle too, but that is not the only reason he cares for him. He has discovered that Bob White is as good a worker as he is a whistler. In fact, Bob is one of the greatest helpers on the farm."
        - id: ch01-b06
          speaker: narrator
          text: "Part of the boy's work is keeping down the weeds and destroying the insects that eat the crops. Weeds grow from seeds. With no weed seeds, there would be no weeds. In the same way, insects hatch from eggs. With no insect eggs, there would be no insects. But the farm has millions and millions of both. So all summer, Farmer Brown's boy must fight weeds and insects, and he is grateful for every bit of help."
        - id: ch01-b07
          speaker: narrator
          text: "That is one reason he has grown so fond of Old Mr. Toad, who clears worms and bugs from the garden. He is fond of Tommy Tit the Chickadee too, along with the other little feathered folk who search the Old Orchard's apple trees for bugs and their eggs. If you want to make friends, helping others is a very good way to begin."
        - id: ch01-b08
          speaker: narrator
          text: "Bob White catches worms and bugs, but he also eats weed seeds. He scratches them out from their hiding places in the ground and fills his little crop. When it is full, he simply has to fly to the nearest fence and let the whole world know how glad he is to be alive and doing his share of the Great World's work."
        - id: ch01-b09
          speaker: bob_white
          text: "Bob White! Bob White!"
        - id: ch01-b10
          speaker: narrator
          text: "No little neighbor gives Farmer Brown's boy more help than Bob. He works through the long day. Mrs. Bob and all the little Bobs work beside him, scratching up weed seeds in one place and picking off bugs in another. They are so happy and cheerful as they work that soon everyone nearby feels happy and cheerful too."
        - id: ch01-b11
          speaker: narrator
          text: "And Bob White is always like that. You might think he had nothing in the world to worry about. But he does. Yes, indeed, Bob has plenty of troubles, as you will hear. Still, whenever he can help it, he never lets those troubles take away his cheerfulness."
        - id: ch01-b12
          speaker: narrator
          text: "With all his might, he whistles his own name, loud and clear. He has never done anything to be ashamed of, and he wants everyone to hear."
        - id: ch01-b13
          speaker: bob_white
          text: "Bob White! Bob White!"
        - id: ch01-b14
          speaker: narrator
          text: "One day, Peter Rabbit sat listening. The whistle reminded him that he had not visited Bob White for quite a while. It also made him think of several things about Bob that he did not know. Peter decided to call on him right away and find the answers. Off he went, lipperty-lipperty-lip."
