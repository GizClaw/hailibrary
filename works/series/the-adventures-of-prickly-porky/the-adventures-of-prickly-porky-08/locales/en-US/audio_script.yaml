audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    redeye_vireo:
      display_name: Redeye the Vireo
      tts:
        delivery: cheerful and eagerly helpful
        timbre: light and bright
        pace: quick
        pitch: high
    prickly_porky:
      display_name: Prickly Porky
      tts:
        delivery: good-natured and quietly amused
        timbre: warm and slightly rough
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: Southern, practical, and playfully stern
        timbre: mellow and weathered
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Strange Noise on the Hill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jimmy Skunk had hardly gone beyond sight and hearing when Redeye the Vireo heard a very strange noise. Redeye lived in a tree at the foot of Prickly Porky's hill. Just then, he was busy singing to anyone who would listen about how happy he was and what a beautiful world this was.
        - id: ch01-b02
          speaker: narrator
          text: Redeye seemed to believe that singing was his special work in life. It was as if he had been placed in the Green Forest for that one purpose. He sang his little song of gladness all day long, even in the hottest weather, when the other birds had forgotten to sing. It never occurred to him that his own happiness, and his way of telling everyone about it, made other people happy too.
        - id: ch01-b03
          speaker: narrator
          text: At first, Redeye scarcely noticed the odd sound. Then he paused to rest, and he heard it plainly. It sounded so queer that he flew up the hill to find where it came from. His bright eyes soon found Prickly Porky, and at once Redeye knew he was in trouble.
        - id: ch01-b04
          speaker: narrator
          text: Prickly Porky lay on the ground beneath a tree. He rolled over, kicked, and clawed at his mouth. A little piece of bark hung from it, and Porky was making that strange noise. Redeye stared at the sight for one moment. Then he understood. Prickly Porky was choking. Unless someone helped him, he might choke to death.
    - id: ch02
      title: Unc' Billy Comes to Help
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: There was nothing Redeye could do for Porky by himself. He was far too small. He had to find someone else, and he had to be quick. He looked anxiously this way and that, but no one was in sight. Then he remembered that Unc' Billy Possum's hollow tree was not far away. Perhaps Unc' Billy could help. Redeye only hoped he was home. There was no time to waste, so he hurried off to find out.
        - id: ch02-b02
          speaker: narrator
          text: Unc' Billy was home. The moment he heard that his old friend Prickly Porky was in trouble, he rushed up the hill as fast as he could. One look told him exactly what was wrong.
        - id: ch02-b03
          speaker: unc_billy_possum
          text: Keep still for just one minute, Brer Porky!
        - id: ch02-b04
          speaker: narrator
          text: Unc' Billy did not dare come close while Porky was rolling and kicking. He might brush against one of the thousand little spears hidden in Porky's coat. Porky obeyed. After struggling so long, he was weak enough to be glad to lie still.
        - id: ch02-b05
          speaker: narrator
          text: Unc' Billy grabbed the little piece of bark that hung from Porky's mouth. He braced himself and pulled with all his strength. For a moment, the bark held fast and would not move. Then it came free so suddenly that Unc' Billy went tumbling over and landed flat on his back.
        - id: ch02-b06
          speaker: narrator
          text: He scrambled up and gave Porky a disapproving look. Prickly Porky lay there panting, with big tears rolling down his face.
        - id: ch02-b07
          speaker: unc_billy_possum
          text: Ah surely am surprised at you, Brer Porky. You were so greedy, you nearly choked yourself.
    - id: ch03
      title: The Joke That Started It All
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Prickly Porky gave him a weak, rather foolish grin.
        - id: ch03-b02
          speaker: prickly_porky
          text: I wasn't being greedy, Unc' Billy. Truly, I wasn't.
        - id: ch03-b03
          speaker: unc_billy_possum
          text: Then may Ah ask what happened?
          emotion: angry
        - id: ch03-b04
          speaker: prickly_porky
          text: I remembered something funny while I was eating. I laughed just as I swallowed, and that piece of bark went down the wrong way.
        - id: ch03-b05
          speaker: narrator
          text: As soon as he explained it, Porky thought again about the very thing that had made him laugh before. The thought was simply too much for him. He began laughing all over again. He laughed and laughed and laughed, until Unc' Billy finally ran out of patience.
        - id: ch03-b06
          speaker: unc_billy_possum
          text: Brer Porky, you surely have forgotten your manners!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: Prickly Porky wiped the tears from his eyes.
        - id: ch03-b08
          speaker: prickly_porky
          text: Come a little closer, Unc' Billy. I'll whisper it to you.
        - id: ch03-b09
          speaker: narrator
          text: Unc' Billy was a little suspicious. Even so, he stepped close enough for Porky to whisper the funny thing in his ear. When Porky had finished, Unc' Billy was wiping tears of laughter from his own eyes.
