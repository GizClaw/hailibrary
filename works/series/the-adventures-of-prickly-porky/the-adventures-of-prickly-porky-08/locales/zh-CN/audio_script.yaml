audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    redeye_vireo:
      display_name: 红眼绿鹃
      tts:
        delivery: 明快热情，话音里总带着由衷的欢喜
        timbre: 清亮轻盈
        pace: 稍快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 直率老练，乡音亲切，训人时严肃却不失幽默
        timbre: 粗哑温厚
        pace: 中速
        pitch: 中低音
    prickly_porky:
      display_name: 豪猪刺毛
      tts:
        delivery: 随和直率，带着贪吃而自得的幽默
        timbre: 粗厚温暖
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 山上传来的怪声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米拜访过刺毛，刚刚走到看不见、听不着的地方，住在山脚树上的红眼绿鹃就听到一阵怪声。那时，红眼正忙着告诉每一个肯听的人，自己有多么快乐，这个世界又有多么美好。他觉得，这就是自己一生中特有的使命，来到绿森林，仿佛就是为了整天唱那支欢欣的小曲。就算天气热得别的鸟儿都忘了唱歌，他也不会停。红眼从没想到，只要自己快快乐乐地唱出来，别人听了，也会跟着高兴。
        - id: ch01-b02
          speaker: narrator
          text: 起初，红眼没怎么留意。等他唱累了，停下来歇口气，那阵声音一下听清了，实在古怪得很。他赶紧朝声音传来的地方飞上山去，一双亮眼睛很快便发现了豪猪刺毛。他马上看出刺毛碰上了麻烦，也明白怪声正是刺毛发出来的。刺毛倒在一棵树下，在地上翻滚，双脚乱蹬，两只爪子直往嘴边抓，嘴里还垂着一小片树皮。
        - id: ch01-b03
          speaker: narrator
          text: 红眼从来没见过这副模样，一时看呆了。转眼间，他忽然明白过来。原来刺毛噎住了！要是再没人来帮忙，他说不定会活活噎死。
    - id: ch02
      title: 比利大叔来帮忙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 红眼个头太小，自己根本帮不上忙。他必须赶快去别处找人，一刻也不能耽搁。他焦急地东张西望，可一个人影也没有。忽然，他想起负鼠比利大叔的树洞就在附近。也许比利大叔有办法！红眼立刻飞去找他，只盼他正好在家。
        - id: ch02-b02
          speaker: narrator
          text: 比利大叔果然在家。听说老朋友刺毛出了事，他半点时间也没浪费，用自己最快的速度赶上山来。他只看了一眼，便知道刺毛究竟出了什么问题。
        - id: ch02-b03
          speaker: unc_billy_possum
          text: 刺毛兄弟，先别乱动，安静一会儿！
        - id: ch02-b04
          speaker: narrator
          text: 这是比利大叔的命令。刺毛正又滚又踢，他可不敢离得太近，生怕碰到刺毛外衣底下藏着的上千根小长矛。刺毛听话地停了下来。其实，他挣扎了这么久，早已累得浑身无力，能停下来正合心意。
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔走上前，抓紧刺毛嘴里垂着的那片树皮。他站稳脚跟，使出全身力气往外拔。足足有一会儿，树皮仍旧纹丝不动。接着，它突然松脱，害得比利大叔仰面摔了个四脚朝天。
        - id: ch02-b06
          speaker: narrator
          text: 比利大叔急忙爬起来，责怪地瞧着刺毛。刺毛躺在地上大口喘气，豆大的泪珠还在顺着脸颊往下滚。
        - id: ch02-b07
          speaker: unc_billy_possum
          text: 俺可真没想到哇，刺毛兄弟！你怎么能这么贪吃，把自己都噎成这样？
    - id: ch03
      title: 一个好笑的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 刺毛虚弱地咧了咧嘴，看起来很有些难为情。
        - id: ch03-b02
          speaker: prickly_porky
          text: 不是贪吃，比利大叔，真的不是。
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 那到底是为啥？俺倒要听听。
        - id: ch03-b04
          speaker: prickly_porky
          text: 我正吃着饭，忽然想起一件特别好笑的事。树皮才要咽下去，我就笑了，结果它一下跑岔了道。
        - id: ch03-b05
          speaker: narrator
          text: 刺毛刚解释完，似乎光是再次想到那件逗笑自己的事，就已经承受不住了。他又哈哈大笑起来，笑啊，笑啊，怎么也停不住。到最后，比利大叔终于失去了耐心。
        - id: ch03-b06
          speaker: unc_billy_possum
          text: 刺毛兄弟，你连礼貌都丢光啦！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 刺毛擦去眼里的泪水。
        - id: ch03-b08
          speaker: prickly_porky
          text: 靠近点儿，比利大叔，我悄悄告诉你。
        - id: ch03-b09
          speaker: narrator
          text: 比利大叔心里还有点儿怀疑，却还是凑近了些，一直走到刺毛能贴着他耳朵说悄悄话的地方。等刺毛把话说完，比利大叔也笑出了眼泪，正忙着擦自己的眼睛呢。
