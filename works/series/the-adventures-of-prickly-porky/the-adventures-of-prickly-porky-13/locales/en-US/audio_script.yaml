audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy:
      display_name: Reddy Fox
      tts:
        delivery: boastful on the surface but quick to worry
        timbre: sharp and youthful
        pace: brisk
        pitch: medium-high
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and knowingly teasing
        timbre: mellow and slightly raspy
        pace: relaxed
        pitch: medium-low
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and quick to react
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jimmy:
      display_name: Jimmy Skunk
      tts:
        delivery: good-natured and quietly amused
        timbre: smooth and mellow
        pace: relaxed
        pitch: medium
  chapters:
    - id: ch01
      title: Reddy Runs Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox tucked his tail between his legs and fled from the terrible creature coming down the hill where Prickly Porky lived. He thought of nothing except putting as much distance as he could between himself and that creature, and doing it as fast as possible. He gave a frightened little yelp at every jump and ran as he had hardly ever run before.
        - id: ch01-b02
          speaker: narrator
          text: Reddy forgot that Unc' Billy Possum was watching safely from a big pine tree. He never noticed Jimmy Skunk peeking from behind an old stump and laughing until he could hardly stand it. At the edge of the Green Forest, Reddy did not even see Peter Rabbit leap out of his way and dive into a hollow log.
    - id: ch02
      title: Peter Wonders
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Once Reddy was safely past, Peter came out. He sat very straight, his ears pointing toward the sky and his eyes wide with surprise. He stared after Reddy.
        - id: ch02-b02
          speaker: peter
          text: Why, my goodness! I think something has given Reddy a terrible fright!
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: Peter immediately began wondering what could have scared Reddy so badly. After thinking for a minute, he remembered the strange creature that had frightened him a few days earlier.
        - id: ch02-b04
          speaker: peter
          text: That must be it! Yes, I'm sure it was. Reddy came from Prickly Porky's hill, and that's where I got my fright. I... I...
        - id: ch02-b05
          speaker: narrator
          text: Peter stopped. He was trying to decide whether he dared go up the hill and see if that strange creature with no head, tail, or legs had returned. Going there would be foolish. He might walk straight into danger. Little Mrs. Peter was waiting for him in the dear Old Briar-patch, and she would worry. He ought to be there that very minute.
        - id: ch02-b06
          speaker: narrator
          text: Still, Peter badly wanted to know what had frightened Reddy. He kept wondering about it instead of leaving. Curiosity had already led him into many scrapes, and it grew stronger with every minute.
        - id: ch02-b07
          speaker: peter
          text: It can't hurt to go only partway. Maybe I can learn something without going all the way up.
    - id: ch03
      title: Back to the Hill
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Instead of going home as he should have, Peter turned back through the Green Forest. Every few hops, he stopped to look and listen. At last he reached the foot of Prickly Porky's hill.
        - id: ch03-b02
          speaker: narrator
          text: Peter hid under a little hemlock tree and searched in every direction for the creature that had scared him the last time he was there. But he saw no one except Prickly Porky, Jimmy Skunk, and Unc' Billy Possum. They were rolling in the leaves at the top of the hill, laughing as hard as they could.
        - id: ch03-b03
          speaker: peter
          text: There can't be any danger here. Those fellows must have played some kind of trick.
        - id: ch03-b04
          speaker: narrator
          text: So Peter boldly hopped up the hill to join them.
        - id: ch03-b05
          speaker: peter
          text: What's so funny?
        - id: ch03-b06
          speaker: jimmy
          text: Did you run into Reddy Fox?
        - id: ch03-b07
          speaker: narrator
          text: Jimmy wiped the tears of laughter from his eyes.
        - id: ch03-b08
          speaker: peter
          text: Did I ever! He nearly crashed into me, and he never even saw me. He's probably still running. Now tell me, what's so funny?
    - id: ch04
      title: Another Trick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the others finally stopped laughing long enough, they crowded around Peter and told him what had happened. Soon Peter was laughing so hard that his sides hurt.
        - id: ch04-b02
          speaker: peter
          text: That was a fine trick on Reddy, and it was just as fine a trick on me! So, who can we frighten next?
        - id: ch04-b03
          speaker: narrator
          text: And that tells you something. Up on the hill where Prickly Porky the Porcupine lived, a bit of mischief was being planned.
