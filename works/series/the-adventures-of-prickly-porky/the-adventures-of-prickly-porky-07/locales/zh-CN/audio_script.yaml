audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 坦率稳当，开口时自信而不慌张
        timbre: 温厚清晰
        pace: 中速
        pitch: 中低音
    prickly_porky:
      display_name: 豪猪刺毛
      tts:
        delivery: 随和直率，带着贪吃而自得的幽默
        timbre: 粗厚温暖
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 前往刺毛住的山
      blocks:
        - id: ch01-b01
          speaker: jimmy_skunk
          text: 都怪老蟾蜍先生，真是讨厌！我当然不害怕，可我一点也不了解那个东西，实在不想去招惹它。我认识的家伙都很敬重我，谁也吓不着我。可是，一个没有腿、没有脑袋、也没有尾巴的东西？谁听说过呀？光是想想，我心里就觉得怪别扭的。
        - id: ch01-b02
          speaker: narrator
          text: 吉米一边嘟囔，一边沿着绿森林里的孤零零小径，慢悠悠地朝刺毛住的那座山走去。他嘴上埋怨，脚下却一直没有停。
        - id: ch01-b03
          speaker: narrator
          text: 到了山脚，吉米警觉地看看四周，又竖起耳朵，全神贯注地细听有没有古怪的动静。可眼前什么异常也没有，绿森林还是平常的模样。四下一片安静，只有红眼绿鹃在欢快地歌唱，一遍遍唱着自己有多高兴。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 听这声音，附近可不像藏着什么可怕的陌生家伙。
    - id: ch02
      title: 树上的哼哼声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 忽然，一阵怪怪的哼哼声传了过来，好像就在山顶的某个地方。那声音稀奇极了，不像吉米平常听见的任何动静。他听了一会儿，咧开嘴笑了。
        - id: ch02-b02
          speaker: jimmy_skunk
          text: 原来是刺毛在告诉自己，这顿饭有多香呢。有些家伙呀，就是喜欢听自己的声音，真有意思。
        - id: ch02-b03
          speaker: narrator
          text: 那阵心满意足的哼哼声，让吉米放下心来。至少眼下，这一带不会有什么可怕的东西。于是他慢吞吞地上了山。你知道，吉米从来不着急。没费什么工夫，他就找到了刺毛。刺毛正趴在树上剥树皮吃，弄出的声响可真不小。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 你好啊！
        - id: ch02-b05
          speaker: narrator
          text: 刺毛一点儿反应也没有。他忙着吃东西，嘴里又响个不停，根本没听见吉米。
        - id: ch02-b06
          speaker: jimmy_skunk
          text: 你好啊！喂，我叫你呢！你耳朵聋了吗？
        - id: ch02-b07
          speaker: narrator
          text: 这可不是什么客气话。吉米本来就不想跑这一趟，心里正不痛快呢。这一次，刺毛终于低下头来。
        - id: ch02-b08
          speaker: prickly_porky
          text: 你才好呢，臭鼬吉米！这句话还给你，你自己尝尝是什么滋味吧！快爬上来，跟我一起吃点儿香喷喷的树皮。
        - id: ch02-b09
          speaker: narrator
          text: 刺毛说完，便为自己的玩笑哈哈大笑。他明明知道吉米不会爬树，就算爬得上来，也绝不会吃树皮。
        - id: ch02-b10
          speaker: narrator
          text: 吉米仰头冲他做了个鬼脸。
        - id: ch02-b11
          speaker: jimmy_skunk
          text: 谢谢，我刚吃过。你还是下来吧，省得我一直扯着嗓子跟你讲话。
    - id: ch03
      title: 刺毛的回答
      blocks:
        - id: ch03-b01
          speaker: prickly_porky
          text: 等等，让我再咬一口。
        - id: ch03-b02
          speaker: narrator
          text: 刺毛剥下一长条树皮，含在嘴里嚼着。他爬到树身一半的地方，在一根粗树枝上舒舒服服地坐稳。
        - id: ch03-b03
          speaker: prickly_porky
          text: 好了，说吧。你心里装着什么事？
        - id: ch03-b04
          speaker: narrator
          text: 吉米马上把彼得兔讲的怪故事，从头到尾说给刺毛听。
        - id: ch03-b05
          speaker: jimmy_skunk
          text: 大伙儿派我上山，就是想问问你。那个没有腿、没有脑袋、也没有尾巴的怪物，你到底见过没有？
        - id: ch03-b06
          speaker: narrator
          text: 豪猪刺毛慢慢摇了摇头。
        - id: ch03-b07
          speaker: prickly_porky
          text: 没见过。我一直待在这里，从来没有见过那样的怪物。
        - id: ch03-b08
          speaker: jimmy_skunk
          text: 我想知道的就是这个。彼得兔的眼睛准是出了毛病。我这就回老荆棘丛，把这话告诉他。多谢啦。
        - id: ch03-b09
          speaker: narrator
          text: 说完，吉米沿着来时的路往回走，嘴里还在不停地嘟囔。
