audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: gruffly confident with a dry, complaining humor
        timbre: mellow and slightly nasal
        pace: unhurried
        pitch: medium-low
    prickly_porky:
      display_name: Prickly Porky
      tts:
        delivery: good-natured and blunt with an easy chuckle
        timbre: rough and full
        pace: leisurely
        pitch: low
  chapters:
    - id: ch01
      title: Up the Lone Little Path
      blocks:
        - id: ch01-b01
          speaker: jimmy_skunk
          text: A plague on Old Mr. Toad!
        - id: ch01-b02
          speaker: narrator
          text: Jimmy Skunk grumbled as he ambled along the Lone Little Path through the Green Forest. He was on his way to the hill where Prickly Porky lived.
        - id: ch01-b03
          speaker: jimmy_skunk
          text: Of course I'm not afraid. Still, I don't like getting mixed up in things I know nothing about. I'm not afraid of anyone I know. Everybody respects me. But a creature with no legs, no head, and no tail might be different. Who ever heard of such a thing? Just thinking about it gives me a queer feeling inside.
        - id: ch01-b04
          speaker: narrator
          text: Even so, Jimmy kept going. When he reached the foot of Prickly Porky's hill, he peered in every direction. He listened as hard as he could for any strange sound. But nothing looked unusual. Not one strange thing could be seen. The Green Forest looked exactly as it always did. Everything was still and quiet, except for Redeye the Vireo cheerfully repeating, over and over, how happy he was.
        - id: ch01-b05
          speaker: jimmy_skunk
          text: It certainly doesn't sound as though a terrible stranger is anywhere near here.
    - id: ch02
      title: A Noisy Dinner
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then a very queer grunting noise came from somewhere near the top of the hill. Jimmy listened, and a grin spread across his face.
        - id: ch02-b02
          speaker: jimmy_skunk
          text: That's only Prickly Porky telling himself how tasty his dinner is. Some people certainly love the sound of their own voices.
        - id: ch02-b03
          speaker: narrator
          text: Prickly Porky sounded so content that Jimmy felt sure nothing terrible could be nearby just then. So he ambled slowly up the hill. As you know, Jimmy never hurried. Finding Prickly Porky's tree was easy. Porky was stripping off bark and eating it, and he was making a great deal of noise.
        - id: ch02-b04
          speaker: jimmy_skunk
          text: Hello!
        - id: ch02-b05
          speaker: narrator
          text: Prickly Porky did not notice. He was too busy eating, and making too much noise, to hear Jimmy at all.
        - id: ch02-b06
          speaker: jimmy_skunk
          text: Hello! Hey, up there! Can't you hear me?
        - id: ch02-b07
          speaker: narrator
          text: That was not polite, of course. Jimmy was in a bad mood because he had been made to pay this visit. This time, Prickly Porky looked down.
        - id: ch02-b08
          speaker: prickly_porky
          text: Hello to you too, Jimmy Skunk! Come on up and share this fine bark with me.
        - id: ch02-b09
          speaker: narrator
          text: Prickly Porky laughed at his own joke. He knew Jimmy could not climb. He also knew Jimmy would never eat bark, even if he could climb.
        - id: ch02-b10
          speaker: narrator
          text: Jimmy made a face at him.
        - id: ch02-b11
          speaker: jimmy_skunk
          text: No, thank you. I've already eaten. Come down here so I can talk without shouting myself hoarse.
        - id: ch02-b12
          speaker: prickly_porky
          text: Let me get one more bite first.
        - id: ch02-b13
          speaker: narrator
          text: Prickly Porky pulled off one long strip of bark. With that to chew, he climbed halfway down the tree and settled comfortably on a big branch.
        - id: ch02-b14
          speaker: prickly_porky
          text: All right, what's bothering you?
    - id: ch03
      title: Jimmy Gets His Answer
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Right away, Jimmy told him the strange story he had heard from Peter Rabbit.
        - id: ch03-b02
          speaker: jimmy_skunk
          text: They sent me up here to find out whether you've seen a creature with no legs, no head, and no tail. Have you seen it?
        - id: ch03-b03
          speaker: narrator
          text: Prickly Porky slowly shook his head.
        - id: ch03-b04
          speaker: prickly_porky
          text: No. I've been here the whole time, and I haven't seen any creature like that.
        - id: ch03-b05
          speaker: jimmy_skunk
          text: That's all I needed to hear. There must be something wrong with Peter Rabbit's eyes. I'm going straight back to the Old Briar-patch to tell him. Much obliged.
        - id: ch03-b06
          speaker: narrator
          text: With that, Jimmy started back the way he had come, still grumbling to himself.
