audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: shrewd, friendly, and gently teasing
        timbre: warm and mellow
        pace: unhurried
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: boastful and sly, with nervousness showing through
        timbre: bright and wiry
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: WHAT REDDY FOX SAW AND DID
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Guard your tongue as carefully as you would guard a rare treasure. Then you may stay clear of trouble, fear, and worry.
        - id: ch01-b02
          speaker: narrator
          text: The trouble is, many people remember that lesson too late. Reddy Fox is one of them. He can be smart, sly, and clever, but he still has not learned to watch what he says. His tongue is both boastful and untruthful, and that is a sure way to land in trouble. It had gotten him into plenty of scrapes before. Now it had done so again.
        - id: ch01-b03
          speaker: narrator
          text: Jolly, round, red Mr. Sun had kicked off his rosy blankets. He smiled down on the Great World as he began his daily climb through the blue, blue sky. The Jolly Little Sunbeams were already dancing through the Green Forest and chasing away the Black Shadows.
        - id: ch01-b04
          speaker: narrator
          text: Reddy knew he should already be at the hill where Prickly Porky the Porcupine lived. Still, he dragged his feet. He slipped from tree to tree and peered anxiously from behind each one. Reddy was afraid to go on, but he was even more afraid that someone would call him a coward if he did not.
        - id: ch01-b05
          speaker: narrator
          text: He was nearly at the bottom of the hill. Nothing unusual had appeared, and there was no sign of Unc' Billy Possum. Reddy began to hope Billy had not come after all. But Billy had promised to be there. Just then, a voice spoke from directly above Reddy's head.
        - id: ch01-b06
          speaker: unc_billy_possum
          text: Ah surely am glad yo' kept your word, Brer Fox. We need somebody as brave as yo' to find out what that strange creature is that's been chasing us.
        - id: ch01-b07
          speaker: narrator
          text: Reddy looked up and managed a weak grin. Unc' Billy was sitting in a pine tree right over him. There was no backing out now. Reddy had to keep going. He swaggered a little and tried his best to look bold.
        - id: ch01-b08
          speaker: reddy_fox
          text: I already told you, I'm not scared. If something strange is hiding around here, I'll find out what it is.
        - id: ch01-b09
          speaker: narrator
          text: Reddy was boasting again, though Unc' Billy heard a small tremble in his voice.
        - id: ch01-b10
          speaker: unc_billy_possum
          text: Just keep going to the bottom of the hill. That's where Ah saw it yesterday. My, how lucky we are to have somebody so very brave!
        - id: ch01-b11
          speaker: narrator
          text: Reddy gave him a sharp look. There was not even the smallest smile on Billy's face. Reddy could not decide whether Billy was teasing him. With nothing else he could do, he went on.
        - id: ch01-b12
          speaker: narrator
          text: He reached the foot of the hill without seeing or hearing anything strange. The Green Forest seemed as ordinary as ever. Redeye the Vireo poured out his cheerful little song as if everything were exactly right.
        - id: ch01-b13
          speaker: narrator
          text: Reddy began to feel brave again. Nothing had happened, and nothing would. Of course it would not! This whole business was just more foolishness from Peter Rabbit. Someday Reddy would catch Peter and put a stop to his silly tales.
        - id: ch01-b14
          speaker: reddy_fox
          text: Ah! What was that?
        - id: ch01-b15
          speaker: narrator
          text: Reddy's sharp ears had picked up a sound near the top of the hill. He stopped at once and looked up. For a moment, he could hardly believe his own eyes.
        - id: ch01-b16
          speaker: narrator
          text: The strangest thing he had ever seen was coming straight down the hill toward him. He could see no legs, no head, and no tail. It was round like a ball, but no ordinary ball had ever looked like this one. Old leaves covered it from top to bottom.
        - id: ch01-b17
          speaker: narrator
          text: Reddy might not have believed it was alive if it had not been making noises. He stared for one tiny moment. Then what do you suppose he did?
        - id: ch01-b18
          speaker: narrator
          text: Reddy let out a frightened yelp, tucked his tail between his legs, and ran as fast as his legs could carry him. Yes, Sir, that is exactly what Reddy Fox did.
