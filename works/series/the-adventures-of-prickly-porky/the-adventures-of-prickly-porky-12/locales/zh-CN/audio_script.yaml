audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 爱吹牛又好逞强，话里总带着自以为是的神气
        timbre: 明亮尖细
        pace: 稍快
        pitch: 中高音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 直率老练，乡音亲切，训人时严肃却不失幽默
        timbre: 粗哑温厚
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 管不住的舌头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 舌头若能守得牢，像护珍宝不肯抛，烦忧惊惧都躲过，麻烦从此不来找。
        - id: ch01-b02
          speaker: narrator
          text: 可许多人总要等到太迟，才想起这个道理。雷迪狐狸就是这样。有些事情上，他又机灵又狡猾，鬼点子也多，可他始终没学会管住舌头。他惹来的麻烦，倒有一半都是这条不听话的舌头招来的。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪的舌头既爱吹牛，又爱撒谎。要说最会惹祸的搭配，恐怕再没有比这更糟的了。过去，这条舌头已经害他陷进过各种困境。如今，他又惹上了一场麻烦，错还是全在这条舌头。
        - id: ch01-b04
          speaker: narrator
          text: 这天早晨，快活、滚圆、通红的太阳公公踢开玫瑰色的被子，笑眯眯地望着大千世界，每天一次地朝碧蓝碧蓝的天空上爬。快活的小阳光已经在绿森林里跳起舞，把黑影一个个赶走。
        - id: ch01-b05
          speaker: narrator
          text: 雷迪知道，自己早该赶到豪猪刺毛住的那座山边了。他拖着脚步，从一棵树偷偷摸到另一棵树后，每到一处，都焦急地探头张望。他怕得不敢往前走，却更怕就此不去。因为那样一来，大家准会叫他胆小鬼。
    - id: ch02
      title: 树上的比利大叔
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪眼看就要走到山脚了。一路上，他没见到什么异样，也没发现负鼠比利大叔的踪影。他正暗暗盼着比利大叔没有照约定守在那里，头顶上却忽然传来了一个声音。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: 狐狸老弟，你果然说话算话，俺见了可真高兴。俺们正需要你这样的勇敢好汉，去瞧瞧那个追俺们的怪东西究竟是什么呢。
        - id: ch02-b03
          speaker: narrator
          text: 雷迪抬头一看，只好勉强挤出一点儿笑容。比利大叔就坐在他头顶正上方的一棵松树里。这下雷迪明白了，他已经不能回头，非往前走不可。于是，他故意昂首挺胸，装出一副大胆又勇敢的样子。
        - id: ch02-b04
          speaker: reddy_fox
          text: 我不是早说了吗？我才不怕呢！这附近要是真有怪东西，我一定把它查个明白。
        - id: ch02-b05
          speaker: narrator
          text: 雷迪又吹起牛来。可比利大叔听得清清楚楚，他的声音正微微发颤。
        - id: ch02-b06
          speaker: unc_billy_possum
          text: 那你就一直往前，走到山脚下。俺昨天就是在那里瞧见它的。嘿，有你这样真正勇敢的好汉帮忙，俺可太高兴啦！
        - id: ch02-b07
          speaker: narrator
          text: 雷迪锐利地瞧了比利大叔一眼，可对方脸上半点儿笑意也没有。雷迪怎么也看不出，比利大叔到底是不是在取笑自己。既然没有别的路可走，他只好继续向前。
        - id: ch02-b08
          speaker: narrator
          text: 雷迪一直走到山脚，既没看见异样，也没听见怪声。绿森林还是老样子。红眼莺雀唱着欢快的小曲儿，好像一切都好端端的，本来就该这样。雷迪的胆子渐渐又大了起来。
        - id: ch02-b09
          speaker: narrator
          text: 什么都没发生，接下来也一定什么都不会发生。当然不会！这不过是彼得兔在胡闹。雷迪心想，总有一天，他要抓住彼得兔，让这些荒唐故事再也传不下去。
    - id: ch03
      title: 山上滚来的怪东西
      blocks:
        - id: ch03-b01
          speaker: reddy_fox
          text: 啊！那是什么声音？
          emotion: surprised
        - id: ch03-b02
          speaker: narrator
          text: 雷迪灵敏的耳朵听见山顶附近传来响动。他猛地停下，抬头望去。有那么一小会儿，他简直不敢相信自己的眼睛。一个他从没见过的怪东西，正从山上下来，直冲着他而来。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪看不见它的腿，看不见它的脑袋，也看不见它的尾巴。那东西圆得像个球，却是世上模样最古怪的球，浑身盖满了枯叶。要不是它一路弄出声响，雷迪绝不会相信它是活的。
        - id: ch03-b04
          speaker: narrator
          text: 他呆呆地看了一小会儿。接着，你猜他做了什么？嗨，他吓得尖叫一声，把尾巴夹在两腿中间，转身就逃。四条腿能跑多快，他就跑多快。没错，雷迪狐狸做的正是这件事。
