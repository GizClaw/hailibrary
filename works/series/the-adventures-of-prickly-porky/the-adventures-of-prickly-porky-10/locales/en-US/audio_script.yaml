audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: shrewd, friendly, and gently teasing
        timbre: warm and mellow
        pace: unhurried
        pitch: medium-low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: plainspoken and firm, with an honest warmth
        timbre: smooth and grounded
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: UNC' BILLY POSSUM TELLS JIMMY SKUNK A SECRET
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Be sure you have done nothing to hurt a friend before you decide to drop him.
        - id: ch01-b02
          speaker: narrator
          text: A friend is always worth keeping. Unc' Billy Possum says so, and he ought to know. He has made plenty of friends in the Green Forest and on the Green Meadows, even though he has played many tricks and pranks. Once Unc' Billy makes a friend, he holds on to that friendship. He says keeping an old friend is easier and much better than finding a new one.
        - id: ch01-b03
          speaker: narrator
          text: Here is how he manages it. If a friend gets angry with him, Unc' Billy will not get angry in return. He goes to that friend and asks what is wrong. Then he clears up the trouble and does something kind.
        - id: ch01-b04
          speaker: narrator
          text: Jimmy Skunk and Unc' Billy had been friends ever since Unc' Billy came up from ol' Virginny to make his home in the Green Forest. They had even been partners in stealing eggs from the henhouse that belonged to Farmer Brown's boy.
        - id: ch01-b05
          speaker: narrator
          text: But now Jimmy was upset with his old friend. Jimmy had paid a special visit to Prickly Porky. He wanted to learn whether Porky had seen the strange creature with no head, tail, or legs. Afterward, Jimmy told everyone that Porky had seen no such thing.
        - id: ch01-b06
          speaker: narrator
          text: Then Jimmy heard that Unc' Billy was telling a different story. According to Billy, Porky had said that Peter might truly have some reason for his queer tale. To Jimmy, that meant either Porky or Billy had not told the truth. And Jimmy was very angry about it.
        - id: ch01-b07
          speaker: narrator
          text: That afternoon, Unc' Billy met Jimmy coming down the Crooked Little Path. Earlier that day, Billy had dared Reddy Fox to visit Porky's hill at sunup the next morning. Jimmy scowled when he saw Billy. He meant to walk right past without saying a word.
        - id: ch01-b08
          speaker: narrator
          text: Unc' Billy's sharp little eyes twinkled. Then he gave the special wide grin that only Unc' Billy can give.
        - id: ch01-b09
          speaker: unc_billy_possum
          text: Howdy, Brer Skunk.
        - id: ch01-b10
          speaker: narrator
          text: Jimmy only frowned more deeply and kept trying to pass.
        - id: ch01-b11
          speaker: unc_billy_possum
          text: Howdy again, Brer Skunk. Something sure is troubling yo'.
        - id: ch01-b12
          speaker: narrator
          text: Jimmy stopped short.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: It certainly is! I want to know whether you or Prickly Porky has been telling something that isn't true. Porky told me he hadn't seen anything like the creature Peter Rabbit says chased him. But you have been going around saying that Porky told you Peter might have a real reason for that silly story. Porky hasn't left home all summer. If Peter saw that creature near his hill, Porky would know about it. So why did he tell me he hadn't seen it?
          emotion: angry
        - id: ch01-b14
          speaker: unc_billy_possum
          text: Don' hurry to conclusions, Brer Skunk. Ah never said Brer Porky told me he had seen the creature that chased Peter. When he told yo' he hadn't seen a stranger anywhere around his hill, he was telling the truth. What he told me was this.
          emotion: calm
        - id: ch01-b15
          speaker: narrator
          text: Unc' Billy leaned close and whispered the rest of the secret. As Jimmy listened, his angry look disappeared.
        - id: ch01-b16
          speaker: jimmy_skunk
          text: Oh! That makes it different.
        - id: ch01-b17
          speaker: unc_billy_possum
          text: Of course it does. Peter really did see something strange, even though Brer Porky didn't see any stranger. Ah have seen that strange thing mahself. Now Ah'm inviting yo' to come to the foot of Brer Porky's hill at sunup tomorrow. Yo' can watch what happens when Brer Fox tries to prove how brave he is. Just remember, this is a secret.
        - id: ch01-b18
          speaker: narrator
          text: By now, Jimmy was chuckling.
        - id: ch01-b19
          speaker: jimmy_skunk
          text: I won't forget. I'll be there. I'm glad neither one of you was telling an untruth. And Unc' Billy, I'm sorry I thought it might have been you.
        - id: ch01-b20
          speaker: unc_billy_possum
          text: Don' give it another thought, Brer Skunk. Ah'll watch for yo' tomorrow morning.
        - id: ch01-b21
          speaker: narrator
          text: Unc' Billy gave Jimmy a sly wink, and Jimmy burst out laughing.
