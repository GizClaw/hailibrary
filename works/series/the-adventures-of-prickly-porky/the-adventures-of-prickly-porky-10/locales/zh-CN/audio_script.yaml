audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 直率老练，乡音亲切，训人时严肃却不失幽默
        timbre: 粗哑温厚
        pace: 中速
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 坦率稳当，开口时自信而不慌张
        timbre: 温厚清晰
        pace: 中速
        pitch: 中低音
  chapters:
    - id: ch01
      title: 留住一个朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 若要与朋友一刀两断，先想想自己可曾把他冒犯。
        - id: ch01-b02
          speaker: narrator
          text: 朋友总是值得留住的。这是负鼠比利大叔的看法，他也的确很懂交朋友。别看他爱恶作剧，还耍过不少花招，他在绿森林和绿草地的朋友可多着呢。只要交上一个朋友，他就不会轻易失去这份友情。
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔常说，留住老朋友，比再交一个新朋友容易，也更好。要是朋友生了他的气，他自己绝不跟着发火。他会去找那位朋友，问明白问题出在哪儿，把误会说开，再做点叫朋友高兴的事。
        - id: ch01-b04
          speaker: narrator
          text: 自从比利大叔离开老弗吉尼亚，来到绿森林生活，他和臭鼬吉米就是朋友。他俩甚至搭过伙儿，一起去农夫布朗家那个男孩的鸡舍偷鸡蛋。
        - id: ch01-b05
          speaker: narrator
          text: 前些时候，吉米特意找豪猪刺毛打听那个怪物。那东西没有脑袋，没有尾巴，也没有腿。刺毛说自己从没见过，吉米便照实告诉了大家。可是后来，他听说比利大叔四处在讲，刺毛认为彼得那个离奇故事可能真有根据。
        - id: ch01-b06
          speaker: narrator
          text: 吉米觉得受了冒犯，心里也非常恼火。这两种说法撞在一起，不是刺毛撒了谎，就是比利大叔撒了谎。
    - id: ch02
      title: 弯弯曲曲的小路上
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就在比利大叔激雷迪狐狸第二天破晓上山的那个下午，他在弯弯曲曲的小路上碰见了吉米。吉米沉着脸走来，连话也不想说，径直就要过去。比利大叔精明的小眼睛一闪，咧嘴露出了他独有的笑容。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: 你好呀，臭鼬兄弟。
        - id: ch02-b03
          speaker: narrator
          text: 吉米把眉头皱得更紧，仍旧想从他身边走过去。
        - id: ch02-b04
          speaker: unc_billy_possum
          text: 臭鼬兄弟，俺跟你打招呼呢。瞧你这样子，心里准压着什么事吧。
        - id: ch02-b05
          speaker: narrator
          text: 吉米停住了脚步。他憋着一肚子火，话一出口就又快又冲。
        - id: ch02-b06
          speaker: jimmy_skunk
          text: 当然有事！我想知道，说假话的到底是你，还是豪猪刺毛。他告诉我，彼得兔说的那个追他的怪东西，他根本没见过。可你又到处说，刺毛认为彼得那个荒唐故事也许有根据。刺毛整个夏天都没离开过家。彼得要真见到了那东西，他怎么会不知道？要是他也见过，又为什么对我说没见过？
          emotion: angry
    - id: ch03
      title: 一个秘密
      blocks:
        - id: ch03-b01
          speaker: unc_billy_possum
          text: 别急，臭鼬兄弟，别急。俺从没说过，刺毛兄弟亲眼看见了追彼得的东西。他告诉你，自己没见过陌生家伙在山边出没，这句话是真的。他告诉俺的其实是……
          emotion: calm
        - id: ch03-b02
          speaker: narrator
          text: 说到这里，比利大叔凑过去，悄悄在吉米耳边说了几句话。吉米听完，脸色一下子开朗了。
        - id: ch03-b03
          speaker: jimmy_skunk
          text: 原来是这么回事，那可完全不一样了。
        - id: ch03-b04
          speaker: unc_billy_possum
          text: 可不是嘛。刺毛兄弟没瞧见，不等于彼得没瞧见。彼得确实看到了一个怪东西，俺自己也见过。明天破晓，你到刺毛兄弟住的山脚下来吧。狐狸兄弟想显摆自己有多勇敢，你正好亲眼看看会发生什么。只是千万记住，这事是个秘密。
        - id: ch03-b05
          speaker: narrator
          text: 吉米听到这里，已经忍不住咯咯笑了。
        - id: ch03-b06
          speaker: jimmy_skunk
          text: 我不会忘，明早一定来。知道你们谁都没有说假话，我真高兴。比利大叔，刚才我还怀疑你可能撒了谎，请你原谅我。
          emotion: happy
        - id: ch03-b07
          speaker: unc_billy_possum
          text: 别放在心上，臭鼬兄弟，别放在心上。俺明早等着你。
        - id: ch03-b08
          speaker: narrator
          text: 比利大叔狡黠地眨了眨眼，逗得吉米放声大笑起来。
