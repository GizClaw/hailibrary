audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy:
      display_name: Reddy Fox
      tts:
        delivery: boastful on the surface but quick to worry
        timbre: sharp and youthful
        pace: brisk
        pitch: medium-high
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: sharp, practical, and firmly instructive
        timbre: dry and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Foolish Boast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox wished with all his might that he had kept quiet. He had bragged that he was not afraid to meet the strange creature that had frightened Peter Rabbit. He had even said that if he met it, he would stop and learn all about it. But Reddy had never meant to do any such thing. He had only been talking big.
        - id: ch01-b02
          speaker: narrator
          text: Reddy was one of the greatest boasters in the Green Forest or on the Green Meadows. He loved to strut around and make himself sound brave. But underneath all that boasting, he was a coward.
        - id: ch01-b03
          speaker: narrator
          text: Unc' Billy Possum knew it. That was why he dared Reddy to go at daybreak to the foot of Prickly Porky's hill. Peter Rabbit had met the strange creature there. Unc' Billy claimed he had seen it there too, with no head, no tail, and no legs.
        - id: ch01-b04
          speaker: narrator
          text: Unc' Billy promised to watch from a tree and see whether Reddy came. So if the creature appeared, Reddy would have to prove his foolish boast. There was no way to escape the challenge now. Several little people had heard him brag, and they had heard the dare. If Reddy stayed away, everyone would call him a coward and never let him forget it.
    - id: ch02
      title: Looking for an Excuse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Reddy slept badly that afternoon. At dusk, he went out to hunt for his supper, but his appetite was gone. Instead of hunting, he spent most of the night trying to think of a good reason not to appear at Prickly Porky's hill when morning came.
        - id: ch02-b02
          speaker: narrator
          text: He thought and thought. Not one excuse sounded believable. Then he remembered Bowser the Hound.
        - id: ch02-b03
          speaker: reddy
          text: If Bowser weren't chained at night, I could make him chase me. Then I'd have the best excuse of all.
        - id: ch02-b04
          speaker: narrator
          text: But Reddy knew Bowser was chained. Still, he crept up to Farmer Brown's dooryard to make certain. Sure enough, Bowser was on his chain.
    - id: ch03
      title: The Long Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Reddy slipped away without so much as a glance at Farmer Brown's henhouse. Someone had carelessly left the door open, but Reddy never noticed. Even if he had, it would not have mattered. He had no appetite at all. No, sir. Reddy would not have eaten the fattest chicken in the henhouse, even if it had been standing right in front of him.
        - id: ch03-b02
          speaker: narrator
          text: He could think only of the queer story Peter Rabbit and Unc' Billy had told, and of the trouble his boasting had caused. He wandered around, too restless to stop. All the while, he waited for daybreak and hoped something would happen to keep him from Prickly Porky's hill.
        - id: ch03-b03
          speaker: narrator
          text: He did not dare tell old Granny Fox. Reddy knew exactly what she would say. He could almost hear her sharp voice.
        - id: ch03-b04
          speaker: granny_fox
          text: That's what comes of bragging about something you know nothing about. How often have I told you that boasting never brings any good? A wise fox stays away from strange things until he has learned all about them. That's how you stay out of trouble and live to a ripe old age. Wisdom is simply knowing, and a wise fox knows what he is doing.
    - id: ch04
      title: Daybreak
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: And so Reddy wandered through the whole long night. It seemed as though the night would never end, yet he wished it could last forever. The more he thought about what waited for him, the more frightened he became.
        - id: ch04-b02
          speaker: narrator
          text: At last, the first rays from jolly, round, red Mr. Sun began creeping through the Green Forest. The time had come. Reddy had to choose. He could prove his boast, or he could let everyone call him a coward.
        - id: ch04-b03
          speaker: narrator
          text: Very, very slowly, Reddy Fox started toward the hill where Prickly Porky lived.
