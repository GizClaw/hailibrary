audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 爱吹牛又好逞强，话里总带着自以为是的神气
        timbre: 明亮尖细
        pace: 稍快
        pitch: 中高音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 精明严厉，说起道理干脆利落，带着长辈不容争辩的口气
        timbre: 苍老而尖亮
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 夸口后的悔意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雷迪狐狸这会儿真后悔，恨自己当初没管住舌头。他偏要说，哪怕遇见那个吓坏彼得兔的怪物，自己也不会害怕。雷迪还夸下海口，说真碰见了那东西，他一定停下来，把对方的底细全弄清楚。其实呢，他根本没打算这样做，不过是随口吹牛罢了。
        - id: ch01-b02
          speaker: narrator
          text: 要说绿森林和绿草地一带谁最爱吹牛，雷迪准能排在前头。他就爱昂着头四处走，嘴里还说着大话。可爱吹牛的家伙往往胆子不大，雷迪也一样。他骨子里就是个胆小鬼。
        - id: ch01-b03
          speaker: narrator
          text: 负鼠比利大叔早就看穿他了。于是，比利大叔故意激雷迪，要他第二天一早去豪猪刺毛住的山脚下。彼得兔就是在那儿遇见怪物的。比利大叔还说，他自己也在那里看见过同一个怪东西。它没脑袋，没尾巴，也没腿，曾经把彼得吓得不轻。
        - id: ch01-b04
          speaker: narrator
          text: 比利大叔告诉雷迪，自己会坐在树上，亲眼瞧瞧他究竟来不来。这下，雷迪想退也退不了了。怪物要是真的出现，他非得兑现那番愚蠢的大话不可。因为当时有不少小动物听见他吹牛，也听见比利大叔向他叫阵。雷迪知道，要是自己不敢去，这事就再也没完。往后见了谁，谁都会叫他胆小鬼。
    - id: ch02
      title: 找不到的借口
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那天下午，雷迪怎么也睡不踏实。黄昏时，他本来该出去找晚饭了，可肚子一点儿也不饿。他没去打猎，反而用大半夜来想借口，好让自己破晓时不用去刺毛住的山上。可是想来想去，竟没有一个理由说得过去。
        - id: ch02-b02
          speaker: reddy_fox
          text: 要是鲍泽猎狗夜里没拴住就好了。我去逗它追我一阵，那不就有了最好的借口吗？
        - id: ch02-b03
          speaker: narrator
          text: 可雷迪明明知道，鲍泽夜里总是拴着的。尽管如此，他还是跑到农夫布朗家的院子里，非要亲眼看一看。果然，鲍泽拴得好好的。
        - id: ch02-b04
          speaker: narrator
          text: 雷迪偷偷溜开了，连鸡舍都没瞧一眼。他根本没发现，有人粗心地让鸡舍门敞着。就算看见了也没用，他实在没有一点儿胃口。哪怕最肥的鸡就站在面前，他也不会吃。
        - id: ch02-b05
          speaker: narrator
          text: 雷迪脑子里翻来覆去想的，只有彼得兔和比利大叔讲的怪事，还有自己胡乱吹牛惹下的麻烦。他坐立不安地到处走，等着天亮，又一心盼着忽然出点什么事，好让他去不了刺毛住的山上。
        - id: ch02-b06
          speaker: narrator
          text: 这件事，雷迪不敢告诉老狐狸奶奶。他太清楚奶奶会说什么了。耳边仿佛已经响起她尖厉的嗓音，连她要说的每一个字都听得见。
        - id: ch02-b07
          speaker: granny_fox
          text: 谁让你拿根本不懂的事情吹牛？这是你自找的。我告诉过你多少次，吹牛没有好下场。聪明的狐狸碰见陌生东西，总要先把它弄明白，绝不会冒冒失失地靠近。这样才能躲过麻烦，平安活到老。智慧就是见识，聪明的狐狸做什么都心里有数。
    - id: ch03
      title: 天终于亮了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪就这样来来回回地走了整整一夜。夜好像永远也过不完，可他又真希望它永远别过去。他越想，心里越害怕。
        - id: ch03-b02
          speaker: narrator
          text: 最后，快活、滚圆、通红的太阳公公还是把第一缕晨光送进了绿森林。时辰到了。雷迪只能挑一条路。要么兑现自己吹过的牛，要么让所有人都叫他胆小鬼。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪狐狸只好朝豪猪刺毛住的山走去。他走得很慢，很慢。
