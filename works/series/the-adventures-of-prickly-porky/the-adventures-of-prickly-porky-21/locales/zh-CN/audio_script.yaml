audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 机灵张扬，取笑别人时毫不遮掩
        timbre: 清脆响亮
        pace: 稍快
        pitch: 高音
    old_man_coyote:
      display_name: 老郊狼
      tts:
        delivery: 狡猾沉着，话里藏着试探和不动声色的算计
        timbre: 低沉粗粝
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十一章　冠蓝鸦萨米传口信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米替人传过的口信，多得数也数不清。怎样把话送到，他最有经验。什么时候该客气，他也清楚得很。只要萨米愿意，他能比谁都彬彬有礼。
        - id: ch01-b02
          speaker: narrator
          text: 他先飞到赤狐雷迪和老狐狸奶奶家，请他们去刺毛住的山上。萨米要让他们亲眼看看，那个曾把他们吓得不轻的可怕怪物，怎样把老郊狼也吓一大跳。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪和奶奶当场回绝。他们认定萨米准是又在打什么坏主意。再说，世上哪有什么没头、没腿、没尾巴的怪物？他们已经受骗一次，这回说什么也不肯再受骗了。
        - id: ch01-b04
          speaker: sammy_jay
          text: 好吧，你们不来就算了。连你们这么聪明的两位都承认上过当，我们还以为，你们愿意看看老郊狼也上一次同样的当呢。
        - id: ch01-b05
          speaker: narrator
          text: 萨米装出毫不在意的样子，说完便飞向绿草地，去找老郊狼。一路上，他还在暗自偷笑。
        - id: ch01-b06
          speaker: sammy_jay
          text: 他们一定会来。我太了解他们了。只要能看别人害怕，尤其是看老郊狼害怕，谁也拦不住他们。他们会藏起来，不过一定会到场。
        - id: ch01-b07
          speaker: narrator
          text: 萨米找到老郊狼时，老郊狼正舒舒服服地晒太阳。
        - id: ch01-b08
          speaker: sammy_jay
          text: 早上好，郊狼先生。您今天身子还好吧？
        - id: ch01-b09
          speaker: narrator
          text: 萨米摆出了自己最客气的样子。老郊狼嘴里答着话，那双狡猾又精明的眼睛却始终从眼角牢牢盯着他，半点也没有放松。
        - id: ch01-b10
          speaker: old_man_coyote
          text: 还好，还好，多谢关心。绿森林里有什么新消息？
        - id: ch01-b11
          speaker: sammy_jay
          text: 没什么消息，至少没什么要紧的。这个夏天真是闷透了。绿草地这边呢？我听说，草地鼠丹尼找回走失的宝宝了。
        - id: ch01-b12
          speaker: old_man_coyote
          text: 我也听说了。我还特意帮丹尼找过那个宝宝呢。你知道，我一向觉得，邻居之间本来就该互相帮忙嘛。
        - id: ch01-b13
          speaker: narrator
          text: 老郊狼说这番话时，极轻地眨了一只眼。萨米忍不住咧嘴笑了。他心里明白得很，要是那个走失的宝宝真让老郊狼找到，草地鼠丹尼就再也别想见到自己的孩子了。
        - id: ch01-b14
          speaker: sammy_jay
          text: 对了，我刚才穿过绿森林，看见彼得兔还在刺毛住的山上。他好像碰上了什么麻烦，腿瘸得很厉害，走路都成问题。
        - id: ch01-b15
          speaker: sammy_jay
          text: 彼得说，他不敢回老荆棘丛。万一路上有人想拿兔子当晚餐，凭他现在的样子，根本逃不了。彼得要是再不留神，早晚会落个糟糕的下场。
        - id: ch01-b16
          speaker: old_man_coyote
          text: 那要看你说的糟糕下场，是对谁来说。对彼得是坏事，对另一个家伙，说不定倒是天大的好事。
        - id: ch01-b17
          speaker: narrator
          text: 萨米听了，放声笑起来。
        - id: ch01-b18
          speaker: sammy_jay
          text: 这话倒也有道理。可我不希望彼得出事。我跟他吵架能找着不少乐子，要是少了他，我会想念得不得了。我还是去老果园看看吧，瞧瞧那边有什么动静。
        - id: ch01-b19
          speaker: narrator
          text: 萨米朝老果园飞去，飞在路上，又悄悄笑了。他刚才提到彼得独自待在绿森林里，瘸得连家也不敢回时，看得清清楚楚，老郊狼的耳朵马上微微竖了起来。
        - id: ch01-b20
          speaker: sammy_jay
          text: 我只要飞出他的视线，他马上就会动身去绿森林。
        - id: ch01-b21
          speaker: narrator
          text: 老郊狼果然动身了，一切正如萨米所料。
