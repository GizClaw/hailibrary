audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy:
      display_name: Sammy Jay
      tts:
        delivery: clever, talkative, and smoothly polite
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
    reddy:
      display_name: Reddy Fox
      tts:
        delivery: boastful on the surface but quick to worry
        timbre: sharp and youthful
        pace: brisk
        pitch: medium-high
    granny:
      display_name: Granny Fox
      tts:
        delivery: shrewd, firm, and hard to fool
        timbre: dry and mature
        pace: measured
        pitch: medium-low
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: sly, watchful, and smoothly self-satisfied
        timbre: lean and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Sammy Jay Delivers His Message
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay had carried so many messages that he knew exactly how to deliver one. When politeness suited him, no one could be more polite. First, he flew to the home of Reddy and Granny Fox. He invited them to Prickly Porky's hill to watch the terrible creature that had frightened them give Old Man Coyote a scare.
        - id: ch01-b02
          speaker: narrator
          text: Reddy and Granny refused at once. They said Sammy was probably planning some mischief. Besides, they knew there was no creature without a head, legs, or a tail. Sammy had fooled them once, and they would not let him fool them again.
        - id: ch01-b03
          speaker: sammy
          text: All right. It makes no difference to me. But you admit that even clever foxes like you were fooled. We thought you might enjoy seeing the same thing happen to Old Man Coyote.
        - id: ch01-b04
          speaker: narrator
          text: Sammy flew toward the Green Meadows to find Old Man Coyote, chuckling quietly to himself along the way. He felt sure the foxes would come, no matter what they had just said.
        - id: ch01-b05
          speaker: sammy
          text: They'll come. I know them too well. Nothing could keep them away from a chance to watch someone else get frightened, especially Old Man Coyote. They'll hide, of course, but they'll be there.
        - id: ch01-b06
          speaker: narrator
          text: Sammy found Old Man Coyote stretched out in the sun.
        - id: ch01-b07
          speaker: sammy
          text: Good morning, Mr. Coyote. I hope you're feeling well.
        - id: ch01-b08
          speaker: old_man_coyote
          text: Fairly well, thank you. What's the news in the Green Forest?
        - id: ch01-b09
          speaker: narrator
          text: As he answered, Old Man Coyote watched Sammy closely from the corners of his clever eyes.
        - id: ch01-b10
          speaker: sammy
          text: There really isn't any news worth telling. I've never known such a dull summer. Is anything happening here on the Green Meadows? I heard Danny Meadow Mouse found his missing baby.
        - id: ch01-b11
          speaker: old_man_coyote
          text: That's what I heard. I tried to find the little one for him. You know, I believe neighbors should help each other.
        - id: ch01-b12
          speaker: narrator
          text: Old Man Coyote gave the tiniest wink as he said it, and Sammy grinned. Sammy knew perfectly well that if the coyote had found that baby, Danny Meadow Mouse would never have seen the little mouse again.
        - id: ch01-b13
          speaker: sammy
          text: Oh, by the way, I saw Peter Rabbit while I was passing through the Green Forest. He was over on Prickly Porky's hill, and he seemed to be in trouble. He was limping so badly that he didn't dare head home to the Old Briar-patch. He was afraid he might meet someone hunting for a rabbit dinner, and in his condition, he couldn't get away. If Peter isn't more careful, he'll come to a bad end one day.
        - id: ch01-b14
          speaker: narrator
          text: Sammy made this sound like the most ordinary bit of news.
        - id: ch01-b15
          speaker: old_man_coyote
          text: That depends on what you mean by a bad end. It might be bad for Peter and very good for someone else.
        - id: ch01-b16
          speaker: narrator
          text: Old Man Coyote wore a sly grin, and Sammy burst out laughing.
        - id: ch01-b17
          speaker: sammy
          text: That's certainly one way to see it. Still, I'd hate for anything to happen to Peter. I have such fun arguing with him, and I'd miss him terribly. Well, I think I'll fly up to the Old Orchard and find out what's happening there.
        - id: ch01-b18
          speaker: narrator
          text: Sammy flew off toward the Old Orchard, chuckling once again. He had watched Old Man Coyote carefully. When Sammy mentioned that Peter was in the Green Forest, too lame to go home, the coyote's ears had lifted just a little.
        - id: ch01-b19
          speaker: sammy
          text: He'll leave for the Green Forest as soon as I'm out of sight.
        - id: ch01-b20
          speaker: narrator
          text: And that is exactly what Old Man Coyote did.
