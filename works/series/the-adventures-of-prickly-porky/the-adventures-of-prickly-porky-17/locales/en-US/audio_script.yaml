  chapters:
    - id: ch01
      title: GRANNY FOX CATCHES PETER RABBIT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Here is a little tale about foolishness, and what can happen when someone gets just a bit too merry.
        - id: ch01-b02
          speaker: narrator
          text: Old Granny Fox raced out of sight as though every leap might be her last. The moment she was gone, Jimmy Skunk crept from his hiding place beneath a big stump. Peter Rabbit climbed out of the hollow log where he had been peeking, and Unc' Billy Possum dropped from the hemlock tree that had kept him hidden.
        - id: ch01-b03
          speaker: narrator
          text: All three danced around Prickly Porky. They laughed so hard, you might have thought their sides would split.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: Ho, ho, ho! Just imagine what Reddy Fox would say if he'd seen Granny tear down that hollow!
          emotion: happy
        - id: ch01-b05
          speaker: peter_rabbit
          text: Ha, ha, ha! Did you see her eyes nearly pop out?
          emotion: happy
        - id: ch01-b06
          speaker: unc_billy_possum
          text: Hee, hee, hee! Ah reckon her feet will be mighty sore if she keeps running the way she started!
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: Prickly Porky said nothing. He only gave a quiet smile and slowly climbed back to the top of the hill.
        - id: ch01-b08
          speaker: narrator
          text: Granny Fox really had been frightened. And who wouldn't be? A strange creature with no head, no tail, and no legs had come rolling straight down the hill at her.
        - id: ch01-b09
          speaker: narrator
          text: But Granny was old and wise. She would not run far without knowing why. She had barely passed out of sight of the four little scamps who had watched her run when she stopped and looked back. Was the strange creature following her? No, it was not. It took Granny only a moment to decide that, and then she quickly began to think.
        - id: ch01-b10
          speaker: granny_fox
          text: I said there was a trick behind this, and now I know there is. That good-for-nothing old Billy Possum must know something about it. I'm going straight back to find out.
        - id: ch01-b11
          speaker: narrator
          text: She did not waste another moment. Granny began to creep back along the way she had come.
        - id: ch01-b12
          speaker: narrator
          text: No one could step more lightly than Granny Fox, and no one was better at staying out of sight. She crept from tree to tree without being seen. Sometimes she crawled flat on her stomach. At last, she reached the foot of the hill where she had gotten such a fright.
        - id: ch01-b13
          speaker: narrator
          text: Nothing was there at the bottom. Then Granny looked toward the hilltop. What she saw put a fierce, angry gleam in her yellow eyes. After a moment, she gave a grim smile.
        - id: ch01-b14
          speaker: granny_fox
          text: The last laugh is always the best one. This time, I believe it will be mine.
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: Very slowly, Granny circled around toward the back of the hill. She moved so carefully that she did not rustle even one leaf.
        - id: ch01-b16
          speaker: narrator
          text: What had Granny seen? Peter Rabbit, Jimmy Skunk, and Unc' Billy Possum were rolling over and over in the dry leaves. They turned somersaults, shouted, and laughed, while Prickly Porky sat nearby with a smile.
        - id: ch01-b17
          speaker: narrator
          text: Granny knew exactly what they found so funny. She also knew they never dreamed she had stopped running and come creeping back. They thought she must still be racing farther and farther away in fear.
        - id: ch01-b18
          speaker: narrator
          text: At last, all that laughing and tumbling wore them out. They had to stop and rest.
        - id: ch01-b19
          speaker: peter_rabbit
          text: Oh, dear! I can't catch my breath.
        - id: ch01-b20
          speaker: narrator
          text: Peter flopped down flat on the ground, panting.
        - id: ch01-b21
          speaker: peter_rabbit
          text: That was the funniest thing I've ever seen! I wonder who we—
          emotion: happy
        - id: ch01-b22
          speaker: narrator
          text: Peter never finished. No, Sir, he did not finish at all.
        - id: ch01-b23
          speaker: narrator
          text: Something red flashed from beneath a low hemlock tree right behind him. Peter gave a frightened shriek. Two black paws pinned him to the ground, and sharp teeth caught the back of his neck.
        - id: ch01-b24
          speaker: narrator
          text: Old Granny Fox had caught Peter Rabbit at last!
