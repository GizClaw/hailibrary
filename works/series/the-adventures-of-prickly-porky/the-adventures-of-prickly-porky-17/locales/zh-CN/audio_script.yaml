audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 爽朗顽皮，笑声里满是看热闹的兴奋
        timbre: 明亮结实
        pace: 轻快
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼淘气，说话快而直接，遇险时惊慌失措
        timbre: 清脆稚嫩
        pace: 偏快
        pitch: 中高音
    unc_billy:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢条斯理又爱逗趣，乡音里透着藏不住的得意
        timbre: 温厚而略带沙哑
        pace: 舒缓
        pitch: 中低音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练精明，语气威严，盘算时低沉而冷峻
        timbre: 略显苍老而锐利
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 笑得太早
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 且听这个小故事。它讲的是得意和糊涂。有时候，人要是乐过了头，转眼就会给自己惹来麻烦。
        - id: ch01-b02
          speaker: narrator
          text: 老狐狸奶奶跑得飞快，仿佛每一跳都可能是最后一跳。她一消失，三个藏起来的家伙马上现了身。臭鼬吉米从大树桩底下的洞里钻出来。彼得兔离开刚才偷看的空心木头。负鼠比利大叔也从那棵让他藏得严严实实的铁杉树上溜了下来。
        - id: ch01-b03
          speaker: narrator
          text: 他们围着豪猪刺毛又跳又笑，一个个笑得直不起腰，仿佛非把肚皮笑破不可。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 嚯，嚯，嚯！要是雷迪亲眼看见老奶奶沿着洼地逃走，他会说什么呀？
          emotion: happy
        - id: ch01-b05
          speaker: peter_rabbit
          text: 哈，哈，哈！你们看见没有？她的眼睛都快瞪出来啦！
          emotion: happy
        - id: ch01-b06
          speaker: unc_billy
          text: 嘻，嘻，嘻！照她起跑时那个跑法，俺看呐，她的脚准得疼上一阵子。
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 豪猪刺毛没有开口。他只静静地笑了笑，又慢慢爬上山顶。
    - id: ch02
      title: 奶奶悄悄回来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老狐狸奶奶刚才真的吓坏了。一个没脑袋、没尾巴、也没腿的怪东西直朝自己滚来，谁见了能不怕呢？不过，她毕竟又老练又精明，不会平白无故一直逃下去。
        - id: ch02-b02
          speaker: narrator
          text: 她刚离开那四个小淘气的视线，就停下来回头察看。那个怪东西并没有追来。奶奶很快看明白了这一点，心里立刻盘算起来。
        - id: ch02-b03
          speaker: granny_fox
          text: 我早就说这里头有花招，现在可更确定了。那个没出息的老比利一定知道内情，我这就回去问个明白。
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 她连多想一刻也没有，马上沿原路悄悄折回。论脚步轻，谁也赶不上老狐狸奶奶。论藏住行踪，她也最有本事。她从一棵树潜到另一棵树，有时干脆把肚皮贴着地面爬，最后又回到了刚才受惊的山脚下。
        - id: ch02-b05
          speaker: narrator
          text: 山脚下什么也没有。可她朝山顶一望，黄眼睛里顿时闪出又凶又恼的光。接着，她冷冷一笑。
        - id: ch02-b06
          speaker: granny_fox
          text: 笑到最后的人，才笑得最好。这回该轮到我了。
        - id: ch02-b07
          speaker: narrator
          text: 奶奶小心地绕向山后，连一片叶子都没有碰响。她要从背面慢慢爬上去。
    - id: ch03
      title: 谁也没有提防
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 奶奶在山下看得清清楚楚。彼得兔、臭鼬吉米和比利大叔正在枯叶堆里滚来滚去，还不停地翻筋斗。他们边翻边喊，边喊边笑。豪猪刺毛就坐在旁边，笑着看他们闹。
        - id: ch03-b02
          speaker: narrator
          text: 她当然知道，什么事把他们逗成了这样。她也明白，这几个家伙压根儿想不到她会回来。他们还以为，奶奶正在远处吓得拼命逃跑呢。
        - id: ch03-b03
          speaker: narrator
          text: 大伙儿痛痛快快玩了好一阵，累得再也闹不动，只好停下来歇一会儿。彼得往地上一摊，喘得上气不接下气。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 哎哟，我气都喘不上来了！我从没见过这么好笑的事。不知道我们——
          emotion: happy
    - id: ch04
      title: 老狐狸奶奶抓住了彼得兔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得没有说完。不，先生，他到底没能把话说完。
        - id: ch04-b02
          speaker: narrator
          text: 他身后不远处，一棵低矮的铁杉下面忽然闪出一道红影。彼得吓得尖叫起来。两只黑爪一下把他按住，一排尖牙也咬住了他的后颈。
        - id: ch04-b03
          speaker: narrator
          text: 老狐狸奶奶终于抓住彼得兔了！
