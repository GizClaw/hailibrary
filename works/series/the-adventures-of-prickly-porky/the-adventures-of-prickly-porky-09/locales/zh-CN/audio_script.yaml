audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 负鼠比利大叔
      tts:
        delivery: 直率老练，乡音亲切，训人时严肃却不失幽默
        timbre: 粗哑温厚
        pace: 中速
        pitch: 中低音
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 好奇坦率，问话时带着专注又天真的认真
        timbre: 年轻清亮
        pace: 中速
        pitch: 中高音
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 爱吹牛又好逞强，话里总带着自以为是的神气
        timbre: 明亮尖细
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 两种说法
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿草地和绿森林里的小动物们，这会儿真不知道该信谁了。事情先从彼得兔说起。他带回一个离奇透顶的故事，说有个可怕的怪物追赶自己。那东西没有腿，没有脑袋，也没有尾巴，是从豪猪刺毛住的山上冲下来的。
        - id: ch01-b02
          speaker: narrator
          text: 大伙儿派臭鼬吉米去拜访刺毛，问问他有没有见过这样的东西。刺毛说，这一带根本没来过什么陌生家伙。吉米马上回到绿草地，把这话告诉朋友们。在他看来，刺毛一直待在家里，却没发现任何异常，那彼得不是眼睛有毛病，就是脑袋糊涂了。
        - id: ch01-b03
          speaker: narrator
          text: 偏偏就在这时，负鼠比利大叔也在绿森林里到处讲自己的说法。他逢人便说，自己同样拜访过刺毛。可刺毛告诉他的，却是彼得准看见了什么怪东西。
        - id: ch01-b04
          speaker: narrator
          text: 没过多久，吉米的话传遍了绿森林，比利大叔的话也传遍了绿草地。大家越听越糊涂。要是吉米说得对，彼得的怪故事就一点儿也不能信。要是比利大叔说得对，那个故事听着虽荒唐，却未必是假的。
    - id: ch02
      title: 山上究竟有什么
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这两种截然不同的说法，引得大伙儿议论纷纷，好奇心也越来越重。胆子最大的那些小动物开始往刺毛住的山上跑，想亲眼瞧瞧有没有不寻常的东西。
        - id: ch02-b02
          speaker: narrator
          text: 可他们一次次过去，看到的都只是绿森林平常的模样。有时，他们倒能看见刺毛，但刺毛像是睡得正香。谁也不愿叫醒他，再追着问这问那。渐渐地，大家都觉得臭鼬吉米才是对的。彼得说的可怕怪物，恐怕只存在于他自己的想象里。
        - id: ch02-b03
          speaker: narrator
          text: 就在这时候，比利大叔又说话了。他告诉大家，自己刚刚遇到了和彼得一模一样的事。也是一大清早，也是在经过刺毛住的山脚时，连事情的经过都丝毫不差。
        - id: ch02-b04
          speaker: unc_billy_possum
          text: 俺一路走着，只管忙自己的事。忽然，俺听见身后的山上有动静。抬头一瞧，有个东西正从山上直冲俺过来。可俺怎么看，也看不见它的腿、脑袋和尾巴。
        - id: ch02-b05
          speaker: bobby_coon
          text: 那你后来怎么办了，比利大叔？
        - id: ch02-b06
          speaker: unc_billy_possum
          text: 俺怎么办？换成你们，也会跟俺一样——撒腿就跑！
        - id: ch02-b07
          speaker: narrator
          text: 比利大叔说着，朝围成小圈的森林和草地居民望了一圈。大伙儿全都瞪圆眼睛，张着嘴，听得入了神。
        - id: ch02-b08
          speaker: unc_billy_possum
          text: 对啦，先生，俺跑了！俺一口气跑进树洞，直到平平安安了，才敢回头看！
    - id: ch03
      title: 雷迪夸下海口
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪狐狸一直在旁边听着。这时，他轻蔑地哼了一声。
        - id: ch03-b02
          speaker: reddy_fox
          text: 呸！你可真胆小。我才不会逃跑呢。我会留在那儿，把那东西弄个明白。你和彼得兔呀，连自己的影子都能吓得转身就跑。
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 那明天破晓的时候，你自己敢去那里吗？俺看你可不敢！
        - id: ch03-b04
          speaker: reddy_fox
          text: 我当然敢！
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 雷迪回答得气冲冲的，可他心里压根儿没想过真要去。
        - id: ch03-b06
          speaker: unc_billy_possum
          text: 那好。明天早晨，俺会待在一棵树上看着。到时候，俺倒要瞧瞧，你是不是真有嘴上说的那么勇敢。
        - id: ch03-b07
          speaker: narrator
          text: 这下，雷迪明白自己非去不可了。要是不去，大家准会叫他胆小鬼。
        - id: ch03-b08
          speaker: reddy_fox
          text: 我会去的。
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: 雷迪气冲冲地低吼完，便悄悄溜走了。
