audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: boastful and quick to challenge
        timbre: sharp and lively
        pace: brisk
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: plainspoken and matter-of-fact
        timbre: mellow and sturdy
        pace: measured
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: folksy and animated with an easy Southern drawl
        timbre: warm and slightly raspy
        pace: relaxed
        pitch: medium
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: curious and earnest
        timbre: bright and smooth
        pace: moderate
        pitch: medium-high
  chapters:
    - id: ch01
      title: JIMMY SKUNK AND UNC' BILLY POSSUM TELL DIFFERENT STORIES
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The little people of the Green Meadows and the Green Forest could not decide what to believe. Peter Rabbit had come to them first with a very strange story. A terrible creature had chased him down the hill where Prickly Porky the Porcupine lived. It had no legs, no head, and no tail. Jimmy Skunk went to ask Prickly Porky if he had seen anything like it. Prickly Porky said he had seen no stranger anywhere nearby. So Jimmy hurried back to the Green Meadows. He told his friends that Peter's eyes must have played a trick on him, unless Peter had gone crazy. After all, Prickly Porky had stayed home and had seen nothing unusual.
        - id: ch01-b02
          speaker: narrator
          text: Meanwhile, Unc' Billy Possum was making his way through the Green Forest, telling everyone he met a different story. He said he had visited Prickly Porky too, and Prickly Porky had told him that Peter must have seen something strange. Before long, Jimmy's version had traveled through the forest, while Unc' Billy's had traveled across the meadows. The two stories reached everyone, and nobody knew what to think. If Jimmy was right, Peter's queer tale could not be trusted at all. But if Unc' Billy was right, perhaps Peter's tale was not so crazy after all.
        - id: ch01-b03
          speaker: narrator
          text: Everyone talked about it, and everyone grew curious. Those with the most courage began making visits to Prickly Porky's hill. They wanted to see for themselves if anything there was out of the ordinary. But every time they went, that part of the Green Forest looked just as it always did. If they happened to see Prickly Porky, he seemed sound asleep, and nobody wanted to wake him just to ask questions. Slowly, they began to side with Jimmy Skunk. Perhaps Peter's terrible creature had lived only in Peter's imagination.
        - id: ch01-b04
          speaker: narrator
          text: Then Unc' Billy announced that the very same thing had happened to him. Like Peter, he had been passing the foot of Prickly Porky's hill early one morning.
        - id: ch01-b05
          speaker: unc_billy_possum
          text: Ah was going along, minding mah own business, when Ah heard something behind me, up on that hill. Ah looked back, and there it was, coming right down toward me. Ah couldn't make out any legs, any head, or any tail.
        - id: ch01-b06
          speaker: bobby_coon
          text: So what did you do, Unc' Billy?
        - id: ch01-b07
          speaker: unc_billy_possum
          text: What did Ah do? Why, Ah did exactly what any of yo'alls would have done. Ah ran!
        - id: ch01-b08
          speaker: narrator
          text: Unc' Billy looked around at the little circle of meadow and forest people. They stared back with wide eyes and open mouths.
        - id: ch01-b09
          speaker: unc_billy_possum
          text: Yes, Sah! Ah kept running, and Ah never once looked back till Ah was safe inside mah hollow tree.
        - id: ch01-b10
          speaker: narrator
          text: Reddy Fox had been listening. Now he gave a scornful snort.
        - id: ch01-b11
          speaker: reddy_fox
          text: Pooh! What a coward you are. I wouldn't have run. I'd have stayed right there until I found out what it was. You and Peter Rabbit would both run from your own shadows.
        - id: ch01-b12
          speaker: unc_billy_possum
          text: Then Ah dare yo' to go up there at daybreak tomorrow!
        - id: ch01-b13
          speaker: reddy_fox
          text: Of course I'll go!
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Reddy spoke angrily, though he had no intention at all of going.
        - id: ch01-b15
          speaker: unc_billy_possum
          text: Fine. Tomorrow morning, Ah'll be watching from a tree. Then we'll all find out whether yo' are truly as brave as yo' claim.
        - id: ch01-b16
          speaker: narrator
          text: Reddy knew he had been caught. If he stayed away, everyone would call him a coward.
        - id: ch01-b17
          speaker: reddy_fox
          text: I'll be there.
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: He snarled the words and slunk away.
