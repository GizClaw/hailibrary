audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，打趣别人时轻快而不刻薄
        timbre: 清亮温和
        pace: 明快
        pitch: 中高音
    mrs_peter:
      display_name: 彼得太太
      tts:
        delivery: 温柔细致，担忧时语气急切，却仍带着亲切和关怀
        timbre: 柔和清亮
        pace: 中速，焦急时稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第五章　彼得兔讲述他的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔从绿森林一路飞奔，终于回到了亲爱的老蔷薇丛。等他好不容易喘过气来，马上讲起了一桩了不得的奇遇。故事说的是绿森林里一个从没见过的陌生客。彼得把它说得活灵活现，连彼得太太都以为那一定是个可怕的怪物。因为它没有腿，没有脑袋，也没有尾巴。至少，彼得自己是这么说的。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 事情是这样的。我在绿森林里多待了一会儿，耽搁得比原先打算的久。亲爱的，你知道，我一直尽量赶在圆滚滚、红彤彤、笑呵呵的太阳公公起床，还有西风老婆婆来到绿草地以前回家。
        - id: ch01-b03
          speaker: narrator
          text: 彼得太太点了点头。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 可今天的时间跑得太快了。要不然，就是太阳公公比平常起得早。
        - id: ch01-b05
          speaker: narrator
          text: 彼得忽然停住了。这主意刚刚钻进脑袋，他却越想越觉得准没错。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 我明白了！一定是太阳公公弄错了，今天早早就爬出了被窝！
        - id: ch01-b07
          speaker: narrator
          text: 彼得太太那副神情分明是不相信，可她一句话也没有说。于是彼得接着讲了下去。
        - id: ch01-b08
          speaker: peter_rabbit
          text: 我发现天都那么亮了，就赶紧往家跑。我正跑得起劲，忽然听见豪猪刺毛住的山顶上有一点儿动静。我还当是刺毛要出门吃早饭呢，便抬起头，张嘴想向他问好。可那声问候根本没说出来。不，先生，我一个字都没说。我早就吓得说不出话了！
          emotion: fearful
        - id: ch01-b09
          speaker: peter_rabbit
          text: 山上有个怪物正朝我下来，那是绿森林里从来没人见过的最吓人的东西！它没有腿，没有脑袋，也没有尾巴，还飞快地直追着我。我使出全身力气，才总算躲开！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 彼得说到这里，两只眼睛越瞪越圆，越睁越大。
        - id: ch01-b11
          speaker: peter_rabbit
          text: 我仔细看了一眼，拔腿就跳。我的天哪，那一跳可真够远的！接着，我把四条腿倒腾得能有多快就有多快，一口气跑回了家。现在我总算到家了，能回来可真好！
        - id: ch01-b12
          speaker: narrator
          text: 彼得讲故事时，彼得太太一直张着嘴。等他说完，她啪地合上嘴，蹦到他身边，摸了摸他的脑袋。
        - id: ch01-b13
          speaker: mrs_peter
          text: 彼得，你是不是病了？
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: 彼得瞪着她。
        - id: ch01-b15
          speaker: peter_rabbit
          text: 病了？我病了？一点儿也没有！我这辈子都没感觉这么好过。只不过刚才跑得太远，现在有一点儿累。你怎么会问这种傻问题？我看起来像是病了吗？
        - id: ch01-b16
          speaker: mrs_peter
          text: 不——像。你看起来没有病，可你说的这些话，倒像是脑袋有点儿不对劲。彼得，我看你是头昏了。要不然，你准是在什么地方睡着，做了个噩梦。我没有听错吧？你说那个可怕的怪物没有腿，却能在后面追你？
        - id: ch01-b17
          speaker: peter_rabbit
          text: 对，我说的就是这个！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 彼得有点儿恼火。他已经看出来，彼得太太一个字也不相信。
        - id: ch01-b19
          speaker: mrs_peter
          text: 那你告诉我，不管是在绿森林里面还是外面，一个东西既没有腿，也没有翅膀，究竟怎么追得了别人？你刚才可完全没说它长着翅膀。
        - id: ch01-b20
          speaker: narrator
          text: 这下可把彼得难住了。他困惑地抓了抓脑袋，忽然冒出一个好主意，顿时又得意起来。
        - id: ch01-b21
          speaker: peter_rabbit
          text: 黑蛇先生跑得够快吧？他也没有腿，对不对？
        - id: ch01-b22
          speaker: narrator
          text: 小彼得太太听了，显得有些为难。
        - id: ch01-b23
          speaker: mrs_peter
          text: 不——错，他的确没有腿。可我始终弄不懂，他没腿怎么还能跑。
        - id: ch01-b24
          speaker: peter_rabbit
          text: 这不就对了？既然黑蛇先生没腿也能跑，别的东西为什么不能？况且，那个怪物也不完全是在跑。它是在滚。好了，我要说的全都说完了。出了这么一场事，我得好好睡上一大觉。别让任何人来吵我。
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: 彼得太太温顺地答应下来，随后又劝了彼得一句。
        - id: ch01-b26
          speaker: mrs_peter
          text: 我不会让人打扰你的。不过，彼得，要是我是你，我就不把这个故事讲给别人听。
