audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: excitable, dramatic, and quick to defend himself
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    mrs_peter:
      display_name: Mrs. Peter Rabbit
      tts:
        delivery: gentle, sensible, and quietly skeptical
        timbre: soft and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: PETER RABBIT TELLS HIS STORY
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit had made a long, hard run all the way from the Green Forest to the dear Old Briar-patch. Once he could catch his breath again, he had a wonderful story to tell. It was all about a stranger he had seen in the forest. If you had heard Peter tell it, you would have thought, just as Mrs. Peter did, that this stranger must be truly terrible. It had no legs, no head, and no tail. At least, that was what Peter said.
        - id: ch01-b02
          speaker: peter
          text: This is what happened. I stayed in the Green Forest longer than I meant to. You know I always try to get home by the time jolly, round, red Mr. Sun climbs out of bed and Old Mother West Wind comes down to the Green Meadows.
        - id: ch01-b03
          speaker: narrator
          text: Mrs. Peter nodded.
        - id: ch01-b04
          speaker: peter
          text: But somehow the time slipped away faster than I expected. Unless Mr. Sun got up earlier than he usually does.
        - id: ch01-b05
          speaker: narrator
          text: Peter stopped. He had never thought of that before, and the idea pleased him.
        - id: ch01-b06
          speaker: peter
          text: That must be it! Mr. Sun made a mistake and got out of bed too early!
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: Mrs. Peter looked doubtful, but she said nothing. Peter went on.
        - id: ch01-b08
          speaker: peter
          text: I had just noticed how light it was, so I started home and hurried with all my might. Then I heard a little noise at the top of the hill where Prickly Porky the Porcupine lives. Of course, I thought Prickly himself was coming out for breakfast. I looked up with my mouth open, ready to say hello. But I didn't say hello. No, sir, I couldn't say a word. I was too frightened. The most dreadful creature anyone has ever seen in the Green Forest was starting down that hill, straight toward me! It had no legs. It had no head. It had no tail. And it came after me so fast that I could barely get out of its way!
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: Peter's eyes grew round and wide as he told this part.
        - id: ch01-b10
          speaker: peter
          text: I took one good look, and then I jumped. My gracious, how I jumped! After that, I ran for home as fast as I could make my legs go. Now I'm here, and I am mighty glad to be home!
        - id: ch01-b11
          speaker: narrator
          text: Mrs. Peter had listened with her mouth hanging open. When Peter finished, she snapped it shut. Then she hopped over and felt his head.
        - id: ch01-b12
          speaker: mrs_peter
          text: Peter, are you sick?
        - id: ch01-b13
          speaker: narrator
          text: She sounded anxious. Peter stared at her.
        - id: ch01-b14
          speaker: peter
          text: Sick? Me? Not at all! I've never felt better, except that I'm a little tired from that long run. What a silly thing to ask! Do I look sick?
        - id: ch01-b15
          speaker: mrs_peter
          text: No. No, you don't look sick. But the way you're talking makes me think something is wrong with your head. Maybe you're a little light-headed. Or perhaps you fell asleep somewhere and had a bad dream. Did you really say that dreadful creature had no legs, but it still chased you?
        - id: ch01-b16
          speaker: peter
          text: That is exactly what I said!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: Peter answered rather crossly, because he could see that Mrs. Peter did not believe a word of his story.
        - id: ch01-b18
          speaker: mrs_peter
          text: Then please explain something to me. How can any creature, in the Green Forest or anywhere else, chase someone without legs or wings? And you never said this creature had wings.
        - id: ch01-b19
          speaker: narrator
          text: Peter scratched his head, completely puzzled by her question. All at once, a happy thought came to him, and he knew just how to answer her.
        - id: ch01-b20
          speaker: peter
          text: Mr. Blacksnake can move fast, and he has no legs. Does he?
        - id: ch01-b21
          speaker: narrator
          text: Peter sounded triumphant. Mrs. Peter looked a little uncomfortable.
        - id: ch01-b22
          speaker: mrs_peter
          text: No, he doesn't have legs. But I have never understood how he moves without them.
        - id: ch01-b23
          speaker: peter
          text: Well, then! If Mr. Blacksnake can move without legs, why couldn't another creature do it? Besides, this creature didn't exactly run. It rolled. That is all I'm going to tell you. After everything I've been through, I need a long nap. Don't let anyone bother me.
        - id: ch01-b24
          speaker: mrs_peter
          text: I won't. But Peter, if I were you, I would not tell that story to anyone else.
