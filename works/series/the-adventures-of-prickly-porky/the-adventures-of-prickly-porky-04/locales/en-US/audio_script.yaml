  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    mrs_peter:
      display_name: Mrs. Peter Rabbit
      tts:
        delivery: caring, earnest, and easily worried
        timbre: soft and clear
        pace: moderately quick
        pitch: medium-high
    merry_little_breeze:
      display_name: Merry Little Breeze
      tts:
        delivery: cheerful and reassuring
        timbre: light and airy
        pace: lively
        pitch: high
