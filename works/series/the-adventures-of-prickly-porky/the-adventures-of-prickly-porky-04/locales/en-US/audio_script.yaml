  chapters:
    - id: ch01
      title: PETER RABBIT HAS SOME STARTLING NEWS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Mrs. Peter Rabbit sat at the edge of the dear Old Briar-patch, watching anxiously for Peter. She had once been Little Miss Fuzzytail. Now she was Peter's wife, and she was terribly worried. Why hadn't he come home? She wished he would stay near the Briar-patch. She could not understand why he kept going all the way to the Green Forest. He always found dreadful adventures and narrow escapes there. Still, no matter what she said, he went back again and again.
        - id: ch01-b02
          speaker: narrator
          text: Whenever Peter was out of sight, Mrs. Peter could not rest. He had always come home safely before, but that did not stop her from worrying. She feared that one day his terrible curiosity would lead him into trouble he could not escape. Each time he left for the Green Forest, she felt certain she would never see him again.
        - id: ch01-b03
          speaker: narrator
          text: Peter would laugh and call her his foolish little dear. He said he could take care of himself. Then he would see how troubled she was and promise to be very careful. He would promise not to do anything foolish or rash. But Peter would never promise to stay out of the Green Forest.
        - id: ch01-b04
          speaker: narrator
          text: He had too many friends there, and there was always so much news to discover. He simply could not stay away. Once or twice, he had persuaded Mrs. Peter to come with him. She had been frightened nearly out of her skin the whole time. To her, danger seemed to be hiding behind every tree and beneath every bush.
        - id: ch01-b05
          speaker: mrs_peter
          text: Chatterer and Happy Jack can leap from tree to tree. That's fine for squirrels. But the Green Forest isn't a safe or sensible place for a rabbit.
        - id: ch01-b06
          speaker: narrator
          text: And she told Peter exactly that.
        - id: ch01-b07
          speaker: narrator
          text: On this particular morning, Mrs. Peter was more anxious than usual. Peter had been away all night. Most mornings, he returned before Old Mother West Wind came down from the Purple Hills. She would open her great bag and let the Merry Little Breezes out to play all day on the Green Meadows. But this morning, Old Mother West Wind had finished her work long ago, and Peter still had not appeared.
        - id: ch01-b08
          speaker: mrs_peter
          text: Something has happened. Oh, I just know something has happened!
          emotion: fearful
        - id: ch01-b09
          speaker: mrs_peter
          text: Oh, Peter, Peter, Peter Rabbit, why must you be so careless? Why do you take such dreadful risks when there's no need at all?
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: Just then, one of the Merry Little Breezes came along and heard her.
        - id: ch01-b11
          speaker: merry_little_breeze
          text: Don't worry. Peter is clever enough to look after himself. He'll be back soon. Why, I think I can see him coming right now.
          emotion: calm
        - id: ch01-b12
          speaker: narrator
          text: Mrs. Peter looked where the Merry Little Breeze was looking. Sure enough, there was Peter. He was racing straight toward the dear Old Briar-patch, as though he wanted to show just how fast he could run. Mrs. Peter's heart gave a frightened thump.
        - id: ch01-b13
          speaker: narrator
          text: She thought Reddy Fox or Granny Fox must be chasing him. Or perhaps Old Man Coyote was right behind him.
        - id: ch01-b14
          speaker: narrator
          text: But no matter how hard she looked, she could see nothing chasing Peter and no other reason for him to run that way.
        - id: ch01-b15
          speaker: narrator
          text: A few minutes later, Peter reached her side. His eyes were very wide, and anyone could see that he was about to burst with important news.
        - id: ch01-b16
          speaker: mrs_peter
          text: Peter, what is it? Tell me quickly! Did you barely escape from something again?
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: Peter nodded as he struggled to catch his breath.
        - id: ch01-b18
          speaker: peter_rabbit
          text: There's a new stranger in the Green Forest! He's a terrible-looking fellow with no legs, no head, and no tail, and he almost caught me!
          emotion: fearful
