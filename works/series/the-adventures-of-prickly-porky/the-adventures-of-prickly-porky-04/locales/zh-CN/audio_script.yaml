audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，打趣别人时轻快而不刻薄
        timbre: 清亮温和
        pace: 明快
        pitch: 中高音
    mrs_peter:
      display_name: 彼得太太
      tts:
        delivery: 温柔细致，担忧时语气急切，却仍带着亲切和关怀
        timbre: 柔和清亮
        pace: 中速，焦急时稍快
        pitch: 中高音
    merry_little_breeze:
      display_name: 快乐小风儿
      tts:
        delivery: 活泼爽朗，说话轻快，安慰别人时自然又热心
        timbre: 轻盈清脆
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 彼得太太放心不下
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔太太从前叫毛尾巴小姐，大家都亲昵地叫她小彼得太太。这天，她坐在亲爱的老蔷薇丛边上，焦急地望着绿森林。她是真的担心，而且担心得不得了。彼得怎么还不回家呢？她真希望彼得能安分地待在附近，不要老往那么远的绿森林跑。她怎么也想不通，他究竟为什么非去不可。彼得每次过去，总会遇上可怕的险事，差一点儿回不来。可她怎么劝也没用。彼得一离开她的视线，她就没有一刻能安心。虽说他每次都平安回来了，她还是怕他那害人的好奇心早晚会惹出大麻烦，再也无法脱身。每逢彼得去绿森林，她都认定，真真切切地认定，自己这回再也见不到他了。
        - id: ch01-b02
          speaker: narrator
          text: 彼得总笑她傻乎乎的，还说自己完全能照顾好自己。见她实在担心，他便答应一定小心，绝不冒冒失失地做傻事。不过，要他保证不去绿森林，那可办不到。不成，先生，彼得说什么也不肯答应。这件事一点儿商量余地也没有。他在那儿有许多朋友，还有数不清的新鲜消息等着打听，哪里忍得住不去呢？
        - id: ch01-b03
          speaker: narrator
          text: 有一两次，彼得劝动太太陪他一起去。可一路上，她时时刻刻都吓得要命，总觉得每棵树后、每片灌木下都藏着危险。红松鼠喋喋和灰松鼠快乐杰克能在树间跳来跳去，去绿森林当然没关系。可彼得太太觉得，有头脑的兔子不该去那种既危险又不合适的地方。她也当面这样告诉过彼得。
    - id: ch02
      title: 等不到彼得的早晨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这个早晨，彼得太太格外焦急，因为彼得整整一夜都没回来。往常，等西风老婆婆从紫山下来，打开大口袋，让孩子们快乐小风儿到绿草地上玩上一整天时，彼得早就到家了。今天，西风老婆婆已经办完这件事好一阵子，彼得却还是踪影全无。
        - id: ch02-b02
          speaker: mrs_peter
          text: 一定出事了。我知道，一定出事了！彼得呀，彼得，彼得兔，为什么总是没个小心处？为什么偏去冒那可怕的险，又是胡闹，又全无用处？
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: 正巧，一个快乐小风儿从旁边经过，听见了她的哀叹。
        - id: ch02-b04
          speaker: merry_little_breeze
          text: 别担心啦。彼得那么机灵，自己照顾得了自己。他很快就会回来。你看，那边跑来的不就是他吗？
    - id: ch03
      title: 没有腿的陌生客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得太太顺着小风儿望去的方向一看，果然看见了彼得。他直奔老蔷薇丛，跑得飞快，像是在让大家瞧瞧他究竟能跑多快。彼得太太吓得心里猛地一跳。她猜，一定是雷迪狐狸、狐狸奶奶，或是郊狼老先生正在后面追他。可不管她怎样仔细张望，也看不到有什么东西会让彼得这样拼命奔跑。
        - id: ch03-b02
          speaker: narrator
          text: 没过多久，彼得就跑到她身边。他瞪大了眼睛，显然有个要紧消息憋着，急得非说出来不可。
        - id: ch03-b03
          speaker: mrs_peter
          text: 彼得，究竟出什么事了？快告诉我！你是不是又差一点儿没逃回来？
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: 彼得一边点头，一边喘得上气不接下气。
        - id: ch03-b05
          speaker: peter_rabbit
          text: 绿森林里又来了一个陌生客！那家伙看起来太可怕了，没有腿，没有脑袋，也没有尾巴。他差一点儿就抓住我了！
          emotion: fearful
