audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: wise, knowing, and a little pompous
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    breeze_1:
      display_name: First Merry Little Breeze
      tts:
        delivery: eager, polite, and full of curiosity
        timbre: light and airy
        pace: quick
        pitch: high
    breeze_2:
      display_name: Second Merry Little Breeze
      tts:
        delivery: bright, excited, and playful
        timbre: soft and breezy
        pace: quick
        pitch: high
    breeze_3:
      display_name: Third Merry Little Breeze
      tts:
        delivery: cheerful, lively, and attentive
        timbre: clear and airy
        pace: quick
        pitch: medium-high
    breeze_4:
      display_name: Fourth Merry Little Breeze
      tts:
        delivery: animated, friendly, and curious
        timbre: light and clear
        pace: brisk
        pitch: medium-high
    stranger:
      display_name: Stranger from the North
      tts:
        delivery: gruff, brief, and matter-of-fact
        timbre: rough and sturdy
