audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    prickly_porky:
      display_name: 豪猪刺毛
      tts:
        delivery: 随和直率，带着贪吃而自得的幽默
        timbre: 粗厚温暖
        pace: 稍慢
        pitch: 中低音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 爽朗顽皮，笑声里满是看热闹的兴奋
        timbre: 明亮结实
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十八章　患难见真情
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 最真最好的友情，要经过患难才看得分明。
        - id: ch01-b02
          speaker: narrator
          text: 一个人没遇上麻烦，很难知道谁是自己最好的朋友。日子好过时，到处看不见一点麻烦，身边好像有数不清的朋友。可麻烦一来，不少人就像被变戏法变走似的，转眼不见了。最后留下的往往只有几个，甚至只剩很少几个。这些肯留下来的，才是真正值得信赖的朋友。他们比其他人加起来都可贵。
        - id: ch01-b03
          speaker: narrator
          text: 要是你真心把谁当朋友，不管出了什么事，你都会守在他身边，帮他一把。从这个道理说，有时候碰上一回麻烦，几乎也算值得，因为你会看清谁才是真朋友。
        - id: ch01-b04
          speaker: narrator
          text: 彼得兔就看清了几位最真心的朋友。他自己不留神，落进了老狐狸奶奶手里。彼得这一生也遇过不少险，受过不少可怕的惊吓，可从没有哪一回像现在这样无助，这样绝望。两只黑爪把他牢牢按住，尖牙咬着他后颈那块松皮。他只能使出全身力气蹬腿，可一点用也没有。奶奶早有防备，小心躲开了他那双有力的后腿，根本不给他踢中的机会。
        - id: ch01-b05
          speaker: narrator
          text: 老狐狸奶奶不知多少次想抓彼得，每一次，都让更机灵的彼得逃了。彼得不光逃得掉，还总拿她取笑，冲着她哈哈大笑。现在终于轮到奶奶笑了，怪只怪彼得这回又粗心又犯傻。
        - id: ch01-b06
          speaker: narrator
          text: 方才，那个怪东西从豪猪刺毛的山坡上滚下来，直冲老狐狸奶奶。彼得认定她已经吓破了胆，既然逃了，就绝不会再回来，所以一心只顾笑她受惊的样子。等彼得自己突然吓得尖叫，比利大叔赶紧蹿向最近的树，吉米也一闪身，躲到了大树桩后面。事情来得太快，他们还没明白究竟出了什么事。
        - id: ch01-b07
          speaker: narrator
          text: 豪猪刺毛却连一步也没有逃。有人说他笨，可奶奶抓住彼得时，他正好看着那边，马上就明白了。那双平日有些迟钝的眼睛里，忽然闪过一点怒火。这一回，他一生中难得地飞快动了起来。外衣里藏着的一千根小长矛一下全竖了起来，他凶猛地朝奶奶冲过去。
        - id: ch01-b08
          speaker: prickly_porky
          text: 快把他放开！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 老狐狸奶奶只凶狠地低吼一声，拖着彼得慢慢后退。她始终拿彼得挡在自己和豪猪刺毛中间。
        - id: ch01-b10
          speaker: narrator
          text: 这时，臭鼬吉米已经完全回过神来。要知道，他谁也不怕，什么也不怕。他从树桩后跳出来，脸上还带着一点惭色，然后一步步逼向老狐狸奶奶。
        - id: ch01-b11
          speaker: jimmy_skunk
          text: 赶快放了彼得兔！
        - id: ch01-b12
          speaker: narrator
          text: 吉米敢这么威胁她，是因为他随身带着一个小香袋。那里面的“香水”厉害极了，除了吉米，谁闻到都会恶心。奶奶很清楚这一点。她犹豫了一会儿，又想到吉米要是真用上香水，彼得也会跟着受罪。她料定吉米不敢用，就继续拖着彼得后退。
        - id: ch01-b13
          speaker: narrator
          text: 接着，负鼠比利大叔也来帮忙了。他明知真打起来，老狐狸奶奶的本事远胜过自己，却还是做了大家当中最勇敢的事。他悄悄溜下那棵让自己躲过危险的树，绕到奶奶身后，狠狠咬住她的一只脚后跟。
        - id: ch01-b14
          speaker: narrator
          text: 奶奶只好松开彼得，转身去咬比利大叔。机会来了。彼得从她的爪下滑出去，一眨眼就躲到了豪猪刺毛身后。
