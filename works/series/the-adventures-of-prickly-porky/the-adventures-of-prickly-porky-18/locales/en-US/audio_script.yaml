audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    prickly_porky:
      display_name: Prickly Porky
      tts:
        delivery: quiet and plainspoken, turning firm when a friend is threatened
        timbre: deep and rough-edged
        pace: slow
        pitch: low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and self-assured, with a bold edge when challenged
        timbre: smooth and sturdy
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: A FRIEND IN NEED IS A FRIEND INDEED
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The truest and best friendship is the kind that can stand the test of trouble.
        - id: ch01-b02
          speaker: narrator
          text: You never really know who your best friends are until trouble finds you. When everything is pleasant and safe, you may seem to have ever so many friends. But once trouble comes, those seeming friends often vanish as if by magic. Only a few may stay behind. Those few are your real friends, and they are worth more than all the rest put together.
        - id: ch01-b03
          speaker: narrator
          text: If you are a true friend, remember to stand beside your friend and help, whatever happens. Sometimes getting into trouble is almost worthwhile, because then you discover who your real friends are.
    - id: ch02
      title: Peter in Granny Fox's Paws
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Peter Rabbit discovered some of his truest friends after his own carelessness let old Granny Fox catch him. Peter had faced many tight spots and terrible scares, but he had never felt so helpless or hopeless. Granny's black paws held him down, and her sharp teeth gripped the loose skin at the back of his neck.
        - id: ch02-b02
          speaker: narrator
          text: Peter kicked as hard as he could. It did no good at all. Granny was careful to stay clear of his strong hind legs.
        - id: ch02-b03
          speaker: narrator
          text: Granny Fox had tried many times to catch Peter. Until now, he had always been too clever for her. He would escape, make fun of her, and laugh. This time Granny was the one who could laugh, all because Peter had acted foolishly and stopped being careful.
        - id: ch02-b04
          speaker: narrator
          text: Peter had been certain that Granny would not come back. That strange creature rolling down Prickly Porky's hill had frightened her so badly that she had run away. Peter had been enjoying her fright instead of watching for danger.
        - id: ch02-b05
          speaker: narrator
          text: When Peter screamed, Unc' Billy Possum raced up the nearest tree. Jimmy Skunk ducked behind a big stump. Everything had happened so suddenly that neither one understood what was wrong.
    - id: ch03
      title: Prickly Porky and Jimmy Stand Firm
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Prickly Porky did not run. Some people might call him stupid, but he had been watching Peter when Granny caught him. He knew exactly what had happened. Anger flashed in his usually dull eyes, and for once Prickly Porky moved fast.
        - id: ch03-b02
          speaker: narrator
          text: The thousand little spears hidden in his coat sprang upright. Then Prickly Porky rushed fiercely toward Granny Fox.
        - id: ch03-b03
          speaker: prickly_porky
          text: Let Peter go!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: Granny only snarled. She backed away and dragged Peter with her, keeping his body between herself and Prickly Porky.
        - id: ch03-b05
          speaker: narrator
          text: By then, Jimmy Skunk had recovered from the surprise. Jimmy was not afraid of anyone or anything. He came out from behind the stump looking just a little ashamed, and he marched toward Granny Fox.
        - id: ch03-b06
          speaker: jimmy_skunk
          text: Put Peter Rabbit down right now!
        - id: ch03-b07
          speaker: narrator
          text: Jimmy made the warning sound very serious. There was a reason he feared nobody. He always carried a small bag of powerful perfume. It made everyone but Jimmy feel sick, and Granny Fox knew all about it.
        - id: ch03-b08
          speaker: narrator
          text: Granny paused for just a moment. Then she decided Jimmy would not use that perfume. Peter would suffer from it just as much as she would. So Granny continued backing away with Peter in her grip.
    - id: ch04
      title: Unc' Billy's Brave Deed
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Now Unc' Billy Possum joined in, and what he did was bravest of all. He knew Granny Fox was much stronger than he was in a fight. Even so, he climbed down from the tree where he had gone for safety.
        - id: ch04-b02
          speaker: narrator
          text: Unc' Billy crept around behind Granny and gave one of her heels a sharp bite. Granny released Peter so she could turn and snap at Unc' Billy.
        - id: ch04-b03
          speaker: narrator
          text: That was Peter's chance. He wriggled free from beneath Granny's paws, and in a flash he was behind Prickly Porky.
