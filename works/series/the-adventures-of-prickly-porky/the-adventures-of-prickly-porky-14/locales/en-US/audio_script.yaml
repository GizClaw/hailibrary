audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy:
      display_name: Reddy Fox
      tts:
        delivery: boastful on the surface but quick to worry
        timbre: sharp and youthful
        pace: brisk
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: loud, gleeful, and sharply teasing
        timbre: bright and piercing
        pace: quick
        pitch: high
    chatterer:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: lively, blunt, and taunting
        timbre: crisp and chattering
        pace: rapid
        pitch: high
    tommy_tit:
      display_name: Tommy Tit
      tts:
        delivery: light, musical, and mischievous
        timbre: small and clear
        pace: lively
        pitch: high
    bumble_bee:
      display_name: Bumble Bee
      tts:
        delivery: droning, playful, and teasing
        timbre: warm and buzzy
        pace: measured
        pitch: medium-low
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: sharp, practical, and firmly instructive
        timbre: dry and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Trying to Stay Hidden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox had never felt so uncomfortable in his life. By now, everyone in the Green Forest and on the Green Meadows knew what he had done. The news had reached the Smiling Pool and the Laughing Brook too. At the very first sight of the strange creature rolling down Prickly Porky's hill, Reddy had tucked his tail between his legs and run as fast as he could.
        - id: ch01-b02
          speaker: narrator
          text: And everyone was laughing about it. Unc' Billy Possum, Jimmy Skunk, Prickly Porky, and Peter Rabbit had watched him run. Of course, they told everyone they met. News like that travels fast.
        - id: ch01-b03
          speaker: narrator
          text: It might not have been quite so bad if Reddy had not bragged first. He had promised to wait for the strange creature and find out what it was. Instead, he had run just as Peter Rabbit had, and he had been every bit as frightened.
        - id: ch01-b04
          speaker: narrator
          text: Now Reddy was hungry and searching for something to eat, but he crept along as quietly as he could. He wanted no one to see him. Most days, he was proud of his handsome red coat. Today he wished he could take it off. Bright-colored clothes make hiding very hard.
    - id: ch02
      title: Sharp Eyes and Sharp Words
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Reddy was creeping toward Mrs. Grouse and her young family when Sammy Jay's sharp eyes spotted him. Sammy flew straight over and began screaming as loudly as he could.
        - id: ch02-b02
          speaker: sammy_jay
          text: Reddy Fox is brave when danger isn't near. But when danger comes, alas, alack, he runs away in fear!
        - id: ch02-b03
          speaker: narrator
          text: Reddy looked up and snarled at Sammy. There was no chance of surprising Mrs. Grouse's family now, so he turned and hurried off. He wanted to get away from Sammy's sharp eyes.
        - id: ch02-b04
          speaker: narrator
          text: He had not gone far when another sharp voice called after him. It belonged to Chatterer the Red Squirrel.
        - id: ch02-b05
          speaker: chatterer
          text: Coward! Coward! Coward!
    - id: ch03
      title: No Peace Anywhere
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As soon as Reddy escaped Chatterer's sight, he heard another voice repeating a little song. This time it was Tommy Tit the Chickadee.
        - id: ch03-b02
          speaker: tommy_tit
          text: Dee, dee, dee! Oh, me, me! Some folks talk so very brave, and then such cowards be!
        - id: ch03-b03
          speaker: narrator
          text: Reddy could not think of one thing to say back. He hurried on, looking for somewhere he could be left alone. But wherever he went, those teasing voices followed him.
        - id: ch03-b04
          speaker: narrator
          text: Even inside his own house, Reddy could not get away from them. Bumble Bee buzzed around the doorway, humming another rhyme.
        - id: ch03-b05
          speaker: bumble_bee
          text: Bumble, grumble, rumble, hum! Reddy surely knows how to run!
    - id: ch04
      title: Granny Fox Takes Charge
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Late that afternoon, old Granny Fox called Reddy outside. Anyone could see that something had made her very cross. The moment Reddy poked his head through the doorway, she spoke sharply.
        - id: ch04-b02
          speaker: granny_fox
          text: Everywhere I go, I hear that you're a coward. What is this all about?
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: Reddy hung his head in shame. He told Granny about his terrible fright. He described the strange creature that had no legs, no head, and no tail, and how it had rolled down the hill where Prickly Porky lived.
        - id: ch04-b04
          speaker: granny_fox
          text: That's what you get for boasting! How many times have I told you that boasting brings no good? I expect someone has tricked you. I've lived a good many years, and I've never heard of such a creature. If it were real, I would have seen it before now. Go back inside and stay there. You're a disgrace to the Fox family. I'm going to look around and learn what's happening. If this is a trick, they'll soon find out that old Granny Fox isn't easy to fool.
          emotion: angry
