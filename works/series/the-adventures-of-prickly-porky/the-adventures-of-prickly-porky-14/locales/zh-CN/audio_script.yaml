audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 爱吹牛又好逞强，话里总带着自以为是的神气
        timbre: 明亮尖细
        pace: 稍快
        pitch: 中高音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵张扬，取笑别人时毫不遮掩
        timbre: 清脆响亮
        pace: 稍快
        pitch: 高音
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 急促尖锐，爱把心里的话立刻喊出来
        timbre: 尖细明亮
        pace: 快
        pitch: 高音
    tommy_tit:
      display_name: 山雀汤米
      tts:
        delivery: 轻巧活泼，唱念时带着顽皮的节拍
        timbre: 细亮清脆
        pace: 稍快
        pitch: 高音
    bumble_bee:
      display_name: 大黄蜂嗡嗡
      tts:
        delivery: 慢悠悠地哼唱，取笑中带着浑厚的嗡鸣感
        timbre: 低沉圆厚
        pace: 中速
        pitch: 中低音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 精明严厉，说起道理干脆利落，带着长辈不容争辩的口气
        timbre: 苍老而尖亮
        pace: 中速
        pitch: 中高音
  chapters:
    - id: ch01
      title: 谁都知道了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雷迪狐狸这一辈子，从来没有像现在这样心里难受。他知道，绿森林、绿草地、微笑池塘四周，还有欢笑溪沿岸的每一个人，准都听说了他的丢脸事。那个怪东西刚从豪猪刺毛住的山上滚下来，他只看了一眼，就夹起尾巴，拼命逃走了。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪一点儿也没猜错。大家确实都知道，也都在笑话他。负鼠比利大叔、臭鼬吉米、豪猪刺毛和彼得兔亲眼看着他逃跑。他们见到谁，就把这件事讲给谁听。这样的消息，当然传得飞快。
        - id: ch01-b03
          speaker: narrator
          text: 要是雷迪事先没有夸口，事情还不会这么糟。他偏偏说过，自己碰见怪东西，一定会留下来查清楚。可到头来，他跟彼得兔一样转身就跑，也跟彼得当时一样害怕。
        - id: ch01-b04
          speaker: narrator
          text: 雷迪饿着肚子，偷偷摸摸地四处寻找吃的，还竭力躲着不让别人看见。平时，他最得意的就是那身漂亮的红毛。现在呢，他恨不得把红毛脱下来扔掉。身上颜色这么鲜亮，想藏起来实在太难了。
    - id: ch02
      title: 一路都是嘲笑声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪悄悄爬向松鸡太太一家，想趁他们不留神扑过去。没想到，松鸦萨米的眼睛尖得很，一下就发现了他。萨米马上飞过来，扯开嗓门唱了起来。
        - id: ch02-b02
          speaker: sammy_jay
          text: 四下无险，雷迪好勇敢；危险一来，哎呀，逃得欢！
        - id: ch02-b03
          speaker: narrator
          text: 雷迪抬头瞪着萨米，恶狠狠地低吼了一声。这么一闹，他再也别想突然扑上去，捉住松鸡太太家里的任何一个了。他只好掉头走开，想逃出萨米那双尖眼睛。
        - id: ch02-b04
          speaker: narrator
          text: 可他还没走多远，一个尖厉的声音就追了上来。原来是红松鼠喋喋。
        - id: ch02-b05
          speaker: chatterer
          text: 你这个胆小鬼！胆小鬼！胆小鬼！
        - id: ch02-b06
          speaker: narrator
          text: 雷迪刚走出喋喋的视线，又听见山雀汤米一遍遍地唱着一首歌。
        - id: ch02-b07
          speaker: tommy_tit
          text: 嘀，嘀，嘀！羞，羞，羞！有人嘴上逞英雄，遇上危险胆就丢。
        - id: ch02-b08
          speaker: narrator
          text: 雷迪一句回敬的话也想不出来，只能接着赶路。他盼着能找到一个安静地方，再也没人来打扰。可是无论走到哪里，讥笑声都不肯放过他。
        - id: ch02-b09
          speaker: narrator
          text: 就连钻回自己家里也没有用。大黄蜂嗡嗡正在门口飞来飞去，嘴里还哼个不停。
        - id: ch02-b10
          speaker: bumble_bee
          text: 嗡嗡，轰轰，哼哼哼！雷迪逃跑快如风！
    - id: ch03
      title: 奶奶要查个明白
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那天下午很晚的时候，老狐狸奶奶把雷迪叫了出来。只看她的脸色就知道，她正在为什么事大为光火。雷迪刚从门口探出脑袋，奶奶便厉声问他。
        - id: ch03-b02
          speaker: granny_fox
          text: 我走到哪儿，都听见别人说你是个胆小鬼。这到底是怎么回事？
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 雷迪低着头，满脸羞愧。他把那场可怕的惊吓告诉了奶奶，又从头说起那个怪东西。它没有腿，没有脑袋，也没有尾巴，就这样从豪猪刺毛住的山上滚了下来。
        - id: ch03-b04
          speaker: granny_fox
          text: 谁叫你吹牛，活该！我告诉过你多少遍，吹牛绝不会有好结果？八成是谁在捉弄你。我活了这么多年，从没听说过这样的东西。真要有，我早就该见过了。
          emotion: angry
        - id: ch03-b05
          speaker: granny_fox
          text: 你给我回屋待着去。狐狸一家的脸都叫你丢尽了。我要到四周看看，查清楚究竟发生了什么。要真是有人耍花招，他们很快就会知道，老狐狸奶奶可没那么容易上当。
          emotion: angry
