audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 活泼淘气，说话快而直接，遇险时惊慌失措
        timbre: 清脆稚嫩
        pace: 偏快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 爽朗顽皮，笑声里满是看热闹的兴奋
        timbre: 明亮结实
        pace: 轻快
        pitch: 中音
    mrs_peter:
      display_name: 彼得太太
      tts:
        delivery: 温柔细致，担忧时语气急切，却仍带着亲切和关怀
        timbre: 柔和清亮
        pace: 中速，焦急时稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十九章　臭鼬吉米给彼得太太报信
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶追上来时，豪猪刺毛正护在彼得兔身前，一千根尖刺齐刷刷地对着她。她气得简直成了世上最凶的老狐狸，却不敢去碰刺毛。那些带倒钩的尖刺扎进皮肉是什么滋味，她心里再清楚不过。
        - id: ch01-b02
          speaker: narrator
          text: 明明已经抓住彼得，竟然又让他逃了，这可把奶奶气坏了。她本来就没什么好脾气，现在更忍不住啦。两只后脚把泥土和落叶刨得到处都是，嘴里还不停地骂，把能想到的坏话全丢给了刺毛、吉米和比利大叔。那双黄眼睛凶光直闪，像是要迸出火星。彼得只看一眼，就吓得发抖。
        - id: ch01-b03
          speaker: narrator
          text: 刚才，正是负鼠比利大叔从背后咬住奶奶的脚后跟，才让她松开了彼得。现在，比利大叔躲在树上的安全地方，低头咧嘴笑着。臭鼬吉米也站在一旁，笑得更叫人生气。奶奶却不敢招惹他，因为她一点也不想领教吉米小香袋里的“香水”。
        - id: ch01-b04
          speaker: narrator
          text: 奶奶一直骂到没话可说，临走又撂下许多狠话，这才往家走。比利大叔看见她一瘸一拐的，被咬过的那只脚不太听使唤，心里竟有那么一点过意不去。
        - id: ch01-b05
          speaker: narrator
          text: 等奶奶走远，大伙儿马上围过来检查彼得的伤。他们从头看到脚，发现这场苦头没有伤他太重。他浑身发僵，腿脚也疼，后颈被咬过的地方尤其难受。不过歇上一两天，他就会恢复原样。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 我现在一定得回家。彼得太太见我一直不回去，肯定以为我出了事，都快要担心死了。
        - id: ch01-b07
          speaker: narrator
          text: 彼得的声音很虚弱。吉米一听，立刻拦住了他。
        - id: ch01-b08
          speaker: jimmy_skunk
          text: 不行，你哪儿也不能去！你得留在这里，我们好照顾你。现在回老荆棘丛太危险了。要是路上遇到老郊狼、赤狐雷迪，或者沼泽鹰白尾，你跑不快，怎么逃得掉？
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 我替你下山去告诉彼得太太。你呢，就去那个树桩后面的老屋里好好歇着。刚才我就藏在那儿。
        - id: ch01-b10
          speaker: narrator
          text: 彼得还想争辩，坚持要回家，可大家谁也不答应。吉米索性转身出发，往亲爱的老荆棘丛去了。这一下，彼得只好留下。
        - id: ch01-b11
          speaker: narrator
          text: 吉米赶到老荆棘丛时，看见娇小的彼得太太正焦急地望着绿森林。她一直盼着那边能出现彼得的身影。一看见吉米，她就叫了起来。
        - id: ch01-b12
          speaker: mrs_peter
          text: 哎呀，你一定是来报坏消息的！快告诉我，彼得到底怎么了？
          emotion: fearful
        - id: ch01-b13
          speaker: jimmy_skunk
          text: 彼得没出什么大事。
        - id: ch01-b14
          speaker: narrator
          text: 吉米马上这样回答。接着，他用特别滑稽的口吻讲起老狐狸奶奶。他说，奶奶头一回看见那个可怕的怪东西滚下山坡，吓得魂都快没了。后来发生的事，他也从头讲了一遍。
        - id: ch01-b15
          speaker: narrator
          text: 不过，讲到彼得怎么死里逃生，吉米说得格外轻巧，生怕彼得太太更加担心。他只告诉她，彼得要在豪猪刺毛的山坡上休息一天，第二天晚上就能回家。可彼得太太听完，还是放心不下。
        - id: ch01-b16
          speaker: mrs_peter
          text: 我求了他多少遍，叫他别到绿森林去。可他现在伤得连家也回不了，一定需要我。我这就亲自上山找他！
        - id: ch01-b17
          speaker: narrator
          text: 不论吉米怎样劝，她都不肯改变主意。最后，吉米只好答应带她去见彼得。
        - id: ch01-b18
          speaker: narrator
          text: 就这样，胆小的彼得太太跟在臭鼬吉米身后，一跳一跳地走进了自己那么害怕的绿森林。有时候，爱就是能让人变得这样勇敢。
