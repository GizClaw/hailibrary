audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and knowingly teasing
        timbre: mellow and slightly raspy
        pace: relaxed
        pitch: medium-low
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: lively, curious, and quick to react
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jimmy:
      display_name: Jimmy Skunk
      tts:
        delivery: good-natured and quietly amused
        timbre: smooth and mellow
        pace: relaxed
        pitch: medium
    mrs_peter:
      display_name: Mrs. Peter Rabbit
      tts:
        delivery: gentle and timid but firm when it matters
        timbre: soft and youthful
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Granny Fox Gives Up
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox had caught Peter Rabbit, only to find Prickly Porky standing between them with all his thousand little spears pointed straight at her. She was the angriest old fox you ever saw. Still, she knew exactly what it would mean to get one of those sharp, barbed spears in her skin, so she did not dare touch him.
        - id: ch01-b02
          speaker: narrator
          text: Just think! Granny had truly caught Peter, and then she had lost him. That was more than her temper, which was never very good, could bear. She kicked leaves and dirt into the air with her hind feet. All the while, her tongue flew as she called Prickly Porky, Jimmy Skunk, and Unc' Billy Possum every bad name she knew. Her yellow eyes flashed like sparks, and just looking at her made Peter shiver.
        - id: ch01-b03
          speaker: narrator
          text: Unc' Billy had made Granny let Peter go by slipping up behind her and biting one heel. Now he grinned down from a safe place in a tree. Jimmy stood nearby, grinning in the most provoking way. Granny could do nothing to him because she had no wish to make Jimmy use his little bag of perfume.
        - id: ch01-b04
          speaker: narrator
          text: At last Granny ran out of angry words. She made plenty of threats before starting home. Unc' Billy saw her limp on the foot he had bitten so hard, and he could not help feeling a little sorry for her.
    - id: ch02
      title: Peter Must Rest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Once Granny was gone, the others turned to Peter to see how badly he was hurt. They looked him over from end to end and found that his rough adventure had not left him much worse off. He was stiff and lame, and the back of his neck was very sore where Granny had grabbed him. Still, he should feel like himself again in a day or two.
        - id: ch02-b02
          speaker: peter
          text: I have to go home now. Mrs. Peter will know something happened, and she'll be terribly worried.
        - id: ch02-b03
          speaker: narrator
          text: Peter's voice sounded rather faint.
        - id: ch02-b04
          speaker: jimmy
          text: Oh no, you're staying right here with us. We'll take care of you. If you try to reach the Old Briar-patch now, you might meet Old Man Coyote, Reddy Fox, or Whitetail the Marshhawk. You're too sore to outrun any of them. I'll tell Mrs. Peter what happened. You can rest in the old house behind the stump where I was hiding.
        - id: ch02-b05
          speaker: narrator
          text: Peter kept saying he should go home, but no one would allow it. Jimmy ended the argument by setting off for the dear Old Briar-patch.
    - id: ch03
      title: Jimmy Brings the News
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jimmy found little Mrs. Peter watching the Green Forest anxiously and hoping to see some sign of Peter.
        - id: ch03-b02
          speaker: mrs_peter
          text: Oh, you've come with bad news! Please tell me quickly. What happened to Peter?
          emotion: fearful
        - id: ch03-b03
          speaker: jimmy
          text: Peter is all right. Nothing very serious happened to him.
        - id: ch03-b04
          speaker: narrator
          text: Then Jimmy told the story in his funniest way. He described how frightened Granny Fox had been when she first saw that terrible creature rolling down the hill, and he told Mrs. Peter everything that followed. But he made Peter's narrow escape sound like a small matter. Peter was only going to rest on Prickly Porky's hill for the day, he explained, and would come home the next night.
        - id: ch03-b05
          speaker: narrator
          text: Little Mrs. Peter still was not satisfied.
        - id: ch03-b06
          speaker: mrs_peter
          text: I've asked him again and again to stay away from the Green Forest. If he's too hurt to come home, then he needs me. I'm going straight to him!
    - id: ch04
      title: Love Makes Mrs. Peter Brave
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Nothing Jimmy said could change her mind. In the end, he agreed to lead her to Peter.
        - id: ch04-b02
          speaker: narrator
          text: So timid little Mrs. Peter Rabbit hopped along behind Jimmy Skunk. She actually went right into the Green Forest she feared so much, and that shows how brave love can sometimes make us.
