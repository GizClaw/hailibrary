audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: shrewd, friendly, and gently teasing
        timbre: warm and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: OLD GRANNY FOX LOSES HER DIGNITY
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Unc' Billy Possum had spread the news to Jimmy Skunk, Peter Rabbit, and Prickly Porky. Old Granny Fox would come at sun-up to see the strange creature that had frightened Reddy Fox at the foot of Prickly Porky's hill. How did Unc' Billy know? Well, he had guessed. He was every bit as shrewd and clever as Granny Fox. When he told her that the creature had only been seen at sun-up, she sniffed and acted as though she did not believe a word of it. That was enough to make him think she would visit the hill the very next morning.
        - id: ch01-b02
          speaker: unc_billy_possum
          text: The ol' lady thinks somebody is playing a trick, so we-uns had better be mighty careful. She is sure to come snooping around before sun-up. Everybody must stay out of sight except Brer Porky. She'll come from behind the hill, same as she did this afternoon, instead of following the holler.
        - id: ch01-b03
          speaker: narrator
          text: Unc' Billy gave that warning early in the evening, while he and his three friends put their heads together.
        - id: ch01-b04
          speaker: narrator
          text: And Unc' Billy was right. Granny Fox felt sure someone was trying to fool her, so she did not wait for jolly, round, red Mr. Sun to get out of bed. A full hour before sun-up, she reached the top of Prickly Porky's hill and sat down to wait.
        - id: ch01-b05
          speaker: narrator
          text: She could not see or hear a single suspicious thing. Unc' Billy was hidden deep in the thickest part of a hemlock tree. Peter Rabbit sat perfectly still inside a hollow log. Jimmy Skunk lay just inside the doorway of an old house under the roots of a big stump, without showing even the tip of his nose. Only Prickly Porky could be seen, and he seemed to be asleep in his favorite tree. Everything looked just as it had the hundred other times Granny Fox had been there.
        - id: ch01-b06
          speaker: narrator
          text: At last, the Jolly Little Sunbeams began dancing through the Green Forest and driving away the Black Shadows. Redeye the Vireo woke up and started singing at once, just as he always did. He did not even stop for a bite of breakfast.
        - id: ch01-b07
          speaker: narrator
          text: Prickly Porky yawned and grunted. He climbed down from the tree where he had been sitting, then walked slowly over to another tree and started up it. Suddenly, he changed his mind and began nosing through the dead leaves instead.
        - id: ch01-b08
          speaker: narrator
          text: Granny Fox stood and gave herself a long, slow stretch. She glanced at Prickly Porky with contempt. She had watched him behave in that foolish, uncertain way dozens of times before. Then she started down the hill toward the hollow at its foot. She moved slowly, keeping a sharp watch on both sides without letting it show.
        - id: ch01-b09
          speaker: narrator
          text: Now, Granny Fox could be very dignified when she chose, and that morning she certainly chose to be. She did not hurry one bit. She held her big, plumey tail just so. Not once did she look behind her. She was certain that nothing was wrong back there, and turning around would not have been dignified at all.
        - id: ch01-b10
          speaker: narrator
          text: Granny reached the bottom of the hill and went along the hollow. She smiled to herself over how easily some people could be frightened. Then her sharp ears caught a sound on the hill behind her. She spun around in a flash. For a whole minute, she could do nothing but stare. The very thing Reddy had described was rolling straight down the hill toward her.
        - id: ch01-b11
          speaker: narrator
          text: At first, Granny decided to stand her ground and discover what the thing really was. But the closer it came, the stranger and more terrible it looked. It was nothing but a huge ball covered all over with dry leaves. Even so, Granny felt certain it was alive, though she could see no head, no tail, and no legs. Closer it rolled, and stranger and more terrible it seemed.
        - id: ch01-b12
          speaker: narrator
          text: Then Granny forgot her dignity. Yes, Sir, she forgot it. In fact, she lost it altogether.
        - id: ch01-b13
          speaker: narrator
          text: Granny Fox ran just as Reddy had run!
