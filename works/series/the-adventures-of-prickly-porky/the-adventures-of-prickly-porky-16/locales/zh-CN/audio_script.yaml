audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    unc_billy:
      display_name: 负鼠比利大叔
      tts:
        delivery: 慢条斯理又爱逗趣，乡音里透着藏不住的得意
        timbre: 温厚而略带沙哑
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 比利大叔猜中了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 负鼠比利大叔给臭鼬吉米、彼得兔和豪猪刺毛送去了消息。他说，太阳一升起来，老狐狸奶奶就会到场，亲眼看看那个在山脚下吓坏雷迪狐狸的怪东西。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔怎么知道的呢？其实，他只是猜到了。论精明和心计，他可不比老狐狸奶奶差。他特意告诉奶奶，大家议论的那个怪东西只在日出时出现。奶奶听完哼哼鼻子，摆出一副根本不信的样子。可她越是这样，比利大叔越清楚，第二天一早，她准会去刺毛住的山上。
        - id: ch01-b03
          speaker: narrator
          text: 傍晚，比利大叔跟三个朋友凑在一起，脑袋挨着脑袋，商量起明早的事。
        - id: ch01-b04
          speaker: unc_billy
          text: 那位老太太已经起了疑心，觉得这里头有花样，咱们可得加倍小心。天还没亮，她准会先来四处探看。除了刺毛老弟，咱们都得藏起来。她还会照今天下午那样走，不从山脚下的洼地过，而是绕到山后头来。
    - id: ch02
      title: 日出以前
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔果然猜得一点儿不错。老狐狸奶奶认定有人在捣鬼，没等那位快活、圆滚滚、红彤彤的太阳先生起床，她就到了豪猪刺毛住的山顶。离日出还有整整一个钟头，她坐下来等着。
        - id: ch02-b02
          speaker: narrator
          text: 周围听不见可疑的声音，也看不见可疑的东西。比利大叔坐在铁杉枝叶最密的地方，身子藏得严严实实。彼得兔躲进一截空心木头，一动也不动。臭鼬吉米伏在大树桩根底下一处旧窝的门口里边，连鼻尖都没有露出来。
        - id: ch02-b03
          speaker: narrator
          text: 只有豪猪刺毛还在外面。他待在自己最喜欢的那棵树上，看起来像在睡觉。一切都和平常一样，老狐狸奶奶从前已经见过上百次了。
        - id: ch02-b04
          speaker: narrator
          text: 终于，快活的小阳光钻进绿森林，跳着舞赶走了一道道黑影。红眼莺雀醒来，马上照老习惯唱起歌，连一口早饭也顾不上吃。豪猪刺毛先打个哈欠，又哼哼几声，然后从树上爬了下来。
        - id: ch02-b05
          speaker: narrator
          text: 刺毛慢吞吞地走到另一棵树前，刚要往上爬，又改变了主意，回头去翻枯叶。老狐狸奶奶站起来，缓缓伸了个懒腰，还轻蔑地瞥了他一眼。刺毛这种又呆又拿不定主意的样子，她早就见过几十回了。
        - id: ch02-b06
          speaker: narrator
          text: 她慢慢走下山，来到山脚下的洼地。一路上，她暗暗留心着两边，却不让谁看出自己正在戒备。
    - id: ch03
      title: 体面十足的狐狸奶奶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老狐狸奶奶想摆出庄重体面的派头，那可一点儿也不难。这会儿，她不慌不忙地走着，把蓬松的大尾巴端端正正地翘好。她一下也没回头，因为她相信身后没有反常的事。再说，回头张望多不体面呀。
        - id: ch03-b02
          speaker: narrator
          text: 到了山脚，她顺着洼地往前走，心里还暗笑有些人怎么那么容易受惊。忽然，她灵敏的耳朵听见身后的山上传来一阵声响。她猛地转过身去，接着就愣住了。有那么一会儿，她除了瞪大眼睛，什么也做不了。
        - id: ch03-b03
          speaker: narrator
          text: 山坡上，正有一个东西骨碌碌地往下滚，直奔她而来。那就是雷迪告诉过她的怪东西。
    - id: ch04
      title: 奶奶拔腿就跑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一开始，老狐狸奶奶决定站在原地，说什么也要看清那究竟是什么。可那东西越滚越近，模样也越来越古怪，越来越吓人。
        - id: ch04-b02
          speaker: narrator
          text: 那不过是个裹满枯叶的大圆球，既没有看得见的脑袋，也没有看得见的尾巴和腿。可不知为什么，老狐狸奶奶偏偏确信它是活的。它离她越近，她就越觉得古怪，越觉得可怕。
        - id: ch04-b03
          speaker: narrator
          text: 这下，奶奶把自己的体面忘得干干净净。没错，她不只是忘了，简直把体面全都丢光啦。老狐狸奶奶像雷迪那样，拔腿就跑！
