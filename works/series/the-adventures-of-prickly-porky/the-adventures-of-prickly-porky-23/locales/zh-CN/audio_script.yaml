audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    buster_bear:
      display_name: 大熊巴斯特
      tts:
        delivery: 豪爽沉稳，笑起来浑厚响亮，说话直截了当
        timbre: 深厚宽广
        pace: 从容
        pitch: 低音
    prickly_porky:
      display_name: 豪猪刺毛
      tts:
        delivery: 随和直率，带着贪吃而自得的幽默
        timbre: 粗厚温暖
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 老郊狼只顾逃命
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这时候，老郊狼哪里还顾得上肚子饿不饿。他只想着自己的腿，巴不得它们跑得越快越好。他刚才爬到半山腰，一眼看见那个没头、没尾巴、也没腿的可怕东西朝自己滚来，只来得及瞧清一眼，就拼命冲向山脚。
        - id: ch01-b02
          speaker: narrator
          text: 可是，飞快地往山下跑，实在不是个好主意。是的，先生，真不是。人一旦跑起来，再想一下子停住可不容易，而且很可能绊到自己的脚趾。
        - id: ch01-b03
          speaker: narrator
          text: 老郊狼偏偏就绊着了。他整个儿翻了个跟头，模样实在别提多滑稽。躲着看热闹的小淘气们憋得好辛苦，才没当场笑出声。远处的老狐狸奶奶和赤狐雷迪却笑了起来。
        - id: ch01-b04
          speaker: narrator
          text: 自从老郊狼搬来绿草地，他们俩跟他就不大对付。他俩头一次看见那个怪东西时，也吓得够呛。如今轮到老郊狼害怕，他们当然觉得痛快。
        - id: ch01-b05
          speaker: narrator
          text: 可老郊狼没有因为一个跟头停下。哎呀，当然没有！他顺势一滚，四只脚重新落地，跑得反而更快了。
        - id: ch01-b06
          speaker: narrator
          text: 像彼得兔那样，不用回头就能看见身后动静的人可没几个。老郊狼也做不到。他一路扭头盯着后面，根本没看前方，结果砰的一下，撞上了谁呢？正是大熊巴斯特。
        - id: ch01-b07
          speaker: narrator
          text: 谁也不知道巴斯特从哪里冒出来的，可他就站在那里，块头大得很。老郊狼一头撞上去，巴斯特恼火地低吼一声，猛地转身，举起一只大巴掌，要教训那个差点把自己撞翻的家伙。
        - id: ch01-b08
          speaker: narrator
          text: 老郊狼吓得尖叫起来，跑得比刚才还快。等巴斯特认出撞他的是谁，老郊狼已经逃出老远，巴掌再也够不着了。可他还在不停地跑。
    - id: ch02
      title: 巴斯特认出了怪东西
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 巴斯特这才看见，那个吓跑老郊狼的怪东西正从山上滚下来。比利大叔、臭鼬吉米、冠蓝鸦萨米、彼得兔和彼得太太都藏在安全的地方，等着看巴斯特会不会也逃跑。要是连他都跑了，那可真是好得不像真的。
        - id: ch02-b02
          speaker: narrator
          text: 然而，巴斯特没有跑。他看看滚下来的怪东西，又看看还在逃命的老郊狼，一双精明的小眼睛慢慢亮了起来。随后，他放声大笑。
        - id: ch02-b03
          speaker: buster_bear
          text: 哈，哈，哈！呵，呵，呵！刺毛，我认出来啦！你又在耍从前那套把戏！
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: 巴斯特喊话的时候，怪东西从他身边滚过去，差点压到他的脚趾，最后撞上山脚的一棵小树，停住了。
        - id: ch02-b05
          speaker: narrator
          text: 老郊狼听见喊声，猛地收住脚步，转过身来。他倒要看看，这究竟是怎么回事。只见那个怪东西慢慢舒展开身子，又翻了过来。现在，脑袋有了，尾巴有了，四条腿也全有了。
        - id: ch02-b06
          speaker: narrator
          text: 原来，那就是豪猪刺毛！一点儿也错不了。不过他看上去还是怪模怪样的。浑身的枯叶都粘在大衣里藏着的上千根小尖矛上。刺毛咧开嘴，笑了。
        - id: ch02-b07
          speaker: prickly_porky
          text: 巴斯特，你以前在大森林见过我这么滚下山，也不能就这样把我的把戏说破呀。
        - id: ch02-b08
          speaker: buster_bear
          text: 我看早就该说破了。这里的人又不了解你，再不告诉他们，你说不定真会把谁活活吓死。
    - id: ch03
      title: 刺毛在绿森林安了家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大家这才从各自的藏身处走出来。他们一边笑，一边七嘴八舌地告诉巴斯特，刚才怎样捉弄了老郊狼。这场玩笑原来是从彼得受惊开始的。那天，彼得正巧经过，刺毛也正巧为了好玩，从山上滚下来。
        - id: ch03-b02
          speaker: narrator
          text: 老郊狼呢？他气得咬牙切齿，悄悄溜走了。许多人都和他一样，喜欢看别人闹笑话，可玩笑一旦落在自己身上，就怎么也受不了。
        - id: ch03-b03
          speaker: narrator
          text: 从此，豪猪刺毛就在绿森林安下家，成了林中小居民的一员。老郊狼当年也是个外来客，后来同样在绿草地站稳了脚跟。
        - id: ch03-b04
          speaker: narrator
          text: 至于老郊狼是怎样来到绿草地，又在绿草地和绿森林经历了哪些冒险，下一本书里，你就会读到了。
