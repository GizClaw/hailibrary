  chapters:
    - id: ch01
      title: Down the Hill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Man Coyote was not thinking about his stomach now. He was thinking about his legs and how fast they could carry him. Halfway up the hill, he had seen that terrible creature rolling straight at him, with no head, tail, or legs. He stopped just long enough for one good look. Then he raced toward the bottom as fast as he could go.
        - id: ch01-b02
          speaker: narrator
          text: Running fast downhill is a very bad plan. Yes, Sir, a very bad plan. Once you get started, stopping is not easy. And you just might stub your toes.
        - id: ch01-b03
          speaker: narrator
          text: That was exactly what Old Man Coyote did. He caught his toes and went head over heels. He looked so funny that the little scamps watching could hardly keep from shouting. Old Granny Fox and Reddy Fox were watching from a safe distance, and they did laugh. They had not been friendly with Old Man Coyote since he came to the Green Meadows. Besides, that strange creature had badly frightened them too, so they were delighted to see him frightened.
        - id: ch01-b04
          speaker: narrator
          text: But one tumble was not enough to stop Old Man Coyote. Oh, my, no! He rolled back onto his feet and dashed away faster than ever. Very few people can look behind them without turning their heads the way Peter Rabbit can, and Old Man Coyote is not one of them. He kept trying to see what was behind him. He never saw what was ahead until he ran smack into Buster Bear.
        - id: ch01-b05
          speaker: narrator
          text: Nobody knew where Buster had come from, but there he stood, as big as life. When Old Man Coyote crashed into him, Buster gave a deep, annoyed growl. He spun around and lifted one great paw, ready to cuff whoever had nearly knocked him over. Old Man Coyote was more frightened than ever. He yelped and tore away so quickly that, by the time Buster saw who had hit him, the coyote was safely out of reach and still running.
    - id: ch02
      title: Buster Knows the Trick
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then Buster Bear noticed the strange creature rolling down the hill, the very thing that had scared Old Man Coyote. Unc' Billy Possum, Jimmy Skunk, Sammy Jay, Peter Rabbit, and Mrs. Peter watched from safe hiding places. Would Buster run too? If he did, the joke would be almost too good to be true.
        - id: ch02-b02
          speaker: narrator
          text: But Buster did not run. First he studied the strange creature tumbling downhill. Then he looked at Old Man Coyote, who was still racing away with all his might. A twinkle came into Buster's shrewd little eyes, and he began to laugh.
        - id: ch02-b03
          speaker: buster_bear
          text: Ha, ha, ha! Ho, ho, ho! Ha, ha, ho! Prickly Porky, I know this is one of your old tricks!
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: Buster shouted as the strange creature rolled past him, almost across his toes, and bumped to a stop against a small tree at the bottom of the hill.
        - id: ch02-b05
          speaker: narrator
          text: Old Man Coyote heard Buster. He stopped short and turned around to find out what Buster meant. Very slowly, the strange creature opened up and rolled over. Now it had a head, a tail, and four legs. It was Prickly Porky himself! There could be no mistake, though he still looked odd. Dead leaves covered him, caught on the thousand little spears hidden in his coat. Prickly Porky grinned.
        - id: ch02-b06
          speaker: prickly_porky
          text: You did not have to give me away, Buster Bear. You only knew because you saw me roll downhill before, back in the Great Woods where we both came from.
        - id: ch02-b07
          speaker: narrator
          text: Buster was still chuckling when he answered.
        - id: ch02-b08
          speaker: buster_bear
          text: It was about time somebody gave you away. Down here, where no one knows your trick, you might scare somebody to death!
    - id: ch03
      title: Prickly Porky Makes Himself at Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Everyone came out from hiding. They laughed and all began talking at once. They told Buster about the joke they had played on Old Man Coyote. They explained that it had begun when Peter Rabbit happened by and saw Prickly Porky rolling downhill just for fun. Peter had been terribly frightened, and that fright had given them the idea for the joke.
        - id: ch03-b02
          speaker: narrator
          text: Old Man Coyote slipped away while the others laughed. He ground his teeth in anger as he went. Like plenty of other people, he could not stand being the one a joke was played on.
        - id: ch03-b03
          speaker: narrator
          text: And so Prickly Porky made himself at home in the Green Forest. He took his place among the little people who lived there. Old Man Coyote had arrived as a stranger in much the same way, then settled down on the Green Meadows.
        - id: ch03-b04
          speaker: narrator
          text: In the next book, you can read how Old Man Coyote came to the Green Meadows, and hear about some of his adventures there and in the Green Forest.
