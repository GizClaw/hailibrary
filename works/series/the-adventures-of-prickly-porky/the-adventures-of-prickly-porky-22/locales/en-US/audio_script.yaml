audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, lively, and a little mischievous
        timbre: bright and crisp
        pace: quick
        pitch: medium-high
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: crafty, watchful, and self-assured
        timbre: dry and gravelly
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Bait
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay had barely disappeared toward the Old Orchard when Old Man Coyote set off for the Green Forest. Old Man Coyote was very sharp, and very few creatures ever fooled him. If Sammy had urged him to hurry over for a splendid chance to catch Peter Rabbit, he would have suspected a trick at once.
        - id: ch01-b02
          speaker: narrator
          text: But Sammy had known better than that. He had passed along the news as if it were nothing special. He had seen Peter on Prickly Porky's hill, and Peter seemed to be in trouble. He looked too lame to make it home to the dear Old Briar-patch. Sammy never even suggested that Old Man Coyote go there. That made the news sound true.
        - id: ch01-b03
          speaker: narrator
          text: As soon as Sammy knew Old Man Coyote could no longer see him, he turned straight toward the Green Forest. Prickly Porky, Jimmy Skunk, Unc' Billy Possum, Peter Rabbit, and Mrs. Peter were waiting on the hill. Along the way, Sammy spotted Reddy Fox and old Granny Fox lying flat behind an old log. They were some distance away, but they could see whatever happened.
        - id: ch01-b04
          speaker: sammy_jay
          text: I knew those two would show up.
        - id: ch01-b05
          speaker: narrator
          text: Sammy chuckled and flew on.
    - id: ch02
      title: The Stakeout
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When Sammy reached his friends, he told them the message had been delivered. He was positive that Old Man Coyote was already on his way, hoping to catch Peter. The friends decided that everyone but Peter must hide at once. When Old Man Coyote arrived, Peter would be the only one in sight.
        - id: ch02-b02
          speaker: narrator
          text: Unc' Billy climbed a tree. Jimmy Skunk slipped inside a hollow log. Sammy tucked himself into the thickest part of a hemlock tree. Prickly Porky hid behind a big stump at the top of the hill. Little Mrs. Peter crept into the old house between that stump's roots, her heart going pit-a-pat. Peter alone stayed where he could be seen.
        - id: ch02-b03
          speaker: narrator
          text: At last, Old Man Coyote came tiptoeing through the hollow at the foot of the hill, as quiet as a gray shadow. He noticed Peter almost as soon as Peter noticed him. The moment he did, he froze as still as stone. Peter took two steps, making his limp easy to see. It was just as Sammy had said.
        - id: ch02-b04
          speaker: old_man_coyote
          text: That good-for-nothing Jay actually told the truth this time.
        - id: ch02-b05
          speaker: narrator
          text: A hungry gleam shone in Old Man Coyote's eyes. Whenever he thought Peter was looking elsewhere, he crawled on his stomach from one tree to the next, moving a little closer each time. Whenever Peter looked his way, he lay perfectly still.
        - id: ch02-b06
          speaker: narrator
          text: Of course, Peter knew exactly what was happening. He took great care to stay within two jumps of the old house under the stump. Mrs. Peter was hidden there, wishing with all her might that she and Peter were safely back in the dear Old Briar-patch.
        - id: ch02-b07
          speaker: narrator
          text: The Green Forest was silent except for Redeye the Vireo's happy song. If Redeye knew what was going on, he gave no sign. My, how exciting it was for everyone watching!
    - id: ch03
      title: The Rolling Creature
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Old Man Coyote had crept halfway up the hill. Peter was trying to decide how much closer he could safely let him come when a sudden grunting began right behind Peter.
        - id: ch03-b02
          speaker: narrator
          text: Peter knew what that meant and jumped aside. Then the strange creature that had frightened Reddy and Granny Fox started rolling down the hill, straight at Old Man Coyote. It had no head, no tail, and no legs.
        - id: ch03-b03
          speaker: narrator
          text: Old Man Coyote took one long look. He hesitated and looked once more. Then he turned tail and raced toward the Green Meadows as fast as his long legs could carry him. Anyone could see that he was afraid. He was very much afraid.
        - id: ch03-b04
          speaker: narrator
          text: Quite suddenly, Old Man Coyote had lost his appetite.
