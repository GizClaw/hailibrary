audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 机灵张扬，取笑别人时毫不遮掩
        timbre: 清脆响亮
        pace: 稍快
        pitch: 高音
    old_man_coyote:
      display_name: 老郊狼
      tts:
        delivery: 狡猾沉着，话里藏着试探和不动声色的算计
        timbre: 低沉粗粝
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 萨米的口信生效了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米往老果园飞去，身影刚刚消失，老郊狼就动身去绿森林了。老郊狼一向精得很，能骗过他的人可不多。
        - id: ch01-b02
          speaker: narrator
          text: 要是萨米直接跑来，说绿森林里有个逮住彼得兔的好机会，老郊狼一定会觉得这是圈套。萨米早就想到了这一点。他只装作随口提起，自己在刺毛住的山上看见了彼得。彼得好像出了麻烦，腿瘸得厉害，回不了老荆棘丛。
        - id: ch01-b03
          speaker: narrator
          text: 萨米一句也没劝老郊狼过去。恰恰因为这样，老郊狼反倒相信了。他觉得，彼得的消息多半是真的。
        - id: ch01-b04
          speaker: narrator
          text: 萨米飞到老郊狼看不见的地方，马上掉头赶往绿森林，直奔刺毛住的那座山。刺毛、臭鼬吉米、负鼠比利大叔、彼得和彼得太太都在那里等他。
        - id: ch01-b05
          speaker: narrator
          text: 飞在路上，萨米还看见了赤狐雷迪和老狐狸奶奶。他们趴在不远处的一根老树干后面，身子压得扁扁的。虽然躲得远，山上的动静却逃不过他们的眼睛。
        - id: ch01-b06
          speaker: sammy_jay
          text: 我就知道，他们一定会来。
          emotion: happy
    - id: ch02
      title: 灰色的影子上山了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米飞到朋友们身边，把消息告诉了大家。口信已经送到。照他看，老郊狼肯定正在赶来的路上，满心盼着把彼得兔抓到手。
        - id: ch02-b02
          speaker: narrator
          text: 大家决定，除了彼得，所有人立刻藏好。比利大叔爬上树，吉米钻进空心树干，萨米藏进铁杉最浓密的枝叶里。刺毛躲到了山顶的大树桩后面。
        - id: ch02-b03
          speaker: narrator
          text: 彼得太太的心怦怦直跳。她轻手轻脚地钻进同一个老树桩根下的老屋。等大家都藏好，外面就只看得见彼得了。
        - id: ch02-b04
          speaker: narrator
          text: 终于，老郊狼沿着山脚下的洼地悄悄走来。他落脚没有一点声音，就像一道灰色的影子。
        - id: ch02-b05
          speaker: narrator
          text: 彼得看见了老郊狼，老郊狼也几乎同时看见了彼得。他马上停住，连根毛也不动，简直像是变成了石头。彼得向前走了两步，那条腿果然瘸得很明显，和萨米说的一模一样。
        - id: ch02-b06
          speaker: old_man_coyote
          text: 那只没用的冠蓝鸦，这回倒真说了实话。
        - id: ch02-b07
          speaker: narrator
          text: 老郊狼眼里闪起了饥饿的亮光。他以为彼得没往这边看，就伏低身子，肚皮贴着地，从一棵树爬到下一棵树。每爬一次，他都离彼得更近一点。彼得像是要转过头来，他便立刻趴好，一动也不动。
        - id: ch02-b08
          speaker: narrator
          text: 彼得当然清楚他在干什么。彼得非常小心，始终待在大树桩下的老屋附近，最多只离开两跳远。彼得太太藏在屋里，一心盼着她和彼得已经平安回到老荆棘丛。
        - id: ch02-b09
          speaker: narrator
          text: 绿森林里安静极了，只听见红眼莺雀还在唱那支快乐的歌。就算他知道这里正在上演什么，也丝毫没有表现出来。躲在周围观看的朋友们呢，一个个都紧张得不得了。
    - id: ch03
      title: 没头没尾的怪东西
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老郊狼已经爬到半山腰。彼得心里盘算着，再让他靠近多少，自己才不会有危险。就在这时，彼得身后突然响起一阵呼噜呼噜的哼声。
        - id: ch03-b02
          speaker: narrator
          text: 彼得知道这声音是什么意思，赶紧跳到一边。紧接着，那个曾把雷迪和老狐狸奶奶吓坏的怪东西滚下山来。它没头，没尾巴，也没有腿，正对着老郊狼一路滚去。
        - id: ch03-b03
          speaker: narrator
          text: 老郊狼仔细看了一眼，迟疑片刻，又看了一眼。下一刻，他掉过头，迈开两条长腿，拼命朝绿草地逃去。
        - id: ch03-b04
          speaker: narrator
          text: 谁都看得出来，老郊狼实在怕得厉害。刚才还想着彼得兔这顿美餐的他，一转眼，胃口就彻底没了。
