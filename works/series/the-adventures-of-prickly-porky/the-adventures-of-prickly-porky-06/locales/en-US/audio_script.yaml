audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: earnest, quick, and easily excited
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: confident and matter-of-fact
        timbre: smooth and grounded
        pace: measured
        pitch: medium-low
    old_mr_toad:
      display_name: Old Mr. Toad
      tts:
        delivery: solemn and thoughtful
        timbre: dry and gravelly
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: PETER HAS TO TELL HIS STORY MANY TIMES
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once you start a story, you cannot call it back. It travels on and on, and on and on. So be sure the story you repeat is a good one. Then you will be glad to have it travel, and you will never want it back. But tell a story that isn't true or nice, and the day will probably come when you wish you could call it back. By then, you can't. You see, stories are like rivers. Once they begin to run, they keep going on and on forever.
        - id: ch01-b02
          speaker: narrator
          text: Little Mrs. Peter Rabbit knew that. She had advised Peter not to tell anyone else his strange tale about the dreadful creature with no legs, no head, and no tail. He said it had chased him through the Green Forest. Peter could tell that she did not believe a word of it. He was too tired and sleepy to argue, so he settled down for a long nap.
        - id: ch01-b03
          speaker: narrator
          text: When Peter woke, he thought at once of the terrible creature he had seen in the Green Forest. The longer he thought about it, the more impossible it seemed. Now he understood why Mrs. Peter had told him not to repeat the story.
        - id: ch01-b04
          speaker: peter
          text: I won't tell another soul. Nobody will believe me. Why, I can hardly believe it myself! I'll keep my mouth shut.
        - id: ch01-b05
          speaker: narrator
          text: Unfortunately for Peter, one of Old Mother West Wind's Merry Little Breezes had heard him tell Mrs. Peter. The story was so strange, so amazing, and so hard to believe that the Breeze could not keep it to himself. He promptly repeated it to everyone he met. Before long, visitors began arriving. Each one wanted to hear the whole curious story all over again, straight from Peter himself.
        - id: ch01-b06
          speaker: narrator
          text: Peter had no choice but to repeat the story ever so many times. And with every telling, it sounded more foolish to him than it had before. He had to tell Jimmy Skunk, Johnny Chuck, Danny Meadow Mouse, Digger the Badger, Sammy Jay, Blacky the Crow, Striped Chipmunk, Happy Jack Squirrel, Bobby Coon, Unc' Billy Possum, and Old Mr. Toad.
        - id: ch01-b07
          speaker: narrator
          text: Strange as it may seem, not one of them laughed at Peter, though his story sounded very queer. They all remembered the great footprints he had once found deep in the Green Forest. Back then, everyone had laughed at him and made fun of what he said. But Peter truly had seen those tracks. Buster Bear had made them after coming down from the Great Woods to live in the Green Forest. When the truth came out, it had been Peter's turn to laugh at all of them. This new story sounded every bit as impossible, but they did not dare make the same mistake again.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: I've never heard of a creature like that, and I'm not sure I believe there is one. Still, Peter clearly saw something strange. They say the one who laughs last laughs best. I'm not giving Peter another chance to laugh last and tell me he was right.
        - id: ch01-b09
          speaker: old_mr_toad
          text: That's quite true. Peter probably saw something unusual and made it sound bigger because he was excited. We need to find out whether a stranger really is in the Green Forest. Peter says it came down the hill where Prickly Porky the Porcupine lives. Prickly Porky should have seen it if such a terrible creature is up there. Jimmy Skunk, why don't you go ask him? You aren't afraid of anyone or anything.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: I will.
        - id: ch01-b11
          speaker: narrator
          text: Jimmy set off at once. Old Mr. Toad's words had flattered him. After being called fearless, Jimmy could hardly refuse. If he did, it might look as though he was afraid after all.
