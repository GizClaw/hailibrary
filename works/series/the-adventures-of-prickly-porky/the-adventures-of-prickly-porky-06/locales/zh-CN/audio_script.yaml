audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，打趣别人时轻快而不刻薄
        timbre: 清亮温和
        pace: 明快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 坦率稳当，开口时自信而不慌张
        timbre: 温厚清晰
        pace: 中速
        pitch: 中低音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 一本正经，语气老成而善于拿主意
        timbre: 低沉略带粗粝
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第六章　彼得只好把故事讲了一遍又一遍
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 故事一出口，就再也唤不回。它会一路传呀传，永远往前飞。唉，永远往前飞！
        - id: ch01-b02
          speaker: narrator
          text: 所以，要把一个故事转述给别人以前，千万得先弄清那是不是个好故事。好故事传得再远，你也只会高兴。可要是故事不真实，或者不怎么好听，总有一天，你会后悔，会想把它收回来，却再也办不到。故事就像河水，一旦流出去，便会一直流下去。小彼得太太明白这个道理。彼得告诉她，绿森林里有个可怕的怪物追赶自己。那怪物没有腿，没有脑袋，也没有尾巴。她听完便劝彼得，别再讲给别人听了。彼得马上明白，她一个字也不信。不过他又累又困，没力气争辩，只好舒舒服服地躺下来，准备美美睡上一觉。
        - id: ch01-b03
          speaker: narrator
          text: 等彼得睡醒，绿森林里的可怕怪物一下子又闯进了他的脑袋。可他翻来覆去地琢磨，只觉得那样的怪物怎么会存在呢？这样看来，彼得太太劝他闭口不提，也怪不得她。
        - id: ch01-b04
          speaker: peter_rabbit
          text: 算了，我再也不跟谁讲这件事了。讲了也没人信。老实说，连我自己心里都犯起了嘀咕。干脆闭紧嘴巴，一个字也不往外说。
        - id: ch01-b05
          speaker: narrator
          text: 可惜，西风老婆婆的一个快乐小风儿，已经听见彼得给彼得太太讲故事了。这件事实在太奇妙，太古怪，也太叫人难以相信。小风儿遇见谁，就马上讲给谁听。没过多久，客人们一个接一个找上门，都想听彼得亲口从头讲一遍。彼得只好讲了许多许多遍。更糟的是，每讲一次，他都觉得这个故事比上一次更加荒唐。
        - id: ch01-b06
          speaker: narrator
          text: 臭鼬吉米听过了，土拨鼠约翰尼听过了，草地鼠丹尼和獾迪格也听过了。接下来还有松鸦萨米、乌鸦布莱基、条纹花栗鼠、快乐杰克松鼠、浣熊博比、负鼠比利大叔和老蟾蜍先生。彼得不得不把同一个故事讲给他们每一个人听。
        - id: ch01-b07
          speaker: narrator
          text: 这故事明明离奇极了，却没有一个人嘲笑彼得。大伙儿还记得，上一次彼得说自己在绿森林深处发现了巨大的脚印，他们曾经怎样笑他，怎样拿他取乐。后来大家才知道，彼得真的看见了那些脚印。那是巴斯特熊从大森林搬来以后留下的。当时，终于轮到彼得笑话他们了。这一回，谁也不敢再笑。
        - id: ch01-b08
          speaker: jimmy_skunk
          text: 我活到现在，还没听说过这种怪物。要我相信它真的存在，也实在有点儿难。不过，彼得肯定碰见了什么怪事。不是有句老话吗？笑到最后的人，才笑得最好。我可不愿又让彼得占了上风，到最后反过来笑我们，说他早就提醒过大家。
        - id: ch01-b09
          speaker: old_mr_toad
          text: 这话很有道理。我看彼得准是撞见了什么稀奇东西，只不过一着急，越说越夸张。现在最要紧的，是查清绿森林里究竟来了没有陌生客。
        - id: ch01-b10
          speaker: old_mr_toad
          text: 彼得说，那东西是从豪猪刺毛住的山上跑下来的。应该有人去问问刺毛，看看他知道些什么。要是山上真有这样可怕的怪物，他一定见过。
        - id: ch01-b11
          speaker: old_mr_toad
          text: 吉米，不如由你上山问问刺毛吧。无论碰上谁，碰上什么东西，你反正都不怕。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: 好，我这就上山去。
        - id: ch01-b13
          speaker: narrator
          text: 吉米立刻动身了。老蟾蜍先生那句话把他捧得心里美滋滋的，他实在不好拒绝。毕竟，要是推辞，岂不是显得他终究还是害怕吗？
