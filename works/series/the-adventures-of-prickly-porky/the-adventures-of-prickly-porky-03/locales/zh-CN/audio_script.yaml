audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    stranger:
      display_name: 北方来的陌生客
      tts:
        delivery: 寡言淡定，回答简短，带着不愿停下手中事情的随意
        timbre: 粗厚沉稳
        pace: 缓慢
        pitch: 低音
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 爱吹牛又好逞强，话里总带着自以为是的神气
        timbre: 明亮尖细
        pace: 稍快
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵直率，打趣别人时轻快而不刻薄
        timbre: 清亮温和
        pace: 明快
        pitch: 中高音
    striped_chipmunk:
      display_name: 条纹花栗鼠
      tts:
        delivery: 活泼机敏，说话清脆，偶尔带一点促狭
        timbre: 轻巧清脆
        pace: 稍快
        pitch: 高音
    bowser:
      display_name: 猎犬鲍泽
      tts:
        delivery: 粗声粗气，威吓时自信凶猛，吃痛时慌乱狼狈
        timbre: 低沉洪亮
        pace: 中速
        pitch: 低音
  chapters:
    - id: ch01
      title: 大伙儿来看陌生客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快乐小风儿们很快把一个消息传遍了绿草地和绿森林。北方来了一位陌生客！草地上的小动物和森林里的居民一听，马上各找了个借口，跑到那棵大白杨旁边看他。陌生客正忙着吃东西。起初，他害羞得很，一句话也不肯说。他模样古怪，块头很大，还有一口又尖又长的牙。前来看他的客人们谁也不敢靠得太近。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪狐狸也跟着大伙儿来了。要知道，他最喜欢说大话，总要夸自己既聪明又勇敢。
        - id: ch01-b03
          speaker: reddy_fox
          text: 呸，那家伙有什么可怕的？
        - id: ch01-b04
          speaker: narrator
          text: 就在这时，陌生客开始往树下爬。雷迪却悄悄往后退了几步。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 雷迪狐狸，我看你倒像是害怕了吧？
        - id: ch01-b06
          speaker: reddy_fox
          text: 我？我才不知道什么叫害怕！
        - id: ch01-b07
          speaker: narrator
          text: 雷迪一边说，一边使劲挺起身子，恨不得让自己看上去比原来大一倍。
        - id: ch01-b08
          speaker: striped_chipmunk
          text: 咦，我怎么好像听见猎犬鲍泽来了？
    - id: ch02
      title: 鲍泽亮出大嗓门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 条纹花栗鼠说这句话的时候，其实根本没听见鲍泽。偏偏就在这时，枯叶丛里响起了沉重的脚步声。来的还真是鲍泽！除了北方来的陌生客，大伙儿顿时全跑光了。陌生客照旧不慌不忙地往下爬。鲍泽一看见他，惊讶得停住了。他从没见过这么一个又大又黑的家伙。
        - id: ch02-b02
          speaker: bowser
          text: 汪！汪！汪！
        - id: ch02-b03
          speaker: narrator
          text: 鲍泽吼出了自己最浑厚的嗓音。平时他只要这么一吼，草地和森林里的小动物早就逃走了。可陌生客连动作都没快一点。鲍泽只好站在那里，吃惊地盯着他。接着，他又发出一声最吓人的低吼。陌生客还是不理不睬。鲍泽彻底没了主意。
        - id: ch02-b04
          speaker: bowser
          text: 等着瞧吧，我非给这个家伙一点儿教训不可！我要把他甩过来，再甩过去，一直甩到他连气都喘不上来！
          emotion: angry
    - id: ch03
      title: 十二支小尖矛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时，陌生客已经来到地面，正朝另一棵树走去，只管忙自己的事。接下来，意想不到的事情发生了。鲍泽猛扑过去。你猜，这位陌生客会怎么做呢？他没有逃。他把身子紧紧蜷成一个圆球，连脑袋也缩进背心里。藏在外衣长毛下的小尖矛一下子全竖了起来。他看上去就像一颗硕大的栗子刺球。
        - id: ch03-b02
          speaker: narrator
          text: 鲍泽猛地停住脚步，又把鼻子伸过去，朝这个怪东西嗅了嗅。啪！陌生客的尾巴正抽在鲍泽的脸侧。十二支小尖矛扎在那里，就像一根根插在针垫上的针。
        - id: ch03-b03
          speaker: bowser
          text: 嗷！嗷！嗷！嗷！
        - id: ch03-b04
          speaker: narrator
          text: 鲍泽扯着嗓子惨叫起来，夹紧尾巴逃回家去。他每跳一步，就要再叫一声。陌生客这才舒展开身子，微微一笑。刚才躲起来观看的草地小动物和森林居民们，全都高兴得大声欢呼。
        - id: ch03-b05
          speaker: narrator
          text: 豪猪普里克就是这样交到了朋友。
