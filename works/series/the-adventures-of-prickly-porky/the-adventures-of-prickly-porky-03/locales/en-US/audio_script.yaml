audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: boastful and quick to challenge
        timbre: sharp and lively
        pace: brisk
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and playfully teasing
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    striped_chipmunk:
      display_name: Striped Chipmunk
      tts:
        delivery: alert and mischievously innocent
        timbre: light and clear
        pace: quick
