  chapters:
    - id: ch01
      title: PRICKLY PORKY MAKES FRIENDS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Merry Little Breezes soon carried the news all over the Green Meadows and through the Green Forest. A stranger had come down from the North. Before long, every little meadow person and forest friend found some excuse to visit the big poplar tree where he was busy eating. They all wanted a look at him, though none of them said so. The stranger was shy at first and had nothing to say. He was a queer-looking fellow, very large, with teeth that were both long and sharp. His visitors made sure to keep a safe distance.
        - id: ch01-b02
          speaker: narrator
          text: Reddy Fox came along with everyone else. Reddy loved to boast about how clever and brave he was.
        - id: ch01-b03
          speaker: reddy_fox
          text: Pooh! You don't think I'm scared of him, do you?
        - id: ch01-b04
          speaker: narrator
          text: Just then, the stranger started down the tree. Reddy stepped backward.
        - id: ch01-b05
          speaker: peter_rabbit
          text: Well, Reddy, you certainly look scared.
        - id: ch01-b06
          speaker: reddy_fox
          text: I'm not scared of anything!
        - id: ch01-b07
          speaker: narrator
          text: Reddy puffed himself up until he looked twice his real size.
        - id: ch01-b08
          speaker: striped_chipmunk
          text: Listen! Is that Bowser the Hound coming?
        - id: ch01-b09
          speaker: narrator
          text: Striped Chipmunk had not heard Bowser at all. But at that very moment, heavy feet began pattering through the dry leaves. Sure enough, there was Bowser himself. My, how everyone ran! Everyone, that is, except the stranger from the North. He kept coming down the tree as if nothing had changed. Bowser saw him and stopped in surprise. Never before had he seen a big, dark fellow quite like this one.
        - id: ch01-b10
          speaker: bowser
          text: Bow, wow, wow!
        - id: ch01-b11
          speaker: narrator
          text: Bowser's great deep voice usually sent all the little meadow people and forest folk running. Yet the stranger did not even move faster. Bowser could only stand and stare. Then he gave his deepest growl. The stranger still paid no attention. Bowser could not understand it.
        - id: ch01-b12
          speaker: bowser
          text: I'll show this fellow! I'll shake him and shake him until he has no breath left.
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: By then, the stranger had reached the ground. He started toward another tree and minded his own business. That was when something happened. Bowser rushed straight at him. But the stranger did not run. Can you guess what he did? He curled himself into a tight ball and tucked his head down into his waistcoat.
        - id: ch01-b14
          speaker: narrator
          text: As soon as he curled up, all the little spears hidden in the hair of his coat stood straight out. He looked just like a huge chestnut burr. Bowser stopped short. Then he stretched out his nose to sniff this queer thing.
        - id: ch01-b15
          speaker: narrator
          text: Slap! The stranger's tail struck Bowser right across the side of his face. A dozen little spears stayed there, sticking out like pins in a pincushion.
        - id: ch01-b16
          speaker: bowser
          text: Wow! Wow! Wow! Wow!
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: Bowser howled as loudly as he could and raced for home. His tail was between his legs, and he yelped with every jump. Then the stranger uncurled himself and smiled. All the meadow people and forest folk who had been watching cheered for joy.
        - id: ch01-b18
          speaker: narrator
          text: And that is how Prickly Porky the Porcupine made friends.
