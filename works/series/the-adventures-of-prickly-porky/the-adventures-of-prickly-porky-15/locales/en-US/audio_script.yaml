audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: easygoing and knowingly teasing
        timbre: mellow and slightly raspy
        pace: relaxed
        pitch: medium-low
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: sharp, practical, and firmly instructive
        timbre: dry and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Granny Begins to Investigate
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Investigate is a very big word, but it means something quite simple. When you investigate, you look into something and try to learn all about it. That was just what old Granny Fox began to do after Reddy told her about the terrible fright he had suffered at the hill where Prickly Porky lived.
        - id: ch01-b02
          speaker: narrator
          text: Now, as you know, Granny Fox was sly, smart, and clever. Beside her, Reddy Fox seemed almost foolish. Perhaps he would become as clever as Granny someday, but first he had a great deal to learn.
        - id: ch01-b03
          speaker: narrator
          text: If Reddy had been investigating, he would have gone straight to Prickly Porky's hill. He would have looked around and asked sly questions. Everyone he met would have known at once that Reddy was trying to discover something.
    - id: ch02
      title: A Hunt on Prickly Porky's Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Granny Fox did nothing like that. Oh, my, no! She went out to hunt for her dinner exactly as usual. She seemed to notice nothing else. With her nose close to the ground, she ran one way, then another, as though she were following a trail. She peered into hollow logs and searched beneath little piles of brush. In time, her hunt brought her to Prickly Porky's hill.
        - id: ch02-b02
          speaker: narrator
          text: Reddy had told Granny that the terrible creature rolled down the hill toward him while he stood at the bottom. Granny had heard that Peter Rabbit and Unc' Billy Possum had met it in the same way. So she did not come through the hollow below the hill. She approached from the other side.
        - id: ch02-b03
          speaker: granny_fox
          text: If anything is up there, I'll come up behind it instead of standing in its way.
        - id: ch02-b04
          speaker: narrator
          text: That was Granny's clever plan. As she came closer to Prickly Porky's home, she kept her eyes and ears wide open. All the while, she pretended that dinner was the only thing on her mind. No one would have guessed that she was thinking about anything else.
        - id: ch02-b05
          speaker: narrator
          text: Granny searched back and forth across the whole hill. She saw and heard nothing unusual except for one thing. Strange marks ran down the slope, just as if something had rolled that way. She followed them to the bottom of the hill, but there the marks vanished.
    - id: ch03
      title: Unc' Billy Has Seen It
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Later, Granny Fox trotted home along the Lone Little Path through the Green Forest. There she met Unc' Billy Possum. Well, she did not exactly meet him. Unc' Billy spotted Granny before she saw him, and he quickly climbed a tree.
        - id: ch03-b02
          speaker: unc_billy
          text: Ah reckon yo'all heard about that terrible creature. It nearly scared Reddy out of his senses early this mo'ning.
        - id: ch03-b03
          speaker: narrator
          text: Granny stopped beneath the tree and looked up at him.
        - id: ch03-b04
          speaker: granny_fox
          text: Young, innocent folks are frightened very easily, Mr. Possum. I don't believe every tale I hear. Why, I've just hunted all over Prickly Porky's hill, and I couldn't find even one Wood Mouse for my dinner. You don't truly believe such nonsense, do you, Mr. Possum?
        - id: ch03-b05
          speaker: narrator
          text: Unc' Billy covered his mouth with one hand and coughed.
        - id: ch03-b06
          speaker: unc_billy
          text: Yes, Mrs. Fox, Ah surely do believe it. Yo' see, Ah saw that thing with mah own eyes. So Ah just naturally have to believe it.
        - id: ch03-b07
          speaker: granny_fox
          text: Huh! Let me see it for myself. Then perhaps I'll believe you!
          emotion: angry
    - id: ch04
      title: A Visit at Sun-Up
      blocks:
        - id: ch04-b01
          speaker: unc_billy
          text: Sun-up is the only time yo'all can see it. Anybody passing through that hollow below Brer Porky's hill at sun-up is bound to remember what happens. Ah wouldn't go through there again. No, Sah. Once was plenty for your Unc' Billy.
        - id: ch04-b02
          speaker: granny_fox
          text: Huh!
        - id: ch04-b03
          speaker: narrator
          text: Granny snorted and trotted on.
        - id: ch04-b04
          speaker: narrator
          text: Unc' Billy watched until Granny disappeared from sight. Then a broad grin spread across his face.
        - id: ch04-b05
          speaker: unc_billy
          text: As sho' as Brer Sun rises to-morrow mo'ning, Ol' Granny Fox will be there. Ah must tell Brer Porky, Brer Skunk, and Brer Rabbit.
