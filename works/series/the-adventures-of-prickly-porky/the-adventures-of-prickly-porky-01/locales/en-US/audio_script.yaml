audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently playful storytelling
        timbre: clear and rounded
        pace: measured
        pitch: medium
    happy_jack:
      display_name: Happy Jack Squirrel
      tts:
        delivery: lively, curious, and quick-thinking
        timbre: bright and nimble
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: HAPPY JACK SQUIRREL MAKES A FIND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Happy Jack Squirrel had enjoyed a wonderful day. He had discovered some big chestnut trees he had never seen before. They promised all the nuts he could want for the coming winter. By late afternoon, he was thinking about home. He looked across the open field, because home was on the other side. That was the very field where Mr. Goshawk had nearly caught him that morning.
        - id: ch01-b02
          speaker: happy_jack
          text: Going around will take a long time, but I'd rather be safe.
        - id: ch01-b03
          speaker: narrator
          text: So Happy Jack set off on the long way around the field. There was very little his bright eyes failed to notice. As he jumped from tree to tree, he spotted something on the ground that made him curious.
        - id: ch01-b04
          speaker: happy_jack
          text: I have to stop and find out what that is.
        - id: ch01-b05
          speaker: narrator
          text: He ran down the tree, and in a few minutes he had found the strange object that had caught his eye. He looked it over. It was smooth, striped black and white, and very sharp at one end. There was even a tiny barb at the tip. Happy Jack learned just how sharp it was when it pricked him.
        - id: ch01-b06
          speaker: happy_jack
          text: Ouch!
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: He dropped the strange thing. Before long, he noticed many more of them scattered on the ground.
        - id: ch01-b08
          speaker: happy_jack
          text: What could these be? They can't grow here because they have no roots. They can't be thorns because there isn't any plant they came from. And they're not alive. So what are they?
        - id: ch01-b09
          speaker: narrator
          text: Happy Jack had bright eyes, but he did not always use them as well as he could. He was so busy studying the strange things below that he never thought to look into the treetops. If he had looked up, he might not have been so puzzled.
        - id: ch01-b10
          speaker: narrator
          text: Instead, he picked up three or four of the objects and went on his way. Soon he met Peter Rabbit and showed him what he had found. Peter was terribly curious. He could not sit still after hearing about the place, so he scampered off to see it for himself.
        - id: ch01-b11
          speaker: happy_jack
          text: Be careful, Peter! Those things are very sharp!
        - id: ch01-b12
          speaker: narrator
          text: Happy Jack shouted after him, but Peter was in his usual hurry and paid no attention. Lipperty-lipperty-lip, lipperty-lipperty-lip, he raced through the woods as fast as his long legs could carry him.
        - id: ch01-b13
          speaker: narrator
          text: All at once, Peter squealed and sat down to tend one foot. An instant later, he sprang up with an even louder squeal.
        - id: ch01-b14
          speaker: narrator
          text: Peter Rabbit had found the strange things Happy Jack had told him about. One was stuck in his foot, and another was caught in the white patch on the seat of his trousers.
