audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着轻快而略显调皮的讲故事口吻
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中音
    happy_jack:
      display_name: 快乐杰克
      tts:
        delivery: 机灵活泼，好奇时带着认真劲儿
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 中高音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 急性子，反应直接，叫嚷时夸张却自然
        timbre: 年轻清亮
        pace: 明快急促
        pitch: 中高音
  chapters:
    - id: ch01
      title: 绕远路回家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快乐杰克松鼠这一天可开心了。他找到几棵从没见过的大栗子树。树上的栗子多着呢，足够他吃过整个冬天。午后越来越晚，他也该回家了。那片田野空荡荡的，他的家偏偏就在另一头。就在当天早晨，苍鹰先生差一点儿在那里抓住他。
        - id: ch01-b02
          speaker: happy_jack
          text: 绕着田野走是远了点儿，可还是稳妥些好。
        - id: ch01-b03
          speaker: narrator
          text: 快乐杰克便绕开田野，踏上了长长的归途。他的眼睛亮得很，路上很少有东西能躲过他的目光。他从这棵树跳到那棵树，忽然看见地上有样东西，心里的好奇一下子冒了出来。
    - id: ch02
      title: 地上的怪东西
      blocks:
        - id: ch02-b01
          speaker: happy_jack
          text: 我得下去瞧瞧，那是什么呀？
        - id: ch02-b02
          speaker: narrator
          text: 他顺着树干飞快地跑下去，很快就找到了吸引他的怪东西。它摸着光滑，身上黑一道白一道，一头尖尖的，还带着小小的倒钩。快乐杰克拿手碰了碰，立刻被扎了一下，这才知道它究竟有多尖。
        - id: ch02-b03
          speaker: happy_jack
          text: 哎哟，这东西真尖！
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: 他一松手，把那东西扔在地上。再仔细一看，周围竟然还有好多根。
        - id: ch02-b05
          speaker: happy_jack
          text: 这些到底是什么？没有根，当然不是长出来的。附近也没有能长出它们的植物，所以不是刺。可它们又不是活的，那会是什么呢？
        - id: ch02-b06
          speaker: narrator
          text: 快乐杰克眼睛虽亮，有时却不会好好用。他一心只看地上，连一次也没抬头瞧瞧树梢。要是往上看一眼，他说不定马上就明白了。可这会儿，他仍旧满心困惑，只捡起三四根怪东西，继续赶路。
    - id: ch03
      title: 彼得兔也找到了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 走着走着，快乐杰克碰见了彼得兔，就把捡到的东西给他看。彼得兔最爱弄个明白，哪里还坐得住？他立刻要去看看快乐杰克说的那个地方。
        - id: ch03-b02
          speaker: happy_jack
          text: 彼得兔，当心点儿！那东西可尖啦！
        - id: ch03-b03
          speaker: narrator
          text: 可彼得还是那副急性子，根本顾不上听劝。他用两条长腿穿过树林，啪嗒啪嗒跳，啪嗒啪嗒跳，跑得飞快。忽然，他尖叫一声，一屁股坐下，抱着一只脚直揉。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 哎哟，我的脚被扎了！
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: 可才过一眨眼，他又猛地蹦起来，叫得比刚才还响。
        - id: ch03-b06
          speaker: peter_rabbit
          text: 哎哟，又有一根扎到我了！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 这下，彼得兔可找到快乐杰克说的怪东西了。一根正扎在他的脚上，另一根呢，扎进了他裤子屁股上的那块白布。
