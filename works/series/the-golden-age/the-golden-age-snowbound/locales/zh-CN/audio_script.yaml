audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 认真敏感，抱怨时直率，想象中带着谨慎
        timbre: 清亮稚嫩
        pace: 自然偏快，犹豫时放慢
        pitch: 中高
    miss_smedley:
      display_name: 斯梅德利小姐
      tts:
        delivery: 端庄克制，纠正孩子时温和而不容争辩
        timbre: 清晰稳重的成年女声
        pace: 从容匀稳
        pitch: 中
  chapters:
    - id: ch01
      title: 第十二夜以后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第十二夜一过，第二天早晨忽然变得平淡又空落。可就在昨晚，那群戴假面演戏的人还大步闯进老厨房。他们的怪衣裳一路掉雪，把红砖地撒得斑斑白白。他们跺脚，穿来穿去，高声念词，满屋都是喧闹和叫喊。
        - id: ch01-b02
          speaker: narrator
          text: 哈罗德是真的怕了，干脆一头钻进厨娘怀里。爱德华却装出男子汉的样子，好像一眼就看穿了戏法，还把那些可怕的怪客随口叫成迪克、哈里和乔。我已经大得不好意思逃跑，又被那场面里的魔法和惊奇迷住，根本舍不得走。
        - id: ch01-b03
          speaker: narrator
          text: 这些异乡人从哪儿来？他们唱着歌，整整齐齐演着戏，还把木剑撞得吓人。既然他们能来，下一个安静的夜晚又会来谁？炉灰里的栗子噼啪作响，古老的鬼故事吓得大家越靠越近。这时候，也许老梅林就会披着黑羊皮，穿一件赤褐长袍，带着弓箭，手里还提着野鹅，走进门来。
        - id: ch01-b04
          speaker: narrator
          text: 也许庄严的丹麦人奥吉尔会从仙境回来，打听那个曾经需要他的国度。也许在一个雪白的夜晚，冰雪女王会亲自驾着雪橇来到门前。铃铛叮当，驯鹿蹄声嗒嗒，雪橇忽然停在敞开的大门外。寂静的星空里，北极光像一排随从，摇动着长矛。
        - id: ch01-b05
          speaker: narrator
          text: 可这天早晨，大雪只顾不停地下，把我们全困在屋里。我正尝着热闹过去后的空虚，爱德华却完全不同。他第一次见识真正的戏剧，满脑子都是演戏，在屋里来回大步走，还操着浓重的伯克郡口音宣布自己的身份。
        - id: ch01-b06
          speaker: edward
          text: 看哪，我就是乔治三世国王！
        - id: ch01-b07
          speaker: narrator
          text: 哈罗德是最小的，早习惯了自己找乐子。他正玩“俱乐部绅士”，挽着一位看不见的老先生，稳稳当当绕屋走。他们登上看不见的台阶，进了看不见的俱乐部，翻报纸，聊闲话，像老人一样摇头，最后竟把看不见的酒杯举到了嘴边。
        - id: ch01-b08
          speaker: narrator
          text: 天知道这么沉闷的游戏怎么会钻进一个小男孩脑袋里。反正是哈罗德自己发明的，他为此得意得很。夏洛特和我蜷在窗座上，着了魔似的望着无数雪花旋转、翻卷、扑下来。它们把我们那个快活的小天地一点点裹住，到处都是同一种轮廓、同一种颜色，诡异又惨白。
    - id: ch02
      title: 仙女究竟存不存在
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 夏洛特的心情糟透了。早餐时，她同斯梅德利小姐争论，还引用最爱的《仙女故事书》，以为这下准能驳倒对方。斯梅德利小姐却温和又坚定地告诉她，世上根本没有真正的仙女。
        - id: ch02-b02
          speaker: charlotte
          text: 那么，书里的故事全是在骗人吗？
        - id: ch02-b03
          speaker: narrator
          text: 斯梅德利小姐先说，“骗人”这种字眼太不淑女，不管什么时候都不该用。
        - id: ch02-b04
          speaker: miss_smedley
          text: 亲爱的，那些故事是古人误解自然，把人的样子和感情放到了自然身上。如今我们懂得更多，不会再犯这种错了。不过，那些神话仍能教给我们许多美好的道理。
        - id: ch02-b05
          speaker: charlotte
          text: 可它们根本不存在，又怎么教人道理呢？
        - id: ch02-b06
          speaker: narrator
          text: 夏洛特不服气地离开餐桌，心里却很难过。我赶紧安慰她。
        - id: ch02-b07
          speaker: narrator
          text: 别理她。她怎么可能懂仙女？她连块石头都扔不好！
        - id: ch02-b08
          speaker: charlotte
          text: 可爱德华也说，那些故事都是胡扯。
        - id: ch02-b09
          speaker: narrator
          text: 爱德华现在一心想去当兵，什么都说是胡扯。只要一件事写进了书，它就一定是真的。事情就这么定了。
        - id: ch02-b10
          speaker: narrator
          text: 夏洛特总算好受了一点。爱德华已经按倒一条龙，嘴里呜呜响着，拼命往它身上钻洞。哈罗德神气地登上雅典娜俱乐部的假台阶，那派头其实更像小卡尔顿俱乐部。窗外大雪像羽毛一样乱飞，连高高的榆树梢都快看不见了。
        - id: ch02-b11
          speaker: charlotte
          text: 天要塌下来啦，我得赶紧去告诉国王。
        - id: ch02-b12
          speaker: narrator
          text: 这句童话里的话提醒了我，我便伸手拿《仙女故事书》，想读给她听。可斯梅德利小姐的怀疑给小仙人们蒙上了一层阴影，也把原本甜美的故事变苦了。夏洛特不想听，我只好换成亚瑟王的故事。她喜欢那些四处历险的贵妇，所以把这本书排在第二。我们男孩子却把它排在第一，因为书里有长矛在比武场上撞碎，也有骑士明知打不过还冲向强敌。
        - id: ch02-b13
          speaker: narrator
          text: 偏偏书翻到了巴林和巴兰最悲惨的那一段。我读到一个人忽然消失，接着号角响起，像野兽临死前的哀鸣。巴林说，那声号角是为他吹的，他就是猎物，可他还没有死。
        - id: ch02-b14
          speaker: narrator
          text: 夏洛特太清楚后面会发生什么，眼泪一下就出来了。我只好绝望地合上书。哈罗德从扶手椅后面钻出来，嘴里还吮着大拇指。改良俱乐部的绅士可很少这样。他瞪大眼睛看着满脸泪痕的姐姐。爱德华也不演戏了，立刻赶来安慰她。这又是他刚接下的新角色。
    - id: ch03
      title: 爱德华的快活故事
      blocks:
        - id: ch03-b01
          speaker: edward
          text: 我知道一个特别快活的故事，是伊莱扎姑妈讲的。那时候，她正在那个讨厌的外国，不知待在哪儿。
        - id: ch03-b02
          speaker: narrator
          text: 爱德华曾在迪南熬过悲惨的整整一个月，所以他一提外国就是这种口气。
        - id: ch03-b03
          speaker: edward
          text: 那儿有个家伙养了两只鹳。后来一只死了，死的是母鹳。
        - id: ch03-b04
          speaker: harold
          text: 它是得什么病死的？
        - id: ch03-b05
          speaker: edward
          text: 另一只鹳伤心得不得了，整天闷闷不乐，越来越难受。人们就找来一只鸭子，介绍给它。那是只公鸭，可鹳根本不在乎。它们俩彼此相爱，日子过得可快活了。
        - id: ch03-b06
          speaker: edward
          text: 后来又来了一只鸭子，这回真的是母鸭，而且长得特别美。公鸭一看见她就爱上了她，马上离开鹳，跑去向母鸭求婚。
        - id: ch03-b07
          speaker: edward
          text: 被丢下的鹳什么也没说。它只是一天比一天憔悴，一天比一天憔悴，一天比一天憔悴。终于有天早晨，人们发现它已经死了。不过，两只鸭子从此过上了幸福的生活！
        - id: ch03-b08
          speaker: narrator
          text: 这就是爱德华眼里的快活故事。可怜的夏洛特嘴角又垂了下去。他怎么总是看不见一件事真正要紧的地方？实在叫人生气。
        - id: ch03-b09
          speaker: narrator
          text: 他一向如此。好些年前，家里快要添一个孩子。大人知道事情发生时会忙得很，要是爱德华偏在那时提出尴尬的问题，谁也没空慢慢编出合适的答案。于是，他们事先委婉地问他，愿不愿意有个小弟弟，或者小妹妹。
        - id: ch03-b10
          speaker: narrator
          text: 爱德华把事情的方方面面仔细想了一遍，最后选了一只纽芬兰幼犬。换个领会得快些的男孩，早就顺着父母的话接下去，替他们省些力气了。他这一回答，却害得大人只好另找一个说法，把整件事从头再讲一次。
        - id: ch03-b11
          speaker: narrator
          text: 现在，夏洛特抽着鼻子转开脸。那颗劳累过度的心已经吃不消了，害她难过得打了个嗝。爱德华却像艾萨克爵士的爱犬戴蒙德一样，完全不知道自己闯了什么祸。他猛地转身，冲着哈罗德大喊。
    - id: ch04
      title: 一条活龙
      blocks:
        - id: ch04-b01
          speaker: edward
          text: 我要一条活龙。哈罗德，你就来当我的龙！
        - id: ch04-b02
          speaker: narrator
          text: 哈罗德使劲挣扎起来。
        - id: ch04-b03
          speaker: harold
          text: 你放开我行不行？我正玩别的呢。我已经加入那么多俱乐部，怎么还能去当龙？
        - id: ch04-b04
          speaker: edward
          text: 当龙多好啊！你是一条绿龙，浑身都是鳞片，尾巴卷卷的，眼睛红红的，还能喷出真正的烟和火。
        - id: ch04-b05
          speaker: narrator
          text: 哈罗德犹豫了一下，心里还舍不得蓓尔美尔的俱乐部。可下一刻，他已经趴在地上爬了。没有哪头古怪巨兽能甩出那么卷曲、那么多鳞的尾巴。俱乐部早被他丢到一千年外。他喘得吓人，喷出最浓的烟和最猛的火。
        - id: ch04-b06
          speaker: edward
          text: 现在我还需要一位公主！
        - id: ch04-b07
          speaker: narrator
          text: 爱德华兴奋地一把抓住夏洛特，又给我安排了一个角色。
        - id: ch04-b08
          speaker: edward
          text: 你来当医生。等龙把我打成重伤，你就负责把我治好！
        - id: ch04-b09
          speaker: narrator
          text: 在所有行当里，我最害怕、也最瞧不起的就是那门神圣的医术。过去喝泻药、灌药水时的种种灾难，一下全涌进脑海。夏洛特也不稀罕那个空头公主的名号，于是我们一起朝门口逃去。
    - id: ch05
      title: 午餐铃
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 爱德华马上追来。敌对的几路人马在门垫上撞成一团。那一小会儿，场面又乱又凶，倒真像亚瑟王传奇里的大战。
        - id: ch05-b02
          speaker: narrator
          text: 就在我们咬牙切齿、谁也不肯让谁的时候，午餐铃发出银亮的一声，一切立刻恢复和平。亚瑟王故事里的圣杯曾沿着一道阳光徐徐滑来，可就连它，也不可能这么快平息一群人交战的怒火，让彼此敌视的大家重新甜甜蜜蜜地和好。
