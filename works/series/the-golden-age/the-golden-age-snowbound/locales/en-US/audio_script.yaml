  chapters:
    - id: ch01
      title: After Twelfth Night
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Twelfth Night had come and gone, and the next morning felt rather empty and pointless. Only the evening before, the mummers had marched into our old kitchen. Snow shook from their wild costumes and powdered the red brick floor. They stamped and crossed, shouted their speeches, and turned the whole room into a whirl of noise.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Harold was honestly frightened and hid himself in the cook's generous bosom without a trace of shame. Edward pretended he was far too sensible to be fooled. He greeted the dreadful figures as if they were simply Dick and Harry and Joe. I was too old to run away, and too enchanted to want to. Where had these strangers come from, breaking in with songs, a formal play, and the terrible clatter of wooden swords?
        - id: ch01-b03
          speaker: narrator
          text: >-
            Once they had appeared, who could tell what might visit us on another quiet night? The chestnuts would pop in the ashes, and ghost stories would draw us close together. Then old Merlin might arrive, dressed in black sheepskins and a russet gown, carrying his bow, his arrows, and wild geese. Perhaps stately Ogier the Dane would return from Faery and ask the way to the land that once needed him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Or on some white night, the Snow Queen herself might come. We would hear sleigh bells and the quick feet of reindeer. They would stop suddenly at our open door, while high above them the Northern Lights shook their spears among the quiet stars.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But that morning the tireless snow kept us indoors, and I was feeling the dullness that follows a great excitement. Edward felt quite differently. His first taste of real Drama had gone straight to his head. He marched up and down the floor, making his grand announcement in a strong Berkshire accent.
        - id: ch01-b06
          speaker: edward
          text: >-
            Here I stand, King Gearge the Third!
        - id: ch01-b07
          speaker: narrator
          text: >-
            Harold was used to amusing himself, since the youngest child's games often had to do without anyone else's interest. That day he was playing “clubmen.” Arm in arm with an elderly gentleman no one could see, he made a stately circuit of the room. Now and then they stopped at an imaginary club, climbed invisible steps, glanced through invisible newspapers, and shook their heads over invisible scandals. I am sorry to add that they also raised invisible glasses to their lips.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Heaven knows how such a dreary game ever entered that small boy's mind. He had invented it himself and was proud of it. Charlotte and I crouched on the window seat instead. We watched countless snowflakes whirl, sweep, and drive past the glass. They were wrapping our cheerful little world in one strange, ghostly colour.
    - id: ch02
      title: Are Fairy Stories True?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Charlotte was badly out of spirits. At breakfast, during some argument or other, she had answered Miss Smedley with a fitting quotation from her favourite classic, the Fairy Book. Miss Smedley had gently but firmly told her that fairies did not really exist.
        - id: ch02-b02
          speaker: charlotte
          text: >-
            Do you mean all those stories are lies?
        - id: ch02-b03
          speaker: narrator
          text: >-
            Miss Smedley objected to using such an unladylike word for anything at all.
        - id: ch02-b04
          speaker: miss_smedley
          text: >-
            My dear, those stories began because people misunderstood nature and imagined it was human. We know better now, so we do not make the same mistakes. But the myths can still teach us many beautiful lessons.
        - id: ch02-b05
          speaker: charlotte
          text: >-
            But how can something teach you anything if it doesn't exist?
        - id: ch02-b06
          speaker: narrator
          text: >-
            Charlotte left the table defiant, though the answer had made her miserable.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Don't pay any attention to her. What could she know about fairies? She can't even throw a stone properly.
        - id: ch02-b08
          speaker: charlotte
          text: >-
            Edward says they're all nonsense too.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Edward calls everything nonsense now that he thinks he's going into the Army. If something is printed in a book, it has to be true. That settles it.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Charlotte seemed almost comforted. By then the room was quieter. Edward had knocked down his dragon and was drilling holes in it with a soft purring noise. Harold was jauntily climbing the imaginary steps of the Athenaeum, though his style looked more suited to the Junior Carlton. Beyond the window, the feathery storm nearly hid the tops of the tall elms.
        - id: ch02-b11
          speaker: charlotte
          text: >-
            The sky is falling. I must go and tell the king.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Her quotation reminded me of a fairy tale, so I reached for the book and offered to read. But doubts had cast a shadow over the Wee Folk, and Charlotte no longer wanted them. I fetched the tales of Arthur instead. Charlotte loved the wandering ladies, while we boys preferred shattered spears, crashing tournaments, and knights rushing into hopeless fights.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Even that choice went wrong. Of all the book, why did it open at the sad tale of Balin and Balan? I began to read how a figure vanished, and how a horn sounded like the death cry of a beast.
        - id: ch02-b14
          speaker: narrator
          text: >-
            “That blast is blown for me,” said Balin. “I am the prize, though I am not dead yet.”
        - id: ch02-b15
          speaker: narrator
          text: >-
            Charlotte knew the rest too well and began to cry. In despair, I shut the book. Harold appeared from behind the armchair, sucking his thumb, though gentlemen of the Reform are rarely seen doing such a thing. He stared wide-eyed at his tear-stained sister. Edward dropped his acting and hurried over to comfort her. It was a new role for him.
    - id: ch03
      title: Edward's Jolly Story
      blocks:
        - id: ch03-b01
          speaker: edward
          text: >-
            I know a splendid story. Aunt Eliza told it to me. It happened when she was somewhere over in that dreadful abroad.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Edward had once endured a black month of misery at Dinan, so that was how he spoke of foreign countries.
        - id: ch03-b03
          speaker: edward
          text: >-
            There was a fellow there who owned two storks. Then one of them died. It was the female stork.
        - id: ch03-b04
          speaker: harold
          text: >-
            What did it die from?
        - id: ch03-b05
          speaker: edward
          text: >-
            The other stork was terribly sorry. He moped about and grew more and more miserable. So the people searched around, found a duck, and introduced it to him. The duck was a drake, but the stork didn't care. They loved each other and were perfectly happy together.
        - id: ch03-b06
          speaker: edward
          text: >-
            After a while, another duck came by, and this one really was female. She was very beautiful. As soon as the drake saw her, he fell in love. He left the stork and proposed to the duck instead.
        - id: ch03-b07
          speaker: edward
          text: >-
            The poor stork never told anyone how he felt. He simply pined and pined and pined away. Then one morning they found him quite dead. But the two ducks lived happily ever after!
        - id: ch03-b08
          speaker: narrator
          text: >-
            That was Edward's idea of a jolly story. Poor Charlotte's mouth turned down again. His stupid way of missing the real point of anything was simply too annoying. He was always doing it.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Years earlier, our parents had needed to prepare him for a family event. Otherwise, at a busy moment, he might ask awkward questions that no one had time to answer properly. So they carefully asked whether he would like a little brother, or perhaps a little sister.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Edward considered every side of the matter and finally chose a Newfoundland puppy. A quicker boy would have met his parents halfway and made things easier for them. Instead, they had to begin again and approach the whole subject from another direction.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Now Charlotte turned away, sniffing. A hiccup showed how deeply upset she was. Edward had no idea what harm he had done. Like Sir Isaac Newton's dog Diamond, he was completely innocent of the trouble he had caused. He spun around toward Harold with a shout.
    - id: ch04
      title: A Live Dragon
      blocks:
        - id: ch04-b01
          speaker: edward
          text: >-
            I need a live dragon. Harold, you're going to be my dragon!
        - id: ch04-b02
          speaker: narrator
          text: >-
            Harold struggled hard to get away.
        - id: ch04-b03
          speaker: harold
          text: >-
            Let me go, will you? I'm busy with another game. How can I be a dragon when I belong to all the clubs?
        - id: ch04-b04
          speaker: edward
          text: >-
            Wouldn't you rather be a lovely green dragon covered in scales? You could have a curling tail and red eyes, and breathe real smoke and fire.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Harold hesitated for one moment. Pall Mall still had a strong hold on him. Then he was down on the floor, crawling like a beast. No ancient monster ever swung a tail as curly or as scaly as his. Clubland had vanished a thousand years into the past. He panted horribly and poured out the thickest smoke and fiercest fire.
        - id: ch04-b06
          speaker: edward
          text: >-
            Now I need a Princess!
        - id: ch04-b07
          speaker: narrator
          text: >-
            Edward seized Charlotte in delight. Then he assigned me a part too.
        - id: ch04-b08
          speaker: edward
          text: >-
            You can be the doctor. You have to cure the deadly wound the dragon gives me.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Of every possible profession, I hated and despised the sacred art of medicine most. Memories of dreadful purges and nasty draughts crowded into my mind. Charlotte had no wish for a useless title either, so together we dashed for the door.
    - id: ch05
      title: The Luncheon Bell
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Edward charged after us. The opposing forces met on the mat, and for a short time everything became tangled, wild, and thoroughly Arthurian.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Then the silver note of the luncheon bell brought instant peace, even while our teeth were still clenched against one another. The Holy Grail itself, gliding across a sunbeam, could never have quieted a riot of angry passions so quickly or brought everyone into such sweet agreement.
