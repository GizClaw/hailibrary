audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    aunt_eliza:
      display_name: 伊丽莎姑妈
      tts:
        delivery: 自信端庄，评点晚辈时郑重而不容置疑
        timbre: 成熟清晰，带着威严
        pace: 稳健从容，强调处稍慢
        pitch: 中
  chapters:
    - id: ch01
      title: 爱德华的反常举动
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁也不会想到爱德华正在恋爱。可早餐以后，他故意装得漫不经心，偏偏又装得太过了。
        - id: ch01-b02
          speaker: edward
          text: 谁爱喂，谁就去喂我的兔子。
        - id: ch01-b03
          speaker: narrator
          text: 说完，他迈着轻快的步子朝果园走去，没骗过任何人。就算王国倾覆，欧洲版图天翻地覆，我们家仍有一条不可动摇的铁律：每个男孩都得亲手喂自己的兔子。眼下自然有理由警觉。哈罗德和我一边往铁丝网里塞莴苣叶，一边认真商议起来。
        - id: ch01-b04
          speaker: narrator
          text: 若只顾自己，这件事确实与我们无关，我们也根本不大在乎。可我们同属一个团体，其中一员无论心里还是身上出了毛病，都可能带来影响深远的后果，连累其余的人。我们决定派哈罗德去探查，因为他最不容易惹人怀疑，也最不会让人觉得另有用心。
        - id: ch01-b05
          speaker: narrator
          text: 计划已经安排妥当。他先报告我们几只兔子的健康，再慢慢谈到所有兔子的习惯、风俗和恶行。随后话头一转，说到女孩子天生的缺陷，说明为什么笼统来看，她们全是讨厌鬼。最要紧的是态度圆熟。办完以后，他再回来汇报。
        - id: ch01-b06
          speaker: narrator
          text: 哈罗德兴冲冲地去了，却很快哭着回来。看来外交家的才具，他实在没有多少。
        - id: ch01-b07
          speaker: narrator
          text: 爱德华当时正在果园里来回踱步，脸上硬挂着一丝痛苦的笑，像杂耍艺人表演危险把戏时的笑容，仿佛用针别在那儿。哈罗德本来顺利地从兔子说起，接着却把一般道理和眼前的人混到了一处。
        - id: ch01-b08
          speaker: narrator
          text: 他提到爱德华那只垂耳朵的母兔。它有一双长后腿，鼻子总轻蔑地抽动，叫他每次看见都会想起萨比娜·拉金。萨比娜九岁，是附近农场主的女儿。
        - id: ch01-b09
          speaker: narrator
          text: 话到这里，爱德华猛地扑向哈罗德，拧他的胳膊，还朝短肋骨上狠狠捶了几拳。哈罗德一路拖长声音号哭着回到兔笼。他一会儿抽噎着盼望自己成为大人，好把为情所苦的哥哥踢上一顿，一会儿又后悔自己竟降生到了世上。
        - id: ch01-b10
          speaker: narrator
          text: 我的个头不够大，没法亲自跟爱德华较量，只好另想办法安慰受难者。我让哈罗德给驴车的轮子涂油。那是滋味无穷的美差，本来专门留给我。园丁家的小伙子替我保留了整整一星期，交换条件是我在新来的厨娘面前帮他说好话。
        - id: ch01-b11
          speaker: narrator
          text: 哈罗德很快又笑起来，浑身也沾满了油。至于我，想到调查已经得到一条很有分量的线索，直指祸事的源头，心里也还算满意。
    - id: ch02
      title: 教堂里的证据
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 幸好，这天正是星期日，教堂的钟已经响了。要查清爱德华的心事，眼前就有一个好机会。
        - id: ch02-b02
          speaker: narrator
          text: 做礼拜的时候，人得坐着不动，既阴沉，又没有真正有趣的事。偏偏全村最好看的人都在眼前。年轻男子的心思要轻轻飘向爱情，再没有比这更合适的时候了。平日太忙，无暇胡思乱想。在教堂里呢，除了胡思乱想，实在也没什么可做。
        - id: ch02-b03
          speaker: narrator
          text: 连祷文拖得没完没了时，还能在祈祷书的衬页上玩井字棋。可是牧师开始讲道，又能上哪里找安慰？眼睛只好从一排排人中四处游荡，自由挑选美丽的祈祷同伴。
        - id: ch02-b04
          speaker: narrator
          text: 几个月前，我就在《亚他那修信经》那场不同寻常的折磨下，让游荡的心落到了面包师的妻子身上，认定她值得我爱上一辈子。她成熟的魅力征服了我。那些穿薄纱衣服、只会咯咯笑的年轻姑娘，从没有谁办得到。她已经结婚，我也从没觉得这会妨碍自己的感情。
        - id: ch02-b05
          speaker: narrator
          text: 所以，只看爱德华在晨祷中的举止，便足以定案。更何况，我们还有一项专门的检验。我们坐在耳堂，拉金一家就在身后。爱德华只有在大家转身向东的那一小会儿，才能回头尽情看萨比娜，而且那个机会转眼就会过去。
        - id: ch02-b06
          speaker: narrator
          text: 唱《以色列颂》时，他心急地试了好几次，总想提早转身。最后，“从起初，到如今，直到永远”还没有唱完一半，他就把整个身子拧了过去。证据再清楚不过，连法庭也不可能要求更多。
        - id: ch02-b07
          speaker: narrator
          text: 事实已经确定，接下来就得正面想办法对付。整个布道期间，我都在苦苦思索。这样的态度一点也不卑鄙，更不是不顾兄弟情分。像我自己的爱情这样富于哲理，又不会同任何事情冲突，当然可以容许。爱德华那火山一般的激情却每三个月左右发作一次，总要严重耽误正事。
        - id: ch02-b08
          speaker: narrator
          text: 下星期，附近正好有马戏团来。大人严令禁止我们去，可没有爱德华帮忙，我们绝不可能成功违抗命令。来教堂的路上，我试探过他，提起了马戏团。
        - id: ch02-b09
          speaker: edward
          text: 我只要一想到小丑就恶心。
        - id: ch02-b10
          speaker: narrator
          text: 一个人病态到这个地步，已经没法更进一步了。可牧师讲完道，我还是没有想出任何可行的对策。回家路上，我心情低落。仿佛爱情的金星高踞天空，带着凶险的相冲之势。马戏团的御者座却奄奄一息地往下坠，已经危险地贴近地平线。
    - id: ch03
      title: 拉金家的星期日拜访
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 命运偏爱捉弄人。最后替我们解开困局的那位从天而降的女神，竟然是伊丽莎姑妈。
        - id: ch03-b02
          speaker: narrator
          text: 她每到星期日下午，都有个讨厌的习惯，要郑重其事地拜访附近的农场主和村舍居民。每次还要拖上一个不情不愿的男孩，一半为了礼数，一半为了拯救他的灵魂。
        - id: ch03-b03
          speaker: narrator
          text: 那天我大概为了爱德华的事动脑太久，变得迟钝而毫无戒心。等她挑选牺牲品时，其他人都欢叫着逃掉了，毫发无伤，只有我轻易落入她手里。我们的第一站，就是拉金家。
        - id: ch03-b04
          speaker: narrator
          text: 这里的礼节开得正盛，每一个动作都得恰到好处。我们走路、坐下、说话，都像伊丽莎白女王跳庄严舞步时一样高贵从容。低矮的客厅里装着橡木护壁，桌上摆出蛋糕和醋栗酒。大家郑重地寒暄恭维过后，姑妈才放低身份，同拉金太太谈起时装。
        - id: ch03-b05
          speaker: narrator
          text: 农场主和我为了这种不平常的交谈，费力得热汗直冒。一会儿说天气反复无常，一会儿谈谷价不停下跌。听见我们如此客气，谁能猜到两天以前，我们还隔着树篱互相对阵？那时我得意地挑衅、嘲笑，他涨红了脸，气得甩响鞭子，一阵阵骂出粗话。礼节真是无所不胜。
        - id: ch03-b06
          speaker: narrator
          text: 萨比娜端端正正地坐在一旁，膝上放着《天路历程》。她似乎专心看着那幅色彩鲜艳的插图，画的是“亚玻伦横跨道路中央”，偶尔却会害羞而好奇地瞧我。姑妈一次次想向她表示亲近，她全用冰冷的礼貌挡了回去。我对她这份本领怎么佩服都不为过。
        - id: ch03-b07
          speaker: aunt_eliza
          text: 有件事真叫我吃惊。我的大外甥爱德华，简直瞧不起小姑娘。前几天，我听见他对夏洛特说，巴不得拿她换一对日本豚鼠。可怜的孩子当场就哭了。男孩子的心真硬！
        - id: ch03-b08
          speaker: narrator
          text: 萨比娜立刻坐直，上翘的鼻尖轻蔑地抽动起来。姑妈却还没有说完。
        - id: ch03-b09
          speaker: aunt_eliza
          text: 可我今天带来的这个男孩，就有人情味多了。
        - id: ch03-b10
          speaker: narrator
          text: 我的心一下沉进了靴底。她难道看见过我含情脉脉地望着面包师的妻子？
        - id: ch03-b11
          speaker: aunt_eliza
          text: 就在昨天，他还带妹妹去面包店，把自己唯一的一便士花掉，给妹妹买了糖。这孩子的性情多好呀。真希望爱德华也能多像他一点！
        - id: ch03-b12
          speaker: narrator
          text: 我总算又能呼吸了。至于我去面包店的真正用意，当然完全不必解释。萨比娜的脸色柔和下来，鼻子也从轻蔑的高处落了下去。她害羞而友善地看了我一眼，又把全部心思放回《天路历程》里“怜悯敲窄门”的那幅画上。
        - id: ch03-b13
          speaker: narrator
          text: 想起爱德华，我觉得自己卑鄙极了。可是还能怎么办呢？我仿佛身陷迦萨，嘴被封住，手脚受缚，四周全是非利士人。
    - id: ch04
      title: 一次致命的嘲笑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 当天晚上，风暴爆发，霹雳落下。继续沿用这个比喻的话，大气随后又恢复了宁静和清朗。
        - id: ch04-b02
          speaker: narrator
          text: 晚祷比平日短，因为牧师走上讲坛时，从讲稿夹里掉了两页纸。无论掉落的那一刻，还是后来讲到缺页的地方，别人都没有发现，只有我们从头到尾看得清清楚楚。
        - id: ch04-b03
          speaker: narrator
          text: 众人欢喜地拖着脚步走出教堂。我悄声提醒爱德华，只要全速跑回家，我们就有时间重新拿起星期日暂时搁下的弓箭。伊丽莎姑妈会迈着端庄的步子慢慢回来，在她到家以前，我们还能把那群正往栖架散步、完全不知道厄运将至的鸡当作印第安人和野牛来玩。
        - id: ch04-b04
          speaker: narrator
          text: 爱德华站在门口，迟迟没有决定。这个亵渎礼法的提议，显然正在诱惑他。
        - id: ch04-b05
          speaker: narrator
          text: 就在这一刻，萨比娜端端正正地走出来。她看见爱德华，用世上最气人的样子冲他吐出舌头。随后，她双肩挺得僵直，小脑袋高高昂着，就这样走了。
        - id: ch04-b06
          speaker: narrator
          text: 一个男子为了爱情，可以忍受许许多多的事。贫穷、姑妈、情敌，还有各种阻碍，都只会把爱情的火焰煽得更旺。可当面受到嘲笑，那支箭会一直穿进最要害的地方。
        - id: ch04-b07
          speaker: narrator
          text: 爱德华带头朝家里飞奔。巴兰坦笔下的英雄或许追得上，却绝不可能超过。他的爱情已经被那一吐击中了致命处。
        - id: ch04-b08
          speaker: narrator
          text: 那天晚上，我们这群印第安人把伊丽莎姑妈的鸡赶到方圆好几英里的乡野。它们后来的故事，直到今天仍没人能完整说清。
        - id: ch04-b09
          speaker: narrator
          text: 爱德华疯狂地欢呼，紧追那只硕大的交趾种公鸡。那只鸟最后喘着气倒在客厅窗下，女主人恰好站在窗前，整个人惊成了一尊石像。
        - id: ch04-b10
          speaker: narrator
          text: 吃过晚饭，爱德华又跑到灌木园里，抽起从路上捡来的半截雪茄。一群听众敬畏得说不出话，只能望着他，听他宣布最后而且绝不更改的决定。
        - id: ch04-b11
          speaker: edward
          text: 我决定了。绝不更改。将来我要去参军！
    - id: ch05
      title: 暮色里的新心事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 危机终于过去，爱德华得救了。可是，世间万物皆有泪。
        - id: ch05-b02
          speaker: narrator
          text: 我望着那截雪茄。它映着幽暗的月桂，一会儿变得苍白，一会儿又红红地亮起来。渐浓的暮色里，却仿佛悬着萨比娜那只微微上翘的鼻子，还有她轻蔑地昂起的小脑袋。
        - id: ch05-b03
          speaker: narrator
          text: 那个幻影时而清晰，时而消退，又重新出现，就像柴郡猫留下的笑容。它看起来很哀伤，甚至带着责备。面包师妻子的魅力，则像融雪一样从我的记忆中滑走了。
        - id: ch05-b04
          speaker: narrator
          text: 说到底，萨比娜没有任何错。为什么要让这个孩子受罚？我暗暗决定，明天甩掉大家，装作随便散步，绕到她家花园附近。当然，要挑农场主安安稳稳待在草垛场里的时候。
        - id: ch05-b05
          speaker: narrator
          text: 要是什么也没发生，那也没有关系。可要是恰恰相反……
