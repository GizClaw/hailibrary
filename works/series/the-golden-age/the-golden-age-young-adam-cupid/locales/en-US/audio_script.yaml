audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    edward:
      display_name: Edward
      tts:
        delivery: proud and impulsive
        timbre: clear and youthful
        pace: lively
        pitch: medium
    aunt_eliza:
      display_name: Aunt Eliza
      tts:
        delivery: proper and firmly assured
        timbre: mature and crisp
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Trouble at the Rabbit Hutches
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            No one would have guessed that Edward was in love, except for what happened after breakfast. He tried much too hard to sound careless.
        - id: ch01-b02
          speaker: edward
          text: >-
            Anyone who wants to can feed my rabbits.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then he swaggered off toward the orchard, fooling nobody. Kingdoms might fall, revolutions might redraw the map of Europe, but one iron rule never changed. Every boy fed his own rabbits. Harold and I pulled lettuce leaves through the wire and held a serious conference. We had every reason to be alarmed.
        - id: ch01-b04
          speaker: narrator
          text: >-
            You might think it was none of our business. As individuals, we hardly cared. But we belonged to one household, and any illness of mind or body in one member could cause serious trouble for all the others. We chose Harold to investigate because no one was likely to suspect him of having a motive.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His orders were careful. First he would report on the health of our own rabbits. Then he would ease into rabbits in general, along with their habits and faults. From there, he was to turn naturally to girls, the flaws built into them, and all the reasons why, speaking broadly, they were dirt. Above all, he had to be diplomatic. Then he was to come back and report.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Harold set off cheerfully, but he came back very soon, defeated and crying. Diplomacy had not gone well. He had found Edward pacing through the orchard with a stiff smile pinned painfully to his face, like an acrobat pretending not to be afraid.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Harold began properly with the rabbits. Then he made the fatal mistake of becoming too particular. He said Edward's lop-eared doe, with her long back legs and the scornful twitch of her nose, always made him think of Sabina Larkin. Sabina was the nine-year-old daughter of a neighbouring farmer.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Edward turned on him at once. He twisted Harold's arm and punched him hard in the short ribs. Harold returned to the hutches with long wails coming before him. Between sobs, he wished he were a man so he could kick his lovesick brother. Then he mourned the day he had ever been born.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I was too small to face Edward myself, so I comforted Harold by letting him grease the wheels of the donkey cart. That delicious treat had been saved for me all week. The gardener's boy had promised it after I put in a good word for him with the new kitchen maid. Soon Harold was smiling again and covered in grease. I had lost my treat, but I was fairly satisfied. We had found a very useful clue to the source of the trouble.
    - id: ch02
      title: The Test at Church
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Luckily, we could settle any remaining doubt that very morning. It was Sunday, and the church bells had already begun to ring. Church may not seem connected with love, so I should explain. During that gloomy stretch of forced stillness, nothing much interested us, and every pretty person in the village sat within sight. That was exactly when a young man's thoughts turned to love. There was no time for such nonsense during the rest of the week. In church, there was hardly anything else to do.
        - id: ch02-b02
          speaker: narrator
          text: >-
            We could play noughts and crosses on the blank pages of our prayer books while the Litany dragged on. But the sermon offered no such comfort. An eye naturally wandered over the packed rows and freely chose among the fair worshippers.
        - id: ch02-b03
          speaker: narrator
          text: >-
            That was how my own wandering heart had fixed upon the baker's wife a few months before, under the special strain of the Athanasian Creed. Her mature charms conquered me when none of the younger girls in muslin, with all their giggling, had managed it. The fact that she was married never struck me as an obstacle to lifelong devotion.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Edward's behaviour during the morning service was bound to convict him, and we had a special test for his particular case. We sat in a transept with the Larkins behind us. His only chance to feast his eyes on Sabina came during the brief moment when everyone turned east.
        - id: ch02-b05
          speaker: narrator
          text: >-
            I had judged him correctly. While we sang the Benedictus, Edward made several impatient false starts. At last he swung all the way around before we had sung half of “As it was in the beginning, is now, and ever shall be.” The proof was complete. No court of law could have asked for better evidence.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Now that we knew the truth, we had to deal with it. I spent the whole sermon thinking. There was nothing unfair or unbrotherly in my view. My own thoughtful affection harmed nobody, so I considered it perfectly allowable. Edward, however, erupted into one of these fierce passions about once every three months, and each one seriously interfered with business.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Worse still, a circus was coming to the neighbourhood the next week. We had been strictly forbidden to go, and we could never defy law and orders successfully without Edward. I had tested him on the way to church. At the very mention of the circus, he said that thinking about a clown made him feel sick. Gloom could go no farther than that.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The sermon ended without giving me a plan. I walked home feeling low. Venus, the star of love, seemed high and powerful, while Auriga, the star of our circus, drooped dangerously near the horizon.
    - id: ch03
      title: Aunt Eliza Pays a Visit
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            By a strange twist of fate, Aunt Eliza was the one who brought a solution. Every Sunday afternoon, she went out on a grand round of visits to nearby farmers and villagers. She always dragged one unwilling boy with her, partly for the sake of proper appearances and partly for the health of his soul.
        - id: ch03-b02
          speaker: narrator
          text: >-
            All my hard thinking must have made me slow and careless that day. When she looked for a victim, I was easily caught. The others escaped without a scratch, shouting as they ran. Our first call was at the Larkins' house.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Ceremony bloomed there in all its glory, and we behaved with magnificent dignity. In the low parlour, with its oak-panelled walls, cake and currant wine waited for us. After the proper greetings and compliments, Aunt Eliza kindly lowered herself to discuss fashion with Mrs Larkin. The farmer and I worked so hard at talking about the changing weather and the steady fall in corn prices that we both began to perspire.
        - id: ch03-b04
          speaker: narrator
          text: >-
            No one listening would have guessed that only two days earlier we had faced each other across a hedge. I had been triumphant, insulting, and full of mockery. He had been red with rage, cracking his whip and pouring out dreadful language. That is the mighty power of ceremony.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Meanwhile, Sabina sat very properly with The Pilgrim's Progress on her knee. She appeared to be studying a brightly coloured picture of Apollyon standing across the road. Now and then she looked at me with shy interest. But whenever Aunt Eliza tried to draw her out, Sabina answered with a cold politeness that won all my admiration.
        - id: ch03-b06
          speaker: aunt_eliza
          text: >-
            I cannot understand the way my eldest nephew, Edward, despises little girls. Only the other day, I heard him tell Charlotte that he wished he could trade her for a pair of Japanese guinea pigs. The poor child cried. Boys can be so heartless!
        - id: ch03-b07
          speaker: narrator
          text: >-
            Sabina went stiff in her chair, and her turned-up nose gave a scornful twitch. Then Aunt Eliza pointed to me. My heart dropped into my boots. Had she noticed the loving looks I gave the baker's wife?
        - id: ch03-b08
          speaker: aunt_eliza
          text: >-
            This boy is altogether more human. Why, only yesterday he took his sister to the baker's shop and spent his only penny on sweets for her. Such a kind nature! I only wish Edward were more like him.
        - id: ch03-b09
          speaker: narrator
          text: >-
            I could breathe again. There was no need to explain my true reason for visiting the baker. Sabina's face softened, and her nose came down from its lofty height. She gave me one shy, friendly glance. Then she returned all her attention to the picture of Mercy knocking at the Wicket Gate.
        - id: ch03-b10
          speaker: narrator
          text: >-
            I felt terribly mean toward Edward, but what could I have done? I was trapped like Samson in Gaza, bound and gagged, with the Philistines all around me.
    - id: ch04
      title: The Storm Breaks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            That same evening, the storm broke and the bolt struck. Then, to finish the picture, the air became peaceful and clear again. Evening service ended earlier than usual. As the vicar climbed the pulpit steps, two pages slipped out of his sermon case. No one noticed except us, either when they fell or later, when he reached the gap.
        - id: ch04-b02
          speaker: narrator
          text: >-
            We shuffled out joyfully. I whispered to Edward that if we raced home at full speed, we would have time to pick up our bows and arrows, which had been put away for Sunday. Then we could play Indians and buffaloes with Aunt Eliza's chickens. The birds were already wandering toward their roost, with no thought of the fate waiting for them. We could begin before Aunt Eliza made her slow, stately way home.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Edward lingered at the church door, uncertain. The wicked suggestion plainly tempted him.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Just then Sabina came primly out of church. She saw Edward and stuck out her tongue at him in the most maddening way anyone could imagine. Then she walked on with stiff shoulders and her neat little head held high.
        - id: ch04-b05
          speaker: narrator
          text: >-
            A man in love can endure a great deal. He can face poverty, aunts, rivals, and every sort of barrier. They only make the flame burn brighter. But ridicule is an arrow that strikes straight into the heart.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Edward led the race home. One of the heroes in Ballantyne's adventure stories might have matched his speed, but none could have beaten it. That evening, the Indians scattered Aunt Eliza's chickens across several square miles of countryside. Their full story has never been gathered to this day.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Edward cheered wildly as he chased the great Cochin-China rooster. At last the bird collapsed, gasping, beneath the drawing-room window. Aunt Eliza stood there frozen in horror. After supper, Edward found us in the shrubbery. He smoked half of an old cigar he had picked up in the road, while we watched in awe.
        - id: ch04-b08
          speaker: edward
          text: >-
            I have made up my mind for good. Nothing will change it. I am going into the army.
    - id: ch05
      title: Another Change of Heart
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The crisis had passed. Edward was saved. And yet there are tears even in such things.
        - id: ch05-b02
          speaker: narrator
          text: >-
            I watched the end of Edward's cigar fade and glow against the dark laurels. In the gathering dusk, I seemed to see a turned-up nose and a small head held scornfully high. The vision hovered there, growing faint and bright and faint again, like the grin of the Cheshire Cat. It looked sad, almost accusing.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The baker's wife's charms melted out of my memory like snow in a thaw. After all, Sabina had done nothing wrong. Why should the child be punished?
        - id: ch05-b04
          speaker: narrator
          text: >-
            Tomorrow I would slip away from the others and happen to wander past her garden when the farmer was safely busy in the rick yard. If nothing came of it, no harm would be done. But if something did...!
