audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    uncle_thomas:
      display_name: 托马斯叔叔
      tts:
        delivery: 随性自信，说起见识来煞有介事
        timbre: 略显粗豪的成年男声
        pace: 明快自然，兴致转移时突然加快
        pitch: 中低
  chapters:
    - id: ch01
      title: 古老的房间
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 楼上有一间很少使用、也很少有人进去的小屋，里面摆着一张无人理会的老写字台。从前，这里想必是女主人们的闺房。褪色的锦缎色调淡淡的，剩下几件瓷器，带着玫瑰红和蓝色。写字台顶上还放着一只蓝白大碗，碗盖开着几个滑稽的小孔，旧日百花香就从那里轻轻飘出来。整间屋子处处透着女性的气息。
        - id: ch01-b02
          speaker: narrator
          text: 如今的姑妈婶婶们可瞧不上这间偏僻冷清的楼上屋子。她们喜欢坐在家里热闹的中心算账、对付书信。那样一来，一只眼能盯住马车道，另一只眼还能随时提防偷懒的佣人和四处劫掠的孩子。我有时觉得，上一代的姑妈们或许更合我们的脾性。
        - id: ch01-b03
          speaker: narrator
          text: 就连我们这些孩子也很少来这里。家里几乎没有什么地方是不许我们去的，可这屋里确实没有什么特别叫人眼馋的东西。几把细腿的镀金靠背椅，一架旧竖琴，一只放着几件瓷器的墙角柜，还有那张老写字台。传说在久远得没人记得的年月里，伊莱扎姑妈还亲手弹过那架竖琴。
        - id: ch01-b04
          speaker: narrator
          text: 不过，这房间另有一样特别的东西。它有一种不愿受打扰的幽静。闯进来时，你会清清楚楚地觉得，自己确实闯进了别人的天地。你甚至会怀疑，就在进门前一刹那，还有人坐在椅子上，在写字台前写信，或者伸手抚弄那些瓷器。
        - id: ch01-b05
          speaker: narrator
          text: “闹鬼”这个词太猛烈，绝不能用来形容这样一间宜人又古雅的屋子。我们其实都很喜欢它。可它无疑有点矜持，有点冷淡，只愿一个人守着自己。
        - id: ch01-b06
          speaker: narrator
          text: 最先让我留意那张老写字台的，是托马斯叔叔。一天下午，他在屋里东摸摸、西看看，还命令我紧跟在身后陪他，因为他连一分钟也受不了独处。忽然，他看见了写字台。
        - id: ch01-b07
          speaker: uncle_thomas
          text: 嗯，这是谢拉顿式的！
        - id: ch01-b08
          speaker: narrator
          text: 这位叔叔对大多数事情都略知一二，尤其熟悉各行各业的术语。他放下翻板，查看空空的格子和积灰的木镶板。
        - id: ch01-b09
          speaker: uncle_thomas
          text: 好一块镶嵌，处处都是好手艺。这类东西我熟，里头准藏着一只秘密抽屉。
        - id: ch01-b10
          speaker: narrator
          text: 我屏住呼吸，赶紧凑上前去。可他忽然又叫了起来。
        - id: ch01-b11
          speaker: uncle_thomas
          text: 天哪，我非抽烟不可了！
        - id: ch01-b12
          speaker: narrator
          text: 他转过身，一溜烟逃到花园里，把我一个人扔在那里。眼看杯子都送到嘴边了，却让人一把打落。抽烟真是件怪事。我暗自想着，它不论在宫廷、营帐还是林苑里，都能突然攫住一个人，像神怪似的把人卷走，逼他服从命令。等我长大，走进那些未知的岁月，难道也会变成这样吗？
    - id: ch02
      title: 金钱与寻宝
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可我没工夫再胡思乱想。“秘密抽屉”这几个有魔力的字，仍在我全身嗡嗡作响。它拨动了那根特别的心弦。只要听见洞穴、暗门、活动壁板、金银块，或者西班牙银元，这根弦总会跟着颤起来。再说，谁听说过秘密抽屉里会什么也没有？而我又正急需钱呢！我马上在心里数起最要紧的用钱之处。
        - id: ch02-b02
          speaker: narrator
          text: 第一件，是给乔治·詹纳韦买烟斗。乔治是玛莎的心上人，也是个牧羊人，跟我是很好的朋友。上次赶集，他像一个称职的牧羊人那样给恋人买了礼物，还特意送我一条漂亮的木蛇。蛇身一节一节，拿在手里摇起来别提多带劲。绿底上点着黄斑，刚上过漆，黏乎乎的，气味浓烈。嘴里还巧妙地粘着一条红绒布舌头。
        - id: ch02-b03
          speaker: narrator
          text: 我爱那条蛇爱得不得了，每晚都带它上床。后来，它的脊骨松脱，整个散了架，也像人世间所有的欢乐一样走到了尽头。乔治逛集市时还想着我，这实在太好了，所以我才想送他一只烟斗。
        - id: ch02-b04
          speaker: narrator
          text: 年初天气冷，母羊开始产羔时，乔治会住在冬日丘陵深处一间带轮子的小木屋里。那儿见到的脸，不是羊相十足，就是毛茸茸又不会说话。等他跟玛莎结婚，玛莎每天会走两英里，把午饭给他送去。饭后，他说不定就会抽起我送的烟斗。这样的日子，对他们两个人来说多么美好。可玛莎告诉我，一只真正配得上这种生活的好烟斗，至少要十八便士。而眼下，我一个子儿也没有。
        - id: ch02-b05
          speaker: narrator
          text: 我还欠爱德华四便士。他没有催着我讨，可我知道他也等钱用。他得把钱还给塞利娜，塞利娜则要凑足两先令，在哈罗德过生日时买一艘铁甲舰。那是“皇家海军威严号”。祖国正迫切需要它，它却歪着身子，毫无用处地躺在玩具店的橱窗里。
        - id: ch02-b06
          speaker: narrator
          text: 还有村里那个男孩，他捉到一只小松鼠。我从来没有养过松鼠。他开价一先令，不过我知道，只要把九便士现钱摆到面前……可是，这些可怜又陈旧的盘算有什么用？就算抽屉里真藏着半个索弗林金币的金银，我这么多愿望也能把它花得精光。
        - id: ch02-b07
          speaker: narrator
          text: 如今唯一的希望，就在那只神奇的抽屉上。我却还站着，白白放走宝贵的时间。至于从道义上说，拾到的东西到底算不算归我，我压根儿没想到。
        - id: ch02-b08
          speaker: narrator
          text: 我走到写字台前，屋里静得出奇，像是也在屏息等待。我放下翻板，一缕鸢尾根的淡香飘出来。那香气仿佛和老木头的黄褐色融到了一起，颜色和气味变成了同一种东西，可以彼此替换。百花香也早已融进旧锦缎的色彩里。锦缎和百花香，已经分不出彼此了。
        - id: ch02-b09
          speaker: narrator
          text: 我满心期待，把空格一一摸遍，又把手探进那些轻轻滑动的抽屉深处。我读过的书，没有一本讲过这种寻宝该用什么办法。不过，要是全凭自己找出来，那份荣耀自然更大。
        - id: ch02-b10
          speaker: narrator
          text: 命中注定会抵达终点的人，命运总会在路上给他一点小小的鼓励。不到两分钟，我找到了一把生锈的纽扣钩。这简直棒极了。育儿室里确实有一把公用的，男孩女孩都能使。可我们谁也没有属于自己的专用纽扣钩，可以看当时心情，想借给谁就借，不想借便拒绝。我小心地把宝贝装进口袋，继续往下找。接着，我又在另一个抽屉后面发现三枚外国旧邮票。它们分明在告诉我，我已经踏上了通往财富的大道。
    - id: ch03
      title: 抽屉打开了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这些鼓励过后，却是一段沉闷、空白、毫无收获的搜寻。我把所有抽屉抽出来，从前到后摸遍每一寸光滑的表面。没有旋钮，没有弹簧，也没有一点凸起碰上我兴奋的指尖。老写字台一动不动。假如它真有秘密，它也守得牢牢的。
        - id: ch03-b02
          speaker: narrator
          text: 我渐渐又累又泄气。托马斯叔叔见识浅薄，把人领进一条只有回声嘲笑你的死胡同，这又不是头一回了。还有必要找下去吗？世上任何事情究竟还有没有意义？我开始翻检从前所有的失望。人生简直是一部长长的记录，只记着失败，记着永远到不了的终点。
        - id: ch03-b03
          speaker: narrator
          text: 我彻底灰了心，丢下手里的活，走到窗前。屋里的光正在退去。外面的光却仿佛全聚在地平线上，准备集中力量演出一场日落。远处花园里，托马斯叔叔正倒提着爱德华，打他的屁股。爱德华歇斯底里地咯咯乱叫，两只拳头胡乱挥向他猜想中叔叔肚子的位置。他口袋里五花八门的东西撒了一草地。
        - id: ch03-b04
          speaker: narrator
          text: 一两个钟头以前，我自己也受过同样的摆布。可不知为什么，眼前这一幕显得离我极远，像是跟我完全隔断了。
        - id: ch03-b05
          speaker: narrator
          text: 西边的云聚成一道低低的紫色长堤。云层下面，从北到南，一线窄窄的金光沿着地平线笔直伸出去，一直铺到目光尽头。很远很远的地方，有人吹响一只号角。声音清亮又纤细，听来像是金光变成了声音，而那道金光，又像声音显出了形。
        - id: ch03-b06
          speaker: narrator
          text: 乐声和色彩融在一起，刺醒了我正在消退的勇气。我转过身，准备再试最后一次。幸运女神仿佛也为刚才捉弄我的卑劣把戏有些惭愧，终于松开了紧握的拳头。我的手才又碰到那块顽固的木头，秘密抽屉就弹开了。它发出一声细小的叹息，几乎像终于解脱时的一声呜咽。
        - id: ch03-b07
          speaker: narrator
          text: 我拉出抽屉，捧到窗前，借着越来越暗的天光细看。刚才那场搜寻已经让我不抱多大希望，可只看一眼，我那只装满幻想的玻璃篮子便摔碎在脚边。里面没有金块，也没有银元，不能让我做上一个星期的小基督山伯爵。
        - id: ch03-b08
          speaker: narrator
          text: 窗外，远方号角那蚊鸣似的声音停了。金色慢慢淡成浅黄，四周既寂寞又安静。我心里那些信心十足的小城堡，也像纸牌屋一样一座座倒下。不动产和动产全没了，只剩下希望破灭后的阴沉，把我紧紧抓住。
    - id: ch04
      title: 另一个男孩的宝藏
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可是，当我再看一眼那只令人幻灭的抽屉，心里却慢慢暖了起来。我认出了，收集这些东西的人，原来跟我有一颗相通的心。
        - id: ch04-b02
          speaker: narrator
          text: 里面有两枚失去光泽的镀金纽扣，看样子是海军制服上的。还有一幅我不认识的君主肖像，是从某本古老的印刷品上剪下来的，又由人亲手涂上颜色。那大胆的笔法，恰好跟我一模一样。旁边还有几枚外国铜币，比我收藏的更厚，铸得也更粗笨。一张鸟蛋清单上，记着每只蛋是在哪里发现的。除此以外，还有一个雪貂嘴套和一段沾过焦油的绳子，直到如今还隐约带着气味。
        - id: ch04-b03
          speaker: narrator
          text: 原来，我找到的是一个真正属于男孩的宝藏。那个生来有幸运星照耀的少年，也曾发现秘密抽屉。他把自己的珍宝一件一件藏进这里，暗暗爱惜了一阵。后来呢？后来发生了什么？如今谁也不会知道，这些无价的宝贝为什么一直留在这里，始终没人回来认领。
        - id: ch04-b04
          speaker: narrator
          text: 可是隔着悠悠岁月的空茫，我仿佛伸出手，跟这位早已死去许多时节的小伙伴握了一瞬。
        - id: ch04-b05
          speaker: narrator
          text: 我把抽屉和里面的东西一起放回那张可靠的写字台。弹簧“咔嗒”一响，我心里颇为满意。也许将来某一天，另一个男孩还会再次打开这道弹簧。我相信，他也会像我一样懂得欣赏。
        - id: ch04-b06
          speaker: narrator
          text: 我打开门，正要离去，走廊尽头的育儿室传来一片喊声和尖叫声。看来狩猎游戏已经开始了。听那动静，今晚要对付的大概是熊，或者强盗。再过一分钟，我就会投身其中，回到那一片温暖、明亮和欢笑里。
        - id: ch04-b07
          speaker: narrator
          text: 可我还在这间旧日屋子的门槛上流连。那一切在我眼中，怎么无论空间还是时间，都还离得那么遥远！
