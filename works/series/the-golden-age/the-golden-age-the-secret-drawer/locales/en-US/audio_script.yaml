audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    uncle_thomas:
      display_name: Uncle Thomas
      tts:
        delivery: brisk and casually authoritative
        timbre: resonant and mature
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Old Upstairs Room
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The little upstairs room was hardly ever used, and people rarely went inside. Long ago, it must have been a private room for the ladies of the house. You could still feel something feminine there. The brocade had faded to faint colors. A few pieces of china kept their rose and blue, and a delicate old-fashioned scent rose from the potpourri bowl on top of the bureau. The bowl was blue and white, with funny little holes in its lid.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Our modern aunts had no use for this quiet backwater of a room. They preferred to do their accounts and answer letters where everything was happening. From there, one eye could watch the carriage drive while the other looked out for servants avoiding work and children on the prowl. Sometimes I thought the aunts from an earlier age would have suited us much better.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Even we children seldom visited the room, though we respected very few private places. There was nothing in it we especially wanted. It held a few thin-legged chairs with gilt backs, a corner cupboard with some china, and an old harp. According to family legend, Aunt Eliza herself had once played that harp, far back in years no one had recorded. And then there was the old bureau.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The room did possess one thing all its own. It had a feeling of privacy. The moment you entered, you knew you were intruding. You could almost believe that someone had been sitting in one of those chairs, writing at the bureau or touching the china, only a second before you came in.
        - id: ch01-b05
          speaker: narrator
          text: >-
            I would never use a violent word like “haunted” for such a pleasant, old-fashioned room. We all rather liked it. Still, there was no doubt that the room was reserved and stand-offish. It kept itself to itself.
    - id: ch02
      title: The Magic Words
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Uncle Thomas was the first person to show me what the old bureau might hold. One afternoon he was wandering around the house and had ordered me to follow close behind for company. He could not bear to be alone for even a minute. When he noticed the bureau, he stopped.
        - id: ch02-b02
          speaker: uncle_thomas
          text: >-
            H'm. Sheraton.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Uncle Thomas knew a little about almost everything, especially the proper words for things. He lowered the writing flap and looked through the empty pigeonholes and dusty wooden panels.
        - id: ch02-b04
          speaker: uncle_thomas
          text: >-
            That's fine inlay. Good workmanship, all of it. I know this kind of bureau. There'll be a secret drawer hidden somewhere inside.
        - id: ch02-b05
          speaker: narrator
          text: >-
            I moved closer, hardly breathing. Then Uncle Thomas suddenly remembered something else.
        - id: ch02-b06
          speaker: uncle_thomas
          text: >-
            By Jove, I need a smoke!
        - id: ch02-b07
          speaker: narrator
          text: >-
            He spun around and hurried off to the garden. One moment the prize had been almost at my lips, and the next it was gone. Smoking seemed very strange to me. It could seize a man anywhere, in a court, a camp, or a grove, grip him like some powerful spirit, and whirl him away to obey its command. I wondered whether it would take hold of me that way when I reached those unknown grown-up years.
        - id: ch02-b08
          speaker: narrator
          text: >-
            But there was no time for useless wondering. Every part of me was still ringing with those magic words, “secret drawer.” They struck the same thrilling note as cave, trapdoor, sliding panel, bullion, ingots, and Spanish dollars. Besides, who had ever heard of a secret drawer with nothing inside it? And I needed money very badly. I began to count up my most urgent wants.
        - id: ch02-b09
          speaker: narrator
          text: >-
            First came the pipe I wanted to give George Jannaway. George was Martha's young man, a shepherd, and a great friend of mine. At the last fair, he had bought presents for Martha, as any proper shepherd should. He had also chosen a wonderful snake especially for me.
        - id: ch02-b10
          speaker: narrator
          text: >-
            It was a wooden snake made in jointed pieces, and it wriggled beautifully in your hand. It had yellow spots on a green body, sticky and strong-smelling in the proper way of newly painted things. A red flannel tongue was neatly pasted between its jaws. I loved that snake and took it to bed every night. Then its backbone came loose, it fell to pieces, and that joy ended like all mortal joys.
        - id: ch02-b11
          speaker: narrator
          text: >-
            George had been kind to remember me at the fair, so I wanted to give him a pipe. During the cold young part of the year, when the lambs were coming, he lived far out on the wintry downs in a little wooden hut on wheels. All the faces he saw there were woolly, silent, and sheepish.
        - id: ch02-b12
          speaker: narrator
          text: >-
            After George and Martha married, she planned to carry his dinner two miles out to him every day. Perhaps he would smoke my pipe after the meal. It sounded like a perfect life for them both. But Martha said that a pipe good enough to belong in such a life would cost at least eighteen pence. And meanwhile, I had no money at all.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Then there were the four pennies I owed Edward. He was not troubling me about them, but he needed the money too. He had to repay Selina, who needed it to complete her two shillings. She meant to buy Harold an ironclad for his coming birthday. H.M.S. Majestic was lying uselessly on her side in the toyshop window, just when her country needed her so badly.
        - id: ch02-b14
          speaker: narrator
          text: >-
            And there was a village boy who had caught a young squirrel. I had never owned one. He wanted a shilling for it, though I knew ninepence in ready money might persuade him. But why keep going over these worn-out hopes? I had enough wants to use up any treasure I might find, even half a sovereign. The magic drawer was my only chance, and I was wasting precious minutes. It never occurred to me to ask whether finding treasure made it mine to keep.
    - id: ch03
      title: The Search
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The room was very still when I went up to the bureau. It seemed to be waiting in silence. I lowered the flap, and a faint scent of orris root drifted out. Somehow the scent and the yellows and browns of the old wood seemed to belong to each other so completely that color and smell became almost the same thing.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The potpourri had already done the same with the old brocade. Its perfume and those faded colors had blended together long ago.
        - id: ch03-b03
          speaker: narrator
          text: >-
            With eager fingers, I searched every empty pigeonhole and reached into the smoothly sliding drawers. None of the books I knew offered instructions for hunting a secret drawer. Still, if I found it without help, the glory would belong entirely to me.
        - id: ch03-b04
          speaker: narrator
          text: >-
            When fate means someone to succeed, it always gives a few small signs along the way. In less than two minutes, I found a rusty buttonhook. This was magnificent. Of course, the nursery had one buttonhook that everyone used, boys and girls alike. But none of us owned a private buttonhook, one we could lend or refuse to lend according to our mood. I carefully put my treasure in my pocket and searched on.
        - id: ch03-b05
          speaker: narrator
          text: >-
            At the back of another drawer, I discovered three old foreign stamps. Now I felt sure I was on the highroad to fortune.
        - id: ch03-b06
          speaker: narrator
          text: >-
            After those encouraging finds came a long, dull stretch with no reward at all. I pulled out every drawer and ran my hands over every inch of smooth wood, from front to back. My tingling fingertips found no knob, no spring, no raised place. The old bureau would not yield. If it truly had a secret, it guarded that secret stubbornly.
        - id: ch03-b07
          speaker: narrator
          text: >-
            I grew tired and discouraged. This was not the first time Uncle Thomas had turned out to know very little and led me down a blind alley where only mocking echoes waited. Was there any point in searching longer? Was there any point in anything? I began remembering all my past disappointments. Life seemed to be one long tale of trying and never arriving.
        - id: ch03-b08
          speaker: narrator
          text: >-
            With all my hopes gone, I left the bureau and walked over to the window. Daylight was draining out of the room. Outside, it seemed to be gathering along the horizon, ready for one great effort at sunset.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Far down the garden, Uncle Thomas was holding Edward upside down in the air and smacking him. Edward gurgled wildly and punched blindly toward the place where he guessed our uncle's stomach ought to be. Everything from his pockets lay scattered across the lawn in a wonderful mixture.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Uncle Thomas had put me through much the same performance only an hour or two earlier. Yet now the scene looked very distant, as if I had been cut off from it.
    - id: ch04
      title: The Drawer Opens
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            In the west, the clouds were piling into a low violet bank. Beneath them, a thin streak of gold ran north and south as far as I could see. It stretched straight along the horizon.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Somewhere far away, a horn sounded, clear and faint. It was as if the golden streak had turned into sound, while the gold itself had become music you could see. Together, the color and the music stirred my fading courage. I turned back for one final try.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Then Fortune seemed almost ashamed of the mean game she had played with me, and at last she opened her tight fist. I had barely touched the stubborn wood again when the secret drawer sprang open. It gave a small sigh, almost a sob, as though it too were relieved.
        - id: ch04-b04
          speaker: narrator
          text: >-
            I pulled the drawer all the way out and carried it to the window, where the light was fading. By then the long search had left me too hopeless to expect much. Still, one glance showed me that my basket of glass had fallen and shattered at my feet.
        - id: ch04-b05
          speaker: narrator
          text: >-
            There were no bars of gold and no Spanish dollars. Nothing there would make me a little Count of Monte Cristo, even for one week. Outside, the far-off horn had stopped its thin, insect song. The gold in the sky was fading to primrose, and everything was lonely and still.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Inside the room, all my confident little castles collapsed like houses of cards. In a moment, every bit of property I had imagined was gone. The disappointment after so much hope weighed heavily on me.
    - id: ch05
      title: A Boy from Long Ago
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            But then I looked again at the small collection inside that drawer of disappointments. A little warmth returned to my heart. Someone with a spirit very much like mine had gathered these things.
        - id: ch05-b02
          speaker: narrator
          text: >-
            There were two tarnished gilt buttons that seemed to be naval ones. There was a portrait of a king or queen I did not know, cut from an old print and carefully colored by hand. The bold brushwork looked exactly like my own.
        - id: ch05-b03
          speaker: narrator
          text: >-
            There were foreign copper coins, thicker and clumsier than the coins I collected. There was a list of birds' eggs, with the names of the places where each one had been found. There was also a ferret's muzzle and a twisted piece of tarry string that still held a faint smell.
        - id: ch05-b04
          speaker: narrator
          text: >-
            So this was a real boy's hoard. He had discovered the secret drawer too, that lucky young person born under a happy star. One by one, he had hidden his treasures there and loved them in secret for a while. And after that, what had happened?
        - id: ch05-b05
          speaker: narrator
          text: >-
            No one would ever know why he had left these priceless possessions behind. But across the empty stretch of years, I seemed to reach out and touch hands for a moment with my little comrade from seasons long since gone.
        - id: ch05-b06
          speaker: narrator
          text: >-
            I put the drawer and everything inside it back into the faithful old bureau. The spring clicked shut, and I felt satisfied. Perhaps another boy would release that spring someday. I hoped he would understand the treasure as well as I had.
        - id: ch05-b07
          speaker: narrator
          text: >-
            When I opened the door to leave, shouts and yells came from the nursery at the end of the passage. The hunt was up. From the sounds of it, bears or bandits were on the evening's program. In another minute, I would be right in the middle of the game, surrounded by warmth and light and laughter.
        - id: ch05-b08
          speaker: narrator
          text: >-
            And yet, as I lingered on the threshold of that old-world room, it all seemed a very long way off, both in space and in time.
