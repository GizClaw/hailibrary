  chapters:
    - id: ch01
      title: Moonlight at the Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The night was far too fine for us to go straight to bed. Nine o'clock had already struck, but Edward and I were still leaning out of our open window in our nightshirts. Cedar branches threw moving shadows across the moonlit lawn, and we planned fresh mischief for the sunny day ahead.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Downstairs, the piano told us that the Olympians were amusing themselves in their usual lazy, useless way. The new curate had come to dinner, and just then he was loudly proclaiming to the whole world that he feared no enemy. His singing was painfully out of tune. That must have started a thought in Edward's head, because he suddenly spoke without any warning.
        - id: ch01-b03
          speaker: edward
          text: >-
            I believe the new curate is rather taken with Aunt Maria.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Nonsense. She's quite old.
        - id: ch01-b05
          speaker: narrator
          text: >-
            She must have lived through at least twenty-five summers.
        - id: ch01-b06
          speaker: edward
          text: >-
            Of course she's old. He isn't after her. He's after her money, you bet.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I didn't know she had any money.
        - id: ch01-b08
          speaker: edward
          text: >-
            She must have. Heaps and heaps of it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            We fell silent and considered this new possibility. I wondered how a grown man, and a good cricketer too, could have such a flaw in an otherwise enviable nature. Edward seemed to be wondering how he might turn the whole business to his own advantage.
    - id: ch02
      title: Bobby Ferris and the Shillings
      blocks:
        - id: ch02-b01
          speaker: edward
          text: >-
            Bobby Ferris told me about a fellow who was courting his sister once.
        - id: ch02-b02
          speaker: narrator
          text: >-
            What does courting mean?
        - id: ch02-b03
          speaker: edward
          text: >-
            Oh, I don't know. It's just something people do. Bobby carried notes and messages between them, and nearly every time, the fellow gave him a shilling.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Did he get a shilling from each of them?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Edward looked at me with pitying contempt.
        - id: ch02-b06
          speaker: edward
          text: >-
            Girls never have money. But his sister did his exercises, got him out of trouble, and told lies for him whenever he needed one. Her lies were much better than anything he could invent. Girls can be useful sometimes. Bobby was living beautifully until those two quarreled about something.
        - id: ch02-b07
          speaker: narrator
          text: >-
            I don't see what that has to do with it.
        - id: ch02-b08
          speaker: edward
          text: >-
            Neither do I. I'm only telling you what happened. Once they quarreled, the notes stopped, and so did the shillings. That left Bobby in a fix. He had bought two ferrets on credit and promised to pay a shilling every week. The young ass thought those shillings would last forever. Then the week ended, the owner demanded his money, and Bobby had nothing to give him.
        - id: ch02-b09
          speaker: edward
          text: >-
            When the payment came due, he went to the fellow with a message. He had taken it from some rotten book, of course.
        - id: ch02-b10
          speaker: bobby_ferris
          text: >-
            Your brokenhearted Bella begs you to meet her at sundown by the hollow oak, just as you used to do. Come for one moment. You must not fail her.
        - id: ch02-b11
          speaker: bella_suitor
          text: >-
            What hollow oak? I don't know any hollow oak.
        - id: ch02-b12
          speaker: bobby_ferris
          text: >-
            Perhaps she meant the Royal Oak?
        - id: ch02-b13
          speaker: narrator
          text: >-
            Bobby knew he had made a mistake by trusting the book, but his quick correction did not cheer the fellow.
        - id: ch02-b14
          speaker: narrator
          text: >-
            I should think not. The Royal Oak is a terribly low sort of public house.
        - id: ch02-b15
          speaker: edward
          text: >-
            I know. At last the fellow thought he understood.
        - id: ch02-b16
          speaker: bella_suitor
          text: >-
            She must mean the hollow tree in your father's paddock. It's really an elm, but Bella wouldn't know the difference. All right. Tell her I'll be there.
        - id: ch02-b17
          speaker: edward
          text: >-
            Bobby stayed where he was because he still hadn't been paid.
        - id: ch02-b18
          speaker: bobby_ferris
          text: >-
            She was crying terribly.
        - id: ch02-b19
          speaker: edward
          text: >-
            That got him his shilling.
        - id: ch02-b20
          speaker: narrator
          text: >-
            Wasn't the fellow furious when he reached the place and found nobody there?
        - id: ch02-b21
          speaker: edward
          text: >-
            He found Bobby. Young Ferris behaved like a gentleman from head to toe. He brought another message from Bella.
        - id: ch02-b22
          speaker: bobby_ferris
          text: >-
            I dare not leave the house. My cruel parents keep me shut inside. If only you knew how I suffer. Your brokenhearted Bella.
        - id: ch02-b23
          speaker: edward
          text: >-
            That came from the same rotten book. Now the fellow grew suspicious, because old Mr. and Mrs. Ferris had supported the match all along. You see, the fellow had money, so they would hardly be cruelly shutting Bella away from him.
        - id: ch02-b24
          speaker: narrator
          text: >-
            But what does that have to do with—
        - id: ch02-b25
          speaker: edward
          text: >-
            Oh, I don't know. This is exactly how Bobby told it. The fellow was suspicious, but he could hardly call Bella's brother a liar, so Bobby escaped that time.
        - id: ch02-b26
          speaker: edward
          text: >-
            The next week Bobby was stuck on a hard French exercise. He tried the same trick on his sister, but she was too sharp for him and caught him out. Women are somehow more mistrustful than men. They're horribly suspicious by nature, you know.
        - id: ch02-b27
          speaker: narrator
          text: >-
            I know. But did the fellow and Bella make up afterward?
        - id: ch02-b28
          speaker: edward
          text: >-
            I don't remember. But Bobby was sent away to school a whole year before his family had intended, and that was exactly what he wanted. So everything came right in the end.
        - id: ch02-b29
          speaker: narrator
          text: >-
            I tried to puzzle out the moral. Edward's story plainly meant to have one somewhere.
    - id: ch03
      title: A Scout in the Laurels
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Just then, golden lamplight poured onto the lawn and mingled with the moonlight. Aunt Maria and the new curate came strolling out. They headed for a garden seat backed by thick laurel bushes. The laurels curved around it in a half-circle and reached all the way to the house. Edward thought gloomily for a moment.
        - id: ch03-b02
          speaker: edward
          text: >-
            If we could hear what they're talking about, we'd soon know whether I'm right. Let's send the kid down by the porch to spy on them.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Harold is asleep. It seems rather a shame to wake him.
        - id: ch03-b04
          speaker: edward
          text: >-
            Rubbish. He's the youngest, so he has to do as he's told.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Poor Harold was dragged out of bed and given his orders. He was annoyed to find himself standing suddenly on the cold floor, and the mission did not interest him much. Still, he was loyal and well trained. Once he knew what we required, he accepted the duty.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Getting outside was easy. An iron trellis porch rose close to our window, within easy reach of our hands. All three of us often used it when we wished to avoid being noticed by the household. Harold swung himself onto it and climbed neatly down like a white rat. His nightgown flashed for a moment on the gravel, and then the dark bushes swallowed him.
        - id: ch03-b07
          speaker: narrator
          text: >-
            For a little while, all was quiet. Then came the sound of a struggle, followed by one long, high squeal like metal scraping on metal. Our scout had fallen into enemy hands.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Only laziness had made us send our little brother in our place. The moment danger appeared, we did not hesitate. We flew down the porch and crawled through the laurels like Cherokee warriors until we reached the back of the garden seat.
        - id: ch03-b09
          speaker: narrator
          text: >-
            A dreadful sight awaited us. Aunt Maria sat there in a white evening dress, looking really rather nice for an aunt. On the lawn, the angry curate had Harold by one large ear. From the noise Harold made, you might have thought the ear was about to leave his head. The curate held on while Harold twisted and protested beneath him.
        - id: ch03-b10
          speaker: narrator
          text: >-
            His cries offended our ears more than our hearts. Anyone who has heard both can easily tell real pain from loud weeping meant to win pity. Harold's performance was plainly the second kind.
        - id: ch03-b11
          speaker: curate
          text: >-
            Now then, you young whelp, tell us what you mean by this.
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: >-
            I think he said “whelp,” though Edward has always insisted it was “devil.”
        - id: ch03-b13
          speaker: harold
          text: >-
            Let go of my ear, then! I'll tell you the solemn truth!
          emotion: angry
        - id: ch03-b14
          speaker: curate
          text: >-
            Very well. Go on, and try not to lie any more than you must.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Edward and I waited without the least concern. Even we had not yet understood how quickly Harold's imagination could work.
    - id: ch04
      title: Harold's Burglars
      blocks:
        - id: ch04-b01
          speaker: harold
          text: >-
            I had just finished my prayers when I happened to look out of the window. There on the lawn, I saw a sight that froze the marrow in my bones! A burglar crept toward the house like a snake. He wore a scowl, carried a dark lantern, and was armed to the teeth!
        - id: ch04-b02
          speaker: narrator
          text: >-
            We listened with interest. Those grand words did not sound like Harold, but they sounded strangely familiar.
        - id: ch04-b03
          speaker: curate
          text: >-
            Go on.
        - id: ch04-b04
          speaker: harold
          text: >-
            The burglar stopped in his stealthy course and gave a low whistle. At once, two more figures slipped from the nearby shadows. Both villains were armed to the teeth.
        - id: ch04-b05
          speaker: curate
          text: >-
            Excellent. Please continue.
        - id: ch04-b06
          speaker: harold
          text: >-
            The robber chief joined his wicked companions and spoke with them in silent tones. His face was truly ferocious. And I should have mentioned that he was armed to the—
        - id: ch04-b07
          speaker: curate
          text: >-
            Never mind his teeth. There is far too much jaw in your story already. Hurry up and finish it.
        - id: ch04-b08
          speaker: harold
          text: >-
            I was in a frightful funk. But then the drawing-room window opened, and you and Aunt Maria came out. I mean, you emerged. The burglars vanished silently into the laurels, leaving horrible things to be imagined!
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: >-
            Harold kept one hand safely over his ear while he spoke. The curate looked puzzled. The tale held together remarkably well, and every new detail seemed to support the one before it. After all, perhaps the boy truly had seen something moving near the house.
        - id: ch04-b10
          speaker: narrator
          text: >-
            How could the poor man know that Harold had freely borrowed the whole adventure from the latest cheap thriller the knife-and-boot boy had lent us? The noble language might have warned him, but it did not.
        - id: ch04-b11
          speaker: curate
          text: >-
            Why didn't you raise an alarm inside the house?
        - id: ch04-b12
          speaker: harold
          text: >-
            Because I was afraid they might not believe me.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Harold gave him the sweetest answer he could.
        - id: ch04-b14
          speaker: aunt_maria
          text: >-
            But how did you get down here, you naughty little boy?
        - id: ch04-b15
          speaker: narrator
          text: >-
            Now Harold was in real trouble, betrayed by his own flesh and blood.
        - id: ch04-b16
          speaker: narrator
          text: >-
            At that instant, Edward touched my shoulder and slipped away through the laurels. When he was about ten yards off, he gave a low whistle. I answered with another.
        - id: ch04-b17
          speaker: narrator
          text: >-
            The effect was wonderful. Aunt Maria jumped up with a shriek. Harold shot one startled look around and bolted like a hare. He raced for the back door, burst in on the servants at supper, and buried himself against the cook's broad chest. She was his particular friend.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The curate turned toward the laurels, though not very eagerly. Aunt Maria threw herself upon him.
        - id: ch04-b19
          speaker: aunt_maria
          text: >-
            Oh, Mr. Hodgitts, you are brave! For my sake, don't be rash!
          emotion: fearful
        - id: ch04-b20
          speaker: narrator
          text: >-
            He was not rash. When I peeped out again a moment later, both of them had completely disappeared.
    - id: ch05
      title: The Hero of the Burglar Hunt
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            By then, we could hear the household beginning to come timidly outside and gather for the hunt. Edward said we had probably better leave before anyone reached our hiding place. Getting away was simple. A short laurel helped us climb onto the garden wall. From there we reached the roof of an outbuilding and crawled up its rather doubtful slope to the box-room window.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The house cat had shown us that high road one day during an otter hunt. The cat, very much against its wishes, had been playing the otter. Since then, the route had proved extremely useful on nights like this one.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Soon Edward and I were safely in bed, though our knees and elbows had lost a little skin on the journey. Harold came up in the friendly cook's arms, sleepily chewing something sticky she had given him. The burglar hunters were still calling and moving about below when all three of us were tucked away.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Aunt Maria reported that the curate had faced the danger without fear. Everyone decided that his courage must have frightened the burglars away, and he won a great deal of praise for it.
        - id: ch05-b05
          speaker: narrator
          text: >-
            A few days later, he came for afternoon tea. He made a gentle curate's joke about how much moral courage it took to choose the last piece of bread and butter. I felt I simply had to speak. Dreamily, as though addressing the universe rather than anyone in the room, I repeated the words I had heard in the garden.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Mr. Hodgitts, you are brave! For my sake, don't be rash!
        - id: ch05-b07
          speaker: narrator
          text: >-
            Luckily for me, the vicar had also come to call. Out in the open, it was always fairly easy to dodge my long-coated friend.
