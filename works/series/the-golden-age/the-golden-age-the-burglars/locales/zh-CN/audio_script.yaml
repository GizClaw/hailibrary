audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    aunt_maria:
      display_name: 玛丽亚姑妈
      tts:
        delivery: 端庄柔和，受惊时急促而依赖
        timbre: 清晰温润的成年女声
        pace: 从容，慌乱时明显加快
        pitch: 中高
    curate:
      display_name: 霍吉茨副牧师
      tts:
        delivery: 平日文雅克制，被孩子惹恼时严厉又带挖苦
        timbre: 清朗而略显单薄的年轻男声
        pace: 稳健，追问时短促
        pitch: 中
  chapters:
    - id: ch01
      title: 月光下的猜想
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天夜色太美，根本不像该马上睡觉的晚上。九点钟这个群魔出动的时辰早已敲过，我和爱德华还穿着睡衣趴在敞开的窗口，看雪松枝影在月光照亮的草坪上摇动嬉戏，顺便筹划明天晴空之下的新恶作剧。
        - id: ch01-b02
          speaker: narrator
          text: 楼下钢琴弹得很欢，奥林匹斯山上的大人们正用他们那种懒洋洋又不中用的办法取乐。新来的副牧师受邀来吃晚饭，此刻正向全世界放声唱着自己谁也不怕，那副不成调的嗓门可一点也不像神职人员。爱德华听着听着，忽然冒出一个跟先前的话毫不相干的念头。
        - id: ch01-b03
          speaker: edward
          text: 我看，新来的副牧师八成迷上玛丽亚姑妈了。
        - id: ch01-b04
          speaker: narrator
          text: 怎么会？她年纪很大了呀。少说也度过二十五个夏天了。
        - id: ch01-b05
          speaker: edward
          text: 她当然老了。他看中的又不是她，是她的钱。你等着瞧吧！
        - id: ch01-b06
          speaker: narrator
          text: 我还不知道她有钱呢。
        - id: ch01-b07
          speaker: edward
          text: 她准有钱，而且多得不得了。
        - id: ch01-b08
          speaker: narrator
          text: 我们俩都不说话了，各自想着眼前的新局面。我惊讶的是，天资那么叫人羡慕、禀赋那么完善的人，竟也常有这种缺陷。就拿眼前这位副牧师来说吧。他已经长大成人，板球又打得很好，竟也没能例外。爱德华想的显然更实际。他大概正盘算，假如猜得没错，这件事怎样才能让自己占到最大的便宜。
        - id: ch01-b09
          speaker: edward
          text: 鲍比·费里斯告诉过我，从前有个家伙追他姐姐。
        - id: ch01-b10
          speaker: narrator
          text: “追”是什么意思？
        - id: ch01-b11
          speaker: edward
          text: 谁知道呢。就是……就是他们会做的一种事情，你明白吧。鲍比替两个人传字条、捎口信什么的，差不多每回都能拿到一先令。
        - id: ch01-b12
          speaker: narrator
          text: 两边各给他一先令吗？
        - id: ch01-b13
          speaker: edward
          text: 女孩子从来没有钱。可她会替鲍比做功课，帮他逃过责罚。需要的时候，她还会替鲍比编故事，而且编得比他自己能想出来的高明多了。所以说，女孩子有时候也挺有用。鲍比本来靠着这些好处，日子过得舒服极了，可那两个人后来不知为什么吵翻了。
        - id: ch01-b14
          speaker: narrator
          text: 可这跟刚才的事有什么关系？
        - id: ch01-b15
          speaker: edward
          text: 我也不知道。不过他们不再传字条，鲍比的一先令也跟着没了。偏偏他赊账买了两只雪貂，答应每星期付一先令。他这个小蠢驴，还以为钱会永远不断呢。一个星期到了，人家追着他讨那一先令，他走投无路，只好跑去找那个家伙。
        - id: ch01-b16
          speaker: edward
          text: 他告诉那家伙：“你那心碎的贝拉求你日落时来见她。还是从前那棵空心橡树，哪怕只见一刻也好。千万别失约！”这些话当然是从一本破书里抄来的。
        - id: ch01-b17
          speaker: edward
          text: 那家伙听糊涂了，说自己根本不知道什么空心橡树。鲍比发现自己太相信那本破书，不小心露了马脚，赶紧说：“难道是皇家橡树酒馆？”可这一改，那家伙也没高兴起来。
        - id: ch01-b18
          speaker: narrator
          text: 那当然。皇家橡树可是家糟透了的下等酒馆。
        - id: ch01-b19
          speaker: edward
          text: 后来，那家伙总算猜到，她说的也许是费里斯家牧场里的空心树。那其实是棵榆树，不过贝拉反正分不清。他答应赴约，鲍比却没有走，因为钱还没到手。鲍比又说贝拉哭得可伤心了，这才拿到一先令。
        - id: ch01-b20
          speaker: narrator
          text: 他到了那里，发现根本没人等着，难道没有气坏吗？
        - id: ch01-b21
          speaker: edward
          text: 谁说没人？鲍比就在那儿。小费里斯可是个从头到脚都体面的绅士。他又给那家伙带来了贝拉的口信：“我不敢离开家门。狠心的父母把我紧紧囚禁。你哪里知道我受着怎样的苦。你那心碎的贝拉。”当然，这些话还是从那本破书里抄来的。
        - id: ch01-b22
          speaker: edward
          text: 那家伙听完起了疑心，因为费里斯家的两个老家伙从头到尾一直很赞成这门事。要知道，那家伙有的是钱，他们自然愿意。
        - id: ch01-b23
          speaker: narrator
          text: 可这到底跟刚才的事有什么关系？
        - id: ch01-b24
          speaker: edward
          text: 我哪儿知道！鲍比怎么说，我就怎么告诉你。那家伙虽然怀疑，却不能当面骂贝拉的弟弟撒谎，鲍比暂时就逃过去了。下星期，他又陷进一道很难的法文作业，想对姐姐使同样的招数。可她比他机灵，当场揭穿了他。不知怎么，女人好像总比男人多疑。她们天生就疑神疑鬼，真讨厌。
        - id: ch01-b25
          speaker: narrator
          text: 这我知道。不过那家伙和他姐姐后来和好了吗？
        - id: ch01-b26
          speaker: edward
          text: 后来和好没有，我可不记得了。反正鲍比比家里原先打算的时间早了整整一年被送去学校，那正是他求之不得的事。你看，到头来不是全都圆满解决了吗？
    - id: ch02
      title: 侦察兵落入敌手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我还在琢磨这个故事的教训到底藏在哪里。它显然应该含着一条教训，只是我还没找到。就在这时，一片金色灯光泻到草坪上，跟月光混在一起。玛丽亚姑妈和副牧师从屋里走出来，朝花园长椅那边漫步过去。长椅背后是一大片浓密的月桂树，绕成半圆，一直伸到屋旁。爱德华阴沉地思索起来。
        - id: ch02-b02
          speaker: edward
          text: 要是能听见他们在说什么，你马上就会知道我猜得对不对。咱们让小家伙从门廊爬下去侦察！
        - id: ch02-b03
          speaker: narrator
          text: 哈罗德已经睡了。现在叫醒他，也太不像话了吧。
        - id: ch02-b04
          speaker: edward
          text: 胡说！他年纪最小，就该听吩咐！
        - id: ch02-b05
          speaker: narrator
          text: 倒霉的哈罗德就这样被拖下床，光脚站到冰冷的地板上，领受了出发的命令。突然被叫醒，他当然不高兴，这份差事本身也没有什么能吸引他的地方。不过，他既忠诚，又训练有素，仍旧接受了命令。
        - id: ch02-b06
          speaker: narrator
          text: 窗口外有一座铁格架门廊，一直升到伸手就能攀住的地方。我们三个只要谦逊地不想让别人看见，平常都会走这条路。哈罗德像只白老鼠似的灵巧地爬下去。白睡袍在碎石路上一闪，他就钻进树丛的黑暗，不见了。
        - id: ch02-b07
          speaker: narrator
          text: 安静了片刻，下面猛然响起扭打声，接着是一道尖锐而绵长的号叫，简直像两块金属正在摩擦。我们的侦察兵已经落进敌人手里了。
        - id: ch02-b08
          speaker: narrator
          text: 先前让弟弟去冒险，只是因为我们懒。如今危险真的出现，我和爱德华可一点也没有犹豫。我们立刻爬下门廊，又像切罗基人那样匍匐钻过月桂树，绕到长椅背后。
        - id: ch02-b09
          speaker: narrator
          text: 眼前实在是一幅凄惨景象。玛丽亚姑妈穿着白色晚礼服坐在椅上。若拿姑妈来比较，她其实相当好看。副牧师却怒气冲冲地站在草坪上，紧紧揪着哈罗德的一只大耳朵。听哈罗德闹出的动静，耳朵仿佛马上就要同它装点着的脑袋分家了。
        - id: ch02-b10
          speaker: narrator
          text: 哈罗德那可怕的惨叫只在声音难听这一点上影响了我们。真正挨痛的哭声，跟为了博取同情硬挤出来的号啕，只要两种都亲自领教过，就很容易分辨。他这回显然属于后一种。
        - id: ch02-b11
          speaker: curate
          text: 你这个小畜生，到底想干什么？
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 我想他说的是“小畜生”，可爱德华一直坚持，他当时骂的是“小魔鬼”。
        - id: ch02-b13
          speaker: harold
          text: 那你先放开我的耳朵！我就把庄严的真相告诉你！
          emotion: angry
        - id: ch02-b14
          speaker: curate
          text: 很好。现在说吧，能少撒一点谎，就少撒一点。
        - id: ch02-b15
          speaker: narrator
          text: 副牧师松开了手。我们等着听哈罗德解释，一点也不担心。可就连我们也没有料到，他竟有那么强的应变本领和那么丰富的想象力。
    - id: ch03
      title: 哈罗德的夜贼
      blocks:
        - id: ch03-b01
          speaker: harold
          text: 我刚刚做完祷告，无意间往窗外一望，草坪上的景象顿时叫我骨髓里的血都冻住了！一个夜贼正迈着蛇一样的脚步，悄悄逼近屋子！他满脸凶相，提着一盏遮光灯，还从头到脚武装到了牙齿！
        - id: ch03-b02
          speaker: narrator
          text: 我们听得津津有味。这套文风一点也不像哈罗德平常说话，却又莫名地叫人耳熟。
        - id: ch03-b03
          speaker: curate
          text: 说下去。
        - id: ch03-b04
          speaker: harold
          text: 那夜贼鬼鬼祟祟地走着，忽然停下，吹了一声低低的口哨。信号立刻得到回应，近旁的阴影里又溜出两条人影。那两个恶徒也都武装到了牙齿。
        - id: ch03-b05
          speaker: curate
          text: 精彩。继续。
        - id: ch03-b06
          speaker: harold
          text: 贼首跟两个作恶多端的同伙会合，用无声的语调交谈起来。他面目极其凶残，而且我刚才还应该说，他也武装到了牙齿。
        - id: ch03-b07
          speaker: curate
          text: 行了，别再管他的牙齿。你这张嘴已经够啰唆了。快点讲，赶紧讲完。
          emotion: angry
        - id: ch03-b08
          speaker: harold
          text: 我当时吓得魂不附体。就在这时候，客厅的窗户打开了，你和玛丽亚姑妈走了出来……我是说，现了身。那几个夜贼无声无息地消失在月桂树丛里，留下了骇人的暗示！
        - id: ch03-b09
          speaker: narrator
          text: 哈罗德一只手护着耳朵，讲得十分小心。副牧师倒有点糊涂了。这个故事一直讲得前后连贯，细节又说得头头是道。说到底，孩子也许真的看见过什么呢。
        - id: ch03-b10
          speaker: narrator
          text: 可怜的副牧师哪里知道，这篇鬼话全是从我们最近借来的一本一便士惊险小说里随意改出来的。那本书是擦靴子兼磨刀的伙计借给我们的。其实，哈罗德那套纯洁高雅的措辞，本该给副牧师一点提示。
        - id: ch03-b11
          speaker: curate
          text: 既然看见了夜贼，你为什么不向屋里报警？
        - id: ch03-b12
          speaker: harold
          text: 因为我害怕呀。我怕他们也许不肯相信我！
        - id: ch03-b13
          speaker: aunt_maria
          text: 可你这个淘气的小男孩，究竟是怎么下到这里来的？
        - id: ch03-b14
          speaker: narrator
          text: 哈罗德一下被逼到了绝境，而且逼他的偏偏还是自己的亲骨肉。
    - id: ch04
      title: 月桂树里的口哨
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 就在这时，爱德华碰了碰我的肩膀，悄悄钻进月桂树丛。走出大约十码，他吹出一声低低的口哨，我马上也吹了一声回应。效果简直像魔法。
        - id: ch04-b02
          speaker: narrator
          text: 玛丽亚姑妈尖叫着站起来。哈罗德惊慌地扫了一眼四周，随即像兔子一样逃走。他直冲后门，闯进正在吃晚饭的仆人中间，把自己埋进厨娘宽阔的胸膛。厨娘一向是他最要好的盟友。
        - id: ch04-b03
          speaker: narrator
          text: 副牧师转身面对月桂树，却迟迟没有走近，显然还在犹豫。玛丽亚姑妈一下扑到他身上。
        - id: ch04-b04
          speaker: aunt_maria
          text: 霍吉茨先生，您真勇敢！看在我的分上，可千万别冒险！
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 他果然没有冒险。片刻之后，我再探头看时，那里早已一个人影也没有。
        - id: ch04-b06
          speaker: narrator
          text: 屋里传出一家人战战兢兢往外走的动静。爱德华说，我们最好也赶快离开。撤退倒不难。先踩着一棵矮小的月桂树翻上花园围墙，再从围墙爬到外屋房顶，就能沿着那道陡得叫人心里没底的斜坡，回到杂物间窗口。
        - id: ch04-b07
          speaker: narrator
          text: 这条翻山越岭的路线，是家里的猫有一天透露给我们的。当时我们正在猎水獭。猫虽然不大情愿，却被派去扮演那只水獭，给我们逼得无路可走，只好从这里逃生。从那以后，这条路线在眼下这种场合一直很有用。
        - id: ch04-b08
          speaker: narrator
          text: 等搜捕夜贼的喧闹声安静下来，我和爱德华早已躺回床上，只不过膝盖和手肘磨掉了几块皮。友善的厨娘也把哈罗德抱上楼来。他困得睁不开眼，嘴里还嚼着某种黏糊糊的东西。
    - id: ch05
      title: 勇敢的副牧师
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来，大家都说是副牧师临危不惧，才把夜贼吓跑了。这个说法来自玛丽亚姑妈，众人自然深信不疑，副牧师也因此赢得了许多赞誉。
        - id: ch05-b02
          speaker: narrator
          text: 几天以后，他又来喝下午茶。当时他正用副牧师的口气温吞吞地开着玩笑，说要拿走盘里最后一片黄油面包，得有多大的道德勇气。我觉得自己非说一句不可，便装作如在梦中，仿佛只是对着茫茫宇宙开口。
        - id: ch05-b03
          speaker: narrator
          text: 霍吉茨先生，您真勇敢！看在我的分上，可千万别冒险！
        - id: ch05-b04
          speaker: narrator
          text: 幸好，那天教区牧师也来作客，这给了我逃走的机会。只要到了开阔的地方，要躲开我那位穿长外套的朋友，一向不算太难。
