audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    harold:
      display_name: Harold
      tts:
        delivery: eager and earnest
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: spirited and direct
        timbre: clear and youthful
        pace: lively
        pitch: medium
    doctor:
      display_name: Doctor
      tts:
        delivery: genial and playfully solemn
        timbre: rich and reassuring
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Knights in the Orchard
      blocks:
        - id: ch01-b01
          speaker: harold
          text: >-
            Let's pretend we're Cavaliers and Roundheads. You can be a Roundhead!
        - id: ch01-b02
          speaker: narrator
          text: >-
            I was lying in the orchard with Harold and Charlotte, the three youngest of us. It was hot, it was merry June, and the long grass seemed richer in buttercups than ever before. Everywhere I looked, the day was green and gold. I felt far too lazy for a game full of shouting and running. I would rather lie still and wander alone through a sleepy make-believe world, all gold and green.
        - id: ch01-b03
          speaker: narrator
          text: >-
            So Harold's call to arms did not stir me.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Oh, bother. We played that yesterday. Besides, it isn't my turn to be a Roundhead.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But Harold would not give up.
        - id: ch01-b06
          speaker: harold
          text: >-
            Then we'll be Knights of the Round Table. I'll be Lancelot!
        - id: ch01-b07
          speaker: narrator
          text: >-
            I'm only playing if I can be Lancelot.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I did not mean it. Our games of Knights always began with this particular quarrel.
        - id: ch01-b09
          speaker: harold
          text: >-
            Oh, please! Whenever Edward is here, he always gets to be Lancelot. I haven't been Lancelot for weeks!
        - id: ch01-b10
          speaker: narrator
          text: >-
            I gave way with as much grace as I could manage.
        - id: ch01-b11
          speaker: narrator
          text: >-
            All right. I'll be Tristram.
        - id: ch01-b12
          speaker: harold
          text: >-
            But you can't be Tristram! Charlotte is always Tristram, and she won't play if anybody else takes him. Choose someone different today.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Charlotte said nothing. She only breathed hard and stared straight ahead. Tristram, the matchless hunter and harp player, was her own hero. She would sooner go sadly back to the stuffy schoolroom than watch somebody else play him badly.
        - id: ch01-b14
          speaker: narrator
          text: >-
            I don't mind. I'll be anyone. I'll be Sir Kay. Come on!
    - id: ch02
      title: Scarlet Through the Apple Boughs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Once again, the history of our country came alive. Armored knights rode through the greenwood in search of adventure and wrongs to put right. Bandits outnumbered us five to one, yet fled beaten to their caves. We rescued maidens, cut open dragons, and relieved giants all over the orchard of the extra heads they hardly needed. Palamides the Saracen waited for us beside the well. Sir Breuse Saunce Pite saw the skilled spear that had always been his terror and ruin, and ran away like a coward.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Then the tournament grounds rose again at Camelot, bright with silk and gold. Hooves made the earth tremble. Ash spears burst into splinters, and the sky rang with swords striking helmets. All day, victory swung back and forth. First one side seemed sure to win, then the other. At last Lancelot fought through the crowd, fierce and mighty. He easily knocked Sir Tristram down, stood over her, and threatened her with destruction. The Cornish knight forgot all the fame won in earlier battles and cried out in quite a different manner.
        - id: ch02-b03
          speaker: charlotte
          text: >-
            You're hurting me! And you're ripping my dress!
        - id: ch02-b04
          speaker: narrator
          text: >-
            Sir Kay rushed to the rescue. Then I stopped in the middle of a stride. Beyond the apple branches, something scarlet flashed in the distance. We heard the mixed tramp of many horses, with voices and laughter among them.
        - id: ch02-b05
          speaker: charlotte
          text: >-
            What is it?
        - id: ch02-b06
          speaker: narrator
          text: >-
            Charlotte sat up and shook out her curls. Lancelot abandoned the ringing tournament and trotted quickly toward the hedge. For one more moment I stood frozen. Then I understood.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Soldiers!
        - id: ch02-b08
          speaker: narrator
          text: >-
            I raced for the hedge, and Charlotte scrambled up and hurried after me.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The soldiers came down the road two by two at an easy walk. Their scarlet coats blazed before our eyes. Bits jingled, saddles gave delightful squeaks, and the men smoked short clay pipes as dust shone around them. The whole glorious troop clinked and clattered past. We jumped, shouted, and waved. The big, cheerful horsemen casually returned our salute.
        - id: ch02-b10
          speaker: narrator
          text: >-
            As soon as they had passed, we pushed through the hedge and ran after them. Soldiers did not belong to ordinary life. We had seen nothing like this since a winter afternoon nearly two years earlier. That day had been bare and gray, with wet fields and frost-bitten woods. Then the hounds had suddenly burst through a fence, crying out across the paddock, while hooves thundered and red coats flashed everywhere. This was better. Soldiers could only mean that fighting and bloodshed were near.
    - id: ch03
      title: In Search of a Battle
      blocks:
        - id: ch03-b01
          speaker: harold
          text: >-
            Is there going to be a battle?
        - id: ch03-b02
          speaker: narrator
          text: >-
            Harold was so excited that he could hardly keep up.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Of course there is. We've arrived just in time. Hurry!
        - id: ch03-b04
          speaker: narrator
          text: >-
            Perhaps I ought to have known better. Yet the pigs and poultry we spent most of our time with had taught us nothing about the peace that now covered our island. In the schoolroom, we were deep in the Wars of the Roses. And the old country tales said Cavaliers had once galloped up and down these very lanes from their quarters in the village. Those stories seemed proof enough. Here, now, were real soldiers that no one could mistake. If their business was not fighting, what else could it possibly be? Certain that battle lay ahead, we followed hard on their tracks.
        - id: ch03-b05
          speaker: harold
          text: >-
            Edward will be sorry he started that awful Latin lesson!
        - id: ch03-b06
          speaker: narrator
          text: >-
            It did seem terribly unfair. Edward, the most warlike of us all, was shut between four walls conjugating the verb amo. Selina, who always thrilled at the sight of a red coat, was struggling with ugly German words. Growing older, I reflected, came at a price.
        - id: ch03-b07
          speaker: narrator
          text: >-
            To our deep disappointment, the troop passed through the village without being attacked. I explained to the others that every cottage should have had firing holes and strong defenders. No one opposed the soldiers at all. Worse still, the soldiers behaved with what looked to me like a criminal lack of care.
        - id: ch03-b08
          speaker: narrator
          text: >-
            At the last cottage, a brief spark of common sense reached me. I turned sternly to Charlotte and ordered her home.
        - id: ch03-b09
          speaker: narrator
          text: >-
            She obeyed, but sorrowfully. She dragged her feet back, heavy-hearted because she would not see any brave men killed that day. Harold and I kept going. At every moment, we expected the hedges around us to crackle and spit deadly bullets.
    - id: ch04
      title: The Enemy
      blocks:
        - id: ch04-b01
          speaker: harold
          text: >-
            Who will the enemy be? Indians? Roundheads? What do you think?
        - id: ch04-b02
          speaker: narrator
          text: >-
            I considered this carefully. Harold always wanted a plain, certain answer. He had no patience for guesses.
        - id: ch04-b03
          speaker: narrator
          text: >-
            They won't be Indians, and they won't be Roundheads. Nobody has seen a Roundhead around here for a very long time. They'll be Frenchmen.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Harold looked disappointed.
        - id: ch04-b05
          speaker: harold
          text: >-
            Very well. Frenchmen will do. But I was hoping for Indians.
        - id: ch04-b06
          speaker: narrator
          text: >-
            If the enemy were Indians, I don't think I would keep going. When Indians capture you, they scalp you first and burn you at a stake afterward. Frenchmen never do anything like that.
        - id: ch04-b07
          speaker: harold
          text: >-
            Are you certain?
        - id: ch04-b08
          speaker: narrator
          text: >-
            Absolutely. Frenchmen only lock you inside a place called the Bastille. Someone sends you a file hidden in a loaf of bread. You cut through the bars, climb down a rope, and run for the coast while everyone shoots at you. They never hit you. Then you swim out to a British frigate, and you're safe!
        - id: ch04-b09
          speaker: narrator
          text: >-
            Harold cheered up. This sounded like a rather attractive adventure.
        - id: ch04-b10
          speaker: harold
          text: >-
            If they try to capture us, we aren't going to run away, are we?
        - id: ch04-b11
          speaker: narrator
          text: >-
            Meanwhile, the cowardly enemy was taking a long time to appear. We had reached strange, foreign country. It seemed so uncivilized that lions might roam there after dark. A pain had begun to stab my side, and both Harold's stockings had fallen down.
        - id: ch04-b12
          speaker: narrator
          text: >-
            I was starting to doubt the famous courage of the French when the officer called an order. The men drew close together and broke into a trot. They were already far ahead, and now they vanished. My heart sank. I began to suspect that we had been tricked.
        - id: ch04-b13
          speaker: harold
          text: >-
            Are they charging?
        - id: ch04-b14
          speaker: narrator
          text: >-
            Harold was tired, but he bravely found fresh hope.
        - id: ch04-b15
          speaker: narrator
          text: >-
            I don't think so. Before a charge, the officer always gives a speech. Then the soldiers draw their swords and the trumpets sound. But let's take a shortcut. We may still catch them.
    - id: ch05
      title: Hopelessly Lost
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            We cut across the fields, reached another road, and pounded along it. Then we crossed still more fields. We were panting and discouraged, but we kept hoping. The sun disappeared. A fine drizzle began to fall. Soon we were muddy, breathless, and almost too tired to move, yet we stumbled onward.
        - id: ch05-b02
          speaker: narrator
          text: >-
            At last we came to a road more brutally and cruelly unfamiliar than any road I had ever seen. Its stubborn white face offered no friendly sign, no direction, and not the smallest hint of help. We looked at it, but there was no longer any use pretending. We were hopelessly lost.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The fine, small rain continued steadily, and evening drew closer. There are moments when a fellow has every right to cry. This was certainly one of them. I would have cried myself if Harold had not been there. That proper-minded child believed an older brother was almost a god. I could see that with me beside him, he felt as safe as if a whole brigade of guards surrounded him with protecting bayonets. I could not let him see my fear. Most of all, I dreaded that he might begin asking questions again.
        - id: ch05-b04
          speaker: narrator
          text: >-
            I stared at the silent countryside as if it might answer me. Then I heard wheels coming closer. Hope stirred, and turned to delight when I recognized the old doctor's carriage. He knew us, stopped, jumped down, and greeted us cheerfully. Harold ran straight to him.
        - id: ch05-b05
          speaker: harold
          text: >-
            Have you been to the battle? Was it a good fight? Who won? Did many people get killed?
        - id: ch05-b06
          speaker: narrator
          text: >-
            The doctor looked puzzled, so I quickly explained everything.
        - id: ch05-b07
          speaker: doctor
          text: >-
            Ah, I understand. Well, there won't be a battle today. They have postponed it because the weather changed. You will be properly informed when the fighting begins again. For now, climb into the carriage and I'll take you home. What a wild chase you've had! Why, either of you might have been captured and shot as a spy!
    - id: ch06
      title: The Road Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            That particular danger had never crossed our minds. The very thought made the carriage cushions feel warmer and more safely like home as we nestled into them and rolled away.
        - id: ch06-b02
          speaker: narrator
          text: >-
            All through the journey, the doctor kept us spellbound with terrifying tales of his own adventures in military camps and fields. To hear him tell it, he had followed the life of a soldier in every corner of the world. With those stories filling the carriage, the lost roads and the rain no longer mattered so much.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Time destroys all beautiful things, and later it showed us that those stories had no foundation at all. But what did that matter? Some things are higher than truth. By the time the doctor set us down at our gate, we had almost forgiven the battle for being postponed.
