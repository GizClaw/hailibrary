audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真笃定，思考时一本正经，带着朴素幽默
        timbre: 柔和稚嫩的男孩声
        pace: 稍慢，句间有思索感
        pitch: 中高
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 认真敏感，抱怨时直率，想象中带着谨慎
        timbre: 清亮稚嫩
        pace: 自然偏快，犹豫时放慢
        pitch: 中高
    doctor:
      display_name: 医生
      tts:
        delivery: 亲切诙谐，故作严肃时藏着笑意
        timbre: 浑厚温暖，令人安心的年长男声
        pace: 从容，讲故事时张弛有致
        pitch: 中低
  chapters:
    - id: ch01
      title: 果园里的圆桌骑士
      blocks:
        - id: ch01-b01
          speaker: harold
          text: 咱们来假装是保王党和圆颅党吧。你当圆颅党！
        - id: ch01-b02
          speaker: narrator
          text: 我懒洋洋地躺在果园里，压根儿不想响应这声召唤。我和哈罗德、夏洛特是家里最小的三个，此刻正四肢摊开，舒舒服服地躺在草地上。那是暖烘烘的六月，浓密的草丛里，毛茛花开得从未有过的繁盛。放眼望去，到处都是绿色和金色。
        - id: ch01-b03
          speaker: narrator
          text: 我宁愿安安静静地躺着，让自己脱去外壳，做个无牵无挂的闲人，溜进一片睡意蒙眬的想象世界。那里满眼都是绿色和金色，可比那种又喊又跑、闹得满头大汗的游戏舒服多了。
        - id: ch01-b04
          speaker: narrator
          text: 真没劲，昨天才玩过这个。再说，这回怎么也轮不到我当圆颅党。
        - id: ch01-b05
          speaker: narrator
          text: 可哈罗德不肯罢休。
        - id: ch01-b06
          speaker: harold
          text: 那咱们就当圆桌骑士。我要当兰斯洛特！
        - id: ch01-b07
          speaker: narrator
          text: 要是不让我当兰斯洛特，我就不玩。
        - id: ch01-b08
          speaker: narrator
          text: 其实我并不真想当他。只不过我们每次玩骑士游戏，总要先争上一回。
        - id: ch01-b09
          speaker: harold
          text: 求求你啦！爱德华只要在家，就总是他当兰斯洛特。我都好几个星期没当过了！
        - id: ch01-b10
          speaker: narrator
          text: 我很有风度地让了步，说那我就当特里斯坦。
        - id: ch01-b11
          speaker: harold
          text: 那也不行！夏洛特一直都当特里斯坦。别人抢了这个角色，她就不肯玩。你今天换个人吧。
        - id: ch01-b12
          speaker: narrator
          text: 夏洛特没开口，只是呼哧呼哧地喘气，眼睛直望前方。特里斯坦既是举世无双的猎手，又会弹竖琴，是她最钟爱的传奇英雄。与其眼看别人糟蹋这个角色，她宁愿伤心地回到闷热的教室。
        - id: ch01-b13
          speaker: narrator
          text: 我说自己才不在乎，当谁都行。既然兰斯洛特和特里斯坦都有人了，那我就当凯爵士。角色总算分定，我们立刻出发。
    - id: ch02
      title: 苹果树枝外的鲜红
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 转眼间，这片国土上的历史又活了过来。身披锁子甲的骑士在葱郁林间穿行，寻找奇遇，匡扶正义。人数多出五倍的强盗被我们击溃，狼狈地逃回洞穴。姑娘获救了，恶龙被开了膛，果园各处的巨人也都丢掉几颗本来就多余的脑袋。
        - id: ch02-b02
          speaker: narrator
          text: 撒拉逊骑士帕拉米德斯在井边等着我们。无情的布鲁斯爵士一看见那支枪便胆战心惊。那是他命中注定的克星，他只好怯懦地转身，落荒而逃。
        - id: ch02-b03
          speaker: narrator
          text: 卡梅洛特又摆下比武场。丝绸和黄金灿然闪耀，到处喜气洋洋。马蹄如雷，震得大地发颤。梣木长枪炸成碎片，长剑劈上头盔，铿锵声一直响到天空。整整一天，胜负一会儿倒向这边，一会儿又转去那边，怎么也分不出来。
        - id: ch02-b04
          speaker: narrator
          text: 最后，威武可怕的兰斯洛特冲出重围，轻易挑落特里斯坦，还跨立在她身上，扬言要取她性命。那位康沃尔骑士立刻忘了从前苦战换来的赫赫威名，凄声喊了起来。
        - id: ch02-b05
          speaker: charlotte
          text: 你弄疼我了！我告诉你，你还把我的连衣裙扯坏了！
        - id: ch02-b06
          speaker: narrator
          text: 凯爵士正飞身赶来相救，却突然停住了。我透过苹果树枝，看见远处闪过一抹鲜红。杂沓的马蹄声里，还夹着说话和欢笑。
        - id: ch02-b07
          speaker: charlotte
          text: 那是什么？
        - id: ch02-b08
          speaker: narrator
          text: 夏洛特坐起来，抖开卷发。哈罗德已经撇下比武场，小跑到树篱边。我又愣了一瞬，终于明白了。
        - id: ch02-b09
          speaker: narrator
          text: 是士兵！我大叫一声，直奔树篱。夏洛特也赶紧爬起来，跟在后面。
        - id: ch02-b10
          speaker: narrator
          text: 士兵沿大路走来，两人一排，马儿缓缓迈步。鲜红的军服耀眼生辉，嚼环叮叮当当，马鞍快活地吱呀作响。尘雾围着骑兵，他们叼着短陶烟斗，一个个都像英雄。
        - id: ch02-b11
          speaker: narrator
          text: 整支队伍铿锵而过，我们又喊又跳，拼命挥手。那些高大快活的骑兵也随意向我们回礼。队伍一过去，我们便钻过树篱追了上去。
        - id: ch02-b12
          speaker: narrator
          text: 士兵可不是日常生活里常见的东西。上一次有这样的场面，还是前年冬天。那个下午，树叶已经落尽，泡透雨水的休耕地和冻伤的矮林全是一个灰暗颜色。猎犬忽然发出浑厚的叫声，冲破篱笆。顷刻间，牧场上到处是隆隆蹄声和闪动的红衣。
        - id: ch02-b13
          speaker: narrator
          text: 可今天更好。既然来了士兵，就只可能说明一件事：厮杀和流血已经近在眼前。
    - id: ch03
      title: 追寻一场战斗
      blocks:
        - id: ch03-b01
          speaker: harold
          text: 真的要打仗了吗？
        - id: ch03-b02
          speaker: narrator
          text: 哈罗德兴奋得几乎跟不上。我告诉他当然要打，我们赶得正是时候。
        - id: ch03-b03
          speaker: narrator
          text: 也许我本该懂得更多。可我们平日只跟猪和家禽来往，它们从没告诉过我们，这片海水环抱的国土正太太平平。教室里，我们刚好学到玫瑰战争。乡间传说又说，保王党人从前就驻扎在村里，在这些小路上来回驰骋。
        - id: ch03-b04
          speaker: narrator
          text: 眼前明明就是士兵，谁也不可能认错。他们若不是来打仗，还能来做什么？我们越想越觉得有理，仿佛已经闻到了战斗的喜悦，便沿着他们留下的足迹紧追不放。
        - id: ch03-b05
          speaker: harold
          text: 爱德华偏偏去学那讨厌的拉丁文。他知道了该多后悔呀！
        - id: ch03-b06
          speaker: narrator
          text: 这实在太不公平。爱德华是我们中间最好战的人，此刻却关在屋里，没精打采地变位着 AMO。塞琳娜每次看见红军服都会激动得发颤，如今也只能跟难听的德语苦苦搏斗。看来长大确实是要受惩罚的。
        - id: ch03-b07
          speaker: narrator
          text: 骑兵平安穿过村子，让我们大失所望。我认真向同伴指出，每座村舍本该凿好枪眼，再派人严密把守。可谁也没有抵抗。那些士兵自己也毫无防备，行动既鲁莽又不谨慎。在我们看来，这样粗心简直就是犯罪。
        - id: ch03-b08
          speaker: narrator
          text: 到最后一座村舍时，一点常识忽然在我脑中亮了亮。我严厉地命令夏洛特回家。
        - id: ch03-b09
          speaker: narrator
          text: 她虽然听话，却伤心极了。想到今天看不成那些英勇的汉子战死，她心里沉甸甸的，拖着不情愿的脚步往回走。我和哈罗德仍坚定地继续追赶，随时等着四周的树篱噼啪作响，向士兵喷出致命的铅弹。
    - id: ch04
      title: 迟迟不来的敌人
      blocks:
        - id: ch04-b01
          speaker: harold
          text: 敌人会是印第安人吗？还是圆颅党？到底会是谁？
        - id: ch04-b02
          speaker: narrator
          text: 我认真想了想。哈罗德要的是干脆肯定的答案，可不接受吞吞吐吐的猜测。
        - id: ch04-b03
          speaker: narrator
          text: 不会是印第安人，也不会是圆颅党。这里很久没见过圆颅党了。敌人一定是法国人。
        - id: ch04-b04
          speaker: harold
          text: 好吧，法国人也行。可我本来真希望他们是印第安人。
        - id: ch04-b05
          speaker: narrator
          text: 我告诉他，要真是印第安人，我可能就不再往前走了。他们捉住俘虏，会先剥头皮，再把人绑在木桩上烧死。法国人可不干这种事。
        - id: ch04-b06
          speaker: harold
          text: 你真的敢肯定吗？
        - id: ch04-b07
          speaker: narrator
          text: 我当然敢。法国人只会把你关进一个叫巴士底狱的地方。有人把锉刀藏在面包里送进来，你就锉断铁栏杆，顺绳子滑下去。
        - id: ch04-b08
          speaker: narrator
          text: 他们会朝你开枪，可是一枪也打不中。你拼命跑到海边，游上一艘英国护卫舰，这不就得救了吗？
        - id: ch04-b09
          speaker: narrator
          text: 哈罗德重新高兴起来。这个安排听着相当诱人。
        - id: ch04-b10
          speaker: harold
          text: 要是他们想抓咱们当俘虏，咱们不会逃跑，对吧？
        - id: ch04-b11
          speaker: narrator
          text: 可怯懦的敌人迟迟不肯出现。我们越走越远，已经追进一片陌生异乡。那里荒蛮未开，仿佛天黑后就会有狮子出来游荡。我的肋下开始一下下抽痛，哈罗德两只长袜也全滑了下来。
        - id: ch04-b12
          speaker: narrator
          text: 正当我怀疑法国人是否真像传说中那么勇敢，军官忽然发出口令。士兵们收拢队形，小跑起来。他们本已远在前面，转眼便不见了。我的心直往下沉，开始怀疑我们受了骗。
        - id: ch04-b13
          speaker: harold
          text: 他们是在冲锋吗？
        - id: ch04-b14
          speaker: narrator
          text: 哈罗德虽已累坏，还是英勇地振作起来。我迟疑着说，大概不是。冲锋以前，军官总要发表演说，士兵会拔剑，号角也会吹响。
        - id: ch04-b15
          speaker: narrator
          text: 不过，我们还可以抄近路，说不定赶得上。
    - id: ch05
      title: 迷路与延期的战事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我们抄过田野，冲上另一条路，沿着它拼命跑，又越过更多田地。我们喘得厉害，越来越泄气，却仍盼着事情会有好结果。太阳躲进云后，细雨开始飘落。很快，我们浑身是泥，上气不接下气，几乎累得走不动，却还跌跌撞撞地往前赶。
        - id: ch05-b02
          speaker: narrator
          text: 最后，我们来到一条无比陌生的路。我生平从没见过哪条路像它这样蛮横又冷酷。那张顽固惨白的脸上，找不到半点友善的指引，更没有一丝愿意帮忙的表示。再也骗不了自己了，我们彻底迷路了。
        - id: ch05-b03
          speaker: narrator
          text: 细雨不停，暮色渐浓。有些时候，一个人哭出来也是完全应该的。若不是哈罗德在旁边，我早就哭了。
        - id: ch05-b04
          speaker: narrator
          text: 可这个心地端正的孩子把哥哥当成真正的神。有我在，他就觉得万无一失，仿佛整整一个近卫旅正排在四周，用刺刀护着他。我不能让他看出我也害怕。更叫我心惊的是，他随时可能又开始问个不停。
        - id: ch05-b05
          speaker: narrator
          text: 我默默望着毫无回应的四野，仿佛大自然能给我一个答案。忽然，车轮声越来越近，我心里又有了希望。等我认出驶来的正是老医生那辆熟悉的马车，希望一下变成了狂喜。
        - id: ch05-b06
          speaker: narrator
          text: 要是真有哪位神仙会从舞台机关里降下来搭救人，那一定就是这位上天送来的朋友。他认出了我们，赶紧停下马车，跳到地上，快活地招呼。哈罗德立刻冲过去。
        - id: ch05-b07
          speaker: harold
          text: 你去过战场了吗？打得痛快吗？谁赢了？死了很多人吗？
        - id: ch05-b08
          speaker: narrator
          text: 医生听得一头雾水。我赶紧把事情解释了一遍。他故意摆出严肃的脸，左扭一下，右扭一下。
        - id: ch05-b09
          speaker: doctor
          text: 我明白了。实情是，今天不打仗啦。天气变了，所以战事延期。等重新开战，自然会及时通知你们。
        - id: ch05-b10
          speaker: doctor
          text: 现在快上车，我送你们回家。你们闹得可真够厉害！说不定早就让人当成奸细，抓去枪毙了！
        - id: ch05-b11
          speaker: narrator
          text: 这份格外惊险的危险，我们先前连想都没想过。它让我们心里怦怦直跳，也让回家的马车显得更加亲切。我们窝进柔软的坐垫，随着车轮一路向家滚去，只觉得从没这么温暖安稳过。
        - id: ch05-b12
          speaker: narrator
          text: 一路上，医生用一段又一段毛骨悚然的亲身战地奇遇哄我们开心。照他的说法，他仿佛干了一辈子军人，跟着军队走遍了世界每个角落。
        - id: ch05-b13
          speaker: narrator
          text: 后来，摧毁一切美好事物的时间还是揭穿了这些传说。我们终于知道，那些英勇奇遇全无根据。可那又有什么关系？没有根据又能怎么样？世上毕竟还有比真相更高的东西。
        - id: ch05-b14
          speaker: narrator
          text: 等马车一路滚到家门口，把我们平安放下时，我们差不多已经接受了战事延期这回事。
