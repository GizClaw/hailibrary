audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    rector:
      display_name: 教区牧师
      tts:
        delivery: 谦和郑重，谈起学问便热烈忘我
        timbre: 温厚而略显飘忽的老年男声
        pace: 平日舒缓，论学时渐快
        pitch: 中低
    housekeeper:
      display_name: 女管家
      tts:
        delivery: 庄重务实，不动声色却不容忽视
        timbre: 清晰沉稳的成年女声
        pace: 平稳简洁
        pitch: 中
    tramp:
      display_name: 流浪汉
      tts:
        delivery: 粗鲁油滑，求乞时拖腔，恼怒时毫不收敛
        timbre: 沙哑粗粝的成年男声
        pace: 求乞时缓慢，咒骂时急促
        pitch: 中低
  chapters:
    - id: ch01
      title: 麦茬海上的战舰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一年已经走到满目金黄的时节，大自然的面孔像一幅古金色的画。若用纹章上的话来说，眼前是“金色田野，遍撒同色禾捆”。这也许不合纹章学的规矩，大自然的纹章原本就常常不合规矩，可我和爱德华站在草垛场门口望见的，确实就是这样一片景象。
        - id: ch01-b02
          speaker: narrator
          text: 哈罗德没有在这一幕里登场。他正病恹恹地躺在长椅上，照例又闹起了肚子。前一天傍晚，爱德华难得和气了一回，替我刻了一盏芜菁灯。他掏芜菁的本事格外高明，小刀一下下挖进去，带香气的碎块便纷纷飞出来。哈罗德把这些碎块都当作自己应得的赏赐，吃了不少，如今只好认命，再让药剂师尽力帮忙。
        - id: ch01-b03
          speaker: narrator
          text: 我和爱德华知道，这块田里的庄稼今天就要运完。我们先从草垛场坐着空马车回到禾捆那边，再费力走回来，然后重新登上这些驶过麦茬海洋、颠簸在波浪般田野上的大船。对两个住在内陆的小淘气来说，这已经最接近航海了。
        - id: ch01-b04
          speaker: narrator
          text: 于是，格伦维尔爵士率领“复仇号”血战、硝烟缭绕的尼罗河海战，还有纳尔逊之死，都在这些尘土飞扬、一路摇晃碰撞的后甲板上轮番演过。又一辆马车卸完禾捆，颠簸着驶出草垛场大门。我们大喊着攀住车尾，翻了进去。
        - id: ch01-b05
          speaker: narrator
          text: 爱德华先爬上车。我刚站稳，他就把我死死扭住，宣布我是私掠船上的水手，他则是英国“忒耳普西科瑞号”巡防舰的舰长。至于舰上究竟有多少门炮，我已经记不清了。爱德华总把最好的角色抢给自己，不过我奋勇抵抗，一点也没落下风。
        - id: ch01-b06
          speaker: narrator
          text: 可我忽然发现，脚下这片战场爬满了蠼螋。我尖叫起来，猛地挣脱爱德华，翻过车尾板滚到麦茬地里。他在渐渐远去的战舰甲板上跳起胜利之舞，我才不在乎。我知道，他也知道，我怕的不是他，而是蠼螋。这些“田野上的致命毒虫”，我怕得要命。
        - id: ch01-b07
          speaker: narrator
          text: 我任他远去，听他扯开嗓门召集全体船员抵抗登船的敌人，自己转身朝内陆走去，沿路逛进了村子。这里不是我们的村子，而是一处至少相隔一英里的异乡。这趟远征，也就有了一点冒险的意味。
        - id: ch01-b08
          speaker: narrator
          text: 我尝到了旅行者那种既体面又不安的滋味。体面，是因为路人会转头好奇地打量你。不安，是因为村里的孩子随时可能朝你扔点什么，年幼的一辈从来最守旧。独自远行让我把鼻子翘得比平时更高。我心想，蒙戈·帕克穿行在没有道路的非洲森林里，大概也正是这样。接着，我一头撞上了一件柔软却不肯让路的东西。
    - id: ch02
      title: 心不在焉的牧师
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这一撞把我从幻想里唤醒。我连忙退后，两只胳膊肘高高举起护住耳朵，这是每个男孩子遇上这种事都会摆出的架势。站在面前的是一位高大的老先生，脸刮得干净，身穿洗旧的黑衣，显然是位牧师。
        - id: ch02-b02
          speaker: narrator
          text: 他眼里有种遥望远方的神情，仿佛平时总看着另一个层面的事物，突然被叫回尘世，一时还看不清眼前。他的身子也歉疚地弯着。
        - id: ch02-b03
          speaker: rector
          text: 万分抱歉，先生。我实在太心不在焉了，还请您原谅。
        - id: ch02-b04
          speaker: narrator
          text: 多数男孩子听见这种郑重的称呼，准会怀疑对方是在取笑自己。可我立刻明白，这个人把所有同胞都当作绅士，不分犹太人或异邦人，也不分洁净或不洁净。我很为自己的眼力得意，当然马上把过错揽到身上。
        - id: ch02-b05
          speaker: narrator
          text: 其实是我撞上您的。我也常常心不在焉。
        - id: ch02-b06
          speaker: rector
          text: 看来我们有一点相同之处。我这个老人做的是梦，你这个少年看见的是异象。你的命运更幸福。
        - id: ch02-b07
          speaker: narrator
          text: 他的手一直搭在一扇小门上。
        - id: ch02-b08
          speaker: rector
          text: 谁都看得出，你很热。天色也不早了，黄道十二宫正行至室女宫。倘若你的安排容许，也许我可以请你吃一点粗茶淡饭。
        - id: ch02-b09
          speaker: narrator
          text: 我那天下午唯一的安排是上算术课，而我本来就没打算去，于是走进门里。他彬彬有礼地扶着门，低声吟了一句拉丁诗。
        - id: ch02-b10
          speaker: rector
          text: 暮星升起，走吧，小羊儿们。来吧，小山羊！
        - id: ch02-b11
          speaker: narrator
          text: 他随即再三道歉，说这种过分亲昵的称呼不该怪他，该怪那位罗马诗人。一条笔直的石板小径通向清凉幽静的老屋。他一路在这株玫瑰前停停，又在那株旁边看看，至少两次把我忘得一干二净。每次回过神来，他都谦卑地赔上一番不是。
        - id: ch02-b12
          speaker: narrator
          text: 趁着这些空当，我终于认出他就是本教区的牧师。他是个单身汉，性情古怪，学问高深得吓人，身边已经结起了一层传说。我尤其敬畏他，因为据说他写过一本真正的书。玛莎说他写过一大堆，可玛莎的话该打几折，我心里清楚得很。
    - id: ch03
      title: 会唱歌的钢琴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我们穿过昏暗的门厅，走进一个房间。我一眼就认定，这正是我一直寻找的理想天地。没有女人家那些华而不实的零碎，没有椅背罩布，也没有装饰垫。谁都看得出来，这个人头上没有姑妈压着。
        - id: ch03-b02
          speaker: narrator
          text: 三面墙都排满厚重的皮面书和羊皮书，椅子和桌子上也到处横躺着、蜷伏着书。油墨和封皮的气息从书堆里散出来，上面又浮着一缕淡淡的烟草香。那气味最能鼓舞人心，简直像漂泊异乡的旅人忽然看见英国国旗在头顶迎风飘扬，那面解放人的古老旗帜。房间一角还摆着一架钢琴，当然也堆满了书。
        - id: ch03-b03
          speaker: narrator
          text: 我一看见钢琴，就欢喜得尖叫起来。
        - id: ch03-b04
          speaker: rector
          text: 想胡乱弹一通吗？
        - id: ch03-b05
          speaker: narrator
          text: 他问得那么自然，目光却已经飘向另一边。那里的书本和大张稿纸堆成一片阿尔卑斯山，底下只露出几小块写字台。
        - id: ch03-b06
          speaker: narrator
          text: 我真的可以吗？在家里，他们只准我弹那些讨厌透顶的练习曲！
        - id: ch03-b07
          speaker: rector
          text: 不管怎样，在这里你尽可以乱弹。
        - id: ch03-b08
          speaker: narrator
          text: 他心不在焉地念叨着“来吧，说支拉丁歌，竖琴啊，唱起来吧”，随后仿佛受本能指引，朝那张无法抗拒的写字台走去。不到十秒，他已经消失在视线和呼唤之外。
        - id: ch03-b09
          speaker: narrator
          text: 一本大书摊在他膝头，一本支在面前，身边还摆着二十来本。他读一会儿，记几笔，专心得近乎狂热。就算我远在彼奥提亚，他也不会比现在更察觉不到我。于是，我满心轻快地弹了起来。
        - id: ch03-b10
          speaker: narrator
          text: 有些人双脚流着血，艰难地攀过一座座峭壁，终于征服了乐器，可他们也从此失去了胡乱弹奏的狂喜。他们从和声里得到快乐，也懂得每个音符同别的音符有什么关系。只有乱弹的人，才真正听见每一个音本身纯粹的模样。
        - id: ch03-b11
          speaker: narrator
          text: 有的音里装着整片大海，有的响着大教堂的钟声。有的带来树林里的欢欣和青草气，有的让森林神跟着芦笛起舞，连庄严的半人马也从洞里探出头来。有的携来月光，有的藏着玫瑰花心的殷红。有的是蓝色，有的是红色，还有的会讲起一支举着丝绸旗帜、踏着进行曲前进的大军。
        - id: ch03-b12
          speaker: narrator
          text: 在这一串联想上方，白色小人儿不断跳起、探头，竭力挣脱囚住它们的琴弦。整个巨大的红木箱嗡嗡作响，像装满了一窝结巢的蜜蜂。
    - id: ch04
      title: 学问与下午茶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我陶醉得筋疲力尽，停下来歇了一会儿，正好越过一本大开本书的边沿，迎上了牧师的目光。他突然开口，好像我们一直在谈这个问题。
        - id: ch04-b02
          speaker: rector
          text: 说到这些德国人，我承认，他们有学问。可是那一点灵光呢？精微的领悟呢？幸运的直觉呢？这些都上哪儿去了？他们全是从我们这里拿走的！
        - id: ch04-b03
          speaker: narrator
          text: 他们根本没有从我们这里拿走任何东西。
        - id: ch04-b04
          speaker: narrator
          text: 我说得斩钉截铁。听见“德国人”三个字，我只想到了德国乐队，而伊莱扎姑妈一向恨透了他们。
        - id: ch04-b05
          speaker: rector
          text: 你不这样想？这么年轻的批评家，居然能如此公允克制，我实在赞赏。这两种品质出现在年轻人身上，既难得，又可喜。不过，你且看看施伦普菲乌斯吧。眼前这一段里，一个简简单单的希腊词γάρ，竟让他左冲右突，苦斗不休！
        - id: ch04-b06
          speaker: narrator
          text: 我害怕地从敞开的门口朝外看，半是担心门垫上正发生一场蜿蜒扭动、怪兽般的搏斗。可四下安安静静，我看不出过道上有什么麻烦，就照实说了。
        - id: ch04-b07
          speaker: rector
          text: 正是！你天生就有学者的才具，而且得来如此幸运，当然一点困难也看不见。可是对这个施伦普菲乌斯来说……
        - id: ch04-b08
          speaker: narrator
          text: 幸亏这时候女管家进来了。她衣着整洁，神情庄重。
        - id: ch04-b09
          speaker: housekeeper
          text: 您的茶已经摆在花园里了。我还给小先生放了几块蛋糕和别的吃食。您最好趁茶没凉就喝掉。
        - id: ch04-b10
          speaker: narrator
          text: 她的口气像在纠正一处错误的校勘。牧师挥挥手，仍旧来回踱步，拿着一个希腊语不定过去时，在我这颗无辜的脑袋上方挥舞。女管家不动声色地等到他的议论稍稍停顿，又说了一遍。
        - id: ch04-b11
          speaker: housekeeper
          text: 您最好趁茶没凉就喝掉。
        - id: ch04-b12
          speaker: narrator
          text: 可怜的牧师歉疚地看了看我。
        - id: ch04-b13
          speaker: rector
          text: 喝一点茶，也许倒挺不错。
        - id: ch04-b14
          speaker: narrator
          text: 他终于领我去了花园，我大大松了口气。我四下找不到女管家说的那位“小先生”，便断定他大概也心不在焉，于是毫无顾虑地向那些蛋糕和别的吃食发起进攻。那顿茶点吃得极为成功，也极有学问。饭后发生的一件小事，却始终没有从我的记忆里彻底脱落。
    - id: ch05
      title: 弯下腰才能看见
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我们坐在临大路的凉亭里交谈。一个衣衫肮脏的流浪汉拖着脚走进视野，身后跟着一个头发蓬乱的女人和一条杂种狗，活像两颗卫星。他一看见我们，立刻拉开职业乞丐的哀腔。
        - id: ch05-b02
          speaker: narrator
          text: 我打心眼里同情牧师，因为我早从玛莎那里听说，而且人人都这么传，他每天到了这个时候必定身无分文。早晨出门时，他的口袋总是满的，傍晚回来，身上准连一个苏也不剩。
        - id: ch05-b03
          speaker: rector
          text: 实在抱歉，我今天出门时确实带了钱，可到了这时候，已经一文也不剩了。
        - id: ch05-b04
          speaker: narrator
          text: 他把自己的情形详详细细解释了一遍，态度彬彬有礼，甚至十分惭愧，仿佛有错的是自己。那位道路上的绅士终于明白，这回毫无希望，便痛痛快快地咒骂起来。
        - id: ch05-b05
          speaker: tramp
          text: 你这双眼睛、这张脸、这副手脚，还有你干的行当、你那一家子和你周围的一切，全都该死！
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: 他把牧师从头到脚、从职业到亲戚都骂遍了，随后拖着脚离开，沿路还不断渗出恶意与污秽。我们望着他们走到转弯处。女人显然累了，停下脚步。流浪汉照自己的身份又骂了几句，接着替她拿过包袱，让她挽住胳膊。那口气里竟有几分粗糙的好意，动作间甚至依稀透出一点温柔。脏兮兮的狗也爬到近前，舔了一下她的手。
        - id: ch05-b07
          speaker: narrator
          text: 牧师把一只手轻轻压在我的肩上。
        - id: ch05-b08
          speaker: rector
          text: 你瞧，我们所说的爱，这件奇妙的东西，竟会在最不可能的地方活着，闪出光来！你清晨去过田野吗？放眼望去，处处都是荒瘠的土地。可只要弯下腰，让光斜着照过来，你就会看见整片田野全覆着银色的蛛丝网。
        - id: ch05-b09
          speaker: rector
          text: 这件奇妙之物的仙丝也是一样，从下面穿过整个世界，把万物连在一起。它不是那位手执致命弓箭、不可抗拒的古老爱神，不是ἔρως ἀνίκατε μάχαν。它甚至也不是那种安稳、体面的亲情之爱στοργή，而是某种至今没有名字的东西，也许更神秘，更接近神圣。
        - id: ch05-b10
          speaker: rector
          text: 只是你非得弯下腰，才能看见它，老朋友。你一定得弯下腰啊！
        - id: ch05-b11
          speaker: narrator
          text: 露水正在降下，暮色也渐渐合拢。我沿着大路轻快地小跑回家。上下四方，处处都是寂寥的空旷。
        - id: ch05-b12
          speaker: narrator
          text: 唯有长庚星独自悬在天上，清澈无瑕，远得无法形容，仿佛与尘世隔绝。可不知为什么，它那勇敢的孤独，却给了我无穷的鼓舞。
