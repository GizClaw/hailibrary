  chapters:
    - id: ch01
      title: The Stubble Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The year had reached its yellow season, and Nature wore the colour of old gold. Edward and I stood at the rickyard gate, looking across a field where the sheaves matched the stubble. Harold was missing from the scene. He lay indoors with his usual sort of stomach trouble.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The evening before, Edward had been unusually kind and carved me a turnip lantern. He was very good at that sort of work. As his knife hollowed the turnip, scented pieces flew out, and Harold ate a great many of them. He always considered such scraps his rightful share. Now he was paying for it, with whatever help the chemist could give him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Edward and I knew this field was being harvested that day. We had the glorious privilege of riding the empty wagons from the rickyard back to the sheaves. Then we trudged home on foot and waited to race out again across the rolling acres in those great ships of the stubble sea.
        - id: ch01-b04
          speaker: narrator
          text: >-
            For inland boys, it was as close to sailing as we could come. Those dusty decks had already carried us through the last fight of Sir Richard Grenville aboard the Revenge, the smoke-wrapped Battle of the Nile, and the death of Nelson. The wagons swayed and bumped across the field while every battle played out.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Another wagon tipped out its load and jolted through the gate. We shouted, caught the tail, and swung ourselves aboard. Edward climbed up first. The moment I found my feet, he seized me in a deadly grip.
        - id: ch01-b06
          speaker: edward
          text: >-
            You're a privateer, and I'm captain of the British frigate Terpsichore!
        - id: ch01-b07
          speaker: narrator
          text: >-
            He also named the exact number of guns, though I have forgotten it. Edward always took the finest role for himself. Still, I fought him bravely until I noticed that the floor beneath us was crawling with earwigs.
        - id: ch01-b08
          speaker: narrator
          text: >-
            I shrieked, tore myself free, and tumbled over the tailboard onto the stubble. Edward danced in triumph on the deck as his ship rolled away. I did not care. He knew I was not afraid of him. He also knew I was terribly afraid of earwigs, those deadly bugs of the field.
        - id: ch01-b09
          speaker: edward
          text: >-
            All hands, repel the boarders!
        - id: ch01-b10
          speaker: narrator
          text: >-
            I let him vanish into the distance, still shouting. Then I turned away from the fields and strolled down into the village.
    - id: ch02
      title: A Stranger at the Gate
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            There was some adventure in that walk. This was not our village, but a foreign place at least a mile from home. People turned to look at me, which made me feel important. At the same time, I felt the traveller's uneasiness in strange country. The younger inhabitants might throw things at any moment. Boys are always suspicious of strangers, and they like old ways.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Pleased to be alone, I held my nose even higher than usual. I imagined Mungo Park making his way through a trackless African forest. Then I walked straight into something soft but solid.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The bump brought me back to earth. I sprang away with both elbows raised over my ears, as any boy would. Before me stood a tall elderly man in worn black clothes. He was clean-shaven and plainly a clergyman. His eyes seemed to be looking far beyond this world and had not quite managed to focus on it again. He bent toward me in apology.
        - id: ch02-b04
          speaker: rector
          text: >-
            I beg a thousand pardons, sir. I really am terribly absent-minded. I hope you can forgive me.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Most boys might have thought he was making fun of them. I understood at once that he naturally treated every human being as a gentleman, without dividing people into one kind or another. So I said the collision was my fault and added that I was very absent-minded myself. That happened to be true.
        - id: ch02-b06
          speaker: rector
          text: >-
            Then we have something in common. I am old, so I dream dreams. You are young, so you see visions. Yours is the happier part.
        - id: ch02-b07
          speaker: narrator
          text: >-
            His hand had rested on a wicket gate all this time. He noticed the heat, the late hour, and the sign of Virgo in the Zodiac. Then he made me an offer.
        - id: ch02-b08
          speaker: rector
          text: >-
            Perhaps I could offer you a little refreshment, if you have no other engagement.
        - id: ch02-b09
          speaker: narrator
          text: >-
            My only engagement was an arithmetic lesson, and I had never meant to attend it. I went through the gate while he held it open with great politeness.
        - id: ch02-b10
          speaker: rector
          text: >-
            Venit Hesperus, ite, capellae. Come along, little kid! Oh, forgive me. That familiarity belongs more to the Roman poet than to me.
        - id: ch02-b11
          speaker: narrator
          text: >-
            A straight stone walk led to a cool old house. My host stopped at one rose tree and then another. Twice he forgot me completely, and twice he woke from his thoughts and apologized with deep humility.
        - id: ch02-b12
          speaker: narrator
          text: >-
            During those pauses, I worked out who he was. He must be the Rector, an unmarried man, eccentric and astonishingly learned. Stories had already begun to gather around him. I regarded him with special awe because people said he had written a real book. Martha claimed he had written heaps of them, but I knew how much to discount anything Martha said.
    - id: ch03
      title: Books and Music
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last we crossed a dark hall and entered the room I had always dreamed of but never found. There were none of the fussy decorations women put on chairs and furniture. This man clearly had no aunts troubling him.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Thick books bound in calfskin and vellum covered three walls. More books sprawled across the chairs and hunched on the tables. The room smelled pleasantly of ink and bindings, with a faint trace of tobacco over everything. To me, that smell was as cheering as the British flag fluttering above a traveller in a foreign land. In one corner stood a piano, piled with books like all the other furniture.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I squealed with delight when I saw it.
        - id: ch03-b04
          speaker: rector
          text: >-
            Would you like to strum on it?
        - id: ch03-b05
          speaker: narrator
          text: >-
            He asked as though nothing could be more natural. His eyes were already wandering toward another corner, where a few scraps of writing desk showed beneath mountains of books and paper.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Oh, may I really? They won't let me do that at home. I have to play those beastly exercises.
        - id: ch03-b07
          speaker: rector
          text: >-
            Well, you may strum here, at any rate. Come, my lyre, sing a Latin song.
        - id: ch03-b08
          speaker: narrator
          text: >-
            He drifted toward the irresistible desk as if some machine were guiding him. Within ten seconds, I had disappeared from his mind. A large book lay open on his knee, another stood propped before him, and twenty more waited close at hand. He read and scribbled with such fierce attention that I might have been in distant Boeotia for all he knew. So I gladly began to strum.
        - id: ch03-b09
          speaker: narrator
          text: >-
            People who have climbed the painful heights and mastered an instrument have lost something along the way. The wild joy of strumming has vanished for them. They find pleasure in harmony and in how notes fit together. Only the strummer knows the pure wonder of each note by itself.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Some notes hold the whole sea. Some ring like cathedral bells. Others bring the happiness of woods and the smell of green leaves. Fauns dance to a merry pipe inside some notes, while solemn centaurs peer from their caves. One note brings moonlight, another the deep red heart of a rose. Some are blue and some are red. Others tell of an army marching beneath silken flags while music sounds.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Through it all, the little white figures on the keys leaped and peeped and struggled against the wires that held them. The great rosewood box hummed like a hive full of bees.
        - id: ch03-b12
          speaker: narrator
          text: >-
            At last the delight exhausted me. I stopped and saw my friend's eyes above the edge of a great book.
        - id: ch03-b13
          speaker: rector
          text: >-
            Now, these Germans. I admit they have the scholarship. But where is the spark? Where is the fine understanding and the sudden happy insight? They get it all from us!
        - id: ch03-b14
          speaker: narrator
          text: >-
            They get absolutely nothing from us.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The word “German” made me think only of German bands, which Aunt Eliza hated bitterly. My answer made him rise and walk about the room in some doubt.
        - id: ch03-b16
          speaker: rector
          text: >-
            You don't think so? Well, I admire such fairness and restraint in a critic so young. Those qualities are rare in youth, and very pleasing. But take Schrumpffius. See how he struggles and wrestles with one simple Greek word in this passage!
        - id: ch03-b17
          speaker: narrator
          text: >-
            I peered nervously through the open door. I half expected to see some twisting, terrible fight taking place on the mat. Everything was quiet. I could see no struggle anywhere in the passage, so I told him so.
        - id: ch03-b18
          speaker: rector
          text: >-
            Exactly! You have the natural gift of a scholar, so you see no difficulty at all. But poor Schrumpffius cannot manage it.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Luckily for me, the housekeeper came in just then. She looked neat, serious, and steady.
        - id: ch03-b20
          speaker: housekeeper
          text: >-
            Your tea is waiting in the garden. I've put out cakes and other things for the little gentleman. You had better drink the tea before it gets cold.
        - id: ch03-b21
          speaker: narrator
          text: >-
            He waved her away and kept pacing, brandishing a Greek verb over my helpless head. The housekeeper stood without moving. She waited until his lecture paused for breath.
        - id: ch03-b22
          speaker: housekeeper
          text: >-
            You had better drink it before it gets cold.
        - id: ch03-b23
          speaker: narrator
          text: >-
            The poor man gave me an apologetic look.
        - id: ch03-b24
          speaker: rector
          text: >-
            Perhaps a little tea would be rather nice.
        - id: ch03-b25
          speaker: narrator
          text: >-
            To my great relief, he led the way outside. I looked around for the little gentleman but could not find him. I decided he must be absent-minded too, and began eating the cakes and other things without the slightest concern.
    - id: ch04
      title: Tea by the Road
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            It was a wonderfully successful and learned tea. Then something happened. I was very young, but I never quite forgot it.
        - id: ch04-b02
          speaker: narrator
          text: >-
            We sat talking in an arbour above the high road when a shabby tramp came slouching into sight. A ragged woman followed him, and a stray dog followed her. The man saw us and began his usual begging whine.
        - id: ch04-b03
          speaker: narrator
          text: >-
            I looked at the Rector with deep sympathy. Martha had told me what everyone knew. By this hour of the day, he was certain to have no money left. Each morning he went out with full pockets. Each evening he came back without a single coin.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The Rector explained all this to the tramp at great length. He was courteous and even ashamed, as though having nothing to give were his own offence. At last the man understood that there was no hope of money. Then he began cursing the Rector with all his strength and all the words he knew.
        - id: ch04-b05
          speaker: narrator
          text: >-
            He abused the Rector's eyes and face, his arms and legs, his profession, his family, and everything around him. Then he shuffled away, still pouring out spite and filth. We watched the three of them until they reached a bend in the road.
        - id: ch04-b06
          speaker: narrator
          text: >-
            There the tired woman stopped. The tramp gave the customary rough curses expected of a man like him. But then he took her bundle and let her lean on his arm. His voice held a rough sort of kindness, and his action came close to tenderness. The dingy dog crept up and licked her hand once.
    - id: ch05
      title: The Silver Threads
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            My friend leaned a little on my shoulder as he spoke.
        - id: ch05-b02
          speaker: rector
          text: >-
            Do you see how this strange thing we call love can live and shine in the most unlikely places? You have walked through the fields early in the morning, haven't you? At first the bare acres seem empty. But bend down and let the light cross them sideways. Suddenly you see a whole silver web of gossamer.
        - id: ch05-b03
          speaker: rector
          text: >-
            Love has fine threads like those. They run beneath everything and bind the whole world together. I don't mean the old commanding god with his deadly bow. Not that. I don't even mean quiet, respectable family affection. This is something without a name, perhaps something more mysterious and more divine.
        - id: ch05-b04
          speaker: rector
          text: >-
            You only have to stoop to see it, old fellow. You have to stoop.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Dew was falling and dusk was closing in when I trotted briskly home along the road. Empty spaces stretched everywhere, above me and all around.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Only Hesperus hung in the sky. The evening star stood alone, pure and impossibly distant. Yet somehow, in its brave loneliness, it filled me with courage.
