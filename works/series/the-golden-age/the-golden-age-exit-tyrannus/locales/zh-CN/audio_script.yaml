audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 大日子终于来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那个大日子终于到了。刚听说的时候，它远得简直无法想象，就像所有许诺着好事的黄金日期一样。两个星期前，消息传来，斯梅德利小姐当真要走了。我们足足欢喜了一个星期，一遍又一遍数落她从前的暴政、罪行和恶意。这个侮辱，那个羞耻，还有一回回拳脚相加，我们都曾阴沉着脸忍下来。那时候，获救的希望连天边一颗小星星都还不是。
        - id: ch01-b02
          speaker: narrator
          text: >-
            我们又尽情描画以后的黄金岁月。这个劳碌的世界当然还会有新的烦恼，可那条熟悉的鞭子总算抽不到我们了。剩下的几天，全拿来筹备一场像样的欢送，好让大家憋了许久的心意真正显露出来。爱德华负责指挥。马车一驶下车道，鸡舍顶上就升起旗帜。下沉围栏的高处摆好了三门黄铜小炮，要把我们永不磨灭的心声轰进败退敌人的耳朵。狗儿们也要系上彩带。只要我们躲得开大人，又装得若无其事，晚些时候或许还能点一小堆篝火，放一两只爆竹。当然，公款也得撑得住。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那天早晨，哈罗德拿手肘猛顶我的肋骨，把我弄醒了。
        - id: ch01-b04
          speaker: harold
          text: 她今天就走！
        - id: ch01-b05
          speaker: narrator
          text: >-
            这句晨祷赶跑了最后一点睡意。可我慢慢明白，这件大事真的到了眼前，心里却一点也欢腾不起来。穿衣服时，一股说不清的沉闷越涨越重，几乎像身上有块瘀伤。哈罗德显然也不对劲。他又说了一遍“她今天就走”，听起来倒像在念庄严的祷文。接着，他盯住我的脸，等我告诉他，这件事到底该怎么对待。
        - id: ch01-b06
          speaker: narrator
          text: >-
            我没好气地叫他赶紧穿衣、好好祷告，别来烦我。这可是我们盼了那么久的大日子，为什么我的整片天空反而黑了下来？
        - id: ch01-b07
          speaker: narrator
          text: >-
            我们终于下了楼，来到阳光里。爱德华早就在外面，坐在一道门上晃来晃去，唱着一支农家小调。歌里所有牲口依次登场，各用各的语言乱叫。每一节开头都是：“来吧，小伙子们，跟我走，一大清早就出门！”看样子，今天这场大出走已经被他忘得干干净净。
        - id: ch01-b08
          speaker: narrator
          text: >-
            我拍拍他的肩膀，对他说：“她今天就走。”
        - id: ch01-b09
          speaker: narrator
          text: >-
            爱德华的歌声一下断了，像有人拧紧了水龙头。
        - id: ch01-b10
          speaker: edward
          text: 可不是！
        - id: ch01-b11
          speaker: narrator
          text: >-
            他立刻从门上跳下来。我们一起回屋，一路再也没人开口。
    - id: ch02
      title: 眼泪与停课
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            吃早饭时，斯梅德利小姐做了一件实在卑鄙、而且毫无道理的事。家庭教师就算真有神授的大权，可以随意把人管错，也没有权利哭。哭本来是受害者的特权。她竟然抢去自己用，这就是不守拳台规矩，专往腰带以下打。
        - id: ch02-b02
          speaker: narrator
          text: >-
            夏洛特当然也在掉眼泪，可那不算什么。每回给猪鼻子穿环，她一样会哭。干活的人总是兴高采烈地鄙视她，还说猪喜欢这样。他们亲手干活，想必最清楚。可是斯梅德利小姐平日呼云唤雨，手里握着雷霆，如今却收起雷霆，自己哭了起来。这一下，我们这些反抗中的人类既委屈又为难，简直被摆到了一个完全错误的位置上。
        - id: ch02-b03
          speaker: narrator
          text: >-
            假如汉尼拔哭了，罗马人该怎么办？连历史都没想过这种可能。规矩和先例明明该由双方一起严格遵守。谁先破坏规矩，对面的人自然有权觉得自己吃了亏、受了伤害。
        - id: ch02-b04
          speaker: narrator
          text: >-
            那天上午竟然还不上课。这又添了一桩委屈。照理说，我们该在语气和时态的混乱战场上打到最后，最后踩着乘法表支离破碎的尸体，涨红着仇恨的脸，从此永别。可连这个合宜的结局也没给我们。
        - id: ch02-b05
          speaker: narrator
          text: >-
            我只好独自在花园里闲逛，尽力压住越来越深的沮丧。我觉得，人既然已经相处惯了，却还要离去，这套规矩根本就错了。事情应该永远照旧才对。变化当然少不了。譬如猪，来得快，去得也快。它们“鸣响一枪，匆匆而过，奋勇冲锋，最终沉没”。不过那是大自然的安排，大自然也会很快送来后继者。
        - id: ch02-b06
          speaker: narrator
          text: >-
            你若喜欢上一头猪，它却被带走了，只要从新生的一窝猪崽里挑一头，悲伤很快就会淡下去。可这次失去的甚至不是什么举世无双的猪，不过是一个家庭教师，大自然反倒没了办法。眼前的未来空空荡荡，不会有一窝什么东西来替我们忘掉她。日子也许会变好，也许会变坏，可再也不会同从前一样。年轻人的天性最守旧。我们不求富贵，也不求贫穷，只求什么都别改变。
    - id: ch03
      title: 庆典渐渐熄灭
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            过了一会儿，爱德华垂头耷脑地挨到我身边，活像偷果酱时被人抓个正着，却偏要装出神气十足的样子。
        - id: ch03-b02
          speaker: edward
          text: 等她真的走了，那该多有意思！
        - id: ch03-b03
          speaker: narrator
          text: >-
            我悲悲切切地回答：“那才好玩呢！”接着，我们便没话可说了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            到了鸡舍前，我们一起看着那面自由之旗。它已经准备好了，只等最庄严的一刻迎风飘起来。我问爱德华：“马车一动，你就升旗吗？还是……等车走得看不见了再升？”
        - id: ch03-b05
          speaker: narrator
          text: 爱德华犹犹豫豫地看了看四周。
        - id: ch03-b06
          speaker: edward
          text: >-
            我看要下雨了。再说，这还是面新旗子，淋坏了多可惜。也许我干脆不升了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            哈罗德忽然从转角冲出来，活像一头被印第安人追赶的野牛。
        - id: ch03-b08
          speaker: harold
          text: 我把大炮擦得亮亮的，看起来棒极了！我现在能装火药了吗？
          emotion: happy
        - id: ch03-b09
          speaker: edward
          text: >-
            别碰它们，不然你会把自己炸上天。没叫你动以前，不准碰火药，要不我就揍你的脑袋。
        - id: ch03-b10
          speaker: narrator
          text: >-
            平日里，爱德华最不擅长的可不是替别人着想。哈罗德蔫了下来，乖乖落在后面。过了一会儿，他又开口了。
        - id: ch03-b11
          speaker: harold
          text: >-
            她要我给她写信。她说，只要我肯写，拼错字也不要紧。想想看，她居然会这么说！
        - id: ch03-b12
          speaker: edward
          text: 哎呀，你闭嘴行不行？
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: >-
            我们又不说话了，只能各自陪着自己的心事。那滋味实在不好受。我觉得非做点什么，才能松开这股紧绷劲儿，便小心提议：“我们去小树林吧，再砍些新树枝做弓箭。”
        - id: ch03-b14
          speaker: edward
          text: >-
            我上次过生日，她送了我一把小刀。那刀不怎么好，可我真希望自己没把它弄丢。
        - id: ch03-b15
          speaker: narrator
          text: >-
            爱德华站在原地没动。我也想起一件事，便说：“以前我的腿痛，她会坐上大半夜，替我擦药。直到今天早上，我把这事忘得干干净净。”
        - id: ch03-b16
          speaker: harold
          text: 马车来了！我听见车轮碾着碎石，嘎吱嘎吱地响！
          emotion: surprised
        - id: ch03-b17
          speaker: narrator
          text: >-
            直到这时候，我们才第一次转过身，直望着彼此的脸。
    - id: ch04
      title: 留下的空缺
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            马车和车上的一切终于穿过大门，消失不见。车轮的辘辘声也渐渐远了。没有旗帜在阳光中傲然飘扬，没有大炮宣告一个王朝已经终结。
        - id: ch04-b02
          speaker: narrator
          text: >-
            命运从我们生活那只覆着糖霜的蛋糕上，切走了无可替代的一块。不管朝哪边转身，那处空缺总在眼前。我们各自悄悄溜开，谁也不想要别人陪伴。
        - id: ch04-b03
          speaker: narrator
          text: >-
            我忽然觉得，应该把自己的小花园从这头到那头，彻底翻上一遍。其实那块地根本不用翻，可无论怎么翻，也不会叫它变好或变坏。于是我顶着炎热的太阳，一刻不停地使劲挖土，想用手上的活堵住脑子里的念头。大约一个钟头以后，爱德华来了。
        - id: ch04-b04
          speaker: edward
          text: 我一直在劈木头。
        - id: ch04-b05
          speaker: narrator
          text: >-
            他说得有点心虚，虽然根本没人叫他交代。我傻乎乎地问：“劈来干什么？已经有一堆又一堆劈好的木头了。”
        - id: ch04-b06
          speaker: edward
          text: >-
            我知道。可多备一点也没坏处，谁知道会出什么事呢。倒是你，挖这么多土干什么？
        - id: ch04-b07
          speaker: narrator
          text: >-
            我赶紧解释：“你说过要下雨，所以我想趁雨还没来，先把地翻好。好园丁总说，这才是正确的做法。”
        - id: ch04-b08
          speaker: edward
          text: >-
            有一阵的确像是要下雨，不过现在已经过去了。这天气真古怪。我想，我一整天都不大对劲，准是天气害的。
        - id: ch04-b09
          speaker: narrator
          text: >-
            我也说：“是啊，我想就是天气。我今天也一直不大对劲。”
        - id: ch04-b10
          speaker: narrator
          text: >-
            其实我们俩都清楚，这跟天气毫无关系。可要我们承认真正的缘故，那还不如死了。
