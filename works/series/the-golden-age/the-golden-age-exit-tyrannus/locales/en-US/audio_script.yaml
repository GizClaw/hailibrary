audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    edward:
      display_name: Edward
      tts:
        delivery: confident and slightly bossy
        timbre: clear and boyish
        pace: brisk
        pitch: medium
    harold:
      display_name: Harold
      tts:
        delivery: earnest and cheerfully matter-of-fact
        timbre: light and youthful
        pace: natural
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: gentle and openly wistful
        timbre: soft and youthful
        pace: natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Great Day Arrives
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            At last, the great day arrived. Like every golden date that promises something definite, it had seemed impossibly far away. When we first heard, two weeks earlier, that Miss Smedley was truly leaving, we spent a whole week in wild delight. Again and again, we went over every tyranny, crime, and cruel deed of hers. We reminded one another of each insult, each disgrace, and each attack we had endured in gloomy silence, back when escape was not even a tiny star on the horizon. Then we planned the golden days ahead. They would bring troubles of their own, of course. This was an ordinary working world, after all. But at least this one familiar torment would be gone.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We spent the remaining days planning practical ways to show what everyone felt. Edward directed everything with great skill. The instant the hired carriage began rolling down the drive, with the grim oppressor inside and her boxes on top, we would raise a flag over the henhouse. Three brass cannons waited on the brow of the sunken fence. Their blasts would send our undying opinion straight into the ears of the retreating enemy. The dogs would wear ribbons. Later, if we could dodge the grown-ups and hide our purpose well enough, there might even be a little bonfire and one or two firecrackers, provided our shared money could stand such an unusual strain.
        - id: ch01-b03
          speaker: narrator
          text: >-
            That morning, Harold woke me by digging an elbow into my ribs.
        - id: ch01-b04
          speaker: harold
          text: >-
            She's leaving today!
        - id: ch01-b05
          speaker: narrator
          text: >-
            Those words were our morning hymn, and they scattered the last clouds of sleep. Yet the great fact brought me no answering joy. As I slowly dressed, an unpleasant heaviness grew inside me, something I could not name and almost like a real bruise. Harold clearly felt it too. He repeated the news, but now it sounded more like a solemn prayer. Then he studied my face, waiting for me to show him how we ought to take the whole situation. I snapped at him to hurry, say his prayers, and stop bothering me. Why did the sky feel so dark on the very day we had longed for?
        - id: ch01-b06
          speaker: narrator
          text: >-
            When we finally went out into the sunshine, Edward was already swinging on a gate. He was singing a farmyard song that brought in every animal, one after another, each making its own noise. Every verse began, “Now, my lads, come with me, out in the morning early!” He had plainly forgotten all about the great departure.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I touched his shoulder. “She's leaving today,” I told him.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Edward's song stopped as suddenly as water from a tap.
        - id: ch01-b09
          speaker: edward
          text: >-
            Oh. So she is.
        - id: ch01-b10
          speaker: narrator
          text: >-
            He climbed straight down from the gate, and we walked back to the house without another word.
    - id: ch02
      title: Tears and No Lessons
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At breakfast, Miss Smedley behaved in a thoroughly mean and uncalled-for way. A governess might claim the divine right to govern badly, but surely she had no right to cry. Tears belonged to her victims. By taking that right for herself, she ignored the rules of the fight and struck below the belt.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Charlotte was crying too, naturally, but that meant nothing. Charlotte even cried when the pigs had rings put through their noses. The men doing the work greeted her tears with cheerful scorn. They said the pigs liked it, and no doubt they knew. But Miss Smedley was the one who usually gathered clouds and threw thunderbolts. Now she had put the thunderbolts away and turned to tears. It left rebellious human beings like us hurt, confused, and placed in a completely false position. What would the Romans have done if Hannibal had cried? History had never even considered it. Rules and old examples ought to be followed on both sides. If one side broke them, the other had every right to feel wronged.
        - id: ch02-b03
          speaker: narrator
          text: >-
            And there were no lessons that morning. That was another grievance. Things would have felt proper if we had struggled to the very end through a muddle of moods and tenses, then parted forever over the broken remains of the multiplication table, our faces hot with hatred. But we were denied even that.
        - id: ch02-b04
          speaker: narrator
          text: >-
            So I wandered alone through the garden, trying to fight the sadness that kept growing. It was altogether wrong for people to leave after you had grown used to them. Things ought to go on as they always had. Change happened, certainly. Pigs came and went with alarming speed. They fired their ringing shot, charged hotly, and sank at last. But Nature had arranged that and quickly sent replacements. If you loved a pig and lost it, choosing from the new litter soon softened your grief.
        - id: ch02-b05
          speaker: narrator
          text: >-
            This time it was not even a matchless pig, only a governess, yet Nature could do nothing. No new litter would help us forget her. Life might become better or worse, but it would never be the same. When you are young, you do not ask to be rich or poor. You only ask for nothing to change.
    - id: ch03
      title: The Celebration Fades
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Before long, Edward came slouching up beside me. He looked guilty, like a boy caught stealing jam, though he tried to swagger.
        - id: ch03-b02
          speaker: edward
          text: >-
            Won't it be a splendid joke when she's finally gone?
        - id: ch03-b03
          speaker: narrator
          text: >-
            “Splendid,” I answered mournfully. That ended the conversation.
        - id: ch03-b04
          speaker: narrator
          text: >-
            We came to the henhouse and stared at the banner of freedom. It lay ready for the grand moment when it would fly in the wind.
        - id: ch03-b05
          speaker: narrator
          text: >-
            “Will you raise it as soon as the carriage starts?” I asked. “Or will you wait until it's out of sight?”
        - id: ch03-b06
          speaker: narrator
          text: >-
            Edward looked around uncertainly.
        - id: ch03-b07
          speaker: edward
          text: >-
            I think it may rain. And this is a new flag. We shouldn't ruin it. Perhaps I won't put it up after all.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Harold charged around the corner like a bison with Indians after it.
        - id: ch03-b09
          speaker: harold
          text: >-
            I've polished the cannons, and they look magnificent! Can I load them now?
          emotion: happy
        - id: ch03-b10
          speaker: edward
          text: >-
            Leave them alone, or you'll blow yourself up. Don't go near the gunpowder until I tell you. If you do, I'll smack your head.
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: >-
            Concern for other people was not usually Edward's strongest quality. Harold dropped behind us, crushed and obedient. After a while, he spoke again.
        - id: ch03-b12
          speaker: harold
          text: >-
            She asked me to write to her. She said she wouldn't care about my spelling, as long as I wrote. Imagine her saying that!
        - id: ch03-b13
          speaker: edward
          text: >-
            Oh, will you be quiet?
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: >-
            Again we fell silent, left alone with our miserable thoughts. I felt we had to do something to break the strain.
        - id: ch03-b15
          speaker: narrator
          text: >-
            “Let's go to the copse,” I suggested carefully. “We could cut some new bows and arrows.”
        - id: ch03-b16
          speaker: edward
          text: >-
            She gave me a knife for my last birthday. It wasn't a very good one, but I wish I hadn't lost it.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Edward did not move. Then I remembered something too. “When my legs used to ache, she stayed up half the night rubbing medicine on them. I'd forgotten all about it until this morning.”
        - id: ch03-b18
          speaker: harold
          text: >-
            There's the carriage! I can hear the wheels crunching over the gravel!
        - id: ch03-b19
          speaker: narrator
          text: >-
            For the first time, we turned and looked straight into one another's faces.
    - id: ch04
      title: The Empty Place
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At last, the carriage and everything it carried passed through the gate and vanished. The rumble of the wheels faded away. No flag challenged the sunshine. No cannons announced the fall of a dynasty.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Fate had cut one piece out of the frosted cake of our lives, and nothing could replace it. Whichever way we turned, the empty place was there. We slipped away in different directions because none of us wanted company.
        - id: ch04-b03
          speaker: narrator
          text: >-
            I decided I ought to dig my whole garden from one end to the other. It did not need digging. Still, digging could hardly make it better or worse. For about an hour, I worked steadily and fiercely beneath the hot sun, using action to smother every thought. Then Edward joined me.
        - id: ch04-b04
          speaker: edward
          text: >-
            I've been chopping wood.
        - id: ch04-b05
          speaker: narrator
          text: >-
            He sounded guilty, though no one had asked him to explain himself. “What did you do that for?” I asked stupidly. “There are piles of chopped wood already.”
        - id: ch04-b06
          speaker: edward
          text: >-
            I know, but a little extra can't hurt. You never know what might happen. Anyway, why have you been doing all this digging?
        - id: ch04-b07
          speaker: narrator
          text: >-
            “You said it was going to rain,” I answered quickly. “I thought I'd finish before it started. Good gardeners always say that's the proper thing to do.”
        - id: ch04-b08
          speaker: edward
          text: >-
            It did look rainy for a while, but the clouds have gone now. We're having very strange weather. That must be why I've felt so odd all day.
        - id: ch04-b09
          speaker: narrator
          text: >-
            “Yes, it must be the weather,” I said. “I've felt odd too.”
        - id: ch04-b10
          speaker: narrator
          text: >-
            We both knew the weather had nothing to do with it. But we would rather have died than admit the real reason.
