audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
  chapters:
    - id: ch01
      title: 空气里的学校
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            奥林匹斯诸神的脑袋里装着不少荒唐念头。其中最荒唐的一条是，只要不说姓名和日期，也不提那些能叫人对上号的线索，他们就能当着我们的面，随意谈论与我们切身相关的大事。他们认定我们不会把二加二凑成四。我们也像那些怕被派去谋生的猴子一样，聪明地藏起了推理的本领。于是，很少有什么事能叫我们措手不及。大人们却很失望，只当我们迟钝麻木，不懂得惊奇。
        - id: ch01-b02
          speaker: narrator
          text: >-
            每天送来的信件，再加上随后那些神秘议论，很快就让我们听出了端倪。托马斯叔叔接到了一项使命，而且这使命同我们有关。
        - id: ch01-b03
          speaker: narrator
          text: >-
            托马斯叔叔的使命向来不少。他明明喜欢办事，嘴上却总抱怨担子太重。他是我们这处偏远住所派驻伦敦的传教士。配丝带、跑商店、面试厨娘，这些差事使他空闲的日子有了变化，也免得身材发福。可一件事若只能靠点头和代词来谈，话到要紧处忽然停住，再夹上几句法语，那就是升起了红色警旗，挂出了风暴信号。我们只要装作毫不在意，很快便能掏出秘密的核心。
        - id: ch01-b04
          speaker: narrator
          text: >-
            为了证实猜想，我们一齐向玛莎发起进攻。直接问她当然不行。我们先告诉她，空气里全是“学校”的味道，一切我们都知道了，再让她开口否认。玛莎很可靠，却不善于替人守住秘密。没过多久，真相便全出来了。命令已经下达，学校已经选好，床单正在缝边。被指定去受难的人，正是爱德华。
        - id: ch01-b05
          speaker: narrator
          text: >-
            “学校”一直横在前面，像个谁也躲不过的终点。可也许正因为躲不过，我们从没认真想过它究竟是什么。如今那阴森的幽灵已经逼近，还伸出枯瘦的手，要从我们中间抓走一个。我们只好面对这片没画进海图的水域，探一探深浅，看看大家正漂向哪里。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可我们知道得太少，也找不到可靠的消息。托马斯叔叔自己上过学，本来可以告诉我们。那是在昏暗迷蒙的遥远往昔。偏偏他坚信大自然把他造出来，是要让他当个幽默家。他的话因此都变了味，听起来还又长又累。我们也问过同龄人，答案却像号角传来的声音一样含混不清。有人说学校里尽是胡闹、狂欢和自由，还能提前尝到做成年男子的幸福。更多人却说，那是一座私设的地狱，比真正的地狱还要厉害。
        - id: ch01-b07
          speaker: narrator
          text: >-
            爱德华有时挺着胸脯，神气十足地走来走去，那时他信的是第一种说法。可他也会忽然安静下来，不再处处逞强，只想跟姐妹们待在一起。我们便知道，第二幅景象又占了上风。每逢这时候，我总拿一个办法安慰他。
        - id: ch01-b08
          speaker: narrator
          text: 你总还可以逃回来嘛。
        - id: ch01-b09
          speaker: narrator
          text: >-
            爱德华一听便会振作许多。夏洛特却马上看见另一幅景象。哥哥磨破了双脚，饿着肚子，在结霜的夜里缩在迎风的干草垛背后。她想着想着，眼泪便流了下来。
    - id: ch02
      title: 首领的责任
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            最担心的人自然是爱德华。可我自己的处境也要改变了，这同样值得好好想一想。从前我大多奉命行事。哪怕一桩恶作剧是我想出来的，最后也要爱德华点头才能实行。他是长兄，主要的风险也由他来承担。如今，“责任”这个吓人的怪物开始盯上我。我这才明白，那东西真能勒住人的灵魂。
        - id: ch02-b02
          speaker: narrator
          text: >-
            当然，新地位也有补偿我的地方。爱德华一向专横，喜欢发号施令，心胸或许还有点窄。他只爱坚硬的事实，对想象出来的游戏没多少同情。等他走了，我便不再受拘束。构想一个计划也好，实行一个计划也好，我都可以为了更好的艺术效果，自己决定要什么、不要什么。
        - id: ch02-b03
          speaker: narrator
          text: >-
            还有一件好事，我再也不必当激进派了。其实我天生就不是激进派。这个角色，是爱德华硬塞给我的。有一天，他想把上议院安进我们的小小共和国。他把道理讲得头头是道，听起来似乎不错。可接着，他宣布自己暂时要亲自担任上议院，我们其余的人只能组成下议院。
        - id: ch02-b04
          speaker: narrator
          text: >-
            他还说，将来当然可以晋升。男女都有机会，能不能升，全看功劳和才干。他甚至暗示，我很快便能得到提拔。不过在制度刚开始的时候，他必须先做第一位，也是唯一一位勋爵。我立刻反对，说这全是胡扯，我根本看不出我们为什么需要上议院。
        - id: ch02-b05
          speaker: edward
          text: 那你准是个卑贱的激进派！
        - id: ch02-b06
          speaker: narrator
          text: >-
            这个结论实在来得没什么道理，可我还能怎么办？我只好接受，当场坚定地承认，不错，我就是个卑贱的激进派。从那以后，我一直戴着这副可憎的面具。如今总算能把它摘下来，再坦然面对整个世界了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            可这些好处，真能抵过我的损失吗？我会成为首领，却也得挡在奥林匹斯诸神和我们这群孩子之间。爱德华从不怕他们撞过来的力量。他站得稳稳的，就像特内里费峰，就像阿特拉斯山。可我做得到吗？我会不会只求清静，一次次妥协、让步、讲条件，最后变成一个从不犯错、自命不凡的乖孩子？
        - id: ch02-b08
          speaker: narrator
          text: >-
            那时候，我当然没把思绪一字一句地想得这么清楚。童年的好处，就在于不必把朦胧的念头硬塞进文字这种机械又贫乏的东西里。不过那份不安是真的。我担心自己没有足够的品格，坐稳这个微妙的位置。
    - id: ch03
      title: 分别前的光环
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            新衣服一送到，爱德华周围那圈异样的光越发明亮。他的举止也更稳重，更有尊严。后来，衣箱和玩具箱也送来了。哥哥已经属于未来，我们还留在过去，那道即将把双方分开的裂缝，突然变得清清楚楚。
        - id: ch03-b02
          speaker: narrator
          text: >-
            两只箱子上都用大字漆着爱德华的名字。从此，箱子的主人常会神秘地失踪。大家找来找去，最后总能发现他围着行李慢慢打转，像出了神似的，只把自己的名字一遍遍念出来：“爱德华——”
        - id: ch03-b03
          speaker: narrator
          text: >-
            这当然算个弱点，也显出了他性格中柔软的一处。不过，谁还记得第一次看见自己姓名印成铅字时的感觉，就不会怪他。
        - id: ch03-b04
          speaker: narrator
          text: >-
            白昼短短的，一天接一天溜走。那个阴森的日子把影子越拖越长，一直伸过我们家的门槛。空气里也渐渐弥漫着异样的客气，人人礼貌得近乎诡异。临近分别时，爱德华竟常常亲口说“请”。有一次，他甚至这样开口。
        - id: ch03-b05
          speaker: edward
          text: 能麻烦你把那个球拿来吗？
        - id: ch03-b06
          speaker: narrator
          text: >-
            哈罗德和我有时也会主动猜他需要什么。姑娘们更是对他百般迁就。奥林匹斯诸神用他们笨拙的方式，送来好吃的东西，又给他种种宽待，像是急着证明过去一直看错了这个孩子。整个局面越来越紧绷，也越来越虚假。所以终点真正到来时，我想，大家其实都松了一口气。
        - id: ch03-b07
          speaker: narrator
          text: >-
            我们当然全都去车站送行。只有长大以后，人才看得出“送人上路”这件事有多像一出闹剧。爱德华一路上最有精神。即便那份快活偶尔用力过了头，也没人愿意在这时候挑剔。
        - id: ch03-b08
          speaker: narrator
          text: >-
            我们大步走着。我答应爱德华，会请拉金农场主先别杀下一头猪，等他放假回来再说。爱德华也答应送我一把真正的弹弓，货真价实，足以致命，绝不是给小孩子玩的东西。走到一半时，一个姑娘忽然抽抽搭搭地哭了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            有些幸运的人敢笑别人晕船。可他们若亲眼看着身边的旅伴突然垮掉，也会赶紧收起自信，重新想想自己的把握究竟有多大，还会暗下决心，从此谦逊几分。爱德华此刻就是这样。他把脸转开，假装对沿途的景色忽然有了兴趣。
        - id: ch03-b10
          speaker: narrator
          text: >-
            不过只过了一会儿，他便想起头上那顶硬圆礼帽。这是他平生第一顶这样的帽子。他摘下帽子，仔细看了看，又伸手四处摸了摸。帽子里仿佛藏着一股力量。爱德华得到了勇气，又成了男子汉。
    - id: ch04
      title: 驶向新生活
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            到了车站，爱德华先把箱子摆在月台上一个显眼的位置，好让人人都看见上面的标签和大字。一个人可不是每天都会第一次去上学！接着，他把车票的正反两面读得仔仔细细，又把票轮流装进每一个口袋。最后，他开始把自己的钱碰得叮当响，好给自己壮胆。
        - id: ch04-b02
          speaker: narrator
          text: >-
            这时，我们已经没话可说了。大家只能围着那个盛装待献的牺牲品，默默站着，一眼不眨地看。爱德华穿着一套很有男子气概的新衣，头戴硬礼帽。一个口袋里是火车票，另一个口袋里是他自己的钱。那钱可以随便花，谁也不会追问。我渐渐感觉到，一道巨大的鸿沟已经在我们之间张开。
        - id: ch04-b03
          speaker: narrator
          text: >-
            幸好我还小，没有看懂更多。就在这座小小的月台上，旧日的秩序已经奄奄一息。爱德华以后还会回来，可回来的不会再是从前那个爱德华。一切也永远不会恢复原样。
        - id: ch04-b04
          speaker: narrator
          text: >-
            火车终于喷着蒸汽进站。我们一窝蜂似的冲上去，都想挑出那个举世无双的车厢，让爱德华一路坐得最舒服、最体面。偏偏每个人都同时找到了理想的包厢，还扯着嗓子坚持自己的选择最好。闹到最后，爱德华反而差点被留在月台上。
        - id: ch04-b05
          speaker: narrator
          text: >-
            一个搬运工替大家作了决定。他把爱德华一把推进最近的车门。火车开动时，爱德华从窗口探出脑袋，脸上戴着一副千真万确、品质上乘的笑容。那笑容不知被他藏在哪里，积攒了多久，专等最庄严的这一刻才拿出来。
        - id: ch04-b06
          speaker: narrator
          text: >-
            在渐渐远去的长列车侧面，他的脸显得那么小，那么白。可那笑容依旧清清楚楚，始终顽强地留在脸上。直到一道弯把他从我们眼前卷走。渐息的轰隆声载着他离开平静的回水湾，去往那个处处都有磕碰、挫折和竞争的忙碌世界，去往崭新的生活。
    - id: ch05
      title: 旧日的废墟
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            螃蟹掉了一条腿，走起路来会比平时更加别扭。只有等时间过去，让善于疗愈的自然把它重新变得完整圆满，脚步才会稳下来。我们从车站往回走时，也是这样。队伍松松散散，仿佛各个关节全脱开了。
        - id: ch05-b02
          speaker: narrator
          text: >-
            哈罗德一路不说话，只紧紧贴在我身旁。如今，我成了他最后一根细弱的支柱。姑娘们走在前面，脑袋凑在一起，已经开始数离假期还有几个星期。
        - id: ch05-b03
          speaker: narrator
          text: >-
            回到家后，哈罗德提议做一两件刺激又犯禁的事情。我们像男子汉一样努力去做，却怎么也提不起兴致。我又想出几样，结果还是一样。最后，我们坐在一辆翻倒的独轮车上，谁也不说话，只用拳头托着下巴，憔悴地望着改变后的生活。它陌生得令人发愁。而在我们背后，是已经坍塌的过去。
        - id: ch05-b04
          speaker: narrator
          text: >-
            就在这段时间里，塞利娜和夏洛特忙得很。她们给爱德华的兔子塞进比平时更多的青绿饲料，多得足以叫兔子消化不良。她们又把他的鼠笼擦得锃亮，弄得里面的住户像春季大扫除时的房主一样暴跳咒骂。她们还四处收集材料，准备做新的弓箭、鞭子、小船、枪，还有四驾马车的挽具，等着尤利西斯归来。
        - id: ch05-b05
          speaker: narrator
          text: >-
            姑娘们哪里知道，这位英雄从特洛伊的重重战阵回来以后，会轻蔑地说，她们费了许多力气做成的武库又笨又差，全是胡扯和假玩意儿，只配给小孩子玩。这个真相，还有许多相似的醒悟，都仁慈地藏在她们看不见的地方。
        - id: ch05-b06
          speaker: narrator
          text: >-
            要是未来的帷幕真能掀开，她们就会看见三个月后的爱德华。他衣衫破烂，说话放肆，蔑视传统，还精通种种陌生的新式肉体酷刑。他能在同一个半小时里拆掉一只娃娃，也击碎一个神圣的信念。总而言之，他活像一位刚从西班牙海域归来、趾高气扬的船长。
        - id: ch05-b07
          speaker: narrator
          text: >-
            倘若姑娘们能预先知道一点点，她们也许就会……可是，谁的心性能经得住朝未来匆匆看上一眼？我们只能希望，即使前面注定会有幻灭，她们依然会一丝不差地照原样去做。
        - id: ch05-b08
          speaker: narrator
          text: >-
            也许我们真该庆幸。不论小时候，还是长大很久以后，我们永远不能预知，此刻全心投入的追求，过不了多久，在别人眼里，甚至在自己眼里，会变成什么样子。
        - id: ch05-b09
          speaker: narrator
          text: >-
            所以，我们总带着十足的兴致和热情，从一桩滑稽的迷恋奔向另一腔变了形的热爱。旁观的人看着，甚至会觉得有些可怜。可谁愿意去做冥界的判官拉达曼图斯，翻检这份记录，再裁定其中有多少是真正的成就，有多少只是最纯粹的孩子把戏？
