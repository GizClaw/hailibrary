audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    edward:
      display_name: Edward
      tts:
        delivery: confident with flashes of boyish uncertainty
        timbre: clear and youthful
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: What the Olympians Tried to Hide
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Olympians had many foolish ideas, but one was more foolish than all the rest. They believed they could discuss matters of the greatest importance to us while we were in the room, provided they left out names, dates, and other obvious clues. Apparently, we children could not be trusted to add two and two.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We took care not to correct them. Monkeys, after all, are wise enough not to speak in case someone makes them earn a living. In much the same way, we hid our gift for simple reasoning. That meant we were seldom surprised, which left our disappointed elders thinking us dull and sadly short of wonder.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The daily letters, and the mysterious talks that followed, soon told us that Uncle Thomas had been given a mission concerning us. His missions were many. He liked to act weighed down by them, though the truth was that he enjoyed the business. He was our messenger in distant London.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He might be asked to match a ribbon, hurry to the shops, or interview a cook. Such duties added colour to his empty London life and helped keep his figure down. But when one of these matters had to be discussed while we were present, the grown-ups changed their manner. They used nods instead of names, pronouns instead of facts, meaningful gaps instead of whole sentences, and sudden scraps of French. At once, the red flag flew and the storm signal rose. By looking carefully uninterested, we soon reached the heart of the secret.
        - id: ch01-b05
          speaker: narrator
          text: >-
            To make certain, we all descended on Martha. We could not simply ask her what was happening. That would never do. Instead, we announced that the very air smelled of school, said we knew everything, and dared her to deny it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Martha was loyal, but she made a poor witness for the defence. Before long, we had the whole truth. The order had been given. A school had been chosen. The sheets were already being hemmed. And Edward was the chosen victim.
    - id: ch02
      title: The Shadow of School
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            School had always waited somewhere ahead of us. We knew it was unavoidable, yet perhaps for that very reason we had never seriously wondered what it meant. Now the grim thing was close. It reached out a thin hand toward one of our little company, and we had to face it. We needed to sound the depths of this unknown sea and learn where it would carry us.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Unfortunately, we had almost no reliable information. Uncle Thomas could have told us, because he had once attended school himself in the dim past. But he believed Nature had made him a humorist. That spoiled his evidence and made it tiresome to hear.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The boys of our own age were no clearer. Their reports sounded like uncertain trumpets. Some described school as glorious fun, endless excitement, freedom, and an early taste of being a man. Most of them, alas, said it was a private and special sort of hell, one that could challenge the original and beat it.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Edward swung between those two pictures. Sometimes he strutted about with his chest out, already admiring the life ahead. At other times he grew quiet and gentle and went looking for his sisters. Then I would offer what comfort I could.
        - id: ch02-b05
          speaker: narrator
          text: >-
            You can always run away, you know.
        - id: ch02-b06
          speaker: narrator
          text: >-
            That brightened Edward at once. Charlotte, however, would dissolve into tears. She saw him stumbling along with blistered feet and an empty stomach, sleeping through frosty nights on the sheltered side of windswept haystacks.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Edward naturally had the most to worry about, but his departure would change my own position too. Until then, I had usually acted under orders. Even when some piece of mischief was my idea, Edward had approved it before we carried it out. Since he was the eldest, he also took the greatest risk.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Soon the responsibility would be mine, and I began to understand what a choking burden it could be. Of course, the new position had its rewards. Edward had been remarkably bossy, perhaps even narrow-minded. He cared fiercely about solid facts and had little patience with make-believe. Without him, I would be free. I could plan our schemes and shape them with a better sense of art.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Better still, I would no longer have to be a Radical. I had never been one by nature. Edward had forced the role on me when he tried to install a House of Lords in our small Republic. He explained the system very learnedly, and at first it sounded promising. Then he revealed that he meant to be the entire House of Lords himself, while the rest of us became the Commons.
        - id: ch02-b10
          speaker: narrator
          text: >-
            He promised promotions for good service and fitness, open to girls as well as boys. He even hinted that I might rise quickly. For the system to begin properly, though, he said there must be only one Lord, and that Lord must be Edward. I put my foot down. I told him the whole thing was nonsense and that I saw no need for any House of Lords.
        - id: ch02-b11
          speaker: edward
          text: >-
            Then you must be a low Radical!
        - id: ch02-b12
          speaker: narrator
          text: >-
            His contempt was magnificent. The conclusion did not seem necessary, but what else could I do? I accepted it and firmly declared myself a low Radical. I had been trapped in that dreadful character ever since. Now I could cast it off and face the world honestly again.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Yet did those advantages truly make up for what I would lose? I might become leader and chief, but I would also have to stand between the Olympians and my little clan. Edward had thought nothing of that duty. He faced the full force of Olympus without a tremor, solid as Teneriffe or Atlas. Could I do the same? Or would quiet and peace tempt me into making terms? I might give way once, then again, until at last I sank into that horror, the Blameless Prig.
        - id: ch02-b14
          speaker: narrator
          text: >-
            I did not put all this into such exact words at the time. In those fortunate days, a vague thought did not have to be squeezed into the stiff machinery of language. But the fear was real. Perhaps I did not have the character for such a difficult place.
    - id: ch03
      title: The Last Days at Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Edward's strange halo grew brighter when his new clothes arrived. He became more dignified and responsible too. Then his trunk and play-box came, and the split between him and us seemed sharper than ever. Edward already belonged to the future. The rest of us were still held by the past.
        - id: ch03-b02
          speaker: narrator
          text: >-
            His name was painted on both boxes in large letters. After that, he often vanished from the house. We would finally discover him wandering around his luggage and murmuring his own name in a distant, dreamy voice.
        - id: ch03-b03
          speaker: narrator
          text: >-
            It was a weakness, certainly, and showed a soft place in his character. But anyone who remembers seeing their own name in print for the first time will forgive him.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The short days hurried past, and the coming event threw a longer shadow across our door. A strange politeness spread through the house. Edward himself could often be heard saying please.
        - id: ch03-b05
          speaker: edward
          text: >-
            Would you mind getting that ball for me?
        - id: ch03-b06
          speaker: narrator
          text: >-
            Harold and I sometimes caught ourselves trying to guess what he wanted before he asked. The girls went much further and simply grovelled. Even the Olympians tried to make amends in their clumsy way. They gave him special foods and other treats, as if they wished to prove that until now they had completely misjudged this particular child. The air grew more strained and false with every kindness. I think we were all relieved when the final day came.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Naturally, we all walked down to the station. Only later in life does one see the foolishness of going to watch somebody leave. Edward kept the whole party lively. His cheerfulness sometimes seemed a little too determined, but this was no time to criticize.
        - id: ch03-b08
          speaker: narrator
          text: >-
            As we marched along, I promised to ask Farmer Larkin not to kill any more pigs before Edward returned for the holidays.
        - id: ch03-b09
          speaker: edward
          text: >-
            And I'll send you a proper catapult. A real deadly one, not some toy for little kids.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Then, about halfway there, one of the girls suddenly began to cry.
        - id: ch03-b11
          speaker: narrator
          text: >-
            People who laugh at seasickness sometimes lose their confidence when another passenger collapses before their eyes. That was what happened to Edward. He turned his head away and pretended to admire the countryside.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The weakness lasted only a moment. Then he remembered his hat. It was a hard bowler, the first he had ever owned. He removed it, inspected it, and felt it all over. Something in that hat seemed to lend him strength. Edward was a man again.
    - id: ch04
      title: Into the New Life
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At the station, Edward's first concern was his luggage. He arranged the boxes on the platform so that every person there could see the labels and the great painted letters. A boy did not go away to school for the first time every day. Next he studied both sides of his ticket with great care. He tried it in every pocket, one after another. Then he jingled his money to keep up his courage.
        - id: ch04-b02
          speaker: narrator
          text: >-
            By then, we had used up every possible thing to say. We could only gather around and stare at the victim prepared for sacrifice. Edward wore new clothes cut like a man's and the hard hat on his head. In one pocket he had a railway ticket. In another he had money of his own, money he could spend however he pleased, without answering questions.
        - id: ch04-b03
          speaker: narrator
          text: >-
            As I looked at him, I began to sense the gulf already opening between us. Luckily, I was too young to understand that the old life was breathing its last on that little platform. Edward might return, but the old Edward would not. Things could never be quite the same again.
        - id: ch04-b04
          speaker: narrator
          text: >-
            At last the train steamed in. We all rushed aboard to choose the one perfect compartment worthy of Edward's comfort and honour. Each of us found a different ideal place at the very same moment and loudly defended it. For a while, it seemed quite possible that the train would leave without him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            A porter ended the argument by throwing Edward through the nearest door. The train began to move, and Edward pushed his head from the window. On his face was an unmistakable, first-rate grin that he must have saved for this supreme moment.
        - id: ch04-b06
          speaker: narrator
          text: >-
            His face looked very small and white against the long side of the retreating train. Still, the grin remained. We could all see it clearly. It was plain, defiant, and bravely held in place until a curve swept him out of sight. The dying rumble carried him away from our quiet backwater, into the busy world of hard knocks and competition, and out into the New Life.
        - id: ch04-b07
          speaker: narrator
          text: >-
            A crab that has lost a leg walks even more awkwardly than usual until time and nature make it whole again. We straggled home in much the same broken fashion. Harold said almost nothing and stayed close beside me, as though I were his last thin support. Ahead, the girls put their heads together and counted the weeks until the holidays.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Once home, Harold suggested one or two exciting and forbidden activities. We honestly tried, but could find no interest in them. I proposed some others, with no better result. At last we sat together on an overturned wheelbarrow, chins in our fists. We stared miserably into the raw new conditions of our altered life, while the ruins of the past lay behind us.
    - id: ch05
      title: Waiting for Ulysses
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            All that while, Selina and Charlotte kept themselves busy with Edward's creatures and possessions. They stuffed his rabbits with unusual heaps of green food. They polished the mice's cage until its occupants raged like householders caught in a fury of spring cleaning.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Then the girls gathered materials for new bows and arrows, whips, boats, guns, and a four-horse harness, all ready for Ulysses to return. Their work on that whole collection was clumsy, but it was patient and laborious. They never dreamed that the hero, once home from Troy and all its battles, would look over their lovingly made armoury with scorn. He would dismiss it all as rubbish, nonsense, and fit only for children.
        - id: ch05-b03
          speaker: narrator
          text: >-
            That discovery, and many others like it, was kindly hidden from them. Suppose the veil had lifted. Suppose they had seen the Edward who would come home only three months later, with ragged clothes and wild new language. He would scorn old customs and be skilled in strange new ways of hurting people. In half an hour, he might tear apart a doll and smash some treasured belief.
        - id: ch05-b04
          speaker: narrator
          text: >-
            In short, Edward would return like a swaggering captain fresh from the Spanish Main. If the girls had caught even the smallest glimpse of that future, then perhaps... But who among us has the strength to look ahead and bear what we see? We can only hope that, even if they had known disappointment was coming, the girls would have done exactly what they did.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Perhaps we should be thankful that, as children and long afterward, we are never allowed to know how soon the thing that absorbs us completely will look different. It will look different to other people, and even to ourselves.
        - id: ch05-b06
          speaker: narrator
          text: >-
            And so we move from one comical devotion to the next misshapen passion. Each time, we throw ourselves into it with such eagerness and heart that anyone watching might almost find it sad. But who would want to sit in judgment on that record? Who would dare weigh it all up and decide how much was solid achievement, and how much was nothing more than child's play?
