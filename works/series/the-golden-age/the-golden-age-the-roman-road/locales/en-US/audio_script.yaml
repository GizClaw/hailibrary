audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    artist:
      display_name: The Artist
      tts:
        delivery: thoughtful and gently playful
        timbre: warm and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Knights' Road
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            All the roads near us were cheerful, friendly roads, and each had pleasures of its own. Along most of them, every hedge and ditch begged you to stop. There were the first lords-and-ladies flowers, a field mouse rustling by, or a frog splashing into water. A horse or cow might push a cool nose through a gate. Tiny hands seemed to reach from both sides and hold a wanderer back.
        - id: ch01-b02
          speaker: narrator
          text: >-
            But one road was different. It had a stern purpose and seemed to hurry you onward, lifting your heart as it went. Soon it cast off its banks and hedges and marched straight toward the open downs. It seemed almost proud of needing no pretty decorations to attract foolish people. Whenever unfairness or disappointment weighed on me and made everything dark inside, I chose that road for a lonely walk. That was how I turned my back on a world that had somehow set itself against me that afternoon.
        - id: ch01-b03
          speaker: narrator
          text: >-
            We children called it the Knights' Road. We felt that if Lancelot and his companions still lived in some hidden corner of the world, they would come pacing down this track on their great warhorses. Grown-ups sometimes called it the Pilgrims' Way. I knew little about pilgrims except Walter from the tale of the Horselberg. In my mind, he would burst from a distant wood with desperate eyes and call after pilgrims hurrying toward the Holy City, where pardon and peace waited for them.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Someone had once said that all roads led to Rome. Naturally, I took that very seriously and puzzled over it for days. In the end, I decided there must have been some mistake. Still, I felt it must be true of this one road. Then Miss Smedley told us in history class about a strange road running down the middle of England to the coast. It began again directly opposite, across the water in France, and never turned aside as it continued through cities and vineyards. It ran all the way from the misty Highlands to the Eternal City. I did not usually believe anything Miss Smedley said unless someone else proved it. This time, however, the road itself was the evidence. For once, she seemed to have wandered into the truth.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Rome! The thought of it waiting at the far end of that white ribbon fascinated me. The road unrolled from my feet and crossed the distant downs. I knew I could not reach Rome that afternoon. But if life kept being so unpleasant, then one day, when Aunt Eliza went away on a visit, we would see.
    - id: ch02
      title: Cities in the Clouds
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I tried to picture Rome. I knew the Coliseum from a woodcut in our history book, so I planted it in the middle. Everything else came from the little grey market town where we had our hair cut twice a year. Muddy lanes led up to Vespasian's great amphitheatre. The Red Lion and the Blue Boar stood nearby, with advertisements across their fronts and Commercial Room painted on their windows. There was the doctor's solid red-brick house and the grand front of the New Wesleyan Chapel.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The people of Rome wandered about in smocks and corduroys. They twisted the tails of Roman calves and invited one another to drink beer in the musical voices of Wessex. Then my thoughts travelled to other half-known cities. There were Damascus, Brighton, which Aunt Eliza thought perfect, Athens, and Glasgow, whose wonders our gardener praised. Yet every city I imagined looked much the same, and that Wesleyan chapel kept appearing in all of them.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Dream cities were easier to build. No one set limits there, and I could be the only architect. I was walking in my mind along a delightful street of palaces made from clouds when I came upon the Artist.
        - id: ch02-b04
          speaker: narrator
          text: >-
            He sat working beside the road where the wide, cool downs swept grandly westward, dotted with juniper. Everything about him said he belonged to the tribe of artists. Besides, he wore knickerbockers like mine, and I knew that only boys and artists dressed that way. My instructions said not to trouble an artist with questions. I must not peer over his shoulder or stand breathing into his ear, because artists were easily annoyed. But no one had said a word about staring. That point must have been forgotten. So I squatted on the grass and gave myself completely to studying him.
        - id: ch02-b05
          speaker: narrator
          text: >-
            After five minutes, I could have passed an examination on every button he wore. I probably knew the pattern and texture of his homespun suit better than he did. Once he looked up, nodded, and half offered me his tobacco pouch without thinking. Then he put it away and returned to his picture, while I returned to taking photographs of him in my mind.
        - id: ch02-b06
          speaker: artist
          text: >-
            Fine afternoon, isn't it? Are you going far today?
        - id: ch02-b07
          speaker: narrator
          text: >-
            No, I'm stopping here. I meant to go on to Rome, but I've decided to leave it for another day.
        - id: ch02-b08
          speaker: artist
          text: >-
            Rome is a pleasant place. You'll like it. Still, I wouldn't go just now if I were you. It's much too hot.
        - id: ch02-b09
          speaker: narrator
          text: >-
            You haven't really been to Rome, have you?
        - id: ch02-b10
          speaker: artist
          text: >-
            Of course. I live there.
        - id: ch02-b11
          speaker: narrator
          text: >-
            My mouth fell open as I tried to understand it. Here I was, speaking to a man who lived in Rome. Talking was impossible, and besides, I had work to do. I had already spent ten whole minutes examining him as an ordinary stranger and artist. Now my first examination was useless. I had to begin all over again from this astonishing new point of view. I started at the crown of his soft hat and worked slowly down to his sturdy British shoes. This time, every part of him shone with a new Roman glow. Only when I had finished could I manage another question.
        - id: ch02-b12
          speaker: narrator
          text: >-
            But you don't truly live there, do you?
        - id: ch02-b13
          speaker: narrator
          text: >-
            I never doubted him. I only needed to hear him say it once more.
        - id: ch02-b14
          speaker: artist
          text: >-
            Well, I live there as much as I live anywhere. Some years I'm there for half the time. I have a sort of little shack there. You must visit it one day.
    - id: ch03
      title: Gardens, Pigs, and Proud Goats
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Do you live somewhere else too?
        - id: ch03-b02
          speaker: narrator
          text: >-
            The forbidden flood of questions was rising in me now.
        - id: ch03-b03
          speaker: artist
          text: >-
            Oh, all over the place. I also have rooms somewhere near Piccadilly.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Where is that?
        - id: ch03-b05
          speaker: artist
          text: >-
            Where is what? Oh, Piccadilly. That's in London.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Is your garden large? And how many pigs do you keep?
        - id: ch03-b07
          speaker: artist
          text: >-
            I haven't any garden at all. They won't let me keep pigs either, though I'd very much like to. It's terribly hard.
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            Then what do you do all day? Where can you play if you haven't a garden, or pigs, or anything?
        - id: ch03-b09
          speaker: artist
          text: >-
            When I want to play, I have to play in the street. It isn't much fun, I admit. There is a goat nearby, and sometimes I talk to him when I feel lonely. But he's very proud.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Goats are proud. One lives near here, and if you speak to him, he butts you in the stomach and knocks all the breath out of you. You know what that feels like, don't you?
        - id: ch03-b11
          speaker: artist
          text: >-
            I know it very well.
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: >-
            He answered with exactly the right sadness and went on painting.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Have you travelled anywhere else besides Rome and Piccy-whatever-its-name-is?
        - id: ch03-b14
          speaker: artist
          text: >-
            Heaps of places. I'm a kind of Ulysses. I've seen men and cities, you know. The only place I never reached was the Fortunate Island.
        - id: ch03-b15
          speaker: narrator
          text: >-
            I began to like him. He answered every question briefly and plainly, and he never tried to be funny at my expense. That made him unlike many grown-ups. While he painted and I sat beside him on the grass, I felt I could trust him with a secret and tell him about a private wish of mine.
    - id: ch04
      title: The City with No People
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Wouldn't you like to find a city with no people in it at all?
        - id: ch04-b02
          speaker: artist
          text: >-
            I'm afraid I don't quite see what you mean.
        - id: ch04-b03
          speaker: narrator
          text: >-
            I mean a city where you walk through the gates and find every shop full of beautiful things. All the houses are furnished as grandly as possible, but there isn't another person anywhere in the whole place. You can enter any shop and take whatever you want. Chocolates, magic lanterns, india-rubber balls, anything at all, and there is never anything to pay. Then you look through all the empty houses and choose the one you like best. You live there, do exactly as you please all day, and never go to bed unless you feel like it!
        - id: ch04-b04
          speaker: narrator
          text: >-
            The artist put down his brush.
        - id: ch04-b05
          speaker: artist
          text: >-
            That would be a wonderful city, even better than Rome. You can't do any of that in Rome or Piccadilly. I'm afraid it's another place I've never visited.
        - id: ch04-b06
          speaker: narrator
          text: >-
            You could invite your friends too, but only the ones you truly liked. Each one could have a house because there would be plenty. You wouldn't invite any relations unless they promised to be pleasant. If they broke their promise, they would have to leave.
        - id: ch04-b07
          speaker: artist
          text: >-
            So there would be no relations? Perhaps you're right. I can see that you and I like the same things.
        - id: ch04-b08
          speaker: narrator
          text: >-
            I'd invite Harold and Charlotte. They would love it. The others are growing too old. Oh, and Martha must come. She could cook and wash the dishes and take care of things. You would like Martha. She's much nicer than Aunt Eliza, and she's what I call a true lady.
        - id: ch04-b09
          speaker: artist
          text: >-
            Then I know I would like her. And when I come to this city of yours, what is it called? Did you say Nephelo-something?
        - id: ch04-b10
          speaker: narrator
          text: >-
            I don't know. I'm afraid it doesn't have a name yet.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The artist looked across the downs.
        - id: ch04-b12
          speaker: artist
          text: >-
            The poet says, "Dear city of Cecrops." Then why shouldn't you say, "Dear city of Zeus"? Marcus Aurelius wrote that. I don't suppose you know him, but you will one day.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Who is he?
        - id: ch04-b14
          speaker: artist
          text: >-
            Oh, only another fellow who lived in Rome.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Oh, dear! So many people seem to live in Rome, and I've never even visited. I still think I would like my own city better.
          emotion: sad
        - id: ch04-b16
          speaker: artist
          text: >-
            So would I. Marcus Aurelius wouldn't agree with us, though.
        - id: ch04-b17
          speaker: narrator
          text: >-
            Then we won't invite him, will we?
        - id: ch04-b18
          speaker: artist
          text: >-
            I won't invite him if you won't.
        - id: ch04-b19
          speaker: narrator
          text: >-
            With that settled, we sat quietly for a while.
    - id: ch05
      title: Those Who Find the Way
      blocks:
        - id: ch05-b01
          speaker: artist
          text: >-
            You know, from time to time I've met one or two fellows who had visited a city like yours. It may even have been the very same city. They would never say much about it. Now and then, they let out a broken hint, but that was all. Still, I know they had been there. Afterward, they never seemed to care much about anything in particular. Whatever happened, rough or smooth, it was all the same to them. Then, sooner or later, they quietly slipped away and disappeared. No one ever saw them again. I suppose they went back.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Of course they went back. I can't understand why they ever left. Why come here to be blamed for breaking things you didn't break, or be forbidden to have tea with the servants in the kitchen, or told you can't let your dog sleep with you? I've known people who went to that city too.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The artist stared at me, but he did it politely.
        - id: ch05-b04
          speaker: narrator
          text: >-
            There's Lancelot. The book says he died, but that part never sounded right to me. He only went away, just as Arthur did. Crusoe must have gone there when he grew tired of wearing clothes and acting respectable. And all the good men in stories who never marry the Princess must be there too. After all, only one man in any book ever gets to marry her. The rest of the nice men have to go somewhere, so they'll be in our city.
        - id: ch05-b05
          speaker: artist
          text: >-
            What about the men who never succeed? They try as hard as the others, but they get knocked out, miss their chance, break down, or fall in the struggle. They don't win the Princess or even a second-rate kingdom. I hope some of them will be there.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Yes, if you want them. I don't quite understand, but if they're your friends, of course we'll invite them.
        - id: ch05-b07
          speaker: artist
          text: >-
            What a splendid time we'll have! And just think how shocked old Marcus Aurelius will be.
          emotion: happy
    - id: ch06
      title: A Compact at Sunset
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The shadows had grown strangely long. Golden haze poured like a tide across the grey-green downs, and the artist began packing his things. My heart sank. Just when we had begun to understand each other so well, we had to part.
        - id: ch06-b02
          speaker: narrator
          text: >-
            He stood up, straight and tall, with sunset shining through his hair and beard as he towered over me. Then he took my hand as though I were his equal.
        - id: ch06-b03
          speaker: artist
          text: >-
            I've enjoyed our talk very much. You chose a most interesting subject, and we've hardly begun to explore it. I hope we'll meet again.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Of course we will.
        - id: ch06-b05
          speaker: narrator
          text: >-
            I was surprised that he could doubt it.
        - id: ch06-b06
          speaker: artist
          text: >-
            Perhaps we'll meet in Rome.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Yes, in Rome. Or Piccy-the-other-place. Or somewhere else.
        - id: ch06-b08
          speaker: artist
          text: >-
            Or in that other city, once we've found the road. I'll watch for you, and you must call out the moment you see me. We'll walk down the street arm in arm and visit every shop. Then I'll choose a house, and you'll choose one, and we'll live there like princes and good fellows.
        - id: ch06-b09
          speaker: narrator
          text: >-
            But you'll stay in my house, won't you? I wouldn't invite everybody, but I would invite you.
        - id: ch06-b10
          speaker: narrator
          text: >-
            He pretended to think about it for a moment.
        - id: ch06-b11
          speaker: artist
          text: >-
            Right! I believe you truly mean it, and I will stay with you. No matter how much anyone else asks, I won't stay with them. I'll stay a long while too, and I promise I won't be any trouble.
        - id: ch06-b12
          speaker: narrator
          text: >-
            That was our compact. Then we parted, and I walked sadly away from the man who understood me. I had to go back to the house where I could never do anything right. I kept wondering about him as I went. Everything that seemed natural and sensible to the artist was called utter nonsense by uncles, vicars, and all the other grown men I knew. Why was he so different from them? I could not explain it, but that did not matter. He would explain this mystery, and many others too, when we met again.
        - id: ch06-b13
          speaker: narrator
          text: >-
            The Knights' Road had comforted me once more, just as it always did. Could the artist possibly be one of those vanished knights I had searched for so long? Perhaps he would wear armour the next time I saw him. Why shouldn't he? He would look splendid in it. I would make sure to reach the Golden City before him. Then I could be waiting as he rode up its High Street, and I would watch the sunlight flash and dance across his helmet and shield.
        - id: ch06-b14
          speaker: narrator
          text: >-
            For now, there was only one thing left to do. I had to find the city, and that would be easy.
