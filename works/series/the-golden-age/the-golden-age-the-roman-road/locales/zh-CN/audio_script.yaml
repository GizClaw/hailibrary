audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    artist:
      display_name: 画家
      tts:
        delivery: 真诚风趣，把孩子当作平等朋友
        timbre: 温厚明朗的成年男声
        pace: 从容自然，玩笑处略带停顿
        pitch: 中低
  chapters:
    - id: ch01
      title: 骑士大道
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们家附近的路都很亲切，也各有各的好处。别的路会拿篱笆和沟边的宝贝留住你。第一朵斑叶海芋开了，田鼠在草里窸窣一响，青蛙扑通跳进水里。门缝和豁口中，还会探出牲畜们凉凉的鼻子。走上这样的路，你就得慢慢闲逛，因为两旁像有无数只小手，争着拉住你。
        - id: ch01-b02
          speaker: narrator
          text: 可这一条路不一样。它严肃而坚定，催着人一直向前，心也跟着振奋起来。道路笔直地奔向开阔的丘陵，把土堤和树篱全甩在身后，好像根本不屑用这些装饰讨好浅薄的人。每当我受了委屈，或者满心失望，胸口黑沉沉的，我就会独自走这条有骨气的路。那一天正是如此。我把那个莫名其妙处处同我作对的世界扔在背后，出来走一个下午。
        - id: ch01-b03
          speaker: narrator
          text: 我们这些孩子叫它“骑士大道”。大家总觉得，如果兰斯洛特和他的伙伴还有谁活着，藏在某个无人探过的角落，那么总有一天，他们会骑着大战马从这条路上缓缓走来。大人有时又叫它“朝圣者之路”。朝圣者的故事我懂得不多，只知道霍尔塞尔山故事里的瓦尔特。我常常想象他双眼憔悴，从远处那片矮树林里冲出来，呼唤那些拼命赶往圣城的人。那里正有安宁和宽恕等着他们。
        - id: ch01-b04
          speaker: narrator
          text: 我还听人说过，条条大路通罗马。我当然把这句话看得很认真，足足琢磨了好多天，最后认定里面一定有什么差错。不过我凭直觉相信，眼前这一条确实通往罗马。斯梅德利小姐上历史课时也提过一条奇异的道路。它从英格兰正中穿过，到海岸停下，又在海峡对面的法国接起来。它不偏不斜，越过城市和葡萄园，从雾蒙蒙的高地一直通到永恒之城。平常没有旁证的话，谁也不肯相信斯梅德利小姐。可是这回，道路本身就在眼前，她似乎难得撞上了一次真相。
        - id: ch01-b05
          speaker: narrator
          text: 罗马！一想到这条白缎带从我脚下铺出去，翻过远方的丘陵，而罗马就在另一头，真叫人入迷。我还不至于以为那个下午就能走到那里。不过，总有一天，如果日子还像眼下这么难熬，等伊莱扎姑妈出门访客的时候，到时再瞧吧。
        - id: ch01-b06
          speaker: narrator
          text: 我试着想象罗马的模样。历史书的木刻图上有斗兽场，我先把它摆在城中央。剩下的部分，只好拿我们每年去两次、专为理发的那座灰色小集镇来拼。这样一来，通往韦斯帕芗圆形剧场的全是泥泞小街。红狮旅店和蓝野猪旅店临街挂着啤酒招牌，窗户上写着“商旅厅”。结实的红砖医生宅邸，还有我们认为很气派的新卫斯理宗礼拜堂，成了罗马最漂亮的建筑。
        - id: ch01-b07
          speaker: narrator
          text: 罗马百姓呢，都穿着罩衫和灯芯绒裤，慢吞吞地转悠。他们揪罗马小牛的尾巴，用好听的威塞克斯口音约人去喝啤酒。我的心思又从罗马飘到大马士革、布赖顿、雅典和格拉斯哥。布赖顿是伊莱扎姑妈心中的天堂，格拉斯哥的繁华则是园丁常说的。可这些城市在我脑子里都差不多，那座卫斯理宗礼拜堂到处都会冒出来。
        - id: ch01-b08
          speaker: narrator
          text: 还是建造梦里的城市容易。那里没有限制，只有我一个建筑师，想怎么盖就怎么盖。我正在想象中走过一条美好的街道，两旁全是云朵砌成的宫殿。就在这时，我遇见了那位画家。
        - id: ch01-b09
          speaker: narrator
          text: 他坐在路边作画。从那里向西望去，广阔清凉的丘陵铺向远方，上面点缀着杜松。他身上处处都像个画家，尤其是那条和我一样的灯笼短裤。据我所知，只有男孩和画家才穿这种衣服。我知道不能用问题烦他，也不能从肩后探头，朝他耳朵里吹气。画家这个族类不喜欢这样。可大人教我的规矩没说不许盯着看，偏偏把这件事漏掉了。
        - id: ch01-b10
          speaker: narrator
          text: 我便蹲在草地上，一心一意看遍他身上的每处细节。五分钟后，他所有纽扣都难不倒我。那套土布衣服的花纹和质地，连穿衣服的人恐怕都没我熟。他抬过一次头，朝我点点头，下意识地把烟草袋递出一半，又收回口袋。他继续画画，我也继续在心里给他拍照。
        - id: ch01-b11
          speaker: artist
          text: 今天下午天气真不错。你要走很远吗？
        - id: ch01-b12
          speaker: narrator
          text: 又过了大约五分钟，他才这样问我，眼睛仍没有朝这边看。
        - id: ch01-b13
          speaker: narrator
          text: 我告诉他，我走到这里就不再往前了。本来是想去罗马的，可如今已经把行程改了。
        - id: ch01-b14
          speaker: artist
          text: 罗马是个好地方，你会喜欢的。不过换了我是你，眼下可不去。那里热得太厉害。
        - id: ch01-b15
          speaker: narrator
          text: 前一句说完，他又画了几分钟，才慢悠悠补上后一句。
        - id: ch01-b16
          speaker: narrator
          text: 我问他，难道他去过罗马吗？
        - id: ch01-b17
          speaker: artist
          text: 当然去过。我就住在那里。
    - id: ch02
      title: 住在罗马的人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这句话实在太惊人了。我张着嘴，拼命想弄懂一件事：坐在我面前说话的这个人，竟然住在罗马。我一时什么也说不出，而且还有重要的事要办。刚才整整十分钟，我只把他当成陌生人和画家来考察。现在眼光不同了，必须从头再看一遍。
        - id: ch02-b02
          speaker: narrator
          text: 我从他软帽的顶端重新看起，一直看到那双结实的英国皮鞋。这一回，样样东西都罩上了一层罗马的光。最后我终于问，他是不是真的住在那里。我一点也没有怀疑，只是非听他再说一遍不可。
        - id: ch02-b03
          speaker: artist
          text: 我在罗马住的时间，跟在任何地方住的差不多。有时一年大约住一半。我在那里有个像窝棚似的住处。哪一天，你一定得来看看。
        - id: ch02-b04
          speaker: narrator
          text: 他宽厚地没有计较我问得有点失礼。我胸中那股不许涌出来的问题，这时却越来越压不住了。我又问，他是不是也住在别的地方。
        - id: ch02-b05
          speaker: artist
          text: 住啊，我什么地方都住。皮卡迪利附近某处，我还有个落脚的房间。
        - id: ch02-b06
          speaker: narrator
          text: 我问那是什么地方。他起初没明白我问的是哪个词，随后告诉我，皮卡迪利在伦敦。我立刻又问，他有没有大花园，还养了几头猪。
        - id: ch02-b07
          speaker: artist
          text: 我连一点花园也没有。他们也不准我养猪，虽说我实在很想养。真叫人难过。
        - id: ch02-b08
          speaker: narrator
          text: 我大吃一惊。没有花园，没有猪，也没有别的东西，他整天能做什么？又能去哪里玩？
        - id: ch02-b09
          speaker: artist
          text: 我想玩的时候，只好去街上。不过说实话，那没多大意思。好在附近有一只山羊。我寂寞时偶尔同它说说话，可它非常傲慢。
        - id: ch02-b10
          speaker: narrator
          text: 我告诉他，山羊本来就傲慢。附近也住着一只，只要你同它说句话，它就拿头撞你的肚子，叫你喘不上气。我问他，知不知道肚子挨人一撞是什么滋味。
        - id: ch02-b11
          speaker: artist
          text: 我太知道那是什么滋味了。
        - id: ch02-b12
          speaker: narrator
          text: 他用十分合宜的悲凉语气回答，手里的画笔却没停。过了一会儿，我又问，除了罗马和那个皮卡什么的地方，他还到过哪里。
        - id: ch02-b13
          speaker: artist
          text: 多得很。我也算半个奥德修斯，见过不少人，也走过不少城市。差不多只剩幸福岛，是我从没去过的地方。
        - id: ch02-b14
          speaker: narrator
          text: 我开始喜欢这个人。他答得又短又准，从不故意拿你逗乐。我觉得自己可以把心事告诉他。
    - id: ch03
      title: 没有名字的城
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我问他，想不想找到一座空城，城里一个人也没有。他没听明白，神情有点迷惑。我赶紧把那座城说给他听。
        - id: ch03-b02
          speaker: narrator
          text: 你从城门进去，会看见店铺里摆满好东西，屋子也布置得无比华丽，可是哪里都没有人。你走进店里，巧克力、幻灯机、橡皮球，想拿什么就拿什么，一分钱也不用付。然后挑一座自己的房子住下，爱做什么就做什么。只要自己不想睡，就永远不必上床。
        - id: ch03-b03
          speaker: narrator
          text: 画家听到这里，放下了画笔。
        - id: ch03-b04
          speaker: artist
          text: 那真是一座好城，比罗马还好。这样的事，在罗马做不了，在皮卡迪利也做不了。可惜你说的地方，我恐怕也没去过。
        - id: ch03-b05
          speaker: narrator
          text: 我越说越起劲。到了那里，还可以邀请朋友，当然只请真正喜欢的人。每个朋友都有自己的房子，反正城里多得是。亲戚一个也不要，除非他们保证和和气气。谁要是做不到，就得离开。
        - id: ch03-b06
          speaker: artist
          text: 原来你一个亲戚也不要。唔，也许你是对的。看来我们两个人趣味相投。
        - id: ch03-b07
          speaker: narrator
          text: 我认真数起要请的人。哈罗德要来，夏洛特也要来，他们一定会喜欢。其他人年纪都越来越大了。还得请玛莎，她可以做饭、洗碗，料理各种事情。玛莎比伊莱扎姑妈好得多。在我心里，她才是真正的淑女。
        - id: ch03-b08
          speaker: artist
          text: 那我肯定会喜欢她。等我来到你的城……那座城叫什么？你刚才是不是说，涅菲洛什么？
        - id: ch03-b09
          speaker: narrator
          text: 我胆怯起来，只好承认，那座城暂时还没有名字。
        - id: ch03-b10
          speaker: narrator
          text: 画家望着远方的丘陵，低声念道：“诗人说，亲爱的刻克洛普斯之城；你难道不会说，亲爱的宙斯之城吗？”他告诉我，这句话出自马可·奥勒留。我现在不认识这个人，将来总会认识。
        - id: ch03-b11
          speaker: narrator
          text: 我问马可·奥勒留是谁。
        - id: ch03-b12
          speaker: artist
          text: 不过是另一个住过罗马的家伙。
        - id: ch03-b13
          speaker: narrator
          text: 他边说边拿画笔点颜料。我听了很沮丧。住在罗马的人怎么这样多，我却连一次也没有去过。不过我告诉他，比起罗马，我还是更喜欢自己的城。
        - id: ch03-b14
          speaker: artist
          text: 我也一样。不过马可·奥勒留肯定不赞成。
        - id: ch03-b15
          speaker: narrator
          text: 我提议，那就别邀请他。画家答应，只要我不请，他也不请。这个问题解决了，我们安静了一会儿。
        - id: ch03-b16
          speaker: artist
          text: 你知道吗？我偶尔遇见过一两个家伙，他们到过一座很像你说的城。也许就是同一座。他们不愿多谈，偶尔只肯吐露几句零碎的话，可他们确实去过。后来，他们好像什么都不再放在心上。不管日子顺不顺，对他们都一样。迟早有一天，他们会悄悄溜走，就此消失，再也看不见了。我想，他们是回到那里去了。
        - id: ch03-b17
          speaker: narrator
          text: 我觉得这再自然不过。真不明白他们为什么要离开。换了我，我可不走。明明没有打破东西，偏有人硬说是你打破的。不准再去厨房和佣人一起喝茶，也不让狗陪你睡觉。谁愿意回到这种日子里？不过，我告诉画家，我也认识到过那座城的人。
        - id: ch03-b18
          speaker: narrator
          text: 画家盯住我看，却没有半点不礼貌。我先说兰斯洛特。书上说他死了，可那句话读起来一直不对。他没有死，不过是像亚瑟王那样离开了。还有鲁滨孙，等他穿够衣服，厌倦了规规矩矩做人，也会去那里。故事里那些没娶公主的好人，也一定全在那里。一本书里从来只有一个男人能结婚，不是吗？
        - id: ch03-b19
          speaker: artist
          text: 那些一直没能成功的人呢？他们跟别人一样努力，却被打倒了，或者不知怎么错过机会。有人撑不下去，有人在混战里被撞翻。最后，他们没有公主，连一个二等王国也没捞到。我希望他们当中，也会有些人在那里。
        - id: ch03-b20
          speaker: narrator
          text: 我不大明白他的意思，不过还是答应了。只要那些人是他的朋友，我们当然会邀请他们。
        - id: ch03-b21
          speaker: artist
          text: 到时候，我们会过得多快活！老马可·奥勒留知道了，一定大吃一惊。
    - id: ch04
      title: 黄金城的约定
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 影子不知不觉变得很长，一片金色的雾像潮水一样漫过灰绿色的丘陵。画家开始收拾东西，准备离开。我的心一下沉了下去。我们刚刚这样投契，竟然已经到了分别的时候。
        - id: ch04-b02
          speaker: narrator
          text: 他站起身来，身材挺拔高大，远远高过我的头，夕阳落在他的头发和胡须上。他握住我的手，就像我是个同他平等的人。
        - id: ch04-b03
          speaker: artist
          text: 今天同你谈话，我非常愉快。你开了一个很有意思的话头，我们连一半都没谈完。希望以后还能再见到你。
        - id: ch04-b04
          speaker: narrator
          text: 我说，我们当然会再见。我很奇怪，他怎么会对此有一丝怀疑。
        - id: ch04-b05
          speaker: artist
          text: 也许我们会在罗马见面？
        - id: ch04-b06
          speaker: narrator
          text: 我答应了。我们可以在罗马见，也可以在皮卡那个地方，或者随便什么地方见。
        - id: ch04-b07
          speaker: artist
          text: 也可以等我们找到路，在另外那座城里见。我会留心找你。你一看见我，就大声招呼。我们手挽手走过街道，把所有店铺逛个遍。然后我挑一所房子，你也挑一所。我们会像王子，像最要好的伙伴那样住在那里。
        - id: ch04-b08
          speaker: narrator
          text: 可我不愿意让他单独住一所房子。我问他，能不能住进我的家。我不会随便邀请任何人，可我一定要邀请他。
        - id: ch04-b09
          speaker: narrator
          text: 他故意装出认真考虑的样子，过了一会儿才开口。
        - id: ch04-b10
          speaker: artist
          text: 一言为定！我相信你是真心的，我一定来同你住。别人再怎么求，我也不去。我还要住上很久，而且绝不给你添麻烦。
        - id: ch04-b11
          speaker: narrator
          text: 我们这样约定之后，就分手了。我闷闷不乐地离开这个懂我的人，回到那所我怎么做都做不对的屋子。为什么我说的每件事，他听来都自然又有道理，那些叔伯、牧师和其他大人却只当成最无聊的胡闹？没关系，等我们再见时，他会把这件事和许多别的事情都解释清楚。
        - id: ch04-b12
          speaker: narrator
          text: 骑士大道总能带给我安慰。这个画家会不会正是我寻找了很久的失踪骑士？也许下次见面，他会披着铠甲。为什么不会？我觉得，他穿铠甲一定很好看。我要设法先到那里，看他骑着马沿黄金城的大街而来，看阳光在他的头盔和盾牌上闪烁跳跃。
        - id: ch04-b13
          speaker: narrator
          text: 眼下只剩下一件事，那就是找到这座城。这很容易。
