audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 认真敏感，抱怨时直率，想象中带着谨慎
        timbre: 清亮稚嫩
        pace: 自然偏快，犹豫时放慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 草坪上的姜汁啤酒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 爱德华刚从牙医手下回来，便摆出绅士派头，请大家喝姜汁啤酒。我们家的牙齿都有定价，一颗值半克朗。要是臼齿本来就松了，那便只能拿到一先令。爱德华那颗牙明明早已摇摇晃晃，他却为了多得些钱，装得痛不欲生。好在拔牙总算是一件大事，挣来的钱够买几瓶姜汁啤酒。
        - id: ch01-b02
          speaker: narrator
          text: 爱德华既然出了钱，便说自己不该再屈尊跑腿，只管在花园里趾高气扬地闲逛。我到村里的邮局买酒，哈罗德从食品间偷出一只玻璃杯。准备妥当，我们横七竖八地躺到草坪上，还把兔子中最端庄、最知道自重的那只放了出来，为宴席增光。它一本正经地蹦来蹦去，专挑最嫩的车前草吃。
        - id: ch01-b03
          speaker: narrator
          text: 塞莉娜是这里年纪最大的淑女。她捧着第一杯斟得满满的酒，故意摆出娇滴滴的样子，拿手指细细捞着里面的碎软木塞。请客的主人等得不耐烦了。
        - id: ch01-b04
          speaker: edward
          text: 你们就不能快一点吗？你们女孩子干吗事事都这么讨厌地讲究？
        - id: ch01-b05
          speaker: harold
          text: 玛莎说，要是不小心咽下一小块软木塞，它会在肚子里胀呀，胀呀，越胀越大，最后你就——
        - id: ch01-b06
          speaker: narrator
          text: 哈罗德自己也渴得厉害，却仍旧守着公道。爱德华才不肯听下去。
        - id: ch01-b07
          speaker: edward
          text: 呸，胡扯！
        - id: ch01-b08
          speaker: narrator
          text: 他一口喝干杯里的酒，装得好像根本不怕后果。可我看得清清楚楚，他一直小心躲着漂在酒里的软木屑，躲得又快又准。
        - id: ch01-b09
          speaker: harold
          text: 哼，说声胡扯当然容易。人人都知道这是真的，只有你不信。上回托马斯舅舅来家里，大人给他开了一瓶葡萄酒。他才抿了一点，就说：“呸，我的天，这酒有软木塞味！”接着一口也不肯再碰，害得他们只好另拿一瓶。
        - id: ch01-b10
          speaker: harold
          text: 可最好笑的是，后来那杯酒端到了过道里。我凑过去一看，里头根本没有软木塞！所以我把酒全喝掉了，味道好极了！
        - id: ch01-b11
          speaker: edward
          text: 小伙子，你最好小心点！演假面戏的人来家里的那一晚，你还记得吧？他们喝了热香料波特酒，等人一走，你就挨个儿把所有杯底都喝光了。
        - id: ch01-b12
          speaker: harold
          text: 哎哟，那天晚上我可真觉得怪怪的！我还以为房子要塌了，它一刻不停地乱蹦。楼梯也扭来扭去，玛莎只好把我抱上床！
        - id: ch01-b13
          speaker: narrator
          text: 哈罗德说着，还咯咯笑起来。我们仔细打量这个不成器的小弟弟。显然在他眼里，那只是一桩奇异现象，绝不算什么过错。
    - id: ch02
      title: 塞莉娜出门以后
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这时候，第三瓶酒已经在大家手里传了一圈。塞莉娜显然一直等着它传到自己面前，接过去便极不公平地喝了好大一口。随后她跳起来，抖平裙子，宣布要出去散步，说完便像野兔一样逃了。因为在我们家，谁敢擅自行动，大家照例要用武力阻拦。
        - id: ch02-b02
          speaker: edward
          text: 她又去找牧师住宅的那几个女孩子了。现在她天天跟她们出去。一上路，她们几颗脑袋立刻凑到一起，一路唧唧喳喳，唧唧喳喳，从头说到尾！
        - id: ch02-b03
          speaker: narrator
          text: 爱德华望着塞莉娜两条黑色的长腿在小径上一闪一闪，越走越远。
        - id: ch02-b04
          speaker: edward
          text: 真不明白她们哪来那么多话。她们的嘴从来不停，叽里咕噜说个没完，简直像一窝小秃鼻乌鸦！
        - id: ch02-b05
          speaker: narrator
          text: 阳光晒得人暖洋洋的，草地又软，姜汁啤酒的劲儿也上来了。我躺在那里，困得直想闭眼。
        - id: ch02-b06
          speaker: narrator
          text: 也许她们在谈鸟蛋，谈船，谈野牛和荒岛。还可以谈兔子的尾巴为什么是白的，谈她们更想要纵帆船还是单桅帆船，谈长大以后要做什么。只要真想开口，总有许许多多事情可说。
        - id: ch02-b07
          speaker: edward
          text: 可她们才不谈这些。她们怎么可能谈？她们什么也不懂，什么也不会，除了弹钢琴。可谁会想谈那个呀？凡是有点道理的事，她们全不关心。那么，她们到底谈些什么？
        - id: ch02-b08
          speaker: harold
          text: 有一回我问过玛莎。她说：“不关你的事。年轻小姐们有的是话可谈，那些话是年轻少爷们听不懂的。”
        - id: ch02-b09
          speaker: edward
          text: 我才不信。
        - id: ch02-b10
          speaker: harold
          text: 反正她就是那么说的。
        - id: ch02-b11
          speaker: narrator
          text: 哈罗德对这个问题毫不在意。它算不上什么头等大事，还害得姜汁啤酒不能继续往下传。他只盼酒瓶赶快重新传起来。
    - id: ch03
      title: 大人说话的本领
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 前门的门闩咔嗒响了一声。透过树篱的缺口，我们看见姑娘们沿大路出发。塞莉娜走在中间，牧师住宅的两个女孩子一边一个挽着她。果然像爱德华说的，三颗脑袋紧紧凑在一起。她们说个不停，声音乘着微风飘来，像明媚的三月清晨里，椋鸟忙碌的啁啾。
        - id: ch03-b02
          speaker: narrator
          text: 我想让爱德华消消气，便转头问夏洛特。她有时也会跟那些姑娘出去，也许知道她们一路上究竟谈些什么。
        - id: ch03-b03
          speaker: charlotte
          text: 我不知道。她们叫我走在后面，说我年纪太小，不该听见。可我真的好想听呀。
        - id: ch03-b04
          speaker: harold
          text: 每回有哪位太太来拜访伊莱扎姑妈，她们俩总是从头到尾一块儿说。可不知怎么的，每个人好像又都听得见对方在说什么。我怎么也弄不懂她们怎么办到的。大人真聪明！
        - id: ch03-b05
          speaker: narrator
          text: 我觉得副牧师才是最好笑的人。他总爱讲些一点意思也没有的话，讲完却当成笑话，自己笑个不停。昨天，别人问他要不要再添一点茶，他便说：“亲爱的朋友们，再一次冲向缺口，再一次！”接着浑身乱颤地偷笑。我一点也没看出哪里好笑。
        - id: ch03-b06
          speaker: narrator
          text: 后来有人问起他扣眼里插的花。他又说：“那不过是一朵微微凋谢的小花。”说完再次轰然笑开了。我只觉得蠢透了。
        - id: ch03-b07
          speaker: edward
          text: 噢，他呀，那也不能怪他。他就是染上了这么一种习惯。可我弄不明白的是那些女孩子。她们要是真有正经事可谈，为什么谁也不知道那是什么？
        - id: ch03-b08
          speaker: edward
          text: 要是没有，而且我们当然知道她们不可能有，那干吗不把嘴闭上？瞧这只老兔子。它就不想说话，因为它有更要紧的事可做。
        - id: ch03-b09
          speaker: narrator
          text: 爱德华说完，拿起一枚姜汁啤酒的软木塞，朝那只气定神闲的动物扔去。老兔子照样专心做自己的事，连身子也没挪一下。
    - id: ch04
      title: 兔子也会说话
      blocks:
        - id: ch04-b01
          speaker: harold
          text: 可是兔子真的会说话呀。我常看见它们待在兔笼里，把脑袋凑到一起，鼻子一上一下地动，跟塞莉娜和牧师住宅的女孩子一模一样。只不过，我当然听不见它们说什么。
        - id: ch04-b02
          speaker: edward
          text: 好吧，就算兔子会说话，我也敢打赌，它们说的绝不会像那些女孩子一样，全是废话！
        - id: ch04-b03
          speaker: narrator
          text: 爱德华很不情愿地让了一步，可他这句话既不厚道，也不公平。因为塞莉娜和朋友们究竟谈些什么，当时始终没有真相大白。直到今天，也还是无人知晓。
