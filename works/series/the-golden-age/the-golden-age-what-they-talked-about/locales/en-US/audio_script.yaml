  chapters:
    - id: ch01
      title: Ginger Beer on the Lawn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Edward was treating us to ginger beer like a gentleman. He had been the latest one sent to the dentist, so for the moment he had the money. Our family had a proper price for teeth: half a crown for an ordinary one, but only a shilling for a loose back tooth. Edward's tooth had plainly been shaky, though he had tried hard to look as if he were in agony. Still, he had earned enough for ginger beer.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Since he was paying, Edward refused to do any lowly fetching. He strutted around the garden while I went to the village post office for the bottles, and Harold stole a tumbler from the pantry. Soon we were stretched out on the lawn. We had even released the calmest, most respectable rabbit to make the feast look grand. It hopped soberly through the grass, choosing the juiciest plantain leaves.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Selina was the oldest lady there, so she was playing at being very dainty over the first full glass. She kept fishing out little pieces of broken cork.
        - id: ch01-b04
          speaker: edward
          text: >-
            Will you hurry up? Why do you girls always have to fuss over everything?
        - id: ch01-b05
          speaker: harold
          text: >-
            Martha says that if you swallow cork, it swells up inside you. It keeps swelling and swelling until you—
        - id: ch01-b06
          speaker: edward
          text: >-
            Oh, nonsense!
        - id: ch01-b07
          speaker: narrator
          text: >-
            Edward emptied the glass as if consequences meant nothing to him. Even so, I noticed that he dodged every floating bit of cork with very great skill and care indeed.
        - id: ch01-b08
          speaker: harold
          text: >-
            You can call it nonsense, but everyone except you knows it's true. When Uncle Thomas came, they brought him a bottle of wine. He took one tiny sip and said, “Goodness, this wine is corked!” Then he wouldn't drink any more, and they had to bring another bottle. But here's the funny thing. I looked in his glass afterward, out in the passage, and there wasn't a bit of cork in it. So I drank it all, and it tasted very good!
        - id: ch01-b09
          speaker: edward
          text: >-
            You ought to be careful, young man. Remember the night the Mummers came? They had mulled port, and after they left, you went around finishing every glass.
        - id: ch01-b10
          speaker: harold
          text: >-
            Oh, I did feel funny that night! I thought the house was falling down because it kept jumping about. Martha had to carry me to bed. The stairs were wobbling all over the place!
        - id: ch01-b11
          speaker: narrator
          text: >-
            We studied our shameless youngest brother. It was plain that Harold thought the whole thing was an interesting wonder, not bad behaviour at all.
    - id: ch02
      title: Selina Slips Away
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            By then a third bottle was making the rounds. Selina had clearly been waiting for it. She took a most unfairly long drink, jumped up, shook out her dress, and announced that she was going for a walk.
        - id: ch02-b02
          speaker: selina
          text: >-
            I'm going for a walk.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Then she ran off like a hare before anyone could catch her. In our family, anyone who tried to act independently could expect the others to stop them by force. We watched Selina's long black legs flashing farther and farther down the path.
        - id: ch02-b04
          speaker: edward
          text: >-
            She's going out with those Vicarage girls again. She meets them every day now. The moment they're together, they put their heads close and chatter, chatter, chatter without stopping. What can they possibly have so much to say about? They sound like a whole nest of young rooks!
        - id: ch02-b05
          speaker: narrator
          text: >-
            I was sleepy in the hot sun. The grass beneath me was soft, and the ginger beer had been powerful, so I offered my answer without much energy.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Maybe they discuss birds' eggs, or ships, or buffaloes, or desert islands. They might wonder why rabbits have white tails, whether they'd rather own a schooner or a cutter, and what they'll be when they're men. I mean, there are plenty of things to discuss if you really want to talk.
        - id: ch02-b07
          speaker: edward
          text: >-
            But they don't talk about anything like that. How could they? They don't know anything, and they can't do anything except play the piano. Nobody wants to discuss that. They don't care about anything sensible, either. So what can they be talking about?
        - id: ch02-b08
          speaker: harold
          text: >-
            I asked Martha once. She told me, “Never you mind. Young ladies have plenty to discuss that young gentlemen can't understand.”
        - id: ch02-b09
          speaker: edward
          text: >-
            I don't believe her.
        - id: ch02-b10
          speaker: harold
          text: >-
            Well, that's what she said.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Harold did not seem to think the mystery mattered very much. It was only slowing down the ginger beer.
    - id: ch03
      title: A Mystery Beyond the Hedge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The front gate clicked. Through a gap in the hedge, we saw the girls start down the road. Selina walked in the middle, with one Vicarage girl holding each arm. Their heads were pressed together, just as Edward had said. Their voices came back on the breeze, busy as starlings piping on a bright March morning.
        - id: ch03-b02
          speaker: narrator
          text: >-
            I wanted to settle Edward down, so I turned to Charlotte. She sometimes went walking with the older girls. “Charlotte, what do they talk about?” I asked.
        - id: ch03-b03
          speaker: charlotte
          text: >-
            I don't know. They make me walk behind because they say I'm too little and mustn't listen. And I want to hear so much.
          emotion: sad
        - id: ch03-b04
          speaker: harold
          text: >-
            Whenever a lady visits Aunt Eliza, they both talk at the same time. Somehow each one still hears everything the other one says. I don't know how they manage it. Grown-ups are so clever!
        - id: ch03-b05
          speaker: narrator
          text: >-
            The Curate is the funniest of all. He keeps saying things that make no sense, then laughing as if they were jokes. Yesterday someone offered him more tea, and he said, “Once more unto the breach, dear friends, once more.” Then he sniggered at his own words. I couldn't see anything funny about them. After that, someone asked about the flower in his buttonhole. He answered, “'Tis but a little faded flower,” and burst out laughing all over again. I thought the whole performance was very stupid.
        - id: ch03-b06
          speaker: edward
          text: >-
            Oh, him! He can't help it. That's simply a habit of his. It's those girls I don't understand. If they have something sensible to discuss, why has no one ever found out what it is? And if they haven't—and of course they can't have—why don't they stop talking?
    - id: ch04
      title: What Rabbits Say
      blocks:
        - id: ch04-b01
          speaker: edward
          text: >-
            Look at this old rabbit. He doesn't need to talk. He's got better things to do.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Edward fired a ginger-beer cork at the peaceful, unruffled animal to make his point. The rabbit did not move at all.
        - id: ch04-b03
          speaker: harold
          text: >-
            But rabbits do talk. I've watched them in their hutch lots of times. They put their heads together, and their noses bob up and down, just like Selina and the Vicarage girls. Of course, I can't hear what they're saying.
        - id: ch04-b04
          speaker: edward
          text: >-
            Well, if rabbits really talk, I'll bet they don't say the kind of rubbish those girls do!
        - id: ch04-b05
          speaker: narrator
          text: >-
            That was both unfair and ungenerous. After all, no one had yet discovered what Selina and her friends talked about. And to this day, no one ever has.
