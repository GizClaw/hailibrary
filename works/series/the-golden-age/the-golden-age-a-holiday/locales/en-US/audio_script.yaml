  chapters:
    - id: ch01
      title: The Holiday Morning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The masterful wind was up and out, shouting and chasing as lord of the morning. Poplars swayed with a roaring swish. Dead leaves sprang into the air, and the whole clear sky seemed to ring like a great harp.
        - id: ch01-b02
          speaker: narrator
          text: >-
            It was one of the year's first awakenings. The earth stretched and smiled in her sleep, and everything leapt at the giant stirring around it. For us, it was a whole holiday because someone had a birthday. It does not matter whose. One of us received presents and the usual pretty speeches, then glowed like a hero who had done nothing at all to earn it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            But the holiday belonged to everyone. So did the delight of Nature waking, the puddles, the sunshine, and the joy of breaking through hedges. Every outdoor pleasure was ours that morning. I raced across the meadows like a colt, kicking up my heels while Nature laughed with me. The sky was the bluest blue. Pools left by the winter floods flashed that same colour back, clear and brilliant. The soft air carried the touch of new growth. I felt it kindle something in my own small body, just as it kindled the bold primroses already hiding in sheltered places.
        - id: ch01-b04
          speaker: narrator
          text: >-
            I sped into that sun-filled world, free from lessons, discipline, and correction for one whole day. My legs ran by themselves. Someone called my name behind me, faint and shrill, but I did not stop. It was only Harold, I thought. His legs were shorter than mine, but he could keep running much longer. Then the call came again, weaker now, with a sad break in the middle. I stopped at once. That was Charlotte.
        - id: ch01-b05
          speaker: narrator
          text: >-
            She came panting up and dropped onto the grass beside me. Neither of us wanted to talk. Just being alive on that perfect morning was enough.
        - id: ch01-b06
          speaker: narrator
          text: "After a while, I asked where Harold was."
        - id: ch01-b07
          speaker: charlotte
          text: >-
            Oh, he's playing muffin-man again. Imagine wanting to be a muffin-man on a whole holiday!
        - id: ch01-b08
          speaker: narrator
          text: >-
            It was certainly a strange craze. Harold invented games that needed no one else, and he stayed loyal to each new one until he had worn it out. At that time, he was a muffin-man day and night. He went along passages and up and down stairs, ringing a silent bell and offering phantom muffins to invisible people.
        - id: ch01-b09
          speaker: narrator
          text: >-
            It may sound like poor sport. Still, there was something to be said for walking through busy streets you had built yourself, ringing your own imaginary bell, and selling airy muffins of your own making to a bustling crowd you had created. Even so, the game hardly suited this bright, wind-swept morning.
        - id: ch01-b10
          speaker: narrator
          text: "I asked where Edward was."
        - id: ch01-b11
          speaker: charlotte
          text: >-
            He's coming along the road. When we get there, he'll be hiding in the ditch. He's going to jump out as a grizzly bear, but don't say I told you. It's meant to be a surprise.
        - id: ch01-b12
          speaker: narrator
          text: "I generously agreed."
        - id: ch01-b13
          speaker: narrator
          text: >-
            Come on, then. We'll be surprised.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Yet I could not help feeling that, on this day of all days, even a grizzly bear seemed ordinary and out of place.
    - id: ch02
      title: Bears and Lions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Sure enough, an unmistakable bear sprang at us when we reached the road. Shrieks, growls, pistol shots, and unrecorded acts of heroism followed. At last Edward kindly rolled over and died, large, grim, and every inch a grizzly.
        - id: ch02-b02
          speaker: narrator
          text: >-
            We all understood that anyone who became a bear must die sooner or later, even if he was the eldest. Otherwise, life would have been nothing but battle and slaughter, and our hard-won civilisation would have given way to an Age of Acorns. Once the affair had ended to everyone's satisfaction, we wandered on. Along the way we collected Harold, who had finished with muffins and returned to his proper social self.
        - id: ch02-b03
          speaker: charlotte
          text: >-
            What would you do if you saw two lions in the road, one on each side, and you couldn't tell whether they were chained or loose?
        - id: ch02-b04
          speaker: narrator
          text: >-
            Whatever book Charlotte was reading always filled her thoughts until she had taken everything she could from it.
        - id: ch02-b05
          speaker: edward
          text: "What would I do? I'd... I'd... I'd..."
        - id: ch02-b06
          speaker: narrator
          text: "Edward's brave voice faded into a mumble."
        - id: ch02-b07
          speaker: edward
          text: "I don't know what I'd do."
        - id: ch02-b08
          speaker: narrator
          text: >-
            I considered the question before answering.
        - id: ch02-b09
          speaker: narrator
          text: "I wouldn't do anything."
        - id: ch02-b10
          speaker: narrator
          text: >-
            And truly, it would have been hard to reach a wiser conclusion.
        - id: ch02-b11
          speaker: harold
          text: >-
            If anyone did anything, the lions would be doing all of it, wouldn't they?
        - id: ch02-b12
          speaker: charlotte
          text: >-
            But if they were good lions, they'd treat you the way they wanted to be treated.
        - id: ch02-b13
          speaker: edward
          text: >-
            But how can you tell a good lion from a bad one? The books never explain, and the lions don't have different marks on them.
        - id: ch02-b14
          speaker: harold
          text: "There aren't any good lions."
        - id: ch02-b15
          speaker: edward
          text: >-
            Of course there are. There are heaps of them. Nearly every lion in a storybook is good. There was Androcles' lion, and Saint Jerome's lion, and... and the Lion and the Unicorn.
        - id: ch02-b16
          speaker: harold
          text: "The Lion beat the Unicorn all around the town."
        - id: ch02-b17
          speaker: edward
          text: >-
            That proves he was a good lion! But how do you tell when you meet one?
          emotion: happy
        - id: ch02-b18
          speaker: harold
          text: "I'd ask Martha."
        - id: ch02-b19
          speaker: narrator
          text: >-
            That simple faith made Edward snort. Then he turned to Charlotte.
        - id: ch02-b20
          speaker: edward
          text: >-
            Let's play lions anyway. I'll run to that corner and be two lions, one on each side of the road. You'll walk toward me without knowing if I'm chained. That's where the fun comes in!
        - id: ch02-b21
          speaker: charlotte
          text: >-
            No, thank you. You'll stay chained until I get close. Then you'll break loose, tear me to pieces, dirty my frock, and probably hurt me too. I know what your lions are like.
        - id: ch02-b22
          speaker: edward
          text: >-
            I won't, honestly. This time I'll be a completely new sort of lion, one you can't even imagine.
        - id: ch02-b23
          speaker: narrator
          text: >-
            Edward raced away to take his place. Charlotte hesitated, then crept forward. With each step she became less like Charlotte pretending for a moment and more like a frightened traveller facing an ancient danger. The lion's fury grew as she approached, and his roars filled the startled air.
        - id: ch02-b24
          speaker: narrator
          text: >-
            I waited until both of them were lost in the game. Then I slipped through the hedge, leaving the worn road for the empty meadows. It was not that I disliked company, or even that I knew Edward's lions too well. The glorious morning was calling through my blood, and I had to answer.
    - id: ch03
      title: Following the Wind
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Earth to earth! That was the day's honest call, its joyful invitation. All our human talk and pretending felt false beside it. Nature had stopped holding back. She was singing with her whole voice, and every part of me thrilled to her song.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The air was wine. So was the smell of damp earth, the lark's song, the scent drifting from the cowshed at the top of the field, and the puff and smoke of a faraway train. Or were they all one song, or one scent? I had no words for the force rising from the earth then, and I have never found them since.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I ran sideways and shouted. I stamped my heels into the wet soil, splashed showers of diamonds from puddles with a stick, and flung clods high into the sky. Before long, I found myself singing. The words meant nothing, and the tune wandered up and down without rhythm. Yet it felt like a true expression of that moment, the one perfect thing to sing. People would have laughed at it. Nature, singing in the same key everywhere, accepted every note.
        - id: ch03-b04
          speaker: narrator
          text: >-
            All this time, the hearty wind called to me like a friend as he swung and bellowed in the treetops. He seemed to be asking me to let him lead the day.
        - id: ch03-b05
          speaker: wind
          text: >-
            Follow me today. On other holidays, you've walked wherever the steady sun led you. Then you've dragged your tired feet home late, with only the pale, blank moon beside you. Why not choose me this time? I rush around corners and boast, then fall away and dodge you, only to gather myself and chase again. No one can lead you a finer or stranger dance. I'm strong and changeable, the lord of misrule. I answer to no law.
        - id: ch03-b06
          speaker: narrator
          text: >-
            I was ready to join his game. Was this not a whole holiday? So we went off together, arm in arm, you might say. I trusted my free and dancing guide completely, wherever his crooked path might lead.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Before he had finished with me, I found him a most surprising companion. Was it a joke, or did he have some serious purpose, when he brought me straight upon two lovers? They stood silent and face to face across a stile that watched without blinking.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Usually, I thought this kind of thing was the most foolish nonsense. Two calves rubbing noses through a gate seemed natural and proper. But how could human beings behave that way when interesting things and important adventures called from every side? It was something to hurry past with a red face and forget.
        - id: ch03-b09
          speaker: narrator
          text: >-
            That morning was different. The same magic in the air seemed to give everything a place and bring it into tune. To my surprise, I passed those foolish lovers with kindness instead of scorn. They did not notice me. Some gentle power abroad had made even their behaviour fit with the buds, the new growth, and the playful air.
    - id: ch04
      title: Biscuits and Feathers
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            My wilful companion puffed against my right cheek and sent me off in a new direction. Soon I saw the village church sitting alone inside its ring of elms. Two small legs stuck out of the vestry window. They twisted and kicked, searching for something to stand on. Every wriggle announced robbery, and perhaps sacrilege too. It was a shocking sight for anyone loyal to the Church.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The rest of the thief was hidden, but I knew those legs. They usually belonged to Bill Saunders, the finest bad boy in the village. I could also guess what Bill wanted. The Vicar kept biscuits in a cupboard with his official robes, and Bill had his heart set on them. There could hardly have been any doubt about his prize.
        - id: ch04-b03
          speaker: narrator
          text: >-
            I paused, then went on. I was not taking Bill's side. But I was not taking the Vicar's either. This lawless morning seemed to suggest that Bill might have as much right to the biscuits as the Vicar, and he would certainly enjoy them more. In any case, the matter could be argued, and it was none of my business. Nature had accepted me as her ally. She cared little about who owned the world's biscuits, and she would not have her friend waste a holiday by playing policeman for Society.
        - id: ch04-b04
          speaker: narrator
          text: >-
            My restless guide pulled at me again, and I followed. I felt certain that he had more holiday sights to show me. He did, and every one followed the same lawless tune. A hawk hung in the blue air like a black pirate flag. Then it dropped like a stone into the hedge, and a thin, sharp squeal rose from below.
        - id: ch04-b05
          speaker: narrator
          text: >-
            By the time I reached the spot, the tragedy was over. Only a quick scatter of feathers lay on the grass, like playbills tossed aside after a performance. They were all that remained to show what had happened there. Yet Nature went on smiling and singing. She was pitiless, cheerful, and fair to both sides. To her, there was as much to be said for the hawk as for the chaffinch. Both were her children, and she chose neither one above the other.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Farther on, a hedgehog lay dead across the path. More than dead, in fact. Decay had already set in. It was a sad sight, for I had known the little fellow in busier days.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Surely Nature might have stopped to shed one tear for this rough-coated son of hers. His plans had come to nothing, his ambitions were cancelled, and his useful life had ended too soon. But she did not pause. Her joyful song bubbled on, now singing of death within life, then life within death.
        - id: ch04-b08
          speaker: narrator
          text: >-
            I looked around at the gnawed ends of turnips scattered over the ground. Sheep had eaten their hearts during the frozen days, which were now gone. For a moment, I began to understand something of the hard meaning inside Nature's brave song.
    - id: ch05
      title: The Whipping-Post
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            My unseen companion was singing too. At times, he seemed to chuckle softly to himself. Perhaps he was amused by the strange new lessons he was teaching me. Or perhaps he was thinking of one last trick he still had waiting.
        - id: ch05-b02
          speaker: narrator
          text: >-
            At last, he tired of such a small companion tied to the earth. At a place I knew, he deserted me. The wind dropped, sank away, and disappeared into nothing.
        - id: ch05-b03
          speaker: narrator
          text: >-
            I looked up. There before me stood the village's ancient whipping-post, grim and covered in lichen. Its sides were cut with the initials of a generation that had ignored its silent warning. Those carved letters covered the old wood, but they had not changed what the post meant. The stout, rusty shackles were still fixed to it. Long ago, they had held the wrists of that generation's ancestors when those people dared to laugh at order and law.
        - id: ch05-b04
          speaker: narrator
          text: >-
            A more sentimental child might have made a grand display of feeling. I could only hurry home with my moral tail tucked firmly between my legs. When I glanced over my shoulder, I had the uneasy sense that meeting the whipping-post was not mere chance. There was more to it than I could see.
    - id: ch06
      title: The Holiday Reckoning
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Outside our gate, I found Charlotte alone and crying. Edward had persuaded her to hide, promising nothing aloud but leaving her certain of what would follow. She had expected him to search properly, find her, and leap upon her with delight. She waited in her hiding place for that happy moment. Then he spotted the butcher's cart. He forgot his duty, forgot all about Charlotte, and ran off to get a ride.
        - id: ch06-b02
          speaker: narrator
          text: >-
            Harold had suffered too. He badly wanted some tadpoles, and the excitement of owning them had made him careless. He fell into the pond. That alone was nothing. But when he tried to slip in through the back door, an aunt caught him covered in duckweed. She sent him straight to bed. On an ordinary day that might not have been much, but on a holiday it was very serious indeed.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The warning of the whipping-post was already coming true. So I was not surprised when I reached home, was seized, and found myself accused of something I had never even thought of doing.
        - id: ch06-b04
          speaker: narrator
          text: >-
            By then, I was in such a state of mind that I could only wish, with all my heart, that I had done it.
