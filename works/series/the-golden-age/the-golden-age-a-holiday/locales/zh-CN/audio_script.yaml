audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 认真敏感，抱怨时直率，想象中带着谨慎
        timbre: 清亮稚嫩
        pace: 自然偏快，犹豫时放慢
        pitch: 中高
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真笃定，思考时一本正经，带着朴素幽默
        timbre: 柔和稚嫩的男孩声
        pace: 稍慢，句间有思索感
        pitch: 中高
    wind:
      display_name: 风
      tts:
        delivery: 诱人同行的顽皮召唤，任性而自信
        timbre: 开阔有气流感，清朗而富于变化
        pace: 忽快忽缓，转折灵活
        pitch: 中
  chapters:
    - id: ch01
      title: 风起的假日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 风一早就出了门。它呼喊着，追逐着，成了整个早晨的主人。白杨树被吹得来回翻腾，发出轰鸣。枯叶腾空飞旋，澄澈的天空也跟着震颤，仿佛一架巨大的竖琴被风拨响。
        - id: ch01-b02
          speaker: narrator
          text: 那是一年里最早醒来的日子之一。大地在梦中含着笑舒展身体，万物都随着这个巨人的动作跳动起来。我们正好放一整天假，因为家里有人过生日。是谁过生日并不重要。那个人收了礼物，也听了几句漂亮的祝词。明明什么功劳也没有，心里却像英雄一样光荣，而且一样甜美。
        - id: ch01-b03
          speaker: narrator
          text: 可这一天属于我们每个人。大自然醒来的狂喜，水洼、阳光和钻树篱的快乐，也属于我们每个人。我像匹小马驹似的跑过草地，快活地扬起脚跟，大自然也朝我笑。天空蓝得不能再蓝，冬天洪水留下的水洼把蓝色映得又真又亮。柔软的空气正在催生万物。背风处早开的樱草花被它点亮了，我这个小小的人也像被它点着了。
        - id: ch01-b04
          speaker: narrator
          text: 我冲进洒满阳光的世界。至少今天，我不用上课，不受管束，也不会有人来纠正我。两条腿自顾自地往前跑。身后传来细细的呼声，有人在叫我的名字，可我没停。我猜是哈罗德。他的腿虽短，这点冲刺还追得上。呼声又来了一次，这回更微弱，中间还可怜地断了一下。我听出夏洛特的声音，立刻停住。
        - id: ch01-b05
          speaker: narrator
          text: 她喘着气赶来，一下坐在我身边的草地上。谁也不想开口。能在这个完美的早晨活着，感受它的光辉和喜悦，已经足够了。
        - id: ch01-b06
          speaker: narrator
          text: 歇了一阵，我才问她，哈罗德在哪儿。
        - id: ch01-b07
          speaker: charlotte
          text: 他又在玩松饼小贩，跟平常一样。整整一天假呢，他居然还想当松饼小贩！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 哈罗德的这股迷恋的确古怪。他总是自己发明游戏，不要人帮忙，一个人玩。每有新花样，他就守着不放，非要把兴头用尽。眼下他白天黑夜都在走廊和楼梯间穿行，摇一只没有声音的铃，向看不见的路人兜售根本不存在的松饼。他走过的闹市是自己造的，迎面涌来的忙碌人群也是自己想出来的。
        - id: ch01-b09
          speaker: narrator
          text: 这游戏听来实在贫乏。不过，你若走在自己建造的繁华街道上，一路摇着想象中的铃，把亲手做出的空气松饼卖给自己创造的热闹人群，其中倒也有些妙处。只是放在这个阳光灿烂、风扫四野的早晨，终究不大相称。
    - id: ch02
      title: 熊与狮子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我又问，爱德华去哪儿了。
        - id: ch02-b02
          speaker: charlotte
          text: 他正从大路那边过来。等我们走近，他会躲进沟里，再扮成灰熊扑出来。可别说是我告诉你的，这是个惊喜。
        - id: ch02-b03
          speaker: narrator
          text: 好吧，我们就去吃上一惊。我答应得十分大方。可在这样一个特别的日子里，我总觉得连灰熊也平常得不合时宜。
        - id: ch02-b04
          speaker: narrator
          text: 我们刚走上大路，一头真得不能再真的熊果然扑了出来。尖叫、咆哮和左轮手枪的枪声立刻响成一片。中间自然还有许多无人记录的英雄壮举。到最后，爱德华终于肯屈尊倒下，庞大而凶狠地死在那里，始终是一头彻头彻尾的灰熊。
        - id: ch02-b05
          speaker: narrator
          text: 我们早有一条人人明白的规矩，谁扮熊，迟早就必须死，哪怕他是家里的长子。不然，日子里只剩下打斗和杀戮，辛苦得来的文明也会退回橡果时代。这场小战事叫交战各方都很满意。我们继续沿路闲逛，途中找回了离队的哈罗德。他不再卖松饼，神志恢复正常，也肯和大家作伴了。
        - id: ch02-b06
          speaker: narrator
          text: 过了一会儿，夏洛特又想起了她正在读的书。每一本新书都会占满她的脑袋，直到里面的滋味全被吸干，才会让她扔到一旁。她问我们一个问题。
        - id: ch02-b07
          speaker: charlotte
          text: 要是路上有两头狮子，一边一头，你又不知道它们是放开的还是拴着的，那你怎么办？
        - id: ch02-b08
          speaker: edward
          text: 怎么办？我会……我会……我会……
        - id: ch02-b09
          speaker: narrator
          text: 爱德华起初喊得十分英勇，声音却越来越小，最后只剩一声含糊的咕哝。
        - id: ch02-b10
          speaker: edward
          text: 我也不知道该怎么办。
        - id: ch02-b11
          speaker: narrator
          text: 我想了想，说我什么也不做。认真说来，恐怕也想不出比这更明智的办法。
        - id: ch02-b12
          speaker: harold
          text: 真要说谁来办事，所有的事都会由狮子来办，对吧？
        - id: ch02-b13
          speaker: charlotte
          text: 可要是它们是好狮子，就会照自己希望受到的待遇来对待别人。
        - id: ch02-b14
          speaker: edward
          text: 可你怎么认出好狮子和坏狮子？书里完全没说，狮子身上又没做不同的记号。
        - id: ch02-b15
          speaker: harold
          text: 根本就没有好狮子。
        - id: ch02-b16
          speaker: edward
          text: 当然有，而且多得很！故事书里的狮子差不多都是好的。安德罗克勒斯的狮子，圣杰罗姆的狮子，还有……还有狮子和独角兽……
        - id: ch02-b17
          speaker: harold
          text: 狮子绕着城镇打败了独角兽。
        - id: ch02-b18
          speaker: edward
          text: 这正好证明它是好狮子！可问题还在。真见到它们时，你怎么认得出来？
          emotion: happy
        - id: ch02-b19
          speaker: harold
          text: 要是我，我就去问玛莎。
        - id: ch02-b20
          speaker: narrator
          text: 哈罗德的信念就是这样简单。爱德华轻蔑地哼了一声，又转向夏洛特。
        - id: ch02-b21
          speaker: edward
          text: 听我说，咱们还是玩狮子吧。我先跑到那个拐角，一个人扮两头狮子，路两边各一头。你走过来，却不知道我有没有被拴住。这样才好玩！
        - id: ch02-b22
          speaker: charlotte
          text: 不，谢谢。等我离得远，你会一直拴着。等我靠近，你就会挣开，把我撕成碎片，弄脏我的裙子，说不定还会弄疼我。你那些狮子，我可太清楚了！
        - id: ch02-b23
          speaker: edward
          text: 不会的，我发誓不会！这一次我要做一头全新的狮子，和你能想出来的都不一样。
        - id: ch02-b24
          speaker: narrator
          text: 爱德华跑去守住自己的位置。夏洛特犹豫了一会儿，还是怯怯地走过去。她每迈一步，就少一点刚刚装扮起来的夏洛特，多一点古往今来忧心前路的天路客。狮子见她接近，怒气越来越可怕，咆哮声响彻四周。
        - id: ch02-b25
          speaker: narrator
          text: 我等他们两个完全入了戏，便悄悄钻过树篱，离开被人踏熟的大路，走进空空的草地。我不是不愿意合群，也不是对爱德华的狮子看得太多。只是这个神圣的早晨正在召唤我，那股渴望已经涌进血里。
    - id: ch03
      title: 跟着风走
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 回到大地，投入大地！这就是那一天的音符，也是它快活的召唤。大自然不再沉默，正放开喉咙歌唱。她的歌震动每一根纤维，把它们全都抓住。和这歌声放在一起，人的议论与假扮怎能不刺耳，怎能不显得做作？
        - id: ch03-b02
          speaker: narrator
          text: 空气像酒，湿泥土的气味也像酒。云雀的歌、田顶牛棚飘来的气息、远方火车的喘息和烟雾，全都像酒。或者，那是歌？是气味？它们融在一起，到底成了什么？那时我找不到话来形容那股分明感受到的大地气息。直到今天，我还是找不到。
        - id: ch03-b03
          speaker: narrator
          text: 我横着身子奔跑，大声叫喊。脚跟欢欢喜喜地踩进吱响的湿土。我拿树枝搅动水洼，溅起钻石般的水花，又随手把泥块抛向天空。后来，我不知怎么唱起歌来。歌词全是没意义的胡话，曲调也是随口编的，忽高忽低，又疲弱，又没有节拍。
        - id: ch03-b04
          speaker: narrator
          text: 可在我心里，那是真正的表达。就在那一刻，只有这样的歌才合宜，才正确，才完美。人类听见它，准会轻蔑地拒绝。大自然却处处唱着同一个调子。她认出了我的歌，一点异议也没有，就这样收下了。
        - id: ch03-b05
          speaker: narrator
          text: 那阵兴致勃勃的风始终在树梢摇荡、吼叫，像个伙伴似的叫着我。我听着听着，仿佛真听见它在向我发出邀请。
        - id: ch03-b06
          speaker: wind
          text: 今天让我带路吧。以前放假，你总跟着迟钝又不肯转弯的太阳走。等你这个贪玩晚归的逃学鬼拖着累脚回家，陪你的只剩下一轮苍白、没有表情的月亮。今天为什么不跟我？
        - id: ch03-b07
          speaker: wind
          text: 我是骗子，也是伪君子。我猛地绕过街角，大声叫嚷，忽然又弱下去，闪身躲开，接着重新振作，追上前来。谁也不能像我这样，领你跳一场精彩又难得的舞。我强大又任性，是胡闹之王。只有我不负责任，不讲原则，也不听任何法则的话。
        - id: ch03-b08
          speaker: narrator
          text: 我当然乐意顺着这个家伙的兴致。今天不是有一整天假吗？于是我们一起转了方向，就算是手挽着手吧。我对这位没有锁链的领路人满怀信任，沿着它给我的路线走去。那条路摇摇摆摆，尽往横处斜处伸展。
    - id: ch04
      title: 不守规矩的早晨
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 在风离开我以前，我见识了这个伙伴有多古怪。它把我迎面送到一对情人跟前。两个人隔着一道知趣而从不眨眼的篱笆梯，默默相对。风是在开玩笑，还是另有严肃的用意？
        - id: ch04-b02
          speaker: narrator
          text: 平常，这种事在我眼里是最可怜的胡闹。两头小牛隔着栅门蹭鼻子，既自然又合规矩。可人类明明有那么多重要兴趣和活跃事业从四面招手，处处等着他们投入，怎么还能这样站着？这种场面，只该红着脸赶紧走过，以后再也不想。
        - id: ch04-b03
          speaker: narrator
          text: 可这个早晨不同。我遇到的一切，都被空气里的同一种魔力解释了，也调准了音。我从那两个痴人身旁慢慢走过，他们面对面站着，根本没有留意我。我竟带着善意看他们，不再鄙夷，自己也很惊讶。天地间真有一种调和的力量，能让这种傻举动也合进萌芽、生长和嬉闹的风里。
        - id: ch04-b04
          speaker: narrator
          text: 任性的风吹了吹我的右脸，我便换个方向。不久，我看见村里的教堂独自坐在一圈榆树当中。圣器室的窗口伸出两条小腿，在半空不停乱蹬，急着找落脚处。每一下扭动都显出偷窃的企图，甚至有些亵渎神明。拥护国教的人见了，准会觉得大不敬。
        - id: ch04-b05
          speaker: narrator
          text: 窗里的身体虽然看不见，那两条腿我却很熟。它们通常长在比尔·桑德斯身上。比尔是全村最坏的孩子，他想偷什么，我也猜得到。牧师有些饼干，和做礼拜时的衣饰一起收在柜里。这件事我早就知道。
        - id: ch04-b06
          speaker: narrator
          text: 我犹豫片刻，还是继续走了。我得声明，我不站在比尔这边，可我也不站在牧师那边。这个不守规矩的早晨像是在提醒我，比尔也许和牧师一样有权吃那些饼干，而且肯定吃得更开心。反正事情有争议，又不归我管。
        - id: ch04-b07
          speaker: narrator
          text: 大自然已经收我做盟友。她不在乎全世界的饼干归了谁，更不会让自己的朋友浪费光阴，替社会充当警察。
    - id: ch05
      title: 大自然的两副面孔
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 不依不饶的向导又扯着我向前。我跟在风后面闲逛，相信它还有更多适合假日看的东西，等着领我去见识。它果然有，而且每一样都唱着同样不守法度的曲调。一只鹰停在蓝色的天空之海上，像一面不祥的黑色海盗旗。忽然，它像铅坠一样直落树篱。那里随即传出一道又细又尖、痛苦无助的惨叫。
        - id: ch05-b02
          speaker: narrator
          text: 等我赶到，草地上只剩几撮凌乱的羽毛，像散落的戏单，告诉人们一出惨剧刚刚演完。大自然却还在微笑歌唱。她无情、欢快，谁也不偏。在她看来，鹰有鹰的道理，苍头燕雀也有苍头燕雀的道理。它们都是她的孩子，她不偏爱哪一个。
        - id: ch05-b03
          speaker: narrator
          text: 再往前，一只刺猬横死在路上。不，它已经不只是死了，分明开始腐败。见过这家伙从前到处奔走、忙忙碌碌的样子，再看眼前这一幕，实在叫人难过。大自然至少该停一停，为这个穿粗硬外套的小儿子掉一滴眼泪吧。它的目标落了空，雄心消失了，原本可以有所作为的一生突然断掉了。
        - id: ch05-b04
          speaker: narrator
          text: 可她一点也不在乎。她的歌依然欢腾，汩汩流淌，一会儿唱“生中之死”，一会儿又唱“死中之生”。我四下望去，看见地上散着绵羊啃剩的芜菁尾根。在早已过去的冰封日子里，它们的心被吃空了。看着这些残根，我似乎稍稍听懂了她勇敢的歌里那股严厉的意思。
    - id: ch06
      title: 笞刑柱的教训
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 看不见的伙伴也在唱歌，有时还像在偷偷发笑。它大概想到了刚教给我的古怪功课，也可能还藏着一个特别顽皮的把戏。最后，它厌倦了我这个渺小又离不开地面的伙伴，在一个熟悉的地方把我丢下。风低了，停了，悄悄溜走，终于消失不见。
        - id: ch06-b02
          speaker: narrator
          text: 我抬起头，村里古老的笞刑柱正立在面前。它阴森森的，长满苔藓。柱身刻着一代人的姓名首字母。那些人不把它沉默的教训放在眼里，可粗大生锈的镣铐仍扣在柱上。他们的祖先中，凡是敢嘲弄秩序和法律的人，都曾被锁住双腕，拴在这里。
        - id: ch06-b03
          speaker: narrator
          text: 假如我是童年时代的斯特恩，这正是大发感伤议论的好机会。可我毕竟只是我。我只能赶紧往家走，把道德的尾巴老实夹在两腿之间。回头看时，我心里隐隐不安。这场相遇，恐怕不只表面那么简单。
        - id: ch06-b04
          speaker: narrator
          text: 到了自家门外，我看见夏洛特独自哭泣。原来爱德华劝她藏起来，她以为他会照规矩找到自己，再兴奋地扑上来。可爱德华看见肉贩的车，忘了自己的责任，跑去搭车兜风了。
        - id: ch06-b05
          speaker: narrator
          text: 哈罗德那边也出了事。他太想要蝌蚪，满脑子都装着即将到手的宝贝，结果一头栽进池塘。掉进水里本身没什么。可他想从后门偷偷回家时，满身浮萍，正落到一位姑妈手里，立刻被送去睡觉。平常也就算了，在假日里，这可是大事。
        - id: ch06-b06
          speaker: narrator
          text: 笞刑柱的教训开始一一应验。夏洛特被遗忘，哈罗德在假日里被送上床，我也逃不过去。等我到家，立刻被人一把抓住，指控我做了一件连想都没想过的坏事。我一点也不惊讶。那时我的心境甚至让我真心希望，那件事但愿就是我做的。
