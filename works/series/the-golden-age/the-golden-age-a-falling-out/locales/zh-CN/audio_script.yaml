audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    farmer_larkin:
      display_name: 拉金农场主
      tts:
        delivery: 朴实爽快，关切时亲切而不多话
        timbre: 浑厚结实的成年男声
        pace: 稳健，不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 胳膊肘惹出的祸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            这件事隔了好些时候，哈罗德才断断续续地告诉我。他很不愿提起，因为有些痛苦哪怕只发生了一瞬间，也会像淤伤一样留在心里，很久都不消退。直到后来，他偶尔想起，仍会觉得隐隐作痛，就像从海外战场回来的老兵，身体里还留着一颗子弹。
        - id: ch01-b02
          speaker: narrator
          text: >-
            那天，哈罗德坚持七乘七等于四十七，仅仅因为这件事，放学后便被关在教室里。他越想越委屈，整颗心像一处碰哪儿哪儿疼的伤口。为什么偏得是四十九？四十七看起来并不比四十九难看。既然不过是凭着任性的趣味，随意挑中一个答案，那么在他心里，七乘七一直是四十七，直到世界末日也永远是四十七。
        - id: ch01-b03
          speaker: narrator
          text: >-
            塞利娜原本正在阳光下玩遥远西部的游戏，还光荣地当着阿帕奇女人。她放下游戏走进来，只想听哈罗德背乘法表，好帮他早点出去。可哈罗德心里处处都疼，竟恶狠狠地拒绝她，还为了一个人痛痛快快地生闷气，用胳膊肘猛撞了她的肋骨。
        - id: ch01-b04
          speaker: narrator
          text: >-
            胳膊肘刚撞出去，他就知道自己成了野蛮人。那阵怒气转眼散了，他的灵魂却像跌坐在尘土里，只顾苦苦寻找一种足够英勇的补偿，好把过错抹平。
        - id: ch01-b05
          speaker: narrator
          text: >-
            其实塞利娜不要牺牲，也不要英雄壮举，甚至不需要他道歉。只要哈罗德肯和好，她自己说对不起都行。可男孩子办事不是这个路数。哈罗德认定，自己欠她一件实实在在的东西。那件事没有办成以前，绝不能先谈和好，否则最后那一下庄严的效果便毁了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他被放出来以后，可怜的塞利娜一直在旁边转，想等他看自己一眼。哈罗德心里每耽搁一分钟都像在流血，却让这个走了样的好心思支配着，始终躲开她，反而跑来找我。我当然大力赞成。直接走过去，平平淡淡地和好，谁不会呢？那可一点也不够高尚。一个姑娘刚挨了满怀敌意的一肘，总得有件礼物当药膏，才能安慰她受伤的心。
        - id: ch01-b07
          speaker: harold
          text: >-
            我知道她最想要什么。玩具店橱窗里有一套茶具，上面画着红花蓝花。她惦记好几个月了，说娃娃们已经长大，能真正喝下午茶。她想得太厉害，每次进城都不肯走街的那一边。可是，那套茶具要五先令！
        - id: ch01-b08
          speaker: narrator
          text: >-
            我们认真动起手来，花了整个下午清点全部资产，还编了一份即使标明来自白厅，也绝不会叫人难为情的预算。哈罗德有两先令六便士，是一位叔叔给的。这笔钱失踪了将近一星期，最后才从狗窝的稻草里找回来，所以一直没花。我又拿他下一位叔叔将来给的钱作担保，预支了一先令。要是那笔钱始终没来，就等圣诞节再收账。
        - id: ch01-b09
          speaker: narrator
          text: >-
            我们又用刀片从传教捐款箱里抖出四便士。那些本来就是我们的钱，这只能算强制征收。爱德华还欠哈罗德两便士赌金，因为哈罗德真敢走过拉金农场主那头公牛所在的田地。这笔钱费了好大劲才收回来。最后，玛莎不要担保，借给我们一先令，条件只是不能告诉姑妈。加起来正好五先令。我们终于又能喘气了。
    - id: ch02
      title: 二十四小时的疏远
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            接下来似乎再容易不过。第二天下午五点，塞利娜要给娃娃开茶会。那套磕破的旧木茶具，从她小时候起，已经服侍过一代又一代娃娃。哈罗德准备吃过午饭独自溜进城，免得引人怀疑，因为大人不许我们自己去那里。
        - id: ch02-b02
          speaker: narrator
          text: >-
            我们那座小小的都会离家将近两英里，时间却很充裕。就算回程要抱着一只塞满刨花的包裹，他也来得及。说不定还能遇见相熟的肉店老板，搭一段车。等五点钟一到，新茶具像从天而降，塞利娜一定欣喜若狂。补偿做完，他们终于可以和好，哈罗德的尊严也丝毫无损。
        - id: ch02-b03
          speaker: narrator
          text: >-
            为了那一刻，我们觉得再假装疏远一天不算什么。塞利娜却不知道惊喜就在前面。她整个晚上都闷闷不乐，最后带着一颗沉甸甸的心上床睡了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            第二天时辰一到，哈罗德熟练地躲开大人们的眼睛，直奔前门。塞利娜一直留意他，以为他要去池塘捉青蛙。那本来是他们约好一起玩的事，她便追了上去。
        - id: ch02-b05
          speaker: narrator
          text: >-
            哈罗德明明听见了她的脚步，却为了自己的崇高使命，一眼也不回。塞利娜只好垂头丧气地在花坛间走来走去。在她眼里，花朵连香气和颜色都没有了。我看见了全部经过。理智说我们的计划很对，本能却说，我们就是一群野蛮人。
    - id: ch03
      title: 被遗忘的茶具
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            哈罗德后来告诉我，他几乎一路跑进城，速度快得从未有过。他生怕那套在橱窗里安安稳稳待了六个月的茶具，偏偏会在今天被另一个伤了姐妹、良心不安的人抢走。可是它居然还在那里，店主也真肯照标签上的价钱卖。哈罗德简直不敢相信自己的好运，立刻把五先令如数付清，绝不给这桩买卖留下任何反悔的机会。
        - id: ch03-b02
          speaker: narrator
          text: >-
            店里还得把茶具从橱窗取出来，再包扎妥当。下午尚早，哈罗德决定犒劳自己，尝尝城里的快乐，过一小会儿波希米亚式的自由生活。他当然先逛商店，把鼻子依次压扁在橱窗玻璃上。这里有橡皮球，那里有上发条的火车。理发店的假发套在木头脑袋上，活像几位叔叔，旁边的剃须膏看着又实在好吃。
        - id: ch03-b03
          speaker: narrator
          text: >-
            杂货店里的葡萄干堆得太多，除非格外卖力，全英国的人也吃不完。银行里的人更不把黄金当回事，竟拿铲子铲来铲去。接着是喧闹的集市广场。一头逃脱的小牛像炮弹一样冲过街道时，哈罗德觉得，这一生总算没有白活。
        - id: ch03-b04
          speaker: narrator
          text: >-
            整个城里盛满了刺激，他早忘了自己为什么来，又是来办什么事。直到看见教堂的钟，那个更好的哈罗德才猛然醒来，立刻飞奔出城。他只剩勉强赶回家的时间。若是迟到，不仅赶不上新茶具从天而降的崇高凯旋，还会让人发现他私自越过了活动界线。跟这种可怕的罪过相比，坚持七乘七等于四十七，根本算不了什么。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他小跑着回家，一路想东想西，多半还照旧自言自语。走完将近一半路程时，他的胃猛地往下一沉，四肢全僵住了。四周的光和声音一齐熄灭，太阳变黑，天空旋转。他把茶具忘在店里了！
        - id: ch03-b06
          speaker: narrator
          text: >-
            没有用了，毫无希望，一切都完了，做什么也来不及了。可他还是掉头狂奔，发疯似的往回跑，眼睛几乎看不见，巨大的抽噎堵住喉咙。周围那冷酷而嘲弄人的世界，既不给同情，也不给安慰。他肋下刺痛，尘土直扑眼睛，黑沉沉的绝望抓住了心。他就这样跌跌撞撞地跑着，两腿像灌了铅，胸口也快要炸开。
        - id: ch03-b07
          speaker: narrator
          text: >-
            命运好像还嫌打击不够狠。哈罗德转过路角，险些冲进一辆双轮马车的车轮底下。车停了，里面坐着魁梧的拉金农场主。那可是他的大仇敌，就在当天早晨，哈罗德还朝他的鸭子扔过石头。
        - id: ch03-b08
          speaker: narrator
          text: >-
            若在平常，哈罗德早就钻过树篱逃走了，免得自己的脸勾起农场主那些不愉快的回忆。可他已经顾不得下一场灾祸，只能站在那里绝望地大哭。农场主惊讶地瞧着这个凄惨的小人影，开口时倒十分和气。
        - id: ch03-b09
          speaker: farmer_larkin
          text: 哎呀，哈罗德少爷！你这是怎么啦？该不会是在离家出走吧？
        - id: ch03-b10
          speaker: narrator
          text: >-
            绝望忽然给了哈罗德一股异样的勇气。他扑上踏板，爬进车里，一头倒在车底的稻草上，边哭边说自己要回去，一定要回去。这话实在没头没脑，情形也叫人摸不着边，可农场主是个做事多、说话少的人。他一句废话也没问，立刻利落地调转马头，带着哈罗德奔回城里。
        - id: ch03-b11
          speaker: narrator
          text: >-
            等哈罗德终于能说明几句，他们已经回到城里。马车来到店门前，店里的女人正拿着包裹等候。那场天塌地陷的危机仿佛才过去一分钟，他们便又飞快地驶上归途。哈罗德把珍贵的茶具紧紧抱在怀里。
    - id: ch04
      title: 五点钟的茶会
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这一路上，拉金农场主忽然显出了从没见过的一面。他一句也没提被弄坏的篱笆和栅栏，没提踩坏的庄稼，也没提受过骚扰的牛群羊群，仿佛这辈子根本不曾养过一头牲口。他反倒一心关心那场寻找茶具的悲壮历程，听得兴致十足。连那道有争议的乘法题，他也十分同情哈罗德，好像自己正学到同一课。
        - id: ch04-b02
          speaker: narrator
          text: >-
            离家越来越近，哈罗德自己也觉得惊奇。他竟坐直身子，像男子汉对男子汉那样，跟这位刚交上的朋友聊了起来。马车在花园树篱一处方便的缺口停下以前，他已经郑重答应，等塞利娜第一次正式开茶会，一定邀请小拉金小姐来做客，还许她把一大家子装满木屑的娃娃亲眷全都带来。
        - id: ch04-b03
          speaker: narrator
          text: >-
            农场主听了又高兴又自豪，简直像受邀去马尔伯勒宫参加游园会。谁能想到，早晨还是哈罗德大仇敌的人，到了下午竟会这样帮助他。看来那些奥林匹斯山上的大人，在很深很深的地方确实藏着几分好处。说不定有一天，我只好不再骂他们了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            五点钟到了。塞利娜花了一下午，到哈罗德平常爱去的每个地方找他。现在，她只好垂头丧气地陪娃娃们喝茶。那些娃娃毫无情义，一过规定时刻，便再也不肯等下去。桌上的旧木茶具仿佛比往常磕碰得更厉害。就连娃娃们也不再像她记忆中那样有血色、有聪明劲儿，只显得是些蜡做的脸和装满木屑的身子。
        - id: ch04-b05
          speaker: narrator
          text: >-
            就在这时候，哈罗德猛地冲进屋。他满身尘土，长袜已经滑到脚后跟，眼泪在脏脸上冲出的道道痕迹还清清楚楚。塞利娜终于获准知道，自从那场欠考虑的发脾气以后，哈罗德一直惦记着她。他先前的坏脸色并不是真货，那场疏远只是为了最后的补偿。他也没有撇下她，一个人跑去池塘捉青蛙。
        - id: ch04-b06
          speaker: narrator
          text: >-
            那天晚上，塞利娜成了一位快活极了的女主人。她拿着崭新的茶具，殷勤招待围坐一圈的客人。那些客人眼珠是玻璃做的，膝盖一个比一个僵硬。娃娃们若在平时做出那些笨拙失礼的事，准会挨一顿严厉纠正。这一次，她却大方地全都放过了，就像当天恰好是它们的生日。
        - id: ch04-b07
          speaker: narrator
          text: >-
            可哈罗德和我凭着男孩子那套愚蠢的想法，认定她所有的快乐，都只来自那套盼望已久的茶具。
