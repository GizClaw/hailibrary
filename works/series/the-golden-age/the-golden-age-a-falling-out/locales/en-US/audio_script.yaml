  chapters:
    - id: ch01
      title: The Hurt
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Harold told me what happened much later, a little at a time and never willingly. He hated remembering it. One raw moment of misery can leave a bruise that takes years to fade, and Harold still felt the ache now and then, like an old soldier carrying home a bullet from a distant battlefield.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He knew he had behaved like a brute as soon as it was done. Selina had only meant to help. But Harold was already sore all through because he had been kept in the schoolroom after lessons. His crime was insisting that seven times seven made forty-seven. To him, the punishment was terribly unfair. Why should forty-nine be right instead? It was no prettier to look at. It seemed like nothing but somebody else's choice, and seven times seven had always been forty-seven to Harold.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Selina came indoors out of the sunshine. She left the Trappers of the Far West and gave up being an Apache squaw so she could hear Harold's tables and help him win his freedom. Harold answered her kindness with spite. He refused every offer she made, and when she stayed beside him, he drove an elbow into her ribs. All he wanted was to be left alone with his magnificent sulks.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The temper vanished almost at once. Harold saw clearly what he had done, and his heart sank into the dust. Now he needed some great and heroic way to make amends.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Poor Selina wanted no heroic sacrifice. She did not even need an apology. If Harold would only be friends again, she would gladly have done the apologizing herself. But that was not the way a boy thought. Harold believed he owed her something solid. Until he had done it, he must not make up with her, or the grand ending would be spoiled.
        - id: ch01-b06
          speaker: narrator
          text: >-
            When he was finally released, Selina hovered nearby and tried to catch his eye. Harold avoided her. His reason was all twisted up, and every extra minute hurt him inside, but he came to me instead. Naturally, I thought his plan was excellent. Simply making up was too ordinary. Anyone could do that. Surely a girl struck in the ribs by an unfriendly elbow needed the soothing medicine of a proper gift.
        - id: ch01-b07
          speaker: harold
          text: >-
            I know what she wants more than anything. There's a tea set in the toy-shop window, the one with red and blue flowers. She's wanted it for months. Her dolls are big enough for real afternoon tea now. She wants it so much that she won't even walk on that side of the street when we go to town. But it costs five shillings!
    - id: ch02
      title: Five Shillings
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            We settled down to serious work. All afternoon we counted what Harold owned and drew up a budget grand enough for Whitehall. First came half a crown from an uncle. Harold had not spent it because it had been lost for almost a week, but at last it turned up in the straw of the dog kennel.
        - id: ch02-b02
          speaker: narrator
          text: >-
            I advanced him a shilling against the next money an uncle gave him. If no uncle came through, I could demand repayment at Christmas. We shook four of our own pennies from the missionary box with a knife. Edward owed Harold twopence for crossing the field with Farmer Larkin's bull in it, though collecting that bet was difficult. Martha lent him the last shilling with no security at all, except that Aunt must never hear of it. That made exactly five shillings, and at last we could breathe again.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Everything else looked easy. Selina was holding a tea party at five the next afternoon. She would have to use the chipped wooden tea things that had served every doll she had owned since babyhood. Harold would slip away just after dinner. He must go alone so no one would suspect anything, because we were forbidden to visit town by ourselves.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Town was nearly two miles away, but he had plenty of time to go and return with the peace offering packed neatly in wood shavings. He might even meet his friend the butcher and get a ride. Then, at five, the new tea service would seem to fall from the sky. Harold would have paid his debt, and they could be friends again without sacrificing his dignity.
        - id: ch02-b05
          speaker: narrator
          text: >-
            With that glorious moment ahead, another twenty-four hours of pretending to sulk seemed a small price to us. Selina knew nothing of the surprise. She spent the evening miserable and went to bed with a very heavy heart.
        - id: ch02-b06
          speaker: narrator
          text: >-
            When the hour came next day, Harold slipped past the grown-ups with the quiet skill of long practice and headed for the front gate. Selina had been watching him. She thought he was off to the pond to catch frogs, something they had planned to do together, so she hurried after him.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Harold heard her footsteps, but he marched on with his noble mission and never looked back. Selina wandered away alone among the flower beds. For her, they had lost all their scent and color. I watched it happen. Cold reason still approved our plan, but something deeper told me that we were brutes.
    - id: ch03
      title: The Town
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Harold told me later that he reached town in record time. He ran nearly all the way, terrified that someone else might suddenly buy the tea set after it had sat untouched in the window for six months. Perhaps another person had wounded his sister's feelings and needed it too. Yet there it was, and the shopkeeper was willing to sell it for the price on the ticket.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Harold could hardly believe his luck. The tea set was still there, and the shopkeeper would really let him have it for the marked price. He paid at once so there could be no backing out. The set still had to be removed from the window and packed, and the afternoon was young. He decided to enjoy the pleasures of town while he waited.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Naturally, he began with the shops. He pressed his nose to the window that held rubber balls and a clockwork locomotive. At the barber's, wigs sat on blocks and reminded him of uncles, while the shaving cream looked good enough to eat. The grocer displayed more currants than all the people in Britain could finish without making a special effort. At the bank, gold seemed so common that people shoveled it about.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Then came the noisy delights of the marketplace. A runaway calf shot down the street like a cannonball, and Harold felt his life had been worthwhile. There was so much excitement that he forgot why he had come at all.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The church clock brought him back to himself. He had barely enough time to reach home, and off he flew. If he came in late, he would miss his great triumph. Worse still, the grown-ups might discover that he had gone beyond bounds. Compared with that crime, having his own opinion about multiplication was nothing.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Harold jogged toward home, thinking of many things and probably talking to himself, as he often did. He had covered nearly half the distance when his stomach seemed to drop away. His arms and legs went numb. The sunlight vanished from the world, and the sky reeled above him. He had forgotten the tea things.
        - id: ch03-b07
          speaker: narrator
          text: >-
            It was hopeless. Everything was ruined, and nothing could save him now. Still, Harold turned and ran wildly back toward town. Great sobs choked him, but the whole mocking world offered neither pity nor comfort. A stitch stabbed his side. Dust filled his eyes. His legs felt like lead, and despair gripped his heart.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Then fate struck once more. As Harold stumbled around a bend, he nearly ran beneath the wheels of a dogcart. The cart stopped, and there sat the broad figure of his great enemy, Farmer Larkin. That very morning, Harold had been throwing stones at the farmer's ducks.
    - id: ch04
      title: An Unexpected Friend
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            If Harold had been thinking clearly, he would have vanished through the hedge before the farmer could remember him. But now he could only stand there crying. He hardly cared what fresh disaster came next. Farmer Larkin stared at the wretched little figure in surprise, but his voice was not unfriendly.
        - id: ch04-b02
          speaker: farmer_larkin
          text: >-
            Why, Master Harold! What's happened to you? You aren't running away, are you?
        - id: ch04-b03
          speaker: narrator
          text: >-
            Desperation gave Harold a strange kind of courage. He threw himself onto the step, climbed into the cart, and collapsed among the straw at the bottom.
        - id: ch04-b04
          speaker: harold
          text: >-
            I have to go back! Please, I have to go back!
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: >-
            The request was not very clear, but Farmer Larkin preferred action to explanations. He wheeled the horse around at once. By the time Harold had stopped crying enough to explain the forgotten tea set, they were back in town. The woman from the toy shop stood waiting at the door with his parcel.
        - id: ch04-b06
          speaker: narrator
          text: >-
            It felt as if hardly a minute had passed since the terrible discovery. Now the dogcart was racing toward home, and Harold held the precious package tight against him, as if he could never let it go again.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Farmer Larkin suddenly appeared in a completely different light. He said nothing about broken fences and hurdles, trampled crops, or tormented animals. You might have thought he had never owned livestock at all. Instead, he cared deeply about Harold's sad search for the tea things. He even sympathized with the disagreement over seven times seven, as though he had once reached that very same point in his education.
        - id: ch04-b08
          speaker: narrator
          text: >-
            As they drew near home, Harold was surprised to find himself sitting upright and talking to his new friend as one man to another. Before the farmer left him at a useful gap in the garden hedge, Harold promised that little Miss Larkin could come to Selina's first grand tea party and bring her entire sawdust family.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Farmer Larkin looked as pleased and proud as if he had been invited to a royal garden party. Really, those grown-ups had some good qualities hidden far down inside them. Perhaps one day I would have to stop speaking badly of them.
    - id: ch05
      title: Tea at Five
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At five o'clock, Selina sat down to tea with her dolls. She had spent the afternoon searching all Harold's usual hiding places, but the dolls selfishly refused to wait past the appointed hour. The old wooden tea things seemed more chipped than ever. Even the dolls looked less like real people than Selina remembered. They seemed to be nothing but wax, sawdust, glassy eyes, and stiff knees.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Then Harold burst into the room. He was covered in dust, his stockings had fallen around his heels, and tears had cut clear tracks down his dirty cheeks. He brought the flowered tea set with him. At last Selina learned that he had been thinking about her ever since his terrible burst of temper. His sulks had only been pretend, and he had not gone off alone to catch frogs.
        - id: ch05-b03
          speaker: narrator
          text: >-
            That evening, a very happy hostess poured tea for her circle of stiff-legged, glassy-eyed guests. On an ordinary day, every clumsy mistake a doll made would have been corrected severely. This time Selina overlooked them all, as freely as she would have done on a birthday.
        - id: ch05-b04
          speaker: narrator
          text: >-
            But Harold and I, in our foolish boyish way, believed that all her happiness came from finally owning the tea service she had wanted for so long.
