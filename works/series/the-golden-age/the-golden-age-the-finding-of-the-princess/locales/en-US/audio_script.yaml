audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    grown_man:
      display_name: The Grown-up Man
      tts:
        delivery: genial and teasing
        timbre: clear and easy
        pace: relaxed
        pitch: medium-low
    princess:
      display_name: The Princess
      tts:
        delivery: bright and gracious
        timbre: light and warm
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: A Day for Travels
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It was the day I was promoted to a toothbrush. The girls had received that honour some time before, whatever their ages. We boys could never see why, unless it was part of a careful plan to favour creatures who were weaker in body and, as their fondness for telling tales proved, weaker in mind as well.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We did not especially want the strange instruments themselves. Edward used his to scrub out his squirrel's cage. Whenever a watchful grown-up made him clean his own teeth, he simply borrowed Harold's toothbrush or mine. What we wanted was the shining importance that came with owning one. After a toothbrush, there was only the distant but still possible glory of a razor and strop.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Perhaps the honour went to my head. Perhaps the perfect morning helped to make me restless. In any case, I ate breakfast and triumphantly repeated the collect that had defeated me the Sunday before. It had no rhythm or alliteration and was a thoroughly unpleasant collect. Once I had achieved that much, the natural little creature inside me rebelled.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Out in the stable yard, I planted my legs wide and spat about in a poor imitation of the coachman. I decided that lessons could go back to whoever had invented them. We only had geography that morning. Surely real experience was worth any amount of theory from a book. I meant to travel. Imports, exports, populations, and capital cities could wait while I explored the living, colourful world outside.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Of course, I needed another rebel. Usually I could have counted on Harold, but just then he was far too proud. The week before, he had “gone into tables” and been given a new slate with a tiny sponge attached. We used that sponge to wash the faces of Charlotte's dolls. It left them so pale and unhealthy that poor Charlotte, who was always afraid of epidemics, became terrified.
        - id: ch01-b06
          speaker: narrator
          text: >-
            No one knew exactly what “tables” were, least of all Harold. Still, they placed him one step above the rest of us, so he was full of pride and airs. He hugged his slate and its chains, and I knew he would be no use. Girls were even less suitable. They lacked the stubborn will and the proper contempt for authorities who had appointed themselves.
        - id: ch01-b07
          speaker: narrator
          text: >-
            So I slipped through the hedge alone, one small protester against the whole system. I stepped into the lane just as the rest of the civilized world was sitting down to lessons.
    - id: ch02
      title: Beyond the Hedge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I knew the scene well enough, yet everything looked different that morning. My daring gave the whole world strange new colours. It also left a bruised feeling low in my stomach whenever my thoughts flew back to the ink-stained, smelly schoolroom. Was this truly me? Or was I still in that room, only imagining some other cheerful young rebel setting out beneath the friendly sun?
        - id: ch02-b02
          speaker: narrator
          text: >-
            The old well stood halfway up the lane, where it had always stood. Villagers came there with yokes across their shoulders and buckets that clinked as they walked. Drops of water would fall and make long wet worms in the thick road dust. Each bucket held a flat wooden cross that floated on the water and, we had been told, stopped it from spilling.
        - id: ch02-b03
          speaker: narrator
          text: >-
            We often wondered what magic made those crosses work. We wondered who had invented them, too, and whether the inventor had been made a peer. The well was full of mysteries. Somewhere nearby was a hornet's nest, and the thought of it was terrifying. We knew wasps and thought little of attacking their strongholds. Hornets were quite another matter. They were great beasts dressed in angry orange, and people said three stings could kill a horse. Their warning hum told a sensible person to retreat.
        - id: ch02-b04
          speaker: narrator
          text: >-
            No villagers or hornets disturbed the stillness that morning. Lessons seemed to have spread through all of nature. I played in the well for a while, because no boy has ever passed water without getting into it somehow. Then I climbed through the hedge on the side away from the hornets and entered the silent copse.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The lane had been empty, but in the copse loneliness became almost a person. Mystery hid there and peeped at me. Brambles seemed to catch and hold me on purpose, while young trees whipped my face out of human spite. The wood went on much farther and felt much more dreadful than anyone could have guessed from the lane. I was truly glad when the trees finally opened and the ground sloped down to a little stream chattering in the sunlight.
        - id: ch02-b06
          speaker: narrator
          text: >-
            I followed that cheerful companion. Nature had thoughtfully provided plenty of water rats and a good supply of stones just the right size for throwing at them. There were rapids that called for canoes and portages, little curling bays and inlets, and caves made for pirates and hidden treasure. The wise old dame had forgotten nothing.
        - id: ch02-b07
          speaker: narrator
          text: >-
            I cannot tell how long I wandered. At last my path, though not the stream itself, was blocked by six feet of strong wire netting. It stretched from bank to bank at a place where a thick hedge bent over and touched it, hiding everything beyond.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Now the adventure became thrilling. Surely a Black Flag must be flying close by. This was plainly a wicked pirate trap, built to stop our gunboats when we raced upstream to shell the pirates in their lair. Even a gunboat might have hesitated before that wire and hedge. But near the water I found a rabbit's passage. Where a rabbit could go, a boy could follow, though he had to crawl on his stomach with one leg in the stream. I forced my way through and stood safely inside, breathless at what I saw.
    - id: ch03
      title: The Garden of Sleep
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The wild, tangled woodland had vanished. Before me, smooth lawns descended one terrace after another. Each was edged with stone and marked by urns at the corners. The stream had been tamed and taught good manners. It flowed from one marble basin to the next, where flashes of red sometimes showed goldfish moving among broad water lilies.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The whole place lay silent and sleepy beneath the heavy noonday sun. A drowsing peacock crouched in a heap on the lawn. No fish broke the pools, and no bird spoke from the surrounding hedges. The place had revealed itself at last. This could only be the Garden of Sleep.
        - id: ch03-b03
          speaker: narrator
          text: >-
            In those days, I especially distrusted two kinds of people. One was gamekeepers, and the other was gardeners. I saw no threatening creature of either kind, so I walked on between rich beds of flowers and searched for the Princess. The garden itself announced that she must be there. Without a Princess at its centre, such a place could not possibly exist.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Beyond a cluster of shrubs stood a pavilion with a golden top, wrapped in thick jasmine. It seemed to beckon to me. If the Princess was anywhere, she must be hidden there. My instinct, helped by all I knew of princesses and their habits, proved correct. There she was.
        - id: ch03-b05
          speaker: narrator
          text: >-
            She was not lying in an enchanted sleep. She was laughing and trying to pull her hand away from a grown-up man who sat beside her on a marble bench. I suppose now that one of them was a little younger than twenty and the other a little older. Children do not notice such small distinctions. To us, the world held only children and grown-ups. Grown-ups were not better, only hopelessly different. These two both belonged to that other division.
        - id: ch03-b06
          speaker: narrator
          text: >-
            I stopped and wondered why they had chosen this hidden place when they might have been catching fish or hunting butterflies outside in the sunshine. While I considered the question, the man noticed me.
        - id: ch03-b07
          speaker: grown_man
          text: >-
            Hello there, sprat! Where did you come from?
        - id: ch03-b08
          speaker: narrator
          text: >-
            I came along the stream. I was only trying to find the Princess.
        - id: ch03-b09
          speaker: grown_man
          text: >-
            Then you must be a water-baby. Well, now that you've found the Princess, what do you think of her?
        - id: ch03-b10
          speaker: narrator
          text: >-
            I think she's lovely. But she's wide awake, so someone must have kissed her already.
        - id: ch03-b11
          speaker: narrator
          text: >-
            It was the most natural conclusion in the world, and it made the man laugh. The Princess turned red, sprang to her feet, and announced that lunch was due.
        - id: ch03-b12
          speaker: princess
          text: >-
            It's time for lunch.
        - id: ch03-b13
          speaker: grown_man
          text: >-
            Come along, then. You too, Water-baby. Come and eat something solid. You must be hungry.
    - id: ch04
      title: Lunch at the Palace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            I went with them and felt no false shyness about it. In the world as I knew it, food appeared every day at midday. Which table a person happened to sit at did not seem important. The palace was splendid and beautiful, exactly as a palace should be. A stately lady met us there. She was even more grown-up than the Princess and was apparently her mother.
        - id: ch04-b02
          speaker: narrator
          text: >-
            My friend the man treated me kindly. He introduced me as the Captain and explained that I had just come down from Aldershot. I had no idea where Aldershot might be, but I felt sure he had the facts right. Grown-ups are usually dependable about facts. It is imagination that they sadly lack.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Lunch was excellent, with all kinds of things to eat. Another gentleman wore beautiful clothes, so I supposed he must be a lord. He lifted me into a tall carved chair and stood behind it, watching over me like Providence itself.
        - id: ch04-b04
          speaker: narrator
          text: >-
            I did my best to tell everyone who I was and where I had come from. I made sure they understood about my new toothbrush and Harold's tables. Either they were very stupid, or else everyone in Fairyland laughs whenever someone says the most ordinary thing. My friend answered in his good-natured way.
        - id: ch04-b05
          speaker: grown_man
          text: >-
            That's quite all right, Water-baby. You came along the stream, and that's enough for us.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The lord seemed a reserved sort of man. He took no part in the talk.
        - id: ch04-b07
          speaker: narrator
          text: >-
            After lunch, I walked proudly on the terrace with the Princess and my friend. I told the man what I meant to become, and he told me what he meant to become. Then I asked the question that seemed obvious.
        - id: ch04-b08
          speaker: narrator
          text: >-
            I suppose you two mean to get married?
        - id: ch04-b09
          speaker: narrator
          text: >-
            He only laughed in the Fairyland fashion, so I explained myself.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Because if you don't, you really should.
        - id: ch04-b11
          speaker: narrator
          text: >-
            I simply meant that any man who found a Princess living in a proper Palace like this one ought to marry her at once. Anything else would break every accepted tradition.
        - id: ch04-b12
          speaker: narrator
          text: >-
            They laughed again. Then my friend suggested that I go and look at the goldfish in the pond while he and the Princess took a walk.
        - id: ch04-b13
          speaker: grown_man
          text: >-
            Why don't you go down to the pond and see the goldfish? We'll take a little stroll.
        - id: ch04-b14
          speaker: narrator
          text: >-
            I was sleepy, so I agreed. Before they left, the man placed two half-crowns in my hand. He said they were for treating the other water-babies. This final proof of his friendship touched me so deeply that I nearly cried. His generosity mattered far more to me than the Princess bending down to kiss me before she went away.
    - id: ch05
      title: Home from Fairyland
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            I watched them disappear along the path. In Fairyland, arms seemed to find their way around waists quite naturally. Then I rested my cheek on the cool marble. The soft trickle of water lulled me to sleep, and I slipped into dreams, leaving both the real world and the magic one behind.
        - id: ch05-b02
          speaker: narrator
          text: >-
            When I woke, the sun had disappeared. A cold wind had set every leaf whispering, and the peacock stood on the lawn giving harsh cries that called up the rain. A wild fear seized me for no reason I could name.
        - id: ch05-b03
          speaker: narrator
          text: >-
            I fled from the garden like a guilty creature. I wriggled back through the rabbit's passage and struggled toward home along the uncertain path, with nameless terrors chasing me. The half-crowns were still in my hand, solid and real. But could I carry such treasure safely through a wood haunted by brigands?
        - id: ch05-b04
          speaker: narrator
          text: >-
            At nightfall, a dirty and exhausted little figure climbed into the house through the humble scullery window. To be sent to bed without tea felt like endless mercy.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Officially, I had no tea. But after adventures like this, a kindly housemaid usually came quietly up the back stairs. That evening she stopped me with sympathy and large pieces of cold pudding. I ate until my small skin felt as tight as a drum.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Then nature had her way, and I entered the comforting kingdom of sleep. In my dream, I was the fattest kind of golden carp, rowing through clear water. One new half-crown rested snugly beneath each fin. I pushed my nose up through the water-lily leaves, and a rose-flushed Princess bent down to kiss me.
