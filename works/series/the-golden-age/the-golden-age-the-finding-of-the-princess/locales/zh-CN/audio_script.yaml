audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    man:
      display_name: 那位大人
      tts:
        delivery: 亲切爽朗，打趣时自然随意
        timbre: 明亮温厚的年轻男声
        pace: 自然从容，笑意处稍快
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 温柔明快，羞赧时略显匆忙
        timbre: 清澈柔和的年轻女声
        pace: 自然轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 牙刷带来的反叛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那一天，我终于晋升到可以有牙刷的年纪了。家里的姑娘不论大小，早就享有这份殊荣。我们男孩子始终想不通为什么，只好认定，大人又在故意偏袒那些身体不如我们强壮、心性也不如我们坚韧的姑娘。她们爱告状，不正是证据吗？
        - id: ch01-b02
          speaker: narrator
          text: 我们真正眼馋的，并不是牙刷本身。爱德华拿自己的牙刷刷松鼠笼子。真要刷牙，又碰上大人在旁边严厉地盯着，他便随手借哈罗德的或我的，拿到哪一把都一样。
        - id: ch01-b03
          speaker: narrator
          text: 我们想要的是牙刷四周那一圈荣耀的光。因为再往上走，似乎就只剩那遥远却并非全无希望的剃刀和磨刀皮带了。
        - id: ch01-b04
          speaker: narrator
          text: 也许这次晋升真把我冲昏了头，也许天地万物和那个完美的早晨合谋，让我起了反心。我吃过早饭，又顺顺当当地背出了上星期日曾经卡壳的祷文。那篇祷文没有韵律，也没有头韵，讨厌得很。立下这番功劳以后，我身体里的小野人便起来造反了。
        - id: ch01-b05
          speaker: narrator
          text: 我在马厩院子里跨开双腿，学着马车夫四处吐唾沫，虽然学得不大像。我暗暗发誓，功课和发明功课的人都见鬼去吧。反正上午只有地理。亲自去看世界，比多少书本上的空谈都强。进口、出口、人口和首都尽管等着，我要去探索外面那个有声有色的活世界。
        - id: ch01-b06
          speaker: narrator
          text: 一场造反最好有个同伴，平常找哈罗德准没错。可那阵子，他刚开始学所谓的乘法表，得了一块拴着小海绵的新石板，正骄傲得不得了。
        - id: ch01-b07
          speaker: narrator
          text: 我们曾拿那块海绵给夏洛特的娃娃洗脸，把一张张小脸洗得惨白。夏洛特总怕传染病，这副病相把她吓坏了。至于乘法表究竟是什么，谁也说不明白，尤其是哈罗德自己。可它既然让他高过别人一等，就足够他抱着石板和链子自鸣得意、摆足架子了。
        - id: ch01-b08
          speaker: narrator
          text: 这时指望不上哈罗德。姑娘更不行，她们既没有坚持造反的意志，也不懂得藐视那些自封的权威。于是，我独自钻过树篱，像个孤零零的反抗者走上小路。文明世界里的其他人，这会儿都坐下来上课了。
    - id: ch02
      title: 沿着小溪远行
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 眼前明明都是熟悉的景物，可在这个早晨，一切竟变得全然不同。我的举动太大胆了，仿佛给万物染上了陌生的新颜色，也让我胃窝附近隐隐有种挨过打的不适。每当我想起那间沾满墨水、气味难闻的教室，这感觉就更厉害。
        - id: ch02-b02
          speaker: narrator
          text: 走在阳光下的真是我吗？还是我其实仍在教室里，只是望着另一个快活的小叛徒远行？不管怎样，小路中段那口亲切的老井还在原处。
        - id: ch02-b03
          speaker: narrator
          text: 村里人常挑着水桶来打水。桶一路叮当，滴下来的水在厚尘里爬出湿漉漉的蚯蚓。每只桶里都漂着一副扁木十字架。据大人说，它能防止水泼出来。我们总猜不透这道理靠什么法术生效，也不知道发明它的人有没有因此受封做贵族。
        - id: ch02-b04
          speaker: narrator
          text: 那口井本来就是谜团的中心。附近某处藏着一窝大黄蜂，想一想都吓人。普通黄蜂我们很熟，也不放在眼里，常常攻进它们的堡垒。大黄蜂却是身披怒橙色的大怪兽。据说被它们蜇三下，一匹马都会死。听见那阵警告似的嗡鸣，谨慎撤退才算明智。
        - id: ch02-b05
          speaker: narrator
          text: 此刻，村民和大黄蜂都没有来打破宁静，仿佛整个大自然也在上课。我在井水里玩了一阵。男孩路过一汪水，哪有不伸手拨弄的？随后，我避开大黄蜂出没的那边，钻过树篱，走进寂静的矮树林。
        - id: ch02-b06
          speaker: narrator
          text: 小路只是空无一人，这里却仿佛连孤独都有了性情。神秘躲在暗处窥望。荆棘自有主意，一把勾住人不放。幼树也像怀着恶意，迎面抽打我的脸。
        - id: ch02-b07
          speaker: narrator
          text: 这片林子比从路边望见的辽阔多了，阴森森地延伸出去，好像永远也走不到头。直到树林豁然开朗，地势朝一条小溪倾斜下去，我才松了口气。溪水喧闹着奔进阳光，成了我的快活同伴。
        - id: ch02-b08
          speaker: narrator
          text: 我沿溪而行，心里差不多只想着，大自然预备了这么多水鼠，也很体贴地备好了大小合适的石头。水里还有一道道急流，让人想到独木舟，以及船走不了时从陆上搬运的办法。弯弯曲曲的水湾和岔口，又让人想到海盗藏身的洞窟和隐匿的宝藏。睿智的大自然母亲什么都没有忘。
        - id: ch02-b09
          speaker: narrator
          text: 不知走了多久，一道六英尺高的结实铁网突然拦住去路。溪水仍从下面流过。铁网横跨两岸，后面又是一道拱到网顶的浓密树篱，前方什么也看不见。
        - id: ch02-b10
          speaker: narrator
          text: 这场冒险越来越惊心动魄。附近准有一面黑旗！铁网显然是海盗设下的机关，专门阻挡我们的炮艇溯流而上，炮轰他们的巢穴。网这样牢，树篱这样密，炮艇到了这里恐怕也要犹豫。
        - id: ch02-b11
          speaker: narrator
          text: 可我在水边低处发现一个兔子常走的洞。兔子能过，男孩当然也能过，只要肚皮贴地，再把一条腿浸进溪里。我就这样钻了过去。人是安全站到了里面，眼前的景象却惊得我喘不过气。
    - id: ch03
      title: 沉睡花园里的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 荆棘丛生的荒地和林中光影闪烁的乱枝全都不见了。眼前是一层层修剪整齐的草坪，四周镶着石边，角上摆着石瓮，一阶一阶轻巧地向下铺展。小溪到了这里也受过驯化和教养，从一座大理石水池流进下一座。铺开的睡莲下面，偶尔闪过一道红光，那是金鱼在游动。
        - id: ch03-b02
          speaker: narrator
          text: 正午的阳光沉静地照着，一切都昏昏欲睡。孔雀缩在草坪上打盹。水池里没有鱼跃起，周围的树篱中也没有鸟叫。这里的一切都在承认，不错，我终于来到了沉睡花园。
        - id: ch03-b03
          speaker: narrator
          text: 那些年里，我特别不信任两种人，猎场看守和园丁。眼下既没有不祥的看守，也没有园丁，我便穿过繁盛的花圃，去找这里少不了的公主。
        - id: ch03-b04
          speaker: narrator
          text: 周围的景物仿佛号角齐鸣，明明白白地宣布，她就在这里。没有公主做中心，这样的花园根本不会存在。密密的灌木后面，一座缠满茉莉的金顶凉亭向我招手。她若真在某处，必定在那里。
        - id: ch03-b05
          speaker: narrator
          text: 我的直觉，加上对公主习性的一点了解，果然没有错。她真的在那里！不过她没在沉睡。她正笑着挣扎，想从一个成年男子手里抽回自己的手。那人和她坐在同一张大理石长凳上。
        - id: ch03-b06
          speaker: narrator
          text: 如今回想，两人一个不到二十，一个过了二十。可孩子不理会这种小差别。在孩子眼里，世上的人只有两类，孩子和大人。大人并不比孩子高明，只是和孩子完全不同，简直无可救药。这两位自然属于大人。
        - id: ch03-b07
          speaker: narrator
          text: 我停下来，觉得他们很奇怪。外面阳光明亮，既能捉鱼，又能追蝴蝶，他们为什么偏要躲在这里？正想着，那位大人看见了我。
        - id: ch03-b08
          speaker: man
          text: 嗨，小鱼苗！你是从哪儿冒出来的？
        - id: ch03-b09
          speaker: narrator
          text: 我礼礼貌貌地把来历说得十分完整。我是顺着小溪上来的，只是想到这里找公主。
        - id: ch03-b10
          speaker: man
          text: 原来你是个水孩子。现在找到公主了，你觉得她怎么样？
        - id: ch03-b11
          speaker: narrator
          text: 我说公主很美。这话想必没错，因为那时的我从没学过奉承别人。接着，我又说出了一个再自然不过的推论。
        - id: ch03-b12
          speaker: narrator
          text: 可是她醒得好好的，我猜，一定已经有人吻过她了！
        - id: ch03-b13
          speaker: narrator
          text: 那位大人听了哈哈大笑。公主却一下红了脸，站起身来。
        - id: ch03-b14
          speaker: princess
          text: 到吃午饭的时候了。
        - id: ch03-b15
          speaker: man
          text: 那就走吧。水孩子，你也来吃点实在的东西，准是饿了。
    - id: ch04
      title: 宫殿里的午饭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我一点也不扭捏，跟着他们就走。在我熟悉的世界里，每天中午总有饭菜摆上桌。究竟坐哪一张桌子，似乎并不重要。
        - id: ch04-b02
          speaker: narrator
          text: 宫殿富丽又漂亮，完全是宫殿该有的样子。一位端庄的夫人出来迎接我们。她比公主还更像个大人，显然就是公主的母亲。
        - id: ch04-b03
          speaker: narrator
          text: 我的朋友，那位大人，待我十分亲切。他把我介绍给众人，说我是上尉，刚从奥尔德肖特赶来。我不知道奥尔德肖特在哪儿，却毫不怀疑他说得对。
        - id: ch04-b04
          speaker: narrator
          text: 大人谈起事实，通常还算准确。可说到想象这种更高的天赋，他们就欠缺得叫人难过了。
        - id: ch04-b05
          speaker: narrator
          text: 午饭丰盛又可口。另一个穿着华服的先生，想必是位勋爵，把我抱上一把雕花高椅。他站在椅背后面，像天意一样从上方笼罩着我。
        - id: ch04-b06
          speaker: narrator
          text: 我竭力向满桌的人解释自己是谁，又是从哪里来的。我还想让他们明白，我已经有了自己的牙刷，哈罗德也开始学乘法表了。可他们不是太笨，就是仙境里有一条奇怪的规矩，人人听到最普通、最平常的话，反倒都会笑个不停。
        - id: ch04-b07
          speaker: man
          text: 好啦，水孩子。你是顺着小溪上来的，我们知道这些就够了。
        - id: ch04-b08
          speaker: narrator
          text: 那位勋爵依我看十分沉默，整个午饭期间都没参加谈话。
        - id: ch04-b09
          speaker: narrator
          text: 饭后，我跟公主和那位大人一起在露台上散步，心里得意极了。我告诉他自己将来要做什么，他也告诉我他将来要做什么。随后，我问他们两个是不是准备结婚。
        - id: ch04-b10
          speaker: narrator
          text: 那位大人只照仙境的习惯笑了起来。我便补上一句，要是他们不结婚，那可实在不应该。
        - id: ch04-b11
          speaker: narrator
          text: 我的道理很简单。一个男人既然找到了公主，而公主又住在这样一座合乎规矩的宫殿里，他要是不当场娶她，就违背了一切公认的传统。
        - id: ch04-b12
          speaker: narrator
          text: 他们又笑了。我的朋友让我下去看水池里的金鱼，他们两个人则要出去走走。
        - id: ch04-b13
          speaker: narrator
          text: 我已经困了，便答应下来。临走前，那位大人把两枚半克朗硬币放进我手里，说是让我请其他水孩子吃东西。
        - id: ch04-b14
          speaker: narrator
          text: 这份友谊最有分量的证明，把我感动得几乎哭了。公主离开前俯身吻了我一下，可在我心里，这件事还比不上那位大人的慷慨。
    - id: ch05
      title: 梦境与归途
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 我望着他们沿小路走远。仙境里就是这样，胳膊搂在腰上，显得再自然不过。随后，我把脸颊贴上清凉的大理石，听着流水潺潺。现实世界和魔法世界都退去了，我慢慢滑进梦乡。
        - id: ch05-b02
          speaker: narrator
          text: 醒来时，太阳已经躲起，冷风吹过花园，满树叶子都低声私语。草坪上的孔雀尖声叫着，仿佛在呼唤即将落下的雨水。一阵毫无道理的惊恐突然抓住我。
        - id: ch05-b03
          speaker: narrator
          text: 我像个做了亏心事的人，飞快逃出花园，又扭着身子钻过水边那个兔子洞。在难辨方向的归途上，我一路摸索着往家赶，身后仿佛有种种叫不出名字的恐怖紧追不舍，怎么也甩不掉。
        - id: ch05-b04
          speaker: narrator
          text: 幸好，两枚半克朗摸上去仍旧坚硬而真实。可我带着这样的宝物，真能平安穿过强盗出没的树林吗？
        - id: ch05-b05
          speaker: narrator
          text: 黄昏时，一个又脏又累的小东西借着不起眼的洗碗间窗户，钻回了自己家里。他只被罚不许吃茶点，便觉得得到了无边的宽恕。
        - id: ch05-b06
          speaker: narrator
          text: 当然，只是明面上没有茶点。每次我们这样胡闹，总有一个好心的女佣从后楼梯悄悄过来。她用大块冷布丁和安慰拦住挨饿的孩子，一直喂得他的小肚皮绷得像鼓。
        - id: ch05-b07
          speaker: narrator
          text: 随后，天性重新占了上风，我进入了令人安心的睡眠王国。
        - id: ch05-b08
          speaker: narrator
          text: 在梦里，我变成一尾胖得不能再胖的金鲤鱼，用鳍在清澈的水中划动。我的左鳍和右鳍下面，各稳稳藏着一枚崭新的半克朗。我把鼻子从睡莲叶间探出水面，让一位双颊泛着玫瑰红的公主吻我。
