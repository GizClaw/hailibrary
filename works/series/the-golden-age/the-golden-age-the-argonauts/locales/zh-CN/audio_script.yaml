audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    medea:
      display_name: 美狄亚
      tts:
        delivery: 热情灵动，忧伤时声音低回而克制
        timbre: 清澈柔和的年轻女声
        pace: 游戏时轻快，吐露心事时缓慢
        pitch: 中高
    aunt:
      display_name: 姑妈
      tts:
        delivery: 严厉拘谨，不容争辩
        timbre: 瘦硬冷峻的年长女声
        pace: 清楚缓慢，句句带着管束意味
        pitch: 中
  chapters:
    - id: ch01
      title: 新来的英雄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们从来不轻易相信陌生人。不管来的是谁，我们多半先撤退，逃进地洞和堡垒，躲进没人走过的小树林，或是远处孤零零的牛棚。最后还得让那些经验老到、熟知秘密通道和藏身处的保姆使计，把我们一个个哄出来。所以，刚认识古典传说里的英雄时，我们也没有立刻把整颗心交给他们。毕竟有人说过，信任是一株长得很慢的草木。
        - id: ch01-b02
          speaker: narrator
          text: 那些黑发半神神情庄严，名字难念，装束又怪。他们面对的是一座守卫森严的城堡，我们熟悉的老朋友早已在里面驻扎，他们想进来，可不容易。他们的异国女神冷冰冰的，哪比得上北方那些爱捉弄人、甚至有点坏心眼的仙子和女巫？我们也想念故事里的动物盟友。没有狐狸张开最蓬松的大尾巴，载我们去魔法城堡。没有井里的青蛙，也没有蹲在树上哑声出主意的乌鸦。最让哈罗德不满的是，英雄居然不总是三兄弟里最小的那个。
        - id: ch01-b03
          speaker: narrator
          text: 哈罗德认定，排行最小就该交好运，仿佛仙境也有一条规矩，家产非传给幼子不可。这份信心害他越发自鸣得意、神气活现，常常需要一顿实在的教训。可我们教训归教训，心里还是赞成他的。我们怀着戒心打量这批新人物时，连老萨图恩本人都像个突然发迹、刚挤进来的外人。
        - id: ch01-b04
          speaker: narrator
          text: 不过，陌生人相处久了，也能变成患难与共的伙伴。这群英姿勃勃的佩剑英雄，确实有真本领。珀尔修斯戴着隐身帽，踏着神奇的飞鞋，很快便飞进我们心里。阿波罗去敲阿德墨托斯的门，也颇有真正童话的派头。普绪克带来一座合乎规矩的魔法宫殿，还有乐于帮忙的鸟儿和友善的蚂蚁。最后，奥德修斯凭着迷人的花样和层出不穷的计策，拆掉了最后一道墙。打那以后，整队英雄都被我们接纳，进了秘密兄弟会。
        - id: ch01-b05
          speaker: narrator
          text: 那天，我刚把拉金农夫最心爱的几头小牛撵得满田跑，好提醒那个人，我们并没忘掉他。回来时，我心安理得，觉得自己和天下人人都相安无事。我穿过菜园，看见爱德华在粪堆里挖蚯蚓。他把蚯蚓装进帽子，我们一边闲逛，一边商量国家大事。来到工具棚外，一阵怪声叫我们停了下来。往里一看，哈罗德正独自蹲在一只等待修补的旧猪食槽里，对眼下最时兴的游戏全神贯注。他念得慷慨激昂，手里的铁锹一会儿举过头顶，一会儿戳向地面，动作活像一个奋力划加拿大独木舟的人。爱德华大步闯进去。
        - id: ch01-b06
          speaker: edward
          text: 你现在又在玩什么蠢游戏？
        - id: ch01-b07
          speaker: narrator
          text: 哈罗德脸红了，却牢牢守着他的猪食槽。
        - id: ch01-b08
          speaker: harold
          text: 我是伊阿宋，这就是阿尔戈号。其他伙伴也在，只是你看不见。我们正穿过赫勒斯滂海峡呢，你别来烦我。
        - id: ch01-b09
          speaker: narrator
          text: 说完，他又朝酒色深沉的大海挥起桨。爱德华轻蔑地踢了食槽一脚。
        - id: ch01-b10
          speaker: edward
          text: 这也算阿尔戈号？可真漂亮！
        - id: ch01-b11
          speaker: harold
          text: 我只能弄到这么好的阿尔戈号。只要肯认真想象，它就完全是真的。可你一点儿也不会想象。
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 爱德华想了一会儿，忽然有了主意。
        - id: ch01-b13
          speaker: edward
          text: 那我们去弄拉金农夫的船吧。坐着真正的阿尔戈号往上游走，找美狄亚，找金羊毛，把该找的全找回来。这个游戏是你先想到的，我可以让你当伊阿宋。
        - id: ch01-b14
          speaker: narrator
          text: 哈罗德激动得从食槽里翻了出来。
        - id: ch01-b15
          speaker: harold
          text: 可是大人不许我们自己下水！
        - id: ch01-b16
          speaker: edward
          text: 对，他们不许我们去。我看，他们当初也不会准许伊阿宋去。可他照样去了！
        - id: ch01-b17
          speaker: narrator
          text: 哈罗德原本也只是照例反对一下，他真正想要的，不过是一个站得住脚的理由，好让自己安心被说服。接着该决定要不要带女孩子。塞莉娜划船确实很在行，可问题也正在她身上。她刚到了开始长良心的讨厌年纪，万一从道德上看，觉得这次远征不像一场正经的《天路历程》，可能会跑去告状。夏洛特又常常沉入白日梦，没准儿想着想着就栽进河里。撇下她，她一定会哭得很伤心，可总比葬身水底好。最后，大家一致反对让穿裙子的动物上船。也许这决定还算正确，尽管阿塔兰忒分明就是最初的船员之一。
        - id: ch01-b18
          speaker: edward
          text: 谁去问拉金农夫借船？我不能去。他上回说，再逮到我就拍扁我的脑袋。你去问。
        - id: ch01-b19
          speaker: narrator
          text: 我当然不肯。毕竟，我才刚撵过他的宝贝小牛。
        - id: ch01-b20
          speaker: edward
          text: 那就谁也别问了。反正问了只会惹他生气，何必呢？现在出发。
    - id: ch02
      title: 阿尔戈号启航
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我们一路来到河边，没遇到半点阻拦，便夺下了拉金农夫的小船。敌人那时都在干草地里忙。地图册上根本找不到这条所谓的河，它窄得连掉个头，都可能叫阿尔戈号触礁遇难。可在我们眼里，它就是浩荡的奥里诺科河，天下的城市星星点点地排在两岸。
        - id: ch02-b02
          speaker: narrator
          text: 我们把船头转向上游，因为那边离拉金的领地越来越远。哈罗德如约做伊阿宋，我们几个分掉其余英雄的角色。阿尔戈号从色萨利出发，我们高声呐喊着驶过赫勒斯滂海峡，屏住呼吸，险险避开两块迎面撞合的巨岩，又贴着海妖群岛背风的一面绕过去。绣线菊围住利姆诺斯岛，野蔷薇一丛丛开遍密西亚海岸，色雷斯沿岸还传来割草人的欢快呼声。
        - id: ch02-b03
          speaker: narrator
          text: 航行一两个钟头后，船头扎进一处水淋淋的泥岸，那里满是牛蹄印，一条小路通往升起炊烟的住处。爱德华立刻跳上岸去探险，头也不回。我却发现旁边有一道长满青苔的水门，门里是一座过分安静的花园，看着像会发生魔法。
        - id: ch02-b04
          speaker: narrator
          text: 我们小心地走进门，连里面的空气都静了几分。哈罗德难为情地落在后面，好像我们正在跨进谁的私人房间，许多旧日的幽灵正匆匆从身边挤过去。园里处处是花，却显然无人照料。它们长得太密，一朵朵低垂着，枝蔓也横七竖八。天芥菜的浓香占满整座花园，仿佛从一排高大而未经修剪的树篱，垂下一串串实实在在的花环，一直牵到另一排树篱。
        - id: ch02-b05
          speaker: narrator
          text: 草坪上没有藤椅、披肩和小说散落着，替它添上颜色。屋子朝花园一面的窗户，也大多拉着百叶窗。草坪中央立着一座灰色的古日晷。在所有看得见的东西里，只有它最像人世间的器物。我们不由自主地走过去，又用眼睛看，又拿手指摸，费力辨认四周那句古老的话。
        - id: ch02-b06
          speaker: harold
          text: 时——间——验——真——心。这是什么意思？
        - id: ch02-b07
          speaker: narrator
          text: 我说不出它的意思。哈罗德又问日晷里面怎么转，应该从哪里上发条，我还是答不上来。我虽见过日晷，却从来没弄懂它怎样工作。
        - id: ch02-b08
          speaker: narrator
          text: 我们还在对着这个装置发愁，美狄亚本人已经从宅子那边沿小路走来。她一头黑发，身段轻盈柔软，走起来微微摇曳，面色却苍白倦怠。我立刻认出了她。我们本来就是出来找美狄亚的，所以她真的出现，也没有什么可惊讶。哈罗德那时正要爬上日晷。他像猫一样，不管见到什么，都喜欢占据最高处。一见她，他吓得摔了下来，磕伤下巴，哀号声顿时响遍这座幽静的花园。
        - id: ch02-b09
          speaker: narrator
          text: 美狄亚像燕子贴着地面掠过，转眼便跪在他身旁。她轻声细语地哄着，又拿自己的精致手帕，一点点擦去他下巴上的泥。
        - id: ch02-b10
          speaker: narrator
          text: 你不用这么担心他。他只哭一分钟，哭够就好了。
        - id: ch02-b11
          speaker: narrator
          text: 我的估计果然没错。规定的一分钟刚到，哈罗德的哭声便突然停了，像一座已经报完时的钟。他立刻神色安详，满脸愉快，扭出美狄亚的怀抱，跑去找一块石头，要砸一只擅自闯进来的乌鸫。
    - id: ch03
      title: 花园里的美狄亚
      blocks:
        - id: ch03-b01
          speaker: medea
          text: 哎呀，你们这些男孩子！你们从哪儿掉下来的？怎么这么脏！我在这里关了一千年，从没见过一百五十岁以下的人。我们马上来玩吧！
          emotion: happy
        - id: ch03-b02
          speaker: narrator
          text: 我说，圆场棒球就不错，女孩子也能玩，还可以拿日晷当本垒。可惜得有球棒、球和更多的人。
        - id: ch03-b03
          speaker: narrator
          text: 美狄亚悲惨地拍起两手。
        - id: ch03-b04
          speaker: medea
          text: 我没有球棒，没有球，也没有别人，什么有用的东西都没有。算了，我们到菜园里捉迷藏，再比赛跑到那棵核桃树。我整整一百年没跑过了！
        - id: ch03-b05
          speaker: narrator
          text: 可她轻轻松松就跑赢了。我在后面喘个不停，开始怀疑她或许把年纪多报了一两岁。她玩捉迷藏时热情又忘我，真有一个天生艺术家的派头。她一会儿轻捷地消失，一会儿又翩然出现，脸颊红润，笑声好听得像从天上传来。她身上那个苍白的女巫少女已经褪去。此刻，她更像我从另一个故事中读到的少女。那少女从开满水仙的田野被人劫走，到地下幽暗的国度做了王后，如今终于获准再回到大地，回到阳光里，也回到坦荡而温柔地抚过面颊的风中。
        - id: ch03-b06
          speaker: narrator
          text: 玩累以后，我们回到古日晷旁。哈罗德从不会放过没解开的难题。他又用手指摸着模糊的刻痕。
        - id: ch03-b07
          speaker: harold
          text: 时间验真心。求求你告诉我，这到底是什么意思？
        - id: ch03-b08
          speaker: narrator
          text: 美狄亚低下头，深深俯在日晷上，脸几乎全藏进两只手里。过了一会儿她才开口，声音压得很低，已经完全不是刚才那个奔跑欢笑的姑娘了。
        - id: ch03-b09
          speaker: medea
          text: 我就是为了这句话才留在这里。他们把我关起来，以为我会忘记。可是我永远不会，永远也不会！他也不会……可我不知道。已经过了这么久，我真的不知道。
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: 说完，她把脸彻底藏了起来，古老的花园又恢复了刚才那种寂静。我笨拙地站在那里，浑身不自在，一点忙也帮不上。脑子里只有一个模模糊糊的办法，那就是踢哈罗德一脚，除此以外，我实在不知道该怎样安慰她。
        - id: ch03-b11
          speaker: narrator
          text: 谁也没发现另一个雌性生物已经走近。她属于身形僵直、棱角分明的那一类，和我们亲爱的伙伴完全不同。美狄亚刚才说自己活过一千年，可那些年岁倒像是全都长在了这个女人身上。她还戴着露指手套，这正是我最讨厌女人耍的花样。
        - id: ch03-b12
          speaker: aunt
          text: 露西！
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: 这一声尖利得很，每个音里都写着斗大的“姑妈”二字。美狄亚吓了一跳，心虚地站了起来。姑妈隔着眼镜，神情阴沉地打量着她。
        - id: ch03-b14
          speaker: aunt
          text: 你刚才哭了。还有，这几个脏得不像话的小男孩究竟是谁？
        - id: ch03-b15
          speaker: medea
          text: 他们是我的朋友，姑妈。我……我早就认识他们，是我请他们来的。
        - id: ch03-b16
          speaker: narrator
          text: 美狄亚答得很快，却只能勉强装出快活的样子。姑妈显然没有相信，只从鼻子里怀疑地哼了一声。
        - id: ch03-b17
          speaker: aunt
          text: 亲爱的，你该进屋躺下。太阳会让你头疼。你们几个小男孩也快回家吃茶点吧。记住，没有保姆陪着，不许随便来拜访。
    - id: ch04
      title: 爱德华的探险
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 哈罗德早已不安地扯了我好一会儿。我等到美狄亚被带走。她回过身，用白皙的手向我们送来一个飞吻，我这才拔腿逃跑。我们平安回到船边。
        - id: ch04-b02
          speaker: harold
          text: 那个姑妈真是条老恶龙！
        - id: ch04-b03
          speaker: narrator
          text: 我也说她实在是个讨厌鬼。居然说太阳会让人头疼，哪有这样的道理？不过，美狄亚可真够朋友。我问哈罗德，我们能不能把她从这里抢走。
        - id: ch04-b04
          speaker: harold
          text: 要是爱德华在，我们就能办到。
        - id: ch04-b05
          speaker: narrator
          text: 可这个擅离职守的英雄去了哪里？我们没有疑惑多久。先是一阵女人尖厉又愤怒的叫骂，顺着小路传下来。接着，爱德华使出全身本领飞奔而来，一个激动万分的女人紧紧追在他脚后。他来到岸边，一头跌进船底。
        - id: ch04-b06
          speaker: edward
          text: 快把船推开！
        - id: ch04-b07
          speaker: narrator
          text: 我们立刻使出浑身力气，把船推离岸边。那位太太站在岸上痛骂，口气和阿尔弗雷德大王向入侵的丹麦人掷出挑战时一模一样。我们顺流划走时，我越想越觉得，这正像《向西去！》里的一段。我很赞许这场面，也想知道爱德华究竟对她做了什么。
        - id: ch04-b08
          speaker: edward
          text: 我什么也没做。我进村去探险，那里很不错，村里人也都很客气。还有一间铁匠铺，他们正在给马钉蹄铁。马蹄冒着烟，发出咝咝的声音，那气味真带劲。我在那里看了好长时间。
        - id: ch04-b09
          speaker: edward
          text: 后来我口渴，就向那个老太婆讨水。她进去取水时，猫从屋里走出来，很不友好地看着我，还说了几句我不爱听的话。我只是走过去，想……想教教它规矩。可不知怎么搞的，下一刻它已经蹿上苹果树，在上面对我又嘶又叫。我却沿着小路跑了起来，那个老东西一直追在后面。
        - id: ch04-b10
          speaker: narrator
          text: 爱德华满脑子都是自己受到的伤害，根本没法让他对美狄亚产生一点兴趣。何况天色越来越晚，显然，这次抢救美人的远征只能留到改日再办。
    - id: ch05
      title: 智取拉金农夫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 快到家时，我们才渐渐想到，也许最大的危险还在前面。拉金农夫这时肯定已经发现船不见了，很可能正埋伏在泊船处。靠家这边没有第二个地方可以下船。若在对岸上岸，再绕路走向桥头，我们一定会被他看见。他只要赶过去，就能堵死我们的退路。
        - id: ch05-b02
          speaker: narrator
          text: 幸好那天大哥跟我们在一起，我真为此感谢命运。他虽不擅长假装游戏，可碰上生活中冷冰冰的事实，没有人比他更会应付。爱德华叫我们谁也别出声。离那个命中注定的泊船处只剩一小段路时，他把船划到对岸。我们悄无声息地爬上去，借着越来越浓的暮色，蹲到一棵柳树后面。他则用脚把空船重新推入河中。
        - id: ch05-b03
          speaker: narrator
          text: 老阿尔戈号由缓缓的水流载着，贴着长满芦苇的岸边滑下去，船身不时轻轻擦过河岸。它漂到农夫可能埋伏的地方时，一长串咒骂猛然响起。看来我们的防备一点也没有白费。拉金农夫生在乡下，也长在乡下，可我们躲着听那一串词汇丰富、变化无穷的骂人话，实在猜不出他究竟是从哪里学来的。
        - id: ch05-b04
          speaker: narrator
          text: 农夫终于完全明白，小船已经脱缰而去，无人照管，只能任凭风吹浪打。最糟的是，他根本够不着。于是他大步赶往下游四分之一英里外的桥。等他的靴子咚咚踏上桥板，我们立刻从柳树后蹿出去，截住小船，划回对岸，再把这艘忠诚的船牢牢系回原来的泊位。
        - id: ch05-b05
          speaker: narrator
          text: 爱德华很想等农夫来到对岸，再和这个失望的人交换几句礼貌的问候和赞美。可大家还是选择了更明智的办法。这场劫船案也许还没有明确算到我们头上，何必自己承认？我提醒他，奥德修斯曾为一次同样逞强的举动后悔。假如奥德修斯正在这里，他一定也会劝我们趁早撤退。
        - id: ch05-b06
          speaker: narrator
          text: 爱德华一向不大看得上我这个军师，却一直很敬重奥德修斯。
