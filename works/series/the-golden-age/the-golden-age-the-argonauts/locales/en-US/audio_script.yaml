audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    harold:
      display_name: Harold
      tts:
        delivery: earnest and proudly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: high
    edward:
      display_name: Edward
      tts:
        delivery: bold and matter-of-fact
        timbre: sturdy and youthful
        pace: brisk
        pitch: medium
    lucy:
      display_name: Lucy
      tts:
        delivery: warm and eager with a shadow of sadness
        timbre: light and clear
        pace: flowing
        pitch: medium-high
    lucys_aunt:
      display_name: Lucy's Aunt
      tts:
        delivery: sharp and firmly proper
        timbre: dry and angular
        pace: deliberate
