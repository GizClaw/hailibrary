  chapters:
    - id: ch01
      title: New Heroes and a Real Argo
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Whenever strangers entered our circle, we viewed them with deep suspicion. Usually, we escaped into caves, tangled woods, or distant cowsheds. Only our nursemaids knew the secret paths to all our hiding places, and they had learned those paths through long practice.
        - id: ch01-b02
          speaker: narrator
          text: >-
            So the heroes of the old Greek legends did not win us over at once. Trust grows slowly, and those grand, dark-haired half-gods had difficult names and wore strange equipment. They had to win their way into a fortress already guarded by old friends. Their cold foreign goddesses could not compare with the teasing fairies and wicked witches of the North. We missed the helpful animals too: the fox with the magnificent tail, the frog in the well, and the raven calling down advice from a tree.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Harold found one thing especially wrong. A hero, he felt, ought always to be the youngest of three brothers. His faith in the youngest brother's special luck made him rather too pleased with himself, and sometimes earned him a sound correction. Even while correcting him, though, we took his side. Beside our familiar company, even old Saturn seemed like a newcomer trying to get in.
        - id: ch01-b04
          speaker: narrator
          text: >-
            But strangers can become sworn comrades, and these bright swordsmen proved to be made of the proper stuff. Perseus flew straight into our hearts with his cap of darkness and wonderful sandals. Apollo came knocking at Admetus's gate like someone from a real fairy tale. Psyche had a magic palace, helpful birds, and friendly ants. At last, clever Ulysses broke through our final defenses with all his tricks and plans. After that, the whole band belonged to our brotherhood.
        - id: ch01-b05
          speaker: narrator
          text: >-
            One day I had been chasing Farmer Larkin's precious calves around their field, just to show him that we had not forgotten him. I came home through the kitchen garden with a perfectly peaceful conscience and found Edward digging for worms in the manure heap. He put the worms in his hat, and we walked off together, discussing important affairs of state.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Strange noises stopped us beside the tool shed. Inside, Harold sat alone, completely lost in the game of the moment. He was squatting in an old pig trough that had been brought in for repairs. As he cried out his tale, he waved a shovel over his head, then drove it into the ground like a man paddling a Canadian canoe. Edward marched in.
        - id: ch01-b07
          speaker: edward
          text: >-
            What silly game are you playing now?
        - id: ch01-b08
          speaker: narrator
          text: >-
            Harold went red, but he held his place in the trough like a man.
        - id: ch01-b09
          speaker: harold
          text: >-
            I'm Jason, and this is the Argo. All the other fellows are here too, but you can't see them. We're sailing through the Hellespont now, so don't bother us.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Then he went back to paddling the wine-dark sea. Edward gave the pig trough a scornful kick.
        - id: ch01-b11
          speaker: edward
          text: >-
            That's a fine sort of Argo you've got there!
        - id: ch01-b12
          speaker: harold
          text: >-
            I can't help that. It's the best Argo I can make, and it works perfectly if you pretend hard enough. You could never pretend at all.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Edward considered this.
        - id: ch01-b14
          speaker: edward
          text: >-
            Listen. Why don't we take Farmer Larkin's boat and sail straight up the river in a real Argo? We can look for Medea and the Golden Fleece and everything else. And since you thought of it first, I don't mind letting you be Jason.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Harold's feelings were so great that he tumbled right out of the trough.
        - id: ch01-b16
          speaker: harold
          text: >-
            But we're not allowed to go on the water by ourselves!
        - id: ch01-b17
          speaker: edward
          text: >-
            No, we're not allowed. I don't suppose Jason was allowed either, but he went!
        - id: ch01-b18
          speaker: narrator
          text: >-
            Harold's objection had only been made because objections were proper. He was quite ready to accept a good argument. Next came the question of the girls. Selina was useful in a boat, but she had lately begun to grow a conscience. If she disapproved of the voyage, and it was certainly no holy pilgrimage, she might tell on us. Charlotte often drifted into daydreams and might fall overboard without noticing. She would cry when she learned we had left her behind, but that was still better than a watery grave. So, despite the example of Atalanta among the first Argonauts, we decided against taking either girl.
        - id: ch01-b19
          speaker: edward
          text: >-
            Now, who's going to ask Farmer Larkin? I can't do it. The last time I saw him, he said he'd smack my head if he caught me again. You'll have to ask.
        - id: ch01-b20
          speaker: narrator
          text: >-
            I had good reason to hesitate.
        - id: ch01-b21
          speaker: narrator
          text: >-
            I began to remind Edward about Farmer Larkin's precious calves. He understood at once.
        - id: ch01-b22
          speaker: edward
          text: >-
            All right, then. We won't ask him. It doesn't really matter. He'd only get annoyed, and that would be a shame. Let's go.
    - id: ch02
      title: Up the River to Medea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            We went down to the stream and captured Farmer Larkin's boat without any trouble, because the enemy was busy in the hayfields. That waterway was called a river, though we could never find it in an atlas. Our Argo could hardly turn around in it without being wrecked. To us, however, it was the Orinoco, with all the cities of the world along its banks.
        - id: ch02-b02
          speaker: narrator
          text: >-
            We pointed the Argo upstream, away from Farmer Larkin's territory. Harold was faithfully allowed to be Jason, and we divided the other heroes between us. We launched from Thessaly with loud cries, passed through the Hellespont, narrowly escaped the Clashing Rocks, and sailed beside islands haunted by Sirens. Meadowsweet lined Lemnos. Dog roses bloomed along the Mysian shore. Across the coast of Thrace came the cheerful calls of people making hay.
        - id: ch02-b03
          speaker: narrator
          text: >-
            After an hour or two at sea, the Argo's bow stuck in the mud at a landing place. Cows had churned the wet ground with their hooves, and a lane ran toward the smoke of nearby houses. Edward sprang ashore, eager to explore, and strode away without even looking back to see whether we followed. I stayed behind. Close by, I had noticed an old gate covered with moss. It opened from the water into a garden wrapped in such deep, brooding quiet that magic seemed quite possible there.
        - id: ch02-b04
          speaker: narrator
          text: >-
            We stepped carefully through the gate, and even the air seemed quieter inside. Harold hung back, looking ashamed, as if we had entered someone's private room and the ghosts of old days were hurrying past us to escape. Flowers grew everywhere, but no one seemed to care for them. They drooped and tumbled over one another in a great overgrowth. The scent of heliotrope filled the garden so thickly that it seemed to hang in solid garlands between the tall, untrimmed hedges.
        - id: ch02-b05
          speaker: narrator
          text: >-
            There were no chairs, shawls, or novels to brighten the lawn. Most of the blinds were drawn on the house behind it. In the middle of the grass stood a gray old sundial, the most human-looking thing we could see. We went straight to it. An ancient motto circled its face, and we worked at the letters with our eyes and fingers.
        - id: ch02-b06
          speaker: harold
          text: >-
            Time tryeth trothe. What does that mean?
        - id: ch02-b07
          speaker: narrator
          text: >-
            I could not tell him. I could not answer his next questions either, about how the thing worked and where it had to be wound up. I had seen sundials before, of course, but I had never quite understood them.
        - id: ch02-b08
          speaker: narrator
          text: >-
            While we were still puzzling over it, I saw Medea coming down the path from the house. She was dark-haired, graceful, pale, and tired. I knew her at once. Since we had come to find her, I was not surprised in the least. Harold, meanwhile, was trying to climb on top of the sundial. He loved the top of anything, rather like a cat. At the sight of her, he started, fell flat, scraped his chin, and filled the quiet garden with howls.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Medea swept over the ground like a swallow. In a moment she was kneeling beside him, murmuring softly and wiping the dirt from his chin with her own delicate handkerchief.
        - id: ch02-b10
          speaker: narrator
          text: >-
            I politely told her not to worry so much. Harold would cry for exactly one minute, I said, and then he would be perfectly well.
        - id: ch02-b11
          speaker: narrator
          text: >-
            My judgment proved correct. When his usual minute was over, Harold stopped as suddenly as a clock striking the hour. His face became peaceful and cheerful. He wriggled out of Medea's arms and ran off to find a stone for a blackbird that had intruded on us.
        - id: ch02-b12
          speaker: lucy
          text: >-
            Oh, you boys! Where in the world did you come from? And how did you get so dirty? I've been shut away here for a thousand years, and I haven't seen anyone under a hundred and fifty in all that time. We must play something right now!
          emotion: happy
        - id: ch02-b13
          speaker: narrator
          text: >-
            I suggested rounders, since girls could play it and the sundial would make a good base. But we needed a bat, a ball, and more players.
        - id: ch02-b14
          speaker: narrator
          text: >-
            She struck her hands together in despair.
        - id: ch02-b15
          speaker: lucy
          text: >-
            I haven't got a bat or a ball. I haven't got more players, or anything useful at all. Never mind. We'll play hide-and-seek in the kitchen garden. Race me to that walnut tree! I haven't run for a hundred years!
        - id: ch02-b16
          speaker: narrator
          text: >-
            Yet she beat us so easily that, as I panted behind her, I began to think she might have added a year or two to her age. She threw herself into hide-and-seek with all the joy and devotion of a true artist. She flashed out of sight and appeared again, rosy and laughing. The pale young witch seemed to vanish. In her place was like that other girl from the old tale, carried away from fields of daffodils to rule in the shadows, then allowed to return for a while to the earth, the light, and the open, welcoming air.
    - id: ch03
      title: Time Tryeth Trothe
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last we grew tired and wandered back to the old sundial. Harold never left a puzzle alone, so he traced the worn letters again with his finger.
        - id: ch03-b02
          speaker: harold
          text: >-
            Time tryeth trothe. Please tell me what it means.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Medea bent so low over the sundial that her face was nearly hidden in her hands. When she answered, her voice had changed and fallen very quiet.
        - id: ch03-b04
          speaker: lucy
          text: >-
            That's why I'm here. They shut me away because they think I'll forget, but I never will. Never, never! And he won't forget either... only I don't know. It has been so long. I just don't know.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: >-
            Now her face was completely covered. Silence settled over the old garden again. I felt clumsy and useless. The only remedy that came to me was a vague thought of kicking Harold.
        - id: ch03-b06
          speaker: narrator
          text: >-
            None of us had noticed another female approaching, one of the stiff and angular sort, and utterly unlike our dear new comrade. Medea's thousand years might easily have belonged to this woman. She wore mittens too, which I particularly disliked in a woman.
        - id: ch03-b07
          speaker: lucys_aunt
          text: >-
            Lucy!
        - id: ch03-b08
          speaker: narrator
          text: >-
            Her sharp voice had AUNT written all through it. Medea sprang up guiltily. The newcomer studied her through a pair of spectacles.
        - id: ch03-b09
          speaker: lucys_aunt
          text: >-
            You have been crying. And who, may I ask, are these extremely dirty little boys?
        - id: ch03-b10
          speaker: lucy
          text: >-
            They're friends of mine, Aunt. I've known them for a long time. I asked them to visit me.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Medea spoke quickly and tried to sound cheerful. Her aunt sniffed with suspicion.
        - id: ch03-b12
          speaker: lucys_aunt
          text: >-
            You must come inside, dear, and lie down. The sun will give you a headache. As for you little boys, you had better run home to your tea. You should not go visiting without your nursemaid.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Harold had been pulling nervously at my jacket for some time. I waited only until Medea turned and kissed her white hand toward us as her aunt led her away. Then I ran. We reached the boat safely.
        - id: ch03-b14
          speaker: harold
          text: >-
            What a horrible old dragon!
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: >-
            I agreed that she was a beast. The idea that sunshine could give anyone a headache was ridiculous. Medea, though, was a true friend. I wondered if we could carry her away.
        - id: ch03-b16
          speaker: harold
          text: >-
            We could do it if Edward were here.
    - id: ch04
      title: Edward Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            But where had that missing hero gone? We soon found out. First, a woman's shrill, furious cries came down the lane. Then Edward appeared, running as hard as he could, with the excited woman close behind him. He dropped into the bottom of the boat, gasping.
        - id: ch04-b02
          speaker: edward
          text: >-
            Push off!
        - id: ch04-b03
          speaker: narrator
          text: >-
            We pushed with all our strength. From the bank, the woman hurled angry words after us, sounding just like King Alfred defying the invading Danes.
        - id: ch04-b04
          speaker: narrator
          text: >-
            As we rowed down the stream, I said it had been exactly like a scene from Westward Ho! Then I asked Edward what he had done to her.
        - id: ch04-b05
          speaker: edward
          text: >-
            I didn't do anything. I went exploring in the village. It was a very nice place, and everyone was polite. There was a blacksmith's forge where they were putting shoes on horses. The hoofs hissed and smoked, and the smell was splendid. I stayed there for quite a while.
        - id: ch04-b06
          speaker: edward
          text: >-
            Then I got thirsty, so I asked that old woman for some water. While she went to fetch it, her cat came out of the cottage. It gave me a nasty look and said something I didn't care for. I only went over to teach it some manners. Somehow, the next thing I knew, the cat was up an apple tree spitting at me, and I was running down the lane with that old creature chasing me.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Edward was so occupied with his own wrongs that we could not make him interested in Medea at all. Evening was coming on too, so any rescue would have to wait for another day.
    - id: ch05
      title: The Empty Argo
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            As we drew nearer home, another thought slowly came to us. The greatest danger might still be waiting. Farmer Larkin must have missed his boat by now, and he was probably watching for us near the landing place. There was nowhere else to get out on our side of the stream. If we landed across the water and tried to reach the bridge, he would certainly see us and cut us off.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Then I thanked my lucky stars that our elder brother was with us. Edward might not be much use at pretending, but no one could match him when stern facts had to be faced. He told us to keep quiet. When we were only a little way from the dangerous landing, he brought the boat to the opposite bank.
        - id: ch05-b03
          speaker: narrator
          text: >-
            We climbed out without a sound. The gathering darkness hid us as we crouched behind a willow and waited. Edward pushed the empty boat away with his foot. The old Argo went on alone, carried gently by the current. She slid and scraped along the bank through the rushes, heading straight toward the place where danger waited.
        - id: ch05-b04
          speaker: narrator
          text: >-
            When the boat reached the place where we suspected Farmer Larkin was hiding, a flood of furious language burst from the bank. It told us plainly that our caution had not been wasted and that he really had been lying there in ambush. We listened in wonder. Farmer Larkin had been born and raised in the country, yet somehow he had collected an astonishing number of words for an occasion like this.
        - id: ch05-b05
          speaker: narrator
          text: >-
            At last he understood that his boat had been abandoned to the wind and waves and was floating beyond his reach. He strode toward the bridge, which stood about a quarter of a mile farther down. As soon as we heard his boots thumping over the planks, we darted from our hiding place.
        - id: ch05-b06
          speaker: narrator
          text: >-
            We caught the Argo, rowed back across, and tied the faithful vessel at its proper mooring. Edward wanted to stay and exchange a few civil words with the disappointed farmer when he appeared on the opposite bank. The rest of us persuaded him otherwise.
        - id: ch05-b07
          speaker: narrator
          text: >-
            After all, no one might yet know that we were the pirates. I reminded Edward that Ulysses had once suffered for just such a piece of boasting. If Ulysses had been with us, he would surely have advised a quick retreat. Edward thought very little of my advice, but he had a deep respect for Ulysses.
