  chapters:
    - id: ch01
      title: The New Tutor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            People often remark that nature shares our feelings, as though no one had noticed it before. To us, it seemed perfectly natural. On the blustery March day when Edward and I waited at the station for our new tutor, the wind sang and sobbed in the poplar trees. Whenever it paused, sudden rain spattered the dusty road.
        - id: ch01-b02
          speaker: narrator
          text: >-
            An aunt had planned the meeting. She imagined that our shy, innocent young hearts would open on the walk home. Each side would reveal its more solid qualities, and then a lasting friendship would surely grow from mutual respect. It was a pretty dream, carefully arranged in advance, and nothing more.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Edward knew that he would bear the worst of the tutoring. He was sulky, ready to answer with one word, and determined to be as disagreeable as good manners allowed. That left me to supply all the empty welcomes, polite explanations, and other grand-household courtesies. I especially hated that kind of business, and the task did not improve my temper. The stormy March weather was in both our hearts as we glared into the windows of the slowing train.
        - id: ch01-b04
          speaker: narrator
          text: >-
            But we had judged the difficulty wrongly. Among a trainload of country people, the tutor was easy to spot. His bag was sent off in the luggage cart, and we had him out in the lane before I could use one of my carefully prepared sentences. I began to breathe more freely.
        - id: ch01-b05
          speaker: narrator
          text: >-
            We had expected someone dry, scholarly, and severe. Instead, he had an eager, boyish face, untidy hair, and a rather impatient pair of pince-nez. His head darted about like a robin's, and his voice kept breaking into a high note. He was certainly strange, but he was not frightening at all.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He moved through the village in little jerks, looking eagerly from side to side. Then he suddenly cried out.
        - id: ch01-b07
          speaker: tutor
          text: >-
            Charming! Oh, this is all so charming and delightful!
        - id: ch01-b08
          speaker: narrator
          text: >-
            I had not expected that. I looked to Edward for help, but he kept his hands in his pockets and stared grimly down his nose. He had chosen his manner, and he meant to keep it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The tutor made a pretend spyglass with his fist and peered through it at something I could not see.
        - id: ch01-b10
          speaker: tutor
          text: >-
            What an exquisite little piece! Fifteenth century. No... yes, it must be!
        - id: ch01-b11
          speaker: narrator
          text: >-
            Now I was puzzled, and even a little alarmed. He reminded me of a butcher in the Arabian Nights. The ordinary joints hanging in that butcher's shop suddenly looked, to a horrified public, like pieces of human bodies. In just the same way, our dull, familiar village seemed to show this man the strangest things.
        - id: ch01-b12
          speaker: narrator
          text: >-
            We went on between the hedges. He stared at a field beneath the downs, where a rain cloud hung darkly overhead.
        - id: ch01-b13
          speaker: tutor
          text: >-
            Ah, look at that field with the downs behind it and the rain cloud brooding above. It's pure David Cox, every bit of it!
        - id: ch01-b14
          speaker: narrator
          text: >-
            I politely explained that the field belonged to Farmer Larkin. I offered to take him to Farmer Cox's farm the next day if Cox was a friend of his, though there was nothing worth seeing there. Behind us, Edward pulled a face that plainly asked what sort of lunatic we had been given.
        - id: ch01-b15
          speaker: tutor
          text: >-
            Your countryside has the true pastoral feeling. And the cottages and farmhouses still carry little pieces of a lost art. That's what makes the English landscape so heavenly and unlike anywhere else!
        - id: ch01-b16
          speaker: narrator
          text: >-
            This chirping grasshopper was becoming hard work. We knew every blade and stick in those fields, and they had done nothing to deserve so many adjectives. They were not heavenly or unique to us. They were simply themselves. I nudged Edward in the ribs, begging him to start a sensible conversation, but he only grinned and stayed silent.
    - id: ch02
      title: Romance in the Old Gables
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last I pointed out our house. Selina was in the paddock, either chasing the donkey or being chased by it. I could not tell which, but it was certainly the two of them.
        - id: ch02-b02
          speaker: tutor
          text: >-
            Exquisite! Everything is so mellow, so harmonious, and so completely in keeping! Think of all the romance those old gables might hold!
        - id: ch02-b03
          speaker: narrator
          text: >-
            Edward's face suggested that he was wondering who ought to be kept in somewhere. I told the tutor that if he meant the attics, they held old furniture, and one was usually full of apples. Sometimes bats came under the eaves and flapped about until we drove them out with hairbrushes. As far as I knew, there was nothing else up there.
        - id: ch02-b04
          speaker: tutor
          text: >-
            Oh, there must be more than bats! Please don't tell me you have no ghosts. I shall be terribly disappointed if there aren't any.
        - id: ch02-b05
          speaker: narrator
          text: >-
            I decided he did not deserve an answer. I had no strength left for this sort of talk, and we were almost home, where my duty would end. Aunt Eliza met us at the door. She and the tutor began firing adjectives at each other, both talking at once in the grown-up way. Edward and I slipped around the back of the house and quickly put several solid acres between ourselves and civilization. Otherwise, someone might order us in for drawing-room tea.
        - id: ch02-b06
          speaker: narrator
          text: >-
            By the time we returned, the tutor had gone upstairs to dress for dinner. Whatever dinner might bring, we were free of him until the next morning.
    - id: ch03
      title: The Midnight Expedition
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The March wind had quieted for a while at sunset, but then it steadily grew stronger. I fell asleep at my usual time. Around midnight, the force and crying of the wind woke me. In the bright moonlight, branches swung and tossed eerily across the blinds. There was rumbling in the chimneys, whistling in the keyholes, and a call and clamor everywhere in the old house.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Sleep was impossible. I sat up and looked around. Edward was sitting up too.
        - id: ch03-b03
          speaker: edward
          text: >-
            I wondered when you'd wake up. There's no use trying to sleep through this. Let's get up and do something.
        - id: ch03-b04
          speaker: narrator
          text: >-
            I was willing. The old house sounded like a ship being battered by the wind, so I suggested that we pretend to be at sea. We could be wrecked on an island or left on a raft. I preferred the island because it would have more things on it.
        - id: ch03-b05
          speaker: edward
          text: >-
            That would make too much noise. Playing ships is no fun unless you can make a really good racket.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The door creaked, and a small white figure slipped carefully into the room.
        - id: ch03-b07
          speaker: charlotte
          text: >-
            I thought I heard you talking. We don't like the storm. We're frightened, Selina too. She'll be here in a moment. She's putting on that new dressing gown she's so proud of.
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: >-
            Edward wrapped his arms around his knees and thought hard. Selina soon appeared, barefoot and looking slim and tall in her new dressing gown. Then Edward had his idea.
        - id: ch03-b09
          speaker: edward
          text: >-
            Look, we're all together now. Let's go exploring!
        - id: ch03-b10
          speaker: narrator
          text: >-
            I reminded him that he always wanted to explore and asked what there could possibly be to explore in our own house.
        - id: ch03-b11
          speaker: edward
          text: >-
            Biscuits!
        - id: ch03-b12
          speaker: harold
          text: >-
            Hooray! Let's go!
          emotion: happy
        - id: ch03-b13
          speaker: narrator
          text: >-
            Harold sat up without warning. He had been awake all along and only pretended to sleep in case anyone made him fetch something or do some other job. Edward had remembered an important fact. Our careless elders sometimes left the biscuits out after the evening was over, ready to reward a midnight adventurer with nerves of steel.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Edward jumped out of bed and pulled a baggy old pair of knickerbockers over his bare legs. Around his waist he buckled a belt, with a large wooden pistol on one side and an old practice sword on the other. Last came a huge slouch hat that had once belonged to an uncle. We used it when we played Guy Fawkes, or Charles the Second hiding in a tree.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Whatever the audience, Edward dressed for every part with great care. Harold and I were more like true Elizabethan actors. We did not mind how the play looked, as long as its dramatic heart beat properly.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Our commander ordered us to be as silent as the grave. He reminded us that Aunt Eliza usually slept with her door open. To reach the stairs by the ordinary route, every one of us would have to file directly past it.
        - id: ch03-b17
          speaker: selina
          text: >-
            Then we'll take the shortcut through the Blue Room.
        - id: ch03-b18
          speaker: edward
          text: >-
            Of course. I forgot that. Right, you lead the way!
    - id: ch04
      title: Through the Blue Room
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            In what seemed like prehistoric times, the Blue Room had been enlarged by swallowing up an unnecessary passage. That gave it the great advantage of two doors. We could cross the room and reach the head of the stairs without passing the bedchamber where our dragon of an aunt lay asleep. Nobody used the Blue Room much, except when some uncle happened to come down for the night.
        - id: ch04-b02
          speaker: narrator
          text: >-
            We filed inside without a sound. The room was dark except for a bright stripe of moonlight across the floor, and we had to cross it to reach the other door. Selina stopped right in the middle to admire the way her new dressing gown hung. Pleased with what she saw, she began to pose and parade, dancing a stately minuet with an imaginary partner.
        - id: ch04-b03
          speaker: narrator
          text: >-
            This was too much for Edward's acting spirit. After watching for a moment, he drew his practice sword, flourished it as the occasion demanded, and strode into the moonlight. A proper stage fight followed. At the end, he slowly and solemnly stabbed Selina, then carried her pretend corpse out of the room like a merciless cavalier. The rest of us rushed behind them in a clump, leaping and waving with delight. The special charm of the performance was that all this drama had to be carried out as the dumbest of dumb shows.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Once we reached the dark landing, the roar of the storm told us that we had been far too careful about silence. We each grabbed the tail of the nightgown ahead, just as Alpine climbers rope themselves together in dangerous places. Stoutly we made our way down the great mountain of the staircase and across the grim glacier of the hall. A faint glow shone through the half-open drawing-room door like the welcoming lights of an inn.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Inside, our wasteful elders had left a deep, sound, red heart of fire. With very little trouble, we coaxed it into a cheerful blaze. Better still, a whole plate of biscuits seemed to smile at us in encouragement. Beside it lay two halves of a lemon. They had already been squeezed once, but they could still be sucked.
        - id: ch04-b06
          speaker: narrator
          text: >-
            We shared the biscuits fairly and passed the lemon pieces from mouth to mouth. As we crouched around the fire, its friendly warmth comforted our bare legs. We knew then that all those dangers of the night had not been faced for nothing.
        - id: ch04-b07
          speaker: edward
          text: >-
            It's odd how much I hate this room in daylight. It always means someone washing your face, brushing your hair, and making you talk silly company talk. But tonight it's really rather jolly. Somehow it looks like a different room.
        - id: ch04-b08
          speaker: narrator
          text: >-
            I said I could never understand why people came to our house for tea. They could drink tea at home, since they were not poor. There they could have jam, drink from their saucers, suck their fingers, and enjoy themselves. Instead, they traveled a long way to sit straight with their feet off the chair rails, drink one cup, and say the same things every time.
        - id: ch04-b09
          speaker: selina
          text: >-
            You don't understand anything about it. People in society have to call on one another. It's the proper thing to do.
        - id: ch04-b10
          speaker: edward
          text: >-
            Pooh! You're not in society, and you never will be.
        - id: ch04-b11
          speaker: selina
          text: >-
            I will be someday. But I won't invite you to visit me, so there!
        - id: ch04-b12
          speaker: edward
          text: >-
            I wouldn't come if you did.
        - id: ch04-b13
          speaker: selina
          text: >-
            Well, you won't get the chance.
        - id: ch04-b14
          speaker: narrator
          text: >-
            None of them was truly angry. Those little courtesies were what we understood to be the art of polite conversation.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Harold was stretched full length across the sofa, in a way no daylight drawing room would ever allow.
        - id: ch04-b16
          speaker: harold
          text: >-
            I don't like society people. Some came here this afternoon while you two were at the station. I'd found a dead mouse on the lawn and wanted to skin it, but I wasn't sure I could do it alone. Then the visitors came into the garden and patted my head. I wish people wouldn't do that.
        - id: ch04-b17
          speaker: harold
          text: >-
            One lady asked me to pick her a flower. I didn't see why she couldn't pick it herself, but I said I would if she held my mouse. She screamed and threw it away, and Augustus the cat ran off with it. I think it was really his mouse, because he'd been looking around as if he'd lost something. I wasn't angry with him. But why did that lady have to throw my mouse away?
        - id: ch04-b18
          speaker: edward
          text: >-
            You do have to be careful with mice. They're terribly slippery. Remember when we played with a dead mouse on the piano? The mouse was Robinson Crusoe, and the piano was his island. Somehow Crusoe slipped down inside the island, right into the works. We tried rakes and every other thing, but we couldn't get him out. The piano tuner didn't come until a week later, and then—
        - id: ch04-b19
          speaker: narrator
          text: >-
            At that moment, Charlotte, who had been nodding solemnly, toppled into the fender. Only then did we notice that the wind had finally fallen. A great stillness wrapped the whole house. Our empty beds seemed to be calling us back with such authority that we were all relieved when Edward gave the signal to retreat.
        - id: ch04-b20
          speaker: narrator
          text: >-
            At the top of the stairs, Harold suddenly rebelled. He claimed that in a free country he had the right to slide down the banister. There was no time to argue, so I proposed that we carry him frog-fashion instead. We marched solemnly through the moonlit Blue Room with Harold held flat and hanging limp between us.
        - id: ch04-b21
          speaker: narrator
          text: >-
            At last we were snug in bed. I was just falling asleep when Edward burst into chuckles and snorts.
        - id: ch04-b22
          speaker: edward
          text: >-
            Good heavens! I completely forgot. The new tutor is sleeping in the Blue Room!
        - id: ch04-b23
          speaker: narrator
          text: >-
            Sleepily, I said it was lucky he had not awakened and caught us. Then neither of us gave the matter another thought. We sank into the rest we had thoroughly earned.
    - id: ch05
      title: A Chronicle of Actual Experience
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The next morning, we came down to breakfast ready to face fresh trouble. But our talkative friend from the day before arrived late and was strangely silent. He seemed to have something on his mind. After finishing our porridge, we ran outside to feed the rabbits. We explained that a beast of a tutor would keep them from enjoying as much of our company as before.
        - id: ch05-b02
          speaker: narrator
          text: >-
            At the dreadful hour set for lessons, we returned to the house. To our amazement, the station cart was vanishing down the drive with the new tutor and his luggage inside it. Aunt Eliza refused to explain anything. But we overheard her casually remark that she thought the man must be a lunatic. We were only too ready to agree with that theory. Afterward, we dismissed the whole affair from our minds.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Several weeks later, Uncle Thomas paid us one of his brief visits. From his pocket he pulled the newest issue of a weekly paper called Psyche: a Journal of the Unseen. Then, with great effort, he slowly unloaded a great deal of humor that we could not understand. Somehow, all of it was plainly meant to be at our expense.
        - id: ch05-b04
          speaker: narrator
          text: >-
            We endured it patiently, wearing the stiff grins that good manners required, because we wanted to reach the source of his amusement. At last, he showed us a paragraph that described our modest, ordinary little home in unmistakable detail.
        - id: ch05-b05
          speaker: narrator
          text: >-
            It was headed “Case Three.” The paper claimed that a young member of the Society, known to be honest and serious, had supplied the facts. What followed, it said, was a record of a real and recent experience.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The description of our house was accurate enough, and the details could not be mistaken. Then came a flood of meaningless nonsense about apparitions and visitors in the night. It was written like the work of someone with a troubled mind and a very weak imagination. The fellow was not even original.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Every worn-out piece of an old Christmas ghost story was there. A storm in the night. A haunted room. A white lady. A murder acted out once again. All of it had already been used until it was threadbare. None of us could make head or tail of the story, or understand what any of it had to do with our quiet house.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Edward had suspected the man from the beginning. He always insisted that our tutor, brief as his stay had been, was somehow at the bottom of it all.
