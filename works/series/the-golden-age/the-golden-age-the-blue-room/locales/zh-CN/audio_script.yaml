audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 机灵顽强，编故事时一本正经又越说越投入
        timbre: 清亮稚嫩的男孩声
        pace: 平常轻快，夸张讲述时故意放慢
        pitch: 中高
    tutor:
      display_name: 新家庭教师
      tts:
        delivery: 热情敏感，见到景物便忍不住赞叹
        timbre: 年轻清亮，偶尔微微破音
        pace: 跳跃急促，兴奋时连珠般加快
        pitch: 中高
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 直率胆小，说话轻声而认真
        timbre: 柔软稚嫩的女孩声
        pace: 稍慢，紧张时停顿
        pitch: 高
    selina:
      display_name: 塞利娜
      tts:
        delivery: 自信讲究，争辩时尖锐又不失从容
        timbre: 清脆明亮的少女声
        pace: 利落，反驳时略快
        pitch: 中高
  chapters:
    - id: ch01
      title: 风中的新老师
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            人们常说，大自然也会跟人一起欢喜、一起悲伤，而且每次都把这话当成新发现。我们却觉得，天地本来就该这样。那个三月的日子，我和爱德华站在车站月台上等新家庭教师。狂风在白杨树梢一阵高唱，一阵呜咽。风稍一停，急雨就泼上满是尘土的路。这天气正合我们的心境。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这番安排当然出自一位姑妈。她想得很美，以为从车站走回家的路上，我们羞怯而天真的心灵会向老师敞开，双方也会发现彼此可靠的品性，从此因敬重而成为长久的朋友。可惜，那只是一场漂亮的梦。爱德华料定，老师来了以后，受压迫最重的准是他。他阴沉着脸，只肯一个字一个字地答话，还打算在不失礼的限度内，尽量叫人不痛快。
        - id: ch01-b03
          speaker: narrator
          text: >-
            所以，开口说话和供应客套话的差事全落在我身上。我最讨厌的，偏偏就是寒暄、欢迎、解释这些宫廷总管才干的事。我的脾气自然也好不到哪儿去。列车慢慢进站时，我们闷着头瞪遍一扇扇车窗，心里同三月的风雨一样乱。
        - id: ch01-b04
          speaker: narrator
          text: >-
            可人总会把难处想错。这场迎接其实轻松得很。整列车的乘客都有同样的乡土气，家庭教师一眼就认得出来。我准备好的句子还没说出一句，他的旅行箱已经送上行李车，人也被我们领进了乡间小路。我终于松了口气。大家并肩走着，我抬头看看这位新朋友，才想起我们先前料定，来的会是个枯燥、严厉、满身学究气的人。眼前却是一张年轻热切的脸。夹鼻眼镜不大安分，头发乱蓬蓬的，脑袋像知更鸟一样不停敏捷转动，嗓音还常常一下破到女高音。这一切陌生得出奇，却一点也不可怕。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他走过村子时脚步磕磕绊绊，眼睛一会儿望这边，一会儿看那边。没多久，他就忍不住了。
        - id: ch01-b06
          speaker: tutor
          text: 真迷人！这地方实在太迷人、太可爱了！
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: >-
            我没料到他会来这一套，只好向爱德华求援。爱德华双手插在口袋里，冷着脸顺鼻尖往下看。他既然选定了态度，就绝不改变。新老师却把拳头攥成望远镜，眯起眼睛，瞧着一样我根本看不见的东西。
        - id: ch01-b08
          speaker: tutor
          text: 多精美的一小景！这是十五世纪的……不，没错，就是十五世纪！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: >-
            我不但困惑，甚至有点害怕。这让我想起《一千零一夜》里的屠夫。他店门前挂的明明是普通肉块，惊骇的众人看去，却像一具被肢解的人体。眼前这个人也一样，竟能从我们熟悉得发腻的平淡景物里，看出最离奇的东西。
        - id: ch01-b10
          speaker: tutor
          text: >-
            啊，再看那片田！后面是连绵的丘陵，雨云正低低压在上面。这完全是戴维·考克斯的画，一点也不差！
        - id: ch01-b11
          speaker: narrator
          text: >-
            我客气地告诉他：“那片田属于拉金农场主。要是考克斯农场主是你的朋友，我明天可以带你去找他。不过他那里没什么可看的。”爱德华拖在后面，冲我做了个鬼脸，分明是在问，我们到底弄来了哪一种疯子。
        - id: ch01-b12
          speaker: tutor
          text: >-
            你们这里有真正的田园气息。村舍和农庄又添上了往昔艺术留下的一笔，才让英格兰的风景这样神妙，这样独一无二！
        - id: ch01-b13
          speaker: narrator
          text: >-
            这只蚱蜢越来越叫人吃不消。这里每一片田、每一座农庄、每一根草和木头，我们都熟得不能再熟。可据我所知，它们从没做过任何事，凭什么让人往身上这样乱泼形容词？我也从没觉得它们神妙、独一无二，或是什么别的东西。它们就是它们自己，仅此而已。我绝望地捅了捅爱德华的肋骨，示意他赶紧谈点合乎理性的事。他却只是咧嘴一笑，还是不肯帮忙。
        - id: ch01-b14
          speaker: narrator
          text: >-
            过了一会儿，我只好再开口：“现在能看见房子了。那边是塞利娜，她正在围场里追驴。也可能是驴在追她，我看不清，不过反正是他们俩。”新老师立刻又把满膛的形容词轰了出来。
        - id: ch01-b15
          speaker: tutor
          text: >-
            精美绝伦！多么醇厚，多么和谐，又多么相称！再看那些古老的山墙，里面该藏着多少浪漫故事啊！
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: >-
            爱德华的脸色说明，他正琢磨谁该跟谁“相称”。我则告诉老师：“你要是说阁楼，那里只有旧家具，其中一间常常堆满苹果。蝙蝠有时从屋檐下钻进去，扑腾个没完，我们得拿发刷之类的东西把它们赶走。据我所知，再没有别的了。”
        - id: ch01-b17
          speaker: tutor
          text: >-
            哦，绝不可能只有蝙蝠！别告诉我那里没有鬼。要是一个鬼也没有，我会失望透顶的。
        - id: ch01-b18
          speaker: narrator
          text: >-
            这种话不值得回答，我也实在无力再应付这种谈话。幸好快到家了，我的差事就要结束。伊莱扎姑妈在门口迎接我们，两个人随即用形容词交叉开火，还像大人们惯常做的那样，同时说个不停。我和爱德华便从屋后溜走，飞快地逃开，把好几英亩实实在在的土地隔在我们与文明之间，免得被叫进客厅喝茶。等我们回来，新老师已经上楼换晚餐衣服。至少到第二天以前，我们算是摆脱他了。
    - id: ch02
      title: 深夜探险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            日落时，三月的风安静了一阵，随后声势又一点点壮大起来。我照常在平时的钟点睡着，到了半夜，却被狂风的冲撞和号哭惊醒。月光照得很亮，被风摇动的树枝来回翻腾，怪异的影子掠过百叶窗。烟囱里隆隆作响，钥匙孔吹着尖厉的哨声，到处都是喧嚷，到处都是呼唤。想再睡着已经不可能了。我坐起来朝四周看看，爱德华也跟着坐起身。
        - id: ch02-b02
          speaker: edward
          text: 我正等你什么时候醒呢。这么大的动静，硬睡也没用。咱们起来找点事做吧。
        - id: ch02-b03
          speaker: narrator
          text: >-
            我赞成，还提议假装坐船出海。老房子挨着风的捶打，不住呻吟，自然让人想到船。我们可以在岛上遇难，也可以被留在木筏上。我更喜欢岛，因为岛上的东西多。爱德华想了一会儿，却不同意。
        - id: ch02-b04
          speaker: edward
          text: >-
            那会闹出太大声音。玩船要是不能痛痛快快吵一场，那还有什么意思？
        - id: ch02-b05
          speaker: narrator
          text: >-
            门吱呀一响，一个穿白衣的小身影小心溜了进来。
        - id: ch02-b06
          speaker: charlotte
          text: >-
            我好像听见你们在说话。我们不喜欢这风声，我们害怕，塞利娜也怕。她马上来，正在穿那件让她特别得意的新睡袍。
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: >-
            爱德华抱着膝盖苦苦思索。塞利娜终于光着脚出现，新睡袍衬得她又高又苗条。等大家到齐，爱德华有了主意。
        - id: ch02-b08
          speaker: edward
          text: 现在人齐了，咱们去探险吧！
        - id: ch02-b09
          speaker: narrator
          text: 我问他：“你总想探险，可这屋子里到底有什么好探的？”
        - id: ch02-b10
          speaker: edward
          text: 饼干！
        - id: ch02-b11
          speaker: harold
          text: 好哇！走吧！
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: >-
            哈罗德突然坐了起来。他一直醒着，只是假装睡觉，免得有人派他做事。爱德华倒没记错。我们那些粗心的大人偶尔会把饼干留在外面，等着神经如钢铁般坚强的夜游冒险家去夺取。
        - id: ch02-b13
          speaker: narrator
          text: >-
            爱德华滚下床，把一条肥大的旧灯笼裤套上光腿，又给自己系好腰带。一边插着大木手枪，另一边别着旧单棍，最后还戴上一顶叔叔留下的宽边软帽。我们扮盖伊·福克斯和“树上的查理二世”时，总用这顶帽子。只要条件许可，不管观众是谁，爱德华扮角色一定认真又仔细地打扮。哈罗德和我却是真正的伊丽莎白时代人。舞台怎么布置，我们毫不在乎，只要戏剧真正的心脏还在有力地跳就行。
        - id: ch02-b14
          speaker: narrator
          text: >-
            司令官命令我们像坟墓一样安静。伊莱扎姑妈通常开着房门睡觉，而我们得从门前排队经过。
        - id: ch02-b15
          speaker: selina
          text: 我们可以抄近路，从蓝房间穿过去。
        - id: ch02-b16
          speaker: edward
          text: 对呀，我倒忘了。好，你在前面带路！
        - id: ch02-b17
          speaker: narrator
          text: >-
            在我们所谓的史前时代，人们把一条多余的过道并进蓝房间，才把房间扩成如今的样子。所以那里不但有两扇门，还能让我们直达楼梯顶端，不必经过恶龙姑妈躺着的卧室。除了偶尔有哪位叔叔来住一夜，那里很少住人。我们悄无声息地排队进去。屋里全黑，只有一条明亮月光铺在地板上。要从另一扇门出去，我们非得穿过那条月光不可。
        - id: ch02-b18
          speaker: narrator
          text: >-
            走在前面的女主角偏停在月光里，仔细看新睡袍垂得好不好。看得十分满意，她便像孔雀一样摆起姿势，还带着想象中的舞伴，在月光上跳起小步舞。爱德华的戏瘾立刻发作。他拔出单棍，舞着漂亮的花式，大步登场。一场规规矩矩的搏斗开始了。最后，塞利娜缓慢而痛快地挨了一剑，无情的骑士把她的尸体抱出房间。我们其余的人欢喜地蹦跳比画，成团追了出去。最妙的是，这出戏必须用最安静的哑剧演完。
    - id: ch03
      title: 炉火边的夜谈
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            到了黑暗的楼梯平台，外面的风暴提醒我们，刚才实在把保持安静的必要夸大了。我们各自抓住前一个人的睡衣后摆，好像阿尔卑斯山的登山者走到险地，用绳子把彼此连起来。大家勇敢走下楼梯这片冰碛，又穿过阴森的门厅冰川。客厅半开的门透出一点微光，像远处友善的旅店灯火，在向我们招手。
        - id: ch03-b02
          speaker: narrator
          text: >-
            进去一看，那些挥霍无度的大人留下了一颗通红结实的火心，只要稍微拨弄，就燃成令人愉快的火焰。满满一盘饼干也笑盈盈地鼓励我们，旁边还有两半已经榨过一回、却还能再吸一吸的柠檬。饼干得到公正的分配，柠檬瓣则从这张嘴传到那张嘴。我们围着炉火蹲下，让和煦的热气安慰光裸的四肢，觉得夜里那些危险总算没有白冒。
        - id: ch03-b03
          speaker: edward
          text: >-
            真奇怪。白天我特别讨厌这个房间。到这里就要洗脸、梳头，还要陪客人说傻话。可今晚倒挺好玩，连样子都不一样了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            我也一直不明白，人们为什么非到这里喝茶。他们又不穷，明明能在自己家喝，配着果酱，端起茶碟喝茶，吸吸手指，想怎么舒服就怎么舒服。可他们偏从老远跑来，挺直身子坐着，脚不能搭椅子横档，只喝一杯茶，每次还都说同样的话。
        - id: ch03-b05
          speaker: selina
          text: 你懂什么。社交界里的人就得彼此拜访，这才合规矩。
        - id: ch03-b06
          speaker: edward
          text: 呸！你又不在社交界里，而且永远也进不去。
        - id: ch03-b07
          speaker: selina
          text: 我总有一天会进去。不过到时候我才不请你来看我呢！
        - id: ch03-b08
          speaker: edward
          text: 你请我，我也不来。
        - id: ch03-b09
          speaker: selina
          text: 那正好，你根本不会有这个机会。
        - id: ch03-b10
          speaker: narrator
          text: >-
            塞利娜理所当然地抢到了最后一句。这番小小的亲切客套里没有半点真火气。在我们看来，所谓礼貌谈话的艺术，正是由这些话构成的。哈罗德则从沙发上插进话来。他整个人四仰八叉地躺在那里，那副样子要是出现在白天，连白昼都会羞得脸红。
        - id: ch03-b11
          speaker: harold
          text: >-
            我不喜欢社交界的人。今天下午，你们去车站的时候，就来了几个。我在草地上捡到一只死老鼠，想给它剥皮，可又不知道自己一个人会不会。那些人走进花园，还拍拍我的头。我真希望别人别老这么干。其中一个女人叫我替她摘花，我不知道她为什么不自己摘，就说：“好吧，你替我拿老鼠，我就替你摘。”
        - id: ch03-b12
          speaker: harold
          text: >-
            可她尖叫一声，把老鼠扔了。奥古斯都，就是那只猫，叼起老鼠就跑。我觉得那本来就是它的老鼠，因为它先前一直在四处找，好像丢了什么。所以我没生它的气。可那个女人为什么要扔我的老鼠？
        - id: ch03-b13
          speaker: edward
          text: >-
            老鼠这种东西太滑溜，碰它们可得小心。还记得那一次吗？我们把死老鼠放在钢琴上玩。老鼠是鲁滨孙·克鲁索，钢琴就是荒岛。不知怎么，克鲁索滑进荒岛里面，掉进钢琴的机件里。我们拿耙子和各种东西都试过，还是弄不出来，只能等调音师。可调音师一个星期以后才来，后来……
        - id: ch03-b14
          speaker: narrator
          text: >-
            夏洛特本来正一本正经地点头，听到这里，忽然一头栽进壁炉围栏。我们这才发现，风终于停了，整座房子让一片巨大的寂静裹住。那些空着的床仿佛在发出不容违抗的召唤。爱德华终于发出撤退信号时，大家都很高兴。
    - id: ch04
      title: 蓝房间里的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            到了楼梯顶上，哈罗德忽然造反，坚持说在一个自由的国家里，他有权从楼梯扶手上滑下去。当时的情形不容我们停下来争辩，我便提议改用四人抬四肢的办法。于是大家抓着他的胳膊腿，把他抬走。队伍庄严地穿过月光下的蓝房间，哈罗德横躺在半空，浑身软绵绵的，表示完全服从。终于钻回温暖的被窝，我刚要滑进梦乡，就听见爱德华突然扑哧笑了一声，接着又从鼻子里哼了一下。
        - id: ch04-b02
          speaker: edward
          text: 老天，我全忘了！新来的家庭教师就睡在蓝房间！
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: >-
            我困得只咕哝了一句：“幸亏他没醒来抓住我们。”然后，谁也没再想这件事，我们双双沉入理所应得的酣眠。
        - id: ch04-b04
          speaker: narrator
          text: >-
            第二天早晨，我们下楼吃早餐，已经鼓足精神准备跟新的苦难狠狠干上一场。可前一天那位喋喋不休的朋友很晚才出现，而且出奇地沉默，看起来心事重重。我们把自己的燕麦粥吃得干干净净，随后跑出去喂兔子，还郑重向它们解释，那个讨厌的家庭教师会让它们失去许多陪伴，再也不能像从前那样常常享受我们的社交。
        - id: ch04-b05
          speaker: narrator
          text: >-
            命定的上课时间到了。我们回到屋里一看，简直不敢相信自己的眼睛。车站马车正沿着车道渐渐远去，车上载的就是那位刚来的新相识。伊莱扎姑妈残酷地什么也不肯告诉我们。不过后来有人听见她随口提起，她觉得那人准是疯了。这个说法，我们再赞成不过。此后，整件事也就被我们抛到了脑后。
    - id: ch05
      title: 幽灵事件
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            几个星期后，托马斯叔叔匆匆来访，从口袋里拿出最新一期周刊《普绪克：幽冥纪事》。接着，他费力地把许多我们听不懂的笑话一股脑倒出来，显然全是在取笑我们。我们只好耐着性子承受，按照礼俗的要求勉强咧嘴陪笑，一心只想赶紧找出这番灵感的源头。
        - id: ch05-b02
          speaker: narrator
          text: >-
            原来，杂志上有一段文字，煞有介事地描写我们那座不起眼、平淡无奇的住宅。开头说：“案例三。以下详情由本会一位年轻会员提供。此人操守无可置疑，态度严肃认真，所记也是近期真实经历。”接下来是一段相当准确的房屋描述，那些细节清清楚楚，一看就知道说的是我们家。可这段还算明白的文字后面，立刻接上了另一种东西。
        - id: ch05-b03
          speaker: narrator
          text: >-
            文章里忽然涌出一大堆关于幽灵、夜半来客之类的胡言乱语。那种写法明明白白地告诉我们，写文章的人头脑紊乱，想象力还贫乏得可怜。他甚至连一点新意也没有。夜间的风暴、闹鬼的房间、白衣女鬼、重新上演的凶杀，所有陈旧材料一样不少。这些东西早已在无数圣诞特刊上出现过，早就被人用得破烂不堪。
        - id: ch05-b04
          speaker: narrator
          text: >-
            谁也完全弄不懂那篇古怪的东西究竟在说什么，更不明白这一切跟我们那座安安静静、平日毫无怪事的宅子有什么关系。只有爱德华不肯罢休。他从一开始就怀疑那个人，现在更始终坚持，我们那位家庭教师虽然只在家里待了短短一阵，这件事却一定是他用什么办法弄出来的。
