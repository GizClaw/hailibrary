audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Olympians
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When I look back at those old days, before the gate closed behind me, I understand something now. Children who had been properly supplied with parents might have seen matters differently. But our nearest grown-ups were aunts and uncles, so perhaps we may be forgiven for the way we thought of them.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They were kind enough about food, clothes, and all the other needs of the body. Beyond that, they showed little interest. I can see now that this came from a certain stupidity, and from the ordinary adult belief that a child is merely an animal. I noticed that stupidity very early. I did not hate it. I simply recognized that it existed, and that it had enormous power in the world.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At the same time, I began to feel that some vague power ruled over us. It was wilful, unpredictable, and always doing strange things for no better reason than that it chose to. One of its oddest choices was to put those hopeless, incapable creatures in command of us. Surely it would have made far more sense to put us in command of them.
        - id: ch01-b04
          speaker: narrator
          text: >-
            These elders were our betters only because chance had made them older. We did not respect them. We envied their good fortune, and we pitied them because they had no idea how to use it. That was perhaps the most hopeless thing about them, whenever we bothered to think about them, which was not often. They had complete freedom to enjoy life, yet they got no pleasure from it.
        - id: ch01-b05
          speaker: narrator
          text: >-
            They could have spent the whole day dabbling in the pond. They could have chased the chickens or climbed trees in their very best Sunday clothes. They could walk out in broad daylight and buy gunpowder. They were free to fire cannons and explode mines on the lawn. Yet they never did any of it. No irresistible force dragged them to church on Sundays, either. Still, they went willingly every week, though they appeared to enjoy it no more than we did.
    - id: ch02
      title: The World They Could Not See
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Taken altogether, the Olympians seemed to have no real interests. They moved slowly, stayed within narrow limits, and followed the same senseless habits again and again. They could see appearances, but nothing beyond them.
        - id: ch02-b02
          speaker: narrator
          text: >-
            To them, the orchard was simply a place that produced a certain number of apples and cherries. When nature failed to provide the expected fruit, they often blamed us. They never understood that the orchard was wonderful and haunted by elves. They never entered the fir wood or the hazel copse, and they never dreamed of the marvels hidden there.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The mysterious springs that fed the duck pond might have been the ancient sources of the Nile, but the Olympians felt no magic in them. They knew nothing of the Indians all around us. They paid no attention to bison or to pirates carrying pistols, though the whole place swarmed with such signs and wonders. They had no wish to search for robbers' caves or dig for buried treasure. Perhaps one of their finest qualities was that they spent most of their time shut up indoors.
        - id: ch02-b04
          speaker: narrator
          text: >-
            There was one exception. The curate could hear, without the smallest flinch, that the meadow beyond the orchard was a prairie filled with herds of buffalo. We loved to ride those buffalo down in our moccasins, waving tomahawks and giving the blood-scenting whoops of the hunt.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The curate never laughed at us or sneered, as the Olympians would have done. He had a serious turn of mind, and he offered so many useful suggestions about hunting this particular kind of large game that we reached an obvious conclusion. A man could hardly have attained his mature age and important position without practical experience of the buffalo in its native home.
        - id: ch02-b06
          speaker: narrator
          text: >-
            At the shortest notice, he was also willing to become a hostile army or a band of marauding Indians. In short, he was a distinctly able man. As far as we could judge, his talents rose far above those of most grown-ups. I hope he has become a bishop by now. We knew he had every necessary qualification.
    - id: ch03
      title: Visitors from the Clouds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Sometimes these strange people received visitors. The visitors were stiff, colourless Olympians just like them, with the same lack of lively interests or sensible pursuits. They seemed to emerge from the clouds. After a while they vanished again, returning somewhere beyond our knowledge to drag out their aimless lives.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Whenever visitors appeared, brute force followed. We were captured, washed, and pushed into clean collars. As usual, we submitted without a word. We felt more contempt than anger.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Soon our hair was sleek with oil, and our faces were fixed in the proper sort of grin. We sat there listening to the familiar empty remarks. We could never understand how reasonable people could spend their precious time in such a way.
        - id: ch03-b04
          speaker: narrator
          text: >-
            At last we were released. Away we bounded to the old clay pit to make pots, or into the hazels to hunt bears. That was where life was waiting.
    - id: ch04
      title: The Real Business of Life
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The Olympians gave us fresh cause for wonder at mealtimes. They would talk straight over our heads about some social or political foolishness. They seemed to believe those pale shadows of reality were among the important things in life.
        - id: ch04-b02
          speaker: narrator
          text: >-
            We enlightened ones ate in silence, with our minds crowded by plans and conspiracies. We could have told them what real life was. We had left it just outside, and every part of us burned to return to it.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Of course, we did not waste that revelation on the Olympians. Long experience had proved there was no use giving them our ideas. The children stood together in thought and purpose. We were joined by our need to fight one hostile fate, a power forever set against us, a power we lived to escape. We trusted no one but one another.
        - id: ch04-b04
          speaker: narrator
          text: >-
            That strange, bloodless order of grown-ups was farther from us than the friendly animals who shared our natural life in the sun. And a lasting sense of injustice made the distance greater. The Olympians would never defend their actions, withdraw a charge, or admit that they were wrong. Nor would they accept the same concessions when we offered them.
    - id: ch05
      title: Could I Be an Olympian?
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Once, for example, I threw the cat from an upstairs window. I bore the cat no ill will, and the fall did not hurt it. After thinking for a moment, I was ready to admit that I had been wrong, as a gentleman should. Was that allowed to settle the matter? It was not.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Then there was Harold. He was locked in his room for an entire day because someone accused him of attacking a neighbour's pig. Harold would have scorned such an act. He and that particular pig were on the friendliest terms.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The Olympians eventually discovered the true culprit, but they offered no generous word of regret. What troubled Harold was not the imprisonment itself. With help from his allies, he soon escaped through the window. He returned only in time to be officially released.
        - id: ch05-b04
          speaker: narrator
          text: >-
            No, what troubled him was the Olympian habit. One word would have put everything right. Naturally, that word was never spoken.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Well, the Olympians have all passed away now. Somehow the sun does not seem to shine as brightly as it once did. The endless meadows of long ago have shrunk to a few poor acres.
        - id: ch05-b06
          speaker: narrator
          text: >-
            A sad doubt comes creeping over me, dull and uneasy. I, too, once lived in Arcady.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Can it be that I have become an Olympian too?
