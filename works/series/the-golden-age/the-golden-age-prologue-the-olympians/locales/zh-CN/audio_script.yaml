audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 门关以前
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 如今回头望去，望向那扇童年之门还没有在身后关上的日子，我才明白，有称职父母陪伴的孩子，看见的也许会是另一番景象。可我们身边最亲近的长辈只有叔叔姑妈，所以，也该容我们另有一种看法。他们照料我们的吃穿，倒还算和善。除此以外，他们对我们并不上心。他们有一种愚钝的成见，认定孩子不过是小动物。我很小就看出了这种愚钝，也看出了它在世上势力惊人。那时我并不怨恨，只是冷静地瞧着。我还隐约觉得，冥冥中仿佛有一股任性又古怪的力量，像卡利班所猜想的塞提波斯，专爱心血来潮，偏偏就要这样。它居然把管束我们的权力交给这些无能的家伙。照理说，让我们来管他们，不是合理得多吗？这些长辈只因命运的一次捉弄，就成了我们的上位者。我们不敬重他们，只嫉妒他们运气好，又可怜他们不会享用好运。
        - id: ch01-b02
          speaker: narrator
          text: 其实，我们很少肯费神去想他们。最叫人绝望的是，他们明明可以随意享受人生，却一点也不懂得享受。他们可以整天在池塘里玩水，可以追小鸡，也可以穿着最不适合爬树的星期日礼服往树上爬。他们还能大白天出门买火药，在草坪上放炮、炸地雷。这些事没有一样不自由，他们却一样也不做。星期日里，也没有一股不可抗拒的力量拖他们去教堂。他们偏偏每周都自愿前往，而且看起来并不比我们快活。
    - id: ch02
      title: 他们看不见的世界
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 总而言之，这些奥林匹斯神的生活毫无趣味。他们走得慢，活动的地方小，习惯刻板，又没有道理。他们只看得见事物的表面。果园明明是精灵出没的神奇地方，在他们眼里，却只是结苹果和樱桃的地方。大自然偶尔不肯结果，他们还常把过错推给我们。他们从不走进冷杉林和榛树丛，更想不到里面藏着多少奇迹。鸭池的水从神秘的源头流来，像古老尼罗河的源头一样难以寻觅，可他们感受不到半点魔力。
        - id: ch02-b02
          speaker: narrator
          text: 他们不知道附近有印第安人，也不在乎野牛，更不关心带着手枪的海盗。可这些不同寻常的踪影，明明遍地都是。他们既不寻找强盗的洞穴，也不挖掘地下的宝藏。也许，他们最大的好处之一，就是大部分时候都闷在屋里。
    - id: ch03
      title: 一个例外
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不过，有个人是例外，那位副牧师。你告诉他，果园另一边的草地其实是一片大草原，上面到处都是成群的野牛，他听了连眼睛也不眨。我们穿着鹿皮鞋，拿着战斧，最爱高声喊出发现猎物鲜血时的战号，纵马追赶野牛。他从不学奥林匹斯神发笑讥讽，反而认真得出奇，还会教给我们许多猎取这种大兽的好办法。我们觉得，他若不是亲自到过野牛生活的荒野，对它们十分熟悉，怎么可能活到这样成熟的年纪，又坐上这样显要的位置？
        - id: ch03-b02
          speaker: narrator
          text: 只要稍稍提前告诉他一声，他随时肯扮成一支敌军，或者一队四处劫掠的印第安人。总之，他是个真正能干的人。依我们判断，他的本领远远超过大多数人。我相信，他如今一定已经当上主教了。我们早就知道，他拥有主教需要的一切资格。
    - id: ch04
      title: 云里来的客人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 那些古怪的大人偶尔会有访客。来的人和他们一模一样，也是僵硬、苍白的奥林匹斯神。他们没有鲜活的爱好，也从不把心思用在任何明智的追求上。他们从云里冒出来，过一阵又消失，回到我们看不见的某个地方，继续拖着那毫无目的的日子。
        - id: ch04-b02
          speaker: narrator
          text: 每到这时，蛮力就会毫不留情地落到我们身上。我们被抓住，被洗干净，还被硬塞进洁净的硬领里。我们照例默默忍受，心里的轻蔑比愤怒更多。接着，我们顶着抹得油亮的头发，脸上挂着僵硬而合乎礼数的笑，坐在那里听那些说过无数遍的套话。通情达理的人，怎么舍得这样浪费宝贵的时间？我们始终想不通。好不容易冲出门，我们立刻跑去老黏土坑捏陶器，或者钻进榛树丛猎熊。
    - id: ch05
      title: 真正的生活
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 还有一件事，我们怎么想都觉得惊奇。吃饭的时候，这些奥林匹斯神会越过我们的头顶，大谈这个社会问题，争论那个政治问题。他们说的全是空洞无聊的事，却把这些苍白的现实幻影当成人生大事。我们这些看见了真光的人只管默默吃饭，脑中装满计划和密谋。真正的生活是什么，我们本来可以告诉他们。我们刚把它留在门外，心里急得发烫，只想赶快回去。
        - id: ch05-b02
          speaker: narrator
          text: 当然，我们不会把这种启示浪费在他们身上。我们早就知道，把想法说给他们听没有用。我们想法一致，目标也一致。命运永远和我们作对，而我们活着就是要躲开它。正是这种处境把我们联结在一起。除了彼此，我们无人可以交心。那些苍白得没有血色的怪人，离我们实在太远，甚至不如阳光下和我们一同生活的温厚动物亲近。
        - id: ch05-b03
          speaker: narrator
          text: 我们心里还有一份长久的不平，使这道隔阂更加牢固。奥林匹斯神不肯替自己辩解，不肯收回说过的话，也从不承认自己错了。我们肯这样让步，他们却不肯接受。有一次，我把猫从楼上的窗户扔出去。我不是存心害它，猫也没受伤。想了一会儿，我便承认自己做错了。绅士就该这样。可事情就此结束了吗？当然没有。
        - id: ch05-b04
          speaker: narrator
          text: 还有一次，哈罗德被锁在房里一整天，因为有人说他袭击了邻居的猪。可他根本不屑做这种事，他跟那头猪一直要好得很。后来真正的犯人找到了，也没有谁大方地向他道歉。其实，哈罗德最难受的并不是禁闭。他的同盟帮他从窗口逃了出去，他早早就自由了，只在该获准释放的时候赶回房间。他真正在意的，是奥林匹斯神一贯如此。他们只要说一句话，事情就能过去。可是，那句话始终没人说。
    - id: ch06
      title: 阿卡狄亚
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 唉，那些奥林匹斯神如今都已远去。不知为什么，今天的太阳似乎没有从前那么明亮了。从前辽阔得没有道路的草野，也缩成了几英亩可怜的土地。一点伤感的疑惑，一缕沉重的猜想，慢慢爬上我的心头。我也曾在阿卡狄亚。是的，我确实住过那片乐土。难道我也已经变成一个奥林匹斯神了吗？
