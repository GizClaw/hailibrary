cover_prompt: |-
  A wordless cover scene in the English countryside of the late nineteenth century shows three dirty little boys turning a narrow rural stream into a legendary voyage. The eldest boy pushes off a small borrowed wooden rowboat while a smaller boy crouches proudly in the bow as captain and raises a shovel like a heroic paddle, with the third boy leaning eagerly over the gunwale. Their launch upstream is the focal action, and their lively expressions make the ordinary boat feel grand without adding any visible fantasy creatures. Meadow-sweet, dog roses, rushes, hayfields, and willows line the water, with distant haymakers under the summer light. Use a wide child-height view with the stream leading deep into the landscape and generous calm sky at the top. Keep the boys' practical country clothing, the boat, and the rural setting faithful to Britain in the 1890s, with original child-friendly figures independent of any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
