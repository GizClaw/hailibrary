audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective and quietly amused
        timbre: warm and clear
        pace: measured
        pitch: medium-low
    charlotte:
      display_name: Charlotte
      tts:
        delivery: small and dreamily sincere
        timbre: light and youthful
        pace: gentle
        pitch: high
  chapters:
    - id: ch01
      title: A Forest by the Pond
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Rhododendrons crowded down one side of our pond, with all kinds of plants growing thickly along the bank. You could creep through the undergrowth, crouch at the water's edge, and find yourself deep in a tropical forest, as long as your imagination was working properly. Monkeys chattered overhead. Parrots flashed between the branches. Huge strange flowers shone all around, while great unseen beasts pushed and rustled through the leaves. The thought of them moving so close by gave you a delicious thrill.
        - id: ch01-b02
          speaker: narrator
          text: >-
            If you lay with your nose an inch or two above the water, ordinary size soon meant nothing. The bright insects skimming over the pond became terrible sea monsters. Gnats turned into albatrosses. The pond spread into a vast inland sea, wide enough for a navy, and at any moment a sea serpent's hairy head might rise from it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            But you cannot properly play at tropical forests when familiar human voices break in. I had been hoping to see a crocodile seize a tiger while it drank, just as that always seemed to happen in picture books. Then I heard Charlotte chattering nearby. My ancient wilderness vanished at once, and the whole earth returned to its usual size.
    - id: ch02
      title: Charlotte Begins Her Story
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I peered out through the bushes. Charlotte was trotting toward an open patch of lawn across the pond, chatting to herself with a doll under each arm and a worried frown on her face. She leaned both dolls against a handy stump, sat before them, and looked as troubled as a Chancellor on Budget night.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Her two patient victims stared straight ahead. They were Jerry and Rosa. Jerry came from far-off Japan. He had straight black hair, one plain blue cotton garment, and a very bad reputation. His proper name was Jerome, because someone thought he resembled the holy man in a picture on the stairs. In truth, the Western saint and this Eastern sinner shared nothing but a shaved crown.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Rosa was British from her flaxen hair to the sturdy calves she showed so freely. She belonged to that blameless class who have simply not been found out yet. I distrusted Jerry at once. Mischief seemed to hide in his slanting eyes, and I knew what he could do. Rosa sat primly upright, gazing dreamily into the treetops, but her neat little mouth looked almost too proper, and her eyes glittered oddly.
        - id: ch02-b04
          speaker: charlotte
          text: >-
            Now I'll start where I stopped before, and you must listen. Getting a story before bed is a special treat. Well, the White Rabbit hurried down the passage, and Alice hoped he'd come back because he had a waistcoat, and her flamingo flew up a tree. But that part comes later, so wait. Oh, where was I?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Charlotte had ignored every pause as she spoke, thumping the grass with her fist in her excitement. Jerry stayed still only until her story was moving nicely. Then he slowly began to lean toward Rosa. His head dropped onto her plump shoulder and made her start nervously.
        - id: ch02-b06
          speaker: charlotte
          text: >-
            Oh, Jerry! If you won't behave, how am I ever going to tell you my story?
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: >-
            Charlotte grabbed him and shook him hard. Jerry's face showed nothing but wounded innocence. He seemed to say that she could blame the everlasting law of gravity if she wished, but not a helpless puppet who was both an orphan and a stranger in the land.
    - id: ch03
      title: Jerry's Designs
      blocks:
        - id: ch03-b01
          speaker: charlotte
          text: >-
            Now I'll go on. Alice finally got into the garden. I've skipped a lot, but you won't mind. I'll tell you that another time. Everyone was playing croquet, and that's when the flamingo came in. Then the Queen cried, "Off with her head!"
        - id: ch03-b02
          speaker: narrator
          text: >-
            At that very moment, Jerry folded forward suddenly and completely, with his bald head between his knees. Charlotte was not so angry this time. The sudden tragedy in the tale had plainly been too much for the poor fellow. She straightened him, wiped his nose, and tried him in several different positions. He refused to settle into any of them, so she finally propped him against the shoulder of the apparently unconscious Rosa.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Then I understood the full depth of Jerry's wickedness. This was what he had planned all along. The fellow had designs on Rosa, and I meant to watch him closely.
        - id: ch03-b04
          speaker: charlotte
          text: >-
            If you'd been in that garden and fallen over when the Queen said, "Off with his head," she really would have taken your head off. But Alice wasn't like you. She told them she wasn't afraid because they were only a pack of cards. Oh, dear, I'm at the end already, and I'd hardly started! My stories never last long enough. Never mind. I'll tell you another one.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Jerry did not care how long the stories lasted now that he had got what he wanted. He nestled against Rosa's plump body with a foolishly satisfied look. One arm had vanished. Was it around her waist? Rosa's natural blush seemed darker, and her head tilted shyly. It must have been.
        - id: ch03-b06
          speaker: charlotte
          text: >-
            If it weren't nearly bedtime, I'd tell you a lovely story with a bogy. But you'd be scared and dream about bogies all night. So I'll tell you one about a White Bear instead. You mustn't scream when the bear says, "Wow," the way I used to, because he's really a good bear.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Before she could go farther, Rosa fell flat on her back in the most complete of faints. Her arms and legs were stiff, and her eyes looked glassy. What had Jerry done? It must have been dreadful to upset her so badly. Charlotte hurried to comfort Rosa while I studied him. He appeared to be whistling and admiring the view. I almost wished I could keep my face as innocent as Jerry did. Then I might never be caught at anything.
    - id: ch04
      title: Punishment at the Stump
      blocks:
        - id: ch04-b01
          speaker: charlotte
          text: >-
            This is all your fault, Jerry. Rosa is as good as gold unless you make her naughty. I'd put you in the corner, but a stump hasn't got a corner. I wonder why. I thought everything had corners. Well, you can sit facing the wall instead. There. Now sulk as much as you like!
        - id: ch04-b02
          speaker: narrator
          text: >-
            Once Rosa had been brought back to consciousness, Charlotte turned Jerry toward the stump. For a moment, he seemed caught between two delights. He could indulge in an injured sulk, or answer the commanding call of the beauty waiting beside him. Passion carried him away. He toppled sideways across Rosa's lap, one stiff arm raised in a grand declaration of love, while his pleading face begged her to answer him. Rosa hesitated, wavered, and then gave in, crushing his slight body beneath the full weight of her surrender.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Charlotte had endured a great deal, but even her patience had limits. She tore Jerry from his lawless embrace and turned him facedown across her knee. What followed was an insult to the whole superior sex, carried out upon poor Jerry. It hurt too much to watch. I turned away, but the sharp slaps still reached my tingling ears.
        - id: ch04-b04
          speaker: narrator
          text: >-
            When I looked again, Jerry sat upright as before. His blue garment was a little rumpled but back in place, and his pale face had gone hard. I knew all too well what a volcano of shame and anger must be boiling under that blank expression. For a moment, I felt sorry for him.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Rosa still hid her face in her dress. Perhaps she was ashamed. Perhaps she grieved over Jerry's suffering. The heartless Japanese doll never once looked at her. His own heart was bitter. He had only followed his natural feelings, but they had struck against convention, and now the sunny world looked black.
        - id: ch04-b06
          speaker: charlotte
          text: >-
            If you'll tell me you're sorry, Jerome, then I'll say I'm sorry too.
          emotion: calm
        - id: ch04-b07
          speaker: narrator
          text: >-
            Even Charlotte had softened at the sight of his stiff misery. But Jerry only let his shoulders sink against the stump and stared toward his beloved Japan. There, love was no sin, and no one had yet invented smacking. Why had he ever left? He would return tomorrow. Yet one more grievance stood in his way. Nature had given Jerry a graceful body, a handsome face, and a sensitive soul, but somehow it had forgotten to give him the power to move.
    - id: ch05
      title: The Black Man Gets Jerry
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Behind me, the bushes began to crackle. Quick, sharp pants sounded like a small steam engine. Rollo, the black retriever, had been released from his chain by some friendly hand. He burst through the undergrowth, delighted to be free and searching for company that suited him.
        - id: ch05-b02
          speaker: narrator
          text: >-
            I gladly called to him to stop and play the panther. Rollo raced around the pond instead. He knocked Charlotte over with one wild greeting, caught Jerry around the middle, and vanished down the drive with him.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Charlotte stormed after the swift-footed punisher, panting as she ran. Rosa lay behind, rumpled and robbed of consciousness. Jerry stretched his helpless arms toward heaven as Rollo carried him away. I almost imagined I heard him beg for mercy and make a late promise that he would change his ways. But his chance had passed.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Black Man had caught Jerry at last, and there was no rescuing him now. A tender person might feel a tear rise at the sight. But no one who truly knew Jerry and all his wicked ways could deny that he had met a just fate.
