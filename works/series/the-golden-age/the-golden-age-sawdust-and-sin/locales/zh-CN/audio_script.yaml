audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 认真敏感，抱怨时直率，想象中带着谨慎
        timbre: 清亮稚嫩
        pace: 自然偏快，犹豫时放慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 池塘边的热带森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们家池塘的一边，杜鹃花一直长到水边，岸上的草木也挤得蓬蓬乱乱。只要钻进矮树丛，蹲在水边，再带上一点运转正常的想象力，转眼就到了热带森林深处。
        - id: ch01-b02
          speaker: narrator
          text: 头顶的猴子吱吱喳喳，鹦鹉从一根树枝闪到另一根。四周开着奇异的大花，看不见的巨兽推开草木，窸窸窣窣地走过，听得人浑身一阵痛快的战栗。
        - id: ch01-b03
          speaker: narrator
          text: 要是趴下来，把鼻尖凑到离水面一两英寸的地方，东西原本的大小很快就全乱了。水面上闪亮的小虫成了凶恶的海怪，悬在上方的蚊蚋成了信天翁。池塘也伸展开来，变作一片辽阔的内海，足够整支舰队安稳停泊。说不定下一刻，一条海蛇毛茸茸的脑袋就会钻出水面。
        - id: ch01-b04
          speaker: narrator
          text: 可惜，寻常人的说话声一闯进来，热带森林就再也玩不下去了。我正等着看鳄鱼怎样咬住一头前来喝水的老虎。图画书里到处都有这种场面，我当然也该看见才对。
        - id: ch01-b05
          speaker: narrator
          text: 偏偏这时，附近传来夏洛特自言自语的声音。她还是平日那样，一路走，一路说个不停。我的希望一下断了，天地也缩回原来的尺寸。我从灌木后望出去，看见她朝池塘另一边的空草地跑来。她两边胳膊下各夹着一个娃娃，眉头皱得紧紧的。
        - id: ch01-b06
          speaker: narrator
          text: 夏洛特把两个娃娃靠在一个正好可以依靠的树桩上，自己坐到他们面前。她操心得不得了，那副心事重重的样子，活像预算之夜的财政大臣。
        - id: ch01-b07
          speaker: narrator
          text: 两个受难者认命地望着前方，一个是杰里，一个是罗莎。杰里来自遥远的日本，头发又直又黑，只穿一件朴素的蓝棉衣，名声却坏得十分清楚。他本来叫杰罗姆，因为据说长得像楼梯上一幅画里的圣人。可那位西方圣徒和这个东方罪人，除了脑袋都剃得光光的，再没有半点相像。
        - id: ch01-b08
          speaker: narrator
          text: 罗莎则是典型的英国人。亚麻色的头发，壮实的小腿，全都大大方方露在外面。她的品行属于那种还没被人抓到过，所以无可指责的一类。
        - id: ch01-b09
          speaker: narrator
          text: 我从一开始就提防杰里。他闷坐着，斜眼里藏着捣鬼的邪气。我知道他干得出什么，早就嗅到夏洛特要有麻烦。罗莎却不好说。她坐得端端正正，安静地望向远处树梢，好像忘了这个世界。只是她把小嘴抿得太过矜持，眼睛也亮得不大自然。
    - id: ch02
      title: 夏洛特讲故事
      blocks:
        - id: ch02-b01
          speaker: charlotte
          text: 好了，我从上回停下的地方讲。你们可得认真听，睡觉前有人给你们讲故事，这是特别的享受。白兔沿着过道一溜烟跑了，爱丽丝盼着他回来，因为他穿着背心。然后她的火烈鸟飞到树上去了……不对，还没讲到那里，你们等等。我刚才讲到哪儿了？
        - id: ch02-b02
          speaker: narrator
          text: 她越讲越兴奋，顾不得在哪里停顿，还用拳头直捶草地。
        - id: ch02-b03
          speaker: narrator
          text: 夏洛特刚刚讲得起劲，杰里就不肯再老实坐着。他悄悄朝罗莎那边歪，脑袋倒上她丰满的肩膀，吓得她浑身一颤。
        - id: ch02-b04
          speaker: narrator
          text: 夏洛特一把抓起杰里，用力摇了又摇，声音听起来可怜巴巴的。
        - id: ch02-b05
          speaker: charlotte
          text: 哎呀，杰里，你要是不乖，我还怎么给你讲故事呀？
        - id: ch02-b06
          speaker: narrator
          text: 杰里满脸都是受了冤枉的清白。他仿佛在说，太太，您要怪就怪永恒的万有引力吧。可别责备一个无依无靠的木偶，何况他还是个孤儿，又流落在异乡。
        - id: ch02-b07
          speaker: charlotte
          text: 好了，咱们继续。爱丽丝总算进了花园。我漏讲了好多，可你们不会在意，改天再讲。大家都在那里打槌球，这时候火烈鸟就来了。王后大喊：“砍掉她的脑袋！”
        - id: ch02-b08
          speaker: narrator
          text: 听到这里，杰里忽然整个向前倒下，光脑袋夹在两膝中间。夏洛特这次倒不很生气。故事突然变得这样惨烈，显然叫这个可怜人受不住了。
        - id: ch02-b09
          speaker: narrator
          text: 她扶直杰里，替他擦擦鼻子，又换了几个姿势安置他，可他怎么也不肯配合。最后，她只好让他靠在仿佛已经昏过去的罗莎肩上。
        - id: ch02-b10
          speaker: narrator
          text: 我这才全明白了。杰里方才处处捣乱，原来就是为了这一刻。这个家伙别有所图，我决定把他盯紧。
        - id: ch02-b11
          speaker: charlotte
          text: 要是你也在花园里，王后一喊“砍掉他的脑袋”，你就这样扑通倒下，她一定真会砍你的头。可爱丽丝才不是你这样。她只说：“我不怕你们，你们不过是一副纸牌。”
        - id: ch02-b12
          speaker: charlotte
          text: 哎呀，怎么已经到结尾了？我明明才刚开头！我的故事怎么总是这么快就讲完？没关系，我再讲一个。
    - id: ch03
      title: 杰里的图谋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 杰里已经达成心愿，故事还能不能讲下去，他才不在乎。他依偎着罗莎丰润的身子，脸上那副满足相，傻得简直没救了。
        - id: ch03-b02
          speaker: narrator
          text: 他还有一条胳膊看不见了。是不是搂住了罗莎的腰？罗莎脸上的红晕比平常更深，头也羞答答地低下去。不错，那条胳膊准在她腰上。
        - id: ch03-b03
          speaker: charlotte
          text: 要不是快到你们睡觉的时候，我就讲一个有妖怪的好故事。可你们会吓坏，还会整夜梦见妖怪。我还是讲白熊吧。不过熊叫“哇呜”的时候，你们不能像我以前那样尖叫，因为他其实是头好熊……
        - id: ch03-b04
          speaker: narrator
          text: 罗莎忽然直挺挺地仰面倒下，昏得彻彻底底。她四肢僵硬，两眼像玻璃一样呆。杰里究竟干了什么？一定坏透了，不然罗莎怎么会这样。
        - id: ch03-b05
          speaker: narrator
          text: 夏洛特赶去安慰那位小姐，我留下来仔细盯着杰里。他好像正吹着一支小曲，悠闲地打量周围的风景。我不免有些遗憾，要是我也能像他这样管住脸上的神色，做什么坏事都不会被发现。
        - id: ch03-b06
          speaker: narrator
          text: 等罗莎醒过来，夏洛特便责备起罪魁祸首。
        - id: ch03-b07
          speaker: charlotte
          text: 都是你的错，杰里。罗莎本来好得像金子，只有你才会把她带坏。我该罚你站墙角，可树桩偏偏没有墙角。为什么没有呢？我还以为什么东西都有角。
        - id: ch03-b08
          speaker: charlotte
          text: 算了，你就脸朝墙坐好。对，就是这样。现在你想怎么生闷气都行！
        - id: ch03-b09
          speaker: narrator
          text: 杰里犹豫了片刻。他可以满怀委屈，尽情享受赌气的快乐。可就在身边，美人正在等他追求，那召唤又实在无法抗拒。
        - id: ch03-b10
          speaker: narrator
          text: 最后，激情把他卷走了。他侧身倒进罗莎怀里，一条胳膊僵直地指向上方，仿佛正在热烈起誓。那张多情的脸满是恳求。罗莎先是迟疑，接着动摇，终于屈服。她整个丰满的身躯压下来，把杰里单薄的身体压在下面。
    - id: ch04
      title: 罪过与惩罚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 夏洛特已经忍耐了许多，可连她的耐性也不能这样任人糟蹋。她从那无法无天的拥抱里揪出杰里，把他翻过来，按到自己膝盖上。
        - id: ch04-b02
          speaker: narrator
          text: 接下来的暴行，落在杰里这个不幸的代表身上，却侮辱了整个高贵的男性，实在叫人不忍目睹。我把脸转开了，耳朵却仍火辣辣地听见一下又一下清脆的拍打声。
        - id: ch04-b03
          speaker: narrator
          text: 再看时，杰里已经照原样坐好，揉皱的衣裳也归了位，只是苍白的面孔绷得很硬。我太了解他了。在那张毫无表情的脸下面，激情和羞耻一定像火山般翻腾。那一刻，我甚至有点可怜他。
        - id: ch04-b04
          speaker: narrator
          text: 罗莎还把脸埋在裙子里。也许她感到羞愧，也许她正为杰里的苦难伤心。可这个无情的日本人看都不看她。他满心苦涩，只不过顺从了自己的天性，却一头撞上世俗规矩，这才知道规矩有多硬。阳光明亮的世界，从此在他眼里全黑了。
        - id: ch04-b05
          speaker: narrator
          text: 夏洛特看着他僵在那里受苦，也有些心软了。
        - id: ch04-b06
          speaker: charlotte
          text: 杰罗姆，只要你肯说你错了，我也会说我错了。
        - id: ch04-b07
          speaker: narrator
          text: 杰里只把双肩靠上树桩，朝亲爱的故乡日本望去。那里，爱不是罪过，也还没人发明打屁股。他当初为什么要离开？明天就回去吧。
        - id: ch04-b08
          speaker: narrator
          text: 可这件事也有难处，又让他多了一桩委屈。大自然给了杰里漂亮的体态、俊俏的脸蛋，还有一颗敏感的心，却不知为什么，唯独忘记给他自己走动的本领。
    - id: ch05
      title: 黑煞星来了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 就在这时，我背后的灌木噼啪响起来，还传出一阵又尖又短的喘息，活像一架开动的小蒸汽机。黑色寻回犬罗洛被哪个善心人解开了锁链，一头冲过矮树丛，四处寻找合得来的玩伴。
        - id: ch05-b02
          speaker: narrator
          text: 我高兴地叫住罗洛，想请他扮一头黑豹。可他绕着池塘飞奔过去，先热烈地亲昵夏洛特一下，把她撞倒在地，随后一口叼住杰里的腰，沿车道跑得没影了。
        - id: ch05-b03
          speaker: narrator
          text: 夏洛特气得发狂，喘着气追赶那个飞毛腿的罪恶复仇者。罗莎衣裳凌乱地躺在地上，已经不省人事。杰里无助地向天空张开双臂。我几乎听见他求饶，听见他迟迟才许下改过的诺言。
        - id: ch05-b04
          speaker: narrator
          text: 可一切都晚了。黑煞星到底还是抓住了杰里。想到这里，同情的泪也许会润湿眼睛。不过，真正了解他的人，谁也不能否认，这个下场实在公道。
