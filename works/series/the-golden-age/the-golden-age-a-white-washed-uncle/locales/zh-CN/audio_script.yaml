audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 带着温和反讽与淡淡怀旧的讲述
        timbre: 温暖清朗，略带成熟后的沉思
        pace: 从容舒展，笑意处轻快，结尾放缓
        pitch: 中低
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 认真敏感，抱怨时直率，想象中带着谨慎
        timbre: 清亮稚嫩
        pace: 自然偏快，犹豫时放慢
        pitch: 中高
    edward:
      display_name: 爱德华
      tts:
        delivery: 好胜大胆，夸口时神气十足，玩闹时投入
        timbre: 明亮有力的少年声
        pace: 轻快，得意时加速
        pitch: 中
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真笃定，思考时一本正经，带着朴素幽默
        timbre: 柔和稚嫩的男孩声
        pace: 稍慢，句间有思索感
        pitch: 中高
    selina:
      display_name: 塞琳娜
      tts:
        delivery: 直率泼辣，认错时真诚而容易激动
        timbre: 清脆明亮的女孩声
        pace: 自然偏快，哭诉时断续
        pitch: 中高
    uncle_william:
      display_name: 威廉叔叔
      tts:
        delivery: 局促紧张，努力显得亲切，私下说话干脆慌乱
        timbre: 厚实温和的年长男声
        pace: 略慢，紧张时停顿，催促时加快
        pitch: 中低
  chapters:
    - id: ch01
      title: 叔叔们的审判
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们小小的生活里，又有叔叔从城里来，便是件大事。因为他虽不知情，品性和本领却要交给我们仔细评判。先前几位叔叔都上过天平，可惜分量远远不够。
        - id: ch01-b02
          speaker: narrator
          text: 托马斯叔叔从一开始就失败了。他并非心肠坏，也不是举止不体面。他只是认定，孩子活着，就是为了给大人那些没意思的笑话当靶子。那些话每次说完都有大笑跟着，想来原本确实是要当笑话的。
        - id: ch01-b03
          speaker: narrator
          text: 我们很想让他受到绝对公正的审判。早餐后、上课前，大家聚在工具房，把他的俏皮话一条条拿出来，冷静、审慎又不偏不倚地讨论检验。可里面一点趣味也没有。他自己也没说还有别的本领，唯有真正的幽默才能救他。我们只好很不情愿地判他是个无可救药的冒牌货。
        - id: ch01-b04
          speaker: narrator
          text: 最年轻的乔治叔叔起初更有希望。他兴冲冲陪我们到处巡视，认识每一头母牛，还郑重向猪伸出友谊的手。他甚至暗示，也许哪天会有一对红眼睛的喜马拉雅兔，忽然从城里送来。
        - id: ch01-b05
          speaker: narrator
          text: 这片土壤看着如此肥沃，我们正考虑，要是不经意说说豚鼠或雪貂的可靠长处，说不定也能开花结果。偏偏家庭女教师斯梅德利小姐来了。乔治叔叔立刻起了彻底而可鄙的变化。他对正经话题的兴趣，就像病弱泉水的脉搏，慢慢衰退、消沉下去。
        - id: ch01-b06
          speaker: narrator
          text: 斯梅德利小姐说是来带塞琳娜散步，可我敢保证，塞琳娜那一上午都和守猎人的儿子还有我一起掏老鼠窝。真陪斯梅德利小姐散步的人，看来只有乔治叔叔。
        - id: ch01-b07
          speaker: narrator
          text: 他的行为虽卑劣，我们却没有草率定罪，而是从各个方面讨论这场背叛。最后只能痛心地承认，这位叔叔天生品性不好，还爱结交低等人物。我们天天跟斯梅德利小姐相处，对她早已了如指掌。她既没才艺，也没魅力，浑身唯一的特色，就是性情里根深蒂固的凶恶。
        - id: ch01-b08
          speaker: narrator
          text: 她倒是能背出历任英王的年代。可乔治叔叔已经进了军队，早就升到不需要实用知识的境界了，这有什么用？反过来，我们的弓箭随时任他拿。一个军人面对这样的选择，根本不该有一刻犹豫。于是大家一致判乔治叔叔堕落了。喜马拉雅兔始终没有送来，又往他的棺材上钉了一颗钉子。
        - id: ch01-b09
          speaker: narrator
          text: 那阵子，叔叔这种货色既滞销又没生气，我们也没有多少兴致再做这门买卖。不过，大家还是同意，刚从印度回来的威廉叔叔该得到和其他人一样公正的机会。毕竟，一个曾把绚烂东方握在手里的人，身上说不定藏着许多浪漫的可能。
    - id: ch02
      title: 威廉叔叔受审
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我刚在走廊里和塞琳娜扭打过。她不愧是个女孩子，一脚踢中我的小腿。我一只手还揉着腿，另一只手已经被这位等候我们审核、还不知能否过关的叔叔握住了。
        - id: ch02-b02
          speaker: narrator
          text: 他年纪不轻，面色红润，显然紧张得很。他有气无力地握过我们一只只脏手，又依次把手放开。接着，他涨红了脸，笨拙地勉强装出一副热情的样子。
        - id: ch02-b03
          speaker: uncle_william
          text: 呃，你们……你们都好吗？见到我高兴吧？
        - id: ch02-b04
          speaker: narrator
          text: 才刚见面，照理说谁也不能指望我们已经对他形成看法。我们只能默默地彼此对望，场面不但没有缓和，反而更僵。威廉叔叔住在家里的那段时间，这片阴云始终没有真正散去。
        - id: ch02-b05
          speaker: narrator
          text: 后来大家谈起这件事，有人猜，他从前一定犯过一桩惊天大罪。我却怎么也不能相信。这个人显然过得不快活，可不像真犯过什么罪。我有一两次撞见他满怀善意地望着我们。他一发现自己被人瞧见，就红着脸转开了头。
        - id: ch02-b06
          speaker: narrator
          text: 那股令人压抑的气息终于离开后，我们垂头丧气地聚进马铃薯地窖。除了奉命陪这位亲戚去车站的哈罗德，其他人全都到了。众人的意见完全一致，威廉绝不能以叔叔的身份过关。
        - id: ch02-b07
          speaker: selina
          text: 他就是头畜生！连半天假都没替我们争取到。
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 除了宣判，看来也没有别的事可做。大家正要表决，哈罗德忽然来了。他脸通红，眼睛睁得滚圆，神情神秘，仿佛带来了可怕的大事。
        - id: ch02-b09
          speaker: narrator
          text: 他一声不响地站了一会儿，慢慢把手伸出灯笼裤口袋。那只脏手摊开来，上面是一枚、两枚、三枚、四枚半克朗硬币！我们看呆了，屏住呼吸，谁也说不出话。我们从没一次见过这么多金银财宝。
    - id: ch03
      title: 四枚半克朗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 接着，哈罗德说出了事情的经过。
        - id: ch03-b02
          speaker: harold
          text: 我把那老家伙送到车站。一路上，我把站长家里的事都讲给他听。我还告诉他，我看见搬运工亲了我们家的女仆。那人特别好，一点架子都没有，也不装模作样。凡是我觉得有意思的，我全说了。
        - id: ch03-b03
          speaker: harold
          text: 可叔叔好像没怎么听，只顾边走边抽雪茄。有一回，我听见他好像说了句话。我不能肯定，不过我觉得他说的是……
        - id: ch03-b04
          speaker: uncle_william
          text: 谢天谢地，总算熬过去了！
        - id: ch03-b05
          speaker: harold
          text: 到了车站，他忽然停住，让我等一等。然后他慌慌张张地把这些塞进我手里，又说……
        - id: ch03-b06
          speaker: uncle_william
          text: 听着，小伙子！这些给你和另外几个孩子。爱买什么就买什么，尽管把自己惯成一群小坏蛋。可别告诉家里的大人，记住了！现在快回家去！
        - id: ch03-b07
          speaker: harold
          text: 所以我就跑回来了。
        - id: ch03-b08
          speaker: narrator
          text: 整个集会陷入庄严的寂静，最后还是小小的夏洛特先开口。
        - id: ch03-b09
          speaker: charlotte
          text: 我从来不知道，世界上还有这么好的人。我希望他今晚就死掉，那样他就能直接上天堂了！
        - id: ch03-b10
          speaker: narrator
          text: 塞琳娜后悔极了，又哭又抽噎，谁也劝不住她。她先前一时性急，竟把这位灵魂洁白的亲戚叫成了畜生。
    - id: ch04
      title: 花斑猪的新名字
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 爱德华一向足智多谋。眼前有局面需要应付，他照例马上挺身而出。
        - id: ch04-b02
          speaker: edward
          text: 我知道该怎么办。那头花斑猪还没有名字，我们就拿威廉叔叔的名字给它命名。这样他就会知道，我们很后悔先前看错了他！
        - id: ch04-b03
          speaker: harold
          text: 可我……我今天早上已经给那头猪命过名了。我用助理牧师的名字给它命了名。实在对不起。
        - id: ch04-b04
          speaker: harold
          text: 昨晚你们都被早早赶去睡觉以后，助理牧师来过，还向我鞠了一躬。我也不知道怎么回事，当时就觉得非这样做不可！
        - id: ch04-b05
          speaker: edward
          text: 那不能算，因为我们当时没有全到场。把那次命名取消，改叫它威廉叔叔。助理牧师的名字，你留给下一窝小猪吧！
        - id: ch04-b06
          speaker: narrator
          text: 这项动议没有经过表决便获通过。于是，全院转入拨款委员会。
