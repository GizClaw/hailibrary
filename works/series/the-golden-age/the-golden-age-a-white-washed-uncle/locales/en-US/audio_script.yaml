  chapters:
    - id: ch01
      title: Uncles on Trial
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The day another uncle came down from town was a great event in our small lives. Without knowing it, he would have to present his character and qualifications for our careful judgment. We had tested other uncles before, and sadly, they had failed us badly.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Uncle Thomas had been a failure from the start. He was not cruel, and his habits were respectable enough. But he seemed convinced that children existed so grown-ups could aim foolish jokes at them. His loud laughter suggested that these remarks were meant to be funny.
        - id: ch01-b03
          speaker: narrator
          text: >-
            We wanted to judge him fairly. Between breakfast and lessons, we met in the tool-house and examined every one of his jokes with perfect calm. It was no use. We could find nothing funny in any of them. Humour was the only gift he claimed to possess, so we reluctantly wrote him down as a hopeless impostor.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Young Uncle George looked much more promising. He cheerfully toured the whole place with us. He met each cow, offered the pig his hand in friendship, and even hinted that two pink-eyed Himalayan rabbits might one day arrive unexpectedly from town. We began to wonder whether a casual word about the solid virtues of guinea pigs or ferrets might produce equally fine results.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Then our governess appeared, and Uncle George changed at once. It was a complete and contemptible transformation. His interest in sensible subjects weakened like a failing pulse and drained away. Miss Smedley was supposed to take Selina for her usual walk. I can swear that Selina spent the morning hunting rats with the keeper's boy and me. If Miss Smedley walked with anyone, it seems to have been Uncle George.
    - id: ch02
      title: Uncle George Falls from Grace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Shameful as his conduct was, we did not condemn him hastily. We discussed his desertion from every possible side before reaching our judgment. In the end, the sad truth seemed clear. This uncle had some natural badness in him, along with a taste for low company.
        - id: ch02-b02
          speaker: narrator
          text: >-
            We knew Miss Smedley through daily experience. She had no talents or charms at all, only a thoroughly vicious temper. True, she could recite the dates of the English kings. But Uncle George was in the army and had risen beyond any need for useful knowledge.
        - id: ch02-b03
          speaker: narrator
          text: >-
            We, on the other hand, had freely offered him our bows and arrows. A soldier should not have needed a moment to choose. Uncle George had fallen from grace, and every one of us condemned him. When the Himalayan rabbits never arrived, that drove one more nail into his coffin.
        - id: ch02-b04
          speaker: narrator
          text: >-
            At that time, then, uncles were a dull and worthless market, and we had little desire to deal in another. Still, we agreed that Uncle William must have the same fair trial as the rest. He had just returned from India, after all. To us, a man who had held the gorgeous East in his hands might contain any number of romantic possibilities.
    - id: ch03
      title: Uncle William Comes to Stay
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            During a scuffle in the passage, Selina had kicked my shins, as a girl would. I was still rubbing them with one hand when I found Uncle William halfheartedly shaking the other. He was an elderly man with a red face, and he was plainly nervous. One by one, he dropped our dirty hands. Then he turned even redder and tried to sound friendly.
        - id: ch03-b02
          speaker: uncle_william
          text: >-
            Well, how are you all? Glad to see me, eh?
        - id: ch03-b03
          speaker: narrator
          text: >-
            It was much too early for us to have formed a fair opinion of him, so we could only look at one another without speaking. We could hardly claim to be glad before his trial had properly begun. Our silence did nothing to ease the strain. In fact, the cloud over us never really lifted while he stayed.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Later, someone suggested that Uncle William must once have committed some enormous crime. I could not quite believe it. He was clearly unhappy, but he did not seem guilty of anything. Once or twice, I caught him looking at us kindly. The moment he saw that I had noticed, he blushed and turned his head away.
    - id: ch04
      title: Four Half-Crowns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            At last Uncle William's gloomy influence was gone. We met unhappily in the potato cellar, all except Harold, who had been sent to accompany our relative to the station. Everyone agreed that William could not be accepted as an uncle.
        - id: ch04-b02
          speaker: selina
          text: >-
            He's a beast! He didn't even get us a half holiday.
        - id: ch04-b03
          speaker: narrator
          text: >-
            There seemed nothing left to do but pass sentence. Before we could, Harold appeared. His face was red, his eyes were round, and his mysterious manner seemed to warn us of some great and terrible sign. For a while, he stood there without a word. Then he slowly pulled one hand from the pocket of his knickerbockers. On his dirty palm lay one, two, three, four half-crowns.
        - id: ch04-b04
          speaker: narrator
          text: >-
            We stared at them as if enchanted, breathless and unable to speak. Never before had any of us seen such a fortune gathered in one place. Four shining half-crowns lay together on that dirty hand. Then Harold told us what had happened.
        - id: ch04-b05
          speaker: harold
          text: >-
            I took the old fellow to the station. On the way, I told him all about the stationmaster's family. I told him how I'd seen the porter kissing our housemaid, too, and what a good fellow the porter was, without any airs or pretending. I told Uncle William anything I thought might interest him.
        - id: ch04-b06
          speaker: harold
          text: >-
            He didn't seem to listen much. He just walked along, puffing his cigar. Once, I thought I heard him say, "Well, thank God that's over." I'm not certain, but I thought he did.
        - id: ch04-b07
          speaker: harold
          text: >-
            When we reached the station, he stopped all at once and told me to wait. Then he pushed these coins into my hand in a frightened sort of way.
        - id: ch04-b08
          speaker: uncle_william
          text: >-
            Look here, youngster. This is for you and the other children. Buy whatever you like. Make little beasts of yourselves. Just don't tell the old people, mind! Now run along home!
        - id: ch04-b09
          speaker: harold
          text: >-
            So I ran.
    - id: ch05
      title: A White-Souled Relative
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            A solemn silence settled over us. Little Charlotte was the first to break it.
        - id: ch05-b02
          speaker: charlotte
          text: >-
            I never knew there were such good men anywhere in the world. I hope he dies tonight, because then he'll go straight to heaven!
        - id: ch05-b03
          speaker: narrator
          text: >-
            Selina had repented. She cried and sobbed and would not be comforted, because she had been so quick to call this white-souled relative a beast. Then Edward, our great thinker, rose to meet the moment, as he always did.
        - id: ch05-b04
          speaker: edward
          text: >-
            I know what we'll do. We'll name the piebald pig after him, the one that hasn't got a name. That will show how sorry we are for getting him wrong!
        - id: ch05-b05
          speaker: harold
          text: >-
            I... I named that pig this morning. I named it after the curate. I'm very sorry. But he came and bowed to me last night, after the rest of you had all been sent to bed early. Somehow, I felt I had to do it!
        - id: ch05-b06
          speaker: edward
          text: >-
            Oh, that doesn't count, because we weren't all there. We'll undo that christening and call the pig Uncle William. You can save the curate's name for the next litter!
        - id: ch05-b07
          speaker: narrator
          text: >-
            Everyone agreed without a single vote against it. The piebald pig would be Uncle William, and the curate could wait for the next litter. With the mistake properly repaired, the whole House turned to the important business of deciding how to spend the money.
