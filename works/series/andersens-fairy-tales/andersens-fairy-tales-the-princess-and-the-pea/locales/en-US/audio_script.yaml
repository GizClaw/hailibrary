audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant fairy-tale storytelling
        timbre: clear and gently textured
        pace: measured
        pitch: medium
    princess:
      display_name: Princess
      tts:
        delivery: intelligent, gracious, and decisive
        timbre: polished and clear
        pace: measured
        pitch: medium-high
    queen:
      display_name: Queen
      tts:
        delivery: shrewd, composed, and quietly certain
        timbre: mature and refined
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Real Princess
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a prince who wanted to marry a princess. But she had to be a real princess. He traveled all over the world looking for one. He met plenty of princesses, but he could never be sure they were real. Something always seemed not quite right. At last, he came home again. He was sad, because he wanted a real princess very much.
    - id: ch02
      title: A Knock in the Storm
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One evening, a terrible storm swept in. Thunder crashed, lightning flashed, and rain poured down. Then someone knocked at the city gate. The old king went to open it.
        - id: ch02-b02
          speaker: narrator
          text: A princess stood outside. Good gracious, what the wind and rain had done to her! Water streamed from her hair and clothes. It ran into the toes of her shoes and came out at the heels. Still, she said she was a real princess.
        - id: ch02-b03
          speaker: queen
          text: Well, we will soon see if that is true.
        - id: ch02-b04
          speaker: narrator
          text: The old queen kept that thought to herself. She went into the bedroom, stripped all the bedding from the bed, and placed one pea at the very bottom. Over it, she piled twenty mattresses. Then she stacked twenty eiderdown beds on top of those.
        - id: ch02-b05
          speaker: narrator
          text: The princess had to sleep on that enormous bed all night.
    - id: ch03
      title: The Pea Tells the Truth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In the morning, they asked the princess how she had slept.
        - id: ch03-b02
          speaker: princess
          text: Oh, terribly! I hardly closed my eyes all night. Heaven knows what was in that bed, but I lay on something so hard that I am black and blue all over. It was horrible!
          emotion: disgusted
        - id: ch03-b03
          speaker: narrator
          text: Now they knew she was a real princess. She had felt the pea through twenty mattresses and twenty eiderdown beds. No one but a real princess could be that sensitive.
        - id: ch03-b04
          speaker: narrator
          text: So the prince married her. Now, at long last, he knew for himself that he had found a real princess. The pea was placed in a museum, where you may still see it today, unless someone has stolen it.
        - id: ch03-b05
          speaker: narrator
          text: And there you have it. That is a true story.
