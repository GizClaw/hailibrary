audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉静从容地讲述，奇异处略带惊叹，结尾保持克制
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    tin_soldier:
      display_name: 锡兵
      tts:
        delivery: 年轻而坚定，遇到危险也不失沉着
        timbre: 清亮坚实
        pace: 稍慢
        pitch: 中
    goblin:
      display_name: 黑妖精
      tts:
        delivery: 阴沉挑衅，话里带着威胁
        timbre: 尖细干涩
        pace: 稍慢
        pitch: 偏高
    boy:
      display_name: 男孩
      tts:
        delivery: 天真兴奋，说话干脆直接
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 偏高
    water_rat:
      display_name: 大水鼠
      tts:
        delivery: 粗暴急躁，像个蛮横的守关人
        timbre: 粗哑低沉
        pace: 偏快
        pitch: 中低
    song_voice:
      display_name: 歌声
      tts:
        delivery: 遥远低回，像从水声里传来
        timbre: 空灵朦胧
        pace: 舒缓
        pitch: 中高
    cook:
      display_name: 厨娘
      tts:
        delivery: 朴实爽快，惊讶时直截了当
        timbre: 厚实明朗
        pace: 自然
        pitch: 中
  chapters:
    - id: ch01
      title: 二十五个锡兵
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一把旧锡勺被铸成了二十五个锡兵，所以他们全是亲兄弟。一个个肩扛步枪，望着正前方，红蓝军装神气极了。他们刚来到世上，就听见一个小男孩欢喜地喊起来。盒盖打开了，孩子拍着手，因为这是他的生日礼物。他站在桌旁，把锡兵一个个摆好。二十五个兄弟几乎没有分别，唯独最后铸成的那个只有一条腿。轮到他时，熔化的锡已经不够了。可他只靠一条腿，也照样站得稳稳的，反而成了最引人注目的一个。
        - id: ch01-b02
          speaker: boy
          text: 是锡兵！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 桌上还有许多玩具，最好看的是一座纸城堡。小窗里面能望见一间间屋子。城堡前有树，有一片用镜子当成的清湖，还有蜡做的天鹅浮在湖面，水里映着它们的影子。可这一切，都比不上城堡门口那位纸做的小姑娘。她穿着透明的细纱裙，肩头斜搭一条窄窄的蓝丝带，胸前还别着一朵闪亮的金箔玫瑰，那朵花和她的脸一样大。她是个舞蹈演员，双臂舒展，一条腿高高抬起。锡兵怎么也看不见那条腿，就认定她和自己一样，也只有一条腿。
        - id: ch01-b04
          speaker: tin_soldier
          text: 她正好可以做我的妻子。可她住在城堡里，多么高贵。我却只能住在一只盒子里，还要和二十四个兄弟挤在一起。她不能住那种地方。不过，我总得设法认识她。
        - id: ch01-b05
          speaker: narrator
          text: 锡兵便直挺挺地躺在鼻烟盒后面，从那里望着娇小的舞蹈姑娘。她始终单腿站立，半点也不摇晃。晚上，其他锡兵都回到盒里，屋里的人也睡了。玩具们立刻热闹起来，互相串门，演习打仗，还办起舞会。锡兵们在盒中哗啦作响，也想参加，可他们打不开盖子。胡桃夹子玩跳背，铅笔在桌面蹦来蹦去。响声惊醒了金丝雀，它一开口，说的竟然都是押韵的诗。只有锡兵和舞蹈姑娘没有动。她踮着脚，伸展双臂。他用一条腿站着。他们一样坚定。锡兵一直看着她，一刻也没有移开目光。午夜钟响了十二下，鼻烟盒盖突然弹开。里面没有鼻烟，却跳出一个小小的黑妖精。原来，那是个机关玩具。
        - id: ch01-b06
          speaker: goblin
          text: 锡兵，不属于你的东西，你可别妄想。
        - id: ch01-b07
          speaker: narrator
          text: 锡兵只当没有听见。
        - id: ch01-b08
          speaker: goblin
          text: 好啊，那就等明天再瞧。

    - id: ch02
      title: 从窗口到街沟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天一早，孩子们把锡兵放在窗台上。不知道是黑妖精动了手脚，还是一阵穿堂风吹来，窗户猛地敞开。锡兵从三楼翻着跟头摔到街上，头朝下落进石板缝，头盔和刺刀都卡住了，那条独腿直直翘在空中。女仆和小男孩马上跑下楼找他，却怎么也找不到，有一回甚至险些踩到他。锡兵只要喊一声，事情就好办了。可是他穿着军装，宁可沉默，也不肯开口求救。
        - id: ch02-b02
          speaker: narrator
          text: 一会儿，雨落了下来。雨点越来越急，最后变成倾盆大雨。雨停后，两个男孩正好路过，其中一个看见了倒在地上的锡兵。
        - id: ch02-b03
          speaker: boy
          text: 看，这儿有个锡兵！该给他一条船，让他去航行。
        - id: ch02-b04
          speaker: narrator
          text: 两个男孩用报纸折了条船，把锡兵放进去，让船顺着街沟漂走。他们跟在旁边跑，一边跑一边拍手。刚下过大雨，窄窄的街沟里竟翻起大浪，水流快得惊人。纸船上下颠簸，不时飞快地打转，连锡兵也忍不住发抖。可他仍然挺住了，脸上一点不变，步枪扛在肩头，眼睛只望着前面。

    - id: ch03
      title: 黑暗的水路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 纸船猛地冲进桥下，那里是排水沟的一段。四周一下子黑了，和锡兵住过的盒子没有两样。
        - id: ch03-b02
          speaker: tin_soldier
          text: 这回我要漂到哪里去？一定是那个黑妖精害我。唉，只要小姑娘也在这条船上陪我，再黑也没有什么可怕的。
        - id: ch03-b03
          speaker: narrator
          text: 一只住在排水沟里的大水鼠忽然蹿了出来。
        - id: ch03-b04
          speaker: water_rat
          text: 你的通行证呢？马上拿给我看！
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 锡兵没有回答，只把步枪握得更紧。纸船继续向前，大水鼠就在后面追。它咬着牙，冲沿途的木片和稻草喊叫。
        - id: ch03-b06
          speaker: water_rat
          text: 快拦住他！他没交通行费，也没给我看通行证！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 水流却越来越猛。锡兵已经看见拱洞尽头的日光，这时，前方传来可怕的轰鸣，再勇敢的人听见也会害怕。原来水沟到了隧道尽头，要从高处直落进一条大运河。对锡兵来说，那就像我们面前出现了一道瀑布。他靠得太近，根本来不及停下。纸船一头冲了过去。锡兵把身体挺得笔直，眼睛都不眨一下，不肯让人看出害怕。小船转了三四圈，水灌到船沿，眼看就要沉了。水已经淹到锡兵的脖子，船还在往下坠，湿透的报纸越来越软，越来越松，终于，水没过了他的头。他想起那位再也见不到的舞蹈姑娘。水声里，仿佛传来一支歌。
        - id: ch03-b08
          speaker: song_voice
          text: 永别了，永远勇敢的战士。流水正带着你，漂向自己的坟墓。
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 纸船散了架，锡兵沉入水中，紧接着就被一条大鱼吞了下去。

    - id: ch04
      title: 大鱼带他回家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 鱼肚子里真是黑啊，比隧道更黑，也更加狭窄。锡兵还是没有屈服。他扛着步枪，直挺挺地躺在那里。大鱼一会儿游到这边，一会儿游到那边，折腾得很厉害，后来忽然静止不动。又过了一阵，仿佛一道闪电劈过鱼身，接着，日光透了进来。
        - id: ch04-b02
          speaker: cook
          text: 哎呀，锡兵原来在这里！
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 原来大鱼已经被捉住，送进市场，卖给了厨娘。厨娘拿回厨房，用大刀剖开鱼肚，这才发现锡兵。她用拇指和食指捏着他的腰，把他送到房间里。大家都想看看这个在鱼肚子里旅行过的锡兵，他自己却一点也不骄傲。人们把他放到桌上。世界上的怪事可真不少啊，谁能想得到呢？他竟又回到摔出窗外的那间屋子。孩子们还在那里，玩具们还摆在桌上，那座美丽的城堡也没有变。舞蹈姑娘依然站在门口，一条腿支撑身体，另一条高高抬起。她和锡兵一样坚定。
        - id: ch04-b04
          speaker: narrator
          text: 再见到她，锡兵感动得几乎掉下锡做的眼泪，可他还是忍住了。他望着姑娘，姑娘也望着他。两个人谁都没有说话。

    - id: ch05
      title: 火焰中的锡心
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 忽然，一个小男孩抓起锡兵，把他扔进火炉。他这样做没有半点理由，想来又是鼻烟盒里的黑妖精在作怪。火光照着站在炉中的锡兵，热得可怕。他分不清那股热究竟来自真正的火，还是来自心里的爱情。他军装上的鲜艳颜色已经褪去，却没人说得准，究竟是旅途中的水冲掉了颜色，还是悲伤使它们失去了光彩。
        - id: ch05-b02
          speaker: narrator
          text: 锡兵看着舞蹈姑娘，姑娘也看着他。他已经感觉到自己在熔化，却依旧坚定地站着，肩头仍扛着步枪。房门突然敞开，穿堂风卷起了舞蹈姑娘。她像轻盈的精灵，飘进火炉，正好落在锡兵身旁。火焰立刻吞没了她，她就这样消失了。锡兵也熔成小小的一团。
        - id: ch05-b03
          speaker: narrator
          text: 第二天早晨，女仆清理炉灰，在灰烬里找到一颗小小的锡心。舞蹈姑娘什么也没有留下，只有那朵金箔玫瑰，已经烧得像煤渣一样黑。
