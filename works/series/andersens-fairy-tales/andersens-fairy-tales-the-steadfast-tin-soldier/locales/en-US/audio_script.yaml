  chapters:
    - id: ch01
      title: The Soldier and the Dancer
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There were once twenty-five tin soldiers, all brothers because they had been cast from the same old tin spoon. Each wore a fine red-and-blue uniform, carried a musket on his shoulder, and stared straight ahead. The first words they ever heard came when the lid was lifted from their box. A little boy clapped his hands in delight. The soldiers were his birthday present, and he stood at the table, setting them up one by one.
        - id: ch01-b02
          speaker: little_boy
          text: Tin soldiers!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: All the soldiers looked exactly alike except the last one. There had not been enough melted tin to finish him, so he had only one leg. Even so, he stood just as firmly as the others. That made him the most remarkable soldier of them all.
        - id: ch01-b04
          speaker: narrator
          text: The table was crowded with toys, but a beautiful little paper castle caught the eye first. Its rooms were visible through the tiny windows. In front of it, little trees surrounded a piece of mirror that looked like a clear lake. Wax swans seemed to swim across the water, and their reflections shone beneath them. At the open castle door stood the prettiest sight of all, a tiny paper dancer. She wore a dress of clear muslin and a narrow blue ribbon across her shoulders like a scarf. In front of her glittered a tinsel rose as large as her whole face. Her arms reached out, and one leg rose so high behind her that the soldier could not see it at all. He thought she had only one leg, just like him.
        - id: ch01-b05
          speaker: tin_soldier
          text: She is the one for me. But she lives in a castle, and I share one box with twenty-four brothers. That is no home for her. Still, I have to find a way to meet her.
        - id: ch01-b06
          speaker: narrator
          text: He stretched out behind a snuffbox on the table and peeked at the delicate little dancer. She stayed perfectly balanced on one leg. That evening, the other soldiers went back into their box, and everyone in the house went to bed. Then the toys began their own fun. They visited one another, fought pretend battles, and held balls. The soldiers rattled inside their box, eager to join in, but they could not lift the lid. The nutcrackers played leapfrog. A pencil bounced around the table. The noise woke the canary, and it began talking in poetry.
        - id: ch01-b07
          speaker: narrator
          text: Only the one-legged soldier and the dancer stayed where they were. She remained on tiptoe with her arms and leg stretched out. He stood just as firmly, watching her every moment. At midnight, the clock struck twelve. The lid of the snuffbox sprang open, and up popped a little black goblin. The box was really a toy trick.
        - id: ch01-b08
          speaker: goblin
          text: Tin soldier, stop wishing for someone who does not belong to you.
        - id: ch01-b09
          speaker: narrator
          text: The soldier acted as though he had heard nothing.
        - id: ch01-b10
          speaker: goblin
          text: Fine. Just wait until tomorrow.
    - id: ch02
      title: Out the Window
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, the children put the tin soldier on the windowsill. No one knows whether the goblin caused it or a draft did, but the window suddenly flew open. The soldier tumbled head over heels from the third story into the street below.
        - id: ch02-b02
          speaker: narrator
          text: It was a terrible fall. He landed headfirst with his helmet and bayonet wedged between two paving stones and his one leg pointing into the air. The little boy and the maid hurried straight downstairs to look for him. They searched, but he was hidden so well that once they nearly stepped on him. If he had called, "Here I am," everything would have been all right. But while he wore a uniform, he was too proud to cry out for help.
        - id: ch02-b03
          speaker: narrator
          text: Soon rain began to fall. The drops came faster and faster until a heavy shower poured over the street. When it ended, two boys passed by. One of them spotted the soldier.
        - id: ch02-b04
          speaker: street_boy
          text: Hey, look! A tin soldier. Let's give him a boat to sail in.
        - id: ch02-b05
          speaker: narrator
          text: The boys folded a sheet of newspaper into a boat, set the soldier inside, and launched him down the gutter. Then they ran beside it, clapping their hands. The heavy rain had made the gutter a rushing stream. To the little soldier, the waves looked enormous. They tossed the paper boat up and down and sometimes spun it around so quickly that he trembled. Even then, his face never changed. He kept his musket on his shoulder and looked straight ahead.
        - id: ch02-b06
          speaker: narrator
          text: Without warning, the boat shot beneath a little bridge that covered part of the drain. Everything became as dark as the soldier's old box.
        - id: ch02-b07
          speaker: tin_soldier
          text: Where can I be going now? I am sure that black goblin caused this. If only the little dancer were here in the boat with me, I would not mind the darkness at all.
    - id: ch03
      title: Through the Drain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A great water rat who lived in the drain suddenly appeared.
        - id: ch03-b02
          speaker: water_rat
          text: Where is your passport? Hand it over, right now!
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: The soldier said nothing. He only gripped his musket more tightly. The boat swept on, and the rat chased after it, gnashing his teeth. He shouted at every scrap of wood and straw they passed.
        - id: ch03-b04
          speaker: water_rat
          text: Stop him! Stop him! He never paid the toll, and he did not show his pass!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: But the current rushed faster and stronger, carrying the boat beyond the rat's reach. Ahead, the soldier could already see daylight shining at the end of the arch. Then he heard a terrifying roar, loud enough to frighten the bravest person. The drain emptied into a wide canal over a steep drop. For the little soldier, that drop was every bit as dangerous as a waterfall would be for us.
        - id: ch03-b06
          speaker: narrator
          text: He was already too close to stop. The boat rushed forward while he held himself as stiff as he could. He did not even blink, because he wanted to show no fear. The boat whirled three or four times. Water rose to its rim, and there was no saving it. The soldier stood neck-deep as the boat sank lower. The wet paper softened and came apart. At last, the water closed over his head.
        - id: ch03-b07
          speaker: narrator
          text: He thought of the lovely little dancer he would never see again. In his ears, he heard the words of a song. Farewell, brave warrior. You drift onward toward your grave.
        - id: ch03-b08
          speaker: narrator
          text: The paper boat broke into pieces. The soldier sank beneath the water, and at once a great fish swallowed him.
    - id: ch04
      title: Home Again
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Inside the fish, it was darker than the tunnel and much more cramped. Even there, the tin soldier stayed firm. He lay at full length in that narrow darkness, never lowering the musket from his shoulder. The fish swam back and forth and made the strangest movements. At last, it became completely still.
        - id: ch04-b02
          speaker: narrator
          text: After a while, something flashed through the fish like lightning. Daylight came closer, and a voice cried out.
        - id: ch04-b03
          speaker: cook
          text: Well, would you look at that! Here is the tin soldier!
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: The fish had been caught, taken to market, and sold to the cook. She brought it to the kitchen and cut it open with a large knife. Then she picked up the soldier by the waist between her finger and thumb and carried him into the room.
        - id: ch04-b05
          speaker: narrator
          text: Everyone gathered to see the remarkable soldier who had traveled around inside a fish, but he felt no pride about it in the least. They placed him on the table. And what a curious thing had happened in the world. He was back in the very same room whose window he had fallen from. The same children were there, and the same toys stood on the same table. The paper castle was there, too. At its door, the graceful little dancer still balanced on one leg with the other held high. Through everything, she had remained as firm as he had.
        - id: ch04-b06
          speaker: narrator
          text: The sight of her touched the soldier so deeply that he nearly cried tin tears, but he held them back. He looked at her. She looked at him. Neither one spoke.
    - id: ch05
      title: The Tin Heart
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then one of the little boys picked up the tin soldier and threw him into the stove. The boy had no reason to do it, so it must have been the work of the black goblin in the snuffbox.
        - id: ch05-b02
          speaker: narrator
          text: Flames lit the soldier from every side. The heat was terrible, though he could not tell whether it came from the fire or from his love. The bright colors had faded from his uniform. Perhaps the journey had washed them away, or perhaps it was his sorrow. No one could say.
        - id: ch05-b03
          speaker: narrator
          text: The soldier gazed at the little dancer, and she gazed back. He felt himself melting, but he stood firm with his musket on his shoulder. Suddenly, the door flew open. A draft caught the dancer and lifted her into the air. She fluttered straight into the stove beside the soldier. In a moment, the flames took her, and she was gone. The soldier melted into a little lump.
        - id: ch05-b04
          speaker: narrator
          text: The next morning, the maid cleared the ashes from the stove. There she found the soldier, shaped like a little tin heart. Nothing remained of the dancer but her tinsel rose, burned black as a cinder.
