cover_prompt: |-
  A wordless cover gathers the most recognizable wonders of Andersen's tales across a moonlit nineteenth-century Danish shoreline. A tiny girl no taller than a tulip stands in an open flower, a steadfast one-legged tin soldier faces a paper dancer, a white swan rises from reeds, and a distant ice palace glows beyond the sea. At the center, a small brown nightingale sings from a blossoming branch toward a thoughtful young child in simple period clothes. The song is the focal action, visually linking the surrounding motifs without turning the scene into separate panels. Use a broad slightly elevated composition with a winding shore leading into the distance and ample quiet night sky at the top. Keep all figures gentle and original, drawing only from the public-domain tales and avoiding later screen designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
