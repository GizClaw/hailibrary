audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉静从容，带着古老童话的冷峻意味
        timbre: 温暖清澈
        pace: 舒缓而有张力
        pitch: 中音
    karen:
      display_name: 珈伦
      tts:
        delivery: 从爱美任性逐渐转为惊惧悔悟
        timbre: 清亮稚嫩
        pace: 自然，慌乱时加快
        pitch: 中高音
    old_lady:
      display_name: 老太太
      tts:
        delivery: 端庄严谨，语气直接
        timbre: 柔和苍老
        pace: 稍慢
        pitch: 中低音
    mirror:
      display_name: 镜子
      tts:
        delivery: 诱惑而笃定
        timbre: 明亮光滑
        pace: 缓慢
        pitch: 中高音
    shoemaker:
      display_name: 鞋匠
      tts:
        delivery: 殷勤朴实
        timbre: 清楚厚实
        pace: 适中
        pitch: 中音
    old_soldier:
      display_name: 老兵
      tts:
        delivery: 古怪含笑，话里带着不祥
        timbre: 粗粝苍老
        pace: 慢而有停顿
        pitch: 低音
    angel:
      display_name: 天使
      tts:
        delivery: 威严冷峻，字字分明
        timbre: 洪亮清澈
        pace: 庄重缓慢
        pitch: 中低音
    executioner:
      display_name: 刽子手
      tts:
        delivery: 冷硬直白
        timbre: 低沉粗哑
        pace: 沉稳
        pitch: 低音
    pastor:
      display_name: 牧师
      tts:
        delivery: 宽厚庄重，亲切而诚恳
        timbre: 沉稳温和
        pace: 从容
        pitch: 中低音
    pastor_wife:
      display_name: 牧师妻子
      tts:
        delivery: 慈爱体贴，语气真挚
        timbre: 柔和明朗
        pace: 舒缓
        pitch: 中音
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 天真热切，话音轻快
        timbre: 清脆稚嫩
        pace: 稍快
        pitch: 高音
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 单纯友善，语气轻柔
        timbre: 明亮稚嫩
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一章　红布鞋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个名叫珈伦的小姑娘，生得秀气可爱，家里却很穷。夏天，她只能光脚走路。冬天，她穿一双宽大的木鞋，小脚背总被磨得通红。
        - id: ch01-b02
          speaker: narrator
          text: 村子中央住着老鞋匠的妻子。她找来几块旧红布，坐下来，一针一针地拼缝，尽力做出一双小鞋。鞋虽笨拙，那份心意却是好的，因为她一针一线，都是为珈伦缝的。
        - id: ch01-b03
          speaker: narrator
          text: 珈伦第一次穿上这双鞋，正赶上母亲下葬。红布鞋不适合送葬，可她什么鞋也没有。她把光脚伸进鞋里，跟在简陋的棺材后面，一步步走着。
        - id: ch01-b04
          speaker: narrator
          text: 一辆又大又旧的马车从旁边经过，车里坐着一位老太太。她看见珈伦，动了怜悯之心，便对牧师开口。
        - id: ch01-b05
          speaker: old_lady
          text: 把这个小姑娘交给我吧，我会好好照料她。
        - id: ch01-b06
          speaker: narrator
          text: 珈伦以为，老太太愿意收留自己，全是那双红鞋的功劳。老太太却嫌鞋难看，叫人把它烧掉了。她让珈伦每天穿得干干净净、整整齐齐，又请人教她认字和针线。人人都夸珈伦漂亮，镜子说得还要更多。
        - id: ch01-b07
          speaker: mirror
          text: 你可不只是漂亮。你美极了。
        - id: ch01-b08
          speaker: narrator
          text: 一天，王后带着小公主经过这里。大家都涌到城堡前看她，珈伦也在人群里。小公主穿一身精美的白衣，站在窗前让众人观望。她没有长长的裙裾，也没有金王冠，脚上却是一双漂亮的红色摩洛哥皮鞋。那鞋比老鞋匠妻子缝给珈伦的红布鞋精致得多。珈伦觉得，世上再没有什么比红鞋更美了。
        - id: ch01-b09
          speaker: narrator
          text: 后来，珈伦到了行坚信礼的年纪。她有了新衣服，还要买新鞋。城里的富鞋匠请她进屋，为她量那双小脚。四周一座座大玻璃柜里，摆满了漂亮的鞋和白拖鞋，看起来可美了。老太太眼神不好，没能从中得到多少乐趣。珈伦却发现了一双红鞋，像极了公主穿的那双。
        - id: ch01-b10
          speaker: shoemaker
          text: 这双鞋本来是给一位伯爵小姐做的，可她穿着不合脚。
        - id: ch01-b11
          speaker: old_lady
          text: 那是亮皮做的吧？瞧上去亮闪闪的。
        - id: ch01-b12
          speaker: karen
          text: 对，真的很亮。
        - id: ch01-b13
          speaker: narrator
          text: 红鞋正合珈伦的脚，就这样买了下来。老太太不知道它们是红色的。要是知道，她绝不会让珈伦穿着它们去行坚信礼。
    - id: ch02
      title: 第二章　舞鞋醒了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 珈伦穿着红鞋走进教堂。从教堂门口走到唱诗班席位，一路上，人人都看她的脚。她甚至觉得，墓碑上那些穿黑长袍、戴硬领圈的古老人像，也把目光牢牢钉在她的鞋上。
        - id: ch02-b02
          speaker: narrator
          text: 牧师把手放在她头上，讲神圣的洗礼，讲人和上帝的约，又说她从此是长大成人的基督徒。管风琴庄严地响着，孩子们跟着年老的领唱人歌唱。可这一切，珈伦都没有放在心上。她只想着红鞋。
        - id: ch02-b03
          speaker: narrator
          text: 下午，见过珈伦的人纷纷把红鞋的事告诉老太太。老太太十分震惊，认为珈伦的举动既不像话，又很不得体。她吩咐珈伦，往后去教堂只能穿黑鞋，就算鞋旧了，也必须穿黑的。
        - id: ch02-b04
          speaker: narrator
          text: 到了下一个领圣餐的星期日，珈伦先看黑鞋，再看红鞋。她又多看了红鞋一眼，还是把它穿上了。阳光灿烂，她和老太太沿着麦田间尘土飞扬的小路去教堂。
        - id: ch02-b05
          speaker: narrator
          text: 教堂门口有个拄拐的残疾老兵。他的长胡子红多白少。他弯腰问老太太，要不要替她擦鞋。珈伦也把小脚伸过去。老兵拍了拍她的鞋底。
        - id: ch02-b06
          speaker: old_soldier
          text: 哎呀，这双舞鞋可真漂亮！你们跳起来的时候，可得牢牢待在她脚上。
        - id: ch02-b07
          speaker: narrator
          text: 老太太给了老兵几个钱，带珈伦进了教堂。里面的人都望着红鞋，塑像仿佛也望着它们。珈伦跪在圣坛前，把金杯送到唇边，却觉得红鞋正在杯中漂浮。她忘了唱赞美诗，也忘了念《主祷文》。
        - id: ch02-b08
          speaker: narrator
          text: 礼拜结束后，大家纷纷走出教堂，老太太先登上自己的马车。珈伦刚抬起一只脚，正要跟着上车，老兵又叫住了她。
        - id: ch02-b09
          speaker: old_soldier
          text: 哎呀，多好看的一双舞鞋！
        - id: ch02-b10
          speaker: narrator
          text: 珈伦身不由己，非跳几步不可。可才一开始，两条腿就再也停不下来。红鞋像是夺走了她双腿的主意，带她一路绕过教堂的墙角。她怎么也停不住，车夫只得追上去抓住她，把她抱进马车。可她的脚还在不停地跳，重重踢到了善良的老太太。直到人们脱掉红鞋，她的双腿才终于安静。
        - id: ch02-b11
          speaker: narrator
          text: 回家以后，鞋被锁进柜子。珈伦却总忍不住要去看。
        - id: ch02-b12
          speaker: narrator
          text: 不久，老太太病倒了，大家都说她可能再也起不来。珈伦本该守在床边照料她。偏偏城里要举行盛大的舞会，珈伦也受到了邀请。她先告诉自己，看一眼红鞋不算罪过。等把鞋穿到脚上，又觉得这样也没有什么害处。于是，她去了舞会。
    - id: ch03
      title: 第三章　永不停歇的舞
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 舞一开始，珈伦便再也做不了主。她要往右，鞋偏往左。她想沿着大厅往上跳，鞋却带她向下跳，跳出大厅，跳下楼梯，穿过街道，又冲出城门。她一路舞到城外，最后进了幽暗的树林，想停也停不了。
        - id: ch03-b02
          speaker: narrator
          text: 树木间突然亮起一张脸。珈伦起初以为那是月亮，定睛一看，却是红胡子的老兵。他坐在那里，朝她点头。
        - id: ch03-b03
          speaker: old_soldier
          text: 哎呀，你这双舞鞋真漂亮！
        - id: ch03-b04
          speaker: narrator
          text: 珈伦吓坏了，拼命想甩掉红鞋，可鞋粘得死死的。她扯掉长袜，才发现鞋已经长在脚上。她就这样越过田野和草地，在雨里跳，在太阳下跳，从白天跳进黑夜。夜晚最为可怕。
        - id: ch03-b05
          speaker: narrator
          text: 她跳进空荡荡的教堂墓园。那里的死者没有随她起舞，他们有比跳舞更要紧的事。她想坐在长着苦涩蕨草的穷人坟上歇一歇，可她得不到片刻安宁，也根本无法休息。
        - id: ch03-b06
          speaker: narrator
          text: 她从敞开的教堂门前跳过，看见一位白袍天使。他的双翼从肩头垂到地面，神情冷峻庄严，手里握着一把宽阔明亮的剑。
        - id: ch03-b07
          speaker: angel
          text: 你必须跳！穿着红鞋一直跳下去，跳到脸色惨白，身体冰冷，皮肤干瘪，只剩一副骨架！你要挨家挨户地跳。凡是住着骄傲顽劣孩子的人家，你都要去敲门，让孩子们听见，让他们害怕！你必须跳，永远跳下去！
        - id: ch03-b08
          speaker: karen
          text: 求你饶了我吧！
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: 天使回答了什么，珈伦没有听见。红鞋已经把她带出大门，冲进田野。大路也好，小径也好，她只能不停地跳。
        - id: ch03-b10
          speaker: narrator
          text: 一天早晨，她跳过一扇熟悉的门。屋里传来赞美诗，一口铺满鲜花的棺材正从门里抬出来。珈伦这才知道，人人都抛下了她，上帝的天使也已经给她定罪。
        - id: ch03-b11
          speaker: narrator
          text: 她继续跳着，被迫穿过又一个漆黑的夜晚。红鞋拖着她踩过荆棘和树桩，把她划得遍体鳞伤，鲜血直流。她越过荒原，来到一座孤零零的小屋前。珈伦知道，刽子手住在这里。她用手指敲了敲窗子。
        - id: ch03-b12
          speaker: karen
          text: 快出来吧！我没法进去，我的脚还在跳。
        - id: ch03-b13
          speaker: executioner
          text: 你大概不清楚我是做什么的。我专门砍下恶人的脑袋。听见了吗？我的斧头嗡嗡直响，它已经等不及了。
        - id: ch03-b14
          speaker: karen
          text: 不要砍我的头！砍了头，我就不能为自己的罪悔过了。请把我的脚和红鞋一起砍掉。
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: 珈伦把自己的罪一件件说了出来。刽子手挥下斧头，砍掉她的双脚，也砍下了红鞋。可那双鞋仍带着两只小脚，跳过田野，钻进了幽深的树林。
    - id: ch04
      title: 第四章　木脚与拐杖
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 刽子手替珈伦削了一双木脚，做了两根拐杖，还教她唱罪人常唱的赞美诗。珈伦亲吻了那只操持斧头的手，随后拄着拐杖走过荒原。
        - id: ch04-b02
          speaker: karen
          text: 红鞋已经让我吃尽苦头了。我要去教堂，让大家看看我。
        - id: ch04-b03
          speaker: narrator
          text: 她急忙赶到教堂门口，却看见红鞋就在面前跳舞。珈伦害怕了，只得转身回去。
        - id: ch04-b04
          speaker: narrator
          text: 那一整周，她都沉浸在悲伤里，流了许多苦泪。又到星期日，她觉得自己受的苦、下的功夫都够多了。
        - id: ch04-b05
          speaker: karen
          text: 我想，我不会比教堂里那些摆架子的人差。
        - id: ch04-b06
          speaker: narrator
          text: 珈伦大着胆子向前走，可连墓园大门都没过去，就又看见红鞋在前面跳。她吓得退了回去。这一次，她从心底为自己的罪悔过。
        - id: ch04-b07
          speaker: narrator
          text: 她去求牧师一家收留自己做佣人。珈伦答应会勤快做事，凡是力所能及的活儿都愿意干。她不计较工钱，只求有个屋顶遮身，能同善良的人住在一起。牧师的妻子怜悯她，便把她留下了。
        - id: ch04-b08
          speaker: narrator
          text: 珈伦果然勤恳又细心。每晚牧师朗读《圣经》，她总是静静坐着听。孩子们都很喜欢她。可只要他们谈起漂亮衣裳、华贵排场和美貌，她就会摇头。
    - id: ch05
      title: 第五章　慈悲来到小屋
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 下一个星期日，牧师一家都要去教堂，也问珈伦愿不愿意同去。她含着眼泪，低头看看自己的拐杖，没有跟上他们。
        - id: ch05-b02
          speaker: narrator
          text: 别人去聆听上帝的话语，珈伦独自回到小房间。那里窄得只能放下一张床和一把椅子。她坐在椅子上，虔诚地读着赞美诗集。风从教堂送来管风琴的乐声。她满脸是泪，抬起头祈求上帝。
        - id: ch05-b03
          speaker: karen
          text: 上帝啊，请帮助我！
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 阳光忽然亮得耀眼。那位白袍天使就站在珈伦面前，正是她在教堂门口见过的天使。他手里不再有锋利的剑，只有一根开满玫瑰的美丽绿枝。
        - id: ch05-b05
          speaker: narrator
          text: 天使用绿枝点了点天花板，天花板立刻升得很高，被点过的地方亮起一颗金星。他再点墙壁，四面墙便向两边敞开。珈伦看见管风琴轰然奏响，看见历代牧师和他们妻子的画像，也看见会众坐在明亮的座椅上，捧着赞美诗集歌唱。
        - id: ch05-b06
          speaker: narrator
          text: 仿佛教堂来到了可怜姑娘的窄房间，又仿佛小屋去到了教堂里。珈伦已经和牧师一家坐在同一排长椅上。一曲唱完，大家抬头看见她，便向她点头。
        - id: ch05-b07
          speakers: [pastor, pastor_wife, child_1, child_2]
          ensemble: chorus
          text: 珈伦，你来到这里就对了。
        - id: ch05-b08
          speaker: karen
          text: 这是上帝的慈悲。
        - id: ch05-b09
          speaker: narrator
          text: 管风琴继续演奏，唱诗班里孩子们的歌声轻柔又美好。明亮温暖的阳光穿过窗户，落在珈伦的座位上。阳光、安宁和喜悦一起涌进她的心，盛得让那颗心破裂了。她的灵魂乘着阳光飞向天堂。
        - id: ch05-b10
          speaker: narrator
          text: 在那里，再没有谁问起那双红鞋。
