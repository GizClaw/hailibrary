  chapters:
    - id: ch01
      title: STORY THE FIRST
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: First, you need to hear how all this began. There was once a wicked hobgoblin, one of the worst there ever was, for he was a true demon. One day, in a merry mood, he made a looking-glass with a terrible power. Anything good or beautiful that appeared in it shrank almost to nothing. Anything worthless or ugly grew larger and looked worse than before. Lovely landscapes became boiled spinach. People looked hideous, as if they stood on their heads without bodies. Faces twisted beyond recognition, and a single freckle seemed to spread over the whole nose and mouth.
        - id: ch01-b02
          speaker: narrator
          text: The demon found every one of these changes wonderfully funny. If a good or faithful thought passed through anyone's mind, the glass twisted that thought into something ugly too. Then he laughed harder than ever at his clever invention. He even kept a school, and all of his pupils talked everywhere about the wonders they had seen. They claimed that, for the first time, people could look at the world and at humankind as they truly were. The pupils carried the mirror from place to place until there was no country and no people they had not viewed through its crooked surface.
        - id: ch01-b03
          speaker: narrator
          text: At last the pupils decided to fly all the way to heaven with the mirror so they could use it to look at the angels. But the higher they rose, the more slippery the glass became. Soon they could barely keep their hands around it. Then it slid free, dropped out of the sky, and struck the earth. The looking-glass shattered into millions upon millions of pieces. Broken, it caused more misery than it ever had while it was whole.
        - id: ch01-b04
          speaker: narrator
          text: Some splinters were smaller than grains of sand. They flew across every country in the world. If one entered a person's eye, it stayed there without being noticed. From that moment onward, the person saw everything through a distorted surface and noticed only the worst side of whatever lay before him. Even the smallest grain of glass kept all the wicked power of the whole mirror. A few pieces found their way into people's hearts. That was more terrible still. The heart around each fragment slowly became as cold and hard as a lump of ice.
        - id: ch01-b05
          speaker: narrator
          text: Some pieces were large enough to use as windowpanes. It would have been a sad thing to look at your friends through glass like that. Other pieces became spectacles. Anyone who wore them lost the ability to see rightly or judge fairly. All the while, the wicked demon laughed until his sides shook. The mischief delighted him. Even now, a great many tiny fragments of that glass were still floating through the air. And next, you will hear what happened with one of them.
    - id: ch02
      title: SECOND STORY
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In a large town crowded with houses and people, most families had no room for a garden. A few flowers in pots had to be enough. Two poor children who lived there had something a little better. They were not brother and sister, but they loved each other almost as dearly. Their parents lived in attic rooms across from one another. The roofs nearly met, with a gutter running between them, and each home had a small window. A person could step across the gutter from one window to the other.
        - id: ch02-b02
          speaker: narrator
          text: Each family grew kitchen herbs and a rosebush in a large wooden box. The roses grew splendidly. After a while, the parents set the two boxes across the gutter so they reached from one window to the other, like two banks of flowers. Sweet peas hung over the sides. Long rose branches curled around the windows and met in something like a triumphal arch of leaves and blossoms. The boxes stood high, and the children knew they must never climb onto them without permission. But often they were allowed to step outside, sit together on little stools beneath the roses, and play quietly. The boy was Kay, and the girl was Gerda.
        - id: ch02-b03
          speaker: narrator
          text: Winter ended all that pleasure. Frost sometimes covered both windows so completely that the children could not see one another. Then each child warmed a copper penny on the stove and pressed the hot coin against the frozen pane. Before long, a small round peephole melted through the ice. Kay's and Gerda's soft, bright eyes shone through those holes as they looked across at each other. During summer, one quick jump over the gutter brought them together. In winter, each had to go down a long staircase, leave the house, and walk through the snowy street before they could meet.
        - id: ch02-b04
          speaker: grandmother
          text: Look at all the white bees swarming out there.
        - id: ch02-b05
          speaker: narrator
          text: Kay's old grandmother said this one snowy day.
        - id: ch02-b06
          speaker: kay
          text: Do the white bees have a queen? Real bees do.
        - id: ch02-b07
          speaker: grandmother
          text: Of course they do. She flies wherever the swarm is thickest, and she's larger than all the others. She never stays on the ground. She rises toward the dark clouds. At midnight, she often flies through the streets and looks in at the windows. Then ice freezes across the panes in wonderful shapes, like flowers and castles.
        - id: ch02-b08
          speakers: [kay, gerda]
          ensemble: duo
          text: Yes, we've seen them!
        - id: ch02-b09
          speaker: narrator
          text: The children were certain the story was true.
        - id: ch02-b10
          speaker: gerda
          text: Could the Snow Queen come in here?
        - id: ch02-b11
          speaker: kay
          text: Let her try. I'll put her on the stove, and she'll melt.
        - id: ch02-b12
          speaker: narrator
          text: Grandmother smoothed his hair and told them more tales. One evening, when Kay was at home and half undressed, he climbed onto a chair and peered through the little hole in the window. A few snowflakes drifted down. One larger flake landed on the edge of a flower box. It did not melt. Instead it grew and grew until it took the shape of a woman dressed in white gauze. Her clothes looked as if millions of starry snowflakes had been joined together. She was fair and beautiful, but she was made of ice, shining, glittering ice. Still, she was alive. Her eyes sparkled like bright stars, yet their gaze held no peace and no rest. She nodded toward the window and lifted her hand to Kay. He was so frightened that he sprang from the chair. At that same moment, something like a great bird swept past the window.
        - id: ch02-b13
          speaker: narrator
          text: The next day brought clear, bright frost. Before long, spring arrived. The sun shone warmly, young green leaves burst from the branches, and swallows built their nests beneath the roofs. Windows that had stayed shut all winter swung wide again. Kay and Gerda returned to their little garden high above all the other rooms. The roses bloomed more beautifully than ever that summer. Gerda had learned a hymn that spoke about roses, and each time she sang it, she thought of their own flowers. She sang the hymn to Kay beneath the arch of leaves, and he joined her.
        - id: ch02-b14
          speakers: [gerda, kay]
          ensemble: duo
          text: Roses bloom and cease to be, but we shall the Christ-child see.
        - id: ch02-b15
          speaker: narrator
          text: The two children held hands and kissed the roses. They looked into the bright sunshine and spoke to it as though the Christ-child were there with them. Those were splendid summer days. Everything beneath the rosebushes was fresh and beautiful. The branches were so full of blossoms that it seemed they would never stop blooming and summer would never end.
        - id: ch02-b16
          speaker: narrator
          text: One day, Kay and Gerda were looking through a book filled with pictures of animals and birds. Just as the church clock struck twelve, Kay suddenly cried out.
        - id: ch02-b17
          speaker: kay
          text: Ow! Something struck my heart. And now there's something in my eye!
        - id: ch02-b18
          speaker: narrator
          text: Gerda put an arm around his neck and searched his eye, but she could see nothing.
        - id: ch02-b19
          speaker: kay
          text: I think it's gone now.
        - id: ch02-b20
          speaker: narrator
          text: It was not gone. A splinter from the demon's mirror had entered his eye. The ugly glass made everything great and good look small and hateful. It made wickedness stand out and every tiny fault appear plainly. Another grain had entered Kay's heart, and it quickly began turning to ice. The pain stopped, but the glass remained.
        - id: ch02-b21
          speaker: kay
          text: Why are you crying? You look ugly when you cry. There's nothing wrong with me. Wait, look at that rose. A worm has eaten it, and this other one is crooked. Those roses are ugly, just like the boxes they're growing in.
        - id: ch02-b22
          speaker: narrator
          text: He kicked the wooden boxes with his foot and pulled the two roses from their stems.
        - id: ch02-b23
          speaker: gerda
          text: Kay! What are you doing?
          emotion: fearful
        - id: ch02-b24
          speaker: narrator
          text: When Kay saw how frightened she was, he ripped off another rose and jumped back through his own window, leaving Gerda behind.
        - id: ch02-b25
          speaker: narrator
          text: Later, when Gerda brought out the picture book, Kay pushed it away.
        - id: ch02-b26
          speaker: kay
          text: That's only good for babies in long gowns.
        - id: ch02-b27
          speaker: narrator
          text: When Grandmother told stories, Kay broke in again and again with objections. Whenever he got the chance, he slipped behind her chair, put on a pair of spectacles, and copied her voice and movements so cleverly that people laughed. Soon he was studying people in the street and imitating the way they talked and walked. The instant he noticed anything odd, awkward, or unpleasant about someone, he repeated it for others to see.
        - id: ch02-b28
          speaker: narrator
          text: People who watched Kay's imitations called him remarkably clever. They said the boy possessed an unusual genius. They did not know about the splinter lodged in his eye or the cold spreading through his heart. Those were the things that made him notice every fault and turn it into mockery. He even began teasing little Gerda, though she still loved him with all her heart. His games changed as well. The gentle, childish play they had once shared no longer pleased him.
        - id: ch02-b29
          speaker: narrator
          text: On a snowy winter day, Kay brought out a magnifying glass. He spread the tail of his blue coat and let snowflakes fall onto it.
        - id: ch02-b30
          speaker: kay
          text: Look through the glass, Gerda.
        - id: ch02-b31
          speaker: narrator
          text: Each snowflake grew large beneath the lens. Every one looked like a perfect flower or a glittering star.
        - id: ch02-b32
          speaker: kay
          text: Isn't that clever? It's much more interesting than real flowers. There isn't one flaw anywhere. Snowflakes are perfect, right up until they melt.
        - id: ch02-b33
          speaker: narrator
          text: Not long afterward, Kay appeared in thick gloves with his little sled on his back.
        - id: ch02-b34
          speaker: kay
          text: I'm going to the big square to ride with the other boys!
        - id: ch02-b35
          speaker: narrator
          text: He called up to Gerda, then hurried away. In the square, the boldest boys tied their sleds behind farmers' carts and rode with them for a while. Kay joined in. Then a large white sled came past. Its driver was wrapped in rough white fur and wore a white cap. The sled circled the square twice. Kay tied his own little sled behind it, and when the large one left, he followed.
        - id: ch02-b36
          speaker: narrator
          text: The white sled gathered speed as it raced into the next street. Its driver turned around and nodded pleasantly to Kay, just as though the two of them had met before. Kay reached for his rope and tried to untie the little sled. Each time he did, the stranger turned and nodded again, and somehow Kay remained where he was. Street after street flashed past. Then they swept through the town gate and out into the open country. Snow began falling so heavily that Kay could not see even the width of his own hand in front of him.
        - id: ch02-b37
          speaker: narrator
          text: Kay loosened the rope, hoping the great sled would leave him behind. It did no good. His little sled held fast, and they flew onward like the wind. He shouted as loudly as he could, but nobody heard him. The snow beat against his face, and the great sled kept flying forward. Every so often, it jumped so high that they seemed to be crossing hedges and ditches. Kay was terrified. He tried to remember a prayer, but the only words that came into his mind belonged to the multiplication table.
        - id: ch02-b38
          speaker: narrator
          text: The snowflakes grew until they looked like enormous white chickens. Suddenly they jumped aside, and the sled stopped. The driver rose. The snowy cap and fur fell away. Before Kay stood a tall white lady, the Snow Queen herself.
        - id: ch02-b39
          speaker: snow_queen
          text: We made good time. Why are you shaking? Come here, inside my warm fur.
        - id: ch02-b40
          speaker: narrator
          text: She seated Kay beside her and wrapped him in the fur. He felt as though he were sinking into a snowdrift.
        - id: ch02-b41
          speaker: snow_queen
          text: Are you cold now?
        - id: ch02-b42
          speaker: narrator
          text: She kissed his forehead. Her kiss was colder than ice and went straight through to his heart, which was already nearly frozen solid. For a moment he thought he would die. Then he felt well again and no longer noticed the cold.
        - id: ch02-b43
          speaker: kay
          text: My sled! We can't forget my sled.
        - id: ch02-b44
          speaker: narrator
          text: He saw it tied to one of the white chickens flying behind them. The chicken carried the little sled on its back. The Snow Queen kissed Kay once more. This time he forgot Gerda, Grandmother, and everyone at home.
        - id: ch02-b45
          speaker: snow_queen
          text: No more kisses for you. Another one would kill you.
        - id: ch02-b46
          speaker: narrator
          text: Kay looked straight at her. He could not imagine any face more beautiful or more intelligent. She no longer seemed to be made of ice, as she had when she stood outside his window and nodded. The fragment in his eye changed what he saw. To him, every part of her was perfect, and nothing about her frightened him now.
        - id: ch02-b47
          speaker: kay
          text: I can do arithmetic in my head, even fractions. I know how many square miles are in our country and how many people live there.
        - id: ch02-b48
          speaker: narrator
          text: The Snow Queen answered him only with a smile. That smile made Kay think that everything he had learned was still not enough. She looked out across the vast distance as a black cloud carried them higher and higher. Around them, the storm sang and howled like very old songs. They flew over dark forests and frozen lakes, then crossed sea and land. Beneath them, the wild wind roared, wolves howled, and hard snow crackled. Black crows flew screaming through the night. Above every sound and shadow, the moon shone clear and bright. In this way, Kay traveled through the whole long winter night. When daylight returned, he lay down and slept at the Snow Queen's feet.
    - id: ch03
      title: THIRD STORY
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And what became of Gerda after Kay disappeared? No one knew where he had gone. The boys could only say that he tied his sled to a larger one and followed it through the streets and out the town gate. Many tears were shed. Gerda cried bitterly for a long time. She became sure Kay had died in the river near the school. Those winter days were long and dreary. At last spring returned with warm sunshine.
        - id: ch03-b02
          speaker: gerda
          text: Kay is dead. He's gone.
          emotion: sad
        - id: ch03-b03
          speaker: sunshine
          text: I don't believe that.
        - id: ch03-b04
          speaker: gerda
          text: Kay is dead. He's gone.
          emotion: sad
        - id: ch03-b05
          speakers: [sparrow_one, sparrow_two]
          ensemble: duo
          text: We don't believe it either.
        - id: ch03-b06
          speaker: narrator
          text: At last Gerda began to doubt it too.
        - id: ch03-b07
          speaker: gerda
          text: I'll put on my new red shoes, the ones Kay has never seen. Then I'll go to the river and ask where he is.
        - id: ch03-b08
          speaker: narrator
          text: Very early the next morning, Gerda found her old grandmother still asleep. She kissed her gently, put on the new red shoes, and slipped out alone. She walked all the way beyond the town gates until she reached the river that flowed near the school.
        - id: ch03-b09
          speaker: gerda
          text: River, did you take my playmate away? I'll give you my red shoes if you give Kay back to me.
        - id: ch03-b10
          speaker: narrator
          text: The waves seemed to nod strangely. Gerda took off the shoes she loved more than anything and threw them both into the water. They landed close to shore, and the small waves carried them back, almost as if the river refused to take her dearest possession when it could not return Kay.
        - id: ch03-b11
          speaker: narrator
          text: Gerda decided she had simply failed to throw the shoes far enough. A small boat lay among the reeds, so she climbed into it and went to the far end before tossing the shoes again. But the boat had not been tied to the bank. Her movement sent it gliding into the current. The moment she understood what was happening, she hurried toward the nearer end. Before she could reach it, the boat was already more than a yard from land and drifting faster every moment.
        - id: ch03-b12
          speaker: narrator
          text: Gerda cried in fear. Only the sparrows heard her. They could not carry her ashore, so they flew beside the riverbank and sang to comfort her.
        - id: ch03-b13
          speakers: [sparrow_one, sparrow_two]
          ensemble: duo
          text: We're here! We're here!
        - id: ch03-b14
          speaker: narrator
          text: The boat floated downstream, and Gerda sat very still with only her stockings on her feet. The red shoes floated after her, but the boat stayed too far ahead for her to reach them. Both riverbanks were lovely. Beautiful flowers grew there, old trees spread their branches, and fields sloped toward the water with cows and sheep grazing on them. Yet not one person appeared who could pull her ashore.
        - id: ch03-b15
          speaker: gerda
          text: Maybe the river is carrying me to Kay.
        - id: ch03-b16
          speaker: narrator
          text: That thought cheered her. She lifted her head and watched the green banks as the boat sailed on for hours. Finally, she reached a large cherry orchard. Inside it stood a small red house with strange red and blue windows and a thatched roof. Two wooden soldiers stood outside and presented arms as she passed.
        - id: ch03-b17
          speaker: narrator
          text: Gerda called to the soldiers because she thought they were alive, but of course they gave no answer. As the current brought her closer, she realized they were carved from wood. Then she called louder than before. A very old woman came out of the red house, leaning on a crutch. A broad hat shaded her from the sun, and every part of it was painted with pretty flowers.
        - id: ch03-b18
          speaker: old_woman
          text: You poor little child! How did you come so far into the wide world on this swift river?
        - id: ch03-b19
          speaker: narrator
          text: The old woman stepped straight into the river. Using the hooked end of her crutch, she caught the drifting boat and drew it carefully toward the bank. Then she lifted Gerda out and set her safely on land. Gerda was deeply relieved to feel firm, dry ground beneath her stockinged feet again. Even so, she could not help feeling a little afraid of this strange old woman in the painted hat.
        - id: ch03-b20
          speaker: old_woman
          text: Come with me. Tell me who you are and how you got here.
        - id: ch03-b21
          speaker: narrator
          text: Gerda told her everything. The woman shook her head and murmured to herself. When the story ended, Gerda asked if she had seen Kay.
        - id: ch03-b22
          speaker: old_woman
          text: No, he hasn't passed this way. But he may still come. Don't be sad. Taste my cherries and look at my flowers. They're finer than any picture book, and every flower can tell a story.
        - id: ch03-b23
          speaker: narrator
          text: The woman took Gerda by the hand, led her into the little red house, and closed the door behind them. Its windows stood so high that Gerda could not look outside. Sunlight passed through panes of red, blue, and yellow glass, filling the room with the strangest colors. Beautiful ripe cherries covered the table, and Gerda had permission to eat as many as she wished. While she ate, the old woman drew a golden comb through her long flaxen curls. The smooth, shining hair fell on both sides of Gerda's round and pleasant face, which looked as fresh and blooming as a rose.
        - id: ch03-b24
          speaker: old_woman
          text: I've wanted a dear little girl like you for a very long time. Stay with me, and you'll see how happily we can live together.
        - id: ch03-b25
          speaker: narrator
          text: As the golden comb moved through Gerda's hair, she thought less and less about Kay. The old woman knew magic. She was not a wicked witch and usually used her power only for her own amusement. This time, though, she wanted to keep Gerda. She went into the garden and stretched her crutch toward every rosebush. Beautiful as they were, the bushes sank at once into the dark earth. Soon no one could have guessed where they had stood. The woman knew that the sight of roses might call Gerda's rooftop garden back to mind. Then Gerda would remember Kay and run away.
        - id: ch03-b26
          speaker: narrator
          text: Then she brought Gerda into the flower garden. What beauty and fragrance filled it! Every kind of flower Gerda could imagine grew there, and flowers from every season stood in bloom together. No picture book held brighter colors. Gerda jumped for joy. She played among the beds until the sun disappeared behind the tall cherry trees. That night, she slept in a fine bed with red silk pillows embroidered in many-colored violets. Her dreams were as pleasant as the dreams of a queen on her wedding day.
        - id: ch03-b27
          speaker: narrator
          text: The next day, and for many days after that, Gerda played among the flowers in warm sunshine. She came to know every blossom in the garden. Still, with so many kinds all around her, she always felt that one was missing. She could never remember which flower it was. One day she sat looking at the painted blossoms on the old woman's hat. The prettiest flower there was a rose. The woman had forgotten to remove that painted rose when she sent all the living rosebushes underground. It is hard to remember every detail, and one little mistake can upset the cleverest plan.
        - id: ch03-b28
          speaker: gerda
          text: What? There aren't any roses here!
          emotion: surprised
        - id: ch03-b29
          speaker: narrator
          text: Gerda ran through the garden beds. She examined every corner and searched again and again, but she found no rose. At last she sat down and wept. Her tears happened to fall on the very place where one rosebush had sunk. The warm drops softened the earth. At once, the bush pushed back into the sunlight, as green and full of blossoms as it had been before. Gerda wrapped her arms around it and kissed the roses. Their sight brought back the beautiful roses at home, and with that memory came Kay.
        - id: ch03-b30
          speaker: gerda
          text: Oh, I've been kept here so long! I was supposed to be looking for Kay. Roses, do you know where he is? Do you think he's dead?
        - id: ch03-b31
          speakers: [rose_one, rose_two]
          ensemble: duo
          text: No, he isn't dead. We have been under the earth where all the dead are, and Kay was not there.
        - id: ch03-b32
          speaker: gerda
          text: Thank you!
        - id: ch03-b33
          speaker: narrator
          text: Gerda went from one flower to the next. She bent over each little cup and asked whether it knew where Kay was. But every blossom stood in the sunshine dreaming only about its own little history. Each had a story ready for her, yet not one of those stories had anything to do with Kay.
        - id: ch03-b34
          speaker: tiger_lily
          text: Listen. Do you hear the drum? Turn, turn. Only those two notes, over and over. Hear the women mourning and the priest crying out. A widow in a long red robe stands beside her husband's funeral fire. The flames rise as she places herself upon his body, yet she is thinking of someone living. Her son lit the fire, and his shining eyes pain her heart more than the flames that will turn her body to ashes. Can a burning heart be put out in a funeral fire?
        - id: ch03-b35
          speaker: gerda
          text: I don't understand any of that.
        - id: ch03-b36
          speaker: tiger_lily
          text: That is my story.
        - id: ch03-b37
          speaker: convolvulus
          text: Beside a narrow road stands an old knight's castle. Thick ivy covers its ruined walls, all the way to the balcony. A beautiful young woman leans over the railing and watches the road. No rose is fresher. No apple blossom moves more lightly in the wind. Her rich silk rustles as she bends forward. “Isn't he coming?” she cries.
        - id: ch03-b38
          speaker: gerda
          text: Do you mean Kay?
        - id: ch03-b39
          speaker: convolvulus
          text: No. I'm only telling you my dream.
        - id: ch03-b40
          speaker: snowdrop
          text: A rope hangs between two trees, with a board tied to it for a swing. Two lovely girls in snow-white dresses sit there. Long green ribbons flutter from their hats. Their taller brother stands on the swing, steadying himself with one arm around the rope. He holds a small bowl and a clay pipe, and he blows bubbles. As the swing moves, the bubbles rise in changing colors. One last bubble trembles at the pipe. A little black dog runs up. He's almost as light as the bubble. He stands on his back legs and begs to join them, but the swing keeps moving. He falls, barks, and grows angry. The children lean toward him, and the bubble bursts. A swinging board and a bright foam picture. That is my story.
        - id: ch03-b41
          speaker: gerda
          text: It may be pretty, but you tell it so sadly. And you never say anything about Kay.
        - id: ch03-b42
          speakers: [hyacinth_one, hyacinth_two, hyacinth_three]
          ensemble: chorus
          text: Three beautiful sisters danced hand in hand beside a calm lake under the moon. One wore red, one blue, and one pure white. They were human, not elves. A sweet fragrance drew them into the forest, where it grew stronger. Then three coffins came gliding from the thick woods across the lake. The three sisters lay inside. Fireflies floated over them like tiny torches. Are the dancers sleeping, or are they dead? Our scent says they are dead. The evening bell rings for them.
        - id: ch03-b43
          speaker: gerda
          text: You make me so sad. Your perfume makes me think of those dead girls. Is Kay truly dead? The roses were under the earth, and they said he wasn't there.
          emotion: sad
        - id: ch03-b44
          speakers: [hyacinth_one, hyacinth_two, hyacinth_three]
          ensemble: chorus
          text: Cling, clang. We aren't ringing for Kay. We don't know him. We only sing the one song we know.
        - id: ch03-b45
          speaker: narrator
          text: Gerda went to the buttercups shining among their bright green leaves.
        - id: ch03-b46
          speaker: gerda
          text: You look like little suns. Please tell me where I can find my playmate.
        - id: ch03-b47
          speaker: narrator
          text: The buttercup sparkled cheerfully, but its song was not about Kay.
        - id: ch03-b48
          speaker: buttercup
          text: On the first warm spring day, sunlight filled a little courtyard and shone against a white wall. Nearby, the season's first yellow flower glittered like gold. An old woman sat at her door. Her granddaughter, a poor and pretty servant girl, came for a short visit. When she kissed her grandmother, gold was everywhere. There was gold in the loving kiss, gold in the morning sun, gold on the little flower's leaves, and gold on the girl's lips. That is my story.
        - id: ch03-b49
          speaker: gerda
          text: My poor grandmother! She must be longing for me and grieving, just as she did for Kay. But I'll be home soon, and I'll bring Kay with me. Asking the flowers is no use. They only know their own songs.
        - id: ch03-b50
          speaker: narrator
          text: Gerda tucked up her dress so she could run. As she jumped over a narcissus, it caught her leg. She stopped and bent close to the tall yellow flower.
        - id: ch03-b51
          speaker: gerda
          text: Maybe you know something. What can you tell me?
        - id: ch03-b52
          speaker: narcissus
          text: I can see myself! Oh, how sweet I smell. In a little room with a bow window, a dancing girl stands half dressed. First on one leg, then on both, as if she could stamp on the whole world. But it's all make-believe. She pours water from a teapot onto the cloth in her hand. It's her bodice. “Being clean is a good thing,” she says. Her white dress hangs from a peg. It was washed in the teapot too and dried on the roof. She puts it on, then ties a saffron-colored scarf around her neck so the dress looks even whiter. See her stretch out her legs and show herself off on her stem. I can see myself!
        - id: ch03-b53
          speaker: gerda
          text: Why would I care about that? Don't tell me such nonsense.
        - id: ch03-b54
          speaker: narrator
          text: Gerda ran to the far end of the garden. The gate was fastened, but she pressed hard against its rusty latch. It gave way, the gate sprang open, and she ran barefoot out into the wide world. Three different times she looked behind her, expecting someone to follow. No one came. She kept running until her strength was gone, then sat down to rest on a large stone.
        - id: ch03-b55
          speaker: narrator
          text: Only then did she see that summer had ended and autumn was already far along. Inside the enchanted garden, where the sun always shone and flowers bloomed through every season, she had noticed nothing.
        - id: ch03-b56
          speaker: gerda
          text: Oh, how much time I've lost! It's autumn already. I can't rest any longer.
        - id: ch03-b57
          speaker: narrator
          text: She rose and forced herself onward. Her bare feet had become sore and wounded, and everything around her looked cold and bleak. The long leaves on the willow trees had turned completely yellow. Heavy drops of dew fell like water. One leaf after another loosened from the branches and drifted down. Only the blackthorn still carried fruit, and its berries were so sour that they set the teeth on edge. After the enchanted warmth of the garden, the whole wide world seemed dark and weary.
    - id: ch04
      title: FOURTH STORY
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Gerda had to stop and rest again. Across the snow, a large crow came hopping toward her. He studied her for a while, wagged his head, and tried to speak as clearly as he could because he meant to be kind.
        - id: ch04-b02
          speaker: forest_crow
          text: Caw, caw. Good day! Where are you going all alone in this wide world?
        - id: ch04-b03
          speaker: narrator
          text: Gerda understood the word alone very well. She told the crow her whole story and asked if he had seen Kay. The crow nodded gravely.
        - id: ch04-b04
          speaker: forest_crow
          text: Perhaps I have seen him. Then again, perhaps I haven't. It may be the same boy.
        - id: ch04-b05
          speaker: gerda
          text: You think you saw him?
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: In her joy, she kissed the crow and hugged him almost to death.
        - id: ch04-b07
          speaker: forest_crow
          text: Easy, easy! I believe I may know where he is. But by now he has probably forgotten you because of the princess.
        - id: ch04-b08
          speaker: gerda
          text: He lives with a princess?
        - id: ch04-b09
          speaker: forest_crow
          text: Yes. Listen. Your language is hard for me. If you understood crow language, I could tell this much better. Do you?
        - id: ch04-b10
          speaker: gerda
          text: No, I never learned it. My grandmother understands it and used to speak it to me. I wish I'd learned.
        - id: ch04-b11
          speaker: forest_crow
          text: Never mind. I'll explain as well as I can, though it won't be very good. In this kingdom lives a princess so clever that she has read every newspaper in the world and forgotten them all again. Not long ago, she sat on her throne. People say a throne isn't as comfortable as it looks. She began singing, “Why shouldn't I get married?” Then she thought, “Yes, why not?”
        - id: ch04-b12
          speaker: forest_crow
          text: She decided to marry a man who could answer when spoken to. She did not want someone who merely stood there looking grand. That was too tiresome. She called all her court ladies together with a drum. They were delighted and said they had just been talking about the same thing. Every word is true. My sweetheart is a tame crow who can go anywhere in the palace, and she told me herself.
        - id: ch04-b13
          speaker: narrator
          text: Naturally, his sweetheart was another crow. Birds of a feather choose one another.
        - id: ch04-b14
          speaker: forest_crow
          text: Newspapers went out at once, bordered with hearts and the princess's initials. They announced that any handsome young man could come to the palace and speak with her. Anyone who answered loudly enough to be heard could make himself at home, and whoever spoke best would become her husband.
        - id: ch04-b15
          speaker: forest_crow
          text: Crowds came. There was pushing and running everywhere, but nobody succeeded on the first day or the second. Out in the street, every man could talk. Once he entered the gates and saw guards in silver, servants in gold on the staircase, and blazing halls, his thoughts vanished. Before the princess, each one only repeated the last thing she had said. She didn't care to hear her own words again.
        - id: ch04-b16
          speaker: forest_crow
          text: They acted as though something in the palace had put them to sleep. They did not recover until they were back outside. The line stretched all the way from the town gate to the palace. I went to look. The men were hungry and thirsty, because nobody gave them so much as a glass of water. A few sensible ones carried bread and butter, but they would not share. They hoped looking hungry might improve their chances.
        - id: ch04-b17
          speaker: gerda
          text: But what about Kay? Was he in that crowd?
        - id: ch04-b18
          speaker: forest_crow
          text: Wait, I'm coming to him. On the third day, a small fellow marched cheerfully toward the palace. He had no horse or carriage. His eyes shone like yours, and his hair was long and beautiful. His clothes were very poor.
        - id: ch04-b19
          speaker: gerda
          text: That was Kay! I've found him!
          emotion: happy
        - id: ch04-b20
          speaker: narrator
          text: She clapped her hands.
        - id: ch04-b21
          speaker: forest_crow
          text: He carried a little pack on his back.
        - id: ch04-b22
          speaker: gerda
          text: It must have been his sled. He left home with it.
        - id: ch04-b23
          speaker: forest_crow
          text: Maybe. I didn't look closely. My sweetheart says he walked through the gates and saw all the silver guards and golden servants without getting confused. He said standing on the stairs must be tiring and went straight inside. The rooms blazed with light. Councilors and ambassadors walked barefoot carrying golden dishes. Anyone else would have grown serious. His boots creaked loudly, but he never seemed uneasy.
        - id: ch04-b24
          speaker: gerda
          text: It has to be Kay. His new boots creaked. I heard them in Grandmother's room.
        - id: ch04-b25
          speaker: forest_crow
          text: They certainly creaked. Still, he walked boldly to the princess. She sat on a pearl as large as a spinning wheel. Court ladies stood around her with their maids, and gentlemen stood with their servants. Every maid had another maid, and the gentlemen's servants had servants and pages of their own. The closer they stood to the door, the prouder they looked. The pages in slippers were so grand you could hardly bear to see them.
        - id: ch04-b26
          speaker: gerda
          text: That sounds awful. Did Kay win the princess?
        - id: ch04-b27
          speaker: forest_crow
          text: If I weren't a crow, and already engaged, I'd have married her myself. The boy spoke as easily as I do in crow language. My sweetheart heard it all. He said he hadn't come to court the princess. He only wanted to hear her wisdom. He liked her, and she liked him.
        - id: ch04-b28
          speaker: gerda
          text: Of course it was Kay! He's so clever. He can do arithmetic in his head, even fractions. Will you take me to the palace?
        - id: ch04-b29
          speaker: forest_crow
          text: Asking is easy. Doing it is harder. I'll speak to my sweetheart and ask her advice. A little girl like you will have a difficult time getting permission to enter.
        - id: ch04-b30
          speaker: gerda
          text: I'll get permission. Once Kay hears I'm here, he'll come outside and bring me in himself.
        - id: ch04-b31
          speaker: forest_crow
          text: Wait here by the fence.
        - id: ch04-b32
          speaker: narrator
          text: The crow flew away and did not return until late evening.
        - id: ch04-b33
          speaker: forest_crow
          text: Caw, caw! My sweetheart sends her greetings. She took this little roll from the kitchen for you. There's plenty of bread there, and she knew you'd be hungry. You can't use the front entrance. The silver guards and golden servants would stop you. But don't cry. We'll find another way. My sweetheart knows a back staircase to the royal bedrooms, and she knows where the key is kept.
        - id: ch04-b34
          speaker: narrator
          text: They entered the garden through a broad avenue. Leaves fell one after another, and lights in the palace went out one by one. The crow led Gerda to a back door standing slightly open. Her heart beat with fear and longing. She felt as if she were doing wrong, though she only wanted to know whether Kay was there.
        - id: ch04-b35
          speaker: gerda
          text: It must be him. He has those clear eyes and that long hair.
        - id: ch04-b36
          speaker: narrator
          text: She imagined that she could already see his old smile, the smile he had worn at home when they sat together among the roses. Surely he would be glad to see her. He would listen while she told him how far she had come for his sake, and he would learn how deeply everyone at home had grieved when he failed to return. The closer she came to the bedroom, the more joy and fear filled her together.
        - id: ch04-b37
          speaker: narrator
          text: At the top of the stairs, a lamp burned in a small room. The palace crow stood in the center, turning her head from side to side. Gerda curtsied as her grandmother had taught her.
        - id: ch04-b38
          speaker: palace_crow
          text: My betrothed has told me so much about you, young lady. Your life story, your “vita,” is very touching. Take the lamp, and I'll lead the way. If we go straight ahead, we won't meet anyone.
        - id: ch04-b39
          speaker: gerda
          text: I think someone is behind us.
        - id: ch04-b40
          speaker: narrator
          text: Something rushed behind them like a shadow sliding over the wall. Then came horses with flying manes and thin legs. Hunters followed, along with ladies and gentlemen on horseback. They all glided past as flat shadows, silent and swift.
        - id: ch04-b41
          speaker: palace_crow
          text: Those are only dreams. They've come to carry the royal people's thoughts out hunting.
        - id: ch04-b42
          speaker: palace_crow
          text: That's good for us. We can see them safely in their beds. And if you ever rise to honor and favor, I trust you'll remember your friends.
        - id: ch04-b43
          speaker: forest_crow
          text: You can be certain of that.
        - id: ch04-b44
          speaker: narrator
          text: They entered the first hall. Rose-colored satin covered the walls, embroidered all over with artificial flowers. The dreams flashed past again, too quickly for Gerda to recognize any of the royal people whose thoughts they carried. Each hall they crossed was more splendid than the last, until all that grandeur was enough to confuse anyone. At last they reached a bedroom. Its ceiling spread overhead like a huge palm tree, and the palm leaves were made from the finest crystal. In the middle of the room, two beds shaped like lilies hung from stems of gold. The princess slept in the white lily. The other lily was red, and there Gerda had to search for Kay.
        - id: ch04-b45
          speaker: narrator
          text: She pushed aside a red petal and saw a small brown neck.
        - id: ch04-b46
          speaker: gerda
          text: Kay!
        - id: ch04-b47
          speaker: narrator
          text: Gerda held the lamp over the sleeper. At once, the dreams galloped back into the bedroom. He woke and turned his head toward her. It was not Kay. From behind, the prince's brown neck had only looked like Kay's. He was young and handsome, but he was not her friend. The princess raised her head from the white lily bed and asked what had happened. Gerda could not hold back her tears. She told the prince and princess her whole story, then explained everything the two crows had risked to bring her there.
        - id: ch04-b48
          speakers: [prince, princess]
          ensemble: duo
          text: You poor child.
        - id: ch04-b49
          speaker: narrator
          text: They praised the crows and said they were not angry, though the crows must never do such a thing again. This time, they would receive a reward.
        - id: ch04-b50
          speaker: princess
          text: Would you rather be free, or become official palace crows and have everything left over from the kitchen?
        - id: ch04-b51
          speaker: narrator
          text: Both crows bowed very low. They chose permanent court positions instead of freedom. Each had begun to think about growing old, and they agreed it would be comforting to know that the palace kitchen would provide for them in their later years.
        - id: ch04-b52
          speaker: narrator
          text: The prince climbed out of his own bed and gave it to Gerda. There was nothing more he could do for her that night. She lay down among the red petals and folded her small hands. She thought about how kind everyone had been to her, people and animals alike. Then she closed her eyes and fell into a sweet sleep. All the dreams came flying back. Now they looked like angels, and one of them pulled a tiny sled. Kay sat upon it and nodded to her. But that vision was only a dream, and it vanished the moment Gerda woke.
        - id: ch04-b53
          speaker: narrator
          text: The next day, servants dressed Gerda from head to foot in silk and velvet. The prince and princess invited her to remain at the palace for several days and enjoy herself. Gerda did not want to stop. She asked only for a pair of boots, a small carriage, and a horse to pull it so she could keep traveling through the world in search of Kay. They gave her the boots, a warm muff, and a complete set of fine clothes. When she was ready, she found a coach of pure gold waiting at the door. The coat of arms belonging to the prince and princess shone on its side like a star. The coachman, the footman, and the outriders all wore golden crowns on their heads.
        - id: ch04-b54
          speaker: narrator
          text: The prince and princess helped Gerda into the golden coach with their own hands and wished her success. The forest crow, who was now married, traveled beside her for the first three miles. He sat at Gerda's side because he could not bear the feeling of riding backward. His palace sweetheart remained in the doorway, flapping her wings. Ever since receiving her court position, she had eaten too much and developed a headache, so she could not come. The coach was well supplied for the journey. Sweet cakes filled one compartment, while fruit and gingerbread nuts were stored beneath the seat.
        - id: ch04-b55
          speakers: [prince, princess]
          ensemble: duo
          text: Farewell! Farewell!
        - id: ch04-b56
          speaker: narrator
          text: Gerda wept, and the forest crow wept too. After a few miles, he had to leave her.
        - id: ch04-b57
          speaker: forest_crow
          text: Farewell, Gerda!
          emotion: sad
        - id: ch04-b58
          speaker: narrator
          text: It was the saddest parting. He flew into a tree and beat his black wings until the golden coach, glittering in the sunshine, disappeared from sight.
    - id: ch05
      title: FIFTH STORY
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The coach entered a thick forest. Its golden sides lit the road like a torch and flashed in the eyes of some robbers, who could not bear to let such treasure pass untouched.
        - id: ch05-b02
          speakers: [robber_one, robber_two]
          ensemble: duo
          text: Gold! It's gold!
        - id: ch05-b03
          speaker: narrator
          text: They rushed forward and seized the horses. They killed the small outriders, the coachman, and the footman, then dragged Gerda from the carriage.
        - id: ch05-b04
          speaker: robber_woman
          text: She's plump and pretty, and she's been fed on nut kernels. Tender as a little lamb. She'll taste delicious!
        - id: ch05-b05
          speaker: narrator
          text: The old robber woman had a long beard and eyebrows hanging over her eyes. She pulled out a shining knife. At that very moment, she screamed. Her own daughter, clinging to her back, had bitten her ear. The daughter was wild and badly behaved. Her mother called her an ugly creature and forgot about killing Gerda for the moment.
        - id: ch05-b06
          speaker: robber_girl
          text: She's going to play with me. She'll give me her muff and her pretty dress, and she'll sleep in my bed.
        - id: ch05-b07
          speaker: narrator
          text: The robber girl bit her mother again, making her jump and twist. All the robbers laughed at the dance between the woman and her young cub.
        - id: ch05-b08
          speaker: robber_girl
          text: I'm riding in the coach.
        - id: ch05-b09
          speaker: narrator
          text: She always had her way because she was stubborn and strong-willed. She and Gerda climbed into the coach and drove over stones and tree stumps, deeper into the forest. The robber girl was about Gerda's size but stronger, with broad shoulders, dark skin, and black eyes that looked mournful. She wrapped an arm around Gerda's waist.
        - id: ch05-b10
          speaker: robber_girl
          text: They won't kill you as long as you don't make us angry. You must be a princess.
        - id: ch05-b11
          speaker: gerda
          text: No, I'm not.
        - id: ch05-b12
          speaker: narrator
          text: Gerda told her the whole story and explained how dearly she loved Kay. The robber girl stared at her, then gave a small nod.
        - id: ch05-b13
          speaker: robber_girl
          text: They won't kill you even if I do get angry. I'll kill you myself.
        - id: ch05-b14
          speaker: narrator
          text: Then she wiped Gerda's eyes and thrust her own hands into the beautiful soft muff.
        - id: ch05-b15
          speaker: narrator
          text: The coach stopped in the courtyard of a robber castle. Deep cracks ran through its walls from top to bottom. Ravens and crows flew in and out through every hole and crevice. Great bulldogs jumped around below. Each dog looked large enough to swallow a man, though they had been trained not to bark. Inside was one large, smoky hall. A bright fire burned directly on the stone floor. There was no chimney, so the smoke rose to the ceiling and found whatever path it could to the outside. Soup bubbled in a huge iron pot. Hares and rabbits turned slowly on a roasting spit beside it.
        - id: ch05-b16
          speaker: robber_girl
          text: Tonight you'll sleep with me and all my little animals.
        - id: ch05-b17
          speaker: narrator
          text: After everyone had eaten and drunk, the robber girl led Gerda to her sleeping place in one corner of the hall. Straw and old carpets had been spread over the floor. More than a hundred pigeons sat above them on thin wooden strips and perches. All of the birds seemed to be asleep, though they shifted and rustled a little when the two girls came near.
        - id: ch05-b18
          speaker: robber_girl
          text: Every one of these pigeons is mine.
        - id: ch05-b19
          speaker: narrator
          text: She grabbed the nearest pigeon by its feet and shook it until its wings flapped.
        - id: ch05-b20
          speaker: robber_girl
          text: Kiss it!
        - id: ch05-b21
          speaker: narrator
          text: She beat its wings against Gerda's face, then pointed to a cage fixed high on the wall.
        - id: ch05-b22
          speaker: robber_girl
          text: Those two are wood pigeons. The little rascals would fly away at once if I didn't lock them up. And here's my old sweetheart, Ba!
        - id: ch05-b23
          speaker: narrator
          text: She dragged out a reindeer by one antler. A bright copper ring circled his neck, and a rope held him fast.
        - id: ch05-b24
          speaker: robber_girl
          text: We have to keep him tied, or he'd run away too. Every night I tickle his neck with my sharp knife. It frightens him so much.
        - id: ch05-b25
          speaker: narrator
          text: She took a long knife from a crack in the wall and slid it gently over the reindeer's neck. The poor animal kicked. The robber girl laughed and pulled Gerda down into bed.
        - id: ch05-b26
          speaker: gerda
          text: Are you keeping that knife with you while you sleep?
          emotion: fearful
        - id: ch05-b27
          speaker: robber_girl
          text: I always sleep with it. You never know what might happen. Now tell me about Kay again, and why you went out into the world.
        - id: ch05-b28
          speaker: narrator
          text: Gerda told the story once more, from Kay's disappearance to her capture in the forest. The two wood pigeons cooed in their cage above her, and all the other birds slept. The robber girl stretched one arm across Gerda's neck. She kept the long knife in her other hand, but soon she was sound asleep and snoring. Gerda could not close her eyes at all. She had no way to know whether she would still be alive in the morning. Around the open fire, the robbers went on drinking and singing. Their old leader stumbled back and forth among them. For a little girl lying awake beneath a knife, it was a terrible sight.
        - id: ch05-b29
          speakers: [wood_pigeon_one, wood_pigeon_two]
          ensemble: duo
          text: Coo, coo. We saw Kay. A white bird carried his sled, and Kay sat in the Snow Queen's carriage. They passed through the forest while we were in our nest. The queen breathed on us, and all our young ones died. Only we two survived. Coo, coo.
          emotion: sad
        - id: ch05-b30
          speaker: gerda
          text: What are you saying? Where was the Snow Queen going? Do you know?
        - id: ch05-b31
          speakers: [wood_pigeon_one, wood_pigeon_two]
          ensemble: duo
          text: Most likely she was going to Lapland. There is always snow and ice there. Ask the reindeer tied with the rope.
        - id: ch05-b32
          speaker: reindeer
          text: Yes, Lapland is always covered in snow and ice. It's a glorious place, where you can leap and run freely over the shining plains. The Snow Queen keeps her summer tent there. Her great castle stands farther north, on an island called Spitzbergen.
        - id: ch05-b33
          speaker: gerda
          text: Oh, Kay. My dear Kay.
          emotion: sad
        - id: ch05-b34
          speaker: robber_girl
          text: Lie still, or I'll stick my knife into you.
        - id: ch05-b35
          speaker: narrator
          text: In the morning, Gerda repeated what the pigeons had said. The robber girl listened seriously and nodded.
        - id: ch05-b36
          speaker: robber_girl
          text: That's only talk. Do you know where Lapland is?
        - id: ch05-b37
          speaker: reindeer
          text: Who would know better than me? I was born and raised there. I used to race over those snowy plains.
        - id: ch05-b38
          speaker: robber_girl
          text: Listen. All our men have gone out. Only Mother is here, and she won't leave. At noon she drinks from a big bottle. After that, she sleeps for a while. Then I'll do something for you.
        - id: ch05-b39
          speaker: narrator
          text: She jumped from bed, hugged her mother around the neck, and pulled at her beard.
        - id: ch05-b40
          speaker: robber_girl
          text: Good morning, my own little nanny goat!
        - id: ch05-b41
          speaker: narrator
          text: Her mother snapped a finger against her nose until it turned red, but that was how they showed affection.
        - id: ch05-b42
          speaker: narrator
          text: When the mother had emptied the bottle and fallen asleep, the robber girl went to the reindeer.
        - id: ch05-b43
          speaker: robber_girl
          text: I'd like to tickle your neck a few more times because you look so funny when I do it. But never mind. I'll cut your rope and let you run home to Lapland. You must use those legs well and carry Gerda to the Snow Queen's castle, where Kay is being held. You heard her story. She spoke loudly enough, and you were listening.
        - id: ch05-b44
          speaker: narrator
          text: The reindeer leaped for joy. The robber girl lifted Gerda onto his back, tied her securely, and even gave her a small cushion.
        - id: ch05-b45
          speaker: robber_girl
          text: Here are your fur boots. You'll need them in the cold. I'm keeping the muff because it's so pretty. But you won't freeze. Take my mother's big warm mittens. They reach right up to your elbows. Let me put them on. There! Now your hands look just like hers.
        - id: ch05-b46
          speaker: narrator
          text: Gerda wept with joy.
        - id: ch05-b47
          speaker: robber_girl
          text: I don't like seeing you cry. You should look happy now. Here are two loaves of bread and a ham, so you won't starve.
        - id: ch05-b48
          speaker: narrator
          text: The robber girl fastened the bread and ham securely to the reindeer's back. Then she opened the castle door and patiently coaxed all the huge dogs into the hall so they could not chase him. At last, she lifted the same sharp knife that had frightened Gerda and the reindeer all night. With one stroke, she cut through the rope that held him.
        - id: ch05-b49
          speaker: robber_girl
          text: Run now, and take good care of that little girl.
        - id: ch05-b50
          speaker: gerda
          text: Farewell!
        - id: ch05-b51
          speaker: narrator
          text: Gerda reached one arm back toward the robber girl. The enormous mitten covered it almost to the elbow. Then the reindeer sprang forward. He flew across stones and tree stumps, through the deepest part of the forest, and over broad marshes and open plains. Wolves howled along their path, while ravens screamed overhead. High in the dark sky, red lights trembled and quivered like great flames.
        - id: ch05-b52
          speaker: reindeer
          text: Those are my old northern lights. See how they flash!
        - id: ch05-b53
          speaker: narrator
          text: He ran faster and faster, all day and all night. By the time they reached Lapland, the bread and ham were gone.
    - id: ch06
      title: SIXTH STORY
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last they stopped before a poor little hut. The sloping roof came down so close to the ground that there were hardly any walls to see. Its door was lower still. Everyone who entered or left had to crawl on hands and knees. No one was home except an old Lapland woman, who sat cooking fish by the dim light of an oil lamp.
        - id: ch06-b02
          speaker: narrator
          text: The reindeer told her Gerda's story, though he began with his own because he considered that more important. Gerda was too numb with cold to speak.
        - id: ch06-b03
          speaker: lapland_woman
          text: Oh, you poor creatures. You still have a long journey. Finland lies more than a hundred miles from here. The Snow Queen is living there now, and every evening she burns colored lights. I'll write a few words on this dried cod, since I have no paper. Take it to the Finland woman. She can tell you more than I can.
        - id: ch06-b04
          speaker: narrator
          text: Once Gerda was warm and had eaten and drunk, the woman wrote her message on the dried fish and told Gerda to guard it carefully. Then she tied Gerda onto the reindeer again, and he raced away. Blue northern lights flashed beautifully in the sky through the whole night.
        - id: ch06-b05
          speaker: narrator
          text: At last they reached Finland and found the hut belonging to the Finland woman. Since there was no doorway above the ground, they knocked on the chimney. They crawled inside and met heat as fierce as an oven. The woman herself was small and rather dirty, and the room was so hot that she wore almost no clothing. She quickly loosened Gerda's dress and pulled off the fur boots and heavy mittens. Otherwise, Gerda could not have endured the heat. Then the woman laid a chunk of ice on the reindeer's head to cool him and took the dried fish so she could read the message.
        - id: ch06-b06
          speaker: narrator
          text: After reading the message three times, the Finland woman knew it by heart. She dropped the cod into her soup because it was good to eat, and she never wasted anything. Again the reindeer told his own story first, then Gerda's. The woman listened with clever, twinkling eyes but said nothing.
        - id: ch06-b07
          speaker: reindeer
          text: You're very wise. I know you can tie every wind in the world with one piece of string. A sailor unties the first knot and gets a fair wind. The second brings a hard wind. If he loosens the third and fourth, a storm comes strong enough to tear up forests. Can't you give Gerda something that will make her as strong as twelve men, so she can defeat the Snow Queen?
        - id: ch06-b08
          speaker: finland_woman
          text: The strength of twelve men? That would be almost no help at all.
        - id: ch06-b09
          speaker: narrator
          text: The Finland woman went to a shelf, took down a large rolled skin, and spread it open. Strange and wonderful characters covered its surface. She studied them for so long and so deeply that sweat ran down her forehead. Still the reindeer begged her to help Gerda. Gerda did not speak, but she looked at the woman with tearful, pleading eyes. At last the clever eyes began to twinkle again. The woman drew the reindeer into a corner where Gerda would not hear them. She laid another piece of ice on his hot head and began to whisper.
        - id: ch06-b10
          speaker: finland_woman
          text: Kay truly is with the Snow Queen. Everything there seems exactly right to him, and he believes it is the finest place in the world. He thinks that because a splinter of broken glass is lodged in his heart and another is in his eye. Both pieces must come out. Until then, he cannot become human again, and the Snow Queen will keep her power over him.
        - id: ch06-b11
          speaker: reindeer
          text: Then can't you give Gerda something that will help her break that power?
        - id: ch06-b12
          speaker: finland_woman
          text: I cannot give her more power than she already has. Can't you see how strong it is? People and animals have chosen to help her. Look how far she has traveled through the world, even barefoot. Her power comes from her own pure, innocent heart, and I have nothing greater to give. She must reach the Snow Queen herself and remove the glass from Kay. If she cannot do that, none of us can help her.
        - id: ch06-b13
          speaker: finland_woman
          text: The Snow Queen's garden begins two miles from here. Carry Gerda that far. Set her down beside the large bush with red berries standing in the snow. Don't stay there talking. Come straight back.
        - id: ch06-b14
          speaker: narrator
          text: The Finland woman lifted Gerda onto the reindeer, and he ran as fast as he could.
        - id: ch06-b15
          speaker: gerda
          text: Oh! I forgot my boots and mittens!
          emotion: surprised
        - id: ch06-b16
          speaker: narrator
          text: The cutting cold struck her, but the reindeer dared not stop. He ran until they reached the bush with red berries. There he set Gerda down and kissed her. Large bright tears rolled over his cheeks. Then he turned and hurried back.
        - id: ch06-b17
          speaker: narrator
          text: Gerda stood alone beside the red-berried bush. She had no shoes and no gloves, and all around her stretched the cold, dreary, ice-bound land of Finland. She began running forward as quickly as her bare feet could carry her. Before long, a whole regiment of snowflakes came racing toward her. These flakes did not fall from the sky. Overhead, the air remained perfectly clear and glittered with northern lights. Instead, the flakes rushed over the frozen ground. The closer they came, the larger they grew.
        - id: ch06-b18
          speaker: narrator
          text: Gerda remembered the lovely snow crystals beneath Kay's magnifying glass. These were larger and far more terrible. They were alive. They were the Snow Queen's guards. Some looked like huge porcupines. Others were twisted snakes with reaching heads. Some were small fat bears with bristling fur. Every one was dazzling white and made of living snow.
        - id: ch06-b19
          speaker: narrator
          text: Gerda began to say the Lord's Prayer. The cold was so deep that she could see every breath and every word leave her mouth like steam. As she continued to pray, the steam did not disappear. It gathered and thickened, taking the shapes of little angels. The instant each angel touched the earth, it grew large. Helmets covered their heads, and they carried both spears and shields. Every new breath brought more of them. By the time Gerda reached the end of her prayer, a whole shining army stood around her.
        - id: ch06-b20
          speaker: narrator
          text: The angels drove their spears into the terrible snow guards, shattering them into hundreds of pieces. Gerda could move ahead safely and bravely. The angels stroked her hands and feet until the cold hurt less. She hurried toward the Snow Queen's castle.
        - id: ch06-b21
          speaker: narrator
          text: But now we must look at Kay. He was not thinking of Gerda at all. He never imagined that she might already be standing outside the palace.
    - id: ch07
      title: SEVENTH STORY
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The palace walls were made from great banks of drifted snow. Cutting winds formed its doors and windows. It held more than a hundred rooms, all shaped as though snow had been blown together to make them. No two rooms were alike. The largest hall stretched for several miles. The vivid northern lights shone through every opening and filled the palace with their sharp, flickering glow. Each room was enormous and glittering. Each was also utterly empty and bitterly cold.
        - id: ch07-b02
          speaker: narrator
          text: There were no amusements anywhere. Not even a little dance for bears, with the storm providing music while they stood on their back legs and showed off their good manners. There were no pleasant games of snapdragon and no games of tag. Not even a tea table stood ready for young lady foxes to gather around and gossip. The Snow Queen's halls were empty, vast, and cold. From every part of the palace, one could watch the flame of the northern lights rise high or sink low in the sky.
        - id: ch07-b03
          speaker: narrator
          text: In the middle of the largest, emptiest hall lay a frozen lake. Its hard surface had cracked into a thousand different forms. Every piece was perfect in itself, like a tiny work of art, and yet each one closely resembled the others. Whenever the Snow Queen was at home, she sat alone at the very center of that lake. She called it the Mirror of Reason. In her judgment, it was not simply the best mirror in the world. It was the only mirror that deserved the name.
        - id: ch07-b04
          speaker: narrator
          text: Kay was blue with cold, almost black, but he felt nothing. The Snow Queen's kisses had taken away his shivers, and his heart was already a lump of ice. He dragged sharp, flat pieces of ice across the lake and arranged them in different patterns, much as children make figures with wooden puzzle pieces.
        - id: ch07-b05
          speaker: narrator
          text: Kay's fingers worked very skillfully at that icy game of reason. He moved the pieces back and forth and fitted their perfect edges together. Because the splinter of glass still lay in his eye, every new pattern seemed remarkable to him and more important than anything else. He built many complete figures and arranged the ice into different words. But there was one word he could never make, though he wanted to solve it more than any other. That word was “Eternity.”
        - id: ch07-b06
          speaker: snow_queen
          text: When you solve that word, you'll be your own master. I'll give you the whole world and a new pair of skates.
        - id: ch07-b07
          speaker: narrator
          text: Kay tried one arrangement after another. He shifted the sharp ice pieces, broke his figures apart, and began again. No matter how deeply he thought or how carefully he worked, he could not make them form the word.
        - id: ch07-b08
          speaker: snow_queen
          text: Now I must hurry to warmer countries. I'm going to look inside the black craters of the burning mountains called Etna and Vesuvius. I'll cover them in white. That will be good for them, and good for the lemons and grapes too.
        - id: ch07-b09
          speaker: narrator
          text: She flew away, leaving Kay alone in the great hall that stretched for miles. He stared at the ice pieces and thought so deeply, sitting so still, that anyone might have believed he was frozen.
        - id: ch07-b10
          speaker: narrator
          text: At that moment, Gerda entered through the palace's great door. Cutting winds raged around her. She prayed, and the winds sank down as though falling asleep. Gerda walked on until she reached the vast, empty hall and saw Kay. She knew him at once. She ran to him, threw her arms around his neck, and held him tightly.
        - id: ch07-b11
          speaker: gerda
          text: Kay! Dear Kay, I've finally found you!
          emotion: happy
        - id: ch07-b12
          speaker: narrator
          text: Kay stayed stiff, cold, and silent. Gerda began to cry. Her hot tears fell onto his chest and reached his heart. They melted the lump of ice and washed away the glass fragment buried there. Kay looked at her, and Gerda sang their old hymn.
        - id: ch07-b13
          speaker: gerda
          text: Roses bloom and cease to be, but we shall the Christ-child see.
        - id: ch07-b14
          speaker: narrator
          text: Kay burst into tears. He cried until the splinter in his eye floated out with them. Then he knew Gerda.
        - id: ch07-b15
          speaker: kay
          text: Gerda! Dear Gerda! Where have you been all this time? And where have I been?
          emotion: surprised
        - id: ch07-b16
          speaker: narrator
          text: He looked around the hall.
        - id: ch07-b17
          speaker: kay
          text: It's so cold here. Everything is so huge and empty.
        - id: ch07-b18
          speaker: narrator
          text: Kay clung tightly to Gerda. She laughed and cried at the same time because her joy was too great for only one. The sight of them together was so wonderful that even the sharp pieces of ice seemed delighted. They began to dance around the two children. At last the ice pieces grew tired and lay down. As they settled, they arranged themselves into the letters of the very word Kay had been ordered to discover before he could become his own master and receive the whole world and a pair of new skates. The shining word was “Eternity.”
        - id: ch07-b19
          speaker: narrator
          text: Gerda kissed Kay's cheeks, and their color returned. She kissed his eyes, and they shone like hers. She kissed his hands and feet, and he became healthy and cheerful again. The Snow Queen could return whenever she pleased. Kay's freedom stood before them, written in shining letters of ice.
        - id: ch07-b20
          speaker: narrator
          text: Kay and Gerda took each other by the hand and walked out of the vast ice palace. As they traveled, they spoke about Grandmother and remembered the roses growing on the roof between their windows. The fierce winds remained at rest, and the sun suddenly broke through. When the children reached the bush with red berries, their faithful reindeer stood waiting. He had brought a young female reindeer with him, and she was full of warm milk. Kay and Gerda drank until they were warm inside, then kissed the gentle animal on the mouth.
        - id: ch07-b21
          speaker: narrator
          text: The two reindeer carried Kay and Gerda first to the Finland woman. In her burning-hot room, the children warmed themselves completely, and she gave them careful directions for the long journey home. Next they traveled to the little hut of the Lapland woman. While Gerda had been away, she had made fresh clothes for both children and put their sleds into good order. The two reindeer ran beside them after they left. They followed all the way to the edge of the northern country, where snow gave way to earth and the first green leaves were beginning to open.
        - id: ch07-b22
          speakers: [kay, gerda, reindeer, lapland_woman]
          ensemble: chorus
          text: Farewell!
        - id: ch07-b23
          speaker: narrator
          text: The children parted from the two reindeer and the Lapland woman. Birds began to sing, and young green leaves filled the forest. A beautiful horse came out from among the trees. Gerda recognized it as one that had pulled the golden coach. A young girl rode it, wearing a shining red cap and pistols at her belt. It was the robber girl. She had grown tired of home and meant to travel north first. If she did not like it there, she would try some other part of the world. She recognized Gerda at once, and Gerda knew her. Their meeting was joyful.
        - id: ch07-b24
          speaker: robber_girl
          text: So you're the fine fellow who went wandering off! I wonder whether you deserve to have someone travel to the end of the world to find you.
        - id: ch07-b25
          speaker: narrator
          text: Gerda patted the robber girl's cheeks and asked about their friends.
        - id: ch07-b26
          speaker: robber_girl
          text: The prince and princess have gone to foreign lands.
        - id: ch07-b27
          speaker: gerda
          text: And the crow?
        - id: ch07-b28
          speaker: robber_girl
          text: The forest crow died. His tame sweetheart is a widow now. She wears a bit of black yarn around her leg and mourns terribly, though it's all nonsense. But tell me, how did you get Kay back?
        - id: ch07-b29
          speaker: narrator
          text: Gerda and Kay told her everything that had happened.
        - id: ch07-b30
          speaker: robber_girl
          text: Snip, snap, snare! Then everything came right in the end.
        - id: ch07-b31
          speaker: narrator
          text: She took both their hands and promised to visit if she ever passed through their town. Then she rode away into the wide world.
        - id: ch07-b32
          speaker: narrator
          text: Kay and Gerda continued toward home, still walking hand in hand. With every mile they traveled, spring grew lovelier around them. Green plants rose beside the road, and beautiful flowers opened in the sunlight. Before long, the children recognized the large town where they had lived. They saw the tall steeples of its churches, and sweet bells rang a joyful peal as they passed through the streets and found their way back to Grandmother's door.
        - id: ch07-b33
          speaker: narrator
          text: They climbed the long stairs to the familiar little room. Everything looked just as it had when they were children. The old clock went on saying tick, tick, and its hands pointed faithfully to the time of day. Yet when Kay and Gerda passed through the doorway and stood inside the room, they realized that something had changed. During their long journey, they had both grown up. Kay was a man now, and Gerda was a woman.
        - id: ch07-b34
          speaker: narrator
          text: Outside, the roses on the roof were in full bloom. Their branches reached around the window, and the blossoms seemed to peep into the room. The two little chairs where Kay and Gerda had sat as children still stood in their old places. Each took the familiar chair that had once belonged to them, and they held hands between the two seats. As they sat there together, the cold and empty splendor of the Snow Queen's palace slipped from their memories. It faded like a long, painful dream after waking.
        - id: ch07-b35
          speaker: narrator
          text: Grandmother sat near them in God's bright sunshine. Just as she had done before their journey began, she opened the Bible and read its words aloud.
        - id: ch07-b36
          speaker: grandmother
          text: Unless you become like little children, you will never enter the kingdom of God.
        - id: ch07-b37
          speaker: narrator
          text: Kay and Gerda turned and looked into each other's eyes. In that moment, the words of the old song they had sung beneath the rooftop roses came back to them. All at once, they understood what those words meant.
        - id: ch07-b38
          speakers: [kay, gerda]
          ensemble: duo
          text: Roses bloom and cease to be, but we shall the Christ-child see.
        - id: ch07-b39
          speaker: narrator
          text: So there they sat together, a grown man and a grown woman, yet still children at heart. Outside the roses opened in the sunlight. It was summer at last, warm, bright, and beautiful summer.
