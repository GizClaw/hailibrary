audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温和克制，带着童话讲述者若有所思的语气
        timbre: 温暖清澈
        pace: 舒缓而有起伏
        pitch: 中音
    fir_tree:
      display_name: 枞树
      tts:
        delivery: 年轻急切，常被憧憬牵着走，后段渐显苍凉
        timbre: 清亮而纤细
        pace: 稍快，沉思时放慢
        pitch: 中高音
    stork:
      display_name: 鹳
      tts:
        delivery: 见多识广，回答简洁爽利
        timbre: 明亮略高
        pace: 利落
        pitch: 中高音
    sunbeam:
      display_name: 阳光
      tts:
        delivery: 温柔明朗，像轻声劝慰
        timbre: 轻盈柔和
        pace: 从容
        pitch: 中高音
    sparrows:
      display_name: 麻雀们
      tts:
        delivery: 叽叽喳喳，兴奋而好奇
        timbre: 清脆活泼
        pace: 轻快
        pitch: 高音
    swallows:
      display_name: 燕子们
      tts:
        delivery: 轻快清脆，彼此呼应着鸣唱
        timbre: 纤细明亮
        pace: 轻快
        pitch: 高音
    air_and_sunlight:
      display_name: 空气和阳光
      tts:
        delivery: 明净亲切，带着自然的安抚
        timbre: 柔和通透
        pace: 舒展
        pitch: 中高音
    man:
      display_name: 院中的男人
      tts:
        delivery: 平实随意，像在挑选货物
        timbre: 浑厚清楚
        pace: 平稳
        pitch: 中低音
    young_ladies:
      display_name: 年轻小姐们
      tts:
        delivery: 欣喜热切，彼此呼应
        timbre: 明亮轻柔
        pace: 轻快
        pitch: 中高音
    children:
      display_name: 孩子们
      tts:
        delivery: 天真热闹，情绪来得直接
        timbre: 清脆稚嫩
        pace: 活泼
        pitch: 高音
    storyteller:
      display_name: 讲故事的老先生
      tts:
        delivery: 和善风趣，懂得吊孩子们的胃口
        timbre: 圆润温厚
        pace: 不紧不慢
        pitch: 中低音
    mouse:
      display_name: 小老鼠
      tts:
        delivery: 胆小好奇，说话机灵亲近
        timbre: 细小明快
        pace: 稍快
        pitch: 高音
    mice:
      display_name: 小老鼠们
      tts:
        delivery: 好奇热烈，听故事时满是惊叹
        timbre: 轻细活泼
        pace: 轻快
        pitch: 高音
    rats:
      display_name: 大老鼠们
      tts:
        delivery: 挑剔自负，说话一本正经
        timbre: 粗哑低沉
        pace: 稍慢
        pitch: 低音
    youngest_child:
      display_name: 最小的孩子
      tts:
        delivery: 直率无心，想到什么就说什么
        timbre: 稚嫩清亮
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 总盼着长大的小枞树
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            森林深处有个温暖清新的地方，那里长着一棵秀气的小枞树。阳光照着它，柔风拂着它，乡下孩子说笑着从旁边经过。孩子们有时带来一篮覆盆子或草莓，那些果子还用麦秆串成了花环。他们坐在树旁夸它漂亮。可小枞树什么都不在意，听见夸奖反而更加难过。它只想快点长高，变得像周围的松树和枞树一样高大。
        - id: ch01-b02
          speaker: narrator
          text: >-
            枞树每年都会长高一节。数树干上的节，就能知道它的年纪。它明明一直在长，却还是不停抱怨。
        - id: ch01-b03
          speaker: fir_tree
          text: >-
            我真想和别的树一样高！那时，我要把枝条伸向四面八方，让树梢望见整个世界。鸟儿会来筑巢，风吹过时，我也能像那些高大的伙伴一样，庄严地俯身点头。
        - id: ch01-b04
          speaker: narrator
          text: >-
            它满心不知足，看不见温暖的日光、林中的鸟儿，也看不见早晚飘过头顶的玫瑰色云霞。冬天，白雪铺满地面，亮晶晶的。一只野兔有时会蹦过来，从小树顶上一跃而过。枞树觉得受尽了羞辱。两个冬天过去，第三年冬天，野兔已经只能绕着它跑了。可它依旧不满足，只盼着快点变高，也快点变老。
        - id: ch01-b05
          speaker: fir_tree
          text: >-
            要是我能一直长高，一直长大，那该多好！世上还有什么事比这更值得在意呢？
        - id: ch01-b06
          speaker: narrator
          text: >-
            秋天，伐木人照例来到林中，砍倒几棵最高的大树。那些气派的树轰然落地，年轻的枞树吓得直发抖。树枝被砍光后，留下的树干又细又秃，几乎认不出原来的样子。它们被装上大车，由马拉走。枞树很想知道，它们要去哪里，以后又会怎样。第二年春天，燕子和鹳飞回来了，它赶紧打听那些树的下落。
        - id: ch01-b07
          speaker: fir_tree
          text: >-
            你们在路上见过它们吗？知道它们被运到哪儿去了吗？
        - id: ch01-b08
          speaker: narrator
          text: >-
            燕子什么也不知道。鹳想了一会儿，点了点头。
        - id: ch01-b09
          speaker: stork
          text: >-
            我想，我见过。离开埃及往回飞时，我碰见几艘新船。船上的桅杆很好看，还带着枞木的香气。准是那些树。它们看上去可真神气，神气极了。
        - id: ch01-b10
          speaker: fir_tree
          text: >-
            我多想长得足够高，也到海上去！海到底是什么？看起来是什么样？
        - id: ch01-b11
          speaker: stork
          text: >-
            这可不是一会儿能说清的。
        - id: ch01-b12
          speaker: narrator
          text: >-
            鹳说完便飞走了。阳光看着小枞树，轻轻劝它。
        - id: ch01-b13
          speaker: sunbeam
          text: >-
            趁着年轻，好好欢喜吧。看看你新长的枝叶，也感受一下身体里这股年轻的生命吧。
        - id: ch01-b14
          speaker: narrator
          text: >-
            风吻着树，露珠含着泪水滋润它。可是，枞树一点也没有放在心上。
    - id: ch02
      title: 圣诞节的向往
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            圣诞节快到了。许多年轻的树被人砍下，有的甚至比这棵枞树更小、更年轻。它们因为长得漂亮才被选中，枝条都好好留着。随后，它们也被装上大车，运出了森林。枞树一心想离开自己的家，早就盼得不得安宁。
        - id: ch02-b02
          speaker: fir_tree
          text: >-
            它们要去哪儿？它们一点也不比我高，还有一棵比我矮得多呢。人们为什么不砍掉它们的枝条？到底要把它们带去哪里？
        - id: ch02-b03
          speaker: sparrows
          text: >-
            我们知道！我们从城里人家的窗户往里看过。那些树会被打扮得可漂亮啦！它们站在温暖的屋子中央，身上挂着蜜饼、镀金的苹果、玩具，还有几百支蜡烛。什么好东西都有！
        - id: ch02-b04
          speaker: fir_tree
          text: >-
            然后呢？这些以后还会发生什么？
        - id: ch02-b05
          speaker: sparrows
          text: >-
            再往后，我们没看见。不过，只看见这些就已经够啦。
        - id: ch02-b06
          speaker: narrator
          text: >-
            枞树的每一根枝条都在发颤。它想，自己会不会也遇上这样光辉灿烂的事。那一定比漂洋过海更好。它盼得心都疼了。
        - id: ch02-b07
          speaker: fir_tree
          text: >-
            圣诞节到底什么时候来？我已经和去年那些树一样高，也一样挺拔。真希望我已经躺在车上，或者已经站进那间温暖的屋子，四周全是光彩。树被打扮得那么美，后面准还有更加辉煌的事。到底是什么呢？我实在等不下去了，连自己是怎么了都说不清。
        - id: ch02-b08
          speaker: air_and_sunlight
          text: >-
            别只顾盼着远处。和我们一起欢喜吧，在清新的天地间，好好过你眼前明亮的日子。
        - id: ch02-b09
          speaker: narrator
          text: >-
            枞树不肯听，也不肯为眼前的生活高兴。它一天比一天高，无论冬天还是夏天，森林里都能看见它那一身深绿的枝叶。路过的人见了，总要夸一句，这棵树真美。
        - id: ch02-b10
          speaker: narrator
          text: >-
            圣诞节前不久，林中第一个倒下的就是这棵不知足的枞树。斧头砍穿树干，劈开树心，它呻吟着倒在地上，又痛又晕。到了这一刻，它先前那些幸福的想象全消失了，只为离开森林里的家而伤心。亲爱的老伙伴们，还有身边的小灌木和五彩的花，它可能再也见不到了，也许连鸟儿都见不到了。一路颠簸也毫不愉快。等它回过神来，自己已经和几棵树一起，被卸在一户人家的院子里。
        - id: ch02-b11
          speaker: man
          text: >-
            我们只要一棵。就挑这棵吧，它最漂亮。
    - id: ch03
      title: 最辉煌的一夜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            两个穿着华丽制服的仆人把枞树抬进一间漂亮的大屋子。墙上挂着画，大火炉旁有两只高高的瓷花瓶，瓶盖上还蹲着狮子。屋里摆着摇椅、丝绸长沙发和几张大桌子，桌面堆满图画、书本和各式玩具。孩子们说，至少在他们看来，那些东西样样都值很多钱。枞树被栽进一只装满沙子的大桶。桶的四周围上绿色呢绒，又放在一块漂亮地毯上，谁也看不出下面藏着什么。
        - id: ch03-b02
          speaker: narrator
          text: >-
            枞树抖个不停，不知道下一刻会发生什么。几位年轻小姐来了，仆人们帮她们一起装饰树。彩纸做的小口袋里装满糖果，一个个挂上枝头。旁边还有镀金的苹果和核桃，看起来就像从树上长出来的。几百支红色、蓝色和白色的蜡烛系满枝条，从上到下，到处都是。绿叶底下摆着枞树从未见过的娃娃，个个像真婴儿。最高处安着一颗金属箔做的星星，闪闪发亮。整棵树美极了。
        - id: ch03-b03
          speaker: young_ladies
          text: >-
            等到今晚，它一定会亮得不得了！
          emotion: happy
        - id: ch03-b04
          speaker: fir_tree
          text: >-
            天快点黑吧！蜡烛点起来，我就知道后面还有什么了。森林里的树会不会来看我？麻雀飞过时，会不会从窗外往里瞧？我留在这里，是不是会长得更快，一年四季都戴着这些装饰？
        - id: ch03-b05
          speaker: narrator
          text: >-
            枞树猜个没完，猜得树皮都疼了。纤细的枞树受这种疼，就像人犯了头疼一样难受。终于，所有蜡烛都亮起来。整棵树被光焰照得耀眼夺目。枞树欢喜得浑身发颤，一支蜡烛掉进绿叶间，烧焦了几片叶子。
        - id: ch03-b06
          speaker: young_ladies
          text: >-
            快来呀！着火了，快来呀！
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: >-
            火很快就被扑灭，没有酿成危险。不过，枞树已经吓坏了。从此它拼命忍住颤抖，唯恐碰坏身上任何一件漂亮饰物。眼前的灿烂光彩又让它看得目眩神迷。这时，折叠门猛地打开，一群孩子冲进来，那架势几乎要把树撞倒。大人们安静地跟在后面。孩子们先是惊得说不出话，转眼又齐声欢呼，声音震响了屋子。他们围着树快乐地跳舞，一件又一件取走树上的礼物。
        - id: ch03-b08
          speaker: fir_tree
          text: >-
            他们这是在做什么？接下来呢？接下来还会有什么？
        - id: ch03-b09
          speaker: narrator
          text: >-
            蜡烛越烧越短，一直烧到紧靠树枝的地方，才被吹灭。孩子们终于可以把树上的东西抢个精光了。他们一拥而上，挤得枝条咔嚓作响。要不是树顶那颗亮星连着天花板，枞树早被推倒了。孩子们拿着玩具四处玩耍，没人再看它一眼。只有照看孩子的女仆来翻了翻枝条，看有没有遗漏的苹果或无花果。
        - id: ch03-b10
          speaker: children
          text: >-
            我们要听故事！讲一个故事吧！
        - id: ch03-b11
          speaker: narrator
          text: >-
            孩子们把一个胖墩儿拖到树旁。那位老先生坐在树下。
        - id: ch03-b12
          speaker: storyteller
          text: >-
            这里正好有一片绿荫，连这棵树也能听故事，高兴一下。不过，我今天只讲一个。你们想听《伊维德—阿维德》，还是听《矮胖子》？矮胖子摔下楼梯，很快又爬起来，最后还娶了公主。
        - id: ch03-b13
          speaker: children
          text: >-
            我要听《伊维德—阿维德》！我要听《矮胖子》！
        - id: ch03-b14
          speaker: narrator
          text: >-
            孩子们你喊你的，我叫我的，屋里闹成一片。枞树安静地站着，猜想这件事是不是也和自己有关。其实，它给孩子们的快乐已经够多了。老先生最后讲的是《矮胖子》。他讲矮胖子怎样摔下楼梯，怎样被人扶起来，后来又怎样娶了公主。
        - id: ch03-b15
          speaker: children
          text: >-
            再讲一个吧！我们还想听一个！
        - id: ch03-b16
          speaker: narrator
          text: >-
            孩子们还想听《伊维德—阿维德》，可那一晚，他们只听到了《矮胖子》。枞树沉默下来，陷入了沉思。森林里的鸟儿从来没有讲过这样的事。矮胖子明明摔下楼梯，竟然还能娶到公主。
        - id: ch03-b17
          speaker: fir_tree
          text: >-
            原来世上的事会这样发生。那位先生那么和善，他讲的话一定是真的。谁说得准呢？也许我有一天也会摔倒，然后娶到一位公主。
        - id: ch03-b18
          speaker: narrator
          text: >-
            枞树满怀欢喜地等待第二天晚上。它以为自己还会戴上灯烛、玩具、金子和果实。
        - id: ch03-b19
          speaker: fir_tree
          text: >-
            明天我一定不发抖。我要好好享受这一身华彩，还要再听一次《矮胖子》。说不定，他们也会讲《伊维德—阿维德》。
        - id: ch03-b20
          speaker: narrator
          text: >-
            它安静地想着这些事，整整想了一夜。
    - id: ch04
      title: 阁楼里的故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            早晨，男仆和女仆走进屋子。枞树以为，自己的辉煌又要开始了。可他们把它拖出房间，拉上楼梯，扔进阁楼一个不见阳光的黑暗角落。
        - id: ch04-b02
          speaker: fir_tree
          text: >-
            这是什么意思？把我留在这里做什么？这个地方什么也听不见啊。
        - id: ch04-b03
          speaker: narrator
          text: >-
            日子一天天过去，夜晚也一个个过去，始终没人来。后来总算有人走近，却只是把几只大箱子存进角落。枞树被箱子严严实实地挡住，再也看不见了，就像它从来不曾存在过。它有的是时间，只能独自猜想，人们为什么把它留在这里。
        - id: ch04-b04
          speaker: fir_tree
          text: >-
            外面还是冬天，地面冻硬了，还盖着雪，当然没法把我栽下去。大家一定是想得周到，先让我在这里避寒，等春天来了再说。他们对我真好。可这里太黑，也太孤单了。哪怕让我看看一只小野兔也好。以前森林里满地是雪，野兔会从身边跑过，还会跳过我的头顶。那时我不喜欢，现在想想，那里多快活啊。这里可真孤单。
        - id: ch04-b05
          speaker: narrator
          text: >-
            忽然传来两声细小的吱吱声。一只小老鼠谨慎地爬过来，接着又来了一只。它们嗅了嗅枞树，钻进枝条中间。
        - id: ch04-b06
          speaker: mouse
          text: >-
            这里冷得很。要是不这么冷，我们住在这儿可舒服了。你说是不是，老枞树？
        - id: ch04-b07
          speaker: fir_tree
          text: >-
            我才不老。比我年长的树多得是。
        - id: ch04-b08
          speaker: mice
          text: >-
            那你从哪里来？你都知道些什么？见过世上最美的地方吗？快讲给我们听听。你去过储藏室没有？架子上全是奶酪，天花板上吊着火腿。我们能在牛油蜡烛上跑来跑去，进去时瘦瘦的，出来就吃得胖胖的。
        - id: ch04-b09
          speaker: fir_tree
          text: >-
            那个地方我不知道。不过，我知道一片森林，那里有阳光，也有鸟儿唱歌。
        - id: ch04-b10
          speaker: narrator
          text: >-
            于是，枞树把自己年轻时的事情全讲了出来。小老鼠一辈子也没听过这样的见闻，听得入了神。
        - id: ch04-b11
          speaker: mice
          text: >-
            你见过这么多事情！那时候，你一定过得特别幸福吧。
        - id: ch04-b12
          speaker: fir_tree
          text: >-
            幸福？是啊，现在想一想，那些日子的确很幸福。
        - id: ch04-b13
          speaker: narrator
          text: >-
            枞树接着讲起圣诞夜，说自己身上怎样挂满蜜饼和灯烛。
        - id: ch04-b14
          speaker: mice
          text: >-
            老枞树，那时你该有多幸福啊！
        - id: ch04-b15
          speaker: fir_tree
          text: >-
            我根本不老。今年冬天，我才离开森林。只是现在没法再长高了。
        - id: ch04-b16
          speaker: mice
          text: >-
            你讲的故事真精彩！
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: >-
            第二天夜里，两只小老鼠又带来四个伙伴，围在树旁听它讲。枞树越讲，记起的事就越多。那些曾被它忽略的日子，此刻一件件回到了眼前。它觉得从前很幸福，又相信那样的日子还可能回来。《矮胖子》里的主人公摔下楼梯，最后都能娶到公主，它说不定也可以。它想起森林里那棵秀美的小桦树。在它心里，那就是真正的美丽公主。
        - id: ch04-b18
          speaker: mice
          text: >-
            矮胖子是谁？快把他的故事也讲给我们听。
        - id: ch04-b19
          speaker: narrator
          text: >-
            枞树把那个故事从头到尾讲了一遍，每个字都还记得。小老鼠们高兴得恨不得一下蹦到树梢。下一夜，来听故事的老鼠更多了。到了星期日，还有两只大老鼠也来了。可它们听完以后，一点也不喜欢。小老鼠们听见这种评价，心里很难过，连自己也觉得故事没那么好了。
        - id: ch04-b20
          speaker: rats
          text: >-
            你就只会这一个故事吗？
        - id: ch04-b21
          speaker: fir_tree
          text: >-
            我只会这一个。它是我在一生最幸福的那个夜晚听来的，可当时的我根本不知道自己那么幸福。
        - id: ch04-b22
          speaker: rats
          text: >-
            这故事可真糟。你不会讲熏肉的故事吗？或者讲讲储藏室里的牛油？
        - id: ch04-b23
          speaker: fir_tree
          text: >-
            我不会讲那样的故事。
        - id: ch04-b24
          speaker: rats
          text: >-
            那就多谢你了。
        - id: ch04-b25
          speaker: narrator
          text: >-
            两只大老鼠排着队离开。后来，小老鼠们也不再来了。
    - id: ch05
      title: 一切都过去了
      blocks:
        - id: ch05-b01
          speaker: fir_tree
          text: >-
            那些快活的小老鼠围着我，听我讲故事，那段日子真愉快。现在，这件事也过去了。不过，只要有人来把我带出去，我就会觉得幸福。
          emotion: sad
        - id: ch05-b02
          speaker: narrator
          text: >-
            真会有人来吗？会的。一天早晨，人们上阁楼收拾东西。他们搬走箱子，把枞树从角落拖出来，又粗鲁地扔在地板上。仆人接着把它拖到楼梯口，那里正照着日光。
        - id: ch05-b03
          speaker: fir_tree
          text: >-
            我的生活终于又要开始了！
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: >-
            枞树迎着阳光和新鲜空气，满心欢喜。它很快被抬下楼，送进院子，快得来不及想自己的模样，只顾着四处看。院子旁边就是花园，里面花开得正好。新鲜芬芳的玫瑰越过矮栅栏垂下来，椴树也开着花。燕子在空中来来回回地飞，欢快地叫着。
        - id: ch05-b05
          speaker: swallows
          text: >-
            啾啾，啾啾，我的伴儿就要来啦！
        - id: ch05-b06
          speaker: narrator
          text: >-
            不过，燕子要等的并不是枞树。
        - id: ch05-b07
          speaker: fir_tree
          text: >-
            这下我可要重新活起来了！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: >-
            枞树想快活地伸开枝条，这才发现它们已经枯黄。它躺在杂草和荨麻中间。那颗金纸星星还插在树梢，在太阳底下闪着光。院子里，两个孩子正在玩耍。他们就是圣诞节那晚围着树跳舞的孩子。年纪小的那个看见金星，跑来一把扯了下来。
        - id: ch05-b09
          speaker: youngest_child
          text: >-
            快看呀，这棵又丑又老的枞树上还粘着个东西！
        - id: ch05-b10
          speaker: narrator
          text: >-
            孩子踩在树枝上，靴子底下响起一片噼啪声。枞树看看花园里鲜艳的新花，又看看自己，忽然希望自己还留在阁楼的黑暗角落。它想起森林里青翠的少年时光，想起欢乐的圣诞夜，也想起围着它听《矮胖子》的小老鼠。
        - id: ch05-b11
          speaker: fir_tree
          text: >-
            过去了，全都过去了！要是我在还能享受的时候，好好享受那些日子，该有多好。现在已经太迟了。
          emotion: sad
        - id: ch05-b12
          speaker: narrator
          text: >-
            一个小伙子走过来，把枞树劈成短短的木块，很快就在地上堆成一大捆。木块被塞进铜锅底下的火炉，转眼烧起明亮的火焰。枞树深深地叹气，每一声都像手枪发出的砰响。玩耍的孩子们跑来，坐在火炉前看火。
        - id: ch05-b13
          speaker: children
          text: >-
            砰！砰！又响了一声！
        - id: ch05-b14
          speaker: narrator
          text: >-
            每一次砰响，都是枞树的一声深叹。每响一次，它就想起森林里的一个夏日，想起那个圣诞夜，再想起《矮胖子》。这是它听过的唯一一个故事，也是它唯一会讲的故事。火越烧越旺，直到枞树化为灰烬。
        - id: ch05-b15
          speaker: narrator
          text: >-
            男孩们还在花园里玩耍。最小的孩子把金星戴在胸前。枞树一生最幸福的那个夜晚，这颗星曾在它的树梢闪耀。
        - id: ch05-b16
          speaker: narrator
          text: >-
            如今，一切都过去了。枞树的一生过去了，故事也过去了。因为所有的故事，终究都要结束。
