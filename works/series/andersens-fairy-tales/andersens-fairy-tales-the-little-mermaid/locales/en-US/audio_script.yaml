  chapters:
    - id: ch01
      title: The Kingdom Beneath the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Far out in the ocean, the water is blue as the loveliest cornflower and clear as crystal. It is deeper than any cable can reach. Even if many church steeples were piled one upon another, they could not stretch from the bottom to the surface far above. Down there, the Sea King and all his people live among strange flowers and plants. Their soft stems move with the smallest current as though they were alive, and fish of every size glide between their branches the way birds pass through trees on land.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In the deepest place stands the Sea King's castle. Its walls are coral, and its long, pointed windows are made of the clearest amber. Great shells cover the roof. They open and close as the water moves over them, making the whole roof seem alive. Inside every shell lies a glittering pearl, and each pearl would be beautiful enough to wear in a queen's crown.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The Sea King had been a widower for many years, so his old mother kept his house and ruled its daily life. She was a very wise woman, but she was also exceedingly proud of her high birth. While other noble ladies were allowed to wear only six oysters on their tails, she wore twelve to show her rank. For all her pride, she deserved great praise. No one could have taken more loving care of her six granddaughters, the little sea princesses, and she watched over them as they grew.
        - id: ch01-b04
          speaker: narrator
          text: >-
            All six were beautiful, but the youngest was loveliest of all. Her skin was delicate as a rose petal, and her eyes were as blue as the deepest sea. Like her sisters, she had no feet. Her body ended in a fish's tail. The princesses played through the great halls and among living flowers that grew from the walls. Fish swam through the open amber windows, ate from their hands, and let the children stroke them.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Outside lay a garden of dark blue and brilliant red flowers. Some blossoms looked like flames, the fruit shone like gold, and every leaf and stem swayed without stopping. The ground was the finest sand, but it was blue as a sulfur flame. A strange blue light covered everything. It seemed almost as if they stood in the air above the sea and saw blue sky around them instead of deep water. On calm days, the sun appeared far overhead like a purple flower pouring light from its heart.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Each princess had her own garden plot. One shaped hers like a whale, and another made a little mermaid. The youngest made hers round like the sun and planted sunset-red flowers in it. She was a quiet, thoughtful child. Her sisters treasured curious things from shipwrecks, but she cared only for her red flowers and one white marble statue of a handsome boy that had fallen from a wreck.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Beside the statue she planted a rose-colored weeping willow. It grew wonderfully well. Before long, its fresh branches hung over the white stone nearly to the blue sand. The shadow beneath it had a violet color and moved whenever the branches moved. Looking at the tree and its shadow was like watching the treetop and its roots play together, each one bending closer as though they were trying to kiss.
        - id: ch01-b08
          speaker: narrator
          text: >-
            More than anything, the little mermaid loved hearing about the world above. She asked her grandmother about ships and cities, people and animals. Land flowers had a scent, her grandmother said, and forest trees were green. Among those trees lived fish that sang beautifully. She called the birds fish because the child had never seen a bird and would not have understood another name.
        - id: ch01-b09
          speaker: grandmother
          text: >-
            When you are fifteen, you may rise above the sea. You may sit on the rocks in the moonlight while the great ships pass, and then you will see forests and towns for yourself.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The eldest sister would turn fifteen the next year. Since each sister was a year younger than the one before, the youngest still had five years to wait. They all promised to tell the others what they saw on their first visit and what seemed most beautiful. Their grandmother's stories could never satisfy all their questions.
        - id: ch01-b11
          speaker: narrator
          text: >-
            No one longed for the upper world as fiercely as the youngest. Night after night, she stood at the open window and looked up through the dark blue water. The moon and stars shone faintly and seemed larger through the sea. Sometimes a black shape crossed their light. Then she knew a whale or a ship full of humans was passing overhead. None of those people guessed that a little mermaid stood below, reaching her white hands toward their keel.
        - id: ch01-b12
          speaker: narrator
          text: >-
            When the eldest sister turned fifteen, she rose to the surface. She returned with hundreds of things to tell. Best of all, she said, was lying in moonlight on a sandbar near the coast while the sea rested quietly around her. Across the water stood a great city. Its lights twinkled like hundreds of stars. Music floated from it, carriages rattled through the streets, and human voices rose and fell. Then cheerful bells rang from the church steeples. She could see and hear it all without going near, and that distance made her want the wonders even more. The youngest listened to every word. Later, at her open window, she imagined the busy city above and almost believed its church bells were ringing down in the deep.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A year later, the second sister received permission to go wherever she wished on the surface. She arrived just as the sun was setting and came home certain she had seen the most beautiful sight of all. The whole sky had turned to gold. Violet and rose-colored clouds, more lovely than she could describe, floated slowly above her. Then a great flock of wild swans swept past them toward the setting sun. Their long white line looked like a veil spread across the sea. She swam after the sun too, but it slipped beneath the waves, and the rosy color faded from both the clouds and the water.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The third sister was the boldest. She swam into a broad river and saw green hills thick with vines. Palaces and castles appeared between proud forest trees, and birds sang overhead. The sun grew so hot that she often had to dive beneath the water to cool her face. In a narrow creek she found human children playing in the water without any clothes. She wanted to join them, but they ran away in fright. Then a small black animal rushed up and barked terribly. She had never seen a dog, and she fled to the open sea. Still, she never forgot the forests, the hills, and those children who swam without tails.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The fourth sister was more timid than the others, so she stayed in the middle of the sea. She never approached the coast, yet she thought the open ocean was every bit as beautiful. Nothing blocked her view for miles. Above her, the sky curved from horizon to horizon like a huge bell made of glass. Ships passed so far away that they looked no larger than gulls. Dolphins leaped and played through the waves, while great whales blew water from their nostrils. Their shining streams rose on every side until it seemed that a hundred fountains were playing across the sea.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The fifth sister had a winter birthday, so the surface showed her something none of the others had seen on a first visit. The sea was green, and enormous icebergs floated across it. Each looked like a pearl, she said, only higher than any church humans had built. They rose in strange shapes and glittered like diamonds. She climbed onto the largest one and let the wind play with her long hair. Every ship hurried past and steered as far from the iceberg as possible, almost as if the sailors feared the place where she sat. At evening, the sun sank and dark clouds gathered. Thunder rolled, lightning flashed, and red light glowed on the ice while the bergs rocked in the heaving sea. Sailors pulled in their sails with fear, but she sat calmly and watched blue lightning fork into the water.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At first, every sister delighted in the new and beautiful sights above the waves. Once they grew older and could visit whenever they wished, the wonder slowly faded. They began to miss the water below. After spending a month on the surface, they would say the sea kingdom was far more beautiful and home was the pleasantest place of all. Even so, the five often linked their arms at evening and rose in a row. Their voices were more beautiful than any human voice could be. Before a storm, when they feared a ship would be lost, they swam ahead of it and sang sweetly about every delight in the depths. They begged the sailors not to fear if they sank to the bottom. But no sailor understood a word. To human ears, the sisters' song sounded like the storm howling. The wonders they promised could never be wonders for those men. If the ship went down, the sailors drowned, and only their dead bodies reached the Sea King's palace.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Whenever her sisters left arm in arm, the youngest stood alone and watched them go. She wanted to cry, but mermaids have no tears, and so their sorrow hurts even more.
        - id: ch01-b19
          speaker: little_mermaid
          text: >-
            Oh, if only I were fifteen. I know I will love the world above and every person who lives there.
          emotion: sad
    - id: ch02
      title: Her First Night Above the Waves
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last, the little mermaid turned fifteen. Her grandmother told her she was grown now and must be dressed like her sisters. She set a wreath of white lilies in the girl's hair, with half a pearl in every petal, and ordered eight large oysters to fasten themselves to the princess's tail as a sign of rank.
        - id: ch02-b02
          speaker: little_mermaid
          text: >-
            They hurt me so much.
        - id: ch02-b03
          speaker: grandmother
          text: >-
            If you want to show your pride, you must bear the pain.
        - id: ch02-b04
          speaker: narrator
          text: >-
            She would gladly have shaken off the oysters, put away the heavy wreath, and traded all that grandeur for the red flowers in her own garden. But her grandmother had dressed her, and she could not change it. So she said farewell to everyone below and began to rise. She passed upward through the water as lightly as a bubble.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The sun had just gone down when her head rose above the waves. Crimson and gold colored the clouds, and the evening star shone through the dimming light. The sea lay calm beneath mild, fresh air. Nearby, a three-masted ship stood still with one sail raised. With no wind to move them, sailors rested on deck and in the rigging.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Music and singing came from the ship. As darkness fell, a hundred colored lanterns appeared. Red, blue, green, and gold lights moved in the night until the air seemed filled with the flags of every nation. The little mermaid swam close to the cabin windows. Each time a wave lifted her, she could look through the clear glass at a room full of finely dressed guests. Among them stood a handsome prince with large black eyes. He was sixteen years old, and all this rejoicing was for his birthday.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Sailors danced on deck. When the prince joined them, more than a hundred rockets flew into the sky and turned night bright as day. Startled, the mermaid dived beneath the surface. When she dared to look again, it seemed that all the stars of heaven were falling around her. She had never seen fireworks. Great suns sprayed fire in every direction, and brilliant fireflies flew high into the blue. The calm, clear sea reflected every burst. The ship glowed so brightly that every person and even the smallest rope stood clear in the light. At the center of it all, the young prince smiled, pressed his guests' hands, and listened while music rang through the night air.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The hours passed, but she could not look away from the ship or the prince. It grew very late. At last the colored lanterns went dark, no more rockets climbed into the sky, and the cannon fell silent. Then the sea began to stir beneath her. A low, grumbling moan sounded under the waves. Still she stayed beside the cabin window. The restless water lifted her to the glass, lowered her again, and carried her up once more for another glimpse inside.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Soon the crew spread the sails and the ship moved on. The waves climbed higher. Heavy clouds covered the sky, and lightning flashed far away. The sailors quickly pulled the sails in again, but the storm struck. Waves rose like mountains above the mast. The ship dipped between them like a swan, then climbed their foaming tops. To the mermaid it looked like a game. To the sailors it did not.
        - id: ch02-b10
          speaker: narrator
          text: >-
            The ship groaned and creaked. Water crashed across the deck and broke through its heavy planks. The mainmast snapped like a reed. The vessel rolled onto its side, and the sea poured in. Now the mermaid understood the danger. Beams and broken boards scattered over the water, and she had to keep them from crushing her.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Darkness swallowed everything until lightning lit the wreck. She could see all who had been aboard except the prince. She had watched him sink when the ship split apart. For one moment, she was glad he would come down to her. Then she remembered that a human could not live in the sea. If he reached her father's palace, he would be dead.
        - id: ch02-b12
          speaker: narrator
          text: >-
            He must not die. She searched among the broken timbers without thinking of her own life or of the heavy beams that could strike her. Again and again she dived into the black water, then rose and fell with the mountains of waves. At last she found him in the storm. He could hardly swim. His arms and legs were losing their strength, and his beautiful eyes had closed. Without her, he would have slipped beneath the water and died. She caught him, lifted his face into the air, held his head above the sea, and let the waves carry them wherever they would.
        - id: ch02-b13
          speaker: narrator
          text: >-
            By morning, the storm was gone, and not one piece of the ship remained in sight. The sun rose red and glowing from the water. Its warm rays slowly brought the color of life back to the prince's cheeks, though his eyes stayed shut. The mermaid kissed his high, smooth forehead and gently pushed the wet hair from his face. In the morning light, he looked so much like the white marble boy in her garden that she kissed him again. More than anything, she wished for him to open his eyes and live.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Land appeared ahead. Tall blue mountains rose beyond the coast, and snow rested on their peaks like a flock of white swans. Beautiful green forests covered the lower ground. Close to the water stood a large white building. The mermaid could not tell whether it was a church or a convent. A garden surrounded it, filled with orange and citron trees, and tall palms stood before its doors. The sea curved inward there to form a sheltered little bay. Its surface was quiet after the storm, though the water beneath remained very deep.
        - id: ch02-b15
          speaker: narrator
          text: >-
            In a deep, quiet bay, the mermaid carried the prince to a beach of fine white sand. She placed him in the warm sunlight and raised his head above his body. Bells rang from the white building, and young girls entered the garden. The mermaid swam behind high rocks and covered her head and neck with foam so no one would see her face.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Before long, one young woman came near the place where the prince lay. The sight frightened her, but only for a moment. She hurried away and returned with several people. Hidden behind the rocks, the mermaid watched them gather around him. At last the prince came back to life. He opened his eyes and smiled at the people beside him. No smile reached the mermaid in the water. He had never seen her face, and he had no idea that she was the one who had saved him.
        - id: ch02-b17
          speaker: narrator
          text: >-
            She watched them lead him into the building. Then she sank sorrowfully beneath the water and returned to her father's castle. She had always been quiet, but now she grew quieter still. Her sisters asked what she had seen on her first journey. She told them nothing.
    - id: ch03
      title: The Prince and the Immortal Soul
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Morning after morning and evening after evening, the little mermaid returned to the shore where she had left the prince. She watched fruit ripen and disappear from the garden. She watched snow melt from the mountains. But she never saw him, and every trip home left her sadder.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Her only comfort was to sit in her garden with one arm around the marble statue that looked like him. She stopped caring for her flowers. They spread wildly across the paths and wound around the trees until her garden became dark and gloomy.
        - id: ch03-b03
          speaker: narrator
          text: >-
            At last, she could keep the secret no longer. She told one sister everything about the storm, the rescue, and the prince she could not forget. Soon all her sisters knew. Before long, the secret had reached two other mermaids. Their closest friend knew who the prince was, because she too had watched the celebration aboard his ship. She could tell them the country he came from and exactly where his palace stood.
        - id: ch03-b04
          speakers: [eldest_sister, second_sister, third_sister, fourth_sister]
          ensemble: chorus
          text: >-
            Come with us, little sister.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The sisters linked arms and rose in a long row near the prince's home. His palace was made of bright yellow stone that shone in the sun. Long flights of marble stairs led upward, and one reached all the way down into the sea. Golden domes rose above the roof. Marble figures stood between the pillars around the building, carved so perfectly that they seemed alive. Through tall, crystal-clear windows, the mermaid saw noble rooms with rich silk curtains, great tapestries, and walls covered in beautiful paintings. In the largest room, a fountain sent sparkling water high toward a glass dome in the ceiling. Sunlight poured through the dome and shone on the fountain and the living plants around its basin.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Now she knew where the prince lived. Evening after evening and far into the night, she stayed on the water near his palace. She dared to swim much closer to land than any of her sisters. Once she followed a narrow channel all the way beneath a marble balcony whose shadow spread across the water. There she could sit unseen and watch the young prince in the bright moonlight. He believed he was completely alone.
        - id: ch03-b07
          speaker: narrator
          text: >-
            She saw him sail in a pleasant boat while music played and flags waved. She hid among green reeds. If the wind caught her long white veil, anyone who glimpsed it thought a swan was spreading its wings. At night, fishermen carried torches over the sea and told one another of the prince's good deeds. Hearing them, she felt glad that she had saved him. She remembered his head against her and the kisses he knew nothing about.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Her love for human beings grew with her love for him. Their world seemed far larger than hers. They crossed the sea in ships as if they could fly over the water. They climbed mountains that rose higher than the clouds. The lands they possessed, with all their fields and woods, stretched farther than her eyes could follow. There was so much she wanted to understand. Her sisters had no answers left to give, so once again she went to the grandmother who knew the lands above the sea.
        - id: ch03-b09
          speaker: little_mermaid
          text: >-
            If humans do not drown, do they live forever? Or do they die as we do in the sea?
        - id: ch03-b10
          speaker: grandmother
          text: >-
            They die too, and their lives are shorter than ours. We may live for three hundred years, but when our time ends, we become foam on the water. We do not even have graves down here where those who loved us can visit. We have no immortal souls and no life after this one. Once we are gone, we are like green seaweed cut from its root. We can never grow again. Humans are different. Their bodies turn to dust, but their souls live forever. Those souls rise through the clear, pure air, beyond the shining stars. Just as we rise from the water and discover the lands of earth, they rise to unknown and glorious regions that we will never see.
        - id: ch03-b11
          speaker: little_mermaid
          text: >-
            Why don't we have immortal souls? I would give up all my hundreds of years to be human for one day, if I could hope to share that happiness beyond the stars.
          emotion: sad
        - id: ch03-b12
          speaker: grandmother
          text: >-
            You must put that thought away. We are much happier and better off than humans.
        - id: ch03-b13
          speaker: little_mermaid
          text: >-
            Then I will die and drift as sea foam. I will never hear the waves again or see the flowers and the red sun. Is there no way for me to win an immortal soul?
          emotion: sad
        - id: ch03-b14
          speaker: grandmother
          text: >-
            No human can give you one unless he loves you more than his own father and mother. All his thoughts and love must belong to you. A priest must join your hands, and the man must promise himself to you in this life and the next. Then his soul would flow into you, while he kept his own, and you would share humanity's future happiness. But that can never happen. We consider your fish's tail beautiful. People on land find it ugly. They think beauty requires two strong supports called legs.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The mermaid looked sadly at her tail and sighed.
        - id: ch03-b16
          speaker: grandmother
          text: >-
            Be happy. Leap and swim through the three hundred years you have. That is long enough, and afterward you can rest. Tonight we are holding a court ball.
    - id: ch04
      title: The Sea Witch's Price
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            No ball on land could match the splendor of the Sea King's court. Thick, transparent crystal formed the walls and ceiling of the great hall. Hundreds of enormous shells stood in rows along both sides, some deep red and others grass green. Blue fire burned inside them. It lit the whole room, then shone through the clear walls until the sea outside glowed too. Countless fish, large and small, swam past that light. Some scales flashed with a rich purple brightness, while others gleamed like moving silver and gold.
        - id: ch04-b02
          speaker: narrator
          text: >-
            A broad stream flowed through the hall. Mermen and mermaids danced in it while their own sweet voices made the music. No one on earth could sing so beautifully, and the little mermaid's voice was loveliest of all. The whole court clapped their hands and tails for her. For one moment she was happy, because she knew no one in the sea or on land had a voice like hers.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Then she remembered the world above. She could not forget the prince or her sorrow at having no immortal soul. Quietly she left the palace. While everyone inside sang and celebrated, she sat alone in her dark garden. A bugle sounded through the water. She believed the prince must be sailing overhead, and a decision formed in her heart.
        - id: ch04-b04
          speaker: little_mermaid
          text: >-
            My whole happiness rests with him. I will risk everything for him and for an immortal soul. While my sisters dance in the palace, I will go to the sea witch. I have always feared her, but perhaps she can tell me what to do.
        - id: ch04-b05
          speaker: narrator
          text: >-
            She left her garden and took the road toward the witch's home beyond the foaming whirlpools. She had never traveled that way. No flower or blade of grass grew along it. Bare gray sand reached all the way to the spinning water. The whirlpools turned like great foaming mill wheels. Anything they caught was pulled around and around, then thrown into the bottomless deep. There was no path around them. To reach the witch, the little mermaid had to pass straight through those crushing circles.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Beyond them, the only road crossed warm, bubbling mud that the witch called her peat bog. Farther on stood a forest unlike any other. Its trees and flowers were polyps, creatures that were half plant and half animal. They rose like hundred-headed snakes. Long slimy arms grew from them, and wormlike fingers moved from root to tip. Those arms caught everything within reach and never let it go.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The mermaid stopped in terror, her heart beating so hard that she nearly turned back. Then she thought of the prince and the soul she longed for. Her courage returned. She tied up her flowing hair so the polyps could not catch it, folded her hands across her breast, and shot between their grasping arms like a fish.
        - id: ch04-b08
          speaker: narrator
          text: >-
            As she passed, the princess saw that every polyp held something in its many small arms. Their grip seemed as strong as iron bands. White skeletons of drowned humans hung among them. There were skeletons of land animals too, along with oars, rudders, and heavy sea chests from wrecked ships. One creature had even caught a little mermaid and strangled her. Of all the terrible things along that road, this was the sight that shocked the princess most.
        - id: ch04-b09
          speaker: narrator
          text: >-
            At last she reached a marshy opening where thick water snakes rolled through the mud, showing their ugly, dull-colored bodies. A house made from the bones of shipwrecked people stood in the center. The sea witch sat there with a toad close to her face. She fed it from her own mouth, just as someone on land might offer a pet canary a piece of sugar. Around her, the fat water snakes crawled from the mire. She called those ugly creatures her little chickens and welcomed them as they twisted across her body.
        - id: ch04-b10
          speaker: sea_witch
          text: >-
            I know exactly why you came. It is a foolish wish, pretty princess, and it will bring you sorrow. Still, you shall have your way. You want to lose your tail and grow the two supports humans use. Then your prince may love you, and you may gain an immortal soul.
        - id: ch04-b11
          speaker: narrator
          text: >-
            The witch laughed so loudly and horribly that the toad and snakes tumbled down and writhed on the ground.
        - id: ch04-b12
          speaker: sea_witch
          text: >-
            You have arrived just in time. After sunrise tomorrow, I could do nothing for you until another year had passed. I will make you a potion. Before tomorrow's sunrise, swim to land, sit on the shore, and drink it. Your tail will shrink away and become what humans call legs. It will hurt as though a sword cuts through you.
        - id: ch04-b13
          speaker: sea_witch
          text: >-
            Everyone who sees you will think you are the most beautiful human girl alive. You will keep the same floating grace you have in the water. No dancer will ever step as lightly as you. People will marvel whenever you move. But you will pay for every graceful step. Each time your foot touches the ground, it will feel as if you are walking on sharp knives and the blood must flow. That pain will follow you wherever your new legs carry you. If you understand all of this and can endure it, then I will help you.
        - id: ch04-b14
          speaker: little_mermaid
          text: >-
            Yes. I can endure it.
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: >-
            Her voice trembled as she thought of the prince and the immortal soul.
        - id: ch04-b16
          speaker: sea_witch
          text: >-
            Think once more. After you take a human shape, you can never be a mermaid again. You can never swim home to your sisters or enter your father's palace. And you must make the prince love you so completely that he puts you before his father and mother. A priest must join your hands and make you husband and wife. Otherwise, you will never receive an immortal soul.
        - id: ch04-b17
          speaker: sea_witch
          text: >-
            If the prince marries another woman, your heart will break on the first morning after the wedding. Then you will become foam on the waves.
        - id: ch04-b18
          speaker: little_mermaid
          text: >-
            I will do it.
        - id: ch04-b19
          speaker: narrator
          text: >-
            The little mermaid turned pale as death.
        - id: ch04-b20
          speaker: sea_witch
          text: >-
            I must have payment, and my price is no small thing. You have the sweetest voice in the whole sea. You expect to use it to charm the prince, but you must give that voice to me. I want the finest thing you own in return for my potion. My blood must go into it too, so it will cut as sharply as a double-edged sword.
        - id: ch04-b21
          speaker: little_mermaid
          text: >-
            If you take my voice, what will I have left?
        - id: ch04-b22
          speaker: sea_witch
          text: >-
            Your lovely face, your graceful walk, and your speaking eyes. Those should be enough to capture a man's heart. What is this? Has your courage failed? Put out your tongue. I will cut it away as my payment, and then the powerful potion is yours.
        - id: ch04-b23
          speaker: little_mermaid
          text: >-
            So be it.
        - id: ch04-b24
          speaker: narrator
          text: >-
            The witch set her cauldron over the fire. She knotted several snakes together and scrubbed the pot with them.
        - id: ch04-b25
          speaker: sea_witch
          text: >-
            It is always good to keep things clean.
        - id: ch04-b26
          speaker: narrator
          text: >-
            She pierced her own breast and let black blood fall into the cauldron. The steam twisted into shapes too dreadful to watch. Again and again, she tossed something new into the mixture. When it boiled, it sounded like a crocodile weeping. At last the potion was ready, and it looked as clear as water.
        - id: ch04-b27
          speaker: sea_witch
          text: >-
            Here is your potion.
        - id: ch04-b28
          speaker: narrator
          text: >-
            Then the witch cut out the mermaid's tongue. From that moment, the girl could neither speak nor sing.
        - id: ch04-b29
          speaker: sea_witch
          text: >-
            If the polyps grab you on your way through the forest, spill a few drops of the potion on them. Their fingers will tear into a thousand pieces.
        - id: ch04-b30
          speaker: narrator
          text: >-
            She did not need to use it. The polyps saw the potion sparkling in her hand like a little star, and they drew back in terror. She hurried through the forest, across the marsh, and between the roaring whirlpools.
        - id: ch04-b31
          speaker: narrator
          text: >-
            At her father's palace, every torch in the ballroom had gone out. The music was over, and everyone inside slept. She could not make herself enter. She was mute now, and before they woke she would be gone forever. Her heart felt ready to break. Quietly she slipped into the garden. From each sister's flower bed, she picked one flower to carry with her. Then she turned toward the dark palace, pressed her hand to her lips again and again, and sent a thousand kisses to her family before rising through the dark blue sea.
    - id: ch05
      title: A Silent Life Beside the Prince
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The sun had not risen when the little mermaid reached the prince's palace. Moonlight shone over the marble steps. She sat there and drank the potion. It felt as if a double-edged sword passed through her body. She fainted and lay as still as death.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Sunlight woke her when it rose over the sea. A sharp pain still passed through her, and the handsome young prince stood directly before her. He fixed his dark eyes on her with such an earnest look that she lowered her own. Only then did she see what the potion had done. Her fish's tail had vanished completely. In its place were two small white feet and a pair of legs as lovely as any young woman's. She had arrived with no clothing, so she drew her long, thick hair around herself.
        - id: ch05-b03
          speaker: prince
          text: >-
            Who are you? Where did you come from?
        - id: ch05-b04
          speaker: narrator
          text: >-
            She could only look at him with gentle, sorrowful blue eyes. No answer would come from her missing voice. The prince led her forward. Each step felt exactly as the witch had promised. It was as if she pressed her bare feet onto sharp needles and knives, yet she bore the pain willingly. No cry escaped her. Beside the prince she seemed to float as lightly as a soap bubble, and everyone who saw her marveled at the soft, swaying grace of every movement.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Soon she wore costly silk and soft muslin. No one in the palace was more beautiful, but she remained mute. She could not speak, and she could not sing.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Beautiful women in silk and gold came forward to sing before the prince and his royal parents. One of them sang better than all the rest. The prince smiled at the singer and clapped his hands in delight. The little mermaid felt a deep stab of sorrow. She knew that, until the day before, her own voice had been far sweeter than the voice receiving his praise.
        - id: ch05-b07
          speaker: narrator
          text: >-
            She wished he could know that she had surrendered her voice forever just to be near him.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Next the women danced to beautiful music. The mermaid lifted her white arms, rose onto the tips of her toes, and floated across the floor. No one had ever danced that way. With every movement, her beauty became clearer, and her eyes reached people's hearts more deeply than any song.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Everyone was enchanted, especially the prince. He called her his little foundling. To please him, she danced again, though every touch of her foot felt like stepping on a sharp knife.
        - id: ch05-b10
          speaker: prince
          text: >-
            You must stay with me always.
        - id: ch05-b11
          speaker: narrator
          text: >-
            He let her sleep outside his door on a velvet cushion and had a page's outfit made so she could ride with him. Together they traveled through fragrant woods where green branches brushed their shoulders and birds sang among new leaves.
        - id: ch05-b12
          speaker: narrator
          text: >-
            She climbed high mountains at his side, following wherever he chose to go. Her tender feet bled so badly that each step left a mark behind her, but she only laughed and continued upward with him. At last they stood so high that they could look down on the clouds. From above, the white shapes seemed like a flock of birds traveling together toward faraway lands.
        - id: ch05-b13
          speaker: narrator
          text: >-
            At night, when the palace slept, she sat on the broad marble steps and cooled her burning feet in the sea. Then she thought about her home in the deep.
        - id: ch05-b14
          speaker: narrator
          text: >-
            One night her sisters rose from the water arm in arm. They floated near the steps and sang so sadly that she beckoned to them. Then they recognized their little sister in her human shape and told her how deeply her disappearance had grieved everyone below. After that, they returned to the same place every night. Once, far out at sea, she saw her grandmother, though the old lady had not visited the surface for many years. Beside her was the Sea King, her father, with his crown upon his head. Both stretched their hands toward her, but neither dared come as close to the land as her sisters did.
        - id: ch05-b15
          speaker: narrator
          text: >-
            The days passed, and she loved the prince more and more. He loved her as he might love a little child, but he never thought of making her his wife. Without that marriage, she could not gain a soul. If he married someone else, she would become sea foam the following morning.
        - id: ch05-b16
          speaker: narrator
          text: >-
            When he held her and kissed her forehead, her eyes seemed to ask whether he loved her more than anyone.
        - id: ch05-b17
          speaker: prince
          text: >-
            You are very dear to me. No one has a kinder heart or gives me more faithful love. You remind me of a young woman I once saw and will never meet again. My ship was wrecked, and the waves left me near a holy temple where young women served. The youngest found me on the shore and saved my life.
        - id: ch05-b18
          speaker: prince
          text: >-
            I saw her only twice, but she is the one person I could ever love. You look so much like her that you have almost pushed her memory from my mind. She belongs to the temple, and fortune must have sent you to take her place. You and I will never part.
        - id: ch05-b19
          speaker: narrator
          text: >-
            The mermaid knew he was wrong. She had carried him across the sea and laid him near the temple. Hidden beneath the foam, she had waited until people came to help. She had seen the young woman whom he now loved more than her. The mermaid sighed, but she could not cry.
        - id: ch05-b20
          speaker: narrator
          text: >-
            She comforted herself with one thought. The young woman belonged to the holy temple and would never return to ordinary life. The prince would not meet her again. Meanwhile, the mermaid could stay beside him each day. She would care for him, love him, and give her life for him.
    - id: ch06
      title: The Bride from the Holy Temple
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            Before long, everyone said the prince must marry the beautiful daughter of a neighboring king. A magnificent ship was prepared for the journey. The prince announced that he was only going to visit the king, but the court believed he was really going to meet the princess and make her his wife. A large company prepared to travel with him. The little mermaid heard every rumor, but she only smiled and shook her head. She believed she knew the prince's thoughts better than any of the people around him.
        - id: ch06-b02
          speaker: prince
          text: >-
            I have to make this journey because my parents want me to meet the princess. But they cannot force me to bring her home as my bride. I could not love her. She will not be like the beautiful young woman from the temple, the one you resemble. If I had to choose a bride, I would sooner choose you, my silent foundling with the eyes that say so much.
        - id: ch06-b03
          speaker: narrator
          text: >-
            He kissed her mouth, played with her long hair, and rested his head against her heart. She dreamed of human happiness and an immortal soul.
        - id: ch06-b04
          speaker: prince
          text: >-
            You are not frightened of the sea, are you, my silent child?
        - id: ch06-b05
          speaker: narrator
          text: >-
            They stood together on the deck of the noble ship that would carry them to the neighboring kingdom. The prince told her about storms and calm seas, strange fish in the depths, and wonders that divers had reported. She smiled as she listened. No one knew the world beneath the water better than she did.
        - id: ch06-b06
          speaker: narrator
          text: >-
            In the moonlight, everyone slept except the helmsman. The mermaid sat on deck and stared through the clear water. She thought she could make out her father's castle. Her old grandmother seemed to stand upon it, her silver crown shining as she looked up through the rushing current toward the ship.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Then the sisters rose on the waves. They watched her sadly and twisted their white hands. The mermaid beckoned and smiled. She longed to tell them she was happy and well. But a cabin boy came near, and the sisters dived. He saw only sea foam.
        - id: ch06-b08
          speaker: narrator
          text: >-
            The next morning, the ship entered the harbor of a beautiful town in the neighboring king's country. Church bells rang to welcome them, and trumpets sounded from the high towers. Along the narrow rocky passage into port, soldiers stood in shining rows. Bright flags flew above them, and the sun flashed on their bayonets. From then on, each day brought another celebration. One ball followed another, with feasts and entertainments between them.
        - id: ch06-b09
          speaker: narrator
          text: >-
            Still, the princess did not appear. People said she was being educated in a religious house and learning every virtue a royal woman should have. At last she came. The little mermaid had anxiously wondered whether this princess was truly beautiful. Now she had to admit she had never seen anyone more perfect. The princess had delicate fair skin, long dark lashes, and laughing blue eyes filled with honesty and innocence.
        - id: ch06-b10
          speaker: prince
          text: >-
            It was you! You found me when I lay lifeless on the beach. You are the one who saved me.
          emotion: surprised
        - id: ch06-b11
          speaker: narrator
          text: >-
            He gathered the blushing princess into his arms.
        - id: ch06-b12
          speaker: prince
          text: >-
            I have never been so happy. Everything I hoped for has come true. You will be glad for me, won't you? No one has shown me truer devotion than you have.
          emotion: happy
        - id: ch06-b13
          speaker: narrator
          text: >-
            The little mermaid kissed his hand. Her heart already felt broken. On the morning after his wedding, she would die and turn to foam on the sea.
        - id: ch06-b14
          speaker: narrator
          text: >-
            Bells rang throughout the town, and heralds rode through the streets announcing the betrothal. Fragrant oil burned in precious silver lamps on every altar. Sweet smoke rose as the priests swung their censers through the church. Before the gathered court, the bride and groom placed their hands together. The bishop blessed them, and the prince received the princess as his wife while the whole city celebrated their marriage.
        - id: ch06-b15
          speaker: narrator
          text: >-
            Dressed in silk and gold, the little mermaid walked behind them and carried the bride's long train. Music filled the church, but she no longer seemed to hear it. The beautiful ceremony unfolded before her, but she no longer seemed to see it. While everyone else watched the royal couple, her thoughts stayed with the night of death coming closer and with everything she had lost in the sea and on land.
        - id: ch06-b16
          speaker: narrator
          text: >-
            That evening, the newly married couple boarded the ship. Cannon thundered, flags waved, and a splendid tent of purple and gold stood in the center of the deck. Rich couches waited inside for the bride and groom. A good wind filled the sails, and the ship moved smoothly over the calm water.
        - id: ch06-b17
          speaker: narrator
          text: >-
            Colored lamps glowed after dark, and sailors danced. The mermaid remembered the first time she had risen from the sea and watched another night of music and joy aboard a ship. She joined the dance now. She leaped through the air like a swallow chasing its prey, and everyone cheered in wonder. Never had she danced with such grace.
        - id: ch06-b18
          speaker: narrator
          text: >-
            Sharp knives seemed to cut her tender feet, but she hardly noticed. The pain in her heart was sharper. This was her final evening beside the prince. For him, she had left her family and home, surrendered her beautiful voice, and suffered pain every day without his knowing.
        - id: ch06-b19
          speaker: narrator
          text: >-
            This was the last night she would breathe the same air as the prince or look with him upon the starry sky and the deep sea. Afterward, an endless night without thought or even dreams seemed to wait for her. She had been born without a soul, and now she had lost every chance to gain one. Yet all around her, the ship remained full of joy until long after midnight. She laughed when the others laughed and danced among them while the thought of death stayed in her heart.
        - id: ch06-b20
          speaker: narrator
          text: >-
            The prince kissed his bride, and she played with his dark hair. Then they went arm in arm into the splendid tent. One by one, the sounds on deck faded until only the helmsman remained awake.
        - id: ch06-b21
          speaker: narrator
          text: >-
            The little mermaid rested her white arms on the ship's rail and faced the east. The first pale light of morning would bring her death. Then her sisters rose from the sea. Their faces were as pale as hers. Their long hair was gone, cut close to their heads.
        - id: ch06-b22
          speakers: [eldest_sister, second_sister, third_sister, fourth_sister]
          ensemble: chorus
          text: >-
            We gave our hair to the sea witch so she would help you live through this night. She gave us a knife. Look, it is very sharp. Before the sun rises, you must drive it into the prince's heart. When his warm blood touches your feet, they will join and become a fish's tail again. Then you can return to us and live your three hundred years before you become salt foam on the sea.
          emotion: sad
        - id: ch06-b23
          speakers: [eldest_sister, second_sister, third_sister, fourth_sister]
          ensemble: chorus
          text: >-
            Hurry. Before sunrise, either he must die or you will. Our grandmother mourns so terribly that her white hair is falling out, just as ours fell beneath the witch's scissors. Kill the prince and come home. Can't you see the first red line in the sky? The sun will rise in minutes, and then you must die.
          emotion: sad
        - id: ch06-b24
          speaker: narrator
          text: >-
            With a deep, mournful sigh, the sisters sank beneath the waves.
    - id: ch07
      title: The Daughters of the Air
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The little mermaid entered the royal tent and drew back its crimson curtain. The fair young bride lay asleep with her head resting against the prince's chest. The mermaid stood over them in silence. Then she bent down and kissed the prince's forehead. Beyond the tent, the sky was changing. The rosy light of dawn grew brighter every moment. She looked from that light to the sharp knife in her hand, knowing the sunrise was almost there.
        - id: ch07-b02
          speaker: narrator
          text: >-
            The prince whispered his bride's name in his sleep. Even in dreams, his thoughts belonged to her. The little mermaid looked from his face to the sharp blade. The knife shook in her hand. She could save herself with one blow, but she did not strike. Instead, she turned toward the open sea and threw the knife far out over the waves. The water turned red where it fell, and the drops that splashed upward looked like blood.
        - id: ch07-b03
          speaker: narrator
          text: >-
            She gave the prince one last look. It lingered on him until she felt almost faint. There was no anger in it and no attempt to wake him. Then, while dawn spread over the ship, she climbed onto the edge and threw herself into the sea. The cold water closed around her. She believed the witch's warning had come true and felt her body loosening, disappearing, and dissolving into foam.
        - id: ch07-b04
          speaker: narrator
          text: >-
            The sun climbed above the waves, and its warm rays touched the mermaid's cold foam. Yet she did not feel as if she were dying. The bright sun shone over her. Hundreds of beautiful, transparent beings floated in the air. Through their bodies she could see the ship's white sails and the red morning clouds.
        - id: ch07-b05
          speaker: narrator
          text: >-
            Their voices were sweet and otherworldly, but so delicate that no human ear could hear them. Human eyes could not see the beings either. The little mermaid looked down at herself and realized that she now had a body as clear and weightless as theirs. The sea foam no longer held her. With the transparent figures all around her, she rose higher and higher into the bright morning air.
        - id: ch07-b06
          speaker: little_mermaid
          text: >-
            Where am I?
          emotion: surprised
        - id: ch07-b07
          speaker: narrator
          text: >-
            Her voice had returned, but now it sounded as light and unearthly as the voices around her. No music on earth could have matched it.
        - id: ch07-b08
          speaker: daughter_of_air
          text: >-
            You are among the daughters of the air. A mermaid has no immortal soul. She can receive one only if a human being gives her his complete love, so her eternal fate depends on someone else. We daughters of the air have no immortal souls either, but we can earn them through our own good deeds.
        - id: ch07-b09
          speaker: daughter_of_air
          text: >-
            We fly to hot countries and cool the burning air that brings sickness and death to human beings. We pass over gardens and carry the scent of their flowers through the world, spreading health and healing wherever we go. No human sees us doing this work. After we have spent three hundred years trying to do every good thing in our power, we receive immortal souls of our own. Then we can share forever in the happiness promised to humankind.
        - id: ch07-b10
          speaker: daughter_of_air
          text: >-
            Little mermaid, you have already tried with all your heart to live as we do. You suffered and endured, and your good deeds lifted you into the world of spirits. Now you too may work for three hundred years and win an immortal soul.
          emotion: calm
        - id: ch07-b11
          speaker: narrator
          text: >-
            The little mermaid raised her shining eyes toward the sun. For the first time, tears filled them.
        - id: ch07-b12
          speaker: narrator
          text: >-
            Below her, life and noise returned to the ship. Sailors moved across the deck, and the prince and his beautiful bride came out to search for the missing girl. They looked across the water but could not see the spirit floating above them. Sorrowfully, they stared at the pearly patch of foam beside the ship, almost as if they knew that the little mermaid had thrown herself into the sea.
        - id: ch07-b13
          speaker: narrator
          text: >-
            Unseen, she kissed the bride's forehead and fanned the prince with cool air. Then she rose with the other daughters of the air toward a rosy cloud floating high above them.
        - id: ch07-b14
          speaker: little_mermaid
          text: >-
            After three hundred years, we will rise like this into the kingdom of heaven.
        - id: ch07-b15
          speaker: daughter_of_air
          text: >-
            We may arrive even sooner. We pass unseen through homes where children live. Whenever we find a good child who brings joy to loving parents and deserves their love, that whole day is taken from our time of trial. The child never knows that we are flying through the room. No one sees us smile with joy at that goodness, but because of it we may count one year less from our three hundred years.
        - id: ch07-b16
          speaker: daughter_of_air
          text: >-
            But when we enter a home and see a cruel or wicked child, sorrow makes us weep. The child does not see those tears either. Still, every tear has its cost. For each one we shed, another day is added to our three hundred years of trial.
