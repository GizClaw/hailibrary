audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容讲述，反讽含而不露
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    emperor:
      display_name: 皇帝
      tts:
        delivery: 爱慕虚荣，故作威严
        timbre: 饱满圆润
        pace: 稍慢
        pitch: 中低音
    swindler_one:
      display_name: 骗子甲
      tts:
        delivery: 殷勤机灵，胸有成竹
        timbre: 明亮灵活
        pace: 轻快
        pitch: 中音
    swindler_two:
      display_name: 骗子乙
      tts:
        delivery: 油滑热络，善于顺势帮腔
        timbre: 轻细清亮
        pace: 稍快
        pitch: 中高音
    old_minister:
      display_name: 老大臣
      tts:
        delivery: 忠厚谨慎，竭力镇定
        timbre: 苍老柔和
        pace: 稍慢
        pitch: 低音
    courtier:
      display_name: 官员
      tts:
        delivery: 克制谨慎，心中惶惑
        timbre: 清楚沉稳
        pace: 中等
        pitch: 中低音
    courtier_two:
      display_name: 朝臣乙
      tts:
        delivery: 热切逢迎，赞叹得格外响亮
        timbre: 洪亮圆润
        pace: 稍快
        pitch: 中音
    courtier_three:
      display_name: 朝臣丙
      tts:
        delivery: 谨慎附和，语气恭敬殷勤
        timbre: 轻柔清晰
        pace: 中等
        pitch: 中高音
    master_ceremonies:
      display_name: 典礼官
      tts:
        delivery: 正式恭谨
        timbre: 清晰端正
        pace: 稳定
        pitch: 中音
    child:
      display_name: 小孩子
      tts:
        delivery: 天真直接，毫不迟疑
        timbre: 稚嫩清亮
        pace: 自然
        pitch: 高音
    father:
      display_name: 孩子的父亲
      tts:
        delivery: 惊讶而认真
        timbre: 温和朴实
        pace: 中等
        pitch: 中低音
    onlooker_one:
      display_name: 百姓甲
      tts:
        delivery: 兴奋赞叹，后来震惊高喊
        timbre: 粗犷响亮
        pace: 稍快
        pitch: 中音
    onlooker_two:
      display_name: 百姓乙
      tts:
        delivery: 起初殷勤称赞，后来直率响应
        timbre: 清脆明亮
        pace: 中等
        pitch: 中高音
    onlooker_three:
      display_name: 百姓丙
      tts:
        delivery: 随众热切附和，醒悟后坚定喊出真相
        timbre: 温厚有力
        pace: 稳健
        pitch: 中低音
  chapters:
    - id: ch01
      title: 奇妙的布
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 许多许多年以前，有一位皇帝，爱新衣爱得不得了，所有的钱都花在了衣服上。他唯一的心愿，就是时时刻刻都穿得漂亮。他不关心自己的士兵，看戏也不能让他开心。他最喜欢坐着马车出去，让大家瞧他的新衣。他一天里每个时辰都有不同的外套。说起别的国王，人们会说国王在议政厅里。说起他，人们只会说皇帝在更衣室里。
        - id: ch01-b02
          speaker: narrator
          text: 皇帝住在一座热闹的大城里，每天都有世界各地的陌生人前来。一天，城里来了两个骗子。他们让人们相信自己是织工，还说能织出世上最美的布。那布的颜色和花纹美得出奇，还有一种奇妙的本领。不称职的人，或是愚蠢得无可救药的人，根本看不见它。
        - id: ch01-b03
          speaker: emperor
          text: 那一定是奇妙极了的布！我穿上这种布做的衣服，就能看出帝国里谁不称职，也能分清谁聪明、谁愚蠢。我要他们马上织出来。
        - id: ch01-b04
          speaker: narrator
          text: 皇帝预先给了骗子一大笔钱，叫他们一刻也别耽搁，立刻开工。两人架起两台织机，装作忙得不可开交，织机上却空空如也。他们要来最好的丝和最贵的金线，全都私吞了，只对着空织机一直忙到深夜。
        - id: ch01-b05
          speaker: emperor
          text: 真想知道他们织得怎么样了。
        - id: ch01-b06
          speaker: narrator
          text: 可皇帝想到，不称职的人看不见布，心里就不安起来。他自己认为没什么可怕的，却还是觉得，最好先派别人去探探情形。全城都知道这块布有多么非凡，人人也都急着看看，自己的邻人到底有多无能、多愚蠢。
        - id: ch01-b07
          speaker: emperor
          text: 就派那位忠诚的老大臣去吧。他聪明，又最懂自己的职务，一定最会判断布织得好不好。
    - id: ch02
      title: 空织机前
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 忠厚的老大臣走进房间，看见两个骗子坐在空织机前。他瞪大了眼睛。
        - id: ch02-b02
          speaker: old_minister
          text: 老天保佑！我怎么什么也看不见？
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: 可他一个字也没说。两个骗子请他靠近些，指着空织机，问他难道不喜欢那精美的花纹和漂亮的颜色吗。可怜的老大臣拼命地看，却什么也看不到。那里本来就什么也没有。
        - id: ch02-b04
          speaker: old_minister
          text: 难道我竟然这么愚蠢？我从来没想到会这样，千万不能让人知道！难道我不配做这个官？不行，我绝不能承认自己看不见这块布。
          emotion: fearful
        - id: ch02-b05
          speaker: swindler_one
          text: 怎么，您就没有什么想说的吗？
        - id: ch02-b06
          speaker: narrator
          text: 那骗子一边问，一边装作忙着织布。老大臣透过眼镜，仔细端详着空织机。
        - id: ch02-b07
          speaker: old_minister
          text: 真漂亮，实在太美了！瞧这花纹，还有这鲜亮的颜色！我一定告诉皇帝，我非常喜欢这块布。
        - id: ch02-b08
          speakers: [swindler_one, swindler_two]
          ensemble: duo
          text: 听您这么说，我们真高兴。
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: 两个骗子接着仔细描绘布的颜色，又讲解那奇特的花纹。老大臣专心听着，好把他们说的一切原原本本地禀告皇帝。他后来果真这样做了。骗子又要来更多的钱、丝和金线，说织布还需要这些。他们把东西全留给自己，连一根线也没放上织机，仍旧像先前一样，对着空织机不停干活。
        - id: ch02-b10
          speaker: narrator
          text: 不久，皇帝又派来一位忠诚的官员。他要这位官员查清织布的进展，也看看那块布是不是快要完成了。官员和老大臣一样，看了又看，还是什么也看不见。那里当然没有任何东西可看。
        - id: ch02-b11
          speakers: [swindler_one, swindler_two]
          ensemble: duo
          text: 您看，这块布难道不美吗？
        - id: ch02-b12
          speaker: narrator
          text: 两人指指点点，向他讲解着并不存在的华美花纹。
        - id: ch02-b13
          speaker: courtier
          text: 我并不愚蠢。那一定是我配不上这份好差事了。真奇怪，可我绝不能让任何人知道。
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: 他不愿让任何人知道真相，于是夸起自己看不见的布，又说那些漂亮的颜色和精巧的花纹让他欢喜极了。回到皇帝面前，他这样禀报。
        - id: ch02-b15
          speaker: courtier
          text: 那块布实在好得不得了！
    - id: ch03
      title: 皇帝看布
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 很快，全城都在谈论这块珍贵的布。皇帝终于也想趁它还在织机上，亲自去看一看。他带着一群朝臣来到两个聪明的骗子那里，先前来过的两位官员也跟着。骗子正拼命干活，手里却连一根线也没有。
        - id: ch03-b02
          speakers: [old_minister, courtier]
          ensemble: duo
          text: 真是华美极了！陛下快看，这颜色，这花纹，多值得欣赏啊！
        - id: ch03-b03
          speaker: narrator
          text: 两位老臣指着空织机。他们以为，别人一定能看见那块布。
        - id: ch03-b04
          speaker: emperor
          text: 这是怎么回事？我什么也看不见。太可怕了！难道我很愚蠢？难道我不配当皇帝？还有什么事能比这更可怕？
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 皇帝不肯承认自己什么也没看到。他转向织工，满意地点着头，望着空空的织机。
        - id: ch03-b06
          speaker: emperor
          text: 的确不错，这块布深得朕心。
        - id: ch03-b07
          speaker: narrator
          text: 随行的朝臣一个个看了又看，也和别人一样什么都看不见。可他们全都学着皇帝开口赞美，还一致劝他在即将举行的盛大游行上，穿上这套华美的新衣。
        - id: ch03-b08
          speaker: courtier
          text: 真是太美了！
          emotion: happy
        - id: ch03-b09
          speakers: [old_minister, courtier_two, courtier_three]
          ensemble: chorus
          text: 华美，漂亮，好极了！
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: 四下里全是华美、漂亮、好极了的赞叹声，人人仿佛都欢喜极了。皇帝还封两个骗子做了皇家御用织工。
    - id: ch04
      title: 皇帝的新装
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 游行前一夜，两个骗子装模作样地忙了整整一夜，点掉了十六支还不止的蜡烛。他们就是要让大家看见，自己正忙着赶制皇帝的新衣。两人假装从织机上取下布料，拿着大剪刀在空中剪来剪去，又用没有线的针缝了起来。
        - id: ch04-b02
          speakers: [swindler_one, swindler_two]
          ensemble: duo
          text: 皇帝的新装已经做好了！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 皇帝带着所有贵族来到大厅。两个骗子高高举起双臂，好像手里真的托着什么东西，随后把那套看不见的新装一件件介绍起来。
        - id: ch04-b04
          speakers: [swindler_one, swindler_two]
          ensemble: duo
          text: 这是裤子，这是外套，这边是披风！它们轻得像蛛网，穿在身上简直感觉不到。这正是它们最妙的地方。
        - id: ch04-b05
          speakers: [courtier, courtier_two, courtier_three]
          ensemble: chorus
          text: 可不是吗！
        - id: ch04-b06
          speaker: narrator
          text: 其实朝臣们什么也看不见，因为那里根本没有衣服。
        - id: ch04-b07
          speakers: [swindler_one, swindler_two]
          ensemble: duo
          text: 请陛下开恩，宽衣吧。让我们在这面大穿衣镜前，服侍陛下换上新装。
        - id: ch04-b08
          speaker: narrator
          text: 皇帝脱下衣服。两个骗子装作把新装一件一件给他穿上。皇帝站在镜子前，转来转去，从各个方向打量自己。
        - id: ch04-b09
          speaker: courtier_two
          text: 多么漂亮，多么合身！
          emotion: happy
        - id: ch04-b10
          speaker: courtier_three
          text: 花纹真美，颜色真鲜亮！这身衣服实在太华美了！
          emotion: happy
        - id: ch04-b11
          speaker: master_ceremonies
          text: 陛下，游行时为您擎华盖的人已经准备好了。
        - id: ch04-b12
          speaker: emperor
          text: 朕也准备好了。这身衣服不是合身得出奇吗？
        - id: ch04-b13
          speaker: narrator
          text: 他又转身照了一遍镜子，好让别人相信，他正在欣赏身上的衣服。
    - id: ch05
      title: 孩子的声音
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 负责提衣裾的侍从把手伸到地面，假装提起长长的后摆，又装作手里真托着什么。他们不愿让人知道，自己什么也没看见。
        - id: ch05-b02
          speaker: narrator
          text: 皇帝走在华美的华盖下，跟着游行队伍向前。街道两旁和窗前的人一见他，全都高声赞叹。
        - id: ch05-b03
          speaker: onlooker_one
          text: 皇帝的新装真是无与伦比！
        - id: ch05-b04
          speaker: onlooker_two
          text: 瞧那衣裾，拖得多长啊！
        - id: ch05-b05
          speaker: onlooker_three
          text: 穿在身上多合适啊！
        - id: ch05-b06
          speaker: narrator
          text: 谁也不愿让别人知道自己什么都没看见。不然，别人就会觉得他不称职，或者愚蠢至极。从来没有哪位皇帝的衣服得到过这么多赞美。
        - id: ch05-b07
          speaker: child
          text: 可是，他根本什么也没穿呀！
          emotion: surprised
        - id: ch05-b08
          speaker: father
          text: 天哪，听听这天真孩子说的话吧！
          emotion: surprised
        - id: ch05-b09
          speaker: narrator
          text: 人们交头接耳，把孩子的话一个传给另一个。最后，所有人都喊了起来。
        - id: ch05-b10
          speakers: [onlooker_one, onlooker_two, onlooker_three]
          ensemble: chorus
          text: 可是，他根本什么也没穿！
          emotion: surprised
        - id: ch05-b11
          speaker: narrator
          text: 皇帝深受震动，因为他觉得百姓说得没错。
        - id: ch05-b12
          speaker: emperor
          text: 事到如今，朕一定要撑到最后。
        - id: ch05-b13
          speaker: narrator
          text: 侍从们也越发庄严地向前走着，仿佛手中真的托着那根本不存在的衣裾。
