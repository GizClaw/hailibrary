audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而略带幽默的童话讲述
        timbre: 温暖清澈
        pace: 舒缓有变化
        pitch: 中音
    princess:
      display_name: 公主
      tts:
        delivery: 真诚直率，疲惫时带着委屈
        timbre: 年轻明亮
        pace: 自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 寻找真正的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个王子想娶一位公主。不过，他要找的必须是真正的公主。他跑遍全世界，见过的公主倒不少，却总也分不清她们是真是假。每一位似乎都有哪里不太对。最后，王子只好回家。他很伤心，因为他实在想娶一位真正的公主。
    - id: ch02
      title: 暴风雨中的来客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天晚上，暴风雨突然来了。雷声一阵接一阵，闪电不停地亮，大雨像从天上倒下来一样。就在这时候，有人敲响了城门。老国王走过去，打开了城门。
        - id: ch02-b02
          speaker: narrator
          text: 门外竟然站着一位公主。可是，风雨把她弄得狼狈极了。水顺着头发和衣服往下流，灌进鞋尖，又从鞋跟流了出来。尽管如此，她还是说，自己是一位真正的公主。
    - id: ch03
      title: 一颗豌豆的考验
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老王后听了，心里想，是真是假，很快就能知道。她没有声张，只走进卧室，拿掉床架上所有的铺盖，在最底下放了一颗豌豆。然后，她在豌豆上铺了二十床褥子，又在褥子上摞了二十床鸭绒被。
        - id: ch03-b02
          speaker: narrator
          text: 这一夜，公主就睡在那张床上。第二天早晨，大家问她昨晚睡得好不好。
        - id: ch03-b03
          speaker: princess
          text: 一点也不好！我整夜几乎都没合眼。谁知道床里藏着什么，我一直硌着一个硬东西，现在浑身青一块紫一块的。真是太可怕了！
    - id: ch04
      title: 真正的公主
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这下，大家终于确定，她就是一位真正的公主。隔着二十床褥子和二十床鸭绒被，她居然还能感觉到那颗豌豆。
        - id: ch04-b02
          speaker: narrator
          text: 除了真正的公主，谁还能这样娇嫩敏感呢？
        - id: ch04-b03
          speaker: narrator
          text: 王子便娶她做了妻子，因为他知道，自己找到的确实是一位真正的公主。那颗豌豆则被放进了博物馆。要是还没被谁偷走，现在也许还能在那里看见它。
        - id: ch04-b04
          speaker: narrator
          text: 你瞧，这个故事可是千真万确的。
