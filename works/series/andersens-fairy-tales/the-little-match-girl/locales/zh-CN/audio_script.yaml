audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔克制地讲述，悲伤处不刻意煽情
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    match_girl:
      display_name: 小女孩
      tts:
        delivery: 稚嫩虚弱，见到祖母时急切而充满盼望
        timbre: 纤细清亮
        pace: 稍慢
        pitch: 偏高
    passersby:
      display_name: 路人
      tts:
        delivery: 平常而不经意
        timbre: 自然朴素
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 除夕的街头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那是旧年的最后一夜。天冷得吓人，马上就要黑了，雪还一个劲儿地往下落。街上走着一个穷苦的小女孩。她没戴帽子，脚上也什么都没有。其实出门的时候，她还穿着拖鞋。只是那双鞋原先是母亲的，对她来说实在太大。她跑过街道，躲闪两辆飞驰而来的马车，鞋就在慌乱中丢了。一只再没找到。另一只让一个男孩抢走了，他边跑边说，以后自己有了孩子，正好拿它当摇篮。小女孩只好光着脚继续走。她的脚早已冻得一块红、一块青。旧围裙里装着许多火柴，手上还拿着一扎。可她卖了整整一天，一根也没人买，一分钱也没人给。她饿着肚子，冷得直发抖，只能慢慢向前挪。雪花落到她金色的长发上，卷发披着肩膀，她已经顾不得去管了。
    - id: ch02
      title: 第一根火柴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一扇扇窗户亮着灯，烤鹅的香味从屋里飘到街上。她忽然记起来，今天是除夕。两座房子中间有个角落，其中一座往街上多伸出来一截。她就在那儿坐下，把自己缩成一团，又把脚藏到身子底下。可还是冷。她不敢回家，因为一根火柴也没卖掉，手里连一分钱都没有。父亲准会打她。何况那个家又能暖和多少呢？头顶只有一片屋顶，风从缝里呼呼穿过。就连最大的洞，也不过拿稻草和破布堵住罢了。她的手指都快冻住了。抽一根火柴出来，在墙上擦着，只暖一暖手，应该会好受些吧？她真的抽了一根。嚓！火柴噼啪地烧起来，亮亮的，暖暖的，像手里捧着一支小蜡烛。那道光太奇妙了。她仿佛坐到一只大铁炉旁边。黄铜炉脚亮闪闪的，炉身还带着黄铜装饰。里面的火烧得多旺，多暖啊。她刚把双脚伸过去，火苗就灭了。铁炉转眼消失，掌心里只留下半截焦黑的火柴梗。
    - id: ch03
      title: 火光里的景象
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 她又拿起一根，在墙上一擦。火焰蹿了出来。火光落到哪里，那里的墙就像一层薄纱，屋内看得清清楚楚。雪白的桌布铺在桌上，上面是华美的餐具，还有一只刚出炉的烤鹅，正冒着热气，肚子里塞满苹果和西梅干。接着，更奇妙的事出现了。那只鹅跳下盘子，胸口插着刀和叉，摇摇摆摆地走过地板，一直来到她面前。就在这时，火柴熄灭了。桌子、餐具、烤鹅全不见了，她看到的仍是那堵又厚又湿的冷墙。
        - id: ch03-b02
          speaker: narrator
          text: 第三根火柴亮起时，她已经坐在一棵美丽的圣诞树下面了。她曾隔着玻璃门，看过富商家里的圣诞树。眼前这一棵比那棵还大，装饰得还漂亮。绿色枝条上点着数也数不清的小蜡烛，一张张彩色画片从上面俯望下来，和橱窗中陈列的一模一样。她才朝那些画片伸出手，火光又暗了下去。
    - id: ch04
      title: 祖母
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 圣诞树上的灯火越升越高，最后变成了天上的星星。就在这时，一颗星坠了下来，在夜空中拖出一道明亮的火光。
        - id: ch04-b02
          speaker: match_girl
          text: 有人要死了。
        - id: ch04-b03
          speaker: narrator
          text: 年老的祖母曾告诉过她，每当一颗星星落下，就有一个灵魂升到上帝那里。祖母是世上唯一疼爱过她的人，可现在，祖母也已经去世了。她又在墙上擦亮一根火柴。光芒照亮四周，祖母就站在光里。她看得清清楚楚，祖母浑身明亮，神情还是那么温柔慈爱。
        - id: ch04-b04
          speaker: match_girl
          text: 祖母！带我一起走吧！我知道，火柴一灭，您就会离开。您也会像那只温暖的铁炉、那只烤鹅，还有那棵又高又漂亮的圣诞树一样消失。
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 她赶紧点燃了整扎火柴，只想把祖母留在身边。所有火柴一同发出光来，比正午的太阳还要明亮。祖母从来没有显得这样高大，这样美丽。她把小女孩抱进怀里，两个人在光明和喜悦中飞向高处，越飞越高，远远离开了大地。那里没有寒冷，没有饥饿，也没有痛苦，因为她们和上帝在一起。
    - id: ch05
      title: 新年的清晨
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 天亮了。那个可怜的小女孩仍靠着墙，脸颊没有一丝血色，嘴角却含着微笑。就在旧年的最后一夜，她冻死了。新年的太阳升上来，照着这具小小的尸体。孩子的身体已经僵硬，手中却还攥着火柴，有一整扎都烧完了。
        - id: ch05-b02
          speaker: passersby
          text: 她一定是想让自己暖和一点。
        - id: ch05-b03
          speaker: narrator
          text: 可谁也想不到，她曾看见多么美丽的景象。更没有人知道，新年的第一天，她已经和祖母一起走进了怎样的光辉里。
