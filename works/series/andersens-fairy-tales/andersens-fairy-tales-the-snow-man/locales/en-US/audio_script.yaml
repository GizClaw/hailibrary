  chapters:
    - id: ch01
      title: A Cold Night in the Yard
      blocks:
        - id: ch01-b01
          speaker: snow_man
          text: >-
            What wonderful cold! It makes my whole body crackle. This wind could blow life into anyone. But look at that huge red thing up there, staring straight at me! It won't make me blink. I'll keep myself together.
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Snow Man meant the setting sun. Two triangular pieces of tile served as his eyes. His mouth was an old, broken rake, so of course it came with teeth. He had come to life among the happy shouts of boys, while sleigh bells jingled and whips slashed through the air. Now the sun slipped away. A full moon rose into the deep blue sky, large, round, and clear.
        - id: ch01-b03
          speaker: snow_man
          text: >-
            There it is again, coming from the other side! I taught it not to stare, though. Now it can hang up there and shine so I can see myself properly. If only I knew how to move away from this one spot. I'd love to slide over the ice the way I've watched the boys do. But I don't understand how they manage it. I don't even know how to run.
        - id: ch01-b04
          speaker: yard_dog
          text: >-
            Away, away! The sun will make you run one day. Last winter I watched it make the Snow Man before you run, and the one before him too. Away, away! Every one of you has to go.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The old yard dog had once lived indoors beside the fire. He had been hoarse ever since, so he could no longer bark a proper bow-wow.
        - id: ch01-b06
          speaker: snow_man
          text: >-
            I don't follow you, friend. Will that thing above us teach me to run? A little while ago, I saw it run away. Now it has crept back from the other side.
        - id: ch01-b07
          speaker: yard_dog
          text: >-
            You don't know a thing, do you? Well, you were only put together a short time ago. That's the moon up there. The other one was the sun. It will return tomorrow and probably teach you to run right down into the ditch by the well. The weather is about to change. My left leg is prickling and stabbing. That always means a change is coming.
        - id: ch01-b08
          speaker: snow_man
          text: >-
            I don't understand what he's saying. Still, I have a feeling it's something terribly unpleasant. And that one who stared at me a moment ago, the one he calls the sun, is certainly no friend of mine. I can feel that too.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The yard dog barked, "Away, away!" Then he turned around three times and crawled into his kennel to sleep.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The weather truly did change. Near morning, thick fog covered all the countryside around them. Then a sharp wind rose, and the cold seemed to freeze right through the bones. But when the sun came up, the sight was splendid.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Hoarfrost covered every tree and bush, turning them into a forest of white coral. Frozen drops glittered along every twig. In summer, thick leaves had hidden all the delicate shapes of the branches. Now every one stood clear, like shining lace, and each twig gave off a white gleam. The birch swayed in the wind as if it were alive and dressed in summer leaves again. Wherever sunlight touched, everything glittered and flashed. The snowy ground looked sprinkled with diamond dust, and countless points of light shone even whiter than the snow.
    - id: ch02
      title: What the Yard Dog Knew
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            A young girl entered the garden with a young man. They stopped beside the Snow Man and gazed at the glittering world around them. The sight made the girl's eyes sparkle.
        - id: ch02-b02
          speaker: young_girl
          text: >-
            It really is beautiful. Even summer couldn't give us a lovelier sight.
          emotion: happy
        - id: ch02-b03
          speaker: young_man
          text: >-
            And summer can't give us a fine fellow like this one. He's magnificent!
        - id: ch02-b04
          speaker: narrator
          text: >-
            He pointed to the Snow Man. The young girl laughed, gave the Snow Man a friendly nod, and then tripped away across the snow with her companion. Each step under her feet made the snow creak and crackle as though she were walking on starch.
        - id: ch02-b05
          speaker: snow_man
          text: >-
            Who were those two? You've been here much longer than I have. Do you know them?
        - id: ch02-b06
          speaker: yard_dog
          text: >-
            Of course. She has patted my back many times, and he has brought me a meaty bone. I never bite either of them.
        - id: ch02-b07
          speaker: snow_man
          text: >-
            Yes, but what are they?
        - id: ch02-b08
          speaker: yard_dog
          text: >-
            They're sweethearts. Before long, they'll share one kennel and chew on the same bone. Away, away!
        - id: ch02-b09
          speaker: snow_man
          text: >-
            Are they the same sort of creatures as you and me?
        - id: ch02-b10
          speaker: yard_dog
          text: >-
            At least they belong to the same master. Someone born yesterday doesn't know much. You're proof of that. I have age and experience. I know everyone in the house, and I remember when I didn't have to lie outside in the cold on a chain. Away, away!
        - id: ch02-b11
          speaker: snow_man
          text: >-
            I love the cold. But please, tell me more. And try not to rattle your chain. The sound goes right through me.
        - id: ch02-b12
          speaker: yard_dog
          text: >-
            Away, away! They used to say I was a pretty little fellow. Up in the master's house, I lay on a velvet-covered chair or sat right in the mistress's lap. They kissed my nose and wiped my paws with an embroidered handkerchief. Everyone called me Ami, dear Ami, sweet Ami.
        - id: ch02-b13
          speaker: yard_dog
          text: >-
            After a while, I grew too big for them. They sent me down to the housekeeper's room on the lower floor. You can look straight into it from where you stand. I was the master there, truly the master of the housekeeper. The room was smaller than the ones upstairs, but I was much more comfortable. The children weren't forever picking me up and pulling me around. My food was just as good, perhaps even better, and I had a cushion all to myself.
        - id: ch02-b14
          speaker: yard_dog
          text: >-
            Best of all, there was a stove. At this time of year, nothing in the whole world is finer. I used to crawl all the way beneath it and lie there in comfort. Ah, I still dream about that stove. Away, away!
        - id: ch02-b15
          speaker: snow_man
          text: >-
            Is a stove beautiful? Does it look anything like me?
        - id: ch02-b16
          speaker: yard_dog
          text: >-
            It's your exact opposite. Black as a crow, with a long neck and a brass knob. It eats firewood, and fire shoots from its mouth. To be comfortable, you stay beside it or underneath it. Look through the window. You can see it from here.
        - id: ch02-b17
          speaker: narrator
          text: >-
            The Snow Man looked through the window. Inside stood a bright, polished object with a brass knob, and fire gleamed from its lower part. A strange feeling came over him. It was very odd. He did not know what it meant, and he could not explain it at all. But people who aren't made of snow might have understood.
        - id: ch02-b18
          speaker: snow_man
          text: >-
            Then why did you leave her? How could you ever give up a place like that?
        - id: ch02-b19
          speaker: narrator
          text: >-
            The Snow Man seemed to think that the stove must be female.
        - id: ch02-b20
          speaker: yard_dog
          text: >-
            I had no choice. They turned me out of the house and chained me here. The master's youngest son kicked away the bone I was chewing, so I bit him in the leg. Bone for bone, I thought. But everyone became terribly angry. From that day on, I've been tied to this chain, and I lost my bone. Hear how hoarse I am? Away, away! I can't speak the way other dogs do anymore. Away, away! That's the end of the whole story.
    - id: ch03
      title: Longing for the Stove
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The Snow Man was no longer listening. He stared through the lower window into the housekeeper's room. There stood the stove on its four iron legs, looking about the same size as the Snow Man himself.
        - id: ch03-b02
          speaker: snow_man
          text: >-
            What is this strange crackling I feel inside me? Will I ever manage to get into that room? Mine is such an innocent wish, and innocent wishes are surely meant to come true. I must go in there and lean against her, even if I have to break the window first.
        - id: ch03-b03
          speaker: yard_dog
          text: >-
            You must never go inside. If you get close to that stove, you'll melt away, away!
        - id: ch03-b04
          speaker: snow_man
          text: >-
            I may as well try. I feel as if I'm falling apart already.
        - id: ch03-b05
          speaker: narrator
          text: >-
            All day, the Snow Man looked through the window. By twilight, the room seemed more inviting than ever. A gentle glow came from the stove. It was nothing like the sun or the moon. No, this was the bright, warm light that shines from a stove after it has been well fed with wood.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Whenever someone opened its door, flames darted from its mouth. Every stove does that. The fire cast a warm red gleam straight across the Snow Man's face and chest.
        - id: ch03-b07
          speaker: snow_man
          text: >-
            I can't bear this any longer. How beautiful she looks when she stretches out her tongue!
        - id: ch03-b08
          speaker: narrator
          text: >-
            The night was long, but it did not seem long to the Snow Man. He remained at the window, wrapped up in his own thoughts and crackling in the cold.
        - id: ch03-b09
          speaker: narrator
          text: >-
            By morning, ice covered the windowpanes of the housekeeper's room. The frost had made the loveliest ice flowers any Snow Man could wish for. But those beautiful flowers hid the stove. The frozen glass would not thaw, so he could no longer see any part of it.
        - id: ch03-b10
          speaker: narrator
          text: >-
            In his mind, he pictured the stove as a lovely human being. Snow crackled all around him, and the wind whistled past. It was exactly the kind of hard, frosty weather a Snow Man should enjoy from head to toe. Yet he took no pleasure in it. How could he enjoy anything when he was sick with longing for a stove?
        - id: ch03-b11
          speaker: yard_dog
          text: >-
            Stove sickness is a terrible thing for a Snow Man. I had it myself once, but I recovered. Away, away! The weather is about to change.
    - id: ch04
      title: When Winter Passed
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The weather changed just as the dog had said. The thaw began slowly. Then, as the warmth increased, the Snow Man decreased. He said nothing at all and made no complaint. With him, that silence was a sure sign.
        - id: ch04-b02
          speaker: narrator
          text: >-
            One morning, he broke apart and sank all the way down. Where he had stood, something like a broomstick remained sticking out of the ground. It was the pole the boys had packed the snow around when they first built him.
        - id: ch04-b03
          speaker: yard_dog
          text: >-
            Ah, now I understand why he had such a powerful longing for the stove. Why, look at that! The shovel they use for cleaning out the stove is fastened right to the pole.
        - id: ch04-b04
          speaker: narrator
          text: >-
            All along, the Snow Man had carried a stove scraper inside his body. That old piece of iron was what had moved him so deeply.
        - id: ch04-b05
          speaker: yard_dog
          text: >-
            But it's over now. Away, away!
        - id: ch04-b06
          speaker: narrator
          text: >-
            Before long, winter passed. The hoarse yard dog still barked, "Away, away!" Inside the house, the girls sang.
        - id: ch04-b07
          speakers: [house_girl_one, house_girl_two, house_girl_three]
          ensemble: chorus
          text: >-
            Come from your fragrant home, green thyme. Stretch out your soft branches, willow tree. The months are bringing sweet springtime, when the lark sings joyfully in the sky. Come, gentle sun, while the cuckoo sings, and I'll echo its call as I wander.
        - id: ch04-b08
          speaker: narrator
          text: >-
            And no one thought of the Snow Man anymore.
