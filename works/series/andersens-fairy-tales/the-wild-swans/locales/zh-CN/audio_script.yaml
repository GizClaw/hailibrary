  chapters:
    - id: ch01
      title: 被赶出宫的孩子们
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很远很远的地方，有一个燕子到了冬天就会飞去的国度。那里住着一位国王，他有十一个儿子，还有一个女儿，名叫艾丽莎。十一个哥哥全是王子。每天去上学时，他们胸前都佩着星星，腰间都悬着宝剑。他们拿钻石笔在金石板上写字，功课学得飞快，读书也读得非常流利。不管是谁，都能一眼看出他们身份不凡。艾丽莎坐在水晶玻璃小凳上，翻看一本值半个王国的图画书。那时候，这十二个孩子过得多么幸福啊。可惜，幸福没有一直留下来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            国王后来娶了一位狠毒的王后。婚礼第二天，孩子们玩招待客人的游戏，等着像往常一样分吃宴席剩下的糕点和苹果。王后却只给他们一茶杯沙子，还叫他们把沙子当成糕点。又过了一个星期，她把小艾丽莎送到乡下一户农民家里，再到国王面前说尽王子们的坏话。全是谎言，可国王听信了，从此再也不管自己的儿子。
        - id: ch01-b03
          speaker: queen
          text: >-
            都到外面去，自己养活自己！变成一群不会说话的大鸟，飞得远远的！
        - id: ch01-b04
          speaker: narrator
          text: >-
            王后想把他们变成丑陋的怪物，魔法却没能完全听她使唤。十一个王子变成了十一只美丽的野天鹅。他们发出奇异的叫声，飞出宫窗，越过花园，直向远方的森林飞去。清晨，他们从妹妹住的农舍上空经过。艾丽莎还睡着。天鹅们在屋顶上盘旋，弯着长颈，不停拍动翅膀，可谁也没看见，谁也没听见。他们没有办法，只好飞进高高的云层，越过宽广的天地。最后，他们来到一片茂密幽暗的森林。那片森林伸向很远很远的地方，一直抵达海岸。
        - id: ch01-b05
          speaker: narrator
          text: >-
            农舍里的艾丽莎没有别的玩具，只能拿一片绿叶来玩。她在叶上戳个小洞，透过小洞看太阳，仿佛又看见哥哥们明亮的眼睛。阳光暖暖地照着脸颊，她就想起哥哥给过自己的亲吻。日子一天接一天过去。风有时吹响玫瑰丛，悄悄问谁能比玫瑰更美。
        - id: ch01-b06
          speaker: roses
          text: 艾丽莎比我们更美。
        - id: ch01-b07
          speaker: narrator
          text: >-
            星期日，收留她的老妇人坐在门口读赞美诗。风翻动书页，又问谁能比这本书更虔诚。
        - id: ch01-b08
          speaker: hymn_book
          text: 艾丽莎比我更虔诚。
        - id: ch01-b09
          speaker: narrator
          text: >-
            玫瑰和诗集说的都是真话。艾丽莎十五岁时回到宫中，出落得非常美丽。王后妒火中烧，恨不得马上把她也变成天鹅。可国王正等着见女儿，她还不敢这么做。一天清早，王后来到铺着大理石、摆满织锦软垫的浴室。她带着三只癞蛤蟆，分别吻了它们。
        - id: ch01-b10
          speaker: queen
          text: >-
            第一只，艾丽莎一下水，你就蹲到她头上，让她变得和你一样蠢。第二只，你趴在她额头，让她变得和你一样丑，叫她父亲再也认不出来。第三只，你伏在她心口，把邪恶放进她心里，让她一辈子受苦。
        - id: ch01-b11
          speaker: narrator
          text: >-
            三只癞蛤蟆一进清水，立刻变成绿色。王后叫来艾丽莎，亲手帮她走进浴池。姑娘把头浸进水里，三只癞蛤蟆照着吩咐，分别落在她的头发、额头和胸口。艾丽莎却毫无感觉。等她起身，水上只漂着三朵红罂粟。若不是中了女巫的毒吻，它们本该变成红玫瑰。艾丽莎的头脑和心灵太纯洁，邪术碰到她，只能把邪物化成花。王后见计策落空，就用核桃汁把她的脸涂黑，扯乱她的头发，再抹上恶臭的油膏。这样一来，再没人认得出她了。
        - id: ch01-b12
          speaker: narrator
          text: >-
            国王见了大惊失色，认定眼前的人绝不是自己的女儿。只有看门狗和燕子还认识她，可惜它们只是不会说话的动物。艾丽莎哭着想起远方的十一个哥哥。她满怀悲伤，悄悄离开王宫，走过一整天的田野和荒原，来到那座大森林。她不知道该往哪个方向去，却下定决心寻找同样被赶到外面世界的哥哥。她进森林还没多久，天就黑了，脚下的路也完全不见了。她只好躺在柔软的苔藓上，做完每天晚上的祷告，把头靠着一截树桩。四周安安静静，和暖的风轻轻吹过额头。成百只萤火虫亮在草和苔藓之间，像绿色的小火苗。她的手哪怕只轻轻碰一下树枝，亮晶晶的小虫也会纷纷落下，像一颗颗划过夜空的流星。
        - id: ch01-b13
          speaker: narrator
          text: >-
            那一夜，梦里的兄妹们又回到了童年。哥哥们拿钻石笔在金石板上写字，艾丽莎看着那本珍贵的图画书。他们写下的不再是字母和横线，而是自己做过的好事，还有一路见过、发现过的一切。图画书里也全活了。鸟儿唱歌，书里的人走出来同他们交谈；只要书页一翻，那些人又赶紧跳回原位，免得画面乱了次序。
        - id: ch01-b14
          speaker: narrator
          text: >-
            醒来时，太阳已经升得很高。密密的树冠遮住天空，阳光从叶缝里漏下来，像金色的雾。嫩叶散发着清香，鸟儿飞得这样近，几乎要落到她肩上。她听见许多泉眼潺潺作响，水全流进一座金沙铺底的湖。湖边灌木茂密，只有一处被鹿踏开了缺口。艾丽莎从那里走到水边。湖水清得像不存在似的，阴影里的叶子和阳光下的叶子，都原原本本映在水底。若不是风吹得树枝摇动，那些倒影简直像画上去的。艾丽莎一看到自己又黑又丑的脸，吓得后退。可她用湖水擦擦眼睛和额头，白净的皮肤便重新露出来。她干脆走进清凉的水里，洗净全身。再上岸时，世上再找不出比她更美的公主了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            她穿好衣裳，编好长发，又走到冒着水泡的泉眼旁，用手掌捧水喝了几口。接着，她继续往森林深处走，自己也不知道要去哪里。可她相信，上帝不会丢下自己。林中的野苹果正是上帝赐给饥饿之人的食物。不久，她便找到一棵果实压弯枝头的苹果树。她在那里吃了午饭，还用木棍撑起低垂的树枝。再往前，树林越来越黑。那里听不见鸟叫，照不进阳光。四周静得让她听清自己的每一步，也听得见脚底每一片枯叶碎裂的声音。一排排高大树干靠得很近，像层层格栅一样围着她。艾丽莎从没体会过这样的孤独。夜里一片漆黑，连苔藓上的萤火虫也不亮了。她忧伤地躺下，朦胧中仿佛看见头顶枝条分开，天使温柔的眼睛从天上望着自己。第二天醒来，她说不清那是梦，还是真的。
    - id: ch02
      title: 海边重逢
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            艾丽莎继续走。没走多远，她遇见一位提着浆果篮子的老妇人。老妇人拿果子给她吃。艾丽莎问，有没有十一个王子骑马从这里经过。
        - id: ch02-b02
          speaker: old_woman
          text: >-
            王子倒没见过。不过昨天，我看见十一只头戴金冠的天鹅，就在附近那条河里游水。
        - id: ch02-b03
          speaker: narrator
          text: >-
            老妇人带她来到一条小河边。两岸的树木把长枝伸向彼此，有些树甚至把根挣出地面，只为让水上的枝叶交织在一起。艾丽莎道了谢，沿河一路走到海边。壮阔的大海就在面前，可一片帆也没有，一条小船也看不见。她又该怎么走下去？岸边的玻璃、铁块和无数石子，都被海水磨得又圆又滑，摸起来甚至比她的手还细腻。
        - id: ch02-b04
          speaker: eliza
          text: >-
            海水从不觉得累，滚啊滚，终于把坚硬的东西全磨平了。我也不会停下来。明亮的波浪，谢谢你们教我坚持。我的心告诉我，你们会领我找到哥哥。
        - id: ch02-b05
          speaker: narrator
          text: >-
            海草覆着白沫，上面散落着十一根白色天鹅羽毛。艾丽莎一根根拾起，珍惜地收在一起。羽毛上的水珠是露水还是眼泪，谁也不知道。海岸明明空无一人，她却不觉得寂寞。大海每时每刻都在变化，短短几小时里的模样，比最善变的湖泊一整年里还多。黑云沉沉压来，大海便像在说，它也会阴暗，也会发怒。风一吹，浪头立刻卷起白沫。风睡了，云被夕阳染红，海面又像一片柔软的玫瑰花瓣。就算白亮的海水平静如镜，岸边仍有波浪一下下起伏，好像熟睡孩子的胸膛。
        - id: ch02-b06
          speaker: narrator
          text: >-
            太阳快落山时，十一只头戴金冠的白天鹅排成长长一列，像一条白绸带飞向陆地。艾丽莎赶紧藏到岸坡下的灌木后面。天鹅就在她身旁落下，拍动巨大的白翼。太阳沉入水下，羽毛纷纷脱落，十一个英俊的王子站了起来。艾丽莎一眼认出哥哥，大叫着扑进他们怀中，一个个喊出名字。哥哥们也认出了已经长高的妹妹。大家又笑又哭，很快便说清了狠毒继母加在彼此身上的苦难。
        - id: ch02-b07
          speaker: eldest_brother
          text: >-
            只要太阳还在天上，我们就只能做野天鹅。太阳落到山后，我们才能变回人。所以每天日落以前，必须找到地方落脚。要是那时还在云里，我们一恢复人形，就会掉进海中。我们的住处在大海另一边，那里也很美，却不是故乡。一路上没有岛，只有一块小礁石。兄弟十一个紧紧挤着，也很难站稳。风浪一来，海水就从头顶打过去。可我们仍要感谢上帝留下那块礁石。没有它，我们飞不过这片海。
        - id: ch02-b08
          speaker: eldest_brother
          text: >-
            横渡大海，要用掉一年里最长的两个白昼。我们每年只能回来一次，在这里停留十一天。我们会飞过森林，看看父亲住的宫殿，看看我们出生的地方，也看看母亲长眠的教堂。这里每一棵树、每一丛灌木，都像自家亲人。野马还像我们小时候见到的那样，在原野上奔跳。烧炭人仍唱着我们儿时跳舞听过的老歌。亲情把我们带回故乡，也让我们重新找到了你。可是再过两天，我们又得离开。没有船，也没有小舟，我们怎么带你一起走呢？
        - id: ch02-b09
          speaker: eliza
          text: 哥哥，怎样才能破掉你们身上的魔法？
        - id: ch02-b10
          speaker: narrator
          text: >-
            她和哥哥们谈了将近一夜，只睡了一小会儿。清晨，拍翅声把她唤醒。哥哥们又成了天鹅，在空中一圈圈盘旋，越飞越远。只有最小的天鹅留下，把头枕在妹妹膝上，让她轻轻抚摸翅膀。傍晚，其余天鹅飞回来，夕阳一落，他们重新恢复人形。
        - id: ch02-b11
          speaker: brother
          text: >-
            明天我们就要走了，得过整整一年才能回来。可我们不能把你一个人留在这里。你敢跟我们走吗？我的手臂能抱你穿过森林，我们十一个兄弟的翅膀，也一定能带你飞过大海。
        - id: ch02-b12
          speaker: eliza
          text: 我敢。请带我走。
        - id: ch02-b13
          speaker: narrator
          text: >-
            兄妹们用柳条和灯心草编了一整夜，做成一张又大又结实的网。艾丽莎躺在网上睡着了。太阳一升起，哥哥们化为天鹅，用嘴衔起网，把她带上云端。一只天鹅始终飞在她头顶，用宽阔的翅膀挡住照向妹妹脸庞的阳光。
        - id: ch02-b14
          speaker: narrator
          text: >-
            艾丽莎醒来时，陆地早已不见。被哥哥们托在这么高的空中，飞越无边大海，她简直以为自己还在梦里。身边放着一枝熟透的浆果和一捆甘甜的根茎，是小哥哥特意采来留给她的。她也认出，飞在上面、用翅膀替自己遮阳的正是他，于是朝他微笑道谢。他们飞得实在太高了。下方的一艘大船，看上去只有一只贴着海浪滑过的白海鸥那么小。身后巨大的云团像一座高山，她和十一只天鹅的影子投在云上，每一个都高大得像巨人。这景象比她看过的任何图画都壮丽。可太阳越升越高，云团渐渐被抛远，那幅巨大的影子画也消散了。
        - id: ch02-b15
          speaker: narrator
          text: >-
            他们整天像一支有翅膀的箭，向前飞去。只是带着妹妹，速度比往常慢。风暴眼看就要来了，海里的小礁石却迟迟不出现。艾丽莎看着不断下沉的太阳，焦急万分。哥哥们越来越用力地拍翅。她明白，是自己的重量拖慢了他们。一旦太阳落下，他们会在空中变回人，坠海而死。她从心底祈求上帝。乌云逼近，狂风骤起，闪电一道接着一道。太阳已经触到海面，天鹅们猛地向下俯冲，快得让她浑身发颤。她以为大家正在坠落，可他们又拼命向前冲去。
        - id: ch02-b16
          speaker: narrator
          text: >-
            终于，艾丽莎看见礁石就在正下方，可它只有一颗海豹探出水面的脑袋那么大。这时，太阳已沉下一半。天鹅飞速落下。双脚碰到礁石时，太阳只剩星星般一点亮光，接着像烧尽的纸上最后一粒火星，彻底熄灭。哥哥们恢复人形，手臂挽着手臂，紧紧围住妹妹。礁石只够他们勉强站立，连一小块空地都没有。海浪一次次撞上来，水沫盖过众人的身体。闪电接连不断，把整片天空照得通亮，雷声一阵接一阵，从头顶滚过。兄妹们手拉着手坐下，谁也不肯松开。他们一起唱起赞美诗，从歌声里寻找希望和勇气。
        - id: ch02-b17
          speaker: narrator
          text: >-
            黎明时，风静了，四周也安宁下来。太阳一出来，天鹅们又带着艾丽莎飞离小小的礁石。海面仍旧翻腾。从高处看，墨绿波浪上的白沫像数百万只游动的天鹅。太阳继续升高，前方的空中浮出一列山峰，峰顶的冰雪闪闪发亮。群山之间有一座仿佛长达一英里的城堡，层层圆柱一排高过一排。城堡四周，棕榈树迎风摆动，盛开的花朵大得像磨坊的轮子。艾丽莎问哥哥们，那是不是他们赶往的国度。天鹅们却摇了摇头。她看到的，只是海市蜃楼那座美丽又不停变幻的云中宫殿，世上的凡人谁也不能进去。
        - id: ch02-b18
          speaker: narrator
          text: >-
            艾丽莎还在凝望，云中宫殿便融化了。山峰、森林和城堡全都消失，原处升起二十座雄伟的教堂。它们有高高的塔楼，还有尖尖的拱窗。艾丽莎仿佛听到管风琴在里面奏响，其实那是海水低低的吟唱。等他们飞近，教堂又化作一支船队，好像正从她脚下驶过。她再仔细一看，才发现那些船只不过是海雾在水面滑行。奇异的景象一幕接一幕从眼前经过。终于，真正的陆地出现了。那里有蓝色山峦、大片雪松森林，还有城市和宫殿。离日落还早，艾丽莎已经坐在大山洞前的岩石上。洞里的绿藤长得茂盛，叶片却很细柔，铺在地面上像一张绣花地毯。小哥哥走进山洞，把妹妹安睡的地方指给她看。
        - id: ch02-b19
          speaker: youngest_brother
          text: 今晚好好睡吧。明天告诉我们，你梦见了什么。
        - id: ch02-b20
          speaker: eliza
          text: 但愿上天让我梦到救你们的办法。
    - id: ch03
      title: 荨麻衣
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这个愿望牢牢占据着艾丽莎的心。她恳切地祈祷，连睡着以后也没有停下。梦里，她飞向海市蜃楼的云中宫殿。一位美丽发亮的仙女出来迎接她，模样竟很像森林里送她浆果的老妇人。
        - id: ch03-b02
          speaker: fairy
          text: >-
            只要你有勇气，也肯坚持，你就能救出哥哥。水比你的手柔软，却能磨平坚硬的石头。水不会疼，也没有灵魂，不懂得你将要受的折磨。看清我手里的刺荨麻。你睡的山洞旁也长着很多，可那些没有用。只有教堂墓地坟头上的荨麻，才能救他们。
        - id: ch03-b03
          speaker: fairy
          text: >-
            你要亲手把荨麻采下来，哪怕它们在手上烧出水泡。再用手和脚把它们捣碎，做成纤维，纺成线，织出十一件长袖衣。把衣服披到十一只天鹅身上，魔咒就破了。但你一定要记住，从动手开始，直到最后一件衣服织完，不管要花多少年，你都不能开口。你说出的第一个字，会像匕首一样刺进哥哥们的心。他们的命，就悬在你的舌尖上。
        - id: ch03-b04
          speaker: narrator
          text: >-
            仙女说完，用荨麻轻轻碰了碰她的手。火烧般的刺痛立刻把艾丽莎惊醒。天已经大亮，身边正放着一株和梦里一模一样的荨麻。她跪下来感谢上帝，随后走出山洞，用自己娇嫩的双手开始这件艰难的工作。她伸手探进丑陋刺人的荨麻丛。手和胳膊很快被烧出一个个大水泡，可只要能救出亲爱的哥哥们，她什么都愿意忍受。她赤着脚把荨麻用力踩烂，再从里面理出纤维，一点一点纺成线。
        - id: ch03-b05
          speaker: narrator
          text: >-
            日落后，哥哥们回来了。妹妹突然不能说话，把他们吓坏了。他们以为狠毒的继母又下了新的毒咒。可再看她被荨麻烧伤的双手，大家便懂得妹妹正在为谁受苦。小哥哥哭起来。他的眼泪落到哪里，哪里的刺痛就消失，灼出的水泡也随之不见。艾丽莎整夜没有停手。一天不把哥哥们救出来，她就一天不能安心休息。第二天，哥哥们全都飞了出去，她独自坐在山洞里纺线、织衣。明明只有她一个人，时间却从未过得这么快。第一件衣服已经完成，第二件也起了头。
        - id: ch03-b06
          speaker: narrator
          text: >-
            忽然，远处响起猎号。号声不断靠近，猎犬也叫起来。艾丽莎害怕极了，抱着扎好的荨麻跑进山洞，坐在上面。大狗一条接一条从山谷里蹿来，在她面前狂吠，又跑回去叫人。不一会儿，猎人们全到了。走在最前面的，是这个国家的国王。他一生从未见过这样美丽的姑娘。
        - id: ch03-b07
          speaker: king
          text: 姑娘，你怎么一个人到了这里？
        - id: ch03-b08
          speaker: narrator
          text: >-
            艾丽莎摇摇头。哥哥们的性命不容她回答。她又把双手藏进围裙，免得国王看见上面的伤。
        - id: ch03-b09
          speaker: king
          text: >-
            跟我走吧，你不能一直留在山洞。要是你的心和你的脸一样美，我会让你穿上丝绸和天鹅绒，亲手把金冠戴到你头上。你会住进我最富丽的城堡，在那里生活，也做那里的女主人。
        - id: ch03-b10
          speaker: narrator
          text: >-
            国王把她抱上马。她哭着扭动双手，想让他明白自己不能离开。
        - id: ch03-b11
          speaker: king
          text: 我不会伤害你。我只想让你幸福。以后你会明白，也会感谢我。
          emotion: calm
        - id: ch03-b12
          speaker: narrator
          text: >-
            国王让她坐在自己身前，抱着她飞驰过群山，猎人们一路跟在后面。夕阳落下时，一座美丽的王城出现在眼前，城里教堂林立，圆顶高耸。到了王宫，国王领她穿过一座座大理石厅堂。宽阔的喷泉向上喷水，墙上和天花板上到处是华丽绘画。艾丽莎却没有心思看任何美景，只顾哀伤流泪。宫女们耐心为她换上王后的礼服，把珍珠编进长发，又用柔软手套遮住长满水泡的手指。等她盛装站在众人面前，美得光彩夺目，宫廷上下全都向她深深俯身。
        - id: ch03-b13
          speaker: narrator
          text: >-
            国王当着宫廷众人的面，宣布自己要娶她为妻。大主教却悄悄摇头，凑到国王耳边说，这个美丽的姑娘一定是个女巫。是她蒙住了国王的双眼，又迷惑了国王的心。国王根本不听。他命人奏响音乐，摆上最精美的菜肴，再请最美丽的少女们起舞。随后，他又带艾丽莎走过芬芳的花园和一座座高大的厅堂。可不管眼前有多么热闹，她嘴角都没有笑意，眼里也不见一丝光亮。她整个人就像一幅悲伤的画。
        - id: ch03-b14
          speaker: narrator
          text: >-
            最后，国王打开一间小屋。绿色织锦把屋里装点得很像那座山洞。艾丽莎纺好的纤维放在地上，织好的衣服挂在屋顶下面。原来，一个猎人把这些当作奇物，全带回了王宫。
        - id: ch03-b15
          speaker: king
          text: >-
            这里像你从前住的山洞。你做过的活儿也都在。如今住进王宫，再想起过去那段日子，也许会觉得有趣。
        - id: ch03-b16
          speaker: narrator
          text: >-
            艾丽莎一看见这些东西，终于露出笑容，双颊也有了血色。她想到哥哥就要获救，欢喜得吻了国王的手。国王把她搂进怀里。很快，欢快的钟声宣告婚宴。那个从森林来的美丽哑女，就要成为王后了。
    - id: ch04
      title: 墓地里的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            大主教仍往国王耳边送去恶毒的话，可国王一句也没听进去。婚礼照常举行，还得由大主教亲手给新娘戴王冠。他怀着怨恨，把狭窄的冠环用力压在艾丽莎额头上，压得她生疼。可她的心被另一道更沉重的圆环勒着，那就是对哥哥们的忧虑。和心里的重压相比，额头上的疼痛算不了什么。她始终闭紧嘴唇，因为一句话就会要了哥哥们的命。
        - id: ch04-b02
          speaker: narrator
          text: >-
            艾丽莎也深深爱上了善良英俊的国王。他每天都在想办法让她更幸福。她不能用言语回应，眼睛却把爱全说了出来。她多想把秘密和苦楚都告诉他啊，可在衣服织完以前，她必须守住沉默。每到夜里，她便悄悄走进那间山洞模样的小屋，一件接一件地织下去。
        - id: ch04-b03
          speaker: narrator
          text: >-
            织到第七件时，纤维没有了。能用的荨麻只长在教堂墓地，而且必须由她亲自去采。她该怎样离开王宫？
        - id: ch04-b04
          speaker: eliza
          text: >-
            心里的煎熬，比手指的疼痛重得多。我必须冒这个险。上天不会丢下我。
        - id: ch04-b05
          speaker: narrator
          text: >-
            明亮的月光下，艾丽莎怀着发颤的心走进花园。她那样小心，好像自己真要去做一件坏事。她沿着狭窄小路前行，又穿过一条条空无一人的街道，终于来到教堂墓地。一块宽大的墓碑上坐着一群可怕的食尸鬼。它们脱掉身上破布似的衣裳，看起来像是准备去洗澡。可接下来，它们竟用瘦长的手指和尖爪扒开刚刚填好的新坟，从里面拖出尸体，吞吃尸体上的血肉。艾丽莎要采到荨麻，就只能从它们近旁经过。食尸鬼全都恶狠狠地盯着她。她不看它们，只在心里默默祈祷，采下那些灼人的荨麻，再一路把荨麻带回王宫。
        - id: ch04-b06
          speaker: narrator
          text: >-
            所有人都睡着了，只有大主教醒着，也只有他看见王后的行踪。他认定自己的猜疑得到了证实，便把所见所怕偷偷告诉国王。冷酷的话一出口，圣徒雕像纷纷摇头，仿佛在替艾丽莎申辩。
        - id: ch04-b07
          speaker: narrator
          text: >-
            大主教却作了完全相反的解释。他以为雕像是在指证艾丽莎，正为她的邪恶摇头。两颗大泪珠滚过国王的脸。他带着疑惑回到寝宫，夜里假装入睡，双眼却始终无法真正合拢。他果然看见艾丽莎每天夜里起身，悄悄消失在那间属于她的小屋里。一天又一天，国王的眉头越锁越紧。艾丽莎看见了，却不知道缘故，只觉得害怕。她本来就在为哥哥们担忧，心也跟着颤抖。滚烫的泪落在王后的天鹅绒和钻石上，亮得像珍珠。看见的人不懂她的痛苦，只羡慕她做了王后，也盼着自己能有同样的命运。
        - id: ch04-b08
          speaker: narrator
          text: >-
            这时，艾丽莎的任务已经快完成了，只差最后一件衣服，荨麻却又用完了，一株也没有剩下。她必须再去一次墓地，这也是最后一次。可一想到那条孤零零的夜路，还有墓碑上的食尸鬼，她仍会害怕。即便如此，她的意志没有动摇，对上天的信赖也没有动摇。艾丽莎再次出发，国王和大主教悄悄跟在后面。他们眼看着她走进墓地小门。走近以后，又看见那些食尸鬼正坐在墓碑上。国王不忍再看，只能把脸转开。他以为妻子果真和那些怪物是一伙的。可就在当天晚上，她的头还曾安静地靠在自己胸前。
        - id: ch04-b09
          speaker: king
          text: 让百姓来裁决她吧。
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: >-
            百姓很快便判她受火刑。艾丽莎离开华美的王宫大厅，被押进一间阴暗凄凉的牢房。冷风穿过铁栏，呜呜作响。人们拿走丝绸和天鹅绒，把她织好的荨麻衣扔来盖在身上，又把那捆刺荨麻给她当枕头。他们以为这是惩罚，却不知道，再没有什么能比这些东西更合她心意。艾丽莎欢喜地接着织，一面向上天求助。街上的孩子唱着歌讥笑她，没有一个人肯说句好话，没有一个人愿意安慰她。
        - id: ch04-b11
          speaker: narrator
          text: >-
            傍晚，窗栅外传来天鹅翅膀扇动的声音。最小的哥哥终于找到了她。艾丽莎高兴得哭了。她知道，这很可能是自己生命里的最后一夜。可是任务已经接近完成，哥哥们也赶来了，她仍旧可以抱着希望。随后，大主教依照对国王的承诺，来陪她度过最后时刻。艾丽莎赶紧摇头，又用眼神和动作一遍遍求他离开。她必须在这一夜织完最后的衣服。不然，双手受过的疼、流过的泪，还有那么多个不眠之夜，就全都白费了。大主教嘴里说着刻薄的话，终于退了出去。艾丽莎知道自己清白无罪，便低下头，继续一刻不停地赶工。
        - id: ch04-b12
          speaker: narrator
          text: >-
            小老鼠在地板上跑来跑去，把荨麻一根根拖到她脚边，尽自己所能帮忙。画眉停在窗外的铁栏上，用最甜美的歌声唱了整整一夜，为她鼓起勇气。
    - id: ch05
      title: 火刑车上的奇迹
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            天还没亮透，离日出至少有一个小时，十一个哥哥来到王宫门前，坚持要见国王。
        - id: ch05-b02
          speaker: guards
          text: >-
            现在还跟夜里一样，国王正在安睡。谁也不敢为了你们把他吵醒。
        - id: ch05-b03
          speaker: narrator
          text: >-
            哥哥们先是威胁，又苦苦恳求。卫兵赶来，最后连国王也出来查看出了什么事。偏偏就在这时，太阳升起。十一个兄弟从众人眼前消失了，只有十一只野天鹅飞过王宫上空。
        - id: ch05-b04
          speaker: narrator
          text: >-
            城门打开，人们潮水般涌出去，都要看女巫怎样被烧死。一匹老马拉着囚车，艾丽莎就坐在车上。她穿着粗麻袋做的衣裳，美丽的长发散落肩头，双颊惨白得没有一丝血色。她的嘴唇无声地动着，手指仍旧在不停处理绿色的荨麻纤维。就算已经走在赴死的路上，她也不肯放弃自己的任务。十件衣服整整齐齐放在脚边，她正拼命赶织第十一件。
        - id: ch05-b05
          speaker: crowd
          text: >-
            快看这个女巫！她还在偷偷念咒。手里不拿赞美诗，偏抱着那堆邪恶的巫术。把那些东西全撕碎！一片也别留下！
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: >-
            人群向囚车挤去，伸手就要抢走荨麻衣。就在这一刻，十一只野天鹅飞到艾丽莎上方，落在车上。大翅膀一起扇动，吓得人们慌忙退开。
        - id: ch05-b07
          speaker: crowd
          text: 这一定是上天给的征兆。她没有罪。
        - id: ch05-b08
          speaker: narrator
          text: >-
            许多人只敢这样小声议论，没有谁敢把话大声喊出来。刽子手走到车边，一把抓住艾丽莎的手，要把她拖下囚车。就在这一瞬间，艾丽莎赶紧拿起十一件衣服，一件不漏地抛向天鹅。转眼间，十一只白天鹅变回十一个英俊的王子。只有最小的哥哥不同。他的一边已经是人的手臂，另一边却仍旧长着一只天鹅翅膀。因为艾丽莎还没来得及把最后那件衣服的一只袖子织完。
        - id: ch05-b09
          speaker: eliza
          text: 现在我终于能说话了！我是无辜的！
        - id: ch05-b10
          speaker: narrator
          text: >-
            亲眼看见奇迹的人全都俯身下拜，像是站在一位圣徒面前。艾丽莎却倒进哥哥们怀里，失去了知觉。长久以来的担忧、苦痛和折磨，终于让她再也支撑不住。
    - id: ch06
      title: 玫瑰盛开的归途
      blocks:
        - id: ch06-b01
          speaker: eldest_brother
          text: 她说得没错。艾丽莎从来都是无辜的。
        - id: ch06-b02
          speaker: narrator
          text: >-
            大哥把兄妹们遭遇的事情，从头到尾讲给国王和百姓听。他说话时，一股芬芳升进空中，仿佛千万朵玫瑰同时开放。人们回头一看，火刑柴堆里的每一根木柴竟然都长出了根，又从焦硬的木头上抽出新枝。所有枝条交织在一起，化成一道又高又密的树篱，上面开满了玫瑰。万花之上，还有一朵洁白明亮的花。它独自在最高处闪着光，就像天上的星星。
        - id: ch06-b03
          speaker: narrator
          text: >-
            国王伸手摘下那朵闪亮的白花，轻轻放在艾丽莎胸前。花一落下，她便从昏迷中醒了过来。漫长的恐惧和痛苦都结束了，她心里只剩安宁和幸福。这时，所有教堂的钟不等任何人去敲，竟然自己一齐响了起来。鸟儿也来了，不是一只两只，而是一大群接着一大群。随后，婚礼的队伍簇拥着艾丽莎和她的亲人，浩浩荡荡地返回王宫。那样的队伍，从前没有任何一位国王见过。
