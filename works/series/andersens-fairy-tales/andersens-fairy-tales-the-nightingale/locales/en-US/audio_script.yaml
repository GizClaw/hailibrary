  chapters:
    - id: ch01
      title: The Wonder Beyond the Palace
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago in China, the emperor and everyone around him were Chinese. It is best to tell what happened before the story is forgotten. The emperor's palace was the loveliest in the world. It was made entirely of costly porcelain, so thin and fragile that anyone who touched it had to take great care.
        - id: ch01-b02
          speaker: narrator
          text: Strange flowers grew in the garden, with pretty silver bells tied to them. The bells chimed whenever anyone passed, making sure the flowers were noticed. Everything there was remarkable. The garden stretched so far that even the gardener did not know where it ended.
        - id: ch01-b03
          speaker: narrator
          text: Travelers who went beyond the garden found a noble forest of tall trees, sloping down to the deep blue sea. Their branches reached over the water, and great ships sailed beneath their shadow. A nightingale lived in one of those trees. Her song was so beautiful that even the poor fishermen stopped to listen, though they had many other things to do. At night, as they went out to spread their nets, her voice came through the woods.
        - id: ch01-b04
          speaker: fisherman
          text: Oh, isn't that beautiful?
        - id: ch01-b05
          speaker: narrator
          text: The fishermen would go back to work and forget the bird. Then the next night, her voice would reach them again.
        - id: ch01-b06
          speaker: fisherman
          text: Oh, what a beautiful song that nightingale has!
        - id: ch01-b07
          speaker: narrator
          text: Travelers came from every country to admire the emperor's city, palace, and gardens. But after they heard the nightingale, they all said she was the finest wonder of all. When they returned home, they told everyone what they had seen. Learned people filled books with descriptions of the city, the palace, and the gardens. Yet they never forgot the nightingale, because she was truly the greatest wonder. Those who wrote poetry made beautiful verses about the little singer who lived in a forest beside the deep sea.
        - id: ch01-b08
          speaker: narrator
          text: Those books traveled around the world. At last, some reached the emperor. He sat in his golden chair, reading and nodding with pleasure at every fine description of his city, his palace, and his gardens. Then he read that the nightingale was more beautiful than all the rest.
        - id: ch01-b09
          speaker: emperor
          text: What's this? I know nothing about a nightingale. Is there really such a bird in my empire, right here in my garden? I've never heard her. It seems books can teach us something after all.
        - id: ch01-b10
          speaker: narrator
          text: He summoned one of his lords-in-waiting. The nobleman was so very highborn that he barely answered anyone beneath his rank. If such a person spoke to him or dared ask a question, he gave them only one word. It meant nothing at all.
        - id: ch01-b11
          speaker: lord_in_waiting
          text: Pooh.
        - id: ch01-b12
          speaker: emperor
          text: This book describes a marvelous bird called a nightingale. People say she is the finest thing in my whole kingdom. Why has no one told me about her?
        - id: ch01-b13
          speaker: lord_in_waiting
          text: I have never even heard the name. She has certainly never appeared at court.
        - id: ch01-b14
          speaker: emperor
          text: Then she will appear here tonight. The whole world seems to know what belongs to me better than I do.
        - id: ch01-b15
          speaker: lord_in_waiting
          text: I have never heard of her, Your Majesty, but I will do my best to find her.
        - id: ch01-b16
          speaker: narrator
          text: But where could the nightingale be found? The nobleman hurried upstairs and down again, searching through halls and passages. He questioned everyone he met, but not one of them had heard of the bird. At last, he went back to the emperor. He said the writers must have invented the whole tale. His Imperial Majesty could not believe everything found in books, because some things were only fiction, or what people called black magic.
        - id: ch01-b17
          speaker: emperor
          text: This book came from the great and mighty emperor of Japan, so it cannot be false. I will hear the nightingale tonight. She has my highest favor. If she does not come, the entire court will be trampled after supper.
        - id: ch01-b18
          speaker: lord_in_waiting
          text: Tsing-pe!
        - id: ch01-b19
          speaker: narrator
          text: Off he rushed again, up and down every staircase and through every hall and corridor. Half the court ran after him. None of them liked the thought of being trampled once supper was over. A great search began for the wonderful nightingale. The entire world seemed to know her, yet no one at the emperor's court knew a thing.
    - id: ch02
      title: The Little Gray Singer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At last they found a poor young kitchen maid who knew the bird very well.
        - id: ch02-b02
          speaker: kitchen_maid
          text: Oh, yes, I know the nightingale. She truly can sing. Every evening, I may take scraps from the table to my poor sick mother who lives by the shore. On my way back, I get tired and rest in the woods. When I hear the nightingale, tears fill my eyes. It feels just as if my mother were kissing me.
        - id: ch02-b03
          speaker: lord_in_waiting
          text: Young lady, if you lead us to this bird, I will arrange steady work for you in the kitchen. You may even watch the emperor dine. The nightingale has been invited to the palace tonight.
        - id: ch02-b04
          speaker: narrator
          text: The girl led them into the woods, and half the court followed. As they walked, a cow began to low.
        - id: ch02-b05
          speaker: young_courtier
          text: There she is! What an enormous voice for such a tiny creature. I'm sure I've heard it before.
        - id: ch02-b06
          speaker: kitchen_maid
          text: No, that's only a cow. We still have a long way to go.
        - id: ch02-b07
          speaker: narrator
          text: Then frogs began croaking in a marsh.
        - id: ch02-b08
          speaker: young_courtier
          text: Beautiful! Now I hear her. She sounds like little church bells.
        - id: ch02-b09
          speaker: kitchen_maid
          text: No, those are frogs. But I think we'll hear the nightingale soon.
        - id: ch02-b10
          speaker: narrator
          text: Just then, the nightingale began to sing.
        - id: ch02-b11
          speaker: kitchen_maid
          text: Listen! There she is. Look, she's sitting on that branch.
        - id: ch02-b12
          speaker: narrator
          text: She pointed to a small gray bird perched above them.
        - id: ch02-b13
          speaker: lord_in_waiting
          text: Can that really be her? I never imagined such a plain little thing. She must have turned pale from seeing so many important people.
        - id: ch02-b14
          speaker: kitchen_maid
          text: Little nightingale! Our gracious emperor would like you to sing for him.
        - id: ch02-b15
          speaker: nightingale
          text: I would be very glad to.
        - id: ch02-b16
          speaker: narrator
          text: And the nightingale sang more delightfully than they had thought possible.
        - id: ch02-b17
          speaker: lord_in_waiting
          text: Her voice is like tiny glass bells. Just look at that little throat! How surprising that we've never heard her before. She will be a great success at court.
        - id: ch02-b18
          speaker: nightingale
          text: Would the emperor like me to sing again?
        - id: ch02-b19
          speaker: narrator
          text: The bird thought the emperor was already there.
        - id: ch02-b20
          speaker: lord_in_waiting
          text: My excellent little nightingale, I am honored to invite you to tonight's court festival. Your charming song will surely win the emperor's favor.
        - id: ch02-b21
          speaker: nightingale
          text: My song sounds best among the green trees.
        - id: ch02-b22
          speaker: narrator
          text: Still, when she heard that the emperor wanted her, she willingly came along.
    - id: ch03
      title: A Song at Court
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The palace was splendidly decorated for the evening. A thousand lamps made the porcelain walls and floors glitter. Beautiful flowers stood all along the corridors, each surrounded by its little bells. Servants ran back and forth, and every rush of air set the bells ringing. They chimed so loudly that no one could speak and hope to be heard.
        - id: ch03-b02
          speaker: narrator
          text: A golden perch waited in the center of the great hall. The whole court had come in its finest clothes. The kitchen maid was allowed to stand by the door, though she had not been made a proper court cook. Every eye watched the little gray bird. At last, the emperor nodded.
        - id: ch03-b03
          speaker: narrator
          text: The nightingale sang. Her voice was so sweet that tears gathered in the emperor's eyes and rolled down his cheeks. The song grew more touching until it reached every heart in the hall.
        - id: ch03-b04
          speaker: narrator
          text: Delighted, the emperor offered the nightingale his golden slipper to wear around her neck. She thanked him but said she had already received enough.
        - id: ch03-b05
          speaker: nightingale
          text: I have seen tears in an emperor's eyes. That is the richest reward I could have. An emperor's tears carry wonderful power, and that honor is enough for me.
        - id: ch03-b06
          speaker: narrator
          text: Then she sang again, more beautifully than before.
        - id: ch03-b07
          speakers: [court_lady_1, court_lady_2]
          ensemble: duo
          text: What a lovely gift that song is!
        - id: ch03-b08
          speaker: narrator
          text: The court ladies filled their mouths with water. Whenever anyone spoke to them, they answered with gurgling sounds like the nightingale's. That let them imagine they were nightingales too. The footmen and chambermaids also announced that they were satisfied. That was high praise indeed, because those servants were very difficult to please. By every measure, the nightingale's visit was a complete success.
        - id: ch03-b09
          speaker: narrator
          text: The nightingale now had to live at court in her own cage. She was allowed outside twice each day and once at night. Twelve servants went with her, each holding a silk string tied to her leg. Flying that way gave her very little pleasure.
        - id: ch03-b10
          speaker: narrator
          text: Soon the whole city talked about the marvelous bird. When two people met, one needed only to say, “nightin.” The other replied, “gale.” They understood each other perfectly, because no one spoke of anything else. Eleven peddlers even named their children after the nightingale. Unfortunately, not one of those children could sing a single note.
    - id: ch04
      title: The Jeweled Bird
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, a large package arrived for the emperor. The words “The Nightingale” were written on it.
        - id: ch04-b02
          speaker: emperor
          text: This must be a new book about our famous bird.
        - id: ch04-b03
          speaker: narrator
          text: But the package held no book. Inside was a casket containing a remarkable work of art. It was an artificial nightingale, carefully made to resemble the living one and covered from beak to tail with diamonds, rubies, and sapphires. As soon as someone wound it up, it could sing like the real bird. Its tail moved up and down, flashing with silver and gold. Around its neck hung a ribbon. The words on it claimed that the emperor of China's nightingale was poor compared with the emperor of Japan's.
        - id: ch04-b04
          speakers: [court_lady_1, court_lady_2, courtier]
          ensemble: chorus
          text: How beautiful it is!
        - id: ch04-b05
          speaker: narrator
          text: The person who delivered it was given the title of Imperial Nightingale-Bringer-in-Chief.
        - id: ch04-b06
          speaker: courtier
          text: Now let the two birds sing together. What a duet that will be!
        - id: ch04-b07
          speaker: narrator
          text: The duet did not go well. The living nightingale sang in her own free way, while the artificial bird knew only waltzes.
        - id: ch04-b08
          speaker: music_master
          text: There is nothing wrong with that. Its music is exactly as it should be.
        - id: ch04-b09
          speaker: narrator
          text: So the artificial bird sang alone. It pleased the court as much as the real one, and it was much prettier to watch, sparkling like fine jewelry. It repeated the same tune thirty-three times without tiring. The people wanted more, but the emperor said it was time for the living nightingale to sing.
        - id: ch04-b10
          speaker: narrator
          text: She was gone. While no one was watching, she had flown through the open window and returned to her green woods.
        - id: ch04-b11
          speaker: emperor
          text: What strange behavior!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: The courtiers blamed her and called her terribly ungrateful.
        - id: ch04-b13
          speaker: courtier
          text: We still have the better bird.
        - id: ch04-b14
          speaker: narrator
          text: So they made the jeweled bird sing once more, though this was the thirty-fourth time they had heard the very same piece. Even after so many performances, no one had learned the tune because it was rather difficult. The music master praised the artificial bird above all measure. He insisted it was better than a real nightingale, not only because of its glittering dress and beautiful diamonds, but because its music was better too.
        - id: ch04-b15
          speaker: music_master
          text: Your Majesty, a living nightingale may sing anything at all. With this bird, every note is settled. We can open it, study it, and explain exactly how each waltz is built and why every note follows the one before.
        - id: ch04-b16
          speakers: [court_lady_1, court_lady_2, courtier]
          ensemble: chorus
          text: That is exactly what we think!
        - id: ch04-b17
          speaker: narrator
          text: The music master received permission to show the bird to the people the following Sunday, and the emperor commanded them to attend. When they heard it, the listeners acted almost drunk. Still, it must have been the tea, since drinking tea was a Chinese custom. They cried out in amazement, held up their forefingers, and nodded wisely. Only one poor fisherman was not convinced. He had heard the living nightingale many times beside the sea.
        - id: ch04-b18
          speaker: fisherman
          text: It sounds pretty enough, and the tunes seem much the same. Still, something is missing. I can't quite say what.
        - id: ch04-b19
          speaker: narrator
          text: After that, the living nightingale was banished from the empire. The artificial bird rested on a silk cushion beside the emperor's bed, surrounded by the gold and jewels that had come with it. It was promoted to Little Imperial Toilet Singer, First Rank on the Left. The emperor considered the left the nobler side because the heart is there, and an emperor's heart lies in the same place as anyone else's.
        - id: ch04-b20
          speaker: narrator
          text: The music master wrote twenty-five long, learned volumes about the mechanical bird, filled with the hardest Chinese words. Everyone claimed to have read and understood them. No one wanted to seem foolish and risk being trampled.
        - id: ch04-b21
          speaker: narrator
          text: A year passed. By then, the emperor, the court, and everyone else knew every turn of the artificial song. That made them like it even more, because they could sing along. Boys in the street sang, “Zi-zi-zi, cluck, cluck, cluck.” The emperor sang it too, and everyone found it very amusing.
        - id: ch04-b22
          speaker: narrator
          text: One evening, the jeweled bird was giving its finest performance while the emperor listened in bed. Suddenly, something inside it went whizz. A spring cracked. The wheels spun with a whir, and the music stopped.
        - id: ch04-b23
          speaker: narrator
          text: The emperor leaped out of bed and called his physician. But what could a physician do for a clockwork bird? Next they sent for a watchmaker. There was a great deal of talking, followed by a long examination. At last, the watchmaker got the bird into something like working order. He warned them that its inner barrels were worn out. New ones could not be fitted without damaging the music, so from now on the bird must be treated with the greatest care.
        - id: ch04-b24
          speaker: narrator
          text: Everyone was sorrowful. From then on, the bird could sing only once a year, and even that was risky. The music master gave a speech full of difficult words and declared it as good as ever. Of course, no one disagreed.
    - id: ch05
      title: Death at the Bedside
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Five years went by. Then true sorrow fell across the land. The people really did love their emperor, and now he was so ill that no one expected him to live. A new emperor had already been chosen. In the street, people asked the lord-in-waiting how the old emperor was doing.
        - id: ch05-b02
          speaker: lord_in_waiting
          text: Pooh.
        - id: ch05-b03
          speaker: narrator
          text: He only shook his head. The emperor lay cold and pale in his royal bed. The whole court decided he must already be dead. Everyone hurried away to offer honor to the emperor who would replace him. The chamberlains left the room so they could discuss the matter among themselves. The ladies' maids began inviting friends to coffee. Soft cloth was laid throughout the halls and passages so not a single footstep would be heard. The palace became silent and still.
        - id: ch05-b04
          speaker: narrator
          text: But the emperor was still alive. He lay white and stiff beneath long velvet curtains with heavy golden tassels. The window stood open, and moonlight fell across him and the artificial bird.
        - id: ch05-b05
          speaker: narrator
          text: He could barely breathe. A strange weight pressed on his chest. When he opened his eyes, he saw Death sitting there. Death wore the emperor's golden crown and carried his sword of state in one hand and his beautiful banner in the other.
        - id: ch05-b06
          speaker: narrator
          text: Strange faces peered through the long curtains all around the bed. Some were ugly enough to frighten him. Others looked lovely and gentle. They were every bad and good deed the emperor had done, and now they stared straight into his face while Death sat upon his heart.
        - id: ch05-b07
          speaker: bad_deed
          text: Do you remember this?
        - id: ch05-b08
          speaker: good_deed
          text: And do you remember that?
        - id: ch05-b09
          speaker: narrator
          text: One after another, they brought old moments back to him until sweat stood on his forehead.
        - id: ch05-b10
          speaker: emperor
          text: I know nothing about any of it! Music! Bring the great Chinese drum, so I won't have to hear them!
          emotion: fearful
        - id: ch05-b11
          speaker: narrator
          text: Still the faces went on speaking, and Death nodded at every word.
        - id: ch05-b12
          speaker: emperor
          text: Music! Music! Precious little golden bird, please sing! I gave you gold and costly treasures. I even hung my golden slipper around your neck. Sing to me! Sing!
          emotion: fearful
        - id: ch05-b13
          speaker: narrator
          text: The artificial bird stayed silent. No one was there to wind it, so it could not make a sound. Death kept staring with cold, empty eyes. The room was terribly still.
        - id: ch05-b14
          speaker: narrator
          text: Then sweet music came through the open window. The living nightingale sat outside on a tree branch. She had heard that the emperor was ill, and she had come to sing of hope and trust.
        - id: ch05-b15
          speaker: narrator
          text: As she sang, the strange faces faded. The emperor's blood moved faster, bringing strength back into his weak arms and legs. Even Death listened.
        - id: ch05-b16
          speaker: death
          text: Go on, little nightingale. Go on.
        - id: ch05-b17
          speaker: nightingale
          text: Then will you give me that beautiful golden sword? And the rich banner? Will you give me the emperor's crown as well?
        - id: ch05-b18
          speaker: narrator
          text: Death gave up each treasure in return for a song. First the sword, then the banner, and then the golden crown passed from his hands. Still the nightingale sang. Her song carried them to the quiet churchyard where white roses grew. The elder tree sent its perfume into the breeze, and the fresh, sweet grass was damp with the tears of those who mourned.
        - id: ch05-b19
          speaker: narrator
          text: Death began to long for his own garden. He drifted out through the window as a cold white mist.
    - id: ch06
      title: The Bird's One Request
      blocks:
        - id: ch06-b01
          speaker: emperor
          text: Thank you, heavenly little bird. I know you. Once, I drove you out of my kingdom. Yet your song chased those evil faces from my bed and drove Death from my heart. How can I reward you?
        - id: ch06-b02
          speaker: nightingale
          text: You rewarded me long ago. I will never forget the tears I brought to your eyes the first time I sang for you. Those are the jewels that make a singer's heart rejoice. Now sleep, and become strong and well. I will sing again.
        - id: ch06-b03
          speaker: narrator
          text: The nightingale began her song once more, and the emperor slipped into a sweet sleep. How gentle and refreshing that rest was. When he opened his eyes again, strength had returned to his body and he was well once more. The sun was shining brightly through the open window.
        - id: ch06-b04
          speaker: narrator
          text: Not one servant had come back. They all still believed he was dead. Only the nightingale remained beside him, singing.
        - id: ch06-b05
          speaker: emperor
          text: You must stay with me forever. Sing only when you wish, and I will smash the artificial bird into a thousand pieces.
        - id: ch06-b06
          speaker: nightingale
          text: No, don't do that. The artificial bird did what it could while it was able. Keep it here. I cannot live in the palace or build my nest here, but let me visit whenever I choose. In the evening, I will sit on a branch outside your window and sing. My songs will make you happy and fill your thoughts with joy.
        - id: ch06-b07
          speaker: nightingale
          text: I will sing about those who are happy and those who suffer. I will sing of the good and the evil hidden around you. This little bird flies far beyond you and your court, to the fisherman's home and the peasant's cottage. I love your heart more than your crown, though something holy surrounds a crown too. I will return and sing for you, but you must promise me one thing.
        - id: ch06-b08
          speaker: emperor
          text: Anything.
        - id: ch06-b09
          speaker: narrator
          text: The emperor had dressed in his royal robes. He stood with the heavy golden sword pressed to his heart.
        - id: ch06-b10
          speaker: nightingale
          text: I ask only this. Tell no one that a little bird comes to tell you everything. It will be better if the secret stays hidden.
        - id: ch06-b11
          speaker: narrator
          text: With that, the nightingale flew away.
        - id: ch06-b12
          speaker: narrator
          text: At last, the servants came in to look after the dead emperor. Instead, there he stood before them.
        - id: ch06-b13
          speaker: emperor
          text: Good morning.
