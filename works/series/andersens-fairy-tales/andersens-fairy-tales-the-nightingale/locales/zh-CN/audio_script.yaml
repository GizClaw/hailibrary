        timbre: 年轻清亮
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 宫苑深处的歌声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            这件事发生在许多年以前的中国，再不讲，也许就要被人忘掉了。那时的皇帝是中国人，围在他身边的也全是中国人。他住在全世界最美的宫殿里。宫殿从里到外都是名贵的瓷器，漂亮得叫人屏息，也脆得叫人不敢随便伸手，碰一下都得万分小心。御花园更稀奇。那里长着世间少见的花，每一朵都系着精巧的银铃。有人经过，铃声便响起来，仿佛非要请人看看那些花不可。其实园中样样东西都不寻常。园子大得连园丁也说不出尽头在哪里。
        - id: ch01-b02
          speaker: narrator
          text: >-
            走出花园的旅人知道，再往远处去，就是一片壮丽的森林。高大的树木顺着坡地一直伸到深蓝色的海边，大船从枝叶投下的阴影里驶过。林中的一棵树上，住着一只夜莺。她一开口，连有许多活要忙的穷渔夫也会停下手来。每逢夜里出海撒网，他们听见那歌声，总忍不住赞叹。
        - id: ch01-b03
          speaker: fisherman
          text: >-
            听啊，这歌声可真美。
        - id: ch01-b04
          speaker: narrator
          text: >-
            可渔夫们重新忙起捕鱼，转眼又把她忘在了脑后。直到第二天夜里，他们再次出海撒网，歌声又从树林飘来，他们才重新想起，这世上还有一只唱得那么美的夜莺，于是又一次停下来听。
        - id: ch01-b05
          speaker: narrator
          text: >-
            世界各国的旅人都来到这座都城，看过宫殿和花园，个个赞不绝口。等他们听见夜莺，却一致认定，她才是这里最了不起的奇观。旅人回乡讲起自己的见闻。学者把都城、宫殿、花园和夜莺都写进书里，因为他们也知道，夜莺是最大的奇迹。诗人还为这只住在深海之滨树林里的鸟写下诗篇。那些书传遍了世界，后来有几本也到了皇帝手上。皇帝坐在金椅里，一边读，一边满意地点头。书里把他的都城、宫殿和花园夸得越美，他就越高兴。可是读到“夜莺才是一切奇观中最美的”，他一下愣住了。
        - id: ch01-b06
          speaker: emperor
          text: >-
            夜莺是什么？我的国土上有这种鸟，还是就在我的花园里？我怎么一次也没听说过？想不到书里还真有我不知道的事！
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: >-
            皇帝马上召来一位侍从大臣。这位大臣自认高贵得很。地位不如他的人，只要向他开口，不管说什么，他都只回一个毫无意思的字。
        - id: ch01-b08
          speaker: lord_in_waiting
          text: >-
            不论别人问我什么，我都只答一声“呸”，再没有别的话。
        - id: ch01-b09
          speaker: emperor
          text: >-
            书上说，有一只叫夜莺的神奇鸟儿，是我整个国家最好的东西。为什么没人向我禀报？
        - id: ch01-b10
          speaker: lord_in_waiting
          text: >-
            臣连这个名字都没听说过。宫里也从来没有引见过她。
        - id: ch01-b11
          speaker: emperor
          text: >-
            朕今晚就要见到她。全世界都比朕更明白朕拥有什么，这怎么行？
        - id: ch01-b12
          speaker: lord_in_waiting
          text: >-
            臣虽然不认识她，却一定尽力把她找来。
        - id: ch01-b13
          speaker: narrator
          text: >-
            侍从大臣从楼上跑到楼下，穿过大厅，又绕过长廊，逢人便问。可宫里谁也不知道夜莺在哪里。他只好回去，说这只鸟准是写书的人编出来的。他还一本正经地提醒皇帝，书里的话不能样样相信，有些只是虚构，有些甚至属于人们所说的黑魔法。
        - id: ch01-b14
          speaker: emperor
          text: >-
            这本书是伟大的日本天皇送给朕的，绝不会撒谎。朕今晚一定要听见夜莺唱歌。她若来了，便有朕最高的恩宠。她若不来，晚膳过后，满朝的人都要挨一顿踩踏！
        - id: ch01-b15
          speaker: lord_in_waiting
          text: >-
            青——呸！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: >-
            这一次，侍从大臣跑得更快，半个朝廷都跟着他跑。谁也不想在晚饭后被人踩扁。他们到处寻找那只全世界都知道、偏偏宫廷不知道的鸟，最后在厨房遇见了一个穷苦的小姑娘。
        - id: ch01-b17
          speaker: kitchen_girl
          text: >-
            夜莺吗？我当然认识，她唱得可好了。每天晚上，我可以把桌上剩下的饭菜带给生病的母亲。母亲住在海边。我送完饭往回走，累了，就在树林里坐一会儿。夜莺一唱，我听着听着便会流泪，就像母亲正在亲我一样。
        - id: ch01-b18
          speaker: lord_in_waiting
          text: >-
            只要你领我们找到夜莺，我就替你在厨房安排一份长久的差事，还准你看皇帝用膳。今晚，夜莺已经受邀进宫了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            小姑娘领着他们走进森林，半个朝廷浩浩荡荡地跟在后面。半路上，一头母牛叫了起来。
        - id: ch01-b20
          speaker: young_courtier
          text: >-
            找到了！这么小的鸟，声音竟然有这么大的力量。我肯定早就听过她！
          emotion: surprised
        - id: ch01-b21
          speaker: kitchen_girl
          text: >-
            那是母牛在叫。夜莺还远着呢。
        - id: ch01-b22
          speaker: narrator
          text: >-
            接着，沼泽里的青蛙又呱呱地叫起来。
        - id: ch01-b23
          speaker: young_courtier
          text: >-
            这次一定没错！真好听，简直像小教堂的钟在响。
        - id: ch01-b24
          speaker: kitchen_girl
          text: >-
            这是青蛙。不过别急，我想很快就能听到夜莺了。
        - id: ch01-b25
          speaker: narrator
          text: >-
            话音刚落，一阵歌声便从树上传来。
        - id: ch01-b26
          speaker: kitchen_girl
          text: >-
            快听，就是她！瞧，她在那根树枝上呢。
        - id: ch01-b27
          speaker: lord_in_waiting
          text: >-
            真的是她？我还以为会是只华丽的鸟，没想到这么灰，这么不起眼。大概是看见我们这些显贵，吓得褪了颜色吧。
          emotion: surprised
        - id: ch01-b28
          speaker: kitchen_girl
          text: >-
            小夜莺，我们最仁慈的皇帝请你去为他唱一支歌！
        - id: ch01-b29
          speaker: nightingale
          text: >-
            我很愿意。
        - id: ch01-b30
          speaker: narrator
          text: >-
            夜莺当场唱了起来。那歌声一落进耳朵，侍从大臣立刻换了一副赞叹的口气。
        - id: ch01-b31
          speaker: lord_in_waiting
          text: >-
            像小玻璃铃在响！再看她的喉咙，动得多灵巧。宫里从没听过这样的声音，今晚她一定会轰动全场。
        - id: ch01-b32
          speaker: nightingale
          text: >-
            皇帝还想听我再唱一遍吗？
        - id: ch01-b33
          speaker: narrator
          text: >-
            她以为皇帝也在这群人当中。
        - id: ch01-b34
          speaker: lord_in_waiting
          text: >-
            出色的小夜莺，我荣幸地邀请你参加今晚的宫廷庆典。你的歌声一定会让皇帝十分欢喜。
        - id: ch01-b35
          speaker: nightingale
          text: >-
            我的歌在绿树林里听起来最美。不过，既然皇帝希望我去，我就跟你们走。

    - id: ch02
      title: 金栖木上的夜莺
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            为了迎接夜莺，宫里装点得无比华丽，还点起了上千盏灯。瓷墙和瓷地映着灯火，亮得耀眼。长廊摆满鲜花，每一簇花旁都系着银铃。人们不停地来回奔跑，穿堂风也一阵阵掠过，铃声响成一片，谁说话都快听不清了。大殿中央竖着一根金栖木，正是夜莺的位置。满朝文武穿着最隆重的礼服，所有眼睛都盯着那只小灰鸟。厨房小姑娘也获准站在门边，不过，她还没有成为真正的宫廷厨娘。
        - id: ch02-b02
          speaker: narrator
          text: >-
            皇帝先向夜莺点了点头，示意她开始，夜莺这才开口歌唱。歌声越唱越深，直抵每个人的心。皇帝眼里先是有了泪光，接着泪珠便顺着脸颊滚落。他听得那么欢喜，当场要赏夜莺一只金拖鞋，叫她挂在颈上。夜莺道了谢，却没有收下。
        - id: ch02-b03
          speaker: nightingale
          text: >-
            我已经得到了最好的奖赏。我亲眼看见皇帝流泪。皇帝的眼泪有奇妙的力量，对我来说，这份荣誉已经足够了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            说完，她又唱了一次。这一回，歌声比方才还动人。
        - id: ch02-b05
          speakers: [court_lady_1, court_lady_2]
          ensemble: duo
          text: >-
            能这样歌唱，真是上天赐下的本领！
        - id: ch02-b06
          speaker: narrator
          text: >-
            宫里的贵妇们羡慕极了。以后同人说话，她们总先含一口水，学夜莺发出咕噜咕噜的声音，仿佛自己也成了夜莺。连男仆和侍女都郑重表示满意。这可很说明问题，因为他们一向最难讨好。夜莺的这次宫廷亮相，就这样成了一场彻底的成功。
        - id: ch02-b07
          speaker: narrator
          text: >-
            从此，她被留在宫里，住进一只笼子。每天白天可以出去两次，夜里再出去一次。只是每次出门，都有十二个仆人跟着。每人牵着一根丝线，丝线全系在她腿上。被这样牵着飞，哪里还谈得上快乐呢？
        - id: ch02-b08
          speaker: narrator
          text: >-
            全城都只谈夜莺。两个人在街上相遇，一个说出“夜”，另一个立刻接上“莺”，事情便算讲明白了。还有十一个小贩的孩子取了她的名字，可惜没有一个唱得出一个音。

    - id: ch03
      title: 镶满宝石的假鸟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            有一天，一个大包裹送到皇帝面前，上面只写着两个字，“夜莺”。皇帝以为，又有人写了一本赞美名鸟的新书。打开匣子才发现，里面是一只人造的夜莺。它做得和活鸟相像，浑身铺满钻石、红宝石和蓝宝石。上紧发条，它便会唱，尾巴也会上下摆动，金光银光跟着一闪一闪。颈上的缎带还写着一句话，说中国皇帝的夜莺，比不上日本天皇的夜莺。
        - id: ch03-b02
          speakers: [court_lady_1, court_lady_2, courtier_1, courtier_2]
          ensemble: chorus
          text: >-
            太漂亮了！
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: >-
            送鸟来的人当场得到一个长长的封号，成了“御封首席夜莺进献使”。朝臣们兴冲冲地提出，要真鸟和假鸟一同表演。
        - id: ch03-b04
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: >-
            让她们合唱吧！两只夜莺一起唱，一定妙极了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            可这场二重唱一点也不和谐。活夜莺随心而唱，假夜莺翻来覆去只会唱华尔兹，两边怎么也合不到一起。
        - id: ch03-b06
          speaker: music_master
          text: >-
            这可不是假鸟的过错。它的每个音都准确无误，完全合乎我的口味。
        - id: ch03-b07
          speaker: narrator
          text: >-
            于是，大家让假鸟独唱。它和真夜莺一样受欢迎，而且更适合拿来观赏，亮晶晶的，像手镯和胸针。它把同一支曲子唱了三十三遍，既不累，也不改变。众人还想听第三十四遍，皇帝却想起，该轮到活夜莺唱点新鲜的了。
        - id: ch03-b08
          speaker: narrator
          text: >-
            然而，窗边早已空了。大家忙着欣赏珠宝时，夜莺悄悄飞出敞开的窗户，回到了自己的绿树林。
        - id: ch03-b09
          speaker: emperor
          text: >-
            她竟这样离开，实在太不像话了！
        - id: ch03-b10
          speaker: narrator
          text: >-
            廷臣们马上跟着责备夜莺，说她忘恩负义。不过，他们很快又安慰自己，至少最好看的那一只还在宫里。假鸟便唱了第三十四遍。曲子很难，大家听了这么多次，仍旧不会唱。音乐大师却盛赞它，断言它从宝石装束到歌唱本领，都比真鸟高明。
        - id: ch03-b11
          speaker: music_master
          text: >-
            陛下，活夜莺下一刻唱什么，谁也猜不到。这只鸟就不同了。它的每个音早已安排妥当。只要拆开来看，我还能说明华尔兹为什么这样组成，为什么一个音之后必须接着另一个音。
        - id: ch03-b12
          speakers: [court_lady_1, court_lady_2, courtier_1, courtier_2]
          ensemble: chorus
          text: >-
            正是如此，我们也是这么想的！
        - id: ch03-b13
          speaker: narrator
          text: >-
            下一个星期日，音乐大师获准向百姓展示假鸟。皇帝下令，人人都要去听。人们听得摇摇晃晃，仿佛醉了。当然，他们多半只是喝了茶，因为喝茶被说成十足的中国习惯。大家一面叫“啊”，一面竖起食指点头。只有一名穷渔夫听过真正的夜莺，心里并不完全信服。
        - id: ch03-b14
          speaker: fisherman
          text: >-
            它唱得是挺悦耳，曲调也像真的。可里面缺了一样东西。我说不出那是什么，却听得出它不在。
        - id: ch03-b15
          speaker: narrator
          text: >-
            这话没能改变什么。活夜莺被逐出国境，假鸟则坐上皇帝床边的丝垫，日日陪在近旁。随它而来的黄金和宝石全摆在四周。它还晋升为“御前第一小梳妆歌手”，位列左班第一。皇帝说，心在左边，左边自然最高贵。说来也巧，皇帝的心和普通人的心，原来生在同一个地方。
        - id: ch03-b16
          speaker: narrator
          text: >-
            音乐大师又写了二十五大卷书，专门研究这只假鸟。书写得又长又难，塞满艰涩的字眼。人人都声称自己读过，也完全读懂了。谁敢说没懂呢？那样会显得愚蠢，还可能挨一顿踩踏。

    - id: ch04
      title: 假鸟不再歌唱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一年过去，皇帝、朝臣和全国百姓都把假鸟的曲子听熟了。每个转音从哪里来，又落到哪里去，谁都知道。正因如此，他们越听越喜欢，还常跟着一起唱。街上的孩子唱着“吱吱吱，咯咯咯，咯咯咯”，连皇帝也唱得一模一样。大家觉得有趣极了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            可一天晚上，假鸟正在皇帝床边使劲唱，肚子里忽然“嘶”地一响。一根发条啪地断裂，所有齿轮呼噜噜地空转起来，音乐就此停住。皇帝跳下床，立刻叫来御医。御医当然治不了一只机器鸟，他们只好改请钟表匠。
        - id: ch04-b03
          speaker: narrator
          text: >-
            钟表匠查看了很久，也说了许多话，总算让假鸟勉强恢复原样。他警告众人，里面的发条鼓已经磨坏，不能换新的，否则原有的曲调也会毁掉。从此，假鸟一年最多只能唱一回，即便只唱一回，仍旧有损坏的危险。宫里人人悲伤。音乐大师却讲了一番满是难词的道理，保证它还和过去一样好。自然没人反驳。
        - id: ch04-b04
          speaker: narrator
          text: >-
            又过了五年，真正的悲痛落在这个国家。百姓确实爱戴皇帝，而皇帝病得极重，人人都说他活不下去了。新皇帝已经选定。街上的人向侍从大臣打听老皇帝怎么样，他只回一声“呸”，摇了摇头。
        - id: ch04-b05
          speaker: narrator
          text: >-
            皇帝冰冷苍白地躺在御床上。朝臣认定他已经死了，全跑去向继任者献殷勤。侍臣出门商议这件事，贵妇的侍女也请朋友来喝咖啡。宫里的大厅和长廊全铺上了布，免得任何脚步声传出来。偌大的宫殿里，再也听不见一点动静。
        - id: ch04-b06
          speaker: narrator
          text: >-
            其实皇帝还活着。他直挺挺地躺在华丽的床上，脸上一点血色也没有。长长的天鹅绒帷幔垂在四周，金穗子沉甸甸地挂着。窗户开着，月光照进来，落在皇帝身上，也落在那只假鸟身上。皇帝几乎无法呼吸，总觉得胸口压着什么。他费力睁开眼，终于看清，坐在那里的是死神。

    - id: ch05
      title: 死神坐在皇帝心口
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            死神戴着皇帝的金冠，一只手拿着御剑，另一只手举着华美的旗帜。床边还有许多陌生面孔，从天鹅绒帷幔后探出头来。有的丑陋，有的美丽温和。它们正是皇帝做过的坏事和好事。死神坐在皇帝心口上，它们便一齐盯住皇帝。
        - id: ch05-b02
          speaker: deed_1
          text: >-
            这一件事，你还记得吗？
        - id: ch05-b03
          speaker: deed_2
          text: >-
            那一件呢，你真想不起来了吗？
        - id: ch05-b04
          speaker: narrator
          text: >-
            往事一件接一件回到皇帝脑中，逼得他额头直冒冷汗。
        - id: ch05-b05
          speaker: emperor
          text: >-
            我什么都不知道！奏乐，快奏乐！敲响中国的大鼓，让我听不见它们说什么！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: >-
            那些面孔没有停下，仍旧把旧事一桩桩讲出来。它们每说一句，死神便像一个中国人那样点一下头。
        - id: ch05-b07
          speaker: emperor
          text: >-
            音乐！我珍贵的小金鸟，求你唱起来！我给过你黄金，送过你贵重的礼物，还把自己的金拖鞋挂在你颈上。快唱，快唱啊！
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: >-
            可假鸟一声不出。这里没有人替它上紧发条，它连一个音也唱不了。死神仍用冰冷空洞的眼睛望着皇帝，房间静得可怕。
        - id: ch05-b09
          speaker: narrator
          text: >-
            就在这时，甜美的歌声从窗口飘了进来。真正的夜莺正坐在窗外的树枝上。她听说皇帝病重，特地赶来，为他歌唱希望与信赖。歌声响起后，那些阴影一点点淡去。皇帝的血又在血管中快快流动，原本无力的手脚渐渐恢复生气。连死神也静下心来听。
        - id: ch05-b10
          speaker: death
          text: >-
            继续唱吧，小夜莺。不要停。
        - id: ch05-b11
          speaker: nightingale
          text: >-
            那么，请把美丽的金剑交给我。还有那面华美的旗帜，也请给我。最后，你愿意把皇帝的金冠也给我吗？
        - id: ch05-b12
          speaker: narrator
          text: >-
            死神答应了。夜莺一首接一首地唱着，死神每听完一支歌，便交出一件宝物。金剑、旗帜和金冠，就这样一件件离开了他的手。
        - id: ch05-b13
          speaker: narrator
          text: >-
            夜莺接着歌唱宁静的墓园。那里开着白玫瑰，接骨木的香气乘着微风飘荡，鲜嫩的青草上沾着送葬人的泪水。死神听得心生向往，想亲眼看看自己的花园。于是，他化作一阵冰冷的白雾，从窗户飘走了。

    - id: ch06
      title: 窗外的自由歌声
      blocks:
        - id: ch06-b01
          speaker: emperor
          text: >-
            谢谢你，像从天国飞来的小鸟！我认得你。我曾经把你赶出国境，你却用歌声赶走床边那些可怕的面孔，也把死神赶出了我的心。告诉我，我该怎样报答你？
        - id: ch06-b02
          speaker: nightingale
          text: >-
            你早就报答过我。第一次为你唱歌时，我看见你的眼泪落下来，那一幕我永远不会忘。对一个歌者来说，再没有比眼泪更珍贵的珠宝了。现在安心睡吧，等身体恢复，我还会唱给你听。
          emotion: calm
        - id: ch06-b03
          speaker: narrator
          text: >-
            夜莺继续唱，皇帝渐渐睡着了。那一觉既安稳又甘甜，仿佛把新鲜的力量一点点送回他的身体。等皇帝醒来，他已经恢复了精神，明亮的阳光正从窗口照进屋里。可是，没有一个仆人回来。他们都认定皇帝死了。床边只有夜莺还守在那里，仍在为他歌唱。
        - id: ch06-b04
          speaker: emperor
          text: >-
            你以后就一直留在我身边吧。你高兴的时候再唱，我绝不勉强。至于那只假鸟，我马上把它砸成一千块！
        - id: ch06-b05
          speaker: nightingale
          text: >-
            别砸碎它。只要还能唱，它也曾经把自己的本领都唱出来了。让它继续留在这里吧。我不能住进宫殿，也不能在这里筑巢。不过，我想来的时候，请允许我飞来。到了傍晚，我会停在窗外的树枝上唱给你听，让你感到快活，也让你的心里生出欢喜。
        - id: ch06-b06
          speaker: nightingale
          text: >-
            我会唱幸福的人，也会唱正在受苦的人。我还要把藏在你身边的善与恶唱给你听。小小的歌鸟能飞到远离宫廷的地方，飞到渔夫的家，也飞到农人的茅舍。比起你的皇冠，我更爱你的心。不过，皇冠四周也留着一点神圣的光。我会回来为你歌唱，只是你必须答应我一件事。
        - id: ch06-b07
          speaker: emperor
          text: >-
            无论什么事，我都答应你。
        - id: ch06-b08
          speaker: narrator
          text: >-
            皇帝已经换上皇袍，站到了床前。他握着沉重的金剑，把那只手按在心口上。
        - id: ch06-b09
          speaker: nightingale
          text: >-
            我只求你保守一个秘密。不要让任何人知道，你有一只小鸟，会把外面发生的一切都告诉你。把这件事藏在心里，对你最好。
        - id: ch06-b10
          speaker: narrator
          text: >-
            夜莺说完便飞走了。过了一会儿，仆人们走进房间，想看看已经死去的皇帝。谁知，他们一抬头，竟看见皇帝好好地站在那里。
        - id: ch06-b11
          speaker: emperor
          text: >-
            诸位，早安！
