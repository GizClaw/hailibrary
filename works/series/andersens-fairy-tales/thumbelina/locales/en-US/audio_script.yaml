  chapters:
    - id: ch01
      title: The Little Girl in the Flower
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a woman who wanted a little child more than anything, but her wish never came true. At last, she went to a fairy for help.
        - id: ch01-b02
          speaker: woman
          text: I want a little child so very much. Can you tell me where I might find one?
        - id: ch01-b03
          speaker: fairy
          text: Oh, that's easy enough. Take this barleycorn. It isn't the kind that grows in a farmer's field or gets fed to chickens. Plant it in a flowerpot, and you'll soon see what happens.
        - id: ch01-b04
          speaker: narrator
          text: The woman thanked her and paid twelve shillings for the barleycorn. At home, she planted it. Right away, a large, lovely flower sprang up. It looked like a tulip, but its red-and-gold petals were still folded tight.
        - id: ch01-b05
          speaker: woman
          text: What a beautiful flower!
        - id: ch01-b06
          speaker: narrator
          text: She kissed the petals, and the flower opened. It really was a tulip. There, on the green velvet stamens, sat a tiny, graceful girl. She was hardly half the length of a thumb, so they called her Thumbelina, or Tiny.
        - id: ch01-b07
          speaker: narrator
          text: A polished walnut shell became her cradle. Blue violet leaves made her mattress, and a rose leaf was her blanket. At night she slept there. By day, she played on a table where the woman had set out a plate filled with water. Wreaths of flowers circled the plate, with their stems dipping into the water. A broad tulip leaf floated there as Thumbelina's boat. She sat on it and rowed from side to side with two white horsehairs for oars. It was a lovely sight. She also sang in the softest, sweetest voice anyone had ever heard.
        - id: ch01-b08
          speaker: narrator
          text: One night, as Thumbelina slept beneath her rose-leaf blanket, a huge, ugly, dripping-wet toad crawled through a broken windowpane. She jumped onto the table and saw the little girl asleep in her walnut shell.
        - id: ch01-b09
          speaker: mother_toad
          text: What a lovely wife she would be for my son!
        - id: ch01-b10
          speaker: narrator
          text: The toad picked up the walnut shell and leaped through the window into the garden. She lived with her son at the marshy edge of a broad stream. He was even uglier than his mother. When he saw Thumbelina in her pretty bed, he had only one thing to say.
        - id: ch01-b11
          speaker: toad_son
          text: Croak, croak, croak!
        - id: ch01-b12
          speaker: mother_toad
          text: Not so loud! You'll wake her, and then she may run away. She's as light as swan's down. We'll set her on a water-lily leaf out in the stream. It will be an island to someone so tiny, and she won't be able to escape. While she waits there, we'll hurry home and prepare the grand room under the marsh for your wedding.
        - id: ch01-b13
          speaker: narrator
          text: Broad green water-lily leaves floated far out on the stream. One especially large leaf grew farther from shore than all the others. The old toad swam to it, carrying the walnut shell while Thumbelina still slept. Early the next morning, Thumbelina woke and cried bitterly when she saw where she was. Water surrounded the great green leaf on every side, and there was no path back to the bank.
        - id: ch01-b14
          speaker: narrator
          text: Meanwhile, the old toad decorated her room with rushes and yellow wildflowers. Then she and her son swam back. She meant to take Thumbelina's pretty bed and put it in the room where the newlyweds would live. The toad bowed low in the water.
        - id: ch01-b15
          speaker: mother_toad
          text: Here is my son. He is going to be your husband, and the two of you will live happily in the marsh beside the stream.
        - id: ch01-b16
          speaker: toad_son
          text: Croak, croak, croak!
        - id: ch01-b17
          speaker: narrator
          text: The toad took the walnut-shell bed and swam away. Thumbelina sat alone on the green leaf, weeping. She could not bear the thought of living with the old toad and marrying her ugly son.
        - id: ch01-b18
          speaker: narrator
          text: Little fish beneath the water had seen the toad and heard her plan. They raised their heads and looked at Thumbelina. The moment they saw how lovely she was, they felt terribly sorry that she would have to live with the toads.
        - id: ch01-b19
          speakers: [fish_one, fish_two, fish_three]
          ensemble: chorus
          text: No! We can't let that happen!
        - id: ch01-b20
          speaker: narrator
          text: The fish gathered around the green stalk that held the leaf and gnawed through it with their teeth. The leaf broke free and drifted down the stream, carrying Thumbelina far beyond the toads' reach.
    - id: ch02
      title: The Butterfly and the Cockchafer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Thumbelina floated past town after town. Little birds watched from the bushes and sang as she passed.
        - id: ch02-b02
          speakers: [bird_one, bird_two]
          ensemble: duo
          text: What a lovely little creature!
        - id: ch02-b03
          speaker: narrator
          text: The leaf carried her farther and farther, until she reached lands she had never seen. A graceful white butterfly kept fluttering around her and finally settled on the leaf. The butterfly liked Thumbelina, and she was glad to have him near. The old toad could never catch her now. All along the stream, the country was beautiful. Sunlight fell across the water until the whole surface glittered like liquid gold.
        - id: ch02-b04
          speaker: narrator
          text: Thumbelina took off her sash. She tied one end around the butterfly and fastened the other to the leaf. With the butterfly pulling, her leaf skimmed along faster than ever.
        - id: ch02-b05
          speaker: narrator
          text: Then a large cockchafer flew past. The moment he noticed Thumbelina, he caught her around the waist with his claws and carried her into a tree. Her green leaf floated on without her. The white butterfly was still tied to it and could not get free.
        - id: ch02-b06
          speaker: narrator
          text: Thumbelina was terribly frightened as the cockchafer flew up into the branches. More than that, she worried about the beautiful butterfly. If he could not loosen the sash, he would starve. The cockchafer did not care. He sat beside her on a broad green leaf, fed her honey from the flowers, and studied her closely.
        - id: ch02-b07
          speaker: cockchafer
          text: You're very pretty, even if you don't look anything like a cockchafer.
        - id: ch02-b08
          speaker: narrator
          text: Soon the other cockchafers came to see her. They lifted their feelers and looked her over.
        - id: ch02-b09
          speaker: lady_cockchafer_one
          text: Why, she has only two legs. That looks awful!
        - id: ch02-b10
          speaker: lady_cockchafer_two
          text: And she doesn't have any feelers at all!
        - id: ch02-b11
          speaker: lady_cockchafer_three
          text: Look how narrow her waist is. Ugh! She looks just like a human being.
          emotion: disgusted
        - id: ch02-b12
          speakers: [lady_cockchafer_one, lady_cockchafer_two, lady_cockchafer_three]
          ensemble: chorus
          text: Oh, she is ugly!
          emotion: disgusted
        - id: ch02-b13
          speaker: narrator
          text: Thumbelina was truly lovely, but every lady cockchafer said she was ugly. At last, the cockchafer who had carried her away believed them. He wanted nothing more to do with her.
        - id: ch02-b14
          speaker: cockchafer
          text: Go wherever you want. I don't care.
        - id: ch02-b15
          speaker: narrator
          text: He flew down and left her on a daisy. Thumbelina cried because even the cockchafers thought she was too ugly to keep. Yet she was as lovely as anyone could imagine, and as tender and delicate as a rose leaf.
        - id: ch02-b16
          speaker: narrator
          text: All summer, poor Thumbelina lived alone in the wide forest. She wove herself a bed from soft blades of grass, then hung it beneath a broad leaf where the rain could not reach her. Flowers gave her honey to eat, and every morning she drank clear drops of dew from their leaves. In that way, she made a life for herself through the warm months.
        - id: ch02-b17
          speaker: narrator
          text: Summer passed, and then autumn. At last came the long, bitter winter. The birds who had sung to her flew away. Trees and flowers withered, and the great clover leaf that had sheltered her curled into a yellow, shriveled stalk.
        - id: ch02-b18
          speaker: narrator
          text: Thumbelina's clothes were torn, and she was so small and delicate that she nearly froze to death. Then the snow began to fall. She was only an inch tall, so a single snowflake landing on her felt like a whole shovelful of snow falling on one of us. She found a dry leaf and wrapped it around her body, but the brittle leaf cracked straight through the middle. It could not keep out the cold, and she shivered harder than ever.
        - id: ch02-b19
          speaker: narrator
          text: Beside the forest lay a field where the grain had been cut long ago. Only dry stalks stood above the frozen earth. To Thumbelina, crossing them was like struggling through a great forest. Shaking with cold, she finally reached the door of a field mouse's den beneath the stubble. Inside were warm rooms, a kitchen, a fine dining room, and plenty of grain.
        - id: ch02-b20
          speaker: narrator
          text: Thumbelina stood at the door like a tiny beggar and asked for one small barleycorn. She had eaten nothing for two days.
        - id: ch02-b21
          speaker: field_mouse
          text: You poor little thing! Come into my warm room and have dinner with me.
        - id: ch02-b22
          speaker: narrator
          text: The field mouse was a good old creature, and she quickly grew fond of Thumbelina.
        - id: ch02-b23
          speaker: field_mouse
          text: You may stay with me all winter if you like. Just keep my rooms neat and clean, and tell me stories. I do enjoy a good story.
        - id: ch02-b24
          speaker: narrator
          text: Thumbelina did everything the field mouse asked, and for a while she lived very comfortably.
    - id: ch03
      title: The Mole's Dark Passage
      blocks:
        - id: ch03-b01
          speaker: field_mouse
          text: We will have company soon. My neighbor visits once every week. He is much better off than I am. His rooms are enormous, and he wears the finest black velvet coat. If you could marry him, you would never lack for anything. He is blind, though, so tell him your very best stories.
        - id: ch03-b02
          speaker: narrator
          text: Thumbelina had no interest in the neighbor, because he was a mole. Still, he came to visit in his black velvet coat.
        - id: ch03-b03
          speaker: field_mouse
          text: He is very rich and very learned. His house must be twenty times bigger than mine.
        - id: ch03-b04
          speaker: narrator
          text: The mole was certainly rich and learned. But he always spoke badly of the sun and the lovely flowers. He had never seen either one, so he had no idea how beautiful they were. Thumbelina had to sing for him. She sang “Ladybird, Ladybird, Fly Away Home,” along with several other pretty songs. Her sweet voice made the mole fall in love with her. He said nothing about it yet, because he was a cautious creature who never rushed into anything.
        - id: ch03-b05
          speaker: narrator
          text: Not long before, the mole had dug a tunnel between his house and the field mouse's home. He allowed the field mouse and Thumbelina to walk there whenever they wished. First, he warned them that a dead bird lay in the passage. It was a complete bird, beak and feathers and all, and it had not been dead for long.
        - id: ch03-b06
          speaker: narrator
          text: The mole carried a piece of glowing wood in his mouth. It shone like fire and lit their way through the darkness. When they reached the bird, the mole pushed his broad nose against the ceiling. Earth crumbled away, opening a large hole, and daylight poured into the passage.
        - id: ch03-b07
          speaker: narrator
          text: A swallow lay in the middle of the floor. His beautiful wings were pressed close to his body, and his feet and head were tucked beneath his feathers. It looked as if the poor bird had died from the cold.
        - id: ch03-b08
          speaker: narrator
          text: The sight made Thumbelina terribly sad. She loved the little birds that had sung and twittered to her all summer. The mole only shoved the swallow aside with his crooked legs.
        - id: ch03-b09
          speaker: mole
          text: He won't sing again. What a miserable thing it must be to come into the world as a bird! I'm grateful none of my children will ever be birds. All they can do is chirp and then starve when winter comes.
        - id: ch03-b10
          speaker: field_mouse
          text: A clever gentleman like you knows the truth. What good does all that chirping do? Winter comes, and a bird either starves or freezes. Still, birds do come from very fine families.
        - id: ch03-b11
          speaker: narrator
          text: Thumbelina said nothing. When the mole and the field mouse turned their backs, she bent down. She gently moved the soft feathers away from the swallow's head and kissed his closed eyes.
        - id: ch03-b12
          speaker: thumbelina
          text: Maybe you were one of the birds who sang so sweetly to me last summer. Your song gave me so much joy, you dear, beautiful bird.
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: The mole closed the hole that let in the daylight, and then he walked the field mouse and Thumbelina home.
    - id: ch04
      title: The Swallow Beneath the Earth
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: That night, Thumbelina could not sleep. She climbed quietly out of bed and began weaving dry hay together. Before long, she had made a large, beautiful covering. She carried it through the dark passage and spread it over the swallow. Then she brought some flower down that she had found in the field mouse's room. It was as soft and warm as wool. She tucked it closely along both sides of the bird, so he would not lie unprotected in the frozen earth.
        - id: ch04-b02
          speaker: thumbelina
          text: Goodbye, beautiful little bird. Thank you for your wonderful songs last summer, when the trees were green and the sun was warm.
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: She rested her head against the swallow's breast. Suddenly, she sprang back in alarm. Something inside him had gone thump, thump. It was his heart. The swallow was not dead at all. He had only been numbed by the cold, and now the warmth was bringing him back to life.
        - id: ch04-b04
          speaker: narrator
          text: Swallows fly to warm countries in the fall. But when one stays too long, the cold can seize it. The bird freezes, falls to the ground as if dead, and lies beneath the snow.
        - id: ch04-b05
          speaker: narrator
          text: Thumbelina trembled with fright. The swallow was enormous beside her, for she stood only an inch tall. Still, she found her courage. She piled more of the soft down over him, then laid her own leaf blanket across his head.
        - id: ch04-b06
          speaker: narrator
          text: The next morning, she slipped back into the tunnel. The swallow was alive, but very weak. He could open his eyes only for a moment. Thumbelina stood beside him with a piece of decayed wood for a lantern, since she had no other light.
        - id: ch04-b07
          speaker: swallow
          text: Thank you, pretty little girl. You've made me so warm. Soon I'll be strong again, and I'll fly out into the warm sunshine.
        - id: ch04-b08
          speaker: thumbelina
          text: Oh, but it's freezing outside now. The snow is falling, and everything is ice. Stay here in your warm bed. I'll take care of you.
        - id: ch04-b09
          speaker: narrator
          text: She brought him water in a flower petal and held it for him while he drank. Then the swallow told her what had happened. One of his wings had been wounded in a thornbush. He could no longer fly as fast as the other swallows, and before long they were far ahead on their journey to the warm countries. He struggled on alone until he fell to the earth. After that, he remembered nothing. He did not even know how he had come to lie in the mole's tunnel.
        - id: ch04-b10
          speaker: narrator
          text: The swallow stayed underground all winter, and Thumbelina cared for him with love. The mole and the field mouse knew nothing about it. Neither of them liked swallows.
        - id: ch04-b11
          speaker: narrator
          text: At last, spring arrived and warmed the earth. The swallow said goodbye, and Thumbelina opened the hole the mole had made in the ceiling. Beautiful sunlight streamed down on them.
        - id: ch04-b12
          speaker: narrator
          text: The swallow asked Thumbelina to come with him. She could sit on his back, and he would carry her away to the green forest. But Thumbelina knew the field mouse would be deeply hurt if she left without saying goodbye.
        - id: ch04-b13
          speaker: thumbelina
          text: No, I can't go.
        - id: ch04-b14
          speaker: swallow
          text: Then goodbye, good and lovely little girl.
        - id: ch04-b15
          speaker: narrator
          text: The swallow flew out into the sunshine. Thumbelina watched him go with tears in her eyes. She had grown very fond of him.
        - id: ch04-b16
          speaker: swallow
          text: Tweet, tweet!
        - id: ch04-b17
          speaker: narrator
          text: He disappeared into the green woods, and Thumbelina felt terribly sad. She was not allowed to go outside into the warm sun. Above the field mouse's home, the new grain had grown so high that it seemed like a dense forest to a girl only an inch tall.
    - id: ch05
      title: Away to the Warm Countries
      blocks:
        - id: ch05-b01
          speaker: field_mouse
          text: You're going to be married, Thumbelina! My neighbor has asked for you. What wonderful luck for a poor child. We must get your wedding clothes ready now. You'll need wool and linen, and everything must be just right when you become the mole's wife.
        - id: ch05-b02
          speaker: narrator
          text: Thumbelina had to sit at the spindle and spin thread for her new clothes. The field mouse hired four spiders, and they wove the cloth day and night. Every evening, the mole came to visit. Again and again, he talked about the wedding and why it must wait until summer was over. The hot sun was burning the ground until the earth grew hard as stone. Once the heat passed and summer ended, he would come for Thumbelina and make her his wife.
        - id: ch05-b03
          speaker: narrator
          text: Thumbelina did not want that at all. She could not love the tiresome mole. Each morning when the sun rose, and each evening when it set, she crept to the doorway. Whenever the wind parted the grain, she caught a glimpse of blue sky. The bright world outside looked so beautiful, and she longed to see her dear swallow again. But he never came back. By then, he was far away in the green forest.
        - id: ch05-b04
          speaker: narrator
          text: Autumn came, and Thumbelina's wedding clothes were finished.
        - id: ch05-b05
          speaker: field_mouse
          text: The wedding will take place in four weeks.
        - id: ch05-b06
          speaker: narrator
          text: Thumbelina burst into tears and said she would not marry that disagreeable mole.
        - id: ch05-b07
          speaker: thumbelina
          text: I don't want to marry him!
          emotion: sad
        - id: ch05-b08
          speaker: field_mouse
          text: Nonsense! Stop being stubborn, or I'll bite you with my white teeth. He is a very handsome mole. Even the queen doesn't own finer velvet and fur. His kitchen and storerooms are full. You should be grateful for such good luck.
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: The wedding day was set. The mole would take Thumbelina deep beneath the earth, where she would live with him and never see the warm sun again, because he hated it. The thought of leaving the beautiful sun made her miserable. The field mouse allowed her to stand at the door, so Thumbelina went out for one last look.
        - id: ch05-b10
          speaker: thumbelina
          text: Goodbye, bright sun!
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: She stretched her arms toward it. The grain had been cut, so she could walk a little way across the dry stubble. She put her arms around a small red flower growing nearby.
        - id: ch05-b12
          speaker: thumbelina
          text: Goodbye, goodbye. If you ever see the little swallow, please give him my love.
          emotion: sad
        - id: ch05-b13
          speaker: swallow
          text: Tweet, tweet!
        - id: ch05-b14
          speaker: narrator
          text: The sound came from above her. Thumbelina looked up, and there was the swallow, flying close by. He was delighted to see her. Through her tears, she told him that she was being forced to marry the ugly mole. She would have to live beneath the earth forever and never see the bright sun again.
        - id: ch05-b15
          speaker: swallow
          text: Winter will be here soon, and I'm flying back to the warm countries. Will you come with me? Sit on my back and tie your sash around us. We'll leave the ugly mole and his gloomy rooms far behind. I'll carry you over the mountains to a warmer land. The sun shines more brightly there. Summer never ends, and the flowers are lovelier than any you've seen. Come with me now, dear Thumbelina. You saved my life when I lay frozen in that dark tunnel.
        - id: ch05-b16
          speaker: thumbelina
          text: Yes! I'll go with you.
          emotion: happy
        - id: ch05-b17
          speaker: narrator
          text: Thumbelina climbed onto the swallow's back. She rested her tiny feet on his open wings and tied her sash firmly to one of his strongest feathers. Then the swallow lifted her high into the air. Below them, forests gave way to the open sea. Beyond the sea rose the highest mountains, their peaks buried beneath snow that never melted, and the swallow carried her far above them all.
        - id: ch05-b18
          speaker: narrator
          text: The air was so cold that Thumbelina would have frozen. She tucked herself beneath the swallow's warm feathers, leaving only her head uncovered so she could watch the beautiful lands passing below.
        - id: ch05-b19
          speaker: narrator
          text: At last, they reached the warm countries. The sun shone brightly there, and the sky seemed much higher. Purple, green, and white grapes grew along hedges and roadsides. Lemons and oranges hung from trees in the woods, while myrtle and orange blossoms filled the air with their scent. Lovely children ran along the country lanes, playing with large, colorful butterflies. The farther the swallow flew, the lovelier the land became.
    - id: ch06
      title: The Kingdom of Flowers
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last, they came to a blue lake. Beside it stood an ancient palace of dazzling white marble, shaded by the deepest green trees. It had been built long ago, and tall pillars rose all around it. Green vines curled up those pillars, spreading their leaves across the shining stone. Near the top were many swallows' nests tucked safely beneath the palace roof. One of those nests belonged to the swallow who had carried Thumbelina all the way from the field mouse's home.
        - id: ch06-b02
          speaker: swallow
          text: This is my home. But you wouldn't be comfortable living up there with me. Choose one of those lovely flowers instead. I'll set you down on it, and you can have everything you need to be happy.
        - id: ch06-b03
          speaker: thumbelina
          text: Oh, that will be wonderful!
          emotion: happy
        - id: ch06-b04
          speaker: narrator
          text: She clapped her little hands with joy. Nearby, a fallen marble pillar had broken into three pieces. Beautiful, broad white flowers grew between them. The swallow flew down and placed Thumbelina on one of the wide petals.
        - id: ch06-b05
          speaker: narrator
          text: And what a surprise waited inside the flower. In its center stood a tiny man, as white and clear as crystal. A golden crown rested on his head, and delicate wings grew from his shoulders. He was no larger than Thumbelina. He was the spirit of that flower, and the king of all the tiny men and women who lived inside the flowers.
        - id: ch06-b06
          speaker: thumbelina
          text: Oh, how beautiful he is!
          emotion: surprised
        - id: ch06-b07
          speaker: narrator
          text: She whispered the words to the swallow. At first, the little prince was frightened of the bird. Beside him, the swallow seemed like a giant. Then he saw Thumbelina and was delighted. She was the prettiest little girl he had ever seen.
        - id: ch06-b08
          speaker: narrator
          text: The prince lifted the golden crown from his own head and placed it on hers. He asked her name. Then he asked whether she would marry him and become queen of all the flowers.
        - id: ch06-b09
          speaker: flower_prince
          text: What is your name? Will you be my wife and rule over all the flowers as my queen?
        - id: ch06-b10
          speaker: narrator
          text: This husband was nothing like the toad's son or the mole in his black velvet and fur.
        - id: ch06-b11
          speaker: thumbelina
          text: Yes, I will.
          emotion: happy
        - id: ch06-b12
          speaker: narrator
          text: At once, all the flowers opened. A tiny lady or a tiny lord stepped out of every one. They were all so lovely that simply looking at them was a joy. Each came forward with a wedding present for Thumbelina. The finest gift of all was a pair of beautiful wings that had once belonged to a large white fly. The flower folk carefully fastened the wings to Thumbelina's shoulders. Now she would no longer have to stay on the ground. She could fly wherever she pleased, from one flower to the next.
        - id: ch06-b13
          speaker: narrator
          text: Everyone rejoiced. Up in his nest, the little swallow was asked to sing a wedding song. He sang as well as he could. Yet his heart was sad, because he loved Thumbelina and wished he never had to leave her.
        - id: ch06-b14
          speaker: flower_prince
          text: You mustn't be called Tiny anymore. That name doesn't suit someone so pretty. From now on, we will call you Maia.
        - id: ch06-b15
          speaker: swallow
          text: Goodbye, goodbye.
          emotion: sad
        - id: ch06-b16
          speaker: narrator
          text: With a heavy heart, the swallow left the warm countries and flew back to Denmark. There, he had a nest above the window of a house where a writer of fairy tales lived.
        - id: ch06-b17
          speaker: swallow
          text: Tweet, tweet!
        - id: ch06-b18
          speaker: narrator
          text: The writer listened to the swallow's song, and that is how the whole story came to us.
