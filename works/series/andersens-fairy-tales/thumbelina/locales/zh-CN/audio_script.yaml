  chapters:
    - id: ch01
      title: 花里的小姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个女人一心盼着能有一个小小的孩子，可她怎么盼也盼不来。后来，她只好去求一位仙女帮忙。
        - id: ch01-b02
          speaker: woman
          text: 我太想要一个孩子了。您知道去哪里才能找到吗？
        - id: ch01-b03
          speaker: fairy
          text: 这不难。拿着这粒特别的大麦种子吧，它可不是田里那种喂鸡的大麦。把它种进花盆，你就知道了。
        - id: ch01-b04
          speaker: narrator
          text: 女人道了谢，付给仙女十二先令，这正是那粒种子的价钱。她带着种子回家，把它种进花盆。种子一入土，很快就长出一朵又大又美的花。花看起来像郁金香，红里透金的花瓣却紧紧合着，好像还是一个花苞。
        - id: ch01-b05
          speaker: woman
          text: 这朵花真美呀！
        - id: ch01-b06
          speaker: narrator
          text: 她低下头，吻了吻红里透金的花瓣。花一下子完全绽开，原来真是一株郁金香。正中央那片绿色天鹅绒一样的花蕊上，坐着一个娇小玲珑的姑娘。她还不到半根拇指长，大家就叫她拇指姑娘，也叫她小不点儿，因为她实在太小了。

            核桃壳是她的摇篮，蓝紫罗兰花瓣是褥子，玫瑰花瓣是被子。夜里，她睡在这张小床上。白天，她就在桌上玩。女人摆来一盘水，在四周围上一圈花，把花茎都浸进水里。一片大郁金香叶浮在水面，那就是拇指姑娘的小船。她坐在叶子上，用两根白马鬃当桨，从盘子这头划到那头。她还会唱歌，那轻轻甜甜的歌声，谁也没有听过。
        - id: ch01-b07
          speaker: narrator
          text: 一天夜里，一只又大又丑的癞蛤蟆从破窗玻璃那里爬进屋，浑身湿漉漉的。她跳上桌子，看见拇指姑娘盖着玫瑰花瓣，睡得正香。
        - id: ch01-b08
          speaker: toad
          text: 多漂亮呀！给我儿子做媳妇正合适。
        - id: ch01-b09
          speaker: narrator
          text: 老癞蛤蟆连人带核桃壳一起抱走，跳出窗户，去了花园。花园里有一条宽溪，溪边的沼泽就是她和儿子的家。小癞蛤蟆比母亲还丑。他望着床上的小姑娘，嘴里只会发出一种声音。
        - id: ch01-b10
          speaker: toad_son
          text: 呱，呱，呱！
        - id: ch01-b11
          speaker: toad
          text: 小声点儿，别把她吵醒了。她醒来，也许会逃。她轻得就像一小团天鹅绒毛。我们先把她放到溪水中央的睡莲叶上。那片叶子对她就是一座孤岛，四面都是水，她肯定走不了。咱们赶快去把沼泽底下那间漂亮的新房收拾好，等你们成了亲，就住在那里。
        - id: ch01-b12
          speaker: narrator
          text: 溪水深处长着许多睡莲，宽大的绿叶浮在水面。最大的一片离岸最远。老癞蛤蟆带着核桃壳游过去，把拇指姑娘放在那里，她还一直睡着。第二天一早，她醒来一看，四周全是深水，怎么也回不到岸上，伤心得哭个不停。

            这时，老癞蛤蟆正在水底用灯心草和黄野花布置房间。她收拾完，又带着儿子游回来，要搬走那张小床。她先在水里深深鞠了一躬。
        - id: ch01-b13
          speaker: toad
          text: 这是我儿子，他要娶你。以后，你们就在溪边的沼泽里一起过日子。
        - id: ch01-b14
          speaker: toad_son
          text: 呱，呱，呱！
        - id: ch01-b15
          speaker: narrator
          text: 癞蛤蟆抱着核桃壳游走了，把拇指姑娘独自留在叶子上。想到自己要住进沼泽，还要嫁给那个丑儿子，她哭得更伤心了。

            水下的小鱼听见了癞蛤蟆的话，都探出头来看。它们一见拇指姑娘那么美，再想到她就要过那样的日子，心里很不好受。
        - id: ch01-b16
          speaker: fish
          text: 不行，绝不能让她嫁给那只癞蛤蟆！
        - id: ch01-b17
          speaker: narrator
          text: 小鱼们游到叶子底下，围住那根茎，一口一口把它咬断。睡莲叶立刻顺水漂走，载着拇指姑娘离岸越来越远。
    - id: ch02
      title: 漂流与寒冬
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 拇指姑娘漂过一座又一座城镇。灌木里的小鸟看见她，都唱起歌来。
        - id: ch02-b02
          speaker: birds
          text: 快看呀，多可爱的小人儿！
        - id: ch02-b03
          speaker: narrator
          text: 叶子越漂越远，一直漂到别的国土。一只秀气的白蝴蝶总在她身边飞舞，后来落在叶片上。他很喜欢她，她也因为有了同伴而高兴。癞蛤蟆再也追不上来了。一路的景色那么美，阳光落在水面上，闪闪发亮，像流动的金子。

            拇指姑娘解下腰带，一头系住蝴蝶，一头系在叶片上。小船马上滑得更快了。可就在她站在叶子上向前漂时，一只大金龟子飞来，伸出爪子搂住她的腰，把她带上了一棵树。叶子继续顺流而下，那只被系住的蝴蝶也只能跟着叶子走。
        - id: ch02-b04
          speaker: narrator
          text: 大金龟子带着拇指姑娘飞上树，她吓坏了。可她更担心白蝴蝶，因为正是她把蝴蝶系在叶片上的。要是他挣不开腰带，就会被叶子一直拖着，最后活活饿死。金龟子可一点儿也不在乎。他和她并排坐在一片大绿叶上，还拿花蜜给她吃。
        - id: ch02-b05
          speaker: beetle
          text: 你一点儿也不像金龟子，不过，你长得倒挺漂亮。
        - id: ch02-b06
          speaker: narrator
          text: 没过多久，住在这棵树上的金龟子一个接一个都来了。他们围着拇指姑娘，把她从头看到脚，还翘起触须，仔细议论这个从没见过的小姑娘。
        - id: ch02-b07
          speaker: beetles
          text: 她怎么只有两条腿？看着真难看。她连一根触须都没有！腰还细成那个样子。呸，简直就像个人！哎呀，她可真丑！
        - id: ch02-b08
          speaker: narrator
          text: 其实，拇指姑娘明明十分美丽。可带她来的金龟子听大家都说她丑，自己也信了。他不想再和她待在一起，便把她送到树下，放在一朵雏菊上，叫她自己走。

            拇指姑娘哭了。她以为自己真的丑，连金龟子也嫌弃她。可她是世上最可爱的生灵，柔嫩得就像一片玫瑰花瓣。
        - id: ch02-b09
          speaker: narrator
          text: 整个夏天，可怜的拇指姑娘都独自住在广阔的森林里。她把一根根草叶编成小床，再把床挂到一片宽叶子下面，这样下雨时就不会淋湿。饿了，她就到花朵里吸一点花蜜。每天清晨，她喝叶片上亮晶晶的露珠。

            夏天走了，秋天也走了，漫长又寒冷的冬天来了。那些曾经为她甜甜歌唱的小鸟全都飞走了，树木和花儿也渐渐枯萎。替她遮风挡雨的大苜蓿叶缩成一团，只剩下一根黄黄的枯梗。她的衣服已经破了，身子又那么纤弱娇小，几乎要冻死了。
        - id: ch02-b10
          speaker: narrator
          text: 雪也落了下来。别忘了，拇指姑娘只有一英寸高。一片雪花压到她身上，就像一整铲雪砸在我们身上。她拿枯叶紧紧裹住自己，可叶子从中间裂开了，根本挡不住寒气，她还是冷得浑身发抖。

            森林旁边有片收割过的麦田。麦子早已割完，冻得又硬又冷的地里，只立着光秃秃的枯麦茬。对拇指姑娘来说，那些麦茬就像一座大森林。她在里面一步步挣扎着向前走，冷得抖个不停。最后，她终于来到一只田鼠的门前。
        - id: ch02-b11
          speaker: narrator
          text: 田鼠的洞挖在麦茬下面，屋里温暖舒服，粮食堆得满满的，还有厨房和漂亮的饭厅。拇指姑娘像个小乞丐一样站在门口，只求一粒麦子。她已经两天什么也没吃了。
        - id: ch02-b12
          speaker: field_mouse
          text: 可怜的小东西，快进来暖和暖和，跟我一起吃饭吧。
        - id: ch02-b13
          speaker: narrator
          text: 这是一只善良的老田鼠。她很喜欢拇指姑娘，吃饭时又提出了一个主意。
        - id: ch02-b14
          speaker: field_mouse
          text: 你愿意的话，整个冬天都住在我这里。只要把屋子收拾干净，再讲些故事给我听就行。我最喜欢听故事。
        - id: ch02-b15
          speaker: narrator
          text: 拇指姑娘答应了。她认真做事，也常给田鼠讲故事，在地下的小屋里过得很舒服。
    - id: ch03
      title: 黑暗通道里的燕子
      blocks:
        - id: ch03-b01
          speaker: field_mouse
          text: 我们很快就有客人了。我的邻居每星期都来。他可富了，屋子又宽敞，还总穿一件漂亮的黑天鹅绒外套。你要是嫁给他，一辈子都有依靠。不过他看不见东西，你得把最好听的故事讲给他听。
        - id: ch03-b02
          speaker: narrator
          text: 拇指姑娘听说邻居是只鼹鼠，一点儿也不喜欢他。可鼹鼠还是穿着黑天鹅绒外套来了。
        - id: ch03-b03
          speaker: field_mouse
          text: 你瞧，他既富有又有学问，房子足足比我的大二十倍！
        - id: ch03-b04
          speaker: narrator
          text: 鼹鼠确实有钱，也懂得很多，却总用轻蔑的口气谈论太阳和花朵，因为他从来没见过它们。拇指姑娘只好唱起《瓢虫，瓢虫，快回家》，又唱了许多好听的歌。她的嗓音实在太甜美，鼹鼠听着听着便爱上了她。不过他很谨慎，还没有把自己的心意说出来。

            不久前，鼹鼠挖出一条长通道，把田鼠家和自己家连在一起。他让田鼠随时带拇指姑娘去散步，只是先提醒她们，路上会看见一只死鸟。那只鸟连嘴和羽毛都好好的，像是刚死不久。
        - id: ch03-b05
          speaker: narrator
          text: 鼹鼠嘴里衔着一块会发光的朽木，走在前面，为她们照亮又长又黑的通道。走到死鸟旁边，他用宽鼻子顶破洞顶。泥土落下来，露出一个大洞，日光也照了进来。通道中央躺着一只燕子，美丽的翅膀紧贴身体，头和脚全缩在羽毛里，看上去是冻死的。

            拇指姑娘心里一阵难过。她那么喜欢鸟儿，整个夏天，它们都曾为她唱歌。
        - id: ch03-b06
          speaker: mole
          text: 他再也唱不了了。做一只鸟真够可怜的，除了叽叽喳喳，什么也不会。一到冬天，还不是要饿死。
        - id: ch03-b07
          speaker: field_mouse
          text: 您这么有学问，说的准没错！光会叫几声有什么用？冬天一来，不是饿死，就是冻死。不过，鸟儿的出身倒还算高贵。
        - id: ch03-b08
          speaker: narrator
          text: 拇指姑娘没有争辩。等他们转过身，她弯下腰，拨开燕子头上的软羽毛，吻了吻那双闭着的眼睛。她想，也许在夏天为自己唱歌的，就有这一只燕子。那歌声曾给她带来多少快乐啊。

            鼹鼠重新堵住洞顶，送田鼠回家。到了夜里，拇指姑娘怎么也睡不着。她爬下床，用干草编了一张大毯子，拿去盖住燕子。她又找来柔软得像羊毛的花绒，铺在他身体两边。
        - id: ch03-b09
          speaker: thumbelina
          text: 再见了，美丽的小鸟。谢谢你们在夏天唱歌给我听。那时候，树是绿的，太阳也是暖的。
        - id: ch03-b10
          speaker: narrator
          text: 她把头贴到燕子胸前，忽然听见里面传来怦、怦的声音，吓得浑身一颤。原来燕子没有死，他只是冻僵了。现在身上暖起来，心也重新跳动了。

            秋天，燕子本该飞去温暖的国度。这只燕子耽搁了，严寒抓住他，让他像死去一样从天上掉下来，留在原地被雪掩埋。
        - id: ch03-b11
          speaker: narrator
          text: 燕子比拇指姑娘大得多，她怕得发抖，可她还是鼓起勇气，把更多花绒盖到他身上，又拿来自己当被子的叶片，替他盖住头。

            第二天早晨，她悄悄来看燕子。燕子已经醒了，只是很虚弱，只能睁眼看她一会儿。拇指姑娘举着一块发光的朽木，站在他身旁。
        - id: ch03-b12
          speaker: swallow
          text: 谢谢你，美丽的小姑娘。你把我焐暖了。等力气回来，我就能重新飞进温暖的阳光里。
        - id: ch03-b13
          speaker: thumbelina
          text: 可外面还在下雪，到处都结着冰。你先躺在这张暖床上，我会照顾你。
        - id: ch03-b14
          speaker: narrator
          text: 她用一片花瓣盛来水，让燕子慢慢喝下去。燕子告诉她，自己的翅膀被荆棘丛划伤了，所以飞得没有同伴快。别的燕子很快就在去往温暖国度的路上飞远了。后来，他落到地上，从那以后什么也不记得，更不知道自己怎么会躺在这条通道里。

            整整一个冬天，燕子都留在地下。拇指姑娘带着爱意照料他，田鼠和鼹鼠却一点儿也不知道，因为他们都不喜欢燕子。
        - id: ch03-b15
          speaker: narrator
          text: 春天来了，太阳把大地晒暖了。燕子要走了。拇指姑娘打开鼹鼠在洞顶钻出的洞，明亮的阳光落在他们身上。燕子问她，愿不愿意坐到自己背上，一起飞进碧绿的森林。
        - id: ch03-b16
          speaker: thumbelina
          text: 不，我不能走。要是我就这样离开，田鼠会非常伤心的。
        - id: ch03-b17
          speaker: swallow
          text: 那么，再见了，善良又美丽的小姑娘。
        - id: ch03-b18
          speaker: narrator
          text: 燕子飞进阳光，嘴里唱着啾、啾。拇指姑娘望着他远去，眼里全是泪水。她舍不得这只燕子，心里难过极了。

            她还是不能走到温暖的阳光下。田鼠屋顶上的麦子已经长高了，对只有一英寸高的她来说，那片麦田就是一座茂密的森林。
    - id: ch04
      title: 告别太阳的日子
      blocks:
        - id: ch04-b01
          speaker: field_mouse
          text: 拇指姑娘，你就要结婚了！我的邻居已经来求婚。像你这样可怜的孩子，能有这样的好运，多难得呀。现在快准备嫁衣，毛料的、亚麻的，一样都不能少。做鼹鼠太太，可不能缺东西。
        - id: ch04-b02
          speaker: narrator
          text: 拇指姑娘只好不停地转纺锤，为自己准备毛料和亚麻嫁衣。田鼠又雇来四只蜘蛛，让它们日夜不停地织布。鼹鼠每天晚上都来看她。他总说，现在太阳太热，把大地烤得像石头一样硬。等夏天过去，泥土凉下来，他们就举行婚礼。

            拇指姑娘一点儿也不高兴。她根本不喜欢鼹鼠。每天清晨和傍晚，她都会悄悄爬到门口。风把麦穗吹开时，她便能看见蓝天。外面那么亮，那么美，她真想再见燕子一面。可燕子一直没有回来，他早已飞进遥远的绿色森林。
        - id: ch04-b03
          speaker: narrator
          text: 秋天到了，嫁妆也全都做好了。
        - id: ch04-b04
          speaker: field_mouse
          text: 再过四个星期，你无论如何都得结婚。
        - id: ch04-b05
          speaker: narrator
          text: 拇指姑娘哭起来，说自己不愿意嫁给那个讨厌的鼹鼠。
        - id: ch04-b06
          speaker: field_mouse
          text: 别说傻话，也别这么固执！不然，我可要用白牙齿咬你了。鼹鼠多漂亮啊，连王后的天鹅绒和皮毛也比不上他的外套。他的厨房和地窖全都装得满满的。碰上这种好运，你应该感恩。
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 婚期就这样定了。到了那天，鼹鼠会来接走拇指姑娘，带她住进很深很深的地下。从此以后，她再也见不到温暖的太阳，因为鼹鼠讨厌阳光，也绝不会让自己的妻子走到阳光下面。

            想到这里，拇指姑娘难过得受不了。田鼠准她到门口去，她便走出去，准备最后看一眼太阳。
        - id: ch04-b08
          speaker: thumbelina
          text: 再见了，明亮的太阳！
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 她张开双臂。麦子已经收割了，田里又只剩下枯麦茬。她从屋旁走开一点儿，抱住身边的一朵小红花。
        - id: ch04-b10
          speaker: thumbelina
          text: 再见，再见。小红花，要是你见到燕子，请替我问候他。
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: 头顶忽然响起啾、啾的叫声。她抬头一看，正是那只燕子朝她飞来。燕子见到拇指姑娘，高兴极了。她哭着告诉他，自己不愿嫁给丑鼹鼠，也不愿永远住在地下，再也见不到太阳。
        - id: ch04-b12
          speaker: swallow
          text: 寒冷的冬天快来了，我要飞去温暖的国度。你跟我走吧。坐到我背上，用腰带把自己系牢。我们离开鼹鼠和他那间阴暗的屋子，飞过高山，一直飞到太阳更明亮的地方。那里总是夏天，花也开得更美。那时我冻僵在黑暗的通道里，是你救了我。现在，就让我带你走吧。
        - id: ch04-b13
          speaker: thumbelina
          text: 好，我跟你走！
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: 拇指姑娘坐上燕子的背，把双脚放在他展开的翅膀上，再用腰带把自己牢牢系在一根结实的羽毛上。
    - id: ch05
      title: 飞往温暖的国度
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 燕子腾空飞起，越过森林，越过大海，又飞得高高的，从终年积雪的群山上方越过。高处的寒风本来会把拇指姑娘冻僵，可她钻进燕子温暖的羽毛里，只露出小小的脑袋，望着脚下一片又一片美丽的国土。

            他们终于来到温暖的地方。阳光灿烂，天空显得格外高远。篱笆上和道路旁结着紫色、绿色、白色的葡萄，树林里挂满柠檬和橙子，空气中全是香桃木和橙花的香气。漂亮的孩子们在乡间小路上奔跑，追着鲜艳的大蝴蝶玩耍。
        - id: ch05-b02
          speaker: narrator
          text: 燕子继续向前飞，所到的地方也越来越美。后来，一片蓝色湖泊出现在他们眼前。湖边浓绿的树荫下，矗立着一座古老的宫殿，整座宫殿都是耀眼的白色大理石。葡萄藤缠绕着高高的石柱，柱顶筑着许多燕子窝，其中一个正是这只燕子的家。
        - id: ch05-b03
          speaker: swallow
          text: 我住在这里。不过，燕子窝不适合你，你住着也不会舒服。你选一朵喜欢的花吧，我把你放在花上。这样一来，你想要什么都会有，一定能过得很快乐。
        - id: ch05-b04
          speaker: thumbelina
          text: 那真是太好了！
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: 她欢喜地拍起小手。地上有一根断成三截的大理石柱，石块中间开着又大又白的花，漂亮得无法形容。燕子落下去，把拇指姑娘放到一片宽花瓣上。

            没想到，花心里坐着一个小小的男子。拇指姑娘吃了一惊。他的身体洁白透明，像水晶一样，头上戴着金冠，肩后生着一双精巧的翅膀。他的个头和拇指姑娘差不多，原来是花中精灵的国王。每朵花里都住着一个小小的男子或女子。
        - id: ch05-b06
          speaker: thumbelina
          text: 燕子，你看，他多美呀！
          emotion: surprised
        - id: ch05-b07
          speaker: narrator
          text: 小王子起初很怕燕子。对他这样小的精灵来说，燕子简直是个巨人。可他一看见拇指姑娘，立刻欢喜起来。她是他见过的最美丽的小姑娘。

            王子摘下金冠，轻轻戴到她头上。他先问了她的名字，又问她愿不愿意嫁给自己，做百花的王后。
        - id: ch05-b08
          speaker: flower_prince
          text: 你叫什么名字？你愿意做我的妻子，成为百花的王后吗？
        - id: ch05-b09
          speaker: narrator
          text: 眼前这位王子，当然和癞蛤蟆的儿子、还有穿黑天鹅绒和皮毛的鼹鼠完全不同。拇指姑娘答应了他。
    - id: ch06
      title: 百花的王后
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 所有花朵一下子全开了。每朵花里都走出一位小小姐或小公子，他们个个美丽可爱，叫人看着就开心。大家都为拇指姑娘带来一件礼物。其中最好的一件，是一对白色大苍蝇用过的漂亮翅膀。

            花中精灵把翅膀系到她肩上。从此，她也能在花朵之间飞来飞去了。四周一片欢腾，大家还请坐在高处燕子窝里的燕子唱一首婚礼歌。
        - id: ch06-b02
          speaker: narrator
          text: 燕子尽力唱着，心里却很难过。他那么喜欢拇指姑娘，真希望永远不要再和她分开。
        - id: ch06-b03
          speaker: flower_prince
          text: 以后别再叫拇指姑娘了。这个名字不好听，你又这么美。我们叫你玛雅吧。
        - id: ch06-b04
          speaker: narrator
          text: 后来，燕子怀着沉重的心离开温暖的国度，飞回丹麦。他在那里也有一个窝，就筑在一户人家的窗户上方。屋里住着一位写童话的人。

            燕子对着他唱起啾、啾。就这样，从燕子的歌声里，有了这个完整的故事。
