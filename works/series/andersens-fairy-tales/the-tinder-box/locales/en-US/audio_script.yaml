  chapters:
    - id: ch01
      title: The Hollow Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A soldier marched down the high road, calling, “Left, right! Left, right!” His knapsack was on his back and his sword hung at his side. The war was over for him, and he was on his way home.
        - id: ch01-b02
          speaker: narrator
          text: Along the road he met a frightening old witch. Her lower lip hung all the way down to her chest. She stopped him.
        - id: ch01-b03
          speaker: witch
          text: Good evening, soldier. That is a fine sword, and you have a big knapsack. You look like a true soldier, so I’ll let you take all the money you could ever want.
        - id: ch01-b04
          speaker: soldier
          text: Thank you, old witch.
        - id: ch01-b05
          speaker: witch
          text: See that big tree beside us? It’s hollow. Climb to the top and you’ll find a hole. Lower yourself through it, deep into the tree. I’ll tie a rope around you, and when you call, I’ll pull you back up.
        - id: ch01-b06
          speaker: soldier
          text: What am I supposed to do down there?
        - id: ch01-b07
          speaker: witch
          text: Get money. At the bottom you’ll enter a great hall lit by three hundred lamps. There are three doors, and each key is already in its lock.
        - id: ch01-b08
          speaker: witch
          text: Behind the first door is a chest with a dog sitting on it. His eyes are as big as teacups. Don’t be afraid. Spread my blue checked apron on the floor, lift the dog onto it, and take all the copper pennies you like.
        - id: ch01-b09
          speaker: witch
          text: If you want silver, go through the second door. That dog has eyes as big as mill wheels. Put him on my apron too, and he can’t hurt you. Then help yourself.
        - id: ch01-b10
          speaker: witch
          text: The third room is full of gold. Its dog is terrible to look at, with eyes as big as towers. Never mind him. Set him on the apron, and take as much gold as you want.
        - id: ch01-b11
          speaker: soldier
          text: That sounds pretty good. But what do you want from me? You wouldn’t tell me all this for nothing.
        - id: ch01-b12
          speaker: witch
          text: I don’t want a single penny. Just bring me the old tinder-box my grandmother left down there on her last visit.
        - id: ch01-b13
          speaker: soldier
          text: All right. I promise. Tie that rope around me.
        - id: ch01-b14
          speaker: witch
          text: Here’s the rope, and here’s my blue checked apron.
        - id: ch01-b15
          speaker: narrator
          text: Once the rope was secure, the soldier climbed all the way to the top of the tree. He found the opening and lowered himself through the hollow trunk to the ground far below. There stood the great hall, just as the witch had promised. Hundreds of lamps burned around him, and their light filled the enormous space.
        - id: ch01-b16
          speaker: narrator
          text: He opened the first door. There sat the dog with teacup-sized eyes, staring straight at him.
        - id: ch01-b17
          speaker: soldier
          text: Well, aren’t you a handsome fellow?
        - id: ch01-b18
          speaker: narrator
          text: He grabbed the dog, lifted him off the chest, and set him safely on the witch’s blue checked apron. Then he opened the lid and stuffed his pockets with as many copper coins as they could hold. He closed the chest, returned the dog to his seat, and walked into the second room. Sure enough, another dog sat there, watching him with eyes as big as mill wheels.
        - id: ch01-b19
          speaker: soldier
          text: Don’t stare at me like that. You’ll make your eyes water.
        - id: ch01-b20
          speaker: narrator
          text: He moved that dog to the apron and opened the chest. The moment he saw all the silver, he threw away every copper coin. He filled his pockets and his knapsack with silver instead.
        - id: ch01-b21
          speaker: narrator
          text: In the third room, the dog was truly hideous. His eyes were as big as towers, spinning around in his head like wheels.
        - id: ch01-b22
          speaker: soldier
          text: Good morning.
        - id: ch01-b23
          speaker: narrator
          text: The soldier touched his cap, because in all his life he had never seen a dog like this one. He stood for a moment and looked more closely at those enormous, turning eyes. Then he decided he had shown enough good manners. He lifted the dog down from the chest, placed him on the apron, and raised the lid.
        - id: ch01-b24
          speaker: narrator
          text: What a mountain of gold! There was enough to buy every piece of candy, every tin soldier, every whip and rocking horse in the world. It might even have bought the whole town.
        - id: ch01-b25
          speaker: narrator
          text: Out went the silver. In went the gold. He packed it into his pockets and knapsack, then filled his cap and even his boots. He could hardly walk.
        - id: ch01-b26
          speaker: narrator
          text: Now he was rich. He put the dog back on the chest, closed the door, and shouted up through the tree.
        - id: ch01-b27
          speaker: soldier
          text: Pull me up, old witch!
        - id: ch01-b28
          speaker: witch
          text: Do you have the tinder-box?
        - id: ch01-b29
          speaker: soldier
          text: No! I completely forgot it.
        - id: ch01-b30
          speaker: narrator
          text: He struggled back through the rooms and found the old tinder-box the witch wanted. When he called again, she pulled on the rope and hauled him up through the hollow tree. Soon he stood on the high road once more. His pockets and knapsack bulged with gold, his cap was full of it, and even his boots were packed so tightly that he could barely move.
        - id: ch01-b31
          speaker: soldier
          text: What are you going to do with that tinder-box?
        - id: ch01-b32
          speaker: witch
          text: That’s none of your business. You have your money. Now give it to me.
        - id: ch01-b33
          speaker: soldier
          text: Then listen. Tell me what you want it for, or I’ll draw my sword and cut off your head.
        - id: ch01-b34
          speaker: witch
          text: No.
        - id: ch01-b35
          speaker: narrator
          text: At once, the soldier cut off her head, and she fell on the road. He bundled all the gold in her apron and swung it over his back. The tinder-box went into his pocket, and he set off for the nearest town.
    - id: ch02
      title: The Tinder-Box
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: It was a very pleasant town. The soldier took a room at the finest inn and ordered all his favorite foods for dinner. Why not? He was rich now.
        - id: ch02-b02
          speaker: narrator
          text: The servant at the inn cleaned the soldier’s boots and stared at them. They were terribly shabby for a man who seemed so rich. Of course, the soldier had not yet had time to replace them. By the next day, he had bought handsome clothes and a proper pair of new boots, and there was nothing shabby about him anymore.
        - id: ch02-b03
          speaker: narrator
          text: Soon everyone knew him as a fine gentleman. People came to visit and told him about the town’s wonders. Most wonderful of all, they said, was the king’s beautiful daughter.
        - id: ch02-b04
          speaker: soldier
          text: Where can I see the princess?
        - id: ch02-b05
          speakers: [townsperson_1, townsperson_2, townsperson_3]
          ensemble: chorus
          text: No one can see her!
        - id: ch02-b06
          speaker: townsperson_1
          text: She lives inside a huge copper castle with walls and towers all around it.
        - id: ch02-b07
          speaker: townsperson_2
          text: Only the king may go in or out. A prophecy says she’ll marry an ordinary soldier, and the king can’t stand the thought of that.
        - id: ch02-b08
          speaker: narrator
          text: The soldier wished he could see her, but no one would give him permission.
        - id: ch02-b09
          speaker: narrator
          text: Still, he had a wonderful time in town. He went to the theater, took carriage rides through the king’s garden, and spent his days enjoying everything his gold could buy. He also gave a great deal of money to the poor. That was kind of him, and he had not forgotten the days when he himself had wandered without a single shilling.
        - id: ch02-b10
          speaker: narrator
          text: He had wealth, fine clothes, and many friends. They all called him a wonderful fellow and a true gentleman, and he loved hearing it.
        - id: ch02-b11
          speaker: narrator
          text: But he spent money and gave it away every day, while no new money came in. At last, he had only two shillings left.
        - id: ch02-b12
          speaker: narrator
          text: He could no longer pay for his elegant rooms, so he moved into a tiny attic tucked beneath the roof. There was no servant now. Every morning he cleaned his own worn boots, and when they split, he sat down and patched them himself with a great big needle. Not one of his old friends climbed up to visit him. There were far too many stairs, they said.
        - id: ch02-b13
          speaker: narrator
          text: One dark evening, he couldn’t even afford a candle. Then he remembered the bit of candle stuck inside the tinder-box from the hollow tree.
        - id: ch02-b14
          speaker: narrator
          text: He found the box and struck a few sparks with its flint and steel. The door flew open. There stood the dog with eyes as big as teacups.
        - id: ch02-b15
          speaker: dog_teacups
          text: What are your orders, master?
        - id: ch02-b16
          speaker: soldier
          text: Well, hello! This is a useful tinder-box if it can bring me whatever I want.
        - id: ch02-b17
          speaker: soldier
          text: Bring me some money.
        - id: ch02-b18
          speaker: narrator
          text: The dog vanished and soon returned with a large bag of copper coins in his mouth.
        - id: ch02-b19
          speaker: narrator
          text: The soldier quickly learned the tinder-box’s secret. One strike summoned the dog from the copper chest. Two brought the dog who guarded the silver. Three called the dog with tower-sized eyes who watched over the gold.
        - id: ch02-b20
          speaker: narrator
          text: Once again, the soldier had plenty of money. He moved back into his elegant rooms and put on his fine clothes. His friends recognized him at once and fussed over him just as they had before.
    - id: ch03
      title: The Princess at Midnight
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After a while, the soldier kept thinking about the princess. Everyone said she was beautiful, but what good was that if she stayed locked in a copper castle behind all those towers? Was there any way to see her?
        - id: ch03-b02
          speaker: narrator
          text: Then he remembered the tinder-box. He struck a light, and the dog with teacup-sized eyes appeared.
        - id: ch03-b03
          speaker: soldier
          text: It’s midnight, but I’d like to see the princess, even if it’s only for a moment.
        - id: ch03-b04
          speaker: narrator
          text: The dog vanished so quickly that the soldier hardly had time to look around. Then he was back. The princess lay asleep across his broad back. She was so lovely that anyone who saw her would have known at once that she was a true princess. The soldier looked at her and could not stop himself from giving her a kiss. Afterward, the dog raced back to the copper castle with her.
        - id: ch03-b05
          speaker: narrator
          text: The next morning, the princess ate breakfast with the king and queen and told them about her strange dream.
        - id: ch03-b06
          speaker: princess
          text: I dreamed that I rode on a dog’s back, and a soldier kissed me.
          emotion: surprised
        - id: ch03-b07
          speaker: queen
          text: Now that is quite a story.
        - id: ch03-b08
          speaker: narrator
          text: That night, an elderly lady-in-waiting watched beside the princess’s bed. She meant to learn whether it was really a dream.
        - id: ch03-b09
          speaker: narrator
          text: The soldier longed to see the princess again. He called the dog and told him to fetch her, then run as fast as he could.
        - id: ch03-b10
          speaker: narrator
          text: The old lady-in-waiting had prepared herself. She pulled on waterproof boots and ran after the dog as quickly as he ran through the streets. She kept him in sight until she saw him carry the sleeping princess into a large house. She needed a way to remember the place, so she took out a piece of chalk and drew a great cross on the door. Satisfied, she returned to the castle and went to bed.
        - id: ch03-b11
          speaker: narrator
          text: The dog returned the princess to the castle. On his way back, he noticed the cross on the soldier’s door. So he found another piece of chalk and put a cross on every door in town. Now the lady-in-waiting could never tell which house was the right one.
        - id: ch03-b12
          speaker: narrator
          text: Early the next morning, the king and queen followed the lady-in-waiting through town, along with all the palace officers. They meant to find where the princess had gone.
        - id: ch03-b13
          speaker: king
          text: Here it is!
        - id: ch03-b14
          speaker: queen
          text: No, my dear. It must be that door over there.
        - id: ch03-b15
          speakers: [townsperson_1, townsperson_2, townsperson_3]
          ensemble: chorus
          text: There’s one here! And another over there!
        - id: ch03-b16
          speaker: narrator
          text: Crosses were everywhere, on every door. Searching any longer was useless.
        - id: ch03-b17
          speaker: narrator
          text: But the queen was a clever woman, and she could do much more than simply ride around in a carriage. She brought out her large gold scissors and carefully cut a piece of silk into squares. From the silk she made a neat little bag. She filled it with buckwheat flour, tied it around the princess’s neck, and cut a tiny hole in the bottom. Wherever the princess went, the flour would trickle onto the ground behind her.
        - id: ch03-b18
          speaker: narrator
          text: That night, the dog came once more. He carried the princess to the soldier, who loved her deeply and wished he were a prince so he could marry her.
        - id: ch03-b19
          speaker: narrator
          text: The dog never noticed the flour spilling from the bag. It left a trail from the castle wall to the soldier’s house, then all the way up to the window where he climbed inside with the princess.
    - id: ch04
      title: The Prison Window
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In the morning, the king and queen followed the trail and discovered exactly where their daughter had been. The soldier was arrested and thrown into prison.
        - id: ch04-b02
          speaker: narrator
          text: The cell was dark and miserable. As he sat there, people brought him grim news.
        - id: ch04-b03
          speakers: [townsperson_1, townsperson_2, townsperson_3]
          ensemble: chorus
          text: Tomorrow, you’ll be hanged.
        - id: ch04-b04
          speaker: narrator
          text: That was bad enough. Worse still, the tinder-box was back at the inn.
        - id: ch04-b05
          speaker: narrator
          text: The next morning, he climbed up to the tiny window and peered through its iron bars. The streets below were full of people hurrying out of town to watch him hang. He heard the drums beating and saw row after row of soldiers marching toward the gallows. Men, women, and children ran after them, all eager to get a look.
        - id: ch04-b06
          speaker: narrator
          text: A shoemaker’s boy raced past in a leather apron and slippers. He ran so fast that one slipper flew off and struck the prison wall beneath the soldier’s window.
        - id: ch04-b07
          speaker: soldier
          text: Hey, shoemaker’s boy! You don’t have to run so fast. Nothing can happen until I get there. Go to the house where I was staying and bring me my tinder-box. I’ll give you four shillings, but hurry!
        - id: ch04-b08
          speaker: narrator
          text: Four shillings sounded very good to the boy. He raced away, found the tinder-box, and brought it straight to the soldier.
    - id: ch05
      title: The Three Dogs
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Outside the town, a great gallows had been built for the hanging. Soldiers stood in a ring around it, and several thousand people crowded behind them. The king and queen had come to watch. They sat high on splendid thrones, facing the judges and every member of the royal council.
        - id: ch05-b02
          speaker: narrator
          text: The soldier was already on the ladder. Just as they were about to place the rope around his neck, he spoke.
        - id: ch05-b03
          speaker: soldier
          text: A condemned man is often granted one last innocent request. I’d like to smoke a pipe. It will be the last pipe I ever smoke.
        - id: ch05-b04
          speaker: narrator
          text: The king could not refuse. The soldier took out his tinder-box and struck a spark. Once. Twice. Three times.
        - id: ch05-b05
          speaker: narrator
          text: In an instant, all three dogs stood before him. There was the dog with eyes like teacups, the dog with eyes like mill wheels, and the dog whose eyes were as big as towers.
        - id: ch05-b06
          speaker: soldier
          text: Help me! Don’t let them hang me!
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: The dogs sprang straight at the judges and councilors gathered around the gallows. One seized a man by the legs. Another caught someone by the nose. Then, with tremendous strength, they tossed the men many feet into the air. Up went the judges and councilors, one after another, before crashing back to the ground and being dashed to pieces.
        - id: ch05-b08
          speaker: king
          text: No one will touch me!
        - id: ch05-b09
          speaker: narrator
          text: But the biggest dog seized both the king and queen and threw them after the others.
        - id: ch05-b10
          speaker: narrator
          text: The soldiers and all the people were terrified. Together they cried out to the soldier.
        - id: ch05-b11
          speakers: [townsperson_1, townsperson_2, townsperson_3]
          ensemble: chorus
          text: Good soldier, be our king! You shall marry the beautiful princess!
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: They placed him in the royal carriage. The three dogs ran ahead.
        - id: ch05-b13
          speakers: [dog_teacups, dog_mill_wheels, dog_towers]
          ensemble: chorus
          text: Hurrah!
          emotion: happy
        - id: ch05-b14
          speaker: narrator
          text: The royal carriage rolled through town with the new king inside. Little boys whistled through their fingers as it passed, and the soldiers stood at attention and presented arms. At last, the princess was allowed to leave the copper castle. She came out to meet the soldier, married him, and became queen, which pleased her very much.
        - id: ch05-b15
          speaker: narrator
          text: The wedding celebrations lasted for a whole week. The three dogs sat at the table, staring with all their eyes.
