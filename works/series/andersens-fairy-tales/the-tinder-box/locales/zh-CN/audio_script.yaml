audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而带一点诙谐的童话讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    soldier:
      display_name: 士兵
      tts:
        delivery: 爽快大胆，偶尔粗鲁
        timbre: 结实明亮
        pace: 利落
        pitch: 中低音
    witch:
      display_name: 老巫婆
      tts:
        delivery: 沙哑神秘，话里藏着主意
        timbre: 干涩苍老
        pace: 缓慢
        pitch: 低音
    dog:
      display_name: 狗
      tts:
        delivery: 忠顺简短
        timbre: 浑厚
        pace: 稳定
        pitch: 低音
    townspeople:
      display_name: 城里人
      tts:
        delivery: 爱谈新鲜事的众人口吻
        timbre: 清楚自然
        pace: 轻快
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 精明沉着，略带讥讽
        timbre: 端正清晰
        pace: 从容
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严而固执
        timbre: 洪亮厚实
        pace: 稳重
        pitch: 低音
    crowd:
      display_name: 众人
      tts:
        delivery: 齐声呼喊，情绪鲜明
        timbre: 开阔响亮
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 空心树里的三条狗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个士兵从大路上走来，嘴里喊着“左，右——左，右”，脚步踏得很齐。他背着行囊，腰间挎剑，刚刚打完仗，正往家乡赶。
        - id: ch01-b02
          speaker: narrator
          text: 路上迎面来了一个吓人的老巫婆。她的下嘴唇垂到了胸口，一见士兵，就把他拦了下来。
        - id: ch01-b03
          speaker: witch
          text: 晚上好，士兵！瞧你这把好剑，还有这么大的行囊，果然是个真正的士兵。你想要多少钱，我都能让你拿到。
        - id: ch01-b04
          speaker: soldier
          text: 那可多谢你了，老巫婆。
        - id: ch01-b05
          speaker: witch
          text: 看见路边那棵大树没有？树心是空的。你爬到顶上，从洞口一直下到树底。我给你腰上系根绳，等你在下面喊一声，我再拉你上来。
        - id: ch01-b06
          speaker: soldier
          text: 我下去干什么？
        - id: ch01-b07
          speaker: witch
          text: 去拿钱。树底有座大厅，三百盏灯全亮着，还有三扇门。钥匙就在锁上，你只管开。第一间屋里有只大箱子，箱上坐着一条狗，眼睛有茶杯那么大。别怕，把我的蓝白格围裙铺在地上，再把狗放上去，箱里的铜便士随你拿。
        - id: ch01-b08
          speaker: witch
          text: 想要银币，就进第二间屋。那条狗的眼睛大得像磨盘，你也把它放在围裙上。要金子，就去第三间屋。守金币的狗最吓人，两只眼睛足有塔楼那么大。不过只要它待在围裙上，就伤不了你。
        - id: ch01-b09
          speaker: soldier
          text: 这买卖听着不错。可是老巫婆，你要我拿什么回报？你不会白白告诉我这些吧？
        - id: ch01-b10
          speaker: witch
          text: 我一文钱也不要。只要替我带回那只旧打火匣。那是我祖母上回下去时丢在里面的。
        - id: ch01-b11
          speaker: soldier
          text: 行，我答应你。把绳子系上吧。
        - id: ch01-b12
          speaker: witch
          text: 绳子给你，蓝白格围裙也拿好。
        - id: ch01-b13
          speaker: narrator
          text: 绳子一系牢，士兵便爬上树，从树洞降到深处。他双脚落了地，底下果真有座宽大的大厅，几百盏灯一齐燃着，把四周照得通明。他走到第一扇门前，钥匙已经插在锁孔里。门一推开，那条茶杯眼的狗正坐在大箱子上，直勾勾地盯着他。
        - id: ch01-b14
          speaker: soldier
          text: 你这家伙长得可真漂亮。
        - id: ch01-b15
          speaker: narrator
          text: 他一把抓起狗，照巫婆说的放到围裙上。狗果然没有伤他。他打开箱盖，把铜钱一把一把装进口袋，直到再也塞不进去，才盖上箱子，让狗重新坐回原处。接着他进了第二间屋，磨盘眼的狗也坐在箱上等着他。
        - id: ch01-b16
          speaker: soldier
          text: 别这么瞪着我，小心把眼睛瞪出泪来。
        - id: ch01-b17
          speaker: narrator
          text: 他又把狗挪到围裙上，打开了箱子。一见里面堆着那么多银币，铜钱立刻就不稀罕了。他把刚才拿的铜钱全倒掉，口袋和行囊里只装银币。随后，他又走进第三间屋。那里的狗丑得真吓人，塔楼一样大的眼睛在眼眶里不停打转，活像两个车轮。
        - id: ch01-b18
          speaker: soldier
          text: 早上好啊。
        - id: ch01-b19
          speaker: narrator
          text: 士兵碰了碰帽檐。他这辈子从没见过这样的狗，忍不住又看了几眼。等他觉得自己已经客气得够久了，便把狗放到地上，掀开箱盖。我的老天，满箱都是金子！这些金子足够买下卖糖女人手里所有的糖棍，买下世上所有的锡兵、鞭子和摇摇马，连整座城都买得下。金子多得简直没有尽头。
        - id: ch01-b20
          speaker: narrator
          text: 士兵扔掉银币，把金币塞进行囊、口袋、帽子和靴子，塞得自己几乎迈不开腿。他让狗坐回箱子，关上门，朝树洞上方大喊。
        - id: ch01-b21
          speaker: soldier
          text: 老巫婆，快把我拉上去！
        - id: ch01-b22
          speaker: witch
          text: 打火匣带上了吗？
        - id: ch01-b23
          speaker: soldier
          text: 糟了，我把它忘得一干二净。
        - id: ch01-b24
          speaker: narrator
          text: 他只好拖着沉重的双脚回到里面，找到那只旧打火匣。巫婆这才拽动绳子，把他从树洞里拉出来，让他重新站到大路上。此刻，他的行囊、口袋、帽子和两只靴子里全都装着金子。
        - id: ch01-b25
          speaker: soldier
          text: 你拿这只打火匣究竟要做什么？
        - id: ch01-b26
          speaker: witch
          text: 不关你的事。钱已经归你了，把打火匣给我。
        - id: ch01-b27
          speaker: soldier
          text: 你要是不肯说，我就拔剑砍掉你的脑袋。
        - id: ch01-b28
          speaker: witch
          text: 我不说。
        - id: ch01-b29
          speaker: narrator
          text: 士兵当即砍下了她的头。巫婆倒在地上，他用她的围裙包好金子，往背上一甩，又把打火匣装进口袋，向最近的城里走去。
    - id: ch02
      title: 打火匣的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 那座城很漂亮。士兵住进最好的客店，一口气点齐了自己爱吃的菜。如今他是有钱人，用不着舍不得。替他擦靴子的仆人却觉得奇怪，这么富有的一位先生，脚上怎么还穿着一双破靴子？士兵只是还没来得及置办。第二天，他就买了体面的衣裳和像样的新靴子，很快成了人人都认识的阔绅士。
        - id: ch02-b02
          speaker: narrator
          text: 访客们纷纷登门，给他讲城里所有的稀奇事，还说到国王那位美丽的女儿。
        - id: ch02-b03
          speaker: soldier
          text: 要到哪里才能见到公主？
        - id: ch02-b04
          speaker: townspeople
          text: 谁也见不到她。她被留在一座四周都是高墙和塔楼的铜城堡里，只有国王能进出。预言说她会嫁给一个普通士兵，国王怎么也受不了这件事。
        - id: ch02-b05
          speaker: narrator
          text: 士兵心里很想见见公主，却怎么也拿不到准许。不过他的日子还是过得很痛快。他去看戏，坐车游国王的花园，还把许多钱送给穷人。这件事倒值得称赞，因为他一直记得从前身上连一先令也没有是什么滋味。如今他有钱，衣裳漂亮，朋友又多。大家都夸他了不起，是个真正的绅士。他听得别提多高兴了。
        - id: ch02-b06
          speaker: narrator
          text: 可钱不会永远留在口袋里。他每天花掉一大把，又送出去一大把，却一文也没挣回来，最后只剩两个先令。他只能搬出漂亮的房间，住进屋顶下面的小阁楼。靴子要自己擦，破了还得拿大针来补。那些朋友一个也不来了，因为要走到他的门前，得爬太多层楼梯。
        - id: ch02-b07
          speaker: narrator
          text: 一个漆黑的晚上，士兵穷得连买蜡烛的一文钱都拿不出来。他坐在黑暗中，忽然记起那只从空心树里带回的打火匣。匣子里还粘着一小截蜡烛，说不定正好能用。他赶紧把匣子找出来，用燧石和火镰打了几下。
        - id: ch02-b08
          speaker: narrator
          text: 火星才一冒，门便猛地打开。那条眼睛大如茶杯的狗站在门口。
        - id: ch02-b09
          speaker: dog
          text: 主人，有什么吩咐？
        - id: ch02-b10
          speaker: soldier
          text: 嘿，这打火匣真不错！我要什么，它就能替我送来什么。
        - id: ch02-b11
          speaker: soldier
          text: 去给我拿些钱来。
        - id: ch02-b12
          speaker: narrator
          text: 狗一眨眼就没了，很快又叼着一大袋铜钱回来。士兵这才弄懂打火匣到底有多宝贵。打一下，守铜钱箱子的狗就会出现。打两下，守银币箱子的狗就会来。打三下，那条眼睛像塔楼、替他看守金币的狗便会站到面前。
        - id: ch02-b13
          speaker: narrator
          text: 士兵又有钱了。他搬回好房间，穿起漂亮衣裳。那些朋友也马上认回了他，又像从前那样围着他献殷勤。
    - id: ch03
      title: 深夜里的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 过了一阵，士兵越想越不明白，为什么谁都不能看一眼公主。
        - id: ch03-b02
          speaker: soldier
          text: 大家都说她美得不得了，可她要永远关在铜城堡里，再美又有什么用？难道我不能见她一面吗？对了，我还有打火匣！
        - id: ch03-b03
          speaker: narrator
          text: 他打出火星，茶杯眼的狗立刻来了。
        - id: ch03-b04
          speaker: soldier
          text: 虽然已经半夜，我还是很想见公主，哪怕只见一小会儿也好。
        - id: ch03-b05
          speaker: narrator
          text: 狗瞬间消失。士兵还没来得及转过身，它已经驮着熟睡的公主回来了。公主安静地躺在狗背上，美得叫人只看一眼就知道，她一定是真正的公主。士兵毕竟是个不折不扣的士兵，没能忍住，低头吻了她一下。随后，狗又驮着公主飞快地跑回城堡。
        - id: ch03-b06
          speaker: narrator
          text: 第二天早晨，公主和国王、王后一起吃饭。她把夜里的怪梦说给他们听。她梦见一条狗把自己背走，还梦见一个士兵。她骑在狗背上，后来又让那个士兵吻了一下。
        - id: ch03-b07
          speaker: queen
          text: 这故事可真够动听的。
        - id: ch03-b08
          speaker: narrator
          text: 王后听了，便在第二天夜里派一位老女官守在公主床边，要查清那到底是梦，还是真有其事。士兵偏偏又想见公主，便叫狗来接她，还吩咐它一路能跑多快就跑多快。老女官穿上防水靴，竟也在后面拼命追赶，最后亲眼看见狗驮着公主进了一幢大房子。
        - id: ch03-b09
          speaker: narrator
          text: 她怕记错地方，便用粉笔在门上画了一个大十字，这才回去睡觉。不久，狗把公主送回城堡。它看见士兵门上多了记号，马上找来另一截粉笔，把全城每扇门都画上了十字。这样一来，等女官带人回来时，就再也认不出士兵住的是哪一家了。
        - id: ch03-b10
          speaker: narrator
          text: 清早，国王、王后、老女官和宫里的官员一同出来找那幢房子。
        - id: ch03-b11
          speaker: king
          text: 就是这一家。
        - id: ch03-b12
          speaker: queen
          text: 不对，亲爱的丈夫，准是那一家。
        - id: ch03-b13
          speaker: crowd
          text: 这里也有！那边还有一个！
          emotion: surprised
        - id: ch03-b14
          speaker: narrator
          text: 放眼望去，这边一扇门有十字，那边一扇门也有，四面八方的门竟没有一扇例外。国王、王后和官员们再也分不出哪一个记号是真的，只好承认，继续寻找也没有用了。
    - id: ch04
      title: 从铜城堡到监狱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可王后聪明得很，她会做的事情，远不只是坐在马车里。她拿出金色的大剪刀，把一块丝绸裁成方片，又亲手缝成一只精巧的小口袋。她往袋里装满荞麦粉，把它系到公主颈上，最后在袋底剪出一个小洞。这样，公主走到哪里，面粉就会一路漏到哪里。
        - id: ch04-b02
          speaker: narrator
          text: 夜里，狗果然又来了。它让熟睡的公主伏在背上，一路把她驮给士兵。士兵已经深深爱上公主，多么希望自己也是一位王子，这样就可以娶她为妻。狗只顾往前跑，根本没发现面粉正在身后不断漏出来。从城堡围墙到士兵的住处，地上留下一条粉路，连它驮着公主爬过的窗口也沾上了白粉。
        - id: ch04-b03
          speaker: narrator
          text: 第二天一早，国王和王后看见地上的面粉，便沿着那条白色的痕迹一直追下去。他们终于查明女儿夜里到了哪里。士兵马上被人抓起来，关进监狱。他坐在阴暗的牢房里，四周又黑又难受。
        - id: ch04-b04
          speaker: townspeople
          text: 明天你就要被绞死了。
        - id: ch04-b05
          speaker: narrator
          text: 这当然不是什么好消息。更糟的是，打火匣还留在客店。到了清早，士兵坐在牢里，隔着小窗的铁栅栏向外看。人们正急匆匆地赶出城，都想去看他受绞刑。他听见鼓声咚咚响，看见一队队士兵从街上走过。全城的人仿佛都在往同一个地方跑。
        - id: ch04-b06
          speaker: narrator
          text: 一个鞋匠学徒系着皮围裙，穿着拖鞋，跑得像飞一样。一只拖鞋甩了出去，啪地撞上监狱的墙。
        - id: ch04-b07
          speaker: soldier
          text: 喂，鞋匠小子，别忙着跑！我还没到，那里就没什么可看的。你去我住过的房子，把打火匣取来，我给你四个先令。脚下可得快一点！
        - id: ch04-b08
          speaker: narrator
          text: 鞋匠学徒一听有四个先令，心里立刻愿意了。他顾不上那只飞掉的拖鞋，转身拔腿就跑。没过多久，他果真从士兵住过的房子里找到打火匣，又急忙赶回来，隔着栅栏把它交到士兵手上。接下来会发生什么，很快就能看见了。
    - id: ch05
      title: 三下火星
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 城外已经架起一座高大的绞刑架，周围站着士兵，还有成千上万来看热闹的人。国王和王后坐在华丽的宝座上，法官和全体大臣坐在他们对面。士兵已经站上梯子。就在行刑的人拿起绳索，要往他脖子上套的时候，他忽然提出了一个请求。
        - id: ch05-b02
          speaker: soldier
          text: 可怜的罪犯在受死以前，常常能获准提一个无害的请求。请让我抽一斗烟吧。等这斗烟抽完，我在人世间就再也抽不到下一斗了。
        - id: ch05-b03
          speaker: narrator
          text: 国王没法拒绝。士兵拿出打火匣，打一下，两下，三下。转眼间，三条狗都来了。茶杯眼、磨盘眼，还有那双像塔楼一样的眼睛，全在绞刑架前瞪着。
        - id: ch05-b04
          speaker: soldier
          text: 快救我，别让他们把我绞死！
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: 三条狗听到命令，立刻扑向法官和所有大臣。一条抓住这个人的双腿，另一条咬住那个人的鼻子，把他们一个接一个抛到好几丈高的半空。那些人再从高处重重落下，全都摔得粉身碎骨。
        - id: ch05-b06
          speaker: king
          text: 谁也不准碰我！
        - id: ch05-b07
          speaker: narrator
          text: 可最大的那条狗根本不听国王的话。它一把抓住国王，连王后也一起抓了起来，把他们朝那些法官和大臣摔去。这一下，四周的士兵和成千上万的百姓全都吓坏了。
        - id: ch05-b08
          speaker: crowd
          text: 好士兵，你来做我们的国王吧！再娶美丽的公主做王后！
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: 众人把士兵请进国王的马车，让他坐在里面进城。三条狗跑在车前，一路高喊“万岁”。街边的小男孩们把手指含在嘴里，吹出尖亮的口哨，列队的士兵们则举枪致敬。公主终于走出那座谁也不能进出的铜城堡，嫁给士兵，成了王后。这件事让她十分欢喜。
        - id: ch05-b10
          speaker: narrator
          text: 婚礼整整庆祝了一个星期。三条狗也坐在宴席旁，用它们所有的眼睛瞪着大家。
