audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温厚从容，像在孩子身边讲一则古老童话
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中音
    ugly_duckling:
      display_name: 丑小鸭
      tts:
        delivery: 单纯敏感，受挫时低落，后来逐渐坚定
        timbre: 年轻柔和
        pace: 稍慢
        pitch: 中高音
    mother_duck:
      display_name: 鸭妈妈
      tts:
        delivery: 直爽操心，话里带着母亲的利落劲儿
        timbre: 圆润明亮
        pace: 中等偏快
        pitch: 中音
    duckling_1:
      display_name: 小鸭子甲
      tts:
        delivery: 幼小好奇，开口轻快，透着刚见到世界的惊喜
        timbre: 清脆稚嫩
        pace: 轻快
        pitch: 高音
    duckling_2:
      display_name: 小鸭子乙
      tts:
        delivery: 天真活泼，语气雀跃，句尾带一点兴奋的上扬
        timbre: 柔亮稚嫩
        pace: 稍快
        pitch: 中高音
    old_duck:
      display_name: 老鸭
      tts:
        delivery: 老练自信，爱用自己的见识下判断
        timbre: 略沙哑
        pace: 从容
        pitch: 中低音
    farm_duck_1:
      display_name: 养鸭场鸭子甲
      tts:
        delivery: 挑剔排外，抢先发话，语气尖刻
        timbre: 尖亮干脆
        pace: 快
        pitch: 中高音
    farm_duck_2:
      display_name: 养鸭场鸭子乙
      tts:
        delivery: 不耐烦地附和，话里满是嫌弃
        timbre: 粗哑响亮
        pace: 中等偏快
        pitch: 中音
    farm_duck_3:
      display_name: 养鸭场鸭子丙
      tts:
        delivery: 爱起哄，排斥陌生者时说得又急又冲
        timbre: 细亮聒噪
        pace: 很快
        pitch: 高音
    spiteful_duck:
      display_name: 刻薄的鸭子
      tts:
        delivery: 蛮横嫌弃，句子短而冲
        timbre: 尖利
        pace: 快
        pitch: 中高音
    noble_duck:
      display_name: 系红布条的老鸭
      tts:
        delivery: 自命高贵，慢条斯理地发话
        timbre: 厚而苍老
        pace: 缓慢
        pitch: 中低音
    sibling_1:
      display_name: 手足甲
      tts:
        delivery: 年幼刻薄，奚落时直白又不耐烦
        timbre: 尖细清亮
        pace: 快
        pitch: 高音
    sibling_2:
      display_name: 手足乙
      tts:
        delivery: 跟着排斥，语气急促，带着冷淡的嘲笑
        timbre: 稚嫩偏哑
        pace: 中等偏快
        pitch: 中高音
    wild_duck_1:
      display_name: 野鸭甲
      tts:
        delivery: 好奇直白，问话时毫不避讳
        timbre: 粗亮开阔
        pace: 中等
        pitch: 中音
    wild_duck_2:
      display_name: 野鸭乙
      tts:
        delivery: 漫不经心地打量，嘲弄中带点随意
        timbre: 沙哑轻薄
        pace: 稍慢
        pitch: 中低音
    wild_duck_3:
      display_name: 野鸭丙
      tts:
        delivery: 爱凑热闹，插话干脆，语气轻佻
        timbre: 清亮偏粗
        pace: 偏快
        pitch: 中高音
    young_goose:
      display_name: 小野雁
      tts:
        delivery: 胆大随便，像在招呼新伙伴
        timbre: 年轻爽朗
        pace: 轻快
        pitch: 中高音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 朴实响亮，想到什么就说什么
        timbre: 苍老温厚
        pace: 中等
        pitch: 中音
    hen:
      display_name: 短腿小鸡
      tts:
        delivery: 自以为聪明，训话时絮叨又武断
        timbre: 清脆尖细
        pace: 偏快
        pitch: 高音
    cat:
      display_name: 公猫
      tts:
        delivery: 傲慢冷淡，像在宣布不容争辩的规矩
        timbre: 低柔浑厚
        pace: 慢
        pitch: 低音
    youngest_child:
      display_name: 最小的孩子
      tts:
        delivery: 惊喜天真，脱口而出
        timbre: 清亮稚嫩
        pace: 快
        pitch: 高音
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 欢快兴奋，发现新天鹅时急着告诉大人
        timbre: 明亮清脆
        pace: 轻快
        pitch: 高音
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 热情活泼，夸赞时语气真诚又响亮
        timbre: 圆润稚嫩
        pace: 中等偏快
        pitch: 中高音
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 雀跃外向，跟伙伴一起喊时节奏轻巧
        timbre: 轻柔明快
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 最后一只蛋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 乡下的夏天真美。谷物金黄，燕麦碧绿，牧场上堆着高高的草垛。一只鹳迈着细长的红腿四处走，嘴里叽里咕噜说着从母亲那里学来的埃及话。田野和牧场外是大片森林，林子深处藏着幽深的水塘。走在这样的乡间，心里也会舒展开来。阳光照着一座舒服的老农舍，旁边流着一条深河。屋后一直到河岸，全是硕大的牛蒡叶。最高的叶子底下，连小孩子也能站直。这里僻静得像密林深处。鸭妈妈就在这个安稳的角落守着窝，等孩子们出壳。可小家伙们迟迟不出来，她越等越烦，来看她的客人也少得可怜。别的鸭子宁可在河里游来游去，也不愿爬上湿滑的河岸，钻到牛蒡叶下面陪她说几句话。
        - id: ch01-b02
          speaker: narrator
          text: 总算有一只蛋壳裂开了，接着又裂开一只。每只蛋里都冒出一个活生生的小脑袋，刚看见外面的世界，就一起啾啾地叫起来。
        - id: ch01-b03
          speaker: mother_duck
          text: 嘎，嘎！
        - id: ch01-b04
          speaker: narrator
          text: 小鸭子们使足了劲跟着嘎嘎叫，还转动脑袋，朝四周那些比自己大得多的绿叶看个不停，像是怎么也看不够。鸭妈妈让他们尽情看，反正绿色对眼睛有好处。
        - id: ch01-b05
          speakers: [duckling_1, duckling_2]
          ensemble: duo
          text: 外面的世界真大呀！蛋壳里可没有这么宽敞。
        - id: ch01-b06
          speaker: mother_duck
          text: 你们以为这就是整个世界？等见到花园再说吧。花园一直伸到牧师家的田地那边，连我都没走过那么远。你们都出来了吗？哎呀，还没有！最大那只蛋还躺着呢。到底还要等多久？我可累坏了。
        - id: ch01-b07
          speaker: narrator
          text: 她说完，又坐回窝里。过了一会儿，一只老鸭来看她。
        - id: ch01-b08
          speaker: old_duck
          text: 怎么样，孩子们都出来了吗？
        - id: ch01-b09
          speaker: mother_duck
          text: 还剩一只，怎么也不肯破。你看看别的孩子，多漂亮呀，长得跟他们的爸爸一模一样。可那个没良心的家伙，一次也没来看过我们。
        - id: ch01-b10
          speaker: old_duck
          text: 把那只蛋给我看看。我敢说，那是火鸡蛋。以前我也受骗孵过几只。小东西出壳以后，我费了多少劲儿，他们就是怕水。我又叫又哄，还是没法让他们下去。对，这准是火鸡蛋。听我的，别孵了，带别的孩子去学游水吧。
        - id: ch01-b11
          speaker: mother_duck
          text: 我还是再等等吧。都已经坐了这么久，多孵几天也不算什么。
        - id: ch01-b12
          speaker: old_duck
          text: 那就随你吧。
        - id: ch01-b13
          speaker: narrator
          text: 老鸭说完就走了。鸭妈妈继续守着那只大蛋。大蛋终于裂开，一个小家伙从里面慢慢爬出来，啾啾地叫。他比别的孩子大出许多，模样也丑。鸭妈妈盯着他，吃了一惊。
        - id: ch01-b14
          speaker: mother_duck
          text: 这孩子可真大，跟别的孩子完全不像。难道真是小火鸡？等到了水边就知道了。他一定得下水，哪怕要我亲手推他下去。
        - id: ch01-b15
          speaker: narrator
          text: 第二天天气好极了，明晃晃的阳光照亮了碧绿的牛蒡叶。鸭妈妈带着一群孩子来到水边，扑通一声跳了下去。
        - id: ch01-b16
          speaker: mother_duck
          text: 嘎，嘎！都下来！
        - id: ch01-b17
          speaker: narrator
          text: 小鸭子们一个接一个跳进水里。水一下子没过他们的头顶，可转眼间，他们又全都浮了起来，游得漂亮极了。两只小脚在水下轻轻松松地划着，谁也不用教。那只丑小鸭也跟兄弟姐妹一起游，而且游得一点儿也不差。
        - id: ch01-b18
          speaker: mother_duck
          text: 哎呀，他不是火鸡！看他的腿划得多好，身子也挺得多直。他是我的亲生孩子。仔细瞧瞧，其实也没那么丑。嘎，嘎，都跟着我！我带你们去养鸭场，见识见识上等社会。一定跟紧，别让谁踩扁了。尤其要小心那只猫。
    - id: ch02
      title: 养鸭场里的日子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们来到养鸭场，那里正乱成一团。两家鸭子为了争一颗鳗鱼头，吵得不可开交。可争到最后，谁也没吃着，那颗头反倒让猫叼走了。鸭妈妈看着鳗鱼头没了，磨了磨自己的嘴。其实她也很想吃上一口。
        - id: ch02-b02
          speaker: mother_duck
          text: 孩子们，看到了吧，世道就是这样。来，走快些，让我看看你们懂不懂规矩。要向那边的老鸭好好行礼。她出身最高贵，身上有西班牙血统，所以过得很优裕。瞧见她腿上的红布条了吗？那是鸭子能得到的大荣誉。有了这个标记，人和牲畜都不会把她认错。脚尖别往里收，有教养的小鸭子要像爸爸妈妈那样，把脚往外撇。对，就是这样。现在弯下脖子，叫一声嘎。
        - id: ch02-b03
          speaker: narrator
          text: 小鸭子们照做了。别的鸭子却盯住他们。
        - id: ch02-b04
          speakers: [farm_duck_1, farm_duck_2, farm_duck_3]
          ensemble: chorus
          text: 怎么又来一窝？这里还不够挤吗？哎哟，那一只是什么怪模样？我们可不要他！
        - id: ch02-b05
          speaker: narrator
          text: 一只鸭子扑过来，在丑小鸭的脖子上啄了一口。
        - id: ch02-b06
          speaker: mother_duck
          text: 不许碰他！他又没做坏事。
        - id: ch02-b07
          speaker: spiteful_duck
          text: 可他又大又丑，非赶走不可。
        - id: ch02-b08
          speaker: noble_duck
          text: 别的孩子都挺秀气，偏偏这一只不行。真希望他妈妈能把他变得好看些。
        - id: ch02-b09
          speaker: mother_duck
          text: 夫人，这我可办不到。他是不好看，可性情很好，游水也不比谁差，说不定还更强。等他长大，也许会漂亮些，个头也会显得小些。他在蛋里待得太久，才没长周正。
        - id: ch02-b10
          speaker: narrator
          text: 她摸摸他的脖子，又替他理好羽毛。
        - id: ch02-b11
          speaker: mother_duck
          text: 再说，他是只公鸭，难看一点也没什么。我看他会长得很强壮，以后能照顾自己。
        - id: ch02-b12
          speaker: noble_duck
          text: 其他小鸭子倒很漂亮。你们就把这里当家吧。要是找到鳗鱼头，记得送给我。
        - id: ch02-b13
          speaker: narrator
          text: 他们就这样在养鸭场住了下来。别的小鸭子很快有了自己的位置，可最后出壳的丑小鸭却受尽欺负。鸭子见了他就咬他、推他、笑话他，连其他家禽也都拿他寻开心，仿佛谁都能来欺负他一下。
        - id: ch02-b14
          speakers: [farm_duck_1, farm_duck_2, farm_duck_3]
          ensemble: chorus
          text: 他的个头也太大了！
        - id: ch02-b15
          speaker: narrator
          text: 一只雄火鸡天生长着一对距，就把自己当成了真正的皇帝。他鼓起全身羽毛，像一艘张满帆的船，气势汹汹地冲向丑小鸭，脑袋也气得通红。可怜的小家伙躲都没处躲。他本来就为自己的模样难过，现在整个养鸭场又都在嘲笑他。日子一天天过去，情形不但没变，反而越来越糟。谁见了都赶他，连兄弟姐妹也不肯善待他。
        - id: ch02-b16
          speakers: [sibling_1, sibling_2]
          ensemble: duo
          text: 你这个丑东西，真希望猫把你叼走！
          emotion: disgusted
        - id: ch02-b17
          speaker: narrator
          text: 后来连母亲也说，巴不得从没生过他。鸭子啄他，鸡打他，喂家禽的姑娘还用脚踢他。他再也待不下去，终于逃走了。飞过栅栏的时候，他把藏在树篱里的小鸟都吓得四散飞起。
        - id: ch02-b18
          speaker: ugly_duckling
          text: 他们怕我，就因为我长得丑。
          emotion: sad
        - id: ch02-b19
          speaker: narrator
          text: 他闭上眼睛，继续往远处飞，直到一片辽阔的荒原。那里住着许多野鸭。他在荒原上过了一夜，疲倦又悲伤。
        - id: ch02-b20
          speakers: [wild_duck_1, wild_duck_2, wild_duck_3]
          ensemble: chorus
          text: 你到底是哪一种鸭子？
        - id: ch02-b21
          speaker: narrator
          text: 清晨，野鸭们发现了这位新伙伴，围着他问个不停。他只是低头行礼，客气得不能再客气，却没回答。
        - id: ch02-b22
          speakers: [wild_duck_1, wild_duck_2, wild_duck_3]
          ensemble: chorus
          text: 你可真够丑的。不过只要你不想娶我们家的姑娘，那就没关系。
        - id: ch02-b23
          speaker: narrator
          text: 可怜的小家伙根本没想过结婚。他只盼野鸭们让他躺在芦苇里，喝几口荒原上的水。住了两天，两只刚出壳不久、胆子却很大的小野雁来了。
        - id: ch02-b24
          speaker: young_goose
          text: 听着，朋友，你这么丑，我们倒挺喜欢。愿不愿意跟我们走，做一只候鸟？附近还有一片荒原，住着几只漂亮的野雁姑娘，全都没成家。你虽然丑，说不定运气好，正能娶到一个呢。
    - id: ch03
      title: 荒原和小屋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 砰！砰！空中突然响了两枪。刚才还在说话的两只小野雁倒进芦苇，当场死了，鲜血染红了水面。接着远处又传来砰砰的枪声，响声从四面八方回荡。一群群野雁从芦苇里惊飞起来。原来猎人已经包围了荒原，有些人甚至坐在树枝上，从高处俯看整片芦苇荡。枪口冒出的青烟像云一样升过幽暗的树林，又慢慢飘到水面上。许多猎犬冲进芦苇，到哪里，哪里的芦苇就纷纷倒下。
        - id: ch03-b02
          speaker: narrator
          text: 丑小鸭吓坏了，转过头，想把脑袋藏进翅膀。这时，一条可怕的大猎犬贴着他走过。狗张着嘴，舌头垂在外面，眼里闪着凶光。它把鼻子凑到小鸭子面前，露出尖牙，却又扑通扑通趟进水里，碰也没碰他。
        - id: ch03-b03
          speaker: ugly_duckling
          text: 啊，幸亏我这么丑，连狗都不肯咬我。
        - id: ch03-b04
          speaker: narrator
          text: 他一动不动地趴在那里。铅弹从芦苇间嗖嗖飞过，枪声一阵接一阵从他头顶越过。直到天色很晚，四周才安静。即使这样，小鸭子还是不敢动。他又安安静静等了好几个钟头，仔细看过周围，才拼命逃离荒原。他跑过一片片田地，又穿过牧场。忽然刮来一阵暴风，吹得他连一步也挪不动。
        - id: ch03-b05
          speaker: narrator
          text: 傍晚，他来到一间穷苦人家的小屋。屋子歪歪斜斜，眼看就要倒下，却像还没想好先往哪边倒，所以直到现在还站着。风暴还是那么猛，小鸭子实在走不动了，只好坐在屋边。他看见一只门铰链坏了，门没能关严。靠近地面的地方留着一道窄缝，恰好够他钻过去。他悄无声息地溜进屋，终于有了一处过夜的地方。屋里住着一个女人、一只公猫和一只母鸡。女人最宠公猫，叫他“小儿子”。他会弓起背，发出呜噜呜噜的声音。要是有人倒着摸他的毛，他甚至能从皮毛里迸出火星。母鸡的两条腿很短，所以叫“短腿小鸡”。她下的蛋很好，女人疼她，也像疼自己的孩子。
        - id: ch03-b06
          speaker: narrator
          text: 第二天早晨，他们发现了陌生客人。公猫呜噜，母鸡咯咯叫个不停。
        - id: ch03-b07
          speaker: old_woman
          text: 你们吵什么呀？
        - id: ch03-b08
          speaker: narrator
          text: 老妇人的眼神不太好，把小鸭子看成了一只迷路的肥鸭。
        - id: ch03-b09
          speaker: old_woman
          text: 哎呀，我可捡到宝了！但愿不是公鸭，那我就有鸭蛋吃了。先把他留下看看。
        - id: ch03-b10
          speaker: narrator
          text: 小鸭子获准试住三个星期，可一只蛋也没下。公猫是屋里的男主人，母鸡是女主人。他们总爱说“我们”和“世界”，因为他俩相信自己占了半个世界，而且还是更好的那一半。小鸭子觉得，别人也许不会同意，可母鸡听不得这种话。
        - id: ch03-b11
          speaker: hen
          text: 你会下蛋吗？
        - id: ch03-b12
          speaker: ugly_duckling
          text: 不会。
        - id: ch03-b13
          speaker: hen
          text: 那就请你闭嘴。
        - id: ch03-b14
          speaker: cat
          text: 你会弓起背呜噜，或者从毛里迸出火星吗？
        - id: ch03-b15
          speaker: ugly_duckling
          text: 不会。
        - id: ch03-b16
          speaker: cat
          text: 那聪明人说话时，就轮不到你发表意见。
        - id: ch03-b17
          speaker: narrator
          text: 小鸭子只好坐在墙角，心里很低落。后来，阳光和清新的空气从敞开的门口涌进来。他忽然特别想下水游一游，忍不住告诉了母鸡。
        - id: ch03-b18
          speaker: hen
          text: 这念头真荒唐。你是没事可做，才会胡思乱想。要是你会呜噜，或者会下蛋，就不会冒出这些怪念头了。
        - id: ch03-b19
          speaker: ugly_duckling
          text: 可在水上游来游去多快活呀。潜到水底，让水漫过头顶，也舒服极了。
          emotion: happy
        - id: ch03-b20
          speaker: hen
          text: 这也叫快活？你准是疯了！去问问猫吧，他是我认识的动物里最聪明的。看他喜不喜欢游水，喜不喜欢潜到水底。我自己的看法都不用说。你也可以问问女主人，全世界没有谁比她更聪明。你以为她愿意让水没过头顶吗？
        - id: ch03-b21
          speaker: ugly_duckling
          text: 你们根本不懂我。
          emotion: sad
        - id: ch03-b22
          speaker: hen
          text: 我们不懂你？那谁能懂你？难道你比猫和老妇人还聪明？我还没把自己算进去呢。孩子，别再想这些蠢事。我们肯收留你，是你的福气。你有暖屋子住，还有聪明的伙伴教你，难道还不够？可你话太多，跟你相处真不愉快。我说的虽然不好听，却都是为你好，这才算真正的朋友。听我的，赶快学会下蛋，也学会呜噜。
        - id: ch03-b23
          speaker: ugly_duckling
          text: 看来我还是得回到外面去。
        - id: ch03-b24
          speaker: hen
          text: 对，快走吧。
        - id: ch03-b25
          speaker: narrator
          text: 小鸭子就这样离开了小屋。他很快找到一片水，终于又能在水面上游来游去，也能一头潜进水底。可别的动物一看见他的模样，就都嫌他丑，谁也不肯接近他。
    - id: ch04
      title: 漫长的冬天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 秋天到了，森林里的叶子变成橙黄和金黄。冬天一步步逼近。寒风卷起落叶，把它们高高抛进冰冷的空中。满载冰雹和雪花的云层低低压在天上。一只乌鸦站在蕨丛里，拉长声音哇哇地叫。只要看它一眼，就叫人冷得发抖。眼前这一切，都让可怜的小鸭子难过极了。
        - id: ch04-b02
          speaker: narrator
          text: 一天傍晚，太阳刚从灿烂的云霞间落下，一大群美丽的鸟从灌木丛里飞了出来。小鸭子从没见过这样的鸟。他们是天鹅，弯着优美的长颈，柔软的羽毛闪着耀眼的白光。他们发出一种奇异的鸣叫，展开宽大而壮丽的翅膀，离开这片越来越寒冷的地方。他们要飞过辽阔的大海，前往温暖的国度。
        - id: ch04-b03
          speaker: narrator
          text: 天鹅越飞越高。丑小鸭一直仰头望着，心里涌起一种从未有过的感觉。他在水里像车轮一样团团转，又朝他们伸长脖子，发出一声奇怪的呼喊，连自己也吓了一跳。他怎么能忘记这些美丽又幸福的鸟？直到他们完全消失在眼前，他才一头潜进水里。再浮上来时，他激动得几乎失去理智。他不知道这些鸟叫什么，也不知道他们飞去了哪里，却从没这样爱过世上的任何一种鸟。他没有嫉妒这些美丽的生命，只是渴望自己也能变得那么美。可怜的丑东西，只要那些鸭子肯给他一点好脸色，他甚至愿意永远和他们一起生活。
        - id: ch04-b04
          speaker: narrator
          text: 冬天越来越冷。为了不让水面结冰，小鸭子只能不停游动。每到夜里，能游的地方就更小一点。最后，冰冻得太厉害，他每动一下，身边就咯吱作响。他拼命划着腿，不让最后一点水面封住。可他终于没了力气，一动不动地躺着，和冰冻在一起。
        - id: ch04-b05
          speaker: narrator
          text: 第二天一大早，一个农夫正好从旁边经过，看见小鸭子和冰冻在了一起。他用木鞋把四周的冰踩碎，把小鸭子抱回家，交给妻子照料。屋里的暖意渐渐让可怜的小家伙醒了过来。孩子们想跟他玩，他却以为大家要伤害他，吓得猛然跳进牛奶盆，牛奶溅得满屋都是。女人一拍手，他更害怕了。他先飞进黄油桶，又一头扎进面粉箱，浑身沾满东西以后再从里面冲出来。女人尖声叫着，举起火钳要打他。孩子们又笑又喊，争着来抓他，结果你撞我，我撞你，一个个摔作一团。
        - id: ch04-b06
          speaker: narrator
          text: 幸好房门正开着，小鸭子总算从这一片混乱里逃了出去。他勉强钻过屋外的灌木丛，已经精疲力竭，只能倒在刚下的新雪里。后来，他还在严冬中受了许多苦，也经历了许多困乏。要把那些事全讲出来，实在太让人伤心了。不过，漫长的冬天终于过去了。
    - id: ch05
      title: 美丽的白天鹅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一天早晨，小鸭子发现自己躺在荒原的芦苇丛中。阳光暖暖地照着他，云雀正在高处歌唱，四周的一切都显出明媚的春光。这只年轻的鸟儿试着拍动翅膀。翅膀碰着身体两侧时，他发现它们已经变得十分有力。他一下飞上了高空，还没弄明白是怎么回事，强健的双翼已经带着他不断向前，来到一座美丽的大花园。
        - id: ch05-b02
          speaker: narrator
          text: 苹果树开满了花，芬芳的接骨木垂着长长的绿枝，枝条伸向一条清亮的溪流。溪水绕着平整的草坪弯弯流过。早春的清新气息笼罩着一切，美得难以形容。附近的树丛里游出三只美丽的白天鹅。他们抖动羽毛，轻盈地滑过平静的水面。小鸭子一眼认出了这些可爱的鸟，心里忽然涌起从未有过的悲哀。
        - id: ch05-b03
          speaker: ugly_duckling
          text: 我要飞向那些高贵的鸟。他们会杀死我，因为我这么丑，竟敢靠近他们。可那又有什么关系？死在他们手里，也好过被鸭子啄、被母鸡打、被喂家禽的姑娘推来搡去，或者在冬天饿死。
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 他飞进水里，向美丽的天鹅游去。天鹅一发现这个陌生来客，立刻张开翅膀，朝他冲来。
        - id: ch05-b05
          speaker: ugly_duckling
          text: 杀了我吧。
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: 可怜的鸟儿把头低到水面，静静等着死亡。可是，他在清澈的溪水里看见了什么？那是他自己的影子！水里再也不是一只暗灰色、丑陋难看的鸟，而是一只姿态优美的天鹅。一只鸟只要从天鹅蛋里孵出来，就算出生在养鸭场的鸭窝里，又有什么关系？现在，他甚至庆幸自己经历过那么多悲伤和磨难。因为有过那些日子，他才更能体会围绕在身边的喜悦和幸福。几只大天鹅围着这位新伙伴游来游去，用嘴轻轻抚摸他的脖子，欢迎他的到来。
        - id: ch05-b07
          speaker: narrator
          text: 不久，几个孩子走进花园，把面包和糕点扔进水里。
        - id: ch05-b08
          speaker: youngest_child
          text: 快看，又来了一只新天鹅！
          emotion: surprised
        - id: ch05-b09
          speaker: narrator
          text: 其他孩子听见了，也全都高兴极了。他们一边蹦跳，一边拍手，又跑到爸爸妈妈身边，急着把这个新发现告诉大人。
        - id: ch05-b10
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 又来了一只天鹅！来了一只新的！
          emotion: happy
        - id: ch05-b11
          speaker: narrator
          text: 他们往水里投了更多面包和糕点。
        - id: ch05-b12
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 新来的这只最漂亮！他这么年轻，又这么好看。
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: 听见孩子们这样夸奖，老天鹅们也游到他身边，向他低下了头。可他反倒害羞起来，把头藏进翅膀底下，完全不知道该怎么办。他实在太幸福了，却一点儿也没有骄傲。从前，他因为长得丑，受尽了迫害和轻蔑。如今，大家却说他是所有鸟儿中最美的一只。连接骨木也把长枝条垂到水面，像在他面前低下了头。阳光温暖又明亮地照着他。他抖开羽毛，弯起修长的脖子，从心底发出欢乐的呼喊。
        - id: ch05-b14
          speaker: ugly_duckling
          text: 我还是一只丑小鸭的时候，从来没梦想过会有这样的幸福！
          emotion: happy
