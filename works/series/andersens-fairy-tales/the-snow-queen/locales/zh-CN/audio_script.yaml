  chapters:
    - id: ch01
      title: 第一篇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一篇讲一面镜子，还有镜子摔碎以后，那些残片惹出的祸。故事开头的事，你可要听仔细。等听到结尾，就会知道一个邪恶的精怪到底做了什么。他是坏蛋里最坏的一个，因为他本来就是个魔鬼。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，魔鬼兴致很好，造了一面有魔力的镜子。美好善良的东西一照进去，几乎就缩得看不见了。丑恶无用的东西却被放得很大，显得更加不堪。最可爱的风景会变成一盘煮烂的菠菜。人的脸扭曲得认不出来，身子像是倒过来以后消失了。脸上哪怕只有一颗雀斑，镜里也会铺满整个鼻子和嘴巴。
        - id: ch01-b03
          speaker: narrator
          text: 谁心里才有一个善良虔诚的念头，镜子马上就把它变得荒唐可笑。魔鬼每次看到，都要为自己的发明笑个不停。他还开了一所学校。学生们抬着镜子到处走，吹嘘说，人们直到今天才第一次看清世界和人类的真模样。后来，世上没有哪个国家、哪个民族没被这面镜子照过。
        - id: ch01-b04
          speaker: narrator
          text: 那些学生还想飞上天，用镜子去照天使。可他们飞得越高，镜面越滑，最后再也抓不住。镜子直落到地上，摔成了千百万块。这一下，反而带来更多不幸。
        - id: ch01-b05
          speaker: narrator
          text: 有些碎片比沙粒还小，随着风飘遍世界，飞进每一个国家。这样一粒微尘落进人的眼睛，就会悄悄嵌在那里。那个人自己也不知道。从此，他眼中的一切全都走了样。不论看什么，他都只看得见最坏的一面，因为碎片再小，也保留着整面魔镜的力量。还有少数人的心里扎进了碎片，那才真正可怕。他们的心会一点点冷下去，最后冷得像一块冰。
        - id: ch01-b06
          speaker: narrator
          text: 大一点的碎片能拿来镶窗户。隔着这样的玻璃看朋友，该多么悲哀。另一些碎片被磨成眼镜，戴上以后，人再也不能正确公正地看事情。魔鬼看见自己闯下这些祸，笑得全身发颤。直到今天，空中还有许多细小的镜片在飘。下面要讲的，就是其中一片惹出的故事。
    - id: ch02
      title: 第二篇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这一篇讲一个小男孩和一个小女孩。大城里挤满房屋和人，没有地方造小花园，大家只能在花盆里种几朵花。城里有两个穷孩子，他们不是兄妹，却亲得胜过兄妹。男孩叫凯，女孩叫格尔达。
        - id: ch02-b02
          speaker: narrator
          text: 两家的父母住在相对的阁楼里。邻屋的屋顶朝彼此伸过去，中间横着一根排水管。两边各有一扇小窗，只要跨过天沟，就能从这扇窗走到那扇窗。两家各有一只大木箱，里面种着平常吃的香草，也各有一小丛长得很茂盛的玫瑰。后来，大人把两只木箱都架到排水管上。一只从这边窗下伸过去，一只从那边窗下伸过来，看起来像两道花堤。香豌豆从箱沿垂下，玫瑰抽出长枝，沿着两边窗框往上爬，在中间簇拥着连起来，织出一道花叶拱门。木箱架得很高，孩子们知道，没有大人准许，绝不能自己爬上去。不过大人常常让他们一同跨出窗子，坐在玫瑰丛下各自的小凳上，安安静静地玩。
        - id: ch02-b03
          speaker: narrator
          text: 冬天来了，玻璃窗常常冻得严严实实。孩子们把铜币放在炉子上烤热，再把热铜币贴到结冰的窗玻璃上。不一会儿，冰上就融出一个圆圆的小洞。凯和格尔达从两边的洞口望着对方，两双温柔明亮的眼睛也跟着闪闪发光。夏天，他们只要从窗口一跨就能相聚。冬天却得先走下很长很长的楼梯，踏过屋外的积雪，再登上很长很长的楼梯，才能见到彼此。
        - id: ch02-b04
          speaker: grandmother
          text: 瞧，白蜜蜂一群群飞来了。
        - id: ch02-b05
          speaker: kay
          text: 白蜜蜂也有蜂王吗？真的蜜蜂都有蜂王呀。
        - id: ch02-b06
          speaker: grandmother
          text: 当然有。雪下得最密的地方，就是她飞过的地方。她比所有白蜜蜂都大，从来不落地，总会飞回乌黑的云层。半夜里，她常飞过城里的街道，往一扇扇窗里看。窗玻璃上的冰就结出奇妙的花纹，有的像花，有的像城堡。
        - id: ch02-b07
          speaker: kay
          text: 对，我们见过。
        - id: ch02-b08
          speaker: gerda
          text: 我们见过，祖母说的一定是真的。冰雪女王会进到这里来吗？
        - id: ch02-b09
          speaker: kay
          text: 让她来好了。我把她放到炉子上，她马上就会融掉。
        - id: ch02-b10
          speaker: narrator
          text: 祖母替他抚平头发，又讲了几个故事。一天晚上，凯待在家里，衣服才脱了一半，就爬上窗边的椅子，从冰洞往外看。雪花零零落落地飘着，其中一片落在花箱边，比别的都大。它越长越大，最后变成了一个女人。
        - id: ch02-b11
          speaker: narrator
          text: 她身上披着一件白纱织成的长衣。远远看去，那衣服仿佛是由千百万颗闪着星光的雪花连在一起。她的容貌非常美，全身却都是冰。那是光亮耀眼、晶莹闪烁的冰。可是她并不是一座雕像，她是活的。她的双眼像两颗明亮的星星，目光里面却没有一点安宁，也没有片刻休憩。她向窗边的凯点了点头，又伸手招呼他过去。凯吓得一下子从椅子上跳下来。就在这个时候，窗外仿佛有一只很大的鸟飞了过去。
        - id: ch02-b12
          speaker: narrator
          text: 第二天仍然天寒地冻，天空却十分晴朗。过了不久，春天终于来了。阳光照耀着整座城市，嫩绿的新叶一片片绽开，燕子也在屋檐下筑起巢来。人们推开关了一个冬天的窗户。凯和格尔达又能从各自的窗口跨出去，坐进他们的屋顶小花园。那个花园高高悬在楼下所有房间的上方。到了夏天，两只木箱里的玫瑰开得特别美，一朵接着一朵，仿佛永远也开不完。格尔达学会了一首赞美诗，歌词里正好唱到玫瑰。她一想到这首歌，就会想到自家的花。于是她唱给凯听，凯也跟着她一起唱起来。
        - id: ch02-b13
          speaker: gerda
          text: |-
            玫瑰盛开终会凋零，
            我们终将见到圣婴。
        - id: ch02-b14
          speaker: kay
          text: |-
            玫瑰盛开终会凋零，
            我们终将见到圣婴。
        - id: ch02-b15
          speaker: narrator
          text: 两个孩子手牵着手，一起亲吻身边的玫瑰。他们又抬头望着灿烂的阳光，对着那片光辉说话，仿佛圣婴就在那里。那些夏日真是美好。孩子们坐在清新漂亮的玫瑰丛中，花朵仿佛永远也不会开完。一天，凯和格尔达又坐在一起，翻看一本画满飞禽走兽的书。教堂塔楼上的钟刚刚敲过十二下，凯忽然叫了起来。
        - id: ch02-b16
          speaker: kay
          text: 哎呀，有东西扎进我心里了！我的眼睛里也进了什么东西。
          emotion: surprised
        - id: ch02-b17
          speaker: narrator
          text: 格尔达搂住他的脖子，仔细看了看，却什么也找不到。
        - id: ch02-b18
          speaker: kay
          text: 大概已经掉出来了。
        - id: ch02-b19
          speaker: narrator
          text: 其实碎片没有出来。那正是魔镜的碎屑。它让伟大美好的东西变得渺小丑陋，让邪恶的事格外显眼，连一点瑕疵也不放过。凯的心里也落进一粒碎屑，很快就成了一块冰。他已经不疼了，可玻璃还留在里面。
        - id: ch02-b20
          speaker: kay
          text: 你干吗哭？哭起来真难看。我一点事也没有。你看那朵玫瑰，被虫子蛀了。旁边那朵还歪成那样。它们都很丑，和这些木箱一样难看。
        - id: ch02-b21
          speaker: narrator
          text: 凯踢了木箱一脚，又扯下两朵玫瑰。
        - id: ch02-b22
          speaker: gerda
          text: 凯，你这是干什么呀！
          emotion: surprised
        - id: ch02-b23
          speaker: narrator
          text: 见她吓成这样，凯偏又揪下一朵花，跳回自己家，把格尔达独自留在外面。
        - id: ch02-b24
          speaker: narrator
          text: 后来，格尔达再拿出那本图画书，凯却嘲笑她，说只有穿着长袍的奶娃娃才看这种东西。祖母讲故事时，他总要找机会说一句“可是”，把她打断。有时候，他还溜到祖母的椅背后面，架上一副眼镜，把祖母的神态和声音学得像模像样，逗得大家哈哈大笑。慢慢地，他又学会模仿街上的人。谁说话有点古怪，谁走路的样子不大好看，他立刻就能学出来。人们看了都说，这孩子将来一定非常聪明，他真有一种了不起的天分。可凯之所以变成这样，是因为眼睛里嵌着玻璃，心里又结了冰。就连一心爱着他的格尔达，他也要故意捉弄。他玩的游戏也彻底变了，再也不像小孩子的玩意儿。
        - id: ch02-b25
          speaker: narrator
          text: 一个下雪的冬日，凯拿来放大镜，把蓝外套的衣摆扯平，让雪花落在上面。
        - id: ch02-b26
          speaker: kay
          text: 格尔达，快从镜子里看。
        - id: ch02-b27
          speaker: narrator
          text: 每一片雪花都被放得很大，有的像美丽的花，有的像闪耀的星。
        - id: ch02-b28
          speaker: kay
          text: 多精巧啊。这比真花有意思多了。雪花一点毛病都没有。只要还没融化，每一片都完美得很。
        - id: ch02-b29
          speaker: narrator
          text: 不久，凯戴着厚手套，背着雪橇，又来找格尔达。
        - id: ch02-b30
          speaker: kay
          text: 我要去大广场。别的男孩都在那里玩雪橇。
        - id: ch02-b31
          speaker: narrator
          text: 大广场上，胆子最大的男孩常把自己的小雪橇系在乡下人的大车后面，让大车拖着他们滑出去很远。那是他们觉得最好玩的事。大家正玩得兴高采烈，凯也在里面。一架很大的雪橇忽然驶过来。雪橇漆得雪白，里面坐着一个人，头戴白帽，全身裹在粗糙的白毛皮里。大雪橇绕着广场转了两圈。凯看见以后，也把自己的小雪橇系到它后面。大雪橇一动，他就跟着滑了出去。
        - id: ch02-b32
          speaker: narrator
          text: 大雪橇越来越快，穿过街道。驾车人回头亲切地点头，像是早就认识凯。凯每次想解开绳子，那人就再点一次头，他只好继续坐着，直到出了城门。雪越下越密，一手掌外都看不见，他们还是往前飞驰。凯猛地放开绳索，可小雪橇牢牢粘在后面，怎么也甩不掉。
        - id: ch02-b33
          speaker: narrator
          text: 凯大声呼喊，没人听见。雪打在他身上，雪橇像风一样飞奔，不时高高颠起，仿佛越过了篱笆和沟渠。他怕极了，想念祷词，脑子里却只剩下乘法表。
        - id: ch02-b34
          speaker: narrator
          text: 雪花越长越大，看起来像一群巨大的白鸡。它们突然向两边跳开，大雪橇停了。驾车人站起身，帽子和毛皮原来都是雪做的，一起落了下来。凯看见一个高挑雪白的女人。正是冰雪女王。
        - id: ch02-b35
          speaker: snow_queen
          text: 这一程跑得真痛快。你为什么一直发抖？来吧，钻进我暖和的毛皮里。
        - id: ch02-b36
          speaker: narrator
          text: 她让凯坐到身边，用毛皮裹住他。凯觉得自己像是不断往雪堆深处沉。
        - id: ch02-b37
          speaker: snow_queen
          text: 现在还冷吗？
        - id: ch02-b38
          speaker: narrator
          text: 她吻了吻凯的额头。那一吻比冰还冷，一直冷进他那颗几乎冻成冰的心。他觉得自己就要死了。可只过了一会儿，他又安然无恙，连四周的寒冷也感觉不到了。
        - id: ch02-b39
          speaker: kay
          text: 我的雪橇！千万别把我的雪橇忘了！
          emotion: fearful
        - id: ch02-b40
          speaker: narrator
          text: 他转头一看，小雪橇牢牢系在一只白鸡身上。白鸡驮着它，跟在后面飞。冰雪女王又吻了凯一下。这一次，他忘了格尔达，忘了祖母，也忘了家里所有的人。
        - id: ch02-b41
          speaker: snow_queen
          text: 不能再吻你了。再吻下去，我会把你吻死。
        - id: ch02-b42
          speaker: narrator
          text: 凯抬头望着冰雪女王，只觉得她美得惊人。他怎么想，也想不出世上还有哪一张脸，会比她更加秀美、更加聪慧。她已经不像从前站在窗口外面时那样，仿佛全身都是冰做的了。在凯现在的眼睛里，她没有任何缺点，简直完美无瑕。凯一点也不再害怕。他急着告诉冰雪女王，自己会在心里算数，连分数也会算。他还知道这个国家有多少平方英里，住着多少人。冰雪女王听完，只是一直对他微笑。凯看见她的笑容，便以为自己知道的这些事情还远远不够。
        - id: ch02-b43
          speaker: narrator
          text: 冰雪女王向无边无际的天地望去，带着凯坐上一朵黑云，越飞越高。暴风在他们身边呼啸怒号，听起来像是在唱一首古老的歌。他们飞过一片又一片森林，飞过湖泊，也飞过海洋和大片陆地。脚下的狂风不停咆哮，群狼对着天空嗥叫，积雪在严寒中噼啪作响。乌鸦尖叫着从他们上方掠过。再高一些的天幕上，一轮月亮清澈又明亮。小凯就这样度过了漫长的冬夜。等白天到来，他便睡在冰雪女王的脚边。
    - id: ch03
      title: 第三篇
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这一篇讲会施魔法的女人的花园。凯不在以后，格尔达过得怎么样呢？没有人知道他去了哪里。男孩子们只看见他把小雪橇系在一架大雪橇后面，跟着出了城门。大家为他流了许多泪。格尔达哭了很久，认定凯已经死了，淹在学校附近的河里。那些冬日漫长、阴沉，实在难熬。终于，春天到了，太阳也暖了。
        - id: ch03-b02
          speaker: gerda
          text: 凯已经死了，再也不会回来了。
          emotion: sad
        - id: ch03-b03
          speaker: sun
          text: 我不相信。
        - id: ch03-b04
          speaker: gerda
          text: 凯已经死了，再也不会回来了。
          emotion: sad
        - id: ch03-b05
          speaker: sparrows
          text: 我们不相信。
        - id: ch03-b06
          speaker: narrator
          text: 到后来，格尔达自己也不信了。一天清早，她决定穿上那双凯还没见过的新红鞋，到河边问他的下落。她吻过熟睡的祖母，独自走出城门。
        - id: ch03-b07
          speaker: gerda
          text: 是你带走了我的小伙伴吗？只要把凯还给我，我就把红鞋送给你。
        - id: ch03-b08
          speaker: narrator
          text: 波浪古怪地点着头。格尔达脱下最心爱的红鞋，把两只一起抛进河里。鞋落得太近，小浪又把它们送回岸边。河流还不了凯，似乎也不肯收走她最珍爱的东西。格尔达却以为自己扔得不够远，便爬进芦苇丛里的一条小船，从船尾再把鞋抛出去。
        - id: ch03-b09
          speaker: narrator
          text: 小船没有系住，随着她的动作离开了岸。格尔达急忙往船头跑，可船已经漂出一米多远，而且越来越快。她害怕得大哭。只有麻雀听见，却不能把她带回去，只能沿岸跟着飞。
        - id: ch03-b10
          speaker: sparrows
          text: 我们在这儿！我们在这儿！
        - id: ch03-b11
          speaker: narrator
          text: 格尔达只穿着袜子，一动不动地坐在小船里。那双红鞋漂在后面，可船走得太快，她无论怎样也够不着。河流两岸美极了。鲜花正在开放，老树投下浓密的阴影，绿色斜坡上有牛和羊低头吃草。可是四周一个人也看不见。格尔达想，也许河水并不是要伤害她，说不定它正要把她带到凯那里去。这个念头让她稍微快活了一些。她抬起头，望着两岸一片片美丽的绿野，任小船继续顺着河水向前漂。
        - id: ch03-b12
          speaker: narrator
          text: 几个钟头以后，小船漂到一大片樱桃园前。园里有一座红屋子，红蓝相间的窗玻璃很奇特，屋顶铺着茅草。门外两个木头士兵举枪向她致敬。格尔达以为他们是活人，叫了几声，他们当然不回答。船再靠近，她才看清楚，便喊得更响。
        - id: ch03-b13
          speaker: narrator
          text: 一个很老的女人拄着拐杖走出来。她戴着宽大的遮阳帽，帽子上画满美丽的花。
        - id: ch03-b14
          speaker: old_woman
          text: 可怜的小姑娘，河水这么急，你怎么一个人漂到这么远的地方来了？
        - id: ch03-b15
          speaker: narrator
          text: 老妇人走进水里，用拐杖勾住船，把格尔达拉上岸。格尔达重新踩到地面，非常高兴，可心里还有点怕这个陌生人。
        - id: ch03-b16
          speaker: old_woman
          text: 来，告诉我你是谁，又是怎么来到这里的。
        - id: ch03-b17
          speaker: narrator
          text: 格尔达从头讲起，把发生过的事全告诉老妇人。老妇人一边听，一边摇头，嘴里还不停地嗯嗯应着。等格尔达终于说完，她立刻问老妇人，有没有在这里见过凯。老妇人回答，凯没有从这里经过，不过他很可能很快就会来了。她叫格尔达不要再伤心，只管尝尝园里的樱桃，再好好看看那些花。这里的花比任何一本图画书里的花都好看，因为每一朵花都会讲出自己的故事。说着，她牵起格尔达的手，带她走进小屋，又随手把门关上了。
        - id: ch03-b18
          speaker: narrator
          text: 老妇人牵她进屋，关上了门。高高的窗子有红、蓝、黄三种玻璃，日光映出奇异的颜色。桌上的樱桃任她吃。老妇人拿金梳子替她梳开亚麻色的长卷发。
        - id: ch03-b19
          speaker: old_woman
          text: 我早就盼着有一个像你这样可爱的小姑娘。你留下来吧，看看我们两个会过得多快活。
        - id: ch03-b20
          speaker: narrator
          text: 梳子一遍遍梳过，格尔达想起凯的次数越来越少。原来老妇人会施魔法。她并不坏，只是偶尔用魔法让自己开心。这回，她想留下格尔达。她走进花园，把拐杖伸向每一丛玫瑰。开得正盛的玫瑰立刻沉入黑土，一点痕迹也没留下。她怕格尔达看见玫瑰，会想起家里的花，接着想起凯，然后逃走。
        - id: ch03-b21
          speaker: narrator
          text: 老妇人把格尔达带进花园。那里到处都是香气，也到处都是美丽的颜色。一年四季里能想到的花，全都在同一时候开放。任何一本图画书里，也找不到这样鲜艳、这样丰富的颜色。格尔达高兴得跳起来，在花丛间不停地玩，一直玩到太阳落到高高的樱桃树后面。到了晚上，她睡在一张精美的小床上，头下枕着红绸枕头，上面绣着彩色的紫罗兰。她做的梦，也像女王新婚那一天的梦一样甜美。第二天，她又在温暖的阳光下和花儿玩。再往后的许多天，也是这样。她渐渐认得了每一种花，每一朵都很熟悉。
        - id: ch03-b22
          speaker: narrator
          text: 她认得所有的花，却总觉得少了一种，又想不起是什么。一天，她望着老妇人的帽子，发现上面最美的花正是玫瑰。老妇人让花园里的玫瑰沉下去时，偏偏忘了帽子上的这一朵。一个小疏忽，就让整个安排落了空。
        - id: ch03-b23
          speaker: gerda
          text: 咦，这里怎么一朵玫瑰也没有？
          emotion: surprised
        - id: ch03-b24
          speaker: narrator
          text: 她跑遍花坛，怎么找也找不到，只好坐下来哭。泪水正落在玫瑰沉下去的地方。温热的眼泪润湿泥土，玫瑰马上钻出地面，开得和从前一样茂盛。格尔达抱住花朵亲吻，想起家里的玫瑰，也想起了凯。
        - id: ch03-b25
          speaker: gerda
          text: 唉，我耽搁了这么久！我原来是要去找凯的。你们知道他在哪儿吗？他是不是已经死了？
          emotion: sad
        - id: ch03-b26
          speaker: roses
          text: 不，他没有死。我们在地下待过，所有死去的人都在那里，可凯不在那里。
        - id: ch03-b27
          speaker: gerda
          text: 谢谢你们。别的花儿，你们知道凯在哪里吗？
        - id: ch03-b28
          speaker: narrator
          text: 每朵花都站在阳光下，只梦见自己的小故事，没有一朵知道凯的消息。格尔达挨个问过去，听到了许多故事。
        - id: ch03-b29
          speaker: tiger_lily
          text: 听见鼓声了吗？咚，咚，永远只有这两个音。女人们在哀歌，祭司在呼喊。一个穿红袍的印度寡妇站在火葬柴堆旁，伏在死去的丈夫身上。火从四周升起来，可她想着人群里活着的儿子。正是他点燃了火。那双明亮的眼睛，比即将烧毁她身体的火更刺痛她的心。柴堆上的火，能熄掉她心里的火吗？
        - id: ch03-b30
          speaker: gerda
          text: 我一点也听不懂。
        - id: ch03-b31
          speaker: tiger_lily
          text: 这就是我的故事。
        - id: ch03-b32
          speaker: bindweed
          text: 一条窄路旁有座古老的骑士城堡。常春藤盖满残墙，一直爬到阳台。一个美丽的姑娘靠着栏杆，望向路上。玫瑰不如她鲜艳，风中的苹果花也不如她轻盈。她的绸裙窸窣作响。她在问，那个人怎么还不来？
        - id: ch03-b33
          speaker: gerda
          text: 你说的那个人是凯吗？
        - id: ch03-b34
          speaker: bindweed
          text: 我说的只是梦里的故事。
        - id: ch03-b35
          speaker: snowdrop
          text: 两棵树之间吊着秋千。两个漂亮的小姑娘穿着白裙，帽上的绿丝带随风飘。哥哥站在秋千上，一手挽住绳子，一手拿着烟斗和小碗吹肥皂泡。秋千越荡越高，彩色的泡泡也飞上天。最后一个泡泡挂在烟斗碗上摇晃。一只轻得像泡泡的小黑狗跑来，后腿站起，想让人抱它上去。秋千没停，小狗摔倒了，汪汪发脾气。孩子们俯下身，泡泡也破了。一块来回摇荡的木板，一幅由泡沫画出的轻盈图景，这就是我的故事。
        - id: ch03-b36
          speaker: gerda
          text: 也许是个美丽的故事，可你讲得太悲伤，而且一句也没有提凯。
        - id: ch03-b37
          speaker: hyacinth
          text: 从前有三姐妹，一个穿红衣，一个穿蓝衣，一个穿白衣。月光下，她们牵着手在静静的湖边跳舞。她们是人，不是花仙。香气把她们引进树林，她们消失了，香气却越来越浓。三口棺材从森林深处滑出来，漂过湖面，姑娘们躺在里面。萤火虫在上方飞，像一盏盏小火炬。她们是睡着了，还是死了？花香说，她们已经死去。晚钟正为她们敲响。
        - id: ch03-b38
          speaker: gerda
          text: 你让我难过极了。你的香气让我总想起死去的姑娘。难道凯真的死了吗？可玫瑰去过地下，它们说没有。
          emotion: sad
        - id: ch03-b39
          speaker: hyacinth
          text: 叮当，叮当。我们的丧钟不是为凯敲的。我们不认识他，只会唱自己的歌。
        - id: ch03-b40
          speaker: narrator
          text: 格尔达走向鲜绿叶子间的金凤花。
        - id: ch03-b41
          speaker: gerda
          text: 你们像一颗颗明亮的小太阳。请告诉我，要到哪里去找我的小伙伴？
        - id: ch03-b42
          speaker: buttercup
          text: 春天第一个暖和的日子，阳光照进一座小院，也照着邻家的白墙。墙边开出今年最早的黄花。一位老妇人坐在门前，她那贫穷又漂亮的外孙女趁着一点空闲来看她。姑娘亲吻祖母时，到处都有了金子。她有一颗金子般的心。那是金色的早晨，阳光和低低的花叶上都有金子，姑娘的嘴唇上也有金子。这就是我的故事。
        - id: ch03-b43
          speaker: gerda
          text: 我可怜的祖母！她一定盼着我，正像从前盼着凯一样伤心。不过我很快会回去，还会带着凯。这些花只知道自己的歌，再问也没用了。
        - id: ch03-b44
          speaker: narrator
          text: 格尔达提起裙子想快点跑，却被一株水仙勾住了腿。她停下来，把脸凑近高高的黄花。
        - id: ch03-b45
          speaker: gerda
          text: 也许你知道些什么？
        - id: ch03-b46
          speaker: narcissus
          text: 我看见我自己了！我的香气多甜啊！楼上弓形窗的小屋里，有个衣服穿到一半的小舞女。她单腿站一会儿，又双脚落地，像要把全世界踩在脚下。其实她只是一个幻影。她从茶壶里倒水，浇在手里的紧身衣上，还说爱干净是好事。白裙也用茶壶水洗过，正在屋顶晾。她穿上裙子，再系一条藏红花色手帕，裙子就更白了。看她把腿伸得多直，简直像站在花梗上炫耀。我看见我自己了！
        - id: ch03-b47
          speaker: gerda
          text: 这跟我有什么关系？别再用这些话烦我了。
        - id: ch03-b48
          speaker: narrator
          text: 她不再听水仙说下去，转身跑向花园的另一头。那里的门锁着。她用尽力气推那根生锈的门闩，门闩终于松开，门一下子弹开了。格尔达赤着脚，从花园跑进广阔的世界。她一路向前，忍不住回头看了三次，可后面没有人追来。她还是不停地跑，跑得越来越远。最后，她实在没有力气了，才在一块大石头上坐下歇息。
        - id: ch03-b49
          speaker: narrator
          text: 这时她才发现，夏天早已过去，深秋已经来了。魔法花园里总有阳光，四季的花一起开放，她竟一点也不知道。
        - id: ch03-b50
          speaker: gerda
          text: 唉，我白白耽误了这么久！已经是秋天了，我不能再休息。
        - id: ch03-b51
          speaker: narrator
          text: 格尔达从石头上站起来，准备继续赶路。可是她那双小脚早已磨破，又痛又肿，每走一步都很难受。四周的一切也变得寒冷又荒凉。柳树长长的叶子已经全黄了。露珠像水滴一样往下落，枯叶也一片接着一片，从枝头飘到地上。只有黑刺李还结着果子。格尔达尝了一点，那果实又酸又涩，吃得人牙根发紧。她独自站在那里，只觉得整个世界都变得阴暗、疲惫，再也没有魔法花园里的温暖和光亮。
    - id: ch04
      title: 第四篇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这一篇讲王子和公主。格尔达不得不停下来，再休息一会儿。对面有只大乌鸦踩着雪，一跳一跳地过来。它看了格尔达很久，才摇摇头，尽量把话说清楚，因为它想对小姑娘和气一点。
        - id: ch04-b02
          speaker: raven
          text: 嘎，嘎。你好，你好。你为什么孤零零一个人，走在这么大的世界上？
        - id: ch04-b03
          speaker: narrator
          text: 格尔达太懂得“孤零零”是什么滋味了。她讲了自己的身世和一路遭遇，又问乌鸦有没有见过凯。乌鸦郑重地点头。
        - id: ch04-b04
          speaker: raven
          text: 也许见过。说不定就是他。
        - id: ch04-b05
          speaker: gerda
          text: 真的？你觉得自己见过他？
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: 格尔达快活得搂住乌鸦，又亲又抱，差点把它勒死。
        - id: ch04-b07
          speaker: raven
          text: 轻一点，轻一点。我认识的那个人也许就是凯。不过他现在和公主在一起，恐怕早把你忘了。
        - id: ch04-b08
          speaker: gerda
          text: 他和一位公主住在一起？
        - id: ch04-b09
          speaker: raven
          text: 是啊。你听我讲。你们的话真难说，要是你懂乌鸦话，我就能讲得好多了。你懂吗？
        - id: ch04-b10
          speaker: gerda
          text: 我没学过。祖母倒是听得懂，以前还常说给我听。真希望我也学过。
        - id: ch04-b11
          speaker: raven
          text: 没事，我尽量讲，讲得不好你也别见怪。
        - id: ch04-b12
          speaker: narrator
          text: 乌鸦说，这个王国有一位聪明得出奇的公主。她读过全世界的报纸，随后又把它们全忘了，她就是这么聪明。不久前，公主坐在宝座上。听说那个座位其实没有人们想的舒服。她忽然唱了起来。
        - id: ch04-b13
          speaker: princess
          text: 我为什么不结婚？是呀，我为什么不结婚呢？
        - id: ch04-b14
          speaker: narrator
          text: 她决定找一个丈夫。别人同他说话时，他得知道怎么回答，不能只摆出堂皇气派的样子，那太乏味。她叫人擂鼓，把女官全召来。
        - id: ch04-b15
          speaker: court_ladies
          text: 听到这件事，我们真高兴！前几天，我们自己还在谈呢。
          emotion: happy
        - id: ch04-b16
          speaker: raven
          text: 我说的每个字都是真的。我有一位住在王宫里的心上人，她能在宫里随意走动，这些都是她告诉我的。
        - id: ch04-b17
          speaker: narrator
          text: 乌鸦的心上人当然也是一只乌鸦。物以类聚，一只乌鸦总会挑中另一只乌鸦。公主要结婚的消息立刻登上了报纸。报纸四周印着一圈心形花边，中间还有公主名字的首字母。告示说，只要是模样英俊的年轻人，都可以自由进宫同公主谈话。公主问话时，谁能把回答说得响亮，让人听得清清楚楚，谁就能把王宫当成自己的家。而所有人里面，回答得最好的那一个，会被选作公主的丈夫。
        - id: ch04-b18
          speaker: raven
          text: 人们一群群赶来，又挤又跑。可头两天，一个成功的也没有。他们在街上都很会说，一进宫门，看见银衣卫兵、金衣仆人和明亮的大厅，就全慌了。到了公主面前，只会重复她刚说的最后几个字。公主可不想再听一遍自己的话。他们像是在宫里中了催眠术，一回到街上又能说了。求婚的人从城门一直排到王宫。我亲眼见过。他们又饿又渴，宫里连水也不给。有几个聪明人带着黄油面包，却不肯分给别人。他们巴不得别人饿着去见公主，自己好多个机会。
        - id: ch04-b19
          speaker: gerda
          text: 凯呢？快告诉我凯的事！他也在那些人里面吗？
        - id: ch04-b20
          speaker: raven
          text: 别急，这就讲到了。第三天，有个小个子快快活活地走向王宫。他没骑马，也没坐车。眼睛和你的一样亮，头发又长又漂亮，只是衣服很破。
        - id: ch04-b21
          speaker: gerda
          text: 那就是凯！我终于找到他了！
          emotion: happy
        - id: ch04-b22
          speaker: raven
          text: 他背上还背着一个小包。
        - id: ch04-b23
          speaker: gerda
          text: 不，那一定是雪橇。他离开时带着雪橇。
        - id: ch04-b24
          speaker: raven
          text: 也许吧，我当时没看仔细。听我那位心上人说，他进了宫门，看见银衣卫兵和金衣仆人，一点也没发慌。
        - id: ch04-b25
          speaker: prince
          text: 一直站在楼梯上，多累啊。我还是进去吧。
        - id: ch04-b26
          speaker: raven
          text: 大厅里灯火通明，枢密顾问和大使光着脚走来走去，手里捧着金器。那样的场面，谁看了都难免严肃。他的靴子每走一步都吱嘎响，可他一点也不局促。
        - id: ch04-b27
          speaker: gerda
          text: 那一定是凯。他有一双新靴子，我在祖母房里听见它们吱嘎响过。
        - id: ch04-b28
          speaker: raven
          text: 的确响得厉害。他还是大大方方走到公主面前。公主坐在一颗像纺车轮那么大的珍珠上。女官带着侍女，骑士带着仆人，侍女和仆人又各自有人伺候。越靠近门口的人，越是神气。那些穿拖鞋的小侍童昂着头站在门边，简直叫人不敢多看。
        - id: ch04-b29
          speaker: gerda
          text: 那一定吓人得很。凯赢得公主了吗？
        - id: ch04-b30
          speaker: raven
          text: 如果我不是乌鸦，哪怕已经订了婚，也要亲自娶她。那个年轻人说起话来，就像我讲乌鸦话一样流利。他轻松自在，很讨人喜欢。他说自己不是来求婚，只想听听公主有多聪明。他喜欢公主，公主也喜欢他。
        - id: ch04-b31
          speaker: gerda
          text: 那一定是凯。他很聪明，会心算，也会算分数。你能带我去王宫吗？
        - id: ch04-b32
          speaker: raven
          text: 问起来容易，做起来可难。这样吧，我去问问宫里的心上人，看她有什么办法。你这样的小姑娘，要得到进宫的准许可不容易。
        - id: ch04-b33
          speaker: gerda
          text: 我一定能得到准许。凯听说我来了，马上会出来接我。
        - id: ch04-b34
          speaker: raven
          text: 你在栅栏旁边等我。
        - id: ch04-b35
          speaker: narrator
          text: 乌鸦摇摇头飞走了，直到深夜才回来。
        - id: ch04-b36
          speaker: raven
          text: 嘎，嘎。她向你问好，还从厨房拿了一个小面包卷给你。宫里有的是面包，她想你一定饿了。正门不能走，卫兵和仆人不会放你进去。不过别哭，总有办法。我的心上人知道一条通往寝宫的小楼梯，也知道钥匙在哪儿。
        - id: ch04-b37
          speaker: narrator
          text: 格尔达跟着乌鸦穿过长长的林荫道，又走进王宫的花园。树叶一片接一片地飘落。王宫里那些明亮的灯，也仿佛照着同样的次序，一盏接一盏地熄灭。乌鸦一路把她领到一扇后门前。那扇门没有关严，还留着一道缝。站在门口时，格尔达的心里又焦急，又满怀希望，跳得越来越厉害。她觉得自己像是正要偷偷做一件错事。可她并不想拿走任何东西，也不想伤害任何人。她只是要弄清楚，小凯究竟在哪里。
        - id: ch04-b38
          speaker: narrator
          text: 格尔达在心里一遍遍告诉自己，那个人一定就是凯。乌鸦说他有明亮的眼睛，还有那么长、那么漂亮的头发。她仿佛已经看见凯在向自己微笑，就像从前他们坐在屋顶玫瑰丛里的时候一样。他见到格尔达，一定会非常高兴。他会听见她为了寻找自己，已经走过这么远的路，也会知道家里的人因为他再也不回来，心里有多难过。格尔达怀着这些念头，又欢喜，又害怕地走上楼梯。楼梯顶端有一间小小的储藏室，里面亮着一盏灯。那只住在宫里的乌鸦正站在屋子中央，转着脑袋打量她。格尔达记得祖母的教导，便规规矩矩地向它行了一个屈膝礼。
        - id: ch04-b39
          speaker: court_raven
          text: 我的未婚夫把你夸得不得了，小小姐。你的生平，也可以叫作“传记”，实在很感人。请你拿着灯，让我走在前面。从这条路一直过去，就不会碰见人。
        - id: ch04-b40
          speaker: gerda
          text: 我怎么觉得后面有人跟着？
        - id: ch04-b41
          speaker: narrator
          text: 一些东西像墙上的影子，从她身旁飞驰过去。有鬃毛飘动、四腿细长的骏马，还有猎人和骑马的男女，全从墙上滑过。
        - id: ch04-b42
          speaker: court_raven
          text: 那些只是梦。它们来接大人物的念头出去打猎。
        - id: ch04-b43
          speaker: gerda
          text: 那倒好，我们就能安安稳稳地看看他们睡觉。希望你将来得到荣华富贵，还记得别人对你的好。
        - id: ch04-b44
          speaker: raven
          text: 这你尽管放心。
        - id: ch04-b45
          speaker: narrator
          text: 他们来到第一间大厅。墙上绷着玫瑰色的缎子，缎子上绣满了假花。梦又从身旁飘过去，可速度太快，格尔达根本看不清那些王公贵人的模样。他们继续往前走，一间大厅比一间更加富丽堂皇，看得人眼花缭乱。最后，他们终于来到卧室。天花板像一棵巨大的棕榈树，所有叶片都是最名贵的水晶玻璃做成的。房间中央有两张床，每一张都像一朵百合花，由一根金色花梗悬在地面上方。公主睡的是白色百合床，另一张床是红色的。格尔达必须到那张红床里寻找凯。
        - id: ch04-b46
          speaker: narrator
          text: 她拨开一片红花瓣，看见一截棕色的小脖子。一定是凯！她喊出凯的名字，把灯举到那个人头顶。梦骑着马一起奔回房间。那个人醒来，转过头。他不是凯，只是一位脖颈和凯有几分相像的年轻王子。
        - id: ch04-b47
          speaker: narrator
          text: 公主从白床里探出头，问发生了什么。格尔达哭着讲完自己的故事，也讲了两只乌鸦怎样帮助她。
        - id: ch04-b48
          speaker: prince
          text: 可怜的孩子！
        - id: ch04-b49
          speaker: princess
          text: 可怜的孩子！两只乌鸦做得很好，我们不生气。不过以后可不能再这样了。这一次应该奖赏你们。你们想恢复自由，还是想当宫廷乌鸦？当了宫廷乌鸦，厨房里剩下的东西都归你们。
        - id: ch04-b50
          speaker: narrator
          text: 两只乌鸦一起低下头，向王子和公主鞠了一躬。它们没有选择自由，而是请求得到一个固定的宫廷职位。它们已经想到，将来自己老了以后，要是还有安稳的住处和足够的食物，那该多么舒坦。王子从自己的红色百合床上下来，把床让给了格尔达。眼下他能替这个远道而来的小姑娘做的，也只有这些了。
        - id: ch04-b51
          speaker: gerda
          text: 不管是人还是动物，大家对我都这么好。
        - id: ch04-b52
          speaker: narrator
          text: 她合起双手，闭眼睡着了。所有的梦又飞到她身边，看起来像一个个天使。其中一个拉着小雪橇，凯坐在上面向她点头。但这一切只是梦，醒来就不见了。
        - id: ch04-b53
          speaker: narrator
          text: 第二天，大家从头到脚替格尔达换上绸缎和天鹅绒衣服，又请她留在王宫里住几天，好好玩一玩。可是格尔达只求一双靴子、一辆小马车和一匹拉车的马。她还要走进广阔的世界，继续寻找凯。她不但得到了靴子，还有一只暖手筒。大家替她打扮得整整齐齐。等她准备出发时，一辆纯金打造的马车已经停在门前。王子和公主的纹章嵌在车身上，像星星一样闪耀。马车夫、随车仆人，还有前后骑马的侍从，头上全都戴着金冠。
        - id: ch04-b54
          speaker: narrator
          text: 王子和公主亲手扶格尔达坐上马车，又祝她一路平安。森林里的乌鸦如今已经结了婚。它决定陪格尔达走最初的三英里，于是坐在她身旁。它无论如何也受不了倒着坐车。宫里的乌鸦只能留在王宫门口，不停拍打翅膀。它没法跟大家同行。自从得到那个固定职位以后，它一直闹头痛，想来是宫里的剩饭太多，它吃得也太多了。格尔达的车里装满各种甜糕点，座位底下还放着水果和姜饼果子，足够她在路上吃。
        - id: ch04-b55
          speaker: prince
          text: 再见，一路平安！
        - id: ch04-b56
          speaker: princess
          text: 再见，愿你找到凯！
        - id: ch04-b57
          speaker: narrator
          text: 格尔达哭了，乌鸦也哭了。再走几英里，乌鸦也说了再见。这是最叫人难过的一次告别。它飞到树上，只要还能看见阳光下闪闪发光的马车，就一直挥动黑色的翅膀。
    - id: ch05
      title: 第五篇
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这一篇讲小强盗姑娘。金马车驶进茂密的森林，像一支火炬照亮道路，也晃花了几个强盗的眼睛。他们可不肯让马车平安过去。
        - id: ch05-b02
          speaker: robbers
          text: 是金子！是金子！
        - id: ch05-b03
          speaker: narrator
          text: 强盗们冲上来抓住马匹，打死几个骑马的侍从、马车夫和仆人，又把格尔达拖出马车。
        - id: ch05-b04
          speaker: robber_woman
          text: 这孩子又胖又漂亮，一定是吃坚果仁长大的。她像只小羊羔，滋味肯定好极了！
        - id: ch05-b05
          speaker: narrator
          text: 强盗婆长着长胡子，眉毛一直垂到眼睛上。她拔出亮闪闪的刀，刀光看着真叫人害怕。就在这时，她尖叫了一声。原来她的女儿从背后抱住她，狠狠咬了她的耳朵。那姑娘又野又淘气。母亲骂她是个丑东西，这一耽搁，就没空杀格尔达了。
        - id: ch05-b06
          speaker: robber_girl
          text: 她要陪我玩。暖手筒和漂亮衣服也都得给我。晚上，她还要跟我睡一张床。
        - id: ch05-b07
          speaker: narrator
          text: 她又咬了母亲一口，疼得老妇人腾空跳起来。强盗们全笑了。
        - id: ch05-b08
          speaker: robbers
          text: 看哪，她正和自己的小崽子跳舞呢！
        - id: ch05-b09
          speaker: robber_girl
          text: 我要坐马车兜风。
        - id: ch05-b10
          speaker: narrator
          text: 小强盗姑娘想做什么，就一定要做到，因为她既任性，又固执。她拉着格尔达坐进马车。车轮一路碾过树桩和石头，颠簸着向森林深处驶去。小强盗姑娘和格尔达差不多高，可身体比她结实得多，肩膀也更宽，皮肤更黑。她的眼睛乌黑乌黑，目光很野，深处却像藏着一丝悲伤。她忽然伸出胳膊，一把搂住小格尔达的腰，把她紧紧抱在身边。
        - id: ch05-b11
          speaker: robber_girl
          text: 只要你不惹我们生气，他们就不会杀你。我猜你是个公主。
        - id: ch05-b12
          speaker: gerda
          text: 我不是公主。
        - id: ch05-b13
          speaker: narrator
          text: 格尔达把自己的经历全讲了一遍，也说了自己多么爱凯。强盗姑娘认真看着她，轻轻点头。
        - id: ch05-b14
          speaker: robber_girl
          text: 就算你惹我生气，他们也不能杀你。到那时，我要自己动手。
        - id: ch05-b15
          speaker: narrator
          text: 说完，她替格尔达擦去眼泪，把两只手都塞进那只柔软暖和的漂亮暖手筒。
        - id: ch05-b16
          speaker: narrator
          text: 马车停在一座强盗城堡的院子里。城墙从上到下裂开了许多缝，渡鸦和乌鸦在洞口和裂缝之间飞进飞出。几只大斗牛犬蹦来跳去，每一只看起来都能一口吞掉一个人，可强盗们不许它们叫。格尔达被带进一间宽阔的大厅。里面烟雾弥漫，石头地面上燃着一堆旺火。屋里根本没有烟囱，烟升到天花板下面，只能自己寻找缝隙钻出去。一口大锅里煮着热汤，野兔和家兔穿在烤架上，正对着火慢慢烘烤。
        - id: ch05-b17
          speaker: robber_girl
          text: 今晚你和我，还有我的小动物，一起睡。
        - id: ch05-b18
          speaker: narrator
          text: 吃喝以后，她带格尔达到大厅一角。那里铺着干草和地毯，上方的板条和栖木上落着一百多只鸽子。它们像是睡着了，可两个女孩走近时，还是微微动了动。
        - id: ch05-b19
          speaker: robber_girl
          text: 这些全是我的。
        - id: ch05-b20
          speaker: narrator
          text: 她抓住最近的一只，提着鸽子的脚使劲摇，摇得它扑打翅膀。
        - id: ch05-b21
          speaker: robber_girl
          text: 快亲亲它！墙边笼子里的两个是野鸽子。这两个坏蛋只要没关牢，一转眼就会飞走。还有我的老相好“巴”。
        - id: ch05-b22
          speaker: narrator
          text: 她抓住一头驯鹿的角，把它拖出来。驯鹿颈上套着闪亮的铜圈，身体被拴着。
        - id: ch05-b23
          speaker: robber_girl
          text: 它也得拴牢，不然一样会逃。每天晚上，我都用刀子搔它的脖子，吓得它乱跳，可好玩了。
        - id: ch05-b24
          speaker: narrator
          text: 她从墙缝拔出长刀，把刀刃贴着驯鹿的脖子轻轻划过。可怜的驯鹿马上乱蹬。强盗姑娘却笑了，把格尔达拉到床上。
        - id: ch05-b25
          speaker: gerda
          text: 你睡觉也把那把刀带在身边吗？
          emotion: fearful
        - id: ch05-b26
          speaker: robber_girl
          text: 我睡觉一向带着刀。谁知道会出什么事？现在，把凯的故事再讲一遍。还有，你为什么跑到这么大的世界上来？
        - id: ch05-b27
          speaker: narrator
          text: 格尔达只好把自己的故事从头再讲一遍。她讲屋顶上的玫瑰，讲凯怎样失踪，也讲自己一路怎样找来。头顶笼子里的两只野鸽低低地咕咕叫着，其余鸽子已经全都睡着了。小强盗姑娘听完以后，用一条胳膊搂住格尔达的脖子，另一只手仍旧握着那把刀。没过多久，她就呼呼地睡熟了。格尔达却根本不敢闭眼。她不知道等到天亮时，自己究竟还活着，还是已经死了。强盗们围坐在火边，一面大口喝酒，一面放声唱歌。强盗婆摇摇晃晃地走来走去。对一个小姑娘来说，眼前的景象实在太可怕了。
        - id: ch05-b28
          speaker: wood_pigeons
          text: 咕咕，咕咕。我们见过凯。一只白鸡驮着他的雪橇，他坐在冰雪女王的车里。我们还在巢里的时候，她从森林穿过去。她朝我们吹了一口气，雏鸽全死了，只剩我们两个。咕咕，咕咕。
        - id: ch05-b29
          speaker: gerda
          text: 你们在说什么？冰雪女王去了哪里？你们知道吗？
          emotion: surprised
        - id: ch05-b30
          speaker: wood_pigeons
          text: 她多半去了拉普兰。那里一年到头都有冰雪。你问问那边被绳子拴住的驯鹿。
        - id: ch05-b31
          speaker: reindeer
          text: 对，拉普兰终年都是冰雪。那是个美妙的地方，可以在闪闪发亮的冰原上随意奔跑跳跃。冰雪女王的夏日帐篷就在那儿。不过她坚固的城堡在北极，建在一座叫斯匹次卑尔根的岛上。
        - id: ch05-b32
          speaker: gerda
          text: 啊，凯，我的小凯！
          emotion: sad
        - id: ch05-b33
          speaker: robber_girl
          text: 躺着别动。不然，我就把刀扎进你的肚子。
        - id: ch05-b34
          speaker: narrator
          text: 到了早晨，格尔达把野鸽的话全告诉强盗姑娘。她神情严肃地点点头。
        - id: ch05-b35
          speaker: robber_girl
          text: 都是闲话。都是闲话。喂，驯鹿，你知道拉普兰在哪里吗？
        - id: ch05-b36
          speaker: reindeer
          text: 还有谁会比我更清楚？我就出生在那里，从小在白雪覆盖的原野上四处奔跑。
        - id: ch05-b37
          speaker: robber_girl
          text: 你听好。我们的人全出去了，只剩我母亲。她每天中午都要对着大瓶子喝酒，喝完睡上一小会儿。到那个时候，我替你办一件事。
        - id: ch05-b38
          speaker: narrator
          text: 她跳下床，搂住母亲的脖子，揪着胡子问早安。母亲弹她的鼻子，弹得通红。这可是出于疼爱。
        - id: ch05-b39
          speaker: narrator
          text: 等母亲喝完酒倒头睡着，强盗姑娘走到驯鹿旁边。
        - id: ch05-b40
          speaker: robber_girl
          text: 我真想再用刀子搔几下你的脖子，你那副样子太有趣了。不过算了。我放你回拉普兰。你得拿出全部力气，把格尔达带到冰雪女王的城堡，她的伙伴就在那里。她刚才讲的事，你全听见了。她声音那么响，你的耳朵也一直竖着。
        - id: ch05-b41
          speaker: narrator
          text: 驯鹿一听见自己能够恢复自由，高兴得立刻跳了起来。小强盗姑娘把格尔达抱到它宽阔的背上。她虽然一向任性，这时候想得却很周到。她找来绳子，把小姑娘牢牢系住，免得驯鹿奔跑时把她颠下来。她甚至把自己的小坐垫也拿来，垫在格尔达身下，好让她一路坐得稳一些，也舒服一些。
        - id: ch05-b42
          speaker: robber_girl
          text: 毛皮靴还给你，那里冷得厉害。暖手筒我要留下，它太漂亮了。不过我也不会让你冻着。拿去，这是我母亲的大手套，一直能套到胳膊肘。戴好了。你的手现在和她的一模一样。
        - id: ch05-b43
          speaker: narrator
          text: 格尔达高兴得哭起来。
        - id: ch05-b44
          speaker: robber_girl
          text: 我不爱看你难过。现在你应该高高兴兴的。再拿两条面包和一只火腿，路上就不会挨饿。
        - id: ch05-b45
          speaker: narrator
          text: 她把食物系在驯鹿背上，打开大门，哄进所有大狗，再用刀割断绳子。
        - id: ch05-b46
          speaker: robber_girl
          text: 跑吧。你可得好好照顾这个小姑娘。
        - id: ch05-b47
          speaker: narrator
          text: 格尔达戴着那只大手套，向小强盗姑娘伸出手，说了再见。驯鹿立刻飞奔出去。它越过树桩和石头，穿过幽深的大森林，又跑过沼泽和辽阔的平原。它使出全身力气，一刻也不停。四周传来狼群的嗥叫，渡鸦在空中尖声鸣叫。天上还有一片片红光不停颤动，看起来像一簇簇燃烧的火焰。
        - id: ch05-b48
          speaker: reindeer
          text: 那是我家乡的北极光。看，它们多亮！
        - id: ch05-b49
          speaker: narrator
          text: 驯鹿日夜不停地跑，越跑越快。等他们到了拉普兰，两条面包和火腿全吃完了。
    - id: ch06
      title: 第六篇
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 这一篇讲拉普兰女人和芬兰女人。他们停在一间简陋的小屋前。斜屋顶几乎碰到地面，门矮得出奇，人进出都得手脚并用地爬。屋里只有一个拉普兰老妇人，正借着鱼油灯的光煮鱼。
        - id: ch06-b02
          speaker: narrator
          text: 驯鹿把格尔达的故事告诉她，不过先讲自己的故事，因为它觉得那才最要紧。格尔达冻得僵硬，一句话也说不出来。
        - id: ch06-b03
          speaker: lapland_woman
          text: 唉，你们两个可怜虫。前面的路还远着呢。再走一百多英里才到芬兰，冰雪女王现在住在那里，每晚都放蓝色焰火。我没有纸，就在一条晒干的鳕鱼上写几个字。你们把它交给芬兰女人，她知道得更多。
        - id: ch06-b04
          speaker: narrator
          text: 格尔达在小屋里慢慢暖和过来，又吃了一些东西，喝了一些热饮。老妇人把几个字写在晒干的鳕鱼上，反复嘱咐格尔达，一路上千万要保管好。随后，她重新把格尔达系在驯鹿背上。驯鹿带着她飞快地出发了。夜里，美丽的蓝色北极光在天空闪呀，闪呀，整整闪了一夜。最后，他们总算到了芬兰。芬兰女人的屋子在地面上连一扇门也没有。他们只好走到屋顶，敲响小屋的烟囱，再从烟囱里爬进去。
        - id: ch06-b05
          speaker: narrator
          text: 他们顺着烟囱爬进屋里。里面热得可怕，和外面的冰天雪地完全不同。芬兰女人身上几乎什么衣服也没穿。她个子很小，看起来还有些脏兮兮的。她一看见格尔达，就赶紧松开她厚厚的衣服，又脱掉她的毛皮靴和那双大手套。要是不这样做，格尔达一定会被屋里的热气闷得受不了。随后，她又拿来一块冰，放在热得难受的驯鹿头上。安顿好他们以后，她才拿起那条鳕鱼干，开始读上面写的字。
        - id: ch06-b06
          speaker: narrator
          text: 她读了三遍，就全记住了，然后把鱼干扔进汤锅。鱼可以吃，她从不浪费。驯鹿还是先讲自己的故事，再讲格尔达的故事。芬兰女人的眼睛聪明地闪了闪，却没有开口。
        - id: ch06-b07
          speaker: reindeer
          text: 你这么聪明，只用一根细绳，就能把全世界的风打成结。水手解开第一个结，会有顺风。解开第二个，风就猛烈起来。第三个和第四个都松开，风暴能把整片森林连根拔起。你能不能给格尔达一点东西，让她有十二个人的力气，打败冰雪女王？
        - id: ch06-b08
          speaker: finnish_woman
          text: 十二个人的力气？那能有什么用。
        - id: ch06-b09
          speaker: narrator
          text: 她还是从架子上取下一张卷起的大皮子，展开来。上面写满奇妙的文字。她一直读到汗水顺着额头流下。驯鹿苦苦替格尔达哀求，格尔达也含着泪，用恳求的眼睛望着她。芬兰女人眼里又闪起光。她把驯鹿拉到墙角，一边换掉它头上的冰，一边低声说。
        - id: ch06-b10
          speaker: finnish_woman
          text: 凯的确在冰雪女王那里。他觉得那儿样样合心意，是全世界最好的地方。那是因为一片碎玻璃扎在他心里，另一小片嵌在眼睛里。不取出这两片玻璃，他就变不回真正的人，冰雪女王也会一直控制他。
        - id: ch06-b11
          speaker: reindeer
          text: 那你不能给格尔达一点东西，帮她战胜这种力量吗？
        - id: ch06-b12
          speaker: finnish_woman
          text: 她已经拥有的力量，就是我能给她的最大力量。你没看见这力量有多强吗？人和动物都忍不住帮助她。她光着脚，已经独自走过这么远的世界。她不能从我这里得到更大的力量。她的力量就在自己纯洁无邪的心里。要是她不能靠自己走进冰雪女王的宫殿，取出凯身上的玻璃碎片，我们也帮不了她。
        - id: ch06-b13
          speaker: finnish_woman
          text: 离这里两英里，就是冰雪女王花园的起点。你把她驮到那里，放在雪地里那丛结着红果的大灌木旁。别停下闲聊，赶快回来。
        - id: ch06-b14
          speaker: narrator
          text: 芬兰女人把格尔达抱上驯鹿背。驯鹿拼命往前跑。
        - id: ch06-b15
          speaker: gerda
          text: 哎呀，我把靴子和手套忘了！
          emotion: surprised
        - id: ch06-b16
          speaker: narrator
          text: 格尔达一碰到刺骨的冷气就喊起来，可驯鹿不敢停，一直跑到红果灌木旁才放下她。它亲吻格尔达，大颗明亮的泪珠滚过脸颊，然后飞快地往回跑。
        - id: ch06-b17
          speaker: narrator
          text: 格尔达没有鞋，也没有手套，独自站在寒冷、凄凉、冰封的芬兰。她拼命向前跑。忽然，一大团雪花贴着地面奔过来。天空清澈无云，北极光不停闪耀。这些雪花离她越近，个头越大。
        - id: ch06-b18
          speaker: narrator
          text: 格尔达想起从前和凯一起透过放大镜看雪花。那时候，每一片雪花都显得又大又美，有的像花，有的像星星。眼前这些雪花却真的比那时看到的还要大，也更加可怕。因为它们不是安安静静的冰晶，而是活着的东西，是冰雪女王派来守卫宫殿的士兵。它们的模样一个比一个古怪。有些像巨大的豪猪，有些像把脑袋向前伸着、身体扭成一团的蛇，还有几只像毛发全都竖起来的胖熊。可不管长成什么样，它们个个都白得刺眼，正从四面八方逼近格尔达。
        - id: ch06-b19
          speaker: narrator
          text: 格尔达站在那些可怕的活雪花面前，开始念《主祷文》。天气冷得厉害。每念出一个字，她都能看见自己的呼吸化成白汽，从嘴边涌出来。随着祷告继续，白汽越来越浓，最后化成一个又一个小天使。他们落到地面，马上长得高大起来。每个天使头上都戴着盔帽，手里拿着长矛和盾牌。他们越聚越多。等格尔达念完祷词，一整支天使军团已经把她护在中间。
        - id: ch06-b20
          speaker: narrator
          text: 天使用长矛刺向那些可怕的雪花，把它们击成上百块。格尔达便能勇敢平安地向前走。他们抚摸她的手脚，让她不再那么冷。她加快脚步，赶向冰雪女王的城堡。
        - id: ch06-b21
          speaker: narrator
          text: 现在，我们得去看看凯在做什么。说真的，他一点也没想起格尔达，更不知道她可能已经站在宫殿外面。
    - id: ch07
      title: 第七篇
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 最后一篇讲冰雪女王的宫殿，还有那里发生的事。宫墙由积雪筑成，门窗是刺骨的寒风。里面有一百多个房间，每一间都像狂风把雪吹拢以后堆成的。最大的房间绵延好几英里。北极光照亮所有屋子。它们那么宽广，那么空荡，那么寒冷，又那么晶莹闪亮。
        - id: ch07-b02
          speaker: narrator
          text: 这座宫殿里一点消遣也没有。连一场小小的熊舞会都没有。要是有的话，暴风尽可以替它们奏乐，熊儿们也可以用后腿站起来跳舞，好展示自己的教养。这里没有开心的火中抢果子游戏，也没有你追我赶的捉人游戏。就连狐狸小姐们围着茶桌说闲话的聚会，也从来没有举行过。冰雪女王的大厅里，只有空旷、浩瀚和寒冷。北极光的火焰一会儿升到高空，一会儿低垂到天边。不论它怎样摇曳闪动，在整座城堡的任何地方都看得清清楚楚。
        - id: ch07-b03
          speaker: narrator
          text: 在那座无边无际、空空荡荡的雪厅中央，有一片完全冰封的湖。湖面并不是平整的一整块，而是碎裂成千百种形状。每一块冰看起来，都像一件不需要雕刻、天然形成的艺术品。奇怪的是，这些形状又彼此十分相似。冰雪女王待在家里的时候，就坐在湖心最寒冷的地方。她把这片冰湖称为“理性之镜”。在她口中，这是世界上最好的一面镜子，实际上也是唯一配得上称为镜子的东西。
        - id: ch07-b04
          speaker: narrator
          text: 凯冻得发青，几乎变黑，却完全感觉不到。女王的吻已经带走他对寒冷的战栗，他的心也早成了冰。他把尖锐扁平的冰片搬来搬去，摆成各种图案，就像人们用小木片玩七巧板。他的手指很灵巧。
        - id: ch07-b05
          speaker: narrator
          text: 他玩的是冰冷的理性游戏。在他看来，那些图案既奇妙，又重要。那是因为眼睛里的玻璃碎片还没有出来。他一次又一次移动冰片，拼出了许多完整的图案，也组成一个个不同的词。可是有一个他最想要的词，无论怎样摆都摆不出来。那个词就是“永恒”。
        - id: ch07-b06
          speaker: snow_queen
          text: 等你拼出“永恒”，你就能自己做主。我还会把整个世界和一双新冰鞋送给你。
        - id: ch07-b07
          speaker: narrator
          text: 可凯怎么也拼不出来。
        - id: ch07-b08
          speaker: snow_queen
          text: 现在我要去那些温暖的国家，看看喷火山峰上的黑色火山口。它们好像叫埃特纳和维苏威。我要把它们染白，这对火山有好处，对柠檬和葡萄也有好处。
        - id: ch07-b09
          speaker: narrator
          text: 冰雪女王说完就飞走了。她把小凯独自留在那座绵延许多英里的冰雪大厅里。凯仍然坐在冰封的湖面上，把一片片冰块摆来摆去。他望着那些冰片，想得那么入神，完全忘记了四周的一切。过了很久，他的身体还是一动不动。如果这时候有人从远处看见他，一定会以为这个男孩早已被严寒冻僵，再也不会站起来了。
        - id: ch07-b10
          speaker: narrator
          text: 就在这时，格尔达穿过城堡大门。寒风在她身边怒吼。她开口祷告，风渐渐平息，像睡着了一样。她继续往里走，来到巨大空旷的大厅，一眼就看见凯。她马上认出他，跑过去紧紧搂住他的脖子。
        - id: ch07-b11
          speaker: gerda
          text: 凯，亲爱的凯，我终于找到你了！
          emotion: happy
        - id: ch07-b12
          speaker: narrator
          text: 凯还是僵硬冰冷地坐着，一动不动。格尔达流下滚烫的眼泪。泪珠落到凯胸口，渗进心里，融化了冰，也冲走了扎在里面的玻璃碎片。凯抬起眼睛看她。格尔达唱起从前的歌。
        - id: ch07-b13
          speaker: gerda
          text: |-
            玫瑰盛开终会凋零，
            我们终将见到圣婴。
        - id: ch07-b14
          speaker: narrator
          text: 凯一下子放声大哭。眼泪不停涌出，终于把眼睛里的玻璃碎片冲了出来。他认出了格尔达。
        - id: ch07-b15
          speaker: kay
          text: 格尔达，亲爱的格尔达！这么久，你去了哪里？我自己又到了什么地方？这里好冷，又这么空，这么大！
          emotion: surprised
        - id: ch07-b16
          speaker: narrator
          text: 凯紧紧靠着格尔达，不肯再松开她。格尔达一会儿哭，一会儿笑，心里欢喜到了极点。眼前这一幕实在太美好了，就连湖面上那些尖锐冰冷的冰块，也纷纷跳起舞来。它们跳了好一阵，终于累了，又一块接一块地躺回湖面。谁也没有移动它们，可它们竟自动排成了冰雪女王要凯找出的那个词。只要拼出这个词，凯就能自己做主，还能得到整个世界和一双崭新的冰鞋。
        - id: ch07-b17
          speaker: narrator
          text: 格尔达亲吻凯的面颊，面颊重新红润起来。她亲吻他的眼睛，眼睛也像她的一样明亮。她又吻了他的手脚，他便完全恢复健康和快乐。现在，冰雪女王只管回来好了。凯获得自由的凭据就在眼前。那个词已经由闪亮的冰块拼了出来。
        - id: ch07-b18
          speaker: narrator
          text: 两个孩子手牵着手，走出巨大的冰宫。他们一路谈着祖母，也谈着屋顶上那些玫瑰。两个人走到哪里，风就在那里平静下来，太阳也从云层后面钻出来，放出明亮的光。等他们来到结满红果的灌木旁，驯鹿正在那里等候。它还带来了一头年轻的母驯鹿。母驯鹿的乳房里盛满了奶。两个孩子喝下温热的鹿奶，觉得身上有了暖意，又一起亲了亲母驯鹿的嘴。
        - id: ch07-b19
          speaker: narrator
          text: 两头驯鹿先把凯和格尔达送到芬兰女人那里。两个孩子在那间炎热的小屋里待了一阵，直到冻透的身体完全暖和过来。芬兰女人又把回家的路线仔细告诉他们。接着，他们来到拉普兰女人的小屋。她为两个孩子做了合身的新衣服，还替他们修好了原来的小雪橇。上路以后，两头驯鹿一直在雪橇旁边奔跑，陪着他们越过冰雪覆盖的土地，直到来到国境边缘。这里已经不再是永远冰封的世界，枝头甚至抽出了第一片嫩绿的叶子。
        - id: ch07-b20
          speaker: narrator
          text: 凯和格尔达就在国境边缘，向两头驯鹿和拉普兰女人道别。大家互相说着再见。鸟儿已经开始啁啾，森林也长满了嫩绿的新叶。这时，一匹漂亮的马从林中走出来。格尔达一眼认出，那正是从前拉过金马车的一匹。马背上坐着一位年轻姑娘。她头上戴着闪亮的红帽，腰带里插着一把手枪。原来是小强盗姑娘。她已经在家里待腻了，打算先到北方去看看。要是北方不合她的心意，她就再到世界上别的地方碰碰运气。她马上认出了格尔达，格尔达也记得她。经历过这么多事以后再次相逢，大家心里都非常高兴。
        - id: ch07-b21
          speaker: robber_girl
          text: 你这个家伙倒好，自己跑出来到处闲逛。我真想知道，你到底值不值得别人跑到世界尽头去找你。
        - id: ch07-b22
          speaker: narrator
          text: 格尔达拍了拍她的脸，问王子和公主怎么样。
        - id: ch07-b23
          speaker: robber_girl
          text: 他们去外国了。
        - id: ch07-b24
          speaker: gerda
          text: 那只乌鸦呢？
        - id: ch07-b25
          speaker: robber_girl
          text: 乌鸦死了。它那位住在宫里的心上人做了寡妇，腿上系着一小截黑毛线。她哭得伤心极了，不过全是胡闹。快告诉我，你是怎么把凯救出来的。
        - id: ch07-b26
          speaker: narrator
          text: 格尔达和凯从头到尾讲给她听。
        - id: ch07-b27
          speaker: robber_girl
          text: 剪断绳，解开结！这下总算样样都妥当了。
        - id: ch07-b28
          speaker: narrator
          text: 小强盗姑娘拉起他们两个人的手，认真答应说，以后要是经过他们居住的那座城，一定会上门看望。告别以后，她调转马头，独自奔向广阔的世界。格尔达和凯也继续赶路。他们手牵着手，一步一步走向自己的家乡。路越往前，春意就越明媚。冰雪渐渐消失，四周到处都是鲜亮的绿色，路旁的花也一朵接一朵地开放。
        - id: ch07-b29
          speaker: narrator
          text: 不久，他们认出了自己住过的那座大城，也认出教堂高高的尖塔。两个人走进城里时，钟声正欢快又甜美地鸣响。他们来到祖母家的门前，登上熟悉的楼梯，终于走进那间小屋。屋里的一切都和从前一模一样。老钟仍旧滴答、滴答地走着，指针也正指着当时的时刻。可就在跨进房门的时候，他们才忽然发现，自己已经不再是离家时的两个小孩子。他们双双长大了，成了成年的男子和女子。
        - id: ch07-b30
          speaker: narrator
          text: 屋顶上的玫瑰正在最繁盛的时候。一枝枝花从窗口探进屋里，和他们离开以前一样。凯和格尔达小时候常坐的那两张小椅子，也还摆在原来的地方。两个人各自在自己的椅子上坐下来，手仍旧紧紧牵在一起。走过这么远的路以后，他们终于又回到了玫瑰旁边。冰雪女王宫殿里那种寒冷、空洞又耀眼的壮丽，此刻已经离他们很远。它像一场使人痛苦的梦，渐渐从两个人的记忆中消散了。
        - id: ch07-b31
          speaker: grandmother
          text: 你们若不变成小孩子的样式，就绝不能进上帝的国。
        - id: ch07-b32
          speaker: narrator
          text: 祖母坐在上帝明亮的阳光里，高声读着《圣经》。凯和格尔达望进彼此的眼睛，忽然明白了老歌里的话。
        - id: ch07-b33
          speaker: kay
          text: |-
            玫瑰盛开终会凋零，
            我们终将见到圣婴。
        - id: ch07-b34
          speaker: gerda
          text: |-
            玫瑰盛开终会凋零，
            我们终将见到圣婴。
        - id: ch07-b35
          speaker: narrator
          text: 他们就这样坐在一起。虽然已经长大，心里却仍然是孩子。那时正是夏天。温暖而美丽的夏天。
