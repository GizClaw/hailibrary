audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温柔沉静，带着古老童话的悠远感
        timbre: 温暖清澈
        pace: 从容舒展
        pitch: 中
    little_mermaid:
      display_name: 小美人鱼
      tts:
        delivery: 真挚敏感，话语轻柔而坚定
        timbre: 清亮纤细
        pace: 稍慢
        pitch: 中高
    grandmother:
      display_name: 老祖母
      tts:
        delivery: 慈爱端庄，语气笃定
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 中低
    sisters:
      display_name: 姐姐们
      tts:
        delivery: 亲密活泼，忧伤时仍保持柔和
        timbre: 清脆和谐
        pace: 中等
        pitch: 中高
    sea_witch:
      display_name: 海巫婆
      tts:
        delivery: 粗厉狡黠，带着令人不安的戏谑
        timbre: 沙哑低沉
        pace: 忽缓忽急
        pitch: 低
    prince:
      display_name: 王子
      tts:
        delivery: 坦率温和，年轻而热诚
        timbre: 明朗柔润
        pace: 中等
        pitch: 中
    air_spirit:
      display_name: 天空的女儿
      tts:
        delivery: 轻柔安宁，仿佛从高空传来
        timbre: 空灵透明
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 深海里的小公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 远在大海最深的地方，海水蓝得像最美的矢车菊，又清得像水晶。那里深得惊人，再长的缆绳也探不到底。就算把许多座教堂的尖塔一座叠一座，也碰不到海面。海王和他的臣民就住在这片深水里。可别以为海底只有光秃秃的黄沙。那里生长着世上最奇异的花草，叶和茎柔软极了。水波只要轻轻一动，它们就像活过来一样摇摆。大鱼小鱼从枝叶间穿过，就像陆地上的鸟儿飞过树林。海王的宫殿立在最深处，珊瑚砌成墙，澄澈的琥珀做成修长的尖拱窗。屋顶铺满贝壳，海水流过时，它们就一开一合。每一只贝壳里都藏着一颗闪亮的珍珠，足够嵌在王后的冠冕上。
        - id: ch01-b02
          speaker: narrator
          text: 海王早已失去妻子，多年来一直独居，宫里的事便由他年迈的母亲料理。老太太见多识广，也为自己高贵的出身十分骄傲。她的尾巴上佩着十二只牡蛎，而别的贵族最多只能佩六只。不过，她也确实值得敬重，尤其是把六个小孙女照料得很好。六位海公主都很美，最小的那一个最动人。她的皮肤像玫瑰花瓣一样清透娇嫩，眼睛蓝得像最深的海，身子末端也和姐姐们一样，是一条鱼尾。
        - id: ch01-b03
          speaker: narrator
          text: 姐妹们整天在宫殿大厅和墙上长出的活花丛中嬉戏。巨大的琥珀窗总是敞开，鱼儿会从那里游进来，就像陆地上的燕子飞进屋。它们游到公主身边，吃她们手里的食物，还让她们抚摸。宫外有一座美丽的花园，鲜红和深蓝的花朵开得到处都是，有些就像一簇簇火焰。金色果实在摆动的叶茎间闪光，地上铺着最细的沙，却蓝得像燃烧的硫黄。万物都罩在奇异的蓝光里，仿佛头顶不是沉重的海水，而是透着蓝天的空气。海面平静时，从这里望见的太阳就像一朵紫花，光从花心里流下来。
        - id: ch01-b04
          speaker: narrator
          text: 每位公主都有自己的花坛。姐姐们把花坛修成鲸鱼或小美人鱼的模样，小公主却把自己的花坛修得像太阳一样圆，只种落日般鲜红的花。她安静，爱沉思，对沉船里的宝物并不热衷，只珍爱一尊白色大理石雕像。那是一位俊美少年的像。她在雕像旁种下玫瑰色的垂柳，柔枝垂向蓝沙，淡紫的树影来回摇着，像树冠和树根想要亲吻彼此。
        - id: ch01-b05
          speaker: narrator
          text: 小公主最爱听海面之上的故事，总请祖母讲船只、城市、人和动物。她听说陆地的花有香气，森林的树是绿色的，树丛里的“鱼儿”还会唱歌。祖母得把鸟儿叫作鱼儿，她才听得懂。
        - id: ch01-b06
          speaker: grandmother
          text: 等你满十五岁，就能浮上海面了。到时你可以坐在月光下的礁石上，看大船从身旁经过，也能亲眼看看森林和城市。
        - id: ch01-b07
          speaker: narrator
          text: 姐妹们相差一岁。大姐满十五岁时，小妹妹还要再等五年。她们答应每次回来，都把看到的一切讲给其他人听。最盼望海面世界的，偏偏是要等得最久的小妹妹。许多夜晚，她站在窗前向上望。月亮和星星透过深蓝海水，显得又大又朦胧。头顶若掠过一团黑影，她就知道，那是一条鲸鱼，或是一艘载满人类的船。船上的人不会想到，下方正有一个小美人鱼朝船底伸出双手。
        - id: ch01-b08
          speaker: narrator
          text: 大姐第一次上去时，躺在靠岸的沙洲上，让月光照着自己。她望见近处的大城灯火闪烁，像几百颗星。音乐、车轮声和人声混在一起，教堂尖塔上的钟欢快地响着。她不能靠近，反而更加向往。小妹妹听得入神，后来每次隔着深蓝海水向上望，都会想起那座热闹的城，甚至觉得钟声已经传到海底。第二年，二姐在日落时来到海面。天空像黄金一样明亮，紫色和玫瑰色的云飘在上面。一群野天鹅飞得比云还快，像一道长长的白纱，直奔落日。她也向太阳游去，直到太阳沉进波涛，海上和云间的玫瑰色一起褪去。三姐胆子最大，沿着宽阔河流逆流而上。两岸青山披着葡萄藤，宫殿和城堡从高高的树林间露出来。鸟儿歌唱，阳光把她的脸晒得发烫，她只好一次次潜下水。她在狭窄的河湾遇见一群光着身子戏水的孩子，本想和他们一起玩，孩子们却吓得四散逃开。随后，一只她从没见过的黑色小动物跑来，对着她凶猛地叫。她赶紧逃回大海，后来才知道那是狗。可她始终忘不了森林、青山和那些没有鱼尾也会游泳的孩子。
        - id: ch01-b09
          speaker: narrator
          text: 胆小的四姐只留在茫茫海中央，可她说那里的景色一点也不差。四周能望出很远，天空罩在头顶，像一口巨大的玻璃钟。远处的船小得像海鸥，海豚在浪间嬉戏，大鲸从鼻孔喷出水柱，仿佛成百座喷泉一齐涌起。五姐在冬天满十五岁，因此看见了姐姐们都没见过的景象。海水一片碧绿，巨大的冰山四处漂流，每一座都像珍珠，比人类的教堂还要高，奇异的形状在光下像钻石一样闪耀。她坐上最大的一座，让风吹动长发。船只都害怕地远远绕开。傍晚，乌云遮住太阳，雷声滚过天空，闪电四处飞舞。红光照着冰山在汹涌海面上摇晃，船上的人慌忙收帆，五姐却安稳地坐在那里，看蓝色闪电分叉刺进大海。
        - id: ch01-b10
          speaker: narrator
          text: 姐姐们第一次浮上海面，都为新奇的景色欢喜。等她们长大，随时都能上去，也就不再觉得稀奇。每次在外面待上一个月，她们总说海底更美，还是家里舒服。不过到了傍晚，五姐妹仍常常手挽着手，排成一行浮上海面。她们的歌喉比任何人类都美。风暴快来、船只可能遇难时，她们会游到船前，唱海底有多少乐趣，请水手即使沉下去也不要害怕。可人类听不懂，只把歌声当成风暴的呼号。他们也永远看不见海底的美，因为船若沉没，人就会淹死，到达海王宫殿的只会是尸体。
        - id: ch01-b11
          speaker: narrator
          text: 小妹妹只能独自站在后面，看姐姐们越游越远。她几乎要哭了，可美人鱼没有眼泪，所以痛苦藏得更深。
        - id: ch01-b12
          speaker: little_mermaid
          text: 唉，要是我也已经十五岁了！我一定会喜欢海面上的世界，也会喜欢住在那里的人。
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 她终于等到十五岁生日。祖母给她戴上白百合花冠，每片花瓣都是半颗珍珠，又叫八只大牡蛎紧紧夹在她的尾巴上，好显出公主的身份。
        - id: ch01-b14
          speaker: little_mermaid
          text: 它们夹得我真疼。
        - id: ch01-b15
          speaker: grandmother
          text: 想要体面，就得忍着疼。
        - id: ch01-b16
          speaker: narrator
          text: 小美人鱼宁愿戴自己园里的红花，可她只能向家人告别，像水泡一样轻盈地升向海面。
    - id: ch02
      title: 风暴中的王子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 她露出水面时，太阳刚刚落下。绯红和金黄铺满云层，长庚星在微亮的暮色里闪着光。海面平静，空气温和又清新。一艘三桅大船因为没有风，停在水上，只张着一面帆。水手们闲坐在甲板和帆索之间，船上不断传来音乐和歌声。夜色渐深，上百盏彩灯同时亮起，倒映在水中，看上去就像各国的旗帜都在空中飘扬。
        - id: ch02-b02
          speaker: narrator
          text: 小美人鱼游到舱窗外，借浪头托起自己，朝明净的玻璃里看。舱中有许多盛装的人，其中最俊美的是一位黑眼睛的年轻王子。他刚满十六岁，大家正在为他庆祝生日。王子来到甲板时，一百多枚焰火冲上天空。小美人鱼吓得钻进水里，再抬头，只见火焰般的太阳和灿烂火萤从天而降，又映在清澈海面上。船上每个人、每根细绳都被照得清清楚楚。王子微笑着同宾客握手，音乐在夜空回荡，她怎么也移不开眼睛。
        - id: ch02-b03
          speaker: narrator
          text: 夜已经很深，小美人鱼仍守在舱窗外。彩灯灭了，焰火和炮声也停了，海面却开始动荡，波涛下面传来低沉的呻吟和咆哮。她随着海水上下起伏，还是想继续看王子。船帆忽然全部张开，大船重新航行，可浪越来越高，乌云压住天空，远处一道道闪电亮起。可怕的风暴到了。水手们再次收帆，大船却仍在狂暴的海上飞驰。巨浪高得像山，仿佛要漫过桅顶。船像一只天鹅，先钻进深深的浪谷，又被推上雪白的浪峰。小美人鱼觉得这像快活的游戏，水手们却只顾着拼命求生。
        - id: ch02-b04
          speaker: narrator
          text: 船身发出痛苦的嘎嘎声，厚木板被扑上甲板的海水击裂，主桅像一根芦秆那样折断。船向一边翻过去，海水猛地灌了进去。小美人鱼这才明白，人类正遇上致命的危险，就连她自己也得避开水面上的断梁和碎板。四周一度黑得什么也看不见，紧接着，一道闪电照亮了整片海。她看见船上的所有人，却怎么也找不到王子。船裂开时，她曾看着他沉下去，还一度以为他终于能来到自己身边。可她马上想起，人不能在水里呼吸。等王子到了父王的宫殿，他早已死了。
        - id: ch02-b05
          speaker: narrator
          text: 不，他不能死。小美人鱼在断梁和碎板之间寻找，忘了自己也可能被撞得粉碎。她潜进黑水，又被波浪托起，终于来到王子身边。他已经没有力气，四肢失去知觉，双眼紧闭。她托住他的头，让他的脸一直露在水面上，任浪把他们带向远方。
        - id: ch02-b06
          speaker: narrator
          text: 清晨，风暴停了，大船连一块碎片也没留下。红日照在王子脸上，让他的面颊恢复了血色，眼睛却仍然闭着。小美人鱼拨开他脸上的湿发，吻了吻他的额头。他像极了她花园里的大理石少年。她又吻了一次，只盼他能活下来。
        - id: ch02-b07
          speaker: narrator
          text: 过了不久，陆地终于出现了。蓝色高山覆着白雪，看上去像栖着一群天鹅。岸边树林青翠，附近还有一座高大的白色建筑，她分不清那是教堂还是修道院。花园里种着橙树和香橼树，大门前立着高高的棕榈。这里的海围成一处平静的小湾，水却很深。她带王子游到细白的沙滩，让他躺在温暖的阳光里，又仔细把他的头垫高。钟声从白色建筑里传来，一群少女走进花园。小美人鱼赶紧离开岸边，藏到几块露出水面的岩石后面。她用海沫遮住头颈，不让人看见自己的脸，静静等着王子的命运。
        - id: ch02-b08
          speaker: narrator
          text: 一位少女发现了王子，先是吃惊，随后叫来许多人。王子醒来，对围着他的人微笑，却没有对小美人鱼微笑，因为他根本不知道是谁救了自己。王子被扶进白色建筑，她伤心地沉入海中，回到父王的宫殿。
        - id: ch02-b09
          speaker: narrator
          text: 她本来就沉默而爱思索，从此话更少了。姐姐们追问她第一次浮上海面看见了什么，她一句也不肯讲。许多个清晨和黄昏，她都游回那片留下王子的海滩，远远望着岸边。她看见园里的果实一点点成熟，后来又被人摘走。山顶厚厚的积雪也渐渐融化，可王子始终没有出现。她每次回家，都比上一次更加悲伤。唯一的安慰，就是坐进自己的小花园，用双臂搂住那尊酷似王子的大理石像。她再也没有心思照料花朵，花草便在小径上胡乱生长，长长的叶片和柔软的茎缠上树枝，整个花园都变得阴暗而凄凉。
        - id: ch02-b10
          speaker: narrator
          text: 最后，她把秘密告诉了一位姐姐。消息很快传遍姐妹，又传到认识王子的美人鱼那里。姐姐们终于知道了他的国家和宫殿。
        - id: ch02-b11
          speaker: sisters
          text: 来吧，小妹妹，我们带你去找他。
        - id: ch02-b12
          speaker: narrator
          text: 姐妹们手挽着手游到王子的宫殿。整座宫殿用闪亮的浅黄色石头砌成，一层层大理石台阶从宫门向下延伸，其中一道一直伸进海里。华丽的镀金圆顶高高耸在屋顶上，环绕宫殿的柱子之间，立着一尊尊像真人一样的大理石雕像。从高窗的水晶玻璃望进去，能看见富丽的房间，里面挂着昂贵的丝帘和壁毯，墙上铺满悦目的图画。最大厅堂的正中央，一座喷泉把闪亮水柱高高射向屋顶的玻璃圆顶。阳光穿过圆顶，照在喷泉的水流上，也照亮水池边的美丽植物。
        - id: ch02-b13
          speaker: narrator
          text: 从此，小美人鱼常常整夜留在宫殿附近。她比姐姐们任何一个都敢靠近岸边，有一次甚至游进狭窄的水道，坐到大理石阳台下面。阳台把宽阔的影子投在水面上，她躲在那里看着王子，王子却以为灿烂的月光下只有自己。许多傍晚，她又藏进青绿的芦苇，看王子乘着漂亮的小船出游。船上传来音乐，旗帜迎风飘扬。风要是吹起她银白色的长面纱，远处看见的人只当那是一只天鹅展开双翼。
        - id: ch02-b14
          speaker: narrator
          text: 许多个夜晚，渔夫们举着火把出海。她藏在附近，听他们讲王子做过的许多好事，便为自己救了他而欢喜。她记得他的头曾枕在自己胸前，也记得自己怎样深情地吻过他，可王子对此一无所知，连梦里都不会见到她。她越来越爱人类，也越来越想走进他们辽阔的世界。那里有越过海洋的船，有高过云层的山，也有望不到尽头的土地、森林和田野，那些地方一直延伸到她目光不能到达的远处。她想知道的事情实在太多，姐姐们答不上所有问题，她只好再去问熟知海上诸国的老祖母。
    - id: ch03
      title: 灵魂的代价
      blocks:
        - id: ch03-b01
          speaker: little_mermaid
          text: 人类只要不淹死，就能一直活下去吗？他们也会像海里的人一样死吗？
        - id: ch03-b02
          speaker: grandmother
          text: 人类当然也会死，而且寿命比我们短。我们有时能活三百年，可死后只会变成海上的泡沫，连坟墓也没有，更不会再次活过来。人类却有不灭的灵魂。身体化成尘土以后，灵魂仍会穿过清澈的天空，升到群星之外。就像我们浮上海面看见陆地，他们也会到达一个我们永远看不到的光明世界。
        - id: ch03-b03
          speaker: little_mermaid
          text: 为什么我们没有不灭的灵魂？只要还有希望，能在将来去往群星之上的光明世界，我愿意放弃几百年的寿命，哪怕只做人类一天。
          emotion: sad
        - id: ch03-b04
          speaker: grandmother
          text: 千万别这样想。我们的日子比人类长，也比他们幸福得多。
        - id: ch03-b05
          speaker: little_mermaid
          text: 可我最后还是会死，变成海上的泡沫，再也听不到波涛，也看不到花朵和红太阳。真的没有办法让我得到一个不灭的灵魂吗？
          emotion: sad
        - id: ch03-b06
          speaker: grandmother
          text: 没有，除非有一个男人爱你胜过父母，把全部心思和爱都交给你，还在牧师面前牵着你的手，答应今生来世都忠于你。那样，他的灵魂才会流进你的身体，让你分享人类来世的幸福，而他自己的灵魂并不会减少。可这种事不会发生。我们眼里美丽的鱼尾，人类却觉得难看。他们偏要两根粗笨的支柱，也就是所谓的腿，才觉得漂亮。
        - id: ch03-b07
          speaker: narrator
          text: 小美人鱼低头看着自己的鱼尾，悲伤地叹息。
        - id: ch03-b08
          speaker: grandmother
          text: 高兴一点吧。我们能活三百年，就尽情跳舞玩耍。等漫长的日子过完，再舒舒服服地睡去。今晚宫里还有舞会呢。
        - id: ch03-b09
          speaker: narrator
          text: 那场舞会有陆地上绝对看不到的壮丽。宽阔舞厅的墙壁和天花板都是厚厚的透明水晶。几百只深红或草绿的大贝壳排在两侧，壳里的蓝色火焰照亮整座大厅，光又穿过墙壁，把外面的海水也照亮了。数不清的鱼儿从水晶墙外游过，有的鳞片泛着紫光，有的闪着银色和金色。一道宽阔的水流穿厅而过，男女人鱼就在水中舞蹈，用自己的甜美歌声伴奏。陆地上没有谁能唱得这样动听，小美人鱼又唱得比所有人都好。宫廷上下拍着手、摆着尾巴为她喝彩。那一刻，她也为自己拥有海洋和陆地上最美的声音而欢喜。可这份欢喜很快消失了。她又想起海面上的世界，想起迷人的王子，也想起自己没有他那样不灭的灵魂。
        - id: ch03-b10
          speaker: narrator
          text: 她悄悄离开满是歌声的宫殿，独自坐进小花园。一阵号角声穿过海水，她猜王子正在上面航行。她愿意把一生的幸福交到他手里，也愿意为了他和不灭的灵魂冒一切风险。于是，她决定去找自己一直害怕的海巫婆。
        - id: ch03-b11
          speaker: narrator
          text: 小美人鱼从没走过通往巫婆住处的路。那里没有花草，只有光秃秃的灰沙，一直伸向冒着白沫的旋涡。海水像飞快转动的磨轮，把抓住的一切都抛进无底深渊。她必须从这些能碾碎万物的旋涡旁穿过，再游过一大片温热冒泡的泥沼。巫婆把那片地方叫作泥炭地。泥沼后面才是巫婆领地里的怪树林。这里所有的树和花都是珊瑚虫，一半像动物，一半像植物，又像从地里长出来的百头蛇。枝条是细长黏滑的手臂，从根部到尖端，都长着虫子般蠕动的手指。它们抓住海里一切够得着的东西，死死扣住，绝不会松开。
        - id: ch03-b12
          speaker: narrator
          text: 小美人鱼吓得停住，心怦怦直跳，几乎想回家。她想起王子和渴望的灵魂，勇气又回来了。她把长发缠紧，双手交在胸前，像鱼一样冲过伸向两旁的手臂。那些珊瑚虫抓着遇难者的白骨、动物骨架、船桨、船舵和箱子，甚至抓死了一个小美人鱼。没有什么比这一幕更让她恐惧。
        - id: ch03-b13
          speaker: narrator
          text: 小美人鱼终于来到树林中央的一片泥泞空地。肥大的水蛇在泥里来回翻滚，露出灰褐色的丑陋身体。空地正中立着巫婆的房子，墙壁竟是用遇难者的骨头搭起来的。海巫婆坐在里面，让一只癞蛤蟆直接从自己嘴里吃东西，就像陆地人拿糖喂金丝雀。那些难看的水蛇爬满她的胸膛，她却亲热地把它们叫作自己的“小鸡”。
        - id: ch03-b14
          speaker: sea_witch
          text: 我知道你为什么来。你真傻，不过我会成全你，也会让你尝到悲哀。你想把鱼尾换成两条腿，让年轻王子爱上你，还想得到不灭的灵魂。
        - id: ch03-b15
          speaker: narrator
          text: 巫婆发出刺耳的狂笑，癞蛤蟆和水蛇都被震落到地上。
        - id: ch03-b16
          speaker: sea_witch
          text: 你来得正好。过了明天日出，我就要等一年才能再帮你。我会调一服药。日出前，你带着它游到陆地，坐在岸边喝下去，鱼尾就会缩成人类的腿。那会像一把剑穿过你的身体。醒来以后，人人都会说你美得从未见过。你的脚步会比任何舞者都轻，可每走一步，都像踩在尖刀上，鲜血几乎要流出来。你要是忍得住，我就帮你。
        - id: ch03-b17
          speaker: little_mermaid
          text: 我忍得住。
          emotion: fearful
        - id: ch03-b18
          speaker: sea_witch
          text: 再想清楚。你一旦变成人，就永远做不回美人鱼，也回不了父王和姐姐们身边。王子若不爱你胜过父母，不同你在牧师面前结为夫妻，你就得不到灵魂。他娶别人的第二天早晨，你的心会碎掉，你也会变成浪尖上的泡沫。
        - id: ch03-b19
          speaker: little_mermaid
          text: 我愿意。
        - id: ch03-b20
          speaker: sea_witch
          text: 我还要收取报酬，而且绝不便宜。海底数你的歌声最甜美，你原想用它迷住王子，可我要拿走的正是声音。我要你最珍贵的东西，再把自己的血放进药里，让药像双刃剑一样锋利。
        - id: ch03-b21
          speaker: little_mermaid
          text: 如果你拿走我的声音，我还能留下什么？
        - id: ch03-b22
          speaker: sea_witch
          text: 你还有美丽的脸、轻盈的脚步和会说话的眼睛。这些还不够抓住男人的心吗？怎么，你怕了？伸出舌头，让我割下来抵偿药钱。
        - id: ch03-b23
          speaker: little_mermaid
          text: 那就这样吧。
        - id: ch03-b24
          speaker: narrator
          text: 巫婆把大锅架上火。
        - id: ch03-b25
          speaker: sea_witch
          text: 锅子总该洗干净。
        - id: ch03-b26
          speaker: narrator
          text: 她抓来一把蛇，把它们缠成一个大结，用这团蛇刷洗锅子。随后，她刺破自己的胸膛，让黑色的血一滴滴落进锅里。升起的蒸汽变成种种可怕的形状，谁看了都会害怕。巫婆还不断把新的东西扔进去。锅里的液体沸腾起来，发出的声音像鳄鱼在哭。最后，药水终于煮好了，模样却和最清澈的水一样。
        - id: ch03-b27
          speaker: sea_witch
          text: 拿去吧。回程若有珊瑚虫抓你，就洒几滴药水，它们的手指会裂成一千片。
        - id: ch03-b28
          speaker: narrator
          text: 巫婆割下小美人鱼的舌头。从此，她再也不能说话，也不能歌唱。她带着闪着星光的药水离开，珊瑚虫一看见药瓶就害怕地缩回去，她根本不必动用它。
        - id: ch03-b29
          speaker: narrator
          text: 她飞快游过树林、泥沼和汹涌的旋涡。回到父王宫殿时，舞厅的火炬已经熄灭，所有人都睡着了。她不敢再走进去。如今她不能说话，又将永远离开他们，心几乎要碎了。她悄悄来到花园，从每个姐姐的花坛里摘下一朵花，朝宫殿送去数不清的飞吻，这才升进深蓝的海水。她远远看见王子的宫殿。等她来到那座美丽的大理石阶前，太阳还没升起，清澈的月亮依然照着海面。
    - id: ch04
      title: 沉默的陪伴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 月亮还明亮地照着，太阳尚未升起。小美人鱼来到王宫的大理石阶前，一口喝下药水。她只觉得一把双刃剑穿过身体，随即倒在地上，像死去一样。太阳升出海面时，她在剧痛中醒来，年轻王子正站在她面前，用黑眼睛看着她。她低下头，发现鱼尾已经变成一双洁白秀气的腿和小脚。
        - id: ch04-b02
          speaker: narrator
          text: 她身上一件衣服也没有，只能用浓密长发遮住身体。王子问她是谁，又问她从哪里来，她却只能用深蓝的眼睛温柔而悲伤地望着他，一个字也回答不了。她试着迈步，每一步都像踩在针尖和刀刃上。可她甘愿忍受，仍然像水泡一样轻盈地走在王子身旁。王子和所有见到她的人，都惊叹于那种摇曳又优美的步态。她很快穿上昂贵的丝绸和轻薄纱衣，成了宫里最美的人，却也是一个不能说话、不能歌唱的哑女。
        - id: ch04-b03
          speaker: narrator
          text: 美丽的女奴们穿着丝绸衣裳，身上佩着金饰，来到王子和他的父母面前唱歌。其中一位唱得格外出色，王子听完便拍手，还向她微笑。小美人鱼看着这一切，心里难过极了。她清楚记得，自己从前的歌声比这还要甜美得多。要是王子能够知道该多好。可为了陪在他身边，她已经把自己的声音永远舍弃了。
        - id: ch04-b04
          speaker: narrator
          text: 随后，女奴们跟着美妙的音乐跳起轻盈的舞。小美人鱼也抬起雪白的双臂，踮起脚尖，从地面轻轻滑过。没有人见过这样的舞姿。她越跳越显得美丽，那双会说话的眼睛，比女奴们的歌声更能打动人心。所有人都被她迷住了，尤其是王子。他把她叫作自己“捡来的小姑娘”。为了让王子高兴，她欣然又跳了一次，哪怕每次脚掌碰到地面，都像落在尖刀上。
        - id: ch04-b05
          speaker: narrator
          text: 王子要她永远留在自己身边，还让她睡在房门外的天鹅绒垫子上。他叫人给她做了一身侍童服，好让她陪着自己骑马。他们并肩穿过芳香的森林，绿色枝条轻轻拂过肩头，小鸟在嫩叶间歌唱。她还跟随王子登上高山。柔嫩的双脚磨出了血，一路留下鲜红的足印，她却只对王子微笑，继续往上走。最后，他们登得那么高，云朵像一群正飞向远方的鸟，出现在两人的脚下。
        - id: ch04-b06
          speaker: narrator
          text: 每当宫里的人睡去，她就坐到宽阔的石阶上，把灼痛的脚浸进冰凉海水。只有这样，疼痛才会轻一些，她也总在这时想起深海里的亲人。
        - id: ch04-b07
          speaker: narrator
          text: 一天夜里，姐姐们手挽着手浮出水面，忧伤地唱着歌。小美人鱼向她们招手，她们这才认出岸上的女孩就是妹妹，并告诉她，她的离开让一家人多么悲痛。从那以后，姐姐们每晚都来看她。有一次，她还远远望见了多年不曾浮上海面的老祖母和父亲海王。老祖母戴着银冠，父王头上是自己的王冠。他们都向她伸出双手，却不敢像姐姐们那样游近陆地。
        - id: ch04-b08
          speaker: narrator
          text: 小美人鱼一天比一天更爱王子。王子也爱她，却只是把她当作孩子，从没想过娶她。如果他不娶她，她就得不到不灭的灵魂。他同别人结婚后的第一个早晨，她还会化成海上的泡沫。
        - id: ch04-b09
          speaker: narrator
          text: 有一次，王子把她抱在怀中，亲吻她的额头。她的眼睛像是在问，他是不是最爱她。
        - id: ch04-b10
          speaker: prince
          text: 是的，你对我很珍贵。你的心最善良，也最忠诚。你很像一个我见过两次、却再也遇不到的少女。我的船沉了，海浪把我送到圣殿附近。是那里最年轻的少女在沙滩上发现我，救了我的命。世上只有她能让我爱上。可你太像她了，几乎要把她的影子从我心里赶走。她属于圣殿，幸好命运把你送到我身边。我们永远不要分开。
        - id: ch04-b11
          speaker: narrator
          text: 小美人鱼在心里叹息。王子不知道，救他的人明明是她。是她托着他渡过大海，把他送到圣殿旁的树林。也是她藏在海沫下面，看着人类赶来救他。她亲眼见过那位美丽少女，也明白王子爱那少女胜过爱自己。想到这里，她深深叹息，却连一滴眼泪也流不出来。
        - id: ch04-b12
          speaker: narrator
          text: 她又安慰自己，王子以为那少女永远不会离开圣殿，他们再也见不到了。自己却能天天守着他，照顾他，爱他，甚至愿意为他献出生命。
        - id: ch04-b13
          speaker: narrator
          text: 不久，宫中传出消息。王子必须结婚，邻国国王的女儿可能会成为新娘，一艘华美的大船也在为远行做准备。王子说自己只是去拜访邻国国王，人人却猜他是去看公主。小美人鱼只是微笑摇头。她相信自己最懂王子的心。
        - id: ch04-b14
          speaker: prince
          text: 我得去见那位公主，这是父母的愿望。不过他们不能逼我娶她。我不会爱她，她又不像圣殿里救我的少女。倒是你更像那个人。要是一定得选新娘，我宁愿选你，我那双眼睛会说话、嘴巴却不能开口的小姑娘。
        - id: ch04-b15
          speaker: narrator
          text: 王子吻了她的嘴唇，抚着她的长发，又把头靠在她心口。她便梦想着人间的幸福和不灭的灵魂。
        - id: ch04-b16
          speaker: prince
          text: 我不会说话的孩子，你不怕大海吧？
        - id: ch04-b17
          speaker: narrator
          text: 他们站在驶往邻国的大船上。王子给她讲风暴和平静的海，讲深水中的怪鱼，也讲潜水人见过的景象。她只是微笑，因为没有人比她更了解海底。
        - id: ch04-b18
          speaker: narrator
          text: 到了月光照耀的夜里，除了掌舵的人，船上所有人都睡了。她独自坐在甲板上，透过清澈海水向下凝望。她觉得自己仿佛能认出父王的宫殿，也能看见戴着银冠的老祖母站在奔流里，仰头望着船底。接着，姐姐们浮上浪头，悲伤地看着她，绞着雪白的双手。她向她们挥手，又露出微笑，真想告诉她们，自己过得多么幸福安好。一个船童忽然走来，姐姐们立刻潜进水中，他只以为刚才看见了一片海上泡沫。
    - id: ch05
      title: 王子的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天早晨，大船驶进邻国一座美丽城市的港口。教堂钟声响个不停，高塔上也传来嘹亮的号角。士兵举着迎风飘扬的旗帜，刺刀在阳光下闪亮，沿着船经过的礁岸整齐列队。接下来的每一天都像节日，舞会刚结束，宴饮又开始了。可是公主一直没有露面。人们说，她正在一所宗教学校里受教，要在那里学习王室的一切美德。
        - id: ch05-b02
          speaker: narrator
          text: 公主终于出现了。小美人鱼早就急着看看她究竟有多美，见到以后，却不得不承认，自己从没见过这样完美的人。公主的皮肤白皙又细嫩，深色的长睫毛下面，一双蓝眼睛含着笑，闪耀着真挚和纯洁。
        - id: ch05-b03
          speaker: prince
          text: 原来是你！那天我像死了一样躺在海滩上，救我的人就是你。
          emotion: surprised
        - id: ch05-b04
          speaker: narrator
          text: 王子把脸红的新娘抱进怀里。
        - id: ch05-b05
          speaker: prince
          text: 我太幸福了！我最深的愿望全都实现了。你一定也会为我高兴，因为你待我一直那么深、那么真。
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 小美人鱼吻了吻他的手，只觉得心已经碎了。婚礼后的清晨，她就会死去，化成海上的泡沫。所有教堂的钟都响起来，传令官骑马穿过一座座城镇，向人们宣布婚约。每座祭坛上，昂贵的银灯都燃着芳香的油脂。牧师挥动香炉，新郎新娘把手合在一起，接受主教的祝福。小美人鱼穿着丝绸和金衣，站在他们身后，为新娘托着长长的裙裾。喜庆的音乐和神圣的仪式，她全都听不进，也看不见。她心里只有即将到来的死亡之夜，还有自己在这个世界上失去的一切。
        - id: ch05-b07
          speaker: narrator
          text: 当晚，新婚夫妇登上大船。炮声轰鸣，旗帜飞扬，船中央搭起一顶紫色和金色的华贵帐篷，里面放着精美卧榻，准备让新人夜间休息。船帆被顺风吹得鼓鼓的，大船轻盈又平稳地滑过静海。天黑以后，一盏盏彩灯亮起，水手们在甲板上快活地跳起舞来。
        - id: ch05-b08
          speaker: narrator
          text: 小美人鱼想起了自己第一次浮上海面时看见的庆典。她也加入舞蹈，像追逐猎物的燕子那样跃起，所有人都惊叹喝彩。她从没跳得这样美。尖刀般的疼痛割着双脚，她却感觉不到，因为心里还有更锋利的痛。
        - id: ch05-b09
          speaker: narrator
          text: 她知道，这是自己最后一次看见王子。为了他，她离开亲人和故乡，交出了世上最美的歌喉，天天忍受从未经历过的剧痛，他却什么都不知道。这也是她最后一次和他呼吸同样的空气，最后一次同他一起仰望星空和深海。没有思想、没有梦境的永夜正在等她。她本来就没有灵魂，如今也再得不到一个了。
        - id: ch05-b10
          speaker: narrator
          text: 船上的庆典一直持续到午夜以后。她同众人一起欢笑跳舞，心里却始终藏着死亡的念头。王子亲吻美丽的新娘，新娘轻轻抚摸他的黑发。最后，两个人手挽着手，走进华丽的帐篷休息。甲板上的声音一点点消失，整艘船终于安静下来，只剩舵手醒着，守在船舵旁边。小美人鱼把雪白的手臂搭在船舷上，独自望着东方。她在等天边出现第一抹红光，也在等第一缕晨光给自己带来死亡。
        - id: ch05-b11
          speaker: narrator
          text: 她正等待时，姐姐们忽然从海里升起。她们的脸和妹妹一样苍白，曾经迎风飘动的美丽长发却全都不见了，原来已经被齐齐剪掉。
        - id: ch05-b12
          speaker: sisters
          text: 我们把头发交给巫婆，求她救你。她给了我们这把锋利的刀。太阳升起以前，你得把刀刺进王子的心。只要他的热血落在你的脚上，两条腿就会重新合成鱼尾。你能回到我们身边，再活三百年，最后才化成海沫。快动手！日出以前，你和他必须死一个。老祖母哭得白发一根根脱落，就像我们的头发落在巫婆剪刀下一样。杀了王子，回来吧！天边已经亮了，再过几分钟，你就要死了！
          emotion: sad
        - id: ch05-b13
          speaker: narrator
          text: 姐姐们深深叹息，沉入浪下。小美人鱼掀开绯红帐帘，看见新娘把头枕在王子胸前。她俯身吻了吻王子的额头，再抬头时，玫瑰色晨光已经越来越亮。她看看手里的尖刀，又凝望王子。王子在梦中叫着新娘的名字，他心里仍然只有她。
        - id: ch05-b14
          speaker: narrator
          text: 刀在小美人鱼手中发抖。忽然，她把刀远远抛进大海。刀落下的地方，海水红了，飞起的水珠像鲜血。她依依不舍地看了王子最后一眼，身体几乎倒下，随后纵身跳进海里，以为自己正在化成泡沫。
    - id: ch06
      title: 天空的女儿
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 太阳从浪涛间升起，温暖的光落在小美人鱼冰冷的泡沫上。可她并不觉得自己正在死去。明亮的太阳依然在眼前，身边还漂浮着几百个美丽透明的生灵。透过它们透明的身体，她仍能看见船上的白帆和天空的红云。它们的声音悦耳又空灵，尘世的耳朵根本听不见，就像凡人的眼睛也看不见它们一样。
        - id: ch06-b02
          speaker: narrator
          text: 小美人鱼发现，自己也有了同样透明的身体，正从泡沫中越升越高。
        - id: ch06-b03
          speaker: little_mermaid
          text: 我这是在哪里？
          emotion: surprised
        - id: ch06-b04
          speaker: narrator
          text: 她重新拥有了声音，可那声音也像这些生灵一样空灵，世上的音乐都无法模仿。
        - id: ch06-b05
          speaker: air_spirit
          text: 你来到了天空的女儿中间。美人鱼没有不灭的灵魂，除非她赢得一个人类的爱，否则永远也得不到灵魂。她的永恒命运，只能系在别人手中。天空的女儿同样没有不灭的灵魂，可我们能靠善行，亲手为自己赢得一个。我们飞到炎热的国度，让清凉的微风赶走会给人类带来瘟疫的暑热。我们也把花朵的香气送往四面八方，给人们带去健康，让万物重新恢复生机。只要尽力行善三百年，我们就能得到不灭的灵魂，分享人类来世的幸福。
        - id: ch06-b06
          speaker: air_spirit
          text: 可怜的小美人鱼，你曾经全心追求同一个目标。你受过苦，也忍耐过，又用自己的善行升进精灵的世界。从今天起，只要同我们一起努力三百年，你也能得到一个不灭的灵魂。
        - id: ch06-b07
          speaker: narrator
          text: 小美人鱼抬起焕发光彩的眼睛望向太阳。她生平第一次感到泪水涌进眼眶。她离开的船上又响起声音，王子和美丽的新娘正在四处寻找她。他们悲伤地望着珍珠般的泡沫，仿佛已经知道她投进了海浪。她来到无人能看见的地方，轻轻吻了吻新娘的额头，又给王子送去一阵清风。随后，她跟着其他天空的孩子，一起升向苍穹中飘浮的玫瑰色云朵。
        - id: ch06-b08
          speaker: little_mermaid
          text: 三百年以后，我们就会这样飘进天国。
        - id: ch06-b09
          speaker: air_spirit
          text: 也许还能早些到达。我们会悄悄飞进人类的屋子。每当看见一个给父母带来欢乐、也值得父母疼爱的好孩子，我们都会因为他的好行为而高兴地微笑，三百年的考验就能少算一年。孩子并不知道我们曾经飞过他的房间。可要是看见一个顽皮或邪恶的孩子，我们就会流下伤心的眼泪。每落下一滴泪，考验就要再多上一天。
