audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点含蓄的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中
    snow_man:
      display_name: 雪人
      tts:
        delivery: 天真认真，想到什么就直说
        timbre: 清亮而略显脆生
        pace: 稍慢
        pitch: 中高
    yard_dog:
      display_name: 看院老狗
      tts:
        delivery: 见多识广，爱挖苦人，叫声嘶哑
        timbre: 粗哑低沉
        pace: 不紧不慢
        pitch: 低
    young_woman:
      display_name: 年轻姑娘
      tts:
        delivery: 明快自然
        timbre: 清脆
        pace: 轻快
        pitch: 中高
    young_man:
      display_name: 年轻男子
      tts:
        delivery: 亲切爽朗
        timbre: 明亮
        pace: 自然
        pitch: 中
    house_girl_1:
      display_name: 姑娘甲
      tts:
        delivery: 轻盈欢快，歌声明朗
        timbre: 清亮透彻
        pace: 轻快流畅
        pitch: 中高
    house_girl_2:
      display_name: 姑娘乙
      tts:
        delivery: 温柔愉快，歌声舒展
        timbre: 柔和圆润
        pace: 从容流畅
        pitch: 中
    house_girl_3:
      display_name: 姑娘丙
      tts:
        delivery: 活泼欢畅，歌声灵动
        timbre: 清脆明快
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 红太阳与圆月亮
      blocks:
        - id: ch01-b01
          speaker: snow_man
          text: “冷得真叫人痛快，我全身都冻得咔咔响！这样的风一吹，我才觉得自己活起来了。上头那个红彤彤的大东西，怎么老盯着我？它可别想让我眨眼，我一定能管住脸上这两块东西。”
        - id: ch01-b02
          speaker: narrator
          text: 雪人说的是正在落山的太阳。他的眼睛是两片三角形瓦片，嘴巴来自一把破旧的耙子，耙齿自然成了他的牙齿。男孩子们欢呼着把他堆起来，他就是在那片欢呼声中有了生命。那时候，雪橇铃叮当响，鞭子也抽得啪啪响。现在太阳沉下去了，一轮又大又圆的满月升上深蓝的天空，照得清清楚楚。
        - id: ch01-b03
          speaker: snow_man
          text: “瞧，它又从另一边出来了！不过我已经治好了它盯人的毛病。就让它挂在那里发光吧，正好让我看清自己。我要是知道怎么离开这儿就好了，我真想动一动。要是能动，我就像那些男孩子一样，从那边的冰上滑过去。可我不知道怎么滑，连跑也不会。”
        - id: ch01-b04
          speaker: yard_dog
          text: “走啦，走啦！总有一天，太阳会让你跑起来。去年冬天，你的前任就是被它赶跑的，前任的前任也一样。一个都留不住。”
        - id: ch01-b05
          speaker: narrator
          text: 说话的是看院老狗。他以前住在屋里，卧过火炉边，从那以后嗓子一直很哑，连“汪汪”也叫不清楚。
        - id: ch01-b06
          speaker: snow_man
          text: “伙计，我听不懂。上头那东西会教我跑吗？刚才它明明自己跑掉了，怎么又从另一边慢慢爬上来？”
        - id: ch01-b07
          speaker: yard_dog
          text: “你才刚刚被拼起来，当然什么都不懂。现在这个是月亮，先前那个才是太阳。明天太阳还会来，多半会教你一路跑进井边的沟里。我左腿又刺又痛，天气准要变。”
        - id: ch01-b08
          speaker: snow_man
          text: “我还是不懂。不过他说的准不是好事。刚才瞪我的那个太阳，也一定不是我的朋友。”
        - id: ch01-b09
          speaker: narrator
          text: 老狗又哑着嗓子叫了两声“走啦，走啦”，原地转了三圈，钻进狗窝睡觉了。
    - id: ch02
      title: 白霜里的恋人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 天气真的变了。快到早晨时，浓雾盖住四周的田野，刺骨的风刮起来，冷得人骨头都要冻住。太阳一升起来，眼前却美极了。树木和灌木全披着白霜，远远看去，就像一片白珊瑚林。每一根细枝上，都有冻住的露珠闪闪发亮。夏天时，浓密的叶子把枝条种种纤巧的形状都遮住了。如今那些形状清清楚楚地露出来，好像一道道晶亮的花边，每根枝条上都泛着白光。桦树在风里摇动，鲜活得仿佛仍在夏天，模样美得出奇。阳光照到哪里，哪里就闪个不停，仿佛有人撒了一层钻石粉。大地铺着雪毯，也像镶满了钻石。数不清的光从雪里亮起来，竟比雪本身还白。
        - id: ch02-b02
          speaker: young_woman
          text: “太美了！夏天也不会有比这更好看的景色。”
        - id: ch02-b03
          speaker: narrator
          text: 一位年轻姑娘和一位年轻男子走进花园，在雪人旁边停下。姑娘望着那片闪亮的景色，眼睛也在发光。
        - id: ch02-b04
          speaker: young_man
          text: “而且到了夏天，我们就见不到这样的好家伙了。他可真棒！”
        - id: ch02-b05
          speaker: narrator
          text: 年轻男子指着雪人。姑娘笑着向雪人点点头，和伙伴轻快地踏雪离去。她每走一步，脚下都吱嘎作响，像踩着浆硬的布。
        - id: ch02-b06
          speaker: snow_man
          text: “他们是谁？你在这里待得久，一定认识吧？”
        - id: ch02-b07
          speaker: yard_dog
          text: “当然认识。姑娘摸过我很多次，那个年轻人还给过我带肉的骨头。我从来不咬他们。”
        - id: ch02-b08
          speaker: snow_man
          text: “可是，他们到底是什么？”
        - id: ch02-b09
          speaker: yard_dog
          text: “是一对恋人。过不了多久，他们就会住进同一个窝，啃同一根骨头。走啦，走啦！”
        - id: ch02-b10
          speaker: snow_man
          text: “他们跟我们是同一种东西吗？”
        - id: ch02-b11
          speaker: yard_dog
          text: “反正都属于同一个主人。昨天才出生的人，懂得就是少，这在你身上看得再清楚不过。我年纪大，也见过世面，屋里每个人都认识。我还记得，以前有一段日子，我不用拴着链子，躺在外面的冷风里。走啦，走啦！”
        - id: ch02-b12
          speaker: snow_man
          text: “我倒觉得越冷越舒服。快接着讲吧！只是别把链子弄得哗啦响，那声音震得我全身难受。”
    - id: ch03
      title: 老狗与火炉
      blocks:
        - id: ch03-b01
          speaker: yard_dog
          text: “那时候，他们都说我是个漂亮的小家伙。我睡在主人楼上那把蒙着天鹅绒的椅子里，也坐在女主人的膝头。他们会亲我的鼻子，用绣花手帕擦我的爪子，还叫我‘阿米，亲爱的阿米，甜心阿米’。后来我长得太大，他们就不要我住在那里了，把我送到楼下女管家的房间。”
        - id: ch03-b02
          speaker: yard_dog
          text: “你站在这儿，就能望进那间屋子，看看我从前当主人的地方。我在女管家那里可真像个主人。那间屋子虽然比楼上的小，我却住得舒坦多了。孩子们不会再像以前那样，老把我抱起来，又拉又扯。我的饭一点儿也不差，有时还更好。我有自己的垫子，屋里还有一只火炉。在这种天气里，没有比它更妙的东西。我总钻到炉子下面，紧贴着炉底躺着。直到现在，我还会梦见它。走啦，走啦！”
        - id: ch03-b03
          speaker: snow_man
          text: “火炉漂亮吗？它跟我像不像？”
        - id: ch03-b04
          speaker: yard_dog
          text: “它跟你正相反。它黑得像乌鸦，脖子长长的，还有个黄铜把手。它会把木柴吃下去，接着火焰就从嘴里喷出来。只要待在它旁边，或者钻到它下面，就舒服得很。你站在这里，隔着窗户就能看见。”
        - id: ch03-b05
          speaker: narrator
          text: 雪人朝窗里一望，果然看见一个擦得锃亮的东西，黄铜把手也在发光，下半截还有火焰闪动。一种从未有过的奇怪感觉忽然涌遍他的身体。他弄不懂那是什么，也说不出为什么会这样。不过，世上那些不是雪人的人，倒明白这是怎么回事。
        - id: ch03-b06
          speaker: snow_man
          text: “那你为什么离开她？那么舒服的地方，你怎么舍得走？”
        - id: ch03-b07
          speaker: narrator
          text: 雪人已经认定，火炉一定是一位女子。
        - id: ch03-b08
          speaker: yard_dog
          text: “我不是自己要走，是他们把我赶出屋子，拴在这里。主人最小的儿子踢开我正在啃的骨头，我就在他腿上咬了一口。我当时想，他踢我的骨头，我也咬他的骨头。可他们气坏了。从那以后，我一直被链子拴着，连骨头也丢了。你听，我的嗓子就是这样哑的。我再也不能像别的狗那样说话了。走啦，走啦！这件事就这么完了。”
    - id: ch04
      title: 害了相思火炉病
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 雪人已经听不进老狗的话了。他只顾望着楼下女管家的房间。火炉站在四条铁腿上，看起来跟他差不多大。
        - id: ch04-b02
          speaker: snow_man
          text: “我身体里怎么咔咔响得这么怪？我能不能进到那间屋里去？我的愿望又没有恶意，这样的愿望总该实现吧。我一定要进去靠着她，哪怕打破窗子也要去。”
        - id: ch04-b03
          speaker: yard_dog
          text: “千万别进去！你只要靠近火炉，就会融化，化掉，然后走掉。”
        - id: ch04-b04
          speaker: snow_man
          text: “那我也要去。反正我觉得自己已经快裂开了。”
        - id: ch04-b05
          speaker: narrator
          text: 雪人一整天都站在窗外看。到了黄昏，屋里越发诱人。火炉发着柔和的光，不像太阳，也不像月亮。那是火炉吃饱以后，才会透出来的明亮光辉。炉门一打开，火焰立刻从它嘴里蹿出来，所有火炉向来都是这样。红亮的火光正好落在雪人的脸上和胸前，把那里照得红彤彤的。
        - id: ch04-b06
          speaker: snow_man
          text: “我再也受不了啦！瞧她伸出舌头的样子，多美啊！”
        - id: ch04-b07
          speaker: narrator
          text: 这一夜很长，雪人却一点儿也没觉得。他一直站在那里，沉浸在自己的遐想里，冻得全身咔咔作响。第二天早晨，女管家房间的窗玻璃结满了冰花。那是任何雪人见了都会喜欢的、最美的冰花，可它们偏偏把火炉遮住了。玻璃一直不化，雪人什么也看不见，只能在心里把火炉想成一位美丽的人。积雪在四周吱嘎作响，寒风呼呼吹过。这原本是雪人最该尽情享受的严寒天气，他却一点儿也快活不起来。谁害了“相思火炉病”，还怎么快活呢？
        - id: ch04-b08
          speaker: yard_dog
          text: “雪人得了这种病，可真够受的。我也得过，不过后来好了。走啦，走啦！天气马上要变了。”
    - id: ch05
      title: 冬天过去了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 天气果然变了，冰雪开始融化。暖意一天天加重，雪人也一天天缩小。他一句话也不说，一声也不抱怨，这正是个确凿的征兆。一天早晨，他突然裂开，整个儿塌了下去。瞧，原来站着雪人的地方，只剩下一根像扫帚柄的杆子，孤零零地戳在地上。男孩子们当初就是围着这根杆子，把雪人堆起来的。
        - id: ch05-b02
          speaker: yard_dog
          text: “啊，我现在明白他为什么那么想念火炉了。杆子上绑着的，不就是清理火炉的铲子吗？”
        - id: ch05-b03
          speaker: narrator
          text: 雪人的身体里原来藏着一把清炉铲，难怪那股念头总在他心里搅动。
        - id: ch05-b04
          speaker: yard_dog
          text: “不过现在，一切都结束啦。走啦，走啦！”
        - id: ch05-b05
          speaker: narrator
          text: 没过多久，冬天也过去了。嗓音嘶哑的看院老狗仍旧不停地一声接一声叫着“走啦，走啦”，屋里的姑娘们却已经唱起了歌。
        - id: ch05-b06
          speakers: [house_girl_1, house_girl_2, house_girl_3]
          ensemble: chorus
          text: “绿百里香，离开芬芳的家，快来吧。柳树呀，舒展你柔软的枝条。月月催来甜美的春光，云雀在天空唱得多欢畅。温柔的太阳快来吧，杜鹃正在歌唱，我一路学着它的声调。”
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: 从此，再也没有谁想起那个雪人。
