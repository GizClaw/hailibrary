  chapters:
    - id: ch01
      title: The Red Shoes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a pretty, delicate little girl named Karen. She was poor, so she had no shoes at all through the summer and went everywhere barefoot. In winter she had to wear large, heavy wooden shoes. They rubbed her little insteps until they were quite red.
        - id: ch01-b02
          speaker: narrator
          text: >-
            An old shoemaker's wife lived in the middle of the village. She did her best to sew Karen a pair of shoes from scraps of red cloth. They were clumsy, but they were made with kindness.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Karen first wore them on the day of her mother's funeral. Red shoes were not right for mourning, but she had nothing else. She slipped her bare feet into them and followed the plain coffin.
        - id: ch01-b04
          speaker: narrator
          text: >-
            A grand old carriage passed by. An old lady sat inside. When she saw Karen, she felt sorry for the child and spoke to the clergyman.
        - id: ch01-b05
          speaker: old_lady
          text: >-
            If you will place the little girl in my care, I will look after her.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Karen thought the red shoes had brought her this good fortune. The old lady thought they were ugly and had them burned. Then she dressed Karen in clean, neat clothes and taught her to read and sew. People called Karen pretty.
        - id: ch01-b07
          speaker: mirror
          text: >-
            You aren't merely pretty. You're beautiful.
        - id: ch01-b08
          speaker: narrator
          text: >-
            One day the Queen traveled through that part of the country with her daughter. Everyone hurried to the castle, Karen among them. The little princess stood at a window in fine white clothes and let the people look at her.
        - id: ch01-b09
          speaker: narrator
          text: >-
            She had no train and no golden crown. What she did have was a beautiful pair of red morocco shoes. They were far finer than the pair made for Karen. To Karen, nothing in the whole world could compare with red shoes.
        - id: ch01-b10
          speaker: narrator
          text: >-
            When Karen was old enough to be confirmed, she received new clothes and went to the rich shoemaker in town for new shoes. His room held tall glass cases filled with pretty shoes and white slippers. The old lady's eyesight was poor, so she could hardly enjoy the sight.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Among them stood a red pair like the princess's. They were beautiful.
        - id: ch01-b12
          speaker: shoemaker
          text: >-
            Those were made for a count's daughter, but they didn't fit her.
        - id: ch01-b13
          speaker: old_lady
          text: >-
            Is that shiny leather? They gleam so brightly.
        - id: ch01-b14
          speaker: karen
          text: >-
            Yes. They really do shine.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The shoes fit Karen, and the old lady bought them. She did not know they were red. If she had known, she would never have let Karen wear them for her confirmation.
        - id: ch01-b16
          speaker: narrator
          text: >-
            From the church door all the way to the choir, everyone looked at Karen's feet. Even the stone figures on the old monuments seemed to stare from their stiff collars and long black robes.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The clergyman laid a hand on Karen's head. He spoke of baptism, her covenant with God, and her duty now that she was a grown Christian. The organ rang solemnly, and children sang with their old leader. Karen thought of nothing but her red shoes.
        - id: ch01-b18
          speaker: narrator
          text: >-
            That afternoon, people told the old lady what Karen had worn.
        - id: ch01-b19
          speaker: old_lady
          text: >-
            Red shoes at your confirmation! That was shocking and completely improper. From now on, you will wear black shoes to church, even if they're old.
          emotion: angry
    - id: ch02
      title: The Dancing Shoes
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next Sunday was Communion. Karen looked at the black shoes, then at the red ones. She looked at the red pair once more and put them on.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The sun shone brightly as Karen and the old lady followed the dusty path through the corn. At the church door, an old disabled soldier leaned on a crutch. His very long beard was more red than white. He bowed low and asked if he might wipe the old lady's shoes. Karen held out one small foot as well.
        - id: ch02-b03
          speaker: old_soldier
          text: >-
            Well, now! Those are lovely dancing shoes. Hold tight when you dance.
        - id: ch02-b04
          speaker: narrator
          text: >-
            He spoke to the shoes themselves and slapped their soles. The old lady gave him some money, and she and Karen went into church.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Inside, every person seemed to watch Karen's red shoes. So did all the carved figures. Karen knelt at the altar and raised the golden cup to her lips, but she thought only of the shoes. They seemed to float in the cup. She forgot the hymn and even the Lord's Prayer.
        - id: ch02-b06
          speaker: narrator
          text: >-
            After church, the old lady climbed into her carriage. Karen was lifting her foot to follow when the soldier spoke again.
        - id: ch02-b07
          speaker: old_soldier
          text: >-
            Well, now! What lovely dancing shoes!
        - id: ch02-b08
          speaker: narrator
          text: >-
            Karen could not stop herself from dancing a few steps. Once she started, her legs kept going. The shoes seemed to control them. She danced around the corner of the church and could not stop.
        - id: ch02-b09
          speaker: narrator
          text: >-
            The coachman ran after her and caught her. He lifted her into the carriage, but her feet still danced and kicked the kind old lady hard. At last the shoes were pulled off, and Karen's legs became still.
        - id: ch02-b10
          speaker: narrator
          text: >-
            At home, the red shoes went into a cupboard. Karen could not keep herself from looking at them.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Then the old lady became so sick that people said she would never leave her bed again. She needed constant care, and no one had a greater duty to nurse her than Karen.
        - id: ch02-b12
          speaker: narrator
          text: >-
            But a grand ball was being held in town, and Karen had been invited. She looked at the red shoes and told herself there was no sin in looking. Then she put them on and told herself that could do no harm either. She left the sick old lady, went to the ball, and began to dance.
        - id: ch02-b13
          speaker: narrator
          text: >-
            When Karen meant to go right, the shoes went left. When she meant to dance up the room, they carried her down it, down the stairs, through the street, and out beyond the town gates.
        - id: ch02-b14
          speaker: narrator
          text: >-
            She danced because she had to, all the way into the dark woods. Something suddenly shone among the trees. Karen thought it was the moon, because she saw a face. But it was the old soldier with the red beard, nodding as he sat there.
        - id: ch02-b15
          speaker: old_soldier
          text: >-
            Well, now! What lovely dancing shoes!
        - id: ch02-b16
          speaker: narrator
          text: >-
            Karen was terrified and tried to throw the shoes away, but they clung to her. She tore off her stockings. It made no difference. The shoes had grown fast to her feet.
        - id: ch02-b17
          speaker: narrator
          text: >-
            She danced across fields and meadows, through rain and sunshine, by day and by night. The shoes never loosened and never let her rest. She could not stop, and the nights were the worst of all.
    - id: ch03
      title: The Angel's Judgment
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Karen danced into the open churchyard. The dead beneath the graves did not dance. They had better things to do. She tried to sit on the poor man's grave where bitter fern grew, but the shoes would not allow it. There was no rest or peace for her.
        - id: ch03-b02
          speaker: narrator
          text: >-
            As she passed the open church door, she saw an angel in a long white robe. His wings reached from his shoulders to the ground. His face was stern and grave, and he held a broad, shining sword.
        - id: ch03-b03
          speaker: angel
          text: >-
            You will dance in your red shoes until you are pale and cold, until your skin shrivels and only your skeleton remains. You will dance from door to door. Wherever proud and wicked children live, you will knock so they can hear you and be afraid. You will dance. Dance!
          emotion: angry
        - id: ch03-b04
          speaker: karen
          text: >-
            Mercy!
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: >-
            Karen never heard the angel's answer. The shoes swept her through the gate and out across the fields. They carried her along highways and little lanes, and she danced without stopping.
        - id: ch03-b06
          speaker: narrator
          text: >-
            One morning she passed a door she knew well. Voices inside were singing a psalm. Then a coffin covered in flowers was carried out through the door. Karen understood that everyone had abandoned her and that God's angel had condemned her.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Still she danced. She crossed the dark night over thorns and tree stumps until she was torn and bleeding. The shoes bore her across the heath to a lonely little house. Karen knew the executioner lived there. She tapped on his window.
        - id: ch03-b08
          speaker: karen
          text: >-
            Come outside! I can't come in. I have to keep dancing.
        - id: ch03-b09
          speaker: executioner
          text: >-
            Perhaps you don't know who I am. I cut off the heads of wicked people, and my ax is tingling for its work.
        - id: ch03-b10
          speaker: karen
          text: >-
            Don't cut off my head! Then I couldn't repent of my sin. Cut off my feet instead, with the red shoes still on them.
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: >-
            Karen confessed all her sin. The executioner struck off her feet with the red shoes, and the shoes danced away across the field. They carried the little feet with them into the deep forest.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The executioner carved wooden feet for Karen and gave her crutches. He taught her a psalm that sinners always sing. Karen kissed the hand that had guided the ax, then set out across the heath.
    - id: ch04
      title: At the Church Door
      blocks:
        - id: ch04-b01
          speaker: karen
          text: >-
            I've suffered enough because of those red shoes. I'll go to church now, and everyone will see me.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Karen hurried toward the church. But when she reached the door, the red shoes were dancing in front of her. Frightened, she turned back.
        - id: ch04-b03
          speaker: narrator
          text: >-
            All week she was sad and cried bitterly. When the next Sunday came, she spoke again.
        - id: ch04-b04
          speaker: karen
          text: >-
            I've suffered and struggled enough. I'm sure I'm just as good as many people who sit in church acting so important.
        - id: ch04-b05
          speaker: narrator
          text: >-
            She went forward boldly. She had not passed the churchyard gate when she saw the red shoes dancing ahead of her. Terror seized her. This time, when she turned back, she truly repented of her sin.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Karen went to the parsonage and asked to become a servant there. She promised to work hard and do everything she could. She did not care about wages, she said, as long as she had a roof and lived among good people.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The pastor's wife took pity on Karen and accepted her. Karen worked hard and became thoughtful. She did every task she could. In the evenings, she sat quietly and listened while the pastor read the Bible aloud.
        - id: ch04-b08
          speaker: narrator
          text: >-
            All the children grew fond of her. Whenever they talked of fine clothes, splendor, and beauty, Karen only shook her head.
    - id: ch05
      title: Mercy
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            On the following Sunday, everyone was going to church. They asked Karen if she wanted to come too. She did not answer. With tears in her eyes, she looked sadly at the crutches that now had to carry her.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The others left to hear God's word, and Karen went alone to her little room. It was barely large enough for a bed and a chair. She sat with her hymnbook and read it with a devout heart.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The wind carried the sound of the church organ to her. Karen raised her tearful face.
        - id: ch05-b04
          speaker: karen
          text: >-
            Oh, God, help me!
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: >-
            Sunlight suddenly flooded the room. Before Karen stood an angel of God in white robes, the same angel she had seen at the church door that terrible night. Now he carried no sharp sword. In his hand was a beautiful green branch covered with roses.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The angel touched the ceiling with the branch, and it rose high above them. A golden star shone where the branch had touched it. Then he touched the walls, and they opened wide.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Karen saw the organ sounding through the church. She saw portraits of the old pastors and their wives. She saw the congregation in the polished pews, singing from their hymnbooks.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The church itself had come into the poor girl's narrow room, or else her room had gone into the church. Karen found herself sitting in a polished pew beside the rest of the pastor's household. When the hymn ended, they looked up and nodded to her.
        - id: ch05-b09
          speakers: [household_member_one, household_member_two]
          ensemble: duo
          text: >-
            You were right to come, Karen.
        - id: ch05-b10
          speaker: karen
          text: >-
            It was mercy.
          emotion: calm
        - id: ch05-b11
          speaker: narrator
          text: >-
            The organ played on, and the children's voices in the choir sounded soft and beautiful. Bright, warm sunshine streamed through the church window and into the pew where Karen sat. Her heart filled with that light, with peace, and with joy until it broke.
        - id: ch05-b12
          speaker: narrator
          text: >-
            Her soul flew to Heaven on the sunbeams.
        - id: ch05-b13
          speaker: narrator
          text: >-
            And no one there asked about the red shoes.
