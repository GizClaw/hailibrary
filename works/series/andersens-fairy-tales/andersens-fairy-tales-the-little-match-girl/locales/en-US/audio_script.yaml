  chapters:
    - id: ch01
      title: The Cold New Year's Eve
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The last evening of the old year was bitterly cold. Darkness was settling in, and snow fell fast. Through the cold and the dark, a poor little girl wandered the streets with nothing on her head and nothing on her feet.
        - id: ch01-b02
          speaker: narrator
          text: She had been wearing slippers when she left home, but they were much too big. They had once belonged to her mother. As the girl ran across the street to escape two speeding carriages, both slippers came off. She could not find one of them. A boy grabbed the other and ran away.
        - id: ch01-b03
          speaker: boy
          text: This will make a fine cradle when I have children someday!
        - id: ch01-b04
          speaker: narrator
          text: So the girl walked on barefoot. Her little feet had turned red and blue from the cold. She carried matches in her old apron and held one bundle in her hands. All day long, no one had bought a single match. No one had given her even one penny.
        - id: ch01-b05
          speaker: narrator
          text: She crept along, shivering with cold and hunger. Snowflakes settled on the long, fair curls that hung over her shoulders, but she paid no attention to them. Lights glowed in every window, and the smell of roast goose drifted through the streets. Of course. It was New Year's Eve.
        - id: ch01-b06
          speaker: narrator
          text: She found a corner between two houses, where one wall stood farther out than the other. There she sank down and curled herself up. She pulled her feet beneath her, but she could not get warm.
        - id: ch01-b07
          speaker: narrator
          text: She did not dare go home. She had sold no matches and had no money to bring back. Her father would surely beat her. Besides, home was nearly as cold as the street. They had only a roof above them. Wind whistled through it, though straw and rags had been stuffed into the widest holes.
    - id: ch02
      title: The First Match
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The girl's little hands were almost frozen. Maybe one burning match would help. She could take it from the bundle, strike it against the wall, and warm her fingers for just a moment.
        - id: ch02-b02
          speaker: narrator
          text: She pulled out a match and scratched it against the wall. It sputtered and caught fire. As she held her hand above it, the match gave off a warm, bright glow, almost like a tiny candle. And what a wonderful light it was.
        - id: ch02-b03
          speaker: narrator
          text: The girl seemed to be sitting beside a great iron stove. Its feet were polished brass, and a shining brass ornament decorated it. The fire burned beautifully, filling her with warmth. She stretched out her feet to warm them, too.
        - id: ch02-b04
          speaker: narrator
          text: Then the flame went out. The stove disappeared. All that remained in her hand was a half-burned match.
    - id: ch03
      title: A Feast Behind the Wall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: She struck another match against the wall. It flared up, and the place where its light touched the wall became as clear as a thin veil. She could see right into the room beyond it.
        - id: ch03-b02
          speaker: narrator
          text: A snowy white cloth covered the table. On it stood a splendid dinner service and a roast goose, steaming hot and stuffed with apples and dried plums.
        - id: ch03-b03
          speaker: narrator
          text: Then something even more amazing happened. The goose hopped down from its dish. With a knife and fork still stuck in its breast, it waddled across the floor toward the little girl.
        - id: ch03-b04
          speaker: narrator
          text: At that instant, the match went dark. Nothing stood before her now but the thick, damp, freezing wall.
    - id: ch04
      title: The Christmas Tree and the Star
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The girl lit another match. Now she found herself beneath a beautiful Christmas tree. It was bigger and more richly decorated than the one she had seen through the glass door of a wealthy merchant's house.
        - id: ch04-b02
          speaker: narrator
          text: Thousands of little candles burned among the green branches. Colorful pictures, like the ones in shop windows, seemed to look down on everything below. The girl reached toward them. Then the match went out.
        - id: ch04-b03
          speaker: narrator
          text: The Christmas lights floated higher and higher until they looked like stars in the sky. One star fell, drawing a bright trail of fire behind it.
        - id: ch04-b04
          speaker: little_girl
          text: Someone is dying.
        - id: ch04-b05
          speaker: narrator
          text: Her grandmother had once told her what a falling star meant. That dear old grandmother was dead now, and she was the only person who had ever loved the girl.
        - id: ch04-b06
          speaker: grandmother
          text: When a star falls, a soul is going up to God.
    - id: ch05
      title: Grandmother's Light
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Once more, the girl rubbed a match against the wall. Light spread all around her. There in its brightness stood her grandmother, clear and shining, with the same gentle, loving face.
        - id: ch05-b02
          speaker: little_girl
          text: Grandmother! Oh, please take me with you. I know you'll leave when the match goes out. You'll disappear just like the warm stove, the roast goose, and the beautiful Christmas tree.
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: She hurried to light the whole bundle of matches. She wanted to keep her grandmother there. The matches blazed with a light brighter than noon, and her grandmother had never looked so tall or so beautiful.
        - id: ch05-b04
          speaker: narrator
          text: Her grandmother took her in her arms. Together they flew upward in brightness and joy, far above the earth. There was no cold there, no hunger, and no pain. They were with God.
        - id: ch05-b05
          speaker: narrator
          text: At dawn, the little girl lay against the wall. Her cheeks were pale, and a smile rested on her lips. She had frozen to death on the last night of the year. The New Year's sun rose and shone upon her small body.
        - id: ch05-b06
          speaker: narrator
          text: She still sat there, stiff in death, with the matches in her hand. One whole bundle had burned away.
        - id: ch05-b07
          speakers: [passerby_one, passerby_two]
          ensemble: duo
          text: She must have been trying to warm herself.
        - id: ch05-b08
          speaker: narrator
          text: No one imagined the beautiful things she had seen. No one knew the glory she had entered with her grandmother on New Year's Day.
