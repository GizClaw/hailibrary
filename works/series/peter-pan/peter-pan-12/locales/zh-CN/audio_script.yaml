audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    smee:
      display_name: 斯密
      tts:
        delivery: 古怪和气，迟钝中带着殷勤
        timbre: 温厚略沙哑
        pace: 不紧不慢
        pitch: 中低音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自负爱表现，讲话总像比别人多懂一点
        timbre: 清脆偏亮
        pace: 轻快
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 淘气机灵，反应又快又直接
        timbre: 活泼清亮
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 不按规矩的突袭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海盗突然发动进攻，把红种人打了个措手不及。这正好证明，肆无忌惮的胡克根本没有照规矩打仗。若是公平交手，白人可想不出办法这样偷袭红种人。
        - id: ch01-b02
          speaker: narrator
          text: 按照野蛮战争那些不成文的规矩，应该由红种人进攻。他们总会选在黎明以前动手，因为那时白人的勇气最弱。白人也该早早在高地顶上筑起简陋的栅寨，山脚还必须有溪水，离水太远就活不成了。新手守在寨里，手中死死攥着左轮枪，慌乱中还会踩断树枝。老手却能一直安睡，直到天快亮了才醒来。
        - id: ch01-b03
          speaker: narrator
          text: 整个漫长的黑夜，侦察兵都像蛇一样贴着草地爬行，连一片叶子也不会碰动。他们钻过灌木，枝叶便在身后悄悄合拢，就像鼹鼠钻入沙地，洞口立刻无声地消失。四周静极了，只偶尔响起一声孤独的郊狼长嗥。远处的勇士用同样的叫声回应。有些人学得比真的郊狼还像，毕竟郊狼自己也不太擅长这么叫。
        - id: ch01-b04
          speaker: narrator
          text: 寒冷的时辰一点点熬过去。头一次经历这种等待的白人，会被漫长的悬念折磨得受不了。可是老手听见阴森的嗥叫，再听见更加阴森的寂静，只会知道黑夜又过去了多少。胡克对这一套熟悉得很，所以他不按惯例办事，绝不能怪自己不知道规矩。
        - id: ch01-b05
          speaker: narrator
          text: 皮卡尼尼人却完全信任胡克的荣誉。那一夜，他们样样都照着本族的体面来做，跟胡克恰好相反。一个海盗才踩断枯枝，他们便凭着惊人的敏锐察觉敌人已经上岛。很快，郊狼的叫声便传遍四下。
        - id: ch01-b06
          speaker: narrator
          text: 勇士们把鹿皮鞋倒穿，让鞋跟朝前，从海盗登陆之处一路查到树下的家，不曾漏过一寸土地。附近只有一座小丘，脚下有溪水。他们因此断定，胡克没有别处可去，一定会在丘上驻扎，等黎明前再来进攻。
        - id: ch01-b07
          speaker: narrator
          text: 一切都用近乎魔鬼般的狡猾探查清楚以后，红种人的主力裹着毯子，沉着地蹲守在孩子们的家上方。这些男子汉中的精英，只等最冷的时刻来到，便要把苍白的死亡送给敌人。
        - id: ch01-b08
          speaker: narrator
          text: 他们明明醒着，却像在做美梦，盘算天一亮要怎样好好折磨胡克。就在这里，奸诈的胡克找到了这些轻信的勇士。后来，逃过屠杀的侦察兵说，胡克似乎根本没在高地停留。他在灰白的晨光里一定看见了那里，却从没想过要等敌人来攻，连黑夜快要结束也不肯等。他只是一路猛冲，打算立刻动手。
        - id: ch01-b09
          speaker: narrator
          text: 侦察兵精通所有作战的花招，偏偏不懂这一招。他们给弄糊涂了，只得无可奈何地追在胡克后面小跑。这样一来，自己完全暴露在敌人眼前，只能一边追，一边可怜巴巴地发出郊狼的嗥叫。
    - id: ch02
      title: 虎莲的勇士们
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 虎莲身边围着十二名最强壮的勇士。他们突然看见背信弃义的海盗直扑而来，眼前那层只让他们看见胜利的薄翳一下消失了。他们不能再把敌人绑上火刑柱，幸福猎场已经来到自己面前。他们知道这一点，却仍没有辱没父辈。
        - id: ch02-b02
          speaker: narrator
          text: 勇士们原本还有时间迅速站起，结成一道难以冲破的方阵，可部族传统不许他们这么做。古训说，高贵的野蛮人绝不能当着白人的面表示惊讶。所以，海盗突然出现虽然可怕，他们还是一动不动地站了片刻，连一块肌肉也没有颤动，仿佛敌人是他们请来的客人。
        - id: ch02-b03
          speaker: narrator
          text: 等这条传统被勇敢地维护下来，他们才抓起武器。战吼顿时撕裂天空，可惜已经晚了。接下来发生的与其说是战斗，不如说是屠杀，我们不该细讲。皮卡尼尼部族许多最杰出的勇士都死在这里。
        - id: ch02-b04
          speaker: narrator
          text: 但他们并不是全都白白送命。瘦狼倒下时，也杀死了阿尔夫·梅森，从此他再也不能去搅扰西班牙主海。乔治·斯库里、查尔斯·特利和阿尔萨斯人福格蒂也倒在地上。可怕的黑豹用战斧砍倒特利，最后又和虎莲以及少数幸存的族人一起，在海盗中杀开一条路，冲了出去。
        - id: ch02-b05
          speaker: narrator
          text: 胡克用这种战术，到底该受多少责备，还是留给历史学家判断吧。如果他照规矩在高地上等到约定的时辰，自己和手下大概早被杀光了。公平地说，评判他时不能忘记这一点。
        - id: ch02-b06
          speaker: narrator
          text: 也许，胡克应该先通知对手，说自己要换一种打法。可是那样一来，突袭就不再是突袭，他的计策也没有用了。这问题实在难办。至少，我们不能不勉强佩服他的聪明。他想出了如此大胆的计谋，又用那股凶狠的天才把它做成了。
    - id: ch03
      title: 胡克真正想要的人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 胜利的那一刻，胡克心里究竟怎样看自己呢？他的恶犬们可想知道了。他们喘着粗气，擦着弯刀，聚在离那只铁钩一段安全距离以外，用雪貂似的眼睛斜着打量这个非同寻常的人。
        - id: ch03-b02
          speaker: narrator
          text: 胡克心里一定非常得意，脸上却一点也看不出来。他始终是个阴暗而孤独的谜。无论身体还是心思，他都远远离开自己的手下。这一夜的差事还没结束，因为他出动并不是为了消灭红种人。他们只是守着蜂蜜的蜜蜂。先用烟把蜜蜂熏走，胡克才能取到蜂蜜。
        - id: ch03-b03
          speaker: narrator
          text: 他真正想要的是潘，是潘、温迪和他们那一伙人。不过最想要的，还是潘。彼得只是个很小的男孩，胡克为何这样恨他，实在叫人不解。彼得确实把胡克的一条胳膊扔给了鳄鱼，那条鳄鱼又不停追赶，让胡克从此过得提心吊胆。可就算这样，也解释不了那股狠毒又没完没了的仇恨。
        - id: ch03-b04
          speaker: narrator
          text: 真正的原因，是彼得身上有一样东西，能把海盗船长逼得发疯。不是他的勇气，也不是他讨人喜欢的模样，更不是别的。我们不用绕圈子，明明知道是什么，也非说出来不可。那就是彼得的神气活现。
        - id: ch03-b05
          speaker: narrator
          text: 这副神气叫胡克心烦，叫他的铁钩不住抽动，夜里还像小虫一样搅得他不得安宁。只要彼得活着，胡克就觉得自己是一头关在笼里的狮子，笼中偏偏又飞进了一只麻雀。
        - id: ch03-b06
          speaker: narrator
          text: 现在要解决的是，怎样才能钻进树洞，或者说，怎样把他的恶犬们弄下去。胡克用贪婪的目光扫过众人，专找最瘦小的几个。海盗们不安地扭动起来。他们知道船长不会犹豫，一定会拿长杆把他们一个个捅进树洞。
    - id: ch04
      title: 两声嗵嗵鼓
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 再回到地下之家。刀剑第一次撞响时，男孩们都像石像一样僵住了。他们张着嘴，伸开手臂，一齐向彼得求助。现在，他们的嘴终于合上，双手也垂了下来。头顶那阵喧嚣来得突然，停得也一样突然，像一阵狂风刮过去了。可孩子们知道，这阵风已经决定了他们的命运。
        - id: ch04-b02
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: 到底是哪一边赢了？
        - id: ch04-b03
          speaker: narrator
          text: 海盗们贴在树洞口，贪婪地偷听。他们听见每个男孩都在问，也听见了彼得的回答。
        - id: ch04-b04
          speaker: peter
          text: 要是红种人赢了，他们就会敲嗵嗵鼓。那一直是他们报胜的信号。
        - id: ch04-b05
          speaker: narrator
          text: 斯密已经找到了那面鼓，这时正坐在鼓上。他悄悄嘟囔了一句。当然，没有人听见，因为胡克严令大家不许出声。
        - id: ch04-b06
          speaker: smee
          text: 你们再也别想听见这面嗵嗵鼓了。
        - id: ch04-b07
          speaker: narrator
          text: 没想到，胡克竟打手势叫他敲鼓。斯密惊讶得不得了，过了一会儿才慢慢明白，这道命令有多么邪恶。这个头脑简单的人，大概从来没有这样钦佩过船长。
        - id: ch04-b08
          speaker: narrator
          text: 斯密在鼓上敲了两下，随即停手，兴高采烈地侧耳听着。
        - id: ch04-b09
          speaker: peter
          text: 是嗵嗵鼓！红种人赢啦！
        - id: ch04-b10
          speaker: narrator
          text: 注定遭殃的孩子们欢呼起来。对上面那些黑心肠的人来说，这声音简直像音乐。紧接着，孩子们又一次向彼得告别，海盗们听得糊里糊涂。不过，想到敌人马上就要从树洞上来，所有别的感觉都被卑劣的喜悦吞没了。
        - id: ch04-b11
          speaker: narrator
          text: 海盗们彼此奸笑，不停搓手。胡克迅速打着手势，无声地下达命令。每棵树旁守一个人，其余海盗排成一列，彼此相隔两码。
