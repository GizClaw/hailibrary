  chapters:
    - id: ch01
      title: The Rules of the Night
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The pirates caught everyone completely by surprise. That alone proved Hook had fought improperly, because no white man was supposed to be clever enough to surprise the island warriors in a fair fight.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The unwritten rules said the warriors must attack first. They would creep in just before dawn, when they believed white men's courage was weakest. By then, the white men should have built a rough fort at the top of the rolling ground, with a stream running below it. They had to stay near water if they hoped to survive.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Inside the fort, the new men would grip their revolvers and step on twigs. The experienced men would sleep peacefully until dawn was close. All through the black night, scouts would slide through the grass like snakes without moving a blade. The bushes would close behind them as quietly as sand closing over a mole.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Nothing would break the silence except a scout calling like a lonely coyote. Other warriors would answer. Some of them could even do it better than the coyotes, who were not very good at it. The freezing hours dragged by. To a man facing it for the first time, those cries and the silences between them were dreadful. To an old hand, they only told him how far the night had marched.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Hook knew this was the usual way perfectly well. He could not claim ignorance as an excuse for ignoring it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The island warriors, however, trusted Hook to behave honorably. Everything they did that night stood in sharp contrast to his conduct. They left out nothing the reputation of their tribe required. Their alert senses were a wonder and a despair to civilized people. The instant one pirate stepped on a dry stick, they knew the enemy had landed. In an incredibly short time, the coyote calls began.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Scouts searched every foot of ground between Hook's landing place and the home under the trees. They wore their moccasins backward, with the heels in front. There was only one mound with a stream at its base. So, according to the rules, Hook had no choice. He must build his fort there and wait until just before dawn.
        - id: ch01-b08
          speaker: narrator
          text: >-
            They had mapped every part of the ground with almost devilish cunning. Then the main group wrapped themselves in blankets and took their places directly above the children's home. With the grave patience they considered the finest part of manhood, they waited for the cold hour when they would bring death to the pirates.
    - id: ch02
      title: Hook Breaks the Rules
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They stayed wide awake, dreaming about the tortures they would give Hook at daybreak. That was how the treacherous pirate found them. Later, the scouts who survived said he did not even stop at the mound. He must have seen it in the gray light, but the idea of waiting to be attacked never entered his mind.
        - id: ch02-b02
          speaker: narrator
          text: >-
            From beginning to end, Hook never seemed to consider waiting. He would not even let the night nearly finish. He charged straight ahead with no plan except to attack. The confused scouts knew every trick of war but this one. All they could do was run helplessly after him, exposing themselves to deadly danger, while they gave their sorrowful coyote calls.
        - id: ch02-b03
          speaker: narrator
          text: >-
            A dozen of the strongest warriors stood around brave Tiger Lily. Suddenly, they saw the faithless pirates rushing toward them. In that moment, their dream of victory vanished. There would be no prisoners at the stake. The happy hunting grounds had come for them now.
        - id: ch02-b04
          speaker: narrator
          text: >-
            They knew it, but they fought like their fathers' sons. They still had time to form a line that would have been hard to break if they had moved quickly. Tradition would not allow it. Their law said a noble warrior must never show surprise in front of a white man.
        - id: ch02-b05
          speaker: narrator
          text: >-
            So even with the pirates appearing so terribly before them, they stood still for a moment. Not one muscle moved. They might have invited the enemy there. Once they had bravely obeyed tradition, they grabbed their weapons and filled the air with their war cry. By then, it was too late.
        - id: ch02-b06
          speaker: narrator
          text: >-
            What followed was more massacre than battle, and we will not describe it. Many of the finest warriors of the tribe died. They did not die without revenge. Lean Wolf brought down Alf Mason, who would never trouble the Spanish Main again. Geo Scourie, Chas Turley, and the Alsatian Foggerty fell too.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The fierce Panther struck Turley down with his tomahawk. In the end, Panther cut a path through the pirates and escaped with Tiger Lily and the few warriors who remained.
        - id: ch02-b08
          speaker: narrator
          text: >-
            A historian must decide how much blame Hook deserved for those tactics. If he had waited on the mound until the proper hour, he and his men would probably have been killed. That must count in his favor.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Perhaps he should have warned his enemies that he meant to fight in a new way. But then he would have ruined the surprise that made his plan work. It is a difficult question. At the very least, one cannot help admiring, however unwillingly, the bold mind that invented the plan and the deadly skill that carried it out.
    - id: ch03
      title: The Honey Hook Wanted
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            How did Hook feel about himself at that victorious moment? His pirate dogs longed to know. Breathing hard and wiping their swords, they gathered at a careful distance from his hook. They peered at that extraordinary man with sharp little ferret eyes.
        - id: ch03-b02
          speaker: narrator
          text: >-
            His heart must have been soaring, but his face showed nothing. Hook was always a dark and lonely mystery. Even when he stood among his crew, his spirit stood apart.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The night's work was not finished. Hook had not come to destroy the island warriors. They were only bees to be smoked away so he could reach the honey. He wanted Pan, Wendy, and all their companions. Most of all, he wanted Pan.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Peter was so small that you may wonder how a grown man could hate him so much. Peter had thrown Hook's arm to the crocodile. Since the beast kept hunting him, Hook could never feel safe. Yet even that did not fully explain such endless, poisonous hatred.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Something about Peter drove the pirate captain wild. It was not the boy's courage. It was not his charming looks. There is no use avoiding the truth, because we know exactly what it was. It was Peter's cockiness.
        - id: ch03-b06
          speaker: narrator
          text: >-
            That cockiness scraped at Hook's nerves. It made his iron claw twitch. At night, it bothered him like an insect that would not go away. As long as Peter lived, the tormented man felt like a lion trapped in a cage with a sparrow.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Now Hook had to find a way down the trees. Or rather, he needed a way to send his men down. His greedy gaze moved across them as he searched for the thinnest pirates. They squirmed because they knew he would gladly drive them into the trunks with poles.
    - id: ch04
      title: The False Victory Drum
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Meanwhile, what had happened to the boys below? At the first crash of weapons, they had frozen like stone. Their mouths hung open, and they reached toward Peter for help. Now their mouths closed and their arms dropped to their sides.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The uproar overhead ended almost as quickly as it had begun. It passed like a violent gust of wind. The boys knew that while it passed, it had decided their fate.
        - id: ch04-b03
          speakers: [john, nibs, tootles, curly]
          ensemble: chorus
          text: >-
            Who won?
        - id: ch04-b04
          speaker: narrator
          text: >-
            The pirates listened greedily at the openings of the trees. They heard every boy ask the question. And, sadly, they heard Peter answer too.
        - id: ch04-b05
          speaker: peter
          text: >-
            If the island warriors won, they'll beat their drum. That's always how they announce a victory.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Smee had found the drum and happened to be sitting on it.
        - id: ch04-b07
          speaker: smee
          text: >-
            You'll never hear this drum again.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He muttered so softly that no one below could hear him. Hook had ordered absolute silence. Then, to Smee's astonishment, the captain motioned for him to beat the drum. Slowly, Smee understood how wonderfully wicked the order was. Perhaps he had never admired Hook more.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Smee struck the drum twice. Then he stopped and listened with delight.
        - id: ch04-b10
          speaker: peter
          text: >-
            The victory drum! The island warriors won!
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: >-
            The doomed children cheered. To the cruel hearts above them, it sounded like music. Almost at once, the children said goodbye to Peter again.
        - id: ch04-b12
          speaker: narrator
          text: >-
            That confused the pirates, but their puzzlement vanished beneath a wicked joy. Their enemies were about to climb out through the trees. The pirates grinned at one another and rubbed their hands.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Quickly and silently, Hook gave his orders. One pirate was to stand at each tree. The rest were to form a line, with two yards between every man.
