  chapters:
    - id: ch01
      title: Captain Pan Sets Sail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            By three bells that morning, everyone was hard at work. A heavy sea was running, and Tootles, now the boatswain, marched among the crew with a rope's end in one hand and tobacco in his mouth. They had cut their pirate clothes off at the knee. They had shaved neatly, too. Up they came with a sailor's rolling walk, hitching at their trousers as they went.
        - id: ch01-b02
          speaker: narrator
          text: >-
            There was no need to ask who commanded the ship. Nibs was first mate and John was second. Wendy was the one woman aboard, while the rest served as ordinary sailors and slept in the forecastle. Peter had tied himself to the wheel. He piped everyone on deck and addressed them in the rough, ringing way sailors understood.
        - id: ch01-b03
          speaker: peter
          text: >-
            Do your duty like brave sailors. I know you're the worst scum from Rio to the Gold Coast, and if any of you snap at me, I'll tear you apart!
        - id: ch01-b04
          speaker: narrator
          text: >-
            The crew cheered him loudly. Peter snapped out a few orders, and they swung the ship around until her nose pointed toward the mainland.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Captain Pan studied the chart. If the weather held, he decided, they would reach the Azores around June twenty-first. From there, flying would be quicker.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Some of the crew wanted to turn the vessel into an honest ship. Others hoped to keep her a pirate. Peter treated them all like dogs, so no one dared tell him what they wanted, not even together in a signed complaint. Obeying at once was safest. When Slightly looked puzzled by an order to take soundings, he got twelve strokes of the rope.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The boys suspected that Peter was acting honest only to keep Wendy from worrying. Once his new suit was ready, that might change. Wendy was making it against her wishes from some of Hook's wickedest clothes. Later, the crew whispered about Peter's first night wearing it. He sat in the cabin for a long time with Hook's cigar holder in his mouth. One hand was clenched, except for the forefinger. He crooked that finger and held it up like a threatening hook.
    - id: ch02
      title: The Open Window
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            We must leave the ship for a while and return to the sad home that three of our characters deserted so long ago. It seems shameful that we have ignored Number Fourteen all this time. Mrs. Darling would never blame us, though. If we had come sooner to feel sorry for her, she would probably have told us not to be silly and to hurry back to watch the children. As long as mothers behave that way, children will take advantage of them. You can depend on it.
        - id: ch02-b02
          speaker: narrator
          text: >-
            We enter the familiar nursery now only because the children who belong there are coming home. We have rushed ahead to make sure their beds are aired and their parents stay in tonight. We are only servants. Still, why should those beds be ready after the children ran off so ungratefully? It would serve them right if they returned and found their parents away for the weekend. That would teach them a needed lesson. But Mrs. Darling would never forgive us for arranging it.
        - id: ch02-b03
          speaker: narrator
          text: >-
            I would love to tell her, as authors can, that the children are coming back. They will be here a week from Thursday. That would completely spoil the surprise Wendy, John, and Michael have planned aboard the ship. They picture their mother's delight, their father's joyful shout, and Nana leaping through the air to hug them first. What they really deserve is a good spanking.
        - id: ch02-b04
          speaker: narrator
          text: >-
            How delightful it would be to spoil everything. Then, when they marched in proudly, Mrs. Darling might not even offer Wendy a kiss, and Mr. Darling might complain that those boys were back again. But no one would thank us. Mrs. Darling would scold us for taking away the children's little pleasure.
        - id: ch02-b05
          speaker: narrator
          text: >-
            We might tell her that a week from Thursday is ten days away. Giving her the news would spare her ten unhappy days.
        - id: ch02-b06
          speaker: mrs_darling
          text: >-
            Yes, but it would cost the children ten minutes of joy.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Oh, if that is how you choose to see it!
        - id: ch02-b08
          speaker: mrs_darling
          text: >-
            How else could anyone see it?
        - id: ch02-b09
          speaker: narrator
          text: >-
            You see? The woman had no spirit at all. I had planned to say wonderfully kind things about her. Now I despise her and refuse to say even one. Besides, she does not need our warning. Everything is ready. The beds are aired, she never leaves the house, and the window stands open.
        - id: ch02-b10
          speaker: narrator
          text: >-
            We might as well return to the ship, for all the use we are. Since we are here, though, we can stay and watch. No one wants us for anything else. Let us make sharp remarks and hope that one of them hurts.
    - id: ch03
      title: Mr. Darling's Penance
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Only one thing had changed in the night nursery. From nine in the morning until six at night, the kennel was gone. After the children flew away, Mr. Darling knew in his bones that he was to blame. He had chained Nana outside, though she had been wiser than he was from beginning to end.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Mr. Darling was a simple man. He might almost have become a boy again if he could have taken off his baldness. But he also had a noble sense of fairness and a lion's courage when something seemed right. After thinking anxiously about the children's flight, he dropped to his hands and knees and crawled into the kennel. Mrs. Darling lovingly begged him to come out, but his answer was sad and firm.
        - id: ch03-b03
          speaker: mr_darling
          text: >-
            No, my own dear. This is where I belong.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: >-
            His remorse was so bitter that he vowed to stay in the kennel until his children returned. That was unfortunate, but Mr. Darling always did things too much. If he did not, he soon stopped doing them at all. Proud George Darling became the humblest of men. Each evening he sat in the kennel and talked with his wife about the children and all their lovely ways.
        - id: ch03-b05
          speaker: narrator
          text: >-
            His respect for Nana was touching. He would not allow her inside the kennel, but in every other matter he followed her wishes exactly.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Every morning, someone carried the kennel, with Mr. Darling inside, to a cab. The cab took him to his office and brought him home again at six. Remember how much he used to care about the neighbors' opinions. Now every move he made drew astonished looks. He must have suffered terribly inside, yet he stayed calm when young people criticized his little home. Whenever a lady peered in, he politely lifted his hat.
        - id: ch03-b07
          speaker: narrator
          text: >-
            What he did may have been foolishly romantic, but it was magnificent. Soon people learned why he lived this way, and the public's great heart was touched. Crowds ran after his cab and cheered. Charming girls climbed onto it for his autograph. Fine newspapers printed interviews with him. Society invited him to dinner and added, “Please come in the kennel.”
        - id: ch03-b08
          speaker: narrator
          text: >-
            At last, that important Thursday arrived. Mrs. Darling waited in the night nursery for George to come home. Her eyes were very sad. All her old happiness had vanished because her children were gone. Looking closely at her now, I cannot say cruel things about her after all. If she loved those dreadful children too much, she could not help it.
        - id: ch03-b09
          speaker: narrator
          text: >-
            She had fallen asleep in her chair. The corner of her mouth had almost withered away. One hand moved uneasily over her heart, as if it hurt. Some people love Peter best, and others love Wendy best. I love Mrs. Darling best. Let us whisper while she sleeps that the brats are coming home. They are already less than two miles from the window and flying strongly. We need only tell her they are on their way. Come, let's do it.
        - id: ch03-b10
          speaker: narrator
          text: >-
            We should not have done it. Mrs. Darling sprang up and called her children's names, but only Nana was there.
        - id: ch03-b11
          speaker: mrs_darling
          text: >-
            Oh, Nana, I dreamed my dear children had come home.
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: >-
            Nana's eyes were misty. She could only rest one paw gently on her mistress's lap. They were still sitting that way when the kennel came home. Mr. Darling put his head out to kiss his wife. His face looked more worn than before, but also much kinder.
        - id: ch03-b13
          speaker: narrator
          text: >-
            He handed his hat to Liza. She took it with scorn, because she had no imagination and could never understand why a man would behave this way. Outside, the crowd that had followed his cab was still cheering. Naturally, Mr. Darling was moved.
        - id: ch03-b14
          speaker: mr_darling
          text: >-
            Listen to that. It is very gratifying.
          emotion: happy
        - id: ch03-b15
          speaker: liza
          text: >-
            It's just a lot of little boys.
          emotion: disgusted
        - id: ch03-b16
          speaker: mr_darling
          text: >-
            There were several grown-ups today.
        - id: ch03-b17
          speaker: narrator
          text: >-
            He flushed a little as he said it. Liza tossed her head, but he did not scold her. Success had not spoiled him. It had made him gentler. For a while he sat with his head outside the kennel and told Mrs. Darling about his popularity. When she worried that it might make him vain, he pressed her hand to reassure her.
        - id: ch03-b18
          speaker: mr_darling
          text: >-
            Just imagine if I had been a weak man. Good heavens, what if I had been weak!
        - id: ch03-b19
          speaker: mrs_darling
          text: >-
            George, you're still just as sorry as ever, aren't you?
          emotion: fearful
        - id: ch03-b20
          speaker: mr_darling
          text: >-
            Just as sorry as ever, dearest. Look at my punishment. I live in a kennel.
        - id: ch03-b21
          speaker: mrs_darling
          text: >-
            But it truly is a punishment, isn't it? You're certain you don't enjoy it?
          emotion: fearful
        - id: ch03-b22
          speaker: mr_darling
          text: >-
            My love!
          emotion: surprised
        - id: ch03-b23
          speaker: narrator
          text: >-
            Of course she apologized. Then Mr. Darling grew sleepy and curled up inside the kennel.
        - id: ch03-b24
          speaker: mr_darling
          text: >-
            Would you play the nursery piano until I fall asleep?
        - id: ch03-b25
          speaker: narrator
          text: >-
            Mrs. Darling started toward the day nursery. Without thinking, he called after her.
        - id: ch03-b26
          speaker: mr_darling
          text: >-
            And please close that window. I can feel a draft.
        - id: ch03-b27
          speaker: mrs_darling
          text: >-
            Oh, George, never ask me to close it. That window must stay open for them. Always, always.
          emotion: sad
        - id: ch03-b28
          speaker: narrator
          text: >-
            This time, he apologized. Mrs. Darling went into the day nursery and played. Soon her husband was asleep. While he slept, Wendy, John, and Michael flew into the room.
    - id: ch04
      title: Peter at the Window
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Oh, no. We said the children flew in because that was the lovely plan they had made before we left the ship. Something must have changed since then. The two who entered were Peter and Tinker Bell.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Peter's first words explained everything.
        - id: ch04-b03
          speaker: peter
          text: >-
            Hurry, Tink. Shut the window and bar it. Good. Now we'll leave through the door. When Wendy gets here, she'll think her mother locked her out, and she'll have to come back with me.
        - id: ch04-b04
          speaker: narrator
          text: >-
            At last I understood something that had puzzled me. After Peter destroyed the pirates, why had he not returned to the island and let Tink guide the children home? Because he had been planning this trick all along.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Peter felt no shame. He danced with delight, then peeked into the day nursery to see who was playing the piano.
        - id: ch04-b06
          speaker: peter
          text: >-
            That's Wendy's mother. She's pretty, but not as pretty as my mother. Her mouth is full of kisses, but my mother's had even more.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Peter knew nothing at all about his mother. Sometimes he simply boasted about her.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He did not know the tune was called “Home, Sweet Home.” But he could hear what the music seemed to say. It was calling, “Come back, Wendy, Wendy, Wendy.” Peter cried out in triumph.
        - id: ch04-b09
          speaker: peter
          text: >-
            You'll never see Wendy again, lady. The window is barred!
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: >-
            He peeked in once more to see why the music had stopped. Mrs. Darling had lowered her head onto the piano, and two tears rested in her eyes.
        - id: ch04-b11
          speaker: peter
          text: >-
            She wants me to open the window, but I won't. I won't!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: >-
            He looked again. The tears were still there, unless two new ones had taken their place.
        - id: ch04-b13
          speaker: peter
          text: >-
            She really does love Wendy.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Now he was angry with Mrs. Darling for refusing to understand why she could not keep Wendy. The reason seemed perfectly simple to him.
        - id: ch04-b15
          speaker: peter
          text: >-
            I love her too. We can't both have her, lady.
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: >-
            But Mrs. Darling would not accept that, and Peter became unhappy. He stopped looking at her, but she still would not leave him alone. He skipped around and made funny faces. Each time he stopped, it felt as though she were inside him, knocking.
        - id: ch04-b17
          speaker: peter
          text: >-
            Oh, all right.
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: >-
            He gulped and opened the window again. Giving Wendy up made him miserable, but he did it for Mrs. Darling.
        - id: ch04-b19
          speaker: peter
          text: >-
            Come on, Tink. We don't need any silly mothers!
        - id: ch04-b20
          speaker: narrator
          text: >-
            He sneered terribly at the laws of nature and flew away.
    - id: ch05
      title: Home at Last
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            So Wendy, John, and Michael found the window open after all, which was more than they deserved. They landed on the floor without the least shame. The youngest had already forgotten his own home.
        - id: ch05-b02
          speaker: michael
          text: >-
            John, I think I've been in this room before.
        - id: ch05-b03
          speaker: john
          text: >-
            Of course you have, silly. Look, there's your old bed.
        - id: ch05-b04
          speaker: michael
          text: >-
            Oh. So it is.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Michael did not sound very sure. Then John spotted something and rushed across the room to inspect it.
        - id: ch05-b06
          speaker: john
          text: >-
            Wait. The kennel!
          emotion: surprised
        - id: ch05-b07
          speaker: wendy
          text: >-
            Maybe Nana is in there.
        - id: ch05-b08
          speaker: narrator
          text: >-
            John looked inside and whistled.
        - id: ch05-b09
          speaker: john
          text: >-
            Well, there's a man in it.
          emotion: surprised
        - id: ch05-b10
          speaker: wendy
          text: >-
            That's Father!
          emotion: surprised
        - id: ch05-b11
          speaker: michael
          text: >-
            Let me look at Father!
        - id: ch05-b12
          speaker: narrator
          text: >-
            Michael eagerly studied him.
        - id: ch05-b13
          speaker: michael
          text: >-
            He's not as big as the pirate I killed.
        - id: ch05-b14
          speaker: narrator
          text: >-
            His disappointment was completely honest. I am glad Mr. Darling was asleep. Those would have been sad first words to hear from his little Michael. Wendy and John were both startled to find their father sleeping in the kennel.
        - id: ch05-b15
          speaker: john
          text: >-
            He didn't used to sleep in there, did he?
        - id: ch05-b16
          speaker: narrator
          text: >-
            John sounded as if he no longer trusted his own memory. Wendy answered uncertainly.
        - id: ch05-b17
          speaker: wendy
          text: >-
            John, maybe we don't remember our old life as well as we thought.
          emotion: fearful
        - id: ch05-b18
          speaker: narrator
          text: >-
            A chill went through them, and they deserved it.
        - id: ch05-b19
          speaker: john
          text: >-
            Mother was very careless not to be here when we arrived.
        - id: ch05-b20
          speaker: narrator
          text: >-
            The young rascal had barely said this when Mrs. Darling began playing again.
        - id: ch05-b21
          speaker: wendy
          text: >-
            It's Mother!
          emotion: happy
        - id: ch05-b22
          speaker: narrator
          text: >-
            Wendy peered into the other room.
        - id: ch05-b23
          speaker: john
          text: >-
            It really is!
          emotion: happy
        - id: ch05-b24
          speaker: michael
          text: >-
            Wendy, does that mean you aren't truly our mother?
        - id: ch05-b25
          speaker: narrator
          text: >-
            Michael was surely sleepy.
        - id: ch05-b26
          speaker: wendy
          text: >-
            Oh, dear. We came home just in time.
          emotion: sad
        - id: ch05-b27
          speaker: narrator
          text: >-
            For the first time, Wendy felt a real stab of remorse.
        - id: ch05-b28
          speaker: john
          text: >-
            Let's sneak in and cover her eyes with our hands.
        - id: ch05-b29
          speaker: narrator
          text: >-
            Wendy knew they must reveal the joyful news more gently. She had a better idea.
        - id: ch05-b30
          speaker: wendy
          text: >-
            Let's climb into our beds. When she comes in, she'll find us there as if we'd never left.
        - id: ch05-b31
          speaker: narrator
          text: >-
            Mrs. Darling soon returned to the night nursery to see whether her husband was asleep. Every bed was occupied. The children waited for her joyful cry, but it never came. She saw them and still could not believe they were real. She had dreamed of finding them in their beds so many times that she thought the old dream was lingering again.
        - id: ch05-b32
          speaker: narrator
          text: >-
            She sat in the chair beside the fire, the same chair where she had held them long ago.
        - id: ch05-b33
          speaker: narrator
          text: >-
            The children did not understand. A cold fear settled over all three.
        - id: ch05-b34
          speaker: wendy
          text: >-
            Mother!
          emotion: fearful
        - id: ch05-b35
          speaker: mrs_darling
          text: >-
            That is Wendy.
        - id: ch05-b36
          speaker: narrator
          text: >-
            She still believed she was dreaming.
        - id: ch05-b37
          speaker: john
          text: >-
            Mother!
          emotion: fearful
        - id: ch05-b38
          speaker: mrs_darling
          text: >-
            That is John.
        - id: ch05-b39
          speaker: michael
          text: >-
            Mother!
          emotion: happy
        - id: ch05-b40
          speaker: narrator
          text: >-
            Michael remembered her now.
        - id: ch05-b41
          speaker: mrs_darling
          text: >-
            That is Michael.
        - id: ch05-b42
          speaker: narrator
          text: >-
            Mrs. Darling reached out both arms toward the three selfish children she thought they would never hold again. But her arms did hold them. Wendy, John, and Michael slipped from their beds and ran straight into them.
        - id: ch05-b43
          speaker: mrs_darling
          text: >-
            George! George!
          emotion: happy
        - id: ch05-b44
          speaker: narrator
          text: >-
            When she could finally speak, her cry woke Mr. Darling, and he shared her happiness. Nana came rushing in. Nothing could have been lovelier. Yet no one saw it except one little boy staring through the window.
        - id: ch05-b45
          speaker: narrator
          text: >-
            Peter had known countless joys that other children could never know. Now he watched the one joy from which he must be shut out forever.
