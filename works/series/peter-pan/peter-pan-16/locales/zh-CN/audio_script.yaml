audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而机敏的童话讲述
        timbre: 温暖清澈
        pace: 舒缓中有张力
        pitch: 中音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气果决，带着孩子气的自信
        timbre: 清亮灵动的少年声
        pace: 轻快敏捷
        pitch: 中高音
    wendy:
      display_name: 温迪
      tts:
        delivery: 温柔镇定，关切而坚定
        timbre: 清澈柔和的少女声
        pace: 从容
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真勇敢，反应利落
        timbre: 清朗的男孩声
        pace: 中速
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，真诚热切
        timbre: 稚嫩明亮的男孩声
        pace: 稍快
        pitch: 高音
    mrs_darling:
      display_name: 达林太太
      tts:
        delivery: 温柔慈爱，悲伤中含着坚韧
        timbre: 柔润的成年女声
        pace: 舒缓
        pitch: 中音
    mr_darling:
      display_name: 达林先生
      tts:
        delivery: 郑重自持，偶尔流露孩子气的虚荣
        timbre: 温厚的成年男声
        pace: 中速
        pitch: 中低音
    liza:
      display_name: 莉莎
      tts:
        delivery: 直率刻薄，不留情面
        timbre: 清脆的年轻女声
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十六章　回家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那天早晨，船钟敲过三响，海上正起着大浪，所有人都忙开了。嘟嘟做了水手长，嘴里嚼着烟草，手里还抓着一截绳头。大家穿上齐膝截短的海盗衣服，刮净了脸，摇摇晃晃地涌上甲板。他们走得很有水手派头，还不时往上提一提裤子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            船长是谁，当然不用说。尼布斯和约翰做了大副、二副，船上还有一位女士，其余人全是住艏楼的普通水手。彼得把自己缚在舵轮上，又吹哨召来全体船员。他训话说，大家要像勇敢的好汉一样尽职。不过，他知道他们都是里约和黄金海岸来的渣滓，谁敢龇牙，他就撕碎谁。水手们最懂这种粗豪话，立刻放声喝彩。几道严厉的命令一发下去，他们便掉转船头，向大陆驶去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            潘船长看过海图，算出只要天气不变，他们大约能在六月二十一日到达亚速尔群岛。过了那里再飞，反而更快。
        - id: ch01-b04
          speaker: narrator
          text: >-
            有人想把船改成正经船，也有人想继续做海盗。可船长拿他们当狗使唤，谁也不敢联名写信，把自己的愿望告诉他。最安全的办法只有马上服从。斯莱特利奉命测水深时露出一点困惑，就挨了十二下鞭子。大家私下猜，彼得现在规规矩矩，只是为了不让温迪起疑。等新衣做成，他也许就会变样。温迪很不情愿，却还是拿胡克最邪恶的几件衣服替他缝了一套。后来有人悄悄说，彼得第一次穿上它的晚上，在船舱里坐了很久。他衔着胡克的雪茄烟嘴，一只手攥成拳头，只有食指弯起来，高高举着，像一只吓人的铁钩。
        - id: ch01-b05
          speaker: narrator
          text: >-
            不过，我们不能一直看着这条船。现在得回到那所凄凉的家。很久以前，故事里的三个人物狠心从那里飞走了。十四号公寓被我们冷落这么久，实在叫人惭愧。好在达林太太不会责怪我们。假如我们早些回来，同情地陪她伤心，她多半会这样说。
        - id: ch01-b06
          speaker: mrs_darling
          text: >-
            别犯傻了，我有什么要紧？快回去，替我看着孩子们吧。
        - id: ch01-b07
          speaker: narrator
          text: >-
            母亲们只要一直这样，孩子们就会占她们的便宜。她们尽管记住这一点。今天我们敢走进熟悉的育儿室，也只是因为真正的小主人正在回来。我们不过先赶一步，看看床铺有没有好好通风，达林先生和太太晚上会不会出门。说到底，我们只是仆人。那些孩子走得那么匆忙，又那么忘恩负义，为什么还要替他们晒好床铺？他们回家以后，要是发现父母到乡下过周末，不正好叫他们自作自受吗？他们从我们认识的第一天起，就很需要这一课。可要是我们真的这样安排，达林太太准会怪罪我们，永远也不会原谅。
        - id: ch01-b08
          speaker: narrator
          text: >-
            我倒很想照作家的老办法，把孩子们要回来的消息告诉她，还要说明他们下下个星期四就到。这样一来，温迪、约翰和迈克尔一心盼望的惊喜就会彻底泡汤。他们在船上早已把一切盘算好了。母亲会欣喜若狂，父亲会欢呼大叫，娜娜会凌空跳起，抢着第一个拥抱他们。其实他们真正该准备的，是回家以后好好挨一顿打。要是我们提前泄露消息，等他们神气十足地走进来，达林太太也许连嘴唇都不肯伸给温迪亲，达林先生还会不耐烦地叫起来。
        - id: ch01-b09
          speaker: mr_darling
          text: >-
            真见鬼，那几个孩子怎么又回来了？
        - id: ch01-b10
          speaker: narrator
          text: >-
            那该多有趣！可是我们不会得到半句感谢。达林太太反而会怪我们，夺走了孩子们这一点快乐。我若跟她讲道理，大概会说。
        - id: ch01-b11
          speaker: narrator
          text: >-
            亲爱的太太，离那天还有十天。现在告诉您，就能让您少难过十天。
        - id: ch01-b12
          speaker: mrs_darling
          text: >-
            可孩子们会少快活十分钟，这代价太大了。
        - id: ch01-b13
          speaker: narrator
          text: >-
            哦，您非要这么看，我就没话说了。
        - id: ch01-b14
          speaker: mrs_darling
          text: >-
            不这么看，还能怎么看呢？
        - id: ch01-b15
          speaker: narrator
          text: >-
            你看，这个女人一点也不争强好胜。我原想说她许多特别好听的话，现在却鄙视她，一句也不肯说。况且，根本不用提醒她做准备。一切早就妥当了，所有床铺都通着风，她从来不离开家。再看那扇窗，它还开着。我们对她毫无用处，简直应该回船上去。可既然已经来了，就留下看看吧。我们除了旁观，什么也不是。反正没有人真正需要我们。我们只管看着，再说几句带刺的话，但愿其中有一句能够伤到谁。
        - id: ch01-b16
          speaker: narrator
          text: >-
            夜间育儿室只有一点不同。每天早上九点到傍晚六点，狗屋不见了。孩子们飞走后，达林先生认定一切都怪自己。他不该拴住娜娜，娜娜从头到尾都比他明白。他是个非常单纯的人，要是能摘掉秃顶，几乎又能变回男孩。可他也有高尚的公道心，还有狮子般的勇气，敢做自己认为对的事。他忧心忡忡地想明白以后，伏下四肢，爬进了狗屋。妻子一次次柔声请他出来，他总是悲伤又坚定地回答。
        - id: ch01-b17
          speaker: mr_darling
          text: >-
            不，亲爱的。我就应该待在这里。
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: >-
            他痛悔得厉害，发誓孩子们不回来，自己就绝不离开狗屋。这当然很可惜。可达林先生无论做什么，都一定要做过头，否则很快就会彻底放弃。从前那个骄傲的乔治·达林，如今每到晚上便坐在狗屋里，和妻子谈孩子们的种种可爱模样。世上再没有比他更谦卑的人了。他敬重娜娜的样子尤其动人。他不肯让娜娜进狗屋，可除此以外，无论什么事都完全听从她的意思。
        - id: ch01-b19
          speaker: narrator
          text: >-
            每天早晨，人们连狗屋带达林先生一起抬上出租马车，送他去办公室。傍晚六点，再原样送回来。别忘了，他以前多么在意邻居的目光，而现在每一个动作都会惹人惊奇。这正说明他有多坚强。他心里一定受尽折磨，表面仍旧从容。年轻人议论他的小屋，他不动气。有女士往里面看，他还总会客气地脱帽致意。
        - id: ch01-b20
          speaker: narrator
          text: >-
            这或许像堂吉诃德一样荒唐，却也壮丽非凡。没过多久，人们便知道了他这样做的真正用意，广大公众都被感动了。每当马车经过，人群便跟在后面高声欢呼。漂亮姑娘爬上车，只为了讨他的签名。上等报纸刊出了对他的访问，上流社会也邀请他赴宴，还特意添上一句：“请一定连狗屋一起来。”
        - id: ch01-b21
          speaker: narrator
          text: >-
            到了那个注定要发生大事的星期四，达林太太在夜间育儿室里等乔治回家，眼里满是哀伤。我们仔细看看她，再想想她从前多么快乐。只因为失去孩子，那份快乐便全没了。我终于发现，自己还是说不出刻薄话。她太爱那些没出息的孩子，也不是她能控制的。她坐在椅子里睡着了。她那边嘴角几乎已经枯萎，一只手在胸前不安地动着，仿佛那里正在疼。有人最喜欢彼得，有人最喜欢温迪，我却最喜欢她。
        - id: ch01-b22
          speaker: narrator
          text: >-
            不如我们让她高兴一点，趁她睡着，悄悄告诉她，小坏蛋们要回来了。他们离窗子不到两英里，正有力地往这里飞。我们只告诉她，他们已经在路上。来吧。
        - id: ch01-b23
          speaker: narrator
          text: >-
            真不该这么做。她猛地醒来，喊着孩子们的名字。可房里除了娜娜，谁也没有。
        - id: ch01-b24
          speaker: mrs_darling
          text: >-
            娜娜，我梦见亲爱的孩子们回来了。
          emotion: sad
        - id: ch01-b25
          speaker: narrator
          text: >-
            娜娜眼里蒙着一层泪雾，却什么也做不了，只能把爪子轻轻放在女主人的膝上。她们正这样依偎着，狗屋被抬回来了。达林先生从里面探出头，亲吻妻子。他的脸比从前憔悴了许多，神情却也柔和了许多。他把帽子交给莉莎，莉莎轻蔑地接过去。她没有半点想象力，完全不能明白这样一个人为什么要这样做。外面，护送马车回来的人群还在高声欢呼，他听在耳里，自然也有些动容。
        - id: ch01-b26
          speaker: mr_darling
          text: >-
            你听，他们还在欢呼。真叫人欣慰。
        - id: ch01-b27
          speaker: liza
          text: >-
            都是些小男孩罢了。
        - id: ch01-b28
          speaker: mr_darling
          text: >-
            今天也来了好几个大人。
        - id: ch01-b29
          speaker: narrator
          text: >-
            他脸上微微一红，认真地向她保证。莉莎甩了甩头，他也不责备。出名没有宠坏他，反倒让他更温和了。他把头伸出狗屋，和妻子谈了许久。达林太太说，希望他别让成功冲昏头脑。他便握紧她的手，叫她放心。
        - id: ch01-b30
          speaker: mr_darling
          text: >-
            可我要是个软弱的人呢？天哪，我要是个软弱的人，那可怎么办！
        - id: ch01-b31
          speaker: mrs_darling
          text: >-
            乔治，你还是像以前一样满心悔恨，是不是？
        - id: ch01-b32
          speaker: mr_darling
          text: >-
            一点也没变，亲爱的。看看我受的惩罚，我一直住在狗屋里呀。
        - id: ch01-b33
          speaker: mrs_darling
          text: >-
            可这真是惩罚吧，乔治？你没有偷偷觉得很享受吧？
        - id: ch01-b34
          speaker: mr_darling
          text: >-
            亲爱的，你怎么会这么想！
          emotion: surprised
        - id: ch01-b35
          speaker: narrator
          text: >-
            她当然马上道了歉。达林先生觉得困，便蜷进狗屋里。
        - id: ch01-b36
          speaker: mr_darling
          text: >-
            你能不能去育儿室弹琴，哄我睡着？还有，把窗子关起来吧，这里有风。
        - id: ch01-b37
          speaker: mrs_darling
          text: >-
            乔治，永远不要叫我关那扇窗。它一定要一直为孩子们开着，一直开着，永远开着。
          emotion: sad
        - id: ch01-b38
          speaker: narrator
          text: >-
            这回轮到他请求妻子原谅了。她走进日间育儿室，坐下来弹琴。没过多久，达林先生就睡着了。正在他熟睡的时候，温迪、约翰和迈克尔飞进了房间。哦，不对。我们会这样说，是因为离开海盗船以前，他们安排好的动人计划正是如此。可后来一定发生了什么事。真正从窗外飞进来的，并不是三个孩子，而是彼得和叮叮铃。
        - id: ch01-b39
          speaker: narrator
          text: >-
            彼得一开口，真相就全明白了。
        - id: ch01-b40
          speaker: peter
          text: >-
            快点，叮叮铃。关上窗子，把它闩住！很好。现在我们从门口出去。等温迪回来，她会以为母亲把她关在外面，只好跟我回去。
        - id: ch01-b41
          speaker: narrator
          text: >-
            这时我才明白一件始终让我困惑的事。彼得消灭海盗以后，为什么没有回到岛上，却只让叮叮铃护送孩子们去大陆？原来他早就把这个诡计藏在脑袋里。他不但不觉得自己做得恶劣，反而高兴得跳起舞来。接着，他又朝日间育儿室里偷看，想知道究竟是谁在弹琴。
        - id: ch01-b42
          speaker: peter
          text: >-
            是温迪的母亲！她很漂亮，不过没有我母亲漂亮。她嘴里全是顶针，可也没有我母亲嘴里的多。
        - id: ch01-b43
          speaker: narrator
          text: >-
            其实彼得对自己的母亲一无所知，只是有时喜欢拿她来吹牛。他也从没听过正在弹奏的曲子，不知道它名叫《甜蜜的家》。可他听懂了曲子里的呼唤，那声音仿佛一遍又一遍地说：“回来吧，温迪，温迪，温迪。”彼得听着，却得意洋洋地叫了起来。
        - id: ch01-b44
          speaker: peter
          text: >-
            太太，你再也见不到温迪啦。窗子已经闩上了！
          emotion: happy
        - id: ch01-b45
          speaker: narrator
          text: >-
            琴声停了。彼得又往里看，看见达林太太把头伏在琴箱上，眼里停着两滴泪。
        - id: ch01-b46
          speaker: peter
          text: >-
            她想叫我拉开窗闩。可是我偏不，绝对不！
        - id: ch01-b47
          speaker: narrator
          text: >-
            他再看一眼，那两滴泪仍在那里。也许旧的已经落下，又来了两滴新的。
        - id: ch01-b48
          speaker: peter
          text: >-
            她真的很爱温迪。可她怎么就不明白呢？我也爱温迪呀。太太，我们两个不能都拥有她。
        - id: ch01-b49
          speaker: narrator
          text: >-
            达林太太偏偏不肯想开，彼得也不快活了。他不再看她，她却像是不肯放过他。他又蹦又跳，还做鬼脸。可一停下来，就觉得她仿佛待在自己身体里面，一下下地敲着。
        - id: ch01-b50
          speaker: peter
          text: >-
            哦，好吧。来吧，叮叮铃。我们才不要什么傻母亲呢！
        - id: ch01-b51
          speaker: narrator
          text: >-
            他艰难地咽了一口，终于打开窗闩，又对人之天性露出一个可怕的冷笑，随后和叮叮铃一起飞走了。就这样，温迪、约翰和迈克尔回来时，到底还是找到了一扇为他们敞开的窗子。当然，他们一点也配不上这番宽待。三个人落在育儿室的地板上，脸上没有半点羞愧。最小的迈克尔甚至已经忘记了自己的家。
        - id: ch01-b52
          speaker: michael
          text: >-
            约翰，我好像以前来过这里。
        - id: ch01-b53
          speaker: john
          text: >-
            当然来过，你这个傻瓜。那不是你从前的床吗？
        - id: ch01-b54
          speaker: michael
          text: >-
            还真是。不过……真的是吗？
        - id: ch01-b55
          speaker: john
          text: >-
            嗨，快看那座狗屋！里面有个男人。
          emotion: surprised
        - id: ch01-b56
          speaker: wendy
          text: >-
            也许娜娜在里面。等等，那是爸爸！
          emotion: surprised
        - id: ch01-b57
          speaker: michael
          text: >-
            让我看看爸爸。他还没有我杀死的那个海盗高大呢。
        - id: ch01-b58
          speaker: narrator
          text: >-
            迈克尔说得坦率，失望也十分坦率。幸亏达林先生睡着了。回家后的第一句话要是让父亲听见，那可太伤人。温迪和约翰看见父亲睡在狗屋里，也都吃了一惊。
        - id: ch01-b59
          speaker: john
          text: >-
            真奇怪。爸爸从前应该不睡狗屋吧？我怎么连这也记不清了？
        - id: ch01-b60
          speaker: wendy
          text: >-
            约翰，也许我们并不像自己以为的那样记得从前的生活。
        - id: ch01-b61
          speaker: narrator
          text: >-
            三个人心里都升起一阵寒意。他们活该。
        - id: ch01-b62
          speaker: john
          text: >-
            我们都回来了，母亲却不在。她也太粗心了。
        - id: ch01-b63
          speaker: narrator
          text: >-
            这时，达林太太又弹起琴来。
        - id: ch01-b64
          speaker: wendy
          text: >-
            是母亲！
          emotion: surprised
        - id: ch01-b65
          speaker: john
          text: >-
            没错，真的是她！
        - id: ch01-b66
          speaker: michael
          text: >-
            那么，温迪，你其实不是我们的母亲吗？
        - id: ch01-b67
          speaker: narrator
          text: >-
            迈克尔一定是困了。温迪却第一次真正觉得后悔。
        - id: ch01-b68
          speaker: wendy
          text: >-
            天哪，我们的确早就该回来了。
          emotion: sad
        - id: ch01-b69
          speaker: john
          text: >-
            我们悄悄进去，用手蒙住母亲的眼睛吧。
        - id: ch01-b70
          speaker: narrator
          text: >-
            温迪觉得，这个喜讯应该更温柔地告诉母亲。她有个更好的办法。
        - id: ch01-b71
          speaker: wendy
          text: >-
            大家都钻进自己的床里。等母亲进来，就像我们从来没离开过一样。
        - id: ch01-b72
          speaker: narrator
          text: >-
            达林太太回到夜间育儿室，想看看丈夫是不是已经睡着，却发现每一张床上都躺着一个孩子。三个孩子静静等着，盼望她发出欣喜的叫声。可是那叫声没有出现。她明明看见了他们，却不相信他们真的在那里。以前，她常常在梦里看见孩子们又躺回自己的床上，所以这一次，她只以为那个梦还在身边徘徊，不肯散去。她走到炉火旁，在从前抱着孩子们的那把椅子上坐下。三个人完全不懂这是怎么回事，冰冷的恐惧一下罩住了他们。
        - id: ch01-b73
          speaker: wendy
          text: >-
            母亲！
          emotion: fearful
        - id: ch01-b74
          speaker: mrs_darling
          text: >-
            那是温迪的声音。
        - id: ch01-b75
          speaker: john
          text: >-
            母亲！
          emotion: fearful
        - id: ch01-b76
          speaker: mrs_darling
          text: >-
            那是约翰的声音。
        - id: ch01-b77
          speaker: michael
          text: >-
            母亲！
        - id: ch01-b78
          speaker: narrator
          text: >-
            迈克尔已经认出了她。
        - id: ch01-b79
          speaker: mrs_darling
          text: >-
            那是迈克尔。
        - id: ch01-b80
          speaker: narrator
          text: >-
            她向三个自私的小家伙伸出双臂，那双手臂再也不会环抱他们了。不，还是抱住了。温迪、约翰和迈克尔早已跳下床，跑到她身边，被她紧紧搂进怀里。
        - id: ch01-b81
          speaker: mrs_darling
          text: >-
            乔治，乔治！
          emotion: happy
        - id: ch01-b82
          speaker: narrator
          text: >-
            她终于能说话了。达林先生从睡梦中醒来，与她共享这份幸福，娜娜也飞奔进屋。世上再不会有比这更美的景象。可真正看见它的，只有一个趴在窗外一动不动地凝望的小男孩。这个男孩曾经有过无数次狂喜，那些快乐是别的孩子永远不会知道的。可如今，他隔着窗子望见的，却是自己永远被挡在门外、永远也不能得到的那一种欢乐。
