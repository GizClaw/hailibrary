audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着一本正经的幽默
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    peter:
      display_name: 彼得
      tts:
        delivery: 神气活现，冲动直接，孩子气十足
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    never_bird:
      display_name: 梦幻鸟
      tts:
        delivery: 急切勇敢，脾气来得快
        timbre: 清亮尖细
        pace: 偏快
        pitch: 高音
    wendy:
      display_name: 温迪
      tts:
        delivery: 温柔端正，管教孩子时不容商量
        timbre: 柔和明净
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 礁湖上的一张纸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 美人鱼一条接一条回到海底寝室。彼得离得太远，听不见她们关门，却听见珊瑚洞里的小铃铛叮当作响。那里每扇门开合时都会响铃，就像大陆上最体面的宅子一样。那是彼得彻底落单以前听见的最后一种声音。海水稳稳上涨，已经舔到了他的脚。他只能等着最后一大口海水将自己吞没，同时望着礁湖上唯一的东西打发时间。那像一张漂浮的纸，也许是风筝的一角。他漫不经心地猜着，它要多久才能漂到岸边。
        - id: ch01-b02
          speaker: narrator
          text: 可那东西来到礁湖上，分明有自己的目的。它竟在逆着潮水前进，有时还赢过了水流。每当它占上风，彼得就替弱小的一方拍手。真是一张勇敢的纸啊。其实，那是梦幻鸟。自从鸟巢落进水里，她便学会用翅膀扑打，多少能操纵这艘古怪的小船。她拼尽全力赶往彼得所在的岩石。等彼得认出她时，她已经筋疲力尽。她要把巢让给彼得，哪怕里面还有自己的蛋。
        - id: ch01-b03
          speaker: narrator
          text: 这只鸟实在叫人佩服。彼得虽然待她不错，也常常捉弄她。她大概和达林太太她们一样，看见彼得那一口乳牙还全都在，就不由得心软了。
    - id: ch02
      title: 谁也听不懂谁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 梦幻鸟喊着告诉彼得，自己为何而来。彼得也喊回去，问她究竟在做什么。可他们谁也不懂对方的语言。奇幻故事里的人总能随意同鸟儿说话，我也很想暂且假装这是那样的故事，再说彼得聪明地回答了她。可实话终究最好，我只想告诉你真正发生的事。真实情形是，他们不但听不懂，还把礼貌忘得一干二净。
        - id: ch02-b02
          speaker: never_bird
          text: 我——要——你——爬——进——鸟——巢。这——样——你——就——能——漂——到——岸——边。可——我——太——累——了，没——法——再——靠——近。你——得——游——过——来。
        - id: ch02-b03
          speaker: peter
          text: 你嘎嘎地说些什么？干吗不让鸟巢像平常一样自己漂过来？
        - id: ch02-b04
          speaker: narrator
          text: 梦幻鸟只好从头再说一遍。彼得以为自己找到了办法，也把每个字拖得又慢又清楚。
        - id: ch02-b05
          speaker: peter
          text: 你——嘎——嘎——地——说——些——什——么？
        - id: ch02-b06
          speaker: narrator
          text: 梦幻鸟的脾气本来就急，这下可恼火了。
        - id: ch02-b07
          speaker: never_bird
          text: 你这个榆木脑袋的小松鸦！怎么就不能照我的话做？
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 彼得虽然没听懂，却知道她在骂自己，便气冲冲地顶了回去。
        - id: ch02-b09
          speaker: peter
          text: 你才是！
          emotion: angry
        - id: ch02-b10
          speakers: [never_bird, peter]
          ensemble: duo
          text: 闭嘴！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: 吵归吵，梦幻鸟还是决心救他。她使出最后的力气，把鸟巢推到岩石边，然后飞了起来。她连蛋都留在巢里，这回彼得总该明白了。
    - id: ch03
      title: 鸟巢与帽子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得这才终于懂了。他一把抓住鸟巢，向头顶上不断扑动翅膀的梦幻鸟挥手道谢。可她停在空中，不是为了听他道谢，甚至也不是为了看他爬进鸟巢。她只想亲眼知道，彼得会怎样处置自己的蛋。
        - id: ch03-b02
          speaker: narrator
          text: 巢里有两只白色的大鸟蛋。彼得把它们捧起来，仔细思量该怎么办。梦幻鸟用翅膀蒙住脸，不忍心看见它们最后的下场，又实在忍不住，只好从羽毛缝里偷偷向外瞧。
        - id: ch03-b03
          speaker: narrator
          text: 岩石上插着一根木杆，是很久以前几个海盗钉进去标记宝藏地点的。孩子们已经找到了那堆闪亮的财宝。他们淘气时，会一把一把地把葡萄牙金币、钻石、珍珠和西班牙银币撒给海鸥。海鸥以为那是食物，俯冲下来抢走，发现受了卑鄙的愚弄后，又怒气冲冲地飞走。木杆依旧在那里。斯塔基把一顶很深的防水油布帽挂在上面，帽檐还很宽。彼得把鸟蛋放进帽子，再将帽子搁到礁湖上。它漂得好极了。
        - id: ch03-b04
          speaker: narrator
          text: 梦幻鸟一眼就看懂了彼得的用意，立刻尖声叫起来，毫不掩饰地夸赞他的聪明。唉，彼得也像公鸡一样叫着，表示自己完全赞同她的评价。他爬进鸟巢，把木杆竖成桅杆，又把衬衫挂起来当作船帆。就在这时，梦幻鸟扑落到帽子上，重新安安稳稳地坐住鸟蛋。她漂向一边，彼得被风带往另一边，双方一路欢呼起来。
        - id: ch03-b05
          speaker: narrator
          text: 彼得一上岸，自然把自己那艘小船拖到一个梦幻鸟很容易找到的地方。不过，那顶帽子实在太好用了，她从此便抛弃了旧巢。鸟巢四处漂荡，最后散了架。斯塔基却常常来到礁湖岸边，满心怨恨地看着梦幻鸟坐在他的帽子上。我们以后不会再见到她，所以值得在这里告诉你，如今所有梦幻鸟都把巢筑成那顶帽子的样子。巢边有一圈宽宽的边沿，小鸟们正好可以在上面兜风。
    - id: ch04
      title: 地下之家的睡觉时间
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得回到地下之家时，被风筝带到这里、又带到那里的温迪也刚刚回来。大家看见彼得，欢喜得不得了。每个男孩都有自己的历险可讲，可他们最了不起的一场历险，也许是比睡觉时间迟了好几个钟头。
        - id: ch04-b02
          speaker: narrator
          text: 这件事叫男孩们得意忘形。为了再晚一点上床，他们耍起各种鬼鬼祟祟的小花招，甚至坚持说自己需要包扎。温迪看见所有人平平安安地回了家，心里当然很骄傲，可一想到他们这么晚还不睡，立刻又觉得实在不像话。
        - id: ch04-b03
          speaker: wendy
          text: 上床，上床！
        - id: ch04-b04
          speaker: narrator
          text: 她的声音谁也不敢违抗。到了第二天，温迪却又温柔极了，给每个人都发了绷带。于是，男孩们有的一遍遍装作一瘸一拐地走来走去，有的把胳膊吊在绷带里，就这么一直玩到又该上床睡觉的时候。
