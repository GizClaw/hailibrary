  chapters:
    - id: ch01
      title: The Never Bird
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The last thing Peter heard before he was truly alone was the mermaids going, one after another, to their rooms beneath the sea. Their doors were too far away for him to hear them close. But every door in those coral caves rang a tiny bell when it opened or shut, just like the doors in the nicest houses on the mainland. Peter heard the bells.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The water kept rising until it lapped at his feet. While he waited for the tide to swallow the rock, he watched the only other thing on the lagoon. It looked like a scrap of paper floating on the water, perhaps a piece of the kite. He wondered lazily how long it would take to reach shore.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Soon he saw something odd. That scrap seemed to have a purpose. It was fighting the tide, and every now and then it won. Peter always took the weaker side, so each time it gained a little ground, he clapped. What a brave scrap of paper it was.
        - id: ch01-b04
          speaker: narrator
          text: >-
            But it was not paper at all. It was the Never Bird, struggling desperately toward Peter on her nest. Since the nest had fallen into the water, she had learned to guide that strange little boat by beating her wings. She could steer it a little, but by the time Peter knew her, she was worn out.
        - id: ch01-b05
          speaker: narrator
          text: >-
            She had come to save him. She meant to give him her nest, even though her eggs were still inside it. That was surprising. Peter had been kind to her, but he had tormented her sometimes, too. Perhaps she felt as Mrs. Darling and the others did. Perhaps the sight of all his first teeth softened her heart.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The bird called out to explain why she had come, while Peter called back to ask what she was doing. Of course, neither understood the other's language. In fanciful stories, people speak with birds as easily as anything. I wish I could say this was that sort of story and have Peter answer her sensibly. But truth is best, and I want to tell you what really happened. They understood nothing, and before long they both forgot their manners.
        - id: ch01-b07
          speaker: never_bird
          text: >-
            I want you to climb into the nest. Then you can float to shore. I'm too tired to bring it any closer, so you'll have to swim out to it.
        - id: ch01-b08
          speaker: peter
          text: >-
            What are you quacking about? Why don't you just let the nest drift like it always does?
        - id: ch01-b09
          speaker: narrator
          text: >-
            The Never Bird began again. She said every bit of it slowly, as clearly as she could.
        - id: ch01-b10
          speaker: never_bird
          text: >-
            I want you to get into the nest. Then you can drift to shore.
        - id: ch01-b11
          speaker: narrator
          text: >-
            So Peter tried speaking slowly and clearly, too.
        - id: ch01-b12
          speaker: peter
          text: >-
            What are you quacking about? Why don't you let the nest drift?
        - id: ch01-b13
          speaker: narrator
          text: >-
            Now the Never Bird lost her temper. Never birds have very short ones.
        - id: ch01-b14
          speaker: never_bird
          text: >-
            You thickheaded little jay! Why won't you do what I'm telling you?
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: >-
            Peter could tell she was calling him names, even if he did not know which ones. He answered hotly, taking a wild guess.
        - id: ch01-b16
          speaker: peter
          text: >-
            Well, so are you!
          emotion: angry
        - id: ch01-b17
          speaker: narrator
          text: >-
            Then, strangely enough, they both snapped out the very same words.
        - id: ch01-b18
          speakers: [peter, never_bird]
          ensemble: duo
          text: Shut up!
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: >-
            Even so, the bird was determined to save him. With one last tremendous effort, she drove the nest against the rock. Then she flew up and left her eggs behind, hoping that would make her meaning clear.
        - id: ch01-b20
          speaker: narrator
          text: >-
            At last Peter understood. He caught hold of the nest and waved his thanks while the bird fluttered above him. But she was not waiting for his thanks, or even to see him climb aboard. She wanted to know what he would do with her eggs.
        - id: ch01-b21
          speaker: narrator
          text: >-
            There were two large white eggs. Peter picked them up and thought. The bird covered her face with her wings so she would not have to see what happened to them, though she could not stop herself from peeking between her feathers.
        - id: ch01-b22
          speaker: narrator
          text: >-
            There was a wooden stave fixed in the rock. Long ago, some buccaneers had driven it there to mark buried treasure. The children had already found the glittering hoard. Whenever they felt mischievous, they threw handfuls of gold coins, diamonds, pearls, and pieces of eight to the gulls. The gulls swooped down, thinking it was food, then flew away furious at the rotten trick.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The stave was still there, and Starkey had hung his hat on it. It was a deep, broad-brimmed tarpaulin hat, and it did not let in water. Peter tucked the eggs inside and set the hat on the lagoon. It floated perfectly.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The Never Bird saw his plan at once and cried out in admiration. Sadly, Peter crowed that he agreed with her.
        - id: ch01-b25
          speaker: peter
          text: >-
            I knew that was clever!
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter climbed into the nest. He stood the stave upright for a mast and hung his shirt from it as a sail. At the same moment, the bird fluttered down onto the hat and settled snugly over her eggs. She drifted one way, and Peter sailed away in another. Both of them cheered.
        - id: ch01-b27
          speaker: narrator
          text: >-
            When Peter reached land, he pulled his little boat onto the beach where the bird could easily find it. But her new hat had worked so well that she gave up the old nest. It drifted around until it broke apart.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Starkey often came down to the lagoon after that. He would stand on the shore, full of bitter feelings, and watch the bird sitting on his hat. We will not see her again, so you should know that every Never Bird now builds a nest in that same shape, with a broad brim where the young birds can go out for an airing.
        - id: ch01-b29
          speaker: narrator
          text: >-
            There was great rejoicing when Peter reached the home under the ground, almost as soon as Wendy did. The kite had carried her here and there before bringing her home. Every boy had an adventure to tell. Perhaps their biggest adventure, though, was being several hours late for bed.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Being up so late made them feel enormously important. They tried all sorts of sneaky tricks to stay awake even longer, including demands for bandages. Wendy was proud and happy to have every one of them home safe. Still, she was shocked by the hour, and her voice left no room for argument.
        - id: ch01-b31
          speaker: wendy
          text: >-
            To bed! To bed!
          emotion: angry
        - id: ch01-b32
          speaker: narrator
          text: >-
            The next day, however, Wendy was wonderfully tender. She handed out bandages to everyone, and until bedtime they played at limping around and carrying their arms in slings.
