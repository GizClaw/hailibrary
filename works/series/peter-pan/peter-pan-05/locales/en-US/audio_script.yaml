  chapters:
    - id: ch01
      title: The Island Come True
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Neverland felt Peter coming back, and the whole island woke again. Wakened might be better grammar, but Peter always said woke, and woke is better.

            When Peter was away, the place usually stayed quiet. The fairies slept an extra hour each morning. The beasts looked after their young. The island people ate heavily for six days and nights. Even the pirates and the lost boys did no more than insult each other when they met. Peter hated idleness, though. Now that he was coming, everyone started moving. If you put your ear to the ground, you could hear the whole island bubbling with life.

            That evening, the lost boys were hunting for Peter. The pirates were hunting for the lost boys. The island people were hunting for the pirates, and the beasts were hunting for the island people. All four groups went round and round at the same speed, so none of them caught the one ahead.

            Everyone wanted blood except the boys. Usually they liked blood too, but tonight they were only looking forward to welcoming their captain. The number of boys on the island was always changing as they got killed and so on. Growing up was against the rules, and when any of them seemed to be doing it, Peter thinned them out. Just then there were six, if you counted both twins. Let us pretend we are lying among the sugarcane. From there, we can watch them slip past in single file, each boy gripping his dagger.

            Peter would not let them look anything like him. They wore the skins of bears they had killed themselves. The skins made them so round and furry that they rolled whenever they fell, so they had learned to keep their feet.

            Tootles came first. He was as brave as any of them, but no one was more unlucky. Great adventures always happened just after he stepped around a corner. Everything would be still, so he would go gather firewood. By the time he returned, the others would already be cleaning up the blood. His bad luck had made his face a little sad, yet it had made his nature kinder. He was the humblest of all the boys.

            Poor, kind Tootles. Danger was waiting for him that night. An adventure was about to find him, and taking it would bring him terrible sorrow. Tinker Bell wanted to cause harm, and she thought Tootles would be easiest to fool. Beware of Tinker Bell, Tootles.

            If only he could hear us. But we were not truly on the island. He went by, biting his knuckles.

            Next came cheerful, dashing Nibs. Slightly followed him, cutting whistles from the trees and dancing wildly to his own tunes. Slightly was the vainest boy. He believed he remembered how people behaved before he was lost, and that made him hold his nose in the air. Curly came fourth. He was always in trouble. Whenever Peter demanded that the guilty boy step forward, Curly had done it so often that now he stepped out automatically, whether he was guilty or not.

            The twins came last. We cannot describe either one, because we would surely describe the wrong twin. Peter never quite understood twins, and his followers were forbidden to know anything Peter did not. So the twins were uncertain about themselves. They tried to please everyone by staying close together and looking apologetic.

            The boys disappeared into the dark. Soon the pirates came behind them, because nothing stayed still for long on the island. Their dreadful song reached us before they did.
        - id: ch01-b02
          speakers: [cecco, bill_jukes, cookson, starkey]
          ensemble: chorus
          text: >-
            Avast and belay, yo ho, heave to! Away we go a-pirating. And if a shot should part us, we are sure to meet below!
        - id: ch01-b03
          speaker: narrator
          text: >-
            No more wicked-looking crew had ever hung in a row at Execution Dock. Handsome Italian Cecco walked a little ahead, often pressing his head to the ground to listen. His great arms were bare, and pieces of eight hung from his ears like ornaments. He had once carved his name in blood on the back of the prison governor at Gao.

            Behind him strode a gigantic Black pirate. He had used many names since giving up the one that mothers by the Guadjo-mo still used to frighten their children. There was Bill Jukes, tattooed from head to foot. Flint had once given him six dozen lashes aboard the Walrus before Jukes would surrender a bag of gold coins. Cookson was said to be Black Murphy's brother, though no one had proved it. Gentleman Starkey had once taught at a public school and still killed with delicate manners. Then came Skylights, known as Morgan's Skylights, and the Irish boatswain Smee. Smee was strangely friendly. He could stab a man without seeming rude, and he was the only Nonconformist in Hook's crew. After him came Noodler, whose hands were fastened on backward, then Robert Mullins, Alf Mason, and many other villains long known and feared across the Spanish Main.

            In the middle of that dark company, larger and darker than all the rest, reclined James Hook. He signed his name Jas. Hook, and people said he was the only man the Sea-Cook ever feared. Hook rested comfortably in a rough cart while his men both pulled and pushed it. In place of his right hand, he had an iron hook. Every so often, he encouraged the men to move faster with a touch of that hook. He called them dogs and treated them like dogs. They obeyed like dogs too.

            Hook was deathly pale and dark-faced. Long curls hung from his head like black candles. From a little distance, they gave his handsome face a strangely threatening look. His eyes were as blue as forget-me-nots and usually held a deep sadness. When he drove his hook into someone, though, two red spots appeared in those eyes and lit them horribly.

            Something of a great gentleman still clung to his manner. He could tear you open with elegance, and people said he could tell a fine story. He was never more dangerous than when he was most polite. Even while swearing, he chose elegant words. His whole manner showed that he came from a different kind of life than his crew. Hook had courage that could not be conquered. Still, people said there was one thing he avoided: the sight of his own blood, which was thick and an unusual color.

            Hook dressed somewhat like King Charles the Second. Earlier in life he had heard that he resembled the doomed Stuart kings. A holder of his own invention let him smoke two cigars at once. Yet the grimmest thing about him was still the iron claw.

            We can see Hook's ways by what happened to Skylights. The pirate stumbled against him and rumpled his lace collar. The hook flashed. There was a ripping sound, one scream, and then a body was kicked aside. The pirates marched on, and Hook never removed the cigars from his mouth.

            This was the terrible man Peter Pan had to face. Which one would win?

            The island people followed the pirates without a sound, creeping along a warpath invisible to untrained eyes. They carried tomahawks and knives, and paint and oil shone on their bare bodies. Scalps of boys and pirates hung around them. They belonged to the Piccaninny tribe, not the more tenderhearted Delawares or Hurons.

            Great Big Little Panther led on all fours. He had taken so many scalps that they made crawling difficult. Tiger Lily brought up the rear, the place of greatest danger, and walked proudly upright. She was a princess in her own right, the beautiful Diana and admired young woman of her people. At one moment she was playful, at another cold, and at another loving. Every warrior wanted to marry her, but she kept the altar away with her hatchet.

            They crossed fallen twigs without making a sound. Only their rather heavy breathing could be heard. After all their feasting, they were a little fat just then. In time they would work it off. For the moment, it was their greatest danger.

            They vanished as silently as they had come, like shadows. Soon the beasts took their place in the procession. Lions, tigers, and bears went by, along with countless smaller wild creatures that usually fled from them. Every kind of beast lived side by side on that favored island, especially the man-eaters. Their tongues hung out. They were hungry tonight.

            Last of all came a gigantic crocodile. We would soon learn whom she was hunting.

            After the crocodile passed, the boys came around again. The procession had to keep circling without end unless one group stopped or changed its speed. The moment that happened, the hunters behind them would be right on top of them.

            Everyone watched carefully ahead. No one guessed that danger might be creeping closer from behind. That tells you how real the island was.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The boys were the first to leave the moving circle. They threw themselves onto the grass beside their underground home.
        - id: ch01-b05
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: "I really wish Peter would come back."
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: >-
            Every boy said it nervously, though all of them were taller than their captain and much broader too.
        - id: ch01-b07
          speaker: slightly
          text: >-
            I'm the only one here who isn't scared of the pirates. Still, I wish Peter would hurry back and tell us if he's heard anything else about Cinderella.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Some faraway sound may have made Slightly add that second thought so quickly. The boys began talking about Cinderella. Tootles felt certain that his own mother must have been very much like her.

            They could speak about mothers only while Peter was gone. He had forbidden the subject because he thought it silly.
        - id: ch01-b09
          speaker: nibs
          text: >-
            The one thing I remember about my mother is how often she told my father she wanted a checkbook of her own. I don't know what a checkbook is, but I'd love to give her one.
        - id: ch01-b10
          speaker: narrator
          text: >-
            As they talked, a faint sound came from far away. You and I would have heard nothing, because we are not wild creatures of the woods. The boys heard the pirates' grim song.
        - id: ch01-b11
          speakers: [cecco, bill_jukes, cookson, starkey]
          ensemble: chorus
          text: >-
            Yo ho, yo ho, the pirate life, the flag of skull and bones! A merry hour, a hempen rope, and hey for Davy Jones!
        - id: ch01-b12
          speaker: narrator
          text: >-
            At once the lost boys disappeared. Where had they gone? Rabbits could not have vanished faster.

            All but Nibs were already inside their delightful underground home, a place we would soon come to know well. Nibs had dashed away to scout. But how had the others entered? There was no doorway in sight. There was not even a large stone that might roll aside and reveal the mouth of a cave. Look closely, though. Seven great trees stood there, each with a boy-sized opening in its hollow trunk. Those were the seven entrances to the home Hook had searched for in vain through many moons. Would he find it tonight?

            As the pirates came closer, Starkey's sharp eyes caught Nibs vanishing into the woods. His pistol came out at once, but Hook's iron claw seized his shoulder.
        - id: ch01-b13
          speaker: starkey
          text: "Let me go, Captain!"
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: >-
            Starkey twisted under the claw. Now, for the first time, Hook spoke. His voice was black.
        - id: ch01-b15
          speaker: hook
          text: "Put the pistol away first."
          emotion: angry
        - id: ch01-b16
          speaker: starkey
          text: "That was one of the boys you hate. I could've killed him."
        - id: ch01-b17
          speaker: hook
          text: "And the gunshot would've brought Tiger Lily's people down on us. Are you eager to lose your scalp?"
        - id: ch01-b18
          speaker: smee
          text: "Want me to follow him, Captain, and give him a tickle with Johnny Corkscrew?"
        - id: ch01-b19
          speaker: narrator
          text: >-
            Poor Smee had cheerful names for everything. His sword was Johnny Corkscrew because it twisted in the wound. Smee had many lovable little habits. After killing someone, for example, he wiped his spectacles instead of his blade.
        - id: ch01-b20
          speaker: smee
          text: "Johnny won't make a sound."
        - id: ch01-b21
          speaker: hook
          text: "Not this time, Smee. That's only one boy. I mean to hurt all seven. Spread out and find them."
        - id: ch01-b22
          speaker: narrator
          text: >-
            The pirates scattered among the trees. A moment later, only Hook and Smee remained.

            Hook gave a heavy sigh. Perhaps the soft beauty of the evening moved him. Whatever the reason, he suddenly wanted to tell his faithful boatswain the story of his life. He spoke at length and with great feeling. Smee was rather stupid and understood none of it.

            Then he caught the name Peter.
        - id: ch01-b23
          speaker: hook
          text: >-
            More than any of them, I want their captain. Peter Pan cut off my arm. I've waited a long time to shake his hand with this hook. Oh, how I'll tear him!
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: >-
            Hook thrust the iron claw through the air.
        - id: ch01-b25
          speaker: smee
          text: >-
            But Captain, I've often heard you say that hook is worth twenty hands. It's so useful for combing your hair and doing things around the house.
        - id: ch01-b26
          speaker: hook
          text: >-
            Aye. If I were a mother, I'd pray for every child of mine to be born with a hook instead of a hand.
        - id: ch01-b27
          speaker: narrator
          text: >-
            He gazed proudly at the iron hook and scornfully at his other hand. Then his face darkened again.
        - id: ch01-b28
          speaker: hook
          text: "Peter tossed my arm to a crocodile that happened to be passing."
        - id: ch01-b29
          speaker: smee
          text: "I have noticed that crocodiles make you strangely uneasy."
        - id: ch01-b30
          speaker: hook
          text: >-
            Not crocodiles. That crocodile. It enjoyed my arm so much that it's followed me ever since, over land and sea, licking its lips for the rest of me.
          emotion: fearful
        - id: ch01-b31
          speaker: smee
          text: "You could almost take that as a compliment."
        - id: ch01-b32
          speaker: hook
          text: "I don't want that kind of compliment! I want Peter Pan. He gave the beast its first taste of me."
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: >-
            Hook sat on a large mushroom. His voice began to tremble.
        - id: ch01-b34
          speaker: hook
          text: >-
            Smee, that crocodile would have eaten me by now, except for one lucky thing. It swallowed a clock. The clock goes tick, tick inside it, so I hear the beast coming and run.
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: >-
            He tried to laugh, but the sound was hollow.
        - id: ch01-b36
          speaker: smee
          text: "Someday the clock will stop. Then the crocodile will get you."
        - id: ch01-b37
          speaker: narrator
          text: >-
            Hook wet his dry lips.
        - id: ch01-b38
          speaker: hook
          text: "Aye. That's the fear that never leaves me."
          emotion: fearful
        - id: ch01-b39
          speaker: narrator
          text: >-
            Ever since Hook sat down, his seat had felt strangely warm.
        - id: ch01-b40
          speaker: hook
          text: "Smee, this seat is hot! Odds and thunder, I'm burning!"
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: >-
            He sprang up. The two pirates examined the mushroom. It was larger and more solid than any mushroom known on the mainland. They tried to pull it from the earth. It came away at once because it had no roots. Then something even stranger happened. Smoke began rising from the opening beneath it.
        - id: ch01-b42
          speakers: [hook, smee]
          ensemble: duo
          text: "A chimney!"
          emotion: surprised
        - id: ch01-b43
          speaker: narrator
          text: >-
            They really had found the chimney of the underground home. Whenever enemies were in the neighborhood, the boys stopped up that chimney with a mushroom.

            Smoke was not the only thing coming out. Children's voices floated up too. The boys felt so safe below that they were talking merrily. Hook and Smee listened with grim faces. Then they put the mushroom back and studied the seven holes in the trees.
        - id: ch01-b44
          speaker: smee
          text: "Did you hear them? They said Peter Pan is away."
        - id: ch01-b45
          speaker: narrator
          text: >-
            Smee whispered while nervously playing with Johnny Corkscrew. Hook nodded. He thought for a long while. At last, a chilling smile spread across his dark face. Smee had been waiting for that smile.
        - id: ch01-b46
          speaker: smee
          text: "Go on, Captain. Let's hear your plan!"
        - id: ch01-b47
          speaker: hook
          text: >-
            We'll return to the ship and bake a great thick, rich cake covered in green sugar. There can only be one room down there, because there is only one chimney. Those foolish little moles never realized they didn't each need a separate door. That proves they have no mother.

            We'll leave the cake on the shore of the Mermaids' Lagoon. The boys are always swimming there and playing with the mermaids. They'll find it and gobble it up. With no mother, they don't know that rich, damp cake is dangerous. Ah, they'll die!
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: >-
            Hook burst into laughter. It was not hollow now. This time he laughed honestly. Smee had listened with greater admiration at every word.
        - id: ch01-b49
          speaker: smee
          text: "That's the prettiest, wickedest scheme I've ever heard!"
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: >-
            They danced in triumph and began to sing.
        - id: ch01-b51
          speakers: [hook, smee]
          ensemble: duo
          text: >-
            Avast and belay! When I appear, they're overcome by fear. No flesh stays on your bones once you have shaken claws with Hook!
        - id: ch01-b52
          speaker: narrator
          text: >-
            They never finished the verse. Another sound broke in and silenced them. At first it was so small that a falling leaf might have smothered it. As it drew closer, every beat became clear.

            Tick. Tick. Tick. Tick.

            Hook stood shivering with one foot raised.
        - id: ch01-b53
          speaker: hook
          text: "The crocodile!"
          emotion: fearful
        - id: ch01-b54
          speaker: narrator
          text: >-
            He raced away, and Smee ran after him.

            It truly was the crocodile. She had passed the island people, who were now following the other pirates, and she oozed onward after Hook.

            Once again, the boys came out into the open. But the night's dangers were not finished. Soon Nibs rushed among them, breathless, with a pack of wolves at his heels. Their tongues hung out, and their baying was terrible.
        - id: ch01-b55
          speaker: nibs
          text: "Help me! Help me!"
          emotion: fearful
        - id: ch01-b56
          speaker: narrator
          text: >-
            Nibs fell to the ground.
        - id: ch01-b57
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: "What can we do? What can we possibly do?"
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: >-
            In that dreadful moment, every boy thought of Peter. It was a great compliment to him.
        - id: ch01-b59
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: "What would Peter do?"
        - id: ch01-b60
          speaker: narrator
          text: >-
            Almost at once, they knew the answer.
        - id: ch01-b61
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: "Peter would look at them through his legs!"
        - id: ch01-b62
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: "Then let's do exactly what Peter would do!"
        - id: ch01-b63
          speaker: narrator
          text: >-
            That is the best way to defy wolves. The boys bent as one and peered backward through their legs. The next moment felt very long, but victory came quickly. When the boys advanced in that dreadful pose, the wolves tucked their tails and fled.

            Nibs got up. The others thought his staring eyes were still watching the wolves. He had seen something else.
        - id: ch01-b64
          speaker: nibs
          text: "I saw something much more wonderful! A huge white bird is flying this way."
          emotion: surprised
        - id: ch01-b65
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: "What kind of bird could it be?"
        - id: ch01-b66
          speaker: nibs
          text: "I don't know. It looks terribly tired, and while it flies, it keeps moaning, 'Poor Wendy.'"
          emotion: surprised
        - id: ch01-b67
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: "Poor Wendy?"
          emotion: surprised
        - id: ch01-b68
          speaker: slightly
          text: "Now I remember! There are birds called Wendies."
        - id: ch01-b69
          speaker: curly
          text: "Look! Here it comes!"
          emotion: surprised
        - id: ch01-b70
          speaker: narrator
          text: >-
            Curly pointed at Wendy in the sky. She was almost overhead now, and the boys could hear her sorrowful cry. But Tinker Bell's shrill voice rang out even more clearly.

            The jealous fairy had dropped every pretense of friendship. She darted at Wendy from every direction and pinched her viciously each time she touched her.
        - id: ch01-b71
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: "Hello, Tink!"
          emotion: surprised
        - id: ch01-b72
          speaker: narrator
          text: >-
            The boys stared at her in wonder. Tink answered with a ringing cry.
        - id: ch01-b73
          speaker: tinker_bell
          text: "Peter says you must shoot the Wendy!"
          emotion: angry
        - id: ch01-b74
          speaker: narrator
          text: >-
            The lost boys never questioned an order from Peter.
        - id: ch01-b75
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: "We'll do what Peter wants! Hurry, get the bows and arrows!"
        - id: ch01-b76
          speaker: narrator
          text: >-
            Every boy except Tootles dropped down through his tree. Tootles already had a bow and arrow. Tink saw them and rubbed her tiny hands together.
        - id: ch01-b77
          speaker: tinker_bell
          text: "Quick, Tootles! Hurry! Peter will be so pleased!"
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: >-
            Excitedly, Tootles fitted the arrow to his bow.
        - id: ch01-b79
          speaker: tootles
          text: "Move aside, Tink!"
        - id: ch01-b80
          speaker: narrator
          text: >-
            He fired. Wendy fluttered down to the ground with the arrow in her breast.
