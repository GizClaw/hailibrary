audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tinker_bell:
      display_name: 小叮当
      tts:
        delivery: 伶俐急躁，生气时像一串尖锐的小铃
        timbre: 晶莹细亮
        pace: 飞快
        pitch: 高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自负爱表现，讲话总像比别人多懂一点
        timbre: 清脆偏亮
        pace: 轻快
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 淘气机灵，反应又快又直接
        timbre: 活泼清亮
        pace: 明快
        pitch: 中高音
    twin_1:
      display_name: 双胞胎哥哥
      tts:
        delivery: 乖顺谨慎，说话带一点迟疑
        timbre: 稚嫩清亮
        pace: 适中
        pitch: 中高音
    twin_2:
      display_name: 双胞胎弟弟
      tts:
        delivery: 乖顺谨慎，常跟着哥哥开口
        timbre: 稚嫩柔和
        pace: 适中
        pitch: 高音
    cecco:
      display_name: 切科
      tts:
        delivery: 粗野低沉，唱歌时凶狠放肆
        timbre: 沙哑厚重
        pace: 稳健
        pitch: 低音
    bill_jukes:
      display_name: 比尔·朱克斯
      tts:
        delivery: 亡命而张扬，唱歌时毫不收敛
        timbre: 粗粝有力
        pace: 稍快
        pitch: 中低音
    cookson:
      display_name: 库克森
      tts:
        delivery: 阴沉凶悍，语气冷硬
        timbre: 暗哑
        pace: 适中
        pitch: 低音
    starkey:
      display_name: 斯塔基
      tts:
        delivery: 做作讲究，慌乱时失去体面
        timbre: 清晰偏冷
        pace: 克制
        pitch: 中音
    hook:
      display_name: 胡克船长
      tts:
        delivery: 阴森而彬彬有礼，暴怒时仍带贵族式傲慢
        timbre: 深沉冷暗
        pace: 缓慢而有压迫感
        pitch: 低音
    smee:
      display_name: 斯密
      tts:
        delivery: 古怪和气，迟钝中带着殷勤
        timbre: 温厚略沙哑
        pace: 不紧不慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 梦幻岛成真
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 梦幻岛感觉到彼得快回来了，又醒了过来。照语法，本该说它已经醒来，可“醒了过来”更好听，彼得也一直这么说。
        - id: ch01-b02
          speaker: narrator
          text: 彼得不在时，岛上总是很安静。仙子多睡一个钟头，野兽照料幼崽，印第安人连吃六天六夜。海盗和迷失的孩子碰面，也只朝对方咬咬大拇指。彼得一回来，一切又动了起来。他最讨厌懒散。现在把耳朵贴到地上，就能听见整座岛沸腾着生命的声音。
        - id: ch01-b03
          speaker: narrator
          text: 今晚，迷失的孩子在找彼得，海盗在找孩子，印第安人在找海盗，野兽又在找印第安人。几队人马一圈圈绕着岛走，谁也碰不到谁，因为大家走得一样快。
        - id: ch01-b04
          speaker: narrator
          text: 除了孩子，谁都想见血。孩子平时也爱见血，只是今晚出门，是为了迎接首领。岛上的孩子究竟有多少，从来都说不准。他们有时会被杀掉，诸如此类。有谁看着像是长大了，那又违反规矩，彼得便会叫人数少掉几个。这时共有六人，双胞胎算两个。我们就假装躺在甘蔗丛里，看他们排成一列溜过去，每个人的手都按着匕首。
        - id: ch01-b05
          speaker: narrator
          text: 彼得不许他们像自己。他们披着亲手杀死的熊皮，一个个又圆又毛茸茸，摔倒便会滚。因此，大家早就练得脚下很稳。
        - id: ch01-b06
          speaker: narrator
          text: 第一个是嘟嘟。他并不比别人胆小，却是这群勇士里最倒霉的。大事总在他转过街角时发生。四下一片太平，他想着正好去捡几根柴。等他回来，别人已经在清理地上的鲜血了。所以，他经历的冒险比谁都少。这样的坏运气，让他脸上总带着温和的忧郁。可它没有把嘟嘟的性情弄坏，反倒叫他更加善良，成了孩子里最谦逊的一个。
        - id: ch01-b07
          speaker: narrator
          text: 可怜又善良的嘟嘟，今晚危险就在头顶。千万别接下送到面前的冒险，不然你会陷入最深的悲苦。小叮今晚一心作恶，正需要一件工具。她觉得你最好骗。提防小叮当！
        - id: ch01-b08
          speaker: narrator
          text: 可惜嘟嘟听不见。我们并不真的在岛上，只能看着他咬着指节走过去。
        - id: ch01-b09
          speaker: narrator
          text: 接着走来的是快活潇洒的尼布斯。后面跟着斯莱特利，他会从树上削下哨子，再随着自己吹出的曲子忘情起舞。斯莱特利是孩子里最自负的一个。他以为自己还记得迷路以前的日子，也记得那时的礼节和习俗。正是这些模糊的记忆，让他的鼻子总是讨人嫌地翘着。
        - id: ch01-b10
          speaker: narrator
          text: 第四个是淘气的卷毛。彼得每次厉声问是谁干的，他都得把自己交出去。现在不管事情是不是他做的，一听命令，他就自动站出来。
        - id: ch01-b11
          speaker: narrator
          text: 最后是双胞胎。我们一形容，准会把这个说成那个。彼得自己不懂双胞胎，伙伴也不许懂彼得不懂的事，所以兄弟俩连自己是谁都有点含糊，只好歉意十足地紧紧挨着，尽力让大家满意。
        - id: ch01-b12
          speaker: narrator
          text: 孩子们没入黑暗。没过多久，海盗便沿着踪迹追来。岛上的事情总是进展得飞快。人还没出现，那首可怕的歌先传了过来。
        - id: ch01-b13
          speakers: [cecco, bill_jukes, cookson, starkey]
          ensemble: chorus
          text: 停船收帆，哟嗬，转舵，我们出海做强盗！若有一枪把你我分开，地狱里准能再碰到！
        - id: ch01-b14
          speaker: narrator
          text: 绞刑码头上吊成一排的恶棍，也没有他们长得凶。稍稍走在最前面的是英俊的意大利人切科。他裸着粗壮的手臂，耳朵上挂着西班牙银元当首饰。一路上，他不时低下头，把耳朵贴到地面倾听。这个切科曾用鲜血写成的字，把自己的名字刻在高城监狱长背上。
        - id: ch01-b15
          speaker: narrator
          text: 后面那个高大的黑人早已丢掉本名，换过许多名字。瓜乔莫河边的黑人母亲，至今还拿他的旧名吓孩子。浑身刺青的比尔·朱克斯也在。他在《海象号》上挨了弗林特六打鞭子，仍不肯放下那袋葡萄牙金币。
        - id: ch01-b16
          speaker: narrator
          text: 再往后，是据说和黑墨菲有亲、却从未证实的库克森。绅士斯塔基从前在公学当助教，杀人仍很讲究。还有摩根手下的天窗，爱尔兰水手长斯密，双手前后装反的努德勒，罗伯特·马林斯、阿尔夫·梅森，以及许多在西班牙海域令人闻名丧胆的凶徒。
        - id: ch01-b17
          speaker: narrator
          text: 爱尔兰水手长斯密，是个古怪和气的人。他拿刀捅你时，也像丝毫不愿冒犯你。他还是胡克船上唯一的非国教徒。斯密身上这种讨人喜欢的特点多着呢。比如杀完人以后，他仔细擦干净的不是那把弯刀，而是自己的眼镜。
        - id: ch01-b18
          speaker: narrator
          text: 在这片阴暗的人群中央，卧着其中最黑、也最大的身影。他就是詹姆斯·胡克，自己签名时写作“詹·胡克”。据说，连海上厨子都只怕他一个。胡克舒舒服服地躺在一辆粗陋的车里，由手下在前后推拉。右手的位置装着铁钩，他不时用钩子鼓励大家加快脚步。这个可怕的人把手下当狗看，也当狗呵斥，他们果真像狗一样服从。
        - id: ch01-b19
          speaker: narrator
          text: 胡克面容枯槁，肤色黝黑。长卷发远看像一排黑蜡烛，让英俊的脸显得分外险恶。他的眼睛像勿忘草一样蓝，总带着深沉的忧郁。可当铁钩扎进你身体时，眼里会亮起两点红光。
        - id: ch01-b20
          speaker: narrator
          text: 他身上还留着大贵族的派头，甚至剖开你的肚子，也能做得从容优雅。听说他还是个很有名的讲故事好手。胡克越有礼貌，样子便越阴森，这大概最能检验一个人的教养。哪怕在咒骂，他的措辞仍然优雅，举止也卓然不同，一看便知道他和手下不是一路人。
        - id: ch01-b21
          speaker: narrator
          text: 胡克有着不可动摇的勇气。据说，他唯一害怕的，是亲眼看见自己的血。那血十分浓稠，颜色也异乎寻常。他的衣着有意模仿查理二世时代的样式，因为早年曾有人说，他和命运多舛的斯图亚特王族有一种古怪的相似。胡克嘴里还衔着自己做的烟嘴，可以同时抽两支雪茄。不过他身上最叫人胆寒的，还是那只铁钩。
        - id: ch01-b22
          speaker: narrator
          text: 现在杀一个海盗，看看胡克的手段吧。天窗走路不稳，撞皱了胡克的蕾丝衣领。铁钩猛地伸出。只听一声撕裂，一声惨叫，尸体便被踢到路旁。队伍继续前进，胡克连雪茄都没取下来。
        - id: ch01-b23
          speaker: narrator
          text: 彼得·潘要对付的，就是这样一个可怕的人。究竟谁会赢？
        - id: ch01-b24
          speaker: narrator
          text: 印第安人跟在海盗后面，沿着外行人根本看不见的战径无声潜行，一个个警觉万分。他们拿着战斧和短刀，赤裸的身体涂满油彩，闪着油亮的光。身上串着一张张头皮，其中有海盗的，也有孩子的。他们是皮卡尼尼部族，可不能和心肠较软的特拉华人或休伦人混在一起。
        - id: ch01-b25
          speaker: narrator
          text: “大大个小豹子”四肢着地走在最前头。他猎到的头皮实在太多，现在反而有点挡路。最危险的队尾，由昂首挺立的虎莉莉守着。她生来就是公主，是肤色黝黑的狄安娜中最美的一位，也是族里最出众的姑娘。她一会儿热情，一会儿冷若冰霜，一会儿又会卖弄风情。所有勇士都想娶这个任性的姑娘，她却总拿战斧把婚礼挡在门外。
        - id: ch01-b26
          speaker: narrator
          text: 他们踩过枯枝也没有声音，只听得见沉重的呼吸。原来大家刚刚饱餐过，现在都有点胖。以后会瘦下来的，可眼下这正是最大的危险。
        - id: ch01-b27
          speaker: narrator
          text: 印第安人像影子一样到来，又像影子一样消失。没过多久，一支庞大又庞杂的兽群占据了他们走过的地方。里面有狮子、老虎、熊，还有无数四处逃避这些猛兽的小型凶物。在这座得天独厚的岛上，各种野兽都挤在一起生活，尤其是那些吃人的家伙。今晚它们全都饿了，一条条舌头垂在嘴外。
        - id: ch01-b28
          speaker: narrator
          text: 兽群之后，最后来了条巨大的鳄鱼。她在找谁，我们很快就会知道。
        - id: ch01-b29
          speaker: narrator
          text: 鳄鱼过去不久，孩子们又从原来的方向绕了回来。只要其中一队不停下脚步，也不改变速度，这支环形队伍就会没完没了地转下去。可一旦有谁停住，或是走得快些、慢些，几队人马马上便会撞在一起。
        - id: ch01-b30
          speaker: narrator
          text: 每个人都盯紧前方，没人想到危险正从身后爬来。这正说明梦幻岛有多么真实。
        - id: ch01-b31
          speaker: narrator
          text: 最先退出这个不断转动的圆圈的是孩子们。他们一口气跑到地下之家附近，扑倒在柔软的草地上。虽然这群孩子个个都比首领高，尤其横着量，比他宽得更多，这时说起话来却全都不安极了。
        - id: ch01-b32
          speakers: [tootles, nibs, slightly, curly, twin_1, twin_2]
          ensemble: chorus
          text: 真希望彼得快回来。
        - id: ch01-b33
          speaker: slightly
          text: 海盗嘛，只有我一个人不怕。不过彼得还是快回来吧，我想知道他有没有听到更多灰姑娘的事。
        - id: ch01-b34
          speaker: narrator
          text: 他们说起灰姑娘，嘟嘟深信自己的母亲一定和她很像。也只有彼得不在时，孩子才敢谈母亲，因为彼得嫌这个话题太傻，早就禁止了。
        - id: ch01-b35
          speaker: nibs
          text: 我只记得妈妈常对爸爸说，她真想有一本自己的支票簿。我不知道那是什么，不过我特别想送她一本。
        - id: ch01-b36
          speaker: narrator
          text: 说话间，远处传来声响。你我不是林中的野物，什么也听不见，孩子们却听清了那首阴森的歌。
        - id: ch01-b37
          speakers: [cecco, bill_jukes, cookson, starkey]
          ensemble: chorus
          text: 哟嗬，哟嗬，海盗的生涯，骷髅白骨旗飘扬！一阵快活，一根麻绳，去找戴维·琼斯又何妨！
        - id: ch01-b38
          speaker: narrator
          text: 迷失的孩子立刻不见了。咦，他们刚才还在这里，现在一个影子也没有，就连兔子都不可能消失得这样快。我来告诉你吧，除了飞奔出去侦察的尼布斯，其余人已经钻进了地下的家。那是一处十分可爱的住所，过不了多久，我们还会常常见到它。
        - id: ch01-b39
          speaker: narrator
          text: 可他们是怎么进去的？地面明明没有入口，连一块能够推开、让洞口露出来的大石头也没有。可你仔细一看，就会发现附近有七棵大树，每棵空心的树干上都有一个洞，大小正好能容一个孩子通过。那就是地下之家的七个入口。胡克找了许多个月也没找到，今晚他会发现吗？
        - id: ch01-b40
          speaker: narrator
          text: 海盗渐渐逼近。眼尖的斯塔基看见尼布斯消失在树林里，马上拔出手枪。一只铁钩却抓住了他的肩膀。
        - id: ch01-b41
          speaker: starkey
          text: 船长，快松手！
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: 胡克第一次开口了。他的嗓音黑沉沉的。
        - id: ch01-b43
          speaker: hook
          text: 先把手枪收起来。
          emotion: angry
        - id: ch01-b44
          speaker: starkey
          text: 那是你恨的孩子。我刚才一枪就能打死他。
        - id: ch01-b45
          speaker: hook
          text: 那枪声也会把虎莉莉的人招来。你很想让他们剥掉头皮吗？
        - id: ch01-b46
          speaker: smee
          text: 船长，要不我追过去，用“约翰尼开瓶钻”给他挠挠痒？
        - id: ch01-b47
          speaker: narrator
          text: 斯密总爱给东西起和气的名字。他把弯刀叫“约翰尼开瓶钻”，因为刀刃会在伤口里扭动。杀完人，他擦干净的也是眼镜，而不是刀。
        - id: ch01-b48
          speaker: smee
          text: 约翰尼做事可一点声音都没有。
        - id: ch01-b49
          speaker: hook
          text: 现在不行，斯密。那只是一个，我要七个一起遭殃。叫大家散开去找。
        - id: ch01-b50
          speaker: narrator
          text: 海盗们散入树林，转眼只剩胡克和斯密。船长重重地叹了口气。我也不知道为什么，也许是傍晚的景色太柔美，他忽然想把自己一生的故事都说给忠心的水手长听。他说了很久，神情还十分恳切。可斯密脑子不太灵光，从头到尾一句也没听懂。过了一阵，他总算捕捉到“彼得”这个名字。
        - id: ch01-b51
          speaker: hook
          text: 我最想抓的就是他们的首领彼得·潘。是他砍掉了我的手臂。我等了太久，就盼着拿这只手跟他握一握。我要把他撕碎！
          emotion: angry
        - id: ch01-b52
          speaker: smee
          text: 可你常说，这钩子顶得上二十只手。梳头也好，做家常事也好，都特别方便。
        - id: ch01-b53
          speaker: hook
          text: 没错。我要是个母亲，一定会祈求孩子生来长这个，千万别长那种手。
        - id: ch01-b54
          speaker: narrator
          text: 胡克骄傲地看看铁钩，又轻蔑地瞥了另一只手，随后再次皱紧眉头。
        - id: ch01-b55
          speaker: hook
          text: 彼得砍掉我的手臂，扔给了正好经过的鳄鱼。
        - id: ch01-b56
          speaker: smee
          text: 我一直觉得奇怪，你怎么会那么怕鳄鱼。
        - id: ch01-b57
          speaker: hook
          text: 我怕的不是所有鳄鱼，只是那一条。斯密，它太喜欢我那只手的味道了。从那以后，它从一片海跟到另一片海，又从一块陆地追到另一块陆地，始终没有放弃。它一路舔着嘴唇，等着把我剩下的部分也吃掉。
        - id: ch01-b58
          speaker: smee
          text: 这么想的话，这也算它在恭维你。
        - id: ch01-b59
          speaker: hook
          text: 我才不要！我要彼得·潘。是他先让那畜生尝到了我的味道。
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: 胡克坐到一朵大蘑菇上，声音开始发颤。
        - id: ch01-b61
          speaker: hook
          text: 那鳄鱼本来早就能吃了我。幸好它吞下一只钟，肚子里一直嘀嗒响。它还没靠近，我听到钟声就能逃跑。
          emotion: fearful
        - id: ch01-b62
          speaker: narrator
          text: 胡克笑了几声，笑声却空洞极了。
        - id: ch01-b63
          speaker: smee
          text: 总有一天，钟会停。那时候它就抓到你了。
        - id: ch01-b64
          speaker: hook
          text: 对。这正是一直缠着我的恐惧。
          emotion: fearful
        - id: ch01-b65
          speaker: narrator
          text: 胡克舔舔干燥的嘴唇。坐下以后，他一直觉得身下热得奇怪。
        - id: ch01-b66
          speaker: hook
          text: 斯密，这座位好烫！见鬼，火钳铁锤都来了，我要烧起来了！
          emotion: surprised
        - id: ch01-b67
          speaker: narrator
          text: 他跳起来。两人查看那朵大陆上绝没有的巨大蘑菇，试着一拔，蘑菇马上掉进手中，原来没有根。紧接着，烟从下面冒了出来。海盗彼此望了一眼。
        - id: ch01-b68
          speakers: [hook, smee]
          ensemble: duo
          text: 是烟囱！
          emotion: surprised
        - id: ch01-b69
          speaker: narrator
          text: 他们真的发现了地下之家的烟囱。只要敌人在附近，孩子们总会用蘑菇把烟囱堵住。现在，从底下冒出来的不只有烟，还有一阵阵孩子的说话声。他们觉得藏身处安全极了，正在里面快乐地聊天。两个海盗阴沉着脸听了一阵，又把蘑菇放回原位。他们环顾四周，这才注意到七棵树上的洞。
        - id: ch01-b70
          speaker: smee
          text: 你听见了吗？他们说彼得·潘不在家。
        - id: ch01-b71
          speaker: narrator
          text: 斯密不安地摆弄着弯刀。胡克点点头，沉思了许久。终于，他黝黑的脸上浮起一个让人发冷的笑容。斯密一直在等这个笑。
        - id: ch01-b72
          speaker: smee
          text: 船长，快把你的计策剖开，让我听听！
        - id: ch01-b73
          speaker: hook
          text: 我们回船上去，烤一个又大又厚、油润香甜的蛋糕，上面撒满绿色糖霜。地下只有一根烟囱，所以只能有一个房间。那些愚蠢的小鼹鼠却想不到，他们住在同一个房间，根本不需要每个人各开一扇门。这便说明，他们没有母亲教导。
        - id: ch01-b74
          speaker: hook
          text: 接着，我们把蛋糕放在美人鱼礁湖岸边。那群孩子总在那里游水，还跟美人鱼玩。他们发现蛋糕，准会扑上去，一口口全吞下去。他们没有母亲，自然没人告诉他们，又腻又湿的蛋糕吃起来有多危险。啊哈，这一回，他们会全部死掉！
        - id: ch01-b75
          speaker: narrator
          text: 胡克放声大笑。这次一点也不空洞，而是真心实意地开心。斯密越听越佩服。
        - id: ch01-b76
          speaker: smee
          text: 这真是我听过最邪恶、又最漂亮的主意！
          emotion: happy
        - id: ch01-b77
          speaker: narrator
          text: 两人得意得跳起舞，唱起歌来。
        - id: ch01-b78
          speakers: [hook, smee]
          ensemble: duo
          text: 停船收帆，只要我露面，人人吓得魂飞魄散！谁同胡克握过铁爪，骨头上别想剩一口饭！
        - id: ch01-b79
          speaker: narrator
          text: 可歌没唱完，另一个声音便闯进来，叫他们立刻住了口。起先，那声音小得连落叶都能压住。它越来越近，也越来越清楚。
        - id: ch01-b80
          speaker: narrator
          text: 嘀嗒，嘀嗒，嘀嗒，嘀嗒！胡克浑身发抖，一只脚还悬在半空。
        - id: ch01-b81
          speaker: hook
          text: 是鳄鱼！
          emotion: fearful
        - id: ch01-b82
          speaker: narrator
          text: 胡克倒抽一口气，撒腿便跑，忠心的水手长紧紧跟上。来的果然是那条鳄鱼。她刚刚从印第安人身边经过，这时，那些印第安人正沿着踪迹追赶其余的海盗。鳄鱼则拖着沉重的身体，慢慢流过去似的，继续追在胡克身后。
        - id: ch01-b83
          speaker: narrator
          text: 孩子们又一次从地下钻到空地上。可是，今晚的危险还远远没有结束。没过多久，尼布斯上气不接下气地冲进伙伴中间，身后紧追着一群恶狼。追赶者的舌头全垂在嘴外，一路发出可怕的嚎叫。
        - id: ch01-b84
          speaker: nibs
          text: 救救我，快救救我！
          emotion: fearful
        - id: ch01-b85
          speakers: [tootles, slightly, curly, twin_1, twin_2]
          ensemble: chorus
          text: 我们该怎么办？这可怎么办呀？
          emotion: fearful
        - id: ch01-b86
          speaker: narrator
          text: 这种危急时刻，他们先想到的还是彼得。这实在是对彼得极高的赞美。
        - id: ch01-b87
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: 要是彼得在，他会怎么做？
        - id: ch01-b88
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: 彼得会弯下腰，从两腿中间倒着看狼！
        - id: ch01-b89
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: 那就照彼得的办法做！
        - id: ch01-b90
          speaker: narrator
          text: 要对付狼，这的确是最管用的办法。孩子们像一个人似的全都弯下腰，从自己的两腿中间倒着望过去。接下来的一瞬，仿佛比平常的一瞬长了许多。可胜利来得很快。孩子们保持着这种可怕的姿势，一步步向前逼近，狼群马上垂下尾巴，转身逃走了。
        - id: ch01-b91
          speaker: narrator
          text: 狼群逃走以后，尼布斯才从地上爬起来。他仍然瞪大眼睛，一眨也不眨。伙伴们见了，还以为他的目光追着那些狼。可尼布斯这时望见的，根本不是狼，而是另一件东西。
        - id: ch01-b92
          speaker: nibs
          text: 我看见了更奇妙的东西！有一只白色的大鸟，正在往这边飞。
          emotion: surprised
        - id: ch01-b93
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: 你觉得那是什么鸟？
        - id: ch01-b94
          speaker: nibs
          text: 我也不知道。它好像已经累坏了，边飞边哀叫“可怜的温迪”。
          emotion: surprised
        - id: ch01-b95
          speakers: [tootles, slightly, curly, twin_1]
          ensemble: chorus
          text: 可怜的温迪？
          emotion: surprised
        - id: ch01-b96
          speaker: slightly
          text: 我想起来了，有一种鸟就叫温迪鸟。
        - id: ch01-b97
          speaker: curly
          text: 快看，她来了！
          emotion: surprised
        - id: ch01-b98
          speaker: narrator
          text: 卷毛抬手指向天空中的温迪。她已经快飞到大家头顶，孩子们能听见她一声声凄楚的呼喊。可比那声音更清楚的，是小叮当尖厉的叫声。这个满心嫉妒的仙子已经彻底撕掉友善的伪装。她从各个方向冲向自己的猎物，每次贴着温迪飞过，都要狠狠拧她一下。
        - id: ch01-b99
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: 你好呀，小叮！
        - id: ch01-b100
          speaker: tinker_bell
          text: 彼得要你们把温迪鸟射下来！
          emotion: angry
        - id: ch01-b101
          speaker: narrator
          text: 只要说是彼得的命令，孩子们天生就不会怀疑。
        - id: ch01-b102
          speakers: [tootles, nibs, slightly, curly]
          ensemble: chorus
          text: 那就照彼得的意思办！快拿弓箭！
        - id: ch01-b103
          speaker: narrator
          text: 除了嘟嘟，其他孩子全都飞快地钻进自己的树洞，去取弓箭。嘟嘟身边正好带着一副弓箭，不用离开。小叮立刻注意到了，兴奋地搓起两只小手。
        - id: ch01-b104
          speaker: tinker_bell
          text: 快呀，嘟嘟，快动手！彼得一定会特别高兴！
          emotion: happy
        - id: ch01-b105
          speaker: narrator
          text: 嘟嘟激动地把箭搭上弓弦。
        - id: ch01-b106
          speaker: tootles
          text: 让开，小叮！
        - id: ch01-b107
          speaker: narrator
          text: 他放出了箭。温迪胸口中箭，像一只受伤的鸟，轻轻飘落到地面。
