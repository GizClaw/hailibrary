audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    hook:
      display_name: 胡克船长
      tts:
        delivery: 阴森而彬彬有礼，暴怒时仍带贵族式傲慢
        timbre: 深沉冷暗
        pace: 缓慢而有压迫感
        pitch: 低音
    smee:
      display_name: 斯密
      tts:
        delivery: 古怪和气，迟钝中带着殷勤
        timbre: 温厚略沙哑
        pace: 不紧不慢
        pitch: 中低音
    starkey:
      display_name: 斯塔基
      tts:
        delivery: 做作讲究，慌乱时失去体面
        timbre: 清晰偏冷
        pace: 克制
        pitch: 中音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自负爱表现，讲话总像比别人多懂一点
        timbre: 清脆偏亮
        pace: 轻快
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 淘气机灵，反应又快又直接
        timbre: 活泼清亮
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 礁湖变了脸色
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            闭上眼睛吧。要是运气好，你有时会看见一汪浅淡而美丽的颜色，没个形状，就那么悬在黑暗里。把眼睛再闭紧一点，它渐渐有了模样，颜色也越来越亮，仿佛再使一点劲就会烧起来。就在燃烧以前，礁湖出现了。人在大陆上，最多只能这样靠近它一瞬。那一瞬美得像天堂。要是它能多停留一会儿，你也许还会看见浪花，听见美人鱼唱歌。
        - id: ch01-b02
          speaker: narrator
          text: >-
            漫长的夏日里，孩子们常到礁湖上去。他们游水，仰面漂着，也学美人鱼在水中玩耍。可别以为美人鱼肯跟他们交朋友。温迪在岛上住了那么久，没有一条美人鱼肯好声好气地跟她说句话，这成了她一直放不下的遗憾。
        - id: ch01-b03
          speaker: narrator
          text: >-
            温迪悄悄走到水边，常能看见几十条美人鱼。她们尤其爱躺在弃儿岩上晒太阳，懒洋洋地梳着长发，那副样子总叫温迪生气。有时她也会轻轻游过去，几乎游到她们身边。美人鱼一发现她，马上潜进水里，临走还故意甩动尾巴，溅她满身的水。
        - id: ch01-b04
          speaker: narrator
          text: >-
            她们对别的男孩也不客气，只有彼得例外。他能坐在弃儿岩上跟她们聊上几个钟头。哪条美人鱼胆敢放肆，他就坐到她的尾巴上。彼得还拿过一把美人鱼的梳子送给温迪。
        - id: ch01-b05
          speaker: narrator
          text: >-
            月色转变时的美人鱼最叫人难忘。她们会发出奇怪的哀号，凡人在那时靠近礁湖却很危险。我们要讲的这个夜晚以前，温迪从没见过月光下的礁湖。她倒不是害怕，有彼得陪着，她有什么可怕的？只因她定下规矩，人人都得在七点前上床。
        - id: ch01-b06
          speaker: narrator
          text: >-
            雨后放晴时，她倒常来看美人鱼玩泡泡。彩虹般的水里冒出五颜六色的泡泡，美人鱼把它们当球，用尾巴互相传递，尽量让泡泡留在彩虹里，直到破掉。彩虹两头就是球门，只有守门的美人鱼能用手。有时湖上同时打着十几场比赛，确实好看。
        - id: ch01-b07
          speaker: narrator
          text: >-
            孩子们只要想加入，美人鱼便一条不剩地消失，他们只好自己玩。不过，美人鱼其实躲在暗处偷看，甚至还向孩子们学了一招。约翰想出用头撞泡泡的打法，她们后来也用上了。这就是约翰留给梦幻岛的唯一印记。
        - id: ch01-b08
          speaker: narrator
          text: >-
            午饭过后，温迪一定要孩子们在岩石上休息半个钟头。就算午饭只是装着吃的，休息也必须是真的。他们躺在阳光里，晒得浑身发亮，温迪坐在一旁，神情像个很有分量的大人。那一天，他们又全挤在弃儿岩上。岩石只比家里的大床宽一点，幸好人人都懂得少占地方。
        - id: ch01-b09
          speaker: narrator
          text: >-
            孩子们有的睡着了，有的闭眼装睡，趁温迪不注意，还要偷偷掐身边的人一下。温迪忙着缝补，没有工夫理会。就在针线穿来穿去的时候，礁湖变了。水面一阵阵发抖，太阳不见了，阴影贴着水悄悄爬过来，四周冷了下去。
        - id: ch01-b10
          speaker: narrator
          text: >-
            温迪已经看不清针眼。她抬起头，发现往日满是笑声的礁湖忽然又凶险又陌生。来的并不是黑夜，而是一样跟黑夜同样黑的东西。不，还要更糟。那东西尚未到来，只先让海水打了一个寒战，告诉他们，它正在路上。究竟是什么呢？
        - id: ch01-b11
          speaker: narrator
          text: >-
            关于弃儿岩的可怕故事，一下子全涌进温迪心里。恶毒的船长会把水手扔在这块岩石上，让他们等死。潮水涨起来，岩石没入水中，人也就淹死了，这正是它名字的来历。
        - id: ch01-b12
          speaker: narrator
          text: >-
            温迪本该马上叫醒孩子们。不知名的危险正一步步靠近，岩石也已经冷得不适合睡觉。可她这个小妈妈还太年轻，只觉得饭后休息半小时的规矩无论如何都得遵守。她害怕极了，多想听见一个男子汉开口，却还是没有叫醒他们。后来，沉闷的桨声从水上传来，她的心几乎跳到嗓子眼，仍旧守在孩子们身旁，让他们睡足。你说，温迪勇敢不勇敢？
        - id: ch01-b13
          speaker: narrator
          text: >-
            幸好男孩当中有人睡着也闻得出危险。彼得猛然站起，像狗一样一下就清醒了。他发出警报，所有孩子立刻醒来。他一手拢在耳边，一动不动地听着。
        - id: ch01-b14
          speaker: peter
          text: 海盗来了！
        - id: ch01-b15
          speaker: narrator
          text: >-
            大家都靠向彼得。他脸上浮起一种古怪的微笑，温迪看得打了个寒战。那笑容没有消失以前，谁也不敢问话，只能站好，等他发令。彼得的命令又快又利落。
        - id: ch01-b16
          speaker: peter
          text: 大家马上潜进水里！
        - id: ch01-b17
          speaker: narrator
          text: >-
            几双腿在水上一闪，礁湖顿时空了。弃儿岩独自立在阴沉的水中，仿佛它也成了被抛弃的弃儿。
    - id: ch02
      title: 虎莲与黑暗中的声音
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一只海盗小艇渐渐靠近。船上有斯密、斯塔基，还有被他们捉住的虎莲公主。她的手腕和脚踝都被绑着，也明白海盗准备怎样处置她。他们要把她留在弃儿岩上淹死。对她的族人来说，这比火刑和酷刑还可怕，因为部族典籍中说过，水里没有通往幸福猎场的路。
        - id: ch02-b02
          speaker: narrator
          text: >-
            虎莲脸上没有显出一点惧色。她是酋长的女儿，也要像酋长的女儿那样死去。海盗发现她时，她嘴里衔着刀，正往他们的船上爬。胡克从不派人守船，他总吹嘘自己的名字会随风飘出一英里，替他守住一切。现在，虎莲的死也要替他守船了。夜风里又将多一声哀号。
        - id: ch02-b03
          speaker: narrator
          text: >-
            两名海盗带来的黑暗遮住了岩石。他们一直没看见，直到小艇砰的一声撞上去。
        - id: ch02-b04
          speaker: smee
          text: >-
            快转舵，你这个饭桶！岩石就在这儿。现在把这个红种人抬上去，让她留在这里淹死。
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: >-
            海盗只用残暴的一瞬，就把美丽的姑娘扔上岩石。虎莲知道挣扎也没有用，更不肯低头求饶。离岩石很近的暗处，彼得和温迪的脑袋随着水波一起一伏。温迪哭了，这是她亲眼见到的第一场悲剧。彼得见过很多悲剧，可他已经全忘了。
        - id: ch02-b06
          speaker: narrator
          text: >-
            彼得没有温迪那么替虎莲难过。他真正气恼的是，两个海盗竟合力欺负一个人。他非救她不可。只要等海盗离开再动手，本来很容易，可彼得从不肯走容易的路。几乎没有什么事是他做不到的，这一次，他学起了胡克的声音。
        - id: ch02-b07
          speaker: peter
          text: 喂，船上那两个饭桶，听见我说话没有？
        - id: ch02-b08
          speaker: narrator
          text: >-
            他学得实在太像了，两个海盗吃惊地互相瞪着。
        - id: ch02-b09
          speaker: smee
          text: 是船长在叫我们！
          emotion: surprised
        - id: ch02-b10
          speaker: starkey
          text: 我们找不到他，他一定正从水里游过来。
        - id: ch02-b11
          speaker: smee
          text: 船长，我们正要把这个红种人放到岩石上。
        - id: ch02-b12
          speaker: peter
          text: 把她放了。
        - id: ch02-b13
          speaker: smee
          text: 船长，您真要我们放了她吗？
          emotion: surprised
        - id: ch02-b14
          speaker: peter
          text: 对，割开她身上的绳子，让她离开。
        - id: ch02-b15
          speaker: smee
          text: 可是，船长，这到底是为什么？
        - id: ch02-b16
          speaker: peter
          text: 立刻照办！再不动手，我就把铁钩扎进你们身上！
          emotion: angry
        - id: ch02-b17
          speaker: smee
          text: 这道命令实在怪得很！
          emotion: surprised
        - id: ch02-b18
          speaker: starkey
          text: 不管多奇怪，我们最好还是服从船长。
        - id: ch02-b19
          speaker: smee
          text: 好吧，我这就照办。
        - id: ch02-b20
          speaker: narrator
          text: >-
            斯密割断绳索，虎莲马上像条鳗鱼一样滑过斯塔基两腿之间，钻入水中。温迪见彼得这么聪明，心里得意极了。她也知道彼得准会为自己得意，说不定马上就要像公鸡一样叫起来，暴露藏身之处。她赶忙伸手去捂他的嘴。
        - id: ch02-b21
          speaker: narrator
          text: >-
            那只手伸到一半，忽然停住。礁湖上传来胡克的声音，这一回并不是彼得在学他说话。
        - id: ch02-b22
          speaker: hook
          text: 喂，小船上的人，快回答我！
        - id: ch02-b23
          speaker: narrator
          text: >-
            彼得本来或许正要啼叫，现在嘴巴却惊讶地噘成了吹口哨的样子。胡克又喊了一遍，温迪终于明白，真正的胡克也在水中。他正朝小艇游去。手下举灯给他照路，不久，他的铁钩便扣住了船舷。
        - id: ch02-b24
          speaker: narrator
          text: >-
            灯光下，温迪看见胡克那张邪恶黝黑的脸滴着水，从湖里升起来。她吓得浑身发抖，很想赶紧游走，彼得却一动不动。他浑身充满活力，也满脑袋都是自负。
        - id: ch02-b25
          speaker: peter
          text: 温迪，你说我是不是了不起？我可真了不起！
          emotion: happy
        - id: ch02-b26
          speaker: narrator
          text: >-
            温迪心里也这么想。可为了彼得的名声，她很庆幸只有自己听见这番话。彼得示意她继续听。两个海盗都想知道船长为什么来这里，胡克却用铁钩托着脑袋，深深地陷在忧愁里。
        - id: ch02-b27
          speakers: [smee, starkey]
          ensemble: duo
          text: 船长，事情一切都好吗？
        - id: ch02-b28
          speaker: narrator
          text: >-
            胡克只发出一声空洞的呻吟。
        - id: ch02-b29
          speaker: smee
          text: 船长刚才叹了一口气。
        - id: ch02-b30
          speaker: starkey
          text: 船长现在又叹了一口气。
        - id: ch02-b31
          speaker: smee
          text: 船长竟然叹了第三口气。
        - id: ch02-b32
          speaker: hook
          text: 我们全完了！那些男孩竟然找到了一个妈妈！
          emotion: sad
        - id: ch02-b33
          speaker: narrator
          text: >-
            温迪明明还在害怕，胸膛却骄傲地挺了起来。
        - id: ch02-b34
          speaker: starkey
          text: 这真是个倒霉透顶的日子！
          emotion: fearful
        - id: ch02-b35
          speaker: smee
          text: 可是，妈妈究竟是什么东西？
        - id: ch02-b36
          speaker: wendy
          text: 他竟然连妈妈是什么都不知道！
          emotion: surprised
        - id: ch02-b37
          speaker: narrator
          text: >-
            温迪实在震惊，忍不住叫出了声。从此以后，她总觉得，要是可以养一只海盗当宠物，她一定会选斯密。胡克猛然起身，彼得只好一把将她拉入水下。
        - id: ch02-b38
          speaker: hook
          text: 刚才是谁在说话？
          emotion: surprised
        - id: ch02-b39
          speaker: starkey
          text: 我什么声音也没听见，船长。
        - id: ch02-b40
          speaker: narrator
          text: >-
            斯塔基把灯举到水面上。海盗们张望时，看见一个奇异的景象。先前提过的那只鸟巢正漂过礁湖，梦幻鸟安安稳稳地坐在里面。
        - id: ch02-b41
          speaker: hook
          text: >-
            斯密，你看，那就是妈妈。好好学着吧！鸟巢一定掉进了水里，可是做妈妈的会丢下自己的蛋吗？她绝不会。
        - id: ch02-b42
          speaker: narrator
          text: >-
            胡克的声音突然哽住了。也许就在那一瞬，他想起了自己天真无邪的从前。可是他立刻一挥铁钩，把这点软弱赶走。斯密感动地望着鸟巢漂过去，斯塔基却满腹疑心。
        - id: ch02-b43
          speaker: starkey
          text: 如果这只鸟是个妈妈，她也许留在附近，准备帮助彼得。
        - id: ch02-b44
          speaker: narrator
          text: >-
            胡克听得缩了一下。
        - id: ch02-b45
          speaker: hook
          text: 没错，这正是一直缠着我的恐惧。
          emotion: fearful
        - id: ch02-b46
          speaker: narrator
          text: >-
            斯密急切的声音把他从沮丧里唤醒。
        - id: ch02-b47
          speaker: smee
          text: 船长，我们为什么不抢走那些男孩的妈妈，让她也来做我们的妈妈？
        - id: ch02-b48
          speaker: hook
          text: >-
            这是个了不起的主意！我们把孩子们全抓起来，带回船上。男孩们一个个去走跳板，温迪留下，给我们当妈妈。
          emotion: happy
        - id: ch02-b49
          speaker: narrator
          text: >-
            温迪又忘了自己还藏在水里。
        - id: ch02-b50
          speaker: wendy
          text: 我绝不会给你们当妈妈！
          emotion: angry
        - id: ch02-b51
          speaker: narrator
          text: >-
            她喊完就沉进水中。海盗什么也没看见，只当风吹动了一片叶子。
        - id: ch02-b52
          speaker: hook
          text: 弟兄们，你们赞成这个计划吗？
        - id: ch02-b53
          speakers: [smee, starkey]
          ensemble: duo
          text: 我们都赞成，愿意握手作保。
        - id: ch02-b54
          speaker: hook
          text: 我也拿铁钩作保。现在，你们都发誓吧。
        - id: ch02-b55
          speaker: narrator
          text: >-
            三个人都发了誓。这时他们已经登上岩石，胡克忽然想起了虎莲。
    - id: ch03
      title: 谁才是真正的胡克
      blocks:
        - id: ch03-b01
          speaker: hook
          text: 那个红种人到哪里去了？
        - id: ch03-b02
          speaker: narrator
          text: >-
            胡克偶尔也会开玩笑，斯密和斯塔基以为这又是他的玩笑。
        - id: ch03-b03
          speaker: smee
          text: 船长，那件事已经办妥了，我们照您的意思放她走了。
        - id: ch03-b04
          speaker: hook
          text: 你们竟敢把她放走！
          emotion: angry
        - id: ch03-b05
          speaker: smee
          text: 可那是您亲口下的命令啊，船长。
          emotion: fearful
        - id: ch03-b06
          speaker: starkey
          text: 您隔着水面叫我们割断绳子，让她离开。
        - id: ch03-b07
          speaker: hook
          text: 硫黄加苦胆！这里究竟是谁在弄鬼？
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: >-
            胡克气得满脸乌黑，可两个手下显然相信自己说的每个字，这又叫他吃了一惊。他微微发抖。
        - id: ch03-b09
          speaker: hook
          text: 小子们，我从来没有下过那道命令。
          emotion: fearful
        - id: ch03-b10
          speaker: smee
          text: 这件事实在怪得叫人心里发毛。
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: >-
            三个人全都不安地动来动去。胡克提高嗓门，可声音仍在发颤。
        - id: ch03-b12
          speaker: hook
          text: 今夜游荡在黑暗礁湖上的幽灵，你能不能听见我？
          emotion: fearful
        - id: ch03-b13
          speaker: narrator
          text: >-
            彼得当然应该保持安静，可他当然不会那么做。他马上又用胡克的声音答话。
        - id: ch03-b14
          speaker: peter
          text: 天翻地覆，锤子钳子，我听得清清楚楚！
        - id: ch03-b15
          speaker: narrator
          text: >-
            在这个要紧关头，胡克连腮帮子都没白一下。斯密和斯塔基却吓得抱成一团。
        - id: ch03-b16
          speaker: hook
          text: 藏在暗处的陌生人，你到底是谁？快说！
        - id: ch03-b17
          speaker: peter
          text: 我是詹姆斯·胡克，是《快乐的罗杰号》的船长。
        - id: ch03-b18
          speaker: hook
          text: 你不是胡克，你绝对不是！
        - id: ch03-b19
          speaker: peter
          text: 硫黄加苦胆！你再敢说一次，我就把锚抛进你肚子里！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: >-
            胡克只好换成讨好的口气，甚至显得有些谦卑。
        - id: ch03-b21
          speaker: hook
          text: 既然你才是胡克，请你告诉我，我又是谁呢？
        - id: ch03-b22
          speaker: peter
          text: 你是一条鳕鱼，只是一条没用的鳕鱼。
        - id: ch03-b23
          speaker: hook
          text: 难道我只是一条鳕鱼？
          emotion: surprised
        - id: ch03-b24
          speaker: narrator
          text: >-
            直到这时，胡克高傲的心才真正垮掉。他看见两个手下都在往后退。
        - id: ch03-b25
          speakers: [smee, starkey]
          ensemble: duo
          text: 难道统领我们这么久的船长，竟然是一条鳕鱼？这太伤我们的脸面了。
        - id: ch03-b26
          speaker: narrator
          text: >-
            两个手下本来是胡克养的恶犬，现在却回过头冲他龇牙。胡克已经成了个悲剧人物，几乎没理会他们。面对这样可怕的证据，手下是否相信他已经不重要了，他得让自己继续相信自己。他觉得心里的那个“我”正在离开。
        - id: ch03-b27
          speaker: hook
          text: 老伙计，求你别在这时候抛下我。
          emotion: fearful
        - id: ch03-b28
          speaker: narrator
          text: >-
            所有伟大的海盗，阴暗的天性中都有一点女性气质，胡克也一样。这一点偶尔会给他带来敏锐的直觉。他突然改玩猜谜游戏。
        - id: ch03-b29
          speaker: hook
          text: 自称胡克的家伙，你还有别的声音吗？
        - id: ch03-b30
          speaker: narrator
          text: >-
            彼得从来抵挡不了一场游戏。他立刻换回自己的声音，快活地作答。
        - id: ch03-b31
          speaker: peter
          text: 我当然还有另一种声音。
        - id: ch03-b32
          speaker: hook
          text: 那么，你还有另一个名字吗？
        - id: ch03-b33
          speaker: peter
          text: 对，我还有另一个名字。
        - id: ch03-b34
          speaker: hook
          text: 你是一种植物吗？
        - id: ch03-b35
          speaker: peter
          text: 我不是植物。
        - id: ch03-b36
          speaker: hook
          text: 那么，你是一种矿物吗？
        - id: ch03-b37
          speaker: peter
          text: 我也不是矿物。
        - id: ch03-b38
          speaker: hook
          text: 你属于动物吗？
        - id: ch03-b39
          speaker: peter
          text: 对，我属于动物。
        - id: ch03-b40
          speaker: hook
          text: 你是一个男人吗？
        - id: ch03-b41
          speaker: peter
          text: 我才不是男人！
        - id: ch03-b42
          speaker: hook
          text: 那么，你是一个男孩吗？
        - id: ch03-b43
          speaker: peter
          text: 对，我是男孩。
        - id: ch03-b44
          speaker: hook
          text: 你只是个普通男孩吗？
        - id: ch03-b45
          speaker: peter
          text: 我绝不是普通男孩。
        - id: ch03-b46
          speaker: hook
          text: 你是个了不起的男孩吗？
        - id: ch03-b47
          speaker: peter
          text: 对，我正是个了不起的男孩！
          emotion: happy
        - id: ch03-b48
          speaker: narrator
          text: >-
            彼得的回答又响亮又得意，听得温迪心里一痛。
        - id: ch03-b49
          speaker: hook
          text: 你现在人在英国吗？
        - id: ch03-b50
          speaker: peter
          text: 我现在不在英国。
        - id: ch03-b51
          speaker: hook
          text: 你就在这片礁湖上吗？
        - id: ch03-b52
          speaker: peter
          text: 对，我就在这里。
        - id: ch03-b53
          speaker: narrator
          text: >-
            胡克完全猜不出来了。他擦着潮湿的额头，让手下接着问。
        - id: ch03-b54
          speaker: smee
          text: 我想不出还有什么问题可问，船长。
        - id: ch03-b55
          speaker: peter
          text: 你们猜不出来了！现在是不是全都认输？
          emotion: happy
        - id: ch03-b56
          speaker: narrator
          text: >-
            彼得又像公鸡一样叫了起来。他太骄傲，已经把游戏玩过了头。海盗看见机会到了，马上急切地回答。
        - id: ch03-b57
          speakers: [hook, smee, starkey]
          ensemble: chorus
          text: 对，我们猜不出来，大家都认输了！
        - id: ch03-b58
          speaker: peter
          text: 既然你们认输，我就告诉你们，我是彼得·潘！
        - id: ch03-b59
          speaker: narrator
          text: >-
            潘！只听见这个名字，胡克马上恢复了本色，斯密和斯塔基也重新变成忠心的爪牙。
        - id: ch03-b60
          speaker: hook
          text: >-
            这回我们抓住他了！斯密，快下水！斯塔基，给我看住小艇！不管是死是活，都要把彼得带来！
          emotion: angry
        - id: ch03-b61
          speaker: narrator
          text: >-
            胡克一边下令，一边跳进水里。彼得欢快的声音同时从黑暗中传来。
        - id: ch03-b62
          speaker: peter
          text: 男孩们，你们都准备好开打了吗？
          emotion: happy
        - id: ch03-b63
          speakers: [john, tootles, nibs, slightly]
          ensemble: chorus
          text: 对，我们早就准备好了！
        - id: ch03-b64
          speaker: peter
          text: 那就一起狠狠痛打海盗！
        - id: ch03-b65
          speaker: narrator
          text: >-
            战斗来得又快又猛。最先叫敌人流血的是约翰。他勇敢地爬上小艇，抱住斯塔基不放。两人扭打起来，斯塔基手里的弯刀被夺走了。他扭身滑入水中，约翰也跟着跳下去，小艇便独自漂远。
        - id: ch03-b66
          speaker: narrator
          text: >-
            水上到处有脑袋忽隐忽现。钢铁闪过寒光，紧接着便响起惨叫或欢呼。乱战中，有人连自己人也打中了。斯密的开塞钻刺到嘟嘟第四根肋骨，卷毛马上也刺伤了斯密。更远处，斯塔基正逼得斯莱特利和双胞胎连连后退。
        - id: ch03-b67
          speaker: narrator
          text: >-
            彼得在哪里？他在找更大的猎物。其他孩子个个勇敢，他们躲开海盗船长也不能怪他们。胡克挥动铁钩，在身边划出一圈死水，孩子们像受惊的鱼一样逃开。可有一个人不怕他，也只有这个人敢闯进那一圈水域。
        - id: ch03-b68
          speaker: narrator
          text: >-
            奇怪的是，两人并没有在水里相遇。胡克爬上岩石喘气，彼得也正从另一边往上爬。岩石圆溜溜的，滑得几乎抓不住，他们只能贴着石面一点点挪。谁也不知道对方正在靠近。两只摸索支点的手碰到了彼此的胳膊。他们同时抬头，两张脸近得几乎贴在一起。
        - id: ch03-b69
          speaker: narrator
          text: >-
            许多大英雄都承认，动手前的一瞬，自己的心也曾往下一沉。彼得若有过那种感觉，我一定会说出来。毕竟，彼得是这位海上厨子唯一害怕的人。可是彼得一点也不慌。他心里只有欢喜，甚至高兴得咬起那一口漂亮的牙齿。
        - id: ch03-b70
          speaker: narrator
          text: >-
            彼得飞快地从胡克腰间抽出一把刀，正要刺下去，忽然看见自己站得比对手高。这样交手不公平。他没有趁机进攻，反倒伸出手，要把胡克拉上来。
        - id: ch03-b71
          speaker: narrator
          text: >-
            就在这时，胡克张嘴咬了彼得。
    - id: ch04
      title: 岩石上的最后一刻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            真正叫彼得发懵的不是疼，而是胡克的不公平。他完全失去了还手的力气，只能惊恐地瞪着对方。每个孩子第一次受到不公平的对待，都会这样。一个孩子来到你面前，愿意做你的孩子，他以为自己有权得到的，不过是公平。
        - id: ch04-b02
          speaker: narrator
          text: >-
            你若对他不公平，过后他仍会爱你，可他再也不会完全变回从前的孩子。没有人能忘掉自己第一次遭遇的不公平。彼得是唯一的例外。他一次次碰见不公平的事，又一次次忘掉。我想，这才是他跟所有人真正不同的地方。
        - id: ch04-b03
          speaker: narrator
          text: >-
            所以这一次，对彼得来说仍像第一次。他只能毫无抵抗地望着胡克。那只铁钩接连抓伤了他两次。
        - id: ch04-b04
          speaker: narrator
          text: >-
            没过多久，其他男孩看见胡克正在水中拼命游向海盗船。那张可恶的脸上再没有一丝得意，只剩下惨白的恐惧，因为鳄鱼咬定了他，在后面紧追不舍。换作平时，男孩们一定会游在旁边欢呼，可现在他们没有那个心思。彼得和温迪都不见了。
        - id: ch04-b05
          speaker: narrator
          text: >-
            他们搜遍礁湖，不停喊着两人的名字。后来，他们找到漂走的小艇，坐上船回家，一路仍在呼喊。回答他们的只有美人鱼嘲弄的笑声。
        - id: ch04-b06
          speakers: [john, tootles, nibs, slightly]
          ensemble: chorus
          text: 彼得！温迪！你们到底在哪里？
        - id: ch04-b07
          speaker: narrator
          text: >-
            男孩们认定，彼得和温迪不是游回去，就是飞回去了。他们并不太担心，因为他们对彼得有十足的信心。想到自己肯定赶不上上床时间，他们还像男孩子那样偷偷笑起来。这回全要怪温迪妈妈！
        - id: ch04-b08
          speaker: narrator
          text: >-
            孩子们的声音远去后，冰冷的寂静压住了整个礁湖。接着，一声微弱的呼救响了起来。
        - id: ch04-b09
          speaker: peter
          text: 谁来救救我们！快来救救我们！
          emotion: fearful
        - id: ch04-b10
          speaker: narrator
          text: >-
            两个小小的身影正在岩石边同水搏斗。温迪已经昏过去，躺在彼得臂弯里。彼得用尽最后一点力气，把她拉上岩石，随后也倒在她身边。失去知觉以前，他看见水还在往上涨。他知道两个人很快都会淹死，可他再也做不了什么。
        - id: ch04-b11
          speaker: narrator
          text: >-
            他们并排躺着。一条美人鱼忽然抓住温迪的脚，轻轻把她往水里拖。彼得感觉温迪正从身边滑走，猛地惊醒，及时将她拉了回来。可接下来，他只能把实情告诉她。
        - id: ch04-b12
          speaker: peter
          text: 温迪，我们困在岩石上了。岩石越来越小，湖水很快就会把它淹没。
        - id: ch04-b13
          speaker: narrator
          text: >-
            温迪仍旧没有听懂危险到了哪一步。
        - id: ch04-b14
          speaker: wendy
          text: 那我们现在就离开这里吧。
        - id: ch04-b15
          speaker: peter
          text: 是啊，我们必须离开。
        - id: ch04-b16
          speaker: wendy
          text: 彼得，我们是游回去，还是飞回去呢？
        - id: ch04-b17
          speaker: narrator
          text: >-
            彼得不得不把全部真相说出来。
        - id: ch04-b18
          speaker: peter
          text: 温迪，要是没有我帮忙，你能独自游回岛上，或者飞回去吗？
        - id: ch04-b19
          speaker: narrator
          text: >-
            温迪只好承认，她已经累得游不动，也飞不动了。彼得听完，发出一声痛苦的呻吟。
        - id: ch04-b20
          speaker: wendy
          text: 彼得，你怎么了？是不是哪里受了伤？
        - id: ch04-b21
          speaker: peter
          text: >-
            温迪，我没办法帮你了。胡克伤了我，现在我既不能飞，也不能游。
          emotion: sad
        - id: ch04-b22
          speaker: wendy
          text: 你的意思是，我们两个人都会淹死吗？
          emotion: fearful
        - id: ch04-b23
          speaker: peter
          text: 你看看四周，水还在不停地涨。
        - id: ch04-b24
          speaker: narrator
          text: >-
            两人用手捂住眼睛，不愿再看。他们以为自己很快就要从世上消失了。就在这时，有样东西轻轻擦过彼得，像一个吻。它停在那里，仿佛在怯生生地问，自己能不能帮上忙。
        - id: ch04-b25
          speaker: narrator
          text: >-
            那是迈克尔几天前做的风筝。风筝曾挣脱他的手，独自飘远，如今尾巴恰好落到彼得身边。
        - id: ch04-b26
          speaker: peter
          text: 原来是迈克尔的风筝。
        - id: ch04-b27
          speaker: narrator
          text: >-
            彼得起初毫无兴趣，下一刻却突然抓住风筝尾巴，用力把它拉近。
        - id: ch04-b28
          speaker: peter
          text: 它以前能把迈克尔带离地面，现在一定也能带你离开！
        - id: ch04-b29
          speaker: wendy
          text: 那就让风筝把我们两个人一起带走吧！
        - id: ch04-b30
          speaker: peter
          text: 它带不动两个人，迈克尔和卷毛已经试过了。
        - id: ch04-b31
          speaker: wendy
          text: 那我们抽签决定谁跟风筝走吧。
        - id: ch04-b32
          speaker: peter
          text: 你是一位小姐，我绝不会跟你抽签。
        - id: ch04-b33
          speaker: narrator
          text: >-
            彼得说话时，已经把风筝尾巴系在温迪身上。温迪紧紧抓住他，怎么也不肯独自走。
        - id: ch04-b34
          speaker: peter
          text: 再见了，温迪。
        - id: ch04-b35
          speaker: narrator
          text: >-
            彼得把温迪推离岩石。几分钟后，风筝带着她越飞越远，终于从彼得眼前消失。礁湖上只剩下他一个人。
        - id: ch04-b36
          speaker: narrator
          text: >-
            岩石已经小得可怜，很快就会完全没入水中。苍白的光踮着脚尖，从水面悄悄走过。不久，世上最动听也最悲凉的声音响了起来。美人鱼正在呼唤月亮。
        - id: ch04-b37
          speaker: narrator
          text: >-
            彼得和别的男孩不大一样，可到了这一刻，他终于害怕了。一阵颤抖掠过他的身体，就像海面打了个寒战。海上会有一道接一道的战栗，最后聚成千百道，彼得却只颤抖了那一次。
        - id: ch04-b38
          speaker: narrator
          text: >-
            下一刻，他重新挺直身子，站在岩石上。那种微笑又回到了脸上，胸膛里仿佛有一面鼓在敲。鼓声对他说，死会是一场无比壮丽的冒险。
