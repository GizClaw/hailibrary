  chapters:
    - id: ch01
      title: The Mermaids' Lagoon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Close your eyes, and if luck is with you, you may see a pale pool of color floating in the dark. Squeeze them tighter, and the pool takes shape. The colors grow so bright that one more squeeze might set them on fire. Just before that happens, you see the lagoon. On the mainland, you get only that one heavenly moment. If it lasted for two, you might see the surf and hear the mermaids sing.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The children spent long summer days there. Most of the time they swam or floated, and they played the games the mermaids played in the water. But don't imagine that the mermaids were friendly to them. Wendy always regretted that not one mermaid spoke a civil word to her during her whole stay on the island. She could creep quietly to the edge of the lagoon and find scores of them lying on Marooners' Rock. They loved to bask there, lazily combing their hair in a way that annoyed her. Wendy might even slip into the water and swim as softly as if she were walking on tiptoe. She could come within a yard of them. The moment they saw her, they dived and splashed her with their tails, not by accident, but quite on purpose.
        - id: ch01-b03
          speaker: narrator
          text: >-
            They treated every boy the same way except Peter. He would talk with them on the rock for hours, and when they grew cheeky, he sat on their tails. Once, he gave Wendy one of their combs.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The strangest time to see the mermaids was when the moon turned. Then they made long, wailing cries, and the lagoon became dangerous for mortals. Until the evening of this adventure, Wendy had never seen it by moonlight. She stayed away less from fear, since Peter could have gone with her, than because she had a strict rule that everyone must be in bed by seven.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Wendy often went on sunny days after rain, when the mermaids came up in extraordinary numbers to play with their bubbles. The rainbow water made bubbles of many colors, and the mermaids used them as balls. They batted each bubble happily from one tail to another and tried to keep it inside the rainbow until it burst. A goal stood at either end of the rainbow, and only the two goalkeepers were allowed to use their hands. Sometimes a dozen games went on across the lagoon at once. It was a lovely sight.
        - id: ch01-b06
          speaker: narrator
          text: >-
            As soon as the children tried to join, the mermaids vanished and left them to play alone. Still, they secretly watched. We know because John invented a new way to strike the bubble with his head instead of his hand, and the mermaids copied him. That was the one mark John left on the Neverland.
        - id: ch01-b07
          speaker: narrator
          text: >-
            After their midday meal, the children rested on a rock for half an hour. Wendy insisted on a real rest, even when the meal had only been make-believe. The boys stretched out in the sun, their wet bodies shining, while she sat beside them looking important.
        - id: ch01-b08
          speaker: narrator
          text: >-
            One day they were all resting on Marooners' Rock. It was hardly larger than their great bed, but they knew how to fit into very little space. They dozed, or kept their eyes shut and pinched one another whenever they thought Wendy was not looking. Wendy was busy sewing.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Then the lagoon began to change. Tiny shivers crossed the water. The sun disappeared, and shadows moved over the surface, turning it cold. Wendy could no longer see well enough to thread her needle. When she looked up, the lagoon that had always seemed so full of laughter had become dark and unfriendly.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Wendy knew night had not come. Something as dark as night was on its way. No, it was worse than that. The thing itself had not arrived, but it had sent a shiver through the sea to warn that it was coming. What could it be? Every story she had heard about Marooners' Rock crowded into her mind. The rock had earned its name because wicked captains put sailors there and abandoned them. When the tide rose and covered the rock, the sailors drowned.
        - id: ch01-b11
          speaker: narrator
          text: >-
            She should have woken the children at once, both because danger was moving toward them and because the rock had grown too cold for sleeping. But Wendy was a young mother. She believed the half-hour rule must always be kept. Though she was frightened and longed to hear a man's voice, she let them sleep. Even when she heard muffled oars and her heart leaped into her mouth, she stood over the boys without waking them. Wasn't that brave of Wendy?
        - id: ch01-b12
          speaker: narrator
          text: >-
            Luckily, one boy could smell danger in his sleep. Peter sprang up, instantly awake, and gave a warning cry that roused the others. Then he stood perfectly still with one hand to his ear.
        - id: ch01-b13
          speaker: peter
          text: Pirates!
        - id: ch01-b14
          speaker: narrator
          text: >-
            The others crowded close. A strange smile moved across Peter's face, and Wendy shuddered when she saw it. While he wore that smile, no one dared speak. They only waited for his order.
        - id: ch01-b15
          speaker: peter
          text: Dive!
        - id: ch01-b16
          speaker: narrator
          text: >-
            Legs flashed, and in an instant the lagoon looked empty. Marooners' Rock stood alone in the threatening water, as if the rock itself had been marooned.
        - id: ch01-b17
          speaker: narrator
          text: >-
            A boat came closer. It was the pirates' dinghy, carrying three figures. Smee and Starkey were inside, along with their prisoner, Tiger Lily. Her hands and ankles were tied, and she knew exactly what they meant to do. They would leave her alone on the rock until the tide rose and drowned her. For one of her people, that end was more terrible than death by fire or torture, because their tribal book said there was no path through water to the happy hunting ground. But Tiger Lily's face showed nothing. She was a chief's daughter, and she would meet death as a chief's daughter should. That was enough.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The pirates had caught her climbing aboard their ship with a knife between her teeth. Hook kept no watch there. He boasted that the very sound of his name guarded the ship for a mile in every direction. Now Tiger Lily's fate would make that guard more terrible. At night, one more warning cry would travel around the ship on the wind.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The gloom around the pirates hid the rock until their boat struck it.
        - id: ch01-b20
          speaker: smee
          text: >-
            Turn her, you fool! There's the rock. Now we haul the girl up and leave her here to drown.
        - id: ch01-b21
          speaker: narrator
          text: >-
            In one brutal moment, they put Tiger Lily on the rock. She was too proud to struggle when struggle could do no good.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Two heads bobbed nearby, hidden from the pirates. They belonged to Peter and Wendy. Wendy was crying, because this was the first tragedy she had ever seen. Peter had seen many, but he had forgotten them all. He was not as sorry for Tiger Lily as Wendy was. What angered him was seeing two against one, and he meant to save her. He could have waited for the pirates to leave, but Peter never chose the easy way.
        - id: ch01-b23
          speaker: narrator
          text: >-
            There was almost nothing Peter could not do. Now he copied Hook's voice perfectly.
        - id: ch01-b24
          speaker: peter
          text: Ahoy, you scoundrels!
        - id: ch01-b25
          speakers: [smee, starkey]
          ensemble: duo
          text: The captain!
          emotion: surprised
        - id: ch01-b26
          speaker: starkey
          text: He must be swimming toward us. We can't see him anywhere.
        - id: ch01-b27
          speaker: smee
          text: Captain, we're putting the girl on the rock!
        - id: ch01-b28
          speaker: peter
          text: Let her go.
        - id: ch01-b29
          speakers: [smee, starkey]
          ensemble: duo
          text: Let her go?
          emotion: surprised
        - id: ch01-b30
          speaker: peter
          text: Yes. Cut her loose and set her free.
        - id: ch01-b31
          speaker: smee
          text: But, Captain—
        - id: ch01-b32
          speaker: peter
          text: Do it now, or I'll stick my hook into you!
          emotion: angry
        - id: ch01-b33
          speaker: smee
          text: That's mighty strange.
          emotion: surprised
        - id: ch01-b34
          speaker: starkey
          text: We'd better obey the captain.
          emotion: fearful
        - id: ch01-b35
          speaker: smee
          text: Aye, aye.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Smee cut the cords. Tiger Lily slipped between Starkey's legs and into the water like an eel.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Wendy was thrilled by Peter's clever trick. She also knew he would be thrilled with himself and might crow, giving them away. She reached to cover his mouth. Before her hand got there, Hook's voice rang across the lagoon.
        - id: ch01-b38
          speaker: hook
          text: Boat ahoy!
        - id: ch01-b39
          speaker: narrator
          text: >-
            This time, Peter had not spoken. His face puckered as if he were about to whistle in surprise.
        - id: ch01-b40
          speaker: hook
          text: Boat ahoy!
        - id: ch01-b41
          speaker: narrator
          text: >-
            Wendy understood. The real Hook was in the water. He swam toward the dinghy, and his men raised a lantern to guide him. Soon his hook gripped the side. In the lantern light, Wendy saw his dark, wicked face rise dripping from the lagoon. She trembled and wanted to swim away, but Peter would not move. He was tingling with excitement and swollen with pride.
        - id: ch01-b42
          speaker: peter
          text: >-
            Aren't I marvelous? Oh, I really am marvelous!
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: >-
            He whispered it only to Wendy. She agreed, but for the sake of his good name, she was glad no one else heard. Peter signaled for her to listen.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Smee and Starkey were burning to know what had brought their captain through the water to them. Hook gave no explanation. He sat in the dinghy with his head resting on his hook, sunk in such deep misery that they hardly dared question him.
        - id: ch01-b45
          speakers: [smee, starkey]
          ensemble: duo
          text: Captain, is everything all right?
          emotion: fearful
        - id: ch01-b46
          speaker: narrator
          text: >-
            Hook answered with a hollow moan.
        - id: ch01-b47
          speaker: smee
          text: He sighed.
        - id: ch01-b48
          speaker: starkey
          text: There he goes again.
        - id: ch01-b49
          speaker: smee
          text: And now he's sighed a third time.
        - id: ch01-b50
          speaker: hook
          text: It's over! Those boys have found a mother!
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: >-
            Frightened as Wendy was, she filled with pride.
        - id: ch01-b52
          speaker: starkey
          text: What a terrible day!
          emotion: fearful
        - id: ch01-b53
          speaker: smee
          text: What's a mother?
        - id: ch01-b54
          speaker: wendy
          text: He doesn't know!
          emotion: surprised
        - id: ch01-b55
          speaker: narrator
          text: >-
            Wendy was so shocked that the words escaped her. Afterward, she always thought that if anyone could keep a pirate as a pet, she would choose Smee. Peter pulled her under as Hook jumped up.
        - id: ch01-b56
          speaker: hook
          text: What was that?
          emotion: surprised
        - id: ch01-b57
          speaker: starkey
          text: I didn't hear anything.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Starkey held the lantern above the water. As they searched, a strange sight floated past. It was the nest you heard about before, with the Never bird still sitting on it.
        - id: ch01-b59
          speaker: hook
          text: >-
            Look, Smee. That is a mother. The nest fell into the water, but did she leave her eggs? No.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Hook's voice broke, as though he had remembered his own innocent days. Then he swept the weakness away with his hook. Smee stared at the bird, deeply impressed, while the nest drifted past.
        - id: ch01-b61
          speaker: starkey
          text: If she's a mother, she may be staying close to help Peter.
        - id: ch01-b62
          speaker: narrator
          text: Hook flinched.
        - id: ch01-b63
          speaker: hook
          text: Aye. That's the fear that follows me.
          emotion: fearful
        - id: ch01-b64
          speaker: narrator
          text: Smee's eager voice pulled him out of his gloom.
        - id: ch01-b65
          speaker: smee
          text: Captain, why don't we steal the boys' mother and make her our mother?
        - id: ch01-b66
          speaker: hook
          text: >-
            A magnificent plan! We'll seize the children and carry them to the ship. The boys will walk the plank, and Wendy will become our mother.
          emotion: happy
        - id: ch01-b67
          speaker: narrator
          text: Once again, Wendy forgot to stay hidden.
        - id: ch01-b68
          speaker: wendy
          text: Never!
          emotion: angry
        - id: ch01-b69
          speaker: narrator
          text: She bobbed above the water.
        - id: ch01-b70
          speaker: hook
          text: What was that?
          emotion: surprised
        - id: ch01-b71
          speaker: narrator
          text: >-
            They searched the water but saw nothing. At last, they decided the sound must have come from a leaf blowing in the wind.
        - id: ch01-b72
          speaker: hook
          text: Are you with me, my bullies?
        - id: ch01-b73
          speakers: [smee, starkey]
          ensemble: duo
          text: You have our hands on it.
        - id: ch01-b74
          speaker: hook
          text: And you have my hook. Swear it.
        - id: ch01-b75
          speaker: narrator
          text: >-
            They all swore. By then, they had climbed onto the rock. Suddenly Hook remembered Tiger Lily.
        - id: ch01-b76
          speaker: hook
          text: Where is the girl?
        - id: ch01-b77
          speaker: narrator
          text: >-
            Hook sometimes had a playful sense of humor, and the men thought he was joking now.
        - id: ch01-b78
          speaker: smee
          text: Everything's fine, Captain. We set her free.
        - id: ch01-b79
          speaker: hook
          text: You set her free?
          emotion: surprised
        - id: ch01-b80
          speaker: smee
          text: You ordered us to do it.
          emotion: fearful
        - id: ch01-b81
          speaker: starkey
          text: Your voice came across the water and told us to let her go.
        - id: ch01-b82
          speaker: hook
          text: Brimstone and gall! What trick is being played here?
          emotion: angry
        - id: ch01-b83
          speaker: narrator
          text: >-
            Hook's face darkened with rage. Then he saw that the men truly believed what they were saying, and that frightened him. He began to shake.
        - id: ch01-b84
          speaker: hook
          text: Men, I gave no such order.
          emotion: fearful
        - id: ch01-b85
          speaker: smee
          text: This is very strange indeed.
        - id: ch01-b86
          speaker: narrator
          text: >-
            All three shifted uneasily. Hook called into the darkness, and even his voice trembled.
        - id: ch01-b87
          speaker: hook
          text: Spirit haunting this dark lagoon tonight, can you hear me?
          emotion: fearful
        - id: ch01-b88
          speaker: narrator
          text: >-
            Peter should have stayed silent. Of course, he answered at once in Hook's voice.
        - id: ch01-b89
          speaker: peter
          text: Odds and bobs, hammer and tongs! I hear you.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Hook did not turn pale, but Smee and Starkey clung to each other in terror.
        - id: ch01-b91
          speaker: hook
          text: Who are you? Tell me!
        - id: ch01-b92
          speaker: peter
          text: I am James Hook, captain of the Jolly Roger.
        - id: ch01-b93
          speaker: hook
          text: No, you're not. You can't be!
          emotion: fearful
        - id: ch01-b94
          speaker: peter
          text: Brimstone and gall! Say that once more, and I'll drop anchor in you.
        - id: ch01-b95
          speaker: narrator
          text: Hook tried a humbler tone.
        - id: ch01-b96
          speaker: hook
          text: If you are Hook, then tell me this. Who am I?
        - id: ch01-b97
          speaker: peter
          text: A codfish. Nothing but a codfish.
        - id: ch01-b98
          speaker: hook
          text: A codfish?
          emotion: surprised
        - id: ch01-b99
          speaker: narrator
          text: >-
            At last, Hook's proud spirit broke. He watched his men draw away from him.
        - id: ch01-b100
          speakers: [smee, starkey]
          ensemble: duo
          text: All this time, has our captain been a codfish? How humiliating!
        - id: ch01-b101
          speaker: narrator
          text: >-
            His own men were turning on him, but Hook hardly noticed. He needed more than their faith now. He needed his own. He felt his belief in himself slipping away.
        - id: ch01-b102
          speaker: hook
          text: Don't leave me, old fellow.
          emotion: fearful
        - id: ch01-b103
          speaker: narrator
          text: >-
            There was a strange, almost feminine touch in Hook's dark nature, as there is in all the great pirates. It sometimes gave him sudden hunches. One came to him now, and he tried to uncover the hidden voice with a guessing game.
        - id: ch01-b104
          speaker: hook
          text: Hook, do you have another voice?
        - id: ch01-b105
          speaker: narrator
          text: >-
            Peter could never resist a game. He answered brightly in his own voice.
        - id: ch01-b106
          speaker: peter
          text: I do.
        - id: ch01-b107
          speaker: hook
          text: And do you have another name?
        - id: ch01-b108
          speaker: peter
          text: Aye, aye.
        - id: ch01-b109
          speaker: hook
          text: Are you a vegetable?
        - id: ch01-b110
          speaker: peter
          text: No.
        - id: ch01-b111
          speaker: hook
          text: A mineral?
        - id: ch01-b112
          speaker: peter
          text: No.
        - id: ch01-b113
          speaker: hook
          text: An animal?
        - id: ch01-b114
          speaker: peter
          text: Yes.
        - id: ch01-b115
          speaker: hook
          text: A man?
        - id: ch01-b116
          speaker: peter
          text: No!
        - id: ch01-b117
          speaker: narrator
          text: Peter's answer rang with scorn.
        - id: ch01-b118
          speaker: hook
          text: A boy?
        - id: ch01-b119
          speaker: peter
          text: Yes.
        - id: ch01-b120
          speaker: hook
          text: An ordinary boy?
        - id: ch01-b121
          speaker: peter
          text: No!
        - id: ch01-b122
          speaker: hook
          text: A wonderful boy?
        - id: ch01-b123
          speaker: narrator
          text: To Wendy's distress, Peter answered without hesitation.
        - id: ch01-b124
          speaker: peter
          text: Yes!
        - id: ch01-b125
          speaker: hook
          text: Are you in England?
        - id: ch01-b126
          speaker: peter
          text: No.
        - id: ch01-b127
          speaker: hook
          text: Are you here?
        - id: ch01-b128
          speaker: peter
          text: Yes.
        - id: ch01-b129
          speaker: narrator
          text: Hook was completely puzzled. He wiped his damp forehead.
        - id: ch01-b130
          speaker: hook
          text: One of you ask him something.
        - id: ch01-b131
          speaker: smee
          text: I can't think of one question.
          emotion: sad
        - id: ch01-b132
          speaker: peter
          text: Can't guess, can't guess! Do you give up?
          emotion: happy
        - id: ch01-b133
          speaker: narrator
          text: >-
            Peter's pride was carrying the game too far, and the pirates saw their chance.
        - id: ch01-b134
          speakers: [hook, smee, starkey]
          ensemble: chorus
          text: Yes! We give up!
        - id: ch01-b135
          speaker: peter
          text: Then I'll tell you. I am Peter Pan!
          emotion: happy
        - id: ch01-b136
          speaker: narrator
          text: >-
            Peter Pan. At once, Hook became himself again, and Smee and Starkey became his loyal followers.
        - id: ch01-b137
          speaker: hook
          text: >-
            Now we've caught him! Smee, get into the water. Starkey, guard the boat. Bring him back, dead or alive!
          emotion: angry
        - id: ch01-b138
          speaker: narrator
          text: Hook leaped as he gave the order. At that same instant, Peter called out cheerfully.
        - id: ch01-b139
          speaker: peter
          text: Are you ready, boys?
        - id: ch01-b140
          speakers: [john, tootles, nibs, slightly]
          ensemble: chorus
          text: Aye, aye!
        - id: ch01-b141
          speaker: peter
          text: Then go for the pirates!
        - id: ch01-b142
          speaker: narrator
          text: >-
            The fight was fierce and brief. John drew first blood. He climbed bravely into the boat and seized Starkey. They struggled until John tore away the pirate's sword. Starkey twisted overboard, and John jumped after him. The empty dinghy drifted away.
        - id: ch01-b143
          speaker: narrator
          text: >-
            Here and there, heads appeared and vanished across the water. Steel flashed, followed by a cry or a shout of victory. The darkness and confusion were so great that some fighters struck their own side. Smee drove his corkscrew into Tootles's fourth rib, and Curly stabbed Smee in return. Farther out from the rock, Starkey was pressing Slightly and both twins so hard that they could barely hold him back.
        - id: ch01-b144
          speaker: narrator
          text: >-
            And where was Peter? He was hunting greater prey. The other boys were brave, and no one should blame them for keeping away from Hook. His iron claw swept a circle of dead water around him, and they scattered like frightened fish. But one boy was not afraid. One was ready to enter that circle.
        - id: ch01-b145
          speaker: narrator
          text: >-
            Strangely, Peter and Hook did not meet in the water. Hook climbed onto the rock to catch his breath just as Peter climbed up the opposite side. The rock was as slippery as a ball, so neither of them could walk. They had to crawl and feel for every grip. Neither knew the other was coming. Then each reached out for a handhold and caught the other's arm. Both raised their heads in surprise. Their faces were almost touching. That was how they met.
        - id: ch01-b146
          speaker: narrator
          text: >-
            Great heroes have admitted that their hearts sometimes sank just before a fight. I would tell you if Peter's heart had sunk then. After all, Hook was the only man the Sea-Cook had ever feared. But Peter felt no fear. He felt only joy, and he ground his small teeth together with delight.
        - id: ch01-b147
          speaker: narrator
          text: >-
            In an instant, Peter pulled a knife from Hook's belt and prepared to strike. Then he noticed that he stood higher on the rock. That would not be fair. So he offered Hook a hand and helped him climb up.
        - id: ch01-b148
          speaker: narrator
          text: That was when Hook bit him.
        - id: ch01-b149
          speaker: narrator
          text: >-
            The pain of the bite did not stun Peter. Its unfairness did. He became completely helpless and could only stare at Hook in horror. Every child reacts that way the first time someone treats him unfairly. When a child comes to belong to you, the one thing he believes he has a right to expect is fairness. After you have been unfair, he may love you again, but he will never be quite the same boy. No one ever gets over that first unfairness. No one except Peter. It happened to him more than once, but every time, he forgot it. Perhaps that was the real difference between Peter and every other boy.
        - id: ch01-b150
          speaker: narrator
          text: >-
            Now it felt like the first time again. Peter stood helpless, staring, while Hook's iron hand struck him twice.
        - id: ch01-b151
          speaker: narrator
          text: >-
            A few moments later, the boys saw Hook swimming wildly toward his ship. There was no triumph on his wicked face now. It was white with fear, because the crocodile followed steadily behind him. On any ordinary day, the boys would have swum beside Hook and cheered the chase. This time, they were uneasy. Peter and Wendy were both missing, so they searched every part of the lagoon they could reach, calling their names.
        - id: ch01-b152
          speakers: [john, tootles, nibs, slightly]
          ensemble: chorus
          text: Peter! Wendy!
        - id: ch01-b153
          speaker: narrator
          text: >-
            Only the mermaids' mocking laughter answered. The boys found the drifting dinghy and started home in it, still shouting for Peter and Wendy as they went. At last, they decided the two must be swimming or flying back on their own. Their faith in Peter kept them from worrying very much. Then, like boys, they began to laugh. They were going to be late for bed, and this time it was all Mother Wendy's fault.
        - id: ch01-b154
          speaker: narrator
          text: >-
            Their voices faded, and a cold silence covered the lagoon. Then came a weak cry.
        - id: ch01-b155
          speaker: peter
          text: Help! Help!
        - id: ch01-b156
          speaker: narrator
          text: >-
            Two small figures were beating against the side of the rock. Wendy had fainted and lay across Peter's arm. With one last effort, he pulled her out of the water and onto the rock. Then he lay down beside her. As Peter fainted too, he saw that the tide was still rising around them. He knew the lagoon would soon cover the rock and drown them both, but he had no strength left to do anything more.
        - id: ch01-b157
          speaker: narrator
          text: >-
            While they lay together, a mermaid caught Wendy by the feet and gently began to pull her into the lagoon. Peter felt her slipping away and woke with a start. He dragged her back just in time. Then he had to tell her the truth.
        - id: ch01-b158
          speaker: peter
          text: >-
            We're on the rock, Wendy, but the water is covering it. Soon there won't be any rock left.
          emotion: fearful
        - id: ch01-b159
          speaker: narrator
          text: Wendy still did not understand.
        - id: ch01-b160
          speaker: wendy
          text: Then we have to leave.
        - id: ch01-b161
          speaker: peter
          text: Yes.
          emotion: sad
        - id: ch01-b162
          speaker: wendy
          text: Should we swim or fly, Peter?
        - id: ch01-b163
          speaker: narrator
          text: He had to make her understand.
        - id: ch01-b164
          speaker: peter
          text: Could you swim or fly all the way to the island without me?
        - id: ch01-b165
          speaker: narrator
          text: Wendy admitted that she was too tired. Peter moaned.
        - id: ch01-b166
          speaker: wendy
          text: What's wrong?
        - id: ch01-b167
          speaker: narrator
          text: At once, she was worried about him.
        - id: ch01-b168
          speaker: peter
          text: >-
            I can't help you, Wendy. Hook hurt me. I can't fly, and I can't swim.
          emotion: sad
        - id: ch01-b169
          speaker: wendy
          text: Are we both going to drown?
          emotion: fearful
        - id: ch01-b170
          speaker: peter
          text: Look at the water. It's still rising.
          emotion: fearful
        - id: ch01-b171
          speaker: narrator
          text: >-
            They covered their eyes so they would not have to watch. They thought they would soon be gone. As they sat there, something as light as a kiss brushed Peter and stayed beside him. It seemed to ask, very shyly, if it could help.
        - id: ch01-b172
          speaker: narrator
          text: >-
            It was the tail of the kite Michael had made several days earlier. The kite had torn free from his hand and floated away.
        - id: ch01-b173
          speaker: peter
          text: Michael's kite.
        - id: ch01-b174
          speaker: narrator
          text: >-
            At first, Peter showed no interest. Then he grabbed the tail and pulled the kite toward him.
        - id: ch01-b175
          speaker: peter
          text: It lifted Michael off the ground. Why couldn't it carry you?
        - id: ch01-b176
          speaker: wendy
          text: It could carry both of us!
        - id: ch01-b177
          speaker: peter
          text: No. It can't lift two. Michael and Curly already tried.
        - id: ch01-b178
          speaker: wendy
          text: Then we'll draw lots.
        - id: ch01-b179
          speaker: peter
          text: Not when you're a lady. Never.
        - id: ch01-b180
          speaker: narrator
          text: >-
            He had already tied the kite's tail around her. Wendy clung to him and refused to leave without him.
        - id: ch01-b181
          speaker: peter
          text: Good-bye, Wendy.
        - id: ch01-b182
          speaker: narrator
          text: >-
            Peter pushed her away from the rock. Within minutes, the kite had carried her out of sight. Peter was alone on the lagoon.
        - id: ch01-b183
          speaker: narrator
          text: >-
            The rock was very small now, and soon the water would cover it. Pale beams of light tiptoed over the lagoon. Before long came the most beautiful and sorrowful sound in the world. The mermaids were calling to the moon.
        - id: ch01-b184
          speaker: narrator
          text: >-
            Peter was not like other boys, but at last he was afraid. One tremor passed through him, like a shiver across the sea. The sea would shiver again and again, hundreds of times. Peter shivered only once.
        - id: ch01-b185
          speaker: narrator
          text: >-
            The next moment, he stood straight on the rock. That smile was back on his face, and a drum seemed to beat inside him. It was saying, "To die will be an awfully big adventure."
