audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently playful
        timbre: clear and story-rich
        pace: measured
        pitch: medium
    peter:
      display_name: Peter Pan
      tts:
        delivery: daring, playful, and proudly matter-of-fact
        timbre: bright and boyish
        pace: lively
        pitch: high
    tinker_bell:
      display_name: Tinker Bell
      tts:
        delivery: quick, fiery, and fiercely devoted
        timbre: bright and bell-like
        pace: rapid
        pitch: high
  chapters:
    - id: ch01
      title: The Captives Leave the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The sooner we get through this horror, the better. Curly came out of his tree first and landed in Cecco's arms. Cecco threw him to Smee. Smee threw him to Starkey, Starkey threw him to Bill Jukes, and Bill Jukes threw him to Noodler. From there he fell at the black pirate's feet. The other boys were dragged out the same ruthless way. For a while, several flew through the air at once, passed from hand to hand like bundles of cargo.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Wendy came last, and the pirates treated her differently. Hook lifted his hat with mocking courtesy, offered his arm, and led her to the place where the others were being gagged. He carried it off with such polished manners that she stared at him instead of crying out. After all, she was only a little girl.
        - id: ch01-b03
          speaker: narrator
          text: >-
            We must tell on Wendy here, because that one moment had strange consequences. If she had proudly pulled her hand away, the pirates would have tossed her through the air too. Hook probably would not have stayed while the children were tied. Then he would not have learned Slightly's secret, and he could not have made the wicked attempt on Peter's life that soon followed.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The pirates tied each child with knees drawn up near the ears so no one could fly away. For this work, the black pirate had cut one rope into nine exactly equal lengths. Everything went smoothly until they came to Slightly. He was like one of those maddening packages that uses all the string going around and leaves no loose ends for the knot.
        - id: ch01-b05
          speaker: narrator
          text: >-
            In their fury, the pirates kicked him, though really it was the string they should have kicked. Oddly enough, Hook was the one who ordered them to stop. His lip curled with cruel triumph. His men were sweating. Whenever they squeezed poor Slightly in at one spot, he bulged out somewhere else. Hook's mind had gone beneath the obvious problem to search for its cause. The look on his face said he had found it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Slightly turned white with panic. He knew Hook had uncovered his secret. A boy that round could never fit through a tree narrow enough to stop an average man. Slightly was more miserable than any of the children because now he feared for Peter. He bitterly wished he had acted differently. Whenever he got hot, he drank water madly and had swollen to his present size. Instead of making himself fit the tree, he had secretly whittled the tree wider to fit himself.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Hook guessed enough from all this to know that Peter was finally at his mercy. Not one word escaped him about the dark plan taking shape in the hidden caverns of his mind. He only signaled for the captives to be taken to the ship and for everyone to leave him alone.
        - id: ch01-b08
          speaker: narrator
          text: >-
            But how could the pirates carry them? The children were tied tightly enough to roll downhill like barrels, but most of the route crossed a swamp. Hook solved that problem too. The little house would be their carriage. The children were thrown inside. Four strong pirates lifted the house onto their shoulders, and the rest marched behind, singing their hateful chorus.
        - id: ch01-b09
          speaker: narrator
          text: >-
            I cannot say whether any of the children cried. If they did, the pirate song covered the sound. As the little house vanished into the forest, one brave little stream of smoke rose from its chimney as though it were defying Hook.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Hook saw it, and it harmed Peter. Whatever tiny trace of pity remained in the pirate's furious heart dried up.
    - id: ch02
      title: Hook Goes Below
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Night was falling fast when Hook found himself alone. First he crept to Slightly's tree and made certain the opening was wide enough for him. Then he stood brooding for a long time. He had set his unlucky hat on the grass, letting any gentle breeze cool his hair. His thoughts were dark, though his blue eyes looked soft as periwinkles.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He listened hard for a sound from the world below. Nothing moved there or above ground. There was no hint of life anywhere. The home under the trees seemed as empty as every other abandoned place. Was Peter asleep? Or was he waiting at the bottom of Slightly's tree with a dagger ready?
        - id: ch02-b03
          speaker: narrator
          text: >-
            Hook could learn the answer only by going down. He let his cloak slide quietly to the ground. He bit his lips until blood stood on them, then stepped into the tree. Hook was a brave man, but he had to pause and wipe his brow. Sweat ran from it like wax from a candle. At last he silently lowered himself into the unknown.
        - id: ch02-b04
          speaker: narrator
          text: >-
            No one attacked him. At the bottom of the shaft, he stopped again and tried to catch the breath that had nearly left him. His eyes slowly adjusted to the dim room. Objects began to appear, but his hungry gaze settled on only one. There was the great bed he had hunted so long to find, and Peter lay fast asleep upon it.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Peter knew nothing of the tragedy above. After the children left, he had played cheerfully on his pipes for a while, probably trying to prove that he did not care. Then he decided he would refuse his medicine to upset Wendy. He lay on top of the bedcovers to vex her even more. She always tucked everyone in, because the night might turn cold.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Peter almost cried. Then he imagined how annoyed Wendy would be if he laughed instead. So he gave one proud laugh and fell asleep right in the middle of it.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Peter did not dream often, but when he did, his dreams hurt more than other boys' dreams. He could remain trapped in them for hours, crying pitifully. I think they were about the riddle of who he was. At those times Wendy would lift him from bed, hold him on her lap, and soothe him in her own loving ways. Once he grew calmer, she put him back before he fully woke, so he would never know she had treated him like a little child.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Tonight he slept without a dream. One arm hung over the bed, one knee bent upward, and the unfinished laugh stayed on his open mouth, showing his small pearly teeth.
    - id: ch03
      title: Five Drops in the Cup
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            That was how Hook found his enemy, completely defenseless. He stood at the foot of the tree and watched Peter across the room. Did compassion touch his gloomy heart? Hook was not entirely evil. He loved flowers, or so I have heard. He loved sweet music too and played the harpsichord rather well. The peaceful sight before him moved him deeply. His better nature might have made him climb away, except for one thing.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Peter looked unbearably cocky even in his sleep. That open mouth, the dangling arm, the raised knee. Together they seemed to turn cockiness into a living thing, and Hook could not stand the sight. His heart went hard. If his rage had shattered him into a hundred pieces, every piece would have sprung at the sleeping boy.
        - id: ch03-b03
          speaker: narrator
          text: >-
            A single lamp cast a weak glow on the bed while Hook remained in darkness. At his first quiet step, he found Slightly's door blocking him. It did not cover the whole opening, so Hook had been able to peer over it, but the latch was too low for him to reach. In a fury, he shook the door and hurled himself against it. As Peter's sleeping pose seemed to grow more irritating by the second, Hook wondered if his enemy would escape him after all.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Then the angry red in Hook's eye caught something on a ledge within easy reach. It was Peter's medicine. He understood at once what he was looking at, and he knew the sleeping boy was in his power.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Hook always carried a dreadful drug in case he was captured alive. He had made it himself from every deadly poison that ever came into his possession. He boiled them together into a yellow liquid unknown to science, perhaps the most powerful poison in the world.
        - id: ch03-b06
          speaker: narrator
          text: >-
            He put five drops into Peter's cup. His hand trembled with triumph, not shame. While he poured, he kept his eyes off the sleeper, but only because he did not want to spill. Then he gave Peter one long, gloating look and struggled back up the tree.
        - id: ch03-b07
          speaker: narrator
          text: >-
            When Hook came out, he looked like the spirit of evil rising from its hole. He tilted his hat at its boldest angle and wrapped himself in his cloak. Holding one end before him as if to hide from the night, though he was its blackest part, he muttered strangely and slipped away among the trees.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Peter kept sleeping. The lamp flickered out, leaving the underground home in darkness, but still he slept. It must have been at least ten o'clock by the crocodile when he suddenly sat upright. He did not know what had woken him. Then he heard it, a soft, careful tap on the door of his tree.
    - id: ch04
      title: Tinker Bell Brings the News
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The tapping was gentle and cautious, but in that deep silence it sounded dangerous. Peter reached for his dagger and closed his hand around it.
        - id: ch04-b02
          speaker: peter
          text: >-
            Who's there?
        - id: ch04-b03
          speaker: narrator
          text: >-
            No one answered for a long while. Then the knock came again.
        - id: ch04-b04
          speaker: peter
          text: >-
            Who are you?
        - id: ch04-b05
          speaker: narrator
          text: >-
            Again there was no answer. Peter felt a thrill, and he loved a thrill. Two strides took him to the door. His tree door, unlike Slightly's, covered the opening completely. Peter could not see the visitor, and the visitor could not see him.
        - id: ch04-b06
          speaker: peter
          text: >-
            I'm not opening this door till you say something!
        - id: ch04-b07
          speaker: narrator
          text: >-
            At last the visitor answered in a lovely voice that rang like a bell.
        - id: ch04-b08
          speaker: tinker_bell
          text: >-
            Peter, let me come in.
        - id: ch04-b09
          speaker: narrator
          text: >-
            It was Tinker Bell. Peter quickly pulled back the bar. She darted inside, flushed with excitement and spattered with mud.
        - id: ch04-b10
          speaker: peter
          text: >-
            What happened?
        - id: ch04-b11
          speaker: tinker_bell
          text: >-
            You'd never guess! I'll give you three tries.
        - id: ch04-b12
          speaker: peter
          text: >-
            Just tell me!
        - id: ch04-b13
          speaker: narrator
          text: >-
            Tink poured out the whole story in one ungrammatical sentence, long as the ribbons a magician pulls from his mouth. Wendy and the boys had been captured and taken to the pirate ship.
        - id: ch04-b14
          speaker: narrator
          text: >-
            Peter's heart bounced up and down as he listened. Wendy was tied up on that ship, Wendy, who always needed everything done properly.
        - id: ch04-b15
          speaker: peter
          text: >-
            I'm going to save her!
        - id: ch04-b16
          speaker: narrator
          text: >-
            He sprang toward his weapons. As he moved, he thought of one thing he could do to make Wendy happy. He could take his medicine. His hand closed around the deadly cup.
        - id: ch04-b17
          speaker: tinker_bell
          text: >-
            No!
          emotion: fearful
        - id: ch04-b18
          speaker: narrator
          text: >-
            Tinker Bell had heard Hook muttering about what he had done as he hurried through the forest.
        - id: ch04-b19
          speaker: peter
          text: >-
            Why shouldn't I?
        - id: ch04-b20
          speaker: tinker_bell
          text: >-
            There's poison in it.
        - id: ch04-b21
          speaker: peter
          text: >-
            Poison? Who put poison in my medicine?
        - id: ch04-b22
          speaker: tinker_bell
          text: >-
            Hook did.
        - id: ch04-b23
          speaker: peter
          text: >-
            That's ridiculous. How could Hook ever get down here?
        - id: ch04-b24
          speaker: narrator
          text: >-
            Tink could not explain. She did not know Slightly's dark secret either. Still, Hook's own words had left no doubt. The medicine was poisoned.
        - id: ch04-b25
          speaker: peter
          text: >-
            Anyway, I never went to sleep.
        - id: ch04-b26
          speaker: narrator
          text: >-
            Peter believed that completely and lifted the cup. There was no time left to argue. Tink moved like lightning, slipped between his mouth and the medicine, and drank every drop herself.
    - id: ch05
      title: Do You Believe in Fairies?
      blocks:
        - id: ch05-b01
          speaker: peter
          text: >-
            Tink! How dare you drink my medicine?
        - id: ch05-b02
          speaker: narrator
          text: >-
            She did not answer. She was already swaying in the air.
        - id: ch05-b03
          speaker: peter
          text: >-
            Tink, what's wrong with you?
          emotion: fearful
        - id: ch05-b04
          speaker: narrator
          text: >-
            For the first time, Peter was suddenly afraid.
        - id: ch05-b05
          speaker: tinker_bell
          text: >-
            It really was poisoned, Peter. Now I'm going to die.
          emotion: sad
        - id: ch05-b06
          speaker: peter
          text: >-
            Oh, Tink, you drank it to save me?
          emotion: sad
        - id: ch05-b07
          speaker: tinker_bell
          text: >-
            Yes.
        - id: ch05-b08
          speaker: peter
          text: >-
            But why would you do that, Tink?
        - id: ch05-b09
          speaker: narrator
          text: >-
            Her wings could barely hold her up. She landed on Peter's shoulder, gave his nose one loving bite, and whispered in his ear.
        - id: ch05-b10
          speaker: tinker_bell
          text: >-
            You silly ass.
        - id: ch05-b11
          speaker: narrator
          text: >-
            Then she staggered into her little room and lay on the bed. Peter knelt beside her in such distress that his head nearly filled the room's fourth wall. Her light faded more every moment. He knew that if it went out, Tinker Bell would be gone. She liked his tears so much that she reached out one beautiful finger and let them run over it.
        - id: ch05-b12
          speaker: narrator
          text: >-
            Her voice was so faint that Peter could not understand her at first. Then he heard it. Tink thought she might get well if children believed in fairies.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Peter threw out his arms. No children stood in the dark room, but he called to every child who might be dreaming of the Neverland. They were closer than you might suppose, boys and girls in their nightclothes, and little papooses sleeping in baskets hung from trees.
        - id: ch05-b14
          speaker: peter
          text: >-
            Do you believe in fairies?
        - id: ch05-b15
          speaker: narrator
          text: >-
            Tink sat up almost eagerly to hear what her fate would be. She thought she heard children saying yes, but then she could not be certain.
        - id: ch05-b16
          speaker: tinker_bell
          text: >-
            What do you think they're saying, Peter?
        - id: ch05-b17
          speaker: peter
          text: >-
            If you believe, clap your hands! Don't let Tink die!
        - id: ch05-b18
          speaker: narrator
          text: >-
            Many children clapped. Some did not. A few animals hissed. Then all the clapping stopped at once, as though countless mothers had rushed into nurseries to find out what on earth was going on. But Tink was already saved.
        - id: ch05-b19
          speaker: narrator
          text: >-
            First her voice became strong. Then she jumped out of bed. A moment later she was flashing around the room, merrier and more impudent than ever. She never thought to thank the children who believed, though she would have liked to catch the ones who hissed.
        - id: ch05-b20
          speaker: peter
          text: >-
            Now let's go save Wendy!
    - id: ch06
      title: Peter Sets Out
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The moon rode through a cloudy sky when Peter climbed out of his tree. He carried his weapons and wore little else as he began his dangerous search. It was not the kind of night he would have chosen.
        - id: ch06-b02
          speaker: narrator
          text: >-
            He had hoped to fly close to the ground so he would notice anything unusual. But the moonlight kept coming and going. If he flew low, his shadow would trail through the trees, startling birds and warning any watchful enemy that he was moving. Peter now regretted giving the island birds such strange names. It had made them wild and hard to approach.
        - id: ch06-b03
          speaker: narrator
          text: >-
            His only choice was to move through the forest in the island warriors' fashion, something he did very well. But which way should he go? He could not be sure the children had been taken to the ship. A light snow had covered every footprint. The whole island lay in a deathly hush, as though nature itself had stopped in horror at the recent killing.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Peter had taught the children some of the forest knowledge he had learned from Tiger Lily and Tinker Bell. He trusted them to remember it in danger. Slightly might cut marks in the trees if he got a chance. Curly might scatter seeds. Wendy might leave her handkerchief at an important turn. He needed daylight to find clues like those, and he could not wait. The world above ground had called him out, but it offered no help.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The crocodile passed him. Nothing else alive appeared. There was not one sound or movement. Even so, Peter knew death might be waiting at the next tree or following close behind him.
        - id: ch06-b06
          speaker: peter
          text: >-
            This time, it's Hook or me.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Peter crept forward like a snake. Then he rose and dashed across a patch of moonlight with one finger to his lips and his dagger ready. He was frightfully happy.
