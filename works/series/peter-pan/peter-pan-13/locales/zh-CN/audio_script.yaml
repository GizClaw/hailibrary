audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tinker_bell:
      display_name: 小叮当
      tts:
        delivery: 骄傲急切，情绪来得快而真，声音像小银铃
        timbre: 轻盈清亮
        pace: 轻快灵敏
        pitch: 高音
  chapters:
    - id: ch01
      title: 落入海盗手中
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这场可怕的事，越快讲完越好。卷毛第一个钻出树洞，立刻掉进切科怀里。切科把他抛给斯密，斯密又扔给斯塔基。接着是比尔·朱克斯，再接着是努德勒。卷毛就这样一路从人手里飞过去，最后摔在那个黑皮肤海盗脚下。
        - id: ch01-b02
          speaker: narrator
          text: 其他男孩也一个个被拔出树洞。空中常常同时飞着好几个孩子，像一包包货物，在海盗手里传来传去。温迪最后才出来，受到的待遇却不一样。
        - id: ch01-b03
          speaker: narrator
          text: 胡克带着嘲弄的礼貌摘下帽子，又伸出胳膊让她挽着，把她一路送到其他孩子被堵嘴的地方。他的派头那么足，举止又优雅得可怕，温迪竟看呆了，连喊都忘了喊。她到底还只是个小姑娘。
        - id: ch01-b04
          speaker: narrator
          text: 我们说出她这个秘密，似乎是在告密。可她一时受胡克迷惑，后来竟带来了意想不到的后果。假如温迪当场傲慢地甩开他，我们真希望能这样讲，她也会像男孩们一样被抛过去。那样，胡克也许不会留下来，亲眼看着海盗捆孩子。要是没有留在这里，他就不会发现斯莱特利的秘密。没有那个秘密，他很快便没法卑鄙地谋害彼得。
        - id: ch01-b05
          speaker: narrator
          text: 海盗怕孩子飞走，把他们折得膝盖贴住耳朵，再拿九段一样长的绳子捆紧。轮到斯莱特利，绳子怎么也不够。他像一个讨厌的包裹，绳子绕来绕去全用完了，却连打结的那一小截也没剩下。
        - id: ch01-b06
          speaker: narrator
          text: 海盗气得踢他，就像你会踢那只包裹。其实真要讲理，该踢的是绳子才对。奇怪的是，叫他们停手的反倒是胡克。他恶毒地翘起嘴角，显得十分得意。海盗们满头大汗，刚把斯莱特利这一边勒紧，另一边又鼓了出来。胡克那高明的头脑却早已钻到表面以下。他不只看眼前的麻烦，还顺着结果追查原因。如今，他显然已经找到了。
        - id: ch01-b07
          speaker: narrator
          text: 斯莱特利吓白了脸。像他这么胖的孩子，绝钻不过一棵能把普通成年人卡住的树，这正是他藏着的秘密。他一热就会忍不住拼命喝水，身体才胀成如今这样。可他没有让自己瘦下来，去迁就原来的树洞，反而瞒着大家，一刀一刀削大了那棵树，让树洞来迁就自己。如今胡克看穿一切。所有孩子当中，斯莱特利最可怜。他只怕彼得会因此遭殃，悔得痛苦极了。
        - id: ch01-b08
          speaker: narrator
          text: 胡克猜到这里，已经相信彼得终于落在自己手里。阴险的计谋在他心底慢慢成形，他嘴上却一个字也没说，只打手势叫手下把俘虏押回船上，再命令他们留下自己。
        - id: ch01-b09
          speaker: narrator
          text: 孩子们捆得像一只只圆桶，虽能滚下山，却滚不过占了大半路程的沼泽。这个难题也没能拦住胡克。他马上想到办法，叫海盗把小屋当成运人的轿子。孩子们全被扔进屋里，四个壮汉把整座小屋扛到肩上，其余人排在后面。他们一路唱着可恨的海盗歌，这支古怪的队伍就这样穿进了树林。
        - id: ch01-b10
          speaker: narrator
          text: 我不知道孩子们哭了没有。就算哭了，歌声也把哭声盖住了。小屋快要消失时，烟囱里冒出一缕细细的烟，勇敢地向胡克挑战。胡克看见了。那缕烟把他心中残存的一点怜悯也烘干了。
    - id: ch02
      title: 黑暗中的毒计
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 暮色飞快降临。胡克独自踮脚走到斯莱特利的树前，先确认树洞真能让自己通过。他把凶兆般的帽子放在草地上，站在那里想了很久，让偶尔吹来的风穿过头发。他心思阴沉，蓝眼睛却柔和得像长春花。
        - id: ch02-b02
          speaker: narrator
          text: 胡克仔细听着地下的动静。上面下面都没有一点声音，仿佛树下的家只是一座空屋。彼得究竟睡着了，还是正握着匕首守在洞底？除非亲自下去，谁也不会知道。
        - id: ch02-b03
          speaker: narrator
          text: 胡克让斗篷悄悄滑到地上，又把嘴唇咬出污血，才走进树洞。他虽然勇敢，还是停了一会儿，擦掉额头上蜡油般淌下的汗。随后，他一声不响地沉入未知的黑暗。
        - id: ch02-b04
          speaker: narrator
          text: 他平安到了洞底，屏住几乎消失的呼吸。眼睛渐渐习惯昏暗，屋里的东西一件件显出形状。可胡克贪婪的目光只盯住了寻找已久的大床。彼得就在床上熟睡。
        - id: ch02-b05
          speaker: narrator
          text: 彼得根本不知道头顶发生过什么。孩子们离开后，他还快乐地吹了一阵牧笛，仿佛想证明自己一点也不在乎。然后，他决定不喝药，让温迪难过。他又故意躺在床罩外，因为温迪总把大家塞进被窝，怕他们半夜受凉。他想用这件事再气她一次。
        - id: ch02-b06
          speaker: narrator
          text: 彼得差点哭出来，却忽然想到，要是自己笑，温迪准会更生气。于是他傲慢地一笑，笑到一半便睡着了。
        - id: ch02-b07
          speaker: narrator
          text: 他很少做梦，可他的梦比别的男孩更痛苦。有时梦会缠住他好几个钟头，叫他在里面凄惨地哭。那些梦，我想，同他为什么存在这个谜有关。温迪总会把他抱到膝头，用自己想出的温柔办法安慰他。等彼得平静下来，她又在他完全醒来之前送他回床，免得他知道自己受过这般有失尊严的照顾。
        - id: ch02-b08
          speaker: narrator
          text: 这一回，彼得睡得没有梦。一条手臂垂在床边，一条腿弯弯地拱着，没笑完的笑还留在张开的嘴上，露出珍珠一样的小牙。他一点防备也没有。
        - id: ch02-b09
          speaker: narrator
          text: 胡克站在树洞底端，隔着屋子静静望着仇敌。难道他心里一点怜悯也没有吗？胡克并不是从里到外全都邪恶。据说他喜欢鲜花，也爱美妙的音乐，自己弹起羽管键琴还颇有本事。眼前的景象宁静得像一幅画，深深打动了他。只差一点，他心中较好的一面就会赢过恶念，让他不舍地爬回树洞去。
        - id: ch02-b10
          speaker: narrator
          text: 可彼得睡着时还是那么神气。张着嘴，垂着手，弓着膝盖，这三样凑在一起，仿佛把神气活现变成了一个活人。但愿这样的模样再也别出现在对它如此敏感的眼睛前。胡克的心立刻又硬了。即使怒火把他炸成一百片，每一片也会忘掉刚才的感动，扑向床上的孩子。
        - id: ch02-b11
          speaker: narrator
          text: 灯光微弱地照着床，胡克藏在黑暗里。他刚往前走，就被斯莱特利树洞的门挡住了。门没有封死洞口，所以他能从上面看见彼得，可门闩太低，他的手够不到。他发疯似的摇门、撞门。难道仇敌又要逃掉吗？
        - id: ch02-b12
          speaker: narrator
          text: 就在这时，胡克发红的眼睛看见了彼得的药杯。杯子放在架板上，伸手就能够到。他马上猜出那是什么，也立刻明白，熟睡的男孩已经任他摆布。胡克怕自己活着被捕，身上总带着亲手调成的毒药。凡是落进他手里的致命毒物，都被他混在一起，熬成一种黄色液体。科学从不知道世上还有这样的东西。这大概是世间最猛烈的毒药。
        - id: ch02-b13
          speaker: narrator
          text: 胡克往杯里滴了整整五滴。手虽然发抖，却是因为得意，不是羞愧。下毒时，他故意不去看熟睡的彼得。那也不是怕怜悯会叫他心软，他只担心自己一分神，就会把毒药洒掉。做完以后，他才用贪婪又得意的目光，把牺牲品看了很久。然后他转过身，费力地沿着树洞往上蠕动。
        - id: ch02-b14
          speaker: narrator
          text: 他钻出来时，活像邪恶的精魂破穴而出。胡克把帽子戴得又歪又轻佻，再用斗篷裹住全身，一手捏着前襟，似乎想把自己藏起来，躲开黑夜的眼睛。可他自己正是黑夜里最黑的部分。他一路古怪地喃喃自语，悄悄穿过树林离开了。
    - id: ch03
      title: 深夜的敲门声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得一直睡着，半点也没有察觉。灯火摇了几下，熄灭了，屋里陷入黑暗。按鳄鱼报出的时辰，那时至少已经十点。彼得忽然坐起来，却不知道什么惊醒了他。有人正轻轻地、小心地敲着树门。
        - id: ch03-b02
          speaker: narrator
          text: 敲门声虽轻，在寂静中却很凶险。彼得摸到匕首，紧紧握住。
        - id: ch03-b03
          speaker: peter
          text: 外面是谁？
        - id: ch03-b04
          speaker: narrator
          text: 等了很久，没有回答。敲门声再次响起。
        - id: ch03-b05
          speaker: peter
          text: 你到底是谁？
        - id: ch03-b06
          speaker: narrator
          text: 依然没人回答。彼得兴奋起来，他最爱这种紧张的滋味。两步冲到门边。他的门把洞口堵得严实，和斯莱特利那扇不同。里面的人看不见外面，外面的人也看不见他。
        - id: ch03-b07
          speaker: peter
          text: 你再不说话，我可不开门！
        - id: ch03-b08
          speaker: narrator
          text: 访客终于用银铃般悦耳的声音开口。
        - id: ch03-b09
          speaker: tinker_bell
          text: 让我进去，彼得。
        - id: ch03-b10
          speaker: narrator
          text: 原来是小叮当。彼得赶紧开门。她激动地飞进屋，脸颊通红，裙子沾满了泥。
        - id: ch03-b11
          speaker: peter
          text: 出什么事了？
        - id: ch03-b12
          speaker: tinker_bell
          text: 你绝对猜不到！给你三次机会，猜猜看！
        - id: ch03-b13
          speaker: peter
          text: 别让我猜了，快告诉我！
        - id: ch03-b14
          speaker: narrator
          text: 小叮当一口气说出一个不合语法的长句。那句话长得不得了，就像魔术师从嘴里不断扯出的长彩带。温迪怎么遭了殃，男孩们又怎样被海盗捉走，她全都急急忙忙塞进了这一句话。
        - id: ch03-b15
          speaker: narrator
          text: 彼得一边听，心一边上上下下地猛跳。温迪给绑住了，还被带上了海盗船。偏偏是那个爱把每一件事都收拾得妥妥当当的温迪！
        - id: ch03-b16
          speaker: peter
          text: 我现在就去救她！
        - id: ch03-b17
          speaker: narrator
          text: 彼得扑向自己的武器，又想到一件能让温迪高兴的事。他可以先把药喝掉。于是，他的手伸向了那杯致命的药水。
    - id: ch04
      title: 小叮当的牺牲
      blocks:
        - id: ch04-b01
          speaker: tinker_bell
          text: 不许喝！
          emotion: fearful
        - id: ch04-b02
          speaker: narrator
          text: 小叮当穿过森林时，听见胡克念叨过自己干的坏事。
        - id: ch04-b03
          speaker: peter
          text: 为什么不能喝？
        - id: ch04-b04
          speaker: tinker_bell
          text: 那杯药已经有毒了。
        - id: ch04-b05
          speaker: peter
          text: 有毒？是谁下的毒？
        - id: ch04-b06
          speaker: tinker_bell
          text: 是胡克。
        - id: ch04-b07
          speaker: peter
          text: 别说傻话。胡克怎么下得来？
        - id: ch04-b08
          speaker: narrator
          text: 唉，小叮当也不知道斯莱特利树洞的秘密，自然没法解释胡克怎样进来。可是她亲耳听见了胡克的话，那些话没有留下半点怀疑的余地。杯子里的的确确有毒。
        - id: ch04-b09
          speaker: peter
          text: 而且，我根本就没睡着。
        - id: ch04-b10
          speaker: narrator
          text: 彼得真心相信这句话，举起了杯子。现在来不及再说，小叮当只能行动。她快得像闪电，一下冲到杯子和他的嘴唇之间，把药水喝得干干净净。
        - id: ch04-b11
          speaker: peter
          text: 小叮当，你竟敢把我的药喝掉！
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: 小叮当没有回答，已经在空中摇晃起来。彼得突然害怕了。
        - id: ch04-b13
          speaker: peter
          text: 你这是怎么了？
          emotion: fearful
        - id: ch04-b14
          speaker: tinker_bell
          text: 药里真的有毒，彼得。现在，我快要死了。
          emotion: sad
        - id: ch04-b15
          speaker: peter
          text: 小叮当，你把毒药喝了，是为了救我吗？
          emotion: fearful
        - id: ch04-b16
          speaker: tinker_bell
          text: 是的。
        - id: ch04-b17
          speaker: peter
          text: 可你为什么要这样，小叮当？
        - id: ch04-b18
          speaker: narrator
          text: 她的翅膀几乎托不住自己了。小叮当没有直接回答，只落在彼得肩上，亲昵地咬了咬他的鼻子，又贴到他耳边。
        - id: ch04-b19
          speaker: tinker_bell
          text: 你这个小傻瓜。
        - id: ch04-b20
          speaker: narrator
          text: 她摇摇晃晃地回到自己的小房间，躺上了床。彼得忧心如焚，跪在她身旁。他的脑袋太大，几乎把这间小屋的第四面墙全堵住了。小叮当身上的光每过一刻都更微弱。彼得知道，只要那点光彻底熄灭，她便再也不存在了。
        - id: ch04-b21
          speaker: narrator
          text: 小叮当非常喜欢彼得为她流下的眼泪。她伸出漂亮的手指，让泪珠一颗颗从指上流过去。她的声音低得几乎听不见，彼得起初怎么也听不清，只能凑得更近些，后来终于听懂了。她正在说，自己觉得还有一个办法。如果孩子们相信世上真有仙子，她也许能够重新好起来。
    - id: ch05
      title: 你相信有仙子吗
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 彼得张开双臂。屋里没有孩子，外面又是夜晚。可他在呼唤所有可能正梦见梦幻岛的人。他们离他比你想的更近。有穿睡衣的男孩和女孩，也有光着身子、睡在树上吊篮里的印第安小娃娃。
        - id: ch05-b02
          speaker: peter
          text: 你们相信世上有仙子吗？
        - id: ch05-b03
          speaker: narrator
          text: 小叮当几乎立刻坐起身，等着听自己的命运。她仿佛听见有人说相信，可又拿不准。
        - id: ch05-b04
          speaker: tinker_bell
          text: 彼得，你觉得他们相信吗？
        - id: ch05-b05
          speaker: peter
          text: 要是相信，就请拍拍手！别让小叮当死掉！
        - id: ch05-b06
          speaker: narrator
          text: 许多人真的拍了手。也有一些人没有拍，还有几只野兽不但不肯帮忙，反而发出了嘘声。掌声忽然停住，仿佛数不清的母亲同时冲进育儿室，急着看看孩子那里究竟出了什么事。
        - id: ch05-b07
          speaker: narrator
          text: 可小叮当已经得救了。她先恢复了响亮的声音，接着跳下床，在屋里飞来飞去，比从前更快活，也更淘气。她没想过谢谢那些相信她的人，倒很想找出发嘘声的家伙，好好收拾他们。
        - id: ch05-b08
          speaker: peter
          text: 好了，现在去救温迪！
          emotion: happy
    - id: ch06
      title: 月光下的追踪
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 月亮正在云层里穿行。彼得从树洞升到地面，浑身带着武器，除此以外几乎什么也没穿。他就这样踏上了危险的营救之路。这个夜晚并不合他的心意。
        - id: ch06-b02
          speaker: narrator
          text: 彼得原想贴近地面飞，不离地面太远，好让任何不寻常的动静都逃不过自己的眼睛。可月光忽明忽暗，在这样的光线里低飞，他的影子就会长长地拖过树林。鸟儿会被影子惊动，警觉的敌人也会立刻知道他已经出发。彼得现在真后悔，自己从前给岛上的鸟取了那么多古怪名字，害得它们性子很野，谁也很难靠近。
        - id: ch06-b03
          speaker: narrator
          text: 彼得只好学红种人的办法在地上赶路，幸好他很擅长这一套。可是该走哪边？他不能肯定孩子们已经被带去了海盗船。一层刚落下的薄雪盖住了所有脚印，岛上到处是死一般的安静。仿佛大自然看见不久前那场杀戮，也惊骇得停住了脚步。
        - id: ch06-b04
          speaker: narrator
          text: 他曾把从虎莲和小叮当那里学来的森林本领教给孩子们。到了这样性命攸关的时候，他们不会忘记。只要有机会，斯莱特利会在沿途的树上削出记号，卷毛会一路撒下种子，温迪也会把自己的手帕留在某个重要地点。可要找到这些指引，非等天亮不可，彼得偏偏一刻也不能等。地上的世界把他召唤出来，却不肯给他一点帮助。
        - id: ch06-b05
          speaker: narrator
          text: 鳄鱼从彼得身边经过，除此以外，再没有一个活物。四周没有一点声音，也看不见一丝动静。可越是寂静，彼得越清楚危险没有消失。突然降临的死亡也许就在下一棵树旁等他，也许正从背后一步一步追来。
        - id: ch06-b06
          speaker: peter
          text: 这一次，不是胡克死，就是我死。
        - id: ch06-b07
          speaker: narrator
          text: 彼得继续向前。他一会儿像蛇一样贴地爬行，一会儿又猛然直起身，飞快冲过洒着月光的空地。他始终把一根手指按在唇上，另一只手握好匕首，随时准备出手。死亡也许就在附近，可这样的危险正合他的心意。他快活得可怕。
