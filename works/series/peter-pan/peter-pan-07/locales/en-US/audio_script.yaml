  chapters:
    - id: ch01
      title: The Home Under the Ground
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The next day, one of Peter's first jobs was measuring Wendy, John, and Michael for hollow trees. Hook had laughed at the boys for thinking each of them needed his own tree. But Hook simply didn't understand. A tree had to fit its boy exactly, because no two boys were quite the same size. At the top, you pulled in your breath and dropped down at just the right speed. To climb back up, you breathed in and out by turns and wriggled your way upward. Once you knew how, you did it without thinking, and nothing looked more graceful.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Still, you had to fit. Peter measured you as carefully as a tailor measuring for clothes. There was one difference. Clothes were made to fit you, but here, you were made to fit the tree. Usually, putting on or taking off a few garments did the trick. If you had bumps in the wrong places, or the only tree was an odd shape, Peter did certain things to you. After that, you fit. Then great care was needed to make sure you went on fitting. As Wendy happily discovered, that kept the whole family in perfect condition.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Wendy and Michael fit their trees on the first try. John needed a small adjustment before his tree fit properly. After a few days of practice, all three went cheerfully up and down like buckets in a well.
        - id: ch01-b04
          speaker: narrator
          text: >-
            How they came to love their home under the ground, especially Wendy. It had one large room, which is all any house should need. You could dig through the floor whenever you wanted to go fishing. Thick, brightly colored mushrooms grew there and served as stools. In the middle, a Never tree kept trying to grow. Each morning they sawed its trunk even with the floor. By tea-time it stood about two feet high, so they laid a door across it and made a table. After tea, they cut it down again to leave more room for play.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The enormous fireplace could be almost anywhere they chose to light it. Wendy stretched fiber lines across it and hung up her washing. During the day, the bed leaned against the wall. At six-thirty they lowered it, and it filled nearly half the room. All the boys but Michael slept packed inside like sardines in a tin. No one could turn over until somebody gave the signal. Then everyone turned at once. Michael should have slept there too, but Wendy insisted on having a baby. Since he was the smallest, she hung him in a basket.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The place was rough and simple, rather like an underground house built by baby bears. Yet one little hollow in the wall belonged entirely to Tinker Bell. It was no bigger than a birdcage, and a tiny curtain closed it off. Tink was very particular and always drew the curtain while dressing or undressing.
        - id: ch01-b07
          speaker: narrator
          text: >-
            No lady, however grand, could have owned a finer bedroom and sitting room together. Tink called her couch a genuine Queen Mab, with club-shaped legs, and changed its covers whenever a new fruit blossom came into season. Her mirror was an unchipped Puss-in-Boots. Fairy dealers knew of only three like it. The washstand was reversible Pie-crust, the chest of drawers a true Charming the Sixth, and the rugs and carpet were the finest early Margery and Robin. A Tiddlywinks chandelier hung there just for show, since Tink lit the room herself. She looked down on the rest of the house, which was perhaps only natural. Her lovely chamber seemed to look down on it too. It had the look of a nose that was always turned up.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The whole place delighted Wendy, perhaps because her wild boys kept her so busy. Some weeks she hardly went above ground at all, except maybe to take a stocking outside in the evening. There was always work waiting for her. Cooking kept her bent over the pot. Even when the pot was empty, or there was no pot at all, she still had to keep watch and make sure it came to a boil just the same.
        - id: ch01-b09
          speaker: narrator
          text: >-
            No one knew whether dinner would be real or make-believe. That depended on Peter. If eating was part of a game, he could truly eat. But he would never stuff himself just for the pleasant feeling of being full, though most children love that best, with talking about food close behind. Make-believe was so real to Peter that he seemed to grow rounder while eating an imaginary meal. This could be difficult for everyone else, but they had to follow his lead. If they could prove they were getting too loose for their trees, he allowed them to fill themselves up.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Wendy liked to sew and darn after everyone was in bed. That was what she called her time to breathe. She made them new things and patched the knees twice over, because those boys were terribly hard on their knees.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Sometimes she sat before a basket heaped with their stockings, every heel worn through. She would throw up her arms.
        - id: ch01-b12
          speaker: wendy
          text: "Oh, dear! Sometimes I truly think old maids have the better life!"
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: Her face shone as she said it.
        - id: ch01-b14
          speaker: narrator
          text: >-
            And remember Wendy's pet wolf? It soon learned that she had reached the island and tracked her down. They rushed straight into each other's arms. From then on, the wolf followed her everywhere.
        - id: ch01-b15
          speaker: narrator
          text: >-
            As time passed, did Wendy think often of the dear parents she had left behind? That is hard to answer. In the Neverland, no one can say exactly how time passes. They count it by moons and suns, and there are far more of those than on the mainland. Still, Wendy did not truly worry about her father and mother. She was certain they would always leave the window open so she could fly home, and that certainty put her mind at ease.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Something else did trouble her. John remembered his parents only dimly, like people he had known long ago. Michael was quite ready to believe that Wendy herself was his mother. This frightened her a little. She wanted to do her duty, so she tried to fasten their old life in their memories by giving them examinations like the ones she had taken at school.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The lost boys found this wonderfully interesting and demanded to join in. They made their own slates and gathered around the table. Then they wrote and thought as hard as they could over the questions Wendy had put on another slate and passed around. She tried to make the papers as much like her old school examinations as possible.
        - id: ch01-b18
          speaker: wendy
          text: >-
            What color were Mother's eyes? Which parent was taller? Was Mother blond or brunette? Answer all three if you can.
        - id: ch01-b19
          speaker: wendy
          text: >-
            Now write at least forty words about how you spent your last vacation, or compare the characters of Father and Mother. Choose only one.
        - id: ch01-b20
          speaker: wendy
          text: >-
            And finally, describe Mother's laugh, Father's laugh, Mother's party dress, and the kennel with its inhabitant.
        - id: ch01-b21
          speaker: narrator
          text: >-
            They were ordinary questions of that kind. Whenever a boy could not answer, he had to mark a cross. It was dreadful how many crosses even John made. Slightly alone answered every question and felt certain he would come first. No one could have felt more hopeful. But every answer was perfectly ridiculous, so he came last. It was a sad result.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Peter did not take the examination. He looked down on every mother but Wendy. Besides, he was the only boy on the island who could neither write nor spell even the tiniest word. He considered himself above such things.
        - id: ch01-b23
          speaker: narrator
          text: >-
            There was one more thing. Wendy had written every question in the past tense. What color were Mother's eyes? Which parent was taller? You see, Wendy had been forgetting too.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Adventures happened every day, as you will see. Around this time, though, Peter invented a new game with Wendy's help. It thrilled him until the moment he suddenly lost all interest, as he always did with his games. In this one, they pretended not to have adventures. They did the ordinary things John and Michael had always done. They sat on stools tossing balls into the air, shoved one another, and went for walks without killing so much as a grizzly bear.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Peter doing nothing on a stool was a sight worth seeing. Sitting still struck him as so funny that he could not help looking solemn. He bragged that he had taken a walk for his health. For several suns, these ordinary acts were the newest adventures of all. John and Michael had to pretend they loved them too, or Peter would punish them severely.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Peter often went out alone. When he returned, no one could be sure whether an adventure had happened. He might forget one completely and never mention it, only for the others to go outside and find the body. Or he might tell a great deal about an adventure, though no one could find a body at all. Sometimes he came home with a bandage around his head. Wendy would fuss over him and bathe the wound with lukewarm water while he told a dazzling tale. Even then, she was never quite certain.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Still, Wendy knew many adventures were true because she had shared them. Many more were partly true, since the other boys had been there and swore every bit was true. Telling all of them would take a book as large as an English-to-Latin and Latin-to-English dictionary. The most we can do is choose one adventure as an example of an ordinary hour on the island. The trouble is deciding which one.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Perhaps the fight with the redskins at Slightly Gulch? It was bloody, and it showed one of Peter's strangest habits. Right in the middle of a battle, he might suddenly change sides. At the Gulch, the victory kept tipping one way and then the other. Suddenly Peter called out.
        - id: ch01-b29
          speaker: peter
          text: "Today I'm a redskin! What side are you on, Tootles?"
        - id: ch01-b30
          speaker: tootles
          text: "I'm a redskin too. Nibs, what are you?"
        - id: ch01-b31
          speaker: nibs
          text: "A redskin! What about you, First Twin?"
        - id: ch01-b32
          speaker: narrator
          text: >-
            The question went all the way around, and every lost boy chose the same side. That should have ended the fight. But the real redskins were fascinated by Peter's way of doing things. For that one battle, they agreed to become lost boys instead. Then everyone went at it again, fiercer than before.
        - id: ch01-b33
          speaker: narrator
          text: >-
            That adventure had a most extraordinary ending. But wait. We have not decided to tell that one after all. Perhaps the night attack on the underground house would be better. Several of the redskins got wedged in the hollow trees and had to be pulled out like corks. Or perhaps we should tell how Peter saved Tiger Lily's life in the Mermaids' Lagoon and, by doing so, made her his ally.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Then there was the cake the pirates baked to make the boys eat it and die. They hid it in one clever place after another, but Wendy always snatched it away from her children. In time it lost its freshness and grew hard as a stone. They used it as a weapon, and Hook tripped over it in the dark.
        - id: ch01-b35
          speaker: narrator
          text: >-
            We could choose the birds that befriended Peter, especially the Never bird. She built her nest in a tree hanging over the lagoon. When the nest fell into the water, she stayed sitting on her eggs, and Peter ordered everyone to leave her alone. It is a lovely story, and its ending shows how grateful a bird can be. But then we would also have to tell the whole lagoon adventure, which would make two adventures instead of one.
        - id: ch01-b36
          speaker: narrator
          text: >-
            There was a shorter story, just as exciting. Tinker Bell and some street fairies tried to carry the sleeping Wendy back to the mainland on a huge floating leaf. Luckily, the leaf gave way. Wendy woke up, thought it was bath-time, and swam back.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Or we might choose Peter's challenge to the lions. He drew a circle around himself with an arrow and dared them to cross it. The other boys and Wendy watched breathlessly from the trees. Peter waited for hours, but not one lion dared to accept.
        - id: ch01-b38
          speaker: narrator
          text: >-
            So which adventure shall it be? The fairest way is to toss for it.
        - id: ch01-b39
          speaker: narrator
          text: >-
            I tossed, and the lagoon won. That almost makes me wish the Gulch, the cake, or Tink's leaf had won instead. I could toss again and make it best two out of three. Still, it is probably fairest to stay with the lagoon.
