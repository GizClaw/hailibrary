audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    twin_1:
      display_name: 双胞胎哥哥
      tts:
        delivery: 乖顺谨慎，说话带一点迟疑
        timbre: 稚嫩清亮
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 合身的树与地下的家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，彼得先替温迪、约翰和迈克尔挑选合身的空心树。胡克曾笑孩子们为什么一人要一棵，那只是因为他不懂。树洞不合身，上下就很麻烦，而孩子们的身材又各不相同。尺寸对了，从树顶吸住一口气，便会以正好的速度滑到底。要爬上去，就交替吸气、呼气，一扭一扭地往上挪。动作练熟以后，不用想也能做得十分优美。
        - id: ch01-b02
          speaker: narrator
          text: 彼得量树，认真得像裁缝替人量衣服。不过，裁缝把衣服改得合身，彼得却把人改得合树。通常只要多穿或少穿几件衣服就够了。碰上身上某处鼓得不是地方，或者树形实在古怪，彼得就会动些手脚，叫你从此正好塞进去。合身以后还得一直保持。温迪很快发现，这倒能让全家人的体形都好极了。
        - id: ch01-b03
          speaker: narrator
          text: 温迪和迈克尔第一次便找到了合身的树。约翰就没那么走运，他得稍微改造一下。
        - id: ch01-b04
          speaker: narrator
          text: 练过几天，三个人便能像井里的吊桶那样，快活地上上下下。他们都爱极了地下之家，温迪尤其喜欢。家里只有一个大房间，房子本来就该这样。地板随时可以挖开，想钓鱼便从那里下钩。地上长着粗壮的蘑菇，颜色十分可爱，正好拿来当凳子。房间正中有棵梦幻树，一心想长大。孩子们每天早晨把它贴着地面锯断，到了下午茶时间，它又长到两英尺高。他们往树顶摆一扇门，树干和门合起来，桌子就有了。茶点一收走，再把树锯掉，屋里又腾出地方玩耍。
        - id: ch01-b05
          speaker: narrator
          text: 那里还有一座大得惊人的壁炉。你想在哪儿生火，它差不多就能在哪儿出现。温迪把植物纤维搓成绳，横拉在壁炉上方，再把洗好的衣服一件件晾上去。白天，床斜靠在墙上。六点半一到，床才放下来，半个房间都被占满。除了迈克尔，男孩子们全挤在上面，活像罐头里的沙丁鱼。谁也不能擅自翻身，得等一个人发出号令，所有人才一起翻过去。迈克尔本来也该睡大床，可温迪非要有个小宝宝，而他又最小。你们知道女人就是这样。事情就这么定了，他被挂在一只篮子里。
        - id: ch01-b06
          speaker: narrator
          text: 这个家又粗糙又简单，很像一群小熊会造出的地下房子。不过，墙上有个不比鸟笼大的凹处，那是小叮当的私人套间。小帘子一拉，外面就看不见了。小叮最讲究，换衣服时总把帘子遮得严严实实。
        - id: ch01-b07
          speaker: narrator
          text: 世上任何女人，不管个子多高，也不可能有一间比这更精致的闺房兼卧室。那张被小叮称为“睡榻”的床，是货真价实的玛布女王式样，长着粗短的弯腿。时下开什么果花，她便用什么花做床罩。镜子是珍稀的“穿靴子的猫”式，无缺口的真品，如今仙子古董商只知道三面。梳洗台能翻转，是“馅饼皮”式。五斗柜是正宗的“白马王子六世”式。地毯和小毯子，出自“玛杰里与罗宾”最好的早期年代。
        - id: ch01-b08
          speaker: narrator
          text: 屋顶还挂着“挑圆片”式枝形吊灯，只是摆来好看的，因为小叮自己就会发光。她很瞧不起屋里其余的地方，这大概也难免。她的房间确实漂亮，却也骄傲得很，看起来就像一只永远朝天翘着的鼻子。
    - id: ch02
      title: 温迪忙碌的日子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 温迪之所以觉得这一切迷人，大概正是因为那群横冲直撞的孩子，让她永远有事可忙。有时候她一连几星期都待在地下，只有晚上或许带着一只袜子上去一会儿。做饭更叫她整天守着锅，鼻子都快碰到锅沿。锅里没东西，她也得等它煮开。就算连锅都没有，照样得等。
        - id: ch02-b02
          speaker: narrator
          text: 每一顿是真饭还是假饭，全凭彼得当时怎么想。只要吃饭也算游戏，他就能真吃。可若只是为了填饱肚子，他便吃不下。偏偏大多数孩子最爱把肚子塞得鼓鼓的，第二爱做的，就是谈论吃东西。彼得却能把假饭吃得无比真实，眼看着身子都圆了起来。大家只能跟着他玩。除非你能证明自己已经瘦得在树洞里直晃，他才会准你真正吃个饱。
        - id: ch02-b03
          speaker: narrator
          text: 孩子们全睡下以后，温迪最喜欢缝衣服、补袜子。她说，这才是属于自己的喘气时间。可她还是拿这段时间给大家做新衣，还在裤子的膝盖上多缝一层结实的布。那群孩子实在太会折腾自己的膝盖，裤子总是磨破。
        - id: ch02-b04
          speaker: narrator
          text: 每当温迪面对满满一篮破袜子，发现每只袜跟都有洞，她就会把两手高高举起来，感叹一番。
        - id: ch02-b05
          speaker: wendy
          text: 哎呀！有时候我真羡慕那些一辈子不结婚的姑娘！
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: 她每次这么说，脸上偏偏笑得灿烂极了，丝毫不像真的在羡慕那些姑娘。
        - id: ch02-b07
          speaker: narrator
          text: 还记得温迪那只宠物狼吗？它很快知道她来到了岛上，也一路找到了她。他们迎面相逢，立刻扑进彼此怀里。从此以后，温迪走到哪里，那只狼就跟到哪里。
    - id: ch03
      title: 关于从前的考试
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 日子慢慢过去，温迪是不是常常想念留在家乡的父母呢？这可不好回答。谁也说不清梦幻岛的时间究竟怎么流逝。这里由太阳和月亮来计算日子，可它们的数目，比大陆上的太阳和月亮多得多。恐怕温迪并没有真正担心父母。她认定他们会一直开着窗，等她从那里飞回家，所以心里十分安稳。
        - id: ch03-b02
          speaker: narrator
          text: 真叫她不安的是另一件事。约翰对父母的印象越来越淡，只觉得那是从前认识的两个人。迈克尔甚至很愿意相信，温迪就是自己的亲妈妈。这让温迪有点害怕。她觉得自己有责任替弟弟们留住从前的生活，便照着过去在学校做的卷子，给他们出考试题。
        - id: ch03-b03
          speaker: narrator
          text: 其他孩子觉得考试有趣，也非参加不可。他们各自做了石板，围桌坐好，对着温迪写在另一块石板上的题目认真思索。那些题目再平常不过。妈妈的眼睛是什么颜色？爸爸和妈妈谁更高？妈妈是金发还是深色头发？如果能答，就把三题全答出来。
        - id: ch03-b04
          speaker: narrator
          text: 还有一道作文题，要求不少于四十字。题目可以选《我的上一个假期怎样度过》，也可以选《爸爸和妈妈的性格比较》，不过只能写一篇。另一组题目要他们分别描述妈妈的笑声、爸爸的笑声、妈妈赴宴时的礼服，还有狗窝和住在里面的那一位。
        - id: ch03-b05
          speaker: narrator
          text: 都是这样普普通通的问题。不会答，就画一个叉。连约翰的卷子上也出现了多得吓人的叉。只有斯莱特利答完了每一道题，他满心以为自己会得第一。可惜答案全都荒唐透顶，最后一名反倒归了他，真叫人难过。
        - id: ch03-b06
          speaker: narrator
          text: 彼得没有参加考试。一个缘故是，除了温迪，他看不起所有的妈妈。另一个缘故是，整个岛上只有他既不会写字，也不会拼字，哪怕最最简单的一个字也不会。当然，彼得才不会承认这是难处。他认为自己远远高于这一类事情，根本不屑去学。
        - id: ch03-b07
          speaker: narrator
          text: 顺便还有件事得告诉你。所有问题都写成了过去时。问的不是妈妈的眼睛是什么颜色，而是从前是什么颜色。你瞧，原来温迪自己也已经开始遗忘了。
    - id: ch04
      title: 该讲哪一场冒险
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 岛上的冒险每天都在发生。不过这阵子，彼得在温迪帮助下发明了一种新游戏。他一开始喜欢得不得了，转眼又丢到脑后，他的游戏总是这个下场。这一回，他们要假装没有冒险，只做约翰和迈克尔从小做惯的事。坐在凳子上抛球，互相推几下，出门散步，再平安回来，连一头灰熊也不杀。
        - id: ch04-b02
          speaker: narrator
          text: 看彼得坐着不动，实在是难得的奇观。他总摆出极其严肃的脸，因为安静坐着这件事，在他看来太滑稽了。他还夸口说，自己散步是为了身体健康。连续好几个太阳里，这就是他最新鲜的冒险。约翰和迈克尔也必须装得兴高采烈，否则彼得可不会轻饶他们。
        - id: ch04-b03
          speaker: narrator
          text: 彼得也常常独自出门。他回来时，你永远没法完全确定，他到底经历过冒险没有。有时他把冒险忘得干干净净，一句话也不说。可等你自己出了门，却会在外面发现一具尸体。有时他讲得天花乱坠，外面偏偏什么尸体也没有。偶尔他头缠绷带回家，温迪用温水替他清洗伤口，一边柔声哄他，他则讲起一个精彩得耀眼的故事。可温迪始终拿不准那些故事是真是假。
        - id: ch04-b04
          speaker: narrator
          text: 当然，也有许多冒险必定是真的，因为温迪亲身参加过。还有更多至少真了一部分，因为其他孩子也参加了，而且他们坚持说一切都是真的。若把这些冒险一件件写下来，得有一本英拉、拉英大辞典那么厚。我们最多只能挑一件，给大家看看岛上普普通通的一个钟头里，会发生些什么。可是，该挑哪一件呢？
        - id: ch04-b05
          speaker: narrator
          text: 斯莱特利峡谷的遭遇战怎么样？那一仗血流成河，还显出了彼得的怪脾气。他打到一半，会忽然换一边。那次双方不分胜负，战局来回摇摆，彼得突然改口，说自己当天是红种人。
        - id: ch04-b06
          speaker: peter
          text: 我今天当红种人。嘟嘟，你当什么？
        - id: ch04-b07
          speaker: tootles
          text: 我也当红种人。尼布斯，你呢？
        - id: ch04-b08
          speaker: nibs
          text: 红种人。双胞胎，你们当什么？
        - id: ch04-b09
          speaker: twin_1
          text: 我们也当红种人。
        - id: ch04-b10
          speaker: narrator
          text: 一个问一个，最后所有孩子都成了红种人。照理说，仗已经没法打了。可真正的红种人很欣赏彼得这一套，答应暂时改当走失的孩子。于是两边又扑上去，打得比先前更凶。那场冒险的结局十分出奇——不过，我们还没决定要不要讲它。
        - id: ch04-b11
          speaker: narrator
          text: 也许该讲红种人夜袭地下之家。好几个人卡在空心树里，只能像软木塞一样被拔出来。又或许该讲彼得在美人鱼礁湖救下虎莲公主，使她成了自己的盟友。
        - id: ch04-b12
          speaker: narrator
          text: 海盗的蛋糕也值得一讲。他们烤好蛋糕，想叫孩子们吃下去送命，便不断把它放在精心挑选的地方。可温迪每次都从孩子手里抢走。后来蛋糕不再松软鲜美，硬得像石头，反倒成了投掷的武器。胡克还在黑暗里被它绊倒过。
        - id: ch04-b13
          speaker: narrator
          text: 还有彼得的鸟朋友们。梦幻鸟把巢筑在礁湖上方的树上。鸟巢掉进水里，它仍旧守着自己的蛋。彼得下令谁也不许打扰。这故事很美，结尾还让人看见鸟儿也会感恩。可讲它，就必须连礁湖的冒险一起讲，那便成了两个故事。
        - id: ch04-b14
          speaker: narrator
          text: 另一次冒险短一些，却同样惊险。小叮当找来几个街头仙子，想趁温迪睡着，把她放在一片大叶子上，漂回大陆。幸亏叶子破了。温迪醒来，还以为到了洗澡时间，便自己游了回来。
        - id: ch04-b15
          speaker: narrator
          text: 也可以讲彼得挑战狮群。他拿箭在自己周围画了一个圆圈，叫狮子们有胆就跨进来。其他孩子和温迪坐在树上，紧张得不敢出声。彼得等了好几个钟头，没有一头狮子敢接受挑战。
        - id: ch04-b16
          speaker: narrator
          text: 这么多值得一讲的冒险，到底该选哪一件？最好的办法，当然是抛硬币来决定。
        - id: ch04-b17
          speaker: narrator
          text: 我已经抛过了，礁湖赢了。这个结果倒叫人希望，赢的是峡谷、蛋糕，或者小叮的叶子。当然，我还可以再抛，改成三局两胜。不过，既然说好了，还是讲礁湖最公平。
