  chapters:
    - id: ch01
      title: The Happy Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The fight at the lagoon had one important result. Peter had saved Tiger Lily from a terrible fate, and her people became his friends. Now she and her warriors would do anything for him. All night they kept watch above the underground home. The pirates were sure to attack soon. Even during the day, the warriors stayed nearby, smoking the peace pipe and looking almost as though they hoped for a bite to eat.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They called Peter the Great White Father and bowed flat before him. Peter loved that far too much, and it was not good for him.
        - id: ch01-b03
          speaker: peter
          text: >-
            The Great White Father is pleased to see the Piccaninny warriors guarding his wigwam from the pirates.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He spoke in a grand, lordly voice while the warriors lay at his feet.
        - id: ch01-b05
          speaker: tiger_lily
          text: >-
            Me Tiger Lily. Peter Pan save me. Me his very good friend. Me never let pirates hurt him.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Tiger Lily was much too lovely to bow and speak that way. But Peter believed he deserved it.
        - id: ch01-b07
          speaker: peter
          text: >-
            Good. Peter Pan has spoken.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Whenever Peter said that, everyone had to be quiet. The warriors accepted the order humbly. They did not treat the other boys with such respect. To them, the boys were only ordinary warriors. They greeted them with a simple “How-do?” and nothing more. That annoyed the boys, especially because Peter saw nothing wrong with it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Wendy privately understood how the boys felt. Still, she was too loyal a housewife to hear a complaint against the father of the family.
        - id: ch01-b10
          speaker: wendy
          text: >-
            Father knows best.
        - id: ch01-b11
          speaker: narrator
          text: >-
            She said that no matter what she truly thought. And she truly thought the warriors should not call her a squaw.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Then came the evening they would remember as the Night of Nights, because of all that happened and all that followed. The day itself had been quiet. Now the warriors waited at their posts above while the children ate their evening meal below. Only Peter was missing. He had gone out to find the time. On the island, that meant finding the crocodile and staying close until the clock inside him struck.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Their supper was a pretend tea. They crowded around the table, gobbling away and arguing so loudly that Wendy called the noise deafening. Noise did not really bother her. Grabbing did. And she would not accept the excuse that Tootles had bumped someone's elbow.
        - id: ch01-b14
          speaker: narrator
          text: >-
            At meals, nobody was allowed to hit back. A child with a complaint had to raise his right hand politely and report it to Wendy. Usually they forgot the rule, or else used it far too often. Wendy had already told them nineteen times not to talk over one another. At the twentieth, she cried out.
        - id: ch01-b15
          speaker: wendy
          text: >-
            Quiet, everyone! Slightly, dear, is there anything left in your mug?
        - id: ch01-b16
          speaker: narrator
          text: >-
            Slightly peered into a mug that was not really there.
        - id: ch01-b17
          speaker: slightly
          text: >-
            It's not completely empty, Mother.
        - id: ch01-b18
          speaker: nibs
          text: >-
            He hasn't even started his milk.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Nibs was telling on him, and Slightly seized the chance.
        - id: ch01-b20
          speaker: slightly
          text: >-
            I have a complaint about Nibs!
        - id: ch01-b21
          speaker: narrator
          text: >-
            But John had raised his hand first.
        - id: ch01-b22
          speaker: wendy
          text: >-
            Yes, John?
        - id: ch01-b23
          speaker: john
          text: >-
            Since Peter is away, may I use his chair?
        - id: ch01-b24
          speaker: wendy
          text: >-
            Sit in Father's chair? John, absolutely not!
          emotion: surprised
        - id: ch01-b25
          speaker: john
          text: >-
            But he isn't really our father. He didn't know how fathers behave until I taught him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            That was grumbling, and the twins spoke together at once.
        - id: ch01-b27
          speakers: [first_twin, second_twin]
          ensemble: duo
          text: >-
            We have a complaint about John!
        - id: ch01-b28
          speaker: narrator
          text: >-
            Tootles raised his hand next. He was the humblest of them all, really the only humble one, so Wendy always treated him with special gentleness.
        - id: ch01-b29
          speaker: tootles
          text: >-
            I don't suppose I could be the father?
        - id: ch01-b30
          speaker: wendy
          text: >-
            No, Tootles.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Tootles seldom got started, but once he did, he had a foolish habit of going on and on. With each new question, his voice grew slower and heavier.
        - id: ch01-b32
          speaker: tootles
          text: >-
            Well, if I can't be the father... Michael, could I be the baby?
        - id: ch01-b33
          speaker: michael
          text: >-
            No, you can't.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Michael was already settled in his basket.
        - id: ch01-b35
          speaker: tootles
          text: >-
            Then if I can't be the baby... could I be one of the twins?
        - id: ch01-b36
          speakers: [first_twin, second_twin]
          ensemble: duo
          text: >-
            Certainly not. Being a twin is terribly difficult.
        - id: ch01-b37
          speaker: tootles
          text: >-
            If I can't be anyone important, would anybody like to watch me do a trick?
        - id: ch01-b38
          speakers: [slightly, nibs, curly, john]
          ensemble: chorus
          text: No!
        - id: ch01-b39
          speaker: narrator
          text: >-
            That finally stopped him.
        - id: ch01-b40
          speaker: tootles
          text: >-
            I didn't really expect you to.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Then the dreadful telling started all over again.
        - id: ch01-b42
          speaker: unnamed_boy_1
          text: >-
            Slightly is coughing over the table.
        - id: ch01-b43
          speaker: unnamed_boy_2
          text: >-
            The twins ate their cheesecakes first.
        - id: ch01-b44
          speaker: unnamed_boy_3
          text: >-
            Curly took butter and honey together.
        - id: ch01-b45
          speaker: unnamed_boy_4
          text: >-
            Nibs is talking with food in his mouth.
        - id: ch01-b46
          speaker: unnamed_boy_1
          text: >-
            I have a complaint about the twins!
        - id: ch01-b47
          speaker: unnamed_boy_2
          text: >-
            I have a complaint about Curly!
        - id: ch01-b48
          speaker: unnamed_boy_3
          text: >-
            I have a complaint about Nibs!
        - id: ch01-b49
          speaker: wendy
          text: >-
            Oh, dear. Sometimes I truly think unmarried ladies have the better life.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Wendy ordered them to clear the table. Then she sat with her sewing basket and faced the usual mountain of stockings, every knee worn through.
        - id: ch01-b51
          speaker: michael
          text: >-
            Wendy, I'm too big to sleep in a cradle.
        - id: ch01-b52
          speaker: wendy
          text: >-
            Somebody has to be in the cradle, and you're the smallest. Besides, a cradle makes a home feel so cozy.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Wendy sounded almost cross. Then she went on sewing while the children played around her. Their happy faces and dancing arms and legs glowed in the wonderful firelight. It was an ordinary evening in the home under the ground now. But this was the last time we would ever see it.
        - id: ch01-b54
          speaker: narrator
          text: >-
            A footstep sounded overhead, and Wendy knew it before anyone else.
        - id: ch01-b55
          speaker: wendy
          text: >-
            Children, that's your father. He likes everyone to greet him at the door.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Up above, the warriors crouched in front of Peter.
        - id: ch01-b57
          speaker: peter
          text: >-
            Keep a sharp watch, warriors. I have spoken.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Then the merry children pulled him down through his tree, as they had done so many times before. But they would never do it again.
        - id: ch01-b59
          speaker: narrator
          text: >-
            Peter had brought nuts for the boys and the correct time for Wendy. He was in wonderfully high spirits.
        - id: ch01-b60
          speaker: wendy
          text: >-
            Peter, you really do spoil them.
          emotion: happy
        - id: ch01-b61
          speaker: peter
          text: >-
            Ah, old lady.
        - id: ch01-b62
          speaker: narrator
          text: >-
            He hung up his gun.
        - id: ch01-b63
          speaker: michael
          text: >-
            I'm the one who told him that fathers call mothers “old lady.”
        - id: ch01-b64
          speaker: narrator
          text: >-
            Michael whispered this to Curly.
        - id: ch01-b65
          speaker: curly
          text: >-
            I have a complaint about Michael!
        - id: ch01-b66
          speaker: narrator
          text: >-
            The first twin came over to Peter.
        - id: ch01-b67
          speaker: first_twin
          text: >-
            Father, we want to have a dance.
        - id: ch01-b68
          speaker: peter
          text: >-
            Then dance, my boy.
        - id: ch01-b69
          speaker: first_twin
          text: >-
            We want you to dance with us.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Peter was the best dancer there, but he acted as if the very idea shocked him.
        - id: ch01-b71
          speaker: peter
          text: >-
            Me? These old bones would shake and clatter!
        - id: ch01-b72
          speaker: first_twin
          text: >-
            We want Mother to dance too.
        - id: ch01-b73
          speaker: wendy
          text: >-
            What? A mother with this many children, dancing?
          emotion: surprised
        - id: ch01-b74
          speaker: slightly
          text: >-
            But it's Saturday night.
        - id: ch01-b75
          speaker: narrator
          text: >-
            It was not really Saturday night. Or perhaps it was. They had lost track of the days long ago. Whenever they wanted to do something special, they simply called it Saturday night and did it.
        - id: ch01-b76
          speaker: wendy
          text: >-
            Why, of course it's Saturday night, Peter.
        - id: ch01-b77
          speaker: narrator
          text: >-
            She was giving in.
        - id: ch01-b78
          speaker: peter
          text: >-
            At our age, Wendy?
        - id: ch01-b79
          speaker: wendy
          text: >-
            It's only our own children watching.
        - id: ch01-b80
          speaker: peter
          text: >-
            That's true. Quite true.
        - id: ch01-b81
          speaker: narrator
          text: >-
            So the children got permission to dance, but first they had to put on their nightclothes.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Peter warmed himself by the fire. Wendy sat nearby, turning the heel of a stocking, and he looked down at her.
        - id: ch01-b83
          speaker: peter
          text: >-
            Ah, old lady. After a hard day's work, nothing is better than sitting by the fire with you and all the little ones close by.
        - id: ch01-b84
          speaker: wendy
          text: >-
            It is lovely, isn't it, Peter? I really think Curly has your nose.
          emotion: happy
        - id: ch01-b85
          speaker: narrator
          text: >-
            Wendy was terribly pleased.
        - id: ch01-b86
          speaker: peter
          text: >-
            Michael looks more like you.
        - id: ch01-b87
          speaker: narrator
          text: >-
            Wendy went to Peter and rested a hand on his shoulder.
        - id: ch01-b88
          speaker: wendy
          text: >-
            Dear Peter, with such a big family, I suppose my best years are behind me. But you wouldn't want someone else instead of me, would you?
        - id: ch01-b89
          speaker: peter
          text: >-
            No, Wendy.
        - id: ch01-b90
          speaker: narrator
          text: >-
            He certainly did not want anyone else. Still, he blinked at her uneasily, like someone who could not tell whether he was awake or dreaming.
        - id: ch01-b91
          speaker: wendy
          text: >-
            Peter, what's wrong?
        - id: ch01-b92
          speaker: peter
          text: >-
            I was thinking... I'm only pretending to be their father, right?
          emotion: fearful
        - id: ch01-b93
          speaker: wendy
          text: >-
            Yes, of course.
        - id: ch01-b94
          speaker: peter
          text: >-
            Because if I were their real father, I'd seem terribly old.
        - id: ch01-b95
          speaker: wendy
          text: >-
            But the children belong to us, Peter. To you and me.
        - id: ch01-b96
          speaker: peter
          text: >-
            They don't really, though. Do they, Wendy?
        - id: ch01-b97
          speaker: wendy
          text: >-
            Not if you don't want them to.
        - id: ch01-b98
          speaker: narrator
          text: >-
            She clearly heard Peter sigh with relief. Then she tried to keep her voice firm.
        - id: ch01-b99
          speaker: wendy
          text: >-
            Peter, tell me exactly how you feel about me.
        - id: ch01-b100
          speaker: peter
          text: >-
            I feel like a devoted son, Wendy.
        - id: ch01-b101
          speaker: wendy
          text: >-
            That's what I thought.
        - id: ch01-b102
          speaker: narrator
          text: >-
            She went and sat alone at the farthest end of the room.
        - id: ch01-b103
          speaker: peter
          text: >-
            You're so strange. Tiger Lily acts the same way. She wants to be something to me, but she says she doesn't want to be my mother.
        - id: ch01-b104
          speaker: wendy
          text: >-
            She certainly does not!
          emotion: angry
        - id: ch01-b105
          speaker: narrator
          text: >-
            Wendy put such fierce emphasis on it that now we know why she disliked Tiger Lily's people.
        - id: ch01-b106
          speaker: peter
          text: >-
            Then what does she want to be?
        - id: ch01-b107
          speaker: wendy
          text: >-
            That isn't something a lady should have to explain.
        - id: ch01-b108
          speaker: peter
          text: >-
            Fine, then. Maybe Tinker Bell will explain it.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Peter sounded a little annoyed.
        - id: ch01-b110
          speaker: wendy
          text: >-
            Oh, yes, ask Tinker Bell. She has no shame at all.
        - id: ch01-b111
          speaker: narrator
          text: >-
            Tinker Bell had been listening from her bedroom. Now she squeaked something rude.
        - id: ch01-b112
          speaker: peter
          text: >-
            She says she's proud of having no shame.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Then a new thought struck him.
        - id: ch01-b114
          speaker: peter
          text: >-
            Could Tink want to be my mother?
        - id: ch01-b115
          speaker: tinker_bell
          text: >-
            You silly donkey!
          emotion: angry
        - id: ch01-b116
          speaker: narrator
          text: >-
            Tinker Bell was furious. She had said that to Peter so often that Wendy understood without a translation.
        - id: ch01-b117
          speaker: wendy
          text: >-
            For once, I nearly agree with her.
          emotion: angry
        - id: ch01-b118
          speaker: narrator
          text: >-
            Wendy actually snapped at him. She had been sorely tested, and she had no idea what would happen before the night was over. If she had known, she would not have snapped.
        - id: ch01-b119
          speaker: narrator
          text: >-
            None of them knew what lay ahead. Perhaps that was for the best. Not knowing gave them one more happy hour. It would be their last hour on the island, so let us be glad that it held sixty happy minutes, with no fear of what would come afterward.
        - id: ch01-b120
          speaker: narrator
          text: >-
            In their nightclothes, they sang and danced. Their song was deliciously spooky. They pretended their own shadows frightened them, never guessing that real shadows would soon close around them and make them shrink in fear.
        - id: ch01-b121
          speaker: narrator
          text: >-
            The dance grew wild and joyful. They knocked one another onto the bed and off again until it was more pillow fight than dance. When they stopped, the pillows seemed to demand one last round, like dancing partners who knew they might never meet again.
        - id: ch01-b122
          speaker: narrator
          text: >-
            Then came the stories they told before Wendy's good-night story. Even Slightly tried to tell one. But his beginning was so dreadfully dull that it horrified everyone, including Slightly himself.
        - id: ch01-b123
          speaker: slightly
          text: >-
            Yes, this beginning is boring. Let's pretend it's the ending instead.
        - id: ch01-b124
          speaker: narrator
          text: >-
            At last, they all climbed into bed for Wendy's good-night story. It was the story they loved most, and the one Peter hated. Usually, as soon as Wendy began, he left the room or covered his ears so he could not hear a word. If he had done either one this time, perhaps they would all still be on the island.
        - id: ch01-b125
          speaker: narrator
          text: >-
            But that night Peter stayed on his stool. And now we shall see what happened.
