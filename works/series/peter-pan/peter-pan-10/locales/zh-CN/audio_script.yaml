audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，任性时理直气壮
        timbre: 柔软稚气
        pace: 短促活泼
        pitch: 高音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tinker_bell:
      display_name: 小叮当
      tts:
        delivery: 伶俐急躁，生气时像一串尖锐的小铃
        timbre: 晶莹细亮
        pace: 飞快
        pitch: 高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自负爱表现，讲话总像比别人多懂一点
        timbre: 清脆偏亮
        pace: 轻快
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 淘气机灵，反应又快又直接
        timbre: 活泼清亮
        pace: 明快
        pitch: 中高音
    twin_1:
      display_name: 双胞胎哥哥
      tts:
        delivery: 乖顺谨慎，说话带一点迟疑
        timbre: 稚嫩清亮
        pace: 适中
        pitch: 中高音
    twin_2:
      display_name: 双胞胎弟弟
      tts:
        delivery: 乖顺谨慎，常跟着哥哥开口
        timbre: 稚嫩柔和
        pace: 适中
        pitch: 高音
    tiger_lily:
      display_name: 虎莲
      tts:
        delivery: 骄傲勇敢，面对彼得时郑重而热烈
        timbre: 清亮坚定
        pace: 稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 守卫地下之家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 礁湖上的冲突有了一个重要结果。彼得救下虎莲以后，红种人全成了孩子们的朋友。虎莲和勇士们什么都肯替他做。他们整夜守在地面上，保护地下之家，等着海盗那场拖不了多久的总攻。白天，他们也不肯走远，只在附近抽和平烟斗。瞧那副样子，倒像在等谁送些好吃的来。
        - id: ch01-b02
          speaker: narrator
          text: 他们称彼得为伟大的白人父亲，每次见到他，都恭恭敬敬地伏倒在他脚下。彼得非常喜欢这一套，喜欢得简直有些过了头，对他实在一点好处也没有。
        - id: ch01-b03
          speaker: peter
          text: 伟大的白人父亲看到皮卡尼尼勇士守住他的帐篷，不让海盗来犯，很是高兴。
        - id: ch01-b04
          speaker: tiger_lily
          text: 我是虎莲。彼得·潘救过我，我是他顶顶好的朋友。我不许海盗伤害他。
        - id: ch01-b05
          speaker: narrator
          text: 虎莲那么美，原不该这样低声下气。可彼得认为这是自己应得的，回答她时，口气十分屈尊。
        - id: ch01-b06
          speaker: peter
          text: 很好。彼得·潘的话说完了。
        - id: ch01-b07
          speaker: narrator
          text: 每次彼得说完这句，意思都是大家现在必须闭嘴。红种人明白他的意思，也谦恭地照办了。可他们对其余男孩只当普通勇士，见了面随口说声“你好呀”，再说些差不多的话，一点也不恭敬。男孩们最气的是，彼得竟觉得这很应该。温迪暗地里有些同情他们，却是个忠心的主妇，绝不许谁抱怨父亲。
        - id: ch01-b08
          speaker: wendy
          text: 父亲总是最明白的。
        - id: ch01-b09
          speaker: narrator
          text: 这句话她总挂在嘴上，不管心里究竟怎么想。不过，她私下里的确认为，红种人实在不该叫她“女人”。
    - id: ch02
      title: 假想的下午茶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 故事讲到这里，终于来到了那个晚上。后来，大家把它叫作“万夜之夜”，因为这晚发生的奇遇，还有那些奇遇带来的结局，再没有哪一夜比得上。白天几乎什么事也没发生，仿佛一直在悄悄积蓄力量。此刻，红种人裹着毯子，在上面的岗位守卫。孩子们则在下面吃晚饭，只有彼得不在。他出门打听时间去了。在岛上，要知道几点钟，得先找到鳄鱼，再待在旁边等它肚子里的钟报时。
        - id: ch02-b02
          speaker: narrator
          text: 晚饭是假装出来的下午茶。孩子们围着桌子，贪吃地狼吞虎咽，其实什么也没吃着。他们七嘴八舌，又相互指责，吵得温迪说自己的耳朵都快聋了。她本来不怕热闹，却绝不许他们伸手乱抢，抢完再推说是嘟嘟碰了自己的胳膊肘。家里早有一条定规，吃饭时谁也不许还手。有了争执，要客客气气地举起右手，再说自己要告谁一状。可他们不是忘记这规矩，就是把它用个不停。
        - id: ch02-b03
          speaker: wendy
          text: 都安静！我说了二十遍，别一起讲话。斯莱特利亲爱的，你杯子里喝光了吗？
        - id: ch02-b04
          speaker: narrator
          text: 斯莱特利低头瞧了瞧那只并不存在的杯子。
        - id: ch02-b05
          speaker: slightly
          text: 还剩一点呢，妈妈。
        - id: ch02-b06
          speaker: nibs
          text: 他连牛奶都还没开始喝。
        - id: ch02-b07
          speaker: narrator
          text: 尼布斯这是在打小报告，斯莱特利马上抓住机会。
        - id: ch02-b08
          speaker: slightly
          text: 我要告尼布斯一状！
        - id: ch02-b09
          speaker: narrator
          text: 可约翰比他先举起了手。
        - id: ch02-b10
          speaker: wendy
          text: 约翰，你有什么事？
        - id: ch02-b11
          speaker: john
          text: 彼得不在，我可以坐他的椅子吗？
        - id: ch02-b12
          speaker: wendy
          text: 你要坐父亲的椅子？当然不可以！
          emotion: surprised
        - id: ch02-b13
          speaker: john
          text: 可他不真是我们的父亲。还是我教了他，他才知道父亲该怎么当呢。
        - id: ch02-b14
          speaker: narrator
          text: 这话可算抱怨父亲了。
        - id: ch02-b15
          speakers: [twin_1, twin_2]
          ensemble: duo
          text: 我们要告约翰一状！
        - id: ch02-b16
          speaker: narrator
          text: 嘟嘟举起手。他是孩子里最谦卑的一个，其实也是唯一谦卑的一个，所以温迪待他格外温柔。
        - id: ch02-b17
          speaker: tootles
          text: 我想……我大概不能当父亲吧？
        - id: ch02-b18
          speaker: wendy
          text: 不能，嘟嘟。
        - id: ch02-b19
          speaker: narrator
          text: 嘟嘟不常说话，可一旦开口，就会傻乎乎地一直说下去。这回，他的声音越来越沉重。
        - id: ch02-b20
          speaker: tootles
          text: 既然我当不了父亲，迈克尔，你大概也不会让我当小宝宝吧？
        - id: ch02-b21
          speaker: michael
          text: 我不让。
        - id: ch02-b22
          speaker: narrator
          text: 迈克尔已经躺进篮子，回答得又快又干脆。
        - id: ch02-b23
          speaker: tootles
          text: 那我也当不了小宝宝。你们觉得，我能不能当双胞胎？
        - id: ch02-b24
          speakers: [twin_1, twin_2]
          ensemble: duo
          text: 那可不行。当双胞胎难得要命呢。
        - id: ch02-b25
          speaker: tootles
          text: 既然我什么重要的人都当不了，有谁想看我变个戏法吗？
        - id: ch02-b26
          speakers: [slightly, nibs, curly, twin_1]
          ensemble: chorus
          text: 谁也不想看。
        - id: ch02-b27
          speaker: tootles
          text: 我本来也没指望你们想看。
        - id: ch02-b28
          speaker: narrator
          text: 嘟嘟总算停了。可是，那些讨厌的小报告又立刻冒出来。
        - id: ch02-b29
          speaker: nibs
          text: 斯莱特利正朝桌子咳嗽。
        - id: ch02-b30
          speaker: curly
          text: 双胞胎先吃了乳酪饼。
        - id: ch02-b31
          speaker: twin_1
          text: 卷毛同时拿了黄油和蜂蜜。
        - id: ch02-b32
          speaker: twin_2
          text: 尼布斯嘴里有东西还讲话。
        - id: ch02-b33
          speaker: slightly
          text: 我要告双胞胎一状。
        - id: ch02-b34
          speaker: twin_1
          text: 我要告卷毛一状。
        - id: ch02-b35
          speaker: curly
          text: 我要告尼布斯一状。
        - id: ch02-b36
          speaker: wendy
          text: 唉，唉，有时候我真觉得，没结婚的姑娘才叫人羡慕呢。
        - id: ch02-b37
          speaker: narrator
          text: 温迪叫他们把桌子收拾干净，自己坐到针线篮边。篮里堆着一大摞长袜，每只袜子的膝盖照旧都有洞。
        - id: ch02-b38
          speaker: michael
          text: 温迪，我已经长大了，不能再睡摇篮。
        - id: ch02-b39
          speaker: wendy
          text: 可我总得有个人睡摇篮，你又是最小的。家里有只摇篮，多有家的样子呀。
        - id: ch02-b40
          speaker: narrator
          text: 她的口气几乎有点尖。接着，她坐在那里缝补，孩子们围着她玩。一张张快乐的脸，一条条舞动的腿，都被那团带着传奇色彩的炉火照亮了。这样的景象，在地下之家早已寻常得很。只是我们要好好看一眼，因为这是最后一次看见它了。
    - id: ch03
      title: 星期六晚上的舞会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 头顶传来脚步声，温迪第一个认出了是谁。
        - id: ch03-b02
          speaker: wendy
          text: 孩子们，我听见父亲回来了。他喜欢你们到门口迎接。
        - id: ch03-b03
          speaker: narrator
          text: 地面上，红种人正伏在彼得脚前。
        - id: ch03-b04
          speaker: peter
          text: 勇士们，好好守着。我的话说完了。
        - id: ch03-b05
          speaker: narrator
          text: 随后，快乐的孩子们像以前一样，拥上去把彼得从他的树洞里拖下来。这一幕过去发生过许多次，却不会再有下一次。彼得没有空手回来。他给男孩们带了坚果，也给温迪带回从鳄鱼那里听到的准确时间。
        - id: ch03-b06
          speaker: wendy
          text: 彼得，你就是太宠他们啦。
        - id: ch03-b07
          speaker: peter
          text: 啊，老太婆。
        - id: ch03-b08
          speaker: narrator
          text: 彼得说着，把枪挂了起来。
        - id: ch03-b09
          speaker: michael
          text: 是我告诉他的，母亲都叫老太婆。
        - id: ch03-b10
          speaker: narrator
          text: 迈克尔悄悄把这件事告诉卷毛，卷毛当场抓住机会。
        - id: ch03-b11
          speaker: curly
          text: 我要告迈克尔一状。
        - id: ch03-b12
          speaker: twin_1
          text: 父亲，我们想跳舞。
        - id: ch03-b13
          speaker: peter
          text: 那就跳吧，我的小男子汉。
        - id: ch03-b14
          speaker: twin_1
          text: 可我们想让你也跳。
        - id: ch03-b15
          speaker: narrator
          text: 彼得明明是他们当中最会跳舞的，却故意装得十分吃惊。
        - id: ch03-b16
          speaker: peter
          text: 我也跳？我这把老骨头非得响成一串不可！
        - id: ch03-b17
          speaker: twin_2
          text: 妈妈也要一起跳。
        - id: ch03-b18
          speaker: wendy
          text: 什么？我有这么一大窝孩子，当母亲的还能跳舞吗？
          emotion: surprised
        - id: ch03-b19
          speaker: slightly
          text: 可今天是星期六晚上呀。
        - id: ch03-b20
          speaker: narrator
          text: 那天其实并不是星期六，当然，也可能碰巧真是，因为他们早已数不清日子。不过，每次想做点特别的事，他们就一口咬定今天是星期六晚上，然后照做不误。这次也一样，温迪终于心软了。
        - id: ch03-b21
          speaker: wendy
          text: 彼得，今天当然是星期六晚上。
        - id: ch03-b22
          speaker: peter
          text: 温迪，像咱们这样身份的人也跳吗？
        - id: ch03-b23
          speaker: wendy
          text: 反正只有自己的孩子看着。
        - id: ch03-b24
          speaker: peter
          text: 对呀，对呀。
        - id: ch03-b25
          speaker: narrator
          text: 于是，孩子们得到准许，可以跳舞了。不过，他们得先换上睡衣。
    - id: ch04
      title: 最后一个快乐钟头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得在火边暖着身子，温迪坐在一旁翻补袜跟。他低头看着她，悄悄开了口。
        - id: ch04-b02
          speaker: peter
          text: 啊，老太婆，忙完一天的活，晚上坐在炉火边歇一歇，小家伙们都在身旁。对咱俩来说，还有什么比这更舒服？
        - id: ch04-b03
          speaker: wendy
          text: 真幸福呀，是不是，彼得？我觉得卷毛的鼻子长得像你。
          emotion: happy
        - id: ch04-b04
          speaker: peter
          text: 迈克尔倒是很像你。
        - id: ch04-b05
          speaker: narrator
          text: 温迪走过去，把手放在彼得肩上。
        - id: ch04-b06
          speaker: wendy
          text: 亲爱的彼得，咱们有了这么多孩子，我当然已经不如从前了。可你不会想换掉我，对不对？
        - id: ch04-b07
          speaker: peter
          text: 我不会换掉你，温迪。
        - id: ch04-b08
          speaker: narrator
          text: 他的确一点也不想换掉温迪。可他看着她时，神情很不自在，还一直眨眼。你知道，那样子就像一个人忽然拿不准，自己究竟醒着，还是仍在做梦。
        - id: ch04-b09
          speaker: wendy
          text: 彼得，你怎么了？
        - id: ch04-b10
          speaker: peter
          text: 我只是在想，我当他们的父亲，是咱们假装的吧？
          emotion: fearful
        - id: ch04-b11
          speaker: wendy
          text: 那当然是假的。
        - id: ch04-b12
          speaker: peter
          text: 因为我要真是他们的父亲，看起来就太老啦。
        - id: ch04-b13
          speaker: wendy
          text: 可他们属于我们呀，彼得。既是你的，也是我的。
        - id: ch04-b14
          speaker: peter
          text: 但不是真的属于我们，对不对，温迪？
        - id: ch04-b15
          speaker: wendy
          text: 只要你不愿意，那就不是真的。可彼得，你对我到底是什么感情？
        - id: ch04-b16
          speaker: narrator
          text: 温迪话音刚落，就清清楚楚听见彼得松了一口气。她心里很不是滋味，可还是努力让自己接下来的问题听起来坚定。
        - id: ch04-b17
          speaker: peter
          text: 就是一个孝顺儿子对母亲的感情呀，温迪。
        - id: ch04-b18
          speaker: wendy
          text: 我早就猜到了。
          emotion: sad
        - id: ch04-b19
          speaker: narrator
          text: 她独自走到房间最远的一头坐下。彼得却真心不懂她为什么不高兴。
        - id: ch04-b20
          speaker: peter
          text: 你真古怪，虎莲也跟你一样。她想成为我的什么人，可她说自己不是想当我母亲。
        - id: ch04-b21
          speaker: wendy
          text: 她当然不是想当你母亲。
        - id: ch04-b22
          speaker: narrator
          text: 温迪把这句话说得特别用力，仿佛根本不能容忍另一种答案。现在我们总算知道了，她为什么对红种人抱有成见。
        - id: ch04-b23
          speaker: peter
          text: 那她想当我的什么人？
        - id: ch04-b24
          speaker: wendy
          text: 这种事不能叫一位淑女亲口告诉你。
        - id: ch04-b25
          speaker: peter
          text: 好吧。也许小叮当肯告诉我。
        - id: ch04-b26
          speaker: wendy
          text: 对呀，小叮当准会告诉你。她可是个不知羞耻的小东西。
        - id: ch04-b27
          speaker: narrator
          text: 小叮当躲在卧室里偷听，这时尖声说了一句放肆的话。
        - id: ch04-b28
          speaker: peter
          text: 她说，她就以不知羞耻为荣。
        - id: ch04-b29
          speaker: narrator
          text: 彼得忽然想到另一种可能。
        - id: ch04-b30
          speaker: peter
          text: 难道小叮当想当我母亲？
        - id: ch04-b31
          speaker: tinker_bell
          text: 你这个傻瓜！
          emotion: angry
        - id: ch04-b32
          speaker: narrator
          text: 这句话小叮当说过太多次，温迪根本不需要翻译。
        - id: ch04-b33
          speaker: wendy
          text: 这一回，我倒差不多赞成她。
        - id: ch04-b34
          speaker: narrator
          text: 想想看，一向端庄的温迪竟也会没好气地说话！可这一天，她已经受了许多折磨，又根本不知道这一夜结束以前会发生什么。她若知道，就绝不会这样说了。
        - id: ch04-b35
          speaker: narrator
          text: 他们当中谁也不知道。也许不知道反而更好。正因为毫不知情，他们又快乐了整整一小时，而这正是他们留在岛上的最后一个钟头。所以，让我们庆幸吧，那六十分钟没有一分钟不快乐。他们穿着睡衣，又唱又跳。那支歌好听得很，又叫人心里发毛。孩子们假装害怕自己的影子，却一点也不知道，真正的阴影很快就会从四面合拢，吓得他们当真往后退。
        - id: ch04-b36
          speaker: narrator
          text: 舞会热闹极了。孩子们在床上打到床下，又从床下打回床上，跳舞很快变成了一场枕头大战。第一回打完，枕头还非要再打一次，仿佛一对舞伴知道以后也许再也见不到彼此。等温迪讲晚安故事以前，大家又讲了好多自己的故事。那天晚上，连斯莱特利也试着讲了一个。可那个开头无聊得可怕，不只把别人吓着了，连他自己也觉得难以忍受。
        - id: ch04-b37
          speaker: slightly
          text: 是啊，这个开头真没意思。咱们就假装它已经是结尾吧。
        - id: ch04-b38
          speaker: narrator
          text: 最后，孩子们全都钻进被窝，等温迪讲他们最爱的那个故事。偏偏彼得最讨厌它。往常温迪一开讲，他不是走出房间，就是捂住耳朵。这一晚，如果他还照旧那么做，也许他们至今仍留在岛上。可是，他没有走，也没有捂耳朵，只坐在自己的小凳子上。接下来发生的事，我们很快就会知道。
