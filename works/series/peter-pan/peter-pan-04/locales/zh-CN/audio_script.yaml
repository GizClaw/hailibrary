audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，任性时理直气壮
        timbre: 柔软稚气
        pace: 短促活泼
        pitch: 高音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tinker_bell:
      display_name: 小叮当
      tts:
        delivery: 伶俐急躁，生气时像一串尖锐的小铃
        timbre: 晶莹细亮
        pace: 飞快
        pitch: 高音
  chapters:
    - id: ch01
      title: 飞行
      blocks:
        - id: ch01-b01
          speaker: peter
          text: 往右数到第二个路口，再一直飞，飞到天亮。
        - id: ch01-b02
          speaker: narrator
          text: 彼得告诉温迪，这就是去梦幻岛的路。可别说孩子，就算鸟儿带着地图，一到风口便拿出来看，照这个说法也找不到地方。彼得呀，心里冒出什么，嘴上就说什么。
        - id: ch01-b03
          speaker: narrator
          text: 起先，大家对他一点也不怀疑。飞行又实在太好玩了，沿路只要看见教堂尖顶或别的高东西，觉得有趣，他们就绕着飞上好几圈，把许多时间都耽搁了。约翰和迈克尔还比起了赛，迈克尔先出发。
        - id: ch01-b04
          speaker: narrator
          text: 不久以前，他们只会绕着一间屋子飞，就觉得自己很了不起。如今想起来，真不值一提。可那究竟是多久以前呢？温迪开始认真不安时，他们已经飞到了海上。约翰猜，这是第二片海，也是第三个夜晚。
        - id: ch01-b05
          speaker: narrator
          text: 一路上一时天黑，一时天亮。孩子们忽而冷得发抖，忽而又热得难受，有时也饿了。可他们是真的饿，还是只想看彼得那套新鲜的找食办法？彼得会追上嘴里衔着人能吃的东西的鸟，一把夺过来。鸟儿再从后面追赶，把食物抢回嘴里。大家就这样快活地追出好几英里，最后还彼此客客气气地分手。
        - id: ch01-b06
          speaker: narrator
          text: 温迪看着这一切，心里温柔地替彼得担忧。他好像根本不知道，用这种办法弄到面包黄油实在很古怪。他甚至不知道，世上还有别的办法。
        - id: ch01-b07
          speaker: narrator
          text: 他们可不是装困，是真的困。只要睡过去，人便往下掉。最吓人的是，彼得偏偏觉得这很好笑。迈克尔一头栽下去，像块石头。
        - id: ch01-b08
          speaker: peter
          text: 快看，他又掉下去啦！
          emotion: happy
        - id: ch01-b09
          speaker: wendy
          text: 快救他呀，快把他接住！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 温迪望见遥远下方那片无情的大海，吓坏了。彼得终于俯冲下去，总会赶在迈克尔碰上海面前的一瞬间把他接住。那动作漂亮极了。可是他每次都故意等到最后一刻。看起来，彼得真正感兴趣的是显露自己的本领，并不是救下一条性命。他又特别喜新厌旧，眼前的游戏说不定下一刻便玩腻了，所以谁也不能保证，下一次他还肯接住你。
        - id: ch01-b11
          speaker: narrator
          text: 彼得自己倒能仰面浮在风里睡觉，因为他轻得不得了。你飞到后面吹口气，他还会快上一截。
        - id: ch01-b12
          speaker: narrator
          text: 有一回，他们在玩“跟着首领”。温迪悄悄叮嘱约翰。
        - id: ch01-b13
          speaker: wendy
          text: 你就对彼得客气一点吧。
        - id: ch01-b14
          speaker: john
          text: 那你先叫他别老是显摆。
        - id: ch01-b15
          speaker: narrator
          text: 彼得贴着海面飞，每经过一条鲨鱼，就伸手摸一下它的尾巴。那样子，就像你走在街上，用手指沿着铁栏杆一路划过去。孩子们学他，却怎么也做不好。他还不停回头，看看他们漏掉了多少条尾巴。这样看来，约翰说他卖弄本领，也不算冤枉他。
        - id: ch01-b16
          speaker: wendy
          text: 你们一定要对他好。要是他扔下我们，大家怎么办？
        - id: ch01-b17
          speaker: michael
          text: 我们可以回家呀。
        - id: ch01-b18
          speaker: wendy
          text: 没有彼得带路，我们怎么找得到家？
        - id: ch01-b19
          speaker: john
          text: 那就继续往前飞。
        - id: ch01-b20
          speaker: wendy
          text: 这才可怕呢。我们只能一直飞，因为彼得根本没教我们怎么停。
        - id: ch01-b21
          speaker: narrator
          text: 彼得的确把停下来的办法忘了。约翰说，事情就算糟到不能再糟，他们也只须一直往前飞。地球既然是圆的，绕上一圈，早晚能回到自家的窗口。
        - id: ch01-b22
          speaker: wendy
          text: 那吃的呢？谁来替我们找？
        - id: ch01-b23
          speaker: john
          text: 刚才那只鹰嘴里的东西，我咬下来一块，动作挺利落吧？
        - id: ch01-b24
          speaker: wendy
          text: 你试到第二十次才咬着。就算以后会找食物，彼得不在旁边，我们连云彩都躲不开。
        - id: ch01-b25
          speaker: narrator
          text: 他们确实老在撞东西。现在，他们已经能很有力气地往前飞，只是两条腿仍旧踢得太厉害。前面一出现云，他们越是使劲躲闪，越会结结实实地撞进去。娜娜要是跟在身边，这会儿早就在迈克尔额头上缠好绷带了。
        - id: ch01-b26
          speaker: narrator
          text: 彼得这时不知飞去了哪里，剩下三个孩子独自在高空，很是孤单。他飞得比他们快得太多，忽然一窜就会没了影，自己跑去经历一场不带他们的冒险。回来时，他会笑个不停，说刚才对一颗星星讲了件特别好笑的事，可究竟讲的是什么，他已经忘了。
        - id: ch01-b27
          speaker: narrator
          text: 有时彼得又会从下面钻上来，身上还粘着亮闪闪的人鱼鳞片，却说不清刚才究竟发生过什么。几个从没亲眼见过人鱼的孩子只能听着，当然觉得这特别叫人生气。
        - id: ch01-b28
          speaker: wendy
          text: 他连刚发生的事都忘得这么快，又怎么会一直记得我们？
        - id: ch01-b29
          speaker: narrator
          text: 温迪没有猜错。有时彼得回来，真的记不清他们，至少记不真切。他正要像对陌生人一样随口问声好，然后继续赶路，眼里才忽然亮起认出他们的神色。有一次，他险些就这样飞走，温迪只好急忙叫住他。
        - id: ch01-b30
          speaker: wendy
          text: 是我呀，我是温迪。
        - id: ch01-b31
          speaker: peter
          text: 对不起，温迪。下次发现我忘了，你就不停告诉我“我是温迪”。这么一说，我自然会想起来。
        - id: ch01-b32
          speaker: narrator
          text: 这主意当然不怎么叫人安心。为了赔不是，彼得教大家把身子平平铺开，躺在一股顺路的强风上。这样舒服多了，他们试过几次，发现当真能够稳稳地睡觉。孩子们本想再睡久一点，可彼得很快就睡腻了，总会摆出船长的口气，把他们叫醒。
        - id: ch01-b33
          speaker: peter
          text: 到站了，我们就在这儿下船。
        - id: ch01-b34
          speaker: narrator
          text: 他们一路偶尔拌几句嘴，大多时候却闹得很快活。许多个月亮过去以后，孩子们当真来到了梦幻岛，而且方向竟一直没有偏离多少。与其说是彼得或小叮带对了路，不如说，是那座岛也正在寻找他们。只有用这种办法，人才能望见那片神奇的海岸。
        - id: ch01-b35
          speaker: peter
          text: 就在那儿。
        - id: ch01-b36
          speakers: [wendy, john, michael]
          ensemble: chorus
          text: 在哪儿？在哪儿？
        - id: ch01-b37
          speaker: peter
          text: 所有金箭指着的地方。
        - id: ch01-b38
          speaker: narrator
          text: 一百万支金色的箭正在指向小岛。那些箭全由孩子们的朋友太阳射出。太阳要离开他们，回去度过夜晚了，临走前还想替孩子们把方向指得明明白白，免得他们走错路。
        - id: ch01-b39
          speaker: narrator
          text: 温迪、约翰和迈克尔踮着脚站在空中，争着看清那座岛的第一眼。奇怪的是，三个人一下就认了出来。恐惧还没来到时，他们欢呼着迎接小岛。他们觉得自己不是终于找到了一个梦想已久的地方，倒像放假回家时，又见到一位熟悉的老朋友。
        - id: ch01-b40
          speaker: wendy
          text: 约翰，那边就是礁湖！
        - id: ch01-b41
          speaker: john
          text: 温迪快看，海龟正在沙里埋蛋。
        - id: ch01-b42
          speaker: michael
          text: 约翰，我看见你那只断腿的火烈鸟啦！
        - id: ch01-b43
          speaker: wendy
          text: 迈克尔，那边有你的洞穴！约翰，灌木丛里的东西是什么？
        - id: ch01-b44
          speaker: john
          text: 是一只母狼，还带着幼崽。温迪，那只小狼准是你的！
        - id: ch01-b45
          speaker: michael
          text: 约翰，我的船也在，船舷都撞坏了！
        - id: ch01-b46
          speaker: john
          text: 不可能。我们早把你的船烧掉了。
        - id: ch01-b47
          speaker: michael
          text: 反正就是那条船。约翰，我还看见印第安人营地的烟了！
        - id: ch01-b48
          speaker: john
          text: 指给我看。我看烟怎么卷，就知道他们是不是出征了。
        - id: ch01-b49
          speaker: michael
          text: 在那里，神秘河对岸。
        - id: ch01-b50
          speaker: john
          text: 我看见了。没错，他们真的出征了。
        - id: ch01-b51
          speaker: narrator
          text: 孩子们居然对岛上知道得这么多，彼得有点不痛快。他本来很想在他们面前摆摆威风，而机会马上就来了。先前说过，恐惧很快会降临。金箭一支支消失时，恐惧便到了，小岛也落进一片昏暗里。
        - id: ch01-b52
          speaker: narrator
          text: 从前在家时，每到睡觉的时间，梦幻岛也会显得阴森可怕。岛上没探察过的地方一块块冒出来，而且越扩越大。黑影在里面走动，猛兽的吼声听着也和平时完全不同。最要紧的是，你再也不敢肯定，最后赢的一定会是自己。
        - id: ch01-b53
          speaker: narrator
          text: 那时候，你真庆幸床边的小夜灯还亮着，也喜欢听娜娜安慰你，说这边不过是壁炉台，整个梦幻岛全是假装出来的。可那是从前。如今梦幻岛成了真的，这里没有一盏小夜灯，天还在一刻不停地变黑，而娜娜又在哪里呢？
        - id: ch01-b54
          speaker: narrator
          text: 刚才三个孩子还分开飞着，现在却立刻挤到彼得身边。彼得也终于收起那副满不在乎的样子，两只眼睛闪着光。谁碰到他的身体，谁就会浑身掠过一阵战栗。他们低低飞过可怕的小岛，低得连树梢有时都会擦过脚底。
        - id: ch01-b55
          speaker: narrator
          text: 空中明明看不见任何可怕的东西，他们却越飞越慢，越飞越吃力，像是在一群充满敌意的力量中间，硬挤出一条路。有时大家干脆被挡在半空，谁也动弹不了，彼得只得握紧两只拳头，朝周围的空气一阵猛打。
        - id: ch01-b56
          speaker: peter
          text: 是他们不肯让我们落下去。
        - id: ch01-b57
          speaker: wendy
          text: 彼得，他们是谁？
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: 彼得不肯回答，也可能连他都不知道。小叮一直睡在他的肩头，这会儿被叫醒，飞到前面探路。彼得自己也不时停在空中，一手搭在耳边，全神贯注地听着。接着，他又会低头盯住岛上。那双眼亮得像能在地上钻出两个洞。听过，也看过，他才继续往前飞。
        - id: ch01-b59
          speaker: narrator
          text: 彼得的勇气简直叫人害怕。他像谈论天气一样，随口问约翰。
        - id: ch01-b60
          speaker: peter
          text: 你想现在来一次冒险，还是先喝茶？
        - id: ch01-b61
          speaker: wendy
          text: 先喝茶！
        - id: ch01-b62
          speaker: narrator
          text: 迈克尔感激地握住温迪的手。约翰胆子大一点，可还是犹豫了。
        - id: ch01-b63
          speaker: john
          text: 先说说，会是什么冒险？
        - id: ch01-b64
          speaker: peter
          text: 我们下面的草原里，有个海盗正在睡觉。你愿意的话，咱们就下去杀掉他。
        - id: ch01-b65
          speaker: john
          text: 我没看见他。要是……要是他醒了呢？
        - id: ch01-b66
          speaker: peter
          text: 难道你以为，我会趁他睡着动手？我当然要先叫醒他，再杀掉他。我每次都这么办。
          emotion: angry
        - id: ch01-b67
          speaker: john
          text: 你杀过很多海盗吗？
        - id: ch01-b68
          speaker: peter
          text: 多得能论吨算。
        - id: ch01-b69
          speaker: narrator
          text: 约翰听完，嘴上大声夸道真带劲，最后却还是决定先喝茶。他接着问起岛上的海盗，想知道眼下是不是来了很多人。彼得回答说，他从前从来没有在岛上见过这么多海盗。
        - id: ch01-b70
          speaker: john
          text: 如今的船长是谁？
        - id: ch01-b71
          speaker: peter
          text: 现在的船长是胡克。
        - id: ch01-b72
          speaker: narrator
          text: 彼得一说出这个痛恨的名字，脸色就严峻起来。
        - id: ch01-b73
          speaker: john
          text: 你说的是詹姆斯·胡克？
        - id: ch01-b74
          speaker: peter
          text: 你说的正是他。
        - id: ch01-b75
          speaker: narrator
          text: 听到这个名字，迈克尔真的哭了起来。就连向来胆子更大的约翰也只能一面喘气，一面断断续续地说话。因为关于胡克的恶名，他们两个早就听说过了。
        - id: ch01-b76
          speaker: john
          text: 他从前是黑胡子的水手长。他是最坏的海盗。连烤肉叉都只怕他一个。
          emotion: fearful
        - id: ch01-b77
          speaker: peter
          text: 没错，就是这个人。
        - id: ch01-b78
          speaker: john
          text: 他长什么样？是不是很高大？
        - id: ch01-b79
          speaker: peter
          text: 他以前比现在大一点。
        - id: ch01-b80
          speaker: john
          text: 这话是什么意思？
        - id: ch01-b81
          speaker: peter
          text: 我从他身上砍掉了一小块。
        - id: ch01-b82
          speaker: john
          text: 是你砍的？
        - id: ch01-b83
          speaker: peter
          text: 对，就是我。
        - id: ch01-b84
          speaker: john
          text: 我不是故意对你不敬。不过，你砍的是哪一块？
        - id: ch01-b85
          speaker: peter
          text: 我砍掉的是他的右手。
        - id: ch01-b86
          speaker: john
          text: 那他现在没法打架了吧？难道他改用左手？
        - id: ch01-b87
          speaker: peter
          text: 他可太能打了！他的右手换成一只铁钩，专用那东西抓人。
        - id: ch01-b88
          speaker: john
          text: 用铁钩抓人！
          emotion: surprised
        - id: ch01-b89
          speaker: peter
          text: 约翰，回答我时，要说“是，船长”。
        - id: ch01-b90
          speaker: john
          text: 是，船长。
        - id: ch01-b91
          speaker: peter
          text: 每个跟随我的男孩都得答应一件事，你也得答应。要是正面交战时遇到胡克，必须把他留给我。
        - id: ch01-b92
          speaker: narrator
          text: 听见彼得要他作这样的保证，约翰的脸色一下变白了。可他没有退缩，仍旧忠心地答应下来。
        - id: ch01-b93
          speaker: john
          text: 我答应你。
        - id: ch01-b94
          speaker: narrator
          text: 小叮和他们一起飞，亮光让孩子们能看清彼此，四周便暂时没有那么阴森。她飞不了他们这样慢，只好绕着大家一圈圈转。孩子们就在那团光圈里向前移动，仿佛被一轮光环罩着。温迪还觉得挺美，直到彼得告诉他们，这光会带来危险。
        - id: ch01-b95
          speaker: peter
          text: 小叮说，天黑以前海盗就看见了我们。他们已经把长汤姆搬出来了。
        - id: ch01-b96
          speaker: john
          text: 就是那门大炮？
        - id: ch01-b97
          speaker: peter
          text: 对。海盗一定看得见她的光。只要猜到我们就在旁边，他们准会开炮。
        - id: ch01-b98
          speaker: wendy
          text: 约翰！
          emotion: fearful
        - id: ch01-b99
          speaker: john
          text: 迈克尔！
          emotion: fearful
        - id: ch01-b100
          speaker: michael
          text: 温迪！
          emotion: fearful
        - id: ch01-b101
          speakers: [wendy, john, michael]
          ensemble: chorus
          text: 彼得，快叫她离开我们！
          emotion: fearful
        - id: ch01-b102
          speaker: peter
          text: 她以为我们迷路了，又有点害怕。小叮正在害怕，我怎么能让她孤零零地走？
        - id: ch01-b103
          speaker: narrator
          text: 光环忽然缺了一小块。有什么东西亲昵地拧了彼得一下。
        - id: ch01-b104
          speaker: wendy
          text: 那你叫她把光熄掉，好不好？
        - id: ch01-b105
          speaker: peter
          text: 她做不到。仙子睡着后，光才会自己灭掉，就像星星一样。这差不多是她们唯一办不到的事。
        - id: ch01-b106
          speaker: john
          text: 那就叫她现在睡觉。
        - id: ch01-b107
          speaker: peter
          text: 她只有困了才能睡。这是仙子唯一办不到的另一件事。
        - id: ch01-b108
          speaker: john
          text: 可我觉得，值得做的偏偏只有这两件事。
        - id: ch01-b109
          speaker: narrator
          text: 约翰立刻也挨了一拧，这一下可一点儿也不亲昵。彼得说，只要四个人当中有谁带着口袋，就能把小叮装进去。可他们出门太匆忙，全身上下竟连一只口袋也找不到。幸好彼得突然有了个好主意，那就是约翰的帽子。
        - id: ch01-b110
          speaker: narrator
          text: 小叮同意坐进帽子里，条件是必须有人把帽子拿在手上。约翰先拿了一阵，虽然小叮原本希望拿帽子的是彼得。后来约翰抱怨，飞起来时帽子总撞他的膝盖，温迪便接了过去。麻烦正是这样来的，因为小叮最恨欠温迪的人情。
        - id: ch01-b111
          speaker: narrator
          text: 黑色高顶礼帽把亮光遮得严严实实。他们默默地飞着，从没遇过这么深的寂静。只有远处偶尔传来一阵水声，打破了沉默。彼得说，那是野兽在浅滩喝水。后来又响起刺耳的摩擦声，听着像两根树枝在相互刮擦，可彼得说，那是印第安人在磨刀。
        - id: ch01-b112
          speaker: narrator
          text: 最后，连这些声音都停了。迈克尔再也忍不住这份孤寂。
        - id: ch01-b113
          speaker: michael
          text: 哪怕有什么东西响一下也好呀！
        - id: ch01-b114
          speaker: narrator
          text: 仿佛真在回应他的请求，空中突然炸开一声惊天动地的巨响。这是迈克尔一辈子听过最响的声音。海盗朝他们开动了长汤姆，那门大炮正对着他们吼叫。
        - id: ch01-b115
          speaker: narrator
          text: 炮声撞过群山，一层层回音传回来，听上去像在凶狠地追问，他们在哪里，他们在哪里，他们究竟在哪里。三个吓坏的孩子就这样猛然懂得，想象中的小岛和同一座变成真的小岛，完全不是一回事。
        - id: ch01-b116
          speaker: narrator
          text: 天空终于稳下来时，黑暗里只剩下约翰和迈克尔。约翰还在不由自主地踩着空气。迈克尔明明不会浮，却也悬在那里。
        - id: ch01-b117
          speaker: john
          text: 迈克尔，你中弹了吗？
          emotion: fearful
        - id: ch01-b118
          speaker: michael
          text: 我还没有试过呢。
        - id: ch01-b119
          speaker: narrator
          text: 现在我们知道，其实谁也没有中弹。可是炮弹掀起的狂风把彼得远远吹向大海，又把温迪一直吹到高空。陪着温迪的，只有藏在帽子里的小叮当。就在那个时候，她要是把帽子扔掉，反倒是一件好事。
        - id: ch01-b120
          speaker: narrator
          text: 谁也不知道，这个坏念头是小叮刚刚才冒出来的，还是她在一路上早已有了打算。总之，她立刻从那顶黑帽子里钻出来，飞到温迪面前，开始一步步把她引向毁灭。
        - id: ch01-b121
          speaker: narrator
          text: 小叮并不是永远都坏。更准确地说，她此刻坏到了底，可换到另一些时候，她又会完完全全地好起来。仙子的身体实在太小了，不幸一次只能容下一种感情，所以不是全好，就是全坏。她们当然也能改变，只是一变，就非得彻底变成另一种样子。
        - id: ch01-b122
          speaker: narrator
          text: 眼下，小叮心里装的全是对温迪的嫉妒。她用悦耳的叮当声说着话，温迪当然一个字也听不懂。其中有些大概是在骂人，可那些铃声听来却十分亲切。小叮在她面前来来回回地飞，分明是要温迪跟上自己，还让温迪相信，只要跟着她，一切都会平安无事。
        - id: ch01-b123
          speaker: narrator
          text: 可怜的温迪还能怎样呢？她大声呼唤彼得、约翰和迈克尔，可回答她的只有一声声嘲弄人的回音。她还不知道，小叮正怀着一个女人才会有的炽烈仇恨，狠狠地恨着她。于是温迪又困惑又无助，还是跟了上去。她已经飞得摇摇晃晃，却仍随着小叮，一步一步飞向自己的厄运。
