audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently playful
        timbre: clear and story-rich
        pace: measured
        pitch: medium
    wendy:
      display_name: Wendy
      tts:
        delivery: thoughtful, practical, and naturally confident
        timbre: bright and youthful
        pace: easy
        pitch: high
    john:
      display_name: John
      tts:
        delivery: proper, lively, and eager to sound grown-up
        timbre: clear and boyish
        pace: brisk
        pitch: high
    michael:
      display_name: Michael
      tts:
        delivery: young, direct, and openly emotional
        timbre: soft and childlike
        pace: quick
        pitch: high
    peter:
      display_name: Peter Pan
      tts:
        delivery: daring, playful, and proudly matter-of-fact
        timbre: bright and boyish
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Second to the Right
      blocks:
        - id: ch01-b01
          speaker: peter
          text: "Second to the right, and straight on till morning."
        - id: ch01-b02
          speaker: narrator
          text: >-
            That was how Peter had told Wendy to reach the Neverland. But even birds with maps, stopping at windy corners to check their route, could never have found it from those directions. Peter simply said whatever came into his head.

            At first, the children trusted him completely. Flying was so wonderful that they spent their time circling church spires and any other tall thing that caught their fancy. John and Michael held races, with Michael getting a head start. They remembered how proud they had once been just to fly around the nursery, and the thought seemed ridiculous now.

            But how long ago had that been? By the time the question truly troubled Wendy, they were already above the sea. John believed it was the second sea they had crossed and their third night in the air.

            Darkness came, then daylight, over and over. One hour they shivered with cold, and the next they were much too warm. Sometimes they felt hungry. Or perhaps they only imagined it because Peter had such an exciting way of feeding them. He searched for birds carrying food that people could eat, chased them through the sky, and snatched it right out of their beaks. Then the birds chased Peter and took it back. The whole company might race happily for miles before they finally separated with friendly cries on both sides. Wendy gently worried that Peter found none of this strange. He did not even seem to know there were other ways to get bread and butter.

            Their sleepiness, however, was real. It was dangerous, too. The instant one of them nodded off, down that child fell. Worst of all, Peter thought it was funny.
        - id: ch01-b03
          speaker: peter
          text: "There he goes again!"
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: >-
            Michael had dropped like a stone.
        - id: ch01-b05
          speaker: wendy
          text: "Peter, save him! Please save him!"
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: >-
            Wendy stared in horror at the cruel sea far below. At last Peter shot downward through the air and caught Michael just before he struck the water. The rescue was beautiful to watch, but Peter always waited until the final moment. It seemed to be his own cleverness that thrilled him, not the saving of a life. Peter also loved variety. A game could completely absorb him one minute and mean nothing to him the next. There was always a chance that when someone fell again, he would simply lose interest and let that child go.

            Peter himself could sleep in the air. He only had to lie on his back and float. That was partly because he weighed so little that a puff from behind made him move faster.
    - id: ch02
      title: Follow My Leader
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One day, while they were playing Follow My Leader, Wendy leaned close to John.
        - id: ch02-b02
          speaker: wendy
          text: "Please try to be nicer to Peter."
        - id: ch02-b03
          speaker: john
          text: "Then he should quit showing off."
        - id: ch02-b04
          speaker: narrator
          text: >-
            Peter was skimming just above the water and touching each shark's tail as he passed, the way you might trail a finger along an iron fence. The others could not copy him very well. It did look rather like showing off, especially when he kept glancing back to count all the tails they had missed.
        - id: ch02-b05
          speaker: wendy
          text: "You boys have to be nice to him. What would we do if he left us?"
        - id: ch02-b06
          speaker: michael
          text: "We could go home."
        - id: ch02-b07
          speaker: wendy
          text: "But without Peter, how would we find the way?"
        - id: ch02-b08
          speaker: john
          text: "Then we'd keep going."
        - id: ch02-b09
          speaker: wendy
          text: "That's exactly what's so awful. We'd have to keep going. We don't know how to stop."
        - id: ch02-b10
          speaker: narrator
          text: >-
            It was true. Peter had forgotten to teach them how to stop. John said that if the worst happened, they could fly straight ahead. The world was round, so sooner or later they would return to their own window.
        - id: ch02-b11
          speaker: wendy
          text: "And where would we get food, John?"
        - id: ch02-b12
          speaker: john
          text: "I took a bite from that eagle's beak rather neatly."
        - id: ch02-b13
          speaker: wendy
          text: "On your twentieth try. And even if we learned to catch food, look how we crash into clouds and things whenever Peter isn't here to help."
        - id: ch02-b14
          speaker: narrator
          text: >-
            They did keep crashing into things. They had grown into strong fliers, though their legs still kicked much too hard. Whenever a cloud appeared ahead, they struggled to turn away from it. Somehow, the harder they tried to miss it, the more surely they flew straight into it. Peter could give them a hand when he was near. Without him, they bumped along helplessly. If Nana had been there, Michael would already have had a bandage wrapped around his forehead.

            Just then Peter was nowhere near them, and the children felt very lonely in the wide sky. He could fly so much faster than they could. Without warning, he often shot out of sight to have an adventure in which they had no part at all. He might come swooping back, laughing about something terribly funny he had said to a star, only to discover he had already forgotten what it was. Or he might rise from the sea with mermaid scales still clinging to him, yet be unable to say exactly what had happened. This was especially annoying to children who had never seen a mermaid for themselves.
        - id: ch02-b15
          speaker: wendy
          text: "If he forgets those adventures so fast, how can we trust him to remember us?"
        - id: ch02-b16
          speaker: narrator
          text: >-
            Sometimes Peter returned and barely did remember them. Wendy was certain of it. More than once, she saw recognition enter his eyes just as he was about to greet them like strangers and fly on. One time she even had to call out his name.
        - id: ch02-b17
          speaker: wendy
          text: "Peter, it's me. I'm Wendy!"
        - id: ch02-b18
          speaker: narrator
          text: >-
            Peter was very sorry.
        - id: ch02-b19
          speaker: peter
          text: "Listen, Wendy. Whenever I start forgetting you, just keep saying, 'I'm Wendy.' Then I'll remember."
        - id: ch02-b20
          speaker: narrator
          text: >-
            That answer was not very comforting. Still, Peter tried to make it up to them. He found a strong wind moving in the same direction they were going and taught the children to stretch out flat upon it. Floating there was a wonderfully pleasant change after all their hard flying. They tried it again and again, and soon discovered that the wind could carry them while they slept in perfect safety.

            They might have slept much longer, but Peter quickly tired of sleeping. Soon his captain's voice rang out.
        - id: ch02-b21
          speaker: peter
          text: "Everybody off here!"
        - id: ch02-b22
          speaker: narrator
          text: >-
            So they flew on, with a few quarrels but mostly in high spirits. After many moons, they finally drew close to the Neverland. They had traveled in a surprisingly straight line, though perhaps that was not because Peter or Tinker Bell had guided them. Perhaps the island itself had been searching for them. That is the only way anyone ever finds those magic shores.
    - id: ch03
      title: The Island Finds Them
      blocks:
        - id: ch03-b01
          speaker: peter
          text: "There it is."
        - id: ch03-b02
          speakers: [wendy, john, michael]
          ensemble: chorus
          text: "Where? Where is it?"
        - id: ch03-b03
          speaker: peter
          text: "Right where all those arrows point."
        - id: ch03-b04
          speaker: narrator
          text: >-
            A million golden arrows pointed toward the island. Their friend the sun was directing every one of them, so the children would be sure of the way before he left them for the night.

            Wendy, John, and Michael stood on tiptoe in the air for their first glimpse. And there was a strange thing. All three recognized the island at once. Before fear reached them, they welcomed it like an old friend. It did not feel like a dream they had finally found. It felt like a place they were coming back to for the holidays.
        - id: ch03-b05
          speaker: wendy
          text: "John, there's the lagoon!"
        - id: ch03-b06
          speaker: john
          text: "Wendy, look! The turtles are burying their eggs in the sand."
        - id: ch03-b07
          speaker: michael
          text: "John, I can see your flamingo, the one with the broken leg!"
        - id: ch03-b08
          speaker: wendy
          text: "And Michael, there's your cave!"
        - id: ch03-b09
          speaker: michael
          text: "John, what's hiding in those bushes?"
        - id: ch03-b10
          speaker: john
          text: "A mother wolf and her pups. Wendy, I think that little one is yours!"
        - id: ch03-b11
          speaker: michael
          text: "There's my boat, John! The sides are all smashed in."
        - id: ch03-b12
          speaker: john
          text: "That can't be yours. We burned your boat."
        - id: ch03-b13
          speaker: michael
          text: "It is mine! And look, I can see smoke from the redskin camp!"
        - id: ch03-b14
          speaker: john
          text: "Where? Show me. I can tell from the curling smoke if they're on the warpath."
        - id: ch03-b15
          speaker: michael
          text: "Over there, across the Mysterious River."
        - id: ch03-b16
          speaker: john
          text: "Now I see it. Yes, they're on the warpath, all right."
        - id: ch03-b17
          speaker: narrator
          text: >-
            Peter was a little annoyed to hear them naming so much of his island without any help from him. But if he wanted a chance to rule over them, it came soon enough. The golden arrows disappeared with the sun, the island sank into gloom, and fear arrived with the darkness.

            Back at home, the Neverland had always grown a little dark and threatening near bedtime. Unexplored places seemed to appear and spread across it. Black shadows moved inside them, and the roars of the hunting beasts no longer sounded quite the same. Worst of all, the children lost their comfortable certainty that they would win. Then they were glad to see the night-lights glowing. They even liked hearing Nana point to the mantelpiece and remind them that the Neverland was only make-believe.

            It had been make-believe then. Now it was real. There were no night-lights, the sky grew darker each moment, and Nana was nowhere near them.
    - id: ch04
      title: Over the Fearsome Island
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Until then, the children had been flying some distance apart. Now all three crowded close to Peter. His careless manner had vanished at last. His eyes shone brightly in the dark, and whenever one of them touched him, a tingling feeling ran straight through that child.

            They were over the fearsome island now, flying so low that the top of a tree sometimes brushed their feet. Nothing terrible could be seen in the air. Even so, every yard became slow and difficult, as if unseen enemies were pushing against them and trying to force them back. At times the children hung there without moving at all. Then Peter had to beat the empty air with his fists before they could go on.
        - id: ch04-b02
          speaker: peter
          text: "They don't want us to land."
        - id: ch04-b03
          speaker: wendy
          text: "Who doesn't?"
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: >-
            Peter could not, or would not, answer. Tinker Bell had been asleep on his shoulder. He woke her and sent her ahead.

            Again and again, Peter balanced motionless in the air. He cupped one hand around his ear and listened with all his attention. At other times he stared down so fiercely that his bright eyes seemed ready to burn two holes through the earth. When he had finished listening and looking, he led them onward once more.

            His courage was almost frightening.
        - id: ch04-b05
          speaker: peter
          text: "John, do you want an adventure now, or should we have tea first?"
        - id: ch04-b06
          speaker: narrator
          text: >-
            Wendy answered at once, and Michael squeezed her hand gratefully. John, who wanted to be braver, paused.
        - id: ch04-b07
          speaker: wendy
          text: "Tea first."
        - id: ch04-b08
          speaker: john
          text: "What sort of adventure?"
        - id: ch04-b09
          speaker: peter
          text: "There's a pirate sleeping in the grass below us. We can fly down and kill him, if you like."
        - id: ch04-b10
          speaker: narrator
          text: >-
            John looked for a long time.
        - id: ch04-b11
          speaker: john
          text: "I can't see any pirate."
        - id: ch04-b12
          speaker: peter
          text: "I can."
        - id: ch04-b13
          speaker: john
          text: "But what if he wakes up?"
        - id: ch04-b14
          speaker: narrator
          text: >-
            John's voice had grown a little rough. Peter was offended by the question.
        - id: ch04-b15
          speaker: peter
          text: "You don't think I'd kill him in his sleep, do you? I'd wake him up first. Then I'd kill him. That's how I always do it."
          emotion: angry
        - id: ch04-b16
          speaker: john
          text: "Really? Have you killed very many?"
        - id: ch04-b17
          speaker: peter
          text: "Tons of them."
        - id: ch04-b18
          speaker: narrator
          text: >-
            John called that splendid, but chose tea before adventure. Then he asked whether there were many pirates on the island. Peter said he had never seen so many.
    - id: ch05
      title: Hook and Long Tom
      blocks:
        - id: ch05-b01
          speaker: john
          text: "Who's their captain now?"
        - id: ch05-b02
          speaker: peter
          text: "Hook."
        - id: ch05-b03
          speaker: narrator
          text: >-
            Peter's face turned stern at the name he hated.
        - id: ch05-b04
          speaker: john
          text: "James Hook?"
        - id: ch05-b05
          speaker: peter
          text: "Aye."
        - id: ch05-b06
          speaker: narrator
          text: >-
            Michael began to cry. Even John could only speak in little gulps. Both boys knew Hook's terrible reputation.
        - id: ch05-b07
          speaker: john
          text: "He served under Blackbeard. He's the worst pirate of them all. Even Barbecue was afraid of him."
          emotion: fearful
        - id: ch05-b08
          speaker: peter
          text: "That's the one."
        - id: ch05-b09
          speaker: john
          text: "What does he look like? Is he big?"
        - id: ch05-b10
          speaker: peter
          text: "Not as big as he used to be."
        - id: ch05-b11
          speaker: john
          text: "What do you mean?"
        - id: ch05-b12
          speaker: peter
          text: "I cut off part of him."
        - id: ch05-b13
          speaker: john
          text: "You did?"
          emotion: surprised
        - id: ch05-b14
          speaker: peter
          text: "Yes, I did."
        - id: ch05-b15
          speaker: narrator
          text: >-
            Peter answered sharply.
        - id: ch05-b16
          speaker: john
          text: "I didn't mean any disrespect."
        - id: ch05-b17
          speaker: peter
          text: "All right, then."
        - id: ch05-b18
          speaker: john
          text: "But which part did you cut off?"
        - id: ch05-b19
          speaker: peter
          text: "His right hand."
        - id: ch05-b20
          speaker: john
          text: "Then he can't fight anymore, can he?"
        - id: ch05-b21
          speaker: peter
          text: "Oh, yes he can!"
        - id: ch05-b22
          speaker: john
          text: "Does he fight with his left hand?"
        - id: ch05-b23
          speaker: peter
          text: "He has an iron hook where his right hand was, and he uses it like a claw."
        - id: ch05-b24
          speaker: john
          text: "A claw?"
          emotion: surprised
        - id: ch05-b25
          speaker: peter
          text: "John."
        - id: ch05-b26
          speaker: john
          text: "Yes?"
        - id: ch05-b27
          speaker: peter
          text: "You're supposed to say, 'Aye, aye, sir.'"
        - id: ch05-b28
          speaker: john
          text: "Aye, aye, sir."
        - id: ch05-b29
          speaker: peter
          text: "Every boy who serves under me has to make one promise. You must make it too."
        - id: ch05-b30
          speaker: narrator
          text: >-
            John went pale.
        - id: ch05-b31
          speaker: peter
          text: "If we meet Hook in a fair fight, you have to leave him to me."
        - id: ch05-b32
          speaker: john
          text: "I promise."
        - id: ch05-b33
          speaker: narrator
          text: >-
            John gave his word loyally.

            For the moment, the island felt less frightening. Tinker Bell was flying beside them, and her light let them see one another. But she could not fly as slowly as the children. She had to circle them again and again, wrapping them in a moving halo. Wendy rather liked it, until Peter explained why it was dangerous.
        - id: ch05-b34
          speaker: peter
          text: "Tink says the pirates spotted us before dark. They've brought out Long Tom."
        - id: ch05-b35
          speaker: wendy
          text: "You mean the big gun?"
        - id: ch05-b36
          speaker: peter
          text: "Yes. They can see her light. If they guess we're flying beside it, they'll fire at us for certain."
