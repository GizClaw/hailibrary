  chapters:
    - id: ch01
      title: The Shadow in the Drawer
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After Mr. and Mrs. Darling left the house, the three little night-lights beside the children's beds kept burning for a while. They were dear little lights. You almost wish they could have stayed awake long enough to see Peter. But Wendy's light blinked and yawned. The other two yawned with it, and before any of them could close their mouths, all three went out.

            Then another light flashed through the nursery, a thousand times brighter. In no time it had searched every drawer for Peter's shadow, rummaged through the wardrobe, and turned all the pockets inside out. It wasn't truly a light. It only shone because it moved so fast. Whenever it rested, you could see a fairy no longer than your hand, though she was still growing. Her name was Tinker Bell. She wore a beautiful dress made from a skeleton leaf, cut low and square, and she was just a little plump.

            A moment later, the breathing of the little stars blew the window open, and Peter dropped inside. He had carried Tinker Bell part of the way, and fairy dust still covered his hand. He checked that the children were sleeping.
        - id: ch01-b02
          speaker: peter
          text: "Tinker Bell? Tink, where are you?"
        - id: ch01-b03
          speaker: narrator
          text: >-
            Just then, Tink was inside a jug and enjoying it very much. She had never been in one before.
        - id: ch01-b04
          speaker: peter
          text: "Oh, come out of that jug. Do you know where they put my shadow?"
        - id: ch01-b05
          speaker: narrator
          text: >-
            The loveliest sound of golden bells answered him. That was fairy language. Ordinary children can never hear it. Yet if you ever did hear it, you would know at once that you had heard it before. Peter listened to the bells and understood every word.

            Tink told Peter the shadow was in the big box. She meant the chest of drawers. Peter sprang at it and tossed everything onto the floor with both hands, like a king throwing coins to a crowd. In a moment he had his shadow back. He was so delighted that he forgot he had shut Tinker Bell inside the drawer.

            If Peter thought at all, and I don't believe he ever did, he expected his shadow to join him as soon as the two touched, like drops of water. He laid it against himself and waited. Nothing happened. He tried again, but the shadow would not become part of him. Peter was horrified. He fetched soap from the bathroom, rubbed it on, and tried to make the shadow stick that way. The soap failed too. A shiver ran through him. With no other plan left, he sat down on the nursery floor and cried.
    - id: ch02
      title: Wendy Sews on the Shadow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter's sobs woke Wendy. She sat up and saw a strange boy crying on the nursery floor. She wasn't frightened. She was pleasantly curious.
        - id: ch02-b02
          speaker: wendy
          text: "Boy, why are you crying?"
        - id: ch02-b03
          speaker: narrator
          text: >-
            Peter could be extremely polite. He had learned grand manners at fairy ceremonies, so he stood and gave her a beautiful bow. Wendy was delighted and bowed just as beautifully from her bed.
        - id: ch02-b04
          speaker: peter
          text: "What's your name?"
        - id: ch02-b05
          speaker: wendy
          text: "Wendy Moira Angela Darling. And what's yours?"
        - id: ch02-b06
          speaker: peter
          text: "Peter Pan."
        - id: ch02-b07
          speaker: narrator
          text: >-
            Wendy had already guessed who he was, but his name seemed very short beside hers.
        - id: ch02-b08
          speaker: wendy
          text: "Is that your whole name?"
        - id: ch02-b09
          speaker: peter
          text: "Yes, it is."
        - id: ch02-b10
          speaker: narrator
          text: >-
            He answered sharply. For the first time, it occurred to him that his name might be rather short.
        - id: ch02-b11
          speaker: wendy
          text: "Oh. I'm so sorry."
        - id: ch02-b12
          speaker: peter
          text: "It doesn't matter."
        - id: ch02-b13
          speaker: narrator
          text: "Wendy asked where he lived."
        - id: ch02-b14
          speaker: peter
          text: "Second to the right, then straight on till morning."
        - id: ch02-b15
          speaker: wendy
          text: "What a funny address! I mean, is that what they write on your letters?"
        - id: ch02-b16
          speaker: narrator
          text: >-
            Peter's heart sank. Perhaps it was a funny address after all. He wished she had never brought up letters.
        - id: ch02-b17
          speaker: peter
          text: "It isn't funny. And I don't get letters."
        - id: ch02-b18
          speaker: wendy
          text: "But doesn't your mother get them?"
        - id: ch02-b19
          speaker: peter
          text: "I don't have a mother."
        - id: ch02-b20
          speaker: narrator
          text: >-
            Peter had no mother and did not want one. He thought mothers were greatly overrated. Wendy, however, felt sure she was standing in the middle of a tragedy. She jumped from bed and ran to him. Peter indignantly insisted that mothers had nothing to do with his tears. What troubled him was the shadow on the floor, though he also denied that he had cried at all.
        - id: ch02-b21
          speaker: wendy
          text: "Oh, Peter! No wonder you were crying."
          emotion: sad
        - id: ch02-b22
          speaker: peter
          text: "I wasn't crying about mothers. My shadow won't stick on. And anyway, I wasn't crying."
        - id: ch02-b23
          speaker: wendy
          text: "Your shadow came off?"
        - id: ch02-b24
          speaker: peter
          text: "Yes."
        - id: ch02-b25
          speaker: narrator
          text: >-
            Wendy saw the poor, bedraggled shadow lying on the floor and felt terribly sorry for Peter. His trouble was real, even if he refused to admit the tears. Then she noticed the soap and understood what he had been trying to do. She couldn't help smiling. It was exactly the sort of thing a boy would try. Fortunately, Wendy knew at once what the shadow needed.
        - id: ch02-b26
          speaker: wendy
          text: "How awful! It needs to be sewn back on."
        - id: ch02-b27
          speaker: peter
          text: "What's sewn?"
        - id: ch02-b28
          speaker: wendy
          text: "You really don't know anything, do you? Never mind. I'll sew it on for you, my little man."
        - id: ch02-b29
          speaker: narrator
          text: >-
            Peter was as tall as Wendy, but she enjoyed knowing something he did not. She took out her sewing kit and stitched the shadow onto his foot.
        - id: ch02-b30
          speaker: wendy
          text: "This may hurt a little."
        - id: ch02-b31
          speaker: peter
          text: "I won't cry."
        - id: ch02-b32
          speaker: narrator
          text: >-
            By then Peter had decided he had never cried in his life. He clenched his teeth while Wendy worked and kept his word. Soon the shadow was fastened to his foot and behaving properly again. It was still a little creased from being folded away in the drawer, but at least it followed him as a shadow should.
        - id: ch02-b33
          speaker: wendy
          text: "Maybe I should have ironed it."
        - id: ch02-b34
          speaker: narrator
          text: >-
            Peter did not care how it looked. The moment his shadow moved properly, he leaped around the nursery in wild delight. He had already forgotten the needle in Wendy's hand and all the careful stitches she had made. He forgot that he owed his happiness to her at all. In his mind, he had fixed the shadow entirely by himself, and now he could think of nothing but his own cleverness.
        - id: ch02-b35
          speaker: peter
          text: "How clever I am! Oh, the cleverness of me!"
          emotion: happy
        - id: ch02-b36
          speaker: narrator
          text: >-
            It is embarrassing to admit that Peter's conceit was one of his most charming qualities. To put it plainly, no boy was ever cockier.
        - id: ch02-b37
          speaker: wendy
          text: "You conceited thing! Of course I did absolutely nothing."
          emotion: angry
        - id: ch02-b38
          speaker: peter
          text: "You did a little."
        - id: ch02-b39
          speaker: narrator
          text: "He kept dancing."
        - id: ch02-b40
          speaker: wendy
          text: "A little? If I'm no use here, I can leave."
        - id: ch02-b41
          speaker: narrator
          text: >-
            With great dignity, Wendy climbed into bed and hid her face under the blankets. Peter pretended to leave, hoping she would look up and stop him. When that failed, he sat at the foot of the bed and gently tapped her with his foot. Wendy kept her face hidden, but she was listening eagerly to every word.
        - id: ch02-b42
          speaker: peter
          text: >-
            Wendy, don't leave. I can't help crowing when I'm pleased with myself. Wendy, one girl is worth more than twenty boys.
        - id: ch02-b43
          speaker: narrator
          text: "Wendy listened eagerly, then peeked out from under the covers."
        - id: ch02-b44
          speaker: wendy
          text: "Do you truly think so, Peter?"
        - id: ch02-b45
          speaker: peter
          text: "Yes, I do."
        - id: ch02-b46
          speaker: wendy
          text: "That's perfectly sweet of you. I'll get up again."
        - id: ch02-b47
          speaker: narrator
          text: "She sat beside him on the bed and offered him a kiss. Peter held out his hand, waiting."
    - id: ch03
      title: Kisses and Fairies
      blocks:
        - id: ch03-b01
          speaker: wendy
          text: "Surely you know what a kiss is?"
        - id: ch03-b02
          speaker: peter
          text: "I'll know when you give me one."
        - id: ch03-b03
          speaker: narrator
          text: >-
            Wendy did not want to hurt his feelings, so she placed a thimble in his hand.
        - id: ch03-b04
          speaker: peter
          text: "Should I give you a kiss now?"
        - id: ch03-b05
          speaker: wendy
          text: "If you please."
        - id: ch03-b06
          speaker: narrator
          text: >-
            She tilted her face toward him, making it quite easy for him to kiss her. Peter only dropped an acorn button into her open palm. Wendy slowly returned her face to where it had been. She did not embarrass him or explain his mistake. Instead, she politely said she would wear his kiss on the chain around her neck. She put it there, and it was lucky she did, because one day that acorn button would save her life.

            Wendy liked to follow proper manners, and people in her circle asked one another's ages when they met. So she asked Peter his. It was an unhappy question for him, like getting grammar on an examination when you hoped for the Kings of England.
        - id: ch03-b07
          speaker: peter
          text: "I don't know. I am quite young. Wendy, I ran away on the day I was born."
        - id: ch03-b08
          speaker: narrator
          text: >-
            Wendy was amazed and very interested. With a graceful little touch on her nightgown, she invited him to sit closer.
        - id: ch03-b09
          speaker: peter
          text: >-
            I heard my father and mother talking about what I would be when I grew up. I don't ever want to be a man. I want to stay a little boy and have fun forever. So I ran away to Kensington Gardens and lived with the fairies for a long, long time.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Peter was deeply upset as he spoke. Wendy looked at him with intense admiration. He thought she admired his escape, but what thrilled her was that he knew fairies. Her life had been so sheltered that this seemed wonderful. She poured out questions. Peter found fairies troublesome when they got in his way, and sometimes he had to give them a hiding. Still, on the whole, he liked them.
        - id: ch03-b11
          speaker: peter
          text: >-
            When the very first baby laughed for the very first time, the laugh broke into a thousand pieces. They all went skipping away, and that was the beginning of fairies. So there ought to be one fairy for every boy and girl.
        - id: ch03-b12
          speaker: wendy
          text: "Ought to be? Isn't there?"
        - id: ch03-b13
          speaker: peter
          text: >-
            No. Children know so much now that they soon stop believing. Every time a child says, “I don't believe in fairies,” a fairy somewhere falls down dead.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Peter had had enough fairy talk. Then he noticed how quiet Tinker Bell had become.
        - id: ch03-b15
          speaker: peter
          text: "I wonder where she's gone. Tink! Tinker Bell!"
        - id: ch03-b16
          speaker: wendy
          text: "Peter, do you mean there's a real fairy in this room?"
          emotion: surprised
        - id: ch03-b17
          speaker: peter
          text: "She was here a moment ago. Can you hear her?"
        - id: ch03-b18
          speaker: wendy
          text: "All I hear is a sound like little bells."
        - id: ch03-b19
          speaker: peter
          text: "That's Tink. Bells are fairy language. Yes, I hear her too."
        - id: ch03-b20
          speaker: narrator
          text: >-
            They both listened carefully. The tiny bell sound came from the chest of drawers. Then Peter remembered what he had done, and his face turned merry. No one could look as merry as Peter. His laugh came out in the loveliest bubbling gurgle because he still had his very first laugh.
        - id: ch03-b21
          speaker: peter
          text: "Wendy, I think I shut her in the drawer!"
          emotion: happy
        - id: ch03-b22
          speaker: narrator
          text: "Peter let her out. Tink flew around the nursery, screaming furiously."
        - id: ch03-b23
          speaker: peter
          text: "You shouldn't say things like that. I'm sorry, but how was I supposed to know you were in there?"
        - id: ch03-b24
          speaker: wendy
          text: "Oh, Peter, if only she'd stay still so I could see her!"
        - id: ch03-b25
          speaker: peter
          text: "Fairies almost never stay still."
        - id: ch03-b26
          speaker: narrator
          text: >-
            For one moment, Tink rested on the cuckoo clock, and Wendy saw her lovely little figure. Tink's face was still twisted with anger.
        - id: ch03-b27
          speaker: wendy
          text: "Oh, she's beautiful!"
        - id: ch03-b28
          speaker: peter
          text: "Tink, this lady says she'd like you to be her fairy."
        - id: ch03-b29
          speaker: narrator
          text: "Tinker Bell gave an insolent answer."
        - id: ch03-b30
          speaker: wendy
          text: "What did she say?"
        - id: ch03-b31
          speaker: peter
          text: "It wasn't polite. She says you're a big ugly girl, and she's my fairy."
        - id: ch03-b32
          speaker: peter
          text: "You can't be my fairy, Tink. I'm a gentleman, and you're a lady."
        - id: ch03-b33
          speaker: tinker_bell
          text: "You silly ass."
          emotion: angry
        - id: ch03-b34
          speaker: narrator
          text: "Tink vanished into the bathroom."
        - id: ch03-b35
          speaker: peter
          text: "She's a common sort of fairy. She's called Tinker Bell because she fixes pots and kettles."
    - id: ch04
      title: An Invitation to Neverland
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "By now Peter and Wendy were sharing the armchair, and Wendy kept asking questions."
        - id: ch04-b02
          speaker: wendy
          text: "If you don't live in Kensington Gardens now—"
        - id: ch04-b03
          speaker: peter
          text: "I still do sometimes."
        - id: ch04-b04
          speaker: wendy
          text: "Then where do you live most of the time?"
        - id: ch04-b05
          speaker: peter
          text: "With the lost boys."
        - id: ch04-b06
          speaker: wendy
          text: "Who are they?"
        - id: ch04-b07
          speaker: peter
          text: "Children who fall out of their baby carriages while their nurses look away. If nobody claims them in seven days, they're sent far off to the Neverland to save expenses. I'm their captain."
        - id: ch04-b08
          speaker: wendy
          text: "That must be wonderful!"
        - id: ch04-b09
          speaker: peter
          text: "Yes, but we're lonely. We don't have any girls with us."
        - id: ch04-b10
          speaker: wendy
          text: "There aren't any girls at all?"
        - id: ch04-b11
          speaker: peter
          text: "No. Girls are much too clever to fall out of their carriages."
        - id: ch04-b12
          speaker: narrator
          text: "Wendy was enormously flattered."
        - id: ch04-b13
          speaker: wendy
          text: "I love the way you speak about girls. John over there thinks we're no good."
        - id: ch04-b14
          speaker: narrator
          text: >-
            Peter answered by kicking John out of bed, blankets and all. Wendy thought that was rather bold for a first visit and sharply reminded Peter that he was not captain in her house. John slept so peacefully on the floor that she let him stay there.
        - id: ch04-b15
          speaker: wendy
          text: "I know you meant to be kind, so you may give me a kiss."
        - id: ch04-b16
          speaker: peter
          text: "I thought you'd want it back."
        - id: ch04-b17
          speaker: narrator
          text: "He bitterly offered to return her thimble."
        - id: ch04-b18
          speaker: wendy
          text: "Oh, dear. I don't mean a kiss. I mean a thimble."
        - id: ch04-b19
          speaker: peter
          text: "What's a thimble?"
        - id: ch04-b20
          speaker: wendy
          text: "It's this."
        - id: ch04-b21
          speaker: narrator
          text: "She kissed him."
        - id: ch04-b22
          speaker: peter
          text: "Funny! Shall I give you a thimble now?"
        - id: ch04-b23
          speaker: wendy
          text: "If you want to."
        - id: ch04-b24
          speaker: narrator
          text: "This time Wendy kept her chin up. Peter thimbled her, and she immediately shrieked."
        - id: ch04-b25
          speaker: peter
          text: "What's wrong, Wendy?"
        - id: ch04-b26
          speaker: wendy
          text: "It felt exactly as if someone pulled my hair!"
          emotion: surprised
        - id: ch04-b27
          speaker: peter
          text: "That was Tink. I've never seen her behave so badly."
        - id: ch04-b28
          speaker: narrator
          text: "Tink darted around them, shouting rude things."
        - id: ch04-b29
          speaker: peter
          text: "She says she'll pull your hair every time I give you a thimble."
        - id: ch04-b30
          speaker: wendy
          text: "But why?"
        - id: ch04-b31
          speaker: peter
          text: "Why, Tink?"
        - id: ch04-b32
          speaker: tinker_bell
          text: "You silly ass."
          emotion: angry
        - id: ch04-b33
          speaker: narrator
          text: >-
            Peter could not understand her. Wendy could, and she was a little disappointed when Peter admitted he came to the nursery window for stories, not for her.
        - id: ch04-b34
          speaker: peter
          text: "I don't know any stories, and neither do the lost boys."
        - id: ch04-b35
          speaker: wendy
          text: "That's perfectly awful."
        - id: ch04-b36
          speaker: peter
          text: "Do you know why swallows build nests under people's roofs? They want to hear the stories. Your mother was telling such a good one."
        - id: ch04-b37
          speaker: wendy
          text: "Which one?"
        - id: ch04-b38
          speaker: peter
          text: "The story about the prince searching for the lady who wore the glass slipper."
        - id: ch04-b39
          speaker: wendy
          text: "That's Cinderella! He found her, and they lived happily ever after."
          emotion: happy
        - id: ch04-b40
          speaker: narrator
          text: "Peter was so delighted that he jumped up and hurried toward the window."
        - id: ch04-b41
          speaker: wendy
          text: "Where are you going?"
        - id: ch04-b42
          speaker: peter
          text: "To tell the boys."
        - id: ch04-b43
          speaker: wendy
          text: "Don't go, Peter. I know lots and lots of stories."
        - id: ch04-b44
          speaker: narrator
          text: >-
            Those were her exact words, so we cannot deny that Wendy tempted him first. He had been ready to hurry away with the ending of Cinderella, but now he stopped and returned. A hungry look had appeared in his eyes. Wendy did not know enough about Peter to be alarmed by it.
        - id: ch04-b45
          speaker: wendy
          text: "Just think of all the stories I could tell the boys!"
        - id: ch04-b46
          speaker: narrator
          text: "Peter seized her and began pulling her toward the window."
        - id: ch04-b47
          speaker: wendy
          text: "Let me go!"
          emotion: angry
        - id: ch04-b48
          speaker: peter
          text: "Come with me, Wendy. You can tell stories to the boys."
        - id: ch04-b49
          speaker: wendy
          text: "I'd love to, but I can't. Think of Mother! And I don't know how to fly."
        - id: ch04-b50
          speaker: peter
          text: "I'll teach you."
        - id: ch04-b51
          speaker: wendy
          text: "Oh, flying would be lovely!"
        - id: ch04-b52
          speaker: peter
          text: "I'll show you how to jump onto the wind's back. Then off we'll go. While you're asleep in that silly bed, you could be flying with me and saying funny things to the stars. And there are mermaids."
        - id: ch04-b53
          speaker: wendy
          text: "Mermaids? Do they have tails?"
        - id: ch04-b54
          speaker: peter
          text: "Very long tails. And we'd all respect you. You could tuck us in at night. Nobody has ever tucked us in. You could mend our clothes and make pockets. None of us has pockets."
        - id: ch04-b55
          speaker: narrator
          text: >-
            Peter had grown terribly cunning. First he made Wendy picture herself flying with him instead of lying in her ordinary bed. She could talk to the stars as they passed. Then he mentioned mermaids, and Wendy could hardly bear how much she wanted to see one. When he promised that everyone would respect her, she twisted her whole body with the effort of staying on the nursery floor. Peter showed no mercy. He told her she could tuck the boys into bed, something no one had ever done for them. Her arms began to reach toward him. Finally he spoke of torn clothes that needed darning and boys who had no pockets at all. How could Wendy resist that?
        - id: ch04-b56
          speaker: wendy
          text: "It's awfully tempting! Peter, will you teach John and Michael to fly too?"
        - id: ch04-b57
          speaker: peter
          text: "If you like."
        - id: ch04-b58
          speaker: narrator
          text: "Wendy ran to shake her brothers awake."
        - id: ch04-b59
          speaker: wendy
          text: "Wake up! Peter Pan is here, and he's going to teach us to fly!"
        - id: ch04-b60
          speaker: john
          text: "Then I'll get up. Hello! I am up!"
        - id: ch04-b61
          speaker: narrator
          text: >-
            John was already on the floor, blankets and all, though he had forgotten that when he announced he would get up. Michael sprang up too, looking as sharp as a knife with six blades and a saw. Suddenly Peter signaled for silence. Their faces took on the deep craftiness children use when they listen for sounds from the grown-up world. Everything was still as salt. For one instant, all seemed well. Then they understood that everything was wrong. Nana had barked miserably all evening. Now she had gone quiet, and it was her silence they had heard.
    - id: ch05
      title: Behind the Curtains
      blocks:
        - id: ch05-b01
          speaker: john
          text: "Put out the light! Hide, quickly!"
        - id: ch05-b02
          speaker: narrator
          text: >-
            This was the only time John took command during the whole adventure. When Liza entered with Nana, the dark nursery looked perfectly normal. Anyone would have sworn the three Darling children were breathing sweetly in their beds. Really, they were breathing very carefully behind the window curtains.

            Liza was in a bad temper. She had been mixing Christmas puddings in the kitchen when Nana's foolish suspicions called her away, and a raisin was still stuck to her cheek. She brought Nana to the nursery to quiet her, though she kept a firm hold on the dog.
        - id: ch05-b03
          speaker: liza
          text: "There, you suspicious creature. They're perfectly safe. Every little angel is sound asleep. Just listen to that gentle breathing."
        - id: ch05-b04
          speaker: narrator
          text: >-
            Encouraged by their success, Michael breathed so loudly that he almost gave them away. Nana knew that sort of breathing and struggled to escape. But Liza understood nothing.
        - id: ch05-b05
          speaker: liza
          text: "That's enough, Nana. If you bark again, I'll fetch the master and mistress home from the party. Then won't the master give you a whipping!"
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: >-
            Liza dragged the unhappy Nana out and tied her up again. But Nana did not stop barking. Liza's threat to bring Mr. and Mrs. Darling home was exactly what the dog wanted. And do you suppose she cared about being whipped if her three charges were safe? Unfortunately, Liza returned to the Christmas puddings instead. Nana saw that no help would come from her. She strained against the chain again and again until at last it snapped. A moment later, she burst into the dining room at number twenty-seven and threw her paws toward heaven. That was Nana's most expressive way of sending a message. Mr. and Mrs. Darling understood at once. Something terrible was happening in their nursery. They did not even say good-bye to their hostess before rushing into the street.

            Ten minutes had already passed since the three little scoundrels hid behind the curtains, and Peter Pan can do a great deal in ten minutes.

            Now we return to the nursery.
    - id: ch06
      title: Away into the Night
      blocks:
        - id: ch06-b01
          speaker: john
          text: "It's safe now. Peter, can you truly fly?"
        - id: ch06-b02
          speaker: narrator
          text: "Peter did not bother to answer with words. He rose into the air, circled the room, and touched the mantelpiece as he passed. John and Michael stared at him. Wendy thought the sight was sweet, while Peter immediately assumed she meant that he was sweet."
        - id: ch06-b03
          speakers: [john, michael]
          ensemble: duo
          text: "That's wonderful!"
          emotion: surprised
        - id: ch06-b04
          speaker: wendy
          text: "How lovely!"
          emotion: happy
        - id: ch06-b05
          speaker: peter
          text: "Yes, I'm lovely. Oh, I am lovely!"
          emotion: happy
        - id: ch06-b06
          speaker: narrator
          text: >-
            Peter had forgotten his manners again. Flying looked delightfully easy. The children tried from the floor, then from their beds, but every time they went down instead of up.
        - id: ch06-b07
          speaker: john
          text: "How do you do it?"
        - id: ch06-b08
          speaker: narrator
          text: "John rubbed his knee. He was a very practical boy."
        - id: ch06-b09
          speaker: peter
          text: "Think lovely, wonderful thoughts. They'll lift you into the air."
        - id: ch06-b10
          speaker: narrator
          text: "Peter showed them once more."
        - id: ch06-b11
          speaker: john
          text: "You're so quick. Could you show us slowly just once?"
        - id: ch06-b12
          speaker: narrator
          text: >-
            Peter flew slowly for them, then quickly. John announced to Wendy that he finally understood, but soon discovered he did not. The children tried their lovely thoughts with all their might. Not one of them rose a single inch. It seemed particularly unfair because even Michael could speak in words of two syllables, while Peter did not know A from Z.

            Of course Peter had been teasing them. No one can fly without fairy dust. Luckily, one of his hands was still covered with it. He blew a little onto each child, and the result was magnificent.
        - id: ch06-b13
          speaker: peter
          text: "Now wiggle your shoulders like this, and let go."
        - id: ch06-b14
          speaker: narrator
          text: >-
            They stood on their beds. Brave Michael let go first. He had not entirely meant to, but at once he sailed across the room.
        - id: ch06-b15
          speaker: michael
          text: "I flewed!"
          emotion: happy
        - id: ch06-b16
          speaker: narrator
          text: >-
            John let go next and met Wendy in the air near the bathroom. Delightful cries filled the nursery. Lovely! Ripping! Look at me! Each child wanted all the others to watch. They were not nearly as graceful as Peter. They could not stop their legs from kicking a little, and their heads kept bobbing against the ceiling, but almost nothing could have felt more delicious. Peter gave Wendy his hand at first. He had to let go when Tinker Bell grew too angry to bear it.

            Up and down they flew, around and around. Wendy called it heavenly.
        - id: ch06-b17
          speaker: john
          text: "Why don't we all fly out?"
        - id: ch06-b18
          speaker: narrator
          text: >-
            That was exactly what Peter had been leading them toward. Michael was ready. He wanted to find out how long it took to travel a billion miles. Wendy still hesitated.
        - id: ch06-b19
          speaker: peter
          text: "Mermaids!"
        - id: ch06-b20
          speaker: wendy
          text: "Oh!"
        - id: ch06-b21
          speaker: peter
          text: "And pirates."
        - id: ch06-b22
          speaker: john
          text: "Pirates! Let's go right now!"
          emotion: happy
        - id: ch06-b23
          speaker: narrator
          text: >-
            John grabbed his Sunday hat.

            At that very moment, Mr. and Mrs. Darling hurried out of number twenty-seven with Nana. They ran into the middle of the street and looked up at the nursery. Yes, the window was still closed. Yet the room blazed with light. Then came the sight that gripped their hearts most tightly. Against the curtain they saw three small figures in nightclothes circling around and around, not on the floor, but high in the air.

            Not three figures. Four.

            Trembling, the Darlings opened their front door. Mr. Darling would have raced upstairs, but Mrs. Darling motioned for him to move quietly. She even tried to make her heart beat quietly.

            Would they reach the nursery in time? If they did, how wonderful that would be for them. We would all breathe a deep sigh of relief. But then there would be no story. If they did not arrive in time, I solemnly promise you this much. Everything would come right in the end.

            They would have arrived in time, except that the little stars were watching. Once more, the stars blew open the window. The smallest star called a warning.
        - id: ch06-b24
          speaker: little_star
          text: "Watch out, Peter!"
        - id: ch06-b25
          speaker: narrator
          text: "Peter knew there was not a second to spare."
        - id: ch06-b26
          speaker: peter
          text: "Come!"
        - id: ch06-b27
          speaker: narrator
          text: >-
            Peter soared straight out into the night. John followed, then Michael, then Wendy.

            Mr. and Mrs. Darling and Nana rushed into the nursery too late.

            The birds had flown.
