audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，任性时理直气壮
        timbre: 柔软稚气
        pace: 短促活泼
        pitch: 高音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tinker_bell:
      display_name: 小叮当
      tts:
        delivery: 伶俐急躁，生气时像一串尖锐的小铃
        timbre: 晶莹细亮
        pace: 飞快
        pitch: 高音
    liza:
      display_name: 莉莎
      tts:
        delivery: 直率泼辣，不耐烦时干脆严厉
        timbre: 清朗结实
        pace: 明快
        pitch: 中音
    smallest_star:
      display_name: 最小的星星
      tts:
        delivery: 淘气兴奋，像迫不及待地通风报信
        timbre: 晶亮轻盈
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 来吧，来吧！
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天晚上，达林夫妇离开家以后，三个孩子床边的小夜灯还亮亮地燃了一会儿。那些小灯实在可爱，真叫人希望它们能撑着不睡，亲眼看看彼得。可温迪的灯先眨了眨眼，打出一个大哈欠，另外两盏也跟着打起来。三张小嘴还没来得及合拢，灯就一齐熄灭了。
        - id: ch01-b02
          speaker: narrator
          text: 房里随即多出一团亮过千倍的光。就在我们说完这句话的工夫，它已经钻遍育儿室所有抽屉，又翻过衣柜，把每只口袋都掏了个底朝天，到处寻找彼得的影子。那其实不是灯光。它飞得太快，才闪出一片亮光。等它停住一秒，你就看得出这是一位仙子。她还没你的手掌长，却已经是个长大成人的姑娘了。她叫小叮当，身穿精巧的叶脉礼服，低低的方领正好衬出她的身段。她稍稍有些丰满。
        - id: ch01-b03
          speaker: narrator
          text: 小星星们轻轻呼吸，把窗户吹开，彼得从窗口落进屋里。他一路上带着小叮飞过一段路，一只手仍沾满乱糟糟的仙尘。彼得先仔细看看三张小床，确认孩子们都睡着了，这才压低声音找起她来。
        - id: ch01-b04
          speaker: peter
          text: 小叮当，小叮，你在哪儿？快从那只水罐里出来。你知道他们把我的影子藏在哪儿了吗？
        - id: ch01-b05
          speaker: narrator
          text: 小叮从没进过水罐，正在里面待得开心。她用金铃般的叮当声回答彼得。那是仙子的语言，寻常孩子听不见。可你一旦听见，就会觉得自己从前一定听过。
        - id: ch01-b06
          speaker: narrator
          text: 小叮说影子在那只大箱子里，她指的其实是五斗柜。彼得一下扑过去，拉开抽屉，双手把里面的东西撒了一地，活像国王向人群抛撒半便士。他转眼就找回了影子。可他高兴过了头，竟忘了自己刚刚关上抽屉，也忘了小叮还在里面。
        - id: ch01-b07
          speaker: narrator
          text: 假使彼得真的想过，当然，我是不相信他会想的，他大概以为只要把影子贴近身体，两者就会像水滴那样融在一起。可影子怎么也接不上，他顿时慌了神。他跑进浴室拿来肥皂，想把影子牢牢粘住，还是没有用。彼得打了个寒战，只好坐到地板上，伤心地哭起来。
        - id: ch01-b08
          speaker: narrator
          text: 哭声惊醒了温迪。看见一个陌生男孩坐在地上哭，她一点也不怕，只觉得很有意思。
        - id: ch01-b09
          speaker: wendy
          text: 小男孩，你为什么哭呀？
        - id: ch01-b10
          speaker: narrator
          text: 彼得也懂得讲礼貌。他在仙子的典礼上学过一套堂皇礼数，立刻站起来，漂亮地鞠了一躬。温迪很满意，坐在床上也还了同样漂亮的一礼。
        - id: ch01-b11
          speaker: peter
          text: 你叫什么名字？
        - id: ch01-b12
          speaker: wendy
          text: 我叫温迪·莫伊拉·安吉拉·达林。你叫什么？
        - id: ch01-b13
          speaker: peter
          text: 彼得·潘。
        - id: ch01-b14
          speaker: narrator
          text: 温迪早猜到他是彼得，只觉得这个名字和自己的相比太短了。
        - id: ch01-b15
          speaker: wendy
          text: 就这些吗？真遗憾。
        - id: ch01-b16
          speaker: peter
          text: 就这些。没什么。
        - id: ch01-b17
          speaker: narrator
          text: 彼得头一回觉得自己的名字确实短了些。温迪又问他住在哪儿。
        - id: ch01-b18
          speaker: peter
          text: 往右第二个路口，再一直走到天亮。
        - id: ch01-b19
          speaker: wendy
          text: 这个地址真古怪！我是说，给你寄信时，信封上也这么写吗？
        - id: ch01-b20
          speaker: narrator
          text: 彼得心里一沉，第一次觉得地址或许真有点古怪。他更希望温迪别提到信。
        - id: ch01-b21
          speaker: peter
          text: 才不古怪。我反正收不到信。
        - id: ch01-b22
          speaker: wendy
          text: 可你妈妈会收到信吧？
        - id: ch01-b23
          speaker: peter
          text: 我没有妈妈。
        - id: ch01-b24
          speaker: narrator
          text: 他也丝毫不想要妈妈，觉得大家把妈妈看得太了不起。温迪却认定眼前发生了一场悲剧，赶紧跳下床，跑到他身边。
        - id: ch01-b25
          speaker: wendy
          text: 哦，彼得，难怪你哭了。
        - id: ch01-b26
          speaker: peter
          text: 我不是为妈妈哭。我是因为影子粘不上去才哭的。再说，我根本没哭。
        - id: ch01-b27
          speaker: wendy
          text: 影子掉下来了？
        - id: ch01-b28
          speaker: peter
          text: 对。
        - id: ch01-b29
          speaker: narrator
          text: 温迪这才看见地上那道蔫巴巴的影子。它看起来实在可怜，温迪也立刻对彼得生出满心同情。可等她发现，彼得刚才居然想用肥皂把影子粘回去，还是忍不住笑了。男孩子就是男孩子，总会想出这种办法。幸好，温迪一下就知道该怎么做。
        - id: ch01-b30
          speaker: wendy
          text: 太糟糕了。影子得缝回去。
        - id: ch01-b31
          speaker: peter
          text: 缝是什么意思？
        - id: ch01-b32
          speaker: wendy
          text: 你怎么什么都不懂呀？我替你缝吧，小家伙。
        - id: ch01-b33
          speaker: peter
          text: 我才不是什么都不懂。
        - id: ch01-b34
          speaker: narrator
          text: 彼得明明和她一样高，可他的无知让温迪得意极了。她拿出针线包，把影子缝到他脚上，还提醒他会有点疼。
        - id: ch01-b35
          speaker: peter
          text: 我才不会哭。
        - id: ch01-b36
          speaker: narrator
          text: 这时候，彼得已经认定自己一辈子从没哭过。他紧紧咬住牙关，果真一滴眼泪也没掉。温迪一针一针缝下去。没过多久，影子就规规矩矩地跟着彼得了，只是缝过以后，还有一点皱巴巴的。
        - id: ch01-b37
          speaker: wendy
          text: 也许我该先替它熨一熨。
        - id: ch01-b38
          speaker: narrator
          text: 彼得像所有男孩子一样，才不在乎影子好不好看。他高兴得发了狂，在屋里蹦来跳去。唉，他早已忘了这份快乐全是温迪给他的，反倒认定是自己亲手把影子接了回去。
        - id: ch01-b39
          speaker: peter
          text: 我可真聪明！瞧我多聪明！
          emotion: happy
        - id: ch01-b40
          speaker: narrator
          text: 承认这件事实在有些难为情。彼得身上这份了不得的自负，偏偏也是他最迷人的地方之一。要是毫不客气地把真话说出来，世上从来没有哪个男孩比他更加神气活现。可温迪眼下没有觉得迷人，她只觉得震惊，接着便被气坏了。
        - id: ch01-b41
          speaker: wendy
          text: 你这个自大鬼！对呀，我当然什么也没做！
          emotion: angry
        - id: ch01-b42
          speaker: peter
          text: 你也做了一点点。
        - id: ch01-b43
          speaker: wendy
          text: 一点点？既然我没用，那我至少可以告退。
        - id: ch01-b44
          speaker: narrator
          text: 她说完便极有尊严地跳回床上，用毯子蒙住脸。彼得想哄她抬头，先故意装出要走的样子。这办法毫无用处，他只好坐到床尾，用脚轻轻碰她。温迪还是不肯露出脸，可她心里急着想听，耳朵早就竖了起来。
        - id: ch01-b45
          speaker: peter
          text: 温迪，别走呀。我只要一为自己高兴，就忍不住要叫。真的没办法。再说，一个女孩子抵得上二十个男孩子。
        - id: ch01-b46
          speaker: narrator
          text: 温迪虽然个子小，却从头到脚都是个女人。她从被子里探出眼睛。
        - id: ch01-b47
          speaker: wendy
          text: 彼得，你真这么想吗？
        - id: ch01-b48
          speaker: peter
          text: 真的。
        - id: ch01-b49
          speaker: wendy
          text: 你这么说真可爱。那我就起来吧。要是你愿意，我还可以给你一个吻。
        - id: ch01-b50
          speaker: narrator
          text: 她重新坐起来，和彼得并肩坐在床沿，又说如果他愿意，自己可以给他一个吻。彼得却完全不懂她的意思，只是满怀期待地伸出一只手。
        - id: ch01-b51
          speaker: wendy
          text: 你连吻是什么都不知道吗？
        - id: ch01-b52
          speaker: peter
          text: 你给我以后，我就知道了。
        - id: ch01-b53
          speaker: narrator
          text: 为了不伤他的自尊，温迪把一只顶针放在他手里。彼得马上问，要不要也给她一个吻。温迪矜持地答应了，却又主动把脸凑过去，显得稍稍不够端庄。可彼得只往她手里放了一颗橡子纽扣。温迪只好慢慢把脸收回原处，客气地说，会把他的吻挂在颈间的链子上。幸亏她真的这样做了，因为后来正是这个吻救了她的命。
        - id: ch01-b54
          speaker: narrator
          text: 按照他们那一等人的规矩，两个人初次相识，总该问问彼此的年纪。温迪一向喜欢把礼数做周全，便问彼得几岁了。可这个问题问得实在不妙，正像一张故意考错科目的试卷。你满心希望它问英国历代国王，它却偏偏考起语法。
        - id: ch01-b55
          speaker: peter
          text: 我不知道，不过我还很小。温迪，我出生那天就逃走了。
        - id: ch01-b56
          speaker: narrator
          text: 彼得其实只是在猜。温迪又惊又好奇，拍拍身边的床铺，客气地请他坐近些。
        - id: ch01-b57
          speaker: peter
          text: 我听见爸爸妈妈在说，我长大以后要做什么。我永远也不要做大人。我要一直做个小男孩，一直玩。所以我逃到肯辛顿花园，和仙子们住了很久很久。
        - id: ch01-b58
          speaker: narrator
          text: 彼得说到这里，激动得不得了。温迪满眼崇拜地看着他。他以为她佩服自己敢离家出走，其实她只是觉得，能够认识仙子真是了不起。温迪从小守在家中生活，对仙子有问不完的问题。彼得很意外，因为仙子在他眼里相当麻烦，总爱挡他的路，有时甚至非得挨他一顿揍不可。不过总的说来，他还是喜欢她们，于是说起仙子的来历。
        - id: ch01-b59
          speaker: peter
          text: 最初那个婴儿第一次笑时，笑声碎成一千片，到处蹦蹦跳跳。仙子就是这么来的。
        - id: ch01-b60
          speaker: narrator
          text: 这话其实挺乏味，可温迪听得津津有味。
        - id: ch01-b61
          speaker: peter
          text: 所以，每个男孩和女孩本来都该有一位仙子。
        - id: ch01-b62
          speaker: wendy
          text: 本来该有？现在没有吗？
        - id: ch01-b63
          speaker: peter
          text: 没有。现在的孩子懂得太多，很快就不信仙子了。每当一个孩子说“我不信仙子”，就会有一位仙子在什么地方倒下死去。
        - id: ch01-b64
          speaker: narrator
          text: 彼得觉得仙子的话已经说够了，这才想起小叮安静得不对劲。他站起来喊她，温迪的心一下跳得飞快。
        - id: ch01-b65
          speaker: wendy
          text: 彼得，这间屋里真的有仙子吗？
          emotion: surprised
        - id: ch01-b66
          speaker: peter
          text: 刚才还在。你没听见她吗？
        - id: ch01-b67
          speaker: narrator
          text: 两人一齐听起来。
        - id: ch01-b68
          speaker: wendy
          text: 我只听见铃铛似的叮当声。
        - id: ch01-b69
          speaker: peter
          text: 那就是小叮。仙子都这样说话。我也听见她了。
        - id: ch01-b70
          speaker: narrator
          text: 叮当声从五斗柜里传出来。彼得脸上立刻露出快活的神情。世上没有谁能像彼得那样快活，他笑起来发出最动听的咯咯声。因为直到这时，他还保留着自己出生后的第一声笑呢。
        - id: ch01-b71
          speaker: peter
          text: 温迪，我准是把她关在抽屉里了！
          emotion: happy
        - id: ch01-b72
          speaker: narrator
          text: 他放出可怜的小叮。她气得在房里横冲直撞，尖声大骂。
        - id: ch01-b73
          speaker: peter
          text: 你不该说这种话。我当然很抱歉，可我怎么知道你在抽屉里？
        - id: ch01-b74
          speaker: wendy
          text: 哦，彼得，要是她肯停下来，让我看看就好了！
        - id: ch01-b75
          speaker: peter
          text: 她们几乎从不停下来。
        - id: ch01-b76
          speaker: narrator
          text: 可有一瞬间，小叮停在了布谷钟上。温迪看见了她娇小的身影，也看见她那张气得变形的脸。
        - id: ch01-b77
          speaker: wendy
          text: 哦，她真可爱！
        - id: ch01-b78
          speaker: peter
          text: 小叮，这位小姐说，希望你做她的仙子。
        - id: ch01-b79
          speaker: narrator
          text: 小叮傲慢地回答了一句。温迪听不懂，只好问彼得。
        - id: ch01-b80
          speaker: peter
          text: 她说得不太客气。她说你是个又大又丑的姑娘，还说她才是我的仙子。可小叮，我是位先生，你是位小姐，你不能做我的仙子。
        - id: ch01-b81
          speaker: tinker_bell
          text: 你这个傻瓜。
          emotion: angry
        - id: ch01-b82
          speaker: narrator
          text: 小叮说完便消失在浴室里。彼得有些不好意思，只得向温迪解释，小叮是个很普通的仙子。她专门替人修补锅子和水壶，因此大家才叫她小叮当。过了一会儿，两个人一起坐进扶手椅，温迪又连珠炮似的问起他来。
        - id: ch01-b83
          speaker: wendy
          text: 你要是不住在肯辛顿花园，现在大多住在哪儿？
        - id: ch01-b84
          speaker: peter
          text: 有时我还住在那里。平常我和遗失的孩子们在一起。
        - id: ch01-b85
          speaker: wendy
          text: 遗失的孩子们是谁？
        - id: ch01-b86
          speaker: peter
          text: 保姆转过头时，他们从婴儿车里掉了出来。七天没人认领，就会被送到很远的永无岛，好省下一笔开销。我是队长。
        - id: ch01-b87
          speaker: wendy
          text: 一定好玩极了！难道一个女孩也没有吗？
        - id: ch01-b88
          speaker: peter
          text: 好玩是好玩，可我们很寂寞，因为没有女伴。女孩聪明得多，才不会从婴儿车里掉下来。
        - id: ch01-b89
          speaker: narrator
          text: 温迪被哄得心花怒放。
        - id: ch01-b90
          speaker: wendy
          text: 你谈起女孩子真好听。那边的约翰只会瞧不起我们。
        - id: ch01-b91
          speaker: narrator
          text: 彼得没有回答。他站起身，只踢了一脚，就把约翰连人带毯子踢下了床。初次见面就这样对待人家的弟弟，温迪觉得他未免太冒失，立刻鼓起气势告诉他，在她家里，他可不是什么队长。不过约翰躺在地板上依旧睡得十分安稳，半点也没受打扰，她便准他继续留在那里。温迪很快又心软了。她知道彼得原本是想替女孩子出头，算是一片好意，于是对他说，现在可以给自己一个吻。
        - id: ch01-b92
          speaker: peter
          text: 我还以为你会把吻要回去呢。
        - id: ch01-b93
          speaker: narrator
          text: 他有些委屈，拿出顶针要还她。温迪这才想起他不懂吻是什么意思。
        - id: ch01-b94
          speaker: wendy
          text: 我说的不是吻，是顶针。顶针就是这样。
        - id: ch01-b95
          speaker: narrator
          text: 她吻了彼得一下。
        - id: ch01-b96
          speaker: peter
          text: 真古怪！那我也给你一个顶针吧？
        - id: ch01-b97
          speaker: wendy
          text: 你愿意就给吧。
        - id: ch01-b98
          speaker: narrator
          text: 这回温迪把头挺得笔直。彼得吻了她，她却立刻尖叫起来。
        - id: ch01-b99
          speaker: peter
          text: 怎么了，温迪？
        - id: ch01-b100
          speaker: wendy
          text: 好像有人扯了我的头发。
        - id: ch01-b101
          speaker: peter
          text: 一定是小叮。我从没见她这么淘气。
        - id: ch01-b102
          speaker: narrator
          text: 小叮果然又在飞来飞去，嘴里尽是难听的话。
        - id: ch01-b103
          speaker: peter
          text: 她说，以后每次我给你顶针，她都要扯你的头发。小叮，这是为什么？
        - id: ch01-b104
          speaker: tinker_bell
          text: 你这个傻瓜。
          emotion: angry
        - id: ch01-b105
          speaker: narrator
          text: 彼得还是不明白，温迪却懂了。听说彼得来窗前不是为了她，只是为了偷听故事，她有点失望。
        - id: ch01-b106
          speaker: peter
          text: 我一个故事也不知道，遗失的孩子们也都不会讲。你知道燕子为什么把窝筑在屋檐下吗？它们就是来听故事的。温迪，你妈妈刚才讲的故事可好听了。
        - id: ch01-b107
          speaker: wendy
          text: 这太可怕了。妈妈讲的是哪个故事？
        - id: ch01-b108
          speaker: peter
          text: 一个王子找不到穿玻璃鞋的姑娘。
        - id: ch01-b109
          speaker: wendy
          text: 那是灰姑娘！王子找到她了，他们后来永远幸福地生活在一起。
          emotion: happy
        - id: ch01-b110
          speaker: narrator
          text: 彼得听见王子终于找到灰姑娘，两个人从此幸福地生活在一起，高兴得不得了。他从地板上一跃而起，直奔窗口，恨不得马上把这个结局告诉遗失的孩子们。
        - id: ch01-b111
          speaker: wendy
          text: 你去哪儿？别走呀，彼得，我知道好多好多故事。
        - id: ch01-b112
          speaker: peter
          text: 我要去告诉其他孩子。
        - id: ch01-b113
          speaker: narrator
          text: “我知道好多好多故事。”这正是温迪的原话，一个字也不差。所以我们绝不能否认，第一个引诱彼得的人正是她。彼得果然回来了。这会儿，他眼中已经露出贪婪的神色，本来应该让温迪警觉，可她一点也没有察觉。
        - id: ch01-b114
          speaker: wendy
          text: 哦，我能给那些孩子讲多少故事呀！
        - id: ch01-b115
          speaker: narrator
          text: 彼得抓住温迪，把她往窗口拉。
        - id: ch01-b116
          speaker: wendy
          text: 放开我！
        - id: ch01-b117
          speaker: peter
          text: 温迪，跟我走吧，去给他们讲故事。
        - id: ch01-b118
          speaker: wendy
          text: 你肯邀请我，我当然高兴。可是不行呀，想想妈妈吧！再说，我又不会飞。
        - id: ch01-b119
          speaker: peter
          text: 我教你。我会教你跳上风的脊背，然后我们一下就飞走了。
        - id: ch01-b120
          speaker: wendy
          text: 哦，能飞该多美呀！
        - id: ch01-b121
          speaker: peter
          text: 你睡在那张傻乎乎的小床上时，本来可以和我飞来飞去，对星星说好玩的话。那里还有美人鱼。
        - id: ch01-b122
          speaker: wendy
          text: 美人鱼！她们有尾巴吗？
        - id: ch01-b123
          speaker: peter
          text: 尾巴可长了。
        - id: ch01-b124
          speaker: wendy
          text: 哦，我真想看看美人鱼！
        - id: ch01-b125
          speaker: narrator
          text: 彼得已经狡猾得可怕了。
        - id: ch01-b126
          speaker: peter
          text: 温迪，到时候我们都会尊敬你。晚上你可以替我们掖好被子。从来没人替我们掖过。你还能给我们补衣裳、做口袋。我们谁都没有口袋。
        - id: ch01-b127
          speaker: narrator
          text: 温迪心里又想去，又舍不得妈妈，苦恼得浑身扭来扭去。那模样就像她正在用尽全身力气，拼命把自己留在育儿室的地板上。可彼得这个狡猾的家伙一点也不同情她。他接着说，从来没有人在晚上替那些孩子掖好被子。温迪一听，两条胳膊便不由自主地向他伸去。等彼得又说，她可以替大家缝补衣裳、做上口袋，而那些孩子没有一个人有口袋，她就彻底抵挡不住了。
        - id: ch01-b128
          speaker: wendy
          text: 那当然迷人极了！彼得，你也教约翰和迈克尔飞，好不好？
        - id: ch01-b129
          speaker: peter
          text: 随你。
        - id: ch01-b130
          speaker: narrator
          text: 温迪跑去摇醒两个弟弟。
        - id: ch01-b131
          speaker: wendy
          text: 醒醒！彼得·潘来了，他要教我们飞！
        - id: ch01-b132
          speaker: narrator
          text: 约翰揉着眼睛。他本来已经躺在地上，却说自己要起床。
        - id: ch01-b133
          speaker: john
          text: 嘿，我已经起来啦！
        - id: ch01-b134
          speaker: narrator
          text: 这时迈克尔也醒了，精神得像一把带六片刀刃和一柄锯子的折刀。彼得却忽然示意大家安静。孩子们的脸上立刻露出可怕的狡黠神情，一起侧耳偷听大人世界里的动静。四下静得像盐。这样看来，一切都没事了。不，等等，事情分明糟透了。娜娜整晚都在忧伤地吠叫，现在却忽然没了声音。他们刚才听见的，正是她的沉默。
        - id: ch01-b135
          speaker: john
          text: 熄灯！快藏起来！
        - id: ch01-b136
          speaker: narrator
          text: 这是整个冒险中，约翰唯一一次发号施令。孩子们立刻照办。于是莉莎牵着娜娜进来时，育儿室看上去和往常一模一样，黑暗又安静。谁听见那轻柔的呼吸声，都会认定三个小天使正躺在床上熟睡。其实三个淘气包全躲在窗帘后面，正狡猾地装出那种呼吸。
        - id: ch01-b137
          speaker: narrator
          text: 莉莎当时正在厨房里搅拌圣诞布丁，娜娜却疑神疑鬼地闹个不停，硬把她从厨房叫了出来，害她脸颊上还粘着一颗葡萄干。莉莎的心情坏极了。她觉得，想换得片刻清静，最好的办法就是把娜娜带来育儿室看上一眼。当然，她得把娜娜牢牢看在手里。
        - id: ch01-b138
          speaker: liza
          text: 看吧，你这疑神疑鬼的畜生。孩子们不是好好的吗？每个小天使都在床上睡着。听听，他们呼吸得多轻。
        - id: ch01-b139
          speaker: narrator
          text: 迈克尔得意忘形，把呼吸弄得太响，差点害大家暴露。娜娜认出这种假呼吸，拼命想挣脱。莉莎却迟钝得很，硬把她拖了出去。
        - id: ch01-b140
          speaker: liza
          text: 别再闹了，娜娜。你要是再叫，我就把老爷和太太从宴会上叫回来。到时候，老爷非狠狠抽你不可。
          emotion: angry
        - id: ch01-b141
          speaker: narrator
          text: 莉莎又把不幸的娜娜拴好。可你以为娜娜就不叫了吗？把老爷和太太从宴会上叫回来，这正是她想要的。只要三个孩子安全，她哪里会在乎自己挨不挨打。可惜莉莎回去搅布丁了。娜娜眼看得不到帮助，只好一次又一次拼命拉扯锁链，终于把它挣断。下一刻，她闯进二十七号的餐厅，两只前爪高高举向天空。这是她最会说明意思的姿势。达林夫妇立刻明白，育儿室里出了可怕的事。他们甚至来不及向女主人告别，便冲上街头。
        - id: ch01-b142
          speaker: narrator
          text: 可三个小坏蛋躲在窗帘后面，已经是十分钟前的事了。十分钟，足够彼得·潘做很多事情。时间正在飞快过去，我们还是赶紧回到育儿室，看看那里发生了什么吧。
        - id: ch01-b143
          speaker: john
          text: 没事了。彼得，你真的会飞吗？
        - id: ch01-b144
          speaker: narrator
          text: 彼得懒得回答，干脆绕着屋子飞了一圈，中途还停上壁炉台。
        - id: ch01-b145
          speakers: [john, michael]
          ensemble: duo
          text: 太棒了！
          emotion: surprised
        - id: ch01-b146
          speaker: wendy
          text: 太可爱了！
          emotion: happy
        - id: ch01-b147
          speaker: peter
          text: 对，我很可爱。我真可爱！
        - id: ch01-b148
          speaker: narrator
          text: 彼得又把礼貌忘得一干二净。飞行看上去既轻松又美妙，谁都会觉得自己一试就能成功。三个孩子先站在地板上试，又爬到床上往外跳。可无论怎么尝试，他们每次都只会往下掉，怎么也升不上去。
        - id: ch01-b149
          speaker: john
          text: 你到底怎么飞的？
        - id: ch01-b150
          speaker: narrator
          text: 约翰揉着膝盖。他是个很实际的男孩。
        - id: ch01-b151
          speaker: peter
          text: 只要想些可爱又美妙的事，它们就会把你托起来。
        - id: ch01-b152
          speaker: narrator
          text: 彼得又示范了一遍。
        - id: ch01-b153
          speaker: john
          text: 你飞得太快了。能不能慢慢飞一次？
        - id: ch01-b154
          speaker: narrator
          text: 彼得依他的要求，先慢慢飞了一次，又飞快地来了一次。约翰立刻对温迪喊，说自己已经明白了，可他很快就发现，自己根本什么也没明白。三个孩子里，没有一个能飞起哪怕一英寸。说来也怪，就连迈克尔都已经会说两个音节的词了，彼得却连字母表的头和尾都分不清。
        - id: ch01-b155
          speaker: narrator
          text: 当然，彼得一直在故意戏弄他们，因为身上没有吹过仙尘，谁也不可能飞起来。幸好我们前面说过，他有一只手还沾满了乱糟糟的仙尘。彼得终于肯把秘密拿出来了。他向温迪、约翰和迈克尔每人吹了一些，结果好得惊人。
        - id: ch01-b156
          speaker: peter
          text: 像这样扭扭肩膀，然后松手。
        - id: ch01-b157
          speaker: narrator
          text: 他们都站在床上。勇敢的迈克尔第一个松手。其实他并不真想放开，可还是放了，身体立刻飘过整个房间。
        - id: ch01-b158
          speaker: michael
          text: 我飞起来啦！
          emotion: happy
        - id: ch01-b159
          speaker: narrator
          text: 约翰也松了手，在浴室边遇见温迪。
        - id: ch01-b160
          speaker: wendy
          text: 太美啦！看我！
          emotion: happy
        - id: ch01-b161
          speaker: john
          text: 太棒啦！看我！
          emotion: happy
        - id: ch01-b162
          speaker: michael
          text: 看我！
          emotion: happy
        - id: ch01-b163
          speaker: narrator
          text: 他们飞得远不如彼得优雅，双腿总忍不住乱踢，脑袋也一次次撞上天花板。可世上几乎没有什么比这更叫人快活。彼得起初还拉着温迪的手，后来小叮气得实在太厉害，他只好把手松开。孩子们一会儿向上，一会儿向下，又一圈接一圈地绕着房间飞。
        - id: ch01-b164
          speaker: wendy
          text: 这简直像在天堂！
          emotion: happy
        - id: ch01-b165
          speaker: john
          text: 我们为什么不一起飞出去？
        - id: ch01-b166
          speaker: narrator
          text: 彼得绕了这么大一个圈子，原本就是在引诱他们说出这句话。迈克尔马上做好了出发的准备，他迫不及待地想知道，飞完十亿英里到底需要多久。可是温迪却在这一刻犹豫起来。
        - id: ch01-b167
          speaker: peter
          text: 美人鱼！还有海盗。
        - id: ch01-b168
          speaker: wendy
          text: 哦！
        - id: ch01-b169
          speaker: john
          text: 海盗！我们马上走。
          emotion: happy
        - id: ch01-b170
          speaker: narrator
          text: 约翰一把抓起星期日才戴的帽子。就在这时，达林夫妇带着娜娜匆匆冲出二十七号，跑到街心，抬头看向育儿室。不错，窗户仍旧关着，房里却亮得耀眼。最叫他们心碎的是，窗帘上映出三个穿睡衣的小小身影，一圈又一圈地转着。那些身影不在地板上，而是在空中。
        - id: ch01-b171
          speaker: narrator
          text: 不对，不是三个。是四个！
        - id: ch01-b172
          speaker: narrator
          text: 达林夫妇浑身颤抖着打开街门。达林先生一心要直奔楼上，达林太太却向他做了个手势，让他把脚步放得轻一点，千万不要惊动楼上的人。她自己也屏住呼吸，甚至竭力想让胸膛里那颗狂跳的心，也跟着轻轻地跳。
        - id: ch01-b173
          speaker: narrator
          text: 他们能及时赶到育儿室吗？要是赶上了，他们该多么欢喜，我们也都可以松一口气。可惜那样一来，我们就没有故事可听了。反过来说，要是他们终究没有赶上，我可以郑重地向你保证，等到最后，一切都会好起来。
        - id: ch01-b174
          speaker: narrator
          text: 他们原本来得及赶到育儿室，只怪那些小星星一直守在屋外盯着。星星们再次轻轻呼吸，把育儿室的窗户吹开。随后，银河里最小的那一颗高声向彼得报警。
        - id: ch01-b175
          speaker: smallest_star
          text: 当心，彼得！
          emotion: fearful
        - id: ch01-b176
          speaker: narrator
          text: 最小的星星这一声喊，让彼得立刻明白，再也没有一刻可以耽搁。达林夫妇已经进了门，正放轻脚步往楼上赶。育儿室的窗户却已经敞开，夜空就在孩子们眼前。
        - id: ch01-b177
          speaker: peter
          text: 来吧！
        - id: ch01-b178
          speaker: narrator
          text: 他用不容置疑的口气一声令下，自己先从窗口腾空而起，径直飞进夜色。约翰紧跟着他，迈克尔也飞了出去，温迪最后离开了这间熟悉的育儿室。达林夫妇和娜娜随即冲进房间，可他们终究来迟了一步。
        - id: ch01-b179
          speaker: narrator
          text: 育儿室已经空了。那几只小鸟，全都飞走了。
