  chapters:
    - id: ch01
      title: The Darling Family
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            All children grow up except one. They soon learn that growing up is waiting for them. Wendy learned it when she was two. She was playing in a garden one day, and after picking another flower, she ran to her mother with it. She must have looked delightful. Mrs. Darling pressed a hand to her heart.
        - id: ch01-b02
          speaker: mrs_darling
          text: "Oh, why can't you stay like this forever?"
        - id: ch01-b03
          speaker: narrator
          text: >-
            That was all they ever said about it, but from then on, Wendy knew she had to grow up. You always know once you are two. Two is the beginning of the end.

            The family lived at number fourteen, and before Wendy arrived, Mrs. Darling was the most important person there. She was lovely, with a romantic mind and a sweet, teasing mouth. Her mind was like a set of tiny boxes, one tucked inside another. No matter how many you opened, there was always one more. And at the right-hand corner of her mouth was one kiss that Wendy could plainly see but could never get.

            Many gentlemen had loved Mrs. Darling when they were boys and she was a girl. When they all finally realized it, they rushed to her house to propose. All of them rushed there except Mr. Darling. He took a cab, arrived first, and won her. He got everything but the innermost box and that kiss. He never knew about the box, and after a while he stopped trying for the kiss. Wendy believed Napoleon could have gotten it. I can imagine him trying, failing, then storming away and slamming the door.

            Mr. Darling liked to tell Wendy that her mother respected him as well as loved him. He was a serious man who understood stocks and shares. No one truly understands them, of course, but he seemed to. He could say that stocks had gone up and shares had gone down in a way that would make any woman respect him.

            Mrs. Darling had married in white. At first she kept the household accounts perfectly and almost joyfully, as though they were a game. She accounted for every last Brussels sprout. Later, whole cauliflowers vanished from the books. In their place appeared drawings of babies without faces. She drew them when she should have been adding numbers. They were her guesses about the children to come.

            Wendy came first. Then John. Then Michael.

            For a week or two after Wendy was born, nobody knew if the Darlings could afford to keep her. She was another mouth to feed. Mr. Darling was terribly proud of her, but he was also very honorable. He sat on the edge of Mrs. Darling's bed, held her hand, and worked out the expenses while she looked at him pleadingly. She wanted to take the risk, whatever happened. That was not his way. His way required a pencil and paper, and whenever she interrupted with a suggestion, he had to start all over.
        - id: ch01-b04
          speaker: mr_darling
          text: "Please don't interrupt me now."
        - id: ch01-b05
          speaker: narrator
          text: He began counting aloud.
        - id: ch01-b06
          speaker: mr_darling
          text: >-
            I've got one pound seventeen here, and two shillings sixpence at the office. If I stop buying coffee there, that's another ten shillings. So we're at two pounds nine and six. Add your eighteen and three, and that's three pounds nine and seven. Then five pounds in my checkbook makes eight pounds nine and seven. Who moved? Eight nine seven, put down the point, carry the seven. Don't say anything, darling. And there was the pound you lent that man at the door. Quiet, child. Point, carry the child—now you've made me lose it! Did I say nine pounds nine and seven? Yes, nine nine seven. So the question is, can we manage for one year on nine pounds nine and seven?
        - id: ch01-b07
          speaker: mrs_darling
          text: "Of course we can, George!"
        - id: ch01-b08
          speaker: narrator
          text: >-
            She was not an impartial judge. She was already on Wendy's side. Mr. Darling was the nobler of the two.
        - id: ch01-b09
          speaker: mr_darling
          text: >-
            Don't forget the mumps. I've allowed one pound for mumps, but it could easily cost thirty shillings. Don't talk. Measles, one pound five. German measles, ten and six. That makes two pounds fifteen and six. Don't wave your finger. Whooping cough, let's say fifteen shillings...
        - id: ch01-b10
          speaker: narrator
          text: >-
            On and on he calculated, reaching a different total every time. At last, Wendy just squeezed through. He lowered the cost of mumps to twelve and six and counted both kinds of measles as one illness.

            John caused the same excitement when he arrived. Michael came even closer to being unaffordable. Still, the Darlings kept them both. Before long, all three children could be seen walking in a row to Miss Fulsom's Kindergarten, with their nurse beside them.
    - id: ch02
      title: Nana Keeps the Nursery
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Mrs. Darling liked everything arranged just right. Mr. Darling wanted to live exactly as his neighbors did. Naturally, then, they needed a nurse. The children drank so much milk that the family was poor, so their nurse was Nana, a proper Newfoundland dog.

            Nana had belonged to no one in particular before the Darlings hired her, but she had always believed children were important. The family met her in Kensington Gardens. She spent her free time looking into baby carriages and watching over the children in them. Careless nursemaids hated her. If one neglected a child, Nana followed her home and reported her to her mistress.

            She turned out to be a wonderful nurse. At bath time she missed nothing. If one of the children made the smallest cry at night, she was awake in an instant. Her kennel stood in the nursery, of course. She always knew which cough deserved no attention and which one called for a stocking wrapped around the throat. To the end of her life she trusted old remedies like rhubarb leaf. Whenever people began talking about new ideas like germs, she made a scornful noise.

            On the walk to school, Nana was a perfect example of good behavior. If the children stayed in line, she walked calmly beside them. If one wandered, she bumped the child back into place. On John's soccer days she never forgot his sweater. She usually carried an umbrella in her mouth in case it rained.

            The school had a basement room where the nurses waited. The others sat on benches while Nana lay on the floor. That was the only difference. They pretended not to notice her because they considered her beneath them, and Nana despised their silly conversation.

            She did not like Mrs. Darling's friends visiting the nursery, either. Still, if visitors came, Nana quickly pulled off Michael's pinafore and put him in the one with blue trim. Then she neatened Wendy and made a rush at John's hair.

            No nursery could have been run more correctly. Mr. Darling knew that. Even so, he sometimes worried about what the neighbors might say. He had his position in the city to think of.

            Nana worried him for another reason, too. Sometimes he felt that she did not admire him.
        - id: ch02-b02
          speaker: mrs_darling
          text: "Oh, George, I'm sure Nana admires you enormously."
        - id: ch02-b03
          speaker: narrator
          text: >-
            Then Mrs. Darling secretly signaled the children to be especially kind to their father. Wonderful dances followed. Sometimes Liza, the family's only other servant, was allowed to join in. She looked tiny in her long skirt and maid's cap, though when she was hired she had sworn she would never be ten years old again.

            Those games were full of joy. Mrs. Darling was the happiest of them all. She spun so wildly that all you could see was the kiss at the corner of her mouth. If you had rushed at her then, perhaps you could have caught it. No family was ever simpler or happier, until Peter Pan came.
    - id: ch03
      title: The Neverlands Inside
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Mrs. Darling first heard of Peter while she was putting her children's minds in order. Every night, after the children fall asleep, a good mother goes through their thoughts and straightens them out for morning. She puts away all the things that wandered loose during the day, much as someone tidies a set of drawers.

            If you could stay awake, though of course you can't, you might see your own mother doing it. You might see her kneeling there, smiling over one thing and wondering where in the world you found another. Some discoveries are sweet, and some are not. She presses one thought to her cheek because it is as lovely as a kitten, then quickly hides another where no one can see it. By morning, the anger and naughtiness you carried to bed have been folded small and pushed to the bottom of your mind. Your prettier thoughts lie fresh and neat on top, ready for you to put on.

            Have you ever seen a map of someone's mind? Doctors draw maps of other parts of us, but try asking them to draw a child's mind. It is confused, and it never stops turning. Across it run zigzag lines that may be roads on an island, because the Neverland is almost always an island.

            There are sudden bursts of color, coral reefs, and daring ships waiting offshore. There are wild tribes and lonely hiding places. There are gnomes, most of them tailors, and caves with rivers running through them. You may find princes with six older brothers, a hut falling apart, and one very small old woman with a hooked nose.

            That would be an easy map if it were all. But mixed through it are the first day of school, religion, fathers, the Round Pond, sewing, murders, hangings, verbs that take the dative case, chocolate-pudding day, putting on braces, saying ninety-nine for the doctor, and earning threepence by pulling out your own tooth. Perhaps those things belong to the island. Perhaps they are another map showing through. It is hard to tell, especially when nothing stays still.

            Every child's Neverland is a little different. John's had a lagoon with flamingos flying over it, and John was shooting at them. Michael was so young that his had one flamingo with lagoons flying over it. John lived in an upside-down boat on the sand. Michael lived in a wigwam. Wendy lived in a house of leaves, carefully sewn together. John had no friends. Michael had friends at night. Wendy had a pet wolf whose parents had left it behind.

            Yet the Neverlands all look related. If you could line them up and make them stay still, you would see the family resemblance. On those enchanted shores, children at play are always bringing their little boats onto the beach. We have been there too. We can still hear the surf, though we will never land there again.

            Of all the delightful islands, the Neverland is the coziest and most neatly packed. It is not wide and sprawling, with tiresome distances between adventures. Everything is close together. In daytime, when you make it from chairs and a tablecloth, it is not frightening at all. But during those two minutes just before you fall asleep, it becomes very real. That is why children have night-lights.
    - id: ch04
      title: The Name in Wendy's Mind
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Now and then, while traveling through her children's minds, Mrs. Darling found something she could not explain. The strangest of all was the word Peter. She knew no one named Peter, yet the name appeared here and there in John and Michael's minds. In Wendy's mind, it was scribbled everywhere. It stood out in letters bolder than any other word. As Mrs. Darling looked at it, she thought the name itself seemed oddly cocky.
        - id: ch04-b02
          speaker: wendy
          text: "Yes, he is rather cocky."
        - id: ch04-b03
          speaker: narrator
          text: Wendy admitted it reluctantly when her mother asked her about him.
        - id: ch04-b04
          speaker: mrs_darling
          text: "But who is he, sweetheart?"
        - id: ch04-b05
          speaker: wendy
          text: "He's Peter Pan. You know that, Mother."
        - id: ch04-b06
          speaker: narrator
          text: >-
            At first Mrs. Darling did not know. Then she reached back into her own childhood and faintly remembered a Peter Pan who was said to live with the fairies. There were strange stories about him. People said that when children died, he traveled part of the way with them so they would not be afraid. She had believed in him as a girl. Now she was married and sensible, and she doubted there could really be such a person.
        - id: ch04-b07
          speaker: mrs_darling
          text: "And anyway, he would be grown up by now."
        - id: ch04-b08
          speaker: wendy
          text: "Oh no, he hasn't grown up. He's exactly my size."
        - id: ch04-b09
          speaker: narrator
          text: >-
            Wendy meant that Peter was her size both in body and in mind. She could not explain how she knew. She simply knew.

            Mrs. Darling asked Mr. Darling what he thought. He smiled as if the whole thing were foolish.
        - id: ch04-b10
          speaker: mr_darling
          text: >-
            You mark my words. Nana has been filling their heads with this nonsense. It's exactly the sort of idea a dog would come up with. Ignore it, and soon they'll forget all about it.
        - id: ch04-b11
          speaker: narrator
          text: >-
            They did not forget. Before long, that troublesome boy gave Mrs. Darling a real shock.

            Children have the oddest adventures and think nothing of them. A whole week after a walk in the woods, they might casually mention that they met their dead father there and played a game with him. That was how Wendy made her troubling announcement one morning.

            Mrs. Darling had found leaves from a tree on the nursery floor. They had certainly not been there when the children went to bed. As she puzzled over them, Wendy gave a patient little smile.
        - id: ch04-b12
          speaker: wendy
          text: "I suppose Peter has been here again."
        - id: ch04-b13
          speaker: mrs_darling
          text: "Wendy, what are you talking about?"
        - id: ch04-b14
          speaker: wendy
          text: "He really should wipe his feet before he comes in."
        - id: ch04-b15
          speaker: narrator
          text: >-
            Wendy sighed because she was a tidy child. Then she explained the whole thing as if it were perfectly ordinary. She thought Peter sometimes came into the nursery at night, sat at the foot of her bed, and played his pipes for her. Unfortunately, she never woke up. Once again, she could not say how she knew. She just knew.
        - id: ch04-b16
          speaker: mrs_darling
          text: "What nonsense, darling. Nobody can enter this house without knocking."
        - id: ch04-b17
          speaker: wendy
          text: "I think he comes through the window."
        - id: ch04-b18
          speaker: mrs_darling
          text: "But, my love, we're three floors above the ground."
        - id: ch04-b19
          speaker: wendy
          text: "Didn't you find the leaves right beside the window, Mother?"
        - id: ch04-b20
          speaker: narrator
          text: >-
            That was true. The leaves had been lying very close to the window.

            Mrs. Darling did not know what to believe. Wendy spoke so naturally that her mother could not simply call it a dream.
        - id: ch04-b21
          speaker: mrs_darling
          text: "My child, why didn't you tell me sooner?"
        - id: ch04-b22
          speaker: wendy
          text: "I forgot."
        - id: ch04-b23
          speaker: narrator
          text: >-
            Wendy said it lightly. She was in a hurry to eat breakfast.

            Surely she had only been dreaming.

            And yet there were the leaves. Mrs. Darling studied them closely. They were skeleton leaves, and she was certain they came from no tree that grew in England. Holding a candle, she crawled over the floor and searched for the marks of an unfamiliar foot. She rattled the poker up the chimney and tapped on the walls. Then she lowered a measuring tape from the window to the street. It was a straight drop of thirty feet, with not even a drainpipe to climb.

            Wendy must have been dreaming.

            But she had not been dreaming. The very next night proved it. That was the night when the children's extraordinary adventures may truly be said to have begun.
    - id: ch05
      title: Peter Breaks Through
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            On that night, all three children were once again in bed. Nana had the evening off, so Mrs. Darling had bathed them herself. She sang until, one by one, they let go of her hand and slipped away into sleep.

            They looked so safe and comfortable that she smiled at her earlier fears. Then she settled peacefully beside the fire with her sewing.

            She was making something for Michael, who would begin wearing shirts on his birthday. The fire was warm, and three night-lights gave the nursery a dim glow. Soon the sewing rested forgotten in Mrs. Darling's lap. Her head began to nod, ever so gracefully. She was asleep.

            Picture all four of them. Wendy and Michael are over there, John is here, and Mrs. Darling sits by the fire. There should have been one more night-light.

            As Mrs. Darling slept, she dreamed. In the dream, the Neverland had come too close, and a strange boy had broken through from it. He did not frighten her. She thought she had seen him before in the faces of many women who had no children. Perhaps he could also be found in the faces of some mothers.

            In the dream, the boy tore open the thin veil that hid the Neverland. Through the opening, Mrs. Darling saw Wendy, John, and Michael peeking in.

            The dream alone would have meant very little. But while she dreamed, the nursery window blew open, and a boy really did drop onto the floor. A strange light came with him. It was no larger than your fist, and it darted around the room like something alive. I think that moving light was what woke Mrs. Darling.

            She sprang up with a cry and saw the boy. Somehow, at once, she knew he was Peter Pan. If you or I or Wendy had been there, we would have seen that he looked very much like the kiss at the corner of Mrs. Darling's mouth.

            He was a beautiful boy, dressed in skeleton leaves and the sap that oozes from trees. But the most wonderful thing about him was that he still had every one of his first teeth. When he saw that Mrs. Darling was a grown-up, he bared those little pearls and gnashed them at her.
