audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    mrs_darling:
      display_name: 达林太太
      tts:
        delivery: 温柔慈爱，惊讶时仍不失柔和
        timbre: 甜美温润
        pace: 舒缓自然
        pitch: 中音
    mr_darling:
      display_name: 达林先生
      tts:
        delivery: 一本正经又容易慌乱，竭力维持体面
        timbre: 饱满清晰
        pace: 平时端正，算账时急促
        pitch: 中低音
  chapters:
    - id: ch01
      title: 两岁是结局的开端
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 所有孩子都会长大，只有一个孩子不会。孩子们很快就会懂得，自己迟早也要长大。温迪两岁那年，有一天在花园里摘了一朵花，拿着它跑去找妈妈。她一定可爱极了，因为达林太太忽然把手按在心口，叫了起来。
        - id: ch01-b02
          speaker: mrs_darling
          text: 唉，你为什么不能永远都是现在这个样子呢！
        - id: ch01-b03
          speaker: narrator
          text: 母女俩只说过这么一句，温迪却从此知道，自己非长大不可。人过了两岁就会知道这件事。两岁，就是结局的开端。达林一家当然住在十四号。温迪还没有出生时，家里最要紧的是达林太太。她长得很美，爱幻想，嘴角总带着甜甜的笑意，也总像在打趣谁。她的心像神秘东方来的套盒，打开一只，里面还有一只，怎么也开不到头。她右边嘴角还藏着一个吻，人人看得见，温迪却怎么也拿不到。
        - id: ch01-b04
          speaker: narrator
          text: 当年有许多绅士同时发现自己爱上了她，纷纷跑来求婚。达林先生和别人不同，他叫了马车，抢先赶到，于是娶到了她。她的一切都成了他的，除了心底最小的那只盒子，还有嘴角那个吻。他不知道盒子的秘密，后来也不再争那个吻。温迪觉得拿破仑准能得到，可我倒觉得，拿破仑试过以后也会大发脾气，摔门就走。
        - id: ch01-b05
          speaker: narrator
          text: 达林先生常向温迪夸口，说她母亲不但爱他，还十分敬重他。他属于那种深不可测、仿佛很懂股票和证券的人。其实这种事谁也不真懂，不过他说起股票涨了、证券跌了，那副笃定的神气确实足以叫任何女人肃然起敬。
        - id: ch01-b06
          speaker: narrator
          text: 达林太太穿着白衣裳出嫁。刚结婚时，她把家里的账记得又准又快活，连一颗抱子甘蓝也不会漏掉。后来，账本里整棵整棵的花椰菜不见了，空出来的地方画满没有五官的婴儿。她本该加账，却忍不住猜想未来的孩子会是什么模样。
        - id: ch01-b07
          speaker: narrator
          text: 先出生的是温迪，然后是约翰，最后是迈克尔。温迪刚出生的头一两个星期，达林夫妇还不知道家里养不养得起她。多一个孩子，就多一张吃饭的嘴。达林先生骄傲得不得了，可他讲原则。他坐在妻子床边，一手握住她，一手用纸笔算开销。达林太太眼巴巴地望着他，只想不管怎样都把孩子留下。可达林先生不能凭感情办事。谁要在他算账时插一句话，他就得从头再算。
        - id: ch01-b08
          speaker: mr_darling
          text: 好了，求你别打岔。
        - id: ch01-b09
          speaker: mr_darling
          text: 我这里有一镑十七先令，办公室还有两先令六便士。办公室的咖啡可以不喝，省下十先令，就是两镑九先令六便士。加上你的十八先令三便士，成了三镑九先令七便士。支票簿里还有五镑，那就是八镑九先令七便士。谁在动？八镑九先令七便士，点一下，进七。亲爱的，别说话。还有你借给那个上门来的人的一镑。孩子，安静。点一下，进孩子……瞧，你害我全乱了！我说的是九镑九先令七便士，对不对？对，就是这个数。现在只要弄清楚，我们靠九镑九先令七便士能不能过上一年。
        - id: ch01-b10
          speaker: mrs_darling
          text: 当然能，乔治！
        - id: ch01-b11
          speaker: narrator
          text: 她自然偏心温迪。不过他们两个人里，气度更不凡的其实是达林先生。
        - id: ch01-b12
          speaker: mr_darling
          text: 腮腺炎可别忘了。我记了一镑，但说不定要花三十先令。先别说话。麻疹一镑五先令，风疹半基尼，加起来是两镑十五先令六便士。手指别晃。百日咳嘛，算十五先令。
        - id: ch01-b13
          speaker: narrator
          text: 他算了一遍又一遍，每次的总数都不一样。最后，温迪勉强过了关，办法是把腮腺炎减到十二先令六便士，再把麻疹和风疹当成同一种病。约翰出生时也这样紧张了一回，迈克尔更是险些没能留下。不过两个孩子到底都留下了。不久，三个孩子已经能排成一队，在保姆陪伴下去富尔瑟姆小姐的幼儿园了。
    - id: ch02
      title: 最称职的保姆
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 达林太太喜欢家里处处妥帖，达林先生又坚持和邻居一样体面，所以他们必须有保姆。只是孩子们喝牛奶喝得太多，家里穷了，请不起普通保姆，便雇了一条端庄的纽芬兰犬。她叫娜娜，从前不属于任何人，却一直把照看孩子当成大事。达林一家在肯辛顿花园认识了她。她总爱往婴儿车里看，发现保姆粗心，还会一路跟回家，向女主人告状，因此那些保姆都恨她。
        - id: ch02-b02
          speaker: narrator
          text: 娜娜实在是难得的好保姆。她给孩子洗澡时，样样都做得周到。到了半夜，只要哪个孩子发出一点哭声，她马上便会起来。她的狗窝当然就放在育儿室里。哪种咳嗽不必理会，哪种咳嗽要拿长袜裹住喉咙，她一听便知道。她到老都相信大黄叶那些旧式方子，听人说起病菌之类的新鲜理论，就会从鼻子里发出轻蔑的哼声。
        - id: ch02-b03
          speaker: narrator
          text: 看她送孩子们上学，真能学会什么叫规矩。孩子好好走路，她就庄重地陪在一边。谁走歪了，她便用脑袋把他顶回队伍。约翰踢足球那天，她一次也不会忘记带毛衣，嘴里还常衔着一把雨伞，以防半路下雨。学校地下室有一间保姆等候室。其他保姆全都坐在长凳上，只有娜娜趴在地板上，这就是她们唯一的差别。那些人故意装作看不见她，好像她的社会地位比自己低。娜娜却打心眼里瞧不起她们轻浮的闲谈。
        - id: ch02-b04
          speaker: narrator
          text: 达林太太的朋友来育儿室，娜娜总有些不高兴。可客人真的到了，她又会立刻脱下迈克尔原来的罩衫，给他换上镶蓝边的那一件，把温迪从头到脚收拾整齐，再猛扑到约翰跟前理好他的头发。没有哪间育儿室能管得更妥帖，达林先生心里明白，却还是不安地担心邻居会说闲话。毕竟，他得顾着自己在城里的身份。
        - id: ch02-b05
          speaker: narrator
          text: 还有一件事叫他不舒服。他总觉得娜娜不敬佩自己。
        - id: ch02-b06
          speaker: mrs_darling
          text: 乔治，她当然敬佩你，而且敬佩得不得了。
        - id: ch02-b07
          speaker: narrator
          text: 说完，达林太太便向孩子们使眼色，要他们对父亲格外亲热。于是大家快活地跳起舞来。有时，家里唯一的另一个佣人莉莎也获准加入。她穿着长裙，戴着女仆帽，看起来小小的，虽然受雇时曾发誓自己早就过了十岁。嬉闹中最开心的是达林太太。她飞快旋转，快得人们只能看清她嘴角那个吻。这时若扑过去，也许真能把吻捉住。彼得·潘还没有到来，世上从没有比这一家人更简单、更幸福的了。
    - id: ch03
      title: 孩子心里的梦幻岛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 达林太太第一次听说彼得，是在整理孩子们的心思时。每个好母亲都有这种夜间习惯。孩子睡着后，她会在他们心里翻找，把白天跑错地方的念头重新放好，让第二天早晨一切整整齐齐。你要是能醒着看见，一定觉得很有意思，不过你当然醒不了。
        - id: ch03-b02
          speaker: narrator
          text: 那情形就像整理一个个抽屉。母亲跪在那里，带着笑意慢慢查看你心里的东西，还会纳闷，你究竟是从世界上的哪个角落捡来了这个。她有甜蜜的发现，也有不大甜蜜的发现。这个可爱得像一只小猫，她便贴到自己的脸颊上。那个得赶紧藏起来，她就匆匆塞到看不见的深处。等你早晨醒来，昨夜带上床的淘气念头和坏脾气已经叠得小小的，压在心底。那些更美好的心思晾得清清爽爽，铺在最上面，正等着你把它们穿起来。
        - id: ch03-b03
          speaker: narrator
          text: 你见过心灵地图吗？医生会画身体各处的图，可要他们画孩子的心，那就难了。孩子的心既乱，又不停地转。图上的曲线像体温表，也许正是岛上的路，因为梦幻岛通常是一座岛。岛上泼着鲜艳的色彩，有珊瑚礁，也有远处那些模样可疑的船。还有野人、隐秘的巢穴、几乎全做裁缝的地精、河流穿过的洞穴、上面有六个哥哥的王子、快倒塌的小屋，以及一个身材很小、鼻子弯弯的老太太。
        - id: ch03-b04
          speaker: narrator
          text: 如果只有这些，地图还不难画。偏偏里面又混着上学第一天、宗教、父亲、圆池塘、针线活、谋杀和绞刑，还有支配与格的动词、吃巧克力布丁的日子、穿背带裤、数到九十九，以及自己拔牙挣到的三便士。也许它们属于岛，也许是另一张地图从下面透了出来。更麻烦的是，没有一样东西肯停住。
        - id: ch03-b05
          speaker: narrator
          text: 每个人的梦幻岛自然很不一样。约翰的岛上有一片潟湖，火烈鸟从湖面飞过，他正举枪朝它们射击。迈克尔年纪还小，他的岛便把这一切颠倒过来，成了潟湖在一只火烈鸟头顶飞。约翰住在沙滩上一条翻扣的船里，迈克尔住在印第安圆锥帐篷里，温迪则住在一间用树叶巧巧缝成的屋子里。约翰一个朋友也没有，迈克尔的朋友只在夜里出现，温迪养着一只被父母遗弃的狼。
        - id: ch03-b06
          speaker: narrator
          text: 不过这些岛到底像一家人。要是它们肯安安静静排成一行，你会发现它们有相同的鼻子，或是别的相似地方。在那些神奇的岸边，玩耍的孩子永远驾着小圆舟靠岸。我们也曾去过那里。如今还能听见那里的海浪声，却再也不能上岸。梦幻岛是所有可爱岛屿里最舒适、最紧凑的一座。它一点也不松散，两场冒险不会隔着漫长无聊的路，一切都恰好挤在一起。白天用椅子和桌布把它搭出来玩，它一点也不可怕。可临睡前的那两分钟，它却会变得真实无比。所以，孩子们才需要小夜灯。
    - id: ch04
      title: 彼得留下的树叶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 达林太太在孩子们心里走来走去，偶尔会碰见自己看不懂的东西。最叫她困惑的是“彼得”这个名字。她不认识彼得，可约翰和迈克尔心里都有他，温迪心里更到处写着他。这个名字比别的字都粗、都醒目，还透出一股神气活现的劲儿。
        - id: ch04-b02
          speaker: wendy
          text: 是呀，他确实有点神气。
        - id: ch04-b03
          speaker: narrator
          text: 温迪不大情愿地承认。母亲接着问她。
        - id: ch04-b04
          speaker: mrs_darling
          text: 可他是谁呢，宝贝？
        - id: ch04-b05
          speaker: wendy
          text: 他就是彼得·潘呀，妈妈，你不是知道吗？
        - id: ch04-b06
          speaker: narrator
          text: 达林太太起先不知道，可回想起童年，她终于记得有一个彼得·潘，据说和仙子们住在一起。关于他一直流传着一些古怪的故事。有人说，孩子死去时，他会陪他们走上一段路，免得他们心里害怕。她小时候相信彼得真的存在。结婚以后，她觉得自己满脑子都是明白事理的念头，反倒怀疑世上是否真有这个人了。
        - id: ch04-b07
          speaker: mrs_darling
          text: 再说，他现在也早该长大了。
        - id: ch04-b08
          speaker: wendy
          text: 不会的，他没有长大。他就和我一样大。
        - id: ch04-b09
          speaker: narrator
          text: 温迪说的是身量和心思都一样大。她说不出自己为什么知道，却确信无疑。达林太太把这事告诉丈夫，他只是笑着摆了摆手。
        - id: ch04-b10
          speaker: mr_darling
          text: 你记着我的话。这准是娜娜灌进他们脑子里的胡思乱想，只有狗才想得出来。别去管它，过一阵就没事了。
        - id: ch04-b11
          speaker: narrator
          text: 可事情并没有过去。没多久，那个麻烦的男孩就让达林太太吃了一惊。孩子遇上再离奇的事也不在意。他们甚至会隔了一星期才提起，那天在树林里见到死去的父亲，还跟他玩了一场。温迪也是这样，在一个早晨若无其事地说出了可怕的秘密。
        - id: ch04-b12
          speaker: narrator
          text: 育儿室地上出现几片树叶。孩子上床时，那里明明没有。达林太太正对着叶子发愁，温迪却宽容地笑了。
        - id: ch04-b13
          speaker: wendy
          text: 我看又是那个彼得干的。
        - id: ch04-b14
          speaker: mrs_darling
          text: 温迪，你这话是什么意思？
        - id: ch04-b15
          speaker: wendy
          text: 他进屋居然不擦脚，实在太不应该了。
        - id: ch04-b16
          speaker: narrator
          text: 温迪叹了口气。她一向爱整洁。她很平常地解释说，彼得有时夜里会来到育儿室，坐在床脚给她吹笛子。可惜她从没醒过，所以不知道自己怎么会知道。反正她就是知道。
        - id: ch04-b17
          speaker: mrs_darling
          text: 宝贝，你说的什么傻话。谁要进这座房子，都得先敲门。
        - id: ch04-b18
          speaker: wendy
          text: 我想他是从窗户进来的。
        - id: ch04-b19
          speaker: mrs_darling
          text: 亲爱的，这里足足有四层楼高呀。
        - id: ch04-b20
          speaker: wendy
          text: 可那些树叶，不就是在窗户下面找到的吗，妈妈？
        - id: ch04-b21
          speaker: narrator
          text: 她说得没错，树叶离窗很近。温迪讲得太自然，达林太太没法简单说她在做梦。
        - id: ch04-b22
          speaker: mrs_darling
          text: 我的孩子，你怎么从来没告诉过我？
        - id: ch04-b23
          speaker: wendy
          text: 我忘了。
        - id: ch04-b24
          speaker: narrator
          text: 温迪说得轻轻松松，她还赶着去吃早饭呢。唉，这孩子一定是在做梦。可是，地上偏偏有那些叶子。达林太太仔细看过，那些叶子只剩叶脉，而且绝不是英国任何树木长出来的。她举着蜡烛，在地板上爬来爬去找陌生脚印，又把拨火棍伸进烟囱，弄得叮当作响，还敲了敲墙。她从窗口放下卷尺，直落到人行道，足有三十英尺。墙壁笔直，连一根能攀爬的水管也没有。
        - id: ch04-b25
          speaker: narrator
          text: 所以，温迪一定是在做梦。可是，她并没有做梦。第二天夜里的事马上证明了这一点。孩子们那些非同寻常的冒险，也正是从那一晚开始的。
    - id: ch05
      title: 男孩闯了进来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天晚上，孩子们又都躺在床上。娜娜恰好休假，达林太太亲自替他们洗澡，坐在床边唱歌。三个孩子一个接一个松开她的手，慢慢滑进梦乡。他们睡得那么安稳，那么舒服，她想起先前的担忧，不由得笑了。随后，她安心坐到炉火边，拿起针线。
        - id: ch05-b02
          speaker: narrator
          text: 她手里缝的是迈克尔要用的东西，因为迈克尔一过生日，就要从此改穿衬衫了。炉火暖融融的，育儿室里只亮着三盏小夜灯，朦胧的光落在孩子们身边。渐渐地，针线活落在达林太太膝头，她的脑袋优雅地一点一点，终于睡着了。瞧瞧这四个人吧，温迪和迈克尔睡在那边，约翰睡在这里，达林太太坐在火炉旁。屋里本来应该点着第四盏小夜灯。
        - id: ch05-b03
          speaker: narrator
          text: 达林太太做了一个梦。她梦见梦幻岛靠得太近，有个陌生男孩从岛上闯了进来。她并不害怕，因为许多没有孩子的女人脸上，似乎都曾出现过这个男孩。也许有些母亲脸上同样找得到他。梦里，男孩撕破了遮住梦幻岛的薄幕。温迪、约翰和迈克尔便从那道裂口里向外张望。
        - id: ch05-b04
          speaker: narrator
          text: 单有这个梦，本来只是一件微不足道的小事。可她正梦着，育儿室的窗户突然被风吹开，一个男孩真的从窗外落到地板上。跟他一起来的，还有一团不比你的拳头更大的奇异光亮。那团光像活的一样，在房间里飞来飞去。我想，正是它把达林太太惊醒了。
        - id: ch05-b05
          speaker: narrator
          text: 她惊叫一声，猛然从睡梦里抬起头，看见那个落在地板上的男孩。不知为什么，她立刻明白，他就是彼得·潘。假如你、我或者温迪当时也在场，一定会看出，他很像达林太太嘴角那个得不到的吻。他是个漂亮的男孩，衣裳由只剩叶脉的枯叶和树里渗出的汁液做成。最迷人的是，他嘴里的乳牙一颗也没有掉。他看出达林太太是个大人，便冲着她，把那一口珍珠似的小牙咬得咯咯作响。
