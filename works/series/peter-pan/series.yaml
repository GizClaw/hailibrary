cover_prompt: |-
  A wordless cover scene above Edwardian London shows a flying boy leading three children toward a distant fantastical island. The flying boy is slight with tousled brown hair and a rough green woodland tunic of leaves and cloth, the oldest child is a brown-haired girl in a pale blue 1900s nightdress, and her two younger brothers wear plain striped nightclothes. They fly past dark chimneys and a moonlit clock tower while far away an island holds a lagoon, dense woods, and a small sailing ship beneath stars. The flying boy reaches back to guide the girl through the air, making trust and flight the focal action. Use a sweeping upward three-quarter view with London low in the frame, a luminous path toward the island, and wide calm night sky across the top. Keep the scene wondrous and child-friendly, with no frightening figures. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
