  chapters:
    - id: ch01
      title: The Silent Tick
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Strange things can happen to us without our noticing right away. You may suddenly discover that one ear has been deaf for half an hour, though you cannot say when it began. Something like that happened to Peter that night. The last time we saw him, he was slipping across the island with a finger to his lips and his dagger ready. The crocodile had passed him, and at first Peter noticed nothing unusual. Then he remembered. It had not been ticking. The silence felt eerie until he guessed the truth. The clock had run down.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter did not stop to wonder how the crocodile felt after suddenly losing its closest companion. He only wondered how the disaster might help him. If he made the ticking sound himself, the wild animals would mistake him for the crocodile and leave him alone. So he began to tick, and he did it splendidly. But there was one result he had not expected. The crocodile heard him and came after him. Perhaps it hoped to get its lost ticking back. Perhaps it simply believed the sound was coming from itself again and followed as a friend. No one will ever know. The beast was too stupid, and it could think of only one idea at a time.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter reached the shore safely and kept going. His legs entered the water as if they had not noticed the change. Many animals move from land into water that way, but Peter is the only human I know who does it. As he swam, one thought filled his mind.
        - id: ch01-b04
          speaker: peter
          text: >-
            Hook or me this time.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He had been ticking for so long that he kept doing it without knowing. If he had realized, he would have stopped. It had never occurred to him that the ticking might help him board the brig.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Peter believed he had climbed the ship's side as quietly as a mouse. Then he saw the pirates crouching away from him, with Hook among them, just as terrified as if the crocodile were there.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The crocodile! The moment Peter remembered it, he heard the ticking. At first he thought the beast must be behind him and spun around to look. Then he understood that he was making the sound himself. In an instant, he saw exactly what was happening.
        - id: ch01-b08
          speaker: peter
          text: >-
            How clever I am!
        - id: ch01-b09
          speaker: narrator
          text: >-
            He signaled to the boys not to cheer.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Just then, Ed Teynte, the quartermaster, came out of the forecastle and crossed the deck. Take out your watch and time what followed. Peter's dagger struck deep and true. John clapped both hands over the doomed pirate's mouth, smothering his last groan. The man pitched forward, but four boys caught him before he could hit the deck. At Peter's signal, they threw the body overboard. There was one splash, and then silence. How long did that take?
        - id: ch01-b11
          speaker: slightly
          text: >-
            One!
        - id: ch01-b12
          speaker: narrator
          text: >-
            Peter disappeared into the cabin just in time, moving on the very tips of his toes. Several pirates were finally gathering enough courage to turn around. They could hear one another breathing hard, and that told them the more terrible sound had gone.
        - id: ch01-b13
          speaker: smee
          text: >-
            It's gone, Captain. Everything's quiet again.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Smee wiped his spectacles. Hook slowly raised his head out of his ruff and listened so fiercely that he might have caught even an echo of the tick. He heard nothing. At last he straightened himself to his full height. The boys had seen him lose his dignity, and he hated them for it more than ever.
        - id: ch01-b15
          speaker: hook
          text: >-
            Then here's to Johnny Plank!
        - id: ch01-b16
          speaker: hook
          text: >-
            Yo ho, yo ho, the lively plank! You walk along it, step by step, till down it goes, and down you go to Davy Jones below!
        - id: ch01-b17
          speaker: narrator
          text: >-
            Hook danced along an imaginary plank while he sang, twisting his face at the prisoners to frighten them. The performance cost him some dignity, but that did not stop him.
        - id: ch01-b18
          speaker: hook
          text: >-
            Would you like a taste of the cat before you walk the plank?
        - id: ch01-b19
          speakers: [tootles, slightly, nibs, john]
          ensemble: chorus
          text: >-
            No, no!
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: >-
            The children dropped to their knees and begged so pitifully that every pirate smiled.
    - id: ch02
      title: The Doodle-Doo in the Cabin
      blocks:
        - id: ch02-b01
          speaker: hook
          text: >-
            Jukes, fetch the cat. It's in the cabin.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The cabin! Peter was inside it. The children looked at one another.
        - id: ch02-b03
          speaker: bill_jukes
          text: >-
            Aye, aye, Captain.
        - id: ch02-b04
          speakers: [hook, mullins, noodler, cookson]
          ensemble: chorus
          text: >-
            Yo ho, yo ho, the scratching cat! It's got nine tails, you know, and when they write across your back—
        - id: ch02-b05
          speaker: narrator
          text: >-
            Jukes strode into the cabin, and every child watched him go, hardly aware that Hook and his pirates had begun singing. No one will ever know the final line. A dreadful scream suddenly burst from the cabin, swept across the ship, and faded away. Then came the sound of a boy crowing. The children knew that sound very well. To the pirates, it was almost worse than the scream.
        - id: ch02-b06
          speaker: hook
          text: >-
            What was that?
          emotion: surprised
        - id: ch02-b07
          speaker: slightly
          text: >-
            Two.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Slightly said it solemnly. Cecco, the Italian pirate, paused for a moment before swinging into the cabin. Soon he stumbled back out, his face gray and worn.
        - id: ch02-b09
          speaker: hook
          text: >-
            What's happened to Bill Jukes, you dog?
          emotion: angry
        - id: ch02-b10
          speaker: cecco
          text: >-
            Bill Jukes is dead. Somebody stabbed him.
          emotion: fearful
        - id: ch02-b11
          speakers: [starkey, mullins, cookson]
          ensemble: chorus
          text: >-
            Bill Jukes is dead!
          emotion: surprised
        - id: ch02-b12
          speaker: cecco
          text: >-
            The cabin's black as a pit. There's something horrible in there. It's the thing you heard crowing.
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: >-
            Hook saw the boys' delight. He also saw the dark looks passing among his own crew.
        - id: ch02-b14
          speaker: hook
          text: >-
            Cecco, go back in and bring me that doodle-doo.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Hook's voice had turned to steel. Cecco was one of the bravest pirates alive, but he shrank away from his captain.
        - id: ch02-b16
          speaker: cecco
          text: >-
            No. No, Captain!
          emotion: fearful
        - id: ch02-b17
          speaker: narrator
          text: >-
            Hook gently stroked his claw.
        - id: ch02-b18
          speaker: hook
          text: >-
            Did I hear you say you'd go, Cecco?
        - id: ch02-b19
          speaker: narrator
          text: >-
            Cecco threw up his arms in despair, then went. The singing had stopped. Everyone listened. Another death scream came from the cabin, followed by another crow.
        - id: ch02-b20
          speaker: slightly
          text: >-
            Three.
        - id: ch02-b21
          speaker: narrator
          text: >-
            No one else spoke. Hook made a sharp gesture to pull his crew together.
        - id: ch02-b22
          speaker: hook
          text: >-
            Death and odds fish! Who's going to bring me that doodle-doo?
          emotion: angry
        - id: ch02-b23
          speaker: starkey
          text: >-
            We wait until Cecco comes back out.
        - id: ch02-b24
          speaker: narrator
          text: >-
            The rest of the pirates growled their agreement.
        - id: ch02-b25
          speaker: hook
          text: >-
            Starkey, I believe I heard you volunteer.
        - id: ch02-b26
          speaker: starkey
          text: >-
            You did not!
          emotion: angry
        - id: ch02-b27
          speaker: hook
          text: >-
            My hook believes you did. Wouldn't it be wise to humor the hook?
        - id: ch02-b28
          speaker: starkey
          text: >-
            I'd rather hang than step inside that cabin.
        - id: ch02-b29
          speaker: narrator
          text: >-
            Again, the crew stood behind Starkey.
        - id: ch02-b30
          speaker: hook
          text: >-
            Is this a mutiny? And is Starkey leading it?
        - id: ch02-b31
          speaker: narrator
          text: >-
            Hook sounded more pleasant than ever. Starkey began to shake all over.
        - id: ch02-b32
          speaker: starkey
          text: >-
            Mercy, Captain!
          emotion: fearful
        - id: ch02-b33
          speaker: hook
          text: >-
            Shake hands with me, Starkey.
        - id: ch02-b34
          speaker: narrator
          text: >-
            Hook offered him the claw. Starkey searched the faces around him for help, but every pirate turned away. As Starkey backed up, Hook followed, and the red spark came into his eye. With one hopeless scream, Starkey jumped onto Long Tom and threw himself into the sea.
        - id: ch02-b35
          speaker: slightly
          text: >-
            Four.
        - id: ch02-b36
          speaker: hook
          text: >-
            Now then, did any other gentleman say mutiny?
        - id: ch02-b37
          speaker: narrator
          text: >-
            Hook picked up a lantern and raised his claw in warning.
        - id: ch02-b38
          speaker: hook
          text: >-
            I'll bring out that doodle-doo myself.
        - id: ch02-b39
          speaker: narrator
          text: >-
            He rushed into the cabin. Slightly wet his lips, eager to say five. But Hook staggered back out without the lantern.
        - id: ch02-b40
          speaker: hook
          text: >-
            Something put out the light.
        - id: ch02-b41
          speaker: mullins
          text: >-
            Something?
          emotion: surprised
        - id: ch02-b42
          speaker: noodler
          text: >-
            What happened to Cecco?
        - id: ch02-b43
          speaker: hook
          text: >-
            He's dead, just like Jukes.
        - id: ch02-b44
          speaker: narrator
          text: >-
            Hook clearly did not want to go back inside, and the crew did not like that at all. Angry muttering began again. Pirates are always superstitious.
        - id: ch02-b45
          speaker: cookson
          text: >-
            They say the surest sign of a cursed ship is one extra person aboard, someone nobody can account for.
        - id: ch02-b46
          speaker: mullins
          text: >-
            I've heard he always comes aboard a pirate ship last. Did he have a tail, Captain?
        - id: ch02-b47
          speaker: pirate_1
          text: >-
            And they say he looks like the wickedest man on the ship. Did he have a hook, Captain?
        - id: ch02-b48
          speakers: [mullins, noodler, cookson]
          ensemble: chorus
          text: >-
            The ship is doomed!
          emotion: fearful
        - id: ch02-b49
          speaker: narrator
          text: >-
            One after another, the pirates took up the cry. The children could hold back no longer and cheered. Hook had almost forgotten his prisoners, but when he whirled toward them, his face brightened with a new idea.
        - id: ch02-b50
          speaker: hook
          text: >-
            Listen, lads. Open the cabin and drive the boys inside. Let them fight the doodle-doo. If they kill it, good for us. If it kills them, that's good for us too.
        - id: ch02-b51
          speaker: narrator
          text: >-
            For the last time, the pirates admired their captain. They obeyed eagerly. The boys pretended to struggle as they were shoved into the cabin, and the door slammed shut behind them.
    - id: ch03
      title: Peter the Avenger
      blocks:
        - id: ch03-b01
          speaker: hook
          text: >-
            Now listen!
        - id: ch03-b02
          speaker: narrator
          text: >-
            Every pirate listened, but not one dared to look at the cabin door. Only Wendy faced it. She was still tied to the mast, and she was not waiting for a scream or a crow. She was watching for Peter to come out.
        - id: ch03-b03
          speaker: narrator
          text: >-
            She did not wait long. Peter had found what he went into the cabin to find: the key to the children's chains. Now all the boys slipped back onto the deck, carrying whatever weapons they had found. Peter signaled for them to hide, then cut Wendy free.
        - id: ch03-b04
          speaker: narrator
          text: >-
            They could easily have flown away together. But one thing kept Peter there. He had sworn, “Hook or me this time.” After freeing Wendy, he whispered for her to hide with the others. Then he took her place at the mast and wrapped himself in her cloak so that the pirates would mistake him for her. He filled his lungs and crowed.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The pirates heard that crow as a message. It told them every boy in the cabin was dead. Panic took hold of them. Hook tried to give them courage, but he had made them into dogs, and now they showed him their teeth. He knew they would spring at him the instant he looked away.
        - id: ch03-b06
          speaker: hook
          text: >-
            Lads, I've worked it out. There's a Jonah aboard.
        - id: ch03-b07
          speakers: [mullins, noodler, cookson]
          ensemble: chorus
          text: >-
            Aye. A man with a hook.
        - id: ch03-b08
          speaker: hook
          text: >-
            No, lads, no. It's the girl. A woman has never brought luck to a pirate ship. Once she's gone, we'll set things right.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Some of them remembered that Flint used to say the same thing.
        - id: ch03-b10
          speakers: [mullins, noodler, cookson]
          ensemble: chorus
          text: >-
            It might be worth a try.
        - id: ch03-b11
          speaker: hook
          text: >-
            Throw the girl overboard!
        - id: ch03-b12
          speaker: narrator
          text: >-
            The pirates rushed at the cloaked figure.
        - id: ch03-b13
          speaker: mullins
          text: >-
            Nobody can save you now, missy.
        - id: ch03-b14
          speaker: peter
          text: >-
            One person can.
        - id: ch03-b15
          speaker: mullins
          text: >-
            Who would that be?
        - id: ch03-b16
          speaker: peter
          text: >-
            Peter Pan the avenger!
        - id: ch03-b17
          speaker: narrator
          text: >-
            Peter threw off Wendy's cloak. At once the pirates knew who had been destroying them in the cabin. Hook tried twice to speak, and twice no words came. In that terrible moment, I think his fierce heart broke.
        - id: ch03-b18
          speaker: hook
          text: >-
            Cut him to the heart!
        - id: ch03-b19
          speaker: narrator
          text: >-
            The order came without conviction.
        - id: ch03-b20
          speaker: peter
          text: >-
            Come on, boys! Get them!
        - id: ch03-b21
          speaker: narrator
          text: >-
            A moment later, weapons clashed all over the ship. If the pirates had stayed together, they certainly would have won. But Peter's attack caught them while they were still shaken. They scattered across the deck and struck wildly, each pirate imagining he was the last one left alive.
        - id: ch03-b22
          speaker: narrator
          text: >-
            One against one, the pirates were stronger. But they only defended themselves, so the boys hunted in pairs and chose which pirate to attack. Some pirates jumped into the sea. Others hid in dark corners. Slightly found those. He did not fight. Instead, he ran around with a lantern and flashed it into their faces. Half blinded, they became easy targets for the other boys' bloody swords.
        - id: ch03-b23
          speaker: narrator
          text: >-
            Almost nothing could be heard except ringing steel, an occasional scream or splash, and Slightly counting in the same steady voice.
        - id: ch03-b24
          speaker: slightly
          text: >-
            Five. Six. Seven. Eight. Nine. Ten. Eleven.
        - id: ch03-b25
          speaker: narrator
          text: >-
            By then, I think every pirate but Hook was gone. The fierce boys closed around him, but he seemed to have a charmed life. They had defeated all his dogs, yet Hook alone could hold them off inside that circle of flashing blades. Again and again the boys rushed him. Again and again his sword carved out an empty space.
        - id: ch03-b26
          speaker: narrator
          text: >-
            Hook caught one boy on his claw and held him up like a shield. Then another boy leaped into the fight. He had just driven his sword through Mullins.
        - id: ch03-b27
          speaker: peter
          text: >-
            Put away your swords, boys. This man belongs to me.
        - id: ch03-b28
          speaker: narrator
          text: >-
            Suddenly Hook stood face-to-face with Peter. The other boys moved back and made a ring around them.
    - id: ch04
      title: Hook or Peter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The two enemies stared at each other for a long while. Hook trembled a little. Peter wore that strange smile of his.
        - id: ch04-b02
          speaker: hook
          text: >-
            So, Pan. You did all this.
        - id: ch04-b03
          speaker: peter
          text: >-
            Yes, James Hook. I did it all.
        - id: ch04-b04
          speaker: hook
          text: >-
            Proud, insulting boy, get ready to meet your end.
        - id: ch04-b05
          speaker: peter
          text: >-
            You dark, wicked man. Come fight me.
        - id: ch04-b06
          speaker: narrator
          text: >-
            They needed no more words. Their swords met, and for a while neither fighter gained an advantage. Peter was brilliant with a blade. His parries flashed almost too quickly to see. Again and again he fooled Hook with a false move, then thrust past the pirate's guard. But Peter's arm was shorter, and he could not drive his sword deep enough.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Hook was nearly as skillful, though his wrist was not quite as quick. The force of his attacks drove Peter backward. He hoped to finish the boy with a favorite thrust that Barbecue had taught him long ago in Rio. To his amazement, Peter turned it aside every time.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Hook moved in close and tried to finish Peter with the iron claw that had been reaching through the air all through the fight. Peter ducked under it. Then he lunged hard and pierced Hook between the ribs.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Hook saw his own blood. Its peculiar color had always disgusted him. His sword dropped from his hand, and now Peter had him at his mercy.
        - id: ch04-b10
          speakers: [tootles, slightly, nibs, john]
          ensemble: chorus
          text: >-
            Now!
        - id: ch04-b11
          speaker: narrator
          text: >-
            Peter answered with a magnificent gesture, inviting Hook to pick up his sword. Hook snatched it up at once. Yet the sight filled him with despair, because Peter was showing good form.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Until then, Hook had believed some fiend was fighting him. Now an even darker suspicion came over him.
        - id: ch04-b13
          speaker: hook
          text: >-
            Pan, who are you? What are you?
        - id: ch04-b14
          speaker: peter
          text: >-
            I'm youth. I'm joy. I'm a little bird that broke out of the egg.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Peter was only guessing, and of course his answer was nonsense. But it proved something dreadful to Hook. Peter had no idea who or what he was. That was the very highest peak of good form.
        - id: ch04-b16
          speaker: hook
          text: >-
            Fight me again!
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: >-
            Hook fought like a human flail. Each sweep of his terrible sword could have cut any man or boy in two. But Peter fluttered around him as if the wind from those mighty strokes kept blowing him safely out of reach. Over and over, Peter darted close and pricked him with his blade.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Hook had lost all hope. He no longer begged life from the world. He wanted only one thing before his fierce heart grew cold. He wanted to see Peter show bad form.
        - id: ch04-b19
          speaker: narrator
          text: >-
            Hook broke away and rushed into the powder magazine. There he lit the powder.
        - id: ch04-b20
          speaker: hook
          text: >-
            In two minutes, this ship will blow to pieces!
        - id: ch04-b21
          speaker: narrator
          text: >-
            Now, Hook thought, Peter's true form would reveal itself. But Peter walked out of the powder magazine holding the shell. Without any fuss, he tossed it overboard.
        - id: ch04-b22
          speaker: narrator
          text: >-
            And what kind of form was Hook showing? He was a misguided man, but we can be glad, without taking his side, that at the end he remained true to the traditions of his people.
        - id: ch04-b23
          speaker: narrator
          text: >-
            The other boys flew around him now, taunting him and laughing at him. Hook stumbled across the deck, striking uselessly into the air. But his mind was no longer on the ship. It wandered through the old playing fields. It was being honored at school, or watching the wall-game from a famous wall. And his shoes were right. His waistcoat was right. His tie was right. His socks were right.
        - id: ch04-b24
          speaker: narrator
          text: >-
            James Hook, you were not entirely without courage. Farewell.
        - id: ch04-b25
          speaker: narrator
          text: >-
            We have reached his final moment.
        - id: ch04-b26
          speaker: narrator
          text: >-
            Peter came slowly through the air, holding his dagger ready. Hook sprang onto the rail, meaning to throw himself into the sea. He did not know the crocodile was waiting below. We had stopped the clock on purpose, so that he would be spared that knowledge. It was our small sign of respect at the end.
        - id: ch04-b27
          speaker: narrator
          text: >-
            Hook won one last victory, and I do not think we should begrudge it. Standing on the rail, he looked back at Peter gliding toward him and made a gesture that invited Peter to use his foot. Peter kicked him instead of stabbing him.
        - id: ch04-b28
          speaker: narrator
          text: >-
            At last, Hook had received the one gift he wanted.
        - id: ch04-b29
          speaker: hook
          text: >-
            Bad form!
          emotion: happy
        - id: ch04-b30
          speaker: narrator
          text: >-
            He fell contentedly to the crocodile.
        - id: ch04-b31
          speaker: narrator
          text: >-
            And that was the end of James Hook.
    - id: ch05
      title: Half-Past One
      blocks:
        - id: ch05-b01
          speaker: slightly
          text: >-
            Seventeen!
        - id: ch05-b02
          speaker: narrator
          text: >-
            Slightly called out the number, but his count was not quite right. Fifteen pirates paid for their crimes that night. Two made it to shore. Starkey was captured by the redskins and put to work nursing all their babies, a sad fall for a pirate. Smee wandered the world from then on, still wearing his spectacles. He scraped together a living by claiming that he was the only man James Hook had ever feared.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Wendy had taken no part in the fighting, of course. She stood to one side and watched Peter with shining eyes. But once the battle ended, she became important again. She praised all the boys equally. When Michael showed her the place where he had killed a pirate, she gave a delightful shudder.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Then Wendy led them into Hook's cabin and pointed at his watch hanging from a nail. It was half-past one in the morning!
        - id: ch05-b05
          speaker: narrator
          text: >-
            Somehow, the late hour was almost the most astonishing thing that had happened. Wendy quickly sent the boys to sleep in the pirates' bunks. All of them went to bed except Peter. He strutted back and forth across the deck until at last he fell asleep beside Long Tom.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Peter had one of his dreams that night. He cried in his sleep for a long time, and Wendy held him tightly.
