audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而机敏的童话讲述
        timbre: 温暖清澈
        pace: 舒缓中有张力
        pitch: 中音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气果决，带着孩子气的自信
        timbre: 清亮灵动的少年声
        pace: 轻快敏捷
        pitch: 中高音
    hook:
      display_name: 胡克船长
      tts:
        delivery: 阴沉威严，讲究派头
        timbre: 冷硬深沉的成年男声
        pace: 徐缓而有压迫感
        pitch: 低音
    wendy:
      display_name: 温迪
      tts:
        delivery: 温柔镇定，关切而坚定
        timbre: 清澈柔和的少女声
        pace: 从容
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真勇敢，反应利落
        timbre: 清朗的男孩声
        pace: 中速
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，真诚热切
        timbre: 稚嫩明亮的男孩声
        pace: 稍快
        pitch: 高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 一本正经，略带得意
        timbre: 轻细的男孩声
        pace: 中速
        pitch: 中高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 老实热心，略显迟钝
        timbre: 柔和的男孩声
        pace: 稍慢
        pitch: 中高音
    smee:
      display_name: 斯密
      tts:
        delivery: 朴实随和，毫无机心
        timbre: 温厚的成年男声
        pace: 不紧不慢
        pitch: 中音
    cecco:
      display_name: 切科
      tts:
        delivery: 粗野强悍，惊惧时气息发颤
        timbre: 沙哑的成年男声
        pace: 中速
        pitch: 中低音
    starkey:
      display_name: 斯塔基
      tts:
        delivery: 凶横多疑，危急时慌乱
        timbre: 粗砺的成年男声
        pace: 稍快
        pitch: 中低音
    mullins:
      display_name: 马林斯
      tts:
        delivery: 阴狠迷信，带着讥诮
        timbre: 干涩的成年男声
        pace: 中速
        pitch: 中低音
    cookson:
      display_name: 库克森
      tts:
        delivery: 鲁莽挑衅，声气粗重
        timbre: 浑厚的成年男声
        pace: 中速
        pitch: 低音
    noodler:
      display_name: 诺德勒
      tts:
        delivery: 戒备急躁，问话短促
        timbre: 尖涩的成年男声
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十五章　这一次，不是胡克死，就是我亡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            人生里有些怪事，发生了好一阵，我们才忽然察觉。好比一只耳朵已经聋了，自己竟一直不知道。究竟聋了多久呢？姑且说有半个钟头吧。那天夜里，彼得也碰上了这样的事。我们上回见他时，他正竖起一根手指贴在嘴边，另一只手握着匕首，悄悄穿过岛屿。他亲眼看见鳄鱼从身边经过，当时却没觉得有什么不对。又走了一阵，他才猛然想起，那鳄鱼竟没有发出嘀嗒声。起初他觉得阴森，很快又猜到，是鳄鱼肚里的钟停了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            鳄鱼突然失去最亲密的伴侣，会有多难受，彼得一点也没想。他只想着怎么利用这场灾难。于是，他决定自己学起嘀嗒声，让林中的野兽以为鳄鱼来了，全都远远躲开，不敢碰他。他学得实在好极了，却没料到会有一个结果。鳄鱼也听见了这声音，竟一路跟在后面。它是想追回自己失去的东西呢，还是以为肚里的钟又响了，便把彼得当朋友跟着呢？谁也不会知道。它跟所有被一个念头牢牢拴住的家伙一样，实在是一头蠢兽。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得平安来到岸边，双腿碰到水也不停，仿佛没发现自己已经离开陆地。他就这么直接游了起来。我知道许多动物能这样做，可人类里只有彼得。他脑中只有一句话。
        - id: ch01-b04
          speaker: peter
          text: >-
            这一次，不是胡克死，就是我亡。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他嘀嗒得太久，根本没发觉自己还在响。要是知道，他一定会停下。借着嘀嗒声登上双桅船，的确是个妙计，可这主意压根儿没有进过他的脑袋。他还以为自己像老鼠一样，没发出半点声响就爬上了船舷。可海盗们全缩成一团，胡克夹在他们中间，也卑微得不成样子，活像听见了鳄鱼。彼得看着这一切，简直惊奇极了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            一想到鳄鱼，彼得便听见了嘀嗒声。他猛然回头，还以为鳄鱼就在身后，随即才发现声音来自自己。转眼间，他全明白了。
        - id: ch01-b07
          speaker: peter
          text: >-
            我可真聪明！
        - id: ch01-b08
          speaker: narrator
          text: >-
            他赶紧朝男孩们打手势，叫他们别喝彩。就在这时，大副埃德·坦特从艏楼出来，沿甲板走来。读者，请你拿表计时。彼得一刀扎得又准又深，约翰捂住海盗的嘴，不让呻吟传出去。那人向前倒时，四个男孩接住了他。彼得一示意，他们就把尸体扔下船。扑通一声，四周又静了。你说，这用了多久？
        - id: ch01-b09
          speaker: slightly
          text: >-
            已经倒下一个了。
        - id: ch01-b10
          speaker: narrator
          text: >-
            彼得浑身都像踮着脚，及时闪进船舱。几个海盗已经在鼓起勇气，准备回头看了。现在，他们只听见彼此紧张的喘息，便知道那个更可怕的声音已经过去。
        - id: ch01-b11
          speaker: smee
          text: >-
            它走了，船长。什么动静也没有了。
        - id: ch01-b12
          speaker: narrator
          text: >-
            斯密擦着眼镜。胡克慢慢从皱领里探出头，仔细听着，连嘀嗒声的一点回音也不肯放过。确实一片寂静，他终于挺直身子。
        - id: ch01-b13
          speaker: hook
          text: >-
            那就为跳板杰克干一杯！哟嗬，哟嗬，跳板真快活。你沿着板儿走，板子一沉你也沉，沉到海鬼手！
        - id: ch01-b14
          speaker: narrator
          text: >-
            男孩们刚才见过他弯下腰的丑态，胡克因此比从前更加恨他们。他放开嗓子唱起恶毒的小调，还踩着一块想象出来的跳板，一边走，一边舞，一边冲俘虏挤眉弄眼。这样虽然损了几分身份，却能把他们吓得更厉害。等那支歌唱完，他还不肯罢休，又大声问他们。
        - id: ch01-b15
          speaker: hook
          text: >-
            走跳板以前，想不想先尝尝九尾猫鞭？
        - id: ch01-b16
          speakers: [john, michael, slightly, tootles]
          ensemble: chorus
          text: >-
            不要，不要！
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: >-
            孩子们可怜巴巴地跪下来，海盗们全笑了。
        - id: ch01-b18
          speaker: hook
          text: >-
            朱克斯，到船舱里把猫拿来。
        - id: ch01-b19
          speaker: narrator
          text: >-
            船舱！彼得正在里面！孩子们互相看着。朱克斯高高兴兴地应了声“是，船长”，大步走进去。他们一直盯着他，几乎没听见胡克又带着手下唱起来。
        - id: ch01-b20
          speakers: [hook, starkey, mullins, cookson]
          ensemble: chorus
          text: >-
            哟嗬，哟嗬，抓人的猫。九条尾巴甩得高，等它在你背上写完字——
        - id: ch01-b21
          speaker: narrator
          text: >-
            最后一句永远没人知道了。船舱里猛然传出一声惨叫，掠过整条船，渐渐消失。紧接着，又响起公鸡啼。男孩们都懂，海盗听了却觉得，这声音比惨叫更可怕。
        - id: ch01-b22
          speaker: hook
          text: >-
            那是什么？
          emotion: surprised
        - id: ch01-b23
          speaker: slightly
          text: >-
            已经倒下两个了。
        - id: ch01-b24
          speaker: narrator
          text: >-
            意大利人切科犹豫了一下，冲进船舱，又脸色灰败地踉跄出来。胡克逼到他面前。
        - id: ch01-b25
          speaker: hook
          text: >-
            比尔·朱克斯怎么了，你这条狗？
          emotion: angry
        - id: ch01-b26
          speaker: cecco
          text: >-
            他死了。叫刀捅死了。
          emotion: fearful
        - id: ch01-b27
          speakers: [starkey, mullins, cookson]
          ensemble: chorus
          text: >-
            比尔·朱克斯死了！
          emotion: surprised
        - id: ch01-b28
          speaker: cecco
          text: >-
            船舱里黑得像地狱的深坑。可里面有个吓人的东西，就是刚才打鸣的那个。
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: >-
            男孩们满脸欢喜，海盗们阴沉着脸，这些都没逃过胡克的眼睛。
        - id: ch01-b30
          speaker: hook
          text: >-
            切科，回去，把那只喔喔叫的东西给我抓出来。
        - id: ch01-b31
          speaker: narrator
          text: >-
            切科一向号称勇冠群雄，这时却缩在船长面前，连声喊着不肯进去。胡克没有立刻逼他，只低下头，像哄一只猫似的，温柔地对自己的铁钩咕噜了一阵。
        - id: ch01-b32
          speaker: hook
          text: >-
            切科，我是不是听见你说，你愿意进去？
        - id: ch01-b33
          speaker: narrator
          text: >-
            切科绝望地甩开双臂，还是进去了。歌声停了，所有人都屏息听着。又一声临死的惨叫传来，接着又是鸡啼。
        - id: ch01-b34
          speaker: slightly
          text: >-
            已经倒下三个了。
        - id: ch01-b35
          speaker: narrator
          text: >-
            只有斯莱特利开了口。胡克朝手下打个手势，要他们振作起来。
        - id: ch01-b36
          speaker: hook
          text: >-
            真是活见鬼了！谁去把那只喔喔叫的东西抓来？
          emotion: angry
        - id: ch01-b37
          speaker: starkey
          text: >-
            等切科出来再说。
        - id: ch01-b38
          speaker: narrator
          text: >-
            其余海盗也跟着叫嚷。
        - id: ch01-b39
          speaker: hook
          text: >-
            斯塔基，我好像听见你自告奋勇了。
        - id: ch01-b40
          speaker: starkey
          text: >-
            见鬼，我才没有！
          emotion: angry
        - id: ch01-b41
          speaker: hook
          text: >-
            我的铁钩觉得你有。顺着它的心意办，难道不更明智吗？
        - id: ch01-b42
          speaker: starkey
          text: >-
            我宁可上绞架，也不进那里。
        - id: ch01-b43
          speaker: narrator
          text: >-
            船员们又站到了斯塔基一边，胡克的口气反而越发和善。
        - id: ch01-b44
          speaker: hook
          text: >-
            这是要造反吗？斯塔基就是领头的！
        - id: ch01-b45
          speaker: starkey
          text: >-
            船长，饶命！
          emotion: fearful
        - id: ch01-b46
          speaker: hook
          text: >-
            握个手吧，斯塔基。
        - id: ch01-b47
          speaker: narrator
          text: >-
            胡克朝他伸出铁钩。斯塔基慌忙环顾四周，想找人帮忙，可刚才还支持他的海盗全抛下了他。他退一步，胡克便逼近一步，眼里那点红光也亮了起来。斯塔基知道无路可逃，绝望地尖叫一声，跃上长汤姆大炮，随即从炮上纵身跳进海里。
        - id: ch01-b48
          speaker: slightly
          text: >-
            已经倒下四个了。
        - id: ch01-b49
          speaker: hook
          text: >-
            还有哪位先生提过造反吗？这回我亲自去抓那只喔喔叫的东西。
        - id: ch01-b50
          speaker: narrator
          text: >-
            胡克彬彬有礼地说完，一把抓起提灯，又威吓似的扬起铁钩，飞快冲进船舱。斯莱特利多想数到“五个”啊。他舔湿嘴唇，早早等着那个时刻。可是这一次，他没能如愿。胡克跌跌撞撞地出来了，手里的提灯已经不见。
        - id: ch01-b51
          speaker: hook
          text: >-
            有个东西吹灭了灯。
          emotion: fearful
        - id: ch01-b52
          speaker: mullins
          text: >-
            有个东西！
          emotion: surprised
        - id: ch01-b53
          speaker: noodler
          text: >-
            切科到哪里去了？
        - id: ch01-b54
          speaker: hook
          text: >-
            他跟朱克斯一样死透了。
        - id: ch01-b55
          speaker: narrator
          text: >-
            胡克显然不肯再进船舱，这让手下全都看轻了他，甲板上又响起反叛的叫嚷。要知道，海盗个个迷信。库克森立刻想起了一种最不吉利的说法。
        - id: ch01-b56
          speaker: cookson
          text: >-
            人家都说，船上要是多出一个来路不明的家伙，那就是受了诅咒最确凿的兆头。
        - id: ch01-b57
          speaker: mullins
          text: >-
            我听说，他总是最后一个登上海盗船。船长，他长尾巴了吗？
        - id: ch01-b58
          speaker: starkey
          text: >-
            听说他一来，就会变成船上最邪恶的那个人。
        - id: ch01-b59
          speaker: cookson
          text: >-
            船长，他有铁钩吗？
        - id: ch01-b60
          speakers: [starkey, mullins, cookson, noodler]
          ensemble: chorus
          text: >-
            这条船完了！
          emotion: fearful
        - id: ch01-b61
          speaker: narrator
          text: >-
            海盗们一个接一个喊着船完了。孩子们再也忍不住，齐声欢呼。胡克刚才几乎已经忘了这些俘虏，现在猛然转身看向他们，一个恶毒的主意冒了出来，他的脸也跟着亮了。
        - id: ch01-b62
          speaker: hook
          text: >-
            伙计们，我有主意了。打开舱门，把孩子们赶进去，让他们跟那东西拼命。孩子们赢了，对我们有好处。那东西赢了，我们也没损失。
        - id: ch01-b63
          speaker: narrator
          text: >-
            海盗们最后一次佩服起胡克，立刻忠心照办。男孩们假装挣扎，被推进船舱，门也关上了。
        - id: ch01-b64
          speaker: hook
          text: >-
            现在，全都给我听着！
        - id: ch01-b65
          speaker: narrator
          text: >-
            大家全竖起耳朵，却谁也不敢面对舱门。只有一个人敢，那就是一直绑在桅杆上的温迪。她始终望着舱门。海盗在等惨叫或鸡啼，她等的却完全不同。她只盼望彼得从那里重新出现。
        - id: ch01-b66
          speaker: narrator
          text: >-
            她很快便等到了。彼得进船舱，本来就是为了找一件东西。他已经找到了，那是能打开孩子们镣铐的钥匙。大家获得自由，捡起能找到的武器，一个接一个悄悄出来。彼得先用手势让他们藏好，再割断温迪的绳子。这时，所有人只要一起飞走，再容易不过。可彼得还记得那句誓言，不是胡克死，就是他亡。他叫温迪也和大家藏在一起，自己披上她的斗篷，站在桅杆旁冒充她。随后，他深深吸足一口气，昂首啼叫。
        - id: ch01-b67
          speaker: narrator
          text: >-
            海盗听来，那声啼叫是在宣告，所有男孩都已经死在船舱里。他们顿时吓得魂都没了。胡克竭力想让他们振作，可这些人已经被他调教成恶犬，此刻反倒朝主人露出牙来。胡克仍没有退缩。他一面准备好言哄骗，一面准备随时动手。他也很清楚，只要把目光从他们身上移开，他们立刻就会扑向自己。
        - id: ch01-b68
          speaker: hook
          text: >-
            伙计们，我想明白了。船上有个带来灾祸的约拿。
        - id: ch01-b69
          speakers: [starkey, mullins, cookson, noodler]
          ensemble: chorus
          text: >-
            没错，是个长铁钩的家伙。
          emotion: angry
        - id: ch01-b70
          speaker: hook
          text: >-
            不，不是我，是那个女孩。女人上了海盗船，从来不会有好运。把她除掉，船就正常了。
        - id: ch01-b71
          speakers: [starkey, mullins, cookson]
          ensemble: chorus
          text: >-
            弗林特也这么说过。值得试试。
        - id: ch01-b72
          speaker: hook
          text: >-
            把那女孩扔下海！
        - id: ch01-b73
          speaker: narrator
          text: >-
            海盗们扑向斗篷里的人影。
        - id: ch01-b74
          speaker: mullins
          text: >-
            小妞，这回没人能救你了。
        - id: ch01-b75
          speaker: peter
          text: >-
            有一个人能。
        - id: ch01-b76
          speaker: mullins
          text: >-
            你说的是谁？
        - id: ch01-b77
          speaker: peter
          text: >-
            复仇者彼得·潘！
        - id: ch01-b78
          speaker: narrator
          text: >-
            彼得掀掉斗篷，海盗们终于知道是谁在船舱里收拾他们。胡克两次想开口，两次都没说出话。我想，就在那一刻，他那颗凶狠的心碎了。
        - id: ch01-b79
          speaker: hook
          text: >-
            把他劈到胸骨！
        - id: ch01-b80
          speaker: narrator
          text: >-
            这道命令连胡克自己都不再相信。
        - id: ch01-b81
          speaker: peter
          text: >-
            下来，男孩们，揍他们！
        - id: ch01-b82
          speaker: narrator
          text: >-
            刀剑声转眼响遍全船。海盗们要是聚在一起，本来一定能赢，可男孩们发动攻击时，他们还没从惊吓中缓过来，只会四处乱跑，胡乱劈砍。每个人都以为，自己已经是全船最后一个活着的海盗。单打独斗，他们比男孩更强，可他们只顾防守。这样一来，男孩们便能两人一组，慢慢挑选各自的对手。有些恶棍直接跳进海里，有些躲进黑暗的角落。斯莱特利没有参战，他提着一盏灯到处跑，找出藏起来的人，再把灯光猛照到他们脸上。海盗的眼睛被晃得半瞎，很快便倒在其他男孩沾血的刀剑下。整条船上，几乎只剩兵刃撞击声、偶尔的惨叫和落水声，还有斯莱特利毫无起伏的计数，五、六、七、八、九、十、十一。
        - id: ch01-b83
          speaker: narrator
          text: >-
            其余海盗大概都完了。一群杀红眼的男孩围住胡克，他却像有神灵护着，在一圈刀光里把他们全挡在外面。他的群狗已经被收拾干净，可这个人独自留下，仍抵得上所有男孩。大家一次次合围，他又一次次挥剑，在人群中劈出一块空地。他甚至用铁钩挑起一个男孩，把那孩子挡在身前当作盾牌。这时，另一个男孩刚刚把剑刺穿马林斯，马上转身跃进战团。
        - id: ch01-b84
          speaker: peter
          text: >-
            男孩们，把剑收起来。这个人是我的。
        - id: ch01-b85
          speaker: narrator
          text: >-
            胡克突然同彼得面对面了。其他人退后围成一圈。两个仇敌久久望着对方。胡克微微发抖，彼得脸上却带着那抹奇异的笑。
        - id: ch01-b86
          speaker: hook
          text: >-
            这么说，潘，这一切都是你干的。
        - id: ch01-b87
          speaker: peter
          text: >-
            不错，詹姆斯·胡克。全是我干的。
        - id: ch01-b88
          speaker: hook
          text: >-
            骄傲无礼的小子，准备受死吧。
        - id: ch01-b89
          speaker: peter
          text: >-
            阴险邪恶的家伙，接招吧。
        - id: ch01-b90
          speaker: narrator
          text: >-
            两人再不说话，挥剑战在一起，一时谁也占不到上风。彼得剑法高超，招架快得叫人眼花。他不时虚晃一下，紧接着挺剑直刺，穿过胡克的防守。可惜他的手臂太短，剑尖总也刺不到实处。胡克的剑法几乎同样精妙，只是手腕没有彼得那么灵活。他借着猛烈攻势的分量，一步步把彼得逼退，想突然使出自己最拿手的一刺，结束战斗。那一招是“烤肉叉”多年前在里约教他的，彼得却一次又一次把它挡开。胡克惊讶极了，只好再逼近过去，想用一直在空中抓挠的铁钩给彼得最后一击。彼得弯腰从钩下钻过，猛然挺剑刺进他的肋骨。胡克看见自己的血，又想起那种怪颜色一向令他厌恶，长剑顿时脱手落下，只能任彼得处置。
        - id: ch01-b91
          speakers: [john, michael, slightly, tootles]
          ensemble: chorus
          text: >-
            就是现在！
        - id: ch01-b92
          speaker: narrator
          text: >-
            彼得却气派十足地请对手捡起剑。胡克马上照办，心里悲凉地明白，彼得这样做很有风范。他原先以为自己在和恶魔交手，此刻却生出了更阴暗的疑虑。
        - id: ch01-b93
          speaker: hook
          text: >-
            潘，你到底是谁？你到底是什么？
        - id: ch01-b94
          speaker: peter
          text: >-
            我是青春，我是欢乐。我是一只刚从蛋壳里钻出来的小鸟。
        - id: ch01-b95
          speaker: narrator
          text: >-
            这当然是胡说。可不幸的胡克听来，它正好证明彼得根本不知道自己是谁，又是什么。而这恰恰是风范的最高峰。
        - id: ch01-b96
          speaker: hook
          text: >-
            我们接着再打！
        - id: ch01-b97
          speaker: narrator
          text: >-
            胡克绝望地挥起剑来，整个人像一把活的连枷。无论男人还是男孩，只要挡在那柄可怕的长剑前，都会被截成两段。彼得却在他四周轻轻飞舞，仿佛剑锋带起的风反倒把他吹出了险地。胡克每次扫过去，彼得都躲开，又一次次飞身逼近，用剑尖刺中他。胡克已经不指望活命了。那颗狂烈的心再也不求生，只求最后一件事。他要在心永远冷却以前，亲眼看见彼得做出一次有失风范的举动。
        - id: ch01-b98
          speaker: narrator
          text: >-
            他忽然放弃交战，冲进火药库点着火药。
        - id: ch01-b99
          speaker: hook
          text: >-
            再过两分钟，这条船就会炸成碎片！
        - id: ch01-b100
          speaker: narrator
          text: >-
            胡克心想，这下真正的风范总该显出来了。彼得却拿着炸弹走出火药库，镇定地把它扔进海里。
        - id: ch01-b101
          speaker: narrator
          text: >-
            那么，胡克自己又是什么风范呢？我们不必同情这个误入歧途的人，却可以庆幸，他最后没有辜负自己那一族的传统。男孩们飞在四周嘲弄他，他踉跄着穿过甲板，徒劳地挥剑向上砍，心却早已回到很久以前。它正懒洋洋走过旧日的运动场，或因表现优异被叫到校长面前，或坐在那堵著名的墙上看墙球赛。他的鞋子、背心、领带和袜子，全都穿得合乎规矩。
        - id: ch01-b102
          speaker: narrator
          text: >-
            詹姆斯·胡克，你并非全无英雄气概。永别了。因为我们已经来到你的最后一刻。
        - id: ch01-b103
          speaker: narrator
          text: >-
            胡克看见彼得举着匕首，从空中慢慢逼近，便跳上舷墙，准备投进大海。他不知道鳄鱼就在下面等着他。我们是故意停住那只钟的，为的是不让胡克提前知道自己的结局。这是到了最后，我们送给他的一点敬意。
        - id: ch01-b104
          speaker: narrator
          text: >-
            他还有最后一次胜利，我想，我们不必舍不得给他。胡克站在舷墙上，回头望着彼得从空中滑过来，又做了一个手势，邀请彼得用脚。这个手势果然奏效了。彼得没有用匕首刺他，而是一脚把他踢了下去。胡克终于得到自己一直渴望的恩赐。
        - id: ch01-b105
          speaker: hook
          text: >-
            有失风范。
        - id: ch01-b106
          speaker: narrator
          text: >-
            他讥讽地喊完，心满意足地落向鳄鱼。詹姆斯·胡克就这样死了。
        - id: ch01-b107
          speaker: slightly
          text: >-
            已经数到十七个了。
        - id: ch01-b108
          speaker: narrator
          text: >-
            斯莱特利唱歌似的报数，却算错了。那晚共有十五个海盗为自己的罪行付出代价，另有两个逃到了岸上。斯塔基后来被红人捉住，给他们所有的小娃娃做了保姆。对一个海盗来说，这样的下场真够可悲。斯密从此戴着眼镜四处流浪，逢人便说，自己是詹姆斯·胡克唯一害怕的人，靠这句话勉强过日子。
        - id: ch01-b109
          speaker: narrator
          text: >-
            温迪当然一直站在旁边，没有参加战斗，只用闪亮的眼睛看着彼得。等一切都结束，她又成了最要紧的人物。她把每个男孩都同样夸了一遍，谁也没有少。迈克尔指给她看自己杀死海盗的地方，她还恰到好处地打了个寒战。然后，她领着大家走进胡克的船舱，指给他们看钉子上挂着的怀表。表上显示的时间，竟然已经是一点半了！
        - id: ch01-b110
          speaker: narrator
          text: >-
            时间竟然已经这么晚了，对孩子们来说，这几乎比刚才所有惊心动魄的大事都更要紧。你可以相信，温迪很快便把他们赶到海盗的铺位上睡觉。只有彼得不肯去。他还在甲板上神气地来回踱步，最后才倒在长汤姆大炮旁睡着。那天夜里，他又做了那种梦，在睡梦中哭了很久。温迪一直紧紧抱着他，不曾松手。
