  chapters:
    - id: ch01
      title: The Pirate Ship
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One green light peered over Kidd's Creek near the mouth of the pirate river. It marked the place where the Jolly Roger lay low in the water. She was a wicked-looking brig, filthy from deck to hull, with something hateful in every beam. She looked like ground littered with torn feathers. This ship was the cannibal of the seas. She hardly needed that green eye standing watch, because the horror of her name kept everyone away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Night covered her like a blanket, and no sound aboard could have carried to shore. There was little sound anyway. The only pleasant one was the soft whir of the sewing machine where Smee sat working. He was always busy, always willing to help, and so perfectly ordinary that he was somehow pathetic. Perhaps the saddest thing was that Smee had no idea he was pathetic at all. Even strong men sometimes had to look away from him. On more than one summer evening, the sight of Smee had made Hook weep, though Smee never knew that either.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A few pirates leaned over the rail and breathed in the foul night air. Others sprawled beside barrels, passing the silent hours over games of dice and cards. The four who had carried the little house all the way to the ship lay exhausted and face down on deck. Even in their sleep they rolled skillfully from side to side whenever Hook passed, in case his claw should strike them without his even thinking about it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Hook paced the deck, deep in thought. What a mystery that man was. This should have been his hour of triumph. Peter had been removed from his path forever, and all the other boys were locked below, waiting to walk the plank. It was Hook's darkest deed since he had forced Barbecue to submit. You might expect success to fill him up like wind filling a sail and make him strut across the deck.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But there was no joy in his walk. He did not stagger beneath the weight of his victory or swell with pride. His steps moved to the same gloomy rhythm as his thoughts. Hook was deeply miserable.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He often felt this way when he was alone with his thoughts on the quiet ship at night. For all the pirates around him, he was terribly lonely. In fact, he never felt more alone than when his own dogs surrounded him. Hook considered every one of them beneath him.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Hook was not his real name. If his true identity were revealed, even now the whole country would blaze with the news. Anyone who knows how to read between the lines has probably guessed that he once attended a famous public school. Its traditions still hung on him like clothes, and clothes were a large part of those traditions. Even as a pirate, he thought it offensive to board a ship in the same outfit he had worn while fighting for it. He still walked with his old school's celebrated slouch, as though he had never left its grounds. More than anything else, he still cared passionately about good form.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Good form. No matter how far Hook had fallen, he believed that nothing else truly mattered. Deep inside him, rusty gates seemed to creak open. Through them came a stern tap, tap, tap, like a hammer sounding in the night when you cannot sleep. The same question always followed.
        - id: ch01-b09
          speaker: hook
          text: >-
            Have you shown good form today?
        - id: ch01-b10
          speaker: hook
          text: >-
            Fame! That shining prize is mine!
        - id: ch01-b11
          speaker: narrator
          text: >-
            But the tapping voice of his school answered from within him.
        - id: ch01-b12
          speaker: hook
          text: >-
            Is being famous for anything really good form?
        - id: ch01-b13
          speaker: hook
          text: >-
            I was the one man Barbecue feared, and even Flint was afraid of Barbecue.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The inner voice cut him down at once.
        - id: ch01-b15
          speaker: hook
          text: >-
            Barbecue and Flint? What school house were they in?
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then came the most troubling thought of all. Was it bad form even to think about good form?
        - id: ch01-b17
          speaker: narrator
          text: >-
            The question tortured him from within. It became a claw inside him, sharper than the iron one on his arm, and it kept tearing at him. Sweat streamed over his pale, waxy face in long streaks and soaked into his doublet. Again and again he dragged his sleeve across his face, but nothing could stop the flow. Ah, do not envy Hook.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He suddenly felt that death might come for him soon. It was as if Peter's terrible oath had climbed aboard the ship. Hook was overcome by a gloomy need to make his final speech before there was no time left.
        - id: ch01-b19
          speaker: hook
          text: >-
            Hook would have been better off with less ambition!
        - id: ch01-b20
          speaker: narrator
          text: >-
            Only in his darkest moments did he speak of himself as though he were someone else.
        - id: ch01-b21
          speaker: hook
          text: >-
            Not one little child to love me!
          emotion: sad
        - id: ch01-b22
          speaker: narrator
          text: >-
            That had never troubled him before. Perhaps the sewing machine put the thought into his head. For a long while he stared at Smee and muttered. Smee went peacefully on hemming, certain that every child feared him.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Feared Smee? Not one child on the brig that night feared him. They already loved him. He had said dreadful things and slapped them with his open hand because he could not bring himself to use his fist. The children had only clung tighter. Michael had even tried on Smee's spectacles.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Hook longed to tell poor Smee that the children found him lovable, but that seemed too cruel. Instead he worried at the mystery. Why did they love Smee? What could possibly make him lovable? Then a terrible answer came to Hook.
        - id: ch01-b25
          speaker: hook
          text: >-
            Good form?
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: >-
            Could the boatswain have good form without knowing it? That was the very best kind of all. Hook remembered the old rule about being chosen for Pop. A boy could not be eligible until he had proved that he did not know he had good form. Smee's complete innocence made the thought even harder to bear.
        - id: ch01-b27
          speaker: narrator
          text: >-
            With a furious cry, Hook lifted his iron hand over Smee's head. Yet he did not strike. One thought stopped him.
        - id: ch01-b28
          speaker: hook
          text: >-
            What would it be if I clawed a man just because he has good form?
        - id: ch01-b29
          speaker: hook
          text: >-
            Bad form!
        - id: ch01-b30
          speaker: narrator
          text: >-
            Hook could do nothing. He was miserable and dripping with sweat, and he folded forward like a flower cut from its stem.
        - id: ch01-b31
          speaker: narrator
          text: >-
            His men thought he would be out of the way for a while. Discipline vanished at once, and the pirates burst into a wild, drunken dance. Hook sprang upright. Every trace of human weakness disappeared as quickly as if someone had thrown a bucket of water over him.
        - id: ch01-b32
          speaker: hook
          text: >-
            Quiet, you scoundrels, or I'll drop anchor in every one of you!
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: >-
            The noise stopped at once.
        - id: ch01-b34
          speaker: hook
          text: >-
            Are all the children chained so they can't fly off?
        - id: ch01-b35
          speaker: pirate_1
          text: >-
            Aye, aye, Captain.
        - id: ch01-b36
          speaker: hook
          text: >-
            Then bring them up.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The miserable prisoners were dragged up from the hold and lined up before him, still chained so they could not fly away. Wendy alone was left below. For a while Hook acted as if the boys were not there. He lounged at ease, humming scraps of a rude song that were not entirely tuneless, while his fingers played with a pack of cards. Now and then the glow of his cigar threw a little color across his face.
        - id: ch01-b38
          speaker: hook
          text: >-
            Now, my fine fellows, six of you will walk the plank tonight. But I have places for two cabin boys. Which two will join me?
        - id: ch01-b39
          speaker: narrator
          text: >-
            Down in the hold, Wendy had warned them not to provoke Hook when they did not have to. So Tootles stepped forward with great politeness. He hated the thought of serving under such a man, but an instinct told him it would be safer to place the responsibility on someone who was not there. Tootles could be a rather silly boy, yet he knew what every child knows. Mothers are always willing to stand between their children and trouble. Children may look down on them for doing it, but they make constant use of it.
        - id: ch01-b40
          speaker: tootles
          text: >-
            You see, sir, I don't believe my mother would want me to become a pirate. Slightly, would your mother want that for you?
        - id: ch01-b41
          speaker: narrator
          text: >-
            Tootles gave Slightly a wink.
        - id: ch01-b42
          speaker: slightly
          text: >-
            I don't think she would.
          emotion: sad
        - id: ch01-b43
          speaker: narrator
          text: >-
            Slightly sounded almost sorry that the answer was no.
        - id: ch01-b44
          speaker: slightly
          text: >-
            What about your mother, Twin? Would she let you be a pirate?
        - id: ch01-b45
          speaker: twin_1
          text: >-
            I don't think she would either. Nibs, would your mother—
        - id: ch01-b46
          speaker: hook
          text: >-
            Enough of this chatter!
          emotion: angry
        - id: ch01-b47
          speaker: narrator
          text: >-
            Hook roared, and the boys who had spoken were dragged back into line. Then he turned to John.
        - id: ch01-b48
          speaker: hook
          text: >-
            You there. You look as though you have some courage. Haven't you ever wanted to be a pirate, lad?
        - id: ch01-b49
          speaker: narrator
          text: >-
            During mathematics preparation, John had sometimes felt exactly that wish. He was impressed that Hook had picked him out.
        - id: ch01-b50
          speaker: john
          text: >-
            I did once think I might call myself Red-handed Jack.
        - id: ch01-b51
          speaker: hook
          text: >-
            That's a fine name. Join us, and Red-handed Jack you shall be.
        - id: ch01-b52
          speaker: john
          text: >-
            What do you think, Michael?
        - id: ch01-b53
          speaker: michael
          text: >-
            What name would I get if I joined?
        - id: ch01-b54
          speaker: hook
          text: >-
            Blackbeard Joe.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Michael was naturally impressed.
        - id: ch01-b56
          speaker: michael
          text: >-
            What do you think, John?
        - id: ch01-b57
          speaker: narrator
          text: >-
            Michael wanted John to choose, while John wanted Michael to choose.
        - id: ch01-b58
          speaker: john
          text: >-
            If we join, can we still be loyal subjects of the King?
        - id: ch01-b59
          speaker: narrator
          text: >-
            Hook forced the answer through his teeth.
        - id: ch01-b60
          speaker: hook
          text: >-
            You would have to swear, "Down with the King."
        - id: ch01-b61
          speaker: narrator
          text: >-
            John might not have behaved very well until then, but now he shone. He struck the barrel in front of Hook with his fist.
        - id: ch01-b62
          speaker: john
          text: >-
            Then I won't join you!
        - id: ch01-b63
          speaker: michael
          text: >-
            Neither will I!
        - id: ch01-b64
          speaker: curly
          text: >-
            Rule Britannia!
        - id: ch01-b65
          speaker: narrator
          text: >-
            Curly's cry came out as a squeak. The furious pirates struck the boys across their mouths.
        - id: ch01-b66
          speaker: hook
          text: >-
            That settles your fate! Bring up their mother, and prepare the plank!
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: >-
            For all their brave answers, they were only boys. Their faces went white when they saw Jukes and Cecco setting the deadly plank in place and understood that Hook truly meant to use it. Still, when Wendy was brought up from the hold, they gathered themselves and tried to appear brave for her.
        - id: ch01-b68
          speaker: narrator
          text: >-
            I cannot tell you how much Wendy despised those pirates. The boys could see at least a little adventure in a pirate's life. Wendy saw only a ship that had not been cleaned in years. Every porthole was so grimy that a finger could have written "Dirty pig" across the glass, and Wendy had already written it on several. But when the boys crowded around her, she forgot everything except them.
        - id: ch01-b69
          speaker: hook
          text: >-
            Well, my beauty, you are about to watch your children walk the plank.
        - id: ch01-b70
          speaker: narrator
          text: >-
            His voice was sweet as syrup. For all his fine manners, the strain of his private thoughts had dirtied his ruff. Suddenly he realized that Wendy was staring at the stain. He tried to cover it with a quick movement, but she had already seen it.
        - id: ch01-b71
          speaker: wendy
          text: >-
            Are they going to die?
        - id: ch01-b72
          speaker: narrator
          text: >-
            The contempt in Wendy's look was so terrible that Hook nearly fainted.
        - id: ch01-b73
          speaker: hook
          text: >-
            They are.
          emotion: angry
        - id: ch01-b74
          speaker: hook
          text: >-
            Everyone be silent! Let a mother speak her last words to her children.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Hook gloated, but in that moment Wendy was magnificent. Her voice stayed firm.
        - id: ch01-b76
          speaker: wendy
          text: >-
            These are my last words, dear boys. I believe I have a message from your real mothers. They hope their sons will die like English gentlemen.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Even the pirates were struck silent. Tootles cried out wildly.
        - id: ch01-b78
          speaker: tootles
          text: >-
            I'll do what my mother hopes! What will you do, Nibs?
          emotion: fearful
        - id: ch01-b79
          speaker: nibs
          text: >-
            What my mother hopes. What about you, Twin?
        - id: ch01-b80
          speaker: twin_1
          text: >-
            What my mother hopes. John, what will—
        - id: ch01-b81
          speaker: narrator
          text: >-
            Hook had found his voice again.
        - id: ch01-b82
          speaker: hook
          text: >-
            Tie her up!
          emotion: angry
        - id: ch01-b83
          speaker: narrator
          text: >-
            Smee tied Wendy to the mast. As he worked, he whispered to her.
        - id: ch01-b84
          speaker: smee
          text: >-
            Listen, honey. Promise to be my mother, and I'll save you.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Not even for Smee would Wendy promise such a thing.
        - id: ch01-b86
          speaker: wendy
          text: >-
            I would almost rather not have any children at all.
          emotion: disgusted
        - id: ch01-b87
          speaker: narrator
          text: >-
            Sadly, not one boy was watching Wendy while Smee bound her to the mast. Every pair of eyes was fixed on the plank and the last short walk waiting for them. Only moments before, they had meant to face it like men. Now they could no longer even hope to meet it bravely. The power to think had gone from them completely. All they could do was stare at the plank and tremble.
        - id: ch01-b88
          speaker: narrator
          text: >-
            Hook smiled at them without opening his teeth and stepped toward Wendy. He meant to turn her face toward the plank and force her to watch the boys go over one by one. But he never reached her. He never heard the cry of pain he wanted to draw from her.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Instead, he heard something else.
