audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    hook:
      display_name: 胡克船长
      tts:
        delivery: 阴森而彬彬有礼，暴怒时仍带贵族式傲慢
        timbre: 深沉冷暗
        pace: 缓慢而有压迫感
        pitch: 低音
    smee:
      display_name: 斯密
      tts:
        delivery: 古怪和气，迟钝中带着殷勤
        timbre: 温厚略沙哑
        pace: 不紧不慢
        pitch: 中低音
    school_voice:
      display_name: 母校的声音
      tts:
        delivery: 严厉冷峻，像深夜里不肯停下的审问
        timbre: 干涩清晰
        pace: 缓慢刻板
        pitch: 中低音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，任性时理直气壮
        timbre: 柔软稚气
        pace: 短促活泼
        pitch: 高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自负爱表现，讲话总像比别人多懂一点
        timbre: 清脆偏亮
        pace: 轻快
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 淘气机灵，反应又快又直接
        timbre: 活泼清亮
        pace: 明快
        pitch: 中高音
    twin_1:
      display_name: 双胞胎哥哥
      tts:
        delivery: 乖顺谨慎，说话带一点迟疑
        timbre: 稚嫩清亮
        pace: 适中
        pitch: 中高音
    pirate_1:
      display_name: 海盗甲
      tts:
        delivery: 粗鲁顺从，回答船长时不敢迟疑
        timbre: 粗粝低沉
        pace: 利落
        pitch: 低音
    pirate_2:
      display_name: 海盗乙
      tts:
        delivery: 凶悍紧张，遇到异象时畏缩
        timbre: 沙哑厚重
        pace: 稍快
        pitch: 中低音
    pirate_3:
      display_name: 海盗丙
      tts:
        delivery: 野蛮服从，气势外强中干
        timbre: 浑厚暗哑
        pace: 适中
        pitch: 低音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
  chapters:
    - id: ch01
      title: 黑夜里的快乐的罗杰号
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 海盗河靠近河口的地方有一条基德溪。溪上一盏绿灯眯着眼，标出了“快乐的罗杰号”停泊的位置。这艘双桅横帆船低低压着水面，模样又邪又野。从肮脏的船壳到每一根横梁，没有一处不叫人厌恶，简直像一片铺满残破羽毛的土地。
        - id: ch01-b02
          speaker: narrator
          text: 她是海上的食人魔。其实不必让那只绿色的眼睛时时守望，单凭她名字带来的恐怖，就没人敢来侵犯。黑夜像毯子一样裹住她，船上的声音传不到岸边。那里本来也很安静。唯一还算悦耳的，是缝纫机转动的嗡嗡声。
        - id: ch01-b03
          speaker: narrator
          text: 斯密坐在机器前缝东西。他总是勤快又肯帮忙，平凡得不能再平凡，也可怜得不能再可怜。他最可怜的地方，大概正是自己一点也不知道。壮汉看见他也得赶紧扭开脸。夏夜里，他还不止一次触动胡克的泪泉，叫眼泪流出来。斯密对这件事，还有几乎别的一切，当然全无察觉。
        - id: ch01-b04
          speaker: narrator
          text: 几个海盗靠着舷墙，大口吸进夜里的瘴气。另一些人躺在木桶旁，掷骰子，打纸牌。那四个扛过小屋的家伙累坏了，趴在甲板上睡得正沉。即使在梦里，他们也能熟练地左右翻滚，躲开经过的胡克，免得船长顺手一钩抓伤他们。
        - id: ch01-b05
          speaker: narrator
          text: 胡克一面踱步，一面沉思。这个人实在深不可测。眼下明明是他大获全胜的时候。彼得永远从他的路上消失了，别的男孩都关在船舱里，很快就要走上跳板。这是他制服“烤肉叉”以后最残酷的一次胜利。既然人的皮囊里总装着那么多虚荣，换作别人，只怕早让成功的风吹得浑身鼓胀，连路都走不稳了。
        - id: ch01-b06
          speaker: narrator
          text: 可胡克的脚步里没有半点得意。他的步子和阴沉的念头一起起落，整个人沮丧到了极点。夜深以后，他独自在船上想心事，常会落到这种境地。他实在太孤独了。身边明明围着一群恶犬，他却偏偏在这时最觉孤单，因为他们的社会地位都不如他。
        - id: ch01-b07
          speaker: narrator
          text: 胡克并非他的真名。直到今天，公开他的真实身份，仍会震动全国。不过，能读出字里行间意味的人早该猜到了，他曾在一所有名的公学读书。学校的传统至今还像衣服一样黏在身上，而那些传统原本就大半同穿衣有关。
        - id: ch01-b08
          speaker: narrator
          text: 哪怕如今做了海盗，他也觉得，穿着同一套衣服登上一条船，再跟那条船搏斗，实在不够体面。走路时，他依旧保留着母校闻名的懒散姿态。最重要的是，他仍旧狂热地讲究风范。风范！不管胡克堕落到什么地步，他都明白，真正要紧的只有这个。
    - id: ch02
      title: 风范的折磨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 胡克听见内心深处吱呀一响，仿佛生锈的大门打开了。门后传来严厉的嗒、嗒、嗒声，像失眠的夜里有人拿锤子敲个不停。那个声音永远只问一句话。
        - id: ch02-b02
          speaker: school_voice
          text: 你今天做得有风范吗？
        - id: ch02-b03
          speaker: hook
          text: 名声！那闪闪发亮的小玩意儿，现在归我了！
        - id: ch02-b04
          speaker: school_voice
          text: 在任何事情上出了名，也算有风范吗？
        - id: ch02-b05
          speaker: hook
          text: 我可是唯一能叫“烤肉叉”害怕的人。连弗林特都怕“烤肉叉”。
        - id: ch02-b06
          speaker: school_voice
          text: “烤肉叉”？弗林特？他们是哪个学院的？
        - id: ch02-b07
          speaker: narrator
          text: 当然，回答他的并不是真正的海盗，而是母校留在他心里的声音。最使胡克不安的是另一个问题。总在心里琢磨风范，本身不也有失风范吗？这难题撕扯着他的五脏六腑，像一只藏在身体里的爪子，比铁钩还尖。
        - id: ch02-b08
          speaker: narrator
          text: 汗水从他蜡油般的脸上滴下来，把紧身上衣冲出一道道痕迹。他不断拿袖子去擦，可那股细流怎么也止不住。唉，千万别羡慕胡克。
        - id: ch02-b09
          speaker: narrator
          text: 他预感自己活不了多久了，好像彼得那句可怕的誓言已经登上了船。胡克忽然想发表临终演说，唯恐再过一会儿就没有机会。
        - id: ch02-b10
          speaker: hook
          text: 胡克当初要是少一点野心，反倒更好！
        - id: ch02-b11
          speaker: narrator
          text: 只有在最黑暗的时刻，他才用第三人称叫自己。
        - id: ch02-b12
          speaker: hook
          text: 连一个爱我的小孩子也没有！
        - id: ch02-b13
          speaker: narrator
          text: 奇怪的是，这件事从前从没烦过他，也许是缝纫机使他忽然想起。胡克盯着正在平静缝边的斯密，久久低声自语。斯密还一心以为，所有孩子都怕他，对船长心里的波浪半点也不知道。
        - id: ch02-b14
          speaker: narrator
          text: 怕斯密？那天晚上，船上没有一个孩子不喜欢他。他对孩子们说过吓人的话，也拿巴掌打过他们，因为他根本不会握拳打人。可他越是这样，孩子们反而越黏着他。迈克尔甚至还把他的眼镜拿来试戴。
        - id: ch02-b15
          speaker: narrator
          text: 胡克真想告诉可怜的斯密，说孩子们觉得他惹人喜爱，却又觉得这样做太残忍。于是他像追踪猎犬一样咬住了这个谜。孩子们为什么喜欢斯密？究竟是什么使他讨人喜欢？一个可怕的答案猛地跳了出来。
        - id: ch02-b16
          speaker: hook
          text: 难道是风范？
        - id: ch02-b17
          speaker: narrator
          text: 难道水手长自己毫不知情，却天生有着最好的风范？胡克记得，想获准加入“波普”，先得证明自己不知道自己有风范。他怒吼着举起铁钩，悬在斯密头顶，可终究没有抓下去。一个念头拦住了他。
        - id: ch02-b18
          speaker: hook
          text: 因为一个人有风范，就拿钩子抓他，那算什么？当然是有失风范！
        - id: ch02-b19
          speaker: narrator
          text: 可怜的胡克浑身湿透，又无能为力，像剪断的花一样向前倒下。手下见他一时管不了事，立刻松了规矩，跳起酒神般狂乱的舞。胡克顿时站直了，所有人性的软弱一扫而空，仿佛有人迎头浇了他一桶水。
        - id: ch02-b20
          speaker: hook
          text: 安静，你们这群卑贱东西！再闹，我就把锚下在你们身上！孩子们都锁好了吗？他们飞不走吧？
          emotion: angry
        - id: ch02-b21
          speakers: [pirate_1, pirate_2, pirate_3]
          ensemble: chorus
          text: 锁好了，船长！
        - id: ch02-b22
          speaker: hook
          text: 那就把他们提上来。
    - id: ch03
      title: 谁肯做海盗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 海盗把可怜的俘虏从底舱拖上来，只有温迪还留在下面。男孩们排成一列，站到胡克面前。过了好一会儿，胡克像是根本没看见他们，只舒舒服服地斜倚着。他一边哼几段粗野却不算难听的歌，一边摆弄手里的纸牌。雪茄的火光隔一阵闪一下，才给他的脸添上一点颜色。
        - id: ch03-b02
          speaker: hook
          text: 好啦，小子们。今晚，你们当中六个要走跳板。不过船上还缺两个见习水手。谁愿意留下？
        - id: ch03-b03
          speaker: narrator
          text: 温迪在底舱里嘱咐过他们，不要无缘无故惹怒胡克。于是嘟嘟礼貌地走上前。他根本不想投到这种人手下，却本能地觉得，最好把责任推到一个不在场的人身上。嘟嘟虽然有点傻，也知道母亲总肯替人挡灾。所有孩子都知道这一点，一面因此瞧不起母亲，一面又不停地利用她们。
        - id: ch03-b04
          speaker: tootles
          text: 先生，是这样的。我妈妈大概不会答应我当海盗。斯莱特利，你妈妈会答应吗？
        - id: ch03-b05
          speaker: narrator
          text: 嘟嘟朝斯莱特利眨了眨眼。
        - id: ch03-b06
          speaker: slightly
          text: 我想不会吧。
        - id: ch03-b07
          speaker: narrator
          text: 斯莱特利说得很伤心，仿佛倒盼着母亲答应。
        - id: ch03-b08
          speaker: slightly
          text: 双胞胎，你妈妈会让你当海盗吗？
        - id: ch03-b09
          speaker: twin_1
          text: 我看不会。尼布斯，你妈妈会不会——
        - id: ch03-b10
          speaker: hook
          text: 少说这些废话！
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 几个发言的孩子被拖回队伍。胡克转向约翰。
        - id: ch03-b12
          speaker: hook
          text: 你这小子看着倒还有点胆量。好伙计，你从来没想过当海盗吗？
        - id: ch03-b13
          speaker: narrator
          text: 约翰做数学预习时，偶尔还真动过这个念头。胡克偏偏从大家中挑中了他，也叫他有些心动。
        - id: ch03-b14
          speaker: john
          text: 我以前想过，给自己取个名字叫“血手杰克”。
        - id: ch03-b15
          speaker: hook
          text: 好名字！你肯入伙，我们以后就叫你“血手杰克”。
        - id: ch03-b16
          speaker: john
          text: 迈克尔，你觉得呢？
        - id: ch03-b17
          speaker: michael
          text: 要是我也入伙，你们会给我取什么名字？
        - id: ch03-b18
          speaker: hook
          text: 我们会叫你“黑胡子乔”。
        - id: ch03-b19
          speaker: narrator
          text: 迈克尔自然给打动了。他想叫约翰决定，约翰却也想让他拿主意。
        - id: ch03-b20
          speaker: michael
          text: 约翰，你说怎么办？
        - id: ch03-b21
          speaker: john
          text: 我们入伙以后，还能做国王忠诚恭敬的臣民吗？
        - id: ch03-b22
          speaker: hook
          text: 你们得发誓说：“打倒国王。”
        - id: ch03-b23
          speaker: narrator
          text: 约翰先前也许不算表现得很好，这一刻却忽然光彩照人。
        - id: ch03-b24
          speaker: john
          text: 那我不干！
        - id: ch03-b25
          speaker: narrator
          text: 他一拳重重敲在胡克面前的木桶上。
        - id: ch03-b26
          speaker: michael
          text: 我也不干！
        - id: ch03-b27
          speaker: curly
          text: 统治吧，不列颠尼亚！
        - id: ch03-b28
          speaker: narrator
          text: 海盗们暴怒起来，打了孩子们的嘴巴。
        - id: ch03-b29
          speaker: hook
          text: 这就决定了你们的命运！把他们的母亲带上来，把跳板架好！
          emotion: angry
        - id: ch03-b30
          speaker: narrator
          text: 他们终究只是孩子。看着比尔·朱克斯和切科架起夺命的跳板，人人的脸都白了。可是温迪被带上甲板时，他们还是努力装出勇敢的样子。
    - id: ch04
      title: 母亲最后的话
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我再怎么说，也说不尽温迪有多么鄙视那些海盗。男孩们至少还觉得海盗这个行当有几分迷人的光彩。温迪看见的却只有一件事，这条船显然好多年没有收拾了。每一扇舷窗都脏得能用手指写上“脏猪”，她已经在好几扇上写过了。当然，男孩们围到她身边以后，她只顾得上想他们。
        - id: ch04-b02
          speaker: hook
          text: 那么，小美人，你马上就能亲眼看着自己的孩子走跳板了。
        - id: ch04-b03
          speaker: narrator
          text: 他的声音甜得像糖浆。胡克虽然自认是位体面的绅士，方才那场内心挣扎却弄脏了他的皱领。他忽然发现温迪正在看那里，赶紧抬手遮掩，可已经迟了。
        - id: ch04-b04
          speaker: wendy
          text: 他们全都要死吗？
        - id: ch04-b05
          speaker: narrator
          text: 温迪眼里的轻蔑可怕极了，胡克差点当场昏过去。
        - id: ch04-b06
          speaker: hook
          text: 一个也活不了。全都安静！让这位母亲对孩子们说最后几句话。
        - id: ch04-b07
          speaker: narrator
          text: 这一刻，温迪显得无比高贵。她站得稳稳的，声音也没有动摇。
        - id: ch04-b08
          speaker: wendy
          text: 亲爱的孩子们，这是我最后一次对你们说话了。我觉得，你们真正的母亲托我带来了一句话。她们希望自己的儿子能像英国绅士一样死去。
        - id: ch04-b09
          speaker: narrator
          text: 连海盗都被震住。嘟嘟激动得叫了起来。
        - id: ch04-b10
          speaker: tootles
          text: 我要做到妈妈希望的事。尼布斯，你呢？
        - id: ch04-b11
          speaker: nibs
          text: 我也照妈妈希望的做。双胞胎，你呢？
        - id: ch04-b12
          speaker: twin_1
          text: 我也一样。约翰，你要——
        - id: ch04-b13
          speaker: hook
          text: 把她捆起来！
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 胡克终于找回了声音。斯密走过去，把温迪绑在桅杆上，还偷偷对她耳语。
        - id: ch04-b15
          speaker: smee
          text: 听着，宝贝儿。你只要答应做我的母亲，我就救你。
        - id: ch04-b16
          speaker: narrator
          text: 就算是为了斯密，温迪也不肯答应。
        - id: ch04-b17
          speaker: wendy
          text: 要我答应这个，我倒宁可一个孩子也没有。
        - id: ch04-b18
          speaker: narrator
          text: 令人难过的是，斯密把温迪捆上桅杆时，没有一个男孩在看她。所有人的眼睛都盯着跳板，那是他们一生就要走完的最后一小段路。他们原本还想像男子汉一样走过去，现在却连这个希望也没有了。思考的能力已经离开他们，他们只能瞪着眼睛发抖。
        - id: ch04-b19
          speaker: narrator
          text: 胡克紧咬着牙朝他们微笑，又向温迪走去。他要扳过她的脸，让她看着男孩们一个接一个走上跳板。他盼着从她喉咙里逼出痛苦的哭声。可胡克没能走到她面前。他听见了另一个声音。
    - id: ch05
      title: 可怕的嘀嗒声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那是鳄鱼可怕的嘀嗒声。海盗听见了，男孩听见了，温迪也听见了。所有人的脑袋一下转向同一个地方。他们没有去看声音传来的水面，全都看向胡克。人人都明白，接下来的事只和他有关。刚才他们还在戏里，这一刻却忽然全成了看戏的人。
        - id: ch05-b02
          speaker: narrator
          text: 胡克身上的变化实在吓人，好像每一个关节都给剪断了。他整个人软下去，瘫成小小的一堆。嘀嗒声稳稳逼近，比声音更早爬上船的，是一个可怕的念头。鳄鱼就要登船了。
        - id: ch05-b03
          speaker: narrator
          text: 连他的铁钩也无力地垂着，似乎知道袭击者真正想要的并不是它。胡克孤零零地落在甲板上，处境可怕得很。换作别人，只会闭紧眼睛，躺在摔倒的地方等候。可他巨大的脑袋还在转。在脑袋的指挥下，他双膝着地爬过甲板，能离那声音多远，就爬多远。
        - id: ch05-b04
          speaker: narrator
          text: 海盗们恭恭敬敬地让开一条路。胡克一直爬到撞上舷墙，才终于开口。
        - id: ch05-b05
          speaker: hook
          text: 把我藏起来！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: 海盗们围到他身边，把船长严严实实地藏起来。谁也不敢看那个正在登船的东西，更没有一个人想过抵抗。来的不是普通的敌人，而是命运。
        - id: ch05-b07
          speaker: narrator
          text: 胡克被他们遮住以后，好奇心才让男孩们僵硬的手脚重新活动。他们一齐冲到船边，想看鳄鱼怎样爬上来。随后，在这个奇异之夜，他们遇到了最奇异的惊喜。前来搭救他们的根本不是鳄鱼，而是彼得。
        - id: ch05-b08
          speaker: narrator
          text: 彼得向大家打了个手势，叫他们千万别惊喜出声，免得海盗起疑。
        - id: ch05-b09
          speaker: narrator
          text: 然后，他继续发出嘀嗒、嘀嗒的声音。
