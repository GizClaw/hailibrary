audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而机敏的童话讲述
        timbre: 温暖清澈
        pace: 舒缓中有张力
        pitch: 中音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气果决，带着孩子气的自信
        timbre: 清亮灵动的少年声
        pace: 轻快敏捷
        pitch: 中高音
    wendy:
      display_name: 温迪
      tts:
        delivery: 温柔镇定，关切而坚定
        timbre: 清澈柔和的少女声
        pace: 从容
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，真诚热切
        timbre: 稚嫩明亮的男孩声
        pace: 稍快
        pitch: 高音
    mrs_darling:
      display_name: 达林太太
      tts:
        delivery: 温柔慈爱，悲伤中含着坚韧
        timbre: 柔润的成年女声
        pace: 舒缓
        pitch: 中音
    mr_darling:
      display_name: 达林先生
      tts:
        delivery: 郑重自持，偶尔流露孩子气的虚荣
        timbre: 温厚的成年男声
        pace: 中速
        pitch: 中低音
    tink:
      display_name: 小叮当
      tts:
        delivery: 伶俐尖锐，爱吃醋又直截了当
        timbre: 细亮如铃的少女声
        pace: 快速
        pitch: 高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 老实热心，想到什么就说什么
        timbre: 朴实清亮的男孩声
        pace: 中速
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 爽快随和，答话干脆
        timbre: 活泼的男孩声
        pace: 稍快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自信又爱表现，语气利落
        timbre: 清脆的男孩声
        pace: 稍快
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 实在机灵，说话简洁
        timbre: 明朗的男孩声
        pace: 中速
        pitch: 中高音
    first_twin:
      display_name: 双胞胎哥哥
      tts:
        delivery: 自尊而有礼，紧张时仍很认真
        timbre: 清秀的男孩声
        pace: 中速
        pitch: 中高音
    jane:
      display_name: 简
      tts:
        delivery: 好奇聪敏，天真中带着笃定
        timbre: 清澈稚嫩的女孩声
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 男孩们有了家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            你一定也想知道，其余那些男孩后来怎么样了。他们留在楼下，让温迪先向父母说明来历。一直数到五百，他们才从楼梯走上去，因为觉得这样出场更体面。男孩们摘下帽子，在达林太太面前排成一行，心里只恨还穿着海盗衣裳。他们没有开口，一双双眼睛却都在求她收留。其实，他们也该望望达林先生，可是谁都把他忘了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            达林太太立刻答应下来。达林先生却闷闷不乐。男孩们看出来了，他觉得一下子多出六个孩子，实在不少。
        - id: ch01-b03
          speaker: mr_darling
          text: >-
            温迪，我得说，你办起事情来，从来不会只办一半。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这句话说得很勉强。双胞胎还以为，他是在影射他们两个。双胞胎哥哥自尊心最强，脸一下红了。
        - id: ch01-b05
          speaker: first_twin
          text: >-
            先生，您是不是觉得我们太难照管了？如果真是这样，我们可以离开。
        - id: ch01-b06
          speaker: wendy
          text: >-
            爸爸！您怎么能这么说呢？
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: >-
            可达林先生脸上的阴云还是没有散。他明知道自己这样不大光彩，却控制不住。
        - id: ch01-b08
          speaker: nibs
          text: >-
            我们睡觉时可以把身子叠起来，这样就不占地方了。
        - id: ch01-b09
          speaker: wendy
          text: >-
            而且，他们的头发一直都是我来剪，不会添多少麻烦的。
        - id: ch01-b10
          speaker: mrs_darling
          text: >-
            乔治！你怎么能在孩子们面前这样呢？
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: >-
            看见自己心爱的人露出这么不好的一面，达林太太很难过。达林先生忽然哭了起来，终于说出实话。他其实和妻子一样，打心底里愿意收下这些孩子。可大家只问了她，竟没问他，简直把他当成家里一个无足轻重的零。
        - id: ch01-b12
          speaker: tootles
          text: >-
            我可不觉得您是个零！卷毛，你觉得达林先生是个零吗？
        - id: ch01-b13
          speaker: curly
          text: >-
            当然不觉得。斯莱特利，你呢？你会把他当成一个零吗？
        - id: ch01-b14
          speaker: slightly
          text: >-
            才不会呢！双胞胎，你们怎么说？
        - id: ch01-b15
          speaker: narrator
          text: >-
            原来，男孩们没有一个把达林先生当成零。他听了高兴得简直有些可笑，马上说，只要他们挤得下，客厅里总能给大家腾出地方。
        - id: ch01-b16
          speakers: [tootles, curly, slightly, nibs]
          ensemble: chorus
          text: >-
            先生，我们一定挤得下！
        - id: ch01-b17
          speaker: mr_darling
          text: >-
            那就跟着领头的走！不过先说好，我也不敢肯定家里到底有没有客厅。我们就当它有吧，反正都一样。嗬啦！
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: >-
            他跳着舞穿过屋子。男孩们也喊着“嗬啦”，一路跳着跟在后面，到处找那间客厅。我已经忘了他们到底找到没有。不过，角落总是找到了，所有人也都挤了进去。
    - id: ch02
      title: 春季大扫除的约定
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            彼得飞走以前，又来见了温迪一面。他并没有停在窗前，只在飞过时轻轻擦了一下窗子。这样，温迪若是愿意，就能推开窗叫住他。她真的叫住了他。
        - id: ch02-b02
          speaker: peter
          text: >-
            你好，温迪。我来向你告别。
        - id: ch02-b03
          speaker: wendy
          text: >-
            哎呀，你这就要走了吗？
        - id: ch02-b04
          speaker: peter
          text: >-
            是啊。
        - id: ch02-b05
          speaker: wendy
          text: >-
            彼得，有一件特别美好的事，你难道不想跟我父母谈一谈吗？
        - id: ch02-b06
          speaker: peter
          text: >-
            我不想谈。
        - id: ch02-b07
          speaker: wendy
          text: >-
            那件事是关于我的呀，你也不想谈吗？
        - id: ch02-b08
          speaker: peter
          text: >-
            不想。
        - id: ch02-b09
          speaker: narrator
          text: >-
            达林太太也来到窗边。眼下，她可把温迪看得很紧。她告诉彼得，其他男孩已经全被她收养了，她也愿意收养他。
        - id: ch02-b10
          speaker: peter
          text: >-
            那么，您会让我去学校吗？
        - id: ch02-b11
          speaker: mrs_darling
          text: >-
            会呀。
        - id: ch02-b12
          speaker: peter
          text: >-
            上完学，还会叫我去办公室上班吗？
        - id: ch02-b13
          speaker: mrs_darling
          text: >-
            我想会的。
        - id: ch02-b14
          speaker: peter
          text: >-
            那我很快就会变成大人了？
        - id: ch02-b15
          speaker: mrs_darling
          text: >-
            很快就会长大的。
        - id: ch02-b16
          speaker: peter
          text: >-
            我才不要去学校，学那些一本正经的东西！我也不想长成大人。温迪的母亲，要是哪天醒来，我一摸脸，竟然长出了胡子，那怎么办？
        - id: ch02-b17
          speaker: wendy
          text: >-
            彼得，就算你长了胡子，我也还是会爱你的。
          emotion: calm
        - id: ch02-b18
          speaker: narrator
          text: >-
            达林太太向他张开双臂，彼得却拒绝了她。
        - id: ch02-b19
          speaker: peter
          text: >-
            别靠近我，太太！谁也休想抓住我，再逼我变成大人。
        - id: ch02-b20
          speaker: mrs_darling
          text: >-
            可你以后要住在哪里呢？
        - id: ch02-b21
          speaker: peter
          text: >-
            我和小叮当住在那座给温迪造的小屋里。仙子们会把屋子放到高高的树梢上，她们每天夜里就睡在那里。
        - id: ch02-b22
          speaker: wendy
          text: >-
            那一定美极了！
        - id: ch02-b23
          speaker: narrator
          text: >-
            温迪说得满心向往，达林太太立刻把她抓得更紧。
        - id: ch02-b24
          speaker: mrs_darling
          text: >-
            我还以为仙子已经全都死了呢。
        - id: ch02-b25
          speaker: wendy
          text: >-
            新生的小仙子一直很多。每当一个新生的宝宝第一次笑，就会有一个仙子出生。宝宝总会出生，所以仙子也总会有。她们住在树顶的巢里。淡紫色的是男孩，白色的是女孩，蓝色的呢，只是些连自己是什么都弄不清的小傻瓜。
        - id: ch02-b26
          speaker: peter
          text: >-
            我在那里一定会玩得特别痛快。
        - id: ch02-b27
          speaker: narrator
          text: >-
            他说这话时，眼睛一直望着温迪。
        - id: ch02-b28
          speaker: wendy
          text: >-
            可到了晚上，你一个人坐在火边，不会觉得很寂寞吗？
        - id: ch02-b29
          speaker: peter
          text: >-
            我还有小叮当陪着我。
        - id: ch02-b30
          speaker: wendy
          text: >-
            小叮当连我的二十分之一都比不上。
        - id: ch02-b31
          speaker: tink
          text: >-
            你这个鬼鬼祟祟的告密鬼！
          emotion: angry
        - id: ch02-b32
          speaker: narrator
          text: >-
            小叮当的声音从拐角附近传了过来。
        - id: ch02-b33
          speaker: peter
          text: >-
            没什么要紧的。
        - id: ch02-b34
          speaker: wendy
          text: >-
            彼得，你明明知道，这当然要紧。
        - id: ch02-b35
          speaker: peter
          text: >-
            那你跟我回小屋，不就行了吗？
        - id: ch02-b36
          speaker: wendy
          text: >-
            妈妈，我可以去吗？
        - id: ch02-b37
          speaker: mrs_darling
          text: >-
            当然不行。我好不容易才让你回到家，这次一定要把你留在身边。
        - id: ch02-b38
          speaker: wendy
          text: >-
            可是彼得真的太需要一个母亲了。
        - id: ch02-b39
          speaker: mrs_darling
          text: >-
            你也需要母亲呀，亲爱的。
        - id: ch02-b40
          speaker: peter
          text: >-
            哦，那就算了吧。
        - id: ch02-b41
          speaker: narrator
          text: >-
            彼得说得好像刚才只是客气一下。可达林太太看见他的嘴角抽动了，便慷慨地答应，每年让温迪去陪他一个星期，替他做春季大扫除。温迪更想要一个长久的安排，也觉得下一个春天来得太慢。不过，这个约定已经让彼得重新快活起来。他不懂时间，又有多得数不清的冒险。我们讲过的这一切，在他的冒险里只值半个便士。温迪大概知道这一点，临别的话才会带着哀求。
        - id: ch02-b42
          speaker: wendy
          text: >-
            彼得，等到该做春季大扫除的时候，你不会已经把我忘了吧？
          emotion: sad
        - id: ch02-b43
          speaker: narrator
          text: >-
            彼得当然答应不会，随后飞走了。他还带走了达林太太的吻。那个从来不属于任何人的吻，他竟轻轻松松地拿走了。真奇怪。不过，达林太太似乎很满意。
    - id: ch03
      title: 温迪长大了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            男孩们全都去上了学。大多数进了三班，斯莱特利先去了四班，后来又降到五班，而一班才是最高的。他们才上学一个星期，就觉得没有留在岛上实在蠢得像山羊。可惜后悔已经晚了。没过多久，他们便安顿下来，变得和你、我，还有低年级的詹金斯一样平凡。更叫人难过的是，他们慢慢不会飞了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            起初，娜娜会把他们的脚拴在床柱上，免得他们夜里飞走。白天，他们还爱假装从公共马车上摔下来。后来，他们睡在床上不再挣动，松开马车时也真的会摔疼。再往后，连被风吹走的帽子都追不上了。他们说，这是因为太久没有练习。其实，是因为他们不再相信。
        - id: ch03-b03
          speaker: narrator
          text: >-
            迈克尔相信得比其他男孩都久，哪怕大家总取笑他。第一年年末，彼得来接温迪时，他正好也在。温迪换上那件用梦幻岛的叶子和浆果做成的裙子，跟彼得飞走了。她担心裙子已经短了一截，会被彼得看出来。可彼得忙着讲自己的事情，根本没有留意。
        - id: ch03-b04
          speaker: narrator
          text: >-
            温迪盼了一年，早想和他兴奋地回忆往事。可新的冒险一场接一场，已经把旧事从彼得脑中全挤了出去。
        - id: ch03-b05
          speaker: peter
          text: >-
            胡克船长是谁？听起来倒像个有意思的人。
        - id: ch03-b06
          speaker: wendy
          text: >-
            你不记得他了？明明是你杀了他，救了我们所有人呀！
          emotion: surprised
        - id: ch03-b07
          speaker: peter
          text: >-
            我杀过的人，转过身就会忘掉。
        - id: ch03-b08
          speaker: narrator
          text: >-
            温迪又说，希望小叮当见了她会高兴。她说得不大有把握，彼得却完全听不明白。
        - id: ch03-b09
          speaker: peter
          text: >-
            小叮当是谁呀？
        - id: ch03-b10
          speaker: wendy
          text: >-
            哦，彼得！你连她也忘了吗？
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: >-
            温迪解释了一遍，他还是想不起来。
        - id: ch03-b12
          speaker: peter
          text: >-
            仙子那么多。我猜，她早就不在了。
        - id: ch03-b13
          speaker: narrator
          text: >-
            我想他说得不错。仙子的寿命并不长。不过她们那么小，对她们来说，短短一段日子也会显得很长很长。温迪更痛苦地发现，这漫长的一年，在彼得心里只像一个昨天。可是他依旧那么迷人，两个人还是在树梢的小屋里，快快活活地做了一场春季大扫除。
        - id: ch03-b14
          speaker: narrator
          text: >-
            第二年，彼得没有来。温迪穿着一条新裙子等他，因为旧裙子早已短得遮不住她了。可是，她一直没有等到彼得。
        - id: ch03-b15
          speaker: michael
          text: >-
            他也许是生病了，所以才来不了。
        - id: ch03-b16
          speaker: wendy
          text: >-
            你知道的，彼得从来不会生病。
        - id: ch03-b17
          speaker: narrator
          text: >-
            迈克尔靠近她，打了个寒战，压低了声音。
        - id: ch03-b18
          speaker: michael
          text: >-
            温迪，也许世上根本没有彼得这个人。
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: >-
            迈克尔已经哭了。不然的话，温迪一定也会哭出来。又过了一个春天，到了大扫除的时候，彼得终于来了。奇怪的是，他根本不知道自己漏掉了整整一年。
        - id: ch03-b20
          speaker: narrator
          text: >-
            这是女孩温迪最后一次见到他。后来有一阵子，她还为了彼得，努力不肯感觉成长带来的疼痛。她在常识课上得了奖，甚至觉得自己背叛了他。可岁月来了又走，那个漫不经心的男孩始终没有回来。等他们再见面，温迪已经结婚。那时，彼得在她心里只像玩具箱里的一点灰尘。
        - id: ch03-b21
          speaker: narrator
          text: >-
            温迪长大了。你不用替她难过，她本来就是一个愿意长大的人。到最后，她完全照自己的心意，比别的女孩早一天长大。其他男孩也都长大了，而且全都无可救药，不值得多说。你随便哪天都可能遇见双胞胎、尼布斯和卷毛，他们提着小皮包和雨伞去办公室。迈克尔做了火车司机。斯莱特利娶了有爵位的女士，自己也成了贵族。从铁门里走出来的那个戴假发的法官，从前就是嘟嘟。至于那个留着胡子、一个故事也不会讲给孩子听的男人，他从前是约翰。
        - id: ch03-b22
          speaker: narrator
          text: >-
            温迪结婚时，穿着白裙子，系着粉红色腰带。彼得竟然没有落到教堂里，阻止他们宣读结婚预告，想来实在奇怪。
        - id: ch03-b23
          speaker: narrator
          text: >-
            很多年滚滚而过，温迪有了一个女儿。这句话本来不该用墨水写，应该泼下一片金光。
    - id: ch04
      title: 简听见了啼叫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            温迪的女儿叫简。她总带着一种古怪的、追根究底的神情，仿佛刚来到大陆，就有无数问题等着问。等她会提问以后，问得最多的就是彼得·潘。她爱听他的故事，温迪便在当年那间著名的育儿室里，把自己还记得的一切讲给女儿。那间屋子如今属于简了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            简的父亲付百分之三的利息，从温迪的父亲手里买下了这座房子，因为老人已经不愿意爬楼梯。达林太太去世了，也被大家忘记了。育儿室里只剩两张床，一张给简，一张给保姆。狗屋也没有了，娜娜同样已经离世。她活到很老，临终前变得很难相处，总是固执地认定，世上只有她懂得照顾孩子。
        - id: ch04-b03
          speaker: narrator
          text: >-
            每星期有一个晚上，保姆会放假。那天由温迪哄简睡觉，也是她们讲故事的夜晚。简想出一个好主意。她把床单罩在自己和母亲头上，搭成一顶帐篷，再从可怕的黑暗里悄声发问。
        - id: ch04-b04
          speaker: jane
          text: >-
            妈妈，我们现在看见什么了？
        - id: ch04-b05
          speaker: wendy
          text: >-
            我想，今晚我什么也没有看见。
        - id: ch04-b06
          speaker: narrator
          text: >-
            温迪心里还想着，要是娜娜仍在，准不会赞成她们继续说话。
        - id: ch04-b07
          speaker: jane
          text: >-
            不，你明明看见了。你看见自己还是小女孩的时候。
        - id: ch04-b08
          speaker: wendy
          text: >-
            那是很久以前的事了，宝贝。唉，时间过得真快呀！
        - id: ch04-b09
          speaker: jane
          text: >-
            时间飞起来的时候，也像你小时候飞得那么快吗？
        - id: ch04-b10
          speaker: wendy
          text: >-
            我真的飞过吗？简，有时候连我自己也会怀疑。
        - id: ch04-b11
          speaker: jane
          text: >-
            你当然飞过。
        - id: ch04-b12
          speaker: wendy
          text: >-
            那些我还会飞的老日子，真叫人想念。
        - id: ch04-b13
          speaker: jane
          text: >-
            妈妈，那你现在为什么不能飞了？
        - id: ch04-b14
          speaker: wendy
          text: >-
            因为我已经长大了。人一长大，就会忘记该怎么飞。
        - id: ch04-b15
          speaker: jane
          text: >-
            可他们为什么会忘记呢？
        - id: ch04-b16
          speaker: wendy
          text: >-
            因为他们不再快乐、天真、没心没肺了。只有快乐、天真、没心没肺的人才会飞。
        - id: ch04-b17
          speaker: jane
          text: >-
            快乐、天真、没心没肺到底是什么样子？我真希望自己也是那样。
        - id: ch04-b18
          speaker: narrator
          text: >-
            有时候，温迪也会承认，她在帐篷的黑暗里看见了东西。
        - id: ch04-b19
          speaker: wendy
          text: >-
            我想，我看见的就是这间育儿室。
        - id: ch04-b20
          speaker: jane
          text: >-
            我也觉得是这里。妈妈，接着讲吧。
        - id: ch04-b21
          speaker: narrator
          text: >-
            于是，母女俩又踏上那场伟大的冒险，回到彼得飞进育儿室寻找影子的夜晚。
        - id: ch04-b22
          speaker: wendy
          text: >-
            那个傻家伙呀，竟想用肥皂把影子粘回去。怎么也粘不上，他就坐在地板上哭，把我吵醒了。我只好替他把影子缝上。
        - id: ch04-b23
          speaker: jane
          text: >-
            你漏掉了一段。你看见他坐在地上哭的时候，对他说了什么？
        - id: ch04-b24
          speaker: narrator
          text: >-
            简如今对这个故事，比温迪自己还要熟。
        - id: ch04-b25
          speaker: wendy
          text: >-
            我从床上坐起来，问他：“男孩，你为什么哭？”
        - id: ch04-b26
          speaker: jane
          text: >-
            对，就是这句话。
        - id: ch04-b27
          speaker: narrator
          text: >-
            简这才长长地舒了一口气。
        - id: ch04-b28
          speaker: wendy
          text: >-
            后来，他带我们飞到梦幻岛。那里有仙子、海盗、红种人和美人鱼礁湖，还有地下的家和那座小屋。
        - id: ch04-b29
          speaker: jane
          text: >-
            对！那些地方里，你最喜欢哪一个？
        - id: ch04-b30
          speaker: wendy
          text: >-
            我想，我最喜欢地下的家。
        - id: ch04-b31
          speaker: jane
          text: >-
            我也是。那彼得最后对你说了什么？
        - id: ch04-b32
          speaker: wendy
          text: >-
            他说，只要我一直等着，总有一天夜里，我会听见他的啼叫。
        - id: ch04-b33
          speaker: jane
          text: >-
            对，他就是这样说的。
        - id: ch04-b34
          speaker: wendy
          text: >-
            可是，他到底把我彻底忘了。
        - id: ch04-b35
          speaker: narrator
          text: >-
            温迪说这句话时，脸上还带着微笑。她已经长大到可以这样微笑了。
        - id: ch04-b36
          speaker: narrator
          text: >-
            一天晚上，简问起彼得的啼叫是什么声音。温迪试着模仿了一声。
        - id: ch04-b37
          speaker: jane
          text: >-
            不，不是这样的。他的啼叫应该是这样才对。
        - id: ch04-b38
          speaker: narrator
          text: >-
            简学得比母亲好多了。温迪微微吃了一惊。
        - id: ch04-b39
          speaker: wendy
          text: >-
            宝贝，你怎么会知道真正的声音？
        - id: ch04-b40
          speaker: jane
          text: >-
            我睡着的时候，常常能听见他的啼叫。
        - id: ch04-b41
          speaker: wendy
          text: >-
            是啊，许多女孩都会在睡梦里听见。可是，只有我醒着的时候也听到过。
        - id: ch04-b42
          speaker: jane
          text: >-
            妈妈，你真幸运。
    - id: ch05
      title: 彼得又飞来了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            后来有一天夜里，悲剧发生了。那时正是春天，故事已经讲完，简也睡着了。育儿室里没有别的灯，温迪便坐在地板上，挨着炉火补衣服。她正缝着，忽然听见一声啼叫。风像从前一样吹开窗子，彼得落在地板上。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他还是原来的模样。温迪一眼就看见，他嘴里仍然长着最初那一口乳牙。他是个小男孩，她却已经长大了。温迪蜷缩在炉火旁边，不敢动弹。她觉得无助，又觉得羞愧，只觉得自己成了一个高大的女人。
        - id: ch05-b03
          speaker: peter
          text: >-
            你好呀，温迪。
        - id: ch05-b04
          speaker: narrator
          text: >-
            彼得根本没发现她变了，因为他脑子里想的主要还是自己。昏暗的火光下，温迪的白裙子也很像他们初见时的睡衣。
        - id: ch05-b05
          speaker: wendy
          text: >-
            你好，彼得。
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: >-
            她有气无力地回答，拼命想让自己显得小一些。她身体深处仿佛有什么东西在喊：“女人，女人，快放开我！”
        - id: ch05-b07
          speaker: peter
          text: >-
            咦，约翰去哪儿了？这里怎么少了一张床？
        - id: ch05-b08
          speaker: wendy
          text: >-
            约翰已经不住在这里了。
        - id: ch05-b09
          speaker: peter
          text: >-
            那么，迈克尔已经睡着了吗？
        - id: ch05-b10
          speaker: narrator
          text: >-
            他漫不经心地瞥了简一眼。
        - id: ch05-b11
          speaker: wendy
          text: >-
            是的，他睡着了。
        - id: ch05-b12
          speaker: narrator
          text: >-
            这句话一出口，温迪觉得自己既辜负了彼得，也辜负了简。她赶忙说出真相，仿佛慢一步，惩罚就会落下来。
        - id: ch05-b13
          speaker: wendy
          text: >-
            不对，床上的孩子不是迈克尔。
        - id: ch05-b14
          speaker: peter
          text: >-
            那她是新来的吗？
        - id: ch05-b15
          speaker: wendy
          text: >-
            是的。
        - id: ch05-b16
          speaker: peter
          text: >-
            她是男孩，还是女孩？
        - id: ch05-b17
          speaker: wendy
          text: >-
            是女孩。
        - id: ch05-b18
          speaker: narrator
          text: >-
            这一下，他总该明白了吧。可是彼得还是一点都不懂。
        - id: ch05-b19
          speaker: wendy
          text: >-
            彼得，你这次回来，是想让我跟你一起飞走吗？
        - id: ch05-b20
          speaker: peter
          text: >-
            当然了，我就是来接你的。你难道忘了，现在又该做春季大扫除了吗？
        - id: ch05-b21
          speaker: narrator
          text: >-
            他最后那句话还带着一点责备。温迪明白，告诉彼得究竟错过了多少次春季大扫除，一点用也没有。
        - id: ch05-b22
          speaker: wendy
          text: >-
            我去不了。对不起，我已经忘记该怎么飞了。
          emotion: sad
        - id: ch05-b23
          speaker: peter
          text: >-
            那有什么难的，我马上就能重新教会你。
        - id: ch05-b24
          speaker: wendy
          text: >-
            彼得，别把仙尘浪费在我身上了。
        - id: ch05-b25
          speaker: narrator
          text: >-
            温迪站起身。直到这一刻，彼得才突然害怕起来。他向后缩去。
        - id: ch05-b26
          speaker: peter
          text: >-
            怎么回事？你为什么站起来了？
          emotion: fearful
        - id: ch05-b27
          speaker: wendy
          text: >-
            我把灯调亮，你自己看一看，就会明白了。
        - id: ch05-b28
          speaker: narrator
          text: >-
            在我知道的彼得的一生里，这几乎是他唯一一次感到害怕。
        - id: ch05-b29
          speaker: peter
          text: >-
            不要把灯调亮！
          emotion: fearful
        - id: ch05-b30
          speaker: narrator
          text: >-
            温迪轻轻摸了摸这个悲剧般的男孩的头发。她早已不是那个会为他心碎的小女孩，而是一个能够微笑着看待这一切的成年女人。只是，她的笑容里含着泪水。
        - id: ch05-b31
          speaker: narrator
          text: >-
            她还是把灯调亮了。彼得终于看清楚，痛苦地叫了一声。眼前这个高挑美丽的女人俯下身，想把他搂进怀里，他却猛地躲开了。
        - id: ch05-b32
          speaker: peter
          text: >-
            这究竟是怎么回事？你怎么会变成这样？
          emotion: fearful
        - id: ch05-b33
          speaker: narrator
          text: >-
            温迪只好把真相告诉他。
        - id: ch05-b34
          speaker: wendy
          text: >-
            我老了，彼得。我早就不止二十岁，很久以前就已经长大了。
        - id: ch05-b35
          speaker: peter
          text: >-
            可你答应过我，你永远不会长大！
          emotion: angry
        - id: ch05-b36
          speaker: wendy
          text: >-
            我没有办法。我已经结婚了，彼得。
        - id: ch05-b37
          speaker: peter
          text: >-
            不，你没有结婚。
        - id: ch05-b38
          speaker: wendy
          text: >-
            这是真的。床上那个小女孩，就是我的孩子。
        - id: ch05-b39
          speaker: peter
          text: >-
            不，她才不是你的孩子。
        - id: ch05-b40
          speaker: narrator
          text: >-
            可是，彼得大概还是相信了。他朝熟睡的简走了一步，举起匕首。当然，他没有刺下去。他一屁股坐到地板上，放声大哭。从前，温迪明明很容易就能安慰他。如今，她却不知道该怎么办。她现在不过是个女人，只好跑出房间，想找出一个办法。
        - id: ch05-b41
          speaker: narrator
          text: >-
            彼得哭个不停，很快便惊醒了简。她在床上坐起来，立刻来了兴致。
        - id: ch05-b42
          speaker: jane
          text: >-
            男孩，你为什么哭呀？
        - id: ch05-b43
          speaker: narrator
          text: >-
            彼得站起身，向简鞠了一躬。简也坐在床上，向他还礼。
        - id: ch05-b44
          speaker: peter
          text: >-
            你好。
        - id: ch05-b45
          speaker: jane
          text: >-
            你好。
        - id: ch05-b46
          speaker: peter
          text: >-
            我的名字叫彼得·潘。
        - id: ch05-b47
          speaker: jane
          text: >-
            是的，我知道你是谁。
        - id: ch05-b48
          speaker: peter
          text: >-
            我回来是为了找我的母亲。我要带她去梦幻岛。
        - id: ch05-b49
          speaker: jane
          text: >-
            我知道。我一直都在等你来。
        - id: ch05-b50
          speaker: narrator
          text: >-
            温迪迟疑着回到育儿室。她看见彼得坐在床柱上，神气十足地发出啼叫。简穿着小睡衣，满脸庄严的狂喜，在房间里飞来飞去。
        - id: ch05-b51
          speaker: peter
          text: >-
            她就是我的母亲。
        - id: ch05-b52
          speaker: narrator
          text: >-
            简落下来，站到彼得身边。她望着彼得，脸上正是彼得最喜欢在女士们脸上看到的那种神情。
        - id: ch05-b53
          speaker: jane
          text: >-
            妈妈，他真的太需要一个母亲了。
        - id: ch05-b54
          speaker: wendy
          text: >-
            是的，我知道。没有人比我更明白这一点。
          emotion: sad
        - id: ch05-b55
          speaker: peter
          text: >-
            再见了，温迪。
        - id: ch05-b56
          speaker: narrator
          text: >-
            彼得升上空中。简毫不羞愧地跟着飞起来。对她来说，飞行已经成了最轻松的一种走路方式。温迪冲到窗前。
        - id: ch05-b57
          speaker: wendy
          text: >-
            不，不要走！
          emotion: sad
        - id: ch05-b58
          speaker: jane
          text: >-
            我只是去替他做春季大扫除。彼得要我以后一直替他做大扫除呢。
        - id: ch05-b59
          speaker: wendy
          text: >-
            要是我也能跟你们一起去，那该多好。
          emotion: sad
        - id: ch05-b60
          speaker: jane
          text: >-
            可是妈妈，你已经不会飞了呀。
        - id: ch05-b61
          speaker: narrator
          text: >-
            温迪最后还是让他们一起飞走了。我们最后一次看见她时，她站在窗前，望着两个人越飞越远，直到他们在天空里缩得像星星那么小。
        - id: ch05-b62
          speaker: narrator
          text: >-
            你继续望着温迪，会看见她的头发慢慢变白，身形又渐渐变小，因为这一切已经发生在很久以前。如今，简也成了一个普普通通的大人，有了一个叫玛格丽特的女儿。每逢春季大扫除，只要彼得没有忘记，他就会来接玛格丽特去梦幻岛。玛格丽特在那里讲彼得自己的故事给他听，他总是听得津津有味。
        - id: ch05-b63
          speaker: narrator
          text: >-
            等玛格丽特长大，她也会有一个女儿，接替她做彼得的母亲。只要世上还有快乐、天真、没心没肺的孩子，这件事就会永远继续下去。
        - id: ch05-b64
          speaker: narrator
          text: >-
            全书完。
