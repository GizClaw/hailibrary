        timbre: youthful and clear
        pace: measured
        pitch: medium-high
    first_twin:
      display_name: First Twin
      tts:
        delivery: lively, loyal, and matter-of-fact
        timbre: bright and boyish
        pace: brisk
        pitch: high
    second_twin:
      display_name: Second Twin
      tts:
        delivery: lively, loyal, and matter-of-fact
        timbre: bright and boyish
        pace: brisk
        pitch: high
    tootles:
      display_name: Tootles
      tts:
        delivery: humble, hesitant, and sweetly earnest
        timbre: soft and boyish
        pace: unhurried
        pitch: medium-high
