audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，任性时理直气壮
        timbre: 柔软稚气
        pace: 短促活泼
        pitch: 高音
    peter:
      display_name: 彼得·潘
      tts:
        delivery: 神气活现又天真任性，兴奋时像快乐的小公鸡
        timbre: 清脆明亮
        pace: 敏捷跳脱
        pitch: 中高音
    tinker_bell:
      display_name: 小叮当
      tts:
        delivery: 伶俐急躁，生气时像一串尖锐的小铃
        timbre: 晶莹细亮
        pace: 飞快
        pitch: 高音
    tootles:
      display_name: 嘟嘟
      tts:
        delivery: 谦逊温和，紧张时仍旧认真
        timbre: 柔和稚嫩
        pace: 稍慢
        pitch: 中高音
    nibs:
      display_name: 尼布斯
      tts:
        delivery: 快活爽朗，惊奇时直率热切
        timbre: 清亮稚嫩
        pace: 明快
        pitch: 中高音
    slightly:
      display_name: 斯莱特利
      tts:
        delivery: 自负爱表现，讲话总像比别人多懂一点
        timbre: 清脆偏亮
        pace: 轻快
        pitch: 中高音
    curly:
      display_name: 卷毛
      tts:
        delivery: 淘气机灵，反应又快又直接
        timbre: 活泼清亮
        pace: 明快
        pitch: 中高音
    twin_1:
      display_name: 双胞胎哥哥
      tts:
        delivery: 乖顺谨慎，说话带一点迟疑
        timbre: 稚嫩清亮
        pace: 适中
        pitch: 中高音
    twin_2:
      display_name: 双胞胎弟弟
      tts:
        delivery: 乖顺谨慎，常跟着哥哥开口
        timbre: 稚嫩柔和
        pace: 适中
        pitch: 高音
  chapters:
    - id: ch01
      title: 温迪的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 温迪坐好了，准备讲她最拿手的故事。迈克尔待在她脚边，七个男孩全挤上了床，眼巴巴等她开口。可故事才刚起了个头，他们就你一句我一句地闹起来了。
        - id: ch01-b02
          speaker: wendy
          text: 你们听好。从前，有一位先生——
        - id: ch01-b03
          speaker: curly
          text: 要是位太太，我更喜欢。
        - id: ch01-b04
          speaker: nibs
          text: 要是只白老鼠，那就更好啦。
        - id: ch01-b05
          speaker: wendy
          text: 别吵。故事里也有一位太太，她——
        - id: ch01-b06
          speaker: twin_1
          text: 妈妈，你是说她现在还在，对吧？她没有死吧？
        - id: ch01-b07
          speaker: wendy
          text: 没有，她好好的。
        - id: ch01-b08
          speaker: tootles
          text: 那太好啦。约翰，你也高兴吗？
        - id: ch01-b09
          speaker: john
          text: 那还用说。
        - id: ch01-b10
          speaker: tootles
          text: 尼布斯呢，你高兴吗？
        - id: ch01-b11
          speaker: nibs
          text: 可高兴啦。
        - id: ch01-b12
          speaker: tootles
          text: 双胞胎，你们呢？
        - id: ch01-b13
          speakers: [twin_1, twin_2]
          ensemble: duo
          text: 我们也高兴。
        - id: ch01-b14
          speaker: narrator
          text: 温迪无奈地叹了口气。这些孩子个个都说自己高兴，偏偏不肯让她把故事讲下去。彼得虽然打心眼里嫌这故事讨厌，倒还决心让她受到公平的待遇，肯替她维持秩序。
        - id: ch01-b15
          speaker: peter
          text: 那边安静一点，让她好好讲。
        - id: ch01-b16
          speaker: wendy
          text: 先生是达林先生，太太是达林太太。
        - id: ch01-b17
          speaker: john
          text: 我认识他们。
        - id: ch01-b18
          speaker: narrator
          text: 约翰当然认识达林夫妇。他故意拿这件事在其他孩子面前炫耀，好惹他们不痛快。迈克尔也觉得自己认识，却像隔着一层雾，连说出口都不大有把握。
        - id: ch01-b19
          speaker: michael
          text: 我好像也认识。
        - id: ch01-b20
          speaker: wendy
          text: 他们结了婚。你们猜，后来有了什么？
        - id: ch01-b21
          speaker: nibs
          text: 白老鼠！
        - id: ch01-b22
          speaker: wendy
          text: 不对。他们有了三个后代。
        - id: ch01-b23
          speaker: tootles
          text: 真难猜。可是，“后代”到底是什么？
        - id: ch01-b24
          speaker: wendy
          text: 双胞胎，你就是后代呀。
        - id: ch01-b25
          speaker: twin_1
          text: 约翰，听见了吗？我原来是后代。
        - id: ch01-b26
          speaker: john
          text: 后代不就是孩子嘛。
        - id: ch01-b27
          speaker: wendy
          text: 这三个孩子有个忠心的保姆，叫娜娜。她一直好好照料他们。可达林先生生了她的气，竟把她拴在院子里。家里没有娜娜守着，于是三个孩子全都飞走了。
        - id: ch01-b28
          speaker: nibs
          text: 这故事真好听。
        - id: ch01-b29
          speaker: wendy
          text: 他们飞到梦幻岛，那里住着走失的孩子。
        - id: ch01-b30
          speaker: curly
          text: 我就知道！也不知为什么，反正我刚才已经猜到了。
        - id: ch01-b31
          speaker: tootles
          text: 温迪，那些孩子里有没有一个叫嘟嘟？
        - id: ch01-b32
          speaker: wendy
          text: 有呀。
        - id: ch01-b33
          speaker: tootles
          text: 尼布斯，我跑进故事里啦！好哇！
          emotion: happy
    - id: ch02
      title: 敞开的窗户
      blocks:
        - id: ch02-b01
          speaker: wendy
          text: 现在想想那对可怜的父母吧。孩子全飞走了，他们会有多难过。
        - id: ch02-b02
          speakers: [slightly, nibs, curly, twin_1]
          ensemble: chorus
          text: 这真叫人难过呀！
        - id: ch02-b03
          speaker: narrator
          text: 他们嘴上哀叹，心里可一点也没替那对父母难过。
        - id: ch02-b04
          speaker: wendy
          text: 再想想，一张张床全空着！
        - id: ch02-b05
          speakers: [tootles, nibs, twin_1, twin_2]
          ensemble: chorus
          text: 那些空床真可怜呀！
        - id: ch02-b06
          speaker: twin_1
          text: 真让人伤心呀。
        - id: ch02-b07
          speaker: narrator
          text: 双胞胎哥哥说得喜气洋洋，弟弟却假装发愁。
        - id: ch02-b08
          speaker: twin_2
          text: 这怎么还能有快乐的结局？尼布斯，你想得出来吗？
        - id: ch02-b09
          speaker: nibs
          text: 我都快急死了。
        - id: ch02-b10
          speaker: wendy
          text: 你们要懂得母爱有多伟大，就什么也不用怕了。
        - id: ch02-b11
          speaker: narrator
          text: 温迪说到这里，得意得不得了，因为她终于讲到了彼得最讨厌的那一段。嘟嘟嘴上说着自己喜欢母爱，手里却抄起枕头打了尼布斯一下。尼布斯说自己也喜欢，马上又用枕头还了回去。
        - id: ch02-b12
          speaker: tootles
          text: 我喜欢母爱。尼布斯，你喜不喜欢？
        - id: ch02-b13
          speaker: nibs
          text: 喜欢得很！
        - id: ch02-b14
          speaker: wendy
          text: 女主人公知道，母亲会一直开着窗，等孩子们飞回来。所以，他们在外面快活地玩了许多年。
        - id: ch02-b15
          speaker: twin_2
          text: 后来，他们回家了吗？
        - id: ch02-b16
          speaker: wendy
          text: 好，现在咱们朝未来偷看一眼吧。好多年已经过去。伦敦车站停下一列火车，走下来一位风姿漂亮的淑女。她究竟多大年纪，谁也猜不准。你们说，她会是谁呢？
        - id: ch02-b17
          speaker: narrator
          text: 孩子们一齐扭了扭身子，因为他们相信，想偷看未来就该这么扭一下。尼布斯把这个故事听得滚瓜烂熟，明明早知道答案，此刻还是兴奋得不得了，仿佛谜底再也猜不出来。
        - id: ch02-b18
          speaker: nibs
          text: 她是谁呀，温迪？快告诉我们！
        - id: ch02-b19
          speaker: wendy
          text: 难道是她？是，又像不是……没错，正是美丽的温迪！再看看陪在她身旁的两位绅士。他们身材富态，气派不凡，都已经长大成人。难道会是约翰和迈克尔？一点不错，就是他们！
        - id: ch02-b20
          speakers: [tootles, nibs, curly, twin_1]
          ensemble: chorus
          text: 原来真的是他们呀！
        - id: ch02-b21
          speaker: wendy
          text: 温迪指着上面说：“弟弟们，你们瞧，窗户还开着！我们一直相信母爱，如今总算有了回报。”三个人飞上去见爸爸妈妈。团圆的场面幸福得没法写，只好拉上帷幕了。
        - id: ch02-b22
          speaker: narrator
          text: 故事到这里结束，温迪和听众都满意极了。一切都合他们的心意。孩子可以没心没肺地跑掉，只顾自己玩个痛快。等他们需要照料了，再高高兴兴地回来，深信等着自己的不是挨打，而是奖赏。孩子就是这么没心肝，却偏偏又那么可爱。他们对母爱信心十足，觉得再冷酷一阵也没关系。
    - id: ch03
      title: 彼得知道的真相
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可屋里有一个人知道，事情并不是这样。温迪刚说完，彼得便发出一声空洞的呻吟。她以为他病了，赶紧跑过去，在他胸口下面摸来摸去。
        - id: ch03-b02
          speaker: wendy
          text: 彼得，怎么啦？到底哪里疼？
        - id: ch03-b03
          speaker: peter
          text: 不是身体疼。温迪，你根本不懂母亲。
        - id: ch03-b04
          speaker: wendy
          text: 那你为什么这么难受？
        - id: ch03-b05
          speaker: narrator
          text: 彼得激动得很吓人，孩子们从没见他这样，全都惊慌地围了上来。他没有再装作什么也不知道，而是难得坦坦白白，把那件一直藏在心里、从来没有告诉大家的事说了出来。
        - id: ch03-b06
          speaker: peter
          text: 很久以前，我也以为母亲会永远给我留着窗户。我在外面过了好多好多个月亮，才飞回去。可窗户已经闩死了。母亲早忘了我，我的床上还睡着另一个小男孩。
        - id: ch03-b07
          speaker: narrator
          text: 这件事到底是不是真的，连讲故事的人也不敢肯定。可彼得自己深信不疑。他说得那么认真，窗户闩上的样子和床上的陌生孩子仿佛就在眼前，大家听了全都害怕起来。
        - id: ch03-b08
          speaker: twin_1
          text: 母亲真的全会这样吗？
          emotion: fearful
        - id: ch03-b09
          speaker: peter
          text: 真的。
        - id: ch03-b10
          speaker: narrator
          text: 原来，这才是母亲的真面目。她们竟是这种坏东西！当然，凡事还是谨慎一点好。孩子一旦发现自己该认输，往往比谁都明白得快。约翰和迈克尔对望也不用对望，立刻作了同一个决定。
        - id: ch03-b11
          speakers: [john, michael]
          ensemble: duo
          text: 温迪，我们回家吧！
        - id: ch03-b12
          speaker: wendy
          text: 好，我们回去。
        - id: ch03-b13
          speaker: narrator
          text: 温迪一听，立刻把两个弟弟紧紧搂进怀里。走失的孩子们却都糊涂了，不懂他们怎么忽然就要离开。他们在自己所谓的心里一直认定，没有母亲也能过得很好，只有母亲才总说孩子离不开她们。
        - id: ch03-b14
          speaker: tootles
          text: 你们不是今晚就走吧？
        - id: ch03-b15
          speaker: wendy
          text: 就现在。说不定妈妈已经为我们穿上半丧服了。彼得，请你把路上的事安排好。
        - id: ch03-b16
          speaker: peter
          text: 既然你想走，那就照办。
        - id: ch03-b17
          speaker: narrator
          text: 彼得答得冷淡极了，就像温迪只不过请他递一把坚果。两个人之间竟连一句“我舍不得你”也没有。温迪既然装作不在乎分别，彼得也偏要让她看见，自己同样毫不在意。其实他在乎得要命。大人像往常一样，又把所有好事都毁了，他简直恨透了他们。一钻进自己的树洞，他便故意一口接一口地飞快喘气。梦幻岛有一种说法，每当你喘一口气，世上就会死掉一个大人。彼得一秒差不多喘五下，满怀报复，恨不得尽快把大人全害死。
    - id: ch04
      title: 谁也不能扣下温迪
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得出去吩咐红种人。等他回来，地下之家已经闹出了一场很不光彩的乱子。孩子们怕失去温迪，竟气势汹汹地围住了她。
        - id: ch04-b02
          speakers: [slightly, nibs, curly, twin_1]
          ensemble: chorus
          text: 她一走，日子比从前还糟！我们不让她走！把她关起来，锁上链子！
        - id: ch04-b03
          speaker: wendy
          text: 嘟嘟，我求你替我主持公道。
        - id: ch04-b04
          speaker: narrator
          text: 温迪偏偏向最傻的嘟嘟求助。可就在这一刻，他一点也不傻了，开口时庄重得像换了一个人。
        - id: ch04-b05
          speaker: tootles
          text: 我只是嘟嘟，平常谁也不把我当回事。可谁敢不守英国绅士的礼数，欺负温迪，我就让他狠狠见血。
        - id: ch04-b06
          speaker: narrator
          text: 嘟嘟把短弯刀向后一扬，真像随时会照自己的话去做。就在那短短一刻，他的太阳升到了正午。其他孩子心里发虚，只得往后退。彼得正好回来，大家看一眼他的脸便明白，他绝不会帮他们扣下温迪。他不会违背任何姑娘的心愿，硬把她留在梦幻岛。
        - id: ch04-b07
          speaker: peter
          text: 温迪，我已经叫红种人领你们穿过树林，免得你飞得太累。出了树林，小叮当会带你们过海。尼布斯，去叫醒她。
        - id: ch04-b08
          speaker: wendy
          text: 谢谢你，彼得。
        - id: ch04-b09
          speaker: narrator
          text: 尼布斯敲了两次门。小叮当其实早就在床上坐着偷听，却故意等到这时才回答。
        - id: ch04-b10
          speaker: tinker_bell
          text: 谁在外面？你好大的胆子！快走开！
          emotion: angry
        - id: ch04-b11
          speaker: nibs
          text: 小叮当，起来吧。你得带温迪出一趟远门。
        - id: ch04-b12
          speaker: narrator
          text: 小叮当听说温迪要走，心里别提多高兴。可她偏不肯替温迪带路，还骂得更加难听，随后又装睡。
        - id: ch04-b13
          speaker: nibs
          text: 她说她绝对不去！
          emotion: surprised
        - id: ch04-b14
          speaker: peter
          text: 小叮当，你再不马上起床穿衣服，我就把帘子拉开，让大家都看见你穿着睡衣。
        - id: ch04-b15
          speaker: tinker_bell
          text: 谁说我不起来了？
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: 这句话果然管用，小叮当一下就跳到了地板上。另一边，男孩们凄凄凉凉地望着温迪。她已经带好约翰和迈克尔，随时可以出发。他们难过，不只是因为马上要失去她，还因为她显然要去一个很好玩的地方，自己却没有收到邀请。跟往常一样，新鲜事又在朝他们招手了。
        - id: ch04-b17
          speaker: wendy
          text: 亲爱的孩子们，你们都跟我来吧。我想，我一定能劝爸爸妈妈收养你们。
        - id: ch04-b18
          speaker: narrator
          text: 温迪说这番话时，心里最想邀请的其实是彼得。可男孩们谁也没想到这一层，每个人只顾盘算自己能不能得到一个新家，立刻高兴得跳了起来。
        - id: ch04-b19
          speaker: nibs
          text: 可我们这么一大群，他们不会嫌难管吗？
        - id: ch04-b20
          speaker: wendy
          text: 不会，只要在客厅多摆几张床。每月第一个星期四，再把床藏到屏风后面就行。
        - id: ch04-b21
          speakers: [tootles, nibs, curly, twin_1]
          ensemble: chorus
          text: 彼得，我们可以去吗？
        - id: ch04-b22
          speaker: narrator
          text: 他们以为彼得自然会一起走，其实已经不大顾得上他了。新鲜事一敲门，孩子随时会抛下最亲爱的人。
        - id: ch04-b23
          speaker: peter
          text: 好，你们去吧。
        - id: ch04-b24
          speaker: narrator
          text: 彼得苦笑着答应，大家马上冲去收拾行李。
    - id: ch05
      title: 告别与突袭
      blocks:
        - id: ch05-b01
          speaker: wendy
          text: 彼得，出发以前先来吃药。
        - id: ch05-b02
          speaker: narrator
          text: 温迪最喜欢喂他们吃药，而且毫无疑问，每回都会喂得太多。所谓药其实只是清水，可水既然装在药瓶里，她又会先认真摇一摇，再一滴一滴地数着倒出来，它便有了十足的药味。今天彼得却一口也没喝。温迪才把那一剂准备好，就看见了他的神情，心一下沉了下去。
        - id: ch05-b03
          speaker: wendy
          text: 快收拾你的东西呀，彼得！
          emotion: fearful
        - id: ch05-b04
          speaker: peter
          text: 我不去，温迪。
        - id: ch05-b05
          speaker: wendy
          text: 你得去。
        - id: ch05-b06
          speaker: peter
          text: 我就是不去。
        - id: ch05-b07
          speaker: narrator
          text: 彼得非要证明，温迪离开以后，自己一点也不会难受。他便在屋里上蹿下跳，快活地吹起那支无情的排箫，好像眼下正是最值得高兴的时候。温迪只好跟在他身后满屋追赶。这样做实在不够体面，可她已经顾不上了。
        - id: ch05-b08
          speaker: wendy
          text: 你可以回去找自己的母亲呀。
        - id: ch05-b09
          speaker: narrator
          text: 即使彼得从前真有母亲，如今也不想她了。他觉得没有母亲一样过得好。关于母亲，他记得的只剩下坏处。
        - id: ch05-b10
          speaker: peter
          text: 不。我回去以后，她也许会说我已经老了。可我只想永远做个小男孩，永远痛痛快快地玩。
        - id: ch05-b11
          speaker: wendy
          text: 可是，彼得——
        - id: ch05-b12
          speaker: peter
          text: 不。
        - id: ch05-b13
          speaker: narrator
          text: 其他孩子听说彼得不走，全都呆呆地望着他。他们已经收拾妥当，每个人都把包袱挂在一根棍子末端，再把棍子扛在肩头。大家第一个念头是，彼得既然不同行，大概已经反悔，不肯再放他们走。可他实在太骄傲，绝不会开口阻拦。
        - id: ch05-b14
          speaker: peter
          text: 你们要是找到了母亲，但愿还会喜欢她们。
        - id: ch05-b15
          speaker: narrator
          text: 这句冷冰冰的挖苦实在太可怕，让男孩们听了浑身不自在。大多数人刚才还急着上路，这会儿却开始犹豫。他们脸上明明白白露出一个疑问，仿佛都在想，放着梦幻岛的日子不过，偏要回去找母亲，自己是不是犯了傻。
        - id: ch05-b16
          speaker: peter
          text: 行了，别闹，也别哭哭啼啼。再见，温迪。
        - id: ch05-b17
          speaker: narrator
          text: 彼得笑着伸出手，好像他们确实该走了，因为他另有要紧事。温迪只好握住他的手。他没有半点表示，说自己更想要一个顶针般的吻。
        - id: ch05-b18
          speaker: wendy
          text: 你会记得换法兰绒内衣吧？也会按时吃药吧？
        - id: ch05-b19
          speaker: peter
          text: 都会的。
        - id: ch05-b20
          speaker: narrator
          text: 该叮嘱的事仿佛全都叮嘱完了，两个人再也找不到别的话。屋里随即落下一阵尴尬的沉默。可彼得不是那种会当着别人面前伤心得撑不住的人，他很快又摆出了若无其事的样子。
        - id: ch05-b21
          speaker: peter
          text: 小叮当，你准备好了吗？
        - id: ch05-b22
          speaker: tinker_bell
          text: 准备好了。
        - id: ch05-b23
          speaker: peter
          text: 那就走在前面。
        - id: ch05-b24
          speaker: narrator
          text: 小叮当一下蹿上最近的树，却没有一个人跟上去。就在这一刻，海盗向守在上面的红种人发动了可怕的突袭。那里方才还静得听不见一点动静，转眼间，尖叫声撕裂了空气，刀剑也猛烈地撞在一起。地下之家却死一般安静。孩子们一个个张着嘴，嘴巴再也合不拢。温迪跪倒在地，双臂仍直直伸向彼得。其他人也全朝彼得伸出手臂，仿佛有一阵风忽然把他们吹向了同一个方向。他们说不出话，只能无声地哀求彼得，千万别在这种时候丢下自己。彼得一把拔出那柄剑。他相信，自己曾经用这把剑杀死过烧烤手。现在，他的眼睛里已经燃起了战斗的渴望。
