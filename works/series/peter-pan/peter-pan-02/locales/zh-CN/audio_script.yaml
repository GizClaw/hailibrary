audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富于变化
        pitch: 中音
    wendy:
      display_name: 温迪
      tts:
        delivery: 天真笃定，懂事中带一点小大人的口气
        timbre: 明亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    mrs_darling:
      display_name: 达林太太
      tts:
        delivery: 温柔慈爱，惊讶时仍不失柔和
        timbre: 甜美温润
        pace: 舒缓自然
        pitch: 中音
    mr_darling:
      display_name: 达林先生
      tts:
        delivery: 一本正经又容易慌乱，竭力维持体面
        timbre: 饱满清晰
        pace: 平时端正，算账时急促
        pitch: 中低音
    john:
      display_name: 约翰
      tts:
        delivery: 认真自信，模仿大人时一本正经
        timbre: 清亮稚嫩
        pace: 明快利落
        pitch: 中高音
    michael:
      display_name: 迈克尔
      tts:
        delivery: 年幼直率，任性时理直气壮
        timbre: 柔软稚气
        pace: 短促活泼
        pitch: 高音
    smallest_star:
      display_name: 最小的星星
      tts:
        delivery: 淘气兴奋，像迫不及待地通风报信
        timbre: 晶亮轻盈
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 窗口留下的影子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 达林太太一声尖叫，门随即开了，仿佛有人听见铃声赶来。晚上休假刚回来的娜娜走进屋，低吼着扑向男孩。男孩轻轻一跃，跳出了窗外。达林太太又叫了一声，这次却是替他担心。她以为男孩摔死了，连忙奔到街上寻找那具小小的身体。街上什么也没有。她抬头看去，漆黑的夜里，只有一道像流星似的亮光。
        - id: ch01-b02
          speaker: narrator
          text: 达林太太回到育儿室，看见娜娜嘴里衔着东西。原来，那是男孩的影子。男孩跳向窗外时，娜娜赶紧关窗。她没捉住男孩，影子却慢了一步。窗户砰地落下，把它夹断了。
        - id: ch01-b03
          speaker: narrator
          text: 达林太太把影子翻来覆去地查看，想弄清它有没有什么古怪。可它实在普通，并没有什么特别。娜娜倒一点也不犹豫，很清楚该怎么处置。她把影子挂到窗外，显然是想让男孩回来时一眼就能看见，再轻松拿走，免得为了寻找影子惊动孩子。
        - id: ch01-b04
          speaker: narrator
          text: 可达林太太不能让它一直挂着。那样太像在晾衣服，整座房子都显得不体面。她本想拿给丈夫看，可达林先生正忙着算约翰和迈克尔的冬大衣要多少钱，头上还围着一条湿毛巾，好叫脑子清醒。为这件事去打扰他，未免太不应该。何况，她连他的回答都猜得到。
        - id: ch01-b05
          speaker: mr_darling
          text: 这都是拿狗当保姆惹出来的。
        - id: ch01-b06
          speaker: narrator
          text: 达林太太只好把影子卷好，小心收进抽屉，等合适的时候再告诉他。唉，那个机会在一星期后来了。那天是他们永远忘不了的星期五。当然，偏偏是星期五。
        - id: ch01-b07
          speaker: mrs_darling
          text: 那是星期五呀，我本来应该格外小心的。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 后来她常这样对丈夫说。那时娜娜或许就在另一边，握着她的手。
        - id: ch01-b09
          speaker: mr_darling
          text: 不，不，全怪我。祸是我乔治·达林闯的。我的罪，我的罪。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 他毕竟受过古典教育。他们夜夜坐在一起，回想那个不祥的星期五。每个细节都深深压进了脑子，又从另一面凸出来，像铸坏的钱币上的人脸。
        - id: ch01-b11
          speaker: mrs_darling
          text: 我要是没有答应去二十七号吃饭就好了。都怪我那么喜欢宴会，乔治。
          emotion: sad
        - id: ch01-b12
          speaker: mr_darling
          text: 我要是没把药倒进娜娜的碗里就好了。都怪我有那种要命的幽默天分，亲爱的。
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 娜娜湿漉漉的眼睛仿佛也在说，她要是假装喜欢那药就好了，都怪她为了小事闹脾气。他们三个轮流责怪自己，说不了几句，总有一个或者几个再也撑不住。娜娜一想到主人原本就不该让狗做保姆，更会彻底崩溃。常常是达林先生掏出手帕，亲自替她擦去眼泪。
        - id: ch01-b14
          speaker: mr_darling
          text: 那个恶魔！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 娜娜便叫一声，像在附和。达林太太却从不责骂彼得。她右边嘴角藏着的那个吻，不许她用坏话称呼他。
    - id: ch02
      title: 最后一次嬉闹
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们坐在空荡荡的育儿室里，眷恋地回忆那个可怕夜晚的每一件小事。开头平淡得很，和过去上百个夜晚一模一样。娜娜烧好了洗澡水，驮着迈克尔往浴室走。
        - id: ch02-b02
          speaker: michael
          text: 我不睡觉！我不睡，就是不睡！娜娜，还不到六点呢。哎呀，我以后再也不喜欢你了。我说了不洗澡，我就是不洗！
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 接着，达林太太穿着白色晚礼服进来了。她早早换好衣服，是因为温迪最喜欢看妈妈穿晚礼服，戴着乔治送的项链。她还借了温迪的手镯戴在腕上，而温迪最爱把手镯借给妈妈。
        - id: ch02-b04
          speaker: narrator
          text: 两个大孩子正在演温迪出生那天的爸爸妈妈。约翰模仿父亲当时的口气，郑重其事地宣布。
        - id: ch02-b05
          speaker: john
          text: 达林太太，我很高兴地告诉您，您已经做母亲了。
        - id: ch02-b06
          speaker: narrator
          text: 温迪高兴得跳起舞来，真正的达林太太当年想必也是这样。然后轮到约翰出生。约翰觉得男孩出世应该更有排场，便把场面弄得格外隆重。迈克尔洗完澡回来，也想出生一次，约翰却毫不客气地说，他们不再要孩子了。
        - id: ch02-b07
          speaker: michael
          text: 谁也不想要我。
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: 迈克尔几乎哭了。那位穿晚礼服的太太哪里受得了这个。
        - id: ch02-b09
          speaker: mrs_darling
          text: 我要你呀。我特别想要第三个孩子。
        - id: ch02-b10
          speaker: michael
          text: 那是男孩，还是女孩？
        - id: ch02-b11
          speaker: mrs_darling
          text: 男孩。
        - id: ch02-b12
          speaker: narrator
          text: 迈克尔立刻扑进她怀里。这在达林夫妇和娜娜的回忆里，本来只是一件小事。可如果那是迈克尔留在育儿室的最后一夜，它就一点也不小了。他们继续回想下去。
        - id: ch02-b13
          speaker: mr_darling
          text: 然后我像龙卷风一样冲了进来，对不对？
          emotion: sad
        - id: ch02-b14
          speaker: narrator
          text: 达林先生每次提起这件事，都很鄙视当时的自己。不过，那时的他的确像阵龙卷风。也许他还有一点情有可原。他也在为宴会换衣服，前面都很顺利，直到轮到领带。说来真叫人惊讶，这个懂股票和证券的男人，偏偏对付不了自己脖子上的一小条布。有时领带肯乖乖就范，不必争斗就能系好。有时却像存心和他作对，怎么摆弄都不肯听话。碰上后一种日子，他要是能吞下骄傲，改戴现成的领结，全家都会安宁得多。
        - id: ch02-b15
          speaker: narrator
          text: 那一晚就是这种日子。他手里抓着皱巴巴的领带，冲进育儿室。
        - id: ch02-b16
          speaker: mrs_darling
          text: 亲爱的爸爸，这是怎么啦？
        - id: ch02-b17
          speaker: mr_darling
          text: 怎么啦？这条领带就是不肯系好！往我脖子上系，它不干。往床柱上系，它倒乐意！我在床柱上系了二十遍，可到了我的脖子，它就非要告假不可！
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: 他觉得妻子还不够震惊，便板起脸继续吓唬她。
        - id: ch02-b19
          speaker: mr_darling
          text: 我先警告你。领带系不到我脖子上，我们今晚就不能出去吃饭。我不去吃饭，就再也不去上班。我不上班，我们两个都得挨饿，孩子们还会被扔到大街上。
          emotion: angry
        - id: ch02-b20
          speaker: mrs_darling
          text: 亲爱的，让我来试试吧。
          emotion: calm
        - id: ch02-b21
          speaker: narrator
          text: 她还是那么平静，而他气势汹汹地跑来，原本就是想请她帮忙。她用清凉灵巧的双手替他系好领带，孩子们围成一圈，屏住气看着，仿佛全家会不会挨饿、会不会流落街头，都由这双手来决定。有些男人见妻子轻轻松松就办成自己做不到的事，也许会觉得受了冒犯。达林先生的气度高贵得多。他随口道了谢，马上忘掉刚才那场怒火。只过了一会儿，他已经驮着迈克尔，绕着整个房间快活地跳起舞来。
        - id: ch02-b22
          speaker: mrs_darling
          text: 我们那晚玩得多疯呀！
          emotion: sad
        - id: ch02-b23
          speaker: mr_darling
          text: 那是最后一次了！
          emotion: sad
        - id: ch02-b24
          speaker: mrs_darling
          text: 乔治，你记得吗？迈克尔忽然问我，他当初是怎么认识我的。
        - id: ch02-b25
          speaker: mr_darling
          text: 我记得！
        - id: ch02-b26
          speaker: mrs_darling
          text: 那几个孩子真可爱，你说是不是？
        - id: ch02-b27
          speaker: mr_darling
          text: 他们是我们的，是我们的呀！现在却都不见了。
          emotion: sad
        - id: ch02-b28
          speaker: narrator
          text: 娜娜一出现，这场嬉闹便停了。达林先生偏偏一头撞上她，崭新的裤子立刻沾满狗毛。那不只是一条新裤子，还是他有生以来第一条镶饰带的裤子。他心疼得几乎要哭，只得狠狠咬住嘴唇，把眼泪忍回去。达林太太当然替他把狗毛一点点刷掉，他却越看越不痛快，又说起让狗当保姆根本就是个错误。
        - id: ch02-b29
          speaker: mrs_darling
          text: 乔治，娜娜是我们家的宝贝。
        - id: ch02-b30
          speaker: mr_darling
          text: 这一点我不否认。可我有时总担心，她把孩子们当成小狗了。
        - id: ch02-b31
          speaker: mrs_darling
          text: 不会的，亲爱的。她一定知道孩子们有灵魂。
        - id: ch02-b32
          speaker: mr_darling
          text: 这可难说。真的难说。
        - id: ch02-b33
          speaker: narrator
          text: 达林太太觉得机会来了，便说起那个男孩。丈夫起初完全不信，看到那道影子以后，却认真起来。
        - id: ch02-b34
          speaker: mr_darling
          text: 我不认识这个人，不过瞧这模样，倒真像个坏蛋。
        - id: ch02-b35
          speaker: mr_darling
          text: 你还记得吧？我们正说这件事，娜娜就衔着迈克尔的药瓶进来了。娜娜，你以后不会再用嘴衔药瓶了。全怪我。
          emotion: sad
    - id: ch03
      title: 一碗恶作剧
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 达林先生虽然是个坚强的男人，在吃药这件事上却做得相当傻。他有个弱点，总觉得自己从小到大，喝药从来都很勇敢。所以，迈克尔躲开娜娜嘴里的药匙时，他立刻责备孩子。
        - id: ch03-b02
          speaker: mr_darling
          text: 迈克尔，拿出男子汉的样子来。
        - id: ch03-b03
          speaker: michael
          text: 不吃！我就是不吃！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 达林太太去给迈克尔拿巧克力。达林先生觉得她这样做太不坚定，便朝她背后喊。
        - id: ch03-b05
          speaker: mr_darling
          text: 别这样惯孩子！迈克尔，我像你这么大时，吃药连一声都不哼。我还会谢谢爸爸妈妈，给我一瓶瓶药治病呢。
        - id: ch03-b06
          speaker: narrator
          text: 他真的以为这是真的。已经换上睡衣的温迪也信了，还想用这件事鼓励弟弟。
        - id: ch03-b07
          speaker: wendy
          text: 爸爸，你有时候喝的那种药，比迈克尔的难喝多了，对吧？
        - id: ch03-b08
          speaker: mr_darling
          text: 那当然，难喝得多。我现在就能喝一口，给迈克尔做个榜样。可惜呀，我把药瓶弄丢了。
        - id: ch03-b09
          speaker: narrator
          text: 他没有真的弄丢药瓶。他半夜爬到衣柜顶上，亲手把药藏了起来。可忠心的莉莎已经找到了，又把它放回洗脸台。
        - id: ch03-b10
          speaker: wendy
          text: 爸爸，我知道药在哪里！我替你拿来。
        - id: ch03-b11
          speaker: narrator
          text: 温迪最爱帮忙。不等父亲阻拦，她已经跑了出去。达林先生的心情立刻奇怪地沉了下去。
        - id: ch03-b12
          speaker: mr_darling
          text: 约翰，那东西实在太恶心了。又黏又甜，喝下去真难受。
          emotion: disgusted
        - id: ch03-b13
          speaker: john
          text: 一口就喝完了，爸爸。
        - id: ch03-b14
          speaker: narrator
          text: 温迪拿着一杯药冲了回来，跑得气喘吁吁。
        - id: ch03-b15
          speaker: wendy
          text: 我能跑多快，就跑多快啦。
        - id: ch03-b16
          speaker: mr_darling
          text: 你真是快得不得了。现在，迈克尔先喝。
        - id: ch03-b17
          speaker: narrator
          text: 他客气得带着恶意，可温迪完全没听出来。他仍旧固执地坚持让迈克尔先喝。迈克尔天性多疑，立刻反驳。
        - id: ch03-b18
          speaker: michael
          text: 应该爸爸先喝。
        - id: ch03-b19
          speaker: mr_darling
          text: 我喝了会吐，你们可知道。
        - id: ch03-b20
          speaker: john
          text: 来吧，爸爸，喝下去。
        - id: ch03-b21
          speaker: mr_darling
          text: 约翰，你闭嘴。
          emotion: angry
        - id: ch03-b22
          speaker: wendy
          text: 可我以为爸爸喝药很轻松呀。
        - id: ch03-b23
          speaker: mr_darling
          text: 重点不在这里。重点是，我杯子里的药，比迈克尔勺子里的多。这不公平！就算只剩最后一口气，我也要说，这不公平。
          emotion: angry
        - id: ch03-b24
          speaker: michael
          text: 爸爸，我还等着呢。
        - id: ch03-b25
          speaker: mr_darling
          text: 你在等有什么了不起？我也在等。
        - id: ch03-b26
          speaker: michael
          text: 爸爸是个胆小鬼布丁。
        - id: ch03-b27
          speaker: mr_darling
          text: 你也是胆小鬼布丁。
        - id: ch03-b28
          speaker: michael
          text: 我才没害怕。
        - id: ch03-b29
          speaker: mr_darling
          text: 我也没害怕。
        - id: ch03-b30
          speaker: michael
          text: 那你喝呀。
        - id: ch03-b31
          speaker: mr_darling
          text: 那你先喝。
        - id: ch03-b32
          speaker: wendy
          text: 你们为什么不一起喝呢？
        - id: ch03-b33
          speaker: mr_darling
          text: 当然可以。迈克尔，准备好了吗？
        - id: ch03-b34
          speaker: narrator
          text: 温迪数了一、二、三。迈克尔咽下了自己的药，达林先生却把杯子藏到背后。迈克尔气得大叫，温迪也忍不住惊呼。
        - id: ch03-b35
          speaker: wendy
          text: 爸爸，你怎么能这样！
          emotion: surprised
        - id: ch03-b36
          speaker: mr_darling
          text: 你这话是什么意思？迈克尔，别再嚷了。我是想喝的，只不过……只不过没喝着。
        - id: ch03-b37
          speaker: narrator
          text: 三个孩子都盯着他看，像是一点也不敬佩他了。这实在叫他受不了。等娜娜进了浴室，他便换成央求的口气。
        - id: ch03-b38
          speaker: mr_darling
          text: 你们听我说，我刚想到一个特别好的玩笑。我要把药倒进娜娜的碗里。药像牛奶，她一定会当成牛奶喝掉！
        - id: ch03-b39
          speaker: narrator
          text: 那药的确像牛奶，可孩子们没有父亲的幽默感。他们责备地看着他把药倒进娜娜的碗。
        - id: ch03-b40
          speaker: mr_darling
          text: 这不是很好玩吗？
        - id: ch03-b41
          speaker: narrator
          text: 连他自己都说得不太有把握。达林太太和娜娜回来时，孩子们却没敢揭穿他。
        - id: ch03-b42
          speaker: mr_darling
          text: 娜娜，好狗狗。我在你的碗里放了一点牛奶。
        - id: ch03-b43
          speaker: narrator
          text: 娜娜摇着尾巴跑过去，开始舔那碗药。随后，她回头看了达林先生一眼。那不是愤怒的一眼。她只让他看见一颗硕大的红泪珠，正是那种会让我们替高贵的狗难过的眼泪。然后，她慢慢爬回狗窝。
        - id: ch03-b44
          speaker: narrator
          text: 达林先生羞愧极了，却不肯认输。屋里静得可怕。达林太太俯身闻了闻碗。
        - id: ch03-b45
          speaker: mrs_darling
          text: 乔治，这明明是你的药！
          emotion: surprised
        - id: ch03-b46
          speaker: mr_darling
          text: 我只是开个玩笑！我为了逗这个家里的人开心，累死累活，结果有什么好处？
          emotion: angry
        - id: ch03-b47
          speaker: narrator
          text: 达林太太安慰两个男孩，温迪抱住娜娜。温迪一直没有松手，达林先生更加恼火。
        - id: ch03-b48
          speaker: mr_darling
          text: 对，就这样，使劲宠她吧！你们谁也不宠我。那当然啦，我只是挣钱养家的人，怎么配让人宠呢？为什么？为什么？为什么？
          emotion: angry
    - id: ch04
      title: 娜娜被拴在院里
      blocks:
        - id: ch04-b01
          speaker: mrs_darling
          text: 乔治，小声一点。仆人们会听见的。
        - id: ch04-b02
          speaker: narrator
          text: 说来也怪，他们已经习惯把莉莎一个人叫成“仆人们”。
        - id: ch04-b03
          speaker: mr_darling
          text: 听见就听见！把全世界都叫来吧。可这条狗休想再在我的育儿室里称王称霸，连一个钟头也不行。
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 孩子们哭了。娜娜跑到他面前哀求，他却挥手赶她回去。这一来，他又觉得自己是个坚强的男人了。
        - id: ch04-b05
          speaker: mr_darling
          text: 求我也没用！你该待在院子里。现在就出去，我要把你拴起来。
          emotion: angry
        - id: ch04-b06
          speaker: mrs_darling
          text: 乔治，求你想想我说过的那个男孩。
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 可他根本不肯听。他一定要向全家证明，这座房子里究竟是谁说了算。娜娜缩在狗窝里，任凭他命令也不肯出来。他便把声音放得甜甜的，先哄她走到外面，再突然粗暴地抓住她，硬把她拖出育儿室。他做每个动作时都为自己羞愧，却还是没有停手。只因为他天性太多情，总想得到别人的敬佩。把娜娜拴在后院以后，这位可怜的父亲独自走到过道里坐下，用两手的指关节紧紧抵住眼睛。
        - id: ch04-b08
          speaker: narrator
          text: 达林太太默默替孩子们上了床，又点亮小夜灯。屋里听得见娜娜的叫声。
        - id: ch04-b09
          speaker: john
          text: 她叫得这么伤心，是因为爸爸正在院里拴她。
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: 约翰呜咽着。温迪却更懂娜娜，尽管她一点也没猜到将要发生什么。
        - id: ch04-b11
          speaker: wendy
          text: 不对，这不是娜娜难过时的叫声。她闻到危险，才会这样叫。
        - id: ch04-b12
          speaker: narrator
          text: 他们还不知道，危险已经逼近了。
        - id: ch04-b13
          speaker: john
          text: 温迪，你真的确定吗？
        - id: ch04-b14
          speaker: wendy
          text: 我当然确定。
        - id: ch04-b15
          speaker: narrator
          text: 达林太太浑身一颤，走到窗边。窗户锁得很牢。她向外看去，夜空中撒满星星。星星挤在房子周围，好像都想看看这里会发生什么。她没有留意，也没看见一两颗小星星正朝她眨眼。可是，一阵说不出缘由的恐惧抓紧了她的心。
        - id: ch04-b16
          speaker: mrs_darling
          text: 我真希望今晚不用去参加宴会！
          emotion: fearful
        - id: ch04-b17
          speaker: narrator
          text: 迈克尔已经快睡着了，却还是听出妈妈心神不宁。
        - id: ch04-b18
          speaker: michael
          text: 妈妈，小夜灯亮着的时候，还有东西能伤害我们吗？
        - id: ch04-b19
          speaker: mrs_darling
          text: 没有，宝贝。那些灯是妈妈留下来的眼睛，会替我守着你们。
          emotion: calm
        - id: ch04-b20
          speaker: narrator
          text: 她从一张小床走到另一张小床，给孩子们唱着有魔力的歌。小迈克尔伸出双臂，紧紧搂住她。
        - id: ch04-b21
          speaker: michael
          text: 妈妈，有你真好。
          emotion: happy
        - id: ch04-b22
          speaker: narrator
          text: 此后很长一段时间里，这是她最后一次听见迈克尔说话。
    - id: ch05
      title: 星星发出信号
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 二十七号离达林家只有几码远。不过地上刚落了一层薄雪，达林夫妇怕弄脏鞋，小心地踩着雪走过去。街上只剩他们两个人，所有星星都在望着他们。
        - id: ch05-b02
          speaker: narrator
          text: 星星很美，却不能亲自插手任何事情，只能永远留在天上旁观。这是因为它们在很久很久以前做错了事，受到了惩罚。时间过去太久，现在已经没有一颗星星记得当初犯了什么错。年纪越大的星星，看得越久，眼睛也渐渐失去神采，平时很少开口。星星真要说话，就用眨眼来交谈。那些小星星还没有看厌这一切，对地上的每件事都感到新奇。
        - id: ch05-b03
          speaker: narrator
          text: 它们其实不怎么喜欢彼得。那个淘气鬼常常悄悄绕到星星背后，想一口把它们吹灭。可是星星最爱看热闹。今晚，它们都站在彼得这边，急着让大人赶快离开。
        - id: ch05-b04
          speaker: narrator
          text: 二十七号的门刚在达林夫妇身后关上，整个天空便骚动起来。银河里最小的那颗星星尖声喊道。
        - id: ch05-b05
          speaker: smallest_star
          text: 彼得，现在来吧！
          emotion: happy
