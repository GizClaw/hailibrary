  chapters:
    - id: ch01
      title: The Shadow at the Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mrs. Darling screamed. At once the door opened, almost as if her cry had rung a bell, and Nana came back from her evening out. She growled and sprang at the boy. He slipped lightly through the window. Mrs. Darling screamed again, but now she was afraid for him. She thought he had fallen to his death. She hurried into the street to find his little body, but there was nothing there. When she looked up into the black night, all she could see was something that looked like a shooting star.

            Back in the nursery, she found Nana holding something in her mouth. It was the boy's shadow. Nana had snapped the window shut as he jumped away. She was too late to catch him, but his shadow had not escaped in time. The window came down and cut it clean off.

            Mrs. Darling studied the shadow carefully. It was only an ordinary shadow.

            Nana knew exactly what ought to be done. She hung it outside the window. Her meaning was plain. The boy would surely come back for it, so they should leave it where he could take it without waking the children.

            Mrs. Darling could not leave it there, though. It looked too much like laundry and made the whole house seem less respectable. She considered showing it to Mr. Darling, but he was busy adding up the cost of winter coats for John and Michael. He had wrapped a wet towel around his head to keep his mind clear. It seemed unfair to interrupt him. Besides, she knew what he would say.
        - id: ch01-b02
          speaker: mr_darling
          text: "This is what comes of letting a dog be the children's nurse."
        - id: ch01-b03
          speaker: narrator
          text: >-
            So Mrs. Darling rolled up the shadow and tucked it safely into a drawer. She would tell her husband when the right moment came.

            Ah, me.
    - id: ch02
      title: That Friday Remembered
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The right moment came one week later, on the Friday no one in that family would ever forget. Of course it happened on a Friday.

            Afterward, Mrs. Darling and her husband went over that night again and again. Nana might sit on Mrs. Darling's other side, holding her hand.
        - id: ch02-b02
          speaker: mrs_darling
          text: "I should have been especially careful on a Friday."
          emotion: sad
        - id: ch02-b03
          speaker: mr_darling
          text: >-
            No, no. It was all my doing. I, George Darling, am to blame. Mea culpa, mea culpa.
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: >-
            He had received a classical education. Night after night, they sat together remembering that terrible Friday. At last, every detail seemed stamped into their minds, like a face pressed so hard into a bad coin that it showed through the other side.
        - id: ch02-b05
          speaker: mrs_darling
          text: "If only I hadn't agreed to dinner at number twenty-seven."
          emotion: sad
        - id: ch02-b06
          speaker: mr_darling
          text: "If only I hadn't emptied my medicine into Nana's bowl."
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: >-
            Nana's wet eyes added their own regret. If only she had pretended to like the medicine.
        - id: ch02-b08
          speaker: mrs_darling
          text: "I was too fond of parties, George."
          emotion: sad
        - id: ch02-b09
          speaker: mr_darling
          text: "And I had that dreadful urge to make a joke, my dear."
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: >-
            Nana's eyes blamed her own hurt feelings over little things. Then one or all of them would break down. Nana suffered most when she thought that perhaps people had been right. Perhaps a dog should never have been the children's nurse. Often Mr. Darling himself held a handkerchief to her eyes.
        - id: ch02-b11
          speaker: mr_darling
          text: "That monster!"
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            Nana answered with a bark. Mrs. Darling never joined them in calling Peter names. Something at the right-hand corner of her mouth would not let her.

            Together they sat in the empty nursery, lovingly recalling every small detail of that dreadful evening. It had started like a hundred ordinary evenings. Nana heated the water for Michael's bath and carried him there on her back.
    - id: ch03
      title: The Last Romp
      blocks:
        - id: ch03-b01
          speaker: michael
          text: >-
            I won't go to bed! I won't, I won't! Nana, it isn't even six yet. Oh, dear! I won't love you anymore, Nana. I told you, I won't have a bath. I won't!
          emotion: angry
        - id: ch03-b02
          speaker: narrator
          text: >-
            Michael still believed he had the final word on such matters.

            Then Mrs. Darling came in wearing her white evening gown. She had dressed early because Wendy loved seeing her that way, with the necklace George had given her. Around her arm was Wendy's bracelet. She had borrowed it, and Wendy loved lending it to her.

            The two older children were playing at being their mother and father on the day Wendy was born. John spoke in almost the very voice Mr. Darling might have used that day.
        - id: ch03-b03
          speaker: john
          text: "Mrs. Darling, I am delighted to announce that you are now a mother."
        - id: ch03-b04
          speaker: narrator
          text: >-
            Wendy danced for joy, just as the real Mrs. Darling must have danced. Next came John's birth. He gave it all the ceremony he thought the birth of a boy deserved. By then Michael had come back from his bath. He wanted to be born too, but John told him bluntly that the family did not need another child.

            Michael almost cried.
        - id: ch03-b05
          speaker: michael
          text: "Nobody wants me."
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: >-
            The lady in the evening gown could not bear to hear that.
        - id: ch03-b07
          speaker: mrs_darling
          text: "I do. I want a third child very much."
        - id: ch03-b08
          speaker: michael
          text: "Do you want a boy or a girl?"
        - id: ch03-b09
          speaker: mrs_darling
          text: "A boy."
        - id: ch03-b10
          speaker: narrator
          text: >-
            Michael flew into her arms. It seemed like such a small memory for Mr. and Mrs. Darling and Nana to hold on to. But it was not small at all if this was to be Michael's last night in the nursery.

            Their remembering went on.
        - id: ch03-b11
          speaker: mr_darling
          text: "That was when I stormed in like a tornado, wasn't it?"
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: >-
            He despised himself for it now. And truly, he had rushed in like a tornado.

            There may have been some excuse for him. He was dressing for the party too, and everything had gone smoothly until he reached his tie. Though Mr. Darling understood stocks and shares, he had never mastered his tie. Sometimes it surrendered without a struggle. On other nights, the whole household would have been happier if he had swallowed his pride and worn a ready-made one.

            This was one of those nights. He burst into the nursery clutching the small, crumpled brute in his hand.
        - id: ch03-b13
          speaker: wendy
          text: "What's wrong, Father?"
        - id: ch03-b14
          speaker: mr_darling
          text: >-
            Wrong? This tie refuses to tie! Not around my neck, anyway. Around the bedpost? Certainly! I've tied it there twenty times. But around my neck? Oh, no. It simply will not do it!
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: >-
            Mrs. Darling did not seem impressed enough, so he continued in a severe voice.
        - id: ch03-b16
          speaker: mr_darling
          text: >-
            Let me warn you, Mother. If this tie does not go around my neck, we are not going to dinner. If I miss dinner tonight, I will never return to the office. Then you and I will starve, and our children will be thrown into the street.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Mrs. Darling remained peaceful.
        - id: ch03-b18
          speaker: mrs_darling
          text: "Let me have a try, dear."
          emotion: calm
        - id: ch03-b19
          speaker: narrator
          text: >-
            That, of course, was exactly what he had come to ask. With her cool hands, she tied the tie while the children gathered around to see how their fate would turn out. Some men might have resented how easily she did it. Mr. Darling was too fine for that. He thanked her in an offhand way, forgot his anger at once, and a moment later danced around the room with Michael riding on his back.
        - id: ch03-b20
          speaker: mrs_darling
          text: "How wildly we all played!"
          emotion: sad
        - id: ch03-b21
          speaker: mr_darling
          text: "Our last game together!"
          emotion: sad
        - id: ch03-b22
          speaker: mrs_darling
          text: >-
            Oh, George, do you remember when Michael suddenly asked me, "Mother, how did you first get to know me?"
          emotion: sad
        - id: ch03-b23
          speaker: mr_darling
          text: "I remember."
          emotion: sad
        - id: ch03-b24
          speaker: mrs_darling
          text: "They were dear little things, weren't they, George?"
          emotion: sad
        - id: ch03-b25
          speaker: mr_darling
          text: "They belonged to us. They were ours, and now they're gone."
          emotion: sad
        - id: ch03-b26
          speaker: narrator
          text: >-
            The romp ended when Nana appeared. Mr. Darling had the terrible luck to bump into her, and her hairs covered his trousers. These were not only new trousers. They were his first pair with braid down the sides. He had to bite his lip to hold back his tears. Mrs. Darling brushed him off, but he began saying again that a dog should not be a nurse.
        - id: ch03-b27
          speaker: mrs_darling
          text: "George, Nana is wonderful."
        - id: ch03-b28
          speaker: mr_darling
          text: "I'm sure she is. Still, sometimes I worry that she thinks the children are puppies."
        - id: ch03-b29
          speaker: mrs_darling
          text: "Oh, no, dear. I'm certain she knows they have souls."
        - id: ch03-b30
          speaker: mr_darling
          text: "I wonder. Yes, I do wonder."
        - id: ch03-b31
          speaker: narrator
          text: >-
            Mrs. Darling saw her chance to tell him about the boy at the window. At first, he dismissed the whole story. Then she brought out the shadow, and he grew thoughtful as he examined it.
        - id: ch03-b32
          speaker: mr_darling
          text: "I don't recognize whoever this belongs to, but he certainly looks like a scoundrel."
    - id: ch04
      title: The Medicine in Nana's Bowl
      blocks:
        - id: ch04-b01
          speaker: mr_darling
          text: >-
            We were still talking about the shadow when Nana brought in Michael's medicine. You never carried that bottle in your mouth again, Nana. What happened next was entirely my fault.
          emotion: sad
        - id: ch04-b02
          speaker: narrator
          text: >-
            For all his strength, Mr. Darling behaved very foolishly over the medicine. He had one weakness. He liked to believe that he had taken medicine bravely all his life. So when Michael dodged the spoon Nana held in her mouth, Mr. Darling corrected him.
        - id: ch04-b03
          speaker: mr_darling
          text: "Be brave about it, Michael."
        - id: ch04-b04
          speaker: michael
          text: "No! I won't!"
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: >-
            Mrs. Darling went to fetch him a chocolate. Mr. Darling thought she was not being firm enough.
        - id: ch04-b06
          speaker: mr_darling
          text: >-
            Mother, don't spoil him. Michael, when I was your age, I swallowed medicine without making a sound. I would say, "Thank you, kind parents, for giving me these bottles that make me well."
        - id: ch04-b07
          speaker: narrator
          text: >-
            Mr. Darling honestly believed this. Wendy, now dressed in her nightgown, believed him too. She tried to encourage Michael.
        - id: ch04-b08
          speaker: wendy
          text: "Father, isn't your own medicine much worse than Michael's?"
        - id: ch04-b09
          speaker: mr_darling
          text: >-
            Far worse. And I'd swallow some right now to set Michael an example, if only I hadn't misplaced the bottle.
        - id: ch04-b10
          speaker: narrator
          text: >-
            He had not exactly misplaced it. In the middle of the night, he had climbed to the top of the wardrobe and hidden it there. He did not know that faithful Liza had found it and returned it to his washstand.
        - id: ch04-b11
          speaker: wendy
          text: "I know where it is, Father. I'll get it!"
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: >-
            Wendy hurried away before he could stop her. All at once, Mr. Darling's spirits sank.
        - id: ch04-b13
          speaker: mr_darling
          text: "John, that medicine is horrible. It's the nasty kind that's sticky and sweet."
          emotion: fearful
        - id: ch04-b14
          speaker: john
          text: "It'll be finished before you know it, Father."
        - id: ch04-b15
          speaker: narrator
          text: >-
            Wendy rushed back with the medicine poured into a glass.
        - id: ch04-b16
          speaker: wendy
          text: "I came as fast as I could."
        - id: ch04-b17
          speaker: mr_darling
          text: >-
            Amazingly fast. But Michael should take his first.
        - id: ch04-b18
          speaker: michael
          text: "You go first, Father."
        - id: ch04-b19
          speaker: narrator
          text: >-
            Michael was naturally suspicious.
        - id: ch04-b20
          speaker: mr_darling
          text: "You do understand that this may make me sick."
        - id: ch04-b21
          speaker: john
          text: "Go ahead, Father."
        - id: ch04-b22
          speaker: mr_darling
          text: "Be quiet, John!"
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: >-
            Wendy could not understand his hesitation.
        - id: ch04-b24
          speaker: wendy
          text: "But Father, I thought medicine was easy for you."
        - id: ch04-b25
          speaker: mr_darling
          text: >-
            That isn't the issue. Look at my glass. There's much more in it than Michael has in his spoon. That is unfair, and I'd say so with my final breath. It is not fair!
          emotion: angry
        - id: ch04-b26
          speaker: narrator
          text: >-
            His proud heart felt ready to burst.
        - id: ch04-b27
          speaker: michael
          text: "I'm waiting, Father."
        - id: ch04-b28
          speaker: mr_darling
          text: "You may be waiting, but I'm waiting too."
        - id: ch04-b29
          speaker: michael
          text: "Father is a cowardly custard!"
        - id: ch04-b30
          speaker: mr_darling
          text: "Well, you're a cowardly custard too!"
        - id: ch04-b31
          speaker: michael
          text: "I'm not scared."
        - id: ch04-b32
          speaker: mr_darling
          text: "Neither am I."
        - id: ch04-b33
          speaker: michael
          text: "Then drink it."
        - id: ch04-b34
          speaker: mr_darling
          text: "You drink yours."
        - id: ch04-b35
          speaker: narrator
          text: >-
            Wendy suddenly had a wonderful idea.
        - id: ch04-b36
          speaker: wendy
          text: "Why don't you both take your medicine together?"
        - id: ch04-b37
          speaker: mr_darling
          text: "Certainly. Ready, Michael?"
        - id: ch04-b38
          speaker: narrator
          text: >-
            Wendy counted, "One, two, three!" Michael swallowed his medicine. Mr. Darling slipped his glass behind his back.

            Michael howled with rage.
        - id: ch04-b39
          speaker: wendy
          text: "Oh, Father!"
          emotion: surprised
        - id: ch04-b40
          speaker: mr_darling
          text: >-
            What is that supposed to mean? Michael, stop that noise. I intended to drink mine, but I... I missed my mouth.
        - id: ch04-b41
          speaker: narrator
          text: >-
            All three children stared at him as if they no longer admired him. It was dreadful. As soon as Nana went into the bathroom, he pleaded with them.
        - id: ch04-b42
          speaker: mr_darling
          text: >-
            Listen, all of you. I've just thought of a marvelous joke. I'll tip my medicine into Nana's bowl. She'll see the color and think it's milk, and then she'll drink it!
        - id: ch04-b43
          speaker: narrator
          text: >-
            The medicine was the same color as milk. The children did not share their father's sense of humor. They watched him pour it into Nana's bowl with reproach in their eyes.
        - id: ch04-b44
          speaker: mr_darling
          text: "That'll be funny... won't it?"
        - id: ch04-b45
          speaker: narrator
          text: >-
            When Mrs. Darling and Nana came back, the children did not dare tell them what he had done.
        - id: ch04-b46
          speaker: mr_darling
          text: "Good Nana. I've poured a little milk into your bowl."
        - id: ch04-b47
          speaker: narrator
          text: >-
            Nana wagged her tail, hurried to the bowl, and began to lap. Then she looked at Mr. Darling. There was no anger in her look. She only showed him the great red tear that makes us ache for noble dogs. Then she crept into her kennel.

            Mr. Darling felt horribly ashamed, but he refused to give in. In the terrible silence, Mrs. Darling bent over the bowl and smelled it.
        - id: ch04-b48
          speaker: mrs_darling
          text: "Oh, George. That's your medicine!"
          emotion: surprised
        - id: ch04-b49
          speaker: narrator
          text: >-
            She comforted the boys while Wendy put her arms around Nana.
        - id: ch04-b50
          speaker: mr_darling
          text: >-
            It was just a joke! I work myself to the bone trying to bring some humor into this house, and what good does it do?
          emotion: angry
        - id: ch04-b51
          speaker: narrator
          text: >-
            Wendy went on holding Nana.
        - id: ch04-b52
          speaker: mr_darling
          text: >-
            Yes, go on! Make a fuss over her! No one ever makes a fuss over me. Of course not. I'm only the man who earns the money. Why should anyone care for me? Why? Why? Why?
          emotion: angry
        - id: ch04-b53
          speaker: mrs_darling
          text: "George, please lower your voice. The servants will hear."
        - id: ch04-b54
          speaker: narrator
          text: >-
            Somehow, they had fallen into the habit of calling Liza "the servants."
        - id: ch04-b55
          speaker: mr_darling
          text: >-
            Let them hear! Bring in the whole world! But that dog will not rule my nursery for one more hour.
          emotion: angry
        - id: ch04-b56
          speaker: narrator
          text: >-
            The children began to cry, and Nana ran to him as if begging him to change his mind. He waved her away. At last, he felt like a strong man again.
        - id: ch04-b57
          speaker: mr_darling
          text: "Begging won't help you. You belong in the yard, and I'm tying you there this instant."
          emotion: angry
    - id: ch05
      title: Nana's Warning
      blocks:
        - id: ch05-b01
          speaker: mrs_darling
          text: "George, please. Think about what I told you about that boy."
          emotion: fearful
        - id: ch05-b02
          speaker: narrator
          text: >-
            But Mr. Darling would not listen. He meant to prove that he was master of his own house. When orders could not bring Nana out of her kennel, he coaxed her with sweet words. Then he grabbed her roughly and dragged her from the nursery. He was ashamed even as he did it. His nature was too affectionate, and he longed too much to be admired. After tying Nana in the backyard, the unhappy father sat in the passage and pressed his knuckles to his eyes.

            Meanwhile, Mrs. Darling put the children to bed in a silence they were not used to. She lit their night-lights. Nana's barking reached them from outside.
        - id: ch05-b03
          speaker: john
          text: "She's barking because Father is chaining her in the yard."
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: >-
            John whimpered, but Wendy understood Nana better. She had no idea what was about to happen.
        - id: ch05-b05
          speaker: wendy
          text: "That isn't Nana's sad bark. She makes that sound when she can smell danger."
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: >-
            Danger!
        - id: ch05-b07
          speaker: mrs_darling
          text: "Are you certain, Wendy?"
          emotion: fearful
        - id: ch05-b08
          speaker: wendy
          text: "Oh, yes."
        - id: ch05-b09
          speaker: narrator
          text: >-
            Mrs. Darling trembled and hurried to the window. It was firmly fastened. Outside, the night was sprinkled with stars. They seemed to crowd around the house, curious to see what would happen. She did not notice them, or the smaller stars winking at her. A fear she could not name seized her heart.
        - id: ch05-b10
          speaker: mrs_darling
          text: "Oh, I wish I weren't going to a party tonight!"
          emotion: fearful
        - id: ch05-b11
          speaker: narrator
          text: >-
            Even Michael, already half asleep, could tell that something troubled her.
        - id: ch05-b12
          speaker: michael
          text: "Mother, can anything hurt us after you light the night-lights?"
        - id: ch05-b13
          speaker: mrs_darling
          text: "Nothing can hurt you, precious. Those lights are the eyes a mother leaves behind to watch over her children."
          emotion: calm
        - id: ch05-b14
          speaker: narrator
          text: >-
            She moved from one bed to another, singing charms over her children. Little Michael threw his arms around her.
        - id: ch05-b15
          speaker: michael
          text: "Mother, I'm so glad I have you."
          emotion: happy
        - id: ch05-b16
          speaker: narrator
          text: >-
            Those were the last words she would hear him say for a long time.

            Number twenty-seven stood only a few yards away. A light snow had fallen, and Father and Mother Darling stepped carefully across it so they would not dirty their shoes. They were already the only people left in the street. Every star watched them go.

            Stars are beautiful, but they can never take part in anything. They must look on forever. This is their punishment for something they did so long ago that no star remembers it now. The older stars have grown glassy-eyed and hardly ever speak. Winking is how stars talk. The little ones still wonder about things.

            The stars were not truly Peter's friends. He sometimes crept up behind them and tried to blow them out. Still, they loved fun, so tonight they took his side. They wanted the grown-ups out of the way.

            The moment the door of number twenty-seven closed behind Mr. and Mrs. Darling, the whole sky stirred. The smallest star in the Milky Way cried out.
        - id: ch05-b17
          speaker: little_star
          text: "Now, Peter!"
          emotion: happy
