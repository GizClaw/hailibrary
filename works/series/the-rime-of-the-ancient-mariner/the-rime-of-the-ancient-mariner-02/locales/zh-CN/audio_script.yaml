audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    sailor_1:
      display_name: 水手甲
      tts:
        delivery: 直率粗声，随众人的恐惧改变判断
        timbre: 粗厚
        pace: 中等
        pitch: 中低
    sailor_2:
      display_name: 水手乙
      tts:
        delivery: 紧张急促，话里带着责怪
        timbre: 沙哑
        pace: 稍快
        pitch: 中
    sailor_3:
      display_name: 水手丙
      tts:
        delivery: 迷信而不安，跟随同伴齐声断言
        timbre: 干涩
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二章
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: |-
            太阳改从右边的海面升起，身影仍藏在雾里，到了晚上，又从左边沉进海中。和顺的南风还在船后吹着，可那只可爱的鸟再也没有跟来。水手们天天呼唤，它却再不会为了吃食或嬉游，飞到我们身边了。
        - id: ch01-b02
          speaker: ancient_mariner
          text: |-
            我知道自己犯下了地狱般的罪，这场祸也会落到众人头上。他们认定，是我杀死了那只唤来清风的鸟。
        - id: ch01-b03
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: |-
            可恶！你竟杀了那只给我们唤来清风的鸟！
          emotion: angry
        - id: ch01-b04
          speaker: ancient_mariner
          text: |-
            后来，太阳不再暗淡，也不再发红。它辉煌地升起来，像上帝的头颅。水手们马上换了说法，认定是我除掉了那只带来浓雾的鸟。
        - id: ch01-b05
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: |-
            杀得对！这种会带来浓雾的鸟，本来就该杀掉！
        - id: ch01-b06
          speaker: ancient_mariner
          text: |-
            清风徐徐吹，白色浪沫从船边飞过。船身劈开海水，身后那道水痕一路畅然伸展。我们就这样破浪闯进那片寂静的海，成了有史以来的第一群人。
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            可风忽然停了，船帆也失去力气，软软地垂下来。那情形凄惨到了极点。四周一点声息也没有，我们偶尔说一句话，也只是想打破海上的死寂。
        - id: ch01-b08
          speaker: ancient_mariner
          text: |-
            天空热得灼人，泛着铜一样的颜色。到了正午，血红的太阳直悬在桅杆上方，看起来只有月亮那么大。
        - id: ch01-b09
          speaker: ancient_mariner
          text: |-
            一天又一天，一天又一天，我们还是困在那里。没有一丝风，船动弹不得，海面也纹丝不动。我们就像画中的一条船，停在画中的一片海上。
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            水，水，到处都是水，船上的木板却在烈日下一块块干缩。水，水，到处都是水，四面八方把船围住，我们却连一滴也不能喝。
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            连深海也腐烂了。基督啊，世上怎么会有这种事！长着腿的黏滑生物，就在黏滑的海面上爬来爬去。
        - id: ch01-b12
          speaker: ancient_mariner
          text: |-
            夜一降临，鬼火便一团接一团，乱纷纷地绕着船旋转、舞蹈。海水像女巫熬出的油，在黑夜里烧出绿色、蓝色和白色的火光。
        - id: ch01-b13
          speaker: ancient_mariner
          text: |-
            有些水手从梦里醒来，确信有个精灵在折磨我们。他们说，那精灵从冰雪和迷雾笼罩的地方一直跟到这里，此刻就潜在九英寻深的水下。
        - id: ch01-b14
          speaker: ancient_mariner
          text: |-
            我们渴到了极点，每个人的舌头都从根部枯萎了。谁也说不出话，就像喉咙里塞满了烟灰。
        - id: ch01-b15
          speaker: ancient_mariner
          text: |-
            唉，那真是苦难的日子！船上不论老少，个个都用充满憎恶的眼神看我。他们从我胸前取下十字架，再把那只信天翁挂到我的颈上。
