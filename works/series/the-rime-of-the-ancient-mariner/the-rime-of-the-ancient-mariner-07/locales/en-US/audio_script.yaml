  chapters:
    - id: ch01
      title: Part The Seventh
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: The good Hermit lived in the woods that sloped down to the sea. He had a sweet, strong voice, and he loved talking with sailors who came from distant lands.
        - id: ch01-b02
          speaker: ancient_mariner
          text: Morning, noon, and evening, he knelt to pray. His cushion was the thick moss that covered an old, rotting oak stump.
        - id: ch01-b03
          speaker: ancient_mariner
          text: As the little boat drew near, I heard the men speaking.
        - id: ch01-b04
          speaker: unidentified_voice
          text: This is strange! What happened to all those beautiful lights? They were signaling to us only a moment ago.
        - id: ch01-b05
          speaker: hermit
          text: Strange indeed! No one answered when we called. The planks look twisted, and look at those sails. They are so thin and dry. I have never seen anything like them, except perhaps the brown skeletons of leaves that drift along my forest stream. That happens when snow weighs down the ivy and the owl calls to the wolf below as it eats the she-wolf's young.
        - id: ch01-b06
          speaker: pilot
          text: Dear Lord! That ship looks like the work of a demon. I am afraid.
          emotion: fearful
        - id: ch01-b07
          speaker: hermit
          text: Keep going! Keep going!
          emotion: happy
        - id: ch01-b08
          speaker: ancient_mariner
          text: The boat came nearer to the ship. I neither spoke nor moved. When it was close beneath us, a sound rose from below.
        - id: ch01-b09
          speaker: ancient_mariner
          text: It rumbled under the water, growing louder and more terrible. It reached the ship and rolled across the bay. Then the ship sank like lead.
        - id: ch01-b10
          speaker: ancient_mariner
          text: That dreadful noise struck sea and sky and left me stunned. My body floated like the body of a man who had drowned seven days before. Then, as quickly as a dream, I found myself inside the Pilot's boat.
        - id: ch01-b11
          speaker: ancient_mariner
          text: The boat spun round and round in the whirlpool where the ship had gone down. Everything became still. Only the hill gave back the echo of that sound.
        - id: ch01-b12
          speaker: ancient_mariner
          text: I moved my lips. The Pilot screamed and collapsed in a fit. The holy Hermit lifted his eyes and began to pray right where he sat.
        - id: ch01-b13
          speaker: ancient_mariner
          text: I took the oars. The Pilot's boy had gone mad. He laughed long and loudly while his eyes darted from side to side.
        - id: ch01-b14
          speaker: pilots_boy
          text: Ha! Ha! Now I understand. The Devil certainly knows how to row.
        - id: ch01-b15
          speaker: ancient_mariner
          text: At last, I stood on solid ground in my own country. The Hermit climbed out of the boat, but he could barely stand.
        - id: ch01-b16
          speaker: ancient_mariner
          text: Holy man, hear my confession! Hear my confession!
        - id: ch01-b17
          speaker: ancient_mariner
          text: The Hermit crossed his forehead.
        - id: ch01-b18
          speaker: hermit
          text: Speak quickly. Tell me what kind of man you are.
        - id: ch01-b19
          speaker: ancient_mariner
          text: At once, a terrible agony twisted my body. It forced me to begin my tale. As soon as I did, the pain released me.
        - id: ch01-b20
          speaker: ancient_mariner
          text: Since that day, the agony has returned at times I cannot predict. My heart burns until I tell my ghastly story.
        - id: ch01-b21
          speaker: ancient_mariner
          text: I travel from land to land, passing like the night. A strange power of speech is mine. The instant I see a person's face, I know when that person must hear me. Then I teach him my tale.
        - id: ch01-b22
          speaker: ancient_mariner
          text: Listen to the loud uproar beyond that door! The wedding guests are all inside. In the garden arbor, the bride and her bridesmaids are singing. And there is the little evening bell, calling me to prayer.
        - id: ch01-b23
          speaker: ancient_mariner
          text: Oh, Wedding-Guest, my soul was alone upon a wide, wide sea. I was so lonely that even God seemed scarcely to be there.
          emotion: sad
        - id: ch01-b24
          speaker: ancient_mariner
          text: A marriage feast may be sweet, but something is far sweeter to me. It is walking to church with good companions.
        - id: ch01-b25
          speaker: ancient_mariner
          text: We walk to church together, and together we pray. Each person bows before our great Father. Old men and little children, loving friends, young men, and joyful maidens all bow together.
        - id: ch01-b26
          speaker: ancient_mariner
          text: Farewell, farewell, Wedding-Guest. But remember this. A person prays well when he loves people, birds, and beasts well.
        - id: ch01-b27
          speaker: ancient_mariner
          text: The one who loves best also prays best, for he loves all things, both great and small. The dear God who loves us made them all and loves them all.
        - id: ch01-b28
          speaker: narrator
          text: The Mariner, with his bright eye and beard white from age, was gone. The Wedding-Guest turned away from the bridegroom's door.
        - id: ch01-b29
          speaker: narrator
          text: He walked away like a man struck senseless. The next morning, he rose sadder and wiser.
