audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    hermit:
      display_name: 隐士
      tts:
        delivery: 善良虔诚，危急时依然爽朗坚定
        timbre: 清朗而温厚
        pace: 从容
        pitch: 中低
    pilot:
      display_name: 领航员
      tts:
        delivery: 老练朴实，面对怪事时流露出惊惧
        timbre: 浑厚而略显沙哑
        pace: 稳健
        pitch: 低
    pilot_boy:
      display_name: 领航员的孩子
      tts:
        delivery: 年少清亮，受惊后笑声癫狂失常
        timbre: 清脆单薄
        pace: 轻快而跳跃
        pitch: 高
  chapters:
    - id: ch01
      title: 第七章
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: |-
            那位善良的隐士住在海边的林子里。林木顺着山坡，一直伸向大海。他歌声悦耳，总爱同远道而来的水手聊天。每天清晨、正午和黄昏，他都会跪下祈祷。膝下那块厚软垫，其实是盖满腐朽老橡树桩的青苔。
        - id: ch01-b02
          speaker: ancient_mariner
          text: |-
            小艇慢慢靠近，我听见上面有人说话。
        - id: ch01-b03
          speaker: pilot
          text: |-
            真怪啊！刚才还有那么多美丽的灯火给我们发信号，怎么一下子全不见了？
        - id: ch01-b04
          speaker: hermit
          text: |-
            凭我的信仰起誓，这事确实古怪。我们向船上欢呼，竟没人回应。你看，那些木板都变了形，船帆也又薄又枯。我从没见过这样的东西，除非是林间溪水里迟迟不落的棕色枯叶。积雪压沉常春藤丛时，小猫头鹰会冲着山下的恶狼啼叫，那恶狼正在吞吃母狼的幼崽。
        - id: ch01-b05
          speaker: pilot
          text: |-
            亲爱的主啊！那艘船活像魔鬼造出来的。我……我害怕。
          emotion: fearful
        - id: ch01-b06
          speaker: hermit
          text: |-
            往前划！继续往前划！
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            隐士兴高采烈地催着他们。小艇越来越近，我一动不动，也没有出声。等它来到大船正下方，忽然有一阵声响从水底隆隆滚来，越来越响，越来越可怕。那声音撞上大船，又震裂整个海湾。大船随即像铅块一样沉了下去。
        - id: ch01-b08
          speaker: ancient_mariner
          text: |-
            那声巨响震动天空和海洋，也把我震得昏昏沉沉。我的身体漂在水上，仿佛已经溺水七天。可一眨眼，快得像梦一样，我竟到了领航员的小艇里。
        - id: ch01-b09
          speaker: ancient_mariner
          text: |-
            大船沉下的地方留下一个旋涡，小艇在上面一圈圈打转。四周静极了，只有远处的山还把巨响一声声送回来。
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            我只动了一下嘴唇，领航员便尖叫着昏倒了。隐士坐在原处，抬眼望天，开始祈祷。
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            我拿起船桨。领航员的孩子从此疯疯癫癫。他两眼不停地转，放声大笑，怎么也停不下来。
        - id: ch01-b12
          speaker: pilot_boy
          text: |-
            哈！哈！我这下可看明白了，魔鬼果然会划船！
        - id: ch01-b13
          speaker: ancient_mariner
          text: |-
            就这样，我终于回到故乡，双脚踏上坚实的土地。隐士也从小艇里迈出来，可他连站都快站不住了。
        - id: ch01-b14
          speaker: ancient_mariner
          text: |-
            圣洁的人，请听我忏悔吧！求你听我忏悔！
        - id: ch01-b15
          speaker: ancient_mariner
          text: |-
            隐士在额前画了个十字。
        - id: ch01-b16
          speaker: hermit
          text: |-
            快说，我命你马上告诉我。你究竟是什么人？
        - id: ch01-b17
          speaker: ancient_mariner
          text: |-
            顿时，一阵悲惨的剧痛扭绞着我的身体，逼得我讲起自己的故事。等我讲完，那痛苦才肯放过我。
        - id: ch01-b18
          speaker: ancient_mariner
          text: |-
            从那以后，不知道什么时候，这阵剧痛就会再次发作。只要那个可怕的故事还没讲完，我的心便一直在胸中灼烧。
        - id: ch01-b19
          speaker: ancient_mariner
          text: |-
            我像黑夜一样，从一片土地漂到另一片土地。我有一种奇异的说话之力，只要看见一张脸，马上就知道那个人必须听我讲。于是，我会把自己的故事说给他听。
        - id: ch01-b20
          speaker: ancient_mariner
          text: |-
            婚礼宾客，你听，门里传来多么喧闹的声音。客人都在那里，新娘和伴娘却在花园凉亭里唱歌。还有那小小的晚祷钟，正叫我去祈祷。
        - id: ch01-b21
          speaker: ancient_mariner
          text: |-
            我的灵魂曾孤零零地漂在无边的大海上。那里实在太孤寂，仿佛连上帝都不存在。
        - id: ch01-b22
          speaker: ancient_mariner
          text: |-
            对我来说，同一群良善的人一道走进教堂，远比参加婚宴甜美。大家一起祈祷，人人都向伟大的天父低头。不论老人、婴孩、相爱的朋友，还是欢快的青年与少女，全都在一起。
        - id: ch01-b23
          speaker: ancient_mariner
          text: |-
            再会了，婚礼宾客。可我还要告诉你，爱世上的人，也爱飞鸟走兽，才懂得好好祈祷。爱得最深的人，祈祷得最好。世间万物无论大小，他全都珍爱。因为上帝爱着我们，也创造并爱着这一切。
        - id: ch01-b24
          speaker: narrator
          text: |-
            老水手目光炯炯，年迈的胡须一片雪白。他说完便离开了。婚礼宾客也从新郎门前转过身去。
        - id: ch01-b25
          speaker: narrator
          text: |-
            他像被震得失了神，茫然地走远了。第二天早晨醒来时，他变得更加忧伤，也更有智慧。
