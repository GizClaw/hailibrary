audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    wedding_guest:
      display_name: 婚礼宾客
      tts:
        delivery: 惊惧不安，被眼前的老人牢牢慑住
        timbre: 清晰而微微发紧
        pace: 急促，话语间带着迟疑
        pitch: 中
  chapters:
    - id: ch01
      title: 第四章
      blocks:
        - id: ch01-b01
          speaker: wedding_guest
          text: |-
            老水手，我怕你！你那只手又黑又瘦，真叫人害怕。你长得那么高，那么干瘦，浑身黝黑，就像海滩上一道道凸起的沙脊。我还怕你那双闪闪发光的眼睛，也怕那只黝黑的枯手！
          emotion: fearful
        - id: ch01-b02
          speaker: ancient_mariner
          text: |-
            婚礼宾客，别怕，别怕。我这副身躯并没有倒下。可是那时，茫茫大海上只剩下我一个人，彻彻底底，孤零零的。没有一位圣者来怜悯我受苦的灵魂。
        - id: ch01-b03
          speaker: ancient_mariner
          text: |-
            那么多健壮的水手，全都死在甲板上。海里却还有千千万万黏滑的生灵活着，我也和它们一样活着。我看看腐烂的海水，又赶紧把眼睛移开。再看看腐烂的甲板，那些死人就躺在那里。
        - id: ch01-b04
          speaker: ancient_mariner
          text: |-
            我抬头望着天，想要祈祷。可祷词还没有出口，一阵邪恶的低语就钻进心里，让我的心干得像尘土。我只好合紧眼皮，可眼珠还在里面一下一下地跳。
        - id: ch01-b05
          speaker: ancient_mariner
          text: |-
            天空和大海，大海和天空，像重担一样压着我疲倦的眼睛，死人就在脚边。他们身上的冷汗已经消散，尸体既不腐烂，也没有臭味，可他们盯着我的目光始终没有消失。
        - id: ch01-b06
          speaker: ancient_mariner
          text: |-
            一个孤儿的诅咒，能把天上的精灵拖进地狱。可死人眼里的诅咒，比那还要可怕。我对着那目光熬了七天七夜，却怎么也死不了。
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            月亮缓缓升上天空，一刻也没有停，身旁还伴着一两颗星。她的光落在闷热的海面上，像四月铺开的白霜，仿佛在嘲弄那片海。
        - id: ch01-b08
          speaker: ancient_mariner
          text: |-
            可巨大的船影下面，中了魔法的海水一直燃烧着。那是一片静止不动、叫人害怕的红光。
        - id: ch01-b09
          speaker: ancient_mariner
          text: |-
            我望向船影外的海蛇。它们游过的地方，留下一道道白亮的水痕。每当它们昂起身子，妖异的微光就从身上落下来，碎成灰白的亮片。
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            船影里面，我又看见它们华美的颜色，有湛蓝，有油亮的碧绿，还有天鹅绒般的墨黑。它们盘绕着游来游去，每一道水痕都像金色的火焰猛然一闪。
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            啊，这些幸福的生灵！没有什么言语能说尽它们的美。一股爱意忽然从我心里涌出来，我自己还没觉察，就已经在为它们祝福。一定是仁慈的圣者终于怜悯了我，我不由自主地又为它们祝福。
        - id: ch01-b12
          speaker: ancient_mariner
          text: |-
            就在那一刻，我终于能祈祷了。挂在我脖子上的信天翁随即脱落，掉进海里，像一块铅一样沉了下去。
