audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium
    ancient_mariner:
      display_name: Ancient Mariner
      tts:
        delivery: intense and haunted
        timbre: rough and weathered
        pace: deliberate
        pitch: low
    wedding_guest:
      display_name: Wedding Guest
      tts:
        delivery: impatient and increasingly absorbed
        timbre: clear and youthful
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Part The Fourth
      blocks:
        - id: ch01-b01
          speaker: wedding_guest
          text: I am afraid of you, ancient Mariner! I fear your thin hand! You are tall and lean, and your skin is brown like ridged sea sand. Your glittering eye and brown, bony hand frighten me.
          emotion: fearful
        - id: ch01-b02
          speaker: ancient_mariner
          text: Do not be afraid, Wedding Guest. This body of mine did not fall dead with the others.
        - id: ch01-b03
          speaker: ancient_mariner
          text: I was alone, all alone, on that wide sea. No saint took pity on my suffering soul. All those fine sailors lay dead, while countless slimy creatures lived on. And I lived too.
        - id: ch01-b04
          speaker: ancient_mariner
          text: I looked at the rotting sea, then turned away. I looked across the decaying deck, and there the dead men lay.
        - id: ch01-b05
          speaker: ancient_mariner
          text: I raised my eyes to Heaven and tried to pray. Before one prayer could come, an evil whisper rose inside me. It left my heart as dry as dust.
        - id: ch01-b06
          speaker: ancient_mariner
          text: I shut my eyes and held them closed. They throbbed beneath my lids. The sky and sea, the sea and sky, pressed like a great weight on my tired eyes. The dead men were still at my feet.
        - id: ch01-b07
          speaker: ancient_mariner
          text: The cold sweat dried upon their bodies, but they did not rot or smell. The look in their eyes never left me.
        - id: ch01-b08
          speaker: ancient_mariner
          text: An orphan's curse could pull a blessed spirit down to Hell. But the curse in a dead man's eye was even more terrible. For seven days and seven nights, I faced that curse. Still, I could not die.
        - id: ch01-b09
          speaker: ancient_mariner
          text: Then the moving Moon climbed through the sky without ever stopping. She rose softly, with one or two stars beside her.
        - id: ch01-b10
          speaker: ancient_mariner
          text: Her light lay across the hot sea like white frost in April. Yet beneath the ship's great shadow, the enchanted water kept burning a deep and dreadful red.
        - id: ch01-b11
          speaker: ancient_mariner
          text: Beyond the ship's shadow, I watched the water snakes. They left shining white trails as they swam. Whenever they lifted themselves from the water, a strange pale light fell from them in flakes.
        - id: ch01-b12
          speaker: ancient_mariner
          text: Inside the shadow, I saw their splendid colors. They were blue, glossy green, and velvet black. They twisted and glided through the water, and every trail flashed like golden fire.
        - id: ch01-b13
          speaker: ancient_mariner
          text: Oh, those happy living creatures! No words could tell how beautiful they were. Love suddenly sprang from my heart, and without even knowing it, I blessed them. Surely my kind saint had taken pity on me, for I blessed them without knowing it.
        - id: ch01-b14
          speaker: ancient_mariner
          text: At that very moment, I could pray again. The Albatross slipped free from my neck and sank into the sea like lead.
