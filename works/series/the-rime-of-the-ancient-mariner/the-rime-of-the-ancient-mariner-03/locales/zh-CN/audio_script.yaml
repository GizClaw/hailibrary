audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    life_in_death:
      display_name: 生中之死
      tts:
        delivery: 妖冶而冷酷，胜利时透出骇人的狂喜
        timbre: 冰冷尖亮
        pace: 从容，宣告胜负时突然加快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第三章
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: |-
            又熬过一段漫长的时光。我们个个喉咙干得冒火，眼睛蒙着浊光，累得再也睁不清了。就在我望向西边时，忽然发现天空中有个东西。
        - id: ch01-b02
          speaker: ancient_mariner
          text: |-
            起初，它只是个小点。再看，又像一团雾。它不停地动，渐渐现出一个形状。我看得真切，那形影越来越近，一会儿俯冲，一会儿转向，又忽然掉头，像是在躲避水里的精灵。
        - id: ch01-b03
          speaker: ancient_mariner
          text: |-
            我们没水润喉，嘴唇都晒得焦黑，既笑不出，也哭不出，只能渴得哑然站着。我咬破自己的手臂，吸了一口血，这才喊出了声：“有帆！海上有帆！”
        - id: ch01-b04
          speaker: ancient_mariner
          text: |-
            众人张着干裂的嘴听我喊，顿时欢喜得咧开了嘴。谢天谢地！他们一齐深吸一口气，就像真的喝到了水。
        - id: ch01-b05
          speaker: ancient_mariner
          text: |-
            我又喊：“看，快看！它不转向了，正朝我们驶来，要救我们！没有风，也没有潮，它的船身怎么还能直直立着，稳稳往前走？”
        - id: ch01-b06
          speaker: ancient_mariner
          text: |-
            天快黑了，西边的海浪像燃起了火。宽阔明亮的太阳几乎贴着海面。那个怪异的形影忽然冲到中间，把我们和太阳隔开。
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            太阳马上被一道道黑影割开。天国圣母啊，求你垂怜！它那又宽又亮的脸，就像隔着地牢的铁栅，朝我们窥望。
        - id: ch01-b08
          speaker: ancient_mariner
          text: |-
            我的心怦怦直响。它靠得太快了！阳光里那些闪动的东西，是它的船帆吗？为什么像飘来荡去的蛛丝？还是说，那根本不是帆，而是光秃秃的肋骨？太阳正从那些肋骨中间照过来，活像透过铁栅一样。
        - id: ch01-b09
          speaker: ancient_mariner
          text: |-
            船上难道只有一个女人？不，还有一个“死神”。他们是两个。莫非“死神”就是那个女人的伴侣？
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            那女人嘴唇鲜红，眼神放荡，头发像黄金一样黄，皮肤却像麻风病人那样惨白。她就是梦魇般的“生中之死”，能叫人的血冷得凝住。
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            那艘船只剩一副光秃秃的船壳，直来到我们身旁。她正和“死神”掷骰子。
        - id: ch01-b12
          speaker: life_in_death
          text: |-
            这一局结束了！我赢了，我赢了！
          emotion: happy
        - id: ch01-b13
          speaker: ancient_mariner
          text: |-
            她说完，连吹了三声口哨。太阳最后一点边缘沉下海面，群星一下子全涌了出来，黑暗一步便跨到眼前。海面远处传来低低的耳语，那艘幽灵船随即飞驰而去。
        - id: ch01-b14
          speaker: ancient_mariner
          text: |-
            我们一面听，一面侧着眼睛往上看。恐惧贴住我的心，好像端着一只杯子，一口一口啜饮我的生命之血。
        - id: ch01-b15
          speaker: ancient_mariner
          text: |-
            星光昏暗，夜色越来越浓。舵手的脸被灯映得惨白，露水从船帆上滴下来。后来，一弯角月越过东边的天际，升上了天空。一颗亮星正嵌在月牙下端的弯角里。
        - id: ch01-b16
          speaker: ancient_mariner
          text: |-
            就在那颗星追随着弯月的时候，水手们一个接一个地转过脸来。他们痛苦得面目可怕，却连一声呻吟、一口叹息都来不及发出，只用眼睛诅咒我。
        - id: ch01-b17
          speaker: ancient_mariner
          text: |-
            整整两百个活人，一个接一个倒下。每一具身体落地，都发出沉重的一响。我没有听到一声叹息，也没有听到一声呻吟。
        - id: ch01-b18
          speaker: ancient_mariner
          text: |-
            他们的灵魂飞出躯体，奔向福地，或是苦狱。每一个灵魂从我身边掠过，都像我那张弩射出的箭，带着一声呼啸。
