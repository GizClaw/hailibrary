audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium
    ancient_mariner:
      display_name: Ancient Mariner
      tts:
        delivery: intense and haunted
        timbre: rough and weathered
        pace: deliberate
        pitch: low
    life_in_death:
      display_name: Life-in-Death
      tts:
        delivery: cold and triumphant
        timbre: clear and uncanny
        pace: deliberate
        pitch: medium-high
  chapters:
    - id: ch01
      title: Part The Third
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: We passed a long and weary time. Every throat was dry, and every eye had a dull glaze. Then I looked west and saw something in the sky.
        - id: ch01-b02
          speaker: ancient_mariner
          text: At first, it looked like a tiny speck. Then it seemed to be mist. It kept moving until it took on a shape I knew.
        - id: ch01-b03
          speaker: ancient_mariner
          text: A speck, a mist, a shape! It came nearer and nearer. It plunged, tacked, and veered, as if it were dodging a spirit in the water.
        - id: ch01-b04
          speaker: ancient_mariner
          text: Our thirst had not eased, and our lips were baked black. We could neither laugh nor cry. The terrible drought had left us speechless. I bit my arm and sucked the blood. Then I shouted, "A sail! A sail!"
        - id: ch01-b05
          speaker: ancient_mariner
          text: The sailors stood with their mouths open when they heard me. Then joy spread across their faces. All at once, they drew in their breath as though they were drinking.
        - id: ch01-b06
          speaker: ancient_mariner
          text: >-
            "Look!" I cried. "It isn't tacking anymore. It's coming this way to help us. There's no breeze and no tide, yet it holds a steady course with its keel upright!"
        - id: ch01-b07
          speaker: ancient_mariner
          text: The western sea burned with light as the day drew to an end. The broad, bright sun was almost resting on the waves when that strange shape suddenly passed between us and the sun.
        - id: ch01-b08
          speaker: ancient_mariner
          text: At once, dark bars crossed the sun. May Heaven's Mother give us grace! Its broad, burning face seemed to stare through the bars of a prison.
        - id: ch01-b09
          speaker: ancient_mariner
          text: My heart pounded. The vessel was coming so fast. Were those its sails flashing in the sunlight like restless threads of silk?
        - id: ch01-b10
          speaker: ancient_mariner
          text: Or were those the ship's bare ribs, with the sun looking through them like the bars of a grate? Was that woman its whole crew? Was the other figure Death? Was Death her companion?
        - id: ch01-b11
          speaker: ancient_mariner
          text: Her lips were red, her gaze was bold, and her hair was yellow as gold. Her skin was white as leprosy. She was the nightmare Life-in-Death, the one who turns a man's blood cold.
        - id: ch01-b12
          speaker: ancient_mariner
          text: The bare wreck came alongside our ship. The two figures were throwing dice.
        - id: ch01-b13
          speaker: life_in_death
          text: The game is over! I won! I won!
          emotion: happy
        - id: ch01-b14
          speaker: ancient_mariner
          text: Then she whistled three times.
        - id: ch01-b15
          speaker: ancient_mariner
          text: The rim of the sun sank. The stars rushed out, and darkness came in a single stride. With a whisper we could hear from far across the sea, the ghost ship shot away.
        - id: ch01-b16
          speaker: ancient_mariner
          text: We listened and looked up from the corners of our eyes. Fear seemed to drink the lifeblood from my heart, sip by sip.
        - id: ch01-b17
          speaker: ancient_mariner
          text: The stars were dim, and the night was thick. The helmsman's face shone white beside his lamp, and dew dripped from the sails. At last, the horned moon climbed above the eastern edge of the sea. A bright star rested inside its lower tip.
        - id: ch01-b18
          speaker: ancient_mariner
          text: One after another, beneath that moon and its following star, each sailor turned his face toward me in terrible pain. There was no time for a groan or a sigh. Each man cursed me with his eyes.
        - id: ch01-b19
          speaker: ancient_mariner
          text: Two hundred living men fell one by one. I heard no sigh and no groan. Each body struck the deck with a heavy thump and lay there lifeless.
        - id: ch01-b20
          speaker: ancient_mariner
          text: Their souls flew from their bodies, bound for joy or suffering. Every soul passed close by me with the same whizzing sound my crossbow had made.
