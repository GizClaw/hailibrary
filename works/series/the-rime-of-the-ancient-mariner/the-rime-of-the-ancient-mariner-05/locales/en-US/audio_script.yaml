  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium
    ancient_mariner:
      display_name: Ancient Mariner
      tts:
        delivery: intense and haunted
        timbre: rough and weathered
        pace: deliberate
        pitch: low
    wedding_guest:
      display_name: Wedding Guest
      tts:
        delivery: impatient and increasingly absorbed
        timbre: clear and youthful
        pace: brisk
        pitch: medium
    first_voice:
      display_name: First Voice
      tts:
        delivery: stern and questioning
        timbre: deep and otherworldly
        pace: measured
