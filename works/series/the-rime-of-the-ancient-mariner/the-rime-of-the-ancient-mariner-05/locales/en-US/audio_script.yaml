  chapters:
    - id: ch01
      title: Part The Fifth
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: Oh, sleep is a gentle thing, loved everywhere from pole to pole. Give praise to Mary Queen. She sent that gentle sleep down from Heaven, and it slipped into my soul.
        - id: ch01-b02
          speaker: ancient_mariner
          text: Those useless buckets had stood empty on the deck for so long. I dreamed they were full of dew. Then I woke and found rain falling. My lips were wet, my throat felt cold, and my clothes were soaked through. I must have drunk in my dreams, and my body was still drinking.
        - id: ch01-b03
          speaker: ancient_mariner
          text: I tried to move, but I could not feel my arms or legs. My body felt so light that I almost believed I had died in my sleep and become a blessed ghost.
        - id: ch01-b04
          speaker: ancient_mariner
          text: Before long, I heard a roaring wind. It never came near the ship, but the sound alone shook our thin, dried sails.
        - id: ch01-b05
          speaker: ancient_mariner
          text: High above us, the whole sky sprang to life. A hundred shining flags of fire rushed back and forth, darting in and out. Between them, the pale stars seemed to dance.
        - id: ch01-b06
          speaker: ancient_mariner
          text: The wind's roar grew louder, and the sails sighed like reeds. Rain poured from one black cloud, with the moon shining at its edge. The cloud split open, yet the moon stayed beside it. Lightning streamed straight down like water pouring from a high cliff, a steep and shining river without a bend.
        - id: ch01-b07
          speaker: ancient_mariner
          text: That loud wind never touched the ship. Still, the ship began to move. Beneath the lightning and the moon, the dead sailors groaned.
        - id: ch01-b08
          speaker: ancient_mariner
          text: They stirred, stood up, and said nothing. Their eyes never moved. Even in a dream, the sight of those dead men rising would have been strange.
        - id: ch01-b09
          speaker: ancient_mariner
          text: The helmsman took the wheel, and the ship kept going though no breeze blew. The other sailors returned to the ropes they had worked in life. Their arms and legs rose and fell like lifeless tools. What a ghastly crew we were.
        - id: ch01-b10
          speaker: ancient_mariner
          text: My brother's son stood beside me, knee against knee. His body and mine pulled the same rope, but he never spoke to me.
        - id: ch01-b11
          speaker: wedding_guest
          text: Ancient Mariner, you frighten me!
          emotion: fearful
        - id: ch01-b12
          speaker: ancient_mariner
          text: Be calm, Wedding Guest. The souls that had fled in pain did not return to those bodies. Blessed spirits had entered them.
        - id: ch01-b13
          speaker: ancient_mariner
          text: When dawn came, the bodies let go of the ropes and gathered around the mast. Sweet sounds slowly rose through their mouths and floated free of them.
        - id: ch01-b14
          speaker: ancient_mariner
          text: Each lovely sound circled the ship, then flew toward the sun. Slowly they returned, sometimes mingling and sometimes coming one by one.
        - id: ch01-b15
          speaker: ancient_mariner
          text: At times, a skylark's song seemed to fall from the sky. Then it sounded as if every little bird alive had filled the sea and air with sweet chatter.
        - id: ch01-b16
          speaker: ancient_mariner
          text: One moment, I heard every instrument together. The next, I heard a lonely flute. Then came an angel's song, and all the heavens fell silent.
        - id: ch01-b17
          speaker: ancient_mariner
          text: The voices stopped, but the sails kept making a pleasant sound until noon. It was like a hidden stream in leafy June, singing a quiet tune all night to sleeping woods.
        - id: ch01-b18
          speaker: ancient_mariner
          text: We sailed quietly until noon. No breeze breathed, yet the ship moved slowly and smoothly, driven onward from below.
        - id: ch01-b19
          speaker: ancient_mariner
          text: Nine fathoms beneath the keel, the spirit from the land of mist and snow glided through the water. He was the one who made the ship go. At noon, the sails stopped singing, and the ship stopped too.
        - id: ch01-b20
          speaker: ancient_mariner
          text: The sun stood directly over the mast and seemed to pin the ship to the ocean. A minute later, the ship began to stir. It jerked backward and forward, half its length each way, in a short, uneasy motion.
        - id: ch01-b21
          speaker: ancient_mariner
          text: Then the ship leaped ahead like a horse pawing the ground and suddenly set free. The force drove the blood into my head, and I fell unconscious.
        - id: ch01-b22
          speaker: ancient_mariner
          text: I cannot say how long I lay in that fit. Before my waking life returned, I heard two voices in the air, and deep in my soul I knew them apart.
        - id: ch01-b23
          speaker: first_voice
          text: Is it him? Is this the man? By Him who died upon the cross, this man used his cruel bow to strike down the harmless Albatross.
        - id: ch01-b24
          speaker: first_voice
          text: The lonely spirit who lives in the land of mist and snow loved that bird. And the bird loved the man who shot it with his bow.
        - id: ch01-b25
          speaker: ancient_mariner
          text: The other voice answered more softly, as gentle as honeydew.
        - id: ch01-b26
          speaker: second_voice
          text: The man has suffered for his deed, and there is more suffering still to come.
