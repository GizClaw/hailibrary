audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    wedding_guest:
      display_name: 婚礼宾客
      tts:
        delivery: 惊惧不安，被眼前的老人牢牢慑住
        timbre: 清晰而微微发紧
        pace: 急促，话语间带着迟疑
        pitch: 中
    first_voice:
      display_name: 空中的第一个声音
      tts:
        delivery: 严厉而充满审问的意味
        timbre: 冷峻有力
        pace: 缓慢而分明
        pitch: 中低
    second_voice:
      display_name: 空中的第二个声音
      tts:
        delivery: 柔和克制，如露水般轻缓
        timbre: 清润柔和
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: ancient_mariner
          text: |-
            啊，睡眠多么温柔，世上人人都爱它！应当赞美圣母玛利亚，是她从天国送来睡眠，让它轻轻滑进我的灵魂。
        - id: ch01-b02
          speaker: ancient_mariner
          text: |-
            甲板上的空水桶已经搁了很久。我梦见桶里盛满露水，等我醒来，天上真的下起了雨。我的嘴唇湿了，喉咙凉了，衣服也全都湿透。我准是在梦里喝过水，醒来以后，身体还在不停地喝。
        - id: ch01-b03
          speaker: ancient_mariner
          text: |-
            我试着动了动，却感觉不到自己的四肢。身子轻得没有一点分量，我甚至以为自己已经在睡梦中死去，成了一个蒙福的幽灵。
        - id: ch01-b04
          speaker: ancient_mariner
          text: |-
            没过多久，我听见狂风怒吼。风没有来到船边，可那声音已经震动了枯薄的船帆。高空像是猛然活了过来。上百面明亮的火旗来回飞卷，惨淡的星星就在它们中间舞动。
        - id: ch01-b05
          speaker: ancient_mariner
          text: |-
            风声越来越响，船帆像莎草一样叹息。雨从一团黑云里直泻下来，月亮就悬在云边。浓黑的云层裂开了，月亮仍紧贴着它。闪电从高处笔直落下，没有一道弯折，像一条从悬崖上射下来的河，又陡，又宽。
        - id: ch01-b06
          speaker: ancient_mariner
          text: |-
            大风一直没有碰到船，船却向前驶了起来。闪电和月亮下面，死人忽然发出呻吟。他们动了，一个接一个站起身来。谁也不说话，眼珠也一动不动。这样的景象，就算出现在梦里，也会叫人害怕。
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            舵手重新掌起舵，船继续走，可下面连一丝风也没有。水手们回到各自原来的位置，又拉起了缆绳。他们抬动四肢，就像有人在摆弄一件件没有生命的工具。我们真是一群骇人的船员。
        - id: ch01-b08
          speaker: ancient_mariner
          text: |-
            我兄弟的儿子也站在身边，膝盖紧挨着我的膝盖。我和那具尸身拉着同一根缆绳，他却始终没有对我说一句话。
        - id: ch01-b09
          speaker: wedding_guest
          text: |-
            老水手，我怕你！
          emotion: fearful
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            婚礼宾客，安下心来。回到那些尸身里的，不是曾经痛苦逃走的灵魂，而是一群蒙福的精灵。
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            天亮以后，他们垂下手臂，围在桅杆旁边。甜美的声音从他们口中慢慢升起，又离开身体，盘旋着飞向太阳。过了一会儿，声音缓缓回来，有时交融在一起，有时一声接着一声。
        - id: ch01-b12
          speaker: ancient_mariner
          text: |-
            我听见歌声像从天上滴落下来。它先像云雀在唱，又像所有小鸟一齐啁啾，甜美的鸣叫装满了大海和天空。一会儿，仿佛各种乐器同时奏响。一会儿，又只剩下一支孤单的长笛。后来，它变成了天使的歌声，连诸天都静了下来。
        - id: ch01-b13
          speaker: ancient_mariner
          text: |-
            歌声停了，船帆却一直发出悦耳的声响，直到正午。那声音像六月浓荫里藏着一条溪流，整夜都在为沉睡的树林轻轻歌唱。
        - id: ch01-b14
          speaker: ancient_mariner
          text: |-
            我们静静地航行到正午，四周还是没有一口风。船走得又慢又稳，是船底下的力量在推着它。龙骨下面九噚深处，那个精灵从冰雪和浓雾之地一路滑来。正是它让船前进。到了正午，船帆不再歌唱，船也停下了。
        - id: ch01-b15
          speaker: ancient_mariner
          text: |-
            太阳正对着桅杆顶，把船牢牢钉在海面上。没过多久，船又短促而不安地动了起来。它向后移半个船身，再向前移半个船身，来回摇晃。接着，它像一匹刚刚挣脱束缚的马，猛然向前一跃。鲜血一下冲进我的脑袋，我倒下去，失去了知觉。
        - id: ch01-b16
          speaker: ancient_mariner
          text: |-
            那一次，我昏迷了多久，自己也说不清。可在活人的知觉回来以前，我听见空中有两个声音，灵魂深处也听得清清楚楚。
        - id: ch01-b17
          speaker: first_voice
          text: |-
            是他吗？就是这个人吗？凭那位死在十字架上的主起誓，他用残酷的弓箭射倒了无辜的信天翁。独自住在冰雪和浓雾之地的精灵深爱那只鸟，而那只鸟，也曾爱过这个拿弓射死它的人。
        - id: ch01-b18
          speaker: ancient_mariner
          text: |-
            另一个声音柔和得多，像花蜜凝成的露珠。
        - id: ch01-b19
          speaker: second_voice
          text: |-
            这个人已经受过惩罚，往后还要继续赎罪。
