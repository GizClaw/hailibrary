audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    wedding_guest:
      display_name: 婚礼宾客
      tts:
        delivery: 起初焦急不耐，后来惊惧而关切
        timbre: 明亮有力
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            一位苍老的水手迎面走来，拦住三个过路人中的一个。他灰白的长胡须垂在胸前，一双眼睛闪闪发亮。
        - id: ch01-b02
          speaker: wedding_guest
          text: |-
            你拦我干什么？新郎家的大门已经敞开了，我是他的至亲。宾客都到齐了，酒席也摆好了。你听，里面多热闹！
        - id: ch01-b03
          speaker: narrator
          text: |-
            老水手伸出枯瘦的手，一把抓住他。
        - id: ch01-b04
          speaker: ancient_mariner
          text: |-
            从前，有一条船。
        - id: ch01-b05
          speaker: wedding_guest
          text: |-
            放开我！松手，你这个灰胡子疯汉！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: |-
            老水手马上松了手，却又用那双灼灼的眼睛盯住宾客。宾客顿时站着不动了，像个三岁的孩子，只能听他讲下去。老水手如愿以偿，宾客也在一块石头上坐了下来。
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            欢呼声送我们启航。船离开港湾，轻快地驶过教堂，驶过山丘，又从灯塔尖顶下方驶向远方。太阳从左边的海面升起来，灿然照了一整天，再从右边沉进海里。它一天比一天升得高，到了正午，正好悬在桅杆上空。
        - id: ch01-b08
          speaker: narrator
          text: |-
            婚礼宾客听见低沉响亮的巴松管，直捶胸口。新娘已经走进大厅，红得像玫瑰。乐师们在她前面一路点头，一路欢快地演奏。宾客又捶了捶胸口，可他还是走不了，只能继续听那位目光明亮的老水手往下讲。
        - id: ch01-b09
          speaker: ancient_mariner
          text: |-
            就在这时，风暴追上了我们。它又凶又猛，像张开翅膀狠狠扑打着船，逼着我们一路往南。桅杆斜了，船头一次次扎进浪里。我们就像一个被仇敌边吼边打、紧追不舍的人，只能低着头拼命向前逃。船越冲越快，狂风在身后怒吼，我们也越逃越往南。
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            后来，雾和雪一起压了过来，天气冷得出奇。一块块浮冰从船边漂过，竟和桅杆一样高，绿得像翡翠。积雪的冰崖透过漫天飘雪，泛着惨淡的微光。那里没有人，也没有野兽，前后左右全是冰。
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            这里是冰，那里也是冰，四面八方都被冰封住了。冰层不断迸裂，低吼，咆哮，呼号。那声音乱成一片，就像人在昏厥中听见的声响。
        - id: ch01-b12
          speaker: ancient_mariner
          text: |-
            终于，一只信天翁穿过浓雾，飞到了船边。我们把它当作一个基督徒的灵魂，奉上帝之名欢迎它。它吃了从没尝过的食物，又绕着船一圈圈地飞。这时，坚冰突然像雷鸣一样轰然裂开，舵手驾船从裂口穿了过去。
        - id: ch01-b13
          speaker: ancient_mariner
          text: |-
            一阵和顺的南风从船后吹来，信天翁也跟在我们身后。每天只要水手们一声呼唤，它就会飞过来，有时为了吃食，有时只是来玩。无论雾里还是云间，它总停在桅杆或帆索上，就这样陪我们过了九个晚祷时分。夜里，白雾像烟一样笼罩四周，白色的月光在雾中隐隐闪烁。
        - id: ch01-b14
          speaker: wedding_guest
          text: |-
            愿上帝保佑你，老水手，也救你摆脱那些折磨你的恶魔！你为什么露出这样的神情？
          emotion: fearful
        - id: ch01-b15
          speaker: ancient_mariner
          text: |-
            我举起弩弓，一箭射死了信天翁。
