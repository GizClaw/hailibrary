audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium
    ancient_mariner:
      display_name: Ancient Mariner
      tts:
        delivery: intense and haunted
        timbre: rough and weathered
        pace: deliberate
        pitch: low
    wedding_guest:
      display_name: Wedding Guest
      tts:
        delivery: impatient and increasingly absorbed
        timbre: clear and youthful
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Part The First
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: An ancient Mariner stopped one of three men on their way to a wedding.
        - id: ch01-b02
          speaker: wedding_guest
          text: Why are you stopping me with that long gray beard and that glittering eye? The Bridegroom's doors are wide open, and I'm his closest relative. The guests are all there, and the feast is ready. Can't you hear the celebration?
        - id: ch01-b03
          speaker: narrator
          text: The old man caught him with one thin hand.
        - id: ch01-b04
          speaker: ancient_mariner
          text: There was a ship.
        - id: ch01-b05
          speaker: wedding_guest
          text: Let go of me, you crazy old graybeard!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: At once, the Mariner dropped his hand. Then he held the man with his glittering eye. The Wedding Guest went still and listened like a three-year-old child. The Mariner had his way. The guest sat down on a stone. He could do nothing but listen as the bright-eyed old sailor began his tale.
        - id: ch01-b07
          speaker: ancient_mariner
          text: People cheered as our ship sailed out of the harbor. We went happily past the church, past the hill, and past the top of the lighthouse. The sun rose from the sea on our left. It shone brightly, crossed higher and higher each day, and sank into the sea on our right. At noon, it stood above the mast.
        - id: ch01-b08
          speaker: narrator
          text: Just then, the Wedding Guest heard a deep bassoon from the wedding and beat his chest. The bride, as red as a rose, had entered the hall. Merry musicians walked before her, nodding their heads as they played. Still, the guest could do nothing but listen, and the bright-eyed Mariner went on.
        - id: ch01-b09
          speaker: ancient_mariner
          text: Then a terrible storm struck us. It was fierce and strong. Its great wings seemed to beat against the ship and drive us south. Our masts leaned, and our bow plunged into the waves. We were like someone running from an enemy who stayed close behind, shouting and striking. The ship raced on while the wind roared, and still we fled south.
        - id: ch01-b10
          speaker: ancient_mariner
          text: Soon we came to mist and snow, and the cold became bitter. Pieces of ice as high as the mast floated past us, green as emeralds. Beyond the drifting snow, cliffs of ice gave off a sad, strange light. We could see no people and no animals. There was only ice between us and everything else.
        - id: ch01-b11
          speaker: ancient_mariner
          text: Ice was here. Ice was there. Ice was all around us. It cracked and growled. It roared and howled like the sounds a person hears while fainting.
        - id: ch01-b12
          speaker: ancient_mariner
          text: At last, an Albatross flew through the fog and crossed our path. We welcomed it in God's name, as though it were a Christian soul. It ate food it had never tasted before, then circled round and round us. With a crash like thunder, the ice split apart, and our helmsman steered the ship through.
        - id: ch01-b13
          speaker: ancient_mariner
          text: A good south wind rose behind us, and the Albatross followed. Every day it came when the sailors called, whether it wanted food or play. For nine evenings, it rested on the mast or the ropes while we said our evening prayers. All through the night, the white moonlight glimmered in the pale fog.
        - id: ch01-b14
          speaker: wedding_guest
          text: God save you, ancient Mariner, from the demons tormenting you! Why do you look at me like that?
          emotion: fearful
        - id: ch01-b15
          speaker: ancient_mariner
          text: With my crossbow, I shot the Albatross.
