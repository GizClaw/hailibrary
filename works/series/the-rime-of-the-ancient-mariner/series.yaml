cover_prompt: |-
  A wordless cover scene on an eighteenth-century sailing ship shows the Ancient Mariner beneath a vast southern sky before the voyage turns grim. The mariner is a weathered elderly sailor with long gray beard, deep-set eyes, a dark wool coat, sea boots, and a red knit cap, standing beside the mast. A great white albatross glides low over the deck as sailors look upward and broken sea ice opens toward dark water. The mariner extends an open hand toward the bird, making their solemn encounter the focal action without showing a weapon or harm. Use a low deck-level view with rigging framing the bird's wings and generous cold sky above. Keep ship, clothing, and equipment credible to the late eighteenth century, and make the supernatural mood awe-filled rather than frightening. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
