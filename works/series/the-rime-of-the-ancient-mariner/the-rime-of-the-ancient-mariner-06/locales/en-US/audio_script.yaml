audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium
    ancient_mariner:
      display_name: Ancient Mariner
      tts:
        delivery: intense and haunted
        timbre: rough and weathered
        pace: deliberate
        pitch: low
    first_voice:
      display_name: First Voice
      tts:
        delivery: urgent and questioning
        timbre: light and airy
        pace: quick
        pitch: high
    second_voice:
      display_name: Second Voice
      tts:
        delivery: quiet and knowing
        timbre: deep and ethereal
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: Part The Sixth
      blocks:
        - id: ch01-b01
          speaker: first_voice
          text: Tell me, tell me! Speak again in that gentle voice. What is making the ship race so fast? What is the ocean doing?
        - id: ch01-b02
          speaker: second_voice
          text: The ocean is as still as a slave before his master. No wind blows over it. Its great bright eye looks silently up at the Moon, waiting to learn which way it should go. She guides it through calm and storm. Look, brother. See how graciously she shines down upon it.
        - id: ch01-b03
          speaker: first_voice
          text: Then why is the ship racing onward when there are no waves and no wind?
        - id: ch01-b04
          speaker: second_voice
          text: The air opens before the ship and closes again behind it. Fly, brother, fly! Higher, higher, or we will be late. Once the Mariner wakes from his trance, the ship will slow down more and more.
        - id: ch01-b05
          speaker: ancient_mariner
          text: I woke, and we sailed on as though the weather were gentle. It was a calm night, and the Moon stood high above us. The dead men were standing together.
        - id: ch01-b06
          speaker: ancient_mariner
          text: They all stood upon the deck, though they belonged in a dungeon piled with bones. Their stony eyes were fixed on me, glittering in the moonlight. The pain and the curse in their dying looks had never gone away. I could not look away from them, and I could not raise my eyes to pray.
        - id: ch01-b07
          speaker: ancient_mariner
          text: Then the spell broke. Once more, I could look at the green ocean. I stared far across it, but I saw little of all the dreadful things I had seen before.
        - id: ch01-b08
          speaker: ancient_mariner
          text: I was like a man walking alone down a road in fear. He has looked behind him once, and now he keeps going without turning again, because he knows a terrifying fiend is following close at his back.
        - id: ch01-b09
          speaker: ancient_mariner
          text: Soon I felt a wind breathe upon me, though it made no sound and stirred nothing. It left no path across the sea, neither a ripple nor a shadow. It lifted my hair and touched my cheek like a spring breeze crossing a meadow. It mixed strangely with my fear, yet it felt like a welcome.
        - id: ch01-b10
          speaker: ancient_mariner
          text: The ship flew swiftly, though she sailed softly too. The sweet breeze blew and blew, but it touched me alone.
        - id: ch01-b11
          speaker: ancient_mariner
          text: Oh, what a joyful dream! Was that truly the lighthouse I could see? Was that the hill? Was that the church? Was I looking at my own country?
          emotion: happy
        - id: ch01-b12
          speaker: ancient_mariner
          text: We drifted across the harbor bar, and I prayed through my sobs. Oh God, let me truly be awake, or let me sleep forever.
          emotion: sad
        - id: ch01-b13
          speaker: ancient_mariner
          text: The harbor bay was smooth and clear as glass. Moonlight lay across the water, along with the Moon's own shadow. The rock shone brightly, and so did the church above it. Even the steady weathercock was soaked in silent moonlight.
        - id: ch01-b14
          speaker: ancient_mariner
          text: The whole bay was white with that quiet light. Then many shadowy shapes rose from the water, glowing crimson.
        - id: ch01-b15
          speaker: ancient_mariner
          text: Those crimson shadows floated a little way ahead of the ship. I turned my eyes back toward the deck. Oh Christ, what did I see there?
          emotion: fearful
        - id: ch01-b16
          speaker: ancient_mariner
          text: Every corpse lay flat and lifeless. Yet over each dead man stood a shining figure, a heavenly man made entirely of light.
        - id: ch01-b17
          speaker: ancient_mariner
          text: Each of those angels raised a hand. What a heavenly sight it was! They stood like signals to the people on shore, each one a beautiful light.
        - id: ch01-b18
          speaker: ancient_mariner
          text: They waved without speaking. There was no voice at all, but their silence entered my heart like music.
        - id: ch01-b19
          speaker: ancient_mariner
          text: Before long, I heard oars splashing and the Pilot calling out. The sound made me turn my head, and I saw a boat coming toward us.
        - id: ch01-b20
          speaker: ancient_mariner
          text: The Pilot and the Pilot's boy were rowing quickly toward me. Dear Lord in Heaven, what joy I felt! Not even those dead men could destroy it.
          emotion: happy
        - id: ch01-b21
          speaker: ancient_mariner
          text: Then I saw a third man and heard his voice. It was the good Hermit! He was singing the holy hymns he made in the woods. He would hear my confession and cleanse my soul of the Albatross's blood.
