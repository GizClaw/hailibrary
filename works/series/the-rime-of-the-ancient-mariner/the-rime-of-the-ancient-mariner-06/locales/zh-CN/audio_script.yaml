audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 沉着而富有故事感，神秘气息逐渐加深
        timbre: 温厚清晰
        pace: 舒缓而有起伏
        pitch: 中低
    ancient_mariner:
      display_name: 老水手
      tts:
        delivery: 苍老郑重，仿佛不得不说出萦绕多年的往事
        timbre: 粗粝而深沉
        pace: 缓慢，紧要处骤然收紧
        pitch: 低
    first_voice:
      display_name: 空中的第一个声音
      tts:
        delivery: 严厉而充满审问的意味
        timbre: 冷峻有力
        pace: 缓慢而分明
        pitch: 中低
    second_voice:
      display_name: 空中的第二个声音
      tts:
        delivery: 柔和克制，如露水般轻缓
        timbre: 清润柔和
        pace: 舒缓
        pitch: 中
  chapters:
    - id: ch01
      title: 第六章
      blocks:
        - id: ch01-b01
          speaker: first_voice
          text: |-
            告诉我，再告诉我吧！用你那柔和的声音回答我。究竟是什么让那艘船走得这样快？大海又在做什么？
        - id: ch01-b02
          speaker: second_voice
          text: |-
            大海像奴仆站在主人面前，没有一丝风，纹丝不动。它睁着明亮的巨眼，默默仰望月亮，想知道该往哪边走。无论温柔还是严厉，都是月亮为它引路。兄弟，你看，她望着大海的目光多么慈爱。
        - id: ch01-b03
          speaker: first_voice
          text: |-
            可既没有风，也没有浪，那艘船怎么还走得那么快？
        - id: ch01-b04
          speaker: second_voice
          text: |-
            船头劈开前面的空气，船尾的空气随即合上。飞吧，兄弟，再飞高一点，不然我们要迟了。等老水手醒过来，这艘船就会越走越慢。
        - id: ch01-b05
          speaker: ancient_mariner
          text: |-
            我醒来时，船仍在温和宁静的天气里航行。夜很静，月亮高高悬着，那些死人聚在一起，站在甲板上。他们本该躺在停尸的地牢里，如今却全拿石头般的眼睛盯着我。月光照得那一双双眼睛闪闪发亮。
        - id: ch01-b06
          speaker: ancient_mariner
          text: |-
            他们临死时的痛苦和诅咒，始终留在脸上。我没法把目光从他们眼里移开，也没法抬起眼睛，望向天空祈祷。
        - id: ch01-b07
          speaker: ancient_mariner
          text: |-
            忽然，魔咒断了。我又看见碧绿的海，也朝远处望去，却几乎看不清从前见过的东西。那感觉就像有人独自走在荒路上，心里怕得发抖。他回过一次头，便只敢往前，再也不敢看身后。因为他知道，有个可怕的恶魔正紧跟着他。
        - id: ch01-b08
          speaker: ancient_mariner
          text: |-
            没多久，一股风吹到我身上。它没有声音，也没有搅动四周。海面上找不到它经过的痕迹，没有涟漪，也没有阴影。它吹起我的头发，拂过我的脸，像春风掠过草地。它和我的恐惧奇异地混在一起，却又像是在迎接我回家。
        - id: ch01-b09
          speaker: ancient_mariner
          text: |-
            船飞快地，飞快地向前走，却又走得那么轻柔。微风甜美地，甜美地吹来，只吹在我一个人身上。
        - id: ch01-b10
          speaker: ancient_mariner
          text: |-
            啊，这难道是一场喜悦的梦？我看见的真是灯塔尖顶吗？那是山丘吗？那是教堂吗？那真是我的故乡吗？
          emotion: surprised
        - id: ch01-b11
          speaker: ancient_mariner
          text: |-
            船漂过港口的沙洲，我一边抽泣，一边祈求上帝，让我醒着吧。不然，就让我永远睡下去。
        - id: ch01-b12
          speaker: ancient_mariner
          text: |-
            港湾清澈得像玻璃，平滑的水面铺展开来。月光落在湾里，月亮的影子也落在水中。岩石闪着光，岩石上的教堂同样明亮。月光浸在寂静里，淹没了那只纹丝不动的风向标。
        - id: ch01-b13
          speaker: ancient_mariner
          text: |-
            整个海湾铺满无声的白光。接着，许多身影从水面升起。那些原本只是影子的形体，竟然披着深红色的光，就在离船头不远的地方。
        - id: ch01-b14
          speaker: ancient_mariner
          text: |-
            我把目光转回甲板。天哪，我看见了什么！每一具尸身都直挺挺地躺着，没有一点生气。凭神圣的十字架起誓，每具尸身上都站着一个通体发光的人，一个天使般的人。
          emotion: surprised
        - id: ch01-b15
          speaker: ancient_mariner
          text: |-
            他们每一个都挥着手，那景象只应属于天国。他们像给岸上的信号一样站在那里，每个人都是一道美丽的光。他们一直挥手，却没有发出一点声音。可那片寂静，却像音乐一样沉进我的心。
        - id: ch01-b16
          speaker: ancient_mariner
          text: |-
            不久，我听见船桨拍打水面，又听见领航员的呼喊。我不由得转过头，看见一只小船出现。领航员和他的孩子正飞快地赶来。天上的主啊，这份喜悦，连那些死人也毁不掉。
        - id: ch01-b17
          speaker: ancient_mariner
          text: |-
            我又看见第三个人，也听见了他的声音。是那位善良的隐士！他高声唱着自己在林中编成的虔诚圣歌。他会听我忏悔，赦免我的灵魂，洗净我身上信天翁的血。
