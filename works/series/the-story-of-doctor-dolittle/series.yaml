cover_prompt: |-
  A wordless cover scene outside an English country house in the early nineteenth century shows Doctor Dolittle listening carefully to his animal friends. The doctor is a short sturdy middle-aged man with kind eyes, a plain brown coat, green waistcoat, knee breeches, worn boots, and a black top hat resting on the grass. Polynesia the gray parrot perches near his ear, Jip the brown dog sits alert, Dab-Dab the white duck, Gub-Gub the pink pig, and Chee-Chee the small monkey gather in a semicircle. Dolittle kneels and offers his open palm while Polynesia speaks, making attentive cross-species conversation the focal action. Use an eye-level garden view with the old house and country lane behind them and generous quiet sky above the roofline. Keep animals anatomically believable and expressive, costumes historically grounded, and all designs independent of film or television adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
