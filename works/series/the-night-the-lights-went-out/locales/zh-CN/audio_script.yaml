audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在孩子身边讲故事，安静而清楚, timbre: 温暖清亮, pace: 舒缓自然, pitch: 中}}
    linlin: {display_name: 林林, tts: {delivery: 起初小心怯生，后来好奇放松, timbre: 清脆稚嫩, pace: 自然, pitch: 中高}}
    mama: {display_name: 妈妈, tts: {delivery: 沉着温柔，带一点干脆的幽默, timbre: 柔和稳健, pace: 从容, pitch: 中}}
    papa: {display_name: 爸爸, tts: {delivery: 亲切认真，也会拿自己开玩笑, timbre: 温暖厚实, pace: 自然, pitch: 中低}}
    grandma-wu: {display_name: 吴奶奶, tts: {delivery: 爽快慈爱，说话直截了当, timbre: 略带沙哑, pace: 不疾不徐, pitch: 中低}}
    a-jun: {display_name: 阿俊, tts: {delivery: 爱说爱笑，兴奋劲藏不住, timbre: 明亮少年感, pace: 稍快, pitch: 中高}}
    neighbors: {display_name: 邻居们, tts: {delivery: 隔着楼层互相传话，亲切自然, timbre: 清楚朴实, pace: 自然, pitch: 中}}
  chapters:
    - id: ch01
      title: 冰箱不响了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            那天的热气散得特别慢。太阳早下山了，墙里还存着白天的温度。林林刚洗完澡，湿发梢一下下扫着睡衣领子。她趴在客厅地板上搭纸板城，最后一块屋顶怎么都卡不稳。风扇转过来，呼一下吹跑一张纸；转开后，屋里就只听得见蝉叫。

            妈妈在厨房切西瓜，刀碰着盘子，叮的一声。爸爸坐在餐桌边回消息，手机隔一会儿就亮一下。林林按住屋顶，对纸片小人说：
        - {id: ch01-b02, speaker: linlin, text: 现在谁也不许呼吸。}
        - id: ch01-b03
          speaker: narrator
          text: |-
            偏偏这时候，灯灭了。风扇越转越慢，呼——呼——，最后停住。空调的小绿点也没了，妈妈的刀停在半空。整栋楼像一下闭了嘴。接着，林林听见一个从没留意过的声音——冰箱也不响了。

            黑暗忽然变得好大。纸板城、妈妈，连自己的膝盖都看不见。林林伸手摸地板，反倒碰翻一座小楼。纸板哗啦散开，她的心也跟着往下一沉。
        - {id: ch01-b04, speaker: linlin, text: 妈妈？, emotion: fearful}
        - {id: ch01-b05, speaker: mama, text: 我在厨房。先别跑，地上有你的城，踩着会疼。, emotion: calm}
        - id: ch01-b06
          speaker: narrator
          text: 爸爸那边椅子一响。他说要开手机灯。一小团白光亮了，正好从下往上照着他的下巴，活像个讲鬼故事的人。林林本来快哭了，一看他那两个圆圆的鼻孔，眼泪倒停在眼眶里。
        - {id: ch01-b07, speaker: mama, text: 先照路，别先吓孩子。}
        - {id: ch01-b08, speaker: papa, text: 我在找手电筒啊。它明明一直住在这个抽屉里。}
        - id: ch01-b09
          speaker: narrator
          text: |-
            爸爸把光挪向抽屉。里面有胶带、旧电池、两支写不出字的笔，还有一只孤零零的手套，就是没有手电筒。他又去拉第二个抽屉。林林抱着膝盖，只盯住那团会走的白光。光从桌腿爬上墙，照出一家三口长长短短的影子。

            门外咔哒一声，吴奶奶隔着门问：
        - {id: ch01-b10, speaker: grandma-wu, text: 你们家也黑啦？}
        - id: ch01-b11
          speaker: narrator
          text: 妈妈摸到门边，把门打开。对门的吴奶奶举着蒲扇，身后也是黑的。只有楼道应急灯绿莹莹地亮着，把每个人的脸照得有点陌生。爸爸探头看了看。
        - {id: ch01-b12, speaker: papa, text: 不是咱们家的问题，整层都停了。}
        - id: ch01-b13
          speaker: narrator
          text: 楼上的阿俊马上喊下来：
        - {id: ch01-b14, speaker: a-jun, text: 不是整层！是整栋！我从阳台看见了，下面全黑了！}
        - id: ch01-b15
          speaker: narrator
          text: 阿俊说得像在宣布一条大新闻。可林林一听“整栋”两个字，只觉得黑暗又往上长了一大截。
    - id: ch02
      title: 一点小火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 妈妈找出一根去年生日剩下的短蜡烛，细细的，还歪着脖子。可烛台找不到。爸爸说，不如滴点蜡粘在盘子上。妈妈摇摇头。
        - {id: ch02-b02, speaker: mama, text: 放进玻璃罐里，还得离窗帘远一点。}
        - id: ch02-b03
          speaker: narrator
          text: |-
            她洗净一只空果酱罐，擦干水，放到阳台的小圆凳上。爸爸划火柴时，林林远远站着。刺啦一声，橙色的火蹿出来，她赶紧往妈妈身后躲了半步。

            短蜡烛在罐里稳稳立住。火苗很小，只照得见凳子边、妈妈的手和林林的黄色拖鞋。可黑暗不再是严严实实的一整块了。它退到门后、沙发底下和走廊尽头，留下几处能看清的地方。

            爸爸终于在鞋柜顶的工具箱里找到手电筒。他按了两下，没亮。
        - {id: ch02-b04, speaker: papa, text: 电池旧了。}
        - {id: ch02-b05, speaker: mama, text: 那就让它接着睡吧。今晚也不用非把什么修好。}
        - id: ch02-b06
          speaker: narrator
          text: |-
            妈妈端着西瓜去了阳台，林林却不想跟过去。外头没了亮窗、路灯和商店招牌，两栋楼之间像一口深井。她站在推拉门里，紧紧抓着门框。

            妈妈没拉她，只把一块西瓜放在靠门的小凳上。爸爸坐到地垫上，拿蒲扇扇风。才扇三下，吴奶奶就笑了。
        - {id: ch02-b07, speaker: grandma-wu, text: 小程，你那扇子拿倒啦。, emotion: happy}
        - id: ch02-b08
          speaker: narrator
          text: 爸爸低头一瞧，还真是，扇柄朝外了。他把扇子掉过来，嘴上还不服。
        - {id: ch02-b09, speaker: papa, text: 倒着也有风。}
        - {id: ch02-b10, speaker: grandma-wu, text: 那是你胳膊累出来的风。, emotion: happy}
        - id: ch02-b11
          speaker: narrator
          text: 好几户的阳台门都开了。有人问电梯里有没有人，有人说物业已经去看了。还有人抱怨冰棍快化了，黑暗里立刻有人接话：
        - {id: ch02-b12, speaker: neighbors, text: 那就先吃，别浪费！}
        - id: ch02-b13
          speaker: narrator
          text: |-
            楼上的孩子们一齐欢呼，好像冰棍融化成了今晚最棒的消息。

            平时，这些声音都被电视、抽油烟机和车声盖着。今晚，它们一层层从黑暗里落下来。林林听见六楼的婴儿哼哼，九楼有人收衣架，十二楼的阿俊正把亮着手机光的窗户数得乱七八糟。
        - {id: ch02-b14, speaker: a-jun, text: 三盏、五盏、八盏——}
        - {id: ch02-b15, speaker: linlin, text: 你漏了七。}
        - id: ch02-b16
          speaker: narrator
          text: 楼上安静一秒。阿俊趴到栏杆边。
        - {id: ch02-b17, speaker: a-jun, text: 林林，你出来啦？, emotion: surprised}
        - id: ch02-b18
          speaker: narrator
          text: 林林这才发现，自己已经离开门框，站到了小凳旁。她手里还拿着西瓜，凉凉的汁正顺着手腕往下淌。
        - {id: ch02-b19, speaker: linlin, text: 我只出来一点。}
        - {id: ch02-b20, speaker: a-jun, text: 一点也算。}
        - id: ch02-b21
          speaker: narrator
          text: 院子里，物业的陈叔叔举着手电走出单元门。他仰头说还得等一会儿，请大家别坐电梯。声音传到高处已经不大了，各层还是一个接一个往上传。传到阿俊那里，却成了：
        - {id: ch02-b22, speaker: a-jun, text: 还要等一会儿，大家坐好！}
        - {id: ch02-b23, speaker: linlin, text: 不是坐好，是别坐电梯。}
        - {id: ch02-b24, speaker: a-jun, text: 我知道。我是叫冰棍坐好，别往地上滴。, emotion: happy}
        - id: ch02-b25
          speaker: narrator
          text: 楼上又笑成一片。林林咬了一口西瓜。这次，她没急着躲回门里。夜风吹过来，把湿发梢轻轻吹离了她的脖子。
    - id: ch03
      title: 黑暗里的楼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 蜡烛把一家三口的影子映在阳台墙上。爸爸举起蒲扇，一条扁扁的大鱼就游过去。林林变出一只会动嘴的小狗。妈妈怎么也对不准，干脆竖起两根手指，说那是只耳朵特别长的兔子。
        - {id: ch03-b02, speaker: linlin, text: 兔子的头呢？}
        - {id: ch03-b03, speaker: mama, text: 藏在黑里。}
        - {id: ch03-b04, speaker: linlin, text: 那它怎么知道往哪儿跳？}
        - id: ch03-b05
          speaker: narrator
          text: 妈妈想了想。
        - {id: ch03-b06, speaker: mama, text: 也许，它听别人说话。}
        - id: ch03-b07
          speaker: narrator
          text: |-
            林林忽然觉得，这栋楼也像那只没做完的兔子。虽然看不清，可一点也不空。有人咳嗽、笑、开门关门。谁家的勺子掉了，谁家的猫叫了，谁把半盆水泼到花盆外，全听得清清楚楚。

            七楼有人哼歌，哼两句就忘了。八楼叔叔接错调，十楼又有人接回来。谁也没从头唱到尾，可歌还是在楼里绕了一圈。歌声停下后，林林听见几条街外的公交车报站，轻得像隔着枕头传来。

            平时睡前，她总嫌楼上拖椅子、楼下关门、院里电动车响。现在每个声音都单独冒出来，她反而听得出哪个近、哪个远。原来最吓人的不是声音，而是刚停电时，她以为身边什么都没有了。
        - {id: ch03-b08, speaker: grandma-wu, text: 林林，还怕不怕？}
        - id: ch03-b09
          speaker: narrator
          text: 林林很想说“不怕”。两个字又短，又显得勇敢。可客厅深处还是黑得没底。
        - {id: ch03-b10, speaker: linlin, text: 还有一点怕。, emotion: fearful}
        - {id: ch03-b11, speaker: grandma-wu, text: 我也怕一点。我怕摸黑找眼镜，最后把蒲扇戴脸上。, emotion: happy}
        - id: ch03-b12
          speaker: narrator
          text: 阿俊在楼上笑得直咳嗽。爸爸也接了一句：
        - {id: ch03-b13, speaker: papa, text: 那我怕手电筒明早醒了，怪我今晚没叫它。, emotion: happy}
        - id: ch03-b14
          speaker: narrator
          text: |-
            妈妈没说自己怕什么。她擦干净林林黏糊糊的手腕，又把玻璃罐往阳台中间挪了挪，离窗帘更远。林林靠着她，闻见衣服上淡淡的肥皂味。

            风终于从楼缝里钻进来。它不像空调风那样一直吹，只碰了碰林林汗湿的额头，又去掀桌上的纸巾，随后消失。过一会儿，风从另一个方向回来，把火苗压得矮矮的。
        - {id: ch03-b15, speaker: linlin, text: 它会灭吗？, emotion: fearful}
        - {id: ch03-b16, speaker: mama, text: 可能会。可就算灭了，我们也还坐在这里。, emotion: calm}
        - id: ch03-b17
          speaker: narrator
          text: |-
            妈妈把手拢在玻璃罐外，没有碰火。那点火苗没因为整栋楼都黑就变大，只安安静静守住自己照得到的一小圈。

            林林脱下拖鞋，踩上凉凉的地砖，又往栏杆边走了两步。下面的院子已经不像深井了。几部手机在树下晃，有人搬出折叠椅，保安叔叔正从门房走向配电间。更远的街道还有灯，车灯慢慢滑过楼墙。

            原来黑暗没把世界拿走。它只是把熟悉的东西挪到了不熟悉的位置。爸爸忽然叫她：
        - {id: ch03-b18, speaker: papa, text: 林林，往上看。}
    - id: ch04
      title: 屋顶上的星星
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 林林先看见屋檐黑黑的一道边。再往上，是很深很深的蓝。平时，对面楼顶总罩着一层白光，天空像块怎么也擦不净的玻璃。今晚那层光淡了，屋顶上方露出好多小亮点。
        - {id: ch04-b02, speaker: linlin, text: 那些都是星星吗？, emotion: surprised}
        - {id: ch04-b03, speaker: papa, text: 至少咱们看见的这些是。不过，我也叫不出名字。}
        - id: ch04-b04
          speaker: narrator
          text: 阿俊又从楼上喊下来：
        - {id: ch04-b05, speaker: a-jun, text: 我认识最亮的那颗！}
        - {id: ch04-b06, speaker: grandma-wu, text: 那它叫什么？}
        - id: ch04-b07
          speaker: narrator
          text: 阿俊憋了半天，才回答：
        - {id: ch04-b08, speaker: a-jun, text: 最亮的那颗。, emotion: happy}
        - id: ch04-b09
          speaker: narrator
          text: |-
            笑声从十二楼落到八楼，又落进院子。林林也笑了，头还仰着。她不用知道每颗星叫什么。有的大，有的小；有的像一眨眼就没了，再一看，还在原处。

            妈妈关掉手机灯，爸爸也关了。阳台上只剩罐里一点黄光。林林刚想叫他们开灯，可话到了嘴边，她没说。等眼睛慢慢习惯，她又看清妈妈的侧脸、爸爸搭在膝盖上的手，还有吴奶奶一起一落的扇子。星星好像也更多了。

            有颗亮星正好挨着对面楼顶的水箱。林林伸出食指，隔空量了量。从这里看，星星离水箱只有一根手指那么远。她知道这不是真正的距离，可就是喜欢这么量。
        - {id: ch04-b10, speaker: linlin, text: 它们以前去哪儿了？}
        - {id: ch04-b11, speaker: mama, text: 哪儿也没去。只是今晚，我们更容易看见它们了。}
        - id: ch04-b12
          speaker: narrator
          text: |-
            林林想起纸板城。灯亮时，她总嫌那块屋顶歪。灯灭后，她连整座城在哪儿都看不见。可也正是在什么都看不清时，她听见了整栋楼，还第一次看清楼顶的天空。

            忽然，楼道里响起电梯启动的低鸣。对面一排窗户一格格亮起来，有白的，也有黄的。空调响了，冰箱重新哼起来。客厅灯把阳台照得像白天，林林眯起眼。
        - {id: ch04-b13, speaker: neighbors, text: 来电啦！, emotion: happy}
        - id: ch04-b14
          speaker: narrator
          text: 爸爸站起来。
        - {id: ch04-b15, speaker: papa, text: 我去看看冰箱。}
        - id: ch04-b16
          speaker: narrator
          text: 妈妈正要吹灭蜡烛，林林轻轻按住她的手腕。
        - {id: ch04-b17, speaker: linlin, text: 等一下。}
        - id: ch04-b18
          speaker: narrator
          text: 妈妈看着她。
        - {id: ch04-b19, speaker: linlin, text: 再看一颗。}
        - id: ch04-b20
          speaker: narrator
          text: 爸爸都走到门边了，又回来关掉客厅灯。对面两户也把灯关了，接着又是一户。阿俊在楼上喊：
        - {id: ch04-b21, speaker: a-jun, text: 谁先找到最暗的那颗？}
        - id: ch04-b22
          speaker: narrator
          text: |-
            空调还在吹，电梯还在跑，城市的亮光正一点点爬回天空。玻璃罐里的蜡烛只剩短短一小截。

            林林靠在妈妈肩上，挑中了水箱旁边那颗最不起眼的星。

            她没有告诉别人。
