audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在孩子身边讲故事，安静而清楚, timbre: 温暖清亮, pace: 舒缓自然, pitch: 中}}
    linlin: {display_name: 林林, tts: {delivery: 起初小心怯生，后来好奇放松, timbre: 清脆稚嫩, pace: 自然, pitch: 中高}}
    mama: {display_name: 妈妈, tts: {delivery: 沉着温柔，带一点干脆的幽默, timbre: 柔和稳健, pace: 从容, pitch: 中}}
    papa: {display_name: 爸爸, tts: {delivery: 亲切认真，也会拿自己开玩笑, timbre: 温暖厚实, pace: 自然, pitch: 中低}}
    grandma-wu: {display_name: 吴奶奶, tts: {delivery: 爽快慈爱，说话直截了当, timbre: 略带沙哑, pace: 不疾不徐, pitch: 中低}}
    a-jun: {display_name: 阿俊, tts: {delivery: 爱说爱笑，兴奋劲藏不住, timbre: 明亮少年感, pace: 稍快, pitch: 中高}}
    neighbors: {display_name: 邻居们, tts: {delivery: 隔着楼层互相传话，亲切自然, timbre: 清楚朴实, pace: 自然, pitch: 中}}
  chapters:
    - id: ch01
      title: 冰箱不响了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            那天晚上，热气迟迟不肯散。太阳早就下去了，墙里还存着白天的温度。林林洗完澡，头发没有吹干，发梢一下下蹭着睡衣领子。她趴在客厅地板上拼纸板城，最后那块屋顶怎么也卡不牢。风扇转过来，呼一下掀起一张小纸片。等它转开，屋里又只剩下蝉叫。

            厨房里，妈妈在切西瓜，刀碰盘子，叮地响了一声。爸爸坐在餐桌旁回消息，手机一会儿亮，一会儿暗。林林用手压住屋顶，对城里的纸片小人说：
        - {id: ch01-b02, speaker: linlin, text: 都别动，现在谁也不准呼吸。}
        - id: ch01-b03
          speaker: narrator
          text: |-
            就在这时候，灯灭了。

            风扇慢了下来，呼——呼——，最后彻底停住。空调上的小绿点也没了，妈妈举着的刀停在半空。整栋楼像忽然闭上了嘴。接着，林林才发现，冰箱也不响了。

            黑暗一下变得很大。纸板城看不见，妈妈看不见，连自己的膝盖也看不见。林林伸手摸地板，却把一座小楼碰倒了。纸板哗啦散开，她的心也跟着沉了下去。
        - {id: ch01-b04, speaker: linlin, text: 妈妈？, emotion: fearful}
        - {id: ch01-b05, speaker: mama, text: 妈妈在厨房。你先别动，地上有纸板城，踩上去会疼。, emotion: calm}
        - id: ch01-b06
          speaker: narrator
          text: 爸爸那边的椅子响了响。他打开手机灯。一团白光先从下边照到他的下巴，像要讲鬼故事。林林本来快哭了，可一看到那两个圆圆的鼻孔，眼泪竟停在眼眶里。
        - {id: ch01-b07, speaker: mama, text: 路还没照呢，倒先把孩子吓着了。}
        - {id: ch01-b08, speaker: papa, text: 我这不是在找手电筒嘛。它平时明明就待在这儿。}
        - id: ch01-b09
          speaker: narrator
          text: |-
            爸爸把手机光挪到抽屉里。胶带、旧电池、两支写不出字的笔，还有一只落单的手套，全在里面，偏偏没有手电筒。他又打开第二个抽屉。林林抱紧膝盖，只管盯着那团移动的白光。它爬过桌腿，又爬上墙，照出了三个人长长短短的影子。

            门外咔哒响了一声，吴奶奶的声音跟着传进来：
        - {id: ch01-b10, speaker: grandma-wu, text: 你们家也停电啦？}
        - id: ch01-b11
          speaker: narrator
          text: 妈妈摸到门边，开了门。对门的吴奶奶举着蒲扇，身后同样黑漆漆的。楼道里只有绿莹莹的应急灯，照得大家的脸都和平时不大一样。爸爸往外探了探头。
        - {id: ch01-b12, speaker: papa, text: 看来不是咱们这一家，整层都没电。}
        - id: ch01-b13
          speaker: narrator
          text: 楼上的阿俊立刻喊了下来：
        - {id: ch01-b14, speaker: a-jun, text: 不只是这一层，是整栋楼！我从阳台看了，下面一片黑！}
        - id: ch01-b15
          speaker: narrator
          text: 阿俊像在播报大新闻。可林林听到“整栋楼”，只觉得黑暗又往上长高了一截。
    - id: ch02
      title: 一点小火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 妈妈翻出一根去年过生日剩下的蜡烛。蜡烛短短细细的，还是歪的，可家里怎么也找不到烛台。爸爸提议往盘子上滴点蜡，把它粘住。妈妈摇了摇头。
        - {id: ch02-b02, speaker: mama, text: 还是放在玻璃罐里吧，还要离窗帘远一点。}
        - id: ch02-b03
          speaker: narrator
          text: |-
            她洗干净一只空果酱罐，把水擦干，再放到阳台的小圆凳上。爸爸划火柴时，林林远远站着。盒边刺啦一响，橙色的火一下冒出来，吓得她往妈妈背后退了半步。

            短蜡烛在罐子里站住了。那点火苗很小，只能照见凳子边、妈妈的手，还有林林脚上那双黄拖鞋。可是，黑暗不再连成一整块。它退到了门后、沙发底下和走廊最里面，屋里总算有了几处看得清的地方。

            爸爸终于从鞋柜顶上的工具箱里翻出手电筒。他按了两下，什么也没亮。
        - {id: ch02-b04, speaker: papa, text: 得，电池早就没电了。}
        - {id: ch02-b05, speaker: mama, text: 那就让手电筒接着睡。今晚也不是非修好不可。}
        - id: ch02-b06
          speaker: narrator
          text: |-
            妈妈端着西瓜走到阳台。林林却不肯过去。外面没有明亮的窗户，路灯没有照着树，对面商店的招牌也看不见了。两栋楼中间就像一口深井。她留在推拉门里面，手指紧紧抠着门框。

            妈妈没有去拉她，只把一块西瓜放在靠门的小凳上。爸爸在地垫上坐下，拿蒲扇给自己扇风。刚扇了三下，对面的吴奶奶就笑了。
        - {id: ch02-b07, speaker: grandma-wu, text: 小程啊，你把蒲扇拿反喽。, emotion: happy}
        - id: ch02-b08
          speaker: narrator
          text: 爸爸低头看看，扇柄果然朝着外面。他把蒲扇转过来，还是不肯认输。
        - {id: ch02-b09, speaker: papa, text: 拿反了也照样有风。}
        - {id: ch02-b10, speaker: grandma-wu, text: 有啊，那是你胳膊使劲扇出来的风。, emotion: happy}
        - id: ch02-b11
          speaker: narrator
          text: 越来越多的阳台门打开了。有人问电梯里困没困人，有人说物业已经去检查了。还有人担心冰棍就要化掉。黑暗里，不知谁马上回了一句：
        - {id: ch02-b12, speaker: neighbors, text: 要化就赶紧吃，可别糟蹋了！}
        - id: ch02-b13
          speaker: narrator
          text: |-
            楼上的孩子们顿时一起欢呼，仿佛冰棍要化是这个晚上最好的消息。

            平常，这些动静总被电视声、抽油烟机声和车声压住。现在，它们从黑暗里一层一层落下来。林林听到了六楼婴儿的哼哼声，也听到了九楼收衣架的碰撞声。十二楼的阿俊还在数那些亮着手机光的窗户，数得乱七八糟。
        - {id: ch02-b14, speaker: a-jun, text: 三个、五个、八个——}
        - {id: ch02-b15, speaker: linlin, text: 七呢？你把七漏掉了。}
        - id: ch02-b16
          speaker: narrator
          text: 上面安静了一秒。阿俊趴到了栏杆边。
        - {id: ch02-b17, speaker: a-jun, text: 林林？你也到阳台上来啦？, emotion: surprised}
        - id: ch02-b18
          speaker: narrator
          text: 林林这才低头看看自己。原来她早已松开门框，走到了小凳旁边。她手里还拿着西瓜，冰凉的汁正沿着手腕往下流。
        - {id: ch02-b19, speaker: linlin, text: 我就出来了这么一点。}
        - {id: ch02-b20, speaker: a-jun, text: 出来一点，那也叫出来了。}
        - id: ch02-b21
          speaker: narrator
          text: 院子里，物业的陈叔叔举着手电，从单元门出来了。他仰头说还要再等一会儿，千万别坐电梯。声音传到高处已经很轻，各层的人却接力一样往上传。等传到阿俊那儿，就变成了：
        - {id: ch02-b22, speaker: a-jun, text: 还得等一会儿，大家都坐好！}
        - {id: ch02-b23, speaker: linlin, text: 他说的是别坐电梯，不是让大家坐好。}
        - {id: ch02-b24, speaker: a-jun, text: 我当然知道。我是让冰棍坐稳了，别滴到地上。}
        - id: ch02-b25
          speaker: narrator
          text: 楼上又传来一阵笑。林林咬了一口西瓜，没有马上往门里退。夜风吹来，把湿发梢从她脖子上轻轻吹开。
    - id: ch03
      title: 黑暗里的楼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 烛光把一家三口的影子投到阳台墙上。爸爸举起蒲扇，墙上立刻游过一条扁扁的大鱼。林林用手做了一只小狗，嘴巴还能一张一合。妈妈怎么都摆不好手影，索性伸出两根手指，说这是一只耳朵特别长的兔子。
        - {id: ch03-b02, speaker: linlin, text: 可是，兔子的脑袋在哪儿？}
        - {id: ch03-b03, speaker: mama, text: 脑袋藏到黑暗里去了。}
        - {id: ch03-b04, speaker: linlin, text: 看不见路，它还怎么跳呀？}
        - id: ch03-b05
          speaker: narrator
          text: 妈妈想了一会儿才回答。
        - {id: ch03-b06, speaker: mama, text: 它也许会听着大家的声音往前跳。}
        - id: ch03-b07
          speaker: narrator
          text: |-
            林林没有再问。她忽然觉得，眼前这栋楼就像那只没有做完的兔子。虽然看不清，却一点也不空。楼里有人咳嗽，有人笑，有人开门又关门。谁家的勺子掉了，谁家的猫叫了一声，谁又把半盆水泼到了花盆外面，全都听得明明白白。

            七楼有人哼起歌，只唱两句就忘了下面。八楼的叔叔接了过去，却接错了调。十楼又有人把调子接回来。没有一个人从头唱到尾，可那首歌还是在楼里绕了一整圈。歌停了，大家静了一阵。林林听到几条街外的公交车在报站，那声音轻轻的，像隔着枕头传过来。

            她想起自己平常睡觉前，总嫌楼上挪椅子，嫌楼下关门，嫌院里的电动车响。现在，声音一个接一个露出来，她却能听清哪个离得近，哪个离得远。原来真正吓到她的不是那些声音。刚停电时，她以为身边什么都没有了，那才最可怕。
        - {id: ch03-b08, speaker: grandma-wu, text: 林林，现在还害怕吗？}
        - id: ch03-b09
          speaker: narrator
          text: 林林本来想说不怕。这个回答又短，又显得她很勇敢。可她朝客厅深处看了看，那里还是黑得像没有底。
        - {id: ch03-b10, speaker: linlin, text: 还是有一点点怕。, emotion: fearful}
        - {id: ch03-b11, speaker: grandma-wu, text: 我也有点怕。我怕黑着灯找眼镜，最后把蒲扇戴到脸上去。, emotion: happy}
        - id: ch03-b12
          speaker: narrator
          text: 阿俊马上在楼上笑得咳嗽起来。爸爸也跟着开了口。
        - {id: ch03-b13, speaker: papa, text: 我怕手电筒明天睡醒了，要怪我今晚没把它叫起来。}
        - id: ch03-b14
          speaker: narrator
          text: |-
            妈妈没有说自己怕什么。她先擦掉林林手腕上黏黏的西瓜汁，又把玻璃罐朝阳台中间挪了一点，让它离窗帘更远。林林靠在妈妈胳膊上，闻到了她衣服上淡淡的肥皂味。

            风终于从楼缝间吹了过来。它和空调不停往外送的风不一样。它先碰了碰林林汗湿的额头，又掀了一下桌上的纸巾，转眼就消失了。过了一会儿，它又从另一个方向回来，把火苗压得低低的。
        - {id: ch03-b15, speaker: linlin, text: 蜡烛会不会灭掉？, emotion: fearful}
        - {id: ch03-b16, speaker: mama, text: 有可能。不过就算火灭了，我们也还会坐在这儿。, emotion: calm}
        - id: ch03-b17
          speaker: narrator
          text: |-
            妈妈把手护在玻璃罐外面，却没有碰到火。小小的火苗并没有因为整栋楼都黑着，就突然变大。它只是守住了自己照得到的那一圈地方。

            林林把双脚从拖鞋里抽出来，踩上凉凉的地砖，又朝栏杆走近两步。楼下的院子已经不再像深井。几团手机光在树下晃动，有人搬出了折叠椅，保安叔叔正从门房往配电间走。再远一些，街道上还有灯。车辆开过路口，灯光慢慢从楼墙上滑过去。

            黑暗并没有把这个世界拿走。它只是让那些熟悉的东西换了地方。就在这时，爸爸叫了她一声：
        - {id: ch03-b18, speaker: papa, text: 林林，抬头看看。}
    - id: ch04
      title: 屋顶上的星星
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 林林先看到屋檐黑黑的边。目光再往上，那里是一片很深的蓝。平常，对面楼顶总罩着一层白亮的光，天空就像一块怎么也擦不干净的玻璃。可今晚，那层光变淡了，屋顶上露出了许许多多的小亮点。林林仰起头，问爸爸：
        - {id: ch04-b02, speaker: linlin, text: 那些小亮点，全都是星星吗？}
        - {id: ch04-b03, speaker: papa, text: 至少我们现在看见的这些是。可它们叫什么，我也不知道。}
        - id: ch04-b04
          speaker: narrator
          text: 楼上的阿俊听见了，马上大声喊：
        - {id: ch04-b05, speaker: a-jun, text: 最亮的那颗我认识！}
        - {id: ch04-b06, speaker: grandma-wu, text: 是吗？那颗星叫什么名字？}
        - id: ch04-b07
          speaker: narrator
          text: 阿俊停了好一阵，才说：
        - {id: ch04-b08, speaker: a-jun, text: 它就叫……最亮的那颗。}
        - id: ch04-b09
          speaker: narrator
          text: |-
            大家都笑了。笑声从十二楼落到八楼，又从八楼掉进院子。林林也仰着头笑。她忽然觉得，不知道每颗星的名字也没关系。那些星有大有小。有的似乎一眨眼就不见了，可再仔细看，它还待在原来的地方。

            妈妈关了自己的手机灯，爸爸也跟着关掉。阳台上只剩玻璃罐里那一点黄光。林林刚想请他们把灯打开，话到了嘴边，却没有说出来。等眼睛一点点适应了，她又能看见妈妈的侧脸、爸爸放在膝盖上的手，还有吴奶奶手中上下摆动的蒲扇。就连星星看上去也更多了。

            一颗很亮的星，正好停在对面楼顶的水箱旁。林林伸出食指，隔着远远的空气量了量。在她眼里，星星和水箱之间只有一根手指那么远。她知道真正的距离不是这样，可她喜欢用这个办法量。
        - {id: ch04-b10, speaker: linlin, text: 这些星星，以前都躲到哪里去了？}
        - {id: ch04-b11, speaker: mama, text: 它们一直都在。只是今天晚上，我们更容易看到它们。}
        - id: ch04-b12
          speaker: narrator
          text: |-
            林林想到了自己的纸板城。有灯的时候，她总盯着那块歪歪的屋顶。灯灭以后，她连整座城放在哪里都找不到了。可也正是在什么都看不清的时候，她听见了整栋楼的声音，还第一次看清了楼顶上的天空。

            楼道里忽然传来电梯启动的低鸣。紧跟着，对面的窗户一格一格亮起来，有白光，也有黄光。空调重新响了，冰箱也重新哼了起来。客厅灯把阳台照得如同白天，林林赶紧眯起眼睛。
        - {id: ch04-b13, speaker: neighbors, text: 来电啦！, emotion: happy}
        - id: ch04-b14
          speaker: narrator
          text: 爸爸站了起来。
        - {id: ch04-b15, speaker: papa, text: 我去瞧瞧冰箱怎么样了。}
        - id: ch04-b16
          speaker: narrator
          text: 妈妈正要把蜡烛吹灭，林林却轻轻按住了她的手腕。
        - {id: ch04-b17, speaker: linlin, text: 先等一等。}
        - id: ch04-b18
          speaker: narrator
          text: 妈妈转过头看着她。
        - {id: ch04-b19, speaker: linlin, text: 我们再看一颗星星，好不好？}
        - id: ch04-b20
          speaker: narrator
          text: 爸爸已经走到门边，又转回来关掉了客厅灯。对面有两户人家也把灯关了，接着，第三户也暗下来。楼上的阿俊又喊道：
        - {id: ch04-b21, speaker: a-jun, text: 看谁先找出最暗的那一颗！}
        - id: ch04-b22
          speaker: narrator
          text: |-
            空调还吹着风，电梯还在运行，城市的亮光正一点点爬回天空。玻璃罐里的蜡烛已经很短，只剩最后一小截。

            林林靠在妈妈肩上，选中了水箱旁边那颗最不起眼的星。

            她没有告诉别人。
