cover_prompt: "A wordless summer-night apartment balcony scene during a building-wide power outage. Seven-year-old Linlin, a Chinese girl with a round face, straight black bobbed hair with one small yellow star hair clip, a loose coral-red short-sleeve pajama top, navy shorts, and yellow sandals, stands between her mother, a Chinese woman with a warm oval face, black hair in a low bun, a soft sage-green blouse, cream trousers, and simple brown house slippers, and her father, a Chinese man with short black hair, round glasses, a pale blue T-shirt, charcoal shorts, and simple dark house slippers. A single short ivory candle is protected inside one clear glass jam jar on a small round stool. Across the dark apartment courtyard, several neighbors lean on separate balconies and talk softly. All electric room lights, streetlights, signs, and decorative lights are off; only a few dim phone lights and the one jar candle glow. The deep blue sky above the roofline shows a modest scattering of newly visible stars. Linlin looks upward with fear giving way to wonder. Show only the named people and objects; no pets, lanterns, extra candles, cake, string lights, or invented light sources. Intimate eye-level wide composition, safe candle placement, warm family silhouettes against cool night, no visible text, letters, numbers, logos, captions, speech bubbles, signatures, or watermarks."
