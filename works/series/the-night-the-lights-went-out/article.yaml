cover_prompt: |-
  A wordless summer-night apartment balcony scene. Seven-year-old Linlin, a Chinese girl with a round face, straight black bobbed hair with one small yellow star hair clip, a loose coral-red short-sleeve pajama top, navy shorts, and yellow sandals, stands between her mother and father beside a single short ivory candle protected inside a clear glass jar on a small round stool. Across the dark apartment courtyard, several neighbors lean on balconies and talk softly. Most windows are dark; the deep blue sky above the roofline is crowded with newly visible stars. Linlin looks upward with fear giving way to wonder. Intimate eye-level wide composition, safe candle placement, warm family silhouettes against cool night, no visible text, letters, numbers, logos, captions, speech bubbles, signatures, or watermarks.
