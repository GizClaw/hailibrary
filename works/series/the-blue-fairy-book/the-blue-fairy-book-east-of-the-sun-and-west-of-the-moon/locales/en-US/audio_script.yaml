  chapters:
    - id: ch01
      title: The White Bear
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor farmer lived with his many children. He had very little food or clothing to give them. They were all pretty, but the youngest daughter was the loveliest of them all. Her beauty seemed to have no bounds.
        - id: ch01-b02
          speaker: narrator
          text: Late one Thursday evening in autumn, the whole family sat working beside the fire. Outside, the night was black. Rain poured down, and the wind shook the cottage walls. Then someone knocked three times on the window. The farmer went out and found a huge white bear waiting there.
        - id: ch01-b03
          speaker: white_bear
          text: Good evening to you.
        - id: ch01-b04
          speaker: father
          text: Good evening.
        - id: ch01-b05
          speaker: white_bear
          text: Will you give me your youngest daughter? If you do, I will make you as rich as you are poor now.
        - id: ch01-b06
          speaker: narrator
          text: The farmer would gladly have been rich, but he knew the choice was not his alone. He went back into the cottage and told everyone that a great white bear stood outside. The bear had faithfully promised to make the whole family rich if he could take the youngest daughter away with him.
        - id: ch01-b07
          speaker: youngest_daughter
          text: No. I will not go with him.
        - id: ch01-b08
          speaker: narrator
          text: The farmer returned to the bear and arranged for him to come back the next Thursday evening to hear her answer. All week, the father tried to change his daughter's mind. He spoke again and again about the wealth the family would have and insisted that going might be good for her as well. At last she decided to accept. She washed her ragged clothes, mended every tear, and made herself as neat as she could. Then she prepared to leave, though she owned very little that she could carry away.
        - id: ch01-b09
          speaker: narrator
          text: The next Thursday evening, the White Bear came for her. She climbed onto his back with her bundle, and they set out. After they had traveled a great distance, he spoke.
        - id: ch01-b10
          speaker: white_bear
          text: Are you afraid?
        - id: ch01-b11
          speaker: youngest_daughter
          text: No, I am not.
        - id: ch01-b12
          speaker: white_bear
          text: Hold tightly to my fur. Then you will be safe.
        - id: ch01-b13
          speaker: narrator
          text: She rode far, far away until they reached a great mountain. The bear knocked against the rock, and a door opened before them. They passed through it into a castle. Room after room shone with brilliant light, gold, and silver. Beyond them was a great hall, where a magnificent feast covered a long table. Its splendor was almost impossible to describe.
        - id: ch01-b14
          speaker: narrator
          text: The bear gave her a silver bell and told her how to use it. Whenever she needed anything, she only had to ring, and whatever she wanted would appear. After she had eaten, night drew near. The long journey had made her sleepy, and she wished for a bed. She had scarcely touched the bell when she found herself in a beautiful chamber. A ready-made bed stood there with silk pillows and silk curtains edged in golden fringe. Everything else in the room was made of gold or silver.
        - id: ch01-b15
          speaker: narrator
          text: She lay down and put out the light. Then a man entered and rested beside her. He was the White Bear, who shed his animal shape at night. Yet she never saw him. He always came after the light was gone and left before dawn.
        - id: ch01-b16
          speaker: narrator
          text: For a time, all went well, and the girl was happy. Then sadness settled over her. She had to wander through the mountain castle alone all day, with no one beside her. She longed for her father and mother, and for all her brothers and sisters at home. When the White Bear asked what she wanted, she told him the castle felt empty and dull to her. She missed the crowded family house, and being unable to visit them was the cause of all her sorrow.
        - id: ch01-b17
          speaker: white_bear
          text: That can be helped, if you make me one promise. Never speak with your mother alone. Talk to her only while the others are there. She will take your hand and try to lead you into a room by yourselves. You must not go, or you will bring terrible sorrow upon us both.
        - id: ch01-b18
          speaker: narrator
          text: One Sunday, the bear came to take her home. She rode on his back through a long, long journey. At last they reached a large white farmhouse. Her brothers and sisters were playing outside, and the sight of it was beautiful.
        - id: ch01-b19
          speaker: white_bear
          text: Your parents live here now. Remember my warning. If you forget, you will do great harm to both of us.
        - id: ch01-b20
          speaker: youngest_daughter
          text: I will not forget it.
        - id: ch01-b21
          speaker: narrator
          text: As soon as she stepped down, the bear turned and went away. Her family rejoiced so much that their welcome seemed endless. They thanked her for everything she had done. Now they had all they needed, and nothing could have been better.
        - id: ch01-b22
          speaker: narrator
          text: They asked about her life in the mountain. She said she was well and had everything she wanted, but she told them very little more. After the midday meal, her mother tried to take her into a private room. The girl remembered the warning and refused.
        - id: ch01-b23
          speaker: youngest_daughter
          text: Whatever we need to say, we can say another time.
        - id: ch01-b24
          speaker: narrator
          text: Still, her mother pressed her until she gave in. The girl confessed that a man came to her each night after the lights went out and left before morning. She never saw him. She spent her days alone, wishing she could look at him, and the loneliness made her miserable.
        - id: ch01-b25
          speaker: mother
          text: Oh, how dreadful! You may be sleeping beside a troll. I will show you how to see him. Hide this piece of candle against your breast. Light it after he falls asleep, but take care. Do not let any tallow fall on him.
        - id: ch01-b26
          speaker: narrator
          text: The girl took the piece of candle and hid it against her breast. When evening drew near, the White Bear returned to carry her back to the mountain. After they had traveled some distance, he asked whether her mother had tried to speak to her alone, just as he had warned. The girl could not deny it. Everything had happened exactly as he had said.
        - id: ch01-b27
          speaker: white_bear
          text: If you did what your mother wanted, you have brought terrible sorrow upon us both.
        - id: ch01-b28
          speaker: youngest_daughter
          text: No. I have done nothing.
        - id: ch01-b29
          speaker: narrator
          text: Back at the castle, she went to bed, and the night began as every other night had begun. The man came after the room was dark and lay down beside her. Much later, when she could hear from his breathing that he was asleep, she slipped out of bed. She kindled a light, lit the candle hidden against her breast, and held it over him. There lay the handsomest prince that any eyes had ever seen. The sight filled her with such love that she felt she would die if she did not kiss him at once.
        - id: ch01-b30
          speaker: narrator
          text: She bent down and kissed him. As she did, three drops of hot tallow fell upon his shirt. The Prince woke.
        - id: ch01-b31
          speaker: white_bear
          text: What have you done? You have brought misery upon us both. If only you had waited for one full year, the spell would have ended and I would have been free. My stepmother bewitched me. By day I must live as a white bear, and only at night may I take the shape of a man. Now everything between us is over. I must leave you and return to her. She lives in the castle east of the sun and west of the moon, and there I must marry a princess whose nose is three ells long.
        - id: ch01-b32
          speaker: narrator
          text: The girl wept and begged him not to leave, but he had no choice. She asked to go with him, and he told her she could not.
        - id: ch01-b33
          speaker: youngest_daughter
          text: Then tell me the way. I will search for you. Surely I may do that.
        - id: ch01-b34
          speaker: white_bear
          text: You may search, but there is no road to follow. The castle lies east of the sun and west of the moon. You would never find your way there.
    - id: ch02
      title: The Three Golden Gifts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the girl woke the next morning, both the Prince and the castle were gone. She lay on a small green patch in the middle of a dark, thick forest. Beside her was the same bundle of rags she had brought from home.
        - id: ch02-b02
          speaker: narrator
          text: She rubbed the sleep from her eyes and cried until she was weary of crying. Then she picked up her poor bundle and began her search. She walked on through the dark wood, one day after another, and many long days passed beneath her feet. At last she came to a great mountain. An old woman sat outside it, playing with a golden apple. The girl asked whether she knew the road to the Prince who lived with his stepmother in the castle east of the sun and west of the moon, and who was meant to marry a princess with a nose three ells long.
        - id: ch02-b03
          speaker: old_woman_1
          text: How did you learn about him? Perhaps you are the girl who should have had him.
        - id: ch02-b04
          speaker: youngest_daughter
          text: Yes. I am that girl.
        - id: ch02-b05
          speaker: old_woman_1
          text: So it is you. I know nothing about the Prince except that he lives in the castle east of the sun and west of the moon. It will take you a very long time to reach it, if you ever reach it at all. Still, I will lend you my horse. Ride to an old neighbor of mine and ask her, for perhaps she can tell you more. When you arrive, strike the horse below its left ear and tell it to go home. You may take my golden apple with you as well.
        - id: ch02-b06
          speaker: narrator
          text: The girl mounted the horse and rode for a long, long way. At last she reached another great mountain. An old woman sat outside with a golden carding comb. The girl sent the horse home as she had been told. Then she asked the old woman whether she knew the way to the castle east of the sun and west of the moon.
        - id: ch02-b07
          speaker: old_woman_2
          text: I cannot tell you the way. I know only that the castle lies east of the sun and west of the moon. It will take you a long time to reach it, if you ever get there at all. But I will lend you my horse. Ride to the old woman who lives nearest to me, for perhaps she knows where the castle is. When you reach her mountain, strike the horse below its left ear and tell it to go home.
        - id: ch02-b08
          speaker: narrator
          text: The old woman also gave her the golden carding comb, saying she might find a use for it. Then the girl climbed onto the second horse and rode onward. The road was weary and very long. After a great while, she reached a third mountain. There an aged woman sat spinning at a golden spinning wheel. The girl sent the horse home and asked once more where she could find the Prince and the castle east of the sun and west of the moon.
        - id: ch02-b09
          speaker: old_woman_3
          text: Perhaps you are the one who should have had the Prince.
        - id: ch02-b10
          speaker: youngest_daughter
          text: Yes. I should have been the one.
        - id: ch02-b11
          speaker: old_woman_3
          text: I know the road no better than the other women did. I know the castle lies east of the sun and west of the moon, and that reaching it will take a very long time, if you ever reach it at all. But you may borrow my horse. Ride to the East Wind and ask him. Perhaps he knows the way and can blow you there himself. Once you arrive, strike the horse below its left ear, and it will come home again.
        - id: ch02-b12
          speaker: narrator
          text: Then she gave the girl the golden spinning wheel, telling her that someday she might have a use for it. The girl mounted the third horse. She had to ride for a great many days, and the journey was long and weary before she finally reached the home of the East Wind. She struck the horse below its left ear and sent it back to the old woman.
    - id: ch03
      title: The Four Winds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The girl asked the East Wind whether he could lead her to the Prince in the castle east of the sun and west of the moon.
        - id: ch03-b02
          speaker: east_wind
          text: I have heard of the Prince and his castle, but I do not know the way. I have never blown that far. Come with me to my brother, the West Wind. He is much stronger. Climb onto my back, and I will carry you to him.
        - id: ch03-b03
          speaker: narrator
          text: She climbed onto his back, and the East Wind carried her away at tremendous speed. When they reached the West Wind's home, he went in and explained everything. The girl he had brought was the one who should have had the Prince in the castle east of the sun and west of the moon. Now she was wandering through the world to find him again, and they needed to know where that castle stood.
        - id: ch03-b04
          speaker: west_wind
          text: I have never blown as far as that castle. But I can take you to the South Wind. He is stronger than either of us and has traveled far and wide. Perhaps he knows. Sit on my back, and I will carry you there.
        - id: ch03-b05
          speaker: narrator
          text: The girl settled onto the West Wind's back, and he carried her to his brother. They were not very long on the way. At the South Wind's home, the West Wind explained that the traveler was the girl who ought to marry the Prince. She had come to ask how she could reach the castle east of the sun and west of the moon.
        - id: ch03-b06
          speaker: south_wind
          text: So this is the girl! I have wandered through all kinds of places, but I have never blown that far. I will take you to the North Wind. He is our oldest and strongest brother. If he does not know the castle, no one in the world can tell you where it is. Climb onto my back.
        - id: ch03-b07
          speaker: narrator
          text: The girl climbed onto the South Wind's back, and he rushed away in great haste. They were not long on the way. Yet long before they reached his brother's home, icy gusts struck them. The North Wind was so wild and fierce that they felt his cold breath from a great distance. Then his voice roared out to them from far away, and they froze at the sound.
        - id: ch03-b08
          speaker: north_wind
          text: What do you want?
        - id: ch03-b09
          speaker: south_wind
          text: It is I. This girl should have had the Prince who lives east of the sun and west of the moon. She wants to find him again. Have you ever been there, and can you show her the way?
        - id: ch03-b10
          speaker: north_wind
          text: Yes, I know the place. Once I blew an aspen leaf there, and afterward I was too tired to blow for many days. If you truly mean to go, and you are not afraid to travel with me, climb on my back. I will try to blow you there.
        - id: ch03-b11
          speaker: youngest_daughter
          text: I must reach it. If there is any way at all, I will take it. I am not afraid, however fast you go.
        - id: ch03-b12
          speaker: north_wind
          text: Very well. You must sleep here tonight. If we are to reach the castle, we will need the whole day before us.
        - id: ch03-b13
          speaker: narrator
          text: Early the next morning, the North Wind woke her. He drew himself up, puffed himself out, and grew so huge and powerful that the sight of him was frightening. The girl took her place on his back. Then they shot high into the air, flying so hard and fast that it seemed they would never stop until they reached the very end of the world.
        - id: ch03-b14
          speaker: narrator
          text: Far below them, a terrible storm tore across the land. Whole woods went down, and houses fell before it. When they swept out above the sea, ships were wrecked by the hundreds. Still the North Wind raced onward and onward. A long time passed, and then still more time followed it. Yet whenever the girl looked down, nothing but the restless sea lay beneath them.
        - id: ch03-b15
          speaker: narrator
          text: Little by little, the North Wind began to tire. He grew more tired with every mile, until at last he could scarcely blow at all. His flight dropped lower and lower toward the water. He kept sinking until the waves rose high enough to dash against the heels of the girl clinging to his back.
        - id: ch03-b16
          speaker: north_wind
          text: Are you afraid?
        - id: ch03-b17
          speaker: youngest_daughter
          text: I am not afraid.
        - id: ch03-b18
          speaker: narrator
          text: And she spoke the truth. By then, land was not very far away. The North Wind gathered the little strength that remained to him and drove toward the shore. At the last moment, he managed to throw the girl safely onto the land, directly beneath the windows of the castle east of the sun and west of the moon. The journey had left him so weary and worn out that he had to rest there for several days before he could return to his own home.
    - id: ch04
      title: Three Nights at the Castle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the girl sat down beneath the castle walls and began to play with the golden apple. Before long, a window opened high above her. The first person she saw was the maiden with the long nose, the very Princess who was meant to marry the Prince. The Princess stared at the shining apple and called down to ask its price.
        - id: ch04-b02
          speaker: long_nosed_princess
          text: Girl, how much do you want for that golden apple?
        - id: ch04-b03
          speaker: youngest_daughter
          text: You cannot buy it with gold or money.
        - id: ch04-b04
          speaker: long_nosed_princess
          text: Then what will buy it? Name whatever price you like.
        - id: ch04-b05
          speaker: youngest_daughter
          text: Let me go to the Prince and stay with him tonight. Then the apple is yours.
        - id: ch04-b06
          speaker: long_nosed_princess
          text: You may do that.
        - id: ch04-b07
          speaker: narrator
          text: The Princess agreed because she had already decided how to prevent a true meeting. She took the golden apple. Before night came, she secretly gave the Prince a sleeping drink. By the time the girl was allowed into his room, he lay in a sleep so deep that he could hear nothing. She called his name, shook him, and wept between her pleas. She stayed beside him through the night, but nothing she did could wake him. As soon as dawn appeared, the long-nosed Princess came into the chamber and drove her out again.
        - id: ch04-b08
          speaker: narrator
          text: During the day, the girl returned to her place beneath the castle windows. This time she brought out the golden carding comb and began to card with it. The Princess soon noticed the second golden treasure. Just as she had done with the apple, she leaned from the window and demanded to know what the girl wanted in exchange.
        - id: ch04-b09
          speaker: youngest_daughter
          text: It is not for sale for gold or money. Let me spend tonight with the Prince, and you may have it.
        - id: ch04-b10
          speaker: long_nosed_princess
          text: I agree.
        - id: ch04-b11
          speaker: narrator
          text: The Princess took the comb, but once again she made certain the Prince had swallowed a sleeping drink. That night, he was lost in the same heavy sleep. The girl called to him over and over. She shook him, pleaded with him, and wept, but she could not bring any life into him. He slept through every word. When daylight came, the long-nosed Princess entered and once more forced the girl out of the room.
        - id: ch04-b12
          speaker: narrator
          text: When full daylight came, the girl sat under the windows for the third time. She placed the golden spinning wheel before her and began to spin. The long-nosed Princess saw it from above and wanted this treasure just as badly as the others. She opened the window and asked what price the girl would take for the wheel.
        - id: ch04-b13
          speaker: youngest_daughter
          text: Neither gold nor money can buy it. Give me leave to stay with the Prince tonight, and it is yours.
        - id: ch04-b14
          speaker: long_nosed_princess
          text: Yes, I will gladly allow that.
        - id: ch04-b15
          speaker: narrator
          text: Now, there were Christian folk in that strange castle who had been carried there as captives. Some of them lived in the chamber next to the Prince's room. Through the wall, they had heard a woman enter on two nights in a row. They heard her call to the sleeping Prince, heard her weep, and knew she had failed to wake him. At last they found a chance to tell him what had happened.
        - id: ch04-b16
          speaker: captive
          text: A woman has come into your room for two nights. She wept and called to you, but you never woke.
        - id: ch04-b17
          speaker: narrator
          text: That evening, the long-nosed Princess came once more with a sleeping drink. The Prince raised it as though he meant to swallow every drop, but secretly threw it away behind him. The captives' story had made him suspect what the drink truly was. Later, when the girl entered his room for the third time, she found him awake and waiting. At last they recognized one another. She sat beside him and told him how the castle had vanished, how she had crossed the world, and how the North Wind had carried her over the sea.
        - id: ch04-b18
          speaker: white_bear
          text: You have come just in time. Tomorrow I am supposed to marry, but I will not marry the long-nosed Princess. Only you can save me. I will test my bride by asking her to wash the shirt marked by those three drops of tallow. She will agree because she does not know you made the stains.
        - id: ch04-b19
          speaker: white_bear
          text: No troll can wash those marks away. Only someone born among Christian folk can do it. I will vow to marry the woman who cleans the shirt, and I know that woman will be you.
        - id: ch04-b20
          speaker: narrator
          text: There was great joy between the Prince and the girl that night. After the two nights when he had slept through her tears, they could finally speak and plan together. Yet they knew the wedding was supposed to take place the very next day, so their happiness depended on the test of the stained shirt.
    - id: ch05
      title: The Three Drops of Tallow
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day was meant to be the wedding day. Before it could begin, the Prince announced that he wished to see what his bride could do.
        - id: ch05-b02
          speaker: troll_hag
          text: You may certainly test her.
        - id: ch05-b03
          speaker: white_bear
          text: I have a fine shirt that I want to wear for my wedding. Three drops of tallow have stained it, and I have vowed to marry only the woman who can wash them away. Any bride who cannot do that is not worth having.
        - id: ch05-b04
          speaker: narrator
          text: The trolls thought this would be easy and accepted the test. The long-nosed Princess washed and rubbed with all her strength, but the more she worked, the larger the stains became.
        - id: ch05-b05
          speaker: troll_hag
          text: You do not know how to wash at all. Give the shirt to me.
        - id: ch05-b06
          speaker: narrator
          text: Her mother took the shirt, but it only grew worse in her hands. The harder she washed and rubbed, the larger and darker the spots became. Then the other trolls tried. With every washing, the shirt turned blacker and uglier, until it looked as if it had been dragged through a chimney.
        - id: ch05-b07
          speaker: white_bear
          text: Not one of you is any good at this! A beggar girl is sitting outside the window. I am sure she can wash better than all of you. Come inside, girl!
        - id: ch05-b08
          speaker: narrator
          text: The girl entered, and the Prince held out the ruined shirt.
        - id: ch05-b09
          speaker: white_bear
          text: Can you wash this shirt clean?
        - id: ch05-b10
          speaker: youngest_daughter
          text: I do not know, but I will try.
        - id: ch05-b11
          speaker: narrator
          text: The moment she dipped the shirt into the water, it became as white as driven snow, and whiter still.
        - id: ch05-b12
          speaker: white_bear
          text: You are the one I will marry.
        - id: ch05-b13
          speaker: narrator
          text: The old troll-hag flew into such a rage that she burst. The long-nosed Princess and all the little trolls must have burst as well, for no one ever heard of them again.
        - id: ch05-b14
          speaker: narrator
          text: The Prince and his true bride freed every Christian captive in the castle. They gathered all the gold and silver they could carry and traveled far away from the castle east of the sun and west of the moon.
