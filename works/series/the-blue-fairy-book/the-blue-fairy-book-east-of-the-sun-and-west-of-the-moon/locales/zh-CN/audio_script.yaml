audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    husbandman:
      display_name: 庄稼汉
      tts: {delivery: 朴实而谨慎, timbre: 粗粝温厚, pace: 中等, pitch: 中低音}
    white_bear_prince:
      display_name: 白熊王子
      tts: {delivery: 温和克制而坚定, timbre: 年轻醇厚, pace: 舒缓, pitch: 中低音}
    youngest_daughter:
      display_name: 小女儿
      tts: {delivery: 真挚勇敢而坚韧, timbre: 年轻清亮, pace: 中等有变化, pitch: 中高音}
    mother:
      display_name: 母亲
      tts: {delivery: 关切而容易惊慌, timbre: 成熟温暖, pace: 稍快, pitch: 中音}
    first_old_woman:
      display_name: 第一位老婆婆
      tts: {delivery: 慈祥而爽直, timbre: 苍老柔和, pace: 舒缓, pitch: 中音}
    second_old_woman:
      display_name: 第二位老婆婆
      tts: {delivery: 平和而热心, timbre: 苍老清亮, pace: 舒缓, pitch: 中高音}
    third_old_woman:
      display_name: 第三位老婆婆
      tts: {delivery: 沉着而善意, timbre: 苍老厚实, pace: 稍慢, pitch: 中低音}
    east_wind:
      display_name: 东风
      tts: {delivery: 轻快而坦率, timbre: 清朗飘逸, pace: 稍快, pitch: 中高音}
    west_wind:
      display_name: 西风
      tts: {delivery: 爽朗而有力, timbre: 开阔浑厚, pace: 中等, pitch: 中音}
    south_wind:
      display_name: 南风
      tts: {delivery: 热情而笃定, timbre: 温暖洪亮, pace: 中等, pitch: 中低音}
    north_wind:
      display_name: 北风
      tts: {delivery: 粗犷威严而可靠, timbre: 低沉如风啸, pace: 稍慢有爆发力, pitch: 低音}
    long_nosed_princess:
      display_name: 长鼻子公主
      tts: {delivery: 骄横而精明, timbre: 尖细冷淡, pace: 中等, pitch: 高音}
    troll_stepmother:
      display_name: 老山怪婆
      tts: {delivery: 傲慢暴躁, timbre: 沙哑沉重, pace: 稍快, pitch: 低音}
  chapters:
    - id: ch01
      title: 白熊来叩门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷庄稼汉，家里的孩子很多，吃的穿的却少得可怜。孩子们个个好看，最小的女儿更是美得无与伦比。
        - id: ch01-b02
          speaker: narrator
          text: 一个秋天的星期四深夜，外面漆黑一片。暴雨哗哗地下，狂风刮得小屋四壁发颤。一家人围在火边，各忙各的。忽然，窗玻璃响了三下。庄稼汉开门一看，门外竟站着一头大得惊人的白熊。
        - id: ch01-b03
          speaker: white_bear_prince
          text: 晚上好。
        - id: ch01-b04
          speaker: husbandman
          text: 晚上好。
        - id: ch01-b05
          speaker: white_bear_prince
          text: 你愿意把小女儿交给我吗？你若答应，我就让你们有多穷，往后便有多富。
        - id: ch01-b06
          speaker: narrator
          text: 庄稼汉当然想过富裕日子，心里却明白，这件事不能不先问女儿。他回到火炉旁，告诉全家，门外站着一头大白熊。白熊郑重答应，只要能带走小女儿，就会让他们从眼下的穷困里翻过身来，往后全家都过上富裕日子。
        - id: ch01-b07
          speaker: narrator
          text: 姑娘听了，马上说不，连谈也不肯谈。庄稼汉只好走回门外，同白熊约好下个星期四晚上再来听答复。接下来几天，他一遍遍劝女儿，描绘全家将得到的财富，还说这桩事对她自己也有好处。姑娘最后才拿定主意，答应跟白熊走。她洗净身上的破衣裳，一处处补好，把自己收拾得尽量体面，又拾起那点少得可怜的行李，随时准备出发。
        - id: ch01-b08
          speaker: narrator
          text: 下个星期四晚上，白熊准时来接她。姑娘抱着包袱坐到熊背上，他们走了很远，白熊才开口问她。
        - id: ch01-b09
          speaker: white_bear_prince
          text: 你怕不怕？
        - id: ch01-b10
          speaker: youngest_daughter
          text: 不，我不怕。
        - id: ch01-b11
          speaker: white_bear_prince
          text: 那就抓紧我的毛。只要抓牢，你就不会遇到危险。
        - id: ch01-b12
          speaker: narrator
          text: 白熊驮着姑娘，越走越远，最后停在一座大山前。他朝山壁敲了敲，一扇门便打开，他们一起走了进去。山腹里藏着一座城堡。一个又一个房间灯火灿烂，金银四处闪光。宽阔的大厅里还有一张长桌，上面摆满丰盛的食物。那地方究竟有多么富丽堂皇，真叫人说也说不明白。
        - id: ch01-b13
          speaker: narrator
          text: 白熊给了姑娘一只银铃，告诉她，不管缺什么，只要摇一摇，想要的东西自然会出现。姑娘吃过饭，天色也晚了。长途跋涉的疲倦涌上来，她便摇铃想要一张床。手才碰到铃铛，她已经站在一间卧房里。床铺早就铺好了，丝绸枕头柔软漂亮，镶着金边的丝帐垂在四周，屋里的每一件东西也都是金银制成的。
        - id: ch01-b14
          speaker: narrator
          text: 姑娘上床吹灭灯，黑暗中却有一个男人走进房间，安静地躺在她身边。原来，白熊每到夜里就会脱去野兽的外形，重新变成人。姑娘却始终不知道这个秘密。他总等到灯火熄灭才出现，又赶在第一线天光到来前离去，所以她从没看见过他的脸。

    - id: ch02
      title: 三滴烛油
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 起初，一切都很顺遂，他们过得安稳又快乐。时间一久，姑娘却越来越伤心。每到白天，她只能独自在山中的城堡里来来去去，没有一个人陪伴。她思念父母，也想回家看看那些兄弟姐妹。白熊发现她愁眉不展，问她究竟想要什么，她便把山中的冷清和心里的思念全说了出来。
        - id: ch02-b02
          speaker: white_bear_prince
          text: 这件事有办法。只是你必须答应我，不能单独和母亲说话。她一定会握住你的手，想领你进房谈悄悄话。千万别跟她去。只要去了，你和我都会遭殃。
        - id: ch02-b03
          speaker: narrator
          text: 一个星期天，白熊来接姑娘去探望父母。她骑在白熊背上，走了很久，终于来到一座宽敞的白色农舍。她的兄弟姐妹在屋外追逐玩耍，眼前的景象美得让人欢喜。
        - id: ch02-b04
          speaker: white_bear_prince
          text: 你父母现在住在这里。记住我的叮嘱。忘了它，你会害了自己，也会害了我。
        - id: ch02-b05
          speaker: youngest_daughter
          text: 我记得，绝不会忘。
        - id: ch02-b06
          speaker: narrator
          text: 姑娘进了家门，白熊便转身踏上归途。全家人见到她，欢喜得仿佛永远也庆贺不完。他们觉得，无论怎样感谢她为这个家所做的一切都不够。如今家中想要什么就有什么，样样都好得不能再好。大家围着她，追问山中的生活。她只说自己也过得很好，想要的东西全都有。至于她还说了什么，谁也讲不清，反正家人并没有从她口中问出多少秘密。
        - id: ch02-b07
          speaker: narrator
          text: 午饭过后，到了下午，白熊预言的事果然来了。母亲拉住女儿，想带她回自己的房间单独谈。姑娘记得警告，坚决不肯去，只说有话随时都能当着大家讲。可母亲想尽办法，一再劝说，到底还是让她让了步。姑娘只得坦白，每晚灯火熄灭以后，都会有一个男人来睡在她身边，可天还没亮，他就离开了。她从来看不清他的模样，越想见他，心里便越难过。白天她又总是独自一人，实在冷清寂寞。
        - id: ch02-b08
          speaker: mother
          text: 太可怕了！睡在你身边的，说不定是个山怪。我教你看清他。带一小截蜡烛回去，藏在胸前。等他睡熟，你就点灯照他。可千万小心，别让烛油滴到他身上。
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: 姑娘把蜡烛藏好。傍晚，白熊来接她。半路上，他问家里发生的事是否和自己预先说的一模一样。姑娘只能承认是这样。
        - id: ch02-b10
          speaker: white_bear_prince
          text: 那么，你若照母亲的意思做了，我们两个人就都要遭殃。
        - id: ch02-b11
          speaker: youngest_daughter
          text: 没有，我什么也没做。
        - id: ch02-b12
          speaker: narrator
          text: 回到城堡以后，一切看起来同往常一样。姑娘上床熄灯，那个男人仍在黑暗中走来，躺到她身边。一直等到深夜，听见他的呼吸变得深沉，姑娘才悄悄起身，点亮藏在胸前的蜡烛。烛光落到那张脸上，她看见的竟是世上最英俊的王子。爱意一下淹没了她。那一刻，她觉得自己若不能马上亲吻他，简直就会死去。
        - id: ch02-b13
          speaker: narrator
          text: 姑娘俯身亲吻王子。就在这时，三滴滚烫的烛油落到了他的衬衫上。王子猛地醒来。
        - id: ch02-b14
          speaker: white_bear_prince
          text: 你做了什么呀？这下，我们都被你害苦了。你只要再坚持一年，我就能自由。我的继母施了魔法，让我白天做白熊，夜里才恢复人形。可现在，你我之间的一切都结束了。我必须回到她那里，去太阳以东、月亮以西的城堡，还得娶那位鼻子有三厄尔长的公主。
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: 姑娘哭着挽留，可王子非走不可。她问能否跟他同去，也被拒绝了。
        - id: ch02-b16
          speaker: youngest_daughter
          text: 那就告诉我路怎么走吧。我一定去找你。至少这件事，你总该准许我。
        - id: ch02-b17
          speaker: white_bear_prince
          text: 你可以来找我，可那里根本没有路。城堡在太阳以东、月亮以西，你永远找不到它。
        - id: ch02-b18
          speaker: narrator
          text: 清晨醒来，姑娘发现王子不见了，城堡也消失得无影无踪。她躺在幽暗茂密的森林中央，身下只有一小块绿地。身旁放着当初离家时带来的破布包袱，里面还是那几件寒酸的东西。她揉去眼里的睡意，望着四周哭了又哭，直到再也哭不动，才拿起包袱，独自踏上寻找王子的路。

    - id: ch03
      title: 三位老婆婆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘走了一天又一天，一连走过许多个漫长的日子。最后，她来到一座大山前。山外坐着一个老婆婆，手中把玩着一只闪闪发亮的金苹果。姑娘上前问她，是否知道那位王子的去处。她说，王子同继母住在太阳以东、月亮以西的城堡里，眼看就要迎娶一位鼻子足有三厄尔长的公主。
        - id: ch03-b02
          speaker: first_old_woman
          text: 你怎么会知道王子的事？难道你才是原本应该嫁给他的人？
        - id: ch03-b03
          speaker: youngest_daughter
          text: 是的，就是我。
        - id: ch03-b04
          speaker: first_old_woman
          text: 原来是你。我只知道他住在太阳以东、月亮以西。你要走上很久才可能到那里，也许永远到不了。我把马借给你，你骑去找我的老邻居，她说不定知道。到了那里，在马的左耳下面拍一下，叫它回家。还有，这只金苹果也送给你。
        - id: ch03-b05
          speaker: narrator
          text: 姑娘骑上借来的马，赶了很长很长一段路，终于来到另一座大山前。她按照约定让第一匹马回了家。第二位老婆婆就坐在山外，手里拿着一把梳羊毛的金梳。姑娘走上前，把王子和长鼻子公主的事说了一遍，又问起那座太阳以东、月亮以西的城堡。
        - id: ch03-b06
          speaker: second_old_woman
          text: 我也只知道城堡在太阳以东、月亮以西。要到那里，得走很久很久，而且未必真能找到。我把马借给你，你去见离我最近的老婆婆吧。也许她知道。到了以后，拍一下马的左耳下面，让它回来。这把金梳你也带走，或许能派上用场。
        - id: ch03-b07
          speaker: narrator
          text: 姑娘坐上第二匹马，再次启程。这一回，路途更长，也更叫人疲惫。过了很久很久，她才来到第三座大山。让马回去以后，她看见第三位老婆婆坐在山外，正用一架金纺车纺线。姑娘向她打听王子，也打听那座无路可通、只知道在太阳以东和月亮以西的城堡。
        - id: ch03-b08
          speaker: third_old_woman
          text: 你就是那位原该嫁给王子的姑娘吧？
        - id: ch03-b09
          speaker: youngest_daughter
          text: 是的，应该嫁给他的人正是我。
        - id: ch03-b10
          speaker: narrator
          text: 第三位老婆婆同样不认识路，只知道城堡所在的方向。
        - id: ch03-b11
          speaker: third_old_woman
          text: 那地方远得很，你也许永远到不了。不过，我的马可以借给你。骑着它去问东风吧。也许东风知道城堡在哪里，还能把你吹过去。见到他以后，拍一下马的左耳下面，它自然会回家。这架金纺车你拿着，说不定也有用。
        - id: ch03-b12
          speaker: narrator
          text: 姑娘又骑了许多天。一路既漫长又辛苦，仿佛永远也走不到尽头，但她始终没有回头。最后，她总算来到东风的住处，拍了拍马的左耳下面，让第三匹马回家。随后，她向东风问路，想知道他能不能带自己去找那位住在太阳以东、月亮以西的王子。

    - id: ch04
      title: 四方风的旅程
      blocks:
        - id: ch04-b01
          speaker: east_wind
          text: 我听说过王子，也听说过那座城堡，可我从没吹到那么远，不认识路。你若愿意，我带你去找哥哥西风。他比我强，也许知道。坐到我背上来吧。
        - id: ch04-b02
          speaker: narrator
          text: 姑娘骑上东风的背，他们一下冲了出去，飞得快极了。到了西风家，东风走进去，把她的来历从头说清。这正是原该嫁给太阳以东、月亮以西那座城堡里的王子的姑娘。如今她走过漫长的路，四处寻找，只盼再次见到王子，所以东风特意把她带来，请哥哥帮忙指点方向。
        - id: ch04-b03
          speaker: west_wind
          text: 那么远的地方，我也没有吹到过。不过，我可以送你去找南风。他比我们两个都强，也去过更多地方，或许知道答案。坐上来，我带你去。
        - id: ch04-b04
          speaker: narrator
          text: 姑娘坐上西风宽阔的背，再次飞向远方。这一段路并没有花去多少时间，他们很快便来到南风家。西风把一路听来的事情告诉南风，又说明这姑娘本该嫁给太阳以东、月亮以西那座城堡里的王子。她一路吃尽辛苦，正是为了找到前往那座城堡的路。
        - id: ch04-b05
          speaker: south_wind
          text: 原来就是她呀。我四处游荡了这么多年，去过各种地方，却也没吹到那么远。来吧，我送你去找哥哥北风。他年纪最大，力量也最强。若连他都不知道，全世界便没人能替你指路了。
        - id: ch04-b06
          speaker: narrator
          text: 南风驮起姑娘，急匆匆地出发。他们还没到北风家，远处扑来的寒风已经冻得人直打战。北风狂暴地咆哮起来，声音隔着老远便传了过来。
        - id: ch04-b07
          speaker: north_wind
          text: 你们来干什么？
        - id: ch04-b08
          speaker: south_wind
          text: 是我。这个姑娘原该嫁给太阳以东、月亮以西那座城堡里的王子。她想知道你去没去过那里，也想请你指路，好让她重新找到王子。
        - id: ch04-b09
          speaker: north_wind
          text: 我知道那地方。有一次，我把一片白杨叶吹了过去，回来以后累得好几天都吹不出风。你若当真想去，也不怕跟我同行，就坐到我背上。我试试能不能把你吹到那里。
        - id: ch04-b10
          speaker: youngest_daughter
          text: 我非去不可。只要有一丁点办法，我都会去。不管你飞得多快，我都不害怕。
        - id: ch04-b11
          speaker: north_wind
          text: 那就今晚住下。我们得用上一整个白天，才有可能赶到。
        - id: ch04-b12
          speaker: narrator
          text: 第二天一早，北风叫醒姑娘。他深深吸气，把自己鼓得无比高大，浑身的力量强得叫人看了害怕。他驮着姑娘直冲高空，仿佛这一飞便不会停下，非要抵达世界尽头不可。地面上顿时卷起可怕的风暴，大片树林被吹倒，一座座房屋也塌了。等他们飞到海上，船只更是成百上千地遇难。
        - id: ch04-b13
          speaker: narrator
          text: 他们在茫茫大海上飞了很久，接着又飞了更久，眼前始终看不见陆地。北风起先还呼啸着向前，后来一点点耗尽了力气。他越来越累，身子也越沉越低。到最后，他几乎再也吹不动了，海浪一下下追上来，已经打湿了可怜姑娘的脚后跟。
        - id: ch04-b14
          speaker: north_wind
          text: 你害怕了吗？
        - id: ch04-b15
          speaker: youngest_daughter
          text: 我不怕。
        - id: ch04-b16
          speaker: narrator
          text: 她说的是实话。幸好岸已经不远。北风拼尽最后一点力气，把姑娘抛到陆地上。她正好落在那座城堡的窗下。北风却累得再也走不动，只能休息好几天，才返回自己的家。

    - id: ch05
      title: 城堡窗下的三个夜晚
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天早晨，姑娘来到城堡高墙下面坐好，拿出第一位老婆婆送的金苹果，让它在手中闪闪发光。城堡里第一个发现她的，正是准备嫁给王子的长鼻子公主。公主一眼看中了金苹果，立刻推开上方的窗户。
        - id: ch05-b02
          speaker: long_nosed_princess
          text: 姑娘，你的金苹果卖多少钱？
        - id: ch05-b03
          speaker: youngest_daughter
          text: 多少金银都不卖。
        - id: ch05-b04
          speaker: long_nosed_princess
          text: 既然金银不行，那你想换什么？尽管开口。
        - id: ch05-b05
          speaker: youngest_daughter
          text: 让我今晚进城堡见王子，陪他过一夜，金苹果便归你。
        - id: ch05-b06
          speaker: long_nosed_princess
          text: 可以。
        - id: ch05-b07
          speaker: narrator
          text: 长鼻子公主心中早有打算。她拿走金苹果，又暗中给王子喝了催眠的药水。夜里，姑娘终于走进王子的房间，却发现他已经睡熟。她一遍遍叫他的名字，用手摇晃他，叫一会儿又哭一会儿，苦苦求他睁开眼睛。可王子始终没有一点反应。清晨天才刚亮，长鼻子公主就闯进房间，把她赶了出去。
        - id: ch05-b08
          speaker: narrator
          text: 白天，姑娘又坐到城堡窗下，用那把金梳细细梳理羊毛。长鼻子公主看见了，也想把这件宝物拿到手。姑娘仍然不肯收金银，只求再去王子房里陪他一夜。交易又做成了。可等她走进房间，王子依旧睡得毫无知觉。她不停呼唤，不停摇晃，眼泪流了一夜，还是不能给他唤回一丝清醒。天光刚刚出现，公主又来把她赶了出去。
        - id: ch05-b09
          speaker: narrator
          text: 第三天，姑娘拿出金纺车，在城堡窗下纺线。长鼻子公主果然又推开了窗。
        - id: ch05-b10
          speaker: long_nosed_princess
          text: 这架金纺车，你要什么才肯换？
        - id: ch05-b11
          speaker: youngest_daughter
          text: 金银还是不卖。只要让我今晚去见王子，陪他过一夜，纺车就是你的。
        - id: ch05-b12
          speaker: long_nosed_princess
          text: 好啊，我很乐意。
        - id: ch05-b13
          speaker: narrator
          text: 城堡里还囚禁着一些被掳来的基督徒。他们住在王子隔壁，连续两个晚上，都听见一个女人在房中哭泣，一声又一声地呼唤王子。白天，他们把这件怪事告诉了他。到了第三天傍晚，长鼻子公主果然又端来一杯催眠药水。王子已经明白前两夜发生了什么，便假装把药喝下，趁公主不注意，全倒在了自己身后。
        - id: ch05-b14
          speaker: narrator
          text: 这一次，姑娘走进房间时，王子终于睁着眼睛。两人总算真正见到了彼此。姑娘坐到他身边，把从森林中醒来以后发生的一切都讲了出来。她说起三个老婆婆，说起三件金器，也说起四方的风和那场险些坠进大海的漫长飞行。
        - id: ch05-b15
          speaker: white_bear_prince
          text: 你来得正好。明天本该是我的婚礼，可我不愿娶长鼻子公主，只有你能救我。我会让她洗那件沾了三滴烛油的衬衫。她不知道烛油是你滴下的，一定会答应。可只有生在基督徒家里的人才能把它洗净，一窝山怪生的家伙绝对洗不掉。到时我就宣布，谁能洗净衬衫，我便娶谁。我知道你一定能做到。
        - id: ch05-b16
          speaker: narrator
          text: 那一夜，他们心中满是重逢的喜悦。第二天，婚礼就要举行了，王子却先提出，要看看新娘究竟有多大本事。
        - id: ch05-b17
          speaker: troll_stepmother
          text: 当然可以。

    - id: ch06
      title: 白得胜过新雪的衬衫
      blocks:
        - id: ch06-b01
          speaker: white_bear_prince
          text: 我有一件上好的衬衫，原想在婚礼上穿，可衣服沾了三滴烛油。我发过誓，只娶能把它洗净的女人。若连这件事也办不到，她就不配做我的妻子。
        - id: ch06-b02
          speaker: narrator
          text: 山怪们听完，全都觉得这不过是一件再小不过的事，马上答应下来。长鼻子公主第一个动手。她把衬衫浸进水里，使出浑身解数，又洗又搓。可她越是卖力，那三处烛油留下的污迹反而越铺越开，变得越来越大。
        - id: ch06-b03
          speaker: troll_stepmother
          text: 哎呀，你哪里会洗衣服！拿来，让我洗。
        - id: ch06-b04
          speaker: narrator
          text: 衬衫交到老山怪婆手中，很快变得更加糟糕。她搓得越用力，污迹就越大、越黑。其他山怪也轮番来洗，结果衣服越来越黑，越来越难看，最后简直像从烟囱里掏出来的。
        - id: ch06-b05
          speaker: white_bear_prince
          text: 你们没有一个中用！窗外坐着一个讨饭姑娘，我敢说，她都比你们洗得干净。外面的姑娘，进来吧！
        - id: ch06-b06
          speaker: narrator
          text: 姑娘走进来。王子把衬衫递到她面前。
        - id: ch06-b07
          speaker: white_bear_prince
          text: 你能洗净这件衬衫吗？
        - id: ch06-b08
          speaker: youngest_daughter
          text: 我不知道，不过我愿意试一试。
        - id: ch06-b09
          speaker: narrator
          text: 姑娘拿起衬衫，只往水里一浸，衣服立刻白得像刚落下的新雪，甚至比雪还要洁白。
        - id: ch06-b10
          speaker: white_bear_prince
          text: 我要娶你。
          emotion: happy
        - id: ch06-b11
          speaker: narrator
          text: 老山怪婆一看，顿时气得当场爆裂。长鼻子公主和城堡里所有的小山怪想必也都爆裂了，因为从那一天起，世上再没有谁听过他们的消息。王子和真正的新娘打开牢门，放出了所有被囚禁在城堡里的基督徒。他们带上能够拿走的金银，一起远远离开了那座太阳以东、月亮以西的城堡。
