  chapters:
    - id: ch01
      title: The Giant of St. Michael's Mount
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the days of the famous King Arthur, a bold lad named Jack lived in Cornwall. He loved tales of conjurers, fairies, and giants, and listened eagerly whenever anyone spoke of the knights of the Round Table.
        - id: ch01-b02
          speaker: narrator
          text: Out on St. Michael's Mount lived a savage giant called Cormoran. He stood eighteen feet high and measured nine feet around. His fierce face terrified everyone who saw him. From his gloomy cave on the mountaintop, he would wade to the mainland in search of prey. Then he would carry away half a dozen oxen on his back, with three times as many sheep and hogs tied around his waist. With that load, he would march all the way back to his cave.
        - id: ch01-b03
          speaker: narrator
          text: This had gone on for years when Jack decided to destroy him. One winter evening, he took a horn, a shovel, a pickaxe, his armor, and a dark lantern to the mount. He dug a pit twenty-two feet deep and twenty feet wide, then covered it until the ground looked solid.
        - id: ch01-b04
          speaker: narrator
          text: Jack blew his horn with all his strength. The blast woke Cormoran, who stormed out of his cave.
        - id: ch01-b05
          speaker: cormoran
          text: You insolent little villain! You will pay for that. I will broil you for my breakfast!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: With his very next step, the giant plunged headfirst into the hidden pit. Jack struck him on the head with the pickaxe and killed him. Then he hurried home to cheer his friends with the news.
    - id: ch02
      title: Blunderbore's Enchanted Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Another giant, named Blunderbore, swore that he would take revenge if Jack ever fell into his hands. Blunderbore kept an enchanted castle deep in a lonely wood. Some time after Cormoran's death, Jack passed through that wood. He was tired, so he sat down and fell asleep.
        - id: ch02-b02
          speaker: narrator
          text: Blunderbore found him there and carried him to the castle. He locked Jack inside a great room whose floor was covered with the bodies, skulls, and bones of men and women. Then the giant went to fetch his brother, who was also a giant, so they could make a meal of Jack. Through the prison bars, Jack watched the two of them coming and was terrified.
        - id: ch02-b03
          speaker: narrator
          text: Then he noticed a strong cord in one corner and found his courage again. He made a slipknot at each end, threw the knots over the giants' heads, and fastened the cord to the window bars. He pulled until both giants were choking. When their faces had turned black, Jack slid down the rope and stabbed each one through the heart.
        - id: ch02-b04
          speaker: narrator
          text: Jack took a heavy bunch of keys from Blunderbore's pocket and searched the castle. In one room, he found three ladies tied up by their hair and nearly starved to death. They told him what the giants had done.
        - id: ch02-b05
          speaker: lady_one
          text: The giants murdered our husbands. Then they ordered us to eat their flesh. When we refused, they left us here to starve.
          emotion: sad
        - id: ch02-b06
          speaker: jack
          text: Ladies, I have ended the monster and his wicked brother. This castle and all its riches are yours. I hope they can make some small amends for the terrible suffering you have endured.
        - id: ch02-b07
          speaker: narrator
          text: Jack politely handed them the castle keys and continued on his way toward Wales.
    - id: ch03
      title: The Welsh Giant's Tricks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jack had very little money, so he traveled as quickly as he could. At last, he reached a handsome house and knocked. A Welsh giant opened the door. Jack said that he was a traveler who had lost his way. The giant welcomed him and showed him to a room with a good bed.
        - id: ch03-b02
          speaker: narrator
          text: Jack undressed at once, but he was too uneasy to sleep. Before long, he heard the giant pacing in the next room and muttering to himself.
        - id: ch03-b03
          speaker: welsh_giant
          text: You may sleep beneath my roof tonight, but you will never see the morning. My club will smash your head before the sun comes up.
        - id: ch03-b04
          speaker: jack
          text: So that is how you treat travelers? We shall see whether you are as clever as you think.
        - id: ch03-b05
          speaker: narrator
          text: Jack climbed out of bed and felt around the dark room until he found a thick log. He laid it beneath the covers in his place, then hid in a shadowy corner. At midnight, the giant came in and battered the bed again and again with his club. Believing he had broken every bone in Jack's body, he returned to his own room.
        - id: ch03-b06
          speaker: narrator
          text: Early the next morning, Jack walked boldly into the giant's room and thanked him for the night's lodging. The giant jumped at the sight of him and stammered.
        - id: ch03-b07
          speaker: welsh_giant
          text: Oh! Is that really you? How did you sleep? Did you hear or see anything in the middle of the night?
          emotion: surprised
        - id: ch03-b08
          speaker: jack
          text: Nothing worth mentioning. I think a rat slapped me three or four times with its tail. It disturbed me for a moment, but I soon fell asleep again.
        - id: ch03-b09
          speaker: narrator
          text: The giant could not understand it, but he said nothing. Instead, he brought two enormous bowls of hasty pudding for breakfast. Jack wanted him to believe they could eat equal amounts. He buttoned a leather bag beneath his coat and secretly spooned the pudding into it while pretending to eat.
        - id: ch03-b10
          speaker: jack
          text: Now let me show you a marvelous trick. I can heal any wound with a touch. I could cut off my own head and put it safely back a minute later. Watch this.
        - id: ch03-b11
          speaker: narrator
          text: Jack took a knife and slit open the hidden bag. All the hasty pudding spilled across the floor.
        - id: ch03-b12
          speaker: welsh_giant
          text: By my nails, I can do that myself!
        - id: ch03-b13
          speaker: narrator
          text: The giant could not bear to be outdone by someone so small. He snatched up the knife, plunged it into his own stomach, and fell dead at once.
    - id: ch04
      title: The Giants in the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After so many successes, Jack resolved that he would never sit idle. He equipped himself with a horse, a cap of knowledge, a sword of sharpness, shoes of swiftness, and an invisible coat. With these wonders, he was ready for the adventures ahead.
        - id: ch04-b02
          speaker: narrator
          text: Jack crossed high hills. On the third day, he reached a vast forest that lay across his road. He had barely entered it when he saw a monstrous giant dragging a handsome knight and his lady by their hair. Jack dismounted, tied his horse to an oak, and drew the sword of sharpness beneath his invisible coat.
        - id: ch04-b03
          speaker: narrator
          text: He struck at the giant several times. The giant was so tall that Jack could not reach his body, but he cut deep wounds in both thighs. At last, Jack gripped his sword with both hands, swung with all his might, and cut off both the giant's legs. He set one foot on the fallen monster's neck and drove the sword into his body. The giant groaned and died.
        - id: ch04-b04
          speaker: narrator
          text: The knight and his lady thanked Jack for saving them and invited him home to receive a proper reward.
        - id: ch04-b05
          speaker: knight
          text: Come home with us, brave Jack. You have saved our lives, and we want to reward you as you deserve.
        - id: ch04-b06
          speaker: jack
          text: No. I cannot rest until I have found this monster's home.
        - id: ch04-b07
          speaker: narrator
          text: The knight told him the way. Jack mounted his horse and soon saw another giant sitting on a block of timber, waiting for his brother to return. Jack dismounted once more, put on the invisible coat, and crept close. He aimed at the giant's head, but his stroke missed and sliced off only the giant's nose.
        - id: ch04-b08
          speaker: narrator
          text: The furious giant seized his club and swung it wildly in every direction.
        - id: ch04-b09
          speaker: jack
          text: If that is how it must be, I had better finish you now!
        - id: ch04-b10
          speaker: narrator
          text: Jack sprang onto the timber block and stabbed the giant in the back. The giant dropped dead, and Jack went on with his journey.
    - id: ch05
      title: The Castle of Galligantus
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Jack traveled over hills and through valleys until he came to the foot of a high mountain. There he knocked at the door of a lonely house, and an old hermit welcomed him inside. Once Jack was seated, the old man spoke.
        - id: ch05-b02
          speaker: hermit
          text: My son, an enchanted castle stands at the top of this mountain. The giant Galligantus rules it with the help of a wicked magician. They seized a duke's daughter while she was walking in her father's garden. They brought her here and changed her into a deer. I grieve for her fate.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: Jack promised that, even at the risk of his life, he would break the enchantment in the morning. After a sound sleep, he rose early, put on his invisible coat, and prepared for the attempt.
        - id: ch05-b04
          speaker: narrator
          text: At the mountaintop, Jack found two fiery griffins guarding the way. He walked between them without fear because the invisible coat hid him from their sight. A golden trumpet hung on the castle gate. Beneath it were words promising that anyone who could blow the trumpet would bring about the giant's fall.
        - id: ch05-b05
          speaker: narrator
          text: Jack seized the trumpet and blew one piercing blast. The gates flew open, and the whole castle trembled. Galligantus and the conjurer knew their wicked rule was ending. They bit their thumbs and shook with fear.
        - id: ch05-b06
          speaker: narrator
          text: With the sword of sharpness, Jack quickly killed the giant. A whirlwind swept the magician away. At once, every knight and beautiful lady who had been turned into a bird or beast returned to human form. Then the castle vanished like smoke. The head of Galligantus was sent to King Arthur.
    - id: ch06
      title: Jack's Reward
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The rescued knights and ladies spent that night at the hermit's house. The next morning, they all set out for King Arthur's court. Jack went before the King and told him about every fierce battle he had fought.
        - id: ch06-b02
          speaker: narrator
          text: By then, Jack's fame had spread throughout the country. At the King's request, the duke gave Jack his daughter in marriage, and the whole kingdom rejoiced. King Arthur also gave him a great estate.
        - id: ch06-b03
          speaker: narrator
          text: There Jack and his lady lived in joy and contentment for the rest of their days.
