audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    jack:
      display_name: 杰克
      tts: {delivery: 勇敢机敏，面对危险时从容果断, timbre: 清亮年轻, pace: 稍快, pitch: 中音}
    cormoran:
      display_name: 科莫兰
      tts: {delivery: 粗暴凶狠，怒吼时气势逼人, timbre: 低沉粗砺, pace: 偏慢, pitch: 低音}
    welsh_giant:
      display_name: 威尔士巨人
      tts: {delivery: 自负笨拙，惊慌时结结巴巴, timbre: 粗重浑厚, pace: 中等, pitch: 低音}
    hermit:
      display_name: 老隐士
      tts: {delivery: 慈祥郑重，讲述灾祸时满怀忧虑, timbre: 苍老温和, pace: 舒缓, pitch: 中低音}
  chapters:
    - id: ch01
      title: 圣迈克尔山的巨人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 著名的亚瑟王在位时，康沃尔住着一个少年，名叫杰克。他胆量过人，最爱听魔法师、巨人和仙女的故事。只要有人讲起圆桌骑士的英雄事迹，他就会听得入神。
        - id: ch01-b02
          speaker: narrator
          text: 那时，康沃尔外海的圣迈克尔山上住着巨人科莫兰。他有十八英尺高，腰围足有九英尺。那副凶恶残暴的模样，谁见了都害怕。他住在山顶一座阴森的洞穴里，常常从海水中一步步走到大陆寻找猎物。每次回去，他背上扛着六头牛，腰间还捆着三倍数量的绵羊和肥猪，就这样大步走回洞穴。
        - id: ch01-b03
          speaker: narrator
          text: 科莫兰这样横行了许多年，杰克终于决定除掉他。一个冬日傍晚，他带上号角、铁锹、十字镐、盔甲和一盏暗灯，来到山上。他挖出一个二十二英尺深、二十英尺宽的大坑，又把坑口仔细遮盖起来，叫人看不出下面是空的。随后，他用尽力气吹响号角。
        - id: ch01-b04
          speaker: narrator
          text: 科莫兰从睡梦中惊醒，冲出了洞穴。
        - id: ch01-b05
          speaker: cormoran
          text: 你这个无礼的小恶棍！我非叫你付出代价不可！我要把你烤来当早饭！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 科莫兰刚说完，朝前跨了一步，便一头栽进大坑。杰克举起十字镐，对准他的脑袋狠狠一击，当场要了他的命。接着，杰克回到家，把好消息告诉朋友们，大家都欢欣鼓舞。
    - id: ch02
      title: 魔法城堡里的复仇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 另一个巨人名叫布伦德博尔。他听到消息，发誓只要杰克落进自己手里，就一定要替科莫兰报仇。布伦德博尔占着一座魔法城堡，城堡藏在荒僻的树林深处。科莫兰死后不久，杰克恰好走过那片树林。他实在累了，便坐下来睡着了。
        - id: ch02-b02
          speaker: narrator
          text: 布伦德博尔从旁经过，看见杰克，立刻把他带回城堡，锁进一间大屋。屋里的地板上到处都是男女死者的尸身、头骨和枯骨。没过多久，布伦德博尔便去找同样身为巨人的弟弟，要一起回来拿杰克的肉饱餐一顿。杰克隔着牢房铁栏，望见两个巨人渐渐走近，吓得心惊胆战。
        - id: ch02-b03
          speaker: narrator
          text: 屋角恰好有一根结实的绳子。杰克鼓起勇气，在绳子两端各打一个活结，分别套住两个巨人的脑袋，再把绳子系上窗栏，用力拉紧。直到两人透不过气，脸都憋黑了，他才顺着绳子滑下去，刺穿了他们的心脏。
        - id: ch02-b04
          speaker: narrator
          text: 杰克从布伦德博尔的口袋里取出一大串钥匙，又走进城堡，把一间间屋子全都仔细搜过。他在其中一间屋里找到三位夫人。她们被人用头发吊绑着，几乎已经活活饿死。三人的丈夫都被巨人杀了。巨人还逼她们吃丈夫的尸肉，她们宁死不从，便被罚在这里挨饿至死。
        - id: ch02-b05
          speaker: jack
          text: 三位夫人，我已经除掉那个恶魔和他的坏弟弟。这座城堡，还有里面所有财宝，现在都送给你们，多少补偿你们受过的苦难。
        - id: ch02-b06
          speaker: narrator
          text: 杰克彬彬有礼地交出城堡钥匙，继续上路，向威尔士走去。
    - id: ch03
      title: 威尔士巨人的诡计
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 杰克身上没多少钱，只好尽量赶快走。后来，他来到一幢漂亮的房子前。开门的是一个威尔士巨人。杰克说自己是迷路的旅人，巨人便热情地让他进屋，还给他一张舒适的床。
        - id: ch03-b02
          speaker: narrator
          text: 杰克虽然疲惫，却怎么也睡不着。不久，他听见巨人在隔壁来回踱步，还低声念叨起来。
        - id: ch03-b03
          speaker: welsh_giant
          text: 今夜虽让你住我家，明朝太阳你休想见，我要一棒砸碎你的脑瓜。
        - id: ch03-b04
          speaker: jack
          text: 原来你这样对付借宿的旅人。好吧，咱们就看看谁更机灵。
        - id: ch03-b05
          speaker: narrator
          text: 杰克下了床，在黑暗中摸索半天，找到一根又粗又大的木柴。他把木柴放在自己原先躺着的地方，随后躲进屋角。半夜，巨人走进来，举起大棒，对准床上的木柴接连猛打。他以为杰克全身的骨头已经碎了，便回房去了。
        - id: ch03-b06
          speaker: narrator
          text: 一大早，杰克故意装出一副大胆又若无其事的样子，走进巨人的房间，向他道谢留宿。巨人一见他还好端端地活着，顿时吓了一跳，连话也说得结结巴巴。
        - id: ch03-b07
          speaker: welsh_giant
          text: 哎呀，原来是你？昨晚睡得好吗？夜深的时候，你有没有听见或者看见什么？
          emotion: surprised
        - id: ch03-b08
          speaker: jack
          text: 没什么大不了的。大概有只老鼠拿尾巴抽了我三四下，稍稍扰了我的睡意，可我很快又睡着了。
        - id: ch03-b09
          speaker: narrator
          text: 巨人越听越吃惊，却没有答话，只去端来两大碗热麦糊当早饭。杰克想让巨人相信自己的饭量和他一样大，就把皮袋扣在外衣里面。看起来他把麦糊送进了嘴，其实全倒进了袋里。
        - id: ch03-b10
          speaker: jack
          text: 现在给你看个好把戏。无论什么伤，我碰一下就能治好。哪怕这一刻割下脑袋，下一刻也能完完整整接回肩膀。不信，你瞧。
        - id: ch03-b11
          speaker: narrator
          text: 杰克拿起刀，划开皮袋，所有麦糊顿时泼在地板上。
        - id: ch03-b12
          speaker: welsh_giant
          text: 老天爷劈指甲呀！俺自己也做得到！
        - id: ch03-b13
          speaker: narrator
          text: 威尔士巨人觉得输给杰克这样的小个子太丢脸，一把夺过刀子，猛地刺进自己的肚子，转眼便倒地死了。
    - id: ch04
      title: 锋利剑下的巨人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 杰克接连得手，便决定今后也绝不闲着。他备下一匹马、一顶智慧帽、一柄锋利剑、一双飞快鞋和一件隐身衣，好去完成前方那些非凡的事业。
        - id: ch04-b02
          speaker: narrator
          text: 他翻过一座座高山。到了第三天，前路通进一片宽广茂密的森林。杰克刚走入林中，就看见一个可怕的巨人揪住一位英俊骑士和一位夫人的头发，拖着他们向前走。他立即跳下马，把坐骑拴在一棵橡树上，再穿起隐身衣，把锋利剑藏在衣下。
        - id: ch04-b03
          speaker: narrator
          text: 他走到巨人身边，连挥几剑，却够不到对方的身子，只在两条大腿上划出好几道伤口。最后，杰克双手握剑，使尽全力，一举斩断巨人的双腿。他踩住巨人的脖子，一剑刺进身体。怪物呻吟一声，断了气。
        - id: ch04-b04
          speaker: narrator
          text: 获救的骑士和夫人连声道谢，请杰克回家接受报答。
        - id: ch04-b05
          speaker: jack
          text: 不行。找不到这个怪物的住处，我心里就不得安宁。
        - id: ch04-b06
          speaker: narrator
          text: 骑士把怪物住处的方向仔细指给他。杰克重新上马，走了不久，又看见一个巨人坐在一截圆木上，正等着哥哥回来。他下马穿好隐身衣，悄悄走近，一剑朝巨人的脑袋劈去。可这一剑没有劈准，只削掉了巨人的鼻子。巨人抓起木棒，不管杰克身在何处，发疯似的朝四下猛打。
        - id: ch04-b07
          speaker: jack
          text: 好哇，既然这样，我还是赶快结果你吧！
        - id: ch04-b08
          speaker: narrator
          text: 杰克纵身跳上圆木，从背后一剑刺进巨人身体。巨人当场倒下，再也不动了。
    - id: ch05
      title: 山顶的魔法城堡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 杰克继续翻山越谷，走到一座高山脚下。他敲开一幢孤零零的屋门，一位老人把他迎了进去。等杰克坐好，老人向他讲起山上的灾祸。
        - id: ch05-b02
          speaker: hermit
          text: 孩子，山顶有一座魔法城堡，由巨人加利甘图斯和一个邪恶的魔法师看守。最叫我痛心的是一位公爵小姐。她在父亲的花园里散步时被他们掳走，带到这里，还被变成了一头鹿。
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: 杰克答应老人，第二天一早哪怕冒着生命危险，也一定要破除魔法。他安稳地睡了一夜，天刚亮便穿上隐身衣，做好准备。
        - id: ch05-b04
          speaker: narrator
          text: 杰克一路攀到山顶，看见两头喷火的狮鹫守在那里。可隐身衣让它们根本看不见他，他便毫不畏惧地从两头怪兽中间走过。城堡大门上悬着一只金号角，下面写着两行字，说谁能吹响这号角，谁就能让巨人走到末日。
        - id: ch05-b05
          speaker: narrator
          text: 杰克读完，抓起号角，吹出一声尖锐嘹亮的长鸣。城门猛然弹开，整座城堡都震颤起来。
        - id: ch05-b06
          speaker: narrator
          text: 巨人和魔法师知道自己的恶行走到了尽头，吓得咬住拇指，浑身发抖。杰克挥起锋利剑，很快杀死巨人。紧接着，一阵旋风卷走了魔法师。所有被变成飞禽走兽的骑士和美丽夫人，全都恢复了原来的模样。城堡像烟一样消散，加利甘图斯的头颅随后被送到了亚瑟王那里。
        - id: ch05-b07
          speaker: narrator
          text: 当晚，获救的骑士和夫人们一同回到山下，在老隐士的住处歇息。第二天，大家结伴向王宫出发。杰克来到国王面前，把自己一路经历过的一场场恶战全都禀告给陛下。
        - id: ch05-b08
          speaker: narrator
          text: 这时，杰克的名声已经传遍全国。应国王的要求，公爵把女儿嫁给了他，举国上下无不欢喜。国王又赐给杰克一大片庄园。杰克和妻子在那里幸福满足地生活了一辈子。这个故事来自古代的民间故事小册子。
