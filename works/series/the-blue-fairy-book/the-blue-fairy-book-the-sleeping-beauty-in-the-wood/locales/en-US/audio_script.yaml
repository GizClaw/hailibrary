  chapters:
    - id: ch01
      title: The Fairies' Gifts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a king and queen wanted a child more than anything in the world. Their sorrow was beyond words. They visited healing waters everywhere, made vows, and went on pilgrimages. They tried every remedy they knew, but nothing helped.
        - id: ch01-b02
          speaker: narrator
          text: At last, the Queen had a daughter. The christening was splendid. The King and Queen found seven fairies in the kingdom and made them all the Princess's godmothers. In those days, each fairy gave a child a gift, so the little Princess was promised every perfection anyone could imagine.
        - id: ch01-b03
          speaker: narrator
          text: When the christening ceremony ended, the whole company returned to the palace. A great feast had been prepared for the fairies. Each one had a magnificent place at the table. Beside every plate stood a case of solid gold, holding a pure gold spoon, knife, and fork set with diamonds and rubies.
        - id: ch01-b04
          speaker: narrator
          text: Just as they sat down, a very old fairy entered the hall. No one had invited her. She had not left her tower for more than fifty years, and everyone believed she was dead or under an enchantment.
        - id: ch01-b05
          speaker: narrator
          text: The King ordered that a place be laid for her. But only seven golden cases had been made, one for each invited fairy, so there was none for the old visitor. She decided that they meant to insult her, and she muttered threats under her breath.
        - id: ch01-b06
          speaker: narrator
          text: A young fairy sitting nearby heard those angry whispers. She guessed that the old fairy meant to give the baby a cruel gift. When everyone rose from the table, the young fairy slipped behind the hangings. She would speak last and undo as much of the harm as she could.
        - id: ch01-b07
          speaker: narrator
          text: The other fairies began presenting their gifts to the baby Princess. The youngest promised that she would grow up to be the most beautiful person in the world. The next gave her the wit of an angel. The third gave her a wonderful grace in everything she did. The fourth made her a perfect dancer. The fifth promised that her voice would be as lovely as a nightingale's song. The sixth gave her the power to play every kind of music as well as it could possibly be played.
        - id: ch01-b08
          speaker: narrator
          text: Then the old fairy stepped forward. Her head shook more from spite than from age.
        - id: ch01-b09
          speaker: old_fairy
          text: The Princess will pierce her hand on a spindle, and the wound will kill her.
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Everyone trembled at this terrible gift, and the whole company began to cry. At once, the young fairy came out from behind the hangings and spoke so that all could hear.
        - id: ch01-b11
          speaker: young_fairy
          text: Do not lose hope, Your Majesties. Your daughter will not die. I cannot completely undo what the older fairy has done. The Princess will prick her hand on a spindle, but she will only fall into a deep sleep for a hundred years. When those years are over, a king's son will come and wake her.
          emotion: calm
        - id: ch01-b12
          speaker: narrator
          text: The King tried to prevent the old fairy's prophecy. He immediately proclaimed that no one in the kingdom could spin with a distaff and spindle or keep a spindle at home. Anyone who disobeyed would be put to death.
    - id: ch02
      title: The Hundred-Year Sleep
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Fifteen or sixteen years passed. One day, while the King and Queen were away at a country house, the young Princess amused herself by running through the palace. She climbed from one set of rooms to another until she reached a tiny chamber at the top of a tower. Inside, a kindly old woman sat alone, spinning with a spindle. She had never heard the King's command.
        - id: ch02-b02
          speaker: princess
          text: What are you doing there, good woman?
        - id: ch02-b03
          speaker: spinning_woman
          text: I am spinning, my pretty child.
        - id: ch02-b04
          speaker: narrator
          text: The old woman did not know that she was speaking to the Princess.
        - id: ch02-b05
          speaker: princess
          text: Oh, how pretty! How do you make it work? Let me try and see if I can do it too.
        - id: ch02-b06
          speaker: narrator
          text: The Princess had barely taken the spindle when it pierced her hand. Perhaps she moved too quickly, perhaps she did not know how to hold it, or perhaps the fairy's decree simply had to come true. The Princess fell to the floor in a faint.
        - id: ch02-b07
          speaker: narrator
          text: The old woman did not know what to do, so she cried for help. People rushed in from every direction until the little room was crowded. They splashed water on the Princess's face, loosened her clothes so she could breathe, struck the palms of her hands, and rubbed her temples with Hungary-water. They tried one remedy after another, but nothing brought her around.
        - id: ch02-b08
          speaker: narrator
          text: The King heard the noise and came upstairs. He remembered the fairies' prediction and knew the promised event had come. He ordered his daughter carried to the finest room in the palace and placed on a bed embroidered with gold and silver.
        - id: ch02-b09
          speaker: narrator
          text: She looked like a little angel. The faint had not faded her beauty at all. Her cheeks were the color of carnations and her lips were like coral. Her eyes were closed, but she breathed softly, so everyone knew she was alive.
        - id: ch02-b10
          speaker: king
          text: Do not disturb her. Let her sleep in peace until the hour comes for her to wake.
        - id: ch02-b11
          speaker: narrator
          text: The good young fairy who had saved the Princess was twelve thousand leagues away in the kingdom of Matakin. A little dwarf told her what had happened. He wore seven-league boots and could cross seven leagues in a single stride.
        - id: ch02-b12
          speaker: dwarf
          text: The Princess has touched the spindle and fallen asleep.
        - id: ch02-b13
          speaker: narrator
          text: The fairy left Matakin at once. About an hour later, she reached the palace in a fiery chariot drawn by dragons. The King came out to meet her, helped her down from the chariot, and told her everything he had done. She approved of his care for the Princess. But the fairy could see far into the future, and she saw a problem. When the Princess woke after a hundred years in that old palace, she might find herself completely alone and have no idea what to do.
        - id: ch02-b14
          speaker: narrator
          text: So the fairy touched almost everyone in the palace with her wand. She left only the King and Queen awake. Governesses and maids of honor slept. Ladies, gentlemen, officers, stewards, cooks, kitchen workers, guards, pages, and footmen slept. She touched every horse in the stables, the great dogs in the outer court, and even Mopsey, the Princess's little spaniel lying beside her on the bed.
        - id: ch02-b15
          speaker: narrator
          text: Each one fell asleep at the fairy's touch. They would wake with their mistress and be ready when she needed them. Even the spits over the fire, loaded with partridges and pheasants, fell asleep. It all happened in a moment. Fairies do not take long over their work.
        - id: ch02-b16
          speaker: narrator
          text: The King and Queen kissed their dear child without waking her. Then they left the palace and proclaimed that no one was to go near it.
        - id: ch02-b17
          speaker: narrator
          text: There was no need for the warning. Within fifteen minutes, a vast wood grew all around the park. Great trees, little trees, bushes, and thorny brambles twisted through one another so tightly that neither people nor animals could pass. The palace disappeared behind them. Only the very tops of its towers could be seen, and even those were visible only from far away. No one doubted that this was another work of the fairy's art. The wood would keep curious strangers away, and the sleeping Princess would have nothing to fear.
    - id: ch03
      title: The Prince in the Wood
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A hundred years went by. By then, a different royal family ruled the country. One day, the reigning King's son was hunting nearby when he saw towers rising from the middle of the thick wood. He asked the people with him what they were.
        - id: ch03-b02
          speaker: narrator
          text: Everyone answered with a tale they had heard. Some said the towers belonged to a ruined old castle haunted by spirits. Others claimed that all the country's witches and sorcerers met there at night for their secret gatherings. The story most people believed was that an ogre lived inside. They said he carried every child he could catch into the castle and ate them whenever he pleased. No one could follow him, because the ogre alone had the power to pass through the wood.
        - id: ch03-b03
          speaker: narrator
          text: The Prince did not know which story to believe. Then an old countryman spoke to him.
        - id: ch03-b04
          speaker: countryman
          text: Your Royal Highness, about fifty years ago my father told me something he had heard from my grandfather. A princess sleeps in that castle, and she is the most beautiful princess anyone has ever seen. She must sleep for a hundred years. Then a king's son, the one meant for her, will wake her.
        - id: ch03-b05
          speaker: narrator
          text: At those words, the young Prince burned to begin the adventure. Without stopping to question the story, he believed he could bring it to an end. Love and honor urged him forward, and he decided to enter the wood at once.
        - id: ch03-b06
          speaker: narrator
          text: As soon as he approached, the trees, bushes, and brambles moved aside by themselves. They opened a broad path toward the castle. The Prince walked on, but his companions could not follow. The trees closed again the moment he passed. Still, he continued alone. A young prince in love is always brave.
        - id: ch03-b07
          speaker: narrator
          text: He entered a great outer court, and what he saw might have terrified the boldest person alive. A dreadful silence lay over everything. The place seemed to wear the very image of death. Men and animals were stretched out everywhere, and all of them looked dead. Then the Prince studied the palace guards more closely. Their faces were red, and their noses were blotched from drinking. A few drops of wine still stood at the bottom of their cups. That showed him they were not dead at all. They had fallen asleep in the middle of their drink.
        - id: ch03-b08
          speaker: narrator
          text: He crossed a marble courtyard and climbed the stairs. In the guardroom, soldiers stood in their ranks with muskets on their shoulders, snoring as loudly as they could. Beyond them were rooms full of sleeping ladies and gentlemen. Some stood and some sat, but not one stirred.
        - id: ch03-b09
          speaker: narrator
          text: At last, the Prince entered a room covered in gold. The bed curtains stood open, and there lay the loveliest sight he had ever seen. The Princess looked fifteen or sixteen years old. Her bright beauty seemed almost heavenly. Trembling with wonder, he went to the bed and knelt beside her.
        - id: ch03-b10
          speaker: narrator
          text: At that moment, the enchantment ended. The Princess opened her eyes and looked at him with a tenderness that seemed far greater than a first meeting could explain.
        - id: ch03-b11
          speaker: princess
          text: Is it really you, my Prince? You have kept me waiting a very long time.
        - id: ch03-b12
          speaker: narrator
          text: Her words and the way she spoke them delighted him. He could hardly express his joy or his gratitude.
        - id: ch03-b13
          speaker: prince
          text: I love you more than I love my own life.
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: Their words tumbled out without much order. They wept more than they talked. There was little eloquence and a great deal of love. The Prince was more confused than the Princess. She had been waiting a long while, and perhaps the good fairy had filled her hundred-year sleep with pleasant dreams, though the old history does not say so. They spoke for four hours and still had not said half of what they wished to say.
        - id: ch03-b15
          speaker: narrator
          text: Meanwhile, the whole palace woke. Everyone returned to the task that belonged to them. Since they were not all in love, hunger soon became their chief concern. The chief lady of honor was as hungry as anyone, and at last she called to the Princess.
        - id: ch03-b16
          speaker: chief_lady
          text: Your Highness, supper is ready.
        - id: ch03-b17
          speaker: narrator
          text: The Prince helped the Princess rise. She was already dressed in splendid clothes. He wisely said nothing about the high collar and pointed band that made her look as his great-grandmother had dressed. The old fashion did not make her any less beautiful.
        - id: ch03-b18
          speaker: narrator
          text: Together they went into the great hall of mirrors. The Princess's officers served their supper while violins and hautboys played. The musicians performed the same old tunes they had known before the enchantment. More than a hundred years had passed since anyone had heard them play, but the music was still excellent. After supper, the Prince and Princess wasted no time. The lord almoner married them in the castle chapel, and later the chief lady of honor drew the curtains around their bed.
        - id: ch03-b19
          speaker: narrator
          text: They slept very little, and the Princess had no need of sleep. The next morning, the Prince returned to the city because his father must be worried. He gave the King an explanation.
        - id: ch03-b20
          speaker: prince
          text: I lost my way while I was hunting. I spent the night in a charcoal-burner's cottage, and he gave me brown bread and cheese.
        - id: ch03-b21
          speaker: narrator
          text: His father was a good man and believed him. His mother did not. The Prince went hunting nearly every day and always found an excuse, even when he stayed away for three or four nights. She began to suspect that he was married.
        - id: ch03-b22
          speaker: narrator
          text: For more than two years, the Prince lived in secret with the Princess. They had two children. Their older child, a daughter, was named Morning. Their younger child, a son, was called Day because he was even more beautiful than his sister.
        - id: ch03-b23
          speaker: narrator
          text: The Prince's mother questioned him many times. She wanted to know exactly how he spent his days, and she reminded him that a son ought to tell his mother such things. But although he loved her, he feared her and never trusted her with one word of his secret. She came from a family of ogres. His father would never have married her if she had not been immensely rich. People at court whispered that she had inherited the appetites of her family. Whenever she saw little children passing by, they said, she had all the difficulty in the world keeping herself from attacking them.
        - id: ch03-b24
          speaker: narrator
          text: About two years later, the old King died. Now that the Prince ruled in his place, he openly announced his marriage. With great ceremony, he brought his Queen to the palace. She entered the capital riding between Morning and Day.
    - id: ch04
      title: The Queen-Mother's Secret Hunger
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Not long afterward, the young King went to war against his neighbor, the Emperor Contalabutte. He left his mother in charge of the kingdom and earnestly asked her to care for his wife and children. The war kept him away all summer.
        - id: ch04-b02
          speaker: narrator
          text: As soon as he had gone, the Queen-Mother sent the young Queen and her children to a country house in the woods. There, she thought, nothing would prevent her from satisfying her horrible appetite. A few days later, she went to the country house and called for the clerk of the kitchen.
        - id: ch04-b03
          speaker: queen_mother
          text: Tomorrow, I want little Morning for my dinner.
        - id: ch04-b04
          speaker: kitchen_clerk
          text: Oh, madam!
          emotion: fearful
        - id: ch04-b05
          speaker: queen_mother
          text: I will have her, and you will serve her with sauce Robert.
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: She spoke in the voice of an ogress with a fierce longing for fresh meat. The poor man knew very well that it was dangerous to play tricks on an ogress. He took his great kitchen knife and climbed to Morning's room. The little girl was only four years old. She came jumping and laughing to meet him, threw her arms around his neck, and asked whether he had brought her some sugar candy.
        - id: ch04-b07
          speaker: morning
          text: Have you brought me some sugar candy?
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: The clerk began to cry, and the knife dropped from his hand. He carried Morning to his wife and hid the child in their rooms at the far end of the courtyard. Then he killed a little lamb and prepared it with such a fine sauce that the Queen-Mother said she had never eaten anything so good.
        - id: ch04-b09
          speaker: narrator
          text: About eight days later, the wicked Queen-Mother gave him another command.
        - id: ch04-b10
          speaker: queen_mother
          text: Tonight, I will have little Day for supper.
        - id: ch04-b11
          speaker: narrator
          text: The clerk said nothing. He meant to trick her again. He found three-year-old Day holding a little foil and fencing with a great monkey. The clerk picked him up and carried him to his wife, who hid him beside his sister. In the child's place, he cooked a tender young goat, and the ogress thought it tasted wonderful.
        - id: ch04-b12
          speaker: narrator
          text: Until then, all had gone well. But one evening the Queen-Mother spoke to the clerk again.
        - id: ch04-b13
          speaker: queen_mother
          text: Now I will eat the young Queen, with the same sauce you served with her children.
        - id: ch04-b14
          speaker: narrator
          text: This time, the clerk despaired of deceiving the Queen-Mother. The young Queen was only twenty years old if no one counted the century she had spent asleep. He could think of no animal in the yard with meat firm enough to take her place. At last, he decided that the only way to save his own life was to cut the young Queen's throat. He took a dagger, tried to force himself into a fury, and entered her chamber intending to do it at once. Even then, he could not take her by surprise. With the deepest respect, he first told her what the Queen-Mother had ordered.
        - id: ch04-b15
          speaker: queen
          text: Then do it. Carry out your orders, and I will go to my poor children, whom I loved so tenderly.
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: She stretched out her neck. Because the children had been taken without her knowledge, she believed they were dead. The clerk burst into tears.
        - id: ch04-b17
          speaker: kitchen_clerk
          text: No, madam, you will not die. You will see your children again. I hid them in my rooms, and I will take you to them. Then I will deceive the Queen-Mother once more by serving her a young deer in your place.
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: He led the young Queen to his rooms at once. He left her there embracing her children and weeping with them. Then he prepared a young deer for the Queen-Mother, who devoured it as eagerly as if it had truly been her daughter-in-law.
        - id: ch04-b19
          speaker: narrator
          text: The ogress delighted in what she believed she had done. She even invented a story for her son's return. She would tell him that mad wolves had eaten his wife and both children.
    - id: ch05
      title: The Horrible Tub
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One evening, the Queen-Mother wandered through the palace courts and yards as she often did, hoping to smell fresh meat. From a room on the ground floor, she heard little Day crying. His mother was going to whip him because he had been naughty. At the same time, Morning was begging her mother to forgive her brother.
        - id: ch05-b02
          speaker: morning
          text: Please forgive Day, Mama. Please don't punish him.
        - id: ch05-b03
          speaker: narrator
          text: The ogress recognized the voices of the young Queen and both children. Furious that she had been deceived, she gave new orders at daybreak. Her horrible voice made everyone tremble.
        - id: ch05-b04
          speaker: queen_mother
          text: Bring a great tub into the middle of the courtyard. Fill it with toads, vipers, snakes, and every kind of serpent. Tie the young Queen and her children. Tie the clerk of the kitchen, his wife, and their maid. Then bring them all to me.
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: Her servants obeyed. The young Queen, Morning, and Day were brought into the courtyard with their hands tied behind them. The clerk of the kitchen stood with them, along with his wife and maid. The executioners moved to the edge of the terrible tub and were just about to throw the prisoners in. At that very moment, the young King rode through the gate. No one had expected him home so soon. He had traveled with great speed and arrived on horseback.
        - id: ch05-b06
          speaker: king
          text: What does this horrible sight mean?
          emotion: surprised
        - id: ch05-b07
          speaker: narrator
          text: No one dared answer him. When the ogress saw that her plan had failed, rage overcame her. She threw herself headfirst into the tub and was devoured at once by the ugly creatures she had gathered there for the others.
        - id: ch05-b08
          speaker: narrator
          text: The King could not help grieving, because she was his mother. But before long, he found comfort with his beautiful wife and his dear children.
