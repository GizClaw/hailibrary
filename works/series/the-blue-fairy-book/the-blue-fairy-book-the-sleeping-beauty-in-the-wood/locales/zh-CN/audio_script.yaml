audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    young_fairy:
      display_name: 年轻仙女
      tts: {delivery: 坚定而令人安心, timbre: 清亮柔和, pace: 从容, pitch: 中高音}
    princess:
      display_name: 公主
      tts: {delivery: 温柔而真挚, timbre: 明亮清澈, pace: 中等, pitch: 中高音}
    old_woman:
      display_name: 老婆婆
      tts: {delivery: 朴实而慈和, timbre: 苍老柔和, pace: 舒缓, pitch: 中低音}
    countryman:
      display_name: 乡下人
      tts: {delivery: 恭敬而诚恳, timbre: 质朴厚实, pace: 中等偏慢, pitch: 中低音}
    prince:
      display_name: 王子
      tts: {delivery: 热烈而真诚, timbre: 年轻温润, pace: 中等有变化, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严而正直, timbre: 成熟沉稳, pace: 中等, pitch: 中低音}
    chief_lady:
      display_name: 女侍从长
      tts: {delivery: 端庄而干练, timbre: 成熟清晰, pace: 中等, pitch: 中音}
    queen_mother:
      display_name: 太后
      tts: {delivery: 威严阴冷而贪婪, timbre: 低沉粗粝, pace: 缓慢有压迫感, pitch: 低音}
    kitchen_clerk:
      display_name: 御膳房总管
      tts: {delivery: 恭谨而富有同情心, timbre: 成熟厚实, pace: 中等, pitch: 中低音}
  chapters:
    - id: ch01
      title: 七位仙女的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后。他们一直没有孩子，伤心得说不出话来。天下所有据说灵验的泉水，他们都去求过。许愿、朝圣，能试的办法全试遍了，却毫无用处。
        - id: ch01-b02
          speaker: narrator
          text: 到最后，王后终于生下一个女儿。洗礼办得十分隆重。国王和王后请来全国能找到的七位仙女，请她们做小公主的教母。那时候，仙女教母会各送一件礼物，所以小公主将拥有世间一切美好的天赋。
        - id: ch01-b03
          speaker: narrator
          text: 仪式结束后，众人回到王宫赴宴。每位仙女面前都有华美的餐具，还有一只纯金匣子，里面装着镶满钻石和红宝石的金匙、金刀、金叉。大家刚刚坐下，一位年老的仙女却走进大厅。她已经五十多年没离开过自己住的那座塔，人们以为她不是死了，就是中了魔法，因此没有邀请她。
        - id: ch01-b04
          speaker: narrator
          text: 国王马上命人给她添套餐具，却拿不出第八只金匣子，因为七只金匣子原本就是专为七位仙女准备的。老仙女觉得自己受了怠慢，咬着牙低声说起狠话。坐在一旁的年轻仙女听见了，猜到她会送小公主一件不祥的礼物。离席后，年轻仙女悄悄躲到帷幕后面，准备最后一个开口，尽力挽回老仙女造成的祸害。
        - id: ch01-b05
          speaker: narrator
          text: 仙女们开始送上祝福。最年轻的一位赐给公主举世无双的美貌。第二位给她天使般的聪慧。第三位让她一举一动都优雅动人。第四位让她舞姿无双。第五位让她唱得像夜莺。第六位让她能把每一种乐器都演奏得尽善尽美。
        - id: ch01-b06
          speaker: narrator
          text: 终于轮到老仙女。她一边开口，一边不停地摇头。那颤动与其说来自年老，不如说来自怨毒。她宣布，公主会被纺锤刺破手掌，因伤而死。可怕的礼物使在场的人无不发抖，人人都忍不住哭了起来。就在这时，年轻仙女从帷幕后走了出来。
        - id: ch01-b07
          speaker: young_fairy
          text: 国王、王后，请放心。公主不会死。我的力量不能彻底撤销长者的决定，她的手还是会被纺锤刺破。可是她不会丧命，只会沉睡一百年。百年期满，会有一位王子来到这里，把她唤醒。
          emotion: calm

    - id: ch02
      title: 沉睡的王宫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王立刻颁下诏令，全国任何人都不许用纺杆和纺锤纺线，连在家里藏一根纺锤也要处死。十五六年过去了。一天，国王和王后去了别宫，年轻的公主独自在王宫里到处玩耍。她从一间屋子跑到另一间，最后来到塔顶的小屋。里面有个老婆婆，正独自用纺锤纺线。她从没听说过国王的禁令。
        - id: ch02-b02
          speaker: princess
          text: 婆婆，您在做什么呀？
        - id: ch02-b03
          speaker: old_woman
          text: 我在纺线呢，漂亮的小姑娘。
        - id: ch02-b04
          speaker: narrator
          text: 老婆婆并不知道她就是公主。公主看得入了迷。
        - id: ch02-b05
          speaker: princess
          text: 啊，真有意思！这是怎么纺的？给我试一试，看我会不会。
        - id: ch02-b06
          speaker: narrator
          text: 公主刚把纺锤接到手里，也不知是她太心急、手势不熟，还是仙女的判词注定如此，纺锤立刻扎进她的手掌。她倒在地上，失去了知觉。
        - id: ch02-b07
          speaker: narrator
          text: 老婆婆慌得不知如何是好，只能高声呼救。许许多多的人从四面八方赶来，往公主脸上泼水，松开衣带，拍她的手掌，还拿匈牙利香水擦她的太阳穴。可无论怎么做，公主都没有醒。
        - id: ch02-b08
          speaker: narrator
          text: 国王听见喧闹，也赶上塔来。他想起仙女的预言，明白这件事终究非发生不可。于是，他叫人把公主抬进宫中最华美的寝殿，放在一张绣满金线银线的床上。
        - id: ch02-b09
          speaker: narrator
          text: 公主美得像个小天使。昏厥没有损伤她半分容色，双颊仍像石竹花一样红润，嘴唇仍像珊瑚一样鲜艳。她闭着眼睛，呼吸却轻柔可闻。大家这才知道她没有死。国王吩咐谁也不要惊扰她，只让她安静睡到醒来的那一天。
        - id: ch02-b10
          speaker: narrator
          text: 救过公主的年轻仙女当时远在一万二千里格外的马塔金王国。一个穿七里靴的小矮人马上把消息送给了她。那双靴子一步能跨七里。仙女立刻乘上由群龙拉动、烈焰腾腾的战车，大约一小时便赶到王宫。
        - id: ch02-b11
          speaker: narrator
          text: 国王亲手扶仙女走下战车。仙女很赞许国王已经做好的安排。可她看得长远，又想到一百年后，公主独自在这座古老的宫殿里醒来，一定不知该怎么办。她便用魔杖点过宫中每一个人，只留下国王和王后。女家庭教师、宫女、寝宫侍女、贵族、官员、管家、厨师、帮厨、洗碗工、卫兵、侍童和仆役，一个都没有漏掉。
        - id: ch02-b12
          speaker: narrator
          text: 她又点过马厩里所有的马，无论是骑乘的小马还是别的马。外院的大狗，还有伏在床边陪伴公主的小猎犬莫普茜，也都挨了魔杖。魔杖碰到谁，谁就立刻睡去。这样，他们不会比女主人先醒，等公主需要时，又能马上服侍她。就连火上插得满满的鹧鸪和野鸡，连同烤肉叉也睡着了。仙女办事，眨眼就能完成。
        - id: ch02-b13
          speaker: narrator
          text: 国王和王后轻轻吻别女儿，没有惊醒她。他们离开王宫，下令谁也不许靠近。其实这道命令并不需要。不到一刻钟，园林四周便长出无数高矮树木、灌木和荆棘。枝条一重重缠住，人和野兽都无法穿过。从很远的地方，最多只能望见王宫塔尖。谁都知道，是仙女施下这道法术，不让好奇的人惊扰沉睡的公主。

    - id: ch03
      title: 百年后的王子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一百年过去了。如今统治这个国家的国王，已经属于另一个家族。他的儿子有一天来到这一带打猎，远远看见浓密森林中央露出的塔楼。
        - id: ch03-b02
          speaker: prince
          text: 那片大森林中央的塔楼，究竟是什么地方？
        - id: ch03-b03
          speaker: narrator
          text: 人人都把听来的传闻告诉他。有人说那是一座闹鬼的破城堡。有人说，全国的男女巫师会在那里举行夜间集会。流传最广的说法，却是里面住着吃人妖怪。他把抓到的孩子都带进去慢慢吃掉，别人谁也追不上，因为只有妖怪能穿过那片森林。
        - id: ch03-b04
          speaker: narrator
          text: 王子听得不知该信谁。这时，一位厚道的乡下人走上前来。
        - id: ch03-b05
          speaker: countryman
          text: 殿下，大约五十年前，我父亲告诉过我一件事，他又是听我祖父说的。那座城堡里睡着一位公主，是世上最美的姑娘。她要在那里睡上一百年，再由一位王子唤醒。她一直留在那里，等的正是那位王子。
        - id: ch03-b06
          speaker: narrator
          text: 王子听了，心中像燃起一团火。他想也没想，就认定自己能完成这场奇遇。爱情和荣誉催促着他，他当即向森林走去。
        - id: ch03-b07
          speaker: narrator
          text: 王子刚一靠近，高大的树、灌木和荆棘便自动向两边退开，为他留出一条路。他沿着宽阔的林荫道，一直走向尽头的城堡。回头看时，随从们一个也没能跟上，因为他每走过一处，身后的树木就重新合拢。王子虽然有些惊讶，却没有停步。年轻而心怀爱情的王子，总是勇敢的。
        - id: ch03-b08
          speaker: narrator
          text: 他来到宽阔的外院。眼前的景象，足以叫最无畏的人浑身发冷。四周一片可怕的寂静，处处都像被死亡笼罩。人和动物横倒在地，看起来全已死去。可王子看到卫兵红润的脸和长满疙瘩的鼻子，便知道他们只是睡着了。杯底剩下的几滴酒，也说明他们喝着酒便进入了梦乡。
        - id: ch03-b09
          speaker: narrator
          text: 王子又穿过一座铺着大理石的庭院，登上楼梯，来到卫兵室。卫兵肩扛火枪，整齐地站成一排，却都鼾声如雷。接下来，他一连走过好几个房间。每间屋里都睡满了贵族男女，有的站着入睡，有的坐着入睡。
        - id: ch03-b10
          speaker: narrator
          text: 最后，他走进一间处处镀金、金光闪闪的寝殿。床上的帷幔全都敞开着，里面躺着世间最美的景象。那是一位十五六岁的公主，容光明亮得仿佛不属于凡间，美貌中甚至带着几分神圣。王子又惊叹又紧张，微微发着抖。他慢慢走到床前，跪在公主面前。
        - id: ch03-b11
          speaker: narrator
          text: 就在这时，魔法到了期限。公主睁开眼睛，望着王子的目光温柔极了，简直不像是第一次见到他。
        - id: ch03-b12
          speaker: princess
          text: 是你吗，我的王子？你让我等了好久。
        - id: ch03-b13
          speaker: narrator
          text: 王子听见这句话已经心醉，公主说话的神情更叫他着迷。他欢喜又感激，一时不知怎样表达才好。
        - id: ch03-b14
          speaker: prince
          text: 我爱你，胜过爱我自己。
        - id: ch03-b15
          speaker: narrator
          text: 两人说起话来颠三倒四，眼泪比言语还多。话说得不漂亮，心中的爱却满得盛不下。王子比公主更不知所措，也难怪。公主有整整一百年想好见面时该说什么。很可能，善良的仙女在她沉睡时送给她许多甜美的梦，虽然历史没有提过。总之，他们谈了四个钟头，却连心里话的一半也没说完。

    - id: ch04
      title: 秘密的婚姻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时候，整座王宫也醒了。人人都想起自己的差事。他们又不是个个都在恋爱，早已经饿得要命。女侍从长同样饥肠辘辘，等得很不耐烦，便高声禀告公主。
        - id: ch04-b02
          speaker: chief_lady
          text: 公主殿下，晚餐已经备好了。
        - id: ch04-b03
          speaker: narrator
          text: 王子扶公主起身。她衣饰齐整，穿得华美极了。王子很聪明，没有说她那身打扮活像自己的曾祖母，高领上还露着一圈尖角花边。不过，那古老衣裳丝毫没有减损公主的美丽。
        - id: ch04-b04
          speaker: narrator
          text: 他们来到宽敞的镜厅，在公主的侍从服侍下共进晚餐。小提琴和双簧管奏着古老而优美的曲子。乐师上一次演奏它们，已经是一百多年前。吃过晚饭，两人一点时间也不肯耽搁，宫廷施赈官就在城堡的小教堂里为他们主持婚礼。仪式结束后，女侍从长亲手合上床幔。
        - id: ch04-b05
          speaker: narrator
          text: 那一夜他们没有睡多久，公主自然早就不需要再睡。第二天清晨，王子离开公主，回到城里。他知道父亲一定正为自己担忧，便准备了一个说法。
        - id: ch04-b06
          speaker: prince
          text: 我打猎时在森林里迷了路，只好在一个烧炭人的茅屋过夜。他给了我一些奶酪和黑面包。
        - id: ch04-b07
          speaker: narrator
          text: 王子的父亲是个厚道人，听了便信了。母亲却怎么也不相信。王子几乎每天都去打猎，哪怕三四夜不回家，也总能找出借口。王后因此怀疑他已经结婚。她猜对了。王子同公主生活了整整两年，还有了一双儿女。长女叫晨曦，幼子叫白昼，因为弟弟生得比姐姐更加俊美。
        - id: ch04-b08
          speaker: narrator
          text: 王后几次盘问儿子去了哪里，还说儿子理应把实情告诉母亲。可是王子从不敢向她透露秘密。他爱母亲，也怕母亲。她有吃人妖怪的血统，要不是富可敌国，老国王绝不会娶她。宫中还私下传说，她看见孩子从身边走过时，总要拼命克制才不会扑上去。
        - id: ch04-b09
          speaker: narrator
          text: 大约又过两年，老国王去世了。王子继承王位，终于公开婚事。他用隆重的仪仗把王后接回王宫。她进入都城时，一双儿女陪在左右。
        - id: ch04-b10
          speaker: narrator
          text: 不久，新国王出兵攻打邻国的康塔拉比特皇帝。他把国政交给母后，一再嘱咐她照料自己的妻子和孩子。国王整个夏天都必须在外征战。他刚一离开，太后便把儿媳送到森林里的一所乡间别墅。这样一来，她便能更方便地满足那可怕的欲望。

    - id: ch05
      title: 吃人女妖的晚餐
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 几天以后，太后亲自来到乡间别墅，把御膳房总管叫到面前。
        - id: ch05-b02
          speaker: queen_mother
          text: 明天中午，我要吃掉小晨曦。
        - id: ch05-b03
          speaker: kitchen_clerk
          text: 啊！太后！
          emotion: fearful
        - id: ch05-b04
          speaker: queen_mother
          text: 我就是要吃。还要给她配上罗贝尔酱。
        - id: ch05-b05
          speaker: narrator
          text: 她说话时，完全是一个馋着鲜肉的吃人女妖。可怜的总管知道，绝不能对这种妖怪耍花招。他拿起大刀，走进小晨曦的房间。孩子才四岁，看见他便笑着跳过来，搂住他的脖子，向他讨糖果。总管哭了起来，大刀也从手里落下。
        - id: ch05-b06
          speaker: narrator
          text: 他跑到后院，杀了一只小羊羔，配上极鲜美的酱汁。太后吃完，声称一辈子没尝过这么好的东西。总管早已抱走小晨曦，交给自己的妻子，藏进庭院尽头的住处。
        - id: ch05-b07
          speaker: narrator
          text: 大约八天后，狠毒的太后又找到总管。
        - id: ch05-b08
          speaker: queen_mother
          text: 今天晚上，我要吃小白昼。
        - id: ch05-b09
          speaker: narrator
          text: 总管一句话也没说，决心照上次的办法骗她。他找到小白昼。三岁的孩子手里握着一柄小花剑，正同一只大猴子比剑。总管把他抱给妻子，让她把姐弟俩藏在一起，又拿一只极嫩的小山羊做成晚餐。吃人女妖尝过，觉得好极了。
        - id: ch05-b10
          speaker: narrator
          text: 到这里，一切都还顺利。可一天晚上，太后再次把总管叫来。
        - id: ch05-b11
          speaker: queen_mother
          text: 这次我要吃王后。酱汁还用她两个孩子吃过的那一种。
        - id: ch05-b12
          speaker: narrator
          text: 总管这下绝望了。年轻的王后才二十岁，还没算上沉睡的一百年。院里哪有肉质同她一样结实的牲畜可以顶替？为了保住自己的命，总管只好决定割断王后的喉咙。他握着匕首走进房间，竭力装出凶狠的模样。可他仍不愿突然下手，便恭恭敬敬地说出太后的命令。
        - id: ch05-b13
          speaker: princess
          text: 动手吧，动手吧。照她的命令做。这样，我就能去见我的孩子了。我那两个可怜的孩子，我曾那么深、那么温柔地爱着他们。
          emotion: sad
        - id: ch05-b14
          speaker: narrator
          text: 孩子们被人带走时，王后毫不知情。从那以后，她一直以为他们已经死了。
        - id: ch05-b15
          speaker: kitchen_clerk
          text: 不，不，王后！您不会死，也能再见到孩子。他们就藏在我的住处，请您跟我来。之后，我再骗太后一次，拿一头小母鹿代替您。
        - id: ch05-b16
          speaker: narrator
          text: 总管泪流满面，立刻领王后回到自己的房间。他让王后留在那里，搂住两个孩子。母子三人终于重逢，一起哭了起来。总管则去烹制一头小母鹿。太后把它当成年轻的王后吃下，胃口照旧那么好。她对自己的残忍得意极了，还编好谎话，准备等国王回来便告诉他，王后和两个孩子都被凶恶的野狼吃掉了。

    - id: ch06
      title: 国王归来
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 一天傍晚，太后照例在宫殿各处的庭院里游荡，想闻闻有没有鲜肉。她忽然听见底层一间屋里传出小白昼的哭声。原来他淘了气，母亲正要打他。她同时还听见小晨曦替弟弟求情。
        - id: ch06-b02
          speaker: narrator
          text: 吃人女妖立刻认出了王后和两个孩子的声音。想到自己竟被御膳房总管接连骗了三次，她气得发狂。第二天天刚亮，她便用一种叫所有人发抖的可怕嗓音下令，在大庭院中央搬来一只巨大的木桶，里面装满癞蛤蟆、蝰蛇、长蛇和各种毒蛇。
        - id: ch06-b03
          speaker: narrator
          text: 她要把王后和两个孩子、御膳房总管、总管的妻子和女仆一起扔进去。她还命人反绑他们的双手，把他们押到庭院里。众人果然被带了出来。刽子手正要把他们扔进木桶，国王却骑着马闯入庭院。他一路换马飞驰回来，谁也没料到他会这么快出现。国王看见眼前的情形，惊骇万分。
        - id: ch06-b04
          speaker: king
          text: 这是什么可怕的景象？究竟发生了什么事？
        - id: ch06-b05
          speaker: narrator
          text: 没有一个人敢回答。吃人女妖眼看事情败露，顿时怒不可遏。她头朝下一跃，跳进了木桶，立刻被那些原本准备用来吞噬别人的丑恶毒物吃掉。
        - id: ch06-b06
          speaker: narrator
          text: 国王自然非常伤心，因为她毕竟是自己的母亲。不过，美丽的妻子和可爱的孩子陪在身边，他很快便得到了安慰。
