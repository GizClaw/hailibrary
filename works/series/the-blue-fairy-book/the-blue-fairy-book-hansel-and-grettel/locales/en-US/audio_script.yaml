    hansel:
      display_name: Hansel
      tts:
        delivery: brave and quick-thinking
        timbre: clear and youthful
        pace: steady
        pitch: medium-high
    grettel:
      display_name: Grettel
      tts:
        delivery: tender and earnest
        timbre: bright and youthful
        pace: steady
        pitch: high
    father:
      display_name: Father
