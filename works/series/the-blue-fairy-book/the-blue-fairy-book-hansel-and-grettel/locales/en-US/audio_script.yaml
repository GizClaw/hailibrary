  chapters:
    - id: ch01
      title: The Trail of White Pebbles
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor woodcutter lived at the edge of a great forest with his wife and two children. The boy was called Hansel, and the girl was Grettel. They had always had very little. Then a terrible famine came, and the woodcutter could no longer give his family even their daily bread. One night he lay awake, turning over and over with worry.
        - id: ch01-b02
          speaker: father
          text: What will become of us? How can we feed our poor children when we have nothing left for ourselves?
        - id: ch01-b03
          speaker: stepmother
          text: I know what we'll do. Early tomorrow, we'll take the children deep into the forest. We'll make them a fire and give them each a piece of bread. Then we'll go to our work and leave them there. They won't find the way home, and we'll be rid of them.
        - id: ch01-b04
          speaker: father
          text: No, wife. I won't do it. How could I leave my children alone in the forest? The wild beasts would soon tear them to pieces.
        - id: ch01-b05
          speaker: stepmother
          text: You fool! Then all four of us must starve. You may as well start planing the boards for our coffins.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: The woman would not let the matter rest. She argued and scolded until at last the woodcutter gave in and agreed to her plan.
        - id: ch01-b07
          speaker: father
          text: I still can't help feeling sorry for the poor children.
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: Hunger had kept the children awake too. From their beds, they heard everything their stepmother said to their father, and Grettel began to weep bitterly.
        - id: ch01-b09
          speaker: grettel
          text: It's all over for us now.
          emotion: sad
        - id: ch01-b10
          speaker: hansel
          text: No, Grettel, don't cry. I'll find some way for us to escape.
        - id: ch01-b11
          speaker: narrator
          text: Once the grown-ups were asleep, Hansel put on his little coat, slipped through the back door, and went outside. The moon shone brightly. White pebbles in front of the house glittered like bits of silver, and Hansel filled his pocket with as many as it would hold. Then he crept back inside.
        - id: ch01-b12
          speaker: hansel
          text: Take heart, dear little sister, and go to sleep. God won't leave us alone.
          emotion: calm
        - id: ch01-b13
          speaker: narrator
          text: Before sunrise, the woman woke both children.
        - id: ch01-b14
          speaker: stepmother
          text: Get up, you sleepyheads. We're all going into the forest to gather wood. Here is your lunch. Don't eat it before midday, because it's all you'll get.
        - id: ch01-b15
          speaker: narrator
          text: She gave each child a piece of bread. Grettel tucked the bread beneath her apron, since Hansel's pockets were full of stones, and the family set off together. They had not gone far when Hansel stopped to look back at the house. As they walked on, he did the same thing again and again.
        - id: ch01-b16
          speaker: father
          text: Hansel, why do you keep staring back and falling behind? Watch where you're going, or you'll trip.
        - id: ch01-b17
          speaker: hansel
          text: I'm looking at my white kitten on the roof. She's waving goodbye to me.
        - id: ch01-b18
          speaker: stepmother
          text: What a donkey you are! That isn't your kitten. It's the morning sun shining on the chimney.
        - id: ch01-b19
          speaker: narrator
          text: Hansel had not been looking at a kitten. Each time he stopped, he dropped one of the white pebbles onto the path.
        - id: ch01-b20
          speaker: narrator
          text: When they reached the middle of the forest, the father told the children to gather plenty of wood while he made a fire to keep them warm. Hansel and Grettel carried armful after armful of brushwood until their pile was almost as large as a little hill. The brushwood was set alight, and soon the flames leaped high. Then the woman spoke to them.
        - id: ch01-b21
          speaker: stepmother
          text: Lie here by the fire and rest. We're going farther into the forest to cut wood. When we're done, we'll come back for you.
        - id: ch01-b22
          speaker: narrator
          text: The children sat beside the fire and ate their bread at midday. They could hear what sounded like the blows of an axe, so they believed their father was nearby. But he had tied a branch to a dead tree, and the wind was knocking it back and forth. After sitting there a long time, the children grew tired and fell fast asleep. When they woke, the forest was pitch-dark.
        - id: ch01-b23
          speaker: grettel
          text: How will we ever get out of the forest?
          emotion: fearful
        - id: ch01-b24
          speaker: hansel
          text: Wait until the moon comes up. Then we'll be able to find our way.
          emotion: calm
        - id: ch01-b25
          speaker: narrator
          text: When the full moon rose, Hansel took his sister's hand. The pebbles shone like newly minted silver coins and marked the path. The children followed them all night and reached their father's house at daybreak. They knocked, and the woman opened the door.
        - id: ch01-b26
          speaker: stepmother
          text: You naughty children! Why did you sleep so long in the forest? We thought you would never come back.
        - id: ch01-b27
          speaker: narrator
          text: Their father was overjoyed to see them standing there. Ever since leaving his children alone in the forest, his conscience had reproached him.
    - id: ch02
      title: The Lost Trail
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, the famine grew terrible again. One night, the children heard their stepmother speaking to their father in bed.
        - id: ch02-b02
          speaker: stepmother
          text: Once again, all the food is gone. We have only half a loaf left, and then there will be nothing. We must get rid of the children. This time, we'll lead them so deep into the forest that they can never find their way out. It's the only way to save ourselves.
        - id: ch02-b03
          speaker: narrator
          text: The father's heart ached when he heard this. He thought they should share the very last bite with his children rather than abandon them. But his wife rejected every argument. She only scolded and blamed him. He had yielded to her the first time, and now she forced him to yield a second time.
        - id: ch02-b04
          speaker: narrator
          text: The children had heard this whole conversation. After the grown-ups fell asleep, Hansel got up to gather pebbles again. This time, the woman had barred the door, and he could not get outside.
        - id: ch02-b05
          speaker: hansel
          text: Don't cry, Grettel. Go to sleep peacefully. God will surely help us.
          emotion: calm
        - id: ch02-b06
          speaker: narrator
          text: At dawn, the woman made the children get up and gave each of them a piece of bread, even smaller than before. As they walked toward the forest, Hansel crumbled his bread inside his pocket. Every few minutes, he stopped and dropped one crumb on the ground.
        - id: ch02-b07
          speaker: father
          text: Hansel, why do you keep stopping and looking around?
        - id: ch02-b08
          speaker: hansel
          text: I'm looking back at my little pigeon on the roof. She's waving goodbye to me.
        - id: ch02-b09
          speaker: stepmother
          text: Fool! That isn't your pigeon. It's the morning sun glittering on the chimney.
        - id: ch02-b10
          speaker: narrator
          text: All the while, Hansel went on scattering his crumbs along the path, a few at a time. The woman led the children deeper and deeper among the trees, farther into the forest than they had ever gone in their lives. Once again, the grown-ups built a great fire for them.
        - id: ch02-b11
          speaker: stepmother
          text: Sit here, children, and sleep if you're tired. We're going to cut wood. When evening comes and our work is done, we'll come back for you.
        - id: ch02-b12
          speaker: narrator
          text: At midday, Grettel shared her bread with Hansel, because his bread lay scattered along the trail. Then they fell asleep. Evening came and went, but no one returned. It was pitch-dark when they finally woke.
        - id: ch02-b13
          speaker: hansel
          text: Just wait until the moon rises, Grettel. Then we'll see the crumbs I dropped, and they'll lead us home.
          emotion: calm
        - id: ch02-b14
          speaker: narrator
          text: The moon appeared, but not a single crumb remained. Thousands of birds from the woods and fields had eaten them all.
        - id: ch02-b15
          speaker: hansel
          text: Never mind. You'll see, Grettel. We'll still find a way out.
          emotion: calm
        - id: ch02-b16
          speaker: narrator
          text: But they did not find one. They wandered through the whole night. The next morning they kept searching, and they went on until evening without finding any path out of the forest. Hunger tormented them too. They had eaten nothing except a few berries growing on the ground. At last they were so worn out that their legs would carry them no farther. They lay beneath a tree and fell fast asleep.
    - id: ch03
      title: The House of Bread and Sugar
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the third morning after leaving their father's house, the children began walking once more. They tried to find the way out, but every step took them deeper into the forest. Now they knew that unless help came soon, they would perish. At midday, they saw a beautiful snow-white bird perched on a branch. It sang so sweetly that the children stood perfectly still and listened until the song was over. Then the bird spread its wings and flew ahead of them. Hansel and Grettel followed wherever it led.
        - id: ch03-b02
          speaker: narrator
          text: The bird led them to a little house and settled on its roof. As Hansel and Grettel came closer, they saw that the walls were made of bread, the roof was covered with cakes, and the windows were clear sugar.
        - id: ch03-b03
          speaker: hansel
          text: Now we can have a real feast! I'll try some of the roof, and you can eat the window. It should be nice and sweet.
        - id: ch03-b04
          speaker: narrator
          text: Hansel reached up and broke off a little piece of roof to taste. Grettel went to the window and began to nibble it. Then a shrill voice called from inside.
        - id: ch03-b05
          speaker: witch
          text: Nibble, nibble, little mouse. Who is nibbling at my house?
        - id: ch03-b06
          speakers: [hansel, grettel]
          ensemble: duo
          text: It's Heaven's own child, the tempest wild.
        - id: ch03-b07
          speaker: narrator
          text: The children were not troubled by the voice. They kept eating. Hansel liked the roof so much that he tore down a large piece, while Grettel pushed out a whole round windowpane and sat down to enjoy it. Suddenly, the door opened. An ancient woman hobbled out, leaning on a staff. Hansel and Grettel were so frightened that they dropped the food in their hands.
        - id: ch03-b08
          speaker: witch
          text: Oh, you dear children! Who brought you here? Come inside and stay with me. No harm will come to you.
        - id: ch03-b09
          speaker: narrator
          text: She took both children by the hand and led them indoors. There she set a splendid dinner before them. There was milk to drink, sugared pancakes, apples, and nuts. When they had eaten their fill, she prepared two lovely little white beds. Hansel and Grettel lay down in them and felt as if they had gone straight to heaven.
        - id: ch03-b10
          speaker: narrator
          text: The old woman had seemed very kind, but she was really a witch who trapped children. She had built the bread house only to lure them inside. Anyone who fell into her power was killed, cooked, and eaten, and she treated each victim as a feast. Witches have red eyes and cannot see far, but they can smell human beings from a distance, just as beasts can.
        - id: ch03-b11
          speaker: witch
          text: Now I've caught them. They won't escape me.
        - id: ch03-b12
          speaker: narrator
          text: Early the next morning, before the children woke, the witch rose and looked at their round, rosy cheeks as they slept peacefully.
        - id: ch03-b13
          speaker: witch
          text: They will make a delicious bite.
        - id: ch03-b14
          speaker: narrator
          text: With one bony hand, she seized Hansel and carried him out to a little stable. She pushed him inside and barred the door behind him. Hansel could scream as loudly and as long as he liked, but it did him no good. The witch went back into the house, stood over Grettel's bed, and shook the girl until she woke.
        - id: ch03-b15
          speaker: witch
          text: Get up, you lazy girl! Fetch water and cook something for your brother. When he's fat enough, I'm going to eat him.
          emotion: angry
        - id: ch03-b16
          speaker: narrator
          text: Grettel cried bitterly, but crying did no good. She had to obey the wicked witch.
    - id: ch04
      title: Grettel and the Oven
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: From then on, Grettel had to cook the finest food for poor Hansel so that he would grow fat. She herself received nothing to eat but crab shells. Every morning, the witch hobbled out to the little stable and called to the boy through the barred door.
        - id: ch04-b02
          speaker: witch
          text: Hansel, hold out your finger. Let me feel whether you're getting fat.
        - id: ch04-b03
          speaker: narrator
          text: Each morning, Hansel held out a little bone instead of his finger. The witch's eyes were too dim to tell the difference. Whenever she felt the bone, she believed it was Hansel's finger and wondered why the boy was taking so long to grow fat. Four weeks passed. At last, she lost all patience and decided she would wait no longer.
        - id: ch04-b04
          speaker: witch
          text: Grettel, hurry and fetch some water. Fat or thin, I'm going to kill Hansel tomorrow and cook him.
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: Poor Grettel sobbed as she carried the water, and tears rolled down her cheeks.
        - id: ch04-b06
          speaker: grettel
          text: Kind Heaven, help us now! If the wild beasts had eaten us in the forest, at least we would have died together.
          emotion: sad
        - id: ch04-b07
          speaker: witch
          text: Be quiet. Your crying won't help you.
        - id: ch04-b08
          speaker: narrator
          text: Early the next morning, Grettel had to hang the kettle of water over the fire.
        - id: ch04-b09
          speaker: witch
          text: We'll bake first. I've already heated the oven and kneaded the dough.
        - id: ch04-b10
          speaker: narrator
          text: The witch pushed Grettel toward the oven. Flames were already leaping from it.
        - id: ch04-b11
          speaker: witch
          text: Crawl inside and see if it's hot enough for the bread.
        - id: ch04-b12
          speaker: narrator
          text: The witch meant to shut Grettel in the oven and bake her, so she could eat the girl too. But Grettel understood what the witch was planning.
        - id: ch04-b13
          speaker: grettel
          text: I don't know how to do that. How am I supposed to get inside?
        - id: ch04-b14
          speaker: witch
          text: You silly goose! The opening is big enough. Look, even I could fit inside.
        - id: ch04-b15
          speaker: narrator
          text: To prove it, the witch crawled toward the opening and poked her head into the oven. At once, Grettel gave her a hard shove. The witch tumbled all the way in. Grettel slammed the heavy iron door and drew the bolt across it. The witch yelled so horribly that it was dreadful to hear, but Grettel fled. She left the wicked old woman inside the oven to perish.
        - id: ch04-b16
          speaker: narrator
          text: Grettel rushed straight to Hansel and opened the stable door.
        - id: ch04-b17
          speaker: grettel
          text: Hansel, we're free! The old witch is dead!
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: Hansel sprang through the open door like a bird flying from its cage. The children threw their arms around each other's necks. They jumped for joy, kissed one another, and rejoiced at being together again. With nothing left to fear, they went back into the witch's house. There, in every corner of the room, they found boxes filled with pearls and precious stones.
        - id: ch04-b19
          speaker: hansel
          text: These are better than pebbles.
        - id: ch04-b20
          speaker: narrator
          text: He filled his pockets with treasure.
        - id: ch04-b21
          speaker: grettel
          text: I'll take something home too.
        - id: ch04-b22
          speaker: narrator
          text: She filled her apron.
        - id: ch04-b23
          speaker: hansel
          text: Now let's get far away from the witch's forest.
    - id: ch05
      title: Home Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: After wandering for several hours, Hansel and Grettel came to a great lake.
        - id: ch05-b02
          speaker: hansel
          text: We can't cross it. There isn't a bridge anywhere.
        - id: ch05-b03
          speaker: grettel
          text: And there isn't a ferryboat. But look, a white duck is swimming over there. I'll ask her to help us.
        - id: ch05-b04
          speaker: grettel
          text: Here are two children, mournful and weary. We see neither bridge nor ferry. Carry us over upon your white back, and row us across. Quack, quack!
        - id: ch05-b05
          speaker: narrator
          text: The duck swam toward them. Hansel climbed onto her back and told Grettel to sit beside him.
        - id: ch05-b06
          speaker: grettel
          text: No, that would make us too heavy for the duck. She must carry us across one at a time.
        - id: ch05-b07
          speaker: narrator
          text: The good bird carried first one child and then the other. When both had landed safely on the far side, they continued on their way. After they had walked for a while, the forest began to look more and more familiar. At last, through the trees, they saw their father's house in the distance. The children broke into a run. They bounded into the room and flung their arms around their father's neck.
        - id: ch05-b08
          speaker: narrator
          text: Their father had not known one happy hour since leaving them in the forest. The woman had died. Grettel shook out her apron, and pearls and precious stones rolled across the room. Hansel emptied his pockets, one handful after another. All their troubles were over, and they lived happily ever after.
        - id: ch05-b09
          speaker: narrator
          text: My story is done. Look, there runs a little mouse. Whoever catches it may make a great fur cap from it.
