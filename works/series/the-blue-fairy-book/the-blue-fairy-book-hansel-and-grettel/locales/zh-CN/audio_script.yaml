audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    hansel:
      display_name: 汉塞尔
      tts: {delivery: 机灵勇敢，说话直接, timbre: 清亮稚嫩, pace: 中等有变化, pitch: 中高音}
    grettel:
      display_name: 格蕾特
      tts: {delivery: 天真善良，危急时勇敢果断, timbre: 柔和稚嫩, pace: 中等, pitch: 高音}
    father:
      display_name: 父亲
      tts: {delivery: 忧郁软弱，带着深深的疼爱, timbre: 低沉朴实, pace: 稍慢, pitch: 中低音}
    stepmother:
      display_name: 继母
      tts: {delivery: 冷硬急躁，言语刻薄, timbre: 尖利成熟, pace: 稍快, pitch: 中高音}
    witch:
      display_name: 女巫
      tts: {delivery: 表面慈爱而内里阴狠，情绪多变, timbre: 苍老沙哑, pace: 中等有变化, pitch: 中低音}
  chapters:
    - id: ch01
      title: 月光下的白石子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，大森林边上住着一个穷樵夫，还有妻子和两个孩子。男孩名叫汉塞尔，女孩名叫格蕾特。他们向来吃不饱，又赶上全国闹饥荒，樵夫连每天的一块面包也拿不出来。一天夜里，他满心忧愁，在床上翻来覆去，怎么也睡不着，最后只得长长地叹了一口气。
        - id: ch01-b02
          speaker: father
          text: 我们以后可怎么活？自己已经没东西吃了，又拿什么养孩子呢？
        - id: ch01-b03
          speaker: stepmother
          text: 明天一早，把孩子领到森林最深处去。我们给他们生堆火，再留下一块面包，然后只管干活，把他们丢在那里。他们找不到回家的路，我们就不用再养他们了。
        - id: ch01-b04
          speaker: father
          text: 不，我做不到。把孩子单独扔在森林里，野兽很快就会把他们撕碎的。
        - id: ch01-b05
          speaker: stepmother
          text: 你真是个傻瓜！不这么办，我们四个都得饿死。你还不如马上刨好木板，给全家做棺材！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 女人纠缠个不停，不肯让丈夫安生，终于逼得他点头答应。可樵夫还是说，他实在心疼那两个可怜的孩子。隔壁的孩子们也饿得睡不着，把继母和父亲的这番话全听见了。格蕾特知道明天会发生什么，伤心得哭了起来。
        - id: ch01-b07
          speaker: grettel
          text: 汉塞尔，这下我们全完了。
          emotion: sad
        - id: ch01-b08
          speaker: hansel
          text: 不会的，格蕾特。别害怕，我一定能想出逃走的办法。
          emotion: calm
        - id: ch01-b09
          speaker: narrator
          text: 等大人睡熟，汉塞尔穿上外套，从后门悄悄溜了出去。月光照得很亮，屋前的白石子像碎银一样闪闪发光。他弯下腰，把口袋塞得再也装不下，才回到妹妹身边。
        - id: ch01-b10
          speaker: hansel
          text: 好妹妹，放心睡吧。上帝不会丢下我们不管的。
          emotion: calm
        - id: ch01-b11
          speaker: narrator
          text: 天还没亮，太阳也没有升起，女人便叫醒孩子，骂他们是懒虫，说全家都要进森林捡柴。她给他们一人一小块面包，吩咐只能留到中午吃，因为今天再也没有别的食物了。格蕾特把两块面包都藏在围裙下面，汉塞尔的口袋里则装满石子。一家人就这样一起出发了。
        - id: ch01-b12
          speaker: narrator
          text: 走了一会儿，汉塞尔停下来回头看房子。没走几步，他又回头。父亲问他为什么总落在后面，还提醒他留心脚下。
        - id: ch01-b13
          speaker: hansel
          text: 爸爸，我在看屋顶上的小白猫。它正挥着爪子向我告别呢。
        - id: ch01-b14
          speaker: stepmother
          text: 你这头笨驴！那不是猫，是太阳照在烟囱上。
        - id: ch01-b15
          speaker: narrator
          text: 汉塞尔看的当然不是小猫。每次停步，他都从口袋里摸出一颗白石子，偷偷丢在路上。到了森林中央，父亲叫孩子捡来许多细树枝，说要生火给他们取暖。兄妹俩一直堆到树枝像座小山，火苗很快蹿得老高。女人让他们在火边躺下休息，说大人要到林中砍树，干完活一定回来接他们。
        - id: ch01-b16
          speaker: narrator
          text: 中午，孩子们吃掉各自的一小块面包。他们不断听见一下又一下的敲击声，还当父亲就在附近挥着斧头。其实，根本没有人在砍树。父亲只把一根枝条拴在枯树上，风一吹，它就来回敲打。孩子们守着火等了很久，眼皮越来越沉，最后睡熟了。等他们醒来，森林已经黑得伸手不见五指。
        - id: ch01-b17
          speaker: grettel
          text: 汉塞尔，我们怎样才能走出去？
          emotion: fearful
        - id: ch01-b18
          speaker: hansel
          text: 等月亮升起来，我们一定能找到回家的路。
          emotion: calm
        - id: ch01-b19
          speaker: narrator
          text: 满月终于升起。汉塞尔牵着妹妹，沿着那些发亮的石子往回走。石子像崭新的三便士银币，一颗接一颗为他们指路。两人走了一整夜，天亮时终于回到了父亲的屋子。他们敲响门，继母开门看见他们，反倒骂他们是坏孩子，责怪他们在林中睡了太久，还说家里以为他们永远不会回来。父亲却高兴极了。他把孩子单独留在森林以后，良心一直责备着他，再没有片刻安宁。
    - id: ch02
      title: 面包屑与白鸟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，全国又闹起严重的饥荒。一个夜晚，孩子们再次听见继母逼迫父亲。家里只剩半条面包，吃完以后，所有人都只有死路一条。她说，这回一定要把孩子领到更深的地方，让他们再也找不到出来的路。她认定，要保住大人的命，只有这一个办法。父亲心如刀割，只觉得还不如把最后一口食物也分给孩子。可妻子根本不听他的劝，只顾责骂他，数落他。一个人只要退让过一次，往后就很难再硬起心肠。樵夫头一回已经屈服，这一次也没能坚持。孩子们把一切听得清清楚楚。等大人睡熟，汉塞尔又穿好衣服，想出去捡白石子，却发现继母早把门牢牢闩死了。
        - id: ch02-b02
          speaker: hansel
          text: 格蕾特，别哭。安心睡吧，上帝一定会帮助我们。
          emotion: calm
        - id: ch02-b03
          speaker: narrator
          text: 一早，孩子们又被赶起来。这次分到的面包比上次更小。汉塞尔在口袋里把自己的面包捏碎，沿路一点点撒在地上。父亲见他不断停步，又问他在看什么。
        - id: ch02-b04
          speaker: hansel
          text: 我在看屋顶上的小鸽子，它正向我告别。
        - id: ch02-b05
          speaker: stepmother
          text: 傻瓜！那是朝阳照亮了烟囱，根本不是什么鸽子。
        - id: ch02-b06
          speaker: narrator
          text: 女人把他们越带越深，来到孩子们一生从未去过的森林深处。那里又生起一大堆火。继母叫他们在火边坐好，累了就睡一会儿。她照旧说，大人要去砍树，傍晚干完活一定回来接他们。中午，格蕾特把自己的面包分了一半给哥哥，因为汉塞尔那一块已经全撒在路上。后来他们睡着了。黄昏悄悄过去，也没有人来接这两个可怜的孩子。
        - id: ch02-b07
          speaker: hansel
          text: 再等一会儿。月亮出来，我们就能看见面包屑，顺着它们回家。
        - id: ch02-b08
          speaker: narrator
          text: 可月光照下来，地上一块面包屑也没有。林间和田野里飞来飞去的成千上万只鸟，早已把它们啄得干干净净。汉塞尔还是安慰妹妹，说他们总会找到出路。可两人走了一整夜，第二天又从早走到晚，还是被困在森林里。他们饿得厉害，一整天只在地上找到几颗野莓充饥。最后，双腿再也不肯往前迈了，两人只好倒在一棵树下，沉沉睡去。
        - id: ch02-b09
          speaker: narrator
          text: 离家后的第三天早晨，他们继续寻找出路，反而越走越深。兄妹俩明白，再没有人来相救，他们就要死在森林里了。到了中午，一只美丽的雪白小鸟停在枝头，唱起极甜美的歌。孩子们停下脚步，一直听到歌声结束。小鸟这才拍动翅膀，飞在他们前面。两人紧紧跟随，来到一座小屋前。白鸟落到屋顶，不再往前飞了。
        - id: ch02-b10
          speaker: narrator
          text: 那间屋子的墙是面包做的，屋顶盖满糕饼，窗户则是透明的糖。汉塞尔一看，立刻有了精神。
        - id: ch02-b11
          speaker: hansel
          text: 这下可有一顿饱饭了！我尝尝屋顶，你去吃窗户，那块糖一定很甜。
        - id: ch02-b12
          speaker: narrator
          text: 汉塞尔掰下一块屋顶，格蕾特也开始啃糖窗。屋里忽然传出一个尖厉的声音。
        - id: ch02-b13
          speaker: witch
          text: 啃呀啃呀，小老鼠，谁在啃我的小房屋？
        - id: ch02-b14
          speakers: [hansel, grettel]
          ensemble: duo
          text: 那是天上的小娃娃，狂风吹过响哗哗。
        - id: ch02-b15
          speaker: narrator
          text: 两人满不在乎，继续大吃。汉塞尔觉得屋顶美味极了，索性扯下一大块。格蕾特也推下一整片圆圆的糖窗，坐着慢慢品尝。门突然开了，一个年纪大得吓人的老妇人拄着拐杖，蹒跚着走出来。孩子们惊恐万分，手一松，拿着的糕饼和糖全掉在了地上。
        - id: ch02-b16
          speaker: witch
          text: 哎哟，亲爱的孩子，是谁把你们带来的？快进屋跟我住吧，在这里谁也不会伤害你们。
        - id: ch02-b17
          speaker: narrator
          text: 老妇人一手牵一个，把他们领进屋里。桌上摆着丰盛的饭菜，有牛奶、撒糖的煎饼，还有苹果和坚果。两个饥饿的孩子吃饱以后，老妇人又给他们铺好两张漂亮的白色小床。汉塞尔和格蕾特舒服地躺下，只觉得自己仿佛进了天堂。至于汉塞尔刚才那句“好好吃一顿”，说得可真像个粗野的小子。
    - id: ch03
      title: 女巫的烤炉
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 老妇人的亲切全是伪装。她其实是个年老的女巫，守在这里专等迷路的孩子，面包屋也是她为了骗人而造的。谁落进她手里，都会被她杀死、煮熟、吃掉。每吃一个人，她还要像过盛大的节日一样庆祝。女巫都有一双红眼睛，看不清远处的东西，鼻子却和野兽一样灵敏。只要有人从附近经过，她们马上就能闻出来。
        - id: ch03-b02
          speaker: witch
          text: 这下可抓住他们了。他们别想再逃走。
        - id: ch03-b03
          speaker: narrator
          text: 第二天一早，孩子们还没有醒。女巫看着他们安静的睡脸，还有圆润红嫩的面颊，低声盘算着，这一定是两口鲜美的肉。她伸出枯瘦如柴的手，一把抓起汉塞尔，把他拖进一间小牲口棚，再牢牢锁上门。汉塞尔怎样呼喊都没有用。接着，她又来到床前，粗暴地把格蕾特摇醒。
        - id: ch03-b04
          speaker: witch
          text: 起来，懒骨头！去打水，给你哥哥做好吃的。等他养胖了，我就把他吃掉。
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 格蕾特放声大哭，可眼泪救不了她。邪恶的女巫吩咐什么，她就只能做什么。从那天起，最好的食物都送给了可怜的汉塞尔，格蕾特自己却只能啃螃蟹壳。每天早晨，老妇人都会一瘸一拐地走到棚外，叫汉塞尔伸出一根手指，好让她摸一摸，看看他究竟长胖了没有。
        - id: ch03-b06
          speaker: narrator
          text: 汉塞尔每次递出去的都是一根骨头。女巫眼神昏花，把骨头当成他的手指，怎么也想不通，这个孩子为什么总养不胖。四个星期过去，她终于失去了耐心。
        - id: ch03-b07
          speaker: witch
          text: 格蕾特，快去打水！明天不管汉塞尔是胖是瘦，我都要杀了他，煮来吃掉。
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 格蕾特提着水，眼泪不停地滚过面颊。
        - id: ch03-b09
          speaker: grettel
          text: 仁慈的上天啊，快救救我们！早知道这样，还不如让野兽吃掉我们，至少我和哥哥能死在一起。
          emotion: sad
        - id: ch03-b10
          speaker: witch
          text: 闭嘴！你再怎么哭也没有用。
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 第二天清早，格蕾特只得走到外面，挂起装满水的大锅，再点燃炉火。女巫说，烤炉已经烧热，面团也早就揉好了，她们先把面包烤出来。说完，她把格蕾特推到烤炉前。炉门敞开着，灼热的火焰已经从炉口里向外蹿。
        - id: ch03-b12
          speaker: witch
          text: 你钻进去看看，炉子是不是已经热透了。热好了，我们就把面包推进去。
        - id: ch03-b13
          speaker: narrator
          text: 女巫真正想做的，是把格蕾特关在里面烤熟，再吃掉她。格蕾特已经看穿了这个阴谋。
        - id: ch03-b14
          speaker: grettel
          text: 可我不会呀。炉口这么小，我该怎样钻进去呢？
        - id: ch03-b15
          speaker: witch
          text: 你这只笨鹅！炉口大得很，连我都能钻进去。看好了！
        - id: ch03-b16
          speaker: narrator
          text: 女巫一边嘲笑她，一边爬到炉边，亲自把头探进烤炉。格蕾特抓住机会，从背后猛力一推，叫她整个跌进炉膛。女孩立刻关紧沉重的铁门，插上门闩。女巫发出一阵又一阵可怕的惨叫，听得人毛骨悚然。格蕾特却早已逃开，把那个可恶的老妇人留在烈火中凄惨地死去。
    - id: ch04
      title: 珍珠与白鸭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 格蕾特飞奔到小牲口棚，打开了门。
        - id: ch04-b02
          speaker: grettel
          text: 汉塞尔，我们自由了！老女巫已经死了！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 汉塞尔像笼门打开后飞出来的小鸟一样，一下跳了出来。兄妹俩高兴得搂住彼此的脖子，又跳又笑，不停亲吻对方。危险已经过去，再也没有什么好害怕的了。他们这才走进女巫的屋子。屋内每个角落都摆着箱子，一只只打开来看，里面装满了珍珠和宝石。
        - id: ch04-b04
          speaker: hansel
          text: 这些东西可比白石子值钱多了。
        - id: ch04-b05
          speaker: narrator
          text: 汉塞尔把两个口袋都塞满了珍宝。
        - id: ch04-b06
          speaker: grettel
          text: 我也要带一些回家。
        - id: ch04-b07
          speaker: narrator
          text: 格蕾特把围裙装得满满的。汉塞尔提醒妹妹，现在最要紧的是赶快上路，离女巫的森林越远越好。于是，两人带着珍宝离开面包屋。他们在林中走了几个小时，前面忽然出现一片大湖，宽阔的水面挡住了去路。
        - id: ch04-b08
          speaker: hansel
          text: 我们过不去了。这里连一座桥也没有。
        - id: ch04-b09
          speaker: grettel
          text: 也没有渡船。不过你看，那边有只白鸭。我来求求她，也许她愿意载我们过去。
        - id: ch04-b10
          speaker: grettel
          text: 两个孩子好悲伤，不见渡船也没桥梁。请让我们坐上白背脊，嘎嘎划水渡过湖去！
        - id: ch04-b11
          speaker: narrator
          text: 白鸭游到他们面前。汉塞尔爬上鸭背，又叫妹妹坐在身边。
        - id: ch04-b12
          speaker: grettel
          text: 不行，我们两个一起坐，她会驮不动的。还是让她一次载一个吧。
        - id: ch04-b13
          speaker: narrator
          text: 善良的白鸭果然照她说的，先载一个，再回来接另一个，把兄妹俩分两次送到对岸。两人都平安上了岸，又在森林里走了好一阵。一路上，四周的树木和道路看起来越来越熟悉，他们知道家已经不远了。终于，兄妹俩穿过眼前的树木，远远望见了父亲的屋子。
    - id: ch05
      title: 回到父亲身边
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 汉塞尔和格蕾特立刻飞跑起来。他们冲进房间，一头扑到父亲怀里，再也不肯松手。自从把孩子留在森林以后，父亲没有度过一刻真正快活的时光。他一直思念着两个孩子，也一直为自己的软弱懊悔。那个狠心的女人却已经死了。
        - id: ch05-b02
          speaker: narrator
          text: 格蕾特来到屋子中间，轻轻抖开围裙，珍珠和宝石立刻滚得满屋都是。汉塞尔也把手伸进口袋，一把接一把地掏出带回来的珍宝。有了这些财富，一家人的苦难全都结束了。从此，他们再也不必为面包发愁，永远过着幸福的生活。
        - id: ch05-b03
          speaker: narrator
          text: 我的故事讲完了。瞧，那边跑过一只小老鼠。谁要是捉住它，就能拿它做一顶大大的皮帽子。这个故事来自格林童话。
