audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried
        timbre: clear and story-rich
        pace: measured
        pitch: medium
    little_red_riding_hood:
      display_name: Little Red Riding-Hood
      tts:
        delivery: innocent and openhearted
        timbre: young and clear
        pace: steady
        pitch: high
    mother:
      display_name: Mother
      tts:
        delivery: loving and practical
        timbre: warm and gentle
        pace: measured
        pitch: medium
    grandmother:
      display_name: Grandmother
      tts:
        delivery: frail but welcoming
        timbre: soft and aged
        pace: unhurried
        pitch: medium-high
    wolf:
      display_name: Gaffer Wolf
      tts:
        delivery: sly and calculating
        timbre: deep and rough
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Road Through the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a little country girl lived in a certain village. She was the prettiest creature anyone had ever seen. Her mother loved her dearly, and her grandmother doted on her even more. This good woman made her a little red riding-hood. It suited her so well that everyone began to call her Little Red Riding-Hood.
        - id: ch01-b02
          speaker: narrator
          text: One day, her mother made some custards and called to her.
        - id: ch01-b03
          speaker: mother
          text: My dear, go and see how Grandmamma is. I hear she has been very ill. Take her this custard and this little pot of butter.
        - id: ch01-b04
          speaker: narrator
          text: Little Red Riding-Hood set out at once to visit her grandmother, who lived in another village. To reach her, the little girl had to go through a wood.
        - id: ch01-b05
          speaker: narrator
          text: In the wood, she met Gaffer Wolf. He wanted very much to eat her, but some men were cutting firewood nearby, so he did not dare. Instead, he asked where she was going. The poor child did not know it was dangerous to stop and talk to a wolf.
        - id: ch01-b06
          speaker: little_red_riding_hood
          text: I'm going to see my grandmamma. Mamma sent her a custard and a little pot of butter.
        - id: ch01-b07
          speaker: wolf
          text: Does your grandmamma live far away?
        - id: ch01-b08
          speaker: little_red_riding_hood
          text: Oh, yes. Her house is past that mill over there. It's the first house in the village.
        - id: ch01-b09
          speaker: wolf
          text: Then I'll go and visit her too. I'll take this path, and you take the other one. We'll see who gets there first.
        - id: ch01-b10
          speaker: narrator
          text: The Wolf ran as fast as he could along the shortest road. Little Red Riding-Hood took the longer way. She stopped to gather nuts, chased butterflies, and made little bunches from the flowers she found.
    - id: ch02
      title: The Wolf at Grandmother's House
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Wolf did not take long to reach the old woman's house. When he got there, he knocked on the door. Tap, tap.
        - id: ch02-b02
          speaker: grandmother
          text: Who's there?
        - id: ch02-b03
          speaker: wolf
          text: It's your grandchild, Little Red Riding-Hood. Mamma sent you a custard and a little pot of butter.
        - id: ch02-b04
          speaker: narrator
          text: The Wolf had made his voice sound like the little girl's. Grandmother was in bed because she was ill, so she called back to him.
        - id: ch02-b05
          speaker: grandmother
          text: Pull the bobbin, and the latch will lift.
        - id: ch02-b06
          speaker: narrator
          text: The Wolf pulled the bobbin, and the door opened. At once he fell upon the good woman and ate her up in a moment. He had not eaten a bite for more than three days. Then he shut the door, climbed into Grandmother's bed, and waited for Little Red Riding-Hood.
    - id: ch03
      title: A Voice Behind the Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Some time later, Little Red Riding-Hood arrived and knocked on the door. Tap, tap.
        - id: ch03-b02
          speaker: wolf
          text: Who's there?
        - id: ch03-b03
          speaker: narrator
          text: At first, the Wolf's deep voice frightened her. Then she thought her grandmother must have caught a cold and gone hoarse.
        - id: ch03-b04
          speaker: little_red_riding_hood
          text: It's your grandchild, Little Red Riding-Hood. Mamma sent you a custard and a little pot of butter.
        - id: ch03-b05
          speaker: narrator
          text: The Wolf softened his voice as much as he could.
        - id: ch03-b06
          speaker: wolf
          text: Pull the bobbin, and the latch will lift.
        - id: ch03-b07
          speaker: narrator
          text: Little Red Riding-Hood pulled the bobbin, and the door opened. The Wolf hid himself under the bedclothes as she came in.
        - id: ch03-b08
          speaker: wolf
          text: Set the custard and the little pot of butter on the stool. Then come and lie down beside me.
        - id: ch03-b09
          speaker: narrator
          text: Little Red Riding-Hood undressed and got into bed. She was greatly amazed by the way her grandmother looked in her nightclothes.
    - id: ch04
      title: What Great Teeth You Have
      blocks:
        - id: ch04-b01
          speaker: little_red_riding_hood
          text: Grandmamma, what very big arms you have!
        - id: ch04-b02
          speaker: wolf
          text: All the better to hug you with, my dear.
        - id: ch04-b03
          speaker: little_red_riding_hood
          text: Grandmamma, what very big legs you have!
        - id: ch04-b04
          speaker: wolf
          text: All the better to run with, my child.
        - id: ch04-b05
          speaker: little_red_riding_hood
          text: Grandmamma, what very big ears you have!
        - id: ch04-b06
          speaker: wolf
          text: All the better to hear you with, my child.
        - id: ch04-b07
          speaker: little_red_riding_hood
          text: Grandmamma, what very big eyes you have!
        - id: ch04-b08
          speaker: wolf
          text: All the better to see you with, my child.
        - id: ch04-b09
          speaker: little_red_riding_hood
          text: Grandmamma, what very big teeth you have!
        - id: ch04-b10
          speaker: wolf
          text: All the better to eat you up!
        - id: ch04-b11
          speaker: narrator
          text: With those words, the wicked Wolf fell upon Little Red Riding-Hood and ate her all up.
