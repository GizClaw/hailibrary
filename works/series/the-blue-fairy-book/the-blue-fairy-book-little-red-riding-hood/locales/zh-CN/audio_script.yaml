audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    mother:
      display_name: 母亲
      tts: {delivery: 亲切而自然, timbre: 成熟柔和, pace: 中等, pitch: 中音}
    little_red_riding_hood:
      display_name: 小红帽
      tts: {delivery: 天真活泼而清脆, timbre: 稚嫩明亮, pace: 中等稍快, pitch: 高音}
    wolf:
      display_name: 狼
      tts: {delivery: 狡猾阴沉且善于伪装, timbre: 粗哑低沉, pace: 中等有变化, pitch: 低音}
    grandmother:
      display_name: 外婆
      tts: {delivery: 慈祥而虚弱, timbre: 年老柔和, pace: 舒缓, pitch: 中低音}
  chapters:
    - id: ch01
      title: 红色小风帽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一座村子里住着一个小小的乡下姑娘。她漂亮又可爱，母亲疼她，外婆更把她当成心肝宝贝。外婆给她做了一顶红色小风帽。她戴起来实在好看，大家从此都叫她小红帽。
        - id: ch01-b02
          speaker: narrator
          text: 一天，母亲烤好几只奶油蛋糕，有件事要小红帽去办。
        - id: ch01-b03
          speaker: mother
          text: 乖孩子，去瞧瞧外婆吧。我听说她病得很厉害。你把这只奶油蛋糕和这一小罐黄油带给她。
        - id: ch01-b04
          speaker: narrator
          text: 小红帽马上动身，去另一个村子看外婆。走进树林以后，她遇见了狼大爷。狼馋得恨不得立刻吞掉她，可附近有樵夫在捆柴，他没敢下手，只问小红帽要去哪里。小红帽哪里知道，停下来听狼说话会有多危险。
        - id: ch01-b05
          speaker: little_red_riding_hood
          text: 我要去看外婆，给她带去妈妈做的奶油蛋糕，还有一小罐黄油。
        - id: ch01-b06
          speaker: wolf
          text: 你外婆住得很远吗？
        - id: ch01-b07
          speaker: little_red_riding_hood
          text: 远着呢。你看见那座磨坊了吗？她就住在磨坊后面，是进村的第一所屋子。
        - id: ch01-b08
          speaker: wolf
          text: 那我也去看看她吧。我走这一边，你走另一边，咱们比比谁先到。

    - id: ch02
      title: 狼先到了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 狼选了最近的路，拼命向前跑。小红帽却绕上远路，一会儿捡榛子，一会儿追蝴蝶，还采下路边的小花扎成花束。狼很快到了外婆门前，敲了两下。笃，笃。
        - id: ch02-b02
          speaker: grandmother
          text: 门外是谁呀？
        - id: ch02-b03
          speaker: wolf
          text: 外婆，是您的外孙女小红帽。妈妈让我送一只奶油蛋糕和一小罐黄油来。
        - id: ch02-b04
          speaker: narrator
          text: 狼把声音装得像小红帽一样。外婆正病着，躺在床上，没有听出破绽。
        - id: ch02-b05
          speaker: grandmother
          text: 拉一拉线轴，门闩自己就升起来了。
        - id: ch02-b06
          speaker: narrator
          text: 狼拉动线轴，门开了。他扑向善良的老太太，转眼就把她吃光。原来他已经三天多没吃过东西。狼关好门，钻进外婆的床，等着小红帽。

    - id: ch03
      title: 门后的粗嗓门
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 过了一会儿，小红帽来到门外，也敲了两下。笃，笃。
        - id: ch03-b02
          speaker: wolf
          text: 门外是谁呀？
        - id: ch03-b03
          speaker: narrator
          text: 小红帽听见那副粗嗓门，起先有点害怕。转念一想，她以为外婆受了凉，声音才会沙哑。
        - id: ch03-b04
          speaker: little_red_riding_hood
          text: 外婆，是您的外孙女小红帽。妈妈让我给您带来一只奶油蛋糕和一小罐黄油。
        - id: ch03-b05
          speaker: narrator
          text: 狼尽力把声音放得柔和些，这才回答她。
        - id: ch03-b06
          speaker: wolf
          text: 拉一拉线轴，门闩自己就升起来了。
        - id: ch03-b07
          speaker: narrator
          text: 小红帽一拉线轴，门便开了。狼藏在被子底下，看着她走进屋。
        - id: ch03-b08
          speaker: wolf
          text: 把蛋糕和黄油放到凳子上，再过来陪我躺一会儿吧。

    - id: ch04
      title: 外婆的大牙齿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小红帽脱下衣服，上了床。外婆穿着睡衣的样子实在古怪，她越看越吃惊。
        - id: ch04-b02
          speaker: little_red_riding_hood
          text: 外婆，您的胳膊怎么这么粗呀？
        - id: ch04-b03
          speaker: wolf
          text: 胳膊粗，才能把你搂得更紧呀，乖孩子。
        - id: ch04-b04
          speaker: little_red_riding_hood
          text: 外婆，您的腿怎么也这么粗呀？
        - id: ch04-b05
          speaker: wolf
          text: 腿粗，我才能跑得更快呀，孩子。
        - id: ch04-b06
          speaker: little_red_riding_hood
          text: 外婆，您的耳朵怎么这么大呀？
        - id: ch04-b07
          speaker: wolf
          text: 耳朵大，才能把你的话听得更清楚呀。
        - id: ch04-b08
          speaker: little_red_riding_hood
          text: 外婆，您的眼睛怎么也这么大呀？
        - id: ch04-b09
          speaker: wolf
          text: 眼睛大，才能把你看得更清楚呀，孩子。
        - id: ch04-b10
          speaker: little_red_riding_hood
          text: 外婆，您的牙齿怎么这么大呀？
        - id: ch04-b11
          speaker: wolf
          text: 牙齿大，正好把你吃掉！
        - id: ch04-b12
          speaker: narrator
          text: 恶狼话音刚落，便猛扑到小红帽身上，把她整个儿吃掉了。
