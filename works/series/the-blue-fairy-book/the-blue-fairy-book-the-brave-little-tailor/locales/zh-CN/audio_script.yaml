      display_name: 国王
      tts: {delivery: 威严多疑，常压着不情愿, timbre: 饱满成熟, pace: 中等, pitch: 中低音}
    first_horseman:
      display_name: 骑兵甲
      tts: {delivery: 守纪而疑惑, timbre: 坚实成熟, pace: 中等, pitch: 中低音}
    second_horseman:
      display_name: 骑兵乙
      tts: {delivery: 谨慎而克制, timbre: 清晰成熟, pace: 中等, pitch: 中音}
    third_horseman:
      display_name: 骑兵丙
      tts: {delivery: 好奇而警醒, timbre: 明亮成熟, pace: 中等, pitch: 中音}
    queen:
      display_name: 王后
      tts: {delivery: 矜持而忧郁，情绪克制, timbre: 年轻清亮, pace: 中等, pitch: 中高音}
  chapters:
    - id: ch01
      title: 一下打死七个
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 夏日里的一天，小裁缝兴高采烈地坐在窗边赶针线。街上传来农妇的叫卖声。
        - id: ch01-b02
          speaker: jam_seller
          text: 上好的果酱！上好的果酱！
        - id: ch01-b03
          speaker: tailor
          text: 好大嫂，上这儿来吧！我正想买呢。
        - id: ch01-b04
          speaker: narrator
          text: 农妇提着沉重的篮子爬上三层楼。小裁缝叫她把所有罐子摆成一排，逐个看过、闻过，才挑中一罐。
        - id: ch01-b05
          speaker: tailor
          text: 这果酱不错。给我称四盎司吧，就算称到四分之一磅，我也不计较。
        - id: ch01-b06
          speaker: narrator
          text: 农妇原以为会有一笔大生意，没想到他只买这么一点。她照数称好果酱，临走时还气恼地嘟囔个不停。小裁缝却十分满意。他从橱柜里取出面包，切下圆圆的一片，再把果酱涂得满满的。
        - id: ch01-b07
          speaker: tailor
          text: 愿上天赐福，让这果酱给我添力气！味道准不错。不过，我得先把背心做完再吃。
        - id: ch01-b08
          speaker: narrator
          text: 他把面包放在身边，继续缝那件背心。心里越快活，针脚迈得越大。果酱的甜香一路飘到天花板，那里正停着成群的苍蝇。苍蝇闻到香味，全都飞了下来，黑压压地挤在面包上。
        - id: ch01-b09
          speaker: tailor
          text: 嘿，谁请你们来的？
        - id: ch01-b10
          speaker: narrator
          text: 小裁缝赶走这些不速之客。可苍蝇听不懂人话，也不把警告当回事，转眼又飞回来，数量反而比先前更多。小裁缝终于失去耐性，从壁炉角落抽出一块抹布。
        - id: ch01-b11
          speaker: tailor
          text: 等着吧，看我怎么收拾你们！
        - id: ch01-b12
          speaker: narrator
          text: 他狠狠打下去，停手一数，面前竟躺着七只死苍蝇。
        - id: ch01-b13
          speaker: tailor
          text: 我真是个了不得的勇士！这件事全城都该知道。不，光是全城怎么够？全世界都该听说！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 他觉得如此英勇的事必须传遍全城，赶紧裁出一条腰带，细细缝好边，再用大字绣上“一下打死七个”。可刚绣完，他又觉得全城实在太小。想到自己的威名将传遍世界，他的心欢喜得怦怦跳，活像小羊羔摇尾巴。
    - id: ch02
      title: 和巨人比本领
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小裁缝把腰带系在身上，决定去闯荡广阔的世界。他觉得那间裁缝铺太小，容不下自己的本领。临行前，他在屋里四处寻找可以带上路的东西，最后只找到一块陈奶酪。走到门外，他又发现一只鸟困在灌木里，便把它救出来，和奶酪一起装进袋子。他身子轻巧，走了很久也不觉得累。道路一直通向山顶，那里坐着一个力大无穷的巨人，正悠闲地眺望四方。
        - id: ch02-b02
          speaker: tailor
          text: 你好，朋友！你在这儿看着整个大千世界，我正要到那里去闯荡。要不要跟我结伴？
        - id: ch02-b03
          speaker: first_giant
          text: 你这个可怜巴巴的小东西！
        - id: ch02-b04
          speaker: tailor
          text: 这笑话真有意思。喏，读读我的腰带，你就知道我是怎样的人了。
        - id: ch02-b05
          speaker: narrator
          text: 巨人低头读到“一下打死七个”，还以为小裁缝一口气杀了七个人，对这个小个子顿时有了几分敬意。不过，他不肯马上认输，还要先试试对方。他捡起一块石头握在掌中，狠狠一捏，直捏得水滴淌了出来。
        - id: ch02-b06
          speaker: first_giant
          text: 你也来一下。真有力气，就让人瞧瞧。
        - id: ch02-b07
          speaker: tailor
          text: 就这个？不过是孩子的把戏。你看，我捏出来的水比你还多。
        - id: ch02-b08
          speaker: narrator
          text: 小裁缝从袋里取出的其实是奶酪。他用力一捏，乳清便流了下来，看着果真比巨人的石头出水更多。巨人怎么也想不到一个小家伙会有这样的力气，惊得说不出话。他又捡起一块石头，猛地抛向天空。石头飞得那么高，眼睛几乎都追不上了。
        - id: ch02-b09
          speaker: first_giant
          text: 来呀，小矮子，你也扔一个。
        - id: ch02-b10
          speaker: tailor
          text: 扔得不错，可你的石头还会落地。我要扔一个永远不回来的。
        - id: ch02-b11
          speaker: narrator
          text: 小裁缝伸手进袋，握住那只鸟，向空中一抛。小鸟重获自由，高兴地直冲云霄，越飞越远，再也没有落回来。巨人抬头等了许久，也没见它落地，哪里知道那根本不是石头。
        - id: ch02-b12
          speaker: tailor
          text: 怎么样，朋友，我这一手还过得去吧？
        - id: ch02-b13
          speaker: first_giant
          text: 你确实会扔。现在试试，你扛不扛得动真正的重东西。来帮我把这棵橡树抬出林子。
        - id: ch02-b14
          speaker: tailor
          text: 没问题。你扛树干，我抬树冠和枝条，那一头更重。
        - id: ch02-b15
          speaker: narrator
          text: 巨人把粗大的树干架上肩头，小裁缝却舒舒服服地坐进枝叶之间。巨人看不见背后的情形，只好独自扛着整棵树，外加一个小裁缝。小裁缝坐在后面，快活地吹着响亮的小曲，仿佛抬树只是轻松的游戏。巨人拖着沉重的橡树走了好一阵，终于再也撑不住了。
        - id: ch02-b16
          speaker: first_giant
          text: 喂，我要把树放下了！
        - id: ch02-b17
          speaker: narrator
          text: 小裁缝敏捷地跳下去，双手抱住树，装作一路都在抬。
        - id: ch02-b18
          speaker: tailor
          text: 你这么个大笨汉，竟然连一棵树也扛不动！
        - id: ch02-b19
          speaker: narrator
          text: 两人继续赶路。经过一棵樱桃树时，巨人抓住挂满熟果的树梢，压下来交给小裁缝，叫他吃樱桃。小裁缝的力气根本压不住树。巨人一松手，树枝便猛地弹向空中，把他也带了上去。等小裁缝重新落回地面，竟一点儿也没受伤。
        - id: ch02-b20
          speaker: first_giant
          text: 怎么，你连一根细树枝都压不住？
        - id: ch02-b21
          speaker: tailor
          text: 我可不是没力气。附近有猎人开枪，我才从树顶跳过去躲一躲。你有胆量，也跳一个试试。
        - id: ch02-b22
          speaker: narrator
          text: 小裁缝还拿腰带上的功绩提醒他，能一下打死七个的人，怎么会压不住树枝。巨人果真去跳，却没能越过树顶，反而卡在枝叶里。这一回，又是小裁缝占了上风。
    - id: ch03
      title: 巨人洞里的夜晚
      blocks:
        - id: ch03-b01
          speaker: first_giant
          text: 好吧，你到底是条好汉。到我们的山洞住一夜吧。
        - id: ch03-b02
          speaker: narrator
          text: 小裁缝欣然跟着这位新朋友去了。山洞里还有几个巨人围着火堆，每人手里都抓着一整只烤羊，正在大口吃肉。小裁缝站在他们中间，四下打量起来。
        - id: ch03-b03
          speaker: tailor
          text: 这里能转身的地方，确实比我的裁缝铺宽敞多了。
        - id: ch03-b04
          speaker: narrator
          text: 巨人给他指了一张床，叫他躺下好好睡一觉。那张床实在太大，小裁缝根本没有爬上去，只悄悄缩进角落。半夜，巨人以为他已经睡熟，便抡起粗大的铁手杖，一下把床砸成两截，自以为这只小蚱蜢已经没命。天一亮，巨人们进了树林，早把小裁缝忘得一干二净。没想到，他们忽然看见他精神十足地迎面走来。巨人们吓得魂都没了，生怕这个怎么也打不死的家伙会杀掉自己，全都拔腿逃走。
        - id: ch03-b05
          speaker: narrator
          text: 小裁缝想往哪里走就往哪里走。漫游了很久，他来到一座王宫的庭院，累得躺在草地上睡着了。宫人围过来，从头到脚打量这个陌生人，最后看见他腰带上的大字：“一下打死七个。”
        - id: ch03-b06
          speakers: [palace_watcher_1, palace_watcher_2, palace_watcher_3]
          ensemble: chorus
          text: 一位身经百战的大英雄，怎么会来到太平之地？他一定勇猛无比！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 宫人把消息禀告国王，说一旦发生战争，这样举足轻重的人必有大用，无论花什么代价都该留下。国王觉得有理，便派廷臣守在小裁缝身边。等他伸伸胳膊腿，睁开眼睛以后，廷臣才转达邀请。
        - id: ch03-b08
          speaker: courtier
          text: 国王愿请您进入军中，为他效力。
        - id: ch03-b09
          speaker: tailor
          text: 我正是为这件事来的。我愿意为国王效力。
        - id: ch03-b10
          speaker: narrator
          text: 小裁缝就这样进入军中，受到隆重礼遇，还得到一所专供自己居住的宅院。其他军官却又嫉妒又害怕，恨不得他远在千里以外。他们聚在一起，越商量越觉得不能留下。
        - id: ch03-b11
          speakers: [first_officer, second_officer, third_officer]
          ensemble: chorus
          text: 要是和他争起来，他一下就打倒七个，我们很快会一个也不剩。我们可挡不住这样的人，还是一起辞职吧。
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: 军官们一起向国王递交辞呈。国王一想到会为了一个人失去所有忠臣，心里十分难过。他真希望从未见过小裁缝，却又不敢赶他走，生怕他杀掉自己和百姓，再登上王位。国王反复思量了很久，终于想到一个看似稳妥的办法。
    - id: ch04
      title: 森林里的两个巨人
      blocks:
        - id: ch04-b01
          speaker: king
          text: 森林里住着两个巨人，到处抢劫、杀人、放火、掠夺，谁接近他们都有性命之忧。你若能杀死他们，我就把独生女儿嫁给你，再把半个王国给你。你还可以带一百名骑兵助阵。
        - id: ch04-b02
          speaker: tailor
          text: 一言为定！美丽的公主和半个王国，可不是天天送上门来的。我用不着一百名骑兵。一下能打死七个的人，哪里会怕两个？
        - id: ch04-b03
          speaker: narrator
          text: 小裁缝出发了，一百名骑兵跟在后面。来到森林边缘，他叫众人留在原地，自己走进树林，一双锐利的小眼睛不停地左右搜寻。他很快看见两个巨人躺在树下熟睡，鼾声震出的气浪连树枝都压弯了。他赶紧装满一袋石头，爬到树身中段，再沿树枝挪到两人头顶，接连朝第一个巨人扔去。那巨人起初毫无知觉，过了许久才醒来，推了推同伴。
        - id: ch04-b04
          speaker: first_giant
          text: 你打我干什么？
        - id: ch04-b05
          speaker: second_giant
          text: 我没打你。你在做梦吧。
        - id: ch04-b06
          speaker: narrator
          text: 两人重新睡下。小裁缝又拿石头砸第二个巨人。
        - id: ch04-b07
          speaker: second_giant
          text: 你什么意思？为什么拿东西砸我？
        - id: ch04-b08
          speaker: first_giant
          text: 我什么也没扔！
        - id: ch04-b09
          speaker: narrator
          text: 两人吵了一阵，可他们实在困得厉害，很快便和解，又躺下睡着了。小裁缝重新玩起把戏，从袋中选出最大的一颗石头，使尽全身力气扔下去，正好砸中第一个巨人的胸口。
        - id: ch04-b10
          speaker: first_giant
          text: 这也太过分了！
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 他发疯似的跳起来，把同伴狠狠撞向树干，撞得整棵树都颤动。另一个也毫不示弱，立刻还手。两人越打越怒，竟把大树连根拔起，当成棍棒互相猛击，直到一同倒在地上，双双死去。小裁缝跳下树，还庆幸他们没有拔掉自己藏身的那一棵，否则他就得像松鼠似的跳到别处去。随后，他拔出剑，在两个巨人的胸口各补了几下，才回去见骑兵。
        - id: ch04-b12
          speaker: tailor
          text: 都办妥了。两个巨人已经叫我解决，不过这一仗并不轻松。他们为了抵抗我，连大树都拔了起来。可那又怎么挡得住一下打死七个的人？
        - id: ch04-b13
          speakers: [first_horseman, second_horseman, third_horseman]
          ensemble: chorus
          text: 您没有受伤吗？
        - id: ch04-b14
          speaker: tailor
          text: 当然没有。他们连我一根头发也没碰着。
        - id: ch04-b15
          speaker: narrator
          text: 骑兵们不肯相信他毫发无伤。他们一直策马进入森林，亲眼看见两个巨人倒在血泊里，周围还横着一棵棵连根拔起的大树，这才相信战斗真的结束了。
    - id: ch05
      title: 独角兽和野猪
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 小裁缝去讨奖赏，国王却反悔了，又给他一道难题。
        - id: ch05-b02
          speaker: king
          text: 在你娶我女儿、得到半个王国以前，还得再立一件功劳。森林里有一头独角兽四处惹祸，你先把它捉住。
        - id: ch05-b03
          speaker: tailor
          text: 一头独角兽比两个巨人还不可怕。一下打死七个，这就是我的信条。
        - id: ch05-b04
          speaker: narrator
          text: 小裁缝带上一根绳子和一把斧头，又叫随从留在林外，自己进去寻找。他没走多远，独角兽便出现了。它一看见小裁缝，立刻迎面猛冲过来，像要当场用尖角刺穿他。小裁缝却站在原地，一动也不动。
        - id: ch05-b05
          speaker: tailor
          text: 慢点，慢点，朋友，别这么着急。
        - id: ch05-b06
          speaker: narrator
          text: 等独角兽逼到眼前，他才轻盈地闪到一棵树后。独角兽收不住脚，拼尽全力撞上树干。它的尖角深深扎了进去，任凭怎样挣扎，也没有力气拔出来，就这样被捉住了。
        - id: ch05-b07
          speaker: tailor
          text: 这回我的鸟儿可落网了。
        - id: ch05-b08
          speaker: narrator
          text: 小裁缝从树后出来，先把绳子套在独角兽颈上，再用斧头把卡住的尖角从树干里砍出来。一切收拾妥当，他便牵着俘虏去见国王。国王仍不肯给出奖赏，又提出第三个要求，命他去捉那头危害森林的野猪，还许他带上猎人相助。
        - id: ch05-b09
          speaker: tailor
          text: 乐意得很。这不过是孩子的把戏。
        - id: ch05-b10
          speaker: narrator
          text: 小裁缝仍旧不带猎人，独自进林。猎人也巴不得留下，那头野猪已经把他们折腾怕了，谁也不想再去跟它打交道。野猪一看见小裁缝，便口吐白沫，利齿闪光地直冲过来，想把他撞倒。小裁缝飞快地跑进附近一座小礼拜堂，随即从窗口跳了出去。野猪追进门，他却绕回正门，把门牢牢关上。那头狂怒的野兽就这样成了俘虏。它身子太沉，又笨重不灵，根本跳不出窗口。小裁缝叫猎人过来，让他们亲眼看过俘虏，随后再次去见国王。国王无论多不情愿，也只得履行诺言，把女儿和半个王国交给他。要是他知道眼前并非征战沙场的英雄，只是个小裁缝，心里准会更加难受。婚礼办得十分隆重，却没有多少喜气。从此，裁缝成了国王。
    - id: ch06
      title: 裁缝永远是国王
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 过了一阵，一天夜里，王后听见丈夫在梦中说话。
        - id: ch06-b02
          speaker: tailor
          text: 小伙计，把那件背心做好，再补补这条裤子，不然我就扇你耳光！
        - id: ch06-b03
          speaker: narrator
          text: 王后听见这番梦话，才知道这位年轻的贵人原来出身何等低微，丈夫不过是个不折不扣的裁缝。她为这件事苦恼了一整夜。第二天一早，她便去见父亲，哭着把自己刚刚发现的秘密说了出来。
        - id: ch06-b04
          speaker: queen
          text: 父王，请您帮帮我吧。我不愿再和一个裁缝做夫妻，我一定要摆脱他。
          emotion: sad
        - id: ch06-b05
          speaker: narrator
          text: 国王听完女儿的哭诉，先安慰她不要忧心，随后把自己的计划说了出来。
        - id: ch06-b06
          speaker: king
          text: 今晚把卧房门开着。我的仆人会等在外面。你丈夫一睡熟，他们就进去捆住他，把他抬上船，送到茫茫大海上去。
        - id: ch06-b07
          speaker: narrator
          text: 王后对这个主意十分满意。可国王的一名侍从听见了全部密谋。他很爱戴年轻的主人，便径直赶去，把王后开门、仆人绑人和船只远航的计划全告诉了小裁缝。
        - id: ch06-b08
          speaker: tailor
          text: 我马上就能叫他们打消这个念头。
        - id: ch06-b09
          speaker: narrator
          text: 当晚，小裁缝和妻子像平日一样上床。门外，国王的仆人已经悄悄守在约定的地方，只等王后发出信号。王后等了一会儿，以为丈夫已经睡熟，便轻轻下床，把卧房门打开，再回到床上躺好。可小裁缝从头到尾只是在假睡。他知道门外的人已经就位，这时突然用清亮的声音喊起来，让每个人都听得清清楚楚。
        - id: ch06-b10
          speaker: tailor
          text: 小伙计，把背心做好，再补补裤子，不然我就扇你耳光！我一下打死七个，杀掉两个巨人，活捉一头独角兽，又逮住一头野猪，难道还怕门外那几个人？
        - id: ch06-b11
          speaker: narrator
          text: 门外的人听见这番话，想起他那一件件可怕的功绩，吓得像被一支凶猛的大军追赶，转身便逃。他们谁也不敢执行国王的命令，从此再也不敢靠近小裁缝。就这样，再没有人能够把他赶下王位。小裁缝做了一辈子国王。
