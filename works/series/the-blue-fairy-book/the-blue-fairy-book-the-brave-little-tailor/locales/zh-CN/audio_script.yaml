      tts: {delivery: 警觉而惊叹, timbre: 清晰成熟, pace: 中等, pitch: 中音}
    palace_watcher_2:
      display_name: 宫人乙
      tts: {delivery: 谨慎而认真, timbre: 稳健成熟, pace: 稍慢, pitch: 中低音}
    palace_watcher_3:
      display_name: 宫人丙
      tts: {delivery: 敬畏而兴奋, timbre: 明亮成熟, pace: 中等, pitch: 中音}
    courtier:
      display_name: 廷臣
      tts: {delivery: 正式恭谨，措辞清楚, timbre: 圆润成熟, pace: 中等, pitch: 中音}
    first_officer:
      display_name: 军官甲
      tts: {delivery: 焦虑戒备，说话急切, timbre: 坚实成熟, pace: 稍快, pitch: 中低音}
    second_officer:
      display_name: 军官乙
      tts: {delivery: 忧心直率, timbre: 清晰成熟, pace: 中等, pitch: 中音}
    third_officer:
      display_name: 军官丙
      tts: {delivery: 不安而坚决, timbre: 浑厚成熟, pace: 中等, pitch: 低音}
