  chapters:
    - id: ch01
      title: Seven at One Blow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One summer day, a little tailor sat on his worktable beside the window, sewing for dear life. He was in excellent spirits. Then a peasant woman came down the street, calling again and again that she had good jam for sale. The words sounded very sweet to him. He poked his small, frail head out of the window and called down to her.
        - id: ch01-b02
          speaker: tailor
          text: Come up here, my good woman! You'll find a customer willing to buy.
        - id: ch01-b03
          speaker: narrator
          text: The woman carried her heavy basket up three flights of stairs. In the tailor's room, she had to set every pot out in a row. He inspected each one, lifting it and smelling it, before he finally made his choice.
        - id: ch01-b04
          speaker: tailor
          text: This jam seems good. Weigh me four ounces, my good woman. If it comes to a quarter of a pound, I won't object.
        - id: ch01-b05
          speaker: narrator
          text: The woman had hoped to sell much more. She gave him the little amount he wanted, then left in an angry grumble. The tailor was delighted with his purchase.
        - id: ch01-b06
          speaker: tailor
          text: May heaven bless this jam for me. It will keep me going and make me strong!
        - id: ch01-b07
          speaker: narrator
          text: He took bread from the cupboard, cut off a round slice, and spread the jam over it.
        - id: ch01-b08
          speaker: tailor
          text: That will taste very good. But first, I'll finish this waistcoat. Then I'll take a bite.
        - id: ch01-b09
          speaker: narrator
          text: He put the bread beside him and returned to his sewing. He felt so lighthearted that his stitches grew bigger and bigger. Meanwhile, the sweet smell of jam floated all the way to the ceiling. Heaps of flies were sitting up there, and the smell drew them down in a great swarm. They settled all over the bread.
        - id: ch01-b10
          speaker: tailor
          text: Ha! Who invited all of you?
        - id: ch01-b11
          speaker: narrator
          text: He drove the unwanted guests away, but the flies did not understand English. They came back in even greater numbers. At last the tailor lost his patience. He reached into the chimney corner and snatched up a duster.
        - id: ch01-b12
          speaker: tailor
          text: Just wait. I'll give you something!
        - id: ch01-b13
          speaker: narrator
          text: He struck the flies without mercy. When he stopped and counted, seven of them lay dead with their legs stretched out.
        - id: ch01-b14
          speaker: tailor
          text: What a fierce fellow I am! The whole town must hear about this.
        - id: ch01-b15
          speaker: narrator
          text: Full of admiration for his own courage, he quickly cut out a belt, hemmed it, and stitched great letters across it. They read, "Seven at a blow."
        - id: ch01-b16
          speaker: tailor
          text: The town? No, the whole world shall hear of it!
        - id: ch01-b17
          speaker: narrator
          text: His heart danced for joy, like a lamb wagging its tail.
    - id: ch02
      title: The Giant's Tests
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The tailor fastened the belt around his waist and set off into the wide world. His workshop now seemed far too small a place for such great courage. Before leaving, he looked all around the house for something useful to take on his journey. All he found was an old cheese, so he claimed it and tucked it into his wallet. Outside the house, he noticed a bird caught among some bushes. He freed it and put that in his wallet too, right beside the cheese.
        - id: ch02-b02
          speaker: narrator
          text: He went merrily on his way. Because he was light and nimble, he never grew tired as the road climbed higher. At the top of a hill, he found a mighty giant sitting quietly and looking out over the whole countryside. The tailor walked straight up to him and greeted him cheerfully.
        - id: ch02-b03
          speaker: tailor
          text: Good day, friend! Here you sit, looking over the whole wide world. That's just where I'm going. How would you like to come with me?
        - id: ch02-b04
          speaker: first_giant
          text: You poor, miserable little creature!
          emotion: disgusted
        - id: ch02-b05
          speaker: tailor
          text: That's a good joke. Here, read this and see what sort of fellow I am.
        - id: ch02-b06
          speaker: narrator
          text: He opened his coat and showed the giant his belt. The giant read, "Seven at a blow." He thought the tailor had killed seven men, so he began to respect the little fellow. Still, he wanted to test him. The giant picked up a stone and squeezed until drops of water ran from it.
        - id: ch02-b07
          speaker: first_giant
          text: Now you try. If you're truly strong, do the same.
        - id: ch02-b08
          speaker: tailor
          text: Is that all? That's child's play for me.
        - id: ch02-b09
          speaker: narrator
          text: The tailor reached into his wallet, pulled out the cheese, and pressed it until whey dripped out.
        - id: ch02-b10
          speaker: tailor
          text: Look there. I squeezed mine better than you squeezed yours.
        - id: ch02-b11
          speaker: narrator
          text: The giant had no answer. He could hardly believe such strength in so little a man. For another test, he threw a stone so high that his eyes could barely follow it.
        - id: ch02-b12
          speaker: first_giant
          text: Now then, little pygmy. Let's see you do that.
        - id: ch02-b13
          speaker: tailor
          text: A fine throw, but your stone came down again. I'll throw one that never comes back.
        - id: ch02-b14
          speaker: narrator
          text: He drew the bird from his wallet and tossed it into the air. Delighted to be free, it soared into the sky and never returned.
        - id: ch02-b15
          speaker: tailor
          text: Well, friend? What do you think of that little trick?
        - id: ch02-b16
          speaker: first_giant
          text: You can certainly throw. Now let's find out whether you can carry a proper weight.
        - id: ch02-b17
          speaker: narrator
          text: The giant led him to a huge oak that had been cut down.
        - id: ch02-b18
          speaker: first_giant
          text: If you're strong enough, help me carry this tree out of the wood.
        - id: ch02-b19
          speaker: tailor
          text: Of course. Put the trunk on your shoulder. I'll carry the top and all the branches, since that is clearly the heaviest part.
        - id: ch02-b20
          speaker: narrator
          text: The giant shouldered the trunk. The tailor simply sat at ease among the branches, hidden from the giant's sight. So the giant had to carry the whole tree, with the little tailor as an extra burden. The tailor rode behind him in excellent spirits, whistling a tune as loudly as he could. Anyone listening might have thought that carrying such a tree was nothing but a game. After dragging the crushing weight for some time, the giant could go no farther.
        - id: ch02-b21
          speaker: first_giant
          text: Hey! I have to drop the tree!
        - id: ch02-b22
          speaker: narrator
          text: The tailor sprang down and caught the tree with both hands, pretending he had carried it all the way.
        - id: ch02-b23
          speaker: tailor
          text: Just imagine! A great big fellow like you can't even carry one tree.
    - id: ch03
      title: A Night with the Giants
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They traveled on together until they passed a cherry tree. The giant bent down its top, where the ripest cherries grew, and placed the branches in the tailor's hands so he could eat. But the little man was much too weak to hold the tree down. The moment the giant let go, the tree sprang upright and carried the tailor high into the air. Soon he dropped safely to the ground.
        - id: ch03-b02
          speaker: first_giant
          text: What is this? You aren't strong enough to hold down one weak little branch?
        - id: ch03-b03
          speaker: tailor
          text: Strength had nothing to do with it. Do you think a man who killed seven at one blow would have trouble with that? I jumped over the tree because hunters nearby are firing among the branches. Try it yourself, if you dare.
        - id: ch03-b04
          speaker: narrator
          text: The giant tried, but he could not leap over the tree. Instead, he became tangled in the branches. Once again, the little tailor had beaten him.
        - id: ch03-b05
          speaker: first_giant
          text: You are a fine fellow after all. Come spend the night with us in our cave.
        - id: ch03-b06
          speaker: narrator
          text: The tailor gladly agreed. He followed the giant to a cave where several more giants sat around a fire. Each one held a whole roasted sheep and ate from it. The little tailor looked around.
        - id: ch03-b07
          speaker: tailor
          text: Yes, there is certainly more room to move about here than there was in my workshop.
        - id: ch03-b08
          speaker: narrator
          text: The giant showed him a bed and told him to lie down and sleep well. But the bed was much too large for the little tailor, so he did not climb into it at all. He quietly crept away and settled in a corner instead. At midnight, the giant believed his guest was fast asleep. He rose, took his enormous iron walking stick, and smashed the bed in two with a single blow. Certain that the tailor had been lying there, he thought that was the end of the little grasshopper.
        - id: ch03-b09
          speaker: narrator
          text: At dawn, the giants went into the wood and forgot all about him. Then, without warning, they saw the tailor coming cheerfully along the path. The sight terrified them. Afraid he would kill them, every giant ran away as fast as he could.
    - id: ch04
      title: The King's Champion
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The little tailor went wherever his nose led him. After wandering for a long while, he reached the courtyard of a royal palace. He was tired, so he lay on the grass and fell asleep. People gathered around and studied him. Then they read the words on his belt, "Seven at a blow."
        - id: ch04-b02
          speakers: [palace_watcher_1, palace_watcher_2, palace_watcher_3]
          ensemble: chorus
          text: Oh! Why has this hero of a hundred battles come to our peaceful country? He must be a mighty man of valor.
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: They told the King about the stranger. Such a powerful man would be extremely useful in wartime, they said, and the King should secure his service at any price. The advice pleased the King. He sent a courtier to wait beside the sleeping tailor and offer him a place in the army when he awoke. At last the tailor stretched, opened his eyes, and heard the proposal.
        - id: ch04-b04
          speaker: tailor
          text: That's exactly why I came. I am quite ready to serve the King.
        - id: ch04-b05
          speaker: narrator
          text: He was welcomed with every honor and given a special house of his own. The other officers resented his success and wished he were a thousand miles away.
        - id: ch04-b06
          speakers: [first_officer, second_officer, third_officer]
          ensemble: chorus
          text: What will happen to us now? If we quarrel with him, seven men will fall with every blow. Soon none of us will be left.
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: Together, they decided to resign. They went before the King and handed in their papers.
        - id: ch04-b08
          speakers: [first_officer, second_officer, third_officer]
          ensemble: chorus
          text: We cannot stand against a man who kills seven at one blow.
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: The King was deeply distressed. He did not want to lose all his faithful servants for the sake of one man. He wished he had never laid eyes on the tailor and longed to be rid of him. Yet he did not dare send him away. The hero might kill the King along with his people, then seize the throne for himself. The King thought long and hard before a plan finally came to him. He summoned the tailor, spoke of his fame as a great and warlike hero, and made him an offer.
        - id: ch04-b10
          speaker: king
          text: Two giants live in one of my forests. They rob, murder, burn, and plunder all around them, and anyone who comes near risks his life. Defeat and kill them, and you shall marry my only daughter and receive half my kingdom. You may take one hundred horsemen to help you.
        - id: ch04-b11
          speaker: narrator
          text: The little tailor thought this was just the sort of task for him. A beautiful princess and half a kingdom were not offered every day.
        - id: ch04-b12
          speaker: tailor
          text: Agreed! I'll soon finish those giants. I don't need your hundred horsemen. A fellow who can kill seven men at one blow has nothing to fear from two.
    - id: ch05
      title: Two Giants in the Wood
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The tailor set out with the hundred horsemen following him. At the edge of the wood, he turned to them.
        - id: ch05-b02
          speaker: tailor
          text: Wait here. I'll deal with the giants alone.
        - id: ch05-b03
          speaker: narrator
          text: He entered the wood alone, looking sharply to the right and left as he went. Before long, he found both giants stretched out asleep beneath a tree. Their snores were so powerful that the very branches bent in the breeze. The tailor wasted no time. He filled his wallet with stones, climbed the tree, and worked his way toward the middle. Then he slipped along a branch until he sat directly above the sleepers. From there, he dropped one stone after another on the nearer giant. For a long time, the sleeper noticed nothing. At last he woke and pinched his companion.
        - id: ch05-b04
          speaker: first_giant
          text: Why did you hit me?
        - id: ch05-b05
          speaker: second_giant
          text: I didn't hit you. You must have dreamed it.
        - id: ch05-b06
          speaker: narrator
          text: Both giants settled down again. This time, the tailor dropped a stone on the second one. The giant leaped up.
        - id: ch05-b07
          speaker: second_giant
          text: What was that for? Why did you throw something at me?
        - id: ch05-b08
          speaker: first_giant
          text: I threw nothing at you.
        - id: ch05-b09
          speaker: narrator
          text: They argued for a while. But they were tired, so they made peace and went back to sleep. The tailor began his game once more. He chose the largest stone in his wallet and hurled it with all his strength against the first giant's chest.
        - id: ch05-b10
          speaker: first_giant
          text: That is too much!
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: He sprang up in a fury and knocked his companion against the tree so hard that it shook. The second giant struck back just as fiercely. Soon they were so enraged that they tore trees out by the roots and beat each other with them. At last, both fell dead at the same moment.
        - id: ch05-b12
          speaker: narrator
          text: The little tailor jumped down from his branch.
        - id: ch05-b13
          speaker: tailor
          text: It's lucky they didn't pull up my tree. I would have needed to jump to another like a squirrel, and even for someone as nimble as I am, that would not have been easy.
        - id: ch05-b14
          speaker: narrator
          text: He drew his sword and gave each giant a few deep thrusts in the chest. Then he returned to the horsemen.
        - id: ch05-b15
          speaker: tailor
          text: The deed is done. Both giants are finished. It was no easy fight. They even tore up trees while they tried to defend themselves, but that cannot help against a man who kills seven at one blow.
        - id: ch05-b16
          speakers: [first_horseman, second_horseman, third_horseman]
          ensemble: chorus
          text: Were you wounded?
        - id: ch05-b17
          speaker: tailor
          text: Not at all. They never touched a hair on my head.
        - id: ch05-b18
          speaker: narrator
          text: The horsemen still did not believe him. They had to ride into the wood and see for themselves. There they found both giants lying in their blood, with great trees torn up by the roots and scattered all around them.
    - id: ch06
      title: The Unicorn and the Wild Boar
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The tailor returned and demanded the reward he had been promised. But the King regretted his bargain and searched for another way to be rid of the hero.
        - id: ch06-b02
          speaker: king
          text: Before you receive my daughter's hand and half my kingdom, you must perform one more brave deed. A unicorn is loose in the forest and causing great harm. You must catch it first.
        - id: ch06-b03
          speaker: tailor
          text: One unicorn frightens me even less than two giants. Seven at a blow. That's my motto.
        - id: ch06-b04
          speaker: narrator
          text: He took a length of rope and an axe, then set out for the forest. Once again, he ordered the men who had been sent with him to remain outside and wait. He did not have to search for long. The unicorn soon came by, caught sight of the tailor, and charged straight at him as if it meant to run him through on the spot.
        - id: ch06-b05
          speaker: tailor
          text: Easy now. Not so fast, my friend.
        - id: ch06-b06
          speaker: narrator
          text: The tailor stood still until the unicorn came close. Then he sprang lightly behind a tree. The beast struck the trunk with all its force and drove its horn in so deeply that it could not pull free.
        - id: ch06-b07
          speaker: tailor
          text: Now I've caught my bird.
        - id: ch06-b08
          speaker: narrator
          text: He stepped from behind the tree and first tied the rope around the unicorn's neck. Next, he used his axe to knock the horn loose. Once everything was secure, he led the beast before the King.
        - id: ch06-b09
          speaker: narrator
          text: The King still refused to give the promised reward. He set a third task. The tailor must catch a wild boar that caused great harm in the forest, and he could take the huntsmen as helpers.
        - id: ch06-b10
          speaker: tailor
          text: Gladly. That is only child's play.
        - id: ch06-b11
          speaker: narrator
          text: He did not take the huntsmen into the forest. They were happy to stay behind, because the wild boar had met them before in ways that left them with no wish to meet it again. As soon as the beast saw the tailor, it rushed straight at him. Its mouth was foaming, its teeth were gleaming, and it tried to knock him down. The nimble little man raced into a chapel nearby, crossed the building, and jumped straight out through a window. The boar charged after him into the chapel. While it was still inside, the tailor hurried around to the door and shut it tight.
        - id: ch06-b12
          speaker: narrator
          text: The furious beast was trapped inside the chapel. It was much too heavy and clumsy to leap back through the window. The tailor called the huntsmen together so they could see the prisoner with their own eyes. Then the hero went back to the King and claimed his reward. This time, whether he liked it or not, the King had to keep his word. He gave the tailor his daughter and half the kingdom. If he had known that the supposed warrior before him was only a little tailor, the bargain would have pained him even more.
        - id: ch06-b13
          speaker: narrator
          text: The wedding was celebrated with great splendor and very little joy. And the tailor became a king.
    - id: ch07
      title: The Tailor Remains a King
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Some time later, the Queen heard her husband talking in his sleep one night.
        - id: ch07-b02
          speaker: tailor
          text: My lad, finish that waistcoat and patch those trousers, or I'll box your ears!
        - id: ch07-b03
          speaker: narrator
          text: Those sleeping words told the Queen exactly what rank the young man had been born into. The next day, she went to her father and poured out all her troubles. She begged him to help her get rid of a husband who was nothing more and nothing less than a tailor. The King listened and comforted her.
        - id: ch07-b04
          speaker: king
          text: Leave your bedroom door open tonight. My servants will wait outside. When your husband is sound asleep, they will come in, tie him tightly, and carry him to a ship. It will sail away with him across the wide ocean.
        - id: ch07-b05
          speaker: narrator
          text: The Queen was pleased with the plan. But the tailor's armor-bearer had overheard everything. He was devoted to his young master, so he went straight to him and revealed the whole plot.
        - id: ch07-b06
          speaker: tailor
          text: I'll soon put a stop to that business.
        - id: ch07-b07
          speaker: narrator
          text: That night, the tailor and his wife went to bed at the usual time. When the Queen thought he was asleep, she rose, opened the bedroom door, and lay down again. But the little tailor was only pretending. He suddenly called out in a clear voice.
        - id: ch07-b08
          speaker: tailor
          text: My lad, finish that waistcoat and patch those trousers, or I'll box your ears! I killed seven at one blow. I slew two giants, led a unicorn home captive, and caught a wild boar. Why should I fear the men waiting outside my door?
        - id: ch07-b09
          speaker: narrator
          text: When the servants heard those words, they were terrified. They fled as if a wild army were chasing them, and never dared go near him again.
        - id: ch07-b10
          speaker: narrator
          text: So the little tailor was a king, and remained a king all the days of his life.
