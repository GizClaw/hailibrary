audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    miller:
      display_name: 磨坊主
      tts: {delivery: 殷勤夸张而爱慕虚荣, timbre: 成熟朴实, pace: 中等, pitch: 中低音}
    king:
      display_name: 国王
      tts: {delivery: 威严强硬而贪得无厌, timbre: 成熟浑厚, pace: 从容, pitch: 中低音}
    miller_daughter:
      display_name: 磨坊主的女儿
      tts: {delivery: 温柔诚恳而富有韧性, timbre: 年轻清亮, pace: 中等, pitch: 中高音}
    manikin:
      display_name: 小矮人
      tts: {delivery: 狡黠执拗而捉摸不定, timbre: 尖细紧绷, pace: 稍快, pitch: 高音}
    messenger:
      display_name: 王后的使者
      tts: {delivery: 忠实干练而直截了当, timbre: 清晰结实, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 稻草变金子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷磨坊主，生了一个十分美丽的女儿。一天，他去觐见国王。为了让自己显得了不起，磨坊主竟夸口说，女儿能把稻草纺成金子。
        - id: ch01-b02
          speaker: king
          text: 这本事倒很有用。你女儿要是真有那么能干，明天就把她带进宫来，让我亲自考考她。
        - id: ch01-b03
          speaker: narrator
          text: 第二天，姑娘被带到国王面前。国王领她走进一间堆满稻草的屋子，给了她一架纺车和一根纺锤。
        - id: ch01-b04
          speaker: king
          text: 马上动手，从现在一直纺到天亮。明早之前，若不能把这些稻草全纺成金子，你就得死。
        - id: ch01-b05
          speaker: narrator
          text: 国王关上门，把姑娘独自留在里面。可怜的姑娘坐下来，根本不知道怎么办。她压根儿不懂稻草怎样才能变成金子，越想越绝望，终于哭了起来。忽然，房门打开，一个小矮人走了进来。
        - id: ch01-b06
          speaker: manikin
          text: 晚上好，磨坊家的姑娘。你怎么哭得这么伤心？
        - id: ch01-b07
          speaker: miller_daughter
          text: 我得把这些稻草纺成金子，可我一点儿也不知道该怎么做。
          emotion: sad
        - id: ch01-b08
          speaker: manikin
          text: 要是我替你纺，你愿意拿什么来换？
        - id: ch01-b09
          speaker: miller_daughter
          text: 我把项链给你。
        - id: ch01-b10
          speaker: narrator
          text: 小矮人收下项链，坐到纺车前。呼啦，呼啦，呼啦！轮子转了三圈，线轴便装满了。他换上一只新线轴，轮子又转三圈，第二只也满了。他就这样不停地纺到天亮。屋里的稻草全不见了，每只线轴上都缠满了金子。
        - id: ch01-b11
          speaker: narrator
          text: 太阳刚升起来，国王便赶来了。眼前的金子让他又惊又喜，可他的心也因此变得更加贪婪。

    - id: ch02
      title: 另外两个夜晚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王命人把磨坊主的女儿带进另一间屋子。这里比先前大得多，里面也堆满了稻草。
        - id: ch02-b02
          speaker: king
          text: 你要是还想活命，明早以前就把这些全纺成金子。
        - id: ch02-b03
          speaker: narrator
          text: 姑娘仍旧毫无办法，只能伤心地哭。房门像上次一样打开，小矮人又来了。
        - id: ch02-b04
          speaker: manikin
          text: 这次要我替你纺，你拿什么给我？
        - id: ch02-b05
          speaker: miller_daughter
          text: 我把手上的戒指给你。
        - id: ch02-b06
          speaker: narrator
          text: 小矮人拿走戒指，坐回纺车前。轮子又呼啦呼啦地转起来。天亮时，所有稻草都成了闪闪发光的金子。
        - id: ch02-b07
          speaker: narrator
          text: 国王看得喜不自胜，可这些金子还是填不满他的贪心。他把姑娘带进第三间屋子。这一间更大，照样塞满了稻草。
        - id: ch02-b08
          speaker: king
          text: 今夜把这里的稻草全纺完。这次若能成功，你就做我的妻子。
        - id: ch02-b09
          speaker: narrator
          text: 国王心想，姑娘虽只是磨坊主的女儿，可就算找遍全世界，自己也找不到更富有的妻子了。姑娘独自留下后，小矮人第三次出现。
        - id: ch02-b10
          speaker: manikin
          text: 要我再帮你一次，你还能给我什么？
        - id: ch02-b11
          speaker: miller_daughter
          text: 我已经没有东西可给你了。
        - id: ch02-b12
          speaker: manikin
          text: 那就答应我，等你做了王后，把头一个孩子送给我。
        - id: ch02-b13
          speaker: narrator
          text: 姑娘想着，等到那一天，还不知道会发生什么事。何况眼下再没有别的活路，她只好答应。小矮人再次把稻草纺成金子。第二天一早，国王看见一切正合心意，立刻娶了她。磨坊主的女儿就这样成了王后。

    - id: ch03
      title: 到期的承诺
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一年过去，王后生下一个漂亮的儿子。她早把小矮人的事忘了。谁知有一天，小矮人突然走进她的房间。
        - id: ch03-b02
          speaker: manikin
          text: 现在，把你答应我的东西交出来吧。
        - id: ch03-b03
          speaker: narrator
          text: 王后吓得六神无主。她愿意把王国里所有财宝都送给小矮人，只求他把孩子留在自己身边。
        - id: ch03-b04
          speaker: manikin
          text: 不行。在我眼里，活生生的生命比世上一切财宝都珍贵。
        - id: ch03-b05
          speaker: narrator
          text: 王后听了，哭得伤心欲绝。小矮人见她如此难过，竟也动了恻隐之心。
        - id: ch03-b06
          speaker: manikin
          text: 我给你三天猜我的名字。只要三天之内猜中，孩子便留给你。
        - id: ch03-b07
          speaker: narrator
          text: 王后整夜没有合眼，把听过的名字全想了一遍。她又派使者走遍全国，到远近各处搜寻能找到的每一个名字。

    - id: ch04
      title: 寻找名字
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，小矮人来了。王后先猜卡斯帕、梅尔基奥尔、伯沙撒，又一口气说出所有想得到的名字。可无论她说哪一个，小矮人都只有同一句回答。
        - id: ch04-b02
          speaker: manikin
          text: 那不是我的名字。
        - id: ch04-b03
          speaker: narrator
          text: 到了第二天，王后又派人打听附近所有人的姓名。小矮人出现时，她已经列出一长串最少见、最古怪的名字。
        - id: ch04-b04
          speaker: miller_daughter
          text: 你会不会叫羊腿杆？还是弯腿杆？难道叫细腿杆？
        - id: ch04-b05
          speaker: manikin
          text: 都不是。那不是我的名字。
        - id: ch04-b06
          speaker: narrator
          text: 第三天，使者回来禀报。
        - id: ch04-b07
          speaker: messenger
          text: 我没找到什么新名字。不过，我走到树林拐角外的一座高山上。那里狐狸和野兔也会互道晚安。我看见一幢小屋，屋前烧着一堆火。一个模样古怪极了的小矮人正绕着火单脚蹦跳，还唱着一首歌。
        - id: ch04-b08
          speaker: messenger
          text: 明天酿酒，今天烤饼，然后把王后的孩子抱定。她怎么也猜不到我这姓名，我就叫作鲁姆佩尔施蒂尔茨金！
        - id: ch04-b09
          speaker: narrator
          text: 听见这个名字，王后有多欢喜，谁都想象得到。

    - id: ch05
      title: 鲁姆佩尔施蒂尔茨金
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 没过多久，小矮人走进了王后的房间。
        - id: ch05-b02
          speaker: manikin
          text: 好了，王后娘娘，我到底叫什么名字？
        - id: ch05-b03
          speaker: miller_daughter
          text: 你叫康拉德吗？
        - id: ch05-b04
          speaker: manikin
          text: 不叫。
        - id: ch05-b05
          speaker: miller_daughter
          text: 那么，你叫哈里吗？
        - id: ch05-b06
          speaker: manikin
          text: 不叫。
        - id: ch05-b07
          speaker: miller_daughter
          text: 那你会不会叫鲁姆佩尔施蒂尔茨金？
        - id: ch05-b08
          speaker: manikin
          text: 一定是哪个恶魔告诉了你！一定是哪个恶魔告诉了你！
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: 小矮人怒火冲天，用右脚狠狠一跺，整条腿陷进地里，一直没到腰间。接着，他又狂怒地用两手抓住左脚，竟把自己撕成了两半。
