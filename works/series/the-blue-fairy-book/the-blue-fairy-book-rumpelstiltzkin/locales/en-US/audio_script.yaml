audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried
        timbre: clear and story-rich
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: commanding but deeply feeling
        timbre: full and mature
        pace: measured
        pitch: medium-low
    miller:
      display_name: The Miller
      tts:
        delivery: eager and boastful
        timbre: rustic and mature
        pace: steady
        pitch: medium-low
    miller_daughter:
      display_name: The Miller's Daughter
      tts:
        delivery: gentle and earnest
        timbre: youthful and clear
        pace: measured
        pitch: medium-high
    manikin:
      display_name: The Little Man
      tts:
        delivery: sly and insistent
        timbre: small and wiry
        pace: brisk
        pitch: high
    messenger:
      display_name: The Queen's Messenger
      tts:
        delivery: dutiful and direct
        timbre: clear and sturdy
        pace: steady
        pitch: medium
  chapters:
    - id: ch01
      title: Straw into Gold
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a poor miller with a very beautiful daughter. One day, the miller had an audience with the King. He wanted to seem important, so he made a great boast about her.
        - id: ch01-b02
          speaker: miller
          text: My daughter can spin straw into gold.
        - id: ch01-b03
          speaker: king
          text: Now that is a useful talent. If she is as clever as you claim, bring her to my palace tomorrow. I will put her to the test.
        - id: ch01-b04
          speaker: narrator
          text: The next day, the miller's daughter was brought before the King. He led her into a room filled with straw and gave her a spinning wheel and a spindle.
        - id: ch01-b05
          speaker: king
          text: Get to work. Spin all night until dawn. If this straw has not become gold by morning, you will die.
        - id: ch01-b06
          speaker: narrator
          text: The King shut the door and left her there alone. The poor girl sat down without the faintest idea what to do. She did not know how anyone could spin straw into gold. At last, she became so miserable that she began to cry.
        - id: ch01-b07
          speaker: narrator
          text: Suddenly, the door opened, and a tiny little man stepped into the room.
        - id: ch01-b08
          speaker: manikin
          text: Good evening, Miss Miller-maid. Why are you crying so bitterly?
        - id: ch01-b09
          speaker: miller_daughter
          text: I have to spin this straw into gold, and I have no idea how to do it.
        - id: ch01-b10
          speaker: manikin
          text: What will you give me if I spin it for you?
        - id: ch01-b11
          speaker: miller_daughter
          text: You may have my necklace.
        - id: ch01-b12
          speaker: narrator
          text: The little man took the necklace and sat down at the wheel. Whir, whir, whir! Three times the wheel went around, and the bobbin was full. He put on a fresh bobbin. Again the wheel went whir, whir, whir, and that one filled too. He worked on until morning. By then, every bit of straw was gone, and every bobbin held gold.
        - id: ch01-b13
          speaker: narrator
          text: The King came as soon as the sun rose. The sight of all that gold amazed and delighted him. But now he wanted the precious metal more than ever.
    - id: ch02
      title: Two More Nights
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The King had the miller's daughter taken to another room, much larger than the first and filled with even more straw.
        - id: ch02-b02
          speaker: king
          text: If you value your life, spin every bit of this into gold before tomorrow morning.
        - id: ch02-b03
          speaker: narrator
          text: Once again, the girl did not know what to do. She began to cry. Then the door opened just as it had before, and the tiny man appeared.
        - id: ch02-b04
          speaker: manikin
          text: What will you give me if I turn this straw into gold for you?
        - id: ch02-b05
          speaker: miller_daughter
          text: You may have the ring from my finger.
        - id: ch02-b06
          speaker: narrator
          text: The little man took the ring. Whir! Around went the spinning wheel once more. When morning came, he had turned all the straw into glittering gold.
        - id: ch02-b07
          speaker: narrator
          text: The King could hardly contain his pleasure when he saw it. Still, even all that gold did not satisfy his greed. He brought the miller's daughter to a third room. It was larger yet, and it too was packed with straw.
        - id: ch02-b08
          speaker: king
          text: You must spin all of this tonight. Succeed once more, and you shall become my wife.
        - id: ch02-b09
          speaker: narrator
          text: The King knew she was only a miller's daughter. Even so, he thought he could search the whole world and never find a richer wife.
        - id: ch02-b10
          speaker: narrator
          text: When the girl was alone, the little man came to her for the third time.
        - id: ch02-b11
          speaker: manikin
          text: What will you give me if I spin the straw for you again?
        - id: ch02-b12
          speaker: miller_daughter
          text: I have nothing left to give you.
        - id: ch02-b13
          speaker: manikin
          text: Then promise me your first child after you become Queen.
        - id: ch02-b14
          speaker: narrator
          text: The miller's daughter wondered what might happen before such a promise ever came due. More than that, she saw no other way to save herself. So she agreed to his demand.
        - id: ch02-b15
          speaker: narrator
          text: The little man went to work and spun the straw into gold once again. In the morning, the King found everything just as he wished. He married her at once, and the miller's daughter became a queen.
    - id: ch03
      title: The Promise Comes Due
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A year passed, and the Queen gave birth to a beautiful son. She had forgotten all about the little man. Then one day, without warning, he stepped into her room.
        - id: ch03-b02
          speaker: manikin
          text: Now give me what you promised.
        - id: ch03-b03
          speaker: narrator
          text: The Queen was terribly distressed. She offered him every treasure in the kingdom if only he would leave her child with her.
        - id: ch03-b04
          speaker: manikin
          text: No. A living creature is dearer to me than all the treasure in the world.
        - id: ch03-b05
          speaker: narrator
          text: The Queen began to weep and sob so bitterly that the little man felt sorry for her.
        - id: ch03-b06
          speaker: manikin
          text: I will give you three days to guess my name. Find it before the time is up, and you may keep your child.
        - id: ch03-b07
          speaker: narrator
          text: The Queen stayed awake all night, thinking over every name she had ever heard. She also sent a messenger across the land to gather names from far and near.
    - id: ch04
      title: The Search for a Name
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The little man returned the next day. The Queen began with the names Kasper, Melchior, and Belshazzar. Then she recited every other name she knew, one after another. Each time, he gave the same answer.
        - id: ch04-b02
          speaker: manikin
          text: That is not my name.
        - id: ch04-b03
          speaker: narrator
          text: On the second day, the Queen asked about the names of everyone in the neighborhood. By the time the little man appeared, she had prepared a long list of the strangest names she could find.
        - id: ch04-b04
          speaker: miller_daughter
          text: Could your name be Sheepshanks? Or Cruickshanks? Perhaps it is Spindleshanks?
        - id: ch04-b05
          speaker: manikin
          text: No. None of those is my name.
        - id: ch04-b06
          speaker: narrator
          text: On the third day, the messenger came back to the Queen with his report.
        - id: ch04-b07
          speaker: messenger
          text: I could not find any new names. But near the corner of the wood, I climbed a high hill where the foxes and hares bid each other good night. There I saw a little house. A fire burned in front of it, and the strangest little man was hopping around the flames on one leg. He was singing something.
        - id: ch04-b08
          speaker: messenger
          text: Tomorrow I brew, today I bake, and then the child away I'll take. For little dreams my royal dame that Rumpelstiltzkin is my name!
        - id: ch04-b09
          speaker: narrator
          text: You can imagine how delighted the Queen was when she heard that name.
    - id: ch05
      title: Rumpelstiltzkin
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A short while later, the little man stepped into her room.
        - id: ch05-b02
          speaker: manikin
          text: Well, my lady Queen, what is my name?
        - id: ch05-b03
          speaker: miller_daughter
          text: Is your name Conrad?
        - id: ch05-b04
          speaker: manikin
          text: No.
        - id: ch05-b05
          speaker: miller_daughter
          text: Is it Harry?
        - id: ch05-b06
          speaker: manikin
          text: No.
        - id: ch05-b07
          speaker: miller_daughter
          text: Then perhaps your name is Rumpelstiltzkin.
        - id: ch05-b08
          speaker: manikin
          text: Some demon told you that! Some demon told you that!
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: The little man screamed with rage. He stamped his right foot so hard that it sank into the ground up to his waist. Then, in a fury, he seized his left foot with both hands and tore himself in two.
