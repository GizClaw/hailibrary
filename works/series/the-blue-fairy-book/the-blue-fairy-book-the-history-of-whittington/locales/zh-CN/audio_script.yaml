audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    whittington:
      display_name: 惠廷顿
      tts: {delivery: 朴实真诚，从怯弱渐至自信, timbre: 清朗年轻, pace: 中等, pitch: 中音}
    stranger:
      display_name: 陌生人
      tts: {delivery: 粗暴而不耐烦, timbre: 干硬粗哑, pace: 稍快, pitch: 中低音}
    cook:
      display_name: 厨娘西塞莉
      tts: {delivery: 刻薄凶悍, timbre: 尖利粗重, pace: 快, pitch: 中高音}
    fitzwarren:
      display_name: 菲茨沃伦先生
      tts: {delivery: 正直宽厚而有商人气派, timbre: 温厚结实, pace: 从容, pitch: 中低音}
    alice:
      display_name: 艾丽斯小姐
      tts: {delivery: 温柔善良, timbre: 柔亮清澈, pace: 舒缓, pitch: 中高音}
    noble:
      display_name: 摩尔贵族
      tts: {delivery: 恭敬而深受困扰, timbre: 平稳浑厚, pace: 中等, pitch: 中低音}
    factor:
      display_name: 押货员
      tts: {delivery: 机敏自信，善于交涉, timbre: 明亮利落, pace: 中等有变化, pitch: 中音}
    king:
      display_name: 摩尔国王
      tts: {delivery: 威严中带着急切, timbre: 洪亮饱满, pace: 中等, pitch: 低音}
    queen:
      display_name: 摩尔王后
      tts: {delivery: 好奇热切又略显胆怯, timbre: 柔润明亮, pace: 稍快, pitch: 中高音}
    captain:
      display_name: 船长
      tts: {delivery: 爽朗可靠, timbre: 低沉清晰, pace: 中等, pitch: 低音}
    onlooker:
      display_name: 在场的人
      tts: {delivery: 现实而迟疑, timbre: 平实, pace: 中等, pitch: 中音}
    henry_v:
      display_name: 亨利五世
      tts: {delivery: 庄重赞许, timbre: 洪亮沉稳, pace: 从容, pitch: 低音}
  chapters:
    - id: ch01
      title: 流落伦敦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 迪克·惠廷顿很小就失去了父母，小得连他们的模样和自己的出生地都不记得。他衣衫破烂，像匹没人照料的小马驹，独自在乡间流浪。后来，一位去伦敦的赶车人答应让他免费跟在货车旁走，但一路都得靠自己的双脚。惠廷顿仍旧满心欢喜，因为他早就想看看伦敦。他听人说那里的街道铺满黄金，恨不得能装上一蒲式耳带走。可到了伦敦，他只看见满街污泥，半点黄金也没有。举目无亲的孩子没钱，也没东西吃，很快便冻得发抖，饿得发昏。他想念乡下温暖的厨房和炉火。更糟的是，赶车人进城后便装作不认识他。
        - id: ch01-b02
          speaker: narrator
          text: 惠廷顿四处求人施舍，有个陌生人却冲他发火。
        - id: ch01-b03
          speaker: stranger
          text: 懒鬼，别讨饭了，去干活！
          emotion: angry
        - id: ch01-b04
          speaker: whittington
          text: 我愿意干。只要您肯用我，我一定好好做。
        - id: ch01-b05
          speaker: narrator
          text: 陌生人误以为他在耍聪明、故意顶嘴，举起手杖打破了他的头。其实，惠廷顿只想让人知道自己真的愿意做工。他流着血，又因为三天没吃东西，晕倒在商人菲茨沃伦先生门前。刻薄的厨娘西塞莉发现了他，非但没有怜悯，还威胁说再不滚开，就拿开水烫他。菲茨沃伦先生恰好从交易所回来，不知道他的遭遇，也叫这孩子去做工。
        - id: ch01-b06
          speaker: whittington
          text: 先生，只要有人肯雇我，我巴不得做事。给我一点吃的，我就有力气了。我是乡下来的，在这里谁也不认识，没有人肯用我。
        - id: ch01-b07
          speaker: narrator
          text: 他想证明自己不是懒鬼，挣扎着站起来，却虚弱得又跌了下去。商人这才明白他确实饿坏了，也动了恻隐之心，叫仆人把他扶进屋，给他饭和水，再让他留在厨房，凡是厨娘交代的脏活都可以帮着做。说起来，责怪乞讨的人懒惰很容易，可若既不帮他找一条做工的门路，也不问他还有没有力气做工，那就不叫慈善。
        - id: ch01-b08
          speaker: narrator
          text: 菲茨沃伦一家待人厚道，惠廷顿本可以过得很好，偏偏厨娘总拿他出气。她整天忙着烤肉、往肉上浇油。只要烤叉一停，她那双手就落到可怜的惠廷顿身上。艾丽斯小姐知道后很同情他，吩咐所有仆人都要好好待他。可阁楼上的床也叫他不得安生。主人给他铺了一张絮屑床垫，那里却鼠群成灾，夜里常从他鼻子上跑过去，一次次把他惊醒。
        - id: ch01-b09
          speaker: narrator
          text: 一天，一位来做客的绅士请惠廷顿擦鞋，给了他一便士作为酬谢。他把钱仔细收好，一心要用在最要紧的地方。第二天，他在街上看见一个女人抱着猫，便跑去问价。那是只捕鼠能手，本来值不少钱。女人听说惠廷顿全世界只有一便士，又急需一只猫，终于答应卖给他。惠廷顿把猫悄悄养在阁楼，免得厨娘也拿她出气。猫很快捉光或吓跑了老鼠，他总算能像停下来的陀螺一样沉沉入睡。
        - id: ch01-b10
          speaker: narrator
          text: 不久，菲茨沃伦先生的一艘船要出海。他照往常的规矩，让每个仆人拿出自己的东西随船贸易，既不收运费，也不收关税，好让穷人也能试试运气。他相信，自己愿意让穷人分享福气，上帝也会赐给他更多福分。别人都来了，只有一无所有的惠廷顿躲着不敢出现。艾丽斯猜到他是因为贫穷才避开，便把他叫来，还想替他出一件货物，却被父亲拦住了。
        - id: ch01-b11
          speaker: fitzwarren
          text: 要送上船的，必须是他自己的东西。
        - id: ch01-b12
          speaker: whittington
          text: 我只有那只猫。她是我用别人赏的一便士买来的。
        - id: ch01-b13
          speaker: fitzwarren
          text: 那就把猫抱来，送她出海碰碰运气。
        - id: ch01-b14
          speaker: narrator
          text: 惠廷顿抱来可怜的小猫，含着眼泪把她交给船长。他舍不得这个唯一的伙伴，也说猫一离开，阁楼里的老鼠一定又会像从前那样搅扰自己。众人都把这次奇怪的投资当成笑话，笑个不停。只有艾丽斯没有笑。她可怜这个失去伙伴的孩子，给了他一点钱，让他再买一只猫。
    - id: ch02
      title: 鲍教堂的钟声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 猫在海上迎着风浪远行，惠廷顿却在家中继续受苦。西塞莉下手越来越狠，还不停拿他把猫送上船这件事取笑。诸圣节清晨，他终于忍无可忍，收拾起仅有的几样东西，趁天还很早逃走了。他一直走到霍洛韦，才在一块石头上坐下，仔细盘算接下来该往哪里去。就在他苦苦思量时，鲍教堂仅有的六口钟响了。钟声传到远处，仿佛一遍遍唱着。
        - id: ch02-b02
          speaker: narrator
          text: “回来吧，惠廷顿。你会三次当上伦敦市长。”
        - id: ch02-b03
          speaker: whittington
          text: 伦敦市长！为了坐上那辆漂亮马车，还有什么苦不能忍？我宁可再挨西塞莉的打，也不能错过这个机会。
        - id: ch02-b04
          speaker: narrator
          text: 想到自己也许真能当上市长，还能坐进华丽的马车，他立刻回头往菲茨沃伦家赶。幸好他在西塞莉露面以前就溜进了屋，谁也没有发现他逃走过。他放好行李，像平常一样干起活来。
    - id: ch03
      title: 猫小姐漂洋过海
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 现在该去看看猫小姐了。海上的风浪变幻不定，水手的生活总伴随着意外。她乘坐的船在海上颠簸许久，最后被逆风吹到巴巴里海岸。当地摩尔人从未见过英国人，却很客气地接待他们。船长想同这里的人做生意，便拿出货样，还托人送了一些给国王。国王十分喜欢，召船长和押货员进宫。王宫离海边约有一英里。客人依照当地习俗坐在金银织花的华丽地毯上，国王和王后则坐在大厅上首。丰盛的晚餐一道道端上来，可盘子刚刚落桌，成群老鼠便从四面涌出，转眼吃光了一切。
        - id: ch03-b02
          speaker: factor
          text: 这些害兽天天这样闯进来，难道你们不厌烦吗？
        - id: ch03-b03
          speaker: noble
          text: 怎么不厌烦！国王愿拿一半财宝换个清净。它们不但毁掉饭菜，还闯进寝宫、爬上床。陛下睡觉时都得有人守着。
        - id: ch03-b04
          speaker: narrator
          text: 押货员想起可怜的惠廷顿和他的猫，高兴得跳起来。他告诉国王，船上正有一种动物，马上就能除掉所有老鼠。这个消息让国王的心猛地一跳，他激动得连头巾都从头上掉了下来。
        - id: ch03-b05
          speaker: king
          text: 快把她带来！只要她真有这个本领，我就用满船黄金珠宝换她。
        - id: ch03-b06
          speaker: narrator
          text: 押货员很懂得做生意。他先把猫小姐的本领大大夸奖一番，又为难地说，一旦失去她，船上的老鼠就可能毁掉全部货物。不过，为了让国王称心，他还是愿意冒这个险，把猫抱来。
        - id: ch03-b07
          speaker: queen
          text: 快去吧！我真想立刻见到这个可爱的宝贝。
        - id: ch03-b08
          speaker: narrator
          text: 宫里忙着重新准备一桌饭菜，押货员飞奔回船。等他抱着猫赶回王宫，老鼠正在吞吃新摆上的第二桌宴席。猫一落地就扑进鼠群，顷刻杀死了许多只。国王看见这么小的动物消灭了多年的宿敌，欢喜极了。王后也十分喜欢，赶紧请人把猫抱近，好让她仔细看看。可想到刚才那场鼠群大战，她又往后一缩，不敢伸手。
        - id: ch03-b09
          speaker: factor
          text: 咪咪，过来。瞧，她其实很温顺。
        - id: ch03-b10
          speaker: queen
          text: 蜜蜜，蜜蜜！
        - id: ch03-b11
          speaker: narrator
          text: 王后还没学会英语，把“咪咪”叫成了“蜜蜜”。看见押货员轻轻抚摸猫，她才鼓起勇气，试着伸手碰了碰。押货员便把猫放在她膝上。猫一点也不凶，呼噜呼噜地玩着王后的手。玩累以后，她仍在低声呼噜，仿佛给自己唱着催眠曲，不一会儿就安稳地睡着了。
        - id: ch03-b12
          speaker: narrator
          text: 国王亲眼见过猫小姐的功绩，又听说这只猫将来生下的小猫足以遍布全国，便同船长和押货员谈妥生意，买下船上全部货物。至于这只猫，他付出的黄金珠宝竟是其余货物总价的十倍。船长和押货员向国王、王后以及宫中显贵一一道别，随后乘着顺风回英国去了。
    - id: ch04
      title: 猫带回的财富
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一天清晨，天才蒙蒙亮，菲茨沃伦先生已经起床了。他照常走进账房，在书桌前坐下，准备清点钱款，再安排当天的生意。四周还静悄悄的，门上忽然传来笃、笃两声敲门声。
        - id: ch04-b02
          speaker: fitzwarren
          text: 谁在外面？
        - id: ch04-b03
          speaker: captain
          text: 一个朋友。
        - id: ch04-b04
          speaker: fitzwarren
          text: 哪有朋友在这个时候登门？
        - id: ch04-b05
          speaker: captain
          text: 真朋友什么时候来都不算晚。我带来了独角兽号的好消息。
        - id: ch04-b06
          speaker: narrator
          text: 商人听见独角兽号，急得站起身，连自己的痛风都忘了，立刻赶去开门。门外站着的正是船长和押货员。他们带回一张货单，手中还捧着一匣珠宝。菲茨沃伦先生抬眼望天，感谢上天赐下这样顺利的航程。等两人讲完猫在摩尔王宫的奇遇，又打开那匣替惠廷顿带回的珠宝，他便万分认真地吟出两句不太像诗的诗。
        - id: ch04-b07
          speaker: fitzwarren
          text: 快去请他来，告诉他美名远扬。从今往后，要请惠廷顿先生登堂。
        - id: ch04-b08
          speaker: narrator
          text: 我们只讲历史，不评诗，所以不必追究这两句写得怎样。菲茨沃伦先生是不是好诗人，我们无从证明。不过，他是个好人，而且这远比会写诗重要。在场有人觉得，这么多财宝不该全给一个穷孩子。
        - id: ch04-b09
          speaker: onlooker
          text: 惠廷顿不过是厨房里的穷孩子，这份财宝给他太多了吧。
        - id: ch04-b10
          speaker: fitzwarren
          text: 上帝不许我扣下他一个便士。这本来就是他的，哪怕一个法新也不能少。
        - id: ch04-b11
          speaker: narrator
          text: 商人马上叫人请惠廷顿进来。这时，惠廷顿正在打扫厨房。他说账房才收拾得干干净净，自己鞋上却满是泥，鞋底还钉着大头钉，实在不该走进去。商人仍旧坚持让他进门，还叫人搬来一把椅子，请他坐下。惠廷顿想起自己在厨房里屡次受人戏弄，以为眼前的人又要拿他寻开心，越发惶恐不安。
        - id: ch04-b12
          speaker: whittington
          text: 先生，求您别拿我这个老实的穷人取笑。我从没想害谁，还是让我回去干活吧。
        - id: ch04-b13
          speaker: fitzwarren
          text: 惠廷顿先生，我没有开玩笑。我请你来，是要恭喜你交了好运。那只猫替你挣来的钱，比我的全部家产还多。愿你长久享有财富，过得幸福。
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: 他们把财宝一样样摆给惠廷顿看，耐心告诉他，这一切确实全都属于他。他终于相信了，便跪下感谢全能的上帝始终眷顾自己这个穷苦无依的人。随后，他把全部财宝放在主人脚边，请主人收下。菲茨沃伦先生却分文不取，只说自己真心为他的好运高兴，希望这笔财富能带给他安稳与幸福。惠廷顿又去请女主人和好朋友艾丽斯收下一份。她们同样拒绝，只祝他拥有世间一切幸福。
        - id: ch04-b15
          speaker: narrator
          text: 惠廷顿没有把财富独占。他重谢船长、押货员和全体水手，因为他们一路照料了他的货物。他又给家中每个仆人送了礼物，甚至没有忘记从前的死对头厨娘，尽管她实在不配得到。菲茨沃伦先生劝他把裁缝和其他所需的人请来，好好梳洗，换上绅士的衣裳，还请他继续住在自己家里，直到找到更好的住处。
        - id: ch04-b16
          speaker: narrator
          text: 惠廷顿洗净脸庞，请人卷好头发，再换上一整套华贵衣裳，立刻成了文雅俊秀的青年。财富很能给人增添信心。没过多久，他便渐渐摆脱了从前那副畏缩腼腆的模样。那种畏缩，本来就不是他的天性，而是长久受苦、心情低落留下的痕迹。如今他变得活泼开朗，也成了讨人喜欢的好伙伴。艾丽斯从前只是怜悯他，如今却真正爱上了他。
    - id: ch05
      title: 三任伦敦市长
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 菲茨沃伦先生看出两个年轻人彼此爱慕，便亲自提议让他们结为夫妻。惠廷顿和艾丽斯都欢欢喜喜地答应了。婚礼十分隆重。伦敦市长、市参议会、治安官、书商公会、皇家艺术学院和许多显赫商人都来参加，并在特意为这场喜事举办的盛大宴会上受到款待。
        - id: ch05-b02
          speaker: narrator
          text: 历史继续告诉我们，惠廷顿和艾丽斯婚后生活幸福，养育了好几个孩子，两人一直活到高龄才离开人世。惠廷顿后来担任过伦敦治安官，也果真像鲍教堂的钟声预言的那样，三次当选伦敦市长。最后一次任市长时，亨利五世刚刚征服法国归来。惠廷顿设下宴席，隆重招待国王和王后。国王敬佩他的功绩，当众赞叹。
        - id: ch05-b03
          speaker: henry_v
          text: 从没有哪位君王拥有过这样的臣民。
        - id: ch05-b04
          speaker: whittington
          text: 也从没有哪个臣民拥有过这样的君王。
        - id: ch05-b05
          speaker: narrator
          text: 这句回答也传到了国王耳中。不久，国王因为敬重惠廷顿的高尚品格，正式封他为理查德爵士。在去世前的许多年里，理查德爵士一直供养大批贫苦市民。他建起一座教堂和一所附设的学院，每年拨出款项资助穷学生，还在附近兴建了一所济贫医院。他也修建了关押犯人的纽盖特监狱，并慷慨捐助圣巴托洛缪医院和其他公益慈善事业。
