  chapters:
    - id: ch01
      title: The Boy Who Came to London
      blocks:
      - id: ch01-b01
        speaker: narrator
        text: Dick Whittington was very small when his father and mother died. He was so young that he never knew them, or even the place where he had been born. Ragged as a stray colt, he wandered through the country until he met a wagoner bound for London. The man let Dick walk beside the wagon all the way without charging him for the journey.
      - id: ch01-b02
        speaker: narrator
        text: Dick was delighted. More than anything, he longed to see London. He had heard its streets were paved with gold, and he meant to gather a whole bushel of it. But what a disappointment awaited the poor boy. Instead of gold, he found streets covered with dirt. He stood in a strange city where he had no friend, no food, and no money.
      - id: ch01-b03
        speaker: narrator
        text: The wagoner had been kind enough on the road, but once they reached town, he took care not to know Dick. Before long, the boy was so cold and hungry that he wished he were back in some country kitchen beside a warm fire.
      - id: ch01-b04
        speaker: narrator
        text: In his misery, Dick begged from several people. One man answered him roughly.
      - id: ch01-b05
        speaker: stranger
        text: Go and work, you idle rogue.
        emotion: angry
      - id: ch01-b06
        speaker: whittington
        text: Gladly! Let me work for you, and I will do it with all my heart.
      - id: ch01-b07
        speaker: narrator
        text: Dick only meant to show how ready he was to work. The man thought the answer was cheeky and clever, and struck him with a stick. The blow cut Dick's head, and blood ran down his face.
      - id: ch01-b08
        speaker: narrator
        text: Weak from three days without food, Dick lay down outside the door of Mr. Fitzwarren, a merchant. The cook saw him there. She was an ill-natured woman and threatened to scald him if he did not go away. Just then, Mr. Fitzwarren returned from the Exchange. He too began scolding the boy and told him to find work.
      - id: ch01-b09
        speaker: whittington
        text: I would be glad to work if anyone would hire me. I could do it if I had something to eat. I have eaten nothing for three days. I am only a poor country boy here. I know no one, and no one will employ me.
        emotion: sad
      - id: ch01-b10
        speaker: narrator
        text: Dick tried to stand, but he was so weak that he fell again. The sight moved the merchant to pity. He told the servants to carry Dick inside and give him food and drink. After that, the boy could help the cook with whatever dirty jobs she had for him. People are quick to accuse those who beg of being idle. Yet they often make no effort to put work within reach, or even ask whether a hungry person is able to do it. That is not charity.
      - id: ch01-b11
        speaker: narrator
        text: Dick might have been happy in that worthy household, but the cross cook knocked him about. If she was not roasting or basting, and the spit stood idle, she used her hands on poor Dick instead. At last, Mr. Fitzwarren's daughter Alice learned what was happening. She felt sorry for the boy and made the servants treat him kindly.
    - id: ch02
      title: A Penny and a Cat
      blocks:
      - id: ch02-b01
        speaker: narrator
        text: The cook was not Dick's only trouble. His master had given him a flock bed in the garret, but rats and mice filled the room. They often ran across his nose and woke him in the night.
      - id: ch02-b02
        speaker: narrator
        text: After a while, a gentleman visiting the house gave Dick a penny for brushing his shoes. Dick tucked it safely into his pocket, determined to spend it as wisely as he could. The next day, he saw a woman in the street carrying a cat and hurried over to ask her price.
      - id: ch02-b03
        speaker: narrator
        text: The woman wanted a great deal because the cat was an excellent mouser. But Dick told her he had only one penny in the whole world and badly needed a cat. So she let him have her.
      - id: ch02-b04
        speaker: narrator
        text: Dick hid the cat in the garret, afraid that Cicely would beat her too. The cat soon killed or frightened away every rat and mouse. At last, Dick could sleep as soundly as a top.
      - id: ch02-b05
        speaker: narrator
        text: Soon afterward, Mr. Fitzwarren had a ship ready to sail. As he always did, he called his servants together so each one could send something aboard and try their luck. Their goods would travel without freight or customs charges. The merchant rightly believed that God would bless him for letting poor people share in his fortune.
      - id: ch02-b06
        speaker: narrator
        text: Every servant came except Dick. He had no money and no goods, so he could not imagine sending anything. His good friend Alice guessed that poverty had kept him away and ordered someone to call him.
      - id: ch02-b07
        speaker: narrator
        text: Alice offered to pay for something in Dick's name, but her father said that would not do. Whatever Dick sent had to be his own.
      - id: ch02-b08
        speaker: whittington
        text: I own nothing except the cat I bought with the penny someone gave me.
      - id: ch02-b09
        speaker: fitzwarren
        text: Then fetch your cat, boy, and send her on the voyage.
      - id: ch02-b10
        speaker: narrator
        text: Dick fetched poor Puss and handed her to the captain with tears in his eyes. He said that without her, the rats and mice would trouble him just as much as before. The whole company laughed at this strange venture, but Alice did not. She pitied the poor boy and gave him something with which to buy another cat.
      - id: ch02-b11
        speaker: narrator
        text: While Puss was crossing the tossing sea, Dick was being severely beaten at home. Cicely treated him cruelly and mocked him for sending his cat away. At last, he decided to leave. He packed his few belongings and set out very early on All Hallows' Day.
      - id: ch02-b12
        speaker: narrator
        text: Dick walked as far as Holloway, then sat on a stone to decide where he should go. While he was thinking, the six bells of Bow began to ring. To Dick, their voices seemed to say these words.
      - id: ch02-b13
        speaker: narrator
        text: Turn again, Whittington. Thrice Lord Mayor of London.
      - id: ch02-b14
        speaker: whittington
        text: Lord Mayor of London! What would I not endure to be Lord Mayor and ride in such a fine coach? I will go back. I would rather bear all Cicely's blows and cruelty than lose that chance.
        emotion: surprised
      - id: ch02-b15
        speaker: narrator
        text: So Dick went home. Luckily, he slipped into the house and returned to his work before Mrs. Cicely appeared.
    - id: ch03
      title: Puss at the Palace
      blocks:
      - id: ch03-b01
        speaker: narrator
        text: Now we must follow Puss to the coast of Africa. Voyages at sea are dangerous. Winds and waves are uncertain, and a sailor's life is full of accidents.
      - id: ch03-b02
        speaker: narrator
        text: The ship carrying the cat was tossed at sea for a long time. Contrary winds finally drove it to a part of the Barbary coast inhabited by Moors whom the English did not know. The people received the sailors courteously. Hoping to trade, the captain showed them samples of his cargo and sent some to their King.
      - id: ch03-b03
        speaker: narrator
        text: The King liked the goods so well that he summoned the captain and the factor to his palace, about a mile from shore. Following the custom of the country, the visitors sat on rich carpets patterned with gold and silver. The King and Queen took their places at the upper end of the room, and servants brought in a dinner of many dishes.
      - id: ch03-b04
        speaker: narrator
        text: The moment the dishes were set down, an astonishing number of rats and mice rushed in from every side. In an instant, they devoured all the food.
      - id: ch03-b05
        speaker: factor
        text: Do these creatures not trouble you?
        emotion: surprised
      - id: ch03-b06
        speaker: noble
        text: Trouble us? Very much. The King would give half his treasure to be rid of them. They eat his dinner, as you have seen. They even attack him in his chamber and in his bed. Guards must watch while he sleeps to keep them away.
      - id: ch03-b07
        speaker: narrator
        text: The factor jumped for joy. He remembered poor Whittington and his cat. He told the King that a creature aboard the ship could destroy all those pests at once. The news made the King's heart leap so high that his turban fell from his head.
      - id: ch03-b08
        speaker: king
        text: Bring me this creature. Vermin are dreadful things to have at court. If she can do what you promise, I will fill your ship with gold and jewels in exchange for her.
        emotion: happy
      - id: ch03-b09
        speaker: narrator
        text: The factor knew his business and took the chance to explain all of Puss's merits. He said it would be inconvenient to part with her. Once she was gone, the rats and mice might destroy the goods aboard the ship. Still, he would oblige His Majesty and fetch her.
      - id: ch03-b10
        speaker: queen
        text: Run, run! I cannot wait to see the dear creature.
        emotion: happy
      - id: ch03-b11
        speaker: narrator
        text: The factor flew back to the ship while the palace servants prepared another dinner. He returned carrying the cat just as the rats and mice were devouring that meal too. Without losing a moment, he set Puss down among them. She sprang to work and killed a great many of the pests.
      - id: ch03-b12
        speaker: narrator
        text: The King rejoiced to see his old enemies destroyed by such a small creature. The Queen was delighted too and asked to see the cat close by. The factor called to her.
      - id: ch03-b13
        speaker: factor
        text: Pussy, pussy, pussy!
      - id: ch03-b14
        speaker: narrator
        text: Puss came to him, and he presented her to the Queen. At first, the Queen drew back. She was afraid to touch the creature that had dealt so fiercely with the rats and mice. But the factor stroked the cat and called to her once more. Then the Queen reached out as well. She had not learned English, so her call came out differently.
      - id: ch03-b15
        speaker: queen
        text: Putty, putty!
      - id: ch03-b16
        speaker: narrator
        text: The factor placed Puss on the Queen's lap. Purring, the cat played with Her Majesty's hand, then sang herself to sleep.
      - id: ch03-b17
        speaker: narrator
        text: The King had seen what Puss could do. When he learned that her kittens could provide cats for the whole country, he struck a bargain with the captain and factor. He bought the ship's entire cargo. Then he gave them ten times as much for the cat as all the other goods were worth together. They took leave of the King, the Queen, and the other great people at court. With a fair wind behind them, they sailed for England, and we must follow them there.
    - id: ch04
      title: News of the Unicorn
      blocks:
      - id: ch04-b01
        speaker: narrator
        text: Morning had hardly dawned when Mr. Fitzwarren rose to count his money and arrange the day's business. He had just entered the countinghouse and sat down at his desk when someone went tap, tap, at the door.
      - id: ch04-b02
        speaker: fitzwarren
        text: Who is there?
      - id: ch04-b03
        speaker: messenger
        text: A friend.
      - id: ch04-b04
        speaker: fitzwarren
        text: What friend comes at such an hour?
      - id: ch04-b05
        speaker: messenger
        text: A true friend never comes at the wrong time. I have good news of your ship, the Unicorn.
      - id: ch04-b06
        speaker: narrator
        text: The merchant bustled up in such a hurry that he forgot all about his gout and opened the door at once. There stood the captain and the factor. They carried a cabinet of jewels and the bill of lading for the ship's cargo. Mr. Fitzwarren raised his eyes and thanked heaven for sending the Unicorn home after such a prosperous voyage.
      - id: ch04-b07
        speaker: narrator
        text: The two men told him all about the cat and showed him the jewels they had brought for Mr. Whittington. Mr. Fitzwarren called out earnestly, though his words were not the finest poetry.
      - id: ch04-b08
        speaker: fitzwarren
        text: Go, bring him here and tell him of his fame. And call him Mr. Whittington by name.
      - id: ch04-b09
        speaker: narrator
        text: We need not judge his verse. This is a history, not a book of criticism. Mr. Fitzwarren may not have been a good poet, but he soon proved himself a good man, which mattered much more. Some people there protested that the treasure was far too much for a poor boy like Whittington.
      - id: ch04-b10
        speaker: courtier
        text: Surely all this treasure is too much to give to such a poor boy.
      - id: ch04-b11
        speaker: fitzwarren
        text: God forbid that I should keep one penny from him. It is his, and he shall have every farthing.
      - id: ch04-b12
        speaker: narrator
        text: He ordered Mr. Whittington to come in. Dick was cleaning the kitchen and tried to excuse himself. The countinghouse had just been swept, he said, while his shoes were dirty and covered with hobnails. The merchant insisted and had a chair brought for him.
      - id: ch04-b13
        speaker: narrator
        text: Dick thought they meant to make fun of him, as people in the kitchen had done so often.
      - id: ch04-b14
        speaker: whittington
        text: Please, sir, do not mock a poor simple fellow who has never meant you any harm. Let me go back to my work.
        emotion: sad
      - id: ch04-b15
        speaker: narrator
        text: Mr. Fitzwarren took him by the hand.
      - id: ch04-b16
        speaker: fitzwarren
        text: Indeed, Mr. Whittington, I am not joking. I called you here to congratulate you on your great success. Your cat has earned you more money than I possess in the world. May you enjoy it for many years and be happy.
        emotion: happy
    - id: ch05
      title: Whittington's Fortune
      blocks:
      - id: ch05-b01
        speaker: narrator
        text: At last, they showed Dick the treasure and convinced him that every bit of it belonged to him. He dropped to his knees and thanked Almighty God for watching over one so poor and miserable.
      - id: ch05-b02
        speaker: narrator
        text: Then Dick placed the entire treasure at his master's feet. Mr. Fitzwarren would accept none of it. He said he rejoiced with all his heart in Dick's prosperity and hoped the new wealth would comfort him and make him happy.
      - id: ch05-b03
        speaker: narrator
        text: Dick next offered money to Mrs. Fitzwarren and to his good friend Alice. They too refused any share. Alice told him how heartily she rejoiced in his success and wished him every happiness.
      - id: ch05-b04
        speaker: narrator
        text: Dick rewarded the captain, the factor, and the ship's crew for taking such care of his venture. He also gave presents to every servant in the house. He did not forget even his old enemy Cicely, though she deserved his kindness very little.
      - id: ch05-b05
        speaker: narrator
        text: Mr. Fitzwarren advised Dick to send for the proper tradespeople and dress himself as a gentleman. He invited the young man to remain in his house until he could find a better home of his own.
      - id: ch05-b06
        speaker: narrator
        text: Once Dick's face was washed, his hair curled, and his rich suit put on, he turned out to be a handsome young gentleman. Wealth gave him more confidence. Before long, he lost the shy, sheepish manner that had mostly come from his low spirits. Soon he was lively and good company. Alice had once pitied him, but now she fell in love with him.
      - id: ch05-b07
        speaker: narrator
        text: Her father soon saw that Dick and Alice had a true liking for each other, so he proposed a match between them. Both of them agreed cheerfully. The Lord Mayor came to the wedding, along with the Court of Aldermen and the Sheriffs. The Company of Stationers, the Royal Academy of Arts, and many leading merchants attended as well. All the guests were treated to an elegant feast prepared for the occasion.
    - id: ch06
      title: Three Times Lord Mayor
      blocks:
      - id: ch06-b01
        speaker: narrator
        text: History tells us that Dick and Alice lived very happily. They had several children and both reached a good old age. Mr. Whittington became Sheriff of London and served three times as Lord Mayor.
      - id: ch06-b02
        speaker: narrator
        text: During the last year of his mayoralty, after King Henry the Fifth conquered France, Whittington entertained the King and Queen at a great occasion. The King considered all that Whittington had done and spoke in praise of his merit.
      - id: ch06-b03
        speaker: king
        text: No prince ever had such a subject.
      - id: ch06-b04
        speaker: narrator
        text: When those words were repeated to Whittington at the table, he answered with praise of his own.
      - id: ch06-b05
        speaker: whittington
        text: No subject ever had such a king.
      - id: ch06-b06
        speaker: narrator
        text: Soon afterward, His Majesty honored Whittington's good character by making him a knight.
      - id: ch06-b07
        speaker: narrator
        text: For many years before his death, Sir Richard never stopped helping others. He regularly fed a great number of London's poor citizens. He built a church and a college beside it, and provided a yearly allowance for poor scholars. Near those buildings, he also founded a hospital.
      - id: ch06-b08
        speaker: narrator
        text: He also built Newgate for criminals. He gave generously to Saint Bartholomew's Hospital and to other public charities.
