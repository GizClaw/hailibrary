      tts: {delivery: 表面亲热内里阴险, timbre: 低沉沙哑, pace: 从容而有压迫感, pitch: 中低音}
    ring_genie:
      display_name: 戒指精灵
      tts: {delivery: 威严而服从命令, timbre: 洪亮浑厚, pace: 稳健, pitch: 低音}
    lamp_genie:
      display_name: 灯神
      tts: {delivery: 强大恭谨偶尔雷霆震怒, timbre: 深沉洪亮, pace: 沉稳, pitch: 低音}
