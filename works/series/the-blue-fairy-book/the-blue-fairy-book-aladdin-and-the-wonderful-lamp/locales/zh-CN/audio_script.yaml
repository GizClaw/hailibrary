      display_name: 宫中女奴
      tts: {delivery: 活泼恭谨, timbre: 年轻清脆, pace: 明快, pitch: 中高音}
    jeweler:
      display_name: 珠宝匠
      tts: {delivery: 恭敬而实事求是, timbre: 成熟清晰, pace: 中等, pitch: 中音}
    magician_brother:
      display_name: 魔法师的弟弟
      tts: {delivery: 假作虔诚实则狠毒狡猾, timbre: 阴沉锐利, pace: 稍缓, pitch: 中低音}
  chapters:
    - id: ch01
      title: 假叔叔与地下宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷裁缝，儿子名叫阿拉丁。这个孩子懒散贪玩，整天和街上的闲孩子打球，什么正事也不肯做。父亲为他伤透了心，终于郁郁而终。母亲流尽眼泪，苦苦劝他，他还是不改。
        - id: ch01-b02
          speaker: narrator
          text: 一天，阿拉丁又在街上玩，一个陌生人走来，问他的年纪，又问他是不是裁缝穆斯塔法的儿子。
        - id: ch01-b03
          speaker: aladdin
          text: 是的，先生。不过我父亲早就去世了。
        - id: ch01-b04
          speaker: narrator
          text: 陌生人听了，一把搂住阿拉丁，连连亲吻。这个人其实是非洲一位有名的魔法师。
        - id: ch01-b05
          speaker: african_magician
          text: 我是你叔叔。你和我哥哥长得太像了，我一眼就认出了你。快回去告诉母亲，我要到家里去。
        - id: ch01-b06
          speaker: mother
          text: 孩子，你父亲的确有个兄弟，可我一直以为他已经死了。
        - id: ch01-b07
          speaker: narrator
          text: 母亲还是备下晚饭，叫儿子把叔叔找来。魔法师带着酒和水果上门，一进屋就俯身亲吻穆斯塔法从前坐过的地方。他说自己离乡四十年，所以一直没有露面，请他们不要见怪。接着，他问阿拉丁学了什么手艺。孩子惭愧地低下头，母亲却忍不住哭了起来。魔法师听说阿拉丁整日闲荡，什么手艺都不肯学，便答应替他租一间铺子，再置办货物。第二天，他给阿拉丁买了漂亮衣裳，领着他走遍全城，看尽各处热闹。直到天黑，他才把孩子送回家。母亲看见儿子如此体面，欢喜得合不拢嘴。
        - id: ch01-b08
          speaker: narrator
          text: 次日，魔法师把阿拉丁带出城门，走了很远，来到几座美丽的花园。他们在一眼喷泉旁坐下，魔法师从腰带里取出一块饼，两人各吃一半。休息过后，他们又向山里走去。阿拉丁累得双腿发软，不住央求回家，魔法师却一路讲着有趣的故事，哄得他身不由己地继续前进。最后，他们走进两山之间的一道狭窄山谷。
        - id: ch01-b09
          speaker: african_magician
          text: 就到这里。我让你看一件奇妙的东西。你去拾些枯枝，我来生火。
        - id: ch01-b10
          speaker: narrator
          text: 火点燃后，魔法师撒进粉末，念动咒语。大地微微震动，裂开一道口子，露出一块中央嵌着铜环的方石板。阿拉丁转身想逃，却被他一掌打倒。
        - id: ch01-b11
          speaker: aladdin
          text: 叔叔，我做错了什么？
          emotion: fearful
        - id: ch01-b12
          speaker: african_magician
          text: 别怕，照我的话做。石板下藏着一宗只属于你的宝物，别人谁也碰不得。
        - id: ch01-b13
          speaker: narrator
          text: “宝物”两个字一入耳，阿拉丁便忘了方才那一巴掌，也不再想着逃跑。他依照吩咐，先念出父亲和祖父的名字，再握住铜环向上一提。沉重的石板竟轻轻松松掀开了，下面现出一道向地底伸去的台阶。魔法师从手指上褪下一枚戒指，戴到阿拉丁手上，祝他一路顺利。
        - id: ch01-b14
          speaker: african_magician
          text: 从台阶下去，穿过三座大厅。把袍子撩好，什么也别碰，不然立刻就会死。前面有座果园。一直走到露台的壁龛，取出那盏点亮的灯，倒掉灯油，带回来给我。愿你顺利。
        - id: ch01-b15
          speaker: narrator
          text: 地下的一切果然如此。阿拉丁摘了些树上的果子，拿到灯，返回洞口。魔法师急得大喊。
        - id: ch01-b16
          speaker: african_magician
          text: 快一点，把灯给我！
        - id: ch01-b17
          speaker: narrator
          text: 阿拉丁手里拿着灯，却坚持要等魔法师先把自己拉出去。魔法师一听，顿时勃然大怒。他又把粉末撒进火里，口中念了几句咒语，石板便滚回原处，将洞口封得严严实实。随后，他永远离开了波斯。这也明明白白地说明，他根本不是阿拉丁的叔叔。这个诡计多端的术士从魔法书里得知，那盏神灯能让他成为世上最有权势的人。可他虽然知道神灯藏在哪里，自己却拿不到，非得由别人亲手交给他才行。因此，他挑中了愚笨的阿拉丁，原打算利用孩子取出神灯，再将他杀死。

    - id: ch02
      title: 神灯的秘密与公主的婚约
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 阿拉丁在黑暗中哭了两天。最后，他合起双手祈祷，无意间擦到魔法戒指。一个巨大可怕的精灵从地下冒了出来。
        - id: ch02-b02
          speaker: ring_genie
          text: 主人有何吩咐？我是戒指的奴仆，凡事都听您的命令。
        - id: ch02-b03
          speaker: aladdin
          text: 把我救出这个地方！
        - id: ch02-b04
          speaker: narrator
          text: 大地立刻裂开，阿拉丁重新回到外面。双眼渐渐适应阳光后，他一步步挪回家，却在门槛上一头昏倒。醒来以后，他把全部遭遇告诉母亲，又拿出神灯和花园里的果子。母子俩当时并不知道，那些果子其实全是珍贵的宝石。阿拉丁饿得厉害，向母亲讨吃的。家中已经什么也没有，只剩母亲纺好的一点棉纱，可以拿去换钱。阿拉丁要她留着棉纱，改卖那盏灯。灯上满是污垢，母亲想先把它擦亮，好多卖几个钱。谁知刚擦一下，一个丑陋可怕的精灵就出现在她眼前，吓得她当场昏了过去。
        - id: ch02-b05
          speaker: lamp_genie
          text: 主人想要什么？
        - id: ch02-b06
          speaker: aladdin
          text: 给我拿些吃的来！
        - id: ch02-b07
          speaker: narrator
          text: 灯神很快回来了，带来一只银钵、十二只装满珍馐美味的银盘、两只银杯，还有两瓶酒。阿拉丁的母亲慢慢苏醒，睁眼便看见满桌从未见过的丰盛食物，惊讶得不知该说什么才好。
        - id: ch02-b08
          speaker: mother
          text: 这样丰盛的宴席，是从哪里来的？
        - id: ch02-b09
          speaker: aladdin
          text: 先别问了，我们吃吧。
        - id: ch02-b10
          speaker: narrator
          text: 母子俩从早吃到中午。阿拉丁讲出神灯的秘密，母亲求他卖掉它，别再同魔鬼来往。
        - id: ch02-b11
          speaker: aladdin
          text: 不卖。既然机缘让我们知道了它的妙用，就该好好利用。戒指也一样，我会一直戴着。
        - id: ch02-b12
          speaker: narrator
          text: 灯神带来的食物吃完以后，阿拉丁卖掉一只银盘，用所得的钱维持生活。钱花完了，他便再卖一只，直到十二只银盘全都卖光。到了那时，他才又求助灯神。灯神又送来一套餐具。母子俩就这样一次次度过难关，安稳生活了许多年。
        - id: ch02-b13
          speaker: narrator
          text: 一天，阿拉丁听见街上宣读苏丹的命令。公主往返浴场时，人人必须留在家中，关紧百叶窗。公主平日出门总蒙着面纱，要看见她的容貌极不容易，阿拉丁却偏偏一心想见她。他偷偷藏在浴场门后，从一道窄缝中向外窥看。公主走进浴场时揭开面纱，露出美得惊人的容貌。只这一眼，阿拉丁便深深爱上了她。
        - id: ch02-b14
          speaker: narrator
          text: 阿拉丁回家后完全变了样，吓坏了母亲。他说自己深爱公主，没有她便活不下去，一定要请苏丹把女儿嫁给自己。母亲听见这样异想天开的请求，忍不住放声大笑。可阿拉丁一再苦求，她终于答应进宫。母亲取来一方布巾，把魔法花园里的宝石果实摆在上面。那些宝石灿然生辉，比世间最美的珠宝还要夺目。她带着礼物走进大殿，站在苏丹面前，可苏丹根本没有留意。此后一连七天，她每天都去，始终站在同一个地方。直到第六天议事结束，苏丹才对宰相提起她。
        - id: ch02-b15
          speaker: sultan
          text: 我每天都看见这个女人带着一只布包。她下次再来，就叫她上前，我要听听她有什么请求。
        - id: ch02-b16
          speaker: narrator
          text: 第二天，阿拉丁的母亲跪在御座前，迟迟不敢开口。苏丹让宰相以外的人退下，答应无论她说什么都不怪罪。
        - id: ch02-b17
          speaker: mother
          text: 我求儿子忘掉公主，可他怎么也不听，还说我若不来求陛下赐婚，他就要做出不顾一切的事。求陛下既宽恕我，也宽恕阿拉丁。
        - id: ch02-b18
          speaker: narrator
          text: 她打开布巾，献出灿然生辉的宝石。苏丹惊得说不出话。
        - id: ch02-b19
          speaker: sultan
          text: 宰相，你看呢？有人献出这样贵重的聘礼，我难道不该把公主嫁给他吗？
        - id: ch02-b20
          speaker: narrator
          text: 宰相也看见了那些珠宝，却一心想让自己的儿子娶公主。他请求苏丹把婚事暂缓三个月，盼望儿子能在这段时间设法献上一份更加贵重的礼物。苏丹答应了他的请求，又告诉阿拉丁的母亲，自己虽已同意婚事，她却必须等足三个月才能再次进宫。
        - id: ch02-b21
          speaker: narrator
          text: 才过两个月，母亲进城买油，发现人人都在欢庆。
        - id: ch02-b22
          speaker: citizen
          text: 你还不知道吗？宰相的儿子今晚就要迎娶公主了！
        - id: ch02-b23
          speaker: narrator
          text: 母亲喘着气把消息带回家。阿拉丁大受打击，很快却想起神灯。他召来灯神。
        - id: ch02-b24
          speaker: aladdin
          text: 苏丹背弃了承诺，要把公主嫁给宰相的儿子。今晚，把新娘和新郎一起带到这里。
        - id: ch02-b25
          speaker: lamp_genie
          text: 主人，我听从您的命令。
        - id: ch02-b26
          speaker: narrator
          text: 午夜时分，灯神连床带人搬进阿拉丁房中。
        - id: ch02-b27
          speaker: aladdin
          text: 把新郎带到外面的寒夜里，天亮再送回来。
        - id: ch02-b28
          speaker: narrator
          text: 灯神提走宰相之子，只留下公主。
        - id: ch02-b29
          speaker: aladdin
          text: 别怕。你本来就是我的妻子，是你父亲许配给我的。我绝不会伤害你。
        - id: ch02-b30
          speaker: narrator
          text: 公主怕得一句话也说不出来，度过了一生中最难熬的一夜，阿拉丁却在她身旁躺下，沉沉睡去。到了约定的时候，灯神把冻得浑身发抖的新郎提回来，放回原处，又将整张床送回王宫。不久，苏丹来向女儿道早安。可怜的宰相之子一跃下床，赶紧躲藏起来。公主却满面愁容，不肯对父亲说一句话。苏丹只得叫王后来劝她。
        - id: ch02-b31
          speaker: queen
          text: 孩子，你为什么不和父亲说话？究竟发生了什么？
        - id: ch02-b32
          speaker: narrator
          text: 公主深深叹了一口气，终于说出昨夜的遭遇。那张床忽然被搬进一座陌生房屋，新郎又被带走，直到天亮才回来。王后半点也不肯相信，只当女儿做了一场荒唐的梦，叫她赶紧起床，别再放在心上。第二夜，同样的事又发生了一遍。次日清晨，公主仍旧不肯开口，苏丹气得威胁要砍掉她的脑袋。她这才把全部经过说出，请父亲也去询问宰相之子，看自己有没有半句虚言。
        - id: ch02-b33
          speaker: vizier_son
          text: 公主说的都是真的。我虽然深爱她，却宁愿死，也不愿再过那样可怕的一夜。请解除这桩婚约吧。
        - id: ch02-b34
          speaker: narrator
          text: 他的请求获准了，宴饮和庆典也就此结束。

    - id: ch03
      title: 阿拉丁的宫殿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 三个月期满，阿拉丁让母亲再次进宫，提醒苏丹别忘了自己的诺言。她仍旧站在从前那个地方。苏丹早把阿拉丁忘得一干二净，一看见她才立刻想起来，命人将她叫到御座前。可苏丹看见她衣着贫寒，又比从前更不愿兑现承诺。于是他询问宰相该怎么办，宰相便劝他为公主开出一个高得惊人的身价，好叫世上任何人都无法办到。
        - id: ch03-b02
          speaker: sultan
          text: 苏丹不能忘记承诺。可你的儿子必须先送来四十只装满珠宝的金盆，由四十名黑奴顶着，再让四十名白奴领路，所有人都要衣着华美。我等着他的答复。
        - id: ch03-b03
          speaker: narrator
          text: 母亲低头回家，只当一切希望都断了。
        - id: ch03-b04
          speaker: mother
          text: 那他只管慢慢等你的答复吧！
        - id: ch03-b05
          speaker: aladdin
          text: 他不会等很久。为了公主，比这困难得多的事我也愿意做。
        - id: ch03-b06
          speaker: narrator
          text: 阿拉丁召来灯神。片刻之间，八十名奴仆便来到眼前，把小屋和花园挤得满满当当。四十名白奴在前领路，四十名黑奴头顶盛满珠宝的金盆，排成两列向王宫走去，阿拉丁的母亲跟在最后。这些人衣着华贵，腰带上也嵌满珠宝，全城百姓都挤到街边观看。进入王宫以后，他们先跪拜苏丹，再双臂交叉，在御座周围站成半圆。阿拉丁的母亲这才将他们和礼物一并献给苏丹。
        - id: ch03-b07
          speaker: sultan
          text: 好妇人，快回去告诉你儿子，我正张开双臂等他。
        - id: ch03-b08
          speaker: narrator
          text: 母亲催阿拉丁赶快进宫，他却先向灯神吩咐。
        - id: ch03-b09
          speaker: aladdin
          text: 我要洗香汤浴，穿刺绣华美的礼服，骑一匹胜过苏丹坐骑的马。派二十名奴仆随侍，再派六名衣着漂亮的女奴照料我母亲。还要一万枚金币，分装十袋。
        - id: ch03-b10
          speaker: narrator
          text: 阿拉丁话音刚落，一切便已备齐。他骑上那匹非凡的骏马，带着随从穿过大街，奴仆们一路向人群抛撒金币。儿时同他玩耍过的人都挤在人群中观看，却没有一个认出眼前这位英俊青年。苏丹看见阿拉丁，亲自走下御座拥抱他，又将他领进摆满盛宴的大厅，打算就在当天举行婚礼。
        - id: ch03-b11
          speaker: aladdin
          text: 请先容我建一座配得上公主的宫殿。
        - id: ch03-b12
          speaker: narrator
          text: 阿拉丁回到家，又召来灯神。
        - id: ch03-b13
          speaker: aladdin
          text: 用最上等的大理石建一座宫殿，镶上碧玉、玛瑙和其他宝石。中央要有圆顶大厅，四面墙用厚实的金银筑成，每面开六扇窗。除了一扇故意留下，其余窗棂都镶满钻石和红宝石。还要备齐马厩、骏马、马夫和奴仆。
        - id: ch03-b14
          speaker: narrator
          text: 第二天，宫殿已经落成。灯神带阿拉丁前去察看，他交代的一切都做得分毫不差。从新宫到王宫之间，甚至已经铺好一条天鹅绒地毯。阿拉丁的母亲精心梳妆，带着六名女奴走在前面，阿拉丁骑马跟随。苏丹派乐师吹响号角、敲起铙钹，出宫迎接他们。一路上，音乐和欢呼响彻云霄。
        - id: ch03-b15
          speaker: narrator
          text: 阿拉丁的母亲先被带到公主面前。公主向她致意，以极高的礼数相待。到了夜里，公主拜别父亲，沿着天鹅绒地毯走向新宫。阿拉丁的母亲陪在她身旁，一百名奴仆跟在后面。公主一看见赶来迎接的阿拉丁，心中便十分欢喜。
        - id: ch03-b16
          speaker: aladdin
          text: 公主，若我的冒昧让您不快，就请怪罪您的美貌吧。
        - id: ch03-b17
          speaker: princess
          text: 如今亲眼见到你，我愿意听从父亲的安排。
        - id: ch03-b18
          speaker: narrator
          text: 婚礼举行以后，阿拉丁领公主走进圆顶大厅。那里已经摆好盛宴，两人一同用过晚餐，又在乐声中跳舞，直到午夜才停下。第二天，阿拉丁邀请苏丹参观宫殿。苏丹走进那座拥有二十四扇窗的大厅，只见四周的窗棂镶满红宝石、钻石和祖母绿，光彩交相辉映，他看得赞叹不已。
        - id: ch03-b19
          speaker: sultan
          text: 这真是举世无双的奇迹！只有一件事让我不解，那扇窗户是无意间没有完工吗？
        - id: ch03-b20
          speaker: aladdin
          text: 不是，陛下。我有意留下它，好让完成宫殿的荣耀归于您。
        - id: ch03-b21
          speaker: narrator
          text: 苏丹高兴地召来全城最好的珠宝匠，命他们照其他窗户装饰那一扇。
        - id: ch03-b22
          speaker: jeweler
          text: 陛下，我们找不到足够的宝石。
        - id: ch03-b23
          speaker: narrator
          text: 苏丹命人取来自己的珠宝。工匠很快将它们用光，工程却没有多大进展。整整一个月过去，那扇窗户连一半都没完成。阿拉丁知道他们永远无法完成，便叫工匠拆掉已经做好的部分，将珠宝原样送还苏丹，随后命灯神装饰窗户。灯神转眼便做完了。苏丹收到自己的珠宝，惊讶地赶来查看。看见那扇窗已经与其他窗户一般华美，他高兴地拥抱阿拉丁。嫉妒的宰相却在一旁暗示，这必定是妖术。
        - id: ch03-b24
          speaker: narrator
          text: 阿拉丁待人谦和，深得百姓爱戴。苏丹任命他统领军队。他打赢了好几场战争，仍旧谦逊有礼，就这样安宁地生活了几年。

    - id: ch04
      title: 旧灯换新灯
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 遥远的非洲，魔法师又想起阿拉丁。他施展法术，发现那个穷裁缝的儿子并没有悲惨地死在洞穴里，反而逃出生天，还娶了公主，享有无上的尊荣与财富。魔法师知道，阿拉丁绝不可能凭自己的力量得到这一切，唯一的解释就是那盏神灯。他日夜兼程，千里迢迢赶到中国的京城，一心要毁掉阿拉丁。
        - id: ch04-b02
          speaker: african_magician
          text: 请原谅我孤陋寡闻。你们到处谈论的，究竟是哪一座宫殿？
        - id: ch04-b03
          speaker: citizen
          text: 难道你没听说过阿拉丁王子的宫殿？那可是世上最大的奇迹！你想去看，我给你指路。
        - id: ch04-b04
          speaker: narrator
          text: 魔法师亲眼看见宫殿，认出它是灯神所建，气得几乎发狂。他发誓夺回神灯，让阿拉丁重新变得一贫如洗。
        - id: ch04-b05
          speaker: narrator
          text: 阿拉丁恰好外出打猎，要八天以后才回来，这给了魔法师充足的时间。他买来十来盏崭新的铜灯，装进篮子，提着它走到宫殿附近。一路上，他高声叫卖。人人都觉得拿新灯换旧灯实在荒唐，一群嘲笑他的百姓便跟在身后看热闹。
        - id: ch04-b06
          speaker: african_magician
          text: 旧灯换新灯！拿旧灯来换新灯！
        - id: ch04-b07
          speaker: narrator
          text: 公主坐在二十四扇窗大厅里，派女奴查看外面的喧闹。女奴回来时笑个不停，惹得公主责备她。
        - id: ch04-b08
          speaker: palace_slave
          text: 殿下，一个老傻瓜拿着漂亮的新灯，偏要换别人的破旧灯。谁看见能忍住不笑呢？
        - id: ch04-b09
          speaker: narrator
          text: 另一名女奴听见这话，想起大厅飞檐上正放着一盏旧灯。那正是阿拉丁打猎时不便带走，暂时留在那里的神灯。公主从来不知道这盏旧灯有什么价值，也觉得这场交换十分可笑，便吩咐女奴把它拿下去，换一盏漂亮的新灯回来。
        - id: ch04-b10
          speaker: palace_slave
          text: 拿一盏新灯来换这盏吧。
        - id: ch04-b11
          speaker: narrator
          text: 魔法师一看见神灯，立刻一把夺了过去，让女奴从篮中随意挑一盏新的。周围的人仍在哄笑，他却一点也不在乎。神灯既已到手，他不再沿街叫卖，径直走出城门，来到一片荒无人烟的地方，一直等到天黑。四下无人时，他取出神灯擦了擦。灯神出现后，他命令灯神把自己、整座宫殿和宫中的公主，全都搬到非洲一片荒僻之地。灯神立即照办。
        - id: ch04-b12
          speaker: narrator
          text: 第二天早晨，苏丹从窗前望向阿拉丁的宫殿，忽然使劲揉了揉眼睛。原来宫殿已经消失，原地什么也没有留下。他赶紧召来宰相，追问宫殿的去向。宰相也朝窗外一看，顿时惊得呆住。他再次断定，这一切都是妖术。苏丹这回终于相信了他，马上派出三十名骑兵，要他们给阿拉丁戴上锁链，押回王宫。
        - id: ch04-b13
          speaker: narrator
          text: 骑兵在归途中迎面截住阿拉丁，把他捆起，逼他下马步行。爱戴他的百姓看见了，纷纷拿起武器，一路跟到王宫，决意不让他受到伤害。阿拉丁被押到苏丹面前，苏丹立刻命刽子手砍下他的脑袋。刽子手让他跪好，蒙住双眼，高高举起弯刀。就在刀锋要落下的时候，人群已经冲进院子，还在攀爬围墙，要把阿拉丁救走。宰相见势不妙，连忙叫刽子手住手。苏丹看看那些怒气冲冲的百姓，只得让步，下令解开阿拉丁，当着众人的面赦免他。
        - id: ch04-b14
          speaker: aladdin
          text: 请陛下告诉我，我究竟犯了什么罪？
        - id: ch04-b15
          speaker: sultan
          text: 你这个奸诈的恶徒，到窗前来看看！我的宫殿和女儿在哪里？宫殿还在其次，我的女儿必须回来。找不到她，你就拿脑袋偿命！
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: 阿拉丁从窗前望向宫殿原来矗立的地方，惊得一句话也说不出来。他根本不知道宫殿和妻子去了哪里，只能请求苏丹宽限四十天，让自己出去寻找。若是期限之内找不回公主，他一定主动回来，任凭苏丹处死。苏丹答应了这个请求，阿拉丁便满怀悲伤地离开王宫。
        - id: ch04-b17
          speaker: narrator
          text: 离开王宫以后，阿拉丁一连三天像疯子般四处游荡。他逢人就追问宫殿去了哪里，可谁也不知道答案。人们听见他的问题，不是嘲笑他疯了，就是怜悯他的遭遇。绝望之中，他来到一条河边，决定结束自己的性命。他先跪下祈祷，打算祷告完便投进河水。就在双手挪动时，他无意中擦到了仍戴在手上的魔法戒指。那位曾把他救出洞穴的戒指精灵再次现身，询问他有何吩咐。
        - id: ch04-b18
          speaker: aladdin
          text: 精灵，救救我的命，把宫殿搬回来！
        - id: ch04-b19
          speaker: ring_genie
          text: 这超出了我的力量。我只是戒指的奴仆，这件事得去求神灯的奴仆。
        - id: ch04-b20
          speaker: aladdin
          text: 那么，请把我送到宫殿，放在我妻子的窗下。
        - id: ch04-b21
          speaker: narrator
          text: 转眼之间，阿拉丁便从中国来到了非洲，正好站在公主的窗下。连续几天的奔波已经耗尽他的力气，他倒在地上，很快睡着了。清晨，鸟儿的歌声将他唤醒，他的心情也比前几天轻快了一些。如今他已经清楚明白，宫殿失踪和自己遭遇的全部灾祸，都源于那盏神灯失窃。可是他反复思量，仍猜不出究竟是谁偷走了它。

    - id: ch05
      title: 宫殿重返中国
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天，公主比往日都起得早。自从被掳到非洲以后，她每天都被迫见魔法师一次，却始终对他冷若冰霜，魔法师也不敢长住在宫中。公主正在梳妆，一名侍女向窗外看了一眼，忽然发现了阿拉丁。公主立刻跑过去推开窗户。阿拉丁听见响动，抬头望见了她。公主赶紧叫他上来。久别的夫妻终于重逢，心中不知有多欢喜。
        - id: ch05-b02
          speaker: aladdin
          text: 公主，看在上天的分上，也为了我们两人的安危，请先告诉我。我打猎时留在大厅飞檐上的那盏旧灯，到哪里去了？
        - id: ch05-b03
          speaker: princess
          text: 唉，是我无意间酿成了这场灾祸。
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 公主说出旧灯换新灯的经过。阿拉丁立刻明白，背后是非洲魔法师。
        - id: ch05-b05
          speaker: aladdin
          text: 原来我们遭受的一切都拜他所赐！神灯现在在哪里？
        - id: ch05-b06
          speaker: princess
          text: 他一直带在身上，还从怀里掏出来给我看。他要我背弃你，嫁给他，又说父亲已经命人砍了你的头。他不停说你的坏话，我只用眼泪回答。再这样下去，他迟早会对我动粗。
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: 阿拉丁安慰公主，暂时离开。他在城中同一个路人换了衣服，又买来一种药粉，从宫殿侧门悄悄回来。
        - id: ch05-b08
          speaker: aladdin
          text: 换上你最美的衣裳，微笑着接待魔法师，让他以为你忘了我。请他一起用晚餐，说你想尝尝非洲的酒。他出去取酒以后，我再告诉你怎样做。
        - id: ch05-b09
          speaker: narrator
          text: 公主把阿拉丁的每句话都仔细记在心里。等他离开以后，她第一次换下被掳到非洲以来始终穿着的素服，将自己打扮得明艳动人。她系上镶满钻石的腰带，戴好钻石头饰，对着镜子一照，发现自己比从前更加美丽。魔法师来到宫中时，公主带着笑容亲自迎接，让他惊讶得不敢相信自己的眼睛。
        - id: ch05-b10
          speaker: princess
          text: 我已经想明白了。阿拉丁死了，再多眼泪也换不回他。我决定不再哀悼，所以请你来同我用晚餐。不过我喝厌了中国的酒，很想尝尝非洲的美酒。
        - id: ch05-b11
          speaker: narrator
          text: 魔法师听完，立刻飞奔到自己的酒窖取酒。趁他离开，公主把阿拉丁给她的药粉倒进自己的杯中。魔法师带酒回来后，她请他用非洲美酒为自己的健康举杯，又将自己的杯子递过去，换过他手里的那一杯，表示两人已经和好。魔法师欣喜若狂，饮酒以前，又开始长篇大论地赞美公主的容貌。
        - id: ch05-b12
          speaker: princess
          text: 我们先喝酒吧。喝过以后，你想说什么都可以。
        - id: ch05-b13
          speaker: narrator
          text: 公主把自己的杯子举到唇边，停在那里，装作正在饮酒。魔法师毫不怀疑，将换到手中的那一杯喝得一滴不剩。他刚放下杯子，身体便向后一倒，再也没有了气息。公主立刻打开门，让一直等候的阿拉丁进来。她欢喜地扑上前，双臂紧紧搂住丈夫的脖子。阿拉丁却轻轻将她推开，请她暂时回避，因为最要紧的事情还没有做完。
        - id: ch05-b14
          speaker: narrator
          text: 他从死去的魔法师衣襟里取出神灯，命灯神把宫殿和里面的一切搬回中国。公主在房里只感到两下轻微震动，根本不知道自己已经回到家乡。
        - id: ch05-b15
          speaker: narrator
          text: 苏丹正独自在内室里，为失去女儿而悲伤。他偶然抬起头，忽然看见宫殿像从前一样矗立在那里。他揉了揉眼睛，确信自己没有看错，便立刻赶往宫殿。阿拉丁和公主并肩站在二十四扇窗大厅里迎接他。阿拉丁把事情的来龙去脉全部说出，又带苏丹去看魔法师的尸体，好让他相信这番话。苏丹随即下令，举国欢庆十天。看来，阿拉丁从此可以安稳度过余生了，可事情还没有结束。

    - id: ch06
      title: 最后的魔法师
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 非洲魔法师还有一个弟弟，他的凶恶和狡猾，比起哥哥甚至更胜一筹。为了替兄长报仇，他千里迢迢赶到中国，又去找一位名叫法蒂玛的虔诚女子，盘算着利用她。他闯进法蒂玛独居的斗室，把匕首抵在她胸前，威胁她若不服从命令，立刻便要她的性命。他同法蒂玛交换衣裳，把脸涂成她的模样，再蒙上面纱。为了让她永远无法说出真相，他最后还是杀死了她。
        - id: ch06-b02
          speaker: narrator
          text: 假法蒂玛向阿拉丁的宫殿走去。一路上的百姓都以为他就是那位圣洁女子，纷纷围拢上来，亲吻他的双手，请求他赐下祝福。等他来到宫殿附近，身边已经聚满了人，喧闹声一直传进大厅。公主听见外面的动静，便派女奴走到窗前，看看究竟发生了什么事。
        - id: ch06-b03
          speaker: palace_slave
          text: 殿下，是那位圣洁的法蒂玛。听说她只要伸手一碰，就能治好人们的病。
        - id: ch06-b04
          speaker: narrator
          text: 公主早就想见法蒂玛，听完立即派人请她进宫。假扮法蒂玛的魔法师来到公主面前，先郑重其事地为她的健康与幸福祷告。祷告结束以后，公主请他坐到自己身边，又恳求他从此永远留在宫中。假法蒂玛求之不得，马上答应下来，却始终低垂面纱，唯恐被人看破身份。随后，公主领他参观那座华美的大厅，问他觉得这里如何。
        - id: ch06-b05
          speaker: magician_brother
          text: 这里的确美极了。依我看，只差一样东西。
        - id: ch06-b06
          speaker: princess
          text: 差什么呢？
        - id: ch06-b07
          speaker: magician_brother
          text: 只要在圆顶中央悬挂一枚大鹏鸟蛋，这里就会成为举世无双的奇观。
        - id: ch06-b08
          speaker: narrator
          text: 从假法蒂玛说过那句话以后，公主满脑子想的都是那枚大鹏鸟蛋，别的事情再也引不起她的兴趣。阿拉丁打猎归来，发现妻子心情坏透了，便一再追问出了什么事。公主终于告诉他，大厅的圆顶下没有悬挂一枚大鹏鸟蛋，这个缺憾破坏了她所有的兴致，自己再看那座大厅，已经得不到半点快乐。
        - id: ch06-b09
          speaker: aladdin
          text: 如果只为这件事，你很快就会称心如意。
        - id: ch06-b10
          speaker: narrator
          text: 阿拉丁擦亮神灯，命灯神带来一枚大鹏鸟蛋。灯神发出骇人的咆哮，震得整座大厅都摇晃起来。
        - id: ch06-b11
          speaker: lamp_genie
          text: 恶徒！我替你做了这么多事，难道还不够吗？你竟命我把自己的主人带来，悬在圆顶中央！你、你的妻子和宫殿都该烧成灰烬。幸好这要求不是你的本意，而是死去的非洲魔法师的弟弟教唆的。他杀死了那位圣洁女子，如今正假扮成她，藏在你的宫殿里。也是他把这个念头塞进你妻子心中。千万当心，他要杀你！
          emotion: angry
        - id: ch06-b12
          speaker: narrator
          text: 灯神说完，立刻消失了。阿拉丁回到公主身边，装作头痛难忍，请她把圣洁的法蒂玛叫来，让那位女子把手放在自己头上医治。公主丝毫没有起疑，马上派人去请。假法蒂玛来到近前，正要伸手，阿拉丁忽然抓住他藏着的匕首，一把夺了过来，随即刺穿了他的心脏。
        - id: ch06-b13
          speaker: princess
          text: 你做了什么？你杀死了那位圣洁的女子！
          emotion: surprised
        - id: ch06-b14
          speaker: aladdin
          text: 不，我杀死的是一个邪恶的魔法师。
        - id: ch06-b15
          speaker: narrator
          text: 阿拉丁把灯神的警告告诉公主，她这才明白，自己怎样受了假法蒂玛的欺骗，也知道那个恶人原来是非洲魔法师的弟弟。从这以后，再没有人来夺取神灯，阿拉丁与妻子终于过上了长久安宁的生活。后来，苏丹去世，阿拉丁继承王位，在位许多年。他身后留下了绵延的王室血脉，子孙中又出了许多位国王。
