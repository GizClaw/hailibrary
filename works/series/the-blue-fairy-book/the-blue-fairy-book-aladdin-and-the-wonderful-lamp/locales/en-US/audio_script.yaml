  chapters:
    - id: ch01
      title: The False Uncle
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor tailor with a son named Aladdin. The boy was careless and idle. He spent every day playing ball in the streets with boys much like himself. His father grieved so deeply over him that he died. Even then, though his mother wept and pleaded, Aladdin would not change.
        - id: ch01-b02
          speaker: narrator
          text: One day, a stranger stopped Aladdin in the street. He asked the boy's age and whether he was the son of Mustapha the tailor.
        - id: ch01-b03
          speaker: aladdin
          text: Yes, sir, I am. But my father died a long time ago.
        - id: ch01-b04
          speaker: narrator
          text: The stranger was a famous African magician. He threw his arms around Aladdin and kissed him.
        - id: ch01-b05
          speaker: african_magician
          text: I am your uncle. You look so much like my brother that I knew you at once. Go tell your mother I am coming to see her.
        - id: ch01-b06
          speaker: narrator
          text: Aladdin ran home with the news.
        - id: ch01-b07
          speaker: aladdins_mother
          text: Your father did have a brother, child, though I always believed he was dead.
        - id: ch01-b08
          speaker: narrator
          text: She prepared supper and sent Aladdin to fetch him. The stranger arrived with wine and fruit. He kissed the place where Mustapha used to sit, then explained that he had been away from the country for forty years. When he asked Aladdin what trade he followed, the boy hung his head and his mother began to cry.
        - id: ch01-b09
          speaker: narrator
          text: Hearing that Aladdin refused to learn any trade, the magician offered to open a shop for him and fill it with goods. The next day, he bought the boy fine clothes, showed him all around the city, and brought him home at night. His mother was overjoyed to see him dressed so well.
        - id: ch01-b10
          speaker: narrator
          text: The following morning, the magician led Aladdin far beyond the city gates and into beautiful gardens. Beside a fountain, he took a cake from his sash and shared it with the boy. Then they walked on toward the mountains. Aladdin grew so tired that he begged to turn back, but the magician kept him moving with pleasant stories.
        - id: ch01-b11
          speaker: narrator
          text: At last they reached a narrow valley between two mountains.
        - id: ch01-b12
          speaker: african_magician
          text: We stop here. I will show you something wonderful. Gather some sticks while I make a fire.
        - id: ch01-b13
          speaker: narrator
          text: When the fire was burning, the magician threw powder into it and spoke magical words. The ground shook and opened. A square stone appeared, with a brass ring fixed in its center. Aladdin tried to run. The magician caught him and struck him so hard that he fell.
        - id: ch01-b14
          speaker: aladdin
          text: Uncle, what have I done?
          emotion: fearful
        - id: ch01-b15
          speaker: african_magician
          text: Do not be afraid. Just obey me. A treasure lies under this stone, and it belongs to you alone. No one else can touch it, so you must follow every word I say.
        - id: ch01-b16
          speaker: narrator
          text: The word treasure swept away Aladdin's fear. As instructed, he took the ring and spoke the names of his father and grandfather. The stone lifted easily, revealing a flight of steps.
        - id: ch01-b17
          speaker: african_magician
          text: Go down those steps. At the bottom, an open door leads into three great halls. Pull up your robe and touch nothing as you pass, or you will die that instant. Beyond them is a garden of fine fruit trees. Cross it to the terrace. You will find a lighted lamp in a niche. Pour away its oil and bring the lamp to me.
        - id: ch01-b18
          speaker: narrator
          text: The magician gave Aladdin a ring from his own finger and wished him success. Below the stone, the boy found everything exactly as he had been told. He tucked up his robe and crossed the three halls without touching a thing. In the garden beyond, he picked fruit from the trees. Then he climbed to the terrace, emptied the oil from the burning lamp, and carried it back through the halls to the cave entrance.
        - id: ch01-b19
          speaker: african_magician
          text: Hurry! Give me the lamp!
        - id: ch01-b20
          speaker: aladdin
          text: Not until you pull me out of here.
        - id: ch01-b21
          speaker: narrator
          text: The magician flew into a rage. He cast more powder on the fire and spoke another spell. The stone rolled back into place, sealing Aladdin below.
        - id: ch01-b22
          speaker: narrator
          text: Then the magician left Persia forever. He was no uncle at all. His magic books had told him of a wonderful lamp that could make him the most powerful man in the world. He knew where it lay, but only another person's hand could give it to him. He had chosen foolish Aladdin to fetch it and meant to kill the boy afterward.
    - id: ch02
      title: The Two Genies
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Aladdin spent two days in the darkness, crying and grieving. At last he clasped his hands to pray. As he did, he rubbed the ring the magician had given him. An enormous, terrifying genie rose from the earth.
        - id: ch02-b02
          speaker: ring_genie
          text: What do you ask of me? I am the Slave of the Ring, and I will obey you in all things.
        - id: ch02-b03
          speaker: aladdin
          text: Get me out of this place!
        - id: ch02-b04
          speaker: narrator
          text: The earth opened, and suddenly Aladdin stood outside. When his eyes had grown used to the daylight, he made his way home and fainted on the threshold.
        - id: ch02-b05
          speaker: narrator
          text: Once he recovered, he told his mother everything. He showed her the lamp and the fruit from the enchanted garden, which was really made of precious stones. Then he asked for food.
        - id: ch02-b06
          speaker: aladdins_mother
          text: Oh, child, there is nothing to eat. I have spun a little cotton. I will sell it and buy us something.
        - id: ch02-b07
          speaker: narrator
          text: Aladdin told her to keep the cotton. He would sell the lamp instead. Because it was filthy, his mother began rubbing it so it might bring a better price. At once, a hideous genie appeared and asked for her command. She fainted.
        - id: ch02-b08
          speaker: aladdin
          text: Bring us something to eat!
        - id: ch02-b09
          speaker: narrator
          text: The genie returned with a silver bowl, twelve silver plates heaped with rich food, two silver cups, and two bottles of wine. When Aladdin's mother woke, she stared at the feast.
        - id: ch02-b10
          speaker: aladdins_mother
          text: Where did all this wonderful food come from?
          emotion: surprised
        - id: ch02-b11
          speaker: aladdin
          text: Do not ask now. Eat.
        - id: ch02-b12
          speaker: narrator
          text: They breakfasted until dinnertime, and Aladdin explained the lamp. His mother begged him to sell it and stay away from such spirits.
        - id: ch02-b13
          speaker: aladdin
          text: No. Chance has shown us what the lamp can do, so we will use it. We will use the ring too, and I will always keep that on my finger.
        - id: ch02-b14
          speaker: narrator
          text: When the food was gone, Aladdin sold the silver plates one by one. After the last was sold, the genie brought another set. In this way, mother and son lived for many years.
        - id: ch02-b15
          speaker: narrator
          text: One day, the Sultan ordered everyone indoors with their shutters closed while his daughter went to the bath and returned. The Princess always wore a veil, and Aladdin longed to see her face. He hid behind the bathhouse door and looked through a crack. As she entered, she lifted her veil. She was so beautiful that he fell in love at once.
        - id: ch02-b16
          speaker: narrator
          text: Aladdin came home so changed that his mother grew frightened. He told her he loved the Princess so deeply that he could not live without her. He meant to ask her father for her hand. His mother burst out laughing at such an impossible idea. Still, he kept pleading until she agreed to carry his request to the Sultan.
        - id: ch02-b17
          speaker: narrator
          text: She spread a cloth and filled it with the enchanted fruit. The jewels flashed and sparkled more brightly than any stones she had ever seen. Trusting in the lamp, she carried them to the palace. The Grand Vizier and the council lords entered just before her. She stood facing the Sultan, but he paid no attention.
        - id: ch02-b18
          speaker: narrator
          text: She returned every day for a week and always stood in the same place. As the council ended on the sixth day, the Sultan spoke to his Vizier.
        - id: ch02-b19
          speaker: sultan
          text: That same woman comes into the audience hall every day with something wrapped in a cloth. The next time she appears, call her forward. I want to know what she needs.
        - id: ch02-b20
          speaker: narrator
          text: The next day, the Vizier signaled to her. She knelt at the foot of the throne.
        - id: ch02-b21
          speaker: sultan
          text: Stand up, good woman, and tell me what you want.
        - id: ch02-b22
          speaker: narrator
          text: She hesitated. The Sultan dismissed everyone but the Vizier and promised to forgive whatever she might say.
        - id: ch02-b23
          speaker: aladdins_mother
          text: My son is desperately in love with the Princess. I begged him to forget her, but he would not. He threatened to do something terrible unless I asked Your Majesty to let him marry her. Please forgive me, and forgive my son Aladdin too.
        - id: ch02-b24
          speaker: narrator
          text: The Sultan kindly asked what she had brought. She opened the cloth and presented the jewels. He stared in amazement, then turned to the Vizier.
        - id: ch02-b25
          speaker: sultan
          text: What do you say? Should I not give the Princess to a man who offers such a treasure for her?
          emotion: surprised
        - id: ch02-b26
          speaker: narrator
          text: The Vizier wanted the Princess for his own son. He asked the Sultan to wait three months, hoping his son could offer an even richer gift. The Sultan agreed.
        - id: ch02-b27
          speaker: sultan
          text: I consent to the marriage. But you must not come before me again for three months.
    - id: ch03
      title: The Sultan's Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Aladdin waited patiently for almost three months. But when only two had passed, his mother went into the city to buy oil and found everyone celebrating. She asked what had happened.
        - id: ch03-b02
          speaker: townsman
          text: Have you not heard? The Grand Vizier's son is marrying the Sultan's daughter tonight.
        - id: ch03-b03
          speaker: narrator
          text: She ran home breathless and told Aladdin. At first the news crushed him. Then he remembered the lamp and rubbed it.
        - id: ch03-b04
          speaker: lamp_genie
          text: What do you wish?
        - id: ch03-b05
          speaker: aladdin
          text: You know the Sultan broke his promise to me. The Vizier's son is to marry the Princess. Tonight, bring the bride and bridegroom here.
        - id: ch03-b06
          speaker: lamp_genie
          text: Master, I obey.
        - id: ch03-b07
          speaker: narrator
          text: Aladdin went to his room. At midnight, the genie arrived with the bed that held the Princess and the Vizier's son.
        - id: ch03-b08
          speaker: aladdin
          text: Take the bridegroom outside into the cold. Bring him back at daybreak.
        - id: ch03-b09
          speaker: narrator
          text: The genie carried the Vizier's son away, leaving the Princess alone with Aladdin.
        - id: ch03-b10
          speaker: aladdin
          text: Do not be afraid. You were promised to me by your unjust father, and you are to be my wife. I will not harm you.
          emotion: calm
        - id: ch03-b11
          speaker: narrator
          text: The Princess was too frightened to answer. She spent the most miserable night of her life, while Aladdin lay beside her and slept soundly. At daybreak, the genie returned the shivering bridegroom to the bed and carried it back to the palace.
        - id: ch03-b12
          speaker: narrator
          text: Soon the Sultan came to wish his daughter good morning. The unhappy bridegroom leaped up and hid. The Princess said nothing and looked deeply sorrowful. The Sultan sent her mother to speak with her.
        - id: ch03-b13
          speaker: princess_mother
          text: Child, why will you not speak to your father? What happened to you?
        - id: ch03-b14
          speaker: narrator
          text: The Princess sighed, then told her mother how the bed had been carried to a strange house and what had happened there. Her mother did not believe a word. She told the Princess to get up and forget the whole thing as a foolish dream.
        - id: ch03-b15
          speaker: narrator
          text: The next night, everything happened again. In the morning, the Princess once more refused to speak. This time the Sultan threatened to have her head cut off. She told him the truth and urged him to question the Vizier's son.
        - id: ch03-b16
          speaker: narrator
          text: The Sultan ordered the Vizier to ask his son, and the young man admitted it all.
        - id: ch03-b17
          speaker: viziers_son
          text: I love the Princess dearly, but I would rather die than suffer another night like that. I beg you to end this marriage.
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: His request was granted. The feasts stopped, and all the rejoicing came to an end.
        - id: ch03-b19
          speaker: narrator
          text: When the full three months had passed, Aladdin sent his mother back to remind the Sultan of his promise. She took her old place in the audience hall. The Sultan had forgotten Aladdin, but the sight of her brought everything back. Still, when he noticed her poverty, he liked the match less than ever. He asked the Vizier what to do.
        - id: ch03-b20
          speaker: narrator
          text: The Vizier advised him to demand a price for the Princess that no living man could pay.
        - id: ch03-b21
          speaker: sultan
          text: Good woman, a Sultan must keep his promises, and I will keep mine. First, your son must send forty golden basins filled to the top with jewels. Forty Black servants must carry them, with forty splendidly dressed white servants leading the way. Tell him I await his answer.
        - id: ch03-b22
          speaker: narrator
          text: Aladdin's mother bowed and went home, certain that everything was lost. She repeated the demand.
        - id: ch03-b23
          speaker: aladdins_mother
          text: The Sultan may wait a very long time for your answer!
        - id: ch03-b24
          speaker: aladdin
          text: Not as long as you think, Mother. I would do far more than that for the Princess.
        - id: ch03-b25
          speaker: narrator
          text: He summoned the genie. Within moments, eighty servants filled the little house and garden. The forty Black servants carried the golden basins, and the forty white servants led them toward the palace in pairs. Aladdin's mother followed. Their clothes were magnificent, and splendid jewels covered their belts. Crowds packed the streets to watch the procession and stare at the basins balanced on the servants' heads.
        - id: ch03-b26
          speaker: narrator
          text: At the palace, they knelt before the Sultan. Then they formed a half circle around his throne, arms crossed, while Aladdin's mother presented them. The Sultan hesitated no longer.
        - id: ch03-b27
          speaker: sultan
          text: Good woman, go home and tell your son I am waiting to welcome him with open arms.
        - id: ch03-b28
          speaker: narrator
          text: She hurried home and told Aladdin to make haste. But first, he called the genie.
        - id: ch03-b29
          speaker: aladdin
          text: Prepare a scented bath and a robe covered in rich embroidery. Bring me a horse finer than the Sultan's and twenty servants to attend me. Give my mother six beautifully dressed servants of her own. And bring ten purses, each holding a thousand gold pieces.
        - id: ch03-b30
          speaker: narrator
          text: Everything appeared at once. Aladdin rode through the streets while his attendants scattered gold. The boys who had played with him in childhood did not recognize him. He had grown so handsome.
        - id: ch03-b31
          speaker: narrator
          text: When the Sultan saw Aladdin, he stepped down from his throne, embraced him, and led him to a waiting feast. He intended to hold the wedding that very day.
        - id: ch03-b32
          speaker: aladdin
          text: I cannot marry the Princess yet. First, I must build a palace worthy of her.
        - id: ch03-b33
          speaker: narrator
          text: Aladdin took his leave. Back home, he gave the genie another command.
        - id: ch03-b34
          speaker: aladdin
          text: Build me a palace of the finest marble, set with jasper, agate, and other precious stones. In the center, make a great domed hall with walls of solid gold and silver. Put six windows in each wall. Set every lattice with diamonds and rubies, except for one window, which you must leave unfinished. Add stables, horses, grooms, and servants. Go and do it.
    - id: ch04
      title: The Palace of Wonders
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: By the next day, the palace was complete. The genie carried Aladdin there and showed him that every order had been obeyed. Even a velvet carpet stretched from Aladdin's palace to the Sultan's.
        - id: ch04-b02
          speaker: narrator
          text: Aladdin's mother dressed with care and walked to the royal palace with her six servants. Aladdin followed on horseback with his own attendants. The Sultan sent musicians with trumpets and cymbals to meet them. Music and cheers filled the air all along their way.
        - id: ch04-b03
          speaker: narrator
          text: At the palace, the Princess welcomed Aladdin's mother and treated her with great honor. That evening, she said goodbye to her father and crossed the velvet carpet to her new home. Aladdin's mother walked beside her, and one hundred servants followed behind. The Princess was delighted when she saw Aladdin waiting for her, and he hurried forward to receive her.
        - id: ch04-b04
          speaker: aladdin
          text: Princess, if my boldness has displeased you, blame your own beauty for it.
        - id: ch04-b05
          speaker: princess
          text: Now that I have seen you, I am glad to obey my father and marry you.
        - id: ch04-b06
          speaker: narrator
          text: After the wedding, Aladdin led her into the great hall. They ate together at the feast and danced until midnight.
        - id: ch04-b07
          speaker: narrator
          text: The next day, Aladdin invited the Sultan to see the palace. The ruler entered the hall and gazed at its twenty-four windows, glittering with rubies, diamonds, and emeralds.
        - id: ch04-b08
          speaker: sultan
          text: This is a wonder of the world! Only one thing puzzles me. Was that window left unfinished by mistake?
          emotion: surprised
        - id: ch04-b09
          speaker: aladdin
          text: No, Your Majesty. I left it that way so you could have the honor of completing the palace.
        - id: ch04-b10
          speaker: narrator
          text: The Sultan was pleased. He summoned the finest jewelers in the city and ordered them to make the last window match all the others.
        - id: ch04-b11
          speaker: jeweler
          text: Your Majesty, we cannot find enough jewels for such a window.
        - id: ch04-b12
          speaker: narrator
          text: The Sultan brought out his own jewels. The craftsmen soon used every one, yet after a month, the window was not even half finished. Aladdin knew the work was hopeless. He ordered them to remove everything and return the stones. Then, at his command, the genie finished the window.
        - id: ch04-b13
          speaker: narrator
          text: The Sultan was amazed to receive all his jewels back. He visited Aladdin and saw the completed window. He embraced his son-in-law, while the jealous Vizier hinted that enchantment had done the work.
        - id: ch04-b14
          speaker: narrator
          text: Aladdin's gentle manner won the hearts of the people. The Sultan made him captain of the armies, and Aladdin won several battles. Yet he remained as modest and courteous as ever. For several years, he and the Princess lived in peace and contentment.
        - id: ch04-b15
          speaker: narrator
          text: Far away in Africa, the magician remembered Aladdin. Through his magic, he learned that the boy had escaped the cave and married a princess. The poor tailor's son could only have gained such wealth and honor through the lamp. The magician traveled day and night until he reached the capital of China, determined to ruin Aladdin.
        - id: ch04-b16
          speaker: narrator
          text: Everywhere in the city, people were talking about a marvelous palace. The magician stopped one of them.
        - id: ch04-b17
          speaker: african_magician
          text: Forgive me, but what palace is everyone talking about?
        - id: ch04-b18
          speaker: townsman
          text: Have you never heard of Prince Aladdin's palace? It is the greatest wonder in the world. If you wish to see it, I will tell you the way.
        - id: ch04-b19
          speaker: narrator
          text: The magician thanked him and went to look. One glance told him that the Genie of the Lamp had raised it. Rage nearly drove him mad. He swore to seize the lamp and cast Aladdin back into deepest poverty.
        - id: ch04-b20
          speaker: narrator
          text: Aladdin had gone hunting for eight days, giving the magician time to act. He bought twelve new copper lamps, piled them in a basket, and walked to the palace with a mocking crowd behind him.
        - id: ch04-b21
          speaker: african_magician
          text: New lamps for old! Bring out your old lamps and take new ones!
        - id: ch04-b22
          speaker: narrator
          text: The Princess sat in the hall of twenty-four windows. She sent a servant to learn the cause of the noise. The young woman came back laughing, and the Princess scolded her.
        - id: ch04-b23
          speaker: slave
          text: Madam, how could anyone keep from laughing? An old fool is offering fine new lamps in exchange for old ones.
        - id: ch04-b24
          speaker: narrator
          text: Another servant remembered an old lamp on the cornice. It was the magic lamp. Aladdin had left it behind because he could not carry it hunting. The Princess knew nothing of its value, so she laughingly ordered the exchange.
        - id: ch04-b25
          speaker: slave
          text: Give me one of your new lamps for this old one.
        - id: ch04-b26
          speaker: narrator
          text: The magician snatched the lamp and told her to choose whichever new one she pleased. The crowd jeered, but he did not care. He stopped calling out and left the city. In a lonely place, he waited for night, then drew out the lamp and rubbed it.
        - id: ch04-b27
          speaker: african_magician
          text: Carry me to a lonely place in Africa. Take this palace and the Princess with me.
        - id: ch04-b28
          speaker: narrator
          text: The genie obeyed. Magician, palace, and Princess vanished from China and appeared together in Africa.
    - id: ch05
      title: The Vanished Palace
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, the Sultan looked toward Aladdin's palace and rubbed his eyes. The palace was gone. He summoned the Vizier.
        - id: ch05-b02
          speaker: sultan
          text: What has happened to the palace?
        - id: ch05-b03
          speaker: narrator
          text: The Vizier looked out and could scarcely believe what he saw. Once again he blamed enchantment, and this time the Sultan believed him. Thirty horsemen were sent to bring Aladdin back in chains.
        - id: ch05-b04
          speaker: narrator
          text: They met Aladdin riding home, bound him, and made him walk. But the people loved him. They armed themselves and followed, determined that he should not be harmed.
        - id: ch05-b05
          speaker: narrator
          text: At the palace, the Sultan ordered the executioner to cut off Aladdin's head. The executioner forced him to his knees, covered his eyes, and raised his sword. Then the Vizier saw the crowd break into the courtyard and begin climbing the walls. He called for the blow to stop.
        - id: ch05-b06
          speaker: narrator
          text: The people looked so dangerous that the Sultan gave way. He ordered Aladdin freed and pardoned him before them all. Aladdin asked what crime he had committed.
        - id: ch05-b07
          speaker: sultan
          text: You false wretch! Come here and look.
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: From the window, he showed Aladdin the empty ground where the palace had stood. Aladdin was too astonished to speak.
        - id: ch05-b09
          speaker: sultan
          text: Where are my daughter and your palace? I care far less for the building. But you must bring my daughter back, or you will lose your head.
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: Aladdin asked for forty days to find the Princess. If he failed, he promised to return and accept whatever death the Sultan chose for him. The Sultan granted his request, and Aladdin left the royal presence in sorrow.
        - id: ch05-b11
          speaker: narrator
          text: For three days, he wandered like a madman, asking everyone where his palace had gone. Some laughed at him, and others pitied him. At last he reached a river. He knelt to pray before throwing himself into the water. As he did, he rubbed the magic ring that was still on his finger. The genie from the cave appeared.
        - id: ch05-b12
          speaker: aladdin
          text: Save my life, genie. Bring my palace back.
        - id: ch05-b13
          speaker: ring_genie
          text: That is beyond my power. I am only the Slave of the Ring. You must command the Slave of the Lamp.
        - id: ch05-b14
          speaker: aladdin
          text: Then carry me to the palace and set me beneath my dear wife's window.
        - id: ch05-b15
          speaker: narrator
          text: In an instant, Aladdin stood in Africa beneath the Princess's window. Overcome with weariness, he fell asleep.
        - id: ch05-b16
          speaker: narrator
          text: Birds woke him in the morning, and his heart felt lighter. Now he knew that the loss of the lamp had caused all his troubles, though he could not guess who had stolen it.
        - id: ch05-b17
          speaker: narrator
          text: The Princess rose earlier that morning than she had since coming to Africa. The magician forced her to endure his company once each day, but she treated him so harshly that he did not dare remain in the palace. While she dressed, one of her women looked out and saw Aladdin.
        - id: ch05-b18
          speaker: narrator
          text: The Princess ran to the window and opened it. The sound woke Aladdin. She called him inside, and the two were filled with joy at finding each other again. After he kissed her, Aladdin spoke urgently.
        - id: ch05-b19
          speaker: aladdin
          text: Princess, before we speak of anything else, tell me for both our sakes what became of the old lamp I left on the cornice in the hall of twenty-four windows.
        - id: ch05-b20
          speaker: princess
          text: Oh, Aladdin, I caused all our sorrow without knowing it.
          emotion: sad
        - id: ch05-b21
          speaker: narrator
          text: She told him how the lamp had been exchanged.
        - id: ch05-b22
          speaker: aladdin
          text: Now I understand. The African magician did this. Where does he keep the lamp?
        - id: ch05-b23
          speaker: princess
          text: He carries it with him. I know because he drew it from inside his coat and showed it to me. He says your father ordered your execution and wants me to betray you and marry him. He speaks against you constantly, and I answer only with tears. If I keep refusing him, I fear he will turn violent.
          emotion: fearful
        - id: ch05-b24
          speaker: narrator
          text: Aladdin comforted her, then left the palace for a short time. In the town, he traded clothes with the first man he met and bought a certain powder. Disguised in the other man's clothes, he returned to the palace. The Princess watched for him and let him in through a small side door.
        - id: ch05-b25
          speaker: aladdin
          text: Dress in your finest clothes. Smile when the magician comes, and make him believe you have forgotten me. Invite him to supper and say you want to taste the wine of his country. He will leave to fetch some. While he is gone, I will tell you the rest.
        - id: ch05-b26
          speaker: narrator
          text: The Princess listened carefully. For the first time since leaving China, she dressed herself brightly, with a diamond belt and a diamond headdress. When she saw her reflection, she knew she had never looked more beautiful. Then she received the magician with a smile.
        - id: ch05-b27
          speaker: princess
          text: I have accepted that Aladdin is dead. No amount of weeping will bring him back, so I will mourn no longer. I have invited you to supper. I am tired of Chinese wine and would like to taste the wine of Africa.
        - id: ch05-b28
          speaker: narrator
          text: Astonished and delighted, the magician hurried to his wine cellar. While he was away, the Princess put Aladdin's powder into her own cup.
        - id: ch05-b29
          speaker: narrator
          text: When the magician returned, she asked him to drink to her health. As a sign that they were reconciled, she offered him her cup and took his. He began a long speech praising her beauty, but she stopped him.
        - id: ch05-b30
          speaker: princess
          text: Let us drink first. You may say whatever you wish afterward.
        - id: ch05-b31
          speaker: narrator
          text: The Princess held her cup to her lips. The magician emptied his and fell backward, dead. She opened the door to Aladdin and threw her arms around him. He gently put her aside, for his work was not finished.
        - id: ch05-b32
          speaker: narrator
          text: Aladdin took the lamp from the magician's coat and commanded its genie to carry the palace and everyone inside back to China. The Princess felt only two small jolts in her room. She did not realize that she was home again.
    - id: ch06
      title: The Palace Returns
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The Sultan sat alone, grieving for his lost daughter. He happened to look up and rubbed his eyes. Aladdin's palace stood where it had always been.
        - id: ch06-b02
          speaker: narrator
          text: He hurried there. Aladdin received him in the hall of twenty-four windows with the Princess beside him. He told the whole story and showed the Sultan the magician's body as proof. Ten days of feasting were proclaimed. It seemed that Aladdin might live peacefully for the rest of his life, but another danger was already coming.
        - id: ch06-b03
          speaker: narrator
          text: The African magician had a younger brother, even more wicked and cunning than he was. He traveled to China to avenge the magician's death. There he went to the cell of a holy woman named Fatima, hoping to use her name.
        - id: ch06-b04
          speaker: narrator
          text: He pressed a dagger to her chest and ordered her to obey or die. Then he took her clothes, colored his face to resemble hers, and covered himself with her veil. He murdered Fatima so she could never reveal the trick.
        - id: ch06-b05
          speaker: narrator
          text: Disguised as the holy woman, he walked toward Aladdin's palace. People gathered around him, kissing his hands and begging for blessings. The noise reached the Princess, and she sent her servant to the window.
        - id: ch06-b06
          speaker: slave
          text: It is the holy Fatima, Madam. People say her touch can cure their illnesses.
        - id: ch06-b07
          speaker: narrator
          text: The Princess had long wished to meet Fatima and sent for her. When the disguised magician arrived, he offered a prayer for the Princess's health and happiness. She seated him beside her and asked him to remain in the palace forever.
        - id: ch06-b08
          speaker: narrator
          text: This was exactly what he wanted. He agreed, though he kept his veil lowered so no one would discover him. The Princess showed him the great hall and asked what he thought.
        - id: ch06-b09
          speaker: magicians_brother
          text: It is truly beautiful. Still, I think one thing is missing.
        - id: ch06-b10
          speaker: princess
          text: What is missing?
        - id: ch06-b11
          speaker: magicians_brother
          text: If a roc's egg hung from the center of the dome, this hall would become the wonder of the world.
        - id: ch06-b12
          speaker: narrator
          text: After that, the Princess could think of nothing but the roc's egg. When Aladdin came home from hunting, he found her in a very bad temper and asked what troubled her.
        - id: ch06-b13
          speaker: princess
          text: I can take no pleasure in this hall while the dome has no roc's egg hanging from it.
        - id: ch06-b14
          speaker: aladdin
          text: If that is all, you will soon be happy again.
        - id: ch06-b15
          speaker: narrator
          text: He left her, rubbed the lamp, and ordered the genie to bring him a roc's egg. The genie let out such a terrible shriek that the hall shook.
        - id: ch06-b16
          speaker: lamp_genie
          text: Wretch! Have I not done everything you commanded? Now you order me to bring my own master and hang him from this dome. You, your wife, and your palace would deserve to burn to ashes, except that this wish did not begin with you. It came from the brother of the African magician you destroyed. He murdered the holy woman and is hiding in your palace under her veil. He put this desire into your wife's mind. Guard yourself. He means to kill you.
          emotion: angry
        - id: ch06-b17
          speaker: narrator
          text: With that, the genie vanished.
    - id: ch07
      title: The False Holy Woman
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Aladdin returned to the Princess and said his head ached. He asked her to bring holy Fatima so she could lay her hands upon it.
        - id: ch07-b02
          speaker: narrator
          text: The disguised magician came close. Aladdin seized the dagger hidden beneath his clothes and drove it into his heart.
        - id: ch07-b03
          speaker: princess
          text: What have you done? You have killed the holy woman!
          emotion: surprised
        - id: ch07-b04
          speaker: aladdin
          text: That was no holy woman. It was a wicked magician.
        - id: ch07-b05
          speaker: narrator
          text: Aladdin told her how the magician's brother had deceived her.
        - id: ch07-b06
          speaker: narrator
          text: After that, Aladdin and his wife lived in peace. When the Sultan died, Aladdin took his place. He ruled for many years and left behind a long line of kings.
