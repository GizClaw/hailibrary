  chapters:
    - id: ch01
      title: The Three Princes and Their Rarities
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a sultan with three sons and a niece. His eldest son was Prince Houssain, his second was Prince Ali, and his youngest was Prince Ahmed. His niece was Princess Nouronnihar. Her father, the Sultan's younger brother, had died while she was still very young, so the Sultan brought her into his own palace and raised her beside his sons.
        - id: ch01-b02
          speaker: narrator
          text: The Sultan cared for Nouronnihar's education as carefully as he cared for his own daughter's. At first, he meant to arrange a marriage between her and some neighboring prince when she came of age, forming a useful alliance through the match. Then he discovered that all three of his sons loved her passionately. The matter became far more difficult. He hoped Ali and Ahmed might yield to their elder brother Houssain, but neither would give her up. The three princes remained so stubborn that the Sultan could find no peaceful answer. At last he called them before him together.
        - id: ch01-b03
          speaker: sultan
          text: My sons, I have tried for your own peace to persuade you to stop seeking your cousin's hand, but none of you will agree. So each of you must travel to a different country. You know how much I delight in rare and remarkable things. I will give Nouronnihar to the one who brings me the most extraordinary rarity. Each of you will receive money for the journey and for whatever treasure you find.
        - id: ch01-b04
          speaker: narrator
          text: The princes had always obeyed their father, and each one privately hoped that fortune would favor him over his brothers. They accepted the test without complaint. The Sultan gave each son the money he had promised for the journey and the purchase. That same day they ordered every preparation and took leave of their father, so nothing would delay them in the morning. At dawn they rode out through the same city gate. Each prince was dressed as a merchant, and each had one trusted officer beside him disguised as a servant. Their horses were strong, and they carried everything needed for a long journey.
        - id: ch01-b05
          speaker: narrator
          text: For the whole first day, the three princes traveled together. That evening they reached an inn standing exactly where the road divided into three different tracks, and they decided to spend the night there. While they ate supper together, they settled every part of their plan. Each journey would last one year. At the end of that year, all three would return to this same inn. If one arrived before the others, he would wait there until both brothers joined him. Since they had left their father together, they wished to appear before him together when the trial was over. Before sunrise the next morning, they embraced one another and each wished the other two good fortune. Then they mounted their horses, chose separate roads, and rode away in three directions.
        - id: ch01-b06
          speaker: narrator
          text: Prince Houssain reached Bisnagar, the capital of a kingdom with the same name. He stayed at a khan for foreign merchants. The city had four great market districts surrounding the royal palace, and the next morning he went to explore one of them.
        - id: ch01-b07
          speaker: narrator
          text: Houssain stared in wonder at the size and order of the market. Its many streets were roofed with high vaults that shaded them from the sun while still allowing plenty of light. The shops were all made to the same size. Traders who sold the same goods occupied one street together, while craftspeople worked in the smaller lanes. Every shop seemed crowded with treasures. He saw the finest linens from many parts of India, some painted in brilliant colors with animals, trees, and flowers. There were silks and brocades from Persia, China, and other countries, porcelain from Japan and China, and splendid tapestries. Yet the goldsmiths and jewelers astonished him most. Worked gold and silver filled their shops, while the shine of pearls, diamonds, rubies, emeralds, and other precious stones almost dazzled his eyes.
        - id: ch01-b08
          speaker: narrator
          text: Rose sellers crowded the streets too. People carried bouquets in their hands or wore garlands on their heads, and merchants kept roses growing in pots, until the whole market smelled of flowers. After walking street by street through all these riches, Houssain grew tired. A merchant noticed and invited him to rest in his shop.
        - id: ch01-b09
          speaker: narrator
          text: Houssain had barely sat down when a crier passed with a square of tapestry over his arm. It was only about six feet wide and looked quite ordinary, yet the man called out a price of thirty purses. Houssain stopped him and examined it.
        - id: ch01-b10
          speaker: houssain
          text: How can such a small, plain piece of tapestry cost thirty purses?
        - id: ch01-b11
          speaker: tapestry_crier
          text: If thirty purses shocks you, sir, you will be even more surprised to hear that I must raise the price to forty. I am forbidden to sell it for less.
        - id: ch01-b12
          speaker: houssain
          text: Then there must be something extraordinary about it that I cannot see.
        - id: ch01-b13
          speaker: tapestry_crier
          text: Exactly. Anyone who sits on this tapestry can be carried in an instant to any place he wishes, and nothing can stop it.
        - id: ch01-b14
          speaker: narrator
          text: Houssain remembered why he had left home. Surely no gift could please his father more than this.
        - id: ch01-b15
          speaker: houssain
          text: If the tapestry truly has that power, forty purses will not be too much. I will give you an extra gift as well.
        - id: ch01-b16
          speaker: tapestry_crier
          text: I have told you the truth, sir, and proving it will be easy. Agree to buy the tapestry for forty purses, but only on condition that I show you what it can do. I assume you do not carry so much money through the market, so I will have to go with you to the khan where you lodge. First, with the shopkeeper's permission, we will take the tapestry into the back room and spread it on the floor. We will sit on it together, and you will wish to be carried to your own apartment. If we do not find ourselves there at once, there will be no bargain at all. You will be free to walk away and owe me nothing. As for the extra gift you offered, the seller already pays me for my work, but I will receive your kindness gratefully.
        - id: ch01-b17
          speaker: narrator
          text: Houssain accepted every condition and agreed to the bargain. The shopkeeper gave them permission to use the room behind his shop. There the crier spread the tapestry flat, and both men sat down upon it. Houssain formed a clear wish to be carried into his own apartment at the khan. Before he had time to wonder what would happen, the market vanished from around them. He and the crier were sitting together in that very apartment. No road, wall, crowd, or locked door had delayed them. Houssain needed no further proof of the tapestry's power. He counted out forty purses for the seller, then remembered his promise and gave the crier twenty pieces of gold as a personal gift.
        - id: ch01-b18
          speaker: narrator
          text: Prince Houssain was delighted to have found such a treasure almost as soon as he reached Bisnagar. He never doubted that it would win Nouronnihar for him. In his mind, it was impossible for either younger brother to discover anything that could compare with a tapestry able to cross any distance in an instant. He could have sat down on it and reached the meeting place that very day. But he would still have been obliged to wait there until the year ended, just as the brothers had agreed. He was also curious about the kingdom around him. So he remained in Bisnagar for several months. He saw its king and court and learned all he could about its strength, laws, customs, and religion while the appointed time passed.
        - id: ch01-b19
          speaker: narrator
          text: At last his longing to be nearer Nouronnihar overcame his curiosity. Houssain and his officer sat on the tapestry and wished themselves at the inn. They arrived at once, and Houssain lived there disguised as a merchant while he waited for his brothers.
        - id: ch01-b20
          speaker: narrator
          text: Prince Ali had taken the road toward Persia. Three days after leaving his brothers, he joined a caravan. Four days later he reached Schiraz, the Persian capital, where he passed himself off as a jeweler. The next morning he dressed and walked to the part of the city called the bezestein.
        - id: ch01-b21
          speaker: narrator
          text: Criers moved back and forth through the bezestein, carrying all kinds of goods and calling out prices. Among them, Ali noticed a man holding an ivory telescope. It was only about a foot long and no thicker than a man's thumb, yet the crier asked thirty purses for it. Nothing about the little tube appeared valuable enough to explain that price. Ali decided the crier must be mad. Wanting to learn whether he was mistaken, he went to a nearby shop and questioned the merchant standing at its door.
        - id: ch01-b22
          speaker: ali
          text: Sir, is that crier in his right mind? He wants thirty purses for that little ivory telescope.
        - id: ch01-b23
          speaker: merchant
          text: He was in his right mind yesterday, and he is one of the finest criers in the city. People trust him with the most valuable goods. If he asks thirty purses, the telescope must be worth that much for some reason. Sit and rest. He will pass this way again, and we can ask him.
        - id: ch01-b24
          speaker: narrator
          text: Ali accepted the seat. When the crier returned, the merchant called him over and explained that the stranger wondered why such an ordinary-looking telescope cost so much.
        - id: ch01-b25
          speaker: telescope_crier
          text: You are not the first person to think me mad because of this telescope, sir. Others had just as poor an opinion of me until they learned its secret. Let me explain that secret, and then you may judge whether the price is reasonable. Look closely at this ivory tube. It has a glass fitted at each end. If you look through the proper one and form a clear wish, you can see any person, place, or object in the world that you desire to behold, however far away it may be. Once you have tried it, I hope you will value it as highly as everyone else who has seen its power.
        - id: ch01-b26
          speaker: ali
          text: If you can prove that, I will gladly apologize for doubting you. Which end should I use?
        - id: ch01-b27
          speaker: narrator
          text: The crier showed Ali which end to use. First the Prince examined both pieces of glass, then raised the telescope to his eye. He formed a wish to see his father. At once the market disappeared from view, and Ali saw the Sultan as clearly as if he stood inside the council chamber. His father was in perfect health, seated upon the throne in the midst of his council. That sight reassured him, but there was one more person he longed to see. Apart from the Sultan, no one in the world was dearer to him than Nouronnihar. Ali wished for her image. Immediately he saw the princess seated at her dressing table with her women around her, laughing and speaking in the happiest humor.
        - id: ch01-b28
          speaker: narrator
          text: Ali needed no further proof. A glass that could show any person or place he wished to see seemed more valuable than anything else in the world. He believed he would never find another treasure like it if he let this one pass. He took the crier back to the khan where he lodged, counted out the full price, and received the telescope. Ali was overjoyed with his bargain. He felt certain that neither brother could bring home anything so rare, and he already imagined Nouronnihar as the reward for his travels. Until his caravan returned to India, he visited the Persian court without revealing his identity and spent his time seeing everything remarkable in Schiraz and the country nearby.
        - id: ch01-b29
          speaker: narrator
          text: When the returning caravan was ready, Ali joined it. The long journey was tiring, but he reached the meeting place safely and found Houssain waiting. Together they waited for Ahmed.
        - id: ch01-b30
          speaker: narrator
          text: Prince Ahmed had traveled to Samarcand. The day after he arrived, he too went to the bezestein. Before long he heard a crier asking thirty-five purses for an artificial apple. Ahmed stopped him and took the apple in his hand.
        - id: ch01-b31
          speaker: ahmed
          text: Tell me what remarkable power this apple has. Why should it cost thirty-five purses?
        - id: ch01-b32
          speaker: apple_crier
          text: If you judge only by the outside, sir, the apple may seem worthless. But think of its power and the good it can do for people, and you will see that thirty-five purses is no true measure of its value. Whoever owns it possesses a great treasure. It cures sick people even when they suffer from the most deadly diseases. If a patient is already dying, this apple will bring that person back immediately and restore perfect health. And the cure could not be simpler. The patient needs only to smell it.
        - id: ch01-b33
          speaker: ahmed
          text: That would make it priceless, if it is true. But what reason do I have to believe you?
        - id: ch01-b34
          speaker: apple_crier
          text: The whole city of Samarcand knows it is true, sir. You need not take my word alone. Ask the merchants standing around us and listen to what they say. Several can tell you that without this remedy they would not be alive today. You should also know how the apple was made. A celebrated philosopher of this city spent his whole life studying the powers of plants and minerals. After many years of experiments, he finally discovered this composition. With it he performed cures so astonishing that Samarcand will never forget them. Yet he himself died suddenly before he could use his own remedy. He left behind a wife and many young children with scarcely enough to live on. To support the family and provide for those children, his widow has decided to sell the apple.
        - id: ch01-b35
          speaker: narrator
          text: People gathered around and confirmed the crier's story. One man said that his friend was dangerously ill and had been given up for dead. Here was a chance to test the apple.
        - id: ch01-b36
          speaker: bystander
          text: My friend is close to death. If the apple can save him, you will see its power for yourself.
        - id: ch01-b37
          speaker: ahmed
          text: Cure this sick man, and I will pay forty purses for the apple.
        - id: ch01-b38
          speaker: apple_crier
          text: Come with me, sir, and we will make the test. If it succeeds, the apple is yours. I assure you it will always have the same effect.
        - id: ch01-b39
          speaker: narrator
          text: The crier led Ahmed and the others to the dying man. They held the artificial apple where he could smell it, and the promised cure took place before them. The sick man recovered, proving that the crier had told the truth. Ahmed counted out forty purses, and the crier placed the apple in his hands. With his treasure secured, Ahmed waited patiently for the first caravan returning to India. He joined it when it departed and completed the journey in perfect health. At last he reached the inn where Houssain and Ali were waiting for him.
        - id: ch01-b40
          speaker: narrator
          text: Reunited at the inn, the brothers showed one another the treasures they had brought from three distant lands. Houssain displayed the tapestry and explained that it could carry them anywhere. Ali brought out the ivory telescope, while Ahmed showed them the healing apple. They soon understood that each object possessed a power as wonderful as the others. Then Ali looked through his glass and wished to see Nouronnihar. The cheerful young woman he had seen in Schiraz was gone. Now she lay so dangerously ill that death seemed close. The brothers did not waste a moment arguing over whose treasure was greatest. All three sat together on Houssain's carpet. They wished to be carried to Nouronnihar, and in a single instant the inn vanished and her chamber surrounded them.
        - id: ch01-b41
          speaker: narrator
          text: The moment Ahmed realized they were inside Nouronnihar's chamber, he rose from the tapestry. Houssain and Ali stood with him, and all three hurried to the bedside. Ahmed placed the artificial apple directly beneath the princess's nose. For a few moments nothing happened. Then Nouronnihar opened her eyes. She turned her head from one side to the other and studied all the people gathered around her. Strength returned so completely that she sat upright and asked her attendants to dress her, exactly as if she had merely awakened from a sound and peaceful sleep. Her women could hardly contain their joy. They told her that the three princes had arrived together and saved her life, and that Ahmed had applied the remedy that restored her. Nouronnihar expressed her happiness at seeing all three. She thanked them together for what they had done, then offered Ahmed her particular thanks for the healing apple.
        - id: ch01-b42
          speaker: nouronnihar
          text: How happy I am to see you all again. I owe my life to the three of you, and Prince Ahmed, I owe my recovery to your wonderful apple.
        - id: ch01-b43
          speaker: narrator
          text: While Nouronnihar dressed, the princes went to throw themselves at their father's feet and pay their respects. The chief of the princess's attendants had already told the Sultan that they had returned, how they had reached her chamber, and how the cure had been performed. He received his sons with the greatest joy and embraced them all. Their safe return alone would have delighted him. Nouronnihar's recovery made his happiness greater still, for he loved his niece as dearly as if she had been his own daughter, and the physicians had already declared that they could do no more for her.
        - id: ch01-b44
          speaker: narrator
          text: After the proper greetings and ceremonies, each prince presented his rarity. Houssain had carefully carried the tapestry away from Nouronnihar's chamber rather than leave it behind. He laid it before the Sultan and described its power. Ali presented the ivory telescope and explained what it could reveal. Ahmed offered the artificial apple and told how it cured even a dying person. Each brother praised his gift while placing it in the Sultan's hands. Then all three asked him to pronounce their fate and declare which one would marry Nouronnihar, as he had promised. The Sultan already knew every detail of the princess's cure. He heard the brothers out without interrupting them, then remained silent for some time while he considered what justice required.
        - id: ch01-b45
          speaker: sultan
          text: My sons, nothing would please me more than choosing one of you, if I could do it with justice. Think carefully about whether that is possible. Ahmed, it is true that Nouronnihar owes her recovery to your artificial apple. Yet could you have helped her at all if Ali's telescope had not shown you the danger she was in? And even after you learned of it, could you have reached her in time if Houssain's tapestry had not carried all three of you to her chamber in an instant?
        - id: ch01-b46
          speaker: sultan
          text: Ali, your telescope warned you and your brothers that you were about to lose your cousin. They owe you greatly for that knowledge. Still, the warning would have done no good without Ahmed's apple and Houssain's tapestry. Houssain, Nouronnihar must be grateful for the service of your tapestry, because it was necessary to her cure. But it would have been useless if Ali's glass had not revealed her illness and Ahmed had not carried the remedy. The tapestry, telescope, and apple have no advantage over one another. Each was as necessary as the other two. I cannot grant Nouronnihar to any one of you on the strength of these gifts. The only reward your travels can give you is the shared honor of restoring her health.
        - id: ch01-b47
          speaker: sultan
          text: We need another test, and we can settle it today. Each of you must take a bow and one arrow to the great field where the horsemen exercise. I will give Nouronnihar to the prince whose arrow flies farthest.
        - id: ch01-b48
          speaker: narrator
          text: None of the three princes could object to this new decision. They left their father, obtained a bow and a single arrow apiece, and gave the weapons to their officers to carry. Then they went to the appointed plain, followed by a great crowd eager to see who would win. The Sultan soon arrived and ordered the contest to begin. As the eldest, Houssain took his bow first and sent his arrow across the field. Ali shot next, and his arrow landed far beyond Houssain's. Ahmed was the last to draw. His arrow flew so far that no one could see where it came down. Ahmed, his brothers, their attendants, and the people searched every place where it might have fallen. They looked both near and far, but no trace of the arrow could be found.
        - id: ch01-b49
          speaker: narrator
          text: Because no one had seen Ahmed's arrow fall, many believed it must have flown farther than either of the others. If so, Ahmed had won Nouronnihar fairly. But the Sultan insisted that the missing arrow had to be found before its distance could be proved with certainty. Ahmed protested that no arrow flying shorter than Ali's could have vanished from every searcher. Even so, his father would not change the ruling. He judged in Ali's favor and ordered preparations for the wedding. A few days later Prince Ali and Princess Nouronnihar were married with great magnificence.
        - id: ch01-b50
          speaker: narrator
          text: Houssain could not bear to attend the wedding. His grief was so great that he left the court, gave up his right to the throne, and became a hermit. Ahmed did not attend either, though he did not turn away from the world. He could not understand what had happened to his arrow. Secretly leaving his attendants, he went back to search once more.
        - id: ch01-b51
          speaker: narrator
          text: Ahmed returned to the exact places where Houssain's and Ali's arrows had been picked up. From there he walked straight ahead along the line his own arrow must have taken. He searched the ground carefully on both sides as he went. The distance grew so great that he began to think all his labor was useless, yet he could not bring himself to turn back. He kept moving forward until a wall of steep, broken rocks finally stopped him. The country around them was barren, and he now stood about four leagues from the field where the contest had begun.
    - id: ch02
      title: Prince Ahmed and Fairy Paribanou
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Near the rocks, Ahmed saw an arrow lying flat on the ground. He picked it up and stared. It was his own.
        - id: ch02-b02
          speaker: ahmed
          text: Neither I nor any living man could shoot an arrow this far. It must have struck the rock and fallen here. There is some mystery in this, and perhaps it may help me. Fortune took away the happiness I expected. Perhaps it has saved a greater blessing for me.
        - id: ch02-b03
          speaker: narrator
          text: The rocks were full of caves, and some appeared to run deep into the stone. Ahmed entered one and looked around. There he found an iron door with no visible lock. He feared it might be fastened, but when he pushed against it, the door opened. Beyond it, a smooth and easy path sloped downward without steps. Arrow in hand, he began to descend. At first he thought he was entering a place of complete darkness. Before long, however, a different light replaced the daylight behind him. The passage opened into a broad and spacious place, and fifty or sixty paces ahead stood a magnificent palace. Ahmed had scarcely enough time to take in the sight before someone came out to meet him.
        - id: ch02-b04
          speaker: narrator
          text: At that same moment, a lady of majestic bearing came out as far as the palace porch. A large company of women attended her. Every one of them was beautifully dressed, and every one seemed so lovely that Ahmed could hardly distinguish the mistress of the palace from those who served her. As soon as he realized that they had come to receive him, he hurried forward. He meant to bow and explain how his search had led him through the iron door before anyone could question him. But the great lady watched him approach and spoke before he had time to offer a single word.
        - id: ch02-b05
          speaker: paribanou
          text: Come nearer, Prince Ahmed. You are welcome here.
        - id: ch02-b06
          speaker: narrator
          text: Ahmed was astonished to hear his name in a place he had never known existed, so close to his father's capital. He bowed at the lady's feet, then rose.
        - id: ch02-b07
          speaker: ahmed
          text: Madam, thank you for welcoming me when my curiosity may have carried me farther than it should. May I ask how you know me, when you have lived so near and I have never known you?
        - id: ch02-b08
          speaker: paribanou
          text: Come into the hall, Prince, and I will answer you there.
        - id: ch02-b09
          speaker: narrator
          text: She led him into the hall and invited him to sit beside her on a sofa.
        - id: ch02-b10
          speaker: paribanou
          text: You said it surprised you that I know you while you know nothing of me. The surprise will end when I tell you who I am. Your own religion teaches you that genies live in this world as well as human beings. My father is one of the most powerful and distinguished of all the genies, and my name is Paribanou. There is only one more thing you need to understand. I thought you worthy of a happier fate than possessing Princess Nouronnihar. I watched when you drew your bow in the contest, and I knew your arrow would not naturally fly beyond Houssain's. Before it could fall, I caught it in the air. I gave it the motion it needed to reach these rocks and strike them near the place where you found it. That is how your arrow came so far. Now a favorable opportunity lies before you, and it is in your power to use it and become happy.
        - id: ch02-b11
          speaker: narrator
          text: Her voice changed as she spoke those last words. She looked tenderly at Ahmed, and a modest blush rose in her cheeks. He had no difficulty understanding the happiness she meant. Nouronnihar was now beyond his reach, while Paribanou seemed to surpass her in beauty, charm, and wit. From the magnificence of the palace, he could also guess at her immense riches. The disappointment that had driven him from the wedding no longer seemed like simple misfortune. He blessed the moment when he had decided to search for his arrow a second time, and he gave himself willingly to the love Paribanou offered.
        - id: ch02-b12
          speaker: ahmed
          text: Madam, if I could spend my life devoted to you, I would count myself the happiest of men. Forgive my boldness, but please admit to your court a prince who gives himself entirely to you.
        - id: ch02-b13
          speaker: paribanou
          text: Will you pledge your faith to me, as I pledge mine to you?
        - id: ch02-b14
          speaker: ahmed
          text: Yes, gladly. My queen, I give you my whole heart without reserve.
          emotion: happy
        - id: ch02-b15
          speaker: paribanou
          text: Then you are my husband, and I am your wife. You have eaten nothing today, so we will bring you a light meal while the wedding feast is prepared. Afterward I will show you the palace, and you will see that this hall is its plainest room.
        - id: ch02-b16
          speaker: narrator
          text: The women who had accompanied Paribanou understood her wishes. They left the hall and soon returned with excellent food and wine. Ahmed ate and drank until he was satisfied. Then Paribanou led him through the palace apartments. Everywhere he looked, he saw diamonds, rubies, emeralds, and other jewels set among pearls. Agate, jasper, porphyry, and the rarest marbles covered the rooms. The furniture alone was beyond price, yet even that seemed only one part of the riches spread through the palace. Ahmed had never seen anything like it. He admitted that until this day he had not even imagined that anything in the world could be so magnificent.
        - id: ch02-b17
          speaker: paribanou
          text: If my palace amazes you, what would you say of the palaces belonging to the chiefs of the genies? They are far larger and more magnificent. My gardens might charm you too, but we will save them for another time. Night is coming, and supper will soon be ready.
        - id: ch02-b18
          speaker: narrator
          text: Paribanou next led Ahmed into the only hall he had not yet seen, where the wedding supper was laid. It was no less splendid than the other apartments. Countless wax candles scented with amber burned in wall sconces. Though there were so many, they had been placed with such perfect balance that the light formed a beautiful pattern instead of a confusion. A long side table glittered with gold dishes. The work upon them was so fine that the craft was worth more than the weight of the gold. Several groups of richly dressed women began to sing, accompanied by harmonious instruments of every kind. When Ahmed and Paribanou sat at the table, she offered him the most delicate dishes and named each one as she served it. Everything tasted so exquisite that Ahmed praised it beyond measure and declared that no human feast could equal it. The wines were just as fine, though neither of them drank until dessert arrived with the choicest fruits and sweetmeats.
        - id: ch02-b19
          speaker: narrator
          text: The wedding feast did not end with that first magnificent supper. It continued through the following day, and the days after the celebration passed so happily that life in the palace seemed like one continual feast. Six months went by. Ahmed loved Paribanou and delighted in everything around him, yet he had never stopped loving and honoring his father. At last a powerful longing came over him to learn how the Sultan was. No messenger could satisfy that desire, because Ahmed wished to see his father with his own eyes. He told Paribanou what was in his heart and asked her permission to make the journey.
        - id: ch02-b20
          speaker: paribanou
          text: Go whenever you wish, Prince. I will not stand between you and your father. But please do not take offense if I advise you about how to behave when you reach his court. I do not think it wise to tell the Sultan about our marriage. Do not reveal that I am a fairy, and do not tell him where you have been living. Ask him to be satisfied with knowing that you are safe and happy, without demanding more. Make it clear that the only purpose of your visit is to ease his mind after your long absence and assure him that fortune has treated you well.
        - id: ch02-b21
          speaker: narrator
          text: Paribanou chose twenty splendidly mounted gentlemen to attend him. Ahmed embraced her and promised to return soon. Then he mounted a beautiful horse with magnificent trappings and rode to his father's capital.
        - id: ch02-b22
          speaker: narrator
          text: The distance to the capital was not great, and Ahmed soon reached it. The people recognized him with delight. They welcomed him with joyful cries and followed his splendid company in crowds all the way to the Sultan's apartment. His father received him with equal joy and held him in a loving embrace. Yet that welcome also carried a tender complaint. Ahmed's long disappearance had caused the Sultan deep pain. Since fortune had decided the contest in Ali's favor, he had feared that grief might have driven his youngest son into some rash and terrible action.
        - id: ch02-b23
          speaker: narrator
          text: Ahmed described his adventures without mentioning Paribanou or the secret palace.
        - id: ch02-b24
          speaker: ahmed
          text: Your Majesty, I ask only one favor. Please allow me to visit often, so I may pay my respects and learn how you are.
        - id: ch02-b25
          speaker: sultan
          text: I cannot refuse you, my son, though I would rather have you remain with me. At least tell me where I can send for you if you fail to come, or if I need you.
        - id: ch02-b26
          speaker: ahmed
          text: That is part of the mystery I cannot reveal. Please let me remain silent. I will visit so often that you may find me troublesome before you can accuse me of neglect.
        - id: ch02-b27
          speaker: sultan
          text: I will not press into your secrets. Come freely whenever you can. Nothing could please me more than your presence, and you will always be welcome.
        - id: ch02-b28
          speaker: narrator
          text: Ahmed stayed three days and returned to Paribanou on the fourth. A month later, she noticed that since his visit he never spoke of his father, though he had once mentioned him often. She thought Ahmed was holding back for her sake.
        - id: ch02-b29
          speaker: paribanou
          text: Prince, have you forgotten your father and your promise to visit him often? I have not forgotten what you told me. You should go soon and keep your word.
        - id: ch02-b30
          speaker: narrator
          text: Ahmed returned the next morning with the same number of attendants, though all were dressed and mounted more richly. The Sultan welcomed him with the same joy. Month after month Ahmed continued his visits without fail. Each time his own clothing and equipment appeared richer. His horse was more magnificently adorned, and his attendants came in finer dress on finer mounts. The growing splendor was simply part of his life with Paribanou, but those who watched him at court began to read another meaning into it.
        - id: ch02-b31
          speaker: narrator
          text: Some favorite viziers judged Ahmed's power by this growing splendor. They began telling the Sultan that his son might win the people's love and take the throne.
        - id: ch02-b32
          speaker: vizier
          text: Your Majesty, Prince Ahmed's wealth and following grow greater with every visit. If he wins the people to his side, he may try to dethrone you.
        - id: ch02-b33
          speaker: sultan
          text: You are mistaken. My son loves me, and I trust his loyalty. I have given him no reason to turn against me.
        - id: ch02-b34
          speaker: narrator
          text: The favorites kept accusing Ahmed until their warnings troubled the Sultan, though he hid that from them.
        - id: ch02-b35
          speaker: sultan
          text: I still do not believe Ahmed is as wicked as you claim. Even so, I thank you for your advice and accept that you mean well.
        - id: ch02-b36
          speaker: narrator
          text: The Sultan spoke this way so the favorites would not understand how deeply their accusations had affected him. Outwardly, he still defended Ahmed. Inwardly, fear had begun to work upon his mind. His son's splendid retinue now seemed like evidence of hidden power, and every visit gave the warnings fresh force. At last the Sultan resolved to learn where Ahmed lived and what resources he possessed. He did not even trust the grand vizier with the plan, because that honest minister had never accused the Prince. Instead, he secretly summoned a female magician and had her brought through a back door into his private apartment.
        - id: ch02-b37
          speaker: sultan
          text: Follow my son. Watch him carefully, discover where he goes, and report back to me.
        - id: ch02-b38
          speaker: narrator
          text: The magician knew where Ahmed had found his arrow. She hid near the rocks. At daybreak Ahmed rode toward them with his attendants, and she watched until the whole company suddenly vanished. The cliffs could not be crossed, so she guessed he had entered either a hidden cavern or a dwelling of genies and fairies.
        - id: ch02-b39
          speaker: narrator
          text: The magician came out of hiding and entered the hollow road among the rocks. She followed it to the farthest end, examining every side with care. She looked for cracks, doors, and the mouth of any cavern that might explain where the Prince had gone. Her search revealed nothing. She could not see the iron gate at all, because that gate appeared and opened only to men, and only to those whose presence pleased Paribanou. At last the magician accepted that further searching was useless. She returned to the palace with the one fact she had learned, that Ahmed vanished at the rocks into some hidden dwelling.
        - id: ch02-b40
          speaker: sultan
          text: Continue however you think best. I will wait patiently to see what you discover.
        - id: ch02-b41
          speaker: narrator
          text: He rewarded her with a valuable diamond. Knowing Ahmed visited once a month, the magician returned to the rocks before his next journey and waited there.
        - id: ch02-b42
          speaker: narrator
          text: When Ahmed rode out through the iron gate, he saw an old woman lying with her head against the rock and moaning as though in terrible pain. He turned his horse and asked what was wrong and how he might help.
        - id: ch02-b43
          speaker: magician
          text: I was traveling to the capital when a violent fever seized me. My strength failed, and I had to lie down here. There is no house nearby and no hope of help.
        - id: ch02-b44
          speaker: ahmed
          text: Good woman, help is closer than you think. I can take you where you will soon be cured. Try to rise, and one of my men will carry you behind him.
        - id: ch02-b45
          speaker: narrator
          text: The magician was only pretending so she could discover Ahmed's home, but she accepted his offer. To make the trick convincing, she struggled several times and seemed unable to stand. Two attendants dismounted, lifted her behind another rider, and followed Ahmed back through the iron gate. In Paribanou's outer court, Ahmed sent word that he needed to speak with her.
        - id: ch02-b46
          speaker: narrator
          text: Paribanou hurried out, wondering why he had returned so soon.
        - id: ch02-b47
          speaker: ahmed
          text: Princess, please take pity on this poor woman. I found her helpless beside the road and promised her the care she needs. I know your goodness will not let you abandon her.
        - id: ch02-b48
          speaker: narrator
          text: Paribanou studied the supposed invalid while Ahmed spoke. She ordered two attendants to carry the woman inside and care for her exactly as they would care for Paribanou herself. Then she went close to Ahmed and whispered.
        - id: ch02-b49
          speaker: paribanou
          text: Prince, this woman is not nearly as sick as she pretends to be. I have watched her closely, and unless I am greatly mistaken, she is an impostor. Her visit will become the cause of serious trouble for you. Even so, do not let that knowledge disturb you, and do not regret the kindness you have shown her. Whatever may be planned against you, and whatever snares your enemies may set, trust me to recognize them. I will find a way to free you from every one. Go now and continue your journey to your father's court.
        - id: ch02-b50
          speaker: ahmed
          text: My princess, I have never knowingly harmed anyone, so I cannot imagine why anyone would wish to harm me. But even if they do, I will not stop doing good whenever I have the chance.
        - id: ch02-b51
          speaker: narrator
          text: Ahmed rode on to his father's palace. Meanwhile, the two fairies carried the magician into a beautifully furnished apartment. They seated her on a sofa and supported her back with a cushion of gold brocade. In front of her, they turned the sofa into a bed. Its quilt was embroidered with silk, its sheets were made from the finest linen, and a cloth-of-gold coverlet lay over everything. The old sorceress pretended that the fever left her unable to help herself at all, so the women placed her in the bed and settled her carefully. Then one attendant went out and soon returned carrying a china dish filled with a certain liquid, while the other helped the magician sit upright.
        - id: ch02-b52
          speaker: fairy_attendant
          text: Drink this. It is Water from the Fountain of Lions, and it cures every kind of fever. You will feel its effect within an hour.
        - id: ch02-b53
          speaker: narrator
          text: After pretending to resist, the magician swallowed the liquid. The attendants covered her in bed.
        - id: ch02-b54
          speaker: fairy_attendant
          text: Rest quietly and sleep if you can. We will return in an hour, and we hope to find you completely well.
        - id: ch02-b55
          speaker: narrator
          text: When they returned, the magician was dressed and sitting on the sofa.
        - id: ch02-b56
          speaker: magician
          text: What a marvelous medicine! It cured me even sooner than you promised. I am ready to continue my journey.
        - id: ch02-b57
          speaker: narrator
          text: The attendants said they were glad that she had recovered so quickly. Since they were fairies like their mistress, they knew very well that she had never been ill, but they continued to treat her courteously. They walked before her and led her through several apartments. Each room was nobler and more richly furnished than the room where she had rested. At last they entered a vast hall, the grandest in the palace. Paribanou sat there on a throne of solid gold, enriched with diamonds, rubies, and pearls of extraordinary size. A great company of beautiful fairies stood on both sides of her, all dressed with equal richness.
        - id: ch02-b58
          speaker: narrator
          text: The sight overwhelmed the magician. She bowed low before the throne but could not speak the thanks she had prepared.
        - id: ch02-b59
          speaker: paribanou
          text: Good woman, I am glad I could help you, and glad to see that you can continue your journey. I will not delay you. If you wish to see the palace, follow my attendants and they will show it to you.
        - id: ch02-b60
          speaker: narrator
          text: After Paribanou's attendants had shown her the wonders of the palace, the magician was allowed to leave. She went straight back to the Sultan and related everything that had happened. She described how Ahmed had found her at the rocks, carried her through an invisible entrance, and placed her in the care of the fairies. She spoke of the Water from the Fountain of Lions, the rooms filled with riches, Paribanou's golden throne, and the host of fairies who served her. Most importantly, she revealed that Ahmed had married Paribanou. In the magician's telling, the Prince had become richer and more powerful than all the kings in the world. She warned that a man with such wealth and fairy aid might easily return to the capital, win the people, and take his father's throne. The Sultan still knew that Ahmed's natural disposition was good, yet he could not keep the old woman's warning from troubling him.
        - id: ch02-b61
          speaker: sultan
          text: I thank you for your efforts and your advice. This matter is too important to ignore. I will consider it with my council.
        - id: ch02-b62
          speaker: narrator
          text: The favorite viziers urged the Sultan to kill Ahmed. The magician offered a different plan.
        - id: ch02-b63
          speaker: magician
          text: Do not kill the Prince. Instead, make him bring Your Majesty one wonder after another through the Fairy's power. Continue asking for impossible things until she grows tired of him and sends him away. Then he will lose the greatness that troubles you. Here is the first request. Whenever Your Majesty takes the field, you must spend a great sum on pavilions and tents for the army. You also need many mules and camels merely to carry that baggage. Ask Prince Ahmed to use his influence with the Fairy and obtain a pavilion that one man can carry in his hand, yet which becomes large enough to shelter your entire army against every kind of bad weather.
        - id: ch02-b64
          speaker: narrator
          text: The Sultan asked whether his favorites had a better idea. None did, so he chose the magician's plan as less cruel than theirs. The next day he asked Ahmed for the pavilion.
        - id: ch02-b65
          speaker: ahmed
          text: Your Majesty asks for something that seems almost impossible. I will reluctantly beg this favor from my wife, but I cannot promise success. If I never return, you will know that I failed. Please forgive me then, and remember that your request placed me in that position.
        - id: ch02-b66
          speaker: sultan
          text: My son, I would be deeply sorry if this request kept you from me forever. But you do not understand a husband's influence over his wife. If a fairy who loves you refuses so small a favor for your father, then her love cannot be very great.
        - id: ch02-b67
          speaker: narrator
          text: Ahmed left the court and returned to Paribanou, but the request weighed heavily upon him throughout the journey. He knew that genies and fairies possessed powers beyond human understanding, yet he did not know whether even those powers could produce such a pavilion. More than failure, he feared that asking would offend his wife. Until this moment, he had been satisfied with her love and had never used that love to demand a gift. Paribanou saw the sadness in his face as soon as he arrived. She asked what troubled him, but Ahmed hesitated. She continued pressing him gently until at last he could no longer hide the cause.
        - id: ch02-b68
          speaker: ahmed
          text: Until now, your love has been enough for me, and I have never asked another favor. This request does not come from me. My father wants a pavilion large enough to shelter himself, his court, and his whole army, but small enough for one man to carry. Please remember that it is my father who asks.
        - id: ch02-b69
          speaker: paribanou
          text: Prince, I am sorry such a small matter has made you so unhappy.
        - id: ch02-b70
          speaker: narrator
          text: Smiling, she summoned her treasurer.
        - id: ch02-b71
          speaker: paribanou
          text: Nourgihan, bring me the largest pavilion in my treasury.
        - id: ch02-b72
          speaker: narrator
          text: Nourgihan soon returned with the pavilion. Although Paribanou had called it the largest tent in her treasury, Nourgihan could hold it easily in one hand. Indeed, it was so small that when she closed her fingers, the whole thing fit inside her palm. She presented it to Paribanou, who passed it to Ahmed and told him to examine it. He turned the tiny bundle over in his hand. His father's request had been for a shelter large enough to cover an entire court and army. This object seemed too small for even one person. Ahmed tried to hide his disbelief, but surprise showed plainly on his face. He thought Paribanou must be teasing him, and when she saw his expression, she burst out laughing.
        - id: ch02-b73
          speaker: paribanou
          text: Do you think I am joking? You will soon see that I am serious. Nourgihan, take the tent outside and raise it, so the Prince can decide whether it is large enough for his father's army.
        - id: ch02-b74
          speaker: narrator
          text: Nourgihan took the folded pavilion and walked a great distance from the palace before she began to set it up. As the tent opened, it spread farther and farther across the ground. By the time she finished, one end reached all the way back to the palace itself. Ahmed had first thought the opened tent still looked small from where he stood. Once he understood its true size, he saw that it could shelter not merely his father's court and army, but two armies larger than any force the Sultan could bring into the field.
        - id: ch02-b75
          speaker: ahmed
          text: My princess, forgive me for doubting you. After what I have seen, I believe nothing is impossible for you.
        - id: ch02-b76
          speaker: paribanou
          text: The pavilion is larger than your father will need. It has another property too. It grows larger or smaller to fit the army it must cover.
        - id: ch02-b77
          speaker: narrator
          text: Nourgihan took the pavilion down again. As she folded it, the enormous shelter became smaller and smaller until she could once more place it in Ahmed's hand. He accepted it with gratitude. He remained with Paribanou only until the next morning, then mounted his horse and rode to his father with the same attendants as before. The Sultan had been certain that no such pavilion existed, so Ahmed's quick return astonished him. When the Prince placed the tiny bundle in his hand, he admired its smallness but could hardly believe that this was the requested gift. They carried it to the great field where the archery contest had been held. Once it was set up, the Sultan walked beneath it and saw that the shelter could cover an army twice as large as any force he could bring into battle. His amazement was so great that for a time he could scarcely recover himself.
        - id: ch02-b78
          speaker: narrator
          text: Still, the Sultan was not satisfied.
        - id: ch02-b79
          speaker: sultan
          text: My son, I have already told you how grateful I am for this pavilion. I count it the most valuable object in my entire treasury. But there is one more thing you can do that would please me just as much. I have been told that your wife uses a certain liquid called Water from the Fountain of Lions. It cures every kind of fever, even the most dangerous. I am certain that my health is dear to you, so I do not doubt that you will ask her for one bottle. Bring it to me as a perfect medicine that I may keep ready whenever I have need of it. Do this important service as well, and you will have completed the duty of a good son toward a loving father.
        - id: ch02-b80
          speaker: narrator
          text: Ahmed returned and repeated the request to Paribanou.
        - id: ch02-b81
          speaker: paribanou
          text: There is great wickedness behind this demand, Prince, and you will understand why when I explain what your father is asking. The Fountain of Lions stands in the center of the courtyard of a great castle. Four fierce lions guard the only entrance. They never all sleep at once. Two lie down and rest while the other two remain awake, and then they change places. Anyone who tries to pass them without knowing their secret faces certain death. But do not allow that danger to frighten you. I can give you everything you need to go among them, reach the fountain, and return without harm.
        - id: ch02-b82
          speaker: narrator
          text: Paribanou was working with several balls of thread beside her. She picked one up and gave it to Ahmed.
        - id: ch02-b83
          speaker: paribanou
          text: First, take this ball of thread. In a moment I will tell you how to use it. Next, prepare two horses. You must ride one yourself and lead the other. Have a sheep killed today and cut into four equal quarters, then load those four pieces on the second horse. You must also carry the bottle I will give you for the water. Set out early tomorrow morning. As soon as you pass beyond our iron gate, throw this ball of thread on the ground in front of you. It will begin rolling by itself and will not stop until it reaches the gates of the castle. Follow wherever it leads.
        - id: ch02-b84
          speaker: paribanou
          text: When the thread stops, you will find the castle gates standing open. The two lions on watch will see you and roar. Their voices will wake the other pair, so all four will be waiting when you approach. Do not lose courage. Take the quarters of mutton from the second horse and throw one piece to each lion. The moment they begin to eat, clap your heels to your horse and ride straight through the middle of them. Go quickly to the fountain. Do not dismount. Lean down, fill the bottle from horseback, turn at once, and ride back with the same speed. The lions will be so occupied with their meat that they will allow you to pass them a second time.
        - id: ch02-b85
          speaker: narrator
          text: Ahmed left early the next morning at the hour Paribanou had appointed. He rode one horse and led the other with the four quarters of mutton and the bottle. Beyond the iron gate, he threw the ball of thread before him. It rolled steadily onward, and Ahmed followed until it stopped at the open gates of the castle. The two waking lions roared and roused the sleeping pair. Ahmed did not allow their noise to frighten him. He threw one quarter of mutton to each lion, spurred his horse between them, and raced into the courtyard. Without dismounting, he reached down and filled Paribanou's bottle at the fountain. Then he wheeled his horse and rode back through the gates while all four lions remained busy with their meat. He had escaped as safely as he had entered. A short distance from the castle, however, he looked back and saw two lions following him. Believing they meant to attack, he drew his sword and prepared to defend himself.
        - id: ch02-b86
          speaker: narrator
          text: Then one lion moved ahead of him and showed by its gentle movements that it meant no harm, while the other remained behind. Ahmed sheathed his sword. With one lion leading and one guarding the rear, he reached the capital. They escorted him to the palace gates, frightening everyone who saw them despite their peaceful manner, and then returned the way they had come.
        - id: ch02-b87
          speaker: narrator
          text: Officers led Ahmed into the Sultan's apartment, where the favorites surrounded the throne. Ahmed placed the bottle at his father's feet and bowed.
        - id: ch02-b88
          speaker: ahmed
          text: Your Majesty, I have brought the healing water that you desired so greatly. You may keep it among the other rare objects in your treasury and use it whenever illness threatens you. Yet as I place it before you, I wish you health so strong and lasting that you will never have any occasion to open the bottle or test its power.
        - id: ch02-b89
          speaker: sultan
          text: My son, I am deeply grateful for this valuable gift, just as I was for the pavilion. I am also grateful that you exposed yourself to such great danger for my sake. A magician who knows the Fountain of Lions has told me about the castle and the four beasts that guard its entrance. You passed through a place where almost any other man would have died. Tell me what cleverness you used, or what incredible power protected you and brought you safely back.
        - id: ch02-b90
          speaker: ahmed
          text: Your Majesty gives me honor I do not deserve. All credit belongs to my wife. I only followed her wise instructions.
        - id: ch02-b91
          speaker: narrator
          text: Ahmed told the full story. He explained how Paribanou had given him the ball of thread and how it rolled by itself to the distant castle. He described the spare horse loaded with the four quarters of mutton, the open gates, the roar that woke all four lions, and his ride between them to the fountain. He also told how two lions followed him afterward, one walking ahead and the other behind, until they had escorted him safely to the palace gates. In this way, the Sultan learned both the wisdom of Paribanou's instructions and the courage with which Ahmed had carried them out. Outwardly, the father showed every sign of joy. Inwardly, each new proof of the fairy's power increased his jealousy and fear. He withdrew to a private room and summoned the magician. She had heard of Ahmed's success before arriving and came prepared with what she claimed was an infallible final plan.
        - id: ch02-b92
          speaker: narrator
          text: The next day, before all the court, the Sultan made one last demand.
        - id: ch02-b93
          speaker: sultan
          text: My son, ask your wife for one final thing. After this I will require nothing more from your obedience or her power. Bring me a man no more than a foot and a half tall, with a beard thirty feet long, who carries a five-hundred-pound iron bar on his shoulder and uses it as a staff.
        - id: ch02-b94
          speaker: narrator
          text: Ahmed did not believe such a man existed and tried to excuse himself, but the Sultan insisted that a fairy could do things even more incredible. The next day Ahmed returned to Paribanou.
        - id: ch02-b95
          speaker: ahmed
          text: My father has made a demand more impossible than the first two. I cannot imagine such a man exists. Perhaps he wants to see whether I am foolish enough to search, or perhaps he means to ruin me. Even if this tiny man exists, how could I force someone armed with such a bar to obey? If there is any way to succeed, please tell me, so I may come through this with honor.
        - id: ch02-b96
          speaker: paribanou
          text: Do not frighten yourself, Prince. You truly risked your life when you went for the Water of the Fountain of Lions, but there is no danger in finding this man. His name is Schaibar, and he is my own brother. We have the same father, though no one would guess it by looking at us. He has such a violent nature that even a slight offense can bring a cruel punishment from him. Yet the other side of his nature is generous. If someone has earned his friendship, Schaibar will do whatever that person asks. He is formed exactly as your father described. The five-hundred-pound iron bar is his only weapon, but he never takes a step without it, and it makes everyone respect him. I will send for him, and then you can judge whether I have told you the truth. I ask only that you prepare yourself before he appears, because his extraordinary figure can frighten anyone who sees him without warning.
        - id: ch02-b97
          speaker: ahmed
          text: Schaibar is your brother? Then however strange he looks, I will not fear him. As your brother, he will have my honor and affection.
        - id: ch02-b98
          speaker: narrator
          text: Paribanou ordered a gold brazier to be placed beneath the palace porch and a fire to be kindled inside it. She also brought out a gold box that had been given to her as a present. From the box she took a certain perfume and scattered it over the fire. At once a thick cloud of smoke rose from the brazier and gathered before the porch. Ahmed waited beside her. After a few moments, the smoke began to clear, and Paribanou pointed into the distance.
        - id: ch02-b99
          speaker: paribanou
          text: Look. My brother is coming.
        - id: ch02-b100
          speaker: narrator
          text: Schaibar came forward gravely with the enormous iron bar resting across one shoulder. His beard stretched thirty feet, so he gathered it up and carried it before him as he walked. A pair of thick mustaches grew across his face, and he had tucked their ends behind his ears. Even then they nearly hid his features. His eyes were very small and set deep in his head, while the head itself was far from small. A grenadier's cap sat on top of it, and a great hump rose from his back. Taken together, his size, his face, his beard, and the five-hundred-pound weapon made a terrible sight. If Ahmed had met him without knowing his name, he might not have been able to look upon him without fear. But Paribanou had told him that this was her brother. Remembering his promise, Ahmed remained beside her without the least sign of alarm.
        - id: ch02-b101
          speaker: narrator
          text: Schaibar fixed Ahmed with a stare fierce enough to chill the blood, then turned to his sister.
        - id: ch02-b102
          speaker: schaibar
          text: Who is this man?
        - id: ch02-b103
          speaker: paribanou
          text: He is my husband, brother. His name is Ahmed, and he is the son of the Sultan of the Indies. I did not invite you to our wedding because you were away on an expedition, and I did not wish to draw you from it. I later heard with great pleasure that you returned victorious. Since you are home again, I have taken the liberty of calling you here to meet him and help us.
        - id: ch02-b104
          speaker: schaibar
          text: Is there anything I can do for him? If he is your husband, I will do whatever he asks.
        - id: ch02-b105
          speaker: paribanou
          text: His father wishes to see you. Let Ahmed guide you to the Sultan's court.
        - id: ch02-b106
          speaker: schaibar
          text: He only has to show me the road. I will follow.
        - id: ch02-b107
          speaker: paribanou
          text: It is too late to leave today. Stay until morning, and I will tell you everything that has happened between the Sultan and Ahmed since our marriage.
        - id: ch02-b108
          speaker: narrator
          text: During the evening, Paribanou told Schaibar everything that had happened since her marriage. The next morning he set out with Ahmed for the Sultan's court. As soon as people at the city gates saw Schaibar, they fled. Some merchants shut their shops and locked themselves inside their houses. Others ran through the streets, and their terror spread to everyone they met. Those people did not wait to look behind them before running too. By the time Schaibar and Ahmed passed through the city, every street before them was deserted. At the palace, even the porters abandoned the gates instead of guarding them. The ushers inside also fled from their posts. With no one left to stop or announce them, Schaibar and Ahmed walked straight into the council hall, where the Sultan sat on his throne giving audience.
        - id: ch02-b109
          speaker: narrator
          text: Schaibar strode fiercely toward the throne without waiting for an introduction.
        - id: ch02-b110
          speaker: schaibar
          text: You asked for me. Here I am. What do you want?
        - id: ch02-b111
          speaker: narrator
          text: The Sultan gave no answer at all. Terrified by Schaibar's appearance, he lifted both hands and covered his eyes so that he would not have to look at the visitor he himself had demanded to see. To Schaibar, this was an uncivil and insulting reception. He had come a long distance at the Sultan's command, only to be treated as something too horrible to face. His violent temper rose at once. Before Ahmed understood what he meant to do, Schaibar swung the iron bar from his shoulder and struck the Sultan dead. Ahmed had no time to step between them or speak a word on his father's behalf.
        - id: ch02-b112
          speaker: narrator
          text: Schaibar turned on the councilors. Ahmed managed to save the grand vizier by explaining that this man had always given the Sultan good advice.
        - id: ch02-b113
          speaker: schaibar
          text: Then these must be the men who gave him wicked advice.
        - id: ch02-b114
          speaker: narrator
          text: Schaibar looked from the spared grand vizier to the other men around the throne and understood that these were the favorites whose whispers had turned the Sultan against his son. He went among them with the iron bar. Every time he struck, one of Ahmed's enemies fell. Some courtiers were so frightened that they could only stand staring with open mouths, and they did not escape him. Others recovered enough sense to run from the hall, and those were the only ones who saved themselves. When the terrible punishment was over, Schaibar rested the bar upon his shoulder again and walked out of the council hall into the middle of the courtyard. There he fixed his eyes on the grand vizier whose life Ahmed had just saved.
        - id: ch02-b115
          speaker: schaibar
          text: There is a magician here who is a greater enemy to Ahmed than all those flatterers were. Bring her to me at once.
        - id: ch02-b116
          speaker: narrator
          text: The grand vizier sent for her. As soon as the magician arrived, Schaibar swung his bar.
        - id: ch02-b117
          speaker: schaibar
          text: Take the reward for your poisonous advice. Now pretend to be sick again.
        - id: ch02-b118
          speaker: narrator
          text: He killed her, then turned to everyone in the court.
        - id: ch02-b119
          speaker: schaibar
          text: This is not enough. Unless the whole city immediately acknowledges my brother-in-law as Sultan of the Indies, I will treat the city as I treated his enemies.
        - id: ch02-b120
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: Long live Sultan Ahmed!
        - id: ch02-b121
          speaker: narrator
          text: The cry echoed through the courtyard again and again. Messengers carried the proclamation into every part of the capital, and the whole city was ordered to recognize Ahmed as Sultan of the Indies. Schaibar had him clothed in the royal robes. He installed Ahmed upon his father's throne, then required everyone present to swear homage and faithful service to their new ruler. Once Ahmed's authority was secure, Schaibar returned for his sister. He brought Paribanou into the capital with all the ceremony, splendor, and magnificence anyone could imagine, and the court and city acknowledged her as Sultaness of the Indies.
        - id: ch02-b122
          speaker: narrator
          text: Prince Ali and Princess Nouronnihar had known nothing about the conspiracy against Ahmed and had taken no part in it. Ahmed therefore treated them with kindness. He gave them a rich and important province, together with its capital, and there they spent the rest of their lives. Ahmed also remembered his eldest brother. He sent an officer to Prince Houssain to explain the change in the kingdom and offer him whichever province he liked best.
        - id: ch02-b123
          speaker: narrator
          text: But Houssain was content in his solitude. He thanked his brother for the kindness, promised his loyalty, and asked only to remain in the retreat he had chosen.
