  chapters:
    - id: ch01
      title: 艾哈迈德王子与仙女帕里巴努的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，印度有一位苏丹。他有三个儿子，长子侯赛因，次子阿里，幼子艾哈迈德。苏丹还有一个侄女，名叫努伦妮哈尔。她幼年失去父亲，便由苏丹亲自教养，与三位王子一起在宫中长大。
        - id: ch01-b02
          speaker: narrator
          text: 苏丹原想等侄女长大，把她嫁给邻国王子，好结成盟约。可后来，三个儿子都深深爱上了她，谁也不肯退让。苏丹忧心不已，只得把他们一同叫来。
        - id: ch01-b03
          speaker: sultan
          text: 孩子们，我劝过你们放下对表妹的爱慕，可谁也不肯听。这样吧，你们各自去不同的国度游历，替我寻找世上最罕见的宝物。谁带回来的东西最不同寻常，我便把努伦妮哈尔嫁给谁。寻宝和赶路所需的钱，我会分别给你们。
        - id: ch01-b04
          speaker: narrator
          text: 三位王子一向听从父命，也都相信好运会落到自己头上，便一齐答应。第二天清早，他们扮成商人，各带一名亲信官员同行，从同一座城门出发。当晚，三人在三条岔路分开的客店歇脚，约定各自游历一年，再回这里会合。先到的人必须等齐兄弟，三人仍要一同回宫。天一亮，他们拥抱道别，各自踏上了一条路。
        - id: ch01-b05
          speaker: narrator
          text: 侯赛因王子来到比斯纳加尔，那既是王国的都城，也是国王居住的地方。他住进一所专供外国商人落脚的客栈。听说城中有四大商区，各地商人都在那里开店，四区中央就是国王的宫殿，他第二天便选了一个商区去游览。商区大得惊人，一条条街上都盖着遮挡烈日的拱廊，光线却依旧明亮。大小相同的店铺整齐排开，卖同类货物的商人聚在一条街，手艺人的铺子则藏在较窄的小街里。各地出产的上等细布有的色彩鲜艳，上面画着野兽、树木和花朵。波斯与中国的丝绸锦缎、日本与中国的瓷器，还有各种挂毯，摆满了无数店面。侯赛因看得眼花缭乱，几乎不信自己的眼睛。到了金匠和珠宝商的街上，金银器皿堆积如山，珍珠、钻石、红宝石、祖母绿和其他珠宝光彩夺目，更叫他看得入了迷。街上还有许多卖玫瑰的人。当地人酷爱这种花，出门时手里总要拿一束，或在头上戴一环花冠。店家也用花盆栽种玫瑰，整片空气都浸在芬芳里。
        - id: ch01-b06
          speaker: narrator
          text: 王子看遍一条又一条街，累得筋疲力尽。一位商人请他进店坐下。这时，一个叫卖人从门前经过，胳膊上搭着一块六英尺见方、模样普通的挂毯，却高喊着要卖三十袋金币。侯赛因叫住他，问这样一块小毯子凭什么值这么多钱。
        - id: ch01-b07
          speaker: carpet_crier
          text: 您若嫌三十袋金币太贵，听见卖主吩咐的实价，恐怕更要吃惊。现在必须卖四十袋，一袋也不能少。
        - id: ch01-b08
          speaker: prince_hussain
          text: 那它一定藏着什么非凡的本领，只是我还不知道。
        - id: ch01-b09
          speaker: carpet_crier
          text: 您猜对了。无论谁坐上这块毯子，只要想着要去的地方，转眼就能到达，路上没有任何东西拦得住。知道这个本领以后，您就会承认它值得这个价钱。
        - id: ch01-b10
          speaker: prince_hussain
          text: 要是它真有这样的本领，四十袋金币并不算贵，我还会另外酬谢你。
        - id: ch01-b11
          speaker: carpet_crier
          text: 我说的句句是真，也很容易证明。您先答应按四十袋成交，我们再到店后的房间铺开毯子，一起坐上去。您只要想着回客栈自己的房间。若不能立刻到达，买卖就作罢。收钱时，我也正好随您去客栈。至于额外的酬谢，我一定感激您的厚意。
        - id: ch01-b12
          speaker: narrator
          text: 两人征得店主许可，在后间铺开毯子并肩坐好。侯赛因刚在心里想着客栈的房间，转眼间，他和叫卖人已经坐在那里。王子立刻付清四十袋金币，又赏给叫卖人二十枚金币。
        - id: ch01-b13
          speaker: narrator
          text: 就这样，侯赛因成了飞毯的主人。他刚到比斯纳加尔便找到这样的奇宝，心里欢喜极了，认定两个弟弟无论如何也找不到能与飞毯相比的东西，努伦妮哈尔一定会成为自己的妻子。凭飞毯的神力，他当天就能回到约定的客店，可一年期限尚未结束，即使到了那里，也只能独自等待。况且，他很想亲眼看看比斯纳加尔的国王和宫廷，还想了解这个国家的兵力、法律、风俗与宗教，于是决定留下几个月，满足自己的好奇心。他本可以住得更久，可对努伦妮哈尔的思念越来越强，只想离她近一些。最后，他和随行亲信一同坐上飞毯。回到客店的愿望刚在心中升起，两人已经到了自己的房间。侯赛因继续扮作商人，耐心等待两个弟弟。
        - id: ch01-b14
          speaker: narrator
          text: 阿里王子去了波斯。他加入一支商队，来到都城设拉子，扮成珠宝商。第二天，他在贝泽斯坦市场看见一个叫卖人。那人拿着一支只有一英尺长、拇指粗细的象牙望远镜，竟然要价三十袋金币。阿里以为他疯了，便向店门前的一位商人打听。
        - id: ch01-b15
          speaker: prince_ali
          text: 先生，那个人是不是疯了？一支小小的象牙望远镜，怎么敢卖三十袋金币？要是他没疯，那就是我看错了。
        - id: ch01-b16
          speaker: shiraz_merchant
          text: 至少昨天他还很清醒。他是城里最精明的叫卖人之一，贵重东西常由他经手。既然敢开这个价，必定有缘故，说不定还不止值这么多。您先坐下歇歇，他一会儿还会回来，到时问他便知道了。
        - id: ch01-b17
          speaker: narrator
          text: 叫卖人果然再次经过。商人叫住他，把阿里的疑问说了出来，请他解释那支不起眼的望远镜为什么这样昂贵。
        - id: ch01-b18
          speaker: telescope_crier
          text: 因为这支望远镜把我当疯子的人，您不是第一个。等您知道它的本领，再亲自判断吧。它两头各嵌着一片镜片。您从这一端望进去，心里想看什么，就能看见什么。
        - id: ch01-b19
          speaker: prince_ali
          text: 若能证明这是真的，我愿为刚才的冒犯向你赔罪。告诉我该从哪一头看，我现在就来验证。
        - id: ch01-b20
          speaker: narrator
          text: 叫卖人指给他看。阿里先想着父亲，镜中立刻出现苏丹端坐宝座、群臣环绕的景象，父亲身体十分康健。接着，他又想看努伦妮哈尔。公主正在侍女中间梳妆，谈笑风生，心情愉快。阿里再不需要别的证明，便把叫卖人带回客栈，付钱买下望远镜。
        - id: ch01-b21
          speaker: narrator
          text: 阿里为这笔买卖欣喜不已。在他看来，两个兄弟绝不可能找到同样稀奇美妙的东西，努伦妮哈尔必会成为自己一路辛劳的回报。接下来，他只想着继续隐瞒身份，好好游览波斯宫廷，走遍设拉子和附近所有值得一看的地方。他一直等到载自己前来的商队准备返回印度，才再次加入队伍。归途十分漫长，赶路也很辛苦，好在没有遇上任何意外。阿里终于平安抵达兄弟约定会面的客店。侯赛因已经在那里，两人互相讲述见闻，却仍要一起等候艾哈迈德回来。
        - id: ch01-b22
          speaker: narrator
          text: 艾哈迈德王子去了撒马尔罕。到达后的第二天，他也来到贝泽斯坦市场，看见一个叫卖人举着人造苹果，要价三十五袋金币。
        - id: ch01-b23
          speaker: prince_ahmed
          text: 把苹果给我看看，也请告诉我，它有什么了不起的功效，竟然值这么高的价钱？
        - id: ch01-b24
          speaker: apple_crier
          text: 单看外表，它确实不值一提。可知道它能为世人做什么，您会觉得这点钱远远不够。无论病人得了多么致命的病，哪怕已经奄奄一息，只要闻一闻这只苹果，便会立刻苏醒，恢复健康。
        - id: ch01-b25
          speaker: prince_ahmed
          text: 若这话可信，它当然是无价之宝。可是，我凭什么相信你说的是真的？
        - id: ch01-b26
          speaker: apple_crier
          text: 整个撒马尔罕都知道它的神效，眼前这些商人就能作证。它是一位著名哲人毕生研究草木和矿物、反复试验以后制成的，治好过许多重病。可惜哲人自己突然病逝，没来得及服药。他留下妻子和许多年幼的儿女。妻子为了养活全家，才忍痛把苹果卖掉。
        - id: ch01-b27
          speaker: narrator
          text: 人群围了过来，纷纷证明叫卖人没有说谎。其中一人提到，自己的朋友病得很重，医生已经断定无药可救，正好可以让王子亲眼验证。
        - id: ch01-b28
          speaker: witness
          text: 我的朋友正躺在病床上，医生都说没有希望了。您若想看苹果的本领，现在就可以去救他。
        - id: ch01-b29
          speaker: prince_ahmed
          text: 好。只要苹果真能治好他，我便付四十袋金币。
        - id: ch01-b30
          speaker: apple_crier
          text: 那正是卖主交代的价钱。我们现在就去试。只要病人好了，苹果便归您。我敢保证，它一定会奏效。
        - id: ch01-b31
          speaker: narrator
          text: 试验果然成功。艾哈迈德付清四十袋金币，收下苹果，耐心等到第一支回印度的商队启程，终于平安回到客店。
        - id: ch01-b32
          speaker: narrator
          text: 三兄弟重逢，各自拿出宝物。阿里用望远镜看向努伦妮哈尔，却发现她已经生命垂危。三人立即坐上侯赛因的飞毯，许愿来到公主身边，转眼便出现在她的寝宫。
        - id: ch01-b33
          speaker: narrator
          text: 三位王子赶到床边，把人造苹果凑到公主鼻下。片刻之后，努伦妮哈尔睁开眼睛，望了望围在床边的人，便坐起身来，叫侍女替她穿衣，仿佛只是刚从酣睡中醒来。侍女们欣喜地告诉她，三位王子救了她，尤其要归功于艾哈迈德。
        - id: ch01-b34
          speaker: princess_nouronnihar
          text: 谢谢你们三位及时赶来救我。艾哈迈德，也请让我特别感谢你带回了这只苹果。
        - id: ch01-b35
          speaker: narrator
          text: 公主梳妆时，兄弟三人前去拜见父亲。公主的宦官长早已把他们归来和公主获救的经过报给苏丹。苏丹热烈拥抱三个儿子，既庆幸他们平安，又为侄女康复而欣慰。御医本已认定她无药可救，而苏丹待她一向如亲生女儿。
        - id: ch01-b36
          speaker: narrator
          text: 问候过后，侯赛因献上飞毯，阿里献上象牙望远镜，艾哈迈德献上人造苹果。三人说明各自宝物的神奇，请父亲依照诺言，决定努伦妮哈尔究竟嫁给谁。苏丹听完，沉思了一阵。
        - id: ch01-b37
          speaker: sultan
          text: 孩子们，若能公正选出一人，我当然愿意。艾哈迈德的苹果确实治好了公主，可若没有阿里的望远镜，你们不会知道她病危。若没有侯赛因的飞毯，你们也来不及赶回。阿里的望远镜让你们知道即将失去表妹，可若没有苹果和飞毯，知道了也救不了她。侯赛因的飞毯同样必不可少，可若不知道消息，又没有治病的苹果，飞毯也派不上用场。
        - id: ch01-b38
          speaker: sultan
          text: 所以，飞毯、望远镜和苹果，功劳完全相等，没有一样胜过另外两样。我不能凭这些宝物把公主许给你们中的任何一个。我要另想办法。现在离天黑还早，你们各自取来弓箭，到练马的大平原等我。谁把箭射得最远，我便把努伦妮哈尔嫁给谁。
        - id: ch01-b39
          speaker: narrator
          text: 三位王子无话可说，各自备好弓箭，带着随从前往平原。大群百姓也跟去观看。苏丹到后，侯赛因首先射箭。阿里第二个出手，箭远远越过哥哥。艾哈迈德最后射出一箭，可谁也没看见它落在哪里。
        - id: ch01-b40
          speaker: narrator
          text: 王子和众人找遍近处远处，始终不见那支箭。大家都相信艾哈迈德射得最远，理应获胜，却必须先找到箭，才能证明结果。尽管艾哈迈德一再申辩，苏丹还是判阿里胜出。几天后，阿里与努伦妮哈尔举行了盛大的婚礼。
        - id: ch01-b41
          speaker: narrator
          text: 侯赛因悲痛得无法参加婚宴。他离开宫廷，放弃继承王位的一切权利，出家做了隐士。艾哈迈德也没有赴宴，却不曾弃绝尘世。他始终想不通自己的箭去了哪里，便悄悄甩开随从，决意把它找回来，免得日后责怪自己没有尽力。
        - id: ch01-b42
          speaker: narrator
          text: 他从两位哥哥的箭被拾起之处继续向前，一路搜寻。走了很远，他已觉得这番辛苦也许终究徒劳，却仍不肯停步。最后，一片陡峭嶙峋的岩壁挡住去路。这里荒无人烟，离射箭的平原已有四里格远。
    - id: ch02
      title: 第二章
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 艾哈迈德走近岩壁，忽然发现地上躺着一支箭。他拾起来仔细端详，惊讶地认出，这正是自己射出的那一支。世上任何人都不可能把箭射到四里格外。箭没有插进土里，显然是撞上岩壁以后弹落的。
        - id: ch02-b02
          speaker: prince_ahmed
          text: 这里一定藏着奥秘，也许还会给我带来好处。命运夺走了我原以为最大的幸福，说不定正要补偿我一份更大的福分。
        - id: ch02-b03
          speaker: narrator
          text: 岩壁上洞穴密布。王子走进一处洞穴查看，发现一道没有锁的铁门。他伸手一推，门便开了，后面是一条平缓向下的坡道。王子拿着箭走下去。起初，他以为前方会一片漆黑，没过多久，却看见与洞外不同的光亮。
        - id: ch02-b04
          speaker: narrator
          text: 他来到一片宽阔空旷的地方，五六十步外立着一座富丽堂皇的宫殿。一位仪态威严的女子走到门廊下，身后跟着许多衣饰华美、容貌出众的女子，几乎叫人分不出谁才是女主人。艾哈迈德赶紧上前行礼。那位女子没等他开口，已经叫出了他的名字。
        - id: ch02-b05
          speaker: fairy_paribanou
          text: 请走近些，艾哈迈德王子。欢迎你来到这里。
        - id: ch02-b06
          speaker: narrator
          text: 王子从没听说父亲都城附近还有这样的地方，更不明白陌生女子为何认识自己。他拜倒在她脚下，以礼相答。
        - id: ch02-b07
          speaker: prince_ahmed
          text: 夫人，我只因一时好奇闯得太深，多谢您还肯欢迎我。请原谅我的冒昧，您为什么认得我？您住得离我这样近，我又为什么从不知道您？
        - id: ch02-b08
          speaker: fairy_paribanou
          text: 王子，我们进大厅再说。到了那里，我会解开你的疑惑。
        - id: ch02-b09
          speaker: narrator
          text: 女子领他进厅，两人在长椅上坐下。她这才说起自己的身份。
        - id: ch02-b10
          speaker: fairy_paribanou
          text: 你的宗教想必告诉过你，世上除了人类，也有精灵。我名叫帕里巴努，是一位最强大、最尊贵的精灵之王的女儿。依我看，你应该得到比努伦妮哈尔更幸福的命运。你射箭时，我就在场。我预见你的箭飞不过侯赛因的箭，便在半空接住它，加上一股恰到好处的力量，让它撞上你刚才看见的岩壁。现在，一个能使你幸福的机会就在眼前，要不要抓住，由你决定。
        - id: ch02-b11
          speaker: narrator
          text: 说到最后，帕里巴努的语调变得温柔，脸颊也泛起红晕。艾哈迈德明白了她的心意。他想到努伦妮哈尔已永远不属于自己，而眼前的仙女在美貌、风姿和才智上都胜过她，这座宫殿也显出无法计数的财富。王子庆幸自己回来寻找那支箭，心中也生出了爱情。
        - id: ch02-b12
          speaker: prince_ahmed
          text: 夫人，若能终身陪伴您，敬爱您，我便是世上最幸福的人。请原谅爱情使我这样大胆，也请不要把一个已经把心交给您的王子拒在宫门之外。
          emotion: happy
        - id: ch02-b13
          speaker: fairy_paribanou
          text: 王子，既然我愿意向你许下终身的誓言，你也愿意向我起誓吗？
        - id: ch02-b14
          speaker: prince_ahmed
          text: 我愿意。还有什么能比这更美好、更令我欢喜？我的王后，我愿意毫无保留地把心交给您。
          emotion: happy
        - id: ch02-b15
          speaker: fairy_paribanou
          text: 那么，从现在起，你是我的丈夫，我是你的妻子。你今天大概还没吃东西，我先叫人送来便餐，同时准备今晚的婚宴。等你吃过，我再领你看看宫中各处。你会知道，这座大厅其实是最朴素的一间。
        - id: ch02-b16
          speaker: narrator
          text: 随仙女进厅的几名侍女猜到了她的心意，立刻退下，很快又带着上好的佳肴美酒回来。艾哈迈德吃饱喝足以后，帕里巴努领他参观宫中各处。钻石、红宝石、祖母绿和种种珍奇宝石，与珍珠、玛瑙、碧玉、斑岩和各种名贵大理石交相辉映。那些无法估量价值的陈设，更让宫中每一处都显得丰盛华贵。王子从未见过类似的景象，甚至从没想过世上会有任何地方能与这里相比。他一路看，一路惊叹，直到帕里巴努提醒他，眼前还只是精灵世界中并不算最富丽的宫殿。
        - id: ch02-b17
          speaker: fairy_paribanou
          text: 我的宫殿确实很美，可精灵首领们的宫殿比这里更大，也更加华丽。我的花园也会让你喜欢，不过留到下次再看吧。天快黑了，我们该去参加婚宴了。
        - id: ch02-b18
          speaker: narrator
          text: 婚宴设在另一座同样华美的大厅。无数枝散发龙涎香气息的蜡烛排列得整齐悦目，巨大的边桌上摆满工艺精巧的金器。衣饰华丽的女子放声歌唱，悦耳的乐器随声相和。帕里巴努亲自把一道道佳肴夹给王子，王子赞叹这样的美味绝非人间可比。两人等到蜜饯和水果端上以后才开始饮酒。第二天宴席仍未停止，此后许多日子，天天都在欢宴。
        - id: ch02-b19
          speaker: narrator
          text: 六个月后，艾哈迈德强烈地思念父亲。他一向敬爱苏丹，若不能亲自探望，心中便无法安宁，于是请求帕里巴努准他前去。
        - id: ch02-b20
          speaker: fairy_paribanou
          text: 你随时都可以去。不过我劝你，不要把我们的婚事、我的身份和你的住处告诉父亲。只让他知道你过得幸福，请他安心，不要追问。也告诉他，你回去只是为了探望他，让他知道你一切都好。
        - id: ch02-b21
          speaker: narrator
          text: 仙女挑选二十位装备精良、骑术出众的侍从同行，又为王子备下一匹装饰华美、胜过苏丹御厩中所有骏马的坐骑。艾哈迈德拥抱妻子，答应很快回来，便启程前往都城。
        - id: ch02-b22
          speaker: narrator
          text: 百姓看见王子归来，欢呼着跟随他来到苏丹寝宫。苏丹惊喜地紧紧拥抱儿子，又诉说这些日子没有他的音讯，自己多么痛苦。阿里已经被命运选中，他一直担心艾哈迈德会一时冲动，做出鲁莽之事。
        - id: ch02-b23
          speaker: narrator
          text: 艾哈迈德只讲了能够讲的经历，对仙女只字未提。他说有些事不能道出，随后向父亲提出一个请求。
        - id: ch02-b24
          speaker: prince_ahmed
          text: 我只求陛下准许我常来问安，亲眼看看您过得好不好。
        - id: ch02-b25
          speaker: sultan
          text: 孩子，我当然准许，可我更盼你留在身边。至少请告诉我，若你没有来，或我有要紧事必须见你，该派人到哪里去找？
        - id: ch02-b26
          speaker: prince_ahmed
          text: 父王，这正是我不能说出的秘密之一，请准许我保持沉默。我一定会常来。将来只怕有人嫌我来得太勤，绝不会有人说我忘了做儿子的本分。
        - id: ch02-b27
          speaker: sultan
          text: 我不再探究你的秘密，由你自由来去。没有什么比你的来访更令我欢喜。你一出现，就把我失去许久的欢乐带了回来。只要不妨碍你的事务，无论何时，你都会受到欢迎。
        - id: ch02-b28
          speaker: narrator
          text: 王子在宫中住了三天，第四天便回到帕里巴努身边。一个月过去，仙女发现他从此不再提起父亲，猜到他是在顾虑自己的感受，便主动提醒他。
        - id: ch02-b29
          speaker: fairy_paribanou
          text: 王子，你忘记父亲了吗？你答应过要常去探望他。我还记得你回来时说过的话，所以提醒你一声，免得迟迟不能兑现承诺。
        - id: ch02-b30
          speaker: narrator
          text: 第二天，艾哈迈德再次带着二十名随从出发。这一次，无论王子还是随从，衣着坐骑都更加气派。苏丹仍旧欢喜地接待他。此后几个月，王子按时探望父亲，每次的排场都比上一次更富丽堂皇。
        - id: ch02-b31
          speaker: narrator
          text: 几名宠臣从王子的排场推断出他的财富和势力，便挑拨苏丹，说艾哈迈德也许会笼络民心，把父亲赶下王位。苏丹起初根本不信。
        - id: ch02-b32
          speaker: sultan
          text: 你们错了。我儿子爱我，对我忠心不二。我也从没做过让他心生不满的事。
        - id: ch02-b33
          speaker: narrator
          text: 宠臣们却不断诋毁王子。苏丹嘴上仍说不信，还感谢他们忠心进言，心里却已经留下深深的疑虑。他瞒着大维齐尔，从后门召来一名女术士。
        - id: ch02-b34
          speaker: sultan
          text: 立刻跟踪我儿子。盯紧他，查明他退隐在什么地方，再回来禀报。
        - id: ch02-b35
          speaker: narrator
          text: 女术士知道王子当初找到箭的地方，离开苏丹以后便立刻赶往那片岩壁，藏在附近，不让任何人发现。第二天清早，艾哈迈德照惯例在天刚亮时动身，没有向苏丹辞行，也没有向朝臣告别。女术士看见他和随从到来，目光紧紧追着整支队伍，直到一行人忽然从眼前消失。眼前的岩壁又高又陡，怪石嶙峋，形成一道无法跨越的屏障。她由此断定，王子不是退入某个山洞，就是住进了精灵或仙女的居所。等周围再没有别人，她从藏身处出来，径直走进低凹的通道，一路寻到尽头，又把四周反复查看。可任凭她怎样用心，连一个洞口也找不到，更不用说艾哈迈德发现的铁门。那扇门只肯让男子看见并打开，而且还必须是帕里巴努愿意接待的人。女术士知道再找也是徒劳，只得把已经探明的情形带回去禀报苏丹。
        - id: ch02-b36
          speaker: sultan
          text: 就照你认为妥当的办法继续查。我会耐心等待，看你的承诺能有什么结果。
        - id: ch02-b37
          speaker: narrator
          text: 苏丹赏给她一颗贵重的钻石。女术士摸准王子每月来访的日期，提前守在岩脚。艾哈迈德照常从铁门出来时，看见她头抵岩石躺着，呻吟不止，仿佛正受着剧痛。王子心生怜悯，问她出了什么事。
        - id: ch02-b38
          speaker: sorceress
          text: 我本想去都城，走到半路忽然发起高烧，浑身一点力气也没有，只能倒在这片荒地。我还以为这里绝不会有人经过，更不敢盼着有人救我。
        - id: ch02-b39
          speaker: prince_ahmed
          text: 好心的婆婆，援助并不遥远。我送你去一个很快就能治好你的地方。请站起来，坐到我的一名随从身后。
        - id: ch02-b40
          speaker: narrator
          text: 女术士故意一次次挣扎，又一次次跌回去。两名随从把她扶上马，跟随王子返回铁门。到了宫殿外院，艾哈迈德请人叫来帕里巴努。
        - id: ch02-b41
          speaker: prince_ahmed
          text: 我的公主，请怜悯这位婆婆。我发现她时，她就是这副模样。我已经答应替她寻找救助。无论出于您的善心，还是看在我的请求上，我相信您都不会弃她不顾。
        - id: ch02-b42
          speaker: narrator
          text: 帕里巴努一直盯着装病的老妇，随即命两名侍女把她接进宫，像仙女亲自照料一样用心照看。老妇被带走时，仙女走到丈夫身边，低声提醒他。
        - id: ch02-b43
          speaker: fairy_paribanou
          text: 这个女人没有装出来的那么病重。除非我看错了，她是个骗子，还会给你惹来大麻烦。不过别害怕。不论别人怎样设计害你，我都会救你逃过他们布下的罗网。继续上路吧。
        - id: ch02-b44
          speaker: prince_ahmed
          text: 我的公主，我从不记得自己伤害过谁，也没存心害过人，所以很难相信有人会来害我。即便真有这样的人，只要遇见行善的机会，我仍不会袖手旁观。
        - id: ch02-b45
          speaker: narrator
          text: 王子继续前往父亲的宫殿。两名侍女则把女术士安置在一间华贵房间，让她躺进铺着金锦软垫、细布床单和金线床罩的床上。一名侍女很快端来一碗药水。
        - id: ch02-b46
          speaker: attendant_one
          text: 喝下这碗狮泉之水吧。它能治好任何热病，不到一个钟头，你就会感到药效。
        - id: ch02-b47
          speaker: narrator
          text: 女术士为了演得逼真，推辞许久才喝下药水。侍女替她盖好被子。
        - id: ch02-b48
          speaker: attendant_two
          text: 安静躺着吧，若能睡着，就睡一会儿。我们先出去，一个钟头以后再来，希望那时你已经完全好了。
        - id: ch02-b49
          speaker: narrator
          text: 一个钟头后，侍女们回来，女术士已经穿好衣服坐在长椅上。
        - id: ch02-b50
          speaker: sorceress
          text: 多神奇的药水！它起效比你们说的还快，我已经能继续赶路了。
        - id: ch02-b51
          speaker: narrator
          text: 两名侍女和女主人一样，也都是仙女。听见老妇这么快痊愈，她们都表示十分欣慰，随后走在前面，引她穿过一间又一间厅室。每个房间都比她刚才躺过的那间更加高贵华美。女术士一面跟随，一面贪婪地把见到的一切记在心里。最后，她们来到一座宽阔的大厅，那是整座宫殿中装饰得最富丽堂皇的地方。帕里巴努坐在一张纯金铸成的宝座上，宝座镶嵌着硕大无比的钻石、红宝石和珍珠。她两旁侍立着许多美貌仙女，个个衣饰华贵。女术士眼见这样的威仪，既目眩神迷，又惊讶得说不出话。她拜倒在宝座前，本想开口致谢，却连嘴也张不开。
        - id: ch02-b52
          speaker: fairy_paribanou
          text: 好心的婆婆，我很高兴能帮到你，也很高兴你已经可以赶路。我不会留你。不过，你若愿意参观我的宫殿，就跟侍女们去看看吧。
        - id: ch02-b53
          speaker: narrator
          text: 女术士回到苏丹身边，把一切全讲了出来。她说艾哈迈德娶了仙女，已经比世上所有君王都富有，很可能有一天回来夺走王位。苏丹明知儿子天性善良，仍被这番话搅得忧心不安。宠臣主张杀死王子，女术士却提出另一条计策。
        - id: ch02-b54
          speaker: sorceress
          text: 请陛下命王子借助仙女的力量，不断取来奇异之物，直到仙女厌烦，把他赶走。陛下每次出征，都要为全军准备帐篷，还得用许多骡子、骆驼搬运。何不让王子求来一顶帐篷？平时一人就能托住，撑开后却足以庇护全军，再坏的天气也伤不着他们。
        - id: ch02-b55
          speaker: narrator
          text: 宠臣们想不出更好的办法，苏丹便采纳了这个看似温和的主意。第二天，他向艾哈迈德索要帐篷。王子不知道仙女是否拥有这样的力量，却还是答应替父亲请求。
        - id: ch02-b56
          speaker: prince_ahmed
          text: 陛下要的东西，我万分不愿向妻子开口，却仍会替您请求。但我不能保证一定成功。若我从此不再回来，请您宽恕我，也请想一想，是您亲手把我逼到了这样的境地。
        - id: ch02-b57
          speaker: sultan
          text: 孩子，若这个请求害得我再也见不到你，我当然会难过。可你似乎不明白丈夫对妻子的影响。你的妻子法力无边，若连这点小事也不答应，只能说明她对你的爱很淡薄。
        - id: ch02-b58
          speaker: narrator
          text: 艾哈迈德回家时满面愁容，怕开口冒犯妻子。帕里巴努一再追问，他才说出父亲的要求，并强调自己从没讨过别的恩惠，这次也是父亲想要一顶能由一人托住、撑开却足以保护全军的帐篷。
        - id: ch02-b59
          speaker: fairy_paribanou
          text: 这样小的一件事，竟让你烦恼成这样，我真替你遗憾。
        - id: ch02-b60
          speaker: narrator
          text: 仙女叫来掌管宝库的努尔吉汗，命她取出宝库中最大的一顶帐篷。努尔吉汗很快回来，带来的东西小得能藏在合拢的手掌中。艾哈迈德以为妻子在开玩笑，脸上的惊讶叫帕里巴努笑出了声。
        - id: ch02-b61
          speaker: fairy_paribanou
          text: 王子，你以为我在逗你吗？努尔吉汗，把帐篷拿出去支好，让王子看看它够不够他父亲使用。
        - id: ch02-b62
          speaker: narrator
          text: 努尔吉汗走到很远处才支起帐篷，可帐篷的一端仍延伸到宫殿跟前。就算苏丹的大军再多一倍，也能全部容纳在里面。王子这才请求妻子原谅自己的怀疑。
        - id: ch02-b63
          speaker: fairy_paribanou
          text: 你已经看见，它远比你父亲所需的更大。而且，要庇护的军队有多大，它自己便会变大或缩小。
        - id: ch02-b64
          speaker: narrator
          text: 王子带着收好的帐篷回宫。苏丹原以为这种东西根本不存在，见儿子这样快回来，惊讶得久久回不过神。帐篷在大平原上撑开以后，果然能容下两倍于现有规模的军队。可苏丹仍不满足，又提出第二个要求。
        - id: ch02-b65
          speaker: sultan
          text: 孩子，这顶帐篷是我宝库中最珍贵的东西，我十分感激。听说你的妻子使用狮泉之水，任何凶险的热病都能治。你一定珍惜我的健康，请再替我带一瓶回来，留作需要时服用。这样才算尽全一个好儿子对慈父的孝道。
        - id: ch02-b66
          speaker: fairy_paribanou
          text: 这个要求背后藏着很深的恶意。狮泉在一座大城堡的庭院中央，四头凶猛的狮子守着入口。两头睡觉，另外两头始终醒着。不过别怕，我会教你安全通过。
        - id: ch02-b67
          speaker: narrator
          text: 帕里巴努拿起身边的一个线团交给丈夫，又让他准备两匹马，一匹骑乘，一匹驮着分成四份的整只羊。她还会给他一只装泉水的瓶子。
        - id: ch02-b68
          speaker: fairy_paribanou
          text: 明早出发。走出铁门，把线团扔到前面，它会滚到城堡大门。城门打开后，醒着的狮子会吼醒另外两头。不要慌，给每头狮子扔一份羊肉，立刻催马冲到泉边。你不必下马，俯身装满瓶子，再飞快赶回来。狮子只顾吃肉，不会拦你。
        - id: ch02-b69
          speaker: narrator
          text: 第二天，王子分毫不差地照做。他向四头狮子各扔一份羊肉，从它们中间冲过，在泉边装满瓶子，又安然返回。走出一段后，他回头看见两头狮子追来，便拔出弯刀。可一头狮子离开道路，用头尾示意自己没有恶意，只想在前面开路，另一头则留在后方护送。
        - id: ch02-b70
          speaker: narrator
          text: 两头狮子一直护送王子来到苏丹宫门，才沿原路返回。它们一路温顺，却把所有看见的人都吓得魂不附体。官员们服侍王子下马，带他来到被宠臣围绕的苏丹面前。艾哈迈德把瓶子放在父亲脚下，亲吻脚凳上的织毯。
        - id: ch02-b71
          speaker: prince_ahmed
          text: 父王，我带来了陛下想收藏的狮泉之水。同时，我衷心祝愿您永远康健，永远没有机会用到它。
        - id: ch02-b72
          speaker: sultan
          text: 孩子，我感谢这份珍贵礼物，也感谢你为我冒险。女术士已经告诉我狮泉有多危险。请说说，你用了什么计策，又凭什么不可思议的力量保全自己？
        - id: ch02-b73
          speaker: prince_ahmed
          text: 父王，我不敢领受赞誉。全部功劳都属于我的仙女妻子，我只是照她的妙计去做。
        - id: ch02-b74
          speaker: narrator
          text: 王子把仙女的嘱咐和路上的经历一一讲明。苏丹表面上万分喜悦，心底的猜忌却更深。他回到内室召见女术士。女术士早听说王子成功归来，已经想好一个自称万无一失的办法。第二天，苏丹当着满朝臣子，提出最后一项要求。
        - id: ch02-b75
          speaker: sultan
          text: 孩子，替我找来一个人。他身高不能超过一英尺半，胡子却要有三十英尺长，肩上还扛着一根五百磅重的铁棒，能把它当短棍使用。办完这件事，我再也不会向你索取什么。
        - id: ch02-b76
          speaker: narrator
          text: 艾哈迈德不信世上有这样的人，很想推辞，苏丹却坚持不肯收回要求。王子回到帕里巴努身边，坦白说父亲要么在试探他会不会傻到去找，要么就是有意置他于死地。
        - id: ch02-b77
          speaker: prince_ahmed
          text: 即便真有这样一个人，他个子虽矮，武器却如此厉害，我怎么可能制服他，让他听我安排？若有办法，请告诉我，让我还能保住颜面，平安脱身。
        - id: ch02-b78
          speaker: fairy_paribanou
          text: 不要怕。取狮泉之水确实危险，找这个人却没有危险。他是我的亲兄弟谢巴尔。我们虽同父所生，模样却完全不同。他性情暴烈，受到一点冒犯也会残酷报复，谁都拦不住。可只要有人求助，他又总愿意好心相助。他的相貌与苏丹说的分毫不差，除了一根从不离身的五百磅铁棒，再没有别的武器。正是那根铁棒，让所有人都敬畏他。我会叫他来，你见到他的模样时，千万不要受惊。
        - id: ch02-b79
          speaker: prince_ahmed
          text: 我的王后，既然谢巴尔是您的兄弟，也就是我们的兄弟。不论他长得多么奇异，我都不会害怕，只会敬重他、爱他。
        - id: ch02-b80
          speaker: narrator
          text: 仙女命人在门廊下点起金火盆，又从金盒中取出香料投入火中，浓烟随即升起。片刻后，谢巴尔走了过来。他神情庄严，肩扛铁棒，双手托着长长的胡须，粗厚的八字胡掖到耳后，几乎遮住整张脸。他眼睛细小而深陷，头戴高帽，背上还有一个厉害的驼峰。
        - id: ch02-b81
          speaker: narrator
          text: 艾哈迈德若不是早知他的身份，恐怕连看也不敢看。谢巴尔死死盯着王子，来到妹妹面前，问这个男人是谁。
        - id: ch02-b82
          speaker: fairy_paribanou
          text: 哥哥，他是我的丈夫艾哈迈德，印度苏丹的儿子。当初没有请你参加婚礼，是不想打断你的远征。后来听说你胜利归来，我很高兴，这才冒昧召你前来。
        - id: ch02-b83
          speaker: schebar
          text: 妹妹，有什么事要我替他办？只要知道他是你的丈夫，我便愿意答应他的一切请求。
        - id: ch02-b84
          speaker: fairy_paribanou
          text: 他父亲很想见你。我希望你让艾哈迈德带路，到苏丹的宫廷去。
        - id: ch02-b85
          speaker: schebar
          text: 他只管走在前面，我会跟着。
        - id: ch02-b86
          speaker: fairy_paribanou
          text: 今天已经太晚，明早再动身吧。今晚我会把婚后苏丹与艾哈迈德之间发生的一切都告诉你。
        - id: ch02-b87
          speaker: narrator
          text: 第二天清早，了解来龙去脉的谢巴尔跟王子来到都城。百姓一见他便四散奔逃，有人关店锁门，有人一路飞奔，把恐惧传给迎面遇见的每一个人。两人走过的街道全都空了。宫门守卫也抛下岗位，他们毫无阻拦地走进苏丹接见臣民的议政大厅。
        - id: ch02-b88
          speaker: schebar
          text: 是你叫我来的。我已经站在这里。你找我有什么事？
        - id: ch02-b89
          speaker: narrator
          text: 苏丹没有回答，反而双手捂住眼睛，不肯看这个可怕的客人。谢巴尔应邀远道而来，却受到这样无礼的接待，顿时勃然大怒。他猛举铁棒，艾哈迈德还没来得及求情，苏丹已被一棒打死。
        - id: ch02-b90
          speaker: narrator
          text: 王子只来得及拦住他杀害大维齐尔，并说明这位大臣一直向父亲提出良言。谢巴尔于是认定，其余维齐尔和宠臣才是出坏主意的人。他每挥一棒便打死一人，只有及时转身逃跑的才活了下来。
        - id: ch02-b91
          speaker: schebar
          text: 我知道城里还有一个女术士。比这些卑鄙的宠臣更可恨的，就是她。立刻把她带来见我。
        - id: ch02-b92
          speaker: narrator
          text: 大维齐尔马上派人捉来女术士。谢巴尔举起铁棒。
        - id: ch02-b93
          speaker: schebar
          text: 收下你那些恶毒计策应得的报偿吧，也好叫你下次再装病！
          emotion: angry
        - id: ch02-b94
          speaker: narrator
          text: 话音未落，铁棒已经打下。谢巴尔随即宣布，除非全城立刻承认艾哈迈德是印度苏丹，否则他会用同样的办法处置所有人。
        - id: ch02-b95
          speakers: [citizen_one, citizen_two, citizen_three]
          ensemble: chorus
          text: 艾哈迈德苏丹万岁！
        - id: ch02-b96
          speaker: narrator
          text: 在场众人一遍遍高呼，欢呼声在空中回荡。全城很快传开新苏丹登基的消息。谢巴尔命人替艾哈迈德穿上王袍，扶他登上宝座，让所有人宣誓效忠。随后，他亲自去接妹妹帕里巴努，以世人能想象的最隆重、最华美的仪仗迎她入城，众人都承认她是印度的苏丹后。
        - id: ch02-b97
          speaker: narrator
          text: 阿里王子和努伦妮哈尔既没有参与谋害艾哈迈德，也对阴谋一无所知。艾哈迈德便划给他们一片富饶辽阔的领地，连同一座都城。他们在那里安度余生。
        - id: ch02-b98
          speaker: narrator
          text: 艾哈迈德又派官员去见隐居的侯赛因，把宫廷变故告诉他，并任他挑选最喜欢的领地。侯赛因却觉得隐居生活无比幸福，请官员代他感谢苏丹弟弟的好意，也保证会服从他。他唯一请求的恩典，就是准许自己继续留在亲手选定的清修之地。
        - id: ch02-b99
          speaker: narrator
          text: 这个故事出自《一千零一夜》。
