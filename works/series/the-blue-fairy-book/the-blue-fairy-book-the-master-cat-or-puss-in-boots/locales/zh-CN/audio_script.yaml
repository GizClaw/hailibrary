audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    youngest_son:
      display_name: 磨坊主的小儿子
      tts: {delivery: 谦和真诚而略显忧郁, timbre: 年轻清亮, pace: 中等, pitch: 中音}
    puss:
      display_name: 穿靴子的猫
      tts: {delivery: 机敏自信而一本正经, timbre: 明亮灵巧, pace: 轻快, pitch: 中高音}
    king:
      display_name: 国王
      tts: {delivery: 威严宽厚而兴致盎然, timbre: 浑厚成熟, pace: 稳健, pitch: 中低音}
    mower_1:
      display_name: 割草人甲
      tts: {delivery: 朴实而惴惴不安, timbre: 粗朴成熟, pace: 中等, pitch: 中低音}
    mower_2:
      display_name: 割草人乙
      tts: {delivery: 朴实而惴惴不安, timbre: 清晰成熟, pace: 中等, pitch: 中音}
    reaper_1:
      display_name: 收割人甲
      tts: {delivery: 直率而小心翼翼, timbre: 粗朴成熟, pace: 中等, pitch: 中低音}
    reaper_2:
      display_name: 收割人乙
      tts: {delivery: 直率而小心翼翼, timbre: 清晰成熟, pace: 中等, pitch: 中音}
    ogre:
      display_name: 食人妖
      tts: {delivery: 自负强横而好胜, timbre: 低沉有压迫感, pace: 稍慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 小儿子的遗产
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个磨坊主，死后只留下三样家产：一座磨坊、一头驴和一只猫。三个儿子马上分了东西，没请文书，也没找律师，因为那点可怜的家产可经不起他们花用。老大拿走磨坊，老二领走驴，轮到老三，只剩下一只猫。小儿子看着自己的那一份，心都凉了。
        - id: ch01-b02
          speaker: youngest_son
          text: 两个哥哥把东西合在一起，好歹能过日子。我却只有这只猫。吃完猫肉，再用猫皮做个暖手筒，我就什么都没有了，只能饿死。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 猫把这些话全听见了，却故意装作没听见。过了一会儿，它摆出十分郑重的样子开了口。
        - id: ch01-b04
          speaker: puss
          text: 好主人，先别灰心。请给我一只口袋，再做一双靴子，让我能穿过泥地和荆棘。您很快就会知道，分到我未必是一件坏事。
        - id: ch01-b05
          speaker: narrator
          text: 年轻人并没把这番话当成多大的指望。不过，他常常看见猫使出各种机灵手段捕捉大耗子和小老鼠。它会倒挂身子，会躲进面粉，也会躺着装死。想到这些本领，他虽然仍旧穷得可怜，倒也没有完全绝望，觉得猫也许真能替自己解一解眼前的困境。
        - id: ch01-b06
          speaker: narrator
          text: 猫拿到口袋和靴子，立刻神气地打扮起来。它把口袋挂在脖子上，两只前爪抓住袋绳，走进一处野兔很多的兔场。它在袋里放进麸皮和苦苣菜，再躺到旁边，装成一只死猫，等那些不懂世间圈套的小兔子来找吃的。
        - id: ch01-b07
          speaker: narrator
          text: 没等多久，一只又莽撞又糊涂的小兔子就跳进了口袋。猫先生猛地收紧袋口，捉住兔子，毫不留情地把它咬死了。它得意地提着猎物来到王宫，请求面见国王。侍从领它上楼，来到国王的房间。猫走到国王面前，恭恭敬敬地弯下腰。
        - id: ch01-b08
          speaker: puss
          text: 陛下，这只野兔是我的贵主人卡拉巴斯侯爵命我献给您的。
        - id: ch01-b09
          speaker: narrator
          text: 其实，“卡拉巴斯侯爵”这个显赫的名号，是猫自己替主人想出来的。
        - id: ch01-b10
          speaker: king
          text: 替我谢谢你的主人。这份礼物很合我的心意。
        - id: ch01-b11
          speaker: narrator
          text: 又有一天，猫藏在一片没有收割的麦田里，把口袋敞开。两只鹧鸪跑进袋中，它立刻拉紧绳子，把两只都捉住了。它照旧把猎物献给国王。国王高兴地收下，还赏了猫几个喝酒的钱。
    - id: ch02
      title: 河边的卡拉巴斯侯爵
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接下来的两三个月里，猫隔些日子就向国王献一次野味，每次都说那是主人打来的。后来，它打听到国王将带着女儿沿河兜风。这位公主，正是世上最美丽的姑娘。猫马上去找主人。
        - id: ch02-b02
          speaker: puss
          text: 您听我的，福气就来了。请到我指定的地方下河洗澡，别的事都让我来办。
        - id: ch02-b03
          speaker: narrator
          text: 年轻人不知道猫为什么这样安排，也不知道接下来会发生什么，还是走到猫指给他的那段河水里，照它的话洗起澡来。正洗着，国王的马车沿河驶来，猫顿时放声呼救。
        - id: ch02-b04
          speaker: puss
          text: 救命啊！快来人啊！卡拉巴斯侯爵大人要淹死了！
        - id: ch02-b05
          speaker: narrator
          text: 国王从车窗里探头一看，认出是那只常来献上好野味的猫，赶紧命令卫兵去救侯爵。卫兵们把这个可怜的年轻人从河里拉上岸时，猫跑到车前禀告，说几个恶棍趁主人洗澡，抢走了他的衣服。它还说，自己已经扯着嗓子喊了好几回。
        - id: ch02-b06
          speaker: puss
          text: 有贼啊！快抓住那些偷衣服的贼！
        - id: ch02-b07
          speaker: narrator
          text: 可那套衣服明明是猫亲手藏在大石头底下的。国王哪会知道，立刻命令王室衣官取来一套最好的衣裳，给侯爵换上。
        - id: ch02-b08
          speaker: narrator
          text: 国王对年轻人亲热极了。华贵的新衣更衬出了他匀称的身材和俊美的相貌。公主悄悄喜欢上了他。他朝公主投去两三次温柔而有礼的目光，她便爱得如痴如醉。国王一定要侯爵坐进马车，和他们一同兜风。
        - id: ch02-b09
          speaker: narrator
          text: 猫见计划已经奏效，心里欢喜，抢先往前走。来到一片草地，它看见几个乡下人正在割草。
        - id: ch02-b10
          speaker: puss
          text: 各位听好了。国王会问这片草地归谁。你们必须说，它属于卡拉巴斯侯爵大人。谁敢说错，我就把谁剁得像汤锅里的香草那么碎！
        - id: ch02-b11
          speaker: narrator
          text: 国王的马车很快来到跟前，他果然问起草地的主人。
        - id: ch02-b12
          speakers: [mower_1, mower_2]
          ensemble: duo
          text: 这是卡拉巴斯侯爵大人的草地。
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: 两个割草人早被猫吓得不轻。
        - id: ch02-b14
          speaker: youngest_son
          text: 陛下，您看，这片草地每年都能给我带来很好的收成。
        - id: ch02-b15
          speaker: narrator
          text: 猫继续赶路，又遇见几个收割麦子的人。
        - id: ch02-b16
          speaker: puss
          text: 国王马上就到。他若问这些麦子归谁，你们就说全是卡拉巴斯侯爵的。不照我说的做，我就把你们剁碎了下汤锅！
        - id: ch02-b17
          speaker: narrator
          text: 片刻之后，国王经过麦田，果然追问这大片庄稼是谁的。
        - id: ch02-b18
          speakers: [reaper_1, reaper_2]
          ensemble: duo
          text: 全都属于卡拉巴斯侯爵大人。
        - id: ch02-b19
          speaker: narrator
          text: 国王听了十分满意，对侯爵越发欣赏，还向他道贺。猫一路走在前面，遇见谁都发出同样的警告。于是，国王沿途听见的答案始终一样。他以为侯爵拥有看不到边的土地，惊叹得不得了。
    - id: ch03
      title: 食人妖的本领
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 猫先生终于来到一座宏伟的城堡。这里住着一个食人妖，他比人们听说过的任何食人妖都富有。国王一路经过的田地，全归这座城堡。猫事先已经问清食人妖的来历和本领，便请求见他，说自己到了城堡附近，理当进来向尊贵的主人致敬。
        - id: ch03-b02
          speaker: narrator
          text: 食人妖拿出了他所能拿出的最好礼数，请猫坐下。
        - id: ch03-b03
          speaker: puss
          text: 听说您想变成什么动物，就能变成什么动物。狮子、大象，不论哪一种都难不倒您，是真的吗？
        - id: ch03-b04
          speaker: ogre
          text: 当然是真的。我现在就变成狮子，让你亲眼看看。
        - id: ch03-b05
          speaker: narrator
          text: 转眼间，一头狮子出现在猫的身旁。猫吓得魂都快飞了，急忙爬上屋顶的檐沟。可它脚上穿着靴子，在瓦片上根本站不稳，每一步都又难又险。过了一会儿，食人妖变回原形，猫才小心地下了屋顶，承认自己刚刚着实受了一场惊吓。
        - id: ch03-b06
          speaker: puss
          text: 我还听见一种说法，可这回实在很难相信。他们说，您也能变成最小的动物，像大耗子、小老鼠都行。这怎么可能呢？
        - id: ch03-b07
          speaker: ogre
          text: 不可能？那就马上看清楚！
        - id: ch03-b08
          speaker: narrator
          text: 食人妖说变就变，立刻成了一只小老鼠，在地板上跑来跑去。猫一看见它，猛扑上去，一口便把它吃了。
    - id: ch04
      title: 侯爵的城堡
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，国王的马车正从城堡外经过。他看见这座漂亮的建筑，很想进去参观。猫听到车轮轰隆隆驶上吊桥，连忙跑出去迎接。
        - id: ch04-b02
          speaker: puss
          text: 欢迎陛下来到卡拉巴斯侯爵大人的城堡！
        - id: ch04-b03
          speaker: king
          text: 侯爵大人，这座城堡竟然也是你的？瞧这庭院，再瞧四周这些宏伟的房子，真是漂亮得不能再漂亮了。来，我们进去看看。
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: 侯爵扶着公主，跟在国王身后走进城堡。他们来到宽敞的大厅，只见一桌丰盛华美的宴席已经摆好。原来食人妖约了朋友当天来访，这些酒菜正是为客人准备的。可客人们听说国王在里面，谁也不敢踏进门。
        - id: ch04-b05
          speaker: narrator
          text: 国王越来越喜欢这位侯爵，公主更是早已深深爱上了他。国王再看看这份辽阔的产业，喝过五六杯酒以后，终于对年轻人开了口。
        - id: ch04-b06
          speaker: king
          text: 侯爵大人，只要你点头，你就是我的女婿了。
        - id: ch04-b07
          speaker: narrator
          text: 侯爵一次又一次深深鞠躬，接受了国王给他的荣幸。就在当天，他和公主成了婚。
        - id: ch04-b08
          speaker: narrator
          text: 穿靴子的猫从此成了一位大贵人。往后它再也不必追耗子，偶尔追上一只，也不过是为了消遣。这个故事由夏尔·佩罗记录下来。
