  chapters:
    - id: ch01
      title: The Youngest Son's Inheritance
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A miller died and left his three sons only a mill, a donkey, and a cat. They divided everything at once, without calling for a clerk or a lawyer. Such men would soon have eaten up the little inheritance. The eldest took the mill, the second took the donkey, and all the youngest received was the cat. The poor young man was heartbroken by his miserable share.
        - id: ch01-b02
          speaker: youngest_son
          text: My brothers can put their shares together and earn a good living. But what can I do? Once I have eaten my cat and made a muff from his fur, I will have nothing left. I will starve.
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: The Cat heard every word, though he pretended not to. Then he spoke with a grave and serious air.
        - id: ch01-b04
          speaker: puss
          text: Do not be so miserable, good master. Give me a bag, and have a pair of boots made for me so I can cross the mud and brambles. Then you will see that your share is worth far more than you think.
        - id: ch01-b05
          speaker: narrator
          text: His master did not place much trust in this promise. Still, he had seen the Cat use many clever tricks to catch rats and mice. The Cat could hang by his heels, hide himself in the flour, or lie as still as if he were dead. Remembering all that, the young man did not completely give up hope that the Cat might help him in his unhappy condition.
        - id: ch01-b06
          speaker: narrator
          text: As soon as the Cat had the bag and boots, he dressed himself handsomely. He slung the bag around his neck, held its cords in his front paws, and went to a rabbit warren. He placed bran and sow-thistle inside the bag. Then he stretched out beside it and played dead. He was waiting for some young rabbit that knew nothing of the world's tricks to climb in for the food.
        - id: ch01-b07
          speaker: narrator
          text: He had hardly settled down when a foolish young rabbit jumped into the bag. Monsieur Puss pulled the cords tight at once, caught the rabbit, and killed it without mercy.
        - id: ch01-b08
          speaker: narrator
          text: Proud of his catch, Puss carried it to the palace and asked to see the King. He was led upstairs to the royal apartment, where he bowed very low.
        - id: ch01-b09
          speaker: puss
          text: Your Majesty, I bring you a rabbit from the warren. My noble lord, the Marquis of Carabas, has commanded me to present it to you.
        - id: ch01-b10
          speaker: narrator
          text: The Marquis of Carabas was simply the grand title Puss had chosen for his master.
        - id: ch01-b11
          speaker: king
          text: Tell your master that I thank him. His gift gives me great pleasure.
        - id: ch01-b12
          speaker: narrator
          text: Another day, Puss hid among the tall stalks in a field of standing corn and kept his bag wide open. When two partridges ran inside together, he pulled the cords tight and caught them both. He carried the birds to the palace and presented them to the King just as he had presented the rabbit. The King accepted this new gift with great pleasure and ordered that Puss be given money for a drink.
    - id: ch02
      title: The Marquis by the River
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For the next two or three months, the Cat kept bringing the King game from time to time. With every gift, he claimed that the animals had been caught on the lands of his master, the Marquis of Carabas.
        - id: ch02-b02
          speaker: narrator
          text: Then Puss learned that the King would soon ride beside the river with his daughter, the most beautiful princess in the world. He went straight to his master.
        - id: ch02-b03
          speaker: puss
          text: Follow my advice, and your fortune is made. Go wash in the river at the place I show you. Leave everything else to me.
        - id: ch02-b04
          speaker: narrator
          text: The Marquis of Carabas did as the Cat told him, though he had no idea why. While the young man was bathing, the royal coach came along the riverbank. Puss began to shout.
        - id: ch02-b05
          speaker: puss
          text: Help! Help! My lord, the Marquis of Carabas, is drowning!
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: The King looked out of the coach. He recognized the Cat who had brought him so much fine game, and at once he ordered his guards to rescue the Marquis. While they pulled the poor young man from the water, Puss hurried to the coach. He told the King that robbers had stolen his master's clothes while he was bathing. Puss claimed that he had shouted after them as loudly as he could.
        - id: ch02-b07
          speaker: puss
          text: Thieves! Thieves!
        - id: ch02-b08
          speaker: narrator
          text: In truth, the cunning Cat had hidden the clothes beneath a large stone. The King immediately sent officers from his wardrobe to fetch one of his finest suits for the Marquis of Carabas.
        - id: ch02-b09
          speaker: narrator
          text: The King treated the young man with extraordinary kindness. The splendid clothes from the royal wardrobe made his handsome face and fine figure look even better. The Princess began to feel a secret fondness for him. When the Marquis gave her two or three respectful and tender looks, she fell wildly in love with him.
        - id: ch02-b10
          speaker: narrator
          text: The King insisted that the Marquis join them in the coach. Puss was overjoyed to see his plan beginning to work. He hurried ahead until he found some countrymen mowing a meadow.
        - id: ch02-b11
          speaker: puss
          text: Good mowers, the King will ask who owns this meadow. Tell him it belongs to my lord, the Marquis of Carabas. If you do not, you will be chopped as small as herbs for the cooking pot.
        - id: ch02-b12
          speaker: narrator
          text: Soon the royal coach reached the meadow, and the King asked the mowers who owned it.
        - id: ch02-b13
          speakers: [mower_1, mower_2]
          ensemble: duo
          text: It belongs to my lord, the Marquis of Carabas.
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: The Cat's threat had frightened them terribly.
        - id: ch02-b15
          speaker: youngest_son
          text: As you see, Your Majesty, this meadow gives a rich harvest every year.
        - id: ch02-b16
          speaker: narrator
          text: Puss kept going and came upon some reapers working in a field of corn.
        - id: ch02-b17
          speaker: puss
          text: Good reapers, when the King asks about this corn, say that all of it belongs to the Marquis of Carabas. Otherwise, you will be chopped as small as herbs for the cooking pot.
        - id: ch02-b18
          speaker: narrator
          text: A moment later, the King passed by and demanded to know who owned the corn.
        - id: ch02-b19
          speakers: [reaper_1, reaper_2]
          ensemble: duo
          text: It belongs to my lord, the Marquis of Carabas.
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: The answer pleased the King, and he congratulated the Marquis. Puss continued ahead, giving the same warning to everyone he met. Again and again, the people told the King that the land belonged to the Marquis of Carabas. The King was amazed by the vast estates he believed the young man possessed.
    - id: ch03
      title: The Ogre's Great Trick
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, Monsieur Puss reached a magnificent castle. Its master was an ogre, the richest one anyone had ever known. Every field and meadow the King had passed belonged to this castle.
        - id: ch03-b02
          speaker: narrator
          text: Puss had taken care to learn who the Ogre was and exactly what powers he possessed. At the castle, he asked for an audience. He explained that he could never pass so near the home of such a great lord without having the honor of paying his respects. The Ogre received him with as much courtesy as an ogre could manage and invited him to sit down.
        - id: ch03-b03
          speaker: puss
          text: I have heard that you can turn yourself into any creature you choose. They say you can become a lion, an elephant, or anything else you please.
        - id: ch03-b04
          speaker: ogre
          text: It is true. To prove it, I will become a lion right now.
        - id: ch03-b05
          speaker: narrator
          text: In an instant, a lion stood close beside Puss. The Cat was terribly frightened. He scrambled up to the roof gutter, though climbing the tiles in boots was difficult and dangerous.
        - id: ch03-b06
          speaker: narrator
          text: After a little while, the Ogre returned to his own shape. Puss climbed down and admitted that the lion had given him a terrible fright. Then he continued his clever questioning.
        - id: ch03-b07
          speaker: puss
          text: I have heard something else, but I cannot quite believe it. Can you really take the shape of the smallest animals? Could you turn yourself into a rat or a mouse? That seems impossible.
        - id: ch03-b08
          speaker: ogre
          text: Impossible? I will show you this very moment!
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: At once, the Ogre became a mouse and began running across the floor. The moment Puss saw him, he sprang on the mouse and ate him up.
    - id: ch04
      title: The Castle of Carabas
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, the King had noticed the Ogre's beautiful castle as his coach went by. He decided he would like to visit it. Puss heard the royal coach rumbling across the drawbridge, so he rushed outside to greet it.
        - id: ch04-b02
          speaker: puss
          text: Your Majesty, welcome to the castle of my lord, the Marquis of Carabas.
        - id: ch04-b03
          speaker: king
          text: What is this, my lord Marquis? Does this castle belong to you as well? Nothing could be finer than this courtyard and the splendid buildings around it. Come, let us go inside.
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: The Marquis offered his hand to the Princess and followed the King, who entered first. They passed through the castle and came to a spacious hall. There they found a magnificent feast already waiting. The Ogre had prepared it for friends who were coming to visit that very day. Once those guests learned the King was there, however, they did not dare enter.
        - id: ch04-b05
          speaker: narrator
          text: The King was completely charmed by the Marquis and all his fine qualities. His daughter, already deeply in love, was just as delighted. Then the King looked over the vast estate that seemed to belong to the young man. After drinking five or six glasses, he spoke.
        - id: ch04-b06
          speaker: king
          text: My lord Marquis, it is entirely up to you whether you become my son-in-law.
        - id: ch04-b07
          speaker: narrator
          text: The Marquis bowed several times and accepted the great honor the King offered him. That very day, he married the Princess.
        - id: ch04-b08
          speaker: narrator
          text: Puss became a great lord. From then on, he chased mice only for his own amusement.
