  chapters:
    - id: ch01
      title: The Brass-Bound Chest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king whose only child was a daughter. He longed for a son, or at least a grandson who might rule after him. But a prophet warned him that his daughter's son would kill him. The news filled the King with terror. He decided his daughter must never marry, because he would rather have no grandson than die at a grandson's hand.
        - id: ch01-b02
          speaker: narrator
          text: The King called his workmen together and ordered them to dig a deep, round hole in the earth. At the bottom, they built a prison entirely of brass. When it was finished, he locked the Princess inside. No man ever saw her there, and she never saw the fields or the sea. Her only window was a broad opening in the roof. Through it, she could watch the sun cross the sky and the clouds drift past. She would sit beneath that opening for hours, looking upward and wondering whether she would ever leave her brass prison.
        - id: ch01-b03
          speaker: narrator
          text: One day, the sky seemed to open. A great shower of shining gold poured through the roof and glittered across her room. Before long, the Princess had a baby boy. When her father heard, anger and fear seized him. Here was the child who was meant to bring about his death.
        - id: ch01-b04
          speaker: narrator
          text: Cowardly as the King was, he could not quite bring himself to kill his daughter and her baby with his own hands. Instead, he had them shut inside a huge chest bound with brass and pushed out onto the open sea. The waves could drown them, or hunger could kill them, without his having to strike the blow. And if they somehow reached another country, they would at least be far away and out of his path.
        - id: ch01-b05
          speaker: narrator
          text: All day and through the night, the chest drifted over the waves. The baby knew nothing of wind or water and slept soundly. His mother wept and sang over him.
        - id: ch01-b06
          speaker: princess
          text: Child, my child, how sound you sleep, while your mother's care is deep. Here in this narrow brass-bound chest, your little heart can lie at rest. Through the dark and starless night, you do not hear the breakers cry or the night wind wander by. Wrapped in soft purple, with your face on mine, you sleep without hearing your mother weep or the sea break around us.
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: At last daylight came, and the waves drove the chest against an island shore. It lay there until a man came by, dragged it onto the beach, and broke it open. To his amazement, he found a beautiful lady and a little boy. He took them home, treated them kindly, and raised the child until he became a young man.
        - id: ch01-b08
          speaker: narrator
          text: By then, the King of that island had fallen in love with the boy's mother and wanted to marry her. He knew she would never leave her son, so he planned to get the young man out of his way. A great queen in a nearby country was about to marry. The King commanded every subject to bring him a wedding gift for her, and he invited them all to a feast.
        - id: ch01-b09
          speaker: narrator
          text: Some guests brought golden cups. Others brought necklaces of gold and amber, or beautiful horses. The boy had nothing. Though his mother was a princess, she owned nothing she could give him. The company laughed at the empty-handed young man, and the King mocked him too.
        - id: ch01-b10
          speaker: island_king
          text: If you have no other gift, you could at least fetch me the Terrible Head.
        - id: ch01-b11
          speaker: narrator
          text: Proud and quick-tempered, the boy answered before he had time to think.
        - id: ch01-b12
          speaker: boy
          text: Then I swear I will bring you the Terrible Head, if any living man can bring it. But I do not even know whose head you mean.
        - id: ch01-b13
          speaker: narrator
          text: They told him of three dreadful sisters who lived somewhere very far away. These monstrous, ogre-like women had golden wings and claws of brass. Instead of hair, living serpents grew and twisted upon their heads. They were so awful to behold that anyone who looked directly at them turned instantly to stone. Two of the sisters could never be killed. Only the youngest was mortal, and strangely, her face was very beautiful. Hers was the Terrible Head he had just sworn to bring. It was no easy promise to keep.
        - id: ch01-b14
          speaker: narrator
          text: Perhaps he regretted his oath then, but he meant to keep it. Leaving the others to drink and celebrate, he walked alone beside the sea at dusk. He came to the very place where the chest had once carried him and his mother ashore.
    - id: ch02
      title: The Shoes of Swiftness
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The boy sat on a rock, gazing across the water and wondering where his adventure could begin. Someone touched his shoulder. He turned and saw a young man who looked like a king's son, beside a tall, beautiful lady whose blue eyes shone like stars. Both were taller than ordinary people.
        - id: ch02-b02
          speaker: narrator
          text: The young man carried a staff with golden wings and two golden serpents twisting around it. There were wings on his cap and shoes as well. He asked why the boy looked so unhappy, and the boy explained his oath and confessed that he had no idea how to fulfill it.
        - id: ch02-b03
          speaker: beautiful_lady
          text: Your oath was foolish and hasty. Still, if a brave man made it, he may be able to keep it.
        - id: ch02-b04
          speaker: boy
          text: I am not afraid. I only need to know the way.
        - id: ch02-b05
          speaker: beautiful_lady
          text: To kill the woman with golden wings and brass claws, and take her head, you need three things. The Cap of Darkness will make you invisible. The Sword of Sharpness can cut through iron with one stroke. And the Shoes of Swiftness will carry you through the air.
        - id: ch02-b06
          speaker: boy
          text: I do not know where to find such things. Without them, all I can do is try and fail.
        - id: ch02-b07
          speaker: narrator
          text: The young man took off his own winged shoes and held them out.
        - id: ch02-b08
          speaker: winged_young_man
          text: Use my shoes until you have taken the Terrible Head, and then return them. They will carry you over land or sea, as fast as a bird or a thought, wherever they know the road. But some roads lie beyond the world's borders, and the shoes do not know those.
        - id: ch02-b09
          speaker: winged_young_man
          text: First, go far north to the Three Gray Sisters. They are so cold that all three share one eye and one tooth. Creep close. When one sister passes the eye to another, seize it. Do not return it until they tell you how to reach the Three Fairies of the Garden. Those fairies will give you the cap and sword, and show you the road beyond this world to the Terrible Head.
        - id: ch02-b10
          speaker: beautiful_lady
          text: Go now. Do not return to say goodbye to your mother, because this must be done quickly. The Shoes of Swiftness know the road to the Gray Sisters, and they will carry you there.
        - id: ch02-b11
          speaker: narrator
          text: The boy thanked her and fastened on the shoes. He turned to say goodbye, but the young man and the lady had vanished. He could not tell how or where they had gone.
        - id: ch02-b12
          speaker: narrator
          text: He leaped into the air to test the shoes, and they swept him away faster than the wind. He flew over the warm blue sea and the pleasant lands of the south. Farther north, he passed above wandering peoples who drank mare's milk and lived in enormous wagons, always moving after their flocks. He crossed broad rivers where flocks of wild birds rose from the water and fled before the strange figure flying overhead.
        - id: ch02-b13
          speaker: narrator
          text: On he flew over plains, the cold northern sea, snowy fields, and hills of ice. At last he reached the end of the world, where every drop of water was frozen and there were no people, animals, or blades of green grass.
    - id: ch03
      title: The Gray Sisters and the Garden
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In a blue cave of ice, he found the Three Gray Sisters, the oldest living creatures. Their hair was white as snow, their skin was icy blue, and they nodded and mumbled as if half asleep. Their frozen breath hung around them in a cloud.
        - id: ch03-b02
          speaker: narrator
          text: The cave mouth was so narrow that he could hardly enter without brushing against one of them. Floating lightly on the winged shoes, he slipped inside and waited. One sister was holding their only eye.
        - id: ch03-b03
          speaker: gray_sister_1
          text: Sister, what can you see? Are the old times coming back?
        - id: ch03-b04
          speaker: gray_sister_2
          text: No, sister. I see nothing of them.
        - id: ch03-b05
          speaker: gray_sister_1
          text: Then pass me the eye. Perhaps I can see farther than you can.
        - id: ch03-b06
          speaker: narrator
          text: The second sister held out the eye. As the first groped for it, the boy neatly snatched it from her hand.
        - id: ch03-b07
          speaker: gray_sister_1
          text: Where is the eye, sister?
        - id: ch03-b08
          speaker: gray_sister_2
          text: You took it yourself, sister.
        - id: ch03-b09
          speaker: gray_sister_3
          text: Have you lost our eye? Is it gone? Will we never see the old times coming back?
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: The boy slipped behind them and out into the open air. Then he laughed aloud. At the sound, the Gray Sisters began to weep. They knew a stranger had robbed them, and they were helpless. Their tears froze as they fell from their empty eye sockets and rattled on the cave floor.
        - id: ch03-b11
          speaker: narrator
          text: They begged him to return the eye. Their misery made him pity them, but he refused unless they showed him the way to the Fairies of the Garden.
        - id: ch03-b12
          speaker: boy
          text: Tell me how to reach the Fairies of the Garden. Until you do, I will not give your eye back.
        - id: ch03-b13
          speaker: narrator
          text: The sisters wrung their hands in misery. They understood why a young stranger would travel all the way to their frozen cave and steal their eye. He must be going after the Terrible Head. The dreadful winged women were related to them, and it was hard for the Gray Sisters to help an enemy find their kin. Still, without their eye they could see nothing at all. At last, they gave in. They told him to keep flying south, always with the land on his left hand and the sea on his right, until he reached the Island of the Fairies of the Garden.
        - id: ch03-b14
          speaker: narrator
          text: The boy returned their eye, and once again they watched for the old times to come back. He flew south between land and sea until a beautiful island appeared, crowned with flowering trees.
        - id: ch03-b15
          speaker: narrator
          text: On the island, he found the Three Fairies of the Garden. They looked like beautiful young women, dressed in green, white, and red. They danced and sang around an enchanted apple tree heavy with golden fruit.
        - id: ch03-b16
          speakers: [fairy_green, fairy_white, fairy_red]
          ensemble: chorus
          text: Round and round the apples of gold, round and round dance we. Since the days of old, we have danced about the enchanted tree. We circle while spring is green, while streams still flow, and while wind stirs the sea.
        - id: ch03-b17
          speakers: [fairy_green, fairy_white, fairy_red]
          ensemble: chorus
          text: No one may taste the golden fruit until the golden new time comes. Many trees will rise from shoots, many blossoms will wither at the root, many songs will fall silent, and many lutes will break before that new time comes.
        - id: ch03-b18
          speakers: [fairy_green, fairy_white, fairy_red]
          ensemble: chorus
          text: Round and round the golden tree, round and round dance we. So the great world has spun from long ago, through summer and winter, fire and cold, every song that is sung and every tale that is told, folding and unfolding around the fairy tree.
        - id: ch03-b19
          speaker: narrator
          text: These solemn dancing fairies were nothing like the Gray Sisters. They welcomed the boy kindly and asked why he had come. He told them he had been sent to find the Sword of Sharpness and the Cap of Darkness.
        - id: ch03-b20
          speaker: narrator
          text: The fairies gave him both of the treasures he needed. They also brought him a wallet for carrying the head and a bright shield whose surface shone like a mirror. They buckled the Sword of Sharpness around his waist, and he saw that its blade was made of diamond. Then they placed the Cap of Darkness on his head. Though they were fairies, the three women could no longer see him at all.
        - id: ch03-b21
          speaker: narrator
          text: He took the cap off again. Each fairy kissed him and wished him good fortune. Then they returned to their endless dance, guarding the golden tree until the new times came or the world ended.
    - id: ch04
      title: The Terrible Head
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The boy put on the cap, hung the wallet at his waist, slung the shield over his shoulders, and flew beyond the great river that coils like a serpent around the whole world.
        - id: ch04-b02
          speaker: narrator
          text: Beside that river, the three Terrible Women lay asleep under a poplar tree. Dead leaves covered the ground. Their golden wings were folded and their brass claws crossed. Two hid their hideous heads beneath their wings like sleeping birds, while the snakes in their hair twisted out from under the golden feathers.
        - id: ch04-b03
          speaker: narrator
          text: The youngest slept between her sisters, lying on her back with her beautiful, sorrowful face turned toward the sky. Even in sleep, her eyes remained wide open. If the boy had looked into that face, the sight would have turned him to stone. There was such terror in it, and such pity too, that no living person could bear the sight. But before coming close, he had made a plan to kill her without ever looking directly at her.
        - id: ch04-b04
          speaker: narrator
          text: While he was still far away, he lifted the shining shield and used it as a mirror. He watched the women's reflections instead of looking at them. Step by step, he moved closer. When he judged that the youngest lay within reach, he worked out where to swing backward over his shoulder.
        - id: ch04-b05
          speaker: narrator
          text: Still facing away, he drew the Sword of Sharpness and swung backward with all his strength. One stroke was enough. The Terrible Head fell cleanly from the creature's shoulders, and the blood burst out so violently that it struck the boy like a blow. He did not turn to see what he had done. He thrust the head straight into the wallet, closed it safely away, and sprang into the air.
        - id: ch04-b06
          speaker: narrator
          text: The two surviving sisters awoke and rose into the air like enormous birds. The Cap of Darkness hid him from their eyes, but they caught his scent and hunted him upwind through the clouds, as hounds follow prey through a forest.
        - id: ch04-b07
          speakers: [terrible_sister_1, terrible_sister_2]
          ensemble: duo
          text: Here! No, there! He went this way!
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: They swept so close that he heard their shrieks and the hard clatter of golden wings. But the Shoes of Swiftness were faster. Once he crossed the river around the world, the cries and rattling wings faded far behind him.
    - id: ch05
      title: The Princess by the Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Safe on the nearer side of the river, the boy flew east in search of home. Looking down, he saw a strange and dreadful sight. A beautiful girl was chained to a stake at the sea's high-water mark. She was so frightened or exhausted that only the iron chain around her waist kept her from falling. She hung there as still as death.
        - id: ch05-b02
          speaker: narrator
          text: Filled with pity, he flew down and stood beside her. When he spoke, she managed to raise her head and look around. But she saw no one, and the voice coming out of empty air only frightened her more. Then the boy remembered that the Cap of Darkness still covered his head. He pulled it off. Before her stood the handsomest young man she had ever seen, with short, curling yellow hair, blue eyes, and a laughing face. As he looked at her, he thought she was the most beautiful girl anywhere in the world.
        - id: ch05-b03
          speaker: narrator
          text: One stroke of the Sword of Sharpness cut through her iron chain. The boy asked why she had been bound there and why anyone could treat her so cruelly.
        - id: ch05-b04
          speaker: rescued_princess
          text: I am the daughter of this country's king. A monstrous beast rises from the sea and devours one girl every day. Today the lot fell on me, so they tied me here for the creature.
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: As she spoke, the long, savage head of a sea creature rose among the waves and snapped at her. The beast was too greedy and too hasty, and its first bite missed.
        - id: ch05-b06
          speaker: narrator
          text: Before it could strike again, the boy pulled the Terrible Head from his wallet and held it high. The sea beast leaped once more. Its eyes met the head, and in an instant the creature became stone. That stone beast still stands on the seacoast to this day.
        - id: ch05-b07
          speaker: narrator
          text: The boy and the girl went together to her father's palace. Everyone there was mourning her death. When she returned alive and unharmed, they could scarcely believe what they saw. The King and Queen welcomed the boy with joy, and they were more delighted still when they learned he wished to marry their daughter.
        - id: ch05-b08
          speaker: narrator
          text: The boy and the Princess were married amid the most magnificent celebrations the court could provide. They remained there happily for a time. At last, the boy decided they must go back to his own country. His bride could not fly beside him, and he could not carry her all that distance through the air. They would have to travel by ship. Before sailing, he took the Shoes of Swiftness, the Cap of Darkness, and the Sword of Sharpness to a lonely place among the hills.
        - id: ch05-b09
          speaker: narrator
          text: He left the three gifts there. The young man and the beautiful lady who had met him beside the sea found them again. With his borrowed treasures returned, the boy boarded a ship with his bride and sailed for home.
        - id: ch05-b10
          speaker: narrator
          text: Their ship entered the harbor of his native land, and the boy and his bride stepped into the town. Almost at once, he saw his own mother racing toward him down the street, fleeing for her life. The wicked Island King followed close behind with a sword in his hand. She had never agreed to marry him. She had disliked him before, but after her son vanished so suddenly, she hated him even more. She knew nothing of the oath or the journey and believed the King had secretly murdered her son. Now, because she would never be his wife, the King meant to murder her as well.
        - id: ch05-b11
          speaker: narrator
          text: The Princess ran straight into her son's arms. He had only time to kiss her and step between her and the King. The King's sword came down, and the boy caught the blow on his shield.
        - id: ch05-b12
          speaker: boy
          text: I swore I would bring you the Terrible Head. Look now, and see how I have kept my oath!
        - id: ch05-b13
          speaker: narrator
          text: He drew the head from his wallet. The King looked at it and turned to stone where he stood, his sword still raised.
        - id: ch05-b14
          speaker: narrator
          text: All the people rejoiced because the wicked man would never rule them again. They begged the boy to become their king. He refused, saying he must take his mother back to her father's home. So the people chose instead the kind man who had rescued her from the great chest and sheltered her long ago.
    - id: ch06
      title: The Prophecy Fulfilled
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Before long, the boy sailed away with his mother and his wife. They were bound for the mother's own country, the kingdom from which her father had driven her so cruelly.
        - id: ch06-b02
          speaker: narrator
          text: On the journey, they stopped at another king's court. Games were being held there, with prizes for the finest runners, boxers, and throwers of the quoit. The boy decided to test his strength against the others.
        - id: ch06-b03
          speaker: narrator
          text: He hurled the quoit farther than anyone had ever thrown one before. It flew beyond the field and dropped among the watching crowd. There it struck a man and killed him.
        - id: ch06-b04
          speaker: narrator
          text: The dead man was none other than the father of the boy's mother, the very King who had imprisoned her long ago. Even after casting his daughter and her baby into the sea, he had remained afraid. He had fled his own kingdom because he feared that his grandson might somehow survive, find him, and kill him after all. Yet the boy had not hunted him or even known he was there. The fatal throw came by chance. The old King's cowardice had driven him to the place where the prophecy was fulfilled.
        - id: ch06-b05
          speaker: narrator
          text: The boy, his wife, and his mother returned to the kingdom that belonged to them. After all their suffering, they lived there long and happily.
