audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    princess_mother:
      display_name: 公主
      tts: {delivery: 温柔坚韧而含着忧伤, timbre: 柔和清亮, pace: 从容, pitch: 中高音}
    island_king:
      display_name: 岛国国王
      tts: {delivery: 傲慢阴险而咄咄逼人, timbre: 浑厚冷硬, pace: 中等, pitch: 中低音}
    boy:
      display_name: 男孩
      tts: {delivery: 勇敢爽朗而坚定, timbre: 清朗年轻, pace: 从容有力, pitch: 中音}
    divine_young_man:
      display_name: 神秘青年
      tts: {delivery: 明快自信而从容, timbre: 清亮坚实, pace: 中等, pitch: 中音}
    divine_lady:
      display_name: 神秘女子
      tts: {delivery: 庄重睿智而果断, timbre: 明净高雅, pace: 舒缓, pitch: 中音}
    gray_sister_1:
      display_name: 灰大姐
      tts: {delivery: 苍老恍惚而忧郁, timbre: 干涩衰老, pace: 缓慢, pitch: 低音}
    gray_sister_2:
      display_name: 灰二姐
      tts: {delivery: 苍老迟疑而忧郁, timbre: 沙哑衰老, pace: 缓慢, pitch: 中低音}
    gray_sister_3:
      display_name: 灰三妹
      tts: {delivery: 苍老焦急而哀伤, timbre: 尖细衰老, pace: 稍慢, pitch: 中音}
    garden_fairy_green:
      display_name: 绿衣仙女
      tts: {delivery: 庄重悠远而温和, timbre: 清澈空灵, pace: 舒缓, pitch: 中高音}
    garden_fairy_white:
      display_name: 白衣仙女
      tts: {delivery: 庄重悠远而温和, timbre: 柔亮空灵, pace: 舒缓, pitch: 中高音}
    garden_fairy_red:
      display_name: 红衣仙女
      tts: {delivery: 庄重悠远而温和, timbre: 明亮空灵, pace: 舒缓, pitch: 中高音}
    dread_sister_1:
      display_name: 可怕的大姐
      tts: {delivery: 凶厉急迫而狂躁, timbre: 粗粝尖锐, pace: 快, pitch: 中低音}
    dread_sister_2:
      display_name: 可怕的二姐
      tts: {delivery: 凶厉急迫而狂躁, timbre: 沙哑尖利, pace: 快, pitch: 中音}
  chapters:
    - id: ch01
      title: 铜箍木箱里的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王只有一个女儿。他一直盼着有儿子继承王位，至少也想有个外孙。偏偏他请来的先知告诉他，女儿将来的儿子会亲手杀死他。国王吓得魂不附体，认定没有外孙也比死在外孙手里强。他从此不准公主出嫁，还召来所有工匠，在地上挖出一个又深又圆的大坑。坑底建起一座青铜牢房，完工那天，他就把亲生女儿锁了进去。
        - id: ch01-b02
          speaker: narrator
          text: 从此，没有男人能见到公主。她也再看不见田野和大海。青铜屋顶只有一扇宽天窗，天空和太阳成了她眼中仅有的世界。她常坐在那里，看云朵慢慢飘过，猜想自己还有没有出去的一天。有一天，头顶的天空仿佛忽然打开，灿烂的金雨穿过天窗，落在房中闪闪发亮。没过多久，公主生下一个男孩。
        - id: ch01-b03
          speaker: narrator
          text: 预言里的孩子降生了，国王又怒又怕。他虽胆小，却还没有狠到亲手杀死母子二人，便把他们装进巨大的铜箍木箱，推入海中。淹死也好，饿死也好，哪怕漂到遥远的国度也好，只要从此不来妨碍他。
        - id: ch01-b04
          speaker: narrator
          text: 木箱在海上浮浮沉沉，漂过整整一天一夜。风在外面呼啸，海浪不断拍打箱壁。婴儿根本不懂这些风浪能够伤人，所以一点也不怕，仍在母亲怀里睡得香甜。公主却满心忧虑，只能守着他，轻轻唱了起来。
        - id: ch01-b05
          speaker: princess_mother
          text: “孩子，我的孩子，你睡得多安稳！母亲虽有万般忧心，你仍能安然躺在铜箍紧锁的窄箱中。无星的长夜凄清阴沉，你听不见涛声破碎，也听不见夜风哀鸣。你裹着柔软的紫色斗篷，小脸贴着我的脸，听不见母亲哭泣，也听不见海浪迸裂的声音。”
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: 天亮以后，巨浪把木箱推到一座岛上。一个岛民发现它，拖上沙滩，撬开箱盖，竟救出一位美丽的女子和一个小男孩。他把母子带回家，善待他们，把孩子抚养成了强健的青年。
        - id: ch01-b07
          speaker: narrator
          text: 等男孩长大成人，岛国的国王爱上了公主，想娶她为妻。他知道公主绝不肯离开儿子，便想出一条毒计，要把年轻人赶走。恰好邻国有位尊贵的女王即将成婚，他命所有臣民各备一份贺礼，由自己转赠给她，还特意设宴收礼。席间金光闪闪，有人献金杯，有人献黄金与琥珀串成的项链，也有人牵来骏马。男孩虽是公主之子，母亲却一贫如洗，实在没有东西可以给他。众人见他两手空空，全都笑了起来。国王要的正是这个机会。
        - id: ch01-b08
          speaker: island_king
          text: 既然没有礼物，你至少可以替我取来那颗可怕的头颅。
        - id: ch01-b09
          speaker: narrator
          text: 男孩骄傲又冲动，当场发下誓言。
        - id: ch01-b10
          speaker: boy
          text: 只要活人办得到，我一定把它带回来！可你们说的究竟是谁的头？
        - id: ch01-b11
          speaker: narrator
          text: 众人告诉他，遥远得不知在何处的地方，住着三个妖魔般的姐妹。她们长着金色翅膀和青铜利爪，头上没有一根头发，爬动的全是毒蛇。她们的模样恐怖至极，任何人只要看上一眼，马上就会化成石头。两个姐姐永远杀不死，只有最小的妹妹能够被杀。偏偏她又有一张绝美的脸。男孩发誓带回的，正是她的头颅。这样的冒险，哪里会容易呢？
    - id: ch02
      title: 飞向世界尽头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男孩也许后悔了，却决心守住誓言。他离开饮酒作乐的宴席，独自走到海边。载着他和母亲的木箱，当年正是在这里上岸。他坐在岩石上望着暮色中的大海，不知道第一步该往哪里走。
        - id: ch02-b02
          speaker: narrator
          text: 忽然，有人轻轻碰了碰他的肩膀。男孩回头，看见一位王子模样的青年，旁边还站着一个高挑美丽的女子。两人都比凡人高大，女子的蓝眼睛亮如星辰。青年手里握着一根奇异的权杖，杖上生着金色翅膀，两条金蛇盘绕其间。他的帽子和鞋上也有翅膀。青年问男孩为什么如此忧愁，男孩便把自己发下的誓言，以及根本不知道如何开始的苦恼，全都说了出来。女子听完，开口说道。
        - id: ch02-b03
          speaker: divine_lady
          text: 这个誓言又蠢又草率。不过，若是勇敢的人发下的，还是能够兑现。
        - id: ch02-b04
          speaker: boy
          text: 只要有人告诉我该怎么走，我什么也不怕。
        - id: ch02-b05
          speaker: divine_lady
          text: 你需要三件宝物。戴上隐身帽，谁也看不见你。利剑一挥，钢铁也会断开。穿上飞鞋，你便能飞上天空。
        - id: ch02-b06
          speaker: narrator
          text: 男孩说自己无处寻找这些宝物，缺了它们，冒险只能失败。青年便脱下自己的鞋交给他。
        - id: ch02-b07
          speaker: divine_young_man
          text: 先借你这双飞鞋，等取到头颅再还我。它认得的路，无论越过陆地还是海浪，都能带你飞得像鸟儿、像念头一样快。可你还得走到世界边界之外，那里它不认路。
        - id: ch02-b08
          speaker: divine_young_man
          text: 先去北方找三位灰姐妹。那里冷得三个人合起来只有一只眼睛和一颗牙。等她们传递眼睛时，把它抢来。她们若不告诉你花园三仙女住在哪里，就别归还。仙女会给你隐身帽和利剑，再指点你飞出这个世界。
        - id: ch02-b09
          speaker: divine_lady
          text: 马上出发，别回去向母亲告别。这件事不能耽搁。飞鞋认得去灰姐妹那里的路。
        - id: ch02-b10
          speaker: narrator
          text: 男孩谢过女子，把飞鞋牢牢系好。可他刚转身要向两人道别，青年和女子已经消失得无影无踪。他不知道他们怎样走的，也不知道去了哪里。男孩跃到空中试了试，飞鞋立刻载着他飞得比风还快。他掠过温暖的碧海和南方幸福的国土，又越过北方逐水草而居的人们。那里的人喝马奶，住在巨大的车屋里，赶着畜群四处迁徙。他飞过宽阔的大河，水鸟受惊，纷纷从河面腾起。他继续越过平原、寒冷的北海、雪原和冰山，终于到了世界尽头。那里所有的水都冻成了冰，没有人，没有走兽，也不见一根青草。
        - id: ch02-b11
          speaker: narrator
          text: 三位灰姐妹住在一座蓝色冰洞里。她们比世间一切生灵都古老，头发像雪一样白，皮肤则是冰冷的蓝色。三个人仿佛还在梦里，一边含混地嘟囔，一边慢慢点头。她们呼出的气立刻冻结，化作云雾笼罩在身边。冰洞入口十分狭窄，要从中穿过，又不碰到任何一个姐妹，实在很难。男孩靠飞鞋悬在空中，好不容易才悄悄溜进去。他藏在一旁，等着拿眼睛的姐妹开口。
        - id: ch02-b12
          speaker: gray_sister_1
          text: 姐姐，你看见什么了？往日的时光回来了吗？
        - id: ch02-b13
          speaker: gray_sister_2
          text: 没有，姐姐。
        - id: ch02-b14
          speaker: gray_sister_1
          text: 把眼睛递给我吧。也许我能看得更远。
        - id: ch02-b15
          speaker: narrator
          text: 一只手递出眼睛，另一只手正四处摸索，男孩突然伸手，把独眼抢走了。
        - id: ch02-b16
          speaker: gray_sister_2
          text: 姐姐，眼睛呢？
        - id: ch02-b17
          speaker: gray_sister_1
          text: 不是你自己拿去了吗？
        - id: ch02-b18
          speaker: gray_sister_3
          text: 姐姐，你把它弄丢了吗？难道我们再也找不到眼睛，再也看不见往日的时光回来了吗？
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: 男孩从三姐妹身后溜走，出了寒冷的冰洞，飞到空中放声大笑。三姐妹一听见笑声，就明白有陌生人抢走了眼睛，而她们毫无办法，只能一起哭起来。泪珠从没有眼睛的空洞里滑落，刚掉下来便冻得坚硬，叮叮当当地砸在洞中冰地上。她们苦苦哀求男孩把眼睛还来，那副模样实在可怜，连男孩也忍不住心软。可他没有忘记来意，坚持说，不先告诉他花园三仙女的去处，眼睛就永远不会归还。
        - id: ch02-b20
          speaker: narrator
          text: 三姐妹悲惨地绞着双手。她们已经猜到男孩为何而来，也知道他要去夺取可怕的头颅。那三个可怕的女人原是她们的亲族，要她们指路，实在十分为难。可独眼还在男孩手里，她们最后只得说出方向。一直朝南飞，把陆地放在左边，把大海放在右边，便能抵达花园三仙女的小岛。男孩依约归还眼睛。灰姐妹重新向外眺望，等待往日的时光回来，他则沿着海岸一路向南飞去。
    - id: ch03
      title: 金苹果树与可怕的头颅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一座开满鲜花的岛屿终于出现。绿衣、白衣和红衣的三位仙女围着一棵金苹果树，神情庄重地边舞边唱。
        - id: ch03-b02
          speakers: [garden_fairy_green, garden_fairy_white, garden_fairy_red]
          ensemble: chorus
          text: “绕着金苹果，一圈又一圈，我们自古便围着魔法树舞蹈。一圈又一圈，只要春色仍青，溪流不息，海风依旧掀起波涛！”
        - id: ch03-b03
          speakers: [garden_fairy_green, garden_fairy_white, garden_fairy_red]
          ensemble: chorus
          text: “黄金般的新时代尚未来临，谁也不能尝金色果实。多少树木将抽枝长成，多少花朵将从根部凋零，多少歌声和鲁特琴将归于沉寂，新时代才会来临！”
        - id: ch03-b04
          speakers: [garden_fairy_green, garden_fairy_white, garden_fairy_red]
          ensemble: chorus
          text: “绕着金树，一圈又一圈。古老的世界也这样旋转，有夏与冬，有火与严寒，有唱过的歌，有讲过的故事，仿佛我们的舞步收拢又舒展，永远绕着仙树的枝干！”
        - id: ch03-b05
          speaker: narrator
          text: 这些庄重起舞的仙女与灰姐妹截然不同。她们见到男孩十分欢喜，亲切地问他为何远道而来。听说他要寻找利剑和隐身帽，她们立刻把两件宝物送给他，另外还给了他一只皮囊和一面光亮的盾牌。她们把钻石剑刃的利剑系在男孩腰间，又亲手为他戴上隐身帽。帽子一落到头上，连三位仙女也看不见他了。男孩把帽子摘下，三位仙女分别亲吻他，祝他一路好运，随后又围着金树开始永恒的舞蹈。守护这棵树，直到新时代来到，或是整个世界终结，正是她们的职责。
        - id: ch03-b06
          speaker: narrator
          text: 男孩戴上隐身帽，把皮囊系在腰间，又把闪亮的盾牌背到肩上。他飞出小岛，越过那条像巨蛇一样盘绕整个世界的大河。三个可怕的女人就在河岸边一棵白杨树下沉睡，死去的白杨叶铺满四周。她们收拢金色翅膀，交叠着青铜利爪。两个姐姐睡得像鸟一样，把狰狞的脑袋埋在翅膀下面。她们发间的毒蛇却还醒着，从金色羽毛底下探出身子，不停地扭动。
        - id: ch03-b07
          speaker: narrator
          text: 最小的妹妹仰卧在中间，美丽而忧伤的脸朝着天空，睡梦中仍睁着双眼。那张脸恐怖得令人怜悯，谁看见都会变成石头。男孩不去直视，只把光亮的盾牌当作镜子，看着盾中的倒影，一步步倒着靠近。
        - id: ch03-b08
          speaker: narrator
          text: 男孩一寸寸靠近，直到估摸着已经走进利剑所及之处。他始终背对那个女人，只凭盾中的倒影猜准方向，拔剑反手一挥。利剑只砍一下，头颅便离开了身体。鲜血猛地喷出，像重拳一样打在他身上。男孩赶紧把头颅塞进皮囊，连身后也不敢看，立刻飞走。两个姐姐从梦中惊醒，像巨鸟般冲上天空。她们看不见戴着隐身帽的男孩，就迎着风嗅他的气味，一路钻入云层追赶，如同猎犬在树林里追踪猎物。
        - id: ch03-b09
          speaker: dread_sister_1
          text: 在这里！他在这里！
          emotion: angry
        - id: ch03-b10
          speaker: dread_sister_2
          text: 不，在那边！他往那边逃了！
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 金翅膀在男孩身后咔啦作响，尖叫声近得吓人。可是飞鞋更快。等他越过环绕世界的大河，那些叫喊和翅膀声终于远远消散。
    - id: ch04
      title: 海边的公主
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男孩朝东飞去，寻找故乡。他低头看见海岸上锁着一个姑娘。海水涨到最高处的地方立着木桩，铁链捆住姑娘的腰。她吓得或是累得再也站不住，全靠铁链吊在那里，像是已经死了。
        - id: ch04-b02
          speaker: narrator
          text: 男孩十分怜悯她，便飞落到身边。他一开口，姑娘立刻抬头四处寻找，却被这个看不见的声音吓得更加厉害。男孩这才想起自己还戴着隐身帽，连忙把它摘下来。一个英俊的青年顿时出现在眼前。姑娘一生中从未见过这样的人。他有短短的金色卷发、蓝眼睛，还有一张带着笑意的脸。男孩望着她，也觉得自己面对的是世上最美的姑娘。
        - id: ch04-b03
          speaker: narrator
          text: 男孩先挥动利剑，一下斩断捆住姑娘的铁链，又问她为何被绑在这里，人们为什么这样残酷地对待她。姑娘说，自己是这个国家的公主。海里有一头怪兽，每天都要上岸吞吃一个姑娘，人们只好抽签决定牺牲谁，而这一次偏偏抽中了她。她的话还没有说完，翻滚的海浪里突然探出一颗狭长凶恶的脑袋，张开大嘴，朝姑娘猛咬过来。
        - id: ch04-b04
          speaker: narrator
          text: 海怪实在太贪婪，冲得也太急，第一口竟然没有咬中。还没等它沉入水中重新蓄力，男孩已经飞快地打开皮囊，取出可怕的头颅，高高举在手里。海怪第二次跃出海面，双眼正好落在那张脸上。只在一瞬之间，它庞大的身体便化成了石头。直到今天，那头石海怪仍留在海岸上。
        - id: ch04-b05
          speaker: narrator
          text: 男孩陪公主回到她父亲的王宫。宫里人人本在为她的死哭泣，如今看见公主平安走进来，简直不敢相信自己的眼睛。国王和王后把男孩当作最尊贵的客人，百般疼爱这位救命恩人。等他们发现男孩想娶自己的女儿，更是欢喜得无法自持。两人在最盛大的庆典中成婚，整个宫廷为他们欢庆。婚后，他们又在那里住了一段日子。
        - id: ch04-b06
          speaker: narrator
          text: 新郎不能抱着新娘在天上飞，于是他们决定乘船回国。临行前，男孩带着飞鞋、隐身帽和利剑来到山中僻静处，把宝物留在那里。当初海边帮助他上路的一男一女，后来果然取回了它们。
    - id: ch05
      title: 预言应验
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一切办妥后，男孩和新娘启程回家。他们的船驶入故国港口，两人上岸走进城中，竟在街上迎面撞见他的母亲拼命逃命。那个邪恶的国王手持长剑，就追在她身后。公主从前便不喜欢这个国王。国王害她的儿子突然失踪以后，她更认定儿子已经遭他暗中杀害，越发憎恨他，也永远不肯嫁给他。如今，国王恼羞成怒，竟连她也要杀死。
        - id: ch05-b02
          speaker: narrator
          text: 公主一下跑进儿子怀里。男孩只来得及亲吻母亲，挡到她身前，国王的剑已经劈下。他举盾接住这一击，迎着国王高声喊道。
        - id: ch05-b03
          speaker: boy
          text: 我发誓把可怕的头颅带给你。现在你就看看，我有没有守住誓言！
        - id: ch05-b04
          speaker: narrator
          text: 男孩取出头颅。国王只看了一眼，马上化成石头，长剑仍高高举在手中。百姓欢呼起来，请男孩做他们的新王。他却说，自己必须送母亲回外祖父的家。于是众人推举当年从木箱里救出公主、善待母子二人的那个岛民为王。
        - id: ch05-b05
          speaker: narrator
          text: 不久，男孩带着母亲和妻子扬帆起航，前往母亲当年遭到残酷驱逐的故国。途中，他们在另一位国王的宫廷停留。那里恰好举行竞技会，要给最出色的赛跑者、拳手和掷铁饼者颁发奖品。男孩看见众人比试，也想下场较量自己的力气。他拿起铁饼，奋力一掷，竟飞得比过去任何人掷出的都远。可铁饼越过赛场，落进围观的人群，击中一个人，那人当场死去。
        - id: ch05-b06
          speaker: narrator
          text: 死者不是别人，正是男孩的外祖父。他一心害怕预言实现，为了躲开外孙，早已从自己的国家逃了出来。可到头来，他还是因为自己的怯懦和一场偶然丢了性命。先知的话终于应验。男孩带着妻子和母亲回到本该属于他们的王国。历尽这一切苦难以后，他们终于长久而幸福地生活下去。
