audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    snow_white:
      display_name: 白雪
      tts: {delivery: 安静温柔，真诚坚定, timbre: 柔和清亮, pace: 稍慢, pitch: 中高音}
    rose_red:
      display_name: 红玫
      tts: {delivery: 活泼爽朗，热心直率, timbre: 明亮稚嫩, pace: 中等稍快, pitch: 高音}
    mother:
      display_name: 母亲
      tts: {delivery: 慈爱稳重，说话朴实, timbre: 温暖成熟, pace: 舒缓, pitch: 中音}
    bear_prince:
      display_name: 熊与王子
      tts: {delivery: 善良宽厚，恢复人身后庄重坦诚, timbre: 深厚温和, pace: 中等偏慢, pitch: 中低音}
    dwarf:
      display_name: 侏儒
      tts: {delivery: 暴躁尖刻，贪婪又忘恩负义, timbre: 尖细干涩, pace: 急促, pitch: 高音}
  chapters:
    - id: ch01
      title: 两株玫瑰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷寡妇住在一间小屋里。屋前的花园里长着两株玫瑰，一株开白花，一株开红花。她的两个女儿也像这两株花，一个叫白雪，一个叫红玫。姐妹俩善良又勤快，天天都很快活。白雪更安静温柔，喜欢留在家里陪母亲，帮忙做家务，闲下来就读书给她听。红玫却爱在田野和草地上奔跑，采花，捉蝴蝶。
        - id: ch01-b02
          speaker: narrator
          text: 两个孩子感情极好，只要一起出门，总会牵着彼此的手。
        - id: ch01-b03
          speaker: snow_white
          text: 我们永远都不要离开对方。
        - id: ch01-b04
          speaker: rose_red
          text: 嗯，只要我们活着，就永远不分开。
        - id: ch01-b05
          speaker: mother
          text: 你们不管谁得了好东西，都要分给另一个。
        - id: ch01-b06
          speaker: narrator
          text: 她们常到树林里采野莓。那里的动物不但不伤害她们，反而放心地来到身边。小野兔从她们手里吃卷心菜叶，母鹿挨着她们吃草，雄鹿欢快地跃过，鸟儿则留在枝头，尽情为她们歌唱。
        - id: ch01-b07
          speaker: narrator
          text: 姐妹俩从没遇到过灾祸。有时她们在林中流连得太晚，夜色追了上来，就一起躺在柔软的苔藓上，一觉睡到早晨。母亲知道她们不会有事，从来不担心。有一回，她们又在树林里过了一夜。清晨的阳光把她们唤醒时，身旁竟坐着一个美丽的孩子，穿着闪闪发亮的白袍。那孩子站起来，亲切地看了她们一眼，一句话也没说，转身便消失在树林深处。
        - id: ch01-b08
          speaker: narrator
          text: 她们环顾四周，这才看清自己睡在悬崖边。昨夜如果在黑暗里再多走几步，就一定会从那陡峭的崖边掉下去。回家以后，姐妹俩把这件奇事从头到尾告诉了母亲。
        - id: ch01-b09
          speaker: mother
          text: 你们看见的，一定是守护好孩子的天使。
        - id: ch01-b10
          speaker: narrator
          text: 白雪和红玫把小屋收拾得干净整齐，谁走进来都会觉得舒服。夏天由红玫照管屋子。每天母亲醒来以前，她都会在床前放一束鲜花，其中一朵白玫瑰，一朵红玫瑰。冬天由白雪生火烧水。黄铜水壶被擦得锃亮，像金子一样闪光。
        - id: ch01-b11
          speaker: mother
          text: 白雪，雪下起来了，去把百叶窗关好吧。
        - id: ch01-b12
          speaker: narrator
          text: 窗子关好，一家人就围坐在炉火边。母亲戴着眼镜，从厚厚的大书里读故事，两个女孩一边听，一边纺线。脚边卧着一只小羊羔，身后还停着一只小白鸽，脑袋埋在翅膀底下。
    - id: ch02
      title: 炉火旁的黑朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天晚上，一家人正暖融融地坐在一起，忽然有人敲门，像是想进来。
        - id: ch02-b02
          speaker: mother
          text: 红玫，快去开门。一定是有旅人想借宿。
        - id: ch02-b03
          speaker: narrator
          text: 红玫赶紧抽开门闩。她以为黑暗中站着一个穷人，谁知一颗毛茸茸的黑脑袋探了进来。门外竟是一头熊！红玫尖叫着向后跳，羊羔咩咩直叫，鸽子扑打翅膀，白雪也躲到了母亲的床后。
        - id: ch02-b04
          speaker: bear_prince
          text: 别怕，我不会伤害你们。我已经快冻僵了，只想在这里暖和一会儿。
          emotion: calm
        - id: ch02-b05
          speaker: mother
          text: 可怜的熊，到火边躺下吧，只要别烧着你的皮毛。白雪，红玫，你们也出来。他不会伤害你们，是个善良老实的好家伙。
          emotion: calm
        - id: ch02-b06
          speaker: narrator
          text: 姐妹俩从藏身处走了出来。羊羔和鸽子也慢慢靠近，大家很快就不害怕了。熊请孩子们拍掉他身上的雪，她们便拿来刷子，把他的皮毛刷得干干爽爽。大熊舒舒服服地躺到炉火前，快活地低声哼哼。
        - id: ch02-b07
          speaker: narrator
          text: 孩子们跟他熟起来以后，可把这位客人折腾得不轻。她们扯他的毛，把小脚踩在他背上，推得他滚来滚去，还拿榛树枝抽他。熊一吼，她们反而哈哈大笑。他一直好脾气地由着她们，只有闹得太过火时才求饶。
        - id: ch02-b08
          speaker: bear_prince
          text: 哎呀，孩子们，饶我一命吧！白雪呀，红玫呀，别把心上人打死啦！
        - id: ch02-b09
          speaker: narrator
          text: 到了睡觉的时候，其他人都上床了，母亲让熊留在炉边，好躲过外面的寒冷和雨雪。天刚亮，孩子们就领他出门，看着他踏过白雪，小跑进森林。从此以后，熊每天傍晚都在同一个时候回来，躺在炉边，任孩子们想怎么跟他玩闹都行。她们早已习惯了这位黑朋友，每晚总要等他露面，才肯关上大门。
        - id: ch02-b10
          speaker: narrator
          text: 春天来了，屋外处处变绿。一天早晨，熊对白雪说，他必须离开，整个夏天都不能再回来。
        - id: ch02-b11
          speaker: snow_white
          text: 亲爱的熊，你要去哪儿？
          emotion: sad
        - id: ch02-b12
          speaker: bear_prince
          text: 我要进森林看守财宝，免得被恶毒的侏儒偷走。冬天地面冻得很硬，他们只能待在地底下。现在阳光把泥土晒暖了，他们就会钻出来四处窥探，见什么偷什么。东西一旦进了他们的洞穴，就很难再找回来。
        - id: ch02-b13
          speaker: narrator
          text: 听说朋友整个夏天都不回来，白雪十分难过。她替熊抽开门闩。熊迈出门时，一小撮皮毛钩在了门环上，白雪好像看见毛皮底下闪过一道金光，可又不敢肯定。熊匆匆跑远，很快便消失在一排树木后面。
    - id: ch03
      title: 夹在树缝里的胡子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，母亲让姐妹俩进森林捡柴。她们走到一棵倒下的大树旁，看见长草里有个东西不停地跳，却看不清是什么。走近一瞧，原来是个干瘪脸的侏儒，胡子足足有一码长。胡须末端夹在树缝里，他像拴着链子的狗一样来回蹦，却不知道怎样脱身。小矮人用火红的眼睛瞪着她们。
        - id: ch03-b02
          speaker: dwarf
          text: 你们还愣在那里干什么？就不能过来帮忙吗？
          emotion: angry
        - id: ch03-b03
          speaker: rose_red
          text: 小矮人，你这是在做什么呀？
        - id: ch03-b04
          speaker: dwarf
          text: 你这只又蠢又多嘴的呆鹅！我劈树是为了弄些小木片，好给厨房生火。像你们这种粗俗贪吃的家伙，才需要烧那些粗木柴。我们吃得少，大火只会把饭烧焦。我本来已经把楔子打进去了，可这该死的木头太滑，楔子一下弹了出来。树缝合得太快，我漂亮的白胡子没来得及抽走，就被夹住了。你们两个脸蛋光溜溜的笨丫头，还只会站着笑！呸，真是坏东西！
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 两个孩子用尽力气，可胡须夹得太牢，怎么拔也拔不出来。
        - id: ch03-b06
          speaker: rose_red
          text: 我去叫个人来帮忙。
        - id: ch03-b07
          speaker: dwarf
          text: 疯疯癫癫的笨蛋！你们两个已经够多了，还叫别人做什么？就想不到别的办法吗？
          emotion: angry
        - id: ch03-b08
          speaker: snow_white
          text: 别急，我会让你脱身的。
          emotion: calm
        - id: ch03-b09
          speaker: narrator
          text: 白雪从口袋里拿出剪刀，剪掉了胡须末梢。侏儒一发现自己自由了，立刻抓住藏在树根间的一袋金币，把沉甸甸的袋子提了起来。
        - id: ch03-b10
          speaker: dwarf
          text: 这些粗野的坏东西，竟敢剪掉我漂亮的胡子！
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: 他把袋子甩到背上，连看也没再看两个孩子一眼，就这样走了。
    - id: ch04
      title: 溪边与荒原
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不久以后，白雪和红玫出去捉鱼。快到溪边时，她们看见一个东西像只巨大的蚱蜢，一蹦一跳地朝水边挪，仿佛要投进溪里。姐妹俩跑过去，发现又是那个侏儒。
        - id: ch04-b02
          speaker: rose_red
          text: 你要去哪儿？不会真想跳进水里吧？
        - id: ch04-b03
          speaker: dwarf
          text: 我才没那么蠢！你看不见那条该死的鱼正要把我拖下水吗？
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 原来，侏儒坐在岸边钓鱼，一阵风却把他的胡须缠进钓线。紧接着，一条大鱼咬了钩。这个虚弱的小家伙哪有力气把它拉上岸？反倒是鱼占了上风，把他一点点拖向水边。他拼命抓住沿途每一根芦苇、每一片草叶，还是没有多大用处。鱼儿往哪儿游，他就得跟着往哪儿挪，眼看就要被拽进水里。
        - id: ch04-b05
          speaker: narrator
          text: 女孩们及时拉住了他，又想把胡须从钓线上解开。可胡须和线已经缠成死结，她们只好拿出剪刀，再剪掉一小截胡子。
        - id: ch04-b06
          speaker: dwarf
          text: 你们这些毒蘑菇，这也叫有礼貌吗？你们先前剪短我的胡子还不够，现在又把最好的一截剪掉！我还怎么回去见自己人？真恨不得你们早就滚到耶利哥去了！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 侏儒从芦苇丛里拖出一袋珍珠，什么也没再说，拉着袋子消失在石头后面。
        - id: ch04-b08
          speaker: narrator
          text: 又过了不久，母亲让两个女孩进城购买针、线、花边和缎带。她们穿过一片散落着巨石的荒原，看见一只大鸟在空中盘旋，越飞越低，最后落在不远处的岩石上。紧接着，前方传来一声尖叫。姐妹俩跑过去，惊恐地看见一只鹰抓住了侏儒，正要把他带走。
        - id: ch04-b09
          speaker: narrator
          text: 两个心地善良的孩子一人一边，紧紧抓住小矮人，不肯让老鹰把他带走。她们跟那只大鸟争夺了许久，老鹰终于松开了猎物。侏儒落回地上，刚从最初的惊吓中缓过来，立刻又扯开尖细的嗓子，朝救命恩人嚷嚷。
        - id: ch04-b10
          speaker: dwarf
          text: 你们就不会轻一点吗？我这件薄外套全被扯碎了！两个又笨又没用的粗丫头！
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 他拿起一袋宝石，钻进岩石下的洞穴，转眼没了踪影。女孩们早已习惯他的忘恩负义，照旧赶路，进城办完该办的事情。回家时，她们又经过那片荒原，正撞见侏儒把宝石倒在一块空地上。他原以为天色这么晚，不会再有人从这里经过。夕阳照在晶莹的宝石上，映出一道道闪烁的光，美得让两个孩子停下脚步，看出了神。
        - id: ch04-b12
          speaker: dwarf
          text: 你们张着嘴站在那里干什么？
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: 侏儒灰白的脸气得通红。他刚要离开，忽然响起一声低吼，一头黑熊从树林里跑了出来。侏儒吓得跳起来，还没来得及逃进藏身处，熊已经来到面前。
        - id: ch04-b14
          speaker: dwarf
          text: 亲爱的熊先生，饶了我吧！我把财宝都给你。你看，地上这些宝石多漂亮。吃我这么个又小又弱的家伙有什么意思？我连你的牙缝都塞不满。你去抓那两个坏女孩吧！她们又嫩又肥，像小鹌鹑一样。求求你，把她们吃掉吧！
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: 熊根本不听侏儒的话，也没有朝两个女孩走去。他只挥起爪子，重重打了这个邪恶的小东西一下。侏儒倒在地上，从此再也不动了。
    - id: ch05
      title: 金衣王子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 两个女孩早已跑开，熊却在身后叫住她们。
        - id: ch05-b02
          speaker: bear_prince
          text: 白雪，红玫，别怕！等一等，让我和你们一起走。
          emotion: calm
        - id: ch05-b03
          speaker: narrator
          text: 姐妹俩认出了他的声音，便停住脚步。熊走到近前，身上的皮忽然落了下来。站在她们面前的，竟是一位英俊的男子，浑身穿戴着金衣金饰。
        - id: ch05-b04
          speaker: bear_prince
          text: 我是国王的儿子。那个邪恶的侏儒偷了我的财宝，又给我下了诅咒，让我变成野熊，在森林里四处游荡。只有等他死去，我才能恢复自由。现在，他终于得到了应有的惩罚。
        - id: ch05-b05
          speaker: narrator
          text: 后来，白雪嫁给了王子，红玫嫁给了王子的弟弟。他们把侏儒藏在洞穴里的大批财宝取了出来，分成了两份。老母亲也和孩子们住在一起，安宁地生活了许多年。她搬家时没有忘记小屋前的两株玫瑰，把它们一同带走，重新种在自己的窗前。此后每一年，一株花树都会开出最美丽的白玫瑰，另一株则开出最美丽的红玫瑰。
        - id: ch05-b06
          speaker: narrator
          text: 这个故事来自格林童话。
