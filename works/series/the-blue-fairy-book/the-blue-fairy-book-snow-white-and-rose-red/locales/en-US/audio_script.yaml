  chapters:
    - id: ch01
      title: The Two Rose Trees
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A poor widow lived in a little cottage with a garden in front. Two rose trees grew there. One bore white roses, and the other bore red. The widow had two daughters who were like those trees. One was called Snow-white, and the other Rose-red. Both were diligent, cheerful, and kind. Snow-white was the quieter and gentler sister. Rose-red loved running through fields and meadows, picking flowers and chasing butterflies. Snow-white preferred staying beside her mother, helping with the housework or reading aloud when the work was done.
        - id: ch01-b02
          speaker: narrator
          text: The sisters loved each other dearly and went hand in hand whenever they left the cottage together. Neither wished to go anywhere without the other. Snow-white often made her sister a promise.
        - id: ch01-b03
          speaker: snow_white
          text: We will always stay together.
        - id: ch01-b04
          speaker: rose_red
          text: Yes. We will, for as long as we live.
        - id: ch01-b05
          speaker: mother
          text: And whatever one of you receives, you must share with the other.
        - id: ch01-b06
          speaker: narrator
          text: They often wandered through the woods to gather berries. No animal ever tried to harm them. The creatures trusted the two sisters and came near without fear. A little hare ate cabbage leaves straight from their hands. Deer grazed quietly beside them, a stag bounded merrily past, and birds stayed on the branches and sang to the girls with all their might.
        - id: ch01-b07
          speaker: narrator
          text: Even when they stayed too long and night found them deep in the woods, nothing bad happened. They lay down together on the moss and slept until morning. Their mother knew they were safe and never worried about them. One morning, after the rising sun woke them, they saw a beautiful child in a shining white robe sitting close beside them. The child stood, looked at them kindly, and disappeared among the trees without a word.
        - id: ch01-b08
          speaker: narrator
          text: Then the sisters looked around. They had slept very near a precipice. A few more steps in the darkness would have sent them over the edge. When they came home and told their mother, she knew what the shining child must have been.
        - id: ch01-b09
          speaker: mother
          text: That was surely the angel who watches over good children.
        - id: ch01-b10
          speaker: narrator
          text: Snow-white and Rose-red kept their mother's cottage so beautifully clean and neat that entering it was a pleasure. In summer, Rose-red cared for the house. Every morning, before her mother woke, she gathered a bunch of flowers and placed it beside the bed. She always included two special blooms, one from the white rose tree and one from the red. In winter, Snow-white lit the fire and set the polished brass kettle over it. The kettle was kept so bright that it gleamed like gold.
        - id: ch01-b11
          speaker: narrator
          text: On snowy evenings, their mother had Snow-white close the shutters. Then the three of them gathered by the fire. Their mother put on her spectacles and read from a large book while the girls listened and spun. A little lamb lay beside them, and a white dove perched nearby with its head tucked beneath its wings.
    - id: ch02
      title: The Winter Guest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One evening, as they sat together in this cozy way, someone knocked at the door. It sounded like a traveler asking to come in.
        - id: ch02-b02
          speaker: mother
          text: Rose-red, open the door quickly. Someone must be looking for shelter.
        - id: ch02-b03
          speaker: narrator
          text: Rose-red hurried to lift the bar. In the darkness, she thought a poor man was waiting outside. Then a thick black head pushed through the doorway. It belonged to a bear. Rose-red screamed and sprang back. The lamb bleated, the dove beat its wings, and Snow-white hid behind her mother's bed.
        - id: ch02-b04
          speaker: bear
          text: Please don't be frightened. I won't hurt you. I'm half frozen, and I only want to warm myself for a little while.
        - id: ch02-b05
          speaker: mother
          text: Poor bear. Lie down beside the fire, but mind that you don't burn your fur.
        - id: ch02-b06
          speaker: mother
          text: Snow-white, Rose-red, you may come out now. This bear means no harm. He is a good, honest creature.
        - id: ch02-b07
          speaker: narrator
          text: The girls came from their hiding places. Soon the lamb and dove crept closer too, and everyone forgot to be afraid. The bear asked the children to knock the snow from his coat. They brought a brush and scrubbed him until he was dry. Then he stretched before the fire and growled with comfort.
        - id: ch02-b08
          speaker: narrator
          text: Before long, the girls were completely at ease with him, and they gave their helpless guest no peace. They pulled his fur with their hands, planted their small feet on his back, and rolled him from side to side. Sometimes they took a hazel switch and beat him with it. Whenever he growled, they only laughed. The bear bore every prank with the best good nature. Only when their games grew too rough did he protest.
        - id: ch02-b09
          speaker: bear
          text: Oh, children, spare my life! Snow-white and Rose-red, don't beat your lover dead!
        - id: ch02-b10
          speaker: narrator
          text: When bedtime came, the others went to their rooms, but the mother let the bear stay.
        - id: ch02-b11
          speaker: mother
          text: Sleep there on the hearth tonight. It will keep you safe from the cold and wet.
        - id: ch02-b12
          speaker: narrator
          text: As soon as day broke, the girls led him outside, and he trotted over the snow into the woods. After that, he returned at the same hour every evening. He settled down beside the hearth and let the children play all the tricks they pleased. The family became so used to their black friend that they never shut the cottage door until he had appeared.
        - id: ch02-b13
          speaker: narrator
          text: Spring came, and the world outside turned green. One morning, the bear told Snow-white that he must leave and would not return all summer.
        - id: ch02-b14
          speaker: snow_white
          text: Where are you going, dear bear?
        - id: ch02-b15
          speaker: bear
          text: I must guard my treasure in the woods against wicked dwarfs. All winter, the frozen earth keeps them underground. Now the sun has warmed the soil, they can break through, spy out the land, and steal whatever they find. Once anything reaches their caves, it is very hard to bring it back into the light.
        - id: ch02-b16
          speaker: narrator
          text: Snow-white was deeply sad to lose her friend. As she unbarred the door, the bear stepped outside and caught a tuft of fur on the metal knocker. For one moment, she thought she saw bright gold glittering beneath his black coat, though she could not be certain. The bear hurried away from the cottage and soon vanished behind the trees.
    - id: ch03
      title: The Dwarf's Beard
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Not long afterward, the mother sent her daughters into the woods to gather firewood. They found a large fallen tree. Something on its trunk was jumping up and down among the tall grass. As they drew near, they saw a dwarf with a wrinkled face and a beard a yard long. The end of his beard was pinched inside a split in the tree. He leaped about like a dog on a chain, unable to free himself. His fiery red eyes glared at the girls.
        - id: ch03-b02
          speaker: dwarf
          text: Why are you standing there? Come and help me!
          emotion: angry
        - id: ch03-b03
          speaker: rose_red
          text: How did you get caught there, little man?
        - id: ch03-b04
          speaker: dwarf
          text: What a stupid question! I was splitting the tree into small chips for our cooking fire. Great thick logs suit coarse, greedy people like you, but they burn up all the little food we need. I drove in my wedge, and everything was going well. Then the slippery thing sprang out. The tree snapped shut before I could pull out my beautiful white beard. Now I'm trapped, and you silly, smooth-faced girls only stand there laughing. Ugh! You're useless!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: The children pulled with all their strength, but the beard was wedged too tightly.
        - id: ch03-b06
          speaker: rose_red
          text: I'll run and bring someone else to help.
        - id: ch03-b07
          speaker: dwarf
          text: You crazy blockheads! Why call anyone else? There are already two too many of you. Can't you think of anything better?
          emotion: angry
        - id: ch03-b08
          speaker: snow_white
          text: Be patient. I know how to set you free.
        - id: ch03-b09
          speaker: narrator
          text: Snow-white took the scissors from her pocket and cut away the trapped end of his beard. The instant he was free, the dwarf pulled a bag of gold from among the tree roots.
        - id: ch03-b10
          speaker: dwarf
          text: Rude wretches! You cut off part of my splendid beard!
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: He slung the bag over his back and disappeared without even looking at the children again.
        - id: ch03-b12
          speaker: narrator
          text: Soon afterward, Snow-white and Rose-red went to catch some fish. Near the stream, they saw what looked like a giant grasshopper bouncing toward the water. They ran closer and recognized the dwarf.
        - id: ch03-b13
          speaker: rose_red
          text: Where are you going? You aren't trying to jump into the stream, are you?
        - id: ch03-b14
          speaker: dwarf
          text: Of course not, you fool! Can't you see that this wretched fish is pulling me in?
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: The dwarf had been fishing when the wind tangled his beard around the line. Then a large fish bit the hook. The little man was too weak to haul it out. Instead, the fish dragged him closer and closer to the stream. He clutched every reed and blade of grass he could reach, but he still had to follow each pull of the fish. He was in real danger of falling into the water.
        - id: ch03-b16
          speaker: narrator
          text: The girls reached him just in time and held him firmly. They worked together to loosen his beard from the fishing line, but line and hair were tangled beyond hope. The fish kept pulling while the dwarf struggled toward the water. Once again, the scissors were the only answer. The girls cut the knot away, and a small piece of his beard went with it.
        - id: ch03-b17
          speaker: dwarf
          text: Is that how you behave, you toadstools? First you shorten my beard, and now you cut off its finest part! How can I show my face among my own people? I wish you had gone far away before you ever found me!
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: The dwarf fetched a sack of pearls from among the reeds. Without another word, he dragged it behind a stone and vanished.
    - id: ch04
      title: The Eagle on the Heath
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon after that, their mother sent the girls to town for needles, thread, laces, and ribbons. Their road crossed a wide heath where enormous rocks lay scattered here and there. As they walked, a large bird circled above them. It turned slowly in the air and dropped lower each time, until at last it settled on a nearby rock. Then a sharp, piercing cry rang out.
        - id: ch04-b02
          speaker: narrator
          text: The sisters ran toward the sound and stared in horror. The eagle had pounced on the dwarf and was about to carry him away. Though he had treated them so badly, the tender-hearted girls would not abandon him. They grabbed hold of the little man and pulled while the eagle tried to rise. The struggle went on and on, until at last the bird released its prey.
        - id: ch04-b03
          speaker: narrator
          text: The dwarf recovered from his first shock and immediately began to shriek.
        - id: ch04-b04
          speaker: dwarf
          text: Couldn't you have handled me more carefully? You've torn my thin little coat to pieces, you useless, clumsy girls!
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: He picked up a bag of precious stones and slipped beneath the rocks into his cave. By now, the girls were used to his ingratitude and expected no thanks from him. They simply continued along the road, reached the town, and bought everything their mother needed.
        - id: ch04-b06
          speaker: narrator
          text: It was late when they crossed the heath on their way home. They surprised the dwarf in an open place, where he had poured all his precious stones onto the ground. He had chosen the late hour because he thought no one else would pass. The evening sunlight played across the stones. They flashed, glanced, and gleamed so beautifully that the sisters stood still and gazed at them.
        - id: ch04-b07
          speaker: dwarf
          text: What are you staring at?
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: His ash-gray face turned scarlet with rage, and he was about to hurry away with another angry insult. Before he could leave, a sudden growl sounded nearby. A black bear came trotting out of the woods. The frightened dwarf sprang to his feet and tried to reach his hiding place beneath the rocks, but the bear was already too close.
        - id: ch04-b09
          speaker: dwarf
          text: Dear Mr. Bear, please spare me! You may have all my treasure. Just look at those beautiful stones. What good would you get from eating a poor, weak little fellow like me? You wouldn't even feel me between your teeth. Take these two wicked girls instead. They're plump and tender as young quails. Please, eat them and let me go!
          emotion: fearful
        - id: ch04-b10
          speaker: narrator
          text: The bear ignored every word. With one blow of his paw, he struck the wicked dwarf, who never moved again.
    - id: ch05
      title: The Prince in Gold
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The girls had begun to run away, but the bear called after them.
        - id: ch05-b02
          speaker: bear
          text: Snow-white! Rose-red! Don't be afraid. Wait for me, and I'll go with you.
        - id: ch05-b03
          speaker: narrator
          text: They recognized his voice and stood still. When the bear reached them, his black skin suddenly fell away. Beside them stood a handsome man dressed from head to foot in gold.
        - id: ch05-b04
          speaker: prince
          text: I am a king's son. That wicked dwarf stole my treasure and put me under a spell. I had to wander through the woods as a wild bear until his death set me free. Now he has received the punishment he deserved.
        - id: ch05-b05
          speaker: narrator
          text: Snow-white married the prince, and Rose-red married his brother. The sisters divided between them all the treasure the dwarf had gathered in his cave. Their mother lived peacefully with her children for many years. She brought the two rose trees with her and planted them outside her window. Every year, they bore the finest white and red roses.
