audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    blue_beard:
      display_name: 青胡子
      tts: {delivery: 冷酷威严，命令不容置疑, timbre: 低沉厚重, pace: 缓慢有压迫感, pitch: 低音}
    wife:
      display_name: 青胡子的妻子
      tts: {delivery: 温柔克制，危急时愈发迫切, timbre: 年轻清亮, pace: 中等有变化, pitch: 中高音}
    sister_anne:
      display_name: 安妮姐姐
      tts: {delivery: 专注诚恳，危急中保持清楚, timbre: 明亮年轻, pace: 平稳, pitch: 中高音}
  chapters:
    - id: ch01
      title: 青胡子的绅士
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个人，城里和乡下都有华美的宅邸。家中金盘银盏数也数不清，家具蒙着锦绣，马车从头到尾镀满黄金。偏偏他生了一把蓝胡子，模样丑得吓人。女人和姑娘们一见他，就远远躲开。
        - id: ch01-b02
          speaker: narrator
          text: 附近住着一位贵妇，两个女儿都美貌绝伦。青胡子向她求亲，请她任选一个女儿嫁给自己。姐妹俩却你推我、我推你，谁也不肯答应。一想到要嫁给这个蓝胡子男人，她们就受不了。更让她们厌恶害怕的是，青胡子已经娶过好几任妻子，可那些女人后来去了哪里，从来没有人知道。
        - id: ch01-b03
          speaker: narrator
          text: 青胡子想讨她们欢心，就请姐妹俩、她们的母亲、三四位相熟的太太小姐，还有附近的年轻人，到他的乡间庄园住了整整一周。
        - id: ch01-b04
          speaker: narrator
          text: 那几天里，众人只管游乐。白天打猎、钓鱼、跳舞，尽情宴饮，夜里也不肯睡，只顾彼此说笑打趣。一切都那么称心如意。到了后来，小女儿竟觉得庄园主人的胡子好像也没那么蓝了，而且他实在是位殷勤有礼的绅士。
        - id: ch01-b05
          speaker: narrator
          text: 一行人刚回家，婚事就定了。大约一个月后，青胡子对新婚妻子说，他有极要紧的事务，必须到乡下去，至少六个星期才能回来。他不在时，妻子只管尽情玩乐。她可以把亲朋好友请到家中，也可以带她们去乡间。无论在哪里，都要好好设宴款待。
    - id: ch02
      title: 那把小钥匙
      blocks:
        - id: ch02-b01
          speaker: blue_beard
          text: 这些钥匙开两间大衣橱，我最好的家具都在里面。这些开金银器皿柜，那些东西平日不用。这几把开钱箱，金币银币都收在那里。这些是首饰匣的钥匙。还有这把总钥匙，家中所有房间都能打开。
        - id: ch02-b02
          speaker: blue_beard
          text: 你再看这把小钥匙。它开的是底层大长廊尽头那间小屋。别的门随你开，别的房间随你进，唯独那间小屋不许碰。你要是敢打开它，就等着承受我的怒火。
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 妻子答应一切照办。青胡子拥抱过她，便登上马车走了。
        - id: ch02-b04
          speaker: narrator
          text: 新婚的女主人还没来得及邀请，邻居和好友已经赶来了。她们早就急不可耐，想看看这座豪宅里的富丽陈设。只是青胡子实在吓人，他在家时谁也不敢登门。如今众人跑过一间又一间屋子，打开一只又一只壁橱和衣柜，只觉得后见到的总比先前的更精美、更富丽。
        - id: ch02-b05
          speaker: narrator
          text: 随后，大家又上楼去看最宽敞的两间大厅。那里摆着全宅最名贵的家具。壁毯、床榻、长椅、橱柜、台架和桌子，数量那么多，做工又那么美，让客人们赞叹不完。还有一面面能把人从头照到脚的大镜子。镜框有玻璃的，也有素银和镀金银制的。她们从未见过这样的气派。
        - id: ch02-b06
          speaker: narrator
          text: 大家一边称赞，一边羡慕朋友的好福气。可女主人对满屋珍宝毫无兴致，脑中只有楼下那间小屋。她越想越忍不住，好奇心不停催她。她连独自撇下客人有多失礼也忘了，沿隐蔽的小楼梯飞奔下去，急得两三次险些摔断脖子。
    - id: ch03
      title: 禁闭的小屋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 来到门前，她停了好一会儿。丈夫的禁令还在耳边，她也知道违命可能招来灾祸，可诱惑实在太强。她浑身发抖，还是用小钥匙打开了门。
        - id: ch03-b02
          speaker: narrator
          text: 窗户紧闭，屋里一片昏暗。起初，她什么也看不清。过了一会儿，眼睛才慢慢辨出屋里的景象。地面铺满凝结的鲜血，几个死去的女人横陈在血泊里，尸身沿墙排开。她们正是青胡子先后娶来，又逐一杀死的妻子。
        - id: ch03-b03
          speaker: narrator
          text: 她吓得几乎也要死去。她从锁孔里拔出小钥匙，钥匙却脱手掉在地上。等最初的惊骇稍稍过去，她才捡起钥匙，锁好房门，赶回楼上自己的卧房。她想在那里定一定神，可恐惧怎么也不肯离开。这时，她看见小屋的钥匙上沾着血。
        - id: ch03-b04
          speaker: narrator
          text: 她试着擦了两三遍，血迹纹丝不动。她又拿水清洗，甚至用肥皂和沙子使劲擦，仍旧洗不干净。原来这把钥匙中了魔法，她永远也不可能把它彻底擦净。一面的血迹才消失，另一面马上又会冒出来。
        - id: ch03-b05
          speaker: narrator
          text: 当天傍晚，青胡子竟然结束旅程，回到了家。他告诉妻子，自己还在路上时就收到了几封信。信上说，那桩叫他动身离家的要紧事务已经解决，而且结果对他十分有利。妻子竭尽全力装出欢喜的样子，想让他相信，她对丈夫这么快回来实在高兴极了。
        - id: ch03-b06
          speaker: narrator
          text: 第二天早晨，青胡子要回全部钥匙。妻子递过去时，手抖得厉害，他一眼就猜到出了什么事。
        - id: ch03-b07
          speaker: blue_beard
          text: 怎么，小屋的钥匙不在里面？
        - id: ch03-b08
          speaker: wife
          text: 我一定把它落在楼上的桌子上了。
        - id: ch03-b09
          speaker: blue_beard
          text: 立刻拿来，一刻也别耽搁。
        - id: ch03-b10
          speaker: narrator
          text: 她来来回回拖延了好几次，到底还是得交出钥匙。青胡子翻来覆去，仔细查看。
        - id: ch03-b11
          speaker: blue_beard
          text: 这上面怎么会有血？
        - id: ch03-b12
          speaker: wife
          text: 我不知道。
          emotion: fearful
        - id: ch03-b13
          speaker: narrator
          text: 可怜的女人脸色惨白，几乎和死人一样。
        - id: ch03-b14
          speaker: blue_beard
          text: 你不知道？我倒知道得清清楚楚。你早就打定主意，要进那间小屋，对不对？好极了，夫人。你也进去，跟里面那些太太待在一起吧。
          emotion: angry
    - id: ch04
      title: 塔楼上的等待
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 妻子听了，立刻扑倒在丈夫脚边，苦苦请求他饶恕自己。她的一言一行都带着真心的悔恨，还发誓从今以后再也不会违抗他。她那么美，又那么悲伤，连石头见了都会动心。可青胡子的心，比世上任何石头都硬。
        - id: ch04-b02
          speaker: blue_beard
          text: 夫人，你必须死。现在就死。
          emotion: angry
        - id: ch04-b03
          speaker: wife
          text: 既然我非死不可，请给我一点时间，让我向上帝祈祷。
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 她泪流满面地望着丈夫。
        - id: ch04-b05
          speaker: blue_beard
          text: 我给你七分半钟，一刻也不会多。
        - id: ch04-b06
          speaker: narrator
          text: 独自一人后，妻子高声叫来姐姐安妮。
        - id: ch04-b07
          speaker: wife
          text: 安妮姐姐，求你登上塔顶，看看我的哥哥们来了没有。他们答应今天来看我。要是看见他们，就赶紧打手势，叫他们快来。
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: 安妮姐姐登上塔顶。可怜的妻子每隔一会儿，就朝她喊。
        - id: ch04-b09
          speaker: wife
          text: 安妮姐姐，安妮姐姐，你看见有人来了吗？
          emotion: fearful
        - id: ch04-b10
          speaker: sister_anne
          text: 我只看见太阳照得尘土发亮，只看见青草一片碧绿。
        - id: ch04-b11
          speaker: narrator
          text: 这时，青胡子握着一柄大弯刀，在楼下扯开嗓子大吼。
        - id: ch04-b12
          speaker: blue_beard
          text: 马上下来，不然我就上去找你！
          emotion: angry
        - id: ch04-b13
          speaker: wife
          text: 求你再等一会儿。
        - id: ch04-b14
          speaker: narrator
          text: 她转头又压低声音呼唤姐姐。
        - id: ch04-b15
          speaker: wife
          text: 安妮姐姐，安妮姐姐，你看到有人来了吗？
          emotion: fearful
        - id: ch04-b16
          speaker: sister_anne
          text: 我只看见太阳照得尘土发亮，只看见青草一片碧绿。
        - id: ch04-b17
          speaker: blue_beard
          text: 快下来，不然我就上去了！
          emotion: angry
        - id: ch04-b18
          speaker: wife
          text: 我这就来。安妮姐姐，安妮姐姐，你还是没看见有人来吗？
          emotion: fearful
        - id: ch04-b19
          speaker: sister_anne
          text: 我看见远处扬起一大片尘土，正朝这边过来。
        - id: ch04-b20
          speaker: wife
          text: 是我的哥哥们吗？
        - id: ch04-b21
          speaker: sister_anne
          text: 唉，不是，我的好妹妹。那是一群羊。
        - id: ch04-b22
          speaker: blue_beard
          text: 你到底下不下来？
          emotion: angry
        - id: ch04-b23
          speaker: wife
          text: 再等一会儿。安妮姐姐，安妮姐姐，你还没看见人来吗？
          emotion: fearful
        - id: ch04-b24
          speaker: sister_anne
          text: 我看见两个骑马的人，可是他们还远得很。
        - id: ch04-b25
          speaker: wife
          text: 感谢上帝！他们是我的哥哥！我这就尽力打手势，叫他们赶快！
          emotion: happy
    - id: ch05
      title: 弯刀落下以前
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 青胡子又吼了一声，整座房子都震得发颤。绝望的妻子只好下楼。她披散着头发，泪流满面，又一次扑倒在丈夫脚边。
        - id: ch05-b02
          speaker: blue_beard
          text: 这样也没用。你非死不可。
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: 青胡子一手揪住她的头发，另一只手高高举起弯刀，眼看就要砍下她的脑袋。可怜的女人转过脸，用一双将死之人的眼睛望着他，求他再给自己一点点时间，好收一收心神。
        - id: ch05-b04
          speaker: blue_beard
          text: 不行。快把灵魂托付给上帝吧。
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: 他正要挥刀，大门上忽然响起震天的敲击声。青胡子猛地停了手。
    - id: ch06
      title: 两位骑士
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 大门打开，两个骑士立刻闯进来。他们拔出剑，直奔青胡子。青胡子认出那是妻子的两个哥哥，一个是龙骑兵，一个是火枪手，马上转身逃命。兄弟俩紧追不舍。他还没来得及跑到门廊的台阶前，便被两人追上。两柄剑刺穿他的身体，把他留在地上死去了。
        - id: ch06-b02
          speaker: narrator
          text: 青胡子的妻子也几乎和死去的丈夫一样，只剩半条命。她浑身无力，甚至站不起来迎接救了自己的两个哥哥。
        - id: ch06-b03
          speaker: narrator
          text: 青胡子没有继承人，于是妻子成了他全部财产的主人。她拿出一部分，让安妮姐姐嫁给一位爱慕她许久的年轻绅士。又拿出一部分，为两个哥哥买下军队里的上尉职位。剩下的成了她自己的嫁资。后来，她嫁给了一位品德高尚的绅士。和这位丈夫生活在一起，她终于忘却了与青胡子共同度过的苦难时光。
        - id: ch06-b04
          speaker: narrator
          text: 这个故事出自夏尔·佩罗。
