audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried
        timbre: clear and story-rich
        pace: measured
        pitch: medium
    blue_beard:
      display_name: Blue Beard
      tts:
        delivery: commanding and cold
        timbre: deep and heavy
        pace: deliberate
        pitch: low
    wife:
      display_name: Blue Beard's Wife
      tts:
        delivery: gentle and increasingly urgent
        timbre: clear and youthful
        pace: measured
        pitch: medium-high
    sister_anne:
      display_name: Sister Anne
      tts:
        delivery: attentive and earnest
        timbre: bright and youthful
        pace: steady
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Man with the Blue Beard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a man with fine houses in town and in the country. He owned piles of silver and gold plate, richly embroidered furniture, and coaches covered all over in gold. Yet one thing made him terribly unlucky. His beard was blue, and it made him look so frightening that every woman and girl ran away from him.
        - id: ch01-b02
          speaker: narrator
          text: A lady of quality lived nearby with her two beautiful daughters. The man asked to marry one of them and left their mother to choose which daughter it would be. Neither girl would have him. Each tried to send him to the other, for neither could bear the thought of marrying a man with a blue beard. Worse still, he had already had several wives, and no one knew what had become of them.
        - id: ch01-b03
          speaker: narrator
          text: Blue Beard hoped to win their affection. He invited the sisters, their mother, three or four ladies they knew, and some other young neighbors to spend a whole week at one of his country houses.
        - id: ch01-b04
          speaker: narrator
          text: The days were filled with hunting, fishing, dancing, feasts, and every kind of pleasure. At night, no one went to bed. They stayed up joking and teasing one another. Everything went so well that the younger daughter began to think the beard was not quite so very blue after all. Perhaps, she thought, its owner was a very civil gentleman.
        - id: ch01-b05
          speaker: narrator
          text: As soon as they returned home, the marriage was settled. The younger daughter became Blue Beard's wife, and the rich houses, splendid rooms, and frightening blue beard became part of her new life.
    - id: ch02
      title: The Little Key
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: About a month later, Blue Beard told his wife that important business would take him into the country for at least six weeks. While he was gone, he wanted her to enjoy herself. She could invite her friends, take them to the country if she liked, and feast wherever she went.
        - id: ch02-b02
          speaker: blue_beard
          text: Here are the keys to my two great wardrobes, where I keep my finest furniture. These keys open the cupboards that hold my silver and gold plate, the pieces we do not use every day. These open the strongboxes where I keep my money, and these belong to my jewel caskets. This master key opens every apartment in the house.
        - id: ch02-b03
          speaker: blue_beard
          text: But look at this little key. It opens the closet at the far end of the great gallery downstairs. You may unlock every other door and enter every other room, but I forbid you to open that closet. If you do, you may expect all the anger and punishment you deserve.
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: His wife promised to obey every part of his command. Blue Beard embraced her, climbed into his coach, and set out on his journey.
    - id: ch03
      title: The Forbidden Closet
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The bride's neighbors and good friends were so eager to see her splendid house that they did not wait for an invitation. They had never dared to visit while Blue Beard was home, because his blue beard frightened them. Now they hurried through room after room, opening closets and wardrobes. Each one seemed richer and finer than the last.
        - id: ch03-b02
          speaker: narrator
          text: Then they went upstairs to the two grandest rooms of all. There they admired beautiful tapestries, beds, couches, cabinets, stands, and tables. There were mirrors tall enough to show a person from head to foot. Some had glass frames. Others were framed in plain or gilded silver. No one had ever seen anything so magnificent.
        - id: ch03-b03
          speaker: narrator
          text: The visitors went on praising their friend's good fortune, and they could not help envying it. But while they stared at all those rich things, she took no pleasure in any of them. Her thoughts kept returning to the little key and the forbidden closet downstairs.
        - id: ch03-b04
          speaker: narrator
          text: Curiosity pressed her so hard that she forgot how rude it was to leave her guests. She slipped down a little back staircase in such a rush that two or three times she nearly broke her neck.
        - id: ch03-b05
          speaker: narrator
          text: At the closet door, she stopped. She remembered her husband's command and thought of what might happen if she disobeyed him. Still, the temptation was too strong. Trembling, she took out the little key and opened the door.
        - id: ch03-b06
          speaker: narrator
          text: At first she could see nothing, because the windows were shut. Then her eyes began to make out the room. The floor was covered in clotted blood. Against the walls lay the bodies of several dead women. They were the wives Blue Beard had married and murdered, one after another.
        - id: ch03-b07
          speaker: narrator
          text: She was so terrified that she thought she would die. The key slipped from the lock and fell from her hand.
        - id: ch03-b08
          speaker: narrator
          text: When the first shock had passed, she picked it up, locked the closet, and hurried upstairs to her chamber. She tried to recover, but her fear would not leave her. Then she noticed blood on the little key.
        - id: ch03-b09
          speaker: narrator
          text: She wiped it two or three times, but the stain would not come away. She washed the key, then scrubbed it with soap and sand. Still the blood remained. The key was magical, and she could never make it clean. Whenever the stain disappeared from one side, it came back on the other.
    - id: ch04
      title: Blue Beard Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Blue Beard came home that very evening, though he had said he would be away for at least six weeks. He told his wife that letters had reached him while he was still on the road. The important affair that had called him away was already settled in his favor. His wife did everything she could to convince him she was delighted by his quick return.
        - id: ch04-b02
          speaker: narrator
          text: The next morning, he asked for his keys. She handed them over with such a trembling hand that he guessed at once what had happened.
        - id: ch04-b03
          speaker: blue_beard
          text: What is this? The key to my closet is not here with the others.
        - id: ch04-b04
          speaker: wife
          text: I must have left it upstairs on the table.
        - id: ch04-b05
          speaker: blue_beard
          text: See that you bring it to me at once.
        - id: ch04-b06
          speaker: narrator
          text: She went back and forth several times, but at last she had to give him the key. Blue Beard examined it very closely.
        - id: ch04-b07
          speaker: blue_beard
          text: How did this blood get on the key?
        - id: ch04-b08
          speaker: wife
          text: I do not know.
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: The poor woman had turned pale as death.
        - id: ch04-b10
          speaker: blue_beard
          text: You do not know? Well, I know very well. You made up your mind to enter that closet, didn't you? Very well, madam. You shall go back inside and take your place among the ladies you saw there.
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: She threw herself at her husband's feet and begged him to forgive her. With every sign of true regret, she vowed that she would never disobey him again. She was so beautiful and so full of sorrow that she might have melted a rock. But Blue Beard's heart was harder than any rock.
        - id: ch04-b12
          speaker: blue_beard
          text: You must die, madam, and you must die now.
          emotion: angry
        - id: ch04-b13
          speaker: wife
          text: If I must die, please give me a little time to say my prayers.
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: She looked at him with her eyes full of tears.
        - id: ch04-b15
          speaker: blue_beard
          text: I will give you seven and a half minutes, and not one moment more.
    - id: ch05
      title: Sister Anne at the Tower
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As soon as she was alone, the wife called to her sister.
        - id: ch05-b02
          speaker: wife
          text: Sister Anne, please climb to the top of the tower and look for our brothers. They promised to come today. If you see them, signal for them to hurry.
        - id: ch05-b03
          speaker: narrator
          text: Sister Anne climbed to the top of the tower and looked out across the country. From time to time, the poor wife called after her in distress.
        - id: ch05-b04
          speaker: wife
          text: Anne, Sister Anne, can you see anyone coming?
          emotion: fearful
        - id: ch05-b05
          speaker: sister_anne
          text: I see only the sun making dust shine in the air, and the green grass below.
        - id: ch05-b06
          speaker: narrator
          text: Meanwhile, Blue Beard waited with a great saber in his hand. He shouted to his wife as loudly as he could.
        - id: ch05-b07
          speaker: blue_beard
          text: Come down this instant, or I will come up and get you!
          emotion: angry
        - id: ch05-b08
          speaker: wife
          text: Just one moment more, please.
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: Then she called very softly to her sister.
        - id: ch05-b10
          speaker: wife
          text: Anne, Sister Anne, do you see anybody coming?
          emotion: fearful
        - id: ch05-b11
          speaker: sister_anne
          text: I see nothing but sunlight in the dust, and the grass below is green.
        - id: ch05-b12
          speaker: blue_beard
          text: Come down quickly, or I am coming up to you!
          emotion: angry
        - id: ch05-b13
          speaker: wife
          text: I am coming.
        - id: ch05-b14
          speaker: narrator
          text: Once more, she called to the tower.
        - id: ch05-b15
          speaker: wife
          text: Anne, Sister Anne, surely you can see someone coming now?
          emotion: fearful
        - id: ch05-b16
          speaker: sister_anne
          text: I can see a great cloud of dust coming this way.
        - id: ch05-b17
          speaker: wife
          text: Is it our brothers?
        - id: ch05-b18
          speaker: sister_anne
          text: Alas, no, dear sister. It is a flock of sheep.
        - id: ch05-b19
          speaker: blue_beard
          text: Are you coming down or not?
          emotion: angry
        - id: ch05-b20
          speaker: wife
          text: One moment longer.
          emotion: fearful
        - id: ch05-b21
          speaker: narrator
          text: Again she cried out to her sister.
        - id: ch05-b22
          speaker: wife
          text: Anne, Sister Anne, do you see no one coming?
          emotion: fearful
        - id: ch05-b23
          speaker: sister_anne
          text: I see two horsemen, but they are still a long way off.
        - id: ch05-b24
          speaker: wife
          text: Thank God! They are our brothers. Signal to them however you can, and tell them to hurry!
          emotion: happy
        - id: ch05-b25
          speaker: narrator
          text: Then Blue Beard roared so loudly that the whole house trembled. His terrified wife came downstairs. Her hair hung loose around her shoulders, and she fell at his feet in tears.
        - id: ch05-b26
          speaker: blue_beard
          text: None of this will help you. You must die.
          emotion: angry
        - id: ch05-b27
          speaker: narrator
          text: He seized her hair with one hand and raised the saber with the other, ready to cut off her head. She turned toward him. Her eyes looked as if death were already upon her, and she begged for one last moment to gather herself.
        - id: ch05-b28
          speaker: wife
          text: Please, give me just one little moment more.
          emotion: fearful
        - id: ch05-b29
          speaker: blue_beard
          text: No, no. Commend yourself to God.
          emotion: angry
        - id: ch05-b30
          speaker: narrator
          text: He was just about to strike.
    - id: ch06
      title: The Brothers Arrive
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At that very instant, a tremendous knocking sounded at the gate, and Blue Beard stopped short. The gate opened, and two horsemen rushed in. They drew their swords and ran straight toward him.
        - id: ch06-b02
          speaker: narrator
          text: Blue Beard knew them at once. They were his wife's brothers, one a dragoon and the other a musketeer. He turned and fled to save himself. But the brothers stayed close behind him. Before he could reach the porch steps, they caught him, ran their swords through his body, and left him dead.
        - id: ch06-b03
          speaker: narrator
          text: The poor wife was almost as lifeless as her husband. She did not even have the strength to stand and welcome her brothers.
        - id: ch06-b04
          speaker: narrator
          text: Blue Beard had no heirs, so his wife became mistress of everything he owned. All the houses, money, plate, jewels, and rich furniture now belonged to her. She used one part of the estate to marry Sister Anne to a young gentleman who had loved her for a long time. With another part, she bought captains' commissions for her brothers.
        - id: ch06-b05
          speaker: narrator
          text: She used the rest to marry a very worthy gentleman, and with him she forgot the dreadful time she had endured with Blue Beard.
