audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    poor_brother:
      display_name: 穷兄弟
      tts: {delivery: 朴实温和而机敏, timbre: 成熟清亮, pace: 中等, pitch: 中音}
    rich_brother:
      display_name: 富兄弟
      tts: {delivery: 刻薄贪婪而急躁, timbre: 成熟偏硬, pace: 稍快, pitch: 中低音}
    old_man:
      display_name: 白胡子老人
      tts: {delivery: 神秘而亲切, timbre: 苍老温厚, pace: 舒缓, pitch: 低音}
    poor_wife:
      display_name: 穷兄弟的老伴
      tts: {delivery: 直爽朴实, timbre: 成熟温暖, pace: 中等, pitch: 中音}
    rich_wife:
      display_name: 富兄弟的老伴
      tts: {delivery: 务实利落, timbre: 成熟明亮, pace: 中等, pitch: 中音}
    captain:
      display_name: 船长
      tts: {delivery: 精明果断而心急, timbre: 粗犷清晰, pace: 稍快, pitch: 中低音}
  chapters:
    - id: ch01
      title: 门后的手磨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久很久以前，有兄弟二人。哥哥富有，弟弟贫穷。圣诞前夜，弟弟家里一口肉、一片面包也没有，只好去求哥哥看在上帝的分上，给他一点过节的食物。哥哥已经接济过他不少次，每次都不高兴，这一回也不例外。
        - id: ch01-b02
          speaker: rich_brother
          text: 你若肯替我办一件事，我就给你一整只火腿。
        - id: ch01-b03
          speaker: narrator
          text: 弟弟马上道谢，答应照办。
        - id: ch01-b04
          speaker: rich_brother
          text: 火腿拿去。现在一直走，去死人堂。
        - id: ch01-b05
          speaker: poor_brother
          text: 我既然答应了，就一定去。
        - id: ch01-b06
          speaker: narrator
          text: 弟弟拿起火腿，走了一程又一程，整整走了一天。天黑时，他终于来到一处灯火通明的地方。他望着那片亮光，心想，这里准是死人堂。外屋站着一位老人，长长的白胡子垂在胸前，手里正在劈过节用的圣诞柴。
        - id: ch01-b07
          speaker: poor_brother
          text: 晚上好。
        - id: ch01-b08
          speaker: old_man
          text: 晚上好。这么晚了，你要去哪里？
        - id: ch01-b09
          speaker: poor_brother
          text: 我要去死人堂，只怕自己走错了路。
        - id: ch01-b10
          speaker: old_man
          text: 没走错，这里就是。你进去以后，人人都会争着买火腿，因为他们很少能吃到肉。除非他们肯拿门后的手磨来换，否则别卖。出来时再来找我，我教你让它停下。那盘磨几乎什么都能磨出来。
        - id: ch01-b11
          speaker: narrator
          text: 弟弟谢过老人指点，走到死人堂门前敲了敲。一进门，事情果然和老人说的一模一样。里头的大人小孩全围上来，挤得像蚁山上的蚂蚁。人人都想买火腿，一个比一个出价高。
        - id: ch01-b12
          speaker: poor_brother
          text: 原本我和老伴该留着它做圣诞晚餐。可你们这么想要，我就让给你们吧。不过，我只换门后的那盘手磨。
        - id: ch01-b13
          speaker: narrator
          text: 里面的人起初一听要拿手磨来换，怎么也不肯答应。他们围着弟弟讨价还价，说尽各种条件，可弟弟认准门后的手磨，始终不肯松口。到最后，他们实在想吃火腿，只好把手磨交给他。弟弟抱着磨回到院里，请教那位劈柴的老人。老人果然把停磨的方法教给了他。他学会以后连声道谢，带着手磨飞快往家赶。可路实在太远，等他终于进门，圣诞前夜的钟早已敲过十二点。
    - id: ch02
      title: 鲱鱼和奶粥的洪流
      blocks:
        - id: ch02-b01
          speaker: poor_wife
          text: 你到底去了哪里？我等了一小时又一小时，连两根架圣诞粥锅的柴都没有。
        - id: ch02-b02
          speaker: poor_brother
          text: 我有要紧事要办，又走了很远，所以回来晚了。你现在瞧着吧！
        - id: ch02-b03
          speaker: narrator
          text: 他把手磨摆到桌上，先叫它磨出灯火，屋里一下亮了。接着，它又磨出桌布、肉、啤酒，还有圣诞前夜晚餐该有的种种好东西。主人吩咐什么，它就磨出什么。老伴眼看好东西一样接一样出现，惊得不停叫出声来。她追问丈夫从哪里得来这件宝贝，他却怎样也不肯说。
        - id: ch02-b04
          speaker: poor_brother
          text: 来历不重要。你看得出它是件宝贝，而且转动它的水永远不会结冰，这就够了。
        - id: ch02-b05
          speaker: narrator
          text: 他让手磨继续转，磨出了足够吃完整个圣诞节期的肉、酒和各种好东西。到了第三天，他把所有朋友都请来赴宴。富哥哥来到弟弟家，看见屋里和宴席上摆得这样丰盛，心里又恼又怒。弟弟得到任何好处，他都舍不得。他想，圣诞前夜，这人还穷得来求我，看在上帝的分上施舍一点东西。如今办起宴席，倒摆出伯爵兼国王的派头来了。
        - id: ch02-b06
          speaker: rich_brother
          text: 看在老天的分上，告诉我，你这些财富到底从哪里来的？
        - id: ch02-b07
          speaker: poor_brother
          text: 从门后头来的。
        - id: ch02-b08
          speaker: narrator
          text: 弟弟只说财富来自门后，不肯满足哥哥的好奇心。可到了晚上，他多喝了几口，话也多了，终于忍不住把得到手磨的经过全讲出来。为了让哥哥亲眼看看，他还把手磨搬到众人面前，一会儿叫它磨出这样，一会儿又叫它磨出那样。
        - id: ch02-b09
          speaker: poor_brother
          text: 你看，我的财富全是它带来的！
        - id: ch02-b10
          speaker: narrator
          text: 哥哥见了这番神奇本领，非把手磨弄到手不可。他缠着弟弟央求了又央求，最后答应付三百块钱。不过，两人说定，必须等到割完干草，手磨才真正归他。弟弟心里有自己的盘算。手磨多留一天，就能多磨一天。他要趁这段时间，备下足够吃许多年的肉和酒。于是，手磨天天转，当然一点生锈的机会也没有。到了割草时节，哥哥终于拿走它，弟弟却特意没教他怎样让磨停下。哥哥傍晚把手磨带回家。第二天一早，他叫老伴出去，跟在割草人后面摊晒干草，还说这一天家里的活全由自己照料。
        - id: ch02-b11
          speaker: rich_brother
          text: 磨出鲱鱼和奶粥来，要又快又好！
        - id: ch02-b12
          speaker: narrator
          text: 手磨立刻开工。它先把所有盘子和木桶装满，鲱鱼和奶粥很快又溢出来，漫过厨房地板。富哥哥急忙把磨拧过来，再转过去，使尽所有办法想叫它停下。可任凭他怎样转、怎样拧，手磨还是一个劲地磨。没过多久，奶粥便涨得那么高，差点把他活活淹死。他只得推开客厅门，让粥流过去。可转眼之间，连客厅也灌满了。他冒着被冲倒的危险，在滚滚粥流中艰难地挪到门边，好不容易抓住门闩。外门一开，他一刻也不敢多待，拔腿便跑。鲱鱼和奶粥紧追不放，冲出屋子，漫过整座农庄，又一路涌进田野。
        - id: ch02-b13
          speaker: narrator
          text: 田里的人等了很久，还不见午饭送来。
        - id: ch02-b14
          speaker: rich_wife
          text: 主人虽没叫我们，我们还是回去吧。也许他不会煮粥，正等着我帮忙呢。
        - id: ch02-b15
          speaker: narrator
          text: 老伴、女工和割草人三三两两往家走。刚顺着山坡上去不远，他们便看见鲱鱼、奶粥和面包迎面滚来。各种食物层层叠叠，彼此缠在一起，几乎铺满了眼前的路。富哥哥跑在这股洪流最前面，经过他们身旁时快得像有恶鬼追在脚后。
        - id: ch02-b16
          speaker: rich_brother
          text: 愿老天让你们每人长出一百个胃！小心别淹死在粥里！
        - id: ch02-b17
          speaker: narrator
          text: 他一直逃到弟弟家，求弟弟立刻收回手磨。
        - id: ch02-b18
          speaker: rich_brother
          text: 它再磨一个钟头，整片地方都要毁在鲱鱼和奶粥里了！
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: 弟弟却不肯白白收回手磨。他等哥哥又付了三百块钱，才让这场灾难停下。这样一来，原先的穷弟弟既拿回手磨，手里又多了钱。没过多久，他盖起一座比哥哥家漂亮得多的农庄。手磨替他磨出的财富多得数不清，他甚至给整座房子镶满金板。农庄就建在海岸旁边，金光远远闪到海上。过往的船只看见这座金屋，纷纷靠岸拜访它的富主人。手磨的名声越传越远，人人都听说过，也人人都想亲眼看看。
    - id: ch03
      title: 海底不停的手磨
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了很久很久，一位船长也来到金屋参观。他看过手磨，便问主人，这件宝贝能不能磨出盐。主人告诉他，当然能。船长一听，立刻拼命想把手磨买下来。他心里盘算着，有了这件宝贝，以后就不用再冒着海上的种种危险，航行到遥远的地方，运回一船又一船的盐了。主人起初连卖也不肯谈，可船长一再请求，不管花多少钱都非买不可。最后，主人收下成千上万块钱，把手磨卖给了他。船长马上把磨背到肩上，一刻也不愿久留。他生怕主人忽然反悔，连怎样叫手磨停下也顾不上问，便用最快的速度赶回船上。
        - id: ch03-b02
          speaker: narrator
          text: 船驶出海一段路，船长把手磨搬上甲板。
        - id: ch03-b03
          speaker: captain
          text: 磨出盐来，要又快又好！
        - id: ch03-b04
          speaker: narrator
          text: 手磨立刻转动起来，白盐像水一样喷涌而出。等整条船都装满了，船长觉得盐已经足够，便想让手磨停下。可是，不论他把磨转向哪一边，也不论他怎样用力，手磨还是不停地磨。甲板上的盐堆越来越高，船也越沉越深，最后终于沉进海里。那盘手磨如今还躺在海底。一天又一天，一年又一年，它始终没有停下，直到今天仍在磨盐。所以，海水才会是咸的。
        - id: ch03-b05
          speaker: narrator
          text: 这个古老的民间故事，是阿斯比约恩森与莫记录下来的。
