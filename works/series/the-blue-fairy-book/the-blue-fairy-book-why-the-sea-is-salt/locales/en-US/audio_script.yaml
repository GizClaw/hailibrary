  chapters:
    - id: ch01
      title: The Ham and the Hand-Mill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, there were two brothers. One was rich, and the other was poor. When Christmas Eve came, the poor brother did not have a single bite of meat or bread in his house. He went to the rich brother and begged him, in God's name, for something to eat on Christmas Day. This was far from the first time the rich brother had been made to give him something. As usual, he was not at all pleased to be asked.
        - id: ch01-b02
          speaker: rich_brother
          text: Do what I tell you, and you may have a whole ham.
        - id: ch01-b03
          speaker: narrator
          text: The poor brother thanked him at once and gave his promise.
        - id: ch01-b04
          speaker: rich_brother
          text: Here is the ham. Now take it straight to Dead Man's Hall.
        - id: ch01-b05
          speaker: narrator
          text: He tossed the ham to his brother.
        - id: ch01-b06
          speaker: poor_brother
          text: I gave you my word, so I will go.
        - id: ch01-b07
          speaker: narrator
          text: The poor brother took the ham and set off. He walked on and on for the whole day. At nightfall, he finally reached a place where a bright light was shining. He felt sure he had found Dead Man's Hall. In the outhouse, an old man with a long white beard stood chopping Yule logs.
        - id: ch01-b08
          speaker: poor_brother
          text: Good evening.
        - id: ch01-b09
          speaker: old_man
          text: Good evening to you. Where are you headed so late?
        - id: ch01-b10
          speaker: poor_brother
          text: I am looking for Dead Man's Hall. I hope I have come the right way.
        - id: ch01-b11
          speaker: old_man
          text: You have. This is the place. Once you go inside, everyone will want your ham because they get very little meat. Do not sell it for money. Ask for the hand-mill behind the door. When you come back out, I will show you how to stop it. That mill can make almost anything.
        - id: ch01-b12
          speaker: narrator
          text: The poor brother thanked the old man for his advice and knocked at the door.
    - id: ch02
      title: Christmas at Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Inside, everything happened just as the old man had said. Every person there, great and small, crowded around the visitor like ants on an anthill. They all wanted the ham, and each tried to offer him more than the others.
        - id: ch02-b02
          speaker: poor_brother
          text: My wife and I ought to keep this for our Christmas dinner. But since you want it so badly, I will trade it. In return, I must have that hand-mill behind the door.
        - id: ch02-b03
          speaker: narrator
          text: At first, no one would even consider giving up the hand-mill. They haggled and bargained with the poor brother, but he stood by what he had said. In the end, they had to make the trade. Once he was back in the yard, he asked the old woodcutter how the mill could be stopped. The old man taught him the secret. Then the poor brother thanked him and hurried home as fast as he could. Even so, the clock had already struck midnight when he arrived.
        - id: ch02-b04
          speaker: poor_wife
          text: Where in the world have you been? I have waited here for hours, and I do not even have two sticks to put under the Christmas porridge pot.
        - id: ch02-b05
          speaker: poor_brother
          text: I could not get back any sooner. I had important business to settle, and it was a long way from here. But watch what happens now!
        - id: ch02-b06
          speaker: narrator
          text: He set the hand-mill on the table and gave it an order. First it ground out light. Next came a tablecloth, then meat and beer, followed by every other good thing they could want for a Christmas Eve supper. One wonderful thing appeared after another. Whatever the poor brother asked for, the mill produced.
        - id: ch02-b07
          speaker: poor_wife
          text: Bless me! Where did you find such a mill?
          emotion: surprised
        - id: ch02-b08
          speaker: poor_brother
          text: Never mind where it came from. You can see how well it works, and the water that turns it will never freeze.
        - id: ch02-b09
          speaker: narrator
          text: He made enough food and drink to last through Christmastide. On the third day, he invited all his friends to a feast.
    - id: ch03
      title: The Rich Brother's Bargain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the rich brother saw the banquet and all the good things filling the house, he was both vexed and angry. He begrudged his brother every bit of it. On Christmas Eve, the poor man had come begging for the smallest gift. Now he was holding a feast as if he were a count and a king together.
        - id: ch03-b02
          speaker: rich_brother
          text: For heaven's sake, tell me how you became so rich.
        - id: ch03-b03
          speaker: poor_brother
          text: It all came from behind the door.
        - id: ch03-b04
          speaker: narrator
          text: That was all the poor brother would say. He had no wish to satisfy his brother's curiosity. Later that evening, though, he drank a little too much. At last, he could no longer keep the secret and told how he had obtained the hand-mill.
        - id: ch03-b05
          speaker: poor_brother
          text: There it is. That mill brought me everything you see.
        - id: ch03-b06
          speaker: narrator
          text: He brought it out and made it grind one thing, then another, right before his brother's eyes. The rich brother saw what it could do and insisted on owning it. It took a great deal of persuasion, but at last the poor brother agreed to sell. The price was three hundred dollars, and the poor brother was allowed to keep the mill until haymaking was over. He planned to spend all that time making enough meat and drink to last for many years. You may be sure the mill did not gather any rust while he still had it. When hay harvest came, the rich brother finally carried it away. But the poor brother had taken care not to teach him how to stop it.
        - id: ch03-b07
          speaker: narrator
          text: The rich brother brought the mill home in the evening. The next morning, he told his wife to go out and spread the cut hay behind the mowers. He would stay behind and look after the house himself that day. When dinner time drew near, he placed the mill on the kitchen table and decided what the meal should be.
        - id: ch03-b08
          speaker: rich_brother
          text: Grind herrings and milk pottage. Make them quickly, and make them well.
        - id: ch03-b09
          speaker: narrator
          text: The mill began at once. Herrings and milk pottage filled every dish and tub, then spilled across the kitchen floor. The rich brother twisted the mill, turned it, and screwed it every way he could. Nothing made it stop. Soon the pottage rose so high that he was in danger of drowning. He threw open the parlor door, but that only gave the flood another room to fill. Before long, the parlor was full too. He struggled through the stream of pottage and barely managed to catch the outside door latch. The moment the door opened, he ran. Herrings and pottage poured out behind him and streamed over the farm and fields.
    - id: ch04
      title: A Flood of Pottage
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Out in the hayfield, the rich man's wife wondered why dinner was taking so long.
        - id: ch04-b02
          speaker: rich_wife
          text: The master has not called us, but we had better go home. Perhaps his pottage is not turning out well, and he needs my help.
        - id: ch04-b03
          speaker: narrator
          text: The women and the mowers left the field in a scattered line and started toward the house. They had only gone a little way up the hill when they met a flood of herrings, pottage, and bread. It poured toward them, everything winding over everything else. The rich brother was running just ahead of it.
        - id: ch04-b04
          speaker: rich_brother
          text: I wish every one of you had a hundred stomachs! Be careful, or the pottage will drown you!
        - id: ch04-b05
          speaker: narrator
          text: He rushed past them as if Mischief itself were at his heels and ran all the way down to his brother's home. There he begged the poor brother, in God's name, to take back the mill that very instant.
        - id: ch04-b06
          speaker: rich_brother
          text: If it keeps grinding for one more hour, herrings and pottage will destroy the whole district!
        - id: ch04-b07
          speaker: narrator
          text: The poor brother would not take it until the rich brother paid him three hundred dollars. With the district in danger, the rich brother had no choice but to hand over the money. So the poor brother ended up with the mill again and kept the payment too.
        - id: ch04-b08
          speaker: narrator
          text: It was not long before the once-poor brother owned a farmhouse much finer than the rich brother's. The mill ground out so much money that he covered the house with plates of gold. It stood close to the seashore and glittered so brightly that its shine reached far across the water. Everyone who sailed past had to put in and visit the rich man in the golden farmhouse. They all wanted to see the wonderful mill. Its fame spread so far that there was hardly anyone who had not heard of it.
    - id: ch05
      title: Why the Sea Is Salt
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A long time passed. Then a skipper came to see the mill.
        - id: ch05-b02
          speaker: skipper
          text: Can it make salt?
        - id: ch05-b03
          speaker: poor_brother
          text: Yes, it can grind salt.
        - id: ch05-b04
          speaker: narrator
          text: The moment he heard that answer, the skipper wanted the mill with all his might. He thought it would save him from ever again sailing far over the dangerous sea to fetch cargoes of salt. The owner would not even consider parting with it at first. But the skipper begged and pleaded, ready to pay whatever it cost. At last, the owner sold it to him for many thousands of dollars.
        - id: ch05-b05
          speaker: narrator
          text: As soon as the bargain was made, the skipper swung the mill onto his back and hurried away. He was so afraid the seller might change his mind that he did not linger for a moment. He never stopped to ask how the grinding could be halted. Instead, he made his way aboard the ship as fast as he could.
        - id: ch05-b06
          speaker: narrator
          text: When the ship had sailed a little way from shore, the skipper carried the mill onto the deck.
        - id: ch05-b07
          speaker: skipper
          text: Grind salt. Make it quickly, and make it well.
        - id: ch05-b08
          speaker: narrator
          text: Salt began spouting from the mill like water. It kept coming until the ship was full. Then the skipper wanted it to stop, but he did not know the secret. He turned the mill one way and then another. No matter how hard he tried, it went on grinding. The mound of salt rose higher and higher, weighing down the ship until at last it sank beneath the sea.
        - id: ch05-b09
          speaker: narrator
          text: The mill lies at the bottom of the sea, and day after day, it keeps on grinding. That is why the sea is salt.
