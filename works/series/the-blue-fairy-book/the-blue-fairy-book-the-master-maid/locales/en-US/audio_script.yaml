  chapters:
    - id: ch01
      title: The Giant's Three Tasks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a king had many sons. No one remembers quite how many. The youngest could not bear to sit quietly at home. He was determined to go out into the world and try his luck. The King refused for a long while, but the young man would not give up. At last, his father had to give him leave.
        - id: ch01-b02
          speaker: narrator
          text: The Prince traveled for several days before he came to a giant's house. There he hired himself out as a servant. The next morning, the giant had to take his goats to pasture. Before leaving, he ordered the Prince to clean the stable.
        - id: ch01-b03
          speaker: giant
          text: Once the stable is clean, you may rest for the day. You will find that I am a kind master. But every task I give you must be done well. And stay out of every room beyond the one where you slept. If you enter any of them, I will take your life.
        - id: ch01-b04
          speaker: narrator
          text: The Prince thought this sounded like very easy service. There was plenty of time to clean a stable, so he walked up and down the room, humming and singing. But he kept thinking about those forbidden doors. It would be amusing to steal one little look. The giant must be afraid that he would see something hidden there.
        - id: ch01-b05
          speaker: narrator
          text: He opened the first door. A cauldron hung from the wall, bubbling and boiling, though there was no fire beneath it. The Prince wondered what could be inside. He dipped in a lock of his hair, and when he pulled it out, every strand looked like copper.
        - id: ch01-b06
          speaker: prince
          text: What a soup! One taste of that would gild a person's throat.
        - id: ch01-b07
          speaker: narrator
          text: Then he entered the second room. Another cauldron hung there, also bubbling without any fire. He dipped in another lock of hair to see what would happen. This one came out covered in silver.
        - id: ch01-b08
          speaker: prince
          text: We never had soup this costly in my father's palace. Though I wonder how it tastes.
        - id: ch01-b09
          speaker: narrator
          text: The third room held yet another cauldron, boiling in exactly the same strange way. The Prince was enjoying these experiments now. He dipped in a third lock, and it came out so brightly gilded that it shone.
        - id: ch01-b10
          speaker: prince
          text: This gets better with every room. If he boils gold here, what can be waiting beyond that door?
        - id: ch01-b11
          speaker: narrator
          text: That made him more determined than ever to see the last room. He passed through the fourth door. This time, there was no cauldron. A young woman sat on a bench. She looked like a king's daughter, though he did not know who she was, and he had never seen anyone so beautiful in all his life.
        - id: ch01-b12
          speaker: master_maid
          text: In heaven's name, what are you doing here?
          emotion: surprised
        - id: ch01-b13
          speaker: prince
          text: I came yesterday to serve the giant.
        - id: ch01-b14
          speaker: master_maid
          text: Then I hope you soon find a better place.
        - id: ch01-b15
          speaker: prince
          text: He seems kind enough. All I have to do today is clean the stable.
        - id: ch01-b16
          speaker: master_maid
          text: And how will you manage that? For every forkful you throw out, ten will fly back in. Turn the pitchfork upside down and work with the handle. Then the dirt will clear itself away.
        - id: ch01-b17
          speaker: prince
          text: I will remember.
        - id: ch01-b18
          speaker: narrator
          text: The Prince stayed beside her for the rest of the day. They talked so happily that before long, they had agreed to marry. His first day in the giant's service no longer seemed dull. As evening drew near, the Master-maid reminded him that the stable still had to be cleaned before the giant returned. The Prince went out and decided to test her warning. He used the pitchfork just as the stable boys did in his father's palace. After only a little work, the filth had multiplied until he could scarcely find room for his feet. Then he followed her advice. He turned the fork around and worked with its handle. In the twinkling of an eye, the whole stable was as clean as if someone had scrubbed it.
        - id: ch01-b19
          speaker: narrator
          text: The Prince returned to the room where the giant had told him to stay. He paced across the floor, humming and singing as though nothing unusual had happened. Then the giant came home with his goats and asked about the work.
        - id: ch01-b20
          speaker: prince
          text: The stable is clean and sweet, master.
        - id: ch01-b21
          speaker: giant
          text: I will judge that for myself.
        - id: ch01-b22
          speaker: narrator
          text: He inspected the stable and found it exactly as the Prince had said.
        - id: ch01-b23
          speaker: giant
          text: You have been talking to my Master-maid. You could never have thought of that alone.
        - id: ch01-b24
          speaker: prince
          text: Master-maid? What sort of thing is that? I would like to see it.
        - id: ch01-b25
          speaker: giant
          text: You will see her soon enough.
        - id: ch01-b26
          speaker: narrator
          text: The next morning, the giant again prepared to take his goats to pasture. Before leaving, he told the Prince to fetch a horse that roamed on the mountainside. Once the horse was safely home, the servant could rest for the remainder of the day. Again, the giant boasted that the Prince had found a kind master. Then he repeated his warning. The Prince must stay out of every forbidden room, or the giant would wring his head from his shoulders.
        - id: ch01-b27
          speaker: prince
          text: A kind master indeed. I will visit the Master-maid. Perhaps she would rather be mine than his.
        - id: ch01-b28
          speaker: narrator
          text: The Prince went straight through the forbidden rooms to the Master-maid. She was waiting on her bench and asked what task the giant had set for him that day.
        - id: ch01-b29
          speaker: prince
          text: Nothing dangerous, I think. I only have to ride his horse home from the mountainside. I have ridden wilder horses than that.
        - id: ch01-b30
          speaker: master_maid
          text: It will not be so simple. Fire will burst from its nostrils like flames from a pine torch. Take the bridle hanging by the door. When the horse rushes at you, throw the bit straight into its mouth. Then it will become as tame as you please.
        - id: ch01-b31
          speaker: narrator
          text: The Prince promised to remember her instructions. Then he sat with the Master-maid for the rest of the day. They talked of one thing and another, but every conversation came back to the same hope. They would be happy if only they could marry and escape safely from the giant. The Prince became so lost in their plans that he forgot both the mountainside and the horse. As evening drew near, the Master-maid had to remind him to finish his work before the giant came home.
        - id: ch01-b32
          speaker: narrator
          text: The Prince took the bridle from its hook beside the door and strode up the mountain. Before long, he found the horse. Fire and red flames streamed from its nostrils as it rushed at him with its jaws wide open. The Prince stood ready and carefully watched for his chance. At exactly the right moment, he threw the bit straight into the animal's mouth. The flames vanished, and the terrible horse stood as quiet as a young lamb. After that, the Prince had no trouble riding it down the mountain and putting it safely in the stable.
        - id: ch01-b33
          speaker: giant
          text: Did you bring back the horse?
        - id: ch01-b34
          speaker: prince
          text: I did, master. It was a lively ride, but the horse is in the stable.
        - id: ch01-b35
          speaker: giant
          text: I will see for myself.
        - id: ch01-b36
          speaker: narrator
          text: The giant marched outside to inspect the stable. The horse stood exactly where the Prince said it would, quiet in its stall.
        - id: ch01-b37
          speaker: giant
          text: You spoke to my Master-maid. That plan never came from you.
        - id: ch01-b38
          speaker: prince
          text: Yesterday you mentioned this Master-maid, and now you mention her again. Please show me the thing. I would enjoy seeing it.
        - id: ch01-b39
          speaker: giant
          text: You will see her soon enough.
        - id: ch01-b40
          speaker: narrator
          text: On the third morning, the giant prepared to take his goats into the woods. This time he ordered the Prince to go underground and collect his taxes. Once the money was brought home, the Prince could rest for the remainder of the day. Again, the giant declared that his servant would see what an easy master he had found.
        - id: ch01-b41
          speaker: narrator
          text: The Prince thought that however easy the giant claimed to be, he certainly knew how to give hard tasks. Still, the giant's Master-maid had helped twice already. Though the giant called her his, she might be willing to help once more. So the Prince passed through the forbidden rooms and went back to her.
        - id: ch01-b42
          speaker: master_maid
          text: How do you mean to collect these taxes?
        - id: ch01-b43
          speaker: prince
          text: You must teach me. I have never been underground, and I do not even know how much to ask for.
        - id: ch01-b44
          speaker: master_maid
          text: Go to the rock beneath the mountain ridge. Take the club lying there and knock on the stone wall. A man sparkling with fire will come out. Tell him why you came. When he asks how much you want, say, “As much as I can carry.”
        - id: ch01-b45
          speaker: narrator
          text: The Prince said he would remember. Then, as on the other days, he sat with the Master-maid until evening. He would gladly have stayed beside her forever if she had not reminded him that the giant would soon return. At last, he went to the rock beneath the mountain ridge. He picked up the club and knocked against the stone wall. The rock opened, and a man stepped out. He was so full of fire that sparks flew from both his eyes and his nose.
        - id: ch01-b46
          speaker: fire_man
          text: What do you want?
        - id: ch01-b47
          speaker: prince
          text: The giant sent me to collect his tax.
        - id: ch01-b48
          speaker: fire_man
          text: How much are you taking?
        - id: ch01-b49
          speaker: prince
          text: No more than I can carry.
        - id: ch01-b50
          speaker: fire_man
          text: Be glad you did not ask for a horse-load. Come inside.
        - id: ch01-b51
          speaker: narrator
          text: The Prince followed him inside the mountain. He had never seen so much wealth. Gold and silver lay everywhere in great heaps, as common as piles of stones on empty ground. The fiery man gave him a load exactly as large as he could carry. The Prince struggled home beneath it, set the bag on the bench, and waited for evening. When the giant returned with the goats, his servant was humming and singing just as he had on the two nights before.
        - id: ch01-b52
          speaker: giant
          text: Did you collect the tax?
        - id: ch01-b53
          speaker: prince
          text: Yes, master.
        - id: ch01-b54
          speaker: giant
          text: Then where is it?
        - id: ch01-b55
          speaker: prince
          text: The bag of gold is on the bench.
        - id: ch01-b56
          speaker: narrator
          text: The giant went over to the bench to see whether this was true. The bag stood there, so full and heavy that when he loosened its string, pieces of gold and silver tumbled over the edge.
        - id: ch01-b57
          speaker: giant
          text: You have certainly spoken to my Master-maid. If you have, I will wring your neck!
        - id: ch01-b58
          speaker: prince
          text: Master-maid? You have spoken of her every day since I came. I truly wish I could see the thing myself.
        - id: ch01-b59
          speaker: giant
          text: Wait until tomorrow. I will take you to her myself.
        - id: ch01-b60
          speaker: prince
          text: Thank you, master. Though I think you are teasing me.
    - id: ch02
      title: The Escape Across the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day, the giant brought the Prince to the Master-maid.
        - id: ch02-b02
          speaker: giant
          text: Kill him and boil him in the great cauldron. Call me when the broth is ready.
        - id: ch02-b03
          speaker: narrator
          text: Then the giant lay on a bench and fell asleep. His snores rolled like thunder among the hills.
        - id: ch02-b04
          speaker: narrator
          text: As soon as the giant slept, the Master-maid took a knife and cut the Prince's little finger. She let three drops of his blood fall onto a wooden stool. Then she gathered every old rag, worn shoe sole, and scrap of rubbish she could find and threw them all into the cauldron. She packed a chest with gold dust and took a lump of salt and the water flask hanging beside the door. She also carried away a golden apple and two golden chickens. With everything ready, she and the Prince fled as fast as they could.
        - id: ch02-b05
          speaker: narrator
          text: After they had gone some distance, they reached the sea. There they found a ship and sailed away, though how that ship came to be waiting for them is more than anyone has ever been able to say.
        - id: ch02-b06
          speaker: narrator
          text: After a long sleep, the giant stretched on his bench.
        - id: ch02-b07
          speaker: giant
          text: Is it beginning to boil?
        - id: ch02-b08
          speaker: blood_drop_1
          text: It is just starting.
        - id: ch02-b09
          speaker: narrator
          text: The giant went back to sleep. Much later, he stirred again without opening his eyes.
        - id: ch02-b10
          speaker: giant
          text: Is it nearly ready now?
        - id: ch02-b11
          speaker: blood_drop_2
          text: It is half done.
        - id: ch02-b12
          speaker: narrator
          text: Believing the Master-maid had answered, he slept for many more hours. At last he stretched once again.
        - id: ch02-b13
          speaker: giant
          text: Is it still not done?
        - id: ch02-b14
          speaker: blood_drop_3
          text: It is ready.
        - id: ch02-b15
          speaker: narrator
          text: The giant sat up and rubbed his eyes. He called for the Master-maid, but no one answered.
        - id: ch02-b16
          speaker: giant
          text: She must have stepped out for a moment.
        - id: ch02-b17
          speaker: narrator
          text: The giant decided that she must have slipped outside for a moment. He took a spoon and went to taste the broth. But the cauldron held nothing except shoe soles, rags, and rubbish, all boiled into a dreadful mess. He could not tell whether it was meant to be porridge or milk pudding. Then he understood what had happened. He flew into such a rage that he scarcely knew what he was doing. He rushed after the Prince and the Master-maid so fast that the wind whistled behind him.
        - id: ch02-b18
          speaker: narrator
          text: He reached the water but could go no farther.
        - id: ch02-b19
          speaker: giant
          text: I know how to cure that. I need only call my river-sucker.
        - id: ch02-b20
          speaker: narrator
          text: He called, and the river-sucker came. The creature lay beside the water and drank once, twice, and then a third time. With those three draughts, the sea sank so low that the giant could see the Prince and the Master-maid far out on the water in their ship.
        - id: ch02-b21
          speaker: master_maid
          text: Throw the lump of salt into the sea.
        - id: ch02-b22
          speaker: narrator
          text: The Prince threw the salt overboard. It began to grow at once. Higher and higher it rose until a great mountain stood across the sea. The giant could not climb over it, and the mountain blocked the river-sucker from drinking any more water.
        - id: ch02-b23
          speaker: giant
          text: I can cure this too. My hill-borer will cut through the mountain.
        - id: ch02-b24
          speaker: narrator
          text: The giant called his hill-borer. It began cutting through the mountain so that the river-sucker could reach the sea. At last, the hole broke through, and the river-sucker bent down to drink again.
        - id: ch02-b25
          speaker: master_maid
          text: Pour one or two drops from the flask.
        - id: ch02-b26
          speaker: narrator
          text: The Prince shook a drop or two from the flask. In an instant, the sea was full of water again. Before the river-sucker could take even one drink, the ship reached the farther shore. The Prince and the Master-maid stepped onto land in safety.
        - id: ch02-b27
          speaker: narrator
          text: They decided to go to the palace of the Prince's father. It was not far away, but the Prince would not allow the Master-maid to walk there. He thought it was not fitting for either a prince or his promised bride to approach the palace on foot.
        - id: ch02-b28
          speaker: prince
          text: Wait here a little while. My father's stable has seven horses. The palace is close, and I will soon return with the coach. I cannot have my bride walk there.
        - id: ch02-b29
          speaker: master_maid
          text: Please do not go. If you enter the palace, you will forget me. I know it.
        - id: ch02-b30
          speaker: prince
          text: How could I forget you? We have endured so much together, and we love each other dearly.
        - id: ch02-b31
          speaker: narrator
          text: The Master-maid warned him, but the Prince was completely determined. He insisted that he must bring the coach with the seven horses. At last she had to yield, and they agreed that she would wait for him there beside the sea.
        - id: ch02-b32
          speaker: master_maid
          text: When you arrive, do not stop even to greet anyone. Go straight to the stable, harness the horses, and come back quickly. People will crowd around you. Act as though you cannot see them, and do not taste a single thing. If you do, misery will come to us both.
        - id: ch02-b33
          speaker: narrator
          text: The Prince promised to obey every word. Then he left her waiting on the shore and went alone toward his father's palace.
    - id: ch03
      title: The Apple of Forgetfulness
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the Prince reached home, he found the palace filled with wedding guests. One of his brothers was about to be married, and the bride had arrived with all her family. Everyone crowded around the returning Prince. They asked where he had been, what had happened to him, and begged him to come inside. He behaved as though he could not see or hear them. Without greeting anyone, he went straight to the stable, brought out the seven horses, and began putting on their harness.
        - id: ch03-b02
          speaker: narrator
          text: When they saw that no amount of pleading would bring him inside, the wedding party carried food and drink out to the stable. They offered him the finest things prepared for the feast. The Prince refused every dish and kept fastening the horses as quickly as he could. At last, the bride's sister rolled an apple across the yard until it stopped near his feet.
        - id: ch03-b03
          speaker: bride_sister
          text: If you will eat nothing else, take one bite of this. After such a long journey, you must be hungry and thirsty.
        - id: ch03-b04
          speaker: narrator
          text: The Prince picked up the apple and took a bite. The instant the piece entered his mouth, every memory of the Master-maid vanished. He forgot her waiting beside the sea. He forgot that he had promised to return with the coach and carry her to the palace.
        - id: ch03-b05
          speaker: prince
          text: I must be out of my mind. Why am I standing here with a coach and horses?
        - id: ch03-b06
          speaker: narrator
          text: He returned the horses to the stable and went into the palace. Soon it was agreed that he would marry the bride's sister.
        - id: ch03-b07
          speaker: narrator
          text: Meanwhile, the Master-maid remained beside the sea. She waited a long time, and then a long time more, but no Prince and no seven-horse coach appeared. At last, she left the shore and walked on alone. Before long, she found a little hut standing by itself in a small wood close to the King's palace.
        - id: ch03-b08
          speaker: narrator
          text: The hut belonged to an old troll woman who was both bad-tempered and cruel. The Master-maid went inside and asked for a place to stay. At first, the old woman would not hear of it. Only after a long time, many kind words, and good payment did she agree. Inside, the hut was as black and filthy as a pigsty. The Master-maid said she meant to brighten it until it looked more like other people's homes. The old woman disliked that idea as well. She scowled and grumbled, but the Master-maid paid no attention.
        - id: ch03-b09
          speaker: narrator
          text: The Master-maid opened her chest of gold and tossed a handful of dust into the fire. The gold began to bubble, then poured across the walls and roof. It flowed until every part of the hut, inside and outside, was covered in gold. The sight terrified the old troll woman. She ran as if the Evil One were chasing her. In her panic, she forgot to bend beneath the low doorway. She struck her head against it, split her skull, and died.
    - id: ch04
      title: Three Suitors at the Golden Hut
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next morning, the sheriff happened to travel through the wood. He stopped in amazement when he saw a golden hut shining among the trees. He went inside to learn who lived there and found the beautiful Master-maid sitting alone. That astonished him even more. He fell in love with her at once and, right there on the spot, asked her kindly and courteously to become his wife.
        - id: ch04-b02
          speaker: master_maid
          text: Do you have a great deal of money?
        - id: ch04-b03
          speaker: sheriff
          text: Oh yes. I am quite well supplied.
        - id: ch04-b04
          speaker: narrator
          text: The Master-maid told him to go home and bring his wealth. That evening, he returned carrying a bag large enough to hold two bushels. He set it down on the bench. Since he had brought such a fine amount of money, the Master-maid said she would marry him. They sat beside each other to talk about their plans. They had hardly begun before she suddenly made as if to jump up.
        - id: ch04-b05
          speaker: master_maid
          text: I forgot to tend the fire.
        - id: ch04-b06
          speaker: sheriff
          text: There is no need for you to get up. I will see to it.
        - id: ch04-b07
          speaker: narrator
          text: He sprang to the hearth.
        - id: ch04-b08
          speaker: master_maid
          text: Tell me when you are holding the shovel.
        - id: ch04-b09
          speaker: sheriff
          text: I have it now.
        - id: ch04-b10
          speaker: master_maid
          text: Then hold the shovel, and let the shovel hold you. Pour burning coals over yourself until dawn.
        - id: ch04-b11
          speaker: narrator
          text: The sheriff could not release the shovel. All through the night, he stood beside the fire and poured red-hot coals over himself. He cried out, begged, and pleaded, but none of that made the burning coals any cooler. Only when dawn began to brighten the sky could he throw down the shovel. He did not remain at the hut for another moment. He ran away as fast as he could. Everyone he passed turned and stared, for he flew along like a madman and looked as though he had been both flayed and tanned. People wondered where he had spent the night, but he was far too ashamed to tell them.
        - id: ch04-b12
          speaker: narrator
          text: The next day, an attorney rode through the same wood. The bright gleam of the hut caught his eye among the trees, so he too went inside to see who lived there. The moment he saw the beautiful young woman, he fell even more deeply in love than the sheriff had. Without wasting any time, he began to court her.
        - id: ch04-b13
          speaker: master_maid
          text: Do you have plenty of money?
        - id: ch04-b14
          speaker: attorney
          text: I do, and I will fetch it at once.
        - id: ch04-b15
          speaker: narrator
          text: The Master-maid asked whether he owned plenty of money, just as she had asked the sheriff. The attorney said that he did and hurried home to collect it. That night, he returned with a great sack large enough to hold four bushels. He placed it on the bench beside her. The Master-maid promised to marry him, and the attorney sat down with her to arrange everything. Then she suddenly remembered something and began to rise.
        - id: ch04-b16
          speaker: master_maid
          text: I forgot to lock the porch door. I must do it now.
        - id: ch04-b17
          speaker: attorney
          text: Stay where you are. I will lock it.
        - id: ch04-b18
          speaker: narrator
          text: He hurried into the porch.
        - id: ch04-b19
          speaker: master_maid
          text: Tell me when your hand is on the latch.
        - id: ch04-b20
          speaker: attorney
          text: I have it!
        - id: ch04-b21
          speaker: master_maid
          text: Then hold the door, and let the door hold you. Dance from wall to wall until dawn.
        - id: ch04-b22
          speaker: narrator
          text: What a dance the attorney had that night. He had never known such a wild waltz, and he never wanted another. One moment he was in front of the door, and the next moment the door was in front of him. Back and forth it swept him between the porch walls until he was nearly beaten to death. At first, he shouted abuse at the Master-maid. Later, he changed his tune and begged her for mercy. The door cared for neither curses nor prayers. It kept him dancing until daybreak.
        - id: ch04-b23
          speaker: narrator
          text: The instant the door released him, the attorney fled. He forgot that anyone ought to pay for what he had suffered. He forgot his sack of money and every thought of marriage. He was too afraid that the porch door might come dancing after him. People stopped and stared as he raced past like a madman. He looked no better than if a whole flock of rams had spent the night butting him from side to side.
        - id: ch04-b24
          speaker: narrator
          text: On the third day, the bailiff passed that way. He too saw the golden house glowing in the little wood, and he too felt that he must discover who lived there. When he entered and caught sight of the Master-maid, he fell in love so quickly that he began courting her almost before he had said hello.
        - id: ch04-b25
          speaker: master_maid
          text: If you have a great deal of money, I will marry you.
        - id: ch04-b26
          speaker: bailiff
          text: I have no shortage of that.
        - id: ch04-b27
          speaker: narrator
          text: The Master-maid gave him the same answer as the other two. If he truly had a great deal of money, she would marry him. She sent him home to fetch it, and that evening he returned with a sack even larger than the attorney's. It must have held at least six bushels. He heaved it onto the bench, and the marriage was settled. But they had barely sat down together before the Master-maid remembered the calf and moved to rise.
        - id: ch04-b28
          speaker: master_maid
          text: I forgot to bring in the calf. I must put it in the shed.
        - id: ch04-b29
          speaker: bailiff
          text: No, you shall not. I will bring it in.
        - id: ch04-b30
          speaker: narrator
          text: Big and heavy as he was, the bailiff hurried outside like a boy.
        - id: ch04-b31
          speaker: master_maid
          text: Tell me when you have the calf by the tail.
        - id: ch04-b32
          speaker: bailiff
          text: I am holding it now!
        - id: ch04-b33
          speaker: master_maid
          text: Then hold the calf's tail, and let its tail hold you. Go around the world together until dawn!
        - id: ch04-b34
          speaker: narrator
          text: The bailiff had to move his feet then. The calf raced over rough ground and smooth, over hills and through valleys, dragging him behind by its tail. The more the bailiff cried and screamed, the faster the calf ran. When daylight began to appear, the poor man was half dead with weariness. He was so thankful when his hand could finally release the tail that he forgot his great sack of money and everything else he had left in the hut.
        - id: ch04-b35
          speaker: narrator
          text: He could not run away like the sheriff and the attorney. He could only walk, and he walked very slowly. The slower he went, the longer everyone along the road had to stare at him, and they made good use of the chance. No one could imagine how tired and ragged he looked after his night of racing around the world with the calf.
    - id: ch05
      title: The Wedding Coach
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The following day was the wedding at the palace. The elder brother was to ride to church beside his bride. The younger Prince, who had served the giant, would ride beside the bride's sister. Everyone took a seat in the coach, and they were just about to leave when one of the trace pins broke. The servants quickly made another pin, but it broke too. They made a second replacement and then a third, trying a different kind of wood each time. Every pin snapped as soon as they tried to set off. The delay went on and on, and the wedding party could not even leave the palace yard.
        - id: ch05-b02
          speaker: sheriff
          text: A maiden lives in the thicket. Ask her to lend you the handle of her fire shovel. I know it will hold.
        - id: ch05-b03
          speaker: narrator
          text: The sheriff had also been invited to the royal wedding, and he remembered his night at the golden hut. The palace sent a messenger into the thicket. On behalf of the wedding party, he politely begged the maiden to lend them the handle of the shovel she used for her fire. The request was so courteous that the Master-maid did not refuse. Her shovel handle became a trace pin, and this one held fast.
        - id: ch05-b04
          speaker: narrator
          text: The passengers settled themselves once more. Just as the coach started, its whole bottom fell to pieces beneath them. The servants built a new floor as fast as they could and nailed it firmly together. Yet the instant they fitted it into the coach and prepared to move, it broke apart. They tried again with other wood, but every new floor failed. Now the wedding party was in an even worse state than before.
        - id: ch05-b05
          speaker: attorney
          text: The maiden in the thicket has a porch door. If she lends you half of it, I am certain it will hold together.
        - id: ch05-b06
          speaker: narrator
          text: The attorney was among the guests at the palace too, and now he remembered his own night in the porch. Once more, they sent a messenger to the thicket. He politely asked to borrow one half of the maiden's gilded porch door. Again, the Master-maid granted the request at once. The door was carried back to the palace and fitted beneath the coach. At last, the passengers had a floor that would not fall apart.
        - id: ch05-b07
          speaker: narrator
          text: The wedding party climbed in for a third time, but now the horses could not pull the coach. Six horses strained at the harness without moving it an inch. The servants added two more, and then two more after that. At last, twelve horses stood before the coach. Yet the more animals they added and the harder the coachman whipped them, the less good it seemed to do. The coach remained exactly where it was. The hour was growing late. They had to reach the church, and everyone in the palace was in distress.
        - id: ch05-b08
          speaker: bailiff
          text: The girl in that golden cottage has a calf. Ask to borrow it. That calf could pull the coach even if it weighed as much as a mountain.
        - id: ch05-b09
          speaker: narrator
          text: The wedding guests thought it was ridiculous to be drawn to church by a calf. Still, they had tried everything else. For the third time, they sent a messenger to the gilded cottage. Speaking on behalf of the King, he begged as politely as he could for the loan of the calf the bailiff had described. The Master-maid agreed immediately. Once again, she would not say no.
        - id: ch05-b10
          speaker: narrator
          text: They brought the calf to the palace and fastened it to the coach, though no one truly believed such a small creature could move them. Away it flew at once. It dragged the coach over rough ground and smooth, over tree stumps and stones, never slowing for anything. The passengers could scarcely catch their breath. One moment the coach crashed against the ground, and the next it sailed high through the air.
        - id: ch05-b11
          speaker: narrator
          text: When they reached the church, the coach did not stop. It began spinning round and round like a wheel. The wedding party had the greatest trouble getting out, and they were in real danger before everyone made it safely through the church doors. After the ceremony, they climbed back into the coach. This time the calf ran even faster. By the time they returned, most of the passengers had no idea how they had reached the palace at all.
        - id: ch05-b12
          speaker: narrator
          text: When everyone sat down at the table, the Prince thought of the woman who had helped them.
        - id: ch05-b13
          speaker: prince
          text: We should have invited the maiden who lent us the shovel handle, the porch door, and the calf. Without those three things, we would never have left the palace.
        - id: ch05-b14
          speaker: narrator
          text: The King agreed that inviting her was both fair and proper. He chose five of his finest men and sent them down to the gilded hut. They were to give the maiden the King's courteous greetings and beg her to come to the palace for the midday dinner.
        - id: ch05-b15
          speaker: master_maid
          text: Give the King my greeting. Tell him that if he is too grand to come to me, then I am too grand to go to him.
        - id: ch05-b16
          speaker: narrator
          text: When the five men returned with her answer, the King had no choice but to go himself. The moment he came to the hut, the Master-maid agreed to accompany him. The King believed this young woman was far more than she appeared to be. At the palace table, he seated her in the place of honor beside the youngest bridegroom.
        - id: ch05-b17
          speaker: narrator
          text: They had been seated at the table only a little while when the Master-maid opened the things she had carried from the giant's house. She brought out the golden rooster, the golden hen, and the golden apple. She placed all three on the table in front of her. The moment she did, the rooster and hen began struggling with each other for the apple.
        - id: ch05-b18
          speaker: prince
          text: Look at those two fighting over the golden apple!
        - id: ch05-b19
          speaker: master_maid
          text: We fought just as hard to escape when we were inside the mountain.
        - id: ch05-b20
          speaker: narrator
          text: Her words broke the spell of forgetfulness. The Prince knew the Master-maid again, and no one could describe how delighted he was. Then he remembered the troll woman who had rolled the apple across the yard and caused him to forget. He ordered her tied between twenty-four horses and torn to pieces until not one bit of her remained.
        - id: ch05-b21
          speaker: narrator
          text: Only then did they begin to celebrate the true wedding, with the Prince beside the Master-maid. The sheriff, the attorney, and the bailiff were worn out by all that had happened to them. Even so, all three stayed and joined the wedding feast.
