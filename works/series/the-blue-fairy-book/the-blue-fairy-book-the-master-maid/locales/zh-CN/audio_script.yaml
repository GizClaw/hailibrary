audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    prince:
      display_name: 王子
      tts: {delivery: 温柔深情而略带忧伤, timbre: 年轻醇厚, pace: 舒缓, pitch: 中音}
    master_maid:
      display_name: 万能女仆
      tts: {delivery: 聪慧坚定而从容, timbre: 年轻清亮, pace: 从容有变化, pitch: 中高音}
    giant:
      display_name: 巨人
      tts: {delivery: 粗暴多疑而自负, timbre: 低沉粗粝, pace: 缓慢有力, pitch: 低音}
    fire_man:
      display_name: 火星人
      tts: {delivery: 冷峻直接, timbre: 干涩明亮, pace: 中等, pitch: 中低音}
    blood_drop_1:
      display_name: 第一滴血
      tts: {delivery: 简短自然, timbre: 轻细清晰, pace: 中等, pitch: 高音}
    blood_drop_2:
      display_name: 第二滴血
      tts: {delivery: 简短自然, timbre: 轻细清晰, pace: 中等, pitch: 高音}
    blood_drop_3:
      display_name: 第三滴血
      tts: {delivery: 简短自然, timbre: 轻细清晰, pace: 中等, pitch: 高音}
    bride_sister:
      display_name: 新娘的妹妹
      tts: {delivery: 甜美而暗藏心机, timbre: 年轻柔亮, pace: 中等, pitch: 中高音}
    sheriff:
      display_name: 地方长官
      tts: {delivery: 殷勤自信, timbre: 成熟厚实, pace: 中等, pitch: 中低音}
    attorney:
      display_name: 律师
      tts: {delivery: 伶俐自负, timbre: 成熟清晰, pace: 稍快, pitch: 中音}
    bailiff:
      display_name: 司法官
      tts: {delivery: 笃定而有些笨重, timbre: 浑厚圆润, pace: 中等, pitch: 中低音}
  chapters:
    - id: ch01
      title: 巨人的好仆人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一位国王，膝下有许多儿子。究竟有多少，我可说不准。只知道最小的王子怎么也不肯安静待在家里，非要到外面的世界碰碰运气。国王起先不肯答应，可王子坚持了很久，国王最终只得放他走。王子在外游历了好些天，来到一个巨人的家，受雇给巨人做了仆人。第二天一早，巨人要出门放山羊，临走前叫王子把马厩彻底清理干净。
        - id: ch01-b02
          speaker: giant
          text: 干完这件事，今天就没有别的活了。你遇上的是个好主人，以后自然会明白。不过，我交代的事情必须做好。你昨夜睡的房间还通着几间屋子，哪一间都不许进去。你敢进去，我就取你的性命。
        - id: ch01-b03
          speaker: narrator
          text: 巨人走后，王子一面来回踱步，一面哼着歌。他觉得离清理马厩还早，时间多得很。可那些不许进的房间一直勾着他的好奇心。巨人越不让看，他越觉得里面藏着什么怕人发现的东西。于是，他推开第一扇门。屋里吊着一口沸腾的大锅，锅底却看不见半点火。王子很想知道里面煮着什么，便把一绺头发浸了进去。再拿出来时，那绺头发仿佛全由铜铸成。
        - id: ch01-b04
          speaker: prince
          text: 这汤可真不错。谁喝上一口，连喉咙都得镀上铜。
        - id: ch01-b05
          speaker: narrator
          text: 王子又走进第二间屋。那里同样吊着一口大锅，锅里的东西咕嘟咕嘟沸腾，下面也没有火。他说还要试一试，便把另一绺头发伸进锅里。头发拿出来时，已经裹上了一层银。
        - id: ch01-b06
          speaker: prince
          text: 这么贵的汤，我父王的宫里也喝不到。不过好不好喝，还得尝过才知道。
        - id: ch01-b07
          speaker: narrator
          text: 接着，王子进了第三间屋。墙上的大锅仍在无火自沸，和前两间一模一样。王子已经试上了瘾，又把一绺头发浸进去。这一次，头发变得金光灿灿，亮得耀眼。
        - id: ch01-b08
          speaker: prince
          text: 别人总说一桩不如一桩，我这里却是一桩胜过一桩。他在这儿煮金子，里面又会煮什么？
        - id: ch01-b09
          speaker: narrator
          text: 王子推开第四扇门。里面没有大锅，长凳上却坐着一位美得无与伦比的姑娘，仿佛一位公主。
        - id: ch01-b10
          speaker: master_maid
          text: 天哪！你到这里来做什么？
          emotion: surprised
        - id: ch01-b11
          speaker: prince
          text: 我昨天到这里做了仆人。主人待我很好，今天只叫我清理马厩。
        - id: ch01-b12
          speaker: master_maid
          text: 既然到这里伺候人，但愿你早些另谋高就！那马厩可不能照普通办法清。你铲出去一叉，里面就会添进十叉。把草叉倒过来，用叉柄干活，脏东西自然会全飞出去。
        - id: ch01-b13
          speaker: narrator
          text: 王子答应照办，却没有马上离开。他陪着姑娘坐了一整天，两个人越谈越投契，很快便约定将来结为夫妻。给巨人做工的第一天，因此一点也不显得漫长。傍晚将近，姑娘提醒王子，最好赶在巨人回来前把马厩清好。王子到了马厩，偏想先验证她的话，便照着父王马厩里的仆人平日干活的样子铲起来。他才干了一会儿，里面的脏东西就越积越多，几乎挤得他无处站脚。王子只好停手，依照姑娘教的办法倒转草叉，用叉柄来干活。眨眼之间，所有脏东西都飞了出去，马厩干净得像刷洗过一样。做完以后，王子回到巨人准许他待的房间，在地板上来回踱步，装作若无其事地哼起歌来。
        - id: ch01-b14
          speaker: giant
          text: 马厩清好了吗？
        - id: ch01-b15
          speaker: prince
          text: 清好了，主人。现在又干净又清爽。
        - id: ch01-b16
          speaker: narrator
          text: 巨人亲自去看，发现果然如此。
        - id: ch01-b17
          speaker: giant
          text: 你一定和我的万能女仆说过话。这办法绝不是你自己想得出来的。
        - id: ch01-b18
          speaker: prince
          text: 万能女仆？那是什么东西？我倒真想瞧瞧。
        - id: ch01-b19
          speaker: giant
          text: 放心吧，你很快就会见到她。
    - id: ch02
      title: 烈马与地下税金
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，巨人又要赶着山羊出门。他吩咐王子，当天去把山坡上的马牵回来。只要办完这件事，剩下的时间都可以休息。巨人再次夸自己是个好主人，王子以后自然会明白。临走前，他又警告王子，昨天说过的那些房间一间也不许进，否则就拧断他的脑袋。说完，他才赶着羊群离开。
        - id: ch02-b02
          speaker: prince
          text: 你可真是个好主人。不过我还是要找万能女仆聊聊。说不定她很快就会宁愿属于我，不愿属于你。
        - id: ch02-b03
          speaker: narrator
          text: 王子来到姑娘身边，把当天的差事告诉她。
        - id: ch02-b04
          speaker: prince
          text: 不过是到山坡上牵一匹马回来，能有多难？我从前骑过的马，大概比它烈得多。
        - id: ch02-b05
          speaker: master_maid
          text: 没有你想的那么容易。你一走近，那匹马的鼻孔就会像松木火把一样喷出火焰。拿上门边的辔头，等它张嘴扑来，把嚼子正正投进它嘴里。它马上就会温顺下来。
        - id: ch02-b06
          speaker: narrator
          text: 王子说自己一定牢牢记住，随后又陪万能女仆坐了一整天。他们天南海北，无话不谈，可说来说去，最要紧的还是怎样结为夫妻，又怎样平安逃离巨人。王子谈得入迷，险些把山坡和马全忘了。傍晚时，万能女仆提醒他，该赶在巨人回来前去牵马。王子取下挂在钩子上的辔头，大步登上山坡，没走多久便遇见那匹马。烈火和赤红的火焰从马鼻孔里直喷出来。王子谨慎地等待时机。烈马张开大嘴冲向他时，他一下把嚼子投进马嘴。那匹马立刻安静得像只小羊，再也没有半点难对付的地方。王子轻轻松松把它带回马厩，又回到自己的房间哼起歌来。
        - id: ch02-b07
          speaker: giant
          text: 你把山坡上的马牵回来了吗？
        - id: ch02-b08
          speaker: prince
          text: 当然，主人。骑它还挺有意思。我一路把它骑回来，也关进马厩了。
        - id: ch02-b09
          speaker: narrator
          text: 巨人去马厩看过，又断定王子见了万能女仆。
        - id: ch02-b10
          speaker: prince
          text: 主人昨天提万能女仆，今天又提。为什么不把那东西给我看看？我见到它一定高兴坏了。
        - id: ch02-b11
          speaker: giant
          text: 你很快就会见到她。
        - id: ch02-b12
          speaker: narrator
          text: 第三天清早，巨人照旧要赶着山羊进树林。这一次，他吩咐王子到地下去，替自己把税金收回来。差事办妥，剩下的时间又可以休息，这正好证明王子遇上了多么好伺候的主人。巨人离开以后，王子却暗自嘀咕，这位主人不论多么好伺候，派下来的可全是难差事。好在还有万能女仆。巨人说她属于自己，可她照样能告诉王子该怎么办。
        - id: ch02-b13
          speaker: master_maid
          text: 你准备怎样到地下收税？
        - id: ch02-b14
          speaker: prince
          text: 当然得由你教我。我从没去过地下，就算知道路，也不知道该收多少。
        - id: ch02-b15
          speaker: master_maid
          text: 到山脊下面那块岩石前，拿起那里的木棒敲石壁。会有一个浑身冒火星的人出来。你说明来意。他问要多少，你就说：“我要自己背得动的那么多。”
        - id: ch02-b16
          speaker: narrator
          text: 王子说自己一定记住，接着又陪万能女仆坐了整整一天。夜色渐渐降临，他还是舍不得离开。若不是万能女仆提醒，该趁巨人回来前去取税金，他简直愿意一直坐到今天。王子这才动身。他来到山脊下的石壁前，找到那根木棒，照吩咐敲了敲岩石。一个浑身冒火星的人走了出来，就连眼睛和鼻孔里也有火星飞迸。
        - id: ch02-b17
          speaker: fire_man
          text: 你要什么？
        - id: ch02-b18
          speaker: prince
          text: 巨人叫我来替他收税。
        - id: ch02-b19
          speaker: fire_man
          text: 你要收多少？
        - id: ch02-b20
          speaker: prince
          text: 不多不少，只要我自己背得动的那么多。
        - id: ch02-b21
          speaker: fire_man
          text: 幸好你没开口要一马驮的分量。跟我进来吧。
        - id: ch02-b22
          speaker: narrator
          text: 王子跟着火星人走进岩石，眼前的金银多得叫人吃惊。它们堆满山腹，就像荒地上一堆堆随处可见的石头。火星人果真给了王子一份他能背得动的税金。王子背起那一大包金银，原路离开。晚上，巨人赶着山羊回来时，王子又像前两个晚上那样走进房间，若无其事地哼起歌来。
        - id: ch02-b23
          speaker: giant
          text: 税金取来了吗？放在哪里？
        - id: ch02-b24
          speaker: prince
          text: 取来了，主人。那袋金子就在长凳上。
        - id: ch02-b25
          speaker: narrator
          text: 巨人解开口袋，金银满得直往外掉。
        - id: ch02-b26
          speaker: giant
          text: 你一定见过我的万能女仆！要真见过，我就拧断你的脖子。
        - id: ch02-b27
          speaker: prince
          text: 您三天都在说万能女仆。我真希望亲眼看看那东西。
        - id: ch02-b28
          speaker: giant
          text: 好，等到明天，我亲自带你去见她。
        - id: ch02-b29
          speaker: prince
          text: 谢谢主人——可您不过是在拿我开心吧。
    - id: ch03
      title: 逃离巨人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天，巨人把王子带到万能女仆面前。
        - id: ch03-b02
          speaker: giant
          text: 杀了他，用那口大锅把他煮掉。肉汤做好以后叫我。
        - id: ch03-b03
          speaker: narrator
          text: 巨人说完便躺在长凳上睡觉，转眼鼾声便像群山间的雷鸣。万能女仆拿起刀，在王子的小指上割了一下，把三滴血分别滴在木凳上。接着，她收集所有找得到的破布、旧鞋底和杂七杂八的废物，一股脑扔进大锅。她又取出一只箱子，装满金粉，还带上一块盐、挂在门边的水瓶、一个金苹果和两只金鸡。准备妥当以后，她和王子用最快的速度逃走。他们走出一段路，来到海边，随后乘船而去。至于那艘船究竟从哪里来，我到现在也没打听明白。
        - id: ch03-b04
          speaker: giant
          text: 快煮开了吗？
        - id: ch03-b05
          speaker: blood_drop_1
          text: 才刚开始呢。
        - id: ch03-b06
          speaker: narrator
          text: 巨人又睡了很久，迷迷糊糊地动了动，却没有抬头。
        - id: ch03-b07
          speaker: giant
          text: 现在快好了吗？
        - id: ch03-b08
          speaker: blood_drop_2
          text: 煮好一半啦！
        - id: ch03-b09
          speaker: narrator
          text: 巨人以为是万能女仆回答，翻个身继续睡。许多个钟头以后，他伸着懒腰又问起来。
        - id: ch03-b10
          speaker: giant
          text: 还没好吗？
        - id: ch03-b11
          speaker: blood_drop_3
          text: 全都好啦。
        - id: ch03-b12
          speaker: narrator
          text: 巨人坐起来揉揉眼睛，却看不见刚才是谁在说话。他问万能女仆在哪里，又大声喊了几遍，始终没有人回答。巨人心想，她大概只是悄悄出去了一会儿，便拿起汤匙，到锅边尝尝味道。锅里哪里有什么王子，只有旧鞋底、破布和一堆不值钱的破烂，全都煮成一团，连究竟是麦粥还是奶粥也分不清。巨人这才明白发生了什么。他气得简直不知道自己在做什么，拔腿便去追王子和万能女仆。他跑得飞快，身后的风都呼呼作响。没过多久，巨人追到海边，却无法跨过海水。
        - id: ch03-b13
          speaker: giant
          text: 好办，这点事情难不倒我。只消叫来我的吸河怪。
        - id: ch03-b14
          speaker: narrator
          text: 吸河怪趴下喝了三大口，海水低得让巨人看见了船上的两个人。
        - id: ch03-b15
          speaker: master_maid
          text: 快把盐块扔出去。
        - id: ch03-b16
          speaker: narrator
          text: 王子把盐块抛进海里。盐块立刻长成一座又高又大的山，横贯整片海面。巨人翻不过去，吸河怪也再喝不到海水。可巨人又说这事难不倒他，随即叫来钻山怪，要它在山中打穿一条通道，好让吸河怪继续喝。山洞才刚打通，吸河怪正准备张嘴，万能女仆便叫王子从瓶里洒出一两滴水。王子照办，海水顷刻间重新涨满。吸河怪一口还没来得及喝，王子和万能女仆已经到达陆地，平安脱险。
        - id: ch03-b17
          speaker: narrator
          text: 他们决定去见王子的父亲。王子觉得让未婚妻走去王宫有失体面，坚持回家取七匹马拉的车。
        - id: ch03-b18
          speaker: prince
          text: 在这里稍等一小会儿。王宫不远，我很快回来。我绝不能让自己的未婚妻走着去。
        - id: ch03-b19
          speaker: master_maid
          text: 不要去！你一回到王宫就会把我忘掉，我预见得到。
          emotion: fearful
        - id: ch03-b20
          speaker: prince
          text: 我怎么可能忘记你？我们一起受了这么多苦，又这样彼此相爱。
        - id: ch03-b21
          speaker: narrator
          text: 王子铁了心，万能女仆只得让步。
        - id: ch03-b22
          speaker: master_maid
          text: 到了王宫，连问候任何人的工夫也不要耽搁。直接进马厩，套好车，尽快回来。大家都会围住你，你只当没看见。无论如何都不能尝任何东西，否则你我都会遭到极大的不幸。
        - id: ch03-b23
          speaker: narrator
          text: 王子答应了。可他回到父王的宫殿，正赶上一个哥哥要成婚，新娘和她的所有亲友都来到了宫里。众人一下围住王子，七嘴八舌问个不停，还想拉他一同进屋。王子只当谁也没看见，径直走进马厩，把七匹马牵出来，一匹匹套到车上。大家见怎样劝也劝不动，便把婚宴准备的酒肉和各样最好的食物全送到马厩。王子一样也不肯碰，只顾尽快套好马车。最后，新娘的妹妹把一只苹果滚过院子。
        - id: ch03-b24
          speaker: bride_sister
          text: 既然别的东西都不肯吃，尝一口苹果吧。走了这么远，你一定又饿又渴。
        - id: ch03-b25
          speaker: narrator
          text: 王子到底还是捡起了苹果，咬下一口。苹果才进嘴，那个在海边等候他的万能女仆就从记忆里消失了。他不再记得两人曾怎样一起逃出巨人的家，也忘了自己匆匆套好七匹马，原本正是要驾车回去接她。
        - id: ch03-b26
          speaker: prince
          text: 我一定是疯了！我要这车马做什么？
        - id: ch03-b27
          speaker: narrator
          text: 他把马送回马厩，走进王宫。大家就此议定，让他迎娶新娘的妹妹。
    - id: ch04
      title: 树林里的金屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 万能女仆坐在海边等了很久很久，王子始终没有回来。她只好独自离开。走出不远，便在王宫附近的一片小树林里发现一间孤零零的屋子。她进门询问能不能借住。屋主是个脾气乖戾、心肠恶毒的女山怪，起初说什么也不答应。万能女仆说尽好话，又付了丰厚报酬，磨了很久，才获准留下。屋里又黑又脏，简直像个猪圈。万能女仆说想稍微收拾一下，让它多少有点寻常人家的模样。老太婆连这也不肯，阴沉着脸大发脾气。万能女仆根本不理会。她打开装金粉的箱子，抓起一把左右投进火里。金子沸腾起来，漫出炉膛，流遍整座小屋，直到里里外外每一处都镀上了金。金子刚冒起泡，老太婆便吓破了胆，逃得像魔鬼正在身后追赶。她穿过门口时忘了低头，一头撞裂，当场死了。
        - id: ch04-b02
          speaker: narrator
          text: 第二天清早，地方长官恰好从这里经过。树林里原本只有普通的小屋，如今却有一座金屋闪闪发亮，他看见以后大吃一惊。等他走进屋里，发现里面还坐着一位美丽的少女，更是惊讶得不得了。他立刻爱上了万能女仆，当场便用最客气、最甜蜜的话请求她嫁给自己。
        - id: ch04-b03
          speaker: master_maid
          text: 那么，你有很多钱吗？
        - id: ch04-b04
          speaker: sheriff
          text: 有的。若只说钱，我并不缺。
        - id: ch04-b05
          speaker: narrator
          text: 地方长官听完便回家取钱。到了傍晚，他带着一个足足能装两蒲式耳的大口袋回来，把钱放在长凳上。万能女仆见他果真带来这么多钱，便说愿意嫁给他。两个人一起坐下来谈话，可才刚坐定，万能女仆便忽然要起身，说自己忘了照看炉火。
        - id: ch04-b06
          speaker: sheriff
          text: 这种事何必由你来？我去。
        - id: ch04-b07
          speaker: master_maid
          text: 握住火铲以后，告诉我一声。
        - id: ch04-b08
          speaker: sheriff
          text: 我已经握住了。
        - id: ch04-b09
          speaker: master_maid
          text: 那么你就握着火铲，火铲也握着你，不停把烧红的炭倒在自己身上，直到天亮。
        - id: ch04-b10
          speaker: narrator
          text: 地方长官只得整夜站在壁炉前，把烧红的炭一铲一铲往自己身上倒。他又是哭喊，又是哀求，又是讨饶，炭火却丝毫不肯变凉。曙光出现时，魔法终于失效。他扔下火铲，一刻也不敢停留，拔腿就以最快的速度逃走。一路遇见的人全都瞪大眼睛，回头盯着他看，因为他跑得像个疯子。哪怕他先被剥了皮，再放进鞣液里鞣过，模样也不会比这更惨。人人都猜他究竟去了哪里，他却羞得一个字也不肯说。
        - id: ch04-b11
          speaker: narrator
          text: 次日，律师骑马经过这里。他看见小屋隔着树林闪耀着灿烂的光，也忍不住进去看看是谁住在里面。一见美丽的万能女仆，他爱得比地方长官还深，马上开口求婚。万能女仆照样问他有没有许多钱。律师说，若只说钱，自己并不缺，随即回家去取。到了夜里，他带来一个能装四蒲式耳的大钱袋，把它放在万能女仆身旁的长凳上。她答应了婚事。律师刚坐下来商量，她忽然说，自己忘了锁门廊的门，非去锁上不可。
        - id: ch04-b12
          speaker: attorney
          text: 你坐着，我去锁。
        - id: ch04-b13
          speaker: master_maid
          text: 抓住门闩以后，告诉我一声。
        - id: ch04-b14
          speaker: attorney
          text: 我已经抓住了！
        - id: ch04-b15
          speaker: master_maid
          text: 那么你就抓着门，门也抓着你，让你在两面墙之间来来回回，直到天亮。
        - id: ch04-b16
          speaker: narrator
          text: 律师那一夜可跳了一场好舞！他一生从没跳过这样的华尔兹，此后也绝不想再跳一次。他一会儿在门前，一会儿门又挡到他前面。门从门廊这头甩到那头，又从那头甩回来，差点把他活活打死。起初，律师破口大骂万能女仆，后来又苦苦哀求。可门什么也不理，只管把他困到破晓。门一放开，律师便飞奔而去。他忘了该找谁报复，忘了那袋钱，也忘了求婚，只怕房门会跳着舞追上来。一路遇见的人都回头望着他，因为他逃得像个疯子。哪怕一群公羊顶了他整整一夜，模样也不会比这更惨。
        - id: ch04-b17
          speaker: narrator
          text: 第三天，司法官也从这里经过。他看见小树林中的金屋，非进去看看是谁住在那里不可。他刚瞧见万能女仆，便爱得神魂颠倒，几乎还没来得及问候，就求起婚来。万能女仆仍用回答前两个人的话回答他，只要有许多钱，她便嫁给他。司法官说，若只说钱，他也并不缺。万能女仆马上叫他回家去取。到了夜里，他带回一只比律师那袋还大的钱袋，至少能装六蒲式耳，放在长凳上。婚事就此说定。可两人才刚坐下，她便说忘了把小牛牵回来，得出去赶进牛棚。
        - id: ch04-b18
          speaker: bailiff
          text: 绝不能让你去。这种事该由我来做。
        - id: ch04-b19
          speaker: narrator
          text: 司法官身躯又肥又大，跑出去时却轻快得像个男孩。
        - id: ch04-b20
          speaker: master_maid
          text: 抓住小牛尾巴以后，告诉我一声。
        - id: ch04-b21
          speaker: bailiff
          text: 我已经抓住了！
        - id: ch04-b22
          speaker: master_maid
          text: 那么你就抓着小牛尾巴，小牛尾巴也抓着你，让你们一起走遍世界，直到天亮！
        - id: ch04-b23
          speaker: narrator
          text: 司法官这下非得好好活动不可了。小牛翻山越岭，不管道路崎岖还是平坦，只顾向前飞奔。司法官叫得越响，它跑得越快。天色渐渐发白时，他已经累得半死。终于能松开小牛尾巴，他高兴得忘了钱袋，也忘了其他一切。回去时，他走得很慢，比地方长官和律师逃走时都慢得多。可他走得越慢，路人就越有工夫盯着他细看，他们也果真看了个够。和小牛跳过这场舞以后，他那副疲惫不堪、衣衫破烂的模样，谁也想象不出来。
    - id: ch05
      title: 一头小牛拉马车
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天，王宫要举行婚礼。哥哥将和自己的新娘乘车去教堂，曾给巨人做工的弟弟则要迎娶新娘的妹妹。两对新人和随行的人都坐进马车，眼看就要驶离王宫，一根挽具栓却突然折断。他们赶紧做了一根新的来替换，可那根也断了。第二根、第三根仍旧如此，不论他们选用哪一种木头，装上去以后都撑不了多久。众人折腾了很长时间，马车始终离不开王宫，大家急得不知如何是好。受邀到宫中参加婚礼的地方长官这才开口。
        - id: ch05-b02
          speaker: sheriff
          text: 树林里住着一位姑娘。只要能借到她拨火用的火铲柄，我敢说那东西一定撑得住。
        - id: ch05-b03
          speaker: narrator
          text: 使者赶到树林里，好言好语请求借用地方长官提到的火铲柄。万能女仆没有拒绝。这样，马车终于有了一根不会折断的挽具栓。谁知大家正要出发，车底忽然又散成了碎片。他们赶紧做出一块新底板，可不论怎样钉合，也不论使用哪一种木料，新底板只要装上马车，刚要启程就再次裂开。眼下的情形比挽具栓折断时还糟。也来参加婚礼的律师终于说话了。
        - id: ch05-b04
          speaker: attorney
          text: 树林里那位姑娘有一扇门廊的门。只要借来半扇，我敢说车底一定不会散开。
        - id: ch05-b05
          speaker: narrator
          text: 使者再次前往树林，好言好语请求借用律师所说的那扇镀金门。万能女仆立刻借出了一半。他们用门板修好车底，再次准备启程，可这一回，马匹竟然拉不动车。原先套着六匹马，他们又增加到八匹、十匹，最后足足十二匹。可马加得越多，车夫的鞭子抽得越狠，反而越不管用。马车始终纹丝不动。眼看天色已经不早，教堂又非去不可，王宫里人人都急得不知所措。司法官终于开口了。
        - id: ch05-b06
          speaker: bailiff
          text: 树林的金屋里住着一位姑娘。只要借来她的小牛，哪怕马车像一座山那么重，它也拉得动。
        - id: ch05-b07
          speaker: narrator
          text: 大家都觉得，让一头小牛拉车去教堂实在荒唐。可是除了再派一名使者，他们已经没有别的办法。使者以国王的名义好言相求，请万能女仆借出司法官提到的那头小牛。这一回，她仍旧没有说“不”。众人把小牛套到车前，想看看马车能不能动。谁知小牛拖起车子便一路飞奔，越过高地洼地、树桩石块，颠得车里的人几乎喘不上气。他们时而落到地上，时而又飞上半空。到了教堂，马车还像纺车一样团团转个不停。众人费尽力气，冒着莫大的危险，好不容易才从车里下来，逃进教堂。返回王宫时，小牛跑得比来时更快，多数人根本不知道自己究竟是怎样回来的。
        - id: ch05-b08
          speaker: narrator
          text: 惊险的路程终于结束，众人回到王宫，在婚宴的餐桌旁坐好。直到这时，曾给巨人做仆人的年轻王子才想起那位住在树林里、接连借出三样东西的姑娘。
        - id: ch05-b09
          speaker: prince
          text: 我们应该邀请那位姑娘进宫。要是没有她的火铲柄、门板和小牛，我们根本离不开王宫。
        - id: ch05-b10
          speaker: narrator
          text: 国王听完，也觉得这件事既公道又合情。若没有姑娘的帮助，婚礼队伍的确连王宫大门也出不了。他便挑选五名最出色的侍从，派他们来到树林中的镀金小屋，代自己向姑娘恭敬问候，请她赏光到王宫享用午宴。
        - id: ch05-b11
          speaker: master_maid
          text: 替我问候国王。如果他身份太尊贵，不肯来见我，那么我也身份太尊贵，不肯去见他。
        - id: ch05-b12
          speaker: narrator
          text: 五名侍从只好空手回去复命。国王听完，便亲自来到镀金小屋。万能女仆这一次没有推辞，立刻随他进宫。国王看出这位姑娘绝不像外表显得那么简单，便请她坐在最年轻的新郎身旁，把全席最尊贵的位置留给了她。
    - id: ch06
      title: 金苹果唤回的记忆
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 大家入席不久，万能女仆便取出从巨人家逃走时带上的公鸡、母鸡和金苹果，把它们摆在自己面前的桌上。两只金鸡一看见金苹果，立刻你争我抢，为了它打斗起来。席间所有人都能看见这一幕。
        - id: ch06-b02
          speaker: prince
          text: 快看，那两只鸡为了金苹果打得多厉害。
        - id: ch06-b03
          speaker: master_maid
          text: 是啊。那一次我们困在山中，为了逃出来，也曾这样拼命。
        - id: ch06-b04
          speaker: narrator
          text: 这句话一下唤醒了王子的记忆。他终于认出眼前的姑娘正是万能女仆，也记起她怎样帮自己完成三件差事，怎样带着自己逃过巨人的追赶，又怎样独自在海边等了那么久。他忘掉的诺言、患难和爱情，全都回到了心里。他有多么欢喜，你们想必能够想象。王子随即下令，让二十四匹马把那个曾将苹果滚给他的女山怪撕成碎片，一小块也不许留下。直到这时，王子和万能女仆才真正开始庆祝自己的婚礼。地方长官、律师和司法官尽管经过那几场折腾，早已累得够呛，也陪着他们一同庆祝到底。
        - id: ch06-b05
          speaker: narrator
          text: 这个古老的民间故事，是阿斯比约恩森与莫记录下来的。
