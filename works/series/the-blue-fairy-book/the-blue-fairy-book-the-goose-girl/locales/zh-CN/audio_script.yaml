audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    princess:
      display_name: 公主
      tts: {delivery: 温柔坚忍，言语真诚, timbre: 柔和清亮, pace: 中等偏慢, pitch: 中高音}
    old_queen:
      display_name: 老王后
      tts: {delivery: 慈爱而郑重, timbre: 温暖成熟, pace: 舒缓, pitch: 中低音}
    waiting_maid:
      display_name: 侍女
      tts: {delivery: 傲慢强硬，冷酷刻薄, timbre: 尖锐清晰, pace: 中等, pitch: 中音}
    blood_drop_1:
      display_name: 第一滴血
      tts: {delivery: 哀伤神秘, timbre: 轻柔空灵, pace: 舒缓, pitch: 高音}
    blood_drop_2:
      display_name: 第二滴血
      tts: {delivery: 哀伤神秘, timbre: 柔和悠远, pace: 舒缓, pitch: 中高音}
    blood_drop_3:
      display_name: 第三滴血
      tts: {delivery: 哀伤神秘, timbre: 清澈悠远, pace: 舒缓, pitch: 中音}
    falada:
      display_name: 法拉达
      tts: {delivery: 忠诚庄重，带着哀意, timbre: 深沉浑厚, pace: 缓慢, pitch: 低音}
    prince:
      display_name: 王子
      tts: {delivery: 真诚端正，彬彬有礼, timbre: 年轻清朗, pace: 中等, pitch: 中低音}
    old_king:
      display_name: 老国王
      tts: {delivery: 明察秋毫，威严稳重, timbre: 苍老沉稳, pace: 不疾不徐, pitch: 低音}
    curdken:
      display_name: 柯德金
      tts: {delivery: 活泼任性，容易急躁, timbre: 稚嫩明亮, pace: 稍快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 王后的临别礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位老王后，丈夫去世已经很多年了。她有一个美丽的女儿。公主长大后，同远方的一位王子订了婚。婚期一天天近了，她就要离开故国，前往新郎的国度。
        - id: ch01-b02
          speaker: narrator
          text: 王后十分疼爱女儿。她为公主备好许多贵重的行李，还有金银首饰、珠宝和玩物。王家新娘出嫁需要什么，她就准备什么，一样也没有少。她又派一名侍女沿途服侍，把公主平安送到王子身边。两人各有一匹马，公主骑的那匹叫法拉达，还会开口说话。
        - id: ch01-b03
          speaker: narrator
          text: 临行前，王后走进寝室，用一把小刀割破手指，再把白布托在指下，让三滴鲜血落到布上。随后，她把白布交给女儿。
        - id: ch01-b04
          speaker: old_queen
          text: 好孩子，一定要收好这块布。路上也许用得着。
        - id: ch01-b05
          speaker: narrator
          text: 母女俩难过地道了别。公主把白布塞进衣襟，骑上法拉达，和侍女一起踏上了远行的路。
    - id: ch02
      title: 溪水边的背叛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 大约走了一个钟头，公主渴了。前面正好有一条溪，她便请侍女取水。
        - id: ch02-b02
          speaker: princess
          text: 请你下马，用我的金杯从那条溪里盛些水来。我想喝水。
        - id: ch02-b03
          speaker: waiting_maid
          text: 你渴了就自己下马，趴到水边去喝。我再也不伺候你了。
        - id: ch02-b04
          speaker: narrator
          text: 公主渴得实在难受，只好下马，俯身直接喝溪里的水。侍女连金杯也不准她用。公主一边喝，一边低声叹息。
        - id: ch02-b05
          speaker: princess
          text: 天哪，我该怎么办？
        - id: ch02-b06
          speakers: [blood_drop_1, blood_drop_2, blood_drop_3]
          ensemble: chorus
          text: 倘若母亲知道，她的心定会痛成两半。
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: 公主性情温顺，听了侍女那些无礼的话，也一句没有责怪，只默默骑上法拉达。她们又走了好几英里。天气炎热，太阳毒辣辣地晒在身上，公主很快又口渴难耐。来到一条小河旁，她早已把先前的恶言忘在脑后，又请侍女取水。
        - id: ch02-b08
          speaker: princess
          text: 请你下马，用我的金杯盛水给我喝。
        - id: ch02-b09
          speaker: waiting_maid
          text: 要喝水，你就自己下来取。我说过，我不再当你的仆人。
        - id: ch02-b10
          speaker: narrator
          text: 公主渴得没有办法，只得下马。她俯向河水，边哭边喝。
        - id: ch02-b11
          speaker: princess
          text: 天哪，我该怎么办？
        - id: ch02-b12
          speakers: [blood_drop_1, blood_drop_2, blood_drop_3]
          ensemble: chorus
          text: 倘若母亲知道，她的心定会痛成两半。
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: 公主俯得太低，藏着三滴血的白布从胸前滑下来，顺水漂走了。她满心忧愁，什么也没察觉。侍女却看见了，心中暗喜。她知道，公主失去了白布的庇护，已经软弱无力，再也反抗不了自己。
        - id: ch02-b14
          speaker: narrator
          text: 公主正要再骑法拉达，侍女拦住了她。
        - id: ch02-b15
          speaker: waiting_maid
          text: 从现在起，法拉达归我骑。你去骑我的马。
        - id: ch02-b16
          speaker: narrator
          text: 公主连这件事也只能听从。侍女又恶狠狠地逼她脱下王室的华服，换上自己的粗布衣裳。最后，她逼公主对天发誓，到了王宫也不许对任何人说出真相。公主要是不发誓，她当场就会取走公主的性命。公主只得起誓。法拉达看见了这一切，也全都牢牢记在心里。
    - id: ch03
      title: 假新娘与法拉达
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 从此，侍女骑着法拉达，真正的新娘却骑那匹差马。她们终于来到王宫的庭院，宫里上下一片欢腾。王子飞奔出来，把侍女错当成新娘，扶她下马，领进楼上的寝宫。真正的公主无人理会，只能独自留在庭院里。
        - id: ch03-b02
          speaker: narrator
          text: 老国王从窗口看见了她。姑娘虽然穿着仆人的衣裳，却又温柔，又甜美，模样也十分动人。国王心里起了疑，马上去问那位假新娘。
        - id: ch03-b03
          speaker: old_king
          text: 你带来的那个姑娘是谁？为什么把她一个人留在院子里？
        - id: ch03-b04
          speaker: waiting_maid
          text: 她只是陪我赶路来的。给她找点活儿吧，别让她闲着。
        - id: ch03-b05
          speaker: narrator
          text: 国王手边没有适合她的差事，一时也想不到该派她做什么，后来才记起有个名叫柯德金的小少年，专门照看鹅群。
        - id: ch03-b06
          speaker: old_king
          text: 那就让她去帮柯德金放鹅吧。
        - id: ch03-b07
          speaker: narrator
          text: 就这样，真正的新娘成了牧鹅姑娘。没过多久，假新娘向王子提出一个请求。
        - id: ch03-b08
          speaker: waiting_maid
          text: 亲爱的丈夫，你愿意答应我一件事吗？
        - id: ch03-b09
          speaker: prince
          text: 当然愿意。
        - id: ch03-b10
          speaker: waiting_maid
          text: 叫屠夫砍掉我来时骑的那匹马的头吧。它一路上实在坏透了。
        - id: ch03-b11
          speaker: narrator
          text: 其实，假新娘是怕法拉达开口，揭穿她怎样欺负公主。她得偿所愿，忠诚的法拉达就要被杀死了。
        - id: ch03-b12
          speaker: narrator
          text: 公主听到消息，偷偷去找屠夫，许给他一枚金币，请他帮自己做一件事。城里有一座高大阴暗的城门，她每天早晚都要赶着鹅群从那里经过。公主求屠夫行行好，把法拉达的头挂在城门上，让她每天经过时还能再见它一面。屠夫答应了。法拉达死后，他把马头牢牢钉在城门上方。
    - id: ch04
      title: 牧鹅姑娘的金发
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天一早，公主和柯德金赶着鹅群穿过那座城门。她从法拉达的头下走过，抬头说道。
        - id: ch04-b02
          speaker: princess
          text: 啊，法拉达，你竟悬在这里。
          emotion: sad
        - id: ch04-b03
          speaker: falada
          text: 是你从我身下走过，美丽的公主。倘若母亲知道，她的心定会痛成两半。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 两人把鹅群赶到公地。公主坐下来，解开一头纯金般的长发。阳光一照，金发闪闪发亮。柯德金很爱看这光芒，还想拔下一根。公主不让他得手，便唤起风来。
        - id: ch04-b05
          speaker: princess
          text: 风儿，风儿，轻轻吹，吹走柯德金的帽儿。让他追过原野山岗，直到我这披散的红金长发，梳理整齐，盘成发冠。
        - id: ch04-b06
          speaker: narrator
          text: 一阵风卷走帽子，柯德金只好追过田野，又翻过山岗。等他回来，公主已经从容地梳好头发，也把长发盘成了发辫。他再没有机会拔下一根。柯德金气得一句话也不肯同她说。两人一直放鹅到傍晚才回去。
        - id: ch04-b07
          speaker: narrator
          text: 第二天，他们又赶着鹅群从城门下经过。
        - id: ch04-b08
          speaker: princess
          text: 啊，法拉达，你竟悬在这里。
          emotion: sad
        - id: ch04-b09
          speaker: falada
          text: 是你从我身下走过，美丽的公主。倘若母亲知道，她的心定会痛成两半。
          emotion: sad
        - id: ch04-b10
          speaker: narrator
          text: 到了公地，公主坐下梳头。柯德金跑过来，伸手就想抓她的金发。公主赶紧唤风。
        - id: ch04-b11
          speaker: princess
          text: 风儿，风儿，轻轻吹，吹走柯德金的帽儿。让他追过原野山岗，直到我这披散的红金长发，梳理整齐，盘成发冠。
        - id: ch04-b12
          speaker: narrator
          text: 风把帽子吹出老远，柯德金只得跑去追。等他回来，公主早已盘好金发，他仍旧一根也没有拿到。两人照看鹅群，直到天黑。
        - id: ch04-b13
          speaker: narrator
          text: 当晚，柯德金一回王宫就去找老国王。
        - id: ch04-b14
          speaker: curdken
          text: 我再也不要跟那个姑娘一起放鹅了。
          emotion: angry
        - id: ch04-b15
          speaker: old_king
          text: 为什么？
        - id: ch04-b16
          speaker: curdken
          text: 她整天只会惹我生气！每天早晨，她走到阴暗的城门下，都要跟墙上的马头说话。她说：“啊，法拉达，你竟悬在这里。”那颗头却叫她美丽的公主，还说她母亲要是知道了，心一定会痛成两半。到了公地，我一伸手想拿她一根头发，她就把风叫来，吹走我的帽子，害得我每次都要追。
          emotion: angry
    - id: ch05
      title: 铁炉听见的秘密
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 老国王吩咐柯德金，第二天仍旧照常赶着鹅群出门。清晨，国王亲自藏在阴暗的城门后，亲耳听见牧鹅姑娘向法拉达问候，也听见马头怎样回答。随后，他一路跟过田野，又躲进公地的一丛灌木后。
        - id: ch05-b02
          speaker: narrator
          text: 国王亲眼看见两个年轻人照管鹅群。过了一会儿，姑娘坐下来，解开闪着金光的头发，又开口唤风。
        - id: ch05-b03
          speaker: princess
          text: 风儿，风儿，轻轻吹，吹走柯德金的帽儿。让他追过原野山岗，直到我这披散的红金长发，梳理整齐，盘成发冠。
        - id: ch05-b04
          speaker: narrator
          text: 一阵风吹跑帽子，柯德金翻山越岭地追了过去。姑娘趁这时候安静地梳好头发，盘成发辫。国王看清了一切，又悄悄回到王宫，没有让任何人发现。
        - id: ch05-b05
          speaker: narrator
          text: 晚上，牧鹅姑娘回来，国王把她叫到一旁，问她为什么要做那些奇怪的事。
        - id: ch05-b06
          speaker: princess
          text: 我不能说。我怎敢把自己的苦楚告诉别人？我曾对天发誓，绝不泄露，否则就会丢掉性命。
          emotion: fearful
        - id: ch05-b07
          speaker: narrator
          text: 国王再三恳求，又一直追问，不肯让她安宁，可姑娘守着誓言，始终不肯透露。最后，他指了指房里的那座铁炉。
        - id: ch05-b08
          speaker: old_king
          text: 既然不能告诉我，那就把你的苦楚说给铁炉听吧。
        - id: ch05-b09
          speaker: narrator
          text: 国王离开房间。姑娘爬到铁炉旁，一边抽泣，一边把心里的苦楚全说了出来。
        - id: ch05-b10
          speaker: princess
          text: 我孤零零地坐在这里，被所有人抛下，可我本是国王的女儿。一个虚伪的侍女逼我脱掉王室的衣裳，夺走了我在新郎身边的位置，我却只能做卑微的牧鹅姑娘。倘若母亲知道，她的心定会痛成两半。
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: 老国王正站在铁炉外的烟囱旁，把每句话都听见了。他走回房间，叫公主离开铁炉，再命人给她穿上王室的华服。换好衣裳的公主美丽得惊人。
        - id: ch05-b12
          speaker: narrator
          text: 国王召来儿子，告诉他，楼上的新娘只是一个侍女，站在身旁的牧鹅姑娘才是真正的新娘。王子看见公主如此美丽，又知道她心地善良，打心底里欢喜。
        - id: ch05-b13
          speaker: narrator
          text: 宫里备下盛大的宴席，所有人都来了。新郎坐在长桌上首，公主坐在一边，侍女坐在另一边。公主的华服光彩夺目，假新娘看花了眼，竟没有认出她。
        - id: ch05-b14
          speaker: narrator
          text: 众人吃饱喝足，兴致正浓时，老国王请侍女解答一道难题。
        - id: ch05-b15
          speaker: old_king
          text: 有个人欺骗了身边所有人，你说，该怎样处置她？
        - id: ch05-b16
          speaker: narrator
          text: 国王没有说出姓名，只把公主和那名虚伪仆人的故事从头讲了一遍，最后请侍女给那个人判刑。
        - id: ch05-b17
          speaker: waiting_maid
          text: 应该剥光她的衣服，把她装进内壁钉满尖钉的木桶，再让两匹白马拖着木桶在街上来回奔跑，直到她死去。
        - id: ch05-b18
          speaker: old_king
          text: 那个人就是你。你已经给自己判了刑，就照你说的办。
        - id: ch05-b19
          speaker: narrator
          text: 判决执行以后，王子迎娶了真正的新娘。从此，两人安宁幸福地统治着这个国家。
