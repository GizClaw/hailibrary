      tts: {delivery: 轻快活泼而热心, timbre: 轻盈清亮, pace: 较快, pitch: 高音}
    swallow_2:
      display_name: 燕子乙
      tts: {delivery: 轻快温和而爽利, timbre: 轻柔清亮, pace: 较快, pitch: 高音}
