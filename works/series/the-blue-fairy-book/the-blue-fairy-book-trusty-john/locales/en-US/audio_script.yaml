  chapters:
    - id: ch01
      title: The Old King's Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, an old king became so ill that he believed he was lying on his deathbed. He sent for his favorite servant, Trusty John, who had earned that name through a lifetime of faithful service.
        - id: ch01-b02
          speaker: old_king
          text: My most trusty John, I feel that my end is near. I could die without a care if not for my son. He is still too young to make every decision alone. Promise that you will teach him all he needs to know and care for him like a father. Without that promise, I cannot close my eyes in peace.
          emotion: sad
        - id: ch01-b03
          speaker: trusty_john
          text: I will never abandon him. I will serve him faithfully, even if it costs me my life.
        - id: ch01-b04
          speaker: old_king
          text: Then I can die comforted and at peace. After my death, show him the whole castle. Let him see every room, every vault, and all the treasures inside. But never show him the last room in the long passage. The portrait of the Princess of the Golden Roof is hidden there. If he sees it, he will fall violently in love and faint. He will face many dangers for her sake, so you must protect him from it.
        - id: ch01-b05
          speaker: narrator
          text: Trusty John gave the King his hand and made the promise once more. Then the old man fell silent, laid his head upon the pillow, and died.
        - id: ch01-b06
          speaker: narrator
          text: After the old King had been carried to his grave, Trusty John went to the young King. He told him about the promise he had made beside his father's deathbed.
        - id: ch01-b07
          speaker: trusty_john
          text: I will keep my word. I will be as faithful to you as I was to your father, even if it costs me my life.
    - id: ch02
      title: The Forbidden Portrait
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the time of mourning had ended, Trusty John told the young King it was time to see his inheritance. He led him through the ancestral castle, showing him splendid rooms and every kind of treasure. Only one door remained closed.
        - id: ch02-b02
          speaker: narrator
          text: Behind that door hung the forbidden portrait, placed so that anyone entering would look straight at it. It was painted so beautifully that the maiden seemed alive and moving. Nothing in the whole world looked more lovable or lovely.
        - id: ch02-b03
          speaker: young_king
          text: Why do you always pass this door? Why have you never opened it for me?
        - id: ch02-b04
          speaker: trusty_john
          text: There is something inside that would fill you with horror.
        - id: ch02-b05
          speaker: young_king
          text: I have seen the rest of the castle, and I mean to know what is in here too.
        - id: ch02-b06
          speaker: narrator
          text: The King stepped toward the door and tried to force it open, but Trusty John held him back.
        - id: ch02-b07
          speaker: trusty_john
          text: Before your father died, I promised that you would never see what this room contains. It could bring terrible grief to both of us.
        - id: ch02-b08
          speaker: young_king
          text: No. If I cannot enter, that will destroy me for certain. I will have no peace by day or night until I see it with my own eyes. I will not move from this spot until you open the door.
        - id: ch02-b09
          speaker: narrator
          text: Trusty John saw that there was no other way. With a heavy heart and many sighs, he drew the key from his great ring. He opened the door and went in first, hoping to cover the portrait. But the young King rose on tiptoe and looked over his shoulder.
        - id: ch02-b10
          speaker: narrator
          text: The moment the King saw the beautiful maiden shining with gold and precious stones, he fainted and fell to the floor. Trusty John lifted him in his arms and carried him to bed. He wondered sorrowfully what would come of the curse that had fallen upon them. Then he poured wine down the King's throat until he woke again.
        - id: ch02-b11
          speaker: young_king
          text: Who is the woman in that beautiful portrait?
        - id: ch02-b12
          speaker: trusty_john
          text: She is the Princess of the Golden Roof.
        - id: ch02-b13
          speaker: young_king
          text: I love her more than all the leaves in the trees could ever say, even if every leaf had a tongue. My life depends on winning her. You are my most trusty John. You must help me.
        - id: ch02-b14
          speaker: narrator
          text: Trusty John thought for a long time. Even reaching the Princess was said to be difficult. At last, he formed a plan.
        - id: ch02-b15
          speaker: trusty_john
          text: Everything around her is made of gold, from her tables and chairs to her dishes, cups, and bowls. You have five tons of gold in your treasury. Have your goldsmiths turn it into vessels, birds, wild animals, and wonderful beasts of every kind. Those things will please her. We will take them to her and try our fortune.
        - id: ch02-b16
          speaker: narrator
          text: The King called every goldsmith in the kingdom. They worked hard by day and by night until all the magnificent pieces were finished. The new treasures were loaded aboard a ship. Trusty John disguised himself as a merchant, and the King did the same, so that no one could recognize either of them. They crossed the sea and traveled until they reached the city where the Princess of the Golden Roof lived.
    - id: ch03
      title: The Golden Treasures
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Trusty John told the King to remain aboard the ship and wait for his return. John would go into the city alone and see whether his plan could bring the Princess back with him.
        - id: ch03-b02
          speaker: trusty_john
          text: I may bring the Princess back with me. Put everything in order, arrange the golden ornaments, and decorate the whole ship.
        - id: ch03-b03
          speaker: narrator
          text: Trusty John tucked a few golden pieces into his apron, went ashore, and walked straight to the palace. In the courtyard, a beautiful maiden stood beside a well, drawing water with two golden pails. As she prepared to carry the glittering water away, she turned, saw the stranger, and asked who he was.
        - id: ch03-b04
          speaker: trusty_john
          text: I am a merchant.
        - id: ch03-b05
          speaker: narrator
          text: He opened his apron and let her look inside.
        - id: ch03-b06
          speaker: ladys_maid
          text: Oh, my! What beautiful things you have made of gold!
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: She set down her pails and examined the pieces one after another.
        - id: ch03-b08
          speaker: ladys_maid
          text: The Princess must see these. She loves golden things so much that she will buy everything you have.
        - id: ch03-b09
          speaker: narrator
          text: The maiden was the Princess's lady's maid. She took Trusty John by the hand and led him into the palace.
        - id: ch03-b10
          speaker: princess
          text: Every piece is beautifully made. I will buy all of them.
        - id: ch03-b11
          speaker: trusty_john
          text: I am only the servant of a wealthy merchant. These few pieces are nothing beside the goods my master keeps aboard his ship. No one has ever made finer or more costly work in gold.
        - id: ch03-b12
          speaker: narrator
          text: The Princess asked him to bring it all to the palace.
        - id: ch03-b13
          speaker: trusty_john
          text: There is far too much. Carrying it here would take many days, and it would fill so many rooms that your palace could not hold it.
        - id: ch03-b14
          speaker: narrator
          text: The more Trusty John spoke of the treasures, the more the Princess wanted to see them. Her desire and curiosity grew so strong that at last she decided to go to the ship herself.
        - id: ch03-b15
          speaker: princess
          text: Then take me to the ship. I will go myself and see your master's treasures.
        - id: ch03-b16
          speaker: narrator
          text: Trusty John was delighted and brought her aboard. When the King saw her, she was even more beautiful than her portrait. He felt as if his heart might burst. The Princess stepped onto the ship, and the King led her below while Trusty John stayed with the steersman.
        - id: ch03-b17
          speaker: trusty_john
          text: Push away from shore. Raise every sail, and let us fly over the sea like a bird through the air.
        - id: ch03-b18
          speaker: narrator
          text: Below deck, the King showed the Princess every golden treasure, one piece after another. She saw the dishes, cups, bowls, birds, wild animals, and all the wonderful beasts. Many hours passed while she admired them. She was so happy among the treasures that she never noticed the ship leaving the harbor and sailing farther away.
        - id: ch03-b19
          speaker: narrator
          text: After she had seen the last piece, she thanked the merchant and went to return home. At the ship's side, she discovered that land was far behind them and the ship was racing across the open sea under full sail.
        - id: ch03-b20
          speaker: princess
          text: Oh! You have deceived me and carried me away. I have been betrayed into a merchant's power. I would rather have died!
          emotion: fearful
        - id: ch03-b21
          speaker: narrator
          text: The King took her hand.
        - id: ch03-b22
          speaker: young_king
          text: I am not a merchant. I am a king, born to a rank as high as yours. I carried you away by this trick because I loved you so deeply. The first time I saw your portrait, I fainted and fell to the floor.
        - id: ch03-b23
          speaker: narrator
          text: His words comforted the Princess. Her heart turned toward him, and she willingly agreed to become his wife.
    - id: ch04
      title: The Ravens' Warning
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, while the ship crossed the open sea, Trusty John sat near the bow and played his fiddle. Three ravens flew toward him. He stopped playing and listened, because he understood their language.
        - id: ch04-b02
          speaker: raven_one
          text: Aha! So he is taking the Princess of the Golden Roof home.
        - id: ch04-b03
          speaker: raven_two
          text: Yes, but he has not truly won her yet.
        - id: ch04-b04
          speaker: raven_three
          text: He has. She is sitting beside him on the ship.
        - id: ch04-b05
          speaker: raven_one
          text: That will not save him. When they land, a chestnut horse will rush out to meet them. The King will want to mount it. If he does, it will gallop away and vanish into the air. He will never see his bride again.
        - id: ch04-b06
          speaker: raven_two
          text: Is there any way to save him?
        - id: ch04-b07
          speaker: raven_one
          text: Yes. Someone else must leap onto the horse, take the pistol from its holster, and shoot the animal dead. Then the young King will be safe. But who would do it? Anyone who knows this secret and tells him will turn to stone from the feet up to the knees.
        - id: ch04-b08
          speaker: raven_two
          text: I know another danger. Even if the horse is killed, the young King may still lose his bride. Inside the palace, they will find a wedding shirt waiting in a cupboard. It will seem to be woven from gold and silver, but it is really made of sulfur and tar. If the King puts it on, it will burn him to the marrow of his bones.
        - id: ch04-b09
          speaker: raven_three
          text: Can he escape that danger?
        - id: ch04-b10
          speaker: raven_two
          text: Yes. Someone wearing gloves must seize the shirt and throw it into the fire. Once it burns, the King will be safe. But whoever knows the secret and tells it will turn to stone from the knees to the heart.
        - id: ch04-b11
          speaker: raven_three
          text: I know one danger more. Even if the wedding shirt is burned, the King still may not keep his bride. During the dance after the wedding, the young Queen will suddenly turn deathly pale and fall as if she were dead. Someone must lift her, draw three drops of blood from her right side, and spit them out. Otherwise, she will die. But anyone who knows this secret and reveals it will turn entirely to stone, from the crown of the head to the soles of the feet.
        - id: ch04-b12
          speaker: narrator
          text: The ravens finished speaking and flew onward. Trusty John had heard and understood every word. From that moment, he sat sad and troubled. If he kept silent about the warnings, he would leave his master to disaster. Yet if he took the King into his confidence and revealed the secrets, he would give up his own life.
        - id: ch04-b13
          speaker: trusty_john
          text: I will stand by my master, even if it destroys me.
    - id: ch05
      title: Three Dangers
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As they came near the shore, everything happened just as the ravens had foretold. A splendid chestnut horse bounded forward to greet them.
        - id: ch05-b02
          speaker: young_king
          text: Excellent! This horse shall carry me to my palace.
        - id: ch05-b03
          speaker: narrator
          text: The King was about to mount, but Trusty John moved first. He sprang onto the horse, snatched the pistol from its holster, and shot the animal dead.
        - id: ch05-b04
          speakers: [servant_one, servant_two]
          ensemble: duo
          text: What a wicked thing to do! He killed the beautiful horse that was meant to carry the King home.
        - id: ch05-b05
          speaker: young_king
          text: Be silent and leave him alone. He is still my most trusty John. Who can say what good reason he had for doing it?
        - id: ch05-b06
          speaker: narrator
          text: They continued on their way and entered the palace. In the great hall stood a cupboard, and inside it lay a wedding shirt, already finished and waiting. It looked to everyone as if it had been woven from gold and silver. The young King went straight toward it and reached out to take it.
        - id: ch05-b07
          speaker: narrator
          text: Trusty John pushed him aside. With gloves on his hands, he seized the shirt, flung it into the fire, and watched it burn.
        - id: ch05-b08
          speakers: [servant_one, servant_two]
          ensemble: duo
          text: Look at that! Now he is burning the King's wedding shirt.
        - id: ch05-b09
          speaker: young_king
          text: Leave him alone. He may have done it for a good purpose. He is my most trusty John.
        - id: ch05-b10
          speaker: narrator
          text: Then the wedding was celebrated. When the dancing began, the bride stepped forward to join it. Trusty John never looked away from her face. Without warning, she turned deathly pale and dropped to the floor as if she were dead.
        - id: ch05-b11
          speaker: narrator
          text: Trusty John rushed to her at once, lifted her from the floor, and carried her into another room. There he laid her down and knelt beside her. He drew three drops of blood from her right side and spat them out. Soon she began to breathe again, opened her eyes, and returned to herself.
        - id: ch05-b12
          speaker: narrator
          text: The young King had seen it all. He did not know why Trusty John had acted that way, and he flew into a rage.
        - id: ch05-b13
          speaker: young_king
          text: Throw him into prison!
          emotion: angry
        - id: ch05-b14
          speaker: narrator
          text: The next morning, Trusty John was judged and condemned to hang. When he stood upon the gallows, he asked to speak.
        - id: ch05-b15
          speaker: trusty_john
          text: Every person sentenced to die may speak once before death. Do I have that right as well?
        - id: ch05-b16
          speaker: young_king
          text: Yes. You may speak.
        - id: ch05-b17
          speaker: trusty_john
          text: I have been condemned unjustly, for I have always been faithful to you.
        - id: ch05-b18
          speaker: narrator
          text: He told the King everything he had heard at sea. First he explained the chestnut horse and why he had shot it. Then he explained the deadly wedding shirt and why he had burned it. Last, he told how the Queen would have died unless he drew the three drops of blood. Each strange act had been necessary to save his master. As he revealed the first secret, stone covered him to the knees. After the second, it reached his heart. When he told the final secret, his whole body turned to stone.
        - id: ch05-b19
          speaker: young_king
          text: Oh, my most trusty John! Forgive me! Forgive me! Take him down!
          emotion: sad
        - id: ch05-b20
          speaker: narrator
          text: But by the time the King spoke the last word, Trusty John had fallen lifeless to the ground. He was a statue of stone.
    - id: ch06
      title: The Stone Statue
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The King and Queen were overcome with despair.
        - id: ch06-b02
          speaker: young_king
          text: How terribly I have repaid such great faithfulness!
          emotion: sad
        - id: ch06-b03
          speaker: narrator
          text: He had the stone figure lifted and placed in his bedroom beside the bed. Whenever he looked at it, he wept.
        - id: ch06-b04
          speaker: young_king
          text: Oh, if only I could bring you back to life, my most trusty John!
          emotion: sad
        - id: ch06-b05
          speaker: narrator
          text: In time, the Queen gave birth to twin sons. The two little boys grew and flourished, and they brought her constant joy.
        - id: ch06-b06
          speaker: narrator
          text: One day, the Queen went to church. The children stayed behind and played beside their father. The King looked at the stone statue again and sighed with grief.
        - id: ch06-b07
          speaker: young_king
          text: Oh, if only I could bring you back to life, my most trusty John!
          emotion: sad
        - id: ch06-b08
          speaker: trusty_john
          text: You can restore me to life, if you are willing to sacrifice what you love most.
        - id: ch06-b09
          speaker: young_king
          text: I will give up everything I have in the world for you.
        - id: ch06-b10
          speaker: trusty_john
          text: With your own hand, you must cut off the heads of your two children and spread their blood upon me. Then I will return to life.
        - id: ch06-b11
          speaker: narrator
          text: The King was horrified when he heard what he must do. He would have to put his own children to death. But then he remembered Trusty John's great faithfulness and how John had given his life to save him. The King drew his sword. With his own hand, he cut off the heads of both children.
        - id: ch06-b12
          speaker: narrator
          text: He spread their blood upon the stone. At once, life returned, and Trusty John stood before him again, safe and well.
        - id: ch06-b13
          speaker: trusty_john
          text: Your faithfulness will have its reward.
        - id: ch06-b14
          speaker: narrator
          text: Trusty John lifted the children's heads, set them back upon their bodies, and spread their blood over the wounds. In a moment, both boys were whole again. They jumped about as if nothing had happened.
        - id: ch06-b15
          speaker: narrator
          text: The King was filled with joy. Then he saw the Queen returning, so he hid Trusty John and the two children inside a large cupboard.
    - id: ch07
      title: Faithfulness Rewarded
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: When the Queen entered, the King asked her a question.
        - id: ch07-b02
          speaker: young_king
          text: Did you pray while you were at church?
        - id: ch07-b03
          speaker: princess
          text: Yes, but I kept thinking of Trusty John and everything he suffered for us.
        - id: ch07-b04
          speaker: young_king
          text: Dear wife, we can bring him back to life, but the price is our two little sons. We would have to sacrifice them.
        - id: ch07-b05
          speaker: narrator
          text: The Queen turned white, and her heart sank.
        - id: ch07-b06
          speaker: princess
          text: We owe him that sacrifice because he was so faithful to us.
          emotion: sad
        - id: ch07-b07
          speaker: narrator
          text: The King rejoiced to hear that she had made the same choice he had made. He went to the large cupboard and opened its door. Then he brought out Trusty John and both of their little sons.
        - id: ch07-b08
          speaker: young_king
          text: God be praised! Trusty John is free once more, and our two little sons are with us again.
          emotion: happy
        - id: ch07-b09
          speaker: narrator
          text: The King told the Queen everything that had happened.
        - id: ch07-b10
          speaker: narrator
          text: And they all lived together happily ever afterward.
