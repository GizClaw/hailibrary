  chapters:
    - id: ch01
      title: Three Daughters Seek Their Fortunes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: They sang many hunting songs, songs of sport and merriment. Then their voices softened for the love and shelter of Scotland. Next came a wilder tune, "The Black, Black Bull of Norroway!" All at once, the candles went dark, and the minstrels stopped playing.
        - id: ch01-b02
          speaker: narrator
          text: Long ago in Norroway, a lady lived with her three daughters. One day, the eldest went to her mother.
        - id: ch01-b03
          speaker: eldest_daughter
          text: Mother, bake me a bannock and roast me a piece of meat. I'm going away to seek my fortune.
        - id: ch01-b04
          speaker: narrator
          text: Her mother did as she asked. Then the eldest daughter went to an old washerwoman who was also a witch and told her what she meant to do. The old woman had her stay and look through the back door each day. For two days, the girl saw nothing. On the third, she saw a coach drawn by six horses coming along the road, and she hurried in with the news.
        - id: ch01-b05
          speaker: washerwife
          text: Well, that one has come for you.
        - id: ch01-b06
          speaker: narrator
          text: They put the eldest daughter into the coach, and away it galloped.
        - id: ch01-b07
          speaker: narrator
          text: Then the second daughter spoke to her mother.
        - id: ch01-b08
          speaker: second_daughter
          text: Mother, make me a bannock and roast me some meat. I'm off to find my fortune too.
        - id: ch01-b09
          speaker: narrator
          text: Her mother did so, and the second daughter followed her sister to the old woman. On the third day, she looked through the back door and saw a coach with four horses coming down the road.
        - id: ch01-b10
          speaker: washerwife
          text: There it is. That coach is for you.
        - id: ch01-b11
          speaker: narrator
          text: They helped her inside, and off she went.
        - id: ch01-b12
          speaker: narrator
          text: At last, the youngest daughter came to her mother.
        - id: ch01-b13
          speaker: youngest_daughter
          text: Mother, please bake me a bannock and roast me a piece of meat. I mean to go and seek my fortune.
        - id: ch01-b14
          speaker: narrator
          text: Once again, the mother prepared the food, and her daughter went to the old witch. The girl watched at the back door for two days and saw nothing. On the third day, she came back saying that all she had seen was a huge Black Bull roaring along the road.
        - id: ch01-b15
          speaker: washerwife
          text: Well now, the bull is the one for you.
        - id: ch01-b16
          speaker: narrator
          text: The youngest daughter nearly lost her senses from grief and terror. Even so, they lifted her onto the bull's back, and away the two of them went.
    - id: ch02
      title: The Bull's Three Brothers
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They traveled on and on until the young woman grew faint with hunger.
        - id: ch02-b02
          speaker: black_bull
          text: Eat from my right ear and drink from my left. Save whatever you do not finish.
        - id: ch02-b03
          speaker: narrator
          text: She obeyed him and felt wonderfully refreshed. They rode a long, hard way before a great and beautiful castle came into sight.
        - id: ch02-b04
          speaker: black_bull
          text: We must stay over there tonight. My eldest brother lives in that castle.
        - id: ch02-b05
          speaker: narrator
          text: Soon they arrived. The people there lifted the young woman from the bull's back and welcomed her inside. The bull was sent to a park for the night. When he returned in the morning, they led her into a bright and shining parlor. There they gave her a lovely apple. They warned her not to break it open until she faced the greatest trouble any mortal could know. Then it would bring her out of that trouble.
        - id: ch02-b06
          speaker: narrator
          text: They set her on the bull again. She rode farther than anyone could tell, until another castle appeared in the distance. It was much more beautiful than the first and much farther away.
        - id: ch02-b07
          speaker: black_bull
          text: We will spend tonight there. That is where my second brother lives.
        - id: ch02-b08
          speaker: narrator
          text: They reached the castle at once. Again, the people took her in while the bull passed the night in a field. In the morning, they brought her to a fine, richly furnished room and gave her the loveliest pear she had ever seen. She must keep it whole until she was in the worst trouble a mortal could face. Only then would it save her.
        - id: ch02-b09
          speaker: narrator
          text: The young woman mounted the bull once more. They went a long and weary way, until they saw the largest and most distant castle yet.
        - id: ch02-b10
          speaker: black_bull
          text: That is where we will stay tonight. My youngest brother lives there.
        - id: ch02-b11
          speaker: narrator
          text: Once more, the people of the castle lifted her down and brought her indoors, while the bull went out to a field. In the morning, they took her to the finest room of all. They gave her a plum and told her to keep it unbroken until her need was greater than any mortal's. Then it would deliver her. When the bull came back, they placed her on his back, and the journey began again.
    - id: ch03
      title: The Dark Glen and the Glass Hill
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On and on they rode until they entered a dark and dreadful glen. There the bull stopped, and the young woman climbed down.
        - id: ch03-b02
          speaker: black_bull
          text: You must wait here while I go and fight the devil. Sit on that stone, and do not move a hand or a foot until I return. If you move, I will never be able to find you again. When everything around you turns blue, you will know I have beaten him. But if all of it turns red, then he has beaten me.
        - id: ch03-b03
          speaker: narrator
          text: She sat on the stone. After a while, everything around her turned blue. Joy swept over her, for her companion had won. Without thinking, she raised one foot and crossed it over the other. The bull came back and searched for her, but he could not find her anywhere.
        - id: ch03-b04
          speaker: narrator
          text: She remained there a long time, weeping until she could bear it no longer. At last, she rose and wandered away without knowing where to go. Her path brought her to a great hill made of glass. She tried with all her strength to climb it, but she could not.
        - id: ch03-b05
          speaker: narrator
          text: Still sobbing, she walked around the foot of the hill and searched for a way across. At last, she found a smith's house.
        - id: ch03-b06
          speaker: smith
          text: Serve me for seven years, and I will make you a pair of iron shoes. With those shoes, you can climb over the glass hill.
        - id: ch03-b07
          speaker: narrator
          text: She served the smith for seven years. At the end of that time, he gave her the iron shoes, and she climbed the glass hill.
    - id: ch04
      title: The Bloody Shirts
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Beyond the hill, she happened upon the old washerwoman's home once more. There she heard of a gallant young knight who had sent several bloodstained shirts to be washed. The woman who cleaned those shirts would become his wife.
        - id: ch04-b02
          speaker: narrator
          text: The old washerwoman scrubbed until she was tired. Then her daughter tried, and after that they worked together. Both hoped to win the knight, but no matter how fiercely they washed, not one stain came out.
        - id: ch04-b03
          speaker: narrator
          text: At last, they made the stranger try. The moment the young woman began to wash, every stain came away, and the shirts became clean and pure. But the old washerwoman told the knight that her own daughter had done it. The knight and the washerwoman's eldest daughter were soon promised in marriage.
        - id: ch04-b04
          speaker: narrator
          text: The stranger was beside herself at the thought, for she loved the knight deeply. Then she remembered the apple. When she broke it open, she found it filled with gold and precious jewels, richer than any she had ever seen.
        - id: ch04-b05
          speaker: youngest_daughter
          text: I will give you every one of these treasures if you delay the wedding for one day and let me spend tonight alone in his room.
        - id: ch04-b06
          speaker: narrator
          text: The washerwoman's daughter agreed. Meanwhile, her mother prepared a sleeping drink and gave it to the knight. He drank it and did not wake until morning. All through the long night, the young woman sobbed and sang beside him.
        - id: ch04-b07
          speaker: youngest_daughter
          text: Seven long years I served for you. The glassy hill I climbed for you. The bloody shirt I wrung for you. Will you not wake and turn to me?
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: The next day, grief left her at a loss. She broke open the pear and found jewels far richer than those in the apple.
        - id: ch04-b09
          speaker: youngest_daughter
          text: These jewels are yours if you let me spend one more night in the knight's room.
        - id: ch04-b10
          speaker: narrator
          text: Again, the daughter accepted. Again, the old woman gave the knight a sleeping drink, and he slept until morning. The young woman sighed and sang through the night just as she had before.
        - id: ch04-b11
          speaker: youngest_daughter
          text: Seven long years I served for you. The glassy hill I climbed for you. The bloody shirt I wrung for you. Will you not wake and turn to me?
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: Still he slept, and she nearly lost all hope.
    - id: ch05
      title: The Third Night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That day, while the knight was out hunting, someone in the household spoke to him.
        - id: ch05-b02
          speaker: household_member
          text: What was all that moaning and singing in your bedchamber last night?
        - id: ch05-b03
          speaker: black_bull
          text: I heard no sound at all.
        - id: ch05-b04
          speaker: narrator
          text: The others assured him that the noise had been there. So the knight made up his mind to stay awake that night and discover what he could hear.
        - id: ch05-b05
          speaker: narrator
          text: The third night came, and the young woman stood between hope and despair. She broke open the plum. It held the richest jewels of all three fruits, and she offered them for one final night in the knight's chamber. The washerwoman's daughter accepted the bargain.
        - id: ch05-b06
          speaker: narrator
          text: As before, the old woman carried the sleeping drink to the knight. This time, he stopped her.
        - id: ch05-b07
          speaker: black_bull
          text: I cannot drink this tonight unless you sweeten it first.
        - id: ch05-b08
          speaker: narrator
          text: The old woman went to fetch honey. While she was gone, the knight poured the drink away. When she returned, he let her believe he had swallowed it. The household settled down for the night, and once again the young woman began to sing.
        - id: ch05-b09
          speaker: youngest_daughter
          text: Seven long years I served for you. The glassy hill I climbed for you. The bloody shirt I wrung for you. Will you not wake and turn to me?
          emotion: sad
        - id: ch05-b10
          speaker: narrator
          text: This time, he heard her and turned toward her. She told him everything that had happened to her, and he told her all that had happened to him. Then he had the old washerwoman and her daughter burned.
        - id: ch05-b11
          speaker: narrator
          text: The knight and the young woman were married, and for all I know, they are living happily to this day.
