audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    eldest_daughter:
      display_name: 大女儿
      tts: {delivery: 爽快自信，主意已定, timbre: 清亮年轻, pace: 中等, pitch: 中高音}
    second_daughter:
      display_name: 二女儿
      tts: {delivery: 直率而满怀期待, timbre: 轻快年轻, pace: 中等, pitch: 中高音}
    youngest_daughter:
      display_name: 小女儿
      tts: {delivery: 温柔坚韧，悲伤时克制真切, timbre: 清澈年轻, pace: 舒缓有变化, pitch: 中高音}
    washerwife:
      display_name: 洗衣老婆子
      tts: {delivery: 老练冷硬，话语简短笃定, timbre: 干涩苍老, pace: 偏慢, pitch: 中低音}
    black_bull:
      display_name: 诺罗威的黑公牛
      tts: {delivery: 庄重沉着，处处护着同行的姑娘, timbre: 深沉浑厚, pace: 从容, pitch: 低音}
    household_member:
      display_name: 府中人
      tts: {delivery: 实在好奇，语气直白, timbre: 清晰平和, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 三姐妹出门寻运气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 故事开始以前，先有一支古老的歌。人们唱着狩猎，唱着猎物和欢宴。弦音忽而转为凄凉，唱起苏格兰的爱与田园，接着又变得狂放，唱起诺罗威那头黑呀黑公牛。就在这时，烛火一齐灭了，乐师也停下了手。这几句诗，出自J. 莱顿的《基尔德之驹》。
        - id: ch01-b02
          speaker: narrator
          text: 很久以前，诺罗威住着一位妇人，她有三个女儿。一天，大女儿来向母亲辞行。
        - id: ch01-b03
          speaker: eldest_daughter
          text: 母亲，请给我烤一张燕麦饼，再烤一片肉。我想到外面去碰碰运气。
        - id: ch01-b04
          speaker: narrator
          text: 母亲给她备好食物，大女儿便来到一个替人洗衣的老巫婆家，把自己的打算说了。老婆子留她住下，叫她每天从后门望出去，看看路上有什么。第一天，什么也没有。第二天，还是没有。等到第三天，一辆六匹马拉的马车终于沿路驶来。姑娘赶忙回屋报信。
        - id: ch01-b05
          speaker: washerwife
          text: 好啦，那辆车就是来接你的。
        - id: ch01-b06
          speaker: narrator
          text: 人们把大女儿接进车里，驾着马飞奔而去。接着，二女儿也来向母亲辞行。
        - id: ch01-b07
          speaker: second_daughter
          text: 母亲，也给我烤一张燕麦饼和一片肉吧。我也要出去碰碰运气。
        - id: ch01-b08
          speaker: narrator
          text: 母亲照样为她备好食物。二女儿来到老婆子家，也等到第三天，才从后门看见一辆四匹马拉的马车。
        - id: ch01-b09
          speaker: washerwife
          text: 好啦，那辆车就是来接你的。
        - id: ch01-b10
          speaker: narrator
          text: 二女儿也被接上车，动身走了。最后，轮到小女儿向母亲开口。
        - id: ch01-b11
          speaker: youngest_daughter
          text: 母亲，请给我烤一张燕麦饼，再烤一片肉。我也要出门碰碰运气。
        - id: ch01-b12
          speaker: narrator
          text: 小女儿带着母亲备好的食物来到老婆子家。头两天，她从后门望出去，路上什么也没有。第三天再看，一头硕大的黑公牛正沿路走来，边走边吼。她回屋说，自己只看见了这头公牛。
        - id: ch01-b13
          speaker: washerwife
          text: 好啦，那头公牛就是来接你的。
        - id: ch01-b14
          speaker: narrator
          text: 小女儿又悲伤又害怕，几乎要发疯了。可人们还是把她抱起来，放到黑公牛背上。就这样，她和公牛一同上了路。
    - id: ch02
      title: 黑公牛与三座城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们一直走啊走，姑娘渐渐饿得浑身发软。黑公牛察觉以后，告诉她该怎么办。
        - id: ch02-b02
          speaker: black_bull
          text: 从我的右耳朵里拿东西吃，再从左耳朵里取水喝。吃不完的，可要替我留好。
        - id: ch02-b03
          speaker: narrator
          text: 姑娘照着做了，立刻恢复了精神。此后他们又走了很久，骑过一程又一程，终于望见一座高大美丽的城堡。
        - id: ch02-b04
          speaker: black_bull
          text: 今晚咱们住在那里。我大哥就在那座城堡里。
        - id: ch02-b05
          speaker: narrator
          text: 转眼间，他们到了城堡。人们把姑娘抱下牛背，领进屋里，又把公牛送去园子过夜。第二天早晨，姑娘被带进明亮华美的客厅，得到一只漂亮的苹果。人们告诉她，除非落进世人所能遇到的最大困境，千万不要打开。真到了那一步，苹果自然会帮她脱困。
        - id: ch02-b06
          speaker: narrator
          text: 姑娘重新骑上牛背。他们走得比上回还远，望见第二座城堡。它比第一座美丽得多，也远得多。
        - id: ch02-b07
          speaker: black_bull
          text: 今晚咱们住在第二座城堡。我二哥就住在那里。
        - id: ch02-b08
          speaker: narrator
          text: 到了以后，人们照旧领姑娘进城堡，把公牛送到田野里。第二天早晨，姑娘在一间富丽堂皇的屋子里，得到一只平生所见最美的梨。人们也嘱咐她，只有身陷最大的困境，才可以打开它，让它救自己出去。
        - id: ch02-b09
          speaker: narrator
          text: 他们再次赶路，走了很久，终于望见第三座城堡。这是姑娘一路见过最宏伟，也最遥远的一座。
        - id: ch02-b10
          speaker: black_bull
          text: 今晚咱们就住在那儿。我小弟住在那座城堡里。
        - id: ch02-b11
          speaker: narrator
          text: 人们又把姑娘抱下牛背，领进城堡，让公牛去田野里过夜。第二天，她在三座城堡中最华美的屋子里，得到一只李子。嘱咐还是一样，只有到了凡人所能遭逢的最大困境，才能把它打开。等公牛回来，姑娘又被抱上他的背，两人继续向前。
        - id: ch02-b12
          speaker: narrator
          text: 他们走进一道阴暗可怕的峡谷，终于停下来。姑娘下了牛背，黑公牛要独自去做一件危险的事。
        - id: ch02-b13
          speaker: black_bull
          text: 你坐到那块石头上，等我去和魔鬼打上一场。在我回来以前，手也别动，脚也别挪，不然我再也找不到你。四周若全变成蓝色，就是我赢了。要是全变成红色，那就是魔鬼战胜了我。
        - id: ch02-b14
          speaker: narrator
          text: 姑娘在石头上坐好。过了一会儿，四周的一切都变成了蓝色。她知道伙伴打赢了，欢喜得忘了公牛的叮嘱，抬起一只脚，交叠到另一只脚上。公牛回来，四处寻找，却再也找不到她。
    - id: ch03
      title: 越过玻璃山
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘在石头上坐了很久，也哭了很久。她终于再也等不下去，只好起身漫无目的地走。走着走着，一座巨大的玻璃山挡在面前。她使尽办法，还是爬不上去，只得沿着山脚一边抽泣，一边寻找能翻过去的路。
        - id: ch03-b02
          speaker: narrator
          text: 最后，她来到一个铁匠家。铁匠答应，只要姑娘替自己做七年工，就替她打一双能爬过玻璃山的铁鞋。整整七年过去，姑娘终于穿上铁鞋，翻过了那座山。没想到，山的另一边恰好又是洗衣老婆子的住处。
        - id: ch03-b03
          speaker: narrator
          text: 那里的人告诉她，一位英俊的年轻骑士送来几件染血的衬衫，还说谁能把衣服洗干净，谁就能做他的妻子。老婆子洗到筋疲力尽，又叫女儿接着洗。母女俩洗了又洗，一心想让女儿嫁给骑士，可不管怎样用力，连一块血斑也洗不掉。
        - id: ch03-b04
          speaker: narrator
          text: 她们只得让这个外乡姑娘来试。姑娘才一动手，衣服上的血斑便退得干干净净。老婆子却骗骑士说，洗净衬衫的是自己的女儿。于是，骑士和老婆子的大女儿定下了婚事。
        - id: ch03-b05
          speaker: narrator
          text: 外乡姑娘听到消息，伤心得几乎发狂，因为她早已深深爱上了那位骑士。她想起随身带着的苹果，便把它打开。苹果里面满是黄金和珍贵首饰，比她从前见过的任何珠宝都华贵。她拿着这些宝物，去找老婆子的大女儿。
        - id: ch03-b06
          speaker: youngest_daughter
          text: 这些东西全都给你。只要你把婚礼推迟一天，再让我今夜独自进骑士的房间。
        - id: ch03-b07
          speaker: narrator
          text: 老婆子的女儿答应了。可老婆子早已调好一杯安眠药，拿给骑士喝下。骑士一直睡到第二天早晨，怎么也没有醒。漫漫长夜里，姑娘守在他身边，哭着唱了一遍又一遍。
        - id: ch03-b08
          speaker: youngest_daughter
          text: 为你服侍整七年，为你翻过玻璃山，为你洗净血衣衫。你怎不醒来，回身看我一眼？
          emotion: sad
    - id: ch04
      title: 三个夜晚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 天亮以后，姑娘悲痛得不知怎么办才好。她打开那只梨，发现里面的首饰比苹果里的贵重得多。她用这些珠宝作交换，换来第二夜进入骑士房间的许可。可是老婆子又让骑士喝了安眠药。他再次沉睡到天明，没有听见姑娘的叹息，也没有听见她整夜唱着同一支歌。
        - id: ch04-b02
          speaker: youngest_daughter
          text: 为你服侍整七年，为你翻过玻璃山，为你洗净血衣衫。你怎不醒来，回身看我一眼？
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 姑娘几乎彻底绝望。可就在那天，骑士出门打猎时，府里有人问起夜里的事。
        - id: ch04-b04
          speaker: household_member
          text: 昨夜大家都听见了，你卧房里一直有响动，还有人在哀叹。那到底是什么声音？
        - id: ch04-b05
          speaker: narrator
          text: 骑士说，自己什么也没有听见。府里的人却肯定，昨夜确实有声音。于是骑士决定，到了第三夜，无论如何也要保持清醒，听个明白。
        - id: ch04-b06
          speaker: narrator
          text: 姑娘这时一半还抱着希望，一半已经近乎绝望。她打开最后那只李子，里面的珠宝远比前两样更加华贵。她照旧拿珠宝作交换，获准第三次进入骑士的房间。
        - id: ch04-b07
          speaker: narrator
          text: 老婆子仍像前两夜一样，把安眠药端到骑士面前。骑士却说，今夜不加点甜味，他就喝不下去。老婆子转身去取蜂蜜，他立刻把药倒掉。等老婆子回来，只当他已经喝完，便放心离开了。
        - id: ch04-b08
          speaker: narrator
          text: 府里的人都上床歇息以后，姑娘又来到骑士身边，唱起那支歌。
        - id: ch04-b09
          speaker: youngest_daughter
          text: 为你服侍整七年，为你翻过玻璃山，为你洗净血衣衫。你怎不醒来，回身看我一眼？
          emotion: sad
    - id: ch05
      title: 终于重逢
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 这一回，骑士听见了歌声。他转过身，终于面对着姑娘。姑娘把自己这些年经历的一切，全都告诉了他。骑士也把两人失散以后，发生在自己身上的事，全都讲给她听。
        - id: ch05-b02
          speaker: narrator
          text: 后来，骑士命人将洗衣老婆子和她的女儿烧死。他和姑娘结了婚。据讲故事的人所知，他们直到今天还幸福地生活着。这个故事，收在钱伯斯的《苏格兰民间传说》里。
