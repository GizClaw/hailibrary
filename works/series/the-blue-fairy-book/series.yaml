cover_prompt: |-
  A wordless cover gathers a constellation of folk-tale motifs from The Blue Fairy Book in a twilight woodland surrounding a distant old castle. A young woman in a plain blue medieval gown holds a lamp beside a transformed frog, a clever cat in tall boots crosses a bridge, three bears peer from a cottage doorway, and a tiny glass slipper rests near a pumpkin and white mice. At the center, a brave child lifts a blue feather that releases a flock of small luminous birds into the air. The rising birds form the focal action and visually connect the varied tales without turning the cover into separate panels. Use a gently elevated layered composition with clear silhouettes, a winding path, and generous deep-blue sky at the top. Keep costumes broadly European and preindustrial, all figures original and child-friendly, and avoid every film or animation design. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
