  chapters:
    - id: ch01
      title: The White Pebbles
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man and his wife made their living by cutting bundles of firewood. They had seven sons. The eldest was only ten years old, and the youngest was seven.
        - id: ch01-b02
          speaker: narrator
          text: The family was desperately poor. None of the boys was old enough to earn his own bread, and feeding all seven was a heavy burden. The parents worried most about the youngest. He was tiny and frail, and he hardly ever spoke. They mistook his silence for foolishness, though it was really a sign of good sense. He had been no bigger than a thumb at birth, so everyone called him Little Thumb.
        - id: ch01-b03
          speaker: narrator
          text: Whenever anything went wrong in the house, poor Little Thumb was blamed, whether he had done it or not. Yet he was more clever and far wiser than all his brothers together. He spoke very little, but he listened and thought a great deal.
        - id: ch01-b04
          speaker: narrator
          text: Then a terrible year came. The famine grew so severe that the parents decided to get rid of their children. One evening, after the boys were in bed, the fagot-maker sat by the fire with his wife. His heart was nearly breaking as he spoke.
        - id: ch01-b05
          speaker: father
          text: You can see we cannot feed our children. I cannot sit here and watch them starve. Tomorrow, I mean to lose them in the woods. While they are busy tying up the firewood, we can slip away through the bushes before they notice.
          emotion: sad
        - id: ch01-b06
          speaker: mother
          text: Oh! How can you take your own children into the woods just to abandon them?
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: Her husband reminded her again and again how poor they were, but at first she would not agree. She was poor, but she was still their mother. At last, she imagined the grief of seeing them die of hunger. She gave in and went to bed weeping.
        - id: ch01-b08
          speaker: narrator
          text: Little Thumb had heard it all. When he noticed his parents talking so earnestly, he had crept from bed and hidden under his father's stool. From there, he could listen without being seen. Afterward he returned to bed, but he did not sleep for the rest of the night. He was thinking about what he must do.
        - id: ch01-b09
          speaker: narrator
          text: Early the next morning, he went down to the river and filled his pockets with small white pebbles. Then he hurried home.
        - id: ch01-b10
          speaker: narrator
          text: The whole family set out, and Little Thumb told his brothers nothing. They entered a forest so thick that people only ten paces apart could not see one another. The father began cutting wood while the boys gathered sticks and tied them into bundles.
        - id: ch01-b11
          speaker: narrator
          text: When the parents saw that the children were busy, they quietly slipped away. Then they ran down a side path and vanished among the twisting bushes.
        - id: ch01-b12
          speaker: narrator
          text: The boys soon discovered that they were alone, and they cried as loudly as they could. Little Thumb let them cry for a while. He knew how to return, because he had dropped his white pebbles one by one all along the road.
        - id: ch01-b13
          speaker: little_thumb
          text: Do not be afraid, brothers. Father and Mother left us here, but I can lead you home. Just follow me.
        - id: ch01-b14
          speaker: narrator
          text: His brothers followed, and Little Thumb took them back by the same way they had entered the forest. When they reached home, they were afraid to go inside. They sat by the door and listened to their parents.
        - id: ch01-b15
          speaker: narrator
          text: The moment the fagot-maker and his wife had returned, the lord of the manor sent them ten crowns he had owed them for a long time. They had never expected to receive the money. It gave them new life, because they were nearly starving. The father sent his wife straight to the butcher. Since they had not eaten meat for so long, she bought three times as much as two people needed for supper.
        - id: ch01-b16
          speaker: narrator
          text: After they had eaten, the mother looked at all the food left on the table.
        - id: ch01-b17
          speaker: mother
          text: Oh, where are our poor children now? They could have had such a feast from these leftovers. William, you were the one who wanted to lose them. I told you we would be sorry. What are they doing in the forest now? Perhaps the wolves have already eaten them! How could you abandon your own children?
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: She said more than twenty times that they would regret it and that she had warned him. At last, the fagot-maker lost patience. He threatened to beat her if she did not stop. Perhaps he was even more miserable than she was, but her repeated scolding tormented him. Like many men, he liked his wife to speak wisely, but not to keep reminding him that she had done so.
        - id: ch01-b19
          speaker: mother
          text: Oh, where are my children? Where are my poor children?
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: Her cry was so loud that the boys heard it from the gate. All seven answered together.
        - id: ch01-b21
          speakers: [peter, brother_2, brother_3, little_thumb]
          ensemble: chorus
          text: Here we are! Here we are!
        - id: ch01-b22
          speaker: narrator
          text: Their mother rushed to open the door and hugged them.
        - id: ch01-b23
          speaker: mother
          text: My dear children, I am so glad to see you! You must be hungry and tired. And poor Peter, you are covered in mud. Come inside and let me clean you.
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: Peter was the eldest. His mother loved him best because his hair was reddish, just like hers. The boys sat down to supper and ate with a tremendous appetite, which pleased both parents. As they ate, they told how frightened they had been in the forest. Nearly all of them tried to speak at once. The father and mother were overjoyed to have every child safely home again. That happiness lasted as long as the ten crowns did.
    - id: ch02
      title: Lost in the Deep Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When all the money was gone, the old worries returned. The parents decided to lose the boys a second time. To make certain they could not come back, they would take them much farther into the woods.
        - id: ch02-b02
          speaker: narrator
          text: Once again, Little Thumb overheard them. He expected to escape this danger just as he had escaped the first one. But when he rose early to gather pebbles, he found the house door locked twice over. He did not know what to do.
        - id: ch02-b03
          speaker: narrator
          text: Before they left, the father gave each boy a piece of bread for breakfast. Little Thumb thought he could use bread instead of stones. He put his piece into his pocket and dropped little bits along the path as they walked.
        - id: ch02-b04
          speaker: narrator
          text: Their parents led them into the darkest, thickest part of the forest. Then they slipped into a side path and left the children there. Little Thumb was not too worried. He believed his trail of bread would lead them home.
        - id: ch02-b05
          speaker: narrator
          text: But when he searched for the trail, he could not find a single crumb. Birds had followed the children and eaten every bit of bread. Now all seven boys were in great distress. They tried one direction and then another, but every step carried them farther from the right path. Soon they were more hopelessly lost than before.
        - id: ch02-b06
          speaker: narrator
          text: Night fell, and a violent wind rose around them. The boys were terribly afraid. From every side, they thought they heard wolves howling as they came to eat them. The children hardly dared to speak or even turn their heads.
        - id: ch02-b07
          speaker: narrator
          text: Then heavy rain soaked them through. Their feet slipped at every step. Again and again, they fell into the mud and struggled up filthy, with their hands numb from the cold.
        - id: ch02-b08
          speaker: narrator
          text: Little Thumb climbed to the top of a tree and looked in every direction. At last, far beyond the forest, he saw a tiny light like a candle. When he climbed down, he could no longer see it, and his heart sank.
        - id: ch02-b09
          speaker: narrator
          text: Still, he led his brothers toward the place where the light had shone. They walked for some time without knowing whether they were right. When they finally came out of the woods, Little Thumb saw the light again. They followed it with great difficulty, often losing sight of it whenever the ground dipped low, then finding it once more as they climbed. At last, frightened and exhausted, they reached the house where the candle burned.
        - id: ch02-b10
          speaker: narrator
          text: They knocked. A kind-looking woman opened the door and asked what they wanted.
        - id: ch02-b11
          speaker: little_thumb
          text: We are poor children who have lost our way in the forest. Please, for God's sake, let us sleep here tonight.
        - id: ch02-b12
          speaker: narrator
          text: The woman saw how young and pretty they were, and she began to weep.
        - id: ch02-b13
          speaker: ogres_wife
          text: Oh, you poor little ones! Where have you come? Do you know this house belongs to a cruel ogre who eats children?
          emotion: sad
        - id: ch02-b14
          speaker: little_thumb
          text: Oh, madam, what can we do? If you send us away, the wolves will surely eat us tonight. We would rather take our chance with the gentleman here. Perhaps he will pity us, especially if you ask him.
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: Little Thumb was trembling in every limb, and so were his brothers. The Ogre's wife hoped she could hide them from her husband until morning, so she let them in. She brought them close to a fine fire to warm themselves. A whole sheep was turning on the spit for the Ogre's supper.
    - id: ch03
      title: A Night in the Ogre's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Just as the boys began to feel warm, three or four tremendous knocks shook the door. The Ogre had come home. His wife hid the children under the bed and went to let him in.
        - id: ch03-b02
          speaker: narrator
          text: The Ogre immediately asked whether supper was ready and the wine had been poured. Then he sat at the table. The sheep was still raw and bloody, but he liked it better that way. Suddenly, he began sniffing to the right and left.
        - id: ch03-b03
          speaker: ogre
          text: I smell fresh meat.
        - id: ch03-b04
          speaker: ogres_wife
          text: You must smell the calf I just killed and skinned.
        - id: ch03-b05
          speaker: ogre
          text: I tell you, I smell fresh meat. There is something here that I do not understand.
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: He glared at his wife, rose from the table, and went straight to the bed.
        - id: ch03-b07
          speaker: ogre
          text: Ah! So this is how you mean to cheat me, you cursed woman. I might eat you too, if you were not such tough old meat. What fine game these boys will make! Three ogres I know are coming to visit in a day or two, and this will be a quick way to entertain them.
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: He reached under the bed and dragged the children out one after another. The poor boys fell to their knees and begged him to spare them. But they had fallen into the hands of one of the cruelest ogres in the world. He felt no pity at all. He looked them over so hungrily that he seemed to devour them with his eyes. Then he told his wife they would make a delicate dish once they were cooked in a good savory sauce.
        - id: ch03-b09
          speaker: narrator
          text: The Ogre took up a huge knife. Holding a great whetstone in his left hand, he sharpened the blade as he came toward them. He had already seized one child when his wife stopped him.
        - id: ch03-b10
          speaker: ogres_wife
          text: Why must you do it tonight? Tomorrow will be soon enough.
        - id: ch03-b11
          speaker: ogre
          text: Stop your chatter. They will be more tender now.
          emotion: angry
        - id: ch03-b12
          speaker: ogres_wife
          text: But you already have more meat than you need. There is a calf, two sheep, and half a hog.
        - id: ch03-b13
          speaker: ogre
          text: That is true. Feed them well so they do not grow thin, and put them to bed.
        - id: ch03-b14
          speaker: narrator
          text: The good woman was overjoyed that the children would live until morning. She served them a fine supper, though they were too frightened to eat a single bite. The Ogre returned to the table and his wine. He was highly pleased to have found such a feast for the friends who were coming to visit. He drank twelve glasses more than he usually did. The wine went straight to his head, and soon he had to stumble off to bed.
        - id: ch03-b15
          speaker: narrator
          text: The Ogre had seven young daughters. They had fine complexions because, like their father, they ate fresh meat. But their eyes were small, gray, and round. Their noses were hooked, and long sharp teeth stood far apart in their mouths. They were not yet as wicked as they might become, though they had already bitten little children so they could suck their blood.
        - id: ch03-b16
          speaker: narrator
          text: The seven girls had gone to bed early, each wearing a golden crown. In the same room stood another bed of the very same size. The Ogre's wife placed the seven boys in that bed, then went to sleep beside her husband.
        - id: ch03-b17
          speaker: narrator
          text: Little Thumb had noticed the golden crowns. He feared the Ogre might change his mind and come to kill them during the night. Around midnight, he quietly got up. He collected his brothers' bonnets and his own, then crept to the ogresses' bed.
        - id: ch03-b18
          speaker: narrator
          text: He lifted the crowns from the girls' heads and replaced them with the boys' bonnets. Then he put the golden crowns on his brothers and himself. If the Ogre came in the dark, he would mistake the boys for his daughters, and his daughters for the boys he wanted to kill.
    - id: ch04
      title: The Golden Crowns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Little Thumb's plan worked exactly as he hoped. Around midnight, the Ogre woke and regretted leaving until morning what he could have done the night before. He sprang from bed, snatched up his great knife, and started toward the children's room.
        - id: ch04-b02
          speaker: ogre
          text: Let me see how those little rogues are doing. I may as well finish the job now.
        - id: ch04-b03
          speaker: narrator
          text: He groped his way upstairs through the darkness and reached the bed where the boys lay. Every one of them was fast asleep except Little Thumb. The small boy was terribly afraid as the Ogre's hands fumbled around his head, just as they had already done around each brother's head. Then the Ogre's fingers touched the golden crowns, and he pulled back.
        - id: ch04-b04
          speaker: ogre
          text: What a fine mess I nearly made! I drank far too much last night.
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: Next, he felt his way to the girls' bed. His hands found the boys' little bonnets.
        - id: ch04-b06
          speaker: ogre
          text: Ah, my merry lads, here you are. Now I will do the job properly.
        - id: ch04-b07
          speaker: narrator
          text: Without another word, he cut the throats of all seven of his own daughters. Pleased with what he had done, he went back to bed beside his wife.
        - id: ch04-b08
          speaker: narrator
          text: As soon as Little Thumb heard him snoring, he woke his brothers and told them to dress at once and follow him. They crept down into the garden and climbed over the wall. All night they ran without knowing where they were going, trembling every step of the way.
        - id: ch04-b09
          speaker: narrator
          text: When the Ogre woke in the morning, he called to his wife.
        - id: ch04-b10
          speaker: ogre
          text: Go upstairs and dress those young rascals who came here last night.
        - id: ch04-b11
          speaker: narrator
          text: His wife was amazed by this unexpected kindness. She thought he meant for her to put the boys' clothes on them. But upstairs she found her seven daughters dead and lying in their blood.
        - id: ch04-b12
          speaker: narrator
          text: She fainted. That is the first remedy many women find in such a terrible moment. The Ogre grew impatient and went up to help her. When he saw the dreadful sight, he was just as stunned as she was.
        - id: ch04-b13
          speaker: ogre
          text: Oh! What have I done? Those wretches will pay for this at once!
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: He threw a pitcher of water over his wife's face and brought her back to her senses.
        - id: ch04-b15
          speaker: ogre
          text: Bring me my seven-league boots, quickly! I am going to catch them.
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: The Ogre put on the boots and rushed away. He searched across a vast stretch of country, first one way and then another. At last, he reached the very road where the children were walking, less than a hundred paces from their father's house.
        - id: ch04-b17
          speaker: narrator
          text: The boys saw him coming. With each stride, he crossed from one mountain to another and stepped over rivers as easily as narrow gutters. Little Thumb spotted a hollow rock nearby. He made all his brothers crawl inside, then squeezed in after them and watched carefully to see what the Ogre would do.
    - id: ch05
      title: The Seven-League Boots
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Ogre had covered an enormous distance, but his search had brought him nothing. He was completely exhausted. Seven-league boots carried their wearer far with every step, but they also made him terribly tired. He wanted nothing more than to sit down and rest. By chance, he chose the very rock where the boys were hiding.
        - id: ch05-b02
          speaker: narrator
          text: He was so weary that he soon fell asleep. After a while, he began to snore with a dreadful roar. The boys were almost as frightened as they had been when he stood over them with his great knife.
        - id: ch05-b03
          speaker: narrator
          text: Little Thumb was less afraid than his brothers. He told them to run home while the Ogre slept soundly and not to worry about him. They followed his advice and quickly reached their father's house.
        - id: ch05-b04
          speaker: narrator
          text: Then Little Thumb crept up to the sleeping Ogre. Very gently, he pulled off the seven-league boots and slipped them onto his own legs. The boots were long and huge, but they were fairy boots. They could grow or shrink to fit whoever wore them, so they fitted Little Thumb as perfectly as if they had been made for him.
        - id: ch05-b05
          speaker: narrator
          text: With the fairy boots fitted to his small legs, Little Thumb went straight back to the Ogre's house. There he found the Ogre's wife still weeping bitterly over the loss of her murdered daughters.
        - id: ch05-b06
          speaker: little_thumb
          text: Your husband is in terrible danger. A band of thieves has captured him, and they swear they will kill him unless he gives them all his gold and silver. They had their daggers at his throat when he saw me. He sent me to tell you what happened and ordered you to give me everything valuable in the house. You can see that I am wearing his boots. He lent them to me so I could reach you quickly. If you hold back even one thing, the thieves will show him no mercy.
        - id: ch05-b07
          speaker: narrator
          text: The poor woman believed every word. She was so frightened for her husband that she handed over all the gold, silver, and valuables in the house without keeping back a single thing. The Ogre ate little children, but he had always been a very good husband to her. Little Thumb took all the Ogre's money and returned to his father's house. His whole family received him with enormous joy.
    - id: ch06
      title: Another Ending to the Tale
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Many people tell this part differently. They insist that Little Thumb never stole the Ogre's money. They say he believed he could fairly take the seven-league boots, because the Ogre had used them only to chase little children. These storytellers claim to know the truth, especially since they often ate and drank at the fagot-maker's house.
        - id: ch06-b02
          speaker: narrator
          text: According to them, Little Thumb left the sleeping Ogre and went to the royal court. There he learned that everyone was anxiously waiting for news about an army two hundred leagues away and the outcome of a battle.
        - id: ch06-b03
          speaker: little_thumb
          text: Your Majesty, if you wish it, I can bring you news from the army before nightfall.
        - id: ch06-b04
          speaker: narrator
          text: The King promised him a large reward if he succeeded. Little Thumb kept his word. That very night, he returned with news from the distant army.
        - id: ch06-b05
          speaker: narrator
          text: That first journey made him famous. Afterward, he could earn whatever he wished. The King paid him generously to carry royal orders to the army, and for some time Little Thumb worked as a messenger. In this way, he gained great wealth.
        - id: ch06-b06
          speaker: narrator
          text: At last, he went home to his father. The whole family's joy at his return was beyond words. Little Thumb made them all comfortable. He bought good positions for his father and his brothers, settled them handsomely in the world, and meanwhile became perfectly successful at court.
