audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    father:
      display_name: 樵夫
      tts: {delivery: 疲惫朴实，忧愁压在心头, timbre: 粗粝成熟, pace: 中等, pitch: 中低音}
    mother:
      display_name: 樵夫妻子
      tts: {delivery: 慈爱而情绪外露, timbre: 温暖成熟, pace: 中等有变化, pitch: 中音}
    little_thumb:
      display_name: 小拇指
      tts: {delivery: 安静机敏，遇险时沉着果断, timbre: 稚嫩清亮, pace: 中等, pitch: 高音}
    peter:
      display_name: 彼得
      tts: {delivery: 诚实稚气, timbre: 清朗童声, pace: 中等, pitch: 中高音}
    brother_2:
      display_name: 二哥
      tts: {delivery: 诚实稚气, timbre: 轻柔童声, pace: 中等, pitch: 中高音}
    brother_3:
      display_name: 三哥
      tts: {delivery: 诚实稚气, timbre: 明亮童声, pace: 中等, pitch: 高音}
    ogres_wife:
      display_name: 吃人魔的妻子
      tts: {delivery: 善良忧虑，言语恳切, timbre: 浑厚成熟, pace: 稍慢, pitch: 中低音}
    ogre:
      display_name: 吃人魔
      tts: {delivery: 凶狠傲慢，带着逼人的威势, timbre: 深沉洪亮, pace: 缓慢有力, pitch: 低音}
  chapters:
    - id: ch01
      title: 白石子铺成的路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对靠砍柴过日子的夫妻。他们养了七个儿子，最大的才十岁，最小的也不过七岁。这一家穷得连饭都快吃不上，七个孩子又没有一个能挣钱。父母尤其担心最小的儿子。他又瘦又小，平时几乎不开口，大家便把他的安静当成了愚笨。其实他心里很有主意，出生时还没有人的拇指大，所以人们叫他小拇指。
        - id: ch01-b02
          speaker: narrator
          text: 家里一出差错，无论是谁闯的祸，最后总要怪到小拇指身上。不管有罪没罪，反正错的总是他。可这个常挨骂的孩子，比六个哥哥加起来还机灵，也更有智慧。他不爱说话，却什么都听，什么都想。偏偏有一年，年景坏透了，饥荒闹得非常严重。夫妻俩实在养不活孩子，竟商量着把他们丢掉。一天夜里，孩子们上床以后，樵夫和妻子守着炉火坐在一起。他难过得心都快碎了。
        - id: ch01-b03
          speaker: father
          text: 你也看见了，我们真的养不起这些孩子。我不能坐在这里，看他们一个个饿死。明天把他们带进森林吧。趁他们捆柴，我们悄悄走掉，他们不会发现的。
          emotion: sad
        - id: ch01-b04
          speaker: mother
          text: 你怎么能狠下心来，故意把自己的孩子领出去丢掉？
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 樵夫一遍遍说起家里有多穷，妻子始终不肯。她再穷也是孩子的母亲。可是一想到亲眼看着孩子饿死会有多么痛苦，她最终还是答应了，哭着上了床。他们不知道，小拇指躺在床上听见两人谈个不停，早已悄悄爬起来，藏在父亲的凳子下面。这样既不会被看见，又能把每句话听得清清楚楚。后来他重新躺下，却整夜没有合眼，只顾想着该怎么办。天一亮，他跑到河边，往两只口袋里装满白色小石子，又赶回家中。
        - id: ch01-b06
          speaker: narrator
          text: 一家人出发了。小拇指没有把秘密告诉哥哥。他们走进一片密得吓人的森林，彼此相隔十步就看不见了。父亲开始砍树，孩子们低头捡树枝，再把树枝收拢起来捆成柴把。夫妻俩等他们忙起来，一点点退进灌木，随后突然沿着一条弯曲小路逃走了。哥哥们发现父母不见，立刻放声大哭。小拇指并不慌张。一路上，他早把口袋里的白石子一颗颗丢在了身后。
        - id: ch01-b07
          speaker: little_thumb
          text: 哥哥们，别怕。爸爸妈妈虽然把我们留在这里，我却能带你们回去。跟着我走就好。
          emotion: calm
        - id: ch01-b08
          speaker: narrator
          text: 哥哥们跟着小拇指。他顺着石子，沿走进森林的原路，把大家带回了家。孩子们不敢进门，只坐在门外听父母说话。就在夫妻俩到家的时候，庄园领主忽然送来十克朗，那是他欠了许久、两人早已不指望收回的钱。两个快饿坏的人像重新活了过来。樵夫叫妻子赶快去肉铺。她太久没尝过肉味，一口气买回了足够两个人吃三顿的分量。吃饱以后，她望着剩下的肉，又想起孩子。
        - id: ch01-b09
          speaker: mother
          text: 我那些可怜的孩子，现在究竟在哪里？这些肉要是留给他们，够他们好好吃一顿了。威廉，是你非要丢下他们。我早说过，我们会后悔。说不定森林里的狼已经把他们吃了！你怎么能这样狠心？
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 她把“我们会后悔”和“我早就说过”讲了二十多遍，樵夫终于失去耐心，威胁她再不闭嘴就要挨打。其实他心里或许比妻子还难受，只是受不了她念个没完。他和许多男人一样，喜欢妻子说得有道理，却不喜欢她一直说下去。女人满脸都是眼泪，仍在大声呼喊。
        - id: ch01-b11
          speaker: mother
          text: 我的孩子们在哪里？我那些可怜的孩子啊！
          emotion: sad
        - id: ch01-b12
          speakers: [little_thumb, peter, brother_2, brother_3]
          ensemble: chorus
          text: 我们在这里！我们在这里！
        - id: ch01-b13
          speaker: narrator
          text: 母亲飞奔过去打开门，把孩子们紧紧抱住。
        - id: ch01-b14
          speaker: mother
          text: 我的宝贝，能见到你们真好！你们一定饿坏了，也累坏了。可怜的彼得，你身上全是泥。快进屋，让妈妈替你擦干净。
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 彼得是长子，头发和母亲一样微微泛红，所以母亲格外疼他。七个孩子坐下吃饭，胃口好得叫父母看着都高兴。他们几乎抢在一起，讲自己在森林里受了多少惊吓。全家团聚的快乐一直延续到十克朗花光。钱没了，旧日的忧愁也回来了。夫妻俩又决定丢掉孩子，这次还要把他们带到更远的地方。
    - id: ch02
      title: 森林尽头的灯火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 父母自以为商量得十分隐秘，还是被小拇指听见了。他料想照上次的办法就能带哥哥们脱身，于是很早便起床，准备去捡白石子。可他发现家门上了两道锁，根本出不去，一时也没了主意。父亲发给每个孩子一片面包当早饭时，小拇指才想到，可以用面包代替石子。他要把面包掰成小块，沿着经过的路撒下去，于是悄悄将自己的那片装进口袋。
        - id: ch02-b02
          speaker: narrator
          text: 父母把七个孩子领到森林最幽深、最黑暗的地方，又趁他们不留神溜上岔路。小拇指本来并不害怕，可他回头寻找记号，地上竟连一粒面包屑都没有。鸟儿已经把它们吃得干干净净。孩子们越走越偏，在森林里迷得越来越深。夜幕落下来，狂风突然大作。他们仿佛听见四面都是狼嗥，吓得连话也不敢说，头也不敢回。接着大雨倾盆，把他们从头到脚浇透。他们走一步滑一步，不停跌进泥里，爬起来时全身脏透，双手也冻得没有知觉。
        - id: ch02-b03
          speaker: narrator
          text: 小拇指爬到一棵大树顶上，转着头向四面张望。很远的森林外，终于有一点光亮，像一支小小的蜡烛。他回到地面，那点光又消失了，叫他十分难过。尽管如此，他还是领着哥哥朝刚才的方向走了很久。等他们走出树林，灯光重新出现在眼前。他们追着那点光来到一座房子前，一路害怕得不得了。途中每走进一处低地，光都会暂时不见，叫他们一次次提心吊胆。孩子们终于敲响房门，一位面目和善的女人出来问他们有什么事。
        - id: ch02-b04
          speaker: little_thumb
          text: 太太，我们是在森林里迷路的穷孩子。看在上帝的分上，请让我们住一夜吧。
        - id: ch02-b05
          speaker: narrator
          text: 女人见他们生得可爱，眼泪立刻涌了出来。
        - id: ch02-b06
          speaker: ogres_wife
          text: 可怜的孩子，你们怎么偏偏来到这里？这屋子属于一个凶残的吃人魔，他专门吃小孩子啊！
          emotion: fearful
        - id: ch02-b07
          speaker: little_thumb
          text: 好太太，我们还能怎么办呢？您若不肯收留，今晚一定会被森林里的狼吃掉。与其喂狼，我们宁可让这位老爷吃。也许他会心软，尤其是您肯替我们求情的话。
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: 吃人魔的妻子以为能把孩子藏到天亮，便放他们进屋，带到旺盛的炉火旁取暖。烤架上转着一整只羊，是吃人魔的晚餐。孩子们才刚暖和一点，门上就传来三四声巨响。吃人魔回来了。妻子急忙把七个男孩塞进床底，才去开门。吃人魔问过饭菜和酒，坐到桌边。羊肉还鲜血淋漓，根本没熟，他反而更喜欢。他把鼻子转向两边，使劲嗅着。
        - id: ch02-b09
          speaker: ogre
          text: 我闻见鲜肉了。
        - id: ch02-b10
          speaker: ogres_wife
          text: 你闻见的，一定是我刚杀好、刚剥了皮的那头小牛。
        - id: ch02-b11
          speaker: ogre
          text: 我说了，我闻见鲜肉了。这屋里藏着什么我不知道的东西。
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 吃人魔狠狠瞪了妻子一眼，从桌前站起来，径直走向那张床。
        - id: ch02-b13
          speaker: ogre
          text: 哈，原来你想骗我！你这个该死的女人，我真该把你也吃掉。算你命好，肉已经老得咬不动了。这床底下才是好野味。再过一两天，我的三个吃人魔朋友要来，正好拿这些孩子招待他们。
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: 他把孩子一个接一个拖出来。男孩们全跪下求饶，可眼前这个吃人魔凶残无比。他没有半点怜悯，早已用眼睛把他们吃了一遍，还说配上好酱汁炒熟，一定十分可口。他取来一把大刀，左手握住巨大的磨刀石，走到孩子跟前磨起刀来。眼看他已经抓住一个男孩，妻子赶紧劝阻。
        - id: ch02-b15
          speaker: ogres_wife
          text: 为什么非得今晚杀？明天再动手，不也一样来得及吗？
        - id: ch02-b16
          speaker: ogre
          text: 别啰唆。现在杀，吃起来更嫩。
        - id: ch02-b17
          speaker: ogres_wife
          text: 可家里的肉已经够多了。有一头小牛、两只羊，还有半头猪，哪还用得着杀他们？
        - id: ch02-b18
          speaker: ogre
          text: 说得也对。让他们吃个饱，别瘦下去，然后送上床睡觉。
        - id: ch02-b19
          speaker: narrator
          text: 善良的女人高兴极了，马上端来一顿好饭。孩子们却怕得一口也咽不下。吃人魔重新坐下喝酒，想到有了款待朋友的美食，得意得比平常多灌了十二杯。酒劲冲上头，他只得去睡觉。
    - id: ch03
      title: 黑夜里的金王冠
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 吃人魔也有七个孩子，全是年幼的女儿。她们像父亲一样常吃鲜肉，所以个个气色红润。不过，她们的眼睛又小又圆，颜色灰暗，鼻子像钩子，嘴里长着稀疏却又尖又长的牙齿。她们还没有坏到父亲那种地步，可已经显出很大的潜力。为了吸血，她们早就咬过别的小孩。
        - id: ch03-b02
          speaker: narrator
          text: 七个小女妖早已睡下，头上各戴着一顶金王冠。屋里还有一张同样大小的床，吃人魔的妻子把七个男孩安排在那里，自己便回丈夫身边去了。小拇指注意到了那些王冠。他怕吃人魔半夜后悔，便等到四下安静，带上自己和哥哥们的小帽，轻手轻脚走到女孩床前。他摘下七顶王冠，戴到自己和哥哥头上，再把七顶小帽给女孩戴好。吃人魔若来摸索，就会把儿子们当成自己的女儿，把亲生女儿当成要杀的男孩。
        - id: ch03-b03
          speaker: narrator
          text: 事情果真照小拇指的打算发生了。半夜，吃人魔醒了。他后悔把当晚能做完的事拖到早晨，立刻翻身下床，提起大刀。
        - id: ch03-b04
          speaker: ogre
          text: 去看看那几个小坏蛋睡得怎么样。事情就该一次办完。
        - id: ch03-b05
          speaker: narrator
          text: 吃人魔摸黑上楼，走到男孩们的床边。除了小拇指，六个哥哥都睡得很沉。他先摸过哥哥们的头，最后又在小拇指头顶摸索。小拇指怕得要命，一动也不敢动。吃人魔的手碰到一顶顶金王冠，停了下来。
        - id: ch03-b06
          speaker: ogre
          text: 我险些干出一件漂亮事来。看来昨晚真是喝多了。
        - id: ch03-b07
          speaker: narrator
          text: 他转身走向另一张床，摸到了七顶男孩的小帽。
        - id: ch03-b08
          speaker: ogre
          text: 哈，我的小淘气鬼，原来你们躲在这里！这回该好好办事了。
        - id: ch03-b09
          speaker: narrator
          text: 说完，他毫不迟疑地割断了七个亲生女儿的喉咙。吃人魔对自己做的事非常满意，又回房躺在妻子身旁。等鼾声一响，小拇指立刻叫醒哥哥，让他们穿上衣服跟自己逃走。男孩们轻轻下楼，溜进花园，翻过围墙。他们跑了整整一夜，一刻也不敢停，一直在发抖，根本不知道自己正往哪里去。
        - id: ch03-b10
          speaker: narrator
          text: 天亮以后，吃人魔醒来，叫妻子上楼给昨晚那些小混蛋穿好衣服。妻子不明白这句“穿衣服”的真正意思，还惊讶丈夫为什么突然变得好心。她走进楼上的房间，看见七个女儿倒在血泊里，竟都被杀死了。她惊骇得昏倒在地。碰上这种情形，大多数女人最先想到的办法似乎都是昏过去。吃人魔嫌她耽搁太久，亲自上楼帮忙，看到眼前的惨状，也吓得呆住了。
        - id: ch03-b11
          speaker: ogre
          text: 啊！我到底干了什么？那几个小畜生要为此偿命，现在就得偿命！
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: 他把一罐水全泼到妻子脸上。等她醒来，吃人魔立刻催促她。
        - id: ch03-b13
          speaker: ogre
          text: 快把我的七里靴拿来！我要追上他们！
          emotion: angry
    - id: ch04
      title: 吃人魔的七里靴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 吃人魔穿上七里靴，忽而向东，忽而向西，跑过了大片土地。最后，他终于来到孩子们逃走的那条路上。那里离他们父亲的家还不到一百步。男孩们远远看见他追来。吃人魔一步就能从一座山跨到另一座山，越过河流也和跨过最窄的阴沟一样轻松。小拇指发现近旁有一块中空的岩石，马上让哥哥们藏进去，自己也挤在其中。他一边躲藏，一边始终留意吃人魔接下来会怎样。
        - id: ch04-b02
          speaker: narrator
          text: 吃人魔跑了许久，却一无所获，已经累到了极点。七里靴虽然神奇，却会让穿它的人格外疲倦。他想找个地方歇脚，偏巧就在藏着七个男孩的岩石上坐下。没过多久，他睡熟了，随后打起惊天动地的鼾。哥哥们听见这声音，害怕得就像又看见那把举到头顶的大刀。小拇指却镇定得多。
        - id: ch04-b03
          speaker: little_thumb
          text: 你们快趁他熟睡跑回家，不用担心我。我会想办法脱身。
          emotion: calm
        - id: ch04-b04
          speaker: narrator
          text: 六个哥哥听从他的话，很快回到了家。小拇指走近吃人魔，轻轻脱下那双靴子，穿在自己腿上。靴子本来又长又大，可这是仙女造的宝物，能照着穿靴人的腿脚自行变大或缩小。刚一套上，它们便紧贴小拇指的脚和小腿，简直像专为他量身做成的。
        - id: ch04-b05
          speaker: narrator
          text: 小拇指立刻赶到吃人魔家里。那位善良的妻子正在为七个被丈夫亲手杀死的女儿放声痛哭。小拇指穿着吃人魔的七里靴走到她面前，告诉她一个可怕的消息。
        - id: ch04-b06
          speaker: little_thumb
          text: 你的丈夫遇上大麻烦了。他被一伙强盗抓住，那些人发誓，如果拿不到家里全部金银，就立刻杀了他。匕首已经抵在他的喉咙上，他正好看见我，便让我赶来告诉你。你必须把所有值钱的东西都交给我，一件也别留下，否则他们绝不会饶他。他还让我穿上这双靴子，好尽快赶到，也让你相信我没有说谎。你看，靴子就在我脚上。
        - id: ch04-b07
          speaker: narrator
          text: 吃人魔的妻子听见丈夫生命垂危，吓得失去了主意，把家里所有财物都交给小拇指。那个吃人魔虽然常吃小孩子，对自己的妻子倒一直很好。小拇指就这样拿到他的全部钱财，回到父亲家中，全家都欢欢喜喜地迎接他。
    - id: ch05
      title: 故事的另一种说法
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 不过，也有许多人不认同故事里的这一段。他们说，小拇指从来没有拿走吃人魔的钱。他只是觉得，脱下七里靴完全合情合理，良心也不会不安，因为吃人魔穿着这双靴子，只会去追赶小孩子。这些人一口咬定，事情就是这样。他们还拿自己常去樵夫家吃饭喝酒，作为十分可靠的证据。
        - id: ch05-b02
          speaker: narrator
          text: 照他们的说法，小拇指拿到七里靴以后便去了王宫。他听说大家正为一支远在两百里外的军队发愁。那里刚刚打过一场仗，谁也不知道胜负如何。小拇指便去见国王，答应只要国王愿意，他能在天黑以前把军中的消息带回来。
        - id: ch05-b03
          speaker: narrator
          text: 国王许诺，只要他办到，就给他一大笔钱。小拇指说到做到，当天晚上便带着战报回来了。第一趟差事让所有人都知道了他的本领。从那以后，他想接什么任务都能接到。国王给他丰厚的报酬，请他把一道道命令送往军中。
        - id: ch05-b04
          speaker: narrator
          text: 小拇指做了一阵信使，赚下许多财富，随后回到父亲家中。全家见他回来，高兴得简直说不出话。他让家人从此过上安稳日子，又替父亲和哥哥们买下官职，让他们在世上体体面面地安顿下来。至于小拇指自己，他在宫廷里也处处应对得当，深得众人喜爱。
        - id: ch05-b05
          speaker: narrator
          text: 这个故事出自夏尔·佩罗。
