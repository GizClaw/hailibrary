  chapters:
    - id: ch01
      title: The One Thing He Could Not Learn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A father once had two sons. The elder was clever and alert. He always knew what he was doing. The younger seemed unable to learn or understand a thing, and everyone who saw him wondered what a burden he would become.
        - id: ch01-b02
          speaker: narrator
          text: Whenever there was work to do, the elder son had to do it. But if the task came late at night, and the road passed a churchyard or some other ghostly place, even he refused.
        - id: ch01-b03
          speaker: elder_brother
          text: No, Father. Nothing could make me go that way. It makes me shudder.
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: In the evenings, people sat around the fire and told stories that made their flesh creep. Now and then, a listener would cry that the tale made them shudder. The younger son always sat in a corner. He heard the frightened voices and saw how the stories affected everyone, but he could never understand what they meant.
        - id: ch01-b05
          speaker: youth
          text: Everyone keeps saying, “It makes me shudder.” Nothing makes me shudder. That must be an art I cannot learn.
        - id: ch01-b06
          speaker: narrator
          text: One day his father told him that he was growing big and strong. It was time he learned to earn his bread. His brother worked hard, while every penny spent on the younger boy's education had been wasted.
        - id: ch01-b07
          speaker: youth
          text: I would gladly learn something, Father. More than anything, I want to learn how to shudder. I still do not understand it.
        - id: ch01-b08
          speaker: narrator
          text: The elder brother laughed when he heard that answer. To himself, he called the boy a hopeless fool who would never come to any good. A tree grew in the direction it was bent, he thought, and his brother had been bent the wrong way from the start.
        - id: ch01-b09
          speaker: father
          text: You may learn to shudder soon enough, but it will not help you earn a living.
        - id: ch01-b10
          speaker: narrator
          text: Soon afterward, the sexton came to visit. The father complained that his younger son was useless at everything. When asked how he meant to live, the boy had only asked to be taught to shudder.
        - id: ch01-b11
          speaker: sexton
          text: Is that all he wants? Send him to me. I can teach him, and I will soon knock some sense into him.
        - id: ch01-b12
          speaker: narrator
          text: The father was pleased with the offer. He believed a spell of firm discipline would do the youth good. So the sexton took the boy into his own house, and from then on, the youth's duty was to climb the church tower and toll the bell.
        - id: ch01-b13
          speaker: narrator
          text: A few days later, the sexton woke him at midnight and ordered him up the tower to ring. Then the sexton slipped ahead in secret, certain that this would teach the boy to shudder.
        - id: ch01-b14
          speaker: narrator
          text: At the top of the stairs, the youth turned toward the bell rope. A white figure stood across from the belfry opening.
        - id: ch01-b15
          speaker: youth
          text: Who is there?
        - id: ch01-b16
          speaker: narrator
          text: The figure neither answered nor moved.
        - id: ch01-b17
          speaker: youth
          text: Answer me or go away. You have no business here at this hour.
        - id: ch01-b18
          speaker: narrator
          text: The sexton stayed perfectly still so the youth would take him for a ghost.
        - id: ch01-b19
          speaker: youth
          text: What do you want? If you are an honest man, speak. If you do not, I will knock you down the stairs.
        - id: ch01-b20
          speaker: narrator
          text: The sexton did not believe he meant it. He stood silent, as still as stone. The youth called a third time. When there was still no answer, he rushed at the figure and knocked it down the stairs. It tumbled about ten steps and lay crumpled in a corner.
        - id: ch01-b21
          speaker: narrator
          text: The youth rang the bell, went home without a word, and fell asleep. The sexton's wife waited and waited for her husband. At last she grew worried and woke the boy.
        - id: ch01-b22
          speaker: sexton_wife
          text: Do you know where my husband is? He went into the tower ahead of you.
        - id: ch01-b23
          speaker: youth
          text: No. Someone was standing by the trapdoor and would not answer or leave. I thought he was a rogue, so I knocked him down. You had better see whether it was your husband. I will be very sorry if it was.
        - id: ch01-b24
          speaker: narrator
          text: The wife ran to the tower. There she found her husband lying in the corner, groaning with pain, and one of his legs was broken. She carried him down as best she could. Then she hurried straight to the youth's father, crying out against his son all the way.
        - id: ch01-b25
          speaker: sexton_wife
          text: Your son has caused a fine disaster! He threw my husband down the stairs and broke his leg. Take that good-for-nothing boy out of our house.
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: Horrified, the father hurried over and scolded his son.
        - id: ch01-b27
          speaker: father
          text: What wicked trick have you played? The evil one himself must have put it in your head.
          emotion: angry
        - id: ch01-b28
          speaker: youth
          text: Please listen, Father. I did nothing wrong. He stood there in the dark as if he meant harm. I did not know him, and I warned him three times to speak or leave.
        - id: ch01-b29
          speaker: father
          text: You bring me nothing but trouble. Get out of my sight. I want no more to do with you.
        - id: ch01-b30
          speaker: youth
          text: Gladly, Father. Let me wait until daylight. Then I will go out and learn to shudder. Once I master that art, perhaps it can earn me a living.
        - id: ch01-b31
          speaker: father
          text: Learn whatever you please. It is all the same to me. Take these fifty dollars and go into the wide world. Tell no one where you came from or who your father is. I am ashamed of you.
        - id: ch01-b32
          speaker: youth
          text: As you wish, Father. If that is all you ask, I can remember it easily.
    - id: ch02
      title: The Gallows and the Haunted Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At daybreak, the youth put all fifty dollars into his pocket. Then he left his father's house and set out alone along the hard high road. Mile after mile, he kept muttering the same wish to himself.
        - id: ch02-b02
          speaker: youth
          text: If only I could shudder. If only I could shudder.
        - id: ch02-b03
          speaker: narrator
          text: A traveler heard him. When the two came within sight of the gallows, the man pointed toward it.
        - id: ch02-b04
          speaker: traveler
          text: See that tree? Seven men hang there, learning to fly. Sit underneath them until night, and you will soon learn to shudder.
        - id: ch02-b05
          speaker: youth
          text: That sounds easy. If I learn by morning, come back and I will give you my fifty dollars.
        - id: ch02-b06
          speaker: narrator
          text: The youth sat beneath the gallows and waited for evening. The cold made him light a fire. By midnight, even the flames could not keep him warm. The wind swung the bodies together and tossed them to and fro.
        - id: ch02-b07
          speaker: youth
          text: I am freezing beside the fire. Those poor fellows up there must be shaking terribly.
        - id: ch02-b08
          speaker: narrator
          text: The youth had a tender heart and could not bear to leave them in the wind. He found a ladder, climbed it, and unhooked the bodies one after another until all seven were down. Then he stirred the fire, blew it bright, and seated them in a circle around the flames so they could warm themselves. They sat without moving, and soon the fire caught their clothes.
        - id: ch02-b09
          speaker: youth
          text: Be careful, or I will hang you up again.
        - id: ch02-b10
          speaker: narrator
          text: The dead men took no notice and let their rags burn.
        - id: ch02-b11
          speaker: youth
          text: If you will not look after yourselves, I cannot help you. I do not mean to burn with you.
        - id: ch02-b12
          speaker: narrator
          text: He hung them all back in a row, sat beside his fire, and fell asleep. In the morning the traveler returned, hoping to claim the fifty dollars.
        - id: ch02-b13
          speaker: traveler
          text: Well, now you know how it feels to shudder.
        - id: ch02-b14
          speaker: youth
          text: How could I? Those fellows never said a word. They were foolish enough to let their old rags burn.
        - id: ch02-b15
          speaker: narrator
          text: The traveler saw that he would not get the fifty dollars that morning. He went away empty-handed, saying he had never met such a person in all his life.
        - id: ch02-b16
          speaker: narrator
          text: The youth continued down the road, still wishing aloud that he could shudder. A carrier who was walking behind him began asking questions.
        - id: ch02-b17
          speaker: carrier
          text: Who are you?
        - id: ch02-b18
          speaker: youth
          text: I do not know.
        - id: ch02-b19
          speaker: carrier
          text: Where do you come from?
        - id: ch02-b20
          speaker: youth
          text: I do not know.
        - id: ch02-b21
          speaker: carrier
          text: Who is your father?
        - id: ch02-b22
          speaker: youth
          text: I am not allowed to say.
        - id: ch02-b23
          speaker: carrier
          text: Then what do you keep muttering?
        - id: ch02-b24
          speaker: youth
          text: I would give anything to shudder, but no one can teach me.
        - id: ch02-b25
          speaker: carrier
          text: What nonsense. Come with me, and I will soon put that right.
        - id: ch02-b26
          speaker: narrator
          text: The youth followed him. That evening they reached an inn. As the boy entered, he cried once more that he wished he could shudder. The landlord laughed when he heard.
        - id: ch02-b27
          speaker: landlord
          text: If that is what you want, there is a fine chance for you nearby.
        - id: ch02-b28
          speaker: landlord_wife
          text: Hush! Curiosity has cost many people their lives. It would be a terrible shame if those beautiful eyes never saw daylight again.
          emotion: fearful
        - id: ch02-b29
          speaker: youth
          text: However hard it is, I mean to learn. That is why I left home.
        - id: ch02-b30
          speaker: narrator
          text: The youth would not leave the landlord in peace until the man explained everything. A haunted castle stood in the neighborhood. Anyone who kept watch inside for three nights would have every chance to learn to shudder. The King had promised his daughter to the man brave enough to do it, and she was said to be the most beautiful maiden under the sun. A vast treasure lay hidden in the castle under the guard of evil spirits. If those spirits were defeated, the treasure would be freed and could make a poor man richer than he had ever dreamed. Many men had already gone inside. So far, not one had come out again.
        - id: ch02-b31
          speaker: narrator
          text: The youth went straight to the King and asked permission to keep watch for three nights. The King liked the look of him and allowed him three things to take inside, as long as none was alive.
        - id: ch02-b32
          speaker: youth
          text: Then give me a fire, a turning lathe, and a carving bench with its knife.
    - id: ch03
      title: The First Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day, the King had all three things carried into the castle exactly as promised. When darkness came, the youth took up his place in one of the empty rooms. He lit a bright fire, set the carving bench and its knife close beside the flames, and made himself comfortable on the turning lathe.
        - id: ch03-b02
          speaker: youth
          text: If only I could shudder. I doubt I will learn it here, either.
        - id: ch03-b03
          speaker: narrator
          text: Near midnight, he bent to stir the fire. A shriek came from one corner.
        - id: ch03-b04
          speakers: [black_cat_1, black_cat_2]
          ensemble: duo
          text: Oh, meow! We are so cold!
        - id: ch03-b05
          speaker: youth
          text: Why are you screaming, you fools? If you are cold, sit by the fire and warm yourselves.
        - id: ch03-b06
          speaker: narrator
          text: Two enormous black cats sprang fiercely out of the corner. One settled on each side of him, and both fixed their wild, fiery eyes upon his face. They stayed there until the heat had warmed their black coats. Then, without taking their eyes from him, the cats spoke together.
        - id: ch03-b07
          speakers: [black_cat_1, black_cat_2]
          ensemble: duo
          text: Friend, would you like to play cards with us?
        - id: ch03-b08
          speaker: youth
          text: Why not? First, let me see your paws.
        - id: ch03-b09
          speaker: narrator
          text: The cats stretched out their claws.
        - id: ch03-b10
          speaker: youth
          text: What long nails! Wait while I cut them off.
        - id: ch03-b11
          speaker: narrator
          text: He grabbed both cats by the neck, lifted them onto the carving bench, and screwed their paws down tight.
        - id: ch03-b12
          speaker: youth
          text: Now that I have looked at you closely, I no longer want a game of cards.
        - id: ch03-b13
          speaker: narrator
          text: He killed the cats and threw them into the water. Then black cats and black dogs poured from every nook and corner. Fiery chains clattered behind them, and their numbers filled the room so completely that the youth had no way through. They howled in the most dreadful voices, sprang into his fire, scattered the burning wood across the floor, and did all they could to put out every flame. For a while, he simply sat and watched them. At last, their wild attack became more than a joke.
        - id: ch03-b14
          speaker: youth
          text: Away with you, rabble!
        - id: ch03-b15
          speaker: narrator
          text: He swung the carving knife among the creatures. Some of them fled into the shadows. The others he struck dead, one after another, and threw out into the pond below. When the room was quiet again, he gathered the scattered embers, blew the sparks back into a bright fire, and sat down to warm himself.
        - id: ch03-b16
          speaker: narrator
          text: Before long, he could hardly keep his eyes open. A large bed stood in the corner.
        - id: ch03-b17
          speaker: youth
          text: That is exactly what I need.
        - id: ch03-b18
          speaker: narrator
          text: The moment he lay down and closed his eyes, the bed began racing around the castle.
        - id: ch03-b19
          speaker: youth
          text: Excellent! A little faster!
        - id: ch03-b20
          speaker: narrator
          text: The bed flew as if six horses were pulling it. It bounded over thresholds, raced up staircases, plunged down again, and carried him through the castle at a wild speed. Then came a great crash. The bed leaped, turned upside down, and fell over him like a mountain. The youth sent blankets and pillows flying in every direction, pushed his way out from underneath, and stood up unharmed.
        - id: ch03-b21
          speaker: youth
          text: Anyone who fancies that ride may have it now.
        - id: ch03-b22
          speaker: narrator
          text: He lay beside the fire and slept until daylight. In the morning, the King found him on the floor and thought the ghosts had killed him.
        - id: ch03-b23
          speaker: king
          text: What a pity. He was such a fine young fellow.
          emotion: sad
        - id: ch03-b24
          speaker: youth
          text: It has not come to that yet.
        - id: ch03-b25
          speaker: narrator
          text: The astonished King was delighted to see him alive and asked how the night had gone.
        - id: ch03-b26
          speaker: youth
          text: Very well. I survived one night, so I expect I can manage the other two.
        - id: ch03-b27
          speaker: narrator
          text: When the landlord saw him, his eyes opened wide.
        - id: ch03-b28
          speaker: landlord
          text: I never expected to see you alive again. Have you learned to shudder?
          emotion: surprised
        - id: ch03-b29
          speaker: youth
          text: No. It seems hopeless. If only someone could tell me how.
    - id: ch04
      title: The Second Night
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the second night, the youth returned to the old castle and took his old place beside the fire. Once again, he began his familiar wish that someone might teach him to shudder. As midnight drew close, a faint noise stirred somewhere above him. It grew louder and louder until the whole place rang with a terrible din. Then everything fell silent for a moment. At last, with one loud scream, half a man dropped down the chimney and landed in front of him.
        - id: ch04-b02
          speaker: youth
          text: Hey, up there! Send down the other half. This is not enough.
        - id: ch04-b03
          speaker: narrator
          text: The shrieking and yelling began again, and the other half fell.
        - id: ch04-b04
          speaker: youth
          text: Wait there. I will stir the fire for you.
        - id: ch04-b05
          speaker: narrator
          text: When he looked back, the pieces had joined together. A horrible man was sitting in the youth's seat.
        - id: ch04-b06
          speaker: youth
          text: I did not agree to that. The seat is mine.
        - id: ch04-b07
          speaker: narrator
          text: The man tried to shove him away. The youth pushed back harder, knocked him off, and took his place again.
        - id: ch04-b08
          speaker: narrator
          text: More men fell down the chimney, one after another. Between them, they fetched nine bare skeleton legs and two skulls. They stood the legs upright like ninepins, used the skulls as balls, and began to play. The youth watched for a while and thought the game looked entertaining. He wanted a turn too.
        - id: ch04-b09
          speaker: youth
          text: May I play too?
        - id: ch04-b10
          speakers: [ninepin_man_1, ninepin_man_2]
          ensemble: duo
          text: Yes, if you have money.
        - id: ch04-b11
          speaker: youth
          text: I have plenty, but your balls are not round enough.
        - id: ch04-b12
          speaker: narrator
          text: He put the skulls on his lathe and turned them until they were round.
        - id: ch04-b13
          speaker: youth
          text: There. They will roll better now. Let the fun begin!
        - id: ch04-b14
          speaker: narrator
          text: He joined the strange men at their game. The newly rounded skulls rolled much better, and the youth played cheerfully, though he lost a little of his money. The instant the clock struck twelve, the men, the bones, and the skulls vanished before his eyes. He stretched out and slept peacefully until morning. Then the King came back, anxious to hear what had happened.
        - id: ch04-b15
          speaker: king
          text: How did you fare this time?
        - id: ch04-b16
          speaker: youth
          text: I played ninepins and lost a few pennies.
        - id: ch04-b17
          speaker: king
          text: And you still did not shudder?
        - id: ch04-b18
          speaker: youth
          text: No such luck. I enjoyed myself. If only I knew how it felt.
    - id: ch05
      title: The Third Night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the third night, the youth sat down once more on his bench. By now, he sounded thoroughly discouraged as he repeated his wish to learn how to shudder. The hours passed. When it had grown very late, the door opened and six large men came into the room. Together they carried a coffin between them.
        - id: ch05-b02
          speaker: youth
          text: Ah, that must be my little cousin who died a few days ago. Come here, little cousin. Come along.
        - id: ch05-b03
          speaker: narrator
          text: The men set down the coffin. The youth removed the lid and found a dead man inside. His face felt cold as ice.
        - id: ch05-b04
          speaker: youth
          text: Wait. I will warm you a little.
        - id: ch05-b05
          speaker: narrator
          text: He warmed his hands over the fire, then laid them against the dead man's face. The face stayed cold. Next he lifted the body from the coffin, sat beside the flames with it across his knees, and rubbed both of its arms, hoping to make the blood flow again. That did nothing either. Then the youth remembered that two people lying close together in a bed could warm each other. He carried the corpse to the bed, tucked it beneath the covers, and lay down beside it.
        - id: ch05-b06
          speaker: narrator
          text: After a while, the body grew warm and began to move.
        - id: ch05-b07
          speaker: youth
          text: Little cousin, what would you have done if I had not warmed you?
        - id: ch05-b08
          speaker: corpse
          text: Now I will strangle you!
          emotion: angry
        - id: ch05-b09
          speaker: youth
          text: Is that how you thank me? Then you belong back in your coffin.
        - id: ch05-b10
          speaker: narrator
          text: He lifted the dead man, threw him inside, and shut the lid. The six bearers returned and carried the coffin away.
        - id: ch05-b11
          speaker: youth
          text: I simply cannot shudder. I will never learn it here, no matter how long I stay.
        - id: ch05-b12
          speaker: narrator
          text: Then an enormous old man with a white beard entered. He looked terrible.
        - id: ch05-b13
          speaker: old_spirit
          text: Miserable creature, you will soon know how it feels to shudder, because you must die.
          emotion: angry
        - id: ch05-b14
          speaker: youth
          text: Not so fast. If I must die, you will have to catch me first.
        - id: ch05-b15
          speaker: old_spirit
          text: I will catch you soon enough.
        - id: ch05-b16
          speaker: youth
          text: Do not boast. I am as strong as you are, and perhaps stronger.
        - id: ch05-b17
          speaker: old_spirit
          text: We will test that. If you are stronger, I will let you go.
        - id: ch05-b18
          speaker: narrator
          text: The old spirit led him through dark passages to a forge. He took an axe and drove one anvil deep into the earth with a single blow.
        - id: ch05-b19
          speaker: youth
          text: I can do better than that.
        - id: ch05-b20
          speaker: narrator
          text: He approached the other anvil. The old spirit leaned close to watch, and his long white beard hung down. The youth swung the axe, split the anvil, and trapped the beard inside the crack.
        - id: ch05-b21
          speaker: youth
          text: Now I have you. This time, you are the one who will die.
        - id: ch05-b22
          speaker: narrator
          text: The youth seized an iron rod and beat the trapped old spirit without mercy. At last, the creature began to whimper. He begged the youth to stop and promised to give him great riches if only he would let him go. The youth finally drew the axe from the split anvil and freed the long white beard.
        - id: ch05-b23
          speaker: narrator
          text: The spirit led him into a cellar and showed him three chests filled with gold.
        - id: ch05-b24
          speaker: old_spirit
          text: One chest belongs to the poor. One belongs to the King. The third is yours.
        - id: ch05-b25
          speaker: narrator
          text: At that instant, the clock struck twelve. The spirit vanished and left the youth alone in the dark.
        - id: ch05-b26
          speaker: youth
          text: I am sure I can find my way out.
        - id: ch05-b27
          speaker: narrator
          text: He felt his way through the passages until he reached the room, then fell asleep beside the fire.
    - id: ch06
      title: The Castle Freed
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The King came in the morning and asked whether the youth had finally learned to shudder.
        - id: ch06-b02
          speaker: youth
          text: No. What can it be? My dead cousin visited, and an old bearded man showed me heaps of money below. Still, no one has told me what shuddering is.
        - id: ch06-b03
          speaker: king
          text: You have freed the castle from its curse. Now you shall marry my daughter.
        - id: ch06-b04
          speaker: youth
          text: That is all very fine, but I still do not know how to shudder.
        - id: ch06-b05
          speaker: narrator
          text: The gold was brought out of the cellar, and the wedding was celebrated. The youth became a young King. He loved his wife dearly and was very happy, yet he never stopped repeating his old complaint.
        - id: ch06-b06
          speaker: youth
          text: If only I could shudder. If only I could shudder.
    - id: ch07
      title: At Last, a Shudder
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: At last, his endless wish drove his wife to despair. Her maid offered a solution.
        - id: ch07-b02
          speaker: maid
          text: I will help you. We will soon make him shudder.
        - id: ch07-b03
          speaker: narrator
          text: The maid went out to the stream that flowed through the garden. There she had a whole pail filled with little gudgeons and carried it back to the Princess. That night, they waited until the young King was fast asleep. His wife pulled the covers away and poured the cold water and all the little fish over him. The gudgeons wriggled and swam against him in the bed.
        - id: ch07-b04
          speaker: youth
          text: Oh, how I shudder! How I shudder, dear wife! Yes, now I know what shuddering is!
          emotion: surprised
