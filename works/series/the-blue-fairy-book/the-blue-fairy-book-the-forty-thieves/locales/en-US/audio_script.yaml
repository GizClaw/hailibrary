  chapters:
    - id: ch01
      title: The Cave of Treasure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In a Persian town lived two brothers, Cassim and Ali Baba. Cassim had married a rich wife and lived comfortably. Ali Baba supported his wife and children by cutting wood in a nearby forest and selling it in town.
        - id: ch01-b02
          speaker: narrator
          text: One day in the forest, Ali Baba saw horsemen riding toward him through a cloud of dust. Afraid they were robbers, he climbed a tree. Forty men arrived, took the bridles from their horses, and tied them among the trees. The finest-looking man, whom Ali Baba took for their captain, walked to some bushes beside the rocks.
        - id: ch01-b03
          speaker: thieves_captain
          text: Open, Sesame!
        - id: ch01-b04
          speaker: narrator
          text: A door opened in the rock. The captain sent his men inside and followed them, and the door closed by itself. Ali Baba waited in the tree, afraid they might catch him if he climbed down. At last the door opened. The captain came out first, watched all his men pass, and then spoke again.
        - id: ch01-b05
          speaker: thieves_captain
          text: Shut, Sesame!
        - id: ch01-b06
          speaker: narrator
          text: Once every thief was outside, the captain closed the door. The men bridled their horses, mounted, and rode away in the same order in which they had come, with their captain at their head.
        - id: ch01-b07
          speaker: narrator
          text: Ali Baba climbed down and went to the hidden door. Sesame, he knew, was a kind of grain. He repeated the words he had heard.
        - id: ch01-b08
          speaker: ali_baba
          text: Open, Sesame!
        - id: ch01-b09
          speaker: narrator
          text: The door flew open. Instead of a dark, miserable hole, Ali Baba found a great man-made vault, lit through an opening in its roof. Bales of silk, brocade, and other rich goods lay piled around him. There were heaps of gold and silver, and leather purses full of money.
        - id: ch01-b10
          speaker: narrator
          text: He went in, and the door closed behind him. Leaving the silver alone, he took as many bags of gold as his grazing donkeys could carry. He loaded the animals, hid the bags under bundles of sticks, closed the cave with the words "Shut, Sesame," and went home.
        - id: ch01-b11
          speaker: narrator
          text: At home he shut the yard gates, carried the bags inside, and poured the gold before his wife. He told her to keep it secret while he dug a hole to bury it.
        - id: ch01-b12
          speaker: ali_babas_wife
          text: Let me measure the gold first. While you dig, I will borrow a measure.
        - id: ch01-b13
          speaker: narrator
          text: She borrowed one from Cassim's wife. Because Ali Baba was poor, Cassim's wife wondered what grain he could possibly have to measure. She secretly pressed some suet onto the bottom of the vessel.
        - id: ch01-b14
          speaker: narrator
          text: Ali Baba's wife set the measure on the heap. She filled and emptied it again and again, delighted by the amount of gold. Then she returned the vessel. She never noticed the gold coin stuck underneath, but Cassim's wife saw it as soon as her sister had gone.
        - id: ch01-b15
          speaker: cassims_wife
          text: Cassim, your brother has more money than you do. He has so much gold that he measures it instead of counting it.
        - id: ch01-b16
          speaker: narrator
          text: Cassim demanded an explanation. His wife showed him the coin and told him how she had found it. Envy kept him awake all night, and before sunrise he went to his brother.
        - id: ch01-b17
          speaker: cassim
          text: You act as though you are poor, Ali Baba, but you measure out gold. Look at this coin.
        - id: ch01-b18
          speaker: narrator
          text: Ali Baba understood that his wife had let the secret escape. He admitted everything and offered Cassim a share.
        - id: ch01-b19
          speaker: cassim
          text: I expect a share. But you must also tell me where the treasure is. If you refuse, I will reveal everything, and then you will lose it all.
        - id: ch01-b20
          speaker: narrator
          text: Kindness more than fear made Ali Baba describe the cave and the words that opened it. Cassim left, determined to reach the treasure first and take it for himself.
    - id: ch02
      title: Cassim in the Cave
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Early the next morning, Cassim set out with ten mules carrying large empty chests. He found the rock door and called out the secret words.
        - id: ch02-b02
          speaker: cassim
          text: Open, Sesame!
        - id: ch02-b03
          speaker: narrator
          text: The door opened and closed behind him. Cassim could have stared at the treasure all day, but he hurried to gather as much as possible. When he was ready to leave, thoughts of his new riches had driven the right word from his mind.
        - id: ch02-b04
          speaker: cassim
          text: Open, Barley!
        - id: ch02-b05
          speaker: narrator
          text: The door stayed shut. He tried the names of grain after grain, but never sesame. Terror swept away the word so completely that it seemed he had never heard it.
        - id: ch02-b06
          speaker: narrator
          text: Around noon, the robbers returned and saw the laden mules wandering outside. Alarmed, they drew their swords. The captain opened the cave. Cassim heard the horses and decided to fight for his life. The moment the door moved, he sprang out and knocked the captain down. But the other robbers surrounded him and killed him with their swords.
        - id: ch02-b07
          speaker: narrator
          text: Inside, they found all the bags Cassim had gathered and left ready to carry away. They could not imagine how anyone had entered without knowing their secret. They cut his body into four parts and nailed them inside the cave. Anyone else who dared to enter would see the warning. Then the thieves rode away in search of more treasure.
        - id: ch02-b08
          speaker: narrator
          text: As evening came, Cassim's wife grew desperately anxious. She ran to Ali Baba and told him where her husband had gone. Ali Baba comforted her as well as he could, then went to the forest to search.
        - id: ch02-b09
          speaker: narrator
          text: His brother's body was the first thing he saw inside the cave. Horrified, he gathered the four parts and placed them on one donkey. He loaded two other donkeys with bags of gold, covered all three loads with bundles of wood, and returned to town. The two donkeys carrying gold went through the gates of his own yard. He led the third quietly to Cassim's house, where the slave Morgiana opened the door. Ali Baba knew her to be both brave and clever.
        - id: ch02-b10
          speaker: ali_baba
          text: This is your master's body. He was murdered, but we must bury him as though he died in his own bed. I will speak with you again. For now, tell your mistress I am here.
        - id: ch02-b11
          speaker: narrator
          text: When Cassim's wife learned what had happened, she broke into cries and tears. Ali Baba told her that she could come and live with him, his wife, and his children. In return, she must keep the secret and trust Morgiana to arrange everything. Cassim's wife agreed and tried to master her grief.
    - id: ch03
      title: Morgiana Guards the Secret
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Morgiana went to an apothecary and asked for lozenges.
        - id: ch03-b02
          speaker: morgiana
          text: My poor master can neither eat nor speak. No one knows what illness has taken hold of him.
        - id: ch03-b03
          speaker: narrator
          text: She carried the lozenges home. The next day she returned in tears and asked for an essence given only to people who were about to die. By evening, the neighborhood believed Cassim had been gravely ill. No one was surprised when Morgiana and Cassim's wife filled the house with cries and announced that he was dead.
        - id: ch03-b04
          speaker: narrator
          text: Early the following day, Morgiana found an old cobbler named Baba Mustapha near the town gates. She placed a gold coin in his hand and told him to bring his needle and thread. Then she covered his eyes with a cloth and guided him to the room where the body lay.
        - id: ch03-b05
          speaker: narrator
          text: There she removed the blindfold and asked him to sew the four parts together. When the work was done, she covered his eyes once more and led him back. Cassim was buried as if he had died naturally. Morgiana followed him to the grave, weeping and tearing her hair, while his wife mourned at home. The next day, Cassim's wife moved in with Ali Baba, and Ali Baba gave Cassim's shop to his eldest son.
        - id: ch03-b06
          speaker: narrator
          text: When the Forty Thieves next visited the cave, they were amazed to find the body gone and some bags of money missing.
        - id: ch03-b07
          speaker: thieves_captain
          text: Our secret has certainly been discovered. Unless we find the person who knows it, we are ruined. Two men knew the way in. We killed one, and now we must find the other. One of you must enter the city dressed as a traveler and learn who died in this strange fashion. If he fails, he will lose his life so that he cannot betray us.
        - id: ch03-b08
          speaker: narrator
          text: One thief volunteered, and the others praised his courage. In disguise, he entered town at daybreak and happened upon Baba Mustapha's stall.
        - id: ch03-b09
          speaker: first_scout
          text: Good morning, honest fellow. At your age, how can you see well enough to sew?
        - id: ch03-b10
          speaker: baba_mustapha
          text: I may be old, but my eyes are excellent. Why, I once stitched a dead body together in a room much darker than this.
        - id: ch03-b11
          speaker: narrator
          text: The robber could hardly believe his luck. He offered the cobbler a gold coin and asked to see the house. Baba Mustapha refused at first because he had been blindfolded. A second coin changed his mind. Perhaps, he said, the turns would come back to him if his eyes were covered again.
        - id: ch03-b12
          speaker: narrator
          text: The plan worked. At some turns, the robber guided the blindfolded cobbler. At others, Baba Mustapha remembered the way and directed him. They stopped outside Cassim's house. The robber marked its door with white chalk, said farewell to the cobbler, and hurried back to the forest, pleased with his discovery.
        - id: ch03-b13
          speaker: narrator
          text: A little later, Morgiana went outside and noticed the mark. She guessed that danger was near. Without telling her master or mistress, she took chalk and put the same mark on two or three doors on either side.
    - id: ch04
      title: The Marks on the Doors
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The scout told the thieves what he had found. Their captain thanked him and ordered him to point out the marked house. But in town they found five or six doors bearing the same mark. Their guide had no answer. When the thieves returned to the forest, they cut off his head for failing.
        - id: ch04-b02
          speaker: narrator
          text: A second robber was sent into town. He too won over Baba Mustapha and reached the right house, but this time he marked the door with red chalk. Once again, Morgiana noticed the mark and copied it onto the neighboring doors. When the captain came to town, the red marks gave him no better answer. The second scout was put to death as well.
        - id: ch04-b03
          speaker: narrator
          text: Now the captain decided to go himself. Baba Mustapha led him to the house, but the captain left no mark. Instead, he studied the building so closely that he was certain he would remember it. Back at the cave, he sent his men into nearby villages to buy nineteen mules and thirty-eight large leather jars. One jar was filled with oil. Into each of the other thirty-seven he put a fully armed robber, then rubbed oil from the full vessel over the outside of every jar.
        - id: ch04-b04
          speaker: narrator
          text: At dusk, the mules reached Ali Baba's house carrying thirty-seven hidden men and one jar of oil. The captain stopped outside, where Ali Baba sat enjoying the cool air.
        - id: ch04-b05
          speaker: thieves_captain
          text: I have brought oil from far away to sell at tomorrow's market. It is late, and I have nowhere to spend the night. Would you be kind enough to take me in?
        - id: ch04-b06
          speaker: narrator
          text: Ali Baba had seen the captain in the forest, but he did not recognize him dressed as an oil merchant. He welcomed the stranger and opened the gates for the mules. Then he asked Morgiana to prepare supper and a bed for their guest.
        - id: ch04-b07
          speaker: narrator
          text: After supper, Ali Baba returned to the kitchen to speak with Morgiana. The captain went into the yard, pretending to check his mules. Beginning with the first jar and ending with the last, he whispered the same order to every man inside.
        - id: ch04-b08
          speaker: thieves_captain
          text: When I throw pebbles from my bedroom window, cut through the jar with your knife and climb out. I will join you at once.
        - id: ch04-b09
          speaker: narrator
          text: Then the captain went back inside, and Morgiana showed him to his room.
    - id: ch05
      title: The Robbers in the Jars
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Morgiana told her fellow slave Abdallah to put on a pot of broth for Ali Baba, who had gone to bed. Then her lamp went out, and there was no oil left in the house.
        - id: ch05-b02
          speaker: abdallah
          text: Do not worry. Go into the yard and take a little oil from one of those jars.
        - id: ch05-b03
          speaker: narrator
          text: Morgiana thanked him, took the oil pot, and went outside. As she reached the first jar, a low voice came from within.
        - id: ch05-b04
          speaker: jar_robber
          text: Is it time?
        - id: ch05-b05
          speaker: narrator
          text: Another servant might have screamed on finding a man where the oil should be. Morgiana understood that her master's life was in danger, and a plan came to her.
        - id: ch05-b06
          speaker: morgiana
          text: Not yet. It will be soon.
        - id: ch05-b07
          speaker: narrator
          text: She moved from one jar to the next. Every hidden robber asked the same question, and each time she quietly gave the same answer. At last she reached the only jar that truly held oil. Now she knew that the man her master had welcomed as a merchant was the captain, and that he had brought thirty-seven armed companions into the yard.
        - id: ch05-b08
          speaker: narrator
          text: She filled her pot, relit the kitchen lamp, and returned with a large kettle. She filled it with oil and heated it until it boiled. Then she poured enough into each occupied jar to kill the man hidden there. When it was done, she put out the fire and lamp and waited in the dark.
        - id: ch05-b09
          speaker: narrator
          text: A quarter of an hour later, the captain woke and opened his window. The house seemed completely quiet. He threw small pebbles down onto the jars, just as he had promised. The stones struck the leather, but none of his men cut their way out or made a sound. His uneasiness growing, he slipped downstairs into the yard and bent over the first jar.
        - id: ch05-b10
          speaker: thieves_captain
          text: Are you asleep?
        - id: ch05-b11
          speaker: narrator
          text: He smelled the hot oil and knew his plan to murder Ali Baba and the whole household had been discovered. Every robber in the jars was dead. When he saw that the last jar had been emptied, he understood how they had died. He broke the lock on a garden door, climbed over several walls, and escaped. Morgiana watched and listened. Glad that her plan had succeeded, she went to bed.
        - id: ch05-b12
          speaker: narrator
          text: At daybreak, Ali Baba saw the jars and wondered why the oil merchant had not left with his mules. Morgiana told him to look into the first jar and see whether it held oil. The sight of a man made him jump back in terror.
        - id: ch05-b13
          speaker: morgiana
          text: Do not be afraid. He cannot hurt you. He is dead.
          emotion: calm
        - id: ch05-b14
          speaker: narrator
          text: When Ali Baba had recovered from his shock, he asked what had become of the merchant.
        - id: ch05-b15
          speaker: morgiana
          text: Merchant? He is no more a merchant than I am!
        - id: ch05-b16
          speaker: narrator
          text: She told him everything. The stranger was captain of the forest robbers, she said, and the white and red marks must have been part of their plot. Of the original forty thieves, only three were now alive.
        - id: ch05-b17
          speaker: ali_baba
          text: Morgiana, you have saved my life. From this moment, you are free.
        - id: ch05-b18
          speaker: narrator
          text: They quietly buried all the bodies in Ali Baba's garden, where no one would find them. Later, his other slaves took the nineteen mules to the market and sold them.
    - id: ch06
      title: Cogia Hassan
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The captain returned alone to the cave. Without his companions, it seemed a dreadful place. He swore to avenge them by killing Ali Baba.
        - id: ch06-b02
          speaker: narrator
          text: He dressed with care, took a room at an inn, and made many trips to the forest. Little by little, he carried away fine cloth and linen and opened a shop opposite the one belonging to Ali Baba's son. Calling himself Cogia Hassan, he was so polite and well dressed that he soon became friendly with the young man and then with Ali Baba. Again and again, he invited Ali Baba to supper.
        - id: ch06-b03
          speaker: narrator
          text: Ali Baba wished to repay this kindness. He welcomed Cogia Hassan into his home and thanked him for treating his son so well. When the merchant rose to leave, Ali Baba stopped him.
        - id: ch06-b04
          speaker: ali_baba
          text: Why hurry away, sir? Please stay and have supper with me.
        - id: ch06-b05
          speaker: narrator
          text: The merchant refused and said he had a reason. Ali Baba asked what it was.
        - id: ch06-b06
          speaker: thieves_captain
          text: Sir, I cannot eat any food that has salt in it.
        - id: ch06-b07
          speaker: ali_baba
          text: If that is all, neither the meat nor the bread tonight shall contain salt.
        - id: ch06-b08
          speaker: narrator
          text: Ali Baba took the order to Morgiana. She was astonished.
        - id: ch06-b09
          speaker: morgiana
          text: Who is this man who will not eat salt with his meat?
        - id: ch06-b10
          speaker: ali_baba
          text: He is an honest man, Morgiana. Please do as I ask.
        - id: ch06-b11
          speaker: narrator
          text: Morgiana could not resist looking at such a strange guest. She helped Abdallah carry in the dishes. One glance told her that Cogia Hassan was the robber captain, and she saw a dagger hidden beneath his clothing.
        - id: ch06-b12
          speaker: morgiana
          text: Now I understand why this wicked man will not share salt with my master. He means to kill him. But I will stop him.
        - id: ch06-b13
          speaker: narrator
          text: She sent Abdallah up with the supper while she prepared for one of the boldest deeds imaginable. After dessert, Cogia Hassan was left with Ali Baba and his son. He planned to make them drunk and then murder them.
        - id: ch06-b14
          speaker: narrator
          text: Morgiana put on a dancing girl's headdress and fastened a girdle around her waist. From it hung a silver-handled dagger.
        - id: ch06-b15
          speaker: morgiana
          text: Abdallah, bring your drum. Let us entertain our master and his guest.
        - id: ch06-b16
          speaker: narrator
          text: Abdallah played as Morgiana danced to the doorway, where she made a low bow.
        - id: ch06-b17
          speaker: ali_baba
          text: Come in, Morgiana, and show Cogia Hassan what you can do. She is my housekeeper and was once my slave.
        - id: ch06-b18
          speaker: narrator
          text: Cogia Hassan feared that his chance to kill Ali Baba had passed, but he pretended to be eager for the dance. Abdallah played while Morgiana moved through several dances. Then she drew her dagger and swept it through the air, pointing it now toward her own breast and now toward Ali Baba's, as though it were all part of the performance.
        - id: ch06-b19
          speaker: narrator
          text: At last, breathing hard, she took the drum from Abdallah in her left hand and held the dagger in her right. She offered the drum first to Ali Baba and his son, and each dropped in a gold coin. Cogia Hassan reached into his purse as she came toward him. At that instant, Morgiana drove the dagger into his heart.
        - id: ch06-b20
          speakers: [ali_baba, ali_babas_son]
          ensemble: duo
          text: Miserable girl! What have you done? You have ruined us!
          emotion: fearful
        - id: ch06-b21
          speaker: morgiana
          text: I did it to save you, master, not to ruin you. Look beneath this false merchant's robe and see his dagger. Remember how he refused to eat salt with you. This is the false oil merchant. He is the Captain of the Forty Thieves.
    - id: ch07
      title: The End of the Forty Thieves
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Ali Baba was deeply grateful that Morgiana had saved his life once again. As a reward, he offered her in marriage to his son. The young man gladly agreed, and Morgiana consented. A few days later, their wedding was celebrated with the greatest splendor.
        - id: ch07-b02
          speaker: narrator
          text: A year passed with no sign of the two robbers who remained. Ali Baba decided they must be dead and returned to the cave.
        - id: ch07-b03
          speaker: ali_baba
          text: Open, Sesame!
        - id: ch07-b04
          speaker: narrator
          text: The door opened, and Ali Baba went inside. Nothing in the cave had been disturbed since the captain's last visit. That convinced him that the two missing robbers would never return. He took as much gold as he could carry, closed the hidden door, and went home to town.
        - id: ch07-b05
          speaker: narrator
          text: He told his son where the hidden cave stood and taught him the words that opened and closed its door. In time, his son passed the secret down to his own children. So Ali Baba's children and grandchildren remained rich for the rest of their lives.
