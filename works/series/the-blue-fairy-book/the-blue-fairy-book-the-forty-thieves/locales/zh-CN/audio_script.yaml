audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 沉稳而富有童话色彩, timbre: 温暖清澈, pace: 舒缓有变化, pitch: 中音}
    ali_baba:
      display_name: 阿里巴巴
      tts: {delivery: 朴实厚道，遇事谨慎, timbre: 温和成熟, pace: 中等, pitch: 中低音}
    ali_babas_wife:
      display_name: 阿里巴巴的妻子
      tts: {delivery: 直率好奇，喜怒分明, timbre: 温暖成熟, pace: 中等稍快, pitch: 中音}
    cassim:
      display_name: 卡西姆
      tts: {delivery: 贪婪急躁，语气强硬, timbre: 厚重成熟, pace: 稍快, pitch: 中低音}
    cassims_wife:
      display_name: 卡西姆的妻子
      tts: {delivery: 精明好奇，情绪外露, timbre: 清亮成熟, pace: 中等稍快, pitch: 中音}
    morgiana:
      display_name: 莫吉安娜
      tts: {delivery: 机敏果断，危急时格外镇定, timbre: 清澈坚实, pace: 中等有变化, pitch: 中音}
    captain:
      display_name: 强盗首领
      tts: {delivery: 威严阴沉，善于伪装, timbre: 深沉有力, pace: 稍慢, pitch: 低音}
    thief:
      display_name: 强盗
      tts: {delivery: 狡猾警觉，压低声音, timbre: 粗粝成熟, pace: 中等, pitch: 中低音}
    baba_mustapha:
      display_name: 巴巴·穆斯塔法
      tts: {delivery: 老练健谈，略带自得, timbre: 苍老清晰, pace: 稍慢, pitch: 中高音}
    abdallah:
      display_name: 阿卜杜拉
      tts: {delivery: 朴实随和, timbre: 清朗年轻, pace: 中等, pitch: 中音}
    ali_babas_son:
      display_name: 阿里巴巴的儿子
      tts: {delivery: 年轻诚恳，反应直接, timbre: 清朗年轻, pace: 中等, pitch: 中音}
  chapters:
    - id: ch01
      title: 石门后的宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 波斯的一座城里住着兄弟二人。哥哥卡西姆娶了有钱的妻子，生活富足。弟弟阿里巴巴却要去附近的森林砍柴，进城卖掉，才能养活妻儿。一天，他在林中看见一队骑马的人卷着尘土而来，疑心遇上了强盗，赶紧爬到树上躲藏。
        - id: ch01-b02
          speaker: narrator
          text: 来人一共四十个。他们下马，卸下马辔，把马一匹匹拴到树上。其中最威风的那个人离开众人，走进不远处的灌木丛。阿里巴巴看他的气派，猜他就是这伙人的首领。树上离得不远，所以首领喊出的每个字，他都听得清清楚楚。
        - id: ch01-b03
          speaker: captain
          text: 芝麻，开门！
        - id: ch01-b04
          speaker: narrator
          text: 岩石上立刻开了一扇门。首领站在旁边，让众人依次进去，自己最后才踏进洞穴，石门随即自行关上。阿里巴巴不知道他们会待多久，更怕自己一下树，他们恰好出来把他抓住，只能一动不动地耐心等候。过了许久，石门终于再次开启。首领进去时走在最后，出来时却走在最前。他守在门边，亲眼看着四十大盗一个不少地从身旁经过，接着才喊出口令。
        - id: ch01-b05
          speaker: captain
          text: 芝麻，关门！
        - id: ch01-b06
          speaker: narrator
          text: 石门合拢。每个强盗都重新给马套上辔头，翻身上马。首领来到队伍最前面，众人便像来时一样卷着尘土飞驰而去。阿里巴巴等他们走远，才爬下树，来到灌木后的岩石前，也试着喊了一声“芝麻，开门”。门果然一下敞开了。他原以为里面会是个又暗又冷的石洞，谁知眼前竟是一座人工凿出的宽阔洞窟，拱顶高高隆起，光从顶上的洞口落下来。地上堆满成捆的贵重货物，有丝绸，也有锦缎。金银垒成一堆又一堆，皮袋里同样装满了钱。
        - id: ch01-b07
          speaker: narrator
          text: 阿里巴巴刚走进去，门便在身后关上了。他面对这么多财宝，并没有贪得忘了分寸，也连银子看都不看，只挑装着黄金的钱袋。他一边搬，一边估量外面那几头正在吃草的驴能驮多少，拿到足够的数量便停了手。他把金袋装上驴背，又用一捆捆柴枝严严实实地盖住，不让路人看见。最后，他喊出“芝麻，关门”，确认石门合拢，这才赶着驴回家。这里说的芝麻，就是一种谷物。
        - id: ch01-b08
          speaker: narrator
          text: 回家后，他关好院门，把钱袋搬到妻子面前，倒出满地黄金。他嘱咐妻子守住秘密，自己准备挖坑藏金子。妻子却想先知道这些黄金有多少。
        - id: ch01-b09
          speaker: ali_babas_wife
          text: 你去挖坑吧，我先向别人借个量斗，把这些金子量一量。
        - id: ch01-b10
          speaker: narrator
          text: 她跑到卡西姆家向嫂子借斗。嫂子明明知道阿里巴巴家里穷得很，怎么也想不通弟媳会有什么谷物可量。为了探个究竟，她暗暗在斗底抹了一点油脂。阿里巴巴的妻子把斗放在金堆上，一斗一斗地装满又倒空。她越量越高兴，完事后立刻把斗还了回去，却没留意底下粘着一枚金币。她刚一转身，卡西姆的妻子便看见了那枚金币。嫂子心里的疑团更大了，只等丈夫回来，便把这件怪事告诉他。
        - id: ch01-b11
          speaker: cassims_wife
          text: 卡西姆，你弟弟比你还有钱。他的钱根本不用数，而是拿斗来量。
        - id: ch01-b12
          speaker: narrator
          text: 她拿出金币，解释了事情的来龙去脉。卡西姆嫉妒得整夜睡不着，天还没亮便去质问弟弟。
        - id: ch01-b13
          speaker: cassim
          text: 阿里巴巴，你装得那么穷，背地里却用斗量金子。
        - id: ch01-b14
          speaker: narrator
          text: 阿里巴巴知道秘密已经泄露，只好坦白一切，还答应分给哥哥一份。
        - id: ch01-b15
          speaker: cassim
          text: 分我一份是应该的。可你必须告诉我宝藏在哪里，不然我就把秘密说出去，到时你什么也留不住。
        - id: ch01-b16
          speaker: narrator
          text: 阿里巴巴把洞穴的位置和开关石门的口令全告诉了他，更多是出于兄弟情分，并非真的害怕威胁。卡西姆却只想抢在弟弟前面，把宝藏尽可能据为己有。第二天一早，他牵着十头骡子出发，每头骡子都驮着一只大箱子。他很快找到石门，用“芝麻，开门”进入洞穴。满眼财宝叫他怎么看也看不够，可他顾不得慢慢欣赏，只管匆忙往箱里搜罗。等到箱子装满，准备离开时，他满脑子只想着自己从此有多么富有，竟把最要紧的口令忘了。
        - id: ch01-b17
          speaker: cassim
          text: 大麦，开门！
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: 石门一动不动。他把各种谷物喊了个遍，偏偏想不起芝麻。越是害怕，那两个字越像从未听过一样。
    - id: ch02
      title: 卡西姆之死
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 中午，强盗们回来，看见几头驮着大箱子的骡子四处游荡，立刻拔出弯刀。首领打开石门。卡西姆听见马蹄声，决定拼死冲出去。他撞倒了首领，却很快死在众强盗刀下。强盗进入洞穴，看见已经收好的钱袋，不明白外人怎样得知秘密。他们把卡西姆的尸体分成四块，钉在洞里吓唬后来者，又出去寻找财宝。
        - id: ch02-b02
          speaker: narrator
          text: 入夜后，卡西姆的妻子越来越不安，急忙去找阿里巴巴，把丈夫的去向告诉了他。阿里巴巴尽力安慰嫂子，随即赶往森林。一进洞穴，他首先看见的便是哥哥被分成四块的尸体，不由得惊恐万分。他把尸块装到一头驴背上，又让另外两头驴驮上金袋，再用柴枝把所有东西遮得严严实实，这才赶回城里。两头驮黄金的驴被牵进自家院子，另一头则送到卡西姆家。为他开门的是女奴莫吉安娜，阿里巴巴知道她不仅勇敢，而且十分机灵。
        - id: ch02-b03
          speaker: ali_baba
          text: 这是你主人的尸体。他被人杀害了，可我们得让别人相信，他是在床上病死的。稍后我再同你商量。现在先告诉你女主人，说我来了。
        - id: ch02-b04
          speaker: narrator
          text: 卡西姆的妻子得知噩耗，放声痛哭。阿里巴巴答应让她搬来与自己一家同住，只要她守住秘密，把一切交给莫吉安娜安排。她含泪答应了。
        - id: ch02-b05
          speaker: narrator
          text: 莫吉安娜先去药铺买药片，对药剂师说主人吃不下饭，也说不出话，没人知道他得了什么病。第二天，她又哭着去讨只有垂死之人才用的药水。到了晚上，邻里听见她和女主人为卡西姆的死凄厉号哭，自然没有怀疑。
        - id: ch02-b06
          speaker: narrator
          text: 次日清早，莫吉安娜来到城门边。那里的老鞋匠巴巴·穆斯塔法每天开摊很早。她把一枚金币放进老人手里，请他带上针线跟自己走。上路前，她用手帕蒙住他的双眼，一路把他领进停放尸体的房间，进门后才解开手帕，让老人把四块尸体重新缝在一起。做完以后，她又蒙上他的眼睛，照原路将他送回摊子。就这样，卡西姆像普通死者一样得以安葬。送葬时，莫吉安娜跟在棺木后一路哭泣，还不停撕扯头发。女主人则留在家中发出悲痛的哀号，谁也没有看出破绽。第二天，卡西姆的妻子搬进阿里巴巴家，他的店铺则交给阿里巴巴的长子经营。
        - id: ch02-b07
          speaker: narrator
          text: 强盗们回到洞穴，发现卡西姆的尸体不见了，一些钱袋也被人取走，不由得大为震惊。首领断定他们的秘密已经暴露。除了死去的卡西姆，必定还有一人知道怎样进入洞穴。如果找不到那个人，所有强盗迟早都要完蛋。他命令一个既大胆又机警的手下装成旅客进城，查清死者身份，再打听城里有没有人议论他离奇的死法。派去的人若失败，就得以死谢罪，免得他把强盗的行踪泄露出去。一个强盗马上站出来，自告奋勇。众人称赞过他的勇气，他便乔装进城，天刚亮时恰好遇见正在摆摊的老鞋匠。
        - id: ch02-b08
          speaker: thief
          text: 老实人，您年纪这么大，怎么还看得清针脚？
        - id: ch02-b09
          speaker: baba_mustapha
          text: 我虽然老，眼睛却好得很。告诉你吧，我还曾在一个比这里暗得多的房间里，把一具尸体缝起来呢。
        - id: ch02-b10
          speaker: narrator
          text: 强盗听见这话，简直喜出望外。他先给老人一枚金币，请他指出缝尸体的房屋。穆斯塔法说自己当时蒙着眼睛，根本不认得路。强盗又拿出一枚金币，老人这才想到，如果像上次一样蒙住眼睛，自己也许还能记得一路转过哪些弯。这个办法果然奏效。强盗一会儿牵着他走，一会儿又跟着他的指点转弯，最后正好停在卡西姆家门前。强盗用白粉笔画下记号，满意地告别老人，回森林报信。过了一会儿，莫吉安娜出门看见那道白印，立刻猜到有人图谋不轨。她取来粉笔，在这所房子左右各有两三户人家的门上都画下同样的记号，却没有告诉主人或女主人。
    - id: ch03
      title: 三十八只油坛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 首领跟着手下来认门，却看见五六扇门都有相同的白印。向导无言以对，回去便因失败被砍了头。第二个强盗用红粉笔再试一次，莫吉安娜照样在邻居门上复制记号，他也丢了性命。首领只好亲自进城。他不用粉笔，只把房屋的模样牢牢记住。
        - id: ch03-b02
          speaker: narrator
          text: 首领命手下去附近村庄买来十九头骡子和三十八只皮坛。一个坛里装满油，另外三十七只都是空的。首领让每个带着兵器的强盗钻进一只空坛，又从那坛真油里舀油，把所有坛子的外面都涂过一遍。这样，谁从外面也看不出区别。十九头骡子驮着三十七名藏在坛中的强盗和一整坛油，在黄昏时来到城中。首领把骡队停在阿里巴巴门前。阿里巴巴正在外面乘凉，首领便装成远道而来的油商，请求借宿。
        - id: ch03-b03
          speaker: captain
          text: 我从远方运油来，打算明天拿到市场上卖。天已经这么晚，我找不到住处。您能不能收留我一夜？
        - id: ch03-b04
          speaker: narrator
          text: 阿里巴巴见过强盗首领，却没认出他的伪装。他把人请进家门，又让莫吉安娜准备晚饭和床铺。饭后，首领借口照看骡子，来到院里，从第一只坛子走到最后一只，逐个吩咐手下。
        - id: ch03-b05
          speaker: captain
          text: 等我从客房窗户扔下石子，你们马上用刀割开坛子出来。我随后就到。
        - id: ch03-b06
          speaker: narrator
          text: 首领回房以后，莫吉安娜叫阿卜杜拉架锅给主人熬汤。这时油灯灭了，家里的油也恰好用完。
        - id: ch03-b07
          speaker: abdallah
          text: 别担心，院里不是有许多油坛吗？去舀一点就行了。
        - id: ch03-b08
          speaker: narrator
          text: 莫吉安娜拿着油壶走到第一只坛子旁，里面忽然传来压低的问话。
        - id: ch03-b09
          speaker: thief
          text: 时候到了吗？
        - id: ch03-b10
          speaker: narrator
          text: 换作别人，早就惊叫起来。莫吉安娜却知道主人有危险，立刻稳住声音。
        - id: ch03-b11
          speaker: morgiana
          text: 还没有，快了。
          emotion: calm
        - id: ch03-b12
          speaker: narrator
          text: 她继续走向下一只坛子，里面也传来同样的问题。莫吉安娜一路用同样的话回答，直到最后一坛才找到真正的油。这样一来，她已经完全明白了。主人以为自己收留了一个油商，其实竟把三十八个强盗放进家门，其中三十七个就藏在这些坛子里。她先装满油壶，回厨房点亮灯，随后又来到院里，从真油坛中盛出满满一大锅油。等油烧得滚烫，她把足以使人窒息而死的热油倒进每一只藏人的坛子。完成这件勇敢的事后，她回到厨房，熄灭炉火和油灯，静静等着看接下来会发生什么。
        - id: ch03-b13
          speaker: narrator
          text: 一刻钟后，首领醒来，从窗户扔下石子。院里没有一个手下回应。他走到第一只坛子旁，低声询问。
        - id: ch03-b14
          speaker: captain
          text: 你睡着了吗？
        - id: ch03-b15
          speaker: narrator
          text: 话刚出口，他便闻到坛里热油的气味，立刻明白，谋杀阿里巴巴和他全家的计划已经败露。首领又查看其他坛子，发现所有同伙都死了。他再走到最后一坛，看见里面的油少了，顿时明白手下是怎样送命的。眼下只剩逃跑这一条路。他撬坏一扇通往花园的门锁，从那里出去，又接连翻过几道墙，独自逃走。莫吉安娜把这些动静全听在耳里，也亲眼看着首领离开。她知道自己的计策成功了，这才回房安心睡下。
        - id: ch03-b16
          speaker: narrator
          text: 天亮后，阿里巴巴见油坛仍在院中，奇怪油商为何没有离开。莫吉安娜叫他看看第一坛里有没有油。他发现里面是个死人，吓得连忙后退。
        - id: ch03-b17
          speaker: morgiana
          text: 不用怕，他已经死了，伤不了您。
          emotion: calm
        - id: ch03-b18
          speaker: narrator
          text: 阿里巴巴回过神，问油商去了哪里。
        - id: ch03-b19
          speaker: morgiana
          text: 油商？他是油商，我便也是油商了！
        - id: ch03-b20
          speaker: narrator
          text: 莫吉安娜把昨夜的事情从头到尾说了一遍。她告诉阿里巴巴，这正是森林里的强盗设下的杀人毒计。最初两名进城做记号的强盗已经不在，如今三十七人死在坛里，首领逃走，所以四十大盗只剩三人。她还解释说，先前门上的白色和红色粉笔记号，必定也和他们有关。阿里巴巴这才明白自己逃过了怎样一场灾难，当场还莫吉安娜自由，说自己欠她一条命。随后，他们把所有尸体埋进阿里巴巴家的花园，又让奴仆把十九头骡子牵去市场卖掉。
    - id: ch04
      title: 不吃盐的商人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 首领独自回到空荡荡的洞穴。从前这里挤满了同伴，如今只剩他一人，熟悉的洞穴也显得分外可怕。他下定决心，一定要亲手杀死阿里巴巴，为死去的手下报仇。首领精心改换装束，进城住进一家客栈。接下来，他一次又一次往返森林，把洞里的贵重绸缎和上好亚麻布运进城中。货物备齐后，他在阿里巴巴长子的店铺对面开了一家商铺，自称科吉亚·哈桑。
        - id: ch04-b02
          speaker: narrator
          text: 这位新商人衣着体面，待人又彬彬有礼，很快便与对面店里的年轻人成了朋友。通过阿里巴巴的儿子，他也结识了阿里巴巴，还一次又一次请阿里巴巴到自己那里吃晚饭。阿里巴巴想回报他的盛情，便把他邀到家中，满面笑容地接待，还特意感谢他一直善待自己的儿子。眼看天色已晚，客人却忽然准备告辞。阿里巴巴觉得奇怪，赶紧把他留住。
        - id: ch04-b03
          speaker: ali_baba
          text: 先生，何必急着走？留下来同我吃晚饭吧。
        - id: ch04-b04
          speaker: narrator
          text: 商人推辞，说自己有不得已的缘故。阿里巴巴问他究竟是什么。
        - id: ch04-b05
          speaker: captain
          text: 先生，我不能吃任何放了盐的东西。
        - id: ch04-b06
          speaker: ali_baba
          text: 原来只是这样。今晚的肉和面包都不放盐，你尽管留下。
        - id: ch04-b07
          speaker: narrator
          text: 阿里巴巴把吩咐告诉莫吉安娜，她十分奇怪。
        - id: ch04-b08
          speaker: morgiana
          text: 吃肉却不沾盐，这究竟是什么人？
        - id: ch04-b09
          speaker: ali_baba
          text: 他是个正派人。莫吉安娜，照我的话准备吧。
        - id: ch04-b10
          speaker: narrator
          text: 莫吉安娜很想亲眼看看这个怪人，便帮阿卜杜拉端菜。只一眼，她就认出科吉亚·哈桑正是强盗首领，也看见他衣袍下面藏着匕首。她明白他不肯与主人同吃盐，正因为打算杀死主人。莫吉安娜暗下决心，一定要阻止他。
        - id: ch04-b11
          speaker: narrator
          text: 她让阿卜杜拉送上晚餐，自己去准备一件极其大胆的事。甜点上桌后，厅里只剩首领、阿里巴巴和他的儿子。首领想先把父子灌醉，再杀掉他们。莫吉安娜换上舞女的头饰，腰间系着银柄匕首，叫阿卜杜拉拿起手鼓，一同去为主人和客人助兴。
        - id: ch04-b12
          speaker: narrator
          text: 阿卜杜拉一路敲鼓。到了门口，他停下，莫吉安娜屈膝行礼。
        - id: ch04-b13
          speaker: ali_baba
          text: 进来吧，莫吉安娜，让科吉亚·哈桑看看你的本领。她是我的女奴，也替我料理家务。
        - id: ch04-b14
          speaker: narrator
          text: 首领担心今晚行刺的机会就此溜走，心里一点也不高兴，表面上却装得兴致勃勃，好像十分期待她的表演。阿卜杜拉重新敲响手鼓，莫吉安娜随之起舞。她一连跳过几支舞，忽然抽出腰间的匕首，做出各种刺击的姿势。一会儿把刀尖对准自己胸口，一会儿又转向主人，让人以为这些动作全是舞蹈的一部分。莫吉安娜越跳越快，渐渐气喘吁吁。她突然用左手从阿卜杜拉手里夺过手鼓，右手依旧握着匕首，再把鼓伸到主人面前。阿里巴巴和儿子各放进一枚金币。首领看她向自己走来，也拿出钱袋，准备给她赏钱。就在他把手伸进钱袋的一刹那，莫吉安娜猛地将匕首刺进了他的心脏。
        - id: ch04-b15
          speakers: [ali_baba, ali_babas_son]
          ensemble: duo
          text: 不幸的姑娘！你做了什么？你会害死我们的！
          emotion: fearful
        - id: ch04-b16
          speaker: morgiana
          text: 主人，我不是要害你们，是在救你们。看看他衣服下面藏的匕首，再想想他为什么不肯与你同吃盐。还要什么证据呢？他就是那个假油商，也是四十大盗的首领。
    - id: ch05
      title: 芝麻再次开门
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 莫吉安娜揭开了仇人的身份，也再次救了阿里巴巴的性命。阿里巴巴对她感激不尽，便请她嫁给自己的儿子。儿子听到这个安排，立刻欣然同意。几天以后，两人的婚礼如期举行，办得无比隆重。
        - id: ch05-b02
          speaker: narrator
          text: 一年过去了，剩下的两个强盗始终没有任何消息。阿里巴巴由此判断，他们大概也已经死去，于是再次动身前往那座洞穴。他站在岩石前喊出“芝麻，开门”，石门果然应声而开。阿里巴巴走进去仔细察看，发现自从首领离开以后，这里再也没有人来过。他带走自己所能搬动的黄金，平安返回城中。后来，他把洞穴的位置和开门的秘密告诉儿子，儿子又把秘密传给自己的下一代。就这样，阿里巴巴的儿孙乃至更后面的子孙，一生都享有富足。这个故事出自《一千零一夜》。
